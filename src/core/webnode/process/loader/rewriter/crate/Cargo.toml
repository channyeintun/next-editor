# webnode-rewriter: the loader's rewrite of a large ES module's `import` and
# `export` statements, compiled to WebAssembly. See ../README.md.
#
# Standalone crate (empty [workspace] so no ancestor workspace absorbs it).
# Its dependencies are the oxc parser and its scope analysis; building it
# needs the network once, to fetch them.
[package]
name = "webnode-rewriter"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# cdylib so wasm-ld emits a WebAssembly module; rlib so `cargo test` links the
# tests natively.
crate-type = ["cdylib", "rlib"]
name = "webnode_rewriter"

[dependencies]
oxc_allocator = "=0.159.0"
oxc_ast = "=0.159.0"
oxc_parser = "=0.159.0"
oxc_semantic = "=0.159.0"
oxc_span = "=0.159.0"
oxc_syntax = "=0.159.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
