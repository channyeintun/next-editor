scenes:
  - id: recall
    chapter: Goroutine နဲ့ တစ်ပြိုင်နက် လုပ်တာ
    narration: >-
      ပြီးခဲ့တဲ့ lesson မှာ Time နဲ့ Duration ကို သုံးပြီး ညကား ရောက်မယ့် အချိန်ကို တွက်ခဲ့ပါတယ်။
      ဒီနေ့တော့ ကြာချိန်တွေကို သုံးပြီး အလုပ် အများကို တစ်ပြိုင်နက် လုပ်တာကို လေ့လာပါမယ်။ ရန်ကုန်
      မြို့ထဲမှာ ပို့ရမယ့် ပါဆယ် သုံးထုပ် ရှိပြီး၊ rider သုံးယောက်က တစ်ယောက် တစ်ထုပ်စီ ပို့ကြမယ်
      ဆိုပါစို့။ [[mark:sel-job]] main ဖိုင်ထဲက ဒီ struct က ပို့ရမယ့် အလုပ် တစ်ခုပါ။ ဘယ် rider စီးမလဲ
      ဆိုတာနဲ့ ခရီး ဘယ်လောက် ကြာမလဲ ဆိုတဲ့ Duration ပါပါတယ်။ [[mark:sel-deliver]] ဒီ function က ပါဆယ်
      တစ်ထုပ် ပို့တာပါ။ Sleep က ပေးထားတဲ့ ကြာချိန် ပြည့်တဲ့အထိ function ကို ရှေ့ မဆက်ဘဲ ရပ်ထားခိုင်းတာ
      ဖြစ်ပြီး၊ ဒါကို ဆိုင်ကယ် စီးတဲ့ အချိန်လို့ ယူဆပါမယ်။ ကြာချိန် ပြည့်ရင် ကြာချိန်နဲ့ rider နာမည်ကို
      print ထုတ်ပြီး ပါဆယ် ရောက်ကြောင်း ပြောပါတယ်။ [[mark:sel-jobs]] အလုပ် သုံးခုကတော့ rider လှလှ က
      မီလီစက္ကန့် သုံးရာ၊ rider အောင်အောင် က တစ်ရာ၊ rider မောင်မောင် က နှစ်ရာ ကြာပါတယ်။ တကယ့် ခရီးက
      မိနစ်တွေ ကြာပေမဲ့၊ ဒီမှာတော့ မီလီစက္ကန့် တစ်ရာကို ခရီး တိုတို တစ်ခုလို့ သဘောထားပါမယ်။
      [[mark:sel-since]] loop မစခင် စတဲ့ အချိန်ကို မှတ်ထားပြီး၊ အဆုံးမှာ စကတည်းက ဘယ်လောက် ကြာပြီလဲ
      ဆိုတာကို မီလီစက္ကန့် တစ်ရာ အနီးဆုံးအထိ ညှိပြီး print ထုတ်ပါတယ်။ အခု loop က rider တွေကို
      တစ်ယောက်ပြီးမှ တစ်ယောက် ပို့ခိုင်းပါတယ်။ [[mark:run-1]] ကဲ၊ run လိုက်ရအောင်။
    sources:
      - { title: "time package — Sleep", url: "https://pkg.go.dev/time#Sleep" }
      - { title: "time package — Since", url: "https://pkg.go.dev/time#Since" }
      - { title: "time package — Duration.Round", url: "https://pkg.go.dev/time#Duration.Round" }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }
      - id: sel-job
        type: editor.select
        at: { mark: sel-job }
        target:
          {
            file: main.go,
            text: "type job struct {\n\trider string\n\td     time.Duration\n}",
            occurrence: 1,
          }
      - id: sel-deliver
        type: editor.select
        at: { mark: sel-deliver }
        target: { file: main.go, text: "time.Sleep(d)", occurrence: 1 }
      - id: sel-jobs
        type: editor.select
        at: { mark: sel-jobs }
        target:
          {
            file: main.go,
            text: "\t\t{\"လှလှ\", 300 * time.Millisecond},\n\t\t{\"အောင်အောင်\", 100 * time.Millisecond},\n\t\t{\"မောင်မောင်\", 200 * time.Millisecond},\n",
            occurrence: 1,
          }
      - id: sel-since
        type: editor.select
        at: { mark: sel-since }
        target:
          { file: main.go, text: "time.Since(start).Round(100*time.Millisecond)", occurrence: 1 }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "600ms ကြာ",
          timeoutMs: 8000,
        }

  - id: read-1
    narration: >-
      [[mark:point-first]] ပထမ စာကြောင်းမှာ လှလှ က မီလီစက္ကန့် သုံးရာ ကြာပြီး ရောက်ပါတယ်။ ပြီးမှ
      အောင်အောင် နဲ့ မောင်မောင် ဆက်ရောက်ပြီး၊ slice ထဲက အစဉ်အတိုင်းပဲ ထွက်လာပါတယ်။
      [[mark:point-600]] နောက်ဆုံး စာကြောင်းကတော့ စုစုပေါင်း မီလီစက္ကန့် ခြောက်ရာ ကြာတယ် ဆိုတာပါ။
      [[mark:board-seq]] ဘာကြောင့်လဲဆိုတော့ function ကို ပုံမှန်အတိုင်း ခေါ်ရင်၊ အဲဒီ function ပြီးတဲ့အထိ
      ခေါ်တဲ့ နေရာက ရှေ့ မဆက်လို့ပါ။ [[mark:draw-seq]] ဆိုလိုတာက rider တစ်ယောက်တည်းက ခရီး သုံးခုကို
      ဆက်တိုက် သွားသလိုပါပဲ။ သုံးရာ၊ တစ်ရာ၊ နှစ်ရာ ကို ပေါင်းတော့ ခြောက်ရာ ဖြစ်ပါတယ်။ rider
      သုံးယောက် ရှိပေမဲ့ တစ်ယောက် သွားတုန်း ကျန်တဲ့ နှစ်ယောက်က ဘာမှ မလုပ်ဘဲ ထိုင်ရတာပါ။
    sources:
      - {
          title: "The Go Programming Language Specification — Calls",
          url: "https://go.dev/ref/spec#Calls",
        }
    actions:
      - {
          id: point-first,
          type: console.point,
          at: { mark: point-first },
          target: { text: "300ms လှလှ" },
        }
      - {
          id: point-600,
          type: console.point,
          at: { mark: point-600 },
          target: { text: "600ms ကြာ" },
        }
      - { id: collapse-1, type: runtime.collapseDock, at: { mark: board-seq } }
      - {
          id: board-seq,
          type: whiteboard.apply,
          at: { afterAction: collapse-1 },
          open: true,
          clear: true,
          upsertIds: [s-title],
        }
      - {
          id: draw-seq,
          type: whiteboard.apply,
          at: { mark: draw-seq },
          upsertIds: [s-seq-label, s-b1, s-b1t, s-b2, s-b2t, s-b3, s-b3t, s-seq-total, s-seq-line],
          drawMs: 3000,
        }

  - id: go
    chapter: go ဆိုတဲ့ keyword
    narration: >-
      [[mark:close-seq]] ဒါဆို rider သုံးယောက်ကို တစ်ပြိုင်နက် ထွက်ခိုင်းကြည့်ရအောင်။ Go မှာ တခြား
      အလုပ်တွေနဲ့ တစ်ပြိုင်နက် run နေတဲ့ function ကို goroutine လို့ ခေါ်ပါတယ်။ rider တစ်ယောက်ကို
      ဆိုင်ကယ် တစ်စီးနဲ့ လမ်းပေါ် လွှတ်လိုက်သလိုပါပဲ။ [[mark:type-go]] function ခေါ်တဲ့ နေရာရဲ့ ရှေ့မှာ
      go ဆိုတဲ့ keyword ကို ထည့်ပါမယ်။ [[mark:sel-go]] ဒီ keyword က function ကို goroutine အသစ်
      တစ်ခုနဲ့ စပေးပြီး၊ ပြီးတဲ့အထိ မစောင့်ဘဲ နောက် line ကို ချက်ချင်း ဆက်သွားပါတယ်။ ဒါကြောင့် loop က
      rider သုံးယောက်ကို ချက်ချင်း လွှတ်လိုက်မှာပါ။ ဒါဆို စုစုပေါင်း ကြာချိန် လျော့သွားမလား၊
      ကြည့်ရအောင်။ [[mark:run-2]] ကဲ၊ run လိုက်ရအောင်။
    sources:
      - {
          title: "The Go Programming Language Specification — Go statements",
          url: "https://go.dev/ref/spec#Go_statements",
        }
    actions:
      - {
          id: close-seq,
          type: whiteboard.apply,
          at: { mark: close-seq },
          open: false,
          upsertIds: [],
        }
      - id: type-go
        type: editor.type
        at: { mark: type-go }
        target: { file: main.go, after: "for _, j := range jobs {\n\t\t", occurrence: 1 }
        text: "go "
      - id: sel-go
        type: editor.select
        at: { mark: sel-go }
        target: { file: main.go, text: "go deliver(j.rider, j.d)", occurrence: 1 }
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "0s ကြာ",
          timeoutMs: 8000,
        }

  - id: read-2
    narration: >-
      [[mark:point-zero]] output မှာ သုည စက္ကန့် ကြာတယ် ဆိုတဲ့ စာကြောင်း တစ်ကြောင်းတည်းပဲ ထွက်လာပါတယ်။
      ဘယ် rider ရောက်ကြောင်းမှ မပါပါဘူး။ compile error လည်း မဟုတ်၊ panic လည်း မဟုတ်ဘဲ program က
      ပုံမှန် ပြီးသွားပေမဲ့၊ ကိုယ် လိုချင်တဲ့ အဖြေ မဟုတ်ပါဘူး။ ဒီလို ဘာ သတိပေးချက်မှ မပါဘဲ အဖြေ လွဲနေတာကလည်း bug ပါပဲ။ [[mark:board-main]] ဘာကြောင့်လဲဆိုတော့
      main function ပြီးသွားတာနဲ့ program တစ်ခုလုံး ပြီးသွားလို့ပါ။ [[mark:draw-main]] main က rider
      သုံးယောက်ကို လွှတ်ပြီးတာနဲ့ ကြာချိန်ကို ချက်ချင်း print ထုတ်ပြီး ပြီးသွားပါတယ်။ အဲဒီ အချိန်မှာ
      ဘယ်သူမှ မရောက်သေးလို့ သုည စက္ကန့်ပါ။ [[mark:draw-riders]] rider တွေ လမ်းပေါ်မှာ ရှိတုန်း ပါဆယ် ရုံးက
      တံခါး ပိတ်ပြီး အိမ်ပြန်သွားသလိုပါပဲ။ main ပြီးတဲ့အခါ Go က ကျန်တဲ့ goroutine တွေကို မစောင့်ဘဲ၊
      program ကို ချက်ချင်း ရပ်လိုက်ပါတယ်။
    sources:
      - {
          title: "The Go Programming Language Specification — Program execution",
          url: "https://go.dev/ref/spec#Program_execution",
        }
    actions:
      - {
          id: point-zero,
          type: console.point,
          at: { mark: point-zero },
          target: { text: "0s ကြာ" },
        }
      - { id: collapse-2, type: runtime.collapseDock, at: { mark: board-main } }
      - {
          id: board-main,
          type: whiteboard.apply,
          at: { afterAction: collapse-2 },
          open: true,
          clear: true,
          upsertIds: [m-title],
        }
      - {
          id: draw-main,
          type: whiteboard.apply,
          at: { mark: draw-main },
          upsertIds: [m-main-box, m-main, m-riders-box, m-r1, m-r2, m-r3],
          drawMs: 2400,
        }
      - {
          id: draw-riders,
          type: whiteboard.apply,
          at: { mark: draw-riders },
          upsertIds: [m-strike, m-note, m-note-line],
          drawMs: 2000,
        }

  - id: waitgroup
    chapter: Wait group
    narration: >-
      [[mark:board-wait]] ဒါကြောင့် main ကို rider အားလုံး ပြန်ရောက်တဲ့အထိ ရပ်ထားပေးမယ့် နည်း လိုပါတယ်။
      အဲဒါကို wait group လို့ ခေါ်ပါတယ်။ rider အားလုံး ပြန်မရောက်မချင်း ရုံး မပိတ်ဘူး ဆိုတဲ့ စည်းကမ်း
      တစ်ခုလိုပါပဲ။ [[mark:draw-wg]] wait group ကို var နဲ့ ကြေညာရုံနဲ့ သူ့ zero value က စာရင်း အလွတ်
      ဖြစ်ပြီး၊ ချက်ချင်း သုံးလို့ ရပါတယ်။ သူ့ရဲ့ Go ဆိုတဲ့ method က function ကို goroutine အသစ်နဲ့
      စပေးပြီး စာရင်းထဲ တစ်ခု ထည့်ပါတယ်။ အဲဒီ function ပြီးတဲ့အခါမှာတော့ စာရင်းထဲက ပြန်ထုတ်ပေးပါတယ်။ Wait
      ကတော့ စာရင်း ကုန်သွားတဲ့အထိ ခေါ်တဲ့ နေရာမှာ ရပ်ထားပါတယ်။ [[mark:draw-old]] ဒီ Go method က Go
      ရဲ့ နောက်ပိုင်း version တွေမှ ပါလာတာ ဖြစ်လို့၊ အရင် code တွေမှာတော့ board အောက်ပိုင်းက ပုံစံကို
      တွေ့ရပါမယ်။ goroutine မစခင် စာရင်းထဲ တစ်ခု ကိုယ်တိုင် ထည့်ပြီး၊ goroutine ထဲမှာ ပြီးကြောင်း
      ကိုယ်တိုင် မှတ်ပေးရတာပါ။ အလုပ် အတူတူပဲ ဖြစ်ပေမဲ့ ဒီ course မှာတော့ Go method ကိုပဲ သုံးပါမယ်။
    sources:
      - { title: "sync package — WaitGroup", url: "https://pkg.go.dev/sync#WaitGroup" }
      - { title: "sync package — WaitGroup.Go", url: "https://pkg.go.dev/sync#WaitGroup.Go" }
      - { title: "Go 1.25 Release Notes", url: "https://go.dev/doc/go1.25" }
    actions:
      - {
          id: board-wait,
          type: whiteboard.apply,
          at: { mark: board-wait },
          open: true,
          clear: true,
          upsertIds: [w-title],
        }
      - {
          id: draw-wg,
          type: whiteboard.apply,
          at: { mark: draw-wg },
          upsertIds: [w-box, w-l1, w-l1n, w-l2, w-l2n, w-l3, w-l3n],
          drawMs: 3000,
        }
      - {
          id: draw-old,
          type: whiteboard.apply,
          at: { mark: draw-old },
          upsertIds: [w-old-box, w-old-label, w-old1, w-old2],
          drawMs: 2400,
        }

  - id: type-wg
    narration: >-
      [[mark:close-wait]] ကဲ၊ code ထဲမှာ ထည့်ကြည့်ရအောင်။ [[mark:type-sync]] wait group က sync ဆိုတဲ့
      package ထဲမှာ ရှိလို့ import ထဲမှာ ထည့်ပါမယ်။ [[mark:type-var]] စတဲ့ အချိန်ရဲ့ အောက်မှာ wait group
      တစ်ခု ကြေညာပါမယ်။ [[mark:type-comment]] ခုနက go ပါတဲ့ line ကိုတော့ ဖျက်မပစ်ဘဲ comment
      လုပ်ထားခဲ့ပါမယ်။ ရှေ့မှာ comment သင်္ကေတ ထည့်လိုက်ရင် Go က အဲဒီ line ကို မဖတ်တော့ပေမဲ့၊ ခုနက
      ပုံစံနဲ့ နှိုင်းယှဉ်ကြည့်လို့ ရပါတယ်။ [[mark:type-wggo]] သူ့ အောက်မှာ wait group ကနေ goroutine စတဲ့
      line ကို ရေးပါမယ်။ [[mark:sel-closure]] ဒီ အပိုင်းက closure lesson မှာ တွေ့ခဲ့တဲ့ နာမည်မရှိတဲ့
      function ပါ။ အထဲမှာ ခုနက function ကိုပဲ ခေါ်ထားပြီး၊ loop ရဲ့ j ကို မှတ်ထားပါတယ်။ Go ရဲ့ နောက်ပိုင်း
      version တွေမှာ loop ရဲ့ အခေါက်တိုင်းက ကိုယ်ပိုင် j တစ်ခုစီ ရလို့၊ goroutine တစ်ခုစီက ကိုယ့် rider
      ကို မှန်မှန်ကန်ကန် ရပါတယ်။ [[mark:type-wait]] နောက်ဆုံးမှာ loop ပြီးတာနဲ့၊ ကြာချိန်ကို print
      မထုတ်ခင် rider အားလုံး ပြန်ရောက်တဲ့အထိ ရပ်ထားပါမယ်။ loop ထဲမှာ မထားဘဲ loop အပြင်မှာ ထားရတာက၊ rider တွေ အားလုံးကို အရင် လွှတ်ပြီးမှ စောင့်ချင်လို့ပါ။ loop ထဲမှာ ထားမိရင် တစ်ယောက် ပြန်ရောက်မှ နောက်တစ်ယောက် ထွက်တဲ့ ပုံစံ ပြန်ဖြစ်သွားပါမယ်။ [[mark:run-3]] ကဲ၊ run လိုက်ရအောင်။
    sources:
      - { title: "sync package — WaitGroup.Go", url: "https://pkg.go.dev/sync#WaitGroup.Go" }
      - { title: "Fixing For Loops in Go 1.22", url: "https://go.dev/blog/loopvar-preview" }
      - {
          title: "The Go Programming Language Specification — Function literals",
          url: "https://go.dev/ref/spec#Function_literals",
        }
    actions:
      - {
          id: close-wait,
          type: whiteboard.apply,
          at: { mark: close-wait },
          open: false,
          upsertIds: [],
        }
      - id: type-sync
        type: editor.type
        at: { mark: type-sync }
        target: { file: main.go, after: "\t\"fmt\"\n", occurrence: 1 }
        text: "\t\"sync\"\n"
      - id: type-var
        type: editor.type
        at: { mark: type-var }
        target: { file: main.go, after: "\tstart := time.Now()\n", occurrence: 1 }
        text: "\tvar wg sync.WaitGroup\n"
        cadence: line-by-line
      - id: type-comment
        type: editor.type
        at: { mark: type-comment }
        target: { file: main.go, after: "for _, j := range jobs {\n\t\t", occurrence: 1 }
        text: "// "
      - id: type-wggo
        type: editor.type
        at: { mark: type-wggo }
        target: { file: main.go, after: "\t\t// go deliver(j.rider, j.d)\n", occurrence: 1 }
        text: "\t\twg.Go(func() { deliver(j.rider, j.d) })\n"
        cadence: line-by-line
      - id: sel-closure
        type: editor.select
        at: { mark: sel-closure }
        target: { file: main.go, text: "func() { deliver(j.rider, j.d) }", occurrence: 1 }
      - id: type-wait
        type: editor.type
        at: { mark: type-wait }
        target:
          {
            file: main.go,
            after: "\t\twg.Go(func() { deliver(j.rider, j.d) })\n\t}\n",
            occurrence: 1,
          }
        text: "\twg.Wait()\n"
        cadence: line-by-line
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "300ms ကြာ",
          timeoutMs: 8000,
        }
      - {
          id: expect-file-go,
          type: expect.file,
          at: { afterAction: run-3 },
          path: main.go,
          contains: "\t\twg.Go(func() { deliver(j.rider, j.d) })\n",
        }
      - {
          id: expect-file-wait,
          type: expect.file,
          at: { afterAction: run-3 },
          path: main.go,
          contains: "\twg.Wait()\n",
        }

  - id: read-3
    chapter: အကြာဆုံး တစ်ယောက်စာပဲ ကြာတယ်
    narration: >-
      [[mark:point-aung]] ဒီ တစ်ခါမှာ အောင်အောင် အရင် ရောက်ပါတယ်။ ပြီးတော့ မောင်မောင်၊ နောက်ဆုံးမှ လှလှ
      ရောက်ပါတယ်။ [[mark:point-hla]] slice ထဲမှာ လှလှ က ပထမ ဖြစ်ပေမဲ့ သူ့ ခရီးက အကြာဆုံး ဖြစ်လို့
      နောက်ဆုံးမှ ရောက်တာပါ။ အားလုံး တစ်ပြိုင်နက် ထွက်သွားတော့ ရောက်တဲ့ အစဉ်က ကြာချိန် အတိုင်း
      ဖြစ်သွားတာပါ။ ဒီ program မှာ ကြာချိန်တွေ မတူကြလို့ ဒီ အစဉ်က အမြဲ တူပါတယ်။ ကြာချိန် တူနေရင်တော့ goroutine ဘယ်ဟာ အရင် ပြီးမလဲ ဆိုတာကို Go က အာမခံ မပေးပါဘူး။ [[mark:point-300]] စုစုပေါင်း ကြာချိန်ကလည်း မီလီစက္ကန့် သုံးရာပဲ ဖြစ်ပါတယ်။
      [[mark:board-par]] board ပေါ်မှာ ခုနက ပုံနဲ့ နှိုင်းယှဉ်ကြည့်ရအောင်။ [[mark:draw-par]] rider သုံးယောက်လုံး
      တစ်ချိန်တည်း ထွက်ကြတော့၊ main က အကြာဆုံး rider ပြန်ရောက်တာကိုပဲ စောင့်ရပါတယ်။ ဒါကြောင့် ခြောက်ရာ
      ကနေ သုံးရာ ဖြစ်သွားတာပါ။ တစ်ပြိုင်နက် လုပ်တာက ခရီး တစ်ခုစီကို မြန်အောင် မလုပ်ပေးပါဘူး၊ ခရီး
      တစ်ခုစီက အရင်အတိုင်း ကြာပါတယ်။ အချိန် သက်သာတာက တစ်ယောက်ကို တစ်ယောက် မစောင့်ရတော့လို့ပါ။
    sources:
