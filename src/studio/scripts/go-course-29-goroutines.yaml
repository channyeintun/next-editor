    narration: >-
      [[mark:close-quiz]] ဒါဆို ပြန်ချုပ်ရရင်၊ function ခေါ်တဲ့ နေရာရဲ့ ရှေ့မှာ go ထည့်ရင် goroutine အသစ်နဲ့
      စပြီး ချက်ချင်း ရှေ့ဆက်ပါတယ်။ ဒါပေမဲ့ main ပြီးတာနဲ့ program ပြီးသွားလို့၊ goroutine တွေကို
      စောင့်ပေးမယ့် နည်း လိုပါတယ်။ [[mark:recap-go]] wait group ရဲ့ Go က goroutine ကို စပြီး စာရင်း
      မှတ်ပေးပါတယ်။ [[mark:recap-wait]] Wait က အားလုံး ပြီးတဲ့အထိ main ကို ရပ်ထားပေးပါတယ်။
      တစ်ပြိုင်နက် လုပ်ရင် စုစုပေါင်း ကြာချိန်က အကြာဆုံး အလုပ်လောက်ပဲ ကြာပြီး၊ ပြီးတဲ့ အစဉ်ကတော့
      ကြာချိန် အတိုင်း ဖြစ်ပါတယ်။ နောက် lesson မှာတော့ goroutine တွေကြား ပါဆယ်တွေကို လက်လွှဲပေးတဲ့
      channel ကို လေ့လာသွားပါမယ်။
