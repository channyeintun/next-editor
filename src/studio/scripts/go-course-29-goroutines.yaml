      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ board ပေါ်က code မှာ wait group နဲ့ rider တွေကို
      လွှတ်ထားပေမဲ့၊ loop ပြီးတဲ့ နေရာမှာ ရပ်ထားတဲ့ line ကို မေ့ကျန်ခဲ့ပါတယ်။ [[mark:quiz-line]] ဒီ
      program ကို run ရင် က လို rider သုံးယောက်လုံး ရောက်ပြီး သုံးရာ ကြာမလား၊ ခ လို သုည စက္ကန့်
      တစ်ကြောင်းတည်း ထွက်မလား။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] အဖြေကတော့
      ခ ပါ။ ဘာကြောင့်လဲဆိုတော့ wait group ရဲ့ Go က goroutine တွေကို စပေးပြီး စာရင်း မှတ်ထားရုံပါပဲ၊
      main ကို ရပ်ထားပေးတာက Wait ပါ။ Wait မပါရင် main က ချက်ချင်း ပြီးသွားလို့၊ ဒုတိယ run လိုပဲ rider
      တွေ မရောက်ခင် program ပြီးသွားပါတယ်။
