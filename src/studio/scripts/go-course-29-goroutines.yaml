# Go course, lesson 29: goroutines (Burmese).
#
# Start state: main.go pinned as probe 28-sequential: an import block "fmt", "time"; `job`
# (rider, d); `deliver(rider, d)` sleeps d then prints; three jobs (လှလှ 300 ms, အောင်အောင်
# 100 ms, မောင်မောင် 200 ms); elapsed time rounded to 100 ms.
#   run-1 (pinned program): 300ms လှလှ / 100ms အောင်အောင် / 200ms မောင်မောင် / 600ms ကြာ.
# Edits, all insert-only:
#   1. `go ` in front of the deliver call -> run-2: 0s ကြာ (main ends, nobody arrived);
#   2. "sync" into the import block, `var wg sync.WaitGroup`, `// ` before the go line,
#      `wg.Go(func() { deliver(j.rider, j.d) })`, `wg.Wait()` -> run-3:
#      100ms အောင်အောင် / 200ms မောင်မောင် / 300ms လှလှ / 300ms ကြာ.
# Boards: (S) three trips in a row vs together, as time bars; (M) main ends, the program ends;
# (W) the wait group, and the older Add / Done form; (Q) quiz: wg.Go without Wait.
# Fixtures: bun ~/Documents/go-course-work/tools/sim-go.ts <this yaml> --write
schemaVersion: 1

lesson:
  slug: go-course-29-goroutines
  title: "Go course 29: Goroutine နဲ့ တစ်ပြိုင်နက် လုပ်တာ"
  locale: my-MM
  workspace:
    lessonType: go
    name: Go Course
    entryFilePath: main.go
    # One file: an open explorer would be a list of one beside the code.
    sidebarStartsCollapsed: true
    files:
      main.go: |
        package main

        import (
        	"fmt"
        	"time"
        )

        // job is one delivery: who rides and how long it takes.
        type job struct {
        	rider string
        	d     time.Duration
        }

        // deliver rides for d, then says the parcel arrived.
        func deliver(rider string, d time.Duration) {
        	time.Sleep(d)
        	fmt.Println(d, rider)
        }

        func main() {
        	jobs := []job{
        		{"လှလှ", 300 * time.Millisecond},
        		{"အောင်အောင်", 100 * time.Millisecond},
        		{"မောင်မောင်", 200 * time.Millisecond},
        	}
        	start := time.Now()
        	for _, j := range jobs {
        		deliver(j.rider, j.d)
        	}
        	fmt.Println(time.Since(start).Round(100*time.Millisecond), "ကြာ")
        }
