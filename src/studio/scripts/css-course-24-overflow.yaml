# CSS course (Burmese), lesson 24 of 43: overflow.
#
# Narration is Burmese (voice-script.md next to this file is the same text with
# ⟪mark⟫ anchors; DESIGN.md is the span-by-span brief). Every [[mark:…]] sits where its action
# begins, at a sentence end; each span carries one piece of meaning.
# Everything the learner sees (title, chapters, whiteboard labels, UI strings)
# is Burmese already.
#
# Shape: board (recall lesson 23; a window and the scene behind it: overflow
# goes on the parent; planned vs accidental overflow) → code tour (reviews
# region, five-card menu list, empty styles.css) → reviews gets a 160px height,
# a border and padding: the quotes spill over the menu (visible, the default)
# → hidden (cut at the padding edge; a script still scrolls it to the middle)
# → scroll → auto (the position survives) → clip (the box shows its top again;
# a script cannot scroll it; no BFC, sticky-safe, overflow-clip-margin) →
# board (five values: cuts? scrolls?) → overflow-y: visible (spills again next
# to clip) → overflow-x: hidden (the spill vanishes; a script scrolls it to the
# end) → board (x/y, visible-becomes-auto, x-then-y shorthand vs padding,
# logical names) → overflow: hidden auto (no change; honest CSS) → a11y tour
# (tabindex, role, aria-labelledby) + attribute-selector outline → board
# (scrollbars in the box model, gutter/color/width, root scroller) → board
# (scroll-behavior smooth inside reduced motion; scroll chaining and
# overscroll-behavior) → board (scroll snap: container and children) → strip
# rule + card rule (line-by-line) → a script scrolls the strip part of the
# way: it settles on the second card 24px in (pause-and-try invitation) →
# scroll padding read on the line → the cards get scroll-margin-inline-start
# and the same scroll settles 48px in (margin adds to padding) → the strip is
# a scroll container without the region attributes: no outline, and a real
# carousel needs them too → board (container side vs child side,
# sticky-header offsets, snap-stop, mandatory warning) → quiz + recap,
# hand-off to media and container queries (lesson 25).
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set(; no postcss config; no reload.
# Every overflow keyword is invalid until its last letter ("h", "hid", "cli",
# "vis"…), so a half-typed declaration is dropped and the previous one holds.
# "overflow: hidden auto" passes through "overflow: hidden" (x and y hidden:
# still a scroll container, same look). The strip and card rules are
# line-by-line: the narration summarises them.
#
# Measured in headless Chrome at 432 × 720 (probe/stages.ts, same anchors):
# reviews 400 × 251 at start; with the box rule 400 × 160, content 265 tall in
# a 156 client box (the last quote at y 252, over the menu heading at 192 and
# the first card at 230); hidden: scroll range 127, scrollTo(64) moves the last
# quote up 64; scroll/auto keep 64; clip: back to 0, scrollTo is a no-op;
# overflow-y visible next to clip: clip/visible, spills again; overflow-x
# hidden: computes hidden/auto (Chrome restores 64; no scroll event, so the
# script's scroll to the end follows at once); strip rule: cards squeezed
# 133/82/91/88/116, scrollWidth 558; card rule: cards 320 wide every 332;
# scrollTo(left 240) snaps to 308 = 332 − 24 (one scroll event at 308); with
# the cards' scroll-margin-inline-start 24px the snap positions are 284 =
# 332 − 24 − 24 and scrollTo(left 240) settles at 284: card 2 starts 48px in
# (verify-lesson --only-scene=snap-live screenshot).
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
