build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 4124

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  - id: overflow-intro
    chapter: "Overflow ဆိုတာ ဘာလဲ"
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ box တွေ ထပ်နေရင် ဘယ်ဟာ ရှေ့မှာ ပေါ်မလဲ ဆိုတာ ကြည့်ခဲ့ပါတယ်။ ဒီ lesson
      မှာတော့ content က သူ့ box ထက် ကြီးနေရင် ဘာဖြစ်မလဲ ဆိုတာ ကြည့်ပါမယ်။ [[mark:start-server]]
      ဒီလို ပြောနေတုန်းမှာပဲ၊ board နောက်မှာ dev server ကို စ နေပါပြီ။ [[mark:draw-window]] box
      တစ်ခုကို အရွယ်အစား ပုံသေ ရှိတဲ့ ပြတင်းပေါက်လို့ စဉ်းစားကြည့်ပါ။ [[mark:draw-scene]] သူ့ထဲက
      content ကတော့ ပြတင်းပေါက် နောက်က မြင်ကွင်းပါ။ အဲဒီ မြင်ကွင်းက ပြတင်းပေါက်ထက်
      ကြီးနေနိုင်ပါတယ်။ box ထဲ မဆံ့ဘဲ လျှံထွက်နေတဲ့ အပိုင်းကို lesson 2 မှာ overflow လို့
      ခေါ်ခဲ့ပါတယ်။ [[mark:draw-rule]] ဒါကြောင့် overflow property တွေကို ကြီးလွန်းတဲ့ child မှာ
      မဟုတ်ဘဲ၊ ပြတင်းပေါက် ဖြစ်တဲ့ parent မှာ ပေးရပါတယ်။ [[mark:draw-planned]] တခါတလေ overflow ကို
      တမင် လုပ်ထားတာပါ။ ဘောင်ထဲမှာ ရွှေ့ကြည့်ရတဲ့ မြေပုံ၊ လက်နဲ့ ပွတ်ဆွဲရတဲ့ card တန်း စတာမျိုးပါ။
      [[mark:draw-accident]] တခါတလေကတော့ မတော်တဆပါ။ စကားလုံး ရှည်ရှည် တစ်လုံး card အပြင်
      ထိုးထွက်သွားတာမျိုးပါ။
    sources:
      - title: "web.dev Learn CSS — Overflow: using overflow properties"
        url: "https://web.dev/learn/css/overflow#using_overflow_properties"
      - title: "MDN — overflow"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/overflow"
      - title: "CSS Overflow Module Level 3 — overflow concepts"
        url: "https://drafts.csswg.org/css-overflow-3/#overflow-concepts"
    actions:
      - id: open-intro-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      # Runs in the background (boot + pnpm install + spawn); waitForReady sits
      # on the preview mark in the code tour, well over 40 s of narration later.
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 45000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-window
        type: whiteboard.apply
        at: { mark: draw-window }
        upsertIds: [a-window, a-window-l]
        drawMs: 1800
      - id: draw-scene
        type: whiteboard.apply
        at: { mark: draw-scene }
        upsertIds: [a-scene, a-scene-l]
        drawMs: 2200
      - id: draw-rule
        type: whiteboard.apply
        at: { mark: draw-rule }
        upsertIds: [a-rule]
        drawMs: 1400
      - id: draw-planned
        type: whiteboard.apply
        at: { mark: draw-planned }
        upsertIds: [a-planned]
        drawMs: 1400
      - id: draw-accident
        type: whiteboard.apply
        at: { mark: draw-accident }
        upsertIds: [a-accident]
        drawMs: 1400

  - id: code-tour
    narration: >
      [[mark:close-intro-board]] ကဲ၊ project ကို ကြည့်ရအောင်။ [[mark:open-index]] ဒါက HTML
      ဖိုင်ပါ။ [[mark:select-reviews]] ပထမက ဧည့်သည် မှတ်ချက် ခြောက်ခု ပါတဲ့ box ပါ။
      [[mark:select-strip]] အောက်မှာ card ငါးခု ပါတဲ့ menu list ပါ။ [[mark:open-styles]] CSS
      ဖိုင်က အလွတ်ပါ။ ဒါကြောင့် မှတ်ချက် box က ပုံသေ အမြင့် မရှိဘဲ ခြောက်ခုလုံး ဆံ့အောင်
      ကြီးနေပါတယ်။ [[mark:preview-opens]] preview ပွင့်လာပါပြီ။ မှတ်ချက်တွေက အဖြူရောင် box ထဲမှာ
      ရှိပြီး၊ menu card တွေက သူ့အောက်မှာ တစ်ခုအောက် တစ်ခု စီထားပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Overflow"
        url: "https://web.dev/learn/css/overflow"
      - title: "MDN — height (auto: the content decides)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/height"
    actions:
      - id: close-intro-board
        type: whiteboard.apply
        at: { mark: close-intro-board }
        open: false
      - id: open-index
        type: workspace.openFile
        at: { mark: open-index }
        path: index.html
      - id: select-reviews
        type: editor.select
        at: { mark: select-reviews }
        target:
          {
            file: index.html,
            text: '<div class="reviews" tabindex="0" role="region" aria-labelledby="reviews-title" data-testid="reviews">',
            occurrence: 1,
          }
      - id: select-strip
        type: editor.select
        at: { mark: select-strip }
        target:
          {
            file: index.html,
            text: '<ul class="menu menu-strip" data-testid="menu-strip">',
            occurrence: 1,
          }
      - id: open-styles
        type: workspace.openFile
        at: { mark: open-styles }
        path: styles.css
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { mark: preview-opens }
        timeoutMs: 20000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-dev-server }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-reviews
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: reviews }
        textContains: "ဧည့်သည်တွေ ပြောတာ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-strip
        type: expect.preview
        at: { afterAction: expect-reviews }
        timeoutMs: 5000
        target: { by: testId, value: menu-strip }
        textContains: "မုန့်ဟင်းခါး"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: collapse-runner-dock
        type: runtime.collapseDock
        at: { afterAction: expect-strip }

  - id: visible
    chapter: "Overflow ရဲ့ တန်ဖိုးတွေ"
    narration: >
      [[mark:type-box]] မှတ်ချက် box ကို ပုံသေ အမြင့် 160 pixel ပေးပြီး၊ box ဘယ်မှာ ဆုံးလဲ
      မြင်ရအောင် အညိုဖျော့ဖျော့ border နဲ့ padding နည်းနည်း ထည့်ပါမယ်။ ရိုက်နေတုန်း ဘေးက preview
      ကို လိုက်ကြည့်ပါ။ [[mark:after-box]] box က 160 pixel ပဲ မြင့်တော့ မှတ်ချက်တွေ မဆံ့တော့ပါဘူး။
      ဒါကြောင့် box ရဲ့ အောက်ခြေကနေ လျှံထွက်ပြီး menu ပေါ်ကို ထပ်နေပါတယ်။ [[mark:explain-visible]]
      ဒါက overflow ရဲ့ default ဖြစ်တဲ့ visible ပါ။ CSS က content ကို သူ့ဘာသာ ဘယ်တော့မှ
      မဖျောက်ပါဘူး။ page ရှုပ်သွားတာထက် content ပျောက်သွားတာက ပိုဆိုးလို့ပါ။
      [[mark:explain-overlap]] menu ကလည်း အောက်ကို ဆင်းမသွားပါဘူး။ layout က box ရဲ့ ကိုယ်ပိုင်
      အမြင့်ကိုပဲ တွက်နေတုန်းမို့၊ လျှံထွက်နေတဲ့ စာတွေကို အောက်က menu ရဲ့ အပေါ်မှာ ထပ်ဆွဲထားရုံပါ။
    sources:
      - title: "web.dev Learn CSS — Overflow: values"
        url: "https://web.dev/learn/css/overflow#values"
      - title: "MDN — overflow (visible, the initial value)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/overflow#visible"
      - title: "Smashing Magazine — Overflow and data loss in CSS"
        url: "https://www.smashingmagazine.com/2019/09/overflow-data-loss-css/"
    actions:
      - id: type-box
        type: editor.type
        at: { mark: type-box }
        cadence: fast-explainer
        target: { file: styles.css, after: "", occurrence: 1 }
        text: ".reviews {\n  height: 160px;\n  border: 2px solid tan;\n  padding: 12px;\n}\n"
      - id: expect-box
        type: expect.preview
        at: { mark: after-box }
        timeoutMs: 4000
        target: { by: testId, value: last-review }
        textContains: "နောက်လည်း လာဦးမယ်။"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: hidden-scroll-auto
    narration: >
      [[mark:type-hidden]] အခု overflow ကို hidden ပေးပြီး၊ box ရဲ့ အောက်ခြေကို ကြည့်ထားပါ။
      [[mark:after-hidden]] မဆံ့တဲ့ မှတ်ချက်တွေကို ဖြတ်ပစ်လိုက်ပါပြီ။ စာက padding ထဲကိုပါ
      ဝင်နေပြီး၊ border ရဲ့ အတွင်းဘက်ကျမှ ပြတ်ပါတယ်။ [[mark:scroll-hidden]] scrollbar မရှိပေမယ့်
      script နဲ့ scroll လုပ်လို့ ရပါသေးတယ်။ script နဲ့ အလယ်ထိ scroll လုပ်လိုက်တော့ မှတ်ချက်တွေ
      အပေါ် တက်သွားပါတယ်။ [[mark:select-hidden]] ဒီ hidden box က scroll container ဖြစ်နေတုန်းပါ။
      scroll container ဆိုတာ သူ့ထဲက content ကို scroll လုပ်လို့ ရတဲ့ box ပါ။ အထဲက link ကို focus
      ရောက်တာ၊ page ထဲ စာ ရှာတာကလည်း scroll လုပ်စေနိုင်ပြီး၊ screen reader ကလည်း ဖြတ်ထားတဲ့ စာကို
      ဖတ်ပါတယ်။ [[mark:type-scroll]] နောက်တစ်ခုက scroll ပါ။ သူက box ကို အမြဲ scroll လုပ်လို့
      ရအောင် လုပ်ပြီး၊ ဘေးတိုက် scroll လုပ်စရာ မရှိရင်တောင် ဘက် နှစ်ဘက်လုံးမှာ scrollbar နေရာ
      ယူထားပါတယ်။ [[mark:after-scroll]] ဒီလို ကြိုယူထားလို့၊ နောက်မှ layout မခုန်ပါဘူး။ အမြဲ
      ပေါ်နေတဲ့ classic scrollbar သုံးတဲ့ စက်မှာဆိုရင် အခု scrollbar တွေကို မြင်ရမှာပါ။ Mac
      အများစုနဲ့ ဖုန်းတွေမှာတော့ scroll မလုပ်မချင်း မပေါ်ပါဘူး။ [[mark:type-auto]] ပြီးတော့
      အများဆုံး သုံးရမယ့် တန်ဖိုး ဖြစ်တဲ့ auto ပါ။ [[mark:after-auto]] auto က content တကယ် လျှံတဲ့
      ဘက်မှာပဲ scrollbar ပြပါတယ်။ ဒီ box က အပေါ်အောက်မှာပဲ လျှံလို့၊ scrollbar ကလည်း
      အပေါ်အောက်အတွက်ပဲ ရပါတယ်။ သုံးခုလုံးမှာ box က scroll container ဖြစ်နေလို့၊ scroll လုပ်ထားတဲ့
      နေရာ မပြောင်းပါဘူး။
    sources:
      - title: "web.dev Learn CSS — Overflow: values (hidden, scroll, auto)"
        url: "https://web.dev/learn/css/overflow#values"
      - title: "MDN — overflow (hidden, scroll, auto)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/overflow#values"
      - title: "CSS Overflow Module Level 3 — scroll containers"
        url: "https://drafts.csswg.org/css-overflow-3/#scroll-container"
      - title: "MDN — Scroll container"
        url: "https://developer.mozilla.org/en-US/docs/Glossary/Scroll_container"
    actions:
      - id: type-hidden
        type: editor.type
        at: { mark: type-hidden }
        cadence: fast-explainer
        target: { file: styles.css, after: "  padding: 12px;\n", occurrence: 1 }
        text: "  overflow: hidden;\n"
      - id: expect-hidden
        type: expect.preview
        at: { mark: after-hidden }
        timeoutMs: 4000
        target: { by: testId, value: last-review }
        textContains: "နောက်လည်း လာဦးမယ်။"
        retry: { maxAttempts: 3, delayMs: 300 }
      # hidden is still a scroll container: scrollTo moves the content
      # (scrollTop 64 of 127). One scroll event, recorded for the replay.
      - id: scroll-hidden
        type: preview.scroll
        at: { mark: scroll-hidden }
        timeoutMs: 5000
        target: { by: testId, value: reviews }
        top: 64
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: select-hidden
        type: editor.select
        at: { mark: select-hidden }
        target: { file: styles.css, text: "overflow: hidden;", occurrence: 1 }
      - id: type-scroll
        type: editor.type
        at: { mark: type-scroll }
        cadence: fast-explainer
        target: { file: styles.css, after: "  overflow: hidden;\n", occurrence: 1 }
        text: "  overflow: scroll;\n"
      - id: expect-scroll
        type: expect.preview
        at: { mark: after-scroll }
        timeoutMs: 4000
        target: { by: testId, value: reviews }
        textContains: "မနက်စောစော ဖွင့်တာ အဆင်ပြေတယ်။"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-auto
        type: editor.type
        at: { mark: type-auto }
        cadence: fast-explainer
        target: { file: styles.css, after: "  overflow: scroll;\n", occurrence: 1 }
        text: "  overflow: auto;\n"
      - id: expect-auto
        type: expect.preview
        at: { mark: after-auto }
        timeoutMs: 4000
        target: { by: testId, value: reviews }
        textContains: "ပလာတာ ပူပူလေး ကြိုက်တယ်။"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: clip
    narration: >
      [[mark:type-clip]] ငါးခုမြောက် တန်ဖိုးက clip ပါ။ ရိုက်နေတုန်း မှတ်ချက်တွေကို သတိထား ကြည့်ပါ။
      [[mark:after-clip]] hidden လိုပဲ ဖြတ်ပါတယ်။ ဒါပေမဲ့ မှတ်ချက်တွေက အပေါ်ဆုံးကို
      ပြန်ရောက်သွားပါပြီ။ [[mark:scroll-clip]] script နဲ့ အလယ်ထိ ထပ်ပြီး scroll လုပ်ကြည့်ရအောင်။
      ဒီတစ်ခါ ဘာမှ မရွေ့ပါဘူး။ [[mark:select-clip]] ဒီ clip ကို ကြည့်ပါ။ clip box က scroll
      container မဟုတ်လို့၊ script နဲ့တောင် scroll လုပ်လို့ မရပါဘူး။ [[mark:explain-bfc]]
      ကွာခြားချက် နှစ်ခု ကျန်ပါသေးတယ်။ hidden၊ scroll နဲ့ auto က lesson 13 က flow-root လိုပဲ၊ box
      ထဲမှာ block formatting context လို့ ခေါ်တဲ့ flow layout အသစ် တစ်ခု စပါတယ်။ ဒါကြောင့် float
      တွေကို အမြင့်ထဲ ထည့်တွက်ပြီး၊ child ရဲ့ margin တွေလည်း box ရဲ့ margin နဲ့ collapse
      မဖြစ်တော့ပါဘူး။ clip ကတော့ ဒီလို မလုပ်ပါဘူး။ [[mark:explain-sticky]] ပြီးတော့ lesson 14 က
      sticky ခေါင်းစဉ်တွေကို hidden box ထဲ ထည့်လိုက်ရင်၊ သူတို့က page မှာ မကပ်တော့ဘဲ၊ scroll
      မလုပ်တဲ့ အဲဒီ box ထဲမှာပဲ ကပ်ပါတယ်။ clip မှာတော့ ဒီပြဿနာ မရှိလို့၊ ဖြတ်ဖို့ပဲ လိုရင် clip
      ကို သုံးပါ။ [[mark:explain-clip-margin]] clip က အထဲက အရိပ် တစ်ခုကို ဖြတ်မိရင်၊ overflow clip
      margin နဲ့ box အပြင်ဘက်ကို နည်းနည်း ဆွဲခွင့် ပေးလို့ ရပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Overflow: values (clip)"
        url: "https://web.dev/learn/css/overflow#values"
      - title: "MDN — overflow (clip)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/overflow#clip"
      - title: "MDN — Block formatting context"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_display/Block_formatting_context"
      - title: "MDN — position: sticky (sticks to its nearest scrolling ancestor)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/position#sticky"
      - title: "MDN — overflow-clip-margin"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/overflow-clip-margin"
    actions:
      - id: type-clip
        type: editor.type
        at: { mark: type-clip }
        cadence: fast-explainer
        target: { file: styles.css, after: "  overflow: auto;\n", occurrence: 1 }
        text: "  overflow: clip;\n"
      - id: expect-clip
        type: expect.preview
        at: { mark: after-clip }
        timeoutMs: 4000
        target: { by: testId, value: reviews }
        textContains: "လက်ဖက်ရည် အရမ်းကောင်းတယ်။"
        retry: { maxAttempts: 3, delayMs: 300 }
      # The scroll command for this step is gone: clip is not a scroll
      # container, so scrollTo is a no-op that fires no scroll event, and the
      # gate would never find a recorded command. The narration's point (the
      # box does not scroll) needs none.
      - id: select-clip
        type: editor.select
        at: { mark: select-clip }
        target: { file: styles.css, text: "overflow: clip;", occurrence: 1 }

  - id: values-board
    narration: >
      [[mark:open-values]] တန်ဖိုး ငါးမျိုးကို ယှဉ်ကြည့်ရအောင်။ box က content ကို ဖြတ်သလား၊ scroll
      လုပ်လို့ ရသလား ဆိုတဲ့ မေးခွန်း နှစ်ခုပါ။ [[mark:draw-visible-row]] visible က ဘာမှ မဖြတ်သလို
      scroll လည်း မရပါဘူး။ [[mark:draw-hidden-clip-rows]] hidden နဲ့ clip နှစ်ခုလုံးက ဖြတ်ပါတယ်။
      hidden ကို script နဲ့ scroll လုပ်လို့ ရပေမယ့်၊ clip ကိုတော့ လုံးဝ မရပါဘူး။
      [[mark:draw-scroll-auto-rows]] scroll နဲ့ auto ကတော့ ဖြတ်လည်း ဖြတ်၊ scroll လည်း ရပါတယ်။
      scroll က scrollbar နေရာကို အမြဲ ယူထားပြီး၊ auto ကတော့ လိုမှပဲ ယူပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Overflow: values"
        url: "https://web.dev/learn/css/overflow#values"
      - title: "MDN — overflow"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/overflow"
    actions:
      - id: open-values
        type: whiteboard.apply
        at: { mark: open-values }
        open: true
        clear: true
        upsertIds: [b-title, b-h-cut, b-h-scroll]
      - id: draw-visible-row
        type: whiteboard.apply
        at: { mark: draw-visible-row }
        upsertIds: [b-visible, b-visible-cut, b-visible-scroll]
        drawMs: 1200
      - id: draw-hidden-clip-rows
        type: whiteboard.apply
        at: { mark: draw-hidden-clip-rows }
        upsertIds:
          [
            b-hidden,
            b-hidden-cut,
            b-hidden-scroll,
            b-hidden-note,
            b-clip,
            b-clip-cut,
            b-clip-scroll,
          ]
        drawMs: 2800
      - id: draw-scroll-auto-rows
        type: whiteboard.apply
        at: { mark: draw-scroll-auto-rows }
        upsertIds:
          [
            b-scroll,
            b-scroll-cut,
            b-scroll-scroll,
            b-scroll-note,
            b-auto,
            b-auto-cut,
            b-auto-scroll,
            b-auto-note,
          ]
        drawMs: 3000

  - id: axes-live
    chapter: "Axis နှစ်ခုနဲ့ shorthand"
    narration: >
      [[mark:close-values]] overflow က အမှန်တော့ property နှစ်ခုပါ။ ဘယ်ညာအတွက် overflow x နဲ့
      အပေါ်အောက်အတွက် overflow y ပါ။ [[mark:type-y-visible]] အပေါ်အောက် တစ်ဘက်တည်းကိုပဲ visible
      ပေးပြီး၊ ဘယ်ညာကိုတော့ clip အတိုင်း ထားကြည့်ရအောင်။ [[mark:after-y-visible]] မှတ်ချက်တွေ
      အောက်ခြေကနေ ပြန်လျှံထွက်လာပါပြီ။ [[mark:type-x-hidden]] အခု ဘယ်ညာ တစ်ဘက်တည်းကိုပဲ hidden
      ပေးပါမယ်။ box ရဲ့ အောက်ခြေကို ကြည့်ထားပါ။ [[mark:after-x-hidden]] အပေါ်အောက်မှာ visible လို့
      ရေးထားတုန်း ဖြစ်ပေမယ့်၊ လျှံထွက်နေတာ ပျောက်သွားပါပြီ။ [[mark:scroll-trap]] script နဲ့
      အဆုံးထိ scroll လုပ်လို့လည်း ရနေပါတယ်။ ဆိုလိုတာက အပေါ်အောက်က visible မဟုတ်တော့ပါဘူး။
      ဘာကြောင့်လဲ။
    sources:
      - title: "web.dev Learn CSS — Overflow: scrolling on the vertical and horizontal axis"
        url: "https://web.dev/learn/css/overflow#scrolling_on_the_vertical_and_horizontal_axis"
      - title: "MDN — overflow-x"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/overflow-x"
      - title: "MDN — overflow-y"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/overflow-y"
    actions:
      - id: close-values
        type: whiteboard.apply
        at: { mark: close-values }
        open: false
      - id: type-y-visible
        type: editor.type
        at: { mark: type-y-visible }
        cadence: fast-explainer
        target: { file: styles.css, after: "  overflow: clip;\n", occurrence: 1 }
        text: "  overflow-y: visible;\n"
      - id: expect-y-visible
        type: expect.preview
        at: { mark: after-y-visible }
        timeoutMs: 4000
        target: { by: testId, value: last-review }
        textContains: "နောက်လည်း လာဦးမယ်။"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-x-hidden
        type: editor.type
        at: { mark: type-x-hidden }
        cadence: fast-explainer
        target: { file: styles.css, after: "  overflow-y: visible;\n", occurrence: 1 }
        text: "  overflow-x: hidden;\n"
      - id: expect-x-hidden
        type: expect.preview
        at: { mark: after-x-hidden }
        timeoutMs: 4000
        target: { by: testId, value: reviews }
        textContains: "ဝန်ထမ်းတွေ ဖော်ရွေတယ်။"
        retry: { maxAttempts: 3, delayMs: 300 }
      # Chrome restores the old offset without a scroll event; this recorded
      # scroll to the end (clamped to 127) makes the replay deterministic.
      - id: scroll-trap
        type: preview.scroll
        at: { mark: scroll-trap }
        timeoutMs: 5000
        target: { by: testId, value: reviews }
        top: 400
        retry: { maxAttempts: 2, delayMs: 250 }

  - id: axes-board
    narration: >
      [[mark:open-axes]] စည်းမျဉ်းကို ကြည့်ရအောင်။ [[mark:draw-axes]] x က ဘယ်ညာ၊ y က အပေါ်အောက်ပါ။
      [[mark:draw-trap]] axis တစ်ခုက hidden၊ scroll ဒါမှမဟုတ် auto ဖြစ်ရင်၊ ကျန်တဲ့ axis မှာ
      ပေးထားတဲ့ visible က auto ဖြစ်သွားပါတယ်။ box က တစ်ဘက်မှာ scroll လုပ်ရင်း နောက်တစ်ဘက်မှာ
      လျှံထွက်လို့ မရလို့ပါ။ [[mark:draw-trap-clip]] ဒီ အကြောင်းကြောင့်ပဲ၊ ကျန်တဲ့ axis မှာ clip
      ပေးထားရင်လည်း hidden ဖြစ်သွားပါတယ်။ [[mark:draw-shorthand]] overflow shorthand က axis
      နှစ်ခုလုံးကို ပေးပါတယ်။ တန်ဖိုး တစ်ခုဆိုရင် နှစ်ခုလုံးအတွက်ပါ။ နှစ်ခုဆိုရင် ပထမက x၊ ဒုတိယက y
      ပါ။ [[mark:draw-padding]] ဒါက padding နဲ့ ပြောင်းပြန်ပါ။ padding မှာ တန်ဖိုး နှစ်ခု ပေးရင်
      အပေါ်အောက်က အရင် လာပါတယ်။ [[mark:draw-logical]] lesson 21 က logical property တွေလိုပဲ၊
      overflow inline နဲ့ overflow block က စာ ရေးတဲ့ ဦးတည်ရာကို လိုက်ပါတယ်။ 2025 ခုနှစ်ကစပြီး
      browser အဓိက အားလုံးမှာ သုံးလို့ ရပါပြီ။
    sources:
      - title: "web.dev Learn CSS — Overflow: the overflow shorthand"
        url: "https://web.dev/learn/css/overflow#the_overflow_shorthand"
      - title: "CSS Overflow Module Level 3 — overflow-x / overflow-y (visible computes to auto)"
        url: "https://drafts.csswg.org/css-overflow-3/#overflow-properties"
      - title: "web.dev Learn CSS — Overflow: logical properties for scroll direction"
        url: "https://web.dev/learn/css/overflow#logical_properties_for_scroll_direction"
      - title: "MDN — overflow-inline"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/overflow-inline"
      - title: "MDN — overflow-block"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/overflow-block"
    actions:
      - id: open-axes
        type: whiteboard.apply
        at: { mark: open-axes }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-axes
        type: whiteboard.apply
        at: { mark: draw-axes }
        upsertIds: [c-x-arrow, c-x-l, c-y-arrow, c-y-l]
        drawMs: 2400
      - id: draw-trap
        type: whiteboard.apply
        at: { mark: draw-trap }
        upsertIds: [c-trap-1]
        drawMs: 1800
      - id: draw-trap-clip
        type: whiteboard.apply
        at: { mark: draw-trap-clip }
        upsertIds: [c-trap-2]
        drawMs: 1600
      - id: draw-shorthand
        type: whiteboard.apply
        at: { mark: draw-shorthand }
        upsertIds: [c-short, c-short-xy]
        drawMs: 1800
      - id: draw-padding
        type: whiteboard.apply
        at: { mark: draw-padding }
        upsertIds: [c-padding]
        drawMs: 1600
      - id: draw-logical
        type: whiteboard.apply
        at: { mark: draw-logical }
        upsertIds: [c-logical]
        drawMs: 1600

  - id: shorthand-live
    narration: >
      [[mark:close-axes]] editor ထဲ ပြန်သွားရအောင်။ [[mark:select-y-visible]] ဒီ visible ကို
      ကြည့်ပါ။ ဘယ်ညာ hidden ဖြစ်ကတည်းက browser က auto ပြောင်းလိုက်လို့ အလုပ် မလုပ်တော့ပါဘူး။
      [[mark:type-shorthand]] တကယ် ဖြစ်နေတာကို shorthand နဲ့ ရေးကြည့်ရအောင်။ x အတွက် hidden၊
      ပြီးမှ y အတွက် auto ပါ။ [[mark:after-shorthand]] preview မှာ ဘာမှ မပြောင်းပါဘူး။
      [[mark:select-shorthand]] ဒီ shorthand ရဲ့ ရလဒ်က အတူတူပဲ ဖြစ်ပေမယ့်၊ အခု CSS မှာ ရေးထားတာနဲ့
      browser လုပ်နေတာ ကိုက်သွားပါပြီ။
    sources:
      - title: "MDN — overflow (two-value syntax: x then y)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/overflow#syntax"
      - title: "web.dev Learn CSS — Overflow: the overflow shorthand"
        url: "https://web.dev/learn/css/overflow#the_overflow_shorthand"
    actions:
      - id: close-axes
        type: whiteboard.apply
        at: { mark: close-axes }
        open: false
      - id: select-y-visible
        type: editor.select
        at: { mark: select-y-visible }
        target: { file: styles.css, text: "overflow-y: visible;", occurrence: 1 }
      - id: type-shorthand
        type: editor.type
        at: { mark: type-shorthand }
        cadence: fast-explainer
        target: { file: styles.css, after: "  overflow-x: hidden;\n", occurrence: 1 }
        text: "  overflow: hidden auto;\n"
      - id: expect-shorthand
        type: expect.preview
        at: { mark: after-shorthand }
        timeoutMs: 4000
        target: { by: testId, value: last-review }
        textContains: "နောက်လည်း လာဦးမယ်။"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-shorthand
        type: editor.select
        at: { mark: select-shorthand }
        target: { file: styles.css, text: "overflow: hidden auto;", occurrence: 1 }

  - id: accessible-scroller
    chapter: "Scroll container ကို လူတိုင်း သုံးနိုင်အောင်"
    narration: >
      box တစ်ခု scroll container ဖြစ်လာရင်၊ သူ့ကို လူတိုင်း scroll လုပ်နိုင်ရဲ့လား ဆိုတာကိုပါ
      စဉ်းစားရပါတယ်။ [[mark:open-index-a11y]] HTML ဖိုင်ကို ပြန်ကြည့်ရအောင်။
      [[mark:select-tabindex]] ဒီ tabindex ကို ကြည့်ပါ။ keyboard သုံးသူက arrow key နဲ့ scroll
      လုပ်ဖို့ focus က ဒီ box ကို အရင် ရောက်ရပါတယ်။ အထဲမှာ focus ရနိုင်တဲ့ element မရှိလို့၊
      tabindex က box ကိုယ်တိုင်ကို focus ရစေပါတယ်။ Chrome နဲ့ Firefox က အခု ဒါကို သူ့ဘာသာ
      လုပ်ပေမယ့်၊ Safari က မလုပ်သေးပါဘူး။ [[mark:select-role]] role က ဒီ box ဟာ region ဖြစ်တယ်လို့
      screen reader ကို ပြောပြီး၊ aria labelledby က အဲဒီ region ကို သူ့ ခေါင်းစဉ်နဲ့
      နာမည်ပေးပါတယ်။ [[mark:open-styles-a11y]] ဒါတွေ ပါမပါကို CSS နဲ့ စစ်လို့ ရပါတယ်။
      [[mark:type-a11y]] attribute selector မှာ attribute နာမည်ကိုပဲ ရေးရင်၊ တန်ဖိုး ဘာပဲ ဖြစ်ဖြစ်
      အဲဒီ attribute ရှိတဲ့ element နဲ့ ကိုက်ပါတယ်။ role မှာတော့ region ဆိုတဲ့ တန်ဖိုးကိုပါ
      စစ်ထားပါတယ်။ သုံးခုကို ကြားမှာ ဘာမှ မခြားဘဲ ကပ်ရေးထားလို့၊ element တစ်ခုတည်းမှာ သုံးခုလုံး
      ပါမှ ကိုက်ပါတယ်။ [[mark:after-a11y]] မှတ်ချက် box မှာ သုံးခုလုံး ပါလို့ အစိမ်းရောင်
      မျဉ်းပြတ် outline ပေါ်လာပါပြီ။ တစ်ခုခု လိုနေတဲ့ box ဆိုရင်တော့ outline မရပါဘူး။ တချို့
      developer တွေက overflow ကိုပါ ဒီလို rule ထဲမှာ ရေးကြပါတယ်။ ဒါဆို attribute မပြည့်တဲ့ box က
      scroll မလုပ်တော့လို့၊ ရေးနေတုန်းမှာပဲ သိနိုင်ပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Overflow: scrolling and accessibility"
        url: "https://web.dev/learn/css/overflow#scrolling_and_accessibility"
      - title: "Adrian Roselli — Using CSS to enforce accessibility"
        url: "https://adrianroselli.com/2021/06/using-css-to-enforce-accessibility.html"
      - title: "MDN — ARIA region role"
        url: "https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/region_role"
      - title: "MDN — Attribute selectors ([attr])"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/Attribute_selectors"
      - title: "Chrome for Developers — Keyboard-focusable scrollers (Chrome 130)"
        url: "https://developer.chrome.com/blog/keyboard-focusable-scrollers"
    actions:
      - id: open-index-a11y
        type: workspace.openFile
        at: { mark: open-index-a11y }
        path: index.html
      - id: select-tabindex
        type: editor.select
        at: { mark: select-tabindex }
        target: { file: index.html, text: 'tabindex="0"', occurrence: 1 }
      - id: select-role
        type: editor.select
        at: { mark: select-role }
        target:
          { file: index.html, text: 'role="region" aria-labelledby="reviews-title"', occurrence: 1 }
      - id: open-styles-a11y
        type: workspace.openFile
        at: { mark: open-styles-a11y }
        path: styles.css
      - id: type-a11y
        type: editor.type
        at: { mark: type-a11y }
        cadence: fast-explainer
        target: { file: styles.css, after: "  overflow: hidden auto;\n}\n", occurrence: 1 }
        text: "\n[role=\"region\"][aria-labelledby][tabindex] {\n  outline: 2px dashed seagreen;\n}\n"
      - id: expect-a11y
        type: expect.preview
        at: { mark: after-a11y }
        timeoutMs: 4000
        target: { by: testId, value: reviews }
        attribute: { name: role, value: region }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: scrollbars
    chapter: "Scrollbar နဲ့ scroll လုပ်ပုံ"
    narration: >
      [[mark:open-scrollbars]] အခု scrollbar ကိုယ်တိုင်ကို ကြည့်ရအောင်။ [[mark:draw-bar-layers]]
      lesson 2 မှာ ပြောခဲ့သလို၊ classic scrollbar က border နဲ့ padding ကြားမှာ ဝင်နေလို့ content
      အတွက် နေရာကို ကျဉ်းသွားစေပါတယ်။ [[mark:draw-overlay]] Mac အများစုနဲ့ ဖုန်းတွေမှာ သုံးတဲ့
      overlay scrollbar ကတော့ content ပေါ် ထပ်ပေါ်ပြီး နေရာ မယူပါဘူး။ [[mark:draw-gutter]]
      ဒါကြောင့် box တစ်ခုက စက်တစ်ခုမှာ တခြား စက်ထက် နည်းနည်း ကျဉ်းနေနိုင်ပါတယ်။ scrollbar gutter
      ကို stable ပေးထားရင် အဲဒီ နေရာကို အမြဲ ချန်ထားလို့၊ scrollbar ပေါ်လာတဲ့အခါ content
      မခုန်ပါဘူး။ [[mark:draw-color]] scrollbar color က အရောင် နှစ်ခု ယူပါတယ်။ ပထမက ဆွဲရတဲ့ thumb၊
      ဒုတိယက thumb ရွေ့တဲ့ track ပါ။ inherit ဖြစ်လို့ root မှာ တစ်ခါ ရေးရုံနဲ့ scroll container
      အားလုံး လိုက်ပါတယ်။ [[mark:draw-width]] scrollbar width ကတော့ auto၊ thin နဲ့ none ပဲ ယူပြီး၊
      pixel တန်ဖိုး မယူပါဘူး။ none က scrollbar ကို ဖျောက်ပေမယ့် box ကို scroll လုပ်လို့
      ရနေတုန်းပါ။ [[mark:draw-root]] နောက်ဆုံးက page တစ်ခုလုံးကို scroll လုပ်တဲ့ root scroller ပါ။
      အများအားဖြင့် html element ပါ။ ဖုန်းမှာ address bar ပျောက်တာလို feature တွေကို သူပဲ ရပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Overflow: scrollbar positioning within the box model"
        url: "https://web.dev/learn/css/overflow#scrollbar_positioning_within_the_box_model"
      - title: "MDN — scrollbar-gutter"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/scrollbar-gutter"
      - title: "MDN — scrollbar-color"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/scrollbar-color"
      - title: "MDN — scrollbar-width"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/scrollbar-width"
      - title: "web.dev Learn CSS — Overflow: root-scroller versus implicit-scroller"
        url: "https://web.dev/learn/css/overflow#root-scroller_versus_implicit-scroller"
      - title: "Chromium explainer — Non-document root scroller"
        url: "https://github.com/bokand/NonDocumentRootScroller"
    actions:
      - id: open-scrollbars
        type: whiteboard.apply
        at: { mark: open-scrollbars }
        open: true
        clear: true
        upsertIds: [d-title]
      - id: draw-bar-layers
        type: whiteboard.apply
        at: { mark: draw-bar-layers }
        upsertIds: [d-box, d-content, d-bar, d-bar-l]
        drawMs: 2600
      - id: draw-overlay
        type: whiteboard.apply
        at: { mark: draw-overlay }
        upsertIds: [d-overlay-l]
        drawMs: 1400
      - id: draw-gutter
        type: whiteboard.apply
        at: { mark: draw-gutter }
        upsertIds: [d-gutter]
        drawMs: 1400
      - id: draw-color
        type: whiteboard.apply
        at: { mark: draw-color }
        upsertIds: [d-color]
        drawMs: 1400
      - id: draw-width
        type: whiteboard.apply
        at: { mark: draw-width }
        upsertIds: [d-width]
        drawMs: 1400
      - id: draw-root
        type: whiteboard.apply
        at: { mark: draw-root }
        upsertIds: [d-root]
        drawMs: 1400

  - id: scroll-feel
    narration: >
      [[mark:open-feel]] scroll လုပ်ပုံကို ပြောင်းပေးတဲ့ property နှစ်ခု ရှိပါတယ်။
      [[mark:draw-smooth]] scroll behavior ကို smooth ပေးရင် ခုန်သွားတဲ့ scroll တွေကို animation
      နဲ့ ရွှေ့ပေးပါတယ်။ page ထဲက အပိုင်းဆီ သွားတဲ့ link ကို နှိပ်တာ၊ script နဲ့ element ဆီ scroll
      လုပ်တာမျိုးပါ။ wheel ဒါမှမဟုတ် လက်နဲ့ scroll လုပ်တာကတော့ မပြောင်းပါဘူး။
      [[mark:draw-smooth-notes]] ဒါကို reduced motion ကို စစ်တဲ့ media query ထဲမှာ ထည့်ပါ။ reduced
      motion ဆိုတာ လှုပ်ရှားမှု နည်းနည်းပဲ လိုချင်တယ်လို့ user က setting ဖွင့်ထားတာပါ။
      မဖွင့်ထားတဲ့ သူတွေပဲ animation ကို မြင်ရပါမယ်။ [[mark:draw-chain]] scroll container တစ်ခု
      အဆုံးရောက်ပြီး ဆက် scroll နေရင်၊ နောက်က page က scroll စလုပ်ပါတယ်။ အဲဒါကို scroll chaining
      လို့ ခေါ်ပြီး၊ pop-up ထဲမှာ ဖြစ်ရင် အနှောင့်အယှက် ဖြစ်ပါတယ်။ [[mark:draw-contain]]
      overscroll behavior ကို contain ပေးရင် scroll chaining က ဒီ box မှာ ရပ်ပါတယ်။ none ကတော့ box
      ရဲ့ အဆုံးမှာ ပြန်ကန်တာ၊ အလင်းပေါ်တာကိုပါ ပိတ်ပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Overflow: scroll-behavior"
        url: "https://web.dev/learn/css/overflow#scroll-behavior"
      - title: "MDN — scroll-behavior"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/scroll-behavior"
      - title: "MDN — prefers-reduced-motion"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/@media/prefers-reduced-motion"
      - title: "web.dev Learn CSS — Overflow: overscroll-behavior"
        url: "https://web.dev/learn/css/overflow#overscroll-behavior"
      - title: "MDN — overscroll-behavior"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/overscroll-behavior"
    actions:
      - id: open-feel
        type: whiteboard.apply
        at: { mark: open-feel }
        clear: true
        upsertIds: [e-title]
      - id: draw-smooth
        type: whiteboard.apply
        at: { mark: draw-smooth }
        upsertIds: [e-code-2, e-smooth-yes, e-smooth-no]
        drawMs: 2600
      - id: draw-smooth-notes
        type: whiteboard.apply
        at: { mark: draw-smooth-notes }
        upsertIds: [e-code-1, e-code-3]
        drawMs: 1800
      - id: draw-chain
        type: whiteboard.apply
        at: { mark: draw-chain }
        upsertIds: [e-page, e-inner, e-inner-arrow, e-chain, e-chain-l]
        drawMs: 3000
      - id: draw-contain
        type: whiteboard.apply
        at: { mark: draw-contain }
        upsertIds: [e-contain, e-strike]
        drawMs: 1800

  - id: snap-board
    chapter: "Card တွေကို scroll snap လုပ်ကြည့်ရအောင်"
    narration: >
      [[mark:open-snap]] ပုံမှန်ဆိုရင် scroll က ဘယ်နေရာမှာမဆို၊ card တစ်ဝက်မှာတောင် ရပ်နိုင်ပါတယ်။
      scroll snap ကတော့ လွှတ်လိုက်ရင် ကိုယ် ရွေးထားတဲ့ နေရာတွေမှာပဲ ရပ်ပေးပါတယ်။
      [[mark:draw-snap-port]] scroll snap ကို container ဘက်နဲ့ child ဘက်၊ နှစ်နေရာမှာ ရေးရပါတယ်။
      [[mark:draw-snap-type]] container က snap လုပ်မလား၊ ဘယ် ဦးတည်ရာမှာလဲ၊ ဘယ်လောက် တင်းတင်းလဲ
      ဆိုတာ ပြောပါတယ်။ [[mark:draw-snap-strict]] mandatory ဆိုရင် snap နေရာ တစ်ခုခုမှာ အမြဲ
      ရပ်ပါတယ်။ default ဖြစ်တဲ့ proximity ကတော့ snap နေရာ တစ်ခုနဲ့ နီးနီးမှာ ရပ်မှပဲ snap
      လုပ်ပါတယ်။ [[mark:draw-snap-align]] child တစ်ခုစီကတော့ ဘယ်မှာ snap လုပ်မလဲ ပြောပါတယ်။ သူ့
      start၊ center ဒါမှမဟုတ် end က container ရဲ့ အဲဒီ ဘက်နဲ့ တန်းညီသွားပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Overflow: scroll snapping"
        url: "https://web.dev/learn/css/overflow#scroll_snapping"
      - title: "MDN — Basic concepts of scroll snap"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_scroll_snap/Basic_concepts"
      - title: "MDN — scroll-snap-type"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/scroll-snap-type"
      - title: "MDN — scroll-snap-align"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/scroll-snap-align"
    actions:
      - id: open-snap
        type: whiteboard.apply
        at: { mark: open-snap }
        clear: true
        upsertIds: [f-title]
      - id: draw-snap-port
        type: whiteboard.apply
        at: { mark: draw-snap-port }
        upsertIds: [f-port, f-c1, f-c2, f-c3]
        drawMs: 2000
      - id: draw-snap-type
        type: whiteboard.apply
        at: { mark: draw-snap-type }
        upsertIds: [f-type]
        drawMs: 1600
      - id: draw-snap-strict
        type: whiteboard.apply
        at: { mark: draw-snap-strict }
        upsertIds: [f-strict]
        drawMs: 1600
      - id: draw-snap-align
        type: whiteboard.apply
        at: { mark: draw-snap-align }
        upsertIds: [f-line, f-align, f-align-2]
        drawMs: 2000

  - id: snap-live
    narration: >
      [[mark:close-snap]] menu မှာ စမ်းကြည့်ရအောင်။ [[mark:type-strip]] menu list ကို gap ပါတဲ့
      flex row ဖြစ်စေပြီး ဘေးတိုက် scroll လုပ်လို့ ရအောင် လုပ်ပါမယ်။ x တစ်လျှောက် mandatory နဲ့
      snap လုပ်ပြီး၊ snap လုပ်ရင် အစွန်း နှစ်ဘက်မှာ 24 pixel စီ ချန်ထားပါမယ်။ [[mark:after-strip]]
      flex item တွေက ကျုံ့နိုင်လို့ card တွေ row တစ်ခုတည်းထဲ ဝင်သွားပါတယ်။ ဒါတောင် row ထဲ မဆံ့လို့
      နောက်ဆုံး card တွေက ညာဘက် အစွန်းကနေ လျှံထွက်နေပါပြီ။ [[mark:type-cards]] အခု card တွေပါ။
      မကြီး မကျုံ့ဘဲ row ရဲ့ 80 ရာခိုင်နှုန်းစီ ယူပြီး၊ card တစ်ခုစီက သူ့ start မှာ snap
      လုပ်ပါမယ်။ [[mark:after-cards]] card တစ်ခုက row ရဲ့ အများစုကို ယူထားပြီး၊ နောက် card ကို
      ညာဘက် အစွန်းမှာ နည်းနည်း မြင်ရပါတယ်။ [[mark:scroll-strip]] script နဲ့ card တန်းကို
      တစ်စိတ်တစ်ပိုင်း scroll လုပ်ပါမယ်။ card နှစ်ခုကြားမှာ လက် လွှတ်လိုက်သလိုပါ။
      [[mark:after-snap]] ဒုတိယ card မှာ ရပ်သွားပါပြီ။ ဘယ်ဘက် အစွန်းကနေ 24 pixel ခွာပြီး ရပ်တာပါ။
      ရွေ့သွားပုံကိုတော့ ဒီမှာ မမြင်ရပါဘူး။ lesson ကို pause လုပ်ပြီး project ကို run ကြည့်ပါ၊
      ပြီးရင် card တန်းကို ကိုယ်တိုင် scroll လုပ်ကြည့်ပါ။ [[mark:select-snap-padding]] ဒီ scroll
      padding ကို ကြည့်ပါ။ သူက မြင်ရတဲ့ padding ကို မထည့်ပါဘူး။ snap လုပ်ပြီး ရပ်မယ့် မျဉ်းကိုပဲ
      ရွှေ့ပေးတာပါ။ [[mark:type-margin]] child ဘက်ကလည်း card မှာ scroll margin ထည့်ကြည့်ရအောင်။
      [[mark:scroll-strip-again]] script နဲ့ ခုနက နေရာကို ထပ် scroll လုပ်ပါမယ်။
      [[mark:after-margin]] အခု ဒုတိယ card က 48 pixel ခွာပြီး ရပ်ပါတယ်။ card ရဲ့ scroll margin က
      container ရဲ့ scroll padding နဲ့ ပေါင်းသွားလို့ပါ။ [[mark:select-strip-overflow]] ဒီ
      overflow ကြောင့် card တန်းကလည်း scroll container ဖြစ်ပေမယ့်၊ attribute တွေ မပါလို့ outline
      မရပါဘူး။ တကယ့် site မှာဆိုရင် မှတ်ချက် box လိုပဲ keyboard နဲ့ ရောက်နိုင်အောင် လုပ်ရပါမယ်။
    sources:
      - title: "web.dev Learn CSS — Overflow: setting up the scroll container"
        url: "https://web.dev/learn/css/overflow#setting_up_the_scroll_container"
      - title: "web.dev Learn CSS — Overflow: controlling the snappable elements"
        url: "https://web.dev/learn/css/overflow#controlling_the_snappable_elements"
      - title: "MDN — scroll-padding"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/scroll-padding"
      - title: "MDN — flex (none-growing, non-shrinking basis)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/flex"
    actions:
      - id: close-snap
        type: whiteboard.apply
        at: { mark: close-snap }
        open: false
      - id: type-strip
        type: editor.type
        at: { mark: type-strip }
        cadence: line-by-line
        target: { file: styles.css, after: "  outline: 2px dashed seagreen;\n}\n", occurrence: 1 }
        text: "\n.menu-strip {\n  display: flex;\n  gap: 12px;\n  overflow-x: auto;\n  scroll-snap-type: x mandatory;\n  scroll-padding-inline: 24px;\n}\n"
      - id: expect-strip-row
        type: expect.preview
        at: { mark: after-strip }
        timeoutMs: 4000
        target: { by: testId, value: card-falooda }
        textContains: "ဖာလူဒါ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-cards
        type: editor.type
        at: { mark: type-cards }
        cadence: line-by-line
        target: { file: styles.css, after: "  scroll-padding-inline: 24px;\n}\n", occurrence: 1 }
        text: "\n.menu-strip .menu-card {\n  flex: 0 0 80%;\n  scroll-snap-align: start;\n}\n"
      - id: expect-cards
        type: expect.preview
        at: { mark: after-cards }
        timeoutMs: 4000
        target: { by: testId, value: card-coffee }
        textContains: "ကော်ဖီ"
        retry: { maxAttempts: 3, delayMs: 300 }
      # The recorded scroll must equal `left`, and the browser only settles on
      # a snap position: the second card's, 308 = 332 − 24 (rrweb records the
      # settled position, so asking for 240 never matched). The cards are 80 %
      # of the strip, which base.css caps at 400 px, so 308 holds at any
      # preview 432 px wide or more.
      - id: scroll-strip
        type: preview.scroll
        at: { mark: scroll-strip }
        timeoutMs: 5000
        target: { by: testId, value: menu-strip }
        top: 0
        left: 308
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-snap
        type: expect.preview
        at: { mark: after-snap }
        timeoutMs: 4000
        target: { by: testId, value: card-coffee }
        textContains: "1,800 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-snap-padding
        type: editor.select
        at: { mark: select-snap-padding }
        target: { file: styles.css, text: "scroll-padding-inline: 24px;", occurrence: 1 }
      - id: type-margin
        type: editor.type
        at: { mark: type-margin }
        cadence: fast-explainer
        target: { file: styles.css, after: "  scroll-snap-align: start;\n", occurrence: 1 }
        text: "  scroll-margin-inline-start: 24px;\n"
      # Snap positions become 332 − 24 − 24 = 284. Chrome may re-snap when the
      # style lands; this recorded scroll makes the settled 284 deterministic.
      # As above, `left` is the settled position, because the recorded scroll
      # must equal it.
      - id: scroll-strip-again
        type: preview.scroll
        at: { mark: scroll-strip-again }
        timeoutMs: 5000
        target: { by: testId, value: menu-strip }
        top: 0
        left: 284
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-margin
        type: expect.preview
        at: { mark: after-margin }
        timeoutMs: 4000
        target: { by: testId, value: card-coffee }
        textContains: "1,800 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-strip-overflow
        type: editor.select
        at: { mark: select-strip-overflow }
        target: { file: styles.css, text: "overflow-x: auto;", occurrence: 1 }

  - id: snap-sides
    narration: >
      [[mark:open-sides]] snap property တွေကို ဘက်အလိုက် ခွဲကြည့်ရအောင်။
      [[mark:draw-container-side]] container မှာ scroll snap type နဲ့ scroll padding ကို
      ပေးရပါတယ်။ [[mark:draw-child-side]] child မှာတော့ scroll snap align နဲ့ scroll margin ကို
      ပေးရပါတယ်။ [[mark:draw-snap-stop]] child မှာ ပေးတဲ့ scroll snap stop ကို always ထားရင်၊
      မြန်မြန် ပွတ်ဆွဲလည်း အဲဒီ child ကို ကျော်မသွားပါဘူး။ [[mark:draw-sticky-tip]] sticky header
      အောက်က ခေါင်းစဉ်ကို link နဲ့ သွားတဲ့အခါ၊ page မှာ scroll padding top ဒါမှမဟုတ် ခေါင်းစဉ်မှာ
      scroll margin top ပေးထားရင်၊ ခေါင်းစဉ်က header နောက်မှာ မပုန်းတော့ပါဘူး။
      [[mark:draw-mandatory-warn]] mandatory ကိုတော့ screen သေးတွေမှာ စမ်းကြည့်ပါ။ container ထက်
      ကြီးတဲ့ child ရှိရင် တချို့ အပိုင်းကို ရောက်ဖို့ ခက်နိုင်ပါတယ်။
    sources:
      - title: "MDN — scroll-margin"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/scroll-margin"
      - title: "MDN — scroll-padding"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/scroll-padding"
      - title: "MDN — scroll-snap-stop"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/scroll-snap-stop"
      - title: "CSS Scroll Snap Module Level 1 — snapping with mandatory can hide content"
        url: "https://drafts.csswg.org/css-scroll-snap-1/#valdef-scroll-snap-type-mandatory"
    actions:
      - id: open-sides
        type: whiteboard.apply
        at: { mark: open-sides }
        open: true
        clear: true
        upsertIds: [g-title]
      - id: draw-container-side
        type: whiteboard.apply
        at: { mark: draw-container-side }
        upsertIds: [g-cont-h, g-cont-1, g-cont-2]
        drawMs: 1800
      - id: draw-child-side
        type: whiteboard.apply
        at: { mark: draw-child-side }
        upsertIds: [g-child-h, g-child-1, g-child-2]
        drawMs: 1800
      - id: draw-snap-stop
        type: whiteboard.apply
        at: { mark: draw-snap-stop }
        upsertIds: [g-child-3]
        drawMs: 1400
      - id: draw-sticky-tip
        type: whiteboard.apply
        at: { mark: draw-sticky-tip }
        upsertIds: [g-sticky-1, g-sticky-2]
        drawMs: 2200
      - id: draw-mandatory-warn
        type: whiteboard.apply
        at: { mark: draw-mandatory-warn }
        upsertIds: [g-warn]
        drawMs: 1600

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:open-quiz]] မပြီးခင် မေးခွန်း တစ်ခု မေးကြည့်ရအောင်။ overflow မှာ hidden ပြီးမှ scroll
      လို့ ရေးရင်၊ ဘယ် axis က hidden ဖြစ်မလဲ။ [[mark:quiz-answer]] အဖြေက ဘယ်ညာ axis ပါ။ တန်ဖိုး
      နှစ်ခု ပေးရင် x က အရင် လာလို့ပါ။ [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ overflow ကို parent မှာ
      ပေးရပါတယ်။ visible က အကုန် ပြပြီး၊ ကျန်တဲ့ တန်ဖိုးတွေက ဖြတ်ပါတယ်။ scroll ကို လုံးဝ ပိတ်တာက
      clip ပဲ ဖြစ်ပါတယ်။ scroll လုပ်တဲ့ axis ဘေးက visible က auto ဖြစ်သွားပါတယ်။ scroll container
      ကို keyboard နဲ့ ရောက်နိုင်အောင် လုပ်ပြီး၊ scroll snap အတွက် type ကို container မှာ၊ align
      ကို child တစ်ခုစီမှာ ပေးပါ။ [[mark:next-lesson]] နောက် lesson မှာတော့ ရတဲ့ နေရာနဲ့
      ကိုက်အောင် layout ပြောင်းတဲ့ component တွေကို media query နဲ့ container query နဲ့
      ကြည့်သွားပါမယ်။ စာကြောင်း ရှည်ကို အစက် သုံးစက်နဲ့ ဖြတ်ပြတာကိုတော့ lesson 31 မှာ ကြည့်ပါမယ်။
    sources:
      - title: "web.dev Learn CSS — Overflow: check your understanding"
        url: "https://web.dev/learn/css/overflow#check_your_understanding"
      - title: "web.dev Learn CSS — Overflow"
        url: "https://web.dev/learn/css/overflow"
      - title: "web.dev Learn CSS — Container queries (next lesson)"
        url: "https://web.dev/learn/css/container-queries"
    actions:
      - id: open-quiz
        type: whiteboard.apply
        at: { mark: open-quiz }
        open: true
        clear: true
        upsertIds: [h-title, h-q, h-q2]
      - id: draw-quiz-answer
        type: whiteboard.apply
        at: { mark: quiz-answer }
        upsertIds: [h-a, h-a-check, h-rule]
        drawMs: 2000
      - id: expect-final-css
        type: expect.file
        at: { mark: recap }
        path: styles.css
        contains: ".reviews {\n  height: 160px;\n  border: 2px solid tan;\n  padding: 12px;\n  overflow: hidden;\n  overflow: scroll;\n  overflow: auto;\n  overflow: clip;\n  overflow-y: visible;\n  overflow-x: hidden;\n  overflow: hidden auto;\n}\n\n[role=\"region\"][aria-labelledby][tabindex] {\n  outline: 2px dashed seagreen;\n}\n\n"
      - id: expect-final-css-2
        type: expect.file
        at: { afterAction: expect-final-css }
        path: styles.css
        contains: ".menu-strip {\n  display: flex;\n  gap: 12px;\n  overflow-x: auto;\n  scroll-snap-type: x mandatory;\n  scroll-padding-inline: 24px;\n}\n\n.menu-strip .menu-card {\n  flex: 0 0 80%;\n  scroll-snap-align: start;\n  scroll-margin-inline-start: 24px;\n}\n"

checks:
  - { type: timing.p95Ms, max: 300 }
