runtime:
  kind: rust-playground
  defaultMode: fixture
  fixture:
    latencyMs: 600
    result:
      status: success
      stdout: "inside the braces

        s2 = hello, s3 = hello world

        n = 5, m = 5\n"
      stderr: ""

scenes:
  - id: memory
    chapter: memory ကို ဘယ်သူ ပြန်လွှတ်လဲ
    narration: >-
      program တိုင်းဟာ သူ မလိုတော့တဲ့ memory ကို ပြန်လွှတ်ပေးရပါတယ်။ တချို့ ဘာသာစကားတွေကတော့ ဒါအတွက်
      garbage collector ကို သုံးပါတယ်။ C language မှာဆိုရင် free ကို ကိုယ်တိုင် ခေါ်ရပါတယ်။ Rust
      ကတော့ တတိယ နည်းလမ်း တစ်ခုကို သုံးပြီး၊ အဲဒီ နည်းလမ်းကို ownership လို့ ခေါ်ပါတယ်။ ဒီ ownership
      ကို ကိုယ့် program run မလုပ်ခင် compiler က ကြိုစစ်ပေးပါတယ်။ [[mark:draw-stack]] n လို i32
      တစ်ခုက အရွယ်အစား ပုံသေ ရှိတဲ့အတွက်၊ stack ပေါ်မှာ သိမ်းထားပါတယ်။ [[mark:draw-string]] String
      ကတော့ ကြီးလာနိုင်တဲ့အတွက်၊ stack ပေါ်က s1 ထဲမှာ pointer တစ်ခု၊ အရှည် တစ်ခုနဲ့ capacity တစ်ခုပဲ
      ထည့်ထားပါတယ်။ [[mark:draw-heap]] စာသား အစစ်ကတော့ heap ပေါ်မှာ ရှိပြီး၊ pointer က အဲဒီ
      စာသားဆီကို ညွှန်ထားတာပါ။ [[mark:draw-owner]] s1 က အဲဒီ စာသားကို ပိုင်ဆိုင်တယ်၊ s1 က owner ပါ။
      တန်ဖိုး တစ်ခုမှာ တစ်ချိန်မှာ owner တစ်ယောက်ပဲ ရှိနိုင်ပါတယ်။ [[mark:draw-drop]] owner က scope
      ကုန်သွားတဲ့အခါ၊ Rust က အဲဒီ တန်ဖိုးကို drop လုပ်ပြီး memory ကို ပြန်လွှတ်ပါတယ်။ ဒါကြောင့်
      garbage collector လည်း မလိုသလို၊ free ကို ခေါ်ဖို့ မေ့သွားစရာလည်း မရှိတော့ပါဘူး။
    sources:
      - title: "The Rust Book — What Is Ownership? (The Stack and the Heap)"
        url: "https://doc.rust-lang.org/book/ch04-01-what-is-ownership.html#the-stack-and-the-heap"
      - title: "The Rust Book — Ownership Rules"
        url: "https://doc.rust-lang.org/book/ch04-01-what-is-ownership.html#ownership-rules"
      - title: "The Rust Book — Data Types (integer types)"
        url: "https://doc.rust-lang.org/book/ch03-02-data-types.html#integer-types"
      - title: "The Rust Book — Memory and Allocation"
        url: "https://doc.rust-lang.org/book/ch04-01-what-is-ownership.html#memory-and-allocation"
    actions:
      # Opens in the quiet handle before the first word, already titled.
      - id: open-board-memory
        type: whiteboard.apply
        at: { scene: start, offsetMs: -1500 }
        open: true
        upsertIds: [m-title]
      - id: draw-stack
        type: whiteboard.apply
        at: { mark: draw-stack }
        upsertIds: [m-stack, m-stack-line, m-n-box, m-n-text]
        drawMs: 1600
      - id: draw-string
        type: whiteboard.apply
        at: { mark: draw-string }
        upsertIds: [m-s1-box, m-s1-name, m-s1-parts]
        drawMs: 1500
      - id: draw-heap
        type: whiteboard.apply
        at: { mark: draw-heap }
        upsertIds: [m-heap, m-heap-line, m-arrow, m-heap-box, m-heap-text]
        drawMs: 2000
      - id: draw-owner
        type: whiteboard.apply
        at: { mark: draw-owner }
        upsertIds: [m-owner-circle, m-owner]
        drawMs: 1400
      - id: draw-drop
        type: whiteboard.apply
        at: { mark: draw-drop }
        upsertIds: [m-drop]
        drawMs: 1500

  - id: scope
    chapter: Scope နဲ့ drop
    narration: >-
      ဒါကို code နဲ့ ကြည့်ရအောင်။ [[mark:select-from]] ဒီ String ရဲ့ from က double quote ထဲက
      စာသားကနေ String တစ်ခု တည်ဆောက်ပေးတာပါ။ [[mark:select-scope]] ဒီ အတွင်းဘက်က တွန့်ကွင်း တစ်စုံက
      scope တစ်ခုကို သတ်မှတ်ပေးတာပါ။ inner ဆိုတဲ့ variable ကို ကြေညာထားတဲ့ နေရာကနေ စပြီး၊ တွန့်ကွင်း
      ပိတ်တဲ့ နေရာအထိ သုံးလို့ ရပါတယ်။ [[mark:type-drop]] အဲဒီ တွန့်ကွင်း ပိတ်တဲ့ နေရာ ရောက်တော့
      inner က scope ကုန်သွားပါတယ်၊ ဒါကို comment လေးနဲ့ မှတ်ထားလိုက်ရအောင်။ အဲဒီနေရာမှာပဲ Rust က
      drop ကို ကိုယ့်အစား ခေါ်ပေးပြီး၊ heap ပေါ်က memory ကို ပြန်လွှတ်လိုက်ပါတယ်။
    sources:
      - title: "The Rust Book — Variable Scope"
        url: "https://doc.rust-lang.org/book/ch04-01-what-is-ownership.html#variable-scope"
      - title: "The Rust Book — Memory and Allocation"
        url: "https://doc.rust-lang.org/book/ch04-01-what-is-ownership.html#memory-and-allocation"
      - title: "std::ops::Drop"
        url: "https://doc.rust-lang.org/std/ops/trait.Drop.html"
    actions:
      - id: close-board-memory
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-main
        type: workspace.openFile
        at: { scene: start, offsetMs: 900 }
        path: main.rs
      - id: select-from
        type: editor.select
        at: { mark: select-from }
        target:
          file: main.rs
          text: "String::from"
          occurrence: 1
      # Sweeps the inner block line by line, brace to brace: the scope.
      - id: select-scope
        type: editor.select
        at: { mark: select-scope }
        target:
          file: main.rs
          text: "{

            \        let inner = String::from(\"inside the braces\");

            \        println!(\"{inner}\");

            \    }"
          occurrence: 1
      - id: type-drop
        type: editor.type
        at: { mark: type-drop }
        target:
          file: main.rs
          after: "        println!(\"{inner}\");\n    }"
          occurrence: 1
        cadence: natural
        text: " // inner is dropped here"

  - id: move
    chapter: String တစ်ခု move ဖြစ်ခြင်း
    narration: >-
      [[mark:type-s1]] အခု s1 ဆိုတဲ့ String တစ်ခု လုပ်ကြည့်ရအောင်။ [[mark:type-move]] ပြီးတော့ အဲဒီ
      s1 ကို s2 ဆိုတဲ့ variable အသစ် တစ်ခုထဲ ထည့်လိုက်ပါမယ်။ တခြား ဘာသာစကား အများစုမှာဆိုရင်
      ဒီအချိန်မှာ စာသား တစ်ခုတည်းအတွက် နာမည် နှစ်ခု ရသွားမှာပါ။ [[mark:show-move]] Rust မှာတော့
      ဒီလို မဟုတ်ပါဘူး။ String က s2 ဆီ move ဖြစ်သွားပြီး၊ s1 ကို ဆက်သုံးလို့ မရတော့ပါဘူး။ s1 ကို
      ထပ်သုံးကြည့်ရင် compiler က E0382 error နဲ့ ရပ်သွားပါလိမ့်မယ်။
    sources:
      - title: "The Rust Book — Variables and Data Interacting with Move"
        url:
          "https://doc.rust-lang.org/book/ch04-01-what-is-ownership.html#variables-and-data-interacting-\
          with-move"
    actions:
      - id: type-s1
        type: editor.type
        at: { mark: type-s1, offsetMs: -400 }
        target:
          file: main.rs
          after: "    } // inner is dropped here\n"
          occurrence: 1
        cadence: line-by-line
        text: "

          \    let s1 = String::from(\"hello\");\n"
      - id: type-move
        type: editor.type
        at: { mark: type-move }
        target:
          file: main.rs
          after: "    let s1 = String::from(\"hello\");\n"
          occurrence: 1
        cadence: natural
        text: "    let s2 = s1;\n"
      - id: show-move
        type: slide.show
        at: { mark: show-move }
        slideId: move-slide

  - id: why-move
    narration: >-
      ဒါဆို Rust က ဘာကြောင့် ဒီလို လုပ်ရတာလဲ။ [[mark:draw-copy]] s1 ကို s2 ထဲ ထည့်လိုက်တဲ့အခါ၊ s2
      ထဲကို ကူးသွားတာက pointer၊ အရှည်နဲ့ capacity ပဲ ဖြစ်ပြီး၊ heap ပေါ်က စာသားကိုတော့ မကူးပါဘူး။
      [[mark:draw-twice]] အဲဒီအခါ variable နှစ်ခုက memory တစ်နေရာတည်းကို ညွှန်နေပါပြီ။ main
      အဆုံးရောက်တဲ့အခါ Rust က အဲဒီ memory ကို နှစ်ကြိမ် ပြန်လွှတ်မိမှာပါ။ အဲဒီ bug ကို double free
      လို့ ခေါ်ပါတယ်။ [[mark:draw-strike]] ဒါကြောင့် Rust က အဲဒီအစား s1 ကို သုံးလို့ မရအောင်
      လုပ်လိုက်တာပါ။ စာသားကို s2 တစ်ခုတည်းက ပိုင်ဆိုင်ပြီး၊ memory ကိုလည်း s2 တစ်ခုတည်းကပဲ
      ပြန်လွှတ်ပါတယ်။
    sources:
      - title: "The Rust Book — Variables and Data Interacting with Move"
        url:
          "https://doc.rust-lang.org/book/ch04-01-what-is-ownership.html#variables-and-data-interacting-\
          with-move"
    actions:
      - id: close-move-slide
        type: slide.close
        at: { scene: start }
      - id: open-board-move
        type: whiteboard.apply
        at: { scene: start, offsetMs: 300 }
        open: true
        clear: true
        upsertIds:
          [
            mv-title,
            m-stack,
            m-stack-line,
            m-heap,
            m-heap-line,
            mv-s1-box,
            mv-s1-text,
            mv-arrow1,
            mv-heap-box,
            mv-heap-text,
          ]
      - id: draw-copy
        type: whiteboard.apply
        at: { mark: draw-copy }
        upsertIds: [mv-s2-box, mv-s2-text, mv-arrow2]
        drawMs: 1800
      - id: draw-twice
        type: whiteboard.apply
        at: { mark: draw-twice }
        upsertIds: [mv-heap-circle, mv-twice]
        drawMs: 1600
      - id: draw-strike
        type: whiteboard.apply
        at: { mark: draw-strike }
        upsertIds: [mv-strike, mv-s2-circle, mv-owner]
        drawMs: 2200

  - id: compiler-error
    narration: >-
      ဒါဆို s1 ကို တကယ် ထပ်သုံးကြည့်ရင် compiler က ဘာ ပြောမလဲ ကြည့်ရအောင်။ [[mark:draw-error-code]]
      ဒီမှာ move ဖြစ်ပြီးမှ s1 ကို print ထုတ်တဲ့ စာကြောင်း တစ်ကြောင်း ရှိပါတယ်။
      [[mark:draw-error-msg]] compiler ရဲ့ အဖြေက E0382 error ပါ၊ move ဖြစ်သွားပြီးသား တန်ဖိုး s1 ကို
      borrow လုပ်နေတယ်တဲ့။ print ထုတ်ဖို့ s1 ကို ဖတ်ရပြီး၊ အဲဒီလို ဖတ်တာမျိုးကို Rust က borrow လို့
      ခေါ်ပါတယ်၊ borrow ဆိုတာ ငှားသုံးတာပါ။ [[mark:draw-error-note]] error message က move
      ဖြစ်သွားတဲ့ နေရာကို ညွှန်ပြပြီး၊ ဘာကြောင့်လဲ ဆိုတာကိုပါ ပြောပြထားပါတယ်။ String က Copy trait
      ကို implement မလုပ်ထားလို့ပါတဲ့။ trait ဆိုတာ type တစ်ခု လုပ်နိုင်တဲ့ စွမ်းရည်တွေကို
      နာမည်ပေးထားတာပါ။ [[mark:draw-error-help]] ပြင်နည်းကိုတောင် help စာကြောင်းမှာ
      အကြံပေးထားပါသေးတယ်။ တန်ဖိုးကို clone လုပ်လိုက်ပါတဲ့။
    sources:
      - title: "Rust error codes — E0382"
        url: "https://doc.rust-lang.org/error_codes/E0382.html"
      - title: "The Rust Book — Defining Shared Behavior with Traits"
        url: "https://doc.rust-lang.org/book/ch10-02-traits.html"
    actions:
      - id: open-board-error
        type: whiteboard.apply
        at: { scene: start }
        clear: true
        upsertIds: [er-title]
      - id: draw-error-code
        type: whiteboard.apply
        at: { mark: draw-error-code }
        upsertIds: [er-code1, er-code2]
        drawMs: 1400
      - id: draw-error-msg
        type: whiteboard.apply
        at: { mark: draw-error-msg }
        upsertIds: [er-borrow-line, er-borrow-label, er-msg]
        drawMs: 2600
      - id: draw-error-note
        type: whiteboard.apply
        at: { mark: draw-error-note }
        upsertIds: [er-moved-line, er-moved-label, er-note1, er-note2]
        drawMs: 2400
      - id: draw-error-help
        type: whiteboard.apply
        at: { mark: draw-error-help }
        upsertIds: [er-help, er-fix]
        drawMs: 1800

  - id: copy-clone
    chapter: Copy နဲ့ clone
    narration: >-
      [[mark:show-copy]] ဒါဆို ဘယ် type တွေက move မဖြစ်ဘဲ copy ကူးသွားလဲ။ i32၊ bool နဲ့ char လို
      type တွေက Copy type တွေပါ။ ဒီ type တွေက သေးသေးလေးတွေ ဖြစ်ပြီး stack ပေါ်မှာပဲ ရှိတဲ့အတွက်၊
      ကူးရတာ ဘာမှ မကုန်သလောက်ပါပဲ။ ဒါကြောင့် ဒီလို တန်ဖိုး တစ်ခုကို variable အသစ်ထဲ ထည့်လိုက်ရင်
      copy တစ်ခု ထပ်ရသွားပြီး၊ နာမည် နှစ်ခုလုံး ဆက်သုံးလို့ ရပါတယ်။ String နဲ့ Vec လို heap ကို
      သုံးတဲ့ type တွေကတော့ copy မကူးဘဲ move ဖြစ်သွားပါတယ်။ Vec ဆိုတာ ကြီးလာနိုင်တဲ့ စာရင်း တစ်ခုပါ။
      String တစ်ခုကို တကယ် နှစ်ခု လိုချင်ရင်တော့ clone ကို ခေါ်ရပါတယ်။
    sources:
      - title: "The Rust Book — Stack-Only Data: Copy"
        url: "https://doc.rust-lang.org/book/ch04-01-what-is-ownership.html#stack-only-data-copy"
      - title: "std::marker::Copy"
        url: "https://doc.rust-lang.org/std/marker/trait.Copy.html"
      - title: "std::vec::Vec"
        url: "https://doc.rust-lang.org/std/vec/struct.Vec.html"
    actions:
      - id: close-board-error
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: show-copy
        type: slide.show
        at: { mark: show-copy, offsetMs: 300 }
        slideId: copy-slide

  - id: clone
    narration: >-
      [[mark:type-clone]] editor ထဲ ပြန်သွားရအောင်။ s3 ကို s2 ရဲ့ clone အဖြစ် လုပ်ပြီး၊ အဲဒီ s3 ကို
      ပြောင်းကြည့်ပါမယ်။ push str က String ရဲ့ အဆုံးမှာ စာသား ထပ်ဖြည့်ပေးတာပါ။ ဒါက s3 ကို
      ပြောင်းလိုက်တာ ဖြစ်လို့၊ s3 မှာ mut လိုပါတယ်။ [[mark:select-clone]] clone က heap ပေါ်က
      စာသားကိုပါ ကူးပေးတဲ့အတွက်၊ s3 မှာ သူ့ကိုယ်ပိုင် memory ရှိသွားပါတယ်။ s2 ကလည်း ဆက်သုံးလို့
      ရနေပါသေးတယ်၊ ဘာကြောင့်လဲဆိုတော့ clone က s2 ကို ဖတ်ရုံပဲ ဖတ်တာ ဖြစ်လို့ပါ။ ဒီလို ကူးရတာက တကယ်
      အလုပ် ကုန်တာ ဖြစ်လို့၊ ကိုယ် တောင်းမှပဲ Rust က လုပ်ပေးပါတယ်။
    sources:
      - title: "The Rust Book — Variables and Data Interacting with Clone"
        url:
          "https://doc.rust-lang.org/book/ch04-01-what-is-ownership.html#variables-and-data-interacting-\
          with-clone"
      - title: "std::string::String::push_str"
        url: "https://doc.rust-lang.org/std/string/struct.String.html#method.push_str"
    actions:
      - id: close-copy-slide
        type: slide.close
        at: { scene: start }
      - id: type-clone
        type: editor.type
        at: { mark: type-clone, offsetMs: 500 }
        target:
          file: main.rs
          after: "    let s2 = s1;\n"
          occurrence: 1
        cadence: line-by-line
        text: "

          \    let mut s3 = s2.clone();

          \    s3.push_str(\" world\");

          \    println!(\"s2 = {s2}, s3 = {s3}\");\n"
      - id: select-clone
        type: editor.select
        at: { mark: select-clone }
        target:
          file: main.rs
          text: "s2.clone()"
          occurrence: 1

  - id: copy
    narration: >-
      [[mark:type-copy]] အခု i32 တစ်ခုကိုလည်း အဲဒီနည်းအတိုင်း ထည့်ကြည့်ရအောင်။ [[mark:select-copy]]
      m က n ရဲ့ copy တစ်ခု ရသွားပါတယ်။ ဒီမှာ heap memory ဆိုတာ မရှိတဲ့အတွက်၊ နှစ်ကြိမ်
      ပြန်လွှတ်မိစရာလည်း ဘာမှ မရှိပါဘူး။ ဒါကြောင့် i32 က Copy type ဖြစ်တာပါ။ n ကလည်း ဆက်သုံးလို့
      ရနေတဲ့အတွက်၊ print ထုတ်လို့ ရပါသေးတယ်။
    sources:
      - title: "The Rust Book — Stack-Only Data: Copy"
        url: "https://doc.rust-lang.org/book/ch04-01-what-is-ownership.html#stack-only-data-copy"
    actions:
      - id: type-copy
        type: editor.type
        at: { mark: type-copy, offsetMs: -400 }
        target:
          file: main.rs
          after: "    println!(\"s2 = {s2}, s3 = {s3}\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "

          \    let n = 5;

          \    let m = n;

          \    println!(\"n = {n}, m = {m}\");\n"
      - id: select-copy
        type: editor.select
        at: { mark: select-copy }
        target:
          file: main.rs
          text: "let m = n;"
          occurrence: 1

  - id: run
    narration: >-
      [[mark:run]] ကဲ၊ run ကြည့်ရအောင်။ ပထမ စာကြောင်းက တွန့်ကွင်းထဲက println ကနေ ထွက်လာတာ ဖြစ်ပြီး၊
      inner ကို drop မလုပ်ခင် print ထုတ်ထားတာပါ။ s2 က hello အတိုင်း ရှိနေပြီး၊ သူ့ clone ဖြစ်တဲ့ s3
      ကတော့ hello world ဖြစ်နေပါတယ်။ n နဲ့ m ကတော့ နှစ်ခုလုံး 5 ပါ။
    sources:
      - title: "The Rust Book — What Is Ownership?"
        url: "https://doc.rust-lang.org/book/ch04-01-what-is-ownership.html"
    actions:
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "s2 = hello, s3 = hello world"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: "let mut s3 = s2.clone();"

  - id: wrap
    narration: >-
      ဒါဆို ပြန်ချုပ်ရရင်၊ တန်ဖိုး တစ်ခုမှာ တစ်ချိန်မှာ owner တစ်ယောက်ပဲ ရှိပြီး၊ owner က scope
      ကုန်သွားတဲ့အခါ အဲဒီ တန်ဖိုးကို drop လုပ်ပါတယ်။ String တစ်ခုကို တခြား variable ထဲ ထည့်လိုက်ရင်
      move ဖြစ်သွားပြီး၊ Copy type တွေကတော့ copy ထပ်ရသွားပြီး၊ clone ကတော့ တကယ့် copy တစ်ခု
      ကူးပေးပါတယ်။ နောက် lesson မှာတော့ reference နဲ့ borrowing၊ ဆိုလိုတာက function တစ်ခုက တန်ဖိုး
      တစ်ခုကို မယူဘဲ ဘယ်လို သုံးနိုင်လဲ ဆိုတာကို ကြည့်သွားပါမယ်။
    sources:
      - title: "The Rust Book — Understanding Ownership"
        url: "https://doc.rust-lang.org/book/ch04-00-understanding-ownership.html"
      - title: "The Rust Book — References and Borrowing"
        url: "https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html"
    actions: []

checks:
  # 500 (not 300): google-svg deck slides embed per-slide font data whose
  # paint briefly stalls the main thread at each show/close.
  - { type: timing.p95Ms, max: 500 }
