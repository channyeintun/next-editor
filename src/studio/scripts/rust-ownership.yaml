build:
  voiceProfile: pocket-alba-v1
  seed: 42

runtime:
  kind: rust-playground
  defaultMode: fixture
  fixture:
    latencyMs: 600
    result:
      status: success
      stdout: "inside the braces\ns2 = hello, s3 = hello world\nn = 5, m = 5\n"
      stderr: ""

scenes:
  - id: memory
    chapter: Who frees the memory?
    narration: >
      Every program has to give back memory it no longer needs. Some
      languages use a garbage collector. In C, you call free yourself. Rust
      uses a third way, called ownership, and the compiler checks it before
      your program runs.
      [[mark:draw-stack]] An i32 like n has a fixed size, so it's stored on
      the stack.
      [[mark:draw-string]] A String can grow, so s1 on the stack holds only a
      pointer, a length, and a capacity.
      [[mark:draw-heap]] The text itself lives on the heap, and the pointer
      points to it.
      [[mark:draw-owner]] s1 is the owner of that text. A value has only one
      owner at a time.
      [[mark:draw-drop]] When the owner goes out of scope, Rust drops the
      value and frees its memory. No garbage collector, and no free call to
      forget.
    sources:
      - title: "The Rust Book — What Is Ownership? (The Stack and the Heap)"
        url: "https://doc.rust-lang.org/book/ch04-01-what-is-ownership.html#the-stack-and-the-heap"
      - title: "The Rust Book — Ownership Rules"
        url: "https://doc.rust-lang.org/book/ch04-01-what-is-ownership.html#ownership-rules"
      - title: "The Rust Book — Data Types (integer types)"
        url: "https://doc.rust-lang.org/book/ch03-02-data-types.html#integer-types"
      - title: "The Rust Book — Memory and Allocation"
        url: "https://doc.rust-lang.org/book/ch04-01-what-is-ownership.html#memory-and-allocation"
    actions:
      # Opens in the quiet handle before the first word, already titled.
      - id: open-board-memory
        type: whiteboard.apply
        at: { scene: start, offsetMs: -1500 }
        open: true
        upsertIds: [m-title]
      - id: draw-stack
        type: whiteboard.apply
        at: { mark: draw-stack }
        upsertIds: [m-stack, m-stack-line, m-n-box, m-n-text]
        drawMs: 1600
      - id: draw-string
        type: whiteboard.apply
        at: { mark: draw-string }
        upsertIds: [m-s1-box, m-s1-name, m-s1-parts]
        drawMs: 1500
      - id: draw-heap
        type: whiteboard.apply
        at: { mark: draw-heap }
        upsertIds: [m-heap, m-heap-line, m-arrow, m-heap-box, m-heap-text]
        drawMs: 2000
      - id: draw-owner
        type: whiteboard.apply
        at: { mark: draw-owner }
        upsertIds: [m-owner-circle, m-owner]
        drawMs: 1400
      - id: draw-drop
        type: whiteboard.apply
        at: { mark: draw-drop }
        upsertIds: [m-drop]
        drawMs: 1500

  - id: scope
    chapter: Scope and drop
    narration: >
      Let's see that in code.
      [[mark:select-from]] String::from builds a String from the text in
      quotes.
      [[mark:select-scope]] These inner curly braces make a scope. The
      variable inner is valid from where it's declared, down to the closing
      brace.
      [[mark:type-drop]] At that brace, inner goes out of scope. Rust calls
      drop for you right there, and the heap memory is freed.
    sources:
      - title: "The Rust Book — Variable Scope"
        url: "https://doc.rust-lang.org/book/ch04-01-what-is-ownership.html#variable-scope"
      - title: "The Rust Book — Memory and Allocation"
        url: "https://doc.rust-lang.org/book/ch04-01-what-is-ownership.html#memory-and-allocation"
      - title: "std::ops::Drop"
        url: "https://doc.rust-lang.org/std/ops/trait.Drop.html"
    actions:
      - id: close-board-memory
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-main
        type: workspace.openFile
        at: { scene: start, offsetMs: 900 }
        path: main.rs
      - id: select-from
        type: editor.select
        at: { mark: select-from }
        target:
          file: main.rs
          text: "String::from"
          occurrence: 1
      # Sweeps the inner block line by line, brace to brace: the scope.
      - id: select-scope
        type: editor.select
        at: { mark: select-scope }
        target:
          file: main.rs
          text: "{\n        let inner = String::from(\"inside the braces\");\n        println!(\"{inner}\");\n    }"
          occurrence: 1
      - id: type-drop
        type: editor.type
        at: { mark: type-drop }
        target:
          file: main.rs
          after: "        println!(\"{inner}\");\n    }"
          occurrence: 1
        cadence: natural
        text: " // inner is dropped here"

  - id: move
    chapter: Moving a String
    narration: >
      [[mark:type-s1]] Now let's make a String called s1.
      [[mark:type-move]] Then let's assign it to a new variable, s2. In many
      languages, you'd now have two names for the same text.
      [[mark:show-move]] Not in Rust. The String moves to s2, and s1 isn't
      valid anymore. Use it again, and you get error E0382.
    sources:
      - title: "The Rust Book — Variables and Data Interacting with Move"
        url: "https://doc.rust-lang.org/book/ch04-01-what-is-ownership.html#variables-and-data-interacting-with-move"
    actions:
      - id: type-s1
        type: editor.type
        at: { mark: type-s1, offsetMs: -400 }
        target:
          file: main.rs
          after: "    } // inner is dropped here\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n    let s1 = String::from(\"hello\");\n"
      - id: type-move
        type: editor.type
        at: { mark: type-move }
        target:
          file: main.rs
          after: "    let s1 = String::from(\"hello\");\n"
          occurrence: 1
        cadence: natural
        text: "    let s2 = s1;\n"
      - id: show-move
        type: slide.show
        at: { mark: show-move }
        slideId: move-slide

  - id: why-move
    narration: >
      So why does Rust do this? [[mark:draw-copy]] The assignment copies the
      pointer, the length, and the capacity into s2, but not the heap text.
      [[mark:draw-twice]] Now two variables point at the same memory. At the
      end of main, Rust would free it twice. That bug is called a double
      free.
      [[mark:draw-strike]] So Rust makes s1 invalid instead. Only s2 owns the
      text, and only s2 frees it.
    sources:
      - title: "The Rust Book — Variables and Data Interacting with Move"
        url: "https://doc.rust-lang.org/book/ch04-01-what-is-ownership.html#variables-and-data-interacting-with-move"
    actions:
      - id: close-move-slide
        type: slide.close
        at: { scene: start }
      - id: open-board-move
        type: whiteboard.apply
        at: { scene: start, offsetMs: 300 }
        open: true
        clear: true
        upsertIds:
          [
            mv-title,
            m-stack,
            m-stack-line,
            m-heap,
            m-heap-line,
            mv-s1-box,
            mv-s1-text,
            mv-arrow1,
            mv-heap-box,
            mv-heap-text,
          ]
      - id: draw-copy
        type: whiteboard.apply
        at: { mark: draw-copy }
        upsertIds: [mv-s2-box, mv-s2-text, mv-arrow2]
        drawMs: 1800
      - id: draw-twice
        type: whiteboard.apply
        at: { mark: draw-twice }
        upsertIds: [mv-heap-circle, mv-twice]
        drawMs: 1600
      - id: draw-strike
        type: whiteboard.apply
        at: { mark: draw-strike }
        upsertIds: [mv-strike, mv-s2-circle, mv-owner]
        drawMs: 2200

  - id: compiler-error
    narration: >
      What does the compiler say if you try?
      [[mark:draw-error-code]] Here's a print of s1, after the move.
      [[mark:draw-error-msg]] The answer is error E0382, borrow of moved value
      s1. Printing reads s1, and Rust calls that kind of read a borrow.
      [[mark:draw-error-note]] The message points at the move, and says why.
      String doesn't implement the Copy trait. A trait names something a type
      can do.
      [[mark:draw-error-help]] It even suggests a fix. Clone the value.
    sources:
      - title: "Rust error codes — E0382"
        url: "https://doc.rust-lang.org/error_codes/E0382.html"
      - title: "The Rust Book — Defining Shared Behavior with Traits"
        url: "https://doc.rust-lang.org/book/ch10-02-traits.html"
    actions:
      - id: open-board-error
        type: whiteboard.apply
        at: { scene: start }
        clear: true
        upsertIds: [er-title]
      - id: draw-error-code
        type: whiteboard.apply
        at: { mark: draw-error-code }
        upsertIds: [er-code1, er-code2]
        drawMs: 1400
      - id: draw-error-msg
        type: whiteboard.apply
        at: { mark: draw-error-msg }
        upsertIds: [er-borrow-line, er-borrow-label, er-msg]
        drawMs: 2600
      - id: draw-error-note
        type: whiteboard.apply
        at: { mark: draw-error-note }
        upsertIds: [er-moved-line, er-moved-label, er-note1, er-note2]
        drawMs: 2400
      - id: draw-error-help
        type: whiteboard.apply
        at: { mark: draw-error-help }
        upsertIds: [er-help, er-fix]
        drawMs: 1800

  - id: copy-clone
    chapter: Copy and clone
    narration: >
      [[mark:show-copy]] So which types copy instead of moving? Types like
      i32, bool, and char are Copy. They're small and live only on the stack,
      so copying them costs almost nothing. Assigning one duplicates it, and
      both names stay valid. Heap types like String and Vec move instead. A
      Vec is a growable list. When you really want a second String, call
      clone.
    sources:
      - title: "The Rust Book — Stack-Only Data: Copy"
        url: "https://doc.rust-lang.org/book/ch04-01-what-is-ownership.html#stack-only-data-copy"
      - title: "std::marker::Copy"
        url: "https://doc.rust-lang.org/std/marker/trait.Copy.html"
      - title: "std::vec::Vec"
        url: "https://doc.rust-lang.org/std/vec/struct.Vec.html"
    actions:
      - id: close-board-error
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: show-copy
        type: slide.show
        at: { mark: show-copy, offsetMs: 300 }
        slideId: copy-slide

  - id: clone
    narration: >
      [[mark:type-clone]] Back in the editor, let's make s3 a clone of s2,
      then change it. push_str adds text to the end of a String. That changes
      s3, so s3 needs mut. [[mark:select-clone]] clone copies the heap text
      too, so s3 gets its own memory. And s2 stays valid, because clone only
      reads it. Copying takes real work, so Rust only does it when you ask.
    sources:
      - title: "The Rust Book — Variables and Data Interacting with Clone"
        url: "https://doc.rust-lang.org/book/ch04-01-what-is-ownership.html#variables-and-data-interacting-with-clone"
      - title: "std::string::String::push_str"
        url: "https://doc.rust-lang.org/std/string/struct.String.html#method.push_str"
    actions:
      - id: close-copy-slide
        type: slide.close
        at: { scene: start }
      - id: type-clone
        type: editor.type
        at: { mark: type-clone, offsetMs: 500 }
        target:
          file: main.rs
          after: "    let s2 = s1;\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n    let mut s3 = s2.clone();\n    s3.push_str(\" world\");\n    println!(\"s2 = {s2}, s3 = {s3}\");\n"
      - id: select-clone
        type: editor.select
        at: { mark: select-clone }
        target:
          file: main.rs
          text: "s2.clone()"
          occurrence: 1

  - id: copy
    narration: >
      [[mark:type-copy]] Now let's assign an i32 the same way.
      [[mark:select-copy]] m gets a copy of n. There's no heap memory here, so
      nothing can be freed twice. That's why i32 is Copy. And n stays valid,
      so we can still print it.
    sources:
      - title: "The Rust Book — Stack-Only Data: Copy"
        url: "https://doc.rust-lang.org/book/ch04-01-what-is-ownership.html#stack-only-data-copy"
    actions:
      - id: type-copy
        type: editor.type
        at: { mark: type-copy, offsetMs: -400 }
        target:
          file: main.rs
          after: "    println!(\"s2 = {s2}, s3 = {s3}\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n    let n = 5;\n    let m = n;\n    println!(\"n = {n}, m = {m}\");\n"
      - id: select-copy
        type: editor.select
        at: { mark: select-copy }
        target:
          file: main.rs
          text: "let m = n;"
          occurrence: 1

  - id: run
    narration: >
      [[mark:run]] Let's run it. The first line comes from inside the braces,
      before inner was dropped. s2 still says hello, and its clone says hello
      world. And n and m are both five.
    sources:
      - title: "The Rust Book — What Is Ownership?"
        url: "https://doc.rust-lang.org/book/ch04-01-what-is-ownership.html"
    actions:
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "s2 = hello, s3 = hello world"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: "let mut s3 = s2.clone();"

  - id: wrap
    narration: >
      So a value has one owner at a time, and it's dropped when its owner goes
      out of scope. Assigning a String moves it, Copy types are duplicated, and
      clone makes a real copy. Next, borrowing: how a function can use a value
      without taking it.
    sources:
      - title: "The Rust Book — Understanding Ownership"
        url: "https://doc.rust-lang.org/book/ch04-00-understanding-ownership.html"
      - title: "The Rust Book — References and Borrowing"
        url: "https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html"
    actions: []

checks:
  # 500 (not 300): google-svg deck slides embed per-slide font data whose
  # paint briefly stalls the main thread at each show/close.
  - { type: timing.p95Ms, max: 500 }
