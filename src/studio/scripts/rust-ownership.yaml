# Rust from zero, lesson 6: ownership.
#
# The arc: a whiteboard shows where values live (an i32 on the stack, a
# String's pointer/len/cap on the stack with its text on the heap) and the two
# ownership rules that matter here — one owner, dropped at the end of its
# scope. The editor then shows a scope and the drop point, builds a move
# (`let s2 = s1;`, deck page "Ownership moves"), and a second board explains
# WHY the move exists (two pointers to one heap buffer would be freed twice).
# A third board shows the broken line and the compiler's E0382 answer — the
# lesson is insert-only with one run, so the broken program is never typed.
# The deck page "Copy vs. clone" introduces the two ways to duplicate, and
# the editor builds both (clone + push_str to prove the copy is real, then an
# i32 copy). One run at the end.
#
# The E0382 text on the board was confirmed with rustc 1.98 (edition 2024) on
# the broken variant `let s2 = s1; println!("{s1}");`:
#   error[E0382]: borrow of moved value: `s1`
#   move occurs because `s1` has type `String`, which does not implement the `Copy` trait
#   value moved here / value borrowed here after move
#   help: consider cloning the value if the performance cost is acceptable
#         let s2 = s1.clone();
#
# Board colours: blue = stack variables (the things being named), orange = the
# heap / what moved, green = the valid owner and the fix, red = the error and
# the bug, violet = the result (drop frees the memory). #1e1e1e paints white.
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/rust-ownership.yaml
