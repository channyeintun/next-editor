build:
  # Studio replaces this built-in profile at render time with the Burmese provider chosen in the
  # render console (AthanLab with the user's own key, or VoxCPM2 when that feature is enabled).
  voiceProfile: pocket-alba-v1
  seed: 3108
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "Type ဆိုတာ တန်ဖိုး အစု"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ function တွေရဲ့ parameter နဲ့ return type ကို type ပေးပုံ
      ကြည့်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ type တစ်မျိုးထက် ပိုလက်ခံတဲ့ union type နဲ့၊ တန်ဖိုး တစ်ခုတည်းကိုပဲ
      လက်ခံတဲ့ literal type ကို ကြည့်သွားပါမယ်။ [[mark:draw-sets]] ဒါကို နားလည်ဖို့ type တစ်ခုကို
      တန်ဖိုးတွေ စုထားတဲ့ အစု တစ်ခုလို့ မြင်ကြည့်ပါ။ string type ဆိုတာ ဖြစ်နိုင်တဲ့ စာသား အားလုံးကို စုထားတဲ့
      အစုကြီး ဖြစ်ပြီး၊ number type ကတော့ ဂဏန်း အားလုံးရဲ့ အစုပါ။ တန်ဖိုး တစ်ခုကို type တစ်ခု ရှိရမယ့်
      နေရာမှာ ထည့်တဲ့အခါ၊ TypeScript က အဲဒီ တန်ဖိုးဟာ အစုထဲမှာ ပါလား ဆိုတာကို စစ်ပါတယ်။
      [[mark:draw-typo]] ပြဿနာက string အစုက အရမ်း ကြီးနေတာပါ။ သကြား အဆင့်ကို string လို့ ကြေညာထားရင်၊
      စာလုံး ပေါင်းမှားနေတဲ့ စာသားလည်း အဲဒီ အစုထဲမှာ ပါနေလို့ TypeScript က ဘာမှ မပြောနိုင်ပါဘူး။
      [[mark:draw-want]] ကိုယ် တကယ် လိုချင်တာက သကြား အဆင့် သုံးမျိုးပဲ ပါတဲ့ အစု သေးသေးလေးပါ။ ဒီလို type
      ကို ဘယ်လို ရေးမလဲ ဆိုတာ ဒီ lesson မှာ ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 5: Unions, Literals, and Narrowing",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/unions-literals-and-narrowing",
        }
      - {
          title: "TypeScript Handbook: Everyday Types (union types, literal types)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#union-types",
        }
    actions:
      - id: open-board-a
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-sets
        type: whiteboard.apply
        at: { mark: draw-sets }
        upsertIds:
          [
            a-str-set,
            a-str-name,
            a-str-v1,
            a-str-v2,
            a-str-v3,
            a-str-v4,
            a-num-set,
            a-num-name,
            a-num-v1,
            a-num-v2,
            a-num-v3,
          ]
        drawMs: 4400
      - id: draw-typo
        type: whiteboard.apply
        at: { mark: draw-typo }
        upsertIds: [a-typo]
        drawMs: 800
      - id: draw-want
        type: whiteboard.apply
        at: { mark: draw-want }
        upsertIds: [a-want]
        drawMs: 1600

  - id: starter
    narration: >
      [[mark:close-board]] ဒီနေ့ code ကို ကြည့်ရအောင်။ [[mark:open-order]] ဒါက အော်ဒါ စာကြောင်းရဲ့ အပိုင်းတွေကို
      ရေးပေးတဲ့ ဖိုင်ပါ။ [[mark:select-drinks]] အပေါ်ဆုံး နှစ်ကြောင်းက ဆိုင်ရဲ့ ပူတဲ့ သောက်စရာတွေနဲ့ အေးတဲ့
      သောက်စရာတွေကို နာမည်နဲ့ စာရင်းလုပ်ထားတဲ့ type တွေပါ။ ဒီ ရေးပုံကို နောက်မှ ရှင်းပြပါမယ်။
      [[mark:select-cup]] ခွက် label ကို ရေးတဲ့ function က ပူတဲ့ သောက်စရာကိုပဲ လက်ခံပြီး၊
      [[mark:select-seat]] နေရာ label ကို ရေးတဲ့ function ကတော့ စားပွဲ နံပါတ်ကို number အနေနဲ့ လက်ခံပါတယ်။
      [[mark:select-sugar-type]] အောက်က comment မှာ သကြား အဆင့် သုံးမျိုး ရှိတယ်လို့ ရေးထားပေမယ့်၊ type
      ကတော့ string ဖြစ်နေပါတယ်။ [[mark:select-sugar-fn]] function က နည်းနည်း ဆိုရင် တစ်ဇွန်း၊ များများ
      ဆိုရင် သုံးဇွန်း ထည့်ပြီး၊ ကျန်တာ အားလုံးကို နှစ်ဇွန်းလို့ ယူပါတယ်။ [[mark:open-main]] main ဖိုင်မှာ
      အော်ဒါ နှစ်ခု ရှိပါတယ်။ [[mark:select-mya]] မြမြက စားပွဲ ၅ မှာ လက်ဖက်ရည် သကြား နည်းနည်းနဲ့
      မှာပြီး၊ [[mark:select-aung]] အောင်အောင်ကတော့ သံပုရာရည်ကို ပါဆယ် ယူမယ်၊ သကြား များများ ထည့်ပါ လို့
      မှာထားပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 5: Unions, Literals, and Narrowing",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/unions-literals-and-narrowing",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: open-order
        type: workspace.openFile
        at: { mark: open-order }
        path: src/order.ts
      - id: select-drinks
        type: editor.select
        at: { mark: select-drinks }
        target:
          {
            file: src/order.ts,
            text: "export type HotDrink = \"လက်ဖက်ရည်\" | \"ကော်ဖီ\";\nexport type ColdDrink = \"သံပုရာရည်\" | \"လက်ဖက်ရည်အေး\";",
            occurrence: 1,
          }
      - id: select-cup
        type: editor.select
        at: { mark: select-cup }
        target: { file: src/order.ts, text: "cupLabel(drink: HotDrink)", occurrence: 1 }
      - id: select-seat
        type: editor.select
        at: { mark: select-seat }
        target: { file: src/order.ts, text: "seatLabel(seat: number)", occurrence: 1 }
      - id: select-sugar-type
        type: editor.select
        at: { mark: select-sugar-type }
        target:
          {
            file: src/order.ts,
            text: "// သကြား အဆင့် သုံးမျိုး: less, normal, extra\nexport type Sugar = string;",
            occurrence: 1,
          }
      - id: select-sugar-fn
        type: editor.select
        at: { mark: select-sugar-fn }
        target:
          {
            file: src/order.ts,
            text: "  if (sugar === \"less\") spoons = 1;\n  if (sugar === \"extra\") spoons = 3;",
            occurrence: 1,
          }
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: src/main.ts
      - id: select-mya
        type: editor.select
        at: { mark: select-mya }
        target:
          {
            file: src/main.ts,
            text: 'cupLabel("လက်ဖက်ရည်"), seatLabel(5), sugarLabel("less")',
            occurrence: 1,
          }
      - id: select-aung
        type: editor.select
        at: { mark: select-aung }
        target:
          {
            file: src/main.ts,
            text: 'cupLabel("သံပုရာရည်"), seatLabel("ပါဆယ်"), sugarLabel("exta")',
            occurrence: 1,
          }

  - id: symptoms
    narration: >
      [[mark:panel-ready]] ညာဘက် panel ရဲ့ Errors အပိုင်းမှာ error နှစ်ခု ပြနေပါတယ်။ ပထမ တစ်ခုက
      သံပုရာရည်ကို HotDrink type နေရာမှာ ထည့်လို့ မရဘူး၊ ဒုတိယ တစ်ခုက string ကို number နေရာမှာ ထည့်လို့
      မရဘူး လို့ ပြောနေပါတယ်။ [[mark:read-output]] Output ကိုလည်း ကြည့်ပါ။ အောင်အောင် မှာထားတာက သကြား
      များများ ဖြစ်ပေမယ့် ဇွန်း နှစ်ဇွန်းပဲ ထွက်နေပါတယ်။ ဒီ ပြဿနာအတွက်တော့ error တစ်ခုမှ မရှိပါဘူး။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 5: Unions, Literals, and Narrowing",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/unions-literals-and-narrowing",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-two-errors
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-cold-error
        type: expect.preview
        at: { afterAction: expect-two-errors }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: 'Argument of type ''"သံပုရာရည်"'' is not assignable to parameter of type ''HotDrink''.'
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-seat-error
        type: expect.preview
        at: { afterAction: expect-cold-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-2 }
        textContains: "Argument of type 'string' is not assignable to parameter of type 'number'."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-two-spoons
        type: expect.preview
        at: { afterAction: expect-seat-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-2 }
        textContains: "နေရာ ပါဆယ် သကြား 2 ဇွန်း"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: union
    chapter: "Union type"
    narration: >
      [[mark:select-seat-call]] နေရာကနေ စကြည့်ရအောင်။ ပါဆယ် ယူတဲ့ customer မှာ စားပွဲ နံပါတ် မရှိလို့ ပါဆယ်
      ဆိုတဲ့ စာသားကို ပေးထားပါတယ်။ ဒါပေမဲ့ function က number ကိုပဲ လက်ခံလို့ error ဖြစ်နေတာပါ။
      [[mark:open-order-1]] ဒါကြောင့် ဒီ parameter က number ဖြစ်လည်း ရတယ်၊ string ဖြစ်လည်း ရတယ် လို့
      ပြောပေးရပါမယ်။ [[mark:type-union]] number ရဲ့ နောက်မှာ pipe လို့ ခေါ်တဲ့ ဒေါင်လိုက် မျဉ်း သင်္ကေတနဲ့ string ကို
      ထည့်ပါမယ်။ [[mark:read-union]] ဒုတိယ error ပျောက်သွားပါပြီ။ ဒီလို type တွေကို pipe နဲ့
      ဆက်ထားတာကို union type လို့ ခေါ်ပါတယ်။ ဆိုလိုတာက ဒီ တန်ဖိုးဟာ number ဖြစ်ဖြစ်၊ string ဖြစ်ဖြစ်
      ရပါတယ်။ ခုနက ပုံနဲ့ ပြောရရင်၊ number အစုနဲ့ string အစုကို ပေါင်းထားတဲ့ အစုကြီးပါ။ union ထဲက type
      တစ်ခုချင်းစီကိုတော့ member လို့ ခေါ်ပြီး၊ member တွေက ဘယ်လို type မဆို ဖြစ်လို့ ရပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 5: Unions, Literals, and Narrowing (union types)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/unions-literals-and-narrowing",
        }
      - {
          title: "TypeScript Handbook: Everyday Types (union types)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#union-types",
        }
    actions:
      - id: select-seat-call
        type: editor.select
        at: { mark: select-seat-call }
        target: { file: src/main.ts, text: 'seatLabel("ပါဆယ်")', occurrence: 1 }
      - id: open-order-1
        type: workspace.openFile
        at: { mark: open-order-1 }
        path: src/order.ts
      - id: select-seat-param
        type: editor.select
        at: { afterAction: open-order-1 }
        target: { file: src/order.ts, text: "seat: number", occurrence: 1 }
      - id: type-union
        type: editor.type
        at: { mark: type-union }
        target: { file: src/order.ts, after: "seat: number", occurrence: 1 }
        text: " | string"
      - id: expect-one-error
        type: expect.preview
        at: { afterAction: type-union }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-cold-left
        type: expect.preview
        at: { afterAction: expect-one-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-code, value: "2345" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: literal
    chapter: "Literal type"
    narration: >
      [[mark:open-main-1]] အခု သကြား ပြဿနာကို ကြည့်ရအောင်။ အောင်အောင် လိုချင်တာက များများ ဖြစ်ပေမယ့်၊
      စာလုံး တစ်လုံး ကျနေလို့ function က ဘယ် အဆင့်နဲ့မှ မကိုက်ဘဲ နှစ်ဇွန်းကို ပြန်ပေးနေတာပါ။ type က string
      ဖြစ်နေတဲ့အတွက် TypeScript က ဘာစာသားမဆို လက်ခံပါတယ်။ [[mark:open-order-2]] ဒါကြောင့် သကြား type ကို
      တကယ် ရှိတဲ့ အဆင့် သုံးမျိုးနဲ့ပဲ ပြန်ရေးပါမယ်။ [[mark:type-literal]] string အစား less ရယ်၊ normal ရယ်၊
      extra ရယ် ဆိုတဲ့ စာသား သုံးခုကို union နဲ့ ပေါင်းထားတဲ့ line အသစ်ကို ရေးပြီး၊ line အဟောင်းကို
      comment လုပ်ပြီး ပိတ်ထားပါမယ်။ [[mark:read-literal-error]] ချက်ချင်း error အသစ် တစ်ခု ပေါ်လာပါပြီ။
      စာလုံး ပေါင်းမှားနေတဲ့ သကြား အဆင့်ကို Sugar type နေရာမှာ ထည့်လို့ မရဘူးလို့ ပြောနေပါတယ်။ error ထဲမှာ
      argument ရဲ့ type ကို string လို့ မပြောဘဲ၊ quote ထဲက စာသားအတိုင်း ပြထားတာကို သတိထား ကြည့်ပါ။
      [[mark:explain-literal]] ဒါကို literal type လို့ ခေါ်ပါတယ်။ literal type ဆိုတာ တန်ဖိုး တစ်ခုတည်းကိုပဲ
      လက်ခံတဲ့ type ပါ။ ဒါကြောင့် Sugar ဆိုတာ literal type သုံးခုကို ပေါင်းထားတဲ့ union ဖြစ်ပြီး၊ ဒီ သုံးခုထဲက
      တစ်ခု မဟုတ်ရင် လက်မခံပါဘူး။ VS Code မှာဆိုရင် ဒီလို argument ကို ရိုက်တဲ့အခါ ဒီ သုံးခုကို autocomplete
      က စာရင်းနဲ့ ပြပေးပါတယ်။ ကိုယ့် editor မှာ စမ်းကြည့်ပါ။ [[mark:type-typo]] main ဖိုင်မှာ ကျနေတဲ့ စာလုံးကို
      ထည့်လိုက်ပါမယ်။ [[mark:read-typo]] error ပျောက်ပြီး၊ အောင်အောင်ရဲ့ သံပုရာရည်မှာ သကြား သုံးဇွန်း
      ဖြစ်သွားပါပြီ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 5: Unions, Literals, and Narrowing (literal types)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/unions-literals-and-narrowing",
        }
      - {
          title: "TypeScript Handbook: Everyday Types (literal types)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#literal-types",
        }
    actions:
      - id: open-main-1
        type: workspace.openFile
        at: { mark: open-main-1 }
        path: src/main.ts
      - id: select-exta
        type: editor.select
        at: { afterAction: open-main-1 }
        target: { file: src/main.ts, text: 'sugarLabel("exta")', occurrence: 1 }
      - id: open-order-2
        type: workspace.openFile
        at: { mark: open-order-2 }
        path: src/order.ts
      - id: type-literal
        type: editor.type
        at: { mark: type-literal }
        target:
          { file: src/order.ts, after: "// သကြား အဆင့် သုံးမျိုး: less, normal, extra\n", occurrence: 1 }
        text: "export type Sugar = \"less\" | \"normal\" | \"extra\";\n// "
        cadence: block
      - id: expect-literal-count
        type: expect.preview
        at: { afterAction: type-literal }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-literal-error
        type: expect.preview
        at: { afterAction: expect-literal-count }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-2 }
        textContains: 'Argument of type ''"exta"'' is not assignable to parameter of type ''Sugar''.'
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: select-literals
        type: editor.select
        at: { mark: explain-literal }
        target: { file: src/order.ts, text: '"less" | "normal" | "extra"', occurrence: 1 }
      - id: open-main-2
        type: workspace.openFile
        at: { mark: type-typo }
        path: src/main.ts
      - id: type-typo
        type: editor.type
        at: { afterAction: open-main-2 }
        target: { file: src/main.ts, after: 'sugarLabel("ext', occurrence: 1 }
        text: "r"
      - id: expect-typo-fixed
        type: expect.preview
        at: { afterAction: type-typo }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-three-spoons
        type: expect.preview
        at: { afterAction: expect-typo-fixed }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-2 }
        textContains: "နေရာ ပါဆယ် သကြား 3 ဇွန်း"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: union-of-unions
    chapter: "Union တွေကို ပေါင်းခြင်း"
    narration: >
      [[mark:open-order-3]] ကျန်နေတဲ့ error ကို ကြည့်ရအောင်။ [[mark:select-drinks-2]] အပေါ်ဆုံးက type
      နှစ်ခုကို အခု ပြန်ကြည့်ရင်၊ နှစ်ခုလုံး သောက်စရာ နာမည် literal type တွေကို ပေါင်းထားတဲ့ union တွေ
      ဖြစ်တာ တွေ့ရပါမယ်။ [[mark:select-cup-param]] ခွက် label function က HotDrink ကိုပဲ လက်ခံလို့၊
      သံပုရာရည်ကို ထည့်တော့ error ဖြစ်နေတာပါ။ [[mark:type-cold]] ဒါကြောင့် ColdDrink ကိုပါ union ထဲကို
      ဆက်ထည့်ပါမယ်။ [[mark:read-cold]] Errors အပိုင်းမှာ error တစ်ခုမှ မကျန်တော့ပါဘူး။ [[mark:board-flat]]
      ဒီလို union နှစ်ခုကို ပေါင်းလိုက်ရင်၊ union ထဲမှာ union ရှိနေတာ မဟုတ်ပါဘူး။ ပုံမှာ ပြထားသလို
      TypeScript က member တွေ အားလုံးကို တစ်တန်းတည်း ဖြန့်ချပြီး၊ သောက်စရာ လေးမျိုး ပါတဲ့ union တစ်ခုတည်း
      ဖြစ်သွားပါတယ်။ [[mark:board-flat-why]] ဒါကြောင့် ဒီ function က ပူတဲ့ သောက်စရာ နှစ်မျိုးရော၊ အေးတဲ့
      သောက်စရာ နှစ်မျိုးကိုပါ လက်ခံပါတယ်။ နေရာ အများကြီးမှာ သုံးမယ်ဆိုရင်တော့ ဒီ union ကို Drink လိုမျိုး
      နာမည် တစ်ခုနဲ့ type alias လုပ်ထားလို့လည်း ရပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 5: Unions, Literals, and Narrowing (combining unions with unions)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/unions-literals-and-narrowing",
        }
      - {
          title: "TypeScript Handbook: Everyday Types (working with union types)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#working-with-union-types",
        }
    actions:
      - id: open-order-3
        type: workspace.openFile
        at: { mark: open-order-3 }
        path: src/order.ts
      - id: select-drinks-2
        type: editor.select
        at: { mark: select-drinks-2 }
        target:
          {
            file: src/order.ts,
            text: "export type HotDrink = \"လက်ဖက်ရည်\" | \"ကော်ဖီ\";\nexport type ColdDrink = \"သံပုရာရည်\" | \"လက်ဖက်ရည်အေး\";",
            occurrence: 1,
          }
      - id: select-cup-param
        type: editor.select
        at: { mark: select-cup-param }
        target: { file: src/order.ts, text: "drink: HotDrink", occurrence: 1 }
      - id: type-cold
        type: editor.type
        at: { mark: type-cold }
        target: { file: src/order.ts, after: "drink: HotDrink", occurrence: 1 }
        text: " | ColdDrink"
      - id: expect-no-errors
        type: expect.preview
        at: { afterAction: type-cold }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: board-flat
        type: whiteboard.apply
        at: { mark: board-flat }
        open: true
        clear: true
        upsertIds:
          [
            c-title,
            c-hot-box,
            c-hot-name,
            c-hot-v1,
            c-hot-v2,
            c-cold-box,
            c-cold-name,
            c-cold-v1,
            c-cold-v2,
            c-arrow-1,
            c-arrow-2,
            c-all-box,
            c-all-name,
            c-all-v1,
            c-all-v2,
            c-all-v3,
            c-all-v4,
          ]
        drawMs: 5000

  - id: wider-narrower
    chapter: "ကျယ်တဲ့ type နဲ့ ကျဉ်းတဲ့ type"
    narration: >
      [[mark:board-nested]] အခု type တွေကြားက ဆက်ဆံရေး တစ်ခုကို ပုံနဲ့ ကြည့်ရအောင်။ less ဆိုတဲ့ literal type
      က Sugar အစုထဲမှာ ပါပြီး၊ Sugar အစုကလည်း string အစုကြီးထဲမှာ ပါပါတယ်။ ဒါကြောင့် less က Sugar ထက်
      ကျဉ်းပြီး၊ Sugar က string ထက် ကျဉ်းပါတယ်။ [[mark:board-fits]] ကျဉ်းတဲ့ type ကို ကျယ်တဲ့ type ရှိရမယ့်
      နေရာမှာ ထည့်လို့ အမြဲ ရပါတယ်။ less ဆိုတဲ့ တန်ဖိုးကို Sugar နေရာမှာ ထည့်တာ၊ ၅ ဆိုတဲ့ ဂဏန်းကို number
      ဒါမှမဟုတ် string ရှိရမယ့် နေရာမှာ ထည့်တာတွေက ဒီ code ထဲမှာ ရှိပြီးသား ဥပမာတွေပါ။ [[mark:board-not]] ဒါပေမဲ့ ပြောင်းပြန်ကတော့
      မရပါဘူး။ string ဆိုတာ ဘာစာသားမဆို ဖြစ်နိုင်လို့၊ Sugar ရှိရမယ့် နေရာမှာ ထည့်ရင် TypeScript က
      လက်မခံပါဘူး။ union ကလည်း သူ့ member တစ်ခုချင်းစီထက် ကျယ်ပါတယ်။ ဒါကြောင့် number ဒါမှမဟုတ် string
      ဖြစ်နိုင်တဲ့ တန်ဖိုးကို number ပဲ လက်ခံတဲ့ နေရာမှာ ထည့်ရင်လည်း error ပြပါတယ်။ [[mark:close-nested]] code မှာ စမ်းကြည့်ရအောင်။ [[mark:type-form]] ဖောင်ကနေ ဝင်လာတဲ့
      တန်ဖိုးဟာ အမြဲ string ဖြစ်လို့၊ string type နဲ့ variable တစ်ခု ကြေညာပြီး လှလှရဲ့ သကြား အဆင့်အဖြစ်
      ပို့ကြည့်ပါမယ်။ [[mark:read-form]] တန်ဖိုးက less ဖြစ်ပေမယ့် error ပေါ်လာပါပြီ။ string ကို Sugar
      နေရာမှာ ထည့်လို့ မရဘူးလို့ ပြောနေပါတယ်။ TypeScript က တန်ဖိုးကို မကြည့်ဘဲ type ကိုပဲ ကြည့်လို့ပါ။
      [[mark:read-form-output]] Output မှာတော့ program က ပုံမှန်အတိုင်း run ပြီး လှလှအတွက် သကြား တစ်ဇွန်းလို့
      ပြနေပါတယ်။ ဒီ string ကို Sugar အဖြစ် လက်ခံနိုင်ဖို့ ကိုယ်တိုင် စစ်ပေးရမှာ ဖြစ်ပြီး၊ အဲဒီ နည်းကိုတော့
      နောက် lesson မှာ ကြည့်ပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 5: Unions, Literals, and Narrowing (wider vs narrower types)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/unions-literals-and-narrowing",
        }
      - {
          title: "TypeScript Handbook: Type Compatibility",
          url: "https://www.typescriptlang.org/docs/handbook/type-compatibility.html",
        }
      - {
          title: "MDN: HTMLInputElement value (always a string)",
          url: "https://developer.mozilla.org/en-US/docs/Web/API/HTMLInputElement/value",
        }
    actions:
      - id: board-nested
        type: whiteboard.apply
        at: { mark: board-nested }
        clear: true
        upsertIds:
          [b-title, b-string, b-string-name, b-sugar, b-sugar-name, b-less, b-normal, b-extra]
        drawMs: 3600
      - id: board-fits
        type: whiteboard.apply
        at: { mark: board-fits }
        upsertIds: [b-ok, b-ok-eg]
        drawMs: 1400
      - id: board-not
        type: whiteboard.apply
        at: { mark: board-not }
        upsertIds: [b-no, b-no-eg]
        drawMs: 1400
      - id: close-nested
        type: whiteboard.apply
        at: { mark: close-nested }
        open: false
      - id: open-main-3
        type: workspace.openFile
        at: { mark: type-form }
        path: src/main.ts
      - id: type-form
        type: editor.type
        at: { afterAction: open-main-3 }
        target: { file: src/main.ts, after: "sugarLabel(\"extra\"));\n", occurrence: 1 }
        text: "\n// ဖောင်ကနေ ဝင်လာတဲ့ တန်ဖိုးက အမြဲ string ပါ\nconst fromForm: string = \"less\";\nconsole.log(\"လှလှ\", sugarLabel(fromForm));\n"
        cadence: line-by-line
      - id: expect-form-count
        type: expect.preview
        at: { afterAction: type-form }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-form-error
        type: expect.preview
        at: { afterAction: expect-form-count }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Argument of type 'string' is not assignable to parameter of type 'Sugar'."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-form-output
        type: expect.preview
        at: { afterAction: expect-form-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-3 }
        textContains: "လှလှ သကြား 1 ဇွန်း"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-from-form
        type: editor.select
        at: { mark: read-form }
        target: { file: src/main.ts, text: "sugarLabel(fromForm)", occurrence: 1 }

  - id: recap
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ union type က type တွေကို pipe နဲ့ ဆက်ပြီး၊ ဒီ type ဒါမှမဟုတ်
      ဟို type ဖြစ်လို့ ရတယ်လို့ ပြောတာပါ။ literal type က တန်ဖိုး တစ်ခုတည်းကိုပဲ လက်ခံပြီး၊ literal type
      တွေကို union နဲ့ ပေါင်းရင် လက်ခံမယ့် တန်ဖိုး စာရင်း ဖြစ်လာပါတယ်။ [[mark:recap-wide]] union နှစ်ခုကို
      ပေါင်းရင် member အားလုံး ပါတဲ့ union တစ်ခုတည်း ဖြစ်သွားပြီး၊ ကျဉ်းတဲ့ type ကို ကျယ်တဲ့ type နေရာမှာ
      ထည့်လို့ ရပေမယ့် ပြောင်းပြန်ကတော့ မရပါဘူး။ နောက် lesson မှာတော့ ကျယ်တဲ့ type ကို စစ်ဆေးချက်တွေနဲ့
      ကျဉ်းသွားအောင် လုပ်တဲ့ narrowing ကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 5: Unions, Literals, and Narrowing",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/unions-literals-and-narrowing",
        }
      - {
          title: "TypeScript Handbook: Narrowing (next lesson)",
          url: "https://www.typescriptlang.org/docs/handbook/2/narrowing.html",
        }
    actions:
      - id: open-order-4
        type: workspace.openFile
        at: { mark: recap }
        path: src/order.ts
      - id: select-sugar-union
        type: editor.select
        at: { afterAction: open-order-4 }
        target:
          {
            file: src/order.ts,
            text: 'export type Sugar = "less" | "normal" | "extra";',
            occurrence: 1,
          }
      - id: select-drink-union
        type: editor.select
        at: { mark: recap-wide }
        target: { file: src/order.ts, text: "drink: HotDrink | ColdDrink", occurrence: 1 }
      - id: expect-file-union
        type: expect.file
        at: { afterAction: select-sugar-union }
        path: src/order.ts
        contains: "export function seatLabel(seat: number | string) {"
      - id: expect-file-literal
        type: expect.file
        at: { afterAction: expect-file-union }
        path: src/order.ts
        contains: "export type Sugar = \"less\" | \"normal\" | \"extra\";\n// export type Sugar = string;"
      - id: expect-file-cold
        type: expect.file
        at: { afterAction: expect-file-literal }
        path: src/order.ts
        contains: "export function cupLabel(drink: HotDrink | ColdDrink) {"
      - id: expect-file-typo
        type: expect.file
        at: { afterAction: expect-file-cold }
        path: src/main.ts
        contains: 'sugarLabel("extra"));'
      - id: expect-file-form
        type: expect.file
        at: { afterAction: expect-file-typo }
        path: src/main.ts
        contains: "const fromForm: string = \"less\";\nconsole.log(\"လှလှ\", sugarLabel(fromForm));"
checks:
  - { type: timing.p95Ms, max: 300 }
