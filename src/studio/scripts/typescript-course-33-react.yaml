      - id: expect-tea-button
        type: expect.preview
        at: { afterAction: expect-usage-code }
        timeoutMs: 5000
        target: { by: testId, value: tea }
        textContains: "လက်ဖက်ရည် 1500"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-zero-orders
        type: expect.preview
        at: { afterAction: expect-tea-button }
        timeoutMs: 5000
        target: { by: testId, value: orders }
        textContains: "အော်ဒါ 0 ခု"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: props
    chapter: "Props ကို type ပေးခြင်း"
    narration: >
      [[mark:open-components-2]] ပထမ error နှစ်ခုကနေ စပြင်ရအောင်။ [[mark:select-props]] ခလုတ် component ရဲ့
      props မှာ type မရှိလို့ name ရော price ပါ any ဖြစ်နေပါတယ်။ ဆိုလိုတာက ခလုတ်ကို သုံးတဲ့ နေရာမှာ ဈေးနှုန်းကို
      စာသားနဲ့ ပေးမိရင် ဖြစ်ဖြစ်၊ နာမည် ထည့်ဖို့ မေ့သွားရင် ဖြစ်ဖြစ်၊ TypeScript က ဘာမှ မပြောနိုင်ပါဘူး။
      [[mark:type-props-alias]] ဒါကြောင့် ဖိုင်ရဲ့ အပေါ်မှာ ဒီ component ရဲ့ props အတွက် type alias တစ်ခု
      ရေးပါမယ်။ name ကို string လို့၊ price ကို number လို့ သတ်မှတ်ထားပါတယ်။ component နာမည်ရဲ့ နောက်မှာ Props
      ဆိုတဲ့ စကားလုံး ထည့်ပြီး နာမည်ပေးတာက React project တွေမှာ အတွေ့ရ အများဆုံး ပုံစံပါ။
      [[mark:type-props-annotation]] ပြီးတော့ ခွဲထုတ်ထားတဲ့ props ရဲ့ နောက်မှာ အဲဒီ type ကို ကြေညာပေးလိုက်ပါမယ်။
      [[mark:read-props-fixed]] ပထမ error နှစ်ခု ပျောက်သွားပြီး၊ children အကြောင်း error နှစ်ခုပဲ ကျန်ပါတော့တယ်။
      အခုဆိုရင် ဒီ ခလုတ်ကို သုံးတဲ့ နေရာတိုင်းမှာ name နဲ့ price ပါမပါ၊ type မှန်မမှန်ကို TypeScript က စစ်ပေးပါပြီ။
    sources:
      - {
          title: "Total TypeScript: React with TypeScript tutorial (typing component props)",
          url: "https://www.totaltypescript.com/tutorials/react-with-typescript",
        }
      - {
          title: "React docs: Using TypeScript (typing component props)",
          url: "https://react.dev/learn/typescript#typing-component-props",
        }
    actions:
      - id: open-components-2
        type: workspace.openFile
        at: { mark: open-components-2 }
        path: src/components.tsx
      - id: select-props
        type: editor.select
        at: { mark: select-props }
        target: { file: src/components.tsx, text: "{ name, price, ...rest }", occurrence: 1 }
      - id: type-props-alias
        type: editor.type
        at: { mark: type-props-alias }
        target: { file: src/components.tsx, after: "// ဆိုင်ရဲ့ component တွေ\n\n", occurrence: 1 }
        text: "type MenuButtonProps = {\n  name: string;\n  price: number;\n};\n\n"
        cadence: line-by-line
      - id: type-props-annotation
        type: editor.type
        at: { mark: type-props-annotation }
        target:
          {
            file: src/components.tsx,
            after: "export function MenuButton({ name, price, ...rest }",
            occurrence: 1,
          }
        text: ": MenuButtonProps"
      - id: expect-two-left
        type: expect.preview
        at: { afterAction: type-props-annotation }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-children-first
        type: expect.preview
        at: { afterAction: expect-two-left }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Property 'children' does not exist on type 'CardProps'."
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: children
    chapter: "children နဲ့ ReactNode"
    narration: >
      [[mark:select-children]] အခု card component ကို ကြည့်ပါ။ props ထဲက children ကို ခွဲထုတ်ယူထားပေမယ့်၊
      props type မှာ children မပါလို့ ဒီ property မရှိဘူးလို့ error ပြနေပါတယ်။ [[mark:read-children-usage]]
      နောက်ဆုံး error ကတော့ main ဖိုင်မှာ card ကို သုံးထားတဲ့ နေရာကပါ။ JSX မှာ tag အဖွင့်နဲ့ အပိတ်ကြားမှာ
      ရေးထားတဲ့ အရာတွေကို React က children ဆိုတဲ့ prop တစ်ခုအနေနဲ့ ပို့ပေးလို့၊ panel ထဲက props object မှာလည်း
      children ပါနေတာ မြင်ရပါတယ်။ [[mark:type-children]] ဒါကြောင့် card ရဲ့ props type ထဲမှာ children ကို
      ထည့်ပြီး၊ type ကို React ရဲ့ ReactNode လို့ ပေးပါမယ်။ ReactNode ဆိုတာ JSX element တွေ၊ စာသား၊ ဂဏန်း၊ null
      နဲ့ အဲဒါတွေရဲ့ list လိုမျိုး component တစ်ခုရဲ့ အထဲမှာ children အဖြစ် ထည့်လို့ ရတဲ့ အရာ အားလုံးကို
      ပေါင်းထားတဲ့ union type ပါ။ [[mark:read-children-fixed]] Errors အပိုင်းမှာ error တစ်ခုမှ မကျန်တော့ပါဘူး။ အခု card ထဲမှာ
      ကြိုက်တာကို ထည့်လို့ ရပါပြီ။
    sources:
      - {
          title: "React docs: Using TypeScript (typing children: React.ReactNode)",
          url: "https://react.dev/learn/typescript#typing-children",
        }
      - {
          title: "Total TypeScript: React with TypeScript tutorial (supporting children)",
          url: "https://www.totaltypescript.com/tutorials/react-with-typescript",
        }
    actions:
      - id: select-children
        type: editor.select
        at: { mark: select-children }
        target: { file: src/components.tsx, text: "{ title, children }", occurrence: 1 }
      - id: type-children
        type: editor.type
        at: { mark: type-children }
        target:
          { file: src/components.tsx, after: "type CardProps = { title: string", occurrence: 1 }
        text: "; children: React.ReactNode"
      - id: expect-no-errors
        type: expect.preview
        at: { afterAction: type-children }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: event
    chapter: "Event handler ရဲ့ type"
    narration: >
      [[mark:open-main-2]] အခု ခလုတ်ကို နှိပ်ရင် အော်ဒါ ဝင်လာအောင် လုပ်ကြည့်ရအောင်။ [[mark:type-handler]] App
      component ထဲမှာ click ကို handle လုပ်ပေးမယ့် function တစ်ခု ရေးပါမယ်။ ဒီ function က ခလုတ်ပေါ်က
      စာသားကို Output မှာ ထုတ်ပြပြီး၊ အော်ဒါ စာရင်းထဲကို လက်ဖက်ရည် တစ်ခွက် ထည့်ပေးပါတယ်။ click ဖြစ်တိုင်း
      React က event object တစ်ခုကို ဒီ function ဆီ ပို့ပေးပါတယ်။ function ကို သီးသန့် ရေးထားတဲ့အခါ ဘယ်ကနေ
      ခေါ်မလဲ ဆိုတာကို TypeScript က မသိလို့၊ parameter ရဲ့ type ကို ကိုယ်တိုင် ပေးရပါတယ်။
      [[mark:explain-mouse-event]] React ရဲ့ type တွေထဲမှာ event အမျိုးအစား တစ်ခုချင်းစီအတွက် type ရှိပြီး၊ click
      အတွက်ကတော့ MouseEvent ပါ။ angle bracket ထဲမှာတော့ ဘယ် element ရဲ့ event လဲ ဆိုတာကို button element လို့
      ပေးထားပါတယ်။ [[mark:select-current-target]] ဒါကြောင့် event ရဲ့ current target ဟာ button element ဖြစ်တယ်လို့
      TypeScript က သိပြီး၊ button element မှာ ရှိတဲ့ property တွေကို စိတ်ချ သုံးလို့ ရပါတယ်။
      onClick ထဲမှာ arrow function နဲ့ တိုက်ရိုက် ရေးရင်တော့၊ event ရဲ့ type
      ကို onClick ရဲ့ type ကနေ TypeScript က infer လုပ်ပေးလို့ ကိုယ်တိုင် ရေးစရာ မလိုပါဘူး။ [[mark:read-never]] ဒါပေမဲ့ အော်ဒါ စာရင်းထဲကို
      လက်ဖက်ရည် ထည့်တဲ့ line မှာ error နှစ်ခု ပေါ်လာပါပြီ။ Order ကို never type ရှိရမယ့် နေရာမှာ ထည့်လို့ မရဘူးလို့
      ပြောနေပါတယ်။
    sources:
      - {
          title: "React docs: Using TypeScript (typing DOM events)",
          url: "https://react.dev/learn/typescript#typing-dom-events",
        }
      - {
          title: "Total TypeScript: React with TypeScript tutorial (typing event handlers)",
          url: "https://www.totaltypescript.com/tutorials/react-with-typescript",
        }
    actions:
      - id: open-main-2
        type: workspace.openFile
        at: { mark: open-main-2 }
        path: src/main.tsx
      - id: type-handler
        type: editor.type
        at: { mark: type-handler }
        target:
          {
            file: src/main.tsx,
            after: "  const tea: Order = { item: \"လက်ဖက်ရည်\", price: 1500 };\n",
            occurrence: 1,
          }
        text: "  function handleOrder(event: React.MouseEvent<HTMLButtonElement>) {\n    console.log(\"မှာပြီ:\", event.currentTarget.textContent);\n    setOrders([...orders, tea]);\n  }\n"
        cadence: line-by-line
      - id: select-current-target
        type: editor.select
        at: { mark: select-current-target }
        target: { file: src/main.tsx, text: "event.currentTarget.textContent", occurrence: 1 }
      - id: expect-never-count
        type: expect.preview
        at: { afterAction: type-handler }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-never-text
        type: expect.preview
        at: { afterAction: expect-never-count }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Type 'Order' is not assignable to type 'never'."
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: state
    chapter: "useState နဲ့ ဗလာ array"
    narration: >
      [[mark:select-use-state]] never ဆိုတာ ဘယ်ကနေ ပေါ်လာတာလဲ။ ဒီလို နားလည်ရ ခက်တဲ့ error မျိုး တွေ့ရင် React
      ရဲ့ type ကိုယ်တိုင်ကို ဖတ်ကြည့်တာ အကောင်းဆုံးပါ။ [[mark:type-state-query]] use State ကို ခေါ်ထားတဲ့ line
      အောက်မှာ query comment ထည့်ကြည့်ရအောင်။ [[mark:read-state-type]] Types အပိုင်းမှာ use State ရဲ့ type
      ပေါ်လာပါပြီ။ use State က generic function ဖြစ်ပြီး၊
      angle bracket ထဲက type ဟာ state ရဲ့ type ပါ။ ကိုယ်က type argument မပေးထားလို့
      TypeScript က အစ တန်ဖိုးကို ကြည့်ပြီး infer လုပ်ရပါတယ်။ ဗလာ array က ဘာတွေ ထည့်မလဲ ဆိုတာကို ဘာမှ
      မပြောလို့၊ ဘာမှ ထည့်လို့ မရတဲ့ never array ဖြစ်သွားတာပါ။ [[mark:read-set-state]] နောက်ဆုံးက SetStateAction
      ကတော့ state ကို ပြင်တဲ့ function က တန်ဖိုး အသစ် ဒါမှမဟုတ် တန်ဖိုး အသစ်ကို တွက်ပေးမယ့် function ကို
      လက်ခံတယ် ဆိုတာကို React က နာမည်ပေးထားတာပါ။ state က never array ဖြစ်နေလို့ အဲဒီ function ကလည်း never array
      ကိုပဲ လက်ခံပါတယ်။ ဒါကြောင့် Order ပါတဲ့ array ကို ပေးလိုက်တော့ error ပြနေတာပါ။ [[mark:type-state-arg]] ဒါဆို use State ကို ခေါ်တဲ့အခါ state က Order
      array ဖြစ်မယ် ဆိုတာကို type argument နဲ့ ပြောပေးလိုက်ပါမယ်။ [[mark:read-state-fixed]] error နှစ်ခုလုံး
      ပျောက်သွားပြီး၊ Types မှာလည်း never နေရာမှာ Order array ဖြစ်သွားပါပြီ။ ဗလာ array ဒါမှမဟုတ် null နဲ့ စတဲ့
      state တွေမှာ ဒီလို type argument ကို ပေးဖို့ မှတ်ထားပါ။
    sources:
      - {
          title: "React docs: Using TypeScript (typing useState)",
          url: "https://react.dev/learn/typescript#typing-usestate",
        }
      - {
          title: "React docs: useState (setState with a value or an updater function)",
          url: "https://react.dev/reference/react/useState",
        }
      - {
          title: "TypeScript Handbook: Generics (type arguments)",
          url: "https://www.typescriptlang.org/docs/handbook/2/generics.html",
        }
      - {
          title: "Total TypeScript: React with TypeScript tutorial (typing hooks, reading React's types)",
          url: "https://www.totaltypescript.com/tutorials/react-with-typescript",
        }
    actions:
      - id: select-use-state
        type: editor.select
        at: { mark: select-use-state }
        target: { file: src/main.tsx, text: "useState([])", occurrence: 1 }
      - id: type-state-query
        type: editor.type
        at: { mark: type-state-query }
        target:
          {
            file: src/main.tsx,
            after: "  const [orders, setOrders] = useState([]);\n",
            occurrence: 1,
          }
        text: "  //                          ^?\n"
        cadence: block
      - id: expect-state-never
        type: expect.preview
        at: { afterAction: type-state-query }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        textContains: "useState<never[]>(initialState: never[] | (() => never[])): [never[], React.Dispatch<React.SetStateAction<never[]>>]"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-state-arg
        type: editor.type
        at: { mark: type-state-arg }
        target:
          { file: src/main.tsx, after: "  const [orders, setOrders] = useState", occurrence: 1 }
        text: "<Order[]>"
      - id: expect-state-fixed
        type: expect.preview
        at: { afterAction: type-state-arg }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-state-order
        type: expect.preview
        at: { afterAction: expect-state-fixed }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-1 }
        textContains: "useState<Order[]>(initialState: Order[] | (() => Order[])): [Order[], React.Dispatch<React.SetStateAction<Order[]>>]"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: button-props
    chapter: "Button ရဲ့ props တွေ"
    narration: >
      [[mark:type-onclick]] state ပြဿနာ ပြေလည်သွားပြီ ဆိုတော့၊ ရေးထားတဲ့ function ကို ခလုတ်ရဲ့ onClick မှာ
      ချိတ်ပေးပါမယ်။ ဒါမှ ခလုတ်ကို နှိပ်လိုက်တိုင်း React က ဒီ function ကို event object နဲ့အတူ ခေါ်ပေးမှာပါ။ [[mark:read-onclick-error]]
      error အသစ် တစ်ခု ပေါ်လာပါပြီ။ အောက်ဆုံး အပိုင်းကနေ ဖတ်ရင်၊ ခလုတ် component ရဲ့ props type မှာ onClick ဆိုတဲ့
      property မရှိဘူးလို့ ပြောနေပါတယ်။ ကိုယ့် props type မှာ name နဲ့ price နှစ်ခုပဲ ရေးထားလို့ပါ။ data testid
      လိုမျိုး dash ပါတဲ့ attribute တွေကိုတော့ JSX မှာ TypeScript က ချွင်းချက်အနေနဲ့ ခွင့်ပြုလို့ error မပြပါဘူး။
      [[mark:open-components-3]] onClick ရယ်၊ disabled ရယ်၊ title ရယ် လိုမျိုး button element တစ်ခု လက်ခံတဲ့ props
      တွေက အများကြီး ရှိလို့၊ တစ်ခုချင်း လိုက်ရေးနေရင်တော့ ဘယ်တော့မှ မပြီးနိုင်ပါဘူး။ [[mark:type-component-props]] ဒါကြောင့်
      React ရဲ့ ComponentProps ဆိုတဲ့ type ကို သုံးပြီး button element ရဲ့ props အားလုံးကို ယူလိုက်ပါမယ်။ ပြီးတော့
      intersection နဲ့ ကိုယ့်ရဲ့ name နဲ့ price ကို ပေါင်းထည့်ထားပါတယ်။ [[mark:read-props-merged]] error
      ပျောက်သွားပါပြီ။ အခု onClick က button ရဲ့ props ထဲက တစ်ခု ဖြစ်လို့ TypeScript က လက်ခံပြီး၊ program run တဲ့အခါ
      rest ထဲကို ဝင်လာပြီး button element ဆီ ရောက်သွားပါတယ်။
    sources:
      - {
          title: "Total TypeScript: React.ComponentProps type helper",
          url: "https://www.totaltypescript.com/react-component-props-type-helper",
        }
      - {
          title: "Total TypeScript: React with TypeScript tutorial (ComponentProps, overriding props)",
          url: "https://www.totaltypescript.com/tutorials/react-with-typescript",
        }
      - {
          title: "TypeScript Handbook: Object Types (intersection types)",
          url: "https://www.typescriptlang.org/docs/handbook/2/objects.html#intersection-types",
        }
      - {
          title: "TypeScript Handbook: JSX (attribute names that are not identifiers, such as data-*, are not checked)",
          url: "https://www.typescriptlang.org/docs/handbook/jsx.html#attribute-type-checking",
        }
    actions:
      - id: type-onclick
        type: editor.type
        at: { mark: type-onclick }
        target: { file: src/main.tsx, after: "        data-testid=\"tea\"\n", occurrence: 1 }
        text: "        onClick={handleOrder}\n"
      - id: expect-onclick-count
        type: expect.preview
        at: { afterAction: type-onclick }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-onclick-text
        type: expect.preview
        at: { afterAction: expect-onclick-count }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Property 'onClick' does not exist on type 'IntrinsicAttributes & MenuButtonProps'."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: open-components-3
        type: workspace.openFile
        at: { mark: open-components-3 }
        path: src/components.tsx
      - id: type-component-props
        type: editor.type
        at: { mark: type-component-props }
        target: { file: src/components.tsx, after: "type MenuButtonProps = ", occurrence: 1 }
        text: 'React.ComponentProps<"button"> & '
      - id: expect-merged
        type: expect.preview
        at: { afterAction: type-component-props }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-ready-to-click
        type: expect.preview
        at: { afterAction: expect-merged }
        timeoutMs: 5000
        target: { by: testId, value: orders }
        textContains: "အော်ဒါ 0 ခု"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: recap
    chapter: "နှိပ်ကြည့်ခြင်းနဲ့ ပြန်ချုပ်ခြင်း"
    narration: >
      [[mark:click-tea]] ဒါဆို ညာဘက်က လက်ဖက်ရည် ခလုတ်ကို နှိပ်ကြည့်ရအောင်။ [[mark:read-click]] အော်ဒါ
      တစ်ခု ဖြစ်သွားပြီး၊ Output မှာလည်း handler က ထုတ်ပြတဲ့ ခလုတ်ရဲ့ စာသား ပေါ်လာပါပြီ။
      [[mark:click-tea-again]] နောက်တစ်ခါ နှိပ်လိုက်တော့ အော်ဒါ နှစ်ခု ဖြစ်သွားပါတယ်။ state ထဲကို Order တွေ
      မှန်မှန် ဝင်နေတာပါ။ [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ React component ရဲ့ props ဆိုတာ function ရဲ့
      parameter ဖြစ်လို့ type alias နဲ့ type ပေးရပါတယ်။ အထဲ ထည့်ပေးတဲ့ အရာတွေအတွက် children ကို ReactNode လို့
      ပေးပြီး၊ သီးသန့် ရေးထားတဲ့ event handler မှာတော့ MouseEvent လိုမျိုး React ရဲ့ event type ကို ပေးရပါတယ်။
      [[mark:recap-state]] ဗလာ array နဲ့ စတဲ့ state မှာတော့ use State ကို type argument ပေးရပါတယ်။
      [[mark:recap-button]] HTML element တစ်ခုရဲ့ props တွေကိုတော့ ComponentProps နဲ့ တစ်ခါတည်း ယူသုံးလို့
      ရပါတယ်။ error က ရှုပ်နေရင် VS Code မှာ
      mouse တင်ကြည့်တာ၊ Go to Definition နဲ့ ဖွင့်ကြည့်တာမျိုးနဲ့ React ရဲ့ type ကို ဖတ်ကြည့်ပါ။ နောက်ဆုံး lesson
      မှာတော့ အတွေ့ရ အများဆုံး TypeScript error တွေကို ဘယ်လို ဖတ်ပြီး ဘယ်လို ပြင်ရလဲ ဆိုတာ ကြည့်ပြီး course ကို
      အဆုံးသတ်ပါမယ်။
    sources:
      - { title: "React docs: Using TypeScript", url: "https://react.dev/learn/typescript" }
      - {
          title: "Total TypeScript: React with TypeScript tutorial",
          url: "https://www.totaltypescript.com/tutorials/react-with-typescript",
        }
    actions:
      - id: click-tea
        type: preview.click
        at: { mark: click-tea }
        timeoutMs: 10000
        target: { by: testId, value: tea }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-one-order
        type: expect.preview
        at: { afterAction: click-tea }
        timeoutMs: 5000
        target: { by: testId, value: orders }
        textContains: "အော်ဒါ 1 ခု"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-click-output
        type: expect.preview
        at: { afterAction: expect-one-order }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-1 }
        textContains: "မှာပြီ: လက်ဖက်ရည် 1500"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: click-tea-again
        type: preview.click
        at: { mark: click-tea-again }
        timeoutMs: 10000
        target: { by: testId, value: tea }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-two-orders
        type: expect.preview
        at: { afterAction: click-tea-again }
        timeoutMs: 5000
        target: { by: testId, value: orders }
        textContains: "အော်ဒါ 2 ခု"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-two-output
        type: expect.preview
        at: { afterAction: expect-two-orders }
        timeoutMs: 5000
        target: { by: testId, value: ts-output }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-props-type
        type: editor.select
        at: { mark: recap }
        target:
          {
            file: src/components.tsx,
            text: "{ name, price, ...rest }: MenuButtonProps",
            occurrence: 1,
          }
      - id: select-component-props
        type: editor.select
        at: { mark: recap-button }
        target:
          { file: src/components.tsx, text: 'React.ComponentProps<"button"> & {', occurrence: 1 }
      - id: expect-file-props
        type: expect.file
        at: { afterAction: expect-two-output }
        path: src/components.tsx
        contains: "type MenuButtonProps = React.ComponentProps<\"button\"> & {\n  name: string;\n  price: number;\n};"
      - id: expect-file-children
        type: expect.file
        at: { afterAction: expect-file-props }
        path: src/components.tsx
        contains: "type CardProps = { title: string; children: React.ReactNode };"
      - id: expect-file-state
        type: expect.file
        at: { afterAction: expect-file-children }
        path: src/main.tsx
        contains: "const [orders, setOrders] = useState<Order[]>([]);"
      - id: expect-file-handler
        type: expect.file
        at: { afterAction: expect-file-state }
        path: src/main.tsx
        contains: "function handleOrder(event: React.MouseEvent<HTMLButtonElement>) {"
      - id: expect-file-onclick
        type: expect.file
        at: { afterAction: expect-file-handler }
        path: src/main.tsx
        contains: "        data-testid=\"tea\"\n        onClick={handleOrder}\n      />"
checks:
  - { type: timing.p95Ms, max: 300 }
