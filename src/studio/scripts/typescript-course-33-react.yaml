build:
  # Studio replaces this built-in profile at render time with the Burmese provider chosen in the
  # render console (AthanLab with the user's own key, or VoxCPM2 when that feature is enabled).
  voiceProfile: pocket-alba-v1
  seed: 3302
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "React component နဲ့ props"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ အပြင်ကနေ ဝင်လာတဲ့ data ကို Zod schema နဲ့ runtime မှာ စစ်ပြီး၊
      type ကိုလည်း အဲဒီ schema ကနေပဲ ထုတ်ယူခဲ့ပါတယ်။ ဒီ lesson မှာတော့ React နဲ့ TypeScript ကို တွဲသုံးပုံကို
      ဆိုင်ရဲ့ အော်ဒါ screen လေး တစ်ခုနဲ့ ကြည့်သွားပါမယ်။ [[mark:draw-jsx]] React မှာ component ဆိုတာ
      JavaScript ထဲမှာ HTML လို ရေးရတဲ့ JSX ကို ပြန်ပေးတဲ့ function တစ်ခုပါ။ JSX ထဲမှာ component ကို tag
      တစ်ခုလို ရေးပြီး၊ နာမည်တို့ ဈေးနှုန်းတို့ကို attribute တွေလို ပေးလိုက်တယ် ဆိုပါစို့။ [[mark:draw-fn]] React
      က အဲဒီ တန်ဖိုး အားလုံးကို object တစ်ခုထဲ စုပြီး component function ကို ခေါ်ပေးပါတယ်။ အဲဒီ object ကို
      props လို့ ခေါ်ပါတယ်။ ဆိုတော့ props ဆိုတာ function ရဲ့ parameter တစ်ခုပဲ ဖြစ်ပါတယ်။ [[mark:draw-rule]]
      ရှေ့ပိုင်း lesson တွေမှာ မြင်ခဲ့သလိုပဲ၊ parameter မှာ type မပေးထားရင် TypeScript က ဘာမှ မသိလို့ any လို့
      ယူဆပြီး၊ strict mode မှာ error ပြပါတယ်။ type ပေးထားရင်တော့ component ကို သုံးတဲ့ နေရာတိုင်းမှာ
      ပေးလိုက်တဲ့ props တွေ မှန်မမှန် စစ်ပေးနိုင်ပါပြီ။ [[mark:draw-agenda]] ဒီနေ့ props
      တင် မကဘဲ၊ component ထဲ ထည့်ပေးတဲ့ children ရယ်၊ click လိုမျိုး event ရယ်၊ use State နဲ့ သိမ်းတဲ့ state
      ရယ်၊ button element ရဲ့ props တွေကိုပါ type ပေးကြည့်ပါမယ်။
    sources:
      - {
          title: "Total TypeScript: React with TypeScript tutorial (props, children, events, hooks)",
          url: "https://www.totaltypescript.com/tutorials/react-with-typescript",
        }
      - {
          title: "React docs: Using TypeScript (typing component props)",
          url: "https://react.dev/learn/typescript",
        }
      - {
          title: "React docs: Passing Props to a Component",
          url: "https://react.dev/learn/passing-props-to-a-component",
        }
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [r-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-jsx
        type: whiteboard.apply
        at: { mark: draw-jsx }
        upsertIds: [r-jsx-box, r-jsx, r-jsx-note]
        drawMs: 2200
      - id: draw-fn
        type: whiteboard.apply
        at: { mark: draw-fn }
        upsertIds: [r-arrow, r-fn-box, r-fn, r-fn-note]
        drawMs: 2600
      - id: draw-rule
        type: whiteboard.apply
        at: { mark: draw-rule }
        upsertIds: [r-rule-any, r-rule-check]
        drawMs: 1800
      - id: draw-agenda
        type: whiteboard.apply
        at: { mark: draw-agenda }
        upsertIds: [r-agenda]
        drawMs: 1600

  - id: starter
    narration: >
      [[mark:close-board]] ဒီနေ့ code ကို ကြည့်ရအောင်။ [[mark:open-components]] ဒါက ဆိုင်ရဲ့ component တွေကို
      ရေးထားတဲ့ ဖိုင်ပါ။ [[mark:select-menu-button]] ပထမ component က menu ထဲက ပစ္စည်း တစ်ခုရဲ့ နာမည်နဲ့
      ဈေးနှုန်းကို ခလုတ်ပေါ်မှာ ပြပေးပါတယ်။ props ထဲက name နဲ့ price ကို ခွဲထုတ်ယူထားပေမယ့်၊ type တော့
      မပေးထားသေးပါဘူး။ [[mark:select-rest]] ကျန်တဲ့ props တွေကိုတော့ rest ဆိုတဲ့ နာမည်နဲ့ စုယူပြီး၊ အထဲက button
      element ဆီ အကုန် ဆက်ပို့ပေးထားပါတယ်။ [[mark:select-card]] ဒုတိယ component ကတော့ ခေါင်းစဉ် တစ်ခုနဲ့
      သူ့အထဲမှာ ထည့်ပေးတဲ့ အရာတွေကို အုပ်စု တစ်ခုအဖြစ် ပြပေးတဲ့ card ပါ။ သူ့ props type မှာတော့ ခေါင်းစဉ်ပဲ
      ရှိပါသေးတယ်။ [[mark:open-main]] main ဖိုင်မှာတော့ ဒီ component နှစ်ခုကို သုံးပြီး အော်ဒါ screen ကို
      တည်ဆောက်ထားပါတယ်။ [[mark:select-state]] မှာထားတဲ့ အော်ဒါ စာရင်းကို use State နဲ့ state အဖြစ် သိမ်းထားပြီး၊
      ဗလာ array နဲ့ စထားပါတယ်။ [[mark:select-usage]] card ထဲမှာတော့ လက်ဖက်ရည် ခလုတ် တစ်ခုနဲ့၊ အော်ဒါ ဘယ်နှခု
      ရှိပြီလဲ ဆိုတဲ့ စာ တစ်ကြောင်းကို ထည့်ထားပါတယ်။
    sources:
      - {
          title: "React docs: Passing Props to a Component (children, spreading props)",
          url: "https://react.dev/learn/passing-props-to-a-component",
        }
      - { title: "React docs: useState", url: "https://react.dev/reference/react/useState" }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: open-components
        type: workspace.openFile
        at: { mark: open-components }
        path: src/components.tsx
      - id: select-menu-button
        type: editor.select
        at: { mark: select-menu-button }
        target: { file: src/components.tsx, text: "{ name, price, ...rest }", occurrence: 1 }
      - id: select-rest
        type: editor.select
        at: { mark: select-rest }
        target: { file: src/components.tsx, text: "{...rest}", occurrence: 1 }
      - id: select-card
        type: editor.select
        at: { mark: select-card }
        target:
          { file: src/components.tsx, text: "type CardProps = { title: string };", occurrence: 1 }
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: src/main.tsx
      - id: select-state
        type: editor.select
        at: { mark: select-state }
        target:
          { file: src/main.tsx, text: "const [orders, setOrders] = useState([]);", occurrence: 1 }
      - id: select-usage
        type: editor.select
        at: { mark: select-usage }
        target:
          {
            file: src/main.tsx,
            text: "      <MenuButton\n        name={tea.item}\n        price={tea.price}\n        data-testid=\"tea\"\n      />\n      <p data-testid=\"orders\">အော်ဒါ {orders.length} ခု</p>",
            occurrence: 1,
          }

  - id: symptoms
    narration: >
      [[mark:panel-ready]] ညာဘက် အပေါ်ဆုံးမှာ program က ဆွဲပေးထားတဲ့ card ကို မြင်ရပါတယ်။ ဆိုင်ရဲ့ နာမည်၊
      လက်ဖက်ရည် ၁၅၀၀ ဆိုတဲ့ ခလုတ်နဲ့ အော်ဒါ သုည ခု ဆိုတဲ့ စာ ပေါ်နေပါတယ်။ [[mark:read-errors]] ဒါပေမဲ့ သူ့အောက်က
      TypeScript panel မှာတော့ error လေးခု ရှိနေပါတယ်။ ပထမ နှစ်ခုက name နဲ့ price ဟာ type မရှိလို့ any
      ဖြစ်နေတယ်လို့ ပြောနေပြီး၊ နောက် နှစ်ခုကတော့ children အကြောင်းပါ။ type error တွေက program ကို မရပ်စေလို့ screen
      က ပေါ်နေပေမယ့်၊ ဒီ component တွေကို မှန်မှန် သုံးထားလား ဆိုတာကိုတော့ TypeScript က မစစ်ပေးနိုင်သေးပါဘူး။
    sources:
      - {
          title: "TypeScript Handbook: JSX (type checking components)",
          url: "https://www.typescriptlang.org/docs/handbook/jsx.html",
        }
      - {
          title: "TSConfig reference: noImplicitAny",
          url: "https://www.typescriptlang.org/tsconfig/#noImplicitAny",
