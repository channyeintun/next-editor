runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: agents-ask
    chapter: ဘာကို AI ကို ပေးလို့ ရလဲ
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ မထင်မှတ်တဲ့ draft တစ်စောင်ကို မေးခွန်း လေးဆင့်နဲ့ စစ်ပြီး၊ model ရဲ့ ဘယ် သဘာဝကြောင့်
      ဖြစ်လဲ ဆိုတာ ရှာတတ်အောင် လေ့လာခဲ့ပါတယ်။ အဲဒီ lesson နဲ့ model ဘက်ကို ကြည့်တဲ့ အပိုင်း ပြီးသွားပါပြီ။
      [[mark:a-ask]] မုန်တိုင်းကျတဲ့ည ပြီးတော့ support agent တွေက support manager လှလှ ကို မေးခွန်း တစ်ခု
      မေးကြပါတယ်။ AI ကို ဘာအလုပ်တွေ ပေးလုပ်လို့ ရသေးလဲ ဆိုတာပါ။ တချို့က AI ကို လုံးဝ မသုံးတော့တာ
      အကောင်းဆုံးလို့ ပြောပြီး၊ တချို့ကတော့ ticket တွေ များလွန်းလို့ AI မပါရင် မနိုင်ဘူးလို့ ပြောကြပါတယ်။
      [[mark:a-both]] နှစ်ဖက်လုံးမှာ အကြောင်းပြချက် ရှိပါတယ်။ ဒါပေမဲ့ အဖြေက အားလုံး ပေးမလား၊ ဘာမှ မပေးဘူးလား
      ဆိုတဲ့ နှစ်မျိုးထဲက တစ်မျိုး မဟုတ်ပါဘူး။ အလုပ် တစ်ခုချင်းစီအတွက် သီးသန့် ဆုံးဖြတ်ရမှာပါ။ မုန်တိုင်းကျတဲ့ညကလည်း
      အဖြေ ရေးတဲ့ အလုပ်ကို AI ကို ပေးဖို့ ဘယ်သူမှ ဆုံးဖြတ်ခဲ့တာ မဟုတ်ပါဘူး။ support agent တစ်ယောက်ချင်းစီက
      အလုပ်နိုင်အောင် ကိုယ့်ဘာသာ ပေးလိုက်ကြတာပါ။
      [[mark:a-human]] ဒီ အပိုင်းမှာ AI နဲ့ အလုပ်လုပ်တဲ့ လူ့ဘက်ကို ကြည့်ပါမယ်။ model ရဲ့ သဘာဝကို သိပြီးသွားရင်တောင်၊
      ဘယ်အလုပ်ကို ပေးမလဲ၊ ဘယ်လို ပြောမလဲ၊ ပြန်ရတာကို ဘယ်လို စစ်မလဲ၊ နောက်ဆုံး ဘယ်သူ တာဝန်ယူမလဲ ဆိုတာကိုတော့
      လူကပဲ ဆုံးဖြတ်ရလို့ပါ။
    sources:
      - {
          title: "AI Fluency for Builders (Anthropic and CodePath, public course description)",
          url: "https://anthropic.skilljar.com/ai-fluency-for-builders",
        }
    actions:
      - {
          id: open-notebook,
          type: workspace.openFile,
          at: { mark: a-ask },
          path: notebook/08-delegation.md,
        }

  - id: four-habits
    chapter: 4D framework
    narration: >
      [[mark:h-open]] အဲဒီ ဆုံးဖြတ်ချက်တွေကို 4D framework က အလေ့အကျင့် လေးခုအဖြစ် စုထားပါတယ်။ Anthropic နဲ့
      ပါမောက္ခ နှစ်ယောက် အတူ ရေးထားတဲ့ framework ဖြစ်ပါတယ်။ အလေ့အကျင့် လေးခုလုံးရဲ့ နာမည်က D နဲ့ စလို့ 4D
      လို့ ခေါ်တာပါ။ အလယ်မှာတော့ AI နဲ့ အလုပ်လုပ်တဲ့ လူ ရှိပါတယ်။
      [[mark:h-del]] ပထမ အလေ့အကျင့်က Delegation ပါ။ အလုပ် တစ်ခုကို AI ကို ပေးမလား၊ ကိုယ်တိုင် လုပ်မလား၊ ပေးရင်
      ဘယ်အပိုင်းကို ပေးမလဲ ဆိုတာ ဆုံးဖြတ်တာပါ။ model မသိနိုင်တဲ့ fact တွေ ရှိနေလို့ ဒီ ဆုံးဖြတ်ချက် လိုလာတာပါ။
      [[mark:h-desc]] ဒုတိယက Description ပါ။ လိုချင်တာကို AI နားလည်အောင် ပြည့်ပြည့်စုံစုံ ပြောပြတာပါ။ model က
      ကိုယ် ပေးလိုက်တဲ့ စာကိုပဲ မြင်ရတာမို့၊ ကိုယ် မပြောတဲ့ အရာကို ကိုယ့်ဘာသာ ခန့်မှန်းပြီး ဖြည့်ရေးတတ်လို့ပါ။
      [[mark:h-disc]] တတိယက Discernment ပါ။ AI ပြန်ပေးတာ မှန်မမှန်၊ ယုံလို့ ရမရ ကိုယ်တိုင် အကဲဖြတ်တာပါ။ model
      ရဲ့ စာက ချောချောမွေ့မွေ့ ရှိတတ်ပေမဲ့၊ ချောမွေ့တာနဲ့ မှန်တာ မတူလို့ပါ။
      [[mark:h-dil]] စတုတ္ထက Diligence ပါ။ AI ကူလုပ်ပေးထားပေမဲ့၊ ထွက်သွားတဲ့ အလုပ်ကို ကိုယ့်အလုပ်လို့ သဘောထားပြီး
      ရှေ့ထွက် ဖြေရှင်းတာပါ။ customer ဆီ
      ရောက်သွားတဲ့ စာကို AI ရေးတာလား၊ လူ ရေးတာလား ဆိုတာထက်၊ နေခြည် က ပို့လိုက်တဲ့ စာ ဖြစ်နေတာက customer
      အတွက် ပိုအရေးကြီးပါတယ်။
      [[mark:h-point]] အရင် အပိုင်းမှာ model ရဲ့ သဘာဝ လေးခုကို ကြည့်ခဲ့ပါတယ်။ ဒီ အလေ့အကျင့် လေးခုကတော့ အဲဒီ
      သဘာဝတွေကို လူ့ဘက်ကနေ တုံ့ပြန်တဲ့ နည်းလမ်းတွေလို့ ကြည့်လို့ ရပါတယ်။ တစ်ခုစီကို နေခြည် ရဲ့ အလုပ်တွေနဲ့
      လေ့လာသွားမှာဖြစ်ပြီး၊ ဒီနေ့ Delegation နဲ့ စပါမယ်။
    sources:
      - {
          title: "AI Fluency Framework by Rick Dakan, Joseph Feller and Anthropic, CC BY-NC-SA 4.0",
          url: "https://www-cdn.anthropic.com/b383cf6baddbfc72fdf8b0ed533a518e2872d531.pdf",
        }
      - {
          title: "Creative Commons CC BY-NC-SA 4.0 licence",
          url: "https://creativecommons.org/licenses/by-nc-sa/4.0/deed.en",
        }
      - {
          title: "AI Fluency for Builders (Anthropic and CodePath, public course description)",
          url: "https://anthropic.skilljar.com/ai-fluency-for-builders",
        }
    actions:
      - {
          id: draw-h-open,
          type: whiteboard.apply,
          at: { mark: h-open },
          open: true,
          upsertIds: [h-title, h-person],
          drawMs: 1200,
        }
      - {
          id: draw-h-del,
          type: whiteboard.apply,
          at: { mark: h-del },
          upsertIds: [h-b1, h-n1, h-p1],
          drawMs: 1500,
        }
      - {
          id: draw-h-desc,
          type: whiteboard.apply,
          at: { mark: h-desc },
          upsertIds: [h-b2, h-n2, h-p2],
          drawMs: 1500,
        }
      - {
          id: draw-h-disc,
          type: whiteboard.apply,
          at: { mark: h-disc },
          upsertIds: [h-b3, h-n3, h-p3],
          drawMs: 1500,
        }
      - {
          id: draw-h-dil,
          type: whiteboard.apply,
          at: { mark: h-dil },
          upsertIds: [h-b4, h-n4, h-p4],
          drawMs: 1500,
        }
      - {
          id: point-h-del,
          type: whiteboard.point,
          at: { mark: h-point, offsetMs: 2500 },
          target: { assetId: h-b1 },
        }

  - id: task-needs
    chapter: Delegation မှာ မေးရမယ့် မေးခွန်း
    narration: >
      [[mark:n-open]] Delegation အတွက် အလုပ် တစ်ခုကို AI ကို မပေးခင် အလုပ်ဘက်ကနေ မေးခွန်း လေးခု မေးကြည့်ပါ။
      မုန်တိုင်းကျတဲ့ညက connection ticket တွေအတွက် အဖြေ ရေးတဲ့ အလုပ်နဲ့ စမ်းကြည့်ရအောင်။
      [[mark:n1]] ပထမ မေးခွန်းက ဒီအလုပ်မှာ model မမြင်ရတဲ့ fact လိုလား ဆိုတာပါ။ လိုပါတယ်။ ဘယ်မြို့နယ်မှာ လိုင်းကျနေလဲ
      ဆိုတာ NMS ထဲမှာပဲ ရှိပါတယ်။ ဒါကြောင့် AI ကို ပေးမယ်ဆိုရင် အဲဒီ fact ကို ဘယ်သူ ဖြည့်ပေးမလဲ၊ ဘယ်သူ
      တိုက်စစ်မလဲ ဆိုတာကို တစ်ခါတည်း ဆုံးဖြတ်ရပါမယ်။
      [[mark:n2]] ဒုတိယ မေးခွန်းက လူ တစ်ယောက်ရဲ့ အခြေအနေကို ချိန်ဆပြီး ဆုံးဖြတ်ရတဲ့ အလုပ်လား ဆိုတာပါ။ ပုံမှန်
      connection အဖြေမှာ အဲဒီလို ဆုံးဖြတ်ချက် သိပ်မပါပါဘူး။ technician ကို ညဘက် အရေးပေါ် လွှတ်မလား ဆိုတာမျိုးမှာတော့
      ပါပါတယ်။
      [[mark:n3]] တတိယ မေးခွန်းက မှားသွားရင် ဘယ်လောက် ဆိုးမလဲ ဆိုတာပါ။ connection အဖြေ မှားရင် customer က
      အချိန်ကုန်ပြီး နေခြည် ကို ယုံကြည်မှု လျော့သွားပါတယ်။ မှားရင် ဆိုးလေ၊ customer ဆီ မရောက်ခင် လူ စစ်တဲ့ အဆင့်
      ရှိဖို့ လိုလေပါပဲ။ မုန်တိုင်းကျတဲ့ညက အဲဒီ အဆင့် မရှိခဲ့ပါဘူး။
      [[mark:n4]] စတုတ္ထ မေးခွန်းကတော့ model ဘက်ကို ကြည့်တာပါ။ model ကောင်းကောင်း လုပ်နိုင်တဲ့ အလုပ်လား ဆိုတာပါ။
      ယဉ်ကျေးပြီး ရှင်းလင်းတဲ့ စာ ရေးတာ၊ ticket ကို အမျိုးအစား ခွဲတာ၊ knowledge base ထဲက ဆိုင်တဲ့ article ကို
      ရှာတာတွေမှာ model က အားသာပါတယ်။
      [[mark:n-sum]] လေးခုကို ပေါင်းကြည့်ရင် connection အဖြေအတွက် အဖြေ ထင်ရှားပါတယ်။ စာ ရေးတာကို AI ကို
      ပေးလို့ ရပေမဲ့၊ NMS နဲ့ တိုက်စစ်ပြီး ပို့တဲ့ အဆင့်ကိုတော့ support agent လက်ထဲမှာ ထားရပါမယ်။
    sources:
      - {
          title: "AI Fluency Framework by Rick Dakan, Joseph Feller and Anthropic, CC BY-NC-SA 4.0",
          url: "https://www-cdn.anthropic.com/b383cf6baddbfc72fdf8b0ed533a518e2872d531.pdf",
        }
      - {
          title: "Claude Docs: Reduce hallucinations",
          url: "https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations",
        }
    actions:
      - {
          id: close-habits,
          type: whiteboard.apply,
          at: { mark: n-open, offsetMs: -1500 },
          open: false,
        }
      - {
          id: show-questions,
          type: slide.show,
          at: { afterAction: close-habits },
          slideId: task-questions,
        }
      - { id: point-q1, type: slide.point, at: { mark: n1 }, target: { x: 0.15, y: 0.39 } }
      - { id: point-q2, type: slide.point, at: { mark: n2 }, target: { x: 0.15, y: 0.53 } }
      - { id: point-q3, type: slide.point, at: { mark: n3 }, target: { x: 0.15, y: 0.67 } }
      - { id: point-q4, type: slide.point, at: { mark: n4 }, target: { x: 0.15, y: 0.81 } }

  - id: scale
    chapter: AI ရေးတာကနေ လူ သီးသန့်အထိ
    narration: >
      [[mark:s-open]] Delegation ရဲ့ အဖြေက ပေးမယ်၊ မပေးဘူး ဆိုတဲ့ နှစ်မျိုးတည်း မဟုတ်ပါဘူး။ ဒါကို scale တစ်ခုနဲ့
      ကြည့်ရအောင်။ အပေါ်ဘက်စွန်းမှာ AI က ရေးပြီး လူက စစ်တာ၊ အောက်ဘက်စွန်းမှာ လူ သီးသန့် လုပ်တာ ရှိပါတယ်။
      [[mark:s-1]] AI ဘက်စွန်းနားမှာ ticket ကို connection လား၊ billing လား ခွဲတာလို အလုပ်မျိုး ရှိပါတယ်။ AI
      က အလုပ် အသေးလေး တစ်ခုကို လုပ်ပြီး ပြန်အပ်တဲ့ ပုံစံပါ။ မှားရင်လည်း support agent က ချက်ချင်း မြင်ပြီး
      ပြင်လို့ ရပါတယ်။
      [[mark:s-2]] နောက်ထပ် ပုံစံ တစ်မျိုးက AI က အဆင့်တွေကို ဆက်တိုက် ကိုယ်တိုင် လုပ်သွားပြီး၊ သတ်မှတ်ထားတဲ့
      နေရာမှာ လူက စစ်တာပါ။ ကိုယ်တို့ ဆောက်မယ့် Reply assistant က ဒီလိုပါ။ ticket ကို ဖတ်၊ လိုတဲ့ အချက်အလက်ကို
      ရှာ၊ draft ကို ရေးပြီးမှ support agent က စစ်ပါတယ်။ အဆင့် များလေ၊ အမှား တစ်ခုက နောက်အဆင့်တွေဆီ
      ဆင့်ကူးနိုင်လေမို့ စစ်မယ့် နေရာကို ကြိုသတ်မှတ်ထားရတာပါ။
      [[mark:s-3]] အလယ်လောက်မှာတော့ ဒေါသထွက်နေတဲ့ customer တစ်ယောက်ကို ပြန်ဖြေတာ ရှိပါတယ်။ support agent က
      AI နဲ့ အပြန်အလှန် စဉ်းစားပြီး မူကြမ်းကို အကြိမ်ကြိမ် ပြင်ရေးတဲ့ ပုံစံပါ။ AI က ကူစဉ်းစားပေးပေမဲ့၊ ဘယ်စကားလုံးနဲ့
      ပို့မလဲ ဆိုတာကို support agent ကပဲ ရွေးပါတယ်။
      [[mark:s-4]] လူ သီးသန့် ဘက်စွန်းနားမှာတော့ technician ကို ညဘက် အရေးပေါ် လွှတ်မလား ဆုံးဖြတ်တာ ရှိပါတယ်။
      ကုန်ကျစရိတ်၊ customer ရဲ့ အခြေအနေနဲ့ ရာသီဥတုကို ချိန်ဆရတာမို့၊ AI က အချက်အလက် စုပေးနိုင်ပေမဲ့
      ဆုံးဖြတ်ချက်ကတော့ လူ့ဆီမှာပဲ ရှိပါတယ်။
      [[mark:s-own]] အလုပ် တစ်ခုကို scale ပေါ်မှာ ဘယ်နေရာ ထားမလဲ ဆိုတာကလည်း ဆုံးဖြတ်ချက် တစ်ခုပါ။ ဒါကြောင့်
      support agent တစ်ယောက်ချင်းစီက ကိုယ့်ဘာသာ မဆုံးဖြတ်ဘဲ၊ အလုပ်ကို တာဝန်ယူတဲ့ လှလှ လို လူက ဆုံးဖြတ်ပြီး၊
      ဘာကြောင့်လဲ ဆိုတာကို ရေးထားရပါမယ်။
    sources:
      - {
          title: "AI Fluency Framework by Rick Dakan, Joseph Feller and Anthropic, CC BY-NC-SA 4.0",
          url: "https://www-cdn.anthropic.com/b383cf6baddbfc72fdf8b0ed533a518e2872d531.pdf",
        }
      - {
          title: "Anthropic Engineering: Building effective agents",
          url: "https://www.anthropic.com/engineering/building-effective-agents",
        }
    actions:
      - { id: close-questions, type: slide.close, at: { mark: s-open } }
      - {
          id: draw-s-open,
          type: whiteboard.apply,
          at: { afterAction: close-questions },
          open: true,
          clear: true,
          upsertIds: [s-title, s-top, s-bar, s-bot],
          drawMs: 1600,
        }
      - {
          id: draw-s-1,
          type: whiteboard.apply,
          at: { mark: s-1 },
          upsertIds: [s-a1, s-r1],
          drawMs: 1200,
        }
      - {
          id: draw-s-2,
          type: whiteboard.apply,
          at: { mark: s-2 },
          upsertIds: [s-a2, s-r2],
          drawMs: 1200,
        }
      - {
          id: draw-s-3,
          type: whiteboard.apply,
          at: { mark: s-3 },
          upsertIds: [s-a3, s-r3],
          drawMs: 1200,
        }
      - {
          id: draw-s-4,
          type: whiteboard.apply,
          at: { mark: s-4 },
          upsertIds: [s-a4, s-r4],
          drawMs: 1200,
        }
      - { id: point-s-bar, type: whiteboard.point, at: { mark: s-own }, target: { assetId: s-bar } }

  - id: table
    chapter: ဘယ်သူ လုပ်မလဲ ဆိုတဲ့ table
    narration: >
      [[mark:t-open]] လှလှ နဲ့ အတူ support အလုပ်တွေကို table တစ်ခုနဲ့ ချရေးကြည့်ရအောင်။ အလုပ်၊ ဘယ်သူ လုပ်မလဲ၊
      ဘာကြောင့်လဲ ဆိုတဲ့ column သုံးခု ရှိပြီး၊ ticket ခွဲတဲ့ row ကို ရေးထားပြီးပါပြီ။
      [[mark:type-r2]] connection ticket ရဲ့ row မှာတော့ မုန်တိုင်းကျတဲ့ညက မရှိခဲ့တဲ့ အဆင့်ကို ထည့်ပါမယ်။ draft
      ရေးတာကို AI ကို ပေးပေမဲ့၊ ပို့ခွင့်ကိုတော့ လိုင်းကျမှုကို မြင်နိုင်တဲ့ support agent ဆီမှာ ထားပါတယ်။ ဒီ row ရဲ့ အဓိက အချက်က စစ်တဲ့သူနဲ့ စစ်ရမယ့်
      အရာကို နာမည်တပ်ပြီး ရေးထားတာပါ။
      [[mark:type-r3]] လိုင်းကျတဲ့အခါ customer အားလုံးဆီ ပို့မယ့် အသိပေးစာ အတွက်ပါ။ AI က template ကို ရေးပေးနိုင်ပေမဲ့၊
      ပို့ခွင့်ကိုတော့ shift lead က ပေးပါမယ်။ customer ထောင်ချီဆီ တစ်ပြိုင်တည်း ရောက်သွားမှာမို့ မှားရင် အရမ်း
      ဆိုးလို့ပါ။
      [[mark:type-r4]] knowledge base ထဲက ခေတ်နောက်ကျနေတဲ့ article တွေ ပြင်ရေးတာ အတွက်ပါ။ လုပ်ငန်းစဉ် အသစ်ကို
      support agent က ပေးပြီး၊ AI က စာကို ပြန်ရေးပေးပါမယ်။ ဘာက မှန်လဲ ဆိုတဲ့ fact က လူ့ဆီမှာ ရှိပြီး၊ စာ ရေးတာကတော့
      model ရဲ့ အားသာချက်မို့ပါ။
      [[mark:type-owner]] အောက်ဆုံးမှာ ဒီ table ကို ဘယ်သူ ဆုံးဖြတ်လဲ၊ ဘယ်တော့ ပြန်ကြည့်မလဲ ဆိုတာ ရေးထားပါမယ်။
      Delegation က တစ်ခါ ဆုံးဖြတ်ပြီး ပြီးသွားတာ မဟုတ်ပါဘူး။ ticket အမျိုးအစား အသစ်တွေ ရောက်လာတဲ့အခါ ပြန်ကြည့်ရပါမယ်။
    sources:
      - {
          title: "AI Fluency Framework by Rick Dakan, Joseph Feller and Anthropic, CC BY-NC-SA 4.0",
          url: "https://www-cdn.anthropic.com/b383cf6baddbfc72fdf8b0ed533a518e2872d531.pdf",
        }
      - {
          title: "Anthropic Engineering: Building effective agents",
          url: "https://www.anthropic.com/engineering/building-effective-agents",
        }
    actions:
      - { id: close-scale, type: whiteboard.apply, at: { mark: t-open }, open: false }
      - id: sel-row1
        type: editor.select
        at: { mark: t-open, offsetMs: 3500 }
        target:
          file: notebook/08-delegation.md
          text: "| ticket ကို connection / billing ခွဲ | AI၊ မှားရင် support agent ပြင် | fact မလို၊ မှားရင် ချက်ချင်း မြင် |"
      - id: type-r2
        type: editor.type
        at: { mark: type-r2 }
        cadence: line-by-line
        target: { file: notebook/08-delegation.md, after: "မှားရင် ချက်ချင်း မြင် |\n" }
        text: "| connection ticket ရဲ့ draft | AI ရေး၊ support agent က NMS နဲ့ စစ်ပြီး ပို့ | လိုင်းကျမှုကို model မမြင် |\n"
      - id: type-r3
        type: editor.type
        at: { mark: type-r3 }
        cadence: line-by-line
        target: { file: notebook/08-delegation.md, after: "လိုင်းကျမှုကို model မမြင် |\n" }
        text: "| လိုင်းကျ အသိပေးစာ (customer အားလုံး) | AI က template၊ shift lead က ပို့ခွင့် | မှားရင် ထောင်ချီ ထိ |\n"
      - id: type-r4
        type: editor.type
        at: { mark: type-r4 }
        cadence: line-by-line
        target: { file: notebook/08-delegation.md, after: "မှားရင် ထောင်ချီ ထိ |\n" }
        text: "| knowledge base article အဟောင်း ပြင်ရေး | support agent က fact၊ AI က စာ | fact က လူ့ဆီမှာ |\n"
      - id: type-owner
        type: editor.type
        at: { mark: type-owner }
        cadence: line-by-line
        target: { file: notebook/08-delegation.md, after: "fact က လူ့ဆီမှာ |\n" }
        text: "\nဆုံးဖြတ်သူ: support manager လှလှ။ ticket အမျိုးအစား အသစ် ရောက်ရင် ပြန်ကြည့်\n"
      - id: expect-r2
        type: expect.file
        at: { afterAction: type-owner }
        path: notebook/08-delegation.md
        contains: "| connection ticket ရဲ့ draft | AI ရေး၊ support agent က NMS နဲ့ စစ်ပြီး ပို့ | လိုင်းကျမှုကို model မမြင် |\n"

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ ညဆိုင်းက support agent တွေက AI ကို အလုပ် တစ်ခု အရင်ဆုံး
      စပေးကြည့်ချင်တယ် ဆိုပါစို့။ ရွေးစရာ နှစ်ခု ရှိပါတယ်။
      [[mark:q-a]] ပထမ တစ်ခုက ရက် သုံးရက် လိုင်းကျခဲ့တဲ့ customer တွေကို လျော်ကြေး ဘယ်လောက် ပေးမလဲ
      ဆုံးဖြတ်တာပါ။
      [[mark:q-b]] ဒုတိယ တစ်ခုက message သုံးဆယ် ရှည်တဲ့ ticket တစ်ခုကို နောက်ဆိုင်းက support agent ဖတ်ဖို့
      အကျဉ်းချုပ်တာပါ။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ တစ်ခုပါ။ ဘာကြောင့်လဲဆိုတော့ အကျဉ်းချုပ်ဖို့ လိုတာက ticket ထဲမှာ
      ရှိပြီးသား စာတွေပဲမို့ model မမြင်ရတဲ့ fact မလိုပါဘူး။ မှားရင်လည်း နောက်ဆိုင်းက support agent က ticket
      မူရင်းကို ပြန်ကြည့်လို့ ရပါတယ်။ လျော်ကြေး ကတော့ ငွေ၊ စည်းမျဉ်းနဲ့ customer တစ်ယောက်ချင်းစီရဲ့ အခြေအနေကို
      ချိန်ဆရတဲ့ ဆုံးဖြတ်ချက်ပါ။ မှားရင် customer တွေ အများကြီးကို ထိခိုက်ပါတယ်။
      [[mark:q-rule]] ဒါကြောင့် ပထမဆုံး ပေးမယ့် အလုပ်ကို ရွေးရင်၊ လိုတဲ့ fact က အလုပ်ထဲမှာ ပါပြီးသား ဖြစ်တဲ့
      အလုပ်၊ မှားရင်လည်း မြင်ပြီး ပြင်လို့ ရတဲ့ အလုပ်ကို ရွေးပါ။
    sources:
      - {
          title: "AI Fluency Framework by Rick Dakan, Joseph Feller and Anthropic, CC BY-NC-SA 4.0",
          url: "https://www-cdn.anthropic.com/b383cf6baddbfc72fdf8b0ed533a518e2872d531.pdf",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: q-rule },
          upsertIds: [q-t1, q-t2],
          drawMs: 1600,
        }

  - id: your-turn
    chapter: ကိုယ့် team ရဲ့ အလုပ်
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ကိုယ့် team မှာ AI ကို ပေးဖို့ စဉ်းစားနေတဲ့ အလုပ်
      သုံးခုကို ဒီ table ထဲမှာ row အသစ်အဖြစ် ရေးကြည့်ပါ။ အလုပ် တစ်ခုစီအတွက် ဘယ်သူ လုပ်မလဲ၊ ဘာကြောင့်လဲ ဆိုတာကို
      ဖြည့်ပါ။
      [[mark:turn-2]] ဘာကြောင့်လဲ column ကို ရေးတဲ့အခါ မေးခွန်း လေးခုကို အလုပ် တစ်ခုစီအတွက် ပြန်မေးကြည့်ပါ။
      model မမြင်ရတဲ့ fact လိုတဲ့ အလုပ်ဆိုရင်တော့၊ အဲဒီ fact ကို ဘယ်သူ ဖြည့်ပေးပြီး ဘယ်သူ တိုက်စစ်မလဲ ဆိုတာပါ
      ထည့်ရေးပါ။ ပြီးရင် အောက်ဆုံးမှာ ကိုယ့် team
      အတွက် ဘယ်သူ ဆုံးဖြတ်မလဲ ဆိုတာလည်း ရေးထားပါ။
    sources:
      - {
          title: "AI Fluency Framework by Rick Dakan, Joseph Feller and Anthropic, CC BY-NC-SA 4.0",
          url: "https://www-cdn.anthropic.com/b383cf6baddbfc72fdf8b0ed533a518e2872d531.pdf",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: turn }, open: false }
      - id: sel-header
        type: editor.select
        at: { mark: turn, offsetMs: 2200 }
        target:
          file: notebook/08-delegation.md
          text: "| အလုပ် | ဘယ်သူ လုပ်မလဲ | ဘာကြောင့်လဲ |"
      - id: sel-owner
        type: editor.select
        at: { mark: turn-2, offsetMs: 6000 }
        target:
          file: notebook/08-delegation.md
          text: "ဆုံးဖြတ်သူ: support manager လှလှ။"

  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ 4D framework မှာ Delegation၊ Description၊ Discernment နဲ့ Diligence ဆိုတဲ့
      AI နဲ့ အလုပ်လုပ်တဲ့ လူ မွေးထားရမယ့် အလေ့အကျင့် လေးခု ရှိပါတယ်။ AI ကို ဘာကို ပေးလို့ ရလဲ ဆိုတဲ့ မေးခွန်းရဲ့
      အဖြေကလည်း အားလုံး ဒါမှမဟုတ် ဘာမှ မဟုတ်ပါဘူး။
      [[mark:recap-2]] Delegation ဆိုတာ အလုပ် တစ်ခုချင်းစီ လိုအပ်တာကို ကြည့်ပြီး၊ AI က ဘယ်အပိုင်း လုပ်မလဲ၊ လူက
      ဘယ်အပိုင်း လုပ်ပြီး ဘယ်နေရာမှာ စစ်မလဲ ဆိုတာကို ဆုံးဖြတ်တာပါ။ အဲဒီ ဆုံးဖြတ်ချက်ကိုလည်း တာဝန်ယူတဲ့ လူ တစ်ယောက်က
      ချပြီး ရေးထားရပါမယ်။
      [[mark:next]] နောက် lesson မှာတော့ ဒုတိယ အလေ့အကျင့် Description ကို လေ့လာပါမယ်။ Billing team က
      developer တစ်ယောက်က billing bug ကို ပြင်ပေးပါလို့ပဲ AI ကို ရေးလိုက်တော့ ဘာဖြစ်သွားလဲ၊ လိုချင်တာကို ဘယ်လို
      ပြည့်ပြည့်စုံစုံ ပြောရမလဲ ဆိုတာကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "AI Fluency Framework by Rick Dakan, Joseph Feller and Anthropic, CC BY-NC-SA 4.0",
          url: "https://www-cdn.anthropic.com/b383cf6baddbfc72fdf8b0ed533a518e2872d531.pdf",
        }
    actions:
      - id: sel-row2
        type: editor.select
        at: { mark: recap-2 }
        target:
          file: notebook/08-delegation.md
          text: "AI ရေး၊ support agent က NMS နဲ့ စစ်ပြီး ပို့"

checks:
  - { type: timing.p95Ms, max: 300 }
