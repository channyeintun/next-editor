        <rect x="90" y="205" width="1420" height="121" rx="16" fill="#0e131d" stroke="#2a3345" stroke-width="2"/><text x="114" y="239" font-size="22" fill="#8a94a8" font-weight="700" class="mono">received · raw bytes</text><path d="M90 251H1510" stroke="#2a3345" stroke-width="2"/><g><text x="114" y="297.1" font-size="26" class="mono" xml:space="preserve" fill="#e9edf5">{"id": "evt_2", "type": "payment.captured", "payment": "pay_7", "amount": 10000}</text></g>
        <rect x="90" y="350" width="1061.5" height="50" rx="25" fill="#68d391" opacity="0.16"/><rect x="90" y="350" width="1061.5" height="50" rx="25" fill="none" stroke="#68d391" stroke-width="2"/><text x="620.8" y="384.1" font-size="26" text-anchor="middle" fill="#68d391" font-weight="700" class="mono">HMAC-SHA256(secret, t + "." + bytes) = d0054ea4…   ✓ v1 matches</text>
