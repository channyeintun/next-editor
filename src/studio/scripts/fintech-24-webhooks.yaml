# Fintech Engineering, lesson 24: handling webhooks (Burmese).
#
# Source: Fintech Engineering Handbook, "Handling webhooks" (CC BY 4.0, Voytek Pitula).
# Start state: events.go holds four signed deliveries for one payment in arrival order (captured,
# authorized, then the provider's retries of both); payment.go the provider's API and our ledger
# rule; main.go verify() (Stripe-style t=…,v1=… HMAC-SHA256), endpoint() (verify, store raw, 2xx)
# and a main that checks the first delivery's raw bytes and its re-encoded JSON.
# Edits, all insert-only:
#   1. apply every event in arrival order, trusting its content  -> run-2: authorized, 200.00
#   2. a worker over the stored events: dedupe by event id, fetch the state from the API
#                                                                 -> run-3: captured, 100.00, 2 dupes
# Figures: raw (same JSON, two byte strings, two signatures), order (arrival order, retries, the
# API), pipeline (verify → store raw → 2xx; worker: dedupe → GET state → ledger; reconciliation), iv.
# Built by ~/Documents/fintech-course-work/tools/build-lesson.ts; fixtures by sim-go.ts --write.
schemaVersion: 1

lesson:
  slug: fintech-24-webhooks
  title: "Fintech Engineering 24: Webhook ကို လက်ခံခြင်း"
  locale: my-MM
  workspace:
