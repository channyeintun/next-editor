  - id: pipeline
    chapter: Verify၊ store၊ 2xx၊ ပြီးမှ process
    narration: >-
      [[mark:show-pipe]] ဒီ အချက်တွေကို ပေါင်းလိုက်ရင် endpoint က အလုပ် နည်းနည်းပဲ လုပ်ရပါတယ်။ ပထမ
      signature ကို verify လုပ်ပါတယ်။ [[mark:pipe-2]] ပြီးရင် ရောက်လာတဲ့ event ကို raw အတိုင်း သိမ်းပြီး ချက်ချင်း success status ပြန်ပေးပါတယ်။ Stripe ကလည်း complex logic မလုပ်ခင် success status ကို မြန်မြန် ပြန်ပေးရမယ်လို့
      ပြောထားပါတယ်။ [[mark:pt-ack]] endpoint ထဲမှာ အလုပ်တွေ လုပ်နေလို့ နှေးရင် provider ဘက်က timeout ဖြစ်ပြီး retry
      လုပ်တော့ load က နှစ်ဆ သုံးဆ ဖြစ်လာပါတယ်။ [[mark:pt-store2]] raw event က provider တကယ် ပြောခဲ့တာရဲ့ audit trail
      လည်း ဖြစ်ပြီး၊ bug ပြင်ပြီးရင် provider ကို ပြန်ပို့ခိုင်းစရာ မလိုဘဲ ပြန် process လုပ်လို့ ရပါတယ်။
      [[mark:pipe-3]] တကယ့် အလုပ်ကို worker က နောက်မှ လုပ်ပါတယ်။ event id ကို မြင်ဖူးရင် ကျော်ပါတယ်၊
      webhook တစ်ခုက တစ်ခါထက် ပို ရောက်နိုင်လို့ပါ။ [[mark:pipe-4]] ပြီးမှ payment ရဲ့ state ကို API
      ကနေ မေးပြီး ledger ဆီ ပို့ပါတယ်။ ဒီမှာ ခက်တဲ့ အချက်က API ကိုယ်တိုင်က eventually consistent ဖြစ်ပြီး
      webhook ထက် နောက်ကျနေနိုင်တာပါ။ ချက်ချင်း မေးရင် state အဟောင်းကို ပြန်ရနိုင်လို့ retry လုပ်ဖို့
      ပြင်ထားရပါတယ်။ [[mark:pipe-5]] နောက်ဆုံး၊ provider က re-delivery ဘယ်လောက် ကောင်းကောင်း webhook
      တစ်ခုခု ပျောက်မှာပါ။ ပျောက်သွားတာကို endpoint က ဘယ်တော့မှ မသိနိုင်လို့ သီးခြား reconciliation process တစ်ခုက provider နဲ့ ကိုယ့် data ကို တိုက်ပြီး ဖြည့်ပေးရပါတယ်။ ဒါတွေက No trust နဲ့
      No lost data ပါ၊ webhook ကို မယုံဘူး၊ ဒါပေမဲ့ ပြောခဲ့တာကို တစ်ခုမှ မပျောက်စေဘူး ဆိုတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Handling webhooks (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#handling-webhooks",
        }
      - {
          title: "Stripe Docs — Receive Stripe events in your webhook endpoint",
          url: "https://docs.stripe.com/webhooks",
        }
      - {
          title: "Fintech Engineering Handbook — Reconciliation (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#reconciliation",
        }
    actions:
      - {
          id: show-pipe,
          type: slide.show,
          at: { mark: show-pipe, offsetMs: -700 },
          slideId: pipeline-1,
        }
      - {
          id: pt-verify,
          type: slide.point,
          at: { afterAction: show-pipe },
          target: { x: 0.313, y: 0.464 },
        }
      - { id: pipe-2, type: slide.show, at: { mark: pipe-2 }, slideId: pipeline-2 }
      - {
          id: pt-store,
          type: slide.point,
          at: { afterAction: pipe-2 },
          target: { x: 0.575, y: 0.464 },
