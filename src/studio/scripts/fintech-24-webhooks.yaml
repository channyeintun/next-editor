      - { id: pt-ack, type: slide.point, at: { mark: pt-ack }, target: { x: 0.834, y: 0.464 } }
      - {
          id: pt-store2,
          type: slide.point,
          at: { mark: pt-store2 },
          target: { x: 0.575, y: 0.464 },
        }
      - { id: pipe-3, type: slide.show, at: { mark: pipe-3 }, slideId: pipeline-3 }
      - {
