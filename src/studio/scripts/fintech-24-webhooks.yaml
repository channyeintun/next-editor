  - id: try-it
    chapter: ကိုယ်တိုင် စမ်းကြည့်ပါ
    narration: >-
      [[mark:close-iv]] ကိုယ်တိုင် စမ်းကြည့်ဖို့ တစ်ခု ရှိပါတယ်။ [[mark:open-events-2]] captured event ရဲ့
      body ကို ကြည့်ပါ။ [[mark:sel-try]] amount ရဲ့ ရှေ့ဆုံး တစ်ကို ကိုး လို့ ပြောင်းပြီး run ကြည့်ပါ၊ byte
      တစ်လုံးပဲ ပြောင်းတာပါ။ signature က false ဖြစ်သွားပြီး၊ signature မစစ်တဲ့ naive handler က ယူရို
      တစ်ထောင့် ရှစ်ရာ credit လုပ်ပါလိမ့်မယ်။ worker ကတော့ ယူရို တစ်ရာပဲ credit လုပ်ပါတယ်။ endpoint က
      ပြင်ထားတဲ့ delivery နှစ်ခုကို ငြင်းလိုက်ပြီး ကျန်တဲ့ event နဲ့ API ကနေ အမှန် state ကို ရလို့ပါ။
      [[mark:recap]] ပြန်ချုပ်ရရင်၊ webhook ဆိုတာ တစ်ခုခု ဖြစ်သွားတယ် ဆိုတဲ့ hint ပါ။ byte တွေပေါ်မှာ
      verify လုပ်၊ raw အတိုင်း သိမ်း၊ မြန်မြန် ဖြေ၊ အမှန်ကို API ကနေ ယူပါ။ နောက် lesson မှာတော့
      ဦးတည်ချက် ပြောင်းပါမယ်။ ကိုယ့် database ပြောင်းတာကို အပြင်ကို event အဖြစ် ဘယ်လို ယုံကြည်ရအောင်
      ပို့မလဲ ဆိုတဲ့ outbox နဲ့ CDC ကို ကြည့်ပါမယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Handling webhooks (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#handling-webhooks",
        }
    actions:
      - { id: close-iv, type: slide.close, at: { mark: close-iv } }
      - {
          id: open-events-2,
          type: workspace.openFile,
          at: { mark: open-events-2 },
          path: events.go,
        }
      - id: sel-try
        type: editor.select
        at: { mark: sel-try }
        target: { file: events.go, text: '"amount": 10000', occurrence: 1 }

