  - id: worker
    narration: >-
      [[mark:close-pipe]] code မှာ endpoint က ပြီးသား ရှိပါတယ်။ [[mark:sel-endpoint]] signature မှန်ရင် raw
      byte တွေကို inbox ထဲ သိမ်းပြီး ၂၀၀ ပြန်ပါတယ်၊ ဒီထက် ဘာမှ မလုပ်ပါဘူး။ main က delivery လေးခုလုံးကို
      ဒီ endpoint ကို ဖြတ်ပို့ထားပါတယ်။ [[mark:type-worker]] worker က inbox ထဲက event တွေကို
      ဖတ်ပါမယ်။ event id ကို မြင်ဖူးရင် ကျော်ပြီး၊ မမြင်ဖူးရင် event ထဲက status ကို မသုံးဘဲ payment ရဲ့
      state ကို API ကနေ မေးယူပါတယ်။ ledger ကို ပို့တာကတော့ ခုနက စည်းမျဉ်း အတိုင်းပါပဲ။ [[mark:run-3]]
      run လိုက်ရအောင်။ [[mark:pt-worker]] payment က captured ဖြစ်ပြီး၊ user ကို ယူရို တစ်ရာ တစ်ခါပဲ credit
      လုပ်ပါတယ်။ duplicate နှစ်ခုကို ကျော်သွားပါတယ်။ authorized event ကို ရောက်တဲ့အခါမှာ API ကို
      မေးတော့ အမှန် state က captured ဖြစ်နေပြီမို့ state နောက်ပြန် မဆုတ်တော့ပါဘူး။ [[mark:dock-3]] ဒီလို
      event id နဲ့ dedupe လုပ်တာ တစ်ခုတည်းနဲ့ မလုံလောက်ပါဘူး၊ ledger ရဲ့ effect ကိုယ်တိုင်လည်း idempotent
      ဖြစ်ရပါမယ်။ code ထဲမှာ capture က payment တစ်ခုကို credit တစ်ခါပဲ လုပ်တာ အဲဒါကြောင့်ပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Handling webhooks (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#handling-webhooks",
        }
      - {
          title: "Fintech Engineering Handbook — Idempotency (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#idempotency",
        }
    actions:
      - { id: close-pipe, type: slide.close, at: { mark: close-pipe } }
      - id: sel-endpoint
        type: editor.select
        at: { mark: sel-endpoint }
        target:
          { file: main.go, text: "\tinbox = append(inbox, d.Body)\n\treturn 200", occurrence: 1 }
      - id: type-worker
        type: editor.type
        at: { mark: type-worker }
        target:
          {
            file: main.go,
            after: "\tfor _, d := range deliveries {\n\t\tendpoint(d)\n\t}\n",
            occurrence: 1,
          }
        text: "\n\tvar p Payment\n\tseen := map[string]bool{}\n\tfor _, raw := range inbox {\n\t\tif e := decode(raw); !seen[e.ID] {\n\t\t\tseen[e.ID] = true\n\t\t\tp.move(fetch(e.Payment))\n\t\t}\n\t}\n\tfmt.Println(\"worker: pay_7\", p, \"- duplicates skipped:\", len(inbox)-len(seen))\n"
        cadence: line-by-line
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "worker: pay_7 captured, credited 100.00 - duplicates skipped: 2",
          timeoutMs: 8000,
        }
      - id: pt-worker
        type: console.point
        at: { mark: pt-worker }
        target: { text: "worker: pay_7 captured, credited 100.00", occurrence: 1 }
      - { id: dock-3, type: runtime.collapseDock, at: { mark: dock-3 } }
      - {
          id: expect-file-fetch,
          type: expect.file,
          at: { afterAction: run-3 },
          path: main.go,
          contains: "p.move(fetch(e.Payment))",
        }

  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] Fintech interview တွေမှာ webhook endpoint တစ်ခုကို ဘယ်လို ဒီဇိုင်းဆွဲမလဲ လို့
      မေးလေ့ရှိပါတယ်။ signature စစ်မယ် လို့ပဲ ဖြေရင် မလုံလောက်ပါဘူး။ အချက် သုံးချက်နဲ့ ဖြေပါ။
      [[mark:iv-a]] ပထမ၊ endpoint က signature ကို လက်ခံရတဲ့ byte တွေပေါ်မှာ verify လုပ်၊ raw event ကို သိမ်း၊ success status ကို မြန်မြန် ပြန်ပေးတာပဲ လုပ်မယ် ဆိုတာပါ။ [[mark:iv-b]] ဒုတိယ၊ event ကို trigger အဖြစ်ပဲ
      သုံးပြီး state ကို API ကနေ ယူမယ်၊ အစဉ် မမှန်တာနဲ့ stale data ကို အဲဒီလို ဖြေရှင်းပြီး API နောက်ကျရင်
      retry လုပ်မယ် ဆိုတာပါ။ [[mark:iv-c]] တတိယ၊ duplicate ကို event id နဲ့ dedupe လုပ်ပြီး effect ကို
      idempotent ထားမယ်၊ ပျောက်သွားတဲ့ webhook ကို reconciliation နဲ့ ရှာမယ် ဆိုတာပါ။ [[mark:iv-d]]
      ပြီးရင် ကိုယ် ဘာ ဆောက်မလဲ ဆက်ပြောပါ။ ပါးပါးလေး endpoint တစ်ခု၊ raw event တွေ သိမ်းတဲ့ inbox table
      တစ်ခု၊ နောက်ကနေ process လုပ်တဲ့ worker တစ်ခုပါ။ bug တစ်ခု ပြင်ပြီးရင် inbox ကနေ ပြန် process
      လုပ်လို့ ရပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Handling webhooks (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#handling-webhooks",
        }
    actions:
