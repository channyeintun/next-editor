build:
  voiceProfile:
    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 9524

runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "raw body:   signature true\nre-encoded: signature false\n"
      run-2:
        status: success
        exitCode: 0
        output: "raw body:   signature true\nre-encoded: signature false\nnaive:  pay_7 authorized, credited 200.00\n"
      run-3:
        status: success
        exitCode: 0
        output: "raw body:   signature true\nre-encoded: signature false\nnaive:  pay_7 authorized, credited 200.00\nworker: pay_7 captured, credited 100.00 - duplicates skipped: 2\n"

scenes:
  - id: hook
    chapter: Webhook ကို ဘယ်သူ ခေါ်တာလဲ
    narration: >-
      ငွေ ဝင်လာပြီ ဆိုတာကို ကိုယ့် system က ကိုယ်တိုင် မေးလို့ သိတာထက်၊ provider က လှမ်းပြောလို့
      သိတာက ပိုများပါတယ်။ webhook ဆိုတာ ကိုယ် ဖွင့်ထားတဲ့ HTTP endpoint ကို provider က ခေါ်ပြီး
      ဖြစ်သွားတဲ့ event တစ်ခုကို ပို့တာပါ။ အဲဒီ endpoint ကို internet ပေါ်က ဘယ်သူမဆို ခေါ်နိုင်လို့ ပထမဆုံး
      မေးရမှာက ဘယ်သူ ခေါ်တာလဲ ဆိုတာပါ။ [[mark:sel-header]] Stripe ဆိုရင် delivery တိုင်းမှာ signature header တစ်ခု ပါပြီး၊ အဲဒီထဲမှာ timestamp တစ်ခုနဲ့ signature တစ်ခု ဒါမှမဟုတ် တစ်ခုထက်ပို ပါပါတယ်။ [[mark:sel-mac]] signature က
      timestamp ရယ်၊ အစက် တစ်ခုရယ်၊ raw body ရယ်ကို ဆက်ထားတဲ့ string ကို endpoint ရဲ့ signing secret
      နဲ့ HMAC SHA ၂၅၆ တွက်ထားတာပါ။ ကိုယ်ကလည်း secret တူတူနဲ့ ပြန်တွက်ပြီး ယှဉ်ရပါတယ်။
      [[mark:sel-equal]] ယှဉ်တဲ့အခါ timing ကနေ ဘာမှ မပေါက်ကြားတဲ့ compare function ကို သုံးပါတယ်။
      [[mark:sel-main]] main က ပထမ delivery ကို နှစ်မျိုး စစ်ပါတယ်။ ရောက်လာတဲ့ byte အတိုင်း တစ်ခါ၊ JSON
      အဖြစ် parse လုပ်ပြီး ပြန် serialize လုပ်ထားတာနဲ့ တစ်ခါပါ။ data ကတော့ အတူတူပါပဲ၊ ဘာထွက်မလဲ
      ခန့်မှန်းကြည့်ပါ။ [[mark:run-1]] run လိုက်ရအောင်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Handling webhooks (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#handling-webhooks",
        }
      - {
          title: "Stripe Docs — Receive Stripe events in your webhook endpoint",
          url: "https://docs.stripe.com/webhooks",
        }
      - {
          title: "Go standard library — crypto/hmac, Equal",
          url: "https://pkg.go.dev/crypto/hmac#Equal",
        }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }
      - id: sel-header
        type: editor.select
        at: { mark: sel-header }
        target:
          {
            file: main.go,
            text: 'for _, part := range strings.Split(header, ",") {',
            occurrence: 1,
          }
      - id: sel-mac
        type: editor.select
        at: { mark: sel-mac }
        target: { file: main.go, text: 'mac.Write([]byte(t + "." + string(body)))', occurrence: 1 }
      - id: sel-equal
        type: editor.select
        at: { mark: sel-equal }
        target: { file: main.go, text: "hmac.Equal([]byte(want), []byte(sig))", occurrence: 1 }
      - id: sel-main
        type: editor.select
        at: { mark: sel-main }
        target:
          {
            file: main.go,
            text: "fmt.Println(\"raw body:   signature\", verify(d.Header, d.Body))\n\tfmt.Println(\"re-encoded: signature\", verify(d.Header, reencode(d.Body)))",
            occurrence: 1,
          }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "re-encoded: signature false",
          timeoutMs: 8000,
        }

  - id: raw
    chapter: Raw byte ပေါ်မှာ verify
    narration: >-
      [[mark:pt-raw]] ရောက်လာတဲ့ byte အတိုင်း စစ်ရင် signature ကိုက်ပါတယ်။ [[mark:pt-re]] ပြန်
      serialize လုပ်ထားတာကို စစ်ရင်တော့ မကိုက်ပါဘူး။ [[mark:show-raw]] HMAC က JSON ရဲ့ အဓိပ္ပာယ်ကို
      မသိပါဘူး၊ byte တွေကိုပဲ သိပါတယ်။ [[mark:raw-2]] parse လုပ်ပြီး ပြန်ထုတ်လိုက်တော့ key တွေက
      အက္ခရာစဉ်အတိုင်း ပြန်စီသွားပြီး space တွေလည်း ပျောက်သွားပါတယ်။ data အတူတူ ဖြစ်ပေမဲ့ byte
      ပြောင်းသွားလို့ hash လုံးဝ ပြောင်းသွားတာပါ။ [[mark:raw-3]] ဒါကြောင့် signature ကို body ကို parse
      မလုပ်ခင်၊ လက်ခံရတဲ့ byte တွေပေါ်မှာ စစ်ရပါတယ်။ request body ကို ကိုယ့်အစား parse လုပ်ပေးတဲ့
      framework တွေမှာ ဒီအမှားက လွယ်လွယ်နဲ့ ဝင်လာတတ်ပါတယ်။ Stripe ကလည်း body ကို တစ်ခုခု
      ပြောင်းလိုက်ရင် verification fail မယ်လို့ ပြောထားပါတယ်။ [[mark:pt-rule]] timestamp ကလည်း
      အရေးကြီးပါတယ်။ Stripe ရဲ့ official library တွေက timestamp နဲ့ လက်ရှိ အချိန် ကြား ငါးမိနစ်ကို default
      အဖြစ် ခွင့်ပြုပါတယ်၊ ဟောင်းနေတဲ့ delivery တစ်ခုကို ကူးပြီး ပြန်ပို့တဲ့ replay ကို ကာကွယ်ဖို့ပါ။
      signature မှန်တာက provider ဆီက လာတာ သေချာတယ် ဆိုတာပဲ ပြပါတယ်၊ content မှန်တယ် ဆိုတာကို
      မပြပါဘူး။
    sources:
      - {
          title: "Fintech Engineering Handbook — Handling webhooks (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#handling-webhooks",
        }
      - {
          title: "Stripe Docs — Receive Stripe events in your webhook endpoint",
          url: "https://docs.stripe.com/webhooks",
        }
      - {
          title: "Stripe Docs — Manage webhook endpoints",
          url: "https://docs.stripe.com/events/manage-webhook-endpoints",
        }
    actions:
      - id: pt-raw
        type: console.point
        at: { mark: pt-raw }
        target: { text: "raw body:   signature true", occurrence: 1 }
      - id: pt-re
        type: console.point
        at: { mark: pt-re }
        target: { text: "re-encoded: signature false", occurrence: 1 }
      - { id: show-raw, type: slide.show, at: { mark: show-raw, offsetMs: -700 }, slideId: raw-1 }
      - {
          id: pt-ok,
          type: slide.point,
          at: { afterAction: show-raw },
          target: { x: 0.382, y: 0.453 },
        }
      - { id: raw-2, type: slide.show, at: { mark: raw-2 }, slideId: raw-2 }
      - {
          id: pt-re-line,
          type: slide.point,
          at: { afterAction: raw-2 },
          target: { x: 0.121, y: 0.638 },
        }
      - { id: raw-3, type: slide.show, at: { mark: raw-3 }, slideId: raw-3 }
      - {
          id: pt-rule-chip,
          type: slide.point,
          at: { afterAction: raw-3 },
          target: { x: 0.321, y: 0.869 },
        }
      - { id: pt-rule, type: slide.point, at: { mark: pt-rule }, target: { x: 0.382, y: 0.453 } }

  - id: naive
    chapter: Webhook ကို ယုံပြီး apply လုပ်ရင်
    narration: >-
      [[mark:close-raw]] signature မှန်တဲ့ webhook တွေကို ယုံပြီး apply လုပ်ရင် ဘာဖြစ်မလဲ ကြည့်ရအောင်။
      [[mark:open-events]] ဒီဖိုင်ထဲမှာ ကိုယ့် endpoint ဆီ ရောက်လာတဲ့ delivery လေးခုကို ရောက်တဲ့
      အစဉ်အတိုင်း ထည့်ထားပါတယ်။ [[mark:sel-deliv]] payment တစ်ခုတည်းရဲ့ captured နဲ့ authorized event
      တွေပါ၊ နောက်ဆုံး နှစ်ခုက provider ရဲ့ retry တွေပါ။ ကိုယ့် ledger ရဲ့ စည်းမျဉ်းကတော့ payment က
      captured ဖြစ်သွားတဲ့ အခိုက်မှာ user ကို credit လုပ်တာပါ။ [[mark:open-main-2]] ပထမ စမ်းကြည့်မှာက
      ပုံမှန် handler တစ်ခုပါ။ [[mark:type-naive]] event တစ်ခုချင်းကို ရောက်တဲ့ အစဉ်အတိုင်း decode လုပ်ပြီး၊
      event ထဲက status နဲ့ amount ကို ledger ဆီ တန်းပို့ပါတယ်။ signature ကိုလည်း မစစ်ပါဘူး။ [[mark:run-2]] run လိုက်ရအောင်။ [[mark:pt-naive]] payment က authorized ဆိုတဲ့
      state အဟောင်းမှာ ရပ်နေပြီး၊ user ကို ယူရို နှစ်ရာ credit လုပ်ထားပါတယ်။ တကယ် ဝင်တာက ယူရို
      တစ်ရာပဲ ရှိပါတယ်။ authorized ရောက်လာတော့ state နောက်ပြန် ဆုတ်သွားပြီး၊ captured ကို retry
      နဲ့ ထပ်ရတော့ capture နောက်တစ်ခါ ဖြစ်တယ်လို့ ledger က ထင်သွားလို့ပါ။ [[mark:dock-2]] signature
      မှန်တဲ့ message တွေချည်းပဲ ဖြစ်ပေမဲ့ ငွေက မရှိဘဲ ပေါ်လာပါပြီ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Handling webhooks (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#handling-webhooks",
        }
    actions:
      - { id: close-raw, type: slide.close, at: { mark: close-raw } }
      - { id: open-events, type: workspace.openFile, at: { mark: open-events }, path: events.go }
      - id: sel-deliv
        type: editor.select
        at: { mark: sel-deliv }
        target:
          {
            file: events.go,
            text: "// What reached us, in arrival order. The last two are the provider's retries.",
            occurrence: 1,
          }
      - { id: open-main-2, type: workspace.openFile, at: { mark: open-main-2 }, path: main.go }
      - id: type-naive
        type: editor.type
        at: { mark: type-naive }
        target:
          {
            file: main.go,
            after: "\tfmt.Println(\"re-encoded: signature\", verify(d.Header, reencode(d.Body)))\n",
            occurrence: 1,
          }
        text: "\n\tvar naive Payment\n\tfor _, d := range deliveries {\n\t\te := decode(d.Body)\n\t\tnaive.move(e.Status(), e.Amount)\n\t}\n\tfmt.Println(\"naive:  pay_7\", naive)\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "naive:  pay_7 authorized, credited 200.00",
          timeoutMs: 8000,
        }
      - id: pt-naive
        type: console.point
        at: { mark: pt-naive }
        target: { text: "naive:  pay_7 authorized, credited 200.00", occurrence: 1 }
      - { id: dock-2, type: runtime.collapseDock, at: { mark: dock-2 } }

  - id: order
    chapter: အစဉ်၊ duplicate၊ ပျောက်တာ
    narration: >-
      [[mark:show-order]] payment ပေါ်မှာ authorized က အရင် ဖြစ်ပြီး captured က နောက်မှ ဖြစ်တာပါ။
      ဒါပေမဲ့ ရောက်လာတဲ့ အစဉ်က ပြောင်းပြန်ပါ။ Stripe ကိုယ်တိုင်က event တွေ ဖြစ်ခဲ့တဲ့ အစဉ်အတိုင်း
      ရောက်မယ်လို့ guarantee မပေးပါဘူး။ [[mark:order-2]] provider က event နှစ်ခုလုံးကို ထပ်ပို့ပါတယ်။
      Stripe က endpoint တစ်ခုဟာ event တစ်ခုတည်းကို တစ်ခါထက် ပိုရနိုင်တယ်လို့ ပြောထားပြီး၊ live mode
      မှာ fail ဖြစ်တဲ့ delivery ကို exponential backoff နဲ့ သုံးရက်အထိ retry လုပ်ပါတယ်။ [[mark:pt-note]]
      ဆိုလိုတာက နောက်ဆုံး ရောက်လာတဲ့ webhook က နောက်ဆုံး အခြေအနေ မဟုတ်ပါဘူး။ ရောက်လာတဲ့
      data ကိုယ်တိုင်လည်း provider ရဲ့ ဘေးက system တစ်ခုက ထုတ်ထားလို့ stale ဖြစ်နေတာ၊ မှားပြောင်းထားတာ
      ဖြစ်နိုင်ပါတယ်။ [[mark:order-3]] ဒါကြောင့် webhook ရဲ့ content ကို မယုံဘဲ trigger အဖြစ်ပဲ သုံးပြီး၊
      အမှန် state ကို provider ရဲ့ API ကနေ မေးယူပါတယ်။ webhook ဆိုတာ တစ်ခုခု ဖြစ်သွားတယ် ဆိုတဲ့
      hint ပဲ၊ ဘာဖြစ်ခဲ့လဲ ဆိုတဲ့ မှတ်တမ်း မဟုတ်ပါဘူး။
    sources:
      - {
          title: "Fintech Engineering Handbook — Handling webhooks (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#handling-webhooks",
        }
      - {
          title: "Stripe Docs — How events work (Automatic retries, Event ordering)",
          url: "https://docs.stripe.com/events/how-events-work",
        }
      - {
          title: "Stripe Docs — Receive Stripe events in your webhook endpoint",
          url: "https://docs.stripe.com/webhooks",
        }
    actions:
      - {
          id: show-order,
          type: slide.show,
          at: { mark: show-order, offsetMs: -700 },
          slideId: order-1,
        }
      - {
          id: pt-m2,
          type: slide.point,
          at: { afterAction: show-order },
          target: { x: 0.298, y: 0.497 },
        }
      - { id: order-2, type: slide.show, at: { mark: order-2 }, slideId: order-2 }
      - {
          id: pt-m3,
          type: slide.point,
          at: { afterAction: order-2 },
          target: { x: 0.298, y: 0.582 },
        }
      - { id: pt-note, type: slide.point, at: { mark: pt-note }, target: { x: 0.475, y: 0.751 } }
