    files:
      events.go: |
        package main

        import (
        	"encoding/json"
        	"strings"
        )

        // The signing secret we share with the provider (a test value).
        var secret = []byte("demo-signing-secret")

        // Delivery is one HTTP call to our webhook endpoint: the signature header and the raw body.
        type Delivery struct {
        	Header string
        	Body   []byte
        }

        var captured = []byte(`{"id": "evt_2", "type": "payment.captured", "payment": "pay_7", "amount": 10000}`)
        var authorized = []byte(`{"id": "evt_1", "type": "payment.authorized", "payment": "pay_7", "amount": 10000}`)

        // What reached us, in arrival order. The last two are the provider's retries.
        var deliveries = []Delivery{
        	{"t=1764237845,v1=d0054ea43fa797b28266d175903deed4f8a678d07b86d93a998a4a6dc4051c8c", captured},
        	{"t=1764237846,v1=7bed0c02ce963c1ff26977865a520676a00e83fe66326da91ed190cf6abbf513", authorized},
        	{"t=1764237905,v1=196ed1a2b160d5f07ab54a3af48f5ca66f70cde014de0a642ed3b6d352489b31", captured},
        	{"t=1764237906,v1=3eb949460c86af6f92a4983da32e0ccc329cc07aa859b25e69b900462ff6d629", authorized},
        }

        // Event is the part of a webhook body we read.
        type Event struct {
        	ID      string
        	Type    string
        	Payment string
        	Amount  int64
        }

        func decode(body []byte) Event {
        	var e Event
        	if err := json.Unmarshal(body, &e); err != nil {
        		panic(err)
        	}
        	return e
        }

        func (e Event) Status() string { return strings.TrimPrefix(e.Type, "payment.") }

        // reencode is what a framework does when it parses the body and serializes it again.
        func reencode(body []byte) []byte {
        	var m map[string]any
        	if err := json.Unmarshal(body, &m); err != nil {
        		panic(err)
        	}
        	out, _ := json.Marshal(m)
        	return out
        }
      main.go: |
        package main

        import (
        	"crypto/hmac"
        	"crypto/sha256"
        	"encoding/hex"
        	"fmt"
        	"strings"
        )

        // verify checks a header "t=<time>,v1=<hex>": an HMAC-SHA256 of "<time>.<body>".
        // A real header can carry several v1 entries (one per active secret); this demo reads one.
        func verify(header string, body []byte) bool {
        	var t, sig string
        	for _, part := range strings.Split(header, ",") {
        		k, v, _ := strings.Cut(part, "=")
        		switch k {
        		case "t":
        			t = v
        		case "v1":
        			sig = v
        		}
        	}
        	mac := hmac.New(sha256.New, secret)
        	mac.Write([]byte(t + "." + string(body)))
        	want := hex.EncodeToString(mac.Sum(nil))
        	return hmac.Equal([]byte(want), []byte(sig))
        }

        var inbox [][]byte

        // endpoint is the HTTP handler: verify, store the raw bytes, answer 2xx. Nothing else.
        func endpoint(d Delivery) int {
        	if !verify(d.Header, d.Body) {
        		return 400
        	}
        	inbox = append(inbox, d.Body)
        	return 200
        }

        func main() {
        	d := deliveries[0]
        	fmt.Println("raw body:   signature", verify(d.Header, d.Body))
        	fmt.Println("re-encoded: signature", verify(d.Header, reencode(d.Body)))

        	for _, d := range deliveries {
        		endpoint(d)
        	}
        }
      payment.go: |
        package main

        import "fmt"

        // fetch asks the provider's API for the payment's state now: the authority, not the event.
        func fetch(payment string) (status string, amount int64) {
        	if payment == "pay_7" {
        		return "captured", 10000
        	}
        	return "unknown", 0
        }

        // Payment is our view of one payment.
        type Payment struct {
        	Status   string
        	Credited int64
        }

        // move applies a status the way our ledger does: a capture credits the user.
        func (p *Payment) move(status string, amount int64) {
        	if status == "captured" && p.Status != "captured" {
        		p.Credited += amount
        	}
        	p.Status = status
        }

        func (p Payment) String() string {
        	return fmt.Sprintf("%s, credited %d.%02d", p.Status, p.Credited/100, p.Credited%100)
        }
