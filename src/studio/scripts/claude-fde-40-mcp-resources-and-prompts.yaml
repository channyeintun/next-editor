  - id: resource
    chapter: Resource
    narration: >
      [[mark:type-r1]] လိုင်းကျမှု စာရင်းကို resource အဖြစ် ထည့်ကြည့်ရအောင်။ decorator ထဲမှာ function နာမည် မဟုတ်ဘဲ URI
      တစ်ခု ပေးပါတယ်။ client တွေက ဒီ resource ကို အဲဒီ URI နဲ့ ခေါ်ပါတယ်။ ဒီ function က dictionary တစ်ခု ပြန်ပေးတာမို့ SDK
      က JSON စာသား အဖြစ် ပြောင်းပို့ပါတယ်။
      [[mark:sel-mime]] MIME type ကို သတိထားပါ။ မပေးရင် plain text လို့ပဲ ယူဆပြီး၊ SDK က ကိုယ့်အစား ခန့်မှန်းမပေးပါဘူး။
      JSON ပြန်ပေးတာမို့ application JSON လို့ ကိုယ်တိုင် ပြောထားရပါတယ်။
      [[mark:r-when]] ဒီ resource က client ရဲ့ resources list ထဲမှာ ပေါ်ပါတယ်။ ဒါပေမဲ့ function က စာရင်း ပြတဲ့အချိန်မှာ
      မ run သေးပါဘူး။ client က ဒီ URI ကို တကယ် ဖတ်တဲ့အခါ ကျမှ run ပြီး၊ အဲဒီအချိန်ရဲ့ NMS data ကို ပြန်ပေးပါတယ်။
      host app က ဒီ resource ကို ရွေးစရာ အဖြစ် ပြပေးရင်၊ support lead က စာရင်းကို စကားဝိုင်းထဲ တစ်ချက်တည်းနဲ့ ထည့်လို့ ရသွားပါပြီ။
      [[mark:r-types]] ပြန်ပေးတဲ့ type အလိုက်လည်း ပို့ပုံ ကွာပါတယ်။ string ဆိုရင် စာသားအတိုင်း၊ dictionary ဆိုရင် JSON
      စာသားအဖြစ် ပို့ပြီး၊ bytes ဆိုရင်တော့ encode လုပ်ထားတဲ့ binary data အဖြစ် ပို့ပါတယ်။ ဆိုတော့ invoice PDF လို file မျိုးကိုလည်း
      resource အဖြစ် ပေးလို့ ရပါတယ်။ Claude Code မှာဆိုရင် user က prompt box ထဲမှာ at sign ရိုက်ပြီး server ရဲ့ resource ကို
      ညွှန်းလို့ ရပါတယ်။
    sources:
      - {
          title: "MCP Python SDK: Resources",
          url: "https://py.sdk.modelcontextprotocol.io/servers/resources/",
        }
      - {
          title: "MCP specification 2026-07-28: Resources",
          url: "https://modelcontextprotocol.io/specification/2026-07-28/server/resources",
        }
    actions:
      - {
          id: close-control,
          type: whiteboard.apply,
          at: { mark: type-r1, offsetMs: -600 },
          open: false,
        }
      - id: type-r1
        type: editor.type
        at: { mark: type-r1 }
        cadence: line-by-line
        target: { file: ticket-mcp/server.py, after: "    return outage_status(township)\n" }
        text: "\n\n@mcp.resource(\"outages://current\", mime_type=\"application/json\")\ndef current_outages() -> dict:\n    \"\"\"Townships with an outage right now, from the NMS.\"\"\"\n    return outage_list()\n"
      - id: sel-mime
        type: editor.select
        at: { mark: sel-mime }
        target:
          file: ticket-mcp/server.py
          text: 'mime_type="application/json"'

  - id: template
    chapter: Resource template
    narration: >
      [[mark:type-r2]] ဒုတိယ resource က ticket တစ်ခုရဲ့ message အားလုံးပါ။ ticket တိုင်းအတွက် URI တစ်ခုစီ မရေးနိုင်တာမို့
      URI ထဲမှာ ticket id အတွက် နေရာလွတ် တစ်ခု ထားပါတယ်။ ဒါကို resource template လို့ ခေါ်ပါတယ်။ client က အဲဒီ
      နေရာလွတ်ကို ticket id နဲ့ ဖြည့်ပြီး ဖတ်ပါတယ်။
      [[mark:sel-param]] နေရာလွတ်ရဲ့ နာမည်နဲ့ function ရဲ့ parameter နာမည် တူရပါမယ်။ မတူရင် file ကို import လုပ်ကတည်းက
      SDK က error ပြပါတယ်။ server စ run မှ သိရတာ မဟုတ်လို့ အမှားကို စောစော တွေ့ရပါတယ်။
      [[mark:r-list]] template က resources list ထဲမှာ မပေါ်ဘဲ resource templates list ဆိုတဲ့ သီးခြား စာရင်းထဲမှာ ပေါ်ပါတယ်။
      Inspector မှာ စမ်းရင်လည်း template အတွက် သီးခြား နေရာမှာ တွေ့ရမှာပါ။ URI template တွေက internet standard တစ်ခုကို
      လိုက်နာပြီး၊ path ကို ဘေးကင်းအောင် စစ်တာကိုလည်း SDK က default အနေနဲ့ ဖွင့်ထားပါတယ်။ ဒီ နှစ်ခုလုံးက data ကို ဖတ်ရုံပဲ ဖတ်ပြီး ဘာမှ
      မပြင်ဘူး ဆိုတာကလည်း server ရဲ့ စည်းကမ်းနဲ့ ကိုက်ပါတယ်။
    sources:
      - {
          title: "MCP Python SDK: Resources",
          url: "https://py.sdk.modelcontextprotocol.io/servers/resources/",
        }
    actions:
      - id: type-r2
        type: editor.type
        at: { mark: type-r2 }
        cadence: line-by-line
        target: { file: ticket-mcp/server.py, after: "    return outage_list()\n" }
        text: "\n\n@mcp.resource(\"tickets://{ticket_id}/history\")\ndef ticket_history(ticket_id: str) -> str:\n    \"\"\"Every message of one ticket, oldest first.\"\"\"\n    return ticket_messages(ticket_id)\n"
      - id: sel-param
        type: editor.select
        at: { mark: sel-param }
        target:
          file: ticket-mcp/server.py
          text: "def ticket_history(ticket_id: str)"

  - id: prompt
    chapter: Prompt
    narration: >
      [[mark:type-p1]] လှလှ ရဲ့ ဒုတိယ တောင်းဆိုချက်အတွက် prompt တစ်ခု ထည့်ပါမယ်။ prompt ဆိုတာ model ကို ပေးလိုက်တဲ့ စာပါ။
      decorator ထဲမှာ title ကို ပေးထားတာက client ရဲ့ UI မှာ user မြင်ရမယ့် နာမည်အတွက်ပါ။ function နာမည်က prompt ရဲ့ နာမည်၊
      docstring က description ဖြစ်လာတာက tool နဲ့ အတူတူပါပဲ။
      [[mark:type-p2]] function ကတော့ string တစ်ခု ပြန်ပေးပါတယ်။ အဲဒီ string က user message တစ်ခု ဖြစ်လာပါတယ်။ ဒီ ညွှန်ကြားချက်ထဲမှာ
      အဲဒီ မြို့နယ်ကို check outage tool နဲ့ အရင် စစ်ဖို့၊ မြန်မာလို ယဉ်ယဉ်ကျေးကျေး တိုတိုရေးဖို့နဲ့ ပြင်ဆင်ချိန်ကို ဘယ်တော့မှ ကတိမပေးဖို့ ရေးထားပါတယ်။
      support lead နှစ်ယောက် ကွဲပြားခဲ့တဲ့ အချက်တွေကို team က တစ်ခါပဲ ဆုံးဖြတ်ပြီး ဒီမှာ ထားလိုက်တာပါ။
      [[mark:p-multi]] message တစ်ခုထက် ပိုလိုရင်တော့ user message နဲ့ assistant message တွေကို စာရင်း တစ်ခုနဲ့ ပြန်ပေးလို့
      ရပါတယ်။ ဥပမာအားဖြင့် ကောင်းတဲ့ အဖြေ နမူနာ တစ်ခုကို assistant message အဖြစ် ထည့်ပေးတာမျိုးပါ။ Claude Code မှာဆိုရင်
      ဒီ prompt က server နာမည်နဲ့ prompt နာမည် တွဲထားတဲ့ slash command တစ်ခု အဖြစ် ပေါ်လာပါတယ်။
      [[mark:sel-arg]] prompt ရဲ့ argument တွေက နာမည်ပါတဲ့ string တွေ ဖြစ်ပြီး၊ tool လို JSON Schema မရှိပါဘူး။ ဒီမှာ မြို့နယ်
      နာမည် တစ်ခုပဲ ယူပါတယ်။ မဖြစ်မနေ လိုတဲ့ argument ကို မပေးရင် request က error နဲ့ ပြန်ကျပါတယ်။ prompt ရဲ့ စာက server
      ထဲမှာ ရှိတာမို့၊ ညွှန်ကြားချက် ပြောင်းချင်ရင် server ကို တစ်နေရာတည်း ပြင်ရုံပါ။
    sources:
      - {
          title: "MCP Python SDK: Prompts",
          url: "https://py.sdk.modelcontextprotocol.io/servers/prompts/",
        }
      - {
          title: "MCP specification 2026-07-28: Prompts",
          url: "https://modelcontextprotocol.io/specification/2026-07-28/server/prompts",
        }
    actions:
      - id: type-p1
        type: editor.type
        at: { mark: type-p1 }
        cadence: line-by-line
        target: { file: ticket-mcp/server.py, after: "    return ticket_messages(ticket_id)\n" }
        text: "\n\n@mcp.prompt(title=\"Outage reply\")\ndef outage_reply(township: str) -> str:\n    \"\"\"Start a reply to a customer whose township has an outage.\"\"\"\n"
      - id: type-p2
        type: editor.type
        at: { mark: type-p2 }
        cadence: line-by-line
        target: { file: ticket-mcp/server.py, after: "whose township has an outage.\"\"\"\n" }
        text: "    return (f\"A customer in {township} has no internet. Run check_outage for it first, \"\n            \"then draft a short, polite reply in Burmese. Never promise a repair time.\")\n"
      - id: expect-p2
        type: expect.file
        at: { afterAction: type-p2 }
        path: ticket-mcp/server.py
        contains: "@mcp.prompt(title=\"Outage reply\")\ndef outage_reply(township: str) -> str:\n"
      - id: sel-arg
        type: editor.select
        at: { mark: sel-arg }
        target:
          file: ticket-mcp/server.py
          text: "def outage_reply(township: str)"

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ Reply assistant က အဖြေ မူကြမ်း ရေးနေတုန်း၊ customer က အရင်ကလည်း ဒီ ပြဿနာကို
      တိုင်ဖူးလား ဆိုတာ သိဖို့ လိုတဲ့ ticket တွေ ရှိပါတယ်။ ဒါပေမဲ့ ticket အများစုမှာတော့ မလိုပါဘူး။ customer ရဲ့ ဖုန်းနံပါတ်နဲ့
      အရင် ticket တွေကို ရှာပေးတာကို ticket-mcp ထဲ ထည့်ချင်တယ် ဆိုပါစို့။ ဒါကို ဘယ်အမျိုးအစားနဲ့ ထုတ်ပေးသင့်မလဲ။
      [[mark:q-a]] ပထမ အဖြေက resource ပါ။ app က ticket တိုင်းရဲ့ အစမှာ အရင် ticket တွေကို ကြိုထည့်ထားမယ် ဆိုတာပါ။
      [[mark:q-b]] ဒုတိယ အဖြေက tool ပါ။ model က လိုမှ ရှာမယ် ဆိုတာပါ။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ တစ်ခုပါ။ ဘာကြောင့်လဲဆိုတော့ ရှာဖို့ လိုမလို ဆိုတာ ticket ရဲ့ စာကို ဖတ်ပြီးမှ
      သိရတာမို့၊ ဆုံးဖြတ်တဲ့သူက model ဖြစ်လို့ပါ။ resource နဲ့ ကြိုထည့်ရင် မလိုတဲ့ ticket တွေမှာပါ customer ရဲ့ ticket
      အဟောင်းတွေ context ထဲ ဝင်လာပြီး၊ model က စာကို ဖြတ်ယူတဲ့ အပိုင်းအစ ဖြစ်တဲ့ token တွေလည်း ကုန်၊ ကိုယ်ရေးအချက်အလက်လည်း လိုတာထက် ပိုမြင်သွားပါမယ်။
      [[mark:q-rule]] ဒါကြောင့် ဘယ်အမျိုးအစား ဖြစ်မလဲ ဆိုတာ data ရဲ့ ပုံစံကို မကြည့်ဘဲ၊ ဘယ်သူက ဘယ်အချိန် သုံးမလဲ ဆုံးဖြတ်တာလဲ
      ဆိုတာကို ကြည့်ပြီး ရွေးပါ။ model ဆုံးဖြတ်ရင် tool၊ app ဆုံးဖြတ်ရင် resource၊ user ရွေးရင် prompt ပါ။
    sources:
      - {
          title: "MCP specification 2026-07-28: Server features overview",
          url: "https://modelcontextprotocol.io/specification/2026-07-28/server",
        }
      - {
          title: "MCP specification 2026-07-28: Tools",
          url: "https://modelcontextprotocol.io/specification/2026-07-28/server/tools",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: q-rule },
          upsertIds: [q-t1, q-t2],
          drawMs: 1600,
        }

  - id: your-turn
    chapter: သုံးမျိုး ခွဲကြည့်ခြင်း
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ကိုယ့် system အတွက် server တစ်ခုက ပေးနိုင်မယ့် အရာ သုံးခုကို
      စဉ်းစားကြည့်ပါ။ ဒီ file ရဲ့ အောက်ဆုံးမှာ comment သုံးကြောင်းနဲ့ တစ်ခုစီကို ရေးပြီး၊ tool လား၊ resource လား၊ prompt လား
      ဆိုတာ ဘေးမှာ မှတ်ပါ။
      [[mark:turn-2]] ခွဲတဲ့အခါ မေးခွန်း တစ်ခုတည်းကိုပဲ မေးပါ။ ဒါကို ဘယ်အချိန် သုံးမလဲ ဆိုတာ model က ဆုံးဖြတ်တာလား၊ app
      ကလား၊ user ကိုယ်တိုင် ရွေးတာလား ဆိုတာပါ။ resource ဖြစ်ရင် URI ကို၊ prompt ဖြစ်ရင် argument ကိုပါ တစ်ခါတည်း ရေးကြည့်ပါ။
    sources:
      - {
          title: "MCP specification 2026-07-28: Server features overview",
          url: "https://modelcontextprotocol.io/specification/2026-07-28/server",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: turn }, open: false }
      - id: sel-r1
        type: editor.select
        at: { mark: turn-2 }
        target:
          file: ticket-mcp/server.py
          text: '@mcp.resource("outages://current", mime_type="application/json")'

  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ MCP server တစ်ခုက tool၊ resource၊ prompt ဆိုပြီး သုံးမျိုး ပေးနိုင်ပါတယ်။ ဘယ်အမျိုးအစား
      ဖြစ်မလဲ ဆိုတာ ဘယ်သူ ရွေးလဲ ဆိုတာကနေ ဆုံးဖြတ်ပါတယ်။ tool ကို model၊ resource ကို application၊ prompt ကို user က
      ရွေးပါတယ်။
      [[mark:next]] နောက် lesson မှာတော့ Billing team ရဲ့ Claude Code ကနေ ဒီ server ကို တကယ် ချိတ်ရင်း၊ MCP client က ဘာလုပ်လဲ
      ဆိုတာကို လေ့လာသွားပါမယ်။
