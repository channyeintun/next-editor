  - id: control
    chapter: ဘယ်သူ ရွေးလဲ
    narration: >
      [[mark:c-open]] MCP server တစ်ခုက ပေးနိုင်တာ သုံးမျိုး ရှိပါတယ်။ ခွဲခြားဖို့ အကောင်းဆုံး မေးခွန်းက ဘယ်သူ ရွေးလဲ ဆိုတာပါ။
      [[mark:c-1]] ပထမ တစ်မျိုးက tool ပါ။ spec က tool ကို model ထိန်းချုပ်တယ်လို့ ခေါ်ပါတယ်။ model က tool စာရင်းကို
      ကြည့်ပြီး ကိုယ်တိုင် ရွေးခေါ်ပါတယ်။ tool က အလုပ် တစ်ခုခု လုပ်တာမို့ POST request နဲ့ တူပါတယ်။
      [[mark:c-2]] ဒုတိယ တစ်မျိုးက resource ပါ။ resource ဆိုတာ server က ဖတ်ခွင့်ပေးထားတဲ့ data ပါ။ spec မှာ application
      ထိန်းချုပ်တယ်လို့ ခေါ်ပါတယ်။ host app က resource တစ်ခုကို ဘယ်လို သုံးမလဲ ဆုံးဖြတ်ပါတယ်။ user ရွေးဖို့ စာရင်း
      ပြတာ ဖြစ်နိုင်သလို၊ ရှာပေးတာ၊ အလိုအလျောက် ထည့်ပေးတာလည်း ဖြစ်နိုင်ပါတယ်။ data ကို ဖတ်ရုံ ဖတ်ပြီး ဘာမှ မပြောင်းတာမို့
      GET request နဲ့ တူပါတယ်။
      [[mark:c-3]] တတိယ တစ်မျိုးက prompt ပါ။ server က ကြိုရေးထားတဲ့ ညွှန်ကြားချက် template ဖြစ်ပြီး၊ user ထိန်းချုပ်ပါတယ်။
      ဆိုလိုတာက prompt ရဲ့ စာကို server က ရေးပေမဲ့၊ ဘယ်အချိန် သုံးမလဲ ဆိုတာကို user ကိုယ်တိုင် နာမည်နဲ့ ရွေးတာပါ။ app
      တွေမှာ slash command လိုမျိုး ပေါ်လာတတ်ပါတယ်။
      [[mark:c-human]] tool အတွက် spec က နောက်ထပ် တစ်ချက် ဆိုထားပါတယ်။ model က ကိုယ်တိုင် ရွေးခေါ်ပေမဲ့၊ tool call ကို
      ငြင်းနိုင်တဲ့ လူ တစ်ယောက် အမြဲ ရှိသင့်ပါတယ်။ resource နဲ့ prompt မှာတော့ ရွေးတာကိုယ်တိုင်က app ဒါမှမဟုတ် user ဘက်မှာ
      ရှိပြီးသားပါ။
      [[mark:c-back]] ဒါဆို လှလှ ရဲ့ ပထမ တောင်းဆိုချက်က resource ဖြစ်ပြီး၊ ဒုတိယ တစ်ခုက prompt ဖြစ်ပါတယ်။
