scenes:
  - id: need
    chapter: Tool မဟုတ်တဲ့ လိုအပ်ချက်
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ ticket-mcp server ကို Python နဲ့ ရေးပြီး၊ function ရဲ့ type hint နဲ့ docstring ကနေ model
      မြင်ရမယ့် tool နှစ်ခုကို ထုတ်ပေးခဲ့ပါတယ်။
      [[mark:sel-tools]] tool ဆိုတာ model က တောင်းဆိုရင် program က လုပ်ပေးတဲ့ လုပ်ဆောင်ချက် တစ်ခုပါ။ ဒီ tool တွေကို
      ဘယ်အချိန် ခေါ်မလဲ ဆိုတာ model က ဆုံးဖြတ်ပါတယ်။
      [[mark:n-ask1]] ဒီအပတ် support manager လှလှ ဆီက တောင်းဆိုချက် နှစ်ခု ရောက်လာပါတယ်။ ပထမ တစ်ခုက support lead တွေ
      Claude Desktop မှာ လိုင်းကျမှု ticket တွေကို ဖြေတဲ့အခါ၊ NMS ကနေ အခု လိုင်းကျနေတဲ့ မြို့နယ် စာရင်းကို copy ကူးပြီး
      စကားဝိုင်းထဲ ကိုယ်တိုင် ထည့်နေရတာပါ။ ဒီ စာရင်းကို ကြည့်ပြီး ထည့်ချင်တဲ့ အချိန်မှာ တစ်ချက်တည်းနဲ့ ထည့်လို့ရရင်
      ကောင်းမယ်လို့ ပြောပါတယ်။
      [[mark:n-ask2]] ဒုတိယ တစ်ခုက လိုင်းကျမှု အဖြေကို support lead တစ်ယောက်ချင်းစီက ညွှန်ကြားချက် မတူဘဲ ရေးခိုင်းနေတာပါ။
      တစ်ယောက်က ပြင်ဆင်ချိန်ကို ကတိပေးခိုင်းမိပြီး၊ နောက်တစ်ယောက်က မြန်မာလို မဟုတ်ဘဲ အင်္ဂလိပ်လို ရေးခိုင်းမိပါတယ်။
      team တစ်ခုလုံး သဘောတူထားတဲ့ ညွှန်ကြားချက် တစ်ခုကို ရွေးပြီး စလို့ရရင် ကောင်းမယ်လို့ ဆိုပါတယ်။
      [[mark:n-q]] ဒီ နှစ်ခုလုံးမှာ ဘယ်အချိန် သုံးမလဲ ဆိုတာ model က ဆုံးဖြတ်တာ မဟုတ်ပါဘူး။ ဒါကြောင့် tool တစ်ခု ထပ်ထည့်တာက
      အဖြေ မဟုတ်ပါဘူး။ Model Context Protocol၊ အတိုကောက် MCP server ပေးနိုင်တဲ့ နောက်ထပ် အမျိုးအစား နှစ်ခု ရှိပါတယ်။
