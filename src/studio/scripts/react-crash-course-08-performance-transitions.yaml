  # ------------------------------------------------------------------ 9
  - id: transition-board
    chapter: "Transition နဲ့ deferred value"
    narration: >
      နောက် ပြဿနာ တစ်ခုက render တချို့ တကယ်ကို နှေးတာပါ။ [[mark:draw-urgent]]
      စာရိုက်တာ၊ နှိပ်တာက urgent ပါ၊ screen က ချက်ချင်း တုံ့ပြန်ရပါမယ်။
      [[mark:draw-transition]] data များတဲ့ tab ပြောင်းတာကတော့ စောင့်လို့ ရပါတယ်။
      Transition ဆိုတာ အလောတကြီး မဟုတ်တဲ့ state update ပါ၊ React က နောက်ကွယ်မှာ
      render လုပ်ပါတယ်။ [[mark:draw-interrupt]] အဲဒီကြားထဲ စာရိုက်ရင် React က
      render ကို ရပ်ပြီး စာကို အရင် ပြပါတယ်၊ ပြီးမှ Transition ကို အစကနေ
      ပြန်စပါတယ်။ [[mark:draw-pending]] Transition ကို useTransition ဆိုတဲ့ hook
      နဲ့ စပြီး၊ စောင့်နေတုန်း သူပေးတဲ့ isPending က true ဖြစ်လို့ loading စာသား
      ပြလို့ ရပါတယ်။ [[mark:draw-tracks]] timeline ပေါ်မှာ ကြည့်ချင်ရင် React 19.2
      က Chrome DevTools ထဲ Performance Tracks ထည့်ပေးပါတယ်။
    sources:
      - title: "React — useTransition"
        url: "https://react.dev/reference/react/useTransition"
      - title: "React — React Performance tracks"
        url: "https://react.dev/reference/dev-tools/react-performance-tracks"
      - title: "React 19.2 — Performance Tracks"
        url: "https://react.dev/blog/2025/10/01/react-19-2"
    actions:
      - id: board-transition
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        clear: true
        upsertIds: [b5-title]
      - id: draw-urgent
        type: whiteboard.apply
        at: { mark: draw-urgent }
        upsertIds: [b5-urgent-box, b5-urgent-head, b5-urgent-l1, b5-urgent-l2]
        drawMs: 1800
      - id: draw-transition
        type: whiteboard.apply
        at: { mark: draw-transition }
        upsertIds: [b5-trans-box, b5-trans-head, b5-trans-l1, b5-trans-l2]
        drawMs: 1800
      - id: draw-interrupt
        type: whiteboard.apply
        at: { mark: draw-interrupt }
        upsertIds: [b5-interrupt]
        drawMs: 1200
      - id: draw-pending
        type: whiteboard.apply
        at: { mark: draw-pending }
        upsertIds: [b5-pending]
        drawMs: 1000
      - id: draw-tracks
        type: whiteboard.apply
        at: { mark: draw-tracks }
        upsertIds: [b5-tracks]
        drawMs: 1000

  # ------------------------------------------------------------------ 10
  - id: history-transition
    narration: >
      [[mark:close-board-transition]] အရင်က order တွေရဲ့ မှတ်တမ်း
      ဆောက်ကြည့်ရအောင်။ [[mark:open-slowlist]] SlowList က ရေးပြီးသားပါ။
      [[mark:select-slow-loop]] ဒီ loop က row တိုင်း 10 millisecond တမင်
      စောင့်စေလို့၊ row 250 ခု render တာ နှေးပါတယ်။ [[mark:select-slowlist-memo]]
      memo နဲ့ ထုပ်ထားတာကိုလည်း ကြည့်ထားပါ၊ နောက်မှ လိုပါမယ်။
      [[mark:open-history]] HistoryPanel ကတော့ အလွတ်ပါ။ [[mark:type-hp-top]]
      SlowList ကို import လုပ်ပြီး၊ လက်ရှိ tab ကို state ထဲမှာ ထားပါတယ်။ အစမှာ
      ဒီနေ့ tab ကနေ စပါတယ်။ [[mark:type-hp-transition]] useTransition က Transition
      run နေဆဲလား ပြောတဲ့ isPending နဲ့၊ Transition စပေးတဲ့ startTransition
      ဆိုပြီး နှစ်ခု ပြန်ပေးပါတယ်။ [[mark:type-hp-select]] tab ပြောင်းတာကို
      startTransition ထဲမှာ လုပ်လို့၊ ဒီ update က urgent မဟုတ်တော့ပါဘူး။
      [[mark:type-hp-jsx]] JSX မှာ tab ခလုတ် နှစ်ခု၊ loading စာသား၊ ပြီးတော့ ဒီနေ့
      စာသား ဒါမှမဟုတ် နှေးတဲ့ list ပါပါတယ်။ [[mark:open-app-history]] App မှာ
      import လုပ်ပါတယ်။ [[mark:wire-hp-use]] ပြီးတော့ ခေါင်းစဉ် အောက်မှာ
      ထည့်ပါတယ်။ [[mark:click-history]] ကဲ၊ မှတ်တမ်း tab ကို နှိပ်ရအောင်။
      [[mark:after-pending]] ကြည့်ပါ၊ loading စာသား ပေါ်လာပေမယ့် ဒီနေ့ tab ရဲ့
      စာသားက မပျောက်ပါဘူး။ React က နောက်ကွယ်မှာ render လုပ်နေတုန်း page က ဆက်
      တုံ့ပြန်နေပါတယ်။ [[mark:after-history]] အခု order 250 ပွဲလုံး ရောက်လာပါပြီ။
    sources:
      - title: "React — useTransition: Marking a state update as a non-blocking Transition"
        url: "https://react.dev/reference/react/useTransition#marking-a-state-update-as-a-non-blocking-transition"
      - title: "React — useTransition: Displaying a pending visual state"
        url: "https://react.dev/reference/react/useTransition#displaying-a-pending-visual-state-during-the-transition"
      - title: "MDN — performance.now()"
        url: "https://developer.mozilla.org/en-US/docs/Web/API/Performance/now"
    actions:
      - id: close-board-transition
        type: whiteboard.apply
        at: { mark: close-board-transition }
        open: false
      - id: open-slowlist
        type: workspace.openFile
        at: { mark: open-slowlist }
        path: src/SlowList.jsx
      - id: select-slow-loop
        type: editor.select
        at: { mark: select-slow-loop }
        target:
          {
            file: src/SlowList.jsx,
            text: "while (performance.now() - start < 10) {",
            occurrence: 1,
          }
      - id: select-slowlist-memo
        type: editor.select
        at: { mark: select-slowlist-memo }
        target: { file: src/SlowList.jsx, text: "export const SlowList = memo(", occurrence: 1 }
      - id: open-history
        type: workspace.openFile
        at: { mark: open-history }
        path: src/HistoryPanel.jsx
      - id: type-hp-top
        type: editor.type
        at: { mark: type-hp-top }
        cadence: line-by-line
        target: { file: src/HistoryPanel.jsx, after: "", occurrence: 1 }
        text: "import { useState, useTransition } from \"react\";\nimport { SlowList } from \"./SlowList.jsx\";\n\nexport function HistoryPanel() {\n  const [tab, setTab] = useState(\"today\");\n"
      - id: type-hp-transition
        type: editor.type
        at: { mark: type-hp-transition }
        cadence: fast-explainer
        target:
          {
            file: src/HistoryPanel.jsx,
            after: "  const [tab, setTab] = useState(\"today\");\n",
            occurrence: 1,
          }
        text: "  const [isPending, startTransition] = useTransition();\n"
      - id: type-hp-select
        type: editor.type
        at: { mark: type-hp-select }
        cadence: line-by-line
        target:
          {
            file: src/HistoryPanel.jsx,
            after: "  const [isPending, startTransition] = useTransition();\n",
            occurrence: 1,
          }
        text: "\n  function selectTab(nextTab) {\n    startTransition(() => {\n      setTab(nextTab);\n    });\n  }\n"
      - id: type-hp-jsx
        type: editor.type
        at: { mark: type-hp-jsx }
        cadence: block
        target:
          {
            file: src/HistoryPanel.jsx,
            after: "      setTab(nextTab);\n    });\n  }\n",
            occurrence: 1,
          }
        text: "\n  return (\n    <section className=\"card\" data-testid=\"history-panel\">\n      <div className=\"row\">\n        <button data-testid=\"tab-today\" onClick={() => selectTab(\"today\")}>\n          ဒီနေ့\n        </button>\n        <button data-testid=\"tab-history\" onClick={() => selectTab(\"history\")}>\n          မှတ်တမ်း\n        </button>\n      </div>\n      {isPending && <p className=\"muted\" data-testid=\"history-pending\">မှတ်တမ်း ဖွင့်နေပါတယ်…</p>}\n      {tab === \"today\" ? <p data-testid=\"today-text\">ဒီနေ့ ဆိုင်ဖွင့်ထားပါတယ်</p> : <SlowList />}\n    </section>\n  );\n}\n"
      - id: open-app-history
        type: workspace.openFile
        at: { mark: open-app-history }
        path: src/App.jsx
      - id: wire-hp-import
        type: editor.type
        at: { afterAction: open-app-history }
        cadence: block
        target:
          {
            file: src/App.jsx,
            after: "import { DishList } from \"./DishList.jsx\";\n",
            occurrence: 1,
          }
        text: "import { HistoryPanel } from \"./HistoryPanel.jsx\";\n"
      - id: wire-hp-use
        type: editor.type
        at: { mark: wire-hp-use }
        cadence: block
        target: { file: src/App.jsx, after: "      <Header />\n", occurrence: 1 }
        text: "      <HistoryPanel />\n"
      - id: expect-today
        type: expect.preview
        at: { mark: click-history, offsetMs: -700 }
        timeoutMs: 5000
        target: { by: testId, value: today-text }
        textContains: "ဆိုင်ဖွင့်ထားပါတယ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: click-history
        type: preview.click
        at: { mark: click-history }
        timeoutMs: 5000
        target: { by: testId, value: tab-history }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-pending
        type: expect.preview
        at: { afterAction: click-history }
        timeoutMs: 3000
        target: { by: testId, value: history-pending }
        textContains: "ဖွင့်နေပါတယ်"
        retry: { maxAttempts: 3, delayMs: 100 }
      - id: expect-today-pending
        type: expect.preview
        at: { afterAction: expect-pending }
        timeoutMs: 3000
        target: { by: testId, value: today-text }
        textContains: "ဆိုင်ဖွင့်ထားပါတယ်"
        retry: { maxAttempts: 2, delayMs: 100 }
      - id: expect-history
        type: expect.preview
        at: { mark: after-history }
        timeoutMs: 5000
        target: { by: testId, value: history-count }
        textContains: "250 ပွဲ"
        retry: { maxAttempts: 3, delayMs: 3000 }

  # ------------------------------------------------------------------ 11
  - id: deferred-search
    narration: >
      [[mark:open-history-2]] အခု မှတ်တမ်းထဲ ရှာတဲ့ အကွက် ထည့်ရအောင်။ စာက
      ချက်ချင်း ပေါ်ရမှာမို့ Transition မသုံးဘဲ၊ list ကို ပေးမယ့် တန်ဖိုးကိုပဲ
      နောက်ကျစေပါမယ်။ [[mark:wire-deferred-import]] useDeferredValue ကို import
      လုပ်ပါတယ်။ [[mark:wire-deferred-state]] query က ရိုက်ထားတဲ့ စာကို မှတ်တဲ့
      state ပါ။ deferredQuery ကတော့ useDeferredValue က ပေးတဲ့၊ နောက်ကျပြီးမှ
      လိုက်ပြောင်းတဲ့ copy ပါ။ [[mark:wire-deferred-input]] မှတ်တမ်း tab မှာ input
      က query ကို ပြပြီး၊ နှစ်ခု မတူနေတုန်း ရှာနေဆဲပါ ဆိုတဲ့ စာသား ပြပါတယ်။
      [[mark:wire-deferred-filter]] SlowList ကတော့ deferred တန်ဖိုးကို ရလို့၊
      urgent render မှာ memo က ကျော်ပြီး နောက်ကွယ်မှာမှ render လုပ်ပါတယ်။ React 19
      ကစပြီး useDeferredValue ကို ပထမဆုံး render အတွက် တန်ဖိုး တစ်ခုပါ ပေးလို့
      ရပါတယ်။ [[mark:click-history-2]] page ပြန်ပွင့်လို့ မှတ်တမ်း tab ကို
      ထပ်ဖွင့်ရအောင်။ list ရောက်ရင် ခေါက်ဆွဲကို ရှာပါမယ်၊ ရှာနေဆဲပါ ဆိုတဲ့ စာသားက
      ခဏပဲ ပေါ်မှာမို့ သတိထား ကြည့်ပါ။ [[mark:type-history-search]] ကဲ၊
      ရိုက်ကြည့်ရအောင်။ [[mark:after-stale]] ရှာနေဆဲပါ ပေါ်နေတဲ့ ခဏမှာ list က
      အဟောင်းအတိုင်း ကျန်နေခဲ့ပြီး၊ React က အသစ်ကို နောက်ကွယ်မှာ render
      လုပ်နေတာပါ။ [[mark:after-filtered]] အခု ခေါက်ဆွဲ order 100 ပွဲပဲ ပြနေပါပြီ။
    sources:
      - title: "React — useDeferredValue"
        url: "https://react.dev/reference/react/useDeferredValue"
      - title: "React — useTransition: Updating an input in a Transition doesn't work"
        url: "https://react.dev/reference/react/useTransition#updating-an-input-in-a-transition-doesnt-work"
      - title: "React — useDeferredValue: Deferring re-rendering for a part of the UI"
        url: "https://react.dev/reference/react/useDeferredValue#deferring-re-rendering-for-a-part-of-the-ui"
      - title: "React 19 — useDeferredValue initial value"
        url: "https://react.dev/blog/2024/12/05/react-19#use-deferred-value-initial-value"
    actions:
      - id: open-history-2
        type: workspace.openFile
        at: { mark: open-history-2 }
        path: src/HistoryPanel.jsx
      - id: wire-deferred-import
        type: editor.type
        at: { mark: wire-deferred-import }
        cadence: block
        target: { file: src/HistoryPanel.jsx, after: "import { ", occurrence: 1 }
        text: "useDeferredValue, "
      - id: wire-deferred-state
        type: editor.type
        at: { mark: wire-deferred-state }
        cadence: block
        target:
          {
            file: src/HistoryPanel.jsx,
            after: "  const [isPending, startTransition] = useTransition();\n",
            occurrence: 1,
          }
        text: "  const [query, setQuery] = useState(\"\");\n  const deferredQuery = useDeferredValue(query);\n"
      - id: wire-deferred-input
        type: editor.type
        at: { mark: wire-deferred-input }
        cadence: block
        target:
          {
            file: src/HistoryPanel.jsx,
            after: "data-testid=\"history-pending\">မှတ်တမ်း ဖွင့်နေပါတယ်…</p>}\n",
            occurrence: 1,
          }
        text: "      {tab === \"history\" && (\n        <>\n          <input\n            value={query}\n            onChange={(e) => setQuery(e.target.value)}\n            placeholder=\"မှတ်တမ်းထဲ ရှာရန်\"\n            data-testid=\"history-search\"\n          />\n          {query !== deferredQuery && <p className=\"muted\" data-testid=\"history-stale\">ရှာနေဆဲပါ…</p>}\n        </>\n      )}\n"
      - id: wire-deferred-filter
        type: editor.type
        at: { mark: wire-deferred-filter }
        cadence: block
        target: { file: src/HistoryPanel.jsx, after: "<SlowList", occurrence: 1 }
        text: " filter={deferredQuery}"
      - id: expect-today-2
        type: expect.preview
        at: { mark: click-history-2, offsetMs: -700 }
        timeoutMs: 5000
        target: { by: testId, value: today-text }
        textContains: "ဆိုင်ဖွင့်ထားပါတယ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: click-history-2
        type: preview.click
        at: { mark: click-history-2 }
        timeoutMs: 5000
        target: { by: testId, value: tab-history }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-history-2
        type: expect.preview
        at: { mark: type-history-search, offsetMs: -600 }
        timeoutMs: 5000
        target: { by: testId, value: history-count }
        textContains: "250 ပွဲ"
        retry: { maxAttempts: 3, delayMs: 3000 }
      - id: type-history-search
        type: preview.input
        at: { mark: type-history-search }
        timeoutMs: 5000
        target: { by: testId, value: history-search }
        value: "ခေါက်ဆွဲ"
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-stale
        type: expect.preview
        at: { afterAction: type-history-search }
        timeoutMs: 3000
        target: { by: testId, value: history-stale }
        textContains: "ရှာနေဆဲပါ"
        retry: { maxAttempts: 3, delayMs: 100 }
      - id: expect-search-value
        type: expect.preview
        at: { mark: after-stale }
        timeoutMs: 5000
        target: { by: testId, value: history-search }
        value: "ခေါက်ဆွဲ"
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-filtered
        type: expect.preview
        at: { mark: after-filtered }
        timeoutMs: 5000
        target: { by: testId, value: history-count }
        textContains: "100 ပွဲ"
        retry: { maxAttempts: 3, delayMs: 1500 }

  # ------------------------------------------------------------------ 12
  - id: independent-recap
    chapter: "React 19.3 နဲ့ အနှစ်ချုပ်"
    narration: >
      React 19.3 မှာ Transition နဲ့ ပတ်သက်တဲ့ ပြောင်းလဲမှု ရှိပါတယ်။
      [[mark:draw-192]] အရင်က မဆိုင်တဲ့ Transition တွေကို တစ်ခါတလေ ပေါင်းပြီး
      render လုပ်ပါတယ်။ နှေးတဲ့ Transition စပြီး 0.3 စက္ကန့်မှာ မြန်တဲ့ update ကို
      နှိပ်ကြည့်တော့၊ React 19.2 က 1.5 စက္ကန့် ရောက်မှ နှစ်ခုလုံး ပြပါတယ်။
      [[mark:draw-193]] React 19.3 ကတော့ Transition တစ်ခုချင်းစီကို သီးခြား render
      လုပ်လို့၊ မြန်တဲ့ update က နှိပ်လိုက်တာနဲ့ ချက်ချင်း ပေါ်ပါတယ်။
      [[mark:draw-action-note]] ခြွင်းချက်ကတော့ async Action pending ဖြစ်နေတုန်း
      စတဲ့ Transition ပါ၊ အဲဒါက Action နဲ့ အတူ batch ဖြစ်နေဆဲပါ။
      [[mark:draw-recap-measure]] ဒါဆို ပြန်ချုပ်ရရင်၊ Profiler နဲ့ အရင် တိုင်းပါ။
      [[mark:draw-recap-memo]] memo၊ useMemo နဲ့ useCallback က props မပြောင်းတဲ့
      child ကို render မလုပ်ဘဲ ကျော်စေပါတယ်။ [[mark:draw-recap-compiler]] React
      Compiler က အဲဒါကို ကိုယ့်အစား လုပ်ပေးနိုင်ပါတယ်။
      [[mark:draw-recap-transition]] Transition နဲ့ deferred value က နှေးတဲ့
      render ရှိနေတုန်းမှာတောင် page ကို ချက်ချင်း တုံ့ပြန်စေပါတယ်။
      [[mark:next-lesson]] နောက် lesson မှာတော့ data မရောက်ခင် loading ပြပေးတဲ့
      Suspense ကို ကြည့်ပါမယ်။
    sources:
      - title: "React 19.3 (blog)"
        url: "https://react.dev/blog/2026/09/09/react-19-3"
      - title: "React — useTransition"
        url: "https://react.dev/reference/react/useTransition"
      - title: "React — Suspense"
        url: "https://react.dev/reference/react/Suspense"
    actions:
      - id: board-independent
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [b6-title]
      - id: draw-192
        type: whiteboard.apply
        at: { mark: draw-192 }
        upsertIds:
          [b6-192-label, b6-192-bar, b6-192-bar-text, b6-192-tick, b6-192-tick-text, b6-192-fast]
        drawMs: 2200
      - id: draw-193
        type: whiteboard.apply
        at: { mark: draw-193 }
        upsertIds:
          [b6-193-label, b6-193-bar, b6-193-bar-text, b6-193-tick, b6-193-tick-text, b6-193-fast]
        drawMs: 2200
      - id: draw-action-note
        type: whiteboard.apply
        at: { mark: draw-action-note }
        upsertIds: [b6-action]
        drawMs: 1200
      - id: draw-recap-measure
        type: whiteboard.apply
        at: { mark: draw-recap-measure }
        clear: true
        upsertIds: [b7-title, b7-measure]
        drawMs: 900
      - id: draw-recap-memo
        type: whiteboard.apply
        at: { mark: draw-recap-memo }
        upsertIds: [b7-memo]
        drawMs: 1100
      - id: draw-recap-compiler
        type: whiteboard.apply
        at: { mark: draw-recap-compiler }
        upsertIds: [b7-compiler]
        drawMs: 1000
      - id: draw-recap-transition
        type: whiteboard.apply
        at: { mark: draw-recap-transition }
        upsertIds: [b7-transition]
        drawMs: 1100
      - id: draw-next
        type: whiteboard.apply
        at: { mark: next-lesson }
        upsertIds: [b7-next]
        drawMs: 800
      - id: expect-dishlist-file
        type: expect.file
        at: { afterAction: draw-next }
        path: src/DishList.jsx
        contains: "    <Profiler id=\"DishList\" onRender={onRender}>\n"
      - id: expect-onrender-file
        type: expect.file
        at: { afterAction: expect-dishlist-file }
        path: src/DishList.jsx
        contains: "  document.getElementById(\"commit-count\").textContent =\n    \"render \" + renders + \" ကြိမ် · \" + phase;\n"
      - id: expect-app-memo-file
        type: expect.file
        at: { afterAction: expect-onrender-file }
        path: src/App.jsx
        contains: "        <MemoDishList dishes={visibleMemo} onSelect={handleSelectStable} />\n"
      - id: expect-app-hooks-file
        type: expect.file
        at: { afterAction: expect-app-memo-file }
        path: src/App.jsx
        contains: "  const handleSelectStable = useCallback((id) => setSelectedId(id), []);\n"
      - id: expect-history-transition-file
        type: expect.file
        at: { afterAction: expect-app-hooks-file }
        path: src/HistoryPanel.jsx
        contains: "    startTransition(() => {\n      setTab(nextTab);\n    });\n"
      - id: expect-history-deferred-file
        type: expect.file
        at: { afterAction: expect-history-transition-file }
        path: src/HistoryPanel.jsx
        contains: "<SlowList filter={deferredQuery} />"

checks:
  - { type: timing.p95Ms, max: 300 }
