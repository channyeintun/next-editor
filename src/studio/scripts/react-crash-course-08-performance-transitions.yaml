build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 8208

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  # ------------------------------------------------------------------ 1
  - id: rerender-idea
    chapter: "Component တွေ ဘယ်အချိန် ပြန် render လုပ်လဲ"
    narration: >
      ဒီ lesson မှာ React က ဘယ်အချိန် ပြန် render လုပ်လဲ၊ performance ကို ဘယ်လို
      တိုင်းပြီး ပြင်မလဲ ကြည့်ပါမယ်။ [[mark:start-server]] ရှင်းပြနေတုန်း dev
      server ကို နောက်ကွယ်မှာ စ run ထားလိုက်ရအောင်။ [[mark:draw-tree]] component
      ရဲ့ state ပြောင်းရင် React က သူ့ကို ပြန် render လုပ်ပါတယ်။
      [[mark:draw-cascade]] ပြီးတော့ သူ့အောက်က component အားလုံးကိုပါ ပြန် render
      လုပ်ပါတယ်၊ ဘာမှ မပြောင်းရင်တောင်ပါပဲ။ [[mark:draw-cheap]] များသောအားဖြင့်
      ဒါက ကိစ္စ မရှိပါဘူး၊ ကွာသွားတဲ့ နေရာကိုပဲ React က DOM ထဲမှာ ပြင်လို့ပါ။
      [[mark:draw-measure]] ဒါကြောင့် မှန်းမနေပါနဲ့။ အရင် တိုင်းကြည့်ပြီး၊ တကယ်
      နှေးတာကိုပဲ ပြင်ပါ။
    sources:
      - title: "React — Render and Commit"
        url: "https://react.dev/learn/render-and-commit"
      - title: "React — memo: Skipping re-rendering when props are unchanged"
        url: "https://react.dev/reference/react/memo#skipping-re-rendering-when-props-are-unchanged"
      - title: "Vite — Getting Started"
        url: "https://vite.dev/guide/"
    actions:
      - id: open-board-1
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [b1-title]
      - id: start-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 45000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-tree
        type: whiteboard.apply
        at: { mark: draw-tree }
        upsertIds: [b1-app-box, b1-app-text]
        drawMs: 1200
      - id: draw-cascade
        type: whiteboard.apply
        at: { mark: draw-cascade }
        upsertIds:
          [
            b1-arrow-1,
            b1-arrow-2,
            b1-arrow-3,
            b1-header-box,
            b1-header-text,
            b1-list-box,
            b1-list-text,
            b1-hist-box,
            b1-hist-text,
            b1-cascade,
          ]
        drawMs: 3200
      - id: draw-cheap
        type: whiteboard.apply
        at: { mark: draw-cheap }
        upsertIds: [b1-cheap]
        drawMs: 900
      - id: draw-measure
        type: whiteboard.apply
        at: { mark: draw-measure }
        upsertIds: [b1-measure, b1-measure-underline]
        drawMs: 1400

  # ------------------------------------------------------------------ 2
  - id: tour-app
    narration: >
      [[mark:close-board-1]] ဒီနေ့ စမယ့် code ကို ကြည့်ရအောင်။ App မှာ မှတ်ချက်၊
      ရှာမယ့် စာလုံးနဲ့ ရွေးထားတဲ့ ဟင်းလျာ ဆိုပြီး state သုံးခု ရှိပါတယ်။
      [[mark:select-visible]] menu ကို စစ်ထုတ်တဲ့ ဒီ စာကြောင်းက render တိုင်း
      array အသစ် တစ်ခု ထုတ်ပေးပါတယ်။ [[mark:select-handle]] ဟင်းလျာ ရွေးတဲ့ ဒီ
      function ကလည်း render တိုင်း အသစ် ဖြစ်ပါတယ်။ [[mark:select-slot]] ရှာတဲ့
      အကွက်ကို ကြည့်ပါ။ သူ့အောက်မှာ ဟင်းလျာ စာရင်း မရှိသေးလို့ ရေးကြည့်ရအောင်။
    sources:
      - title: "React — Rendering Lists"
        url: "https://react.dev/learn/rendering-lists"
      - title: "MDN — Array.prototype.filter()"
        url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/filter"
    actions:
      - id: close-board-1
        type: whiteboard.apply
        at: { mark: close-board-1 }
        open: false
      - id: collapse-dock-early
        type: runtime.collapseDock
        at: { afterAction: close-board-1 }
      - id: select-visible
        type: editor.select
        at: { mark: select-visible }
        target:
          {
            file: src/App.jsx,
            text: "const visible = menu.filter((dish) => dish.name.includes(query));",
            occurrence: 1,
          }
      - id: select-handle
        type: editor.select
        at: { mark: select-handle }
        target:
          {
            file: src/App.jsx,
            text: "  function handleSelect(id) {\n    setSelectedId(id);\n  }\n",
            occurrence: 1,
          }
      - id: select-slot
        type: editor.select
        at: { mark: select-slot }
        target:
          {
            file: src/App.jsx,
            text: "<input\n          value={query}\n          onChange={(e) => setQuery(e.target.value)}\n          placeholder=\"ဟင်းလျာ ရှာရန်\"\n          data-testid=\"search-input\"\n        />",
            occurrence: 1,
          }

  # ------------------------------------------------------------------ 3
  - id: profiler-code
    chapter: "Profiler နဲ့ တိုင်းကြည့်ရအောင်"
    narration: >
      [[mark:open-dishlist]] DishList ဖိုင်က အလွတ်ပါ၊ ဘယ်ဖိုင်ကမှ import
      မလုပ်ထားသေးပါဘူး။ [[mark:type-dl-import]] Profiler ကို import လုပ်ပါတယ်။ သူက
      သူ့ထဲက အပိုင်း ဘယ်နှစ်ကြိမ် render ဖြစ်လဲ တိုင်းပေးတဲ့ component ပါ။
      [[mark:type-dl-onrender]] onRender ကတော့ React က ရလဒ်ကို screen ပေါ်
      တင်တိုင်း၊ ဆိုလိုတာက commit လုပ်တိုင်း run ပြီး၊ mount လား update လား
      ပြောပေးပါတယ်။ [[mark:select-dl-dom]] render အရေအတွက်ကို ဘယ်မှာ ရေးလဲ
      ကြည့်ပါ။ state ထဲ ထည့်ရင် render ထပ်ဖြစ်ပြီး အဆုံးမရှိ ဖြစ်မှာမို့၊ React
      အပြင်က badge ထဲ ရေးပါတယ်။ [[mark:type-dl-component]] component ကတော့ ဟင်းလျာ
      တစ်ခုစီမှာ ရွေးမယ့် ခလုတ် ပါတဲ့ သာမန် list ပါ။ [[mark:select-dl-profiler]]
      ဒီ Profiler tag ကို ကြည့်ပါ။ list တစ်ခုလုံး သူ့ထဲ ရှိလို့ DishList render
      တိုင်း ရေတွက်ပေးပါတယ်။
    sources:
      - title: "React — <Profiler>"
        url: "https://react.dev/reference/react/Profiler"
      - title: "React — Profiler: onRender callback"
        url: "https://react.dev/reference/react/Profiler#onrender-callback"
      - title: "MDN — Node.textContent"
        url: "https://developer.mozilla.org/en-US/docs/Web/API/Node/textContent"
    actions:
      - id: open-dishlist
        type: workspace.openFile
        at: { mark: open-dishlist }
        path: src/DishList.jsx
      - id: type-dl-import
        type: editor.type
        at: { mark: type-dl-import }
        cadence: fast-explainer
        target: { file: src/DishList.jsx, after: "", occurrence: 1 }
        text: "import { Profiler } from \"react\";\n"
      - id: type-dl-onrender
        type: editor.type
        at: { mark: type-dl-onrender }
        cadence: line-by-line
        target:
          { file: src/DishList.jsx, after: "import { Profiler } from \"react\";\n", occurrence: 1 }
        text: "\nlet renders = 0;\n\nfunction onRender(id, phase) {\n  renders += 1;\n  document.getElementById(\"commit-count\").textContent =\n    \"render \" + renders + \" ကြိမ် · \" + phase;\n}\n"
      - id: select-dl-dom
        type: editor.select
        at: { mark: select-dl-dom }
        target:
          {
            file: src/DishList.jsx,
            text: 'document.getElementById("commit-count").textContent',
            occurrence: 1,
          }
      - id: type-dl-component
        type: editor.type
        at: { mark: type-dl-component }
        cadence: block
        target:
          {
            file: src/DishList.jsx,
            after: "    \"render \" + renders + \" ကြိမ် · \" + phase;\n}\n",
            occurrence: 1,
          }
        text: "\nexport function DishList({ dishes, onSelect }) {\n  return (\n    <Profiler id=\"DishList\" onRender={onRender}>\n      <ul className=\"list\" data-testid=\"dish-list\">\n        {dishes.map((dish) => (\n          <li key={dish.id}>\n            {dish.name}\n            <button\n              className=\"secondary\"\n              data-testid={\"pick-\" + dish.id}\n              onClick={() => onSelect(dish.id)}\n            >\n              ရွေးမယ်\n            </button>\n          </li>\n        ))}\n      </ul>\n    </Profiler>\n  );\n}\n"
      - id: select-dl-profiler
        type: editor.select
        at: { mark: select-dl-profiler }
        target:
          {
            file: src/DishList.jsx,
            text: '<Profiler id="DishList" onRender={onRender}>',
            occurrence: 1,
          }

  # ------------------------------------------------------------------ 4
  - id: profiler-run
    narration: >
      [[mark:open-app-wire]] App ထဲ ထည့်ရအောင်။ [[mark:wire-dl-import]] အရင်ဆုံး
      DishList ကို import လုပ်ပါတယ်။ [[mark:wire-dl-use]] ပြီးတော့ list ကို ရှာတဲ့
      အကွက် အောက်မှာ ထည့်ပါတယ်။ [[mark:preview-opens]] dev server ရသွားပြီမို့
      preview ကို ဖွင့်ရအောင်။ အောက်ထောင့်က badge က mount အတွက် render 1 ကြိမ်လို့
      ပြနေပါတယ်။ [[mark:type-note-1]] မီးဖိုချောင်အတွက် မှတ်ချက် ရိုက်ကြည့်ရအောင်။
      [[mark:after-note-1]] badge က 2 ဖြစ်သွားပါပြီ။ မှတ်ချက်က list နဲ့
      မဆိုင်ပေမယ့်၊ parent ဖြစ်တဲ့ App ပြန် render ဖြစ်လို့ DishList ပါ ပြန်
      render ဖြစ်တာပါ။
    sources:
      - title: "React — <Profiler>: Measuring rendering performance programmatically"
        url: "https://react.dev/reference/react/Profiler#measuring-rendering-performance-programmatically"
      - title: "React — Render and Commit"
        url: "https://react.dev/learn/render-and-commit"
    actions:
      - id: open-app-wire
        type: workspace.openFile
        at: { mark: open-app-wire }
        path: src/App.jsx
      - id: wire-dl-import
        type: editor.type
        at: { mark: wire-dl-import }
        cadence: block
        target: { file: src/App.jsx, after: "import { menu } from \"./menu.js\";\n", occurrence: 1 }
        text: "import { DishList } from \"./DishList.jsx\";\n"
      - id: wire-dl-use
        type: editor.type
        at: { mark: wire-dl-use }
        cadence: block
        target:
          {
            file: src/App.jsx,
            after: "          data-testid=\"search-input\"\n        />\n",
            occurrence: 1,
          }
        text: "        <DishList dishes={visible} onSelect={handleSelect} />\n"
      - id: wait-for-server
        type: runtime.waitForReady
        at: { mark: preview-opens }
        timeoutMs: 20000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-server }
        timeoutMs: 15000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-mount-1
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: commit-count }
        textContains: "render 1 ကြိမ် · mount"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: collapse-dock
        type: runtime.collapseDock
        at: { afterAction: expect-mount-1 }
      - id: type-note-1
        type: preview.input
        at: { mark: type-note-1 }
        timeoutMs: 5000
        target: { by: testId, value: note-input }
        value: "ငရုတ်သီး မထည့်ပါနဲ့"
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-note-1
        type: expect.preview
        at: { mark: after-note-1 }
        timeoutMs: 5000
        target: { by: testId, value: commit-count }
        textContains: "render 2 ကြိမ် · update"
        retry: { maxAttempts: 3, delayMs: 300 }

  # ------------------------------------------------------------------ 5
  - id: memo-try
    chapter: "memo၊ useMemo နဲ့ useCallback"
    narration: >
      [[mark:wire-memo-import]] memo ကို စမ်းကြည့်ရအောင်၊ အရင်ဆုံး React ကနေ
      import လုပ်ပါတယ်။ [[mark:wire-memo-line]] memo က component ကို ထုပ်ပေးပြီး၊
      props မပြောင်းရင် render ကို ကျော်တဲ့ component အသစ် ပြန်ပေးပါတယ်။
      [[mark:wire-memo-use]] ခေါ်တဲ့ နေရာမှာ MemoDishList ကို သုံးပါတယ်။
      [[mark:after-memo-reload]] page ပြန်ပွင့်သွားလို့ badge က 1 ပြန်ဖြစ်နေပါတယ်။
      [[mark:type-note-2]] မှတ်ချက်ကို ထပ်ရိုက်ကြည့်ရအောင်။ [[mark:after-note-2]]
      2 ဖြစ်သွားပြန်ပါပြီ။ memo က ဘာလို့ မရတာလဲ။
    sources:
      - title: "React — memo"
        url: "https://react.dev/reference/react/memo"
      - title: "Vite — Hot Module Replacement"
        url: "https://vite.dev/guide/features.html#hot-module-replacement"
    actions:
      - id: wire-memo-import
        type: editor.type
        at: { mark: wire-memo-import }
        cadence: block
        target: { file: src/App.jsx, after: "import { ", occurrence: 1 }
        text: "memo, "
      - id: wire-memo-line
        type: editor.type
        at: { mark: wire-memo-line }
        cadence: block
        target:
          {
            file: src/App.jsx,
            after: "import { DishList } from \"./DishList.jsx\";\n",
            occurrence: 1,
          }
        text: "\nconst MemoDishList = memo(DishList);\n"
      - id: wire-memo-use
        type: editor.type
        at: { mark: wire-memo-use }
        cadence: block
        target:
          {
            file: src/App.jsx,
            after: "          data-testid=\"search-input\"\n        />\n        <",
            occurrence: 1,
          }
        text: "Memo"
      - id: expect-mount-2
        type: expect.preview
        at: { mark: after-memo-reload }
        timeoutMs: 5000
        target: { by: testId, value: commit-count }
        textContains: "render 1 ကြိမ် · mount"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-note-2
        type: preview.input
        at: { mark: type-note-2 }
        timeoutMs: 5000
        target: { by: testId, value: note-input }
        value: "ငရုတ်သီး မထည့်ပါနဲ့"
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-note-2
        type: expect.preview
        at: { mark: after-note-2 }
        timeoutMs: 5000
        target: { by: testId, value: commit-count }
        textContains: "render 2 ကြိမ် · update"
        retry: { maxAttempts: 3, delayMs: 300 }

  # ------------------------------------------------------------------ 6
  - id: object-is-board
    narration: >
      memo က prop တစ်ခုစီကို Object.is နဲ့ စစ်ပါတယ်၊ Object.is ဆိုတာ တန်ဖိုး
      နှစ်ခု တူမတူ စစ်ပေးတဲ့ JavaScript function ပါ။ [[mark:draw-same-string]]
      string ဒါမှမဟုတ် ကိန်းဂဏန်းဆိုရင် တန်ဖိုးချင်း နှိုင်းယှဉ်လို့၊ စာသား တူရင်
      တူတယ်လို့ ပြောပါတယ်။ [[mark:draw-new-array]] array ကိုတော့ အထဲကို မကြည့်ဘဲ
      အရင် array နဲ့ တစ်ခုတည်း ဟုတ်မဟုတ်ကိုပဲ ကြည့်လို့၊ filter ရဲ့ array အသစ်ကို
      မတူဘူးလို့ ပြောပါတယ်။ [[mark:draw-new-function]] handleSelect လည်း render
      တိုင်း အသစ် ဖြစ်လို့ မတူပါဘူး။ [[mark:draw-fix]] ဒါကြောင့် render ကြားမှာ
      တူနေမယ့် တန်ဖိုးတွေ လိုပြီး၊ အဲဒါကို useMemo နဲ့ useCallback က ပေးပါတယ်။
    sources:
      - title: "React — memo: Minimizing props changes"
        url: "https://react.dev/reference/react/memo#minimizing-props-changes"
      - title: "MDN — Object.is()"
        url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/is"
    actions:
      - id: board-objectis
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [b2-title, b2-rule]
      - id: draw-same-string
        type: whiteboard.apply
        at: { mark: draw-same-string }
        upsertIds: [b2-str, b2-str-res]
        drawMs: 1200
      - id: draw-new-array
        type: whiteboard.apply
        at: { mark: draw-new-array }
        upsertIds: [b2-arr, b2-arr-res]
        drawMs: 1400
      - id: draw-new-function
        type: whiteboard.apply
        at: { mark: draw-new-function }
        upsertIds: [b2-fn, b2-fn-res, b2-bad-box]
        drawMs: 1600
      - id: draw-fix
        type: whiteboard.apply
        at: { mark: draw-fix }
        upsertIds: [b2-fix, b2-fix-underline]
        drawMs: 1400

  # ------------------------------------------------------------------ 7
  - id: stable-props
    narration: >
      [[mark:close-board-objectis]] App ထဲ ပြန်ရအောင်။ [[mark:wire-hooks-import]]
      useCallback နဲ့ useMemo ကို import လုပ်ပါတယ်။ [[mark:wire-usememo]] useMemo
      က စစ်ထုတ်ထားတဲ့ array ကို မှတ်ထားပေးပြီး၊ ရှာတဲ့ စာလုံး ပြောင်းမှသာ
      ပြန်စစ်ထုတ်ပါတယ်။ [[mark:wire-usecallback]] useCallback ကတော့ function ကို
      မှတ်ထားပါတယ်၊ useState ရဲ့ state ပြောင်းတဲ့ function က မပြောင်းလို့
      dependency စာရင်းက အလွတ်ပါ။ [[mark:wire-callsite-dishes]] အခု list က
      မှတ်ထားတဲ့ array ကို ရပါပြီ။ [[mark:wire-callsite-select]] မှတ်ထားတဲ့
      function ကိုလည်း ရပါပြီ။ [[mark:select-old-visible]] ဒီ filter စာကြောင်း
      အဟောင်းကို အခု ဘယ်နေရာကမှ မသုံးတော့ပါဘူး။ [[mark:select-old-handle]]
      handleSelect အဟောင်းလည်း အတူတူပါ၊ ကိုယ့် code မှာတော့ အဟောင်းကိုပဲ နေရာမှာ
      ပြင်ပါ။ [[mark:type-note-3]] page ပြန်ပွင့်လို့ badge က 1 ကနေ ပြန်စပါတယ်။
      မှတ်ချက်ကို ထပ်ရိုက်ကြည့်ရအောင်။ [[mark:after-note-3]] ဒီတစ်ခါတော့ badge က 1
      ကနေ မတက်တော့ပါဘူး၊ DishList ကို ကျော်သွားလို့ပါ။ [[mark:click-pick]] ဟင်းလျာ
      ရွေးရအောင်။ [[mark:after-pick]] ရွေးထားတာ ပြောင်းသွားပေမယ့် badge က 1 မှာပဲ
      ရှိနေပါတယ်၊ ရွေးထားတဲ့ ဟင်းလျာက list ရဲ့ props ထဲ မပါလို့ပါ။
      [[mark:type-search]] အခု ရှမ်းခေါက်ဆွဲကို ရှာကြည့်ရအောင်။
      [[mark:after-search]] badge က 2 ဖြစ်သွားပါပြီ၊ list က တကယ်
      ပြောင်းသွားလို့ပါ။
    sources:
      - title: "React — useMemo"
        url: "https://react.dev/reference/react/useMemo"
      - title: "React — useCallback"
        url: "https://react.dev/reference/react/useCallback"
      - title: "React — useCallback: Skipping re-rendering of components"
        url: "https://react.dev/reference/react/useCallback#skipping-re-rendering-of-components"
    actions:
      - id: close-board-objectis
        type: whiteboard.apply
        at: { mark: close-board-objectis }
        open: false
      - id: wire-hooks-import
        type: editor.type
        at: { mark: wire-hooks-import }
        cadence: block
        target: { file: src/App.jsx, after: "import { memo, ", occurrence: 1 }
        text: "useCallback, useMemo, "
      - id: wire-usememo
        type: editor.type
        at: { mark: wire-usememo }
        cadence: block
        target:
          {
            file: src/App.jsx,
            after: "  const visible = menu.filter((dish) => dish.name.includes(query));\n",
            occurrence: 1,
          }
        text: "  const visibleMemo = useMemo(\n    () => menu.filter((dish) => dish.name.includes(query)),\n    [query],\n  );\n"
      - id: wire-usecallback
        type: editor.type
        at: { mark: wire-usecallback }
        cadence: block
        target:
          {
            file: src/App.jsx,
            after: "  function handleSelect(id) {\n    setSelectedId(id);\n  }\n",
            occurrence: 1,
          }
        text: "  const handleSelectStable = useCallback((id) => setSelectedId(id), []);\n"
      - id: wire-callsite-dishes
        type: editor.type
        at: { mark: wire-callsite-dishes }
        cadence: block
        target: { file: src/App.jsx, after: "<MemoDishList dishes={visible", occurrence: 1 }
        text: "Memo"
      - id: wire-callsite-select
        type: editor.type
        at: { mark: wire-callsite-select }
        cadence: block
        target: { file: src/App.jsx, after: "onSelect={handleSelect", occurrence: 1 }
        text: "Stable"
      - id: select-old-visible
        type: editor.select
        at: { mark: select-old-visible }
        target:
          {
            file: src/App.jsx,
            text: "const visible = menu.filter((dish) => dish.name.includes(query));",
            occurrence: 1,
          }
      - id: select-old-handle
        type: editor.select
        at: { mark: select-old-handle }
        target:
          {
            file: src/App.jsx,
            text: "  function handleSelect(id) {\n    setSelectedId(id);\n  }\n",
            occurrence: 1,
          }
      - id: expect-mount-3
        type: expect.preview
        at: { mark: type-note-3, offsetMs: -600 }
        timeoutMs: 5000
        target: { by: testId, value: commit-count }
        textContains: "render 1 ကြိမ် · mount"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-note-3
        type: preview.input
        at: { mark: type-note-3 }
        timeoutMs: 5000
        target: { by: testId, value: note-input }
        value: "ငရုတ်သီး မထည့်ပါနဲ့"
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-note-value-3
        type: expect.preview
        at: { afterAction: type-note-3 }
        timeoutMs: 5000
        target: { by: testId, value: note-input }
        value: "ငရုတ်သီး မထည့်ပါနဲ့"
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-note-3
        type: expect.preview
        at: { mark: after-note-3 }
        timeoutMs: 5000
        target: { by: testId, value: commit-count }
        textContains: "render 1 ကြိမ် · mount"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: click-pick
        type: preview.click
        at: { mark: click-pick }
