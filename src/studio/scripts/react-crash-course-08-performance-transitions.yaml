        textContains: "ရှမ်းခေါက်ဆွဲ"
        retry: { maxAttempts: 2, delayMs: 250 }

  # ------------------------------------------------------------------ 8
  - id: compiler-board
    chapter: "React Compiler"
    narration: >
      React Compiler 1.0 ကတော့ ဒီ အလုပ်ကို ကိုယ့်အစား လုပ်ပေးနိုင်ပါတယ်။
      [[mark:draw-compiler-build]] သူက build လုပ်ချိန်မှာ run တဲ့ Babel plugin ပါ၊
      Babel က JavaScript code ကို ပြောင်းရေးပေးတဲ့ tool ပါ။
      [[mark:draw-compiler-before]] ကိုယ်ရေးတဲ့ filter စာကြောင်းလို code ကို
      ယူပါတယ်။ [[mark:draw-compiler-after]] ပြီးတော့ cache သေးသေးလေး ထည့်ပေးလို့
      ရှာတဲ့ စာလုံး ပြောင်းမှသာ filter ပြန် run ပြီး၊ child component တွေကလည်း
      memo မပါဘဲ render ကို ကျော်သွားပါတယ်။ [[mark:draw-compiler-guidance]]
      ဒါကြောင့် code အသစ်မှာ ဒီ hook တွေကို တကယ် လိုမှပဲ သုံးပါ။
      [[mark:board-compiler-rules]] ဒါပေမဲ့ compiler က ကိုယ့် code ဟာ Rules of
      React ကို လိုက်နာမယ်လို့ ယူဆပါတယ်၊ ဥပမာ render ထဲမှာ props ကို
      မပြင်ရတာမျိုးပါ။ [[mark:draw-rules]] မလိုက်နာတဲ့ component ကိုတော့
      ကျော်သွားပေမယ့်၊ ပုံမှန်အတိုင်း အလုပ်လုပ်ပါတယ်။ [[mark:draw-directives]] use
      no memo လို့ ရေးထားရင် compiler က အဲဒီ component ကို ကျော်ပါတယ်၊ ပြဿနာ
      တက်တာကို ခဏ ဖယ်ထားဖို့ပါ။ use memo ကတော့ ရွေးထားတာကိုပဲ compile လုပ်တဲ့
      project အတွက်ပါ။ [[mark:draw-lint]] စည်းကမ်း ချိုးတာကို hooks lint plugin က
      code ရေးနေတုန်းမှာပဲ သတိပေးပါတယ်။ [[mark:draw-not-here]] ကိုယ့် project က
      Babel မပါဘဲ esbuild ပဲ သုံးလို့ compiler မ run ပါဘူး၊ ဒါကြောင့် hook တွေကို
      လက်နဲ့ ရေးခဲ့တာပါ။
    sources:
      - title: "React — React Compiler v1.0 (blog)"
        url: "https://react.dev/blog/2025/10/07/react-compiler-1"
      - title: "React — Introduction to React Compiler"
        url: "https://react.dev/learn/react-compiler/introduction"
      - title: "React — React Compiler directives"
