  # ------------------------------------------------------------------ 12
  - id: independent-recap
    chapter: "React 19.3 နဲ့ အနှစ်ချုပ်"
    narration: >
      React 19.3 က နောက်တစ်ခု ပြောင်းလိုက်ပါတယ်။ [[mark:draw-192]] အရင်က မဆိုင်တဲ့
      Transition နှစ်ခုကို React က တစ်ခါတလေ တစ်ခုတည်း ပေါင်းပြီး render
      လုပ်တတ်ပါတယ်။ React 19.2 နဲ့ တိုင်းကြည့်တဲ့ စမ်းသပ်မှု တစ်ခုမှာ၊ မြန်တဲ့
      update က နှေးတာကို စောင့်နေရပြီး၊ နှစ်ခုလုံး 1.5 စက္ကန့်လောက် ကြာမှ
      ပေါ်လာပါတယ်။ [[mark:draw-193]] React 19.3 ကတော့ သီးခြား Transition တွေကို
      တစ်ခုချင်းစီ render လုပ်လို့၊ မြန်တဲ့ update က 0.3 စက္ကန့်လောက်နဲ့
      ပေါ်လာပါတယ်။ [[mark:draw-action-note]] ခြွင်းချက် တစ်ခုက၊ async Action
      pending ဖြစ်နေတုန်း စတဲ့ Transition ကတော့ အဲဒီ Action နဲ့ အတူ batch
      လုပ်နေဆဲပါ။ Action တွေကို lesson 10 မှာ ကြည့်ပါမယ်။
      [[mark:draw-recap-measure]] ဒါဆို ပြန်ချုပ်ရရင်၊ Profiler နဲ့ အရင် တိုင်းပါ။
      [[mark:draw-recap-memo]] memo က props မပြောင်းတဲ့ child ကို ကျော်ပေးပြီး၊
      useMemo နဲ့ useCallback က props တွေ မပြောင်းအောင် ထိန်းပေးပါတယ်။
      [[mark:draw-recap-compiler]] React Compiler က ကိုယ့်အစား လုပ်ပေးပါတယ်။
      [[mark:draw-recap-transition]] Transition နဲ့ deferred value ကတော့ စာရိုက်တာ
      မနှေးစေပါဘူး။ [[mark:next-lesson]] နောက် lesson မှာတော့ data မရောက်ခင်
      loading ပြပေးတဲ့ Suspense ကို ကြည့်သွားပါမယ်။
    sources:
      - title: "React 19.3 (blog)"
        url: "https://react.dev/blog/2026/09/09/react-19-3"
      - title: "React — useTransition"
        url: "https://react.dev/reference/react/useTransition"
      - title: "React — Suspense"
        url: "https://react.dev/reference/react/Suspense"
