        timeoutMs: 5000
        target: { by: testId, value: commit-count }
        textContains: "render 1 ကြိမ် · mount"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-note-3
        type: preview.input
        at: { mark: type-note-3 }
        timeoutMs: 5000
        target: { by: testId, value: note-input }
        value: "ငရုတ်သီး မထည့်ပါနဲ့"
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-note-value-3
        type: expect.preview
        at: { afterAction: type-note-3 }
        timeoutMs: 5000
        target: { by: testId, value: note-input }
        value: "ငရုတ်သီး မထည့်ပါနဲ့"
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-note-3
        type: expect.preview
        at: { mark: after-note-3 }
        timeoutMs: 5000
        target: { by: testId, value: commit-count }
        textContains: "render 1 ကြိမ် · mount"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: click-pick
        type: preview.click
        at: { mark: click-pick }
        timeoutMs: 5000
        target: { by: testId, value: pick-shan-noodles }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-picked
        type: expect.preview
        at: { mark: after-pick }
        timeoutMs: 5000
        target: { by: testId, value: selected }
        textContains: "ရှမ်းခေါက်ဆွဲ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-picked-count
        type: expect.preview
        at: { afterAction: expect-picked }
        timeoutMs: 5000
        target: { by: testId, value: commit-count }
        textContains: "render 1 ကြိမ် · mount"
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-search
        type: preview.input
        at: { mark: type-search }
        timeoutMs: 5000
        target: { by: testId, value: search-input }
        value: "ရှမ်း"
