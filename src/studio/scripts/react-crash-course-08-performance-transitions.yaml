# React crash course, lesson 8 — Performance, React Compiler and transitions
# (Burmese, my-MM).
#
# Story: a parent's re-render re-renders its children; measure before fixing.
# DishList carries a <Profiler> whose onRender writes a render counter into a
# badge that index.html keeps outside React (setting state there would loop).
# Typing in an unrelated kitchen note makes the badge climb; memo alone does
# not stop it (a new array and a new function every render, Object.is board);
# useMemo + useCallback do, while a real search still re-renders the list.
# React Compiler 1.0 is whiteboard-only (it needs Babel; this Vite 5 workspace
# compiles JSX with esbuild). A HistoryPanel switches to a deliberately slow
# tab inside useTransition (pending label first while the today text stays;
# SlowRow busy-waits 10 ms, so the 250-row render under StrictMode lasts ~5 s
# and the 100-row deferred render ~2 s; the after-pending span is long enough
# that "all 250 arrived" is spoken after the list lands even at 55 ms/char),
# then searches it through useDeferredValue (a search box and a "still
# searching" label on the history tab only, while the memoized SlowList
# catches up; the brief stale label is predicted before the input and
# described in the past after it). The close draws React 19.3's independent
# Transitions as points on one timeline (fast update clicked at 0.3 s).
#
# Why the Profiler sits INSIDE DishList (deviation from the curriculum): a
# harness experiment (tools/exp1.ts) showed that a <Profiler> placed in App
# around a memo child calls onRender on EVERY App commit, even when the memo
# child is skipped; only a Profiler inside the memoized component counts the
# renders memo really skips. Mount fires onRender once under StrictMode.
#
# Insert-only plan: DishList.jsx and HistoryPanel.jsx are pinned EMPTY and
# typed while nothing imports them; every edit to the live App.jsx and (after
# it is wired) HistoryPanel.jsx is a `block` insert of complete lines or an
# atomic in-line insert (`memo, ` into the import braces, the `Memo` prefix,
# the `Memo` / `Stable` suffixes, ` filter={deferredQuery}`), each valid on
# its own, definitions before uses. Every JS edit reloads the preview (state
# and the badge reset), so every interaction comes after the last edit.
#
# The dev server starts during the first board and is first needed when the
# preview opens, about two minutes later.
#
# Narration is Burmese (my-MM); voice-script.md next to this file is the
# source (tools/sync_check2.py applies it and checks normalized equality,
# mark order and placement; tools/sync_check.py was the English-draft check). Every visible string (title, chapters,
# board labels, UI) is Burmese too.
