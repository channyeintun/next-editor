        type: expect.preview
        at: { afterAction: expect-search-count }
        timeoutMs: 5000
        target: { by: testId, value: dish-list }
        textContains: "ရှမ်းခေါက်ဆွဲ"
        retry: { maxAttempts: 2, delayMs: 250 }

  # ------------------------------------------------------------------ 8
  - id: compiler-board
    chapter: "React Compiler"
    narration: >
      React Compiler 1.0 က ဒါကို ကိုယ့်အစား လုပ်ပေးနိုင်ပါတယ်။ 2025
      အောက်တိုဘာကတည်းက stable ပါ။ [[mark:draw-compiler-build]] သူက app ကို build
      လုပ်ချိန်မှာ run ပါတယ်။ အခုတော့ Babel ဆိုတဲ့ JavaScript code ကို ဖတ်ပြီး
      ပြောင်းရေးပေးတဲ့ tool အတွက် plugin တစ်ခုပါ။ [[mark:draw-compiler-before]]
      ကိုယ်ရေးတဲ့ သာမန် code ကို ယူပါတယ်၊ ဥပမာ filter စာကြောင်းပါ။
      [[mark:draw-compiler-after]] ပြီးတော့ ဒီလို code ထုတ်ပေးပါတယ်။ component
      တစ်ခုစီအတွက် cache သေးသေးလေး တစ်ခု ထားပေးလို့၊ ရှာတဲ့ စာလုံး ပြောင်းမှသာ
      filter ပြန် run ပါတယ်။ JSX နဲ့ function တွေကိုပါ cache လုပ်ပေးတဲ့အတွက်၊
      props မပြောင်းတဲ့ child တွေက memo မပါဘဲ render ကို ကျော်သွားပါတယ်။
      [[mark:draw-compiler-guidance]] ဒါကြောင့် code အသစ်မှာ ဒီ hook တွေ သိပ်
      မလိုတော့ပါဘူး။ တကယ် လိုတဲ့ နေရာမှာပဲ သုံးပါ၊ ဥပမာ Effect ရဲ့ dependency ထဲ
      ထည့်ရမယ့် တန်ဖိုး တစ်ခုကို render တိုင်း မပြောင်းစေချင်တဲ့အခါမျိုးပါ။
      [[mark:board-compiler-rules]] ဒါပေမဲ့ compiler က ကိုယ့် code ဟာ Rules of
      React ကို လိုက်နာထားမယ်လို့ ယူဆပါတယ်။ ဥပမာ render လုပ်နေတုန်း props
      ဒါမှမဟုတ် state ကို တိုက်ရိုက် မပြင်ရတာ၊ hook ကို component ရဲ့ အပေါ်ဆုံး
      အဆင့်ကပဲ ခေါ်ရတာမျိုးပါ။ [[mark:draw-rules]] စည်းကမ်း ချိုးတဲ့ component
      ကိုတော့ ကျော်သွားပေမယ့်၊ cache မပါဘဲ ပုံမှန်အတိုင်း အလုပ်လုပ်ပါတယ်။
      [[mark:draw-directives]] component ရဲ့ အပေါ်ဆုံးမှာ use no memo လို့
      ရေးထားရင် compiler က အဲဒီ component ကို တမင် ကျော်သွားပြီး၊ use memo လို့
      ရေးရင်တော့ compile လုပ်ဖို့ ရွေးပေးတာပါ။ [[mark:draw-lint]] Rules of React
      ကို ချိုးထားတာကို React ရဲ့ hooks lint plugin က code ရေးနေတုန်းမှာပဲ
      သတိပေးပါတယ်။ Vite မှာဆိုရင်တော့ Vite ရဲ့ React plugin အသစ်မှာ compiler အတွက်
      preset တစ်ခု ပါလာလို့၊ အဲဒါကို Babel plugin တစ်ခုထဲ ထည့်ပေးရုံပါ။
      [[mark:draw-not-here]] ကိုယ့် project မှာတော့ Vite က JSX ကို esbuild နဲ့ပဲ
      ပြောင်းပြီး Babel မပါလို့၊ compiler က run မှာ မဟုတ်ပါဘူး။ ဒါကြောင့် hook
      တွေကို လက်နဲ့ ရေးခဲ့တာပါ။
    sources:
      - title: "React — React Compiler v1.0 (blog)"
        url: "https://react.dev/blog/2025/10/07/react-compiler-1"
      - title: "React — Introduction to React Compiler"
        url: "https://react.dev/learn/react-compiler/introduction"
      - title: "React — React Compiler directives"
        url: "https://react.dev/reference/react-compiler/directives"
      - title: "React — React Compiler installation"
        url: "https://react.dev/learn/react-compiler/installation"
      - title: "React — Rules of React"
        url: "https://react.dev/reference/rules"
      - title: "React 19.2 — eslint-plugin-react-hooks v6"
        url: "https://react.dev/blog/2025/10/01/react-19-2"
    actions:
      - id: board-compiler
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        maximized: true
        clear: true
        upsertIds: [b3-title]
      - id: draw-compiler-build
        type: whiteboard.apply
        at: { mark: draw-compiler-build }
        upsertIds: [b3-build]
        drawMs: 1000
      - id: draw-compiler-before
        type: whiteboard.apply
        at: { mark: draw-compiler-before }
        upsertIds: [b3-before-head, b3-before-box, b3-before-code]
        drawMs: 1500
      - id: draw-compiler-after
        type: whiteboard.apply
        at: { mark: draw-compiler-after }
        upsertIds: [b3-arrow, b3-after-head, b3-after-box, b3-after-code]
        drawMs: 2600
      - id: draw-compiler-guidance
        type: whiteboard.apply
        at: { mark: draw-compiler-guidance }
        upsertIds: [b3-guidance]
        drawMs: 1200
      - id: board-compiler-rules
        type: whiteboard.apply
        at: { mark: board-compiler-rules }
        clear: true
        upsertIds: [b4-title]
      - id: draw-rules
        type: whiteboard.apply
        at: { mark: draw-rules }
        upsertIds: [b4-rules, b4-rules-ok]
        drawMs: 1600
      - id: draw-directives
        type: whiteboard.apply
        at: { mark: draw-directives }
        upsertIds: [b4-directives]
        drawMs: 1000
      - id: draw-lint
        type: whiteboard.apply
        at: { mark: draw-lint }
        upsertIds: [b4-lint, b4-install]
        drawMs: 1800
      - id: draw-not-here
        type: whiteboard.apply
        at: { mark: draw-not-here }
        upsertIds: [b4-here, b4-here-underline]
        drawMs: 1300

  # ------------------------------------------------------------------ 9
  - id: transition-board
    chapter: "Transition နဲ့ deferred value"
    narration: >
      နောက် ပြဿနာ တစ်ခုက render တချို့ တကယ်ကို နှေးတာပါ။ [[mark:draw-urgent]]
      စာရိုက်တာနဲ့ နှိပ်တာက urgent ပါ၊ ဆိုလိုတာက screen က ချက်ချင်း
      တုံ့ပြန်ရပါမယ်။ [[mark:draw-transition]] data အများကြီး ပြရတဲ့ tab ကို
      ပြောင်းတာကတော့ ခဏ စောင့်လို့ ရပါတယ်။ Transition ဆိုတာ အလောတကြီး မဟုတ်တဲ့
      state update ပါ၊ React က အဲဒါကို နောက်ကွယ်မှာ render လုပ်ပါတယ်။
      [[mark:draw-interrupt]] အဲဒီကြားထဲ စာရိုက်လိုက်ရင် React က အဲဒီ render ကို
      ရပ်လိုက်ပြီး၊ ရိုက်တဲ့ စာကို အရင် ပြပါတယ်။ ပြီးမှ Transition ကို အစကနေ ပြန်
      render လုပ်ပါတယ်။ [[mark:draw-pending]] စောင့်နေတုန်း isPending က true
      ဖြစ်လို့၊ loading စာသား ပြလို့ ရပါတယ်။ [[mark:draw-tracks]] ဒါကို timeline
      ပေါ်မှာ ကြည့်ချင်ရင်၊ React 19.2 က Chrome DevTools ထဲ Performance Tracks
      ထည့်ပေးပါတယ်။
    sources:
      - title: "React — useTransition"
        url: "https://react.dev/reference/react/useTransition"
      - title: "React — React Performance tracks"
        url: "https://react.dev/reference/dev-tools/react-performance-tracks"
      - title: "React 19.2 — Performance Tracks"
        url: "https://react.dev/blog/2025/10/01/react-19-2"
    actions:
      - id: board-transition
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        clear: true
        upsertIds: [b5-title]
      - id: draw-urgent
        type: whiteboard.apply
        at: { mark: draw-urgent }
        upsertIds: [b5-urgent-box, b5-urgent-head, b5-urgent-l1, b5-urgent-l2]
        drawMs: 1800
      - id: draw-transition
        type: whiteboard.apply
        at: { mark: draw-transition }
        upsertIds: [b5-trans-box, b5-trans-head, b5-trans-l1, b5-trans-l2]
        drawMs: 1800
      - id: draw-interrupt
        type: whiteboard.apply
        at: { mark: draw-interrupt }
        upsertIds: [b5-interrupt]
        drawMs: 1200
      - id: draw-pending
        type: whiteboard.apply
        at: { mark: draw-pending }
        upsertIds: [b5-pending]
        drawMs: 1000
      - id: draw-tracks
        type: whiteboard.apply
        at: { mark: draw-tracks }
        upsertIds: [b5-tracks]
        drawMs: 1000

  # ------------------------------------------------------------------ 10
  - id: history-transition
    narration: >
      [[mark:close-board-transition]] အရင်က order တွေရဲ့ မှတ်တမ်း
      ဆောက်ကြည့်ရအောင်။ [[mark:open-slowlist]] SlowList က ရေးပြီးသားပါ။
      [[mark:select-slow-loop]] ဒီ loop က row တိုင်း 10 millisecond တမင်
      စောင့်စေလို့၊ row 250 ခု render တာ နှေးပါတယ်။ [[mark:select-slowlist-memo]]
      ပြီးတော့ memo နဲ့ ထုပ်ထားပါတယ်။ ဒါ နောက်မှ လိုပါလိမ့်မယ်။
      [[mark:open-history]] HistoryPanel ကတော့ အလွတ်ပါ။ [[mark:type-hp-top]]
      SlowList ကို import လုပ်ပြီး၊ လက်ရှိ tab ကို state ထဲမှာ ထားပါတယ်။ အစမှာ
      ဒီနေ့ tab ကနေ စပါတယ်။ [[mark:type-hp-transition]] useTransition ကတော့ state
      update ကို အလောတကြီး မဟုတ်ဘူးလို့ React ကို ပြောပေးပြီး၊ နှစ်ခု
      ပြန်ပေးပါတယ်။ Transition run နေဆဲလား ပြောတဲ့ isPending နဲ့၊ Transition
      စပေးတဲ့ startTransition ပါ။ [[mark:type-hp-select]] tab ပြောင်းတာကို
      startTransition ထဲမှာ လုပ်လို့၊ ဒီ update က urgent မဟုတ်တော့ပါဘူး။
      [[mark:type-hp-jsx]] JSX မှာတော့ tab ခလုတ် နှစ်ခု၊ pending ဖြစ်နေတုန်း
      ပြမယ့် loading စာသား၊ ပြီးတော့ ဒီနေ့ စာသား ဒါမှမဟုတ် နှေးတဲ့ list ပါပါတယ်။
      [[mark:open-app-history]] App မှာ import လုပ်ပါတယ်။ [[mark:wire-hp-use]]
      ပြီးတော့ ခေါင်းစဉ် အောက်မှာ ထည့်ပါတယ်။ မှတ်တမ်း tab ကို နှိပ်လိုက်ရင်၊ list
      မရောက်ခင်မှာ loading စာသား အရင် ပေါ်လာပြီး၊ ဒီနေ့ tab ကလည်း ကျန်နေပါမယ်။
      [[mark:click-history]] ကဲ၊ နှိပ်ကြည့်ရအောင်။ [[mark:after-pending]] loading
      စာသား ပေါ်နေပြီး၊ ဒီနေ့ tab လည်း ရှိနေပါသေးတယ်။ [[mark:after-history]] အခု
      order 250 ပွဲလုံး ရောက်လာပါပြီ။
    sources:
      - title: "React — useTransition: Updating the parent component in a Transition"
        url: "https://react.dev/reference/react/useTransition#marking-a-state-update-as-a-non-blocking-transition"
      - title: "React — useTransition: Displaying a pending visual state"
        url: "https://react.dev/reference/react/useTransition#displaying-a-pending-visual-state-during-the-transition"
      - title: "MDN — performance.now()"
        url: "https://developer.mozilla.org/en-US/docs/Web/API/Performance/now"
    actions:
      - id: close-board-transition
        type: whiteboard.apply
        at: { mark: close-board-transition }
        open: false
      - id: open-slowlist
        type: workspace.openFile
        at: { mark: open-slowlist }
        path: src/SlowList.jsx
      - id: select-slow-loop
        type: editor.select
        at: { mark: select-slow-loop }
        target:
          {
            file: src/SlowList.jsx,
            text: "while (performance.now() - start < 10) {",
            occurrence: 1,
          }
      - id: select-slowlist-memo
        type: editor.select
        at: { mark: select-slowlist-memo }
        target: { file: src/SlowList.jsx, text: "export const SlowList = memo(", occurrence: 1 }
      - id: open-history
        type: workspace.openFile
        at: { mark: open-history }
        path: src/HistoryPanel.jsx
      - id: type-hp-top
        type: editor.type
        at: { mark: type-hp-top }
        cadence: line-by-line
        target: { file: src/HistoryPanel.jsx, after: "", occurrence: 1 }
        text: "import { useState, useTransition } from \"react\";\nimport { SlowList } from \"./SlowList.jsx\";\n\nexport function HistoryPanel() {\n  const [tab, setTab] = useState(\"today\");\n"
      - id: type-hp-transition
        type: editor.type
        at: { mark: type-hp-transition }
        cadence: fast-explainer
        target:
          {
            file: src/HistoryPanel.jsx,
            after: "  const [tab, setTab] = useState(\"today\");\n",
            occurrence: 1,
          }
        text: "  const [isPending, startTransition] = useTransition();\n"
      - id: type-hp-select
        type: editor.type
        at: { mark: type-hp-select }
        cadence: line-by-line
        target:
          {
            file: src/HistoryPanel.jsx,
            after: "  const [isPending, startTransition] = useTransition();\n",
            occurrence: 1,
          }
        text: "\n  function selectTab(nextTab) {\n    startTransition(() => {\n      setTab(nextTab);\n    });\n  }\n"
      - id: type-hp-jsx
        type: editor.type
        at: { mark: type-hp-jsx }
        cadence: block
        target:
          {
            file: src/HistoryPanel.jsx,
            after: "      setTab(nextTab);\n    });\n  }\n",
            occurrence: 1,
          }
        text: "\n  return (\n    <section className=\"card\" data-testid=\"history-panel\">\n      <div className=\"row\">\n        <button data-testid=\"tab-today\" onClick={() => selectTab(\"today\")}>\n          ဒီနေ့\n        </button>\n        <button data-testid=\"tab-history\" onClick={() => selectTab(\"history\")}>\n          မှတ်တမ်း\n        </button>\n      </div>\n      {isPending && <p className=\"muted\" data-testid=\"history-pending\">ဖွင့်နေပါတယ်…</p>}\n      {tab === \"today\" ? <p data-testid=\"today-text\">ဒီနေ့ ဆိုင်ဖွင့်ထားပါတယ်</p> : <SlowList />}\n    </section>\n  );\n}\n"
      - id: open-app-history
        type: workspace.openFile
        at: { mark: open-app-history }
        path: src/App.jsx
      - id: wire-hp-import
        type: editor.type
        at: { afterAction: open-app-history }
        cadence: block
        target:
          {
            file: src/App.jsx,
            after: "import { DishList } from \"./DishList.jsx\";\n",
            occurrence: 1,
          }
        text: "import { HistoryPanel } from \"./HistoryPanel.jsx\";\n"
      - id: wire-hp-use
        type: editor.type
        at: { mark: wire-hp-use }
        cadence: block
        target: { file: src/App.jsx, after: "      <Header />\n", occurrence: 1 }
        text: "      <HistoryPanel />\n"
      - id: expect-today
        type: expect.preview
        at: { mark: click-history, offsetMs: -700 }
        timeoutMs: 5000
        target: { by: testId, value: today-text }
        textContains: "ဆိုင်ဖွင့်ထားပါတယ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: click-history
        type: preview.click
        at: { mark: click-history }
        timeoutMs: 5000
        target: { by: testId, value: tab-history }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-pending
        type: expect.preview
        at: { afterAction: click-history }
        timeoutMs: 3000
        target: { by: testId, value: history-pending }
        textContains: "ဖွင့်နေပါတယ်"
        retry: { maxAttempts: 3, delayMs: 100 }
      - id: expect-history
        type: expect.preview
        at: { mark: after-history }
        timeoutMs: 5000
        target: { by: testId, value: history-count }
        textContains: "250 ပွဲ"
        retry: { maxAttempts: 3, delayMs: 3000 }

  # ------------------------------------------------------------------ 11
  - id: deferred-search
    narration: >
      [[mark:open-history-2]] အခု မှတ်တမ်းထဲ ရှာလို့ ရတဲ့ အကွက် ထည့်ကြည့်ရအောင်။
      ဒီတစ်ခါတော့ startTransition ကို မသုံးပါဘူး။ input ထဲ ရိုက်တဲ့ စာက ချက်ချင်း
      ပေါ်ရမှာ ဖြစ်လို့၊ input ရဲ့ state ကို Transition ထဲ ထည့်လို့ မရပါဘူး။
      ဒါကြောင့် state ကို ချက်ချင်း ပြောင်းပြီး၊ နှေးတဲ့ list ကို ပေးမယ့်
      တန်ဖိုးကိုပဲ နောက်ကျစေပါတယ်။ [[mark:wire-deferred-import]] useDeferredValue
      ကို ယူပါတယ်။ [[mark:wire-deferred-state]] query က input ထဲ ရိုက်ထားတဲ့ စာကို
      မှတ်ထားတဲ့ state ပါ။ deferredQuery ကတော့ useDeferredValue က ပေးတဲ့၊
      နောက်ကျပြီးမှ လိုက်ပြောင်းတဲ့ copy ပါ။ [[mark:wire-deferred-input]] input က
      query ကို ပြလို့ ရိုက်လိုက်တာ ချက်ချင်း ပေါ်ပြီး၊ နှစ်ခု မတူနေတုန်း
      ရှာနေဆဲပါ ဆိုတဲ့ စာသား ပြပါတယ်။ [[mark:wire-deferred-filter]] SlowList ကတော့
      deferred တန်ဖိုးကို ရပါတယ်။ urgent render မှာ အဲဒီ တန်ဖိုး မပြောင်းသေးလို့
      memo က နှေးတဲ့ list ကို ကျော်သွားပါတယ်။ အဲဒီနောက်မှ React က တန်ဖိုး အသစ်နဲ့
      list ကို နောက်ကွယ်မှာ render လုပ်ပါတယ်။ React 19 ကစပြီး ပထမဆုံး render မှာ
      ပြထားမယ့် တန်ဖိုး တစ်ခုကိုလည်း ပေးလို့ ရလို့၊ page စဖွင့်ချိန်မှာတောင်
      နှေးတဲ့ list ကို မစောင့်ဘဲ ကျန်တဲ့ အပိုင်းတွေကို အရင် ပြလို့ ရပါတယ်။
      [[mark:click-history-2]] page ပြန်ပွင့်သွားလို့ မှတ်တမ်း tab ကို
      ထပ်ဖွင့်ရအောင်။ list ရောက်လာရင် ခေါက်ဆွဲကို ရှာကြည့်ပါမယ်။ ရိုက်လိုက်တာနဲ့
      input ထဲက စာက ချက်ချင်း ပေါ်ပြီး၊ list က လိုက်မမီသေးတုန်း ရှာနေဆဲပါ ဆိုတဲ့
      စာသား ခဏ ပေါ်ပါမယ်။ [[mark:type-history-search]] ကဲ၊ ရိုက်ကြည့်ရအောင်။
      [[mark:after-stale]] input ထဲက စာက ချက်ချင်း ပြောင်းသွားပြီး၊ list ကတော့
      ခဏနေမှ လိုက်မီလာပါတယ်။ [[mark:after-filtered]] အခု ခေါက်ဆွဲ order 100 ပွဲပဲ
      ပြနေပါပြီ။
    sources:
