      src/Header.jsx: |
        export function Header() {
          return (
            <>
              <h1 data-testid="title">ရွှေရန်ကုန် မုန့်ဟင်းခါးဆိုင်</h1>
              <p className="muted">မနက် ၆ နာရီ မှ ညနေ ၆ နာရီ အထိ</p>
            </>
          );
        }
      src/SlowList.jsx: |
        import { memo } from "react";
        import { menu } from "./menu.js";

        const orders = Array.from({ length: 250 }, (_, i) => ({
          id: i + 1,
          dish: menu[i % menu.length],
        }));

        function SlowRow({ order }) {
          const start = performance.now();
          while (performance.now() - start < 10) {
            // တမင် နှေးအောင် လုပ်ထားတာပါ (row တစ်ခု 10 ms)
          }
          return (
            <li>
              #{order.id} {order.dish.name}
            </li>
          );
        }

        export const SlowList = memo(function SlowList({ filter = "" }) {
          const shown = orders.filter((order) => order.dish.name.includes(filter));
          return (
            <>
              <p className="muted" data-testid="history-count">
                {shown.length} ပွဲ
              </p>
              <ul className="list history" data-testid="history-list">
                {shown.map((order) => (
                  <SlowRow key={order.id} order={order} />
                ))}
              </ul>
            </>
          );
        });
      src/App.jsx: |
        import { useState } from "react";
        import { Header } from "./Header.jsx";
        import { menu } from "./menu.js";

        export default function App() {
          const [note, setNote] = useState("");
          const [query, setQuery] = useState("");
          const [selectedId, setSelectedId] = useState(null);

          const visible = menu.filter((dish) => dish.name.includes(query));
          const selected = menu.find((dish) => dish.id === selectedId);

          function handleSelect(id) {
            setSelectedId(id);
          }

          return (
            <main className="page">
              <Header />
              <section className="card">
                <input
                  value={note}
                  onChange={(e) => setNote(e.target.value)}
                  placeholder="မီးဖိုချောင်အတွက် မှတ်ချက်"
                  data-testid="note-input"
                />
              </section>
              <section className="card">
                <h2>ဟင်းလျာများ</h2>
                <input
                  value={query}
                  onChange={(e) => setQuery(e.target.value)}
                  placeholder="ဟင်းလျာ ရှာရန်"
                  data-testid="search-input"
                />
                <p className="muted" data-testid="selected">
                  ရွေးထားတာ – {selected ? selected.name : "မရှိသေးပါ"}
                </p>
              </section>
            </main>
          );
        }
