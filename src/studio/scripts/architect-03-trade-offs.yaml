      - id: expect-decision
        type: expect.file
        at: { afterAction: sel-why }
        path: notebook/03-seat-hold-trade-off.md
        contains: "## ဆုံးဖြတ်ချက်\n\n- ထိုင်ခုံကို 10 မိနစ် hold လုပ်မယ်\n"

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ team ထဲက တစ်ယောက်က ခရီးစဉ် ရှာတဲ့ ရလဒ်တွေကို cache ထဲ ခဏ
      သိမ်းထားဖို့ အဆို တင်လာပါတယ်။ ဒီလို လုပ်ရင် ရှာတာ ပိုမြန်မယ်၊ ဆိုးကျိုးလည်း ဘာမှ မရှိဘူးလို့ သူက
      ပြောပါတယ်။ ကိုယ့် နောက်တစ်ဆင့်က ဘာဖြစ်သင့်လဲ။
      [[mark:q-a]] ပထမ တစ်ခုက ဆိုးကျိုး မရှိတာမို့ ချက်ချင်း လက်ခံလိုက်တာပါ။
      [[mark:q-b]] ဒုတိယ တစ်ခုကတော့ ဒီနည်းက ဘာကို လျှော့ပေးရလဲ ဆိုတာ အရင် လိုက်ရှာတာပါ။ lesson ကို pause
      လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ တစ်ခုပါ။ ဘာကြောင့်လဲဆိုတော့ ပေးရတာ မရှိတဲ့ ရွေးချယ်မှု ဆိုတာ
      မရှိလို့ပါ။ မတွေ့သေးဘူး ဆိုရင် မရှိတာ မဟုတ်ဘဲ၊ ရှာမတွေ့သေးတာပါ။
      [[mark:q-r]] မမြင်ရသေးတဲ့ ပေးရတာက production ရောက်မှ ပေါ်လာတတ်လို့ အန္တရာယ် အများဆုံးပါ။
      [[mark:q-ex]] ဒီ cache မှာဆိုရင် ရလဒ်ထဲက လွတ်နေတဲ့ ခုံ အရေအတွက်က မိနစ်အနည်းငယ် ဟောင်းနေနိုင်ပါတယ်။
      ခရီးသည်က ခုံ လွတ်တယ် ထင်ပြီး ဝင်ကြည့်မှ ကုန်နေတာမျိုး ကြုံရမှာပါ။ ဒါကို သိပြီးမှ လက်ခံတာနဲ့ မသိဘဲ
      လက်ခံတာ မတူပါဘူး။
      [[mark:q-love]] အဆိုတင်တဲ့သူက ဒါကို မမြင်တာ ထူးဆန်းတာ မဟုတ်ပါဘူး။ ကိုယ် ကြိုက်နေတဲ့ နည်းအတွက်ဆိုရင်
      ရတာတွေကိုပဲ မြင်ပြီး၊ ပေးရတာကို မမြင်တော့တာ ကိုယ်အပါအဝင် ဘယ်သူမဆို ဖြစ်တတ်ပါတယ်။ ဒါကြောင့် ကိုယ်
      အကြိုက်ဆုံး နည်းရဲ့ ပေးရတာကို အရင်ဆုံး ရှာပါ။ ရှာမတွေ့ရင် အဲဒီနည်းကို မကြိုက်တဲ့သူ တစ်ယောက်ကို
      သွားမေးပါ။ lock ရဲ့ ပေးရတာကို လှလှ က အရင် မြင်ခဲ့တာလည်း သူက ကောင်တာရှေ့က ခရီးသည်တွေဘက်ကနေ
      ကြည့်နေလို့ပါ။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
      - {
          title: "Software Architecture: The Hard Parts (Ford, Richards, Sadalage, Dehghani)",
          url: "https://oreil.ly/sa-the-hard-parts",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-reason,
          type: whiteboard.apply,
          at: { mark: q-r },
          upsertIds: [q-r],
          drawMs: 1000,
        }
      - {
          id: draw-example,
          type: whiteboard.apply,
          at: { mark: q-ex },
          upsertIds: [q-ex],
          drawMs: 1000,
        }

  - id: your-turn
    chapter: ကိုယ့် system အတွက်
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ကိုယ့် project ထဲမှာ ဒါက ပိုကောင်းတာ
      သေချာတယ် ဆိုပြီး သိပ်မစဉ်းစားဘဲ ရွေးခဲ့တဲ့ ရွေးချယ်မှု တစ်ခုကို ယူပါ။ ဒီ table ထဲမှာ အဲဒီ ရွေးချယ်မှုကို
      တစ်ကြောင်း ထည့်ပြီး၊ ပေးရတာ ဆိုတဲ့ နေရာကို ဖြည့်ကြည့်ပါ။
      [[mark:turn-2]] ပြီးရင် ဘယ်အခါမှာ ဒီ ရွေးချယ်မှုက မသင့်တော်တော့ဘူးလဲ ဆိုတာကိုပါ ရေးထားပါ။ trade
      off ကို တစ်ခါ ချိန်ပြီးတာနဲ့ အမြဲတမ်း မှန်နေတာ မဟုတ်ပါဘူး။ အဲဒီ အခြေအနေ ရောက်လာတဲ့နေ့က
      ပြန်ချိန်ရမယ့် နေ့ပါပဲ။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: turn }, open: false }
      - id: sel-cost-col
        type: editor.select
        at: { mark: turn, offsetMs: 2200 }
        target:
          {
            file: notebook/03-seat-hold-trade-off.md,
            text: "| 10 မိနစ် hold | ငွေချေသူ အများစု စိတ်ချရ | မဝယ်သူရဲ့ ခုံ 10 မိနစ် ရောင်းမရ | ငွေချေတာ 3–8 မိနစ် ကြာချိန် |",
          }

  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ ဘယ်နည်းက ပိုကောင်းလဲ ဆိုတဲ့ မေးခွန်းကို ရတာ၊ ပေးရတာနဲ့ ဘယ်အခါ သင့်တော်လဲ ဆိုတဲ့
      table တစ်ခုအဖြစ် ပြောင်းလိုက်ရင် အဖြေက ဘာပေါ် မူတည်လဲ ဆိုတာ ပေါ်လာပါတယ်။
      [[mark:recap-2]] ဆုံးဖြတ်ချက် အများစုက ဟုတ်၊ မဟုတ် ရွေးရတာ မဟုတ်ဘဲ၊ မျဉ်းတစ်ကြောင်းပေါ်က နေရာ တစ်ခုကို
      ရွေးရတာပါ။ ရွေးပြီးရင်လည်း ဘာကြောင့်လဲ ဆိုတာကို မှတ်ထားမှ နောက်တစ်ချိန် ပြန်ပြင်နိုင်ပါတယ်။
      [[mark:next]] နောက် lesson မှာတော့ ဒီလို ရွေးစရာတွေ ရှိမှန်း သိနိုင်ဖို့ architect တစ်ယောက်က ဘာတွေကို
      ဘယ်လောက် ကျယ်ကျယ် သိထားရမလဲ ဆိုတာကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions: []

