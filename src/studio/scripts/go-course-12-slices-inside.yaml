runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "2 4 [ရန်ကုန် ပဲခူး]\n"
      run-2:
        status: success
        exitCode: 0
        output: "2 4 [ရန်ကုန် ပဲခူး]\n[ရန်ကုန် ပဲခူး တောင်ငူ မန္တလေး]\n"
      run-3:
        status: success
        exitCode: 0
        output: "2 2 [ရန်ကုန် ပဲခူး]\n[ရန်ကုန် ပဲခူး နေပြည်တော် မန္တလေး]\n3 4 [ရန်ကုန် ပဲခူး တောင်ငူ]\n"

scenes:
  - id: recall
    chapter: Slice ကို ဖြတ်ယူတာ
    narration: >-
      ပြီးခဲ့တဲ့ lesson မှာ ခရီးစဉ်ထဲက မြို့တွေကို slice ထဲ ထည့်ပြီး၊ index နဲ့ ယူတာ၊ range နဲ့
      လျှောက်တာ၊ append နဲ့ မြို့ အသစ် ထပ်ထည့်တာတွေကို လုပ်ခဲ့ပါတယ်။ ဒီနေ့ lesson မှာတော့ slice ရဲ့
      နောက်ကွယ်မှာ တကယ် ဘာရှိလဲ ဆိုတာကို ကြည့်ပါမယ်။ ဒါကို သိထားမှ append က ဘာကြောင့် တစ်ခါတလေ
      မထင်ထားတဲ့ ရလဒ် ပေးတတ်လဲ ဆိုတာ နားလည်မှာပါ။ [[mark:sel-trip]] main ဖိုင်မှာ trip ဆိုတဲ့ slice
      တစ်ခု ရှိပြီးသားပါ။ ရန်ကုန်ကနေ ပဲခူး၊ နေပြည်တော်ကို ဖြတ်ပြီး မန္တလေးအထိ သွားမယ့် ခရီးစဉ်ပါ။
      ခရီးက ရှည်လို့ နှစ်ရက် ခွဲသွားမယ် ဆိုပါစို့။ ပထမနေ့မှာ ရန်ကုန်နဲ့ ပဲခူးကိုပဲ သွားမှာ ဖြစ်လို့၊ trip
      ထဲက ရှေ့ဆုံး မြို့ နှစ်မြို့ကို သီးသန့် slice တစ်ခု အနေနဲ့ လိုချင်ပါတယ်။
    sources:
      - { title: "Go Slices: usage and internals", url: "https://go.dev/blog/slices-intro" }
      - {
          title: "The Go Programming Language Specification — Slice types",
          url: "https://go.dev/ref/spec#Slice_types",
        }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }
      - id: sel-trip
        type: editor.select
        at: { mark: sel-trip }
        target:
          {
            file: main.go,
            text: 'trip := []string{"ရန်ကုန်", "ပဲခူး", "နေပြည်တော်", "မန္တလေး"}',
            occurrence: 1,
          }

  - id: slicing
    narration: >-
      [[mark:type-day1]] trip ထဲက အပိုင်း တစ်ခုကို ဖြတ်ယူဖို့ စမယ့် index နဲ့ ရပ်မယ့် index ကို
      ပေးရပါတယ်။ ပြီးတော့ ရလာတဲ့ slice ရဲ့ len၊ cap နဲ့ အထဲက မြို့တွေကို print ထုတ်ကြည့်ပါမယ်။
      [[mark:sel-cut]] ဒီ ဖြတ်ယူတဲ့ ပုံစံကို ကြည့်ပါ။ ရပ်မယ့် index က နှစ် ဖြစ်ပေမဲ့ index နှစ်ကိုယ်တိုင်
      မပါပါဘူး၊ အဲဒီ မတိုင်ခင်အထိပဲ ယူတာပါ။ စမယ့် index ကို မရေးထားရင်တော့ သုညကနေ စတယ်လို့ ယူပါတယ်။
      ဒါကြောင့် ဒီမှာ index သုည နဲ့ တစ်၊ ဆိုလိုတာက ရန်ကုန်နဲ့ ပဲခူးကို ရပါမယ်။ [[mark:sel-print1]] print
      ထုတ်တဲ့ line မှာ len နဲ့ cap နှစ်ခုလုံး ပါပါတယ်။ len ကို ပြီးခဲ့တဲ့ lesson မှာ သုံးခဲ့ပြီးပါပြီ၊ cap
      ကတော့ ဒီနေ့ အသစ်ပါ။ ဘာလဲ ဆိုတာကို output ကို ကြည့်ပြီးမှ ရှင်းပါမယ်။ [[mark:run-1]] ကဲ၊ run
      လိုက်ရအောင်။
    sources:
      - {
          title: "The Go Programming Language Specification — Slice expressions",
          url: "https://go.dev/ref/spec#Slice_expressions",
        }
      - {
          title: "The Go Programming Language Specification — Length and capacity",
          url: "https://go.dev/ref/spec#Length_and_capacity",
        }
    actions:
      - id: type-day1
        type: editor.type
        at: { mark: type-day1 }
        target: { file: main.go, after: "\"မန္တလေး\"}\n", occurrence: 1 }
        text: "\tday1 := trip[:2]\n\tfmt.Println(len(day1), cap(day1), day1)\n"
        cadence: line-by-line
      - id: sel-cut
        type: editor.select
        at: { mark: sel-cut }
        target: { file: main.go, text: "trip[:2]", occurrence: 1 }
      - id: sel-print1
        type: editor.select
        at: { mark: sel-print1 }
        target: { file: main.go, text: "fmt.Println(len(day1), cap(day1), day1)", occurrence: 1 }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "2 4 [ရန်ကုန် ပဲခူး]",
          timeoutMs: 8000,
        }

  - id: window
    chapter: Slice ဆိုတာ ဘောင် တစ်ခုပါ
    narration: >-
      [[mark:point-r1]] output မှာ နှစ်၊ လေး၊ ပြီးတော့ ရန်ကုန်နဲ့ ပဲခူးကို တွေ့ရပါတယ်။ ပထမ ဂဏန်း နှစ်က
      len ပါ၊ ပထမနေ့ slice ထဲမှာ မြို့ နှစ်မြို့ ရှိလို့ပါ။ ဒါပေမဲ့ ဒုတိယ ဂဏန်း လေး ကတော့ ဘယ်က
      လာတာလဲ။ အဲဒါကို နားလည်ဖို့ slice ရဲ့ နောက်ကွယ်ကို ကြည့်ရပါမယ်။ [[mark:board-shelf]] Go မှာ slice
      တစ်ခု လုပ်လိုက်တဲ့အခါ၊ တန်ဖိုးတွေကို array ဆိုတဲ့ အရှည် ပုံသေ ခုံတန်း တစ်ခုပေါ်မှာ စီထားပါတယ်။
      [[mark:draw-seats]] trip အတွက်ကတော့ ခုံ လေးခုံ ပါတဲ့ ခုံတန်းပါ၊ ခုံ တစ်ခုံစီမှာ မြို့ တစ်မြို့စီ
      ရှိနေပါတယ်။ [[mark:draw-trip]] slice ကိုယ်တိုင်ထဲမှာ တန်ဖိုးတွေ မရှိပါဘူး။ ခုံတန်းပေါ်မှာ
      ချိတ်ထားတဲ့ ဘောင် တစ်ခုပါ။ trip ရဲ့ ဘောင်က ခုံ လေးခုံလုံးကို မြင်ရပါတယ်။ [[mark:draw-day1]]
      ဖြတ်ယူလိုက်တဲ့ ပထမနေ့ slice ကလည်း ဘောင် အသစ် တစ်ခုပဲ ဖြစ်ပြီး၊ ခုံတန်း အသစ် မဟုတ်ပါဘူး။ ခုံတန်း
      တစ်ခုတည်းရဲ့ ရှေ့ ခုံ နှစ်ခုံကိုပဲ မြင်ရအောင် ချိတ်ထားတာပါ။ ဒါကြောင့် မြို့တွေကို copy မကူးပါဘူး။
      [[mark:draw-cap]] len က ဘောင်ထဲမှာ မြင်ရတဲ့ ခုံ အရေအတွက်ပါ။ cap ကတော့ ဘောင် စတဲ့ နေရာကနေ ခုံတန်း
      ဆုံးတဲ့အထိ ခုံ ဘယ်နှစ်ခုံ ရှိလဲ ဆိုတာပါ။ ဆိုလိုတာက ခုံတန်း မပြောင်းဘဲ ဒီ ဘောင်ကို ဘယ်လောက်အထိ
      ချဲ့လို့ ရလဲ ဆိုတာပါ။ ဒါကြောင့် ပထမနေ့ slice ရဲ့ cap က လေး ဖြစ်နေတာပါ။ ဥပမာ ပဲခူးကနေ စပြီး
      ဖြတ်ယူခဲ့ရင်တော့ ဘောင် စတဲ့ နေရာက ခုံတန်းရဲ့ ဒုတိယ ခုံ ဖြစ်သွားလို့ cap က သုံး ပဲ ရပါမယ်။
    sources:
      - { title: "Go Slices: usage and internals", url: "https://go.dev/blog/slices-intro" }
      - {
          title: "The Go Programming Language Specification — Slice types",
          url: "https://go.dev/ref/spec#Slice_types",
        }
      - {
          title: "A Tour of Go — Slice length and capacity",
          url: "https://go.dev/tour/moretypes/11",
        }
    actions:
      - {
