# Go course, lesson 12: what a slice really is (Burmese).
#
# Start state: main.go with a parenthesized import block holding "fmt" and a `trip` slice of four
# cities (Yangon, Bago, Naypyitaw, Mandalay) in `main`.
# Edits, all insert-only:
#   1. `day1 := trip[:2]` and a Println of its len, cap and value -> run-1: 2 4 [ရန်ကုန် ပဲခူး];
#   2. `day1 = append(day1, "တောင်ငူ")` and `fmt.Println(trip)` -> run-2: the trip has lost
#      Naypyitaw (no error, a bug);
#   3. `"slices"` into the import block, `slices.Clone(` and `)` around `trip[:2]`, and the len/cap
#      Println again after the append -> run-3: 2 2 …, the trip intact, 3 4 [ရန်ကုန် ပဲခူး တောင်ငူ].
# Boards: (S) the array as a row of seats with two frames hung over it (trip, day1), len and cap,
# then append writing into trip's seat; (G) what append does when the capacity is full; (Q) quiz.
# Fixtures: bun ~/Documents/go-course-work/tools/sim-go.ts <this yaml> --write
