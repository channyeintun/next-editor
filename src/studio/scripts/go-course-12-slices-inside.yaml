  - id: append
    narration: >-
      [[mark:close-shelf]] ခရီးစဉ်ကို နည်းနည်း ပြင်ကြည့်ရအောင်။ ပထမနေ့မှာ ပဲခူး ပြီးရင် တောင်ငူ အထိ ဆက်သွားပြီး
      အဲဒီမှာ တစ်ညအိပ်မယ် ဆိုပါစို့။ [[mark:type-append]] ဒါကြောင့် ပထမနေ့ slice ထဲကို append နဲ့ တောင်ငူကို
      ထပ်ထည့်ပြီး၊ ပြန်ရလာတဲ့ slice ကို အဲဒီ variable ထဲမှာပဲ ပြန်ထည့်ပါမယ်။ ပြီးတော့ ပထမနေ့ကို မဟုတ်ဘဲ
      trip တစ်ခုလုံးကို print ထုတ်ကြည့်ပါမယ်။ trip ကို ကိုယ်က ဘာမှ မပြင်ထားတဲ့အတွက် မူလ မြို့ လေးမြို့ပဲ
      ထွက်လာရမှာပါ။ [[mark:run-2]] ကဲ၊ run ကြည့်ရအောင်။
    sources:
      - {
          title: "The Go Programming Language Specification — Appending to and copying slices",
          url: "https://go.dev/ref/spec#Appending_and_copying_slices",
        }
    actions:
      - {
          id: close-shelf,
          type: whiteboard.apply,
          at: { mark: close-shelf },
          open: false,
          upsertIds: [],
        }
      - id: type-append
        type: editor.type
        at: { mark: type-append }
        target:
          { file: main.go, after: "\tfmt.Println(len(day1), cap(day1), day1)\n", occurrence: 1 }
        text: "\tday1 = append(day1, \"တောင်ငူ\")\n\tfmt.Println(trip)\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "[ရန်ကုန် ပဲခူး တောင်ငူ မန္တလေး]",
          timeoutMs: 8000,
        }
      - {
          id: expect-file-append,
          type: expect.file,
          at: { afterAction: run-2 },
          path: main.go,
          contains: "\tday1 = append(day1, \"တောင်ငူ\")\n",
        }

  - id: shared
    chapter: append က trip ကို ပြင်သွားတာ
    narration: >-
      [[mark:point-trip]] ဒုတိယ စာကြောင်းကို ကြည့်ပါ။ trip ထဲမှာ ရန်ကုန်၊ ပဲခူး၊ တောင်ငူ၊ မန္တလေး ဖြစ်သွားပါတယ်။
      နေပြည်တော် ပျောက်သွားပြီး အဲဒီ နေရာမှာ တောင်ငူ ဝင်နေပါတယ်။ compile error လည်း မရှိ၊ panic လည်း
      မဖြစ်ပါဘူး။ program က ပုံမှန် run သွားပေမဲ့ ရလဒ်က မှားနေလို့ ဒါက code ထဲက bug ပါ။
      [[mark:board-append]] ဘာဖြစ်သွားလဲ ဆိုတာ ခုံတန်းပေါ်မှာ ပြန်ကြည့်ရအောင်။ ပထမနေ့ ဘောင်ထဲမှာ ခုံ
      နှစ်ခုံပဲ မြင်ရပေမဲ့ cap က လေး ဖြစ်လို့၊ ဘောင်ရဲ့ နောက်မှာ ချဲ့လို့ရတဲ့ ခုံ နှစ်ခုံ ရှိသေးတယ်လို့
      append က မြင်ပါတယ်။ [[mark:draw-write]] ဒါကြောင့် ခုံတန်း အသစ် မယူဘဲ၊ ဘောင်ရဲ့ နောက်က ခုံထဲကို တောင်ငူကို
      တန်းရေးလိုက်ပါတယ်။ ဒါပေမဲ့ အဲဒီ ခုံက trip ရဲ့ index နှစ်၊ နေပြည်တော် ရှိနေတဲ့ ခုံ ဖြစ်နေပါတယ်။
      [[mark:draw-lost]] ဘောင် နှစ်ခုက ခုံတန်း တစ်ခုတည်းကို မျှသုံးနေလို့၊ တစ်ဖက်က ရေးလိုက်တာကို နောက်တစ်ဖက်က
      မြင်ရတာပါ။ Go က ဘာကြောင့် ဒီလို လုပ်ထားလဲ ဆိုတော့၊ ဖြတ်ယူတိုင်း တန်ဖိုးတွေကို copy မကူးရတော့ မြန်ပြီး
      memory လည်း သက်သာလို့ပါ။ ဒါပေမဲ့ ဖြတ်ယူထားတဲ့ slice ကို append လုပ်တဲ့အခါ မူရင်းကို ထိနိုင်တယ်
      ဆိုတာကို အမြဲ သတိထားရပါမယ်။
    sources:
      - { title: "Go Slices: usage and internals", url: "https://go.dev/blog/slices-intro" }
      - {
          title: "The Go Programming Language Specification — Appending to and copying slices",
          url: "https://go.dev/ref/spec#Appending_and_copying_slices",
        }
    actions:
      - {
          id: point-trip,
          type: console.point,
          at: { mark: point-trip },
          target: { text: "[ရန်ကုန် ပဲခူး တောင်ငူ မန္တလေး]" },
        }
      - { id: collapse-2, type: runtime.collapseDock, at: { mark: board-append } }
      - {
          id: board-append,
          type: whiteboard.apply,
          at: { afterAction: collapse-2 },
          open: true,
          upsertIds: [],
        }
      - {
          id: draw-write,
          type: whiteboard.apply,
          at: { mark: draw-write },
          upsertIds: [s-new-box, s-new, s-new-arrow, s-strike],
          drawMs: 2400,
        }
      - {
          id: draw-lost,
          type: whiteboard.apply,
          at: { mark: draw-lost },
          upsertIds: [s-lost],
          drawMs: 1500,
        }

  - id: growth
    chapter: cap ပြည့်ရင်
    narration: >-
      [[mark:board-grow]] ဒါဆို cap ပြည့်နေတဲ့ slice၊ ဆိုလိုတာက ဘောင်ရဲ့ နောက်မှာ ခုံ မကျန်တော့တဲ့ slice ကို
      append လုပ်ရင်ကော ဘာဖြစ်မလဲ။
      [[mark:draw-room]] ဘောင်ရဲ့ နောက်မှာ ခုံ ကျန်သေးရင်၊ append က ရှိပြီးသား ခုံတန်းထဲမှာပဲ ရေးပါတယ်။
      ခုနက မြင်ခဲ့တဲ့ အတိုင်းပါ။ [[mark:draw-full]] ခုံ မကျန်တော့ရင်တော့၊ Go က ပိုကြီးတဲ့ ခုံတန်း
      အသစ် တစ်ခုကို ယူပြီး ရှိပြီးသား တန်ဖိုးတွေကို copy ကူးပါတယ်။ ပြီးမှ တန်ဖိုး အသစ်ကို ထည့်ပြီး၊ ခုံတန်း
      အသစ်ပေါ်က ဘောင်ကို ပြန်ပေးပါတယ်။ အဲဒီအခါ ခုံတန်း ဟောင်းကို မထိတော့ပါဘူး။ [[mark:draw-numbers]]
      ဥပမာ item တစ်ခုမှ မပါတဲ့ slice အလွတ် ထဲကို string တွေ တစ်ခုချင်း append လုပ်သွားရင်၊ အခု Go version မှာ cap က
      နှစ်၊ လေး၊ ရှစ် ဆိုပြီး ကြီးသွားတာကို တွေ့ရပါတယ်။ ဒါပေမဲ့ ဒီ ဂဏန်းတွေက Go ကိုယ်တိုင် ရွေးတာ ဖြစ်ပြီး
      နောက် version တွေမှာ ပြောင်းနိုင်လို့၊ code ထဲမှာ အဲဒီ ဂဏန်းတွေကို အားကိုးပြီး မရေးပါနဲ့။ မှတ်ထားရမှာက၊
      append က ခုံတန်း ဟောင်းထဲ ရေးမလား၊ အသစ် ယူမလား ဆိုတာ cap ပေါ်မှာ မူတည်တယ် ဆိုတာပါပဲ။
    sources:
      - {
          title: "The Go Programming Language Specification — Appending to and copying slices",
          url: "https://go.dev/ref/spec#Appending_and_copying_slices",
        }
      - { title: "Go Slices: usage and internals", url: "https://go.dev/blog/slices-intro" }
    actions:
      - {
          id: board-grow,
          type: whiteboard.apply,
          at: { mark: board-grow },
          open: true,
          clear: true,
          upsertIds: [g-title],
        }
      - {
          id: draw-room,
          type: whiteboard.apply,
          at: { mark: draw-room },
          upsertIds: [g-room-box, g-room],
          drawMs: 1500,
        }
      - {
          id: draw-full,
          type: whiteboard.apply,
          at: { mark: draw-full },
          upsertIds: [g-full-box, g-full],
          drawMs: 1500,
        }
      - {
          id: draw-numbers,
          type: whiteboard.apply,
          at: { mark: draw-numbers },
          upsertIds: [g-nums-box, g-nums, g-note],
          drawMs: 2000,
        }

  - id: clone
    chapter: Clone နဲ့ ကိုယ်ပိုင် copy
    narration: >-
      [[mark:close-grow]] ဒါဆို ပထမနေ့ slice ကို trip နဲ့ ခုံတန်း မမျှဘဲ၊ ကိုယ်ပိုင် ခုံတန်းပေါ်မှာ
      ထားချင်ရင် ဘယ်လို လုပ်မလဲ။ [[mark:type-import]] Go နဲ့ အတူ ပါလာတဲ့ package တွေထဲမှာ slice တွေနဲ့ အလုပ်လုပ်ဖို့
      slices ဆိုတဲ့ package ရှိပါတယ်။ အဲဒါကို import block ထဲမှာ တစ်ကြောင်း ထပ်ထည့်ပါမယ်။
      [[mark:type-clone]] ပြီးတော့ ဖြတ်ယူထားတဲ့ အပိုင်းကို အဲဒီ package ထဲက Clone ဆိုတဲ့ function ထဲ
      ထည့်လိုက်ပါမယ်။ [[mark:sel-clone]] Clone က ပေးလိုက်တဲ့ slice ထဲက တန်ဖိုးတွေကို ခုံတန်း အသစ်
      တစ်ခုပေါ် copy ကူးပြီး၊ အဲဒီ အသစ်ကို ပြန်ပေးပါတယ်။ ဒါကြောင့် ပထမနေ့ slice က trip ရဲ့ ခုံတန်းနဲ့ ဘာမှ
      မဆိုင်တော့ပါဘူး။ ဖြတ်ယူထားတဲ့ အပိုင်းကို သီးသန့် ပြင်မယ်၊ append လုပ်မယ် ဆိုရင် ဒီလို ကိုယ်ပိုင် copy
      ယူထားတာ အန္တရာယ် ကင်းပါတယ်။ [[mark:type-last]] နောက်ဆုံးမှာ append ပြီးတဲ့ နောက် ပထမနေ့ slice ရဲ့ len၊ cap နဲ့
      မြို့တွေကို ထပ်ပြီး print ထုတ်ကြည့်ပါမယ်။ [[mark:run-3]] ကဲ၊ run လိုက်ရအောင်။
    sources:
      - { title: "slices package — Clone", url: "https://pkg.go.dev/slices#Clone" }
    actions:
      - {
          id: close-grow,
          type: whiteboard.apply,
          at: { mark: close-grow },
          open: false,
          upsertIds: [],
        }
      - id: type-import
        type: editor.type
        at: { mark: type-import }
        target: { file: main.go, after: "\t\"fmt\"\n", occurrence: 1 }
        text: "\t\"slices\"\n"
      - id: type-clone
        type: editor.type
        at: { mark: type-clone }
        target: { file: main.go, after: "day1 := ", occurrence: 1 }
        text: "slices.Clone("
      - id: type-clone-end
        type: editor.type
        at: { afterAction: type-clone }
        target: { file: main.go, after: "slices.Clone(trip[:2]", occurrence: 1 }
        text: ")"
      - id: sel-clone
        type: editor.select
        at: { mark: sel-clone }
        target: { file: main.go, text: "slices.Clone(trip[:2])", occurrence: 1 }
      - id: type-last
        type: editor.type
        at: { mark: type-last }
        target: { file: main.go, after: "\tfmt.Println(trip)\n", occurrence: 1 }
        text: "\tfmt.Println(len(day1), cap(day1), day1)\n"
        cadence: line-by-line
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "3 4 [ရန်ကုန် ပဲခူး တောင်ငူ]",
          timeoutMs: 8000,
        }
      - {
          id: expect-file-clone,
          type: expect.file,
          at: { afterAction: run-3 },
          path: main.go,
          contains: "day1 := slices.Clone(trip[:2])",
        }
      - {
          id: expect-file-import,
          type: expect.file,
          at: { afterAction: run-3 },
          path: main.go,
          contains: "\t\"fmt\"\n\t\"slices\"\n",
        }

  - id: own-copy
    narration: >-
      [[mark:point-clone]] ပထမ စာကြောင်းမှာ ဒီ တစ်ခါ နှစ်၊ နှစ် ဖြစ်သွားပါပြီ။ ဒီ တစ်ခါမှာ Clone က မြို့
      နှစ်မြို့စာ ခုံတန်း အသစ်ကို ယူလိုက်လို့ cap ကလည်း နှစ်ပဲ ဖြစ်နေတာပါ။ [[mark:point-intact]] ဒုတိယ
      စာကြောင်းမှာတော့ trip ထဲက နေပြည်တော် မပျောက်တော့ပါဘူး၊ မြို့ လေးမြို့လုံး မူလ အတိုင်းပါ။
      [[mark:point-grown]] နောက်ဆုံး စာကြောင်းမှာ ပထမနေ့ slice က len သုံး၊ cap လေး ဖြစ်ပြီး တောင်ငူ
      ပါလာပါတယ်။ cap နှစ်ပဲ ရှိတဲ့ slice ကို append လုပ်တော့ ဘောင်ရဲ့ နောက်မှာ ခုံ မကျန်လို့၊ Go က ပိုကြီးတဲ့ ခုံတန်း
      အသစ်ကို ယူလိုက်တာပါ။ ဒီ cap လေး ဆိုတဲ့ ဂဏန်းကလည်း Go ရွေးတာပါ။ အရေးကြီးတာက trip ကို လုံးဝ
      မထိတော့ဘူး ဆိုတာပါ။
    sources:
      - { title: "slices package — Clone", url: "https://pkg.go.dev/slices#Clone" }
      - {
          title: "The Go Programming Language Specification — Appending to and copying slices",
          url: "https://go.dev/ref/spec#Appending_and_copying_slices",
        }
    actions:
      - {
          id: point-clone,
          type: console.point,
          at: { mark: point-clone },
          target: { text: "2 2 [ရန်ကုန် ပဲခူး]" },
        }
      - {
          id: point-intact,
          type: console.point,
          at: { mark: point-intact },
          target: { text: "[ရန်ကုန် ပဲခူး နေပြည်တော် မန္တလေး]" },
        }
      - {
          id: point-grown,
          type: console.point,
          at: { mark: point-grown },
          target: { text: "3 4 [ရန်ကုန် ပဲခူး တောင်ငူ]" },
        }

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >-
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ board ပေါ်က program မှာ ကီလိုမီတာ သုံးခု ပါတဲ့ slice
      ကနေ ရှေ့ဆုံး တစ်ခုကိုပဲ ဖြတ်ယူထားပါတယ်။ [[mark:quiz-line]] ပြီးတော့ ဖြတ်ယူထားတဲ့ slice ရဲ့ index
      သုညကို သုံးရာ လို့ ပြောင်းလိုက်ပါတယ်။ ဒါဆို မူရင်း slice ရဲ့ ပထမ တန်ဖိုးက သုံးရာ့နှစ်ဆယ် ဆက်ဖြစ်နေမလား၊
      သုံးရာ ဖြစ်သွားမလား။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] အဖြေကတော့ ခ၊
      သုံးရာ ဖြစ်သွားပါတယ်။ ဘာကြောင့်လဲဆိုတော့ ဖြတ်ယူထားတဲ့ slice က ဘောင် တစ်ခုပဲ ဖြစ်ပြီး၊ မူရင်း slice
      နဲ့ ခုံတန်း တစ်ခုတည်းကို မျှသုံးနေလို့ပါ။ append မဟုတ်ဘဲ index နဲ့ တိုက်ရိုက် ပြင်တာလည်း မူရင်းကို
      ပြင်တာပါပဲ။
    sources:
      - {
          title: "The Go Programming Language Specification — Slice expressions",
          url: "https://go.dev/ref/spec#Slice_expressions",
        }
    actions:
      - { id: collapse-3, type: runtime.collapseDock, at: { mark: quiz } }
      - {
          id: quiz,
          type: whiteboard.apply,
          at: { afterAction: collapse-3 },
          open: true,
          clear: true,
          upsertIds: [q-title, q-code, q-l1, q-l2, q-l3, q-l4, q-a, q-b],
        }
      - {
          id: quiz-line,
          type: whiteboard.apply,
          at: { mark: quiz-line },
          upsertIds: [q-mark],
          drawMs: 900,
        }
      - {
          id: quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-check],
          drawMs: 700,
        }

  - id: recap
    chapter: ပြန်ချုပ်ရရင်
    narration: >-
      [[mark:close-quiz]] ဒါဆို ပြန်ချုပ်ရရင်၊ slice ကို ဖြတ်ယူလိုက်ရင် copy မရပါဘူး၊ ခုံတန်း
      တစ်ခုတည်းပေါ်က ဘောင် အသစ် တစ်ခုပဲ ရပါတယ်။ [[mark:recap-cut]] len က ဘောင်ထဲမှာ မြင်ရတဲ့ အရေအတွက်ဖြစ်ပြီး၊ cap
      က ခုံတန်း မပြောင်းဘဲ ကြီးနိုင်တဲ့ အထိပါ။ [[mark:recap-append]] cap ထဲမှာ နေရာ ကျန်သေးရင် append က
      မျှသုံးနေတဲ့ ခုံတန်းထဲ ရေးလို့ မူရင်းကို ပြင်မိနိုင်ပါတယ်။ [[mark:recap-clone]] ကိုယ်ပိုင် copy
      လိုချင်ရင်တော့ Clone ကို သုံးပါ။ နောက် lesson မှာတော့ index နံပါတ်နဲ့ မဟုတ်ဘဲ နာမည် တစ်ခုနဲ့
      တန်ဖိုးကို ရှာတဲ့ map ကို လေ့လာသွားပါမယ်။
    sources:
      - { title: "Go Slices: usage and internals", url: "https://go.dev/blog/slices-intro" }
    actions:
      - {
          id: close-quiz,
          type: whiteboard.apply,
          at: { mark: close-quiz },
          open: false,
          upsertIds: [],
        }
      - id: recap-cut
        type: editor.select
        at: { mark: recap-cut }
        target: { file: main.go, text: "trip[:2]", occurrence: 1 }
      - id: recap-append
        type: editor.select
        at: { mark: recap-append }
        target: { file: main.go, text: 'append(day1, "တောင်ငူ")', occurrence: 1 }
      - id: recap-clone
        type: editor.select
        at: { mark: recap-clone }
        target: { file: main.go, text: "slices.Clone", occurrence: 1 }

checks:
  - { type: timing.p95Ms, max: 300 }
