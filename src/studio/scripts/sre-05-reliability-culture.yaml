build:
  # Studio swaps in the Burmese voice chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 2605

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: hook
    chapter: သတင်းဆိုး ယူလာသူ
    narration: >
      [[mark:show-p01]] အခုထိ Padauk က ပြဿနာ ဖြစ်တိုင်း config check၊ alert၊ template လို tool တွေနဲ့ ဖြေရှင်းခဲ့ပြီး၊ မသီရိကတော့ reliability ကို အပိုတာဝန်အဖြစ်ပဲ ကြည့်ပေးနေရတုန်းပါ။ ဒီနေ့ ပြဿနာကတော့ system ထဲမှာ မဟုတ်ဘဲ လူတွေကြားမှာ ဖြစ်ပါတယ်။
      ည ၉ နာရီ၊ top-up promo မစခင်မှာ အလုပ်ဝင်တာ မကြာသေးတဲ့ developer ကိုမင်းက SMS code ပို့ပေးတဲ့ provider တဖြည်းဖြည်း နှေးလာတာကို dashboard မှာ သတိထားမိပါတယ်။ [[mark:show-p01b]] team chat ထဲမှာ စာရိုက်ပြီးပေမဲ့ ပို့ဖို့ ချီတုံချတုံ ဖြစ်နေပါတယ်၊ ပြီးခဲ့တဲ့လက သူ မေးခွန်း တစ်ခု မေးတော့ တစ်ယောက်က ရယ်ခဲ့လို့ပါ။ ကိုမင်း ပြောရဲပါ့မလား?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "re:Work: Understand team effectiveness",
          url: "https://rework.withgoogle.com/intl/en/guides/understand-team-effectiveness",
        }
    actions:
      # -1750 / -1450, not the skeleton's -1900 / -1600: a pull-back over 1780 ms pushes the
      # first dialog past the 2 s opening handle, which src/studio/plans/index.test.ts rejects.
      - { id: collapse-dock, type: runtime.collapseDock, at: { scene: start, offsetMs: -1750 } }
      - {
          id: show-p01,
          type: slide.show,
          at: { mark: show-p01, offsetMs: -1450 },
          slideId: l05-p01,
        }
      # Pacing: the cover's last two lines (the laugh, the question) land as they are said.
      - { id: show-p01b, type: slide.show, at: { mark: show-p01b }, slideId: l05-p01b }

  - id: westrum
    narration: >
      [[mark:show-p02]] ကိုမင်း ပြောရဲမလား ဆိုတာက သူ့ သတ္တိထက်၊ အရင်က မေးခွန်း မေးခဲ့တဲ့သူတွေ ဘာဖြစ်ခဲ့လဲ ဆိုတာပေါ်မှာ ပိုမူတည်ပါတယ်။ လူမှုဗေဒ ပညာရှင် Ron Westrum က သတင်းဆိုး ယူလာတဲ့သူကို ဘယ်လို ဆက်ဆံလဲ ဆိုတာနဲ့ အဖွဲ့အစည်း ယဉ်ကျေးမှုကို သုံးမျိုး ခွဲပြခဲ့ပါတယ်။
      ပထမ pathological အဖွဲ့မှာ အာဏာကို ဦးစားပေးလို့ သတင်းဆိုး ယူလာသူကို နှုတ်ပိတ်ခိုင်းပါတယ်။ [[mark:show-p02b]] ဒုတိယ bureaucratic အဖွဲ့မှာ စည်းမျဉ်းကို ဦးစားပေးလို့ သတင်းက တန်းစီပြီး အလှည့်စောင့်ရပါတယ်။ တတိယ generative အဖွဲ့မှာတော့ ရလဒ်ကို ဦးစားပေးလို့ သတင်းဆိုး ယူလာသူကို ကျေးဇူးတင်ပြီး ချက်ချင်း ဖြေရှင်းပါတယ်။
      software delivery ကို နှစ်စဉ် လေ့လာတဲ့ DORA သုတေသနကလည်း အဖွဲ့တစ်ခု generative ဘက် ရောက်လေ software ကို ပိုမြန်မြန်၊ ပိုစိတ်ချရအောင် ထုတ်နိုင်လေ ဖြစ်တာကို တွေ့ထားပါတယ်။ မသီရိက ကိုနေလင်းကို ပြတဲ့ အထောက်အထားလည်း ဒါပါပဲ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Westrum, A typology of organisational cultures (BMJ Qual Saf, PMC)",
          url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC1765804/",
        }
      - {
          title: "DORA capability: Generative organizational culture",
          url: "https://dora.dev/capabilities/generative-organizational-culture/",
        }
    actions:
      - { id: show-p02, type: slide.show, at: { mark: show-p02 }, slideId: l05-p02 }
      # Pacing: the other two cards join as the narration names the second type.
      - { id: show-p02b, type: slide.show, at: { mark: show-p02b }, slideId: l05-p02b }

  - id: padauk-night
    narration: >
      [[mark:close-p02b]] [[mark:b1-s1]] ဒါဆို Padauk ရဲ့ အဲဒီညကို ဒီ သုံးမျိုးထဲမှာ ထားကြည့်ရအောင်။ ကိုမင်း မြင်ခဲ့ပေမဲ့ တိတ်တိတ်ပဲ နေခဲ့လို့ promo အတွင်း SMS code တွေ ၄ မိနစ် နောက်ကျပြီးမှ ရောက်ခဲ့ပါတယ်။ ဒါ ကိုမင်းရဲ့ အမှား မဟုတ်ပါဘူး။ မြင်တဲ့သူ ရှိရက်နဲ့ ပြောလို့ မရတဲ့ အဖွဲ့ ဖြစ်နေလို့ အဲဒီညက Padauk ဟာ pathological ဘက်နားမှာ ရှိနေခဲ့တာပါ။
      [[mark:b1-s2]] နောက်မှ ပြောပြမယ့် review ပြီးလို့ အပတ်အနည်းငယ် ကြာတော့ SMS တွေ ထပ်နှေးလာပြီး၊ ဒီတစ်ခါ ကိုမင်းက team chat ထဲမှာ ချက်ချင်း post တင်လိုက်ပါတယ်။ မသီရိက အားလုံး မြင်အောင် ကျေးဇူးတင်ပြီး ဒုတိယ SMS provider ကို ဖွင့်လိုက်တော့ user တွေ ဘာမှ မသိလိုက်ပါဘူး။ ကျေးဇူးတင်စကား တစ်ခွန်းကို ထပ်ခါထပ်ခါ ပြောရင်း Padauk က generative ဘက်ကို ရွေ့လာတာပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Westrum, A typology of organisational cultures (BMJ Qual Saf, PMC)",
          url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC1765804/",
        }
      - {
          title: "DORA capability: Generative organizational culture",
          url: "https://dora.dev/capabilities/generative-organizational-culture/",
        }
    actions:
      - { id: close-p02b, type: slide.close, at: { mark: close-p02b, offsetMs: -400 } }
      - {
          id: b1-s1,
          type: whiteboard.apply,
          at: { mark: b1-s1 },
          open: true,
          clear: true,
          upsertIds: [l05-b1-lane1],
        }
      - id: b1-s1-draw
        type: whiteboard.apply
        at: { afterAction: b1-s1 }
        upsertIds:
          [
            l05-b1-r1,
            l05-b1-t1,
            l05-b1-a1,
            l05-b1-r2,
            l05-b1-t2,
            l05-b1-x2,
            l05-b1-a2,
            l05-b1-r3,
            l05-b1-t3,
          ]
        drawMs: 2600
      - { id: b1-s2, type: whiteboard.apply, at: { mark: b1-s2 }, upsertIds: [l05-b1-lane2] }
      - id: b1-s2-draw
        type: whiteboard.apply
        at: { afterAction: b1-s2 }
        upsertIds:
          [
            l05-b1-r4,
            l05-b1-t4,
            l05-b1-a3,
            l05-b1-r5,
            l05-b1-t5,
            l05-b1-a4,
            l05-b1-r6,
            l05-b1-t6,
            l05-b1-t6b,
          ]
        drawMs: 2600

  - id: culture-does
    narration: >
      [[mark:close-b1]] [[mark:show-p03]] reliability ကို တန်ဖိုးထားတဲ့ ယဉ်ကျေးမှုမှာ နေ့စဉ် အလေ့အထ သုံးခု ရှိပါတယ်။ ရာထူးကြီးသူ ထင်တာထက် data နဲ့ user ရဲ့ အမြင်ကို ကြည့်ပြီး ဆုံးဖြတ်တယ်၊ သိတာကို ကိုယ့်အဖွဲ့ထဲမှာပဲ မသိမ်းဘဲ တခြား အဖွဲ့တွေကို မျှပေးတယ်၊ တစ်ခုခု ပျက်ရင်လည်း အပြစ်ရှာစရာ မဟုတ်ဘဲ သင်ယူစရာ အဖြစ် ကြည့်ပါတယ်။
      [[mark:show-p03b]] ဒီ အလေ့အထတွေက အခြေခံ နှစ်ခုပေါ်မှာ ရပ်တည်ပါတယ်။ ပထမက ဘယ်လောက် စိတ်ချရရင် လုံလောက်လဲ ဆိုတာကို user တွေက ဆုံးဖြတ်တာပါ။ ဒုတိယက reliability အလုပ်ကိုလည်း feature အသစ်လိုပဲ ချီးကျူးပြီး ရာထူးတိုးတဲ့အခါ ထည့်တွက်တာပါ။ ဥပမာ နောက် သုံးလပတ် ဆုပေးပွဲမှာ Top-up ရဲ့ SMS provider အရန် အလုပ်ကို rewards screen အသစ်နဲ့ ဘေးချင်းယှဉ်ပြီး ချီးကျူးခဲ့ပါတယ်။
      [[mark:show-p03c]] ဘယ် tool တွေ သုံးလဲ ဆိုတာကလည်း အလေ့အထကို ပြောင်းစေပါတယ်။ ဥပမာ ဘယ်သူမှ မကြည့်တဲ့ tool ငါးခုထက် အဖွဲ့တိုင်း အတူ ကြည့်တဲ့ dashboard တစ်ခုက ပိုအသုံးဝင်ပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "DORA capability: Generative organizational culture",
          url: "https://dora.dev/capabilities/generative-organizational-culture/",
        }
      - {
          title: "DORA capability: Learning culture",
          url: "https://dora.dev/capabilities/learning-culture/",
        }
    actions:
      - {
          id: close-b1,
          type: whiteboard.apply,
          at: { mark: close-b1, offsetMs: -400 },
          open: false,
        }
      - { id: show-p03, type: slide.show, at: { mark: show-p03 }, slideId: l05-p03 }
      # Pacing: the two foundations, then the tools card.
      - { id: show-p03b, type: slide.show, at: { mark: show-p03b }, slideId: l05-p03b }
      - { id: show-p03c, type: slide.show, at: { mark: show-p03c }, slideId: l05-p03c }

  - id: hero-loop
    chapter: ညဘက် hero
    narration: >
      [[mark:close-p03c]] [[mark:b2-s1]] Padauk ရဲ့ နောက်ပြဿနာက merchant တွေဆီ ငွေလွှဲတဲ့ settlement job ကြားမှာ ရပ်သွားရင် ပြန် run တတ်တာ ကိုအောင် တစ်ယောက်တည်း ဖြစ်နေတာပါ။ job ရပ်တာက merchant တွေကို ထိခိုက်နေလို့ ချက်ချင်း ဖြေရှင်းရမယ့် ပြဿနာ၊ incident ပါ။ incident ဖြစ်တိုင်း ကိုအောင်က ညဘက် ထပြင်ပေးတော့ အားလုံးက hero လို့ ချီးကျူးကြပါတယ်။
      [[mark:b2-s1b]] ဒါပေမဲ့ ဘယ်လို ပြင်လဲ ဘယ်မှာမှ ရေးမထားလို့ ထပ်ဖြစ်တိုင်း သူ့ကိုပဲ ပြန်နှိုးရပါတယ်။ ဒီလို လူ တစ်ယောက်ရဲ့ ညဘက် ကြိုးစားမှုကို အားကိုးပြီး system ကို ရပ်တည်အောင် ထားတာကို hero antipattern လို့ ခေါ်ပါတယ်။ သင်္ကြန်မှာ ကိုအောင် ဇာတိ ပြန်သွားတုန်း job ရပ်သွားတော့ merchant တွေ ငွေရတာ တစ်ရက် နောက်ကျသွားပါတယ်။
      [[mark:b2-s2]] ဒီတစ်ခါတော့ မသီရိက blameless review တစ်ခုကို ဦးဆောင်ပြီး ကိုနေလင်းကိုလည်း ဖိတ်ပါတယ်။ blameless ဆိုတာ lesson ၂ က postmortem လိုပဲ ဘယ်သူ့ အပြစ်လဲလို့ လူကို မရှာဘဲ system နဲ့ လုပ်ငန်းစဉ်ထဲက အားနည်းချက်ကို ရှာတာပါ။ [[mark:b2-s2b]] review ကနေ အဆင့်လိုက် ရေးထားတဲ့ runbook ထွက်လာပြီး၊ ပြဿနာ တက်ရင် တုံ့ပြန်ရမယ့် on-call တာဝန်ကိုလည်း အလှည့်ကျ ခွဲယူလိုက်တော့ လူတိုင်း ပြင်တတ်လာပြီး incident တွေလည်း နည်းလာပါတယ်။
      [[mark:b2-s3]] ဒါပေမဲ့ ညဘက် ကယ်တင်တာကိုပဲ ဆက်ချီးကျူးနေရင်၊ အိပ်ရေးပျက်ပြီး အချိန်ပို လုပ်တာက တကယ့် အလုပ်ပဲလို့ အဖွဲ့တစ်ခုလုံး သင်ယူသွားပြီး၊ hero ကိုယ်တိုင်လည်း burnout ဖြစ်တတ်ပါတယ်။
