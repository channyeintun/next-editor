      notes.md: |
        # Reliability ယဉ်ကျေးမှု

        - blameless — "ဘယ်သူလဲ" မဟုတ်ဘဲ "ဘာက ဖြစ်စေခဲ့လဲ"၊ owner နဲ့ ရက်စွဲ ပါရမယ်
        - local rationality — အဲဒီအချိန်က သူ့အတွက် အဓိပ္ပာယ် ရှိခဲ့တယ်
        - psychological safety — မေးရဲ၊ ပြောရဲ၊ ဝန်ခံရဲ
        - hero antipattern — လူ တစ်ယောက်ရဲ့ ညဘက် ကြိုးစားမှုကို အားကိုးတာ
        - Westrum — သတင်းဆိုး ယူလာသူ: နှုတ်ပိတ် · တန်းစီ · ကျေးဇူးတင်

        မေးခွန်း: "config အမှားကို ဘယ်သူ push လုပ်ခဲ့တာလဲ?" ဆိုတဲ့ review မေးခွန်းကို ပြန်ရေးပါ။
