  - id: two-questions
    chapter: Blameless review
    narration: >
      [[mark:close-b2]] [[mark:show-p04]] review မှာ ကိုအောင် အရင် ညတစ်ညက မနက် ၂ နာရီမှာ check တစ်ခုကို ကျော်ခဲ့တာ ပေါ်လာပါတယ်။ အရင်ဆိုရင် ဘာလို့ ကျော်တာလဲလို့ မေးမှာပါ။ မသီရိကတော့ screen မှာ ဘာပြနေလဲလို့ မေးပါတယ်၊ အဖြေက check က အရမ်းကြာပြီး screen ကလည်း ပြီးပြီလို့ ပြနေတာပါ။ ဘယ်သူ ခွင့်ပြုခဲ့လဲလို့ မမေးဘဲ၊ job ကို ပြန် run ဖို့ ဘာလို့ လမ်း တစ်ခုတည်းပဲ ရှိနေရတာလဲလို့လည်း မေးပါတယ်။
      [[mark:show-p04b]] ဒီလို မေးတာက local rationality ဆိုတဲ့ အမြင်ကြောင့်ပါ။ လူတစ်ယောက် လုပ်ခဲ့တာက အဲဒီအချိန်၊ အဲဒီ အချက်အလက်နဲ့ဆိုရင် သူ့အတွက် အဓိပ္ပာယ် ရှိခဲ့တယ်လို့ မြင်တာပါ။ ကိုအောင်အတွက် အဓိပ္ပာယ် ရှိခဲ့ရင် နောက်လူအတွက်လည်း ရှိမှာမို့ ပြင်ရမှာက လူ မဟုတ်ဘဲ screen ပါ။
      [[mark:show-p04c]] ဒါပေမဲ့ blameless ဆိုတာ ဘယ်သူမှ တာဝန်မရှိဘူးလို့ မဆိုလိုပါဘူး။ review က owner နဲ့ ရက်စွဲ ပါတဲ့ လုပ်စရာတွေနဲ့ ပြီးရပါတယ်၊ ဥပမာ runbook ကို ကိုအောင်နဲ့ မသီရိ နောက်တစ်ပတ်အတွင်း ရေးမယ် ဆိုတာမျိုးပါ။ အပြစ်မပေးပေမဲ့ တာဝန်ယူမှုကို ထိန်းထားတဲ့ ဒီ ယဉ်ကျေးမှုကို just culture လို့ ခေါ်ပါတယ်။
      [[mark:show-p04d]] တခြားသူ မှားရင် ပေါ့ဆလို့၊ ကိုယ်မှားရင် tool ကြောင့်လို့ ထင်တတ်တာ လူ့သဘာဝပါ။ ဒါကြောင့် CTO ကိုနေလင်းကိုယ်တိုင် ဝင်ထိုင်ပြီး ဘယ်သူလဲ မမေးဘဲ ဘာက ဖြစ်စေခဲ့လဲလို့ မေးတာကို မြင်ရတော့မှ ဒီ အလေ့အထ စွဲသွားတာပါ။ အစပိုင်းမှာ ဖုံးထားခဲ့တဲ့ ပြဿနာတွေ ပေါ်လာလို့ ပိုဆိုးလာသလို ထင်ရနိုင်ပေမဲ့ ဒါက ကောင်းတဲ့ လက္ခဏာပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book, 1st ed: Postmortem Culture",
          url: "https://sre.google/sre-book/postmortem-culture/",
        }
      - {
          title: "DORA capability: Learning culture",
          url: "https://dora.dev/capabilities/learning-culture/",
        }
    actions:
      - {
          id: close-b2,
          type: whiteboard.apply,
          at: { mark: close-b2, offsetMs: -400 },
          open: false,
        }
      - { id: show-p04, type: slide.show, at: { mark: show-p04 }, slideId: l05-p04 }
      # Pacing: local rationality, just culture, then the "who / what" row.
      - { id: show-p04b, type: slide.show, at: { mark: show-p04b }, slideId: l05-p04b }
      - { id: show-p04c, type: slide.show, at: { mark: show-p04c }, slideId: l05-p04c }
      - { id: show-p04d, type: slide.show, at: { mark: show-p04d }, slideId: l05-p04d }

  - id: safe-to-speak
    chapter: ပြောရဲတဲ့ အဖွဲ့
    narration: >
      [[mark:show-p05]] review အဆုံးမှာ ကိုနေလင်းက settlement job က လူ တစ်ယောက်တည်းအပေါ် မှီနေတာကို မသိခဲ့ဘူးလို့ ဝန်ခံပါတယ်။ ခေါင်းဆောင်က မသိတာကို ဖွင့်ပြောတော့ ကိုမင်းလို လူသစ်တွေလည်း မေးခွန်း မေးရင် ရယ်မှာ မဟုတ်ဘဲ ကျေးဇူးတင်မယ်၊ risk မြင်ရင် ဘယ်သူမဆို ပြောလို့ရတယ်လို့ ယုံလာကြပါတယ်။
      [[mark:show-p05b]] မေးခွန်း မေးတာ၊ စိုးရိမ်တာ ပြောတာ၊ အမှား ဝန်ခံတာတွေကြောင့် အပြစ်ပေးခံရမှာ၊ အရှက်ခွဲခံရမှာ မကြောက်ဘဲ ပြောရဲတဲ့ ယုံကြည်မှုကို psychological safety လို့ ခေါ်ပါတယ်။ ဒါက ယဉ်ယဉ်ကျေးကျေး နေဖို့ မဟုတ်ဘဲ ပြောရခက်တဲ့ စကားတွေကို ပြောလို့ရအောင် လုပ်ပေးတာပါ။ ဒီ ယုံကြည်မှုကို manager နဲ့ ခေါင်းဆောင်တွေက ဖန်တီးပေးရပါတယ်။
      [[mark:show-p05c]] ပြောခွင့်နဲ့အတူ လုပ်ခွင့်လည်း လိုပါတယ်။ ဥပမာ လက်နဲ့ ထပ်ခါထပ်ခါ လုပ်ရတဲ့ toil များလွန်းရင် feature အသစ်တွေ ခဏ ရပ်မယ် ဆိုတာကို မသီရိက product manager မနှင်းနဲ့ ကြိုသဘောတူထားနိုင်ပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "re:Work: Understand team effectiveness",
          url: "https://rework.withgoogle.com/intl/en/guides/understand-team-effectiveness",
        }
    actions:
      - { id: show-p05, type: slide.show, at: { mark: show-p05 }, slideId: l05-p05 }
      # Pacing: psychological safety itself, then the room to act.
      - { id: show-p05b, type: slide.show, at: { mark: show-p05b }, slideId: l05-p05b }
      - { id: show-p05c, type: slide.show, at: { mark: show-p05c }, slideId: l05-p05c }

  - id: behavior-first
    chapter: အလေ့အထကနေ စပါ
    narration: >
      [[mark:close-p05c]] [[mark:b3-s1]] ယဉ်ကျေးမှုကို ဘယ်လို ပြောင်းမလဲ? Padauk ကတော့ ယဉ်ကျေးမှု အရင် ပြောင်းဖို့ မစောင့်ဘဲ၊ memo လည်း မထုတ်၊ အမိန့်လည်း မပေးဘဲ incident တိုင်း ပြီးရင် မိနစ် ၃၀ ကြာ blameless review လုပ်တဲ့ အလေ့အထ သေးသေးလေး တစ်ခုကို စမ်းလုပ်ကြည့်ပါတယ်။ [[mark:b3-s1b]] ပထမ တစ်ခါမှာတင် runbook ရလာလို့ အသုံးဝင်တာကို အားလုံး မြင်ကြပါတယ်။
      [[mark:b3-s2]] အသုံးဝင်တော့ ထပ်လုပ်ကြရင်း အလေ့အထ ဖြစ်လာပြီး၊ ကြာတော့ အဲဒီ အလေ့အထကပဲ ယဉ်ကျေးမှု ဖြစ်သွားပါတယ်။ ဒါပေမဲ့ ops အဖွဲ့ကို Site Reliability Engineering၊ SRE လို့ နာမည်ပဲ ပြောင်းပေးပြီး ညဘက် ကယ်တင်တာကိုပဲ ဆက်ချီးကျူးနေရင်တော့ ဘာမှ မပြောင်းတဲ့အပြင် SRE ဆိုတဲ့ နာမည်ကိုပါ လူတွေ မယုံတော့ပါဘူး။
      [[mark:b3-s3]] အလုပ်ဖြစ်လား သိချင်ရင် review တစ်ခု ဦးဆောင်တာလို တကယ့် အလုပ် တစ်ခုကို ကိုယ်တိုင် လုပ်နိုင်မယ်လို့ ဘယ်လောက် ယုံကြည်လဲ အဖွဲ့ကို မေးကြည့်ပါ။ မလုပ်ရဲသေးဘူး၊ တစ်ယောက်ယောက် ဘေးမှာ ရှိရင် လုပ်နိုင်တယ်၊ ကိုယ့်ဘာသာ လုပ်နိုင်တယ် ဆိုတဲ့ အဖြေ သုံးမျိုးထဲက ရွေးခိုင်းပြီး၊ အလေ့အထ မစခင် တစ်ခါ၊ လအနည်းငယ် ကြာတော့ တစ်ခါ မေးပြီး နှိုင်းယှဉ်ကြည့်ပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "DORA capability: Learning culture",
