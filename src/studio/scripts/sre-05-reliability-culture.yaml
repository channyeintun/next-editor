# SRE from zero, lesson 5: Reliability culture (Burmese concept lesson).
#
# Built from the approved voice script
# docs/sre-course/voice-scripts/sre-05-reliability-culture.md. Every spoken
# character is that script's "> " lines, unchanged; each ⟪…⟫ marker became a
# [[mark:…]] at the same place. Check it with:
#   bun ~/Documents/sre-course/work/check-narration.ts \
#     docs/sre-course/voice-scripts/sre-05-reliability-culture.md \
#     src/studio/scripts/sre-05-reliability-culture.yaml
#
# Nothing runs: deck pages and the whiteboard carry the lesson, and notes.md is
# the recap. The workspace and runtime follow the validated no-code skeleton
# (WebContainer, empty init command, a harmless dev script).
#
# Pacing (something changes on screen at least every ~35 s at 70 ms/char):
# extra marks sit at existing sentence ends and drive continuation pages
# (l05_p01b, l05_p03b, …, same kit as the page they continue) or split board
# steps. B2 step 1 and step 2 are each split in two so no step adds more than
# three labelled boxes; B3 gains a third step (the three-answer confidence
# check) because its last stretch held for ~43 s. The cover's four lines are
# spread over l05_p01 and l05_p01b, since the K1 kit holds three.
#
# Boards (P6 lanes, P4 unrolled rows, P7 staircase). Colour jobs: #1e1e1e ink
# (paints white) for titles and arrows, blue the person or thing named, green
# healthy/done, red failure, orange the caveat, violet the result. A label on
# two lines is two text assets, one per line: the overflow rule counts a whole
# text's length, so one "\n" label would need the width of both lines.
#
# Deck pages: deck "Next Editor · SRE 1 · Why SRE". The /pub URL below is a
# placeholder until Chan publishes the deck; the Director's unreachable-deck
# warning is expected until then. Page plan:
# ~/Documents/sre-course/work/pages/sre-05-reliability-culture.json
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/sre-05-reliability-culture.yaml
#   bun scripts/studio-compile-check.ts src/studio/scripts/sre-05-reliability-culture.yaml
