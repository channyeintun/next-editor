  - id: this-week
    narration: >
      [[mark:close-b3]] [[mark:show-p06]] ယဉ်ကျေးမှုကို သေးသေးလေးကနေ စလို့ရပါတယ်၊ ဒီအပတ် လုပ်ကြည့်ဖို့ သုံးခုပါ။ နောက်တစ်ခါ သတင်းဆိုး ယူလာတဲ့သူကို အားလုံး ကြားအောင် ကျေးဇူးတင်ပါ။ ဘယ်သူလဲလို့ မေးတဲ့ review မေးခွန်း တစ်ခုကို ဘာက ဖြစ်စေခဲ့လဲ ဆိုတဲ့ မေးခွန်းအဖြစ် ပြန်ရေးကြည့်ပါ။ ပြီးတော့ လူ တစ်ယောက်တည်းပဲ သိတဲ့ အလုပ် တစ်ခုကို ရှာပြီး စာနဲ့ ချရေးပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "DORA capability: Generative organizational culture",
          url: "https://dora.dev/capabilities/generative-organizational-culture/",
        }
      - {
          title: "SRE book, 1st ed: Postmortem Culture",
          url: "https://sre.google/sre-book/postmortem-culture/",
        }
    actions:
      - {
          id: close-b3,
          type: whiteboard.apply,
          at: { mark: close-b3, offsetMs: -400 },
          open: false,
        }
      - { id: show-p06, type: slide.show, at: { mark: show-p06 }, slideId: l05-p06 }

  - id: recap
    narration: >
      [[mark:close-p06]] [[mark:open-notes]] ပြန်နွှေးကြည့်ရအောင်။ [[mark:sel-blameless]] blameless review က ဘယ်သူ့ အပြစ်လဲ မမေးဘဲ ဘာက ဖြစ်စေခဲ့လဲလို့ မေးပေမဲ့ owner နဲ့ ရက်စွဲ ပါတဲ့ လုပ်စရာတွေနဲ့ ပြီးရပါတယ်။ [[mark:sel-local]] local rationality က အဲဒီအချိန်က သူ လုပ်ခဲ့တာ သူ့အတွက် အဓိပ္ပာယ် ရှိခဲ့တယ်လို့ မြင်တာပါ။
      [[mark:sel-psych]] psychological safety က အပြစ်ပေးခံရမှာ မကြောက်ဘဲ မေးရဲ၊ ပြောရဲ၊ ဝန်ခံရဲတဲ့ ယုံကြည်မှုပါ။ [[mark:sel-hero]] hero antipattern က လူ တစ်ယောက်ရဲ့ ညဘက် ကြိုးစားမှုကို အားကိုးနေတာပါ။ [[mark:sel-westrum]] Westrum ရဲ့ သုံးမျိုးကတော့ သတင်းဆိုး ယူလာသူကို နှုတ်ပိတ်လား၊ တန်းစီ စောင့်ခိုင်းလား၊ ကျေးဇူးတင်လား ဆိုတာနဲ့ ခွဲတာပါ။
      နောက်ဆုံး မေးခွန်း တစ်ခုပါ။ review တစ်ခုမှာ တစ်ယောက်က config အမှားကို ဘယ်သူ push လုပ်ခဲ့တာလဲလို့ မေးလိုက်ရင်၊ [[mark:ask-question]] ဒီ မေးခွန်းကို blameless ဖြစ်အောင် ဘယ်လို ပြန်ရေးမလဲ?
      [[mark:pause-question]] ဥပမာ အဲဒီ config ကို push လုပ်တာ ဘေးကင်းတယ်လို့ ဘာကြောင့် ထင်ရခဲ့လဲလို့ ပြန်ရေးနိုင်ပါတယ်။ review ပြီးတော့ ကိုနေလင်းက မသီရိကို အချိန်ပြည့် SRE အဖြစ် ခန့်လိုက်ပါတယ်။ ပထမဆုံး တာဝန်က Top-up ပါ၊ finance အဖွဲ့က အဲဒါကို ၁၀၀ ရာခိုင်နှုန်း စိတ်ချရစေချင်နေပါတယ်။ Top-up က တကယ်တော့ ဘယ်လောက် စိတ်ချရဖို့ လိုလဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book, 1st ed: Postmortem Culture",
          url: "https://sre.google/sre-book/postmortem-culture/",
        }
      - {
          title: "re:Work: Understand team effectiveness",
          url: "https://rework.withgoogle.com/intl/en/guides/understand-team-effectiveness",
        }
    actions:
      - { id: close-p06, type: slide.close, at: { mark: close-p06 } }
      - {
          id: open-notes,
          type: workspace.openFile,
          at: { mark: open-notes, offsetMs: 300 },
          path: notes.md,
        }
      - {
          id: sel-blameless,
          type: editor.select,
          at: { mark: sel-blameless },
          target: { file: notes.md, text: "blameless", occurrence: 1 },
        }
      - {
          id: sel-local,
          type: editor.select,
          at: { mark: sel-local },
          target: { file: notes.md, text: "local rationality", occurrence: 1 },
        }
      - {
          id: sel-psych,
          type: editor.select,
          at: { mark: sel-psych },
          target: { file: notes.md, text: "psychological safety", occurrence: 1 },
        }
      - {
          id: sel-hero,
          type: editor.select,
          at: { mark: sel-hero },
          target: { file: notes.md, text: "hero antipattern", occurrence: 1 },
        }
      - {
          id: sel-westrum,
          type: editor.select,
          at: { mark: sel-westrum },
          target: { file: notes.md, text: "Westrum", occurrence: 1 },
        }
      # The voice script's ⟪pause 3s⟫. A select anchored at pause-question would
      # drag under the answer's first words (the scheduler holds only the dialog
      # after its anchor's), so it hangs off ask-question, the question's last
      # clause: it starts about as the question ends, its ~1.2 s drag runs in
      # silence, and the answer at pause-question waits for it. That gives a
      # ~1.9 s pause at 70 ms/char (2.7 s at 55, 0.6 s at 95). An offset above
      # ~4680 trips compile-check's 2.5 s inserted-silence warning at 55 ms/char.
      - id: select-question
        type: editor.select
        at: { mark: ask-question, offsetMs: 4550 }
        target:
          file: notes.md
          text: 'မေးခွန်း: "config အမှားကို ဘယ်သူ push လုပ်ခဲ့တာလဲ?" ဆိုတဲ့ review မေးခွန်းကို ပြန်ရေးပါ။'
          occurrence: 1

checks:
