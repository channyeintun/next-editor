        path: notebook/50-champion-plan.md
        contains: "- [ ] channel ထဲက မေးခွန်းကို ကိုယ် မဟုတ်တဲ့သူတွေ ဖြေနေပြီ\n"

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ ဒုတိယ wave မှာ Customer App team ဝင်လာတော့ သူတို့ team အတွက်လည်း
      champion တစ်ယောက် လိုပါတယ်။ ဘယ်သူက ပိုသင့်တော်မလဲ။
      [[mark:q-a]] ပထမ တစ်ယောက်က Claude Code ရဲ့ usage leaderboard မှာ ထိပ်ဆုံးက ရှိနေပြီး၊ AI အကြောင်း channel ထဲမှာ
      အများဆုံး post တင်တဲ့ developer ပါ။
      [[mark:q-b]] ဒုတိယ တစ်ယောက်က team ထဲက တခြားသူတွေ ပြဿနာ ရှိတိုင်း သွားမေးနေကျ developer ဖြစ်ပြီး၊ သူ့ရဲ့ lead က
      တစ်ပတ် သုံးနာရီ ဖယ်ပေးဖို့ သဘောတူထားပါတယ်။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ တစ်ယောက်ပါ။ ဘာကြောင့်လဲဆိုတော့ champion ရဲ့ တန်ဖိုးက ကိုယ်တိုင် ဘယ်လောက်
      သုံးလဲ မဟုတ်ဘဲ တခြားသူတွေ ဘယ်လောက် အလုပ်ဖြစ်လာလဲ ဆိုတာပါ။ လူတွေ မေးနေကျသူဆီ မေးခွန်းတွေက ရောက်ပြီးသား ဖြစ်ပြီး၊
      အချိန်လည်း ရှိနေတော့ ဖြေပေးနိုင်ပါတယ်။ ပထမ တစ်ယောက်ကလည်း အသုံးဝင်ပါတယ်။ သူ တွေ့တာတွေကို မျှဝေပေးဖို့ပါ။
      [[mark:q-rule]] ဒါကြောင့် champion ရွေးတိုင်း မေးခွန်း နှစ်ခု မေးပါ။ team က ဒီလူ့ကို အခုတောင် မေးနေပြီလား၊ ဒီလူ့အတွက်
      အချိန် တကယ် ဖယ်ပေးထားလား ဆိုတာပါ။
    sources:
      - {
          title: "Claude Code docs: champion kit",
          url: "https://code.claude.com/docs/en/champion-kit",
        }
      - {
          title: "Microsoft Learn: Power Platform adoption, champions",
          url: "https://learn.microsoft.com/en-us/power-platform/guidance/adoption/champions",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: q-rule, offsetMs: 2500 },
          upsertIds: [q-t1, q-t2],
          drawMs: 1600,
        }

  - id: your-turn
    chapter: ကိုယ့် team ရဲ့ champion
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ကိုယ့် team မှာ champion ဖြစ်သင့်တဲ့သူကို ဒီ champion
      အပိုင်းအောက်မှာ ရေးကြည့်ပါ။ AI ကို အကြိုက်ဆုံးသူ မဟုတ်ဘဲ၊ လူတွေ အခု မေးနေကျသူကို စဉ်းစားပါ။
      [[mark:turn-2]] ပြီးရင် အဲဒီလူ့ကို လွှဲပေးရမယ့် အရာ တစ်ခုကို ရေးပါ။ ကိုယ်တစ်ယောက်တည်း သိနေတဲ့ setting တစ်ခု၊ ကိုယ့်
      ခေါင်းထဲမှာပဲ ရှိနေတဲ့ လုပ်နည်း တစ်ခု ဖြစ်နိုင်ပါတယ်။ အဲဒါကို ဒီနေ့ document တစ်ခုထဲ ချရေးလိုက်ရင် handover ရဲ့ ပထမ
      ခြေလှမ်း ဖြစ်သွားပါပြီ။
    sources:
      - {
          title: "Claude Code docs: champion kit",
          url: "https://code.claude.com/docs/en/champion-kit",
