      champion ဆိုတာ အသံ အကျယ်ဆုံးလူ မဟုတ်ဘဲ team က မေးနေကျ လူဖြစ်ပြီး၊ အချိန် တကယ် ဖယ်ပေးထားရပါတယ်။
