build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 9350

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: need
    chapter: ကိုယ် ထွက်သွားရင်
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ ကြီးကြပ်ပြီး သုံးတာကနေ အလုပ်ကို လွှဲအပ်တာဆီ အဆင့်လိုက် ရောက်အောင် roll out plan ကို
      ဆွဲခဲ့ပြီး၊ အဆင့်တိုင်းကို အချိန်နဲ့ မဟုတ်ဘဲ condition နဲ့ တက်မယ်လို့ သတ်မှတ်ခဲ့ပါတယ်။
      [[mark:a-title]] အဲဒီ plan ကို ပြန်ဖတ်ရင်း မေးခွန်း တစ်ခု ပေါ်လာပါတယ်။ အခု developer တွေ ဘာမေးချင်မေးချင်
      ကိုယ့်ဆီကိုပဲ လာမေးနေကြပါတယ်။
      [[mark:a-devs]] Billing developer တွေက CLAUDE.md ကို ဘယ်လို ပြင်ရမလဲ မေးတယ်၊ Network Tools က setting တွေ
      အကြောင်း မေးတယ်၊ developer အသစ်တွေကလည်း ဘယ်ကနေ စရမလဲ မေးကြပါတယ်။ CLAUDE.md ဆိုတာ project အကြောင်း Claude
      Code အမြဲ သိထားရမယ့် အချက်တွေ ရေးထားတဲ့ file ပါ။ Claude Code ကတော့ terminal ထဲကနေ code ကို ဖတ်၊ ပြင်၊ command
      run ပေးတဲ့ coding agent ပါ။
      [[mark:a-risk]] ပြဿနာက နောက် ခြောက်ပတ်လောက်ဆိုရင် ရက် ၃၀ activation ပြီးပြီး ကိုယ် ထွက်သွားရမှာပါ။ မေးခွန်းတိုင်း
      ကိုယ့်ဆီ ရောက်နေတဲ့ system က ကိုယ် ထွက်သွားတဲ့နေ့မှာ ရပ်သွားပါလိမ့်မယ်။ CLAUDE.md တွေ ခေတ်နောက်ကျလာမယ်၊ plugin
      ကို ဘယ်သူမှ update မလုပ်တော့ဘဲ၊ လူတွေကလည်း နည်းဟောင်းဆီ တဖြည်းဖြည်း ပြန်သွားကြပါလိမ့်မယ်။
      [[mark:a-path]] ဒါကြောင့် ကိုယ် ထွက်သွားပြီးနောက် ဆက်ထိန်းမယ့်သူကို ကြိုပြင်ဆင်ပေးတာလည်း FDE ရဲ့ အလုပ်ပါ။ Anthropic ရဲ့ FDE
      learning path ဖော်ပြချက်မှာလည်း ဒီအကြောင်းကို delivery ရဲ့ အစိတ်အပိုင်း တစ်ခုအဖြစ် ထည့်ထားပါတယ်။ ဒီနေ့ Delivery
      Plan Pack ရဲ့ champion plan စာမျက်နှာကို ရေးပါမယ်။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
    actions:
      - {
          id: open-champion,
          type: workspace.openFile,
          at: { scene: start },
          path: notebook/50-champion-plan.md,
        }
      - {
          id: draw-a-title,
          type: whiteboard.apply,
          at: { mark: a-title },
          open: true,
          clear: true,
          upsertIds: [a-title, a-me, a-me-l],
        }
      - {
          id: draw-a-devs,
          type: whiteboard.apply,
          at: { mark: a-devs },
          upsertIds: [a-d1, a-ar1, a-d2, a-ar2, a-d3, a-ar3],
          drawMs: 2400,
        }
      - {
          id: draw-a-risk,
          type: whiteboard.apply,
          at: { mark: a-risk },
          upsertIds: [a-risk],
          drawMs: 900,
        }

  - id: who
    chapter: ဘယ်သူက champion လဲ
    narration: >
      [[mark:w-open]] ဒါကြောင့် champion တစ်ယောက် လိုပါတယ်။ champion ဆိုတာ အဖွဲ့ထဲမှာ ရှေ့ကနေ သုံးပြပြီး တခြားသူတွေကို
      ကူညီပေးတဲ့သူပါ။ လူအများစုက AI ကို အစွဲအလမ်း အကြီးဆုံး၊ အသံ အကျယ်ဆုံး လူကို ရွေးချင်ကြပါတယ်။ ဒါပေမဲ့ champion ရဲ့
      အလုပ်က AI ကို ကြော်ငြာဖို့ မဟုတ်ဘဲ၊ တခြားသူတွေ အလုပ်ဖြစ်အောင် ကူညီဖို့ပါ။
      [[mark:w-kit]] Claude Code docs ထဲက champion kit က champion ရဲ့ အလုပ်ကို အပြုအမူ သုံးခုနဲ့ ပြောပါတယ်။ champion
      ကိုယ်တိုင် တွေ့တာကို မျှဝေတာ၊ လူတွေ လာမေးရမယ့်သူ ဖြစ်တာ၊ သုံးတဲ့သူ စက်ဝိုင်းကို ချဲ့တာပါ။ အဲဒီအတွက် တစ်ပတ်ကို မိနစ် ၄၀
      လောက်နဲ့ စလို့ရပြီး၊ လိုသလို တွဲလုပ်ပေးတဲ့ အချိန် ထပ်ထည့်နိုင်တယ်လို့ ဆိုပါတယ်။
      [[mark:w-ms]] champion အစီအစဉ်တွေကို လုပ်ဖူးတဲ့ Microsoft ရဲ့ လမ်းညွှန် တစ်ခုကလည်း၊ စိတ်ပါသူ ရှာဖို့ ကြေညာမယ့်အစား
      လူတွေ ဘယ်သူ့ကို အမြဲ မေးနေကျလဲ ဆိုတာကနေ ရှာဖို့နဲ့၊ အချိန်ကို သူ့ရဲ့ manager နဲ့ သဘောတူထားဖို့ အကြံပြုပါတယ်။
      champion ဆိုတာ support desk မဟုတ်ဘဲ team ကို ကိုယ်စားပြုတဲ့သူလို့လည်း ဆိုပါတယ်။
      [[mark:w-pick]] နေခြည် မှာ အဲဒီလူက Billing team lead မောင်မောင် ပါ။ အစက AI ရေးတဲ့ code ကို သံသယ ရှိခဲ့ပေမဲ့
      trial ရဲ့ output တိုက်စစ်ချက်တွေကို ကိုယ်တိုင် review လုပ်ခဲ့သူပါ။ team က ပြဿနာ ရှိရင် အရင်ဆုံး သွားမေးတာလည်း
      သူ့ကိုပါ။ သံသယ ရှိခဲ့ဖူးလို့ သံသယ ရှိနေတဲ့ developer တွေရဲ့ မေးခွန်းကို ပိုနားလည်ပါတယ်။
      [[mark:w-time]] champion ကို အချိန် မပေးဘဲ ရွေးရင် ဒုတိယ အလုပ် တစ်ခု ထပ်ပေးလိုက်တာနဲ့ အတူတူပါ။ ဒါကြောင့် CTO ဖြစ်တဲ့
      အောင်အောင် နဲ့ သဘောတူပြီး မောင်မောင် ရဲ့ team lead အလုပ်ထဲက တစ်ပတ် လေးနာရီကို ဖယ်ပေးပါမယ်။ champion kit ရဲ့ အချိန်ထက်
      ပိုများတာက၊ မောင်မောင် က ကူညီရုံ မဟုတ်ဘဲ deployment တစ်ခုလုံးကိုပါ ပိုင်ရမှာ ဖြစ်လို့ပါ။
    sources:
      - {
          title: "Claude Code docs: champion kit",
          url: "https://code.claude.com/docs/en/champion-kit",
