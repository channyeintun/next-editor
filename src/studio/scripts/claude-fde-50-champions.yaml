        text: "- CLAUDE.md (billing-service): 200 ကြောင်းအောက်၊ PR ထဲမှာပဲ ပြင်\n- skill များနဲ့ naychi plugin: version နဲ့ ပြောင်းလဲမှု မှတ်တမ်း\n- office hours: အင်္ဂါ၊ ကြာသပတေး\n- security နဲ့ data မေးခွန်း: admin ဆီ လွှဲ၊ ကိုယ်တိုင် မဖြေ\n"
      - id: sel-security
