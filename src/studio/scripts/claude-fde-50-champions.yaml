  - id: docs
    chapter: Documentation က infrastructure
    narration: >
      [[mark:d-point]] ဒီ လေးခုထဲမှာ CLAUDE.md က ထူးခြားပါတယ်။ ဖတ်တဲ့သူ နှစ်မျိုး ရှိလို့ပါ။ developer အသစ် တစ်ယောက်က
      project ကို နားလည်ဖို့ ဖတ်သလို၊ Claude Code ကလည်း session တိုင်းမှာ ဖတ်ပါတယ်။ ဆိုလိုတာက CLAUDE.md ဟာ အလုပ်ပြီးမှ
      ရေးတဲ့ မှတ်စု မဟုတ်ဘဲ deployment ကိုယ်တိုင်ရဲ့ အစိတ်အပိုင်း ဖြစ်ပါတယ်။ ခေတ်နောက်ကျနေတဲ့ CLAUDE.md က လူကိုရော
      Claude ကိုပါ မှားအောင် လုပ်ပါတယ်။
      [[mark:d-rules]] ဒါကြောင့် code ကို ဆက်ဆံသလိုပဲ ဆက်ဆံရပါမယ်။ Anthropic ရဲ့ scaling guide က CLAUDE.md ကို repo
      ရဲ့ root မှာ commit လုပ်ထားဖို့၊ document တွေလိုပဲ PR ထဲမှာ ပြင်ဖို့၊ onboarding checklist ထဲ ထည့်ထားဖို့ အကြံပြုပါတယ်။
      Claude Code ရဲ့ memory docs ကလည်း CLAUDE.md တစ်ခုကို စာကြောင်း ၂၀၀ အောက်မှာ ထားဖို့ ပြောပါတယ်။ ရှည်လာရင်
      ခေါင်းစဉ်အလိုက် file ခွဲထားလို့ ရပါတယ်။
      [[mark:d-onboard]] developer အသစ်တွေအတွက် နောက်ထပ် အထောက်အကူ တစ်ခုလည်း ရှိပါတယ်။ Claude Code ရဲ့ team onboarding
      command က ကိုယ့်ရဲ့ နောက်ဆုံး ရက် ၃၀ က session တွေ၊ command တွေ၊ MCP server တွေကနေ team onboarding guide တစ်ခုကို
      ထုတ်ပေးပါတယ်။ team ထဲက တခြားသူက အဲဒီ setup ကို ပြန်လုပ်နိုင်ဖို့ပါ။
    sources:
      - {
          title: "Claude blog: scaling agentic coding across your organization",
          url: "https://claude.com/blog/scaling-agentic-coding",
        }
      - { title: "Claude Code docs: memory", url: "https://code.claude.com/docs/en/memory" }
      - { title: "Claude Code docs: commands", url: "https://code.claude.com/docs/en/commands" }
    actions:
      - { id: point-b-o1, type: whiteboard.point, at: { mark: d-point }, target: { assetId: b-o1 } }

  - id: plan
    chapter: Champion plan
    narration: >
      [[mark:f-close]] ဒါတွေကို champion plan ထဲမှာ ဆက်ရေးကြည့်ရအောင်။ champion ရဲ့ နာမည်နဲ့ အချိန်ကို အပေါ်မှာ
      ရေးပြီးပါပြီ။
      [[mark:type-second]] champion တစ်ယောက်တည်းဆိုရင် အဲဒီလူ ခွင့်ယူတဲ့ ပတ်မှာ အကုန် ရပ်သွားပါတယ်။ Claude Enterprise
      ရဲ့ administrator guide က department ဒါမှမဟုတ် team တစ်ခုမှာ champion နှစ်ယောက် သုံးယောက် ထားဖို့ အကြံပြုပါတယ်။
      champion kit ကလည်း မေးခွန်း အများဆုံး မေးတဲ့ လုပ်ဖော်ကိုင်ဖက်က နောက် champion ဖြစ်လာလေ့ ရှိတယ်လို့ ဆိုပါတယ်။
      ဒါကြောင့် Network Tools ကနေ ဒုတိယ champion တစ်ယောက်ကို ရေးထားပါတယ်။
      [[mark:type-own]] ပိုင်ရမယ့် အရာ လေးခုကို တစ်ကြောင်းစီ ရေးပါတယ်။ CLAUDE.md ကို စာကြောင်း ၂၀၀ အောက် ထားပြီး PR
      ထဲမှာပဲ ပြင်ပါမယ်။ office hours က အင်္ဂါနေ့နဲ့ ကြာသပတေးနေ့မှာပါ။
      [[mark:sel-security]] နောက်ဆုံး စာကြောင်းက champion မလုပ်ရမယ့် အရာပါ။ security နဲ့ data မေးခွန်းတွေကို champion
      kit က admin ဆီ လွှဲဖို့၊ champion ကိုယ်တိုင် ထင်ရာ မဖြေဖို့ ပြောထားပါတယ်။ customer data ဘယ်ကို ရောက်လဲ ဆိုတဲ့
      မေးခွန်းမျိုးကို မှန်းဖြေလို့ မရပါဘူး။
      [[mark:type-check]] handover checklist မှာ အချက် သုံးချက် ရေးပါတယ်။ အချက်တိုင်းက ပြောရုံ မဟုတ်ဘဲ မျက်စိနဲ့ မြင်နိုင်တဲ့
      အရာပါ။ မောင်မောင် တစ်ယောက်တည်း plugin update တစ်ခု ထုတ်နိုင်ရမယ်၊ developer အသစ်က document တွေနဲ့ပဲ စနိုင်ရမယ်၊
      channel ထဲက မေးခွန်းတွေကို ကိုယ် မဟုတ်တဲ့သူတွေ ဖြေနေရမယ် ဆိုတာပါ။ နောက်ဆုံး အချက်က champion kit က အောင်မြင်မှုလို့
      ခေါ်တဲ့ အခြေအနေ ဖြစ်ပါတယ်။
    sources:
      - {
          title: "Claude Code docs: champion kit",
          url: "https://code.claude.com/docs/en/champion-kit",
        }
      - {
          title: "Claude Enterprise Administrator Guide (Claude Academy)",
          url: "https://academy.claude.com/tutorials/claude-enterprise-administrator-guide",
        }
      - { title: "Claude Code docs: memory", url: "https://code.claude.com/docs/en/memory" }
    actions:
      - { id: close-owns, type: whiteboard.apply, at: { mark: f-close }, open: false }
      - id: type-second
        type: editor.type
        at: { mark: type-second }
        cadence: line-by-line
        target: { file: notebook/50-champion-plan.md, after: "team lead အလုပ်ထဲက ဖယ်ပေး\n" }
        text: "- ဒုတိယ champion: Network Tools developer 1 ယောက် (မေးခွန်း အများဆုံး မေးသူ)\n"
      - id: type-own
        type: editor.type
