  - id: owns
    chapter: Champion ပိုင်ရမယ့်အရာ
    narration: >
      [[mark:b-title]] ရက် ၃၀ ပြီးတဲ့နောက် ပုံကို ပြန်ဆွဲကြည့်ရအောင်။ ဒီတစ်ခါ အလယ်မှာ ရှိတဲ့ လူ ပြောင်းသွားပါတယ်။
      [[mark:b-ch]] အလယ်မှာ champion ဖြစ်တဲ့ မောင်မောင် ရှိပါတယ်။ developer တွေရဲ့ မေးခွန်းတွေက အခု သူ့ဆီ ရောက်ပါမယ်။
      ဒါပေမဲ့ မေးခွန်း ဖြေရုံနဲ့ deployment က အသက်ဆက်ရှင်မှာ မဟုတ်ပါဘူး။
      [[mark:b-own]] မောင်မောင် ပိုင်ရမယ့် အရာ လေးခု ရှိပါတယ်။ repo တွေထဲက CLAUDE.md တွေ၊ team ရဲ့ procedure တွေကို
      ထုပ်ထားတဲ့ skill တွေ၊ အဲဒါတွေကို developer တိုင်းရဲ့ စက်ထဲ ရောက်အောင် ထုပ်ထားတဲ့ plugin နဲ့ အပတ်စဉ် office hours
      ပါ။ skill ဆိုတာ အလုပ် တစ်မျိုးကို ဘယ်လို လုပ်ရမလဲ ရေးထားပြီး လိုတဲ့အချိန်မှ Claude ဖတ်သုံးတဲ့ လမ်းညွှန်ပါ။
      office hours ကတော့ ဘယ်သူမဆို ပြဿနာ ယူလာပြီး ထိုင်မေးလို့ရတဲ့ အချိန်ပါ။
      [[mark:b-me]] ကိုယ်ကတော့ ပုံရဲ့ အစွန်းကနေ ထွက်သွားပါတယ်။ ကိုယ် ထွက်သွားလည်း ပုံက ပြောင်းစရာ မလိုတော့ပါဘူး။
      [[mark:b-hand]] ဒီလို ဖြစ်ဖို့ handover ကို ရက်စွဲနဲ့ checklist ပါတဲ့ အလုပ် တစ်ခုအဖြစ် ဆွဲထားရပါမယ်။ ကိုယ်
      ထွက်သွားမယ့်နေ့မှ စ လွှဲမယ်ဆိုရင် နောက်ကျနေပါပြီ။ checklist ထဲက အချက်တွေကို champion က ကိုယ် ရှိနေတုန်း ကိုယ်တိုင်
      လုပ်ပြနိုင်ရပါမယ်။
    sources:
