  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: open
    chapter: ဝန်ထမ်း ၄၃၀ အတွက်
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ ရက် ၃၀ activation ကို အပတ်လိုက် ချရေးပြီး run ခဲ့ကာ၊ developer နှစ်ယောက်က report job
      ၁၄၀ လုံးကို အလုပ်ရက် ၁၇ ရက်နဲ့ ရွှေ့ပြီးခဲ့တာကို ကြည့်ခဲ့ပါတယ်။
      [[mark:open-2]] အဲဒီ ရလဒ်ကို ကြည့်ပြီး နေခြည် ရဲ့ ဒါရိုက်တာ အဖွဲ့က Claude ကို ကုမ္ပဏီ တစ်ခုလုံး သုံးဖို့
      ခွင့်ပြုလိုက်ပါတယ်။ ဒီတစ်ခါ developer ၈ ယောက် မဟုတ်တော့ဘဲ ဝန်ထမ်း ၄၃၀ ပါ။ support agent တွေ၊ field
      technician တွေ၊ finance နဲ့ ရုံးဝန်ထမ်းတွေ အားလုံး ပါပါတယ်။ [[mark:open-3]] CTO ဖြစ်တဲ့ အောင်အောင် က မုန်တိုင်းကျတဲ့ညကို
      မမေ့ပါဘူး။ အဲဒီညက support agent တချို့ personal account တွေနဲ့ သုံးနေခဲ့ပြီး၊ ဘယ်သူ ဘာသုံးနေလဲ၊ customer
      data ဘယ်ကို ရောက်သွားလဲ ဆိုတာ ဘယ်သူမှ မသိခဲ့ပါဘူး။ ဒီတစ်ခါတော့ စကတည်းက သိနေချင်ပါတယ်။
      [[mark:ph-title]] Anthropic ရဲ့ FDE learning path က ကုမ္ပဏီ တစ်ခုလုံး Claude ကို ကျင့်သုံးလာအောင်
      လုပ်တာကို အဆင့် သုံးဆင့် ခွဲပြပါတယ်။ အဆင့်တွေရဲ့ နာမည်က path ကပါ၊ နေခြည် အတွက် ရှင်းပြချက်တွေကတော့
      ကိုယ်တို့ ကိုယ်တိုင် ပြင်ထားတာပါ။
      [[mark:ph-1]] ပထမ အဆင့်က Activation ပါ။ နေခြည် အတွက်ဆိုရင် ဝန်ထမ်း ၄၃၀ လုံး company account နဲ့ ဝင်နိုင်ပြီး၊
      ဘာကြောင့် သုံးတာလဲ နားလည်ကာ စသုံးရဲလာတဲ့အထိ ပြင်ဆင်တဲ့ အဆင့်ပါ။ ဒီ lesson နဲ့ နောက် lesson က ဒီ အဆင့်ထဲမှာ
      ရှိပါတယ်။
      [[mark:ph-23]] ဒုတိယ အဆင့် Acceleration မှာတော့ ဌာနတစ်ခုစီ ကိုယ့်နည်းကိုယ် သုံးနေတာတွေကို စုစည်းပြီး၊ အလုပ်ဖြစ်တဲ့
      နည်းကို တခြားဌာနတွေဆီ မြန်မြန် ရောက်အောင် လုပ်ပါတယ်။ အဲဒီအတွက် Center of Excellence၊ အတိုကောက် CoE လို့ ခေါ်တဲ့
      အဖွဲ့ငယ် တစ်ခုနဲ့၊ ဘာကို ခွင့်ပြုလဲ ရေးထားတဲ့ governance လိုပါတယ်။ တတိယ အဆင့် Expansion မှာတော့ အလုပ်ဖြစ်ပြီးသား
      နေရာတွေကနေ AI နဲ့ ဖြေရှင်းမယ့် အလုပ်အသစ်၊ use case အသစ်တွေဆီ ဆက်သွားပါတယ်။
      [[mark:ph-now]] Activation ရဲ့ ပထမ အလုပ်ကတော့ ဘယ်သူမှ login မဝင်ခင် လုပ်ရမယ့် ကြိုတင် ပြင်ဆင်မှုပါ။ လူ
      ဘယ်သူတွေ လိုလဲ၊ ဘာတွေကို setup လုပ်ထားရမလဲ ဆိုတဲ့ မေးခွန်း နှစ်ခုပါ။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
