      - {
          id: draw-ph-1,
          type: whiteboard.apply,
          at: { mark: ph-1 },
          upsertIds: [ph-b1, ph-l1, ph-d1],
          drawMs: 1200,
        }
      - {
          id: draw-ph-23,
          type: whiteboard.apply,
          at: { mark: ph-23 },
          upsertIds: [ph-a1, ph-b2, ph-l2, ph-d2, ph-a2, ph-b3, ph-l3, ph-d3],
          drawMs: 2400,
        }
      - {
          id: draw-ph-now,
          type: whiteboard.apply,
          at: { mark: ph-now },
          upsertIds: [ph-now],
          drawMs: 900,
        }

  - id: team
    chapter: Success team
    narration: >
      [[mark:t-title]] ပထမ မေးခွန်းက လူပါ။ ဝန်ထမ်း ၄၃၀ ဆီ Claude ကို အဆင့်လိုက် ဖြန့်သုံးတဲ့ roll out ကို FDE
      တစ်ယောက်တည်း လုပ်လို့ မရပါဘူး။ ဒီ အလုပ်အတွက် success team တစ်ခု ဖွဲ့ရပါမယ်။
      [[mark:t-sponsor]] ပထမ တစ်ယောက်က sponsor ပါ။ ဘာကြောင့် ဒီ အလုပ်ကို လုပ်တာလဲ ဆိုတာကို ကုမ္ပဏီ တစ်ခုလုံးရှေ့မှာ
      ပြောနိုင်ပြီး၊ ဆုံးဖြတ်ချက် လိုတဲ့အခါ ဆုံးဖြတ်ပေးနိုင်တဲ့သူပါ။ နေခြည် မှာတော့ အောင်အောင် ပါ။
      [[mark:t-owner]] ဒုတိယ တစ်ယောက်က owner ပါ။ roll out ကို နေ့စဉ် run ပေးမယ့်သူပါ။ sponsor က ဘာကြောင့်လဲ
      ကို ပြောရင်၊ owner က ဘယ်လိုလဲ၊ ဘယ်တော့လဲ ဆိုတာကို တာဝန်ယူပါတယ်။ နေခြည် က Internal Tools ရဲ့ team lead
      ကို owner အဖြစ် ရွေးပြီး၊ သူ့ အလုပ်ချိန်ရဲ့ ထက်ဝက်ကို ဒီ အလုပ်အတွက် သီးသန့် ပေးထားပါတယ်။
      [[mark:t-admin]] တတိယ တစ်ယောက်က administrator ပါ။ IT ဘက်ကနေ account၊ login နဲ့ setting တွေကို
      ပြင်ပေးမယ့်သူပါ။ စတုတ္ထ တစ်ယောက်ကတော့ security တာဝန်ခံပါ။ data ဘယ်မှာ သိမ်းလဲ၊ ဘယ်လောက်ကြာ သိမ်းလဲ
      ဆိုတာကို စကတည်းက ပါဝင် ဆုံးဖြတ်ရပါမယ်။ security ကို နောက်ဆုံးမှ မေးရင် launch တစ်ခုလုံး ရပ်သွားတတ်တာကို
      Part ၉ မှာ ကြည့်ခဲ့ပြီးပါပြီ။
      [[mark:t-champ]] နောက်ဆုံးက ဌာန တစ်ခုစီက champion တွေပါ။ champion ဆိုတာ ဌာနထဲမှာ ရှေ့ကနေ သုံးပြပြီး
      တခြားသူတွေကို ကူညီပေးမယ့်သူပါ။ Claude Enterprise Administrator Guide က ဌာနတိုင်းမှာ champion နှစ်ယောက်
      သုံးယောက်စီ ထားဖို့ အကြံပေးပါတယ်။ developer ဘက်မှာ Billing team lead မောင်မောင် ရှိပြီးသားပါ။ support
      ဘက်အတွက်တော့ support manager လှလှ က သူ့ team ထဲက support agent နှစ်ယောက်ကို ရွေးပေးပါတယ်။
    sources:
      - {
          title: "Claude Enterprise Administrator Guide (Anthropic Academy)",
          url: "https://academy.claude.com/tutorials/claude-enterprise-administrator-guide",
        }
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
    actions:
      - {
          id: draw-t-title,
          type: whiteboard.apply,
          at: { mark: t-title },
          clear: true,
          upsertIds: [t-title, t-center, t-center-l],
          drawMs: 900,
        }
      - {
          id: draw-t-sponsor,
          type: whiteboard.apply,
          at: { mark: t-sponsor },
          upsertIds: [t-sponsor],
          drawMs: 900,
        }
      - {
          id: draw-t-owner,
          type: whiteboard.apply,
          at: { mark: t-owner },
          upsertIds: [t-owner],
          drawMs: 900,
        }
      - {
          id: draw-t-admin,
          type: whiteboard.apply,
          at: { mark: t-admin },
          upsertIds: [t-admin, t-sec],
          drawMs: 1200,
        }
      - {
          id: draw-t-champ,
          type: whiteboard.apply,
          at: { mark: t-champ },
          upsertIds: [t-champ],
          drawMs: 900,
        }

  - id: provisioning
    chapter: Login မဝင်ခင် setup
    narration: >
      [[mark:v-open]] ဒုတိယ မေးခွန်းက ဘယ်သူမှ login မဝင်ခင် ဘာတွေ setup လုပ်ထားရမလဲ ဆိုတာပါ။ account၊
      ခွင့်ပြုချက်နဲ့ setting တွေကို ကြိုပြင်ဆင်တာကို provisioning လို့ ခေါ်ပါတယ်။ အရင်ဆုံး plan ကို ရွေးရပါမယ်။ ဒီ
      lesson ကို ရေးတဲ့ အချိန်မှာ Claude ရဲ့ Team plan က seat ၁၅၀ အထိပဲ ရတာမို့၊ ဝန်ထမ်း ၄၃၀ အတွက် Enterprise plan
      လိုပါတယ်။ လက်ရှိ ကန့်သတ်ချက်ကိုတော့ Claude Help Center ရဲ့ plan စာမျက်နှာတွေမှာ ကြည့်ပါ။
      [[mark:v-1]] ပထမ ခေါင်းစဉ်က login ပါ။ single sign on၊ အတိုကောက် SSO ဆိုတာ ကုမ္ပဏီ account တစ်ခုတည်းနဲ့ login
      ဝင်တာပါ။ Claude မှာ SAML ဒါမှမဟုတ် OIDC နဲ့ ချိတ်နိုင်ပြီး၊ မချိတ်ခင် ကုမ္ပဏီရဲ့ domain ဟာ ကိုယ့်ဟာ ဖြစ်ကြောင်း
      DNS record တစ်ခုနဲ့ အရင် verify လုပ်ရပါတယ်။
      [[mark:v-2]] ဒုတိယ ခေါင်းစဉ်က account တွေ ဝင်တာ ထွက်တာပါ။ နည်း သုံးမျိုး ရှိပါတယ်။ တစ်ယောက်ချင်း ဖိတ်တဲ့
      invite၊ ပထမဆုံး login ဝင်တဲ့အခါ account ကို အလိုလို ဖွင့်ပေးတဲ့ just in time၊ အတိုကောက် JIT၊ ပြီးတော့ ကုမ္ပဏီရဲ့
      ဝန်ထမ်းစာရင်းနဲ့ ချိတ်ပြီး ဝင်ရင် ဖွင့်၊ ထွက်ရင် ပိတ်ပေးတဲ့ SCIM ပါ။
      [[mark:v-2b]] JIT က account ကို ဖွင့်ပေးပေမဲ့ ဘယ်တော့မှ အလိုအလျောက် မဖယ်ပေးပါဘူး။ SCIM ကတော့ Enterprise
      မှာ ရပြီး Team plan မှာ မပါပါဘူး။
      [[mark:v-3]] တတိယ ခေါင်းစဉ်က role ပါ။ Claude မှာ Primary Owner တစ်ယောက်တည်း၊ Owner၊ Admin နဲ့ User ဆိုတဲ့
      role တွေ ရှိပြီး၊ Enterprise မှာ Custom role တွေလည်း ထပ်ဖွဲ့နိုင်ပါတယ်။ သတိထားရမှာက Admin က အကုန် မလုပ်နိုင်တာပါ။ data သိမ်းချိန် သတ်မှတ်တာ၊ ဘယ်သူ ဘာလုပ်ခဲ့လဲ
      ဆိုတဲ့ audit log ကို ထုတ်တာလို အလုပ်တွေကို Owner ဒါမှမဟုတ် Primary Owner ပဲ လုပ်နိုင်ပါတယ်။
      [[mark:v-4]] စတုတ္ထ ခေါင်းစဉ်က ဘယ် feature၊ ဘယ် connector တွေကို ဖွင့်မလဲ ဆိုတာပါ။ connector ဆိုတာ Claude ကို
      တခြား tool၊ data တွေနဲ့ ချိတ်ပေးတဲ့ အဆက်ပါ။ Anthropic ရဲ့ Enterprise consumption guide က Claude Code လို
      အသုံးများတဲ့ feature တွေကို ပထမနေ့မှာ လူတိုင်းကို ဖွင့်ပေးတာဟာ မမျှော်လင့်တဲ့ အသုံးစရိတ်ကို အမြန်ဆုံး
      ဖြစ်စေတယ်လို့ သတိပေးပါတယ်။
      [[mark:v-5]] ပဉ္စမ ခေါင်းစဉ်က data နဲ့ cost ပါ။ Enterprise မှာ data ကို ဘယ်လောက်ကြာ သိမ်းမလဲ သတ်မှတ်နိုင်ပြီး၊
      အနည်းဆုံး ရက် ၃၀ ပါ။ မသတ်မှတ်ရင်တော့ အချိန်အကန့်အသတ် မရှိ သိမ်းထားပါတယ်။ Team နဲ့ Enterprise plan မှာ
      prompt နဲ့ code ကို Anthropic က model train လုပ်ဖို့ မသုံးပါဘူး။
      [[mark:v-5b]] cost ဘက်မှာတော့ လက်ရှိ Enterprise plan က seat တစ်မျိုးတည်း ရှိပြီး၊ အသုံးပြုမှု အားလုံးကို API ဈေးနှုန်းနဲ့
      တွက်ပါတယ်။ ကုမ္ပဏီ တစ်ခုလုံးအတွက် spend limit တစ်ခုတည်း ထားရင် ပြည့်သွားတဲ့နေ့မှာ လူတိုင်း တစ်ပြိုင်တည်း
      ရပ်သွားမှာမို့၊ ဌာနအလိုက်နဲ့ လူတစ်ယောက်ချင်းအလိုက် limit တွေနဲ့ စဖို့ အဲဒီ guide က အကြံပေးပါတယ်။
    sources:
      - {
          title: "Claude Help Center: What is the Team plan?",
          url: "https://support.claude.com/en/articles/9266767-what-is-the-team-plan",
        }
      - {
          title: "Claude Help Center: Setting up JIT or SCIM provisioning",
          url: "https://support.claude.com/en/articles/13133195-setting-up-jit-or-scim-provisioning",
        }
      - {
          title: "Claude Help Center: Claude Enterprise consumption guide",
          url: "https://support.claude.com/en/articles/14782391-claude-enterprise-consumption-guide",
        }
      - {
          title: "Claude Help Center: What is the Enterprise plan?",
          url: "https://support.claude.com/en/articles/9797531-what-is-the-enterprise-plan",
        }
      - {
          title: "Claude Help Center: Roles and permissions",
          url: "https://support.claude.com/en/articles/9267276-roles-and-permissions",
        }
      - {
          title: "Claude Code docs: admin setup",
          url: "https://code.claude.com/docs/en/admin-setup",
        }
    actions:
      - {
          id: close-team,
          type: whiteboard.apply,
          at: { mark: v-open, offsetMs: -1400 },
          open: false,
        }
      - {
          id: show-prov,
          type: slide.show,
          at: { mark: v-open, offsetMs: -600 },
          slideId: provisioning,
        }
      - { id: point-v-1, type: slide.point, at: { mark: v-1 }, target: { x: 0.15, y: 0.35 } }
      - { id: point-v-2, type: slide.point, at: { mark: v-2 }, target: { x: 0.15, y: 0.47 } }
      - { id: point-v-3, type: slide.point, at: { mark: v-3 }, target: { x: 0.15, y: 0.59 } }
      - { id: point-v-4, type: slide.point, at: { mark: v-4 }, target: { x: 0.15, y: 0.71 } }
      - { id: point-v-5, type: slide.point, at: { mark: v-5 }, target: { x: 0.15, y: 0.83 } }

  - id: checklist
    chapter: Checklist ကို ချရေးခြင်း
    narration: >
      [[mark:c-open]] ဒါတွေကို နေခြည် ရဲ့ activation checklist အဖြစ် ချရေးကြည့်ရအောင်။
      [[mark:c-plan]] plan ကို ထိပ်ဆုံးမှာ လနဲ့တကွ ရေးထားပါတယ်။ plan နဲ့ ကန့်သတ်ချက်တွေက မကြာခဏ
      ပြောင်းတတ်လို့ပါ။
      [[mark:type-team]] ပထမ အပိုင်းက success team ပါ။ နာမည်နဲ့ role ကို တိတိကျကျ ရေးထားမှ ပြဿနာ တစ်ခု
      ပေါ်လာတဲ့အခါ ဘယ်သူ့ကို မေးရမလဲ ဆိုတာ လူတိုင်း သိပါတယ်။
      [[mark:type-login]] provisioning ရဲ့ ပထမ တစ်ကြောင်းက login ပါ။ domain ကို verify လုပ်ပြီးမှ SSO ကို ချိတ်ပါမယ်။
      [[mark:type-account]] account အတွက်တော့ SCIM ကို HR ရဲ့ ဝန်ထမ်းစာရင်းနဲ့ ချိတ်ပါမယ်။ ဝန်ထမ်း တစ်ယောက်
      ထွက်သွားတဲ့နေ့မှာ သူ့ Claude account ပါ အလိုလို ပိတ်သွားမှာပါ။
      [[mark:type-role]] role မှာတော့ အောင်အောင် က Primary Owner ဖြစ်ပြီး၊ roll out ကို run တဲ့ owner နဲ့ security
      တာဝန်ခံက Owner role ယူပါတယ်။ IT ကတော့ Admin ပါ။
      [[mark:type-feature]] feature မှာ ပထမ လအတွက် Claude Code ကို developer တွေကိုပဲ ဖွင့်ပေးပါမယ်။ connector
      အသစ် တစ်ခုခုကိုလည်း security က ခွင့်ပြုမှ ဖွင့်ပါမယ်။
      [[mark:type-data]] နောက်ဆုံး တစ်ကြောင်းက data နဲ့ cost ပါ။ security တာဝန်ခံနဲ့ တိုင်ပင်ပြီး data ကို ရက် ၉၀
      သိမ်းဖို့ ဆုံးဖြတ်ထားပြီး၊ spend limit ကို ဌာနအလိုက် ခွဲထားပါတယ်။
    sources:
      - {
          title: "Claude Help Center: Setting up single sign-on (SSO)",
          url: "https://support.claude.com/en/articles/13132885-setting-up-single-sign-on-sso",
        }
      - {
          title: "Claude Help Center: Roles and permissions",
          url: "https://support.claude.com/en/articles/9267276-roles-and-permissions",
        }
      - {
          title: "Claude Help Center: Custom data retention controls for Enterprise plans",
          url: "https://support.claude.com/en/articles/10440198-custom-data-retention-controls-for-enterprise-plans",
        }
    actions:
      - { id: close-prov, type: slide.close, at: { mark: c-open } }
      - {
          id: open-checklist,
          type: workspace.openFile,
          at: { afterAction: close-prov },
          path: notebook/53-activation-checklist.md,
        }
      - id: sel-plan
        type: editor.select
        at: { mark: c-plan }
        target:
          file: notebook/53-activation-checklist.md
          text: "plan: Claude Enterprise (Team plan က seat 150 အထိပဲ · 2026-11)"
      - id: type-team
        type: editor.type
        at: { mark: type-team }
        cadence: line-by-line
        target: { file: notebook/53-activation-checklist.md, after: "## Success team\n" }
        text: "- sponsor: CTO အောင်အောင် · owner: Internal Tools team lead (အချိန် 50 %)\n- admin: IT · security တာဝန်ခံ · champion: ဌာနတိုင်းက 2–3 ယောက်\n"
      - id: type-login
        type: editor.type
        at: { mark: type-login }
        cadence: line-by-line
        target:
          { file: notebook/53-activation-checklist.md, after: "## Provisioning · login မဝင်ခင်\n" }
        text: "- login: domain verify လုပ်ပြီးမှ SSO ချိတ်\n"
      - id: type-account
        type: editor.type
        at: { mark: type-account }
        cadence: line-by-line
        target: { file: notebook/53-activation-checklist.md, after: "SSO ချိတ်\n" }
        text: "- account: SCIM ကို HR စာရင်းနဲ့ ချိတ်။ ထွက်တဲ့နေ့ ပိတ် (JIT က မဖယ်ပေး)\n"
      - id: type-role
        type: editor.type
        at: { mark: type-role }
        cadence: line-by-line
        target: { file: notebook/53-activation-checklist.md, after: "(JIT က မဖယ်ပေး)\n" }
        text: "- role: Primary Owner = CTO · Owner = owner၊ security · Admin = IT\n"
      - id: type-feature
        type: editor.type
        at: { mark: type-feature }
        cadence: line-by-line
        target: { file: notebook/53-activation-checklist.md, after: "Admin = IT\n" }
        text: "- feature: ပထမ လ Claude Code က developer ပဲ · connector အသစ်က security ခွင့်ပြုမှ\n"
      - id: type-data
        type: editor.type
        at: { mark: type-data }
        cadence: line-by-line
        target: { file: notebook/53-activation-checklist.md, after: "security ခွင့်ပြုမှ\n" }
        text: "- data နဲ့ cost: retention 90 ရက် · spend limit ဌာနအလိုက်\n"
      - id: expect-account
        type: expect.file
        at: { afterAction: type-data }
        path: notebook/53-activation-checklist.md
        contains: "- account: SCIM ကို HR စာရင်းနဲ့ ချိတ်။ ထွက်တဲ့နေ့ ပိတ် (JIT က မဖယ်ပေး)\n"

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ ဒီ checklist ကို ရေးနေတဲ့ အပတ်မှာပဲ လှလှ က support agent ၄၅ ယောက်ကို အမြန်ဆုံး
      စသုံးစေချင်ပါတယ်။ finance ဌာနကလည်း သူတို့ကို အရင် ပေးပါလို့ တောင်းဆိုလာပါတယ်။ owner အနေနဲ့ ဘာကို အရင်
      ဆုံးဖြတ်သင့်မလဲ။
      [[mark:q-a]] ပထမ တစ်ခုက ဘယ်ဌာနကို အရင် ပေးမလဲ ဆိုတာပါ။
      [[mark:q-b]] ဒုတိယ တစ်ခုက ဝန်ထမ်း ဝင်လာရင် account ကို ဘယ်လို ဖွင့်မလဲ၊ ထွက်သွားရင် ဘယ်လို ပိတ်မလဲ ဆိုတာပါ။
      lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ တစ်ခုပါ။ ဘာကြောင့်လဲဆိုတော့ ဘယ်ဌာနကို အရင် ပေးပေး၊ လူတိုင်းက
      account လမ်းကြောင်း တစ်ခုတည်းကနေ ဝင်ရလို့ပါ။ အဲဒါ မရှိခင် လက်နဲ့ ဖိတ်ပြီး စလိုက်ရင်၊ နောက်ပိုင်း ထွက်သွားတဲ့
      ဝန်ထမ်းတွေရဲ့ account တွေက တစ်ယောက်ယောက် သတိရတဲ့အထိ ပွင့်နေပြီး customer data ပါတဲ့ chat တွေကို ဆက်ဖွင့်ကြည့်နိုင်ပါတယ်။
      မုန်တိုင်းကျတဲ့ညကလိုပဲ ဘယ်သူ ဘာကို မြင်နေလဲ ဆိုတာ ဘယ်သူမှ မသိတော့ပါဘူး။ ဘယ်ဌာနကို အရင် ပေးမလဲ ဆိုတာကတော့ အပတ်တိုင်း ပြန်ပြင်လို့ ရပါတယ်။
      [[mark:q-rule]] ဒါကြောင့် ဌာနတွေရဲ့ အစဉ်က ပြင်လို့ရတဲ့ ဆုံးဖြတ်ချက်ပါ။ account ဖွင့်ပိတ်တဲ့ လမ်းကြောင်းကတော့
      အားလုံးရဲ့ အခြေခံမို့ အရင် ဆုံးဖြတ်ပါ။
    sources:
      - {
          title: "Claude Help Center: Setting up JIT or SCIM provisioning",
          url: "https://support.claude.com/en/articles/13133195-setting-up-jit-or-scim-provisioning",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: q-rule },
          upsertIds: [q-t1],
          drawMs: 900,
        }

  - id: your-turn
    chapter: ကိုယ့် ကုမ္ပဏီအတွက်
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ကိုယ့် ကုမ္ပဏီမှာ AI tool တစ်ခုကို ကုမ္ပဏီ
      တစ်ခုလုံးအတွက် roll out လုပ်မယ်ဆိုရင် success team မှာ ဘယ်သူတွေ ပါမလဲ ဆိုတာ ဒီ နှစ်ကြောင်းအတိုင်း
      ရေးကြည့်ပါ။ နာမည် မသိရင် role ကိုပဲ ရေးပါ။
      [[mark:turn-2]] sponsor နဲ့ owner ကို တစ်ယောက်တည်း မဖြစ်စေဖို့ သတိထားပါ။ owner အတွက် အချိန် ဘယ်လောက်
      ပေးမလဲ ဆိုတာလည်း ထည့်ရေးပါ။ အချိန် မပေးထားတဲ့ owner ဆိုတာ နာမည်သက်သက်ပဲ ဖြစ်သွားတတ်ပါတယ်။
    sources:
      - {
          title: "Claude Enterprise Administrator Guide (Anthropic Academy)",
          url: "https://academy.claude.com/tutorials/claude-enterprise-administrator-guide",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: turn }, open: false }
      - id: sel-team
        type: editor.select
        at: { mark: turn, offsetMs: 2200 }
        target:
          file: notebook/53-activation-checklist.md
          text: "- sponsor: CTO အောင်အောင် · owner: Internal Tools team lead (အချိန် 50 %)\n- admin: IT · security တာဝန်ခံ · champion: ဌာနတိုင်းက 2–3 ယောက်"
      - id: sel-time
        type: editor.select
        at: { mark: turn-2 }
        target:
          file: notebook/53-activation-checklist.md
          text: "(အချိန် 50 %)"

  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ ကုမ္ပဏီ တစ်ခုလုံး Claude ကို စသုံးဖို့ ပထမဆုံး လိုတာက လူနဲ့ setup ပါ။ လူဘက်မှာ
      sponsor၊ owner၊ administrator၊ security တာဝန်ခံနဲ့ ဌာနတိုင်းက champion တွေ ပါတဲ့ success team ရှိရပါမယ်။
      [[mark:recap-2]] setup ဘက်မှာတော့ login၊ account ဖွင့်ပိတ်၊ role၊ feature နဲ့ data၊ cost ဆိုတဲ့ ခေါင်းစဉ်
      ငါးခုကို ဘယ်သူမှ login မဝင်ခင် ဆုံးဖြတ်ထားရပါမယ်။ ဒါမှ မုန်တိုင်းကျတဲ့ညကလို ဘယ်သူ ဘာသုံးနေလဲ မသိတာမျိုး
      ထပ်မဖြစ်တော့မှာပါ။
      [[mark:next]] ဒါပေမဲ့ account တွေ အသင့်ဖြစ်ရုံနဲ့ လူတွေ သုံးလာမှာ မဟုတ်ပါဘူး။ နောက် lesson မှာတော့ AI
      အမှားအတွက် အပြစ်တင်ခံရမှာ၊ အလုပ်ပြုတ်မှာကို စိုးရိမ်နေတဲ့ support agent တွေအတွက် culture ကို ပြင်ဆင်တာနဲ့
      launch ကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
    actions:
      - id: sel-title
        type: editor.select
        at: { mark: recap }
        target:
          file: notebook/53-activation-checklist.md
          text: "## Success team"
      - id: sel-prov
        type: editor.select
        at: { mark: recap-2 }
        target:
          file: notebook/53-activation-checklist.md
          text: "## Provisioning · login မဝင်ခင်"

checks:
  - { type: timing.p95Ms, max: 300 }
