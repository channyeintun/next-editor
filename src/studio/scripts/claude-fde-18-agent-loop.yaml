      - id: sel-x-block
        type: editor.select
        at: { mark: sel-x-block }
        target:
          file: examples/first-turn.example.json
          text: "      \"name\": \"check_outage\",\n      \"input\": { \"township\": \"Hlaing\" }\n"
      - id: sel-x-id
        type: editor.select
        at: { mark: sel-x-id }
        target:
          file: examples/first-turn.example.json
          text: '"id": "toolu_01Vb7nQ3kT8mXc2pR5wLd9Ja",'
      - id: sel-x-text
