scenes:
  - id: need
    chapter: ကြိုသိရမယ့် အချက်
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ response တစ်ခုရဲ့ usage နဲ့ stop reason ကို ဖတ်ပြီး၊ Reply assistant ရဲ့ တစ်ရက်စာ
      ကုန်ကျစရိတ်ကို တွက်ခဲ့ပါတယ်။ stop reason ထဲမှာ tool use ဆိုတဲ့ တန်ဖိုး ရှိတာကိုလည်း တွေ့ခဲ့ပါတယ်။
      [[mark:storm]] connection ticket တစ်ခုအတွက် ကောင်းတဲ့ draft ရေးဖို့ဆိုရင် customer နေတဲ့ မြို့နယ်မှာ
      လိုင်းကျနေလား ဆိုတာကို အရင် သိရပါမယ်။ မုန်တိုင်းကျတဲ့ညက AI ရေးတဲ့ အဖြေ ၆၄ စောင် မှားခဲ့တာလည်း ဒီ အချက်ကို
      မသိခဲ့လို့ပါ။ လိုင်းကျမှု အခြေအနေကို နေခြည် ရဲ့ network monitoring system၊ အတိုကောက် NMS ကပဲ သိပါတယ်။
      [[mark:need-2]] ပြဿနာက ဒီ အချက်ကို request ထဲ ကြိုထည့်ပေးဖို့ အမြဲ မဖြစ်နိုင်တာပါ။ ticket တစ်ခုမှာ
      မြို့နယ် နာမည် ပါချင်မှ ပါပါမယ်၊ တချို့ ticket တွေက လိုင်းကျမှုနဲ့ လုံးဝ မဆိုင်ပါဘူး။ ဘာ အချက်အလက် လိုမလဲ
      ဆိုတာကို ticket ကို ဖတ်ပြီးမှ သိရတာပါ။ ဒါကြောင့် model က ticket ကို ဖတ်၊ လိုတာကို တောင်း၊ အဖြေ ရတဲ့အထိ
      စောင့်ပြီးမှ draft ကို ဆက်ရေးနိုင်ရပါမယ်။ အဲဒီလို လုပ်ပေးတာက agent loop ပါ။
    sources:
      - {
          title: "Claude Docs: Handle tool calls",
          url: "https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls",
        }
    actions:
      - { id: open-readme, type: workspace.openFile, at: { mark: storm }, path: README.md }
      - id: sel-storm
        type: editor.select
        at: { afterAction: open-readme }
        target:
          file: README.md
          text: "- chat AI နဲ့ ရေးထားတဲ့ အဖြေ 64 စောင်က လိုင်းကျနေတဲ့ customer တွေကို router ပြန်ဖွင့်ခိုင်းခဲ့တယ်"
      - id: sel-nms
        type: editor.select
        at: { mark: need-2 }
        target:
          file: README.md
          text: "- NMS: မြို့နယ်အလိုက် လိုင်းကျမှု အခြေအနေ"

  - id: ring
    chapter: Agent loop
    narration: >
      [[mark:r-open]] agent loop ဆိုတာ စဉ်းစား၊ tool သုံး၊ ရလဒ်ကြည့်၊ ပြန်စဉ်းစား ဆိုတဲ့ သံသရာပါ။ တစ်ဆင့်ချင်း
      ဆွဲကြည့်ရအောင်။
      [[mark:r-one]] API ကို request တစ်ခု ပို့တာက တစ်ဆင့်ပဲ ဖြစ်ပါတယ်။ model က input ကို ဖတ်ပြီး response တစ်ခု
      ပြန်ပေးလိုက်တာနဲ့ အဲဒီ request က ပြီးသွားပါပြီ။ API က ဘာမှ မှတ်မထားဘူး ဆိုတာကိုလည်း သတိရပါ။
      [[mark:r-ask]] ticket ကို ဖတ်ပြီး လိုင်းကျမှု အခြေအနေ လိုတယ်လို့ model က ဆုံးဖြတ်ရင်၊ draft ကို မရေးသေးဘဲ
      tool use ကို ပြန်ပေးပါတယ်။ tool use ဆိုတာ model က tool တစ်ခုကို ဒီ input နဲ့ ခေါ်ပေးပါလို့ တောင်းဆိုတာပါ။
      tool ဆိုတာကတော့ model တောင်းရင် ကိုယ်တို့ program က လုပ်ပေးတဲ့ လုပ်ဆောင်ချက် တစ်ခုပါ။
      [[mark:r-code]] အဲဒီ တောင်းဆိုချက်ကို ကိုယ်တို့ code က လက်ခံပြီး NMS ကို တကယ် မေးပေးပါတယ်။ ဆိုလိုတာက
      နောက်တစ်ဆင့် ဘာလုပ်မလဲ ဆိုတာကို model က ဆုံးဖြတ်ပြီး၊ အလုပ်ကို တကယ် လုပ်တာကတော့ ကိုယ်တို့ program ပါ။
      [[mark:r-back]] NMS က ပြန်ပေးတဲ့ ရလဒ်ကို tool result အဖြစ် request အသစ် တစ်ခုနဲ့ model ဆီ ပြန်ပို့ပါတယ်။
      ဒီတစ်ခါ request ထဲမှာ ticket၊ model ရဲ့ တောင်းဆိုချက်နဲ့ ရလဒ် သုံးခုလုံး ပါရပါမယ်။ model က ရလဒ်ကို
      ကြည့်ပြီး နောက်ထပ် tool တစ်ခု လိုသေးလား၊ draft ရေးလို့ ရပြီလား ပြန်စဉ်းစားပါတယ်။
      [[mark:r-end]] draft ရေးလို့ ရပြီ ဆိုရင်တော့ stop reason end turn နဲ့ ပြန်လာပြီး loop က ရပ်ပါတယ်။ ဒီလို
      သံသရာနဲ့ အလုပ်လုပ်တာကို agent လို့ ခေါ်ပါတယ်။ agent ဆိုတာ ရည်မှန်းချက် ရောက်တဲ့အထိ tool တွေကို ကိုယ်တိုင်
      ရွေးသုံးပြီး အဆင့်ဆင့် လုပ်သွားတဲ့ model ပါ။
      [[mark:r-limit]] ဒါပေမဲ့ model က end turn ဘယ်တော့မှ မပြန်ရင် ဘာဖြစ်မလဲ။ tool က error ပြန်နေလို့ model က
      ထပ်ခါထပ်ခါ ပြန်တောင်းနေနိုင်ပါတယ်။ ကန့်သတ်ချက် မရှိတဲ့ loop က ငွေနဲ့ အချိန်ကို အဆုံးမရှိ ကုန်စေနိုင်တာမို့၊
      loop တိုင်းမှာ အကြိမ်ရေ အများဆုံးကို သတ်မှတ်ထားရပါမယ်။
    sources:
      - {
          title: "Claude Docs: Handle tool calls",
          url: "https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls",
        }
      - {
          title: "Claude Docs: Define tools",
          url: "https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools",
        }
    actions:
      - {
