      reply-assistant/src/loop.ts: |
        import Anthropic from "@anthropic-ai/sdk";

        const client = new Anthropic();
        const MAX_TURNS = 5; // every loop needs a limit

        // Our code. Prototype stub: the real version will ask the NMS.
        async function checkOutage(input: unknown): Promise<string> {
          const { township } = input as { township: string };
          return JSON.stringify({ township, outage: false });
        }

        export async function draftReply(ticket: string): Promise<string> {
          const messages: Anthropic.MessageParam[] = [{ role: "user", content: ticket }];

          for (let turn = 0; turn < MAX_TURNS; turn++) {
            const response = await client.messages.create({
              model: "claude-opus-5-5", // ID as of 2026-11
              max_tokens: 16000,
              system: "Draft a reply to a Naychi Fiber support ticket for a support agent to check.",
              tools: [
                {
                  name: "check_outage",
                  description: "Check the NMS for an outage in a township. Use before any connection reply.",
                  input_schema: {
                    type: "object",
                    properties: { township: { type: "string", description: "Township name" } },
                    required: ["township"],
                  },
                },
              ],
              messages,
            });

          }
          throw new Error(`no finished draft after ${MAX_TURNS} turns`);
        }
