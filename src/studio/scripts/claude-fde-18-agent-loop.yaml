  - id: code
    chapter: Loop ကို code နဲ့ ရေးခြင်း
    narration: >
      [[mark:c-open]] အခု ဒီ သံသရာကို Reply assistant ရဲ့ code နဲ့ ရေးကြည့်ရအောင်။
      [[mark:sel-create]] loop တစ်ပတ်ရဲ့ အစမှာ request ကို ပို့ပါတယ်။ model ကို check outage ဆိုတဲ့ tool တစ်ခု
      သုံးခွင့် ပေးထားပါတယ်။ tool ကို ဘယ်လို ဖော်ပြရလဲ ဆိုတာကိုတော့ နောက် lesson မှာ အသေးစိတ် ကြည့်ပါမယ်။ messages
      ထဲမှာ ဒီအချိန်အထိ ဖြစ်ခဲ့တာ အားလုံး ပါပါတယ်။
      [[mark:type-done]] ပထမ အပိုင်းက ပြီးပြီလား စစ်တာပါ။ stop reason က end turn ဆိုရင် model က draft ကို ပြီးအောင်
      ရေးပြီးပြီ ဖြစ်လို့၊ text block တွေထဲက စာကို ယူပြီး function ကနေ ပြန်ထွက်ပါတယ်။
      [[mark:type-keep]] ဒုတိယ အပိုင်းမှာ stop reason က tool use လည်း မဟုတ်ရင် ဆက်မလုပ်ဘဲ error နဲ့ ရပ်ပါတယ်။
      max tokens လို stop reason မျိုးမှာ ရလာတဲ့ စာကို ယုံလို့ မရလို့ပါ။ ပြီးရင် model ရဲ့ response ကို
      စကားဝိုင်းထဲ ထည့်ပါတယ်။ text သက်သက် မဟုတ်ဘဲ content တစ်ခုလုံးကို ထည့်ရပါမယ်။ မဟုတ်ရင် tool use block
      ပျောက်သွားပြီး၊ နောက် request မှာ model က ဘာ တောင်းခဲ့လဲ ဆိုတာ မမြင်ရတော့ပါဘူး။
      [[mark:type-run]] တတိယ အပိုင်းက model တောင်းထားတဲ့ tool တွေကို run တာပါ။ content ထဲက tool use block
      တစ်ခုချင်းအတွက် check outage function ကို ခေါ်ပြီး၊ ရလဒ်ကို block ရဲ့ id နဲ့ တွဲထားပါတယ်။ ဒီ prototype
      မှာတော့ function က NMS အစစ်ကို မခေါ်သေးဘဲ ပုံသေ ရလဒ်ပဲ ပြန်ပေးပါတယ်။
      [[mark:type-send]] နောက်ဆုံး အပိုင်းက ရလဒ် အားလုံးကို user message တစ်ခုတည်းထဲ ထည့်ပြီး ပြန်ပို့တာပါ။ ပြီးရင်
      loop က နောက်တစ်ပတ် ပြန်စပြီး request အသစ်ကို ပို့ပါတယ်။ ရလဒ်တွေကို message တစ်ခုစီ ခွဲမပို့ဘဲ
      တစ်ခုတည်းမှာ စုပို့တာက model က tool တွေကို တစ်ပြိုင်တည်း ဆက်တောင်းနိုင်အောင်ပါ။
      [[mark:sel-limit]] loop ရဲ့ ကန့်သတ်ချက်ကတော့ ဒီ ကိန်းသေပါ။ အများဆုံး ငါးပတ်အထိပဲ ပတ်ပြီး၊ အဲဒီအထိ draft မရရင်
      error နဲ့ ရပ်ပါတယ်။ ticket တစ်ခုကို ငါးပတ်ထက် ပိုလိုတယ် ဆိုရင် loop ကို ဆက်ပတ်ခိုင်းရမယ့် အချိန် မဟုတ်ဘဲ၊
      support agent ဆီ လွှဲပေးရမယ့် အချိန်ပါ။ ပတ်တိုင်းက request တစ်ခုစီ ဖြစ်တာမို့ ကုန်ကျစရိတ် တွက်တဲ့အခါမှာလည်း
      ticket တစ်ခုကို request တစ်ခုလို့ ယူဆလို့ မရတော့ပါဘူး။
      [[mark:why-hand]] ဒီ loop ကို ဘာကြောင့် ကိုယ်တိုင် ရေးကြည့်ရလဲ ဆိုတော့၊ SDK မှာ ဒီ loop ကို အလိုအလျောက်
      ပတ်ပေးတဲ့ helper ရှိပေမဲ့ အဲဒီ helper ထဲမှာလည်း ဒီ အဆင့်တွေပဲ ရှိနေလို့ပါ။ loop ကို နားလည်ထားမှ agent
      တစ်ခု မှားတဲ့အခါ ဘယ်အဆင့်မှာ မှားလဲ ရှာနိုင်ပါတယ်။ နောက်ပြီး ကိုယ်တိုင် ရေးထားတဲ့ loop မှာ tool မ run ခင်
      log ရေးတာ၊ လူ တစ်ယောက်ဆီ ခွင့်တောင်းတာမျိုးကို ကိုယ်လိုသလို ထည့်လို့ ရပါတယ်။
    sources:
      - {
          title: "Claude Docs: Handle tool calls",
          url: "https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls",
        }
      - {
          title: "Claude Docs: Handling stop reasons",
          url: "https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons",
        }
    actions:
      - {
          id: open-loop,
          type: workspace.openFile,
          at: { mark: c-open },
          path: reply-assistant/src/loop.ts,
        }
      - id: sel-create
        type: editor.select
        at: { mark: sel-create }
        target:
          file: reply-assistant/src/loop.ts
          text: '          name: "check_outage",'
      - id: type-done
        type: editor.type
        at: { mark: type-done }
        cadence: line-by-line
        target: { file: reply-assistant/src/loop.ts, after: "      messages,\n    });\n" }
        text: "    if (response.stop_reason === \"end_turn\") {\n      return response.content.map((b) => (b.type === \"text\" ? b.text : \"\")).join(\"\");\n    }\n"
      - id: type-keep
        type: editor.type
        at: { mark: type-keep }
        cadence: line-by-line
        target: { file: reply-assistant/src/loop.ts, after: ".join(\"\");\n    }\n" }
        text: "    if (response.stop_reason !== \"tool_use\") {\n      throw new Error(`stopped with ${response.stop_reason}`);\n    }\n    messages.push({ role: \"assistant\", content: response.content });\n"
      - id: type-run
        type: editor.type
        at: { mark: type-run }
        cadence: line-by-line
        target: { file: reply-assistant/src/loop.ts, after: "content: response.content });\n" }
        text: "    const results: Anthropic.ToolResultBlockParam[] = [];\n    for (const block of response.content) {\n      if (block.type !== \"tool_use\") continue;\n      const output = await checkOutage(block.input);\n      results.push({ type: \"tool_result\", tool_use_id: block.id, content: output });\n    }\n"
      - id: type-send
        type: editor.type
        at: { mark: type-send }
        cadence: line-by-line
        target: { file: reply-assistant/src/loop.ts, after: "content: output });\n    }\n" }
        text: "    messages.push({ role: \"user\", content: results });\n"
      - id: expect-send
        type: expect.file
        at: { afterAction: type-send }
        path: reply-assistant/src/loop.ts
        contains: "    messages.push({ role: \"user\", content: results });\n"
      - id: sel-limit
        type: editor.select
        at: { mark: sel-limit }
        target:
          file: reply-assistant/src/loop.ts
          text: "const MAX_TURNS = 5;"

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ နေခြည် ရဲ့ security တာဝန်ခံ က စိုးရိမ်ချက် တစ်ခု ပြောလာတယ်
      ဆိုပါစို့။ Claude ကို check outage tool ပေးလိုက်ရင် Claude က NMS ထဲ ကိုယ်တိုင် ဝင်ပြီး setting တွေကို
      ပြင်သွားနိုင်မလား ဆိုတာပါ။
      [[mark:q-a]] ပထမ အဖြေက ပြင်နိုင်ပါတယ်၊ tool ပေးလိုက်တာနဲ့ Claude က NMS နဲ့ တိုက်ရိုက် ချိတ်မိသွားလို့ပါ
      ဆိုတာပါ။
      [[mark:q-b]] ဒုတိယ အဖြေက မပြင်နိုင်ပါဘူး၊ NMS ကို ဘာလုပ်မလဲ ဆိုတာ ကိုယ်တို့ code က ဆုံးဖြတ်လို့ပါ ဆိုတာပါ။
      lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ တစ်ခုပါ။ ဘာကြောင့်လဲဆိုတော့ Claude ပြန်ပေးတာက tool use block ဆိုတဲ့
      JSON တောင်းဆိုချက် တစ်ခုပဲ ဖြစ်လို့ပါ။ NMS ကို တကယ် ခေါ်တာက check outage function ပါ။ အဲဒီ function က
      လိုင်းကျမှု အခြေအနေကို ဖတ်ရုံပဲ လုပ်ပြီး ဘာမှ ပြင်ခွင့် မရှိရင်၊ Claude က ဘယ်လိုပဲ တောင်းတောင်း NMS ထဲမှာ
      ဘာမှ ပြောင်းသွားမှာ မဟုတ်ပါဘူး။
      [[mark:q-rule]] ဒါကြောင့် agent တစ်ခု ဘာလုပ်နိုင်လဲ ဆိုတာကို model က မဟုတ်ဘဲ၊ ကိုယ်တို့ ပေးတဲ့ tool တွေနဲ့
      အဲဒီ tool နောက်က code က သတ်မှတ်ပါတယ်။ agent ရဲ့ security ကို စစ်ချင်ရင် tool တစ်ခုချင်းရဲ့ code ကို စစ်ပါ။
    sources:
      - {
          title: "Claude Docs: Handle tool calls",
          url: "https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: q-rule },
          upsertIds: [q-t1, q-t2],
          drawMs: 1600,
        }

  - id: your-turn
    chapter: ကိုယ့် agent အတွက်
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ကိုယ့် project အတွက် agent တစ်ခု ဆောက်မယ်
      ဆိုရင် ပထမဆုံး တောင်းလာမယ့် tool နှစ်ခုကို ဒီ tool စာရင်းရဲ့ အပေါ်မှာ comment နှစ်ကြောင်းနဲ့
      ရေးကြည့်ပါ။ tool တစ်ခုစီအတွက် နာမည်နဲ့ ဘယ် system ကို ဖတ်မလဲ ဆိုတာ ရေးပါ။ ဥပမာအားဖြင့် နေခြည်
      အတွက်ဆိုရင် NMS ကို ဖတ်တဲ့ check outage နဲ့၊ customer ရဲ့ plan ကို Billing ကနေ ဖတ်တဲ့ tool ပါ။
      [[mark:turn-2]] ရေးပြီးရင် tool တစ်ခုချင်းကို ဒီလို မေးကြည့်ပါ။ ဒီ tool က data ကို ဖတ်ရုံပဲလား၊ တစ်ခုခုကို
      ပြောင်းလဲလား ဆိုတာပါ။ ပြောင်းလဲတဲ့ tool ဆိုရင် program က မ run ခင် လူ တစ်ယောက်က ခွင့်ပြုဖို့ လိုမလား
      ဆိုတာကိုပါ တစ်ခါတည်း ရေးထားပါ။
    sources:
      - {
          title: "Claude Docs: Define tools",
          url: "https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: turn }, open: false }
      - id: sel-tools
        type: editor.select
        at: { mark: turn, offsetMs: 2200 }
        target:
          file: reply-assistant/src/loop.ts
          text: "      tools: ["
      - id: sel-stub
        type: editor.select
        at: { mark: turn-2 }
        target:
          file: reply-assistant/src/loop.ts
          text: "// Our code. Prototype stub: the real version will ask the NMS."

  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ request တစ်ခုက တစ်ဆင့်ပဲ ရှိပါတယ်။ agent loop က request ပို့၊ model က tool
      တောင်းလား ကြည့်၊ tool ကို run ပြီး ရလဒ်ကို ပြန်ပို့ ဆိုတာကို end turn ရတဲ့အထိ ထပ်ခါထပ်ခါ လုပ်ပါတယ်။
      [[mark:recap-2]] နောက်တစ်ဆင့်ကို model က ဆုံးဖြတ်ပြီး၊ အလုပ်ကို ကိုယ်တို့ program က လုပ်ပါတယ်။ loop တိုင်းမှာ
      အကြိမ်ရေ ကန့်သတ်ချက်လည်း ရှိရပါမယ်။
      [[mark:next]] နောက် lesson မှာတော့ model က tool ကို မှန်မှန်ကန်ကန် ရွေးနိုင်အောင် tool definition ကို ဘယ်လို
      ရေးမလဲ၊ ဒီ loop ကို SDK က ဘယ်လို လုပ်ပေးနိုင်လဲ ဆိုတဲ့ tool use ကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "Claude Docs: Tool runner (SDK)",
          url: "https://platform.claude.com/docs/en/agents-and-tools/tool-use/tool-runner",
        }
