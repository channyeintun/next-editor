          type: whiteboard.apply,
          at: { mark: r-open },
          open: true,
          clear: true,
          upsertIds: [l-title],
        }
      - {
          id: draw-r-one,
          type: whiteboard.apply,
          at: { mark: r-one },
          upsertIds: [l-model, l-model-l],
          drawMs: 1000,
        }
      - {
          id: draw-r-ask,
          type: whiteboard.apply,
          at: { mark: r-ask },
          upsertIds: [l-arc1, l-arc1-l],
          drawMs: 1000,
        }
      - {
          id: draw-r-code,
          type: whiteboard.apply,
          at: { mark: r-code },
          upsertIds: [l-code, l-code-l, l-a-nms, l-nms, l-nms-l],
          drawMs: 2000,
        }
      - {
          id: draw-r-back,
          type: whiteboard.apply,
          at: { mark: r-back },
          upsertIds: [l-arc2, l-arc2-l],
          drawMs: 1000,
        }
      - {
          id: draw-r-end,
          type: whiteboard.apply,
          at: { mark: r-end },
          upsertIds: [l-end],
          drawMs: 600,
        }
      - {
          id: draw-r-limit,
          type: whiteboard.apply,
          at: { mark: r-limit },
          upsertIds: [l-limit],
          drawMs: 700,
        }

  - id: example
    chapter: Tool use ဥပမာ
    narration: >
      [[mark:x-close]] model ရဲ့ တောင်းဆိုချက်က တကယ်တော့ ဘယ်လို ပုံစံလဲ ကြည့်ရအောင်။ ဒါက လှိုင်မြို့နယ်က
      ticket တစ်ခုအတွက် ပထမ request ရဲ့ response ဥပမာ တစ်ခုပါ။
      [[mark:sel-x-stop]] stop reason က tool use ဖြစ်နေပါတယ်။ ဆိုလိုတာက draft က မပြီးသေးဘဲ၊ model က ကိုယ်တို့ဘက်က
      တစ်ခုခု လုပ်ပေးဖို့ စောင့်နေတာပါ။
      [[mark:sel-x-block]] content ထဲမှာ text block အပြင် tool use block တစ်ခု ပါလာပါတယ်။ ဘယ် tool ကို ခေါ်ချင်လဲ
      ဆိုတဲ့ နာမည်နဲ့၊ ဘယ် မြို့နယ်အတွက်လဲ ဆိုတဲ့ input ပါပါတယ်။ input က JSON object ဖြစ်တာမို့ စာသားကို
      ရှာဖွေတာမျိုး မလုပ်ဘဲ field ကို တိုက်ရိုက် ဖတ်ရပါမယ်။
      [[mark:sel-x-id]] block မှာ id တစ်ခုလည်း ပါပါတယ်။ ရလဒ်ကို ပြန်ပို့တဲ့အခါ ဘယ် တောင်းဆိုချက်အတွက် ရလဒ်လဲ
      ဆိုတာကို ဒီ id နဲ့ တွဲပြီး ပြောရပါတယ်။ model က တစ်ခါတည်းမှာ tool တစ်ခုထက် ပိုပြီး တောင်းနိုင်တာမို့ ဒီ id က
      အရေးကြီးပါတယ်။
      [[mark:sel-x-text]] tool use block ရှေ့က text block ကတော့ model က ဘာလုပ်မလဲ ဆိုတာကို ပြောပြတဲ့ စာပါ။ customer
      ဆီ ပို့မယ့် draft မဟုတ်တာမို့ program က အဲဒီ စာကို draft အဖြစ် မယူရပါဘူး။
    sources:
      - {
          title: "Claude Docs: Define tools",
          url: "https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools",
        }
      - {
          title: "Claude Docs: Handle tool calls",
          url: "https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls",
        }
    actions:
      - { id: close-ring, type: whiteboard.apply, at: { mark: x-close }, open: false }
      - {
          id: open-ex,
          type: workspace.openFile,
          at: { afterAction: close-ring },
          path: examples/first-turn.example.json,
        }
      - id: sel-x-stop
        type: editor.select
