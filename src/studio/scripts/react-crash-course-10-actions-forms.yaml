build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 10210

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  # ------------------------------------------------------------------ 1
  - id: actions-idea
    chapter: "Action ဆိုတာ ဘာလဲ"
    narration: >
      lesson 4 မှာ form submit လုပ်တော့ preventDefault ကို ကိုယ်တိုင် ခေါ်ခဲ့ပြီး၊
      submitting အပိုင်းကိုတော့ ဒီ lesson မှာ Action တွေက လုပ်ပေးမယ်လို့
      ပြောခဲ့ပါတယ်။ ဒါဆို Action တွေကို ကြည့်ရအောင်။ [[mark:start-server]]
      ရှင်းပြနေတုန်း dev server ကို နောက်ကွယ်မှာ စ run ထားလိုက်ရအောင်။
      [[mark:draw-manual]] server ကို တကယ် ပို့မယ်ဆိုရင်တော့၊ ပို့နေဆဲလား state၊
      error state၊ preventDefault နဲ့ form ပြန်ရှင်းတဲ့ code တွေကို ကိုယ်တိုင်
      ရေးရပါတယ်။ [[mark:draw-action]] Action ဆိုတာ React က Transition ထဲမှာ run
      ပေးတဲ့ function ပါ၊ အများအားဖြင့် async function ပါ။ React ကိုယ်တိုင်
      ခေါ်ပေးတာ ဖြစ်လို့၊ စောင့်နေဆဲလား၊ error တက်လား၊ ပြီးပြီလား ဆိုတာ React က အမြဲ
      သိပါတယ်။ [[mark:draw-action-gives]] ဒါကြောင့် အဖြေ မရသေးတဲ့ pending ကာလနဲ့
      form ပြန်ရှင်းတာကို React က handle လုပ်ပေးပြီး၊ မမျှော်လင့်ထားတဲ့ error ကိုလည်း
      error boundary ဆီ ပို့ပေးပါတယ်။ [[mark:draw-hooks]] အဲဒီ အခြေအနေတွေကို
      ယူသုံးဖို့ hook အသစ် သုံးခုက useActionState၊ useFormStatus နဲ့ useOptimistic
      ပါ။
    sources:
      - title: "React 19 — Actions"
        url: "https://react.dev/blog/2024/12/05/react-19#actions"
      - title: "React — useTransition"
        url: "https://react.dev/reference/react/useTransition"
      - title: "React — <form>"
        url: "https://react.dev/reference/react-dom/components/form"
      - title: "Vite — Getting Started"
        url: "https://vite.dev/guide/"
    actions:
      - id: open-board-1
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [b1-title]
      - id: start-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 45000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-manual
        type: whiteboard.apply
        at: { mark: draw-manual }
        upsertIds:
          [b1-manual-box, b1-manual-head, b1-manual-l1, b1-manual-l2, b1-manual-l3, b1-manual-l4]
        drawMs: 3000
      - id: draw-action
        type: whiteboard.apply
        at: { mark: draw-action }
        upsertIds: [b1-arrow, b1-action-box, b1-action-head, b1-action-l1, b1-action-l2]
        drawMs: 2600
      - id: draw-action-gives
        type: whiteboard.apply
        at: { mark: draw-action-gives }
        upsertIds: [b1-action-l3, b1-action-underline, b1-action-l4]
        drawMs: 1800
      - id: draw-hooks
        type: whiteboard.apply
        at: { mark: draw-hooks }
        upsertIds: [b1-hooks]
        drawMs: 1200

  # ------------------------------------------------------------------ 2
  - id: api-code
    chapter: "အသေးဆုံး Action ရေးကြည့်ရအောင်"
    narration: >
      [[mark:close-board-1]] အရင်ဆုံး အဖြေ ပြန်ရတာ ကြာတဲ့ server တစ်ခု လိုပါတယ်။
      [[mark:open-api]] ဒီ api ဖိုင် အလွတ်ကို fake server အဖြစ် သုံးပါမယ်။
      [[mark:type-wait]] ဒီ helper က ပေးလိုက်တဲ့ အချိန် ကြာတဲ့အထိ စောင့်ပေးပြီး၊
      အော်ဒါ နံပါတ်တွေကတော့ 12 ကနေ စပါတယ်။ [[mark:type-place-order]] placeOrder
      ကတော့ network နှေးနေသလို 4 စက္ကန့် စောင့်ပါတယ်။ ပြီးတော့ နာမည် မပါရင် error
      ကို ပြန်ပေးပြီး၊ နာမည် ပါရင်တော့ နောက် အော်ဒါ နံပါတ်ကို ပြန်ပေးပါတယ်။
      [[mark:select-error-return]] error ပြန်ပေးတဲ့ ဒီ စာကြောင်းကို ကြည့်ပါ။ throw
      မလုပ်ဘဲ ပြန်ပေးထားတာပါ။ [[mark:why-no-throw]] throw လုပ်လိုက်ရင် lesson 9
      ကလိုပဲ error boundary ဆီ ရောက်သွားပြီး၊ ဆက်တိုက် submit လို့ တန်းစီ
      စောင့်နေတဲ့ Action တွေလည်း မ run တော့ပါဘူး။ နာမည် မထည့်တာက ဖြစ်တတ်တဲ့ ကိစ္စ
      ဖြစ်လို့ data အနေနဲ့ ပြန်ပေးတာပါ။
    sources:
      - title: "React — useActionState: Caveats"
        url: "https://react.dev/reference/react/useActionState#caveats"
      - title: "React — useTransition: Displaying an error to users with an error boundary"
        url: "https://react.dev/reference/react/useTransition#displaying-an-error-to-users-with-error-boundary"
      - title: "MDN — setTimeout()"
        url: "https://developer.mozilla.org/en-US/docs/Web/API/Window/setTimeout"
    actions:
      - id: close-board-1
        type: whiteboard.apply
        at: { mark: close-board-1 }
        open: false
      - id: collapse-dock-early
        type: runtime.collapseDock
        at: { afterAction: close-board-1 }
      - id: open-api
        type: workspace.openFile
        at: { mark: open-api }
        path: src/api.js
      - id: type-wait
        type: editor.type
        at: { mark: type-wait }
        cadence: line-by-line
        target: { file: src/api.js, after: "", occurrence: 1 }
        text: "const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));\n\nlet nextId = 12;\n"
      - id: type-place-order
        type: editor.type
        at: { mark: type-place-order }
        cadence: line-by-line
        target: { file: src/api.js, after: "let nextId = 12;\n", occurrence: 1 }
        text: "\nexport async function placeOrder(order) {\n  await wait(4000);\n  if (!order.name) {\n    return { error: \"နာမည် ထည့်ပါ\" };\n  }\n  return { orderId: nextId++ };\n}\n"
      - id: select-error-return
        type: editor.select
        at: { mark: select-error-return }
        target: { file: src/api.js, text: 'return { error: "နာမည် ထည့်ပါ" };', occurrence: 1 }

  # ------------------------------------------------------------------ 3
  - id: reorder-code
    narration: >
      [[mark:open-reorder]] အခု အသေးဆုံး Action တစ်ခု ရေးကြည့်ရအောင်။ အမြဲ လာပြီး
      တစ်မျိုးတည်းကိုပဲ ပြန်မှာတတ်တဲ့ ဧည့်သည် ကိုအောင်အတွက် ခလုတ် တစ်ခုပါ။
      [[mark:type-reorder-top]] placeOrder ကို import လုပ်ပြီး၊ နောက်ဆုံး ရတဲ့
      အော်ဒါ နံပါတ်ကို state ထဲ မှတ်ထားပါတယ်။ [[mark:type-use-transition]]
      useTransition က lesson 8 ကလိုပဲ၊ လုပ်နေဆဲလား ပြတဲ့ pending flag တစ်ခုနဲ့၊
      Transition စပေးမယ့် function တစ်ခုကို ပြန်ပေးပါတယ်။ [[mark:type-handle-click]]
      click handler က startTransition ကို async function တစ်ခု ပေးလိုက်ပါတယ်။ ဒါက
      Action ပါ။ function မပြီးမချင်း pending က true ဖြစ်နေပါမယ်။
      [[mark:select-inner-transition]] အထဲက ဒုတိယ startTransition ကို ကြည့်ပါ။ await
      နောက်က code ကို JavaScript က နောက်မှ သီးခြား run လို့၊ React က Transition ထဲက
      update မှန်း မသိတော့ပါဘူး။ ဒါကြောင့် ထပ်ထုပ်ပေးရတာပါ။
      [[mark:type-reorder-jsx]] pending ဖြစ်နေတုန်း ခလုတ်ကို ပိတ်ပြီး၊ ပို့နေပါတယ်
      ဆိုတဲ့ စာ ပြပါတယ်။
    sources:
      - title: "React — useTransition"
        url: "https://react.dev/reference/react/useTransition"
      - title: "React — startTransition"
        url: "https://react.dev/reference/react/startTransition"
      - title: "React 19 — Actions"
        url: "https://react.dev/blog/2024/12/05/react-19#actions"
    actions:
      - id: open-reorder
        type: workspace.openFile
        at: { mark: open-reorder }
        path: src/ReorderButton.jsx
      - id: type-reorder-top
        type: editor.type
        at: { mark: type-reorder-top }
        cadence: line-by-line
        target: { file: src/ReorderButton.jsx, after: "", occurrence: 1 }
        text: "import { useState, useTransition } from \"react\";\nimport { placeOrder } from \"./api.js\";\n\nexport default function ReorderButton() {\n  const [lastId, setLastId] = useState(null);\n"
      - id: type-use-transition
        type: editor.type
        at: { mark: type-use-transition }
        cadence: fast-explainer
        target:
          {
            file: src/ReorderButton.jsx,
            after: "  const [lastId, setLastId] = useState(null);\n",
            occurrence: 1,
          }
        text: "  const [isPending, startTransition] = useTransition();\n"
      - id: type-handle-click
        type: editor.type
        at: { mark: type-handle-click }
        cadence: line-by-line
        target:
          {
            file: src/ReorderButton.jsx,
            after: "  const [isPending, startTransition] = useTransition();\n",
            occurrence: 1,
          }
        text: "\n  function handleClick() {\n    startTransition(async () => {\n      const result = await placeOrder({ name: \"ကိုအောင်\", table: \"2\" });\n      startTransition(() => {\n        setLastId(result.orderId);\n      });\n    });\n  }\n"
      - id: select-inner-transition
        type: editor.select
        at: { mark: select-inner-transition }
        target:
          {
            file: src/ReorderButton.jsx,
            text: "      startTransition(() => {\n        setLastId(result.orderId);\n      });",
            occurrence: 1,
          }
      - id: type-reorder-jsx
        type: editor.type
        at: { mark: type-reorder-jsx }
        cadence: block
        target: { file: src/ReorderButton.jsx, after: "      });\n    });\n  }\n", occurrence: 1 }
        text: "\n  return (\n    <div className=\"row\">\n      <button data-testid=\"reorder\" onClick={handleClick} disabled={isPending}>\n        {isPending ? \"ပို့နေပါတယ်…\" : \"ကိုအောင် ထပ်မှာမယ်\"}\n      </button>\n      <span data-testid=\"reorder-result\">\n        {lastId && \"အော်ဒါ #\" + lastId + \" ရပါပြီ\"}\n      </span>\n    </div>\n  );\n}\n"

  # ------------------------------------------------------------------ 4
  - id: reorder-run
    narration: >
      ကဲ၊ page ပေါ် တင်ကြည့်ရအောင်။ [[mark:open-app-reorder]] App က အခုထိ header ပဲ
      ပြနေပါသေးတယ်။ [[mark:wire-reorder-import]] ReorderButton ရဲ့ import ကို အရင်
      ထည့်ပါမယ်။ ဒါမှ သုံးတဲ့အခါ နာမည် ရှိနေမှာပါ။ [[mark:wire-reorder-use]]
      ပြီးတော့ ခလုတ်ကို header အောက်မှာ ထည့်ပါတယ်။ [[mark:preview-opens]] dev server
      အသင့် ဖြစ်နေပြီမို့ preview ကို ဖွင့်လိုက်ရအောင်။ ပြီးရင် ခလုတ်ကို
      နှိပ်ကြည့်ရအောင်။ [[mark:click-reorder]] ခလုတ် ပိတ်သွားပြီး၊ ပို့နေပါတယ်
      ဆိုတဲ့ စာ ပေါ်လာပါတယ်။ [[mark:reorder-done]] 4 စက္ကန့် ကြာတော့ အော်ဒါ နံပါတ်
      12 ရောက်လာပါပြီ။ async function ပြီးသွားတာနဲ့ React က pending ကို သူ့ဘာသာ
      false ပြန်လုပ်ပေးတာပါ။
    sources:
      - title: "React — useTransition: Displaying a pending visual state"
        url: "https://react.dev/reference/react/useTransition#displaying-a-pending-visual-state"
      - title: "React — Importing and Exporting Components"
        url: "https://react.dev/learn/importing-and-exporting-components"
    actions:
      - id: open-app-reorder
        type: workspace.openFile
        at: { mark: open-app-reorder }
        path: src/App.jsx
      - id: wire-reorder-import
        type: editor.type
        at: { mark: wire-reorder-import }
        cadence: block
        target:
          { file: src/App.jsx, after: "import { Header } from \"./Header.jsx\";\n", occurrence: 1 }
        text: "import ReorderButton from \"./ReorderButton.jsx\";\n"
      - id: wire-reorder-use
        type: editor.type
        at: { mark: wire-reorder-use }
        cadence: block
        target: { file: src/App.jsx, after: "      <Header />\n", occurrence: 1 }
        text: "      <ReorderButton />\n"
      - id: wait-for-server
        type: runtime.waitForReady
        at: { mark: preview-opens }
        timeoutMs: 20000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-server }
        timeoutMs: 15000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-reorder-ready
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: reorder }
        textContains: "ကိုအောင် ထပ်မှာမယ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-tab-static
        type: expect.preview
        at: { afterAction: expect-reorder-ready }
        timeoutMs: 5000
        target: { by: testId, value: tab-title }
        textContains: "React သင်ခန်းစာ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: collapse-dock
        type: runtime.collapseDock
        at: { afterAction: expect-tab-static }
      - id: click-reorder
        type: preview.click
        at: { mark: click-reorder }
        timeoutMs: 5000
        target: { by: testId, value: reorder }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-reorder-pending
        type: expect.preview
        at: { afterAction: click-reorder }
        timeoutMs: 3000
        target: { by: testId, value: reorder }
        textContains: "ပို့နေပါတယ်"
        retry: { maxAttempts: 3, delayMs: 150 }
      - id: expect-reorder-done
        type: expect.preview
        at: { mark: reorder-done }
        timeoutMs: 5000
        target: { by: testId, value: reorder-result }
        textContains: "အော်ဒါ #12 ရပါပြီ"
        retry: { maxAttempts: 3, delayMs: 2500 }

  # ------------------------------------------------------------------ 5
  - id: form-loop
    chapter: "Form action နဲ့ useActionState"
    narration: >
      [[mark:board-form]] အော်ဒါ အများစုကတော့ form ကနေ လာပါတယ်။ React 19 မှာ form
      ရဲ့ action prop ထဲကို function တစ်ခု တိုက်ရိုက် ထည့်လို့ ရပါပြီ။
      [[mark:draw-form-data]] submit လုပ်ရင် React က input တွေရဲ့ တန်ဖိုးကို name
      အလိုက် FormData ဆိုတဲ့ object ထဲ စုပြီး၊ အဲဒီ function ကို FormData တစ်ခုတည်း
      ပေးပြီး ခေါ်ပါတယ်။ [[mark:draw-action-call]] useActionState နဲ့ ချိတ်ထားတဲ့
      Action ဆိုရင်တော့၊ React က လက်ရှိ state နဲ့ အဲဒီ FormData၊ နှစ်ခု ပေးပြီး
      ခေါ်ပါတယ်။ [[mark:draw-new-state]] Action ပြန်ပေးတဲ့ တန်ဖိုးက state အသစ်
      ဖြစ်သွားပြီး၊ screen ပေါ်မှာ ပြန်ပြပါတယ်။ [[mark:draw-use-action-state]]
      useActionState က ဒီ အဆင့်တွေကို ချိတ်ပေးပြီး၊ နောက်ဆုံး state၊ form ရဲ့ action
      ထဲ ထည့်မယ့် function နဲ့ pending flag၊ သုံးခု ပြန်ပေးပါတယ်။
    sources:
      - title: "React — useActionState"
        url: "https://react.dev/reference/react/useActionState"
      - title: "React — <form>: Handle form submission with a Server Function / action"
        url: "https://react.dev/reference/react-dom/components/form"
      - title: "MDN — FormData"
        url: "https://developer.mozilla.org/en-US/docs/Web/API/FormData"
    actions:
      - id: board-form
        type: whiteboard.apply
        at: { mark: board-form }
        open: true
        clear: true
        upsertIds: [b2-title, b2-form-box, b2-form-text]
