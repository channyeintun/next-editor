# React crash course, lesson 10 — Actions and form hooks (Burmese, my-MM).
#
# Story: lesson 4 called preventDefault and kept a "saved" flag by hand, and
# promised that Actions would take over the submitting part; a real server
# form would also need a "sending" state, an error state and a reset. React 19
# Actions hand that work to React. A fake server (api.js: placeOrder waits
# 4 s — long enough that the sentence each click opens still describes the
# pending UI at 70–95 ms/char — and ALWAYS resolves, returning { error } or
# { orderId }) is called first from the smallest
# Action (ReorderButton: startTransition(async …) from useTransition), then
# from an order form: useActionState + <form action>, a SubmitButton that
# reads useFormStatus, a second button with formAction (save a draft),
# useOptimistic for an instant "sending" row, and a <title> rendered by
# OrderList that React hoists into <head> (a pinned bar outside #root mirrors
# document.title because the preview iframe has no browser tab). The close
# lists React DOM 19's other resource features (mentions).
#
# Insert-only plan: api.js, ReorderButton.jsx, SubmitButton.jsx and
# OrderForm.jsx are pinned EMPTY and typed while nothing imports them
# (line-by-line, plus a few short fast-explainer lines). App.jsx, and later
# OrderForm.jsx and OrderList.jsx, are live: they only take `block` inserts of
# complete lines, or atomic suffix inserts into an identifier (", useState",
# ", useOptimistic", "Optimistic"). Every JS edit reloads the preview (state
# and the fake server's order counter start over), so every interaction comes
# after the last edit, and two Actions never overlap (while an async Action
# is pending, React holds other Actions' updates).
#
# The dev server starts during the first board and is first needed when the
# preview opens, about two and a half minutes later.
#
# Narration: Burmese (voice-script.md is the same text with ⟪marks⟫, plus the
# editor's notes). DESIGN.md is the brief; every visible string is Burmese.
