        type: whiteboard.apply
        at: { mark: draw-form-data }
        upsertIds: [b2-arrow-1, b2-fd-box, b2-fd-text, b2-fd-note]
        drawMs: 2000
      - id: draw-action-call
        type: whiteboard.apply
        at: { mark: draw-action-call }
        upsertIds: [b2-arrow-2, b2-action-box, b2-action-text, b2-action-arrow, b2-action-note]
        drawMs: 2400
      - id: draw-new-state
        type: whiteboard.apply
        at: { mark: draw-new-state }
        upsertIds: [b2-arrow-3, b2-state-box, b2-state-text, b2-screen]
