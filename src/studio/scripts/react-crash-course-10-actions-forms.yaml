      vite.config.js: |
        import { defineConfig } from "vite";

        export default defineConfig({
          // JSX through esbuild's automatic runtime: components never import React.
          esbuild: { jsx: "automatic" },
          // Pre-bundle every React entry up front so Vite never discovers a new
          // dependency mid-lesson and force-reloads the preview.
          optimizeDeps: {
            include: [
              "react",
              "react/jsx-dev-runtime",
              "react/jsx-runtime",
              "react-dom",
              "react-dom/client",
            ],
          },
        });
      index.html: |
        <!doctype html>
        <html lang="my">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>React သင်ခန်းစာ</title>
          </head>
          <body>
            <!-- The preview has no browser tab, so this bar mirrors document.title. -->
            <p class="tab-bar" data-testid="tab-title"></p>
            <div id="root"></div>
            <script>
              const tabBar = document.querySelector(".tab-bar");
              const showTitle = () => {
                tabBar.textContent = "tab ခေါင်းစဉ် · " + document.title;
              };
              new MutationObserver(showTitle).observe(document.head, {
                childList: true,
                subtree: true,
                characterData: true,
              });
              showTitle();
            </script>
            <script type="module" src="/src/main.jsx"></script>
          </body>
        </html>
