  # ------------------------------------------------------------------ 6
  - id: order-form-code
    narration: >
      [[mark:close-board-2]] ကဲ၊ form ကို ရေးကြည့်ရအောင်။ [[mark:open-order-form]]
      OrderForm က အလွတ်ပါ၊ ဘယ် ဖိုင်ကမှ import မလုပ်ရသေးပါဘူး။
      [[mark:type-form-top]] placeOrder၊ OrderList နဲ့ ခဏနေရင် ရေးမယ့် submit
      ခလုတ်ကို import လုပ်ပါတယ်။ state ကတော့ အော်ဒါ စာရင်း အလွတ်နဲ့ message အလွတ်ကနေ
      စပါတယ်။ [[mark:select-action-arg]] useActionState ခေါ်တဲ့ နေရာကို ကြည့်ပါ။
      ကိုယ့် Action နဲ့ စစချင်း state ကို ပေးရပါတယ်။ [[mark:type-form-action]]
      Action က FormData ကနေ နာမည်နဲ့ စားပွဲကို ဖတ်ပြီး placeOrder ကို ခေါ်ပါတယ်။
      error ပြန်လာရင် အော်ဒါ စာရင်းကို ဒီအတိုင်း ထားပြီး message ကိုပဲ ပြောင်းပါတယ်။
      အောင်မြင်ရင်တော့ အော်ဒါကို သူ့ နံပါတ်နဲ့ စာရင်းထဲ ထည့်ပါတယ်။
      [[mark:select-form-data]] Action က လက်ခံတဲ့ တန်ဖိုး နှစ်ခုကို ကြည့်ပါ။ လက်ရှိ
      state က ပထမ၊ FormData က ဒုတိယ ပါ။ ဒီ အစီအစဉ်ကို မှားတတ်ကြပါတယ်။
      [[mark:type-form-jsx]] form ရဲ့ action မှာ useActionState က ပေးတဲ့ function
      ကို ထည့်ပါတယ်။ input တွေမှာ FormData အတွက် name ပါပြီး၊ value အစား default
      တန်ဖိုးပဲ ပေးထားလို့ uncontrolled ပါ။ ရိုက်ထားတဲ့ စာကို browser ကပဲ
      မှတ်ထားတာပါ။
    sources:
      - title: "React — useActionState: Parameters"
        url: "https://react.dev/reference/react/useActionState#parameters"
      - title: "React — <form>"
        url: "https://react.dev/reference/react-dom/components/form"
      - title: "React — <input>: Providing an initial value for an input"
        url: "https://react.dev/reference/react-dom/components/input#providing-an-initial-value-for-an-input"
      - title: "MDN — FormData.get()"
        url: "https://developer.mozilla.org/en-US/docs/Web/API/FormData/get"
    actions:
      - id: close-board-2
        type: whiteboard.apply
        at: { mark: close-board-2 }
        open: false
      - id: open-order-form
        type: workspace.openFile
        at: { mark: open-order-form }
        path: src/OrderForm.jsx
      - id: type-form-top
        type: editor.type
        at: { mark: type-form-top }
        cadence: line-by-line
        target: { file: src/OrderForm.jsx, after: "", occurrence: 1 }
        text: "import { useActionState } from \"react\";\nimport { placeOrder } from \"./api.js\";\nimport OrderList from \"./OrderList.jsx\";\nimport SubmitButton from \"./SubmitButton.jsx\";\n\nexport default function OrderForm() {\n  const [state, formAction] = useActionState(placeOrderAction, {\n    orders: [],\n    message: \"\",\n  });\n  const orders = state.orders;\n"
      - id: select-action-arg
        type: editor.select
        at: { mark: select-action-arg }
        target:
          { file: src/OrderForm.jsx, text: "useActionState(placeOrderAction, {", occurrence: 1 }
      - id: type-form-action
        type: editor.type
        at: { mark: type-form-action }
        cadence: line-by-line
        target:
          { file: src/OrderForm.jsx, after: "  const orders = state.orders;\n", occurrence: 1 }
        text: "\n  async function placeOrderAction(prevState, formData) {\n    const order = { name: formData.get(\"name\"), table: formData.get(\"table\") };\n    const result = await placeOrder(order);\n    if (result.error) {\n      return { ...prevState, message: result.error };\n    }\n    return {\n      orders: [...prevState.orders, { ...order, id: result.orderId }],\n      message: \"အော်ဒါ #\" + result.orderId + \" ရပါပြီ\",\n    };\n  }\n"
      - id: select-form-data
        type: editor.select
        at: { mark: select-form-data }
        target:
          { file: src/OrderForm.jsx, text: "placeOrderAction(prevState, formData)", occurrence: 1 }
      - id: type-form-jsx
        type: editor.type
        at: { mark: type-form-jsx }
        cadence: block
        target:
          {
            file: src/OrderForm.jsx,
            after: "      message: \"အော်ဒါ #\" + result.orderId + \" ရပါပြီ\",\n    };\n  }\n",
            occurrence: 1,
          }
        text: "\n  return (\n    <section className=\"card\">\n      <h2>အော်ဒါ တင်ရန်</h2>\n      <form action={formAction} className=\"order-form\">\n        <label>\n          နာမည်\n          <input name=\"name\" defaultValue=\"\" data-testid=\"name-input\" />\n        </label>\n        <label>\n          စားပွဲ\n          <input name=\"table\" defaultValue=\"1\" data-testid=\"table-input\" />\n        </label>\n        <div className=\"row\">\n          <SubmitButton />\n        </div>\n      </form>\n      <p data-testid=\"order-message\">{state.message}</p>\n      <OrderList orders={orders} />\n    </section>\n  );\n}\n"

  # ------------------------------------------------------------------ 7
  - id: submit-button
    narration: >
      [[mark:open-submit]] submit ခလုတ် ရေးရအောင်။ [[mark:type-submit-top]]
      useFormStatus ကို react ကနေ မဟုတ်ဘဲ react-dom ကနေ import လုပ်ရပါတယ်။
      [[mark:type-form-status]] သူက ဒီ component ပါနေတဲ့ form ကို ကြည့်ပြီး၊ အဲဒီ
      form က အခု submit လုပ်နေဆဲလား ဆိုတာကို pending နဲ့ ပြောပြပါတယ်။
      [[mark:type-submit-jsx]] pending ဖြစ်နေတုန်း ခလုတ်ကို ပိတ်ထားပြီး၊ စာသားကလည်း
      ပို့နေပါတယ် လို့ ပြောင်းသွားပါတယ်။ [[mark:form-status-rule]] useFormStatus ကို
      form ရဲ့ အထဲမှာ render လုပ်တဲ့ component ကနေပဲ ခေါ်ရပါတယ်။ form ကို render
      လုပ်တဲ့ component ထဲမှာ ခေါ်ရင် pending က အမြဲ false ပါ။ ဒါကြောင့် ခလုတ်ကို
      component သီးသန့် ခွဲပြီး၊ OrderForm မှာလည်း useActionState ရဲ့ pending ကို
      မယူတော့ပါဘူး။
    sources:
      - title: "React — useFormStatus"
        url: "https://react.dev/reference/react-dom/hooks/useFormStatus"
      - title: "React — useFormStatus: Caveats"
        url: "https://react.dev/reference/react-dom/hooks/useFormStatus#caveats"
    actions:
      - id: open-submit
        type: workspace.openFile
        at: { mark: open-submit }
        path: src/SubmitButton.jsx
      - id: type-submit-top
        type: editor.type
        at: { mark: type-submit-top }
        cadence: line-by-line
        target: { file: src/SubmitButton.jsx, after: "", occurrence: 1 }
        text: "import { useFormStatus } from \"react-dom\";\n\nexport default function SubmitButton() {\n"
      - id: type-form-status
        type: editor.type
        at: { mark: type-form-status }
        cadence: fast-explainer
        target:
          {
            file: src/SubmitButton.jsx,
            after: "export default function SubmitButton() {\n",
            occurrence: 1,
          }
        text: "  const { pending } = useFormStatus();\n"
      - id: type-submit-jsx
        type: editor.type
        at: { mark: type-submit-jsx }
        cadence: line-by-line
        target:
          {
            file: src/SubmitButton.jsx,
            after: "  const { pending } = useFormStatus();\n",
            occurrence: 1,
          }
        text: "  return (\n    <button data-testid=\"submit-order\" disabled={pending}>\n      {pending ? \"ပို့နေပါတယ်…\" : \"မှာမယ်\"}\n    </button>\n  );\n}\n"

  # ------------------------------------------------------------------ 8
  - id: order-form-run
    narration: >
      [[mark:open-app-form]] App ထဲ form ကို ထည့်ကြည့်ရအောင်။
      [[mark:wire-form-import]] import ကို အရင် ထည့်ပါတယ်။ [[mark:wire-form-use]]
      ပြီးတော့ form ကို header အောက်မှာ ထည့်ပါတယ်။ ဖိုင် ပြင်တိုင်း page
      ပြန်ပွင့်ပြီး၊ fake server ကလည်း browser ထဲမှာပဲ ရှိလို့၊ အော်ဒါ နံပါတ်က 12 ကနေ
      ပြန်စပါတယ်။ နာမည် မထည့်ဘဲ submit လုပ်ကြည့်ရအောင်။ [[mark:click-submit-empty]]
      ခလုတ် ပိတ်သွားပြီး၊ ပို့နေပါတယ် လို့ ပြနေပါတယ်။ [[mark:empty-error]] ပြီးတော့
      နာမည် ထည့်ပါ ဆိုတဲ့ error ပေါ်လာပါတယ်။ Action က ပြန်ပေးတဲ့ state ကနေ
      ရောက်လာတာပါ။ [[mark:fill-name]] အခု နာမည် ထည့်ပြီး၊ [[mark:fill-table]] စားပွဲ
      နံပါတ်ကို 3 လို့ ပြောင်းကြည့်ရအောင်။ [[mark:click-submit-order]] submit
      လုပ်ပြီး server ကို 4 စက္ကန့် စောင့်ပေးရအောင်။ [[mark:order-placed]] အော်ဒါ 12
      က စာရင်းထဲ ရောက်လာပါပြီ။ [[mark:form-reset]] input တွေလည်း မူလ တန်ဖိုး
      ပြန်ဖြစ်သွားပါပြီ။ Action က throw မလုပ်ရင်၊ submit တိုင်း ပြီးတဲ့အခါ React က
      uncontrolled input တွေကို ပြန်ရှင်းပေးပါတယ်။ ခုနက error submit မှာလည်း
      ဒီအတိုင်းပါပဲ။ [[mark:no-prevent-default]] page ပြန်မပွင့်အောင် React က
      သူ့ဘာသာ handle လုပ်ပေးလို့၊ lesson 4 လို preventDefault ခေါ်စရာ မလိုတော့ပါဘူး။
      ကိုယ်တိုင် ပြန်ရှင်းချင်ရင်တော့ react-dom မှာ requestFormReset ရှိပါတယ်။
    sources:
      - title: "React — <form>"
        url: "https://react.dev/reference/react-dom/components/form"
      - title: "React 19 — Form Actions (automatic reset, requestFormReset)"
        url: "https://react.dev/blog/2024/12/05/react-19#form-actions"
      - title: "React — useFormStatus"
        url: "https://react.dev/reference/react-dom/hooks/useFormStatus"
      - title: "React — useActionState"
        url: "https://react.dev/reference/react/useActionState"
    actions:
      - id: open-app-form
        type: workspace.openFile
        at: { mark: open-app-form }
        path: src/App.jsx
      - id: wire-form-import
        type: editor.type
        at: { mark: wire-form-import }
        cadence: block
        target:
          {
            file: src/App.jsx,
            after: "import ReorderButton from \"./ReorderButton.jsx\";\n",
            occurrence: 1,
          }
        text: "import OrderForm from \"./OrderForm.jsx\";\n"
      - id: wire-form-use
        type: editor.type
        at: { mark: wire-form-use }
        cadence: block
        target: { file: src/App.jsx, after: "      <Header />\n", occurrence: 1 }
        text: "      <OrderForm />\n"
      - id: expect-form-ready
        type: expect.preview
        at: { mark: click-submit-empty, offsetMs: -700 }
        timeoutMs: 5000
        target: { by: testId, value: submit-order }
        textContains: "မှာမယ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: click-submit-empty
        type: preview.click
        at: { mark: click-submit-empty }
        timeoutMs: 5000
        target: { by: testId, value: submit-order }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-submit-pending
        type: expect.preview
        at: { afterAction: click-submit-empty }
        timeoutMs: 3000
        target: { by: testId, value: submit-order }
        textContains: "ပို့နေပါတယ်"
        retry: { maxAttempts: 3, delayMs: 150 }
      - id: expect-empty-error
        type: expect.preview
        at: { mark: empty-error }
        timeoutMs: 5000
        target: { by: testId, value: order-message }
        textContains: "နာမည် ထည့်ပါ"
        retry: { maxAttempts: 3, delayMs: 2500 }
      - id: fill-name
        type: preview.input
        at: { mark: fill-name }
        timeoutMs: 5000
        target: { by: testId, value: name-input }
        value: "မမြ"
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: fill-table
        type: preview.input
        at: { mark: fill-table }
        timeoutMs: 5000
        target: { by: testId, value: table-input }
        value: "3"
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-filled
        type: expect.preview
        at: { afterAction: fill-table }
        timeoutMs: 5000
        target: { by: testId, value: table-input }
        value: "3"
        retry: { maxAttempts: 3, delayMs: 200 }
      - id: click-submit-order
        type: preview.click
        at: { mark: click-submit-order }
        timeoutMs: 5000
        target: { by: testId, value: submit-order }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-order-placed
        type: expect.preview
        at: { mark: order-placed }
        timeoutMs: 5000
        target: { by: testId, value: order-message }
        textContains: "အော်ဒါ #12 ရပါပြီ"
        retry: { maxAttempts: 3, delayMs: 2500 }
      - id: expect-order-row
        type: expect.preview
        at: { afterAction: expect-order-placed }
        timeoutMs: 5000
        target: { by: testId, value: order-list }
        textContains: "မမြ · စားပွဲ 3"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-name-reset
        type: expect.preview
        at: { mark: form-reset }
        timeoutMs: 5000
        target: { by: testId, value: name-input }
        value: ""
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-table-reset
        type: expect.preview
        at: { afterAction: expect-name-reset }
        timeoutMs: 5000
        target: { by: testId, value: table-input }
        value: "1"
        retry: { maxAttempts: 3, delayMs: 300 }

  # ------------------------------------------------------------------ 9
  - id: draft-button
    narration: >
      [[mark:open-form-draft]] form မှာ မူကြမ်း သိမ်းတာလို တခြား အလုပ် လုပ်မယ့်
      ဒုတိယ ခလုတ်လည်း ထည့်လို့ ရပါတယ်။ [[mark:type-use-state-import]] useState ကို
      import ထဲ ထည့်ပါတယ်။ [[mark:type-save-draft]] saveDraft ကို useActionState နဲ့
      မချိတ်ထားလို့၊ state မပါဘဲ FormData တစ်ခုတည်းကိုပဲ ရပါတယ်။ အဲဒီထဲက နာမည်ကို
      မူကြမ်း state ထဲ မှတ်ထားပါတယ်။ [[mark:type-draft-button]] ဒုတိယ ခလုတ်မှာ
      formAction ဆိုတဲ့ prop နဲ့ saveDraft ကို ပေးထားပါတယ်။ ခုနက useActionState
      ပေးတဲ့ function နဲ့ နာမည် တူပေမယ့်၊ ဒါက ခလုတ်ရဲ့ prop ပါ။ ဒီ ခလုတ်နဲ့ submit
      လုပ်ရင် form ရဲ့ action အစား saveDraft ကို ခေါ်ပါတယ်။ [[mark:fill-draft-name]]
      နာမည် ရိုက်ကြည့်ရအောင်။ [[mark:click-draft]] ပြီးရင် မူကြမ်း သိမ်းပါမယ်။
      [[mark:draft-saved]] မူကြမ်း ပေါ်လာပြီး၊ form လည်း ပြန်ရှင်းသွားပါတယ်။
      saveDraft က async မဟုတ်ပေမဲ့ formAction ကနေ ခေါ်တာမို့ Action ပဲ ဖြစ်လို့ပါ။
      မလိုချင်ရင်တော့ input ကို controlled လုပ်ထားနိုင်ပါတယ်။
      [[mark:one-action-at-a-time]] lesson 8 က ခြွင်းချက်ကလည်း Action နဲ့
      ဆိုင်ပါတယ်။ async Action pending ဖြစ်နေတုန်း တခြား Action တွေရဲ့ update က အဲဒီ
      Action ပြီးမှ ပေါ်ပါတယ်။ ဥပမာ အော်ဒါ ပို့နေတုန်း မူကြမ်း သိမ်းရင်၊ မူကြမ်းက
      အော်ဒါ ပြီးမှ ပေါ်ပါမယ်။
    sources:
      - title: "React — <button>: formAction"
        url: "https://react.dev/reference/react-dom/components/button"
      - title: "React — <form>: Handling multiple submission types"
        url: "https://react.dev/reference/react-dom/components/form#handling-multiple-submission-types"
      - title: "React 19.3 — Independent Transitions"
        url: "https://react.dev/blog/2026/09/09/react-19-3"
      - title: "MDN — HTMLButtonElement.formAction"
        url: "https://developer.mozilla.org/en-US/docs/Web/API/HTMLButtonElement/formAction"
    actions:
      - id: open-form-draft
        type: workspace.openFile
        at: { mark: open-form-draft }
        path: src/OrderForm.jsx
      - id: type-use-state-import
        type: editor.type
        at: { mark: type-use-state-import }
        cadence: block
        target: { file: src/OrderForm.jsx, after: "import { useActionState", occurrence: 1 }
        text: ", useState"
      - id: type-save-draft
        type: editor.type
        at: { mark: type-save-draft }
        cadence: block
        target:
          {
            file: src/OrderForm.jsx,
            after: "export default function OrderForm() {\n",
            occurrence: 1,
          }
        text: "  const [draft, setDraft] = useState(\"\");\n\n  function saveDraft(formData) {\n    setDraft(formData.get(\"name\"));\n  }\n\n"
      - id: type-draft-button
        type: editor.type
        at: { mark: type-draft-button }
        cadence: block
        target: { file: src/OrderForm.jsx, after: "          <SubmitButton />\n", occurrence: 1 }
        text: "          <button className=\"secondary\" formAction={saveDraft} data-testid=\"save-draft\">\n            မူကြမ်း သိမ်းမယ်\n          </button>\n          <span className=\"muted\" data-testid=\"draft\">\n            {draft && \"မူကြမ်း – \" + draft}\n          </span>\n"
      - id: expect-draft-ready
        type: expect.preview
        at: { mark: fill-draft-name, offsetMs: -700 }
        timeoutMs: 5000
        target: { by: testId, value: save-draft }
        textContains: "မူကြမ်း သိမ်းမယ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: fill-draft-name
        type: preview.input
        at: { mark: fill-draft-name }
        timeoutMs: 5000
        target: { by: testId, value: name-input }
        value: "ကိုကို"
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: click-draft
        type: preview.click
        at: { mark: click-draft }
        timeoutMs: 5000
        target: { by: testId, value: save-draft }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-draft-saved
        type: expect.preview
        at: { mark: draft-saved }
        timeoutMs: 5000
        target: { by: testId, value: draft }
        textContains: "မူကြမ်း – ကိုကို"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-draft-reset
        type: expect.preview
        at: { afterAction: expect-draft-saved }
        timeoutMs: 5000
        target: { by: testId, value: name-input }
        value: ""
        retry: { maxAttempts: 3, delayMs: 300 }

  # ------------------------------------------------------------------ 10
  - id: optimistic
    chapter: "useOptimistic နဲ့ ကြိုပြရအောင်"
    narration: >
      [[mark:board-optimistic]] 4 စက္ကန့် စောင့်ရတာ ကြာပါတယ်။ ပြီးတော့ အော်ဒါ
      အများစုက အောင်မြင်ကြပါတယ်။ [[mark:draw-optimistic-row]] ဒါကြောင့်
      useOptimistic က Action pending ဖြစ်နေတုန်း အောင်မြင်မယ်လို့ ယူဆပြီး၊ ရလဒ်ကို
      ယာယီ ကြိုပြပေးပါတယ်။ row အသစ်က ချက်ချင်း ပေါ်လာတာပါ။ [[mark:draw-real-row]]
      Action ပြီးတော့ React က ယာယီ တန်ဖိုးကို ဖယ်ပြီး၊ နံပါတ် ပါတဲ့ တကယ့် state ကို
      ပြပါတယ်။ [[mark:draw-revert]] အော်ဒါ မအောင်မြင်လို့ တကယ့် state
      မပြောင်းရင်တော့၊ ယာယီ row ပျောက်သွားပါတယ်။ ယာယီ တန်ဖိုး ထည့်တဲ့ function
      ကိုတော့ Action ဒါမှမဟုတ် Transition ထဲမှာပဲ ခေါ်ရပါတယ်။ [[mark:close-board-3]]
      ကဲ၊ ထည့်ကြည့်ရအောင်။ [[mark:type-optimistic-import]] အရင်ဆုံး useOptimistic
      ကို import ထဲ ထည့်ပါတယ်။ [[mark:type-optimistic-hook]] useOptimistic က တကယ့်
      စာရင်းနဲ့၊ ယာယီ အော်ဒါကို အဆုံးမှာ ထပ်ထည့်ပေးမယ့် function ကို လက်ခံပြီး၊
      ပြရမယ့် စာရင်းနဲ့ ယာယီ အော်ဒါ ထည့်မယ့် function ကို ပြန်ပေးပါတယ်။
      [[mark:type-add-optimistic]] Action က server ကို မစောင့်ခင် အော်ဒါကို
      ကြိုထည့်ပါတယ်။ [[mark:type-optimistic-suffix]] ပြီးတော့ OrderList ကို
      optimistic စာရင်း ပေးပါတယ်။ [[mark:open-order-list]] OrderList ကတော့ အသင့်
      ပြင်ထားပြီးသားပါ။ [[mark:select-sending-badge]] ဒီ condition ကို ကြည့်ပါ၊
      ပို့နေဆဲ အော်ဒါဆိုရင် လိမ္မော်ရောင် badge ပြပါတယ်။
      [[mark:fill-optimistic-name]] ထပ်မှာပြီး submit လုပ်ကြည့်ရအောင်။ စာရင်းကို
      ကြည့်ထားပါ။ [[mark:click-optimistic-submit]] row က ပို့နေဆဲ badge နဲ့
      ချက်ချင်း ပေါ်လာပါပြီ။ [[mark:confirmed-row]] အခုတော့ row က သူ့ နံပါတ်နဲ့
      အတည်ဖြစ်သွားပါပြီ။
    sources:
      - title: "React — useOptimistic"
        url: "https://react.dev/reference/react/useOptimistic"
      - title: "React 19 — New hook: useOptimistic"
        url: "https://react.dev/blog/2024/12/05/react-19#new-hook-optimistic-updates"
      - title: "React — useOptimistic: Optimistically updating forms"
        url: "https://react.dev/reference/react/useOptimistic#optimistically-updating-with-forms"
    actions:
      - id: board-optimistic
        type: whiteboard.apply
        at: { mark: board-optimistic }
        open: true
        clear: true
        upsertIds: [b3-title, b3-click-box, b3-click-text]
      - id: draw-optimistic-row
        type: whiteboard.apply
        at: { mark: draw-optimistic-row }
        upsertIds: [b3-arrow-1, b3-temp-box, b3-temp-text, b3-temp-note]
        drawMs: 2000
      - id: draw-real-row
        type: whiteboard.apply
        at: { mark: draw-real-row }
        upsertIds: [b3-arrow-2, b3-real-box, b3-real-text, b3-real-note]
        drawMs: 2000
      - id: draw-revert
        type: whiteboard.apply
        at: { mark: draw-revert }
        upsertIds: [b3-fail-arrow, b3-fail, b3-rule]
        drawMs: 2200
      - id: close-board-3
        type: whiteboard.apply
        at: { mark: close-board-3 }
        open: false
      - id: type-optimistic-import
        type: editor.type
        at: { mark: type-optimistic-import }
        cadence: block
        target:
          { file: src/OrderForm.jsx, after: "import { useActionState, useState", occurrence: 1 }
        text: ", useOptimistic"
      - id: type-optimistic-hook
        type: editor.type
        at: { mark: type-optimistic-hook }
        cadence: block
        target:
          { file: src/OrderForm.jsx, after: "  const orders = state.orders;\n", occurrence: 1 }
        text: "  const [ordersOptimistic, addOptimistic] = useOptimistic(\n    orders,\n    (list, order) => [...list, { ...order, id: \"new\", sending: true }],\n  );\n"
      - id: type-add-optimistic
        type: editor.type
        at: { mark: type-add-optimistic }
        cadence: block
        target:
          {
            file: src/OrderForm.jsx,
            after: "    const order = { name: formData.get(\"name\"), table: formData.get(\"table\") };\n",
            occurrence: 1,
          }
        text: "    addOptimistic(order);\n"
      - id: type-optimistic-suffix
        type: editor.type
        at: { mark: type-optimistic-suffix }
        cadence: block
        target: { file: src/OrderForm.jsx, after: "<OrderList orders={orders", occurrence: 1 }
        text: "Optimistic"
      - id: open-order-list
        type: workspace.openFile
        at: { mark: open-order-list }
        path: src/OrderList.jsx
      - id: select-sending-badge
        type: editor.select
        at: { mark: select-sending-badge }
        target:
          {
            file: src/OrderList.jsx,
            text: "{order.sending ? (\n              <span className=\"badge warn\">ပို့နေဆဲ…</span>",
            occurrence: 1,
          }
      - id: expect-optimistic-ready
        type: expect.preview
        at: { mark: fill-optimistic-name, offsetMs: -700 }
        timeoutMs: 5000
        target: { by: testId, value: name-input }
        value: ""
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: fill-optimistic-name
        type: preview.input
        at: { mark: fill-optimistic-name }
        timeoutMs: 5000
        target: { by: testId, value: name-input }
        value: "ဒေါ်လှ"
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: click-optimistic-submit
        type: preview.click
        at: { mark: click-optimistic-submit }
        timeoutMs: 5000
        target: { by: testId, value: submit-order }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-optimistic-row
        type: expect.preview
        at: { afterAction: click-optimistic-submit }
        timeoutMs: 3000
        target: { by: testId, value: order-list }
        textContains: "ပို့နေဆဲ"
        retry: { maxAttempts: 3, delayMs: 150 }
      - id: expect-confirmed-row
        type: expect.preview
        at: { mark: confirmed-row }
        timeoutMs: 5000
        target: { by: testId, value: order-list }
        textContains: "#12"
        retry: { maxAttempts: 3, delayMs: 2500 }
      - id: expect-confirmed-name
        type: expect.preview
        at: { afterAction: expect-confirmed-row }
        timeoutMs: 5000
        target: { by: testId, value: order-list }
        textContains: "ဒေါ်လှ · စားပွဲ 1"
        retry: { maxAttempts: 3, delayMs: 300 }

  # ------------------------------------------------------------------ 11
  - id: title-metadata
    chapter: "Component ထဲက title"
    narration: >
      နောက်ဆုံး တစ်ခုက page ရဲ့ title ပါ။ React 19 မတိုင်ခင်က title ကို ပြောင်းဖို့
      effect ထဲမှာ ကိုယ်တိုင် ပြင်ရပါတယ်။ အခုတော့ title tag ကို component ထဲမှာ
      render လုပ်ရုံပါပဲ။ preview မှာ tab မရှိလို့၊ အပေါ်ဆုံးက မီးခိုးရောင် bar မှာ
      title ကို ပြထားပါတယ်။ [[mark:type-title]] OrderList ထဲမှာ အော်ဒါ အရေအတွက်
      ပါတဲ့ title ကို render လုပ်ပါတယ်။ စာသားနဲ့ တန်ဖိုးကို ခွဲရေးရင် children
      အများကြီး ဖြစ်ပြီး React က warning ပေးလို့၊ စာသားထဲ တန်ဖိုး ထည့်ရေးလို့ ရတဲ့
      template string တစ်ခုတည်းနဲ့ ရေးထားတာပါ။ [[mark:title-hoist]] React က ဒီ title
      ကို component ထဲကနေ head ထဲ ရွှေ့ပေးလို့၊ bar မှာ အော်ဒါ 0 ခု လို့ ပြနေပါပြီ။
      [[mark:fill-title-name]] နောက် တစ်ကြိမ် ထပ်မှာပြီး submit လုပ်ကြည့်ရအောင်။
      [[mark:click-title-submit]] bar မှာ အော်ဒါ 1 ခု လို့ ချက်ချင်း
      ပြောင်းသွားပါတယ်၊ optimistic စာရင်းကို ရေတွက်နေလို့ပါ။
      [[mark:title-confirmed]] ပြီးတော့ အော်ဒါ အတည်ဖြစ်သွားပြီး၊ title ကလည်း state
      နဲ့ အမြဲ ကိုက်နေပါတယ်။
    sources:
      - title: "React — <title>"
        url: "https://react.dev/reference/react-dom/components/title"
      - title: "React 19 — Support for Document Metadata"
        url: "https://react.dev/blog/2024/12/05/react-19#support-for-metadata-tags"
      - title: "MDN — Template literals"
        url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Template_literals"
      - title: "MDN — Document.title"
        url: "https://developer.mozilla.org/en-US/docs/Web/API/Document/title"
    actions:
      - id: type-title
        type: editor.type
        at: { mark: type-title }
        cadence: block
        target:
          { file: src/OrderList.jsx, after: "    <section className=\"orders\">\n", occurrence: 1 }
        text: "      <title>{`ရွှေရန်ကုန် · အော်ဒါ ${orders.length} ခု`}</title>\n"
      - id: expect-title-zero
        type: expect.preview
        at: { mark: title-hoist }
        timeoutMs: 5000
        target: { by: testId, value: tab-title }
        textContains: "ရွှေရန်ကုန် · အော်ဒါ 0 ခု"
        retry: { maxAttempts: 3, delayMs: 400 }
      - id: fill-title-name
        type: preview.input
        at: { mark: fill-title-name }
        timeoutMs: 5000
        target: { by: testId, value: name-input }
        value: "ဦးဘ"
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: click-title-submit
        type: preview.click
        at: { mark: click-title-submit }
        timeoutMs: 5000
        target: { by: testId, value: submit-order }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-title-one
        type: expect.preview
        at: { afterAction: click-title-submit }
        timeoutMs: 3000
        target: { by: testId, value: tab-title }
        textContains: "အော်ဒါ 1 ခု"
        retry: { maxAttempts: 3, delayMs: 150 }
      # Same moment, still optimistic: the count of 1 comes from the
      # temporary row, not from a confirmed order.
      - id: expect-title-optimistic-row
        type: expect.preview
        at: { afterAction: expect-title-one }
        timeoutMs: 3000
        target: { by: testId, value: order-list }
        textContains: "ပို့နေဆဲ"
        retry: { maxAttempts: 3, delayMs: 150 }
      - id: expect-title-confirmed
        type: expect.preview
        at: { mark: title-confirmed }
        timeoutMs: 5000
        target: { by: testId, value: order-list }
        textContains: "#12"
        retry: { maxAttempts: 3, delayMs: 2500 }
      - id: expect-title-confirmed-name
        type: expect.preview
        at: { afterAction: expect-title-confirmed }
        timeoutMs: 5000
        target: { by: testId, value: order-list }
        textContains: "ဦးဘ · စားပွဲ 1"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-title-still-one
        type: expect.preview
        at: { afterAction: expect-title-confirmed-name }
        timeoutMs: 5000
        target: { by: testId, value: tab-title }
        textContains: "အော်ဒါ 1 ခု"
        retry: { maxAttempts: 3, delayMs: 300 }

  # ------------------------------------------------------------------ 12
  - id: dom-extras-recap
    chapter: "React DOM 19 ရဲ့ တခြား feature တွေ"
    narration: >
      [[mark:board-dom]] React DOM 19 မှာ ဒီလို feature တွေ ထပ်ရှိပါသေးတယ်။
      [[mark:draw-meta]] meta နဲ့ link tag တွေကိုလည်း head ထဲ ရွှေ့ပေးပါတယ်။
      [[mark:draw-style]] stylesheet ကို precedence နဲ့ ပေးထားရင်၊ React က အဲဒီ
      အဆင့်အလိုက် head ထဲမှာ စီပြီး၊ component ဘယ်နှစ်ခုက render လုပ်လုပ် တစ်ခါပဲ
      load လုပ်ပါတယ်။ [[mark:draw-script]] async script ကိုလည်း ဒီအတိုင်း တစ်ခါပဲ
      run ပါတယ်။ [[mark:draw-preload]] preload က လိုလာမယ့် ဖိုင်ကို ကြို load
      လုပ်ခိုင်းတာ ဖြစ်ပြီး၊ preinit ကတော့ load ပြီးတာနဲ့ run ဒါမှမဟုတ် apply ပါ
      လုပ်ပေးပါတယ်။ [[mark:draw-custom]] ကိုယ်တိုင် သတ်မှတ်ထားတဲ့ HTML tag ဖြစ်တဲ့
      custom element တွေကိုလည်း props မှန်မှန် ပေးလို့ ရပါပြီ။ [[mark:draw-js-url]]
      javascript နဲ့ စတဲ့ link လိပ်စာက နှိပ်တာနဲ့ code run နိုင်လို့၊ React က
      ပိတ်ထားပါတယ်။ [[mark:draw-recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ useActionState က Action
      ရဲ့ ရလဒ်ကို မှတ်ပေးပြီး၊ useFormStatus က pending ကို ပြပေးပါတယ်။ useOptimistic
      ကတော့ ရလဒ်ကို ကြိုပြပါတယ်။ lesson 12 မှာတော့ form ရဲ့ Action ကို တကယ့် server
      ပေါ်မှာ run ကြည့်ပါမယ်။ [[mark:next-lesson]] နောက် lesson မှာတော့ ရိုက်ထားတာ
      မပျောက်အောင် UI ကို Activity နဲ့ ဖျောက်ထားတာနဲ့၊ ViewTransition နဲ့ animation
      ထည့်တာကို ကြည့်သွားပါမယ်။
    sources:
      - title: "React 19 — Support for stylesheets"
        url: "https://react.dev/blog/2024/12/05/react-19#support-for-stylesheets"
      - title: "React — <link>"
        url: "https://react.dev/reference/react-dom/components/link"
      - title: "React — <meta>"
        url: "https://react.dev/reference/react-dom/components/meta"
      - title: "React — <script>"
        url: "https://react.dev/reference/react-dom/components/script"
      - title: "React — preload"
        url: "https://react.dev/reference/react-dom/preload"
      - title: "React — preinit"
        url: "https://react.dev/reference/react-dom/preinit"
      - title: "React — Custom HTML elements"
        url: "https://react.dev/reference/react-dom/components#custom-html-elements"
      - title: "React 19 Upgrade Guide — Other breaking changes (javascript: URLs)"
        url: "https://react.dev/blog/2024/04/25/react-19-upgrade-guide#other-breaking-changes"
      - title: "React — Activity"
        url: "https://react.dev/reference/react/Activity"
    actions:
      - id: board-dom
        type: whiteboard.apply
        at: { mark: board-dom }
        open: true
        clear: true
        upsertIds: [b4-title]
      - id: draw-meta
        type: whiteboard.apply
        at: { mark: draw-meta }
        upsertIds: [b4-meta]
        drawMs: 1000
      - id: draw-style
        type: whiteboard.apply
        at: { mark: draw-style }
        upsertIds: [b4-style]
        drawMs: 1000
      - id: draw-script
        type: whiteboard.apply
        at: { mark: draw-script }
        upsertIds: [b4-script]
        drawMs: 900
      - id: draw-preload
        type: whiteboard.apply
        at: { mark: draw-preload }
        upsertIds: [b4-preload]
        drawMs: 900
      - id: draw-custom
        type: whiteboard.apply
        at: { mark: draw-custom }
        upsertIds: [b4-custom]
        drawMs: 900
      - id: draw-js-url
        type: whiteboard.apply
        at: { mark: draw-js-url }
        upsertIds: [b4-jsurl]
        drawMs: 900
      - id: draw-recap
        type: whiteboard.apply
        at: { mark: draw-recap }
        upsertIds: [b4-recap-box, b4-recap]
        drawMs: 1600
      - id: draw-next
        type: whiteboard.apply
        at: { mark: next-lesson }
        upsertIds: [b4-next]
        drawMs: 900
      - id: expect-api-file
        type: expect.file
        at: { afterAction: draw-next }
        path: src/api.js
        contains: "  if (!order.name) {\n    return { error: \"နာမည် ထည့်ပါ\" };\n  }\n  return { orderId: nextId++ };\n"
      - id: expect-reorder-file
        type: expect.file
        at: { afterAction: expect-api-file }
        path: src/ReorderButton.jsx
        contains: "    startTransition(async () => {\n      const result = await placeOrder({ name: \"ကိုအောင်\", table: \"2\" });\n      startTransition(() => {\n        setLastId(result.orderId);\n      });\n    });\n"
      - id: expect-submit-file
        type: expect.file
        at: { afterAction: expect-reorder-file }
        path: src/SubmitButton.jsx
        contains: "  const { pending } = useFormStatus();\n"
      - id: expect-form-hooks-file
        type: expect.file
        at: { afterAction: expect-submit-file }
        path: src/OrderForm.jsx
        contains: "import { useActionState, useState, useOptimistic } from \"react\";\n"
      - id: expect-form-optimistic-file
        type: expect.file
        at: { afterAction: expect-form-hooks-file }
        path: src/OrderForm.jsx
        contains: "    const order = { name: formData.get(\"name\"), table: formData.get(\"table\") };\n    addOptimistic(order);\n    const result = await placeOrder(order);\n"
      - id: expect-form-jsx-file
        type: expect.file
        at: { afterAction: expect-form-optimistic-file }
        path: src/OrderForm.jsx
        contains: '<button className="secondary" formAction={saveDraft} data-testid="save-draft">'
      - id: expect-form-list-file
        type: expect.file
        at: { afterAction: expect-form-jsx-file }
        path: src/OrderForm.jsx
        contains: "      <OrderList orders={ordersOptimistic} />\n"
      - id: expect-title-file
        type: expect.file
        at: { afterAction: expect-form-list-file }
        path: src/OrderList.jsx
        contains: "      <title>{`ရွှေရန်ကုန် · အော်ဒါ ${orders.length} ခု`}</title>\n"
      - id: expect-app-file
        type: expect.file
        at: { afterAction: expect-title-file }
        path: src/App.jsx
        contains: "      <Header />\n      <OrderForm />\n      <ReorderButton />\n"

checks:
  - { type: timing.p95Ms, max: 300 }
