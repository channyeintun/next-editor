  - id: forward
    chapter: Roll forward ဒါမှမဟုတ် compensate
    narration: >-
      [[mark:show-forward]] external effect ကို rollback လုပ်လို့ မရတော့ flow တစ်ခု ကျသွားရင် လမ်း
      နှစ်လမ်းပဲ ရှိပါတယ်။ [[mark:pt-f1]] ယာယီ ကျတာဆိုရင် key အတူတူနဲ့ ပြီးတဲ့အထိ ရှေ့ကို retry လုပ်ပါတယ်။
      [[mark:forward-2]] နောက် အဆင့်ကို လုံးဝ မသွားနိုင်တော့ရင်တော့ အရင် အဆင့်တွေကို ပြန်ဖြေတဲ့ action အသစ်တွေ
      လုပ်ရပါတယ်။ ဒါကို saga pattern လို့ ခေါ်ပြီး၊ ဥပမာ compliance က ငြင်းရင် reservation ကို release
      လုပ်တာပါ။ [[mark:forward-3]] သတိထားရမှာက compensation က ဖျက်တာ မဟုတ်ဘဲ action အသစ်ပါ၊ ဖြစ်ခဲ့တာ
      အားလုံး audit trail ထဲမှာ ကျန်ပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Full resumability (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#full-resumability",
        }
    actions:
      - {
          id: show-forward,
          type: slide.show,
