  - id: try-it
    chapter: ကိုယ်တိုင် စမ်းကြည့်ပါ
    narration: >-
      [[mark:close-iv]] ကိုယ်တိုင် စမ်းကြည့်ဖို့ တစ်ခု ရှိပါတယ်။ [[mark:sel-try]] ဒီ line က process သေမယ့်
      နေရာပါ။ sent ကို reserved လို့ ပြောင်းပြီး run ကြည့်ပါ။ payout က တစ်ခါပဲ ထွက်ပေမဲ့ ယူရို ၈၀ က hold
      ထဲမှာ ကျန်နေပါလိမ့်မယ်၊ reserve step က ထပ် run တာကို မခံနိုင်လို့ပါ။ internal step ဆိုရင် hold နဲ့ state
      ကို database transaction တစ်ခုတည်းထဲမှာ commit လုပ်တာက အဖြေပါ။ step တိုင်းမှာ crash ကို inject လုပ်ပြီး
      test လုပ်ရတာ ဒါကြောင့်ပါ။ [[mark:recap]] ပြန်ချုပ်ရရင်၊ money flow က step နှစ်ခုကြား ဘယ်နေရာမှာမဆို
      သေမယ်လို့ ယူဆပြီး၊ progress ကို database မှာ သိမ်း၊ driver နဲ့ ပြန်နှိုး၊ step တိုင်းကို ထပ် run လို့ရအောင်
      လုပ်ရပါတယ်။ နောက် lesson မှာတော့ ဒီ flow တွေ ခေါ်နေရတဲ့ provider API တွေကို ဘာကြောင့် မယုံရလဲ၊
      ဘယ်လို ကာကွယ်ပြီး သုံးမလဲ ဆိုတာ ကြည့်ပါမယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Testing (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#testing",
        }
    actions:
      - { id: close-iv, type: slide.close, at: { mark: close-iv } }
      - id: sel-try
        type: editor.select
        at: { mark: sel-try }
        target: { file: main.go, text: 's.crashAt = "sent"', occurrence: 1 }

checks:
  - { type: timing.p95Ms, max: 300 }
