# Fintech Engineering, lesson 22: resumable money flows (Burmese).
#
# Source: Fintech Engineering Handbook, "Full resumability" and Appendix B "Flow 1: A crypto
# withdrawal" (CC BY 4.0, Voytek Pitula).
# Start state: flow.go holds the withdrawal as an explicit state machine (new → reserved →
# screened → sent → settled, rejected → released), a bank that pays once per idempotency key, and
# a crash hook that kills the process after a step happened and before it is recorded. main.go:
# resume() keeps the flow's progress in a map that is the process's own memory; main crashes the
# process after the payout and runs resume again.
# Edits, all insert-only:
#   1. main.go: progress = store (the database)      -> run-2: settled, still 2 payouts, no hold
#   2. flow.go: the payout carries the flow id as key  -> run-3: 1 payout
#   3. main.go: a second withdrawal compliance rejects -> run-4: released, 0 payouts (compensation)
# Figures: steps (the state machine, a crash between every pair), gap (dying between the effect
# and its record), driver (stalled flows resumed; durable-execution engines), forward (roll forward
# or compensate), iv (the interview answer).
# Built by ~/Documents/fintech-course-work/tools/build-lesson.ts; fixtures by sim-go.ts --write.
schemaVersion: 1

lesson:
  slug: fintech-22-resumability
  title: "Fintech Engineering 22: Crash ဖြစ်လည်း ဆက်သွားတဲ့ flow"
  locale: my-MM
  workspace:
    lessonType: go
    name: Fintech Engineering
    entryFilePath: main.go
    files:
      flow.go: |
        package main

        import "fmt"

        // Flow is one withdrawal. State names the last step it finished.
        type Flow struct {
        	ID     string
        	Amount int64
        	State  string
        }

        // store stands in for the database: it survives a crash; a process's variables do not.
        var store = map[string]Flow{}

        // final states: nothing is left to do.
        func final(state string) bool { return state == "settled" || state == "released" }

        // System is user 1042's money and the outside world the flow talks to.
        type System struct {
        	balance, held int64
        	bank          Bank
        	reject        string // the flow compliance will block
        	crashAt       string // the process dies right after a step that reaches this state
        }

        func newSystem() *System { return &System{balance: 20000, bank: Bank{done: map[string]bool{}}} }

        // next runs the one step that follows f.State and returns the state it reaches.
        func (s *System) next(f *Flow) string {
        	switch f.State {
        	case "new":
        		s.held += f.Amount // reserve
        		return "reserved"
        	case "reserved":
        		if f.ID == s.reject {
        			return "rejected"
        		}
        		return "screened"
        	case "rejected":
        		s.held -= f.Amount // compensate: release the reservation
        		return "released"
        	case "screened":
        		req := Payout{Ref: f.ID, Amount: f.Amount}
        		s.bank.Send(req)
        		return "sent"
        	default: // "sent"
        		s.held -= f.Amount
        		s.balance -= f.Amount // settle
        		return "settled"
        	}
        }

        // crash kills the process if it is set to die at this state.
        func (s *System) crash(state string) {
        	if state == s.crashAt {
        		s.crashAt = "" // the restarted process does not crash again
        		panic("process died after: " + state)
        	}
        }

        // Payout is a request to the bank. Key is the idempotency key; Ref is our reference.
        type Payout struct {
        	Key, Ref string
        	Amount   int64
        }

        // Bank is the outside world: money it sends cannot be taken back.
        type Bank struct {
        	sent []Payout
        	done map[string]bool
        }

        // Send pays out once per key; a request without a key is always paid.
        func (b *Bank) Send(p Payout) {
        	if p.Key != "" && b.done[p.Key] {
        		return
        	}
        	b.done[p.Key] = p.Key != ""
        	b.sent = append(b.sent, p)
        }

        func (s *System) report(id string) string {
        	n := 0
        	for _, p := range s.bank.sent {
        		if p.Ref == id {
        			n++
        		}
        	}
        	state := store[id].State
        	if state == "" {
        		state = "not stored"
        	}
        	return fmt.Sprintf("%s: %s   payouts sent: %d   on hold: %s", id, state, n, cents(s.held))
        }

        // cents prints minor units as an amount with two decimals: cents(1234) is "12.34".
        func cents(n int64) string {
        	sign := ""
        	if n < 0 {
        		sign, n = "-", -n
        	}
        	return fmt.Sprintf("%s%d.%02d", sign, n/100, n%100)
        }
      main.go: |
        package main

        import "fmt"

        // resume drives one withdrawal from wherever it got to, one step at a time.
        func resume(s *System, id string) {
        	progress := map[string]Flow{} // this process's memory: a crash wipes it
        	f, ok := progress[id]
        	if !ok {
        		f = Flow{ID: id, Amount: 8000, State: "new"}
        	}
        	for !final(f.State) {
        		state := s.next(&f)
        		s.crash(state) // the step has happened; its record has not
        		f.State = state
        		progress[id] = f // record the step before the next one starts
        	}
        }

        // run is one life of a process: a crash ends it, and the next run starts fresh.
        func run(work func()) {
        	defer func() {
        		if died := recover(); died != nil {
        			fmt.Println(died)
        		}
        	}()
        	work()
        }

        func main() {
        	s := newSystem()
        	s.crashAt = "sent"
        	run(func() { resume(s, "wd-7") }) // the API starts the withdrawal
        	run(func() { resume(s, "wd-7") }) // after the restart, the driver picks it up
        	fmt.Println(s.report("wd-7"))

        }
