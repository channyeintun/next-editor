          at: { afterAction: driver-3 },
          target: { x: 0.188, y: 0.676 },
        }
      - { id: pt-wait, type: slide.point, at: { mark: pt-wait }, target: { x: 0.465, y: 0.456 } }
      - { id: driver-4, type: slide.show, at: { mark: driver-4 }, slideId: driver-4 }
