build:
  voiceProfile:
    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 9522

runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "process died after: sent\nwd-7: not stored   payouts sent: 2   on hold: 80.00\n"
      run-2:
        status: success
        exitCode: 0
        output: "process died after: sent\nwd-7: settled   payouts sent: 2   on hold: 0.00\n"
      run-3:
        status: success
        exitCode: 0
        output: "process died after: sent\nwd-7: settled   payouts sent: 1   on hold: 0.00\n"
      run-4:
        status: success
        exitCode: 0
        output: "process died after: sent\nwd-7: settled   payouts sent: 1   on hold: 0.00\nwd-8: released   payouts sent: 0   on hold: 0.00\n"

scenes:
  - id: hook
    chapter: Withdrawal တစ်ခုရဲ့ အဆင့်တွေ
    narration: >-
      user တစ်ယောက် ငွေထုတ်တာက database write တစ်ခုတည်း မဟုတ်ပါဘူး။ [[mark:show-steps]] funds ကို
      reserve လုပ်၊ compliance စစ်၊ ဘဏ်ကို ပို့ပြီးမှ settle လုပ်တဲ့ အဆင့် လေးဆင့် ရှိပါတယ်။
      [[mark:pt-days]] compliance က manual review ထိ ရောက်ရင် နာရီ ဒါမှမဟုတ် ရက်ချီ ကြာနိုင်လို့ flow
      တစ်ခုက process တစ်ခုရဲ့ သက်တမ်းထက် ရှည်ပါတယ်။ [[mark:steps-2]] ဒါကြောင့် အဆင့် နှစ်ခုကြား
      တိုင်းမှာ process သေမယ်လို့ ယူဆရပါတယ်၊ crash ဖြစ်ဖြစ်၊ deploy ဖြစ်ဖြစ်၊ timeout ဖြစ်ဖြစ်ပါ။ တစ်ဝက်မှာ
      ရပ်သွားတဲ့ flow က ပြန်ဆက်လို့ ရတဲ့ အခြေအနေမှာ အမြဲ ရှိရပြီး၊ မကိုက်တဲ့ အခြေအနေမှာ ဘယ်တော့မှ မရှိရပါဘူး။
      [[mark:steps-3]] အထူးသဖြင့် send ပြီးသွားရင် ငွေက system အပြင်ကို ထွက်သွားပါပြီ၊ database rollback
      နဲ့ ပြန်ယူလို့ မရပါဘူး။
    sources:
      - {
          title: "Fintech Engineering Handbook — Full resumability (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#full-resumability",
        }
      - {
          title: "Fintech Engineering Handbook — Flow 1: A crypto withdrawal (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#flow-1-a-crypto-withdrawal",
        }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }
      - {
          id: show-steps,
          type: slide.show,
          at: { mark: show-steps, offsetMs: -700 },
          slideId: steps-1,
        }
      - {
          id: pt-chain,
          type: slide.point,
          at: { afterAction: show-steps },
          target: { x: 0.491, y: 0.476 },
        }
      - { id: pt-days, type: slide.point, at: { mark: pt-days }, target: { x: 0.488, y: 0.587 } }
      - { id: steps-2, type: slide.show, at: { mark: steps-2 }, slideId: steps-2 }
      - {
          id: pt-assume,
          type: slide.point,
          at: { afterAction: steps-2 },
          target: { x: 0.323, y: 0.709 },
        }
      - { id: steps-3, type: slide.show, at: { mark: steps-3 }, slideId: steps-3 }
      - {
          id: pt-ext,
          type: slide.point,
          at: { afterAction: steps-3 },
          target: { x: 0.691, y: 0.476 },
        }

  - id: naive
    chapter: Progress ကို memory ထဲ ထားရင်
    narration: >-
      [[mark:close-steps]] Code မှာ ဒီ အဆင့်တွေက state machine တစ်ခုပါ။ [[mark:sel-progress]] resume က
      flow ကို ရောက်နေတဲ့ state ကနေ တစ်ဆင့်ချင်း ဆက်တွန်းပါတယ်။ ဒါပေမဲ့ ရောက်နေတဲ့ state ကို process ရဲ့
      memory ထဲမှာပဲ မှတ်ထားပါတယ်။ [[mark:sel-crash]] step တစ်ခု ဖြစ်ပြီးတဲ့ ချက်ချင်း၊ မှတ်တမ်း မတင်ခင်
      process သေနိုင်တဲ့ နေရာကို ဒီမှာ inject လုပ်ထားပါတယ်။ [[mark:sel-runs]] main ထဲမှာ process က ဘဏ်ကို
      ပို့ပြီးတာနဲ့ သေသွားပြီး၊ restart ဖြစ်တော့ driver က အဲဒီ withdrawal ကို ပြန်ကောက်ပါတယ်။ user မှာ ယူရို
      ၂၀၀ ရှိပြီး ယူရို ၈၀ ထုတ်တာပါ။ [[mark:run-1]] run လိုက်ရအောင်။ [[mark:pt-died]] process က payout
      ပို့ပြီးတဲ့ နောက်မှာ သေသွားပါတယ်။ [[mark:pt-r1]] restart ပြီးတဲ့ process က ဒီ withdrawal ကို database
      ထဲမှာ ရှာမတွေ့လို့ အစကနေ ပြန်စပါတယ်။ ဒါကြောင့် payout နှစ်ခါ ထွက်ပြီး ပထမ reservation ကလည်း ဘယ်
      flow မှ မပိုင်ဘဲ ယူရို ၈၀ ကို ချုပ်ထားပါတယ်။ [[mark:dock-1]] memory ထဲက progress က process
      နဲ့အတူ သေပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Full resumability (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#full-resumability",
        }
      - {
          title: "Go documentation — Defer, Panic, and Recover",
          url: "https://go.dev/blog/defer-panic-and-recover",
        }
    actions:
      - { id: close-steps, type: slide.close, at: { mark: close-steps } }
      - id: sel-progress
        type: editor.select
        at: { mark: sel-progress }
        target: { file: main.go, text: "progress := map[string]Flow{}", occurrence: 1 }
      - id: sel-crash
        type: editor.select
        at: { mark: sel-crash }
        target: { file: main.go, text: "s.crash(state)", occurrence: 1 }
      - id: sel-runs
        type: editor.select
        at: { mark: sel-runs }
        target: { file: main.go, text: 's.crashAt = "sent"', occurrence: 1 }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "wd-7: not stored   payouts sent: 2",
          timeoutMs: 8000,
        }
      - id: pt-died
        type: console.point
        at: { mark: pt-died }
        target: { text: "process died after: sent", occurrence: 1 }
      - id: pt-r1
        type: console.point
        at: { mark: pt-r1 }
        target: { text: "wd-7: not stored", occurrence: 1 }
      - { id: dock-1, type: runtime.collapseDock, at: { mark: dock-1 } }

  - id: persist
    chapter: Step တိုင်းကို commit လုပ်
    narration: >-
      [[mark:type-store]] progress ကို database မှာ ထားလိုက်ပါမယ်။ အခု loop က step တစ်ခု ပြီးတိုင်း state ကို
      database ထဲ ရေးပြီးမှ နောက် step ကို စပါတယ်၊ restart ဖြစ်တဲ့အခါ resume က အဲဒီ state ကနေ ဆက်ပါတယ်။
      ဒီ store က code ထဲမှာ map တစ်ခုပဲ ဖြစ်ပေမဲ့ crash ကို ကျော်ပြီး ကျန်တဲ့ database ကို ကိုယ်စားပြုပါတယ်။
      [[mark:predict]] reservation ကတော့ ပြေလည်သွားမှာပါ။ payout ဘယ်နှခါ ထွက်မလဲ၊ run မလုပ်ခင်
      ခန့်မှန်းကြည့်ပါ။ [[mark:run-2]] run လိုက်ရအောင်။ [[mark:pt-r2]] flow က settled ထိ ရောက်ပြီး hold
      လည်း မကျန်တော့ပါဘူး။ ဒါပေမဲ့ payout က နှစ်ခါ ထွက်နေတုန်းပါ။ [[mark:dock-2]] progress ကို သိမ်းတာ
      မှန်ပေမဲ့ မလုံလောက်ပါဘူး။
    sources:
      - {
          title: "Fintech Engineering Handbook — Full resumability (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#full-resumability",
        }
    actions:
      - id: type-store
        type: editor.type
        at: { mark: type-store }
        target:
          {
            file: main.go,
            after: "\tprogress := map[string]Flow{} // this process's memory: a crash wipes it\n",
            occurrence: 1,
          }
        text: "\tprogress = store              // the database: it survives the crash\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "wd-7: settled   payouts sent: 2",
          timeoutMs: 8000,
        }
      - id: pt-r2
        type: console.point
        at: { mark: pt-r2 }
        target: { text: "wd-7: settled", occurrence: 1 }
      - { id: dock-2, type: runtime.collapseDock, at: { mark: dock-2 } }

  - id: gap
    chapter: Effect နဲ့ မှတ်တမ်းကြားက ကွက်လပ်
    narration: >-
      [[mark:show-gap]] ဘာကြောင့်လဲဆိုတော့ process သေတဲ့ နေရာက ငွေ ပို့တာနဲ့ state ရေးတာ ကြားမှာ ဖြစ်လို့ပါ။
      [[mark:pt-pay]] ဘဏ်က ငွေ ပို့ပြီးပါပြီ။ [[mark:pt-lost]] ဒါပေမဲ့ sent ဆိုတဲ့ state ကို database ထဲ ရေးခွင့်
      မရလိုက်ပါဘူး။ [[mark:gap-2]] restart ဖြစ်တော့ database က screened လို့ပဲ ပြောတဲ့အတွက် resume က send
      ကို ထပ် run ပါတယ်။ ဒီ ကွက်လပ်ကို ကျဉ်းအောင် လုပ်လို့ ရပေမဲ့ ပိတ်လို့ မရပါဘူး၊ ဘဏ်နဲ့ ကိုယ့် database
      က transaction တစ်ခုတည်းထဲမှာ မရှိလို့ပါ။ [[mark:gap-3]] ဒါကြောင့် resume က ထပ် run မယ့် step တိုင်း
      idempotent ဖြစ်ရပါမယ်။ external step အတွက် အဖြေကတော့ ပြီးခဲ့တဲ့ lesson နှစ်ခုက idempotency key ပါ။
      [[mark:pt-dedupe]] flow ရဲ့ id ကို key အဖြစ် ပို့ရင်၊ idempotency key ကို လက်ခံတဲ့ ဘဏ်က ဒုတိယ request ကို ပို့ပြီးသားလို့ သိပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Full resumability (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#full-resumability",
        }
      - {
          title: "Fintech Engineering Handbook — Idempotency (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#idempotency",
        }
    actions:
      - { id: show-gap, type: slide.show, at: { mark: show-gap, offsetMs: -700 }, slideId: gap-1 }
      - {
          id: pt-read,
          type: slide.point,
          at: { afterAction: show-gap },
          target: { x: 0.302, y: 0.411 },
        }
      - { id: pt-pay, type: slide.point, at: { mark: pt-pay }, target: { x: 0.475, y: 0.494 } }
      - { id: pt-lost, type: slide.point, at: { mark: pt-lost }, target: { x: 0.215, y: 0.578 } }
      - { id: gap-2, type: slide.show, at: { mark: gap-2 }, slideId: gap-2 }
      - {
          id: pt-again,
          type: slide.point,
          at: { afterAction: gap-2 },
          target: { x: 0.475, y: 0.744 },
        }
      - { id: gap-3, type: slide.show, at: { mark: gap-3 }, slideId: gap-3 }
      - {
          id: pt-key,
          type: slide.point,
          at: { afterAction: gap-3 },
          target: { x: 0.475, y: 0.827 },
