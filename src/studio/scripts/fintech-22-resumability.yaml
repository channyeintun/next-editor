      - { id: pt-dedupe, type: slide.point, at: { mark: pt-dedupe }, target: { x: 0.822, y: 0.91 } }

  - id: key
    narration: >-
      [[mark:close-gap]] payout ကို ဘဏ်ဆီ ပို့တဲ့ step ကို ကြည့်ရအောင်။ [[mark:sel-send]] request မှာ ကိုယ့်
      reference ပါပေမဲ့ idempotency key မပါသေးပါဘူး။ [[mark:type-key]] flow ရဲ့ id ကို key အဖြစ် ထည့်ပါမယ်။
      retry လုပ်တိုင်း၊ process ဘယ်နှစ်ခါ restart ဖြစ်ဖြစ် key က အတူတူပဲ ဖြစ်နေရပါမယ်၊ attempt တစ်ခါစီမှာ key
      အသစ် ထုတ်ရင် ဘာမှ မကာကွယ်ပါဘူး။ [[mark:run-3]] run လိုက်ရအောင်။ [[mark:pt-r3]] process သေတာ၊
      restart ဖြစ်တာ၊ send ကို နှစ်ခါ ခေါ်တာ အားလုံး ဖြစ်ခဲ့ပေမဲ့ payout က တစ်ခါပဲ ထွက်ပါတယ်။
      [[mark:dock-3]] database ထဲက progress က No lost data ကို ထိန်းပါတယ်၊ ငွေနဲ့ ပတ်သက်ပြီး ဖြစ်ခဲ့သမျှ
      မပျောက်ရဘူး ဆိုတာပါ။ ထပ် run လို့ရတဲ့ step တွေကတော့ No invented data ကို ထိန်းပါတယ်၊ ငွေကို မရှိဘဲ
      မဖန်တီးရဘူး ဆိုတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Full resumability (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#full-resumability",
        }
      - {
          title: "Fintech Engineering Handbook — Principles (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#principles",
        }
    actions:
      - { id: close-gap, type: slide.close, at: { mark: close-gap } }
      - {
          id: open-flow,
          type: workspace.openFile,
          at: { mark: sel-send, offsetMs: -700 },
          path: flow.go,
        }
      - id: sel-send
        type: editor.select
        at: { mark: sel-send }
        target: { file: flow.go, text: "req := Payout{Ref: f.ID, Amount: f.Amount}", occurrence: 1 }
      - id: type-key
        type: editor.type
        at: { mark: type-key }
        target:
          {
            file: flow.go,
            after: "\t\treq := Payout{Ref: f.ID, Amount: f.Amount}\n",
            occurrence: 1,
          }
        text: "\t\treq.Key = f.ID // the same key on every attempt\n"
        cadence: line-by-line
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "wd-7: settled   payouts sent: 1",
          timeoutMs: 8000,
        }
      - id: pt-r3
        type: console.point
        at: { mark: pt-r3 }
        target: { text: "payouts sent: 1", occurrence: 1 }
      - { id: dock-3, type: runtime.collapseDock, at: { mark: dock-3 } }
      - {
          id: expect-file-key,
          type: expect.file,
          at: { afterAction: run-3 },
          path: flow.go,
          contains: "req.Key = f.ID",
        }

  - id: driver
    chapter: ရပ်နေတဲ့ flow ကို ဘယ်သူ နှိုးမလဲ
    narration: >-
      [[mark:show-driver]] code ထဲမှာ restart ပြီးရင် resume ကို ကိုယ်တိုင် ခေါ်ထားပါတယ်။ လက်တွေ့မှာ ဒီ
      အလုပ်ကို ဘယ်သူ လုပ်မလဲ ဆိုတာ ဆုံးဖြတ်ရပါတယ်။ [[mark:pt-t]] flow တိုင်းရဲ့ state က database ထဲမှာ
      ရှိပါတယ်။ [[mark:driver-2]] flow ကို run နေတဲ့ process သေသွားရင် အဲဒီ withdrawal က screened မှာ ရပ်နေပါမယ်၊
      request ပို့ခဲ့တဲ့ client ကလည်း ပြန်လာမှာ မဟုတ်ပါဘူး။ [[mark:driver-3]] ဒါကြောင့် process နဲ့ မဆိုင်တဲ့
      driver တစ်ခု၊ scheduler ဒါမှမဟုတ် poller တစ်ခုက final state မရောက်သေးတဲ့ flow တွေကို ပုံမှန် ရှာပြီး resume
      လုပ်ရပါတယ်။ [[mark:pt-wait]] manual review စောင့်နေတဲ့ flow ကိုတော့ မထိရပါဘူး၊ ဆိုလိုတာက ရပ်နေတာနဲ့
      စောင့်နေတာကို driver က ခွဲသိရပါမယ်။ [[mark:driver-4]] ဒါကို ကိုယ်တိုင် မရေးချင်ရင် durable
      execution engine တွေ ရှိပါတယ်၊ Temporal၊ AWS Step Functions၊ Camunda တို့က progress ကို သိမ်းပြီး ဆက်
      run ပေးပါတယ်။ [[mark:pt-camunda]] ဒါပေမဲ့ step ကို ထပ် run တာကတော့ မပျောက်ပါဘူး။ Camunda ဆိုရင်
      job ကို အနည်းဆုံး တစ်ခါ ပို့လို့ worker code က idempotent ဖြစ်ရမယ်လို့ သူ့ docs မှာ ရေးထားပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Full resumability (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#full-resumability",
        }
      - { title: "Temporal docs — What is Temporal?", url: "https://docs.temporal.io/temporal" }
      - {
          title: "Camunda 8 docs — Job workers",
          url: "https://docs.camunda.io/docs/components/concepts/job-workers/",
        }
    actions:
      - {
          id: show-driver,
          type: slide.show,
          at: { mark: show-driver, offsetMs: -700 },
          slideId: driver-1,
        }
      - {
