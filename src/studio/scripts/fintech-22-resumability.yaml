  - id: compensate
    narration: >-
      [[mark:close-forward]] state machine ထဲမှာ အဲဒီ လမ်းက ရှိပြီးသားပါ။ [[mark:sel-comp]] rejected state
      ကနေ ထွက်တဲ့ step က hold ကို ပြန်လွှတ်ပြီး released ဆိုတဲ့ final state ကို ရောက်ပါတယ်။ ဒီ step လည်း
      တခြား step တွေလိုပဲ state ကို commit လုပ်ပြီးမှ ဆက်သွားပါတယ်။ [[mark:type-reject]] compliance က
      ငြင်းမယ့် withdrawal တစ်ခု ထပ်ထည့်ပါမယ်။ ယူရို ၈၀ အတွက်ပဲ ဖြစ်ပြီး၊ ပထမ တစ်ခုလို process မသေပါဘူး။
      [[mark:run-4]] run လိုက်ရအောင်။ [[mark:pt-r4]] ဒုတိယ withdrawal က released မှာ ပြီးပြီး payout မထွက်ပါဘူး၊
      hold ထဲမှာလည်း ဘာမှ မကျန်ပါဘူး။ [[mark:dock-4]] flow တိုင်းက နောက်ဆုံးမှာ final state တစ်ခုခုကို ရောက်ရပါမယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Full resumability (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#full-resumability",
        }
      - {
          title: "Fintech Engineering Handbook — Funds reservation (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#funds-reservation",
        }
    actions:
      - { id: close-forward, type: slide.close, at: { mark: close-forward } }
      - id: sel-comp
        type: editor.select
        at: { mark: sel-comp }
        target:
          {
            file: flow.go,
            text: "s.held -= f.Amount // compensate: release the reservation",
            occurrence: 1,
          }
      - {
          id: open-main-2,
          type: workspace.openFile,
          at: { mark: type-reject, offsetMs: -700 },
          path: main.go,
        }
      - id: type-reject
        type: editor.type
        at: { mark: type-reject }
        target: { file: main.go, after: "\tfmt.Println(s.report(\"wd-7\"))\n", occurrence: 1 }
        text: "\n\ts.reject = \"wd-8\" // compliance will block this one\n\trun(func() { resume(s, \"wd-8\") })\n\tfmt.Println(s.report(\"wd-8\"))\n"
        cadence: line-by-line
      - { id: run-4, type: runtime.run, at: { mark: run-4, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-4,
          type: expect.output,
          at: { afterAction: run-4 },
          contains: "wd-8: released   payouts sent: 0",
          timeoutMs: 8000,
        }
      - id: pt-r4
        type: console.point
        at: { mark: pt-r4 }
        target: { text: "wd-8: released", occurrence: 1 }
      - { id: dock-4, type: runtime.collapseDock, at: { mark: dock-4 } }

  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] အဆင့်များတဲ့ money flow က အလယ်မှာ crash ဖြစ်ရင် ဘယ်လို ကိုင်တွယ်မလဲ ဆိုတာ
      မေးလေ့ရှိပါတယ်။ transaction နဲ့ rollback လုပ်မယ် လို့ ဖြေရင် မှားပါတယ်၊ ဘဏ်ကို ပို့ပြီးသားကို rollback
      မလုပ်နိုင်လို့ပါ။ အချက် သုံးချက်နဲ့ ဖြေပါ။ [[mark:iv-a]] ပထမ၊ flow ကို state machine အဖြစ် database မှာ
      သိမ်းပြီး step တစ်ခု ပြီးတိုင်း commit လုပ်ပြီးမှ နောက် step ကို စမယ်။ [[mark:iv-b]] ဒုတိယ၊ process နဲ့
      မဆိုင်တဲ့ driver က ရပ်နေတဲ့ flow တွေကို ရှာပြီး resume လုပ်မယ်။ [[mark:iv-c]] တတိယ၊ resume က step ကို
      ထပ် run မှာမို့ step တိုင်း idempotent ဖြစ်ရမယ်၊ internal step ဆိုရင် effect နဲ့ state ကို transaction
      တစ်ခုတည်းထဲ ထည့်ပြီး external step ဆိုရင် idempotency key ပို့မယ်။ [[mark:iv-d]] ပြီးရင် undo မရတဲ့
      effect ပြီးသွားရင် ရှေ့ဆက် retry လုပ်မလား compensate လုပ်မလား ဆိုတာနဲ့၊ step တိုင်းမှာ crash ကို
      inject လုပ်ပြီး test လုပ်မယ် ဆိုတာ ဆက်ပြောပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Full resumability (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#full-resumability",
        }
      - {
          title: "Fintech Engineering Handbook — Testing (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#testing",
        }
    actions:
      - { id: show-iv, type: slide.show, at: { mark: show-iv, offsetMs: -700 }, slideId: iv-1 }
      - {
          id: pt-iv-q,
          type: slide.point,
          at: { afterAction: show-iv },
          target: { x: 0.125, y: 0.184 },
        }
      - { id: iv-a, type: slide.show, at: { mark: iv-a }, slideId: iv-2 }
      - {
          id: pt-iv-a,
          type: slide.point,
          at: { afterAction: iv-a },
          target: { x: 0.138, y: 0.359 },
        }
      - { id: iv-b, type: slide.show, at: { mark: iv-b }, slideId: iv-3 }
      - {
          id: pt-iv-b,
          type: slide.point,
          at: { afterAction: iv-b },
          target: { x: 0.138, y: 0.506 },
        }
      - { id: iv-c, type: slide.show, at: { mark: iv-c }, slideId: iv-4 }
      - {
          id: pt-iv-c,
          type: slide.point,
          at: { afterAction: iv-c },
          target: { x: 0.138, y: 0.652 },
        }
      - { id: iv-d, type: slide.show, at: { mark: iv-d }, slideId: iv-5 }
      - {
