# AI Builder, lesson 29: conductor and orchestrator (Burmese, docs kind).
#
# Start state (ws/): base-docs (package.json with a no-op dev script, notes.md, unused) +
# docs/plan.md exactly as L17 leaves it (COURSE-KIT §4.7 table + the Task 5 removal line;
# lessons/ai-builder-17-simplicity/_final-plan.md, re-checked with tools/sim-docs.ts). Nothing runs.
#
# Typed (insert-only): a `## Mode` section under the Task 5 line — a small table (task number, mode,
# why) with the binder's L29 modes (1 conductor, 2 orchestrator, 3 conductor, 4 orchestrator,
# 6 conductor) — then two rule lines under it (parallel tasks must not touch the same files; review
# every background result, hand out only what you can review). The old table is not edited: the
# narration says why the modes get their own section (a reason column would make the old table too
# wide to read). Final plan.md in DESIGN.md (L30 pins it).
#
# Boards: (A) conductor (me → one agent, close) vs orchestrator (me → three agents → my review), with
# the orchestrator's skills and the three places (editor → terminal → background) along the bottom;
# (B) which mode: the two questions, four shop tasks placed in two columns, newest-tool (red) vs the
# task (green); (L) handing out two at once: same file → clash (red), one after the other (green);
# review: more agents, more to check; check what you can (green); (Z) the quiz (labels vs refunds).
#
# Build: bun ~/Documents/ai-builder-course-work/tools/build-lesson.ts template.yaml ws ai-builder-29-conductor-orchestrator.yaml
