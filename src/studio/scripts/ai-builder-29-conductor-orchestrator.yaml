  - id: type-rules
    narration: >
      [[mark:close-l]] ဒီ အချက် နှစ်ခုကို plan ထဲမှာ မှတ်ထားပါမယ်။ [[mark:type-rules]] ပထမ စာကြောင်းက ဖိုင် တူတူ
      ထိမယ့် task နှစ်ခုကို ဘယ်အစဉ်နဲ့ အပ်မလဲ ဆုံးဖြတ်ထားတာပါ။ ဒုတိယ စာကြောင်းကတော့ background က ရလဒ်တွေကို ဘယ်လို
      လက်ခံမလဲ ဆိုတာပါ။ [[mark:sel-rule2]] review checklist က ရလဒ် တိုင်းကို တူညီတဲ့ မေးခွန်းတွေနဲ့ မြန်မြန်
      စစ်နိုင်အောင် ကူညီပေမဲ့၊ checklist ရှိလို့ ကိုယ့် အချိန် တိုးလာတာ မဟုတ်ပါဘူး။ ဒါကြောင့် agent ထပ်တိုးချင်ရင်
      ကိုယ့်မှာ စစ်ဖို့ အချိန် ရှိလား အရင် မေးကြည့်ပါ။
    sources:
      - {
