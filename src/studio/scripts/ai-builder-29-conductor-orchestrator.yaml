  - id: quiz
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ task နှစ်ခု ရှိတယ် ဆိုပါစို့။ ပထမက ခလုတ် တိုင်းမှာ မြန်မာစာရဲ့
      အောက်မှာ English စာလုံးပါ တွဲပြဖို့ပါ။ ဒါကို ဆိုင်ပိုင်ရှင် က ဆုံးဖြတ်ပြီးသားပါ။ ဒုတိယက customer ကို
      ငွေ ပြန်အမ်းရမယ့် အခါတွေမှာ ဘယ်လို လုပ်မလဲ ဆုံးဖြတ်ဖို့ပါ။ ဘယ် task ကို background agent ဆီ အပ်လို့ ရလဲ။
      lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] အဖြေကတော့ ခလုတ်တွေမှာ English တွဲပြတဲ့ ပထမ
      task ပါ။ ဘာကြောင့်လဲဆိုတော့ ဘာလုပ်ရမလဲ ရှင်းနေပြီး၊ ခလုတ် တစ်ခုချင်းကို ဖုန်းပေါ်မှာ ကြည့်ရုံနဲ့ စစ်လို့
      ရလို့ပါ။ ဒုတိယကတော့ code အလုပ် မဟုတ်သေးပါဘူး။ ဘယ်အခါ ပြန်အမ်းမလဲ၊ ဘယ်လောက် ပြန်အမ်းမလဲ ဆိုတာ ဆိုင်ပိုင်ရှင် အရင်
      ဆုံးဖြတ်ရမှာ ဖြစ်ပြီး၊ background ကို အပ်လိုက်ရင် agent က business rule တွေကို ခန့်မှန်းပြီး
      ထုတ်ပေးသွားမှာပါ။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The developer's changing role (orchestrator tasks are well-defined; ambiguous requirements need people)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
