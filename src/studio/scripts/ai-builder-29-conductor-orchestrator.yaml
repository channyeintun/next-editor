  - id: type-mode
    narration: >
      [[mark:close-b]] ဒီ မေးခွန်းတွေနဲ့ ကိုယ်တို့ plan ကို ပြန်ကြည့်ရအောင်။ [[mark:type-mode]] ဇယား ဟောင်းကို
      မပြင်ဘဲ၊ အောက်မှာ mode အပိုင်း အသစ် ထည့်ပါမယ်။ task နံပါတ် တစ်ခုစီအတွက် ဘယ် ပုံစံနဲ့ ခိုင်းမလဲ၊ ဘာကြောင့်လဲ
      ဆိုတာပါ။ အကြောင်းရင်း column ကို ဇယား ဟောင်းထဲ ထည့်ရင် ဖတ်ရ ခက်လောက်အောင် ကျယ်သွားမှာ ဖြစ်လို့ သီးသန့် ဇယား
      ခွဲထားတာပါ။ ဖယ်လိုက်တဲ့ task ငါး ကတော့ ဒီမှာ မပါတော့ပါဘူး။ [[mark:sel-m2]] task နှစ်က background agent ဆီ
      အပ်လို့ ရတဲ့ task ပါ။ ဘာကို ငြင်းရမလဲ ဆိုတာ agent အတွက် ခန့်မှန်းစရာ မကျန်တော့သလို၊ ကိုယ်ကလည်း test plan နဲ့
      ဖုန်းပေါ်မှာ ချက်ချင်း စစ်လို့ ရပါတယ်။ [[mark:sel-m3]] ကောင်တာစာရင်း ဖြစ်တဲ့ task သုံးမှာတော့ AC ငါး က
      အော်ဒါတွေရဲ့ အစဉ်ကိုပဲ သတ်မှတ်ထားပါတယ်။ မနက် အလုပ်ရှုပ်ချိန်မှာ ဘာကို အရင် မြင်ရမလဲ၊ စာလုံး ဘယ်လောက်
      ကြီးရမလဲ ဆိုတာကတော့ ကောင်တာက လှလှ ကိုယ်တိုင် သုံးကြည့်မှ သိမှာ ဖြစ်လို့၊ agent ပြင်လိုက်တိုင်း လှလှ ကို
      ပြပြီးမှ ဆက်သွားရပါမယ်။ [[mark:sel-m6]] task ခြောက်ရဲ့ staging ကတော့ customer မသုံးခင် စမ်းဖို့ server ပါ။
      အဲဒီမှာ ပထမဆုံး တင်တဲ့အခါ secret တွေ ဘယ်မှာ ထားမလဲ၊ ဘာ access ပေးမလဲ ဆုံးဖြတ်ရလို့ background ကို
      လွှတ်ထားလို့ မရပါဘူး။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The developer's changing role (choosing the mode per task)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - { id: close-b, type: whiteboard.apply, at: { mark: close-b }, open: false }
      - id: type-mode
        type: editor.type
        at: { mark: type-mode }
        target: { file: docs/plan.md, after: "(decisions.md ADR-003)\n", occurrence: 1 }
        text: "\n## Mode\n| # | Mode | ဘာကြောင့် |\n|---|---|---|\n| 1 | conductor | ပထမ slice၊ မသေချာတာ အများဆုံး |\n| 2 | orchestrator | rule သုံးခု ရှင်း၊ AC နဲ့ စစ်လို့ရ |\n| 3 | conductor | screen ကို လှလှ နဲ့ ကြည့်ပြီး ဆုံးဖြတ်ရ |\n| 4 | orchestrator | spec ရဲ့ Rules မှာ ရှင်းပြီးသား |\n| 6 | conductor | ပထမဆုံး server ပေါ်တင်၊ secret နဲ့ access ပါ |\n"
        cadence: line-by-line
      - {
          id: expect-mode,
          type: expect.file,
          at: { afterAction: type-mode },
          path: docs/plan.md,
          contains: "| 2 | orchestrator | rule သုံးခု ရှင်း၊ AC နဲ့ စစ်လို့ရ |",
        }
      - {
          id: sel-m2,
          type: editor.select,
          at: { mark: sel-m2 },
          target:
            {
              file: docs/plan.md,
              text: "| 2 | orchestrator | rule သုံးခု ရှင်း၊ AC နဲ့ စစ်လို့ရ |",
              occurrence: 1,
            },
        }
      - {
          id: sel-m3,
          type: editor.select,
          at: { mark: sel-m3 },
          target:
            {
              file: docs/plan.md,
              text: "| 3 | conductor | screen ကို လှလှ နဲ့ ကြည့်ပြီး ဆုံးဖြတ်ရ |",
              occurrence: 1,
            },
        }
      - {
          id: sel-m6,
          type: editor.select,
          at: { mark: sel-m6 },
          target:
            {
              file: docs/plan.md,
              text: "| 6 | conductor | ပထမဆုံး server ပေါ်တင်၊ secret နဲ့ access ပါ |",
              occurrence: 1,
            },
        }

  - id: limits
    chapter: တစ်ပြိုင်နက် အပ်ရင်
    narration: >
      [[mark:l-title]] plan ထဲမှာ background ကို အပ်လို့ ရတဲ့ task နှစ်ခု ရှိပါတယ်။ နှစ်ခုလုံးကို တစ်ပြိုင်နက်
      အပ်လိုက်ရင်ကော။ [[mark:l-same]] ပထမ ကြည့်ရမှာက task နှစ်ခု ပြင်ရမယ့် ဖိုင်တွေပါ။ task နှစ်က မှားတဲ့ input
      ကို ငြင်းဖို့၊ task လေးက နေ့စဉ် အော်ဒါနံပါတ် ပေးဖို့ ဖြစ်ပေမဲ့၊ နှစ်ခုလုံးက အော်ဒါကို စစ်ပြီး သိမ်းတဲ့
      အပိုင်းကို ပြင်ရပါတယ်။ [[mark:l-clash]] agent နှစ်ခုက ဖိုင် တစ်ခုတည်းကို တစ်ချိန်တည်း ပြင်ရင်၊ တစ်ခုရဲ့
      ပြောင်းလဲမှုက နောက်တစ်ခုရဲ့ ပြောင်းလဲမှုကို ဖျက်သွားတာ၊ ပြန်ပေါင်းတဲ့အခါ တိုက်နေတာမျိုး ဖြစ်တတ်ပါတယ်။
      ဒါကြောင့် တစ်ပြိုင်နက် အပ်မယ့် task တွေက ဖိုင် တူတူ မထိရပါဘူး။ ထိမယ်ဆိုရင် တစ်ခု ပြီးမှ နောက်တစ်ခု အပ်ပါ။
      [[mark:l-review]] ဒုတိယ ကြည့်ရမှာက review ပါ။ agent တွေက တစ်ပြိုင်နက် အလုပ်လုပ်နိုင်ပေမဲ့၊ ရလဒ် တိုင်းကို
      စစ်မှာက ကိုယ် တစ်ယောက်တည်းပါ။ review လုပ်ခဲ့တဲ့ task နှစ်ရဲ့ ဥပမာ summary တစ်ခုတည်းမှာတောင် ပြင်ထားတဲ့ ဖိုင်
      ကိုးခု၊ မခိုင်းတဲ့ package နဲ့ ပြောင်းထားတဲ့ AC ကို တွေ့ခဲ့ရပါတယ်။ [[mark:l-limit]] agent များလေ စစ်ရမယ့်
      အလုပ် များလေ ဖြစ်လို့၊ ကိုယ် review လုပ်နိုင်တဲ့ နှုန်းက တကယ့် ကန့်သတ်ချက်ပါ။ မစစ်ဘဲ ထည့်လိုက်ရင်တော့
      မြန်သလို ထင်ရပေမဲ့ အမှားတွေကို မြန်မြန် ထည့်နေတာပဲ ဖြစ်ပါတယ်။
    sources:
      - {
          title: "Claude Code docs: Best practices (run sessions in parallel: give each piece of work its own checkout so the edits can't collide)",
