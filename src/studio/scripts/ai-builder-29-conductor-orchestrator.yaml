      - {
          id: draw-quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [z-a, z-a-note],
          drawMs: 1200,
        }

  - id: recap
    chapter: ပြန်ချုပ်ရရင်
    narration: >
      [[mark:close-quiz]] ဒါဆို ပြန်ချုပ်ရရင်၊ မရှင်းသေးတဲ့၊ ခက်တဲ့ အလုပ်မှာ agent တစ်ခုတည်းကို အနီးကပ် ကြည့်ပြီး
      တစ်ဆင့်ချင်း ခိုင်းတာက conductor ဖြစ်ပြီး၊ ရှင်းပြီး စစ်လို့ရတဲ့ task တွေကို agent အများဆီ ခွဲအပ်ပြီး
      ရလဒ်ကို စစ်တာက orchestrator ပါ။ [[mark:rc-mode]] task တိုင်းအတွက် mode ကို tool အသစ်ကြောင့် မဟုတ်ဘဲ task ကို
      ကြည့်ပြီး ရွေးပါ။ [[mark:rc-files]] တစ်ပြိုင်နက် အပ်တဲ့ task တွေကို ဖိုင် တူတူ မထိစေပါနဲ့။
      [[mark:rc-review]] agent တစ်ခု တိုးတိုင်း review လုပ်ရမယ့် အလုပ်လည်း တိုးလာလို့၊ ကိုယ် စစ်နိုင်တဲ့ နှုန်းက
      အမြန်နှုန်းရဲ့ ကန့်သတ်ချက်ပါ။ နောက် lesson မှာတော့ spec၊ agent၊ test နဲ့ rule တွေ အားလုံးကို product
      ထုတ်ပေးတဲ့ စက်ရုံ တစ်ခုလို တစ်ပုံတည်း မြင်ကြည့်ပြီး၊ customer တွေဆီ ထုတ်ပေးပြီးနောက် app ကို ဆက်ထိန်းရတဲ့
      maintenance ကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The developer's changing role",
          url: "https://github.com/channyeintun/The-New-SDLC",
