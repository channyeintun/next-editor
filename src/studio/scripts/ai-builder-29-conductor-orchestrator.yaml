build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 6129
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}
scenes:
  - id: recall
    chapter: Agent တစ်ခုလား၊ အများကြီးလား
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ rule ဖိုင်၊ hook၊ sandbox လို model ပတ်လည်က အစိတ်အပိုင်းတွေ၊ harness ကို ကြည့်ခဲ့ပြီး၊
      agent မှားရင် စကား ထပ်ပြောမယ့်အစား setup ကို အရင် ပြင်ဖို့ ပြောခဲ့ပါတယ်။ ဒီနေ့တော့ အဲဒီ harness ထဲမှာ agent
      ကို ဘယ်လို ခိုင်းမလဲ ဆိုတာ ကြည့်ပါမယ်။ [[mark:open-plan]] ပထမ version ကို task လေးတွေ ခွဲထားတဲ့ plan ကို
      ပြန်ကြည့်ရအောင်။ task ဆိုတာ agent ဆီ တစ်ခါ အပ်တဲ့ အလုပ် တစ်ခုပါ။ [[mark:sel-rows]] ဒီ ဇယားကို ကြည့်ရင်း
      စိတ်ကူး တစ်ခု ဝင်လာနိုင်ပါတယ်။ agent တစ်ခုက task တစ်ခု လုပ်နိုင်တယ် ဆိုတော့၊ agent သုံးခုကို task သုံးခု
      တစ်ပြိုင်နက် ပေးလိုက်ရင် သုံးဆ မြန်မလား ဆိုတာပါ။ အဖြေကတော့ task ပေါ်မှာ မူတည်ပါတယ်။ ဘာကြောင့်လဲဆိုတော့ agent
      ကို ခိုင်းပုံ နှစ်မျိုး ရှိလို့ပါ။
    sources:
      - {
          title: "The New SDLC (Burmese edition): Harness engineering",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "The New SDLC (Burmese edition): The developer's changing role (conductors and orchestrators)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - { id: open-plan, type: workspace.openFile, at: { mark: open-plan }, path: docs/plan.md }
      - {
          id: sel-rows,
          type: editor.select,
          at: { mark: sel-rows },
          target:
            {
              file: docs/plan.md,
              text: "| 1 | form ကနေ အော်ဒါ တစ်ခု သိမ်းနိုင်တာ | AC-1 |\n| 2 | မှားတဲ့ input ကို ငြင်းတာ (အရေအတွက်၊ အချိန်၊ ဖုန်း) | AC-2, AC-3, AC-4 |\n| 3 | ကောင်တာစာရင်း | AC-5 |\n",
              occurrence: 1,
            },
        }

  - id: conductor
    chapter: Conductor နဲ့ orchestrator
    narration: >
      [[mark:a-title]] ပထမ ပုံစံကို conductor လို့ ခေါ်ပါတယ်။ [[mark:a-c]] ကိုယ်က agent တစ်ခုတည်းကို အနီးကပ်
      ကြည့်ပြီး တစ်ဆင့်ချင်း ခိုင်းတဲ့ ပုံစံပါ။ agent က ဖိုင် တစ်ခု ပြင်လိုက်တိုင်း ကိုယ်က ကြည့်ပြီး၊ မှားနေရင်
      ချက်ချင်း ပြန်ပြင်ခိုင်းတော့ ပြောင်းလဲမှု တိုင်းက ကိုယ့် မျက်စိအောက်မှာပဲ ရှိပါတယ်။ [[mark:a-c-when]] ဘယ်လို
      အလုပ်မျိုးမှာ သုံးလဲ ဆိုတော့၊ ဘာလုပ်ရမလဲ မရှင်းသေးတဲ့ အလုပ်၊ ခက်တဲ့ အလုပ်၊ ကိုယ် မရင်းနှီးသေးတဲ့ အပိုင်းကို
      ပြင်ရမယ့် အလုပ်တွေပါ။ ဥပမာ plan ရဲ့ ပထမ task က form ကနေ အော်ဒါ သိမ်းတဲ့အထိ တစ်လမ်းလုံးကို ပထမဆုံး ဆောက်တာ
      ဖြစ်လို့ မသေချာတာတွေ အများဆုံးပါ။ [[mark:a-c-cost]] ဒီ ပုံစံမှာ ပေးရတာက ကိုယ့် အချိန်ပါ။ အဆင့်တိုင်း ကိုယ်
      လိုက်ကြည့်နေရတော့၊ agent က ဘယ်လောက်ပဲ မြန်မြန်၊ အလုပ်က ကိုယ် ကြည့်နိုင်တဲ့ နှုန်းထက် မမြန်နိုင်ပါဘူး။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The developer's changing role (the conductor: hands-on, real-time)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: draw-a-title,
          type: whiteboard.apply,
          at: { mark: a-title },
          open: true,
          clear: true,
          upsertIds: [a-title, a-c-h],
        }
      - {
          id: draw-a-c,
          type: whiteboard.apply,
          at: { mark: a-c },
          upsertIds: [a-c-me-box, a-c-me, a-c-ar, a-c-ag-box, a-c-ag, a-c-1],
          drawMs: 2000,
        }
      - {
          id: draw-a-c-when,
          type: whiteboard.apply,
          at: { mark: a-c-when },
          upsertIds: [a-c-2],
          drawMs: 900,
        }
      - {
          id: draw-a-c-cost,
          type: whiteboard.apply,
          at: { mark: a-c-cost },
          upsertIds: [a-c-cost],
          drawMs: 900,
        }

  - id: orchestrator
    narration: >
      [[mark:a-o]] ဒုတိယ ပုံစံကတော့ orchestrator ပါ။ ကိုယ်က အလုပ်ကို task တွေ ခွဲပြီး၊ agent အများကို တစ်ခုစီ
      အပ်ပေးတဲ့ ပုံစံပါ။ [[mark:a-o-fan]] agent တွေက နောက်ကွယ်၊ background မှာ တစ်ခုစီ သီးသန့် အလုပ်လုပ်နေတုန်း၊
      ကိုယ်က တစ်ကြောင်းချင်း ထိုင်မကြည့်ဘဲ တခြား အလုပ် လုပ်နေလို့ ရပါတယ်။ [[mark:a-o-review]] ကြားထဲမှာ တစ်ခါတလေ
      ဝင်ကြည့်ပြီး လမ်းလွဲနေရင် ပြန်ပြင်ပေးပါတယ်။ ရလဒ်တွေ ပြီးလာတဲ့အခါ ကိုယ်က တစ်ခုချင်း စစ်ပြီး လက်ခံမလား၊
      ပြန်ပြင်ခိုင်းမလား ဆုံးဖြတ်ပါတယ်။ ဒီလို စစ်တာက review ပါ။ [[mark:a-o-when]] ဒီ ပုံစံက ဘာလုပ်ရမလဲ ရှင်းပြီး၊
      AC လို စစ်ချက်နဲ့ စစ်လို့ရတဲ့ task တွေအတွက်ပါ။ [[mark:a-o-skills]] ဒီလို အပ်နိုင်ဖို့ လိုတဲ့ ကျွမ်းကျင်မှုက
      code ရေးတာ မဟုတ်ပါဘူး။ task ကို ရှင်းရှင်း ရေးတာ၊ အလုပ်ကို အပိုင်းလေးတွေ ခွဲတာ၊ ရလဒ်ကို မြန်မြန် စစ်တာ၊
      agent အလုပ်လုပ်ရင်း သူ့ဘာသာ စစ်ကြည့်နိုင်မယ့် test နဲ့ rule တွေကို ကြိုထားပေးတာ တွေပါ။ ဒီ course မှာ spec၊
      plan၊ review checklist နဲ့ harness အဖြစ် တစ်ခုချင်း လေ့ကျင့်ခဲ့ပြီးသား အလုပ်တွေပါပဲ။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The developer's changing role (the orchestrator: async delegation; specification, decomposition, evaluation, system design)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: draw-a-o,
          type: whiteboard.apply,
          at: { mark: a-o },
          upsertIds: [a-o-h, a-o-me-box, a-o-me],
          drawMs: 1000,
        }
      - {
          id: draw-a-o-fan,
          type: whiteboard.apply,
          at: { mark: a-o-fan },
          upsertIds:
            [
              a-o-d1,
              a-o-d2,
              a-o-d3,
              a-o-ag1-box,
              a-o-ag1,
              a-o-ag2-box,
              a-o-ag2,
              a-o-ag3-box,
              a-o-ag3,
            ],
          drawMs: 2200,
        }
      - {
          id: draw-a-o-review,
          type: whiteboard.apply,
          at: { mark: a-o-review },
          upsertIds: [a-o-u1, a-o-u2, a-o-u3, a-o-rv-box, a-o-rv],
          drawMs: 1600,
        }
      - {
          id: draw-a-o-when,
          type: whiteboard.apply,
          at: { mark: a-o-when },
          upsertIds: [a-o-when],
          drawMs: 800,
        }
      - {
