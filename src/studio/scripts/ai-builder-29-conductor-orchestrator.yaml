          type: whiteboard.apply,
          at: { mark: a-o-skills },
          upsertIds: [a-o-skill],
          drawMs: 1000,
        }

  - id: places
    narration: >
      agent တွေကို နေရာ သုံးမျိုးမှာ တွေ့ရတယ် ဆိုတာ ရှေ့ lesson တစ်ခုမှာ ပြောခဲ့ပါတယ်။ အဲဒီ နေရာတွေကို ဒီ ပုံစံ
      နှစ်မျိုးနဲ့ တွဲကြည့်ရအောင်။ [[mark:p-ed]] code ရေးတဲ့ program၊ editor ထဲက agent က ဖွင့်ထားတဲ့ ဖိုင်ထဲမှာတင်
      code ကို အကြံပြုပေးတာ၊ ပြင်ပေးတာ လုပ်ပြီး၊ ကိုယ်က တစ်ခုချင်း လက်ခံမလား ရွေးရလို့ conductor ဘက် အစွန်ဆုံးမှာ
      ရှိပါတယ်။ GitHub Copilot လို tool မျိုးပါ။ [[mark:p-te]] command ရိုက်တဲ့ window၊ terminal ထဲက agent ကိုတော့
      ပန်းတိုင် တစ်ခု ပေးလိုက်ရင် ဖိုင် အများကြီးကို ဖတ်ပြီး ပြင်ပါတယ်။ Claude Code လို tool မျိုးပါ။ ဘေးက
      လိုက်ကြည့်နေရင် conductor ဖြစ်ပြီး၊ ရှင်းတဲ့ task ပေးပြီး ထားခဲ့ရင်တော့ orchestrator ဘက် ရောက်သွားပါတယ်။
      [[mark:p-bg]] background agent ကတော့ အင်တာနက်ပေါ်က သီးသန့် စက် တစ်လုံးမှာ အလုပ်လုပ်ပြီး၊ ကိုယ် တခြား
      အလုပ်လုပ်နေတုန်း ရလဒ်ကို review အတွက် ပြန်ပေးလို့ orchestrator ဘက်ပါ။ Jules လို tool မျိုးပါ။ ဒီ နာမည်တွေက
      ဥပမာ သက်သက်ပါ။ tool တစ်ခုမှာ နေရာ တစ်ခုထက် ပိုပါတတ်လို့ ရွေးရမှာက tool မဟုတ်ဘဲ၊ ဒီ task ကို ဘယ်လို ခိုင်းမလဲ
      ဆိုတာပါ။
    sources:
      - {
          title: "The New SDLC (Burmese edition): Coding agents in practice (editor, terminal, background)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
