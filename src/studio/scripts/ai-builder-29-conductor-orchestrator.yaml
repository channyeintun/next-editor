          type: whiteboard.apply,
          at: { mark: p-te },
          upsertIds: [a-p-ar1, a-p-te],
          drawMs: 1000,
        }
      - {
          id: draw-p-bg,
          type: whiteboard.apply,
          at: { mark: p-bg },
          upsertIds: [a-p-ar2, a-p-bg],
          drawMs: 1000,
        }

  - id: choose
    chapter: Task ကို ကြည့်ပြီး ရွေး
    narration: >
      [[mark:b-title]] ဒါဆို task တစ်ခုကို ဘယ် ပုံစံနဲ့ ခိုင်းမလဲ ဆိုတာ ဘယ်လို ရွေးမလဲ။ ဒီ ခိုင်းပုံကို mode လို့
      ခေါ်ပါမယ်။ [[mark:b-q]] မေးခွန်း နှစ်ခု မေးကြည့်ပါ။ ဘာလုပ်ရမလဲ ရှင်းနေပြီလား၊ ပြီးတဲ့အခါ မှန်မမှန် စစ်လို့
      ရလား ဆိုတာပါ။ နှစ်ခုလုံး ဟုတ်ရင် background ကို အပ်လို့ ရပြီး၊ တစ်ခုခု မဟုတ်ရင်တော့ အနီးကပ် လုပ်ပါ။
      [[mark:b-1]] ဥပမာ တချို့ မနက်တွေမှာ အော်ဒါ အနည်းငယ်က လာယူချိန်ကို မှားပြနေတယ် ဆိုပါစို့။ ဘာကြောင့်လဲ
      မသိသေးတော့ အကြောင်းရင်းကို တစ်ဆင့်ချင်း လိုက်ရှာပြီး debug လုပ်ရမှာ ဖြစ်လို့ conductor ပါ။ [[mark:b-2]] SMS
      ပို့ပေးတဲ့ ပြင်ပ service ကို ပထမဆုံး ချိတ်တာကလည်း ကိုယ် မရင်းနှီးသေးတဲ့ အလုပ် ဖြစ်လို့ အနီးကပ် လုပ်ပါမယ်။
      [[mark:b-3]] AC တစ်ခုချင်းကို အလိုလို စစ်ပေးမယ့် test တွေ ရေးခိုင်းတာကတော့ ဘာလိုလဲ ရှင်းပြီး၊ test
      တစ်ခုချင်းက သူ့ AC ကို တကယ် စစ်လား ကိုယ်က ပြန်ကြည့်လို့ ရလို့ background ကို အပ်လို့ ရပါတယ်။ [[mark:b-4]]
      ဖုန်းနံပါတ်ကိုလည်း မြန်မာဂဏန်းနဲ့ လက်ခံအောင် လုပ်တာက AGENTS.md ထဲမှာ rule ရှိပြီးသား ဖြစ်လို့ ဒါလည်း
      background ကို အပ်လို့ ရပါတယ်။ [[mark:b-new]] သတိထားရမှာက tool အသစ်ဆုံး ဖြစ်လို့၊ ဒါမှမဟုတ် agent များများ
      သုံးချင်လို့ ရွေးတာ မဟုတ်ဘဲ၊ task ကို ကြည့်ပြီး ရွေးရတာပါ။
    sources:
      - {
          title: "The New SDLC (Burmese edition): Coding agents in practice (the task decides, not the autonomy ladder)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "The New SDLC (Burmese edition): The developer's changing role (well-defined tasks for background agents; tricky debugging and unfamiliar code for close work)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "Claude Code docs: Overview (writing tests for untested code among the tasks to hand off)",
          url: "https://code.claude.com/docs/en/overview",
        }
    actions:
      - {
          id: draw-b-title,
          type: whiteboard.apply,
          at: { mark: b-title },
          open: true,
          clear: true,
          upsertIds: [b-title],
        }
      - {
          id: draw-b-q,
          type: whiteboard.apply,
          at: { mark: b-q },
          upsertIds: [b-q, b-c-h, b-o-h],
          drawMs: 1300,
        }
      - { id: draw-b-1, type: whiteboard.apply, at: { mark: b-1 }, upsertIds: [b-1], drawMs: 900 }
      - { id: draw-b-2, type: whiteboard.apply, at: { mark: b-2 }, upsertIds: [b-2], drawMs: 900 }
      - { id: draw-b-3, type: whiteboard.apply, at: { mark: b-3 }, upsertIds: [b-3], drawMs: 900 }
      - { id: draw-b-4, type: whiteboard.apply, at: { mark: b-4 }, upsertIds: [b-4], drawMs: 900 }
      - {
          id: draw-b-new,
          type: whiteboard.apply,
          at: { mark: b-new },
          upsertIds: [b-new, b-task],
