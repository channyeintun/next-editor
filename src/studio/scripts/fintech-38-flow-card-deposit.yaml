# Fintech Engineering, lesson 38: end to end, a card deposit (Burmese).
#
# Source: Fintech Engineering Handbook, Appendix B "Flow 2: A card deposit" (CC BY 4.0, Voytek
# Pitula), with pointers back to the lessons that taught each pattern.
# Start state: psp.go (a fake PSP: Authorize with a key, Capture, Get = the truth, signed webhook
# events, Settle = one transfer for many payments), deposit.go (Start, the webhook endpoint
# Receive = verify + store + answer, Process = ask the API + credit once through the receivable),
# settle.go (Reconcile one-to-many, Chargeback as a linked entry, payout), ledger.go (the course
# ledger + Period, Corrects, Get), main.go (two deposits; a forged event; one event twice; one lost).
# Edits, all insert-only, in main.go:
#   1. the settlement batch reconciled, then the books   -> run-2 finds pi_2 and matches po_1
#   2. a payout of 80.00, then a chargeback in December  -> run-3 user 1042 -80.00
# Runs: run-1 (hold, 400, 200 200, credited, already credited), run-2, run-3.
# Figures: flow (the deposit as a sequence, 7 steps), clearing (books vs where the money is),
# late (capture, T+2, chargeback in the dispute window), iv.
# Facts: A18 (Stripe authorization holds), B02 (Stripe webhook delivery), B10 (chargeback window).
# Built by ~/Documents/fintech-course-work/tools/build-lesson.ts; fixtures by sim-go.ts --write.
