  - id: try-it
    chapter: ကိုယ်တိုင် စမ်းကြည့်ပါ
    narration: >-
      [[mark:close-iv]] ကိုယ်တိုင် စမ်းကြည့်ဖို့ တစ်ခု ရှိပါတယ်။ [[mark:sel-try]] ပထမ payment ရဲ့ event ကို ဆောက်တဲ့
      line နဲ့ ပို့တဲ့ line နှစ်ကြောင်းကို ဖျက်ပြီး run ကြည့်ပါ။ webhook နှစ်ခုလုံး ပျောက်သွားတဲ့ အခြေအနေပါ။ ပထမ
      deposit ကိုလည်း settlement batch ရောက်မှ reconciliation က ရှာတွေ့ပြီး credit လုပ်တာ တွေ့ရပါမယ်၊ အဲဒီ
      မတိုင်ခင် user ဘက်မှာ ဘာမှ မပေါ်ပါဘူး။ [[mark:recap]] ပြန်ချုပ်ရရင်၊ card deposit မှာ အဆင့်တိုင်းက
      happy path signal ကို မယုံပါဘူး၊ webhook ကို API နဲ့ စစ်ပြီး ငွေ တကယ် ရောက်တာကို reconciliation နဲ့
      အတည်ပြုပါတယ်။ နောက် lesson မှာ ငွေ system အတွင်းမှာပဲ ရွေ့တဲ့
      conversion ကို ကြည့်ပါမယ်၊ ယူရိုကနေ USDC ပြောင်းပြီး cashback ပေးတဲ့အခါ ဆင့်တစ်ပြားမှ မပေါ်မပျောက်အောင်
      ဘယ်လို လုပ်မလဲ ဆိုတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Flow 2: A card deposit (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#flow-2-a-card-deposit",
        }
