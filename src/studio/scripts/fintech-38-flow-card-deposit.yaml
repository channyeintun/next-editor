      deposit.go: |
        package main

        import (
        	"crypto/hmac"
        	"encoding/json"
        	"fmt"
        )

        // Service is our side: the ledger, the inbox of raw webhooks, and which payments are credited.
        type Service struct {
        	ledger   Ledger
        	psp      *PSP
        	secret   []byte
        	inbox    [][]byte
        	credited map[string]string // PSP payment id → our transaction id
        	owner    map[string]string // PSP payment id → the user's account
        }

        // Start opens a deposit with an idempotency key. The card is only authorized: no credit yet.
        func (s *Service) Start(key, user string, amount int64) Payment {
        	pay := s.psp.Authorize(user+"/deposit/"+key, amount)
        	s.owner[pay.ID] = user
        	return pay
        }

        // Receive is the webhook endpoint: verify the raw bytes, store them, answer. Nothing else.
        func (s *Service) Receive(body []byte, sig string) int {
        	if !hmac.Equal([]byte(sig), []byte(sign(s.secret, body))) {
        		return 400
        	}
        	s.inbox = append(s.inbox, body)
        	return 200
        }

        // Process runs later, off the request path. An event is a hint: the API says what is true.
        func (s *Service) Process() {
        	for _, body := range s.inbox {
        		var evt struct{ ID, Payment string }
        		must(json.Unmarshal(body, &evt))
        		pay := s.psp.Get(evt.Payment)
        		switch {
        		case pay.Status != "captured":
        			fmt.Println(evt.ID, "→ API:", pay.ID, pay.Status, "- nothing to credit")
        		case s.credited[pay.ID] != "":
        			fmt.Println(evt.ID, "→", pay.ID, "already credited")
        		default:
        			s.credit(pay)
        			fmt.Printf("%s → API: %s captured, credited %s\n", evt.ID, pay.ID, cents(pay.Amount))
        		}
        	}
        	s.inbox = nil
        }

        // credit books a captured payment through the PSP receivable: the money is not in our bank yet.
        func (s *Service) credit(pay Payment) {
        	id := "d-" + pay.ID[3:]
        	must(s.ledger.Post(Tx{ID: id, Memo: "card deposit " + pay.ID, Period: "2026-11", Lines: []Line{
        		{Account: "asset:psp-receivable", Debit: pay.Amount - pay.Fee},
        		{Account: "expense:processing-fee", Debit: pay.Fee},
        		{Account: s.owner[pay.ID], Credit: pay.Amount},
        	}}))
        	s.credited[pay.ID] = id
        }
      ledger.go: |
        package main

        import (
        	"fmt"
        	"strings"
        )

        // Line is one row of a transaction: an amount on the debit or the credit side of one account.
        type Line struct {
        	Account string
        	Debit   int64
        	Credit  int64
        }

        // Tx is one business event. All of its lines are posted together, or none of them.
        type Tx struct {
        	ID       string
        	Memo     string
        	Period   string // the reporting period it is booked in
        	Corrects string // the transaction this one reverses, if any
        	Lines    []Line
        }

        // Get returns a posted transaction by id.
        func (l *Ledger) Get(id string) Tx {
        	for _, tx := range l.txs {
        		if tx.ID == id {
        			return tx
        		}
        	}
        	return Tx{}
        }

        // Ledger is an append-only list of posted transactions. Balances are derived from it.
        type Ledger struct {
        	txs []Tx
        }

        // Post appends a transaction only if its debits equal its credits.
        func (l *Ledger) Post(tx Tx) error {
        	var debit, credit int64
        	for _, line := range tx.Lines {
        		debit += line.Debit
        		credit += line.Credit
        	}
        	if debit != credit {
        		return fmt.Errorf("tx %s is not balanced: debit %s, credit %s", tx.ID, cents(debit), cents(credit))
        	}
        	l.txs = append(l.txs, tx)
        	return nil
        }

        // kindOf reads the account type from the name: "asset:bank" is an asset.
        func kindOf(account string) string {
        	kind, _, _ := strings.Cut(account, ":")
        	return kind
        }

        // Balance derives an account's balance on the side where that kind of account grows:
        // assets and expenses grow with debits; liabilities, equity and revenue grow with credits.
        func (l *Ledger) Balance(account string) int64 {
        	var debit, credit int64
        	for _, tx := range l.txs {
        		for _, line := range tx.Lines {
        			if line.Account == account {
        				debit += line.Debit
        				credit += line.Credit
        			}
        		}
        	}
        	if kind := kindOf(account); kind == "asset" || kind == "expense" {
        		return debit - credit
        	}
        	return credit - debit
        }

        // cents prints minor units as an amount with two decimals: cents(1234) is "12.34".
        func cents(n int64) string {
        	sign := ""
        	if n < 0 {
        		sign, n = "-", -n
        	}
        	return fmt.Sprintf("%s%d.%02d", sign, n/100, n%100)
        }
      main.go: |
        package main

        import "fmt"

        const user = "liability:user:1042"

        func main() {
        	psp := newPSP("whsec_shared")
        	s := &Service{psp: psp, secret: []byte("whsec_shared"),
        		credited: map[string]string{}, owner: map[string]string{}}
        	pi1 := s.Start("k-1", user, 100_00)                 // user 1042 tops up 100.00 by card
        	pi2 := s.Start("k-7", "liability:user:2077", 50_00) // user 2077 tops up 50.00
        	fmt.Println(pi1.ID, pi1.Status, "- user 1042 balance", cents(s.ledger.Balance(user)))
        	psp.Capture(pi1.ID)
        	psp.Capture(pi2.ID) // its webhook is lost on the way

        	fake := []byte(`{"id":"evt_9","type":"payment.captured","payment":"pi_1"}`)
        	fmt.Println("evt_9 bad signature:", s.Receive(fake, "00"))
        	body, sig := psp.Event("evt_1", pi1.ID)
        	fmt.Println("evt_1 delivered twice:", s.Receive(body, sig), s.Receive(body, sig))
        	s.Process()
        }

        // report prints the books: what the user is owed, and where the money really is.
        func (s *Service) report() {
        	l := &s.ledger
        	fmt.Printf("user 1042 %s  bank %s  receivable %s  fees %s\n", cents(l.Balance(user)),
        		cents(l.Balance("asset:bank")), cents(l.Balance("asset:psp-receivable")),
        		cents(l.Balance("expense:processing-fee")))
        }

        func must(err error) {
        	if err != nil {
        		panic(err)
        	}
        }
      psp.go: |
        package main

        import (
        	"crypto/hmac"
        	"crypto/sha256"
        	"encoding/hex"
        	"fmt"
        )

        // PSP is a fake payment service provider. Its API is the truth; its webhooks are only hints.
        type PSP struct {
        	secret   []byte
        	payments map[string]*Payment
        	byKey    map[string]string // our idempotency key → payment id
        }

        // Payment is the PSP's record of one card payment.
        type Payment struct {
        	ID, Status  string // authorized, then captured
        	Amount, Fee int64
        }

        func newPSP(secret string) *PSP {
        	return &PSP{[]byte(secret), map[string]*Payment{}, map[string]string{}}
        }

        // Authorize places a hold on the card. The same key returns the same payment.
        func (p *PSP) Authorize(key string, amount int64) Payment {
        	if id, ok := p.byKey[key]; ok {
        		return *p.payments[id]
        	}
        	id := fmt.Sprintf("pi_%d", len(p.payments)+1)
        	p.payments[id] = &Payment{id, "authorized", amount, amount * 29 / 1000} // fee 2.9%
        	p.byKey[key] = id
        	return *p.payments[id]
        }

        // Capture takes the money. The webhook that says so may come late, twice, or never.
        func (p *PSP) Capture(id string) { p.payments[id].Status = "captured" }

        // Get is the authoritative state of a payment.
        func (p *PSP) Get(id string) Payment { return *p.payments[id] }

        // Event is a webhook as it arrives: the raw JSON bytes and an HMAC-SHA256 over exactly them.
        func (p *PSP) Event(evt, payment string) ([]byte, string) {
        	body := []byte(fmt.Sprintf(`{"id":%q,"type":"payment.captured","payment":%q}`, evt, payment))
        	return body, sign(p.secret, body)
        }

        func sign(secret, body []byte) string {
        	m := hmac.New(sha256.New, secret)
        	m.Write(body)
        	return hex.EncodeToString(m.Sum(nil))
        }

        // Batch is one bank transfer that settles many payments at once, net of the PSP's fees.
        type Batch struct {
        	ID    string
        	Items []string
        	Net   int64
        }

        // Settle pays the listed payments out in one transfer, days after the capture.
        func (p *PSP) Settle(id string, items ...string) Batch {
        	b := Batch{ID: id, Items: items}
        	for _, it := range items {
        		b.Net += p.payments[it].Amount - p.payments[it].Fee
        	}
        	return b
        }
      settle.go: |
        package main

        import (
        	"fmt"
        	"strings"
        )

        // Reconcile matches one settlement transfer against the many payments it covers.
        // A payment in the batch that the ledger never credited is a webhook that never came.
        func (s *Service) Reconcile(b Batch) {
        	var parts []string
        	var booked int64
        	for _, id := range b.Items {
        		if s.credited[id] == "" {
        			pay := s.psp.Get(id)
        			s.credit(pay)
        			fmt.Printf("%s in %s, never credited: API says %s, credited %s\n", id, b.ID, pay.Status, cents(pay.Amount))
        		}
        		net := s.ledger.Get(s.credited[id]).Lines[0].Debit
        		booked += net
        		parts = append(parts, id+" "+cents(net))
        	}
        	verdict := "matched"
        	if booked != b.Net {
        		verdict = "BREAK"
        	}
        	fmt.Printf("%s %s = %s: %s\n", b.ID, cents(b.Net), strings.Join(parts, " + "), verdict)
        	must(s.ledger.Post(Tx{ID: b.ID, Memo: "settlement", Period: "2026-11", Lines: []Line{
        		{Account: "asset:bank", Debit: b.Net},
        		{Account: "asset:psp-receivable", Credit: b.Net},
        	}}))
        }

        // Chargeback reverses a credited deposit with a new entry, linked to it, in the open period.
        func (s *Service) Chargeback(payment, period string) {
        	orig := s.ledger.Get(s.credited[payment])
        	user, amount := s.owner[payment], orig.Lines[2].Credit
        	must(s.ledger.Post(Tx{ID: "cb-" + payment[3:], Memo: "chargeback", Period: period, Corrects: orig.ID,
        		Lines: []Line{{Account: user, Debit: amount}, {Account: "asset:psp-receivable", Credit: amount}}}))
        	fmt.Printf("cb-%s reverses %s (%s) in %s: %s %s\n", payment[3:], orig.ID, orig.Period, period,
        		strings.ReplaceAll(strings.TrimPrefix(user, "liability:"), ":", " "), cents(s.ledger.Balance(user)))
        }

        // payout sends a user's money out to their bank account.
        func (s *Service) payout(user string, amount int64) {
        	must(s.ledger.Post(Tx{ID: "po-out", Memo: "payout", Period: "2026-11", Lines: []Line{
        		{Account: user, Debit: amount}, {Account: "asset:bank", Credit: amount}}}))
        }
