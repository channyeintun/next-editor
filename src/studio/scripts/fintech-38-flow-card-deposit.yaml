scenes:
  - id: hook
    chapter: Flow ၂၊ card deposit
    narration: >-
      ငွေ system ထဲကို ငွေ ဝင်လာတဲ့ flow မှာ အခက်က နေရာ ပြောင်းသွားပါတယ်။ withdrawal မှာ နှစ်ခါ
      မပို့ဖို့ပါ၊ card deposit မှာတော့ အပြင်ကမ္ဘာ ပြောတာကို မယုံဖို့နဲ့ တကယ် မရောက်သေးတဲ့ ငွေကို credit
      မလုပ်ဖို့ ဖြစ်လာပါတယ်။ [[mark:pt-req]] user တစ်ယောက်က card နဲ့ ယူရို ၁၀၀ ဖြည့်မယ် ဆိုပါစို့။ submit ကို
      client က retry လုပ်နိုင်လို့ PSP ဆီမှာ deposit ဖွင့်တာကိုလည်း idempotency key နဲ့ပဲ လုပ်ပါတယ်။
      [[mark:flow-2]] PSP က card ကို authorize လုပ်ပြီး hold ချပါတယ်၊ ငွေကို မယူရသေးပါဘူး။ lesson ၁၈ မှာ
      ပြောခဲ့တဲ့ reservation ရဲ့ card version ပါ။ [[mark:pt-hold]] ဒီအဆင့်မှာ user ရဲ့ balance ကို credit
      မလုပ်သေးပါဘူး၊ ငွေက ကိုယ့်ငွေ မဟုတ်သေးလို့ပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Flow 2: A card deposit (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#flow-2-a-card-deposit",
        }
      - {
          title: "Fintech Engineering Handbook — Funds reservation (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#funds-reservation",
        }
    actions:
      - { id: open-main-1, type: workspace.openFile, at: { scene: start }, path: main.go }
      - { id: show-flow, type: slide.show, at: { scene: start, offsetMs: 300 }, slideId: flow-1 }
      - {
          id: pt-title0,
          type: slide.point,
          at: { afterAction: show-flow },
          target: { x: 0.125, y: 0.184 },
        }
      - { id: pt-req, type: slide.point, at: { mark: pt-req }, target: { x: 0.227, y: 0.398 } }
      - { id: flow-2, type: slide.show, at: { mark: flow-2 }, slideId: flow-2 }
      - {
          id: pt-auth,
          type: slide.point,
          at: { afterAction: flow-2 },
          target: { x: 0.599, y: 0.466 },
        }
      - { id: pt-hold, type: slide.point, at: { mark: pt-hold }, target: { x: 0.847, y: 0.535 } }

  - id: webhook
    chapter: Webhook က fact မဟုတ်ဘူး
    narration: >-
      [[mark:flow-3]] capture ဖြစ်တော့ PSP က webhook နဲ့ captured လို့ ပြောပါတယ်။ ဒီ message ကို ဘာမှ
      မယုံပါဘူး။ [[mark:pt-vfy]] lesson ၂၄ မှာလို signature ကို ရောက်လာတဲ့ raw bytes ပေါ်မှာ verify လုပ်၊ raw
      payload ကို သိမ်း၊ success response နဲ့ မြန်မြန် ပြန်ဖြေပြီးမှ async process လုပ်ပါတယ်။ [[mark:pt-stripe]] Stripe
      ကိုယ်တိုင်က event တွေ အစဉ်လိုက် ရောက်မယ်လို့ အာမမခံဘဲ၊ event တစ်ခုကို တစ်ခါထက် ပိုရနိုင်တယ်လို့
      ဆိုထားတာကို အဲဒီ lesson မှာ မြင်ခဲ့ပါပြီ။ [[mark:flow-4]] process လုပ်တဲ့အခါ webhook ရဲ့
      body ကို အမှန်လို့ မယူဘဲ PSP ရဲ့ API ကို payment ရဲ့ authoritative state ကို မေးပါတယ်။ webhook က
      တစ်ခုခု ဖြစ်ခဲ့တယ် ဆိုတဲ့ hint ပဲ ဖြစ်ပြီး၊ နောက်ကျတာ၊ ထပ်ရောက်တာ၊ data ဟောင်း ပါလာတာ၊ ပျောက်တာ
      အကုန် ဖြစ်တတ်လို့ပါ။ [[mark:pt-apply]] apply လုပ်တာကလည်း payment id နဲ့ idempotent ဖြစ်ရပါမယ်၊ captured ကို နှစ်ခါ
      ရလည်း user ကို တစ်ခါပဲ credit လုပ်ဖို့ပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Flow 2: A card deposit (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#flow-2-a-card-deposit",
        }
      - {
          title: "Stripe Docs — How events work (automatic retries, event ordering)",
          url: "https://docs.stripe.com/events/how-events-work",
        }
      - {
          title: "Stripe Docs — Receive Stripe events in your webhook endpoint",
          url: "https://docs.stripe.com/webhooks",
        }
    actions:
      - { id: flow-3, type: slide.show, at: { mark: flow-3 }, slideId: flow-3 }
      - {
          id: pt-wh,
          type: slide.point,
          at: { afterAction: flow-3 },
          target: { x: 0.599, y: 0.604 },
        }
      - { id: pt-vfy, type: slide.point, at: { mark: pt-vfy }, target: { x: 0.351, y: 0.672 } }
      - {
          id: pt-stripe,
          type: slide.point,
          at: { mark: pt-stripe },
          target: { x: 0.599, y: 0.604 },
        }
      - { id: flow-4, type: slide.show, at: { mark: flow-4 }, slideId: flow-4 }
      - {
          id: pt-get,
          type: slide.point,
          at: { afterAction: flow-4 },
          target: { x: 0.599, y: 0.741 },
        }
      - { id: pt-apply, type: slide.point, at: { mark: pt-apply }, target: { x: 0.376, y: 0.316 } }

  - id: books-flow
    chapter: Receivable၊ batch၊ chargeback
    narration: >-
      [[mark:flow-5]] credit ကို clearing account ကနေ လုပ်ပါတယ်။ PSP က capture လုပ်ပြီးပေမဲ့ ကိုယ့်ဘဏ်ကို
      မလွှဲရသေးတဲ့ ငွေမို့ ဘဏ်ထဲ ရောက်ပြီလို့ မဟန်ဆောင်ဘဲ၊ PSP receivable ကို debit လုပ်၊ user ကို
      credit လုပ်ပြီး processing fee ကို expense အဖြစ် book လုပ်ပါတယ်။ lesson ၁၁ ရဲ့ စကားနဲ့ဆို booking time
      က အခု၊ settlement time က T plus X ပါ။ [[mark:flow-6]] ရက်အနည်းငယ် ကြာမှ PSP က deposit အများကြီးကို
      bank transfer တစ်ခုတည်းနဲ့ settle လုပ်ပါတယ်။ ဒါကြောင့် lesson ၂၆ မှာလို reconciliation က one-to-many
      ဖြစ်ပြီး၊ T plus X ကြာမှာကို process ထဲ ကြိုထည့်ထားလို့ settle မဖြစ်သေးရုံ ဖြစ်တဲ့ deposit တွေအတွက်
      alert မထပါဘူး။ webhook လုံးဝ မရောက်ခဲ့တဲ့ deposit ကို ဖမ်းမိတာလည်း ဒီ job ပါပဲ။ [[mark:flow-7]] အပတ်တွေ
      ကြာပြီးမှ cardholder က dispute လုပ်ရင် သူ့ဘဏ်က chargeback နဲ့ ငွေကို အတင်း ပြန်ဆွဲယူပါတယ်။
      [[mark:pt-title]] ဒီ flow တစ်ခုလုံးက No trust၊ ဘယ်သူ့ကိုမှ အလိုလို မယုံရဘူး ဆိုတဲ့ မူပေါ်မှာ ဆောက်ထားတာပါ။
      webhook က fact မဟုတ်ဘဲ trigger ပါ၊ clearing account က ငွေ တကယ် မရွေ့မချင်း ရောက်ပြီလို့ မယူဆပါဘူး၊
      reconciliation က PSP ကို ကိုယ့် books နဲ့ စစ်တာပါ။ [[mark:pt-once]] credit တစ်ခါပဲ လုပ်တာက No invented data ကို၊
      raw payload သိမ်းတာက No lost data ကို ထိန်းပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Flow 2: A card deposit (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#flow-2-a-card-deposit",
        }
      - {
          title: "Fintech Engineering Handbook — Value time vs booking time vs settlement time (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#value-time-vs-booking-time-vs-settlement-time",
        }
      - {
          title: "Fintech Engineering Handbook — Reconciliation (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#reconciliation",
        }
    actions:
      - { id: flow-5, type: slide.show, at: { mark: flow-5 }, slideId: flow-5 }
      - { id: pt-cr, type: slide.point, at: { afterAction: flow-5 }, target: { x: 0.475, y: 0.81 } }
      - { id: flow-6, type: slide.show, at: { mark: flow-6 }, slideId: flow-6 }
      - {
          id: pt-bat,
          type: slide.point,
          at: { afterAction: flow-6 },
          target: { x: 0.723, y: 0.878 },
        }
      - { id: flow-7, type: slide.show, at: { mark: flow-7 }, slideId: flow-7 }
      - {
          id: pt-cb,
          type: slide.point,
          at: { afterAction: flow-7 },
          target: { x: 0.599, y: 0.947 },
        }
      - { id: pt-title, type: slide.point, at: { mark: pt-title }, target: { x: 0.125, y: 0.184 } }
      - { id: pt-once, type: slide.point, at: { mark: pt-once }, target: { x: 0.475, y: 0.81 } }

  - id: code
    chapter: Endpoint နဲ့ worker
    narration: >-
      [[mark:close-flow]] code နဲ့ ကြည့်ရအောင်။ [[mark:open-dep]] Receive က webhook endpoint ပါ။
      [[mark:sel-verify]] signature ကို ရောက်လာတဲ့ bytes အတိုင်း စစ်ပြီး မကိုက်ရင် ၄၀၀ ပြန်ပါတယ်၊ parse လုပ်ပြီး
      ပြန် serialize လုပ်ထားတာကို မစစ်ပါဘူး။ [[mark:sel-inbox]] ကိုက်ရင်
      raw bytes ကို inbox ထဲ သိမ်းပြီး ၂၀၀ ပြန်ပါတယ်၊ ဒီထက် ဘာမှ မလုပ်ပါဘူး။ [[mark:sel-get]] Process က
      နောက်မှ run ပြီး event ထဲက payment id ကိုပဲ ယူပြီး PSP ရဲ့ API ကို state မေးပါတယ်။ [[mark:sel-credited]]
      credit လုပ်ပြီးသား payment ဆိုရင် ကျော်သွားပါတယ်။ [[mark:open-main-2]] main မှာ user နှစ်ယောက်က card နဲ့
      ငွေဖြည့်ပြီး PSP က နှစ်ခုလုံးကို capture လုပ်ပါတယ်။ [[mark:sel-lost]] ဒုတိယ payment ရဲ့ webhook က လမ်းမှာ
      ပျောက်သွားပါတယ်။ [[mark:sel-twice]] signature မမှန်တဲ့ fake event တစ်ခု ရောက်လာပြီး၊ ပထမ payment ရဲ့ event
      အစစ်ကတော့ နှစ်ခါ ရောက်ပါတယ်။ [[mark:run-1]] run လိုက်ရအောင်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Handling webhooks (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#handling-webhooks",
        }
      - { title: "Go standard library — crypto/hmac", url: "https://pkg.go.dev/crypto/hmac" }
    actions:
      - { id: close-flow, type: slide.close, at: { mark: close-flow } }
      - { id: open-dep, type: workspace.openFile, at: { mark: open-dep }, path: deposit.go }
      - id: sel-verify
        type: editor.select
        at: { mark: sel-verify }
        target:
          {
            file: deposit.go,
            text: "\tif !hmac.Equal([]byte(sig), []byte(sign(s.secret, body))) {",
            occurrence: 1,
          }
      - id: sel-inbox
        type: editor.select
        at: { mark: sel-inbox }
        target: { file: deposit.go, text: "\ts.inbox = append(s.inbox, body)", occurrence: 1 }
      - id: sel-get
        type: editor.select
        at: { mark: sel-get }
        target: { file: deposit.go, text: "\t\tpay := s.psp.Get(evt.Payment)", occurrence: 1 }
      - id: sel-credited
        type: editor.select
        at: { mark: sel-credited }
        target: { file: deposit.go, text: "\t\tcase s.credited[pay.ID] != \"\":", occurrence: 1 }
      - { id: open-main-2, type: workspace.openFile, at: { mark: open-main-2 }, path: main.go }
      - id: sel-lost
        type: editor.select
        at: { mark: sel-lost }
        target:
          {
            file: main.go,
            text: "\tpsp.Capture(pi2.ID) // its webhook is lost on the way",
            occurrence: 1,
          }
      - id: sel-twice
        type: editor.select
        at: { mark: sel-twice }
        target:
          {
            file: main.go,
            text: "\tfmt.Println(\"evt_1 delivered twice:\", s.Receive(body, sig), s.Receive(body, sig))",
            occurrence: 1,
          }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "evt_1 → pi_1 already credited",
          timeoutMs: 8000,
        }

  - id: read-1
    narration: >-
      [[mark:pt-auth1]] authorize ပြီးတဲ့ အချိန်မှာ user ရဲ့ balance က သုည ပါပဲ။ [[mark:pt-bad]] fake event ကို
      ၄၀၀ နဲ့ ငြင်းပြီး ဘာမှ မသိမ်းပါဘူး။ [[mark:pt-twice]] event အစစ်ကို နှစ်ခါလုံး သိမ်းပြီး ၂၀၀ ပြန်ပါတယ်၊
      endpoint က dedupe မလုပ်ဘဲ မြန်မြန် ဖြေတာကိုပဲ တာဝန်ယူပါတယ်။ [[mark:pt-cred]] process လုပ်တော့ API က
      captured လို့ အတည်ပြုမှ ယူရို ၁၀၀ ကို credit လုပ်ပြီး၊ [[mark:pt-dup]] ဒုတိယ delivery ကိုတော့ credit
      လုပ်ပြီးသားမို့ ကျော်သွားပါတယ်။ [[mark:dock-1]] ဒီ credit ကို books မှာ ဘယ်လို ရေးလဲ ကြည့်ရအောင်။
      [[mark:show-clear]] user ကို ယူရို ၁၀၀ ပေးရမယ်လို့ credit လုပ်ပေမဲ့၊ [[mark:pt-psp]] ငွေက PSP ဆီမှာပဲ ရှိသေးလို့
      debit ဘက်က ဘဏ် မဟုတ်ဘဲ PSP receivable ပါ၊ fee နုတ်ပြီးသား ပမာဏနဲ့ပါ။ [[mark:clear-2]] settlement ရောက်တော့
      receivable ကို credit လုပ်ပြီး ဘဏ်ကို debit လုပ်ပါတယ်။ transfer တစ်ခုက deposit နှစ်ခုစာ ဖြစ်လို့ ပမာဏက
      ဘယ် deposit တစ်ခုနဲ့မှ မတူပါဘူး။ [[mark:pt-rule]] receivable က လမ်းမှာ ရှိနေတဲ့ ငွေပါ၊ capture
      လုပ်ထားတာ အားလုံး settle ဖြစ်ပြီးရင် သုည ပြန်ဖြစ်ရပါမယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Flow 2: A card deposit (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#flow-2-a-card-deposit",
        }
      - {
          title: "Fintech Engineering Handbook — Double-entry bookkeeping (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#double-entry-bookkeeping",
        }
    actions:
      - id: pt-auth1
        type: console.point
        at: { mark: pt-auth1 }
        target: { text: "pi_1 authorized - user 1042 balance 0.00", occurrence: 1 }
      - id: pt-bad
        type: console.point
        at: { mark: pt-bad }
        target: { text: "evt_9 bad signature: 400", occurrence: 1 }
      - id: pt-twice
        type: console.point
        at: { mark: pt-twice }
        target: { text: "evt_1 delivered twice: 200 200", occurrence: 1 }
      - id: pt-cred
        type: console.point
        at: { mark: pt-cred }
        target: { text: "evt_1 → API: pi_1 captured, credited 100.00", occurrence: 1 }
      - id: pt-dup
        type: console.point
        at: { mark: pt-dup }
        target: { text: "evt_1 → pi_1 already credited", occurrence: 1 }
      - { id: dock-1, type: runtime.collapseDock, at: { mark: dock-1 } }
      - {
          id: show-clear,
          type: slide.show,
          at: { mark: show-clear, offsetMs: -700 },
          slideId: clearing-1,
        }
      - {
          id: pt-user,
          type: slide.point,
          at: { afterAction: show-clear },
          target: { x: 0.113, y: 0.509 },
        }
      - { id: pt-psp, type: slide.point, at: { mark: pt-psp }, target: { x: 0.788, y: 0.46 } }
      - { id: clear-2, type: slide.show, at: { mark: clear-2 }, slideId: clearing-2 }
      - {
          id: pt-bank,
          type: slide.point,
          at: { afterAction: clear-2 },
          target: { x: 0.113, y: 0.74 },
        }
      - { id: pt-rule, type: slide.point, at: { mark: pt-rule }, target: { x: 0.261, y: 0.931 } }

  - id: settle
    chapter: ပျောက်တဲ့ webhook ကို ဘယ်သူ ရှာမလဲ
    narration: >-
      [[mark:close-clear]] code နဲ့ စမ်းကြည့်ရအောင်။ [[mark:type-batch]] ရက်အနည်းငယ် ကြာတော့ PSP က payment
      နှစ်ခုလုံးကို batch တစ်ခုတည်းနဲ့ settle လုပ်ပါတယ်။ Reconcile က batch ထဲက payment တိုင်းကို ledger နဲ့
      တိုက်ပြီး၊ transfer ပမာဏနဲ့ ကိုယ် book လုပ်ထားတဲ့ receivable ပေါင်းလဒ် ညီလား စစ်ပါတယ်။ webhook
      ပျောက်ခဲ့တဲ့ ဒုတိယ deposit ကို ledger က ဘယ်အချိန်မှာ သိမလဲ ခန့်မှန်းကြည့်ပါ။ [[mark:run-2]] run လိုက်ရအောင်။
      [[mark:pt-found]] batch ထဲမှာ ပါပေမဲ့ ledger က မကြားဖူးတဲ့ payment ကို တွေ့ပါတယ်။ webhook ကို ဆက်မစောင့်ဘဲ
      API ကို မေးပြီး ပုံမှန် credit လမ်းကြောင်းနဲ့ပဲ credit လုပ်လိုက်တာပါ၊ lesson ၂၆ ရဲ့ first-class tool နဲ့
      ပြင်တာဖြစ်ပြီး ကိုက်အောင် ကိန်းဂဏန်း ပြင်ရေးတာ မဟုတ်ပါဘူး။ [[mark:pt-match]] အဲဒီနောက် transfer တစ်ခုက payment နှစ်ခုရဲ့ fee နုတ်ပြီး
      ပမာဏ ပေါင်းလဒ်နဲ့ ကိုက်ပါတယ်။ [[mark:pt-books2]] receivable က သုည ပြန်ဖြစ်ပြီး ငွေက ဘဏ်ထဲ ရောက်ပါပြီ။
      [[mark:dock-2]] webhook လုံးဝ မရောက်ရင် ဒီ job မရှိဘဲ user ၂၀၇၇ ရဲ့ ယူရို ငါးဆယ်က ဘဏ်ထဲ ရောက်နေပေမဲ့
      user ဘက်မှာ ပေါ်မလာပါဘူး။
    sources:
      - {
          title: "Fintech Engineering Handbook — Reconciliation (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#reconciliation",
        }
      - {
          title: "Fintech Engineering Handbook — Flow 2: A card deposit (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#flow-2-a-card-deposit",
        }
    actions:
      - { id: close-clear, type: slide.close, at: { mark: close-clear } }
      - id: type-batch
        type: editor.type
        at: { mark: type-batch }
        target: { file: main.go, after: "\ts.Process()\n", occurrence: 1 }
        text: "\n\tbatch := psp.Settle(\"po_1\", pi1.ID, pi2.ID) // days later, one transfer for both\n\ts.Reconcile(batch)\n\ts.report()\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "po_1 145.65 = pi_1 97.10 + pi_2 48.55: matched",
          timeoutMs: 8000,
        }
      - id: pt-found
        type: console.point
        at: { mark: pt-found }
        target: { text: "pi_2 in po_1, never credited", occurrence: 1 }
      - id: pt-match
        type: console.point
        at: { mark: pt-match }
        target: { text: "po_1 145.65 = pi_1 97.10 + pi_2 48.55: matched", occurrence: 1 }
      - id: pt-books2
        type: console.point
        at: { mark: pt-books2 }
        target: { text: "receivable 0.00", occurrence: 1 }
      - { id: dock-2, type: runtime.collapseDock, at: { mark: dock-2 } }
      - {
          id: expect-file,
          type: expect.file,
          at: { afterAction: run-2 },
          path: main.go,
          contains: "s.Reconcile(batch)",
        }

  - id: chargeback
    chapter: ခက်တဲ့ နေရာ၊ အပတ်တွေ ကြာမှ chargeback
    narration: >-
      [[mark:show-late]] ဒါပေမဲ့ settle ဖြစ်ပြီးတာနဲ့ ပြီးတာ မဟုတ်ပါဘူး။ [[mark:pt-cap]] capture တဲ့နေ့မှာ deposit
      ကို book လုပ်ပါတယ်။ [[mark:late-2]] ရက်နှစ်ရက် အကြာမှာ settle ဖြစ်ပြီး receivable ပိတ်သွားပါတယ်။
      [[mark:late-3]] cardholder က dispute လုပ်နိုင်တဲ့ ကာလကတော့ အများကြီး ပိုရှည်ပါတယ်။ card network တွေက
      ပုံမှန်အားဖြင့် မူလ payment ကနေ ရက် ၁၂၀ အတွင်း dispute စခွင့်ပေးပြီး၊ တချို့ case တွေမှာ ပိုကြာခွင့်
      ရှိပါတယ်။ [[mark:pt-link]] chargeback ရောက်လာရင် မူလ posting ကို မပြင်ဘဲ lesson ၁၅ မှာလို link ပါတဲ့
      compensating entry အသစ်ကို post လုပ်ပါတယ်၊ deposit က နိုဝင်ဘာ period ထဲမှာ ကျန်ပြီး reversal က ဒီဇင်ဘာမှာ
      ကျပါတယ်။ [[mark:pt-neg]] user က ဒီကြားထဲမှာ ငွေကို သုံးပြီးသွားရင် balance က အနုတ် ဖြစ်သွားပါတယ်။ ဒါက
      capture မှာ credit လုပ်လိုက်တဲ့ ဆုံးဖြတ်ချက်ရဲ့ ကုန်ကျစရိတ်ပါ၊ settle မဖြစ်ခင်၊ dispute window မကုန်ခင် ငွေကို
      သုံးခွင့် ပေးထားလို့ပါ။ lesson ၁၉ မှာလို overdraft အဖြစ် book လုပ်ပြီး ပြန်ယူရပါတယ်။ [[mark:close-late]] code
      နဲ့ စမ်းကြည့်ရအောင်။ [[mark:type-cb]] user ၁၀၄၂ က ယူရို ရှစ်ဆယ်ကို သူ့ဘဏ်ကို ထုတ်သွားပြီး၊ အပတ်တွေ ကြာမှ
      ပထမ payment အတွက် chargeback ရောက်လာပါတယ်။ Chargeback က မူလ entry ကို link လုပ်ပြီး ဒီဇင်ဘာ period မှာ post
      လုပ်ပါတယ်။ ပြီးရင် books ကို ပြန်ထုတ်ပါတယ်။ [[mark:run-3]] run လိုက်ရအောင်။ [[mark:pt-cbline]] reversal က
      နိုဝင်ဘာက deposit ကို ညွှန်ပြီး ဒီဇင်ဘာမှာ book ဖြစ်ပါတယ်၊ user balance က အနုတ် ရှစ်ဆယ် ဖြစ်သွားပါတယ်။
      [[mark:pt-books3]] receivable ကလည်း အနုတ် ဖြစ်သွားပါတယ်၊ ဆိုလိုတာက cardholder ကို ပြန်ပေးလိုက်တဲ့ ငွေအတွက်
      ကိုယ်က PSP ကို ပေးစရာ ရှိနေတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Flow 2: A card deposit (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#flow-2-a-card-deposit",
        }
      - {
          title: "Stripe Docs — How disputes work (dispute timing)",
          url: "https://docs.stripe.com/disputes/how-disputes-work",
        }
      - {
          title: "Fintech Engineering Handbook — Reversals and corrections (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#reversals-and-corrections",
        }
    actions:
      - {
          id: show-late,
          type: slide.show,
          at: { mark: show-late, offsetMs: -700 },
          slideId: late-1,
        }
      - { id: pt-cap, type: slide.point, at: { mark: pt-cap }, target: { x: 0.09, y: 0.618 } }
      - { id: late-2, type: slide.show, at: { mark: late-2 }, slideId: late-2 }
      - {
          id: pt-set,
          type: slide.point,
          at: { afterAction: late-2 },
          target: { x: 0.243, y: 0.422 },
        }
      - { id: late-3, type: slide.show, at: { mark: late-3 }, slideId: late-3 }
      - {
          id: pt-end,
          type: slide.point,
          at: { afterAction: late-3 },
          target: { x: 0.881, y: 0.422 },
        }
      - { id: pt-link, type: slide.point, at: { mark: pt-link }, target: { x: 0.275, y: 0.864 } }
      - { id: pt-neg, type: slide.point, at: { mark: pt-neg }, target: { x: 0.731, y: 0.864 } }
      - { id: close-late, type: slide.close, at: { mark: close-late } }
      - id: type-cb
        type: editor.type
        at: { mark: type-cb }
        target: { file: main.go, after: "\ts.report()\n", occurrence: 1 }
        text: "\n\ts.payout(user, 80_00)           // the user moves 80.00 out to their bank\n\ts.Chargeback(pi1.ID, \"2026-12\") // weeks later the cardholder disputes it\n\ts.report()\n"
        cadence: line-by-line
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "cb-1 reverses d-1 (2026-11) in 2026-12: user 1042 -80.00",
          timeoutMs: 8000,
        }
      - id: pt-cbline
        type: console.point
        at: { mark: pt-cbline }
        target: { text: "cb-1 reverses d-1", occurrence: 1 }
      - id: pt-books3
        type: console.point
        at: { mark: pt-books3 }
        target: { text: "receivable -100.00", occurrence: 1 }

  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] Fintech system design interview တွေမှာ card နဲ့ top-up လုပ်တဲ့ feature တစ်ခု ဒီဇိုင်းဆွဲပါ
      လို့ မေးလေ့ရှိပါတယ်။ webhook ရောက်ရင် balance တိုးမယ် လို့ပဲ ဖြေရင် မလုံလောက်ပါဘူး။ [[mark:iv-a]] ပထမ၊
      authorization က hold ပဲ ဖြစ်လို့ credit မလုပ်သေးပါဘူး၊ capture ဖြစ်မှ credit လုပ်ပါတယ်။ [[mark:iv-b]]
      ဒုတိယ၊ webhook ကို raw bytes ပေါ်မှာ verify လုပ်၊ သိမ်း၊ မြန်မြန် ဖြေပြီး၊ worker က API ကို မေးပြီး payment id
      နဲ့ idempotent ဖြစ်အောင် apply လုပ်ပါ။ [[mark:iv-c]] တတိယ၊ PSP receivable ကနေ credit လုပ်ပြီး settlement
      batch ကို one-to-many reconcile လုပ်ပါ၊ T plus X ကို ကြိုထည့်ထားပြီး ပျောက်တဲ့ webhook ကို ဒီ job က
      ဖမ်းပါတယ်။ [[mark:iv-d]] ပြီးရင် chargeback ကို ဆက်ပြောပါ။ link ပါတဲ့ reversal ကို နောက် period မှာ post လုပ်ပြီး
      အနုတ် balance ကို overdraft အဖြစ် ပြန်ယူမယ်၊ build လုပ်မှာက inbox table၊ worker၊ receivable account နဲ့ ညတိုင်း
      run တဲ့ reconciliation job ဆိုတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Flow 2: A card deposit (Voytek Pitula, CC BY 4.0)",
