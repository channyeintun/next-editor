build:
  voiceProfile:
    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 9504

runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "json: {\"amount\": 9007199254740993, \"currency\": \"EUR\"}\nmap[string]any: 9007199254740992 (float64)\n"
      run-2:
        status: success
        exitCode: 0
        output: "json: {\"amount\": 9007199254740993, \"currency\": \"EUR\"}\nmap[string]any: 9007199254740992 (float64)\nstruct int64:   9007199254740993\n"
      run-3:
        status: success
        exitCode: 0
        output: "json: {\"amount\": 9007199254740993, \"currency\": \"EUR\"}\nmap[string]any: 9007199254740992 (float64)\nstruct int64:   9007199254740993\nwire: {\"amount\":\"90071992547409.93\",\"currency\":\"EUR\"}\nround trip: true\n"

scenes:
  - id: hook
    chapter: Boundary မှာ ပျောက်တဲ့ ငွေ
    narration: >-
      ledger ထဲမှာ ငွေပမာဏကို ကိန်းပြည့်နဲ့ အတိအကျ သိမ်းထားပေမဲ့၊ အဲဒီ ပမာဏက service တစ်ခုကနေ
      တစ်ခုကို JSON နဲ့ ဖြတ်သွားရပါတယ်။ ကိုယ့် code ဂရုစိုက်ထားသလောက် boundary က ဂရုမစိုက်ပါဘူး။
      [[mark:sel-body]] ဒီ JSON မှာ amount ကို ဂဏန်း သက်သက် number အဖြစ် ပို့ထားပြီး၊ တန်ဖိုးက
      နှစ်ရဲ့ ၅၃ ထပ်ထက် တစ် ပိုတဲ့ ကိန်းပြည့်ပါ။ [[mark:sel-generic]] အဲဒါကို type မကြေညာထားတဲ့
      generic map ထဲ decode လုပ်ပြီး ပြန်ထုတ်ပြပါမယ်။ script တွေ၊ log pipeline တွေ၊ type မသိတဲ့
      service တွေ JSON ကို ဖတ်တဲ့ ပုံစံအတိုင်းပါ။ run မလုပ်ခင် ဘာထွက်မလဲ ခန့်မှန်းကြည့်ပါ။
      [[mark:run-1]] run လိုက်ရအောင်။ [[mark:pt-map]] နောက်ဆုံး digit က သုံး မဟုတ်ဘဲ နှစ်
      ဖြစ်သွားပြီး type က float ဖြစ်နေပါတယ်။ error မတက်ဘဲ ဆင့် တစ်ခု ပျောက်သွားတာပါ။ handbook
      ပြောသလို parser အများစုက ဒီလို bare JSON number ကို double အဖြစ် ဖတ်လို့ပါ။ [[mark:dock-1]]
      ဆိုလိုတာက ကိုယ့်ဘက်မှာ ဂရုတစိုက် သိမ်းထားတာ boundary ရောက်တာနဲ့ အလကား ဖြစ်သွားနိုင်ပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Precision handling (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#precision-handling",
        }
      - {
          title: "Go standard library — encoding/json, Unmarshal",
          url: "https://pkg.go.dev/encoding/json#Unmarshal",
        }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }
      - id: sel-body
        type: editor.select
        at: { mark: sel-body }
        target:
          {
            file: main.go,
            text: 'var body = []byte(`{"amount": 9007199254740993, "currency": "EUR"}`)',
            occurrence: 1,
          }
      - id: sel-generic
        type: editor.select
        at: { mark: sel-generic }
        target:
          {
            file: main.go,
            text: "\tvar generic map[string]any\n\tmust(json.Unmarshal(body, &generic))",
            occurrence: 1,
          }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "map[string]any: 9007199254740992 (float64)",
          timeoutMs: 8000,
        }
      - id: pt-map
        type: console.point
        at: { mark: pt-map }
        target: { text: "map[string]any:", occurrence: 1 }
      - { id: dock-1, type: runtime.collapseDock, at: { mark: dock-1 } }

  - id: struct
    narration: >-
      [[mark:type-struct]] ဒီတစ်ခါ ၆၄ bit ကိန်းပြည့် field ပါတဲ့ struct ထဲကို decode လုပ်ပါမယ်။ type
      ကို ကြိုသိထားရင် Go က number ကို float မဖြတ်ဘဲ ကိန်းပြည့်အဖြစ် တိုက်ရိုက် ဖတ်ပါတယ်။ bytes
      တွေကတော့ အရင်အတိုင်းပါပဲ။ [[mark:run-2]] run လိုက်ရအောင်။ [[mark:pt-struct]] နောက်ဆုံး digit
      က သုံး အမှန် ပြန်ဖြစ်ပါတယ်။ Go ဘက်မှာ ပြဿနာ ပြေလည်သွားပြီလို့ ထင်ရပါတယ်။ [[mark:dock-2]]
      ဒါပေမဲ့ ဒီ JSON ကို ဖတ်မှာက ကိုယ့် Go code တစ်ခုတည်း မဟုတ်ပါဘူး။
    sources:
      - {
          title: "Fintech Engineering Handbook — Precision handling (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#precision-handling",
        }
      - {
          title: "Go standard library — encoding/json, Unmarshal",
          url: "https://pkg.go.dev/encoding/json#Unmarshal",
        }
    actions:
      - id: type-struct
        type: editor.type
        at: { mark: type-struct }
        target:
          { file: main.go, after: "generic[\"amount\"], generic[\"amount\"])\n", occurrence: 1 }
        text: "\n\tvar s struct{ Amount int64 }\n\tmust(json.Unmarshal(body, &s))\n\tfmt.Println(\"struct int64:  \", s.Amount)\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "struct int64:   9007199254740993",
          timeoutMs: 8000,
        }
      - id: pt-struct
        type: console.point
        at: { mark: pt-struct }
        target: { text: "struct int64:", occurrence: 1 }
      - { id: dock-2, type: runtime.collapseDock, at: { mark: dock-2 } }

  - id: edge
    chapter: ဖတ်တဲ့ဘက်ကို မထိန်းနိုင်ဘူး
    narration: >-
      [[mark:show-edge]] ကိုယ့် ledger service က ၆၄ bit ကိန်းပြည့်ကို အတိအကျ encode လုပ်ပါတယ်။ [[mark:pt-bytes]]
      wire ပေါ်မှာ သွားတာက ဂဏန်း စာလုံးတွေပဲ ဖြစ်ပြီး type မပါပါဘူး၊ ဘယ်လို ဖတ်မလဲ ဆိုတာ ဖတ်တဲ့ဘက်က
      ဆုံးဖြတ်ပါတယ်။ [[mark:edge-2]] JavaScript ရဲ့ JSON parser က number တိုင်းကို double အဖြစ် ဖတ်ပါတယ်။ double မှာ ကိန်းပြည့်တိုင်းကို
      တစ်လုံးမကျန် မှတ်နိုင်တာ နှစ်ရဲ့ ၅၃ ထပ်အထိပဲ ဖြစ်လို့၊ အဲဒီ ကျော်ရင် ဘေးချင်းကပ် ကိန်းပြည့်တွေ တန်ဖိုး တစ်ခုတည်း ဖြစ်သွားပါတယ်။ [[mark:pt-wrong]] ဒါကြောင့် ဒီ
      client က ခုနက map လိုပဲ နှစ် နဲ့ ဆုံးတဲ့ တန်ဖိုး ရပါတယ်။ [[mark:edge-3]] ပို့တဲ့ဘက်ရော
      ဖတ်တဲ့ဘက်ရော spec အတိုင်း လုပ်တာ ဖြစ်လို့ ဘယ်ဘက်မှာမှ error မပေါ်ပါဘူး။ ကိုယ့် struct မှန်နေတာက
      user ရဲ့ app မှာ ပြတဲ့ balance မှန်တယ်လို့ အာမခံ မပေးပါဘူး။
      [[mark:edge-4]] ပိုဆိုးတာက ကြားထဲက service တစ်ခုက generic type ထဲ decode လုပ်ပြီး ပြန် encode လုပ်တဲ့
      အခါပါ။ အဲဒီ service က နှစ် နဲ့ ဆုံးတဲ့ တန်ဖိုးကို JSON ထဲ ပြန်ရေးလိုက်လို့၊ နောက်က service တိုင်းက
      မှားနေတဲ့ ပမာဏကို မှန်တယ်လို့ ယူသွားပါတယ်။ [[mark:usenum]] Go မှာဆိုရင် decoder ရဲ့ UseNumber option က number ကို မူလ စာလုံးတွေအတိုင်း ထိန်းထားပေးပါတယ်။
    sources:
