# Fintech Engineering, lesson 04: money at the JSON boundary (Burmese).
#
# Source: Fintech Engineering Handbook, "Precision handling" (the last paragraph, serialization)
# and "Testing" (round-trip testing) (CC BY 4.0, Voytek Pitula).
# Start state: main.go decodes {"amount": 9007199254740993, "currency": "EUR"} into a
# map[string]any and prints the amount; money.go holds the kit's Money, format and parseMinor,
# plus Money.UnmarshalJSON for {"amount":"12.34","currency":"EUR"}.
# Edits, all insert-only, in main.go:
#   1. decode the same bytes into a struct with an int64 field   -> run-2: ...993, exact in Go
#   2. Money.MarshalJSON: the amount as a decimal string           (no run)
#   3. a round trip: encode, decode, compare                       -> run-3: the wire bytes, true
# Figures: edge (int64 → JSON → a JavaScript double), limit (2^53 − 1 on a ruler), wire (four
# real API shapes), iv (the interview answer).
# Built by ~/Documents/fintech-course-work/tools/build-lesson.ts; fixtures by sim-go.ts --write.
