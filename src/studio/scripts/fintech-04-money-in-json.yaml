    name: Fintech Engineering
    entryFilePath: main.go
    files:
      main.go: |
        package main

        import (
        	"encoding/json"
        	"fmt"
        )

        // body is what arrives from another service: an amount in minor units, as a bare JSON number.
        var body = []byte(`{"amount": 9007199254740993, "currency": "EUR"}`)

        func must(err error) {
        	if err != nil {
        		panic(err)
        	}
        }

        func main() {
        	fmt.Println("json:", string(body))

        	var generic map[string]any
        	must(json.Unmarshal(body, &generic))
        	fmt.Printf("map[string]any: %.0f (%T)\n", generic["amount"], generic["amount"])
        }
      money.go: |
        package main

        import (
        	"encoding/json"
        	"fmt"
        	"strings"
        )

        // exponent is the number of decimal places of each currency this system accepts (ISO 4217).
        var exponent = map[string]int{"EUR": 2, "USD": 2, "JPY": 0, "BHD": 3}

        // Money is an amount counted in the currency's minor units. It is never a float.
        type Money struct {
        	Amount   int64
        	Currency string
        }

        // UnmarshalJSON reads {"amount":"12.34","currency":"EUR"} back into minor units.
        func (m *Money) UnmarshalJSON(b []byte) error {
        	var w struct{ Amount, Currency string }
        	if err := json.Unmarshal(b, &w); err != nil {
        		return err
        	}
        	exp, ok := exponent[w.Currency]
        	if !ok {
        		return fmt.Errorf("unknown currency %q", w.Currency)
        	}
        	n, err := parseMinor(w.Amount, exp)
        	if err != nil {
        		return err
        	}
        	*m = Money{n, w.Currency}
        	return nil
        }

        // format prints minor units with exp decimal places: format(1234, 2) is "12.34".
        func format(minor int64, exp int) string {
        	sign := ""
        	if minor < 0 {
        		sign, minor = "-", -minor
        	}
        	digits := fmt.Sprintf("%0*d", exp+1, minor)
        	if exp == 0 {
        		return sign + digits
        	}
        	return sign + digits[:len(digits)-exp] + "." + digits[len(digits)-exp:]
        }

        // parseMinor reads a decimal string such as "12.34" into minor units without using a float.
        func parseMinor(s string, exp int) (int64, error) {
        	whole, frac, _ := strings.Cut(s, ".")
        	if len(frac) > exp {
        		return 0, fmt.Errorf("%q has more than %d decimal places", s, exp)
        	}
        	frac += strings.Repeat("0", exp-len(frac))
        	var n int64
        	for _, c := range whole + frac {
        		if c < '0' || c > '9' {
        			return 0, fmt.Errorf("%q is not a decimal number", s)
        		}
        		n = n*10 + int64(c-'0')
        	}
        	return n, nil
        }
