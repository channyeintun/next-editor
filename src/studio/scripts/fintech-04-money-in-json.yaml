  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] Fintech interview တွေမှာ API response ထဲမှာ ငွေပမာဏကို ဘယ်လို ပို့မလဲ လို့
      မေးတတ်ပါတယ်။ string နဲ့ ပို့မယ် လို့ပဲ ဖြေရင် မလုံလောက်ပါဘူး၊ ဘာကြောင့်လဲ ဆိုတာပါ ပြောရပါမယ်။
      [[mark:iv-a]] ပထမ၊ bare JSON number ကို parser အများစုက double အဖြစ် ဖတ်လို့၊ နှစ်ရဲ့ ၅၃ ထပ်
      ကျော်တဲ့ ပမာဏက တစ်ဖက်မှာ error မတက်ဘဲ ပြောင်းသွားပါတယ်။ [[mark:iv-b]] ဒုတိယ၊ လုံခြုံတဲ့ ပုံစံ
      နှစ်မျိုး ရှိပါတယ်၊ ဒသမ ပါတဲ့ string နဲ့ အဲဒီ နယ်နိမိတ် အောက်က minor unit ကိန်းပြည့်ပါ။ wei လို ကြီးတဲ့
      crypto ပမာဏကိုတော့ string နဲ့ပဲ ပို့ပါ။ [[mark:iv-c]] တတိယ၊ currency ကို ဘေးမှာ အမြဲ ထည့်ပြီး၊
      ကိန်းပြည့်နဲ့ ပို့ရင် exponent ကို နှစ်ဖက်လုံး သဘောတူထားရပါမယ်။ [[mark:iv-d]] ပြီးရင် ကိုယ်
