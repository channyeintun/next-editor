  - id: limit
    narration: >-
      [[mark:show-limit]] JSON ရဲ့ RFC က number တွေရဲ့ precision ကို မသတ်မှတ်ပါဘူး။ ဒါပေမဲ့ နှစ်ရဲ့ ၅၃
      ထပ် အနုတ် တစ် အတွင်းက ကိန်းပြည့်တွေကိုပဲ နေရာတိုင်းမှာ အတူတူ ဖတ်မယ်လို့ စိတ်ချနိုင်တယ် လို့
      သတိပေးထားပါတယ်။ [[mark:limit-2]] fiat ငွေပမာဏကို minor unit နဲ့ ရေတွက်ရင် ဒီ နယ်နိမိတ်က အလွန်
      ကျယ်ပါတယ်။ [[mark:pt-fiat]] ယူရို တစ်သန်းကို ဆင့်နဲ့ ရေတွက်တာတောင် ဂဏန်း ကိုးလုံးပဲ ရှိပါတယ်။
      [[mark:limit-3]] ether တစ်ခုကို wei နဲ့ ရေတွက်ရင်တော့ float မှာ တွေ့ခဲ့သလိုပဲ ဒီ နယ်နိမိတ်ကို ကျော်သွားပါပြီ။
      [[mark:pt-wei]] ဒါကြောင့် crypto ပမာဏတွေက JSON number နဲ့ ပို့ရင် ဒီ နယ်နိမိတ်ကို အလွယ်တကူ ကျော်လို့ string နဲ့ ပို့တာ အလုံခြုံဆုံးပါ။
    sources:
