  - id: roundtrip
    chapter: String နဲ့ ပို့ပြီး round trip စစ်
    narration: >-
      [[mark:close-limit]] ဒါဆို wire format ကို ကိုယ်တိုင် ဆုံးဖြတ်ရအောင်။ [[mark:type-marshal]] Money
      ကို JSON ပြောင်းတဲ့အခါ amount ကို ဒသမ ပါတဲ့ string အဖြစ်၊ currency ကို ဘေးမှာ ထည့်ပြီး ပို့ပါမယ်။
      string ကို ဘယ် parser ကမှ double အဖြစ် မပြောင်းပါဘူး၊ ဒသမ အမှတ်လည်း ပါပြီးသား ဖြစ်လို့ ဖတ်တဲ့ဘက်က
      exponent ကို ခန့်မှန်းစရာ မလိုပါဘူး။ decode ဘက်ကိုတော့ money ဖိုင်ထဲမှာ ရေးထားပြီးပါပြီ။
      [[mark:type-rt]] ပြီးရင် round trip test တစ်ခု ရေးပါမယ်။ ခုနက ပြဿနာ ဖြစ်ခဲ့တဲ့ ပမာဏကိုပဲ encode
      လုပ်၊ decode ပြန်လုပ်ပြီး မူလ တန်ဖိုးနဲ့ ညီသလား စစ်တာပါ။ မညီရင် boundary မှာ တစ်ခုခု ပျောက်နေတာပါ။
      [[mark:run-3]] run လိုက်ရအောင်။ [[mark:pt-wire]] wire ပေါ်မှာ amount က ဒသမ ပါတဲ့ string ဖြစ်ပြီး
      currency က ဘေးမှာ ပါပါတယ်။ [[mark:pt-rt]] round trip က true ပါ၊ ဆင့် တစ်ခုမှ မပျောက်ပါဘူး။
      handbook က ဒီ test ကို boundary မှာ precision ပျောက်တာနဲ့ serialization bug တွေကို မြန်မြန်
      ဖမ်းနိုင်တဲ့ နည်းလို့ ဆိုပါတယ်။ [[mark:dock-3]] ဒီ test က အလိုအလျောက် generate လုပ်ထားတဲ့ ပမာဏ
      ထောင်ချီနဲ့ run မှ တကယ် အသုံးဝင်ပါတယ်။ ဥပမာ ဒီ code ကိုပဲ အနုတ် ပမာဏ တစ်ခုနဲ့ စမ်းရင် encode က အနုတ် လက္ခဏာ ပါတဲ့ string ထုတ်ပေမဲ့ decode က လက်မခံလို့ round trip ပျက်ပါတယ်။ သတိထားရမှာက ကိုယ့် decoder
      တစ်ခုတည်းနဲ့ round trip လုပ်ရုံ မဟုတ်ဘဲ၊ client သုံးတဲ့ parser နဲ့လည်း စစ်ရပါမယ်။ ဒါက boundary မှာ
      No lost data ကို ကာကွယ်တာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Testing (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#testing",
        }
      - {
          title: "Go standard library — encoding/json, Marshaler",
          url: "https://pkg.go.dev/encoding/json#Marshaler",
        }
    actions:
      - { id: close-limit, type: slide.close, at: { mark: close-limit } }
      - id: type-marshal
        type: editor.type
        at: { mark: type-marshal }
        target: { file: main.go, after: "\t\tpanic(err)\n\t}\n}\n", occurrence: 1 }
        text: "\nfunc (m Money) MarshalJSON() ([]byte, error) {\n\treturn json.Marshal(map[string]string{\n\t\t\"amount\":   format(m.Amount, exponent[m.Currency]),\n\t\t\"currency\": m.Currency,\n\t})\n}\n"
        cadence: line-by-line
      - id: type-rt
        type: editor.type
        at: { mark: type-rt }
        target:
          { file: main.go, after: "\tfmt.Println(\"struct int64:  \", s.Amount)\n", occurrence: 1 }
        text: "\n\tsent := Money{Amount: 9007199254740993, Currency: \"EUR\"}\n\twire, err := json.Marshal(sent)\n\tmust(err)\n\tvar back Money\n\tmust(json.Unmarshal(wire, &back))\n\tfmt.Println(\"wire:\", string(wire))\n\tfmt.Println(\"round trip:\", back == sent)\n"
        cadence: line-by-line
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "round trip: true",
          timeoutMs: 8000,
        }
      - id: pt-wire
        type: console.point
        at: { mark: pt-wire }
        target: { text: "wire:", occurrence: 1 }
      - id: pt-rt
        type: console.point
        at: { mark: pt-rt }
        target: { text: "round trip:", occurrence: 1 }
      - {
          id: expect-file-marshal,
          type: expect.file,
          at: { afterAction: run-3 },
          path: main.go,
          contains: "func (m Money) MarshalJSON() ([]byte, error) {",
        }
      - { id: dock-3, type: runtime.collapseDock, at: { mark: dock-3 } }

  - id: wire
    chapter: တကယ့် API တွေ ဘာလုပ်လဲ
    narration: >-
      [[mark:show-wire]] ဒီနေရာမှာ စိတ်ဝင်စားစရာ ဖြစ်လာပါတယ်၊ တကယ့် API တွေက တစ်ခုစီ မတူတဲ့ ရွေးချယ်မှု
      လုပ်ထားပါတယ်။ [[mark:pt-stripe]] Stripe က amount ကို currency ရဲ့ အသေးဆုံး unit နဲ့ ကိန်းပြည့်အဖြစ်
      ပို့ပါတယ်။ ရိုးရှင်းပေမဲ့ နှစ်ဖက်လုံး exponent ကို တူတူ သိမှ အလုပ်ဖြစ်ပြီး၊ အရင် lesson က ISK လို
      ကွာဟချက်တွေကို သယ်လာပါတယ်။ [[mark:wire-2]] PayPal ရဲ့ Orders API က currency code နဲ့ value ကို
      object တစ်ခုထဲ ထည့်ပြီး value ကို string နဲ့ ပို့ပါတယ်။ [[mark:wire-3]] Google ရဲ့ Money type
      ကတော့ ကိန်းပြည့် အပိုင်းကို units၊ ဒသမ အပိုင်းကို nanos ဆိုပြီး ကိန်းပြည့် နှစ်ခု ခွဲသိမ်းလို့၊ float
      မပါဘဲ ဒသမ ကိုးလုံးအထိ ကိုင်နိုင်ပါတယ်။ [[mark:wire-4]] X ရဲ့ API က ငွေ မဟုတ်ပေမဲ့ ပြဿနာ
      အတူတူကို ကြုံခဲ့ပါတယ်။ ID တွေက ၆၄ bit ကိန်းပြည့် ဖြစ်ပြီး JavaScript က bit ၅၃ လုံးပဲ အတိအကျ
      ကိုင်နိုင်လို့၊ API version အဟောင်းမှာ number နဲ့ string နှစ်မျိုးလုံး ပြန်ပို့ပြီး version အသစ်မှာ
      string ကို default လုပ်ထားပါတယ်။ [[mark:pt-rule]] ဘယ်ပုံစံ ရွေးရွေး currency ကို amount ဘေးမှာ
      ထည့်ရပြီး၊ ရွေးထားတဲ့ ပုံစံကို API contract ထဲမှာ ရှင်းရှင်း ရေးထားရပါမယ်။
