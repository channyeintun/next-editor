runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: need
    chapter: ချိုးဖောက်မှု ၃၄၀
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ architecture စည်းကမ်း တစ်ခုကို ဂဏန်းနဲ့ အောင်မအောင် ဆုံးဖြတ်တဲ့ အလိုအလျောက် စစ်ဆေးချက်၊
      fitness function အဖြစ် ပြောင်းပုံကို လေ့လာခဲ့ပါတယ်။
      [[mark:open-doc]] module တစ်ခုက တခြား module ရဲ့ table ကို မထိရဘူး ဆိုတဲ့ စစ်ဆေးချက်ကို၊ ခရီးဖော် ရဲ့ code
      အားလုံးပေါ်မှာ ပထမဆုံး run ကြည့်လိုက်ပါတယ်။
      [[mark:sel-340]] ရလဒ်က စည်းကမ်း ချိုးထားတဲ့ နေရာ ၃၄၀ ပါ။ team ၁၂ ခုလုံးမှာ ရှိနေပါတယ်။
      [[mark:n-two]] ဘာလုပ်မလဲ ဆိုတာမှာ အမြင် နှစ်မျိုး ကွဲပါတယ်။ architect တစ်ယောက်က စည်းကမ်းက စည်းကမ်းပဲ၊
      ဒီနေ့ကစပြီး gate ကို ဖွင့်လိုက်မယ်လို့ ဆိုပါတယ်။ Booking team lead မောင်မောင် ကတော့ အဲဒီလိုဆို team ၁၂ ခုလုံး
      ဘာမှ deploy လုပ်လို့ မရတော့ဘူး၊ တစ်ပတ်မပြည့်ခင် gate ကို ပြန်ပိတ်ခိုင်းကြလိမ့်မယ်လို့ ထောက်ပြပါတယ်။
      [[mark:n-both]] နှစ်ယောက်လုံး မှန်ပါတယ်။ gate ကို ချက်ချင်း ဖွင့်ရင် delivery ရပ်သွားပြီး၊ စစ်ဆေးချက်ကိုယ်တိုင်
      အပိတ်ခံရပါမယ်။ သတိပေးရုံပဲ ထားရင်တော့ ၃၄၀ က ၄၀၀ ဖြစ်လာနိုင်ပါတယ်။ ဒီ lesson မှာ ချိုးဖောက်ပြီးသား စည်းကမ်း
      တစ်ခုကို delivery မရပ်စေဘဲ တဖြည်းဖြည်း တင်းကျပ်သွားတဲ့ နည်းကို ကြည့်ပါမယ်။
    sources:
      - {
          title: "Building Evolutionary Architectures, 2nd edition (Ford, Parsons, Kua, Sadalage)",
          url: "https://oreil.ly/evolutionary-arch-2e",
        }
    actions:
      - {
          id: open-notebook,
          type: workspace.openFile,
          at: { mark: open-doc },
          path: notebook/46-rollout.md,
        }
      - id: sel-340
        type: editor.select
        at: { mark: sel-340 }
        target: { file: notebook/46-rollout.md, text: "ပထမဆုံး run: violation 340 (team 12 ခုလုံးမှာ)" }

  - id: staircase
    chapter: Limit ကို တစ်ဆင့်ချင်း လျှော့ချခြင်း
    narration: >
      [[mark:g-open]] သဘောတူထားတဲ့ စည်းကမ်းတွေ တကယ် လိုက်နာမနာ ကြည့်တာကို governance လို့ ခေါ်ပါတယ်။ အဲဒါကို
      architect တွေက code လိုက်ဖတ်ပြီး လုပ်ရင် လူကို စောင့်ကြည့်တဲ့ အလုပ် ဖြစ်သွားပါတယ်။ pipeline က လုပ်ရင်တော့
      လူကို မဟုတ်ဘဲ change ကိုပဲ စစ်တာမို့၊ ဘယ်သူ့အတွက်မဆို တူညီပါတယ်။ ဒါပေမဲ့ pipeline ကို ဘယ်လောက်
      တင်းကျပ်ခိုင်းမလဲ ဆိုတာကတော့ ကိုယ်တို့ ဆုံးဖြတ်ရမှာပါ။
      [[mark:g-today]] ပထမ အဆင့်က ဒီနေ့ရဲ့ ဂဏန်းကို မှတ်ထားတာပါ။ ၃၄၀ ပါ။ ဒါက အပြစ်တင်ဖို့ မဟုတ်ဘဲ၊ စမှတ် တစ်ခု
      ဖြစ်ပါတယ်။
      [[mark:g-q2]] ပြီးရင် ခွင့်ပြုတဲ့ အရေအတွက်ကို သုံးလတစ်ခါ လျှော့ချသွားပါမယ်။ နောက် သုံးလပတ်မှာ ၂၅၀ ပါ။
      [[mark:g-q3]] အဲဒီနောက် သုံးလပတ်မှာတော့ ထက်ဝက်အောက်၊ ၁၂၀ အထိ လျှော့ပါမယ်။
      [[mark:g-q4]] တစ်နှစ်ပြည့်တဲ့အခါ သုည ပါ။ အဲဒီအချိန်ကျမှ စစ်ဆေးချက်က gate အပြည့်အဝ ဖြစ်လာပါမယ်။
      [[mark:g-why]] ဒီလို လှေကားထစ်လို လျှော့ချတာက team တွေကို အချိန် ပေးပါတယ်။ feature အလုပ်တွေကြားမှာ
      သုံးလကို ၁၀၀ လောက်စီ ပြင်သွားရုံပါ။ ဂဏန်းတွေကိုလည်း team lead တွေနဲ့ အတူ သတ်မှတ်တာမို့၊ တကယ် လုပ်နိုင်တဲ့
      အတိုင်းအတာ ဖြစ်ပါတယ်။
    sources:
      - {
          title: "Building Evolutionary Architectures, 2nd edition (Ford, Parsons, Kua, Sadalage)",
          url: "https://oreil.ly/evolutionary-arch-2e",
        }
    actions:
      - {
          id: draw-g-open,
          type: whiteboard.apply,
          at: { mark: g-open },
          open: true,
          clear: true,
          upsertIds: [s-title],
        }
      - {
          id: draw-g-today,
          type: whiteboard.apply,
          at: { mark: g-today },
          upsertIds: [s-b1, s-n1, s-q1],
          drawMs: 1500,
        }
      - {
          id: draw-g-q2,
          type: whiteboard.apply,
          at: { mark: g-q2 },
          upsertIds: [s-b2, s-n2, s-q2],
          drawMs: 1500,
        }
      - {
          id: draw-g-q3,
          type: whiteboard.apply,
          at: { mark: g-q3 },
          upsertIds: [s-b3, s-n3, s-q3],
          drawMs: 1500,
        }
      - {
          id: draw-g-q4,
          type: whiteboard.apply,
          at: { mark: g-q4 },
          upsertIds: [s-b4, s-n4, s-q4],
          drawMs: 1500,
        }

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] ဒီအစီအစဉ်မှာ ကွက်လပ် တစ်ခု ကျန်ပါသေးတယ်။ မေးခွန်း တစ်ခု မေးပါရစေ။
      [[mark:q-sub]] ဒုတိယ သုံးလပတ်မှာ limit က ၂၅၀ ဖြစ်ပြီး၊ လက်ရှိ စုစုပေါင်းက ၂၄၀ ပဲ ရှိတယ် ဆိုပါစို့။ team
      တစ်ခုက ချိုးဖောက်မှု အသစ် တစ်ခု ပါတဲ့ change ကို တင်လိုက်ပါတယ်။ စုစုပေါင်းက ၂၄၁ ဖြစ်သွားပေမဲ့ limit
      အောက်မှာပဲ ရှိပါသေးတယ်။ ဒီ change ကို pipeline က ဘာလုပ်သင့်သလဲ။
      [[mark:q-a]] ပထမ အဖြေက limit မကျော်သေးလို့ ဖြတ်ခွင့် ပေးလိုက်တာပါ။
      [[mark:q-b]] ဒုတိယ အဖြေကတော့ limit အောက်မှာ ရှိလည်း ရပ်လိုက်တာပါ။ lesson ကို pause လုပ်ပြီး
      စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ရပ်လိုက်တာပါ။ ဘာကြောင့်လဲဆိုတော့ limit ဆိုတာ ရှိပြီးသား ချိုးဖောက်မှုတွေကို
      ရှင်းဖို့ ပေးထားတဲ့ အချိန်ပါ။ အသစ် ထပ်ထည့်ဖို့ ပေးထားတဲ့ ခွင့်ပြုချက် မဟုတ်ပါဘူး။
      [[mark:q-rule]] ဒါကြောင့် စည်းကမ်း နောက်တစ်ခု လိုပါတယ်။ ဘယ်နေ့မှာမဆို မနေ့ကထက် မဆိုးရဘူး ဆိုတာပါ။
      ပြင်တဲ့သူတွေက ဂဏန်းကို လျှော့နေချိန်မှာ တခြားသူတွေက ပြန်တိုးနေရင်၊ သုညကို ရောက်ဖို့ ခက်သွားပါတယ်။
      ဒီစည်းကမ်းကတော့ ပထမနေ့ကတည်းက အသက်ဝင်ပါတယ်။ အဟောင်းတွေအတွက် အချိန်ပေးပြီး၊ အသစ်တွေကိုတော့ လုံးဝ
      မပေးဝင်တာပါ။
    sources:
      - {
          title: "Building Evolutionary Architectures, 2nd edition (Ford, Parsons, Kua, Sadalage)",
          url: "https://oreil.ly/evolutionary-arch-2e",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          clear: true,
          upsertIds: [q-title],
          drawMs: 1200,
        }
      - {
          id: draw-q-sub,
          type: whiteboard.apply,
          at: { mark: q-sub },
          upsertIds: [q-sub],
          drawMs: 1200,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: q-rule },
          upsertIds: [q-rule],
          drawMs: 1200,
        }

  - id: placement
    chapter: စစ်ဆေးချက်ကို နေရာချခြင်း
    narration: >
      gate တွေ များလာရင် deploy နှေးသွားမလား ဆိုတာကလည်း မောင်မောင် စိုးရိမ်တဲ့ အချက်ပါ။ အဖြေက
      စစ်ဆေးချက်တွေကို ကြာချိန်အလိုက် pipeline တစ်လျှောက် နေရာချထားတာပါ။
      [[mark:l-fast]] စက္ကန့်ပိုင်းနဲ့ ပြီးတဲ့ စစ်ဆေးချက်တွေကို change တိုင်းမှာ run ပါတယ်။ module boundary နဲ့ cycle
      စစ်တာတွေက ဒီမှာပါ။ developer က အဖြေကို ချက်ချင်း ရပါတယ်။
      [[mark:l-slow]] နာရီနဲ့ချီ ကြာတဲ့ load test လို စစ်ဆေးချက်တွေကိုတော့ change တိုင်းမှာ မ run ဘဲ၊ ညတိုင်း တစ်ခါ
      run ပါတယ်။
      [[mark:l-prod]] တချို့ စစ်ဆေးချက်တွေကတော့ production ထဲမှာ အမြဲ run နေပါတယ်။ ရှာတာ ဘယ်လောက် မြန်လဲ
      တိုင်းတာက တစ်ခုပါ။ ပျက်တာကို တမင် လေ့ကျင့်တဲ့ စမ်းသပ်မှုလည်း ဒီအမျိုးအစားပါ။ instance တစ်ခုကို အပတ်စဉ် တမင်
      ပိတ်ကြည့်တာက၊ ဆက်သုံးလို့ ရမရ၊ data ပျောက်မပျောက်၊ အချက်ပေးတာ အလုပ်လုပ်မလုပ် ဆိုတဲ့ အရည်အသွေး သုံးခုကို
      တစ်ခါတည်း စစ်ပေးတာပါ။
    sources:
      - {
          title: "Building Evolutionary Architectures, 2nd edition (Ford, Parsons, Kua, Sadalage)",
          url: "https://oreil.ly/evolutionary-arch-2e",
        }
    actions:
      - {
          id: draw-l-open,
          type: whiteboard.apply,
          at: { mark: l-fast },
          clear: true,
          upsertIds: [l-d1, l-b1, l-b1-l, l-e1],
          drawMs: 2000,
        }
      - {
          id: draw-l-slow,
          type: whiteboard.apply,
          at: { mark: l-slow },
          upsertIds: [l-a1, l-d2, l-b2, l-b2-l, l-e2],
          drawMs: 2200,
        }
      - {
          id: draw-l-prod,
          type: whiteboard.apply,
          at: { mark: l-prod },
          upsertIds: [l-a2, l-d3, l-b3, l-b3-l, l-e3],
          drawMs: 2200,
        }

  - id: parallel
    chapter: အဟောင်းနဲ့ အသစ်ကို ယှဉ် run ခြင်း
    narration: >
      [[mark:r-open]] governance က code ကို စစ်တာတင် မဟုတ်ပါဘူး။ အပိုင်းအဟောင်း တစ်ခုကို အသစ်နဲ့ လဲတဲ့အခါလည်း
      လိုပါတယ်။ ခရီးဖော် မှာ ကားလိုင်းတွေကို ငွေစာရင်း ရှင်းပေးတဲ့ settlement တွက်ချက်မှုကို အသစ် ပြန်ရေးနေပါတယ်။
      အဟောင်းက နှစ်တွေကြာလာတော့၊ အထဲမှာ ဘယ်လို စည်းကမ်းတွေ ပါလဲ ဆိုတာ ဘယ်သူမှ အကုန် မသိတော့ပါဘူး။
      [[mark:r-both]] ဒါကြောင့် တစ်ခါတည်း မလဲဘဲ၊ တနင်္လာနေ့တိုင်း အဟောင်းရော အသစ်ရော နှစ်ခုလုံးကို data အတူတူနဲ့
      run ပါတယ်။
      [[mark:r-old]] ကားလိုင်းတွေဆီ တကယ် ပေးတာကတော့ အဟောင်းရဲ့ အဖြေပါပဲ။
      [[mark:r-compare]] အသစ်ရဲ့ အဖြေကိုတော့ အဟောင်းနဲ့ တိုက်ကြည့်ပြီး၊ မတူတာတွေကို မှတ်တမ်းတင်ထားပါတယ်။ ပထမ
      အပတ်မှာ ကားလိုင်း ၅၀၀ ထဲက ၂၃ ခုမှာ အဖြေ မတူခဲ့ပါဘူး။ တစ်ခုချင်း လိုက်ကြည့်တော့ ဘယ်မှာမှ ရေးမထားတဲ့
      စည်းကမ်းတွေကို တွေ့ရပါတယ်။
      [[mark:r-trust]] မတူတာ သုည ဖြစ်တဲ့ အပတ်တွေ ဆက်တိုက် ရလာမှ အသစ်ကို ယုံပြီး ပြောင်းသုံးပါတယ်။ ဒီမှာလည်း
      ယုံမယုံကို ခံစားချက်နဲ့ မဟုတ်ဘဲ ဂဏန်းနဲ့ ဆုံးဖြတ်တာပါ။ system အဟောင်းက အသစ်အတွက် test ဖြစ်ပေးသွားတာပါ။
    sources:
      - {
          title: "Building Evolutionary Architectures, 2nd edition (Ford, Parsons, Kua, Sadalage)",
          url: "https://oreil.ly/evolutionary-arch-2e",
        }
    actions:
      - {
          id: draw-r-open,
          type: whiteboard.apply,
          at: { mark: r-open },
          clear: true,
          upsertIds: [r-old, r-old-l],
          drawMs: 1200,
        }
      - {
          id: draw-r-both,
          type: whiteboard.apply,
          at: { mark: r-both },
          upsertIds: [r-new, r-new-l, r-in, r-a1, r-a2],
          drawMs: 2200,
        }
      - {
          id: draw-r-old,
          type: whiteboard.apply,
          at: { mark: r-old },
          upsertIds: [r-pay-a, r-pay],
          drawMs: 1200,
        }
      - {
          id: draw-r-compare,
          type: whiteboard.apply,
          at: { mark: r-compare },
          upsertIds: [r-c1, r-c2, r-diff],
          drawMs: 1500,
        }
      - {
          id: draw-r-trust,
          type: whiteboard.apply,
          at: { mark: r-trust },
          upsertIds: [r-trust],
          drawMs: 1200,
        }

  - id: too-much
    chapter: Governance များလွန်းရင်
    narration: >
      [[mark:s-open]] governance ကို automate လုပ်လို့ ရတာက အားသာချက်ပါ။ ဒါပေမဲ့ များလွန်းတဲ့ governance ကလည်း
      ပျက်စီးမှု တစ်မျိုးပါပဲ။ ထောင်ချောက် သုံးခုကို သတိထားရပါမယ်။
      [[mark:s-stack]] ပထမက ပြဿနာတိုင်းအတွက် stack တစ်ခုတည်းကို သတ်မှတ်လိုက်တာပါ။ service တိုင်းက database
      တစ်မျိုးတည်း၊ framework တစ်မျိုးတည်း သုံးရမယ် ဆိုရင်၊ စာရင်းလေး တစ်ခု ပြရုံ service သေးသေးလေးကလည်း အခက်ဆုံး
      ပြဿနာအတွက် ရွေးထားတဲ့ tool ကြီးတွေကို ထမ်းရပါတယ်။ လုံးဝ လွှတ်ပေးတာလည်း မဟုတ်ဘဲ၊ ရွေးစရာ နှစ်ခု သုံးခုလောက်
      ပေးထားတာက အလယ်လမ်းပါ။
      [[mark:s-vendor]] ဒုတိယက vendor တစ်ခုရဲ့ product ကို ဗဟိုထားပြီး system ကို ပတ်ဆောက်တာပါ။ အဲဒီအခါ product က
      မလုပ်နိုင်တာကို ကိုယ့် business ကလည်း မလုပ်နိုင်တော့ပါဘူး။ ဘယ် product ကိုမဆို ဗဟို မဟုတ်ဘဲ၊ ဆက်ထားတဲ့ အပိုင်း
      တစ်ခုအနေနဲ့ပဲ ထားပါ။
      [[mark:s-ninety]] တတိယက အလုပ်ရဲ့ ၉၀ ရာခိုင်နှုန်းလောက်ကို မြန်မြန် ပြီးစေပြီး၊ ကျန်တဲ့ အပိုင်းမှာ ပိတ်မိစေတဲ့
      tool တွေပါ။ ဒီလို tool ကို စမ်းတဲ့အခါ အလွယ်ဆုံး အလုပ်နဲ့ မစမ်းဘဲ၊ ကိုယ့်မှာ ရှိတဲ့ အခက်ဆုံး အလုပ်နဲ့ အရင်
      စမ်းကြည့်ပါ။
      [[mark:s-easy]] governance က အထိရောက်ဆုံး ဖြစ်တာကတော့ တားတဲ့အခါ မဟုတ်ပါဘူး။ မှန်တဲ့ လမ်းကို အလွယ်ဆုံး လမ်း
      ဖြစ်အောင် လုပ်ပေးတဲ့အခါပါ။ ခရီးဖော် မှာ service အသစ် စတဲ့ team က platform ရဲ့ template ကို ယူလိုက်တာနဲ့၊
      pipeline ရော၊ architecture gate ရော၊ monitor တွေပါ အဆင်သင့် ပါလာပါတယ်။ စည်းကမ်းကို လိုက်နာဖို့ ဘာမှ ထပ်လုပ်စရာ
      မလိုတဲ့အခါ၊ လူတွေက များသောအားဖြင့် လိုက်နာကြပါတယ်။
    sources:
      - {
          title: "Building Evolutionary Architectures, 2nd edition (Ford, Parsons, Kua, Sadalage)",
          url: "https://oreil.ly/evolutionary-arch-2e",
        }
    actions:
      - {
          id: close-parallel,
          type: whiteboard.apply,
          at: { mark: s-open, offsetMs: -1500 },
          open: false,
        }
      - {
          id: show-too-much,
          type: slide.show,
          at: { mark: s-open, offsetMs: -1000 },
          slideId: too-much,
        }
      - { id: point-stack, type: slide.point, at: { mark: s-stack }, target: { x: 0.15, y: 0.39 } }
      - {
          id: point-vendor,
          type: slide.point,
          at: { mark: s-vendor },
          target: { x: 0.15, y: 0.53 },
        }
      - {
          id: point-ninety,
          type: slide.point,
          at: { mark: s-ninety },
          target: { x: 0.15, y: 0.67 },
        }
      - { id: point-easy, type: slide.point, at: { mark: s-easy }, target: { x: 0.15, y: 0.81 } }

  - id: plan
    chapter: Rollout plan
    narration: >
      [[mark:d-close]] ဒါဆို module boundary စစ်ဆေးချက်အတွက် rollout plan ကို ချရေးကြည့်ရအောင်။ သုံးလပတ်
      တစ်ခုစီမှာ limit က ဘယ်လောက်လဲ၊ ကျော်သွားရင် ဘာဖြစ်မလဲ ဆိုတာ ပါရပါမယ်။
      [[mark:type-q1]] အခု သုံးလပတ်မှာ limit က ဒီနေ့ တွေ့တဲ့ ၃၄၀ ပါပဲ။ ဘယ်သူ့ကိုမှ မပိတ်သေးပါဘူး။
      [[mark:type-q2]] နောက် သုံးလပတ်မှာ ၂၅၀ ကို ကျော်နေရင် build တိုင်းမှာ သတိပေးချက် ပြပြီး၊ team lead တွေနဲ့
      ဘာက အခက်အခဲလဲ ဆွေးနွေးပါမယ်။ ပိတ်တာတော့ မဟုတ်သေးပါဘူး။
      [[mark:type-q3]] တတိယ သုံးလပတ်မှာ ၁၂၀ ကို ကျော်နေတဲ့ team ရဲ့ change တွေကို merge မလုပ်ခင် architect
      တစ်ယောက်က ကြည့်ပေးပါမယ်။ နည်းနည်း ပိုတင်းကျပ်လာတာပါ။
      [[mark:type-q4]] စတုတ္ထ သုံးလပတ်မှာ limit က သုည ဖြစ်ပြီး၊ ချိုးဖောက်မှု တစ်ခု ရှိတာနဲ့ build က fail
      ဖြစ်ပါမယ်။ သတိပေးတာကနေ စပြီး တဖြည်းဖြည်း တင်းကျပ်လာတာမို့၊ ဒီနေ့ ရောက်တဲ့အခါ ဘယ်သူမှ အံ့ဩစရာ
      မရှိတော့ပါဘူး။
      [[mark:type-rule]] table ရဲ့ အောက်မှာ နေ့တိုင်း အသက်ဝင်တဲ့ စည်းကမ်းကို ရေးထားပါမယ်။ ချိုးဖောက်မှု အသစ် ထည့်တဲ့
      change ကတော့ limit ဘယ်လောက်ပဲ ဖြစ်ဖြစ် ပထမနေ့ကတည်းက fail ပါ။ ဒီ plan ကို CTO ဖြစ်တဲ့ အောင်အောင် ဆီ
      တင်ပြတဲ့အခါ၊ delivery မရပ်ဘဲ တစ်နှစ်အတွင်း သုည ရောက်မယ် ဆိုတာကို စာတစ်မျက်နှာတည်းနဲ့ ပြနိုင်ပါတယ်။
    sources:
      - {
          title: "Building Evolutionary Architectures, 2nd edition (Ford, Parsons, Kua, Sadalage)",
          url: "https://oreil.ly/evolutionary-arch-2e",
        }
    actions:
      - { id: close-too-much, type: slide.close, at: { mark: d-close } }
      - {
          id: reopen-notebook,
          type: workspace.openFile,
          at: { afterAction: close-too-much },
          path: notebook/46-rollout.md,
        }
      - id: type-q1
        type: editor.type
        at: { mark: type-q1 }
        cadence: line-by-line
        target: { file: notebook/46-rollout.md, after: "|---|---|---|\n" }
        text: "| Q1 (အခု) | 340 | ဒီနေ့ ဂဏန်းကို မှတ်ထား၊ ဘာမှ မပိတ်သေး |\n"
      - id: type-q2
        type: editor.type
        at: { mark: type-q2 }
        cadence: line-by-line
        target: { file: notebook/46-rollout.md, after: "ဘာမှ မပိတ်သေး |\n" }
        text: "| Q2 | 250 | build တိုင်းမှာ warning၊ team lead တွေနဲ့ ဆွေးနွေး |\n"
      - id: type-q3
        type: editor.type
        at: { mark: type-q3 }
        cadence: line-by-line
        target: { file: notebook/46-rollout.md, after: "team lead တွေနဲ့ ဆွေးနွေး |\n" }
        text: "| Q3 | 120 | ကျော်တဲ့ team ရဲ့ merge ကို architect က ကြည့်ပေး |\n"
      - id: type-q4
        type: editor.type
        at: { mark: type-q4 }
        cadence: line-by-line
        target: { file: notebook/46-rollout.md, after: "architect က ကြည့်ပေး |\n" }
        text: "| Q4 | 0 | build fail: check က gate အပြည့်အဝ ဖြစ်ပြီ |\n"
      - id: type-rule
        type: editor.type
        at: { mark: type-rule }
        cadence: line-by-line
        target: { file: notebook/46-rollout.md, after: "gate အပြည့်အဝ ဖြစ်ပြီ |\n" }
        text: "\nနေ့တိုင်း: violation အသစ် ထည့်တဲ့ change က ပထမနေ့ကတည်းက fail (မနေ့ကထက် မဆိုးရ)\n"
      - id: expect-rule
        type: expect.file
        at: { afterAction: type-rule }
        path: notebook/46-rollout.md
        contains: "နေ့တိုင်း: violation အသစ် ထည့်တဲ့ change က ပထမနေ့ကတည်းက fail (မနေ့ကထက် မဆိုးရ)\n"

  - id: your-turn
    chapter: ကိုယ့် system အတွက်
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ ကိုယ့် project ရဲ့ code က ဒီနေ့ ချိုးဖောက်နေတဲ့ စည်းကမ်း တစ်ခုကို ရွေးပါ။
      test မပါတဲ့ module တွေ၊ ရှည်လွန်းတဲ့ function တွေ၊ သုံးခွင့် မရှိတဲ့ library ကို သုံးထားတာတွေ ဘာပဲဖြစ်ဖြစ်
      ရပါတယ်။
      [[mark:turn-2]] lesson ကို pause လုပ်ပြီး၊ ဒီ table ရဲ့ ပထမ စာကြောင်းနေရာမှာ ကိုယ့် system ရဲ့ ဒီနေ့ ဂဏန်းကို
      ပထမဆုံး limit အဖြစ် ရေးကြည့်ပါ။ မရေတွက်ရသေးရင် အရင် ရေတွက်ပါ။ ဂဏန်း မသိဘဲနဲ့ တင်းကျပ်ဖို့ plan ဆွဲလို့
      မရပါဘူး။
    sources:
      - {
          title: "Building Evolutionary Architectures, 2nd edition (Ford, Parsons, Kua, Sadalage)",
          url: "https://oreil.ly/evolutionary-arch-2e",
        }
    actions:
      - id: sel-title
        type: editor.select
        at: { mark: turn }
        target: { file: notebook/46-rollout.md, text: "Module boundary check · rollout plan" }
      - id: sel-q1
        type: editor.select
        at: { mark: turn-2 }
        target:
          { file: notebook/46-rollout.md, text: "| Q1 (အခု) | 340 | ဒီနေ့ ဂဏန်းကို မှတ်ထား၊ ဘာမှ မပိတ်သေး |" }

  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ ချိုးဖောက်ပြီးသား စည်းကမ်း တစ်ခုကို အလိုအလျောက် စစ်တော့မယ်ဆိုရင်၊ တစ်ခါတည်း ပိတ်တာလည်း
      မဟုတ်၊ လွှတ်ထားတာလည်း မဟုတ်ပါဘူး။ ဒီနေ့ရဲ့ ဂဏန်းကို မှတ်ထားပြီး၊ မနေ့ကထက် မဆိုးစေဘဲ၊ limit ကို တစ်ဆင့်ချင်း
      လျှော့ချသွားတာပါ။ စစ်ဆေးချက်တွေကို ကြာချိန်အလိုက် နေရာချထားပြီး၊ မှန်တဲ့ လမ်းကို အလွယ်ဆုံး ဖြစ်အောင်
      လုပ်ပေးနိုင်ရင် governance က delivery ကို မတားတော့ပါဘူး။
      [[mark:next]] နောက် lesson မှာတော့ ဆုံးဖြတ်ချက် တစ်ခုကို ဘာကြောင့် ချခဲ့လဲ ဆိုတာ နှစ်တွေကြာလည်း မပျောက်အောင်
      ရေးမှတ်ထားတဲ့ architecture decision record ကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "Building Evolutionary Architectures, 2nd edition (Ford, Parsons, Kua, Sadalage)",
          url: "https://oreil.ly/evolutionary-arch-2e",
        }
    actions: []

checks:
  - { type: timing.p95Ms, max: 300 }
