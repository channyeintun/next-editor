# AI Builder, lesson 15: thinking about data (Burmese, docs kind).
#
# Start state (ws/): base-docs (package.json with a no-op dev script, notes.md, unused) and
# docs/data.md pinned with only its title line (COURSE-KIT §4.9: L15 creates it). Nothing runs.
#
# Typed into data.md (COURSE-KIT §4.9, section by section, line-by-line): Menu item · Order ·
# Order line (without its last field) · Status · Not stored; after the quiz, the Order line's last
# field (price_each) is typed onto its line, so the final file equals §4.9 exactly (tools/sim-docs.ts).
#
# Boards: (R) recall: one order's journey screen → server → database (orange), the counter reading through
# the server, and today's
# question; (E) the things in one real order, top to bottom: Order → Order line → Menu item, with
# fields on the right, links between, ids in orange and the customer decision; (S) one source of
# truth: the price written in three places (red) vs once in Menu item (green); (P) the status path
# new → ready → picked_up, cancelled below; (Z) the quiz.
#
# Build: bun ~/Documents/ai-builder-course-work/tools/build-lesson.ts template.yaml ws ai-builder-15-data-thinking.yaml
