schemaVersion: 1

lesson:
  slug: architect-56-your-path
  title: "Architect Path 56: Architect ခရီးလမ်း"
  locale: my-MM
  workspace:
    lessonType: javascript
    name: Architect Notebook
    entryFilePath: notebook/56-my-path.md
    sidebarStartsCollapsed: true
    files:
      README.md: |
        # ခရီးဖော် · system မှတ်စု

        ခရီးဖော်က အဝေးပြေးကား လက်မှတ်ကို app ကနေ ဝယ်လို့ရအောင် လုပ်ပေးတဲ့ ကုမ္ပဏီပါ။
        ဒီ course အတွက် စိတ်ကူးနဲ့ တည်ဆောက်ထားတဲ့ ကုမ္ပဏီ ဖြစ်ပါတယ်။

        ## သုံးတဲ့သူတွေ

        - ခရီးသည်: ခရီးစဉ် ရှာတယ်၊ ထိုင်ခုံ ရွေးတယ်၊ wallet နဲ့ ငွေချေတယ်၊ လက်မှတ် ရတယ်
        - ကားလိုင်း: ခရီးစဉ်နဲ့ ဈေးနှုန်း တင်တယ်၊ ရောင်းအား ကြည့်တယ်
        - ကောင်တာ ဝန်ထမ်း: ကားဂိတ်မှာ ထိုင်ခုံ အတူတူကိုပဲ ရောင်းတယ်
        - ပါဆယ် ပို့သူ: ကားနဲ့ ပါဆယ် ထည့်ပေးတယ် (လုပ်ငန်း အသစ်)

        ## အခု အခြေအနေ (ကုမ္ပဏီ သက်တမ်း 7 နှစ်)

        - developer 90 ယောက်၊ team 12 ခု၊ architect 4 ယောက်
        - ကားလိုင်း 500၊ တစ်ရက် လက်မှတ် 200,000 ခန့်
        - service အများကြီး၊ team တိုင်း သုံးတဲ့ platform တစ်ခုပေါ်မှာ
        - လုပ်ငန်း အသစ်: ကားတွေနဲ့ ပါဆယ် ပို့ပေးတာ
      notebook/56-my-path.md: |
        # ကိုယ့် ခရီးလမ်း · လာမယ့် 3 လ

        ကိုယ် အခု ရှိတဲ့ အဆင့်: စတင်သူ / လုပ်ကိုင်သူ / ဦးဆောင်သူ

        ## ရေးမယ့် artefact တစ်ခု
        ရာထူး မလိုဘဲ စလို့ရတာ: ADR တစ်ခု · characteristic တစ်ခုကို တိုင်း · risk session တစ်ခု · context view တစ်ပုံ

        ## စမယ့် အလေ့အထ တစ်ခု

        ## လုပ်မယ့် စကားဝိုင်း တစ်ခု

        ## အမြဲ ယူသွားဖို့ သုံးချက်
        - အကောင်းဆုံး မရှိဘူး၊ ဒီ အခြေအနေအတွက် trade-off ပဲ ရှိတယ်
        - ဘယ်လို ဆိုတာထက် ဘာကြောင့် ဆိုတာက ပိုအရေးကြီးတယ်
        - architect ရဲ့ ထွက်ကုန်က တခြားသူ နားလည်ပြီး လုပ်နိုင်တဲ့ ဆုံးဖြတ်ချက်

        ## ပိုနက်နက် လေ့လာဖို့ စာအုပ် 10 အုပ်
        1. Fundamentals of Software Architecture, 2nd ed. (Richards, Ford)
        2. Balancing Coupling in Software Design (Khononov)
        3. Learning Domain-Driven Design (Khononov)
        4. Designing Data-Intensive Applications, 2nd ed. (Kleppmann, Riccomini)
        5. Software Architecture: The Hard Parts (Ford, Richards, Sadalage, Dehghani)
        6. Release It!, 2nd ed. (Nygard)
        7. Building Evolutionary Architectures, 2nd ed. (Ford, Parsons, Kua, Sadalage)
        8. Facilitating Software Architecture (Harmel-Law)
        9. The Software Architect Elevator (Hohpe)
        10. The Pragmatic Programmer, 20th Anniversary ed. (Thomas, Hunt)
