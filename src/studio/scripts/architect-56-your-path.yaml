scenes:
  - id: path
    chapter: ခုနစ်နှစ် ခရီးလမ်း
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ အဖွဲ့အစည်း တစ်ခုကို system တစ်ခုလို ကြည့်ပြီး၊ လိုချင်တဲ့ architecture အတိုင်း team တွေကို
      ဖွဲ့ပုံကို လေ့လာခဲ့ပါတယ်။
      [[mark:p-open]] ဒီ lesson ကတော့ ဒီ course ရဲ့ နောက်ဆုံး lesson ပါ။ ခရီးဖော် မှာ ခုနစ်နှစ် ရှိပါပြီ။ developer
      ခြောက်ယောက်ထဲက senior developer တစ်ယောက်အနေနဲ့ စခဲ့တဲ့ ကိုယ်က၊ အခု developer ၉၀ ရှိတဲ့ ကုမ္ပဏီရဲ့ chief
      architect ပါ။ အဲဒီ ခရီးလမ်းကို ပြန်ကြည့်ရင် အဆင့် သုံးဆင့် ရှိပြီး၊ အဆင့် တစ်ခုစီက ကိုယ့်ဆီက မတူတဲ့ အရာကို
      တောင်းဆိုပါတယ်။
      [[mark:p-1]] ပထမ အဆင့်က စတင်သူ အဆင့်ပါ။ ဒီအဆင့်မှာ လိုတာက developer အမြင်ကနေ architect အမြင်ဆီ ကူးတာပါ။
      ဆုံးဖြတ်ချက်တိုင်းရဲ့ trade off၊ ဆိုလိုတာက တစ်ခု ရဖို့ နောက်တစ်ခုကို လျှော့ပေးရတာကို မြင်တတ်တာ၊ တစ်ခုတည်းကို နက်နက် သိတာအပြင် အများကြီးကို ကျယ်ကျယ် သိတာနဲ့၊
      code ရဲ့ ဖွဲ့စည်းပုံကို အကဲဖြတ်တတ်တာတွေပါ။
      [[mark:p-2]] ဒုတိယ အဆင့်က လက်တွေ့ လုပ်ကိုင်သူ အဆင့်ပါ။ ဒီအဆင့်က တောင်းဆိုတာက system တစ်ခုအတွက် တာဝန်ယူပြီး
      ဆုံးဖြတ်တာပါ။ system က ဘယ်လောက် ကောင်းရမလဲ၊ ဘယ်ပုံစံနဲ့ ဖွဲ့မလဲ၊ business နဲ့ ကိုက်အောင် ဘယ်လို ပိုင်းမလဲ၊
      data ကို ဘယ်လို ထားမလဲ ဆိုတာတွေပါ။
      [[mark:p-3]] တတိယ အဆင့်က ဦးဆောင်သူ အဆင့်ပါ။ ဒီအဆင့်မှာတော့ ကိုယ်တိုင် ဆုံးဖြတ်တာ နည်းလာပြီး၊ တခြားသူတွေ
      ကောင်းကောင်း ဆုံးဖြတ်နိုင်အောင် လုပ်ပေးရတာ များလာပါတယ်။ သဘောတူထားတာတွေ တကယ် လိုက်နာမနာ စောင့်ကြည့်တာ၊
      လူတွေနဲ့ ညှိတာ၊ အဖွဲ့အစည်းကို ပုံဖော်တာတွေပါ။ ကိုယ် အခု ရောက်နေတာက ဒီအဆင့်ပါ။
      [[mark:p-legs]] အဆင့် သုံးဆင့်လုံးမှာ အတူ ကြီးထွားရတဲ့ အရာ သုံးခု ရှိပါတယ်။ သိတာကို နေရာမှန်မှာ သုံးတတ်တဲ့
      skill၊ business အတွက် တကယ် အကျိုးရှိသွားတဲ့ impact နဲ့၊ တခြားသူတွေကို လက်တွဲခေါ်တဲ့ leadership ပါ။
      [[mark:p-stop]] တစ်ခုတည်းကိုပဲ ကြီးအောင် လုပ်ရင် ခရီးက အဲဒီမှာ ရပ်သွားတတ်ပါတယ်။ သိတာ များပေမဲ့ အကျိုး မထွက်ရင်
      စာတွေ့ပဲ ဖြစ်နေမှာပါ။ အကျိုးထွက်ပေမဲ့ တခြားသူကို မခေါ်ရင်လည်း၊ ကိုယ်တစ်ယောက်တည်း လုပ်နိုင်သလောက်မှာပဲ
      ရပ်နေမှာပါ။
      [[mark:p-where]] ကိုယ် အခု ဘယ်အဆင့်မှာလဲ ဆိုတာက ရာထူးနဲ့ မဆိုင်ပါဘူး။ ကိုယ် နေ့စဉ် ချနေတဲ့ ဆုံးဖြတ်ချက်တွေက
      ဘယ်လောက် ကျယ်လဲ ဆိုတာနဲ့ပဲ ဆိုင်ပါတယ်။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
      - {
          title: "The Software Architect Elevator (Hohpe)",
          url: "https://oreil.ly/Software_Architect_Elevator",
        }
    actions:
      - {
          id: draw-p-open,
          type: whiteboard.apply,
          at: { mark: p-open },
          open: true,
          upsertIds: [p-title],
        }
      - {
