  - id: recap
    chapter: သင်္ကြန် မနက်ကို ပြန်ကြည့်ခြင်း
    narration: >
      [[mark:s-open]] ဒါဆို ပြန်ချုပ်ရရင်၊ ဒီ course တစ်ခုလုံးကို ခရီးဖော် ရဲ့ ဇာတ်လမ်းနဲ့ ပြန်ကြည့်ရအောင်။
      [[mark:s-then]] ကုမ္ပဏီ သက်တမ်း နှစ်နှစ်မှာ သင်္ကြန် လက်မှတ် ဖွင့်ရောင်းတဲ့ မနက်ကို မှတ်မိမှာပါ။ ဝင်သုံးသူ ၁၅ ဆ
      တက်လာတော့ app က နှစ်နာရီ နှေးပြီး၊ ထိုင်ခုံ ၃၁၂ ခုံကို နှစ်ခါ ရောင်းမိခဲ့ပါတယ်။ မှားနေတဲ့ code တစ်ကြောင်းမှ
      မရှိခဲ့ပါဘူး။ အဲဒီလို နေ့မျိုးမှာ system က ဘယ်လို ပြုမူရမလဲ ဆိုတာကို ဘယ်သူမှ မဆုံးဖြတ်ခဲ့တာပါ။
      [[mark:s-1]] အဲဒီနေ့ကစပြီး ကိုယ်တို့ ပထမဆုံး သင်ခဲ့တာက ဆုံးဖြတ်ချက်တိုင်းမှာ trade off ပါတယ် ဆိုတာနဲ့၊ code ကို
      ပြောင်းရ လွယ်အောင် အပိုင်းတွေ ခွဲတာပါ။
      [[mark:s-2]] team သုံးခု ဖြစ်လာတော့ system က ဘယ်လောက် ကောင်းရမလဲ ဆိုတာကို ကိန်းဂဏန်းနဲ့ သဘောတူပြီး၊ business
      ရဲ့ ပုံစံအတိုင်း ပိုင်းခြားခဲ့ပါတယ်။
      [[mark:s-3]] team ခြောက်ခု ဖြစ်လာတော့ data ကို ဘယ်မှာ ထားမလဲ၊ service တွေကို ဘယ်လို ခွဲမလဲ၊ ပျက်တဲ့အခါ
      ဘယ်လို ခံမလဲ ဆိုတာတွေကို ဆုံးဖြတ်ခဲ့ပါတယ်။
      [[mark:s-4]] team ၁၂ ခု ဖြစ်လာတော့ ကိုယ်တစ်ယောက်တည်း ဆုံးဖြတ်လို့ မနိုင်တော့ဘဲ၊ တခြားသူတွေ ကောင်းကောင်း
      ဆုံးဖြတ်နိုင်အောင် လုပ်ပေးခဲ့ရပါတယ်။
      [[mark:s-now]] ဒီနှစ် သင်္ကြန် လက်မှတ် ဖွင့်ရောင်းတဲ့ မနက်မှာတော့ ဝင်သုံးသူက အဲဒီတုန်းကထက် အများကြီး
      ပိုများပါတယ်။ ဒါပေမဲ့ app က မနှေးပါဘူး။ ထိုင်ခုံ တစ်ခုံကိုမှ နှစ်ခါ မရောင်းမိပါဘူး။
      [[mark:s-me]] အဲဒီ မနက်မှာ ကိုယ် ဘာမှ ဝင်လုပ်စရာ မလိုခဲ့ပါဘူး။ team တွေက ကိုယ်တိုင် ကြည့်၊ ကိုယ်တိုင်
      ဆုံးဖြတ်သွားကြတာပါ။ architect တစ်ယောက်ရဲ့ အလုပ် အောင်မြင်နေတဲ့ လက္ခဏာ တစ်ခုက အဲဒါပါပဲ။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
      - {
          title: "The Software Architect Elevator (Hohpe)",
          url: "https://oreil.ly/Software_Architect_Elevator",
        }
    actions:
      - { id: close-books, type: slide.close, at: { mark: s-open, offsetMs: -1200 } }
      - {
          id: draw-s-open,
          type: whiteboard.apply,
          at: { afterAction: close-books },
          open: true,
          clear: true,
          upsertIds: [s-title],
        }
      - {
          id: draw-s-then,
          type: whiteboard.apply,
          at: { mark: s-then },
          upsertIds: [s-y2, s-t1, s-red1, s-red2],
          drawMs: 2400,
        }
      - {
          id: draw-s-1,
          type: whiteboard.apply,
          at: { mark: s-1 },
          upsertIds: [s-arrow],
          drawMs: 1200,
        }
      - {
          id: draw-s-2,
          type: whiteboard.apply,
          at: { mark: s-2 },
          upsertIds: [s-y3, s-t3],
          drawMs: 1200,
        }
      - {
          id: draw-s-3,
          type: whiteboard.apply,
          at: { mark: s-3 },
          upsertIds: [s-y5, s-t6],
          drawMs: 1200,
        }
      - {
          id: draw-s-4,
          type: whiteboard.apply,
          at: { mark: s-4 },
          upsertIds: [s-y7, s-t12],
          drawMs: 1200,
        }
      - {
          id: draw-s-now,
          type: whiteboard.apply,
          at: { mark: s-now },
          upsertIds: [s-g1, s-g2],
          drawMs: 1500,
        }
      - { id: point-s-12, type: whiteboard.point, at: { mark: s-me }, target: { assetId: s-t12 } }

  - id: your-turn
    chapter: ကိုယ့် ခရီးလမ်း
    narration: >
      [[mark:turn]] အခု နောက်ဆုံး အနေနဲ့ ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ဒီ မှတ်စုထဲမှာ ကိုယ် ရောက်နေတဲ့ အဆင့်ကို
      အရင် ရွေးပါ။ ပြီးရင် ကိုယ့် project အတွက် သုံးကြောင်းကို ဖြည့်ပါ။ လာမယ့် သုံးလအတွင်း ရေးမယ့် artefact တစ်ခု၊ စမယ့် အလေ့အထ
      တစ်ခု၊ လုပ်မယ့် စကားဝိုင်း တစ်ခုပါ။
      [[mark:threads]] ဖြည့်တဲ့အခါ lesson တိုင်းမှာ ပါခဲ့တဲ့ အချက် သုံးချက်ကို ယူသွားပါ။
      [[mark:th-1]] architecture မှာ အကောင်းဆုံးဆိုတာ မရှိပါဘူး။ ဒီ အခြေအနေအတွက် သင့်တော်တဲ့ trade off ပဲ ရှိပါတယ်။
      [[mark:th-2]] ဘယ်လို လုပ်မလဲ ဆိုတာထက်၊ ဘာကြောင့် လုပ်တာလဲ ဆိုတာက ပိုအရေးကြီးပါတယ်။
      [[mark:th-3]] architect ရဲ့ ထွက်ကုန်က ပုံတွေ မဟုတ်ဘဲ၊ တခြားသူတွေ နားလည်ပြီး လက်တွေ့ လုပ်နိုင်တဲ့
      ဆုံးဖြတ်ချက်တွေပါ။
      [[mark:bye]] ခရီးဖော် ရဲ့ ဇာတ်လမ်းက ဒီမှာ ပြီးပါပြီ။ ကိုယ့် ခရီးလမ်းကတော့ ကိုယ့် project ထဲမှာ ဆက်ရှိနေမှာပါ။
      ဒီ course ကို အဆုံးအထိ လိုက်ပါခဲ့တဲ့အတွက် ကျေးဇူးတင်ပါတယ် ခင်ဗျာ။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
      - {
          title: "The Software Architect Elevator (Hohpe)",
          url: "https://oreil.ly/Software_Architect_Elevator",
        }
    actions:
      - { id: close-story, type: whiteboard.apply, at: { mark: turn }, open: false }
      - id: sel-stage
        type: editor.select
        at: { mark: turn, offsetMs: 2200 }
        target: { file: notebook/56-my-path.md, text: "ကိုယ် အခု ရှိတဲ့ အဆင့်: စတင်သူ / လုပ်ကိုင်သူ / ဦးဆောင်သူ" }
      - id: sel-th-1
        type: editor.select
        at: { mark: th-1 }
        target:
          { file: notebook/56-my-path.md, text: "- အကောင်းဆုံး မရှိဘူး၊ ဒီ အခြေအနေအတွက် trade-off ပဲ ရှိတယ်" }
      - id: sel-th-2
        type: editor.select
        at: { mark: th-2 }
        target: { file: notebook/56-my-path.md, text: "- ဘယ်လို ဆိုတာထက် ဘာကြောင့် ဆိုတာက ပိုအရေးကြီးတယ်" }
      - id: sel-th-3
        type: editor.select
        at: { mark: th-3 }
        target:
          {
            file: notebook/56-my-path.md,
            text: "- architect ရဲ့ ထွက်ကုန်က တခြားသူ နားလည်ပြီး လုပ်နိုင်တဲ့ ဆုံးဖြတ်ချက်",
          }

