  - id: no-title
    chapter: ရာထူး မလိုဘဲ စလို့ရတယ်
    narration: >
      [[mark:d-close]] ဒါဆို ရှေ့ဆက်ဖို့ ဘာလုပ်ရမလဲ။ လာမယ့် သုံးလအတွက် အစီအစဉ် တိုတို တစ်ခု ရေးကြည့်ရအောင်။
      သုံးကြောင်းပဲ ပါပါတယ်။ ရေးမယ့် artefact တစ်ခု၊ စမယ့် အလေ့အထ တစ်ခုနဲ့ လုပ်မယ့် စကားဝိုင်း တစ်ခုပါ။
      [[mark:sel-options]] ပထမ စာကြောင်းအတွက် သိထားရမှာက architect အလုပ်ကို လေ့ကျင့်ဖို့ architect ဆိုတဲ့ ရာထူး
      မလိုဘူး ဆိုတာပါ။ ဒီ course ထဲမှာ ရေးခဲ့တဲ့ စာရွက်စာတမ်းတွေကို ဘယ် developer မဆို မနက်ဖြန်ကစပြီး ရေးလို့
      ရပါတယ်။
      [[mark:options-2]] ကိုယ့် team ချခဲ့တဲ့ ဆုံးဖြတ်ချက် တစ်ခုကို ဘာကြောင့်လဲ ဆိုတာနဲ့အတူ ရေးမှတ်တာ၊ system ရဲ့
      အရည်အသွေး တစ်ခုကို ကိန်းဂဏန်းနဲ့ တိုင်းကြည့်တာ၊ ဘာတွေ မှားနိုင်လဲ ဆိုတာကို team နဲ့အတူ ထိုင်စစ်တာ၊ ကိုယ့်
      system က ဘယ်သူတွေနဲ့ ဆက်နေလဲ ဆိုတဲ့ ပုံတစ်ပုံ ဆွဲတာတွေပါ။ ဒါတွေကို လုပ်နေတဲ့သူကို လူတွေက architect လို့
      အလိုလို မြင်လာတတ်ကြပါတယ်။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - { id: close-path, type: whiteboard.apply, at: { mark: d-close }, open: false }
      - {
          id: open-notebook,
          type: workspace.openFile,
          at: { afterAction: close-path },
          path: notebook/56-my-path.md,
        }
      - id: sel-options
        type: editor.select
        at: { mark: sel-options }
        target:
          {
            file: notebook/56-my-path.md,
            text: "ရာထူး မလိုဘဲ စလို့ရတာ: ADR တစ်ခု · characteristic တစ်ခုကို တိုင်း · risk session တစ်ခု · context view တစ်ပုံ",
          }

  - id: plan
    chapter: သုံးလအတွက် အစီအစဉ်
    narration: >
      [[mark:type-artefact]] ကိုယ့်ရဲ့ လာမယ့် သုံးလအတွက် artefact ကတော့ architecture decision record၊ အတိုကောက်
      ADR တစ်ခုပါ။ ADR ဆိုတာ ဘာကို ဘာကြောင့်
      ဆုံးဖြတ်ခဲ့လဲ ရေးမှတ်ထားတဲ့ စာတိုလေးပါ။ ခရီးသည်တွေရဲ့ data ထဲက ဘာတွေကို စုထားမလဲ၊ ဘယ်လောက် ကြာကြာ
      သိမ်းမလဲ ဆိုတဲ့ ဆုံးဖြတ်ချက်အတွက်ပါ။
      [[mark:data]] အဆင့် မြင့်လာလေ ကိုယ့် ဆုံးဖြတ်ချက်က လူ ပိုများများကို ထိလေပါ။ ခရီးဖော် မှာ ခရီးသည် သန်းနဲ့ချီရဲ့
      ဖုန်းနံပါတ်နဲ့ ခရီးသွား မှတ်တမ်းတွေ ရှိနေပါပြီ။ စုထားတဲ့ ကိုယ်ရေး အချက်အလက်ဆိုတာ ပိုင်ဆိုင်မှု တစ်ခုတည်း
      မဟုတ်ဘဲ၊ ပေါက်ကြားသွားရင် ကိုယ်တို့ ခံရမယ့် တာဝန် တစ်ခုလည်း ဖြစ်ပါတယ်။ မလိုတာကို မစုဘဲ၊ မလိုတော့တာကို
      ဖျက်ပစ်တာက system က ဝန်ဆောင်မှုပေးနေတဲ့ လူတွေကို ကာကွယ်တာပါ။ ဒါကို စဉ်းစားပေးရမယ့်သူတွေထဲမှာ architect လည်း ပါပါတယ်။
      [[mark:type-habit]] ဒုတိယ စာကြောင်းက အလေ့အထပါ။ ခုနစ်နှစ်အတွင်း ကိုယ် သိခဲ့တာတွေထဲက အများကြီးက ဟောင်းသွားပါပြီ။
      ကိုယ် ကျွမ်းကျင်ခဲ့တဲ့ web framework ကို အခု team တွေ မသုံးတော့ပါဘူး။ technology အကြောင်း သိထားတာတွေက
      အချိန်တန်ရင် ဟောင်းတာမို့၊ တစ်ခါ သင်ပြီး ပြီးသွားတာ မဟုတ်ဘဲ နေ့စဉ် နည်းနည်းစီ ဖြည့်နေရပါတယ်။ ကိုယ်ကတော့
      မနက်တိုင်း မိနစ် ၂၀ ဖတ်တဲ့ အလေ့အထကို ဆက်ထားပြီး၊ သုံးလတစ်ခါ ကိုယ်ပိုင် radar ကို ပြန်စစ်ပါမယ်။
      [[mark:type-talk]] တတိယ စာကြောင်းက စကားဝိုင်းပါ။ architecture ကို တစ်ယောက်တည်း စဉ်းစားပြီး မရပါဘူး။
      ကိုယ့်အတွက်ကတော့ မကြာသေးခင်က ရောက်လာတဲ့ architect အသစ်နဲ့ အပတ်စဉ် တစ်နာရီ ထိုင်ပြီး၊ သူရေးတဲ့ ADR ကို
      အတူ ဖတ်ဖို့ပါ။ ကိုယ် မရှိတော့တဲ့နေ့မှာ ကိုယ့်နေရာကို ယူနိုင်မယ့်သူကို ပြုစုပေးတာက ဦးဆောင်သူ အဆင့်ရဲ့
      အရေးကြီးတဲ့ အလုပ်တွေထဲက တစ်ခုပါ။
      [[mark:talk-2]] စတင်သူ အဆင့်မှာဆိုရင်တော့ ဒီ စာကြောင်းက ကိုယ့်ထက် အတွေ့အကြုံ ရှိတဲ့သူ တစ်ယောက်ကို မေးခွန်း
      တစ်ခု သွားမေးဖို့ ဖြစ်နိုင်ပါတယ်။
    sources:
      - {
          title: "Designing Data-Intensive Applications, 2nd edition (Kleppmann, Riccomini)",
          url: "https://oreil.ly/DesigningDataIntensiveApps2",
        }
      - {
          title: "The Pragmatic Programmer, 20th Anniversary Edition (Thomas, Hunt)",
          url: "https://pragprog.com/titles/tpp20",
        }
      - {
          title: "The Software Architect Elevator (Hohpe)",
          url: "https://oreil.ly/Software_Architect_Elevator",
        }
    actions:
      - id: type-artefact
        type: editor.type
        at: { mark: type-artefact }
        cadence: line-by-line
        target: { file: notebook/56-my-path.md, after: "context view တစ်ပုံ\n" }
        text: "- ခရီးသည် data ဘာတွေ စုမလဲ၊ ဘယ်လောက်ကြာ သိမ်းမလဲ ဆိုတဲ့ ADR တစ်ခု\n"
      - id: type-habit
        type: editor.type
        at: { mark: type-habit }
        cadence: line-by-line
        target: { file: notebook/56-my-path.md, after: "## စမယ့် အလေ့အထ တစ်ခု\n" }
        text: "- မနက်တိုင်း 20 မိနစ် ဖတ်မယ်၊ 3 လတစ်ခါ ကိုယ်ပိုင် radar ကို ပြန်စစ်မယ်\n"
      - id: type-talk
        type: editor.type
        at: { mark: type-talk }
        cadence: line-by-line
        target: { file: notebook/56-my-path.md, after: "## လုပ်မယ့် စကားဝိုင်း တစ်ခု\n" }
        text: "- architect အသစ်နဲ့ အပတ်စဉ် 1 နာရီ ထိုင်ပြီး သူ့ ADR ကို အတူ ဖတ်မယ်\n"
      - id: expect-plan
        type: expect.file
        at: { afterAction: type-talk }
        path: notebook/56-my-path.md
        contains: "- ခရီးသည် data ဘာတွေ စုမလဲ၊ ဘယ်လောက်ကြာ သိမ်းမလဲ ဆိုတဲ့ ADR တစ်ခု\n"

  - id: books
    chapter: စာအုပ် ဆယ်အုပ်
    narration: >
      [[mark:b-open]] ဒီ course က architecture လောကမှာ လူသိများတဲ့ စာအုပ် ဆယ်အုပ်ထဲက အတွေးအခေါ်တွေကို အခြေခံထားတယ်လို့
      ပထမ lesson မှာ ပြောခဲ့ပါတယ်။ ပိုနက်နက် လေ့လာချင်တဲ့အခါ ဘယ်စာအုပ်ကို ဘယ်အချိန်မှာ ဖတ်သင့်လဲ ကြည့်ရအောင်။
      အဆင့် သုံးဆင့်အလိုက် စီထားပါတယ်။
      [[mark:b-1]] ပထမ စာအုပ်က architect အလုပ် တစ်ခုလုံးကို ခြုံပြီး ပြပေးတာမို့ အရင်ဆုံး ဖတ်ဖို့ သင့်တော်ပါတယ်။
      [[mark:b-2]] ဒုတိယက code အပိုင်းတွေ တစ်ခုနဲ့တစ်ခု ဘယ်လောက် ချည်နှောင်နေလဲ ဆိုတာကို တိုင်းပြီး
      ချိန်ညှိချင်တဲ့အခါအတွက်ပါ။
      [[mark:b-3]] တတိယက system ကို business ရဲ့ ပုံစံနဲ့ ကိုက်အောင် ပိုင်းခြားချင်တဲ့အခါ ဖတ်ရမှာပါ။
      [[mark:b-4]] စတုတ္ထက data ကို ဘယ်လို သိမ်းမလဲ၊ ဘယ်လို မိတ္တူပွားမလဲ ဆိုတဲ့ ဆုံးဖြတ်ချက်တွေအတွက်ပါ။
      [[mark:b-5]] ငါးအုပ်မြောက်ကတော့ system ကို service တွေအဖြစ် ခွဲတော့မယ့် အချိန်မှာ ဖတ်ဖို့ပါ။
      [[mark:b-6]] ခြောက်အုပ်မြောက်က production မှာ အပိုင်း တစ်ခု ပျက်တာနဲ့ အားလုံး မပြိုအောင် ဘယ်လို ဆောက်မလဲ ဆိုတာပါ။
      [[mark:b-7]] ခုနစ်အုပ်မြောက်က architecture ကို အချိန်နဲ့အမျှ ပြောင်းရင်း၊ အရေးကြီးတာတွေ မပျက်အောင် ထိန်းပုံပါ။
      [[mark:b-8]] ရှစ်အုပ်မြောက်က ဆုံးဖြတ်ခွင့်ကို team တွေဆီ ဘယ်လို စိတ်ချလက်ချ ဖြန့်ပေးမလဲ ဆိုတာပါ။
      [[mark:b-9]] ကိုးအုပ်မြောက်က ကုမ္ပဏီရဲ့ ထိပ်ပိုင်းနဲ့ စက်ခန်းကို ဆက်ပေးတဲ့ architect အကြောင်းပါ။
      [[mark:b-10]] နောက်ဆုံး တစ်အုပ်ကတော့ architect ဖြစ်ဖြစ်၊ developer ဖြစ်ဖြစ် နေ့စဉ် လိုတဲ့ အလေ့အထနဲ့
      စဉ်းစားပုံတွေအတွက်ပါ။
      [[mark:b-end]] စာအုပ်တွေရဲ့ နာမည် အပြည့်အစုံကို မှတ်စုရဲ့ အောက်ဆုံးမှာ ထည့်ထားပါတယ်။ ဆယ်အုပ်လုံးကို တစ်ခါတည်း
      ဖတ်ဖို့ မလိုပါဘူး။ ကိုယ် အခု ကြုံနေတဲ့ ပြဿနာနဲ့ ဆိုင်တဲ့ တစ်အုပ်ကနေ စပါ။ ဖတ်တဲ့အခါလည်း ရေးထားတာက ဘယ်လို အခြေအနေအတွက်
      မှန်တာလဲ၊ ကိုယ့် အခြေအနေနဲ့ တူရဲ့လား ဆိုတာကို အမြဲ မေးပါ။
    sources:
