# CSS course (Burmese), lesson 41 of 43: popover and dialog.
#
# Narration is the final Burmese (voice-script.md next to this file mirrors it
# span by span; DESIGN.md is the design brief). Every [[mark:…]] sits where its
# action begins, at a sentence end or right after a ၊ pause; each span carries
# one piece of meaning. Everything the learner sees (title, chapters,
# whiteboard labels, UI strings) is Burmese.
#
# Shape: board (recall lesson 40; z-index wars, the top layer above every
# stacking context, the backdrop) → code tour (sugar button + popovertarget,
# the sugar and milk popovers, the manual toast, the confirm dialog; nothing
# shows) → click: the sugar popover opens centred with the UA border (UA
# fixed + inset 0 + margin auto), a second click closes it → board (auto /
# manual / hint, light dismiss drawn not shown, hint support, never modal) →
# sugar then milk: the auto popovers close each other, the click reached the
# page → [popover] { display: grid } shows all three closed popovers, inserting
# :popover-open hides them again; open → a column → position-area: bottom
# span-right drops it under its button (implicit anchor; auto margins → 0),
# margin: unset (anchor() insets keep auto margins) → #sugar::backdrop → board (three
# states, display flips with allow-discrete) → closed/open rules: opens with no
# fade, closes with a fade → @starting-style: fades in → overlay / Firefox →
# the manual toast stays while sugar opens and closes; popovertargetaction=hide
# closes it; the JS methods → board (popover stack, closing rules; dialog
# popover) → dialog element, open attribute, kit.js showModal(); click: modal
# with the faint UA backdrop → dialog::backdrop 40% and dialog:modal radius
# typed while it is open → confirm: form method=dialog closes it (returnValue)
# → command/commandfor, closedby, toggle events → board (popover or modal
# dialog) → quiz + recap, hand-off to view transitions (lesson 42).
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set(; no postcss config; no HTML or JS
# edit, so the page never reloads and popover/dialog state survives every CSS
# edit. The two keystroke edits with rgb( are each the LAST rule of the file
# while typed (an unclosed "(" would swallow later rules); the multi-line
# transition list and the @starting-style block are line-by-line at the end of
# the file (an unclosed "{" or a trailing comma only affects that last rule,
# and the popover is closed while they appear).
#
# Open/closed state is asserted through the hidden status lines kit.js fills
# on every toggle event (data-report), because a popover has no open attribute
# and a closed dialog has none to compare (COURSE-KIT.md §4.2).
#
# Measured in headless Chrome 155 at 432 × 720 (probe/stages.ts, same anchors):
# sugar button 32,171 140 × 43; sugar popover centred 138,336 156 × 49 (row of
# three); [popover] { display: grid } → sugar 179,293, milk 169,293, toast
# 143,317 piled in the middle; open as a grid 179,293 74 × 134; with
# position-area 32,214 (left edge = the button's, top = its bottom; margin:
# unset changes nothing in Chrome 155); exit transition 150 ms in: opacity
# 0.42, y 209; with @starting-style 150 ms in: opacity 0.65; toast 143,317;
# dialog 112,293 207 × 134 (:modal), returnValue "ok" after confirm.
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
