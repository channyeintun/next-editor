      # base.css: kit sections A, B, B2 and C (section D dropped). Section E:
      # the cream order panel, the two pill buttons in a wrapping row, the
      # action row, and padding + font: inherit on the buttons inside the
      # popovers and the dialog. Nothing styles a popover, the dialog or a
      # backdrop: the lesson types all of it.
      base.css: |
        /*
          base.css: pinned, never typed during a lesson.
          The shop's palette and the page "furniture", so the CSS a lesson types can
          focus on one idea. Each lesson keeps only the sections it needs and drops
          any declaration that its own demo types or relies on being absent
          (COURSE-KIT.md, "Deriving a lesson workspace"). B2 travels with B (every
          lesson that keeps B keeps B2, except lesson 2, which types the reset).
          Section E holds the few lesson-specific rules a start state pins.
          Lesson 41 keeps A, B, B2 and C; section D dropped; section E pins the order
          panel, its two pill buttons and font: inherit on the buttons inside the
          popovers and the dialog. Nothing styles a popover, a dialog or a backdrop.
          Keep it free of the url, image-set and @-import functions (they switch on
          Vite's postcss step); images come from <img> or the pinned images.css.
        */

        /* == A. palette == */
        :root {
          color-scheme: light;
          --tea-dark: #3b2314;
          --tea: #8b5a2b;
          --tea-light: #c9a27e;
          --cream: #fff8ec;
          --paper: #fdf3e1;
          --leaf: #2f6b3a;
          --gold: #c9a227;
          --chili: #b23a2b;
          --ink: #2b1d14;
          --muted: #6b5a4c;
          --line: #e6d5bf;
          --radius: 12px;
        }

        /* == B. page == */
        body {
          margin: 0;
          font-family: "Noto Sans Myanmar", "Myanmar Sangam MN", "Myanmar MN", "Myanmar Text", "Padauk",
            system-ui, sans-serif;
          font-size: 16px;
          line-height: 1.8;
          color: var(--ink);
          background: var(--paper);
        }

        .page {
          padding: 0 16px 24px;
        }

        h1,
        h2,
        h3 {
          margin: 0 0 8px;
          line-height: 1.5;
        }

        h1 {
          font-size: 24px;
        }

        h2 {
          font-size: 20px;
        }

        h3 {
          font-size: 17px;
        }

        a {
          color: var(--tea);
        }

        /* Status lines that only expect.preview reads (kit.js data-report, data-say). */
        .visually-hidden {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip-path: inset(50%);
          white-space: nowrap;
        }

        /* == B2. reset (lesson 2 teaches it; every later lesson keeps it) == */
        *,
        *::before,
        *::after {
          box-sizing: border-box;
        }

        /* == C. furniture == */
        .site-header {
          padding: 16px;
          background: var(--tea-dark);
          color: var(--cream);
        }

        .site-header a {
          color: var(--cream);
        }

        .logo {
          display: block;
        }

        .tagline {
          margin: 0;
          color: var(--tea-light);
          font-size: 14px;
        }

        .nav ul {
          margin: 8px 0 0;
          padding: 0;
          list-style: none;
        }

        .hero {
          margin: 16px 0;
          padding: 16px;
          background: var(--cream);
          border-radius: var(--radius);
        }

        .menu {
          margin: 0;
          padding: 0;
          list-style: none;
        }

        .menu-card {
          margin: 0 0 12px;
          padding: 12px 16px;
          background: #fff;
          border: 1px solid var(--line);
          border-radius: var(--radius);
        }

        .menu-card .name,
        .menu-card .desc {
          margin: 0;
        }

        .menu-card .desc {
          color: var(--muted);
          font-size: 14px;
        }

        .price {
          font-weight: 700;
          color: var(--tea);
        }

        .badge {
          padding: 0 8px;
          border-radius: 999px;
          background: var(--leaf);
          color: #fff;
          font-size: 13px;
        }

        .sold-out {
          opacity: 0.6;
        }

        .order-link,
        .order-btn {
          display: inline-block;
          padding: 6px 16px;
          border: 0;
          border-radius: 999px;
          background: var(--tea);
          color: #fff;
          font: inherit;
          text-decoration: none;
        }

        .order-form label {
          display: block;
          margin-top: 8px;
        }

        .order-form input[type="text"],
        .order-form input[type="tel"],
        .order-form input[type="number"] {
          box-sizing: border-box;
          width: 100%;
          padding: 6px 10px;
          border: 1px solid var(--line);
          border-radius: 8px;
          background: #fff;
          font: inherit;
        }

        .order-btn {
          margin-top: 12px;
        }

        .gallery figure {
          margin: 0 0 12px;
        }

        .gallery img {
          display: block;
          max-width: 100%;
          height: auto;
          border-radius: var(--radius);
        }

        figcaption {
          color: var(--muted);
          font-size: 14px;
        }

        .hours-list {
          margin: 0;
          padding-left: 20px;
        }

        .site-footer {
          margin-top: 24px;
          padding: 16px;
          background: var(--tea-dark);
          color: var(--cream);
          font-size: 14px;
        }

        .site-footer a {
          color: var(--cream);
        }

        /* == E. lesson rules == */
        /* Lesson 41: the order panel with its two pill buttons that open the sugar and
           milk popovers, and a row for the order and confirm buttons. The popovers,
           the toast and the dialog keep the browser's own styles; the lesson types
           everything else about them. */
        .order-panel {
          margin: 16px 0;
          padding: 16px;
          background: var(--cream);
          border-radius: var(--radius);
        }

        .picks,
        .actions {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
        }

        .pick {
          padding: 6px 16px;
          border: 1px solid var(--tea);
          border-radius: 999px;
          background: #fff;
          color: var(--tea);
          font: inherit;
        }

        [popover] button,
        dialog button {
          padding: 2px 12px;
          font: inherit;
        }
      # kit.js: pinned verbatim from the course kit, never typed. Its
      # data-show-modal helper calls showModal(); its toggle listener writes
      # open / closed into the status line a data-report attribute names.
      kit.js: |
        // kit.js: pinned helper for lessons that need a click to change the DOM.
        // Never typed during a lesson. Every helper is a data attribute on the clicked
        // element; data-target (a CSS selector) names the element that changes, and
        // defaults to the clicked element itself.
        //
        //   data-toggle-class="is-open"      toggles a class on the target
        //   data-toggle-attr="hidden"        toggles a boolean attribute on the target
        //   data-show-modal="#confirm"       opens that <dialog> with showModal()
        //   data-set-property="--brand"      sets a custom property on <html>
        //     data-value="#2f6b3a"           ...to this value
        //   data-say="text"                  writes the text into the target
        //
        // On a popover, <details> or <dialog>:
        //   data-report="#status"            writes "open" / "closed" into #status on
        //                                    every toggle (a DOM fact expect.preview
        //                                    can assert; popovers have no open attribute,
        //                                    and a closed dialog has none to compare)
        // On a checkbox or radio:
        //   data-report="#status"            writes "checked" / "unchecked" into #status
        //                                    on every change (a clicked checkbox never
        //                                    gets a checked attribute and its value
        //                                    stays "on", so expect.preview needs this)
        //
        // It never throws: a missing target or dialog is ignored.

        const HELPERS = "[data-toggle-class],[data-toggle-attr],[data-show-modal],[data-set-property],[data-say]";

        document.addEventListener("click", (event) => {
          const source = event.target instanceof Element ? event.target.closest(HELPERS) : null;
          if (!source) return;
          const { toggleClass, toggleAttr, showModal, setProperty, value, say, target } = source.dataset;
          const element = target ? document.querySelector(target) : source;
          if (!element) return;
          if (toggleClass) element.classList.toggle(toggleClass);
          if (toggleAttr) element.toggleAttribute(toggleAttr);
          if (setProperty) document.documentElement.style.setProperty(setProperty, value ?? "");
          if (say !== undefined) element.textContent = say;
          if (showModal) {
            const dialog = document.querySelector(showModal);
            if (dialog instanceof HTMLDialogElement && !dialog.open) dialog.showModal();
          }
        });

        // toggle does not bubble, so listen in the capture phase.
        document.addEventListener(
          "toggle",
          (event) => {
            const source = event.target instanceof HTMLElement ? event.target : null;
            const report = source?.dataset.report ? document.querySelector(source.dataset.report) : null;
            if (report) report.textContent = event.newState ?? (source.hasAttribute("open") ? "open" : "closed");
          },
          true,
        );

        // change bubbles; only checkboxes and radios report.
        document.addEventListener("change", (event) => {
          const input = event.target instanceof HTMLInputElement ? event.target : null;
          if (!input || (input.type !== "checkbox" && input.type !== "radio")) return;
          const report = input.dataset.report ? document.querySelector(input.dataset.report) : null;
          if (report) report.textContent = input.checked ? "checked" : "unchecked";
        });
      styles.css: ""

