    sidebarStartsCollapsed: true
    files:
      notes.md: |
        # ရေရှည် လုပ်နိုင်တဲ့ on-call

        - incident — user ဒါမှမဟုတ် business ထိခိုက်လို့ စနစ်တကျ တုံ့ပြန်ရမယ့် ပြဿနာ၊ ဘယ်သူမဆို ကြေညာ
        - outage — service ဒါမှမဟုတ် အရေးကြီး feature လုံးဝ သုံးမရ
        - rotation — on-call ကို အလှည့်ကျ ယူ၊ page တိုင်းမှာ နာမည်ပါ တစ်ယောက်
        - response time — page ဝင်ပြီး ဘယ်လောက် မြန်မြန် စတုံ့ပြန်ရမလဲ
        - incident commander — ရာထူး မရွေး ဦးဆောင်၊ ကိုယ်တိုင် မပြင်ဘဲ စီစဉ်

        မေးခွန်း: service တစ်ခုက on-call ကျသူကို တစ်ညကို page 6 ခါ ပို့နေတယ်။ ဘာကို အရင် ပြောင်းမလဲ?
