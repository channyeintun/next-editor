# SRE from zero, lesson 9: On-call people can sustain (Burmese concept lesson).
#
# Built from the approved voice script
# docs/sre-course/voice-scripts/sre-09-sustainable-on-call.md. Every spoken
# character is that script's "> " lines, unchanged; each ⟪…⟫ marker became a
# [[mark:…]] at the same place. Check it with:
#   bun ~/Documents/sre-course/work/check-narration.ts \
#     docs/sre-course/voice-scripts/sre-09-sustainable-on-call.md \
#     src/studio/scripts/sre-09-sustainable-on-call.yaml
#
# Nothing runs: deck pages and the whiteboard carry the lesson, and notes.md is
# the recap. The workspace and runtime follow the validated no-code skeleton
# (WebContainer, empty init command, a harmless dev script).
#
# Two marks were added at existing sentence ends; they add no spoken text and
# no action uses them. p02-rotation splits the l09_p02 page's 528-character
# narration in two, and b3-s4-coordinator splits B3 step 4's 452 characters,
# so no dialog passes the 450-character limit. The recap's ⟪select မေးခွန်း⟫
# became ask-question, the question's own dialog, and the question-line select
# hangs off it so the ⟪pause 3s⟫ is real silence, as in Module 1. No page or
# board step holds longer than ~38 s at 70 ms/char, so no pacing pages were
# needed.
#
# Boards (B1 nested ellipses, B2 P5 bars on a 24-hour axis, B3 P2 comb
# downward). Colour jobs: #1e1e1e ink (paints white) for the axis, arrows,
# the bus, the role boxes and the example label; orange the caveat (the
# incident set, the never-paged service and the response-time notes, as the
# voice script asks); red the outage; blue the thing named and the data bars;
# green Wallet's full-day bar and the agreed rule; violet the result (the IC
# rule and the coordinator). A label on two lines is two text assets, one per
# line, so each line meets the 0.55 em width rule on its own; labels whose
# Virgil Latin or fallback Myanmar measured wider than that rule in Chrome
# ("outage →", "bug →", "ဘယ်သူမဆို ကြေညာ", "Eats: 7–23", the axis digits and
# the right-hand B2 note's first line) get their measured width plus a margin.
#
# Deck pages: deck "Next Editor · SRE 3 · Respond and learn", published at the
# /pub URL below. Until this lesson's pages (l09_p01 … l09_p05, m3_map) are
# built in that deck, the Director fetches it and reports l09_p01 as missing;
# that error is expected until then. Page plan:
# ~/Documents/sre-course/work/pages/sre-09-sustainable-on-call.json
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/sre-09-sustainable-on-call.yaml
#   bun scripts/studio-compile-check.ts src/studio/scripts/sre-09-sustainable-on-call.yaml
