scenes:
  - id: hook
    chapter: "မနက် 2 နာရီ ဘယ်သူ ဖြေမလဲ"
    narration: >
      [[mark:show-p01]] Padauk ရဲ့ alert တွေကို အခု ယုံလို့ရပါပြီ၊ user အဆင့် check တွေနဲ့ အထောက်အထား ခိုင်လုံမှ တက်တဲ့ alert တွေ ရှိလာလို့ပါ။ ဒါပေမဲ့ တစ်ည မနက် ၂ နာရီမှာ Wallet ရဲ့ alert တက်လာတော့ လူ ၆၀ ရှိတဲ့ Viber group ထဲ ရောက်သွားပြီး အဲဒီ group ကို လူတိုင်းက အသံပိတ်ထားကြပါတယ်။
      ဘယ်သူမှ မဖြေလို့ Bank X ဆီ ငွေလွှဲတာတွေ မနက်အထိ fail နေခဲ့ပါတယ်။ မနက်ကျတော့ support lead မစုက လုပ်နေကျအတိုင်း CTO ကိုနေလင်းကိုပဲ ဖုန်းဆက်ပါတယ်။ ဒါဆို မနက် ၂ နာရီမှာ ဘယ်သူ ဖြေမလဲ?
      [[mark:show-m3-map]] Module ၃ မှာ reliability loop ရဲ့ တုံ့ပြန်တဲ့ အဆင့်နဲ့ သင်ယူတဲ့ အဆင့်ကို ဖြတ်သွားပါမယ်။ Padauk မှာ engineer ၄၀ လောက် ရှိပေမဲ့ reliability ကို အချိန်ပြည့် ကြည့်တာ မသီရိ တစ်ယောက်တည်းမို့ product အဖွဲ့တိုင်းက ကိုယ့် service ရဲ့ on-call ကို ကိုယ် ယူရပါမယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - { title: "Workbook: On-Call", url: "https://sre.google/workbook/on-call/" }
    actions:
      # -1750 / -1450, not the skeleton's -1900 / -1600: a pull-back over 1780 ms pushes the
      # first dialog past the 2 s opening handle, which src/studio/plans/index.test.ts rejects.
      - { id: collapse-dock, type: runtime.collapseDock, at: { scene: start, offsetMs: -1750 } }
      - {
          id: show-p01,
          type: slide.show,
          at: { mark: show-p01, offsetMs: -1450 },
          slideId: l09-p01,
        }
      # Module 3's first lesson: the module map, about 14-24 s at 55-95 ms/char.
      - { id: show-m3-map, type: slide.show, at: { mark: show-m3-map }, slideId: m3-map }

  - id: bug-incident-outage
    chapter: "Bug၊ incident၊ outage"
    narration: >
      [[mark:close-m3-map]] [[mark:b1-s1]] မသီရိက Viber group ကို ပြန်ဖတ်ကြည့်တော့ ပြဿနာ သုံးမျိုး ရောနေတာ တွေ့ရပါတယ်။ user ဒါမှမဟုတ် business ကို ထိခိုက်နေလို့ စနစ်တကျ ညှိပြီး တုံ့ပြန်ရမယ့် ပြဿနာက incident ပါ။ အဲဒီထဲက Wallet ငွေလွှဲ လုံးဝ မရတာလို service ဒါမှမဟုတ် အရေးကြီး feature တစ်ခု သုံးမရတာကတော့ outage မို့ တာဝန်ရှိသူတွေ ချက်ချင်း ဝင်ရပါတယ်။
      [[mark:b1-s2]] software က ရည်ရွယ်ထားတဲ့အတိုင်း အလုပ် မလုပ်တာကတော့ bug ပါ။ promo banner ပေါ်က စာ ပြတ်နေတာလို bug အများစုက ticket ဖွင့်ပြီး အလုပ်ချိန်ထဲ ပြင်ရုံပါပဲ၊ ငွေလွှဲ fail စေတဲ့ bug လို တချို့ကမှ incident ဖြစ်လာတာပါ။
      [[mark:b1-s3]] incident တိုင်းကလည်း bug ကနေ လာတာ မဟုတ်ပါဘူး။ Operator B ရဲ့ system နှေးနေရင် Padauk ရဲ့ code မှာ အမှား မရှိပေမဲ့ top-up တွေ fail နေလို့ incident ပါပဲ။
      [[mark:b1-s4]] ပြဿနာ စတက်ချိန်မှာ ဘယ်အမျိုးအစားလဲ ခွဲရ ခက်လို့ Padauk က ဘာဆိုရင် incident လဲ ဆိုတဲ့ စံနှုန်းကို ကြိုရေးထားပြီး ဘယ်သူမဆို incident ကြေညာလို့ရပါတယ်။ Viber bot ကို command တစ်ကြောင်း ပို့ရုံနဲ့ incident ဖွင့်လို့ရပြီး ပြင်းထန်မှု အဆင့်၊ severity ကိုလည်း default နဲ့ စပေးလို့ လိုရင် နောက်မှ ပြင်ရုံပါပဲ။
      [[mark:close-b1]] [[mark:show-p01b]] တစ်ညနေမှာ balance မှားနေတယ် ဆိုတဲ့ message တွေ ဝင်လာတော့ မစုက ကိုယ်တိုင် incident ကြေညာပါတယ်။ မိနစ် ၂၀ အတွင်း app က balance အဟောင်းကို ခဏ ပြနေတာပဲ ဆိုတာ သိရလို့ bug ticket အဖြစ် အဆင့်လျှော့ပါတယ်။ ကိုနေလင်းက မစုကို အားလုံး ရှေ့မှာ ကျေးဇူးတင်ပါတယ်၊ အဆင့်လျှော့တာက ဘာမှ မကုန်ပေမဲ့ မကြေညာဘဲ နေတာကတော့ Bank X ညလို အများကြီး ကုန်လို့ပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Google SRE Incident Management Guide (sre.google)",
          url: "https://sre.google/resources/practices-and-processes/incident-management-guide/",
        }
      - {
