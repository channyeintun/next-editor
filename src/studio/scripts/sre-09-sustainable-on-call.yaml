  - id: when-its-big
    chapter: "Incident ကြီးတဲ့အခါ"
    narration: >
      [[mark:close-b3]] [[mark:show-p04]] ဒီ rotation မှာ ဘယ်သူတွေ ပါလဲ? Padauk မှာ reliability အဖွဲ့ သီးသန့် မရှိသေးလို့ ဆန္ဒရှိတဲ့ senior engineer ငါးယောက်က ကိုယ့် product အလုပ်ကို ဆက်လုပ်ရင်း incident ကြီးမှပဲ page ခံမယ့် swarm တစ်ခု ဖွဲ့ကြပါတယ်။ incident ကြီးရင်လည်း CTO မဟုတ်ဘဲ incident commander က ဦးဆောင်မယ်လို့ ကြိုသဘောတူထားပြီး business အကြောင်းကို ကြိုမျှထားပါတယ်။
      [[mark:show-p04b]] လူစုံ သဘောတူမှ ဆုံးဖြတ်တာရော CTO ကို စောင့်တာရော ပိုနှေးပါတယ်။ ခေါင်းဆောင်တွေက engineer တွေ business ကို မသိမှာ မစိုးရိမ်ရအောင် swarm က အကြီးဆုံး merchant တွေ၊ ချိတ်ထားတဲ့ bank တွေ၊ ဒီအပတ် run နေတဲ့ promo တွေကို စာမျက်နှာ တစ်ခုထဲမှာ ကြိုရေးထားပါတယ်။
      swarm ကို စောစော ခေါ်ရပေမဲ့ ခက်တဲ့ incident တိုင်း လွှဲပေးနေရင် product အဖွဲ့တွေ ကိုယ့် system ကို ကိုယ် မပြင်တတ်တော့ပါဘူး။ swarm အလုပ်ကိုလည်း ရာထူးတိုးတဲ့အခါ ထည့်တွက်ပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Google SRE Incident Management Guide (sre.google)",
          url: "https://sre.google/resources/practices-and-processes/incident-management-guide/",
        }
      - {
          title: "Workbook: Incident Response",
          url: "https://sre.google/workbook/incident-response/",
        }
    actions:
      - {
          id: close-b3,
          type: whiteboard.apply,
          at: { mark: close-b3, offsetMs: -400 },
          open: false,
        }
      - { id: show-p04, type: slide.show, at: { mark: show-p04 }, slideId: l09-p04 }
      - { id: show-p04b, type: slide.show, at: { mark: show-p04b }, slideId: l09-p04b }

  - id: this-week
    narration: >
      [[mark:show-p05]] မနက် ၂ နာရီ မေးခွန်းကို ကိုယ့်အဖွဲ့မှာလည်း ဒီအပတ် ဖြေထားလို့ရပါတယ်။ ဘာဆိုရင် incident လဲ ဆိုတာကို စာကြောင်း အနည်းငယ်နဲ့ ချရေးပါ။ group chat ထဲ ပို့နေတဲ့ alert တစ်ခုကို rotation ဆီ ပြောင်းပို့ပါ။ ပြီးတော့ ဘယ်သူတွေ incident commander လုပ်နိုင်လဲ ကြိုသဘောတူထားပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - { title: "Workbook: On-Call", url: "https://sre.google/workbook/on-call/" }
      - {
          title: "Google SRE Incident Management Guide (sre.google)",
          url: "https://sre.google/resources/practices-and-processes/incident-management-guide/",
        }
    actions:
      - { id: show-p05, type: slide.show, at: { mark: show-p05 }, slideId: l09-p05 }

  - id: recap
    narration: >
      [[mark:close-p05]] [[mark:open-notes]] Viber group ကနေ rotation ဆီ ရောက်လာတဲ့ လမ်းကို ပြန်လျှောက်ကြည့်ရအောင်။ [[mark:sel-incident]] incident က user ဒါမှမဟုတ် business ကို ထိခိုက်လို့ စနစ်တကျ တုံ့ပြန်ရမယ့် ပြဿနာဖြစ်ပြီး ဘယ်သူမဆို ကြေညာလို့ရပါတယ်။ [[mark:sel-outage]] outage က အဲဒီထဲက service ဒါမှမဟုတ် အရေးကြီး feature လုံးဝ သုံးမရတာပါ။ [[mark:sel-rotation]] rotation က page တိုင်းမှာ နာမည်ပါတဲ့ တစ်ယောက် ရှိအောင် on-call ကို အလှည့်ကျ ယူတာပါ။
      [[mark:sel-response-time]] response time က page ဝင်ပြီး ဘယ်လောက် မြန်မြန် စတုံ့ပြန်ရမလဲ ဆိုတာ ဖြစ်ပြီး၊ [[mark:sel-incident-commander]] incident commander က ရာထူး မရွေး incident ကို ဦးဆောင်ပြီး လူတိုင်း ဘာလုပ်ရမလဲ စီစဉ်ပေးသူပါ။ [[mark:ask-question]] service တစ်ခုက on-call ကျသူကို တစ်ညကို ၆ ခါ page ပို့နေရင် ဘာကို အရင် ပြောင်းမလဲ?
      [[mark:pause-question]] လူ ထပ်ထည့်ဖို့ မဟုတ်ပါဘူး။ အလကား တက်နေတဲ့ alert တွေကို အရင် ပြင်ပါ၊ ဒါမှမဟုတ် ပိတ်ပါ၊ ပြီးမှ response time ပစ်မှတ်ကို ပြန်စစ်ပါ။ လစာထုတ်ရက် ညနေ ၆ နာရီ ၄၀ မှာတော့ Top-up ရဲ့ burn-rate page ဝင်လာပြီး support ကလည်း ဖုန်းဘေလ် မဝင်ဘူးလို့ ပြောလာပါတယ်။ ဘယ်ကနေ စမလဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - { title: "Workbook: On-Call", url: "https://sre.google/workbook/on-call/" }
      - {
          title: "SRE book, 1st ed: Managing Incidents",
          url: "https://sre.google/sre-book/managing-incidents/",
        }
    actions:
      - { id: close-p05, type: slide.close, at: { mark: close-p05 } }
      - {
          id: open-notes,
          type: workspace.openFile,
          at: { mark: open-notes, offsetMs: 300 },
          path: notes.md,
        }
      - {
          id: sel-incident,
          type: editor.select,
          at: { mark: sel-incident },
          target: { file: notes.md, text: "incident", occurrence: 1 },
        }
      - {
          id: sel-outage,
          type: editor.select,
          at: { mark: sel-outage },
          target: { file: notes.md, text: "outage", occurrence: 1 },
        }
      - {
          id: sel-rotation,
          type: editor.select,
          at: { mark: sel-rotation },
          target: { file: notes.md, text: "rotation", occurrence: 1 },
        }
      - {
          id: sel-response-time,
          type: editor.select,
          at: { mark: sel-response-time },
          target: { file: notes.md, text: "response time", occurrence: 1 },
        }
      - {
          id: sel-incident-commander,
          type: editor.select,
          at: { mark: sel-incident-commander },
          target: { file: notes.md, text: "incident commander", occurrence: 1 },
        }
      # The voice script's ⟪select မေးခွန်း⟫ and ⟪pause 3s⟫, as in Module 1. The
      # marker opens the question's own dialog (ask-question), so the question-line
      # select hangs off it: it starts about as the question ends, its drag runs in
      # silence, and the answer at pause-question waits for it. A select anchored
      # at pause-question would drag under the answer's first words instead.
      # 6070 ms is the 81-character question's end at 70 ms/char; it leaves about
      # 2.8 / 1.6 / 0.5 s of quiet after the question at 55 / 70 / 95 ms per
      # character. An offset above ~6230 trips compile-check's 2.5 s
      # inserted-silence warning at 55.
      - id: select-question
        type: editor.select
        at: { mark: ask-question, offsetMs: 6070 }
        target:
          file: notes.md
          text: "မေးခွန်း: service တစ်ခုက on-call ကျသူကို တစ်ညကို page 6 ခါ ပို့နေတယ်။ ဘာကို အရင် ပြောင်းမလဲ?"
          occurrence: 1

checks:
  # 500, not 300: google-svg deck pages stall the main thread at show/close.
  - { type: timing.p95Ms, max: 500 }
