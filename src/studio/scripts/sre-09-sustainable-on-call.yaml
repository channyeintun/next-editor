  - id: who-answers
    chapter: "Page ကို ဘယ်သူ ဖြေမလဲ"
    narration: >
      [[mark:show-p02]] ဒါဆို လူကို ချက်ချင်း နှိုးတဲ့ alert၊ page ကို ဘယ်သူ ဖြေမလဲ? လူတိုင်းဆီ ပို့ရင် တစ်ယောက်ယောက် ဖြေမှာပါလို့ အားလုံး ထင်ပြီး ဘယ်သူမှ မဖြေဖြစ်ပါဘူး၊ ဒါကို bystander effect လို့ ခေါ်ပါတယ်။ ကိုနေလင်းလို ခေါင်းဆောင် တစ်ယောက်ကိုပဲ အားကိုးရင်လည်း သူ လေယာဉ်ပေါ် ရောက်နေတဲ့နေ့ အကုန် ရပ်မှာမို့ single point of failure ဖြစ်ပါတယ်။
      [[mark:p02-rotation]] ဒါကြောင့် မနက် ၂ နာရီ မေးခွန်းအတွက် Padauk ရဲ့ အဖြေက ချက်ချင်း ဖြေရမယ့် on-call တာဝန်ကို အလှည့်ကျ ယူတဲ့ rotation ပါ။ ဒီည ဘယ်သူ ဖြေရမလဲ ဆိုတာ schedule မှာ နာမည်နဲ့ ပါလို့ ကျန်တဲ့သူတွေ စိတ်အေးအေး အိပ်လို့ရပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - { title: "Workbook: On-Call", url: "https://sre.google/workbook/on-call/" }
    actions:
      # Advances in place from l09_p01b; p02-rotation only splits the dialog.
      - { id: show-p02, type: slide.show, at: { mark: show-p02 }, slideId: l09-p02 }

  - id: coverage-clock
    chapter: "ဘယ်အချိန်၊ ဘယ်လောက် မြန်မြန်"
    narration: >
      [[mark:close-p02]] [[mark:b2-s1]] rotation ဆွဲဖို့ မသီရိက service တိုင်းအတွက် မေးခွန်း တစ်ခုတည်း မေးပါတယ်၊ ဒီ page ကို မနက် ၇ နာရီအထိ စောင့်ခိုင်းရင် ဘာ ဆုံးရှုံးမလဲ ဆိုတာပါ။ Wallet ရဲ့ burn-rate page က သဘောတူထားတဲ့ ပစ်မှတ်၊ SLO ရဲ့ ပျက်ခွင့်ကို အရမ်း မြန်မြန် သုံးနေမှ ဝင်လာတာမို့ စောင့်ခိုင်းရင် ငွေလွှဲတဲ့ user တွေ မိနစ်တိုင်း ပိုဒုက္ခရောက်ပါမယ်။ ဒါကြောင့် Wallet ကို တစ်နေ့ ၂၄ နာရီ၊ ရက်တိုင်း စောင့်ပြီး ၅ မိနစ်အတွင်း စတုံ့ပြန်ရပါတယ်။
      [[mark:b2-s2]] Eats ကတော့ ညဘက် ဆိုင်တွေ ပိတ်လို့ မနက် ၇ နာရီကနေ ည ၁၁ နာရီအထိပဲ စောင့်ပါတယ်။ merchant တွေဆီ ငွေလွှဲတဲ့ settlement job ကလည်း ပျက်ရင် နာရီအနည်းငယ် နောက်မှ ပြန် run လို့ရလို့ ရုံးချိန်ထဲမှာပဲ ကြည့်ပါတယ်။
      [[mark:b2-s3]] promo banner ပြတဲ့ service ကတော့ ပျက်ရင် app က banner မပြရုံပဲမို့ page လုံးဝ မပို့ဘဲ မနက်ကျမှ ticket နဲ့ ပြင်ပါတယ်။ တစ်နေ့ ၂၄ နာရီ on-call က ပိုက်ဆံလည်း ကုန်၊ လူလည်း ပင်ပန်းလို့ တကယ် လိုမှ ထားရပါတယ်။
      [[mark:b2-s4]] page ဝင်ပြီး စတုံ့ပြန်ရမယ့် ကြာချိန်ကို response time လို့ ခေါ်ပါတယ်။ ၅ မိနစ်ဆိုရင် laptop ကို ဘယ်သွားသွား ယူသွားရပြီး ရုံးသွားတဲ့ လမ်းပေါ် မရောက်ခင် နောက်လူကို လွှဲထားရပါတယ်။ page က primary ဆီ အရင် ရောက်ပြီး သူက ကြည့်နေပါပြီလို့ ack မလုပ်ရင် secondary ဆီ ဆက်သွားပါတယ်။
      [[mark:b2-s5]] ၃ မိနစ်ထက် မြန်ရရင်တော့ ဖုန်း အားသွင်းဖို့ ခဏ ထားခဲ့ရင်တောင် မမီတော့လို့ အမြဲ အသင့်ဖြစ်နေတဲ့ လူ နှစ်ယောက် လိုပြီး၊ မိနစ် ၃၀ ဆိုရင်တော့ ကလေး ကျောင်းကြိုတာလို ပုံမှန် ဘဝ နေလို့ရပါတယ်။
    sources:
      - {
