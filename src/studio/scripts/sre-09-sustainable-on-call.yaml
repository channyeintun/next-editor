      - { id: show-p03, type: slide.show, at: { mark: show-p03 }, slideId: l09-p03 }
      - { id: show-p03b, type: slide.show, at: { mark: show-p03b }, slideId: l09-p03b }

  - id: incident-roles
    chapter: "Incident commander နဲ့ role တွေ"
    narration: >
      [[mark:close-p03b]] [[mark:b3-s1]] တစ်လလောက် ကြာတော့ စနေနေ့ ညနေမှာ Bank X ဆီ ငွေလွှဲတာတွေ ထပ် fail လာပါတယ်။ ဒီတစ်ခါတော့ Wallet ရဲ့ on-call ကျနေတဲ့ junior developer က ၂ မိနစ်အတွင်း ack လုပ်ပြီး incident ကြေညာပါတယ်၊ သူပဲ incident commander အဖြစ် ဦးဆောင်ပါတယ်။ incident commander က incident တစ်ခုလုံးကို ညှိပြီး ဆုံးဖြတ်တဲ့သူပါ၊ ကိုယ်တိုင် ပြင်တာထက် လူတိုင်း ဘာလုပ်ရမလဲ သိအောင် စီစဉ်ပေးတာက သူ့ အလုပ်ပါ။
      [[mark:b3-s2]] သူက role သုံးခု ခွဲပေးပါတယ်။ communications lead က support နဲ့ ကိုနေလင်းကို ပုံမှန် update ပေးလို့ ပြင်နေတဲ့သူတွေကို ဘယ်သူမှ လာမမေးတော့ပါဘူး။ secondary က operations lead အဖြစ် တကယ် ပြင်တဲ့ အလုပ်ကို ဦးဆောင်ပြီး scribe က ဘာဖြစ်လဲ၊ ဘာဆုံးဖြတ်လဲ အချိန်နဲ့ တကွ မှတ်ပါတယ်။ incident သေးရင် တစ်ယောက်က role နှစ်ခု ယူလို့ရပါတယ်။
      [[mark:b3-s3]] ကိုနေလင်း call ထဲ ဝင်လာပေမဲ့ incident commander က CTO ဘာပြောမလဲ စောင့်မနေဘဲ သူ့ကို Bank X ရဲ့ တာဝန်ရှိသူဆီ ဖုန်းဆက်ဖို့ အလုပ် ခွဲပေးလိုက်ပါတယ်။ ရာထူး ဘယ်လောက်ပဲ ရှိရှိ incident commander က ဦးဆောင်တယ်လို့ ကြိုသဘောတူထားလို့ပါ။
      [[mark:b3-s4]] ဒါပေမဲ့ Wallet နဲ့ Top-up နှစ်ဖွဲ့လုံး ပါလာပြီး Wallet ကို ကယ်ဖို့ Top-up ကို ခဏ ပိတ်မလားလို ဘယ်အဖွဲ့က ဆုံးဖြတ်ရမလဲ မရှင်းတဲ့ incident တွေလည်း ရှိပါတယ်။ [[mark:b3-s4-coordinator]] အဲဒီအခါ ကုမ္ပဏီ တစ်ခုလုံးရဲ့ rotation သေးသေးလေးကနေ အဖွဲ့တွေကြား ညှိပေးသူ တစ်ယောက် ခေါ်ပါတယ်။ သူက ကိုယ်တိုင် မပြင်ဘဲ ဆုံးဖြတ်ချက်တွေ မြန်မြန် ထွက်အောင် လုပ်ပေးပြီး နောက်ဆက်တွဲ အလုပ်ကိုတော့ service ပိုင်တဲ့ အဖွဲ့က ယူပါတယ်။ incident အရမ်းကြီးရင် အဖွဲ့တွေရဲ့ incident commander တွေကို အပေါ်ကနေ ညှိပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book, 1st ed: Managing Incidents",
          url: "https://sre.google/sre-book/managing-incidents/",
        }
      - {
          title: "PagerDuty Incident Response docs: Different Roles",
          url: "https://response.pagerduty.com/before/different_roles/",
        }
    actions:
      - { id: close-p03b, type: slide.close, at: { mark: close-p03b, offsetMs: -400 } }
      - id: b3-s1
        type: whiteboard.apply
        at: { mark: b3-s1 }
        open: true
        clear: true
        upsertIds: [l09-b3-ic, l09-b3-ic-t, l09-b3-ic-arrow, l09-b3-bus]
        drawMs: 1800
      - id: b3-s2
        type: whiteboard.apply
        at: { mark: b3-s2 }
        upsertIds:
          [
            l09-b3-a1,
            l09-b3-comms,
            l09-b3-comms-t,
            l09-b3-a2,
            l09-b3-ops,
            l09-b3-ops-t,
            l09-b3-a3,
            l09-b3-scribe,
            l09-b3-scribe-t,
          ]
        drawMs: 2600
      - id: b3-s3
        type: whiteboard.apply
        at: { mark: b3-s3 }
