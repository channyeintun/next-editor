  - id: sustainable-rotation
    chapter: "ရေရှည် လုပ်နိုင်တဲ့ rotation"
    narration: >
      [[mark:close-b2]] [[mark:show-p02b]] rotation စတဲ့ ပထမ အပတ်မှာ Wallet ရဲ့ on-call ကျနေသူဆီ တစ်ညကို page ၁၀ ခုလောက် ဝင်ပါတယ်။ အများစုက Viber group ထဲမှာ ဘယ်သူမှ မဖတ်ခဲ့လို့ မပြင်ခဲ့တဲ့ alert အဟောင်းတွေမို့ မသီရိက လူ ထပ်မထည့်ခင် အဲဒီ alert တွေကို အရင် ပြင်ခိုင်းပါတယ်၊ မဟုတ်ရင် page တွေကို လူတွေ ပြန်လျစ်လျူရှု လာမှာပါ။
      [[mark:show-p03]] incident တစ်ခုကို ပြင်ပြီး မှတ်တမ်းတင်တာ နာရီ အတော်များများ ကြာတတ်လို့ တစ်ယောက်ရဲ့ တာဝန်ကာလ၊ shift တစ်ခုမှာ incident နှစ်ခုလောက်က အများဆုံးပါ၊ ဒီထက် များရင် ပြင်တာ နှေးပြီး သင်ယူဖို့ အချိန် မကျန်တော့ပါဘူး။ မီးပျက်တာ၊ လိုင်းကျတာ ခဏခဏ ဖြစ်လို့ on-call ကျသူတိုင်း အရန် မီးနဲ့ ဒုတိယ SIM ကတ်လည်း ထားပါတယ်။ Eats လို လူ နည်းတဲ့ အဖွဲ့မှာ schedule မကိုက်ရင်တော့ လူကို burnout မဖြစ်စေဘဲ response time ပစ်မှတ်ကို ဖြေလျှော့ပါတယ်။
      [[mark:show-p03b]] page နည်းလွန်းရင်လည်း တကယ် ဝင်လာတဲ့နေ့ကျ tool တွေကို ဘယ်လို သုံးရမလဲ မေ့နေတတ်ပါတယ်။ ဒါကြောင့် မသီရိက rotation ကျန်းမာလား သိဖို့ ဈေးအပေါဆုံး ကိန်းဂဏန်း နှစ်ခုကို လတိုင်း ရေတွက်ပါတယ်၊ shift တစ်ခုစီရဲ့ page အရေအတွက်နဲ့ alert မတက်ခင် user က တွေ့ခဲ့တဲ့ incident အရေအတွက်ပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - { title: "Workbook: On-Call", url: "https://sre.google/workbook/on-call/" }
