# M2 multi-surface pilot: slides + whiteboard + editor + cursor + workspace +
# runtime in one scripted lesson, with a simulated transient runtime failure to
# exercise the declared-idempotent retry path. Compile with:
#   bun scripts/studio-director.ts src/studio/scripts/go-cube-tour.yaml
schemaVersion: 1

lesson:
  slug: go-cube-tour
  title: "Cube a number in Go — full-surface tour"
  locale: en-US
  workspace:
    lessonType: go
    name: Go Lesson
    entryFilePath: main.go
    files:
      main.go: |
        package main

        import "fmt"

        func main() {
        	fmt.Println("Hello, Go lessons!")

        	for i := 1; i <= 5; i++ {
        		fmt.Printf("%d squared is %d\n", i, square(i))
        	}
        }
      square.go: |
        package main

        func square(value int) int {
        	return value * value
        }
  slides:
    - id: intro
      contentType: markdown
      name: Cube a number
      content: |
        # Cube a number

        `cube(v) = v × v × v`

        One function, one extra multiply.
  whiteboardAssets:
    - id: cube-box
      kind: rectangle
      x: 320
      y: 200
      width: 420
      height: 150
      strokeColor: "#7dd3fc"
    - id: cube-label
      kind: text
      x: 350
      y: 250
      width: 360
      height: 40
      text: "cube = value × value × value"
      strokeColor: "#e2e8f0"
      fontSize: 24

build:
  voiceProfile: say-samantha-v1
  seed: 7

runtime:
  kind: go-playground
  defaultMode: fixture
  fixture:
    latencyMs: 1200
    transientErrorKinds: [unavailable]
    result:
      status: success
      exitCode: 0
      output: "Hello, Go lessons!\n1 squared is 1\n2 squared is 4\n3 squared is 9\n4 squared is 16\n5 squared is 25\n3 cubed is 27\n"

scenes:
  - id: concept
    narration: >
      Here's today's one idea: cubing a number. [[mark:slide]] A cube is just a
      value multiplied by itself twice more, value, times value, times value.
      [[mark:slide-close]] Let's build it in Go.
    sources:
      - title: "A Tour of Go — Functions"
        url: "https://go.dev/tour/basics/4"
    actions:
      - id: show-intro
        type: slide.show
        at: { mark: slide }
        slideId: intro
      - id: close-intro
        type: slide.close
        at: { mark: slide-close }

  - id: sketch
    narration: >
      [[mark:board]] Sketch it first. Square multiplies a value by itself once;
      [[mark:board-label]] cube adds one more multiplication. Same shape, one
      extra step. [[mark:board-close]] Now the code.
    sources:
      - title: "The Go Programming Language Specification — Arithmetic operators"
        url: "https://go.dev/ref/spec#Arithmetic_operators"
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { mark: board }
        open: true
        upsertIds: [cube-box]
      - id: label-board
        type: whiteboard.apply
        at: { mark: board-label }
        upsertIds: [cube-label]
      - id: close-board
        type: whiteboard.apply
        at: { mark: board-close }
        open: false

  - id: helpers
    narration: >
      [[mark:open-square]] Square lives in its own file, and any file in the
      package can call it. [[mark:type-cube]] Add cube right beside it,
      multiplying value three times.
    sources:
      - title: "The Go Programming Language Specification — Declarations and scope"
        url: "https://go.dev/ref/spec#Declarations_and_scope"
    actions:
      - id: open-square
        type: workspace.openFile
        at: { mark: open-square }
        path: square.go
      - id: type-cube
        type: editor.type
        at: { mark: type-cube, offsetMs: -400 }
        target:
          file: square.go
          after: "\treturn value * value\n}\n"
          occurrence: 1
        cadence: fast-explainer
        text: "\nfunc cube(value int) int {\n\treturn value * value * value\n}\n"

  - id: call-and-run
    narration: >
      [[mark:open-main]] Now call cube from main, and print the result.
      [[mark:run]] Run it. If the Playground hiccups, the studio retries once,
      quietly. And there it is at the end: three cubed is twenty seven.
    sources:
      - title: "Go Playground — About"
        url: "https://go.dev/play/"
    actions:
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main, offsetMs: 400 }
        path: main.go
      - id: type-call
        type: editor.type
        at: { mark: open-main, offsetMs: 800 }
        target:
          file: main.go
          after: ", square(i))\n\t}\n"
          occurrence: 1
        cadence: fast-explainer
        text: "\n\tfmt.Println(\"3 cubed is\", cube(3))\n"
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 1200 }
        timeoutMs: 15000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "3 cubed is 27"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.go
        contains: "cube(3)"

checks:
  - { type: timing.p95Ms, max: 300 }
