  - id: desk-shelf
    chapter: အမြဲလား၊ လိုမှလား
    narration: >
      [[mark:d-open]] ဒီ ခြောက်မျိုးလုံးကို session တိုင်း agent ရဲ့ စားပွဲပေါ် အကုန် တင်ထားဖို့ မလိုပါဘူး။
      ဒါကြောင့် နှစ်မျိုး ခွဲပါတယ်။ [[mark:d-desk]] တစ်မျိုးက session တိုင်း အမြဲ တင်ပေးတဲ့ context ပါ။ project
      ရဲ့ အကျဉ်း၊ ဘာနဲ့ ဆောက်လဲ၊ မချိုးရတဲ့ rule တွေ လို အလုပ်တိုင်းမှာ လိုတဲ့ အချက်တွေကို rule file တစ်ခုထဲမှာ
      ရေးထားရင်၊ agent က session စတိုင်း အဲဒီ ဖိုင်ကို ဖတ်ပါတယ်။ [[mark:d-shelf]] နောက်တစ်မျိုးကတော့ စင်ပေါ်မှာ
      ထားပြီး လုပ်နေတဲ့ အလုပ်၊ task က လိုမှ ယူဖတ်တဲ့ context ပါ။ spec၊ requirements လို ရှည်တဲ့ စာတမ်းတွေနဲ့၊
      အဆင့်လိုက် လုပ်ရတဲ့ ညွှန်ကြားချက်တွေပါ။ task လိုမှ agent ဖတ်တဲ့ အဲဒီလို ညွှန်ကြားချက် အထုပ်ကို skill
      လို့လည်း ခေါ်ကြပါတယ်။ [[mark:d-why]] ဘာကြောင့် အကုန်လုံးကို စားပွဲပေါ် မတင်တာလဲ။ စားပွဲပေါ်က စာ များလေ၊
      session တိုင်းမှာ ငွေ ပိုကုန်လေ ဖြစ်သလို၊ အရေးကြီးတဲ့ rule တစ်ကြောင်းက စာတွေကြားမှာ မြုပ်ပြီး model က
      လွတ်သွားတတ်လေ ဖြစ်လို့ပါ။ ဒါပေမဲ့ နည်းလွန်းပြန်ရင်လည်း၊ အလုပ်တိုင်း လိုတဲ့ rule က agent ရှေ့မှာ မရှိတော့လို့
      အဲဒီ rule နဲ့ မကိုက်တဲ့ code ကို ထုတ်ပေးနိုင်ပါတယ်။ [[mark:d-rule]] ဒါကြောင့် စားပွဲပေါ်က ဖိုင်ကို တိုတို
      ထားပြီး၊ ကျန်တာတွေကို ဘယ်မှာ ရှိလဲ ညွှန်ပေးထားပါ။
    sources:
      - {
          title: "The New SDLC (Burmese edition): Context engineering (static vs dynamic context; skills)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "Claude Code docs: Best practices (keep CLAUDE.md short; skills load when needed)",
          url: "https://code.claude.com/docs/en/best-practices",
        }
      - {
          title: "Anthropic: Effective context engineering for AI agents (context as a finite resource)",
          url: "https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents",
        }
    actions:
      - {
          id: open-board-d,
          type: whiteboard.apply,
          at: { mark: d-open },
          open: true,
          clear: true,
          upsertIds: [d-title],
        }
      - {
          id: draw-d-desk,
          type: whiteboard.apply,
          at: { mark: d-desk },
          upsertIds: [d-desk-h, d-desk, d-a1, d-a2, d-a3],
          drawMs: 2000,
        }
      - {
          id: draw-d-shelf,
          type: whiteboard.apply,
          at: { mark: d-shelf },
          upsertIds: [d-shelf-h, d-shelf, d-s1, d-s2, d-s3],
          drawMs: 2000,
        }
      - {
          id: draw-d-why,
          type: whiteboard.apply,
          at: { mark: d-why },
          upsertIds: [d-why],
          drawMs: 1100,
        }
      - {
          id: draw-d-rule,
          type: whiteboard.apply,
          at: { mark: d-rule },
          upsertIds: [d-rule],
          drawMs: 1000,
        }

  - id: project
    chapter: AGENTS.md ရေးရအောင်
    narration: >
      [[mark:close-d]] ကဲ၊ ကိုယ်တို့ project အတွက် agent ရဲ့ စားပွဲပေါ် တင်မယ့် ဖိုင်ကို ရေးကြည့်ရအောင်။
      [[mark:sel-name]] AGENTS.md ဆိုတာ project ထဲ ဝင်လာတဲ့ agent တိုင်း အရင်ဖတ်တဲ့ rule file ပါ။ team ထဲ ဝင်လာတဲ့
      လူသစ်အတွက် ရေးပေးတဲ့ မှတ်စုနဲ့ ဆင်ပါတယ်။ coding agent အများအပြား ဖတ်တဲ့ ပုံစံ တစ်ခု ဖြစ်ပြီး၊ tool တချို့က
      CLAUDE.md၊ GEMINI.md လို tool နာမည် ပါတဲ့ ဖိုင်ကို ဖတ်ကြပေမဲ့ သဘောတရားက အတူတူပါပဲ။ [[mark:type-project]] ပထမ
      အပိုင်းရဲ့ ပထမ စာကြောင်းက ဒီ project ဘာလဲ ဆိုတာကို agent အတွက် အတိုချုပ် ရေးထားတာပါ။ ဘယ် ဆိုင်အတွက်လဲ၊
      customer တွေ ဘာ လုပ်ကြမလဲ ဆိုတာ ပါပါတယ်။ [[mark:sel-read-spec]] ဒုတိယ စာကြောင်းကတော့ agent ကို spec ဆီ
      လမ်းညွှန်ပေးပြီး၊ spec မှာ မပါတဲ့ ကိစ္စတွေကို agent က သူ့ဘာသာ ခန့်မှန်းပြီး မဆုံးဖြတ်အောင် ကာကွယ်ပေးတာပါ။
      [[mark:open-spec]] spec ဖိုင်က စာကြောင်း လေးဆယ်ကျော် ရှိပြီး၊ task တိုင်းမှာ အကုန် မလိုပါဘူး။
      [[mark:back-agents]] ဒါကြောင့် ဒီ ဖိုင်ထဲကို မကူးဘဲ၊ စင်ပေါ်က နေရာကိုပဲ ညွှန်ထားတာပါ။ ဒီ ဖိုင်ကိုတော့ agent
      က session တိုင်း အမြဲ ဖတ်ပါတယ်။ အမြဲ ဖတ်ရတဲ့ ဖိုင် ဖြစ်လို့ တိုနိုင်သမျှ တိုအောင်၊ တခြား စာတမ်းတွေနဲ့ မတူဘဲ
      English စာကြောင်း တိုတိုတွေနဲ့ ရေးထားပါတယ်။ စာကြောင်းတွေကို မဖတ်ပြဘဲ ဘာ ဆုံးဖြတ်ထားလဲ ဆိုတာကို မြန်မာလို
      ရှင်းပြသွားပါမယ်။ English က model အတွက် ဘာကြောင့် ပိုတိုလဲ ဆိုတာကိုတော့ နောက်ပိုင်း lesson တစ်ခုမှာ
      ကြည့်ပါမယ်။
    sources:
      - {
          title: "AGENTS.md: a simple, open format for guiding coding agents",
          url: "https://agents.md/",
        }
      - {
          title: "Claude Code docs: How Claude remembers your project (CLAUDE.md, AGENTS.md)",
          url: "https://code.claude.com/docs/en/memory",
        }
      - {
          title: "Gemini CLI docs: Provide context with GEMINI.md files",
          url: "https://geminicli.com/docs/cli/gemini-md",
        }
    actions:
      - { id: close-d, type: whiteboard.apply, at: { mark: close-d }, open: false }
      - {
          id: sel-name,
          type: editor.select,
          at: { mark: sel-name },
          target: { file: AGENTS.md, text: "# AGENTS.md", occurrence: 1 },
        }
      - id: type-project
        type: editor.type
        at: { mark: type-project }
        target:
          {
            file: AGENTS.md,
            after: "# AGENTS.md · Shwe Tea House pre-order app\n\n",
            occurrence: 1,
          }
        text: "## Project\nA pre-order web app for a tea shop in Yangon. Customers order ahead and pick up at the counter.\nRead docs/spec.md before any change. If the spec does not answer a question, stop and ask.\n\n"
        cadence: line-by-line
      - {
          id: sel-read-spec,
          type: editor.select,
          at: { mark: sel-read-spec },
          target:
            {
              file: AGENTS.md,
              text: "Read docs/spec.md before any change. If the spec does not answer a question, stop and ask.",
              occurrence: 1,
            },
        }
      - { id: open-spec, type: workspace.openFile, at: { mark: open-spec }, path: docs/spec.md }
      - { id: back-agents, type: workspace.openFile, at: { mark: back-agents }, path: AGENTS.md }

  - id: stack
    narration: >
      [[mark:type-stack]] နောက်တစ်ပိုင်းက app ကို ဘာ နည်းပညာနဲ့ ဆောက်မလဲ ဆိုတာကို ပုံသေ ချထားတာပါ။ framework ဆိုတာ
      app ဆောက်ဖို့ တခြားသူတွေ အသင့် ရေးထားတဲ့ code အစု ကြီးတွေပါ။ ဒီ ရွေးချယ်မှုကို မရေးထားရင် agent က session
      တစ်ခုမှာ framework တစ်ခု၊ နောက် session မှာ တခြား တစ်ခု ရွေးသွားနိုင်ပါတယ်။ [[mark:sel-stack]] အခု code
      မရှိသေးတော့ ဒီ ဆုံးဖြတ်ချက်ကို code ကနေ ရှာဖတ်လို့ မရပါဘူး။ agent ကိုယ်တိုင် ရှာမတွေ့နိုင်တာတွေက ဒီ ဖိုင်ရဲ့
      အဓိက အကြောင်းအရာပါ။ project ကြီးလာရင် app မှန်မမှန် စစ်တဲ့ test တွေကို run တဲ့ command တွေကိုလည်း ဒီလို
      ဖိုင်မှာ ရေးကြပါတယ်။
    sources:
      - {
          title: "Claude Code docs: Best practices (only write down what Claude can't find by reading the repo)",
          url: "https://code.claude.com/docs/en/best-practices",
        }
      - {
          title: "AGENTS.md: what to include (project overview, build and test commands)",
          url: "https://agents.md/",
        }
    actions:
      - id: type-stack
        type: editor.type
        at: { mark: type-stack }
        target:
          {
            file: AGENTS.md,
            after: "If the spec does not answer a question, stop and ask.\n\n",
            occurrence: 1,
          }
        text: "## Stack\nPlain HTML, CSS and JavaScript. No framework.\n\n"
        cadence: line-by-line
      - {
          id: sel-stack,
          type: editor.select,
          at: { mark: sel-stack },
          target:
            {
              file: AGENTS.md,
              text: "Plain HTML, CSS and JavaScript. No framework.",
              occurrence: 1,
            },
        }

  - id: rules
    narration: >
      [[mark:type-rules-a]] အခု rule တွေကို အုပ်စု နှစ်ခု ခွဲပြီး ထည့်ပါမယ်။ ပထမ အုပ်စုက app ထဲမှာ customer
      မြင်ရမယ့် အရာတွေ ဘယ်လို ပေါ်ရမလဲ ဆိုတာပါ။ [[mark:sel-kyat]] ဒီ သုံးကြောင်းက ဈေးနှုန်း ပြပုံ၊ customer
      ဖတ်ရမယ့် ဘာသာစကားနဲ့ ဆိုင်ရှိတဲ့ မြို့ရဲ့ အချိန်ကို ပုံသေ ချထားတဲ့ guardrail တွေပါ။ code ကို ဘယ်နေရာမှာ
      ပြင်ပြင် ထိနိုင်တဲ့ အချက်တွေ ဖြစ်လို့၊ ဘယ် task မှာမဆို agent ရှေ့မှာ ရှိနေရပါမယ်။ [[mark:type-rules-b]]
      နောက် နှစ်ကြောင်းကတော့ agent ဘယ်လို အလုပ်လုပ်ရမလဲ ဆိုတဲ့ rule တွေပါ။ [[mark:sel-package]] package ဆိုတာ
      ကိုယ် မရေးဘဲ ယူသုံးတဲ့ တခြားသူ့ code ပါ။ ဒီ စာကြောင်းက project ထဲ ဝင်လာမယ့် တခြားသူ့ code ကို ကိုယ်က
      ထိန်းထားနိုင်အောင် agent ရဲ့ tools ကို နယ်သတ်ပေးတာပါ။ နောက်ဆုံး စာကြောင်းကတော့ ကိုယ့်ဘက်က ပြန်စစ်ရ လွယ်အောင်
      ထားတာပါ။ ပြောင်းလဲမှု သေးလေ၊ agent ဘာ ပြင်သွားလဲ ဆိုတာကို တစ်ကြောင်းချင်း ကြည့်နိုင်လေပါ။
    sources:
      - {
          title: "AGENTS.md: a simple, open format for guiding coding agents",
          url: "https://agents.md/",
        }
      - {
          title: "The New SDLC (Burmese edition): Where to start (stack, conventions, hard rules)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - id: type-rules-a
        type: editor.type
        at: { mark: type-rules-a }
        target: { file: AGENTS.md, after: "No framework.\n\n", occurrence: 1 }
        text: "## Rules\n- Prices are whole kyat (integers). Never use decimals.\n- Customer-facing text is Burmese (Unicode).\n- Times are Asia/Yangon.\n"
        cadence: line-by-line
      - {
          id: sel-kyat,
          type: editor.select,
          at: { mark: sel-kyat },
          target:
            {
              file: AGENTS.md,
              text: "- Prices are whole kyat (integers). Never use decimals.\n- Customer-facing text is Burmese (Unicode).\n- Times are Asia/Yangon.\n",
              occurrence: 1,
            },
        }
      - id: type-rules-b
        type: editor.type
        at: { mark: type-rules-b }
        target: { file: AGENTS.md, after: "- Times are Asia/Yangon.\n", occurrence: 1 }
        text: "- Ask before adding any package.\n- One task at a time. Keep each change small.\n\n"
        cadence: line-by-line
      - {
          id: expect-rules,
          type: expect.file,
          at: { afterAction: type-rules-b },
          path: AGENTS.md,
          contains: "- Ask before adding any package.",
        }
      - {
          id: sel-package,
          type: editor.select,
          at: { mark: sel-package },
          target: { file: AGENTS.md, text: "- Ask before adding any package.", occurrence: 1 },
        }

  - id: done-means
    narration: >
      [[mark:type-done]] နောက်ဆုံး အပိုင်းကတော့ ပြီးပြီ လို့ ပြောခွင့်ကို app ကြည့်ရတာ ကောင်းနေရုံနဲ့ မပေးဘဲ၊ spec
      ထဲက acceptance criteria တွေနဲ့ ချိတ်ထားတာပါ။ [[mark:sel-summary]] ဒီ စာကြောင်းက agent အလုပ် ပြီးသွားတဲ့အခါ
      ကိုယ့်ဆီ ပြန်ရောက်လာမယ့် အစီရင်ခံစာမှာ ဘာတွေ ပါရမလဲ သတ်မှတ်ထားတာပါ။ မလုပ်ခဲ့တာတွေပါ ပါလာတော့၊ ကိုယ်က ဘာကို
      ဆက်စစ်ရမလဲ ဆိုတာ ရှင်းသွားပါတယ်။
    sources:
      - {
          title: "AGENTS.md: a simple, open format for guiding coding agents",
          url: "https://agents.md/",
        }
      - {
          title: "The New SDLC (Burmese edition): Where to start (tests and evals as the contract)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - id: type-done
        type: editor.type
        at: { mark: type-done }
        target: { file: AGENTS.md, after: "Keep each change small.\n\n", occurrence: 1 }
        text: "## Done means\n- The acceptance criteria named in the task pass.\n- Summarise what you changed and what you did not do.\n"
        cadence: line-by-line
      - {
          id: expect-done,
          type: expect.file,
          at: { afterAction: type-done },
          path: AGENTS.md,
          contains: "- Summarise what you changed and what you did not do.",
        }
      - {
          id: sel-summary,
          type: editor.select,
          at: { mark: sel-summary },
          target:
            {
              file: AGENTS.md,
              text: "- Summarise what you changed and what you did not do.",
              occurrence: 1,
            },
        }

  - id: grow
    chapter: ဆယ်ကြောင်းကနေ စပါ
    narration: >
      [[mark:k-reopen]] context ခြောက်မျိုးကို ပြန်ကြည့်ရအောင်။ [[mark:k-where1]] ခုနက ရေးလိုက်တဲ့ AGENTS.md ထဲမှာ
      instructions၊ tools နဲ့ guardrail တွေ ရှိပါတယ်။ [[mark:k-where2]] knowledge နဲ့ ဥပမာကတော့ spec ထဲမှာ
      ရှိပြီး၊ memory ကတော့ ကိုယ်တို့ ရေးထားတဲ့ ဖိုင်တွေ ကိုယ်တိုင်ပါပဲ။ အားလုံးကို နေရာ တစ်ခုထဲ မပုံဘဲ၊ နေရာ
      မှန်မှန်မှာ ခွဲထားတာပါ။ [[mark:close-k]] ဖိုင်ကို ပြန်ကြည့်ရင် အကြောင်းအရာ စာကြောင်း ဆယ်ကြောင်းပဲ ရှိပါတယ်။
      [[mark:sel-whole]] ဒီလောက်နဲ့ စတာ ကောင်းပါတယ်။ ဒီဖိုင်ကို တစ်ခါတည်း ပြီးအောင် ရေးစရာ မလိုပါဘူး။ project
      နဲ့အတူ တဖြည်းဖြည်း ကြီးလာမှာ ဖြစ်ပြီး၊ မမှန်တော့တဲ့ စာကြောင်းကိုလည်း ဖယ်ရပါမယ်။ ဒီ course ထဲမှာလည်း
      ရိုးရှင်းအောင် ထားဖို့၊ လုံခြုံရေးနဲ့ စစ်ဆေးမှု အတွက် အပိုင်းတွေကို နောက် lesson တွေမှာ ဒီဖိုင်ထဲ
      ထပ်ထည့်သွားပါမယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): Where to start (start AGENTS.md with about ten lines; add a rule for each repeated mistake)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "Claude Code docs: How Claude remembers your project (when to add: the same mistake a second time)",
          url: "https://code.claude.com/docs/en/memory",
        }
    actions:
      - {
          id: reopen-k,
          type: whiteboard.apply,
          at: { mark: k-reopen },
          open: true,
          clear: true,
          upsertIds:
            [
              k-title,
              k-agent-box,
              k-agent,
              k1-box,
              k1,
              k1-d,
              k2-box,
              k2,
              k2-d,
              k3-box,
              k3,
              k3-d,
              k4-box,
              k4,
              k4-d,
              k5-box,
              k5,
              k5-d,
              k6-box,
              k6,
              k6-d,
            ],
        }
      - {
          id: draw-k-where1,
          type: whiteboard.apply,
          at: { mark: k-where1 },
          upsertIds: [k-where1],
          drawMs: 1200,
        }
      - {
          id: draw-k-where2,
          type: whiteboard.apply,
          at: { mark: k-where2 },
          upsertIds: [k-where2],
          drawMs: 1000,
        }
      - { id: close-k, type: whiteboard.apply, at: { mark: close-k }, open: false }
      - {
          id: sel-whole,
          type: editor.select,
          at: { mark: sel-whole },
          target:
            {
              file: AGENTS.md,
              text: "## Project\nA pre-order web app for a tea shop in Yangon. Customers order ahead and pick up at the counter.\nRead docs/spec.md before any change. If the spec does not answer a question, stop and ask.\n\n## Stack\nPlain HTML, CSS and JavaScript. No framework.\n\n## Rules\n- Prices are whole kyat (integers). Never use decimals.\n- Customer-facing text is Burmese (Unicode).\n- Times are Asia/Yangon.\n- Ask before adding any package.\n- One task at a time. Keep each change small.\n\n## Done means\n- The acceptance criteria named in the task pass.\n- Summarise what you changed and what you did not do.",
              occurrence: 1,
            },
        }

  - id: quiz
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ ဒီ ဖိုင် မရှိဘဲ app ကို ဆောက်နေတယ် ဆိုပါစို့။ agent ထုတ်ပေးတဲ့ code က
      ဈေးနှုန်းကို ဒသမ နဲ့ ပြတာ တစ်ပတ်အတွင်း နှစ်ခါ ဖြစ်ခဲ့ပါတယ်။ ပြင်ဖို့ ဒီနေ့ chat ထဲမှာ ပိုရှည်ရှည်၊
      ပိုပြင်းပြင်း ထပ်ပြောမလား၊ AGENTS.md ထဲမှာ rule တစ်ကြောင်း ထည့်မလား။ lesson ကို pause လုပ်ပြီး
      စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] အဖြေကတော့ ခ၊ AGENTS.md ထဲမှာ rule ထည့်တာပါ။ ဘာကြောင့်လဲဆိုတော့ ဒီနေ့
      chat ထဲမှာ ဘယ်လောက် ပြင်းပြင်း ပြောပြော၊ နောက် session က စားပွဲ အလွတ်နဲ့ ပြန်စတော့ အဲဒီ စကား မရှိတော့လို့ပါ။
      ဒသမ မပါရဘူး ဆိုတာက နောက်လည်း အမြဲ မှန်ရမယ့် rule ဖြစ်လို့၊ session စတိုင်း ဖတ်တဲ့ ဖိုင်ထဲမှာ နေရာ
      ရသင့်ပါတယ်။ [[mark:quiz-twice]] ဒီလို အမှား တစ်ခုတည်း နှစ်ခါ ပြန်ဖြစ်တာကပဲ rule တစ်ကြောင်း ထည့်ရမယ့်
      အချိန်ပါ။ ဈေးနှုန်း rule က spec ထဲမှာ ရှိပြီးသား ဖြစ်ပေမဲ့၊ code ရဲ့ နေရာ အများကြီးကို ထိတဲ့ guardrail
      ဖြစ်လို့ session စတိုင်း ဖတ်တဲ့ ဒီ ဖိုင်မှာလည်း တစ်ကြောင်း ထပ်ထားတာပါ။ [[mark:quiz-more]] rule က ဖိုင်ထဲမှာ
      ရှိရက်နဲ့ agent က ဆက် လွတ်နေသေးရင်တော့၊ စကားလုံး ပိုပြင်းအောင် ပြင်တာထက် ဖိုင်က ရှည်လွန်းလို့ rule
      မြုပ်နေလား အရင် စစ်ပါ။
    sources:
      - {
          title: "Claude Code docs: Best practices (if Claude keeps ignoring a line, the file may be too long)",
          url: "https://code.claude.com/docs/en/best-practices",
        }
      - {
          title: "Claude Code docs: How Claude remembers your project",
          url: "https://code.claude.com/docs/en/memory",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [z-title, z-q, z-o1, z-o2],
          drawMs: 2000,
        }
      - {
          id: draw-quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [z-a, z-a-note],
          drawMs: 1400,
        }
      - {
          id: draw-quiz-twice,
          type: whiteboard.apply,
          at: { mark: quiz-twice },
          upsertIds: [z-a-twice],
          drawMs: 1000,
        }
      - {
          id: draw-quiz-more,
          type: whiteboard.apply,
          at: { mark: quiz-more },
          upsertIds: [z-a-more],
          drawMs: 1000,
        }

  - id: recap
    chapter: ပြန်ချုပ်ရရင်
    narration: >
      [[mark:close-quiz]] ဒါဆို ပြန်ချုပ်ရရင်၊ agent ဘာ ထုတ်ပေးမလဲ ဆိုတာကို ခိုင်းတဲ့ စကားလုံးထက် agent ရှေ့မှာ
      ရှိတဲ့ context က ပိုဆုံးဖြတ်ပါတယ်။ team ထဲ ဝင်လာတဲ့ လူသစ် တစ်ယောက် ပထမနေ့မှာ လိုမယ့် အရာတွေကို စဉ်းစားပြီး၊
      session တိုင်း လိုတာကိုပဲ AGENTS.md ထဲမှာ တိုတို ရေးပါ။ [[mark:r-spec]] ရှည်တဲ့ spec လို စာတမ်းကိုတော့
      ညွှန်ထားပြီး၊ task က လိုမှ ဖတ်ခိုင်းပါ။ [[mark:r-kyat]] ဘယ်တော့မှ မချိုးရတဲ့ rule တွေကို ဒီ ဖိုင်ထဲမှာ
      ထားပါ။ [[mark:r-done]] ပြီးပြီ ဆိုတာ ဘာလဲ ဆိုတာကိုလည်း ရေးထားပါ။ ဆယ်ကြောင်းလောက်နဲ့ စပြီး၊ အမှား တစ်ခု
      နှစ်ခါ ထပ်ဖြစ်တိုင်း rule တစ်ကြောင်း ထည့်ပါ။ နောက် lesson မှာတော့ ဒီ context တွေ အသင့် ရှိပြီဆိုတော့၊ agent
      ကို task တစ်ခု ဘယ်လို အပ်မလဲ၊ brief တစ်စောင် ဘယ်လို ရေးမလဲ ဆိုတာကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): Context engineering",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "The New SDLC (Burmese edition): Where to start",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: close-quiz }, open: false }
      - {
          id: r-spec,
          type: editor.select,
          at: { mark: r-spec },
          target: { file: AGENTS.md, text: "Read docs/spec.md before any change.", occurrence: 1 },
        }
      - {
          id: r-kyat,
          type: editor.select,
          at: { mark: r-kyat },
          target: { file: AGENTS.md, text: "## Rules", occurrence: 1 },
        }
      - {
          id: r-done,
          type: editor.select,
          at: { mark: r-done },
          target: { file: AGENTS.md, text: "## Done means", occurrence: 1 },
        }
checks:
  - { type: timing.p95Ms, max: 300 }
