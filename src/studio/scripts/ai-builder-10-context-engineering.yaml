# AI Builder, lesson 10: context engineering and AGENTS.md (Burmese, docs kind).
#
# Start state (ws/): base-docs (package.json with a no-op dev script, notes.md), docs/spec.md complete
# as L09 leaves it (COURSE-KIT §4.3 without AC-6) and AGENTS.md pinned with only its title line.
# Nothing runs.
#
# Typed into AGENTS.md (COURSE-KIT §4.4 base text, English, line group by line group, each explained
# in Burmese and never read): Project · Stack · Rules (two groups: how things show, how the agent
# works) · Done means. The final file equals §4.4's base block (tools/sim-docs.ts).
#
# Boards: (K) a new teammate's first day → six kinds of context around the agent, later reopened with
# where each kind lives; (D) desk vs shelf: always loaded (AGENTS.md) vs read when the task needs it
# (spec, requirements, skills); (Z) the quiz.
#
# Build: bun ~/Documents/ai-builder-course-work/tools/build-lesson.ts template.yaml ws ai-builder-10-context-engineering.yaml
