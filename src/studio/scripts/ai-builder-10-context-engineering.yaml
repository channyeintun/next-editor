          url: "https://code.claude.com/docs/en/memory",
        }
    actions:
      - {
          id: sel-title,
          type: editor.select,
          at: { mark: sel-title },
          target:
            { file: AGENTS.md, text: "# AGENTS.md · Shwe Tea House pre-order app", occurrence: 1 },
        }

  - id: six-kinds
    chapter: Context ခြောက်မျိုး
    narration: >
      [[mark:k-open]] ပြီးခဲ့တဲ့ lesson မှာ spec ကို လူသစ် တစ်ယောက်လို ပြန်ဖတ်ကြည့်ဖို့ ပြောခဲ့ပါတယ်။ ဒီတစ်ခါတော့
      ဘာ context တွေ ပေးရမလဲ သိဖို့ အဲဒီ လူသစ်ဘက်ကနေ စကြည့်ရအောင်။ code ရေးတာ ကျွမ်းကျင်တဲ့ developer တစ်ယောက်
      တနင်္လာနေ့မှာ team ထဲ ဝင်လာတယ် ဆိုပါစို့။ သူ ပထမဆုံးနေ့မှာ အလုပ် ကောင်းကောင်း လုပ်နိုင်ဖို့ ဘာတွေ သိဖို့
      လိုမလဲ။ agent အတွက် အဖြေကလည်း အတူတူပါပဲ။ [[mark:k-1]] ပထမက instructions၊ ညွှန်ကြားချက်ပါ။ ဘာ အလုပ်လဲ၊
      ပန်းတိုင်က ဘာလဲ၊ ဘယ်အထိ လုပ်ခွင့် ရှိလဲ ဆိုတာပါ။ [[mark:k-2]] ဒုတိယက knowledge၊ အလုပ်အတွက် လိုတဲ့
      အချက်အလက်ပါ။ ကိုယ်တို့ ဆိုင်မှာဆိုရင် spec၊ menu၊ ဖွင့်ချိန် တို့ပါ။ [[mark:k-3]] တတိယက memory ပါ။ session
      တစ်ခုနဲ့ တစ်ခုကြား ဘာ ကျန်ခဲ့မလဲ ဆိုတာပါ။ model က session ကြား ဘာမှ သိမ်းမထားလို့၊ ဖိုင်ထဲမှာ ရေးထားတာပဲ
      နောက် session အထိ ကျန်ပါတယ်။ [[mark:k-4]] စတုတ္ထက examples၊ ဥပမာတွေပါ။ spec ထဲ ထည့်ခဲ့တဲ့ နမူနာ အော်ဒါ၊
      customer ဆီ ပို့ရမယ့် စာ တစ်စောင်ရဲ့ နမူနာ လို အရာတွေပါ။ [[mark:k-5]] ပဉ္စမက tools ပါ။ ကွန်ပျူတာကို
      ခိုင်းတဲ့ command တွေထဲက agent ဘာကို run ခွင့် ရှိလဲ၊ အပြင်က ဘာ service တွေကို သုံးခွင့် ရှိလဲ ဆိုတာပါ။
      [[mark:k-6]] နောက်ဆုံးက guardrail တွေပါ။ agent ဘယ်တော့မှ မချိုးဖောက်ရတဲ့ rule တွေပါ။ ဥပမာ customer ရဲ့
      ဖုန်းနံပါတ်ကို ဆိုင်ကလွဲရင် ဘယ်သူ့ကိုမှ မပြရဘူး ဆိုတာမျိုးပါ။
    sources:
      - {
          title: "The New SDLC (Burmese edition): Context engineering (six kinds of context; a new team member)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "Claude Code docs: How Claude remembers your project (a new teammate would need the same context)",
          url: "https://code.claude.com/docs/en/memory",
        }
    actions:
      - {
          id: open-board-k,
          type: whiteboard.apply,
          at: { mark: k-open },
          open: true,
          clear: true,
          upsertIds: [k-title, k-agent-box, k-agent],
          drawMs: 1400,
        }
