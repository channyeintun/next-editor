build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 6110
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}
scenes:
  - id: recall
    chapter: Agent ကို ဘာ ပေးမလဲ
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ ဘာကြောင့် ဆောက်လဲ၊ ဘာ ဆောက်မလဲ၊ ဘာ မဆောက်ဘူးလဲ၊ ဘယ်လို စစ်မလဲ ဆိုတာကို spec တစ်စောင်ထဲ
      စုရေးခဲ့ပါတယ်။ ဒါပေမဲ့ spec ရှိရုံနဲ့ မလုံလောက်သေးပါဘူး။ agent တွေ ဘယ်လို အလုပ်လုပ်လဲ ကြည့်ခဲ့တုန်းက၊ agent
      နဲ့ အလုပ် တစ်ခါ စလုပ်တဲ့ session အသစ် တိုင်းမှာ agent က စားပွဲ အလွတ်နဲ့ ပြန်စတယ် ဆိုတာ မြင်ခဲ့ပါတယ်။ ဒါဆို
      ဒီ project က ဘာလဲ၊ ဘာနဲ့ ဆောက်ရမလဲ၊ ဘယ် rule ကို ဘယ်တော့မှ မချိုးရဘူးလဲ ဆိုတာတွေ စားပွဲပေါ်ကို ဘယ်လို
      ရောက်လာမလဲ။ [[mark:context]] AI နဲ့ အလုပ်လုပ်တဲ့အခါ စကားလုံး ကောင်းကောင်း ရွေးပြီး ခိုင်းတာထက်၊ agent
      ရှေ့မှာ ဘာ အချက်အလက်တွေ ရှိနေလဲ ဆိုတာက ရလဒ်ကို ပိုဆုံးဖြတ်ပါတယ်။ agent ကို မှန်တဲ့ အချက်အလက်တွေ မှန်တဲ့
      နေရာမှာ ပေးတဲ့ အလုပ်ကို context engineering လို့ ခေါ်ပါတယ်။ context ဆိုတာ agent ရဲ့ စားပွဲပေါ်မှာ ရှိနေတဲ့
      စာတွေ အားလုံးပါ။ [[mark:sel-title]] ဒီနေ့ AGENTS.md ဆိုတဲ့ ဖိုင် တစ်ခုကို ရေးပါမယ်။ အခုတော့ ခေါင်းစဉ်ပဲ
      ရှိပါသေးတယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): Context engineering",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "Anthropic: Effective context engineering for AI agents",
          url: "https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents",
        }
      - {
