      docs/spec.md: |
        # Spec · ကြိုမှာ app (v1)

        ## Goal
        မနက်ပိုင်း customer တွေ တန်းမစီရဘဲ ကြိုမှာပြီး လာယူနိုင်ဖို့ (problem.md)။

        ## Users
        customer (အောင်အောင်၊ မောင်မောင်)၊ ကောင်တာ (လှလှ)၊ ဆိုင်ပိုင်ရှင် (မြမြ)

        ## Rules
        - ဈေးနှုန်း — ကျပ် ကိန်းပြည့်၊ ဒသမ မပါ။
        - အရေအတွက် — 1 ကနေ 20 အထိ။
        - လာယူချိန် — ဒီနေ့၊ ဆိုင်ဖွင့်ချိန်အတွင်း၊ အနည်းဆုံး 15 မိနစ် ကြိုမှာရမယ်။
        - အော်ဒါနံပါတ် — နေ့တိုင်း #101 ကနေ စမယ်။
        - ငွေ — ကောင်တာမှာ ချေမယ်။

        ## Example
        အောင်အောင် — လက်ဖက်ရည် 2 ခွက်၊ 8:30 မှာ လာယူမယ် → အော်ဒါ #101၊ 3,000 ကျပ်

        ## Out of scope
        requirements.md ရဲ့ Won't (for now) — delivery၊ online ငွေပေးချေမှု၊ login

        ## Acceptance criteria
        AC-1 Given လက်ဖက်ရည် 2၊ 8:30၊ နာမည်နဲ့ ဖုန်း ထည့်ထားတယ်
             When မှာမယ် ကို နှိပ်တယ်
             Then အော်ဒါနံပါတ်၊ စုစုပေါင်း 3,000 ကျပ်နဲ့ 8:30 ကို မြင်ရမယ်
        AC-2 Given အရေအတွက် 0
             When မှာမယ် ကို နှိပ်တယ်
             Then အော်ဒါ မဖြစ်ဘဲ "1 ကနေ 20 အထိ ရွေးပါ" လို့ ပြမယ်
        AC-3 Given လာယူချိန်က ဆိုင်ပိတ်ချိန်ထဲမှာ
             When မှာမယ် ကို နှိပ်တယ်
             Then အော်ဒါ မဖြစ်ဘဲ ဆိုင်ဖွင့်ချိန်ကို ပြမယ်
        AC-4 Given ဖုန်းနံပါတ် မထည့်ရသေးဘူး
             When မှာမယ် ကို နှိပ်တယ်
             Then အော်ဒါ မဖြစ်ဘဲ ဖုန်းနံပါတ် ထည့်ခိုင်းမယ်
        AC-5 Given အော်ဒါ အသစ် ဝင်လာတယ်
             When လှလှ က ကောင်တာစာရင်းကို ကြည့်တယ်
             Then အော်ဒါကို လာယူချိန်အလိုက် စီပြီး မြင်ရမယ်

        ## Definition of done
        - သက်ဆိုင်တဲ့ AC တွေ ဖုန်း screen ပေါ်မှာ စစ်ပြီး pass ဖြစ်ရမယ်။
        - code ထဲမှာ secret မပါရဘူး။
        - spec.md နဲ့ decisions.md ကို update လုပ်ပြီးပြီ။

        ## Open questions
        requirements.md ရဲ့ Questions for မြမြ ကို ကြည့်ပါ။
