  - id: agent-blast-radius
    chapter: "Agent ရဲ့ blast radius"
    narration: >
      [[mark:close-p05b]] [[mark:b3-step1]] Ask Padauk က chat ဖတ်၊ transaction ရှာပြီး ticket ဖွင့်ပါတယ်။ [[mark:b3-step1b]] ရှာတဲ့ အဆင့်မှာ transaction နှစ်ခုရဲ့ ID ကို ရောမိတော့ နောက်အဆင့်တွေက မစစ်ဘဲ ယုံလိုက်လို့ အမှားက အဆုံးထိ ပါသွားတာပါ။
      [[mark:b3-step2]] ဒါကြောင့် agent မှားရင် ထိခိုက်မယ့် နယ်ပယ်၊ blast radius ကို ကျဉ်းအောင် လုပ်ပါတယ်။ [[mark:b3-step2b]] ID က ဒီ customer ရဲ့ transaction ဟုတ်လား၊ ငွေပမာဏ ကိုက်လား ဆိုတာကို ရိုးရိုး code နဲ့ validate လုပ်ပြီး agent ကို ticket ဖွင့်ခွင့်ပဲ ပေးထားလို့ ငွေကို လူက အတည်ပြုမှ ပြန်အမ်းပါတယ်။
      [[mark:b3-step3]] tool call တိုင်းကို input၊ output နဲ့ log မှာ မှတ်ပြီး prompt နဲ့ အဖြေတွေကို personal data ဖယ်ပြီးမှ သိမ်းလို့ ဘယ်အဆင့်က စမှားလဲ ပြန်ရှာလို့ ရပါတယ်။
      [[mark:close-b3]] [[mark:p05c]] agent လုပ်ခွင့်ရှိတဲ့ အဆင့် အရေအတွက်ကို step budget အဖြစ် ကန့်သတ်ပြီး ကျော်ရင် လူဆီ လွှဲရပါမယ်။ ယုံလို့မရတဲ့ chat ဖတ်ခွင့်၊ wallet data မြင်ခွင့်နဲ့ message လွတ်လွတ် ပို့ခွင့် သုံးခုကိုလည်း agent တစ်ခုတည်းမှာ အတူ မပေးပါနဲ့။ ဒါကြောင့် SMS tool က verify လုပ်ထားတဲ့ customer နံပါတ်ကိုပဲ ပို့နိုင်အောင် prompt နဲ့ မဟုတ်ဘဲ ရိုးရိုး code နဲ့ ကန့်သတ်ထားပါတယ်။
      [[mark:p05d]] ဘာလို့ prompt နဲ့ မထိန်းတာလဲ? model ရဲ့ စည်းမျဉ်းနဲ့ user စာက လမ်းကြောင်း တစ်ခုတည်းကနေ ဝင်လာလို့ စာထဲမှာ ညွှန်ကြားချက် ဝှက်ထည့်ပြီး model ကို မလုပ်သင့်တာ လုပ်ခိုင်းနိုင်ပါတယ်၊ ဒါက prompt injection ပါ။ ဒါကြောင့် အဝင်ရော အထွက်ရော စစ်ရပြီး download လုပ်တဲ့ model နဲ့ dataset တွေကလည်း dependency တွေမို့ library တွေလိုပဲ သတိထားရပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "The ML Test Score (research.google)",
