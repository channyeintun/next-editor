  - id: launching
    chapter: "AI feature ကို launch လုပ်ပုံ"
    narration: >
      [[mark:p06]] ပြင်ပြီးတော့ Ask Padauk ကို အဆင့်လိုက် ပြန် launch လုပ်ပါတယ်။ အရင်ဆုံး complaint အစစ် ၅၀ နဲ့ eval လုပ်တယ်၊ အရည်အသွေးပါ စစ်တဲ့ load test လုပ်တယ်၊ model ဟောင်းဆီ ပြန်သွားတဲ့ rollback နဲ့ ချက်ချင်း ပိတ်တဲ့ ခလုတ်ကို စမ်းထားပြီးမှ chat ၅ ရာခိုင်နှုန်းနဲ့ စပါတယ်။
      complaint တွေနဲ့ နေ့တိုင်း အဖြေ ၂ ရာခိုင်နှုန်း စစ်တဲ့ ရလဒ်တွေကို နောက်တစ်ခေါက် ပြင်ဖို့ ပြန်သုံးပါတယ်။ prototype က ရက်ပိုင်းပဲ ကြာပေမဲ့ production ကတော့ အများကြီး ပိုကြာပါတယ်။
    sources:
