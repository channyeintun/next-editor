    files:
      notes.md: |
        # AI feature တွေရဲ့ reliability

        - inference — train ပြီးသား model နဲ့ request တစ်ခုချင်းကို ဖြေတာ
        - token — model ဖတ်တဲ့ စာသား အပိုင်းလေး၊ ကုန်ကျငွေလည်း ဒီကလာ
        - eval — AI အဖြေကို စနစ်တကျ စစ်တာ၊ ရမှတ်က SLI
        - golden set — အဖြေ မှန်ကို ကြိုသိထားတဲ့ မေးခွန်းတွေ
        - degraded answer — error မဟုတ်ပေမဲ့ အားနည်းတဲ့ အဖြေ၊ SLO ထဲမှာ ရေတွက်
        - prompt injection — model ဖတ်မယ့် စာထဲ ဝှက်ထည့်တဲ့ ညွှန်ကြားချက်

        မေးခွန်း: AI feature က request တိုင်း 200 ပြန်ပေးတယ်။ အဖြေ မှားတာကို ဖမ်းမယ့် SLI တစ်ခု ပြောပါ။
