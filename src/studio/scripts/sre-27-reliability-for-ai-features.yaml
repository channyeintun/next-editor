build:
  # Studio swaps in the Burmese voice chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 2627

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: hook
    chapter: "မှားတဲ့ refund ticket တွေ"
    narration: >
      [[mark:p01]] Padauk ရဲ့ coding agent တွေက အခု instruction file နဲ့ fee spec ကို ဖတ်ပြီး ပြောင်းလဲမှုတိုင်းမှာ change record ချန်ပါတယ်။ ဒီတစ်ခါတော့ chat ကို မြန်မာလို ဖြေပြီး refund ticket ဖွင့်ပေးနိုင်တဲ့ AI support assistant၊ Ask Padauk ကို launch လုပ်ပါတယ်။
      [[mark:p01-http]] HTTP မှာ chat တွေရဲ့ ၉၉.၉ ရာခိုင်နှုန်းက အောင်မြင်တယ်လို့ ပြန်လာပါတယ်။ ဒါပေမဲ့ customer မေးတဲ့ transaction အစား တခြား transaction အတွက် refund ticket ဖွင့်ထားတာကို မစုရဲ့ support အဖွဲ့က တွေ့လာပါတယ်။ success code ပြန်လာရုံနဲ့ ဘယ်တော့ မလုံလောက်တော့လဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Rules of Machine Learning (Google for Developers)",
          url: "https://developers.google.com/machine-learning/guides/rules-of-ml",
        }
      - {
          title: "The ML Test Score (research.google)",
          url: "https://research.google/pubs/the-ml-test-score-a-rubric-for-ml-production-readiness-and-technical-debt-reduction/",
        }
    actions:
      # -1750 / -1450, not the skeleton's -1900 / -1600: a pull-back over 1780 ms pushes the
      # first dialog past the 2 s opening handle, which src/studio/plans/index.test.ts rejects.
      # p01-http (no action) splits the 496-character hook at its paragraph break, under
      # the 450-character dialog limit; the cover holds both paragraphs (~37 s at 70 ms/char).
      - { id: collapse-dock, type: runtime.collapseDock, at: { scene: start, offsetMs: -1750 } }
      - { id: show-p01, type: slide.show, at: { mark: p01, offsetMs: -1450 }, slideId: l27_p01 }

  - id: ai-is-a-service
    chapter: "AI လည်း service တစ်ခုပါပဲ"
    narration: >
      [[mark:p02]] AI feature မို့ reliability ကို အစကနေ ပြန်သင်ရမလား ဆိုတော့ မလိုပါဘူး။ Ask Padauk လည်း service ပဲမို့ service level objective ခေါ် SLO ပစ်မှတ်၊ capacity၊ ဘေးကင်းတဲ့ change တွေ အရင်အတိုင်း လိုပါတယ်။ အသစ်က နှစ်ခုပဲ ရှိပါတယ်၊ အဖြေက error မပြဘဲ မှားနိုင်တာနဲ့ request တိုင်းမှာ token ကုန်တာပါ။
      [[mark:p02b]] model ကို data နဲ့ သင်ပေးတာက training ဖြစ်ပြီး train ပြီးသား model နဲ့ request တစ်ခုချင်းကို ဖြေတာက inference ပါ။ token က model ခွဲဖတ်တဲ့ စာသား အပိုင်းလေးတွေ ဖြစ်ပြီး တစ်ခါတည်း ဖတ်နိုင်တဲ့ အများဆုံး ပမာဏကို context window လို့ ခေါ်ပါတယ်။ transaction ရှာတာ၊ ticket ဖွင့်တာလို tool တွေကို အဆင့်လိုက် ခေါ်သုံးတဲ့ model က agent ဖြစ်ပြီး tool တစ်ခါ ခေါ်တာက tool call ပါ။
      [[mark:p02c]] model ကို provider ဆီက ငှားသုံးရင် အလေ့အထ လေးခု ရှိပါတယ်။ prompt နဲ့ limit သတ်မှတ်တဲ့ အပိုင်းကို user ကို ဖြေတဲ့ အပိုင်းနဲ့ ခွဲထားပြီး quota ကို ရှားပါးတဲ့ resource လို သုံးပါ။ AI အပိုင်းကိုပါ observe လုပ်ပြီး prompt နဲ့ model ကို rollback လုပ်လို့ရအောင် version တပ်ပါ။ ဈေးပေါတဲ့ model ဆီ traffic လွှဲတဲ့ model router ကလည်း reliability ခလုတ် တစ်ခုပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Hidden Technical Debt in Machine Learning Systems (NeurIPS 2015)",
          url: "https://papers.nips.cc/paper_files/paper/2015/hash/86df7dcfd896fcaf2674f757a2463eba-Abstract.html",
        }
      - {
          title: "MLOps: Continuous delivery and automation pipelines in ML (Google Cloud)",
          url: "https://docs.cloud.google.com/architecture/mlops-continuous-delivery-and-automation-pipelines-in-machine-learning",
        }
    actions:
      - { id: show-p02, type: slide.show, at: { mark: p02 }, slideId: l27_p02 }
      - { id: show-p02b, type: slide.show, at: { mark: p02b }, slideId: l27_p02b }
      - { id: show-p02c, type: slide.show, at: { mark: p02c }, slideId: l27_p02c }

  - id: answer-spectrum
    chapter: "အလယ်က အဖြေတွေ"
    narration: >
      [[mark:close-p02c]] [[mark:b1-step1]] လစာထုတ်ရက် ညနေမှာ provider ရဲ့ rate limit ကို ထိတော့ model router က အခမဲ့ user တွေရဲ့ chat ကို fallback အဖြစ် ဈေးပေါတဲ့ model ဆီ လွှဲပါတယ်။ အဖြေတွေကို bar တစ်ခုပေါ် စီကြည့်ရင် ဘယ်ဘက်အစွန်မှာ server error တွေ ရှိပါတယ်၊ အဲဒီညက error မတက်လာလို့ dashboard က အစိမ်းရောင်ပါပဲ။
      [[mark:b1-step2]] အလယ်မှာတော့ HTTP က အောင်မြင်တယ်လို့ ပြပေမဲ့ အားနည်းတဲ့ fallback အဖြေတွေ ရှိပြီး ညာဘက်အစွန်မှာ ကောင်းတဲ့ အဖြေတွေ ရှိပါတယ်။ ဈေးပေါတဲ့ model ရဲ့ အဖြေ ဝေဝါးလို့ user တွေ စကားလုံး ပြောင်းပြီး ထပ်မေးနေတာကို မစု သတိထားမိပါတယ်။
      [[mark:b1-step3]] lesson ၇ မှာ ကြိုပြောခဲ့သလို AI မှာ အောင်မြင်တာနဲ့ ပျက်တာ နှစ်မျိုးတည်း မရှိတော့ပါဘူး။ HTTP က ဘယ်ဘက်အစွန်ကိုပဲ မြင်ပေမဲ့ user ကတော့ bar တစ်ခုလုံးကို ခံစားရပါတယ်။ error မဟုတ်ပေမဲ့ အားနည်းတဲ့ အဖြေကို degraded answer လို့ ခေါ်ပြီး SLO ထဲမှာ ရေတွက်ရပါတယ်။
      [[mark:b1-step4]] မသီရိက fallback အဖြေတိုင်းကို degraded လို့ မှတ်ပြီး အဖြေ ၂ ရာခိုင်နှုန်းကို နေ့တိုင်း အမှတ်ပေး စစ်ခိုင်းပါတယ်။ ဒီတော့မှ လစာထုတ်ရက် ညနေမှာ Ask Padauk က available ဖြစ်နေပေမဲ့ အဖြေ ၃၀ ရာခိုင်နှုန်းက degraded ဖြစ်နေတာ ပေါ်လာပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Rules of Machine Learning (Google for Developers)",
          url: "https://developers.google.com/machine-learning/guides/rules-of-ml",
        }
      - {
          title: "The ML Test Score (research.google)",
          url: "https://research.google/pubs/the-ml-test-score-a-rubric-for-ml-production-readiness-and-technical-debt-reduction/",
        }
    actions:
      - { id: close-p02c, type: slide.close, at: { mark: close-p02c, offsetMs: -400 } }
      - id: b1-step1
        type: whiteboard.apply
        at: { mark: b1-step1 }
        open: true
        clear: true
        upsertIds: [l27-b1-axis, l27-b1-red, l27-b1-error]
        drawMs: 1400
      - id: b1-step2
        type: whiteboard.apply
        at: { mark: b1-step2 }
        upsertIds: [l27-b1-orange, l27-b1-weak-1, l27-b1-weak-2, l27-b1-green, l27-b1-good]
        drawMs: 2200
      - id: b1-step3
        type: whiteboard.apply
        at: { mark: b1-step3 }
        upsertIds: [l27-b1-http, l27-b1-whole, l27-b1-users]
        drawMs: 1800
      - id: b1-step4
        type: whiteboard.apply
        at: { mark: b1-step4 }
        upsertIds: [l27-b1-flag, l27-b1-truth]
        drawMs: 1600

  - id: ask-padauk-slis
    chapter: "Ask Padauk ရဲ့ SLI တွေ"
    narration: >
      [[mark:close-b1]] [[mark:p03]] ဒါဆို refund အမှားကို ဘယ် ကိန်းဂဏန်းက ဖမ်းမလဲ? မသီရိက user ကြုံရတာကို တိုင်းတဲ့ service level indicator၊ SLI တွေကို ဒုက္ခ တစ်ခုချင်းကနေ ဆွဲထုတ်ပါတယ်။ refund မှားတာအတွက် transaction မှန်မှန် ရွေးတဲ့ ရာခိုင်နှုန်း၊ အဖြေ အသုံးမဝင်တာအတွက် ၅ မိနစ်အတွင်း ထပ်မမေးရတဲ့ chat ရာခိုင်နှုန်း၊ စောင့်ရတာအတွက် ပထမ စာလုံး ပေါ်တဲ့အထိ ကြာချိန်၊ time to first token ၂ စက္ကန့်အတွင်း ဆိုတာတွေပါ။ fallback အဖြေကိုတော့ degraded လို့ ရေတွက်ပါတယ်။
      [[mark:p03b]] prompt အသစ်ကို user မမြင်ခင်ရော ဘယ်လို စစ်မလဲ? အဖြေ မှန်ကို ကြိုသိထားတဲ့ မေးခွန်း စုစည်းမှု၊ golden set နဲ့ AI အဖြေကို စနစ်တကျ စစ်တာကို eval လို့ ခေါ်ပါတယ်။ Padauk က တကယ့် complaint ၅၀ နဲ့ golden set လုပ်ပြီး eval ရမှတ်ကို SLI၊ အောင်မျဉ်းကို SLO အဖြစ် ထားပါတယ်။ အဖြေတွေက စကားလုံး ကွဲတတ်လို့ စာလုံးချင်း တိုက်မစစ်ဘဲ ID၊ ငွေပမာဏနဲ့ format ကိုပဲ စစ်ပါတယ်။
      [[mark:p03c]] agent ရဲ့ SLI အနေနဲ့ tool call အောင်မြင်တာ၊ ID validation ဖြတ်တာ၊ ticket format မှန်တာကိုလည်း တိုင်းပါတယ်။ မနှင်းနဲ့ မသီရိက refund မှန်မှန် ရဖို့ ဆိုတဲ့ product ပန်းတိုင်ကို အရင် သဘောတူပါတယ်။ ပထမ SLO ကို မီနိုင်တဲ့ ဂဏန်းမှာ ထားပြီး နောက်မှ မြှင့်မှာပါ၊ degraded အဖြေတွေကလည်း အဲဒီ SLO ရဲ့ error budget ကို သုံးပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "The ML Test Score (research.google)",
          url: "https://research.google/pubs/the-ml-test-score-a-rubric-for-ml-production-readiness-and-technical-debt-reduction/",
        }
      - {
          title: "Rules of Machine Learning (Google for Developers)",
          url: "https://developers.google.com/machine-learning/guides/rules-of-ml",
        }
    actions:
      - {
          id: close-b1,
          type: whiteboard.apply,
          at: { mark: close-b1, offsetMs: -400 },
          open: false,
        }
      - { id: show-p03, type: slide.show, at: { mark: p03 }, slideId: l27_p03 }
      - { id: show-p03b, type: slide.show, at: { mark: p03b }, slideId: l27_p03b }
      - { id: show-p03c, type: slide.show, at: { mark: p03c }, slideId: l27_p03c }

  - id: capacity-is-cost
    chapter: "Capacity ကို ကျပ်နဲ့ တွက်"
    narration: >
      [[mark:p04]] capacity စီစဉ်ပုံလည်း ပြောင်းပါတယ်။ Ask Padauk ရဲ့ request တွေက top-up ထက် အများကြီး နည်းပေမဲ့ တစ်ခုချင်းက ဈေးကြီးပြီး chat ရှည်လေ token ကုန်လေမို့ ကုန်ကျငွေလည်း မညီပါဘူး။ ဒါကြောင့် request တစ်ခုရဲ့ ကုန်ကျငွေကို request အရေအတွက်နဲ့ မြှောက်ပြီး capacity ကို ကျပ်နဲ့ စီစဉ်ပါတယ်။ request နည်းရင် ဂရုမစိုက်တဲ့ alert၊ ကုန်ကျငွေ တူတယ်လို့ ယူဆတဲ့ alert တွေကလည်း ပြဿနာကို ဖုံးထားတတ်ပါတယ်။
      [[mark:p04b]] Padauk က request တိုင်းရဲ့ token၊ latency နဲ့ ကုန်ကျငွေကို မှတ်ထားပါတယ်။ အရန် quota ကလည်း မသုံးရင်တောင် ပိုက်ဆံ ကုန်ပါတယ်။ load test မှာလည်း အဖြေ အရည်အသွေးကိုပါ စစ်ပါတယ်။ feature အသစ်ကို chat ၅ ရာခိုင်နှုန်းမှာ အရင် တိုင်းပြီး launch မလုပ်ခင် bill ကို ချဲ့တွက်ပါတယ်၊ provider ပြောင်းဖို့ ခလုတ် တစ်ခုလည်း ထားပါတယ်။ ကိုယ်ပိုင် model train ဖို့ GPU စီမံတာကိုတော့ ဒီသင်တန်းမှာ ချန်ထားပါမယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Best practices for autoscaling LLM inference on GKE (Google Cloud)",
          url: "https://docs.cloud.google.com/kubernetes-engine/docs/best-practices/machine-learning/inference/autoscaling",
        }
      - {
          title: "Rules of Machine Learning (Google for Developers)",
          url: "https://developers.google.com/machine-learning/guides/rules-of-ml",
        }
    actions:
      - { id: show-p04, type: slide.show, at: { mark: p04 }, slideId: l27_p04 }
      - { id: show-p04b, type: slide.show, at: { mark: p04b }, slideId: l27_p04b }

  - id: bad-data-stops
    chapter: "Data မကောင်းရင် ရပ်"
    narration: >
      [[mark:close-p04b]] [[mark:b2-step1]] model ရဲ့ ဆုံးဖြတ်ချက်ကို code ထက် train ခဲ့တဲ့ data က ပိုသတ်မှတ်ပါတယ်။ လိမ်လည်တဲ့ ငွေချေမှုကို ရှာပေးတဲ့ Padauk ရဲ့ fraud model က transactions table ကနေ ညတိုင်း train ပါတယ်။ [[mark:b2-step1b]] သင်္ကြန် မတိုင်ခင် log ပြောင်းတဲ့ change တစ်ခုကြောင့် column တစ်ခု ဗလာ ဖြစ်သွားပေမဲ့ training မစခင် data အသစ်လား၊ row လုံလောက်လား၊ ဗလာ column ရှိလား စစ်တဲ့ check ရှိပါတယ်။
      [[mark:b2-step2]] ပုံမှန်ဆိုရင် check အောင်မှ train ပြီး model အသစ်က eval gate ကို ဖြတ်မှ user တွေအတွက် model ကို run ထားတဲ့ serving ဆီ ရောက်ပါတယ်။ ဗလာ column နဲ့ train မိရင်တော့ model က ယုံယုံကြည်ကြည်နဲ့ မှားမှာပါ။
      [[mark:b2-step3]] ဒီတစ်ခါ check က training ကို ရပ်လို့ model ဟောင်းက ဆက်အလုပ်လုပ်ပြီး on-call ဆီ alert ရောက်ပါတယ်။ check တွေကို ဈေးပေါတာကနေ ဈေးကြီးတာအထိ အလွှာလိုက် ထားပါတယ်။ data အသစ်လား အမြဲ စစ်ပြီး fraud score တွေ တကယ့် လိမ်လည်မှုနဲ့ ကွာလာလား စောင့်ကြည့်ပါတယ်၊ လူ ဒါမှမဟုတ် ဒုတိယ model က နမူနာ ပြန်စစ်တာကိုတော့ ရံဖန်ရံခါပဲ လုပ်ပါတယ်။
      [[mark:b2-step4]] ရပ်တာ မှန်ပေမဲ့ ဟောင်းနေတဲ့ model လည်း outage တစ်မျိုးမို့ သင်္ကြန် မနက်မှာ eval အောင်ထားတဲ့ model အသစ် ရှိရမယ် ဆိုတဲ့ freshness SLO ထားပါတယ်။ training က ညတိုင်း သူ့ဘာသာ run နေပြီ ဆိုရင် production မို့ မသီရိရဲ့ အဖွဲ့က တာဝန်ယူပြီး စမ်းသပ်နေတုန်းမှာတော့ အကြံပဲ ပေးပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "MLOps: Continuous delivery and automation pipelines in ML (Google Cloud)",
