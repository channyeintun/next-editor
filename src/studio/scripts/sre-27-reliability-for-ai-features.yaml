      # The voice script's ⟪select မေးခွန်း⟫ and ⟪pause 3s⟫, the way the Module 1
      # reviewers fixed the pause. ⟪select မေးခွန်း⟫ (ask-question) already starts
      # the question's own dialog, but a select right there would drag under the
      # question and leave no pause, and one at pause-question would drag under
      # the answer's first words (the scheduler holds only the dialog after its
      # anchor's). So the question-line select hangs off ask-question with an
      # offset: it starts about as the question ends, its drag runs in silence,
      # and the answer at pause-question waits for it. The question is
      # 94 characters, so 6850 starts the drag about as the question ends at 70 ms
      # per char and leaves about 2.8 / 1.4 / 0.4 s of quiet before the answer at
      # 55 / 70 / 95; an offset above ~6930 trips compile-check's 2.5 s
      # inserted-silence warning at 55.
      - id: select-question
        type: editor.select
        at: { mark: ask-question, offsetMs: 6850 }
        target:
          file: notes.md
          text: "မေးခွန်း: AI feature က request တိုင်း 200 ပြန်ပေးတယ်။ အဖြေ မှားတာကို ဖမ်းမယ့် SLI တစ်ခု ပြောပါ။"
          occurrence: 1

