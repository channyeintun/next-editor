  - id: what-is-a-change
    chapter: "ဘာတွေက change လဲ"
    narration: >
      [[mark:close-b2]] [[mark:p05]] log ပြောင်းတာလေးတောင် model ကို ထိခဲ့ပါတယ်။ AI feature မှာ model အသစ်၊ provider က တိတ်တိတ် update လုပ်တာ၊ prompt စာကြောင်း တစ်ကြောင်း၊ template နဲ့ setting ပြင်တာတွေက code မပြောင်းဘဲ အပြုအမူကို ပြောင်းလို့ change တွေပါပဲ။ ဒါကြောင့် အားလုံးကို eval နဲ့ အရင် စစ်ပြီးမှ chat အနည်းငယ်ဆီ ပို့ကြည့်တဲ့ canary နဲ့ ထုတ်ပါတယ်။
      [[mark:p05b]] canary မှာ အဖြေ နှေးလာတာရော ညံ့လာတာရော rollout ကို ရပ်စေပါတယ်။ lesson ၇ က Hyrum's law လိုပဲ ကတိ မပေးခဲ့တဲ့ ticket ပုံစံကိုတောင် support tool က အားကိုးနေနိုင်လို့ ပျမ်းမျှ ရမှတ် တက်ရုံနဲ့ မလုံလောက်ဘဲ workflow တစ်ခုလုံးကို စမ်းရပါတယ်။ ဒီ guardrail တွေက ပြဿနာကို စောစော မိစေလို့ Padauk က ပိုမြန်မြန် ထုတ်နိုင်လာပါတယ်။
    sources:
