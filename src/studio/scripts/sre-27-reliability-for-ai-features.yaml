# SRE from zero, lesson 27: Reliability for AI features (Burmese concept lesson).
#
# Built from the approved voice script
# docs/sre-course/voice-scripts/sre-27-reliability-for-ai-features.md. Every
# spoken character is that script's "> " lines, unchanged; each ⟪…⟫ marker
# became a [[mark:…]] at the same place. Check it with:
#   bun ~/Documents/sre-course/work/check-narration.ts \
#     docs/sre-course/voice-scripts/sre-27-reliability-for-ai-features.md \
#     src/studio/scripts/sre-27-reliability-for-ai-features.yaml
#
# Nothing runs: deck pages and the whiteboard carry the lesson, and notes.md is
# the recap. The workspace and runtime follow the validated no-code skeleton
# (WebContainer, empty init command, a harmless dev script).
#
# Five marks add no spoken text and sit at an existing ။: p01-http splits the
# hook at its paragraph break (one 496-character dialog would pass the
# 450-character limit; no action uses it); b2-step1b, b3-step1b and b3-step2b
# land a board's caveat, wrong-ID tag or guards on the sentence that names
# them, so no step adds more than three labelled elements; and ask-question is
# the voice script's ⟪select မေးခွန်း⟫, which already starts the question's
# own dialog, so the question-line select hangs off it for the ⟪pause 3s⟫, as
# in Module 1. Pacing: every page and board step changes within ~37 s at
# 70 ms/char (the cover is the longest hold), so no pacing pages were added.
#
# Boards (B1 P5 segmented bar, B2 P1 flow, B3 P6 lanes). Colour jobs: #1e1e1e
# ink (paints white) for the axis, step boxes and box labels; blue the thing
# named (data, the degraded flag, the freshness SLO, logging); green healthy or
# done (good answers, serving, the guards); red failure (errors, the halt, the
# wrong ID); orange the caveat or limit (weak answers, the data check); violet
# the flow and the result (arrows, what users feel). A label on two lines is
# one text asset per line, so each line meets the 0.55 em width rule on its
# own. Every new board opens with open: true, clear: true and is never
# maximized; a board followed by a deck page closes the panel (open: false)
# 400 ms before the page, and a page followed by a board closes the page
# 400 ms before the board, as in Module 1.
#
# Deck pages: deck "Next Editor · SRE 6A · AI", published; the /pub URL below
# is final. The deck holds only the kit pages until this lesson's pages are
# built from the page plan, so until then the Director reports page "l27_p01"
# missing from the published deck (with the deck URL swapped for an
# unreachable one, everything else validates). Page plan:
# ~/Documents/sre-course/work/pages/sre-27-reliability-for-ai-features.json
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/sre-27-reliability-for-ai-features.yaml
#   bun scripts/studio-compile-check.ts src/studio/scripts/sre-27-reliability-for-ai-features.yaml
