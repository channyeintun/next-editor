  - id: recap
    narration: >
      [[mark:close-p07]] [[mark:notes]] Ask Padauk ကနေ ရလာတဲ့ ဝေါဟာရတွေပါ။ [[mark:sel-inference]] inference က train ပြီးသား model နဲ့ request တစ်ခုချင်းကို ဖြေတာ ဖြစ်ပြီး၊ [[mark:sel-token]] token က model ဖတ်တဲ့ စာသား အပိုင်းလေးပါ၊ ကုန်ကျငွေလည်း ဒီကလာပါတယ်။ [[mark:sel-eval]] eval က AI အဖြေကို စနစ်တကျ စစ်တာ ဖြစ်ပြီး ရမှတ်က SLI ပါ။ [[mark:sel-golden-set]] golden set က အဖြေ မှန်ကို ကြိုသိထားတဲ့ မေးခွန်းတွေပါ။
      [[mark:sel-degraded]] degraded answer က error မဟုတ်ပေမဲ့ SLO ထဲမှာ ရေတွက်ရတဲ့ အားနည်းတဲ့ အဖြေ ဖြစ်ပြီး၊ [[mark:sel-injection]] prompt injection က model ဖတ်မယ့် စာထဲ ညွှန်ကြားချက် ဝှက်ထည့်တာပါ။ [[mark:ask-question]] AI feature က request တိုင်းကို အောင်မြင်တယ်လို့ ပြန်ပေးနေရင် အဖြေ မှားတာကို ဘယ် SLI က ဖမ်းမလဲ?
      [[mark:pause-question]] ဥပမာ transaction မှန်မှန် ရွေးတဲ့ ရာခိုင်နှုန်း၊ ဒါမှမဟုတ် ၅ မိနစ်အတွင်း ထပ်မမေးရတဲ့ chat ရာခိုင်နှုန်းပါ။ အခု ဘက်ပြောင်းကြည့်ရအောင်၊ Padauk ရဲ့ internal AI operations agent၊ Ops Buddy က production ဝင်ခွင့် တောင်းလာပါတယ်။ AI agent တစ်ခုကို ဘေးကင်းကင်း ဘယ်လို ဝင်ခွင့်ပေးမလဲ?
    sources:
