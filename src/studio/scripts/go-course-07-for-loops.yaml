# Go course, lesson 07: for loops (Burmese).
#
# Start state: main.go with `package main`, `import "fmt"` and an empty `func main`.
# Edits, all insert-only:
#   1. `for day := range 3` printing day -> run-1: 0 / 1 / 2;
#   2. daily and saved above the loop, `saved += daily` inside it, `+1, saved` into the Println
#      -> run-2: 1 5000 / 2 10000 / 3 15000;
#   3. below the loop: goal, days, `saved = 0`, a condition loop `for saved < goal` and a Println
#      of the days and the money; then `if days%7 == 0 { continue }` after `days++`
#      -> run-3 adds 69 ရက် 300000 ကျပ်.
# Boards: (L) a loop is a running track, the round number starts at 0; (G) the condition is a
# gate, continue goes back to it, break leaves; (F) the forms of for; (Q) quiz (break instead
# of continue).
# Fixtures: bun ~/Documents/go-course-work/tools/sim-go.ts <this yaml> --write
