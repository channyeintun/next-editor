scenes:
  - id: open
    chapter: "Assert နဲ့ expect"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ expect နဲ့ matcher တွေကို ကိုယ် မေးချင်တဲ့ မေးခွန်း အလိုက်
      ရွေးသုံးတာ ကြည့်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ assertion ရေးတဲ့ နောက်ပုံစံ တစ်မျိုး ဖြစ်တဲ့ assert ကို
      ကြည့်ပြီး၊ ဂဏန်းနဲ့ error တွေကို စစ်တဲ့အခါ ကြုံရတတ်တဲ့ ထောင်ချောက် သုံးခုကို ဖြေရှင်းကြည့်ပါမယ်။
      [[mark:draw-assert]] Vitest ထဲမှာ expect အပြင် Chai ဆိုတဲ့ library ရဲ့ assert ကိုလည်း ထည့်ပေးထားပါတယ်။
      assert ပုံစံမှာ စစ်ချက် တစ်ခုချင်းစီက function တစ်ခုစီ ဖြစ်ပြီး၊ ရလာတဲ့ တန်ဖိုးနဲ့ ဖြစ်ရမယ့်
      တန်ဖိုးကို argument အဖြစ် ပေးရပါတယ်။ strict Equal က တစ်ထပ်တည်း တူလား၊ deep Equal က အထဲက
      တန်ဖိုးတွေ တူလား စစ်ပြီး၊ ok ကတော့ if နဲ့ စစ်ရင် မှန်တယ်လို့ ယူဆမယ့် တန်ဖိုး ဟုတ်လား စစ်ပါတယ်။
      နောက်ဆုံး argument မှာ ကျရင် ပြမယ့် message ကိုလည်း ထည့်လို့ ရပါတယ်။ [[mark:draw-expect]]
      အောက်က expect ပုံစံကတော့ ပြီးခဲ့တဲ့ lesson တွေမှာ သုံးခဲ့တဲ့ ပုံစံပါ။ စစ်ချက် သုံးခုလုံး အတူတူပဲ
      ဖြစ်ပြီး၊ matcher နဲ့ ရေးတာပဲ ကွာပါတယ်။ expect မှာလည်း ဒုတိယ argument အနေနဲ့ message ထည့်လို့
      ရပါတယ်။ [[mark:truthy]] to Be Truthy လိုပဲ null လား စစ်တဲ့ to Be Null နဲ့ undefined လား စစ်တဲ့ to
      Be Undefined ဆိုတာတွေလည်း ရှိပါတယ်။ သုညနဲ့ စာသား အလွတ်ကလည်း if မှာ မှားတယ်လို့ ယူဆတဲ့အတွက်၊ ကိုယ်
      ဆိုလိုတာနဲ့ အကိုက်ဆုံး matcher ကို ရွေးပါ။ [[mark:pick-one]] ပုံစံ နှစ်မျိုးလုံးက အလုပ် အတူတူ
      လုပ်တာမို့၊ project တစ်ခုမှာ တစ်မျိုးကို ရွေးသုံးတာ ကောင်းပြီး၊ ဒီ course မှာတော့ expect ကို
      သုံးပါတယ်။ [[mark:draw-order]]
      ပုံစံ နှစ်မျိုးလုံးမှာ ရလာတဲ့ တန်ဖိုးကို အရင် ရေးပြီး၊ ဖြစ်ရမယ့် တန်ဖိုးကို နောက်မှ ရေးပါတယ်။
      အင်္ဂလိပ် အက္ခရာ စဉ်မှာ actual ရဲ့ A က expected ရဲ့ E ထက် ရှေ့ရောက်တာနဲ့ မှတ်ထားလို့ ရပါတယ်။
      အစဉ် ပြောင်းရေးမိရင်တော့ Expected နဲ့ Received ကို ပြောင်းပြန် ပြမှာ ဖြစ်လို့ failure ကို ဖတ်ရ
      ခက်သွားပါမယ်။
    sources:
      - {
          title: "web.dev Learn Testing: Tools of the trade, assertion helpers",
          url: "https://web.dev/learn/testing/assertions/tools#assertion-helpers",
        }
      - {
          title: "web.dev Learn Testing: Fluent and BDD assertions",
          url: "https://web.dev/learn/testing/assertions/tools#fluent_and_bdd_assertions",
        }
      - {
          title: "Vitest: assert (Chai's assert, re-exported; facts B16)",
          url: "https://vitest.dev/api/assert",
        }
      - {
          title: "Vitest: expect (a message as the second argument)",
          url: "https://vitest.dev/api/expect",
        }
      - {
          title: "Vitest: Using Matchers, truthiness",
          url: "https://vitest.dev/guide/learn/matchers#truthiness",
        }
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-assert
        type: whiteboard.apply
        at: { mark: draw-assert }
        upsertIds: [a-assert-box, a-assert-head, a-assert-1, a-assert-2, a-assert-3]
        drawMs: 4000
      - id: draw-expect
        type: whiteboard.apply
        at: { mark: draw-expect }
        upsertIds: [a-expect-box, a-expect-head, a-expect-1, a-expect-2, a-expect-3]
        drawMs: 4000
      - id: draw-order
        type: whiteboard.apply
        at: { mark: draw-order }
        upsertIds: [a-order]
        drawMs: 1800

  - id: starter
    narration: >
      [[mark:close-board]] ဆိုင်ရဲ့ code ကို ကြည့်ရအောင်။ ဒါက form ဖိုင်ရဲ့ test ပါ။ [[mark:select-read]]
      test ထဲမှာ browser ရဲ့ input အကွက် အစစ်အစား၊ value ပါတဲ့ object လေး တစ်ခုကို ပေးထားပါတယ်။ ဒါက
      customer က ခွက်အရေအတွက် အကွက်မှာ ၂ လို့ ရိုက်ထားတာကို အတုလုပ်ထားတာပါ။ [[mark:select-assert-equal]]
      ပြီးတော့ ရလာတဲ့ အရေအတွက်က ၂ ဖြစ်ရမယ်လို့ assert equal နဲ့ စစ်ထားပြီး၊ ကျရင် ပြဖို့ message ကိုလည်း
      ထည့်ထားပါတယ်။ [[mark:open-form]] ဒါကတော့ form ဖိုင်ပါ။ [[mark:select-input-value]] ဒီ function
      က အကွက်ရဲ့ value ကို ဘာမှ မပြောင်းဘဲ ပြန်ပေးပါတယ်။ input အကွက်ရဲ့ value က အမြဲ စာသား ဖြစ်တဲ့အတွက်၊
      customer က ၂ လို့ ရိုက်ရင် ဒီ function က ဂဏန်း ၂ မဟုတ်ဘဲ စာသား ၂ ကို ပြန်ပေးပါတယ်။ ဒီ code မှာ
      bug တစ်ခု ပါနေတာပါ။
    sources:
      - {
          title: "web.dev Learn Testing: Assertion helpers (loose and strict equality, the message)",
          url: "https://web.dev/learn/testing/assertions/tools#assertion-helpers",
        }
      - { title: "Vitest: assert, equal", url: "https://vitest.dev/api/assert#equal" }
      - {
          title: "MDN: HTMLInputElement value (always a string)",
          url: "https://developer.mozilla.org/en-US/docs/Web/API/HTMLInputElement/value",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: select-read
        type: editor.select
        at: { mark: select-read }
        target: { file: src/form.test.js, text: 'readQuantity({ value: "2" })', occurrence: 1 }
      - id: select-assert-equal
        type: editor.select
        at: { mark: select-assert-equal }
        target:
          {
            file: src/form.test.js,
            text: 'assert.equal(qty, 2, "quantity from the form");',
            occurrence: 1,
          }
      - id: open-form
        type: workspace.openFile
        at: { mark: open-form }
        path: src/form.js
      - id: select-input-value
        type: editor.select
        at: { mark: select-input-value }
        target: { file: src/form.js, text: "return input.value;", occurrence: 1 }

  - id: panel
    narration: >
      [[mark:ready]] code ပြောင်းတိုင်း Vitest က ပြန် run ပေးတဲ့ panel ကို ကြည့်ရအောင်။ test ဖိုင်
      သုံးဖိုင်မှာ test တစ်ခုစီ ရှိပြီး၊ သုံးခုလုံး pass ဖြစ်နေပါတယ်။ [[mark:read-files]] form ဖိုင်ရဲ့
      test ကို assert နဲ့ ရေးထားပြီး၊ menu နဲ့ service ဖိုင်တွေရဲ့ test ကိုတော့ expect နဲ့ ရေးထားပါတယ်။
      ဖိုင် တစ်ဖိုင်ထဲမှာ ပုံစံ နှစ်မျိုး မရောထားတာကို သတိထား ကြည့်ပါ။
    sources:
      - {
          title: "web.dev Learn Testing: Mix and match assertions as needed",
          url: "https://web.dev/learn/testing/assertions/tools#mix-match",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-start-pass
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1000 }
      - id: expect-start-count
        type: expect.preview
        at: { afterAction: expect-start-pass }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "3" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-files
        type: expect.preview
        at: { afterAction: expect-start-count }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-files-passed, value: "3" }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: loose
    chapter: "Loose equality ရဲ့ ထောင်ချောက်"
    narration: >
      ဒါဆို စာသား ၂ ကို ပြန်ပေးနေတာ ဘာလို့ pass ဖြစ်နေတာလဲ။ [[mark:open-form-test]] assert equal က
      loose equality နဲ့ စစ်လို့ပါ။ JavaScript မှာ loose equality နဲ့ strict equality ဆိုပြီး နှစ်မျိုး
      ရှိပါတယ်။ loose equality က အမျိုးအစား မတူရင် တစ်ဘက်ကို ပြောင်းပြီးမှ နှိုင်းယှဉ်လို့၊ စာသား ၂ နဲ့
      ဂဏန်း ၂ ကို တူတယ်လို့ ယူဆပါတယ်။ ဒါပေမဲ့ ဒီ တန်ဖိုးနဲ့ တွက်ရင် ပြဿနာ တက်ပါမယ်။ ဥပမာ ခွက် တစ်ခွက်
      ထပ်ပေါင်းရင် ၃ မရဘဲ ၂၁ ဆိုတဲ့ စာသား ဖြစ်သွားပါတယ်။ ဆိုတော့ ဒီ test က bug ကို ဖုံးထားတာပါ။
      [[mark:type-strict]] ဒါကြောင့် equal ကို အမျိုးအစားကိုပါ စစ်တဲ့ strict Equal နဲ့ အစားထိုးကြည့်ရအောင်။
      line အသစ်ကို အပေါ်မှာ ရေးပြီး၊ line ဟောင်းကိုတော့ ဘာ ပြောင်းသွားလဲ မြင်ရအောင် comment
      လုပ်ထားပါမယ်။ [[mark:select-strict]] strict equality က တန်ဖိုးကို ဘာမှ ပြောင်းမပေးလို့၊ စာသားနဲ့
      ဂဏန်းဆိုရင် ပုံစံ တူနေပေမဲ့ မတူဘူးလို့ပဲ ယူဆပါတယ်။ message ကတော့ အရင်အတိုင်းပါ။ [[mark:read-strict]]
      panel ကို ကြည့်ပါ။ form ရဲ့ test က ကျသွားပါပြီ။ ကျတဲ့ message ရဲ့ ရှေ့ဆုံးမှာ ကိုယ် ထည့်ထားတဲ့
      message ကို ပြပြီး၊ နောက်က assert ရဲ့ ရှင်းပြချက် လိုက်လာပါတယ်။ [[mark:read-quotes]] အောက်က
      အစိမ်းရောင် Expected မှာ ၂ ကို quote မပါဘဲ ပြပြီး၊ အနီရောင် Received မှာတော့ quote ထဲမှာ
      ပြထားပါတယ်။ quote ပါတာက စာသား ဖြစ်တယ်
      ဆိုတဲ့ အဓိပ္ပာယ်ပါ။ ဆိုလိုတာက ဂဏန်း ၂ ဖြစ်ရမယ့် နေရာမှာ စာသား ၂ ရနေတာပါ။ [[mark:open-form-fix]]
      code ကို ပြင်ကြည့်ရအောင်။ [[mark:type-number]] value ကို Number နဲ့ ဂဏန်း ပြောင်းပြီး ပြန်ပေးတဲ့ line
      အသစ်ကို ထည့်ပြီး၊ အဟောင်းကိုတော့ comment လုပ်ထားပါမယ်။ [[mark:read-number]] test တွေ အကုန် pass
      ပြန်ဖြစ်သွားပါပြီ။ bug ကို ဖမ်းပေးခဲ့တာက strict Equal ဖြစ်လို့၊ assert ပုံစံ သုံးရင် equal အစား
      strict Equal ကို သုံးပါ။ expect ရဲ့ to Be ကလည်း strict ပုံစံနဲ့ စစ်လို့ ဒီ ထောင်ချောက်ထဲ မကျပါဘူး။
    sources:
      - {
          title: "Vitest: assert, equal (non-strict ==) and strictEqual (===)",
          url: "https://vitest.dev/api/assert#strictequal",
        }
      - {
          title: "web.dev Learn Testing: Assertion helpers (loose and strict equality)",
          url: "https://web.dev/learn/testing/assertions/tools#assertion-helpers",
        }
      - {
          title: "MDN: Equality comparisons and sameness",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Equality_comparisons_and_sameness",
        }
    actions:
      - id: open-form-test
        type: workspace.openFile
        at: { mark: open-form-test }
        path: src/form.test.js
      - id: type-strict
        type: editor.type
        at: { mark: type-strict }
        target:
          {
            file: src/form.test.js,
            after: "const qty = readQuantity({ value: \"2\" });\n  ",
            occurrence: 1,
          }
        text: "assert.strictEqual(qty, 2, \"quantity from the form\");\n  // "
        # The one-insert line replacement (COURSE-KIT §5): the strict line, a newline, the indent and
        # "// " land in one write, so the loose line becomes a comment under it and every state parses.
        # The final test then holds only the strict check the lesson recommends (audit).
        cadence: block
      - id: expect-strict-fail
        type: expect.preview
        at: { afterAction: type-strict }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-strict-test
        type: expect.preview
        at: { afterAction: expect-strict-fail }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-1 }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-strict-message
        type: expect.preview
        at: { afterAction: expect-strict-test }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-message, value: "quantity from the form: expected '2' to equal 2" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-strict-received
        type: expect.preview
        at: { afterAction: expect-strict-message }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-actual, value: '"2"' }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-strict
        type: editor.select
        at: { mark: select-strict }
        target:
          {
            file: src/form.test.js,
            text: 'assert.strictEqual(qty, 2, "quantity from the form");',
            occurrence: 1,
          }
      - id: open-form-fix
        type: workspace.openFile
        at: { mark: open-form-fix }
        path: src/form.js
      - id: type-number
        type: editor.type
        at: { mark: type-number }
        target:
          { file: src/form.js, after: "export function readQuantity(input) {\n  ", occurrence: 1 }
        text: "return Number(input.value);\n  // "
        # The one-insert line replacement (COURSE-KIT §5): the new line, a newline, the indent and
        # "// " in one write, so the old return becomes a comment and every state parses.
        cadence: block
      - id: expect-number-pass
        type: expect.preview
        at: { afterAction: type-number }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-number-count
        type: expect.preview
        at: { afterAction: expect-number-pass }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "3" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-form-file
        type: expect.file
        at: { afterAction: expect-number-count }
        path: src/form.js
        contains: "  return Number(input.value);\n  // return input.value;"

  - id: floats
    chapter: "ဒသမ ဂဏန်းနဲ့ ငွေ"
    narration: >
      [[mark:open-service-test]] နောက်တစ်ခုက ဝန်ဆောင်ခပါ။ ဆိုင်က အော်ဒါ စုစုပေါင်းရဲ့ ၇ ရာခိုင်နှုန်းကို
      ဝန်ဆောင်ခ အဖြစ် ယူပါတယ်။ ဒါက service ဖိုင်ရဲ့ test ပါ။ [[mark:select-zero]] လက်ရှိ test က အော်ဒါ
      အလွတ်ဆိုရင် ဝန်ဆောင်ခ သုည ဖြစ်ရမယ်လို့ စစ်ထားပါတယ်။ [[mark:type-float]] လက်ဖက်ရည် တစ်ခွက်
      ၁၅၀၀ ကျပ်ရဲ့ ၇ ရာခိုင်နှုန်းက ၁၀၅ ကျပ် ဖြစ်ရမယ်လို့ စစ်တဲ့ test အသစ် တစ်ခု ထည့်ပါမယ်။ ၁၅၀၀ ရဲ့
      ရာခိုင်နှုန်း တစ်ခုက ၁၅ ဖြစ်လို့ ၇ ဆဆိုရင် ၁၀၅ ပါ။ [[mark:read-float]] panel ကို ကြည့်ပါ။ test
      အသစ်က ကျသွားပါပြီ။ ၁၀၅ ဖြစ်ရမယ့် နေရာမှာ၊ ၁၀၅ နဲ့ အရမ်း နီးပေမဲ့ ဒသမ နောက်မှာ သုည တွေ ဆက်တိုက်
      ပါပြီး အဆုံးမှာ ၁ ပါနေတဲ့ ဂဏန်း ရနေတယ်လို့ ပြောနေပါတယ်။ [[mark:read-why]] ဘာကြောင့်လဲဆိုတော့
      ကွန်ပျူတာက ဂဏန်းတွေကို binary နဲ့ သိမ်းလို့ပါ။ code ထဲက ၇ ရာခိုင်နှုန်းကို ဒသမ ဂဏန်း အနေနဲ့
      ရေးထားပြီး၊ ဒီလို ဒသမ ဂဏန်း အများစုကို binary နဲ့ အတိအကျ သိမ်းလို့ မရတဲ့အတွက် အနီးဆုံး
      တန်ဖိုးကိုပဲ သိမ်းထားပါတယ်။ ကွန်ပျူတာက ဒသမ ဂဏန်းတွေကို အတိအကျ မသိမ်းနိုင်တာကို floating
      point ပြဿနာလို့ ခေါ်ပါတယ်။ [[mark:board-float]] ဒီ ပြဿနာက JavaScript တစ်ခုတည်း မဟုတ်ဘဲ၊ programming
      language အများစုမှာ ကြုံရပါတယ်။
      [[mark:draw-examples]] ၁၅၀၀ ရဲ့ ၇ ရာခိုင်နှုန်းလိုပဲ၊ ၀ ဒသမ ၁ နဲ့ ၀ ဒသမ ၂ ကို ပေါင်းရင်တောင် ၀ ဒသမ ၃
      အတိအကျ မရပါဘူး။ [[mark:draw-close]] အကွာအဝေးလို ဒသမ တကယ် ပါတဲ့ တန်ဖိုးတွေကို စစ်ဖို့ to Be Close To
      ဆိုတဲ့ matcher ရှိပါတယ်။ သူက default အနေနဲ့ ဒသမ နောက်က ဂဏန်း နှစ်လုံးအထိပဲ စစ်လို့၊ တန်ဖိုး နှစ်ခု
      အရမ်း နီးရင် pass ဖြစ်ပါတယ်။
      [[mark:draw-money]] ငွေကတော့ မတူပါဘူး။ customer ဆီက ကျပ် အပြည့်ပဲ ယူတာမို့၊ code ထဲမှာကိုက ကျပ်
      အပြည့် ဖြစ်အောင် လုပ်ပေးရပါတယ်။ အဲဒီအခါ test ကလည်း to Be နဲ့ အတိအကျ စစ်လို့ ရပါတယ်။
      [[mark:open-service]] service ဖိုင်ကို ဖွင့်ပါမယ်။ [[mark:type-round]] ဝန်ဆောင်ခကို Math round နဲ့
      အနီးဆုံး ကျပ် အပြည့် ဖြစ်အောင် လုပ်ပြီး ပြန်ပေးတဲ့ line ကို ထည့်ပြီး၊ အဟောင်းကို comment
      လုပ်ထားပါမယ်။ [[mark:read-round]] test လေးခုလုံး pass ဖြစ်သွားပါပြီ။ ငွေကို code ထဲမှာ ကျပ်
      အပြည့် လုပ်ထားတဲ့အတွက်၊ test ကလည်း ရိုးရိုး to Be နဲ့ပဲ စစ်လို့ ရသွားတာပါ။
    sources:
      - { title: "Vitest: expect, toBeCloseTo", url: "https://vitest.dev/api/expect#tobecloseto" }
      - {
          title: "Vitest: Using Matchers, numbers (floating point)",
          url: "https://vitest.dev/guide/learn/matchers#numbers",
        }
      - {
          title: "MDN: Number, the IEEE 754 double-precision format",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Number",
        }
    actions:
      - id: open-service-test
        type: workspace.openFile
        at: { mark: open-service-test }
        path: src/service.test.js
      - id: select-zero
        type: editor.select
        at: { mark: select-zero }
        target:
          { file: src/service.test.js, text: "expect(serviceCharge(0)).toBe(0);", occurrence: 1 }
      - id: type-float
        type: editor.type
        at: { mark: type-float }
        target: { file: src/service.test.js, after: "toBe(0);\n});\n", occurrence: 1 }
        text: "\ntest(\"adds 7% service to a tea\", () => {\n  expect(serviceCharge(1500)).toBe(105);\n});\n"
        # One block (pilot note 1): line by line, the newline and the blank line parse and the
        # test( line can wait past the bridge's 1 s quiet window.
        cadence: block
      - id: expect-float-fail
        type: expect.preview
        at: { afterAction: type-float }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-float-test
        type: expect.preview
        at: { afterAction: expect-float-fail }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-4 }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-float-message
        type: expect.preview
        at: { afterAction: expect-float-test }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute:
          {
            name: data-message,
            value: "expected 105.00000000000001 to be 105 // Object.is equality",
          }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-float-diff
        type: expect.preview
        at: { afterAction: expect-float-message }
        timeoutMs: 5000
        target: { by: testId, value: vt-diff-1 }
        textContains: "+ 105.00000000000001"
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: board-float
        type: whiteboard.apply
        at: { mark: board-float }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-examples
        type: whiteboard.apply
        at: { mark: draw-examples }
        upsertIds: [b-calc-1, b-res-1, b-calc-2, b-res-2]
        drawMs: 3000
      - id: draw-close
        type: whiteboard.apply
        at: { mark: draw-close }
        upsertIds: [b-close-box, b-close-1, b-close-2]
        drawMs: 2500
      - id: draw-money
        type: whiteboard.apply
        at: { mark: draw-money }
        upsertIds: [b-money-box, b-money-1, b-money-2]
        drawMs: 2500
      - id: close-float-board
        type: whiteboard.apply
        at: { mark: open-service }
        open: false
      - id: open-service
        type: workspace.openFile
        at: { mark: open-service, offsetMs: 700 }
        path: src/service.js
      - id: type-round
        type: editor.type
        at: { mark: type-round }
        target:
          {
            file: src/service.js,
            after: "export function serviceCharge(total) {\n  ",
            occurrence: 1,
          }
        text: "return Math.round(total * 0.07);\n  // "
        cadence: block
      - id: expect-round-pass
        type: expect.preview
        at: { afterAction: type-round }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-round-count
        type: expect.preview
        at: { afterAction: expect-round-pass }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "4" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-service-file
        type: expect.file
        at: { afterAction: expect-round-count }
        path: src/service.js
        contains: "  return Math.round(total * 0.07);\n  // return total * 0.07;"

  - id: errors
    chapter: "Error ကို ဘယ်လို စစ်မလဲ"
    narration: >
      [[mark:open-menu]] နောက်ဆုံး ထောင်ချောက်က error ပါ။ menu ဖိုင်ကို ကြည့်ရအောင်။ [[mark:select-throw]]
      menu မှာ မရှိတဲ့ item ကို မေးရင် ဒီ function က ဈေးနှုန်း မပြန်ပေးဘဲ၊ menu မှာ မရှိဘူး ဆိုတဲ့ error
      ကို throw လုပ်ပါတယ်။ ဒီ အလုပ်လုပ်ပုံကိုလည်း test နဲ့ စစ်ထားသင့်ပါတယ်။ [[mark:open-menu-test]] menu
      ရဲ့ test ဖိုင်ကို ဖွင့်ပါမယ်။ [[mark:type-pizza]] menu မှာ မရှိတဲ့ pizza ကို မေးရင် error throw
      လုပ်လား ဆိုတာကို to Throw နဲ့ စစ်တဲ့ test ထည့်ပါမယ်။ to Throw ထဲက စာသားက error message ထဲမှာ
      ပါရမယ့် အပိုင်းပါ။ [[mark:read-raw]] panel ကို ကြည့်ပါ။ test က ကျသွားပေမဲ့ ဒီတစ်ခါ Assertion Error
      မဟုတ်ဘဲ၊ ကိုယ် စစ်ချင်တဲ့ error ကိုယ်တိုင် ပေါ်နေပါတယ်။ code frame ကလည်း test ဖိုင်ကို မညွှန်ဘဲ၊
      menu ဖိုင်ထဲက throw လုပ်တဲ့ line ကို ညွှန်နေပြီး၊ test ဖိုင်ကိုတော့ သူ့အောက်က line မှာမှ ပြပါတယ်။
      [[mark:select-call]] ဘာကြောင့်လဲဆိုတော့၊ JavaScript က expect ကို မခေါ်ခင် expect ထဲမှာ ရေးထားတဲ့
      ဈေးနှုန်း ရှာတဲ့ function ကို အရင် run လို့ပါ။ error က အဲဒီမှာတင် throw ဖြစ်သွားတဲ့အတွက် expect
      က ဖမ်းခွင့် မရလိုက်ပါဘူး။ [[mark:type-arrow]] ဒါကြောင့် function ကို တိုက်ရိုက် မခေါ်ဘဲ arrow
      function တစ်ခုထဲမှာ ထည့်ပေးပါမယ်။ ဒါဆိုရင် to Throw က အဲဒီ function ကို ကိုယ်တိုင် ခေါ်ပြီး error
      ကို ဖမ်းနိုင်ပါပြီ။ [[mark:read-arrow]] test ငါးခုလုံး pass ဖြစ်သွားပါပြီ။ to Throw က error message
      ထဲမှာ menu မှာ မရှိဘူး ဆိုတဲ့ အပိုင်း ပါတာကို တွေ့လို့ pass ဖြစ်တာပါ။
    sources:
      - {
          title: "Vitest: expect, toThrow (wrap the code in a function; a string is a substring)",
          url: "https://vitest.dev/api/expect#tothrow",
        }
      - {
          title: "Vitest: Using Matchers, exceptions",
          url: "https://vitest.dev/guide/learn/matchers#exceptions",
        }
      - {
          title: "Vitest: Migration guide, toThrow with a string (facts A19)",
          url: "https://vitest.dev/guide/migration/",
        }
    actions:
      - id: open-menu
        type: workspace.openFile
        at: { mark: open-menu }
        path: src/menu.js
      - id: select-throw
        type: editor.select
        at: { mark: select-throw }
        target:
          {
            file: src/menu.js,
            text: "if (!item) throw new Error(`${id} is not on the menu`);",
            occurrence: 1,
          }
      - id: open-menu-test
        type: workspace.openFile
        at: { mark: open-menu-test }
        path: src/menu.test.js
      - id: type-pizza
        type: editor.type
        at: { mark: type-pizza }
        target: { file: src/menu.test.js, after: "toBe(1500);\n});\n", occurrence: 1 }
        text: "\ntest(\"refuses an item that is not on the menu\", () => {\n  expect(priceOf(\"pizza\")).toThrow(\"not on the menu\");\n});\n"
        cadence: block
      - id: expect-raw-fail
        type: expect.preview
        at: { afterAction: type-pizza }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-raw-test
        type: expect.preview
        at: { afterAction: expect-raw-fail }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-3 }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-raw-name
        type: expect.preview
        at: { afterAction: expect-raw-test }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-name, value: Error }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-raw-message
        type: expect.preview
        at: { afterAction: expect-raw-name }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-message, value: "pizza is not on the menu" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-raw-frame
        type: expect.preview
        at: { afterAction: expect-raw-message }
        timeoutMs: 5000
        target: { by: testId, value: vt-frame-1 }
        attribute: { name: data-file, value: src/menu.js }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-call
        type: editor.select
        at: { mark: select-call }
        target: { file: src/menu.test.js, text: 'priceOf("pizza")', occurrence: 1 }
      - id: type-arrow
        type: editor.type
        at: { mark: type-arrow }
        target:
          { file: src/menu.test.js, after: "not on the menu\", () => {\n  expect(", occurrence: 1 }
        text: "() => "
      - id: expect-arrow-pass
        type: expect.preview
        at: { afterAction: type-arrow }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-arrow-count
        type: expect.preview
        at: { afterAction: expect-arrow-pass }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "5" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-menu-test-file
        type: expect.file
        at: { afterAction: expect-arrow-count }
        path: src/menu.test.js
        contains: 'expect(() => priceOf("pizza")).toThrow("not on the menu");'
      - id: expect-form-test-file
        type: expect.file
        at: { afterAction: expect-menu-test-file }
        path: src/form.test.js
        contains: "  assert.strictEqual(qty, 2, \"quantity from the form\");\n  // assert.equal(qty, 2, \"quantity from the form\");\n"

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ assert နဲ့ expect က ပုံစံသာ ကွာပြီး အလုပ် အတူတူ လုပ်ပါတယ်။ ပုံစံ နှစ်မျိုးလုံးမှာ
      ရလာတဲ့ တန်ဖိုး အရင်၊ ဖြစ်ရမယ့် တန်ဖိုး နောက်မှ ရေးပြီး၊ assert ဆိုရင် equal ထက် strict Equal ကို
      သုံးပါ။ [[mark:recap-numbers]] ဒသမ တကယ် ပါတဲ့ တန်ဖိုးကို to Be Close To နဲ့ စစ်ပြီး၊ ငွေကိုတော့ code
      ထဲမှာ ကျပ် အပြည့် ဖြစ်အောင် လုပ်ပါ။ error ကို စစ်ရင် function ကို arrow function ထဲ ထည့်ပေးမှ to
      Throw က ဖမ်းနိုင်ပါတယ်။ [[mark:recap-primitives]] test framework အများစုမှာ အဓိက ပါတာ နှစ်ခု
      ရှိပါတယ်။ မမှန်ရင် error throw လုပ်ပေးတဲ့ assertion တွေနဲ့၊ test တစ်ခုချင်းကို နာမည်ပေးပြီး သီးခြား
      run လို့ ရအောင် ခွဲရေးတဲ့ နည်းပါ။ assert နဲ့ expect က စစ်ရ
      လွယ်အောင် ထည့်ပေးထားတာ ဖြစ်ပြီး၊ ပထမ lesson ကလို if နဲ့ throw ပါတဲ့ code မှန်သမျှလည်း test တစ်ခု
      ဖြစ်နိုင်ပါတယ်။ နောက် lesson မှာတော့ test
      တစ်ခုကို အပိုင်းလိုက် ရေးနည်း၊ describe နဲ့ အုပ်စုဖွဲ့နည်းနဲ့ test နာမည် ပေးနည်းကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "web.dev Learn Testing: What testing is, check your understanding",
          url: "https://web.dev/learn/testing/get-started/what-testing-is#check_your_understanding",
        }
      - {
          title: "web.dev Learn Testing: Mix and match assertions as needed",
          url: "https://web.dev/learn/testing/assertions/tools#mix-match",
        }
    actions: []
checks:
  - { type: timing.p95Ms, max: 300 }
