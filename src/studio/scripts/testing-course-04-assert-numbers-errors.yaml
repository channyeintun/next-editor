      src/form.js: |
        // The order form's quantity field: how many cups the customer typed.
        export function readQuantity(input) {
          return input.value;
        }
      src/form.test.js: |
        import { assert, test } from "vitest";
        import { readQuantity } from "./form.js";

        test("reads the quantity from the form", () => {
          const qty = readQuantity({ value: "2" });
          assert.equal(qty, 2, "quantity from the form");
        });
      src/menu.js: |
        export const MENU = {
          tea: { name: "လက်ဖက်ရည်", price: 1500, drink: true },
          coffee: { name: "ကော်ဖီ", price: 1800, drink: true },
          lime: { name: "သံပုရာရည်", price: 1200, drink: true },
          mohinga: { name: "မုန့်ဟင်းခါး", price: 2500, drink: false },
          paratha: { name: "ပလာတာ", price: 1200, drink: false },
        };

        export function priceOf(id) {
          const item = MENU[id];
          if (!item) throw new Error(`${id} is not on the menu`);
          return item.price;
        }
      src/menu.test.js: |
        import { expect, test } from "vitest";
        import { priceOf } from "./menu.js";

        test("knows the price of tea", () => {
          expect(priceOf("tea")).toBe(1500);
        });
      src/service.js: |
        // The 7% service charge on an order total, in Kyat.
        export function serviceCharge(total) {
          return total * 0.07;
        }
      src/service.test.js: |
        import { expect, test } from "vitest";
        import { serviceCharge } from "./service.js";

        test("charges no service on an empty order", () => {
          expect(serviceCharge(0)).toBe(0);
        });
