build:
  voiceProfile:
    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 35

runtime:
  kind: rust-playground
  defaultMode: fixture
  fixture:
    latencyMs: 600
    result:
      status: success
      stdout: "hello and world

        middle: 3 numbers, first 20

        first words: hello, slices\n"
      stderr: ""

scenes:
  - id: view
    chapter: Data ထဲကို ကြည့်တဲ့ view
    narration: >-
      တစ်ခါတစ်လေ data တစ်ခုလုံးကို မလိုဘဲ၊ သူ့ရဲ့ အပိုင်း တစ်ပိုင်းပဲ လိုတာမျိုး ရှိပါတယ်။
      ဥပမာအားဖြင့် ဝါကျ တစ်ကြောင်းထဲက ပထမ စကားလုံးပဲ လိုချင်တာမျိုးပါ။ အဲဒီ အပိုင်းကို copy
      ကူးထုတ်မယ်ဆိုရင် အချိန်ရော memory ပါ ကုန်တဲ့အတွက်၊ Rust က အဲဒီအစား slice ဆိုတာကို ပေးထားပါတယ်။
      [[mark:draw-bytes]] ဒီမှာ hello world ဆိုတဲ့ စာသားကို ကိုင်ထားတဲ့ s ဆိုတဲ့ String တစ်ခု
      ရှိပါတယ်။ အကွက် တစ်ကွက်စီက အဲဒီ စာသားရဲ့ byte တစ်လုံးစီ ဖြစ်ပြီး၊ 0 ကနေ စပြီး နံပါတ်
      တပ်ထားပါတယ်။ [[mark:draw-frame]] slice ဆိုတာ အဲဒီ byte တွေထဲက range တစ်ခုကို ကြည့်တဲ့ view
      တစ်ခုပါ။ ဒီ slice က 0 ကနေ စပြီး 5 မရောက်ခင်မှာ ရပ်တဲ့အတွက်၊ သူ မြင်တာက hello ပါ။
      [[mark:draw-parts]] သူ့ type ကတော့ string slice ဖြစ်ပြီး၊ code ထဲမှာ ampersand str လို့
      ရေးပါတယ်။ slice က စာသားကို copy မကူးပါဘူး။ သူ့ထဲမှာ ပထမ byte ကို ညွှန်ထားတဲ့ pointer တစ်ခုနဲ့
      အရှည် တစ်ခုပဲ ရှိပါတယ်။ [[mark:draw-borrow]] ပြီးတော့ slice ဆိုတာ reference တစ်မျိုးလည်း
      ဖြစ်တဲ့အတွက်၊ s ကို borrow လုပ်ထားတာပါ၊ borrow ဆိုတာ ငှားသုံးတာပါ။ ဒါကြောင့် borrowing ရဲ့
      စည်းမျဉ်းတွေက slice အပေါ်မှာလည်း အတူတူပဲ သက်ရောက်ပါတယ်။
    sources:
      - title: "The Rust Book — The Slice Type"
        url: "https://doc.rust-lang.org/book/ch04-03-slices.html#the-slice-type"
      - title: "The Rust Book — String Slices"
        url: "https://doc.rust-lang.org/book/ch04-03-slices.html#string-slices"
    actions:
      # Opens in the quiet handle before the first word, already titled.
      - id: open-board-view
        type: whiteboard.apply
        at: { scene: start, offsetMs: -1500 }
        open: true
        upsertIds: [b-title]
      - id: draw-bytes
        type: whiteboard.apply
        at: { mark: draw-bytes }
        upsertIds:
          [
            b-s-label,
            b-byte0,
            b-byte1,
            b-byte2,
            b-byte3,
            b-byte4,
            b-byte5,
            b-byte6,
            b-byte7,
            b-byte8,
            b-byte9,
            b-byte10,
            b-ch0,
            b-ch1,
            b-ch2,
            b-ch3,
            b-ch4,
            b-ch6,
            b-ch7,
            b-ch8,
            b-ch9,
            b-ch10,
            b-ix0,
            b-ix1,
            b-ix2,
            b-ix3,
            b-ix4,
            b-ix5,
            b-ix6,
            b-ix7,
            b-ix8,
            b-ix9,
            b-ix10,
          ]
        drawMs: 3200
      - id: draw-frame
        type: whiteboard.apply
        at: { mark: draw-frame }
        upsertIds: [b-frame, b-range, b-result]
        drawMs: 1600
      - id: draw-parts
        type: whiteboard.apply
        at: { mark: draw-parts }
        upsertIds: [b-var-box, b-var-name, b-var-parts, b-arrow]
        drawMs: 2000
      - id: draw-borrow
        type: whiteboard.apply
        at: { mark: draw-borrow }
        upsertIds: [b-nocopy]
        drawMs: 1200

  - id: string-slices
    chapter: String နဲ့ array ကို slice လုပ်ခြင်း
    narration: >-
      ဒါကို code နဲ့ ရေးကြည့်ရအောင်။ [[mark:open-main]] ဒီမှာ ခုနက s ဆိုတဲ့ String ရှိပါတယ်။
      [[mark:type-hello]] slice တစ်ခု လုပ်ဖို့ဆိုရင်၊ ampersand၊ ပြီးတော့ variable နာမည်၊ ပြီးတော့
      လေးထောင့်ကွင်းထဲမှာ range တစ်ခု ရေးရပါတယ်။ [[mark:select-range]] ဒီ 0 dot dot 5 ဆိုတဲ့ range က
      index 0 ကနေ စပြီး 5 မရောက်ခင်မှာ ရပ်ပါတယ်။ အဆုံးဖက်က 5 ကိုတော့ ထည့်မတွက်တဲ့အတွက်၊ ဒီ slice ရဲ့
      အရှည်က byte 5 လုံးပါ။ [[mark:type-world]] range တစ်ခုရဲ့ အစ ဒါမှမဟုတ် အဆုံးကို ချန်ထားလို့လည်း
      ရပါတယ်။ [[mark:select-open-end]] ဒီ 6 dot dot လို နောက်မှာ ဘာမှ မပါရင်၊ စာသားရဲ့ အဆုံးအထိ
      သွားပါတယ်။ အစကို ချန်ထားရင် 0 ကနေ စပြီး၊ နှစ်ဖက်လုံး ချန်ထားရင်တော့ String တစ်ခုလုံးကို
      ရပါတယ်။
    sources:
      - title: "The Rust Book — String Slices"
        url: "https://doc.rust-lang.org/book/ch04-03-slices.html#string-slices"
      - title: "The Rust Reference — Range expressions"
        url: "https://doc.rust-lang.org/reference/expressions/range-expr.html"
    actions:
      - id: close-board-view
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: main.rs
      - id: type-hello
        type: editor.type
        at: { mark: type-hello }
        target:
          file: main.rs
          after: "    let s = String::from(\"hello world\");\n"
          occurrence: 1
        cadence: fast-explainer
        text: "    let hello = &s[0..5];\n"
      - id: select-range
        type: editor.select
        at: { mark: select-range }
        target:
          file: main.rs
          text: "0..5"
          occurrence: 1
      - id: type-world
        type: editor.type
        at: { mark: type-world }
        target:
          file: main.rs
          after: "    let hello = &s[0..5];\n"
          occurrence: 1
        cadence: line-by-line
        text: "    let world = &s[6..];

          \    println!(\"{hello} and {world}\");\n"
      - id: select-open-end
        type: editor.select
        at: { mark: select-open-end }
        target:
          file: main.rs
          text: "6.."
          occurrence: 1

  - id: array-slices
    narration: >-
      [[mark:type-array]] slice ကို array တွေမှာလည်း သုံးလို့ ရပါတယ်။ ဒီမှာ array တစ်ခု ရှိပြီး၊
      သူ့ရဲ့ index 1 ကနေ စပြီး 4 မရောက်ခင်အထိ slice လုပ်ထားပါတယ်။ [[mark:select-array-type]] array
      slice ရဲ့ type ကတော့ ampersand၊ ပြီးတော့ လေးထောင့်ကွင်းထဲမှာ element type ပါ၊ ဒီမှာဆိုရင် i32
      slice ပါ။ အဲဒီ type ထဲမှာ အရှည် မပါတာ သတိထား ကြည့်ပါ။ slice က သူ့ အရှည်ကို သူ့ထဲမှာ ကိုယ်တိုင်
      သယ်ထားတဲ့အတွက်၊ အရှည် ဘယ်လောက်ပဲ ဖြစ်ဖြစ် type တစ်ခုတည်းနဲ့ ကိုက်ပါတယ်။
      [[mark:select-middle-zero]] index တွေကို slice ရဲ့ အစကနေ စပြီး ရေတွက်တဲ့အတွက်၊ middle ရဲ့
      index 0 က 20 ဖြစ်ပါတယ်။
    sources:
      - title: "The Rust Book — Other Slices"
        url: "https://doc.rust-lang.org/book/ch04-03-slices.html#other-slices"
      - title: "std — primitive type slice"
        url: "https://doc.rust-lang.org/std/primitive.slice.html"
    actions:
      - id: type-array
        type: editor.type
        at: { mark: type-array, offsetMs: -400 }
        target:
          file: main.rs
          after: "    println!(\"{hello} and {world}\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "

          \    let numbers = [10, 20, 30, 40, 50];

          \    let middle: &[i32] = &numbers[1..4];

          \    println!(\"middle: {} numbers, first {}\", middle.len(), middle[0]);\n"
      - id: select-array-type
        type: editor.select
        at: { mark: select-array-type }
        target:
          file: main.rs
          text: "&[i32]"
          occurrence: 1
      - id: select-middle-zero
        type: editor.select
        at: { mark: select-middle-zero }
        target:
          file: main.rs
          text: "middle[0]"
          occurrence: 1

  - id: literals
    narration: >-
      [[mark:type-phrase]] အခု string literal တစ်ခု ကြည့်ရအောင်၊ ကိုယ့် ပထမဆုံး program ထဲမှာ
      ရေးခဲ့တဲ့ double quote ထဲက စာသားမျိုးပါ။ [[mark:select-literal-type]] သူ့ type ကို ampersand
      str လို့ ရေးထားတာကို ကြည့်ပါ။ ဆိုလိုတာက string literal ဆိုတာလည်း string slice တစ်ခုပါပဲ။ စာသား
      အစစ်ကတော့ compile လုပ်ထားတဲ့ program ထဲမှာ သိမ်းထားပြီး၊ phrase က အဲဒီ စာသားကို ညွှန်ထားတာပါ။
      shared reference က ဖတ်ရုံပဲ ဖတ်လို့ ရတဲ့အတွက်၊ literal ကို ပြောင်းလို့ မရပါဘူး။
    sources:
      - title: "The Rust Book — String Literals as Slices"
        url: "https://doc.rust-lang.org/book/ch04-03-slices.html#string-literals-as-slices"
      - title: "std — primitive type str"
        url: "https://doc.rust-lang.org/std/primitive.str.html"
    actions:
      - id: type-phrase
        type: editor.type
        at: { mark: type-phrase, offsetMs: -400 }
        target:
          file: main.rs
          after: "middle.len(), middle[0]);\n"
          occurrence: 1
        cadence: line-by-line
        text: "

          \    let phrase: &str = \"slices borrow data\";\n"
      - id: select-literal-type
        type: editor.select
        at: { mark: select-literal-type }
        target:
          file: main.rs
          text: "&str"
          occurrence: 1

  - id: first-word
    chapter: Slice တစ်ခု ပြန်ပေးခြင်း
    narration: >-
      [[mark:type-fn]] အခု slice ကို function တစ်ခုထဲမှာ သုံးကြည့်ရအောင်၊ first word ဆိုတဲ့ function
      ပါ။ သူက string slice တစ်ခုကို လက်ခံပြီး၊ string slice တစ်ခုကိုပဲ ပြန်ပေးပါတယ်။
      [[mark:select-indices]] char indices က စာလုံး တစ်လုံးချင်းစီကို သူ့ byte နေရာနဲ့ တွဲပြီး tuple
      အနေနဲ့ ပေးပါတယ်။ loop က space တစ်လုံး တွေ့တဲ့အခါ၊ အစကနေ အဲဒီ နေရာအထိ slice ကို
      ပြန်ပေးလိုက်ပါတယ်။ space လုံးဝ မပါဘူးဆိုရင်တော့ စာသား တစ်ခုလုံးက စကားလုံး တစ်လုံးတည်း
      ဖြစ်တဲ့အတွက်၊ စာသား တစ်ခုလုံးကို ပြန်ပေးပါတယ်။ [[mark:select-return]] return type ကလည်း string
      slice ပါပဲ။ ဒါကြောင့် ပြန်ရလာတဲ့ ရလဒ်က String အသစ် တစ်ခု မဟုတ်ဘဲ၊ ကိုယ် ထည့်ပေးလိုက်တဲ့
      စာသားထဲကိုပဲ ကြည့်တဲ့ view တစ်ခုပါ။
    sources:
      - title: "The Rust Book — String Slices as Parameters"
        url: "https://doc.rust-lang.org/book/ch04-03-slices.html#string-slices-as-parameters"
      - title: "std — str::char_indices"
        url: "https://doc.rust-lang.org/std/primitive.str.html#method.char_indices"
    actions:
      - id: type-fn
        type: editor.type
        at: { mark: type-fn, offsetMs: -400 }
        target:
          file: main.rs
          after: ""
          occurrence: 1
        cadence: line-by-line
        text: "fn first_word(text: &str) -> &str {

          \    for (i, c) in text.char_indices() {

          \        if c == ' ' {

          \            return &text[..i];

          \        }

          \    }

          \    text

          }

          \n"
      - id: select-indices
        type: editor.select
        at: { mark: select-indices }
        target:
          file: main.rs
          text: "text.char_indices()"
          occurrence: 1
      - id: select-return
        type: editor.select
        at: { mark: select-return }
        target:
          file: main.rs
          text: "-> &str"
          occurrence: 1

  - id: call
    narration: >-
      [[mark:type-calls]] ကဲ၊ first word ကို s နဲ့ တစ်ခါ၊ phrase နဲ့ တစ်ခါ ခေါ်ကြည့်ရအောင်။
      [[mark:select-ref-s]] s အတွက်ကတော့ String reference တစ်ခုကို ထည့်ပေးလိုက်တာပါ။ first word က
      string slice ကို လက်ခံတာ ဖြစ်ပေမဲ့၊ Rust က String reference ကို string slice အဖြစ် ကိုယ့်အစား
      ပြောင်းပေးတဲ့အတွက်၊ first word က နှစ်မျိုးလုံးကို လက်ခံနိုင်ပါတယ်။
    sources:
      - title: "The Rust Book — String Slices as Parameters"
        url: "https://doc.rust-lang.org/book/ch04-03-slices.html#string-slices-as-parameters"
      - title: "The Rust Book — Implicit Deref Coercions with Functions and Methods"
        url:
          "https://doc.rust-lang.org/book/ch15-02-deref.html#implicit-deref-coercions-with-functions-and\
          -methods"
    actions:
      - id: type-calls
        type: editor.type
        at: { mark: type-calls }
        target:
          file: main.rs
          after: "    let phrase: &str = \"slices borrow data\";\n"
          occurrence: 1
        cadence: line-by-line
        text: "    let word = first_word(&s);

          \    let other = first_word(phrase);

          \    println!(\"first words: {word}, {other}\");\n"
      - id: select-ref-s
        type: editor.select
        at: { mark: select-ref-s }
        target:
          file: main.rs
          text: "first_word(&s)"
          occurrence: 1

  - id: compiler-check
    chapter: Compiler က ဘာ စစ်လဲ
    narration: >-
      ဒီနေရာမှာ မေးစရာ တစ်ခု ရှိပါတယ်။ slice ကို ပြန်ပေးမယ့်အစား space ရဲ့ နေရာ၊ ဥပမာအားဖြင့် 5 လို
      ကိန်းဂဏန်း တစ်ခုကို ပြန်ပေးရင် မရဘူးလား။ ပြဿနာက အဲဒီ ကိန်းဂဏန်းက s နဲ့ ဘာမှ ဆက်စပ်မှု
      မရှိတာပါ။ s ကို clear လုပ်ပြီး အလွတ် ဖြစ်သွားရင်တောင်၊ ကိုယ့်လက်ထဲမှာ 5 က ရှိနေဦးမှာ ဖြစ်ပြီး၊
      စာသားကတော့ ပျောက်သွားပါပြီ။ ဘာကမှ သတိပေးမှာ မဟုတ်ပါဘူး။ [[mark:draw-code]] slice ကတော့ borrow
      တစ်ခု ဖြစ်တဲ့အတွက်၊ compiler က စစ်ပေးနိုင်ပါတယ်။ ကြည့်ရအောင်၊ s ကို let mut နဲ့ ကြေညာပြီး
      mutable ဖြစ်အောင် လုပ်ပါမယ်၊ ဆိုလိုတာက ပြောင်းလို့ ရအောင်ပါ။ ပြီးတော့ word ကို
      သုံးနေတုန်းမှာပဲ s ကို clear လုပ်ကြည့်ပါမယ်။ [[mark:draw-error]] compiler က E0502 error နဲ့
      ရပ်သွားပါတယ်။ s ကို immutable အနေနဲ့၊ ဆိုလိုတာက ပြောင်းလို့ မရတဲ့ ဖတ်ဖို့သက်သက် borrow
      လုပ်ထားပြီးသား ဖြစ်နေလို့၊ mutable အနေနဲ့ ထပ် borrow လုပ်လို့ မရပါဘူးတဲ့။ [[mark:draw-reader]]
      အရင်ဆုံး word က s ကို ဖတ်ဖို့ borrow လုပ်ထားပါတယ်။ [[mark:draw-writer]] ပြီးတော့ clear ကတော့ s
      ကို ပြောင်းဖို့ လိုပါတယ်။ [[mark:draw-later]] အဲဒီနောက်မှာ word ကို ထပ်သုံးနေပါသေးတယ်။ ဆိုတော့
      ဖတ်တဲ့သူ တစ်ယောက်နဲ့ ရေးတဲ့သူ တစ်ယောက် တစ်ချိန်တည်းမှာ ရှိနေတာ ဖြစ်ပြီး၊ borrowing ရဲ့
      စည်းမျဉ်းက ဒါကို ခွင့်မပြုပါဘူး။ [[mark:draw-safe]] ဒါကြောင့် ဒီ bug ကို program run
      မလုပ်ခင်မှာပဲ ဖမ်းမိသွားတာပါ။
    sources:
      - title: "Rust error codes — E0502"
        url: "https://doc.rust-lang.org/error_codes/E0502.html"
      - title: "The Rust Book — String Slices"
        url: "https://doc.rust-lang.org/book/ch04-03-slices.html#string-slices"
    actions:
      # The question is asked over the code it is about: the slice first_word
      # returns. The board opens only when its code is spoken.
      - id: select-slice-return
        type: editor.select
        at: { scene: start }
        target:
          file: main.rs
          text: "&text[..i]"
          occurrence: 1
      - id: open-board-error
        type: whiteboard.apply
        at: { mark: draw-code }
        open: true
        clear: true
        upsertIds: [e-title]
      - id: draw-code
        type: whiteboard.apply
        at: { mark: draw-code }
        upsertIds: [e-line1, e-line2, e-line3, e-line4]
        drawMs: 2400
      - id: draw-error
        type: whiteboard.apply
        at: { mark: draw-error }
        upsertIds: [e-msg1, e-msg2]
        drawMs: 2400
      # One rustc label per clause, each underline on the exact span rustc
      # marks (&s, s.clear(), word).
      - id: draw-reader
        type: whiteboard.apply
        at: { mark: draw-reader }
        upsertIds: [e-u2, e-l2]
        drawMs: 1200
      - id: draw-writer
        type: whiteboard.apply
        at: { mark: draw-writer }
        upsertIds: [e-u3, e-l3]
        drawMs: 1200
      - id: draw-later
        type: whiteboard.apply
        at: { mark: draw-later }
        upsertIds: [e-u4, e-l4]
        drawMs: 1200
      - id: draw-safe
        type: whiteboard.apply
        at: { mark: draw-safe }
        upsertIds: [e-safe]
        drawMs: 1200

  - id: run
    narration: >-
      editor ထဲ ပြန်သွားရအောင်။ [[mark:run]] ကဲ၊ run ကြည့်ရအောင်။ ပထမ စာကြောင်းက hello and world
      ဖြစ်ပြီး၊ String တစ်ခုတည်းထဲကို ကြည့်ထားတဲ့ view နှစ်ခုပါ။ array slice ထဲမှာ ကိန်းဂဏန်း 3 လုံး
      ပါပြီး၊ ပထမ တစ်လုံးက 20 ပါ။ နောက်ဆုံး စာကြောင်းမှာတော့ ပထမ စကားလုံးတွေက hello နဲ့ slices
      ဖြစ်နေပါတယ်။
    sources:
      - title: "The Rust Book — The Slice Type"
        url: "https://doc.rust-lang.org/book/ch04-03-slices.html"
    actions:
      - id: close-board-error
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "first words: hello, slices"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: "return &text[..i];"

  - id: wrap
    narration: >-
      ဒါဆို ပြန်ချုပ်ရရင်၊ slice ဆိုတာ String တစ်ခု ဒါမှမဟုတ် array တစ်ခုထဲကို borrow လုပ်ပြီး
      ကြည့်ထားတဲ့ view တစ်ခုပါ။ သူ့ထဲမှာ pointer တစ်ခုနဲ့ အရှည် တစ်ခုပဲ ရှိပြီး၊ data ကို copy
      မကူးပါဘူး။ ပြီးတော့ အဲဒီ slice ကို အမြဲ သုံးလို့ ရနေအောင် compiler က စစ်ပေးပါတယ်။ နောက် lesson
      မှာတော့ struct တွေ၊ ဆိုလိုတာက ဆက်စပ်နေတဲ့ data တွေကို အုပ်စုဖွဲ့ပေးတဲ့ ကိုယ်ပိုင် type တွေကို
      ကြည့်သွားပါမယ်။
    sources:
      - title: "The Rust Book — The Slice Type"
