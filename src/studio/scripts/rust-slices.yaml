# Rust from zero, lesson 8: slices.
#
# The arc: a whiteboard draws the String "hello world" as eleven numbered
# bytes, frames &s[0..5] over "hello", and shows what the slice really is (a
# pointer to the first byte plus a length, borrowing s — no copy). The editor
# then builds string slices with range syntax (0..5, then the open-ended 6..),
# an array slice typed &[i32] (len and index from the slice's own start), a
# string literal annotated &str, and first_word, a function that returns a
# slice of its input. With &text[..i] highlighted, the narration asks WHY a
# returned slice beats a returned position; a second board answers it:
# clearing s while word is still in use is E0502, its three rustc labels drawn
# one per clause — the lesson is insert-only with one run, so the broken
# program is never typed.
# One run at the end.
#
# The E0502 text on board 2 was confirmed with rustc 1.98 (edition 2024) on
# the broken variant `let mut s = …; let word = first_word(&s); s.clear();
# println!("{word}");`:
#   error[E0502]: cannot borrow `s` as mutable because it is also borrowed as immutable
#   -- immutable borrow occurs here        (on &s)
#   ^^ mutable borrow occurs here          (on s.clear())
#   -- immutable borrow later used here    (on word)
# Without `mut` the same lines give E0596 instead, which is why the board's
# first line declares `let mut s`. The position-returning version
# (first_word_end -> usize) compiles and keeps a stale 5 after s.clear().
#
# Board colours: orange = the String's bytes (the data that can change, and
# the shared borrows of it), blue = the slice (frame, range, pointer + length),
# violet = what the slice sees, green = safe (no copy, caught at compile
# time), red = the error and the writer it rejects. #1e1e1e paints white.
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/rust-slices.yaml
