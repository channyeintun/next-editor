build:
  voiceProfile: pocket-alba-v1
  seed: 35

runtime:
  kind: rust-playground
  defaultMode: fixture
  fixture:
    latencyMs: 2000
    result:
      status: success
      stdout: "slice: borrow\nmiddle: [20, 30, 40]\nsum: 90\n"
      stderr: ""

scenes:
  - id: what-is-a-slice
    narration: >
      [[mark:board]] A slice is a borrowed window into part of a collection.
      [[mark:show-array]] Here's an array of five numbers, at indices zero
      through four. [[mark:show-slice]] A slice from index one up to four takes
      the three middle values — twenty, thirty, forty. [[mark:show-note]] It
      borrows them through a pointer and a length; nothing is copied.
      [[mark:board-close]] The same idea works on strings. Let's build it.
    sources:
      - title: "The Rust Book — The Slice Type"
        url: "https://doc.rust-lang.org/book/ch04-03-slices.html"
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { mark: board }
        open: true
        upsertIds: [sl-title]
      - id: show-array
        type: whiteboard.apply
        at: { mark: show-array }
        upsertIds:
          [
            sl-box0,
            sl-box1,
            sl-box2,
            sl-box3,
            sl-box4,
            sl-val0,
            sl-val1,
            sl-val2,
            sl-val3,
            sl-val4,
            sl-idx0,
            sl-idx1,
            sl-idx2,
            sl-idx3,
            sl-idx4,
          ]
      - id: show-slice
        type: whiteboard.apply
        at: { mark: show-slice }
        upsertIds: [sl-frame, sl-slicelabel]
      - id: show-note
        type: whiteboard.apply
        at: { mark: show-note }
        upsertIds: [sl-note]
      - id: close-board
        type: whiteboard.apply
        at: { mark: board-close }
        open: false

  - id: string-and-array
    narration: >
      [[mark:open]] Here's a String, and word borrows the first six bytes —
      that's a string slice, written &str. [[mark:type-arr]] Now an array. We
      slice index one up to four, and print it. Middle is a view of three
      numbers, borrowed from the array — nothing was copied.
    sources:
      - title: "The Rust Book — String Slices"
        url: "https://doc.rust-lang.org/book/ch04-03-slices.html#string-slices"
    actions:
      - id: open-main
        type: workspace.openFile
        at: { mark: open }
        path: main.rs
      - id: type-arr
        type: editor.type
        at: { mark: type-arr, offsetMs: -400 }
        target:
          file: main.rs
          after: "    println!(\"slice: {word}\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "    let numbers = [10, 20, 30, 40, 50];\n    let middle = &numbers[1..4];\n    println!(\"middle: {middle:?}\");\n"

  - id: slice-parameter
    narration: >
      [[mark:type-sum]] Why are slices useful? A function can take a slice and
      work on any length. Sum takes a slice of i32, adds up whatever it gets,
      and returns the total. [[mark:type-call]] We pass middle to it directly.
    sources:
      - title: "The Rust Book — Slices as Parameters"
        url: "https://doc.rust-lang.org/book/ch04-03-slices.html#other-slices"
    actions:
      - id: type-sum
        type: editor.type
        at: { mark: type-sum, offsetMs: -400 }
        target:
          file: main.rs
          after: "    println!(\"middle: {middle:?}\");\n}\n"
          occurrence: 1
        cadence: line-by-line
        text: "\nfn sum(slice: &[i32]) -> i32 {\n    let mut total = 0;\n    for &n in slice {\n        total += n;\n    }\n    total\n}\n"
      - id: type-call
        type: editor.type
        at: { mark: type-call }
        target:
          file: main.rs
          after: "    println!(\"middle: {middle:?}\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "    println!(\"sum: {}\", sum(middle));\n"

  - id: run
    narration: >
      [[mark:run]] Let's run it. The string slice prints borrow. The array
      slice prints its three numbers, and sum returns ninety. Slices let you
      pass parts of data safely, without copying — and the borrow checker keeps
      every view valid.
    sources:
      - title: "Rust Playground"
        url: "https://play.rust-lang.org/"
    actions:
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 800 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "sum: 90"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: "fn sum(slice: &[i32]) -> i32 {"

checks:
  - { type: timing.p95Ms, max: 300 }
