# One idea: a slice is a borrowed view into part of a collection — a pointer
# plus a length, no copy — spelled &str for strings and &[T] for arrays. A
# whiteboard sketch, then an array slice and a slice-taking function, run.
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/rust-slices.yaml
schemaVersion: 1

lesson:
  slug: rust-slices
  title: "Rust slices: a borrowed view of your data"
  locale: en-US
  workspace:
    lessonType: rust
    name: Rust Lesson
    entryFilePath: main.rs
    files:
      main.rs: |
        fn main() {
            let text = String::from("borrow checker");
            let word = &text[0..6];
            println!("slice: {word}");
        }
