build:
  voiceProfile: pocket-alba-v1
  seed: 35

runtime:
  kind: rust-playground
  defaultMode: fixture
  fixture:
    latencyMs: 600
    result:
      status: success
      stdout: "hello and world\nmiddle: 3 numbers, first 20\nfirst words: hello, slices\n"
      stderr: ""

scenes:
  - id: view
    chapter: A view into data
    narration: >
      Often you need only part of some data, like the first word of a
      sentence. Copying it out costs time and memory, so Rust gives you a
      slice instead.
      [[mark:draw-bytes]] Here's a String, s, holding hello world. Each box is
      one byte of its text, numbered from zero.
      [[mark:draw-frame]] A slice is a view of a range of those bytes. This
      one starts at zero and stops before five, so it sees hello.
      [[mark:draw-parts]] Its type is ampersand str, a string slice. It
      doesn't copy the text. It holds only a pointer to the first byte, and a
      length.
      [[mark:draw-borrow]] It's also a reference, so it borrows s, and the
      borrowing rules apply to it.
    sources:
      - title: "The Rust Book — The Slice Type"
        url: "https://doc.rust-lang.org/book/ch04-03-slices.html#the-slice-type"
      - title: "The Rust Book — String Slices"
        url: "https://doc.rust-lang.org/book/ch04-03-slices.html#string-slices"
    actions:
      # Opens in the quiet handle before the first word, already titled.
      - id: open-board-view
        type: whiteboard.apply
        at: { scene: start, offsetMs: -1500 }
        open: true
        upsertIds: [b-title]
      - id: draw-bytes
        type: whiteboard.apply
        at: { mark: draw-bytes }
        upsertIds:
          [
            b-s-label,
            b-byte0,
            b-byte1,
            b-byte2,
            b-byte3,
            b-byte4,
            b-byte5,
            b-byte6,
            b-byte7,
            b-byte8,
            b-byte9,
            b-byte10,
            b-ch0,
            b-ch1,
            b-ch2,
            b-ch3,
            b-ch4,
            b-ch6,
            b-ch7,
            b-ch8,
            b-ch9,
            b-ch10,
            b-ix0,
            b-ix1,
            b-ix2,
            b-ix3,
            b-ix4,
            b-ix5,
            b-ix6,
            b-ix7,
            b-ix8,
            b-ix9,
            b-ix10,
          ]
        drawMs: 3200
      - id: draw-frame
        type: whiteboard.apply
        at: { mark: draw-frame }
        upsertIds: [b-frame, b-range, b-result]
        drawMs: 1600
      - id: draw-parts
        type: whiteboard.apply
        at: { mark: draw-parts }
        upsertIds: [b-var-box, b-var-name, b-var-parts, b-arrow]
        drawMs: 2000
      - id: draw-borrow
        type: whiteboard.apply
        at: { mark: draw-borrow }
        upsertIds: [b-nocopy]
        drawMs: 1200

  - id: string-slices
    chapter: Slicing strings and arrays
    narration: >
      Let's write that in code. [[mark:open-main]] Here's s, our String.
      [[mark:type-hello]] To make a slice, write an ampersand, the variable,
      and a range in square brackets.
      [[mark:select-range]] Zero dot dot five starts at index zero and stops
      before five. The end isn't included, so this slice is five bytes long.
      [[mark:type-world]] You can leave out either end of a range.
      [[mark:select-open-end]] Six dot dot, with nothing after it, runs to the
      end. Leave out the start, and it begins at zero. Leave out both, and you
      get the whole string.
    sources:
      - title: "The Rust Book — String Slices"
        url: "https://doc.rust-lang.org/book/ch04-03-slices.html#string-slices"
      - title: "The Rust Reference — Range expressions"
        url: "https://doc.rust-lang.org/reference/expressions/range-expr.html"
    actions:
      - id: close-board-view
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: main.rs
      - id: type-hello
        type: editor.type
        at: { mark: type-hello }
        target:
          file: main.rs
          after: "    let s = String::from(\"hello world\");\n"
          occurrence: 1
        cadence: natural
        text: "    let hello = &s[0..5];\n"
      - id: select-range
        type: editor.select
        at: { mark: select-range }
        target:
          file: main.rs
          text: "0..5"
          occurrence: 1
      - id: type-world
        type: editor.type
        at: { mark: type-world }
        target:
          file: main.rs
          after: "    let hello = &s[0..5];\n"
          occurrence: 1
        cadence: line-by-line
        text: "    let world = &s[6..];\n    println!(\"{hello} and {world}\");\n"
      - id: select-open-end
        type: editor.select
        at: { mark: select-open-end }
        target:
          file: main.rs
          text: "6.."
          occurrence: 1

  - id: array-slices
    narration: >
      [[mark:type-array]] Slices work on arrays too. Here's an array, and a
      slice of it from index one, stopping before four.
      [[mark:select-array-type]] An array slice's type is an ampersand, then
      the element type in square brackets. There's no length in it. The slice
      carries its length, so one type fits any length.
      [[mark:select-middle-zero]] Indexes count from the start of the slice,
      so middle at zero is twenty.
    sources:
      - title: "The Rust Book — Other Slices"
        url: "https://doc.rust-lang.org/book/ch04-03-slices.html#other-slices"
      - title: "std — primitive type slice"
        url: "https://doc.rust-lang.org/std/primitive.slice.html"
    actions:
      - id: type-array
        type: editor.type
        at: { mark: type-array, offsetMs: -400 }
        target:
          file: main.rs
          after: "    println!(\"{hello} and {world}\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n    let numbers = [10, 20, 30, 40, 50];\n    let middle: &[i32] = &numbers[1..4];\n    println!(\"middle: {} numbers, first {}\", middle.len(), middle[0]);\n"
      - id: select-array-type
        type: editor.select
        at: { mark: select-array-type }
        target:
          file: main.rs
          text: "&[i32]"
          occurrence: 1
      - id: select-middle-zero
        type: editor.select
        at: { mark: select-middle-zero }
        target:
          file: main.rs
          text: "middle[0]"
          occurrence: 1

  - id: literals
    narration: >
      [[mark:type-phrase]] Now a string literal, like the ones in your first
      program. [[mark:select-literal-type]] Its type is ampersand str,
      so a literal is a string slice, too. The text is stored inside your
      compiled program, and phrase points at it. A shared reference can only read, so
      a literal can't change.
    sources:
      - title: "The Rust Book — String Literals as Slices"
        url: "https://doc.rust-lang.org/book/ch04-03-slices.html#string-literals-as-slices"
      - title: "std — primitive type str"
        url: "https://doc.rust-lang.org/std/primitive.str.html"
    actions:
      - id: type-phrase
        type: editor.type
        at: { mark: type-phrase, offsetMs: -400 }
        target:
          file: main.rs
          after: "middle.len(), middle[0]);\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n    let phrase: &str = \"slices borrow data\";\n"
      - id: select-literal-type
        type: editor.select
        at: { mark: select-literal-type }
        target:
          file: main.rs
          text: "&str"
          occurrence: 1

  - id: first-word
    chapter: Returning a slice
    narration: >
      [[mark:type-fn]] Now let's use slices in a function, first_word. It
      takes a string slice, and it returns one.
      [[mark:select-indices]] char_indices gives you each character, with its
      byte position, as a tuple. When the loop finds a space, it returns the
      slice up to that position. With no space, the whole text is one word,
      so it returns all of it.
      [[mark:select-return]] The return type is a string slice as well. So
      the result isn't a new String. It's a view into the text you passed in.
    sources:
      - title: "The Rust Book — String Slices as Parameters"
        url: "https://doc.rust-lang.org/book/ch04-03-slices.html#string-slices-as-parameters"
      - title: "std — str::char_indices"
        url: "https://doc.rust-lang.org/std/primitive.str.html#method.char_indices"
    actions:
      - id: type-fn
        type: editor.type
        at: { mark: type-fn, offsetMs: -400 }
        target:
          file: main.rs
          after: ""
          occurrence: 1
        cadence: line-by-line
        text: "fn first_word(text: &str) -> &str {\n    for (i, c) in text.char_indices() {\n        if c == ' ' {\n            return &text[..i];\n        }\n    }\n    text\n}\n\n"
      - id: select-indices
        type: editor.select
        at: { mark: select-indices }
        target:
          file: main.rs
          text: "text.char_indices()"
          occurrence: 1
      - id: select-return
        type: editor.select
        at: { mark: select-return }
        target:
          file: main.rs
          text: "-> &str"
          occurrence: 1

  - id: call
    narration: >
      [[mark:type-calls]] Let's call it with s, and with phrase.
      [[mark:select-ref-s]] For s, we pass a reference to a
      String. Rust converts it to a string slice for you, so first_word
      accepts both.
    sources:
      - title: "The Rust Book — String Slices as Parameters"
        url: "https://doc.rust-lang.org/book/ch04-03-slices.html#string-slices-as-parameters"
      - title: "The Rust Book — Implicit Deref Coercions with Functions and Methods"
        url: "https://doc.rust-lang.org/book/ch15-02-deref.html#implicit-deref-coercions-with-functions-and-methods"
    actions:
      - id: type-calls
        type: editor.type
        at: { mark: type-calls }
        target:
          file: main.rs
          after: "    let phrase: &str = \"slices borrow data\";\n"
          occurrence: 1
        cadence: line-by-line
        text: "    let word = first_word(&s);\n    let other = first_word(phrase);\n    println!(\"first words: {word}, {other}\");\n"
      - id: select-ref-s
        type: editor.select
        at: { mark: select-ref-s }
        target:
          file: main.rs
          text: "first_word(&s)"
          occurrence: 1

  - id: compiler-check
    chapter: What the compiler checks
    narration: >
      Why return a slice here, and not the position of the space, like five?
      That number isn't connected to s. Call clear to empty s, and you still
      have five, but the text is gone. Nothing warns you.
      [[mark:draw-code]] A slice is a borrow, so the compiler can check it.
      Let's make s mutable, and clear it while word is still in use.
      [[mark:draw-error]] The compiler stops with error E0502. It says s
      can't be borrowed as mutable, because it's also borrowed as immutable.
      [[mark:draw-reader]] First, word borrows s to read it.
      [[mark:draw-writer]] Then clear needs to change s.
      [[mark:draw-later]] And word is still used after that. A reader and a
      writer at the same time: the borrowing rules don't allow it.
      [[mark:draw-safe]] So the bug is caught before your program runs.
    sources:
      - title: "Rust error codes — E0502"
        url: "https://doc.rust-lang.org/error_codes/E0502.html"
      - title: "The Rust Book — String Slices"
        url: "https://doc.rust-lang.org/book/ch04-03-slices.html#string-slices"
    actions:
      # The question is asked over the code it is about: the slice first_word
      # returns. The board opens only when its code is spoken.
      - id: select-slice-return
        type: editor.select
        at: { scene: start }
        target:
          file: main.rs
          text: "&text[..i]"
          occurrence: 1
      - id: open-board-error
        type: whiteboard.apply
        at: { mark: draw-code }
        open: true
        clear: true
        upsertIds: [e-title]
      - id: draw-code
        type: whiteboard.apply
        at: { mark: draw-code }
        upsertIds: [e-line1, e-line2, e-line3, e-line4]
        drawMs: 2400
      - id: draw-error
        type: whiteboard.apply
        at: { mark: draw-error }
        upsertIds: [e-msg1, e-msg2]
        drawMs: 2400
      # One rustc label per clause, each underline on the exact span rustc
      # marks (&s, s.clear(), word).
      - id: draw-reader
        type: whiteboard.apply
        at: { mark: draw-reader }
        upsertIds: [e-u2, e-l2]
        drawMs: 1200
      - id: draw-writer
        type: whiteboard.apply
        at: { mark: draw-writer }
        upsertIds: [e-u3, e-l3]
        drawMs: 1200
      - id: draw-later
        type: whiteboard.apply
        at: { mark: draw-later }
        upsertIds: [e-u4, e-l4]
        drawMs: 1200
      - id: draw-safe
        type: whiteboard.apply
        at: { mark: draw-safe }
        upsertIds: [e-safe]
        drawMs: 1200

  - id: run
    narration: >
      Back to the code. [[mark:run]] Let's run it. Hello and world, two views
      into one String. The array slice has three numbers, and the first is
      twenty. And the first words are hello, and slices.
    sources:
      - title: "The Rust Book — The Slice Type"
        url: "https://doc.rust-lang.org/book/ch04-03-slices.html"
    actions:
      - id: close-board-error
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "first words: hello, slices"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: "return &text[..i];"

  - id: wrap
    narration: >
      So a slice is a borrowed view into a String or an array: a pointer and
      a length, with no copy, and the compiler keeps it valid. Next, structs:
      your own types that group related data.
    sources:
      - title: "The Rust Book — The Slice Type"
        url: "https://doc.rust-lang.org/book/ch04-03-slices.html#summary"
      - title: "The Rust Book — Using Structs to Structure Related Data"
        url: "https://doc.rust-lang.org/book/ch05-00-structs.html"
    actions: []

checks:
  - { type: timing.p95Ms, max: 300 }
