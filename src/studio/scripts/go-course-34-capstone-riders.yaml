      [[mark:board-course]] ဒီ program ထဲမှာ ဘယ် lesson တွေ ပါလဲ ပြန်ကြည့်ရအောင်။ [[mark:draw-m1]] ပထမ အပိုင်း သုံးပိုင်းက variable၊ loop၊ function၊ slice၊ map နဲ့ မြန်မာ စာ လို အခြေခံတွေပါ။ [[mark:draw-m2]]
      ပြီးတော့ struct၊ method၊ interface လို ကိုယ်ပိုင် type တွေ၊ [[mark:draw-m3]] error၊ closure နဲ့
      generics တွေ၊ [[mark:draw-m4]] နောက်ဆုံး အချိန်၊ goroutine၊ channel နဲ့ mutex တွေ ရောက်လာပါတယ်။
      [[mark:draw-m5]] ဒီ capstone က အဲဒါ အားလုံးကို ဖိုင် ကိုးခုထဲမှာ ပေါင်းထားတာပါ။ ဖိုင် တစ်ခုစီက
      အလုပ် တစ်ခုစီကို ယူထားလို့၊ rider တွေ ထပ်ထည့်တာ၊ report ထပ်ထည့်တာ လို ပြောင်းလဲမှုတိုင်းက ဖိုင်
