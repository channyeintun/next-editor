          type: whiteboard.apply,
          at: { mark: quiz-ask },
          upsertIds: [q-ask, q-a, q-b],
          drawMs: 1500,
        }
      - {
          id: quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-check],
          drawMs: 700,
