  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >-
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ ပါဆယ် ခုနစ်ခု ရှိပြီး၊ ပါဆယ် တစ်ခု ပို့တာ မီလီစက္ကန့် ၁၀၀
      ကြာပါတယ်။ [[mark:quiz-ask]] rider လေးယောက်နဲ့ ပို့ရင် ကြာချိန်က ဘယ်လောက် ထွက်မလဲ။ က၊ မီလီစက္ကန့် ၂၀၀
      လား၊ ဒါမှမဟုတ် ခ၊ ပါဆယ် ခုနစ်ခုကို လေးယောက်နဲ့ ညီညီ ခွဲထားတဲ့ ၁၇၅ လား။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]]
      အဖြေကတော့ က၊ မီလီစက္ကန့် ၂၀၀ ပါ။ ဘာကြောင့်လဲဆိုတော့ rider တစ်ယောက်က ပါဆယ် တစ်ခုကို တစ်ဝက်ပဲ
      ပို့လို့ မရလို့ပါ။ ပထမ အကြိမ်မှာ လေးယောက်လုံး တစ်ခုစီ ပို့ပြီး၊ ကျန်တဲ့ သုံးခုအတွက် ဒုတိယ အကြိမ် ထပ်ပို့ရတော့
      အကြိမ် နှစ်ကြိမ်စာ ကြာပါတယ်။
