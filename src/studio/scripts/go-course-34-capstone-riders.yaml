      အများဆုံးပါ။ [[mark:point-ygn]] ဒုတိယက ရန်ကုန် နှစ်ခုပါ။ [[mark:point-mlm]] တတိယမှာ မော်လမြိုင်
      တစ်ခု ပါပါတယ်။ နေပြည်တော်မှာလည်း တစ်ခု ရှိပေမဲ့ မပါလာတာက၊ အရေအတွက် တူရင် မြို့ code နဲ့ စီတဲ့
      စည်းကမ်းအရ မော်လမြိုင်က အရင် ရောက်လို့ပါ။ [[mark:point-hour]] နောက်ဆုံး စာကြောင်းကတော့ မနက်
      ဆယ့်တစ်နာရီမှာ ပါဆယ် အများဆုံး လက်ခံခဲ့တယ်လို့ ပြောတာပါ၊ အဲဒီ တစ်နာရီအတွင်းမှာ ပါဆယ် သုံးခု
      ရောက်ခဲ့ပါတယ်။
    sources:
