  - id: cash-bag
    chapter: Cash bag နဲ့ mutex
    narration: >-
      [[mark:close-map]] riders ဖိုင်ကနေ စရေးရအောင်။ [[mark:type-bag]] ပထမဆုံး rider တွေ ကောက်လာတဲ့ ငွေကို
      စုမယ့် CashBag struct ကို ရေးပါမယ်။ struct ထဲမှာ ငွေ စုစုပေါင်းနဲ့ အတူ mutex တစ်ခု ပါပါတယ်။ lesson
      သုံးဆယ့်နှစ်မှာ ပြောခဲ့သလို mutex ကို သူ ကာကွယ်ရမယ့် တန်ဖိုးရဲ့ ဘေးမှာပဲ ထားတာပါ။ [[mark:sel-add]]
      ငွေ ထည့်တဲ့ method မှာ pointer receiver ကို သုံးထားပါတယ်၊ ဒါမှ မိတ္တူထဲ မဟုတ်ဘဲ တကယ့် အိတ်ထဲကို ငွေ
      ရောက်မှာပါ။ [[mark:sel-lock]] method ရဲ့ အစမှာ lock လုပ်ပြီး၊ ပြီးခါနီးမှ unlock လုပ်ဖို့ defer နဲ့
      ချိန်းထားပါတယ်။ ငွေ သေတ္တာ သော့ တစ်ချောင်းတည်း ရှိသလိုပဲ၊ တစ်ကြိမ်မှာ rider တစ်ယောက်ပဲ ငွေ ထည့်ခွင့်
      ရပါတယ်။ ဒါကြောင့် goroutine အများက တစ်ပြိုင်နက် ခေါ်လည်း ငွေ မပျောက်ပါဘူး။
    sources:
      - { title: "sync package — Mutex", url: "https://pkg.go.dev/sync#Mutex" }
      - {
          title: "Go FAQ — Should I define methods on values or pointers?",
          url: "https://go.dev/doc/faq#methods_on_values_or_pointers",
        }
    actions:
      - {
          id: close-map,
          type: whiteboard.apply,
          at: { mark: close-map },
          open: false,
          upsertIds: [],
        }
      - { id: open-riders, type: workspace.openFile, at: { mark: type-bag }, path: riders.go }
      - id: type-bag
        type: editor.type
        at: { afterAction: open-riders }
        target: { file: riders.go, after: "package main\n", occurrence: 1 }
        text: "\nimport (\n\t\"sync\"\n\t\"time\"\n)\n\n// CashBag is the day's cash from every rider; mu guards total.\ntype CashBag struct {\n\tmu    sync.Mutex\n\ttotal int\n}\n\n// Add puts one parcel's fee into the bag; safe to call from many goroutines.\nfunc (b *CashBag) Add(amount int) {\n\tb.mu.Lock()\n\tdefer b.mu.Unlock()\n\tb.total += amount\n}\n"
        cadence: line-by-line
      - id: sel-add
        type: editor.select
        at: { mark: sel-add }
        target: { file: riders.go, text: "func (b *CashBag) Add(amount int) {", occurrence: 1 }
      - id: sel-lock
        type: editor.select
        at: { mark: sel-lock }
        target: { file: riders.go, text: "\tb.mu.Lock()\n\tdefer b.mu.Unlock()\n", occurrence: 1 }

  - id: deliver
    chapter: Rider အဖွဲ့
    narration: >-
      [[mark:type-deliver]] အောက်မှာ rider တွေကို အတူတူ ထွက်ခိုင်းမယ့် function ကို ရေးပါမယ်။ ပါဆယ် စာရင်း၊
      rider အရေအတွက်နဲ့ cash bag ရဲ့ pointer ကို ယူပါတယ်။ lesson သုံးဆယ့်တစ်က rider အဖွဲ့ ပုံစံနဲ့
      အတူတူပါပဲ၊ ဒီ တစ်ခါတော့ ပါဆယ် နံပါတ် အစား ပါဆယ် ကိုယ်တိုင်ကို လက်လွှဲပြီး၊ ရလဒ်ကိုလည်း slice ထဲ
      မထည့်ဘဲ cash bag ထဲမှာ စုပါတယ်။ [[mark:sel-jobs]] ပထမ line က ပါဆယ်တွေကို
      လက်လွှဲပေးမယ့် channel ပါ၊ လက်လွှဲ ကောင်တာ တစ်ခုလိုပါပဲ။ [[mark:sel-workers]] ပြီးတော့ rider
      အရေအတွက်အတိုင်း goroutine တွေကို wait group နဲ့ စပါတယ်။ rider တစ်ယောက်စီက channel ထဲကနေ နောက်
      ပါဆယ်ကို ယူ၊ ပို့ပြီးရင် ပို့ခကို cash bag ထဲ ထည့်ပါတယ်။ ပို့တာ တစ်ခါကို မီလီစက္ကန့် ၁၀၀ လို့
      ထားထားပါတယ်။ [[mark:sel-send]] အောက်ပိုင်းမှာ ပါဆယ် တစ်ခုချင်းကို channel ထဲ ပို့ပြီး၊ ကုန်သွားရင် close
      လုပ်ပါတယ်။ close လုပ်ပြီး ပါဆယ် ကုန်သွားတော့ rider တွေရဲ့ loop တွေ ပြီးသွားပါတယ်။ wait group ကတော့ rider အားလုံး
      ပြန်မရောက်မချင်း ဒီ function ကို မပြီးသေးအောင် ထိန်းထားပေးပါတယ်။
    sources:
      - { title: "sync package — WaitGroup.Go", url: "https://pkg.go.dev/sync#WaitGroup.Go" }
      - {
          title: "The Go Programming Language Specification — Channel types",
          url: "https://go.dev/ref/spec#Channel_types",
        }
    actions:
      - id: type-deliver
        type: editor.type
        at: { mark: type-deliver }
        target: { file: riders.go, after: "\tb.total += amount\n}\n", occurrence: 1 }
        text: "\n// deliverAll sends the riders out together; each takes the next parcel from jobs.\nfunc deliverAll(parcels []Parcel, riders int, bag *CashBag) {\n\tjobs := make(chan Parcel)\n\tvar wg sync.WaitGroup\n\tfor range riders {\n\t\twg.Go(func() {\n\t\t\tfor p := range jobs {\n\t\t\t\ttime.Sleep(100 * time.Millisecond) // one delivery\n\t\t\t\tbag.Add(p.Fee())\n\t\t\t}\n\t\t})\n\t}\n\tfor _, p := range parcels {\n\t\tjobs <- p\n\t}\n\tclose(jobs)\n\twg.Wait()\n}\n"
        cadence: line-by-line
      - id: sel-jobs
        type: editor.select
        at: { mark: sel-jobs }
        target: { file: riders.go, text: "\tjobs := make(chan Parcel)\n", occurrence: 1 }
      - id: sel-workers
        type: editor.select
        at: { mark: sel-workers }
        target:
          {
            file: riders.go,
            text: "\tfor range riders {\n\t\twg.Go(func() {\n\t\t\tfor p := range jobs {\n\t\t\t\ttime.Sleep(100 * time.Millisecond) // one delivery\n\t\t\t\tbag.Add(p.Fee())\n\t\t\t}\n\t\t})\n\t}\n",
            occurrence: 1,
          }
      - id: sel-send
        type: editor.select
        at: { mark: sel-send }
        target:
          {
            file: riders.go,
            text: "\tfor _, p := range parcels {\n\t\tjobs <- p\n\t}\n\tclose(jobs)\n\twg.Wait()\n",
            occurrence: 1,
          }

  - id: day
    chapter: တစ်နေ့လုံး ပို့ကြည့်ရအောင်
    narration: >-
      [[mark:back-main]] ဒါဆို main function ထဲမှာ ဒီ အပိုင်းတွေကို ချိတ်ဆက်ရအောင်။ [[mark:type-imports]] fmt
      နဲ့ time package နှစ်ခုကို import လုပ်ပါမယ်။ [[mark:type-main]] ပြီးတော့ စစ်လို့ အောင်တဲ့ ပါဆယ်တွေကို
      ယူ၊ zero value နဲ့ စတဲ့ cash bag တစ်ခု လုပ်၊ အချိန်ကို မှတ်ပြီး rider နှစ်ယောက်နဲ့ ပို့ခိုင်းပါမယ်။
      နောက်ဆုံး line က ဘယ်လောက် ကြာလဲ ဆိုတာနဲ့ အိတ်ထဲက ငွေ စုစုပေါင်းကို ထုတ်ပြပါတယ်။ [[mark:sel-pass]]
      cash bag ကို pointer နဲ့ ပေးလိုက်တာ သတိထားပါ။ ဒါမှ function ထဲမှာ ထည့်တဲ့ ငွေက main ထဲက အိတ်ထဲကို
      ရောက်မှာပါ။ [[mark:run-1]] ကဲ၊ run လိုက်ရအောင်။
    sources:
      - {
          title: "The Go Programming Language Specification — Address operators",
          url: "https://go.dev/ref/spec#Address_operators",
        }
      - { title: "time package — Duration", url: "https://pkg.go.dev/time#Duration" }
    actions:
      - { id: back-main, type: workspace.openFile, at: { mark: back-main }, path: main.go }
      - id: type-imports
        type: editor.type
        at: { mark: type-imports }
        target: { file: main.go, after: "package main\n", occurrence: 1 }
        text: "\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n"
        cadence: line-by-line
      - id: type-main
        type: editor.type
        at: { mark: type-main }
        target: { file: main.go, after: "func main() {\n", occurrence: 1 }
        text: "\tsent := accepted(today)\n\tvar bag CashBag\n\tstart := time.Now()\n\triders := 2\n\tdeliverAll(sent, riders, &bag)\n\tfmt.Println(time.Since(start).Round(100*time.Millisecond), formatKyat(bag.total))\n"
        cadence: line-by-line
      - id: sel-pass
        type: editor.select
        at: { mark: sel-pass }
        target: { file: main.go, text: "\tdeliverAll(sent, riders, &bag)\n", occurrence: 1 }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "400ms 34000 ကျပ်",
          timeoutMs: 8000,
        }
      - {
          id: expect-file-bag,
          type: expect.file,
          at: { afterAction: run-1 },
          path: riders.go,
          contains: "func (b *CashBag) Add(amount int) {\n\tb.mu.Lock()\n\tdefer b.mu.Unlock()\n",
        }

  - id: read-1
    narration: >-
      [[mark:point-r1]] output မှာ စာကြောင်း တစ်ကြောင်း ထွက်လာပါတယ်။ ရှေ့ဆုံးက မီလီစက္ကန့် ၄၀၀ ကြာတယ်လို့
      ပြောတာပါ။ ပါဆယ် ခုနစ်ခုကို rider နှစ်ယောက်က ခွဲပို့တော့ တစ်ယောက်က လေးခု ပို့ရလို့၊ ပို့တာ လေးကြိမ်စာ
      ကြာတာပါ။ နောက်က ၃၄၀၀၀ ကျပ်ကတော့ ပါဆယ် ခုနစ်ခုလုံးရဲ့ ပို့ခကို ပေါင်းထားတာပါ။ goroutine နှစ်ခုက
      တစ်ပြိုင်နက် ငွေ ထည့်ခဲ့ပေမဲ့ mutex ရှိလို့ တစ်ကျပ်မှ မပျောက်ပါဘူး။ [[mark:digits-note]] ငွေကို ဒီနေ့ English ဂဏန်းနဲ့ ပြထားတာကတော့၊ ပြီးခဲ့တဲ့ lesson က မြန်မာ ဂဏန်း line ကို receipt ဖိုင်မှာ ဒီ တစ်ခါ မထည့်ထားလို့ပါ။
    sources:
      - { title: "sync package — Mutex", url: "https://pkg.go.dev/sync#Mutex" }
    actions:
      - {
          id: point-r1,
          type: console.point,
          at: { mark: point-r1 },
          target: { text: "400ms 34000 ကျပ်" },
        }

  - id: report
    chapter: နေ့စဉ် report
    narration: >-
      [[mark:collapse-1]] ဒါဆို report ဖိုင်ကို ရေးရအောင်။ [[mark:type-count]] ဒီ function က ပို့ပြီးတဲ့
      ပါဆယ်တွေကို ယူပြီး map နှစ်ခုနဲ့ ရေတွက်ပါတယ်။ ပထမ map က မြို့ တစ်မြို့စီမှာ ပါဆယ် ဘယ်နှစ်ခုလဲ၊ ဒုတိယ map
      က လက်ခံတဲ့ နာရီ တစ်ခုစီမှာ ဘယ်နှစ်ခုလဲ ဆိုတာပါ။ map ထဲမှာ မရှိသေးတဲ့ key ကို ဖတ်ရင် zero value ဖြစ်တဲ့
      သုည ရလို့၊ ပေါင်းဖို့ ဘာမှ ကြိုပြင်စရာ မလိုပါဘူး။ [[mark:type-sort]] နောက်တစ်ပိုင်းက မြို့တွေကို
      စီတာပါ။ map ထဲက key တွေကို slice ထဲ စုပြီး၊ ပါဆယ် အများဆုံး မြို့ကို ရှေ့ဆုံးမှာ ထားပါတယ်။ အရေအတွက်
      တူရင်တော့ မြို့ code ရဲ့ အက္ခရာ အစဉ်နဲ့ စီပါတယ်။ map ရဲ့ အစဉ်က run တိုင်း မတူနိုင်လို့၊ ဒီလို အမြဲ
      တူတဲ့ စည်းကမ်း ထားမှ report က run တိုင်း တူမှာပါ။ ပြီးတော့ ရှေ့ဆုံး မြို့ သုံးမြို့ကိုပဲ ထုတ်ပြပါတယ်။
      [[mark:type-hour]] နောက်ဆုံး အပိုင်းက ပါဆယ် အများဆုံး လက်ခံခဲ့တဲ့ နာရီကို ရှာတာပါ။ နာရီတွေကို
      အစဉ်လိုက် စီပြီးမှ လျှောက်လို့၊ အရေအတွက် တူတဲ့ နာရီ ရှိရင်လည်း စောတဲ့ နာရီကို အမြဲ ရွေးပါတယ်။
      [[mark:type-call]] main ထဲမှာတော့ ငွေ ထုတ်ပြတဲ့ line ရဲ့ အောက်မှာ report ကို ခေါ်ပါမယ်။
      [[mark:run-2]] ကဲ၊ run လိုက်ရအောင်။
    sources:
      - { title: "Go maps in action", url: "https://go.dev/blog/maps" }
      - { title: "slices package — SortFunc", url: "https://pkg.go.dev/slices#SortFunc" }
      - { title: "slices package — Collect", url: "https://pkg.go.dev/slices#Collect" }
      - { title: "strings package — Compare", url: "https://pkg.go.dev/strings#Compare" }
    actions:
      - { id: collapse-1, type: runtime.collapseDock, at: { mark: collapse-1 } }
      - { id: open-report, type: workspace.openFile, at: { mark: type-count }, path: report.go }
      - id: type-count
        type: editor.type
        at: { afterAction: open-report }
        target: { file: report.go, after: "package main\n", occurrence: 1 }
        text: "\nimport (\n\t\"fmt\"\n\t\"maps\"\n\t\"slices\"\n\t\"strings\"\n)\n\n// printReport prints the day: the three busiest cities, then the busiest hour.\nfunc printReport(parcels []Parcel) {\n\tperCity := map[string]int{}\n\tperHour := map[int]int{}\n\tfor _, p := range parcels {\n\t\tperCity[p.To]++\n\t\tperHour[p.At.Hour()]++\n\t}\n"
        cadence: line-by-line
      - id: type-sort
        type: editor.type
        at: { mark: type-sort }
        target: { file: report.go, after: "\t\tperHour[p.At.Hour()]++\n\t}\n", occurrence: 1 }
        text: "\tcodes := slices.Collect(maps.Keys(perCity))\n\tslices.SortFunc(codes, func(a, b string) int {\n\t\tif perCity[a] != perCity[b] {\n\t\t\treturn perCity[b] - perCity[a]\n\t\t}\n\t\treturn strings.Compare(a, b)\n\t})\n\tfor _, code := range codes[:min(3, len(codes))] {\n\t\tfmt.Println(perCity[code], cityNames[code])\n\t}\n"
        cadence: line-by-line
      - id: type-hour
        type: editor.type
        at: { mark: type-hour }
        target:
          {
            file: report.go,
            after: "\t\tfmt.Println(perCity[code], cityNames[code])\n\t}\n",
            occurrence: 1,
          }
        text: "\tbusiest := 0\n\tfor _, h := range slices.Sorted(maps.Keys(perHour)) {\n\t\tif perHour[h] > perHour[busiest] {\n\t\t\tbusiest = h\n\t\t}\n\t}\n\tfmt.Println(busiest, \"နာရီမှာ အများဆုံး\")\n}\n"
        cadence: line-by-line
      - { id: open-main-2, type: workspace.openFile, at: { mark: type-call }, path: main.go }
      - id: type-call
        type: editor.type
        at: { afterAction: open-main-2 }
        target: { file: main.go, after: "formatKyat(bag.total))\n", occurrence: 1 }
        text: "\tprintReport(sent)\n"
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "11 နာရီမှာ အများဆုံး",
          timeoutMs: 8000,
        }
      - {
          id: expect-file-sort,
          type: expect.file,
          at: { afterAction: run-2 },
          path: report.go,
          contains: "\t\treturn strings.Compare(a, b)\n",
        }

