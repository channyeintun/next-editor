  - id: recap
    chapter: ပြန်ချုပ်ရရင်
    narration: >-
      [[mark:close-quiz]] ဒါဆို ပြန်ချုပ်ရရင်၊ ဒီနေ့ အလုပ်လုပ်နေပြီးသား program ထဲကို၊ [[mark:recap-deliver]]
      ဖိုင် ခြောက်ခုကို မပြင်ဘဲ ဖိုင် အသစ် နှစ်ခုနဲ့ rider တွေ တစ်ပြိုင်နက် ပို့တာကို ထည့်ခဲ့ပါတယ်။ goroutine
      အများက မျှသုံးတဲ့ ငွေကို mutex က ကာကွယ်ပေးပါတယ်။ [[mark:recap-report]] report မှာတော့ map နဲ့
      ရေတွက်ပြီး အမြဲ တူတဲ့ စည်းကမ်းနဲ့ စီလို့၊ run တိုင်း အတူတူ ထွက်ပါတယ်။ [[mark:recap-riders]] rider
      တစ်ယောက် တိုးလိုက်တော့ အချိန် လျော့သွားပေမဲ့ ရလဒ်က မပြောင်းခဲ့ပါဘူး။ ဒါနဲ့ ဒီ course ရဲ့ program ကို
      အပြီးသတ်ပါပြီ။ နောက် lesson မှာတော့ Go ကို ကိုယ့် ကွန်ပျူတာပေါ်မှာ ဘယ်လို သုံးမလဲ ဆိုတာနဲ့၊ တကယ့် Go
      project တွေမှာ code ကို ဘယ်လို test လုပ်လဲ ဆိုတာကို လေ့လာသွားပါမယ်။
    sources:
      - { title: "Effective Go — Concurrency", url: "https://go.dev/doc/effective_go#concurrency" }
    actions:
      - {
          id: close-quiz,
          type: whiteboard.apply,
          at: { mark: close-quiz },
          open: false,
          upsertIds: [],
        }
      - id: recap-deliver
        type: editor.select
        at: { mark: recap-deliver }
        target: { file: main.go, text: "\tdeliverAll(sent, riders, &bag)\n", occurrence: 1 }
      - id: recap-report
        type: editor.select
        at: { mark: recap-report }
        target: { file: main.go, text: "\tprintReport(sent)\n", occurrence: 1 }
      - id: recap-riders
        type: editor.select
        at: { mark: recap-riders }
        target: { file: main.go, text: "\triders++\n", occurrence: 1 }

checks:
  - { type: timing.p95Ms, max: 300 }
