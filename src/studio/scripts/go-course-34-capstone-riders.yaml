  - id: read-3
    narration: >-
      [[mark:point-300]] ကြာချိန်က မီလီစက္ကန့် ၃၀၀ ဖြစ်သွားပါပြီ။ rider သုံးယောက်ဆိုတော့ အများဆုံး ပို့ရတဲ့
      rider က သုံးခုပဲ ပို့ရလို့ပါ။ ငွေကတော့ ၃၄၀၀၀ ကျပ် အတူတူပါပဲ။ [[mark:point-same]] report ကလည်း
      တစ်လုံးမှ မပြောင်းပါဘူး။ rider တွေက ဘယ် ပါဆယ်ကို ယူယူ၊ ငွေကို mutex နဲ့ စုပြီး report ကို main ကမှ
      ထုတ်လို့ ရလဒ်က အမြဲ တူနေတာပါ။ line တစ်ကြောင်း ပြောင်းလိုက်ပေမဲ့ program က ပြောင်းလဲမှုကို ခံနိုင်ခဲ့ပါတယ်။
