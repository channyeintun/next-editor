# Go course, lesson 34: capstone part 2, riders and the day's report (Burmese).
#
# Start state (COURSE-KIT 3.4-3.10): nine files. The seven of lesson 33 as its final texts
# (receipt.go's formatKyat without the Myanmar digits line), never edited here; main.go holds the
# whole day's eight parcels (`today`), `accepted` and an empty main, without imports; riders.go and
# report.go hold only `package main`.
# Edits, all insert-only (final files = probe 33-three):
#   1. riders.go: imports, CashBag (mu beside total) and its pointer-receiver Add; deliverAll (a
#      jobs channel, `riders` goroutines with wg.Go, close, Wait);
#   2. main.go: imports, then the day: accepted parcels, a CashBag, two riders, elapsed time and cash
#      -> run-1: `400ms 34000 ကျပ်`;
#   3. report.go: printReport (two counting maps, the cities sorted by count then code, the top three,
#      the busiest hour); main.go: `printReport(sent)` -> run-2: the report;
#   4. main.go: `riders++` under `riders := 2` -> run-3: 300ms, the same cash and report.
# Boards: (M) lesson 33's program map with riders.go and report.go added in the fourth column;
# (C) the course on one page; (Q) the quiz (four riders: 200ms, not 175ms).
# Built by build.py from template.yaml.in; fixtures: bun ~/Documents/go-course-work/tools/sim-go.ts
# <this yaml> --write
schemaVersion: 1

lesson:
