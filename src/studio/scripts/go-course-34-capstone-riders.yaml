      main.go: |
        package main

        // today is the whole day's parcels, in the order they were handed in.
        var today = []Parcel{
        	{Code: "MDY-0001", To: "MDY", WeightKg: 2.5, At: at(9, 10)},
        	{Code: "NPT-0001", To: "NPT", WeightKg: 1, At: at(9, 40)},
        	{Code: "TGI-0001", To: "TGI", WeightKg: 22, At: at(10, 5)},
        	{Code: "YGN-0001", To: "YGN", WeightKg: 0.5, At: at(10, 30)},
        	{Code: "MDY-0002", To: "MDY", WeightKg: 4, At: at(11, 15)},
        	{Code: "MLM-0001", To: "MLM", WeightKg: 3, At: at(11, 20)},
        	{Code: "MDY-0003", To: "MDY", WeightKg: 1.5, At: at(11, 45)},
        	{Code: "YGN-0002", To: "YGN", WeightKg: 2, At: at(14, 0)},
        }

        // accepted keeps the parcels that pass checkParcel.
        func accepted(parcels []Parcel) []Parcel {
        	var ok []Parcel
        	for _, p := range parcels {
        		if checkParcel(p) == nil {
        			ok = append(ok, p)
        		}
        	}
        	return ok
        }

        func main() {
        }
      parcel.go: |
        package main

        import "time"

        // Parcel is one parcel handed in at the counter.
        type Parcel struct {
        	Code     string    // tracking code: "MDY-0001"
        	To       string    // city code: "MDY"
        	WeightKg float64   // weight in kilograms
        	At       time.Time // when it was handed in, in Myanmar Time
        }

        // cityNames holds the cities the service sends to, by code.
        var cityNames = map[string]string{
        	"YGN": "ရန်ကုန်",
        	"BGO": "ပဲခူး",
        	"NPT": "နေပြည်တော်",
        	"MLM": "မော်လမြိုင်",
        	"MDY": "မန္တလေး",
        	"TGI": "တောင်ကြီး",
        }
      fees.go: |
        package main

        // perKg is added for every whole kilogram.
        const perKg = 500

        // maxWeightKg is the heaviest parcel the service takes.
        const maxWeightKg = 20.0

        // baseFees is the fee to each city before weight, in kyats.
        var baseFees = map[string]int{
        	"YGN": 2000,
        	"BGO": 3000,
        	"NPT": 4000,
        	"MLM": 4500,
        	"MDY": 5000,
        	"TGI": 6000,
        }

        // Fee is the parcel's price: the city's base fee plus perKg for every whole kilogram.
        func (p Parcel) Fee() int {
        	return baseFees[p.To] + int(p.WeightKg)*perKg
        }
      receipt.go: |
        package main

        import "fmt"

        // formatKyat shows an amount of money: 1500 → "1500 ကျပ်".
        func formatKyat(amount int) string {
        	digits := fmt.Sprint(amount)
        	return digits + " ကျပ်"
        }

        // printReceipt prints one line for a parcel: time, code, fee, city.
        func printReceipt(p Parcel) {
        	fmt.Println(p.At.Format("15:04"), p.Code, formatKyat(p.Fee()), cityNames[p.To])
        }
      digits.go: |
        package main

        import (
        	"fmt"
        	"strconv"
        )

        // toMyanmarDigits writes n with Myanmar digits: 1500 → "၁၅၀၀".
        func toMyanmarDigits(n int) string {
        	digits := []rune(strconv.Itoa(n))
        	for i, r := range digits {
        		if r >= '0' && r <= '9' {
        			digits[i] = r - '0' + '၀'
        		}
        	}
        	return string(digits)
        }

        // fromMyanmarDigits reads Myanmar digits: "၁၅၀၀" → 1500.
        func fromMyanmarDigits(s string) (int, error) {
        	n := 0
        	for _, r := range s {
        		if r < '၀' || r > '၉' {
        			return 0, fmt.Errorf("%q is not a Myanmar digit", r)
        		}
        		n = n*10 + int(r-'၀')
        	}
        	return n, nil
        }
      clock.go: |
        package main

        import "time"

        // mmt is Myanmar Time: UTC+06:30, no daylight saving.
        var mmt = time.FixedZone("MMT", 6*60*60+30*60)

        // at is hour:minute on the course's day, Friday 2026-04-17, in Myanmar Time.
        func at(hour, minute int) time.Time {
        	return time.Date(2026, time.April, 17, hour, minute, 0, 0, mmt)
        }
      errors.go: |
        package main

        import (
        	"errors"
        	"fmt"
        )

        // ErrUnknownCity means the parcel's city code is not one the service sends to.
        var ErrUnknownCity = errors.New("unknown city")

        // OverweightError means the parcel is heavier than maxWeightKg.
        type OverweightError struct {
        	Code     string
        	WeightKg float64
        }

        func (e *OverweightError) Error() string {
        	return fmt.Sprintf("%s: %v kg is over %v kg", e.Code, e.WeightKg, maxWeightKg)
        }

        // checkParcel says why a parcel cannot be sent, or nil when it can.
        func checkParcel(p Parcel) error {
        	if _, ok := cityNames[p.To]; !ok {
        		return fmt.Errorf("%s: %w", p.Code, ErrUnknownCity)
        	}
        	if p.WeightKg > maxWeightKg {
        		return &OverweightError{Code: p.Code, WeightKg: p.WeightKg}
        	}
        	return nil
        }
      riders.go: |
        package main
      report.go: |
        package main
