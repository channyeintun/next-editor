          at: { mark: point-mdy },
          target: { text: "3 မန္တလေး" },
        }
      - { id: point-ygn, type: console.point, at: { mark: point-ygn }, target: { text: "2 ရန်ကုန်" } }
      - {
          id: point-mlm,
          type: console.point,
          at: { mark: point-mlm },
          target: { text: "1 မော်လမြိုင်" },
        }
      - {
          id: point-hour,
          type: console.point,
          at: { mark: point-hour },
          target: { text: "11 နာရီမှာ အများဆုံး" },
        }

  - id: more-riders
    chapter: Rider တစ်ယောက် ထပ်ထည့်ရင်
    narration: >-
      [[mark:collapse-2]] နောက်ဆုံး ပြောင်းလဲမှု တစ်ခု လုပ်ကြည့်ရအောင်။ ပါဆယ် များလာလို့ rider တစ်ယောက်
      ထပ်ခေါ်တယ် ဆိုပါစို့။ [[mark:type-more]] rider အရေအတွက်ရဲ့ အောက်မှာ တစ်ယောက် တိုးတဲ့ line တစ်ကြောင်း
      ထည့်ပါမယ်။ program ရဲ့ ဖွဲ့စည်းပုံ ကောင်းရင် ဒီလို ပြောင်းလဲမှုက တခြား ဘယ်နေရာကိုမှ မထိသင့်ပါဘူး။
      [[mark:run-3]] ကဲ၊ run လိုက်ရအောင်။
    sources:
