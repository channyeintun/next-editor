scenes:
  - id: recall
    chapter: Capstone ၂၊ rider တွေနဲ့ report
    narration: >-
      ပြီးခဲ့တဲ့ lesson မှာ ဖိုင် ခုနစ်ခုရှိတဲ့ program နဲ့ မနက်ပိုင်း ပါဆယ်တွေရဲ့ ပို့ခကို တွက်ပြီး ပြေစာတွေ
      ထုတ်ခဲ့ပါတယ်။ ဒီနေ့ capstone ရဲ့ ဒုတိယပိုင်းမှာတော့ တစ်နေ့လုံးရဲ့ ပါဆယ်တွေကို rider တွေက တစ်ပြိုင်နက်
      ပို့မယ်၊ ကောက်ခံတဲ့ ငွေကို မပျောက်အောင် စုမယ်၊ နောက်ဆုံး တစ်နေ့တာ report တစ်ခု ထုတ်ပါမယ်။
      [[mark:plan]] အရေးကြီးတာက အလုပ်လုပ်နေပြီးသား ဖိုင် ခြောက်ခုကို တစ်ကြောင်းမှ မပြင်ဘဲ၊ ဖိုင် အသစ် နှစ်ခု
      ထည့်ပြီး main ကနေ ခေါ်ရုံနဲ့ ဒါတွေကို ရအောင် လုပ်မှာပါ။ [[mark:sel-today]] main ဖိုင်ထဲမှာ ဒီ တစ်ခါတော့ တစ်နေ့လုံး လက်ခံထားတဲ့
      ပါဆယ် ရှစ်ခု ရှိပါတယ်။ မနက်က လေးခုအပြင်၊ ဆယ့်တစ်နာရီကျော်မှာ မန္တလေး နှစ်ခုနဲ့ မော်လမြိုင် တစ်ခု၊
      နေ့လယ် နှစ်နာရီမှာ ရန်ကုန် တစ်ခု ထပ်ရောက်လာပါတယ်။ [[mark:sel-accepted]] အောက်က function က
      ပါဆယ်တွေထဲက စစ်လို့ အောင်တဲ့ ပါဆယ်တွေကိုပဲ slice အသစ် တစ်ခုထဲ စုပေးပါတယ်။ ပြီးခဲ့တဲ့ lesson က
      ပါဆယ် စစ်တဲ့ function ကိုပဲ ပြန်သုံးထားလို့၊ တောင်ကြီး ပါဆယ် ထွက်သွားပြီး ပါဆယ် ခုနစ်ခုပဲ ကျန်မှာပါ။
    sources:
      - {
          title: "The Go Programming Language Specification — Appending to and copying slices",
          url: "https://go.dev/ref/spec#Appending_and_copying_slices",
        }
      - { title: "Effective Go — Concurrency", url: "https://go.dev/doc/effective_go#concurrency" }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }
      - id: sel-today
        type: editor.select
        at: { mark: sel-today }
        target: { file: main.go, text: "var today = []Parcel{", occurrence: 1 }
      - id: sel-accepted
        type: editor.select
        at: { mark: sel-accepted }
        target: { file: main.go, text: "func accepted(parcels []Parcel) []Parcel {", occurrence: 1 }

  - id: map
    chapter: ဖိုင် ကိုးခု
    narration: >-
      [[mark:board-map]] ပြီးခဲ့တဲ့ lesson က ဖိုင် ပုံကို ပြန်ဆွဲကြည့်ရအောင်။ [[mark:draw-old]] main ဖိုင်က
      အပေါ်ဆုံးမှာ ရှိပြီး၊ သူ ခေါ်တဲ့ receipt၊ errors၊ clock ဖိုင်တွေက အလယ်တန်းမှာ၊ ဖိုင် တိုင်း သုံးတဲ့
      digits၊ parcel၊ fees ဖိုင်တွေက အောက်တန်းမှာ ရှိပါတယ်။ [[mark:draw-same]] main ရဲ့ အောက်က ဒီ ဖိုင်
      ခြောက်ခုကို ဒီနေ့ တစ်ကြောင်းမှ မပြင်ပါဘူး။ [[mark:draw-riders]] ညာဘက်ဆုံးမှာ ဖိုင် အသစ် နှစ်ခု ထပ်ထည့်ပါမယ်။ riders
      ဖိုင်က rider တွေကို တစ်ပြိုင်နက် ထွက်ခိုင်းပြီး ငွေ စုတဲ့ နေရာပါ။ lesson နှစ်ဆယ့်ကိုးကနေ သုံးဆယ့်နှစ်အထိ
      လေ့လာခဲ့တဲ့ goroutine၊ channel နဲ့ mutex တွေ ဒီထဲမှာ ပါမှာပါ။ [[mark:draw-report]] report ဖိုင်ကတော့
      ပို့ပြီးတဲ့ ပါဆယ်တွေကို ရေတွက်ပြီး တစ်နေ့တာ အကျဉ်းချုပ်ကို ထုတ်ပေးပါတယ်။ main က rider တွေကို အရင်
      ထွက်ခိုင်းပြီးမှ report ကို ခေါ်မှာ ဖြစ်လို့၊ ကြားက မြှားလေးက အဲဒီ အစဉ်ကို ပြတာပါ။
    sources:
