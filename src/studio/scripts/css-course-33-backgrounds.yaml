# CSS course (Burmese), lesson 33 of 43: backgrounds.
#
# Narration is Burmese (voice-script.md next to this file is the same text
# with ⟪mark⟫ anchors; DESIGN.md is the span-by-span brief). Every [[mark:…]]
# sits where its action begins, at a sentence end or right after a ၊ pause.
#
# Shape: board (recall lesson 32; the background layer: colour at the bottom,
# images above it with the first on top, then border, then content) → code
# tour (dark header with the shop name, a hero with no background, today's
# special card, the reviews box from lesson 24) → the card gets a tan
# background-color (initial transparent; not inherited) → a thick dashed
# border: the tan shows in the gaps (clip defaults to border-box); the body's
# background fills the canvas (explain) → images.css tour (url() from lesson
# 12, data URIs, custom properties; image-set in one sentence) → the hero
# gets the 48 px leaf tile (repeats both ways, cut at the edges; decoration
# only) → repeat-x, no-repeat, space (3 rows, gaps), round (4 squashed rows)
# → board (168 ÷ 48 = 3.5: repeat cuts, space shares the gap, round resizes)
# → the card gets the cup badge: right top, top (one value → centre), right
# 12px bottom 8px (edge offsets) → board (percentages align the same point;
# lengths move the top-left corner) → board (keyword order, same-axis pairs,
# edge offsets in either order, -x/-y longhands) → the hero gets the photo: auto (natural size), cover
# (fills, crops), contain (fits, gap); lengths/% explained → the reviews box
# gets a cup; a scripted scroll leaves it in place (scroll); local makes it
# scroll away with the content; scroll back → board (scroll / local / fixed,
# iOS and transform caveats) → board (border/padding/content boxes; origin
# places, clip paints) → the card: origin content-box (the cup moves in by
# the padding), clip padding-box (the gaps show the page) → the shop name:
# @supports (background-clip: text) { gradient → clip: text → transparent
# text } in three visible steps → the hero as one background shorthand with
# three layers + a colour (line-by-line) → the reset gotcha on the reviews
# box (palegreen, then the shorthand wipes colour and cup, then longhand
# after it) → quiz board + recap, hand-off to borders and shadows (lesson 34).
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set(; no postcss config; no reload.
# Images come from the pinned images.css (data: URIs in custom properties,
# read with var()). A keystroke-typed var( or linear-gradient( is an unclosed
# function until its ")", and an unclosed function swallows the rest of the
# stylesheet, so every edit that types a "(" lands in the LAST rule of the
# file (nothing after it can be swallowed); edits into earlier rules are
# paren-free keywords and lengths, and the shorthand is line-by-line with
# balanced parentheses on every line. Until a new declaration is complete it
# is invalid and the previous one keeps painting (brief flashes such as the
# border vanishing at "6px" are never narrated).
#
# Measured in headless Chrome at 432 × 720 (probe/stages.ts, same anchors as
# this file, screenshots in probe/): the page is exactly 720 tall, so the
# preview never scrolls. Header 0–101 (shop name 400 × 36 at y 16), hero
# 400 × 168 at y 117, card 400 × 105 at y 339 (115 with the 6 px border),
# reviews 400 × 160 at y 461/471 (scrollHeight 275, clientHeight 158, a scroll
# to 120 clamps to 117). Leaf tile 48 × 48: repeat → 8⅓ × 3½ tiles (cut at
# the right and bottom); space → 3 rows with 12 px gaps; round → 8 × 4 tiles
# of 50 × 42. Photo 320 × 200: auto → cut at the bottom, 80 px gap on the
# right; cover → 400 × 250 (82 px cut); contain → 269 × 168 (131 px gap).
# Cup 40 × 40: right top → touches the border's inner edge; top → centred on
# the top edge; right 12px bottom 8px; origin content-box moves it 16 px left
# and 12 px up (the card's padding). Reviews cup at right 12px top 12px:
# stays at scrollTop 117 with scroll, leaves the view with local, returns at
# scrollTop 0.
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
