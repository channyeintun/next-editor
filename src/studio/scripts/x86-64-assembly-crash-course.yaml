# One shape: the smallest complete x86-64 program, built a piece at a time —
# the registers, a system call, the flags, and the exit status — each drawn on
# the whiteboard first, then written, then run once at the end.
#
# Every line of code here was assembled and executed by the runner in
# src/core/x86; the fixture output below is that run's exact text, including
# the register line. Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/x86-64-assembly-crash-course.yaml
schemaVersion: 1

lesson:
  slug: x86-64-assembly-crash-course
  title: "x86-64 assembly: registers, a system call, and the flags"
  locale: en-US
  workspace:
    lessonType: asm
    name: Assembly Lesson
    entryFilePath: main.asm
    # One file is the whole lesson, so the tree would be a list of one.
    sidebarStartsCollapsed: true
    files:
      main.asm: |
        ; A program with no C library. Nothing called it, so there is nowhere to
        ; return to. It starts at _start, and it stops by asking the kernel to stop it.

        section .data

        section .bss

        section .text
            global _start

        _start:
            mov     rax, 60
            syscall
