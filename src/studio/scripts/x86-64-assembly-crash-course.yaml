build:
  voiceProfile: pocket-alba-v1
  seed: 29

runtime:
  kind: asm-playground
  # Nothing runs until the last scene, so the dock would otherwise hold 288px
  # open over an empty console for the whole lesson.
  dockStartsCollapsed: true
  defaultMode: fixture
  fixture:
    latencyMs: 200
    result:
      status: success
      stdout: "Hello, x86-64!\n15\n"
      stderr: ""
      exitCode: 15
      registers:
        - { name: rax, value: "60" }
        - { name: rdx, value: "3" }
        - { name: rbx, value: "15" }
        - { name: rsi, value: "4206609" }
        - { name: rdi, value: "15" }
      flags:
        carry: false
        zero: false
        sign: false
        overflow: false
        parity: true
        adjust: false

checks:
  - { type: timing.p95Ms, max: 300 }

scenes:
  - id: machine
    narration: >
      Every language you've written so far has been standing between you and the
      processor. Let's take it away and see what's left.
      [[mark:machine-draw-regs]] There are sixteen places to put a value. They're
      called registers, they're inside the processor itself, and each one holds
      sixty-four bits. That's all the storage the processor has of its own.
      [[mark:machine-draw-names]] They have names, and the names are the whole
      vocabulary of the language. We'll go through what each one is for in a
      moment.
      [[mark:machine-draw-mem]] Everything else lives in memory, which is outside,
      and which you reach by address. Moving a value between the two is something
      you ask for by name, every time.
      [[mark:machine-draw-note]] And the processor does one instruction, then the
      next one. There's no garbage collector waiting, no runtime starting up, and
      nothing checking your work. What you write is what runs.
      So before we write anything, let's deal with the sixteen names, because
      that's the part that looks arbitrary and isn't.
    sources:
      - {
          title: "Intel 64 and IA-32 Architectures Software Developer Manuals",
          url: "https://www.intel.com/content/www/us/en/developer/articles/technical/intel-sdm.html",
        }
      - {
          title: "System V Application Binary Interface, AMD64 Processor Supplement",
          url: "https://gitlab.com/x86-psABIs/x86-64-ABI",
        }
    actions:
      - id: machine-open-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -1700 }
        open: true
      - id: machine-draw-title
        type: whiteboard.apply
        at: { scene: start, offsetMs: -1200 }
        upsertIds: [a-title]
        drawMs: 700
      - id: machine-draw-regs
        type: whiteboard.apply
        at: { mark: machine-draw-regs }
        upsertIds: [a-cpu, a-cpu-t, a-reg-note]
        drawMs: 900
      - id: machine-draw-names
        type: whiteboard.apply
        at: { mark: machine-draw-names }
        upsertIds: [a-reg1, a-reg2, a-reg3]
        drawMs: 1000
      - id: machine-draw-mem
        type: whiteboard.apply
        at: { mark: machine-draw-mem }
        upsertIds: [a-arrow, a-mem, a-mem-t, a-mem-1, a-mem-2]
        drawMs: 1200
      - id: machine-draw-note
        type: whiteboard.apply
        at: { mark: machine-draw-note }
        upsertIds: [a-note]
        drawMs: 800

  - id: names
    narration: >
      [[mark:names-title]] The names come from a processor much older than this
      one, and they're abbreviations. a is for accumulator, c is for counter, d
      is for data, b is for base. sp is the stack pointer, bp is the base
      pointer, and si and di are source index and destination index. Then r8 up
      to r15, which were added later and never got a story.
      [[mark:names-hw]] Almost all of them will hold anything you put in them. But
      there are three different kinds of rule about which one to use, and telling
      the three apart is most of what confuses people early.
      [[mark:names-hw-rows]] The first kind the processor enforces, and you have no
      say in it. rsp is the stack pointer: push, pop, call and ret all change it
      whether you name it or not. rcx is the count, so shifting by a variable
      amount reads rcx, and so does the loop instruction. And multiply and divide
      always work on rax and rdx together, even though neither one appears in the
      line you write. Use those registers for something else and the next multiply
      quietly destroys your value.
      [[mark:names-conv]] The second kind is an agreement. Nothing inside the
      processor says the first argument to a system call goes in rdi. Linux says
      so, and every program on the machine follows it.
      [[mark:names-conv-rows]] rdi, rsi, rdx, r10, r8, r9, in that order, and the
      number of the call in rax. The answer comes back in rax too.
      [[mark:names-r10]] One detail in that row is worth keeping. The fourth one is
      r10, not rcx. When you call an ordinary function the fourth argument does go
      in rcx, but the syscall instruction destroys rcx on its way into the kernel,
      so the kernel had to be handed a different register. It's the kind of thing
      that looks like a typo until you know why.
      [[mark:names-yours]] The third kind is no rule at all. rbx, rbp, and r12
      through r15 hold whatever you decide, and nothing will take them from you.
      So when you read a line and wonder why that register and not another, the
      answer is always one of three. The processor needs it
      there, Linux asked for it there, or whoever wrote the line just picked one.
      [[mark:names-to-code]] Let's go and see the first two of those in a real
      program.
    sources:
      - {
          title: "System V Application Binary Interface, AMD64 Processor Supplement",
          url: "https://gitlab.com/x86-psABIs/x86-64-ABI",
        }
      - {
          title: "syscall(2) — Linux manual page",
          url: "https://man7.org/linux/man-pages/man2/syscall.2.html",
        }
    actions:
      - id: names-open-board
        type: whiteboard.apply
        at: { mark: names-title, offsetMs: -600 }
        open: true
        clear: true
        upsertIds: [n-title]
        drawMs: 700
      - id: names-draw-hw
        type: whiteboard.apply
        at: { mark: names-hw }
        upsertIds: [n-hw, n-hw-line]
        drawMs: 700
      - id: names-draw-hw-rows
        type: whiteboard.apply
        at: { mark: names-hw-rows }
        upsertIds: [n-rsp, n-rcx-hw, n-raxdx]
        drawMs: 1400
      - id: names-draw-conv
        type: whiteboard.apply
        at: { mark: names-conv }
        upsertIds: [n-conv, n-conv-line]
        drawMs: 700
      - id: names-draw-conv-rows
        type: whiteboard.apply
        at: { mark: names-conv-rows }
        upsertIds: [n-args, n-rax-call]
        drawMs: 1100
      - id: names-draw-r10
        type: whiteboard.apply
        at: { mark: names-r10 }
        upsertIds: [n-r10-ring]
        drawMs: 700
      - id: names-draw-yours
        type: whiteboard.apply
        at: { mark: names-yours }
        upsertIds: [n-yours, n-yours-line, n-rest]
        drawMs: 1000
      - id: names-close-board
        type: whiteboard.apply
        at: { mark: names-to-code }
        open: false

  - id: widths
    narration: >
      [[mark:widths-title]] One more thing about registers, and it catches
      everybody once. Each one has four names, and they aren't four registers.
      They're four sizes of the same one.
      [[mark:widths-draw64]] rax is the whole thing, all sixty-four bits.
      [[mark:widths-draw32]] eax is the low thirty-two of that same register.
      [[mark:widths-draw16]] ax is the low sixteen, [[mark:widths-draw8]] and al is
      the low eight. Change al and you have changed part of rax, because there was
      only ever one register there. Every register works this way: rcx has ecx, cx
      and cl, and r8 has r8d, r8w and r8b.
      [[mark:widths-rule]] There's one rule about them that will surprise you.
      Writing to a thirty-two bit name clears the top half to zero. Writing to a
      sixteen or eight bit name leaves the rest exactly as it was. So xor eax, eax
      sets the whole of rax to zero, and it takes fewer bytes than saying rax,
      which is why you'll see it everywhere.
      [[mark:widths-to-code]] Now let's write the program.
    sources:
      - {
          title: "Intel 64 and IA-32 Architectures Software Developer Manuals",
          url: "https://www.intel.com/content/www/us/en/developer/articles/technical/intel-sdm.html",
        }
      - {
          title: "System V Application Binary Interface, AMD64 Processor Supplement",
          url: "https://gitlab.com/x86-psABIs/x86-64-ABI",
        }
    actions:
      - id: widths-open-board
        type: whiteboard.apply
        at: { mark: widths-title, offsetMs: -600 }
        open: true
        clear: true
        upsertIds: [w-title]
        drawMs: 700
      - id: widths-draw-64
        type: whiteboard.apply
        at: { mark: widths-draw64 }
        upsertIds: [w-lab64, w-box64]
        drawMs: 800
      - id: widths-draw-32
        type: whiteboard.apply
        at: { mark: widths-draw32 }
        upsertIds: [w-lab32, w-box32]
        drawMs: 800
      - id: widths-draw-16
        type: whiteboard.apply
        at: { mark: widths-draw16 }
        upsertIds: [w-lab16, w-box16]
        drawMs: 700
      - id: widths-draw-8
        type: whiteboard.apply
        at: { mark: widths-draw8 }
        upsertIds: [w-lab8, w-box8]
        drawMs: 700
      - id: widths-draw-rule
        type: whiteboard.apply
        at: { mark: widths-rule }
        upsertIds: [w-rule]
        drawMs: 900
      - id: widths-close-board
        type: whiteboard.apply
        at: { mark: widths-to-code }
        open: false

  - id: skeleton
    narration: >
      [[mark:skeleton-open]] Here's the file we're starting from. It's already a
      complete program, and it's almost empty, which tells you something about how
      little a program actually needs. [[mark:skeleton-sections]] A section is a
      region with one job. Dot text holds instructions. Dot data holds bytes you
      wrote down yourself, and it's empty so far. The assembler keeps them apart
      because the two get different permissions once the program is loaded: you can
      run the first one, and you can change the second one.
      [[mark:skeleton-start]] Then there's underscore start. That's where execution
      begins. It isn't main, and the difference matters. Nothing called us, so
      there's nowhere to return to. [[mark:skeleton-exit]] Which is why the file
      ends with a request to stop. Sixty is the number for exit, and syscall is
      how you hand the request over. Take those two lines away and the processor
      keeps going into whatever bytes come next.
    sources:
      - { title: "NASM Manual", url: "https://www.nasm.us/doc/" }
      - {
          title: "_exit(2) — Linux manual page",
          url: "https://man7.org/linux/man-pages/man2/_exit.2.html",
        }
    actions:
      - {
          id: skeleton-open-file,
          type: workspace.openFile,
          at: { mark: skeleton-open },
          path: main.asm,
        }
      - id: skeleton-select-sections
        type: editor.select
        at: { mark: skeleton-sections, offsetMs: 900 }
        target: { file: main.asm, text: "section .text\n", occurrence: 1 }
      - id: skeleton-select-start
        type: editor.select
        at: { mark: skeleton-start, offsetMs: 400 }
        target: { file: main.asm, text: "_start:", occurrence: 1 }
      - id: skeleton-select-exit
        type: editor.select
        at: { mark: skeleton-exit, offsetMs: 500 }
        target: { file: main.asm, text: "    mov     rax, 60\n    syscall\n", occurrence: 1 }

  - id: data
    narration: >
      [[mark:data-type]] Let's give the program something to say. These two lines go
      in the data section. [[mark:data-explain-db]] db means define bytes, and it
      lays down exactly what you write, in order. The text becomes its bytes, and
      then a ten, which is the newline character. There's no length stored anywhere,
      and no zero at the end. It's the bytes and nothing more.
      [[mark:data-explain-len]] The second line is worth slowing down for. The dollar
      sign means the address right here, at this line. So dollar sign minus msg is
      the distance from the start of the text to the end of it, which is its length.
      The assembler works that out while it's assembling, so the number is already in
      the program before it runs. If you edit the message later, the length follows
      on its own.
    sources:
      - { title: "NASM Manual — Pseudo-Instructions", url: "https://www.nasm.us/doc/nasmdoc3.html" }
      - { title: "NASM Manual — Expressions", url: "https://www.nasm.us/doc/nasmdoc3.html" }
    actions:
      - id: data-type-lines
        type: editor.type
        at: { mark: data-type, offsetMs: -300 }
        target: { file: main.asm, after: "section .data\n", occurrence: 1 }
        cadence: line-by-line
        text: "    msg     db  \"Hello, x86-64!\", 10\n    msglen  equ $ - msg\n"
      - id: data-select-db
        type: editor.select
        at: { mark: data-explain-db, offsetMs: 200 }
        target: { file: main.asm, text: 'db  "Hello, x86-64!", 10', occurrence: 1 }
      - id: data-select-len
        type: editor.select
        at: { mark: data-explain-len, offsetMs: 700 }
        target: { file: main.asm, text: "$ - msg", occurrence: 1 }

  - id: syscall
    narration: >
      [[mark:syscall-board]] So how does a program with no library print anything?
      It asks the operating system, through the agreement we just drew.
      [[mark:syscall-draw-args]] Here's that same row, filled in for the call we
      want. Write is call number one. Its first argument is which file to write
      to, and standard output is file one. Its second is where the bytes are, and
      its third is how many of them.
      [[mark:syscall-draw-call]] Then one instruction, syscall, hands control to
      the kernel. Your program stops where it is, the kernel does the work, and
      your program carries on at the next line. [[mark:syscall-draw-back]] The
      answer comes back in rax, and for write the answer is how many bytes it
      actually took. That's the whole interface. Every file a program opens, every
      byte it prints, every process it starts goes through those six registers and
      this one instruction.
      [[mark:syscall-to-code]] Let's write it.
      [[mark:syscall-type]] One into rax, because we want write. One into rdi,
      because that's standard output. The address of the message into rsi, and its
      length into rdx. [[mark:syscall-select-syscall]] Then syscall, and the
      message is on the screen.
    sources:
      - {
          title: "syscall(2) — Linux manual page",
          url: "https://man7.org/linux/man-pages/man2/syscall.2.html",
        }
      - {
          title: "write(2) — Linux manual page",
          url: "https://man7.org/linux/man-pages/man2/write.2.html",
        }
    actions:
      - id: syscall-open-board
        type: whiteboard.apply
        at: { mark: syscall-board, offsetMs: -400 }
        open: true
        clear: true
        upsertIds: [b-title]
        drawMs: 700
      - id: syscall-draw-args
        type: whiteboard.apply
        at: { mark: syscall-draw-args }
        upsertIds: [b-rax, b-rdi, b-rsi, b-rdx]
        drawMs: 1300
      - id: syscall-draw-call
        type: whiteboard.apply
        at: { mark: syscall-draw-call }
        upsertIds: [b-call, b-arrow, b-kernel, b-kernel-t]
        drawMs: 1100
      - id: syscall-draw-back
        type: whiteboard.apply
        at: { mark: syscall-draw-back }
        upsertIds: [b-back]
        drawMs: 800
      - id: syscall-close-board
        type: whiteboard.apply
        at: { mark: syscall-to-code }
        open: false
      - id: syscall-type-write
        type: editor.type
        at: { mark: syscall-type, offsetMs: -400 }
        target: { file: main.asm, after: "_start:\n", occurrence: 1 }
        cadence: line-by-line
        text: "    ; write(1, msg, msglen)\n    mov     rax, 1              ; 1 is write\n    mov     rdi, 1              ; 1 is standard output\n    mov     rsi, msg            ; where the bytes are\n    mov     rdx, msglen         ; how many\n\n    syscall\n\n"
      - id: syscall-select-instruction
        type: editor.select
        at: { mark: syscall-select-syscall, offsetMs: 200 }
        target: { file: main.asm, text: "    syscall\n", occurrence: 1 }

  - id: flags
    narration: >
      [[mark:flags-board]] There's one more idea, and it's the one that gives you
      loops and conditions. [[mark:flags-draw-dec]] Most instructions leave a note
      about what happened. dec takes one away from a register.
      [[mark:flags-draw-count]] Run it on a five and you get four, then three, and
      so on. [[mark:flags-draw-zf]] And when the result reaches zero, the processor
      turns on a single bit called the zero flag. [[mark:flags-draw-jnz]] jnz reads
      that bit, and jumps only while it's off. So the counting and the deciding are
      two separate instructions, and the flag is the message between them.
      [[mark:flags-to-code]] Here's the loop.
      [[mark:flags-type]] The count goes in rcx, which is the one the processor
      reads without being told, and the running total goes in rbx, which is one of
      the registers nobody has a claim on. rbx starts at zero, and xor of a value
      with itself is the shortest way to write zero. Then we add, take one away,
      and jump back. [[mark:flags-select-dec]] That's five
      plus four plus three plus two plus one, and no instruction here compares
      anything. dec left the note, and jnz read it.
    sources:
      - {
          title: "Intel 64 and IA-32 Architectures Software Developer Manuals",
          url: "https://www.intel.com/content/www/us/en/developer/articles/technical/intel-sdm.html",
        }
      - {
          title: "NASM Manual — Instruction Reference",
          url: "https://www.nasm.us/doc/nasmdocb.html",
        }
    actions:
      - id: flags-open-board
        type: whiteboard.apply
        at: { mark: flags-board, offsetMs: -400 }
        open: true
        clear: true
        upsertIds: [c-title]
        drawMs: 700
      - id: flags-draw-dec
        type: whiteboard.apply
        at: { mark: flags-draw-dec }
        upsertIds: [c-dec]
        drawMs: 700
      - id: flags-draw-count
        type: whiteboard.apply
        at: { mark: flags-draw-count }
        upsertIds: [c-count]
        drawMs: 900
      - id: flags-draw-zf
        type: whiteboard.apply
        at: { mark: flags-draw-zf }
        upsertIds: [c-zf-ring, c-zf, c-zf-t]
        drawMs: 1100
      - id: flags-draw-jnz
        type: whiteboard.apply
        at: { mark: flags-draw-jnz }
        upsertIds: [c-jnz]
        drawMs: 800
      - id: flags-close-board
        type: whiteboard.apply
        at: { mark: flags-to-code }
        open: false
      - id: flags-type-loop
        type: editor.type
        at: { mark: flags-type, offsetMs: -400 }
        target: { file: main.asm, after: "    syscall\n\n", occurrence: 1 }
        cadence: line-by-line
        text: "    ; Add 5 + 4 + 3 + 2 + 1, counting down in rcx.\n    mov     rcx, 5\n    xor     rbx, rbx\n\n.sum:\n    add     rbx, rcx\n    dec     rcx                 ; dec sets the zero flag when rcx reaches zero\n    jnz     .sum                ; jnz reads that flag\n\n"
      - id: flags-select-dec
        type: editor.select
        at: { mark: flags-select-dec, offsetMs: 900 }
        target: { file: main.asm, text: "    dec     rcx", occurrence: 1 }

  - id: stack
    narration: >
      [[mark:stack-board]] That total is fifteen. Let's print it, and to print it
      we need a routine we can call. Which means the stack.
      [[mark:stack-draw-box]] The stack is a region of memory, and rsp is the
      register that points at the newest thing on it. It grows downwards, so
      older values sit at higher addresses. That's it. There's no special stack
      hardware, only a register and an agreement about which way it moves.
      [[mark:stack-draw-pushpop]] push moves rsp along and stores a value there.
      pop reads a value and moves rsp back. Two instructions, and between them
      you have somewhere to put things you'll need later.
      [[mark:stack-draw-callret]] And that's how a function works. call pushes the
      address of the line after it, then jumps. ret pops that address and goes
      back to it. [[mark:stack-note]] So a function isn't a language feature here.
      It's a jump that wrote down where it came from.
      [[mark:stack-to-code]] Let's call one.
      [[mark:stack-type-call]] The number we want printed goes in rdi, because
      that's where the agreement says a first argument goes, and then we call.
      [[mark:stack-type-exit]] After the call we exit with rbx, and rbx is the
      interesting part. The routine is going to need a register to work in, and
      the agreement says rbx is one it has to give back. So the total is still
      here when we ask for it.
      [[mark:stack-type-shell]] Here's the routine itself, with nothing in the
      middle yet. It borrows rbx by pushing it, and the last thing before ret
      pops it back. [[mark:stack-select-push]] Delete those two lines and the
      program prints the same thing and exits with the wrong number, because the
      routine would have handed back a total it had overwritten.
    sources:
      - {
          title: "System V Application Binary Interface, AMD64 Processor Supplement",
          url: "https://gitlab.com/x86-psABIs/x86-64-ABI",
        }
      - {
          title: "Intel 64 and IA-32 Architectures Software Developer Manuals",
          url: "https://www.intel.com/content/www/us/en/developer/articles/technical/intel-sdm.html",
        }
    actions:
      - id: stack-open-board
        type: whiteboard.apply
        at: { mark: stack-board, offsetMs: -500 }
        open: true
        clear: true
        upsertIds: [s-title]
        drawMs: 700
      - id: stack-draw-box
        type: whiteboard.apply
        at: { mark: stack-draw-box }
        upsertIds: [s-box, s-top, s-grow]
        drawMs: 1100
      - id: stack-draw-pushpop
        type: whiteboard.apply
        at: { mark: stack-draw-pushpop }
        upsertIds: [s-push, s-pop]
        drawMs: 900
      - id: stack-draw-callret
        type: whiteboard.apply
        at: { mark: stack-draw-callret }
        upsertIds: [s-call, s-ret]
        drawMs: 900
      - id: stack-draw-note
        type: whiteboard.apply
        at: { mark: stack-note }
        upsertIds: [s-note]
        drawMs: 800
      - id: stack-close-board
        type: whiteboard.apply
        at: { mark: stack-to-code }
        open: false
      - id: stack-type-call
        type: editor.type
        at: { mark: stack-type-call, offsetMs: -400 }
        target:
          {
            file: main.asm,
            after: "    jnz     .sum                ; jnz reads that flag\n\n",
            occurrence: 1,
          }
        cadence: line-by-line
        text: "    mov     rdi, rbx            ; the total is the argument\n    call    print_number\n\n"
      - id: stack-type-exit
        type: editor.type
        at: { mark: stack-type-exit, offsetMs: -300 }
        target: { file: main.asm, after: "    mov     rax, 60\n", occurrence: 1 }
        cadence: line-by-line
        text: "    mov     rdi, rbx            ; rbx survived the call, so the total is still here\n"
      - id: stack-type-shell
        type: editor.type
        at: { mark: stack-type-shell, offsetMs: -400 }
        target:
          {
            file: main.asm,
            after: "    mov     rdi, rbx            ; rbx survived the call, so the total is still here\n    syscall\n",
            occurrence: 1,
          }
        cadence: line-by-line
        text: "\n; print_number - print the number in rdi as decimal digits, then a newline.\nprint_number:\n    push    rbx                 ; rbx belongs to whoever called us\n\n    pop     rbx                 ; give it back exactly as we found it\n    ret\n"
      - id: stack-select-push
        type: editor.select
        at: { mark: stack-select-push, offsetMs: 400 }
        target:
          {
            file: main.asm,
            text: "    push    rbx                 ; rbx belongs to whoever called us\n",
            occurrence: 1,
          }

  - id: digits
    narration: >
      [[mark:digits-board]] The routine has to turn a number into characters,
      and that needs two ideas we haven't met. The first is what square brackets
      mean.
      [[mark:digits-draw-addr]] Without brackets, a name is an address — a number
      saying where something is.
      [[mark:digits-draw-mem]] With brackets around it, you're talking about the
      value living at that address. One line moves a pointer, the other reaches
      through it. Getting these two confused is the single most common mistake
      in early assembly.
      [[mark:digits-draw-lea]] And lea looks like it reads memory and doesn't. It
      does the arithmetic inside the brackets and hands you the answer as a
      number. [[mark:digits-note]] It's how you say "nineteen bytes past digits"
      without going and looking there.
      [[mark:digits-to-code]] The second idea is division.
      [[mark:digits-type-bss]] First, somewhere to put the characters. The bss
      section is space the program asks for and doesn't fill in, so it costs
      nothing in the file itself and arrives full of zeroes.
      [[mark:digits-type-body]] Now the routine.
      [[mark:digits-say-div]] Division is the clearest case of the processor
      choosing your registers for you. div takes one operand — what to divide by
      — and everything else is fixed. It reads rdx and rax together as one very
      wide number, it leaves the answer in rax, and it leaves the remainder in
      rdx. [[mark:digits-select-xor]] That's why the line above it clears rdx.
      Leave a stale value there and the division is a different sum, or the
      program stops because the answer doesn't fit.
      [[mark:digits-say-loop]] So each turn of the loop divides by ten and takes
      one digit off the end, from the right. Adding the character zero turns a
      remainder of five into the character five, and the digits get written
      backwards into the buffer, which is exactly the order they need to be in.
      [[mark:digits-say-write]] Then the length is worked out by subtracting where
      we stopped from the end of the buffer, and one more write puts it on the
      screen.
    sources:
      - {
          title: "Intel 64 and IA-32 Architectures Software Developer Manuals",
          url: "https://www.intel.com/content/www/us/en/developer/articles/technical/intel-sdm.html",
        }
      - { title: "NASM Manual — Effective Addresses", url: "https://www.nasm.us/doc/nasmdoc3.html" }
    actions:
      - id: digits-open-board
        type: whiteboard.apply
        at: { mark: digits-board, offsetMs: -500 }
        open: true
        clear: true
        upsertIds: [m-title]
        drawMs: 700
      - id: digits-draw-addr
        type: whiteboard.apply
        at: { mark: digits-draw-addr }
        upsertIds: [m-a]
        drawMs: 700
      - id: digits-draw-mem
        type: whiteboard.apply
        at: { mark: digits-draw-mem }
        upsertIds: [m-b, m-c]
        drawMs: 1000
      - id: digits-draw-lea
        type: whiteboard.apply
        at: { mark: digits-draw-lea }
        upsertIds: [m-d]
        drawMs: 700
      - id: digits-draw-note
        type: whiteboard.apply
        at: { mark: digits-note }
        upsertIds: [m-note]
        drawMs: 800
      - id: digits-close-board
        type: whiteboard.apply
        at: { mark: digits-to-code }
        open: false
      - id: digits-type-bss
        type: editor.type
        at: { mark: digits-type-bss, offsetMs: -400 }
        target: { file: main.asm, after: "section .bss\n", occurrence: 1 }
        cadence: line-by-line
        text: "    digits  resb 20         ; room for the digits, filled with zeroes\n"
      - id: digits-type-body
        type: editor.type
        at: { mark: digits-type-body, offsetMs: -400 }
        target:
          {
            file: main.asm,
            after: "    push    rbx                 ; rbx belongs to whoever called us\n\n",
            occurrence: 1,
          }
        cadence: line-by-line
        text: "    mov     rax, rdi\n    mov     rbx, 10             ; the divisor\n    lea     rsi, [digits + 19]  ; the last byte of the buffer\n    mov     byte [rsi], 10      ; put the newline there first\n\n.next:\n    dec     rsi\n    xor     rdx, rdx            ; div reads rdx:rax, so clear the high half\n    div     rbx                 ; rax = rax / 10, rdx = rax % 10\n    add     dl, '0'             ; a remainder of 7 becomes the character '7'\n    mov     [rsi], dl\n    test    rax, rax\n    jnz     .next\n\n    lea     rdx, [digits + 20]\n    sub     rdx, rsi            ; how many characters we wrote\n    mov     rax, 1\n    mov     rdi, 1\n    syscall\n\n"
      - id: digits-select-xor
        type: editor.select
        at: { mark: digits-select-xor, offsetMs: 500 }
        target:
          {
            file: main.asm,
            text: "    xor     rdx, rdx            ; div reads rdx:rax, so clear the high half\n",
            occurrence: 1,
          }

  - id: run
    narration: >
      [[mark:run-press]] That's the whole program. Let's run it.
      [[mark:run-read]] There's the message, there's the total printed by our
      routine, and there's the exit status: fifteen, which is five plus four plus
      three plus two plus one. The value a program exits with is a number the
      operating system keeps, and it's how a shell script finds out whether a
      program worked.
      [[mark:run-registers]] Underneath are the registers the program changed, in
      hexadecimal, and every one of them is one of the three kinds of rule. rax
      holds sixty, which is the exit call, and rdi holds fifteen, its argument —
      both of those are the agreement. rdx holds three, left over from the last
      division, because div puts the remainder there whether you want it or not.
      rsi points into the digit buffer. And rbx holds fifteen because we chose
      rbx, and because the routine gave it back.
      [[mark:run-close]] So that's assembly. Sixteen registers with three kinds of
      rule about them, memory you reach through brackets, flags that remember what
      the last instruction did, a stack that makes functions possible, and one
      instruction that asks the operating system for everything else. There isn't
      a layer underneath this one. Everything you have written in every other
      language becomes something like what's on this screen.
    sources:
      - {
          title: "exit_group(2) — Linux manual page",
          url: "https://man7.org/linux/man-pages/man2/exit_group.2.html",
        }
      - {
          title: "System V Application Binary Interface, AMD64 Processor Supplement",
          url: "https://gitlab.com/x86-psABIs/x86-64-ABI",
        }
    actions:
      - id: run-program
        type: runtime.run
        at: { mark: run-press, offsetMs: -200 }
        timeoutMs: 15000
      - id: run-expect-message
        type: expect.output
        at: { afterAction: run-program }
        contains: "Hello, x86-64!"
        timeoutMs: 15000
      - id: run-expect-status
        type: expect.output
        at: { afterAction: run-expect-message }
        contains: "Program exited with status 15"
        timeoutMs: 15000
      - id: run-expect-total
        type: expect.output
        at: { afterAction: run-expect-message }
        contains: "15"
        timeoutMs: 15000
      - id: run-expect-registers
        type: expect.output
        at: { afterAction: run-expect-status }
        contains: "rbx=0xf"
        timeoutMs: 15000
      - id: run-check-loop
        type: expect.file
        at: { afterAction: run-expect-registers }
        path: main.asm
        contains: "jnz     .sum"
      - id: run-check-routine
        type: expect.file
        at: { afterAction: run-check-loop }
        path: main.asm
        contains: "call    print_number"
