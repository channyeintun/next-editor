      kind: rectangle
      x: 290
      y: 220
      width: 360
      height: 300
      strokeColor: "#1971c2"
    - id: a-cpu-t
      kind: text
      x: 312
      y: 236
      width: 320
      height: 36
      text: "registers"
      strokeColor: "#1971c2"
      fontSize: 28
    - id: a-reg1
      kind: text
      x: 316
      y: 296
      width: 320
      height: 36
      text: "rax   rbx   rcx   rdx"
      strokeColor: "#1e1e1e"
      fontSize: 26
    - id: a-reg2
      kind: text
      x: 316
      y: 346
      width: 320
      height: 36
      text: "rsi   rdi   rsp   rbp"
      strokeColor: "#1e1e1e"
