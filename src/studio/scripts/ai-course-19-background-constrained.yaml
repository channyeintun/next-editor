      src/helper.js: |
        // The staff page's description helper (constrained AI): လှလှ presses one button for one fixed task.
        // The system prompt fixes the task, the format and the limits; only the item comes from the page.
        import { panel } from "ai-panel";
        import { generate } from "./llm.js";
        import { el, smallButton } from "./page.js";

        const system = [
          "You write menu descriptions for a tea shop in Yangon.",
          "Write three different descriptions in Burmese for the item, each under 60 characters, in a warm, spoken style.",
          "No prices, no phone numbers, no claims such as best or free, no emoji.",
          'Reply with one JSON object and nothing else, no code fences: {"descriptions": ["...", "...", "..."]}',
        ].join(" ");
        const MORE = "Write three new descriptions that are different from your last answer. Do not repeat any of them.";

        const ask = (item) => [{ role: "system", content: system }, { role: "user", content: `Item: ${item.name}\nStaff notes: ${item.notes}\nStyle: ${item.style}` }];
        const parse = (text) => JSON.parse(text.replace(/```(json)?/g, "")).descriptions;

        export function staffPage(view, item) {
          const log = [];
          const sets = [];                    // every set of options shown, so undo can go back
          const asked = [];                   // the messages behind each set
          let messages = ask(item);
          const note = (action, detail) => {  // feedback signals: what the staff did with the suggestions
            log.push({ action, detail });
            panel.table("Feedback log", log, { id: "feedback" });
          };

          const field = el("p", { testid: "description" }, "ဖော်ပြချက် မရှိသေးပါ");
          const options = el("div", { testid: "options" });
          const tools = el("div", { class: "pg-sum-head" });
          const showSet = (list) => {
            options.replaceChildren(...list.map((text, i) => el("div", { class: "pg-review", testid: `option-${i + 1}` },
              el("p", {}, text),
              smallButton("ဒါကို သုံးမယ်", `use-${i + 1}`, () => {
                field.replaceChildren(text, el("div", { class: "pg-badge" }, "AI ရေးထားတာ · မတင်ခင် စစ်ပါ"), smallButton("ပြင်မယ်", "edit", () => field.setAttribute("contenteditable", "true")));
                note("သုံးတယ်", `ဖော်ပြချက် ${i + 1}`);
              }),
            )));
          };
          const next = async (action) => {
            try {
              const answer = await generate(messages);
              asked.push(messages);
              messages = [...messages, { role: "assistant", content: answer }, { role: "user", content: MORE }];
              sets.push(parse(answer));
              showSet(sets.at(-1));
              tools.replaceChildren(smallButton("နောက်ထပ် ပြပါ", "regenerate", () => next("နောက်ထပ် တောင်းတယ်")));
              if (sets.length > 1) tools.append(smallButton("ပြန်ယူမယ်", "undo", undo));
              note(action, `အစုံ ${sets.length}`);
            } catch (error) {
              options.replaceChildren(el("p", { class: "pg-note" }, "အခု ဖော်ပြချက် မရပါ၊ ကိုယ်တိုင် ရေးပါ"));
              console.error(error);
            }
          };
          const undo = async () => {
            try {
              sets.pop();
              asked.pop();
              messages = messages.slice(0, -2);
              await generate(asked.at(-1));     // the panel shows the answer behind these options again
              showSet(sets.at(-1));
              tools.replaceChildren(smallButton("နောက်ထပ် ပြပါ", "regenerate", () => next("နောက်ထပ် တောင်းတယ်")));
              note("ပြန်ယူတယ်", `အစုံ ${sets.length}`);
            } catch (error) {
              console.error(error);
            }
          };

          const show = smallButton("ဖော်ပြချက်တွေ ကြည့်မယ်", "show-descriptions", () => {
            show.remove();
            next("ကြည့်တယ်");
          });
          view.append(el("section", { class: "pg" },
            el("h2", {}, item.name),
            el("div", { class: "pg-note" }, `လှလှ ရဲ့ မှတ်ချက် · ${item.notes}`),
            el("h3", {}, "ဖော်ပြချက်"),
            field,
            show,
            options,
            tools,
          ));
        }
      src/highlights.js: |
        // Review highlights for a menu item page (background AI): when the page opens, the shop's code asks
        // the model for a short summary of the item's reviews, starting with what this customer searched for.
        import { generate } from "./llm.js";

        const rules = [
          "You write the review highlights on a menu item page of a tea shop in Yangon.",
          "Read the customer reviews and write two short sentences in Burmese about what they say.",
          "Start with what matters for the customer's recent searches.",
          "Reply with the two sentences only: no title, no list, no markdown.",
        ];

        export function summarize(reviews, searches) {
          const user = `Recent searches: ${searches.join(", ")}\n\nReviews:\n${reviews.map((r) => `- ${r}`).join("\n")}`;
          return generate([
            { role: "system", content: rules.join(" ") },
            { role: "user", content: user },
          ]);
        }
      src/llm.js: |
        // The lesson's stand-in for a model API.
        // A real model is slow and can answer differently from run to run, so this lesson uses answers
        // recorded ahead of time from a real model: data/responses.json (how: data/PROVENANCE.md).
        // generate() returns the recorded answer for exactly these messages, and shows it in the panel.
        import recorded from "../data/responses.json";
        import { panel } from "ai-panel";

        export const model = recorded.provenance;

        const find = (messages) => {
          const key = JSON.stringify(messages.map(({ role, content }) => ({ role, content })));
          return recorded.responses.find((r) => JSON.stringify(r.messages) === key);
        };

        export async function generate(messages, { show = true } = {}) {
          const hit = find(messages);
          if (!hit) {
            const error = new Error("No recorded answer for these exact messages yet.");
            error.name = "CourseNotice";
            throw error;
          }
          if (show) panel.output("Model answer", hit.output, { id: "answer", badge: `recorded · ${model.label} · greedy` });
          return hit.output;
        }

        // The token counts the model's own tokenizer gave when the answer was recorded (the prompt includes
        // the chat template's own tokens): { promptTokens, outputTokens }, or null when not recorded.
        export function tokensFor(messages) {
          const hit = find(messages);
          return hit ? { promptTokens: hit.promptTokens, outputTokens: hit.outputTokens } : null;
        }
      src/main.js: |
        import data from "../data/reviews.json";
        import helper from "../data/helper.json";
        import { choices } from "./ui.js";
        import { summarize } from "./highlights.js";
        import { itemPage, summaryBox } from "./page.js";
        import { staffPage } from "./helper.js";

        // မောင်မောင် opens the mohinga page; the website remembers what he searched for before.
        const searches = ["delivery"];
        const reviews = data.reviews.filter((r) => r.item === "mohinga").map((r) => r.text);

        // Background AI: the summary is asked for when the page opens; nobody presses a button.
        const summary = summarize(reviews, searches).catch(() => null);

        function customerPage(view) {
          const page = itemPage(view, "မုန့်ဟင်းခါး", reviews);   // the reviews never need AI
          summary.then((text) => {
            if (!text) return;                                     // no summary: the reviews are still there
            summaryBox(page, text, {
            });
          });
        }

        // Two pages of the website: what customers see, and the staff page with the description helper.
        const view = document.createElement("div");
        choices("page", ["customer", "ဝန်ထမ်း"], (name) => {
          view.replaceChildren();
          if (name === "customer") customerPage(view);
          else staffPage(view, helper.newItems[0]);
        }, { label: "page", selected: "customer" });
        document.getElementById("app").append(view);
        customerPage(view);
      src/page.js: |
        // The shop website's pages in #app: plain DOM, the same as the rest of the site (no AI in here).
        // itemPage() draws a menu item with its reviews, which work without any AI. summaryBox() adds the
        // review highlights on top of them; its options are the UX patterns this lesson adds one by one.
        const STYLE_ID = "page-style";
        const STYLE = `
        #app .pg { font: 14px/1.55 system-ui, -apple-system, "Segoe UI", "Noto Sans Myanmar", "Myanmar Sangam MN", "Myanmar Text", sans-serif; color: #d9dce2; padding: 4px 12px 8px; }
        #app .pg h2 { font-size: 17px; margin: 6px 0 2px; color: #fff; }
        #app .pg h3 { font-size: 14px; margin: 8px 0 4px; color: #adb5bd; font-weight: 600; }
        #app .pg ul { list-style: none; margin: 0; padding: 0; }
        #app .pg li, #app .pg .pg-review { border-top: 1px solid #2d323c; padding: 5px 0; }
        #app .pg .pg-sum { background: #1f2a3a; border: 1px solid #34507a; border-radius: 8px; padding: 6px 10px; margin: 4px 0 6px; }
        #app .pg .pg-sum-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        #app .pg .pg-tag { font-size: 12px; font-weight: 700; color: #a5d8ff; }
        #app .pg .pg-note { font-size: 12px; color: #adb5bd; margin: 2px 0; }
        #app .pg .pg-badge { font-size: 11px; color: #868e96; }
        #app .pg p { margin: 2px 0; white-space: pre-wrap; }
        #app .pg button { font: inherit; font-size: 12px; color: #f1f3f5; background: #2d323c; border: 1px solid #3a404b; border-radius: 6px; padding: 1px 10px; cursor: pointer; }
        #app .pg .pg-link { font-size: 13px; color: #74c0fc; }
        `;

        function ensureStyle() {
          if (document.getElementById(STYLE_ID)) return;
          const style = document.createElement("style");
          style.id = STYLE_ID;
          style.textContent = STYLE;
          document.head.append(style);
        }

        export function el(tag, attrs = {}, ...children) {
          const node = document.createElement(tag);
          for (const [k, v] of Object.entries(attrs)) {
            if (k === "class") node.className = v;
            else if (k === "testid") node.dataset.testid = v;
            else node.setAttribute(k, v);
          }
          node.append(...children.flat().filter((c) => c != null));
          return node;
        }

        export function smallButton(label, testid, onClick) {
          const b = el("button", { type: "button", testid }, label);
          b.addEventListener("click", onClick);
          return b;
        }

        /** A menu item page: the name, then what customers wrote (first three reviews and a link to all). */
        export function itemPage(parent, name, reviews) {
          ensureStyle();
          const slot = el("div");
          const list = el("ul", { testid: "reviews", "data-count": reviews.length }, reviews.slice(0, 3).map((r) => el("li", {}, r)));
          parent.append(el("section", { class: "pg" },
            el("h2", {}, name),
            el("h3", {}, "customer တွေ ပြောတာ"),
            slot,
            list,
            el("span", { class: "pg-link", testid: "all-reviews" }, `review အားလုံး (${reviews.length})`),
          ));
          return { slot };
        }

        /** The review highlights above the reviews. Without a label they look like one more review. */
        export function summaryBox(page, text, { label, how, optOut } = {}) {
          const box = el("div", { class: label ? "pg-sum" : "pg-review", testid: "summary" });
          if (label) {
            const head = el("div", { class: "pg-sum-head" }, el("span", { class: "pg-tag", testid: "summary-label" }, label));
            if (how) {
              const note = el("div", { class: "pg-note", testid: "summary-how-text" }, how);
              head.append(smallButton("ဘယ်လို လုပ်ထားလဲ", "summary-how", () => (note.isConnected ? note.remove() : head.after(note))));
            }
            box.append(head);
          }
          box.append(el("p", { testid: "summary-text" }, text));
          if (optOut) {
            const back = smallButton("အနှစ်ချုပ် ပြန်ပြပါ", "summary-on", () => back.replaceWith(box));
            box.append(smallButton("အနှစ်ချုပ် မပြနဲ့", "summary-off", () => box.replaceWith(back)));
          }
          page.slot.append(box);
        }
      src/ui.js: |
        // Page controls for the lesson program: a row of buttons or choices in #app, above the AI panel.
        // Plain DOM, so the studio records every click and replay shows it exactly. Each control gets a
        // data-testid for preview.click. #app starts empty on every run, so controls are drawn by the
        // program each time. A handler that throws prints to the panel's Console (never the page).
        //
        //   import { row, button, choices } from "./ui.js";
        //   choices("threshold", [0.5, 0.7, 0.9], (t) => show(t), { selected: 0.5 });
        //     → buttons with test ids threshold-1, threshold-2, threshold-3 (1-based, in order)
        //   button("ဖော်ပြချက်တွေ ကြည့်မယ်", "show-descriptions", () => …);
        const STYLE_ID = "ui-style";
        const STYLE = `
        #app .ui-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px 0;
          font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans Myanmar", "Myanmar Sangam MN", "Myanmar Text", sans-serif; color: #d9dce2; }
        #app .ui-label { color: #adb5bd; font-size: 13px; }
        #app .ui-btn { font: inherit; color: #f1f3f5; background: #2d323c; border: 1px solid #3a404b; border-radius: 6px; padding: 3px 12px; cursor: pointer; }
        #app .ui-btn[aria-pressed="true"] { background: #7048e8; border-color: #7048e8; color: #fff; font-weight: 600; }
        `;

        function ensureStyle() {
          if (document.getElementById(STYLE_ID)) return;
          const style = document.createElement("style");
          style.id = STYLE_ID;
          style.textContent = STYLE;
          document.head.append(style);
        }

        const safe = (fn) => (...args) => {
          try {
            const result = fn(...args);
            if (result && typeof result.catch === "function") result.catch((error) => console.error(error));
          } catch (error) {
            console.error(error);
          }
        };

        /** A new row in #app, optionally with a short label in front. Returns the row element. */
        export function row(label = "") {
          ensureStyle();
          const el = document.createElement("div");
          el.className = "ui-row";
          if (label) {
            const span = document.createElement("span");
            span.className = "ui-label";
            span.textContent = label;
            el.append(span);
          }
          document.getElementById("app").append(el);
          return el;
        }

        /** One button. `testid` is used as is. */
        export function button(label, testid, onClick, parent = row()) {
          const el = document.createElement("button");
          el.type = "button";
          el.className = "ui-btn";
          el.textContent = String(label);
          el.dataset.testid = testid;
          el.addEventListener("click", safe(onClick));
          parent.append(el);
          return el;
        }

        /** A row of choices; the picked one is shown pressed. Test ids are `<name>-1`, `<name>-2`, … */
        export function choices(name, options, onPick, { label = name, selected } = {}) {
          const parent = row(label);
          const buttons = options.map((option, i) =>
            button(option, `${name}-${i + 1}`, () => {
              for (const b of buttons) b.setAttribute("aria-pressed", String(b === buttons[i]));
              onPick(option, i);
            }, parent),
          );
          for (const [i, b] of buttons.entries()) b.setAttribute("aria-pressed", String(options[i] === selected));
          return buttons;
        }
      vite.config.js: |
        import { defineConfig } from "vite";
        import courseRunner from "./course/runner.js";

        export default defineConfig({
          plugins: [courseRunner()],
        });
