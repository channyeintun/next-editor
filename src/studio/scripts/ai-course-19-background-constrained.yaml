build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 5119
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "AI ကို user ဘယ်လောက် မြင်ရမလဲ"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ judge တွေနဲ့ ဖော်ပြချက် helper ရဲ့ prompt ကို စစ်ပြီး တိုးတက်အောင်
      လုပ်ခဲ့ပါတယ်။ ဒါပေမဲ့ prompt ဘယ်လောက် ကောင်းကောင်း model ရဲ့ အဖြေက တစ်ခါတလေ မှားဦးမှာပါ။ အဲဒီ
      အမှားတွေ user ကို သိပ် မထိခိုက်အောင် ကာကွယ်ပေးနိုင်တာက U X ဖြစ်ပြီး၊ AI ဘယ်နေရာမှာ မှားတတ်လဲ အသိဆုံးက
      developer ဖြစ်လို့ ဒီ အပိုင်းမှာ ကိုယ့် တာဝန် ကြီးပါတယ်။ [[mark:draw-mini]] blueprint မှာဆိုရင် ဒီနေ့
      ကြည့်မှာက Solution ထဲက U X အလွှာပါ။ [[mark:draw-today]] AI feature ကို user ဆီ ပြတဲ့ ပုံစံ
      သုံးမျိုးထဲက ပထမ နှစ်မျိုးကို ဒီနေ့ လုပ်ကြည့်ပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Design AI user experiences",
          url: "https://web.dev/learn/ai/ux-patterns",
        }
      - {
          title: "web.dev Learn AI: Introduction to AI on the web (the blueprint)",
          url: "https://web.dev/learn/ai/introduction",
        }
      - {
          title: "web.dev Learn AI: Welcome to Learn AI! (course credit: written by Dr. Janna Lipenkova with editorial guidance from Alexandra Klepper; text CC BY 4.0, code Apache 2.0; adapted into Burmese with the course's own tea-shop examples)",
          url: "https://web.dev/learn/ai/welcome",
        }
      - {
          title: "Creative Commons: Attribution 4.0 International (CC BY 4.0), the licence of the web.dev Learn AI text adapted here",
          url: "https://creativecommons.org/licenses/by/4.0/",
        }
    actions:
      - {
          id: open-board-a,
          type: whiteboard.apply,
          at: { scene: start, offsetMs: -450 },
          open: true,
          clear: true,
          upsertIds: [a-title],
        }
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - {
          id: draw-mini,
          type: whiteboard.apply,
          at: { mark: draw-mini },
          upsertIds:
            [
              a-opp,
              a-opp-t,
              a-arrow-1,
              a-data,
              a-data-t,
              a-intel,
              a-intel-t,
              a-ux,
              a-ux-t,
              a-arrow-2,
              a-gov,
              a-gov-t,
            ],
          drawMs: 2400,
        }
      - {
          id: draw-today,
          type: whiteboard.apply,
          at: { mark: draw-today },
          upsertIds: [a-today],
          drawMs: 1000,
        }

  - id: exposure
    narration: >
      [[mark:draw-ladder]] user ဆီမှာ AI ဘယ်လောက် ပေါ်လွင်လဲ ဆိုတာကို exposure လို့ ခေါ်ပါတယ်။
      [[mark:draw-bg]] ပထမ တစ်ဆင့်က background AI ပါ။ user မသိသာဘဲ ရှိပြီးသား feature ကို ကောင်းအောင် လုပ်ပေးတဲ့
      AI ဖြစ်လို့ user က ဘာမှ နှိပ်စရာ မလိုပါဘူး။ [[mark:draw-con]] ဒုတိယက constrained AI ပါ။ user က ခလုတ်
      နှိပ်မှ စတဲ့၊ အလုပ် ပုံသေ ဖြစ်တဲ့ AI ပါ။ [[mark:draw-open]] တတိယကတော့ user က ကြိုက်သလို စာရိုက်ပြီး
      ခိုင်းလို့ ရတဲ့ open ended AI ဖြစ်ပြီး၊ နောက် lesson မှာ ကြည့်ပါမယ်။ [[mark:draw-risk]] ညာဘက် ရောက်လေ
      user လုပ်နိုင်တာ များလေ ဖြစ်ပေမယ့်၊ မှားနိုင်ခြေနဲ့ ကိုယ်က ထိန်းရမယ့် အလုပ်တွေလည်း များလာပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Design AI user experiences (exposure: background, constrained, open-ended)",
          url: "https://web.dev/learn/ai/ux-patterns",
        }
    actions:
      - {
          id: draw-ladder,
          type: whiteboard.apply,
          at: { mark: draw-ladder },
          clear: true,
          upsertIds: [b-title],
        }
      - {
          id: draw-bg,
          type: whiteboard.apply,
          at: { mark: draw-bg },
          upsertIds: [b-bg, b-bg-n, b-bg-d],
          drawMs: 1200,
        }
      - {
          id: draw-con,
          type: whiteboard.apply,
          at: { mark: draw-con },
          upsertIds: [b-ar1, b-con, b-con-n, b-con-d],
          drawMs: 1400,
        }
      - {
          id: draw-open,
          type: whiteboard.apply,
          at: { mark: draw-open },
          upsertIds: [b-ar2, b-open, b-open-n, b-open-d],
          drawMs: 1400,
        }
      - {
          id: draw-risk,
          type: whiteboard.apply,
          at: { mark: draw-risk },
          upsertIds: [b-risk, b-today],
          drawMs: 1200,
        }

  - id: background
    chapter: "Background AI"
    narration: >
      [[mark:draw-when]] background AI က ဘယ်လို နေရာမျိုးမှာ ကိုက်လဲ ကြည့်ရအောင်။ [[mark:draw-low]] မှားရင်
      ထိခိုက်မှု နည်းတဲ့ အလုပ်၊ user ကို ထိန်းခွင့် ပေးလည်း ရလဒ် သိပ် မထူးခြားတဲ့ အလုပ်မျိုးမှာ ကိုက်ပါတယ်။
      [[mark:draw-works]] အရေးကြီးဆုံးကတော့ AI အလုပ် မလုပ်ရင်တောင် product က ဆက် အလုပ်လုပ်နေရမှာပါ။ email
      ထဲက spam filter၊ ရုပ်ရှင် အကြံပြုတာ စတာတွေက ဥပမာ ဖြစ်ပြီး၊ လူအများစုက AI မှန်းတောင်
      သတိမထားမိကြပါဘူး။ [[mark:draw-ours]] ကိုယ်တို့ ဆိုင်မှာတော့ menu item page မှာ review အနှစ်ချုပ်ကို ပြပါမယ်။
      မုန့်ဟင်းခါးလို review များတဲ့ item မှာ customer က အကုန် မဖတ်ဘဲ လူတွေ အဓိက ပြောတာကို မြန်မြန်
      သိချင်လို့ပါ။
    sources:
      - {
          title: "web.dev Learn AI: Design AI user experiences (background AI)",
          url: "https://web.dev/learn/ai/ux-patterns",
        }
    actions:
      - {
          id: draw-when,
          type: whiteboard.apply,
          at: { mark: draw-when },
          clear: true,
          upsertIds: [c-title],
        }
      - {
          id: draw-low,
          type: whiteboard.apply,
          at: { mark: draw-low },
          upsertIds: [c-1, c-2],
          drawMs: 1400,
        }
      - {
          id: draw-works,
          type: whiteboard.apply,
          at: { mark: draw-works },
          upsertIds: [c-3, c-ex],
          drawMs: 1400,
        }
      - {
          id: draw-ours,
          type: whiteboard.apply,
          at: { mark: draw-ours },
          upsertIds: [c-ours, c-ours-u],
          drawMs: 1200,
        }

  - id: code
    narration: >
      [[mark:close-when]] code ထဲမှာ ကြည့်ရအောင်။ [[mark:open-highlights]] ဒါက review အနှစ်ချုပ်ကို
      model ဆီ တောင်းတဲ့ ဖိုင်ပါ။ [[mark:sel-rules]] system prompt ရဲ့ စည်းကမ်းတွေက review တွေကို
      မြန်မာလို စာကြောင်း နှစ်ကြောင်းနဲ့ အနှစ်ချုပ်ခိုင်းပြီး၊ customer ရှာထားတာနဲ့ ဆိုင်တာကို အရင်
      ပြောခိုင်းထားပါတယ်။ [[mark:sel-searches]] main ဖိုင်မှာတော့ ကျောင်းသား မောင်မောင် အရင်က
      delivery လို့ ရှာထားတာကို website က မှတ်ထားပါတယ်။ [[mark:sel-summarize]] page ကို ဖွင့်တာနဲ့
      အနှစ်ချုပ်ကို တောင်းလိုက်တာမို့ ဘယ်သူမှ ခလုတ် နှိပ်စရာ မလိုပါဘူး။ ဒါက background AI ပါ။
      [[mark:sel-page]] page ကိုတော့ review တွေနဲ့ အရင် ပြပြီး၊ အနှစ်ချုပ် ရမှ အပေါ်မှာ
      ထပ်ထည့်ပါတယ်။ [[mark:panel-ready]] ဒါဆို customer မြင်ရမယ့် page ကို ကြည့်ရအောင်။
    sources:
      - {
          title: "web.dev Learn AI: Design AI user experiences (review summaries and highlights)",
          url: "https://web.dev/learn/ai/ux-patterns",
        }
    actions:
      - { id: close-when, type: whiteboard.apply, at: { mark: close-when }, open: false }
      - {
          id: open-highlights,
          type: workspace.openFile,
          at: { mark: open-highlights },
          path: src/highlights.js,
        }
      - id: sel-rules
        type: editor.select
        at: { mark: sel-rules }
        target:
          {
            file: src/highlights.js,
            text: "  \"Read the customer reviews and write two short sentences in Burmese about what they say.\",\n  \"Start with what matters for the customer's recent searches.\",\n",
            occurrence: 1,
          }
      - { id: open-main, type: workspace.openFile, at: { mark: sel-searches }, path: src/main.js }
      - id: sel-searches
        type: editor.select
        at: { afterAction: open-main }
        target: { file: src/main.js, text: 'const searches = ["delivery"];', occurrence: 1 }
      - id: sel-summarize
        type: editor.select
        at: { mark: sel-summarize }
        target:
          { file: src/main.js, text: "const summary = summarize(reviews, searches)", occurrence: 1 }
      - id: sel-page
        type: editor.select
        at: { mark: sel-page }
        target:
          {
            file: src/main.js,
            text: 'const page = itemPage(view, "မုန့်ဟင်းခါး", reviews);',
            occurrence: 1,
          }
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-done
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: ai-status }
        attribute: { name: data-state, value: "done" }
        retry: { maxAttempts: 3, delayMs: 500 }

  - id: page
    narration: >
      [[mark:read-page]] ညာဘက်မှာ ဆိုင် website ရဲ့ မုန့်ဟင်းခါး page ကို မြင်ရပါပြီ။ review တွေက
      lesson အတွက် ပြင်ဆင်ထားတဲ့ နမူနာ data ဖြစ်ပြီး၊ ပထမဆုံး စာပိုဒ်ကတော့ model ရေးထားတဲ့
      အနှစ်ချုပ်ပါ။ [[mark:read-recorded]] ဒီ အနှစ်ချုပ်က open model သေးသေး တစ်ခုကို ဒီ prompt နဲ့ ကြိုပြီး run
      ထားတုန်းက တကယ် ထွက်လာခဲ့တဲ့ အဖြေ ဖြစ်လို့၊ AI panel ရဲ့ badge ကလည်း ကြိုမှတ်ထားတဲ့ အဖြေလို့
      ပြနေပါတယ်။ [[mark:read-claims]] အနှစ်ချုပ်က delivery နဲ့ဆိုရင် ကြာပြီး ဟင်းရည် အေးနေတယ်၊
      ဈေးနှုန်းနဲ့ ပမာဏ ပြောင်းနေတာကို သတိထားသင့်တယ် လို့ အမှန်တရားလို ပြောနေပါတယ်။ review တချို့
      ပြောတာကို ဆိုင်က ပြောသလို ဖြစ်နေပြီး၊ review တွေကြားမှာလည်း review တစ်ခုလိုပဲ ရောနေပါတယ်။
      [[mark:read-platform]] ဒီလို အနှစ်ချုပ်က user တစ်ယောက်ချင်း မတူလို့ privacy နဲ့
      မြန်နှုန်းအတွက် device ထဲမှာ တွက်တာ ကောင်းပြီး၊ Chrome ရဲ့ Summarizer API နဲ့ ကိုက်ပါတယ်။
      ဒါပေမဲ့ Summarizer က မြန်မာစာကို support မလုပ်သေးလို့ ဒီမှာ တခြား model ကို သုံးထားတာပါ။
    sources:
      - {
          title: "web.dev Learn AI: Design AI user experiences (review summaries; platform)",
          url: "https://web.dev/learn/ai/ux-patterns",
        }
      - {
          title: "Chrome for Developers: Summarizer API (supported languages)",
          url: "https://developer.chrome.com/docs/ai/summarizer-api",
        }
    actions:
      - id: expect-summary-v1
        type: expect.preview
        at: { mark: read-page }
        timeoutMs: 5000
        target: { by: testId, value: summary-text }
        textContains: "သတိပြုသင့်ပါတယ်"
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-reviews
        type: expect.preview
        at: { afterAction: expect-summary-v1 }
        timeoutMs: 5000
        target: { by: testId, value: reviews }
        attribute: { name: data-count, value: "7" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-badge
        type: expect.preview
        at: { mark: read-recorded }
        timeoutMs: 5000
        target: { by: testId, value: ai-answer-badge }
        textContains: "recorded · Gemma 4 E2B · greedy"
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: wording
    narration: >
      [[mark:open-highlights-again]] အမှန်တရားလို ပြောနေတာကို ပြင်ဖို့ system prompt ထဲမှာ စည်းကမ်း တစ်ခု
      ထည့်ပါမယ်။ [[mark:type-rule]] review တွေ ပြောတာကို အမှန်တရားလို မရေးဘဲ၊ ဘယ်သူတွေ ပြောတာလဲ ဆိုတာ
      အမြဲ ထည့်ရေးခိုင်းတာပါ။ [[mark:read-trend]] အနှစ်ချုပ် ပြောင်းသွားပါပြီ။ delivery နဲ့ မှာတာ တစ်နာရီ
      ကြာတယ်လို့ customer တစ်ယောက်က ပြောတယ်၊ အရသာ ကောင်းတယ်လို့ customer တချို့က ပြောတယ် ဆိုပြီး ဘယ်သူ
      ပြောတာလဲ ပါလာလို့ ဆိုင်က ပြောတာလို့ မထင်ရတော့ပါဘူး။ ဒါပေမဲ့ review နှစ်ခုက ပြောထားတဲ့ ဈေး
      တက်တဲ့ အကြောင်း ပါမလာတော့လို့၊ prompt ပြင်တိုင်း evaluation နဲ့ ပြန်စစ်ရပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Design AI user experiences (be mindful of wording)",
          url: "https://web.dev/learn/ai/ux-patterns",
        }
    actions:
      - {
          id: open-highlights-again,
          type: workspace.openFile,
          at: { mark: open-highlights-again },
          path: src/highlights.js,
        }
      - id: type-rule
        type: editor.type
        at: { mark: type-rule }
        target:
          {
            file: src/highlights.js,
            after: "  \"Reply with the two sentences only: no title, no list, no markdown.\",\n",
            occurrence: 1,
          }
        text: "  'Report trends, not claims: always say who says it, for example \"customer တချို့က … လို့ ပြောပါတယ်\".',\n"
        cadence: block
      - id: expect-summary-v2
        type: expect.preview
        at: { afterAction: type-rule }
        timeoutMs: 8000
        target: { by: testId, value: summary-text }
        textContains: "ဖောက်သည်အချို့က"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-answer-v2
        type: expect.preview
        at: { afterAction: expect-summary-v2 }
        timeoutMs: 5000
        target: { by: testId, value: ai-answer }
        textContains: "တစ်နာရီ ကြာတယ်လို့ ဖောက်သည်တစ်ဦးက"
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: label
    chapter: "Label၊ opt out နဲ့ fallback"
    narration: >
      [[mark:open-main-label]] နောက်တစ်ခုက အနှစ်ချုပ်ကို review တစ်ခုလို မထင်ရအောင် ခွဲပြတာပါ။
      [[mark:type-label]] အနှစ်ချုပ် ဆိုတဲ့ label၊ ဘယ်လို လုပ်ထားလဲ ဆိုတဲ့ ရှင်းပြချက်နဲ့
      ပိတ်ထားလို့ ရတဲ့ ခလုတ် တစ်ခုကို ထည့်ပါမယ်။ [[mark:read-label]] အနှစ်ချုပ်က box သီးသန့်နဲ့
      label ပါလာပါပြီ။ AI လို့ ကြော်ငြာတာ မဟုတ်ဘဲ ဘာလဲ ဆိုတာကိုပဲ ပြတဲ့ ကြားနေ label ပါ။
      [[mark:click-how]] ဘယ်လို လုပ်ထားလဲ ကို နှိပ်ကြည့်ရအောင်။ [[mark:read-how]] AI နဲ့
      အတိုချုပ်ထားလို့ မှားနိုင်တယ် ဆိုတဲ့ ရှင်းပြချက် ပေါ်လာပါပြီ။ သိချင်တဲ့သူ နှိပ်မှ ပြတဲ့ progressive disclosure ပါ။ [[mark:click-off]] AI ကို
      မကြိုက်တဲ့ customer တွေအတွက် အနှစ်ချုပ် မပြနဲ့ ကို နှိပ်ကြည့်ပါမယ်။ [[mark:read-off]]
      အနှစ်ချုပ် ပျောက်ပြီး ပြန်ပြဖို့ ခလုတ်ပဲ ကျန်ပေမယ့်၊ review တွေကတော့ ဒီအတိုင်း ရှိနေပါတယ်။ [[mark:sel-fallback]] model
      မရလို့ အနှစ်ချုပ် မရတဲ့အခါမှာလည်း code က review တွေကို ဒီအတိုင်း ပြထားပြီး၊ အနှစ်ချုပ် ရမှ
      ထပ်ထည့်ပါတယ်။ ဒါက graceful fallback ပါ။ [[mark:setup-cost]] client side model ဆိုရင် ပထမ
      download က customer ကို စောင့်စေလို့၊ feature ရဲ့ အကျိုးကို အရင် ပြပြီးမှ download လုပ်တာ၊
      ဒါမှမဟုတ် ကြားထဲမှာ server ပေါ်က model သေးနဲ့ ဖြေတာမျိုး လုပ်နိုင်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Design AI user experiences (background AI best practices)",
          url: "https://web.dev/learn/ai/ux-patterns",
        }
    actions:
      - {
          id: open-main-label,
          type: workspace.openFile,
          at: { mark: open-main-label },
          path: src/main.js,
        }
      - id: type-label
        type: editor.type
        at: { mark: type-label }
        target: { file: src/main.js, after: "    summaryBox(page, text, {\n", occurrence: 1 }
        text: "      label: \"အနှစ်ချုပ်\",\n      how: \"review တွေကို AI model နဲ့ အတိုချုပ်ထားလို့ မှားနိုင်ပါတယ်၊ review အားလုံးကို အောက်မှာ ဖတ်ပါ\",\n      optOut: true,\n"
        cadence: line-by-line
      - id: expect-label
        type: expect.preview
        at: { afterAction: type-label }
        timeoutMs: 8000
        target: { by: testId, value: summary-label }
        textContains: "အနှစ်ချုပ်"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-off-button
        type: expect.preview
        at: { afterAction: expect-label }
        timeoutMs: 8000
        target: { by: testId, value: summary-off }
        textContains: "မပြနဲ့"
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: click-how
        type: preview.click
        at: { mark: click-how }
        target: { by: testId, value: summary-how }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-how
        type: expect.preview
        at: { afterAction: click-how }
        timeoutMs: 5000
        target: { by: testId, value: summary-how-text }
        textContains: "မှားနိုင်ပါတယ်"
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: click-off
        type: preview.click
        at: { mark: click-off }
        target: { by: testId, value: summary-off }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-off
        type: expect.preview
        at: { afterAction: click-off }
        timeoutMs: 5000
        target: { by: testId, value: summary-on }
        textContains: "ပြန်ပြပါ"
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-reviews-stay
        type: expect.preview
        at: { afterAction: expect-off }
        timeoutMs: 5000
        target: { by: testId, value: reviews }
        attribute: { name: data-count, value: "7" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: sel-fallback
        type: editor.select
        at: { mark: sel-fallback }
        target: { file: src/main.js, text: "    if (!text) return;", occurrence: 1 }

  - id: constrained
    chapter: "Constrained AI · ဖော်ပြချက် helper"
    narration: >
      [[mark:draw-constrained]] constrained AI မှာတော့ user က ခလုတ် နှိပ်ပြီး ကိုယ်တိုင်
      စခိုင်းပါတယ်။ [[mark:draw-sys]] လုပ်ရမယ့် အလုပ်၊ အဖြေ ပုံစံနဲ့ ကန့်သတ်ချက်တွေကို developer က
      system prompt ထဲမှာ ပုံသေ ရေးထားလို့ ရလဒ်ကို ကြိုခန့်မှန်းနိုင်ပါတယ်။ အလုပ် တစ်ခုအတွက်
      လုပ်ထားတဲ့ client side model တွေနဲ့ တွဲသုံးလို့ ကောင်းပြီး၊ နယ်ပယ် တစ်ခုရဲ့ ဗဟုသုတ နက်နက်နဲနဲ
      လိုတဲ့ အလုပ်ဆိုရင်တော့ server ပေါ်က ပိုကြီးတဲ့ model ကို သုံးဖို့ စဉ်းစားရပါမယ်။
      [[mark:draw-labels]] ခလုတ်ပေါ်က စာလည်း အရေးကြီးပါတယ်။ AI ကို မေးမယ် ဆိုရင် ဘာဖြစ်မလဲ မသိရပြီး၊
      ဖော်ပြချက် ဖန်တီးမယ် ဆိုရင် အချိန်ယူရမယ့် အလုပ်လို ထင်ရပါတယ်။ [[mark:draw-good]] ဖော်ပြချက်တွေ
      ကြည့်မယ် ကတော့ ဘာရမလဲ ရှင်းပြီး၊ အဖြေ မြန်ရင် ဒါမှမဟုတ် ကြိုတွက်ထားရင် အဆင်သင့် ရှိနေသလို
      ခံစားရပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Design AI user experiences (constrained AI)",
          url: "https://web.dev/learn/ai/ux-patterns",
        }
    actions:
      - {
          id: draw-constrained,
          type: whiteboard.apply,
          at: { mark: draw-constrained },
          open: true,
          clear: true,
          upsertIds: [d-title, d-btn, d-btn-t],
          drawMs: 1000,
        }
      - {
          id: draw-sys,
          type: whiteboard.apply,
          at: { mark: draw-sys },
          upsertIds: [d-ar1, d-sys, d-sys-t, d-ar2, d-out, d-out-t, d-sys-d],
          drawMs: 2200,
        }
      - {
          id: draw-labels,
          type: whiteboard.apply,
          at: { mark: draw-labels },
          upsertIds: [d-bad, d-bad-x, d-mid],
          drawMs: 1600,
        }
      - {
          id: draw-good,
          type: whiteboard.apply,
          at: { mark: draw-good },
          upsertIds: [d-good],
          drawMs: 1000,
        }

  - id: helper
    narration: >
      [[mark:close-constrained]] ဝန်ထမ်း page ရဲ့ helper ကို code မှာ အရင် ကြည့်ရအောင်။
      [[mark:sel-system]] ဒီ system prompt က ဖော်ပြချက် သုံးခုကို တိုတို ရေးဖို့၊ ဈေးနှုန်းနဲ့ emoji
      မထည့်ဖို့၊ JSON နဲ့ ပြန်ပေးဖို့ ပုံသေ ရေးထားပြီး၊ page ကနေ item ရဲ့ အချက်တွေကိုပဲ ပို့ပါတယ်။ [[mark:click-staff]] ကောင်တာက လှလှ က
      menu အသစ် ထန်းလျက် ကော်ဖီ အတွက် မှတ်ချက် ရေးထားပြီး၊ ဖော်ပြချက်ကတော့ မရှိသေးပါဘူး။
      [[mark:click-show]] ဖော်ပြချက်တွေ ကြည့်မယ် ကို နှိပ်ပါမယ်။ [[mark:read-options]] ဖော်ပြချက်
      သုံးခု ပေါ်လာပြီး၊ panel မှာလည်း model ပြန်ပေးခဲ့တဲ့ JSON ကို ကြိုမှတ်ထားတဲ့ အဖြေ badge နဲ့
      မြင်ရပါတယ်။ သုံးခု ပြတာက လှလှ ကို ရွေးခွင့် ပေးပြီး၊ မကြိုက်တဲ့ အဖြေ တစ်ခုတည်းနဲ့
      ပိတ်မိမနေအောင်ပါ။ [[mark:click-regen]] မကြိုက်ရင် နောက်ထပ် ပြပါ ကို နှိပ်လို့ ရပါတယ်။
      [[mark:read-regen]] ဒီ ခလုတ်က ခုနက အဖြေကို model ဆီ ပြန်ပို့ပြီး မတူတာ တောင်းတာမို့ အသစ် သုံးခု
      ပေါ်လာပြီး၊ ပြန်ယူမယ် ခလုတ်လည်း ပါလာပါတယ်။ [[mark:click-undo]] ပထမ အဖြေတွေကို ပိုကြိုက်ရင် ပြန်ယူလို့
      ရပါတယ်။ [[mark:read-undo]] ပထမ သုံးခု ပြန်ရောက်လာပါပြီ။ [[mark:click-use]] ဒုတိယ တစ်ခုကို
      သုံးကြည့်ရအောင်။ [[mark:read-use]] ဖော်ပြချက် နေရာမှာ ဝင်သွားပေမယ့်၊ AI ရေးထားတာ၊ မတင်ခင်
      စစ်ပါ ဆိုတဲ့ စာနဲ့ ပြင်မယ် ခလုတ် ပါလာပါတယ်။ ဒီ ဖော်ပြချက်က နို့ မပါဘူးလို့ ရေးထားပေမယ့်၊ လှလှ
      ရဲ့ မှတ်ချက်မှာက နို့ဆီ မပါဘူးလို့ပဲ ပါတာမို့ မတင်ခင် ပြင်ရပါမယ်။ လူက ကြားထဲမှာ စစ်ပြီး
      အတည်ပြုတာကို human in the loop လို့ ခေါ်ပါတယ်။ [[mark:scroll-log]] panel အောက်ဆုံးက Feedback
      log မှာတော့ ကြည့်တာ၊ နောက်ထပ် တောင်းတာ၊ ပြန်ယူတာ၊ သုံးတာတွေကို မှတ်ထားပါတယ်။ ဒီ အချက်တွေနဲ့ helper ကို တိုးတက်အောင်
      လုပ်နိုင်ပြီး၊ လေသံ၊ အရှည် ရွေးတဲ့ control တွေကိုလည်း လှလှ တို့ တောင်းလာမှ ထည့်ပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Design AI user experiences (constrained AI best practices)",
          url: "https://web.dev/learn/ai/ux-patterns",
        }
    actions:
      - {
          id: close-constrained,
          type: whiteboard.apply,
          at: { mark: close-constrained },
          open: false,
        }
      - { id: open-helper, type: workspace.openFile, at: { mark: sel-system }, path: src/helper.js }
      - id: sel-system
        type: editor.select
        at: { afterAction: open-helper }
        target:
          {
            file: src/helper.js,
            text: "  \"Write three different descriptions in Burmese for the item, each under 60 characters, in a warm, spoken style.\",\n  \"No prices, no phone numbers, no claims such as best or free, no emoji.\",\n  'Reply with one JSON object and nothing else, no code fences: {\"descriptions\": [\"...\", \"...\", \"...\"]}',\n",
            occurrence: 1,
          }
      - id: click-staff
        type: preview.click
        at: { mark: click-staff }
        target: { by: testId, value: page-2 }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-staff
        type: expect.preview
        at: { afterAction: click-staff }
        timeoutMs: 5000
        target: { by: testId, value: show-descriptions }
        textContains: "ဖော်ပြချက်တွေ ကြည့်မယ်"
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: click-show
        type: preview.click
        at: { mark: click-show }
        target: { by: testId, value: show-descriptions }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-options
        type: expect.preview
        at: { afterAction: click-show }
        timeoutMs: 5000
        target: { by: testId, value: option-1 }
        textContains: "ထန်းလျက်နဲ့ ချိုတယ်"
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-helper-answer
        type: expect.preview
        at: { afterAction: expect-options }
        timeoutMs: 5000
        target: { by: testId, value: ai-answer }
        textContains: "descriptions"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: click-regen
        type: preview.click
        at: { mark: click-regen }
        target: { by: testId, value: regenerate }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-regen-option
        type: expect.preview
        at: { afterAction: click-regen }
        timeoutMs: 5000
        target: { by: testId, value: option-1 }
        textContains: "ခံစားကြည့်ပါ"
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-undo-button
        type: expect.preview
        at: { afterAction: expect-regen-option }
        timeoutMs: 5000
        target: { by: testId, value: undo }
        textContains: "ပြန်ယူမယ်"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: click-undo
        type: preview.click
        at: { mark: click-undo }
        target: { by: testId, value: undo }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-first-again
        type: expect.preview
        at: { afterAction: click-undo }
        timeoutMs: 5000
        target: { by: testId, value: option-1 }
        textContains: "ထန်းလျက်နဲ့ ချိုတယ်"
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-first-answer
        type: expect.preview
        at: { afterAction: expect-first-again }
        timeoutMs: 5000
        target: { by: testId, value: ai-answer }
        textContains: "ထန်းလျက်နဲ့ ချိုတယ်"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: click-use
        type: preview.click
        at: { mark: click-use }
        target: { by: testId, value: use-2 }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-used
        type: expect.preview
        at: { afterAction: click-use }
        timeoutMs: 5000
        target: { by: testId, value: description }
        textContains: "မတင်ခင် စစ်ပါ"
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-used-text
        type: expect.preview
        at: { afterAction: expect-used }
        timeoutMs: 5000
        target: { by: testId, value: description }
        textContains: "နို့မပါဘူး"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: scroll-log
        type: preview.scroll
        at: { mark: scroll-log }
        top: 5000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-log
        type: expect.preview
        at: { afterAction: scroll-log }
        timeoutMs: 5000
        target: { by: testId, value: ai-feedback }
        attribute: { name: data-count, value: "4" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-log-use
        type: expect.preview
        at: { afterAction: expect-log }
        timeoutMs: 5000
        target: { by: testId, value: ai-feedback-4 }
        textContains: "သုံးတယ်ဖော်ပြချက် 2"
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: choosing
    narration: >
      [[mark:draw-choosing]] feature တချို့ကတော့ background ရော constrained ရော ဖြစ်နိုင်ပါတယ်။ ဥပမာ helper က
      လှလှ မှတ်ချက် ရေးပြီးတာနဲ့ နောက်ကွယ်မှာ ဖော်ပြချက်တွေကို ကြိုတွက်ထားပြီး၊ ဖော်ပြချက် box ကို နှိပ်တာနဲ့ ပြလို့
      ရပါတယ်။ [[mark:draw-bg-when]] input တွေ အသင့် ရှိနေတာ၊ AI feature နည်းတာ၊ ကြိုတွက်ရတာ စရိတ် နည်းတာ၊ user ရဲ့
      အလုပ်ကို မနှောင့်ယှက်တာ ဆိုရင် background နဲ့ ကိုက်ပါတယ်။ [[mark:draw-con-when]] AI action တွေ များတဲ့ product
      မှာတော့ ခလုတ်နဲ့ စခိုင်းတာက မလိုတဲ့ တွက်ချက်မှုကို လျှော့ပေးပြီး၊ user ကိုယ်တိုင် လိုချင်လို့ နှိပ်တာ ဖြစ်လို့
      ပိုကောင်းပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Design AI user experiences (how to choose between background and constrained AI)",
          url: "https://web.dev/learn/ai/ux-patterns",
        }
    actions:
      - {
          id: draw-choosing,
          type: whiteboard.apply,
          at: { mark: draw-choosing },
          open: true,
          clear: true,
          upsertIds: [e-title, e-ex],
          drawMs: 1400,
        }
      - {
          id: draw-bg-when,
          type: whiteboard.apply,
          at: { mark: draw-bg-when },
          upsertIds: [e-bg-h, e-bg-1, e-bg-2, e-bg-3, e-bg-4],
          drawMs: 2000,
        }
      - {
          id: draw-con-when,
          type: whiteboard.apply,
          at: { mark: draw-con-when },
          upsertIds: [e-con-h, e-con-1, e-con-2, e-con-3],
          drawMs: 1800,
        }

  - id: quiz
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ customer က မုန့်ဟင်းခါး ကို စာလုံးပေါင်း
      မှားရိုက်လိုက်ရင်တောင် ဆိုင်ရဲ့ search က အလိုလို ပြင်ပြီး ရှာပေးတယ် ဆိုပါစို့။ ဒါက ဘယ် pattern
      လဲ။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] အဖြေကတော့ background AI ပါ။
      ဘာကြောင့်လဲဆိုတော့ ရှိပြီးသား search box ကို user ဘာမှ မနှိပ်ရဘဲ ကောင်းအောင် လုပ်ပေးတာ
      ဖြစ်ပြီး၊ မှားရင်လည်း ထိခိုက်မှု နည်းလို့ပါ။ ပြင်ပေးပါ ဆိုတဲ့ ခလုတ် ထည့်ရင် constrained
      ဖြစ်သွားပေမယ့် မဖြစ်မနေ မလိုပါဘူး။
    sources:
      - {
          title: "web.dev Learn AI: Design AI user experiences (Check your understanding; our own example)",
          url: "https://web.dev/learn/ai/ux-patterns",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          clear: true,
          upsertIds: [z-title, z-q1, z-q2, z-q3],
          drawMs: 1800,
        }
      - {
          id: draw-quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [z-a, z-a-note],
          drawMs: 1600,
        }

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ exposure များလေ user လုပ်နိုင်တာ များလေ ဖြစ်ပေမယ့် risk
      လည်း များလာပါတယ်။ [[mark:sel-final-options]] background AI မှာ ကြားနေ label၊ ရှင်းပြချက်နဲ့
      opt out ကို ထည့်ပြီး၊ AI မရလည်း review တွေ ကျန်အောင် fallback ထားပါတယ်။
      [[mark:sel-final-rule]] အနှစ်ချုပ်ကိုလည်း customer တွေ ပြောပုံအတိုင်းပဲ ရေးခိုင်းပါတယ်။
      constrained AI ဖြစ်တဲ့ helper မှာတော့ ရှင်းတဲ့ ခလုတ်စာ၊ ရွေးစရာ သုံးခု၊ ပြန်ထုတ်ခိုင်းတာ၊
      ပြန်ယူတာနဲ့ လူက စစ်ပြီးမှ သုံးတာ ပါပါတယ်။ နောက် lesson မှာတော့ user က
      ကြိုက်သလို ခိုင်းလို့ ရတဲ့ open ended AI နဲ့ course အနှစ်ချုပ်ကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Design AI user experiences",
          url: "https://web.dev/learn/ai/ux-patterns",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: recap }, open: false }
      - {
          id: open-main-final,
          type: workspace.openFile,
          at: { mark: sel-final-options },
          path: src/main.js,
        }
      - id: sel-final-options
        type: editor.select
        at: { afterAction: open-main-final }
        target: { file: src/main.js, text: "      label: \"အနှစ်ချုပ်\",\n", occurrence: 1 }
      - {
          id: open-highlights-final,
          type: workspace.openFile,
          at: { mark: sel-final-rule },
          path: src/highlights.js,
        }
      - id: sel-final-rule
        type: editor.select
        at: { afterAction: open-highlights-final }
        target:
          {
            file: src/highlights.js,
            text: "'Report trends, not claims: always say who says it",
            occurrence: 1,
          }
      - {
          id: expect-final-options,
          type: expect.file,
          at: { afterAction: sel-final-rule },
          path: src/main.js,
          contains: "      label: \"အနှစ်ချုပ်\",\n",
        }
      - {
          id: expect-final-rule,
          type: expect.file,
          at: { afterAction: expect-final-options },
          path: src/highlights.js,
          contains: "'Report trends, not claims: always say who says it, for example \"customer တချို့က … လို့ ပြောပါတယ်\".',\n",
        }
checks:
  - { type: timing.p95Ms, max: 300 }
