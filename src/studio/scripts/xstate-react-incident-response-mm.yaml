  - id: actor-react-model
    narration: >
      ဒီနေရာမှာ Machine နဲ့ Actor ကို တစ်ခုတည်းလို့ မှားမယူဆမိဖို့ အရေးကြီးပါတယ်။ Machine
      ဆိုတာကတော့ စည်းမျဉ်းစာရွက်တစ်ခုနဲ့ တူပါတယ်။ ဘယ် State က စမလဲ၊ Event ရလာရင် ဘယ် Transition
      လုပ်မလဲဆိုတာ ရေးထားပေမဲ့ သူ့ဘာသာ အလုပ်လုပ်မနေသေးဘူး။ [[mark:draw-machine-logic]] XState က
      ဒီစည်းမျဉ်းတွေကို Actor Logic လို့ သတ်မှတ်တယ်။ Logic တစ်ခုတည်းကနေ Incident တစ်ခုစီအတွက်
      Actor သီးခြား ဖန်တီးနိုင်တယ်။ Machine တစ်ခုလုံးကို ပုံတူကူးရေးတာ မဟုတ်ပါဘူး။
      စည်းမျဉ်းတူပေမဲ့ Actor တစ်ခုစီမှာ ကိုယ်ပိုင် Snapshot နဲ့ ကိုယ်ပိုင် Context ရှိလာမယ်။
      [[mark:draw-running-actor]] Actor ဖန်တီးပြီး start လုပ်လိုက်မှ Event လက်ခံနိုင်တယ်။ ActorRef
      က အဲဒီ Actor ကို Event ပို့ဖို့ သိမ်းထားတဲ့ reference ပါ။ send နဲ့ Event ပို့လိုက်ရင် Actor
      က လက်ရှိ Snapshot ကိုယူပြီး Machine Logic အတိုင်း နောက် Snapshot ကိုတွက်မယ်။ Snapshot ထဲမှာ
      state.value နဲ့ context သာမက status၊ matches နဲ့ can လည်း အသုံးပြုနိုင်တယ်။ matches က Actor
      ဘယ် State မှာရှိလဲ မေးဖို့သုံးတယ်။ can က Event တစ်ခုကို လက်ရှိ State မှာ လက်ခံနိုင်မလား
      ကြိုမေးဖို့သုံးတယ်။ [[mark:draw-react-loop]] React ဘက်ကတော့ Snapshot ရလာရင် UI ကို render
      လုပ်မယ်။ အသုံးပြုသူက button နှိပ်ရင် Event တစ်ခု ပြန်ပို့မယ်။ ဒီလို လည်ပတ်နေချိန်မှာ React က
      နောက် State ကို ကိုယ်တိုင် မရွေးဘူး။ React က Event ပို့လိုက်တယ်၊ Machine က ရွေးချယ်ပေးတယ်၊
      ပြီးတော့ React က ရလာတဲ့ Snapshot ကို ပြပေးတာမျိုးပါ။ useMachine သုံးလိုက်ရင် Component
      စတင်ချိန်မှာ Actor ကို ဖန်တီးပြီး start လုပ်ပေးသလို Component ပျောက်သွားချိန်မှာလည်း
      ရပ်ပေးပါတယ်။
    sources:
      - title: "Stately Docs — Actors"
        url: "https://stately.ai/docs/actors"
      - title: "Stately Docs — State machine snapshots"
        url: "https://stately.ai/docs/states"
      - title: "Stately Docs — @xstate/react"
        url: "https://stately.ai/docs/xstate-react"
