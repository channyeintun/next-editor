build:
  # Studio replaces this built-in profile with the selected Burmese VoxCPM2
  # profile at render time when the signed-in user has the D1 capability.
  voiceProfile: pocket-alba-v1
  seed: 83

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: npm ci --no-audit --no-fund
  runCommand: npm run dev
  expectedPort: 5173
  lockfilePath: package-lock.json
  environment: {}

scenes:
  - id: why-explicit-state
    narration: >
      ဒီသင်ခန်းစာမှာ XState API စာရင်းကို တစ်ခုပြီးတစ်ခု ဖတ်ပြမှာ မဟုတ်ပါဘူး။ တကယ့်လုပ်ငန်းခွင်က
      ပြဿနာတစ်ခုကို အတူပုံဖော်ပြီး ဘာကြောင့် XState လိုအပ်လာသလဲဆိုတာကနေ စကြရအောင်။ Checkout API
      ပျက်သွားပြီး P1 Incident တက်လာတယ်လို့ အတူမြင်ယောင်ကြည့်ရအောင်။ အဖွဲ့က Incident အခြေအနေကို React UI
      မှာ ပြချင်တယ်။ [[mark:open-why-board]] ပထမဆုံး စိတ်ကူးရနိုင်တာက isReported၊ isInvestigating၊
      isMonitoring နဲ့ isResolved ဆိုတဲ့ boolean flag လေးခုထားတာပါ။ Flag တစ်ခုချင်းစီကို
      ကြည့်ရင်တော့ နားလည်ရလွယ်ပါတယ်။ ဒါပေမဲ့ flag လေးခုပေါင်းလိုက်ရင် ဖြစ်နိုင်တဲ့ အတွဲအစပ်က
      ဆယ့်ခြောက်မျိုးအထိ ရှိလာနိုင်ပါတယ်။ အဲဒီဆယ့်ခြောက်မျိုးလုံးက လုပ်ငန်းအရ မှန်သလားဆိုတော့
      မမှန်ပါဘူး။ [[mark:show-invalid-booleans]] ဒီမှာ Reported၊ Investigating နဲ့ Monitoring
      သုံးခုလုံး true ဖြစ်နေတယ်။ TypeScript အနေနဲ့ကတော့ boolean အမျိုးအစားတွေ မှန်နေတာမို့
      လက်ခံပေးလိုက်မှာပါ။ ဒါပေမဲ့ Incident တစ်ခုက အဲဒီ State သုံးခုမှာ တစ်ပြိုင်နက် ရှိနေလို့
      မရဘူးလေ။ UI တစ်နေရာမှာ flag တစ်ခု ပြောင်းဖို့ မေ့သွားတာနဲ့ ဒီလို impossible State တွေ
      ပေါ်လာတတ်ပါတယ်။ ဒီအမှားကို compiler က မကယ်နိုင်တာ ဘာကြောင့်လဲဆိုတော့ လုပ်ငန်းစည်းမျဉ်းကို
      data ပုံစံထဲ မထည့်ထားလို့ပါ။ [[mark:show-finite-value]] Finite State Model သုံးလိုက်ရင်
      လက်ရှိအခြေအနေကို value တစ်ခုတည်းနဲ့ ဖော်ပြပေးမှာပါ။ State က monitoring ဆိုရင် reported နဲ့
      resolved တစ်ပြိုင်နက် ဖြစ်နေတဲ့ အခြေအနေမျိုးကို ဖန်တီးလို့ကို မရတော့ဘူး။ ပြောင်းလဲချင်ရင်
      Event ပို့လိုက်ရုံပါပဲ။ Machine က လက်ရှိ State နဲ့ Event ကိုကြည့်ပြီး ခွင့်ပြုထားတဲ့
      Transition ရှိမှ နောက် State ကို ပြောင်းပေးမှာပါ။ [[mark:show-course-map]] ဒါကြောင့်
      အရင်ဆုံး State ကို ဘယ်လိုပုံဖော်မလဲဆိုတာ လေ့လာမယ်။ ပြီးရင် Machine ကို run ပေးတဲ့ Actor၊
      React နဲ့ ချိတ်တဲ့ Hook တွေ၊ XState Store နဲ့ နောက်ဆုံး စစ်ဆေးပုံအထိ ဆက်သွားမယ်။
      ဒီအခြေခံပုံကို နားလည်ပြီးမှ Editor ထဲဝင်ပြီး code ရေးကြမယ်။
    sources:
      - title: "Stately Docs — State machines"
        url: "https://stately.ai/docs/machines"
      - title: "Stately Docs — Finite states"
        url: "https://stately.ai/docs/finite-states"
      - title: "Stately Docs — Events and transitions"
        url: "https://stately.ai/docs/transitions"
    actions:
      - id: open-why-state-board
        type: whiteboard.apply
        at: { mark: open-why-board }
        open: true
        maximized: true
        clear: true
        upsertIds: [why-title, booleans-box, booleans-heading, booleans-body]
        drawMs: 1500
      - id: mark-invalid-boolean-state
        type: whiteboard.apply
        at: { mark: show-invalid-booleans }
        upsertIds: [invalid-circle]
        drawMs: 800
      - id: show-single-finite-value
        type: whiteboard.apply
        at: { mark: show-finite-value }
        upsertIds:
          [model-arrow, state-value-box, state-value-heading, state-value-body, invalid-rule]
        drawMs: 1500
      - id: show-full-course-map
        type: whiteboard.apply
        at: { mark: show-course-map }
        upsertIds: [course-map-box, course-map-label]
        drawMs: 900

  - id: incident-domain
    narration: >
      အခု Incident တစ်ခု ဘယ်လိုရွေ့သွားမလဲဆိုတာ Statechart ပေါ်မှာ အတူဆွဲကြည့်ရအောင်။ ဒီနေရာမှာ
      စကားလုံးသုံးလုံးကို သေချာခွဲခြားနားလည်ထားဖို့ လိုပါတယ်။ State ဆိုတာ လက်ရှိ ဘယ်အခြေအနေမှာ
      ရှိနေလဲဆိုတာကို ပြောတာပါ။ Event ဆိုတာကတော့ ဘာဖြစ်လာသလဲဆိုတာကို ပြောတာပါ။ Transition ကတော့ ဒီ
      State မှာ ဒီ Event ရလာရင် ဘယ်ကိုသွားမလဲဆိုတာကို ပြောတာပါ။ [[mark:open-domain-board]]
      အဲဒီသုံးခုကို Incident အဆင့်တွေထဲ ထည့်ကြည့်မယ်။ [[mark:draw-domain-states]] Pager က alert
      ပို့လာချိန်မှာ Incident က Reported ဆိုတဲ့ initial State မှာ စတင်ပါတယ်။ Operator တစ်ယောက်က
      တာဝန်ယူလိုက်တဲ့အခါ ACKNOWLEDGE Event ပို့လိုက်မယ်။ Machine က အဲဒီ Event ကို Reported မှာ
      လက်ခံထားလို့ Investigating ဆီ ရွေ့သွားမယ်။ အကြောင်းရင်းရှာပြီး ပြင်ဆင်ချက်အသုံးပြုဖို့
      အဆင်သင့်ဖြစ်ရင် APPLY_MITIGATION Event ပို့လိုက်မယ်။ အဲဒီအခါ Mitigating State ဝင်ပြီး
      နောက်မှာရေးမယ့် async Actor ကို စတင်ပေးမယ်။ ပြင်ဆင်ချက်အောင်မြင်သွားရင် Actor ရဲ့ onDone က
      Monitoring ဆီ အလိုအလျောက် ပို့ပေးမှာပါ။ Monitoring မှာတော့ production metric တွေ
      တည်ငြိမ်လာမလာ စောင့်ကြည့်မယ်။ စစ်ဆေးမှုတွေ ပြည့်မှ RESOLVE Event က Resolved Final State ဆီ
      ရောက်ခွင့်ရမယ်။ Final State ဆိုတာ ဒီ Incident ကို ကိုင်တွယ်တဲ့ Actor
      အလုပ်ပြီးဆုံးသွားပြီလို့ ပြောတာပါ။ ဒီ Event နာမည်တွေက button နာမည်တွေ မဟုတ်ပါဘူး။
      ACKNOWLEDGE ဆိုတာ တာဝန်ယူပြီးပြီဆိုတဲ့ ဖြစ်ရပ်ကို နာမည်ပေးထားတာပါ။ ဒါကြောင့် UI ကပို့လည်း ဒီ
      Event၊ API ကပို့လည်း ဒီ Event၊ test ကပို့လည်း ဒီ Event ကိုပဲ အသုံးပြုနိုင်ပါတယ်။
      ခွင့်ပြုထားတဲ့ လမ်းကြောင်းအားလုံးကို Machine တစ်နေရာမှာ ဖတ်လို့ရလာမှာပါ။
    sources:
      - title: "Stately Docs — State machines"
        url: "https://stately.ai/docs/machines"
      - title: "Stately Docs — Events and transitions"
        url: "https://stately.ai/docs/transitions"
      - title: "Stately Docs — Final states"
        url: "https://stately.ai/docs/final-states"
    actions:
      - id: open-incident-domain-board
        type: whiteboard.apply
        at: { mark: open-domain-board }
        open: true
        maximized: true
        clear: true
        upsertIds: [domain-title, domain-subtitle]
        drawMs: 700
      - id: draw-incident-state-path
        type: whiteboard.apply
        at: { mark: draw-domain-states }
        timeoutMs: 6000
        upsertIds:
          [
            reported-box,
            reported-label,
            reported-note,
            arrow-one,
            event-one,
            investigating-box,
            investigating-label,
            investigating-note,
            arrow-two,
            event-two,
            mitigating-box,
            mitigating-label,
            mitigating-note,
