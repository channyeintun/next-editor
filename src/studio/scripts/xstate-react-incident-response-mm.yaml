        type: whiteboard.apply
        at: { mark: draw-invoke-rule }
        upsertIds: [invoke-rule-box, invoke-rule]
        drawMs: 900

  - id: react-hook-boundaries
    narration: >
      Actor ကို React နဲ့ ချိတ်ဖို့အတွက် Hook တစ်မျိုးတည်းပဲ ရှိတာတော့ မဟုတ်ပါဘူး။ ဘယ် Hook
      ရွေးမလဲဆိုတာ Machine စည်းမျဉ်းကို မပြောင်းဘူး။ Actor ရဲ့ ဘယ်ပြောင်းလဲမှုကြောင့် Component
      ကို re-render လုပ်စေချင်လဲဆိုတာ ရွေးတာပါ။ [[mark:draw-use-machine]] useMachine က Machine
      Logic ကိုလက်ခံပြီး snapshot၊ send နဲ့ actorRef သုံးခု ပြန်ပေးတယ်။ Component တစ်ခုက Snapshot
      အများစုကို သုံးနေတယ်ဆိုရင်တော့ ဒီ Hook နဲ့ စပြီး အသုံးပြုတာက ပိုပြီး နားလည်ရလွယ်ပါတယ်။
      useMachine ဟာ Machine အတွက် နာမည်ပေးထားတဲ့ useActor ပုံစံတစ်ခုပါ။
      [[mark:draw-use-actor-ref]] useActorRef ကလည်း Actor ကိုဖန်တီးပြီး start လုပ်ပေးတယ်။ ဒါပေမဲ့
      ActorRef တစ်ခုတည်း ပြန်ပေးတာကြောင့် Snapshot အသစ်တိုင်း ဒီ Component re-render မဖြစ်ဘူး။
      Event ပို့ရုံပဲလုပ်တဲ့ toolbar တစ်ခုဆို useActorRef က သင့်တော်နိုင်တယ်။
      [[mark:draw-use-selector]] State တစ်စိတ်တစ်ပိုင်းကို ပြချင်ရင် useSelector သုံးမယ်။ ဥပမာ
      stableChecks number ကိုသာ ရွေးထားရင် အဲဒီ number ပြောင်းမှ Component re-render ဖြစ်မယ်။
      number နဲ့ string လို value တွေကိုတော့ ပုံမှန် equality စစ်တာနဲ့ လုံလောက်တယ်။ Selector က
      object သို့မဟုတ် array အသစ်အမြဲပြန်ပေးရင် value တူနေပေမဲ့ reference အသစ်ဖြစ်နေမယ်။
      အဲဒီအခါမျိုးမှာ selector ကို တည်ငြိမ်အောင် ရေးတာမျိုး ဒါမှမဟုတ် compare function
      ပေးတာမျိုးကို စဉ်းစားပေးရပါမယ်။ [[mark:draw-actor-context]] Actor တစ်ခုကို React tree အနှံ့
      မျှဝေချင်ရင် createActorContext သုံးနိုင်တယ်။ သူက Provider နဲ့ useActorRef၊ useSelector
      helper တွေ ဖန်တီးပေးတယ်။ ဒီဥပမာမှာ အပိုင်းအားလုံးကို မျက်နှာပြင်တစ်ခုထဲပြမှာမို့ useMachine
      သုံးမယ်။ Component တွေခွဲလာတဲ့အခါ useActorRef နဲ့ useSelector ဘယ်လိုရွေးမလဲကို ဒီပုံနဲ့
      ပြန်စဉ်းစားနိုင်တယ်။
    sources:
      - title: "Stately Docs — @xstate/react"
        url: "https://stately.ai/docs/xstate-react"
      - title: "Stately Docs — @xstate/react useSelector"
        url: "https://stately.ai/docs/xstate-react"
    actions:
      - id: draw-use-machine-hook
        type: whiteboard.apply
        at: { mark: draw-use-machine }
        clear: true
        upsertIds: [hooks-title, use-machine-card, use-machine-heading, use-machine-body]
        drawMs: 1200
      - id: draw-use-actor-ref-hook
        type: whiteboard.apply
        at: { mark: draw-use-actor-ref }
        upsertIds: [use-ref-card, use-ref-heading, use-ref-body]
        drawMs: 1100
      - id: draw-use-selector-hook
        type: whiteboard.apply
        at: { mark: draw-use-selector }
        upsertIds: [use-selector-card, use-selector-heading, use-selector-body]
        drawMs: 1100
      - id: draw-create-actor-context
        type: whiteboard.apply
        at: { mark: draw-actor-context }
        upsertIds: [context-provider-box, context-provider-label]
        drawMs: 900

  - id: store-event-flow
    narration: >
      XState Store ဆိုတဲ့ နာမည်ကို ကြားလိုက်တာနဲ့ State Machine ကို သေးအောင် လုပ်ထားတာလို့ ထင်စရာ
      ရှိပါတယ်။ တကယ်တမ်းကျတော့ အသုံးပြုရတဲ့ အကြောင်းရင်းက မတူပါဘူး။ State အဆင့်လိုက်ကူးရမယ့်
      စည်းမျဉ်းမရှိဘဲ data ကို Event နဲ့ ပြောင်းချင်တဲ့အခါ သုံးတဲ့ Store ပါ။ Incident dashboard
      မှာ operator ရေးတဲ့ draft နဲ့ note စာရင်းကို အတူစဉ်းစားကြည့်ရအောင်။ Note တစ်ခုထည့်ဖို့ Statechart
      တစ်ခုလုံး မလိုဘူး။ ဒါပေမဲ့ ဘယ် Event ကြောင့် data ပြောင်းသလဲကို ရှင်းရှင်းလင်းလင်း
      သိချင်တယ်။ [[mark:draw-store-old-context]] createStore မှာ စစချင်းသုံးမယ့် Context နဲ့ Event
      တစ်ခုစီကို ကိုင်တွယ်မယ့် function တွေ ထည့်မယ်။ ဒီဥပမာမှာ Context ထဲ draft string နဲ့ notes
      array ရှိတယ်။ [[mark:draw-store-transition]] အသုံးပြုသူက Add note နှိပ်ရင်
      store.trigger.addNote ကို ခေါ်မယ်။ addNote function က လက်ရှိ Context ကိုရပြီး Context
      အသစ်တစ်ခု ပြန်ပေးရတယ်။ Draft ကိုရှင်းမယ်၊ note အသစ်ကို array ထဲထည့်မယ်၊ မပြောင်းတဲ့ field
      တွေကို spread နဲ့ ဆက်ယူမယ်။ Draft က အလွတ်ဖြစ်နေရင် undefined ပြန်ပေးနိုင်တယ်။ အဲဒီအခါ Store
      က ဒီ Event နဲ့ data မပြောင်းသင့်ဘူးလို့ သိမယ်။ [[mark:draw-store-next-context]] Context
      အသစ်ပြန်လာတာနဲ့ Store Snapshot အသစ် ထုတ်ပေးမယ်။ XState Store က ဖန်တီးလိုက်တာနဲ့
      အလုပ်လုပ်နေပြီ ဖြစ်တဲ့အတွက် Actor လိုမျိုး start သီးခြား ခေါ်ပေးစရာ မလိုပါဘူး။
      [[mark:draw-store-notification]] React ဘက်မှာ @xstate/store-react ရဲ့ useSelector နဲ့ လိုတဲ့
      value ကို ရွေးမယ်။ notes ကိုရွေးထားတဲ့ Component က notes ပြောင်းမှ re-render ဖြစ်မယ်။ draft
      ကိုရွေးထားတဲ့ input က draft ပြောင်းမှ re-render ဖြစ်မယ်။ Store ကို module အပြင်ဘက်မှာ
      ဖန်တီးထားရင် Component အများကြီးက တစ်ခုတည်းကို မျှဝေသုံးနိုင်တယ်။ Component တစ်ခုစီအတွက်
      Store သီးခြားလိုရင် useStore သုံးပြီး အဲဒီ Component အသက်ရှင်နေသရွေ့သာ ရှိမယ့် Store
      ဖန်တီးနိုင်တယ်။
    sources:
      - title: "Stately Docs — XState Store"
        url: "https://stately.ai/docs/xstate-store"
      - title: "Stately Docs — @xstate/store-react"
        url: "https://stately.ai/docs/xstate-store/react"
    actions:
      - id: draw-store-initial-context
        type: whiteboard.apply
        at: { mark: draw-store-old-context }
        clear: true
        upsertIds: [store-flow-title, old-context-box, old-context-label]
        drawMs: 1100
      - id: draw-store-transition-function
        type: whiteboard.apply
        at: { mark: draw-store-transition }
        upsertIds: [trigger-arrow, trigger-label, store-transition-box, store-transition-label]
        drawMs: 1500
      - id: draw-store-next-snapshot
        type: whiteboard.apply
        at: { mark: draw-store-next-context }
        upsertIds: [next-context-arrow, next-context-box, next-context-label, store-purity-rule]
        drawMs: 1500
      - id: draw-store-selector-notification
        type: whiteboard.apply
        at: { mark: draw-store-notification }
        upsertIds: [selector-notify-arrow, selector-notify-box, selector-notify-label]
        drawMs: 1200

  - id: machine-versus-store
    narration: >
      အခုဆို Machine နဲ့ Store နှစ်ခုလုံး ဘယ်လိုအလုပ်လုပ်လဲ မြင်ပြီးပြီ။ ဒါဆို data တစ်ခုရလာတိုင်း
      ဘယ်ဘက်မှာထားမလဲ။ ဒီမေးခွန်းနဲ့ စဉ်းစားကြည့်ရအောင်။ ဒီ data မှာ သွားရမယ့်အစဉ်နဲ့
      မသွားရမယ့်လမ်း ရှိသလား။ [[mark:draw-machine-card]] Incident အဆင့်တွေမှာ လုပ်ရမယ့်အစဉ်
      ရှိတယ်။ Investigating မရောက်ဘဲ Monitoring မရောက်ရဘူး။ Stable check မပြည့်ဘဲ Resolve
      မလုပ်ရဘူး။ Mitigation အလုပ်လုပ်နေချိန်နဲ့ ပြီးသွားချိန်ကို သီးခြား State ပြရမယ်။ ဒီလို
      လုပ်ရမယ့်အစဉ်၊ Guard နဲ့ Final State ရှိတဲ့အတွက် XState Machine ထဲထားမယ်။ နောက်ပိုင်း parent
      State၊ parallel State ဒါမှမဟုတ် child Actor ထပ်လိုလာရင်လည်း Statechart က ဆက်တိုးလို့ရတယ်။
      [[mark:draw-store-card]] Operator note စာရင်းနဲ့ draft text က အသုံးပြုသူရိုက်လိုက်တာနဲ့ UI
      မှာ ချက်ချင်းပြောင်းရမယ့် data ပါ။ Draft ပြောင်းပြီး note ထည့်တာမှာ သွားရမယ့် State အစဉ်
      မရှိဘူး။ Context ကို Event နဲ့ ပြောင်းပြီး React က လိုတဲ့ value ရွေးဖို့ပဲ လိုတယ်။ ဒါကြောင့်
      XState Store ထဲထားမယ်။ [[mark:draw-shared-rule]] နှစ်ခုလုံး Event သုံးတာတူပေမဲ့ ထိန်းရတဲ့အရာ
      မတူဘူး။ Machine က Incident ဘယ်အဆင့်မှာရှိလဲနဲ့ ဘယ်ကိုသွားခွင့်ရှိလဲ ထိန်းမယ်။ Store က
      operator ရေးနေတဲ့ data ကို ထိန်းမယ်။ Machine Context ထဲ UI draft အားလုံး ထည့်စရာမလိုဘူး။
      Store ထဲမှာလည်း isInvestigating boolean ပြန်ဆောက်ပြီး Machine နဲ့ ကိုက်ညီအောင်
      လိုက်ညှိစရာမလိုဘူး။ Incident State ကို သိချင်ရင် Actor Snapshot ကိုမေးမယ်။ Note ကို
      သိချင်ရင် Store Snapshot ကိုမေးမယ်။ ဘယ် data ကို ဘယ်သူက ထိန်းချုပ်ထားလဲဆိုတာ
      ရှင်းရှင်းလင်းလင်း ဖြစ်နေဖို့က အဓိကပါပဲ။ အခုမှ implementation ကို စကြမယ်။
    sources:
      - title: "Stately Docs — XState Store"
        url: "https://stately.ai/docs/xstate-store"
      - title: "Stately Docs — @xstate/store-react"
        url: "https://stately.ai/docs/xstate-store/react"
    actions:
      - id: draw-machine-responsibility
        type: whiteboard.apply
        at: { mark: draw-machine-card }
        clear: true
        upsertIds: [compare-title, machine-card, machine-package, machine-purpose, machine-example]
        drawMs: 1500
      - id: draw-store-responsibility
        type: whiteboard.apply
        at: { mark: draw-store-card }
        upsertIds: [store-card, store-package, store-purpose, store-example]
        drawMs: 1500
      - id: draw-responsibility-rule
        type: whiteboard.apply
        at: { mark: draw-shared-rule }
        upsertIds: [shared-rule-box, shared-rule]
        drawMs: 900

  - id: implement-machine
    narration: >
      [[mark:close-concept-board]] Whiteboard ပေါ်က ပုံကို နားလည်သွားပြီဆိုတော့ အခု Editor
      ထဲဝင်ပြီး အဲဒီပုံကို code အဖြစ် ပြောင်းကြည့်ကြရအောင်။ Workspace မှာ React၊ xstate၊
      @xstate/react နဲ့ @xstate/store-react version အတိအကျ သတ်မှတ်ထားတယ်။ ဒါကြောင့် ဒီသင်ခန်းစာကို
      နောက်တစ်ခါ run လည်း တူညီတဲ့ API ကိုပဲ သုံးမယ်။ [[mark:open-main-file]] main.tsx အပေါ်ဆုံးက
      import တွေကနေ စကြည့်ရအောင်။ xstate က setup၊ assign နဲ့ fromPromise ကို ပေးတယ်။ @xstate/react က
      Machine ကို React Component နဲ့ ချိတ်ဖို့ useMachine ပေးတယ်။ @xstate/store-react က
      createStore နဲ့ Store အတွက် useSelector ပေးတယ်။ Package တစ်ခုချင်းစီက ဘာလုပ်ပေးလဲ
      အရင်ခွဲသိထားရင် code အောက်ပိုင်းကို ဖတ်ရတာ ပိုလွယ်သွားမယ်။ [[mark:select-event-union]] အခု
      IncidentEvent union ကို ကြည့်မယ်။ ACKNOWLEDGE၊ APPLY_MITIGATION၊ VERIFY၊ REGRESS နဲ့ RESOLVE
      က Actor လက်ခံနိုင်တဲ့ Event တွေပါ။ APPLY_MITIGATION Event မှာ incident ID လို data
      ထည့်ချင်ရင် union member ထဲ field ထပ်ထည့်နိုင်တယ်။ ဒီလို union ရေးထားတာကြောင့် Event
      နာမည်စာလုံးမှားတာနဲ့ လိုအပ်တဲ့ data မပါတာကို TypeScript က code ရေးနေချိန်မှာ ပြောနိုင်တယ်။
      [[mark:type-machine]] setup API နဲ့ Context၊ Events၊ Guard နဲ့ Action type တွေကို Actor
      Logic တွေနဲ့အတူ နာမည်ပေးပြီး Machine တည်ဆောက်မယ်။ setup ကိုခေါ်လိုက်တာနဲ့ Actor မစသေးဘူး။
      ဘယ် type နဲ့ ဘယ် implementation တွေ အသုံးပြုမလဲဆိုတာ စုစည်းထားတာပါ။ အဲဒီ setup ကနေ
      createMachine ခေါ်ပြီး id၊ initial၊ context နဲ့ states သတ်မှတ်မယ်။
      [[mark:select-initial-state]] reported က initial State ဖြစ်ပြီး resolved က Final State
      ဖြစ်တယ်။ Actor instance အသစ်တစ်ခုစီက stableChecks သုညနဲ့ mitigationId null ပါတဲ့ initial
      Context ကို ရမယ်။ states object က မျက်နှာပြင်စာရင်း မဟုတ်ဘူးဆိုတာ ဒီမှာ သတိထားရပါတယ်။ State
      တစ်ခုစီမှာ ဘယ် Event လက်ခံပြီး ဘယ်ကိုသွားမလဲ ရေးထားတဲ့နေရာပါ။ Event handler မရှိတဲ့ State
      မှာ Event ပို့ရင် ဘာမှမပြောင်းဘူး။ React Component ထဲမှာ if statement အများကြီး ရေးပြီး
      ဒီစည်းမျဉ်းကို ပြန်တည်ဆောက်စရာ မလိုတော့ဘူး။
    sources:
      - title: "Stately Docs — Setup"
        url: "https://stately.ai/docs/setup"
      - title: "Stately Docs — Actions"
        url: "https://stately.ai/docs/actions"
      - title: "Stately Docs — Guards"
        url: "https://stately.ai/docs/guards"
    actions:
      - id: close-concepts-whiteboard
        type: whiteboard.apply
        at: { mark: close-concept-board }
        open: false
      - id: open-incident-main-file
        type: workspace.openFile
        at: { mark: open-main-file }
        path: src/main.tsx
      - id: select-incident-event-protocol
        type: editor.select
        at: { mark: select-event-union }
        target:
          file: src/main.tsx
          text: "type IncidentEvent ="
          occurrence: 1
      - id: type-incident-machine
        type: editor.type
        at: { mark: type-machine }
        cadence: block
        target:
          file: src/main.tsx
          after: "// MACHINE_IMPLEMENTATION\n"
          occurrence: 1
        text: |

          const incidentMachine = setup({
            types: {} as {
              context: {
                stableChecks: number;
                mitigationId: string | null;
              };
              events: IncidentEvent;
            },
            actors: {
              applyMitigation: fromPromise(async () => {
                await new Promise<void>((resolve) => setTimeout(resolve, 700));
                return { changeId: "CHG-2048" };
              }),
            },
            guards: {
              hasTwoStableChecks: ({ context }) => context.stableChecks >= 2,
            },
            actions: {
              recordStableCheck: assign({
                stableChecks: ({ context }) => context.stableChecks + 1,
              }),
              storeMitigation: assign({
                mitigationId: ({ event }) => event.output.changeId,
              }),
              resetVerification: assign({
                stableChecks: 0,
              }),
            },
          }).createMachine({
            id: "incident",
            initial: "reported",
            context: {
              stableChecks: 0,
              mitigationId: null,
            },
            states: {
              reported: {
                on: { ACKNOWLEDGE: "investigating" },
              },
              investigating: {
                on: { APPLY_MITIGATION: "mitigating" },
              },
              mitigating: {
                invoke: {
                  src: "applyMitigation",
                  onDone: {
                    target: "monitoring",
                    actions: "storeMitigation",
                  },
                  onError: "investigating",
                },
              },
              monitoring: {
                on: {
                  VERIFY: { actions: "recordStableCheck" },
                  REGRESS: {
                    target: "investigating",
                    actions: "resetVerification",
                  },
                  RESOLVE: {
                    guard: "hasTwoStableChecks",
                    target: "resolved",
                  },
                },
              },
              resolved: {
                type: "final",
              },
            },
          });
      - id: select-machine-initial-state
        type: editor.select
        at: { mark: select-initial-state }
        target:
          file: src/main.tsx
          text: 'initial: "reported"'
          occurrence: 1

  - id: implement-invoked-actor
    narration: >
      Machine block ကြီးကို အစအဆုံး တစ်ခါတည်း မဖတ်ဘဲ async အပိုင်းကို အရင်ခွဲကြည့်ရအောင်။
      [[mark:select-promise-logic]] actors ထဲမှာ applyMitigation ကို fromPromise Actor Logic
      အဖြစ်သတ်မှတ်ထားတယ်။ ဒီဥပမာမှာ Promise က မီလီစက္ကန့် ခုနစ်ရာစောင့်ပြီး CHG-2048 ဆိုတဲ့ change
      ID ပြန်ပေးမယ်။ အချိန်ခဏစောင့်ထားတာက Mitigating State ကို မျက်စိနဲ့မြင်နိုင်ဖို့ပါ။ တကယ့် app
      မှာ ဒီ function က incident ID ကို input အဖြစ်ယူပြီး API ကို ပြင်ဆင်ချက်ပို့နိုင်တယ်။ Promise
      ပြန်ပေးတဲ့ value က Actor output ဖြစ်လာမယ်။ ဒါကြောင့် onDone ရောက်ချိန် event.output က
      ဘယ်ပုံစံရှိမလဲကို TypeScript သိထားနိုင်တယ်။ [[mark:select-invoke-source]] Investigating မှာ
      APPLY_MITIGATION Event ဝင်ရင် target က Mitigating ဖြစ်တယ်။ Mitigating State ဝင်မှ invoke က
      applyMitigation Actor ကို start လုပ်တယ်။ React re-render ဖြစ်တိုင်း API ကို
      ပြန်ခေါ်နေတာမျိုး မဟုတ်ပါဘူး။ Mitigating State ကိုဝင်တဲ့အချိန်နဲ့ Actor စတဲ့အချိန်ကို
      ချိတ်ထားတာပါ။ [[mark:select-invoke-completion]] onDone ရောက်ရင် Monitoring ဆီ Transition
      လုပ်ပြီး storeMitigation Action က output changeId ကို Context ထဲ assign လုပ်တယ်။ onError
      ဖြစ်ရင် Investigating ဆီပြန်သွားမယ်။ နောက်ပိုင်း retry Event ထည့်ချင်ရင် အဲဒီ State မှာ
      ထပ်ရေးနိုင်တယ်။ အောင်မြင်ရင် ဘယ်ကိုသွားမလဲ၊ မအောင်မြင်ရင် ဘယ်ကိုပြန်မလဲကို တစ်နေရာမှာ
      ဖတ်လို့ရတယ်။ isLoading နဲ့ error string ကို React နေရာအမျိုးမျိုးမှာ ကိုယ်တိုင်
      လိုက်ညှိနေစရာ မလိုတော့ပါဘူး။
    sources:
      - title: "Stately Docs — Promise actors"
        url: "https://stately.ai/docs/promise-actors"
      - title: "Stately Docs — Invoking actors"
        url: "https://stately.ai/docs/invoke"
    actions:
      - id: select-promise-actor-logic
        type: editor.select
        at: { mark: select-promise-logic }
        target:
          file: src/main.tsx
          text: "fromPromise(async () => {"
          occurrence: 1
      - id: select-invoked-actor-source
        type: editor.select
        at: { mark: select-invoke-source }
        target:
          file: src/main.tsx
          text: 'src: "applyMitigation"'
          occurrence: 1
      - id: select-invoked-actor-completion
        type: editor.select
        at: { mark: select-invoke-completion }
        target:
          file: src/main.tsx
          text: 'actions: "storeMitigation"'
          occurrence: 1

  - id: implement-guards-actions
    narration: >
      Async အပိုင်းပြီးပြီဆိုတော့ အခု Event တစ်ခု ရလာတဲ့အခါ ချက်ချင်းဆုံးဖြတ်တဲ့ Transition
      အပိုင်းကို ဆက်ကြည့်ကြမယ်။ [[mark:select-machine-guard]] RESOLVE handler မှာ target မရွေးခင်
      hasTwoStableChecks Guard ကို အရင်ခေါ်မယ်။ ဒီ Guard က Context ကိုဖတ်ပြီး true သို့မဟုတ် false
      ပြန်ပေးတယ်။ true ဖြစ်မှ resolved ဆီသွားမယ်။ false ဖြစ်ရင် လက်ရှိ Monitoring Snapshot ကိုပဲ
      ဆက်ထားမယ်။ React button ကို မတော်တဆ enable လုပ်မိသွားရင်တောင် ဒီ Guard ရှိနေသရွေ့ Incident
      ကို စောစောပိတ်လို့ မရပါဘူး။ [[mark:select-machine-action]] VERIFY က recordStableCheck Action
      ကို ခေါ်တယ်။ assign callback က လက်ရှိ Context ကို လက်ခံပြီး stableChecks value အသစ်တွက်တယ်။
      XState က State value နဲ့ Context အသစ်ကို Snapshot တစ်ခုတည်းအဖြစ် ထုတ်ပေးမယ်။ Action ကို
      recordStableCheck လို့ နာမည်ပေးထားတာကြောင့် config ဖတ်ချိန်မှာ ဘာလုပ်ချင်တာလဲ သိသာတယ်။
      [[mark:select-regression-path]] REGRESS Transition က Monitoring ဆီကနေ Investigating
      ဆီပြန်သွားပြီး resetVerification Action နဲ့ stableChecks ကို သုည လုပ်တယ်။ State ပြောင်းတာနဲ့
      stableChecks ပြန်စတာကို Transition တစ်ကြိမ်တည်းမှာ လုပ်ပေးတာပါ။ State က Investigating
      ဖြစ်သွားပေမဲ့ stableChecks အဟောင်းကျန်နေတဲ့ Snapshot ကြားထဲ မပေါ်ဘူး။ Guard၊ Action နဲ့
      target ကို အတူကြည့်လိုက်ရင် Incident ပိတ်ခွင့်ပေးတဲ့ စည်းမျဉ်းတစ်ခုလုံးကို ဖတ်လို့ရတယ်။
    sources:
      - title: "Stately Docs — Guards"
        url: "https://stately.ai/docs/guards"
      - title: "Stately Docs — Actions and assign"
        url: "https://stately.ai/docs/actions"
      - title: "Stately Docs — Events and transitions"
        url: "https://stately.ai/docs/transitions"
    actions:
      - id: select-incident-guard
        type: editor.select
        at: { mark: select-machine-guard }
        target:
          file: src/main.tsx
          text: 'guard: "hasTwoStableChecks"'
          occurrence: 1
      - id: select-context-assignment
        type: editor.select
        at: { mark: select-machine-action }
        target:
          file: src/main.tsx
          text: "stableChecks: ({ context }) => context.stableChecks + 1"
          occurrence: 1
      - id: select-regression-transition
        type: editor.select
        at: { mark: select-regression-path }
        target:
          file: src/main.tsx
          text: 'actions: "resetVerification"'
          occurrence: 1

  - id: implement-store
    narration: >
      Machine ပြီးပြီဆိုတော့ operator note တွေကို ထိန်းပေးမယ့် activityStore ကို ရေးကြည့်ကြမယ်။
      Store ရဲ့ initial Context မှာ draft အလွတ်တစ်ခုနဲ့ Pager ဖွင့်ထားကြောင်း note တစ်ခု
      ထည့်ထားတယ်။ [[mark:type-activity-store]] on object ထဲ Event နှစ်ခု ထည့်မယ်။ changeDraft က
      input ကပို့လာတဲ့ value ကို လက်ခံပြီး draft အသစ်ပါတဲ့ Context ပြန်ပေးတယ်။ Context ထဲ notes
      လည်းရှိတာကြောင့် spread နဲ့ အဟောင်းကိုယူပြီး draft တစ်ခုပဲ ပြောင်းထားတယ်။ addNote က draft
      ရှေ့နောက်က whitespace တွေ ဖယ်မယ်။ စာမရှိရင် undefined ပြန်ပေးလို့ Store မပြောင်းဘူး။
      စာရှိရင် draft ကိုရှင်းပြီး note အသစ်ပါတဲ့ array တစ်ခု ပြန်ဆောက်မယ်။ ဒီ function နှစ်ခုကို
      ကြည့်လိုက်ရုံနဲ့ Event တစ်ခုစီကြောင့် data ဘယ်လိုပြောင်းသွားလဲ သိနိုင်ပါတယ်။
      [[mark:select-store-trigger]] React input က activityStore.trigger.changeDraft ကို
      ခေါ်ထားတာကို ဒီမှာတွေ့ရတယ်။ XState Machine ရဲ့ send က type ပါတဲ့ Event object လက်ခံတယ်။
      Store ရဲ့ trigger ကတော့
      Event နာမည်နဲ့ method ဖန်တီးပေးတယ်။ ဒါကြောင့် trigger.changeDraft ခေါ်ချိန် value payload
      မပါရင် TypeScript ကပြောပေးမယ်။ addNote မှာ payload မလိုလို့ trigger.addNote ကို argument
      မပါဘဲ ခေါ်နိုင်တယ်။ [[mark:select-store-selector]] import မှာ Store ရဲ့ useSelector ကို
      useStoreSelector လို့ နာမည်ပြောင်းထားတယ်။ Actor အတွက် Selector နဲ့ Store အတွက် Selector
      မရောအောင် နာမည်ခွဲထားတာပါ။ နောက် React binding အပိုင်းမှာ draft နဲ့ notes ကို
      သီးခြားရွေးမယ်။
    sources:
      - title: "Stately Docs — XState Store transitions"
        url: "https://stately.ai/docs/xstate-store"
      - title: "Stately Docs — @xstate/store-react useSelector"
        url: "https://stately.ai/docs/xstate-store/react"
    actions:
      - id: type-activity-store-transitions
        type: editor.type
        at: { mark: type-activity-store }
        cadence: line-by-line
        target:
          file: src/main.tsx
          after: "    // STORE_TRANSITIONS\n"
          occurrence: 1
        text: |
          changeDraft: (context, event: { value: string }) => ({
            ...context,
            draft: event.value,
          }),
          addNote: (context) => {
            const note = context.draft.trim();

            if (!note) {
              return;
            }

            return {
              ...context,
              draft: "",
              notes: [...context.notes, note],
            };
          },
      - id: select-store-trigger-call
        type: editor.select
        at: { mark: select-store-trigger }
        target:
          file: src/main.tsx
          text: "activityStore.trigger.changeDraft({ value: event.target.value })"
          occurrence: 1
      - id: select-store-selector-import
        type: editor.select
        at: { mark: select-store-selector }
        target:
          file: src/main.tsx
          text: "useSelector as useStoreSelector"
          occurrence: 1

  - id: bind-react
    narration: >
      အခုဆိုရင် Machine နဲ့ Store နှစ်ခုလုံး ရှိနေပြီပေါ့။ React Component က သူတို့ဆီက value
      ယူပြီး Event ပြန်ပို့ဖို့သာ ကျန်တော့တယ်။ [[mark:type-react-bindings]] useMachine ကို
      incidentMachine နဲ့ခေါ်မယ်။ သူပြန်ပေးတဲ့ snapshot က UI ပြဖို့သုံးမယ်၊ send က အသုံးပြုသူရဲ့
      Event ပို့ဖို့သုံးမယ်။ ပြီးရင် useStoreSelector နှစ်ကြိမ်ခေါ်ပြီး draft နဲ့ notes ကို
      သီးခြားရွေးမယ်။ draft ပဲပြောင်းရင် notes ကိုရွေးထားတဲ့ Selector ရဲ့ result က မပြောင်းဘူး။
      Note ထည့်မှသာ အဲဒီ result ပြောင်းမယ်။ ဒီလိုမျိုး ရွေးထားတဲ့အတွက် Component တွေကို
      ခွဲလိုက်တဲ့အခါ ဘယ်အစိတ်အပိုင်းက ဘာကြောင့် re-render ဖြစ်မလဲဆိုတာကို ရှင်းရှင်းလင်းလင်း
      သိနိုင်မှာပါ။ Snapshot ထဲက value ကို string ပြောင်းပြီး stateLabels နဲ့ လူဖတ်လို့ရတဲ့
      Reported၊ Investigating စတဲ့စာသားတွေ ပြမယ်။ Context ထဲက stableChecks နဲ့ mitigationId
      ကိုလည်း တိုက်ရိုက်ဖတ်မယ်။ [[mark:select-snapshot-can]] RESOLVE button မှာ snapshot.can ကို
      သုံးထားတယ်။ လက်ရှိ Snapshot မှာ RESOLVE Event ပို့ရင် Transition ဖြစ်နိုင်မလား Machine ကို
      အရင်မေးတာပါ။ false ဆို button ကို disable ပြမယ်။ ဒါပေမဲ့ button ပုံစံတစ်ခုတည်းကို
      အားကိုးထားတာမဟုတ်ဘူး။ Event တကယ်ရောက်လာချိန် Guard က ထပ်စစ်မယ်။ [[mark:select-react-send]]
      Acknowledge button ကိုနှိပ်ရင် send နဲ့ ACKNOWLEDGE Event ပို့ထားတာကို ဒီမှာတွေ့ရတယ်။ Component က
      state variable အများကြီးကို တစ်ခုချင်းစီ လိုက်ပြင်နေစရာ မလိုတော့ပါဘူး။ Actor က Snapshot
      အသစ်ထုတ်ပေးပြီး React က အဲဒီ Snapshot အတိုင်း UI ကို ပြန်ဆွဲမယ်။ ဒီနေရာမှာ UI နဲ့
      လုပ်ငန်းစည်းမျဉ်း ဘယ်လိုခွဲထားလဲ မြင်လာပြီ။
    sources:
      - title: "Stately Docs — @xstate/react useMachine"
        url: "https://stately.ai/docs/xstate-react"
      - title: "Stately Docs — @xstate/store-react"
        url: "https://stately.ai/docs/xstate-store/react"
      - title: "React Docs — Responding to events"
        url: "https://react.dev/learn/responding-to-events"
    actions:
      - id: type-react-state-bindings
        type: editor.type
        at: { mark: type-react-bindings }
        cadence: block
        target:
          file: src/main.tsx
          after: "  // REACT_BINDINGS\n"
          occurrence: 1
        text: |

          const [snapshot, send] = useMachine(incidentMachine);
          const draft = useStoreSelector(
            activityStore,
            (storeSnapshot) => storeSnapshot.context.draft,
          );
          const notes = useStoreSelector(
            activityStore,
            (storeSnapshot) => storeSnapshot.context.notes,
          );
      - id: select-snapshot-can
        type: editor.select
        at: { mark: select-snapshot-can }
        target:
          file: src/main.tsx
          text: 'snapshot.can({ type: "RESOLVE" })'
          occurrence: 1
      - id: select-actor-send
        type: editor.select
        at: { mark: select-react-send }
        target:
          file: src/main.tsx
          text: 'send({ type: "ACKNOWLEDGE" })'
          occurrence: 1
      - id: expect-final-machine-file
        type: expect.file
        at: { afterAction: select-actor-send }
        path: src/main.tsx
        contains: 'guard: "hasTwoStableChecks"'
      - id: expect-final-store-file
        type: expect.file
        at: { afterAction: select-actor-send }
        path: src/main.tsx
        contains: "activityStore.trigger.addNote()"

  - id: run-incident-workflow
    narration: >
      Code အပိုင်းတွေကို တစ်ခုချင်းစီ ကြည့်ပြီးပြီဆိုတော့ အခု အဲဒီအပိုင်းတွေ တကယ် ချိတ်ဆက်ပြီး
      အလုပ်လုပ်ပုံကို Browser ထဲမှာ လိုက်ကြည့်ရအောင်။ [[mark:start-incident-runtime]] WebContainer
      ကို start လုပ်မယ်။ Dependency တွေ install လုပ်ပြီး Vite server အသင့်ဖြစ်မှ Preview
      ပွင့်လာမယ်။ Dashboard ကို စတွေ့တဲ့အချိန်မှာ Reported က initial State အဖြစ် ရှိနေပါလိမ့်မယ်။
      ဒီအချိန် ဘယ် button ကို နှိပ်လို့ရမလဲ အရင်ခန့်မှန်းကြည့်ရအောင်။ Incident ကို တာဝန်ယူကြောင်း
      မပြောရသေးတဲ့အတွက် Acknowledge တစ်ခုပဲ နှိပ်လို့ရမယ်။ Apply mitigation၊ Record stable check
      နဲ့ Resolve incident တွေကို နှိပ်လို့မရသေးဘူး။ React က button တစ်ခုစီမှာ snapshot.can
      ကိုခေါ်ပြီး “ဒီ Snapshot မှာ ဒီ Event ပို့လို့ရပြီလား” လို့ Machine ကို မေးထားတာပါ။
      [[mark:acknowledge-incident]] အခု Acknowledge ကိုနှိပ်မယ်။ Component က ACKNOWLEDGE Event ကို
      Actor ဆီပို့တယ်။ Reported State မှာ အဲဒီ Event အတွက် Transition ရှိတဲ့အတွက် Actor က
      Investigating Snapshot အသစ်ကို ထုတ်ပေးတယ်။ Workflow ပေါ်မှာ Reported က ပြီးသွားတဲ့အဆင့်အဖြစ်
      ပြောင်းပြီး Investigating ကို ထင်ရှားအောင် ပြမယ်။ [[mark:mitigate-incident]] Apply
      mitigation ကို နှိပ်လိုက်ရင် APPLY_MITIGATION Event ဝင်မယ်။ ဒီတစ်ခါတော့ State နှစ်ခုကြားက
      အချိန်ကွာခြားမှုကို သတိထားကြည့်ရအောင်။ Monitoring ကို တန်းမရောက်ဘူး။ အရင်ဆုံး Mitigating State
      ဝင်ပြီး Promise Actor ကို start လုပ်မယ်။ Promise ပြီးသွားတဲ့အခါ onDone Transition က
      Monitoring ဆီပို့ပြီး Action က CHG-2048 ကို Context ထဲသိမ်းမယ်။ ဒါကြောင့် Preview မှာ
      Mitigating ကို အရင်မြင်ရပြီး နောက်မှ Monitoring နဲ့ change ID ကို မြင်ရမယ်။ State တစ်ခု
      ထပ်ထည့်ထားတာက အလှဆင်ဖို့အတွက်တော့ မဟုတ်ပါဘူး။ ပြင်ဆင်ချက်ကို အသုံးပြုနေဆဲနဲ့
      အသုံးပြုပြီးသွားပြီဆိုတဲ့ အခြေအနေနှစ်ခုကို မှားယွင်းမရအောင် Machine ထဲမှာ ခွဲထားတာပါ။
    sources:
      - title: "Stately Docs — @xstate/react"
        url: "https://stately.ai/docs/xstate-react"
      - title: "Stately Docs — State machine transitions"
        url: "https://stately.ai/docs/transitions"
      - title: "Vite Docs — Getting Started"
        url: "https://vite.dev/guide/"
    actions:
      - id: start-incident-preview-runtime
        type: runtime.start
