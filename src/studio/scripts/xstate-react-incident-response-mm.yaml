        at: { mark: open-recap-board }
        open: true
        maximized: true
        clear: true
        upsertIds: [recap-title, recap-subtitle]
        drawMs: 900
      - id: recap-state-model-and-rules
        type: whiteboard.apply
        at: { mark: recap-model-and-rules }
        upsertIds:
          [
            recap-model-card,
            recap-model-heading,
            recap-model-body,
            recap-rules-card,
            recap-rules-heading,
            recap-rules-body,
          ]
        drawMs: 1700
      - id: recap-actors-and-react
        type: whiteboard.apply
        at: { mark: recap-actor-and-react }
        upsertIds:
          [
            recap-actor-card,
            recap-actor-heading,
            recap-actor-body,
            recap-react-card,
            recap-react-heading,
            recap-react-body,
          ]
        drawMs: 1700
      - id: recap-store-and-testing
        type: whiteboard.apply
        at: { mark: recap-store-and-checks }
        upsertIds:
          [
            recap-store-card,
            recap-store-heading,
            recap-store-body,
            recap-test-card,
            recap-test-heading,
            recap-test-body,
            recap-rule-box,
            recap-rule,
          ]
        drawMs: 2100

checks:
