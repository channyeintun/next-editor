            event-on-done,
            monitoring-box,
            monitoring-label,
            monitoring-note,
            arrow-three,
            event-three,
            resolved-box,
            resolved-label,
            resolved-note,
          ]
        drawMs: 4200

  - id: context-actions-guards
    narration: >
      State က Incident ရောက်နေတဲ့အဆင့်ကို ပြနိုင်ပေမဲ့ ဆက်သိမ်းထားရမယ့် data တွေလည်း ရှိသေးတယ်။
      ဥပမာ ပြင်ဆင်ချက်ရဲ့ change ID နဲ့ metric တည်ငြိမ်ကြောင်း စစ်ပြီးတဲ့အကြိမ်ရေပါ။ ဒီလို data
      မျိုးကို XState မှာတော့ Context ထဲမှာ ထားပါတယ်။ [[mark:draw-domain-guard]] Diagram အောက်မှာ
      stableChecks ကို ထည့်လိုက်မယ်။ Actor က Snapshot အသစ်ထုတ်တိုင်း State value နဲ့ Context
      နှစ်ခုလုံး ပါလာမယ်။ Monitoring မှာ VERIFY Event တစ်ကြိမ်ရတိုင်း recordStableCheck Action ကို
      ခေါ်မယ်။ အဲဒီ Action က assign သုံးပြီး stableChecks ကို တစ်တိုးပေးမယ်။ မူလ object ကို
      ပြင်လိုက်တာမဟုတ်ဘဲ နောက် Snapshot အတွက် Context အသစ်ကို တွက်ပေးတာပါ။ VERIFY Transition မှာ
      target မပါဘူး။ ဒါကြောင့် Monitoring ကနေ မထွက်ဘဲ Context ပဲ ပြောင်းသွားတယ်။ XState က
      ဒီပုံစံကို targetless Transition လို့ ခေါ်တယ်။ အခု ဒီမှာ မေးစရာတစ်ခု ရှိလာပါပြီ။ Stable
      check တစ်ကြိမ်ပဲ ရှိသေးချိန် RESOLVE Event ရောက်လာရင် ဘာလုပ်မလဲ။ ဒီမှာ Guard သုံးမယ်။ Guard
      ဆိုတာကတော့ Transition မလုပ်ခင်မှာ true သို့မဟုတ် false ကို ပြန်ပေးတဲ့ function တစ်ခုပါ။
      hasTwoStableChecks Guard က Context ကိုကြည့်ပြီး နှစ်ကြိမ်ပြည့်မှ true ပြန်ပေးမယ်။
      မပြည့်သေးရင် RESOLVE ရောက်လာပေမဲ့ State မပြောင်းဘူး။ Guard ထဲမှာ API မခေါ်ဘူး၊ log မရေးဘူး။
      တူညီတဲ့ Context ပေးရင် အဖြေတူတူရအောင် စစ်ဆေးမှုကိုသာ ထားမယ်။ Metric ပြန်ဆိုးလာရင် REGRESS
      Event က Investigating ဆီ ပြန်ပို့ပြီး stableChecks ကို သုည ပြန်ထားမယ်။
      [[mark:emphasize-domain-rule]] React မှာ RESOLVE button ကို disable လုပ်တာက အသုံးပြုသူကို
      လက်ရှိမလုပ်နိုင်သေးကြောင်း ပြပေးတာပါ။ တကယ်တမ်း မဖြတ်ကျော်နိုင်အောင် ထိန်းထားတာက Machine ထဲက
      Guard ဖြစ်တယ်။ UI နဲ့ Machine နှစ်ခုလုံးမှာ တူတဲ့စည်းမျဉ်းရေးထားတာမဟုတ်ဘူး။ UI က Machine
      ကိုမေးပြီး အဖြေကိုပြနေတာပါ။
    sources:
