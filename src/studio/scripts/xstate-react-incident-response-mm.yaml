  - id: run-regression-path
    narration: >
      Monitoring ရောက်တာနဲ့ Resolved ဆီ တန်းသွားလိုက်ရင် လက်တွေ့ပြတာက မြန်မြန်ပြီးသွားမှာပါ။
      ဒါပေမဲ့ လက်တွေ့ Incident မှာ metric က ပြန်ဆိုးလာနိုင်တယ်။
      အောင်မြင်တဲ့လမ်းတစ်လမ်းတည်းကြည့်ပြီး Machine မှန်တယ်လို့ မဆုံးဖြတ်သင့်ဘူး။
      ပြန်ဆုတ်ရတဲ့လမ်းကိုလည်း စမ်းကြည့်ရအောင်။ [[mark:first-check-before-regression]] ပထမဆုံး
      Record stable check ကို တစ်ကြိမ်နှိပ်မယ်။ VERIFY Event အတွက် target မရှိတဲ့ Transition က
      State ကို Monitoring မှာပဲ ထားပြီး recordStableCheck Action ကို run တယ်။ ဒါကြောင့် State
      မပြောင်းပေမဲ့ Context ထဲက stableChecks က သုညကနေ တစ် ဖြစ်သွားမယ်။ ဒီနေရာလေးက အရေးကြီးပါတယ်။
      Transition ဆိုတိုင်း State နာမည်ပြောင်းရမယ်လို့ မယူဆသင့်ပါဘူး။ State မပြောင်းဘဲ Action
      လုပ်ဖို့လည်း Transition သုံးနိုင်တယ်။ [[mark:regress-incident]] အခု metric
      ပြန်ဆိုးလာတယ်လို့ယူဆပြီး Report regression ကိုနှိပ်မယ်။ REGRESS Event ရလာရင် Machine က
      Investigating ဆီပြန်သွားပြီး resetVerification Action နဲ့ stableChecks ကို သုည ပြန်ထားတယ်။
      အရင်က စစ်ထားတဲ့ ရလဒ်ကို ပြဿနာပြန်စစ်တဲ့အခါ ဆက်သုံးလို့ မသင့်တော်လို့ပါ။ ဒီစည်းမျဉ်းကို
      Component ထဲမှာ if statement နဲ့ လိုက်ပြင်စရာမလိုဘူး။ Transition နဲ့ Action က တစ်နေရာတည်းမှာ
      ရှင်းရှင်းလင်းလင်း ပြထားတယ်။ [[mark:reapply-mitigation]] ပြဿနာအကြောင်းရင်းကို
      ထပ်ရှာပြီးပြီလို့ယူဆမယ်။ Apply mitigation ကို ပြန်နှိပ်လိုက်ရင် Mitigating State ဝင်ပြီး
      Promise Actor အသစ်တစ်ခု စတင်မယ်။ အဲဒီ Actor ပြီးမှ Monitoring ဆီပြန်ရောက်မယ်။
      ဒီလိုပြန်လည်ကိုင်တွယ်ရတဲ့လမ်းကို စမ်းလိုက်တာကြောင့် REGRESS Transition၊ reset Action နဲ့
      invoke ကို တစ်ခါတည်း အလုပ်လုပ်ကြောင်း မြင်ရပြီ။
    sources:
      - title: "Stately Docs — State machine transitions"
        url: "https://stately.ai/docs/transitions"
      - title: "Stately Docs — Actions"
        url: "https://stately.ai/docs/actions"
      - title: "Stately Docs — Invoked actors"
        url: "https://stately.ai/docs/invoke"
    actions:
      - id: click-check-before-regression
        type: preview.click
        at: { mark: first-check-before-regression }
        timeoutMs: 5000
        target: { by: testId, value: verify-button }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-check-before-regression
        type: expect.preview
        at: { afterAction: click-check-before-regression }
        timeoutMs: 5000
        target: { by: testId, value: check-count }
        textContains: "1 / 2 stable checks"
        retry: { maxAttempts: 3, delayMs: 100 }
      - id: click-regress-incident
        type: preview.click
        at: { mark: regress-incident }
        timeoutMs: 5000
        target: { by: testId, value: regress-button }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-investigating-after-regression
        type: expect.preview
        at: { afterAction: click-regress-incident }
        timeoutMs: 5000
        target: { by: testId, value: incident-state }
        textContains: "Investigating"
        attribute: { name: data-state, value: investigating }
        retry: { maxAttempts: 3, delayMs: 100 }
      - id: expect-check-reset-after-regression
        type: expect.preview
        at: { afterAction: expect-investigating-after-regression }
        timeoutMs: 5000
        target: { by: testId, value: check-count }
        textContains: "0 / 2 stable checks"
        retry: { maxAttempts: 3, delayMs: 100 }
      - id: click-reapply-mitigation
        type: preview.click
        at: { mark: reapply-mitigation }
        timeoutMs: 5000
        target: { by: testId, value: mitigate-button }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-mitigating-after-regression
        type: expect.preview
        at: { afterAction: click-reapply-mitigation }
        timeoutMs: 5000
        target: { by: testId, value: incident-state }
        textContains: "Mitigating"
        attribute: { name: data-state, value: mitigating }
        retry: { maxAttempts: 2, delayMs: 100 }
      - id: expect-monitoring-after-regression
        type: expect.preview
        at: { afterAction: expect-mitigating-after-regression }
        timeoutMs: 5000
        target: { by: testId, value: incident-state }
        textContains: "Monitoring"
        attribute: { name: data-state, value: monitoring }
        retry: { maxAttempts: 3, delayMs: 400 }

  - id: run-guard-and-resolve
    narration: >
      Monitoring ကို ပြန်ရောက်လာပါပြီ။ ဒီတစ်ခါတော့ Resolve လုပ်ခွင့်ကို Guard က ဘယ်လိုထိန်းထားလဲ
      သေချာကြည့်မယ်။ [[mark:inspect-guarded-resolve]] stableChecks က သုည ဖြစ်နေတဲ့အတွက် Resolve
      incident button ကို နှိပ်လို့မရဘူး။ “Button ကို disable လုပ်ထားရင် လုံလောက်ပြီ မဟုတ်လား”
      လို့ မေးစရာ ရှိနိုင်ပါတယ်။ မလုံလောက်ပါဘူး။ UI မဟုတ်တဲ့ API ဒါမှမဟုတ် test က RESOLVE Event
      ပို့လာနိုင်တယ်။ တကယ့်စည်းမျဉ်းက Machine ထဲက hasTwoStableChecks Guard ဖြစ်တယ်။ React
      မှာသုံးထားတဲ့ snapshot.can ကတော့ အဲဒီ Machine စည်းမျဉ်းကိုကြည့်ပြီး လက်ရှိ UI ကို
      ဘယ်လိုပြရမလဲ သိအောင် မေးထားတာပါ။ [[mark:first-final-check]] Record stable check ကို
      တစ်ကြိမ်နှိပ်မယ်။ stableChecks က တစ် ဖြစ်သွားပေမဲ့ Guard က false ပဲဖြစ်နေသေးလို့ Resolve ကို
      မလုပ်နိုင်သေးဘူး။ ဒီအချိန် RESOLVE Event တကယ်ပို့လိုက်ရင်လည်း Machine က Monitoring မှာပဲ
      ဆက်ရှိနေမယ်။ [[mark:second-final-check]] ဒုတိယအကြိမ် စစ်ပြီးတဲ့အခါ stableChecks က နှစ်
      ဖြစ်လာတယ်။ အခု snapshot.can က true ပြန်ပေးပြီး Resolve incident ကို နှိပ်လို့ရလာမယ်။
      [[mark:resolve-incident]] Resolve ကိုနှိပ်လိုက်ရင် RESOLVE Event က Guard ကို
      နောက်တစ်ကြိမ်ဖြတ်ရတယ်။ Guard က true ပြန်မှ Resolved Final State ကို ရောက်မယ်။ ဒီဥပမာမှာ UI
      နဲ့ Machine က စည်းမျဉ်းတစ်ခုတည်းကိုပဲ သုံးထားတာကို မြင်ရမှာပါ။ React က ခွင့်ပြုချက်ကို
      ကိုယ်တိုင် မဆုံးဖြတ်ဘူး။ Machine ကိုမေးပြီး ပြတယ်၊ Event ရောက်လာရင် Machine ကပဲ
      နောက်ဆုံးဆုံးဖြတ်တယ်။
    sources:
      - title: "Stately Docs — Guards"
        url: "https://stately.ai/docs/guards"
      - title: "Stately Docs — State snapshots"
        url: "https://stately.ai/docs/states"
      - title: "Stately Docs — @xstate/react"
        url: "https://stately.ai/docs/xstate-react"
    actions:
      - id: expect-resolve-guarded
        type: expect.preview
        at: { mark: inspect-guarded-resolve }
        timeoutMs: 5000
        target: { by: testId, value: resolve-button }
        textContains: "Resolve incident"
        attribute: { name: aria-disabled, value: "true" }
        retry: { maxAttempts: 3, delayMs: 100 }
      - id: click-first-final-check
        type: preview.click
        at: { mark: first-final-check }
        timeoutMs: 5000
        target: { by: testId, value: verify-button }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-first-final-check
        type: expect.preview
        at: { afterAction: click-first-final-check }
        timeoutMs: 5000
        target: { by: testId, value: check-count }
        textContains: "1 / 2 stable checks"
        retry: { maxAttempts: 3, delayMs: 100 }
      - id: expect-resolve-still-guarded
        type: expect.preview
        at: { afterAction: expect-first-final-check }
        timeoutMs: 5000
        target: { by: testId, value: resolve-button }
        attribute: { name: aria-disabled, value: "true" }
        retry: { maxAttempts: 3, delayMs: 100 }
      - id: click-second-final-check
        type: preview.click
        at: { mark: second-final-check }
        timeoutMs: 5000
        target: { by: testId, value: verify-button }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-second-final-check
        type: expect.preview
        at: { afterAction: click-second-final-check }
        timeoutMs: 5000
        target: { by: testId, value: check-count }
        textContains: "2 / 2 stable checks"
        retry: { maxAttempts: 3, delayMs: 100 }
      - id: expect-resolve-allowed
        type: expect.preview
        at: { afterAction: expect-second-final-check }
        timeoutMs: 5000
        target: { by: testId, value: resolve-button }
        attribute: { name: aria-disabled, value: "false" }
        retry: { maxAttempts: 3, delayMs: 100 }
      - id: click-resolve-incident
        type: preview.click
        at: { mark: resolve-incident }
        timeoutMs: 5000
        target: { by: testId, value: resolve-button }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-resolved-snapshot
        type: expect.preview
        at: { afterAction: click-resolve-incident }
        timeoutMs: 5000
        target: { by: testId, value: incident-state }
        textContains: "Resolved"
        attribute: { name: data-state, value: resolved }
        retry: { maxAttempts: 3, delayMs: 100 }

  - id: run-activity-store
    narration: >
      Incident Actor က Resolved Final State ကို ရောက်သွားပါပြီ။ ဒါပေမဲ့ ဘေးက Activity notes ကို
      ဆက်ရေးလို့ရနေသေးတာကို ဒီမှာမြင်ရတယ်။ အကြောင်းက note စာရင်းကို Incident Machine ထဲမှာ မထားဘဲ XState
      Store က သီးခြားထိန်းထားလို့ပါ။ [[mark:enter-activity-note]] Operator note အဖြစ် Database
      latency is normal လို့ input ထဲမှာ ရေးကြည့်မယ်။ စာလုံးရိုက်တိုင်း changeDraft Event က Store
      ဆီရောက်တယ်။ အဲဒီ Transition က draft ပါတဲ့ Context အသစ်ကို ပြန်ပေးမယ်။ React မှာ draft
      ကိုရွေးထားတဲ့ Selector က value ပြောင်းသွားတာကို သိပြီး input ကို re-render လုပ်ပေးတယ်။
      [[mark:add-activity-note]] Add note က addNote Event ပို့မယ်။ addNote Transition က ရှိပြီးသား
      array ကို တိုက်ရိုက်မပြင်ဘဲ notes array အသစ်တစ်ခု ဖန်တီးပြီး draft ကို အလွတ်ပြန်ထားတယ်။
      ဒါကြောင့် note စာရင်းမှာ စာကြောင်းအသစ်ပေါ်လာပြီး input က ပြန်ရှင်းသွားမယ်။ ဒီအချိန် Incident
      State ကို ပြန်ကြည့်ရအောင်။ Store မှာ data ပြောင်းပေမဲ့ Machine ရဲ့ Snapshot က Resolved
      အတိုင်းပဲ။ Operator note ပြောင်းလိုက်တာနဲ့ Incident က Reported ပြန်ဖြစ်သွားစရာ
      အကြောင်းမရှိပါဘူး။ Workflow အဆင့်နဲ့ UI မှာရေးနေတဲ့ data ကို မတူတဲ့နေရာနှစ်ခုမှာ
      ထိန်းထားလို့ ဒီလိုစိတ်ချရတာပါ။
    sources:
      - title: "Stately Docs — @xstate/store-react"
        url: "https://stately.ai/docs/xstate-store/react"
      - title: "Stately Docs — XState Store"
        url: "https://stately.ai/docs/xstate-store"
      - title: "React Docs — Updating arrays in state"
        url: "https://react.dev/learn/updating-arrays-in-state"
    actions:
      - id: enter-incident-activity-note
        type: preview.input
        at: { mark: enter-activity-note }
        timeoutMs: 5000
        target: { by: testId, value: note-input }
        value: "Database latency is normal"
        retry: { maxAttempts: 2, delayMs: 150 }
      - id: expect-activity-draft
        type: expect.preview
        at: { afterAction: enter-incident-activity-note }
        timeoutMs: 5000
        target: { by: testId, value: note-input }
        value: "Database latency is normal"
        retry: { maxAttempts: 3, delayMs: 100 }
      - id: click-add-activity-note
        type: preview.click
        at: { mark: add-activity-note }
        timeoutMs: 5000
        target: { by: testId, value: add-note-button }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-activity-note
        type: expect.preview
        at: { afterAction: click-add-activity-note }
        timeoutMs: 5000
        target: { by: testId, value: activity-list }
        textContains: "Database latency is normal"
        retry: { maxAttempts: 3, delayMs: 100 }
      - id: expect-activity-draft-cleared
        type: expect.preview
        at: { afterAction: expect-activity-note }
        timeoutMs: 5000
        target: { by: testId, value: note-input }
        value: ""
        retry: { maxAttempts: 3, delayMs: 100 }
      - id: expect-machine-stays-resolved
        type: expect.preview
        at: { afterAction: expect-activity-draft-cleared }
        timeoutMs: 5000
        target: { by: testId, value: incident-state }
        textContains: "Resolved"
        attribute: { name: data-state, value: resolved }
        retry: { maxAttempts: 3, delayMs: 100 }

  - id: course-recap
    narration: >
      [[mark:open-recap-board]] သင်ခန်းစာအစမှာ boolean flag လေးခုကြောင့် ဖြစ်နိုင်တဲ့ အခြေအနေ
      ဆယ့်ခြောက်မျိုးအထိ ပေါ်လာတာကို ကြည့်ခဲ့ကြပါတယ်။ အခုတော့ Incident တစ်ခုလုံးကို Machine တစ်ခု၊
      Actor တစ်ခုနဲ့ အလုပ်လုပ်အောင် ရေးပြီး Browser ထဲမှာ အစအဆုံး စမ်းခဲ့ပြီးပြီ။ နောက်လုပ်မယ့်
      application တစ်ခုမှာ XState သုံးမသုံး ဆုံးဖြတ်ရတဲ့အခါ ဒီပုံနဲ့ ပြန်စဉ်းစားလို့ရပါတယ်။
      [[mark:recap-model-and-rules]] ပထမ မေးခွန်းက “အသုံးပြုသူက ဘာလုပ်လို့ရတယ်၊
      ဘာလုပ်လို့မရဘူးဆိုတဲ့ အစဉ်ရှိသလား” ပါ။ ရှိတယ်ဆိုရင် အရင်ဆုံး အဲဒီ State တွေကို နာမည်ပေးမယ်။
      ပြီးတော့ ဖြစ်လာနိုင်တာတွေကို Event အဖြစ်ရေးပြီး State နဲ့ Event ကြားက ခွင့်ပြုထားတဲ့လမ်းကို
      Transition နဲ့ ချိတ်မယ်။ State နာမည်တစ်ခုနဲ့ မလုံလောက်တဲ့ stableChecks၊ mitigationId လို
      data ကို Context ထဲထားမယ်။ Event ကို လက်ခံမလား စစ်ဖို့ Guard သုံးပြီး Context ပြောင်းဖို့
      Action သုံးမယ်။ ဒီအဆင့်မှာတော့ React button တွေကို မစဉ်းစားသေးဘဲ လုပ်ငန်းစည်းမျဉ်းတွေကို
      အရင် ရှင်းရှင်းလင်းလင်း ဖြစ်အောင် လုပ်တာပါ။ [[mark:recap-actor-and-react]] ဒုတိယ မေးခွန်းက
      “အချိန်ယူတဲ့အလုပ် ဒါမှမဟုတ် ပြင်ပ API ခေါ်တာရှိသလား” ပါ။ ရှိရင် Promise Actor လို Actor
      logic တစ်ခုရေးပြီး State ထဲက invoke နဲ့ စတင်နိုင်တယ်။ onDone နဲ့ အောင်မြင်တဲ့လမ်း၊ onError
      နဲ့ မအောင်မြင်တဲ့လမ်းကို Machine ထဲမှာပဲ ဖော်ပြနိုင်တယ်။ React Component က Machine ကို run
      ပြီး Snapshot ကိုပြမယ်၊ Event ကိုပို့မယ်။ Component သေးသေးလေးအတွက် useMachine က လွယ်တယ်။
      ActorRef ကို အပိုင်းများစွာမျှဝေရင် useActorRef သို့မဟုတ် createActorContext ကို
      စဉ်းစားနိုင်တယ်။ Component တစ်ခုက Snapshot ထဲက value အနည်းငယ်ပဲလိုရင် useSelector နဲ့ အဲဒီ
      value ကိုပဲ ရွေးနိုင်တယ်။ [[mark:recap-store-and-checks]] တတိယ မေးခွန်းက “ဒီ data မှာ State
      အဆင့်လိုက်သွားရမယ့် စည်းမျဉ်းရှိသလား” ပါ။ မရှိဘဲ Event နဲ့ Context ပြောင်းပြီး React က
      Selector နဲ့ဖတ်ဖို့ပဲလိုရင် XState Store က ပိုသင့်တော်နိုင်တယ်။ ဒီသင်ခန်းစာမှာ activity
      draft နဲ့ notes ကို Store ထဲထားခဲ့တာ အဲဒီအကြောင်းပါ။ နောက်ဆုံး စစ်ဆေးတဲ့အခါ
      အောင်မြင်တဲ့လမ်းတစ်ခုတည်း စမ်းရုံနဲ့တော့ မလုံလောက်ပါဘူး။ ခွင့်မပြုသေးတဲ့ Event၊ Guard
      မပြည့်သေးတဲ့အခြေအနေ၊ async Actor အလုပ်လုပ်နေချိန်နဲ့ REGRESS လို ပြန်ဆုတ်တဲ့လမ်းကိုပါ
      စမ်းကြည့်ရပါတယ်။ snapshot.matches
      နဲ့ State ကိုစစ်နိုင်ပြီး snapshot.can နဲ့ Event ပို့လို့ရမရ စစ်နိုင်တယ်။ ဒီအခြေခံတွေကို
      ရသွားပြီဆိုရင်တော့ nested States၊ parallel States၊ Actor systems နဲ့ persistence တွေကို
      ဆက်ပြီး လေ့လာနိုင်ပါပြီ။ အဓိကမှတ်ထားရမယ့်အချက်က Machine က ဘာဖြစ်ရမလဲဆုံးဖြတ်ပြီး React က
      အဲဒီဆုံးဖြတ်ချက်ကို အသုံးပြုသူမြင်အောင်ပြတာပါ။
