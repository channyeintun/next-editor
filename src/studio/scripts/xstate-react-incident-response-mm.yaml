  - id: invoked-actor-lifecycle
    narration: >
      Incident ကို စုံစမ်းတာနဲ့တင် အလုပ်က မပြီးသေးပါဘူး။ ပြင်ဆင်ချက်ကို server ဆီပို့ရမယ်ဆိုတော့
      async အလုပ်တစ်ခု ရှိလာပြီ။ React useEffect ထဲ Promise ခေါ်ပြီး isLoading flag
      ပြောင်းလည်းရတယ်။ ဒါပေမဲ့ အဲဒီ Promise ကို ဘယ်အချိန်စတယ်၊ ဘယ်အချိန်ရပ်တယ်၊ အောင်မြင်ရင် ဘယ်
      State သွားတယ်ဆိုတာ နေရာအမျိုးမျိုးမှာ လိုက်ဖတ်ရမယ်။ XState မှာဆိုရင် ဒီလို async
      အလုပ်တွေကိုလည်း Actor အဖြစ် ထားနိုင်ပါတယ်။ [[mark:draw-invoked-parent]] Parent Incident
      Actor က Mitigating State ဝင်တဲ့အခါ invoke ကိုတွေ့မယ်။ ဒီ State ဝင်မှ
      ပြင်ဆင်ချက်စပို့မယ်ဆိုတဲ့ အဓိပ္ပာယ်ပါ။ [[mark:draw-invoked-child]] applyMitigation ကို
      fromPromise နဲ့ရေးထားလို့ Promise Actor တစ်ခု start ဖြစ်မယ်။ Parent က
      အဖြေစောင့်နေတဲ့အချိန်ကို Mitigating State က ပြထားပြီးသား ဖြစ်တဲ့အတွက် isLoading flag
      ထပ်ထားစရာ မလိုတော့ပါဘူး။ Promise ပြီးသွားရင် onDone က Monitoring ဆီပို့မယ်။ ပြန်လာတဲ့
      changeId ကို assign နဲ့ Parent Context ထဲ သိမ်းမယ်။ မအောင်မြင်ရင် onError က Investigating ဆီ
      ပြန်ပို့မယ်။ အောင်မြင်တဲ့လမ်းနဲ့ မအောင်မြင်တဲ့လမ်း နှစ်ခုလုံးကို Statechart မှာ
      တန်းမြင်ရတယ်။ [[mark:draw-invoke-rule]] နောက်ထပ် အရေးကြီးတာက ဘယ်သူက ဒီ Actor
      ကိုပိုင်လဲဆိုတာပါ။ Parent က Mitigating State ကနေ ထွက်သွားရင် invoke လုပ်ထားတဲ့ Actor ကို
      XState က ရပ်ပေးမယ်။ Component အနှံ့ Promise reference လိုက်သိမ်းပြီး ကိုယ်တိုင်ရှင်းစရာ
      လျော့သွားတယ်။ ဒီဥပမာမှာတော့ အလုပ်လုပ်ပုံကို မြင်ရအောင် မီလီစက္ကန့် ခုနစ်ရာကြာတဲ့ Promise
      သုံးမယ်။ တကယ့်စနစ်မှာ အဲဒီနေရာကို fetch သို့မဟုတ် API client နဲ့ အစားထိုးနိုင်တယ်။
    sources:
      - title: "Stately Docs — Invoking actors"
        url: "https://stately.ai/docs/invoke"
      - title: "Stately Docs — Promise actors"
        url: "https://stately.ai/docs/promise-actors"
      - title: "Stately Docs — Actors"
        url: "https://stately.ai/docs/actors"
    actions:
      - id: draw-invoked-parent-actor
        type: whiteboard.apply
        at: { mark: draw-invoked-parent }
        clear: true
        upsertIds: [invoke-title, parent-actor-box, parent-actor-label, parent-state-label]
        drawMs: 1200
      - id: draw-invoked-promise-actor
        type: whiteboard.apply
        at: { mark: draw-invoked-child }
        timeoutMs: 5000
        upsertIds:
          [
            invoke-child-arrow,
            invoke-child-label,
            promise-actor-box,
            promise-actor-label,
            promise-actor-body,
            done-arrow,
            error-arrow,
            done-state,
            error-state,
          ]
        drawMs: 2400
