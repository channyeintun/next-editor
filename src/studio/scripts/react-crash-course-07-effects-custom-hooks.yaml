      src/Header.jsx: |
        export function Header() {
          return (
            <>
              <h1 data-testid="title">ရွှေရန်ကုန် မုန့်ဟင်းခါးဆိုင်</h1>
              <p className="muted">မနက် ၆ နာရီ မှ ညနေ ၆ နာရီ အထိ</p>
            </>
          );
        }
      src/App.jsx: |
        import { useState } from "react";
        import { Header } from "./Header.jsx";

        export default function App() {
          const [tableId, setTableId] = useState(1);
          const [sound, setSound] = useState(true);

          return (
            <main className="page">
              <Header />
              <div className="row">
                {[1, 2, 3].map((n) => (
                  <button
                    key={n}
                    data-testid={`table-${n}`}
                    className={n === tableId ? "" : "secondary"}
                    onClick={() => setTableId(n)}
                  >
                    စားပွဲ {n}
                  </button>
                ))}
                <button
                  className="secondary"
                  data-testid="sound-toggle"
                  onClick={() => setSound(!sound)}
                >
                  {sound ? "🔔 အသံ ဖွင့်ထား" : "🔕 အသံ ပိတ်ထား"}
                </button>
              </div>
            </main>
          );
        }
      src/kitchen.js: |
        // A pretend connection to the kitchen: a system outside React.
        // It writes straight into the kitchen log list in index.html.
        const kitchenLog = document.getElementById("kitchen-log");

        function log(text) {
          const line = document.createElement("li");
          line.textContent = text;
          kitchenLog.append(line);
          kitchenLog.scrollTop = kitchenLog.scrollHeight;
        }

        export function createConnection(tableId, who) {
          let timer = null;
          let onConnected = null;
          return {
            connect() {
              log(who + " · စားပွဲ " + tableId + " ချိတ်ပြီ");
              timer = setTimeout(() => onConnected?.(), 300);
            },
            disconnect() {
              clearTimeout(timer);
              log(who + " · စားပွဲ " + tableId + " ဖြုတ်ပြီ");
            },
            on(event, callback) {
              if (event === "connected") onConnected = callback;
            },
          };
        }

        export function showNotice(text, sound) {
          log((sound ? "🔔 " : "🔕 ") + text);
        }
      src/OrderStatusNaive.jsx: |
        import { useEffect } from "react";
        import { createConnection, showNotice } from "./kitchen.js";

        export default function OrderStatusNaive({ tableId, sound }) {
          useEffect(() => {
            const connection = createConnection(tableId, "Naive");
            connection.on("connected", () => {
              showNotice("Naive · စားပွဲ " + tableId + " အသင့်", sound);
            });
            connection.connect();
            return () => connection.disconnect();
          }, [tableId, sound]);

          return null;
        }
