  # ------------------------------------------------------------------ 11
  - id: custom-hook-code
    chapter: "Custom hook နဲ့ store"
    narration: >
      [[mark:open-store]] နောက်ဆုံးကတော့ logic မျှဝေတာပါ။ ခေါင်းစဉ်နဲ့
      မီးဖိုချောင် panel အသစ်က စောင့်နေတဲ့ အော်ဒါ အရေအတွက်ကို store တစ်ခုကနေ
      ပြမှာပါ။ store ဆိုတာ React အပြင်က JavaScript ဖိုင် တစ်ခုထဲမှာ data ကို
      ကိုင်ထားတဲ့ နေရာပါ။ [[mark:type-store-state]] store ထဲမှာ count နဲ့ listener
      တွေ ရှိပါတယ်။ listener ဆိုတာ count ပြောင်းတိုင်း အကြောင်းကြားခံမယ့် function
      တွေပါ။ [[mark:type-store-subscribe]] subscribe က listener တစ်ခု ထည့်ပြီး၊
      ပြန်ဖြုတ်ပေးမယ့် function တစ်ခု ပြန်ပေးပါတယ်။ [[mark:type-store-snapshot]]
      getSnapshot က store ရဲ့ လက်ရှိ တန်ဖိုးကို ပြန်ပေးပြီး၊ အဲဒါကို snapshot လို့
      ခေါ်ပါတယ်။ [[mark:type-store-add]] addOrder က count ကို 1 တိုးပြီး၊ listener
      တိုင်းကို အကြောင်းကြားပါတယ်။ [[mark:open-hook]] custom hook ရေးရအောင်။
      [[mark:type-hook-imports]] သူ့အတွက် useSyncExternalStore နဲ့ store ရဲ့
      function နှစ်ခု လိုပါတယ်။ [[mark:type-hook-body]] custom hook ဆိုတာ use နဲ့
      စပြီး နောက်မှာ စာလုံးအကြီး လိုက်တဲ့ နာမည် ရှိပြီး၊ တခြား hook တွေကို ခေါ်တဲ့
      function ပါ။ ကိုယ့် hook က store ကို useSyncExternalStore ဆီ ပေးလိုက်လို့၊
      count ပြောင်းတိုင်း component ပြန် render လုပ်ပါတယ်။ [[mark:open-panel]]
      KitchenPanel ဖိုင်ကလည်း အခု အလွတ်ပါ၊ ဒီ hook ကို တခြား hook လိုပဲ
      ခေါ်သုံးမှာပါ။ [[mark:type-panel]] hook ဆီက count ကို ယူပြီး၊ အော်ဒါ တစ်ခု
      ထည့်ပေးမယ့် ခလုတ်နဲ့အတူ card လေး တစ်ခုထဲမှာ ပြပါတယ်။
    sources:
      - title: "React — Reusing Logic with Custom Hooks"
        url: "https://react.dev/learn/reusing-logic-with-custom-hooks"
      - title: "React — useSyncExternalStore"
        url: "https://react.dev/reference/react/useSyncExternalStore"
      - title: "React — Rules of Hooks"
        url: "https://react.dev/reference/rules/rules-of-hooks"
    actions:
      - id: open-store
        type: workspace.openFile
        at: { mark: open-store }
        path: src/queueStore.js
      - id: type-store-state
        type: editor.type
        at: { mark: type-store-state }
        cadence: line-by-line
        target: { file: src/queueStore.js, after: "", occurrence: 1 }
        text: "let count = 0;\nconst listeners = new Set();\n"
      - id: type-store-subscribe
        type: editor.type
        at: { mark: type-store-subscribe }
        cadence: line-by-line
        target: { file: src/queueStore.js, after: "const listeners = new Set();\n", occurrence: 1 }
        text: "\nexport function subscribe(listener) {\n  listeners.add(listener);\n  return () => listeners.delete(listener);\n}\n"
      - id: type-store-snapshot
        type: editor.type
        at: { mark: type-store-snapshot }
        cadence: line-by-line
        target:
          {
            file: src/queueStore.js,
            after: "  return () => listeners.delete(listener);\n}\n",
            occurrence: 1,
          }
        text: "\nexport function getSnapshot() {\n  return count;\n}\n"
      - id: type-store-add
        type: editor.type
        at: { mark: type-store-add }
        cadence: line-by-line
        target: { file: src/queueStore.js, after: "  return count;\n}\n", occurrence: 1 }
        text: "\nexport function addOrder() {\n  count = count + 1;\n  listeners.forEach((listener) => listener());\n}\n"
      - id: open-hook
        type: workspace.openFile
        at: { mark: open-hook }
        path: src/useKitchenQueue.js
      - id: type-hook-imports
        type: editor.type
        at: { mark: type-hook-imports }
        cadence: line-by-line
        target: { file: src/useKitchenQueue.js, after: "", occurrence: 1 }
        text: "import { useSyncExternalStore } from \"react\";\nimport { subscribe, getSnapshot } from \"./queueStore.js\";\n\nexport function useKitchenQueue() {\n"
      - id: type-hook-body
        type: editor.type
        at: { mark: type-hook-body }
        cadence: fast-explainer
        target:
          {
            file: src/useKitchenQueue.js,
            after: "export function useKitchenQueue() {\n",
            occurrence: 1,
          }
        text: "  return useSyncExternalStore(subscribe, getSnapshot);\n}\n"
      - id: open-panel
        type: workspace.openFile
        at: { mark: open-panel }
        path: src/KitchenPanel.jsx
      - id: type-panel
        type: editor.type
        at: { mark: type-panel }
        cadence: line-by-line
        target: { file: src/KitchenPanel.jsx, after: "", occurrence: 1 }
        text: "import { useKitchenQueue } from \"./useKitchenQueue.js\";\nimport { addOrder } from \"./queueStore.js\";\n\nexport default function KitchenPanel() {\n  const count = useKitchenQueue();\n"
      - id: type-panel-jsx
        type: editor.type
        at: { afterAction: type-panel }
        cadence: block
        target:
          {
            file: src/KitchenPanel.jsx,
            after: "  const count = useKitchenQueue();\n",
            occurrence: 1,
          }
        text: "\n  return (\n    <section className=\"card\">\n      <h2>မီးဖိုချောင်</h2>\n      <p data-testid=\"panel-queue\">တန်းစီ {count} ပွဲ</p>\n      <button data-testid=\"add-order\" onClick={addOrder}>\n        အော်ဒါ ထည့်မယ်\n      </button>\n    </section>\n  );\n}\n"

  # ------------------------------------------------------------------ 12
  - id: queue-run
    narration: >
      ကဲ၊ ထည့်ကြည့်ရအောင်။ [[mark:open-header]] ခေါင်းစဉ်မှာလည်း count ကို
      ပြပါမယ်။ [[mark:wire-header]] hook ကို import လုပ်၊ ခေါ်ပြီး၊ count ကို
      badge လေး တစ်ခုနဲ့ ပြပါတယ်။ [[mark:open-app-panel]] App မှာ panel ကို import
      လုပ်ပြီး ခလုတ်တွေ အောက်မှာ ထည့်ပါတယ်။ [[mark:click-add-1]] အော်ဒါ
      ထည့်ရအောင်။ [[mark:click-add-2]] ထပ်ထည့်ရအောင်။ [[mark:after-add]] panel ရော
      ခေါင်းစဉ်ပါ 2 လို့ ပြနေပါပြီ။ [[mark:draw-hook-logic]] ဘာလို့ နံပါတ်
      တူနေတာလဲ။ custom hook က logic ကိုပဲ မျှပြီး state ကို မမျှပါဘူး။ hook ထဲမှာ
      useState သုံးရင် component တစ်ခုစီ ကိုယ်ပိုင် count ရှိသွားမှာပါ။
      [[mark:draw-store]] ဒီမှာတော့ count က store တစ်ခုတည်းမှာ ရှိလို့၊ component
      တိုင်းက snapshot တစ်ခုတည်းကို ဖတ်ပါတယ်။ [[mark:draw-recap]] ဒါဆို
      ပြန်ချုပ်ရရင်၊ Effect က အပြင်က system နဲ့ ချိတ်ပြီး cleanup က
      ပြန်ဖြုတ်ပါတယ်။ Effect ဖတ်တဲ့ reactive တန်ဖိုးတိုင်း dependency ထဲ ပါရပြီး၊
      ပြန်မချိတ်စေချင်တဲ့ logic ကို useEffectEvent ထဲ ထုတ်ပါတယ်။ custom hook က
      logic ကို မျှပြီး၊ data တစ်ခုတည်းကို မျှဖို့ store နဲ့ useSyncExternalStore
      ကို သုံးပါတယ်။ [[mark:next-lesson]] နောက် lesson မှာတော့ မလိုအပ်တဲ့ ပြန်
      render တွေကို ဘယ်လို တိုင်းပြီး ပြင်မလဲ ဆိုတာနဲ့ transition ကို
      ကြည့်သွားပါမယ်။
    sources:
      - title: "React — Custom Hooks let you share stateful logic, not state itself"
        url: "https://react.dev/learn/reusing-logic-with-custom-hooks#custom-hooks-let-you-share-stateful-logic-not-state-itself"
      - title: "React — useSyncExternalStore: Subscribing to an external store"
        url: "https://react.dev/reference/react/useSyncExternalStore#subscribing-to-an-external-store"
      - title: "React Compiler — Introduction"
        url: "https://react.dev/learn/react-compiler/introduction"
    actions:
      - id: open-header
        type: workspace.openFile
        at: { mark: open-header }
        path: src/Header.jsx
      - id: wire-header-import
