build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 7207

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  # ------------------------------------------------------------------ 1
  - id: effect-places
    chapter: "Effect ဆိုတာ ဘာလဲ"
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ stopwatch ပျောက်သွားရင်တောင် timer က ဆက် run
      နေနိုင်တယ်လို့ ပြောခဲ့ပါတယ်။ ဒီ lesson မှာ အဲဒီလို ပြဿနာကို ဖြေရှင်းပေးတဲ့
      Effect နဲ့ custom hook ကို လေ့လာပါမယ်။ [[mark:start-server]] ရှင်းပြနေတုန်း
      dev server ကို နောက်ကွယ်မှာ စ run ထားလိုက်ရအောင်။ preview လိုတဲ့အချိန်မှာ
      အသင့် ဖြစ်နေအောင်ပါ။ [[mark:draw-render]] React မှာ code ရေးဖို့ နေရာ
      သုံးနေရာ ရှိပါတယ်။ render က props နဲ့ state ကနေ screen ပေါ် ပြမယ့်အရာကိုပဲ
      တွက်ပါတယ်။ [[mark:draw-handler]] event handler ကတော့ user က ခလုတ် နှိပ်တာလို
      တစ်ခုခု လုပ်မှ run တာပါ။ [[mark:draw-effect]] Effect ကတော့ component ကို
      screen ပေါ် ပြပြီးမှ run ပါတယ်။ network connection၊ timer လို React အပြင်က
      system တွေနဲ့ ချိတ်ထားဖို့ သုံးပါတယ်။ [[mark:draw-cause]] ဆိုတော့ handler က
      click ကြောင့် run ပြီး၊ Effect ကတော့ render ကြောင့် run တာပါ။
    sources:
      - title: "React — Synchronizing with Effects"
        url: "https://react.dev/learn/synchronizing-with-effects"
      - title: "React — useEffect"
        url: "https://react.dev/reference/react/useEffect"
      - title: "Vite — Getting Started"
        url: "https://vite.dev/guide/"
    actions:
      - id: open-board-1
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        maximized: true
        clear: true
        upsertIds: [b1-title]
      - id: start-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 45000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-render
        type: whiteboard.apply
        at: { mark: draw-render }
        upsertIds: [b1-render-box, b1-render-name, b1-render-l1, b1-render-l2]
        drawMs: 2000
      - id: draw-handler
        type: whiteboard.apply
        at: { mark: draw-handler }
        upsertIds: [b1-handler-box, b1-handler-name, b1-handler-l1, b1-handler-l2]
        drawMs: 2000
      - id: draw-effect
        type: whiteboard.apply
        at: { mark: draw-effect }
        upsertIds:
          [
            b1-effect-box,
            b1-effect-name,
            b1-effect-underline,
            b1-effect-l1,
            b1-effect-l2,
            b1-examples,
          ]
        drawMs: 2800
      - id: draw-cause
        type: whiteboard.apply
        at: { mark: draw-cause }
        upsertIds: [b1-cause]
        drawMs: 1200

  # ------------------------------------------------------------------ 2
  - id: effect-timing
    narration: >
      [[mark:board-timing]] ဒါဆို Effect က အတိအကျ ဘယ်အချိန် run လဲ။
      [[mark:draw-step-render]] React က component ကို render လုပ်ပြီး၊ အဲဒီအတိုင်း
      DOM ကို ပြင်ပါတယ်။ [[mark:draw-step-layout]] ပြီးရင် browser က screen ကို
      မဆွဲခင် useLayoutEffect က run ပါတယ်။ tooltip ရဲ့ အရွယ်အစားလို တစ်ခုခုကို
      user မမြင်ခင် တိုင်းဖို့ နေရာပါ။ [[mark:draw-step-effect]] အဲဒီနောက် browser
      က screen ကို ဆွဲပြီး၊ အများအားဖြင့် အဲဒါ ပြီးမှ useEffect က run ပါတယ်။
      useLayoutEffect ပြီးတဲ့အထိ browser က screen မဆွဲဘဲ စောင့်ရလို့၊
      ပုံမှန်အားဖြင့် useEffect ကိုပဲ သုံးပါ။
    sources:
      - title: "React — useLayoutEffect"
        url: "https://react.dev/reference/react/useLayoutEffect"
      - title: "React — useEffect: Caveats"
        url: "https://react.dev/reference/react/useEffect#caveats"
      - title: "React — Render and Commit"
        url: "https://react.dev/learn/render-and-commit"
    actions:
      - id: board-timing
        type: whiteboard.apply
        at: { mark: board-timing }
        clear: true
        upsertIds: [b2-title]
      - id: draw-step-render
        type: whiteboard.apply
        at: { mark: draw-step-render }
        upsertIds: [b2-s1-box, b2-s1-text, b2-s2-box, b2-s2-text]
        drawMs: 1600
      - id: draw-step-layout
        type: whiteboard.apply
        at: { mark: draw-step-layout }
        upsertIds: [b2-s3-box, b2-s3-text, b2-s3-note]
        drawMs: 1800
      - id: draw-step-effect
        type: whiteboard.apply
        at: { mark: draw-step-effect }
        upsertIds: [b2-s4-box, b2-s4-text, b2-s5-box, b2-s5-text, b2-s5-check, b2-s5-note]
        drawMs: 2400

  # ------------------------------------------------------------------ 3
  - id: kitchen-tour
    chapter: "useEffect နဲ့ cleanup"
    narration: >
      [[mark:close-board-timing]] ကဲ၊ app ကို အရင် ကြည့်ရအောင်။
      [[mark:select-state]] App ထဲက state နှစ်ခုကို ကြည့်ပါ၊ လက်ရှိ စားပွဲနဲ့ အသံ
      ဖွင့်ထားလား ဆိုတာပါ။ ခလုတ်တွေက သူတို့ကို ပြောင်းပေးပါတယ်။
      [[mark:open-kitchen]] kitchen.js ကတော့ မီးဖိုချောင်နဲ့ ချိတ်တဲ့ connection
      အတုပါ။ React အပြင်က မှတ်တမ်း စာရင်းထဲ တိုက်ရိုက် ရေးလို့၊ အပြင်က system
      တစ်ခုလို ဖြစ်နေပါတယ်။ [[mark:select-connect]] connect က မှတ်တမ်းထဲ
      တစ်ကြောင်း ရေးပြီး၊ ခဏနေရင် အသင့် ဖြစ်ပြီလို့ ပြောပါတယ်။
      [[mark:select-disconnect]] disconnect ကတော့ အသင့် ဖြစ်ပြီလို့ မပြောရသေးရင်
      ရပ်လိုက်ပြီး၊ ဖြုတ်ကြောင်း တစ်ကြောင်း ရေးပါတယ်။ [[mark:select-on]] on ကတော့
      အသင့် ဖြစ်တဲ့အခါ ခေါ်ရမယ့် function ကို လက်ခံပါတယ်။ [[mark:preview-opens]]
      preview ကို ဖွင့်လိုက်ရအောင်။ ခလုတ်တွေ အောက်မှာ မီးဖိုချောင် မှတ်တမ်းက အခု
      အလွတ်ပါ။
    sources:
      - title: "React — Synchronizing with Effects: subscribing to events"
        url: "https://react.dev/learn/synchronizing-with-effects#subscribing-to-events"
      - title: "MDN — Document: createElement() method"
        url: "https://developer.mozilla.org/en-US/docs/Web/API/Document/createElement"
      - title: "MDN — setTimeout()"
        url: "https://developer.mozilla.org/en-US/docs/Web/API/Window/setTimeout"
    actions:
      - id: close-board-timing
        type: whiteboard.apply
        at: { mark: close-board-timing }
        open: false
      - id: collapse-dock-early
        type: runtime.collapseDock
        at: { afterAction: close-board-timing }
      - id: select-state
        type: editor.select
        at: { mark: select-state }
        target:
          {
            file: src/App.jsx,
            text: "  const [tableId, setTableId] = useState(1);\n  const [sound, setSound] = useState(true);\n",
            occurrence: 1,
          }
      - id: open-kitchen
        type: workspace.openFile
        at: { mark: open-kitchen }
        path: src/kitchen.js
      - id: select-connect
        type: editor.select
        at: { mark: select-connect }
        target:
          {
            file: src/kitchen.js,
            text: "    connect() {\n      log(who + \" · စားပွဲ \" + tableId + \" ချိတ်ပြီ\");\n      timer = setTimeout(() => onConnected?.(), 300);\n",
            occurrence: 1,
          }
      - id: select-disconnect
        type: editor.select
        at: { mark: select-disconnect }
        target:
          {
            file: src/kitchen.js,
            text: "    disconnect() {\n      clearTimeout(timer);\n      log(who + \" · စားပွဲ \" + tableId + \" ဖြုတ်ပြီ\");\n",
            occurrence: 1,
          }
      - id: select-on
        type: editor.select
        at: { mark: select-on }
        target:
          {
            file: src/kitchen.js,
            text: "    on(event, callback) {\n      if (event === \"connected\") onConnected = callback;\n",
            occurrence: 1,
          }
      - id: wait-for-server
        type: runtime.waitForReady
        at: { mark: preview-opens }
        timeoutMs: 20000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-server }
        timeoutMs: 15000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-start-app
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: sound-toggle }
        textContains: "အသံ ဖွင့်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: collapse-dock
        type: runtime.collapseDock
        at: { afterAction: expect-start-app }

  # ------------------------------------------------------------------ 4
  - id: order-status-code
    narration: >
      [[mark:open-order-status]] OrderStatus ဖိုင်က အခု အလွတ်ပါ၊ ဘယ် ဖိုင်ကမှ
      import မလုပ်ရသေးပါဘူး။ စားပွဲ တစ်ခုကို မီးဖိုချောင်နဲ့ ချိတ်ပေးမှာပါ။
      [[mark:type-os-top]] useEffect နဲ့ connection ကို import လုပ်ပြီး၊ စားပွဲ
      နံပါတ်ကို prop အနေနဲ့ လက်ခံပါတယ်။ [[mark:type-os-setup]] useEffect ထဲက ပထမ
      အပိုင်းက setup ပါ။ ဒီ စားပွဲအတွက် connection တစ်ခု လုပ်ပြီး ချိတ်လိုက်တာပါ။
      [[mark:type-os-cleanup]] setup က ပြန်ပေးတဲ့ cleanup ဆိုတာ ချိတ်ထားတာကို
      ပြန်ဖြုတ်တဲ့ function ပါ။ Effect ထပ် မ run ခင်နဲ့ component ပျောက်သွားတဲ့အခါ
      React က သူ့ကို ခေါ်ပါတယ်။ [[mark:type-os-deps]] dependency စာရင်းက ဘယ်
      တန်ဖိုး ပြောင်းမှ ပြန် run ရမလဲ ဆိုတာပါ။ ဒီမှာတော့ စားပွဲ နံပါတ်ပဲပါ။
      [[mark:type-os-render]] component ကိုယ်တိုင်ကတော့ ဘယ် စားပွဲနဲ့ ချိတ်ထားလဲ
      ဆိုတာကိုပဲ ပြပါတယ်။
    sources:
      - title: "React — useEffect: Connecting to an external system"
        url: "https://react.dev/reference/react/useEffect#connecting-to-an-external-system"
      - title: "React — Synchronizing with Effects: add cleanup if needed"
        url: "https://react.dev/learn/synchronizing-with-effects#step-3-add-cleanup-if-needed"
    actions:
      - id: open-order-status
        type: workspace.openFile
        at: { mark: open-order-status }
        path: src/OrderStatus.jsx
      - id: type-os-top
        type: editor.type
        at: { mark: type-os-top }
        cadence: line-by-line
        target: { file: src/OrderStatus.jsx, after: "", occurrence: 1 }
        text: "import { useEffect } from \"react\";\nimport { createConnection } from \"./kitchen.js\";\n\nexport default function OrderStatus({ tableId }) {\n"
      - id: type-os-setup
        type: editor.type
        at: { mark: type-os-setup }
        cadence: line-by-line
        target:
          {
            file: src/OrderStatus.jsx,
            after: "export default function OrderStatus({ tableId }) {\n",
            occurrence: 1,
          }
        text: "  useEffect(() => {\n    const connection = createConnection(tableId, \"OrderStatus\");\n    connection.connect();\n"
      - id: type-os-cleanup
        type: editor.type
        at: { mark: type-os-cleanup }
        cadence: fast-explainer
        target: { file: src/OrderStatus.jsx, after: "    connection.connect();\n", occurrence: 1 }
        text: "    return () => connection.disconnect();\n"
      - id: type-os-deps
        type: editor.type
        at: { mark: type-os-deps }
        cadence: fast-explainer
        target:
          {
            file: src/OrderStatus.jsx,
            after: "    return () => connection.disconnect();\n",
            occurrence: 1,
          }
        text: "  }, [tableId]);\n"
      - id: type-os-render
        type: editor.type
        at: { mark: type-os-render }
        cadence: line-by-line
        target: { file: src/OrderStatus.jsx, after: "  }, [tableId]);\n", occurrence: 1 }
        text: "\n  return <p data-testid=\"order-status\">စားပွဲ {tableId} နဲ့ ချိတ်ထားပါတယ်</p>;\n}\n"

  # ------------------------------------------------------------------ 5
  - id: order-status-run
    narration: >
      [[mark:open-app-os]] ကဲ၊ page ထဲ ထည့်ကြည့်ရအောင်။ [[mark:wire-os-import]]
      import လုပ်ပြီး၊ ခလုတ်တွေ အောက်မှာ လက်ရှိ စားပွဲ နံပါတ်နဲ့ ထည့်လိုက်ပါတယ်။
      [[mark:after-wire-os]] မီးဖိုချောင် မှတ်တမ်းကို ကြည့်ပါ။ စားပွဲ 1 ချိတ်၊
      ပြန်ဖြုတ်၊ ပြီးမှ ထပ်ချိတ် ဆိုပြီး ပေါ်နေပါတယ်။ [[mark:strict-explain]] ဒါက
      StrictMode ကြောင့်ပါ။ ကိုယ် ရေးနေတုန်း development မှာပဲ၊ React က setup နဲ့
      cleanup ကို တစ်ကြိမ် ပို run ပြီး၊ cleanup က setup ကို တကယ် ပြန်ဖြုတ်လား
      စစ်ပါတယ်။ production မှာတော့ တစ်ကြိမ်ပဲ ချိတ်ပါတယ်။ [[mark:strict-fix]]
      ဒုတိယ run ကို တားဖို့ မကြိုးစားဘဲ၊ cleanup ကို မှန်အောင် ရေးပါ။
      [[mark:click-table-2]] စားပွဲ 2 ကို ပြောင်းကြည့်ရအောင်။
      [[mark:after-table-2]] စားပွဲ 1 ကို ဖြုတ်ပြီးမှ စားပွဲ 2 ကို ချိတ်ပါတယ်။
      အသစ် မချိတ်ခင် အဟောင်းကို React က cleanup လုပ်ပေးလို့ပါ။
    sources:
      - title: "React — How to handle the Effect firing twice in development"
        url: "https://react.dev/learn/synchronizing-with-effects#how-to-handle-the-effect-firing-twice-in-development"
      - title: "React — StrictMode"
        url: "https://react.dev/reference/react/StrictMode"
      - title: "React — Lifecycle of Reactive Effects"
        url: "https://react.dev/learn/lifecycle-of-reactive-effects"
    actions:
      - id: open-app-os
        type: workspace.openFile
        at: { mark: open-app-os }
        path: src/App.jsx
      - id: wire-os-import
        type: editor.type
        at: { mark: wire-os-import }
        cadence: block
        target:
          { file: src/App.jsx, after: "import { Header } from \"./Header.jsx\";\n", occurrence: 1 }
        text: "import OrderStatus from \"./OrderStatus.jsx\";\n"
      - id: wire-os-use
        type: editor.type
        at: { afterAction: wire-os-import }
        cadence: block
        target: { file: src/App.jsx, after: "      </div>\n", occurrence: 1 }
        text: "      <OrderStatus tableId={tableId} />\n"
      - id: expect-strict-log
        type: expect.preview
        at: { mark: after-wire-os }
        timeoutMs: 5000
        target: { by: testId, value: kitchen-log }
        textContains: "OrderStatus · စားပွဲ 1 ချိတ်ပြီOrderStatus · စားပွဲ 1 ဖြုတ်ပြီOrderStatus · စားပွဲ 1 ချိတ်ပြီ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: click-table-2
        type: preview.click
        at: { mark: click-table-2 }
        timeoutMs: 5000
        target: { by: testId, value: table-2 }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-switch-log
        type: expect.preview
        at: { mark: after-table-2 }
        timeoutMs: 5000
        target: { by: testId, value: kitchen-log }
        textContains: "OrderStatus · စားပွဲ 1 ဖြုတ်ပြီOrderStatus · စားပွဲ 2 ချိတ်ပြီ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-status-2
        type: expect.preview
        at: { afterAction: expect-switch-log }
        timeoutMs: 5000
        target: { by: testId, value: order-status }
        textContains: "စားပွဲ 2"
        retry: { maxAttempts: 3, delayMs: 300 }

  # ------------------------------------------------------------------ 6
  - id: deps-board
    narration: >
      [[mark:board-deps]] Effect တစ်ခုက ချိတ်တာနဲ့ ဖြုတ်တာ၊ ဒီ နှစ်ခုပဲ လုပ်ပါတယ်။
      [[mark:draw-lifecycle]] စားပွဲ ပြောင်းသွားရင် စားပွဲ 1 နဲ့ ဖြုတ်ပြီး၊ စားပွဲ
      2 နဲ့ ပြန်ချိတ်ပါတယ်။ [[mark:draw-rule-deps]] dependency စာရင်းထဲမှာ Effect
      ဖတ်တဲ့ props၊ state နဲ့ အဲဒါတွေကနေ တွက်ထားတဲ့ တန်ဖိုး အားလုံး ပါရပါမယ်။
      ကိုယ့် Effect ကတော့ စားပွဲ နံပါတ်ပဲ ဖတ်ပါတယ်။ [[mark:draw-rule-lint]] lint
      rule ဆိုတာ code ကို run မကြည့်ခင် ဖတ်ပြီး၊ မှားနိုင်တာကို သတိပေးတဲ့
      စစ်ဆေးချက်ပါ။ React ရဲ့ lint rule က ဒီ စာရင်းကို စစ်ပြီး၊ သတိပေးရင် code ကို
      ပြင်ပါ။ တန်ဖိုး တစ်ခု ချန်ခဲ့ရင် Effect က တန်ဖိုး အဟောင်းနဲ့ ကျန်နေလို့ပါ။
      [[mark:draw-rule-return]] setup က cleanup function ကိုပဲ ပြန်ပေးရပါမယ်၊
      ဒါမှမဟုတ် ဘာမှ မပြန်ပါနဲ့။ null ပြန်မိရင်ဖြစ်ဖြစ်၊ setup ကို async function
      အဖြစ် ရေးလို့ promise ပြန်သွားရင်ဖြစ်ဖြစ်၊ development မှာ warning ပေးပါတယ်။
    sources:
      - title: "React — Lifecycle of Reactive Effects"
        url: "https://react.dev/learn/lifecycle-of-reactive-effects"
      - title: "React — Removing Effect Dependencies"
        url: "https://react.dev/learn/removing-effect-dependencies"
      - title: "React — exhaustive-deps lint rule"
        url: "https://react.dev/reference/eslint-plugin-react-hooks/lints/exhaustive-deps"
      - title: "React — useEffect: Parameters"
        url: "https://react.dev/reference/react/useEffect#parameters"
    actions:
      - id: board-deps
        type: whiteboard.apply
        at: { mark: board-deps }
        open: true
        maximized: true
        clear: true
        upsertIds: [b3-title]
      - id: draw-lifecycle
        type: whiteboard.apply
        at: { mark: draw-lifecycle }
        upsertIds:
          [
            b3-c1-box,
            b3-c1-text,
            b3-arrow-1,
            b3-c2-box,
            b3-c2-text,
            b3-arrow-2,
            b3-c3-box,
            b3-c3-text,
          ]
        drawMs: 2800
      - id: draw-rule-deps
        type: whiteboard.apply
        at: { mark: draw-rule-deps }
        upsertIds: [b3-rule-deps]
        drawMs: 1200
      - id: draw-rule-lint
        type: whiteboard.apply
        at: { mark: draw-rule-lint }
        upsertIds: [b3-rule-lint]
        drawMs: 1200
      - id: draw-rule-return
        type: whiteboard.apply
        at: { mark: draw-rule-return }
        upsertIds: [b3-rule-return, b3-rule-warn]
        drawMs: 1800

  # ------------------------------------------------------------------ 7
  - id: no-effect-board
    chapter: "Effect မလိုတဲ့ နေရာတွေ"
    narration: >
      [[mark:board-no-effect]] Effect မရေးခင် တကယ် လိုလား ဆိုတာ အရင် စစ်ကြည့်ပါ။
      [[mark:draw-no-derive]] props နဲ့ state ကနေ တွက်ယူလို့ ရတဲ့ တန်ဖိုးကို
      render လုပ်နေတုန်းမှာပဲ တွက်ပါ၊ lesson 4 မှာ menu ကို စစ်ထုတ်ခဲ့သလိုပါ။
      [[mark:draw-no-reset]] prop ပြောင်းလို့ state ပြန်စချင်ရင် key ကို သုံးပါ။
      [[mark:draw-no-handler]] user လုပ်လို့ ဖြစ်တဲ့ အလုပ်ကို event handler
      ထဲမှာပဲ ရေးပါ။ [[mark:draw-no-chain]] Effect က state ကို ပြောင်း၊
      အဲဒါကြောင့် နောက် Effect run ပြီး state ထပ်ပြောင်း ဆိုတဲ့ ကွင်းဆက်မျိုးကို
      ရှောင်ပါ။ ပြန် render တွေ အဆင့်ဆင့် ဖြစ်လို့ နှေးပြီး၊ နားလည်ရလည်း ခက်ပါတယ်။
      [[mark:draw-yes-sync]] မီးဖိုချောင် connection ကတော့ အပြင်က system အစစ်
      ဖြစ်လို့၊ Effect နဲ့ လုပ်သင့်တဲ့ အလုပ်ပါ။
    sources:
      - title: "React — You Might Not Need an Effect"
        url: "https://react.dev/learn/you-might-not-need-an-effect"
      - title: "React — Resetting all state when a prop changes"
        url: "https://react.dev/learn/you-might-not-need-an-effect#resetting-all-state-when-a-prop-changes"
    actions:
      - id: board-no-effect
        type: whiteboard.apply
        at: { mark: board-no-effect }
        clear: true
        upsertIds: [b4-title]
      - id: draw-no-derive
        type: whiteboard.apply
        at: { mark: draw-no-derive }
        upsertIds: [b4-derive]
        drawMs: 1200
      - id: draw-no-reset
        type: whiteboard.apply
        at: { mark: draw-no-reset }
        upsertIds: [b4-reset]
        drawMs: 1200
      - id: draw-no-handler
        type: whiteboard.apply
        at: { mark: draw-no-handler }
        upsertIds: [b4-handler]
        drawMs: 1200
      - id: draw-no-chain
        type: whiteboard.apply
        at: { mark: draw-no-chain }
        upsertIds: [b4-chain, b4-chain-strike]
        drawMs: 1600
      - id: draw-yes-sync
        type: whiteboard.apply
        at: { mark: draw-yes-sync }
        upsertIds: [b4-sync, b4-sync-check]
        drawMs: 1400

  # ------------------------------------------------------------------ 8
  - id: naive-status
    chapter: "useEffectEvent နဲ့ နောက်ဆုံး တန်ဖိုး"
    narration: >
      [[mark:close-board-no-effect]] အခု ပိုခက်တဲ့ ကိစ္စပါ။ မီးဖိုချောင် အသင့်
      ဖြစ်ရင် အသိပေးချက် ပြပြီး၊ အသံ ဖွင့်ထားရင် ခေါင်းလောင်း ထည့်ချင်ပါတယ်။
      [[mark:open-naive]] OrderStatusNaive ကတော့ လူအများစု အရင် ရေးမိမယ့်
      ပုံစံအတိုင်း ရေးထားတာပါ။ [[mark:select-naive-notice]] သူ့ အသိပေးချက်က sound
      prop ကို ဖတ်ပါတယ်။ [[mark:select-naive-deps]] ဒါကြောင့် ခုနက စည်းကမ်းအရ
      sound ကလည်း dependency ဖြစ်ရပါမယ်။ [[mark:open-app-naive]] သူ့ကို
      OrderStatus အောက်မှာ စားပွဲနဲ့ အသံ ပေးပြီး ထည့်လိုက်ရအောင်။
      [[mark:after-wire-naive]] App ကို ပြင်လို့ page ပြန်ပွင့်ပြီး၊ စားပွဲ 1 နဲ့
      မှတ်တမ်း အလွတ်ကနေ ပြန်စပါတယ်။ component နှစ်ခုလုံး မှတ်တမ်းထဲ ရေးပြီး၊ Naive
      ရဲ့ အသိပေးချက်မှာ ခေါင်းလောင်း ပါပါတယ်။ [[mark:click-sound-1]] အသံကို
      ပိတ်လိုက်ရအောင်။ [[mark:after-sound-1]] အသံ ပြောင်းရုံနဲ့ Naive က ဖြုတ်ပြီး
      ပြန်ချိတ်သွားပါတယ်။ မီးဖိုချောင်ဘက်မှာ ဘာမှ မပြောင်းလို့၊ ဒါက မလိုအပ်တဲ့
      အလုပ်ပါ။
    sources:
      - title: "React — Separating Events from Effects"
        url: "https://react.dev/learn/separating-events-from-effects"
      - title: "React — Removing Effect Dependencies"
        url: "https://react.dev/learn/removing-effect-dependencies"
    actions:
      - id: close-board-no-effect
        type: whiteboard.apply
        at: { mark: close-board-no-effect }
        open: false
      - id: open-naive
        type: workspace.openFile
        at: { mark: open-naive }
        path: src/OrderStatusNaive.jsx
      - id: select-naive-notice
        type: editor.select
        at: { mark: select-naive-notice }
        target:
          {
            file: src/OrderStatusNaive.jsx,
            text: "    connection.on(\"connected\", () => {\n      showNotice(\"Naive · စားပွဲ \" + tableId + \" အသင့်\", sound);\n",
            occurrence: 1,
          }
      - id: select-naive-deps
        type: editor.select
        at: { mark: select-naive-deps }
        target: { file: src/OrderStatusNaive.jsx, text: "[tableId, sound]", occurrence: 1 }
      - id: open-app-naive
        type: workspace.openFile
        at: { mark: open-app-naive }
        path: src/App.jsx
      - id: wire-naive-import
        type: editor.type
        at: { afterAction: open-app-naive }
        cadence: block
        target:
          {
            file: src/App.jsx,
            after: "import OrderStatus from \"./OrderStatus.jsx\";\n",
            occurrence: 1,
          }
        text: "import OrderStatusNaive from \"./OrderStatusNaive.jsx\";\n"
      - id: wire-naive-use
        type: editor.type
        at: { afterAction: wire-naive-import }
        cadence: block
        target:
          { file: src/App.jsx, after: "      <OrderStatus tableId={tableId} />\n", occurrence: 1 }
        text: "      <OrderStatusNaive tableId={tableId} sound={sound} />\n"
      - id: expect-naive-notice
        type: expect.preview
        at: { mark: after-wire-naive }
        timeoutMs: 5000
        target: { by: testId, value: kitchen-log }
        textContains: "🔔 Naive · စားပွဲ 1 အသင့်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: click-sound-1
        type: preview.click
        at: { mark: click-sound-1 }
        timeoutMs: 5000
        target: { by: testId, value: sound-toggle }
        retry: { maxAttempts: 1, delayMs: 0 }
