  # ------------------------------------------------------------------ 9
  - id: reactive-board
    narration: >
      [[mark:board-reactive]] ဒီ Effect ထဲမှာ logic နှစ်မျိုး ရောနေပါတယ်။
      [[mark:draw-reactive]] ချိတ်တဲ့ logic က reactive ပါ၊ စားပွဲ နံပါတ်
      ပြောင်းရင် ပြန်ချိတ်ရပါမယ်။ [[mark:draw-non-reactive]] props နဲ့ state ကို
      reactive တန်ဖိုးလို့ ခေါ်လို့၊ sound လည်း reactive တန်ဖိုးပါပဲ။ ဒါပေမဲ့
      အသိပေးချက် logic က sound ပြောင်းတိုင်း ပြန်ချိတ်စရာ မလိုဘဲ၊ အသင့်
      ဖြစ်ချိန်မှာ နောက်ဆုံး sound ကိုပဲ ဖတ်ချင်တာပါ။ [[mark:draw-effect-event]]
      ဒါအတွက် React 19.2 မှာ useEffectEvent ပါလာပါတယ်။ component ရဲ့ အပေါ်ဆုံး
      အဆင့်မှာ သူ့ကို function တစ်ခု ပေးရင်၊ Effect Event လို့ ခေါ်တဲ့ function
      တစ်ခု ပြန်ရပါတယ်။ အဲဒါကို Effect ထဲကပဲ ခေါ်ရပါတယ်။
      [[mark:draw-effect-event-deps]] Effect Event က နောက်ဆုံး props နဲ့ state ကို
      အမြဲ မြင်ပြီး၊ dependency စာရင်းထဲ မထည့်ရပါဘူး။
    sources:
      - title: "React — useEffectEvent"
        url: "https://react.dev/reference/react/useEffectEvent"
      - title: "React 19.2 — useEffectEvent"
        url: "https://react.dev/blog/2025/10/01/react-19-2"
      - title: "React — Separating Events from Effects"
        url: "https://react.dev/learn/separating-events-from-effects"
    actions:
      - id: board-reactive
        type: whiteboard.apply
        at: { mark: board-reactive }
        open: true
        maximized: true
        clear: true
        upsertIds: [b5-title]
      - id: draw-reactive
        type: whiteboard.apply
        at: { mark: draw-reactive }
        upsertIds: [b5-left-box, b5-left-name, b5-left-l1, b5-left-l2]
        drawMs: 2000
      - id: draw-non-reactive
        type: whiteboard.apply
        at: { mark: draw-non-reactive }
        upsertIds: [b5-right-box, b5-right-name, b5-right-l1, b5-right-l2]
        drawMs: 2000
      - id: draw-effect-event
        type: whiteboard.apply
        at: { mark: draw-effect-event }
        upsertIds: [b5-right-underline, b5-rule-call]
        drawMs: 1600
      - id: draw-effect-event-deps
        type: whiteboard.apply
        at: { mark: draw-effect-event-deps }
        upsertIds: [b5-rule-deps]
        drawMs: 1000

