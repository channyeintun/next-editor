      [[mark:close-board-reactive]] OrderStatus ကို ပြင်ရအောင်။
      [[mark:open-app-fix]] App ကနေ sound ကိုပါ ပေးလိုက်ပါတယ်။
      [[mark:open-os-fix]] OrderStatus မှာ useEffectEvent နဲ့ အသိပေးချက် function
      ကို import လုပ်ပြီး၊ sound prop ကို လက်ခံပါတယ်။ [[mark:fix-event]]
      အသိပေးချက်ကို useEffectEvent ထဲ ထည့်လိုက်လို့၊ Effect Event က စားပွဲနဲ့
      sound ကို ဖတ်ပါတယ်။ [[mark:fix-on]] Effect ထဲမှာ မီးဖိုချောင် အသင့် ဖြစ်ရင်
      သူ့ကို ခေါ်ပါတယ်။ [[mark:select-fix-deps]] dependency စာရင်းမှာ စားပွဲ
      နံပါတ်ပဲ ရှိနေတုန်းပါ။ page ပြန်ပွင့်လို့ အသံလည်း ပြန်ဖွင့်ထားပါတယ်။
      [[mark:click-sound-2]] အသံကို ထပ်ပိတ်ကြည့်ရအောင်။ [[mark:after-sound-2]]
      Naive ပဲ ပြန်ချိတ်ပြီး၊ OrderStatus ကတော့ ချိတ်ထားတဲ့အတိုင်းပါ။
      [[mark:click-table-3]] စားပွဲ 2 ကို ပြောင်းကြည့်ရအောင်။
      [[mark:after-table-3]] စားပွဲ တကယ် ပြောင်းလို့ နှစ်ခုလုံး ပြန်ချိတ်ပါတယ်။
      OrderStatus ရဲ့ အသိပေးချက်မှာ ခေါင်းလောင်း မပါတော့ပါဘူး။ အသံ ပိတ်တုန်းက
      ပြန်မချိတ်ခဲ့ပေမယ့်၊ Effect Event က နောက်ဆုံး sound ကို ဖတ်လို့ပါ။
    sources:
      - title: "React — useEffectEvent: Usage"
        url: "https://react.dev/reference/react/useEffectEvent#usage"
      - title: "React — Declaring an Effect Event"
        url: "https://react.dev/learn/separating-events-from-effects#declaring-an-effect-event"
