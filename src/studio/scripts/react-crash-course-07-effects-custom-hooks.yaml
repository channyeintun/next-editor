# React crash course, lesson 7 — Effects and custom hooks (Burmese, my-MM).
#
# Story: React has three places for code (render, event handlers, Effects);
# an Effect runs after the screen updates (useLayoutEffect before the paint,
# useEffect usually after it) and keeps a component in sync with something
# outside React. Our outside system is a pretend kitchen connection
# (src/kitchen.js) that writes into a kitchen log list pinned in index.html,
# OUTSIDE #root, with plain DOM calls. OrderStatus connects the chosen table
# in useEffect with a cleanup and [tableId]; the log shows StrictMode's
# development-only connect → disconnect → connect, then a table switch
# disconnects table 1 before connecting table 2. Boards cover the dependency
# rules (and the non-function return warning) and "You might not need an
# Effect". The pinned OrderStatusNaive reads `sound` for its notice, so its
# deps are [tableId, sound] and toggling sound reconnects it; OrderStatus
# moves the notice into useEffectEvent (React 19.2) and keeps [tableId], so it
# does not reconnect, yet its notice reads the latest sound. Last, a
# module-level store (queueStore.js) + a custom hook on useSyncExternalStore
# (useKitchenQueue.js) give the header and a KitchenPanel one shared count.
#
# Insert-only plan: kitchen.js, OrderStatusNaive.jsx and the starting App are
# pinned; OrderStatus.jsx, queueStore.js, useKitchenQueue.js and
# KitchenPanel.jsx are pinned EMPTY and typed while nothing imports them.
# Live modules (App.jsx, Header.jsx, and OrderStatus.jsx once it is wired)
# only take `block` inserts of complete lines or of a few characters that
# keep the file valid (", useEffectEvent", ", sound", " sound={sound}"), the
# import always before its usage. Every JS edit fully reloads the preview
# (state AND the kitchen log reset), so every click comes after the last edit
# and every expect.preview is anchored after it.
#
# The dev server starts during the first board and is first needed when the
# preview opens at the end of the code tour, about 1.5 minutes later.
#
# Narration is Burmese (my-MM); voice-script.md in this folder is its source
# (DESIGN.md is the brief, tools/narration-en.txt the English draft). Every
# visible string (title, chapters, board labels, UI) is Burmese.
