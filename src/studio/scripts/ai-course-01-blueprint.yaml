  - id: deterministic
    chapter: "AI ကို ဘယ်အချိန် သုံးမလဲ"
    narration: >
      [[mark:draw-det]] သာမန် code နဲ့ AI ကို အရင် နှိုင်းယှဉ်ကြည့်ရအောင်။ menu မှာ လက်ဖက်ရည် ကို ဘယ်နှခါ
      ရှာရှာ ရလဒ် တူတူပဲ ထွက်ပါတယ်။ ဒီလို input တူရင် output လည်း အမြဲ တူတဲ့ software ကို deterministic
      software လို့ ခေါ်ပါတယ်။ [[mark:draw-ai]] AI ကတော့ machine learning လို နည်းတွေနဲ့ data ထဲက pattern
      တွေကို သင်ယူထားပြီး၊ ခန့်မှန်းတာ ဒါမှမဟုတ် အသစ် ဖန်တီးတာ လုပ်ပေးနိုင်တဲ့ နည်းပညာပါ။ သင်ယူပြီး ရလာတဲ့
      model ဆိုတာ ဂဏန်း အများကြီးနဲ့ ပုံစံ တစ်ခု ဖြစ်ပြီး၊ input ပေးရင် အဲဒီ ဂဏန်းတွေနဲ့ output
      ထုတ်ပေးပါတယ်။ [[mark:draw-ai-varies]] pattern ကနေ ခန့်မှန်းတာ ဖြစ်လို့ AI က မေးခွန်း နီးနီးချင်း
      နှစ်ခုကို အဖြေ ကွာကွာ ပေးနိုင်ပြီး၊ မှားတဲ့ အဖြေကိုလည်း မှန်သလိုလို ပေးတတ်ပါတယ်။ [[mark:draw-rule]]
      ဒါကြောင့် သာမန် code နဲ့ ဖြေရှင်းလို့ ရရင် AI ကို မသုံးပါနဲ့။ သုံးမယ်ဆိုရင်တော့ အဲဒီ မသေချာမှုကို
      လက်ခံရလောက်အောင် user အတွက် အကျိုးကျေးဇူး ရှိရပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Introduction to AI on the web",
          url: "https://web.dev/learn/ai/introduction",
        }
      - {
          title: "web.dev Learn AI: Glossary and concepts (deterministic software, model)",
          url: "https://web.dev/learn/ai/glossary",
        }
    actions:
      - {
          id: draw-det,
          type: whiteboard.apply,
          at: { mark: draw-det },
          clear: true,
          upsertIds: [d-left-title, d-left-box, d-l1, d-l2, d-check, d-l-same],
          drawMs: 3000,
        }
      - {
          id: draw-ai,
          type: whiteboard.apply,
          at: { mark: draw-ai },
          upsertIds: [d-right-title, d-right-box, d-model],
          drawMs: 2000,
        }
      - {
          id: draw-ai-varies,
          type: whiteboard.apply,
          at: { mark: draw-ai-varies },
          upsertIds: [d-r1, d-r2, d-r3],
          drawMs: 1800,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: draw-rule },
          upsertIds: [d-rule],
          drawMs: 1200,
        }

  - id: search
    narration: >
      [[mark:close-det]] ဒါကို ဆိုင်ရဲ့ search မှာ ကြည့်ရအောင်။ [[mark:panel-ready]] ညာဘက်က AI panel က
      course တစ်လျှောက်လုံး program ရဲ့ ရလဒ်ကို card တွေနဲ့ ပြပေးမယ့် နေရာပါ။ [[mark:open-search]] ဒါက
      ဆိုင်မှာ အခု သုံးနေတဲ့ menu search code ပါ။ customer ရိုက်တဲ့ စာက menu နာမည်ထဲမှာ ပါမှပဲ item ကို
      ပြန်ပေးပါတယ်။ AI မပါတဲ့ code ဖြစ်လို့ card ရဲ့ badge ကလည်း AI မပါဘူးလို့ ပြနေပါတယ်။
      [[mark:read-found]] card က lesson အတွက် ပြင်ဆင်ထားတဲ့ နမူနာ search ငါးခုကို ပြထားပါတယ်။ မုန့်ဟင်းခါး
      ကို နာမည်အတိုင်း ရိုက်ရင် တွေ့ပြီး၊ အင်္ဂလိပ်လို ရိုက်တဲ့ စာက menu ရဲ့ အင်္ဂလိပ် နာမည်နဲ့ ကိုက်လို့
      လက်ဖက်ရည်ကိုလည်း တွေ့ပါတယ်။ [[mark:read-missing]] ဒါပေမဲ့ မစပ်တဲ့ မနက်စာ လို့ ရှာရင် ဘာမှ
      မတွေ့ပါဘူး။ မုန့်ဟင်းခါး၊ ပလာတာ လို မစပ်တဲ့ မနက်စာ ရှိပေမယ့် နာမည်ထဲမှာ အဲဒီ စကားလုံး မပါလို့ပါ။
      အေးအေး ချိုချို လို့ ရှာတဲ့သူလည်း ဖာလူဒါကို မတွေ့ပါဘူး။ လက်ဖက်ရည် ကို အင်္ဂလိပ် စာလုံးနဲ့ ရိုက်တဲ့
      ကျောင်းသား မောင်မောင် လည်း ဘာမှ မတွေ့ပါဘူး။ ရှာမတွေ့တဲ့ customer တွေက များသောအားဖြင့် ဘာမှ မမှာဘဲ
      ထွက်သွားတတ်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Introduction to AI on the web (Opportunity: use case)",
          url: "https://web.dev/learn/ai/introduction",
        }
      - {
          title: "Google Cloud: Search abandonment impacts retail sales and brand loyalty",
          url: "https://cloud.google.com/blog/topics/retail/search-abandonment-impacts-retail-sales-brand-loyalty",
        }
    actions:
      - { id: close-det, type: whiteboard.apply, at: { mark: close-det }, open: false }
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-done
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: ai-status }
        attribute: { name: data-state, value: "done" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-search-card
        type: expect.preview
        at: { afterAction: expect-done }
        timeoutMs: 5000
        target: { by: testId, value: ai-search }
        attribute: { name: data-label, value: "Menu search today" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-search-rows
        type: expect.preview
        at: { afterAction: expect-search-card }
        timeoutMs: 5000
        target: { by: testId, value: ai-search }
        attribute: { name: data-count, value: "5" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - {
          id: open-search,
          type: workspace.openFile,
          at: { mark: open-search },
          path: src/search.js,
        }
      - id: sel-includes
        type: editor.select
        at: { afterAction: open-search }
        target:
          {
            file: src/search.js,
            text: "item.name.includes(q) || item.en.toLowerCase().includes(q)",
            occurrence: 1,
          }
      - id: expect-badge
        type: expect.preview
        at: { afterAction: sel-includes }
        timeoutMs: 5000
        target: { by: testId, value: ai-search-badge }
        textContains: "rules · AI မပါ"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-found-english
        type: expect.preview
        at: { mark: read-found }
        timeoutMs: 5000
        target: { by: testId, value: ai-search-2 }
        textContains: "လက်ဖက်ရည်"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-missing-vague
        type: expect.preview
        at: { mark: read-missing }
        timeoutMs: 5000
        target: { by: testId, value: ai-search-3 }
        textContains: "—"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-missing-cold-sweet
        type: expect.preview
        at: { afterAction: expect-missing-vague }
        timeoutMs: 5000
        target: { by: testId, value: ai-search-4 }
        textContains: "—"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-missing-romanized
        type: expect.preview
        at: { afterAction: expect-missing-cold-sweet }
        timeoutMs: 5000
        target: { by: testId, value: ai-search-5 }
        textContains: "—"
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: opportunity
    chapter: "AI system blueprint"
    narration: >
      [[mark:draw-blueprint]] ဒီ ပြဿနာကို AI နဲ့ ဖြေရှင်းသင့်လား ဆုံးဖြတ်ဖို့ AI system blueprint ကို
      သုံးပါမယ်။ blueprint ဆိုတာ AI feature တစ်ခုကို ဘာကြောင့်၊ ဘယ်လို၊ ဘယ်လို တာဝန်သိသိ ဆောက်မလဲ ဆိုတာကို
      ပုံ တစ်ပုံထဲ ချရေးထားတာပါ။ [[mark:draw-opportunity]] ပထမ အပိုင်း Opportunity မှာ use case နဲ့
      အကျိုးကျေးဇူး ပါပါတယ်။ use case ဆိုတာ AI နဲ့ ဖြေရှင်းဖို့ တန်တဲ့ user ရဲ့ ပြဿနာ ဖြစ်ပြီး၊ ဒီမှာတော့
      customer တွေ ကိုယ့်စကားနဲ့ကိုယ် ရှာတဲ့အခါ လိုချင်တာကို မတွေ့တာပါ။ [[mark:draw-value]]
      အကျိုးကျေးဇူးမှာ ဘက် နှစ်ဘက် ရှိပါတယ်။ customer က မြန်မြန် တွေ့ပြီး ဆိုင်က ပိုရောင်းရပါတယ်။
      အစမှာတော့ ရှာမတွေ့တဲ့ search ဘယ်လောက် ရှိလဲ ဆိုတာ အကြမ်းဖျင်း တိုင်းထားရင် လုံလောက်ပါတယ်။ တခြား
      website တွေမှာလည်း သတင်း အတိုချုပ်တာ၊ alt text အကြံပြုတာ၊ documentation ရှာပေးတာ စတဲ့ use case
      တွေလည်း ရှိပါတယ်။ opportunity မှားရွေးတာက AI project တွေ မအောင်မြင်ရတဲ့ အဓိက အကြောင်းရင်း တစ်ခုလို့
      သုတေသန တစ်ခုက တွေ့ထားပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Introduction to AI on the web (Opportunity)",
          url: "https://web.dev/learn/ai/introduction",
        }
      - {
          title: "RAND: The Root Causes of Failure for Artificial Intelligence Projects",
          url: "https://www.rand.org/pubs/research_reports/RRA2680-1.html",
        }
    actions:
      - {
          id: draw-blueprint,
          type: whiteboard.apply,
          at: { mark: draw-blueprint },
          open: true,
          clear: true,
          upsertIds: [b-title],
        }
      - {
          id: draw-opportunity,
          type: whiteboard.apply,
          at: { mark: draw-opportunity },
          upsertIds: [b-opp-box, b-opp-title, b-opp-case],
          drawMs: 1800,
        }
      - {
          id: draw-value,
          type: whiteboard.apply,
          at: { mark: draw-value },
          upsertIds: [b-opp-value],
          drawMs: 900,
        }

  - id: data
    chapter: "Solution: data၊ intelligence၊ UX"
    narration: >
      [[mark:draw-solution]] ဘယ်လို ဆောက်မလဲ ဆိုတာကတော့ data၊ intelligence နဲ့ U X ဆိုတဲ့ အလွှာ သုံးခု
      ပါတဲ့ Solution အပိုင်းပါ။ [[mark:draw-data]] data က AI ရဲ့ လောင်စာ ဖြစ်လို့ data ညံ့ရင် ရလဒ်လည်း
      ညံ့ပါတယ်။ menu နာမည်၊ ဈေး လို column တွေနဲ့ စီထားတာက structured data ဖြစ်ပြီး၊ ဖော်ပြချက်၊ review
      လို ပုံသေ ပုံစံ မရှိတဲ့ စာသားက unstructured data ပါ။ [[mark:draw-data-more]] အအေးနဲ့ ရေခဲ လို
      အဓိပ္ပာယ်တူ စကားလုံး စာရင်းနဲ့၊ customer ရှာပြီး ဘာနှိပ်လဲ ဘာမှာလဲ ဆိုတဲ့ user signal လည်း
      အသုံးဝင်ပါတယ်။ ဓာတ်ပုံလို data လည်း ရှိပေမယ့် အားလုံး တစ်ခါတည်း မလိုပါဘူး။ အသုံးဝင်ဆုံး data
      နည်းနည်းနဲ့ အရင် စပါ။ [[mark:draw-data-ready]] data ကို model သုံးလို့ ရအောင် သန့်ရှင်းပြီး ပုံစံ
      ပြောင်းရပါမယ်။ ဥပမာ menu ဖော်ပြချက်တွေကို embedding အဖြစ် ပြောင်းတာပါ။ embedding ဆိုတာ စာသားရဲ့
      အဓိပ္ပာယ်ကို ဂဏန်း အတန်းရှည် တစ်ခုအဖြစ် ပြောင်းထားတာ ဖြစ်ပြီး၊ အဓိပ္ပာယ် နီးရင် ဂဏန်းတွေလည်း
      နီးပါတယ်။ [[mark:data-quality]] ကြို train ပြီးသား model တွေပေါ်မှာ ဆောက်တဲ့ ခေတ်မို့ data များတာထက်
      ကောင်းတာက ပိုအရေးကြီးပါတယ်။ data ကို model train လုပ်တာ၊ စစ်တာ၊ user သုံးနေတုန်း စောင့်ကြည့်တာ
      အားလုံးမှာ ပြန်သုံးရလို့ အမြဲ ထိန်းသိမ်းရပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Introduction to AI on the web (Solution: data)",
          url: "https://web.dev/learn/ai/introduction",
        }
    actions:
      - {
          id: draw-solution,
          type: whiteboard.apply,
          at: { mark: draw-solution },
          upsertIds: [b-arrow-1, b-sol-label],
          drawMs: 1000,
        }
      - {
          id: draw-data,
          type: whiteboard.apply,
          at: { mark: draw-data },
          upsertIds: [b-data-box, b-data-title, b-data-1, b-data-2],
          drawMs: 2000,
        }
      - {
          id: draw-data-more,
          type: whiteboard.apply,
          at: { mark: draw-data-more },
          upsertIds: [b-data-3],
          drawMs: 900,
        }

  - id: intelligence
    narration: >
      [[mark:draw-intel]] intelligence ကတော့ data ကို အဓိပ္ပာယ်ဖော်ပြီး ခန့်မှန်းတာ၊ ဖန်တီးတာ လုပ်တဲ့
      အပိုင်းပါ။ menu search မှာဆိုရင် ပထမဆုံး ရှာတဲ့ စာထဲက မစပ်၊ မနက်စာ ဆိုတဲ့ အချက်တွေကို ထုတ်ယူပါမယ်။
      [[mark:draw-intel-search]] ပြီးရင် စကားလုံး တူမတူ မဟုတ်ဘဲ အဓိပ္ပာယ် နီးမနီးနဲ့ ရှာတဲ့ semantic
      search ကို embedding နဲ့ လုပ်ပြီး၊ ပိုသက်ဆိုင်တာ အပေါ်ရောက်အောင် model သေးသေး တစ်ခုနဲ့ ပြန်စီတဲ့
      re ranking ကို လုပ်ပါမယ်။ [[mark:draw-intel-small]] AI ဆိုတာ LLM ချည်းပဲ မဟုတ်ပါဘူး။ LLM ဆိုတာ
      large language model၊ စာသား အလွန် များများနဲ့ train ထားတဲ့ model ကြီးပါ။ အလုပ် တစ်မျိုးအတွက်
      လုပ်ထားတဲ့ model သေးတွေက ပိုမြန်ပြီး ပိုသက်သာတာ များပါတယ်။ တကယ့် system တွေကလည်း model တွေကို
      database၊ API၊ စစ်ဆေးတဲ့ code တွေနဲ့ တွဲသုံးကြပြီး၊ ဒါကို compound AI system လို့ ခေါ်ပါတယ်။
      ဒါကြောင့် အသစ်ထွက်တဲ့ model နောက် မလိုက်ဘဲ ကိုယ့် ပြဿနာနဲ့ ကိုက်တာကို ရွေးပါ။
    sources:
      - {
          title: "web.dev Learn AI: Introduction to AI on the web (Solution: intelligence)",
          url: "https://web.dev/learn/ai/introduction",
        }
      - {
          title: "web.dev Learn AI: Glossary and concepts (compound AI)",
          url: "https://web.dev/learn/ai/glossary",
        }
    actions:
      - {
          id: draw-intel,
          type: whiteboard.apply,
          at: { mark: draw-intel },
          upsertIds: [b-intel-box, b-intel-title],
          drawMs: 1200,
        }
      - {
          id: draw-intel-search,
          type: whiteboard.apply,
          at: { mark: draw-intel-search },
          upsertIds: [b-intel-1, b-intel-2, b-intel-3],
          drawMs: 1800,
        }

  - id: ux
    narration: >
      [[mark:draw-ux]] U X ကတော့ AI ရဲ့ အကျိုးကျေးဇူးရော၊ မသေချာမှုပါ user ဆီ ရောက်တဲ့ နေရာပါ။ မှန်သလိုလို
      ထင်ရပေမယ့် တကယ် မရှိတာ၊ မမှန်တာကို model က ပြောတတ်ပြီး၊ ဒါကို hallucination လို့ ခေါ်ပါတယ်။
      ဒါကြောင့် ဘာမဆို မေးလို့ရတဲ့ chatbot က စိတ်ဝင်စားစရာ ကောင်းပေမယ့် အန္တရာယ် များပါတယ်။
      [[mark:draw-ux-quiet]] အစမှာ ရှိပြီးသား search box ထဲမှာပဲ ရလဒ်ကို တိတ်တိတ်လေး ပိုကောင်းအောင်
      လုပ်တာက ပိုစိတ်ချရပါတယ်။ [[mark:draw-ux-note]] ဒါပေမဲ့ AI နဲ့ ရှာထားပါတယ် ဆိုတဲ့ စာ တစ်ကြောင်းနဲ့
      ထုတ်ယူထားတဲ့ မစပ်၊ မနက်စာ လို အချက်တွေကို ပြပြီး၊ ပွင့်ပွင့်လင်းလင်း ပြောပြဖို့ လိုပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Introduction to AI on the web (Solution: user experience)",
          url: "https://web.dev/learn/ai/introduction",
        }
    actions:
      - {
          id: draw-ux,
          type: whiteboard.apply,
          at: { mark: draw-ux },
          upsertIds: [b-ux-box, b-ux-title],
          drawMs: 1000,
        }
      - {
          id: draw-ux-quiet,
          type: whiteboard.apply,
          at: { mark: draw-ux-quiet },
          upsertIds: [b-ux-1, b-ux-2],
          drawMs: 1300,
        }
      - {
          id: draw-ux-note,
          type: whiteboard.apply,
          at: { mark: draw-ux-note },
          upsertIds: [b-ux-3],
          drawMs: 900,
        }

  - id: governance
    narration: >
      [[mark:draw-gov]] နောက်ဆုံး အပိုင်း Governance ဆိုတာ privacy၊ fairness၊ trust တို့ကို
      စောင့်ရှောက်ပြီး system ကို တာဝန်ယူ ထိန်းကျောင်းတာပါ။ [[mark:draw-gov-1]] customer ရှာဖူးတာတွေကို သူ
      ခွင့်ပြုမှ သုံးပြီး၊ မဟုတ်ရင် သူ့ device ထဲမှာပဲ ထားတာက privacy ပါ။ item အသစ်တွေ၊ ဈေးသက်သာတာတွေ
      အောက်ဆုံးမှာပဲ အမြဲ မကျန်အောင် စစ်တာက fairness ဖြစ်ပြီး၊ ရလဒ် တစ်ခု ဘာကြောင့် ထိပ်ဆုံး ရောက်လဲ ပြတာက
      trust ပါ။ [[mark:draw-gov-2]] safety အတွက် guardrail ထည့်ပါမယ်။ guardrail ဆိုတာ model ဆီ ဝင်တာ
      ထွက်တာကို စစ်ပြီး မသင့်တော်တာကို တားတဲ့ စည်းကမ်း ဒါမှမဟုတ် code ပါ။ ဒီ search မှာတော့ ဆိုင်နဲ့
      မဆိုင်တဲ့ ရှာတာတွေကို တားပါမယ်။ [[mark:gov-recourse]] နောက်ဆုံး တစ်ခုကတော့ customer က AI ရဲ့ အဖြေကို
      ပယ်လို့ ရ၊ report လုပ်လို့ ရ၊ AI မပါတဲ့ search ကို ပြန်သုံးလို့ ရအောင် လုပ်ပေးထားတာပါ။ model ရဲ့
      output တိုင်းကို ထိန်းလို့ မရပေမယ့်၊ ဒီ feature ကို user ဆီ ပို့တာက ကိုယ်ဖြစ်လို့ ပြဿနာ ပေါ်ရင်
      ဖြေရှင်းဖို့ အသင့် ရှိရပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Introduction to AI on the web (Governance)",
          url: "https://web.dev/learn/ai/introduction",
        }
    actions:
      - {
          id: draw-gov,
          type: whiteboard.apply,
          at: { mark: draw-gov },
          upsertIds: [b-arrow-2, b-gov-box, b-gov-title],
          drawMs: 1500,
        }
      - {
          id: draw-gov-1,
          type: whiteboard.apply,
          at: { mark: draw-gov-1 },
          upsertIds: [b-gov-1],
          drawMs: 1000,
        }
      - {
          id: draw-gov-2,
          type: whiteboard.apply,
          at: { mark: draw-gov-2 },
          upsertIds: [b-gov-2, b-gov-under],
          drawMs: 1300,
        }

  - id: quiz
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ မြမြ က AI feature အသစ် တစ်ခု လုပ်ချင်တယ်လို့ ပြောလာရင်၊
      blueprint နဲ့ စဉ်းစားမယ့် အဓိက အပိုင်း သုံးပိုင်းက ဘာတွေလဲ။ lesson ကို pause လုပ်ပြီး
      စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] အဖြေကတော့ Opportunity၊ Solution နဲ့ Governance ပါ။
      ဘာကြောင့်လဲဆိုတော့ Opportunity က ဆောက်ရတဲ့ အကြောင်းရင်း၊ Solution က ဆောက်မယ့် နည်း၊ Governance က
      တာဝန်ယူမယ့် ပုံကို ပြလို့ပါ။ model၊ server၊ code ရွေးတာတွေကတော့ Solution ထဲမှာပဲ ပါပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Introduction to AI on the web (Check your understanding)",
          url: "https://web.dev/learn/ai/introduction",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [z-title, z-q1, z-q2, z-q3],
          drawMs: 1800,
        }
      - {
          id: draw-quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [z-a, z-a-note],
          drawMs: 1800,
        }

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:close-quiz]] ဒါဆို ပြန်ချုပ်ရရင်၊ AI feature မဆောက်ခင် မေးခွန်း သုံးခုကို အမြဲ မေးပါ။
      [[mark:sel-det]] သာမန် code နဲ့ ဖြေရှင်းလို့ ရရင် AI မလိုပါဘူး၊ AI က မသေချာမှုကို ယူလာလို့ပါ။
      [[mark:sel-blueprint]] feature တိုင်းကို Opportunity၊ Solution နဲ့ Governance ဆိုတဲ့ blueprint နဲ့
      စီစဉ်ပြီး၊ [[mark:sel-gov]] governance ကိုလည်း အစကတည်းက ထည့်စဉ်းစားပါ။ [[mark:sel-terms]] စကားလုံး
      အသစ်တွေကိုလည်း notes ဖိုင်မှာ စာရင်း လုပ်ထားပါတယ်။ နောက် lesson မှာတော့ ဆိုင်မှာ AI သုံးဖို့
      အခွင့်အလမ်းတွေကို ဘယ်လို ရှာမလဲ ဆိုတာ ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Introduction to AI on the web (Your takeaways)",
          url: "https://web.dev/learn/ai/introduction",
        }
      - { title: "web.dev Learn AI: Welcome to Learn AI!", url: "https://web.dev/learn/ai/welcome" }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: close-quiz }, open: false }
      - {
          id: open-notes,
          type: workspace.openFile,
          at: { mark: close-quiz, offsetMs: 400 },
          path: notes.md,
        }
      - id: sel-questions
        type: editor.select
        at: { afterAction: open-notes }
        target:
          {
            file: notes.md,
            text: "ဘာ feature လဲ၊ ဘာကြောင့်လဲ · AI က မှန်တဲ့ tool လား · ဘာဆိုရင် အောင်မြင်ပြီလဲ",
            occurrence: 1,
          }
      - id: sel-det
        type: editor.select
        at: { mark: sel-det }
        target: { file: notes.md, text: "input တူရင် output အမြဲ တူ", occurrence: 1 }
      - id: sel-blueprint
        type: editor.select
        at: { mark: sel-blueprint }
        target:
          {
            file: notes.md,
            text: "Opportunity → Solution (Data · Intelligence · UX) → Governance",
            occurrence: 1,
          }
      - id: sel-gov
        type: editor.select
        at: { mark: sel-gov }
        target:
          {
            file: notes.md,
            text: "privacy · fairness · trust · safety · AI ကို ပယ်လို့ ရ",
            occurrence: 1,
          }
      - id: sel-terms
        type: editor.select
        at: { mark: sel-terms }
        target: { file: notes.md, text: "ဒီ lesson ထဲက စကားလုံး အသစ်တွေ", occurrence: 1 }
checks:
  - { type: timing.p95Ms, max: 300 }
