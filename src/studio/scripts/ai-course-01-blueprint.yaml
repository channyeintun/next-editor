  - id: questions
    narration: >
      [[mark:draw-questions]] ဒါကြောင့် course တစ်လျှောက်လုံး မေးခွန်း သုံးခုကို ခဏခဏ ပြန်မေးသွားပါမယ်။
      [[mark:draw-q1]] ပထမက ဘာ feature ကို ဘာကြောင့် ဆောက်မှာလဲ ဆိုတာပါ။ [[mark:draw-q2]] ဒုတိယက feature
      အတွက်ရော၊ app ကို ရေးဖို့အတွက်ပါ၊ AI က မှန်တဲ့ tool ဟုတ်ရဲ့လား ဆိုတာပါ။ [[mark:draw-q3]] တတိယက
      ဘာဖြစ်ရင် အောင်မြင်ပြီလို့ ပြောမလဲ ဆိုတာပါ။ [[mark:strike-hype]] ဆိုင်ပိုင်ရှင် မြမြ ကိုတော့
      ဆိုင်တိုင်းမှာ AI ရှိရမယ်လို့ လူတွေက ပြောနေကြပါတယ်။ ဒါပေမဲ့ AI ပါအောင်လို့ပဲ ထည့်တဲ့ feature က
      ဘယ်သူ့ကိုမှ အကျိုး မပြုပါဘူး။ [[mark:draw-need]] ကောင်းတဲ့ feature တွေက user ရဲ့ တကယ့်
      လိုအပ်ချက်ကနေ စတာ ဖြစ်ပြီး၊ user ရတဲ့ အကျိုးကျေးဇူးနဲ့ တိုင်းပါတယ်။
    sources:
