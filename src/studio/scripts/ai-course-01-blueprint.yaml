build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 5101
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: welcome
    chapter: "Course ကို ကြိုဆိုပါတယ်"
    narration: >
      [[mark:start]] မင်္ဂလာပါ ခင်ဗျာ။ AI course ကို ကြိုဆိုပါတယ်။ ဒီ course မှာ ကိုယ်တို့က
      ရွှေလက်ဖက်ရည်ဆိုင်ရဲ့ web developer နေရာကနေ၊ website ထဲကို AI feature တွေ ဘယ်လို ထည့်မလဲ ဆိုတာ
      လေ့လာသွားမှာပါ။ AI tool တွေက လတိုင်းလိုလို ပြောင်းနေလို့၊ ဒီ course က tool သုံးနည်းထက် ဘာကို ဘယ်လို
      ဆုံးဖြတ်ရမလဲ ဆိုတာကို သင်ပေးမှာပါ။ [[mark:draw-role]] web developer ရဲ့ အလုပ်ကလည်း ပြောင်းလာနေပါတယ်။
      code ရေးတာ အရေးကြီးတုန်း ဖြစ်ပေမယ့်၊ အတွေ့အကြုံ ရင့်တဲ့ engineer တွေ လုပ်သလိုပဲ system တစ်ခုလုံးကို
      မဆောက်ခင် စီစဉ်တာက ပိုအရေးကြီးလာပါတယ်။ [[mark:draw-plan]] ဆိုလိုတာက၊ လိုအပ်ချက်တွေကို ချရေးတာ၊ AI
      ကို ဘယ်နေရာ ထည့်မလဲ ဆုံးဖြတ်တာ၊ AI မှားရင် ဘာလုပ်မလဲ ကြိုစဉ်းစားတာ စတဲ့ system architect တစ်ယောက်ရဲ့
      အလုပ်တွေကို လုပ်ရမှာပါ။ [[mark:draw-two-roles]] AI က app ထဲက feature ဖြစ်နိုင်သလို၊ code ရေးတဲ့အခါ
      ကူညီပေးတဲ့ အကူလည်း ဖြစ်နိုင်ပေမယ့်၊ ဘာက အလုပ်ဖြစ်လဲ ဆိုတာ နောက်ဆုံး ဆုံးဖြတ်ရမှာက ကိုယ်ပါ။
    sources:
      - {
          title: "web.dev Learn AI: Welcome to Learn AI! (course credit: written by Dr. Janna Lipenkova with editorial guidance from Alexandra Klepper; text CC BY 4.0, code Apache 2.0; adapted into Burmese with the course's own tea-shop examples)",
          url: "https://web.dev/learn/ai/welcome",
        }
      - {
          title: "Creative Commons: Attribution 4.0 International (CC BY 4.0), the licence of the web.dev Learn AI text adapted here",
          url: "https://creativecommons.org/licenses/by/4.0/",
        }
