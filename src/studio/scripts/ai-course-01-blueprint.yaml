# AI course, lesson 01: the web developer and the AI system blueprint (Burmese, the course pilot).
#
# A concept lesson (no deck, lead decision 2026-11-05): whiteboard boards carry the lists and the
# diagrams; the AI panel shows one static table card drawn by pinned code. No code is typed.
#
# Start state (ws/): notes.md (the key lines, highlighted in the recap); src/search.js, the shop's
# keyword search today (an item is found when its Burmese or English name contains the query);
# src/main.js runs it over data/menu.json for five sample queries and draws the table card
# `ai-search` (badge `rules · AI မပါ`: plain code, no model anywhere, M0). Measured (sim, then verify):
# မုန့်ဟင်းခါး → မုန့်ဟင်းခါး, milk tea → လက်ဖက်ရည်, မစပ်တဲ့ မနက်စာ / အေးအေး ချိုချို / laphet yay → —.
# The runtime starts at the first mark only to show that card (≥ 1,000 board characters before
# runtime.waitForReady).
#
# Boards: (W) the developer's role: code → planning the system; (Q) the three questions and
# "AI for AI's sake" struck out; (M) the course map in four groups; (D) deterministic software vs
# AI, the model gloss and the rule; (B) the AI system blueprint built layer by layer; (Z) the quiz.
# The board is a modal: the panel is seen only in the `search` scene, the editor (notes.md) in the
# recap.
#
# Build: bun ~/Documents/ai-course-work/tools/build-lesson.ts template.yaml ws ai-course-01-blueprint.yaml
schemaVersion: 1
lesson:
  slug: ai-course-01-blueprint
  title: "AI course 01: Web developer နဲ့ AI system blueprint"
  locale: my-MM
  workspace:
    lessonType: javascript
    name: AI course
    entryFilePath: notes.md
    sidebarStartsCollapsed: true
    files:
      course/panel.js: |
        // AI course · AI panel (runs in the preview page).
        // Runs the lesson program that course/runner.js bundles after every change and draws what the
        // program reports through the `ai-panel` module: inputs, outputs, scores, metrics, tables, the
        // parts of a prompt, eval results and charts, plus everything it prints with console.log.
        // Plain DOM, so the studio's rrweb recorder captures it and replay shows it exactly.
        //
        //   <script type="module" src="/course/panel.js" data-run="src/main.js"></script>
        //
        // In lesson code:  import { panel } from "ai-panel";
        //   panel.input(label, value)     panel.output(label, value)    panel.note(text)
        //   panel.scores(label, scores)   panel.metrics(label, values)  panel.table(label, rows)
        //   panel.prompt(label, parts)    panel.evals(label, results)   panel.chart(label, series, { x })
        //   every call takes a last { id, badge } option: id names the card's test id (ai-<id>);
        //   a later call with the same id replaces that card in place (a click handler redraws a result).
        const EVENT = "course:ai";
        const script = document.querySelector('script[src$="/course/panel.js"]');
        const entry = script?.dataset.run || "src/main.js";
        const showConsole = script?.dataset.console !== "off";
        const title = script?.dataset.title || "AI panel";
        const SWAP_MS = 400;

        const STYLE = `
        :root { color-scheme: dark; }
        html, body { margin: 0; background: #15171c; }
        #ai-panel { font: 14px/1.55 system-ui, -apple-system, "Segoe UI", "Noto Sans Myanmar", "Myanmar Sangam MN", "Myanmar Text", sans-serif; color: #d9dce2; padding: 0 0 24px; }
        #ai-panel * { box-sizing: border-box; }
        .aip-mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", "Noto Sans Myanmar", "Myanmar Sangam MN", monospace; font-size: 13px; }
        .aip-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #1e2128; border-bottom: 1px solid #2d323c; }
        .aip-logo { font-weight: 700; color: #fff; background: #7048e8; border-radius: 4px; padding: 1px 6px; font-size: 12px; letter-spacing: .04em; }
        .aip-title { font-weight: 600; color: #fff; }
        .aip-status { margin-left: auto; font-weight: 600; padding: 2px 10px; border-radius: 999px; font-size: 12px; white-space: nowrap; }
        .aip-status[data-state="done"] { background: #1f3d2a; color: #8fe0a6; }
        .aip-status[data-state="error"], .aip-status[data-state="syntax"] { background: #4a1f24; color: #ffb3b8; }
        .aip-status[data-state="notice"] { background: #47391a; color: #ffd98a; }
        .aip-status[data-state="running"], .aip-status[data-state="waiting"] { background: #2d323c; color: #c6cbd4; }
        .aip-cards { padding: 10px 12px 0; display: flex; flex-direction: column; gap: 10px; }
        .aip-card { background: #1c1f26; border: 1px solid #2d323c; border-radius: 8px; padding: 10px 12px; }
        .aip-card-head { display: flex; align-items: baseline; gap: 8px; margin: 0 0 6px; flex-wrap: wrap; }
        .aip-kind { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #9aa3b2; }
        .aip-card[data-kind="input"] .aip-kind { color: #74c0fc; }
        .aip-card[data-kind="output"] .aip-kind { color: #8ce99a; }
        .aip-card[data-kind="scores"] .aip-kind, .aip-card[data-kind="metrics"] .aip-kind { color: #ffc078; }
        .aip-card[data-kind="prompt"] .aip-kind { color: #b197fc; }
        .aip-card[data-kind="evals"] .aip-kind { color: #63e6be; }
        .aip-card[data-kind="error"] { border-color: #6b2a31; background: #22191c; }
        .aip-card[data-kind="error"] .aip-kind { color: #ff8787; }
        .aip-card[data-kind="notice"] { border-color: #6b5420; background: #221e15; }
        .aip-card[data-kind="notice"] .aip-kind { color: #ffd43b; }
        .aip-label { font-weight: 600; color: #f1f3f5; overflow-wrap: anywhere; }
        .aip-badge { margin-left: auto; font-size: 11px; color: #ced4da; background: #2d323c; border-radius: 4px; padding: 1px 6px; }
        .aip-value { white-space: pre-wrap; overflow-wrap: anywhere; color: #f1f3f5; }
        .aip-row { display: grid; grid-template-columns: minmax(64px, 34%) 1fr auto; align-items: center; gap: 8px; padding: 2px 0; }
        .aip-row-label { overflow-wrap: anywhere; }
        .aip-bar { height: 10px; background: #2d323c; border-radius: 5px; overflow: hidden; }
        .aip-bar > span { display: block; height: 100%; background: #ffa94d; border-radius: 5px; }
        .aip-row[data-top="true"] .aip-bar > span { background: #ff922b; }
        .aip-row[data-top="true"] .aip-row-label { color: #fff; font-weight: 600; }
        .aip-pct { min-width: 54px; text-align: right; color: #e9ecef; }
        .aip-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
        .aip-tile { background: #23272f; border-radius: 6px; padding: 6px 10px; }
        .aip-tile-name { font-size: 12px; color: #adb5bd; }
        .aip-tile-value { font-size: 20px; font-weight: 600; color: #fff; }
        .aip-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .aip-table th { text-align: left; color: #adb5bd; font-weight: 600; border-bottom: 1px solid #343a46; padding: 3px 6px; }
        .aip-table td { border-bottom: 1px solid #262a33; padding: 3px 6px; vertical-align: top; overflow-wrap: anywhere; }
        .aip-yes { color: #8ce99a; } .aip-no { color: #ff8787; }
        .aip-part { border-left: 3px solid #4dabf7; background: #1a2230; border-radius: 0 6px 6px 0; padding: 5px 10px; margin: 0 0 6px; }
        .aip-part-name { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin: 0 0 2px; }
        .aip-part-text { white-space: pre-wrap; overflow-wrap: anywhere; color: #f1f3f5; }
        .aip-foot { font-size: 12px; color: #9aa3b2; margin-top: 4px; }
        .aip-eval { display: grid; grid-template-columns: 20px 1fr; gap: 6px; padding: 2px 0; }
        .aip-eval-mark { font-weight: 700; }
        .aip-eval[data-pass="true"] .aip-eval-mark { color: #8ce99a; } .aip-eval[data-pass="false"] .aip-eval-mark { color: #ff8787; }
        .aip-eval-detail { color: #adb5bd; font-size: 13px; }
        .aip-summary { font-weight: 600; margin: 0 0 4px; }
        .aip-summary[data-all="true"] { color: #8ce99a; } .aip-summary[data-all="false"] { color: #ffa8a8; }
        .aip-chart svg { width: 100%; height: auto; display: block; }
        .aip-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: #ced4da; }
        .aip-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
        .aip-kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
        .aip-kv dt { color: #adb5bd; } .aip-kv dd { margin: 0; color: #f1f3f5; overflow-wrap: anywhere; }
        .aip-sec { padding: 12px 12px 0; }
        .aip-sec-title { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #9aa3b2; margin: 0 0 6px; font-weight: 600; }
        .aip-empty { color: #8a93a3; }
        .aip-log { white-space: pre-wrap; overflow-wrap: anywhere; padding: 2px 10px; border-left: 3px solid #3a404b; margin: 0 0 2px; }
        .aip-log[data-level="warn"] { border-color: #e0a800; color: #ffe08a; }
        .aip-log[data-level="error"] { border-color: #f2545b; color: #ffb3b8; }
        .aip-caret { color: #ff8787; }
        .aip-errors:empty { display: none; }
        .aip-errors { padding: 10px 12px 0; display: flex; flex-direction: column; gap: 10px; }
        .aip-cards[data-stale="true"], .aip-sec[data-stale="true"] { opacity: .45; }
        `;

        const el = (tag, attrs = {}, ...children) => {
          const node = document.createElement(tag);
          for (const [k, v] of Object.entries(attrs)) {
            if (v === undefined || v === null || v === false) continue;
            if (k === "class") node.className = v;
            else node.setAttribute(k, String(v));
          }
          for (const child of children.flat()) {
            if (child === null || child === undefined || child === false) continue;
            node.append(child instanceof Node ? child : document.createTextNode(String(child)));
          }
          return node;
        };
        const SVG = "http://www.w3.org/2000/svg";
        const svg = (tag, attrs = {}, ...children) => {
          const node = document.createElementNS(SVG, tag);
          for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, String(v));
          for (const child of children) node.append(child instanceof Node ? child : document.createTextNode(String(child)));
          return node;
        };

        const style = document.createElement("style");
        style.textContent = STYLE;
        document.head.append(style);

        const appTemplate = document.getElementById("app")?.cloneNode(true) ?? null;
        const root = el("section", { id: "ai-panel", "data-testid": "ai-panel", "data-seq": "0", "aria-label": title });
        const status = el("span", { class: "aip-status", "data-testid": "ai-status", "data-state": "waiting" }, "waiting…");
        root.append(el("div", { class: "aip-head" }, el("span", { class: "aip-logo" }, "AI"), el("span", { class: "aip-title", "data-testid": "ai-title" }, title), status));
        const errorsBox = el("div", { class: "aip-errors", "data-testid": "ai-errors", "data-count": "0" });
        let cards = el("div", { class: "aip-cards", "data-testid": "ai-cards", "data-count": "0" });
        root.append(errorsBox, cards);
        const consoleBody = el("div", { "data-testid": "ai-console", "data-count": "0" });
        const consoleSec = el("div", { class: "aip-sec" }, el("h2", { class: "aip-sec-title" }, "Console"), consoleBody);
        if (showConsole) root.append(consoleSec);
        function setStale(stale) {
          cards.dataset.stale = String(stale);
          consoleSec.dataset.stale = String(stale);
        }
        document.body.append(root);

        const STATUS_TEXT = { waiting: "waiting…", running: "● running…", done: "✓ done", error: "✖ error", syntax: "✖ syntax error", notice: "⚠ check the notice" };
        function setStatus(state) {
          if (status.dataset.state === state) return;
          status.dataset.state = state;
          status.textContent = STATUS_TEXT[state];
        }

        // ---------------------------------------------------------------- formatting
        export function inspect(value, depth = 0, seen = new Set()) {
          const t = typeof value;
          if (t === "string") return depth === 0 ? value : `'${value}'`;
          if (t === "number" || t === "boolean") return String(value);
          if (t === "bigint") return `${value}n`;
          if (t === "undefined") return "undefined";
          if (t === "symbol") return value.toString();
          if (t === "function") return value.toString().startsWith("class") ? `[class ${value.name || "(anonymous)"}]` : `[Function: ${value.name || "(anonymous)"}]`;
          if (value === null) return "null";
          if (value instanceof Error) return `${value.name}: ${value.message}`;
          if (value instanceof Date) return Number.isNaN(value.getTime()) ? "Invalid Date" : value.toISOString();
          if (value instanceof Promise) return "Promise { <pending> }";
          if (seen.has(value)) return "[Circular]";
          if (depth > 2) return Array.isArray(value) ? "[Array]" : "[Object]";
          seen.add(value);
          try {
            if (Array.isArray(value) || ArrayBuffer.isView(value)) {
              const list = Array.from(value);
              if (!list.length) return "[]";
              const shown = list.length > 10 ? list.slice(0, 8) : list;
              const more = list.length - shown.length;
              const items = shown.map((v) => inspect(v, depth + 1, seen));
              if (more) items.push(`... ${more} more items`);
              const prefix = ArrayBuffer.isView(value) ? `${value.constructor.name}(${list.length}) ` : "";
              return `${prefix}[ ${items.join(", ")} ]`;
            }
            if (value instanceof Map) {
              const items = [...value].map(([k, v]) => `${inspect(k, depth + 1, seen)} => ${inspect(v, depth + 1, seen)}`);
              return `Map(${value.size}) {${items.length ? ` ${items.join(", ")} ` : ""}}`;
            }
            if (value instanceof Set) {
              const items = [...value].map((v) => inspect(v, depth + 1, seen));
              return `Set(${value.size}) {${items.length ? ` ${items.join(", ")} ` : ""}}`;
            }
            const proto = Object.getPrototypeOf(value);
            const name = proto && proto !== Object.prototype && proto.constructor?.name ? `${proto.constructor.name} ` : proto === null ? "[Object: null prototype] " : "";
            const keys = Object.keys(value);
            if (!keys.length) return `${name}{}`;
            const items = keys.map((k) => `${/^[A-Za-z_$][\w$]*$/.test(k) ? k : `'${k}'`}: ${inspect(value[k], depth + 1, seen)}`);
            return `${name}{ ${items.join(", ")} }`;
          } finally {
            seen.delete(value);
          }
        }

        // Numbers on the panel and in data-* attributes: integers as they are, others to 4 places.
        const num = (v) => (Number.isInteger(v) ? String(v) : Number.isFinite(v) ? String(Number(v.toFixed(4))) : String(v));
        const pct = (v) => `${(v * 100).toFixed(1)}%`;
        const cell = (v) => (v === true ? el("span", { class: "aip-yes" }, "✓") : v === false ? el("span", { class: "aip-no" }, "✗") : typeof v === "number" ? num(v) : typeof v === "string" ? v : inspect(v, 1));
        const text = (v) => (typeof v === "string" ? v : typeof v === "number" ? num(v) : inspect(v));

        // ---------------------------------------------------------------- cards
        const PART_COLORS = {
          context: "#4dabf7", system: "#4dabf7", role: "#4dabf7",
          instruction: "#b197fc", task: "#b197fc", user: "#69db7c",
          input: "#69db7c", data: "#69db7c", assistant: "#adb5bd",
          format: "#ffa94d", output: "#ffa94d", examples: "#3bc9db", example: "#3bc9db",
          constraints: "#ff8787", rules: "#ff8787",
        };
        const SERIES_COLORS = ["#4dabf7", "#ffa94d", "#69db7c", "#da77f2"];

        function scoreList(scores) {
          if (Array.isArray(scores)) return scores.map((s) => ({ label: String(s.label), score: Number(s.score) }));
          if (scores && Array.isArray(scores.labels) && Array.isArray(scores.scores)) return scores.labels.map((l, i) => ({ label: String(l), score: Number(scores.scores[i]) }));
          return Object.entries(scores ?? {}).map(([label, score]) => ({ label, score: Number(score) }));
        }

        function promptParts(parts) {
          if (typeof parts === "string") return [{ name: "prompt", text: parts }];
          if (Array.isArray(parts)) return parts.map((m, i) => (typeof m === "string" ? { name: `part ${i + 1}`, text: m } : { name: String(m.role ?? m.name ?? `part ${i + 1}`), text: text(m.content ?? m.text ?? "") }));
          return Object.entries(parts ?? {}).filter(([, v]) => v !== undefined && v !== null && v !== "").map(([name, v]) => ({ name, text: Array.isArray(v) ? v.map((x) => `- ${text(x)}`).join("\n") : text(v) }));
        }

        function lineChart(series, xs) {
          const W = 400, H = 170, L = 34, R = 10, T = 10, B = 24;
          const names = Object.keys(series);
          const all = names.flatMap((n) => series[n].filter((v) => Number.isFinite(v)));
          const n = Math.max(...names.map((k) => series[k].length), 1);
          let lo = Math.min(...all), hi = Math.max(...all);
          if (!all.length) { lo = 0; hi = 1; }
          if (lo === hi) { lo -= 1; hi += 1; }
          const x = (i) => L + (n === 1 ? 0 : (i * (W - L - R)) / (n - 1));
          const y = (v) => T + ((hi - v) * (H - T - B)) / (hi - lo);
          const g = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
          g.append(svg("line", { x1: L, y1: H - B, x2: W - R, y2: H - B, stroke: "#3a404b" }));
          g.append(svg("text", { x: L - 4, y: T + 4, fill: "#adb5bd", "font-size": 11, "text-anchor": "end" }, num(hi)));
          g.append(svg("text", { x: L - 4, y: H - B, fill: "#adb5bd", "font-size": 11, "text-anchor": "end" }, num(lo)));
          if (xs?.length) {
            g.append(svg("text", { x: x(0), y: H - 6, fill: "#adb5bd", "font-size": 11, "text-anchor": "start" }, String(xs[0])));
            g.append(svg("text", { x: x(n - 1), y: H - 6, fill: "#adb5bd", "font-size": 11, "text-anchor": "end" }, String(xs[xs.length - 1])));
          }
          names.forEach((name, si) => {
            const color = SERIES_COLORS[si % SERIES_COLORS.length];
            const pts = series[name].map((v, i) => (Number.isFinite(v) ? [x(i), y(v)] : null)).filter(Boolean);
            g.append(svg("polyline", { points: pts.map((p) => p.map((c) => c.toFixed(1)).join(",")).join(" "), fill: "none", stroke: color, "stroke-width": 2, "stroke-dasharray": si === 0 ? "" : "5 4" }));
            for (const [px, py] of pts) g.append(svg("circle", { cx: px.toFixed(1), cy: py.toFixed(1), r: 2.5, fill: color }));
          });
          return g;
        }

        function makeApi(run) {
          const used = new Set();
          // A call whose id is already on the panel (this run) replaces that card in place: same test id,
          // same position, same card count. Click handlers use it to redraw a result after the run.
          const named = new Map();
          const card = (kind, label, opts, body, attrs = {}) => {
            if (run.dead) return null;
            const given = opts?.id != null && opts.id !== "" ? String(opts.id) : null;
            const old = given !== null ? named.get(given) : null;
            let id = given ?? String(run.count + 1);
            if (!old) {
              run.count += 1;
              if (given === null) id = String(run.count);
              while (used.has(id)) id = `${id}-${run.count}`;
              used.add(id);
            }
            const testid = `ai-${id}`;
            const node = el("div", { class: "aip-card", "data-testid": testid, "data-kind": kind, "data-label": label ?? "", ...attrs },
              el("div", { class: "aip-card-head" }, el("span", { class: "aip-kind" }, kind), label ? el("span", { class: "aip-label" }, label) : null, opts?.badge ? el("span", { class: "aip-badge", "data-testid": `${testid}-badge` }, opts.badge) : null),
              typeof body === "function" ? body(testid) : body);
            if (old) old.replaceWith(node);
            else run.add(node);
            if (given !== null && id === given) named.set(given, node);
            return node;
          };
          const value = (v) => el("div", { class: "aip-value" }, text(v));
          const panel = {
            input: (label, v, opts) => void card("input", label, opts, value(v), { "data-value": text(v) }),
            output: (label, v, opts) => void card("output", label, opts, value(v), { "data-value": text(v) }),
            note: (v, opts) => void card("note", "", opts, value(v), { "data-value": text(v) }),
            notice: (v, opts) => void card("notice", "", opts, value(v), { "data-value": text(v) }),
            scores(label, scores, opts) {
              const list = scoreList(scores).sort((a, b) => b.score - a.score);
              const top = list[0]?.label ?? "";
              card("scores", label, opts, (tid) => list.map((s, i) =>
                el("div", { class: "aip-row", "data-testid": `${tid}-${i + 1}`, "data-label": s.label, "data-score": num(s.score), "data-top": i === 0 },
                  el("span", { class: "aip-row-label" }, s.label),
                  el("span", { class: "aip-bar" }, el("span", { style: `width:${Math.max(0, Math.min(100, s.score * 100)).toFixed(1)}%` })),
                  el("span", { class: "aip-pct aip-mono" }, pct(s.score)))), { "data-top": top, "data-count": list.length });
            },
            metrics(label, values, opts) {
              const list = Object.entries(values ?? {});
              card("metrics", label, opts, (tid) => el("div", { class: "aip-tiles" }, list.map(([name, v], i) =>
                el("div", { class: "aip-tile", "data-testid": `${tid}-${i + 1}`, "data-name": name, "data-value": typeof v === "number" ? num(v) : text(v) },
                  el("div", { class: "aip-tile-name" }, name), el("div", { class: "aip-tile-value aip-mono" }, typeof v === "number" ? num(v) : text(v))))), { "data-count": list.length });
            },
            table(label, rows, opts) {
              const list = Array.isArray(rows) ? rows : Object.entries(rows ?? {}).map(([key, v]) => ({ key, value: v }));
              const columns = opts?.columns ?? [...new Set(list.flatMap((r) => (r && typeof r === "object" ? Object.keys(r) : ["value"])))];
              const shown = list.slice(0, 30);
              card("table", label, opts, (tid) => [
                el("table", { class: "aip-table" },
                  el("thead", {}, el("tr", {}, columns.map((c) => el("th", {}, c)))),
                  el("tbody", {}, shown.map((r, i) => el("tr", { "data-testid": `${tid}-${i + 1}` }, columns.map((c) => el("td", {}, cell(r && typeof r === "object" ? r[c] : r))))))),
                list.length > shown.length ? el("div", { class: "aip-foot" }, `… ${list.length - shown.length} more rows`) : null,
              ], { "data-count": list.length });
            },
            prompt(label, parts, opts) {
              const list = promptParts(parts);
              const chars = list.reduce((s, p) => s + [...p.text].length, 0);
              card("prompt", label, opts, (tid) => [
                ...list.map((p, i) => {
                  const color = PART_COLORS[p.name.toLowerCase()] ?? "#868e96";
                  return el("div", { class: "aip-part", style: `border-left-color:${color}`, "data-testid": `${tid}-${i + 1}`, "data-part": p.name },
                    el("div", { class: "aip-part-name", style: `color:${color}` }, p.name), el("div", { class: "aip-part-text" }, p.text));
                }),
                el("div", { class: "aip-foot" }, `${list.length} ${list.length === 1 ? "part" : "parts"} · ${chars} characters`),
              ], { "data-parts": list.length, "data-chars": chars });
            },
            evals(label, results, opts) {
              const list = Array.isArray(results) ? results.map((r) => ({ name: String(r.name ?? ""), pass: !!r.pass, detail: r.detail ?? "" })) : Object.entries(results ?? {}).map(([name, pass]) => ({ name, pass: !!pass, detail: "" }));
              const passed = list.filter((r) => r.pass).length;
              card("evals", label, opts, (tid) => [
                el("div", { class: "aip-summary", "data-all": passed === list.length }, `${passed} / ${list.length} passed`),
                ...list.map((r, i) => el("div", { class: "aip-eval", "data-testid": `${tid}-${i + 1}`, "data-pass": r.pass, "data-name": r.name },
                  el("span", { class: "aip-eval-mark" }, r.pass ? "✓" : "✗"),
                  el("span", {}, r.name, r.detail ? el("div", { class: "aip-eval-detail" }, text(r.detail)) : null))),
              ], { "data-passed": passed, "data-total": list.length });
            },
            chart(label, series, opts) {
              const data = Array.isArray(series) ? { value: series } : series ?? {};
              const names = Object.keys(data);
              card("chart", label, opts, () => el("div", { class: "aip-chart" }, lineChart(data, opts?.x),
                el("div", { class: "aip-legend" }, names.map((name, i) => el("span", {}, el("i", { style: `background:${SERIES_COLORS[i % SERIES_COLORS.length]}` }), `${name} · last ${num(data[name].at(-1))}`)))),
              { "data-series": names.length, "data-points": data[names[0]]?.length ?? 0, "data-last": names.map((n) => num(data[n].at(-1))).join(" ") });
            },
            // Used by course/modules-*.js: a key/value card that can be updated in place.
            model(label, info, opts) {
              let node = null;
              const render = (data) => el("dl", { class: "aip-kv" }, Object.entries(data).flatMap(([k, v]) => [el("dt", {}, k), el("dd", { "data-key": k }, text(v))]));
              node = card("model", label, opts, render(info), { "data-status": info.status ?? "" });
              return {
                set(next) {
                  if (!node || run.dead) return;
                  node.lastChild.replaceWith(render(next));
                  node.dataset.status = next.status ?? "";
                },
              };
            },
          };
          return panel;
        }

        // ---------------------------------------------------------------- console
        let consoleLines = [];
        let consoleTimer = null;
        function renderConsole() {
          consoleTimer = null;
          if (!showConsole) return;
          consoleBody.dataset.count = String(consoleLines.length);
          const rows = consoleLines.map((line, i) => el("div", { class: "aip-log aip-mono", "data-testid": `ai-log-${i + 1}`, "data-level": line.level }, line.text));
          if (!rows.length) rows.push(el("div", { class: "aip-empty" }, "Nothing printed."));
          consoleBody.replaceChildren(...rows);
        }
        const scheduleConsole = () => { if (!consoleTimer) consoleTimer = setTimeout(renderConsole, 30); };

        // ---------------------------------------------------------------- runs
        // Each report starts a new run; a run that is still awaiting (a model, a timer) when the next one
        // starts is "dead": its console lines and panel calls are dropped.
        const runs = {};
        const loaders = (window.__courseModuleLoaders ??= {});
        const loaded = {};
        window.__courseRuns = runs;
        let current = null;
        let runCounter = 0;

        function startRun() {
          if (current) current.dead = true;
          const id = ++runCounter;
          const staged = el("div", { class: "aip-cards", "data-testid": "ai-cards", "data-count": "0" });
          const run = {
            id, dead: false, count: 0, swapped: false, lines: [],
            add(node) {
              staged.append(node);
              staged.dataset.count = String(run.count);
            },
            swap() {
              if (run.swapped || run.dead) return;
              run.swapped = true;
              errorsBox.replaceChildren();
              errorsBox.dataset.count = "0";
              setStale(false);
              cards.replaceWith(staged);
              cards = staged;
              consoleLines = run.lines;
              renderConsole();
            },
            module(name) {
              if (name === "ai-panel") return { panel: run.panel, inspect };
              if (name in loaded) return loaded[name];
              throw new Error(`Cannot find module '${name}'`);
            },
          };
          const push = (level) => (...args) => {
            if (run.dead) return;
            run.lines.push({ level, text: args.map((a) => inspect(a)).join(" ") });
            if (run.lines.length > 200) run.lines.shift();
            if (run.swapped) scheduleConsole();
          };
          run.console = { log: push("log"), info: push("log"), debug: push("log"), warn: push("warn"), error: push("error"), dir: push("log"), table: push("log") };
          run.panel = makeApi(run);
          runs[id] = run;
          current = run;
          window.__coursePanel.current = run;
          return run;
        }
        window.__coursePanel = { current: null, inspect };

        function finish(run, state) {
          if (run.dead) return;
          run.swap();
          renderConsole();
          setStatus(state);
          delete runs[run.id];
        }

        // A build error keeps the last good result on screen, dimmed, under the error.
        function showBuildErrors(run, errors) {
          if (run.dead) return;
          const nodes = errors.map((e, i) => {
            const loc = e.line ? `${e.file.replace(/^src\//, "")}:${e.line}:${e.col}` : e.file;
            const caret = e.lineText && e.col ? `${e.lineText}\n${" ".repeat(Math.max(0, e.col - 1))}^` : "";
            return el("div", { class: "aip-card", "data-testid": i === 0 ? "ai-error" : `ai-error-${i + 1}`, "data-kind": "error", "data-file": e.file, "data-line": e.line },
              el("div", { class: "aip-card-head" }, el("span", { class: "aip-kind" }, "Not run"), el("span", { class: "aip-label aip-mono" }, loc)),
              el("div", { class: "aip-value" }, e.message),
              caret ? el("div", { class: "aip-value aip-mono aip-caret" }, caret) : null);
          });
          errorsBox.replaceChildren(...nodes);
          errorsBox.dataset.count = String(nodes.length);
          setStale(true);
          setStatus("syntax");
          delete runs[run.id];
        }

        async function runProgram(report) {
          const run = startRun();
          if (!report.ok) {
            showBuildErrors(run, report.errors);
            return;
          }
          setStatus("running");
          const app = document.getElementById("app");
          if (app && appTemplate) app.replaceWith(appTemplate.cloneNode(true));
          const timer = setTimeout(() => run.swap(), SWAP_MS);
          let url = null;
          try {
            for (const name of report.modules) {
              if (name === "ai-panel" || name in loaded) continue;
              if (!loaders[name]) continue;
              loaded[name] = await loaders[name]();
              if (run.dead) return;
            }
            // A superseded run whose module is still loading must not draw into the fresh #app: the guard
            // stops its top level before any of the lesson code runs.
            const prelude = `const __courseRun = globalThis.__courseRuns[${run.id}]; if (!__courseRun || __courseRun.dead) throw new Error("stale run"); const console = __courseRun.console;\n`;
            url = URL.createObjectURL(new Blob([prelude + report.code], { type: "text/javascript" }));
            await import(/* @vite-ignore */ url);
            clearTimeout(timer);
            finish(run, "done");
          } catch (error) {
            clearTimeout(timer);
            if (run.dead) return;
            if (error?.name === "CourseNotice") {
              run.panel.notice(error.message);
              finish(run, "notice");
            } else {
              run.lines.push({ level: "error", text: `Uncaught ${inspect(error)}` });
              finish(run, "error");
            }
          } finally {
            if (url) URL.revokeObjectURL(url);
          }
        }

        // ---------------------------------------------------------------- wiring
        let lastSeq = 0;
        function onReport(report) {
          if (!report || report.seq <= lastSeq) return;
          lastSeq = report.seq;
          root.dataset.seq = String(report.seq);
          runProgram(report);
        }

        if (import.meta.hot) {
          const hello = () => import.meta.hot.send(`${EVENT}:hello`, { entry });
          import.meta.hot.on(EVENT, onReport);
          import.meta.hot.on("vite:ws:connect", hello);
          hello();
        }
      course/runner.js: |
        // AI course · program runner (Vite plugin, runs in the dev server).
        // Bundles the lesson program (src/ and data/) with esbuild after every change and sends the
        // bundle, or the build errors, to the preview page (course/panel.js), which runs it and draws
        // the AI panel. The page never imports src/ through Vite, so half-typed code can never raise a
        // Vite overlay or reload the page: a syntax error shows up in the panel instead.
        import { build } from "esbuild";
        import { isAbsolute, relative, resolve } from "node:path";

        const EVENT = "course:ai";
        const DEBOUNCE_MS = 200;
        const WATCHED = /\.(m?js|json)$/;

        export default function courseRunner() {
          return {
            name: "course-ai-runner",
            apply: "serve",
            configureServer(server) {
              const root = server.config.root;
              let entry = "src/main.js";
              let seq = 0;
              let latest = null;
              let timer = null;
              let building = Promise.resolve();
              const rebuild = () => {
                building = building.then(async () => {
                  latest = await bundle(root, entry, ++seq);
                  server.ws.send({ type: "custom", event: EVENT, data: latest });
                });
                return building;
              };
              const inProgram = (file) => {
                const rel = relative(root, resolve(file));
                if (rel.startsWith("..") || isAbsolute(rel)) return false;
                return (rel.startsWith("src/") || rel.startsWith("data/")) && WATCHED.test(rel);
              };
              server.watcher.on("all", (_event, file) => {
                if (!inProgram(file)) return;
                if (timer) clearTimeout(timer);
                timer = setTimeout(() => {
                  timer = null;
                  rebuild();
                }, DEBOUNCE_MS);
              });
              server.ws.on(`${EVENT}:hello`, async (data, client) => {
                const wanted = typeof data?.entry === "string" && data.entry ? data.entry : "src/main.js";
                if (wanted !== entry || !latest) {
                  entry = wanted;
                  await rebuild();
                } else {
                  await building;
                }
                client.send(EVENT, latest);
              });
            },
          };
        }

        // Every bare import ("ai-panel", "@huggingface/transformers", …) becomes a lookup in the page's
        // module table, so the bundle has no imports left and runs from a blob: URL.
        const pageModules = {
          name: "course-page-modules",
          setup(b) {
            b.onResolve({ filter: /^[^./]/ }, (args) => ({ path: args.path, namespace: "course-page" }));
            b.onLoad({ filter: /.*/, namespace: "course-page" }, (args) => ({
              contents: `module.exports = __courseRun.module(${JSON.stringify(args.path)});`,
              loader: "js",
            }));
          },
        };

        async function bundle(root, entry, seq) {
          const started = Date.now();
          const externals = new Set();
          const collect = {
            name: "course-collect",
            setup(b) {
              b.onResolve({ filter: /^[^./]/ }, (args) => {
                externals.add(args.path);
                return undefined;
              });
            },
          };
          try {
            const result = await build({
              absWorkingDir: root,
              entryPoints: [entry],
              bundle: true,
              write: false,
              format: "esm",
              platform: "browser",
              target: "es2022",
              charset: "utf8",
              logLevel: "silent",
              loader: { ".js": "js", ".mjs": "js", ".json": "json" },
              plugins: [collect, pageModules],
            });
            return { seq, ms: Date.now() - started, entry, ok: true, code: result.outputFiles[0].text, modules: [...externals], errors: [] };
          } catch (error) {
            const errors = (error.errors ?? [{ text: String(error.message ?? error) }]).map((e) => ({
              file: e.location?.file ? relative(root, resolve(root, e.location.file)).split("\\").join("/") : entry,
              line: e.location?.line ?? 0,
              col: e.location ? e.location.column + 1 : 0,
              message: e.text,
              lineText: e.location?.lineText ?? "",
            }));
            return { seq, ms: Date.now() - started, entry, ok: false, code: "", modules: [...externals], errors };
          }
        }
