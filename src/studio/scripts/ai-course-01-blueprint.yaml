      src/main.js: |
        import { panel } from "ai-panel";
        import menu from "../data/menu.json";
        import { keywordSearch } from "./search.js";

        // What customers typed into the website's menu search (sample queries written for this lesson).
        const queries = ["မုန့်ဟင်းခါး", "milk tea", "မစပ်တဲ့ မနက်စာ", "အေးအေး ချိုချို", "laphet yay"];

        const rows = queries.map((query) => {
          const found = keywordSearch(menu.items, query).map((item) => item.name);
          return { query, found: found.length ? found.join("၊ ") : "—" };
        });
        panel.table("Menu search today", rows, { id: "search", badge: "rules · AI မပါ" });
      src/search.js: |
        // The menu search the shop's website has today: an item is found when its Burmese or
        // English name contains what the customer typed. Plain code, no AI: the same words
        // always give the same result.
        export function keywordSearch(items, query) {
          const q = query.trim().toLowerCase();
          return items.filter((item) => item.name.includes(q) || item.en.toLowerCase().includes(q));
        }
      vite.config.js: |
        import { defineConfig } from "vite";
        import courseRunner from "./course/runner.js";

        export default defineConfig({
          plugins: [courseRunner()],
        });
