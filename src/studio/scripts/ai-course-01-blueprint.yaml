      [[mark:draw-map]] course ထဲက lesson တွေကို အုပ်စု လေးစု ခွဲထားပါတယ်။ [[mark:draw-g1]] ဘာကို
      ဘာကြောင့် ဆောက်မလဲ ဆိုတဲ့ အုပ်စု၊ [[mark:draw-g2]] predictive AI နဲ့ generative AI အုပ်စု၊
      [[mark:draw-g3]] တာဝန်ယူမှုနဲ့ model ကို ဘယ်မှာ run မလဲ ဆိုတဲ့ အုပ်စု၊ [[mark:draw-g4]] နောက်ဆုံး
      prompt ရေးတာ၊ evaluation လုပ်တာ၊ U X တို့နဲ့ feature ကို ကောင်းကောင်း ဆောက်တဲ့ အုပ်စု တို့ပါ။
