      - {
          id: draw-q2,
          type: whiteboard.apply,
          at: { mark: draw-q2 },
          upsertIds: [q-2],
          drawMs: 1000,
        }
      - {
          id: draw-q3,
          type: whiteboard.apply,
          at: { mark: draw-q3 },
          upsertIds: [q-3],
          drawMs: 1000,
        }
      - {
          id: strike-hype,
          type: whiteboard.apply,
          at: { mark: strike-hype },
          upsertIds: [q-hype, q-strike],
          drawMs: 1600,
