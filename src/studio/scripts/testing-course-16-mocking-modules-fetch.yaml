      src/clock.js: |
        export const clock = { now: () => new Date() };

        export function greeting() {
          const hour = clock.now().getHours();
          return hour < 12 ? "မင်္ဂလာ နံနက်ခင်းပါ" : "မင်္ဂလာပါ";
        }
      src/clock.test.js: |
        import { afterEach, expect, test, vi } from "vitest";
        import { clock, greeting } from "./clock.js";

        const realNow = clock.now;

        // The team's guard for the shop's clock, like the one for fetch.
        test("keeps the real clock for later tests", () => {
          expect(clock.now).toBe(realNow);
        });
      src/delivery.js: |
        export function deliveryFee(km, total = 0) {
          if (km === 0) return 0;
          if (total >= 20000) return 0;
          return 1000 + 300 * Math.ceil(Math.max(0, km - 2));
        }

        export async function distanceTo(township) {
          const response = await fetch(`https://distance.example/km?to=${township}`);
          if (!response.ok) throw new Error(`no distance for ${township}`);
          const { km } = await response.json();
          return km;
        }

        export async function quoteDelivery(township, total) {
          return deliveryFee(await distanceTo(township), total);
        }
      src/delivery.test.js: |
        import { afterAll, afterEach, expect, test, vi } from "vitest";
        import { quoteDelivery } from "./delivery.js";

        const realFetch = globalThis.fetch;

        // The team added this after a stub of fetch leaked into other tests.
        test("keeps the real fetch for later tests", () => {
          expect(fetch).toBe(realFetch);
        });
      src/kitchen-ticket.js: |
        import { printTicket } from "./printer.js";

        // The counter's older code: it imports the kitchen printer itself.
        export function sendToKitchen(order) {
          const ticket = { table: order.table, item: order.item };
          printTicket(ticket);
          return ticket;
        }
      src/kitchen-ticket.test.js: |
        import { expect, test, vi } from "vitest";
        import { sendToKitchen } from "./kitchen-ticket.js";
        import { printTicket } from "./printer.js";

        test("prints the ticket for the order", () => {
          const ticket = sendToKitchen({ table: 5, item: "tea" });

          expect(printTicket).toHaveBeenCalledWith(ticket);
        });
      src/printer.js: |
        // Sends a ticket to the printer in the kitchen. The printer is plugged
        // into the shop's own computer; anywhere else it is not connected.
        export function printTicket(ticket) {
          throw new Error("the kitchen printer is not connected");
        }
