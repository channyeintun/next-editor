scenes:
  - id: open
    chapter: "Dependency ကို နေရာမှာတင် အစားထိုး"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ test double မိသားစုကို တွေ့ခဲ့ပြီး၊ dependency ကို အပြင်ကနေ လက်ခံတဲ့ code ဆိုရင် test ကနေ vi fn လို double ကို ထည့်ပေးရုံနဲ့ ရတာကို မြင်ခဲ့ပါတယ်။ ဒါပေမဲ့ code အားလုံးက ဒီလို ရေးထားတာ
      မဟုတ်ပါဘူး။ တချို့ code က module ကို ကိုယ်တိုင် import လုပ်ထားပြီး၊ တချို့က fetch လို global ကို
      တိုက်ရိုက် ခေါ်ပါတယ်။ ဒီ lesson မှာ အဲဒီလို dependency တွေကို နေရာမှာတင် အစားထိုးနည်း
      သုံးမျိုးကို ကြည့်ပါမယ်။ [[mark:draw-module]] ပထမ နည်းက module တစ်ခုလုံးကို အစားထိုးတာပါ။ vi mock က ဖိုင်တစ်ခုကို import လုပ်သမျှ နေရာတိုင်းမှာ ကိုယ် ပေးတဲ့ အတုကို ရအောင် လုပ်ပေးပါတယ်။ ဆိုလိုတာက ဆိုင်ရဲ့ code ကို တစ်လုံးမှ မပြင်ဘဲ module ကို လဲပေးနိုင်တာပါ။
      [[mark:draw-global]] ဒုတိယ နည်းက global ကို အစားထိုးတာပါ။ fetch က browser မှာရော Node မှာပါ
      အသင့် ပါလာတဲ့ global function ဖြစ်လို့၊ code က ဘယ်ကမှ မယူဘဲ တိုက်ရိုက် ခေါ်ပါတယ်။ အဲဒီလို global
      ကို stub Global နဲ့ ခဏ လဲထားနိုင်ပါတယ်။ [[mark:draw-method]] တတိယ နည်းကတော့ object ရဲ့ method တစ်ခုတည်းကို
      spy On နဲ့ အစားထိုးတာပါ။ ဥပမာ clock ရဲ့ အချိန်ကို ပြန်ပေးတဲ့ method တစ်ခုတည်းကိုပဲ လဲပြီး၊ object ရဲ့ ကျန်တဲ့ အပိုင်းတွေကတော့ မူလအတိုင်းပဲ ကျန်ပါတယ်။
      [[mark:draw-undo]] ဒီ နည်းတွေမှာ စည်းကမ်း တစ်ခု ပါပါတယ်။ stub လုပ်ထားတဲ့ global နဲ့ spy လုပ်ထားတဲ့
      method ကို test တစ်ခု ပြီးတိုင်း ပြန်ဖြုတ်ရပါမယ်။ မဖြုတ်ရင် နောက်က test တွေက အတုကို ဆက်မြင်နေမှာ ဖြစ်ပြီး၊ ဒီ lesson ထဲက
      ပြဿနာ အများစုက အဲဒီကနေ လာတာပါ။ [[mark:close-board]] ဆိုင်ရဲ့ code ကနေ စကြည့်ရအောင်။ ဒါက ဆိုင်ရဲ့ ကောင်တာက အော်ဒါကို မီးဖိုချောင်ဆီ ပို့ပေးတဲ့ code အဟောင်းပါ။ [[mark:select-import]] ဒီ ဖိုင်က
      ပြီးခဲ့တဲ့ lesson က kitchen လို printer ကို argument နဲ့ မလက်ခံဘဲ၊ printer ဖိုင်ကနေ ကိုယ်တိုင်
      import လုပ်ထားပါတယ်။ [[mark:select-call]] ဒါကြောင့် ဒီ line က အမြဲ printer အစစ်ကိုပဲ ခေါ်ပြီး၊
      test ကနေ အတုကို ထည့်ပေးစရာ နေရာ မရှိပါဘူး။ [[mark:open-test]] ဒါကတော့ သူ့ရဲ့ test ဖိုင်ပါ။ စားပွဲ
      နံပါတ် ၅ ရဲ့ လက်ဖက်ရည်ကို ပို့ပြီး၊ [[mark:select-assert]] printer ကို ပြန်ရလာတဲ့ စာရွက်နဲ့
      ခေါ်ခဲ့လားလို့ စစ်ထားပါတယ်။ test ဖိုင်ကလည်း printer ဖိုင်ကို import လုပ်ထားပေမဲ့၊ အခုအချိန်မှာ
      ဒါက printer အစစ် ဖြစ်နေပါသေးတယ်။
    sources:
      - {
          title: "web.dev Learn Testing: Component testing in practice, Mock imports",
          url: "https://web.dev/learn/testing/get-started/component-testing#mock_imports",
        }
      - { title: "Vitest: Mocking (cheat sheet)", url: "https://vitest.dev/guide/mocking" }
      - { title: "Vitest: Mocking Globals", url: "https://vitest.dev/guide/mocking/globals" }
      - { title: "Vitest: vi.spyOn", url: "https://vitest.dev/api/vi#vi-spyon" }
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 300000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-module
        type: whiteboard.apply
        at: { mark: draw-module }
        upsertIds: [a-rows-box, a-mod, a-mod-tool]
        drawMs: 2500
      - id: draw-global
        type: whiteboard.apply
        at: { mark: draw-global }
        upsertIds: [a-glob, a-glob-tool]
        drawMs: 2000
      - id: draw-method
        type: whiteboard.apply
        at: { mark: draw-method }
        upsertIds: [a-meth, a-meth-tool]
        drawMs: 2000
      - id: draw-undo
        type: whiteboard.apply
        at: { mark: draw-undo }
        upsertIds: [a-undo-box, a-undo-1, a-undo-2]
        drawMs: 2500
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: select-import
        type: editor.select
        at: { mark: select-import }
        target:
          {
            file: src/kitchen-ticket.js,
            text: 'import { printTicket } from "./printer.js";',
            occurrence: 1,
          }
      - id: select-call
        type: editor.select
        at: { mark: select-call }
        target: { file: src/kitchen-ticket.js, text: "printTicket(ticket);", occurrence: 1 }
      - id: open-test
        type: workspace.openFile
        at: { mark: open-test }
        path: src/kitchen-ticket.test.js
      - id: select-assert
        type: editor.select
        at: { mark: select-assert }
        target:
          {
            file: src/kitchen-ticket.test.js,
            text: "expect(printTicket).toHaveBeenCalledWith(ticket);",
            occurrence: 1,
          }

  - id: panel
    narration: >
      [[mark:ready]] code ပြောင်းတိုင်း Vitest က သူ့ဘာသာ ပြန် run တဲ့ panel ကို ကြည့်ရအောင်။
      [[mark:read-red]] ပြီးခဲ့တဲ့ lesson ကလိုပဲ၊ printer ကို ချိတ်မထားဘူး ဆိုတဲ့ error နဲ့ ဒီ test က fail
      ဖြစ်နေပါတယ်။ code frame ရဲ့ အောက်မှာလည်း ကောင်တာရဲ့ function ကနေ printer အစစ်ကို ခေါ်သွားတဲ့
      လမ်းကြောင်းကို ပြနေပါတယ်။ [[mark:read-guards]] ကျန်တဲ့ test ဖိုင် နှစ်ဖိုင်မှာတော့ fetch နဲ့ clock ကို
      အတုနဲ့ လဲထားခဲ့ရင် ဖမ်းပေးဖို့ team က ထည့်ထားတဲ့ guard test တွေ ရှိပြီး၊ အခုတော့ pass
      ဖြစ်နေပါတယ်။ သူတို့ကို နောက်မှ ကြည့်ပါမယ်။
    sources:
      - {
          title: "Vitest: Writing Tests, reading test output",
          url: "https://vitest.dev/guide/learn/writing-tests#reading-test-output",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-start-fail
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 3, delayMs: 1000 }
      - id: expect-start-count
        type: expect.preview
        at: { afterAction: expect-start-fail }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "2" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-message
        type: expect.preview
        at: { afterAction: expect-start-count }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-message, value: "the kitchen printer is not connected" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-test
        type: expect.preview
        at: { afterAction: expect-start-message }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-3 }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: vi-mock
    chapter: "vi.mock နဲ့ module တစ်ခုလုံး"
    narration: >
      [[mark:type-mock]] printer ဖိုင် တစ်ခုလုံးကို vi mock နဲ့ အစားထိုးပါမယ်။ ပထမ argument က
      အစားထိုးမယ့် module ရဲ့ လမ်းကြောင်း ဖြစ်ပြီး၊ ဒုတိယ argument ကတော့ module အတုကို ဆောက်ပေးတဲ့
      factory function ပါ။ factory က module ရဲ့ export တွေကို နာမည်လိုက် ထည့်ထားတဲ့ object ကို
      ပြန်ပေးရပြီး၊ ဒီမှာ printer ရဲ့ function နေရာမှာ mock function တစ်ခု ထည့်ထားပါတယ်။
      [[mark:read-mock-green]] panel ကို ကြည့်ပါ။ test သုံးခုလုံး pass ဖြစ်ပြီး အစိမ်းရောင် PASS
      ပေါ်လာပါပြီ။ vi mock ကို import တွေရဲ့ အောက်မှာ ရေးထားပေမဲ့၊ Vitest က ဖိုင်ကို run တဲ့အခါ သူ့ကို
      ဖိုင်ရဲ့ ထိပ်ဆုံးကို အရင် ရွှေ့ပြီးမှ import တွေကို လုပ်ပါတယ်။ ဒါကြောင့် test ဖိုင်ရော ကောင်တာရဲ့ ဖိုင်ပါ printer အတုကိုပဲ ရသွားတာပါ။ ဒီ အစားထိုးမှုက ဒီ test ဖိုင်အတွက်ပဲ ဖြစ်ပြီး၊ တခြား test
      ဖိုင်တွေကတော့ သီးခြား run လို့ printer အစစ်ကိုပဲ မြင်ပါတယ်။ [[mark:board-hoist]] ဒီလို အပေါ်ကို
      ရွှေ့ပြီး run တဲ့အတွက်ပဲ၊ vi mock ကို describe ဒါမှမဟုတ် test ရဲ့ အထဲမှာ ရေးလို့ မရပါဘူး။
      [[mark:draw-hoist]] Vitest ၅ ကစပြီး ဒီလို ရေးရင် ဖိုင်တစ်ခုလုံး Failed Suite ဖြစ်ပြီး၊ ထိပ်ဆုံး
      အဆင့်မှာ မရေးထားဘူး ဆိုတဲ့ error ကို ပြပါတယ်။ အရင် version တွေမှာ warning ပဲ ပြခဲ့လို့ code
      ဟောင်းတွေမှာ ဒီလို တွေ့ရနိုင်ပါတယ်။ ဒါကြောင့် vi mock ကို import တွေရဲ့ အောက်၊ ဖိုင်ရဲ့ ထိပ်ဆုံး
      အဆင့်မှာပဲ ရေးပါ။
    sources:
      - { title: "Vitest: vi.mock", url: "https://vitest.dev/api/vi#vi-mock" }
      - {
          title: "Vitest: Mocking Modules, how it works",
          url: "https://vitest.dev/guide/mocking/modules#how-it-works",
        }
      - {
          title: "Vitest: Migration guide 5.0, vi.mock at the top level (facts A17)",
          url: "https://vitest.dev/guide/migration/",
        }
      - {
          title: "Vitest: Migrating from Jest, the factory returns the exports (facts A27)",
          url: "https://vitest.dev/guide/migration/jest",
        }
    actions:
      - id: type-mock
        type: editor.type
        at: { mark: type-mock }
        target:
          {
            file: src/kitchen-ticket.test.js,
            after: "import { printTicket } from \"./printer.js\";\n",
            occurrence: 1,
          }
        text: "\nvi.mock(\"./printer.js\", () => ({ printTicket: vi.fn() }));\n"
      - id: expect-mock-green
        type: expect.preview
        at: { afterAction: type-mock }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-mock-count
        type: expect.preview
        at: { afterAction: expect-mock-green }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "3" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-mock-file
        type: expect.file
        at: { afterAction: expect-mock-count }
        path: src/kitchen-ticket.test.js
        contains: "import { printTicket } from \"./printer.js\";\n\nvi.mock(\"./printer.js\", () => ({ printTicket: vi.fn() }));\n"
      - id: board-hoist
        type: whiteboard.apply
        at: { mark: board-hoist }
        open: true
        clear: true
        upsertIds: [b-title, b-bad-box, b-bad-1, b-bad-2, b-bad-3]
        drawMs: 2500
      - id: draw-hoist
        type: whiteboard.apply
        at: { mark: draw-hoist }
        upsertIds: [b-err-1, b-err-2, b-good, b-hoist]
        drawMs: 4000

  - id: stub-global
    chapter: "vi.stubGlobal နဲ့ fetch"
    narration: >
      ပို့ခ တွက်တဲ့ delivery ဖိုင်ကို ကြည့်ရအောင်။ [[mark:open-delivery]] ဒီ function က မြို့နယ် တစ်ခု
      ဘယ်လောက် ဝေးလဲ ဆိုတာကို distance service ဆီ fetch နဲ့ မေးပါတယ်။ test ထဲကနေ ဒီ service ကို တကယ်
      မေးရင် နှေးပြီး၊ အင်တာနက် မရှိရင် ကျပါလိမ့်မယ်။ [[mark:select-ok]] response ok မဟုတ်ရင် error
      throw လုပ်ပြီး၊ ok ဖြစ်မှ json ထဲက ကီလိုမီတာကို ယူပါတယ်။ [[mark:open-delivery-test]] test
      ဖိုင်ကိုလည်း ကြည့်ပါ။ [[mark:select-guard]] ဒီ guard test ကို fetch ရဲ့ stub တစ်ခု တခြား test
      တွေထဲ ပါသွားခဲ့ပြီးနောက် team က ထည့်ထားတာပါ။ fetch က အစစ် ဖြစ်နေရမယ်လို့ စစ်ပြီး၊ ရှေ့က test တွေ
      fetch ကို ပြန်ဖြုတ်ခဲ့လား စောင့်ကြည့်ပေးပါတယ်။ [[mark:type-bahan]] ဗဟန်းကို ပို့ရင် ၁၃၀၀ ကျပ်
      ဖြစ်ရမယ် ဆိုတဲ့ test ကို guard test ရဲ့ အပေါ်မှာ ထည့်ပါမယ်။ [[mark:select-stub]] stub Global က
      global fetch ကို mock function နဲ့ လဲထားပြီး၊ mock function က ကိုယ် ဆောက်ထားတဲ့ response ကို
      ပြန်ပေးပါတယ်။ [[mark:select-response]] ဒီ response မှာ json တစ်ခုတည်းပဲ ပါပါတယ်။ ကိုယ်တိုင်
      ဆောက်တဲ့ response မှာ code က ဖတ်တဲ့ အရာ အကုန် ပါရမယ် ဆိုတာ ပြချင်လို့ တမင် ဒီလို ရေးထားတာပါ။
      [[mark:read-no-ok]] panel မှာ test နှစ်ခု fail ဖြစ်နေပါတယ်။ ပထမ တစ်ခုက ဗဟန်း test ဖြစ်ပြီး၊
      ဗဟန်းအတွက် အကွာအဝေး မရဘူး ဆိုတဲ့ error ပါ။ response မှာ ok မပါလို့ undefined ဖြစ်နေပြီး၊ code က
      request မအောင်ဘူးလို့ ယူဆလိုက်တာပါ။ guard test ကလည်း fail ဖြစ်နေပေမဲ့ နောက်မှ ပြန်ကြည့်ပါမယ်။
      [[mark:type-ok]] response ထဲကို ok true ထည့်ပါမယ်။ ဒါဆို code က request အောင်တယ်လို့ ယူဆပြီး၊
      json ထဲက ကီလိုမီတာကို ဆက်ဖတ်ပါလိမ့်မယ်။
    sources:
      - {
          title: "web.dev Learn Testing: Component testing in practice, Mock fetch() (facts B02, B15)",
          url: "https://web.dev/learn/testing/get-started/component-testing#mock_fetch",
        }
      - {
          title: "Vitest: vi.stubGlobal and vi.unstubAllGlobals",
          url: "https://vitest.dev/api/vi#vi-stubglobal",
        }
      - {
          title: "Vitest: unstubGlobals (facts A11)",
          url: "https://vitest.dev/config/unstubglobals",
        }
      - {
          title: "Vitest: Mocking Requests, Mock Service Worker (facts B15)",
          url: "https://vitest.dev/guide/mocking/requests",
        }
    actions:
      - id: close-hoist
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-delivery
        type: workspace.openFile
        at: { mark: open-delivery }
        path: src/delivery.js
      - id: select-fetch
        type: editor.select
        at: { afterAction: open-delivery }
        target: { file: src/delivery.js, text: "const response = await fetch(", occurrence: 1 }
      - id: select-ok
        type: editor.select
        at: { mark: select-ok }
        target: { file: src/delivery.js, text: "if (!response.ok)", occurrence: 1 }
      - id: open-delivery-test
        type: workspace.openFile
        at: { mark: open-delivery-test }
        path: src/delivery.test.js
      - id: select-guard
        type: editor.select
        at: { mark: select-guard }
        target:
          { file: src/delivery.test.js, text: "expect(fetch).toBe(realFetch);", occurrence: 1 }
      - id: type-bahan
        type: editor.type
        at: { mark: type-bahan }
        target:
          {
            file: src/delivery.test.js,
            after: "const realFetch = globalThis.fetch;\n",
            occurrence: 1,
          }
        text: "\ntest(\"quotes 1300 to Bahan\", async () => {\n  const response = {\n    json: async () => ({ km: 3 }),\n  };\n  vi.stubGlobal(\"fetch\", vi.fn().mockResolvedValue(response));\n\n  const fee = await quoteDelivery(\"bahan\", 5000);\n\n  expect(fee).toBe(1300);\n  expect(fetch).toHaveBeenCalledWith(\n    \"https://distance.example/km?to=bahan\",\n  );\n});\n"
        cadence: block
      - id: expect-bahan-red
        type: expect.preview
        at: { afterAction: type-bahan }
        timeoutMs: 8000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-failed, value: "2" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-bahan-message
        type: expect.preview
        at: { afterAction: expect-bahan-red }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-message, value: "no distance for bahan" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-bahan-leak
        type: expect.preview
        at: { afterAction: expect-bahan-message }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-2 }
        attribute:
          {
            name: data-message,
            value: "expected [Function Mock] to be [Function fetch] // Object.is equality",
          }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-stub
        type: editor.select
        at: { mark: select-stub }
        target:
          {
            file: src/delivery.test.js,
            text: 'vi.stubGlobal("fetch", vi.fn().mockResolvedValue(response));',
            occurrence: 1,
          }
      - id: select-response
        type: editor.select
        at: { mark: select-response }
        target:
          { file: src/delivery.test.js, text: "json: async () => ({ km: 3 }),", occurrence: 1 }
      - id: type-ok
        type: editor.type
        at: { mark: type-ok }
        target: { file: src/delivery.test.js, after: "  const response = {\n    ", occurrence: 1 }
        text: "ok: true,\n    "
      - id: expect-ok-pass
        type: expect.preview
        at: { afterAction: type-ok }
        timeoutMs: 8000
        target: { by: testId, value: vt-test-2 }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-ok-count
        type: expect.preview
        at: { afterAction: expect-ok-pass }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-failed, value: "1" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-ok-leak
        type: expect.preview
        at: { afterAction: expect-ok-count }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-actual, value: "[Function Mock]" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-ok-diff
        type: expect.preview
        at: { afterAction: expect-ok-leak }
