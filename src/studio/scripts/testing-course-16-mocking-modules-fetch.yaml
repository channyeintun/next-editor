  - id: unstub
    narration: >
      panel ကို ပြန်ကြည့်ပါ။ ဗဟန်း test က pass ဖြစ်သွားပြီး၊ fetch ကို ဗဟန်းရဲ့ URL နဲ့ ခေါ်ခဲ့လား
      ဆိုတာကိုလည်း စစ်ပြီးပါပြီ။ ဒါပေမဲ့ guard test ကတော့ fail ဖြစ်နေတုန်းပါ။ fetch အစစ် ဖြစ်ရမယ့်
      နေရာမှာ mock function ကို ရနေတယ်လို့ ပြောနေပြီး၊ Expected မှာ fetch အစစ်ကို အစိမ်းရောင်နဲ့၊
      Received မှာ Mock ကို အနီရောင်နဲ့ ပြထားပါတယ်။ ဆိုလိုတာက ဗဟန်း test က ထားခဲ့တဲ့ stub ဟာ နောက်
      test ထဲအထိ ပါသွားနေတာပါ။ [[mark:type-after-all]] stub တွေကို ပြန်ဖြုတ်ဖို့ unstub All Globals ကို
      သုံးပါတယ်။ အွန်လိုင်းပေါ်က ဥပမာ တချို့မှာ ဒါကို test အားလုံး ပြီးမှ run တဲ့ after All ထဲမှာ
      ထည့်ထားတာ တွေ့ရလို့ အဲဒီအတိုင်း ထည့်ကြည့်ပါမယ်။ [[mark:read-still]] guard test က fail
      ဖြစ်နေတုန်းပါပဲ။ code frame ရဲ့ line နံပါတ်ပဲ နှစ်ကြောင်း ဆင်းသွားပြီး၊ message ကတော့ အတူတူပါ။
      ဘာကြောင့်လဲဆိုတော့၊ after All က ဒီ ဖိုင်ထဲက test အားလုံး ပြီးမှ တစ်ခါ run တာ ဖြစ်လို့၊ guard
      test run နေချိန်မှာ stub က ရှိနေတုန်းမို့ပါ။ [[mark:type-after-each]] ဒါကြောင့် ဒီ line ကို test
      တစ်ခု ပြီးတိုင်း run တဲ့ after Each နဲ့ အစားထိုးပြီး၊ line အဟောင်းကို comment အဖြစ်
      ချန်ထားပါမယ်။ [[mark:read-unstubbed]] panel ကို ကြည့်ပါ။ test လေးခုလုံး pass ဖြစ်ပြီး၊ PASS
      ပြန်ဖြစ်သွားပါပြီ။ project တစ်ခုလုံးအတွက်ဆိုရင် config ထဲမှာ unstub Globals ဆိုတဲ့ option ကို
      ဖွင့်လို့ ရပြီး၊ နောက်ပိုင်း config lesson မှာ ကြည့်ပါမယ်။ request တွေ များလာရင်တော့ ဒီလို
      လက်နဲ့ stub လုပ်တာ ထိန်းရ ခက်လာလို့၊ Mock Service Worker လို request တွေကို intercept လုပ်ပေးတဲ့
      library ကို သုံးကြပါတယ်။
    sources:
      - {
          title: "web.dev Learn Testing: Component testing in practice, undoing the fetch mock (facts B02)",
          url: "https://web.dev/learn/testing/get-started/component-testing#mock_fetch",
        }
      - {
          title: "Vitest: vi.unstubAllGlobals",
          url: "https://vitest.dev/api/vi#vi-unstuballglobals",
        }
      - {
          title: "Vitest: unstubGlobals (facts A11)",
          url: "https://vitest.dev/config/unstubglobals",
        }
      - {
          title: "Vitest: Mocking Requests, Mock Service Worker (facts B15)",
          url: "https://vitest.dev/guide/mocking/requests",
        }
    actions:
      - id: type-after-all
        type: editor.type
        at: { mark: type-after-all }
        target:
          {
            file: src/delivery.test.js,
            after: "const realFetch = globalThis.fetch;\n",
            occurrence: 1,
          }
        text: "\nafterAll(() => vi.unstubAllGlobals());\n"
      - id: expect-after-all
        type: expect.preview
        at: { afterAction: type-after-all }
        timeoutMs: 8000
        target: { by: testId, value: vt-frame-1 }
        attribute: { name: data-line, value: "25" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-after-all-still
        type: expect.preview
        at: { afterAction: expect-after-all }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute:
          {
            name: data-message,
            value: "expected [Function Mock] to be [Function fetch] // Object.is equality",
          }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: type-after-each
        type: editor.type
        at: { mark: type-after-each }
        target:
          {
            file: src/delivery.test.js,
            after: "const realFetch = globalThis.fetch;\n\n",
            occurrence: 1,
          }
        text: "afterEach(() => vi.unstubAllGlobals());\n// "
      - id: expect-after-each
        type: expect.preview
        at: { afterAction: type-after-each }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-after-each-count
        type: expect.preview
        at: { afterAction: expect-after-each }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "4" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-delivery-file
        type: expect.file
        at: { afterAction: expect-after-each-count }
        path: src/delivery.test.js
        contains: "afterEach(() => vi.unstubAllGlobals());\n// afterAll(() => vi.unstubAllGlobals());\n"

  - id: spy-on
    chapter: "vi.spyOn နဲ့ method တစ်ခု"
    narration: >
      [[mark:open-clock]] နောက်ဆုံး နည်းကို ဆိုင်ရဲ့ နှုတ်ဆက်စာနဲ့ ကြည့်ရအောင်။ [[mark:select-hour]] ဒီ line က clock ရဲ့ method ကနေ အခု အချိန်ကို ယူပြီး၊ နေ့လယ် ၁၂ နာရီ မတိုင်ခင်ဆိုရင် မင်္ဂလာ နံနက်ခင်းပါ လို့ နှုတ်ဆက်ပါတယ်။ ဒါကြောင့် ဒီအတိုင်း test လုပ်ရင်၊ test run တဲ့ အချိန်ပေါ် မူတည်ပြီး အဖြေ ပြောင်းသွားပါလိမ့်မယ်။ [[mark:open-clock-test]] test ဖိုင်မှာလည်း fetch လိုပဲ clock အတွက် guard
      test တစ်ခု ရှိပါတယ်။ [[mark:type-spy]] သူ့အပေါ်မှာ မနက် ၉ နာရီ အတွက် test ကို ထည့်ပါမယ်။ ဆိုင်ရဲ့ code ကို မပြင်ဘဲ၊ test ထဲမှာပဲ အချိန်ကို ထိန်းမှာပါ။
      [[mark:select-spy]] spy On က object ရဲ့ method တစ်ခုကို mock function နဲ့ လဲပေးပြီး၊ ဒီမှာ mock
      Return Value နဲ့ မနက် ၉ နာရီကို ပြန်ပေးခိုင်းထားပါတယ်။ [[mark:read-spy]] နှုတ်ဆက်စာ test က pass
      ဖြစ်ပေမဲ့၊ clock အတွက် guard test ကတော့ fail ဖြစ်သွားပါပြီ။ message မှာ now ဆိုတဲ့ function နှစ်ခု တူရမယ်လို့ ပြောပြီး၊ ကြည့်ရတာ ဘာမှ မကွာဘူးလို့တောင် ပြောနေပါတယ်။ spy က method ရဲ့ နာမည်ကို ယူထားလို့ နာမည်ချင်း
      တူပေမဲ့၊ function ချင်းကတော့ မတူပါဘူး။ spy On နဲ့ လဲထားတာက ပြန်မဖြုတ်မချင်း ဆက်ရှိနေတာပါ။
      [[mark:type-restore]] ဒါကြောင့် test တစ်ခု ပြီးတိုင်း restore All Mocks နဲ့ spy တွေကို မူလ method ဆီ ပြန်ပို့ပါမယ်။ fetch အတွက် ခုနက ထည့်ခဲ့တဲ့ after Each နဲ့ ပုံစံ အတူတူပါပဲ။ [[mark:read-restored]] panel ကို ကြည့်ပါ။ test ငါးခုလုံး pass ဖြစ်ပါပြီ။ spy တစ်ခုတည်းကို
      ဆိုရင် mock Restore နဲ့ ပြန်ဖြုတ်လို့ ရပြီး၊ project တစ်ခုလုံးအတွက်ဆိုရင် restore Mocks ဆိုတဲ့
      option ရှိပါတယ်။ Vitest ရဲ့ AI နဲ့ test ရေးတဲ့ guide ကလည်း AI ရေးပေးတဲ့ test တွေမှာ spy ကို
      ပြန်ဖြုတ်ဖို့ မေ့ကျန်တာ မကြာခဏ တွေ့ရတယ်လို့ ဆိုပြီး၊ ဒီ option ကို ဖွင့်ထားဖို့ အကြံပြုထားပါတယ်။
    sources:
      - {
          title: "Vitest: vi.spyOn and vi.restoreAllMocks",
          url: "https://vitest.dev/api/vi#vi-spyon",
        }
      - { title: "Vitest: mockRestore", url: "https://vitest.dev/api/mock#mockrestore" }
      - { title: "Vitest: restoreMocks (facts A10)", url: "https://vitest.dev/config/restoremocks" }
      - {
          title: "Vitest: Writing Tests with AI, mock cleanup (facts D17)",
          url: "https://vitest.dev/guide/learn/writing-tests-with-ai#mock-cleanup",
        }
    actions:
      - id: open-clock
        type: workspace.openFile
        at: { mark: open-clock }
        path: src/clock.js
      - id: select-hour
        type: editor.select
        at: { mark: select-hour }
        target: { file: src/clock.js, text: "const hour = clock.now().getHours();", occurrence: 1 }
      - id: open-clock-test
        type: workspace.openFile
        at: { mark: open-clock-test }
        path: src/clock.test.js
      - id: type-spy
        type: editor.type
        at: { mark: type-spy }
        target: { file: src/clock.test.js, after: "const realNow = clock.now;\n", occurrence: 1 }
        text: "\ntest(\"greets in the morning\", () => {\n  const nine = new Date(2026, 10, 5, 9, 0);\n  vi.spyOn(clock, \"now\").mockReturnValue(nine);\n\n  expect(greeting()).toBe(\"မင်္ဂလာ နံနက်ခင်းပါ\");\n});\n"
        cadence: block
      - id: expect-spy-red
        type: expect.preview
        at: { afterAction: type-spy }
        timeoutMs: 8000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-total, value: "5" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-spy-test
        type: expect.preview
        at: { afterAction: expect-spy-red }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-1 }
        attribute: { name: data-name, value: "greets in the morning" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-spy-leak
        type: expect.preview
        at: { afterAction: expect-spy-test }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute:
          {
            name: data-message,
            value: "expected [Function now] to be [Function now] // Object.is equality",
          }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-spy-diff
        type: expect.preview
        at: { afterAction: expect-spy-leak }
        timeoutMs: 5000
        target: { by: testId, value: vt-diff-1 }
        textContains: "no visual difference"
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-spy
        type: editor.select
        at: { mark: select-spy }
        target:
          {
            file: src/clock.test.js,
            text: 'vi.spyOn(clock, "now").mockReturnValue(nine);',
            occurrence: 1,
          }
      - id: type-restore
        type: editor.type
        at: { mark: type-restore }
        target: { file: src/clock.test.js, after: "const realNow = clock.now;\n", occurrence: 1 }
        text: "\nafterEach(() => vi.restoreAllMocks());\n"
      - id: expect-restored
        type: expect.preview
        at: { afterAction: type-restore }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-restored-count
        type: expect.preview
        at: { afterAction: expect-restored }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "5" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-clock-file
        type: expect.file
        at: { afterAction: expect-restored-count }
        path: src/clock.test.js
        contains: "afterEach(() => vi.restoreAllMocks());"

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ dependency ကို argument နဲ့ ထည့်ပေးလို့ မရတဲ့ code မှာ၊ module တစ်ခုလုံးကို
      vi mock နဲ့၊ fetch လို global ကို stub Global နဲ့၊ method တစ်ခုကို spy On နဲ့ နေရာမှာတင်
      အစားထိုးနိုင်ပါတယ်။ vi mock ကို ဖိုင်ရဲ့ ထိပ်ဆုံး အဆင့်မှာပဲ ရေးပြီး၊ ကိုယ်တိုင် ဆောက်တဲ့
      response မှာ code က ဖတ်တဲ့ အရာ အကုန် ပါရပါမယ်။ [[mark:recap-undo]] အရေးအကြီးဆုံးကတော့
      stub နဲ့ spy တွေကို test တစ်ခု ပြီးတိုင်း after Each နဲ့ ပြန်ဖြုတ်ဖို့ပါ။ နောက် lesson မှာတော့
      အချိန်ကို မှီခိုတဲ့ code ကို fake timers နဲ့ ထိန်းပြီး test လုပ်နည်းကို ကြည့်သွားပါမယ်။
    sources:
      - { title: "Vitest: Mocking", url: "https://vitest.dev/guide/mocking" }
      - {
          title: "Vitest: Mocking Timers (next lesson)",
          url: "https://vitest.dev/guide/mocking/timers",
        }
    actions: []
checks:
  - { type: timing.p95Ms, max: 300 }
