build:
  # Studio swaps in the Burmese voice chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 2608

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: hook
    chapter: အတည်ပြုချက် မပေါ်တဲ့ Top-up
    narration: >
      [[mark:show-p01]] Eats order တွေ ရပ်ခဲ့ပြီးနောက် Padauk က service level objective၊ SLO လို့ ခေါ်တဲ့ သဘောတူ ပစ်မှတ် နှစ်မျိုး ထပ်ထည့်ထားပါတယ်။ order တစ်ခုကို အစအဆုံး တိုင်းတဲ့ journey SLO နဲ့ အကြီးဆုံး merchant ၁၀ ခုအတွက် SLO တွေပါ။ ဒီတစ်ပတ်မှာတော့ top-up လုပ်ရင် app က loading လည်နေရုံပဲ ဖြစ်ပြီး ဖုန်းဘေလ် ဝင်ပြီ ဆိုတဲ့ အတည်ပြုချက် ဘယ်တော့မှ မပေါ်ပါဘူး။
      [[mark:hook-refunds]] စောင့်မနေနိုင်တဲ့ user တွေက ဖုန်းကတ် ဝယ်ဖြည့်ပြီး refund တောင်းကြပေမဲ့ အဲဒီ top-up တွေက တကယ်တော့ ဘေလ် ဝင်ပြီးသားပါ။ API က success code ပြန်ပေးပြီး dashboard တိုင်းကလည်း အစိမ်းရောင်ချည်းပါ။ system ရဲ့ အထဲကို ဘယ်လို မြင်မလဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "OpenTelemetry: Observability primer",
          url: "https://opentelemetry.io/docs/concepts/observability-primer/",
        }
      - {
          title: "SRE book, 1st ed: Monitoring Distributed Systems",
          url: "https://sre.google/sre-book/monitoring-distributed-systems/",
        }
    actions:
      # -1750 / -1450, as in Module 1: a pull-back over 1780 ms pushes the first dialog
      # past the 2 s opening handle, which src/studio/plans/index.test.ts rejects.
      - { id: collapse-dock, type: runtime.collapseDock, at: { scene: start, offsetMs: -1750 } }
      - {
          id: show-p01,
          type: slide.show,
          at: { mark: show-p01, offsetMs: -1450 },
          slideId: l08-p01,
        }

  - id: monitoring-vs-observability
    chapter: Monitoring နဲ့ observability
    narration: >
      [[mark:show-p01b]] မသီရိက graph တွေကို တစ်ခုပြီး တစ်ခု ဖွင့်ကြည့်၊ log တွေကို လက်နဲ့ လိုက်ဖတ်ပြီး senior တွေကိုလည်း ဖုန်းဆက် မေးရပါတယ်။ ဒါပေမဲ့ အကြောင်းရင်း ရှာတွေ့တော့ user တွေ ဒုက္ခရောက်နေတာ ၂ ရက် ကြာနေပါပြီ။
      [[mark:show-p02]] Padauk မှာ ရှိခဲ့တာက monitoring ပါ။ ကြိုရွေးထားတဲ့ ကိန်းဂဏန်းတွေကို dashboard မှာ ဆွဲထားပြီး ပျက်နေလား ဆိုတာကို ဖြေပေးပါတယ်။ ဘယ်လို၊ ဘယ်မှာ၊ ဘာကြောင့် ပျက်လဲ ဆိုတာကိုတော့ senior တွေ မှတ်မိတာကိုပဲ အားကိုးခဲ့ရပါတယ်။
      observability ကတော့ data တွေကို ချိတ်ဆက်ပြီး အဖွဲ့တိုင်း မျှသုံးထားလို့ ကြိုမတွေးထားတဲ့ မေးခွန်းအသစ်တွေကိုပါ အချိန်မရွေး မေးပြီး ဖြေလို့ရတာပါ။
      [[mark:show-p02b]] observability ရဲ့ ပထမ ပစ်မှတ်ကတော့ ပြဿနာ သိကတည်းက user တွေ ပြန်အဆင်ပြေတဲ့အထိ ကြာချိန်၊ time to mitigate ကို တိုစေဖို့ပါ၊ ဒီ ၂ ရက်ရဲ့ အများစုက ဒီအပိုင်းပါ။ ပြီးမှ ပြဿနာ စဖြစ်ကတည်းက Padauk သိရတဲ့အထိ ကြာချိန်၊ time to detect ကို တိုအောင် လုပ်ပါတယ်၊ ဒီတစ်ခါ user တွေက Padauk ထက် အရင် သိခဲ့လို့ပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "OpenTelemetry: Observability primer",
          url: "https://opentelemetry.io/docs/concepts/observability-primer/",
        }
    actions:
      - { id: show-p01b, type: slide.show, at: { mark: show-p01b }, slideId: l08-p01b }
      - { id: show-p02, type: slide.show, at: { mark: show-p02 }, slideId: l08-p02 }
      - { id: show-p02b, type: slide.show, at: { mark: show-p02b }, slideId: l08-p02b }

  - id: connected-signals
    narration: >
      [[mark:close-p02b]] [[mark:b1-s1]] ဒီ ၂ ရက်ကို တိုစေချင်တော့ မသီရိက signal လေးမျိုးကို ချိတ်မိအောင် စုပါတယ်။ metric က အချိန်နဲ့အမျှ တိုင်းထားတဲ့ ကိန်းဂဏန်း၊ log က event တစ်ခုချင်းရဲ့ မှတ်တမ်း၊ [[mark:b1-s1b]] trace က request တစ်ခု service တွေကို ဖြတ်သွားတဲ့ လမ်းကြောင်းဖြစ်ပြီး၊ profile ကတော့ code ရဲ့ ဘယ်အပိုင်းက CPU နဲ့ memory ကို အများဆုံး သုံးလဲ ပြပါတယ်။
      [[mark:b1-s2]] signal တိုင်းမှာ service၊ version၊ zone ဆိုတဲ့ label တွေ၊ trace ID နဲ့ code နေရာ တူတူ ပါနေရင် ဘယ်နေရာ၊ ဘယ် request၊ ဘယ် code လဲ ဆိုတာ တစ်ဆက်တည်း ရှာပြီး request တစ်ခုရဲ့ ဇာတ်လမ်းကို မြင်ရပါတယ်။ ဥပမာ refund တောင်းထားတဲ့ top-up တစ်ခုရဲ့ trace ID နဲ့ ရှာရုံနဲ့ ဘေလ်က ၃ စက္ကန့်နဲ့ ဝင်ပြီးသားဖြစ်ပြီး status ဖတ်တဲ့ code ကပဲ ဘာမှ ရှာမတွေ့ခဲ့တာ မိနစ်ပိုင်းနဲ့ သိရမှာပါ။
      [[mark:b1-s3]] ဘယ်ကစရမလဲ မသိရင် latency၊ traffic၊ error နဲ့ resource ဘယ်လောက် ပြည့်နေလဲ ပြတဲ့ saturation ဆိုတဲ့ four golden signals ကနေ စပါ။ ဒါပေမဲ့ အဲဒီ ၂ ရက်မှာ လေးခုလုံး ကောင်းနေခဲ့ပါတယ်။ signal တွေ ထုတ်ဖို့ကိုတော့ vendor တစ်ခုတည်းနဲ့ မချည်နှောင်ထားတဲ့ open standard၊ OpenTelemetry ကို ရွေးပါတယ်၊ tool တစ်ခုကို နှစ်ချီ သုံးရတတ်လို့ပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - { title: "OpenTelemetry: Signals", url: "https://opentelemetry.io/docs/concepts/signals/" }
      - {
          title: "SRE book, 1st ed: Monitoring Distributed Systems",
          url: "https://sre.google/sre-book/monitoring-distributed-systems/",
        }
    actions:
      - { id: close-p02b, type: slide.close, at: { mark: close-p02b, offsetMs: -400 } }
      # Step 1 is split in two so no step adds more than three elements: the bus
      # with metric and log, then trace and profile as soon as "trace က" is said
      # (b1-s1b sits after the ၊ that ends the log clause).
      - id: b1-s1
        type: whiteboard.apply
        at: { mark: b1-s1 }
        open: true
        clear: true
        upsertIds: [l08-b1-bus, l08-b1-r1, l08-b1-t1, l08-b1-a1, l08-b1-r2, l08-b1-t2, l08-b1-a2]
        drawMs: 2200
      - id: b1-s1b
        type: whiteboard.apply
        at: { mark: b1-s1b }
        upsertIds: [l08-b1-r3, l08-b1-t3, l08-b1-a3, l08-b1-r4, l08-b1-t4, l08-b1-a4]
        drawMs: 1800
      - id: b1-s2
        type: whiteboard.apply
        at: { mark: b1-s2 }
        upsertIds: [l08-b1-a5, l08-b1-story, l08-b1-story-t, l08-b1-same]
        drawMs: 2400
      - {
          id: b1-s3,
          type: whiteboard.apply,
          at: { mark: b1-s3 },
          upsertIds: [l08-b1-golden],
          drawMs: 1400,
        }

  - id: success-hides-failure
    chapter: Success code နောက်က failure
    narration: >
      [[mark:close-b1]] [[mark:b2-s1]] ဒါဆို alert ဘာလို့ မတက်ခဲ့တာလဲ? user က Top-up ကို နှိပ်တော့ API က success code ပြန်ပေးပြီး ဘေလ်လည်း ၁၀ စက္ကန့်အတွင်း ဝင်လို့ lesson ၆ က Top-up SLO လည်း အစိမ်းရောင်ပါ။ ပြဿနာက Operator A က သူ့ response ထဲက status field နာမည်ကို ကြိုမပြောဘဲ ပြောင်းလိုက်တာပါ။ Padauk ရဲ့ code က နာမည်ဟောင်းကို ရှာမတွေ့တော့ top-up မပြီးသေးဘူးလို့ ယူဆနေခဲ့ပါတယ်။
      [[mark:b2-s2]] app မှာတော့ အတည်ပြုချက် ဘယ်တော့မှ မပေါ်ပါဘူး။ lesson ၁ က ငွေ နှစ်ခါ ဖြတ်ခဲ့တာလိုပဲ user တကယ် ဘာရသွားလဲ ဆိုတာကို system က မစစ်ခဲ့တာပါ။ service တစ်ခုချင်း ကောင်းနေတာထက် user လုပ်ချင်တာ ပြီးသွားလား ဆိုတာက ပိုအရေးကြီးပါတယ်။
      [[mark:b2-s3]] ဒါကြောင့် ငွေဖြတ်တဲ့ top-up တိုင်းမှာ ဘေလ်ဝင်ကြောင်း app မှာ ၁၀ စက္ကန့်အတွင်း ပေါ်ရမယ် ဆိုတဲ့ user အဆင့် check ကို ထည့်ပါတယ်။ Operator A လို ပြောင်းလဲမှုမျိုး ထပ်ဖြစ်ရင် ဒီ check က မိနစ်ပိုင်းအတွင်း ကျမှာပါ။
      [[mark:b2-s4]] config ပြောင်းတာ၊ release အသစ် ထုတ်တာ၊ feature ကို user ၅ ရာခိုင်နှုန်းဆီ ဖွင့်တာလို Padauk ကိုယ်တိုင် ပြောင်းနေတုန်း ဒီ check ကျရင် အဲဒီ ပြောင်းလဲမှုက အလိုလို ရပ်သွားပါတယ်။ ဒါက ကြိုကာတာပါ၊ lesson ၁၉ မှာ ဆက်ကြည့်ပါမယ်။
      [[mark:b2-s5]] Operator A လို အပြင်က ပြောင်းတာကိုတော့ ကြိုမတားနိုင်လို့ top-up လုပ်တဲ့ critical user journey ရဲ့ SLO မှာ error budget မြန်မြန် ကုန်လာရင် တက်တဲ့ SLO burn alert နဲ့ ဖမ်းပါတယ်။ ကြိုကာတဲ့ အလွှာနဲ့ ဖမ်းတဲ့ အလွှာ နှစ်ခုလုံး ထားတာက defense in depth ပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book, 1st ed: Monitoring Distributed Systems",
          url: "https://sre.google/sre-book/monitoring-distributed-systems/",
        }
      - {
          title: "OpenTelemetry: Observability primer",
          url: "https://opentelemetry.io/docs/concepts/observability-primer/",
        }
      - {
          title: "Workbook: Alerting on SLOs",
          url: "https://sre.google/workbook/alerting-on-slos/",
        }
    actions:
      # ⟪close board⟫ into the next board: wipe B1 400 ms early, keep the panel open.
      - {
