  - id: alert-on-evidence
    chapter: အထောက်အထား ခိုင်လုံမှ page ပို့
    narration: >
      [[mark:close-p03c]] [[mark:b5-s1]] နောက်ဆုံး ပြဿနာက ညဘက် page တွေပါ။ ဒီ လိမ္မော်ရောင် မျဉ်းက Top-up SLO ပေးထားတဲ့ fail ခွင့် ၀.၅ ရာခိုင်နှုန်းပါ။ alert အဟောင်းက Operator တစ်ခုရဲ့ error rate ဒီမျဉ်းကို ကျော်တာနဲ့ page ပို့ပါတယ်။ fail အရေအတွက်ကို ပုံသေ ထားတဲ့ စည်းကလည်း traffic နည်းတဲ့ Operator မှာ ပျက်နေရင်တောင် မတက်ဘဲ များတဲ့ Operator မှာ ကောင်းနေရင်တောင် တက်လို့ နှစ်ဘက်လုံး မှားပါတယ်။
      [[mark:b5-s2]] မနက် ၃ နာရီမှာ Operator C ဆီ top-up ၄၀ ထဲက တစ်ခု fail တော့ ၂.၅ ရာခိုင်နှုန်း ဖြစ်လို့ page ဝင်လာပြီး မသီရိ အိပ်ရာက ထရပေမဲ့ တကယ်တော့ ဘာပြဿနာမှ မရှိခဲ့ပါဘူး။ နမူနာ နည်းလို့ တကယ့် fail နှုန်းက ၀.၅ ရာခိုင်နှုန်း အောက်ကနေ ၁၃ ရာခိုင်နှုန်းလောက်အထိ ဖြစ်နိုင်ပြီး ဒီ ကျယ်တဲ့ အကွက်က မျဉ်းကို ဖြတ်နေလို့ အထောက်အထား မခိုင်လုံပါဘူး။
      [[mark:b5-s3]] Operator A မှာတော့ ၂၀၀၀၀ ထဲက ၂၄၀၊ ၁.၂ ရာခိုင်နှုန်းပဲ fail ဖြစ်ပေမဲ့ နမူနာ များတော့ အကွက်က ကျဉ်းပြီး တစ်ခုလုံး မျဉ်းအပေါ်မှာ ရှိလို့ page ပို့ရပါမယ်။ ဒီလို နမူနာ အရေအတွက်ပါ တွက်ပြီး ပြဿနာ ရှိတာ သေချာမှ page ပို့တာကို အထောက်အထား ခိုင်လုံမှ တက်တဲ့ alert လို့ ခေါ်ပါတယ်။
      [[mark:b5-s4]] ပျမ်းမျှကလည်း လှည့်စားတတ်ပါတယ်။ ဥပမာ မိနစ် ပျမ်းမျှက ၅ စက္ကန့်စာပဲ ရုတ်တရက် တက်တဲ့ error တွေကို ဖုံးထားနိုင်ပါတယ်။ monitoring ကောင်းလာစမှာလည်း failure တွေ ပိုများလာသလို ထင်ရပေမဲ့ အရင်က မမြင်ရတာတွေ ပေါ်လာတာပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
