    entryFilePath: notes.md
    sidebarStartsCollapsed: true
    files:
      notes.md: |
        # Monitoring ကနေ observability ဆီ

        - observability — ကြိုမတွေးထားတဲ့ မေးခွန်းကို ချိတ်ဆက်ထားတဲ့ data ကနေ ဖြေ
        - golden signals — latency · traffic · error · saturation
        - trace — request တစ်ခု service တွေကို ဖြတ်သွားတဲ့ လမ်းကြောင်း
        - shared fate — monitoring က app နဲ့ အတူ ပျက်
        - generated dashboard — shared library ကနေ service တိုင်းအတွက် အလိုလို ထွက်
        - cardinality — label တစ်ခုမှာ မတူတဲ့ တန်ဖိုး ဘယ်နှမျိုး
        - အထောက်အထား ခိုင်လုံမှ တက်တဲ့ alert — နမူနာ အရေအတွက်ပါ တွက်ပြီး သေချာမှ page

        မေးခွန်း: monitoring က app နဲ့ cluster တစ်ခုတည်းပေါ်မှာ run နေတယ်။ cluster ပျက်ရင် ဘာဖြစ်မလဲ?
