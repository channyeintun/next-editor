  - id: telemetry-bill
    chapter: Telemetry ရဲ့ bill နဲ့ တာဝန်
    narration: >
      [[mark:close-b4]] [[mark:show-p03]] လကုန်တော့ metric၊ log၊ trace လို telemetry ရဲ့ bill က ၃ လအတွင်း ၂ ဆ ဖြစ်နေလို့ CTO ကိုနေလင်းက အကြောင်းရင်း မေးပါတယ်။ ရှာကြည့်တော့ debug log တစ်ခုက request တစ်ခုလုံးကို user ရဲ့ NRC နံပါတ်နဲ့ အတူ ရေးနေတာ တွေ့ပါတယ်။ ဒါက bill ကိစ္စ သက်သက် မဟုတ်ဘဲ တာဝန်ကိစ္စပါ။
      ဒါကြောင့် log ရေးတဲ့ နေရာမှာတင် NRC နံပါတ်ကို ဖုံးပါတယ်။ lesson ၄ က စည်းမျဉ်းလိုပဲ log ကိုလည်း ပြည်တွင်းမှာပဲ ထားရမယ် ဆိုပါစို့။ အသေးစိတ် data ကိုတော့ ရက် ၃၀ ပြီးရင် ဖျက်ပါတယ်။
      [[mark:show-p03b]] bill တက်တဲ့ နောက်အကြောင်း တစ်ခုက metric တစ်ခုမှာ user ID ကို label အဖြစ် ထည့်ထားတာပါ။ label တစ်ခုမှာ မတူတဲ့ တန်ဖိုး ဘယ်နှမျိုး ရှိလဲ ဆိုတာက cardinality ပါ။ တန်ဖိုး တစ်မျိုးစီက time series တစ်ခုစီ ဖြစ်လို့ user ၁၂ သိန်းဆိုရင် series ၁၂ သိန်း ဖြစ်ပြီး bill အဆမတန် တက်ပါတယ်။ ဒါကြောင့် user ID ကို ရှာရ ပိုကုန်ပေမဲ့ သိမ်းနိုင်တဲ့ log နဲ့ trace ထဲမှာပဲ ထားပါ။
      [[mark:show-p03c]] field တိုင်းမှာလည်း ဘယ်လို data လဲ ဆိုတဲ့ အမှတ်အသား တပ်ပြီး ဘယ်ရောက်ရောက် ပါသွားအောင် ထားပါ။ ဥပမာ Operator တစ်ခုရဲ့ error rate က personal data မဟုတ်ပေမဲ့ ဖုန်းနံပါတ် ပါတဲ့ log က personal data ပါ။ နာမည် မပါတဲ့ မန္တလေး ဆိုင်ခွဲတွေရဲ့ ကိန်းဂဏန်းကလည်း supermarket chain တစ်ခုတည်းရဲ့ data မို့ ဘယ်သူ့ data လဲ သိနိုင်ပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - { title: "OpenTelemetry: Signals", url: "https://opentelemetry.io/docs/concepts/signals/" }
      - {
          title: "OpenTelemetry: Observability primer",
          url: "https://opentelemetry.io/docs/concepts/observability-primer/",
        }
    actions:
      - {
          id: close-b4,
          type: whiteboard.apply,
          at: { mark: close-b4, offsetMs: -400 },
          open: false,
        }
      - { id: show-p03, type: slide.show, at: { mark: show-p03 }, slideId: l08-p03 }
