# SRE from zero, lesson 08: From monitoring to observability (Burmese concept lesson).
#
# Built from the approved voice script
# docs/sre-course/voice-scripts/sre-08-observability.md. Every spoken
# character is that script's "> " lines, unchanged; each ⟪…⟫ marker became a
# [[mark:…]] at the same place. Check it with:
#   bun ~/Documents/sre-course/work/check-narration.ts \
#     docs/sre-course/voice-scripts/sre-08-observability.md \
#     src/studio/scripts/sre-08-observability.yaml
#
# Nothing runs: deck pages and the whiteboard carry the lesson, and notes.md is
# the recap. The workspace and runtime follow the validated no-code skeleton
# (WebContainer, empty init command, a harmless dev script).
#
# Three marks add no spoken text and sit at an existing ။ or ၊:
# hook-refunds splits the hook's opening narration in two (one 486-character
# dialog would pass the 450-character limit; no action uses it), b1-s1b keeps
# board B1's first step to three new elements (the bus, metric and log, then
# trace and profile as the narration reaches "trace က", right after the ၊ that
# ends the log clause, so each box lands as it is named), and
# ask-question makes the recap question its own dialog so the question-line
# select can hang off it for the ⟪pause 3s⟫, as in Module 1.
#
# ⟪close board⟫ straight into the next board (scenes 4, 5 and 6) wipes the
# open board 400 ms early (whiteboard.apply clear) instead of closing the
# panel, so the editor does not flash between two boards; the next board then
# draws with open: true, clear: true as usual. A board followed by a deck page
# closes the panel (open: false) 400 ms before the page, as in Module 1.
#
# Boards (B1 P2 comb fan-in, B2 P1 vertical flow, B3 P6 lanes, B4 P1 flow,
# B5 P5 bars). Colour jobs: #1e1e1e ink (paints white) for arrows, the bus,
# the cluster outline and the axis; blue the thing named and data series;
# green healthy or done; red failure; orange the limit or caveat; violet the
# result. A label on two lines is two text assets, one per line, so each line
# meets the 0.55 em width rule on its own; four labels whose Virgil digits or
# Latin measured wider than that rule in Chrome (B2's second rule line, the
# prober's second line, and both B5 counts) get their measured width. In B5 the bar heights follow the
# failure rates (Operator C 2.5% is taller than Operator A 1.2%); the orange
# outline around each bar's top is its uncertainty, wide for C and narrow for A.
#
# Deck pages: deck "Next Editor · SRE 2 · Agree and notice". The /pub URL
# below is a placeholder until Chan publishes the deck; the Director's
# unreachable-deck warning is expected until then. Page plan:
# ~/Documents/sre-course/work/pages/sre-08-observability.json
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/sre-08-observability.yaml
#   bun scripts/studio-compile-check.ts src/studio/scripts/sre-08-observability.yaml
