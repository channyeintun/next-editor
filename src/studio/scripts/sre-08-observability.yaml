  - id: thirty-services
    chapter: Service 30 နဲ့ generated dashboard
    narration: >
      [[mark:close-b3]] [[mark:b4-s1]] Padauk မှာ service ၃၀ လောက် ရှိလာတော့ dashboard ကို အဖွဲ့တိုင်း လက်နဲ့ ဆွဲရတာ မမီတော့ပါဘူး။ ဒါကြောင့် မသီရိက ဖုန်းကုမ္ပဏီတွေဆီ ချိတ်ပေးတဲ့ operator gateway client နဲ့ HTTP၊ database library တွေထဲကို standard metric တွေ ထည့်ပါတယ်။ အဲဒီ library တွေ သုံးတဲ့ service တိုင်းမှာ တူညီတဲ့ graph တွေ အလိုလို ထွက်လာတာကို generated dashboard လို့ ခေါ်ပါတယ်။
      [[mark:b4-s2]] library ပိုင်ရှင်က alert တစ်ခု ရေးလိုက်ရင်လည်း သုံးတဲ့ service တိုင်းမှာ ပါသွားပြီး service တစ်ခုချင်းရဲ့ traffic နဲ့ ကိုက်အောင် သူ့ဘာသာ ချိန်ညှိပါတယ်။ user ဒုက္ခရောက်တာကို ပြတဲ့ alert တွေဘေးမှာ quota ပြည့်ခါနီးတာလို အကြောင်းရင်းကို ပြတဲ့ alert တွေလည်း ထားပါတယ်။
      [[mark:b4-s3]] Top-up alert တက်ရင် script တစ်ခုက နောက်ဆုံး deploy၊ ဖုန်းကုမ္ပဏီတွေရဲ့ latency၊ database connection တွေကို အလိုလို စစ်ပြီး တွေ့တာကို incident chat channel ထဲ တင်ပေးလို့ on-call ကျနေတဲ့သူက စစ်ပြီးသား အချက်တွေကနေ စလို့ရပါတယ်။ deploy ပြီးချင်း error တွေ ရုတ်တရက် တက်လာရင်တော့ အလိုအလျောက် rollback လုပ်ပေးပါတယ်။
    sources:
