  - id: this-week
    narration: >
      [[mark:close-b5]] [[mark:show-p04]] ဒီအပတ်တော့ ကိုယ့် monitoring ကို ဒီလို စစ်ကြည့်ပါ။ success code ပြန်ပေးပေမဲ့ user ဘက်မှာ မအောင်မြင်တဲ့ နေရာ တစ်ခုကို ရှာကြည့်ပါ။ ကိုယ့် monitoring က app နဲ့ cluster တစ်ခုတည်း၊ zone တစ်ခုတည်းမှာ run နေလား စစ်ပါ။ ပြီးတော့ user ID လို တန်ဖိုး အရမ်းများတဲ့ metric label တစ်ခုကို ဖယ်ပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book, 1st ed: Monitoring Distributed Systems",
          url: "https://sre.google/sre-book/monitoring-distributed-systems/",
        }
      - {
          title: "OpenTelemetry: Observability primer",
          url: "https://opentelemetry.io/docs/concepts/observability-primer/",
        }
    actions:
      - {
          id: close-b5,
          type: whiteboard.apply,
          at: { mark: close-b5, offsetMs: -400 },
          open: false,
        }
      - { id: show-p04, type: slide.show, at: { mark: show-p04 }, slideId: l08-p04 }

  - id: recap
    narration: >
      [[mark:close-p04]] [[mark:open-notes]] notes ကို တစ်ကြောင်းချင်း ပြန်လှန်ကြည့်ရအောင်။ [[mark:sel-observability]] observability က ကြိုမတွေးထားတဲ့ မေးခွန်းတွေကို ချိတ်ဆက်ထားတဲ့ data ကနေ ဖြေနိုင်တာပါ။ [[mark:sel-golden]] golden signals က အရင်ဆုံး ကြည့်ရမယ့် signal လေးခုဖြစ်ပြီး၊ [[mark:sel-trace]] trace က request တစ်ခုရဲ့ လမ်းကြောင်း တစ်ခုလုံးပါ။ [[mark:sel-shared-fate]] shared fate ဆိုတာ monitoring က app နဲ့ အတူ ပျက်တာပါ။
      [[mark:sel-generated]] generated dashboard က shared library ကနေ အလိုလို ထွက်လာတဲ့ dashboard ဖြစ်ပြီး၊ [[mark:sel-cardinality]] cardinality က label တစ်ခုမှာ မတူတဲ့ တန်ဖိုး ဘယ်နှမျိုး ရှိလဲ ဆိုတာပါ။ [[mark:sel-evidence]] အထောက်အထား ခိုင်လုံမှ တက်တဲ့ alert ကတော့ နမူနာ အရေအတွက်ပါ တွက်ပြီး သေချာမှ page ပို့တာပါ။ ဒီ မေးခွန်းကို ဖြေကြည့်ပါဦး။ [[mark:ask-question]] monitoring က app နဲ့ cluster တစ်ခုတည်းမှာ run နေရင် အဲဒီ cluster ပျက်တဲ့နေ့ ဘာဖြစ်မလဲ?
      [[mark:pause-question]] alert တွေပါ app နဲ့ အတူ ပျက်သွားလို့ user တွေ post တင်မှပဲ သိရပါမယ်။ Module ၃ မှာတော့ မနက် ၂ နာရီမှာ alert တက်လာပေမဲ့ လူ ၆၀ ရှိတဲ့ Viber group ထဲ ရောက်သွားပြီး အဲဒီ group ကို လူတိုင်းက အသံပိတ်ထားကြပါတယ်။ ဘယ်သူ ဖြေမလဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "OpenTelemetry: Observability primer",
          url: "https://opentelemetry.io/docs/concepts/observability-primer/",
        }
      - {
          title: "SRE book, 1st ed: Monitoring Distributed Systems",
          url: "https://sre.google/sre-book/monitoring-distributed-systems/",
        }
    actions:
      - { id: close-p04, type: slide.close, at: { mark: close-p04 } }
      - {
          id: open-notes,
          type: workspace.openFile,
          at: { mark: open-notes, offsetMs: 300 },
          path: notes.md,
        }
      # occurrence 2: the title line "# Monitoring ကနေ observability ဆီ" holds the first match.
      - {
          id: sel-observability,
          type: editor.select,
          at: { mark: sel-observability },
          target: { file: notes.md, text: "observability", occurrence: 2 },
        }
      - {
          id: sel-golden,
          type: editor.select,
          at: { mark: sel-golden },
          target: { file: notes.md, text: "golden signals", occurrence: 1 },
        }
      - {
          id: sel-trace,
          type: editor.select,
          at: { mark: sel-trace },
          target: { file: notes.md, text: "trace", occurrence: 1 },
        }
      - {
          id: sel-shared-fate,
          type: editor.select,
          at: { mark: sel-shared-fate },
          target: { file: notes.md, text: "shared fate", occurrence: 1 },
        }
      - {
          id: sel-generated,
          type: editor.select,
          at: { mark: sel-generated },
          target: { file: notes.md, text: "generated dashboard", occurrence: 1 },
        }
      - {
          id: sel-cardinality,
          type: editor.select,
          at: { mark: sel-cardinality },
          target: { file: notes.md, text: "cardinality", occurrence: 1 },
        }
      - id: sel-evidence
        type: editor.select
        at: { mark: sel-evidence }
        target: { file: notes.md, text: "အထောက်အထား ခိုင်လုံမှ တက်တဲ့ alert", occurrence: 1 }
      # The voice script's ⟪pause 3s⟫, as in Module 1. A select anchored at
      # pause-question would drag under the answer's first words (the scheduler
      # holds only the dialog after its anchor's), so it hangs off ask-question,
      # the question's own dialog: it starts about as the question ends, its drag
      # runs in silence, and the answer at pause-question waits for it.
      # The question is 85 characters, longer than Module 1's, so the pause is
      # shorter at the slower rates: 6350 ms leaves about 2.8 / 1.5 / 0.4 s of
      # quiet after the question at 55 / 70 / 95 ms per character; an offset
      # above ~6440 trips compile-check's 2.5 s inserted-silence warning at 55.
      - id: select-question
        type: editor.select
        at: { mark: ask-question, offsetMs: 6350 }
        target:
          file: notes.md
          text: "မေးခွန်း: monitoring က app နဲ့ cluster တစ်ခုတည်းပေါ်မှာ run နေတယ်။ cluster ပျက်ရင် ဘာဖြစ်မလဲ?"
          occurrence: 1

checks:
  # 500, not 300: google-svg deck pages stall the main thread at show/close.
  - { type: timing.p95Ms, max: 500 }
