  - id: shared-fate
    chapter: App နဲ့ အတူ မပျက်တဲ့ monitoring
    narration: >
      [[mark:close-b2]] [[mark:b3-s1]] သီတင်းကျွတ် ညမှာတော့ Top-up run နေတဲ့ cluster တစ်ခုလုံး ပျက်သွားပေမဲ့ page တစ်ခုမှ မဝင်ခဲ့ပါဘူး။ monitoring ကိုပါ အဲဒီ cluster ထဲမှာ run ထားလို့ alert တွေပါ အတူ ပျောက်သွားပြီး Facebook post တွေကို support က မစု မြင်မှ သိခဲ့ရပါတယ်။ ဒီလို monitoring က သူ စောင့်ကြည့်တဲ့ system နဲ့ အတူ ပျက်တာကို shared fate လို့ ခေါ်ပါတယ်။
      [[mark:b3-s2]] ဒါကြောင့် monitoring ကို app မရှိတဲ့ zone B ဆီ ရွှေ့ပြီး production service တွေကို တတ်နိုင်သမျှ နည်းနည်းပဲ မှီအောင် ထားပါတယ်။ အခု zone A က app ပျက်ရင်တောင် zone B က page ပို့နိုင်ပါသေးတယ်။
      [[mark:b3-s3]] cloud အပြင်ကနေ user လိုပဲ မိနစ်တိုင်း top-up တစ်ခု စမ်းဖြည့်ကြည့်တဲ့ prober လည်း ထည့်လိုက်လို့ အထဲမှာ အကုန် ပျက်ရင်တောင် alert ဆက်တက်ပါတယ်။
      [[mark:b3-s4]] alert တွေက မြန်မြန် ရောက်တဲ့ နောက်ဆုံးရ data ကို သုံးပြီး၊ နောက်မှ မေးမယ့် မေးခွန်းတွေအတွက်တော့ နှေးပေမဲ့ ပြည့်စုံတဲ့ data ကို သိမ်းပါတယ်။ incident အတွင်း နောက်ဆုံးရ data ကို အရင် ပြရပါမယ်၊ တစ်စိတ်တစ်ပိုင်း မြင်ရတာတောင် ဘာမှ မမြင်ရတာထက် ကောင်းလို့ပါ။
    sources:
