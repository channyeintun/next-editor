  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: need
    chapter: ပြိုင်ဘက်က sharding လုပ်ပြီတဲ့
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ replication က data ကို မိတ္တူပွားပေးပုံနဲ့၊ feature တစ်ခုစီက ဘယ် မိတ္တူကနေ ဖတ်မလဲ
      ဆုံးဖြတ်ပုံကို လေ့လာခဲ့ပါတယ်။
      [[mark:open-doc]] ဒီအပတ် အစည်းအဝေးမှာ CTO ဖြစ်တဲ့ အောင်အောင် က မေးခွန်း တစ်ခု ယူလာပါတယ်။
      [[mark:sel-question]] ပြိုင်ဘက် ကုမ္ပဏီ တစ်ခုက သူတို့ database ကို sharding လုပ်လိုက်ပြီလို့ ကြားခဲ့တာပါ။
      ခရီးဖော် ကကော ဘာလို့ မလုပ်သေးတာလဲ၊ နောက်ကျနေပြီလားလို့ သူ သိချင်ပါတယ်။
      [[mark:sel-context]] မေးခွန်းက ကျိုးကြောင်းဆီလျော်ပါတယ်။ လက်မှတ်က တစ်ရက်ကို ရှစ်သောင်းလောက်
      ရောင်းနေရပြီး၊ လက်မှတ် table မှာ row သန်း ၆၀ လောက် ရှိနေပါပြီ။ ဒါပေမဲ့ တခြားသူ လုပ်လို့ လိုက်လုပ်တာကတော့
      ဆုံးဖြတ်ချက် မဟုတ်ပါဘူး။ sharding က ဘာကို ဖြေရှင်းပေးပြီး ဘာတွေ ပေးဆပ်ရလဲ ဆိုတာကို အရင် ကြည့်ပြီးမှ
      အဖြေပေးပါမယ်။
    sources:
      - {
          title: "Designing Data-Intensive Applications, 2nd edition (Kleppmann, Riccomini)",
          url: "https://oreil.ly/DesigningDataIntensiveApps2",
        }
    actions:
      - {
          id: open-notebook,
          type: workspace.openFile,
          at: { mark: open-doc },
          path: notebook/31-adr-not-yet.md,
        }
      - id: sel-question
        type: editor.select
        at: { mark: sel-question }
        target: { file: notebook/31-adr-not-yet.md, text: "ပြိုင်ဘက်က sharding လုပ်ပြီ၊ ကိုယ်တို့ကော?" }
      - id: sel-context
        type: editor.select
        at: { mark: sel-context }
        target:
          {
            file: notebook/31-adr-not-yet.md,
            text: "- လက်မှတ် တစ်ရက် 80,000 ခန့်၊ tickets table မှာ row 60 သန်းခန့်",
          }

  - id: what
    chapter: Sharding က ဘာကို ဖြေရှင်းလဲ
    narration: >
      [[mark:w-open]] replication မှာ စက်တိုင်းက data အားလုံးရဲ့ မိတ္တူကို သိမ်းပါတယ်။ ဒါကြောင့် ဖတ်တဲ့ load
      ကို ခွဲပေးနိုင်ပေမဲ့၊ ရေးတာကတော့ ရေးခွင့်ရှိတဲ့ မိတ္တူ၊ leader တစ်လုံးတည်းမှာပဲ ရှိပါတယ်။ data ကလည်း
      စက်တစ်လုံးထဲ ဆံ့မှ ရပါတယ်။
      [[mark:w-table]] ခရီးဖော် ရဲ့ လက်မှတ် table ကလည်း အခု စက်တစ်လုံးထဲမှာပဲ ရှိပါတယ်။
      [[mark:w-shards]] စက်တစ်လုံးက data ကို မဆံ့တော့ရင်၊ ဒါမှမဟုတ် ရေးတဲ့ request တွေကို မနိုင်တော့ရင် table
      ကို အပိုင်းပိုင်း ခွဲပြီး စက်တွေပေါ် ဖြန့်ထားရပါတယ်။ ဒါကို sharding လို့ ခေါ်ပြီး၊ အပိုင်း တစ်ခုစီကို
      shard လို့ ခေါ်ပါတယ်။ row တစ်ခုက shard တစ်ခုတည်းမှာပဲ ရှိပါတယ်။
      [[mark:w-key]] row တစ်ခုက ဘယ် shard ထဲ သွားမလဲ ဆိုတာကို field တစ်ခုက ဆုံးဖြတ်ပါတယ်။ အဲဒီ field ကို shard
      key လို့ ခေါ်ပါတယ်။
      [[mark:w-gain]] ရတာက ရေးနိုင်တဲ့ ပမာဏနဲ့ သိမ်းနိုင်တဲ့ ပမာဏ တိုးလာတာပါ။ ပေးရတာကတော့ မနည်းပါဘူး။
      [[mark:w-cross]] shard တစ်ခုထဲမှာ ပြီးတဲ့ query က မြန်ပါတယ်။ ဒါပေမဲ့ shard အများကြီးကို ဖြတ်ရတဲ့ query
      နဲ့ join တွေက shard တိုင်းကို မေးပြီး ပြန်ပေါင်းရပါတယ်။ transaction၊ ဆိုလိုတာက အကုန်ဖြစ် ဒါမှမဟုတ်
      တစ်ခုမှ မဖြစ်ရမယ့် လုပ်ဆောင်ချက် အစုကလည်း shard နှစ်ခုကို ဖြတ်တာနဲ့ နှေးပြီး ရှုပ်ထွေးသွားပါတယ်။ စက်အသစ်
      ထည့်တိုင်း data တွေကို ရွှေ့ရသလို၊ load ကလည်း shard တွေပေါ် မညီမမျှ ကျနိုင်ပါတယ်။
    sources:
      - {
          title: "Designing Data-Intensive Applications, 2nd edition (Kleppmann, Riccomini)",
          url: "https://oreil.ly/DesigningDataIntensiveApps2",
        }
    actions:
      - {
          id: draw-w-open,
          type: whiteboard.apply,
          at: { mark: w-open },
          open: true,
          upsertIds: [w-title],
        }
      - {
          id: draw-w-table,
          type: whiteboard.apply,
          at: { mark: w-table },
          upsertIds: [w-table, w-table-l],
          drawMs: 1200,
        }
      - {
          id: draw-w-shards,
          type: whiteboard.apply,
          at: { mark: w-shards },
          upsertIds: [w-a1, w-s1, w-s1-l, w-a2, w-s2, w-s2-l, w-a3, w-s3, w-s3-l],
          drawMs: 3600,
        }
      - {
          id: draw-w-key,
          type: whiteboard.apply,
          at: { mark: w-key },
          upsertIds: [w-key],
          drawMs: 800,
        }
      - {
          id: draw-w-cost,
          type: whiteboard.apply,
          at: { mark: w-cross },
          upsertIds: [w-cost],
          drawMs: 1500,
        }

  - id: keys
    chapter: Key က အရာအားလုံးကို ဆုံးဖြတ်တယ်
    narration: >
      [[mark:k-open]] အဲဒီ စရိတ်တွေ ဘယ်လောက် ကြီးမလဲ ဆိုတာကို shard key က ဆုံးဖြတ်ပါတယ်။ key ကို ခွဲနည်း
      နှစ်မျိုး ရှိပါတယ်။
      [[mark:k-range]] ပထမ နည်းက key ရဲ့ တန်ဖိုး အပိုင်းအခြားအလိုက် ခွဲတာပါ။ ဥပမာ လက်မှတ် နံပါတ် တစ်ကနေ သန်း ၂၀
      အထိက ပထမ shard၊ သန်း ၂၀ ကနေ ၄၀ အထိက ဒုတိယ shard ဆိုတာမျိုးပါ။ ကပ်နေတဲ့ key တွေက shard တစ်ခုထဲမှာ
      အတူရှိတော့ အပိုင်းအခြားနဲ့ ရှာတဲ့ query တွေ မြန်ပါတယ်။
      [[mark:k-range-hot]] ဒါပေမဲ့ လက်မှတ် နံပါတ်က အစဉ်လိုက် တိုးတာမို့၊ လက်မှတ် အသစ်တိုင်းက နောက်ဆုံး shard
      တစ်ခုတည်းကိုပဲ ရောက်ပါတယ်။ ကျန်တဲ့ shard တွေက အားနေပြီး တစ်ခုတည်းက ပူနေတာပါ။ ဒီလို shard ကို hot shard
      လို့ ခေါ်ပါတယ်။
      [[mark:k-hash]] ဒုတိယ နည်းက key ကို hash လုပ်ပြီး ရလာတဲ့ တန်ဖိုးနဲ့ ခွဲတာပါ။ hash က ကပ်နေတဲ့ key တွေကို
      ဟိုဟိုဒီဒီ ဖြန့်ပစ်တော့၊ ရေးတာတွေက shard အားလုံးပေါ် ညီညီမျှမျှ ကျတတ်ပါတယ်။
      [[mark:k-hash-cost]] ဆုံးရှုံးရတာက အပိုင်းအခြားနဲ့ ရှာတာပါ။ ဒီလအတွင်း ရောင်းရတဲ့ လက်မှတ် အားလုံးကို
      လိုချင်ရင် shard တိုင်းကို မေးရပါတော့တယ်။
      [[mark:k-hotkey]] hash နဲ့တောင် မဖြေရှင်းနိုင်တာကတော့ hot key ပါ။ key တစ်ခုတည်းမှာ load အများကြီး
      စုနေတာကို ဆိုလိုပါတယ်။
      [[mark:k-hotkey-ex]] ဥပမာ ကားလိုင်းအလိုက် ခွဲထားရင်၊ လက်မှတ် အများဆုံး ရောင်းရတဲ့ ကားလိုင်းကြီး တစ်ခုရဲ့
      row အားလုံးက shard တစ်ခုတည်းမှာပဲ ရှိမှာပါ။ key တစ်ခုတည်းရဲ့ row တွေက shard တစ်ခုတည်းမှာ စုနေမှာမို့၊ range နဲ့ ခွဲခွဲ hash နဲ့ ခွဲခွဲ အဲဒီ shard က ပူနေမှာပါ။
      [[mark:k-grow]] နောက်တစ်ချက်က ကြီးထွားလာမယ့် အချိန်အတွက် ကြိုစဉ်းစားထားဖို့ပါ။ hash တန်ဖိုးကို စက်အရေအတွက်နဲ့ စားပြီး shard ရွေးထားရင်၊ စက်တစ်လုံး ထပ်ထည့်တာနဲ့ data အများစု နေရာပြောင်းရပါတယ်။
      အပိုင်းသေးသေး အများကြီး ခွဲထားပြီး စက်တစ်လုံးပေါ် အပိုင်း အများကြီး တင်ထားရင်တော့၊ စက်အသစ်ဆီ အပိုင်း
      တချို့ကိုပဲ ရွှေ့ပေးရုံပါ။ key ကတော့ တစ်ခါ ရွေးပြီးရင် ပြန်ပြောင်းဖို့ အလွန် ခက်ပါတယ်။
    sources:
      - {
          title: "Designing Data-Intensive Applications, 2nd edition (Kleppmann, Riccomini)",
          url: "https://oreil.ly/DesigningDataIntensiveApps2",
        }
    actions:
      - {
          id: draw-k-open,
          type: whiteboard.apply,
          at: { mark: k-open },
          clear: true,
          upsertIds: [k-title, k-s1, k-s1-l, k-s2, k-s2-l, k-s3, k-s3-l],
          drawMs: 2800,
        }
      - {
          id: draw-k-range,
          type: whiteboard.apply,
          at: { mark: k-range },
          upsertIds: [k-r1, k-r2, k-r3],
          drawMs: 1500,
        }
      - {
          id: draw-k-range-hot,
          type: whiteboard.apply,
          at: { mark: k-range-hot },
          upsertIds: [k-hot, k-hot-l],
          drawMs: 1500,
        }
      - {
          id: reset-k,
          type: whiteboard.apply,
          at: { mark: k-hash },
          clear: true,
          upsertIds: [k-s1, k-s1-l, k-s2, k-s2-l, k-s3, k-s3-l],
        }
      - {
          id: draw-k-hash,
          type: whiteboard.apply,
          at: { mark: k-hash, offsetMs: 900 },
          upsertIds: [h-box, h-box-l, h-a1, h-a2, h-a3],
          drawMs: 2400,
        }
      - {
          id: draw-k-hash-cost,
          type: whiteboard.apply,
          at: { mark: k-hash-cost },
          upsertIds: [h-cost],
          drawMs: 1000,
        }
      - {
          id: draw-k-hotkey,
          type: whiteboard.apply,
          at: { mark: k-hotkey-ex },
          upsertIds: [h-hot, h-hot-l],
          drawMs: 1600,
        }

  - id: first
    chapter: Sharding မတိုင်ခင်
    narration: >
      [[mark:f-open]] ဒီလောက် စရိတ်ကြီးတာမို့ sharding ကို များသောအားဖြင့် နောက်ဆုံးမှ ရွေးကြပါတယ်။ အဲဒီ မတိုင်ခင် အရင်
      စမ်းစရာ သုံးခု ရှိပါတယ်။
      [[mark:f-archive]] ပထမက data အဟောင်းကို archive လုပ်တာပါ။ ခရီးစဉ် ပြီးသွားတာ နှစ်နှစ်ကျော်ပြီဖြစ်တဲ့
      လက်မှတ်တွေကို နေ့စဉ် အလုပ်မှာ ဘယ်သူမှ မဖတ်တော့ပါဘူး။ အဲဒါတွေကို သီးသန့် နေရာ ရွှေ့လိုက်ရင် အဓိက table က
      သေးသွားပါတယ်။
      [[mark:f-replica]] ဒုတိယက replica ထပ်ထည့်တာပါ။ load အများစုက ဖတ်တာဆိုရင် leader ကို လိုက်ကူးတဲ့ မိတ္တူ၊
      follower တွေနဲ့ပဲ ဖြေရှင်းလို့ ရပါတယ်။
      [[mark:f-bigger]] တတိယက ပိုကြီးတဲ့ စက်ကို ပြောင်းတာပါ။ ဈေးကြီးသလို၊ စက်တစ်လုံးကို တိုးလို့ရတဲ့ အမြင့်ဆုံး
      အကန့်အသတ်လည်း ရှိပါတယ်။ ဒါပေမဲ့ များသောအားဖြင့် code ပြင်စရာ မလိုပါဘူး။ sharding ကတော့ query တိုင်းကို
      ပြန်စစ်ရပြီး၊ လနဲ့ချီ ကြာတတ်ပါတယ်။
    sources:
      - {
          title: "Designing Data-Intensive Applications, 2nd edition (Kleppmann, Riccomini)",
          url: "https://oreil.ly/DesigningDataIntensiveApps2",
        }
    actions:
      - {
          id: close-keys,
          type: whiteboard.apply,
          at: { mark: f-open, offsetMs: -1500 },
          open: false,
        }
      - {
          id: show-first,
          type: slide.show,
          at: { mark: f-open, offsetMs: -1000 },
          slideId: try-first,
        }
      - {
          id: point-archive,
          type: slide.point,
          at: { mark: f-archive },
          target: { x: 0.15, y: 0.43 },
        }
      - {
          id: point-replica,
          type: slide.point,
          at: { mark: f-replica },
          target: { x: 0.15, y: 0.59 },
        }
      - {
          id: point-bigger,
          type: slide.point,
          at: { mark: f-bigger },
          target: { x: 0.15, y: 0.75 },
        }

  - id: adr
    chapter: မလုပ်သေးဘူး ဆိုတဲ့ ဆုံးဖြတ်ချက်
    narration: >
      [[mark:a-close]] အခု အောင်အောင် ကို ပေးမယ့် အဖြေကို architecture decision record၊ အတိုကောက် ADR
      တစ်ခုအဖြစ် ရေးပါမယ်။ ADR ဆိုတာ ဘာကို ဘာကြောင့် ဆုံးဖြတ်ခဲ့လဲ ရေးမှတ်ထားတဲ့ စာတိုလေးပါ။
      [[mark:sel-numbers]] အခြေအနေကို ကိန်းဂဏန်းနဲ့ အရင် ကြည့်ရအောင်။ leader ရဲ့ ရေးတဲ့ load က ပုံမှန်နေ့မှာ ၃
      ရာခိုင်နှုန်း၊ သင်္ကြန် လက်မှတ် ဖွင့်ရောင်းတဲ့ နေ့မှာတောင် ၆၀ ရာခိုင်နှုန်းပဲ ရှိပါတယ်။ disk ကလည်း ၃၅
      ရာခိုင်နှုန်းပဲ သုံးရသေးပါတယ်။ စက်တစ်လုံးက မနိုင်တော့တဲ့ အခြေအနေ မရောက်သေးပါဘူး။
      [[mark:type-decision]] ဒါကြောင့် ဆုံးဖြတ်ချက်က sharding မလုပ်သေးဘူး ဆိုတာပါ။ အရင်ဆုံး လက်မှတ်
      အဟောင်းတွေကို archive လုပ်ပါမယ်။
      [[mark:type-trigger]] ဒါပေမဲ့ မလုပ်သေးဘူး လို့ပဲ ရေးထားရင် ဘယ်တော့ ပြန်စဉ်းစားမလဲ ဆိုတာ ဘယ်သူမှ မသိပါဘူး။
      ဒါကြောင့် ပြန်စဉ်းစားရမယ့် အချက်ကို တိုင်းလို့ရတဲ့ ကိန်းဂဏန်းနဲ့ ရေးထားပါတယ်။
      [[mark:sel-trigger-num]] peak အချိန်မှာ ရေးတဲ့ load က ၈၀ ရာခိုင်နှုန်း ကျော်ရင်၊ ဒါမှမဟုတ် disk က ၇၀
      ရာခိုင်နှုန်း ကျော်ရင် ဒီ ADR ကို ပြန်သုံးသပ်ပါမယ်။ ရေးတဲ့ load က ရောင်းအားနဲ့ အချိုးကျ တက်တယ်ဆိုရင်၊ ၈၀ ရာခိုင်နှုန်း ဆိုတာ သင်္ကြန် ရောင်းအားက အခုထက် သုံးပုံတစ်ပုံလောက် တိုးလာရင် ရောက်မယ့် ကိန်းဂဏန်းပါ။ ဒီလို trigger ပါမှ မလုပ်သေးဘူး ဆိုတာက ရှောင်လွှဲတာ
      မဟုတ်ဘဲ ဆုံးဖြတ်ချက် ဖြစ်လာပါတယ်။
      [[mark:type-cons]] ရလဒ်တွေကိုလည်း ကောင်းတာရော ဆိုးတာရော ရေးပါတယ်။ ရတာက code ရေးတဲ့သူတွေက join နဲ့ transaction ကို အရင်အတိုင်း အားကိုးလို့ ရနေတာပါ။ ပေးရတာကတော့ ရေးတဲ့ load တိုးလာရင် ပိုကြီးတဲ့ စက် ဆိုတဲ့ လမ်း တစ်လမ်းပဲ ကျန်တာပါ။ ပြင်ဆင်ချိန်က လနဲ့ချီ လိုမှာမို့၊ trigger ရောက်မှ သိရင် နောက်ကျသွားပါပြီ။ ဒါကြောင့် ကိန်းဂဏန်းတွေကို အပတ်စဉ် ကြည့်ထားရပါမယ်။
      [[mark:a-answer]] အောင်အောင် ကို ပြန်ဖြေတဲ့အခါမှာတော့ ဒီ ADR ကို business စကားနဲ့ ပြောပါတယ်။ ပြိုင်ဘက်က
      သူတို့ ကိန်းဂဏန်းအရ လိုလို့ လုပ်တာ ဖြစ်နိုင်ပါတယ်။ ကိုယ်တို့ စက်ကတော့ သင်္ကြန်နေ့မှာတောင် ၄၀
      ရာခိုင်နှုန်း အားနေပါသေးတယ်။ အခု sharding လုပ်ရင် team တွေက လပေါင်းများစွာ feature အသစ် မထုတ်နိုင်ဘဲ၊
      ခရီးသည်အတွက် ဘာမှ ပိုမကောင်းလာပါဘူး။
    sources:
      - {
          title: "Designing Data-Intensive Applications, 2nd edition (Kleppmann, Riccomini)",
          url: "https://oreil.ly/DesigningDataIntensiveApps2",
        }
      - { title: "Architectural Decision Records", url: "https://adr.github.io/" }
