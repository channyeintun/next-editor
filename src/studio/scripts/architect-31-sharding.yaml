  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ တစ်နေ့ trigger ရောက်လာလို့ လက်မှတ် table ကို sharding လုပ်ရပြီ
      ဆိုပါစို့။ developer တစ်ယောက်က ခရီးသွားမယ့် ရက်စွဲကို shard key အဖြစ် သုံးဖို့ အဆိုပြုပါတယ်။ ရက်တစ်ရက်ရဲ့
      လက်မှတ်တွေ အားလုံး shard တစ်ခုထဲမှာ အတူရှိမှာမို့၊ ကားထွက်မယ့်နေ့ရဲ့ စာရင်းတွေကို ထုတ်ရတာ မြန်မယ်လို့
      ဆိုပါတယ်။
      [[mark:q-a]] ဒါက ကောင်းတဲ့ ရွေးချယ်မှုလား။
      [[mark:q-b]] ဒါမှမဟုတ် အန္တရာယ်ရှိတဲ့ ရွေးချယ်မှုလား။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ အန္တရာယ်ရှိတယ် ဆိုတာပါ။ ဘာကြောင့်လဲဆိုတော့ လက်မှတ်တွေက ခရီးသွားမယ့်
      ရက်တိုင်းအတွက် ညီညီမျှမျှ မရောင်းရလို့ပါ။ သင်္ကြန် မတိုင်ခင် ရက်အနည်းငယ်အတွက် လက်မှတ်တွေကို လူတွေက
      တစ်ပြိုင်တည်း ဝယ်ကြပါတယ်။
      [[mark:q-hot]] အဲဒီ ရက်တွေကို သိမ်းတဲ့ shard က ပုံမှန်ရဲ့ ၂၀ ဆကို တစ်ခုတည်း ခံရပြီး၊ ကျန်တဲ့ shard တွေက
      အားနေမှာပါ။ sharding လုပ်ပြီးတာတောင် သင်္ကြန်နေ့မှာ စက်တစ်လုံးတည်းနဲ့ ရင်ဆိုင်ရတာနဲ့ အတူတူပါပဲ။
      [[mark:q-rule]] shard key ကို ရွေးတဲ့အခါ query ဘယ်လောက် မြန်မလဲ ဆိုတာထက်၊ ရေးတဲ့ load က ဘယ်လို ပြန့်မလဲ
      ဆိုတာကို အရင် ကြည့်ရပါတယ်။
    sources:
      - {
          title: "Designing Data-Intensive Applications, 2nd edition (Kleppmann, Riccomini)",
          url: "https://oreil.ly/DesigningDataIntensiveApps2",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [q-title],
          drawMs: 1200,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-why,
          type: whiteboard.apply,
          at: { mark: q-hot },
          upsertIds: [q-why],
          drawMs: 1200,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: q-rule },
          upsertIds: [q-r],
          drawMs: 1200,
        }

  - id: your-turn
    chapter: ကိုယ့် system အတွက်
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ ကိုယ့် system မှာ sharding လိုမလို အခုချက်ချင်း မဆုံးဖြတ်ပါနဲ့။ lesson
      ကို pause လုပ်ပြီး၊ ဒီ ADR ရဲ့ trigger စာကြောင်းနေရာမှာ ကိုယ့် system အတွက် trigger ကို ကိန်းဂဏန်းနဲ့
      ရေးကြည့်ပါ။
      [[mark:turn-2]] အဲဒီ ကိန်းဂဏန်းက အခု ဘယ်လောက် ရှိနေလဲ ကိုယ် မသိဘူးဆိုရင်၊ ပထမဆုံး လုပ်ရမှာက sharding
      မဟုတ်ဘဲ တိုင်းတာတာပါ။ trigger ကို load ရာခိုင်နှုန်းနဲ့ ဖြစ်ဖြစ်၊ row အရေအတွက်နဲ့ ဖြစ်ဖြစ်၊
      တုံ့ပြန်ချိန်နဲ့ ဖြစ်ဖြစ် ရေးလို့ ရပါတယ်။ အရေးကြီးတာက တိုင်းလို့ ရတဲ့ ကိန်းဂဏန်း ဖြစ်ဖို့ပါ။
    sources:
      - {
          title: "Designing Data-Intensive Applications, 2nd edition (Kleppmann, Riccomini)",
          url: "https://oreil.ly/DesigningDataIntensiveApps2",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: turn }, open: false }
      - id: sel-trigger
        type: editor.select
        at: { mark: turn, offsetMs: 2200 }
        target:
          {
            file: notebook/31-adr-not-yet.md,
            text: "- ပြန်သုံးသပ်မယ့် trigger: peak write load 80 % ကျော်ရင်၊ ဒါမှမဟုတ် disk 70 % ကျော်ရင်",
          }

  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ sharding က စက်တစ်လုံးက data ကို မဆံ့တော့တဲ့အခါ၊ ဒါမှမဟုတ် ရေးတာကို
      မနိုင်တော့တဲ့အခါမှ သုံးရတဲ့ နည်းပါ။ ပြိုင်ဘက်က လုပ်လို့ လိုက်လုပ်ရမယ့် အရာ မဟုတ်ပါဘူး။ shard ဖြတ်တဲ့
      query နဲ့ transaction တွေ၊ data ရွှေ့ရတာတွေနဲ့ hot shard တွေကို ပေးဆပ်ရပြီး၊ အဲဒါတွေ အားလုံးကို shard key
      က ဆုံးဖြတ်ပါတယ်။
      [[mark:recap-adr]] မလုပ်သေးဘူးလို့ ဆုံးဖြတ်ရင်လည်း၊ ဘယ်ကိန်းဂဏန်း ရောက်ရင် ပြန်စဉ်းစားမလဲ ဆိုတာကို
      ရေးထားပါ။
      [[mark:next]] database တစ်ခုတည်းမှာ ဆက်နေတော့ transaction ကို ဆက်သုံးနိုင်ပါသေးတယ်။ ဒါပေမဲ့ transaction
      ရှိရုံနဲ့ ထိုင်ခုံ တစ်ခုံကို နှစ်ခါ ရောင်းမိတာကို ကာကွယ်နိုင်ရဲ့လား။ နောက် lesson မှာတော့ transaction နဲ့
      isolation ကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "Designing Data-Intensive Applications, 2nd edition (Kleppmann, Riccomini)",
          url: "https://oreil.ly/DesigningDataIntensiveApps2",
        }
    actions:
      - id: sel-title
        type: editor.select
        at: { mark: recap-adr }
        target: { file: notebook/31-adr-not-yet.md, text: "primary database ကို sharding မလုပ်သေးဘူး" }
      - id: sel-join
        type: editor.select
        at: { mark: next }
        target:
          {
            file: notebook/31-adr-not-yet.md,
            text: "+ join နဲ့ transaction တွေ database တစ်ခုတည်းထဲမှာ ဆက်ရှိတယ်",
          }

checks:
  - { type: timing.p95Ms, max: 300 }
