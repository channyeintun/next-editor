# Go course, lesson 13: maps (Burmese).
#
# Start state: main.go with a parenthesized import block holding "fmt" and an empty `func main`.
# Edits, all insert-only:
#   1. `var dict map[string]string`, `dict["rain"] = "မိုး"` and a Println of `dict["rain"]` ->
#      run-1: panic `assignment to entry in nil map` (nothing printed before it);
#   2. `dict = make(map[string]string)` under the var line, then book and school, then
#      `meaning, ok := dict["snow"]` printed with `%q %v` -> run-2: မိုး / "" false;
#   3. "maps" and "slices" into the import block, `delete(dict, "school")` and the loop over
#      `slices.Sorted(maps.Keys(dict))` -> run-3 adds book စာအုပ် / rain မိုး.
# Boards: (M) a map is a two-column word list (key, value), a key goes straight to its row, no
# first row; (N) nil map vs make: reading a nil map gives the zero value, writing panics, nil is
# not empty; (O) range order over a map is not fixed, so sort the keys; (Q) quiz.
# Fixtures: bun ~/Documents/go-course-work/tools/sim-go.ts <this yaml> --write
schemaVersion: 1

