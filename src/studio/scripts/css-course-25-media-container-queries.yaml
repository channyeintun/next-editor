# CSS course (Burmese), lesson 25 of 43: media queries and container queries.
#
# Narration is Burmese (voice-script.md next to this file is the same text
# with marks inline; DESIGN.md is the span-by-span brief). Every [[mark:…]]
# sits where its action begins, at a sentence end or after a ၊ pause.
# Everything the learner sees (title, chapters, whiteboard labels, UI strings)
# is Burmese already.
#
# Shape: board A (recall lesson 24; media query = viewport/device, container
# query = the box a component sits in; the preview is always narrow) → board B
# (pointer / any-pointer / hover for a phone, a laptop and a touch laptop; the
# viewer's device decides) → code tour (tiny plus card, special slot, two snack
# slots, empty styles.css, preview) → plus button 24 → 44 px (WCAG 2.2 AA/AAA),
# touch-action: manipulation → board C (touch-action values, Pointer Events,
# never disable zoom) → board D (two steps; descendants only; three
# container-type values) → containers (no change) → the first @container rule:
# the special card turns horizontal, the snack cards stay stacked → .special
# width 60% (stacks) → 100% (horizontal again) → board E (range, colon,
# and/or/not, chained ranges, size-only features) → .snack-slots
# container-type: size collapses the dashed box (cards spill over the footer)
# → board F (width from outside, height not from children; containing block,
# stacking context; shrink-to-fit trap) → inline-size fixes it → the container
# shorthand names the special slot → @container special shows the badge on the
# special card only → board G (cqi math, the six units, fallback) → clamp with
# 5cqi on the names (20 px wide, 16 px floor narrow) → @container nested in
# .menu-card (sienna border on the wide card) → board H (style, name-only,
# scroll-state queries, DevTools badge) → quiz board + recap, Part 3 closes,
# hand-off to pseudo-elements (lesson 26).
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set(; no postcss config; no reload.
# Every rule that contains a parenthesis is typed at the END of the file, so a
# half-typed "(" can never swallow the rules after it. Keyword values have no
# misleading valid prefix ("inline" alone is invalid for container-type,
# "sien…" for sienna), unitless partial numbers are invalid, and
# "grid-template-columns: auto" passes through a single full-width column (the
# card looks stacked, as before). The container shorthand line is line-by-line:
# typed by keystroke, "container: s…special" would be a valid name with type
# normal and the special card would flicker to stacked.
#
# Measured in headless Chrome at 432 × 720 (probe/stages.ts, same anchors):
# plus button 13×14 → 24×24 → 44×44. Special slot 400 wide, snack slots 184
# wide each. First query: special card grid (picture left), snack cards block.
# width 60% → special slot 240, card block; 100% → 400, grid. size on the
# snack area: its box 400×20 (padding + border only), the cards hang out and
# the footer moves up under them (y 618 → 395); inline-size: back to 242 tall.
# Named query (> 150px, so the 184 px snack slots pass the width test and
# fail only on the name): badge inline on the special card only. clamp(16px, 5cqi, 24px):
# special name 20px, snack names 16px. Nested rule: special card border sienna.
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
