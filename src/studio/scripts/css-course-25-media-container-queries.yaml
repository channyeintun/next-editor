build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 4125

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  - id: queries-intro
    chapter: "Media query နဲ့ container query"
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ box ထဲ မဆံ့တဲ့ content အကြောင်း ကြည့်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့
      ရတဲ့ နေရာနဲ့ ကိုက်အောင် layout ပြောင်းတဲ့ component တွေကို ကြည့်ပါမယ်။
      [[mark:start-server]] ဒီလို ပြောနေတုန်းမှာပဲ၊ board နောက်မှာ dev server ကို စနေပါပြီ။
      [[mark:draw-viewport]] media query က page ကို မြင်ရတဲ့ viewport အကြောင်း၊ ဒါမှမဟုတ်
      ကြည့်နေတဲ့ စက် အကြောင်းကို မေးပါတယ်။ [[mark:draw-narrow]] ကိုယ့် preview ကတော့ အမြဲ
      ဖုန်း screen လောက်ပဲ ကျယ်ပါတယ်။ ဒါကြောင့် lesson 5 က screen ကျယ်မှ အလုပ်လုပ်တဲ့ media
      query က ဒီမှာ တစ်ခါမှ မကိုက်ခဲ့တာပါ။ [[mark:draw-containers]] container query ကတော့
      viewport ကို မကြည့်ဘဲ၊ component ကို ထည့်ထားတဲ့ container ရဲ့ အကျယ်ကို ကြည့်ပြီး ပုံစံ
      ပြောင်းပါတယ်။ [[mark:draw-cards]] ဒါကြောင့် screen တစ်ခုတည်းပေါ်မှာပဲ menu card
      တစ်မျိုးတည်းက ကျယ်တဲ့ နေရာမှာ ဘေးတိုက်၊ ကျဉ်းတဲ့ နေရာမှာ အပေါ်အောက် ဖြစ်နိုင်ပါတယ်။
      [[mark:draw-roles]] page တစ်ခုလုံးရဲ့ layout အတွက် media query ကို ဆက်သုံးပြီး၊
      ပြန်သုံးတဲ့ component တွေအတွက်တော့ container query ကို သုံးပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Container queries"
        url: "https://web.dev/learn/css/container-queries"
      - title: "MDN — Using media queries"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_media_queries/Using_media_queries"
      - title: "MDN — CSS container queries"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_containment/Container_queries"
    actions:
      - id: open-intro-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      # Runs in the background (boot + pnpm install + spawn); waitForReady sits
      # on the preview mark in the code tour, well over 40 s of narration later.
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 45000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-viewport
        type: whiteboard.apply
        at: { mark: draw-viewport }
        upsertIds: [a-viewport, a-viewport-l, a-viewport-l2]
        drawMs: 2000
      - id: draw-narrow
        type: whiteboard.apply
        at: { mark: draw-narrow }
        upsertIds: [a-narrow]
        drawMs: 900
      - id: draw-containers
        type: whiteboard.apply
        at: { mark: draw-containers }
        upsertIds: [a-wide-box, a-narrow-box, a-cq-l, a-cq-l2]
        drawMs: 2200
      - id: draw-cards
        type: whiteboard.apply
        at: { mark: draw-cards }
        upsertIds: [a-wide-card, a-wide-img, a-narrow-card, a-narrow-img]
        drawMs: 2000
      - id: draw-roles
        type: whiteboard.apply
        at: { mark: draw-roles }
        upsertIds: [a-role-page, a-role-comp]
        drawMs: 1800

  - id: media-features
    narration: >
      [[mark:open-features]] media query က အကျယ် အပြင် တခြား အရာတွေကိုလည်း မေးနိုင်ပါတယ်။
      [[mark:draw-pointer]] pointer က အဓိက input ဘယ်လောက် တိကျလဲ ဆိုတာ မေးပါတယ်။ mouse၊
      trackpad ဒါမှမဟုတ် stylus ဆိုရင် fine၊ လက်ချောင်းဆိုရင် coarse ဖြစ်ပြီး၊ TV remote လို
      pointer လုံးဝ မရှိရင်တော့ none ပါ။ touchscreen ပါတဲ့ laptop ကတောင် အဓိက input က
      trackpad ဖြစ်နေသေးလို့ fine ပါပဲ။ [[mark:draw-any-pointer]] any pointer ကတော့
      ချိတ်ထားတဲ့ input အားလုံးကို မေးလို့၊ touch laptop မှာ fine ရော coarse ရော မှန်ပါတယ်။
      [[mark:draw-hover]] hover နဲ့ any hover ကလည်း ဒီလိုပါပဲ။ input က element ပေါ်မှာ
      မနှိပ်ဘဲ တင်ထားလို့ ရလား ဆိုတာ မေးပါတယ်။ [[mark:draw-code]] ရေးတဲ့အခါ အကျယ်ကို မေးတဲ့
      query လိုပဲ၊ feature နဲ့ သူ့ တန်ဖိုးကို ကွင်းထဲမှာ ရေးပါတယ်။ [[mark:draw-viewer]]
      သတိထားရမှာက၊ ဒီ query တွေကို ကြည့်နေတဲ့သူရဲ့ စက်ကပဲ ဖြေတာပါ။ preview က ဖုန်းမှာ
      တစ်မျိုး၊ laptop မှာ တစ်မျိုး ဖြစ်နိုင်လို့၊ board ပေါ်မှာပဲ ရှင်းပြပါမယ်။
    sources:
      - title: "web.dev Learn CSS — Cursors and pointers: responding to a user's pointer inputs"
        url: "https://web.dev/learn/css/cursors-and-pointers#responding_to_a_users_pointer_inputs"
      - title: "MDN — @media pointer"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/@media/pointer"
      - title: "MDN — @media any-pointer"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/@media/any-pointer"
      - title: "MDN — @media hover"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/@media/hover"
      - title: "Media Queries Level 4 — interaction media features"
        url: "https://www.w3.org/TR/mediaqueries-4/#mf-interaction"
    actions:
      - id: open-features
        type: whiteboard.apply
        at: { mark: open-features }
        clear: true
        upsertIds: [b-title]
      - id: draw-pointer
        type: whiteboard.apply
        at: { mark: draw-pointer }
        upsertIds: [b-h-pointer, b-phone, b-laptop, b-touch, b-phone-p, b-laptop-p, b-touch-p]
        drawMs: 3200
      - id: draw-any-pointer
        type: whiteboard.apply
        at: { mark: draw-any-pointer }
        upsertIds: [b-h-any, b-phone-a, b-laptop-a, b-touch-a]
        drawMs: 2000
      - id: draw-hover
        type: whiteboard.apply
        at: { mark: draw-hover }
        upsertIds: [b-h-hover, b-phone-h, b-laptop-h, b-touch-h]
        drawMs: 1800
      - id: draw-code
        type: whiteboard.apply
        at: { mark: draw-code }
        upsertIds: [b-code]
        drawMs: 1400
      - id: draw-viewer
        type: whiteboard.apply
        at: { mark: draw-viewer }
        upsertIds: [b-viewer]
        drawMs: 1400

  - id: code-tour
    narration: >
      [[mark:close-features]] project ကို ကြည့်ရအောင်။ [[mark:open-index]] ဒါက HTML ဖိုင်ပါ။
      [[mark:select-plus]] အပေါ်ဆုံးမှာ လက်ဖက်ရည် တစ်ခွက် ထပ်ယူဖို့ plus ခလုတ် ပါတဲ့ card
      သေးသေးလေး ရှိပါတယ်။ [[mark:select-special]] သူ့အောက်မှာ ယနေ့အထူး သောက်စရာအတွက် အထူး
      နေရာ ရှိပြီး၊ အထဲက menu card မှာ ပုံ အရင်၊ စာသား နောက်က လာပါတယ်။ [[mark:select-slots]]
      ပြီးတော့ စားစရာ အပိုင်းမှာ ဘေးချင်းကပ် နေရာ နှစ်ခု ရှိပြီး၊ ပုံစံ တူ card တစ်ခုစီ
      ထည့်ထားပါတယ်။ card တိုင်းမှာ ဖျောက်ထားတဲ့ ယနေ့အထူး badge လည်း ပါပါတယ်။
      [[mark:open-styles]] CSS ဖိုင်ကတော့ အလွတ်ပါ။ [[mark:preview-opens]] preview
      ပွင့်လာပါပြီ။ card သုံးခုလုံးမှာ ပုံက အပေါ်၊ စာသားက အောက်မှာ ဆင့်နေပြီး၊ plus
      ခလုတ်ကတော့ သေးလွန်းနေပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Container queries: one component in many contexts"
        url: "https://web.dev/learn/css/container-queries"
    actions:
      - id: close-features
        type: whiteboard.apply
        at: { mark: close-features }
        open: false
      - id: open-index
        type: workspace.openFile
        at: { mark: open-index }
        path: index.html
      - id: select-plus
        type: editor.select
        at: { mark: select-plus }
        target:
          {
            file: index.html,
            text: '<button class="plus" type="button" aria-label="တစ်ခွက် ထပ်ထည့်" data-testid="plus-button">+</button>',
            occurrence: 1,
          }
      - id: select-special
        type: editor.select
        at: { mark: select-special }
        target:
          {
            file: index.html,
            text: '<div class="special" data-testid="special-slot">',
            occurrence: 1,
          }
      - id: select-slots
        type: editor.select
        at: { mark: select-slots }
        target:
          {
            file: index.html,
            text: '<div class="snack-slots" data-testid="snack-slots">',
            occurrence: 1,
          }
      - id: open-styles
        type: workspace.openFile
        at: { mark: open-styles }
        path: styles.css
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { mark: preview-opens }
        timeoutMs: 20000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-dev-server }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-plus
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: plus-button }
        attribute: { name: aria-label, value: "တစ်ခွက် ထပ်ထည့်" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-special
        type: expect.preview
        at: { afterAction: expect-plus }
        timeoutMs: 5000
        target: { by: testId, value: card-laphet-yay }
        textContains: "လက်ဖက်ရည်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-snacks
        type: expect.preview
        at: { afterAction: expect-special }
        timeoutMs: 5000
        target: { by: testId, value: snack-slots }
        textContains: "အီကြာကွေး"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: collapse-runner-dock
        type: runtime.collapseDock
        at: { afterAction: expect-snacks }

  - id: target-size
    chapter: "နှိပ်ရ လွယ်တဲ့ ခလုတ်"
    narration: >
      plus ခလုတ်ကနေ စကြည့်ရအောင်။ mouse က ခလုတ် သေးသေးလေးကိုလည်း နှိပ်နိုင်ပေမယ့်၊
      လက်ချောင်းထိပ်က အဲဒီလောက် မတိကျပါဘူး။ လက်တုန်တဲ့သူတွေလည်း ခလုတ် သေးရင် လွဲတတ်ပါတယ်။
      [[mark:type-plus24]] ဒါကြောင့် ခလုတ်ကို အနည်းဆုံး အကျယ်နဲ့ အနည်းဆုံး အမြင့် ပေးပါမယ်။
      content များရင် ခလုတ်က ကြီးလာနိုင်ပေမယ့်၊ ဒီ အရွယ်ထက်တော့ ဘယ်တော့မှ မသေးတော့ပါဘူး။
      [[mark:after-plus24]] အခု ခလုတ်က အကျယ်ရော အမြင့်ပါ 24 pixel ဖြစ်သွားပါပြီ။ ဒါက
      လူတိုင်း သုံးနိုင်ဖို့ ရေးထားတဲ့ accessibility လမ်းညွှန်ချက် WCAG 2.2 ရဲ့ AA အဆင့်က
      အငယ်ဆုံး အရွယ်ပါ။ ခလုတ် ပတ်လည်မှာ နေရာလွတ် လုံလောက်ရင်တော့ ဒီထက် သေးလို့ ရပါတယ်။
      [[mark:type-plus44]] AAA အဆင့်ကတော့ 44 pixel ကို တောင်းပြီး၊ Apple ကလည်း touchscreen
      အတွက် ဒီ အရွယ်ကို အကြံပြုပါတယ်။ နောက်မှ ရေးတဲ့ declaration က နိုင်ပါတယ်။
      [[mark:after-plus44]] ခလုတ် ထပ်ကြီးလာလို့ လက်ချောင်းနဲ့ နှိပ်ရင်လည်း မလွဲတော့ပါဘူး။
      ဒါကို coarse pointer media query ထဲမှာပဲ ထားလို့ ရပေမယ့်၊ ခလုတ် ကြီးတာက လူတိုင်းကို
      ကူညီပါတယ်။ [[mark:type-touch]] နောက်ထပ် တစ်ကြောင်းက touchscreen မှာပဲ အလုပ်လုပ်တဲ့
      touch action manipulation ပါ။ [[mark:explain-touch]] ဒီ touch action ကို ကြည့်ပါ။
      element ပေါ်မှာ browser က ဘယ် gesture တွေကို handle လုပ်ခွင့် ရှိလဲ ဆိုတာ ပြောပါတယ်။
      manipulation က scroll နဲ့ pinch zoom ကို ဆက်ခွင့်ပြုပြီး၊ နှစ်ချက် ဆက်နှိပ်ရင် zoom
      ဖြစ်တာကိုပဲ ပိတ်ပါတယ်။ ဒါကြောင့် browser က ဒုတိယ အချက် နှိပ်မလားလို့ မစောင့်တော့ဘဲ၊
      မြန်မြန် နှစ်ချက် နှိပ်ရင် နှစ်ခွက် ရပါတယ်။ touchscreen လိုလို့ preview မှာတော့ ဘာမှ
      မပြောင်းပါဘူး။
    sources:
      - title: "web.dev Learn CSS — Cursors and pointers"
        url: "https://web.dev/learn/css/cursors-and-pointers"
      - title: "W3C — Understanding SC 2.5.8: Target Size (Minimum), WCAG 2.2"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/target-size-minimum"
      - title: "W3C — Understanding SC 2.5.5: Target Size (Enhanced)"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/target-size-enhanced"
      - title: "Apple Human Interface Guidelines — Accessibility (44 × 44 pt hit targets)"
        url: "https://developer.apple.com/design/human-interface-guidelines/accessibility"
      - title: "MDN — touch-action (manipulation)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/touch-action"
    actions:
      - id: type-plus24
        type: editor.type
        at: { mark: type-plus24 }
        cadence: fast-explainer
        target: { file: styles.css, after: "", occurrence: 1 }
        text: ".plus {\n  min-width: 24px;\n  min-height: 24px;\n}\n"
      - id: expect-plus24
        type: expect.preview
        at: { mark: after-plus24 }
        timeoutMs: 4000
        target: { by: testId, value: plus-button }
        textContains: "+"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-plus44
        type: editor.type
        at: { mark: type-plus44 }
        cadence: fast-explainer
        target: { file: styles.css, after: "  min-height: 24px;\n", occurrence: 1 }
        text: "  min-width: 44px;\n  min-height: 44px;\n"
      - id: expect-plus44
        type: expect.preview
        at: { mark: after-plus44 }
        timeoutMs: 4000
        target: { by: testId, value: tiny-plus }
        textContains: "လက်ဖက်ရည် တစ်ခွက် ထပ်ယူမယ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-touch
        type: editor.type
        at: { mark: type-touch }
        cadence: fast-explainer
        target: { file: styles.css, after: "  min-height: 44px;\n", occurrence: 1 }
        text: "  touch-action: manipulation;\n"
      - id: select-touch
        type: editor.select
        at: { mark: explain-touch }
        target: { file: styles.css, text: "touch-action: manipulation;", occurrence: 1 }

  - id: touch-board
    narration: >
      [[mark:open-touch]] touch action မှာ တခြား တန်ဖိုးတွေလည်း ရှိပါတယ်။
      [[mark:draw-touch-values]] none က element ပေါ်က gesture အားလုံးကို ပိတ်ပါတယ်။ pan x က
      ဘယ်ညာ၊ pan y က အပေါ်အောက် scroll လုပ်တာကိုပဲ ခွင့်ပြုပြီး၊ pinch zoom က zoom ကို
      ခွင့်ပြုပါတယ်။ [[mark:draw-touch-js]] မြေပုံ ဒါမှမဟုတ် ပုံဆွဲတဲ့ နေရာမျိုးမှာ gesture
      တွေကို ပိတ်ပြီး၊ JavaScript ထဲမှာ pointer events နဲ့ ကိုယ်တိုင် handle လုပ်ပါတယ်။
      [[mark:draw-zoom]] ဒါပေမဲ့ page တစ်ခုလုံးရဲ့ zoom ကို touch action none နဲ့ဖြစ်ဖြစ်၊
      viewport meta tag နဲ့ဖြစ်ဖြစ် မပိတ်ပါနဲ့။ အမြင်အာရုံ အားနည်းတဲ့သူတွေက zoom ချဲ့ပြီး
      ဖတ်ကြလို့ပါ။
    sources:
      - title: "web.dev Learn CSS — Cursors and pointers: disabling specific touchscreen gestures"
        url: "https://web.dev/learn/css/cursors-and-pointers#disabling_specific_touchscreen_gestures"
      - title: "MDN — touch-action"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/touch-action"
      - title: "MDN — Pointer events"
        url: "https://developer.mozilla.org/en-US/docs/Web/API/Pointer_events"
      - title: "W3C — Understanding SC 1.4.4: Resize Text"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/resize-text"
    actions:
      - id: open-touch
        type: whiteboard.apply
        at: { mark: open-touch }
        open: true
        clear: true
        upsertIds: [c-title, c-prop, c-manip]
      - id: draw-touch-values
        type: whiteboard.apply
        at: { mark: draw-touch-values }
        upsertIds: [c-values]
        drawMs: 2000
      - id: draw-touch-js
        type: whiteboard.apply
        at: { mark: draw-touch-js }
        upsertIds: [c-js]
        drawMs: 1600
      - id: draw-zoom
        type: whiteboard.apply
        at: { mark: draw-zoom }
        upsertIds: [c-zoom, c-zoom-code]
        drawMs: 2000

  - id: two-steps
    chapter: "Container query ရဲ့ အဆင့် နှစ်ဆင့်"
    narration: >
      [[mark:open-steps]] အခု container query ပါ။ သူ့မှာ အဆင့် နှစ်ဆင့် ရှိပါတယ်။
      [[mark:draw-step1]] ပထမ အဆင့်မှာ ancestor တစ်ခုကို container type နဲ့ container အဖြစ်
      သတ်မှတ်ပါတယ်။ [[mark:draw-step2]] ဒုတိယ အဆင့်မှာ condition ပါတဲ့ container rule
      တစ်ခုက၊ ဒီ card လို အဲဒီ container ထဲက element တွေကို style ပေးပါတယ်။
      [[mark:draw-not-self]] container ကိုယ်တိုင်ကိုတော့ ဘယ်တော့မှ style မပေးပါဘူး။ box က
      သူ့ အရွယ်အစားကို မေးပြီး အရွယ်အစား ပြန်ပြောင်းရင်၊ အဖြေက မှန်လိုက် မှားလိုက်
      ဖြစ်နေနိုင်လို့ပါ။ [[mark:draw-types]] container type မှာ တန်ဖိုး သုံးခု ရှိပါတယ်။
      default ဖြစ်တဲ့ normal ဆိုရင် အရွယ်အစားကို မေးလို့ မရပါဘူး။ inline size က စာရေးတဲ့
      ဦးတည်ရာအတိုင်း အကျယ်ကိုပဲ မေးခွင့် ပေးပြီး၊ size ကတော့ အကျယ်ရော အမြင့်ရော မေးခွင့်
      ပေးပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Container queries: setting up a container query"
        url: "https://web.dev/learn/css/container-queries#setting_up_a_container_query"
      - title: "web.dev Learn CSS — Container queries: defining a container"
        url: "https://web.dev/learn/css/container-queries#defining_a_container"
      - title: "MDN — container-type"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/container-type"
    actions:
      - id: open-steps
        type: whiteboard.apply
        at: { mark: open-steps }
        clear: true
        upsertIds: [d-title]
      - id: draw-step1
        type: whiteboard.apply
        at: { mark: draw-step1 }
        upsertIds: [d-container, d-step1, d-step1b]
        drawMs: 2000
      - id: draw-step2
        type: whiteboard.apply
        at: { mark: draw-step2 }
        upsertIds: [d-card, d-step2, d-step2b]
        drawMs: 2000
      - id: draw-not-self
        type: whiteboard.apply
        at: { mark: draw-not-self }
        upsertIds: [d-not-self]
        drawMs: 1400
      - id: draw-types
        type: whiteboard.apply
        at: { mark: draw-types }
        upsertIds: [d-types]
        drawMs: 1400

  - id: first-query
    narration: >
      [[mark:close-steps]] ပထမ အဆင့်ကို editor ထဲမှာ ရေးပါမယ်။ [[mark:type-containers]] အထူး
      နေရာနဲ့ စားစရာ နေရာ နှစ်ခုကို container လုပ်ပါမယ်။ အဲဒီအခါ သူတို့ကို inline size
      အကြောင်း မေးရင် ဖြေနိုင်ပါပြီ။ [[mark:after-containers]] card တွေမှာ ဘာမှ
      မပြောင်းသေးပါဘူး။ container ဖြစ်ရုံနဲ့ မပြောင်းဘဲ၊ rule တစ်ခုက မေးမှ ပြောင်းတာပါ။
      [[mark:type-query]] ဒုတိယ အဆင့်က မေးခွန်း မေးတာပါ။ container rule တစ်ခု ရေးပြီး၊ သူ့
      condition က container ရဲ့ အကျယ် 300 pixel ထက် ကျယ်လား ဆိုတာ မေးပါတယ်။
      [[mark:type-query-body]] ကျယ်တယ်ဆိုရင် menu card က lesson 18 မှာလို grid
      ဖြစ်သွားပါမယ်။ ပထမ column က ပုံ အကျယ်လောက်ပဲ ရှိပြီး၊ စာသားက ကျန်တဲ့ နေရာကို ယူပါမယ်။
      column နှစ်ခုကြားမှာ gap လည်း ထည့်ပါမယ်။ preview ကို ကြည့်ထားပါ။ [[mark:after-query]]
      အထူး နေရာက card မှာ ပုံက ဘယ်ဘက်၊ စာသားက ညာဘက် ရောက်သွားပါပြီ။ စားစရာ card တွေကတော့
      အပေါ်အောက် ဆင့်နေတုန်းပါ။ [[mark:select-condition]] ဒီ condition ကို ကြည့်ပါ။ lesson 5
      မှာ တွေ့ခဲ့တဲ့ range syntax ပါ။ အထူး နေရာက 400 pixel ကျယ်လို့ အဲဒီမှာ မှန်ပြီး၊ 184
      pixel ပဲ ရှိတဲ့ စားစရာ နေရာတွေမှာတော့ မှားပါတယ်။ card တစ်မျိုး၊ rule တစ်ခုနဲ့ layout
      နှစ်မျိုး ရသွားပါပြီ။
    sources:
      - title: "web.dev Learn CSS — Container queries: container query conditions"
        url: "https://web.dev/learn/css/container-queries#container_query_conditions"
      - title: "MDN — @container"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/@container"
      - title: "MDN — grid-template-columns"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/grid-template-columns"
    actions:
      - id: close-steps
        type: whiteboard.apply
        at: { mark: close-steps }
        open: false
      - id: type-containers
        type: editor.type
        at: { mark: type-containers }
        cadence: fast-explainer
        target: { file: styles.css, after: "  touch-action: manipulation;\n}\n", occurrence: 1 }
        text: "\n.special,\n.slot {\n  container-type: inline-size;\n}\n"
      - id: expect-containers
        type: expect.preview
        at: { mark: after-containers }
        timeoutMs: 4000
        target: { by: testId, value: special-slot }
        textContains: "ချိုဆိမ့် ပေါ့ဆိမ့် ကြိုက်သလို"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-query
        type: editor.type
        at: { mark: type-query }
        cadence: fast-explainer
        target: { file: styles.css, after: "  container-type: inline-size;\n}\n", occurrence: 1 }
        text: "\n@container (inline-size > 300px) {\n  .menu-card {\n"
      # The declarations the narration summarises; typed at the end of the file,
      # so the open blocks above are harmless while they land.
      - id: type-query-body
        type: editor.type
        at: { mark: type-query-body }
        cadence: line-by-line
        target:
          {
            file: styles.css,
            after: "@container (inline-size > 300px) {\n  .menu-card {\n",
            occurrence: 1,
          }
        text: "    display: grid;\n    grid-template-columns: auto 1fr;\n    gap: 12px;\n  }\n}\n"
      - id: expect-query
        type: expect.preview
        at: { mark: after-query }
        timeoutMs: 4000
        target: { by: testId, value: card-laphet-yay }
        textContains: "1,500 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-condition
        type: editor.select
        at: { mark: select-condition }
        target: { file: styles.css, text: "(inline-size > 300px)", occurrence: 1 }

  - id: resize-container
    narration: >
      [[mark:type-w60]] အခု အထူး နေရာရဲ့ အကျယ်ကိုပဲ 60 ရာခိုင်နှုန်း ပြောင်းကြည့်ရအောင်။
      အထူး card ကို ကြည့်ထားပါ။ [[mark:after-w60]] 240 pixel မှာ condition မမှန်တော့လို့၊
      card က အပေါ်အောက် ပြန်ဆင့်သွားပါပြီ။ [[mark:type-w100]] အကျယ် အပြည့်ကို
      ပြန်ပေးလိုက်ရအောင်။ [[mark:after-w100]] ဘေးတိုက် ပြန်ဖြစ်သွားပါပြီ။ window အရွယ်
      မပြောင်းဘဲ container ပဲ ပြောင်းလို့၊ card က container ကို လိုက်သွားတာပါ။
    sources:
      - title: "web.dev Learn CSS — Container queries"
        url: "https://web.dev/learn/css/container-queries"
      - title: "MDN — Container size and style queries"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_containment/Container_size_and_style_queries"
    actions:
      - id: type-w60
        type: editor.type
        at: { mark: type-w60 }
        cadence: fast-explainer
        target: { file: styles.css, after: "    gap: 12px;\n  }\n}\n", occurrence: 1 }
        text: "\n.special {\n  width: 60%;\n}\n"
      - id: expect-w60
        type: expect.preview
        at: { mark: after-w60 }
        timeoutMs: 4000
        target: { by: testId, value: card-laphet-yay }
        textContains: "မှာမယ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-w100
        type: editor.type
        at: { mark: type-w100 }
        cadence: fast-explainer
        target: { file: styles.css, after: "  width: 60%;\n", occurrence: 1 }
        text: "  width: 100%;\n"
      - id: expect-w100
        type: expect.preview
        at: { mark: after-w100 }
        timeoutMs: 4000
        target: { by: testId, value: special-slot }
        textContains: "လက်ဖက်ရည်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: conditions-board
    narration: >
      [[mark:open-conditions]] condition ရေးနည်း တခြား ပုံစံတွေလည်း ရှိပါတယ်။
      [[mark:draw-range]] range syntax မှာ ငယ်တာ၊ ကြီးတာ၊ ညီရင်လည်း ရတဲ့ ပုံစံ နှစ်ခုနဲ့
      ညီတာ ဆိုတဲ့ သင်္ကေတ ငါးခုကို သုံးပါတယ်။ [[mark:draw-colon]] min နဲ့ max ပါတဲ့ colon
      ပုံစံ အဟောင်းကလည်း အလုပ်လုပ်ပါသေးတယ်။ min width 300 pixel ဆိုတာ အကျယ် အနည်းဆုံး 300
      pixel ပါ။ [[mark:draw-logic]] condition တစ်ခုစီကို ကွင်းထဲမှာ ရေးပြီး၊ and၊ or၊ not
      နဲ့ တွဲလို့ ရပါတယ်။ [[mark:draw-chain]] range မှာ အစွန်း နှစ်ဘက် ပါလို့လည်း ရပါတယ်။
      အကျယ် 300 နဲ့ 600 pixel ကြား ဆိုတာမျိုးပါ။ [[mark:draw-size-only]] size feature တွေမှာ
      အကျယ်၊ အမြင့်၊ inline size၊ block size၊ aspect ratio နဲ့ orientation ပါပါတယ်။ ဒီ
      အနီရောင် စာကြောင်းပေါ်က လေးခုကတော့ container type size ကို လိုပါတယ်။ inline size
      container က သူတို့ကို မဖြေနိုင်လို့၊ အဲဒီ query တွေက ဘယ်တော့မှ မကိုက်ပါဘူး။
    sources:
      - title: "web.dev Learn CSS — Container queries: container query conditions"
        url: "https://web.dev/learn/css/container-queries#container_query_conditions"
      - title: "MDN — @container (descriptors and logical keywords)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/@container#descriptors"
      - title: "CSS Conditional Rules Level 5 — container queries"
        url: "https://drafts.csswg.org/css-conditional-5/#container-queries"
    actions:
      - id: open-conditions
        type: whiteboard.apply
        at: { mark: open-conditions }
        open: true
        clear: true
        upsertIds: [e-title]
      - id: draw-range
        type: whiteboard.apply
        at: { mark: draw-range }
        upsertIds: [e-range, e-ops]
        drawMs: 1800
      - id: draw-colon
        type: whiteboard.apply
        at: { mark: draw-colon }
        upsertIds: [e-colon]
        drawMs: 1600
      - id: draw-logic
        type: whiteboard.apply
        at: { mark: draw-logic }
        upsertIds: [e-logic]
        drawMs: 1000
      - id: draw-chain
        type: whiteboard.apply
        at: { mark: draw-chain }
        upsertIds: [e-chain]
        drawMs: 1400
      - id: draw-size-only
        type: whiteboard.apply
        at: { mark: draw-size-only }
        upsertIds: [e-size-only, e-size-note]
        drawMs: 2200

  - id: size-trap
    chapter: "Container type size ကို သတိထားရအောင်"
    narration: >
      [[mark:close-conditions]] ဒါဆို size ကို ဘာလို့ အမြဲ မသုံးကြတာလဲ။ စားစရာ အပိုင်းမှာ
      စမ်းကြည့်ရအောင်။ [[mark:type-size]] မျဉ်းပြတ် ဘောင် ပါတဲ့ စားစရာ box ကို size
      container ဖြစ်အောင် လုပ်ပါမယ်။ ဒါဆို သူ့ အမြင့် အကြောင်းကိုပါ ဖြေနိုင်မှာပါ။ preview
      မှာ ကြည့်ထားပါ။ [[mark:after-size]] မျဉ်းပြတ် box က အစင်း ပါးပါးလေး ဖြစ်သွားပါပြီ။
      card တွေက box အပြင် လျှံထွက်ပြီး footer ပေါ်မှာ ထပ်နေပါတယ်။ [[mark:open-size-board]]
      ဘာကြောင့်လဲ ကြည့်ရအောင်။ [[mark:draw-size-width]] size container က သူ့ အကျယ်ကို parent
      ဆီကနေ ယူနေတုန်းပါပဲ။ [[mark:draw-size-height]] ဒါပေမဲ့ သူ့ အမြင့်က child တွေပေါ်
      မမူတည်ရတော့ပါဘူး။ အဲဒီလို ဖြစ်မှပဲ အမြင့် အကြောင်း မေးရင် ဖြေနိုင်တာပါ။ အမြင့်
      မပေးထားလို့ browser က သူ့ကို အလွတ် box လို တွက်ပြီး၊ သုည အမြင့်မှာ padding နဲ့ border
      ပဲ ပေါင်းပါတယ်။ [[mark:draw-size-rule]] ဒါကြောင့် ပုံသေ အမြင့်၊ grid row လိုမျိုး
      အမြင့်က အပြင်ကနေ လာမှပဲ size ကို သုံးပါ။ ကျန်တဲ့ နေရာတိုင်းမှာ inline size ပါ။
      [[mark:draw-size-cb]] inline size အပါအဝင် container တိုင်းမှာ ဘေးထွက်ဆိုးကျိုး နှစ်ခု
      ရှိပါသေးတယ်။ ပထမက absolute နဲ့ fixed child တွေရဲ့ containing block ဖြစ်သွားတာပါ။
      ဒါကြောင့် container ထဲမှာ fixed ခလုတ် ထားရင်၊ window မှာ ကပ်မနေတော့ပါဘူး။
      [[mark:draw-size-stack]] ဒုတိယက lesson 23 မှာ တွေ့ခဲ့တဲ့ stacking context အသစ် တစ်ခု
      ဖြစ်သွားတာပါ။
    sources:
      - title: "web.dev Learn CSS — Container queries: defining a container"
        url: "https://web.dev/learn/css/container-queries#defining_a_container"
      - title: "MDN — Using CSS containment (size containment)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_containment/Using_CSS_containment"
      - title: "CSS Containment Module Level 2 — size containment"
        url: "https://drafts.csswg.org/css-contain-2/#containment-size"
      - title: "MDN — container-type (formal definition and side effects)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/container-type"
    actions:
      - id: close-conditions
        type: whiteboard.apply
        at: { mark: close-conditions }
        open: false
      - id: type-size
        type: editor.type
        at: { mark: type-size }
        cadence: fast-explainer
        target: { file: styles.css, after: "  width: 100%;\n}\n", occurrence: 1 }
        text: "\n.snack-slots {\n  container-type: size;\n}\n"
      - id: expect-size
        type: expect.preview
        at: { mark: after-size }
        timeoutMs: 4000
        target: { by: testId, value: footer }
        textContains: "ဗဟန်း"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: open-size-board
        type: whiteboard.apply
        at: { mark: open-size-board }
        open: true
        clear: true
        upsertIds: [f-title]
      - id: draw-size-width
        type: whiteboard.apply
        at: { mark: draw-size-width }
        upsertIds: [f-strip, f-width]
        drawMs: 1600
      - id: draw-size-height
        type: whiteboard.apply
        at: { mark: draw-size-height }
        upsertIds: [f-card1, f-card2, f-height, f-zero]
        drawMs: 2600
      - id: draw-size-rule
        type: whiteboard.apply
        at: { mark: draw-size-rule }
        upsertIds: [f-rule]
        drawMs: 1800
      - id: draw-size-cb
        type: whiteboard.apply
        at: { mark: draw-size-cb }
        upsertIds: [f-cb]
        drawMs: 1600
      - id: draw-size-stack
        type: whiteboard.apply
        at: { mark: draw-size-stack }
        upsertIds: [f-stack]
        drawMs: 1200

  - id: size-fix
    narration: >
      [[mark:close-size-board]] စားစရာ box ကို ပြင်ရအောင်။ [[mark:type-fix]] အောက်မှာ
      container type ကို inline size နဲ့ ထပ်ရေးပါမယ်။ နောက်မှ ရေးတဲ့အတွက် သူ နိုင်ပါတယ်။
      [[mark:after-fix]] မျဉ်းပြတ် box ထဲမှာ card တွေ ပြန်ဆံ့သွားပါပြီ။ inline size က
      အကျယ်ကိုပဲ child တွေပေါ် မမူတည်အောင် တားတာ ဖြစ်ပြီး၊ ဒီ box ရဲ့ အကျယ်က page ဆီကနေ
      လာလို့ပါ။ [[mark:explain-shrink]] ဒီ selector ရွေးထားတဲ့ နေရာတွေကို ကြည့်ပါ။ ပုံမှန်
      block box တွေပါ။ inline-block လို အကျယ်ကို content ကနေ ယူတဲ့ box ဆိုရင် အပြင်က ရတဲ့
      အကျယ် မရှိလို့၊ inline size က သူ့ကို သုည အထိ ကျုံ့စေပါတယ်။ ဒါကြောင့် container ကို
      block box တွေမှာ ထားပါ။
    sources:
      - title: "MDN — container-type: inline-size"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/container-type#inline-size"
      - title: "CSS Containment Module Level 2 — inline-size containment"
        url: "https://drafts.csswg.org/css-contain-2/#containment-inline-size"
    actions:
      - id: close-size-board
        type: whiteboard.apply
        at: { mark: close-size-board }
        open: false
      - id: type-fix
        type: editor.type
        at: { mark: type-fix }
        cadence: fast-explainer
        target: { file: styles.css, after: "  container-type: size;\n", occurrence: 1 }
        text: "  container-type: inline-size;\n"
      - id: expect-fix
        type: expect.preview
        at: { mark: after-fix }
        timeoutMs: 4000
        target: { by: testId, value: card-palata }
        textContains: "ပလာတာ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-fix
        type: editor.select
        at: { mark: explain-shrink }
        target: { file: styles.css, text: ".special,\n.slot {", occurrence: 1 }

  - id: named
    chapter: "Container ကို နာမည် ပေးရအောင်"
    narration: >
      card တစ်ခုစီက အနီးဆုံး container ကို မေးပါတယ်။ တခါတလေတော့ container တစ်ခုကို ရွေးပြီး
      မေးချင်ပါတယ်။ [[mark:type-named]] ဒါကြောင့် container shorthand နဲ့ အထူး နေရာကို
      special ဆိုတဲ့ နာမည် ပေးကြည့်ရအောင်။ [[mark:select-named]] ဒီ shorthand ကို ကြည့်ပါ။
      နာမည် အရင် လာပြီး၊ slash ပြီးမှ container type လာပါတယ်။ နာမည်က quote မပါတဲ့ စကားလုံး
      သက်သက်ပါ။ [[mark:type-badge]] အခု special လို့ နာမည်ပေးထားတဲ့ container ကိုပဲ၊ သူ 150
      pixel ထက် ကျယ်လား ဆိုတာ မေးတဲ့ container rule တစ်ခု ရေးပါမယ်။ [[mark:type-badge-body]]
      ကျယ်တယ်ဆိုရင် badge ကို ပြပါမယ်။ card တွေကို ကြည့်ထားပါ။ [[mark:after-badge]] ယနေ့အထူး
      badge က အထူး card မှာပဲ ပေါ်လာပါပြီ။ [[mark:select-name-query]] ဒီ special ဆိုတဲ့
      နာမည်ကို ကြည့်ပါ။ စားစရာ နေရာတွေက 184 pixel နဲ့ 150 ထက် ကျယ်ပေမယ့်၊ သူတို့ရဲ့ ancestor
      တွေထဲမှာ special ဆိုတဲ့ container မရှိလို့ ဒီ rule က မကိုက်ပါဘူး။ နာမည်ပေးထားတဲ့
      container ကလည်း ancestor ဖြစ်ရပါမယ်။
    sources:
      - title: "web.dev Learn CSS — Container queries: naming containers"
        url: "https://web.dev/learn/css/container-queries#naming_containers"
      - title: "web.dev Learn CSS — Container queries: use shorthand with the container property"
        url: "https://web.dev/learn/css/container-queries#use_shorthand_with_the_container_property"
      - title: "MDN — container (shorthand)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/container"
      - title: "MDN — container-name"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/container-name"
    actions:
      # line-by-line: typed by keystroke, "container: special" alone would be a
      # valid name with type normal for a moment and the card would flicker.
      - id: type-named
        type: editor.type
        at: { mark: type-named }
        cadence: line-by-line
        target: { file: styles.css, after: "  width: 100%;\n", occurrence: 1 }
        text: "  container: special / inline-size;\n"
      - id: select-named
        type: editor.select
        at: { mark: select-named }
        target: { file: styles.css, text: "special / inline-size", occurrence: 1 }
      - id: type-badge
        type: editor.type
        at: { mark: type-badge }
        cadence: fast-explainer
        target:
          {
            file: styles.css,
            after: "  container-type: size;\n  container-type: inline-size;\n}\n",
            occurrence: 1,
          }
        text: "\n@container special (inline-size > 150px) {\n"
      - id: type-badge-body
        type: editor.type
        at: { mark: type-badge-body }
        cadence: line-by-line
        target:
          { file: styles.css, after: "@container special (inline-size > 150px) {\n", occurrence: 1 }
        text: "  .badge {\n    display: inline;\n  }\n}\n"
      - id: expect-badge
        type: expect.preview
        at: { mark: after-badge }
        timeoutMs: 4000
        target: { by: testId, value: badge-laphet-yay }
        textContains: "ယနေ့အထူး"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-name-query
        type: editor.select
        at: { mark: select-name-query }
        target: { file: styles.css, text: "@container special", occurrence: 1 }

  - id: cq-units
    chapter: "Container query unit တွေ"
    narration: >
      [[mark:open-units]] lesson 10 မှာ ပြောခဲ့တဲ့ container unit တွေကို အခု ကြည့်ရအောင်။
      [[mark:draw-cqi]] cqi က container ရဲ့ inline size ကို အခြေခံပြီး၊ 1 cqi က အဲဒီ
      အကျယ်ရဲ့ 1 ရာခိုင်နှုန်းပါ။ [[mark:draw-cqi-wide]] အထူး နေရာက 400 pixel ဖြစ်လို့၊ 5
      cqi က 20 pixel ပါ။ [[mark:draw-cqi-narrow]] စားစရာ နေရာ တစ်ခုက 184 pixel ပဲ ရှိလို့၊ 5
      cqi က 9 pixel လောက်ပဲ ရပါတယ်။ နာမည်အတွက်ဆိုရင် သေးလွန်းပါတယ်။ [[mark:draw-unit-list]]
      ပြီးတော့ အကျယ်နဲ့ အမြင့်အတွက် cqw နဲ့ cqh၊ block size အတွက် cqb၊ inline နဲ့ block ထဲက
      ငယ်တာနဲ့ ကြီးတာအတွက် cqmin နဲ့ cqmax လည်း ရှိပါတယ်။ အမြင့်ကို တိုင်းတဲ့ unit တွေကတော့
      size container လိုပါတယ်။ [[mark:draw-unit-fallback]] ဖြေနိုင်တဲ့ container မရှိရင်တော့
      lesson 10 က small viewport unit တွေကို အစားသုံးပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Container queries: container query units"
        url: "https://web.dev/learn/css/container-queries#container_query_units"
      - title: "MDN — Container query length units"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/length#container_query_length_units"
      - title: "web.dev Learn CSS — Sizing units"
        url: "https://web.dev/learn/css/sizing"
    actions:
      - id: open-units
        type: whiteboard.apply
        at: { mark: open-units }
        open: true
        clear: true
        upsertIds: [g-title]
      - id: draw-cqi
        type: whiteboard.apply
        at: { mark: draw-cqi }
        upsertIds: [g-def]
        drawMs: 1600
      - id: draw-cqi-wide
        type: whiteboard.apply
        at: { mark: draw-cqi-wide }
        upsertIds: [g-wide]
        drawMs: 1400
      - id: draw-cqi-narrow
        type: whiteboard.apply
        at: { mark: draw-cqi-narrow }
        upsertIds: [g-narrow]
        drawMs: 1400
      - id: draw-unit-list
        type: whiteboard.apply
        at: { mark: draw-unit-list }
        upsertIds: [g-list]
        drawMs: 1800
      - id: draw-unit-fallback
        type: whiteboard.apply
        at: { mark: draw-unit-fallback }
        upsertIds: [g-fallback]
        drawMs: 1400

  - id: cq-live
    narration: >
      [[mark:close-units]] card နာမည်တွေမှာ cqi ကို သုံးကြည့်ရအောင်။ [[mark:type-cq]] cqi
      ကို lesson 12 က clamp ထဲမှာ ထည့်ထားလို့၊ စာလုံး အရွယ်က container ကို
      လိုက်ပြောင်းပေမယ့် 16 pixel ထက် မငယ်ဘဲ 24 ထက်လည်း မကြီးပါဘူး။ နာမည်တွေကို ကြည့်ထားပါ။
      [[mark:after-cq]] အထူး card ရဲ့ နာမည်က 20 pixel အထိ ကြီးလာပြီး၊ စားစရာ နာမည်တွေကတော့
      clamp ရဲ့ အငယ်ဆုံး 16 pixel မှာ ရပ်နေပါတယ်။ [[mark:select-cqi]] ဒီ cqi ကို ကြည့်ပါ။
      rule တစ်ခုတည်းနဲ့ နာမည်တိုင်းက သူ့ container နဲ့ ကိုက်သွားပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Container queries: container query units"
        url: "https://web.dev/learn/css/container-queries#container_query_units"
      - title: "MDN — clamp()"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/clamp"
    actions:
      - id: close-units
        type: whiteboard.apply
        at: { mark: close-units }
        open: false
      - id: type-cq
        type: editor.type
        at: { mark: type-cq }
        cadence: fast-explainer
        target: { file: styles.css, after: "    display: inline;\n  }\n}\n", occurrence: 1 }
        text: "\n.menu-card .name {\n  font-size: clamp(16px, 5cqi, 24px);\n}\n"
      - id: expect-cq
        type: expect.preview
        at: { mark: after-cq }
        timeoutMs: 4000
        target: { by: testId, value: card-e-kya-kwe }
        textContains: "အီကြာကွေး"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-cqi
        type: editor.select
        at: { mark: select-cqi }
        target: { file: styles.css, text: "5cqi", occurrence: 1 }

  - id: nesting
    chapter: "Container query ကို nest လုပ်ရအောင်"
    narration: >
      [[mark:type-nest]] container rule ကို တခြား rule တစ်ခုထဲမှာလည်း nest လုပ်လို့ ရပါတယ်။
      lesson 8 မှာ rule ထဲမှာ media query ရေးခဲ့သလိုပါပဲ။ menu card rule ထဲမှာ container
      ကျယ်ရင် card ကို အညိုနီရောင် border ပေးပါမယ်။ အထူး card ရဲ့ border ကို ကြည့်ထားပါ။
      [[mark:after-nest]] အထူး card ရဲ့ border ပဲ အရောင် ပြောင်းသွားပါပြီ။
      [[mark:select-nest]] ဒီ nest လုပ်ထားတဲ့ container rule ကို ကြည့်ပါ။ သီးသန့် ရေးတာနဲ့
      အတူတူ အလုပ်လုပ်ပေမယ့်၊ card နဲ့ ဆိုင်တဲ့ style တွေကို တစ်နေရာတည်းမှာ စုထားနိုင်ပါတယ်။
      container rule ကို layer၊ media၊ supports rule တွေထဲ၊ ဒါမှမဟုတ် တခြား container rule
      ထဲမှာလည်း ထည့်လို့ ရပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Container queries: nesting container queries"
        url: "https://web.dev/learn/css/container-queries#nesting_container_queries"
      - title: "MDN — CSS nesting (nesting at-rules)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_nesting/Using_CSS_nesting#nested_declarations_rule"
    actions:
      - id: type-nest
        type: editor.type
        at: { mark: type-nest }
        cadence: fast-explainer
        target:
          { file: styles.css, after: "  font-size: clamp(16px, 5cqi, 24px);\n}\n", occurrence: 1 }
        text: "\n.menu-card {\n  @container (inline-size > 300px) {\n    border-color: sienna;\n  }\n}\n"
      - id: expect-nest
        type: expect.preview
        at: { mark: after-nest }
        timeoutMs: 4000
        target: { by: testId, value: card-laphet-yay }
        textContains: "ယနေ့အထူး"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-nest
        type: editor.select
        at: { mark: select-nest }
        target:
          {
            file: styles.css,
            text: "  @container (inline-size > 300px) {\n    border-color: sienna;\n  }",
            occurrence: 1,
          }

  - id: more-queries
    narration: >
      [[mark:open-more]] container ကို အရွယ်အစား အကြောင်းပဲ မေးလို့ ရတာ မဟုတ်ပါဘူး။
      [[mark:draw-style]] style query က theme က dark လား ဆိုတာမျိုး၊ container ပေါ်က custom
      property ရဲ့ တန်ဖိုးကို မေးပါတယ်။ 2026 ခုနှစ်ကစပြီး browser အဓိက အားလုံးမှာ ရပါပြီ။
      [[mark:draw-name-only]] condition မပါဘဲ နာမည် တစ်ခုတည်း ပါတဲ့ query က အဲဒီ နာမည်
      ရှိတဲ့ container တိုင်းရဲ့ အထဲမှာ ကိုက်ပါတယ်။ ဒါလည်း 2026 ခုနှစ်ကမှ အားလုံးမှာ ရတာပါ။
      [[mark:draw-scroll-state]] scroll state query ကတော့ ဥပမာ sticky header တစ်ခု
      ကပ်နေပြီလား ဆိုတာမျိုး မေးပါတယ်။ အခုလောလောဆယ် Chrome နဲ့ Chrome ကို အခြေခံတဲ့ browser
      တွေမှာပဲ ရပါသေးတယ်။ [[mark:draw-devtools]] Chrome DevTools ရဲ့ Elements panel က
      container တိုင်းမှာ container badge ပြလို့၊ query မကိုက်ရင် အကြောင်းရင်း ရှာဖို့
      အထောက်အကူ ဖြစ်ပါတယ်။
    sources:
      - title: "MDN — Container size and style queries (style queries)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_containment/Container_size_and_style_queries#container_style_queries"
      - title: "webstatus.dev — Container style queries"
        url: "https://webstatus.dev/features/container-style-queries"
      - title: "webstatus.dev — Container name-only queries"
        url: "https://webstatus.dev/features/container-name-queries"
      - title: "MDN — Using container scroll-state queries"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_conditional_rules/Container_scroll-state_queries"
      - title: "Chrome DevTools — Inspect CSS container queries"
        url: "https://developer.chrome.com/docs/devtools/css/container-queries"
    actions:
      - id: open-more
        type: whiteboard.apply
        at: { mark: open-more }
        open: true
        clear: true
        upsertIds: [h-title]
      - id: draw-style
        type: whiteboard.apply
        at: { mark: draw-style }
        upsertIds: [h-style]
        drawMs: 1400
      - id: draw-name-only
        type: whiteboard.apply
        at: { mark: draw-name-only }
        upsertIds: [h-name]
        drawMs: 1400
      - id: draw-scroll-state
        type: whiteboard.apply
        at: { mark: draw-scroll-state }
        upsertIds: [h-scroll]
        drawMs: 1400
      - id: draw-devtools
        type: whiteboard.apply
        at: { mark: draw-devtools }
        upsertIds: [h-devtools]
        drawMs: 1400

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:open-quiz]] မေးခွန်း တစ်ခု မေးကြည့်ရအောင်။ inline size container တစ်ခုကို သူ့
      aspect ratio အကြောင်း မေးရင်၊ query က ကိုက်ပါ့မလား။ [[mark:quiz-answer]] မကိုက်ပါဘူး။
      aspect ratio က အမြင့်ကို လိုပြီး၊ အမြင့် အကြောင်းကို size container ပဲ ဖြေနိုင်လို့ပါ။
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ media query က viewport နဲ့ pointer လို စက်
      အကြောင်းကို မေးပါတယ်။ container query ကတော့ component ကို ထည့်ထားတဲ့ box ကို မေးပြီး၊
      container type အရင် ပေးပြီးမှ container rule နဲ့ မေးရပါတယ်။ inline size ကို
      ဦးစားပေးပါ။ လိုရင် container ကို နာမည်ပေးပြီး၊ container ကို လိုက်တဲ့ အရွယ်တွေအတွက်
      container query unit ကို သုံးပါ။ ခလုတ်တွေကိုလည်း အနည်းဆုံး 24 pixel၊ ဖြစ်နိုင်ရင် 44
      pixel ပေးပါ။ [[mark:part-end]] ဒါနဲ့ course ရဲ့ layout အကြောင်း အပိုင်း ပြီးပါပြီ။
      [[mark:next-lesson]] နောက် lesson မှာတော့ အပိုင်း အသစ် တစ်ခု စပြီး၊ HTML အပို မထည့်ဘဲ
      ပထမ စာလုံးလို element ရဲ့ အစိတ်အပိုင်းတွေကို style ပေးတဲ့ pseudo-element တွေကို
      ကြည့်သွားပါမယ်။
    sources:
      - title: "web.dev Learn CSS — Container queries: check your understanding"
        url: "https://web.dev/learn/css/container-queries#check_your_understanding"
      - title: "web.dev Learn CSS — Pseudo-elements (next lesson)"
        url: "https://web.dev/learn/css/pseudo-elements"
    actions:
      - id: open-quiz
        type: whiteboard.apply
        at: { mark: open-quiz }
        clear: true
        upsertIds: [i-title, i-q, i-q2]
      - id: draw-quiz-answer
        type: whiteboard.apply
        at: { mark: quiz-answer }
        upsertIds: [i-a, i-a-check, i-rule]
        drawMs: 2000
      - id: expect-final-css
        type: expect.file
        at: { mark: recap }
        path: styles.css
        contains: ".plus {\n  min-width: 24px;\n  min-height: 24px;\n  min-width: 44px;\n  min-height: 44px;\n  touch-action: manipulation;\n}\n\n.special,\n.slot {\n  container-type: inline-size;\n}\n\n@container (inline-size > 300px) {\n  .menu-card {\n    display: grid;\n    grid-template-columns: auto 1fr;\n    gap: 12px;\n  }\n}\n\n.special {\n  width: 60%;\n  width: 100%;\n  container: special / inline-size;\n}\n\n"
      - id: expect-final-css-2
        type: expect.file
        at: { afterAction: expect-final-css }
        path: styles.css
        contains: ".snack-slots {\n  container-type: size;\n  container-type: inline-size;\n}\n\n@container special (inline-size > 150px) {\n  .badge {\n    display: inline;\n  }\n}\n\n.menu-card .name {\n  font-size: clamp(16px, 5cqi, 24px);\n}\n\n.menu-card {\n  @container (inline-size > 300px) {\n    border-color: sienna;\n  }\n}\n"

checks:
  - { type: timing.p95Ms, max: 300 }
