build:
  # Studio swaps in the Burmese voice chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 2614

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: hook
    chapter: ပထမဆုံး SRE အလုပ်ခေါ် ကြော်ငြာ
    narration: >
      [[mark:show-p01]] Padauk က refund design ကို STPA နဲ့ ကြိုစစ်ပြီး လစာထုတ်ရက်မှာ ပိတ်ခံရတဲ့ wallet ၂၈၀၀ ကိုလည်း CAST နဲ့ ပြန်ခွဲကြည့်ခဲ့ပါပြီ။ ဒါပေမဲ့ lesson ၆ ကတည်းက incident တွေမှာ reliability ဘက်ကို ထမ်းခဲ့ရတာ Site Reliability Engineer၊ SRE ဖြစ်တဲ့ မသီရိ တစ်ယောက်တည်းပါ။
      [[mark:hook-budget]] ဒါကြောင့် CTO ကိုနေလင်းက SRE အဖွဲ့ ဖွဲ့ဖို့ ငွေ ခွဲပေးလိုက်တော့ မသီရိက Padauk ရဲ့ ပထမဆုံး SRE အလုပ်ခေါ် ကြော်ငြာကို ရေးနေပါပြီ။ ဘယ်လို လူမျိုးကို ခန့်ရမလဲ၊ လူသစ်တွေကရော ဘေးကင်းကင်း ဘယ်လို သင်ယူကြမလဲ?
      [[mark:show-map]] lesson ၁ မှာ ပြောခဲ့သလို Module ၄ က reliability loop ကို လည်နေအောင် လုပ်ပေးတဲ့ အလယ်က လူတွေ အကြောင်းပါ။ tool တွေ ဘယ်လောက်ပဲ ကောင်းကောင်း service ကို စိတ်ချရအောင် ထိန်းထားတာက လူတွေပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Workbook: SRE Team Lifecycles",
          url: "https://sre.google/workbook/team-lifecycles/",
        }
      - {
          title: "Why heroism is bad (sre.google)",
          url: "https://sre.google/resources/practices-and-processes/no-heroes/",
        }
    actions:
      # -1750 / -1450, not the skeleton's -1900 / -1600: a pull-back over 1780 ms pushes the
      # first dialog past the 2 s opening handle, which src/studio/plans/index.test.ts rejects.
      - { id: collapse-dock, type: runtime.collapseDock, at: { scene: start, offsetMs: -1750 } }
      - {
          id: show-p01,
          type: slide.show,
          at: { mark: show-p01, offsetMs: -1450 },
          slideId: l14-p01,
        }
      # Module 4 opens: the module map advances in place from the cover.
      - { id: show-map, type: slide.show, at: { mark: show-map }, slideId: m4-map }

  - id: good-sre
    chapter: SRE ကောင်း တစ်ယောက်
    narration: >
      [[mark:show-p02]] မသီရိ ရှာနေတဲ့ SRE က code ရေးရုံ မကဘဲ top-up တစ်ခု operator ဆီ ရောက်ပုံကို အောက်ဆုံး အလွှာထိ နားလည်ပြီး design လုပ်တတ်ရပါမယ်။ debug လုပ်ရင်လည်း ကြုံရာ restart မလုပ်ဘဲ Operator A နှေးလို့လား ဆိုတဲ့ hypothesis ကို data နဲ့ စစ်ပြီး incident တွေကြားက ထပ်နေတဲ့ ပုံစံကိုလည်း မြင်ရပါမယ်။
      [[mark:p02-toil]] လက်နဲ့ ထပ်ခါထပ်ခါ လုပ်ရပြီး ရေရှည် တန်ဖိုး မပေးတဲ့ ops အလုပ်၊ toil ကိုလည်း automate လုပ်ချင်လောက်အောင် မုန်းရပါမယ်။ skill လောက် အရေးကြီးတာက ပျက်မှ ပြေးပြင်တာထက် ဘာက ပျက်နိုင်လဲ ကြိုတွေးတဲ့ စိတ်ထားပါ။
      [[mark:show-p02b]] SRE တွေ code ရေးပေမဲ့ တစ်နေကုန် ရေးနေတာ မဟုတ်ပါဘူး။ ဥပမာ မသီရိက Operator B နဲ့ ချိတ်တဲ့ နေရာကို ပြောင်းဖို့ သူတို့ အဖွဲ့ကို data ပြပြီး တစ်ပတ်လုံး နားချခဲ့ရပေမဲ့ တကယ် ပြောင်းလိုက်တဲ့ code က သုံးကြောင်းပဲ ရှိပါတယ်။ ရှင်းပြတတ်တာကလည်း code လောက် အရေးကြီးတာပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Workbook: SRE Team Lifecycles",
          url: "https://sre.google/workbook/team-lifecycles/",
        }
      - {
          title: "SRE book, 1st ed: Accelerating SREs to On-Call and Beyond",
          url: "https://sre.google/sre-book/accelerating-sre-on-call/",
        }
    actions:
      - { id: show-p02, type: slide.show, at: { mark: show-p02 }, slideId: l14-p02 }
      - { id: show-p02b, type: slide.show, at: { mark: show-p02b }, slideId: l14-p02b }

  - id: hiring-bar
    chapter: ခန့်တဲ့ စံ
    narration: >
      [[mark:close-p02b]] [[mark:b1-s1]] ကြော်ငြာ ထွက်ပြီးတော့ နောက်ဆုံး ကျန်တဲ့ နှစ်ယောက်က လုံးဝ မတူပါဘူး။ [[mark:b1-s1b]] တစ်ယောက်က code ရေးတာ အရမ်း သန်တဲ့ backend developer ဖြစ်ပေမဲ့ Linux နဲ့ network ကို သိပ်မသိပါဘူး။ [[mark:b1-s1c]] နောက်တစ်ယောက်က ဘဏ်မှာ systems administrator လုပ်ခဲ့တဲ့ ကိုဇော်ပါ၊ server နဲ့ network ကို နက်နက် သိပေမဲ့ code နည်းနည်းပဲ ရေးဖူးပါတယ်။
      [[mark:b1-s2]] Padauk က SRE ကိုလည်း developer ခန့်တဲ့ စံအတိုင်းပဲ ခန့်ပါတယ်။ ဒါပေမဲ့ software နဲ့ systems ကျွမ်းကျင်မှုကို ပေါင်းပြီး တိုင်းလို့ နှစ်ယောက်လုံး ခန့်တဲ့ စံကို ရောက်ပါတယ်၊ ရောက်ပုံသာ ပြောင်းပြန်ပါ။ SRE ကောင်းတွေက နောက်ခံ အမျိုးမျိုးကနေ လာကြတာပါ။
      [[mark:b1-s3]] interview မှာလည်း အလွတ်ကျက်ရတဲ့ မေးခွန်းတွေ မမေးဘဲ သင်္ကြန် ညမှာ top-up ဘာကြောင့် နှေးလဲ ဆိုတဲ့ တကယ့် ပြဿနာကို ပေးပြီး စဉ်းစားပုံကို အသံထွက် ပြောခိုင်းပါတယ်။ [[mark:b1-s3b]] ဒါပေမဲ့ SRE ရှာရ ခက်တဲ့ကြားထဲ process က ၉ ပတ် ကြာသွားလို့ candidate ကောင်း နောက်တစ်ယောက်က တခြား ကုမ္ပဏီကို ရွေးသွားခဲ့ပါတယ်။
      [[mark:b1-s4]] မသီရိ တကယ် ရှာနေတာက T-shaped ကျွမ်းကျင်မှုပါ။ T ရဲ့ အလျားလိုက် မျဉ်းက app ကနေ network အထိ အလွှာ အများကြီးကို ကျယ်ကျယ် သိတာ၊ ဒေါင်လိုက် မျဉ်းက တစ်ခု နှစ်ခုမှာ နက်နက် ကျွမ်းတာပါ။ incident မှာ ပြဿနာ ဘယ် အလွှာမှာ ပုန်းနေလဲ ကြိုမသိနိုင်လို့ အကျယ်ရော အနက်ပါ လိုတာပါ။ မသီရိကိုယ်တိုင် developer ဘက် နက်တော့ Padauk က systems ဘက် နက်တဲ့ ကိုဇော်ကို ရွေးလိုက်ပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Workbook: SRE Team Lifecycles",
          url: "https://sre.google/workbook/team-lifecycles/",
        }
      - {
          title: "SRE book, 1st ed: Accelerating SREs to On-Call and Beyond",
          url: "https://sre.google/sre-book/accelerating-sre-on-call/",
        }
    actions:
      - { id: close-p02b, type: slide.close, at: { mark: close-p02b, offsetMs: -400 } }
      - {
          id: b1-s1,
          type: whiteboard.apply,
          at: { mark: b1-s1 },
          open: true,
          clear: true,
          upsertIds: [l14-b1-axis, l14-b1-leg-sys, l14-b1-leg-sw],
        }
      # Step 1 is split in two: each bar lands as its candidate is described.
      - {
          id: b1-s1b,
          type: whiteboard.apply,
          at: { mark: b1-s1b },
          upsertIds: [l14-b1-dev-sw, l14-b1-dev-sys, l14-b1-dev-name],
          drawMs: 1500,
        }
      - {
          id: b1-s1c,
          type: whiteboard.apply,
          at: { mark: b1-s1c },
          upsertIds: [l14-b1-zaw-sw, l14-b1-zaw-sys, l14-b1-zaw-name],
          drawMs: 1500,
        }
      - {
          id: b1-s2,
          type: whiteboard.apply,
          at: { mark: b1-s2 },
          upsertIds: [l14-b1-bar, l14-b1-bar-t],
          drawMs: 1000,
        }
      - {
          id: b1-s3,
          type: whiteboard.apply,
          at: { mark: b1-s3 },
          upsertIds: [l14-b1-trivia, l14-b1-trivia-x, l14-b1-trivia-t1, l14-b1-trivia-t2],
          drawMs: 1600,
        }
      # The nine weeks land as they are said.
      - {
          id: b1-s3b,
          type: whiteboard.apply,
          at: { mark: b1-s3b },
          upsertIds: [l14-b1-lost],
          drawMs: 900,
        }
      - {
          id: b1-s4,
          type: whiteboard.apply,
          at: { mark: b1-s4 },
          upsertIds: [l14-b1-t-top, l14-b1-t-wide, l14-b1-t-stem, l14-b1-t-deep1, l14-b1-t-deep2],
          drawMs: 2400,
        }

  - id: onboarding-staircase
    chapter: Onboarding လှေကား
    narration: >
      [[mark:close-b1]] [[mark:show-p02c]] ကိုဇော် အလုပ်ကို လက်ခံပြီးတော့ မသီရိ သတိရတာက ကိုမင်းပါ။ လစာထုတ်ရက် incident မှာ ကိုမင်းကို Operator A ရဲ့ latency ကို ၁၀ မိနစ်အတွင်း စစ်ခိုင်းခဲ့ပေမဲ့ မှန်တဲ့ dashboard ကို ရှာရင်း အချိန် အများစု ကုန်သွားခဲ့ပါတယ်။ လူသစ်ကို ကိုယ့်ဘာသာ ရုန်းကန်ပြီး သင်ခိုင်းရင် ဒီလိုပဲ ဖြစ်တတ်ပါတယ်။
      [[mark:close-p02c]] [[mark:b2-s1]] ဒါကြောင့် မသီရိက လူသစ်ကို system တွေနဲ့ အဖွဲ့ကို နားလည်အောင် လမ်းပြတဲ့ onboarding ကို on-call ဆီ တက်တဲ့ လှေကားလို ဆွဲပါတယ်။ ပထမ အဆင့်က doc တွေ ဖတ်ရင်း on-call မကျခင် သင်ရမယ့် အရာတွေရဲ့ စာရင်း၊ on-call checklist ကို လိုက်လုပ်တာပါ၊ ခေတ်နောက်ကျနေတဲ့ doc တွေ့ရင် ကိုမင်းကိုယ်တိုင် ပြင်ပါတယ်။
      [[mark:b2-s2]] နောက် အဆင့်တွေက လူသစ်ရဲ့ ပထမ project အစစ်၊ starter project နဲ့ whiteboard talk ပါ။ whiteboard talk မှာ ကိုမင်းက Wallet ledger ကို ဆွဲပြီး ငွေလွှဲ တစ်ခု ဘယ်လို မှတ်တမ်းဝင်လဲ အဖွဲ့ကို ရှင်းပြရင်း သင်ယူပါတယ်။
      [[mark:b2-s3]] ပြီးရင် on-call ကို နှစ်ဆင့်နဲ့ တက်ပါတယ်။ shadowing မှာ page တွေကို မသီရိ handle လုပ်တာ ကိုမင်းက ဘေးကနေ လိုက်ကြည့်ပြီး reverse shadowing မှာတော့ ကိုမင်း ကိုယ်တိုင် handle လုပ်တာကို မသီရိက ဘေးကနေ စောင့်ကြည့်ပါတယ်။ [[mark:b2-s3b]] ဒီနောက်မှ အဖွဲ့ဝင်တွေ on-call ကို အလှည့်ကျ ယူတဲ့ on-call rotation ထဲ ဝင်ပါတယ်။
      [[mark:b2-s4]] လှေကား တစ်လျှောက်လုံး ရေရှည် လမ်းညွှန်တဲ့ mentor က အောက်ကနေ ထောက်ထားပါတယ်။ mentor ရဲ့ အချိန် ပေးရပေမဲ့ လူသစ်တွေ on-call ကို ပိုမြန်မြန် ရောက်ပြီး ပထမ တစ်နှစ်အတွင်း အလုပ်ထွက်တာလည်း နည်းပါတယ်။
      [[mark:b2-s5]] လူ မတိုးတဲ့ အဖွဲ့ငယ်ဆိုရင် နေ့စဉ် မေးလို့ရတဲ့ buddy တစ်ယောက် တွဲပေးရုံနဲ့ လုံလောက်ပါတယ်။ Padauk ကတော့ သေးပေမဲ့ မြန်မြန် ကြီးလာနေလို့ program အစစ် လုပ်ပါတယ်။ Padauk ရဲ့ ledger ကို ဘယ် course ကမှ မသင်ပေးနိုင်လို့ အဖွဲ့ကပဲ သင်ပေးရပေမဲ့ ဘယ်သူမှ အကုန် အလွတ်ကျက်စရာ မလိုပါဘူး၊ ဘယ်မှာ ရှာရမလဲ သိရင် ရပါပြီ။
