  - id: checkable-goals
    chapter: စစ်လို့ရတဲ့ ပန်းတိုင်
    narration: >
      [[mark:close-b2]] [[mark:show-p03]] checklist ရဲ့ ပထမ မူကြမ်းမှာ operator gateway ကို နားလည်ရမယ်၊ deploy tool ကို သိရမယ် ဆိုတဲ့ စာကြောင်းတွေ ပါပါတယ်။ ဒါပေမဲ့ နားလည်ပြီလား ဘယ်သူ ဘယ်လို စစ်မလဲ? ဒါကြောင့် မသီရိက operator အလိုက် fail တွေကို ရှာပြရမယ်၊ release တစ်ခုကို rollback လုပ်ပြရမယ် ဆိုသလို စာကြောင်းတိုင်းကို ကိုမင်း လုပ်ပြနိုင်တဲ့ action အဖြစ် ပြန်ရေးပါတယ်။
      [[mark:p03-payoff]] ဒီတော့ ဘယ်အထိ ရောက်ပြီလဲ ကိုမင်းရော mentor ပါ မြင်ရပြီး ဘယ် စာကြောင်းအတွက်မှ မလိုတဲ့ doc တွေ၊ သင်ခန်းစာတွေကိုလည်း ဖြုတ်လို့ရပါတယ်။
