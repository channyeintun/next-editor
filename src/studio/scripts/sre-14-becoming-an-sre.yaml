  - id: growing
    chapter: ဆက်ပြီး တိုးတက်ဖို့
    narration: >
      [[mark:close-b3]] [[mark:show-p06]] onboarding ပြီးရင် ဘယ်လို ဆက်တိုးတက်မလဲလို့ ကိုမင်း မေးတော့ မသီရိက Padauk ရဲ့ အလေ့အထ သုံးခုကို ပြောပြပါတယ်။ သုံးလ တစ်ခါ ကိုယ့် system ဘေးက system တစ်ခုကို လေ့လာပါ၊ fix တစ်ခုကို အစကနေ အဆုံးထိ ကိုယ်တိုင် တာဝန်ယူပါ၊ သင်ခဲ့တာကို ၁၀ မိနစ်နဲ့ အဖွဲ့ကို ပြန်ရှင်းပြပါ။
      [[mark:show-p06b]] ကိုယ့်ဘာသာဆိုရင် သင်္ကြန် ညသန်းခေါင်မှာ တစ်စက္ကန့်ကို top-up ဘယ်နှခု ဝင်မလဲလို့ တကယ့် ကိန်းဂဏန်းနဲ့ တွက်ပြီး design ဆွဲကြည့်ပါ။ public postmortem တစ်ခုကို အပတ်တိုင်း ဖတ်ပြီး ကိုယ့်စကားနဲ့ အကျဉ်း ပြန်ရေးကြည့်ပါ။ manager ဖြစ်တာကလည်း တက်လမ်း တစ်ခုတည်း မဟုတ်ပါဘူး၊ လူ မစီမံဘဲ engineering ကိုယ်တိုင် လုပ်ရင်း ဦးဆောင်တဲ့ individual contributor လမ်းလည်း ရှိပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE Fundamentals course (sre.google)",
          url: "https://sre.google/resources/practices-and-processes/sre-fundamentals-course/",
        }
      - {
          title: "Workbook: SRE Team Lifecycles",
          url: "https://sre.google/workbook/team-lifecycles/",
        }
    actions:
      - {
          id: close-b3,
          type: whiteboard.apply,
          at: { mark: close-b3, offsetMs: -400 },
          open: false,
        }
      - { id: show-p06, type: slide.show, at: { mark: show-p06 }, slideId: l14-p06 }
      - { id: show-p06b, type: slide.show, at: { mark: show-p06b }, slideId: l14-p06b }

  - id: this-week
    narration: >
      [[mark:show-p07]] လူ ဝင်ထွက်လည်း အဖွဲ့ ဆက်ရပ်တည်နိုင်အောင် ဒီအပတ် စလုပ်ကြည့်ပါ။ ကိုယ့် service ရဲ့ on-call checklist ကို လုပ်ပြလို့ရတဲ့ action တွေနဲ့ ရေးပါ။ ကိုယ့် system ကို အဖွဲ့ဖော် တစ်ယောက်အတွက် whiteboard ပေါ်မှာ ဆွဲပြီး ရှင်းပြပါ။ ပြီးတော့ တစ်ယောက်တည်းပဲ ကျွမ်းတဲ့ system ရှိရင် အဲဒီလူနဲ့ တွဲမယ့် နောက်တစ်ယောက်ကို ရှာပေးပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book, 1st ed: Accelerating SREs to On-Call and Beyond",
          url: "https://sre.google/sre-book/accelerating-sre-on-call/",
        }
      - {
          title: "Why heroism is bad (sre.google)",
          url: "https://sre.google/resources/practices-and-processes/no-heroes/",
        }
    actions:
      - { id: show-p07, type: slide.show, at: { mark: show-p07 }, slideId: l14-p07 }

  - id: recap
    narration: >
      [[mark:close-p07]] [[mark:open-notes]] SRE ဖြစ်လာဖို့ လိုတာတွေကို ကြည့်ရအောင်။ [[mark:sel-tshaped]] T-shaped က အလွှာ အများကြီးကို ကျယ်ကျယ် သိပြီး တစ်ခု နှစ်ခုမှာ နက်နက် ကျွမ်းတာပါ။ [[mark:sel-starter]] starter project က အဖွဲ့ တကယ် လိုချင်ပြီး လူသစ် ကိုယ်တိုင် ပြီးနိုင်တဲ့ ပထမ project အစစ်ပါ။
      [[mark:sel-shadowing]] shadowing မှာ လူသစ်က ဘေးကနေ ကြည့်ပြီး reverse shadowing မှာတော့ ကိုယ်တိုင် handle လုပ်ပါတယ်။ [[mark:sel-planned]] စီစဉ်ထားတဲ့ အလုပ်ကို ကာဖို့ ကြားဖြတ် အလုပ်ကို တစ်ဝက်အောက်မှာ ထားပါတယ်။ [[mark:sel-n1]] လူအတွက် N plus one ကတော့ system တိုင်း၊ shift တိုင်းမှာ လိုတာထက် တစ်ယောက် ပိုထားတာပါ။
      [[mark:sel-question]] ဒါဆို ကိုမင်းရဲ့ checklist လိုပဲ Kubernetes ကို လေ့လာမယ် ဆိုတဲ့ ပန်းတိုင်ကို စစ်လို့ရတဲ့ ပန်းတိုင် ဖြစ်အောင် ဘယ်လို ပြန်ရေးမလဲ?
      [[mark:pause-question]] ဥပမာ ကိုယ့်အဖွဲ့ရဲ့ cluster ပေါ်မှာ service တစ်ခုကို deploy လုပ်ပြီး rollback လုပ်ပြနိုင်ရမယ်လို့ ရေးနိုင်ပါတယ်။ တနင်္လာနေ့ဆိုရင် ကိုဇော် အလုပ်စပါပြီ၊ ဒါပေမဲ့ SRE နှစ်ယောက်နဲ့ on-call rotation မဖြစ်သေးပါဘူး။ သူတို့ကို ဘယ်မှာ ထားပြီး ဘာတွေကို တာဝန်ယူခိုင်းမလဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book, 1st ed: Accelerating SREs to On-Call and Beyond",
          url: "https://sre.google/sre-book/accelerating-sre-on-call/",
        }
      - {
          title: "Workbook: SRE Team Lifecycles",
          url: "https://sre.google/workbook/team-lifecycles/",
        }
    actions:
      - { id: close-p07, type: slide.close, at: { mark: close-p07 } }
      - {
          id: open-notes,
          type: workspace.openFile,
          at: { mark: open-notes, offsetMs: 300 },
          path: notes.md,
        }
      - {
          id: sel-tshaped,
          type: editor.select,
          at: { mark: sel-tshaped },
          target: { file: notes.md, text: "T-shaped", occurrence: 1 },
        }
      - {
          id: sel-starter,
          type: editor.select,
          at: { mark: sel-starter },
          target: { file: notes.md, text: "starter project", occurrence: 1 },
        }
      # occurrence 1: the line's first "shadowing", before "reverse shadowing".
      - {
          id: sel-shadowing,
          type: editor.select,
          at: { mark: sel-shadowing },
          target: { file: notes.md, text: "shadowing", occurrence: 1 },
        }
      - {
          id: sel-planned,
          type: editor.select,
          at: { mark: sel-planned },
          target: { file: notes.md, text: "စီစဉ်ထားတဲ့ အလုပ်", occurrence: 1 },
        }
      - {
          id: sel-n1,
          type: editor.select,
          at: { mark: sel-n1 },
          target: { file: notes.md, text: "N+1", occurrence: 1 },
        }
      # The voice script's ⟪select မေးခွန်း⟫ and ⟪pause 3s⟫, the way the Module 1
      # reviewers fixed the pause. A select at sel-question itself would drag
      # under the question and leave no pause, and one at pause-question would
      # drag under the answer's first words (the scheduler holds only the
      # dialog after its anchor's). sel-question already starts the question's
      # own dialog (the sentence before it ends at ။), so the question-line
      # select hangs off it: it starts about as the question ends, its drag
      # runs in silence, and the answer at pause-question waits for it. The
      # question is one 127-character sentence with no ၊ to split at, so the
      # quiet depends on the voice's speed: 8750 leaves about
      # 2.85 / 0.94 / 0.35 s before the answer at 55 / 70 / 95 ms per char (at
      # 95 the drag starts under the question's last words, as in lessons 2 and
      # 7); 8800 trips compile-check's 2.5 s inserted-silence warning at 55.
      - id: select-question
        type: editor.select
        at: { mark: sel-question, offsetMs: 8750 }
        target:
          file: notes.md
          text: 'မေးခွန်း: "Kubernetes ကို လေ့လာမယ်" ကို စစ်လို့ရတဲ့ ပန်းတိုင် ဖြစ်အောင် ပြန်ရေးပါ။'
          occurrence: 1

checks:
  # 500, not 300: google-svg deck pages stall the main thread at show/close.
  - { type: timing.p95Ms, max: 500 }
