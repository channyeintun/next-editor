  - id: planned-work
    chapter: စီစဉ်ထားတဲ့ အလုပ်နဲ့ ကြားဖြတ် အလုပ်
    narration: >
      [[mark:show-p05]] ဒါပေမဲ့ ပထမ အပတ်မှာပဲ ticket၊ code review၊ chat က မေးခွန်းတွေ ဝင်လာတိုင်း အစက ပြန်စဉ်းစားရလို့ ကိုမင်း dashboard ကို တစ်နာရီ ဆက်တိုက်တောင် မလုပ်နိုင်ခဲ့ပါဘူး။ SRE အလုပ်မှာ ကြာရှည် တန်ဖိုးရှိမယ့် စီစဉ်ထားတဲ့ အလုပ်နဲ့ page တွေလို ကြားဖြတ် အလုပ် နှစ်မျိုးလုံး အမြဲ ရှိလို့ Padauk က ကြားဖြတ် အလုပ်ကို အချိန်ရဲ့ တစ်ဝက်အောက်မှာ ထားပြီး မနက်ပိုင်း နှစ်နာရီကို အာရုံစိုက်ချိန်အဖြစ် ကာပေးပါတယ်။
      [[mark:show-p05b]] အစပိုင်း အပတ်တွေမှာ ကိုမင်းက တခြားသူတွေ အကုန် သိနေပြီး ကိုယ်ပဲ ဒီနေရာနဲ့ မတန်ဘူးလို့ ခံစားရပါတယ်။ သင်ရမယ့် system တွေ များလို့ SRE အသစ် အများစု ဒီလို ခံစားရတာ ပုံမှန်ပါပဲ။ ကိုမင်းလည်း checklist မှာ ပြီးသွားတဲ့ စာကြောင်းတွေကို မြင်ရတော့ ယုံကြည်မှု ပြန်ရလာပါတယ်။
    sources:
