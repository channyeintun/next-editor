# SRE from zero, lesson 14: Becoming an SRE (Burmese concept lesson).
#
# Built from the approved voice script
# docs/sre-course/voice-scripts/sre-14-becoming-an-sre.md. Every spoken
# character is that script's "> " lines, unchanged; each ⟪…⟫ marker became a
# [[mark:…]] at the same place. Check it with:
#   bun ~/Documents/sre-course/work/check-narration.ts \
#     docs/sre-course/voice-scripts/sre-14-becoming-an-sre.md \
#     src/studio/scripts/sre-14-becoming-an-sre.yaml
#
# Nothing runs: deck pages and the whiteboard carry the lesson, and notes.md is
# the recap. The workspace and runtime follow the validated no-code skeleton
# (WebContainer, empty init command, a harmless dev script).
#
# The arc: Thiri writes Padauk's first SRE job post (cover), and Module 4 opens
# on the loop's hub, the people (m4_map). Pages: what makes a good SRE, a week
# of persuading for three lines of code. Board B1 (P5 bars): a developer and Ko
# Zaw reach one hiring bar from opposite sides, trivia questions and a
# nine-week process, the T-shape. Page: Ko Min's lost 10 minutes. Board B2 (P7
# staircase): the onboarding staircase to on-call, the mentor under it, why
# Padauk builds a real program. Pages: goals you can check, the starter
# project, planned work against interruptions, impostor feelings. Board B3 (P6
# lanes): Ko Aung as a single point of failure, then paired with Ko Zaw, and
# the split day/night shift. Pages: growing the Padauk way, practice on your
# own, this week; recap on notes.md.
#
# Extra marks, all at existing sentence ends, add no spoken text: b1-s1b and
# b1-s1c draw the two bars as each candidate is described (B1 step 1 holds two
# bars and a legend, more than three new elements); b1-s3b lands the
# nine-week note and b2-s3b the green on-call step as they are said;
# hook-budget, p02-toil and p03-payoff only split dialogs of 454, 480 and 456
# characters in two (no action). The recap's question-line select hangs off
# sel-question, the voice script's own select mark, so the ⟪pause 3s⟫ is real
# silence (see select-question). No page or board step holds longer than
# ~35 s at 70 ms/char (l14_p02; the cover ~35 s, l14_p03 ~33 s), so no pacing
# page was added beyond the voice script's own.
#
# Boards. Colour jobs: #1e1e1e ink (paints white) for axes, arrows, bar names
# and the 24-hour label; blue the thing named (the software segments, the T,
# the onboarding steps, the settlement job); violet the second data series
# (the systems segments) and the mentor bar; green healthy or done (on-call
# reached, the pair, the split shift); red failure (trivia questions, the lost
# candidate, the single point of failure); orange the limit or caveat (the
# hiring bar, "small + growing fast"). A label on two lines is two text
# assets, one per line: the overflow rule counts a whole text's length.
#
# Deck pages: deck "Next Editor · SRE 4 · People and teams". The /pub URL
# below is the deck's published link; until this lesson's pages are built
# into it, the published copy holds only the kit pages and the Director
# reports the l14 pages missing. The voice script asks for l14_p05 as two
# plain K3 columns (no better/worse colouring); the page plan carries that as
# a note. Page plan:
# ~/Documents/sre-course/work/pages/sre-14-becoming-an-sre.json
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/sre-14-becoming-an-sre.yaml
#   bun scripts/studio-compile-check.ts src/studio/scripts/sre-14-becoming-an-sre.yaml
