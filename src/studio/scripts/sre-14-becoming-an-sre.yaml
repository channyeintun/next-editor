  - id: starter-project
    chapter: ကိုမင်းရဲ့ starter project
    narration: >
      [[mark:show-p03b]] ဒါဆို ကိုမင်းရဲ့ starter project ကို ဘာရွေးမလဲ? settlement job ကို ပြန် design လုပ်တာ၊ လက်နဲ့ အမ်းနေရတဲ့ refund တွေကို ရှင်းတာ၊ ပြီးတော့ incident ညက ရှိခဲ့ရင် အချိန် ကယ်ပေးနိုင်မယ့် operator အလိုက် fail dashboard ဆိုပြီး သုံးခု ရှိပါတယ်။ ကိုယ်ဆိုရင် ဘယ်ဟာ ရွေးမလဲ ခဏ စဉ်းစားကြည့်ပါ။
      [[mark:show-p04]] settlement ကို ပြန် design လုပ်တာက ဘဏ်ရဲ့ ခွင့်ပြုချက် စောင့်ရတဲ့ အလုပ်ကြီးမို့ လူသစ်နဲ့ မသင့်ပါဘူး။ refund ရှင်းတာကတော့ toil ကို ထပ်လုပ်ရုံမို့ ဘာအသစ်မှ မသင်ရပါဘူး။ ဒါကြောင့် dashboard ကို ရွေးပြီး မသီရိက mentor လုပ်ပေးပါတယ်။ လေးပတ်နေရင် အဖွဲ့ကို demo ပြရမယ်၊ နောက် incident မှာ တစ်ယောက်ယောက် တကယ် ဖွင့်သုံးမှ အောင်မြင်တာပါ။
      [[mark:show-p04b]] ဘာကြောင့် ဒီ dashboard က ပထမ project ကောင်း ဖြစ်တာလဲ? ဆောက်ရင်း gateway၊ monitoring နဲ့ Top-up data ကို ဖြတ်သွားရလို့ system ကို တကယ် သင်ရပါတယ်။ ပျက်ရင်တောင် ငွေပေးတဲ့ လမ်းကို မထိသလို အလောတကြီးလည်း မလိုပါဘူး။ ဒါပေမဲ့ အဖွဲ့ တကယ် လိုချင်နေတဲ့ tool ဖြစ်ပြီး တခြားသူကို မစောင့်ဘဲ ကိုမင်း ကိုယ်တိုင် ပြီးနိုင်ပါတယ်။
    sources:
