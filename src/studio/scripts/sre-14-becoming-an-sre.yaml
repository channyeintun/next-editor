  - id: people-redundancy
    chapter: လူမှာလည်း အရန်
    narration: >
      [[mark:close-p05b]] [[mark:b3-s1]] lesson ၅ က ကိုအောင်ကို သတိရပါလား? settlement job ရပ်တဲ့ ရိုးရိုး case တွေကို runbook နဲ့ တခြားသူတွေ ပြင်တတ်လာပေမဲ့ ခက်တဲ့ ညတွေမှာ ကိုအောင်ကိုပဲ နှိုးရတုန်းပါ။ ဒီလို တစ်ခုတည်း ပျက်ရင် တစ်ခုလုံး ရပ်သွားမယ့် အစိတ်အပိုင်း၊ single point of failure က server တင် မကဘဲ လူလည်း ဖြစ်နိုင်ပါတယ်။
      [[mark:b3-s2]] server တစ်လုံး ပျက်လည်း ဆက်လည်ပတ်အောင် အပို တစ်လုံး ထားသလို လူမှာလည်း system တိုင်း၊ shift တိုင်းအတွက် လိုတာထက် အနည်းဆုံး တစ်ယောက် ပိုထားတာကို N plus one လို့ ခေါ်ပါတယ်။ ဒါကြောင့် ကိုဇော် ဝင်လာတာနဲ့ ကိုအောင်နဲ့ တွဲပေးပြီး ခက်တဲ့ ညတွေကိုပါ ကိုယ်တိုင် ပြင်နိုင်တဲ့အထိ လက်လွှဲပါမယ်။
      [[mark:b3-s3]] လူ တစ်ယောက် on-call အသင့် ဖြစ်ဖို့ တစ်နှစ်လောက်အထိ ကြာနိုင်လို့ လူ ထွက်သွားရင် ဆုံးရှုံးမှု ကြီးပါတယ်၊ on-call ကိုယ်တိုင်ကလည်း လူတွေ အလုပ်ထွက်တဲ့ အဓိက အကြောင်းရင်း တစ်ခုပါ။ ဒါကြောင့် Padauk က ၂၄ နာရီ on-call shift ကို နေ့ပိုင်း ညပိုင်း ခွဲလိုက်လို့ ကိုအောင်က နေ့ပိုင်းကိုပဲ ယူလို့ရပြီး လိုရင် အချင်းချင်း shift လဲလို့ရပါတယ်။
    sources:
