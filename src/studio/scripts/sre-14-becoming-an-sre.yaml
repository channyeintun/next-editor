      notes.md: |
        # SRE တစ်ယောက် ဖြစ်လာဖို့

        - T-shaped — အလွှာ အများကြီးကို ကျယ်ကျယ် သိ၊ တစ်ခု နှစ်ခုမှာ နက်နက် ကျွမ်း
        - starter project — အဖွဲ့ လိုချင်ပြီး လူသစ် ကိုယ်တိုင် ပြီးနိုင်တဲ့ ပထမ project အစစ်
        - shadowing / reverse shadowing — ဘေးက လိုက်ကြည့် → ကိုယ်တိုင် handle လုပ်
        - စီစဉ်ထားတဲ့ အလုပ်နဲ့ ကြားဖြတ် အလုပ် — ကြားဖြတ်ကို အချိန်ရဲ့ တစ်ဝက်အောက်မှာ ထား
        - N+1 (လူ) — system တိုင်း၊ shift တိုင်းမှာ လိုတာထက် တစ်ယောက် ပို

        မေးခွန်း: "Kubernetes ကို လေ့လာမယ်" ကို စစ်လို့ရတဲ့ ပန်းတိုင် ဖြစ်အောင် ပြန်ရေးပါ။
