      # main.js: pinned complete, never keystroke-typed. go() only calls show()
      # until the lesson block-inserts the view transition at its top. show()
      # also moves keyboard focus into the view it shows (the dish heading, or
      # back to the picked card), since the focused button was just hidden.
      main.js: |
        // main.js: a tiny single-page app. One page holds two views, the menu
        // and one dish, and a click swaps them without loading a new page.
        const menuView = document.querySelector("#menu-view");
        const dishView = document.querySelector("#dish-view");
        const dishPhoto = document.querySelector(".dish-photo");
        const dishName = document.querySelector(".dish-name");

        // Two hidden status lines that only the lesson's checks read.
        const viewStatus = document.querySelector("#view-status");
        const vtStatus = document.querySelector("#vt-status");

        // Update the DOM: fill in the dish, hide one view and show the other.
        function show(view, card) {
          if (card) {
            dishPhoto.src = card.querySelector(".thumb").src;
            dishName.textContent = card.querySelector(".name").textContent;
          }
          menuView.hidden = view !== "menu";
          dishView.hidden = view !== "dish";
          viewStatus.textContent = view;
          // Move keyboard focus into the view on screen; the focused button
          // was just hidden, and focus would otherwise fall back to the page.
          if (view === "dish") {
            dishName.focus();
          } else {
            document.querySelector(".is-picked")?.focus();
          }
        }

        // Go to a view.
        function go(view, card) {
          show(view, card);
        }

        document.addEventListener("click", (event) => {
          const card = event.target.closest(".dish-card");
          if (card) {
            // Mark the clicked card, so CSS can find its photo.
            for (const picked of document.querySelectorAll(".is-picked")) {
              picked.classList.remove("is-picked");
            }
            card.classList.add("is-picked");
            go("dish", card);
          }
          if (event.target.closest(".back-button")) {
            go("menu");
          }
        });
      # base.css: kit sections A, B, B2 and C (section D dropped). Section E:
      # the look of the dish list, the cards, the square thumbnails (cropped
      # with object-fit on the real <img>, never shown) and the wide dish photo.
      base.css: |
        /*
          base.css: pinned, never typed during a lesson.
          The shop's palette and the page "furniture", so the CSS a lesson types can
          focus on one idea. Each lesson keeps only the sections it needs and drops
          any declaration that its own demo types or relies on being absent
          (COURSE-KIT.md, "Deriving a lesson workspace"). B2 travels with B (every
          lesson that keeps B keeps B2, except lesson 2, which types the reset).
          Section E holds the few lesson-specific rules a start state pins.
          Lesson 42 keeps A, B, B2 and C (section D dropped). Section E pins the
          look of the two views; nothing here names a view transition.
          Keep it free of the url, image-set and @-import functions (they switch on
          Vite's postcss step); images come from <img> or the pinned images.css.
        */

        /* == A. palette == */
        :root {
          color-scheme: light;
          --tea-dark: #3b2314;
          --tea: #8b5a2b;
          --tea-light: #c9a27e;
          --cream: #fff8ec;
          --paper: #fdf3e1;
          --leaf: #2f6b3a;
          --gold: #c9a227;
          --chili: #b23a2b;
          --ink: #2b1d14;
          --muted: #6b5a4c;
          --line: #e6d5bf;
          --radius: 12px;
        }

        /* == B. page == */
        body {
          margin: 0;
          font-family: "Noto Sans Myanmar", "Myanmar Sangam MN", "Myanmar MN", "Myanmar Text", "Padauk",
            system-ui, sans-serif;
          font-size: 16px;
          line-height: 1.8;
          color: var(--ink);
          background: var(--paper);
        }

        .page {
          padding: 0 16px 24px;
        }

        h1,
        h2,
        h3 {
          margin: 0 0 8px;
          line-height: 1.5;
        }

        h1 {
          font-size: 24px;
        }

        h2 {
          font-size: 20px;
        }

        h3 {
          font-size: 17px;
        }

        a {
          color: var(--tea);
        }

        /* Status lines that only expect.preview reads (kit.js data-report, data-say). */
        .visually-hidden {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip-path: inset(50%);
          white-space: nowrap;
        }

        /* == B2. reset (lesson 2 teaches it; every later lesson keeps it) == */
        *,
        *::before,
        *::after {
          box-sizing: border-box;
        }

        /* == C. furniture == */
        .site-header {
          padding: 16px;
          background: var(--tea-dark);
          color: var(--cream);
        }

        .site-header a {
          color: var(--cream);
        }

        .logo {
          display: block;
        }

        .tagline {
          margin: 0;
          color: var(--tea-light);
          font-size: 14px;
        }

        .nav ul {
          margin: 8px 0 0;
          padding: 0;
          list-style: none;
        }

        .hero {
          margin: 16px 0;
          padding: 16px;
          background: var(--cream);
          border-radius: var(--radius);
        }

        .menu {
          margin: 0;
          padding: 0;
          list-style: none;
        }

        .menu-card {
          margin: 0 0 12px;
          padding: 12px 16px;
          background: #fff;
          border: 1px solid var(--line);
          border-radius: var(--radius);
        }

        .menu-card .name,
        .menu-card .desc {
          margin: 0;
        }

        .menu-card .desc {
          color: var(--muted);
          font-size: 14px;
        }

        .price {
          font-weight: 700;
          color: var(--tea);
        }

        .badge {
          padding: 0 8px;
          border-radius: 999px;
          background: var(--leaf);
          color: #fff;
          font-size: 13px;
        }

        .sold-out {
          opacity: 0.6;
        }

        .order-link,
        .order-btn {
          display: inline-block;
          padding: 6px 16px;
          border: 0;
          border-radius: 999px;
          background: var(--tea);
          color: #fff;
          font: inherit;
          text-decoration: none;
        }

        .order-form label {
          display: block;
          margin-top: 8px;
        }

        .order-form input[type="text"],
        .order-form input[type="tel"],
        .order-form input[type="number"] {
          box-sizing: border-box;
          width: 100%;
          padding: 6px 10px;
          border: 1px solid var(--line);
          border-radius: 8px;
          background: #fff;
          font: inherit;
        }

        .order-btn {
          margin-top: 12px;
        }

        .gallery figure {
          margin: 0 0 12px;
        }

        .gallery img {
          display: block;
          max-width: 100%;
          height: auto;
          border-radius: var(--radius);
        }

        figcaption {
          color: var(--muted);
          font-size: 14px;
        }

        .hours-list {
          margin: 0;
          padding-left: 20px;
        }

        .site-footer {
          margin-top: 24px;
          padding: 16px;
          background: var(--tea-dark);
          color: var(--cream);
          font-size: 14px;
        }

        .site-footer a {
          color: var(--cream);
        }

        /* == E. lesson rules == */
        /* Lesson 42: the two views of the single-page app. The menu view is a
           list of dish buttons with square thumbnails; the dish view has a wide
           photo. Their view transitions are typed in the lesson. */
        .menu-view,
        .dish-view {
          padding-top: 16px;
        }

        .dish-list {
          display: grid;
          gap: 12px;
          margin: 0;
          padding: 0;
          list-style: none;
        }

        .dish-card {
          display: flex;
          align-items: center;
          gap: 16px;
          width: 100%;
          padding: 8px 16px 8px 8px;
          border: 1px solid var(--line);
          border-radius: var(--radius);
          background: #fff;
          color: inherit;
          font: inherit;
          text-align: start;
          cursor: pointer;
        }

        .dish-card .name {
          flex: 1;
          font-weight: 700;
        }

        .thumb {
          display: block;
          width: 72px;
          height: 72px;
          object-fit: cover;
          border-radius: 8px;
        }

        .dish-photo {
          display: block;
          width: 100%;
          height: auto;
          border-radius: var(--radius);
        }

        .dish-name {
          margin: 12px 0 0;
        }

        /* main.js moves focus to this heading (tabindex -1) when the dish view
           opens, so screen readers announce it; it isn't a control, so no ring. */
        .dish-name:focus {
          outline: none;
        }
