# CSS course (Burmese), lesson 42 of 43: view transitions.
#
# Narration is Burmese (voice-script.md next to this file is the same text with
# notes; DESIGN.md is the span-by-span brief). Every [[mark:…]] sits where its action
# begins, at a sentence end; each span carries one piece of meaning.
# Everything the learner sees (title, chapters, whiteboard labels, UI strings)
# is Burmese already.
#
# Shape: board A (recall lesson 41; a single-page app swaps its content in one
# step, and the old content is gone before anything could animate) → code tour
# (index.html: the menu view with three dish buttons, the hidden dish view, two
# hidden status lines; main.js: show() changes the DOM, go() only calls show(),
# the click listener marks the clicked card .is-picked) → clicks: the dish view
# replaces the menu in one step and back (the problem, live — main.js has no
# view transition yet) → board B (the five steps of startViewTransition; the
# page can't be clicked while it runs) → ONE block insert into go(): feature
# detection, the options object with update + types, finished → status line,
# return; the old show() line stays below as the fallback (the page reloads) →
# click a dish (vt-status "forwards"), honest replay note, board C (default
# cross-fade in three frames, 0.25 s ease, plus-lighter) → board D (the
# pseudo-element tree; root comes from the UA stylesheet on html) → typed CSS:
# group(root) 1.5 s (old/new inherit the timing) → slide keyframes on old/new +
# board E (three frames) → types: mirrored keyframes inside
# html:active-view-transition-type(backwards) with nesting, click back
# (vt-status "backwards") → view-transition-name: dish-photo on the big photo
# and the picked card's thumbnail, the photo group's own duration, click a dish
# (class "dish-card is-picked") + board F (the morph in three frames) → board G
# (one element per name before and after; duplicates skip the animation;
# display: none doesn't count; list-to-detail naming; match-element;
# view-transition-class) → board H + typed height: 100% / object-fit: cover on
# the photo's old/new; fit-content for text; a still header → reduced motion
# media query, click back → recap (cross-document @view-transition,
# element-scoped transitions, one quiz question), hand-off to Tailwind (43).
#
# Replay honesty (PLATFORM.md §3): document.startViewTransition shows only the
# final state in the recording (the snapshots and ::view-transition
# pseudo-elements are not DOM). So every animation is drawn on a whiteboard as
# frames, the narration says so once (after-palata) and invites learners to run
# the project in their own browser, and each transition leaves a DOM fact: the
# finished promise writes its type into the hidden vt-status line.
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only keystroke-typed
# file and never contains url(, @import or image-set(; no postcss config. A
# keystroke-typed "(" swallows everything after it until its ")", so every CSS
# edit is APPENDED at the end of the file (nothing follows it). None of the
# typed CSS changes the still page: it only styles a running transition.
# main.js gets ONE block insert of complete statements (Vite reloads the page,
# which returns to the menu view); every click comes after its last edit. The
# feature check also asks for the types option (Chrome 125, Safari 18.2,
# Firefox 147): older versions have startViewTransition but reject the options
# object, so they take the plain show() fallback. No HTML edit. No kit.js
# (main.js owns the clicks).
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
schemaVersion: 1

