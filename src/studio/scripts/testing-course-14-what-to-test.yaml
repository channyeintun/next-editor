      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ test တွေကို အရွယ်အစားနဲ့ ရည်ရွယ်ချက်အလိုက် ခေါ်ပုံတွေကို
      ကြည့်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ ဘာကို အရင် test လုပ်မလဲ၊ test တစ်ခုက ဘာကို စစ်ပြီး ဘာကို
      မစစ်သင့်လဲ ဆိုတာ ကြည့်ပါမယ်။ [[mark:draw-goal]] အရင်ဆုံး မှတ်ထားရမှာက test ရေးတာ
      ကိုယ်တိုင်က ပန်းတိုင် မဟုတ်ဘူး ဆိုတာပါ။ ကိုယ် တကယ် လိုချင်တာက customer တွေ စိတ်ချ သုံးလို့ရတဲ့ ဆိုင်
      ဖြစ်ပြီး၊ test တွေက အဲဒီကို ရောက်ဖို့ နည်းလမ်း တစ်ခုပါ။ [[mark:draw-high]] ဒါကြောင့်
      ပျက်သွားရင် ငွေ ဒါမှမဟုတ် ယုံကြည်မှု ဆုံးမယ့် နေရာကနေ စပါတယ်။ ဆိုင်မှာဆိုရင် စုစုပေါင်း ငွေ၊
      လျှော့ဈေးနဲ့ ပို့ခ လို ငွေနဲ့ ဆိုင်တဲ့ code တွေ၊ customer တစ်ယောက် အော်ဒါ မှာပြီး ငွေရှင်းတဲ့ အဓိက
      အသုံးပြုပုံတွေပါ။ unit test ဖြစ်ဖြစ်၊ end to end test ဖြစ်ဖြစ်၊ အရွယ်အစား ဘာပဲ ဖြစ်ဖြစ် ဒီ
      နေရာတွေကို ဦးစားပေးပါတယ်။ [[mark:draw-low]] ဆိုင်အကြောင်း ရေးထားတဲ့ စာလို၊ ပျက်ရင် ထိခိုက်မှု
      နည်းပြီး မပြောင်းသလောက် ရှိတဲ့ နေရာတွေကိုတော့ နောက်မှ ထားလို့ ရပါတယ်။ [[mark:draw-many]] test
      အရေအတွက် များတာကိုပဲ ကြည့်ပြီး စိတ်ချလို့ မရပါဘူး။ ပြီးခဲ့တဲ့ lesson မှာ unit test လေးခုလုံး
      အောင်နေရင်တောင် ငွေရှင်းတဲ့ code မှာ bug ရှိနေခဲ့တာကို မြင်ခဲ့ပြီးပါပြီ။
    sources:
      - {
          title: "web.dev Learn Testing: What to test and your approach",
          url: "https://web.dev/learn/testing/get-started/what-to-test",
        }
      - {
          title: "web.dev Learn Testing: Welcome, the philosophy of testing",
          url: "https://web.dev/learn/testing/welcome",
        }
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-goal
        type: whiteboard.apply
        at: { mark: draw-goal }
        upsertIds: [a-goal]
        drawMs: 1600
      - id: draw-high
        type: whiteboard.apply
        at: { mark: draw-high }
        upsertIds: [a-high-box, a-high-head, a-high-1, a-high-2, a-high-3]
        drawMs: 3500
      - id: draw-low
        type: whiteboard.apply
        at: { mark: draw-low }
        upsertIds: [a-low-box, a-low-head, a-low-1, a-low-2]
        drawMs: 2800
      - id: draw-many
        type: whiteboard.apply
        at: { mark: draw-many }
        upsertIds: [a-many]
        drawMs: 1500

  - id: starter
    narration: >
      ပို့ခ တွက်တဲ့ code ကို ကြည့်ရအောင်။ ဒါက ဆိုင်ရဲ့ delivery ဖိုင်ပါ။ [[mark:select-fee]] ဒီ function
      က ကီလိုမီတာနဲ့ အော်ဒါ စုစုပေါင်းကို လက်ခံပြီး ပို့ခကို ပြန်ပေးပါတယ်။ ၂ ကီလိုမီတာ အထိ ၁၀၀၀ ကျပ်၊
      အဲဒီနောက် ကီလိုမီတာ စတိုင်း ၃၀၀ ကျပ် ထပ်ပေါင်းပြီး၊ ၂၀၀၀၀ ကျပ်နဲ့ အထက် အော်ဒါကိုတော့ အခမဲ့
      ပို့ပေးပါတယ်။ ဒီ function မှာ ပြဿနာ တစ်ခု ကျန်နေပါသေးတယ်။ ဘယ်မှာလဲ ဆိုတာ test တွေနဲ့
      ရှာကြည့်ပါမယ်။ [[mark:select-new]] အောက်က function ကတော့ delivery အသစ် တစ်ခုကို customer
      နာမည်၊ မြို့နယ်နဲ့ စောင့်နေဆဲ ဆိုတဲ့ status နဲ့ ဖန်တီးပေးပါတယ်။ [[mark:open-test]] test ဖိုင်ကိုလည်း
      ဖွင့်ကြည့်ရအောင်။ [[mark:select-mid]] ပထမ test နှစ်ခုက ၃ ကီလိုမီတာ ဆိုရင် ၁၃၀၀ ကျပ်၊ ၅ ကီလိုမီတာ
      ဆိုရင် ၁၉၀၀ ကျပ် ဖြစ်ရမယ်လို့ စစ်ထားပါတယ်။ နှစ်ခုလုံး စည်းကမ်း တစ်ခုရဲ့ အလယ်လောက်က
      တန်ဖိုးတွေပါ။ [[mark:select-equal]] တတိယ test ကတော့ မောင်မောင်အတွက် ဗဟန်းကို ပို့မယ့် delivery
      ကို ဖန်တီးပြီး၊ ရလာတဲ့ object တစ်ခုလုံးကို to Equal နဲ့ အတိအကျ စစ်ထားပါတယ်။
    sources:
      - {
          title: "Vitest: Testing in Practice, what to test",
          url: "https://vitest.dev/guide/learn/testing-in-practice#what-to-test",
        }
      - { title: "Vitest: expect, toEqual", url: "https://vitest.dev/api/expect#toequal" }
    actions:
      - id: close-risk
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: select-fee
        type: editor.select
        at: { mark: select-fee }
        target:
          {
            file: src/delivery.js,
            text: "if (total >= 20000) return 0;\n  return 1000 + 300 * Math.ceil(Math.max(0, km - 2));",
            occurrence: 1,
          }
      - id: select-new
        type: editor.select
        at: { mark: select-new }
        target:
          {
            file: src/delivery.js,
            text: 'return { customer, township, status: "waiting" };',
            occurrence: 1,
          }
      - id: open-test
        type: workspace.openFile
        at: { mark: open-test }
        path: src/delivery.test.js
      - id: select-mid
        type: editor.select
        at: { mark: select-mid }
        target:
          { file: src/delivery.test.js, text: "expect(deliveryFee(3)).toBe(1300);", occurrence: 1 }
      - id: select-equal
        type: editor.select
        at: { mark: select-equal }
        target: { file: src/delivery.test.js, text: "expect(delivery).toEqual({", occurrence: 1 }

  - id: panel
    narration: >
      [[mark:ready]] ဒီ test တွေကို Vitest က run လိုက်တော့ ဘာ ပြလဲ ကြည့်ရအောင်။ ညာဘက်က panel ကလည်း
      အရင်လိုပဲ code ပြောင်းတိုင်း Vitest က သူ့ဘာသာ ပြန် run ပြီး ပြပေးတဲ့ ရလဒ်ပါ။ [[mark:read-pass]] test
      သုံးခုလုံး အမှန်ခြစ် ရနေပြီး၊ summary မှာလည်း Tests မှာ ၃ ခု pass လို့ ပြနေပါတယ်။ ဒါပေမဲ့
      အစိမ်းရောင်က test တွေ စစ်ထားတဲ့ နေရာအတွက်ပဲ အဓိပ္ပာယ် ရှိပါတယ်။
    sources:
      - { title: "Vitest: Getting Started", url: "https://vitest.dev/guide/" }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-start-pass
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1000 }
      - id: expect-start-three
        type: expect.preview
        at: { afterAction: expect-start-pass }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "3" }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: contract
    chapter: "Contract နဲ့ edge case တွေ"
    narration: >
      [[mark:board-contract]] ဘာကို စစ်ရမလဲ ဆိုတာ function ရဲ့ contract ကနေ စဉ်းစားပါတယ်။ contract ဆိုတာ
      function က ဘာကို လက်ခံပြီး ဘာ ပြန်ပေးမယ်၊ ဘယ်အခါ error ပြမယ်လို့ ကတိပေးထားတာပါ။ [[mark:draw-io]]
      ပို့ခ function က ကီလိုမီတာနဲ့ အော်ဒါ စုစုပေါင်းကို လက်ခံပြီး၊ ပို့ခကို ကျပ်နဲ့ ပြန်ပေးပါတယ်။
      [[mark:draw-rules]] ဆိုင်ရှင်ရဲ့ စည်းကမ်း လေးခုကတော့ ဒီလိုပါ။ ၂ ကီလိုမီတာ အထိ ၁၀၀၀ ကျပ်၊ ကီလိုမီတာ
      စတိုင်း ၃၀၀ ထပ်ပေါင်း၊ ၂၀၀၀၀ နဲ့ အထက် အော်ဒါ အခမဲ့ ဖြစ်ပြီး၊ ဆိုင်မှာ ကိုယ်တိုင် လာယူတဲ့ ၀ ကီလိုမီတာ
      အော်ဒါလည်း အခမဲ့ပါ။ [[mark:draw-edges]] bug တွေ အများဆုံး ပုန်းနေတာက၊ test for lesson မှာ boundary
      လို့ ခေါ်ခဲ့တဲ့ စည်းကမ်း ပြောင်းသွားတဲ့ အစွန်းတွေမှာပါ။ ဒါကြောင့် ၂ နဲ့ ၂ ဒသမ ၅ ကီလိုမီတာ၊ ၁၉၉၉၉ နဲ့ ၂၀၀၀၀
      ကျပ်၊ ပြီးတော့ ၀ ကီလိုမီတာကို စစ်ရပါမယ်။ [[mark:draw-real]] edge case တစ်ခုကို စစ်သင့်မသင့်
      မသေချာရင်၊ တကယ့် customer ဒါမှမဟုတ် တကယ့် code က အဲဒီ input ကို ပေးနိုင်လား မေးကြည့်ပါ။ ဆိုင်မှာ
      လာယူတဲ့ customer တကယ် ရှိလို့ ၀ ကီလိုမီတာကို စစ်ရပါမယ်။
    sources:
      - {
          title: "Vitest: Testing in Practice, testing edge cases",
          url: "https://vitest.dev/guide/learn/testing-in-practice#testing-edge-cases",
        }
      - {
          title: "Vitest: Testing in Practice, what to test (the contract)",
          url: "https://vitest.dev/guide/learn/testing-in-practice#what-to-test",
        }
    actions:
      - id: board-contract
        type: whiteboard.apply
        at: { mark: board-contract }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-io
        type: whiteboard.apply
        at: { mark: draw-io }
        upsertIds: [b-in, b-out]
        drawMs: 2000
      - id: draw-rules
        type: whiteboard.apply
        at: { mark: draw-rules }
        upsertIds: [b-rules-box, b-r1, b-r2, b-r3, b-r4]
        drawMs: 4000
      - id: draw-edges
        type: whiteboard.apply
        at: { mark: draw-edges }
        upsertIds: [b-edge-head, b-e1, b-e3, b-e4]
        drawMs: 2800
      - id: draw-real
        type: whiteboard.apply
        at: { mark: draw-real }
        upsertIds: [b-real]
        drawMs: 1500

  - id: edges
    narration: >
      ဒီ အစွန်းတွေကို test for ဇယား တစ်ခုနဲ့ ရေးကြည့်ရအောင်။ [[mark:type-table]] ပထမ test နှစ်ခုရဲ့
      အောက်မှာ ဇယား တစ်ခု ထည့်ပါမယ်။ ဇယားရဲ့ row တစ်ကြောင်းစီက သူ့နာမည်နဲ့သူ test တစ်ခုစီ
      ဖြစ်လာပါမယ်။ [[mark:select-rows]] row တစ်ကြောင်းမှာ ကီလိုမီတာ၊ အော်ဒါ စုစုပေါင်းနဲ့ ဖြစ်ရမယ့် ပို့ခ
      ပါပြီး၊ ခုနက အစွန်း ငါးခုကို တစ်ကြောင်းစီ ရေးထားပါတယ်။ [[mark:select-zero]] နောက်ဆုံး row က
      ဆိုင်မှာ လာယူတဲ့ အော်ဒါပါ။ [[mark:read-red]] panel ကို ကြည့်ပါ။ row လေးကြောင်းက pass ဖြစ်ပေမဲ့၊ ၀
      ကီလိုမီတာ row မှာ ကြက်ခြေခတ် ပေါ်နေပြီး အပေါ်က PASS ကလည်း FAIL ဖြစ်သွားပါပြီ။ Failed Tests
      အပိုင်းမှာ သုည ဖြစ်ရမယ့် နေရာမှာ ၁၀၀၀ ရနေတယ်လို့ ပြောနေပါတယ်။ [[mark:read-meaning]] ဆိုလိုတာက
      ဆိုင်မှာ လာယူတဲ့ customer ဆီကလည်း ပို့ခ ၁၀၀၀ ကျပ် ယူမိနေတာပါ။ အလယ်က တန်ဖိုးတွေကိုပဲ စစ်ထားလို့
      ခုနက test သုံးခုက ဒီ bug ကို မမြင်ခဲ့တာပါ။
    sources:
      - { title: "Vitest: test.for", url: "https://vitest.dev/api/test#test-for" }
      - {
          title: "Vitest: Testing in Practice, testing edge cases",
          url: "https://vitest.dev/guide/learn/testing-in-practice#testing-edge-cases",
        }
    actions:
      - id: close-contract
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-test-2
        type: workspace.openFile
        at: { mark: type-table }
        path: src/delivery.test.js
      - id: type-table
        type: editor.type
        at: { afterAction: open-test-2 }
        target:
          {
            file: src/delivery.test.js,
            after: "  expect(deliveryFee(5)).toBe(1900);\n});\n",
            occurrence: 1,
          }
        text: "\ntest.for([\n  { km: 2, total: 0, fee: 1000 },\n  { km: 2.5, total: 0, fee: 1300 },\n  { km: 3, total: 20000, fee: 0 },\n  { km: 3, total: 19999, fee: 1300 },\n  { km: 0, total: 0, fee: 0 },\n])(\"charges $fee for $km km, order $total\", ({ km, total, fee }) => {\n  expect(deliveryFee(km, total)).toBe(fee);\n});\n"
        # One block (pilot note 1): a table typed line by line would run Vitest on half-typed rows.
        cadence: block
      - id: expect-red
        type: expect.preview
        at: { afterAction: type-table }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-red-count
        type: expect.preview
        at: { afterAction: expect-red }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-failed, value: "1" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-red-message
        type: expect.preview
        at: { afterAction: expect-red-count }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-message, value: "expected 1000 to be +0 // Object.is equality" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-red-row
        type: expect.preview
        at: { afterAction: expect-red-message }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-7 }
        attribute: { name: data-name, value: "charges 0 for 0 km, order 0" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-red-row-state
        type: expect.preview
        at: { afterAction: expect-red-row }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-7 }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-rows
        type: editor.select
        at: { mark: select-rows }
        target:
          {
            file: src/delivery.test.js,
            text: "{ km: 2, total: 0, fee: 1000 },\n  { km: 2.5, total: 0, fee: 1300 },\n  { km: 3, total: 20000, fee: 0 },\n  { km: 3, total: 19999, fee: 1300 },",
            occurrence: 1,
          }
      - id: select-zero
        type: editor.select
        at: { mark: select-zero }
        target: { file: src/delivery.test.js, text: "{ km: 0, total: 0, fee: 0 },", occurrence: 1 }
      - id: expect-red-actual
        type: expect.preview
        at: { mark: read-red }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-actual, value: "1000" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-red-seven
        type: expect.preview
        at: { afterAction: expect-red-actual }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "7" }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: fix-zero
    narration: >
      [[mark:open-fee]] ဒါဆို delivery ဖိုင်မှာ ဒီ စည်းကမ်းကို ထည့်ပေးရအောင်။ [[mark:type-zero]] function
      ရဲ့ အစမှာ ကီလိုမီတာ သုည ဖြစ်ရင် ပို့ခ မယူဘဲ သုည ပြန်ပေးတဲ့ line တစ်ကြောင်း ထည့်ပါမယ်။ တခြား
      စည်းကမ်းတွေကို မစစ်ခင် ဆိုင်မှာ လာယူတဲ့ အော်ဒါကို အရင်ဆုံး ခွဲထုတ်လိုက်တာပါ။
      [[mark:read-green]] panel ကို ပြန်ကြည့်ပါ။ test ရှစ်ခုလုံး pass ဖြစ်ပြီး၊ FAIL ကလည်း အစိမ်းရောင် PASS
      ပြန်ဖြစ်သွားပါပြီ။ စည်းကမ်း တစ်ခုစီရဲ့ အစွန်းမှာ row တစ်ကြောင်းစီ ရှိနေလို့၊ နောက်တစ်ခါ ဒီ
      စည်းကမ်းတွေ ပြောင်းရင် ဘယ် အစွန်း ပျက်လဲ ဆိုတာ ချက်ချင်း သိနိုင်ပါတယ်။
    sources:
      - {
          title: "Vitest: Testing in Practice, testing edge cases",
          url: "https://vitest.dev/guide/learn/testing-in-practice#testing-edge-cases",
        }
    actions:
      - id: open-fee
        type: workspace.openFile
        at: { mark: open-fee }
        path: src/delivery.js
      - id: type-zero
        type: editor.type
        at: { mark: type-zero }
        target:
          {
            file: src/delivery.js,
            after: "export function deliveryFee(km, total = 0) {\n",
            occurrence: 1,
          }
        text: "  if (km === 0) return 0;\n"
      - id: expect-green
        type: expect.preview
        at: { afterAction: type-zero }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-green-count
        type: expect.preview
        at: { afterAction: expect-green }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "8" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-fee-file
        type: expect.file
        at: { afterAction: expect-green-count }
        path: src/delivery.js
        contains: "  if (km === 0) return 0;\n  if (total >= 20000) return 0;"

  - id: opaque
    chapter: "Opaque box ကနေ စစ်ရအောင်"
    narration: >
      ကဲ၊ အောက်က delivery အသစ် ဖန်တီးတဲ့ function ဘက် လှည့်ကြည့်ရအောင်။ ဆိုင်က အော်ဒါ ဘယ်ကနေ
      ဝင်လာလဲ ဆိုတာကို အစီရင်ခံစာမှာ ပြချင်လာလို့၊ delivery တိုင်းမှာ source ဆိုတဲ့ field ကို ထည့်မယ် ဆိုပါစို့။ [[mark:type-source]]
      delivery object ရဲ့ နောက်ဆုံးမှာ ဖုန်းနဲ့ မှာတယ်လို့ မှတ်တဲ့ source ကို ထည့်လိုက်ပါမယ်။ delivery ကို
      သုံးနေတဲ့ မီးဖိုချောင်နဲ့ ပို့တဲ့သူရဲ့ screen တွေကတော့ ဒီ field ကို မသုံးပါဘူး။ [[mark:read-red2]]
      panel ကို ကြည့်ပါ။ delivery ကို စစ်တဲ့ test က ကျသွားပြီး၊ diff မှာ အနီရောင် Received ဘက်က source
      ဆိုတဲ့ line တစ်ကြောင်း ပိုနေတာကို ပြနေပါတယ်။ [[mark:why-red2]] ဒါပေမဲ့ customer နာမည်၊ မြို့နယ်နဲ့ status
      က ပြောင်းမသွားပါဘူး။ ဒီ test က object ရဲ့ field တိုင်းကို ချုပ်ထားလို့၊ delivery ကို သုံးတဲ့ code တွေ
      မသုံးတဲ့ field တစ်ခု တိုးလာတာနဲ့ ဘာမှ မပျက်ဘဲ ကျသွားတာပါ။ code ပြောင်းတိုင်း လိုက်ပြင်ရတဲ့ test က ကျတိုင်း
      ကျမှာပဲလို့ ကြိုသိနေတဲ့အတွက်၊ တကယ် ပျက်တဲ့ နေ့မှာလည်း ဘာမှ သတိမပေးနိုင်တော့ပါဘူး။
    sources:
      - {
          title: "web.dev Learn Testing: What to test, opaque versus clear box",
          url: "https://web.dev/learn/testing/get-started/what-to-test#opaque-box",
        }
      - {
          title: "web.dev Learn Testing: Types of automated testing, tests that need updating on every change",
          url: "https://web.dev/learn/testing/get-started/test-types#visual",
        }
      - {
          title: "Kent C. Dodds: Testing Implementation Details (facts C13)",
          url: "https://kentcdodds.com/blog/testing-implementation-details",
        }
    actions:
      - id: type-source
        type: editor.type
        at: { mark: type-source }
        target: { file: src/delivery.js, after: 'status: "waiting"', occurrence: 1 }
        text: ', source: "phone"'
      - id: expect-red2
        type: expect.preview
        at: { afterAction: type-source }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-red2-test
        type: expect.preview
        at: { afterAction: expect-red2 }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-8 }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-red2-error
        type: expect.preview
        at: { afterAction: expect-red2-test }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-test, value: "creates a waiting delivery" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-red2-diff
        type: expect.preview
        at: { mark: read-red2 }
        timeoutMs: 5000
        target: { by: testId, value: vt-diff-1 }
        textContains: '"source": "phone"'
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: match
    narration: >
      ဒါကြောင့် function ကို အထဲကို မကြည့်ဘဲ၊ သူ့ကို သုံးတဲ့ code မြင်ရတဲ့ အတိုင်း
      ပြင်ပကနေ စစ်ပါတယ်။ ဒါကို opaque box testing လို့ ခေါ်ပြီး၊ အထဲက အသေးစိတ်ကိုပါ ကြည့်စစ်တာကိုတော့
      clear box testing လို့ ခေါ်ပါတယ်။ opaque box နဲ့ စစ်ထားရင် အတွင်းပိုင်းကို ဘယ်လိုပဲ ပြင်ပြင် ရလဒ် မပြောင်းသရွေ့
      test က မကျလို့၊ code ကို စိတ်ချ ပြင်လို့ ရပါတယ်။
      [[mark:open-test-3]] test ဖိုင်မှာ သုံးတဲ့ code အားကိုးတာကိုပဲ စစ်အောင် ပြင်ကြည့်ရအောင်။
      [[mark:type-match]] object တစ်ခုလုံးကို to Equal နဲ့ စစ်တဲ့ line ရဲ့ နေရာမှာ to Match Object ကို
      ထည့်ပြီး၊ line အဟောင်းကိုတော့ comment အဖြစ် အောက်မှာ ထားခဲ့ပါမယ်။ ကိုယ့် project မှာဆိုရင်တော့ matcher
      နာမည်ကိုပဲ ပြောင်းရေးလိုက်ရုံပါပဲ။ [[mark:select-match]] to Match
      Object က ကိုယ် ပေးထားတဲ့ field သုံးခု ပါလား၊ မှန်လား ဆိုတာကိုပဲ စစ်ပြီး၊ တခြား field ပိုနေတာကိုတော့
      လက်ခံပါတယ်။ [[mark:read-green2]] panel ကို ပြန်ကြည့်ပါ။ test ရှစ်ခုလုံး ပြန် pass ဖြစ်သွားပါပြီ။ ဒီမှာ
      တကယ် ဆုံးဖြတ်ရတာက delivery ရဲ့ contract ပါ။ သုံးတဲ့ code တွေ အားကိုးတာက customer နာမည်ရယ်၊
      မြို့နယ်ရယ်၊ status ရယ် ဖြစ်လို့ အဲဒီ သုံးခုကို စစ်ပြီး၊ status ပျောက်သွားရင်တော့ ဒီ test က ချက်ချင်း
      ကျမှာပါ။ [[mark:rule-of-thumb]] မသေချာရင် မေးကြည့်ရမယ့် မေးခွန်းက၊ code အတွင်းပိုင်းကို ပြင်လို့ ရလဒ်
      မပြောင်းရင် test ကျသင့်လား ဆိုတာပါ။ ကျမယ်ဆိုရင် အလုပ်လုပ်ပုံ အစား အတွင်းပိုင်း အသေးစိတ်ကို
      စစ်နေတာ ဖြစ်နိုင်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn Testing: What to test, opaque versus clear box",
          url: "https://web.dev/learn/testing/get-started/what-to-test#opaque-box",
        }
      - {
          title: "Vitest: expect, toMatchObject",
          url: "https://vitest.dev/api/expect#tomatchobject",
        }
      - {
          title: "Vitest: Testing in Practice, what to test (the refactor rule of thumb)",
          url: "https://vitest.dev/guide/learn/testing-in-practice#what-to-test",
        }
    actions:
      - id: open-test-3
        type: workspace.openFile
        at: { mark: open-test-3 }
        path: src/delivery.test.js
      - id: type-match
        type: editor.type
        at: { mark: type-match }
        target:
          {
            file: src/delivery.test.js,
            after: "  const delivery = newDelivery(\"မောင်မောင်\", \"bahan\");\n  ",
            occurrence: 1,
          }
        text: "expect(delivery).toMatchObject({\n  // "
        # ONE insert at the old line's first character (COURSE-KIT §5): the toEqual line becomes a
        # comment under the new matcher and every state parses; block, so it lands as one write.
        cadence: block
      - id: expect-green2
        type: expect.preview
        at: { afterAction: type-match }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-green2-count
        type: expect.preview
        at: { afterAction: expect-green2 }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "8" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-match
        type: editor.select
        at: { mark: select-match }
        target:
          { file: src/delivery.test.js, text: "expect(delivery).toMatchObject({", occurrence: 1 }
      - id: expect-match-file
        type: expect.file
        at: { mark: read-green2 }
        path: src/delivery.test.js
        contains: "  expect(delivery).toMatchObject({\n  // expect(delivery).toEqual({"
      - id: expect-source-file
        type: expect.file
        at: { afterAction: expect-match-file }
        path: src/delivery.js
        contains: 'return { customer, township, status: "waiting", source: "phone" };'

  - id: approach
    chapter: "Test ရေးတဲ့အခါ မှတ်စရာ"
    narration: >
      [[mark:board-approach]] နောက်ဆုံး test ရေးတဲ့အခါ မှတ်ထားစရာ လေးခုကို ကြည့်ရအောင်။ [[mark:draw-one-goal]]
      ပထမက test တစ်ခုမှာ ရည်ရွယ်ချက် ရှင်းရှင်း တစ်ခုပဲ ထားဖို့ပါ။ ဇယားထဲက row တစ်ကြောင်းစီလိုပဲ၊ ကျရင်
      ဘာ ပျက်လဲ ဆိုတာ test နာမည်ကနေ တန်းသိရပါမယ်။ အရာအားလုံးကို test ကြီး တစ်ခုတည်းမှာ စုထည့်ထားရင်
      ဖတ်ရ ခက်ပါတယ်။ [[mark:draw-owner]] ဒုတိယက ဘယ်သူ့ တာဝန်လဲ ဆိုတာပါ။ code ကို ပြင်တဲ့သူက ကျသွားတဲ့
      test တွေကို ပြန် အစိမ်းရောင် ဖြစ်အောင် လုပ်ရပြီး၊ test suite တစ်ခုလုံးကတော့ team တစ်ခုလုံးရဲ့
      ပိုင်ဆိုင်မှုပါ။ [[mark:draw-legacy]] တတိယက code ဟောင်းအတွက်ပါ။ ဥပမာ ဆိုင်ရဲ့ လစဉ် ငွေစာရင်း တွက်တဲ့
      code ဟောင်းကို ဘယ်သူမှ မပြင်ရဲဘူး ဆိုပါစို့။ မပြင်ခင် သူ အခု ဘာ ပြန်ပေးနေလဲ ဆိုတာကို test တွေနဲ့
      အရင် မှတ်ထားရင်၊ ပြင်ရင်း တစ်ခုခု ပြောင်းသွားတာနဲ့ ချက်ချင်း သိရပါတယ်။ ဒီ test တွေက ပြင်နေတုန်း
      ကာပေးထားတဲ့ ငြမ်းလိုပါပဲ။ ဒါကို နောက်ပိုင်း lesson မှာ လက်တွေ့ လုပ်ကြည့်ပါမယ်။ [[mark:draw-skip]]
      နောက်ဆုံးက မစစ်ရမယ့် အရာတွေပါ။ ဂဏန်းကို အပေါ်ကို ပြည့်အောင် ယူပေးတဲ့ JavaScript ရဲ့ function လို
      library ကိုယ်တိုင် အလုပ်လုပ်လား ဆိုတာကို ပြန်စစ်စရာ မလိုသလို၊ ဆုံးဖြတ်ချက် တစ်ခုမှ မပါဘဲ တန်ဖိုးကို
      ဒီအတိုင်း ပြန်ပေးရုံ code ကိုလည်း test ရေးစရာ မလိုပါဘူး။ [[mark:draw-focus]] ကိုယ့် code ထဲက
      ထူးခြားပြီး မှားနိုင်တဲ့ နေရာကိုပဲ အာရုံစိုက်ပါ။
    sources:
      - {
          title: "web.dev Learn Testing: What to test, your approach to testing",
          url: "https://web.dev/learn/testing/get-started/what-to-test#approach",
        }
      - {
          title: "web.dev Learn Testing: Welcome, the philosophy of testing (who's responsible)",
          url: "https://web.dev/learn/testing/welcome",
        }
      - {
          title: "web.dev Learn Testing: The testing environment, test business logic",
          url: "https://web.dev/learn/testing/get-started/testing-environment#business-logic",
        }
    actions:
      - id: board-approach
        type: whiteboard.apply
        at: { mark: board-approach }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-one-goal
        type: whiteboard.apply
        at: { mark: draw-one-goal }
        upsertIds: [c-1]
        drawMs: 1600
      - id: draw-owner
        type: whiteboard.apply
        at: { mark: draw-owner }
        upsertIds: [c-2, c-2b]
        drawMs: 2200
      - id: draw-legacy
        type: whiteboard.apply
        at: { mark: draw-legacy }
        upsertIds: [c-3]
        drawMs: 1600
      - id: draw-skip
        type: whiteboard.apply
        at: { mark: draw-skip }
        upsertIds: [c-4, c-4b]
        drawMs: 2200
      - id: draw-focus
        type: whiteboard.apply
        at: { mark: draw-focus }
        upsertIds: [c-5]
        drawMs: 1500

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:close-approach]] ဒါဆို ပြန်ချုပ်ရရင်၊ testing က နည်းလမ်း ဖြစ်လို့ ပျက်ရင် ငွေနဲ့ ယုံကြည်မှု
      ဆုံးမယ့် နေရာကို အရင် test လုပ်ပါ။ function တစ်ခုကို contract အနေနဲ့ စဉ်းစားပြီး၊ စည်းကမ်း
      ပြောင်းသွားတဲ့ အစွန်းတွေကို စစ်ပါ။ [[mark:recap-opaque]] test က function ကို သုံးတဲ့ code မြင်တဲ့
      အတိုင်း ပြင်ပကနေ စစ်ရင်၊ အတွင်းပိုင်း ပြောင်းတိုင်း test ကို လိုက်ပြင်နေစရာ မလိုတော့ပါဘူး။ နောက်
      lesson မှာတော့ printer လို နှေးတဲ့၊ ဒါမှမဟုတ် အမြဲ အဆင်သင့် မဖြစ်တဲ့ dependency တွေကို test double
      နဲ့ အစားထိုးနည်း ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "web.dev Learn Testing: What to test and your approach",
