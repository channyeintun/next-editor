build:
  voiceProfile:
    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 9528

runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "u-17 payout.approve: true\nu-42 funds.move: false\nu-91 funds.move: true\n"
      run-2:
        status: success
        exitCode: 0
        output: "u-17 payout.approve: true\nu-42 funds.move: false\nu-91 funds.move: true\nfunds.move on 2026-03-03: true, last change by u-07: treasury rota\nfunds.move on 2026-04-03: false, last change by u-07: moved to support\n"
      run-3:
        status: success
        exitCode: 0
        output: "u-17 payout.approve: true\nu-42 funds.move: false\nu-91 funds.move: true\nfunds.move on 2026-03-03: true, last change by u-07: treasury rota\nfunds.move on 2026-04-03: false, last change by u-07: moved to support\nreview: u-91 treasury idle 95 days, granted for: treasury team\nreview: svc-recon treasury idle 139 days, granted for: debug payouts\n"

scenes:
  - id: hook
    chapter: Access ကလည်း system ရဲ့ state
    narration: >-
      ငွေကို ဘယ်သူ ရွှေ့ခွင့် ရှိလဲ ဆိုတာ ကိုယ်တိုင်က system ရဲ့ state တစ်ခုပါ။ လူတွေ ဝင်လာတယ်၊
      team ပြောင်းတယ်၊ ထွက်သွားတယ်၊ ဒါကြောင့် အဲဒီ state က အချိန်နဲ့အမျှ ပြောင်းနေပါတယ်။ auditor က ဒီနေ့
      ဘယ်သူ fund ကို ထိနိုင်လဲ ဆိုတာတင် မဟုတ်ဘဲ၊ အဲဒီ access ကို ဘယ်လို ရလာခဲ့လဲ ဆိုတာကိုပါ
      မေးပါတယ်။ [[mark:sel-roles]] ဒီမှာ role သုံးခုနဲ့ role တစ်ခုချင်း လုပ်ခွင့်ရှိတဲ့ permission တွေ
      ရှိပါတယ်။ fund ရွှေ့ခွင့်က treasury role မှာပဲ ပါပါတယ်။ [[mark:sel-members]] အောက်က table က
      အခု ဘယ်သူ ဘယ် role ကိုင်ထားလဲ ဆိုတာပါ၊ system တော်တော်များများက ဒါကိုပဲ သိမ်းထားပါတယ်။ လူ သုံးယောက်နဲ့
      reconciliation job ရဲ့ service account တစ်ခု ပါပါတယ်။ [[mark:open-main]] အဲဒီ table ကို
      မေးကြည့်ရအောင်။ [[mark:sel-can]] can function က user ကိုင်ထားတဲ့ role တွေထဲမှာ အဲဒီ permission
      ပါသလား ကြည့်ပါတယ်။ [[mark:run-1]] run လိုက်ရအောင်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Access control (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#access-control",
        }
    actions:
      - { id: open-access, type: workspace.openFile, at: { scene: start }, path: access.go }
      - id: sel-roles
        type: editor.select
        at: { mark: sel-roles }
        target: { file: access.go, text: "var roles = map[string][]string{", occurrence: 1 }
      - id: sel-members
        type: editor.select
        at: { mark: sel-members }
        target: { file: access.go, text: "var members = map[string][]string{", occurrence: 1 }
      - { id: open-main, type: workspace.openFile, at: { mark: open-main }, path: main.go }
      - id: sel-can
        type: editor.select
        at: { mark: sel-can }
        target: { file: main.go, text: "func can(who, perm string) bool {", occurrence: 1 }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "u-91 funds.move: true",
          timeoutMs: 8000,
        }

  - id: rbac
    chapter: Role နဲ့ least privilege
    narration: >-
      [[mark:pt-r1]] ops role ရှိတဲ့ user က payout ကို approve လုပ်နိုင်ပါတယ်။ [[mark:pt-r3]] treasury role
      ရှိတဲ့ user ကတော့ fund ရွှေ့နိုင်ပါတယ်။ [[mark:show-rbac]] permission ကို user ဆီ တိုက်ရိုက်
      မပေးဘဲ role ကနေ ဘာလို့ ပေးလဲ ဆိုတာ ကြည့်ရအောင်။ လူ တစ်ယောက်ချင်းကို permission တစ်ခုချင်း
      ပေးရင် ချိတ်ဆက်မှုတွေက လူ အရေအတွက်နဲ့ permission အရေအတွက် မြှောက်လဒ်လောက်ထိ များလာပါတယ်။
      [[mark:pt-tangle]] ဘယ်ဟာကို ဘာကြောင့် ပေးခဲ့လဲ ဆိုတာ review လုပ်ဖို့ အရမ်း ခက်လာပါတယ်။
      [[mark:rbac-2]] RBAC ဆိုတာ role based access control ပါ၊ permission တွေကို role ထဲ စုထားပြီး လူကို
      role ပေးတာပါ။ ဒါဆိုရင် review လုပ်ရမှာက role သုံးခုရဲ့ အဓိပ္ပာယ်နဲ့ role တစ်ခုချင်းမှာ ဘယ်သူ
      ပါလဲ ဆိုတာပဲ ကျန်ပါတယ်။ [[mark:rbac-3]] least privilege ဆိုတာ actor တိုင်းကို လိုတာ အနည်းဆုံးပဲ
      ပေးတာပါ၊ လူသာမက service တွေပါ ပါပါတယ်။ reconciliation job က ledger ကို ဖတ်ဖို့ပဲ လိုပေမဲ့ ဒီမှာ
      treasury role ကိုင်ထားပါတယ်၊ ဒါကို ခဏနေရင် ပြန်တွေ့ပါမယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Access control (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#access-control",
        }
    actions:
      - id: pt-r1
        type: console.point
        at: { mark: pt-r1 }
        target: { text: "u-17 payout.approve: true", occurrence: 1 }
      - id: pt-r3
        type: console.point
        at: { mark: pt-r3 }
        target: { text: "u-91 funds.move: true", occurrence: 1 }
      - {
          id: show-rbac,
          type: slide.show,
          at: { mark: show-rbac, offsetMs: -700 },
          slideId: rbac-1,
        }
      - {
          id: pt-tangle,
          type: slide.point,
          at: { mark: pt-tangle },
          target: { x: 0.556, y: 0.909 },
        }
      - { id: rbac-2, type: slide.show, at: { mark: rbac-2 }, slideId: rbac-2 }
      - {
          id: pt-r3role,
          type: slide.point,
          at: { afterAction: rbac-2 },
          target: { x: 0.5, y: 0.764 },
        }
      - { id: rbac-3, type: slide.show, at: { mark: rbac-3 }, slideId: rbac-3 }
      - {
          id: pt-least,
          type: slide.point,
          at: { afterAction: rbac-3 },
          target: { x: 0.156, y: 0.798 },
        }

  - id: history
    chapter: ဒီနေ့ မဟုတ်ဘဲ မတ်လ ၃ ရက်က
    narration: >-
      [[mark:show-history]] auditor က မတ်လ သုံးရက်နေ့မှာ ဒုတိယ user က fund ရွှေ့နိုင်ခဲ့သလား လို့ မေးတယ်
      ဆိုပါစို့။ table က ဒီနေ့ကိုပဲ သိလို့ ဒီနေ့ မရဘူး လို့ပဲ ဖြေနိုင်ပါတယ်။ အဖြေ ရဖို့ access
      ပြောင်းတာတိုင်းကို event အဖြစ် သိမ်းထားရပါမယ်။ [[mark:pt-grant]] ဇန်နဝါရီ ဆယ်ရက်နေ့မှာ treasury
      role ကို ပေးခဲ့ပြီး၊ ဘယ်သူ ပေးလဲ၊ ဘာကြောင့် ပေးလဲ ပါပါတယ်။ [[mark:history-2]] ဧပြီလ တစ်ရက်နေ့မှာ
      support team ကို ပြောင်းသွားလို့ ပြန်ရုပ်သိမ်းခဲ့ပါတယ်။ grant နဲ့ revoke ဆိုတာ ငွေ ရွှေ့တာလိုပဲ
      sensitive event ပါ။ ledger ရဲ့ audit trail စည်းကမ်းကို ဒီမှာလည်း သုံးပြီး ဘာ ပြောင်းလဲ၊ ဘယ်သူ
      ပြောင်းလဲ၊ ဘာကြောင့်လဲ ဆိုတာ မှတ်ရပါတယ်။ [[mark:history-3]] ဒါဆိုရင် ဘယ်နေ့မှာ ဘယ်သူ
      လုပ်နိုင်ခဲ့လဲ ဆိုတာ log ကို အဲဒီနေ့အထိ replay လုပ်ရုံပါပဲ။ [[mark:close-history]] code ထဲ
      ထည့်ကြည့်ရအောင်။ [[mark:type-canat]] အသစ် ထည့်တဲ့ function က change log ကို အစကနေ မေးတဲ့နေ့အထိ
      ဖတ်ပြီး၊ ဒီ permission ကို ပေးတဲ့ role အတွက် နောက်ဆုံး change က grant လား revoke လား ကြည့်ပါတယ်။
      အဲဒီ change ကိုပါ ပြန်ပေးလို့ ဘယ်သူ ဘာကြောင့် လုပ်ခဲ့လဲ ဆိုတာပါ သိရပါတယ်။ [[mark:type-days]]
      main ထဲမှာ ဒုတိယ user အတွက် မတ်လ သုံးရက်နဲ့ ဧပြီလ သုံးရက်ကို မေးပါမယ်။ မတ်လအတွက် ဘာ ပြန်ရမလဲ
      ခန့်မှန်းကြည့်ပါ။ [[mark:run-2]] run လိုက်ရအောင်။ [[mark:pt-mar]] မတ်လ သုံးရက်မှာ true ပါ၊
      ပေးခဲ့တဲ့သူနဲ့ treasury rota ဆိုတဲ့ အကြောင်းပြချက်ပါ ပါလာပါတယ်။ [[mark:pt-apr]] ဧပြီလ သုံးရက်မှာတော့
      false ဖြစ်ပြီး ရုပ်သိမ်းခဲ့တဲ့ change ကို ပြပါတယ်။ [[mark:dock-2]] ဒီနေ့ table က မရဘူး လို့ ပြောပေမဲ့
      မတ်လမှာ ဒီ user က fund ရွှေ့နိုင်ခဲ့ပါတယ်၊ table တစ်ခုတည်းဆိုရင် ဒီအဖြေ ပျောက်သွားပါတယ်။
      လက်တွေ့မှာတော့ table ကို log ကနေ ဆင့်ထုတ်ထားတဲ့ projection အဖြစ် ထားနိုင်ပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Access control (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#access-control",
        }
      - {
          title: "Fintech Engineering Handbook — Audits and audit trails (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#audits-and-audit-trails",
        }
    actions:
      - {
          id: show-history,
          type: slide.show,
          at: { mark: show-history, offsetMs: -700 },
          slideId: history-1,
        }
      - { id: pt-grant, type: slide.point, at: { mark: pt-grant }, target: { x: 0.128, y: 0.355 } }
      - { id: history-2, type: slide.show, at: { mark: history-2 }, slideId: history-2 }
      - {
          id: pt-revoke,
          type: slide.point,
          at: { afterAction: history-2 },
          target: { x: 0.128, y: 0.398 },
        }
      - { id: history-3, type: slide.show, at: { mark: history-3 }, slideId: history-3 }
      - {
          id: pt-q,
          type: slide.point,
          at: { afterAction: history-3 },
          target: { x: 0.29, y: 0.931 },
        }
      - { id: close-history, type: slide.close, at: { mark: close-history } }
      - id: type-canat
        type: editor.type
        at: { mark: type-canat }
        target: { file: main.go, after: "\treturn false\n}\n", occurrence: 1 }
        text: "\nfunc canAt(who, perm, day string) (last Change, ok bool) {\n\tfor _, c := range changes {\n\t\tif c.Who == who && c.Day <= day && gives(c.Role, perm) {\n\t\t\tlast, ok = c, c.Grant\n\t\t}\n\t}\n\treturn last, ok\n}\n"
        cadence: line-by-line
      - id: type-days
        type: editor.type
        at: { mark: type-days }
        target:
          {
            file: main.go,
            after: "\tfmt.Println(\"u-91 funds.move:\", can(\"u-91\", \"funds.move\"))\n",
            occurrence: 1,
          }
        text: "\n\tfor _, day := range []string{\"2026-03-03\", \"2026-04-03\"} {\n\t\tc, ok := canAt(\"u-42\", \"funds.move\", day)\n\t\tfmt.Printf(\"funds.move on %s: %v, last change by %s: %s\\n\", day, ok, c.By, c.Why)\n\t}\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "funds.move on 2026-03-03: true",
          timeoutMs: 8000,
        }
      - {
          id: expect-file-canat,
          type: expect.file,
          at: { afterAction: expect-2 },
          path: main.go,
          contains: "if c.Who == who && c.Day <= day && gives(c.Role, perm) {",
        }
      - id: pt-mar
        type: console.point
        at: { mark: pt-mar }
        target: { text: "funds.move on 2026-03-03", occurrence: 1 }
      - id: pt-apr
        type: console.point
        at: { mark: pt-apr }
        target: { text: "funds.move on 2026-04-03", occurrence: 1 }
      - { id: dock-2, type: runtime.collapseDock, at: { mark: dock-2 } }

  - id: grants
    chapter: Grant ကိုယ်တိုင်က sensitive
    narration: >-
      [[mark:open-access2]] log ကို ပြန်ကြည့်ရင် စိတ်ဝင်စားစရာ နှစ်ခု တွေ့ရပါတယ်။ [[mark:sel-svc]]
      reconciliation service account ကို ဒီဇင်ဘာမှာ payout ကို debug လုပ်ဖို့ ဆိုပြီး treasury role
      ပေးခဲ့ပါတယ်။ ယာယီ လိုလို့ ပေးခဲ့ပေမဲ့ ပြန်ရုပ်သိမ်းဖို့ ဘယ်သူမှ မမှတ်ထားလို့ အမြဲတမ်း access
      ဖြစ်သွားတာပါ။ ဒါကြောင့် temporary grant မှာ expiry ပါပြီး system က အလိုလို ရုပ်သိမ်းတာ ပိုစိတ်ချရပါတယ်။
      [[mark:sel-by]] ဒုတိယက grant တိုင်းကို admin တစ်ယောက်တည်းက ပေးထားတာပါ။ treasury role
      ပေးတာဟာ ငွေ ရွှေ့ခွင့် ပေးတာ ဖြစ်လို့ ခုနက lesson ကလို four-eyes လိုပါတယ်။ access ပေးနိုင်တဲ့
      permission က system ထဲမှာ အင်အား အကြီးဆုံး permission ပါ၊ ကိုယ့်ကိုယ်ကိုယ် ပေးလို့ရရင် တခြား
      control တွေ အားလုံး အဓိပ္ပာယ် မရှိတော့ပါဘူး။ role ရဲ့ permission စာရင်း ပြောင်းတာကလည်း role ထဲက
      လူတိုင်းရဲ့ access ကို တစ်ပြိုင်နက် ပြောင်းလို့ အဲဒါလည်း event တစ်ခုပါပဲ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Access control (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#access-control",
        }
      - {
          title: "Fintech Engineering Handbook — Segregation of duties and four-eyes (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#segregation-of-duties-and-four-eyes",
        }
    actions:
      - { id: open-access2, type: workspace.openFile, at: { mark: open-access2 }, path: access.go }
      - id: sel-svc
        type: editor.select
        at: { mark: sel-svc }
        target:
          {
            file: access.go,
            text: '{"2025-12-01", "svc-recon", "treasury", true, "u-07", "debug payouts"},',
            occurrence: 1,
          }
      - id: sel-by
        type: editor.select
        at: { mark: sel-by }
        target: { file: access.go, text: '"u-07"', occurrence: 2 }

  - id: review
    chapter: Access review
    narration: >-
      [[mark:show-review]] access ဟာ အချိန်ကြာလာရင် ဟောင်းလာတတ်ပါတယ်။ ဒါကြောင့် access review ကို
      schedule နဲ့ လုပ်ပါတယ်၊ recertification လို့လည်း ခေါ်ပါတယ်။ role owner က role ထဲက လူတိုင်းကို
      ဆက်လိုသေးလား အတည်ပြုတာပါ။ ledger မှာ invariant ကို နောက်မှ ပြန်စစ်သလိုပဲ access ကို နောက်မှ
      ပြန်စစ်တာပါ။ [[mark:pt-u91]] treasury team ထဲက user က ကိုးဆယ့်ငါးရက်ကြာ fund မရွှေ့ခဲ့ပါဘူး၊
      role owner ကို ဆက်လိုသေးလား မေးရပါမယ်။ [[mark:pt-svcrow]] service account ကတော့ debug
      အတွက် ယူခဲ့တဲ့ access ကို ငါးလနီးပါး ကိုင်ထားပါတယ်၊ ဖတ်ခွင့်ပဲ လိုလို့ ရုပ်သိမ်းရပါမယ်။
      [[mark:review-2]] access က တိတ်တိတ်လေး စုလာတတ်ပါတယ်၊ least privilege နဲ့ periodic review က
      access ဘက်မှာ No trust ကို ထိန်းတဲ့ နည်းပါ။ [[mark:close-review]] review ကို code နဲ့ ရေးကြည့်ရအောင်။ [[mark:open-main3]] subject တိုင်းအတွက် ဒီနေ့ fund ရွှေ့ခွင့် ရှိသလား ဆိုတာကို table ကနေ မဟုတ်ဘဲ log ကနေ စစ်ပါမယ်။ [[mark:type-review]] ရက် ကိုးဆယ်ထက် ပိုကြာအောင် မသုံးခဲ့ရင် ပေးခဲ့တဲ့ အကြောင်းပြချက်နဲ့ တကွ ထုတ်ပြပါတယ်။ service account တွေကလည်း လူတွေနဲ့ စာရင်းတစ်ခုတည်းမှာ ပါပါတယ်။
      [[mark:run-3]] run လိုက်ရအောင်။ [[mark:pt-rv1]] treasury team ထဲက user ကို ဆက်လိုသေးလား
      မေးဖို့ ပေါ်လာပါတယ်။ [[mark:pt-rv2]] service account ကလည်း debug အကြောင်းပြချက်နဲ့ အတူ
      ပေါ်လာပါတယ်။ [[mark:dock-3]] reviewer ကို ဘာပြလဲ ဆိုတာ အရေးကြီးပါတယ်။ နာမည်စာရင်း တစ်ခုပဲ
      ပြရင် reviewer က အကုန် approve လုပ်လိုက်တာပဲ ဖြစ်တတ်ပါတယ်၊ နောက်ဆုံး သုံးခဲ့တဲ့ နေ့နဲ့ ပေးခဲ့တဲ့
      အကြောင်းပြချက်ကို ပြမှ တကယ် ဆုံးဖြတ်နိုင်ပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Access control (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#access-control",
        }
      - {
          title: "Fintech Engineering Handbook — Invariants (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#invariants",
        }
    actions:
      - {
          id: show-review,
          type: slide.show,
          at: { mark: show-review, offsetMs: -700 },
          slideId: review-1,
        }
      - { id: pt-u91, type: slide.point, at: { mark: pt-u91 }, target: { x: 0.138, y: 0.496 } }
      - {
          id: pt-svcrow,
          type: slide.point,
          at: { mark: pt-svcrow },
          target: { x: 0.138, y: 0.618 },
        }
      - { id: review-2, type: slide.show, at: { mark: review-2 }, slideId: review-2 }
      - {
          id: pt-who,
          type: slide.point,
          at: { afterAction: review-2 },
          target: { x: 0.365, y: 0.802 },
        }
      - { id: close-review, type: slide.close, at: { mark: close-review } }
      - { id: open-main3, type: workspace.openFile, at: { mark: open-main3 }, path: main.go }
      - id: type-review
        type: editor.type
        at: { mark: type-review }
        target: { file: main.go, after: "c.By, c.Why)\n\t}\n", occurrence: 1 }
        text: "\n\tfor _, s := range subjects {\n\t\tif c, ok := canAt(s, \"funds.move\", today); ok && idle(s) > 90 {\n\t\t\tfmt.Println(\"review:\", s, c.Role, \"idle\", idle(s), \"days, granted for:\", c.Why)\n\t\t}\n\t}\n"
        cadence: line-by-line
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "review: svc-recon treasury idle 139 days",
          timeoutMs: 8000,
        }
      - id: pt-rv1
        type: console.point
        at: { mark: pt-rv1 }
        target: { text: "review: u-91", occurrence: 1 }
      - id: pt-rv2
        type: console.point
        at: { mark: pt-rv2 }
        target: { text: "review: svc-recon", occurrence: 1 }
      - { id: dock-3, type: runtime.collapseDock, at: { mark: dock-3 } }

  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] Fintech interview တွေမှာ မတ်လ သုံးရက်နေ့က ဘယ်သူတွေ fund ရွှေ့နိုင်ခဲ့လဲ ဆိုတာ
      ဘယ်လို ဖြေမလဲ လို့ မေးတတ်ပါတယ်။ user role table ကို query လုပ်မယ် လို့ ဖြေရင် ဒီနေ့ရဲ့ အဖြေပဲ
      ရပါမယ်။ [[mark:iv-a]] ပထမ၊ access ကို လက်ရှိ state အဖြစ်ပဲ မသိမ်းဘဲ event log နဲ့ သိမ်းပါတယ်၊
      grant နဲ့ revoke တိုင်းမှာ ဘယ်သူ့ကို၊ ဘယ်သူက၊ ဘာကြောင့်၊ ဘယ်တော့ ဆိုတာ ပါပါတယ်။ [[mark:iv-b]]
      ဒုတိယ၊ log ကို အဲဒီနေ့အထိ replay လုပ်ပြီး role ကနေ permission ကို ဆင့်တွက်ပါတယ်၊ role ရဲ့
      permission ပြောင်းတာကိုလည်း event အဖြစ် ထည့်တွက်ပါတယ်။ [[mark:iv-c]] တတိယ၊ ဘယ်လို ရလာလဲ
      ဆိုတာပါ ပြပါ၊ grant ကို ဘယ်သူ approve လုပ်ခဲ့လဲ ဆိုတာနဲ့၊ service account တွေပါ စာရင်းထဲ ပါတာကို
      ပြောပါ။ [[mark:iv-d]] ပြီးရင် ဒီမေးခွန်း မပေါ်ခင် ကိုယ် ဘာလုပ်ထားမလဲ ဆက်ပြောပါ။ least
      privilege၊ RBAC၊ schedule နဲ့ recertification၊ temporary grant တွေ အလိုလို expire ဖြစ်တာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Access control (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#access-control",
        }
    actions:
      - { id: show-iv, type: slide.show, at: { mark: show-iv, offsetMs: -700 }, slideId: iv-1 }
      - {
          id: pt-iv-q,
          type: slide.point,
          at: { afterAction: show-iv },
          target: { x: 0.125, y: 0.184 },
        }
      - { id: iv-a, type: slide.show, at: { mark: iv-a }, slideId: iv-2 }
      - {
          id: pt-iv-a,
          type: slide.point,
          at: { afterAction: iv-a },
          target: { x: 0.138, y: 0.359 },
        }
      - { id: iv-b, type: slide.show, at: { mark: iv-b }, slideId: iv-3 }
      - {
          id: pt-iv-b,
          type: slide.point,
          at: { afterAction: iv-b },
          target: { x: 0.138, y: 0.506 },
        }
      - { id: iv-c, type: slide.show, at: { mark: iv-c }, slideId: iv-4 }
      - {
          id: pt-iv-c,
          type: slide.point,
          at: { afterAction: iv-c },
          target: { x: 0.138, y: 0.652 },
        }
      - { id: iv-d, type: slide.show, at: { mark: iv-d }, slideId: iv-5 }
      - {
          id: pt-iv-d,
          type: slide.point,
          at: { afterAction: iv-d },
          target: { x: 0.138, y: 0.799 },
        }

  - id: try-it
    chapter: ကိုယ်တိုင် စမ်းကြည့်ပါ
    narration: >-
      [[mark:close-iv]] ကိုယ်တိုင် စမ်းကြည့်ဖို့ တစ်ခု ရှိပါတယ်။ [[mark:open-access3]] change log ရဲ့
      နောက်ဆုံးမှာ၊ [[mark:sel-try]] service account ရဲ့ treasury role ကို ဒီနေ့ ရက်စွဲနဲ့ revoke လုပ်တဲ့
      row တစ်ခု ထည့်ပါ။ ပြီးရင် main ထဲက ဒုတိယ user ကို service account နဲ့ ပြောင်းပြီး run ကြည့်ပါ။ review
      စာရင်းထဲက service account ပျောက်သွားပေမဲ့၊ မတ်လ သုံးရက်နဲ့ ဧပြီလ သုံးရက်မှာတော့ fund
      ရွှေ့နိုင်ခဲ့တယ် လို့ပဲ ဆက်ပြပါလိမ့်မယ်။ ဒီနေ့ revoke လုပ်တာက အတိတ်ကို ပြန်ပြင်တာ မဟုတ်ပါဘူး။
      [[mark:recap]] ပြန်ချုပ်ရရင်၊ ဘယ်သူ ဘာလုပ်ခွင့် ရှိလဲ ဆိုတာကို role နဲ့ အနည်းဆုံးပဲ ပေး၊ ပြောင်းတာ
      တိုင်းကို event အဖြစ် သိမ်းပြီး၊ ဟောင်းသွားတဲ့ access ကို schedule နဲ့ ပြန်စစ်ရပါတယ်။ နောက် lesson
      မှာတော့ code တစ်ကြောင်း production ကို ဘယ်လို ရောက်လာလဲ ဆိုတာကို auditor ကို ဘယ်လို
      သက်သေပြမလဲ ဆက်ကြည့်ပါမယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Access control (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#access-control",
        }
    actions:
      - { id: close-iv, type: slide.close, at: { mark: close-iv } }
      - { id: open-access3, type: workspace.openFile, at: { mark: open-access3 }, path: access.go }
      - id: sel-try
        type: editor.select
        at: { mark: sel-try }
        target:
          {
            file: access.go,
            text: '{"2026-04-01", "u-42", "support", true, "u-07", "moved to support"},',
            occurrence: 1,
          }

checks:
  - { type: timing.p95Ms, max: 300 }
