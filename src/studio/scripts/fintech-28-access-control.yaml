# Fintech Engineering, lesson 28: access control (Burmese).
#
# Source: Fintech Engineering Handbook, "Access control" (CC BY 4.0, Voytek Pitula).
# Start state: access.go holds roles → permissions (RBAC), the current role table, an append-only
# change log of grants and revokes (who, by whom, why), the subjects and when each last used
# funds.move; main.go answers can(who, perm) from the current table only.
# Edits, all insert-only:
#   1. canAt: replay the change log up to a day                } run-2: u-42 could move funds
#   2. main asks for u-42 on 2026-03-03 and on 2026-04-03      }   on 3 March, not on 3 April
#   3. the access review: funds.move holders idle over 90 days -> run-3: u-91 and svc-recon
# Runs: run-1, run-2, run-3.
# Figures: rbac (per-person grants vs roles; least privilege), history (grant and revoke on a
# timeline, "who could on this day?"), review (stale access found), iv (the interview answer).
# Facts: none (the handbook and the program's output only).
# Built by ~/Documents/fintech-course-work/tools/build-lesson.ts; fixtures by sim-go.ts --write.
schemaVersion: 1

lesson:
  slug: fintech-28-access-control
  title: "Fintech Engineering 28: Access control"
  locale: my-MM
  workspace:
    lessonType: go
    name: Fintech Engineering
    entryFilePath: main.go
    files:
      access.go: |
        package main

        import (
        	"slices"
        	"time"
        )

        const today = "2026-04-20"

        // roles says what each role may do. People and services get roles, never single permissions.
        var roles = map[string][]string{
        	"support":  {"ledger.read"},
        	"ops":      {"ledger.read", "payout.approve"},
        	"treasury": {"ledger.read", "funds.move"},
        }

        // members is the current role table: what many systems store, and all it can answer.
        var members = map[string][]string{
        	"u-17": {"ops"}, "u-42": {"support"}, "u-91": {"treasury"}, "svc-recon": {"treasury"},
        }

        // Change is one grant or revoke: an append-only event that says who made it and why.
        type Change struct {
        	Day, Who, Role string
        	Grant          bool
        	By, Why        string
        }

        var changes = []Change{
        	{"2025-12-01", "svc-recon", "treasury", true, "u-07", "debug payouts"},
        	{"2026-01-10", "u-42", "treasury", true, "u-07", "treasury rota"},
        	{"2026-01-15", "u-91", "treasury", true, "u-07", "treasury team"},
        	{"2026-02-02", "u-17", "ops", true, "u-07", "ops on-call"},
        	{"2026-04-01", "u-42", "treasury", false, "u-07", "moved to support"},
        	{"2026-04-01", "u-42", "support", true, "u-07", "moved to support"},
        }

        // subjects are every actor the review looks at, people and services alike.
        var subjects = []string{"u-17", "u-42", "u-91", "svc-recon"}

        // lastUsed is the last day each subject used funds.move.
        var lastUsed = map[string]string{"u-42": "2026-03-28", "u-91": "2026-01-15", "svc-recon": "2025-12-02"}

        func gives(role, perm string) bool { return slices.Contains(roles[role], perm) }

        // idle counts the days from s's last use of funds.move to today.
        func idle(s string) int {
        	from, _ := time.Parse(time.DateOnly, lastUsed[s])
        	to, _ := time.Parse(time.DateOnly, today)
        	return int(to.Sub(from).Hours() / 24)
        }
      main.go: |
        package main

        import "fmt"

        // can answers from the current table only: does who hold a role that gives perm today?
        func can(who, perm string) bool {
        	for _, role := range members[who] {
        		if gives(role, perm) {
        			return true
        		}
        	}
        	return false
        }

        func main() {
        	fmt.Println("u-17 payout.approve:", can("u-17", "payout.approve"))
        	fmt.Println("u-42 funds.move:", can("u-42", "funds.move"))
        	fmt.Println("u-91 funds.move:", can("u-91", "funds.move"))
        }
