# Fintech Engineering, lesson 20: idempotency keys (Burmese).
#
# Source: Fintech Engineering Handbook, "Idempotency" (intro, explicit keys, at scale)
# (CC BY 4.0, Voytek Pitula).
# Start state: Pay (main.go) saves each response under a scoped key but never looks it up; main
# sends one payment and retries it after a lost response. api.go holds the Server and charge;
# ledger.go is the course ledger.
# Edits, all insert-only:
#   1. the lookup before charging              -> run-2: the retry gets tx-1 back, 75.00 left
#   2. a second payment whose copy arrives while the first waits for the provider
#                                              -> run-3: both pass, 25.00 left (charged twice)
#   3. claim the key (409 in progress) before charging -> run-4: the copy gets 409, 50.00 left
# Figures: unknown (three worlds behind one timeout), key (the retry answered from the store),
# barrier (check-then-save vs claim-first), stripe (Idempotency-Key), iv (the interview answer).
# Built by ~/Documents/fintech-course-work/tools/build-lesson.ts; fixtures by sim-go.ts --write.
