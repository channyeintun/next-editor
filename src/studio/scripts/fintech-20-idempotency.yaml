  voiceProfile:
    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 9520

runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "first: 201 tx-1   retry: 201 tx-2\nuser 1042: 50.00\n"
      run-2:
        status: success
        exitCode: 0
        output: "first: 201 tx-1   retry: 201 tx-1\nuser 1042: 75.00\n"
      run-3:
        status: success
        exitCode: 0
        output: "first: 201 tx-1   retry: 201 tx-1\nuser 1042: 75.00\ncopy in flight: 201 tx-2\noriginal: 201 tx-3\nuser 1042: 25.00\n"
      run-4:
        status: success
