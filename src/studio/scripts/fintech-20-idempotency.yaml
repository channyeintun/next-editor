  - id: claim
    narration: >-
      [[mark:close-barrier]] Code မှာ ပြင်ရတာ line တစ်ကြောင်းပါ။ ဒီ program က thread တစ်ခုတည်းနဲ့ run လို့
      map ကို စစ်တာနဲ့ ရေးတာကြားမှာ ဘာမှ ဝင်လို့ မရပါဘူး၊ database မှာဆိုရင် ခုနက INSERT ပါ။ [[mark:type-claim]] ငွေ မဖြတ်ခင် key
      ကို in progress ဆိုတဲ့ conflict response နဲ့ အရင် ရေးထားပါမယ်။ ငွေ ဖြတ်ပြီးတဲ့အခါ အောက်က line က
      အဲဒါကို တကယ့် response နဲ့ အစားထိုးပါတယ်။ ဒီ ကြားထဲ ရောက်လာတဲ့ copy က အဲဒီ conflict ကို တွေ့ပါမယ်။
      [[mark:run-4]] run လိုက်ရအောင်။ [[mark:pt-409]] copy က conflict နဲ့ ငြင်းခံရပါတယ်။ client က ခဏနေမှ
      ပြန် retry လုပ်ရင် ပြီးသွားတဲ့ response ကို ရပါလိမ့်မယ်။ [[mark:pt-b4]] payment နှစ်ခုအတွက် ယူရို ၅၀
      ပဲ ထွက်ပါတယ်။ [[mark:dock-4]] ဒါက No invented data ဆိုတဲ့ မူပါ၊ ငွေကို မရှိဘဲ မဖန်တီးရဘူး။ retry ကို
      ရှောင်လို့ မရတော့ ထပ်ရောက်လာတဲ့ copy တွေကို effect တစ်ခုတည်း ဖြစ်အောင် ပေါင်းပေးရပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Idempotency (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#idempotency",
        }
      - {
          title: "Fintech Engineering Handbook — Principles (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#principles",
        }
    actions:
      - { id: close-barrier, type: slide.close, at: { mark: close-barrier } }
      - id: type-claim
        type: editor.type
        at: { mark: type-claim }
        target: { file: main.go, after: "\t\treturn saved\n\t}\n", occurrence: 1 }
        text: "\ts.keys[k] = Response{409, \"in progress\"}\n"
        cadence: line-by-line
      - { id: run-4, type: runtime.run, at: { mark: run-4, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-4,
          type: expect.output,
          at: { afterAction: run-4 },
          contains: "copy in flight: 409 in progress",
          timeoutMs: 8000,
        }
      - id: pt-409
        type: console.point
        at: { mark: pt-409 }
        target: { text: "copy in flight: 409 in progress", occurrence: 1 }
      - id: pt-b4
        type: console.point
        at: { mark: pt-b4 }
        target: { text: "user 1042: 50.00", occurrence: 1 }
      - { id: dock-4, type: runtime.collapseDock, at: { mark: dock-4 } }
      - {
          id: expect-file-claim,
          type: expect.file,
          at: { afterAction: run-4 },
          path: main.go,
          contains: 's.keys[k] = Response{409, "in progress"}',
        }

  - id: stripe
    chapter: Stripe ရဲ့ Idempotency-Key
    narration: >-
      [[mark:show-stripe]] payment API တွေ ဒီ pattern ကို ဘယ်လို ပေးလဲ ဆိုတာ Stripe မှာ ကြည့်လို့ ရပါတယ်။
      [[mark:pt-hdr]] client က Idempotency-Key header နဲ့ key ကို ပို့ပြီး၊ key က စာလုံး ၂၅၅ လုံးအထိ
      ရှည်လို့ ရပါတယ်။ [[mark:stripe-2]] Stripe ရဲ့ API version တစ် မှာ endpoint စ run ပြီးတာနဲ့ ပထမ request ရဲ့
      status code နဲ့ body ကို သိမ်းထားပါတယ်။ [[mark:pt-replay]] key တူတဲ့ retry တွေကို အလုပ် ထပ်မလုပ်ဘဲ
      အဲဒီ response ကိုပဲ ပြန်ပေးပါတယ်။ [[mark:stripe-3]] request တစ်ခု run နေတုန်း key တူတဲ့
      နောက်တစ်ခု ရောက်လာရင်တော့ အဲဒီ copy အတွက် ဘာမှ မသိမ်းလို့ client က ပြန် retry လုပ်လို့ ရပါတယ်။
      ခုနက code မှာလည်း copy ကို အဲဒီလိုပဲ ခဏနေမှ ပြန်လာခိုင်းပါတယ်။ [[mark:pt-next]] ခက်တာက scale ပါ။ key သန်းထောင်ချီကို ဘယ်လောက်ကြာ
      သိမ်းမလဲ ဆိုတာက ဒီ design ရဲ့ အဓိက trade-off တစ်ခု ဖြစ်ပါတယ်။
