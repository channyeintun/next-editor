  - id: naive
    chapter: Key ကို သိမ်းရုံနဲ့ မလုံလောက်ဘူး
    narration: >-
      [[mark:close-unknown]] Code နဲ့ ကြည့်ရအောင်။ [[mark:sel-save]] ဒါက payment endpoint ပါ။ client
      ပို့လိုက်တဲ့ key ကို လက်ခံပြီး၊ ငွေဖြတ်ပြီးတဲ့ response ကို အဲဒီ key အောက်မှာ သိမ်းထားပါတယ်။ ဒါပေမဲ့
      ငွေ မဖြတ်ခင် အဲဒီ key ကို တစ်ခါမှ ပြန်မကြည့်ပါဘူး။ [[mark:sel-calls]] အောက်မှာ user ၁၀၄၂ က ယူရို ၂၅
      payment တစ်ခု ပို့ပါတယ်။ ပထမ response က လမ်းမှာ ပျောက်သွားလို့ client က timeout ဖြစ်ပြီး request
      အတူတူကို key အတူတူနဲ့ ပြန်ပို့ပါတယ်။ user မှာ အစက ယူရို ၁၀၀ ရှိပါတယ်။ [[mark:run-1]] run
      လိုက်ရအောင်။ [[mark:pt-r1]] ဒုတိယ response မှာ transaction အသစ် ပါလာပါတယ်။ [[mark:pt-b1]] ယူရို ၇၅
      ကျန်ရမှာ ၅၀ ပဲ ကျန်ပါတော့တယ်၊ payment တစ်ခုကို နှစ်ခါ ဖြတ်လိုက်တာပါ။ [[mark:dock-1]] key ကို
      လက်ခံပြီး သိမ်းထားရုံနဲ့ ဘာမှ မကာကွယ်ပါဘူး။ အလုပ် မလုပ်ခင် စစ်မှသာ barrier ဖြစ်ပါတယ်။
    sources:
