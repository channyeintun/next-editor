  - id: key
    chapter: Idempotency key
    narration: >-
      [[mark:show-key]] payment API တစ်ခု idempotent ဖြစ်တယ် ဆိုတာ message တစ်ခု နှစ်ခါ ရောက်လာရင်လည်း
      ငွေက တစ်ခါပဲ ရွေ့တာကို ပြောတာပါ။ ဒီအတွက် သုံးတာက idempotency key ပါ။
      [[mark:pt-req]] client က payment တစ်ခုစီအတွက် key တစ်ခု ထုတ်ပြီး request နဲ့အတူ ပို့ပါတယ်။
      [[mark:pt-save]] server က ငွေ ဖြတ်ပြီးတာနဲ့ ရလာတဲ့ response ကို အဲဒီ key နဲ့ တွဲပြီး သိမ်းပါတယ်။
      [[mark:key-2]] response လမ်းမှာ ပျောက်သွားလို့ client က timeout ဖြစ်ပါတယ်။ [[mark:key-3]] retry
      ရောက်လာတဲ့အခါ server က key ကို အရင် ရှာပြီး၊ တွေ့ရင် ledger ကို မထိဘဲ သိမ်းထားတဲ့ response ကိုပဲ
      ပြန်ပို့ပါတယ်။ [[mark:pt-same]] client အတွက်တော့ ပထမ response ကို နောက်ကျပြီး ရလိုက်တာနဲ့
      အတူတူပါပဲ။ [[mark:why-key]] duplicate ကို payload ကနေ ခွဲလို့ မရဘူးလား လို့ မေးစရာ ရှိပါတယ်။ user
      တစ်ယောက်က တစ်မိနစ်အတွင်း merchant တစ်ခုတည်းကို ယူရို ၂၅ နှစ်ခါ ပေးတာ retry လား၊ တကယ့် payment နှစ်ခုလား
      ဆိုတာ data တစ်ခုတည်းကနေ ခွဲဖို့ ခက်ပါတယ်။ အဖြေကို သိတာက client ဖြစ်လို့ client က ပေးတဲ့ key က
      များသောအားဖြင့် ပိုရိုးရှင်းပြီး ပိုစိတ်ချရပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Idempotency (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#idempotency",
        }
    actions:
      - { id: show-key, type: slide.show, at: { mark: show-key, offsetMs: -700 }, slideId: key-1 }
      - {
          id: pt-key-t,
          type: slide.point,
          at: { afterAction: show-key },
          target: { x: 0.125, y: 0.184 },
        }
      - { id: pt-req, type: slide.point, at: { mark: pt-req }, target: { x: 0.235, y: 0.411 } }
      - { id: pt-save, type: slide.point, at: { mark: pt-save }, target: { x: 0.475, y: 0.578 } }
      - { id: key-2, type: slide.show, at: { mark: key-2 }, slideId: key-2 }
      - {
