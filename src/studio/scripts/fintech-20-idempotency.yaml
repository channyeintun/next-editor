scenes:
  - id: hook
    chapter: Timeout ဖြစ်ရင် ဘာဖြစ်ခဲ့လဲ
    narration: >-
      ငွေဖြတ်ခိုင်းတဲ့ request တစ်ခု timeout ဖြစ်သွားရင် client ဘက်က သိတာ တစ်ခုပဲ ရှိပါတယ်၊
      response မရောက်လာဘူး ဆိုတာပါ။ [[mark:show-unknown]] အဲဒီ timeout နောက်ကွယ်မှာ ဖြစ်နိုင်တာ
      သုံးမျိုး ရှိပါတယ်။ [[mark:pt-u1]] request က server ကို မရောက်ခဲ့ရင် ငွေ မဖြတ်ရသေးပါဘူး။
      [[mark:unknown-2]] server က ငွေ ဖြတ်ပြီးသွားပြီး၊ response ပဲ ပြန်လာတဲ့ လမ်းမှာ ပျောက်သွားတာ
      ဖြစ်နိုင်ပါတယ်။ [[mark:unknown-3]] ဒါမှမဟုတ် server က provider ရဲ့ အဖြေကို စောင့်နေတုန်း ဖြစ်ပြီး
      ခဏနေရင် ဖြတ်ပါလိမ့်မယ်။ [[mark:unknown-4]] client ဘက်ကနေ ကြည့်ရင် ဒီ သုံးမျိုးက ခွဲလို့ မရပါဘူး။
      Two Generals problem အတိုင်းပါပဲ၊ ယုံလို့ မရတဲ့ channel ပေါ်မှာ message ဘယ်နှစ်ခါ ပို့ပို့ နှစ်ဖက်လုံး
      သေချာသွားအောင် လုပ်လို့ မရပါဘူး။ [[mark:pt-tg]] ဒါကြောင့် exactly-once delivery ကို ဘယ်သူမှ အာမခံလို့ မရပါဘူး။
      payment တစ်ခု မပျောက်စေချင်ရင် client က retry လုပ်ရပါမယ်၊ ဆိုလိုတာက message တစ်ခုက အနည်းဆုံး တစ်ခါ ရောက်ပြီး
      တစ်ခါတလေ နှစ်ခါ ရောက်ပါမယ်။ ထပ်ရောက်လာတဲ့ copy ကို အန္တရာယ်မရှိအောင် လုပ်ရမှာက လက်ခံတဲ့ server
      ရဲ့ တာဝန်ပါ။
    sources:
