  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] Fintech interview တွေမှာ payment API မှာ double charge မဖြစ်အောင် ဘယ်လို လုပ်မလဲ
      ဆိုတာ မေးလေ့ရှိပါတယ်။ idempotency key သုံးမယ် လို့ပဲ ဖြေရင် မလုံလောက်ပါဘူး။ အချက် သုံးချက်နဲ့
      ဖြေပါ။ [[mark:iv-a]] ပထမ၊ timeout ဆိုတာ fail ဖြစ်တာ မဟုတ်ဘဲ ရလဒ် မသိရတာပါ၊ ဘာဖြစ်ခဲ့လဲ မသိနိုင်လို့ client က retry
      လုပ်ရပြီး server က duplicate ကို တစ်ခုတည်းအဖြစ် ပေါင်းရမယ်။ [[mark:iv-b]] ဒုတိယ၊ key ကို client က
      operation တစ်ခုစီအတွက် ပေးပြီး client နဲ့ operation အလိုက် scope လုပ်မယ်၊ payload ကနေ duplicate ကို
      ခန့်မှန်းတာ မလုပ်ဘူး။ [[mark:iv-c]] တတိယ၊ key ကို အလုပ် မစခင် unique constraint နဲ့ atomic ဖြစ်အောင်
      claim လုပ်မယ်၊ in progress ဆိုရင် conflict ပြန်ပြီး ပြီးရင် response ကို သိမ်းထားမယ်။ [[mark:iv-d]]
      ပြီးရင် ကိုယ် ဘယ်လို တည်ဆောက်မလဲ ပြောပါ။ header နဲ့ key ယူပြီး key table မှာ in progress ကနေ done
      ကို ရွှေ့မယ်၊ ပြီးတော့ error replay၊ payload မတူတာ၊ key သက်တမ်း ဆိုတဲ့ ဆုံးဖြတ်ချက် သုံးခုကိုလည်း
      ဆက်ပြောပါ။
    sources:
