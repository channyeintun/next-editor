      api.go: |
        package main

        import "fmt"

        // Request is one call to POST /payments. The client picks Key once per payment.
        type Request struct {
        	Client string
        	Key    string
        	From   string
        	To     string
        	Amount int64
        }

        // Response is what the server sends back: an HTTP status and a body.
        type Response struct {
        	Status int
        	Body   string
        }

        func (r Response) String() string { return fmt.Sprintf("%d %s", r.Status, r.Body) }

        // Server is the payment API: a ledger, and the responses it saved per idempotency key.
        type Server struct {
        	ledger Ledger
        	keys   map[string]Response
        	txs    int
        	// atProvider runs once while a payment waits for the card network.
        	atProvider func()
        }

        func newServer() *Server {
        	s := &Server{keys: map[string]Response{}}
        	s.ledger.Post(Tx{ID: "deposit", Lines: []Line{
        		{Account: "asset:bank", Debit: 10000},
        		{Account: "liability:user:1042", Credit: 10000},
        	}})
        	return s
        }

        // charge does the work: it waits for the card network, then moves the money.
        func (s *Server) charge(r Request) Response {
        	if wait := s.atProvider; wait != nil {
        		s.atProvider = nil
        		wait()
        	}
        	s.txs++
        	id := fmt.Sprintf("tx-%d", s.txs)
        	s.ledger.Post(Tx{ID: id, Lines: []Line{
        		{Account: r.From, Debit: r.Amount},
        		{Account: r.To, Credit: r.Amount},
        	}})
        	return Response{201, id}
        }

        // balance is what user 1042 has left.
        func (s *Server) balance() string {
        	return cents(s.ledger.Balance("liability:user:1042"))
        }
      ledger.go: |
        package main

        import (
        	"fmt"
        	"strings"
        )

        // Line is one row of a transaction: an amount on the debit or the credit side of one account.
        type Line struct {
        	Account string
        	Debit   int64
        	Credit  int64
        }

        // Tx is one business event. All of its lines are posted together, or none of them.
        type Tx struct {
        	ID    string
        	Memo  string
        	Lines []Line
        }

        // Ledger is an append-only list of posted transactions. Balances are derived from it.
        type Ledger struct {
        	txs []Tx
        }

        // Post appends a transaction only if its debits equal its credits.
        func (l *Ledger) Post(tx Tx) error {
        	var debit, credit int64
        	for _, line := range tx.Lines {
        		debit += line.Debit
        		credit += line.Credit
        	}
        	if debit != credit {
        		return fmt.Errorf("tx %s is not balanced: debit %s, credit %s", tx.ID, cents(debit), cents(credit))
        	}
        	l.txs = append(l.txs, tx)
        	return nil
        }

        // kindOf reads the account type from the name: "asset:bank" is an asset.
        func kindOf(account string) string {
        	kind, _, _ := strings.Cut(account, ":")
        	return kind
        }

        // Balance derives an account's balance on the side where that kind of account grows:
        // assets and expenses grow with debits; liabilities, equity and revenue grow with credits.
        func (l *Ledger) Balance(account string) int64 {
        	var debit, credit int64
        	for _, tx := range l.txs {
        		for _, line := range tx.Lines {
        			if line.Account == account {
        				debit += line.Debit
        				credit += line.Credit
        			}
        		}
        	}
        	if kind := kindOf(account); kind == "asset" || kind == "expense" {
        		return debit - credit
        	}
        	return credit - debit
        }

        // cents prints minor units as an amount with two decimals: cents(1234) is "12.34".
        func cents(n int64) string {
        	sign := ""
        	if n < 0 {
        		sign, n = "-", -n
        	}
        	return fmt.Sprintf("%s%d.%02d", sign, n/100, n%100)
        }
      main.go: |
        package main

        import "fmt"

        // Pay is the endpoint POST /payments.
        func (s *Server) Pay(r Request) Response {
        	k := r.Client + "/pay/" + r.Key
        	resp := s.charge(r)
        	s.keys[k] = resp
        	return resp
        }

        func main() {
        	s := newServer()
        	p := Request{Client: "app", Key: "k-1", Amount: 2500,
        		From: "liability:user:1042", To: "liability:user:2077"}
        	first := s.Pay(p) // the response is lost on the way back
        	retry := s.Pay(p) // the client timed out, so it sends the same request again
        	fmt.Println("first:", first, "  retry:", retry)
        	fmt.Println("user 1042:", s.balance())
        }
