  - id: check
    narration: >-
      [[mark:close-key]] Code မှာ key ကို ဘယ်လို ဖွဲ့ထားလဲ အရင် ကြည့်ရအောင်။ [[mark:sel-scope]] key ကို
      client နဲ့ operation နဲ့ တွဲထားပါတယ်။ client နှစ်ခုက key တစ်ခုတည်းကို မတော်တဆ ရွေးမိရင်၊ ဒါမှမဟုတ်
      payment နဲ့ refund က key တူနေရင်၊ တစ်ခုရဲ့ response ကို နောက်တစ်ခုက မရသွားအောင်ပါ။
      [[mark:type-check]] ငွေ မဖြတ်ခင် အဲဒီ key ကို ရှာပြီး၊ တွေ့ရင် သိမ်းထားတဲ့ response ကို ချက်ချင်း
      ပြန်ပေးပါမယ်။ မတွေ့မှ ငွေ ဖြတ်ပါမယ်။ ပထမ request ကတော့ အရင်အတိုင်း ဖြတ်ပြီး response ကို
      သိမ်းပါတယ်။ [[mark:run-2]] run လိုက်ရအောင်။ [[mark:pt-r2]] retry က ပထမ request ရဲ့ transaction
      အတိုင်း ပြန်ရပါတယ်၊ response နှစ်ခု တစ်ထပ်တည်း ကျပါတယ်။ [[mark:pt-b2]] user မှာ ယူရို ၇၅
      ကျန်ပါတယ်၊ ဖြတ်တာ တစ်ခါပဲ ရှိပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Idempotency (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#idempotency",
        }
    actions:
      - { id: close-key, type: slide.close, at: { mark: close-key } }
      - id: sel-scope
        type: editor.select
        at: { mark: sel-scope }
        target: { file: main.go, text: 'k := r.Client + "/pay/" + r.Key', occurrence: 1 }
      - id: type-check
        type: editor.type
        at: { mark: type-check }
        target: { file: main.go, after: "\tk := r.Client + \"/pay/\" + r.Key\n", occurrence: 1 }
        text: "\tif saved, ok := s.keys[k]; ok {\n\t\treturn saved\n\t}\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "retry: 201 tx-1",
          timeoutMs: 8000,
        }
      - id: pt-r2
        type: console.point
        at: { mark: pt-r2 }
        target: { text: "retry: 201 tx-1", occurrence: 1 }
      - id: pt-b2
        type: console.point
        at: { mark: pt-b2 }
        target: { text: "user 1042: 75.00", occurrence: 1 }

  - id: inflight
    chapter: အလုပ်လုပ်နေတုန်း ရောက်လာတဲ့ copy
    narration: >-
      retry က ပထမ request ပြီးမှ အမြဲ ရောက်တာ မဟုတ်ပါဘူး။ client ရဲ့ timeout က server ရဲ့ အလုပ်ထက်
      တိုနေရင်၊ ဒါမှမဟုတ် user က ခလုတ်ကို နှစ်ခါ နှိပ်လိုက်ရင်၊ ပထမ request က provider ကို စောင့်နေတုန်း copy
      ရောက်လာပါတယ်။ [[mark:type-flight]] ဒီ code က key အသစ်နဲ့ ဒုတိယ payment တစ်ခု ပို့ပါတယ်။ အဲဒီ
      request က card network ကို စောင့်နေတုန်း သူ့ရဲ့ copy တစ်ခု ရောက်လာပါတယ်။ goroutine
      မသုံးဘဲ ဖြစ်တဲ့ အစီအစဉ်အတိုင်း တစ်ဆင့်ချင်း ရေးထားတာပါ။ [[mark:predict]] key ကို စစ်တဲ့ line
      ထည့်ပြီးပြီ ဆိုတော့ copy ဘာဖြစ်မလဲ၊ run မလုပ်ခင် ခန့်မှန်းကြည့်ပါ။ [[mark:run-3]] run လိုက်ရအောင်။
      [[mark:pt-copy]] copy က ငြင်းခံရမယ့်အစား transaction အသစ်နဲ့ ငွေ ဖြတ်သွားပါတယ်။ [[mark:pt-orig]]
      မူရင်း request ကလည်း သူ့အလုပ် ပြီးတဲ့အခါ နောက်ထပ် တစ်ခါ ဖြတ်ပါတယ်။ [[mark:pt-b3]] key တစ်ခုတည်းနဲ့
      payment တစ်ခုအတွက် ယူရို ၅၀ ထွက်သွားပါတယ်။ [[mark:dock-3]] အကြောင်းက key ကို အလုပ် ပြီးမှ သိမ်းလို့ပါ။
      ပထမ request အလုပ်လုပ်နေတဲ့ ကြားမှာ key က store ထဲ မရှိသေးတော့ copy က စစ်တာကို ဖြတ်ကျော်သွားပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Idempotency (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#idempotency",
        }
    actions:
      - id: type-flight
        type: editor.type
        at: { mark: type-flight }
        target:
          { file: main.go, after: "\tfmt.Println(\"user 1042:\", s.balance())\n", occurrence: 1 }
        text: "\n\tq := p\n\tq.Key = \"k-2\" // a second, real payment of the same amount\n\ts.atProvider = func() { fmt.Println(\"copy in flight:\", s.Pay(q)) }\n\tfmt.Println(\"original:\", s.Pay(q))\n\tfmt.Println(\"user 1042:\", s.balance())\n"
        cadence: line-by-line
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "copy in flight: 201 tx-2",
          timeoutMs: 8000,
        }
      - id: pt-copy
        type: console.point
        at: { mark: pt-copy }
        target: { text: "copy in flight: 201 tx-2", occurrence: 1 }
      - id: pt-orig
        type: console.point
        at: { mark: pt-orig }
        target: { text: "original: 201 tx-3", occurrence: 1 }
      - id: pt-b3
        type: console.point
        at: { mark: pt-b3 }
        target: { text: "user 1042: 25.00", occurrence: 1 }
      - { id: dock-3, type: runtime.collapseDock, at: { mark: dock-3 } }

  - id: barrier
    chapter: Barrier က atomic ဖြစ်ရမယ်
    narration: >-
      [[mark:show-barrier]] database ပေါ်မှာ ဒါက ဒီလို ဖြစ်ပါတယ်။ [[mark:pt-w1]] request နှစ်ခုလုံးက key
      ကို ရှာကြည့်ပြီး မတွေ့လို့ နှစ်ခုလုံး ဆက်သွားပါတယ်။ ရှာတာနဲ့ သိမ်းတာကြားမှာ အချိန် ကွာနေသရွေ့၊ ဘယ်လောက်
      မြန်တဲ့ database ဖြစ်ဖြစ် race ဖြစ်နိုင်ပါတယ်။ [[mark:barrier-2]] ဒါကြောင့် ငွေ နှစ်ခါ ဖြတ်ပါတယ်။
      [[mark:barrier-3]] ဖြေရှင်းနည်းက key ကို အလုပ် မစခင် အရင် claim လုပ်တာပါ။ [[mark:pt-ra]] ပထမ request
      က key ကို in progress အနေနဲ့ အရင် insert လုပ်ပါတယ်။ [[mark:pt-rb]] copy ရဲ့ insert က unique
      constraint ကို ထိပြီး ကျသွားလို့ conflict ပြန်ရပါတယ်။ [[mark:pt-sql]] သတိထားရမှာက စစ်တာနဲ့ claim
      လုပ်တာ atomic ဖြစ်တဲ့ အဆင့် တစ်ခုတည်း ဖြစ်ရမှာပါ၊ unique constraint ပါတဲ့ INSERT တစ်ခုလိုမျိုးပါ။ ဒါဆိုရင် millisecond တစ်ခုတည်းမှာ ရောက်လာတဲ့ copy နှစ်ခုကြားမှာတောင်
      တစ်ခုပဲ အောင်မယ် ဆိုတာကို database ကိုယ်တိုင် အာမခံပေးပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Idempotency (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#idempotency",
        }
      - {
          title: "PostgreSQL documentation — INSERT, ON CONFLICT clause",
          url: "https://www.postgresql.org/docs/current/sql-insert.html#SQL-ON-CONFLICT",
        }
    actions:
      - {
          id: show-barrier,
