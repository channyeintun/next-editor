  - id: try-it
    chapter: ကိုယ်တိုင် စမ်းကြည့်ပါ
    narration: >-
      [[mark:close-iv]] ကိုယ်တိုင် စမ်းကြည့်ဖို့ တစ်ခု ရှိပါတယ်။ [[mark:sel-try]] retry line ရဲ့ အပေါ်မှာ
      request ရဲ့ key ကို အသစ် ပေးတဲ့ line တစ်ကြောင်း ထည့်ပြီး run ကြည့်ပါ။ retry က transaction အသစ်နဲ့
      ဖြတ်ပြီး ယူရို ၂၅ ထပ်ထွက်ပါလိမ့်မယ်၊ server က duplicate ကို ပမာဏနဲ့ မဟုတ်ဘဲ key နဲ့ပဲ ခွဲလို့ပါ။ [[mark:try-why]] ဒါကြောင့် client က key ကို retry တစ်ခါစီမှာ မထုတ်ရပါဘူး၊ user
      က payment လုပ်မယ်လို့ ဆုံးဖြတ်တဲ့ အချိန်မှာ တစ်ခါ ထုတ်ပြီး retry တိုင်းမှာ အဲဒီ key ကိုပဲ ပို့ရပါတယ်။
      [[mark:recap]] ပြန်ချုပ်ရရင်၊ network က message ကို တစ်ခါပဲ ရောက်အောင် အာမမခံနိုင်လို့ retry
      လုပ်ရပြီး၊ retry ကို အန္တရာယ်ကင်းအောင် လုပ်ပေးတာက အလုပ် မစခင် atomic claim လုပ်ထားတဲ့ key ပါ။ နောက်
      lesson မှာတော့ error ကို ဘယ်လို replay လုပ်မလဲ၊ key ကို ဘယ်လောက်ကြာ ထားမလဲ ဆိုတဲ့ ခက်တဲ့ အစွန်းတွေကို
      ကြည့်ပါမယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Idempotency (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#idempotency",
        }
    actions:
