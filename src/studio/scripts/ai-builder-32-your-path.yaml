        # Task 01 · Order form

        ## Goal
        customer က ဖုန်းကနေ ကြိုမှာလို့ရတဲ့ form တစ်ခု။

        ## Read first
        - docs/spec.md — Rules, AC-1 ကနေ AC-4
        - AGENTS.md

        ## Constraints
        - order form တစ်ခုတည်း။ ကောင်တာစာရင်းက Task 03။
        - package အသစ် မထည့်ပါနဲ့။
        - login နဲ့ account မဆောက်ပါနဲ့။

        ## Done when
        - AC-1 ကနေ AC-4 အထိ ဖုန်း screen အရွယ်မှာ pass ဖြစ်ရမယ်။
        - ဘာပြင်ခဲ့လဲ၊ ဘာမလုပ်ခဲ့လဲ စာရင်း ပြန်ပေးပါ။

        ## If unsure
        ရပ်ပြီး မေးပါ။ business rule တွေကို ခန့်မှန်းပြီး မဆုံးဖြတ်ပါနဲ့။
