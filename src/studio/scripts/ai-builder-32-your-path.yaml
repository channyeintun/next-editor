        # Next · ကြိုမှာ app

        ## What we learned
        - မဝယ်ဘဲ ပြန်သွားတဲ့ customer — 10 ကနေ 4 ယောက် (ပန်းတိုင် 3 အောက်၊ မရောက်သေး)
        - ကြိုမှာတဲ့ အော်ဒါ — တစ်မနက် 23 (ပန်းတိုင် 20၊ ရောက်ပြီ)
        - ဖုန်းနဲ့ ကြိုမှာတာ — နည်းလာ (ပန်းတိုင်အတိုင်း)
        - လာမယူတဲ့ အော်ဒါ — 30%၊ တစ်မနက် 7 ခုလောက် (ADR-001 ရဲ့ 5 ခုကို ကျော်)
        - မသုံးနိုင်ခဲ့တဲ့ customer — ဖုန်းဟောင်းမှာ မြန်မာစာ ပုံပျက်၊ စာလုံးကြီး setting မှာ ခလုတ် ပျောက်၊ data နှေးရင် ကြာလွန်း

        ## Why not picked up
        လှလှ က လာမယူခဲ့တဲ့ customer တွေကို ဆိုင်ပြန်ရောက်တော့ မေးခဲ့တယ်။
        - မှာပြီး အလုပ်ရှုပ်သွားလို့ မေ့သွားတယ်။
        - နောက်ကျမယ် သိပေမဲ့ လာယူချိန်ကို ပြင်လို့ မရဘူး။
        - data — လာမယူတဲ့ အော်ဒါ 10 ခုမှာ 7 ခုက အစောဆုံး ရွေးလို့ရတဲ့ အချိန် (မှာပြီး 15 မိနစ်) ကို ရွေးထားတယ်။

        ## v2 shortlist
        Must
        - လာယူချိန်ကို ပြင်တာ၊ အော်ဒါ ဖျက်တာ
        - ဖုန်းဟောင်း၊ စာလုံးကြီး setting၊ data နှေးတဲ့ ဖုန်းမှာ ပြန်စစ်ပြီး ပြင်တာ
        Should
        - လာယူချိန် မတိုင်ခင် သတိပေး SMS — customer က ကိုယ်တိုင် ရွေးမှ ပို့
        - အော်ဒါ အသင့်ဖြစ်ရင် SMS (v1 ရဲ့ Should)
        Won't (for now)
        - delivery — အထောက်အထား မရှိသေးဘူး

        ## Next question for မြမြ
        - လာယူချိန် ပြင်ခွင့်နဲ့ သတိပေး SMS ကို တစ်လ စမ်းပြီး၊ လာမယူတဲ့ အော်ဒါ တစ်မနက် 5 ခု နဲ့ အောက် ကျမကျ ပြန်တိုင်းမလား။
