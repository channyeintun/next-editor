        # Problem · ကြိုမှာ app

        ## Problem
        မနက် 7 နာရီကနေ 9 နာရီကြား ဆိုင်မှာ တန်းစီရတာ ကြာလို့၊ အလုပ်သွားမယ့် customer တွေ မဝယ်ဘဲ ပြန်ထွက်သွားကြတယ်။

        ## Who
        - အလုပ်မသွားခင် မနက်တိုင်း လာဝယ်တဲ့ member တွေ၊ ဥပမာ အောင်အောင်
        - အချိန်ကျပ်တဲ့ ကျောင်းသားတွေ၊ ဥပမာ မောင်မောင်
        - ကောင်တာမှာ အော်ဒါ လက်ခံတဲ့ လှလှ

        ## Today
        - တန်းစီ၊ ကောင်တာမှာ မှာ၊ ပြီးမှ ထပ်စောင့်ရတယ်။
        - တချို့က ဖုန်းဆက်ပြီး ကြိုမှာကြတယ်။ ဒါပေမဲ့ လှလှ က ဖုန်းကိုင်နေရင် ကောင်တာက လူတွေ ပိုစောင့်ရတယ်။

        ## Why it matters
        - လှလှ ရဲ့ မှတ်စုအရ မနက်တိုင်း customer 10 ယောက်လောက် မဝယ်ဘဲ ပြန်သွားတယ်။

        ## How we'll know
        - မဝယ်ဘဲ ပြန်သွားတဲ့ customer — တစ်မနက် 3 ယောက်အောက်
        - ကြိုမှာတဲ့ အော်ဒါ — တစ်မနက် 20 နဲ့ အထက်
        - ဖုန်းနဲ့ ကြိုမှာတာ — တဖြည်းဖြည်း နည်းလာ

        ## Not the problem
        - ဈေးနှုန်းနဲ့ အရသာ — customer တွေ ကြိုက်ပြီးသား
        - delivery — ဒီတစ်ခါ မဖြေရှင်းသေးဘူး
      docs/release-checklist.md: |
        # Release checklist · ကြိုမှာ app

        ## Before
        - staging မှာ test plan ကို အစအဆုံး စစ်ပြီး အားလုံး pass ဖြစ်ပြီ။
        - ဈေးပေါတဲ့ Android ဖုန်းနဲ့ staging မှာ အော်ဒါ တစ်ခု မှာကြည့်ပြီ။
        - production data ကို backup လုပ်ပြီ။
        - rollback လုပ်နည်းကို ရေးထားပြီ — နောက်ဆုံး ကောင်းခဲ့တဲ့ version ကို ပြန်တင်မယ်။

        ## During
        - 10:00 နောက်မှ release လုပ်မယ်။ မနက် 7:00–9:00 အလုပ်ရှုပ်ချိန်မှာ မလုပ်ဘူး။
        - release လုပ်တဲ့သူ တစ်ယောက် အစအဆုံး ရှိနေပြီး စောင့်ကြည့်မယ်။

        ## After
        - production မှာ အော်ဒါ တစ်ခု ကိုယ်တိုင် မှာကြည့်မယ်။
        - error တွေကို 30 မိနစ် စောင့်ကြည့်မယ်။
        - ဘာပြောင်းသွားလဲ လှလှ ကို ပြောမယ်။
      docs/requirements.md: |
        # Requirements · ကြိုမှာ app

        ## User stories
        - Customer အနေနဲ့ ဆိုင်မရောက်ခင် ဖုန်းကနေ ကြိုမှာချင်တယ်၊ ဒါမှ တန်းမစီရဘဲ ယူသွားလို့ရမယ်။
        - Customer အနေနဲ့ လာယူမယ့် အချိန်ကို ရွေးချင်တယ်၊ ဒါမှ ရောက်တဲ့အချိန် အသင့်ဖြစ်နေမယ်။
        - ကောင်တာက လှလှ အနေနဲ့ ဝင်လာတဲ့ အော်ဒါတွေကို လာယူချိန်အလိုက် မြင်ချင်တယ်၊ ဒါမှ အချိန်မီ ပြင်ထားနိုင်မယ်။
        - ဆိုင်ပိုင်ရှင် မြမြ အနေနဲ့ တစ်မနက် ကြိုမှာတဲ့ အော်ဒါ အရေအတွက်ကို သိချင်တယ်၊ ဒါမှ app က အလုပ်ဖြစ်မဖြစ် သိမယ်။

        ## Non-functional
        - ဈေးပေါတဲ့ Android ဖုန်း၊ နှေးတဲ့ mobile data မှာ 3 စက္ကန့်အတွင်း ပွင့်ရမယ်။
        - မြန်မာစာ မှန်မှန် ပေါ်ရမယ်။ မြန်မာဂဏန်းနဲ့ ရိုက်ရင်လည်း လက်ခံရမယ်။
        - customer ရဲ့ ဖုန်းနံပါတ်ကို ဆိုင်ကလွဲရင် ဘယ်သူမှ မမြင်ရဘူး။
        - စာလုံး ကြီးကြီးနဲ့ ဖတ်တဲ့သူလည်း သုံးလို့ရရမယ်။
        - run ဖို့ တစ်လ 30,000 ကျပ်ထက် မကုန်ရဘူး။

        ## Constraints
        - app ကို ကိုယ်တစ်ယောက်တည်း AI agent နဲ့ တည်ဆောက်မယ်။
        - ငွေကို ကောင်တာမှာပဲ ချေမယ်။
        - ဆိုင်ဖွင့်ချိန် — တနင်္လာ–သောကြာ 6:00–20:00၊ စနေ–တနင်္ဂနွေ 7:00–21:00

        ## Scope (v1)
        Must
        - လာယူမယ့် အချိန်နဲ့ ကြိုမှာလို့ရတာ
        - အော်ဒါနံပါတ်
        - ကောင်တာမှာ အော်ဒါစာရင်း မြင်ရတာ
        Should
        - အော်ဒါ အသင့်ဖြစ်ရင် SMS ပို့တာ
        Won't (for now)
        - delivery
        - online ငွေပေးချေမှု
        - customer account နဲ့ login

        ## Edge cases
        - အရေအတွက် 0 ဒါမှမဟုတ် အနုတ် → လက်မခံ၊ 1 ကနေ 20 အထိ
        - ဆိုင်ပိတ်ချိန် လာယူချိန် → လက်မခံ၊ ဖွင့်ချိန်ကို ပြ
        - ဖုန်းနံပါတ် မပါ → လက်မခံ
        - မှာမယ် ကို နှစ်ခါ နှိပ် → အော်ဒါ တစ်ခုပဲ
        - အရေအတွက်ကို မြန်မာဂဏန်းနဲ့ ရိုက် (၃) → 3 လိုပဲ တွက်

        ## Assumptions
        - customer တွေ မှာပြီး 2 နာရီအတွင်း လာယူမယ်။
        - တစ်မနက် ကြိုမှာတဲ့ အော်ဒါ 50 ထက် မများဘူး။

        ## Questions for မြမြ
        - လာမယူတဲ့ အော်ဒါကို ဘယ်လောက်ကြာရင် ပယ်မလဲ။
        - ပိတ်ခါနီး ဘယ်နှမိနစ်အထိ ကြိုမှာခွင့်ပေးမလဲ။
      docs/review-checklist.md: |
        # Review checklist

        ## Questions
        - ခိုင်းတဲ့ task ကိုပဲ လုပ်ခဲ့လား၊ မခိုင်းတာ ပါလာလား။
        - ပြောင်းလဲမှု အရွယ်က task နဲ့ ကိုက်လား။
        - မထိရမယ့် file — spec၊ test — ကို ပြင်ခဲ့လား။
        - package အသစ် ပါလား — တကယ် လိုလား၊ တကယ် ရှိလား၊ ထိန်းနေသူ ရှိလား။
        - secret ဒါမှမဟုတ် customer ရဲ့ data code ထဲ ပါလား။
        - customer မြင်ရမယ့် error စာသားက ဘာမှားလဲ၊ ဘာလုပ်ရမလဲ ပြောလား။
        - မလုပ်ခဲ့တာတွေကို စာရင်း ပေးထားလား။
        - ဒီ ပြောင်းလဲမှုကို ကိုယ် နှစ်ကြောင်းနဲ့ ရှင်းပြနိုင်လား။

        ## Task 02 review
        - ❌ rule 3 ခုအတွက် file 9 ခု၊ အသစ် 4 ခု — ဘာကြောင့်လဲ ရှင်းမထားဘူး။
        - ❌ AC-3 ကို ပြည့်အောင် မလုပ်ဘဲ spec.md ကို ပြင်သွားတယ်။ spec က ကိုယ်တို့ ဆုံးဖြတ်ရတာ။
        - ❌ မလုပ်ခဲ့တာ စာရင်း မပါဘူး။
        - ❌ kyat-format — မလိုဘူး၊ app က ကျပ်ကို ပြပြီးသား။ တကယ် ရှိမရှိလည်း မသေချာဘူး။
        Decision — merge မလုပ်ဘူး။ ❌ တွေ ပြင်ဖို့ ပြန်ပို့မယ်၊ ပြီးရင် test plan ကို ပြန် run မယ်။
      docs/runbook.md: |
        # Runbook · ကြိုမှာ app

        ## Signals
        - ကြိုမှာတဲ့ အော်ဒါ — တစ်မနက် 20 နဲ့ အထက် (problem.md)
        - မအောင်မြင်တဲ့ အော်ဒါ — ပုံမှန် 0၊ error log ထဲမှာ ကြည့်
        - လာမယူတဲ့ အော်ဒါ — တစ်မနက် 5 ခုထက် များရင် ADR-001 ကို ပြန်ကြည့်
        - alert — ဖွင့်ချိန်မှာ အော်ဒါ ဆက်တိုက် 3 ခု မအောင်မြင်မှ ကိုယ့်ဖုန်းကို ပို့
        - လှလှ ရဲ့ မှတ်စု — customer ပြောတာတွေကို နေ့တိုင်း ဆိုင်ပိတ်ပြီး ဖတ်

        ## If orders stop arriving
        1. ဖုန်းနဲ့ အော်ဒါ တစ်ခု ကိုယ်တိုင် မှာကြည့်။
        2. မရရင် လှလှ နဲ့ မြမြ ကို ပြော။ ပြန်ကောင်းတဲ့အထိ ဖုန်းနဲ့ အော်ဒါ လက်ခံ။
        3. hosting ရဲ့ status page ကို ကြည့်။
        4. release အသစ် ပြီးကတည်းက ဖြစ်တာဆိုရင် rollback လုပ်။
        5. error log ကို ကြည့်။ agent ကို log ဖတ်ခိုင်းလို့ရတယ်၊ production ကို ပြင်ခွင့် မပေးဘူး။

        ## After an incident
        - ဘာဖြစ်ခဲ့လဲ — ဘယ်အချိန်ကနေ ဘယ်အချိန်ထိ၊ customer ဘယ်နှယောက် ထိခိုက်လဲ
        - ဘာကြောင့်လဲ — လူကို အပြစ်မတင်ဘဲ ဘာက ဖြစ်ခွင့်ပေးခဲ့လဲ ရှာ
        - ဘာပြောင်းမလဲ — test၊ rule ဒါမှမဟုတ် ဒီ runbook ထဲ တစ်ကြောင်း
      docs/security.md: |
        # Security · ကြိုမှာ app

        ## Secrets
        - secret (key၊ password) တွေကို hosting ရဲ့ secret settings မှာပဲ ထားမယ်။
        - code၊ chat၊ screenshot၊ commit ထဲ ဘယ်တော့မှ မထည့်ဘူး။
        - browser ဆီ ရောက်တဲ့ code မှန်သမျှကို လူတိုင်း ဖတ်လို့ရတယ်။
        - ပေါက်သွားရင် ချက်ချင်း ပိတ်ပြီး key အသစ် လဲမယ်။

        ## Access
        - agent က sandbox ထဲမှာ test data နဲ့ပဲ အလုပ်လုပ်မယ်။
        - agent ကို production database မပေးဘူး။
        - service တစ်ခုစီကို သူ့အလုပ်အတွက် လိုတဲ့ access ပဲ ပေးမယ်။

        ## Customer data
        - နာမည်နဲ့ ဖုန်းနံပါတ်ပဲ သိမ်းမယ်။
        - အော်ဒါ ပြီးလို့ 30 ရက်ကြာရင် နာမည်နဲ့ ဖုန်းကို ဖျက်မယ်။
        - ဘာသိမ်းလဲ၊ ဘာကြောင့်လဲ ဆိုတာ form မှာ customer ကို ပြောပြမယ်။

        ## Untrusted text
        - customer မှတ်ချက်နဲ့ web page တွေက data ပဲ၊ ညွှန်ကြားချက် မဟုတ်ဘူး။
        - အပြင်က ဝင်လာတဲ့ input မှန်သမျှကို server မှာ ပြန်စစ်မယ်။

        ## Before real customers
        - တကယ့် customer မသုံးခင် security နားလည်တဲ့သူ တစ်ယောက်ကို review လုပ်ခိုင်းမယ်။
      docs/spec.md: |
        # Spec · ကြိုမှာ app (v1)

        ## Goal
        မနက်ပိုင်း customer တွေ တန်းမစီရဘဲ ကြိုမှာပြီး လာယူနိုင်ဖို့ (problem.md)။

        ## Users
        customer (အောင်အောင်၊ မောင်မောင်)၊ ကောင်တာ (လှလှ)၊ ဆိုင်ပိုင်ရှင် (မြမြ)

        ## Rules
        - ဈေးနှုန်း — ကျပ် ကိန်းပြည့်၊ ဒသမ မပါ။
        - အရေအတွက် — 1 ကနေ 20 အထိ။
        - လာယူချိန် — ဒီနေ့၊ ဆိုင်ဖွင့်ချိန်အတွင်း၊ အနည်းဆုံး 15 မိနစ် ကြိုမှာရမယ်။
        - အော်ဒါနံပါတ် — နေ့တိုင်း #101 ကနေ စမယ်။
        - ငွေ — ကောင်တာမှာ ချေမယ်။

        ## Example
        အောင်အောင် — လက်ဖက်ရည် 2 ခွက်၊ 8:30 မှာ လာယူမယ် → အော်ဒါ #101၊ 3,000 ကျပ်

        ## Out of scope
        requirements.md ရဲ့ Won't (for now) — delivery၊ online ငွေပေးချေမှု၊ login

        ## Acceptance criteria
        AC-1 Given လက်ဖက်ရည် 2၊ 8:30၊ နာမည်နဲ့ ဖုန်း ထည့်ထားတယ်
             When မှာမယ် ကို နှိပ်တယ်
             Then အော်ဒါနံပါတ်၊ စုစုပေါင်း 3,000 ကျပ်နဲ့ 8:30 ကို မြင်ရမယ်
        AC-2 Given အရေအတွက် 0
             When မှာမယ် ကို နှိပ်တယ်
             Then အော်ဒါ မဖြစ်ဘဲ "1 ကနေ 20 အထိ ရွေးပါ" လို့ ပြမယ်
        AC-3 Given လာယူချိန်က ဆိုင်ပိတ်ချိန်ထဲမှာ
             When မှာမယ် ကို နှိပ်တယ်
             Then အော်ဒါ မဖြစ်ဘဲ ဆိုင်ဖွင့်ချိန်ကို ပြမယ်
        AC-4 Given ဖုန်းနံပါတ် မထည့်ရသေးဘူး
             When မှာမယ် ကို နှိပ်တယ်
             Then အော်ဒါ မဖြစ်ဘဲ ဖုန်းနံပါတ် ထည့်ခိုင်းမယ်
        AC-5 Given အော်ဒါ အသစ် ဝင်လာတယ်
             When လှလှ က ကောင်တာစာရင်းကို ကြည့်တယ်
             Then အော်ဒါကို လာယူချိန်အလိုက် စီပြီး မြင်ရမယ်
        AC-6 Given အရေအတွက်ကို မြန်မာဂဏန်း ၃ နဲ့ ရိုက်ထားတယ်
             When မှာမယ် ကို နှိပ်တယ်
             Then 3 လို့ တွက်ပြီး စုစုပေါင်း 4,500 ကျပ်ကို မြင်ရမယ်

        ## Definition of done
        - သက်ဆိုင်တဲ့ AC တွေ ဖုန်း screen ပေါ်မှာ စစ်ပြီး pass ဖြစ်ရမယ်။
        - code ထဲမှာ secret မပါရဘူး။
        - spec.md နဲ့ decisions.md ကို update လုပ်ပြီးပြီ။

        ## Open questions
        requirements.md ရဲ့ Questions for မြမြ ကို ကြည့်ပါ။
      docs/system-map.md: |
        # System map · ကြိုမှာ app

        ## Parts
        - Screen — customer ဖုန်းရဲ့ browser ထဲက order form (frontend)
        - Server — အော်ဒါကို စစ်ပြီး သိမ်းပေးတဲ့ ကွန်ပျူတာ (backend)
        - Database — အော်ဒါတွေနဲ့ menu ကို သိမ်းထားတဲ့ နေရာ
        - Counter screen — ကောင်တာက လှလှ ရဲ့ tablet ပေါ်က အော်ဒါစာရင်း
        - Outside services — app ကို တင်ထားတဲ့ hosting၊ နောက်မှ SMS

        ## One order's journey
        1. အောင်အောင် က လက်ဖက်ရည် 2 ခွက်၊ 8:30 ကို ရွေးပြီး မှာမယ် ကို နှိပ်တယ်။
        2. Screen က အော်ဒါကို internet ကနေ server ရဲ့ API ဆီ ပို့တယ်။
        3. Server က rule တွေကို စစ်ပြီး database ထဲ သိမ်းတယ်၊ အော်ဒါနံပါတ် ပြန်ပေးတယ်။
        4. Screen က အော်ဒါ #101 နဲ့ စုစုပေါင်း 3,000 ကျပ်ကို ပြတယ်။
        5. Counter screen က server ကနေတစ်ဆင့် အော်ဒါတွေကို လာယူချိန်အလိုက် ဖတ်ပြီး လှလှ ကို ပြတယ်။

        ## Where rules are checked
        - Screen မှာ — customer ချက်ချင်း သိအောင်၊ အဆင်ပြေဖို့ပဲ။
        - Server မှာ — တကယ် စစ်တဲ့ နေရာ။ Screen ကို ကျော်ပြီး ပို့လာတဲ့ request ကိုလည်း ငြင်းရမယ်။
      docs/test-plan.md: |
        # Test plan · v1

        ## TC-1 · ပုံမှန် အော်ဒါ (AC-1)
        - လုပ်ရမှာ — လက်ဖက်ရည် 2၊ 08:30၊ အောင်အောင်၊ 09 000 111 222 ထည့်ပြီး မှာမယ် ကို နှိပ်
        - မျှော်လင့်ချက် — အော်ဒါနံပါတ်၊ 3,000 ကျပ်၊ 08:30
        - ရလဒ် — ✅ #101၊ လက်ဖက်ရည် × 2၊ 3,000 ကျပ်၊ 08:30

        ## TC-2 · အရေအတွက် 0 (AC-2)
        - လုပ်ရမှာ — TC-1 အတိုင်း၊ အရေအတွက်ကိုပဲ 0
        - မျှော်လင့်ချက် — အော်ဒါ မဖြစ်ဘဲ "1 ကနေ 20 အထိ ရွေးပါ" လို့ ပြ
        - ရလဒ် — ❌ 0 ကျပ်နဲ့ လက်ခံသွားတယ် (#102)

        ## TC-3 · ဆိုင်ပိတ်ချိန် (AC-3)
        - လုပ်ရမှာ — TC-1 အတိုင်း၊ လာယူချိန်ကိုပဲ 02:00
        - မျှော်လင့်ချက် — အော်ဒါ မဖြစ်ဘဲ ဆိုင်ဖွင့်ချိန်ကို ပြ
        - ရလဒ် — ❌ 02:00 နဲ့ လက်ခံသွားတယ် (#103)

        ## TC-4 · ဖုန်းနံပါတ် မပါ (AC-4)
        - လုပ်ရမှာ — TC-1 အတိုင်း၊ ဖုန်းကိုပဲ အလွတ်
        - မျှော်လင့်ချက် — အော်ဒါ မဖြစ်ဘဲ ဖုန်းနံပါတ် ထည့်ခိုင်း
        - ရလဒ် — ❌ ဖုန်း မပါဘဲ လက်ခံသွားတယ် (#104)

        ## TC-5 · ကောင်တာစာရင်း (AC-5)
        - လုပ်ရမှာ — လာယူချိန် မတူတဲ့ အော်ဒါ 2 ခု မှာပြီး ကောင်တာစာရင်းကို ကြည့်
        - မျှော်လင့်ချက် — လာယူချိန်အလိုက် စီပြီး ပြ
        - ရလဒ် — ⏸ မဆောက်ရသေးဘူး (Task 03)

        ## TC-6 · မြန်မာဂဏန်း (AC-6)
        - လုပ်ရမှာ — TC-1 အတိုင်း၊ အရေအတွက်ကိုပဲ မြန်မာဂဏန်း ၃
        - မျှော်လင့်ချက် — လက်ဖက်ရည် × 3၊ 4,500 ကျပ်
        - ရလဒ် — ❌ NaN ကျပ်နဲ့ လက်ခံသွားတယ် (BUG-3)

        ## Exploratory
        - ရှာမယ့်အရာ — မှာမယ် ကို နှစ်ခါ နှိပ်ရင် ဘာဖြစ်လဲ
        - တွေ့တာ — #105၊ #106၊ အော်ဒါ 2 ခု ဖြစ်တယ်။ requirements မှာ တစ်ခုပဲ လို့ ရေးထားပေမဲ့ AC မရှိသေးဘူး။
      docs/updates.md: |
        # Updates · 2026-11-08

        မြမြ ရေ၊ ဒီအပတ် update ပါ။

        ## Done
        - ပြဿနာ၊ app က လုပ်ရမယ့်အရာ၊ ပြီးပြီလို့ စစ်မယ့် စည်းကမ်းတွေ — ရေးပြီးပြီ။
        - agent အတွက် လမ်းညွှန်ချက်နဲ့ ပထမ အလုပ် — အပ်ပြီးပြီ။

        ## Next
        - order form — သောကြာနေ့ ဖုန်းနဲ့ စမ်းကြည့်လို့ရမယ်။
        - ကျန်တဲ့ အလုပ်တွေကို အပိုင်းလေးတွေ ခွဲမယ်။

        ## Blocked / need from you
        - ပိတ်ခါနီး ဘယ်နှမိနစ်အထိ ကြိုမှာခွင့်ပေးမလဲ — order form အတွက် ဗုဒ္ဓဟူးနေ့ မတိုင်ခင် လိုတယ်။
        - လာမယူတဲ့ အော်ဒါကို ဘယ်လောက်ကြာရင် ပယ်မလဲ — ကောင်တာစာရင်း မစခင် လိုတယ်။

        ## Decision needed · delivery
        - A · delivery ပါ ထည့် — v1 က 2 ပတ် နောက်ကျမယ်၊ rider တစ်ယောက် လိုမယ်။
        - B · pickup အရင် — ရက်ချိန်း မပြောင်းဘူး၊ delivery ကို v1 သုံးပြီးမှ ပြန်စဉ်းစားမယ်။
        - အကြံပြုချက် — B။ မြမြ အတွက် ဘာက ပိုအရေးကြီးလဲ ပြောပေးပါ။

        ## Question for လှလှ
        လှလှ ရေ၊ အော်ဒါ အသင့်ဖြစ်ပြီး customer မရောက်သေးရင် ကောင်တာမှာ ဘယ်လောက်ကြာ ထားပေးနိုင်လဲ။
