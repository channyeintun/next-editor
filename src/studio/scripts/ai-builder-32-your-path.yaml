build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 6132
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}
scenes:
  - id: recall
    chapter: Course တစ်ခုလုံးကို ပြန်ကြည့်
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ app ကို customer တွေ သုံးလို့ရအောင် ship လုပ်ပြီးနောက်၊ ကိန်းဂဏန်းတွေနဲ့ user တွေ တကယ်
      လုပ်တာကို ကြည့်ပြီး နောက် version ကို အထောက်အထားနဲ့ ရွေးခဲ့ပါတယ်။ ဒီနေ့က course ရဲ့ နောက်ဆုံး lesson ပါ။
      [[mark:open-plan]] ဘယ်ဘက်က ဖိုင်စာရင်းမှာ ကြိုမှာ app အတွက် course တစ်လျှောက် ရေးခဲ့တဲ့ document တွေ
      ရှိနေပါတယ်။ agent ပြန်ပေးတယ် ဆိုပြီး ကြည့်ခဲ့တဲ့ ဥပမာ plan နဲ့ summary တွေလည်း ပါပါတယ်။ ညာဘက်က ဖိုင်မှာတော့
      ခေါင်းစဉ်ပဲ ရှိပါသေးတယ်။ ဒီ ဖိုင်က ဆိုင်အတွက် မဟုတ်ဘဲ ကိုယ်ပိုင် project အတွက် plan ပါ။ lesson အဆုံးမှာ
      ကိုယ့် idea တစ်ခုနဲ့ ချက်ချင်း စလို့ရမယ့် template တစ်ခု ဖြစ်လာပါလိမ့်မယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): Conclusion",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - { id: open-plan, type: workspace.openFile, at: { mark: open-plan }, path: my-plan.md }

  - id: journey
    narration: >
      [[mark:j-open]] အဲဒီ မတိုင်ခင် course တစ်ခုလုံးကို ပြန်ကြည့်ရအောင်။ lesson ၃၂ ခုကို module လို့ ခေါ်တဲ့
      အပိုင်းကြီး ရှစ်ပိုင်း ခွဲခဲ့ပါတယ်။ [[mark:j1]] ပထမ module က AI နဲ့ အလုပ်သစ် ပါ။ agent က ပန်းတိုင် တစ်ခုဆီ
      loop ပတ်ပြီး အလုပ်လုပ်တဲ့ tool ဖြစ်ကြောင်းနဲ့၊ မှားရင် ဘယ်လောက် နစ်နာမလဲ ဆိုတဲ့ risk ပေါ်မူတည်ပြီး ဘယ်လောက်
      စနစ်တကျ လုပ်မလဲ ရွေးရကြောင်း သိခဲ့ပါတယ်။ [[mark:j2]] module နှစ်၊ ပြဿနာကို နားလည်တဲ့ အပိုင်းမှာ ဆိုင်ရဲ့
      ပြဿနာ၊ requirement၊ scope နဲ့ ပုံမှန် မဟုတ်တဲ့ အခြေအနေတွေကို ရေးခဲ့ပါတယ်။ [[mark:j3]] module သုံးကတော့
      ဆက်သွယ် ပြောဆိုတာပါ။ ပြီးပြီ ဆိုတာကို AC နဲ့ ရေးပြီး၊ spec၊ AGENTS.md နဲ့ task brief တွေနဲ့ agent ကို
      အလုပ်အပ်ခဲ့ပါတယ်။ ဆိုင်ပိုင်ရှင် မြမြ နဲ့ ကောင်တာက လှလှ ကိုလည်း သူတို့ နားလည်တဲ့ စကားနဲ့ အခြေအနေ
      ပြောပြခဲ့ပါတယ်။ [[mark:j4]] module လေးမှာ engineer လို တွေးတတ်အောင် အလုပ်ကို အပိုင်းလေးတွေ ခွဲတာ၊ app ရဲ့
      အစိတ်အပိုင်းတွေနဲ့ data ကို ပုံဖော်တာ၊ ဆုံးဖြတ်ချက်တွေကို မှတ်တမ်းတင်ပြီး ရိုးရှင်းအောင် ထိန်းတာတွေ
      လုပ်ခဲ့ပါတယ်။ [[mark:j5]] module ငါးက စစ်ဆေးတဲ့ အပိုင်းပါ။ agent ရဲ့ အလုပ်ကို code မဖတ်ဘဲ test plan၊ review
      checklist၊ bug report နဲ့ eval တွေနဲ့ စစ်ခဲ့ပါတယ်။ [[mark:j6]] module ခြောက်မှာ save point၊ security၊
      release၊ runbook နဲ့ ကုန်ကျစရိတ်ကို စီစဉ်ပြီး app ကို ဘေးကင်းကင်း ship လုပ်ခဲ့ပါတယ်။ [[mark:j7]] module
      ခုနစ်မှာတော့ factory ကို ဆောက်ခဲ့ပါတယ်။ agent ပတ်လည်က harness ကို ပြင်တာ၊ agent တွေကို ဘယ်လို အလုပ်ခွဲပေးမလဲ
      ရွေးတာ၊ app ထုတ်ပေးတဲ့ စက်ရုံ တစ်ခုလုံးကို ဒီဇိုင်းဆွဲပြီး ထိန်းတာတွေပါ။ [[mark:j8]] နောက်ဆုံး module၊
      product နဲ့ ကြီးထွားတဲ့ အပိုင်းမှာတော့ ship လုပ်ပြီးနောက် user တွေဆီက သင်ယူခဲ့ပြီး၊ ဒီနေ့ ကိုယ့် project
      အတွက် plan ကို ရေးပါမယ်။ [[mark:j-end]] ဒီ အဆင့်တွေ အားလုံးမှာ code တစ်ကြောင်းမှ ကိုယ်တိုင် မရေးခဲ့ပါဘူး။
      ဒါပေမဲ့ ပထမဆုံး lesson မှာ ပြောခဲ့တဲ့ software engineering အလုပ် တစ်ခုလုံးကို ကိုယ်တိုင် ဦးဆောင်ခဲ့တာပါ။
    sources:
      - {
          title: "The New SDLC (Burmese edition): Conclusion",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "The New SDLC (Burmese edition): The new SDLC",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: open-board-j,
          type: whiteboard.apply,
          at: { mark: j-open },
          open: true,
          clear: true,
          upsertIds:
            [
              m-b1,
              m-n1,
              m-b2,
              m-n2,
              m-b3,
              m-n3,
              m-b4,
              m-n4,
              m-b5,
              m-n5,
              m-b6,
              m-n6,
              m-b7,
              m-n7,
              m-b8,
              m-n8,
            ],
          drawMs: 1600,
        }
      - { id: draw-j1, type: whiteboard.apply, at: { mark: j1 }, upsertIds: [m-t1], drawMs: 800 }
      - { id: draw-j2, type: whiteboard.apply, at: { mark: j2 }, upsertIds: [m-t2], drawMs: 800 }
      - { id: draw-j3, type: whiteboard.apply, at: { mark: j3 }, upsertIds: [m-t3], drawMs: 800 }
      - { id: draw-j4, type: whiteboard.apply, at: { mark: j4 }, upsertIds: [m-t4], drawMs: 800 }
      - { id: draw-j5, type: whiteboard.apply, at: { mark: j5 }, upsertIds: [m-t5], drawMs: 800 }
      - { id: draw-j6, type: whiteboard.apply, at: { mark: j6 }, upsertIds: [m-t6], drawMs: 800 }
      - { id: draw-j7, type: whiteboard.apply, at: { mark: j7 }, upsertIds: [m-t7], drawMs: 800 }
      - { id: draw-j8, type: whiteboard.apply, at: { mark: j8 }, upsertIds: [m-t8], drawMs: 800 }
      - {
          id: draw-j-end,
          type: whiteboard.apply,
          at: { mark: j-end },
          upsertIds: [j-end],
          drawMs: 1000,
        }

  - id: principles
    chapter: Tool ပြောင်းလည်း မှန်နေမယ့် အချက် သုံးခု
    narration: >
      [[mark:p-title]] course တစ်လျှောက် tool အမျိုးမျိုးကို ပြောခဲ့ပေမယ့်၊ tool တွေက မြန်မြန် ပြောင်းသွားမှာပါ။
      tool ပြောင်းလည်း မှန်နေမယ့် အချက် သုံးခု ရှိပါတယ်။ [[mark:p1]] ပထမ အချက်က app ကြီးလာလေ၊ ကြာကြာ သုံးလေ စနစ်
      ပိုလိုလေ ဆိုတာပါ။ ဆိုင်ရဲ့ birthday poster လို တစ်ညတည်း သုံးမယ့် အလုပ်ကို ပြော၊ ထွက်လာတာ လက်ခံ၊ code မဖတ်ဘဲ
      ဆက်သွားတဲ့ vibe coding နဲ့ လုပ်လို့ ရပါတယ်။ ကြိုမှာ app ကတော့ customer တွေရဲ့ အော်ဒါနဲ့ ဖုန်းနံပါတ်ကို
      နေ့တိုင်း ကိုင်ပါတယ်။ spec၊ test၊ rule နဲ့ လူ့ review တွေ ရှိလို့သာ ပြင်ရင်း ဆက်တိုးလို့ ရနေတာပါ။
      [[mark:p2]] ဒုတိယ အချက်က AI က ကိုယ့် အလေ့အထကို အသံချဲ့စက်လို ချဲ့ပေးတယ် ဆိုတာပါ။ အသံချဲ့စက်က ကောင်းတဲ့
      အသံရော ဆိုးတဲ့ အသံရော ကျယ်အောင် လုပ်သလို၊ rule ဖိုင် ရှင်းပြီး test ရှိတဲ့ project မှာ agent က ကောင်းတာကို
      ပိုများအောင် ထုတ်ပေးပြီး၊ ရှုပ်ပွနေတဲ့ project မှာတော့ ရှုပ်တာကိုပဲ ပိုမြန်မြန် ပွားပေးပါတယ်။ [[mark:p3]]
      တတိယ အချက်က agent က code ရေးပေးလာတော့ ကိုယ့်အလုပ် နည်းသွားတာ မဟုတ်ဘဲ တခြား နေရာကို ရွှေ့သွားတာပါ။
      [[mark:p3-list]] ဒီ course မှာ ကိုယ် အချိန်ပေးခဲ့တာတွေကို ပြန်ကြည့်ပါ။ မြမြ နဲ့အတူ ဘာဆောက်မလဲ ဆုံးဖြတ်တာ၊
      spec မှာ တိတိကျကျ ရေးတာ၊ agent ထုတ်ပေးတာကို စစ်တာ၊ agent တွေ အလုပ်လုပ်မယ့် factory ကို ဒီဇိုင်းဆွဲတာတွေပါ။
      code ရိုက်တာ မပါပါဘူး။
    sources:
      - {
          title: "The New SDLC (Burmese edition): Conclusion",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "The New SDLC (Burmese edition): Where to start",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "DORA: 2025 State of AI-assisted Software Development (AI as an amplifier)",
          url: "https://research.google/pubs/dora-2025-state-of-ai-assisted-software-development-report/",
        }
    actions:
      - {
          id: draw-p-title,
          type: whiteboard.apply,
          at: { mark: p-title },
          clear: true,
          upsertIds: [p-title],
        }
      - {
