      ဒါဆို ပြန်ချုပ်ရရင်၊ ပထမဆုံး lesson မှာ build ကို agent က မြန်မြန် လုပ်ပေးနိုင်ပေမယ့်၊ intent နဲ့
      verification ကတော့ ကိုယ့်အလုပ်ပါ လို့ notes ထဲမှာ မှတ်ခဲ့ပါတယ်။ ဆိုလိုတာက ဘာဆောက်မလဲ၊ ဘာက မှန်လဲ
      ဆုံးဖြတ်တာနဲ့၊ ထွက်လာတာ မှန်မမှန် စစ်တာပါ။ course တစ်လျှောက် ကြိုမှာ app အတွက် အဲဒီ အလုပ်ကို ကိုယ်တိုင်
      လုပ်ခဲ့ပြီးပါပြီ။ agent တွေ ဘယ်လောက်ပဲ ပြောင်းလာပါစေ၊ ဒီ အလုပ်က ကိုယ့်လက်ထဲမှာပဲ ရှိနေမှာပါ။
      [[mark:rc-problem]] ကိုယ့် project ကို ပြဿနာ တစ်ကြောင်းကနေ စပါ။ [[mark:rc-small]] task သေးသေးလေး တစ်ခု၊ user
