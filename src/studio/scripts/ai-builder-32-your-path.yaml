        # Decisions

        ## ADR-001 · v1 မှာ ငွေကို ကောင်တာမှာပဲ ချေမယ် (2026-11-08)
        Context — online ငွေပေးချေမှုက risk အများဆုံး၊ ကုန်ကျစရိတ် အများဆုံး။ ကောင်တာမှာ ချေတာ အခုလည်း အလုပ်ဖြစ်နေတယ်။
        Options — online ငွေပေးချေမှု ထည့်မယ် / ကောင်တာမှာပဲ ချေမယ်
        Decision — ကောင်တာမှာပဲ ချေမယ်။
        Consequences — လာမယူတဲ့ အော်ဒါ ရှိနိုင်တယ်။ တစ်မနက် 5 ခုထက် များရင် ပြန်စဉ်းစားမယ်။

        ## ADR-002 · database ကို ကိုယ်တိုင် မ run ဘဲ managed service သုံးမယ် (2026-11-08)
        Context — ကိုယ်တစ်ယောက်တည်း၊ server ထိန်းဖို့ အချိန် မရှိဘူး။
        Options — ကိုယ်ပိုင် server ပေါ်မှာ run မယ် / managed database service သုံးမယ်
        Decision — managed service ရဲ့ free tier ကို သုံးမယ်။
        Consequences — service ကို မှီခိုရမယ်။ backup နဲ့ export လုပ်လို့ရတာ စစ်ထားရမယ်။

        ## ADR-003 · menu ပြင်ဖို့ admin စာမျက်နှာ မဆောက်ဘူး (2026-11-08)
        Context — menu ကို တစ်နှစ်မှာ အနည်းငယ်ပဲ ပြင်တယ်။
        Decision — menu file ကို ပြင်ပြီး ပြန်တင်မယ်။
        Consequences — မြမြ ကိုယ်တိုင် မပြင်နိုင်ဘူး။ တစ်လ တစ်ခါထက် ပိုပြင်ရရင် ပြန်စဉ်းစားမယ်။
