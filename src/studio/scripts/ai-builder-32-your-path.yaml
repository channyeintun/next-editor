  - id: fundamentals
    narration: >
      [[mark:k-title]] ဒီ အလုပ်တွေကို ဆက်လုပ်နိုင်ဖို့ အခြေခံတွေကို ဆက်သင်ရပါမယ်။ code ကို ကိုယ်တိုင် ရေးတတ်ဖို့
      မလိုပေမယ့်၊ agent ထုတ်ပေးတာ မှန်မမှန် ဆုံးဖြတ်နိုင်လောက်အောင်တော့ ဖတ်တတ်ရပါမယ်။ [[mark:k-code]] code ဘက်မှာ
      ဘာပြောင်းသွားလဲ ပြတဲ့ diff ကို ကြည့်ပြီး၊ ဖိုင် ဘယ်နှခု ထိလဲ၊ မခိုင်းတာ ပါနေလား သိရုံ ဖတ်တတ်ရင်
      လုံလောက်ပါတယ်။ [[mark:k-data]] data ဘက်မှာ ဘာသိမ်းလဲ၊ ဘယ်လောက် ကြာကြာ သိမ်းလဲ၊ ဘယ်သူ မြင်ရလဲ ဆိုတာ သိရပါမယ်။
      [[mark:k-sys]] system ဘက်မှာတော့ screen၊ server၊ database ဘယ်လို ချိတ်လဲ၊ rule တွေကို ဘယ်မှာ စစ်လဲ
      နားလည်ရပါမယ်။ ဒါတွေ ရှိမှ agent က သေချာသလို ထုတ်ပေးတဲ့ အဖြေ မှားနေတာကို ကိုယ် ရှာတွေ့နိုင်ပါတယ်။
      [[mark:k-more]] ပိုနက်နက် သင်ချင်ရင် Testing course နဲ့ AI course မှာ ဆက်လေ့လာနိုင်ပါတယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): Where to start",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: draw-k-title,
          type: whiteboard.apply,
          at: { mark: k-title },
          clear: true,
          upsertIds: [k-title],
        }
      - {
          id: draw-k-code,
          type: whiteboard.apply,
          at: { mark: k-code },
          upsertIds: [k-code],
          drawMs: 900,
        }
      - {
          id: draw-k-data,
          type: whiteboard.apply,
          at: { mark: k-data },
          upsertIds: [k-data],
          drawMs: 900,
        }
      - {
          id: draw-k-sys,
          type: whiteboard.apply,
          at: { mark: k-sys },
          upsertIds: [k-sys],
          drawMs: 900,
        }
      - {
          id: draw-k-more,
          type: whiteboard.apply,
          at: { mark: k-more },
          upsertIds: [k-more],
          drawMs: 900,
        }

  - id: quiz
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ ကိုယ့်မှာ app idea တစ်ခု ရှိတယ် ဆိုပါစို့။ ဥပမာ သူငယ်ချင်းရဲ့
      အပ်ချုပ်ဆိုင်အတွက် ချိန်းဆိုတဲ့ app ပါ။ ဒီ course ထဲက document တွေထဲမှာ ဘာကို အရင်ဆုံး ရေးမလဲ။ agent ဖတ်ဖို့
      AGENTS.md လား၊ problem statement လား။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]]
      အဖြေကတော့ problem statement ပါ။ ဘာကြောင့်လဲဆိုတော့ ကျန်တဲ့ document အားလုံးက အဲဒီကနေ စလို့ပါ။ ဘယ်သူ့
      ပြဿနာလဲ၊ ပြေပြီလား ဘယ်လို သိမလဲ မရေးဘဲ AGENTS.md ကို အရင် ရေးရင်၊ ဘာဆောက်ရမလဲ မသိဘဲ ဘယ်လို ဆောက်ရမလဲ
      ပြောနေသလို ဖြစ်ပါတယ်။ ကြိုမှာ app လည်း menu နဲ့ cart ကနေ မစဘဲ၊ မနက်ခင်း တန်းစီရတဲ့ ပြဿနာကနေ စခဲ့ပါတယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): Where to start",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "GOV.UK Service Manual: How the discovery phase works",
          url: "https://www.gov.uk/service-manual/agile-delivery/how-the-discovery-phase-works",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          clear: true,
          upsertIds: [z-title, z-q, z-o1, z-o2],
          drawMs: 1800,
        }
      - {
          id: draw-quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [z-a, z-a-note],
          drawMs: 1400,
        }

  - id: plan-problem
    chapter: ကိုယ့် ပထမ project ရဲ့ plan
    narration: >
      [[mark:close-quiz]] ဒါဆို ကိုယ်ပိုင် project ရဲ့ plan ကို ရေးကြည့်ရအောင်။ ဒီ template မှာ course ထဲက
      အဆင့်တွေကို အစဉ်လိုက် ခေါင်းစဉ် လုပ်ထားပြီး၊ ခေါင်းစဉ် တစ်ခုစီအောက်မှာ ဘာဖြည့်ရမလဲ ဆိုတာကို တိုတိုပဲ
      ရေးပါမယ်။ ဘယ်ဘက်က ဆိုင်ရဲ့ ဖိုင်တွေကိုလည်း ဥပမာ အဖြစ် ဖွင့်ကြည့်ပြီး ပုံစံ ယူလို့ ရပါတယ်။ [[mark:type-p1]]
      ပထမ အပိုင်း သုံးခုက problem ဖိုင်ကနေ လာတာပါ။ ပြဿနာကို ဖြေရှင်းနည်း မပါဘဲ ရေးခိုင်းပြီး၊ user တွေကိုလည်း
      အုပ်စုနဲ့တင် မရပ်ဘဲ၊ member အောင်အောင် နဲ့ ကျောင်းသား မောင်မောင် လို တကယ့် လူ တစ်ယောက်စီကို မှတ်ခိုင်းပါတယ်။
      [[mark:sel-know]] ပြေပြီလား ဘယ်လို သိမလဲ ဆိုတာကိုလည်း ship မလုပ်ခင် ရေးခိုင်းထားပါတယ်။ ship ပြီးမှ ရေးရင်
      ရလာတဲ့ ကိန်းဂဏန်းနဲ့ ကိုက်အောင် ပန်းတိုင်ကို ပြန်ရွေးမိနိုင်လို့ပါ။ ပြီးခဲ့တဲ့ lesson မှာလည်း ကြိုရေးထားတဲ့
      ပန်းတိုင် ရှိလို့သာ မရောက်သေးတာကို ရိုးရိုးသားသား မြင်ခဲ့ရတာပါ။
    sources:
      - {
          title: "GOV.UK Service Manual: How the discovery phase works",
          url: "https://www.gov.uk/service-manual/agile-delivery/how-the-discovery-phase-works",
        }
      - {
          title: "GOV.UK Service Manual: How to set performance metrics for your service",
          url: "https://www.gov.uk/service-manual/measuring-success/how-to-set-performance-metrics-for-your-service",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: close-quiz }, open: false }
      - id: type-p1
        type: editor.type
        at: { mark: type-p1 }
        target: { file: my-plan.md, after: "# My plan · ကိုယ့် ပထမ project\n\n", occurrence: 1 }
        text: "## Problem\n- ဘယ်သူ့မှာ၊ ဘယ်အချိန်မှာ၊ ဘာ ပြဿနာ ရှိလဲ — app ဆိုတဲ့ စကားလုံး မပါဘဲ တစ်ကြောင်း\n\n## Who\n- user အုပ်စု တစ်ခုစီနဲ့ အဲဒီထဲက တကယ့် လူ တစ်ယောက်စီ\n\n## How we'll know\n- ship မလုပ်ခင် ရေးထားတဲ့ ကိန်းဂဏန်း 2 ခု 3 ခု\n\n"
        cadence: line-by-line
      - {
          id: expect-p1,
          type: expect.file,
          at: { afterAction: type-p1 },
          path: my-plan.md,
          contains: "- ဘယ်သူ့မှာ၊ ဘယ်အချိန်မှာ၊ ဘာ ပြဿနာ ရှိလဲ — app ဆိုတဲ့ စကားလုံး မပါဘဲ တစ်ကြောင်း",
        }
      - {
          id: sel-know,
          type: editor.select,
          at: { mark: sel-know },
          target: { file: my-plan.md, text: "- ship မလုပ်ခင် ရေးထားတဲ့ ကိန်းဂဏန်း 2 ခု 3 ခု", occurrence: 1 },
        }

  - id: plan-scope
    narration: >
      [[mark:type-p2]] နောက် အပိုင်း နှစ်ခုက ဘာလုပ်မလဲ၊ ဘာမလုပ်ဘူးလဲ နဲ့ ပြီးပြီ ဆိုတာကို ဘယ်လို စစ်မလဲ ဆိုတာပါ။
      [[mark:sel-must]] မဖြစ်မနေ လုပ်ရမယ့်အရာကို သုံးခုထက် မပိုအောင် ကန့်ထားပါတယ်။ ပထမ project မှာ အကုန် တစ်ခါတည်း
      ထည့်ချင်စိတ် ဖြစ်တတ်ပေမယ့်၊ ပြဿနာ ပြေမပြေ စမ်းနိုင်တဲ့ အသေးဆုံး version က ပိုမြန်မြန် သင်ခွင့် ပေးပါတယ်။
      ကျန်တာ အားလုံးကိုတော့ ဒီတစ်ခါ မလုပ်ဘူး ဆိုတဲ့ အောက်မှာ ရေးထားပါ။ ပြီးတော့ မဖြစ်မနေ တစ်ခုစီကို AC တစ်ခုစီနဲ့
      စစ်လို့ရအောင် ရေးပါ။ ဆိုင်ရဲ့ app မှာလည်း AC နဲ့ စစ်ခဲ့လို့ သုည ခွက် အော်ဒါလို အမှားကို customer မသုံးခင်
      တွေ့ခဲ့တာပါ။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The new SDLC",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - id: type-p2
        type: editor.type
        at: { mark: type-p2 }
        target: { file: my-plan.md, after: "ကိန်းဂဏန်း 2 ခု 3 ခု\n\n", occurrence: 1 }
        text: "## Must / Won't\n- Must — 3 ခုထက် မပို\n- Won't (for now) — ကျန်တာ အားလုံး\n\n## Acceptance criteria\n- Must တစ်ခုစီအတွက် Given / When / Then တစ်ခု\n\n"
        cadence: line-by-line
      - {
          id: sel-must,
          type: editor.select,
          at: { mark: sel-must },
          target: { file: my-plan.md, text: "- Must — 3 ခုထက် မပို", occurrence: 1 },
        }

  - id: plan-agent
    narration: >
      [[mark:type-p3]] ဒီနောက်မှ agent အတွက် အပိုင်းတွေ လာပါတယ်။ AGENTS.md ကို ဆယ်ကြောင်းလောက်နဲ့ပဲ
      စခိုင်းထားပါတယ်။ ဆိုင်ရဲ့ AGENTS.md ကို စခဲ့တုန်းကလို အပိုင်း လေးခုလောက်နဲ့ စရင် လုံလောက်ပါတယ်။
      [[mark:sel-rule]] အရေးကြီးတာက ဒီ စာကြောင်းပါ။ agent က တစ်ခုခု မှားတိုင်း chat ထဲမှာ ထပ်ပြောနေမယ့်အစား rule
      တစ်ကြောင်း ထည့်ရင်၊ ဖိုင်က ကိုယ့် project နဲ့အတူ တဖြည်းဖြည်း ကြီးလာပြီး အမှား တစ်ခုကို နှစ်ခါ ကြုံရတာ
      နည်းသွားပါမယ်။ [[mark:sel-first]] ပထမ task ကိုလည်း သေးသေးလေးပဲ ရွေးပါ။ ကိုယ် ထပ်ခါထပ်ခါ လုပ်နေရတဲ့ အလုပ်
      တစ်ခု၊ ဒါမှမဟုတ် screen ကနေ data အထိ တစ်လမ်းလုံး အလုပ်လုပ်တဲ့ အပိုင်း အသေးဆုံး တစ်ခုပါ။ ဆိုင်ရဲ့ app မှာလည်း
      ပထမ task က form ကနေ အော်ဒါ တစ်ခု သိမ်းရုံပဲ ဖြစ်ခဲ့ပါတယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): Where to start",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - { title: "AGENTS.md (an open format for guiding coding agents)", url: "https://agents.md/" }
    actions:
      - id: type-p3
        type: editor.type
        at: { mark: type-p3 }
        target: { file: my-plan.md, after: "Given / When / Then တစ်ခု\n\n", occurrence: 1 }
        text: "## AGENTS.md (10 lines)\n- Project · Stack · Rules · Done means\n- agent မှားတိုင်း rule တစ်ကြောင်း ထပ်ထည့်\n\n## First task\n- ထပ်ခါထပ်ခါ လုပ်နေရတဲ့ အလုပ် တစ်ခု၊ ဒါမှမဟုတ် screen ကနေ data အထိ အသေးဆုံး slice တစ်ခု\n\n"
        cadence: line-by-line
      - {
          id: sel-rule,
          type: editor.select,
          at: { mark: sel-rule },
          target: { file: my-plan.md, text: "- agent မှားတိုင်း rule တစ်ကြောင်း ထပ်ထည့်", occurrence: 1 },
        }
      - {
          id: sel-first,
          type: editor.select,
          at: { mark: sel-first },
          target: { file: my-plan.md, text: "## First task", occurrence: 1 },
        }

  - id: plan-check
    narration: >
      [[mark:type-p4]] နောက်ဆုံး အပိုင်း နှစ်ခုက စစ်တဲ့ အလုပ်ပါ။ agent က ပြီးပြီလို့ ပြောတိုင်း AC တစ်ခုချင်းကို
      ကိုယ်တိုင် စမ်းပြီး ရလဒ်ကို ရေးထားခိုင်းပါတယ်။ ပြီးတယ် ဆိုတာကို agent ရဲ့ စကားနဲ့ မဟုတ်ဘဲ ကိုယ့် မျက်စိနဲ့
      ဆုံးဖြတ်တာပါ။ [[mark:sel-review]] ပြီးတော့ ကိုယ့် အလုပ်ကို ကြည့်ပေးမယ့် လူတွေကို ရှာပါ။ code ဖတ်တတ်တဲ့ လူ
      တစ်ယောက်က ကိုယ် မမြင်တာကို မြင်နိုင်ပြီး၊ တကယ် သုံးမယ့် user နှစ်ယောက် သုံးယောက်ကတော့ ကြိုမှာ app မှာ လှလှ
      နဲ့ customer တွေ လုပ်ပေးခဲ့သလို app ကို နေ့စဉ် အလုပ်ထဲမှာ တကယ် စမ်းပေးပါလိမ့်မယ်။ ပထမ product ကို တကယ့် လူ
      အနည်းငယ်အတွက်ပဲ ဆောက်ပြီး၊ ship လုပ်၊ တိုင်း၊ သင်ယူတဲ့ loop ကို တစ်ခေါက် ပတ်ကြည့်ပါ။
    sources:
      - {
          title: "The New SDLC (Burmese edition): Where to start",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "The New SDLC (Burmese edition): Conclusion",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - id: type-p4
        type: editor.type
        at: { mark: type-p4 }
        target: { file: my-plan.md, after: "အသေးဆုံး slice တစ်ခု\n\n", occurrence: 1 }
