# CSS course (Burmese), lesson 20 of 43: grid part 3, areas and subgrid.
#
# Narration is Burmese (voice-script.md next to this file is its source; the
# English draft is probe/english-draft.yaml.bak). Every [[mark:…]] sits where its action
# begins, at a sentence end; each span carries one piece of meaning.
# Everything the learner sees (title, chapters, whiteboard labels, UI strings)
# is Burmese already.
#
# Shape: board (recall 18–19; the page drawn as a map of named areas) → code
# tour (one .layout wrapper, four direct children; two drink cards whose
# descriptions differ by lines; the coming-soon box; empty styles.css) →
# .layout display grid, 1fr 1fr, gap (auto placement squeezes the header into
# half a row) → grid-template-areas typed as three strings (nothing moves: no
# item has a name yet) → grid-area names (every part moves to its area; scroll
# to the footer) → board (equal cell counts; rectangles only; an L-shaped
# area makes the whole declaration skipped) → a later areas declaration with
# a dot (the footer takes half a row, the other cell stays empty) → the
# original map again → @media (width < 40em) with a one-column map (the old
# two columns leave the right half empty) → grid-template-columns: 1fr (full
# width) → board (grid-template shorthand; grid resets what it omits) →
# drinks list 1fr 1fr with a column gap (cards stretch to one height, prices
# at different heights) → card display grid + span 3 + subgrid rows (titles,
# descriptions and prices line up) → board (the parent's row lines run
# through both cards; columns or both; display: contents caveat) → board
# (inline axis = justify, block axis = align; -items / -self / -content;
# place-*) → the coming-soon box: display grid (rows share the height, the
# label stretches both ways) → place-content center → align-content
# space-between → justify-items center → .soon .label justify-self start →
# quiz board + recap, hand-off to logical properties (lesson 21).
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set(; no postcss config; no reload.
# Every prefix of an area name is itself a valid name ("h", "he" …) that
# matches no area and would throw the item into implicit tracks, so the
# grid-area rules and every areas declaration typed AFTER the names exist are
# revealed whole (line-by-line, each line complete and valid). The first,
# three-line map is typed while no item has a name, so its partial states
# change nothing. The media query's map sits on one line for the same reason.
# Keystroke-typed values have no misleading valid prefix ("display: g…",
# "1f", "span", "s…", "cente", "space-" are invalid until complete).
#
# Measured in headless Chrome at 432 × 720 (probe/stages.ts): start 4 parts
# stacked 400 wide → layout 1fr 1fr: header 194 wide in the left cell, drinks
# right, hours left, footer right → areas: unchanged → names: header 400 wide
# at the top, drinks | hours 194 each (row 449 tall), footer 400 wide at
# y 732 → dot: footer 194 → restore 400 → media map: every part 194 wide in
# the left column → columns 1fr: 400 wide → drinks list 1fr 1fr: cards 182
# wide, both 156 tall, prices at y 381 and 432 → subgrid: both prices at
# y 436 → soon grid: label 348 × 85 (stretched) → place-content: label and
# note 161 wide, centred → space-between: label at the top, note at the
# bottom → justify-items: label 68 wide, centred → justify-self start: label
# at the track's start (x 135, the note's left edge).
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
