build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 4120

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  - id: areas-intro
    chapter: "Page ကို area တွေနဲ့ ဆွဲကြည့်ရအောင်"
    narration: >
      ပြီးခဲ့တဲ့ lesson နှစ်ခုမှာ track တွေရဲ့ အရွယ်အစား ပေးပြီး၊ item တွေကို line နံပါတ်နဲ့
      နေရာချခဲ့ပါတယ်။ ဒါပေမဲ့ page တစ်ခုလုံးကို line နံပါတ်တွေနဲ့ ချရင် ဖတ်ရ ခက်ပါတယ်။
      [[mark:start-server]] ဒီလို ပြောနေတုန်းမှာပဲ၊ board နောက်မှာ dev server ကို စ နေပါပြီ။
      [[mark:draw-area-map]] ဒီ lesson မှာတော့ page ရဲ့ အပိုင်း တစ်ခုစီကို နာမည် ပေးပြီး၊ အဲဒီ နာမည်တွေနဲ့
      layout ကို ပုံဆွဲသလို ရေးကြည့်ပါမယ်။ header က အပေါ်မှာ တစ်တန်းလုံး ယူပြီး၊ menu နဲ့ hours က
      ဘေးချင်းကပ် ရှိပါမယ်။ footer ကတော့ အောက်ဆုံးမှာ တစ်တန်းလုံး ယူပါမယ်။ [[mark:draw-topics]] အဲဒီနောက်
      card နှစ်ခုရဲ့ အထဲက အပိုင်းတွေကို subgrid နဲ့ တန်းညီအောင် လုပ်ပြီး၊ grid ထဲက item တွေနဲ့ track
      တွေကို ရွှေ့ပေးတဲ့ alignment နဲ့ အဆုံးသတ်ပါမယ်။
    sources:
      - title: "web.dev Learn CSS — Grid: grid template areas"
        url: "https://web.dev/learn/css/grid#grid_template_areas"
      - title: "MDN — grid-template-areas"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/grid-template-areas"
      - title: "MDN — Grid template areas"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_grid_layout/Grid_template_areas"
    actions:
      - id: open-intro-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      # Runs in the background (boot + pnpm install + spawn); waitForReady sits
      # on the preview mark in the code tour, well over 40 s of narration later.
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 45000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-area-map
        type: whiteboard.apply
        at: { mark: draw-area-map }
        upsertIds:
          [
            a-frame,
            a-header,
            a-header-l,
            a-menu,
            a-menu-l,
            a-hours,
            a-hours-l,
            a-footer,
            a-footer-l,
          ]
        drawMs: 4000
      - id: draw-topics
        type: whiteboard.apply
        at: { mark: draw-topics }
        upsertIds: [a-t1, a-t2, a-t3]
        drawMs: 2000

  - id: code-tour
    narration: >
      [[mark:close-intro]] project ကို ကြည့်ရအောင်။ [[mark:open-index]] ဒါက page ရဲ့ HTML ဖိုင်ပါ။
      [[mark:select-layout]] ဒီ wrapper element ထဲမှာ page တစ်ခုလုံး ရှိပါတယ်။ သူ့ရဲ့ တိုက်ရိုက် child
      လေးခုက header၊ သောက်စရာ အပိုင်း၊ ဖွင့်ချိန် အပိုင်းနဲ့ footer ဖြစ်ပြီး၊ ဒီ lesson မှာ နေရာချမယ့်
      အပိုင်းတွေက သူတို့ပါ။ [[mark:select-desc]] သောက်စရာ အပိုင်းမှာ card နှစ်ခု ပါပါတယ်။ ဒီ card ရဲ့
      ဖော်ပြချက်က တော်တော် ရှည်ပေမယ့်၊ ကျန်တဲ့ card ရဲ့ ဖော်ပြချက်ကတော့ စကားလုံး တစ်လုံးတည်းပါ။ ဒီ
      ကွာခြားချက်က နောက်မှ အရေးပါလာပါမယ်။ [[mark:select-soon]] ဖွင့်ချိန် အပိုင်းထဲမှာတော့ မကြာမီ လို့
      ရေးထားတဲ့ box သေးသေးလေး တစ်ခု ရှိပြီး၊ alignment ကို သူ့ပေါ်မှာ စမ်းပါမယ်။ [[mark:open-styles]]
      ကိုယ့် CSS ဖိုင်က အလွတ်ပါ။ base ဖိုင်ကတော့ အပိုင်း တစ်ခုစီကို အရောင်နဲ့ ထောင့်ဝိုင်း ပေးထားပြီး၊
      မကြာမီ box ကို အမြင့် ပုံသေ ပေးထားပါတယ်။ [[mark:preview-opens]] preview ပွင့်လာပါပြီ။ layout
      မပေးရသေးလို့ အပိုင်းတွေက flow layout အတိုင်း တစ်ခုအောက် တစ်ခု ဆင့်နေပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Grid"
        url: "https://web.dev/learn/css/grid"
      - title: "MDN — Basic concepts of grid layout (grid items are the direct children)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_grid_layout/Basic_concepts_of_grid_layout"
    actions:
      - id: close-intro-board
        type: whiteboard.apply
        at: { mark: close-intro }
        open: false
      - id: open-index
        type: workspace.openFile
        at: { mark: open-index }
        path: index.html
      - id: select-layout
        type: editor.select
        at: { mark: select-layout }
        target:
          { file: index.html, text: '<div class="layout" data-testid="layout">', occurrence: 1 }
      - id: select-desc
        type: editor.select
        at: { mark: select-desc }
        target:
          {
            file: index.html,
            text: '<p class="desc">ရေခဲမုန့်၊ ပူတင်း၊ နို့အေးနဲ့ ရောထားတဲ့ ချိုချို အအေး တစ်ခွက်</p>',
            occurrence: 1,
          }
      - id: select-soon
        type: editor.select
        at: { mark: select-soon }
        target: { file: index.html, text: '<div class="soon" data-testid="soon">', occurrence: 1 }
      - id: open-styles
        type: workspace.openFile
        at: { mark: open-styles }
        path: styles.css
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { mark: preview-opens }
        timeoutMs: 20000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-dev-server }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-layout
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: layout }
        textContains: "ဖာလူဒါ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-soon
        type: expect.preview
        at: { afterAction: expect-layout }
        timeoutMs: 5000
        target: { by: testId, value: soon-label }
        textContains: "မကြာမီ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: collapse-runner-dock
        type: runtime.collapseDock
        at: { afterAction: expect-soon }

  - id: auto-first
    narration: >
      [[mark:type-layout]] ပထမဆုံး wrapper ကို grid container လုပ်ပါမယ်။ lesson 18 မှာလိုပဲ 1 fr စီ ရတဲ့
      column နှစ်ခု ပေးပြီး၊ track တွေကြားမှာ gap ထည့်ပါမယ်။ ဒါဆို wrapper ရဲ့ child လေးခုက grid item တွေ
      ဖြစ်သွားပါတယ်။ [[mark:after-layout]] preview ကို ကြည့်ပါ။ နေရာ မပေးထားတဲ့ item တွေကို auto placement
      က HTML အစဉ်အတိုင်း row တစ်ခုမှာ နှစ်ခုစီ ထည့်လို့၊ header က ဘယ်ဘက် တစ်ဝက်ထဲမှာ ကျဉ်းနေပြီး footer က
      ဖွင့်ချိန် အပိုင်းရဲ့ ဘေးကို ရောက်နေပါတယ်။ [[mark:explain-auto]] ဒါက ကိုယ် လိုချင်တဲ့ page
      မဟုတ်ပါဘူး။ line နံပါတ်နဲ့ နေရာချလို့ ရပေမယ့်၊ ပိုရှင်းတဲ့ နည်းက map တစ်ခု ဆွဲတာပါ။
    sources:
      - title: "web.dev Learn CSS — Grid: auto-placement"
        url: "https://web.dev/learn/css/grid#auto-placement"
      - title: "MDN — Auto-placement in grid layout"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_grid_layout/Auto-placement_in_grid_layout"
    actions:
      - id: type-layout
        type: editor.type
        at: { mark: type-layout }
        cadence: fast-explainer
        target: { file: styles.css, after: "", occurrence: 1 }
        text: ".layout {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 12px;\n}\n"
      - id: expect-layout-grid
        type: expect.preview
        at: { mark: after-layout }
        timeoutMs: 4000
        target: { by: testId, value: footer }
        textContains: "ဗဟန်း"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: template-areas
    narration: >
      [[mark:type-areas]] map ကို grid template areas ဆိုတဲ့ property နဲ့ ရေးပါတယ်။ area တွေကို
      နာမည်ပေးပြီး layout ကို ပုံဆွဲသလို ရေးတာပါ။ quote ထဲမှာ ရေးတဲ့ စာသားကို string လို့ ခေါ်ပါတယ်။
      string တစ်ခုက row တစ်ခု၊ သူ့ထဲက စကားလုံး တစ်လုံးက cell တစ်ကွက်ပါ။ [[mark:after-areas]] ဘာမှ
      မရွေ့သေးပါဘူး။ map ရှိနေပေမယ့် item တွေမှာ area နာမည် မပေးရသေးလို့၊ auto placement က အကွက်တွေကို
      အစဉ်အတိုင်း ဆက်ဖြည့်နေတုန်းပါ။ [[mark:select-areas]] ဒီ string သုံးခုကို ကြည့်ပါ။ အပေါ်မှာ header
      cell နှစ်ကွက်၊ ပြီးရင် menu နဲ့ hours၊ အောက်မှာ footer cell နှစ်ကွက် ရှိပါတယ်။ ဘေးချင်းကပ် cell တွေက
      နာမည် တူရင် area တစ်ခုတည်း ဖြစ်သွားလို့၊ header က column နှစ်ခုလုံးကို ယူပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Grid: grid template areas"
        url: "https://web.dev/learn/css/grid#grid_template_areas"
      - title: "MDN — grid-template-areas"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/grid-template-areas"
      - title: "CSS Grid Layout Module Level 2 — named areas: grid-template-areas"
        url: "https://drafts.csswg.org/css-grid/#grid-template-areas-property"
    actions:
      # Typed while no item has a name: its partial states change nothing.
      - id: type-areas
        type: editor.type
        at: { mark: type-areas }
        cadence: line-by-line
        target: { file: styles.css, after: "  gap: 12px;\n", occurrence: 1 }
        text: "  grid-template-areas:\n    \"header header\"\n    \"menu hours\"\n    \"footer footer\";\n"
      - id: select-areas
        type: editor.select
        at: { mark: select-areas }
        target:
          {
            file: styles.css,
            text: "\"header header\"\n    \"menu hours\"\n    \"footer footer\"",
            occurrence: 1,
          }

  - id: area-names
    narration: >
      [[mark:type-names]] ဒါဆို item တွေကို နာမည် ပေးရအောင်။ အပိုင်း တစ်ခုစီကို grid area နဲ့ map ထဲက
      နာမည် ပေးပါမယ်။ header၊ menu၊ hours နဲ့ footer ပါ။ [[mark:after-names]] အခု အပိုင်းတိုင်း သူ့ area
      ကို ရောက်သွားပါပြီ။ header က အပေါ်မှာ တစ်တန်းလုံး ယူပြီး၊ သူ့အောက်မှာ menu နဲ့ hours က ဘေးချင်းကပ်
      ရှိနေပါတယ်။ [[mark:scroll-footer]] အောက်ဘက်မှာတော့ footer က တစ်တန်းလုံး ယူထားပါတယ်။
      [[mark:select-grid-area]] ဒီ grid area declaration ကို ကြည့်ပါ။ နာမည်ကို quote မပါဘဲ ရေးရပြီး၊ map
      ထဲက စကားလုံး တစ်လုံးနဲ့ တူရပါမယ်။ class နဲ့တော့ တူစရာ မလိုပါဘူး။ ဥပမာ သောက်စရာ အပိုင်းကို menu လို့
      နာမည် ပေးထားပါတယ်။ [[mark:explain-placed]] နာမည် ပါတဲ့ item ကို တမင် နေရာချထားတာမို့၊ auto placement
      က သူ့ကို မရွှေ့ပါဘူး။ grid area မှာ နာမည် အစား line နံပါတ် လေးခုလည်း ပေးလို့ ရပါတယ်။ သူက lesson 19 က
      grid row နဲ့ grid column ကို ပေါင်းထားတဲ့ shorthand ပါ။ row အစ၊ column အစ၊ row အဆုံး၊ column အဆုံး
      အစဉ်နဲ့ ရေးပါတယ်။
    sources:
      - title: "MDN — grid-area"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/grid-area"
      - title: "web.dev Learn CSS — Grid: grid template areas"
        url: "https://web.dev/learn/css/grid#grid_template_areas"
      - title: "CSS Grid Layout Module Level 2 — placement shorthands: grid-area"
        url: "https://drafts.csswg.org/css-grid/#propdef-grid-area"
    actions:
      # Revealed line by line: every line is a complete, valid rule (a half-typed
      # name would match no area and throw the item into implicit tracks).
      - id: type-names
        type: editor.type
        at: { mark: type-names }
        cadence: line-by-line
        target: { file: styles.css, after: "    \"footer footer\";\n}\n", occurrence: 1 }
        text: "\n.site-header { grid-area: header; }\n.drinks { grid-area: menu; }\n.hours { grid-area: hours; }\n.site-footer { grid-area: footer; }\n"
      - id: expect-names
        type: expect.preview
        at: { mark: after-names }
        timeoutMs: 4000
        target: { by: testId, value: site-header }
        textContains: "ရွှေလက်ဖက်ရည်ဆိုင်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: scroll-footer
        type: preview.scroll
        at: { mark: scroll-footer }
        timeoutMs: 5000
        top: 200
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: select-grid-area
        type: editor.select
        at: { mark: select-grid-area }
        target: { file: styles.css, text: ".drinks { grid-area: menu; }", occurrence: 1 }

  - id: areas-rules
    chapter: "Template area ရဲ့ စည်းမျဉ်းတွေ"
    narration: >
      [[mark:open-rules]] စည်းမျဉ်း နှစ်ခု ရှိပါတယ်။ [[mark:draw-rule-count]] ပထမ၊ row string တိုင်းမှာ
      cell အရေအတွက် တူရပါမယ်။ ဒါမှ grid တစ်ခုလုံးက လေးထောင့် အပြည့် ဖြစ်မှာပါ။ [[mark:draw-rule-rect]]
      ဒုတိယ၊ နာမည် တစ်ခုရဲ့ area က လေးထောင့် တစ်ခု ဖြစ်ရပါမယ်။ [[mark:draw-l-shape]] ဥပမာ ဒီ map မှာ menu
      က အလယ် row ရဲ့ ဘယ်ဘက် cell နဲ့ အောက်ဆုံး row ရဲ့ cell နှစ်ကွက်လုံးကို ယူထားပါတယ်။ ဒါက လေးထောင့်
      မဟုတ်ဘဲ L ပုံ ဖြစ်နေပါတယ်။ [[mark:draw-l-cross]] စည်းမျဉ်း တစ်ခုခုနဲ့ မကိုက်ရင်၊ browser က မှားတဲ့
      row တစ်ခုတည်းကို မဟုတ်ဘဲ grid template areas declaration တစ်ခုလုံးကို ကျော်သွားပါတယ်။ ဒါကြောင့် grid
      က အဲဒီ declaration မရှိသလိုပဲ ဖြစ်နေပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Grid: grid template areas (rules)"
        url: "https://web.dev/learn/css/grid#grid_template_areas"
      - title: "MDN — grid-template-areas (rectangular areas; invalid declarations)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/grid-template-areas"
      - title: "CSS Grid Layout Module Level 2 — grid-template-areas: a non-rectangular area is a parse error"
        url: "https://drafts.csswg.org/css-grid/#grid-template-areas-property"
    actions:
      - id: open-rules-board
        type: whiteboard.apply
        at: { mark: open-rules }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-rule-count
        type: whiteboard.apply
        at: { mark: draw-rule-count }
        upsertIds: [b-rule1]
        drawMs: 1600
      - id: draw-rule-rect
        type: whiteboard.apply
        at: { mark: draw-rule-rect }
        upsertIds: [b-rule2]
        drawMs: 1400
      - id: draw-l-shape
        type: whiteboard.apply
        at: { mark: draw-l-shape }
        upsertIds:
          [b-c1, b-c1-l, b-c2, b-c2-l, b-c3, b-c3-l, b-c4, b-c4-l, b-c5, b-c5-l, b-c6, b-c6-l]
        drawMs: 3600
      - id: draw-l-cross
        type: whiteboard.apply
        at: { mark: draw-l-cross }
        upsertIds: [b-circle, b-l-note, b-drop]
        drawMs: 2400

  - id: empty-cell
    narration: >
      [[mark:close-rules]] editor ထဲ ပြန်ရအောင်။ တစ်ခါတလေ cell တစ်ကွက်ကို အလွတ် ထားချင်တာ ရှိပါတယ်။ map
      ထဲမှာ အစက် တစ်စက်က cell အလွတ်ကို ဆိုလိုပါတယ်။ [[mark:type-dot]] ဒါဆို footer က ဘယ်ဘက် cell ကိုပဲ
      ယူပြီး၊ ညာဘက် cell မှာ အစက် ပါတဲ့ map ကို declaration နောက်တစ်ခုနဲ့ ထပ်ရေးပါမယ်။ [[mark:after-dot]]
      footer က ဘယ်ဘက် တစ်ဝက်ကိုပဲ ယူတော့ပြီး၊ ဘေးက cell က အလွတ် ကျန်နေပါတယ်။ ထုံးစံအတိုင်း နောက်မှ ရေးတာ
      နိုင်ပါတယ်။ [[mark:select-dot]] ဒီ အစက်ကို ကြည့်ပါ။ အစက် အများကြီးကို ကြားမှာ space မခြားဘဲ
      ဆက်ရေးရင်လည်း cell တစ်ကွက်ပဲ ဖြစ်ပါတယ်။ ဒါကြောင့် နာမည်တွေ အရှည် မတူရင်တောင် map ကို တန်းညီအောင်
      ရေးလို့ ရပါတယ်။ [[mark:type-restore]] footer ကို အပြည့် ပြန်ယူစေချင်လို့၊ ပထမ map ကို declaration
      နောက်တစ်ခုနဲ့ ပြန်ရေးပါမယ်။ [[mark:after-restore]] footer က အောက်ဆုံးမှာ တစ်တန်းလုံး ပြန်ယူပါပြီ။
    sources:
      - title: "web.dev Learn CSS — Grid: grid template areas (empty cells)"
        url: "https://web.dev/learn/css/grid#grid_template_areas"
      - title: "MDN — grid-template-areas (a sequence of full stops is a null cell)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/grid-template-areas#values"
    actions:
      - id: close-rules-board
        type: whiteboard.apply
        at: { mark: close-rules }
        open: false
      # One complete line: the names exist now, so a partial map would throw
      # the footer into implicit tracks.
      - id: type-dot
        type: editor.type
        at: { mark: type-dot }
        cadence: line-by-line
        target: { file: styles.css, after: "    \"footer footer\";\n", occurrence: 1 }
        text: "  grid-template-areas: \"header header\" \"menu hours\" \"footer .\";\n"
      - id: expect-dot
        type: expect.preview
        at: { mark: after-dot }
        timeoutMs: 4000
        target: { by: testId, value: footer }
        textContains: "09 123 456 789"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-dot
        type: editor.select
        at: { mark: select-dot }
        target: { file: styles.css, text: '"footer ."', occurrence: 1 }
      - id: type-restore
        type: editor.type
        at: { mark: type-restore }
        cadence: line-by-line
        target: { file: styles.css, after: "\"footer .\";\n", occurrence: 1 }
        text: "  grid-template-areas: \"header header\" \"menu hours\" \"footer footer\";\n"
      - id: expect-restore
        type: expect.preview
        at: { mark: after-restore }
        timeoutMs: 4000
        target: { by: testId, value: footer }
        textContains: "ရန်ကုန်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: areas-media
    chapter: "Screen ကျဉ်းရင် area တွေကို ပြန်စီကြည့်ရအောင်"
    narration: >
      [[mark:scroll-top]] ဖုန်းမှာဆိုရင် column နှစ်ခုက ကျဉ်းလွန်းလို့၊ screen ကျဉ်းရင် column
      တစ်ခုတည်းကို ပြောင်းကြည့်ရအောင်။ lesson 8 မှာလိုပဲ screen အကျယ် 40 em ထက် ကျဉ်းမှ အလုပ်လုပ်မယ့်
      media query တစ်ခု ထည့်ပါမယ်။ [[mark:type-media]] သူ့ထဲမှာ wrapper ကို map အသစ် ပေးပြီး၊ cell
      တစ်ကွက်စီ ပါတဲ့ string လေးခု ရေးပါမယ်။ [[mark:after-media]] preview က ဖုန်း screen လောက်ပဲ ကျယ်ပြီး
      40 em ထက် အများကြီး ကျဉ်းလို့၊ rule က ချက်ချင်း အလုပ်လုပ်ပါတယ်။ အပိုင်းတွေက အစဉ်အတိုင်း အပေါ်အောက်
      ဆင့်သွားပေမယ့်၊ ဘယ်ဘက် တစ်ဝက်မှာပဲ ရှိနေပါတယ်။ [[mark:select-media-map]] ဘာကြောင့်လဲဆိုတော့၊ ဒီ map
      မှာ column တစ်ခုပဲ ပါပေမယ့်၊ ပထမ rule က ပေးထားတဲ့ column နှစ်ခုက ရှိနေတုန်းမို့ ညာဘက် column က အလွတ်
      ကျန်နေလို့ပါ။ [[mark:type-media-cols]] ဒါကြောင့် media query ထဲမှာ column ကိုလည်း 1 fr column
      တစ်ခုတည်း ပေးပါမယ်။ [[mark:after-media-cols]] အခု အပိုင်းတိုင်းက အကျယ် အပြည့် ယူသွားပါပြီ။ HTML ကို
      လုံးဝ မပြင်ဘဲ map အသစ်နဲ့ column တစ်ခု ပေးလိုက်ရုံပါပဲ။ screen အကျယ် 40 em ထက် ကျယ်ရင်တော့ column
      နှစ်ခု ပါတဲ့ map က ဆက်အလုပ်လုပ်ပါမယ်။
    sources:
      - title: "web.dev Learn CSS — Grid: grid template areas (redefining areas)"
        url: "https://web.dev/learn/css/grid#grid_template_areas"
      - title: "MDN — Grid layout and media queries (redefining the grid)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_grid_layout/Grid_template_areas#redefining_the_grid_using_media_queries"
      - title: "MDN — Using media queries (range syntax)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_media_queries/Using_media_queries"
    actions:
      - id: scroll-top
        type: preview.scroll
        at: { mark: scroll-top }
        timeoutMs: 5000
        top: 0
        retry: { maxAttempts: 2, delayMs: 250 }
      # The map is one line, so it lands whole (see the header comment).
      - id: type-media
        type: editor.type
        at: { mark: type-media }
        cadence: line-by-line
        target: { file: styles.css, after: ".site-footer { grid-area: footer; }\n", occurrence: 1 }
        text: "\n@media (width < 40em) {\n  .layout {\n    grid-template-areas: \"header\" \"menu\" \"hours\" \"footer\";\n  }\n}\n"
      - id: expect-media
        type: expect.preview
        at: { mark: after-media }
        timeoutMs: 4000
        target: { by: testId, value: hours }
        textContains: "ဖွင့်ချိန်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-media-map
        type: editor.select
        at: { mark: select-media-map }
        target: { file: styles.css, text: '"header" "menu" "hours" "footer"', occurrence: 1 }
      - id: type-media-cols
        type: editor.type
        at: { mark: type-media-cols }
        cadence: fast-explainer
        target:
          {
            file: styles.css,
            after: "    grid-template-areas: \"header\" \"menu\" \"hours\" \"footer\";\n",
            occurrence: 1,
          }
        text: "    grid-template-columns: 1fr;\n"
      - id: expect-media-cols
        type: expect.preview
        at: { mark: after-media-cols }
        timeoutMs: 4000
        target: { by: testId, value: menu-drinks }
        textContains: "လက်ဖက်ရည်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: shorthands
    chapter: "Grid template နဲ့ grid shorthand"
    narration: >
      [[mark:open-shorthand]] area၊ row နဲ့ column တွေကို declaration တစ်ခုတည်းနဲ့လည်း ရေးလို့ ရပါတယ်။
      [[mark:draw-template]] grid template shorthand က သုံးခုလုံးကို ပေးပါတယ်။ row တစ်ခုစီရဲ့ string ကို
      အရင် ရေးပြီး နောက်မှာ အဲဒီ row ရဲ့ အမြင့်ကို ရေးပါတယ်။ မျဉ်းစောင်း နောက်မှာတော့ column တွေ လာပါတယ်။
      [[mark:draw-template-labels]] ဒါက screen ကျယ်တဲ့ layout ပါ။ header နဲ့ footer row တွေက content
      လောက်ပဲ မြင့်ပြီး၊ အလယ် row ကတော့ layout ကို အမြင့် ပေးထားရင် ကျန်တဲ့ နေရာကို ယူပါတယ်။ column က 1 fr
      column နှစ်ခုပါ။ [[mark:draw-grid-short]] grid ဆိုတဲ့ shorthand လည်း ရှိပါသေးတယ်။ grid template
      ပေးနိုင်တာ အကုန်လုံးအပြင်၊ lesson 19 က grid auto flow နဲ့ grid auto rows လို setting တွေကိုပါ
      ပေးပြီး၊ ကိုယ် မရေးခဲ့တာ မှန်သမျှ default တန်ဖိုး ပြန်ဖြစ်သွားပါတယ်။ [[mark:draw-grid-reset]]
      default ပြန်ဖြစ်တာက မထင်ထားတဲ့ ပြဿနာ ဖြစ်တတ်လို့၊ grid shorthand ကို မသုံးဘဲ property တွေကို သီးသန့်
      ရေးကြတာ များပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Grid: shorthands"
        url: "https://web.dev/learn/css/grid#shorthands"
      - title: "MDN — grid-template"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/grid-template"
      - title: "MDN — grid (resets the sub-properties it omits)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/grid"
    actions:
      - id: open-shorthand-board
        type: whiteboard.apply
        at: { mark: open-shorthand }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-template
        type: whiteboard.apply
        at: { mark: draw-template }
        upsertIds: [c-code, c-s1, c-r1, c-s2, c-r2, c-s3, c-r3, c-cols]
        drawMs: 3600
      - id: draw-template-labels
        type: whiteboard.apply
        at: { mark: draw-template-labels }
        upsertIds: [c-areas-l, c-rows-l, c-cols-l]
        drawMs: 1800
      - id: draw-grid-short
        type: whiteboard.apply
        at: { mark: draw-grid-short }
        upsertIds: [c-grid]
        drawMs: 1600
      - id: draw-grid-reset
        type: whiteboard.apply
        at: { mark: draw-grid-reset }
        upsertIds: [c-reset]
        drawMs: 1400

  - id: subgrid-problem
    chapter: "Subgrid နဲ့ card တွေကို ညီအောင် လုပ်ကြည့်ရအောင်"
    narration: >
      [[mark:close-shorthand]] အခု သောက်စရာ card နှစ်ခုပါ။ [[mark:type-menu-grid]] သူတို့ကို ဘေးချင်းကပ်
      ထားရအောင်။ card တွေရဲ့ list ကို 1 fr column နှစ်ခု ပါတဲ့ grid လုပ်ပြီး၊ column တွေကြားမှာပဲ gap
      ပေးပါမယ်။ ဒီ list ရဲ့ class ကလည်း menu ဖြစ်ပေမယ့်၊ area နာမည် menu နဲ့ မဆိုင်ပါဘူး။
      [[mark:after-menu-grid]] card နှစ်ခု ဘေးချင်းကပ် ဖြစ်ပြီး အမြင့်လည်း တူနေပါတယ်။ grid item တွေက row
      ပြည့်အောင် ဆန့်လို့ပါ။ ဒါပေမဲ့ ဈေးနှုန်းတွေကို ကြည့်ပါ။ ဖော်ပြချက် ရှည်တဲ့ card မှာ ဈေးနှုန်းက
      တစ်ဖက် card ထက် အများကြီး အောက် ရောက်နေပါတယ်။ [[mark:explain-problem]] card တစ်ခုစီက သူ့ content ကို
      သူ့ဘာသာ စီတာ ဖြစ်လို့၊ ဘေးက card ရဲ့ ဖော်ပြချက် ဘယ်လောက် ရှည်လဲ မသိနိုင်ပါဘူး။ card နှစ်ခုလုံးကို
      သိတာက list ရဲ့ grid တစ်ခုတည်းပါ။
    sources:
      - title: "web.dev Learn CSS — Grid: subgrid"
        url: "https://web.dev/learn/css/grid#subgrid"
      - title: "MDN — Subgrid"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_grid_layout/Subgrid"
      - title: "MDN — column-gap"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/column-gap"
    actions:
      - id: close-shorthand-board
        type: whiteboard.apply
        at: { mark: close-shorthand }
        open: false
      - id: type-menu-grid
        type: editor.type
        at: { mark: type-menu-grid }
        cadence: line-by-line
        target:
          { file: styles.css, after: "    grid-template-columns: 1fr;\n  }\n}\n", occurrence: 1 }
        text: "\n.drinks .menu {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  column-gap: 12px;\n}\n"
      - id: expect-menu-grid
        type: expect.preview
        at: { mark: after-menu-grid }
        timeoutMs: 4000
        target: { by: testId, value: price-falooda }
        textContains: "3,000"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: subgrid-fix
    narration: >
      [[mark:type-subgrid]] ဒါကြောင့် card တစ်ခုစီကိုလည်း grid လုပ်ပါမယ်။ ရိုက်နေတုန်း ဈေးနှုန်း နှစ်ခုကို
      ကြည့်ထားပါ။ card က list မှာ browser ထပ်ဖွင့်ပေးတဲ့ row သုံးခုကို ဖြတ်ယူပြီး၊ သူ့ အပိုင်း တစ်ခုစီက
      row တစ်ခုစီ ရပါတယ်။ နောက်ဆုံးမှာ row တွေအတွက် subgrid ကို ပေးပါမယ်။ subgrid ဆိုတာ child grid က
      ကိုယ်ပိုင် track မဆွဲဘဲ parent grid ရဲ့ track တွေကို ဆက်သုံးတာပါ။ [[mark:after-subgrid]] အခု card
      နှစ်ခုရဲ့ ခေါင်းစဉ်တွေ၊ ဖော်ပြချက်တွေနဲ့ ဈေးနှုန်းတွေက တစ်တန်းတည်း ညီသွားပါပြီ။ ဖော်ပြချက် row ကတော့
      ရှည်တဲ့ ဖော်ပြချက်လောက် မြင့်ပါတယ်။ [[mark:select-span]] ဒီ span ကို ကြည့်ပါ။ subgrid က သူ
      ဖြတ်ယူထားတဲ့ track တွေကိုပဲ မျှသုံးလို့၊ card က သူ့ အပိုင်း သုံးခုအတွက် လိုတဲ့ row သုံးခုကို
      ဖြတ်ယူထားတာပါ။ [[mark:select-subgrid]] ပြီးတော့ ဒီ subgrid တန်ဖိုးကို ကြည့်ပါ။ card က သူ့ box၊
      border နဲ့ padding ကို ဆက်ထားပေမယ့်၊ သူ့ child တွေကတော့ list ရဲ့ row line တွေပေါ်မှာ နေရာယူပါတယ်။
      subgrid က parent ရဲ့ gap ကိုလည်း ယူသုံးပါတယ်။ ကိုယ့် list မှာ column gap ပဲ ရှိလို့ အပိုင်းတွေက
      အပေါ်အောက် ကပ်နေပါတယ်။ subgrid က အခု Baseline ဖြစ်ပြီး browser အဓိက အားလုံးမှာ သုံးလို့ ရနေပါပြီ။
    sources:
      - title: "web.dev Learn CSS — Grid: subgrid"
        url: "https://web.dev/learn/css/grid#subgrid"
      - title: "MDN — Subgrid (spanning the parent tracks; gaps are inherited)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_grid_layout/Subgrid"
      - title: "CSS Grid Layout Module Level 2 — subgrids"
        url: "https://drafts.csswg.org/css-grid-2/#subgrids"
      - title: "webstatus.dev — Subgrid (Baseline)"
        url: "https://webstatus.dev/features/subgrid"
    actions:
      - id: type-subgrid
        type: editor.type
        at: { mark: type-subgrid }
        cadence: fast-explainer
        target: { file: styles.css, after: "  column-gap: 12px;\n}\n", occurrence: 1 }
        text: "\n.drinks .menu-card {\n  display: grid;\n  grid-row: span 3;\n  grid-template-rows: subgrid;\n}\n"
      - id: expect-subgrid
        type: expect.preview
        at: { mark: after-subgrid }
        timeoutMs: 4000
        target: { by: testId, value: price-laphet-yay }
        textContains: "1,500"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-span
        type: editor.select
        at: { mark: select-span }
        target: { file: styles.css, text: "grid-row: span 3;", occurrence: 1 }
      - id: select-subgrid
        type: editor.select
        at: { mark: select-subgrid }
        target: { file: styles.css, text: "grid-template-rows: subgrid;", occurrence: 1 }

  - id: subgrid-board
    narration: >
      [[mark:open-subgrid-board]] ဘာ ဖြစ်သွားလဲ ကြည့်ရအောင်။ [[mark:draw-subgrid-cards]] ဘေးချင်းကပ် card
      နှစ်ခုမှာ ခေါင်းစဉ်၊ ဖော်ပြချက်နဲ့ ဈေးနှုန်း ကိုယ်စီ ပါပါတယ်။ [[mark:draw-subgrid-lines]] row line
      တွေက list ရဲ့ line တွေ ဖြစ်ပြီး card နှစ်ခုလုံးကို ဖြတ်သွားပါတယ်။ ဒါကြောင့် အပိုင်းတိုင်းက card
      နှစ်ခုလုံးမှာ row တူတူကို ရောက်ပါတယ်။ [[mark:draw-subgrid-axes]] ဒီမှာ row တွေကို မျှသုံးခဲ့ပေမယ့်၊
      subgrid က column တွေအတွက်ရော၊ နှစ်ဘက်လုံးအတွက်ပါ ရပါတယ်။ subgrid မပေးတဲ့ ဘက်မှာတော့ card က
      ကိုယ်ပိုင် track တွေကိုပဲ သုံးပါတယ်။ [[mark:draw-contents]] card ရဲ့ child တွေကို အပြင်က grid နဲ့
      ညီအောင် လုပ်ဖို့ display contents ကို သုံးတာလည်း တွေ့ရနိုင်ပါတယ်။ သူက card ရဲ့ box ကို
      ဖယ်လိုက်ပါတယ်။ ဒါပေမဲ့ card ရဲ့ နောက်ခံနဲ့ border ပါ ပျောက်သွားပြီး၊ browser တချို့မှာ အဲဒီ element
      က list ဒါမှမဟုတ် ခလုတ် ဖြစ်မှန်း screen reader က မသိရတော့တာ ရှိခဲ့ပါတယ်။ subgrid ကတော့ box ကို
      ဆက်ထားပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Grid: subgrid (rows, columns or both)"
        url: "https://web.dev/learn/css/grid#subgrid"
      - title: "MDN — Subgrid in one or both dimensions"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_grid_layout/Subgrid"
      - title: "MDN — display: contents (accessibility concerns)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/display#display_contents"
    actions:
      - id: open-subgrid-board
        type: whiteboard.apply
        at: { mark: open-subgrid-board }
        open: true
        clear: true
        upsertIds: [d-title]
      - id: draw-subgrid-cards
        type: whiteboard.apply
        at: { mark: draw-subgrid-cards }
        upsertIds: [d-card1, d-card2, d-n1, d-n2, d-d1, d-d2, d-p1, d-p2]
        drawMs: 3000
      - id: draw-subgrid-lines
        type: whiteboard.apply
        at: { mark: draw-subgrid-lines }
        upsertIds: [d-line1, d-line2, d-r1, d-r2, d-r3, d-share]
        drawMs: 3200
      - id: draw-subgrid-axes
        type: whiteboard.apply
        at: { mark: draw-subgrid-axes }
        upsertIds: [d-axes]
        drawMs: 1600
      - id: draw-contents
        type: whiteboard.apply
        at: { mark: draw-contents }
        upsertIds: [d-contents]
        drawMs: 1600

  - id: align-board
    chapter: "Grid ထဲမှာ align လုပ်ကြည့်ရအောင်"
    narration: >
      [[mark:open-align-board]] နောက်ဆုံး တစ်ခုက alignment ပါ။ property နာမည်တွေက lesson 17 မှာ flexbox
      နဲ့ သုံးခဲ့တာတွေပါပဲ။ [[mark:draw-inline]] grid မှာ flexbox လို main axis မရှိလို့၊ justify property
      တွေက inline axis အတိုင်း အလုပ်လုပ်ပါတယ်။ inline axis က စာလုံးတွေ စီသွားတဲ့ ဘက် ဖြစ်ပြီး၊ ဒီမှာ
      ဘယ်ကနေ ညာပါ။ [[mark:draw-block]] align property တွေကတော့ block axis အတိုင်းပါ။ စာကြောင်းတွေ
      ဆင့်သွားတဲ့ ဘက် ဖြစ်ပြီး အပေါ်ကနေ အောက်ပါ။ [[mark:draw-items]] justify items နဲ့ align items ကို
      container မှာ ပေးပြီး၊ item တိုင်းက သူ့ area ထဲမှာ ဘယ်နေရာ နေမလဲ သတ်မှတ်ပါတယ်။ [[mark:draw-self]]
      justify self နဲ့ align self ကိုတော့ item တစ်ခုမှာ ပေးပြီး အဲဒီ item အတွက်ပဲ ပြောင်းပါတယ်။ lesson 17
      မှာ flexbox က justify self ကို ကျော်တာ မြင်ခဲ့ပေမယ့်၊ grid မှာတော့ အလုပ်လုပ်ပါတယ်။
      [[mark:draw-content]] justify content နဲ့ align content ကတော့ track တွေ အားလုံးက container ထက်
      သေးနေရင်၊ သူတို့ကို အစုလိုက် ရွှေ့ပါတယ်။ [[mark:draw-place]] အတွဲ တစ်တွဲစီမှာ place shorthand
      ရှိပြီး၊ align တန်ဖိုးကို အရင်၊ justify တန်ဖိုးကို နောက်မှ ရေးပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Grid: alignment"
        url: "https://web.dev/learn/css/grid#alignment"
      - title: "MDN — Box alignment in grid layout"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_grid_layout/Box_alignment_in_grid_layout"
      - title: "CSS Box Alignment Module Level 3"
        url: "https://drafts.csswg.org/css-align/"
    actions:
      - id: open-align-board
        type: whiteboard.apply
        at: { mark: open-align-board }
        open: true
        clear: true
        upsertIds: [e-title]
      - id: draw-inline
        type: whiteboard.apply
        at: { mark: draw-inline }
        upsertIds: [e-box, e-i1, e-i2, e-i3, e-i4, e-in, e-in-l]
        drawMs: 3200
      - id: draw-block
        type: whiteboard.apply
        at: { mark: draw-block }
        upsertIds: [e-bl, e-bl-l]
        drawMs: 1800
      - id: draw-items
        type: whiteboard.apply
        at: { mark: draw-items }
        upsertIds: [e-items]
        drawMs: 1400
      - id: draw-self
        type: whiteboard.apply
        at: { mark: draw-self }
        upsertIds: [e-self]
        drawMs: 1400
      - id: draw-content
        type: whiteboard.apply
        at: { mark: draw-content }
        upsertIds: [e-content]
        drawMs: 1400
      - id: draw-place
        type: whiteboard.apply
        at: { mark: draw-place }
        upsertIds: [e-place]
        drawMs: 1400

  - id: soon-stretch
    narration: >
      [[mark:close-align-board]] မကြာမီ box မှာ စမ်းကြည့်ရအောင်။ [[mark:scroll-soon]] အမြင့် ပုံသေ
      ရှိပြီး၊ အစိမ်းရောင် label နဲ့ စာ တစ်ကြောင်း ပါပါတယ်။ [[mark:type-soon-grid]] ပထမဆုံး box ကို item
      နှစ်ခု ပါတဲ့ grid container လုပ်ပါမယ်။ [[mark:after-soon-grid]] row နှစ်ခုက box ရဲ့ အမြင့်ကို
      ခွဲယူပြီး၊ label က သူ့ cell ပြည့်အောင် ဘယ်ညာရော အပေါ်အောက်ပါ ဆန့်သွားပါတယ်။ ဒါက default ပါ။ grid
      item တွေက axis နှစ်ဘက်လုံးမှာ stretch ဖြစ်ပါတယ်။ [[mark:explain-stretch]] ခြွင်းချက် တစ်ခုက ပုံလို
      aspect ratio ရှိတဲ့ item ပါ။ aspect ratio ဆိုတာ ပုံသေ ဖြစ်နေတဲ့ အကျယ်နဲ့ အမြင့် အချိုးပါ။ အဲဒီ item
      ကိုတော့ ပုံ မပျက်အောင် stretch မလုပ်ဘဲ အစမှာ ထားပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Grid: alignment (items stretch by default)"
        url: "https://web.dev/learn/css/grid#alignment"
      - title: "MDN — align-self (normal behaves as stretch; items with an aspect ratio as start)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/align-self#values"
      - title: "MDN — align-content (normal stretches auto tracks)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/align-content"
    actions:
      - id: close-align-board
        type: whiteboard.apply
        at: { mark: close-align-board }
        open: false
      - id: scroll-soon
        type: preview.scroll
        at: { mark: scroll-soon }
        timeoutMs: 5000
        top: 320
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-soon-grid
        type: editor.type
        at: { mark: type-soon-grid }
        cadence: fast-explainer
        target: { file: styles.css, after: "  grid-template-rows: subgrid;\n}\n", occurrence: 1 }
        text: "\n.soon {\n  display: grid;\n}\n"
      - id: expect-soon-grid
        type: expect.preview
        at: { mark: after-soon-grid }
        timeoutMs: 4000
        target: { by: testId, value: soon-label }
        textContains: "မကြာမီ"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: soon-align
    narration: >
      [[mark:type-place-content]] အခု place content ကို center ပေးပါမယ်။ axis နှစ်ဘက်လုံးကို တစ်ခါတည်း
      ပေးတာပါ။ [[mark:after-place-content]] track တွေက content လောက်ပဲ ကျုံ့သွားပြီး၊ label နဲ့ စာကြောင်းက
      box ရဲ့ အလယ်ကို ရောက်သွားပါတယ်။ place content က item တွေကို မဟုတ်ဘဲ track တွေကို ရွှေ့တာပါ။ label က
      အောက်က စာကြောင်းလောက် ကျယ်နေတာကို သတိထား ကြည့်ပါ။ သူ့ track ထဲမှာ stretch ဖြစ်နေတုန်းမို့ပါ။
      [[mark:type-align-content]] နောက်တစ်ခုက align content ကို space between ပေးတာပါ။ နောက်မှ ရေးတဲ့အတွက်
      place content ရဲ့ block axis ဘက် တစ်ဝက်ကိုပဲ အစားထိုးပါတယ်။ [[mark:after-align-content]] နေရာလွတ်က
      row နှစ်ခုကြားကို ရောက်သွားလို့ label က အပေါ်ဆုံး၊ စာကြောင်းက အောက်ဆုံးကို ရောက်သွားပါတယ်။
      [[mark:type-justify-items]] အခု justify items ကို center ပေးပါမယ်။ item တိုင်းကို သူ့ cell ထဲမှာ
      ဘယ်ညာ အလယ် ပို့ပါတယ်။ [[mark:after-justify-items]] label က သူ့ စာသားလောက်ပဲ ကျဉ်းသွားပြီး cell ရဲ့
      အလယ်မှာ ရှိနေပါတယ်။ place items ကတော့ align items နဲ့ justify items ကို တစ်ခါတည်း ပေးပါတယ်။
      [[mark:type-justify-self]] နောက်ဆုံး label အတွက်ပဲ rule တစ်ခု ရေးပြီး justify self ကို start
      ပေးပါမယ်။ ဒီ item တစ်ခုအတွက် justify items ကို အစားထိုးတာပါ။ [[mark:after-justify-self]] label က သူ့
      cell ရဲ့ အစဘက်ကို ရောက်သွားပြီး စာကြောင်းကတော့ အလယ်မှာ ကျန်ပါတယ်။ item တစ်ခုတည်းအတွက် shorthand
      ကတော့ place self ပါ။
    sources:
      - title: "MDN — place-content"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/place-content"
      - title: "MDN — justify-items"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/justify-items"
      - title: "MDN — justify-self"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/justify-self"
      - title: "MDN — place-items and place-self"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/place-items"
      - title: "web.dev Learn CSS — Grid: alignment"
        url: "https://web.dev/learn/css/grid#alignment"
    actions:
      - id: type-place-content
        type: editor.type
        at: { mark: type-place-content }
        cadence: natural
        target: { file: styles.css, after: ".soon {\n  display: grid;\n", occurrence: 1 }
        text: "  place-content: center;\n"
      - id: expect-place-content
        type: expect.preview
        at: { mark: after-place-content }
        timeoutMs: 4000
        target: { by: testId, value: soon-note }
        textContains: "ဖွင့်ပါမယ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-align-content
        type: editor.type
        at: { mark: type-align-content }
        cadence: fast-explainer
        target: { file: styles.css, after: "  place-content: center;\n", occurrence: 1 }
        text: "  align-content: space-between;\n"
      - id: expect-align-content
        type: expect.preview
        at: { mark: after-align-content }
        timeoutMs: 4000
        target: { by: testId, value: soon }
        textContains: "မကြာမီ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-justify-items
        type: editor.type
        at: { mark: type-justify-items }
        cadence: fast-explainer
        target: { file: styles.css, after: "  align-content: space-between;\n", occurrence: 1 }
        text: "  justify-items: center;\n"
      - id: expect-justify-items
        type: expect.preview
        at: { mark: after-justify-items }
        timeoutMs: 4000
        target: { by: testId, value: soon-label }
        textContains: "မကြာမီ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-justify-self
        type: editor.type
        at: { mark: type-justify-self }
        cadence: fast-explainer
        target: { file: styles.css, after: "  justify-items: center;\n}\n", occurrence: 1 }
        text: "\n.soon .label {\n  justify-self: start;\n}\n"
      - id: expect-justify-self
        type: expect.preview
        at: { mark: after-justify-self }
        timeoutMs: 4000
        target: { by: testId, value: soon-note }
        textContains: "ဖွင့်ပါမယ်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:open-quiz]] မေးခွန်း တစ်ခုပါ။ subgrid က row တွေကိုပဲ မျှသုံးနိုင်သလား။ ခဏ စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] row တွေကိုပဲ မဟုတ်ပါဘူး။ column တွေ ဒါမှမဟုတ် နှစ်ဘက်လုံးကိုလည်း ရပါတယ်။
      ပြီးတော့ grid area ပါတဲ့ item ကို ကိုယ်တိုင် နေရာချထားလို့ auto placement က မရွှေ့ပါဘူး။
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ grid template areas က layout ကို နာမည် ပေးထားတဲ့ cell တွေနဲ့
      ပုံဆွဲပေးပြီး၊ grid area က item တစ်ခုစီကို သူ့ area ထဲ ထည့်ပေးပါတယ်။ row တိုင်းမှာ cell အရေအတွက်
      တူရပြီး၊ area တိုင်း လေးထောင့် ဖြစ်ရပါတယ်။ အစက်က cell ကို အလွတ် ထားပေးပါတယ်။ [[mark:recap-more]]
      media query က HTML ကို မပြင်ဘဲ map ကို အသစ် တစ်ခုနဲ့ လဲပေးနိုင်ပါတယ်။ subgrid က အထဲက grid ကို parent
      ရဲ့ track တွေ မျှသုံးခိုင်းပြီး၊ justify နဲ့ align property တွေက item တွေနဲ့ track တွေကို axis
      နှစ်ခုပေါ်မှာ ရွှေ့ပေးပါတယ်။ [[mark:next-lesson]] grid lesson သုံးခုက ဒီမှာ ပြီးပါပြီ။ justify self
      မှာ start ကို သုံးခဲ့ပါတယ်။ start ဆိုတာ စာ စရေးတဲ့ ဘက် ဖြစ်ပြီး၊ အမြဲတမ်း ဘယ်ဘက် မဟုတ်ပါဘူး။ နောက်
      lesson မှာတော့ ဒီလိုပဲ ဘယ်၊ ညာ အစား start နဲ့ end ကို သုံးတဲ့ logical property တွေကို
      ကြည့်သွားပါမယ်။
    sources:
      - title: "web.dev Learn CSS — Grid: check your understanding"
        url: "https://web.dev/learn/css/grid#check_your_understanding"
      - title: "web.dev Learn CSS — Grid"
        url: "https://web.dev/learn/css/grid"
      - title: "web.dev Learn CSS — Logical properties (next lesson)"
        url: "https://web.dev/learn/css/logical-properties"
    actions:
      - id: open-quiz
        type: whiteboard.apply
        at: { mark: open-quiz }
        open: true
        clear: true
        upsertIds: [f-title, f-q]
      - id: draw-quiz-answer
        type: whiteboard.apply
        at: { mark: quiz-answer }
        upsertIds: [f-check, f-a, f-rule]
        drawMs: 2400
      - id: expect-final-layout
        type: expect.file
        at: { mark: recap }
        path: styles.css
        contains: ".layout {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 12px;\n  grid-template-areas:\n    \"header header\"\n    \"menu hours\"\n    \"footer footer\";\n  grid-template-areas: \"header header\" \"menu hours\" \"footer .\";\n  grid-template-areas: \"header header\" \"menu hours\" \"footer footer\";\n}\n\n.site-header { grid-area: header; }\n.drinks { grid-area: menu; }\n.hours { grid-area: hours; }\n.site-footer { grid-area: footer; }\n\n@media (width < 40em) {\n  .layout {\n    grid-template-areas: \"header\" \"menu\" \"hours\" \"footer\";\n    grid-template-columns: 1fr;\n  }\n}\n"
      - id: expect-final-subgrid
        type: expect.file
        at: { afterAction: expect-final-layout }
        path: styles.css
        contains: "\n.drinks .menu {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  column-gap: 12px;\n}\n\n.drinks .menu-card {\n  display: grid;\n  grid-row: span 3;\n  grid-template-rows: subgrid;\n}\n"
      - id: expect-final-align
        type: expect.file
        at: { afterAction: expect-final-subgrid }
        path: styles.css
        contains: "\n.soon {\n  display: grid;\n  place-content: center;\n  align-content: space-between;\n  justify-items: center;\n}\n\n.soon .label {\n  justify-self: start;\n}\n"

checks:
  - { type: timing.p95Ms, max: 300 }
