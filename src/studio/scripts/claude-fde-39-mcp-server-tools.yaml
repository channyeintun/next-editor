  - id: second-tool
    chapter: Description ကောင်းကောင်း
    narration: >
      [[mark:type-t2]] ဒုတိယ tool က NMS ကို စစ်တာပါ။ ဒီမှာ description ရဲ့ အရေးကြီးပုံကို မြင်ရပါတယ်။ NMS ထဲမှာ မြို့နယ်
      နာမည်တွေကို အင်္ဂလိပ်လို သိမ်းထားပါတယ်။ ဒါကို description ထဲ မရေးထားရင် model က မြန်မာလို ပို့လာနိုင်ပြီး၊ NMS က
      ဘာမှ ရှာမတွေ့ဘဲ လိုင်းမကျဘူးလို့ မှားဖြေမိနိုင်ပါတယ်။ ဒါကြောင့် ဥပမာ နာမည် တစ်ခုနဲ့ပါ ရေးထားပါတယ်။
      [[mark:type-t2b]] docstring မှာလည်း ဘာကို၊ ဘယ်အချိန်အတွက် စစ်ပေးလဲ ဆိုတာ ရေးထားပါတယ်။ အခု လိုင်းကျနေလား ဆိုတာကိုပဲ
      ပြောပြီး၊ ပြီးခဲ့တဲ့ လိုင်းကျမှု မှတ်တမ်းကိုတော့ မပေးဘူး ဆိုတာ ဒီ စာကြောင်းကနေ model သိနိုင်ပါတယ်။
      [[mark:sel-hint]] read only hint ကို တစ်ခု သတိထားပါ။ docs က annotation တွေကို client အတွက် hint ပဲ ဖြစ်ပြီး security
      မဟုတ်ဘူးလို့ ဆိုထားပါတယ်။ client က ဒီ hint ကို လိုက်နာမယ်လို့ အားကိုးလို့ မရပါဘူး။ server ကို ဖတ်ရုံပဲ
      ဖြစ်အောင် တကယ် ထိန်းတာက backend ထဲက code နဲ့ server ရဲ့ ခွင့်ပြုချက်တွေပါ။
      [[mark:n-error]] tool ထဲမှာ ပြဿနာ တစ်ခုခု ဖြစ်ရင်၊ ဥပမာ ticket မရှိရင်၊ model ဖတ်လို့ရတဲ့ message နဲ့ ToolError ကို raise
      လုပ်ရပါတယ်။ တခြား exception ဆိုရင် model ဆီကို tool run ရာမှာ error ဖြစ်တယ် ဆိုတာလောက်ပဲ ရောက်ပါတယ်။ ticket-mcp
      မှာတော့ ticket မရှိရင် backend module က ToolError နဲ့ ticket id ပုံစံကို ပြန်ပြောပေးထားပါတယ်။
    sources:
      - {
          title: "MCP Python SDK: Tools",
          url: "https://py.sdk.modelcontextprotocol.io/servers/tools/",
        }
      - {
          title: "MCP Python SDK: What's new in v2",
          url: "https://py.sdk.modelcontextprotocol.io/whats-new/",
        }
    actions:
      - id: type-t2
        type: editor.type
        at: { mark: type-t2 }
        cadence: line-by-line
        target: { file: ticket-mcp/server.py, after: "return ticket_summary(ticket_id)\n" }
        text: "\n\n@mcp.tool(annotations=ToolAnnotations(read_only_hint=True))\ndef check_outage(\n    township: Annotated[str, Field(description=\"Township name in English, e.g. Hlaing.\")],\n"
      - id: type-t2b
        type: editor.type
        at: { mark: type-t2b }
        cadence: line-by-line
        target: { file: ticket-mcp/server.py, after: "e.g. Hlaing.\")],\n" }
        text: ") -> str:\n    \"\"\"Check in the NMS whether a township has an outage right now.\"\"\"\n    return outage_status(township)\n"
      - id: sel-hint
        type: editor.select
        at: { mark: sel-hint }
        target:
          file: ticket-mcp/server.py
          text: "annotations=ToolAnnotations(read_only_hint=True)"
          occurrence: 2

  - id: run
    chapter: Run ပြီး စမ်းခြင်း
    narration: >
      [[mark:sel-run]] file ရဲ့ အောက်ဆုံးက စာကြောင်း နှစ်ကြောင်းက server ကို စ run တာပါ။ argument မပေးရင် stdio နဲ့
      run ပါတယ်။ dev command တို့၊ test တို့က ဒီ file ကို import လုပ်ကြတာမို့ main စစ်တဲ့ အောက်မှာပဲ ထားရပါတယ်။
      [[mark:r-wire]] stdio မှာ standard output က MCP message တွေ သွားတဲ့ လမ်းကြောင်း ဖြစ်နေတာမို့၊ file ကို python
      နဲ့ တိုက်ရိုက် run ကြည့်ရင် ဘာမှ မပြဘဲ input ကို စောင့်နေပါမယ်။ ပျက်နေတာ မဟုတ်ပါဘူး။ client တစ်ခု ချိတ်လာမှာကို
      စောင့်နေတာပါ။
      [[mark:i-open]] ဒါဆို model မပါဘဲ ဒီ server ကို ဘယ်လို စမ်းမလဲ။
      [[mark:i-1]] SDK ရဲ့ dev command ကို uv နဲ့ run ရင် MCP Inspector ပွင့်လာပါတယ်။
      [[mark:i-2]] Inspector ဆိုတာ server ကို လက်နဲ့ စမ်းဖို့ တရားဝင် tool ပါ။ Node ပေါ်မှာ run တဲ့ app ဖြစ်လို့ စက်ထဲမှာ npx
      ရှိဖို့ လိုပါတယ်။ npx နဲ့ တိုက်ရိုက် ဖွင့်လို့လည်း ရပြီး၊ browser UI အပြင် script ထဲကနေ သုံးဖို့ CLI mode နဲ့ terminal UI
      mode လည်း ရှိပါတယ်။ terminal မှာ ထုတ်ပေးတဲ့ URL ကို ဖွင့်ရပါတယ်။ အဲဒီ URL ထဲမှာ ဖွင့်တိုင်း အသစ်ထုတ်တဲ့ token ပါလို့ပါ။
      [[mark:i-3]] Inspector က ကိုယ်တို့ server ကို stdio နဲ့ စ run ပေးပါတယ်။
      [[mark:i-tools]] Tools tab ကို ဖွင့်ရင် tool နှစ်ခုကို မြင်ရပြီး၊ tool တစ်ခုစီအတွက် input schema ကနေ ဆောက်ထားတဲ့ form
      ပေါ်လာပါတယ်။ ticket id ကို ရိုက်ပြီး ခေါ်ကြည့်လို့ ရပါတယ်။ description တွေ ဖတ်လို့ နားလည်လား ဆိုတာကိုလည်း model
      မဖတ်ခင် ကိုယ့်မျက်စိနဲ့ အရင် စစ်လို့ ရပါတယ်။
      [[mark:i-proto]] npx နဲ့ တိုက်ရိုက် ဖွင့်တဲ့ Inspector ရဲ့ Protocol tab မှာတော့ client နဲ့ server ကြား ပို့တဲ့ JSON RPC message တွေကို တစ်ခုချင်း ကြည့်လို့
      ရပါတယ်။ ပြီးခဲ့တဲ့ lesson က tools list နဲ့ tools call ကို ဒီမှာ တကယ် မြင်ရမှာပါ။
    sources:
      - {
          title: "MCP Python SDK: Running your server",
          url: "https://py.sdk.modelcontextprotocol.io/run/",
        }
      - {
          title: "Model Context Protocol: MCP Inspector",
          url: "https://modelcontextprotocol.io/docs/2026-07-28/tools/inspector",
        }
      - {
          title: "Model Context Protocol: Inspector web UI",
          url: "https://modelcontextprotocol.io/docs/2026-07-28/tools/inspector/web",
        }
    actions:
      - id: sel-run
        type: editor.select
        at: { mark: sel-run }
        target:
          file: ticket-mcp/server.py
          text: "if __name__ == \"__main__\":\n    mcp.run()"
      - {
          id: draw-i-open,
          type: whiteboard.apply,
          at: { mark: i-open },
          open: true,
          clear: true,
          upsertIds: [i-title],
        }
      - {
          id: draw-i-1,
          type: whiteboard.apply,
          at: { mark: i-1 },
          upsertIds: [i-b1, i-l1],
          drawMs: 1200,
        }
      - {
          id: draw-i-2,
          type: whiteboard.apply,
          at: { mark: i-2 },
          upsertIds: [i-a1, i-b2, i-l2],
          drawMs: 1500,
        }
      - {
          id: draw-i-3,
          type: whiteboard.apply,
          at: { mark: i-3 },
          upsertIds: [i-a2, i-b3, i-l3],
          drawMs: 1500,
        }
      - {
          id: draw-i-tools,
          type: whiteboard.apply,
          at: { mark: i-tools },
          upsertIds: [i-n1],
          drawMs: 1000,
        }
      - {
          id: draw-i-proto,
          type: whiteboard.apply,
          at: { mark: i-proto },
          upsertIds: [i-n2],
          drawMs: 1000,
        }

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ Network Tools ဘက်က developer တစ်ယောက်က မြို့နယ် တစ်ခုရဲ့ ticket တွေကို
      စာရင်းပြတဲ့ tool အသစ် တစ်ခု ထပ်ထည့်တယ် ဆိုပါစို့။ limit ဆိုတဲ့ parameter မှာ Field နဲ့ အနည်းဆုံး ၁၊ အများဆုံး
      ၅၀ လို့ ကန့်သတ်ထားပြီး၊ function ထဲမှာတော့ ဘာမှ မစစ်ထားပါဘူး။ model က limit ၉၉၉ နဲ့ ခေါ်လိုက်ရင်
      ဘာဖြစ်မလဲ။
      [[mark:q-a]] ပထမ အဖြေက function က run သွားပြီး ticket ၉၉၉ ခုကို ဖတ်မယ် ဆိုတာပါ။
      [[mark:q-b]] ဒုတိယ အဖြေက function မ run ခင် SDK က ပယ်ပြီး model ဆီ error ပြန်ပို့မယ် ဆိုတာပါ။ lesson ကို pause
      လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ တစ်ခုပါ။ ဘာကြောင့်လဲဆိုတော့ Field ထဲက ကန့်သတ်ချက်က input schema ထဲ ရောက်သွားပြီး၊
      SDK က function ကို မခေါ်ခင် input ကို အဲဒီ schema နဲ့ စစ်လို့ပါ။ ၅၀ ထက် မကြီးရဘူး ဆိုတဲ့ error က tool ရဲ့ ရလဒ်
      အနေနဲ့ model ဆီ ပြန်ရောက်ပြီး၊ model က အဲဒါကို ဖတ်ပြီး မှန်တဲ့ တန်ဖိုးနဲ့ ပြန်ခေါ်နိုင်ပါတယ်။
      [[mark:q-rule]] ဒါကြောင့် ကန့်သတ်ချက်ကို function ထဲမှာ မဟုတ်ဘဲ type hint နဲ့ Field ထဲမှာ ရေးပါ။ model လည်း schema ထဲမှာ
      ကြိုမြင်ရပြီး၊ မှားခေါ်ရင်လည်း server က ကာကွယ်ပေးပါတယ်။
    sources:
      - {
          title: "MCP Python SDK: Tools",
          url: "https://py.sdk.modelcontextprotocol.io/servers/tools/",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: q-rule },
          upsertIds: [q-t1, q-t2],
          drawMs: 1600,
        }

  - id: your-turn
    chapter: ကိုယ့် system ရဲ့ tool
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ဒီ file ရဲ့ tool နှစ်ခုအောက်မှာ ကိုယ့် system အတွက်
      tool တစ်ခုရဲ့ အစကို ရေးကြည့်ပါ။ function နာမည်၊ parameter တွေရဲ့ type hint နဲ့ Field description၊ docstring တစ်ကြောင်း
      လောက်ဆိုရင် လုံလောက်ပါတယ်။
      [[mark:turn-2]] ရေးပြီးရင် model ရဲ့ မျက်စိနဲ့ ပြန်ဖတ်ကြည့်ပါ။ ဒီ နာမည်၊ ဒီ description နဲ့ input schema ကိုပဲ
      မြင်ရရင် ဘယ်အချိန်မှာ ခေါ်ရမလဲ၊ ဘာ တန်ဖိုး ထည့်ရမလဲ သိနိုင်လား ဆိုတာ မေးကြည့်ပါ။
    sources:
      - {
          title: "MCP Python SDK: Tools",
          url: "https://py.sdk.modelcontextprotocol.io/servers/tools/",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: turn }, open: false }
      - id: sel-t2
        type: editor.select
