build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 9339

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: need
    chapter: ticket-mcp ကို စရေးခြင်း
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ MCP ရဲ့ host၊ client၊ server ဆိုတဲ့ အခန်းကဏ္ဍ သုံးခုကို လေ့လာပြီး၊ ticket-mcp server က
      ဘာ ပေးမလဲ၊ ဘယ်သူ ချိတ်မလဲ ဆိုတဲ့ မြေပုံကို ရေးခဲ့ပါတယ်။
      [[mark:n-open]] ဒီနေ့ အဲဒီ server ကို Python နဲ့ တကယ် ရေးပါမယ်။ Model Context Protocol၊ အတိုကောက် MCP ဆိုတာ AI
      app တွေနဲ့ အပြင်က tool၊ data တွေကို ချိတ်တဲ့ စံ သဘောတူညီချက်ပါ။ MCP server ကတော့ tool နဲ့ data ကို ထုတ်ပေးတဲ့ဘက်ပါ။
      ticket-mcp မှာ tool နှစ်ခု ပါပါမယ်။ ticket တစ်ခုကို ဖတ်တာနဲ့၊ မြို့နယ် တစ်ခုမှာ လိုင်းကျနေလား စစ်တာပါ။
      [[mark:sel-backends]] Ticket system နဲ့ NMS ကို တကယ် ခေါ်တဲ့ code ကို သီးခြား module တစ်ခုထဲ ထားပြီးသားပါ။ ဒီ file
      ကတော့ MCP အပိုင်းကိုပဲ ရေးပါမယ်။
      [[mark:sel-server]] ဒီ စာကြောင်းက server ကို ဖန်တီးတာပါ။ ဒီ lesson ကို ရေးတဲ့ အချိန်မှာ Python SDK က version ၂
      ဖြစ်နေပြီး၊ Python ၃ ဒသမ ၁၁ နဲ့ အထက် လိုပါတယ်။ version ၁ တုန်းက FastMCP လို့ ခေါ်ခဲ့တဲ့ class က အခု
      MCPServer ဖြစ်သွားပြီး၊ import လုပ်တဲ့ module လမ်းကြောင်း အဟောင်းကိုလည်း ဖြုတ်လိုက်ပါပြီ။ အင်တာနက်ပေါ်က tutorial
      အဟောင်းတွေမှာ FastMCP ကို တွေ့ရရင် version ၁ အတွက် code ဆိုတာ သတိထားပါ။
      [[mark:n-install]] SDK ကို command line tool ပါတဲ့ extra နဲ့ install လုပ်ရင် server ကို စမ်းဖို့ dev command ပါ
      ရပါတယ်။ အဲဒါကို နောက်မှ ကြည့်ပါမယ်။
    sources:
      - {
          title: "MCP Python SDK: What's new in v2",
          url: "https://py.sdk.modelcontextprotocol.io/whats-new/",
        }
      - {
          title: "MCP Python SDK: README",
          url: "https://github.com/modelcontextprotocol/python-sdk",
        }
    actions:
      - {
          id: open-server,
          type: workspace.openFile,
          at: { mark: n-open },
          path: ticket-mcp/server.py,
        }
      - id: sel-backends
        type: editor.select
        at: { mark: sel-backends }
        target:
          file: ticket-mcp/server.py
          text: "from backends import outage_status, ticket_summary"
      - id: sel-server
        type: editor.select
        at: { mark: sel-server }
        target:
          file: ticket-mcp/server.py
          text: 'mcp = MCPServer("ticket-mcp")'

  - id: first-tool
    chapter: ပထမ tool
    narration: >
      [[mark:type-t1]] ပထမ tool ကို ရေးကြည့်ရအောင်။ tool ဆိုတာ model က တောင်းဆိုရင် program က လုပ်ပေးတဲ့ လုပ်ဆောင်ချက်
      တစ်ခုပါ။ function ရဲ့ အပေါ်က decorator က ဒီ function ကို tool အဖြစ် server မှာ မှတ်ပုံတင်ပေးပါတယ်။ annotation
      ထဲမှာ ဒီ tool က ဘာမှ မပြောင်းဘူး၊ ဖတ်ရုံပဲ ဆိုတဲ့ hint ကို ထည့်ထားပါတယ်။ parameter ကတော့ ticket id တစ်ခုပဲ ဖြစ်ပြီး၊
      string ဖြစ်ရမယ် ဆိုတဲ့ type hint နဲ့ model ဖတ်မယ့် description ကို တွဲပေးထားပါတယ်။
      [[mark:type-t1b]] ပြီးတော့ function က string တစ်ခု ပြန်ပေးပါတယ်။ docstring ထဲမှာ ဒီ tool က ဘာကို ဖတ်ပေးလဲ ဆိုတာ
      တစ်ကြောင်းတည်းနဲ့ ရေးထားပြီး၊ ကိုယ်ထည်ကတော့ backend function ကို ခေါ်ပြီး ရလာတဲ့ စာကို ပြန်ပေးရုံပါ။
      [[mark:sel-name]] ဒီ function ရဲ့ နာမည်က tool ရဲ့ နာမည် ဖြစ်လာပါတယ်။ model က tool ကို ခေါ်တဲ့အခါ ဒီ နာမည်နဲ့ ခေါ်မှာပါ။
      [[mark:sel-doc]] docstring ကတော့ model မြင်ရမယ့် tool ရဲ့ description ဖြစ်လာပါတယ်။ model က ဒီ စာကြောင်းကို ဖတ်ပြီး
      ဘယ်အချိန်မှာ ဒီ tool ကို သုံးရမလဲ ဆုံးဖြတ်တာမို့ အရေးကြီးပါတယ်။
    sources:
      - {
          title: "MCP Python SDK: Tools",
          url: "https://py.sdk.modelcontextprotocol.io/servers/tools/",
        }
    actions:
      - id: type-t1
        type: editor.type
        at: { mark: type-t1 }
        cadence: line-by-line
        target: { file: ticket-mcp/server.py, after: "mcp = MCPServer(\"ticket-mcp\")\n" }
        text: "\n\n@mcp.tool(annotations=ToolAnnotations(read_only_hint=True))\ndef get_ticket(\n    ticket_id: Annotated[str, Field(description=\"Ticket id, for example T-58213.\")],\n"
      - id: type-t1b
        type: editor.type
        at: { mark: type-t1b }
        cadence: line-by-line
        target: { file: ticket-mcp/server.py, after: "for example T-58213.\")],\n" }
        text: ") -> str:\n    \"\"\"Read one support ticket: its status, township and latest message.\"\"\"\n    return ticket_summary(ticket_id)\n"
      - id: expect-t1
        type: expect.file
        at: { afterAction: type-t1b }
        path: ticket-mcp/server.py
        contains: "def get_ticket(\n    ticket_id: Annotated[str, Field(description=\"Ticket id, for example T-58213.\")],\n) -> str:\n"
      - id: sel-name
        type: editor.select
        at: { mark: sel-name }
        target:
          file: ticket-mcp/server.py
          text: "def get_ticket("
      - id: sel-doc
        type: editor.select
        at: { mark: sel-doc }
        target:
          file: ticket-mcp/server.py
          text: '"""Read one support ticket: its status, township and latest message."""'

  - id: schema
    chapter: Model မြင်တဲ့ tool
    narration: >
      [[mark:t-open]] SDK က ဒီ function ကနေ ဘာတွေ ဖတ်ယူလဲ ဆိုတာကို ဆွဲကြည့်ရအောင်။
      [[mark:t-1]] function ရဲ့ နာမည်က tool ရဲ့ name ဖြစ်လာပါတယ်။
      [[mark:t-2]] docstring က description ဖြစ်လာပါတယ်။ ပြီးခဲ့တဲ့ lesson က tools list ကို ခေါ်တဲ့အခါ model ဆီ
      ရောက်သွားတာ ဒီ နှစ်ခုပါ။
      [[mark:t-3]] type hint နဲ့ Field ကတော့ input schema ဖြစ်လာပါတယ်။ SDK က type hint ကနေ JSON Schema ကို ထုတ်ပေးပြီး၊
      Field ထဲက description ကို argument တစ်ခုစီရဲ့ ရှင်းလင်းချက်အဖြစ် ထည့်ပေးပါတယ်။ default မရှိတဲ့ parameter တွေက
      မဖြစ်မနေ ပေးရမယ့် argument ဖြစ်ပါတယ်။
      [[mark:t-note]] ဆိုလိုတာက JSON Schema ကို လက်နဲ့ ရေးစရာ မလိုပါဘူး။ tool definition နဲ့ tool ကို run တဲ့ code က
      function တစ်ခုတည်းမှာ ရှိနေလို့ နှစ်ခု ကွဲသွားစရာ မရှိပါဘူး။ Reply assistant မှာ tool definition ကို လက်နဲ့
      ရေးခဲ့ရတာနဲ့ ယှဉ်ကြည့်ရင် ဒီ ကွာခြားချက်ကို မြင်ရပါတယ်။ type hint တွေက မှတ်ချက် သက်သက် မဟုတ်ဘဲ client နဲ့ server
      ကြားက သဘောတူညီချက် ဖြစ်သွားတာပါ။
      [[mark:t-result]] tool ရဲ့ ရလဒ်မှာ အပိုင်း နှစ်ခု ပါပါတယ်။ content က model ဖတ်ဖို့ စာ ဖြစ်ပြီး၊ structured content က
      application အတွက် type ပါတဲ့ data ပါ။ string ပြန်ပေးတဲ့ function ဆိုရင် အဲဒီ string ကို result ဆိုတဲ့ key အောက်မှာ
      ထည့်ပေးပါတယ်။
    sources:
      - {
          title: "MCP Python SDK: Tools",
          url: "https://py.sdk.modelcontextprotocol.io/servers/tools/",
        }
      - {
          title: "MCP Python SDK: First steps",
          url: "https://py.sdk.modelcontextprotocol.io/get-started/first-steps/",
        }
    actions:
      - {
          id: draw-t-open,
          type: whiteboard.apply,
          at: { mark: t-open },
          open: true,
          clear: true,
          upsertIds: [t-title],
        }
      - {
          id: draw-t-1,
          type: whiteboard.apply,
          at: { mark: t-1 },
          upsertIds: [t-l1, t-a1, t-r1],
          drawMs: 1200,
        }
      - {
          id: draw-t-2,
          type: whiteboard.apply,
          at: { mark: t-2 },
          upsertIds: [t-l2, t-a2, t-r2],
          drawMs: 1200,
        }
      - {
          id: draw-t-3,
          type: whiteboard.apply,
          at: { mark: t-3 },
          upsertIds: [t-l3, t-a3, t-r3],
          drawMs: 1200,
        }
      - {
          id: draw-t-note,
