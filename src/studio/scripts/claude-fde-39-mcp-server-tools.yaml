      ticket-mcp/backends.py: |
        """Read-only calls to Naychi Fiber's internal Ticket system and NMS APIs."""
        import json
        import os
        from urllib.error import HTTPError
        from urllib.parse import quote
        from urllib.request import urlopen

        from mcp.server.mcpserver.exceptions import ToolError

        TICKETS_API = os.environ["TICKETS_API_URL"]
        NMS_API = os.environ["NMS_API_URL"]


        def ticket_summary(ticket_id: str) -> str:
            try:
                with urlopen(f"{TICKETS_API}/tickets/{quote(ticket_id)}") as resp:
                    t = json.load(resp)
            except HTTPError as e:
                if e.code == 404:
                    raise ToolError(f"No ticket {ticket_id}. Ids look like T-58213.") from e
                raise
            return f"{t['id']} | {t['status']} | {t['township']}\n{t['last_message']}"


        def outage_status(township: str) -> str:
            with urlopen(f"{NMS_API}/outages?township={quote(township)}") as resp:
                o = json.load(resp)
            if not o["active"]:
                return f"No outage in {township} now."
            return f"Outage in {township} since {o['since']}."
      ticket-mcp/server.py: |
        """ticket-mcp: read-only tools for Naychi Fiber's Ticket system and NMS."""
        from typing import Annotated

        from pydantic import Field

        from mcp.server import MCPServer
        from mcp.types import ToolAnnotations

        from backends import outage_status, ticket_summary

        mcp = MCPServer("ticket-mcp")


        if __name__ == "__main__":
            mcp.run()
