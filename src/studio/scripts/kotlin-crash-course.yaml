  - id: higherorder
    narration: >
      Map and filter take lambdas. You can write functions that do the same.
      [[mark:type-hof]] Here are two. [[mark:select-hof]] applyTwice declares a
      parameter whose type is a function: takes an Int, returns an Int. That's
      all a higher-order function is. [[mark:select-extlambda]] The second one
      is a receiver lambda — inside that block, this is the StringBuilder, so
      you call append with no prefix. It's how apply itself is written, and how
      most Kotlin builders work. [[mark:type-use-hof]] Let's use both.
    sources:
      - {
          title: "Kotlin docs — Higher-order functions",
          url: "https://kotlinlang.org/docs/lambdas.html#higher-order-functions",
        }
      - {
          title: "Kotlin docs — Function literals with receiver",
          url: "https://kotlinlang.org/docs/lambdas.html#function-literals-with-receiver",
        }
