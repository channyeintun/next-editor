scenes:
  - id: history
    narration: >
      [[mark:draw-2011]] Kotlin comes from JetBrains, the company that makes
      IntelliJ. They started building it in 2010, and showed it to the world in
      2011. [[mark:draw-2016]] Version one point zero arrived in February 2016.
      That's when the language settled down, and promised to stop breaking your
      code. [[mark:draw-2019]] Then Google made Kotlin its preferred language
      for Android, and a lot of people arrived at once.
      [[mark:draw-2024]] In 2024, version two brought a new compiler.
      [[mark:draw-2026]] And today we're on two point four.
      [[mark:draw-hist-note]] It's been open source the whole way.
    sources:
      - {
          title: "Kotlin — 10 Years of Kotlin: the past",
          url: "https://kotlinlang.org/lp/10yearsofkotlin/past/",
        }
      - { title: "Kotlin docs — FAQ", url: "https://kotlinlang.org/docs/faq.html" }
      - { title: "Android Developers — Kotlin", url: "https://developer.android.com/kotlin" }
    actions:
      # Both land in the two quiet seconds the studio reserves before the first
      # dialog, so the panel is open and titled when the voice starts.
      - {
          id: open-board,
          type: whiteboard.apply,
          at: { scene: start, offsetMs: -1700 },
          open: true,
        }
      - {
          id: draw-hist-title,
          type: whiteboard.apply,
          at: { scene: start, offsetMs: -1200 },
          upsertIds: [hist-title, hist-axis],
          drawMs: 900,
        }
      - {
          id: draw-2011,
          type: whiteboard.apply,
          at: { mark: draw-2011 },
          upsertIds: [hist-y1, hist-l1],
          drawMs: 800,
        }
      - {
          id: draw-2016,
          type: whiteboard.apply,
          at: { mark: draw-2016 },
          upsertIds: [hist-y2, hist-l2],
          drawMs: 800,
        }
      - {
          id: draw-2019,
          type: whiteboard.apply,
          at: { mark: draw-2019 },
          upsertIds: [hist-y3, hist-l3],
          drawMs: 800,
        }
      - {
          id: draw-2024,
          type: whiteboard.apply,
          at: { mark: draw-2024 },
          upsertIds: [hist-y4, hist-l4],
          drawMs: 800,
        }
      - {
          id: draw-2026,
          type: whiteboard.apply,
          at: { mark: draw-2026 },
          upsertIds: [hist-y5, hist-l5],
          drawMs: 800,
        }
      - {
          id: draw-hist-note,
          type: whiteboard.apply,
          at: { mark: draw-hist-note },
          upsertIds: [hist-note, hist-underline],
          drawMs: 900,
        }

  - id: compiler
    narration: >
      [[mark:draw-comp-src]] So what happens when you press run? The compiler
      reads your Kotlin files. [[mark:draw-comp-k2]] The front end works out
      what every name means, checks the types, and decides whether the program
      holds together. That part was rebuilt for version two, and it's called
      K2. [[mark:draw-comp-targets]] Then a back end turns the result into
      something that runs: bytecode for the JVM and Android, JavaScript for the
      browser, WebAssembly, or native machine code through LLVM.
      [[mark:draw-comp-note]] Same language, same front end, four places to run
      it. We'll stay on the JVM today.
    sources:
      - {
          title: "What's new in Kotlin 2.0.0 — the K2 compiler",
          url: "https://kotlinlang.org/docs/whatsnew20.html",
        }
      - { title: "Kotlin docs — FAQ", url: "https://kotlinlang.org/docs/faq.html" }
    actions:
      # The timeline is wiped — this diagram reuses its canvas.
      - id: draw-comp-src
        type: whiteboard.apply
        at: { mark: draw-comp-src }
        clear: true
        upsertIds: [comp-title, comp-src-box, comp-src-text, comp-arrow-1]
        drawMs: 1600
      - {
          id: draw-comp-k2,
          type: whiteboard.apply,
          at: { mark: draw-comp-k2 },
          upsertIds: [comp-k2-box, comp-k2-text, comp-k2-note],
          drawMs: 1100,
        }
      - id: draw-comp-targets
        type: whiteboard.apply
        at: { mark: draw-comp-targets }
        upsertIds:
          [
            comp-arrow-2,
            comp-jvm-box,
            comp-jvm-text,
            comp-js-box,
            comp-js-text,
            comp-wasm-box,
            comp-wasm-text,
            comp-native-box,
            comp-native-text,
          ]
        drawMs: 2600
      - {
          id: draw-comp-note,
          type: whiteboard.apply,
          at: { mark: draw-comp-note },
          upsertIds: [comp-note, comp-underline],
          drawMs: 900,
        }

  - id: shape
    narration: >
      [[mark:draw-kt-title]] Now, the shape of a Kotlin file.
      [[mark:draw-main]] Fun main is where the program starts,
      [[mark:circle-entry]] and it doesn't have to sit inside a class.
      [[mark:draw-decls]] Functions, classes and values all live at the top
      level of the file. [[mark:draw-note]] That's the first thing to unlearn
      if you're coming from Java. [[mark:to-code]] Let's build the language
      from there.
    sources:
      - {
          title: "Kotlin docs — Basic syntax",
          url: "https://kotlinlang.org/docs/basic-syntax.html",
        }
      - { title: "Kotlin docs — Functions", url: "https://kotlinlang.org/docs/functions.html" }
    actions:
      # The compiler diagram is wiped — this sketch reuses its canvas.
      - id: draw-kt-title
        type: whiteboard.apply
        at: { mark: draw-kt-title }
        clear: true
        upsertIds: [kt-title]
        drawMs: 700
      - {
          id: draw-main,
          type: whiteboard.apply,
          at: { mark: draw-main },
          upsertIds: [kt-main-box, kt-main-text],
          drawMs: 800,
        }
      - {
          id: circle-entry,
          type: whiteboard.apply,
          at: { mark: circle-entry },
          upsertIds: [kt-entry-circle],
          drawMs: 800,
        }
      - {
          id: draw-decls,
          type: whiteboard.apply,
          at: { mark: draw-decls },
          upsertIds: [kt-arrow-1, kt-decl-box, kt-decl-text],
          drawMs: 1100,
        }
      - {
          id: draw-note,
          type: whiteboard.apply,
          at: { mark: draw-note },
          upsertIds: [kt-note, kt-note-underline],
          drawMs: 900,
        }
      - { id: close-board, type: whiteboard.apply, at: { mark: to-code }, open: false }

  - id: values
    narration: >
      [[mark:open-main]] Here's the starting point: a main function, one line
      of output, and nothing else in the file. [[mark:type-values]] Values
      first. We'll name the language, add a version number, and print them
      together. [[mark:select-val]] Val names something that never changes, and
      you'll reach for it almost every time. Var is the one that can be
      reassigned. Neither line names a type, because Kotlin reads it from the
      value on the right.
    sources:
      - {
          title: "Kotlin docs — Variables",
          url: "https://kotlinlang.org/docs/basic-syntax.html#variables",
        }
    actions:
      - { id: open-main, type: workspace.openFile, at: { mark: open-main }, path: Main.kt }
      - id: type-values
        type: editor.type
        at: { mark: type-values, offsetMs: -400 }
        target: { file: Main.kt, after: "    println(\"Kotlin, in one file\")\n", occurrence: 1 }
        cadence: line-by-line
        text: "\n    val language = \"Kotlin\"\n    var release = 2.3\n    println(\"$language $release, ${language.length} letters\")\n    release = 2.4\n    println(\"val stays put, var moved to $release\")\n"
      - id: select-val
        type: editor.select
        at: { mark: select-val }
        target:
          {
            file: Main.kt,
            text: "    val language = \"Kotlin\"\n    var release = 2.3",
            occurrence: 1,
          }

  - id: templates
    narration: >
      Those printed lines are string templates. A dollar sign pulls a value
      straight into the text, and curly braces hold a whole expression.
      [[mark:type-template]] Kotlin two point two added a way to move that
      prefix. [[mark:select-template]] Two dollars now start an interpolation,
      so a single dollar is plain text. That saves a lot of escaping when the
      string is full of currency or shell syntax.
    sources:
      - {
          title: "Kotlin docs — String templates",
          url: "https://kotlinlang.org/docs/strings.html#string-templates",
        }
      - {
          title: "Kotlin docs — Multi-dollar string interpolation",
          url: "https://kotlinlang.org/docs/strings.html#multi-dollar-string-interpolation",
        }
    actions:
      - id: type-template
        type: editor.type
        at: { mark: type-template, offsetMs: -400 }
        target:
          {
            file: Main.kt,
            after: "    println(\"val stays put, var moved to $release\")\n",
            occurrence: 1,
          }
        cadence: block
        text: "    println($$\"\"\"a literal $0 needs no escape when $$language sets the prefix\"\"\")\n"
      - id: select-template
        type: editor.select
        at: { mark: select-template }
        target: { file: Main.kt, text: '$$"""', occurrence: 1 }

  - id: expressions
    narration: >
      [[mark:type-if]] Now, if. [[mark:select-if]] In Kotlin this is an
      expression, not a statement — it produces a value, so era gets whichever
      branch runs. That's why Kotlin has no separate ternary operator. It
      doesn't need one.
    sources:
      - {
          title: "Kotlin docs — If expression",
          url: "https://kotlinlang.org/docs/control-flow.html#if-expression",
        }
    actions:
      - id: type-if
        type: editor.type
        at: { mark: type-if, offsetMs: -400 }
        target:
          {
            file: Main.kt,
            after: "    println($$\"\"\"a literal $0 needs no escape when $$language sets the prefix\"\"\")\n",
            occurrence: 1,
          }
        cadence: line-by-line
        text: "\n    val era = if (release >= 2.0) \"K2 compiler\" else \"legacy\"\n    println(era)\n"
      - id: select-if
        type: editor.select
        at: { mark: select-if }
        target:
          { file: Main.kt, text: 'if (release >= 2.0) "K2 compiler" else "legacy"', occurrence: 1 }

  - id: loops
    narration: >
      [[mark:type-loop]] Ranges and loops go together, and Kotlin gives you a
      couple of ways to walk one. [[mark:select-range]] One dot dot five is a
      range you can loop over, and step jumps through it.
      [[mark:select-while]] While is here too, for counting down to a condition
      instead of walking a sequence. [[mark:select-in]] And the in keyword does
      double duty: it walks a range in a for loop, and it asks whether
      something is contained somewhere.
    sources:
      - {
          title: "Kotlin docs — Ranges and progressions",
          url: "https://kotlinlang.org/docs/ranges.html",
        }
      - {
          title: "Kotlin docs — For loops",
          url: "https://kotlinlang.org/docs/control-flow.html#for-loops",
        }
    actions:
      - id: type-loop
        type: editor.type
        at: { mark: type-loop, offsetMs: -400 }
        target: { file: Main.kt, after: "    println(era)\n", occurrence: 1 }
        cadence: line-by-line
        text: "\n    var sum = 0\n    for (n in 1..5) sum += n\n    var countdown = 3\n    while (countdown > 0) countdown--\n    println(\"sum $sum, ${(1..10 step 3).toList()}, ${\"K\" in language}, countdown $countdown\")\n"
      - id: select-range
        type: editor.select
        at: { mark: select-range }
        target: { file: Main.kt, text: "for (n in 1..5) sum += n", occurrence: 1 }
      - id: select-while
        type: editor.select
        at: { mark: select-while }
        target: { file: Main.kt, text: "while (countdown > 0) countdown--", occurrence: 1 }
      - id: select-in
        type: editor.select
        at: { mark: select-in }
        target: { file: Main.kt, text: '${"K" in language}', occurrence: 1 }

  - id: functions
    narration: >
      [[mark:type-funcs]] Functions come in two shapes. [[mark:select-exprbody]]
      When the body is a single expression you write an equals sign and skip
      the braces, and the return type is inferred. [[mark:type-call-funcs]] Now
      let's call them. [[mark:select-default]] Wrap has a default, so you can
      leave it out — and when you do pass it, naming the argument at the call
      site says what it means.
    sources:
      - {
          title: "Kotlin docs — Default arguments",
          url: "https://kotlinlang.org/docs/functions.html#default-arguments",
        }
      - {
          title: "Kotlin docs — Named arguments",
          url: "https://kotlinlang.org/docs/functions.html#named-arguments",
        }
    actions:
      - id: type-funcs
        type: editor.type
        at: { mark: type-funcs, offsetMs: -400 }
        target:
          {
            file: Main.kt,
            after: "    println(\"sum $sum, ${(1..10 step 3).toList()}, ${\"K\" in language}, countdown $countdown\")\n}\n",
            occurrence: 1,
          }
        cadence: block
        text: "\nfun area(width: Int, height: Int) = width * height\n\nfun tag(text: String, wrap: String = \"_\") = \"$wrap$text$wrap\"\n"
      - id: select-exprbody
        type: editor.select
        at: { mark: select-exprbody }
        target:
          {
            file: Main.kt,
            text: "fun area(width: Int, height: Int) = width * height",
            occurrence: 1,
          }
      - id: type-call-funcs
        type: editor.type
        at: { mark: type-call-funcs }
        target:
          {
            file: Main.kt,
            after: "    println(\"sum $sum, ${(1..10 step 3).toList()}, ${\"K\" in language}, countdown $countdown\")\n",
            occurrence: 1,
          }
        cadence: line-by-line
        text: "\n    println(area(3, 4))\n    println(\"${tag(\"hi\")} ${tag(\"hi\", wrap = \"**\")}\")\n"
      - id: select-default
        type: editor.select
        at: { mark: select-default }
        target: { file: Main.kt, text: 'wrap: String = "_"', occurrence: 1 }

  - id: varargs
    narration: >
      [[mark:type-vararg]] A parameter marked vararg takes any number of
      arguments. [[mark:select-vararg]] Inside the function, parts is an array,
      so joinToString works on it directly.
      [[mark:type-call-vararg]] Three arguments here, but it would take one, or
      ten.
    sources:
      - {
          title: "Kotlin docs — Variable number of arguments (varargs)",
          url: "https://kotlinlang.org/docs/functions.html#variable-number-of-arguments-varargs",
        }
    actions:
      - id: type-vararg
        type: editor.type
        at: { mark: type-vararg, offsetMs: -400 }
        target:
          {
            file: Main.kt,
            after: "fun tag(text: String, wrap: String = \"_\") = \"$wrap$text$wrap\"\n",
            occurrence: 1,
          }
        cadence: block
        text: "\nfun joinAll(vararg parts: String) = parts.joinToString(\"-\")\n"
      - id: select-vararg
        type: editor.select
        at: { mark: select-vararg }
        target: { file: Main.kt, text: "vararg parts: String", occurrence: 1 }
      - id: type-call-vararg
        type: editor.type
        at: { mark: type-call-vararg }
        target:
          {
            file: Main.kt,
            after: "    println(\"${tag(\"hi\")} ${tag(\"hi\", wrap = \"**\")}\")\n",
            occurrence: 1,
          }
        cadence: line-by-line
        text: "    println(joinAll(\"red\", \"green\", \"blue\"))\n"

  - id: dataclass
    narration: >
      [[mark:type-point]] A data class is a class you keep values in.
      [[mark:type-use-point]] Kotlin writes the useful parts for you.
      [[mark:select-copy]] Copy builds a changed version without touching the
      original, and it takes named arguments too. [[mark:select-destructure]]
      This line pulls the properties out into two variables. And equals compares
      the values, so two points built the same way are equal.
    sources:
      - {
          title: "Kotlin docs — Data classes",
          url: "https://kotlinlang.org/docs/data-classes.html",
        }
      - {
          title: "Kotlin docs — Destructuring declarations",
          url: "https://kotlinlang.org/docs/destructuring-declarations.html",
        }
    actions:
      - id: type-point
        type: editor.type
        at: { mark: type-point, offsetMs: -400 }
        target:
          {
            file: Main.kt,
            after: "fun joinAll(vararg parts: String) = parts.joinToString(\"-\")\n",
            occurrence: 1,
          }
        cadence: block
        text: "\ndata class Point(val x: Int, val y: Int)\n"
      - id: type-use-point
        type: editor.type
        at: { mark: type-use-point }
        target:
          {
            file: Main.kt,
            after: "    println(joinAll(\"red\", \"green\", \"blue\"))\n",
            occurrence: 1,
          }
        cadence: block
        text: "\n    val start = Point(3, 4)\n    val moved = start.copy(y = 10)\n    val (x, y) = moved\n    println(\"$moved x=$x y=$y equal=${start == Point(3, 4)}\")\n"
      - id: select-copy
        type: editor.select
        at: { mark: select-copy }
        target: { file: Main.kt, text: "start.copy(y = 10)", occurrence: 1 }
      - id: select-destructure
        type: editor.select
        at: { mark: select-destructure }
        target: { file: Main.kt, text: "val (x, y) = moved", occurrence: 1 }

  - id: collections
    narration: >
      [[mark:type-collections]] Lists, sets and maps have two versions each.
      [[mark:select-listof]] listOf gives you a read-only view — there's no add
      method on it. You ask for mutableListOf when you want to change one.
      That's a habit worth keeping: start read-only, and widen it when you have
      to.
    sources:
      - {
          title: "Kotlin docs — Collections overview",
          url: "https://kotlinlang.org/docs/collections-overview.html",
        }
    actions:
      - id: type-collections
        type: editor.type
        at: { mark: type-collections, offsetMs: -400 }
        target:
          {
            file: Main.kt,
            after: "    println(\"$moved x=$x y=$y equal=${start == Point(3, 4)}\")\n",
            occurrence: 1,
          }
        cadence: block
        text: "\n    val langs = listOf(\"Kotlin\", \"Java\", \"Scala\")\n    val sizes = mapOf(\"Kotlin\" to 6, \"Java\" to 4)\n    println(\"${langs.size} ${sizes[\"Kotlin\"]} ${setOf(1, 1, 2)}\")\n"
      - id: select-listof
        type: editor.select
        at: { mark: select-listof }
        target: { file: Main.kt, text: 'listOf("Kotlin", "Java", "Scala")', occurrence: 1 }

  - id: infix
    narration: >
      [[mark:select-to]] Look at that map again. The word to, sitting between
      the key and the value, is a normal function called with infix notation:
      no dot, no brackets. [[mark:type-infix]] You can write your own.
      [[mark:select-infix]] Mark a single-argument member or extension function
      infix, and callers get that spelling. [[mark:type-use-infix]] So two pow
      ten reads like an operator, but it's a function you control.
    sources:
      - {
          title: "Kotlin docs — Infix notation",
          url: "https://kotlinlang.org/docs/functions.html#infix-notation",
        }
      - {
          title: "Kotlin API — to",
          url: "https://kotlinlang.org/api/core/kotlin-stdlib/kotlin/to.html",
        }
    actions:
      - id: select-to
        type: editor.select
        at: { mark: select-to }
        target: { file: Main.kt, text: '"Kotlin" to 6', occurrence: 1 }
      - id: type-infix
        type: editor.type
        at: { mark: type-infix, offsetMs: -400 }
        target:
          { file: Main.kt, after: "data class Point(val x: Int, val y: Int)\n", occurrence: 1 }
        cadence: block
        text: "\ninfix fun Int.pow(exp: Int): Int {\n    var result = 1\n    repeat(exp) { result *= this }\n    return result\n}\n"
      - id: select-infix
        type: editor.select
        at: { mark: select-infix }
        target: { file: Main.kt, text: "infix fun Int.pow(exp: Int)", occurrence: 1 }
      - id: type-use-infix
        type: editor.type
        at: { mark: type-use-infix }
        target:
          {
            file: Main.kt,
            after: "    println(\"${langs.size} ${sizes[\"Kotlin\"]} ${setOf(1, 1, 2)}\")\n",
            occurrence: 1,
          }
        cadence: line-by-line
        text: "\n    println(\"2 pow 10 = ${2 pow 10}\")\n"

  - id: enums
    narration: >
      [[mark:type-enum]] An enum class is a fixed set of instances.
      [[mark:select-enum-prop]] Each constant can carry data and behaviour —
      these three each hold a weight, and they share a label function.
      [[mark:type-use-enum]] Entries gives you all of them in order. It replaced
      the older values method back in Kotlin one point nine, and it's the one to
      reach for now.
    sources:
      - {
          title: "Kotlin docs — Enum classes",
          url: "https://kotlinlang.org/docs/enum-classes.html",
        }
      - {
          title: "Kotlin docs — Working with enum constants",
          url: "https://kotlinlang.org/docs/enum-classes.html#working-with-enum-constants",
        }
    actions:
      - id: type-enum
        type: editor.type
        at: { mark: type-enum, offsetMs: -400 }
        target:
          {
            file: Main.kt,
            after: "infix fun Int.pow(exp: Int): Int {\n    var result = 1\n    repeat(exp) { result *= this }\n    return result\n}\n",
            occurrence: 1,
          }
        cadence: block
        text: "\nenum class Level(val weight: Int) {\n    LOW(1), MEDIUM(5), HIGH(10);\n\n    fun label() = \"$name=$weight\"\n}\n"
      - id: select-enum-prop
        type: editor.select
        at: { mark: select-enum-prop }
        target: { file: Main.kt, text: "LOW(1), MEDIUM(5), HIGH(10);", occurrence: 1 }
      - id: type-use-enum
        type: editor.type
        at: { mark: type-use-enum }
        target: { file: Main.kt, after: "    println(\"2 pow 10 = ${2 pow 10}\")\n", occurrence: 1 }
        cadence: line-by-line
        text: "\n    println(Level.entries.map { it.label() })\n"

  - id: nullability
    narration: >
      Now the part Kotlin is best known for. [[mark:draw-null]] String and
      String with a question mark are two different types.
      [[mark:draw-null-note]] The compiler won't let you mix them up, so a null
      can't reach code that never expected one. [[mark:close-null]]
      [[mark:type-null]] Here's how you work with the nullable one.
      [[mark:select-safe]] Question mark dot returns null instead of calling
      into nothing, [[mark:select-elvis]] and the elvis operator supplies a
      value when it does. [[mark:type-bang]] And there's an escape hatch.
      [[mark:select-bang]] Two exclamation marks say "trust me, this isn't
      null", and throw if you're wrong. Use it when you know something the
      compiler can't — and expect to be wrong sometimes.
    sources:
      - { title: "Kotlin docs — Null safety", url: "https://kotlinlang.org/docs/null-safety.html" }
      - {
          title: "Kotlin docs — Not-null assertion operator",
          url: "https://kotlinlang.org/docs/null-safety.html#not-null-assertion-operator",
        }
    actions:
      - {
          id: open-null-board,
          type: whiteboard.apply,
          at: { mark: draw-null, offsetMs: -700 },
          open: true,
        }
      # The sealed sketch comes later — this diagram reuses the cleared canvas.
      - id: draw-null
        type: whiteboard.apply
        at: { mark: draw-null }
        clear: true
        upsertIds: [nl-title, nl-box-1, nl-text-1, nl-note-1, nl-box-2, nl-text-2, nl-note-2]
        drawMs: 2300
      - {
          id: draw-null-note,
          type: whiteboard.apply,
          at: { mark: draw-null-note },
          upsertIds: [nl-note, nl-underline],
          drawMs: 900,
        }
      - { id: close-null-board, type: whiteboard.apply, at: { mark: close-null }, open: false }
      - id: type-null
        type: editor.type
        at: { mark: type-null }
        target:
          { file: Main.kt, after: "    println(Level.entries.map { it.label() })\n", occurrence: 1 }
        cadence: line-by-line
        text: "\n    val absent: String? = null\n    println(\"${absent?.length ?: -1} ${absent?.let { \"found\" } ?: \"nothing\"}\")\n"
      - id: select-safe
        type: editor.select
        at: { mark: select-safe }
        target: { file: Main.kt, text: "absent?.length", occurrence: 1 }
      - id: select-elvis
        type: editor.select
        at: { mark: select-elvis }
        target: { file: Main.kt, text: "?: -1", occurrence: 1 }
      - id: type-bang
        type: editor.type
        at: { mark: type-bang }
        target:
          {
            file: Main.kt,
