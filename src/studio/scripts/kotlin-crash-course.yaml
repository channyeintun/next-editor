      - {
          title: "Kotlin docs — Delegated properties",
          url: "https://kotlinlang.org/docs/delegated-properties.html",
        }
      - {
          title: "Kotlin docs — Late-initialized properties",
          url: "https://kotlinlang.org/docs/properties.html#late-initialized-properties-and-variables",
        }
