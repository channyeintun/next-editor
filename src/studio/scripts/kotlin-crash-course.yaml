  - id: generics
    narration: >
      [[mark:type-generics]] Generics let one function serve many types.
      [[mark:select-constraint]] The constraint is the interesting part: T has
      to be Comparable, so the body can call max on it.
      [[mark:type-use-generics]] One function, ints and strings, nothing to
      convert. [[mark:type-reified]] Now a harder one. Normally a generic type
      is erased at runtime, so you can't ask what T was.
      [[mark:select-reified]] Mark the function inline and the parameter
      reified, and you can — the compiler pastes the real type in at every call
      site. [[mark:type-use-reified]] So this picks the strings out of a mixed
      list.
    sources:
      - { title: "Kotlin docs — Generics", url: "https://kotlinlang.org/docs/generics.html" }
      - {
          title: "Kotlin docs — Reified type parameters",
          url: "https://kotlinlang.org/docs/inline-functions.html#reified-type-parameters",
