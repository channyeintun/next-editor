  - id: lazydelegate
    narration: >
      [[mark:type-settings]] A property can hand its work to something else.
      [[mark:select-lazy]] By lazy runs that block the first time you read the
      property, then remembers the answer. [[mark:type-use-settings]] It's the
      tidy way to defer expensive setup. [[mark:type-lateinit]] When the value
      arrives later from outside, lateinit is the other tool.
      [[mark:select-lateinit]] It lets a non-null var start empty, and you can
      ask whether it's been set yet. Read it too early and it throws, which is
      the trade you're making.
