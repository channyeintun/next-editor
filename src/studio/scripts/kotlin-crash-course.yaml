  - id: sealedwhen
    narration: >
      [[mark:type-sealed]] A sealed interface fixes the list of types that can
      implement it. [[mark:draw-sealed]] Shape has exactly two, and the compiler
      knows both. [[mark:draw-sealed-note]] So a when over a Shape needs no else
      branch — cover every case and it's complete. Miss one and you get an
      error, not a surprise at runtime. [[mark:close-sealed]]
      [[mark:select-dataobject]] Origin is a data object: a single instance,
      with a readable toString. That arrived in Kotlin one point nine.
      [[mark:select-guard]] And this is newer still. A guard condition adds an
      if to a branch, so two branches can test the same type and pick on the
      value. [[mark:type-use-sealed]] Let's call it three times.
    sources:
      - {
          title: "Kotlin docs — Sealed classes and interfaces",
          url: "https://kotlinlang.org/docs/sealed-classes.html",
        }
      - {
          title: "Kotlin docs — Data objects",
          url: "https://kotlinlang.org/docs/object-declarations.html#data-objects",
        }
      - {
          title: "Kotlin docs — Guard conditions in when expressions",
          url: "https://kotlinlang.org/docs/control-flow.html#guard-conditions-in-when-expressions",
        }
    actions:
