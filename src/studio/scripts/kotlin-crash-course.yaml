            occurrence: 1,
          }
        cadence: block
        text: "\n    println(langs.map { it.length })\n    println(langs.filter { it.length > 4 })\n    println(\"${langs.fold(0) { acc, s -> acc + s.length }} ${langs.map(String::uppercase)}\")\n"
