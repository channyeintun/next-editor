# Kotlin crash course — the whole language in one file, built from a bare main.
#
# Structured after Atomic Kotlin's seven sections (Programming Basics,
# Introduction to Objects, Usability, Functional Programming,
# Object-Oriented Programming, Preventing Failure, Power Tools), then brought
# forward to the Kotlin the compiler actually accepts today. The book stops at
# Kotlin 1.5 (2021); this lesson runs on 2.4.10, the version the Playground
# proxy pins, so it also teaches what landed since: the K2 compiler, `data
# object`, guard conditions in `when`, multi-dollar string interpolation, and
# coroutines — which the book never covers at all.
#
# Covers, in order: val/var and type inference; string templates and the
# multi-dollar prefix; `if` as an expression; ranges, `for`, `while` and `in`;
# expression-bodied functions with default and named arguments; `vararg`; data
# classes with copy/destructuring/equality; read-only and mutable collections;
# infix notation (starting from the `to` already on screen in `mapOf`); enum
# classes with a constructor property and `entries`; nullable types with `?.`,
# `?:`, `?.let` and `!!`; extension functions and properties; a sealed
# interface with a `data object` and an exhaustive `when` carrying a guard
# condition; lambdas, `it`, and member references; hand-written higher-order
# functions and a receiver lambda (`StringBuilder.() -> Unit`); lazy sequences;
# interfaces, abstract classes and polymorphism; class delegation with `by`; a
# companion object behind a private constructor plus a plain `object`
# singleton; operator overloading; `by lazy` and `lateinit`; a generic function
# with a `Comparable` constraint and an `inline`/`reified` one; `require`
# inside `runCatching` and `try` as an expression; the `apply` scope function;
# `suspend` functions run concurrently with `async`/`awaitAll`; and finally
# `typealias`, an `@JvmInline value class`, and context parameters (Stable in
# 2.4). Then it runs the lot.
#
# Coverage is checked against Atomic Kotlin's atom list, not by eye: an earlier
# draft silently skipped infix, enums, higher-order declarations, vararg,
# try/catch, `object`, `lateinit`, `!!`, `while` and reified — including the
# especially bad case of using infix `to` on screen without ever naming it.
#
# Insert-only, including the `import` line, which is inserted at the top of the
# file at the moment coroutines need it — the way a developer adds one. Each
# topic inserts its top-level declaration at the end of the file first, then
# the call in main, so every anchor is the previous topic's last line and stays
# predictable. `operator fun plus` is the one exception: it is inserted into
# Point's existing header line, turning `data class Point(...)` into a body,
# which insert-only edits allow because nothing is removed.
#
# The program is verified against the real Kotlin Playground compiler
# (api.kotlinlang.org 2.4.10, confType java — the exact endpoint the worker
# proxies), not read off the page: zero errors, zero warnings, and three runs
# produce identical bytes. Nothing printed depends on scheduling — awaitAll
# returns results in the order the coroutines were started.
#
# Opens on the history the book's 2021 edition could not have: the timeline
# from the 2011 announcement to 2.4, then how the compiler itself works —
# one K2 front end feeding four back ends (JVM/Android, JS, Wasm, Native).
#
# Six drawn boards, wiped between topics with `clear: true`: the timeline, the
# compiler, the shape of a Kotlin file, the nullable/non-nullable type split,
# the sealed hierarchy, and coroutines fanning out. The first open and the last
# close sit inside the studio's quiet recording handles, so the voice never
# starts or ends over a panel animation.
#
# Boards are authored for Excalidraw's dark theme, which inverts colors, so the
# mid-tone palette (#1971c2, #2f9e44, #f08c00, #e03131, #9c36b5) draws as the
# lighter version of the same hue and #1e1e1e draws as white — see the note
# above `whiteboardAssets` for what each color means.
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/kotlin-crash-course.yaml
schemaVersion: 1

