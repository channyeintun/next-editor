  - id: lambdas
    narration: >
      [[mark:type-lambdas]] Lambdas go in curly braces. [[mark:select-it]] When
      a lambda takes one argument you can leave it unnamed and call it it.
      [[mark:select-fold]] Fold carries a running value through the collection,
      which is how sum and count and join are all built.
      [[mark:select-memberref]] And when the lambda would only call one
      function, a member reference names that function instead.
    sources:
      - {
          title: "Kotlin docs — Lambda expressions",
          url: "https://kotlinlang.org/docs/lambdas.html",
        }
      - {
          title: "Kotlin docs — Collection operations",
