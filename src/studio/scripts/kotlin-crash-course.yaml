  - id: oop
    narration: >
      [[mark:type-oop]] Interfaces name behaviour, and an abstract class can
      carry some of it. [[mark:select-abstract]] Animal fills in label and
      intro, and leaves speak to whoever extends it.
      [[mark:select-override]] Override is a keyword you have to write —
      Kotlin won't let you shadow a method by accident.
      [[mark:type-use-oop]] Both animals go into one list typed as Speaker, and
      each one answers for itself.
    sources:
      - { title: "Kotlin docs — Interfaces", url: "https://kotlinlang.org/docs/interfaces.html" }
      - { title: "Kotlin docs — Inheritance", url: "https://kotlinlang.org/docs/inheritance.html" }
    actions:
      - id: type-oop
        type: editor.type
        at: { mark: type-oop, offsetMs: -400 }
        target:
          {
            file: Main.kt,
            after: "fun buildLabel(build: StringBuilder.() -> Unit): String = StringBuilder().apply(build).toString()\n",
            occurrence: 1,
          }
        cadence: block
        text: "\ninterface Speaker {\n    fun speak(): String\n    fun label(): String\n}\n\nabstract class Animal(private val species: String) : Speaker {\n    override fun label() = species\n    fun intro() = \"$species says ${speak()}\"\n}\n\nclass Parrot : Animal(\"parrot\") {\n    override fun speak() = \"squawk\"\n}\n\nclass Cow : Animal(\"cow\") {\n    override fun speak() = \"moo\"\n}\n"
      - id: select-abstract
        type: editor.select
        at: { mark: select-abstract }
        target:
          {
            file: Main.kt,
            text: "abstract class Animal(private val species: String) : Speaker {",
            occurrence: 1,
          }
      - id: select-override
        type: editor.select
        at: { mark: select-override }
        target: { file: Main.kt, text: '    override fun speak() = "squawk"', occurrence: 1 }
      - id: type-use-oop
        type: editor.type
        at: { mark: type-use-oop }
        target:
          {
            file: Main.kt,
            after: "    println(generateSequence(1) { it * 2 }.take(5).toList())\n",
            occurrence: 1,
          }
        cadence: line-by-line
        text: "\n    val animals: List<Speaker> = listOf(Parrot(), Cow())\n    println(\"${animals.map { it.speak() }} ${Parrot().intro()}\")\n"

  - id: delegation
    narration: >
      [[mark:type-delegate]] Kotlin would rather you compose than inherit, and
      it has a keyword for it. [[mark:select-by]] By inner means every Speaker
      method is forwarded to inner, for free. Megaphone overrides speak and
      writes nothing else — [[mark:type-use-delegate]] so label still comes
      from the parrot it wraps.
    sources:
      - { title: "Kotlin docs — Delegation", url: "https://kotlinlang.org/docs/delegation.html" }
    actions:
      - id: type-delegate
        type: editor.type
        at: { mark: type-delegate, offsetMs: -400 }
        target:
          {
            file: Main.kt,
            after: "class Cow : Animal(\"cow\") {\n    override fun speak() = \"moo\"\n}\n",
            occurrence: 1,
          }
        cadence: block
        text: "\nclass Megaphone(private val inner: Speaker) : Speaker by inner {\n    override fun speak() = inner.speak().uppercase()\n}\n"
      - id: select-by
        type: editor.select
        at: { mark: select-by }
        target: { file: Main.kt, text: ": Speaker by inner", occurrence: 1 }
      - id: type-use-delegate
        type: editor.type
        at: { mark: type-use-delegate }
        target:
          {
            file: Main.kt,
            after: "    println(\"${animals.map { it.speak() }} ${Parrot().intro()}\")\n",
            occurrence: 1,
          }
        cadence: line-by-line
        text: "\n    val loud = Megaphone(Parrot())\n    println(\"${loud.speak()} ${loud.label()}\")\n"

  - id: companion
    narration: >
      [[mark:type-session]] Kotlin has no static keyword.
      [[mark:select-companion]] A companion object holds what belongs to the
      class rather than to one instance, and it's a real object you can pass
      around. [[mark:select-private-ctor]] This constructor is private, so open
      is the only way in. [[mark:type-use-session]] Two sessions, and the count
      they share. [[mark:type-object]] And a plain object declaration is a
      singleton on its own — [[mark:select-object]] one instance, created the
      first time you touch it, no class needed.
      [[mark:type-use-object]] Same object both times, so the count keeps
      climbing.
    sources:
      - {
          title: "Kotlin docs — Companion objects",
          url: "https://kotlinlang.org/docs/object-declarations.html#companion-objects",
        }
      - {
