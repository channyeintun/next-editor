            occurrence: 1,
          }
        cadence: line-by-line
        text: "    println(onlyOf<String>(listOf(1, \"a\", 2, \"b\")))\n"

  - id: failure
    narration: >
      [[mark:type-halve]] Kotlin has exceptions, and it also has a way to keep
      them as values. [[mark:select-require]] Require throws when the condition
      fails, and states what was expected. [[mark:select-runcatching]]
      runCatching wraps the whole block in a Result, so the caller gets success
      or failure to inspect instead of a thrown exception to catch.
      [[mark:type-use-halve]] Here's one of each. [[mark:type-trycatch]] And
      when you do want to catch, try is an expression like everything else.
      [[mark:select-trycatch]] Whichever branch runs, its value becomes the
      result — so a parse with a fallback is one expression, no temporary
      variable.
    sources:
      - { title: "Kotlin docs — Exceptions", url: "https://kotlinlang.org/docs/exceptions.html" }
      - {
          title: "Kotlin docs — Try as an expression",
          url: "https://kotlinlang.org/docs/exceptions.html#try-is-an-expression",
        }
      - {
          title: "Kotlin API — runCatching",
          url: "https://kotlinlang.org/api/core/kotlin-stdlib/kotlin/run-catching.html",
        }
    actions:
      - id: type-halve
        type: editor.type
        at: { mark: type-halve, offsetMs: -400 }
        target:
          {
            file: Main.kt,
            after: "inline fun <reified T> onlyOf(items: List<Any>): List<T> = items.filterIsInstance<T>()\n",
            occurrence: 1,
          }
        cadence: block
        text: "\nfun halve(n: Int): Result<Int> = runCatching {\n    require(n % 2 == 0) { \"$n is odd\" }\n    n / 2\n}\n"
      - id: select-require
        type: editor.select
        at: { mark: select-require }
        target: { file: Main.kt, text: 'require(n % 2 == 0) { "$n is odd" }', occurrence: 1 }
      - id: select-runcatching
        type: editor.select
        at: { mark: select-runcatching }
        target: { file: Main.kt, text: "Result<Int> = runCatching", occurrence: 1 }
      - id: type-use-halve
        type: editor.type
        at: { mark: type-use-halve }
        target:
          {
            file: Main.kt,
            after: "    println(onlyOf<String>(listOf(1, \"a\", 2, \"b\")))\n",
            occurrence: 1,
          }
        cadence: line-by-line
        text: "\n    println(\"${halve(7)} ${halve(8)}\")\n"
      - id: type-trycatch
        type: editor.type
        at: { mark: type-trycatch }
        target:
          {
            file: Main.kt,
            after: "fun halve(n: Int): Result<Int> = runCatching {\n    require(n % 2 == 0) { \"$n is odd\" }\n    n / 2\n}\n",
            occurrence: 1,
          }
        cadence: block
        text: "\nfun parseOr(text: String, fallback: Int): Int =\n    try {\n        text.toInt()\n    } catch (e: NumberFormatException) {\n        fallback\n    }\n"
      - id: select-trycatch
        type: editor.select
        at: { mark: select-trycatch }
        target:
          {
            file: Main.kt,
            text: "    try {\n        text.toInt()\n    } catch (e: NumberFormatException) {",
            occurrence: 1,
          }
      - id: type-use-trycatch
        type: editor.type
        at: { mark: select-trycatch, offsetMs: 2600 }
        target:
          { file: Main.kt, after: "    println(\"${halve(7)} ${halve(8)}\")\n", occurrence: 1 }
        cadence: line-by-line
        text: "    println(\"${parseOr(\"12\", 0)} ${parseOr(\"nope\", -1)}\")\n"

  - id: scopefns
    narration: >
      [[mark:type-scope]] Scope functions run a block against an object.
      [[mark:select-apply]] Apply hands you the object as this, then returns it,
      which makes it the one to reach for when you're configuring something.
      Let, run, with and also are the others, and they differ only in what they
      pass and what they give back.
    sources:
      - {
          title: "Kotlin docs — Scope functions",
          url: "https://kotlinlang.org/docs/scope-functions.html",
        }
    actions:
      - id: type-scope
        type: editor.type
        at: { mark: type-scope, offsetMs: -400 }
        target:
          {
            file: Main.kt,
            after: "    println(\"${parseOr(\"12\", 0)} ${parseOr(\"nope\", -1)}\")\n",
            occurrence: 1,
          }
        cadence: block
        text: "\n    val report = StringBuilder().apply {\n        append(\"langs=\")\n        append(langs.size)\n    }.toString()\n    println(report)\n"
      - id: select-apply
        type: editor.select
        at: { mark: select-apply }
        target: { file: Main.kt, text: "StringBuilder().apply {", occurrence: 1 }

  - id: coroutines
    narration: >
      Now the piece that changed Kotlin most, and the one the older books never
      had. [[mark:type-import]] Coroutines need one import.
      [[mark:type-coroutines]] A suspend function can pause without blocking the
      thread it runs on. [[mark:draw-coro]] Async starts each call right away,
      so all three wait at the same time. [[mark:draw-coro-note]] awaitAll
      collects them, and the results come back in the order they were started,
      not the order they finished. [[mark:close-coro]]
      [[mark:type-use-coroutines]] That's the whole idea: concurrent code that
      reads top to bottom.
    sources:
      - {
          title: "Kotlin docs — Coroutines",
          url: "https://kotlinlang.org/docs/coroutines-overview.html",
        }
      - {
          title: "Kotlin docs — Concurrent using async",
          url: "https://kotlinlang.org/docs/composing-suspending-functions.html#concurrent-using-async",
        }
    actions:
      - id: type-import
        type: editor.type
        at: { mark: type-import, offsetMs: -400 }
        target: { file: Main.kt, after: "", occurrence: 1 }
        cadence: block
        text: "import kotlinx.coroutines.*\n\n"
      - id: type-coroutines
        type: editor.type
        at: { mark: type-coroutines }
        target:
          {
            file: Main.kt,
            after: "fun parseOr(text: String, fallback: Int): Int =\n    try {\n        text.toInt()\n    } catch (e: NumberFormatException) {\n        fallback\n    }\n",
            occurrence: 1,
          }
        cadence: block
        text: "\nsuspend fun fetchOne(id: Int): Int {\n    delay(10)\n    return id * id\n}\n\nfun fetchAll(): List<Int> = runBlocking {\n    (1..3).map { async { fetchOne(it) } }.awaitAll()\n}\n"
      - {
          id: open-coro-board,
          type: whiteboard.apply,
          at: { mark: draw-coro, offsetMs: -700 },
          open: true,
        }
      - id: draw-coro
        type: whiteboard.apply
        at: { mark: draw-coro }
        clear: true
        upsertIds:
          [
            co-title,
            co-box-1,
            co-text-1,
            co-box-2,
            co-text-2,
            co-box-3,
            co-text-3,
            co-arrow,
            co-await-box,
            co-await-text,
          ]
        drawMs: 2600
      - {
          id: draw-coro-note,
          type: whiteboard.apply,
          at: { mark: draw-coro-note },
          upsertIds: [co-result, co-note, co-underline],
          drawMs: 1200,
        }
      - { id: close-coro-board, type: whiteboard.apply, at: { mark: close-coro }, open: false }
      - id: type-use-coroutines
        type: editor.type
        at: { mark: type-use-coroutines }
        target: { file: Main.kt, after: "    println(report)\n", occurrence: 1 }
        cadence: line-by-line
        text: "\n    println(fetchAll())\n"

  - id: modern
    narration: >
      Three more that the older books can't have. [[mark:type-modern]] Let's
      put all three in at once. [[mark:select-typealias]] A typealias gives a
      long type a short name —
      handy once function types start appearing in signatures.
      [[mark:select-valueclass]] A value class wraps one value for type safety,
      and the compiler unwraps it where it can, so you get a distinct UserId
      type at close to no cost. [[mark:select-context]] And context parameters,
      which went stable in two point four: the function declares what it needs
      from its surroundings, and callers supply it once instead of threading it
      through every call. [[mark:type-use-modern]] Let's use all three: a
      handler named through the alias, a wrapped id, and a prefix supplied once
      by with.
    sources:
      - {
          title: "What's new in Kotlin 2.4.0 — context parameters",
          url: "https://kotlinlang.org/docs/whatsnew24.html",
        }
      - {
          title: "Kotlin docs — Inline value classes",
          url: "https://kotlinlang.org/docs/inline-classes.html",
        }
      - {
          title: "Kotlin docs — Type aliases",
          url: "https://kotlinlang.org/docs/type-aliases.html",
        }
    actions:
      - id: type-modern
        type: editor.type
        at: { mark: type-modern, offsetMs: -400 }
        target:
          {
            file: Main.kt,
            after: "fun fetchAll(): List<Int> = runBlocking {\n    (1..3).map { async { fetchOne(it) } }.awaitAll()\n}\n",
            occurrence: 1,
          }
        cadence: block
        text: "\ntypealias Handler = (String) -> String\n\n@JvmInline\nvalue class UserId(val raw: Int)\n\ncontext(prefix: String)\nfun stamp(text: String) = \"$prefix$text\"\n"
      - id: select-typealias
        type: editor.select
        at: { mark: select-typealias }
        target: { file: Main.kt, text: "typealias Handler = (String) -> String", occurrence: 1 }
      - id: select-valueclass
        type: editor.select
        at: { mark: select-valueclass }
        target:
          { file: Main.kt, text: "@JvmInline\nvalue class UserId(val raw: Int)", occurrence: 1 }
      - id: select-context
        type: editor.select
        at: { mark: select-context }
        target: { file: Main.kt, text: "context(prefix: String)", occurrence: 1 }
      - id: type-use-modern
        type: editor.type
        at: { mark: type-use-modern }
        target: { file: Main.kt, after: "    println(fetchAll())\n", occurrence: 1 }
        cadence: line-by-line
        text: "\n    val shout: Handler = { it.uppercase() }\n    println(\"${shout(\"done\")} ${UserId(7)}\")\n    with(\"> \") { println(stamp(\"context parameters\")) }\n"

  - id: run
    narration: >
      [[mark:run]] Let's run the whole file. The values, the templates, the if
      expression, the loops and the range. Default arguments, named arguments,
      and the vararg join. The copied point, destructured and equal by value.
      Collections, then two to the tenth through an infix function, then the
      enum. The nullable pair and the forced one. Extensions, and the sealed
      types with the guard picking the big circle. Lambdas, fold, member
      references, our own higher-order functions, the lazy sequence. Both
      animals speaking, the megaphone delegating, sessions and the singleton.
      Added points, the lazy theme, lateinit before and after. Generics, the
      reified filter, a failure and a success, the caught parse. And three
      coroutines in order, then the modern three.
    sources:
      - { title: "Kotlin Playground", url: "https://play.kotlinlang.org/" }
    actions:
      - { id: run, type: runtime.run, at: { mark: run, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-output,
          type: expect.output,
          at: { afterAction: run },
          contains: "2 pow 10 = 1024",
          timeoutMs: 8000,
        }
      - {
          id: expect-file-main,
          type: expect.file,
          at: { afterAction: run },
          path: Main.kt,
          contains: "infix fun Int.pow",
        }

  - id: wrap
    narration: >
      That's the language, in one file. Null safety in the type system, data
      classes and sealed types for the shapes your data takes, infix and
      operator functions for the ones you want to read like notation, and
      coroutines for the work that waits. Kotlin two point four arrived this
      month, and it's still moving — collection literals are in preview right
      now, so square brackets will build a list the way they build one in most
      other languages. Everything else in this lesson is stable today.
    sources:
      - { title: "What's new in Kotlin 2.4.0", url: "https://kotlinlang.org/docs/whatsnew24.html" }
      - {
          title: "Kotlin language features and proposals",
          url: "https://kotlinlang.org/docs/kotlin-language-features-and-proposals.html",
        }
    actions: []
checks:
  - { type: timing.p95Ms, max: 300 }
