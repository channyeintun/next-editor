        cadence: line-by-line
        text: "\n    println(\"${applyTwice(3) { it * 3 }} ${buildLabel { append(language); append(release) }}\")\n"

  - id: sequences
    narration: >
      [[mark:type-seq]] Those list operations each build a new list.
      [[mark:select-seq]] A sequence is the lazy version: it computes one item
      at a time, only as far as you ask. This one is endless, and take five is
      what stops it.
    sources:
      - { title: "Kotlin docs — Sequences", url: "https://kotlinlang.org/docs/sequences.html" }
