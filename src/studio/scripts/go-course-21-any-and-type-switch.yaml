          at: { mark: point-parcel },
          target: { text: "NPT-0001 (Parcel)" },
        }

  - id: assert
    chapter: Type assertion
    narration: >-
      [[mark:collapse-1]] type switch က case အများထဲက ရွေးတာ ဖြစ်ပေမဲ့၊ box ထဲမှာ ဒီ type ပဲ ရှိတယ်လို့ ကိုယ်က
      သေချာတယ် ထင်ရင်တော့ type တစ်ခုတည်းကို တိုက်ရိုက် ယူလို့ ရပါတယ်။ အဲဒါကို type assertion လို့
      ခေါ်ပါတယ်။ [[mark:type-assert]] main ရဲ့ ထိပ်ဆုံးမှာ any variable တစ်ခုထဲကို ပါဆယ် code စာသား
      ထည့်ပါမယ်။ ပြီးတော့ အဲဒီ box ထဲကနေ int ကို ယူပြီး print ထုတ်ပါမယ်။ [[mark:sel-assert]] ဒီ line က box
      ထဲမှာ int ရှိတယ်၊ int အဖြစ် ထုတ်ပေးပါ လို့ ပြောတာပါ။ ဒါပေမဲ့ တကယ်တော့ box ထဲမှာ စာသား ရှိနေပါတယ်။
      compiler ကတော့ ဒါကို မတားပါဘူး၊ box ထဲက type ကို run မှ သိရလို့ပါ။ [[mark:run-2]] ကဲ၊ run
      လိုက်ရအောင်။
    sources:
      - {
          title: "The Go Programming Language Specification — Type assertions",
          url: "https://go.dev/ref/spec#Type_assertions",
        }
    actions:
      - { id: collapse-1, type: runtime.collapseDock, at: { mark: collapse-1 } }
      - id: type-assert
        type: editor.type
        at: { mark: type-assert }
        target: { file: main.go, after: "func main() {\n", occurrence: 1 }
        text: "\tvar v any = \"MDY-0001\"\n\tn := v.(int)\n\tfmt.Println(n)\n"
        cadence: line-by-line
      - id: sel-assert
        type: editor.select
        at: { mark: sel-assert }
        target: { file: main.go, text: "n := v.(int)", occurrence: 1 }
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "interface conversion",
          timeoutMs: 8000,
        }

  - id: panic
    narration: >-
      [[mark:point-panic]] program က panic ဖြစ်ပြီး ရပ်သွားပါတယ်။ compile ကတော့ လက်ခံသွားပေမဲ့ run နေတုန်း
      main ဖိုင်ရဲ့ line နှစ်ဆယ့်တစ်၊ int ကို ယူတဲ့ line မှာ ရပ်သွားတာပါ။ ပထမ စာကြောင်းက ဆိုလိုတာက၊ box ထဲမှာ
      string ရှိနေတာကို int လို့ ယူလိုက်လို့ program ရပ်သွားတာပါ။ အဲဒီ line ရဲ့ အောက်က code တွေလည်း run
      မသွားတော့လို့ type switch ရဲ့ output တစ်ကြောင်းမှ မထွက်တော့ပါဘူး။ [[mark:board-assert]] ဒါကို board နဲ့ ကြည့်ရအောင်။ [[mark:draw-claim]] type
      assertion က box ကို ဖွင့်ခင် တံဆိပ်ကို စစ်ပါတယ်။ တံဆိပ်က string ဖြစ်နေလို့ string လို့ ယူရင် ရပေမဲ့၊ int
      လို့ ယူရင်တော့ panic ဖြစ်ပါတယ်။ [[mark:draw-ok]] panic မဖြစ်စေချင်ရင် ok ပါတဲ့ ပုံစံကို သုံးပါတယ်။ ဒီ
      ပုံစံက မယူခင် အရင် မေးတာပါ။ type ကိုက်ရင် တန်ဖိုးနဲ့ true ကို ပေးပြီး၊ မကိုက်ရင်တော့ zero value နဲ့ false
      ကို ပေးပါတယ်။ lesson ဆယ့်သုံးမှာ map ထဲမှာ key ရှိမရှိ မေးခဲ့တဲ့ ပုံစံနဲ့ တူပါတယ်။
    sources:
      - {
          title: "The Go Programming Language Specification — Type assertions",
          url: "https://go.dev/ref/spec#Type_assertions",
        }
      - {
          title: "Effective Go — Interface conversions and type assertions",
          url: "https://go.dev/doc/effective_go#interface_conversions",
        }
    actions:
      - {
          id: point-panic,
          type: console.point,
          at: { mark: point-panic },
          target: { text: "panic: interface conversion" },
        }
      - { id: collapse-2, type: runtime.collapseDock, at: { mark: board-assert } }
      - {
          id: board-assert,
