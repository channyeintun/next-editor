# Go course, lesson 21: any and type switches (Burmese).
#
# Start state: main.go (`package main`, `import "fmt"`, an empty main) and parcel.go pinned from
# lesson 19 (COURSE-KIT §3.4).
# Edits, all insert-only:
#   1. main: a []any of three values (6000, "MDY-0001", a Parcel) and a loop calling describe;
#      describe(v any) with a type switch above main -> run-1: 6000 ကျပ် (int) / MDY-0001 (string)
#      / NPT-0001 (Parcel);
#   2. the top of main: `var v any = "MDY-0001"`, `n := v.(int)`, its Println -> run-2: panic
#      `interface conversion: interface {} is string, not int` (nothing printed before it);
#   3. `// ` before the bad assertion, `n, ok := v.(int)`, `, ok` into the Println, and the string
#      form -> run-3: 0 false / MDY-0001 true / the three describe lines.
# Boards: (B) an interface value is a sealed box: label = type, contents = value; (A) any = an
# interface with no methods: everything fits, nothing is known; (C) the assertion checks the label,
# the comma-ok form asks first; (W) prefer real types; (Q) quiz: describe(2.5) goes to default.
# Fixtures: bun ~/Documents/go-course-work/tools/sim-go.ts <this yaml> --write
schemaVersion: 1

