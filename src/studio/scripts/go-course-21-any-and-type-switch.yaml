          upsertIds: [c-ok-box, c-ok, c-ok-no],
          drawMs: 2400,
        }

  - id: comma-ok
    chapter: ok နဲ့ အရင် မေးတာ
    narration: >-
      [[mark:close-assert]] ဒါဆို ပြင်ကြည့်ရအောင်။ [[mark:type-comment]] panic ဖြစ်တဲ့ line ကို မဖျက်ဘဲ၊
      ရှေ့မှာ comment သင်္ကေတ ထည့်ပြီး Go က မဖတ်တော့အောင် လုပ်ထားပါမယ်။ [[mark:type-ok]] အောက်မှာ ok
      ပါတဲ့ ပုံစံနဲ့ int ရှိလား မေးတဲ့ line ကို ထည့်ပါမယ်။ [[mark:type-ok-print]] print ထုတ်တဲ့ line မှာလည်း ok
      ကို ထည့်ပေးပါမယ်။ [[mark:type-string-ok]] နောက်ဆုံးမှာ ဒီ box ကိုပဲ string ရှိလား ဆိုပြီး ထပ်မေးကြည့်ပါမယ်။
      [[mark:run-3]] ကဲ၊ run လိုက်ရအောင်။
    sources:
