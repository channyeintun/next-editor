  - id: things
    narration: >-
      [[mark:close-any]] ဒါဆို code နဲ့ စမ်းကြည့်ရအောင်။ ဒီ lesson မှာ main ဖိုင်နဲ့၊ lesson ဆယ့်ကိုးကအတိုင်း
      Parcel ပါတဲ့ parcel ဖိုင် ရှိပါတယ်။ [[mark:type-things]] main ထဲမှာ any slice တစ်ခု လုပ်ပြီး၊ ပို့ခ
      ၆၀၀၀၊ ပါဆယ် code တစ်ခု၊ နေပြည်တော်ကို ပို့မယ့် ပါဆယ် တစ်ခု ဆိုပြီး type မတူတဲ့ တန်ဖိုး သုံးခုကို
      ထည့်ပါမယ်။ ပြီးတော့ loop နဲ့ တစ်ခုချင်းကို describe ဆိုတဲ့ function ဆီ ပို့ပါမယ်။
      [[mark:sel-any-slice]] slice ရဲ့ type ကို ကြည့်ပါ။ any slice ဖြစ်လို့ int ကော string ကော Parcel ကော
      တစ်ခုတည်းထဲမှာ ရောထည့်လို့ ရတာပါ။ int slice ဆိုရင်တော့ ဒီလို ရောထည့်လို့ မရပါဘူး။
    sources:
      - {
          title: "The Go Programming Language Specification — Slice types",
          url: "https://go.dev/ref/spec#Slice_types",
        }
    actions:
      - {
          id: close-any,
          type: whiteboard.apply,
          at: { mark: close-any },
          open: false,
          upsertIds: [],
        }
      - id: type-things
        type: editor.type
        at: { mark: type-things }
        target: { file: main.go, after: "func main() {\n", occurrence: 1 }
        text: "\tthings := []any{\n\t\t6000,\n\t\t\"MDY-0001\",\n\t\tParcel{Code: \"NPT-0001\", To: \"NPT\", WeightKg: 1},\n\t}\n\tfor _, thing := range things {\n\t\tdescribe(thing)\n\t}\n"
        cadence: line-by-line
      - id: sel-any-slice
        type: editor.select
        at: { mark: sel-any-slice }
        target: { file: main.go, text: "[]any", occurrence: 1 }

  - id: describe
    chapter: Type switch
    narration: >-
      [[mark:type-describe]] အခု describe ကို main ရဲ့ အပေါ်မှာ ရေးပါမယ်။ ဒီ function က any တစ်ခုကို ယူပြီး၊
      အထဲမှာ ဘာ type ရှိလဲ ကြည့်ပြီး ပြောပြပါတယ်။ parameter ရဲ့ type က any ဖြစ်လို့ ဘာမဆို ပို့လို့ ရပါတယ်။
      function ထဲမှာတော့ type တစ်မျိုးစီအတွက် စာကြောင်း တစ်ကြောင်းစီ ထုတ်ပြမယ့် case တွေ ပါပါတယ်။ int
      ဆိုရင် ကျပ်နဲ့ ပြမယ်၊ string ဆိုရင် စာသားအတိုင်း ပြမယ်၊ Parcel ဆိုရင်တော့ ပါဆယ် code ကို ပြပါမယ်။
      [[mark:sel-switch]] ဒီ line က type switch ပါ။ lesson
      ရှစ်မှာ သင်ခဲ့တဲ့ switch က တန်ဖိုးကို ကြည့်ပြီး ရွေးတာ ဖြစ်ပေမဲ့၊ type switch ကတော့ box ရဲ့ တံဆိပ်ကို
      ကြည့်ပြီး ရွေးတာပါ။ [[mark:sel-case-int]] case တစ်ခုစီမှာ type တစ်ခု ရေးထားပါတယ်။ int case ထဲ
      ရောက်ရင် x က တကယ့် int ဖြစ်သွားလို့၊ ဂဏန်းလို တွက်လို့လည်း ရပါပြီ။ [[mark:sel-case-parcel]] Parcel
      case ထဲမှာဆိုရင်တော့ x က Parcel ဖြစ်လို့ code field ကို ဖတ်လို့ ရပါတယ်။ [[mark:sel-default]] အောက်ဆုံးမှာတော့
      lesson ရှစ်က switch မှာလိုပဲ default တစ်ခု ထည့်ထားပါတယ်။ [[mark:run-1]] ကဲ၊
      run လိုက်ရအောင်။
    sources:
      - {
          title: "The Go Programming Language Specification — Type switches",
          url: "https://go.dev/ref/spec#Type_switches",
        }
      - {
          title: "Effective Go — Interface conversions and type assertions",
          url: "https://go.dev/doc/effective_go#interface_conversions",
        }
    actions:
      - id: type-describe
        type: editor.type
        at: { mark: type-describe }
        target: { file: main.go, after: "import \"fmt\"\n\n", occurrence: 1 }
        text: "// describe says what kind of value v holds.\nfunc describe(v any) {\n\tswitch x := v.(type) {\n\tcase int:\n\t\tfmt.Println(x, \"ကျပ် (int)\")\n\tcase string:\n\t\tfmt.Println(x, \"(string)\")\n\tcase Parcel:\n\t\tfmt.Println(x.Code, \"(Parcel)\")\n\tdefault:\n\t\tfmt.Printf(\"%v (%T)\\n\", x, x)\n\t}\n}\n\n"
        cadence: line-by-line
      - id: sel-switch
        type: editor.select
        at: { mark: sel-switch }
        target: { file: main.go, text: "switch x := v.(type)", occurrence: 1 }
      - id: sel-case-int
        type: editor.select
        at: { mark: sel-case-int }
        target: { file: main.go, text: "case int:", occurrence: 1 }
      - id: sel-case-parcel
        type: editor.select
        at: { mark: sel-case-parcel }
        target: { file: main.go, text: "case Parcel:", occurrence: 1 }
      - id: sel-default
        type: editor.select
        at: { mark: sel-default }
        target: { file: main.go, text: "default:", occurrence: 1 }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "NPT-0001 (Parcel)",
          timeoutMs: 8000,
        }

  - id: read-switch
    narration: >-
      [[mark:point-int]] ပထမ စာကြောင်းမှာ ၆၀၀၀ ကျပ် နဲ့ int ပါ။ box ထဲမှာ int ရှိလို့ int case ထဲ ဝင်သွားတာပါ။
      [[mark:point-string]] ဒုတိယ စာကြောင်းက ပါဆယ် code ဖြစ်ပြီး၊ string case ကနေ ထွက်လာတာပါ။
      [[mark:point-parcel]] တတိယ စာကြောင်းမှာတော့ နေပြည်တော် ပါဆယ်ရဲ့ code နဲ့ Parcel ကို တွေ့ရပါတယ်။
      function တစ်ခုတည်း၊ slice တစ်ခုတည်း ဖြစ်ပေမဲ့၊ type switch က box တစ်ခုစီရဲ့ တံဆိပ်ကို ဖတ်ပြီး ကိုက်တဲ့
      case တစ်ခုတည်းကို လုပ်သွားတာပါ။
    sources:
      - {
          title: "The Go Programming Language Specification — Type switches",
          url: "https://go.dev/ref/spec#Type_switches",
        }
    actions:
      - {
          id: point-int,
