runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "6000 ကျပ် (int)\nMDY-0001 (string)\nNPT-0001 (Parcel)\n"
      run-2:
        status: runtime-error
        exitCode: 2
        output: "panic: interface conversion: interface {} is string, not int\n\ngoroutine 1 [running]:\nmain.main()\n\t/tmp/sandbox1000000000/src/main.go:21 +0x34\n"
      run-3:
        status: success
        exitCode: 0
        output: "0 false\nMDY-0001 true\n6000 ကျပ် (int)\nMDY-0001 (string)\nNPT-0001 (Parcel)\n"

scenes:
  - id: recall
    chapter: Interface တန်ဖိုးရဲ့ အထဲ
    narration: >-
      ပြီးခဲ့တဲ့ lesson မှာ Courier interface ကို ယူတဲ့ function တစ်ခုက ကားဂိတ်ရော rider ရော လက်ခံတာ
      မြင်ခဲ့ပါတယ်။ ဒါဆို Courier type ရှိတဲ့ variable တစ်ခုထဲမှာ တကယ်တော့ ဘာတွေ ရှိနေလဲ။ ဒီနေ့ ဒါကို အရင်
      ကြည့်ပြီး၊ ဘာမဆို ထည့်လို့ရတဲ့ any နဲ့၊ အထဲမှာ ဘာရှိလဲ မေးတဲ့ type switch ကို လေ့လာပါမယ်။
      [[mark:board-box]] interface တန်ဖိုး တစ်ခုကို တံဆိပ် ကပ်ပြီး ပိတ်ထားတဲ့ box တစ်ခုလို့ မြင်ကြည့်ပါ။
      [[mark:draw-label]] တံဆိပ်ပေါ်မှာ အထဲက တန်ဖိုးရဲ့ type ကို ရေးထားပါတယ်၊ ဒီမှာဆိုရင် BusGate ပါ။
      [[mark:draw-value]] box ထဲမှာတော့ တန်ဖိုး ကိုယ်တိုင် ရှိပါတယ်၊ မန္တလေး မြို့ code ပါတဲ့ BusGate
      တစ်ခုပါ။ ဆိုလိုတာက interface variable တစ်ခုက type နဲ့ တန်ဖိုး နှစ်ခုကို အတွဲလိုက် ကိုင်ထားတာပါ။
      [[mark:draw-change]] ဒီ variable ထဲကို နောက်မှ rider တစ်ယောက် ထည့်လိုက်ရင်၊ တံဆိပ်က Rider
      ဖြစ်သွားပြီး အထဲမှာလည်း rider ရဲ့ တန်ဖိုး ရောက်သွားပါမယ်။ box ရဲ့ ပုံစံ၊ ဆိုလိုတာက variable ရဲ့ type ကတော့ Courier အမြဲ ဖြစ်ပါတယ်။ ဒါပေမဲ့ အထဲက တန်ဖိုးရဲ့ type က ပြောင်းနိုင်လို့ တံဆိပ်ပေါ်မှာ သီးခြား ရေးထားရတာပါ။ [[mark:draw-ask]] ဒါကြောင့် program run နေတုန်း box ထဲမှာ ဘာ
      type ရှိလဲ ဆိုတာကို မေးလို့ ရပါတယ်။
    sources:
      - {
          title: "The Go Programming Language Specification — Interface types",
          url: "https://go.dev/ref/spec#Interface_types",
        }
      - {
          title: "The Go Programming Language Specification — Variables",
          url: "https://go.dev/ref/spec#Variables",
        }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }
      - {
          id: board-box,
          type: whiteboard.apply,
          at: { mark: board-box },
          open: true,
          clear: true,
          upsertIds: [b-title, b-var],
        }
      - {
          id: draw-label,
          type: whiteboard.apply,
          at: { mark: draw-label },
          upsertIds: [b-box, b-type, b-type-line],
          drawMs: 2000,
        }
      - {
          id: draw-value,
          type: whiteboard.apply,
          at: { mark: draw-value },
          upsertIds: [b-value],
          drawMs: 1000,
        }
      - {
          id: draw-change,
          type: whiteboard.apply,
          at: { mark: draw-change },
          upsertIds: [b-arrow, b-box2, b-type2, b-value2],
          drawMs: 2400,
        }
      - {
          id: draw-ask,
          type: whiteboard.apply,
          at: { mark: draw-ask },
          upsertIds: [b-ask],
          drawMs: 1200,
        }

  - id: any
    chapter: any ဆိုတာ
    narration: >-
      [[mark:board-any]] အခု method တစ်ခုမှ မပါတဲ့ interface ကို စဉ်းစားကြည့်ရအောင်။ အလုပ်ခေါ်စာက ဘာမှ
      မတောင်းဘူး ဆိုရင် ဘယ်သူမဆို ကိုက်ပါတယ်။ Go မှာ ဒီလို interface ကို any လို့ ခေါ်ပါတယ်။
      [[mark:draw-fit]] ဒါကြောင့် any box ထဲကို ဂဏန်း၊ စာသား၊ ပါဆယ် ဘာမဆို ထည့်လို့ ရပါတယ်။
      [[mark:draw-no]] ဒါပေမဲ့ ဘာမဆို ဝင်လို့ရသလောက်၊ အထဲမှာ ဘာရှိလဲ ဆိုတာကို Go က မသိပါဘူး။ ဥပမာ ၆၀၀၀ ကို
      any box ထဲ ထည့်ထားပြီး ငါးရာ ပေါင်းဖို့ ကြိုးစားရင်၊ any နဲ့ ဂဏန်းကို ပေါင်းလို့ မရဘူး ဆိုပြီး compile
      error ရပါတယ်။ box ထဲမှာ ဂဏန်း ရှိမှန်း compiler က မသိလို့ပါ။ [[mark:draw-println]] တကယ်တော့ ကိုယ်တို့
      အမြဲ သုံးနေတဲ့ Println ကလည်း any တွေကို ယူတာပါ။ ဒါကြောင့် ဂဏန်းပဲ ဖြစ်ဖြစ်၊ စာသားပဲ ဖြစ်ဖြစ်၊ struct ပဲ
      ဖြစ်ဖြစ်၊ ကြိုက်သလောက် ထည့်ပေးလို့ ရခဲ့တာပါ။
    sources:
      - {
          title: "The Go Programming Language Specification — Interface types",
          url: "https://go.dev/ref/spec#Interface_types",
        }
      - { title: "fmt package — Println", url: "https://pkg.go.dev/fmt#Println" }
    actions:
      - {
          id: board-any,
          type: whiteboard.apply,
          at: { mark: board-any },
          open: true,
          clear: true,
          upsertIds: [a-title],
        }
