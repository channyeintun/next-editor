        }

  - id: when
    chapter: any ကို ဘယ်အချိန် သုံးမလဲ
    narration: >-
      [[mark:board-when]] any က ဘာမဆို လက်ခံလို့ အဆင်ပြေတယ် ထင်ရပေမဲ့၊ မလိုအပ်ဘဲ မသုံးသင့်ပါဘူး။
      [[mark:draw-real]] Parcel၊ int၊ Courier လို တကယ့် type တွေကို သုံးရင်၊ မှားထည့်မိတာကို compiler က compile
      လုပ်တဲ့ အဆင့်မှာတင် ဖမ်းပေးပါတယ်။ ပြီးခဲ့တဲ့ lesson မှာ Hours method မရှိတဲ့ Rider ကို ဖမ်းပေးခဲ့သလိုပါ။
      [[mark:draw-any]] any ကို သုံးရင်တော့ ဒီ အကူအညီ ပျောက်သွားပြီး၊ မှားတာကို run မှ panic နဲ့ သိရနိုင်ပါတယ်။
      ဒါကြောင့် any ကို Println လို၊ type တကယ် မတူတဲ့ တန်ဖိုးတွေကို လက်ခံရမယ့် နေရာမှာပဲ သုံးပါ။ ကိုယ် ရေးတဲ့
      code မှာတော့ တကယ့် type ကို အရင် ရွေးပါ။
    sources:
      - {
          title: "Effective Go — Interfaces and other types",
          url: "https://go.dev/doc/effective_go#interfaces_and_types",
        }
    actions:
      - { id: collapse-3, type: runtime.collapseDock, at: { mark: board-when } }
      - {
          id: board-when,
          type: whiteboard.apply,
          at: { afterAction: collapse-3 },
          open: true,
          clear: true,
          upsertIds: [w-title],
        }
      - {
          id: draw-real,
          type: whiteboard.apply,
          at: { mark: draw-real },
          upsertIds: [w-good-box, w-good1, w-good2],
          drawMs: 2000,
        }
      - {
          id: draw-any,
          type: whiteboard.apply,
          at: { mark: draw-any },
          upsertIds: [w-any-box, w-any1, w-any2],
          drawMs: 2400,
        }

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >-
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ describe ကို နှစ်ဒသမ ငါး ဆိုတဲ့ ဒသမ ကိန်းနဲ့ ခေါ်ရင် ဘာဖြစ်မလဲ။
      [[mark:quiz-line]] type switch ထဲမှာ ဒသမ ကိန်းအတွက် case မရှိပါဘူး။ ဒါဆို panic ဖြစ်မလား၊ ဒါမှမဟုတ်
      တန်ဖိုးနဲ့ type နာမည် ပါတဲ့ စာကြောင်း ထွက်မလား။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ခ ပါ။ ဘာကြောင့်လဲဆိုတော့ type switch က ကိုက်တဲ့ case မရှိရင် panic
      မဖြစ်ဘဲ default ထဲ ဝင်သွားလို့ပါ။ default က တန်ဖိုးနဲ့ type ရဲ့ နာမည်ကို ထုတ်ပြလို့၊ နှစ်ဒသမ ငါး နဲ့ ဒသမ
      ကိန်းရဲ့ type နာမည် ထွက်ပါမယ်။ panic ဖြစ်တာက type တစ်ခုတည်းကို တိုက်ရိုက် ယူတဲ့ assertion မှာပဲ ဖြစ်ပါတယ်။
    sources:
      - {
          title: "The Go Programming Language Specification — Type switches",
          url: "https://go.dev/ref/spec#Type_switches",
        }
    actions:
      - {
          id: quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [q-title, q-code, q-l1, q-a, q-b],
        }
      - {
          id: quiz-line,
          type: whiteboard.apply,
          at: { mark: quiz-line },
          upsertIds: [q-note, q-mark],
          drawMs: 1200,
        }
      - {
          id: quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-check, q-why],
          drawMs: 1200,
        }

  - id: recap
    chapter: ပြန်ချုပ်ရရင်
    narration: >-
      [[mark:close-quiz]] ဒါဆို ပြန်ချုပ်ရရင်၊ interface တန်ဖိုး တစ်ခုက type နဲ့ တန်ဖိုးကို အတွဲလိုက် ကိုင်ထားပြီး၊
      any က method မလိုတဲ့ interface ဖြစ်လို့ ဘာမဆို ဝင်ပါတယ်။ [[mark:recap-switch]] အထဲမှာ ဘာ type
      ရှိလဲ သိချင်ရင် type switch နဲ့ မေးပါတယ်။ [[mark:recap-assert]] type တစ်ခုတည်းကို တိုက်ရိုက် ယူရင်
      မှားတဲ့အခါ panic ဖြစ်လို့၊ [[mark:recap-ok]] ok ပါတဲ့ ပုံစံနဲ့ အရင် မေးတာက ပို စိတ်ချရပါတယ်။ ပြီးတော့ any
      ကို တကယ် လိုမှပဲ သုံးပါ။ နောက် lesson မှာတော့ bug မဟုတ်ဘဲ ကြိုတင် မျှော်လင့်ထားရတဲ့ ပြဿနာတွေ၊ ဥပမာ
      မရှိတဲ့ မြို့ code လို အခြေအနေတွေကို ပြောပြပေးတဲ့ error အကြောင်းကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "The Go Programming Language Specification — Type switches",
          url: "https://go.dev/ref/spec#Type_switches",
        }
      - {
          title: "The Go Programming Language Specification — Type assertions",
          url: "https://go.dev/ref/spec#Type_assertions",
        }
    actions:
      - {
          id: close-quiz,
          type: whiteboard.apply,
          at: { mark: close-quiz },
          open: false,
          upsertIds: [],
        }
      - id: recap-switch
        type: editor.select
        at: { mark: recap-switch }
        target: { file: main.go, text: "switch x := v.(type)", occurrence: 1 }
      - id: recap-assert
        type: editor.select
        at: { mark: recap-assert }
        target: { file: main.go, text: "// n := v.(int)", occurrence: 1 }
      - id: recap-ok
        type: editor.select
        at: { mark: recap-ok }
        target: { file: main.go, text: "n, ok := v.(int)", occurrence: 1 }

checks:
  - { type: timing.p95Ms, max: 300 }
