  - id: read-ok
    narration: >-
      [[mark:point-false]] ဒီ တစ်ခါ panic မဖြစ်တော့ပါဘူး။ ပထမ စာကြောင်းမှာ သုည နဲ့ false ကို တွေ့ရပါတယ်။
      box ထဲမှာ int မရှိလို့ int ရဲ့ zero value ဖြစ်တဲ့ သုည နဲ့ false ကို ပြန်ပေးတာပါ။ ဒီ သုည က box ထဲက
      တန်ဖိုး မဟုတ်တာကို သတိထားပါ၊ ok က false ဖြစ်နေရင် တန်ဖိုးကို မသုံးသင့်ပါဘူး။ [[mark:point-true]] ဒုတိယ
      စာကြောင်းမှာတော့ ပါဆယ် code နဲ့ true ပါ။ string ရှိလား မေးတော့ type ကိုက်လို့ အထဲက စာသားကို
      ရလာတာပါ။ အောက်က စာကြောင်း သုံးကြောင်းကတော့ ခုနက type switch ရဲ့ output ပါ။
    sources:
      - {
          title: "The Go Programming Language Specification — Type assertions",
          url: "https://go.dev/ref/spec#Type_assertions",
        }
