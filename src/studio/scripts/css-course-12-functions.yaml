build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 4112

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  - id: function-anatomy
    chapter: "CSS function ဆိုတာ ဘာလဲ"
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ တန်ဖိုးတွေကို custom property ထဲမှာ သိမ်းပြီး၊ var function နဲ့
      ပြန်ဖတ်ခဲ့ပါတယ်။ [[mark:start-server]] ဒီလို ပြောနေတုန်းမှာပဲ၊ board နောက်မှာ dev server ကို
      စနေပါပြီ။ [[mark:draw-fn]] var လို function တွေ CSS မှာ အများကြီး ရှိပြီး၊ ဒီနေ့ အဲဒါတွေကို
      ကြည့်ပါမယ်။ [[mark:draw-name]] function တစ်ခုက သူ့ နာမည်နဲ့ စပါတယ်။ [[mark:draw-args]] နာမည်ရဲ့
      နောက်မှာ ကွင်းကို တန်းကပ် ရေးပြီး၊ ကွင်းထဲမှာ function ကို ပေးတဲ့ တန်ဖိုးတွေ ထည့်ပါတယ်။ အဲဒီ
      တန်ဖိုးတွေကို argument လို့ ခေါ်ပါတယ်။ [[mark:draw-result]] CSS function ဆိုတာ တန်ဖိုး တစ်ခုကို
      တွက်ပြီး ပြန်ပေးတဲ့ အရာပါ။ ဒီမှာဆိုရင် RGB က ဂဏန်း သုံးလုံးကနေ အရောင် တစ်ခု တွက်ပြီး၊ property ရဲ့
      တန်ဖိုးအဖြစ် ပြန်ပေးပါတယ်။ [[mark:draw-space]] ကွင်းက နာမည်နဲ့ ကပ်နေရပါမယ်။ ကြားမှာ space
      ခြားလိုက်ရင် browser က function လို့ မသိတော့လို့၊ declaration တစ်ခုလုံးကို ကျော်သွားပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Functions: what is a function?"
        url: "https://web.dev/learn/css/functions#what_is_a_function"
      - title: "MDN — CSS value functions"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_Functions"
      - title: "CSS Values and Units Module Level 4 — functional notations"
        url: "https://drafts.csswg.org/css-values-4/#functional-notations"
    actions:
      - id: open-anatomy-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      # Runs in the background (boot + pnpm install + spawn); waitForReady
      # sits on the preview mark at the end of the code tour, well over 40 s
      # of narration later.
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 45000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-fn
        type: whiteboard.apply
        at: { mark: draw-fn }
        upsertIds: [a-fn]
        drawMs: 1200
      - id: draw-name
        type: whiteboard.apply
        at: { mark: draw-name }
        upsertIds: [a-name-line, a-name-label]
        drawMs: 1000
      - id: draw-args
        type: whiteboard.apply
        at: { mark: draw-args }
        upsertIds: [a-args-line, a-args-label]
        drawMs: 1400
      - id: draw-result
        type: whiteboard.apply
        at: { mark: draw-result }
        upsertIds: [a-result]
        drawMs: 1000
      - id: draw-space
        type: whiteboard.apply
        at: { mark: draw-space }
        upsertIds: [a-space-bad, a-space-note]
        drawMs: 2000

  - id: functions-met
    narration: >
      [[mark:open-met]] function တော်တော်များများကို သုံးဖူးပြီးသားပါ။ [[mark:draw-met-color]] အရောင်
      lesson မှာ RGB၊ HSL၊ OKLCH၊ color mix၊ ပြီးတော့ lab နဲ့ color function တို့က အရောင်တွေကို
      ထုတ်ပေးခဲ့ပါတယ်။ [[mark:draw-met-var]] ပြီးခဲ့တဲ့ lesson က var ကတော့ custom property ကို
      ဖတ်ပေးပါတယ်။ [[mark:draw-met-selectors]] pseudo-class တချို့ကလည်း argument ယူပါတယ်။ is က သူ့
      စာရင်းထဲက selector တစ်ခုခုနဲ့ ကိုက်တဲ့ element ကို ရွေးပြီး၊ not ကတော့ သူ့ argument နဲ့ မကိုက်တဲ့
      element ကို ရွေးပါတယ်။ နှစ်ခုလုံးက argument တွေထဲက အလေးဆုံး selector ရဲ့ specificity ကို ယူပြီး၊
      where ကတော့ အမြဲ သုည ဖြစ်ပါတယ်။ [[mark:draw-met-grid]] grid lesson တွေမှာ column အရွယ်ကို ပေးတဲ့
      minmax နဲ့ fit-content ကို တွေ့ရပါမယ်။ [[mark:draw-met-today]] ဒီနေ့ အသစ်တွေကတော့ length၊ ဂဏန်းနဲ့
      ထောင့်တွေကို တွက်ပေးတဲ့ math function တွေပါ။
    sources:
      - title: "web.dev Learn CSS — Functions: functional selectors"
        url: "https://web.dev/learn/css/functions#functional_selectors"
      - title: "web.dev Learn CSS — Functions: color functions"
        url: "https://web.dev/learn/css/functions#color_functions"
      - title: "web.dev Learn CSS — Functions: custom properties and var()"
        url: "https://web.dev/learn/css/functions#custom_properties_and_var"
      - title: "MDN — :is()"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/:is"
      - title: "MDN — :not()"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/:not"
      - title: "MDN — var()"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/var"
    actions:
      - id: open-met
        type: whiteboard.apply
        at: { mark: open-met }
        clear: true
        upsertIds: [b-title]
      - id: draw-met-color
        type: whiteboard.apply
        at: { mark: draw-met-color }
        upsertIds: [b-color, b-color-l]
        drawMs: 1800
      - id: draw-met-var
        type: whiteboard.apply
        at: { mark: draw-met-var }
        upsertIds: [b-var, b-var-l]
        drawMs: 1000
      - id: draw-met-selectors
        type: whiteboard.apply
        at: { mark: draw-met-selectors }
        upsertIds: [b-sel, b-sel-l, b-sel-note]
        drawMs: 3000
      - id: draw-met-grid
        type: whiteboard.apply
        at: { mark: draw-met-grid }
        upsertIds: [b-grid, b-grid-l]
        drawMs: 1400
      - id: draw-met-today
        type: whiteboard.apply
        at: { mark: draw-met-today }
        upsertIds: [b-today-l, b-today]
        drawMs: 2000

  - id: code-tour
    narration: >
      [[mark:close-met]] project ကို ကြည့်ရအောင်။ [[mark:open-index]] ဒီနေ့လည်း လက်ဖက်ရည်ဆိုင်ပါ။
      [[mark:select-hero-p]] အပေါ်ဆုံးက ကြိုဆိုတဲ့ အပိုင်းမှာ စာပိုဒ် အတို တစ်ခု ရှိပါတယ်။
      [[mark:select-story]] အောက်က ဆိုင်အကြောင်း အပိုင်းမှာ စာပိုဒ် အရှည် တစ်ခု ရှိပါတယ်။
      [[mark:select-gauge]] ပြီးတော့ ဒီနေ့ အော်ဒါ ဆိုတဲ့ အပိုင်း အသစ် ပါပါတယ်။ track တစ်ခုထဲမှာ bar တစ်ခု
      ရှိပြီး၊ အောက်မှာ ရေနွေးငွေ့ မျဉ်း ပါးပါးလေး ရှိပါတယ်။ base ဖိုင်က track ရဲ့ အလယ်မှာ အနီရောင်
      အမှတ်လေး ဆွဲထားလို့၊ တစ်ဝက်က ဘယ်နားလဲ မြင်ရပါမယ်။ [[mark:select-drinks]] နောက်ဆုံးက သောက်စရာ menu
      ဖြစ်ပြီး၊ သောက်စရာ တစ်ခုစီရဲ့ နာမည်က ခေါင်းစဉ် အဆင့် 3 ပါ။ [[mark:open-styles]] ကိုယ့် CSS ဖိုင်က
      အလွတ်ပါ။ ဒီနေ့ ရေးမယ့် အရွယ်အစား အများစုက function တစ်ခုခုကနေ လာပါမယ်။ [[mark:preview-opens]] dev
      server အသင့် ဖြစ်လို့ preview ပွင့်လာပါပြီ။ အခုတော့ bar နဲ့ ရေနွေးငွေ့ မျဉ်းက အကျယ် အပြည့်
      ယူထားပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Functions"
        url: "https://web.dev/learn/css/functions"
      - title: "MDN — <div>: the Content Division element"
        url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Element/div"
    actions:
      - id: close-met
        type: whiteboard.apply
        at: { mark: close-met }
        open: false
      - id: open-index
        type: workspace.openFile
        at: { mark: open-index }
        path: index.html
      - id: select-hero-p
        type: editor.select
        at: { mark: select-hero-p }
        target: { file: index.html, text: "<p>ပူပူနွေးနွေး လက်ဖက်ရည်နဲ့ မနက်စာ</p>", occurrence: 1 }
      - id: select-story
        type: editor.select
        at: { mark: select-story }
        target: { file: index.html, text: '<p class="story" data-testid="story">', occurrence: 1 }
      - id: select-gauge
        type: editor.select
        at: { mark: select-gauge }
        target:
          {
            file: index.html,
            text: "<div class=\"track\" data-testid=\"track\"><div class=\"bar\" data-testid=\"bar\"></div></div>\n        <p class=\"gauge-label\">ရေနွေးငွေ့</p>\n        <div class=\"steam\" data-testid=\"steam\"></div>",
            occurrence: 1,
          }
      - id: select-drinks
        type: editor.select
        at: { mark: select-drinks }
        target: { file: index.html, text: '<h3 class="name">လက်ဖက်ရည်</h3>', occurrence: 1 }
      - id: open-styles
        type: workspace.openFile
        at: { mark: open-styles }
        path: styles.css
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { mark: preview-opens }
        timeoutMs: 20000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-dev-server }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-hero
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: hero }
        textContains: "ပူပူနွေးနွေး"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-gauge
        type: expect.preview
        at: { afterAction: expect-hero }
        timeoutMs: 5000
        target: { by: testId, value: gauge }
        textContains: "ဒီနေ့ အော်ဒါ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: collapse-runner-dock
        type: runtime.collapseDock
        at: { afterAction: expect-gauge }

  - id: math-board
    chapter: "Calc နဲ့ unit ရောပြီး တွက်ကြည့်ရအောင်"
    narration: >
      [[mark:open-math]] CSS မှာ ဘာလို့ တွက်ဖို့ လိုတာလဲ။ box တစ်ခုရဲ့ အကျယ်ကို parent ရဲ့ 100 ရာခိုင်နှုန်းထဲက 64 pixel နှုတ်ပြီး ပေးချင်တယ် ဆိုပါစို့။ [[mark:draw-phone]] ဖုန်းမှာ parent က 368
      pixel ကျယ်ရင်၊ box က 304 ဖြစ်ရပါမယ်။ [[mark:draw-wide]] screen ကျယ်ကျယ်မှာ parent က 800 pixel
      ဆိုရင်တော့၊ box က 736 ဖြစ်ရပါမယ်။ [[mark:draw-legend]] 64 pixel က ပုံသေ ဖြစ်ပေမယ့်၊
      ရာခိုင်နှုန်းကတော့ pixel ဘယ်လောက် ဖြစ်မလဲ CSS ရေးနေတုန်း မသိရလို့၊ ကိုယ်တိုင် ကြိုတွက်ထားလို့
      မရပါဘူး။ [[mark:draw-render]] ဒါကြောင့် browser က page ကို နေရာချတဲ့အခါမှ တွက်ပြီး၊ parent ရဲ့ အကျယ်
      ပြောင်းတိုင်းလည်း ပြန်တွက်ပေးပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Functions: mathematical expressions"
        url: "https://web.dev/learn/css/functions#mathematical_expressions"
      - title: "CSS Values and Units Module Level 4 — mathematical expressions"
        url: "https://drafts.csswg.org/css-values-4/#math"
    actions:
      - id: open-math
        type: whiteboard.apply
        at: { mark: open-math }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-phone
        type: whiteboard.apply
        at: { mark: draw-phone }
        upsertIds: [c-phone-outer, c-phone-inner, c-phone-gap, c-phone-text]
        drawMs: 2400
      - id: draw-wide
        type: whiteboard.apply
        at: { mark: draw-wide }
        upsertIds: [c-wide-outer, c-wide-inner, c-wide-gap, c-wide-text]
        drawMs: 2400
      - id: draw-legend
        type: whiteboard.apply
        at: { mark: draw-legend }
        upsertIds: [c-leg-pct, c-leg-px]
        drawMs: 1800
      - id: draw-render
        type: whiteboard.apply
        at: { mark: draw-render }
        upsertIds: [c-render, c-recalc]
        drawMs: 2000

  - id: calc-live
    narration: >
      [[mark:close-math]] ကြိုဆိုတဲ့ စာပိုဒ်မှာ စမ်းကြည့်ရအောင်။ [[mark:type-hero-bg]] အရင်ဆုံး ဘယ်လောက်
      ကျယ်လဲ မြင်ရအောင်၊ အညိုဖျော့ဖျော့ နောက်ခံ ပေးပါမယ်။ [[mark:after-hero-bg]] နောက်ခံက ကြိုဆိုတဲ့
      အပိုင်းရဲ့ အကျယ် အပြည့် ရောက်နေပါတယ်။ [[mark:type-hero-width]] အခု အကျယ်ကို calc နဲ့ ပေးပါမယ်။ calc
      က ကွင်းထဲက ပေါင်းနှုတ် မြှောက်စားကို တွက်ပေးပါတယ်။ ဒီမှာတော့ အကျယ် အပြည့်ထဲက 64 pixel နှုတ်ပါတယ်။
      [[mark:after-hero-width]] အခု နောက်ခံက ညာဘက်မှာ 64 pixel တိုသွားပါပြီ။
      [[mark:select-hero-calc]] ဒီ calc ကို ကြည့်ပါ။ ရာခိုင်နှုန်းနဲ့ pixel ကို ရောတွက်ထားလို့၊ screen
      ဘယ်လောက် ကျယ်ကျယ် နေရာလွတ်က 64 pixel ပဲ ရှိပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Functions: calc()"
        url: "https://web.dev/learn/css/functions#calc"
      - title: "MDN — calc()"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/calc"
    actions:
      - id: close-math
        type: whiteboard.apply
        at: { mark: close-math }
        open: false
      - id: type-hero-bg
        type: editor.type
        at: { mark: type-hero-bg }
        cadence: fast-explainer
        target: { file: styles.css, after: "", occurrence: 1 }
        text: ".hero p {\n  background: wheat;\n}\n"
      - id: expect-hero-bg
        type: expect.preview
        at: { mark: after-hero-bg }
        timeoutMs: 4000
        target: { by: testId, value: hero }
        textContains: "မနက်စာ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-hero-width
        type: editor.type
        at: { mark: type-hero-width }
        cadence: natural
        target: { file: styles.css, after: "  background: wheat;\n", occurrence: 1 }
        text: "  width: calc(100% - 64px);\n"
      - id: expect-hero-width
        type: expect.preview
        at: { mark: after-hero-width }
        timeoutMs: 4000
        target: { by: testId, value: order-link }
        textContains: "မှာယူရန်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-hero-calc
        type: editor.select
        at: { mark: select-hero-calc }
        target: { file: styles.css, text: "calc(100% - 64px)", occurrence: 1 }

  - id: calc-spaces
    narration: >
      [[mark:type-about-p]] ဆိုင်အကြောင်း စာပိုဒ်ကိုလည်း နောက်ခံနဲ့ အကျယ် အလားတူ ပေးပါမယ်။ ဒီတစ်ခါတော့
      ဘာဖြစ်မလဲ သိအောင်၊ အနုတ် လက္ခဏာရဲ့ ဘေးမှာ space မခြားဘဲ တမင် ရေးကြည့်ပါမယ်။ [[mark:after-about-p]]
      နောက်ခံ ပေါ်လာပေမယ့်၊ စာပိုဒ်က အကျယ် အပြည့် အတိုင်းပဲ ရှိနေပါတယ်။ [[mark:select-about-calc]] ဒီ calc
      ကို ကြည့်ပါ။ space မပါတော့ browser က အနုတ် 64 pixel ကို အနုတ် ဂဏန်း တစ်ခုလို ဖတ်ပါတယ်။ တန်ဖိုး
      နှစ်ခု ကပ်နေပြီး ကြားမှာ နှုတ်တဲ့ လက္ခဏာ မရှိတော့လို့၊ browser က ဒီ declaration ကို ကျော်သွားပါတယ်။
      [[mark:open-rules]] calc ရဲ့ စည်းကမ်းတွေကို ကြည့်ရအောင်။ [[mark:draw-rule-space]] အပေါင်းနဲ့
      အနုတ်ရဲ့ ဘေးနှစ်ဘက်မှာ space အမြဲ လိုပါတယ်။ [[mark:draw-rule-times]] မြှောက်တဲ့အခါ အနည်းဆုံး တစ်ဘက်က
      unit မပါတဲ့ ဂဏန်း ဖြစ်ရပါမယ်။ [[mark:draw-rule-divide]] စားတဲ့အခါတော့ ညာဘက်က unit မပါတဲ့ ဂဏန်း
      ဖြစ်ရပါမယ်။ [[mark:draw-rule-nest]] ကွင်း ထပ်ထည့်ပြီး အပိုင်းတွေကို စုလို့ ရသလို၊ calc ထဲမှာ calc
      ထပ်ထည့်လို့လည်း ရပါတယ်။ [[mark:draw-rule-var]] calc ထဲမှာ var လည်း သုံးလို့ ရပါတယ်။ ပြီးခဲ့တဲ့
      lesson မှာ ဂဏန်းကို 1 pixel နဲ့ မြှောက်ခဲ့တာ ဒီနည်းပါ။
    sources:
      - title: "web.dev Learn CSS — Functions: calc()"
        url: "https://web.dev/learn/css/functions#calc"
      - title: "MDN — calc(): notes (whitespace around + and -)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/calc#notes"
      - title: "CSS Values and Units Module Level 4 — syntax of math functions"
        url: "https://drafts.csswg.org/css-values-4/#calc-syntax"
    actions:
      - id: type-about-p
        type: editor.type
        at: { mark: type-about-p }
        cadence: fast-explainer
        target: { file: styles.css, after: "  width: calc(100% - 64px);\n}\n", occurrence: 1 }
        text: "\n.about p {\n  background: wheat;\n  width: calc(100%-64px);\n}\n"
      - id: expect-story-bg
        type: expect.preview
        at: { mark: after-about-p }
        timeoutMs: 4000
        target: { by: testId, value: story }
        textContains: "ဗဟန်း"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-about-calc
        type: editor.select
        at: { mark: select-about-calc }
        target: { file: styles.css, text: "calc(100%-64px)", occurrence: 1 }
      - id: open-rules
        type: whiteboard.apply
        at: { mark: open-rules }
        open: true
        clear: true
        upsertIds: [d-title]
      - id: draw-rule-space
        type: whiteboard.apply
        at: { mark: draw-rule-space }
        upsertIds: [d-r1-ok, d-r1-bad, d-r1-note]
        drawMs: 2200
      - id: draw-rule-times
        type: whiteboard.apply
        at: { mark: draw-rule-times }
        upsertIds: [d-r2, d-r2-note]
        drawMs: 1600
      - id: draw-rule-divide
        type: whiteboard.apply
        at: { mark: draw-rule-divide }
        upsertIds: [d-r3, d-r3-note]
        drawMs: 1600
      - id: draw-rule-nest
        type: whiteboard.apply
        at: { mark: draw-rule-nest }
        upsertIds: [d-r4, d-r4-note]
        drawMs: 1800
      - id: draw-rule-var
        type: whiteboard.apply
        at: { mark: draw-rule-var }
        upsertIds: [d-r5, d-r5-note]
        drawMs: 1800

  - id: min-max
    chapter: "Min နဲ့ max"
    narration: >
      [[mark:close-rules]] နောက်တစ်ခုက min နဲ့ max ပါ။ နှစ်ခုလုံးက တန်ဖိုး စာရင်း တစ်ခုကို ယူပြီး၊ အဲဒီထဲက
      တစ်ခုကို ရွေးပေးပါတယ်။ [[mark:type-about-min]] ဆိုင်အကြောင်း အပိုင်းရဲ့ အကျယ်ကို min function နဲ့
      ပေးပါမယ်။ argument နှစ်ခုက အကျယ် အပြည့်နဲ့ 320 pixel ပါ။ min က အငယ်ဆုံး argument ကို ပြန်ပေးပါတယ်။
      [[mark:after-about-min]] ဆိုင်အကြောင်း အပိုင်း ကျဉ်းသွားပါပြီ။ 320 pixel က အကျယ် အပြည့် 400 လောက်ထက်
      ငယ်လို့ပါ။ [[mark:select-about-min]] ဒီ min function ကို ကြည့်ပါ။ 320 pixel ထက် ကျဉ်းတဲ့
      ဖုန်းမှာဆိုရင် အကျယ် အပြည့်က ပိုငယ်လို့ သူက နိုင်ပြီး၊ အပိုင်းက screen အပြင်ကို မထွက်ပါဘူး။ [[mark:open-minmax]] max နဲ့
      ယှဉ်ကြည့်ရအောင်။ [[mark:draw-min-col]] parent က 400 pixel ဆိုရင် min က 320 ပေးပြီး၊ 200 pixel ဆိုရင်
      200 ပေးပါတယ်။ 320 ထက် ဘယ်တော့မှ မကြီးလို့၊ min က အထက် ကန့်သတ်ချက် ဖြစ်ပါတယ်။ [[mark:draw-max-col]] max ကတော့ အကြီးဆုံးကို ရွေးပါတယ်။
      argument တူတူနဲ့ parent 400 ဆိုရင် 400၊ parent 200 ဆိုရင် 320 ရပါတယ်။ 320 ထက် ဘယ်တော့မှ မငယ်လို့၊
      max က အောက် ကန့်သတ်ချက် ဖြစ်ပါတယ်။ [[mark:draw-nocalc]] min၊ max နဲ့ တခြား math function
      တွေထဲမှာတော့ calc မလိုဘဲ၊ တွက်ချက်မှုကို တိုက်ရိုက် ရေးလို့ ရပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Functions: min() and max()"
        url: "https://web.dev/learn/css/functions#min_and_max"
      - title: "MDN — min()"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/min"
      - title: "MDN — max()"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/max"
      - title: "web.dev — min(), max(), and clamp()"
        url: "https://web.dev/articles/min-max-clamp"
    actions:
      - id: close-rules
        type: whiteboard.apply
        at: { mark: close-rules }
        open: false
      - id: type-about-min
        type: editor.type
        at: { mark: type-about-min }
        cadence: fast-explainer
        target: { file: styles.css, after: "  width: calc(100%-64px);\n}\n", occurrence: 1 }
        text: "\n.about {\n  width: min(100%, 320px);\n}\n"
      - id: expect-about-min
        type: expect.preview
        at: { mark: after-about-min }
        timeoutMs: 4000
        target: { by: testId, value: about }
        textContains: "ဆိုင်အကြောင်း"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-about-min
        type: editor.select
        at: { mark: select-about-min }
        target: { file: styles.css, text: "min(100%, 320px)", occurrence: 1 }
      - id: open-minmax
        type: whiteboard.apply
        at: { mark: open-minmax }
        open: true
        clear: true
        upsertIds: [e-title]
      - id: draw-min-col
        type: whiteboard.apply
        at: { mark: draw-min-col }
        upsertIds: [e-legend, e-min-code, e-min-a, e-min-b, e-min-note]
        drawMs: 3200
      - id: draw-max-col
        type: whiteboard.apply
        at: { mark: draw-max-col }
        upsertIds: [e-max-code, e-max-a, e-max-b, e-max-note]
        drawMs: 3000
      - id: draw-nocalc
        type: whiteboard.apply
        at: { mark: draw-nocalc }
        upsertIds: [e-nocalc]
        drawMs: 1400

  - id: clamp-live
    chapter: "Clamp နဲ့ ကန့်သတ်ချက် နှစ်ခု"
    narration: >
      [[mark:close-minmax]] ကန့်သတ်ချက် နှစ်ခုလုံးကို တစ်ပြိုင်နက် လိုချင်ရင် clamp ကို သုံးပါတယ်။
      [[mark:type-bar]] clamp က အငယ်ဆုံး၊ ဦးစားပေး၊ အကြီးဆုံး ဆိုတဲ့ တန်ဖိုး သုံးခု ယူပါတယ်။ bar ကို
      track ရဲ့ တစ်ဝက် ကျယ်စေချင်ပေမယ့်၊ 120 pixel ထက် မနည်းစေဘဲ 180 ထက်လည်း မများစေချင်ပါဘူး။
      [[mark:after-bar]] အခု track က 400 pixel လောက် ကျယ်လို့၊ တစ်ဝက်ဆိုရင် 200 ပါ။ အဲဒါက အကြီးဆုံးထက် ကြီးနေလို့ bar က 180 မှာ ရပ်ပြီး၊ အလယ်က အနီရောင် အမှတ်ကို မရောက်ပါဘူး။ [[mark:type-track-200]] အခု
      track ကို 200 pixel ပဲ ကျယ်အောင် ပေးကြည့်ရအောင်။ [[mark:after-track-200]] 200 ရဲ့ တစ်ဝက်က 100 ပဲ
      ရှိလို့ အငယ်ဆုံးက နိုင်ပြီး၊ bar က အလယ် အမှတ်ကို လွန်ပြီး 120 အထိ ရောက်သွားပါတယ်။
      [[mark:type-track-320]] နောက်တစ်ခါ 320 pixel ပါ။ နောက်မှ ရေးတဲ့ declaration က နိုင်ပါတယ်။
      [[mark:after-track-320]] 320 ရဲ့ တစ်ဝက်က 160 ဖြစ်ပြီး၊ ကန့်သတ်ချက် နှစ်ခုရဲ့ ကြားထဲမှာ ရှိပါတယ်။
      ဒါကြောင့် bar က အလယ် အမှတ်မှာ အတိအကျ ဆုံးပါတယ်။ [[mark:type-track-400]] အခု 400 pixel ပါ။
      [[mark:after-track-400]] တစ်ဝက်က 200 ဖြစ်လို့၊ bar က 180 မှာ ပြန်ရပ်သွားပါပြီ။
    sources:
      - title: "web.dev Learn CSS — Functions: clamp()"
        url: "https://web.dev/learn/css/functions#clamp"
      - title: "MDN — clamp()"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/clamp"
    actions:
      - id: close-minmax
        type: whiteboard.apply
        at: { mark: close-minmax }
        open: false
      - id: type-bar
        type: editor.type
        at: { mark: type-bar }
        cadence: natural
        target: { file: styles.css, after: "  width: min(100%, 320px);\n}\n", occurrence: 1 }
        text: "\n.bar {\n  width: clamp(120px, 50%, 180px);\n}\n"
      - id: expect-bar
        type: expect.preview
        at: { mark: after-bar }
        timeoutMs: 4000
        target: { by: testId, value: bar }
        attribute: { name: class, value: bar }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-track-200
        type: editor.type
        at: { mark: type-track-200 }
        cadence: fast-explainer
        target:
          { file: styles.css, after: "  width: clamp(120px, 50%, 180px);\n}\n", occurrence: 1 }
        text: "\n.track {\n  width: 200px;\n}\n"
      - id: expect-track-200
        type: expect.preview
        at: { mark: after-track-200 }
        timeoutMs: 4000
        target: { by: testId, value: track }
        attribute: { name: class, value: track }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-track-320
        type: editor.type
        at: { mark: type-track-320 }
        cadence: natural
        target: { file: styles.css, after: "  width: 200px;\n", occurrence: 1 }
        text: "  width: 320px;\n"
      - id: type-track-400
        type: editor.type
        at: { mark: type-track-400 }
        cadence: natural
        target: { file: styles.css, after: "  width: 320px;\n", occurrence: 1 }
        text: "  width: 400px;\n"
      - id: expect-track-400
        type: expect.preview
        at: { mark: after-track-400 }
        timeoutMs: 4000
        target: { by: testId, value: gauge }
        textContains: "ရေနွေးငွေ့"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: clamp-board
    narration: >
      [[mark:open-clamp]] ခုနက အခြေအနေ သုံးမျိုးကို ယှဉ်ကြည့်ရအောင်။ [[mark:draw-clamp-low]] track ရဲ့
      တစ်ဝက်က 120 ထက် နည်းရင်၊ အငယ်ဆုံး တန်ဖိုးက bar ကို 120 မှာ ထိန်းထားပါတယ်။ [[mark:draw-clamp-mid]]
      ကန့်သတ်ချက် နှစ်ခုကြားမှာဆိုရင် bar က track ရဲ့ တစ်ဝက်ပါ။ [[mark:draw-clamp-high]] 180 ထက် များရင်
      အကြီးဆုံးက ထိန်းပါတယ်။ [[mark:draw-clamp-formula]] ဆိုတော့ clamp က max ထဲမှာ min ကို ထည့်ရေးထားတာနဲ့
      အတူတူပါ။ min က တန်ဖိုးကို အကြီးဆုံးထက် မကြီးအောင်၊ max က အငယ်ဆုံးထက် မငယ်အောင် ထိန်းပေးပါတယ်။
      [[mark:draw-clamp-font]] clamp ကို အသုံးများတဲ့ နေရာက window နဲ့အတူ ကြီးလိုက် သေးလိုက် ဖြစ်တဲ့
      စာလုံးပါ။ lesson 10 မှာ vw နဲ့ ပေးတဲ့ စာလုံးကို ကန့်သတ်ရမယ်လို့ ပြောခဲ့တာကို clamp က တစ်ခါတည်း
      လုပ်ပေးပါတယ်။ ဖတ်တဲ့သူရဲ့ စာလုံး setting ကိုလည်း လိုက်အောင်၊ အလယ် တန်ဖိုးမှာ rem အပိုင်း ထည့်ထားပါ။
    sources:
      - title: "web.dev Learn CSS — Functions: clamp()"
        url: "https://web.dev/learn/css/functions#clamp"
      - title: "MDN — clamp(): equivalent to max(MIN, min(VAL, MAX))"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/clamp"
      - title: "web.dev — min(), max(), and clamp(): fluid typography"
        url: "https://web.dev/articles/min-max-clamp"
    actions:
      - id: open-clamp
        type: whiteboard.apply
        at: { mark: open-clamp }
        open: true
        clear: true
        upsertIds: [f-title]
      - id: draw-clamp-low
        type: whiteboard.apply
        at: { mark: draw-clamp-low }
        upsertIds: [f-low, f-low-note]
        drawMs: 2000
      - id: draw-clamp-mid
        type: whiteboard.apply
        at: { mark: draw-clamp-mid }
        upsertIds: [f-mid, f-mid-note]
        drawMs: 2000
      - id: draw-clamp-high
        type: whiteboard.apply
        at: { mark: draw-clamp-high }
        upsertIds: [f-high, f-high-note]
        drawMs: 1600
      - id: draw-clamp-formula
        type: whiteboard.apply
        at: { mark: draw-clamp-formula }
        upsertIds: [f-formula]
        drawMs: 1600
      - id: draw-clamp-font
        type: whiteboard.apply
        at: { mark: draw-clamp-font }
        upsertIds: [f-font, f-font-note]
        drawMs: 2600

  - id: trig-board
    chapter: "Trigonometric function တွေ"
    narration: >
      [[mark:open-trig]] CSS မှာ ကျောင်းက သင်ခဲ့တဲ့ trigonometric function တွေလည်း ပါပါတယ်။ စက်ဝိုင်း
      ပတ်လည်မှာ item တွေ စီတာလို၊ layout က ထောင့် တစ်ခုပေါ် မူတည်တဲ့အခါ အသုံးဝင်ပါတယ်။
      [[mark:draw-circle]] ဒီ စက်ဝိုင်းရဲ့ အချင်းဝက်က 1 ဖြစ်ပြီး၊ သူ့ပေါ်က အမှတ်က အလယ်ကနေ 30 ဒီဂရီ
      လှည့်ထားတဲ့ နေရာမှာ ရှိပါတယ်။ [[mark:draw-cos]] အဲဒီ ထောင့်ရဲ့ cos က အမှတ်ဟာ အလယ်ကနေ ညာဘက်ကို
      ဘယ်လောက် ကွာလဲ ပြောပါတယ်။ [[mark:draw-sin]] sin ကတော့ အမှတ်ဟာ အလယ်ထက် ဘယ်လောက် မြင့်လဲ ပြောပါတယ်။
      [[mark:draw-range]] နှစ်ခုလုံးက အနုတ် 1 နဲ့ 1 ကြားက unit မပါတဲ့ ဂဏန်းကို ပေးလို့၊ length တစ်ခုနဲ့
      မြှောက်မှ အရွယ်အစား ရပါတယ်။ [[mark:draw-units]] ထောင့်ကို ဒီဂရီ၊ turn လို ထောင့် unit ဘာနဲ့ပဲ ရေးရေး
      ရပါတယ်။ unit မပါတဲ့ ဂဏန်းဆိုရင်တော့ ဒီဂရီ မဟုတ်ဘဲ radian လို့ ယူပါတယ်။ 1 radian က 57 ဒီဂရီ လောက် ရှိပါတယ်။ [[mark:draw-tan]] tan ကတော့
      sin ကို cos နဲ့ စားထားတာပါ။
    sources:
      - title: "web.dev Learn CSS — Functions: trigonometric functions"
        url: "https://web.dev/learn/css/functions#trigonometric_functions"
      - title: "web.dev Learn CSS — Functions: sin(), cos() and tan()"
        url: "https://web.dev/learn/css/functions#sin_cos_and_tan"
      - title: "MDN — sin()"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/sin"
      - title: "web.dev — Trigonometric functions in CSS"
        url: "https://web.dev/articles/css-trig-functions"
    actions:
      - id: open-trig
        type: whiteboard.apply
        at: { mark: open-trig }
        open: true
        clear: true
        upsertIds: [g-title]
      - id: draw-circle
        type: whiteboard.apply
        at: { mark: draw-circle }
        upsertIds: [g-circle, g-center, g-point, g-angle]
        drawMs: 2400
      - id: draw-cos
        type: whiteboard.apply
        at: { mark: draw-cos }
        upsertIds: [g-cos, g-cos-label, g-r-cos]
        drawMs: 1800
      - id: draw-sin
        type: whiteboard.apply
        at: { mark: draw-sin }
        upsertIds: [g-sin, g-sin-label, g-r-sin]
        drawMs: 1800
      - id: draw-range
        type: whiteboard.apply
        at: { mark: draw-range }
        upsertIds: [g-r-range]
        drawMs: 1400
      - id: draw-units
        type: whiteboard.apply
        at: { mark: draw-units }
        upsertIds: [g-r-deg, g-r-rad]
        drawMs: 2200
      - id: draw-tan
        type: whiteboard.apply
        at: { mark: draw-tan }
        upsertIds: [g-r-tan]
        drawMs: 1200

  - id: steam-live
    narration: >
      [[mark:close-trig]] ရေနွေးငွေ့ မျဉ်းမှာ sin သုံးကြည့်ရအောင်။ [[mark:type-steam]] အကျယ်ကို 30
      ဒီဂရီရဲ့ sin နဲ့ 200 pixel ကို မြှောက်ပြီး ပေးပါမယ်။ 30 ဒီဂရီရဲ့ sin က တစ်ဝက် ဖြစ်လို့၊ 200 ရဲ့
      တစ်ဝက် ဖြစ်တဲ့ 100 pixel ရသင့်ပါတယ်။ [[mark:after-steam]] ဒီ sin က တစ်ဝက် ပေးလို့၊ ရေနွေးငွေ့ မျဉ်းက 100 pixel အထိ တိုသွားပါပြီ။ [[mark:type-steam-rad]] အခု အဲဒီ declaration ကိုပဲ ဒီဂရီ unit မပါဘဲ ထပ်ရေးပါမယ်။
      ရေနွေးငွေ့ မျဉ်းကို ကြည့်ထားပါ။ [[mark:after-steam-rad]] မျဉ်း ပျောက်သွားပါပြီ။ unit မပါတဲ့ 30 က 30
      radian ဖြစ်ပြီး၊ သူ့ sin က အနုတ် 1 နီးပါး ရှိပါတယ်။ အကျယ်က အနုတ် မဖြစ်နိုင်လို့ browser က သုည
      ဖြစ်အောင် လုပ်လိုက်ပါတယ်။ [[mark:type-steam-90]] နောက်ဆုံး 90 ဒီဂရီပါ။ 90 ဒီဂရီရဲ့ sin က 1 အတိအကျ
      ဖြစ်လို့၊ ရလဒ်က 200 pixel အကုန် ရပါမယ်။ [[mark:after-steam-90]] မျဉ်းက 200 pixel ရှည်သွားပါပြီ။
    sources:
      - title: "web.dev Learn CSS — Functions: sin(), cos() and tan()"
        url: "https://web.dev/learn/css/functions#sin_cos_and_tan"
      - title: "MDN — sin(): a number is interpreted as radians"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/sin"
      - title: "CSS Values and Units Module Level 4 — range checking (results are clamped)"
        url: "https://drafts.csswg.org/css-values-4/#calc-range"
    actions:
      - id: close-trig
        type: whiteboard.apply
        at: { mark: close-trig }
        open: false
      - id: type-steam
        type: editor.type
        at: { mark: type-steam }
        cadence: fast-explainer
        target: { file: styles.css, after: "  width: 400px;\n}\n", occurrence: 1 }
        text: "\n.steam {\n  width: calc(sin(30deg) * 200px);\n}\n"
      - id: expect-steam
        type: expect.preview
        at: { mark: after-steam }
        timeoutMs: 4000
        target: { by: testId, value: steam }
        attribute: { name: class, value: steam }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-steam-deg
        type: editor.select
        at: { mark: after-steam }
        target: { file: styles.css, text: "sin(30deg)", occurrence: 1 }
      - id: type-steam-rad
        type: editor.type
        at: { mark: type-steam-rad }
        cadence: fast-explainer
        target: { file: styles.css, after: "  width: calc(sin(30deg) * 200px);\n", occurrence: 1 }
        text: "  width: calc(sin(30) * 200px);\n"
      - id: select-steam-rad
        type: editor.select
        at: { mark: after-steam-rad }
        target: { file: styles.css, text: "sin(30)", occurrence: 1 }
      - id: type-steam-90
        type: editor.type
        at: { mark: type-steam-90 }
        cadence: fast-explainer
        target: { file: styles.css, after: "  width: calc(sin(30) * 200px);\n", occurrence: 1 }
        text: "  width: calc(sin(90deg) * 200px);\n"
      - id: expect-steam-90
        type: expect.preview
        at: { mark: after-steam-90 }
        timeoutMs: 4000
        target: { by: testId, value: gauge }
        textContains: "ရေနွေးငွေ့"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: inverse-board
    narration: >
      [[mark:open-inverse]] ပြောင်းပြန် trigonometric function တွေလည်း ရှိပါတယ်။ [[mark:draw-asin]] asin၊
      acos နဲ့ atan က ဂဏန်း တစ်ခုကို ယူပြီး ထောင့် တစ်ခု ပြန်ပေးပါတယ်။ တစ်ဝက်ရဲ့ asin က 30 ဒီဂရီပါ။
      [[mark:draw-ranges]] asin နဲ့ atan က အနုတ် 90 ကနေ 90 ဒီဂရီကြား ထောင့်ကို ပေးပြီး၊ acos ကတော့ 0 ကနေ
      180 ကြားကို ပေးပါတယ်။ [[mark:draw-atan2]] atan2 ကတော့ တန်ဖိုး နှစ်ခု ယူပါတယ်။ ဒေါင်လိုက် အကွာကို
      အရင် ပေးပြီးမှ ဘေးတိုက် အကွာကို ပေးရပါတယ်။ အမှတ် တစ်ခုကနေ နောက်တစ်ခုဆီ ဦးတည်ရာကို အနုတ် 180 ကနေ 180
      ဒီဂရီကြား ပြန်ပေးလို့၊ မြှား တစ်ခုကို တစ်ခုခုဘက် လှည့်ထားချင်တဲ့အခါ သုံးပါတယ်။ [[mark:draw-hypot]]
      hypot က ဘေးနှစ်ဘက်ကနေ ထောင့်ဖြတ် မျဉ်းရဲ့ အရှည်ကို တွက်ပေးပါတယ်။ 30 pixel နဲ့ 40 pixel ဆိုရင် 50
      pixel ရပြီး၊ ရလဒ်မှာ unit ပါနေပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Functions: asin(), acos() and atan()"
        url: "https://web.dev/learn/css/functions#asin_acos_and_atan"
      - title: "web.dev Learn CSS — Functions: atan2()"
        url: "https://web.dev/learn/css/functions#atan2"
      - title: "web.dev Learn CSS — Functions: hypot()"
        url: "https://web.dev/learn/css/functions#hypot"
      - title: "MDN — acos(): returns an angle between 0deg and 180deg"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/acos"
      - title: "MDN — atan2()"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/atan2"
    actions:
      - id: open-inverse
        type: whiteboard.apply
        at: { mark: open-inverse }
        open: true
        clear: true
        upsertIds: [h-title]
      - id: draw-asin
        type: whiteboard.apply
        at: { mark: draw-asin }
        upsertIds: [h-asin, h-asin-note]
        drawMs: 1800
      - id: draw-ranges
        type: whiteboard.apply
        at: { mark: draw-ranges }
        upsertIds: [h-range1, h-range2]
        drawMs: 2000
      - id: draw-atan2
        type: whiteboard.apply
        at: { mark: draw-atan2 }
        upsertIds: [h-atan2, h-atan2-range]
        drawMs: 2000
      - id: draw-hypot
        type: whiteboard.apply
        at: { mark: draw-hypot }
        upsertIds: [h-hypot, h-hypot-note]
        drawMs: 2000

  - id: pow-live
    chapter: "Pow နဲ့ ကျန်တဲ့ math function တွေ"
    narration: >
      [[mark:close-inverse]] အခု ထပ်ကိန်းပါ။ [[mark:type-h2]] pow က ဂဏန်း တစ်ခုကို သူ့ကိုယ်သူ အကြိမ်ကြိမ်
      မြှောက်ပေးပါတယ်။ အဆင့် 2 ခေါင်းစဉ်တွေကို 1.25 ရဲ့ 3 ထပ်ကို 1 rem နဲ့ မြှောက်ပြီး ပေးပါမယ်။ pow ရဲ့
      argument နှစ်ခုလုံးက unit မပါတဲ့ ဂဏန်း ဖြစ်ရလို့၊ unit က 1 rem နဲ့ မြှောက်မှ ရပါတယ်။
      [[mark:after-h2]] အဆင့် 2 ခေါင်းစဉ် အားလုံး 31 pixel လောက်အထိ ကြီးလာပါပြီ။ [[mark:scroll-drinks]]
      အခု သောက်စရာ menu ထဲက အဆင့် 3 ခေါင်းစဉ်တွေကို ကြည့်ရအောင်။ [[mark:type-h3]] အချိုး တူတူနဲ့ တစ်ဆင့်
      နိမ့်ပြီး၊ 1.25 ရဲ့ 2 ထပ် ပေးပါမယ်။ အဆင့် တစ်ခုစီက သူ့အောက်က အဆင့်ရဲ့ 1.25 ဆ ဖြစ်လို့၊ အရွယ်အစားတွေ
      အချိုးကျ နေပါတယ်။ [[mark:after-h3]] သောက်စရာ နာမည်တွေ 25 pixel ဖြစ်လာပါပြီ။ [[mark:select-pow]] ဒီ calc ကို ကြည့်ပါ။ rem နဲ့ မြှောက်ထားလို့၊ ခေါင်းစဉ် အရွယ် အားလုံးက ဖတ်တဲ့သူရဲ့ စာလုံး အရွယ် setting
      ကို လိုက်ပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Functions: pow() and exp()"
        url: "https://web.dev/learn/css/functions#pow_and_exp"
      - title: "MDN — pow()"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/pow"
    actions:
      - id: close-inverse
        type: whiteboard.apply
        at: { mark: close-inverse }
        open: false
      - id: type-h2
        type: editor.type
        at: { mark: type-h2 }
        cadence: fast-explainer
        target:
          { file: styles.css, after: "  width: calc(sin(90deg) * 200px);\n}\n", occurrence: 1 }
        text: "\nh2 {\n  font-size: calc(pow(1.25, 3) * 1rem);\n}\n"
      - id: expect-h2
        type: expect.preview
        at: { mark: after-h2 }
        timeoutMs: 4000
        target: { by: testId, value: about }
        textContains: "ဆိုင်အကြောင်း"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: scroll-drinks
        type: preview.scroll
        at: { mark: scroll-drinks }
        timeoutMs: 5000
        top: 380
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-h3
        type: editor.type
        at: { mark: type-h3 }
        cadence: fast-explainer
        target:
          { file: styles.css, after: "  font-size: calc(pow(1.25, 3) * 1rem);\n}\n", occurrence: 1 }
        text: "\nh3 {\n  font-size: calc(pow(1.25, 2) * 1rem);\n}\n"
      - id: expect-h3
        type: expect.preview
        at: { mark: after-h3 }
        timeoutMs: 4000
        target: { by: testId, value: menu-drinks }
        textContains: "သံပုရာရည်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-pow
        type: editor.select
        at: { mark: select-pow }
        target: { file: styles.css, text: "calc(pow(1.25, 2) * 1rem)", occurrence: 1 }

  - id: more-math-board
    narration: >
      [[mark:open-more-math]] CSS မှာ math function နောက်ထပ် တချို့ ရှိပါသေးတယ်။
      [[mark:draw-sqrt]] sqrt က နှစ်ထပ်ကိန်းရင်းကို ပေးပါတယ်။ 25 ရဲ့ sqrt က 5 ပါ။ pow လိုပဲ unit မပါတဲ့
      ဂဏန်းကိုပဲ ယူပါတယ်။ [[mark:draw-exp-log]] exp က e ဆိုတဲ့ ဂဏန်းကို ထပ်ကိန်း တင်ပေးပြီး၊ log က အဲဒီရဲ့
      ပြောင်းပြန်ပါ။ base 2 နဲ့ဆိုရင် 16 ရဲ့ log က 4 ပါ။ [[mark:draw-abs-sign]] abs က အနုတ် လက္ခဏာကို
      ဖယ်ပြီး unit ကိုတော့ ထားပါတယ်။ sign ကတော့ တန်ဖိုးရဲ့ လက္ခဏာအလိုက် အနုတ် 1၊ သုည ဒါမှမဟုတ် 1 ကို
      ပေးလို့၊ တွက်ချက်မှုရဲ့ ဦးတည်ရာကို ပြောင်းဖို့ သုံးပါတယ်။ [[mark:draw-new]] ဒီ နှစ်ခုက အသစ်
      ဖြစ်လို့၊ browser support ကို အရင် စစ်ကြည့်ပါ။ [[mark:draw-round]] round က တန်ဖိုးကို ကိုယ်ပေးတဲ့
      ဂဏန်းရဲ့ အနီးဆုံး ဆတိုးကိန်းဆီ ညှိပေးပြီး၊ mod နဲ့ rem က စားလို့ ကျန်တဲ့ အကြွင်းကို ပေးပါတယ်။ ဒီ rem
      က unit မဟုတ်ဘဲ function ပါ။ [[mark:draw-constants]] math function တွေက pi၊ e၊ infinity နဲ့ ဂဏန်း
      မဟုတ်ဘူး ဆိုတဲ့ NaN လို ပုံသေ တန်ဖိုးတွေကိုလည်း လက်ခံပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Functions: exponential functions"
        url: "https://web.dev/learn/css/functions#exponential_functions"
      - title: "web.dev Learn CSS — Functions: sqrt() and log()"
        url: "https://web.dev/learn/css/functions#sqrt"
      - title: "web.dev Learn CSS — Functions: sign-related functions"
        url: "https://web.dev/learn/css/functions#sign_related_functions"
      - title: "MDN — round()"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/round"
      - title: "MDN — <calc-keyword> (pi, e, infinity, NaN)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/calc-keyword"
    actions:
      - id: open-more-math
        type: whiteboard.apply
        at: { mark: open-more-math }
        open: true
        clear: true
        upsertIds: [i-title]
      - id: draw-sqrt
        type: whiteboard.apply
        at: { mark: draw-sqrt }
        upsertIds: [i-sqrt, i-sqrt-note]
        drawMs: 1600
      - id: draw-exp-log
        type: whiteboard.apply
        at: { mark: draw-exp-log }
        upsertIds: [i-exp, i-log]
        drawMs: 1600
      - id: draw-abs-sign
        type: whiteboard.apply
        at: { mark: draw-abs-sign }
        upsertIds: [i-abs, i-sign]
        drawMs: 2000
      - id: draw-new
        type: whiteboard.apply
        at: { mark: draw-new }
        upsertIds: [i-new]
        drawMs: 1000
      - id: draw-round
        type: whiteboard.apply
        at: { mark: draw-round }
        upsertIds: [i-round]
        drawMs: 1200
      - id: draw-constants
        type: whiteboard.apply
        at: { mark: draw-constants }
        upsertIds: [i-const]
        drawMs: 1200

  - id: url-attr
    chapter: "Url နဲ့ attr"
    narration: >
      [[mark:open-url]] ဂဏန်း မဟုတ်တာကို ပြန်ပေးတဲ့ function နှစ်ခုလည်း ရှိပါသေးတယ်။ [[mark:draw-url]] url
      က ပုံ၊ font လို ဖိုင် တစ်ခုကို ညွှန်ပါတယ်။ path က relative ဖြစ်ရင်၊ page ရှိတဲ့ နေရာကနေ မဟုတ်ဘဲ
      stylesheet ရှိတဲ့ နေရာကနေ စရှာပါတယ်။ [[mark:draw-url-ok]] ဒါကြောင့် css folder ထဲက stylesheet က img
      folder ထဲက ပုံကို တောင်းရင်၊ browser က css folder ရဲ့ အထဲမှာ ရှာပါတယ်။ ပုံက အပြင်က img folder ထဲမှာ ရှိနေရင် ရှာမတွေ့လို့၊ error မပြဘဲ ပုံ မပေါ်လာရုံပါပဲ။ [[mark:draw-url-data]] url
      ထဲမှာ ဖိုင်ရဲ့ data ကိုယ်တိုင်ကိုလည်း data URI အနေနဲ့ ထည့်လို့ ရပြီး၊ အဲဒီအခါ ဖိုင် သီးသန့် မလိုတော့ပါဘူး။ [[mark:draw-attr]] attr ကတော့ element ရဲ့ HTML attribute ကို
      ဖတ်ပါတယ်။ စာသား ထည့်ပေးတဲ့ content property ထဲမှာဆိုရင် browser အားလုံးမှာ ရပြီး၊ lesson 26 မှာ
      သုံးပါမယ်။ တခြား property တွေမှာတော့ browser တိုင်းမှာ မရသေးပါဘူး။
    sources:
      - title: "web.dev Learn CSS — Functions: functions that return a value"
        url: "https://web.dev/learn/css/functions#functions_that_return_a_value"
      - title: "MDN — url()"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/url_value"
      - title: "MDN — attr()"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/attr"
    actions:
      - id: open-url
        type: whiteboard.apply
        at: { mark: open-url }
        clear: true
        upsertIds: [j-title]
      - id: draw-url
        type: whiteboard.apply
        at: { mark: draw-url }
        upsertIds: [j-css, j-url]
        drawMs: 1800
      - id: draw-url-ok
        type: whiteboard.apply
        at: { mark: draw-url-ok }
        upsertIds: [j-ok, j-bad]
        drawMs: 2000
      - id: draw-url-data
        type: whiteboard.apply
        at: { mark: draw-url-data }
        upsertIds: [j-data]
        drawMs: 1200
      - id: draw-attr
        type: whiteboard.apply
        at: { mark: draw-attr }
        upsertIds: [j-attr, j-attr-res, j-attr-note]
        drawMs: 2000

  - id: families-board
    chapter: "Function မိသားစုတွေ"
    narration: >
      [[mark:open-families]] function တွေ အများကြီး ကျန်ပါသေးတယ်။ မိသားစု တစ်ခုစီကို သူ့ lesson နဲ့သူ
      သင်ပါမယ်။ [[mark:draw-fam-transform]] rotate၊ scale၊ translate က element ကို လှည့်တာ၊ ချဲ့ချုံ့တာ၊ ရွှေ့တာ လုပ်ပြီး၊ lesson 14 မှာပါ။ [[mark:draw-fam-gradient]] linear gradient က အရောင် ကူးသွားတဲ့
      နောက်ခံကို ဆွဲပြီး lesson 32 မှာပါ။ [[mark:draw-fam-shape]] circle၊ polygon နဲ့ rect က element ကို
      ဖြတ်ယူမယ့် ပုံသဏ္ဌာန်တွေကို ပေးပြီး၊ lesson 35 မှာပါ။ [[mark:draw-fam-filter]] blur နဲ့
      grayscale လို filter တွေက lesson 36 မှာပါ။ [[mark:draw-fam-easing]] animation ရဲ့ အမြန်နှုန်းကို
      ထိန်းတဲ့ function တွေကတော့ lesson 38 နဲ့ 39 မှာပါ။ [[mark:draw-quiz]] မေးခွန်း တစ်ခု မေးကြည့်ရအောင်။
      45၊ 10 ဒီဂရီ၊ pi နဲ့ 5 em ထဲက ဘယ်ဟာတွေကို sin ထဲ ထည့်လို့ ရမလဲ။ ခဏ စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] 5 em ကလွဲရင်
      အကုန် ရပါတယ်။ 45 က radian ဖြစ်ပြီး pi က ဂဏန်းပါ။ 5 em ကတော့ ထောင့် မဟုတ်ဘဲ length ဖြစ်လို့ မရပါဘူး။
    sources:
