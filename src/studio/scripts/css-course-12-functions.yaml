# CSS course (Burmese), lesson 12 of 43: CSS functions.
#
# Narration is Burmese (voice-script.md next to this file is its source;
# DESIGN.md is the span-by-span brief). Every [[mark:…]] sits where its action
# begins, at a sentence end; each span carries one piece of meaning.
# Everything the learner sees (title, chapters, whiteboard labels, UI strings)
# is Burmese already.
#
# Shape: board (recall lesson 11's var(); what a function is: name, brackets,
# arguments → value; no space before the bracket) → board (functions already
# met: colour functions, var(), :is()/:where()/:not() with their specificity,
# minmax()/fit-content() for grid; today's math functions) → code tour
# (hero paragraph, about story, the new order gauge with its half-way mark and
# the steam line, drink-card headings; empty styles.css) → board (math is done
# at layout time: 100% − 64px on a phone and on a wide screen) → calc() on the
# hero paragraph → calc(100%-64px) without spaces is skipped; board of calc's
# rules → min() caps the about section at 320px; board (min = upper limit,
# max = lower limit) → clamp() on the bar, the track typed at 200 / 320 /
# 400px shows the minimum, preferred and maximum; board (three cases, clamp =
# max(min, min(pref, max)), fluid text with a rem part) → board (unit circle:
# cos = x, sin = y, unitless = radians) → sin() on the steam line: 30deg →
# 100px, unitless 30 → 0 (negative width clamped), 90deg → 200px → board
# (asin/acos/atan ranges, atan2, hypot) → pow() type scale on h2 and h3 →
# board (sqrt, exp, log, abs, sign, round/mod/rem, constants) → board (url()
# resolves from the stylesheet, data: URIs; attr() in content) → board
# (function families and their lessons; quiz) → recap, hand-off to layout
# (lesson 13).
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set( (url() is only explained, on the
# board); no postcss config; no reload. Every rule that contains a bracket is
# typed while it is the LAST rule in the file, so an unclosed bracket can only
# swallow the end of its own rule. Every keystroke prefix was checked in
# headless Chrome (probe/stages.ts): no prefix shows a state other than the
# one before or the final one (half-typed math is invalid and ignored; the
# only valid prefixes, calc(100% and min(100%, equal the current width). The
# pow() values are written number-first, calc(pow(…) * 1rem), so no prefix is
# a valid length.
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
