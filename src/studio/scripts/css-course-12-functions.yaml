      - title: "web.dev Learn CSS — Functions: transforms"
        url: "https://web.dev/learn/css/functions#transforms"
      - title: "web.dev Learn CSS — Functions: animation functions, gradients and filters"
        url: "https://web.dev/learn/css/functions#animation_functions_gradients_and_filters"
      - title: "MDN — <basic-shape> (includes rect())"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/basic-shape"
      - title: "web.dev Learn CSS — Functions: check your understanding"
        url: "https://web.dev/learn/css/functions#check_your_understanding"
    actions:
