  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ CSS function က ကွင်းထဲက argument တွေကို ယူပြီး တန်ဖိုး တစ်ခု
      ပြန်ပေးပါတယ်။ calc က unit မတူတဲ့ တန်ဖိုးတွေကို ရောတွက်ပြီး၊ အပေါင်း အနုတ် ဘေးမှာ space လိုပါတယ်။ min
      က အထက် ကန့်သတ်ချက်၊ max က အောက် ကန့်သတ်ချက်၊ clamp က နှစ်ခုလုံး ပေးပါတယ်။ trigonometric function နဲ့
      pow က ထောင့်နဲ့ ဂဏန်းကနေ အရွယ်အစားကို တွက်ပေးပါတယ်။ [[mark:next-lesson]] ဒါနဲ့ course ရဲ့ တန်ဖိုးတွေ
      အကြောင်း အပိုင်း ပြီးပါပြီ။ နောက် lesson မှာတော့ layout ကို စပြီး၊ CSS က box တွေကို page ပေါ်မှာ
      နည်း အမျိုးမျိုးနဲ့ နေရာချပုံကို ကြည့်သွားပါမယ်။
    sources:
      - title: "web.dev Learn CSS — Functions"
        url: "https://web.dev/learn/css/functions"
      - title: "MDN — CSS value functions"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_Functions"
      - title: "web.dev Learn CSS — Layout (next lesson)"
        url: "https://web.dev/learn/css/layout"
    actions:
      - id: close-families
        type: whiteboard.apply
        at: { mark: recap }
        open: false
      - id: expect-final-css
        type: expect.file
        at: { mark: recap }
        path: styles.css
        contains: ".hero p {\n  background: wheat;\n  width: calc(100% - 64px);\n}\n\n.about p {\n  background: wheat;\n  width: calc(100%-64px);\n}\n\n.about {\n  width: min(100%, 320px);\n}\n\n.bar {\n  width: clamp(120px, 50%, 180px);\n}\n\n.track {\n  width: 200px;\n  width: 320px;\n  width: 400px;\n}\n"
      - id: expect-final-css-2
        type: expect.file
        at: { afterAction: expect-final-css }
        path: styles.css
        contains: ".steam {\n  width: calc(sin(30deg) * 200px);\n  width: calc(sin(30) * 200px);\n  width: calc(sin(90deg) * 200px);\n}\n\nh2 {\n  font-size: calc(pow(1.25, 3) * 1rem);\n}\n\nh3 {\n  font-size: calc(pow(1.25, 2) * 1rem);\n}\n"

checks:
  - { type: timing.p95Ms, max: 300 }
