      server မှာလည်း run ပါတယ်။ [[mark:draw-config]] နေရာတိုင်းမှာ test တွေကို တစ်ပုံစံတည်း run စေချင်ရင်၊
      setting တွေကို လူတစ်ယောက်ချင်း ရိုက်တဲ့ command ထဲမှာ မထားဘဲ project ထဲက config ဖိုင် တစ်ဖိုင်ထဲမှာ
      ထားရပါတယ်။ ဘယ် ဖိုင်တွေကို test လုပ်မလဲ၊ test တစ်ခုနဲ့ တစ်ခုကြားမှာ mock တွေကို ဘယ်လို
      ပြန်ရှင်းမလဲ၊ ဘယ် environment မှာ run မလဲ ဆိုတာတွေကို ဒီ ဖိုင်က ဆုံးဖြတ်ပါတယ်။ [[mark:draw-root]] Vitest ၅ ကစပြီး
      config ဖိုင်ကို parent folder တွေထဲမှာ လိုက်မရှာတော့လို့၊ Vitest ကို run တဲ့ project ရဲ့ root folder
      မှာ ထားရပါမယ်။
    sources:
      - { title: "Vitest: Configuring Vitest", url: "https://vitest.dev/config/" }
      - {
          title: "Vitest: Migration guide, config files are not looked up from parent directories (facts A19)",
          url: "https://vitest.dev/guide/migration/#config-files-are-not-looked-up-from-parent-directories",
        }
      - {
          title: "web.dev Learn Testing: Where tests run",
          url: "https://web.dev/learn/testing/get-started/where-tests-run",
        }
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-people
        type: whiteboard.apply
        at: { mark: draw-people }
        upsertIds: [a-p1-box, a-p1, a-p2-box, a-p2, a-ci-box, a-ci]
        drawMs: 3500
      - id: draw-config
        type: whiteboard.apply
        at: { mark: draw-config }
        upsertIds:
          [
            a-arrow-1,
            a-arrow-2,
            a-arrow-3,
            a-config-box,
            a-config-name,
            a-config-1,
            a-config-2,
            a-config-3,
          ]
        drawMs: 5000
      - id: draw-root
        type: whiteboard.apply
        at: { mark: draw-root }
        upsertIds: [a-root]
        drawMs: 1500

  - id: starter
    narration: >
      ဆိုင်ရဲ့ project ထဲက config ဖိုင်ကို ကြည့်ရအောင်။ [[mark:select-import]] ဖိုင်ရဲ့ အပေါ်ဆုံးမှာ define
      Config ကို Vitest ကနေ import လုပ်ထားပါတယ်။ ဒီ function နဲ့ ရေးထားတော့ editor က option တွေကို သိပြီး
      ရိုက်တဲ့အခါ ကူညီပေးနိုင်ပါတယ်။ [[mark:select-test-block]] test ဆိုတဲ့ အပိုင်းထဲမှာ Vitest ရဲ့ option တွေကို
      ထည့်ရပါတယ်။ အခုတော့ ဘာမှ မထည့်ရသေးလို့ Vitest ရဲ့ default တွေနဲ့ပဲ run ပါတယ်။ project ထဲမှာ vite
      config ဖိုင်လည်း ရှိပေမဲ့၊ vitest config ဖိုင် ရှိရင် Vitest က အဲဒါကိုပဲ ဖတ်ပြီး vite config ထဲက setting
      တွေကို မသုံးတော့ပါဘူး။ နှစ်ခုလုံးကို သုံးချင်ရင်တော့ merge Config နဲ့ ပေါင်းရပါတယ်။
      [[mark:open-clock-test]] test ဖိုင် နှစ်ဖိုင်ကိုလည်း ကြည့်ရအောင်။ ဒါက ဆိုင်ရဲ့ နှုတ်ဆက်စာကို စစ်တဲ့ test
      ဖိုင်ပါ။ [[mark:select-spy]] ပထမ test က spy On နဲ့ လက်ရှိ အချိန်ကို မနက် ၉ နာရီ ဖြစ်အောင်
      အစားထိုးပြီး၊ မင်္ဂလာ နံနက်ခင်းပါ လို့ နှုတ်ဆက်လား စစ်ပါတယ်။ ဒါပေမဲ့ spy ကို ပြန်မဖြုတ်ထားပါဘူး။
      [[mark:select-guard]] ဒုတိယ test ကတော့ spy တစ်ခု နောက် test တွေထဲ ကျန်ခဲ့ဖူးလို့ အဖွဲ့က ထည့်ထားတဲ့ test
      ပါ။ အချိန် ပြန်ပေးတဲ့ function က မူလ function ဖြစ်နေရမယ်လို့ စစ်ပါတယ်။ [[mark:open-delivery-test]]
      ဒါကတော့ ပို့ခ တွက်တဲ့ test ဖိုင်ပါ။ [[mark:select-stub]] ပထမ test က fetch ကို stub Global နဲ့
      အစားထိုးပြီး ဗဟန်းကို ၃ ကီလိုမီတာလို့ ပြန်ပေးခိုင်းထားလို့၊ ပို့ခ ၁၃၀၀ ကျပ် ဖြစ်ရမယ်လို့ စစ်ပါတယ်။
      [[mark:select-after-all]] stub ကိုတော့ ဖိုင်ရဲ့ အောက်ဆုံးက after All မှာမှ ပြန်ဖြုတ်ထားပါတယ်။ after
      All က ဖိုင်ထဲက test အားလုံး ပြီးမှ run တာ ဖြစ်လို့၊ ကြားထဲက test တွေမှာ stub က ကျန်နေပါသေးတယ်။
    sources:
      - {
          title: "Vitest: Configuring Vitest, vitest.config overrides vite.config (facts A26)",
          url: "https://vitest.dev/config/",
        }
      - { title: "Vitest: vi.spyOn", url: "https://vitest.dev/api/vi#vi-spyon" }
      - { title: "Vitest: vi.stubGlobal", url: "https://vitest.dev/api/vi#vi-stubglobal" }
      - {
          title: "web.dev Learn Testing: Component testing, afterAll(vi.unstubAllGlobals) (facts B02)",
          url: "https://web.dev/learn/testing/get-started/component-testing",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: select-import
        type: editor.select
        at: { mark: select-import }
        target:
          {
            file: vitest.config.js,
            text: 'import { defineConfig } from "vitest/config";',
            occurrence: 1,
          }
      - id: select-test-block
        type: editor.select
        at: { mark: select-test-block }
        target: { file: vitest.config.js, text: "  test: {\n  },", occurrence: 1 }
      - id: open-clock-test
        type: workspace.openFile
        at: { mark: open-clock-test }
        path: src/clock.test.js
      - id: select-spy
        type: editor.select
        at: { mark: select-spy }
        target:
          {
            file: src/clock.test.js,
            text: 'vi.spyOn(clock, "now").mockReturnValue(morning);',
            occurrence: 1,
          }
      - id: select-guard
        type: editor.select
        at: { mark: select-guard }
        target: { file: src/clock.test.js, text: "expect(clock.now).toBe(realNow);", occurrence: 1 }
      - id: open-delivery-test
        type: workspace.openFile
        at: { mark: open-delivery-test }
        path: src/delivery.test.js
      - id: select-stub
        type: editor.select
        at: { mark: select-stub }
        target:
          {
            file: src/delivery.test.js,
            text: 'vi.stubGlobal("fetch", vi.fn().mockResolvedValue(response));',
            occurrence: 1,
          }
      - id: select-after-all
        type: editor.select
        at: { mark: select-after-all }
        target:
          {
            file: src/delivery.test.js,
            text: "afterAll(() => {\n  vi.unstubAllGlobals();\n});",
            occurrence: 1,
          }

  - id: panel
    narration: >
      [[mark:ready]] Vitest က ဒီ project ကို run လိုက်တော့ ဘာ ပြလဲ ကြည့်ရအောင်။ ညာဘက်က panel ကလည်း code
      ဒါမှမဟုတ် config ပြောင်းတိုင်း ပြန် run တဲ့ တကယ့် Vitest ရဲ့ ရလဒ်ပါ။ [[mark:read-start]] အပေါ်မှာ
      အနီရောင် FAIL ပြနေပြီး၊ test စာရင်းမှာလည်း ဖိုင် သုံးဖိုင်လုံးရဲ့ ရှေ့မှာ အနီရောင် မြှားလေးတွေ
      ပေါ်နေပါတယ်။ ကိုယ် test ဖိုင်လို့ မထင်ထားတဲ့ end to end folder ထဲက ဖိုင်ကိုပါ Vitest က run သွားတာပါ။
      [[mark:read-suite]] Failed Suites
      အပိုင်းမှာ အဲဒီ ဖိုင်ကို run တုန်း Playwright ရဲ့ package ကို ရှာမတွေ့ဘူးလို့ ပြနေပြီး၊ test စာရင်းမှာလည်း
      ဒီ ဖိုင်က test တစ်ခုမှ မ run ရဘူးလို့ ပြပါတယ်။ အောက်က ကျနေတဲ့ test နှစ်ခုကိုတော့ နောက်မှ
      ပြန်ကြည့်ပါမယ်။
    sources:
      - {
          title: "Vitest: include (default test file globs, facts A05)",
          url: "https://vitest.dev/config/include",
        }
      - {
          title: "Vitest: Writing Tests, reading test output",
          url: "https://vitest.dev/guide/learn/writing-tests#reading-test-output",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-start-fail
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 3, delayMs: 1000 }
      - id: expect-start-files
        type: expect.preview
        at: { afterAction: expect-start-fail }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-files-failed, value: "3" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-tests
        type: expect.preview
        at: { afterAction: expect-start-files }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-failed, value: "2" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-e2e-row
        type: expect.preview
        at: { afterAction: expect-start-tests }
        timeoutMs: 5000
        target: { by: testId, value: vt-file-1 }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-suite
        type: expect.preview
        at: { afterAction: expect-start-e2e-row }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-kind, value: suite }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-suite-message
        type: expect.preview
        at: { afterAction: expect-start-suite }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute:
          {
            name: data-message,
            value: "Cannot find package '@playwright/test' imported from e2e/order.spec.js",
          }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: include
    chapter: "ဘယ် ဖိုင်တွေကို run မလဲ"
    narration: >
      Vitest ကို ကျစေတဲ့ ဖိုင်ကို ဖွင့်ကြည့်ရအောင်။ [[mark:open-e2e]] ဒါက Playwright အတွက် ရေးထားတဲ့ end to
      end test ပါ။ [[mark:select-goto]] ပထမ line က ဆိုင်ရဲ့ page ကို browser မှာ ဖွင့်ပါတယ်။
      [[mark:select-click]] ပြီးတော့ customer တစ်ယောက်လိုပဲ လက်ဖက်ရည် ထည့်မယ် ခလုတ်ကို ရှာပြီး နှိပ်ပါတယ်။
      [[mark:select-total]] နောက်ဆုံးမှာ screen ပေါ်က စုစုပေါင်းက ၁၅၀၀ ကျပ် ဖြစ်လား စစ်ပါတယ်။ ဒီ test ကို run
      တာ Vitest မဟုတ်ဘဲ Playwright ဖြစ်ပြီး၊ browser အစစ်ကို ထိန်းပြီး run ပါတယ်။ ဒီ lesson ထဲမှာတော့
      အဲဒီလို run တာကို မပြနိုင်ပါဘူး။ [[mark:why-collected]] ဒါဆို Vitest က ဘာလို့ ဒီ ဖိုင်ကို run ခဲ့တာလဲ။
      Vitest က default အနေနဲ့ project တစ်ခုလုံးမှာ နာမည်ထဲ test ဒါမှမဟုတ် spec ပါတဲ့ ဖိုင် အားလုံးကို
      လိုက်ရှာလို့ပါ။ ဒီ ဖိုင်နာမည်မှာ spec ပါနေတော့ ကိုယ့် test လို့ ထင်ပြီး run လိုက်တာပါ။
      [[mark:open-config-2]] config ဖိုင်ကို ပြန်ဖွင့်ပါမယ်။ [[mark:type-include]] test အပိုင်းထဲမှာ include
      option ကို ထည့်ပြီး၊ src folder ထဲက test ဖိုင်တွေကိုပဲ ရှာခိုင်းပါမယ်။ include က default pattern ကို
      အစားထိုးတာ ဖြစ်လို့၊ ဒီ ပုံစံနဲ့ ကိုက်တဲ့ ဖိုင်တွေကိုပဲ Vitest က run ပါတော့မယ်။ ဖိုင် တချို့ကိုပဲ
      ဖယ်ချင်ရင်တော့ exclude option ကို သုံးပါတယ်။ [[mark:read-include]]
      config ပြောင်းသွားလို့ Vitest က config အသစ်နဲ့ ပြန် စ run ပါတယ်။ panel ကို ကြည့်ပါ။ test စာရင်းထဲမှာ end
      to end ဖိုင် မရှိတော့ဘဲ၊ src folder ထဲက test ဖိုင် နှစ်ဖိုင်ပဲ ကျန်ပါတော့တယ်။ Failed Suites အပိုင်းလည်း
      ပျောက်သွားပြီး၊ ကျနေတဲ့ test နှစ်ခုပဲ ကျန်ပါတယ်။
    sources:
      - { title: "Vitest: include (facts A05)", url: "https://vitest.dev/config/include" }
      - { title: "Vitest: exclude", url: "https://vitest.dev/config/exclude" }
      - {
          title: "web.dev Learn Testing: Test types, end-to-end tests",
          url: "https://web.dev/learn/testing/get-started/test-types#end-to-end_tests",
        }
      - { title: "Playwright: Writing tests", url: "https://playwright.dev/docs/writing-tests" }
    actions:
      - id: open-e2e
        type: workspace.openFile
        at: { mark: open-e2e }
        path: e2e/order.spec.js
      - id: select-goto
        type: editor.select
        at: { mark: select-goto }
        target: { file: e2e/order.spec.js, text: 'await page.goto("/");', occurrence: 1 }
      - id: select-click
        type: editor.select
        at: { mark: select-click }
        target:
          {
            file: e2e/order.spec.js,
            text: 'await page.getByRole("button", { name: "လက်ဖက်ရည် ထည့်မယ်" }).click();',
            occurrence: 1,
          }
      - id: select-total
        type: editor.select
        at: { mark: select-total }
        target:
          {
            file: e2e/order.spec.js,
            text: 'await expect(page.getByTestId("total")).toHaveText("စုစုပေါင်း 1,500 ကျပ်");',
            occurrence: 1,
          }
      - id: open-config-2
        type: workspace.openFile
        at: { mark: open-config-2 }
        path: vitest.config.js
      - id: type-include
        type: editor.type
        at: { mark: type-include }
        target: { file: vitest.config.js, after: "  test: {\n", occurrence: 1 }
        text: "    include: [\"src/**/*.test.js\"],\n"
        cadence: block
      - id: expect-include
        type: expect.preview
        at: { afterAction: type-include }
        timeoutMs: 10000
        target: { by: testId, value: vt-tests }
        attribute: { name: data-files, value: "2" }
        retry: { maxAttempts: 3, delayMs: 2000 }
      - id: expect-include-files
        type: expect.preview
        at: { afterAction: expect-include }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-files-total, value: "2" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-include-no-suite
        type: expect.preview
        at: { afterAction: expect-include-files }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-kind, value: test }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: restore
    chapter: "Mock တွေကို project တစ်ခုလုံးမှာ ရှင်းရအောင်"
    narration: >
      ကျနေတဲ့ test နှစ်ခုကို ကြည့်ရအောင်။ [[mark:read-clock]] ပထမ FAIL အပိုင်းက နာရီ test ပါ။ function
      နှစ်ခုကို နှိုင်းယှဉ်ထားပြီး၊ ကြည့်ရတာ ကွာခြားချက် မရှိဘူးလို့တောင် ပြောထားပေမဲ့ တူညီတဲ့ function
      မဟုတ်လို့ ကျနေတာပါ။ ပထမ test ရဲ့ spy က နာမည်တူ function အတုနဲ့ အစားထိုးထားပြီး ပြန်မဖြုတ်ခဲ့လို့ပါ။
      [[mark:read-fetch]] ဒုတိယ FAIL အပိုင်းကတော့ fetch အစစ် ဖြစ်ရမယ့် နေရာမှာ Mock ရနေတယ်လို့
      ပြောနေပါတယ်။ after All က နောက်ကျလွန်းလို့ stub က ဒုတိယ test ထဲ ကျန်နေတာပါ။
      [[mark:type-restore]] ဒီ ပြဿနာကို ဖိုင်တိုင်းမှာ ကိုယ်တိုင် လိုက်ပြင်မယ့်အစား၊ config မှာ restore Mocks
      ကို ဖွင့်လိုက်ပါမယ်။ ဒီ option က test တိုင်း မစခင် spy On နဲ့ အစားထိုးထားတာတွေကို မူလ function တွေ
      ပြန်ထားပေးပါတယ်။ [[mark:read-restore]] Vitest က ပြန် run လိုက်တော့ နာရီ test ဖိုင်က နှစ်ခုလုံး pass
      ဖြစ်သွားပါပြီ။ ဒါပေမဲ့ fetch ကို စစ်တဲ့ test ကတော့ ကျနေတုန်းပါ။ သူ့ FAIL အပိုင်းက အပေါ်ကို
      ရောက်လာပြီး၊ အစိမ်းရောင် Expected က fetch အစစ်၊ အနီရောင် Received ကတော့ Mock ဖြစ်နေပါတယ်။ stub
      Global က spy မဟုတ်လို့ restore Mocks နဲ့ မဆိုင်ပါဘူး။ [[mark:type-unstub]] ဒါကြောင့် unstub Globals ကိုလည်း ဖွင့်ပါမယ်။ test တိုင်း
      မစခင် stub Global နဲ့ အစားထိုးထားတဲ့ global တွေကို မူလ အတိုင်း ပြန်ထားပေးပါတယ်။ [[mark:read-unstub]]
      panel ကို ကြည့်ပါ။ test လေးခုလုံး pass ဖြစ်ပြီး အစိမ်းရောင် PASS ပေါ်လာပါပြီ။ project ထဲက test
      ဖိုင်တိုင်း ဒီ ရှင်းလင်းမှုကို အလိုလို ရတဲ့အတွက်၊ ဖိုင်ထဲက after All လို code တွေကို ကိုယ့် project မှာ
      ဖျက်လိုက်လို့ ရပါပြီ။ [[mark:clear-mocks]] Vitest ၅ မှာ clear Mocks ကတော့ default အနေနဲ့ ဖွင့်ထားပြီးသားပါ။
      ဒါက mock တွေ ဘယ်နှခါ ခေါ်ခံရလဲ ဆိုတဲ့ မှတ်တမ်းကိုပဲ ရှင်းပေးပြီး၊ အစားထိုးထားတဲ့ function ကိုတော့
      မူလ အတိုင်း ပြန်မထားပေးပါဘူး။ spy On lesson မှာ ပြောခဲ့သလို၊ Vitest ရဲ့ AI နဲ့ test ရေးတဲ့ guide က
      restore Mocks ကို ဖွင့်ထားဖို့ အကြံပေးထားတာလည်း ဒါကြောင့်ပါ။
    sources:
      - { title: "Vitest: restoreMocks (facts A10)", url: "https://vitest.dev/config/restoremocks" }
      - {
          title: "Vitest: unstubGlobals (facts A11)",
          url: "https://vitest.dev/config/unstubglobals",
        }
      - {
          title: "Vitest: clearMocks, on by default in Vitest 5 (facts A09)",
          url: "https://vitest.dev/config/clearmocks",
        }
      - {
          title: "Vitest: Writing Tests with AI, mock cleanup (facts D17)",
          url: "https://vitest.dev/guide/learn/writing-tests-with-ai#mock-cleanup",
        }
      - {
          title: "Vitest: Debugging Failing Tests, mocks not cleaned up",
          url: "https://vitest.dev/guide/learn/debugging-tests#mocks-not-cleaned-up",
        }
    actions:
      - id: expect-clock-message
        type: expect.preview
        at: { mark: read-clock }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute:
          {
            name: data-message,
            value: "expected [Function now] to be [Function now] // Object.is equality",
          }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-fetch-message
        type: expect.preview
        at: { mark: read-fetch }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-2 }
        attribute:
          {
            name: data-message,
            value: "expected [Function Mock] to be [Function fetch] // Object.is equality",
          }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: type-restore
        type: editor.type
        at: { mark: type-restore }
        target:
          { file: vitest.config.js, after: "    include: [\"src/**/*.test.js\"],\n", occurrence: 1 }
        text: "    restoreMocks: true,\n"
        cadence: block
      - id: expect-restore
        type: expect.preview
        at: { afterAction: type-restore }
        timeoutMs: 10000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-failed, value: "1" }
        retry: { maxAttempts: 3, delayMs: 2000 }
      - id: expect-restore-clock
        type: expect.preview
        at: { afterAction: expect-restore }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-2 }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-restore-fetch-received
        type: expect.preview
        at: { afterAction: expect-restore-clock }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-actual, value: "[Function Mock]" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: type-unstub
        type: editor.type
        at: { mark: type-unstub }
        target: { file: vitest.config.js, after: "    restoreMocks: true,\n", occurrence: 1 }
        text: "    unstubGlobals: true,\n"
        cadence: block
      - id: expect-unstub
        type: expect.preview
        at: { afterAction: type-unstub }
        timeoutMs: 10000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 2000 }
      - id: expect-unstub-count
        type: expect.preview
        at: { afterAction: expect-unstub }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "4" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-config-file
        type: expect.file
        at: { afterAction: expect-unstub-count }
        path: vitest.config.js
        contains: "  test: {\n    include: [\"src/**/*.test.js\"],\n    restoreMocks: true,\n    unstubGlobals: true,\n  },"

  - id: more
    chapter: "တခြား option တွေ"
    narration: >
      [[mark:board-more]] config မှာ ထည့်လေ့ရှိတဲ့ တခြား option တွေကိုလည်း ကြည့်ရအောင်။ ပထမ သုံးခုကိုတော့
      ရှေ့ lesson တွေမှာ တွေ့ခဲ့ပြီးပါပြီ။ [[mark:draw-env]] environment ကို test environment lesson မှာ DOM
      လိုတဲ့ test တွေအတွက် happy dom လို့ ပြောင်းခဲ့ပြီး၊ default ကတော့ Node ပါ။ [[mark:draw-setup]] setup
      Files ကတော့ Testing Library lesson မှာ jest dom ရဲ့ matcher တွေကို test ဖိုင်တိုင်းမှာ ရအောင် ထည့်ထားခဲ့တဲ့
      option ပါ။ [[mark:draw-timeout]] test Timeout ကတော့ async lesson မှာ ပြောခဲ့တဲ့ ၅ စက္ကန့် default ကို
      project တစ်ခုလုံးအတွက် ပြောင်းပေးပါတယ်။ [[mark:draw-projects]] projects ကတော့ setting မတူတဲ့ test အုပ်စုတွေကို project
      တစ်ခုထဲမှာ ခွဲ run ချင်တဲ့အခါ သုံးပါတယ်။ ဥပမာ logic test တွေကို Node မှာ၊ component test တွေကို happy dom
      မှာ run တာမျိုးပါ။ Vitest ၅ မှာ config ထဲမှာ ရေးထားတဲ့ project တွေက root config ရဲ့ setting တွေကို
      default အနေနဲ့ ယူသုံးပါတယ်။ [[mark:draw-note]] option တွေ အများကြီး ရှိပေမဲ့၊ default နဲ့ အဆင်ပြေရင်
      မထည့်ဘဲ ထားတာ အကောင်းဆုံးပါ။ project က တကယ် လိုမှ တစ်ခုချင်း ထည့်ပါ။
    sources:
      - { title: "Vitest: environment (facts A06)", url: "https://vitest.dev/config/environment" }
      - { title: "Vitest: setupFiles", url: "https://vitest.dev/config/setupfiles" }
      - { title: "Vitest: testTimeout", url: "https://vitest.dev/config/testtimeout" }
      - {
          title: "Vitest: Test Projects, inline projects inherit the root config (facts A19)",
          url: "https://vitest.dev/guide/projects",
        }
    actions:
      - id: board-more
        type: whiteboard.apply
        at: { mark: board-more }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-env
        type: whiteboard.apply
        at: { mark: draw-env }
        upsertIds: [b-env-code, b-env]
        drawMs: 2500
      - id: draw-setup
        type: whiteboard.apply
        at: { mark: draw-setup }
        upsertIds: [b-setup-code, b-setup]
        drawMs: 2500
      - id: draw-timeout
        type: whiteboard.apply
        at: { mark: draw-timeout }
        upsertIds: [b-timeout-code, b-timeout]
        drawMs: 2500
      - id: draw-projects
        type: whiteboard.apply
        at: { mark: draw-projects }
        upsertIds: [b-projects-code, b-projects]
        drawMs: 2500
      - id: draw-note
        type: whiteboard.apply
        at: { mark: draw-note }
        upsertIds: [b-note]
        drawMs: 1500

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ vitest config ဖိုင် တစ်ဖိုင်က အဖွဲ့ထဲက ကွန်ပျူတာတိုင်းနဲ့ CI မှာ
      test တွေကို တစ်ပုံစံတည်း run စေပါတယ်။ include နဲ့ ဘယ် ဖိုင်တွေကို run မလဲ သတ်မှတ်ပြီး၊ restore Mocks နဲ့
      unstub Globals က test တိုင်း မစခင် spy နဲ့ stub တွေကို ပြန်ရှင်းပေးပါတယ်။ [[mark:recap-more]] environment
      ပြောင်းတာ၊ setup ဖိုင် ထည့်တာ၊ timeout ပြင်တာ၊ project ခွဲတာ စတာတွေကိုတော့ project က လိုအပ်မှ ထည့်ပါ။
      နောက် lesson မှာတော့ ဒီ test တွေကို pull request တိုင်းမှာ အလိုလို run ပေးတဲ့ CI ကို ကြည့်သွားပါမယ်။
    sources:
      - { title: "Vitest: Configuring Vitest", url: "https://vitest.dev/config/" }
      - {
          title: "web.dev Learn Testing: Where tests run, presubmit and CI",
          url: "https://web.dev/learn/testing/get-started/where-tests-run#run_tests_as_part_of_presubmit_or_review",
        }
    actions:
      - id: close-more
        type: whiteboard.apply
        at: { scene: start }
        open: false
checks:
  - { type: timing.p95Ms, max: 300 }
