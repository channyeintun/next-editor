      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ ဘာမှ မစစ်ဘဲ pass ဖြစ်တဲ့ test တွေ၊ flaky test တွေနဲ့ အဖွဲ့ရဲ့ after
      Each က spy ကို ကိုယ်တိုင် restore လုပ်ပေးတာကို မြင်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ အဲဒီလို ရှင်းလင်းမှုတွေကို
      project တစ်ခုလုံးအတွက် တစ်နေရာတည်းမှာ သတ်မှတ်ပေးတဲ့ Vitest ရဲ့ config ဖိုင်ကို ကြည့်ပါမယ်။
      [[mark:draw-people]] project တစ်ခုရဲ့ test တွေကို နေရာ တစ်ခုထက် ပိုပြီး run ကြပါတယ်။ မြမြ ရဲ့
