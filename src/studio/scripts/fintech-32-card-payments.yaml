  - id: try-it
    chapter: ကိုယ်တိုင် စမ်းကြည့်ပါ
    narration: >-
      [[mark:close-iv]] ကိုယ်တိုင် စမ်းကြည့်ဖို့ တစ်ခု ရှိပါတယ်။ [[mark:sel-try]] interchange ကို
      နှစ်ဆယ်ကနေ သုံးဆယ် လို့ ပြောင်းပါ၊ consumer credit card ရဲ့ cap ပါ။ run ကြည့်ရင် issuer ဆီ ဆင့် ၃၀
      သွားပြီး merchant ဆီ ရောက်တာ ဆင့် ၁၀ ထပ် လျော့ပါလိမ့်မယ်။ [[mark:recap]] ပြန်ချုပ်ရရင်၊ card payment
      မှာ message က စက္ကန့်ပိုင်းအတွင်း issuer အထိ သွားပြီး၊ ငွေကတော့ ရက်ပိုင်းကြာမှ fee တွေ နုတ်ပြီး
      merchant ဆီ ရောက်ပါတယ်။ settle ဖြစ်ပြီးတာတောင် chargeback နဲ့ ပြန်ထွက်သွားနိုင်ပါတယ်။ နောက် lesson
      မှာတော့ ဘဏ်တွေကြား rail တွေကို ကြည့်ပါမယ်။ ဘဏ်တွေက ငွေကို တကယ် ပို့တာ မဟုတ်ဘဲ တစ်ခုဆီမှာ တစ်ခု
      ကိုင်ထားတဲ့ account တွေကို ပြင်တာ ဖြစ်ကြောင်း တွေ့ရပါမယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Appendix A: Payments, rails & cards (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#payments-rails-cards",
