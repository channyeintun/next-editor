  title: "Fintech Engineering 32: Card payment အလုပ်လုပ်ပုံ"
  locale: my-MM
  workspace:
    lessonType: go
    name: Fintech Engineering
    entryFilePath: main.go
    # One file: an open explorer would be a list of one beside the code.
    sidebarStartsCollapsed: true
    files:
      main.go: |
        package main

        import "fmt"

        // Fees in basis points (1 bp = 0.01%). Interchange is the EU cap for a consumer debit card;
        // the scheme fee and the acquirer margin are example values.
        const (
        	interchangeBP = 20 // EU cap: debit 0.2%, credit 0.3%
        	schemeFeeBP   = 4  // example value
        	acquirerBP    = 10 // example value
        )

        // fee is amount × bp / 10000, in cents.
        func fee(amount, bp int64) int64 { return amount * bp / 10_000 }

        // next lists the moves a card payment may make. Any other move is refused.
        var next = map[string][]string{
        	// state: the states it may move to
        }

        type Payment struct {
        	ID     string
        	Amount int64
        	State  string
        }

        // Move changes the state only along an edge listed in next.
        func (p *Payment) Move(to string) {
        	for _, s := range next[p.State] {
        		if s == to {
        			fmt.Printf("%s -> %s: ok\n", p.State, to)
        			p.State = to
        			return
        		}
        	}
        	fmt.Printf("%s -> %s: refused\n", p.State, to)
        }

        func main() {
        	amount := int64(10_000) // 100.00 EUR in cents, paid with a debit card
        	ic, sf, am := fee(amount, interchangeBP), fee(amount, schemeFeeBP), fee(amount, acquirerBP)
        	fmt.Println("interchange -> issuer: ", cents(ic))
        	fmt.Println("scheme fee -> network: ", cents(sf))
        	fmt.Println("acquirer margin:       ", cents(am))
        	fmt.Println("merchant receives:     ", cents(amount-ic-sf-am))
        }

        // cents prints minor units as an amount with two decimals: cents(1234) is "12.34".
        func cents(n int64) string {
        	sign := ""
        	if n < 0 {
        		sign, n = "-", -n
        	}
        	return fmt.Sprintf("%s%d.%02d", sign, n/100, n%100)
        }
