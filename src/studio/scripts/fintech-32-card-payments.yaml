# Fintech Engineering, lesson 32: how card payments work (Burmese).
#
# Source: Fintech Engineering Handbook, Appendix A "Payments, rails & cards" and "Clearing vs
# settlement" (CC BY 4.0, Voytek Pitula). Facts: B09, B10, B11, B22.
# Start state: main.go splits a 100.00 EUR debit card payment into interchange (EU cap), a scheme
# fee and an acquirer margin (example values) and prints what the merchant receives; the payment
# state machine's transition table is empty.
# Edits, all insert-only:
#   1. the transition table (authorized → captured / voided, captured → settled,
#      settled → charged_back) and a payment moved out of order, then in order
#                                                       -> run-2 refuses authorized -> settled
#   2. a chargeback after the merchant was paid out     -> run-3 merchant balance: -100.00
# Figures: parties (the four-party model, one party per step), two (the same map: authorization
# messages, then clearing and settlement with the fees), after (chargeback window, dunning),
# iv (the interview answer).
# Built by ~/Documents/fintech-course-work/tools/build-lesson.ts; fixtures by sim-go.ts --write.
