build:
  voiceProfile:
    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 9532

runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "interchange -> issuer:  0.20\nscheme fee -> network:  0.04\nacquirer margin:        0.10\nmerchant receives:      99.66\n"
      run-2:
        status: success
        exitCode: 0
        output: "interchange -> issuer:  0.20\nscheme fee -> network:  0.04\nacquirer margin:        0.10\nmerchant receives:      99.66\nauthorized -> settled: refused\nauthorized -> captured: ok\ncaptured -> settled: ok\n"
      run-3:
        status: success
        exitCode: 0
        output: "interchange -> issuer:  0.20\nscheme fee -> network:  0.04\nacquirer margin:        0.10\nmerchant receives:      99.66\nauthorized -> settled: refused\nauthorized -> captured: ok\ncaptured -> settled: ok\nsettled -> charged_back: ok\nmerchant balance: -100.00\n"

scenes:
  - id: hook
    chapter: Card payment တစ်ခုရဲ့ fee
    narration: >-
      user တစ်ယောက်က debit card နဲ့ ယူရို ၁၀၀ ပေးလိုက်ရင် merchant ဆီ ယူရို ၁၀၀ အပြည့် မရောက်ပါဘူး။
      [[mark:sel-amount]] ဒီ program မှာ အဲဒီ ယူရို ၁၀၀ ကို ဆင့်နဲ့ ထားပါတယ်။ [[mark:sel-fees]] fee သုံးခုကို အဲဒီ ပမာဏထဲကနေ တွက်ပြီး၊ ကျန်တာကို merchant ဆီ ပေးပါတယ်။ [[mark:run-1]] run လိုက်ရအောင်။
      [[mark:pt-ic]] fee တွေက party သုံးခုဆီ ခွဲသွားပါတယ်၊ issuer၊ card network နဲ့ acquirer ပါ။  [[mark:pt-merch]] merchant ဆီ
      ရောက်တာက ယူရို ၁၀၀ မဟုတ်ဘဲ ဆင့် ၃၄ လျော့နေပါတယ်။ [[mark:dock-1]] ဒီ party တွေ ဘယ်သူတွေလဲ၊ message
      နဲ့ ငွေက သူတို့ကြား ဘယ်လို သွားလဲ ဆိုတာ ကြည့်ရအောင်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Appendix A: Payments, rails & cards (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#payments-rails-cards",
        }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }
      - id: sel-amount
        type: editor.select
        at: { mark: sel-amount }
        target:
          {
            file: main.go,
            text: "amount := int64(10_000) // 100.00 EUR in cents, paid with a debit card",
            occurrence: 1,
          }
      - id: sel-fees
        type: editor.select
        at: { mark: sel-fees }
        target:
          {
            file: main.go,
            text: "ic, sf, am := fee(amount, interchangeBP), fee(amount, schemeFeeBP), fee(amount, acquirerBP)",
            occurrence: 1,
          }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "merchant receives:      99.66",
          timeoutMs: 8000,
        }
      - id: pt-ic
        type: console.point
        at: { mark: pt-ic }
        target: { text: "interchange -> issuer:  0.20", occurrence: 1 }
      - id: pt-merch
        type: console.point
        at: { mark: pt-merch }
        target: { text: "merchant receives:      99.66", occurrence: 1 }
      - { id: dock-1, type: runtime.collapseDock, at: { mark: dock-1 } }

  - id: parties
    chapter: Four-party model
    narration: >-
      [[mark:show-parties]] အစမှာ party နှစ်ခု ရှိပါတယ်၊ card ကိုင်ထားတဲ့ cardholder နဲ့ ရောင်းတဲ့
      merchant ပါ။ [[mark:parties-2]] cardholder ကို card ထုတ်ပေးထားတဲ့ ဘဏ်ကို issuer လို့ ခေါ်ပါတယ်။
      cardholder ရဲ့ account ဒါမှမဟုတ် credit limit က issuer မှာ ရှိလို့ payment ကို ခွင့်ပြုမလား ငြင်းမလား ဆုံးဖြတ်တာ issuer ပါ။
      [[mark:parties-3]] merchant ဘက်က ဘဏ်ကိုတော့ acquirer လို့ ခေါ်ပါတယ်။ merchant အတွက် card payment
      တွေကို လက်ခံပြီး ငွေ ထည့်ပေးတဲ့ ဘက်ပါ။ [[mark:parties-4]] issuer နဲ့ acquirer ကြားမှာ Visa၊
      Mastercard လို card network ရှိပြီး၊ message တွေကို မှန်တဲ့ issuer ဆီ လမ်းကြောင်းပေးပြီး card payment
      ရဲ့ စည်းမျဉ်းတွေကို သတ်မှတ်ပါတယ်။ [[mark:pt-four]] cardholder၊ merchant၊ issuer နဲ့ acquirer
      လေးခုကို four-party model လို့ ခေါ်ပါတယ်။ [[mark:parties-5]] လက်တွေ့မှာ merchant အများစုက acquirer
      နဲ့ PSP ကနေ ချိတ်ပါတယ်။ PSP ဆိုတာ payment service provider ပါ၊ merchant ကို card network လို payment
      rail တွေနဲ့ ချိတ်ပေးတဲ့ vendor ပါ။ fintech engineer အများစု တကယ် ချိတ်ရတာက ဒီ PSP ရဲ့ API ပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Appendix A: Payments, rails & cards (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#payments-rails-cards",
        }
    actions:
      - {
          id: show-parties,
          type: slide.show,
          at: { mark: show-parties, offsetMs: -700 },
          slideId: parties-1,
        }
      - {
          id: pt-holder,
          type: slide.point,
          at: { afterAction: show-parties },
          target: { x: 0.163, y: 0.442 },
        }
      - { id: parties-2, type: slide.show, at: { mark: parties-2 }, slideId: parties-2 }
      - {
          id: pt-issuer,
          type: slide.point,
          at: { afterAction: parties-2 },
          target: { x: 0.163, y: 0.831 },
        }
      - { id: parties-3, type: slide.show, at: { mark: parties-3 }, slideId: parties-3 }
      - {
          id: pt-acquirer,
          type: slide.point,
          at: { afterAction: parties-3 },
          target: { x: 0.838, y: 0.831 },
        }
      - { id: parties-4, type: slide.show, at: { mark: parties-4 }, slideId: parties-4 }
      - {
          id: pt-network,
          type: slide.point,
          at: { afterAction: parties-4 },
          target: { x: 0.5, y: 0.831 },
        }
      - { id: pt-four, type: slide.point, at: { mark: pt-four }, target: { x: 0.494, y: 0.953 } }
      - { id: parties-5, type: slide.show, at: { mark: parties-5 }, slideId: parties-5 }
      - {
          id: pt-psp,
          type: slide.point,
          at: { afterAction: parties-5 },
          target: { x: 0.838, y: 0.442 },
        }

  - id: two-flows
    chapter: Authorization နဲ့ settlement
    narration: >-
      [[mark:show-two]] ဒီ party တွေကြားမှာ flow နှစ်ခု သွားပြီး၊ နှစ်ခုရဲ့ အမြန်နှုန်းက လုံးဝ မတူပါဘူး။
      [[mark:pt-auth]] ပထမက authorization ပါ။ merchant က PSP၊ acquirer နဲ့ network ကို ဖြတ်ပြီး issuer
      ဆီအထိ ဒီ card နဲ့ ယူရို ၁၀၀ ပေးလို့ ရမလား လို့ မေးပါတယ်။ user က checkout မှာ စောင့်နေတုန်း ပြီးရမှာ
      ဖြစ်လို့ စက္ကန့်ပိုင်းပဲ ကြာရပါတယ်။ [[mark:two-2]] issuer က ခွင့်ပြုရင် ငွေကို ချက်ချင်း မယူသေးဘဲ
      hold ချထားပါတယ်၊ lesson ၁၈ က reservation ရဲ့ card version ပါ။ [[mark:pt-sca]] online payment
      မှာဆိုရင် issuer က card ကိုင်သူ ကိုယ်တိုင် ဟုတ်မဟုတ် ထပ်စစ်တတ်ပါတယ်။ EU မှာ strong customer authentication လို့ ခေါ်ပြီး၊ ကိုယ်သိတာ၊ ကိုယ့်မှာ ရှိတာ၊ ကိုယ်ကိုယ်တိုင် ဖြစ်တာ ဆိုတဲ့
      သုံးမျိုးထဲက အနည်းဆုံး နှစ်မျိုး လိုပါတယ်။ ပမာဏ နည်းတဲ့ payment လို ခြွင်းချက်တွေ ရှိပြီး၊ card မှာ
      များသောအားဖြင့် three D Secure နဲ့ စစ်ပါတယ်။ [[mark:pt-cvc]] CVC ကိုတော့
      PCI DSS အရ authorization ပြီးရင် encrypt လုပ်ထားရင်တောင် မသိမ်းရပါဘူး။ card data ကို ကိုယ့် server မထိဘဲ PSP ဆီ တိုက်ရိုက် ရောက်အောင် design လုပ်လေ့ရှိတာ ဒါကြောင့်ပါ။ [[mark:two-3]] ဒုတိယ flow က ငွေပါ။
      merchant က capture လုပ်လိုက်ရင်၊ ချက်ချင်းဖြစ်ဖြစ် ပစ္စည်း ပို့ပြီးမှဖြစ်ဖြစ်၊ capture က အရင်
      လမ်းအတိုင်း issuer ဘက်ကို ရောက်ပါတယ်။ [[mark:pt-clr]] ဒီအဆင့်ကို clearing လို့ ခေါ်ပါတယ်၊ ဘယ်သူ ဘယ်သူ့ကို ဘယ်လောက် ပေးရမလဲ
      သဘောတူတာပါ။ [[mark:two-4]] ငွေ တကယ် ရွှေ့တာကတော့ settlement ပါ၊ ရက်ပိုင်း ကြာတတ်ပြီး ငွေက
      ပြောင်းပြန်လမ်းအတိုင်း merchant ဆီ စီးပါတယ်။ [[mark:pt-fee-fig]] ကြားက party တိုင်းက ကိုယ့် fee ကို
      ယူပါတယ်၊ issuer က interchange၊ network က scheme fee၊ acquirer က margin ပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Appendix A: Transactions, timing & settlement (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#transactions-timing-settlement",
        }
      - {
          title: "Commission Delegated Regulation (EU) 2018/389 (strong customer authentication)",
          url: "https://www.legislation.gov.uk/eur/2018/389/contents",
        }
      - {
          title: "PCI SSC — PCI DSS v4.0.1, Requirements 3.3.1 and 3.3.1.2",
          url: "https://www.middlebury.edu/sites/default/files/2025-01/PCI-DSS-v4_0_1.pdf",
        }
    actions:
      - { id: show-two, type: slide.show, at: { mark: show-two, offsetMs: -700 }, slideId: two-1 }
      - { id: pt-auth, type: slide.point, at: { mark: pt-auth }, target: { x: 0.655, y: 0.341 } }
      - { id: two-2, type: slide.show, at: { mark: two-2 }, slideId: two-2 }
      - {
          id: pt-hold,
          type: slide.point,
          at: { afterAction: two-2 },
          target: { x: 0.12, y: 0.953 },
        }
      - { id: pt-sca, type: slide.point, at: { mark: pt-sca }, target: { x: 0.222, y: 0.58 } }
      - { id: pt-cvc, type: slide.point, at: { mark: pt-cvc }, target: { x: 0.767, y: 0.953 } }
      - { id: two-3, type: slide.show, at: { mark: two-3 }, slideId: two-3 }
      - {
          id: pt-capture,
          type: slide.point,
          at: { afterAction: two-3 },
          target: { x: 0.647, y: 0.356 },
        }
      - { id: pt-clr, type: slide.point, at: { mark: pt-clr }, target: { x: 0.494, y: 0.953 } }
      - { id: two-4, type: slide.show, at: { mark: two-4 }, slideId: two-4 }
      - {
