  - id: fees
    chapter: Interchange နဲ့ fee
    narration: >-
      [[mark:close-two]] code ထဲက fee တွေကို ကြည့်ရအောင်။ [[mark:sel-ic]] interchange က acquirer က issuer
      ကို payment တိုင်းမှာ ပေးတဲ့ fee ဖြစ်ပြီး၊ card processing cost ရဲ့ အဓိက အပိုင်းပါ။ EU မှာ consumer
      card အတွက် ၂၀၁၅ ခုနှစ်ကတည်းက ဥပဒေနဲ့ cap ထားပါတယ်၊ debit card မှာ သုည ဒသမ နှစ် ရာခိုင်နှုန်း၊ credit
      card မှာ သုည ဒသမ သုံး ရာခိုင်နှုန်းပါ။ basis point နဲ့ဆို debit card အတွက် နှစ်ဆယ်ပါ။
      [[mark:cap-note]] ဒါပေမဲ့ cap က card တိုင်းကို မဖုံးပါဘူး။ commercial card တွေနဲ့ American Express
      လို three-party scheme တွေက အများစု အပြင်မှာ ရှိပါတယ်။ ဒါကြောင့် rate ကို constant တစ်ခုတည်း အသေ
      မထားဘဲ card type နဲ့ region အလိုက် data အဖြစ် ထားရပါတယ်။ [[mark:sel-ex]] scheme fee နဲ့ acquirer
      margin ကတော့ ဥပမာ တန်ဖိုးတွေပါ၊ fee သုံးခု ပေါင်းလဒ်က merchant ရဲ့ cost ပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Appendix A: Payments, rails & cards (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#payments-rails-cards",
        }
      - {
          title: "Regulation (EU) 2015/751 on interchange fees, Chapter II (legislation.gov.uk)",
          url: "https://www.legislation.gov.uk/eur/2015/751/chapter/II/adopted",
        }
    actions:
      - { id: close-two, type: slide.close, at: { mark: close-two } }
      - id: sel-ic
        type: editor.select
        at: { mark: sel-ic }
        target:
          {
            file: main.go,
            text: "interchangeBP = 20 // EU cap: debit 0.2%, credit 0.3%",
            occurrence: 1,
          }
      - id: sel-ex
        type: editor.select
        at: { mark: sel-ex }
        target:
          {
            file: main.go,
            text: "schemeFeeBP   = 4  // example value\n\tacquirerBP    = 10 // example value",
            occurrence: 1,
          }

  - id: states
    chapter: Payment state machine
    narration: >-
      [[mark:type-table]] payment တစ်ခုရဲ့ ဘဝကို state machine နဲ့ ထားပါမယ်။ authorized ကနေ capture
      လုပ်ရင် captured ဖြစ်ပြီး၊ void လုပ်ရင် hold ကို release လုပ်ပါတယ်။ captured ကနေ settled ကို
      သွားပြီး၊ settled ကနေတောင် charged back ကို သွားနိုင်ပါတယ်။ [[mark:sel-move]] Move က ဒီ table မှာ
      ပါတဲ့ ရွှေ့မှုကိုပဲ လက်ခံပြီး၊ ကျန်တာကို refuse လုပ်ပါတယ်။ [[mark:type-moves]] payment ကို capture
      မလုပ်ဘဲ settled ကို တန်းရွှေ့ကြည့်ပါမယ်၊ ပြီးမှ မှန်တဲ့ အစဉ်အတိုင်း ရွှေ့ပါမယ်။ capture မလုပ်ရသေးတဲ့
      payment ကို settled လို့ မှတ်တာက မရှိသေးတဲ့ ငွေကို merchant ဆီ ပေးတာပါ။ [[mark:run-2]] run
      လိုက်ရအောင်။ [[mark:pt-refused]] တန်းရွှေ့တာကို refuse လုပ်လို့ state က authorized မှာပဲ ကျန်ပါတယ်။
      [[mark:pt-settled]] capture ပြီးမှ settle လုပ်တာကတော့ ok ပါ။ [[mark:dock-2]] လက်တွေ့မှာ settled ကို
      PSP ရဲ့ settlement report ရောက်မှ ရွှေ့ပြီး၊ အဲဒီ report ကို lesson ၂၆ ကလို ကိုယ့် capture တွေနဲ့
      reconcile လုပ်ရပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Appendix A: Payments, rails & cards (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#payments-rails-cards",
        }
    actions:
      - id: type-table
        type: editor.type
        at: { mark: type-table }
        target: { file: main.go, after: "\t// state: the states it may move to\n", occurrence: 1 }
        text: "\t\"authorized\": {\"captured\", \"voided\"},\n\t\"captured\":   {\"settled\"},\n\t\"settled\":    {\"charged_back\"},\n"
        cadence: line-by-line
      - id: sel-move
        type: editor.select
        at: { mark: sel-move }
        target: { file: main.go, text: "func (p *Payment) Move(to string) {", occurrence: 1 }
      - id: type-moves
        type: editor.type
        at: { mark: type-moves }
        target:
          {
            file: main.go,
            after: "\tfmt.Println(\"merchant receives:     \", cents(amount-ic-sf-am))\n",
            occurrence: 1,
          }
        text: "\n\tp := &Payment{ID: \"pay_1\", Amount: amount, State: \"authorized\"}\n\tp.Move(\"settled\")\n\tp.Move(\"captured\")\n\tp.Move(\"settled\")\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "authorized -> settled: refused",
          timeoutMs: 8000,
        }
      - id: pt-refused
        type: console.point
        at: { mark: pt-refused }
        target: { text: "authorized -> settled: refused", occurrence: 1 }
      - id: pt-settled
        type: console.point
        at: { mark: pt-settled }
        target: { text: "captured -> settled: ok", occurrence: 1 }
      - { id: dock-2, type: runtime.collapseDock, at: { mark: dock-2 } }
      - {
          id: expect-file-table,
          type: expect.file,
          at: { afterAction: run-2 },
          path: main.go,
          contains: '"settled":    {"charged_back"},',
        }

  - id: chargeback
    chapter: Chargeback
    narration: >-
      [[mark:show-after]] settled ဖြစ်ပြီဆိုရင် payment ပြီးပြီလို့ ထင်စရာ ရှိပါတယ်။ [[mark:pt-set]]
      merchant ကလည်း ငွေ ရပြီး၊ ledger မှာလည်း post လုပ်ပြီးပါပြီ။ [[mark:after-2]] ဒါပေမဲ့ lesson ၁၅ မှာ တွေ့ခဲ့တဲ့ chargeback ရှိပါသေးတယ်၊ အခု party နာမည်တွေနဲ့ ပြောရင် issuer က စတဲ့
      အတင်း reversal ပါ။  [[mark:pt-win]] card network တွေက ပုံမှန်အားဖြင့် မူလ payment ကနေ ရက် ၁၂၀ အတွင်း
      dispute စခွင့် ပေးပြီး၊ case တချို့မှာ ပိုကြာခွင့် ရှိပါတယ်။  [[mark:pt-fin]] state machine မှာ settled ကနေ charged back ကို ရွှေ့ခွင့်
      ထားခဲ့တာ ဒါကြောင့်ပါ။ [[mark:close-after]] ဒီ code ကို merchant တွေရဲ့ ငွေကို ကိုင်ထားတဲ့ PSP ဘက်ကနေ
      ကြည့်ပါမယ်။ [[mark:type-cb]] merchant ရဲ့ ငွေကို ရက်အနည်းငယ် အရင်က payout လုပ်ပြီးပြီ ဆိုတော့
      merchant ကို ပေးစရာ ကျန်တာ သုည ပါ။ အခု chargeback ရောက်လာလို့ payment ကို charged back ကို
      ရွှေ့ပြီး၊ cardholder ကို ပြန်ပေးရမယ့် ပမာဏ အပြည့်ကို merchant ရဲ့ balance ကနေ နုတ်ပါတယ်။ merchant
      balance ဘယ်လောက် ဖြစ်မလဲ၊ run မလုပ်ခင် ခန့်မှန်းကြည့်ပါ။ [[mark:run-3]] run လိုက်ရအောင်။
      [[mark:pt-cb]] settled ကနေ charged back ကို ရွှေ့တာ ok ပါ။ [[mark:pt-bal]] merchant balance က ယူရို
      ၁၀၀ အနုတ် ဖြစ်သွားပါတယ်။ [[mark:dock-3]] ငွေ ပေးပြီးသား merchant ဆီကနေ ပြန်ယူရမှာ ဖြစ်ပြီး၊
      ပြန်မရရင် ကိုယ့် loss ပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Appendix A: Payments, rails & cards (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#payments-rails-cards",
        }
      - {
          title: "Stripe Docs — How disputes work",
          url: "https://docs.stripe.com/disputes/how-disputes-work",
        }
    actions:
      - {
          id: show-after,
          type: slide.show,
          at: { mark: show-after, offsetMs: -700 },
          slideId: after-1,
        }
      - { id: pt-set, type: slide.point, at: { mark: pt-set }, target: { x: 0.176, y: 0.584 } }
      - { id: after-2, type: slide.show, at: { mark: after-2 }, slideId: after-2 }
      - {
          id: pt-cb-tick,
          type: slide.point,
          at: { afterAction: after-2 },
          target: { x: 0.679, y: 0.591 },
        }
      - { id: pt-win, type: slide.point, at: { mark: pt-win }, target: { x: 0.467, y: 0.44 } }
      - { id: pt-fin, type: slide.point, at: { mark: pt-fin }, target: { x: 0.783, y: 0.676 } }
      - { id: close-after, type: slide.close, at: { mark: close-after } }
      - id: type-cb
        type: editor.type
        at: { mark: type-cb }
        target:
          { file: main.go, after: "\tp.Move(\"captured\")\n\tp.Move(\"settled\")\n", occurrence: 1 }
        text: "\n\tmerchant := int64(0) // what we owe the merchant; its 99.66 was paid out days ago\n\tp.Move(\"charged_back\")\n\tmerchant -= p.Amount\n\tfmt.Println(\"merchant balance:\", cents(merchant))\n"
        cadence: line-by-line
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "merchant balance: -100.00",
          timeoutMs: 8000,
        }
      - id: pt-cb
        type: console.point
        at: { mark: pt-cb }
        target: { text: "settled -> charged_back: ok", occurrence: 1 }
      - id: pt-bal
        type: console.point
        at: { mark: pt-bal }
        target: { text: "merchant balance: -100.00", occurrence: 1 }
      - { id: dock-3, type: runtime.collapseDock, at: { mark: dock-3 } }

  - id: senior
    chapter: ခက်တဲ့ အပိုင်း
    narration: >-
      [[mark:show-after3]] ဒီနေရာမှာ engineer အတွက် ခက်တဲ့ အချက် သုံးချက် ရှိပါတယ်။ [[mark:pt-cb-again]]
      ပထမ၊ chargeback က ခွင့်တောင်းတဲ့ request မဟုတ်ပါဘူး၊ ဖြစ်ပြီးသား အချက်ပါ။ ငွေကို network ဘက်က
      နုတ်ပြီးသား ဖြစ်လို့ state machine က refuse လုပ်ရင် ငွေက ပြန်မလာဘဲ ledger ကပဲ အမှန်နဲ့ ကွာသွားပါတယ်။
      merchant balance အနုတ်ကိုလည်း lesson ၁၉ က overdraft လို handle လုပ်ရပြီး၊ payout ကို နောက်ကျ ပေးတာ၊
      ငွေ တစ်စိတ်တစ်ပိုင်း ထိန်းထားတာလို design တွေက ဒီ risk ကြောင့်ပါ။ [[mark:pt-dunning]] ဒုတိယ၊ dunning
      ဆိုတာ subscription လို recurring charge တစ်ခု fail ရင် retry လုပ်ပြီး user ကို အကြောင်းကြားတဲ့
      process ပါ။ retry တစ်ခါချင်းက authorization အသစ် ဖြစ်လို့၊ timeout ပြီး ထပ် retry လုပ်ရင် နှစ်ခါ
      charge မဖြစ်အောင် lesson ၂၀ က idempotency key လိုပါတယ်။ [[mark:senior-3]] တတိယ၊ settlement မှာ ရောက်လာတာက များသောအားဖြင့် fee နုတ်ပြီးသား net ပမာဏပါ။ fee ကို expense အဖြစ်
      post မလုပ်ရင် reconciliation မှာ ဒီ ဥပမာအတိုင်း payment တိုင်း ဆင့် ၃၄ စီ ကွာနေပါလိမ့်မယ်။ [[mark:trust]] ဒါက No trust ပါ၊ ဘယ်သူ့ကိုမှ၊ ကိုယ့်
      component ကိုတောင် အလိုလို မယုံရဘူး ဆိုတဲ့ မူပါ၊ settled ဆိုတဲ့ status ကိုရော provider ပို့တဲ့
      ပမာဏကိုရော တိုက်စစ်ရပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Appendix A: Payments, rails & cards (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#payments-rails-cards",
        }
      - {
