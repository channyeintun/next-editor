  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] Fintech interview တွေမှာ card ကို tap လိုက်တာကနေ merchant ရဲ့ bank account ထဲ ငွေ
      ရောက်တဲ့အထိ ရှင်းပြပါ လို့ မေးတတ်ပါတယ်။ flow နှစ်ခုနဲ့ ဖြေပါ။ [[mark:iv-a]] ပထမ၊ authorization က
      PSP၊ acquirer၊ network ကို ဖြတ်ပြီး issuer အထိ သွားပါတယ်။ issuer က hold ချပြီး စက္ကန့်ပိုင်းအတွင်း အဖြေ
      ပြန်ပေးပါတယ်။ [[mark:iv-b]] ဒုတိယ၊ capture ပြီးမှ clearing နဲ့ settlement က ရက်ပိုင်း ကြာပြီး၊ fee
      တွေ နုတ်ပြီးသား net ပမာဏ merchant ဆီ ရောက်ပါတယ်။ [[mark:iv-c]] တတိယ၊ settled က အဆုံး မဟုတ်ပါဘူး၊
      chargeback က ပုံမှန် ရက် ၁၂၀ အတွင်း လာနိုင်ပြီး recurring payment မှာ dunning ရှိပါတယ်။
      [[mark:iv-d]] ပြီးရင် ကိုယ် ဘယ်လို တည်ဆောက်မလဲ ပြောပါ။ settled ကနေ charged back ကို ရွှေ့ခွင့်ရှိတဲ့
      state machine၊ fee ကို expense အဖြစ် post လုပ်တဲ့ ledger နဲ့ settlement report ကို capture တွေနဲ့
      နေ့တိုင်း reconcile လုပ်တာပါ။
