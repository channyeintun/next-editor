# React crash course (Burmese), lesson 1 of 12: Components and JSX.
#
# Narration is the edited BURMESE voice script (voice-script.md next to this
# file is the same text; DESIGN.md is the span-by-span brief): every
# [[mark:…]] sits where its action begins, at a sentence end or a ၊ pause, and
# each span carries one piece of meaning. Everything the learner sees (title,
# chapters, whiteboard labels, UI strings) is Burmese.
#
# Shape: two whiteboards (what React is: data -> function -> screen; the shop
# page cut into components and drawn as a tree), a code tour (index.html,
# main.jsx, vite.config.js, App.jsx), the shop header written as JSX in App
# with the three JSX rules and curly braces pointed at in the code, a third
# whiteboard (JSX -> jsx() call -> element object -> DOM), then DishCard and
# Menu typed keystroke by keystroke into empty, unimported files and wired
# into App with two block inserts. The lesson ends on the three identical
# DishCard lines, which hands over to props in lesson 2.
#
# Live-preview safety (no @vitejs/plugin-react, so every .jsx save reloads):
# - App.jsx is imported by main.jsx, so every App edit is a `block` insert of
#   complete lines; the constants land before the JSX that reads them, and
#   the Menu import before the <Menu /> tag.
# - DishCard.jsx and Menu.jsx are pinned empty and typed while nothing
#   imports them, so no half-written JSX ever reaches Vite.
# - runtime.start blocks the Performer until pnpm install has finished and the
#   dev server has spawned, so the first span after it carries no action for
#   ~40 s of narration; waitForReady sits on the preview mark, not right after
#   the start.
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
schemaVersion: 1

lesson:
  slug: react-crash-course-01-components-jsx
  title: "React crash course 1: Component နဲ့ JSX"
  locale: my-MM
  workspace:
    lessonType: javascript
    name: React Crash Course 1
    entryFilePath: src/App.jsx
    files:
      package.json: |
        {
          "name": "react-course-mm",
          "private": true,
          "version": "1.0.0",
          "type": "module",
          "scripts": {
            "dev": "vite --host 0.0.0.0 --port 5173 --strictPort"
          },
          "dependencies": {
            "react": "19.3.1",
            "react-dom": "19.3.1"
          },
          "devDependencies": {
            "vite": "5.4.21"
          }
        }
      vite.config.js: |
        import { defineConfig } from "vite";

        export default defineConfig({
          // JSX through esbuild's automatic runtime: components never import React.
          esbuild: { jsx: "automatic" },
          // Pre-bundle every React entry up front so Vite never discovers a new
          // dependency mid-lesson and force-reloads the preview.
          optimizeDeps: {
            include: [
              "react",
              "react/jsx-dev-runtime",
              "react/jsx-runtime",
              "react-dom",
              "react-dom/client",
            ],
          },
        });
      index.html: |
        <!doctype html>
        <html lang="my">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>React သင်ခန်းစာ</title>
          </head>
          <body>
            <div id="root"></div>
            <script type="module" src="/src/main.jsx"></script>
          </body>
        </html>
      public/logo.svg: |
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
          <circle cx="48" cy="48" r="45" fill="#fff4e6" stroke="#c2410c" stroke-width="4" />
          <path d="M36 38c-4-5 4-9 0-14M48 38c-4-5 4-9 0-14M60 38c-4-5 4-9 0-14" fill="none" stroke="#e67700" stroke-width="3" stroke-linecap="round" />
          <path d="M20 46h56a28 28 0 0 1-56 0z" fill="#c2410c" />
          <rect x="34" y="74" width="28" height="5" rx="2.5" fill="#c2410c" />
        </svg>
      src/main.jsx: |
        import { StrictMode } from "react";
        import { createRoot } from "react-dom/client";
        import App from "./App.jsx";
        import "./styles.css";

        createRoot(document.getElementById("root")).render(
          <StrictMode>
            <App />
          </StrictMode>,
        );
      src/App.jsx: |
        export default function App() {
          return (
            <main className="page" data-testid="page">
            </main>
          );
        }
      src/DishCard.jsx: ""
      src/Menu.jsx: ""
      src/styles.css: |
        :root {
          --bg: #f1f3f5;
          --surface: #ffffff;
          --text: #1e1e1e;
          --muted: #5c636a;
          --line: #dee2e6;
          --accent: #1971c2;
          --accent-soft: #e7f1fb;
          --ok: #2f9e44;
          --warn: #e67700;
          --radius: 12px;
          font-family: "Noto Sans Myanmar", "Myanmar Sangam MN", "Myanmar MN", "Padauk",
            system-ui, -apple-system, "Segoe UI", sans-serif;
          font-size: 17px;
          line-height: 1.8;
          color: var(--text);
          background: var(--bg);
        }

        * {
          box-sizing: border-box;
        }

        body {
          margin: 0;
          min-height: 100vh;
        }

        .page {
          max-width: 560px;
          margin: 0 auto;
          padding: 20px 16px 40px;
          display: grid;
          gap: 14px;
        }

        .header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 12px;
          padding-bottom: 10px;
          border-bottom: 2px solid var(--line);
        }

        h1,
        h2,
        h3 {
          margin: 0;
          line-height: 1.6;
        }

        h1 {
          font-size: 1.45rem;
        }

        h2 {
          font-size: 1.15rem;
        }

        p {
          margin: 0;
        }

        .muted {
          color: var(--muted);
        }

        .card {
          display: grid;
          gap: 8px;
          padding: 14px 16px;
          border: 1px solid var(--line);
          border-radius: var(--radius);
          background: var(--surface);
          box-shadow: 0 4px 14px rgb(0 0 0 / 0.05);
        }

        .row {
          display: flex;
          align-items: center;
          gap: 10px;
          flex-wrap: wrap;
        }

        .list {
          display: grid;
          gap: 8px;
          margin: 0;
          padding: 0;
          list-style: none;
        }

        .list > li {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 10px;
          padding: 8px 12px;
          border: 1px solid var(--line);
          border-radius: 10px;
          background: var(--surface);
        }

        button {
          font: inherit;
          padding: 6px 16px;
          border: 0;
          border-radius: 999px;
          background: var(--accent);
          color: white;
          cursor: pointer;
        }

        button.secondary {
          background: var(--accent-soft);
          color: var(--accent);
        }

        button:disabled {
          background: var(--line);
          color: var(--muted);
          cursor: not-allowed;
        }

        input,
        select,
        textarea {
          font: inherit;
          width: 100%;
          padding: 6px 12px;
          border: 1px solid var(--line);
          border-radius: 10px;
          background: var(--surface);
          color: var(--text);
        }

        input:focus,
        select:focus,
        textarea:focus,
        button:focus-visible {
          outline: 2px solid var(--accent);
          outline-offset: 2px;
        }

        .badge {
          display: inline-block;
          padding: 0 10px;
          border-radius: 999px;
          background: var(--accent-soft);
          color: var(--accent);
          font-size: 0.85rem;
        }

        .badge.ok {
          background: #ebfbee;
          color: var(--ok);
        }

        .badge.warn {
          background: #fff4e6;
          color: var(--warn);
        }

        /* Lesson 1: the shop header */
        .logo {
          width: 72px;
          height: 72px;
          justify-self: center;
        }

        .hours {
          text-align: center;
          color: var(--muted);
        }
