# Fintech Engineering, lesson 13: event sourcing (Burmese).
#
# Source: Fintech Engineering Handbook, "Event sourcing" (CC BY 4.0, Voytek Pitula).
# Start state: main.go holds one account's event stream and folds it into a balance; events.go
# holds Event, State, apply (the only place state changes), fold, decode and show.
# Edits, all insert-only:
#   1. a stored snapshot after event 3, folded with the events after it -> run-2: same balance
#   2. an old v1 event (no currency) decoded from JSON and folded       -> run-3: error, no currency
#   3. upcast (v1 → v2, end of main.go) and the same fold through it     -> run-4: 10.00 EUR
# Figures: drift (state + log drifting vs events only; the ledger is this pattern), project (one
# log, many projections; the price), evolve (v1 → upcaster → v2), when (where to use it; the
# traps for money), iv.
# Built by ~/Documents/fintech-course-work/tools/build-lesson.ts; fixtures by sim-go.ts --write.
