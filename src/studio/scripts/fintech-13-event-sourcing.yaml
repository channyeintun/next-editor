build:
  voiceProfile:
    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 9513

runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "all events:         82.10 EUR after event 4\n"
      run-2:
        status: success
        exitCode: 0
        output: "all events:         82.10 EUR after event 4\nsnapshot + events:  82.10 EUR after event 4\n"
      run-3:
        status: success
        exitCode: 0
        output: "all events:         82.10 EUR after event 4\nsnapshot + events:  82.10 EUR after event 4\nv1 as stored:       error: event 1 has no currency\n"
      run-4:
        status: success
        exitCode: 0
        output: "all events:         82.10 EUR after event 4\nsnapshot + events:  82.10 EUR after event 4\nv1 as stored:       error: event 1 has no currency\nv1 upcast:          10.00 EUR after event 1\n"

scenes:
  - id: hook
    chapter: State ဘေးက log
    narration: >-
      ငွေ system မှာ audit trail လိုတဲ့အခါ ပုံမှန် လုပ်ကြတာက balance column ကို update လုပ်ပြီး ဘေးက
      log table ထဲမှာ row တစ်ကြောင်း ထည့်တာပါ။ [[mark:show-drift]] ဒီ design မှာ write နှစ်ခု
      ရှိပါတယ်။ [[mark:pt-st]] state တစ်ခုရယ်၊ အဲဒီ state ဘယ်လို ဖြစ်လာလဲ ဆိုတဲ့ မှတ်တမ်း တစ်ခုရယ်ပါ။
      [[mark:drift-2]] နှစ်ခုကြားမှာ crash ဖြစ်တာ၊ log ရေးဖို့ မေ့သွားတဲ့ code လမ်းကြောင်း တစ်ခု
      ရှိတာနဲ့ balance က ပြောင်းသွားပြီး log ထဲမှာ မပါတော့ပါဘူး။ [[mark:pt-which]] အဲဒီအခါ နှစ်ခု
      မကိုက်တော့ဘဲ ဘယ်ဟာ မှန်လဲ ဆိုတာ ဘယ်သူမှ မပြောနိုင်တော့ပါဘူး။ [[mark:drift-3]] event sourcing
      က ဒီ ပြဿနာကို အခြေကနေ ဖြေရှင်းပါတယ်။ state ကို မသိမ်းဘဲ ဖြစ်ခဲ့တဲ့ event တွေကိုပဲ သိမ်းပြီး၊
      state ကို အဲဒီ event တွေကနေ တွက်ယူပါတယ်။ [[mark:pt-der]] trail ကိုယ်တိုင်က source of truth
      ဖြစ်သွားလို့ state နဲ့ ကွဲစရာ မရှိတော့ပါဘူး။ [[mark:drift-4]] ဒါ အသစ်အဆန်း မဟုတ်ပါဘူး။ double-entry
      ledger က ငွေအတွက် ဒီ pattern ပဲ ဖြစ်ပါတယ်၊ balance ကို မသိမ်းဘဲ entry တွေကနေ တွက်ယူတာပါ။
      [[mark:pt-lost]] No lost data ဆိုတဲ့ မူ၊ ဆိုလိုတာက ငွေနဲ့ ပတ်သက်ပြီး ဖြစ်ခဲ့သမျှ မပျောက်ရဘူး
      ဆိုတာကို system တစ်ခုလုံးရဲ့ အဆင့်မှာ ထိန်းပေးတဲ့ နည်းပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Event sourcing (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#event-sourcing",
        }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }
      - {
          id: show-drift,
          type: slide.show,
          at: { mark: show-drift, offsetMs: -700 },
          slideId: drift-1,
        }
      - { id: pt-st, type: slide.point, at: { mark: pt-st }, target: { x: 0.275, y: 0.437 } }
      - { id: drift-2, type: slide.show, at: { mark: drift-2 }, slideId: drift-2 }
      - {
          id: pt-lg2,
          type: slide.point,
          at: { afterAction: drift-2 },
          target: { x: 0.275, y: 0.609 },
        }
      - { id: pt-which, type: slide.point, at: { mark: pt-which }, target: { x: 0.229, y: 0.731 } }
      - { id: drift-3, type: slide.show, at: { mark: drift-3 }, slideId: drift-3 }
      - {
          id: pt-ev,
          type: slide.point,
          at: { afterAction: drift-3 },
          target: { x: 0.725, y: 0.581 },
        }
      - { id: pt-der, type: slide.point, at: { mark: pt-der }, target: { x: 0.725, y: 0.793 } }
      - { id: drift-4, type: slide.show, at: { mark: drift-4 }, slideId: drift-4 }
      - {
          id: pt-esledger,
          type: slide.point,
          at: { afterAction: drift-4 },
          target: { x: 0.411, y: 0.926 },
        }
      - { id: pt-lost, type: slide.point, at: { mark: pt-lost }, target: { x: 0.885, y: 0.12 } }

  - id: fold
    chapter: Event ကနေ state ကို တွက်
    narration: >-
      [[mark:close-drift]] code နဲ့ ကြည့်ရအောင်။ [[mark:sel-stream]] ဒီမှာ account တစ်ခုရဲ့ event stream
      ရှိပါတယ်။ deposit တစ်ခု၊ fee တစ်ခု၊ withdrawal တစ်ခုနဲ့ နောက်ထပ် deposit တစ်ခုပါ၊ balance ကိုတော့
      ဘယ်နေရာမှာမှ သိမ်းမထားပါဘူး။ [[mark:open-ev]] state ပြောင်းတဲ့ နေရာက တစ်ခုတည်း ရှိပါတယ်။
      [[mark:sel-apply]] apply က event တစ်ခုကို ယူပြီး state အသစ် ပြန်ပေးပါတယ်။ currency မပါတဲ့ event၊
      account နဲ့ currency မကိုက်တဲ့ event ကိုတော့ လက်မခံပါဘူး။ [[mark:sel-fold]] fold က event တွေကို
      အစဉ်လိုက် apply လုပ်ပေးတာပါ။ [[mark:run-1]] run လိုက်ရအောင်။ [[mark:pt-all]] event လေးခုကနေ
      ယူရို ၈၂ နဲ့ ဆင့် ၁၀ ရပါတယ်။ ဒီ balance ကို ဘယ်မှာမှ ရေးမထားပါဘူး၊ event တွေကနေ အခု
      တွက်ထုတ်လိုက်တာပါ။ [[mark:dock-1]] ဒါကြောင့် event တွေ ရှိနေသမျှ balance ကို ဘယ်အချိန်မဆို
      ပြန်တွက်နိုင်ပြီး၊ ဘယ် event အထိဆိုရင် ဘယ်လောက် ရှိခဲ့လဲ ဆိုတာလည်း မေးလို့ ရပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Event sourcing (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#event-sourcing",
        }
    actions:
      - { id: close-drift, type: slide.close, at: { mark: close-drift } }
      - id: sel-stream
        type: editor.select
        at: { mark: sel-stream }
        target:
          {
            file: main.go,
            text: "\t{Version: 2, Seq: 1, Type: \"deposited\", Amount: 10000, Currency: \"EUR\"},\n\t{Version: 2, Seq: 2, Type: \"fee-charged\", Amount: 290, Currency: \"EUR\"},\n\t{Version: 2, Seq: 3, Type: \"withdrawn\", Amount: 4000, Currency: \"EUR\"},\n\t{Version: 2, Seq: 4, Type: \"deposited\", Amount: 2500, Currency: \"EUR\"},",
            occurrence: 1,
          }
      - { id: open-ev, type: workspace.openFile, at: { mark: open-ev }, path: events.go }
      - id: sel-apply
        type: editor.select
        at: { mark: sel-apply }
        target:
          { file: events.go, text: "func apply(s State, e Event) (State, error) {", occurrence: 1 }
      - id: sel-fold
        type: editor.select
        at: { mark: sel-fold }
        target:
          {
            file: events.go,
            text: "func fold(s State, events []Event) (State, error) {",
            occurrence: 1,
          }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "82.10 EUR after event 4",
          timeoutMs: 8000,
        }
      - id: pt-all
        type: console.point
        at: { mark: pt-all }
        target: { text: "all events", occurrence: 1 }
      - { id: dock-1, type: runtime.collapseDock, at: { mark: dock-1 } }

  - id: snapshot
    chapter: Snapshot
    narration: >-
      [[mark:back-main]] event လေးခုဆိုရင် ပြဿနာ မရှိပေမဲ့၊ account တစ်ခုမှာ event သိန်းချီ ရှိလာရင်
      balance မေးတိုင်း အစကနေ fold လုပ်ရတာ နှေးပါတယ်။ [[mark:type-snap]] ledger မှာ balance ကို cache လုပ်ခဲ့သလိုပဲ derived state ကိုလည်း
      သိမ်းထားလို့ ရပါတယ်။ snapshot ဆိုတာ event တစ်ခုခု အထိ fold လုပ်ထားတဲ့ state ကို သိမ်းထားတာပါ။ ဒီမှာ တတိယ
      event အထိ ရောက်ခဲ့တဲ့ state ကို သိမ်းထားပြီး၊ အဲဒီ နောက်က event တွေကိုပဲ fold လုပ်ပါတယ်။ snapshot
      ထဲမှာ ဘယ် event အထိလဲ ဆိုတဲ့ sequence number ပါတာက အဓိကပါ။ [[mark:run-2]] run လိုက်ရအောင်။
      [[mark:pt-snap]] event အားလုံးကနေ တွက်တာနဲ့ အတူတူပဲ ရပါတယ်။ snapshot က အမြန်နှုန်းအတွက်ပဲ ဖြစ်ပြီး
      source of truth က event တွေ ဖြစ်နေဆဲပါ။ [[mark:dock-2]] snapshot ပျောက်သွားရင်၊ မှားနေရင် ဖျက်ပစ်ပြီး
      event တွေကနေ ပြန်ဆောက်လို့ ရပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Event sourcing (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#event-sourcing",
        }
    actions:
      - { id: back-main, type: workspace.openFile, at: { mark: back-main }, path: main.go }
      - id: type-snap
        type: editor.type
        at: { mark: type-snap }
        target:
          {
            file: main.go,
            after: "\tfmt.Println(\"all events:        \", show(fold(State{}, stream)))\n",
            occurrence: 1,
          }
        text: "\n\tsnap := State{Seq: 3, Balance: 5710, Currency: \"EUR\"} // stored after event 3\n\tfmt.Println(\"snapshot + events: \", show(fold(snap, stream[snap.Seq:])))\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "snapshot + events:  82.10 EUR after event 4",
          timeoutMs: 8000,
        }
      - id: pt-snap
        type: console.point
        at: { mark: pt-snap }
        target: { text: "snapshot + events", occurrence: 1 }
      - { id: dock-2, type: runtime.collapseDock, at: { mark: dock-2 } }

  - id: project
    chapter: Projection
    narration: >-
      [[mark:show-project]] event sourcing ရဲ့ ဈေးကြီးတဲ့ အပိုင်းက ဒီမှာပါ။ event log ကို မေးခွန်း တစ်ခုချင်းအတွက်
      တိုက်ရိုက် query လုပ်ပြီး ထိထိရောက်ရောက် ဖြေလို့ မရပါဘူး။ [[mark:pt-p1]] app မှာ user ကို balance ပြဖို့ဆိုရင် balance projection ကို ဆောက်ရပါတယ်။
      projection ဆိုတာ event တွေကို query လုပ်လို့ရတဲ့ ပုံစံ တစ်ခုအဖြစ် ပြောင်းထားတဲ့ derived view ပါ။
      [[mark:project-2]] user ကို ပို့မယ့် လစဉ် statement၊ finance အတွက် လစဉ် fee revenue၊ risk rule
      အတွက် တစ်ရက်ချင်း withdrawal အရေအတွက် စတဲ့ မေးခွန်း တစ်ခုစီအတွက် projection တစ်ခုစီ လိုပါတယ်။
      [[mark:project-3]] projection တစ်ခုစီက code၊ storage နဲ့ event အားလုံးကနေ ပြန်ဆောက်ရတဲ့ အချိန်
      ကုန်ပါတယ်၊ apply logic ပြောင်းတိုင်းလည်း ပြန်ဆောက်ရပါတယ်။ ဒါကြောင့် event sourcing က audit trail
      အတွက် အရမ်းကောင်းတဲ့ ဖြေရှင်းချက် ဖြစ်ပေမဲ့ system ရှုပ်ထွေးမှုမှာ ဈေး အရမ်းကြီးပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Event sourcing (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#event-sourcing",
        }
    actions:
      - {
          id: show-project,
          type: slide.show,
          at: { mark: show-project, offsetMs: -700 },
          slideId: project-1,
        }
      - { id: pt-p1, type: slide.point, at: { mark: pt-p1 }, target: { x: 0.75, y: 0.37 } }
      - { id: project-2, type: slide.show, at: { mark: project-2 }, slideId: project-2 }
      - {
