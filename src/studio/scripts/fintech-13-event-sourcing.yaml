      events.go: |
        package main

        import (
        	"encoding/json"
        	"fmt"
        )

        // Event is one fact that happened to an account. Stored events are never changed.
        type Event struct {
        	Version  int    `json:"v"`
        	Seq      int    `json:"seq"`
        	Type     string `json:"type"`
        	Amount   int64  `json:"amount"`   // cents
        	Currency string `json:"currency"` // added in schema v2
        }

        // State is derived from events. It can be cached or snapshotted, never edited by hand.
        type State struct {
        	Seq      int
        	Balance  int64
        	Currency string
        }

        // apply is the only place where state changes.
        func apply(s State, e Event) (State, error) {
        	if e.Currency == "" {
        		return s, fmt.Errorf("event %d has no currency", e.Seq)
        	}
        	if s.Currency == "" {
        		s.Currency = e.Currency
        	}
        	if e.Currency != s.Currency {
        		return s, fmt.Errorf("event %d has currency %q, account is %s", e.Seq, e.Currency, s.Currency)
        	}
        	switch e.Type {
        	case "deposited":
        		s.Balance += e.Amount
        	case "withdrawn", "fee-charged":
        		s.Balance -= e.Amount
        	}
        	s.Seq = e.Seq
        	return s, nil
        }

        // fold applies events in order, starting from s.
        func fold(s State, events []Event) (State, error) {
        	for _, e := range events {
        		var err error
        		if s, err = apply(s, e); err != nil {
        			return s, err
        		}
        	}
        	return s, nil
        }

        // decode reads one stored event.
        func decode(raw string) Event {
        	var e Event
        	if err := json.Unmarshal([]byte(raw), &e); err != nil {
        		panic(err)
        	}
        	return e
        }

        // show prints a folded state, or the error that stopped the fold.
        func show(s State, err error) string {
        	if err != nil {
        		return "error: " + err.Error()
        	}
        	return fmt.Sprintf("%d.%02d %s after event %d", s.Balance/100, s.Balance%100, s.Currency, s.Seq)
        }
      main.go: |
        package main

        import "fmt"

        // The event stream of one account, oldest first.
        var stream = []Event{
        	{Version: 2, Seq: 1, Type: "deposited", Amount: 10000, Currency: "EUR"},
        	{Version: 2, Seq: 2, Type: "fee-charged", Amount: 290, Currency: "EUR"},
        	{Version: 2, Seq: 3, Type: "withdrawn", Amount: 4000, Currency: "EUR"},
        	{Version: 2, Seq: 4, Type: "deposited", Amount: 2500, Currency: "EUR"},
        }

        func main() {
        	fmt.Println("all events:        ", show(fold(State{}, stream)))
        }
