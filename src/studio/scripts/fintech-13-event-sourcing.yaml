          target: { x: 0.75, y: 0.67 },
        }
      - { id: project-3, type: slide.show, at: { mark: project-3 }, slideId: project-3 }
      - {
          id: pt-price,
          type: slide.point,
          at: { afterAction: project-3 },
          target: { x: 0.392, y: 0.931 },
        }

  - id: old-event
    chapter: နှစ်တွေ အကြာက event
    narration: >-
      [[mark:close-project]] နောက်ထပ် ဈေး တစ်ခုက အချိန်ပါ။ [[mark:type-v1]] ငွေ system က event တွေကို
      နှစ်ပေါင်းများစွာ သိမ်းထားရပါတယ်။ ဒီ JSON က multi-currency မထည့်ခင် ရေးခဲ့တဲ့ version တစ် event
      ပါ၊ currency field မပါပါဘူး။ ဒီနေ့ code က အဲဒီ event ကို fold လုပ်ရင် ဘာဖြစ်မလဲ ခန့်မှန်းကြည့်ပါ။
      [[mark:run-3]] run လိုက်ရအောင်။ [[mark:pt-v1]] error နဲ့ ရပ်သွားပါတယ်။ ဒီနေ့ apply က currency ကို
      မဖြစ်မနေ လိုအပ်ပေမဲ့ နှစ်တွေ အကြာက event မှာ အဲဒီ field မရှိခဲ့ပါဘူး။ [[mark:dock-3]] ဆိုလိုတာက ဒီ
      account ရဲ့ balance ကို ဒီနေ့ code နဲ့ ပြန်တွက်လို့ မရတော့တာပါ၊ event sourcing မှာ ဒါက history
      တစ်ခုလုံး ပျောက်တာနဲ့ အတူတူပါပဲ။
    sources:
