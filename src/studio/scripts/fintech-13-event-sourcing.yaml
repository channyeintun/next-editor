  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] Fintech interview တွေမှာ event sourcing ကို ဘယ်အချိန် သုံးသင့်ပြီး ဘယ်အချိန်
      မသုံးသင့်လဲ ဆိုတာ မေးတတ်ပါတယ်။ audit trail ရလို့ပါ လို့ပဲ ဖြေရင် ပေးရတဲ့ ဈေးကို မေ့ထားသလို
      ဖြစ်ပါတယ်၊ အချက် သုံးချက်နဲ့ ဖြေပါ။ [[mark:iv-a]] ပထမ၊ event တွေကပဲ source of truth ဖြစ်ပြီး state က
      fold လုပ်ထားတဲ့ ရလဒ်ပါ၊ ဒါကြောင့် trail နဲ့ state ကွဲစရာ မရှိပါဘူး၊ double-entry ledger ကိုယ်တိုင်က
      ဒီ pattern ပါ။ [[mark:iv-b]] ဒုတိယ၊ ဈေးက projection၊ snapshot နဲ့ schema evolution ပါ၊ event ကို
      တိုက်ရိုက် query မလုပ်နိုင်ပြီး version အဟောင်း event တွေကို ဒီနေ့ code က ဖတ်နိုင်ရပါမယ်။
      [[mark:iv-c]] တတိယ၊ ငွေ invariant ကို stream ပေါ်မှာ စစ်ရပြီး နောက်ကျနေတဲ့ projection နဲ့ funds
      check မလုပ်ရပါဘူး။ [[mark:iv-d]] ပြီးရင် ကိုယ် ဘာလုပ်မလဲ ဆက်ပြောပါ။ ledger ကို event sourcing နဲ့
