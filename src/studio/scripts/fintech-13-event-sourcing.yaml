  - id: try-it
    chapter: ကိုယ်တိုင် စမ်းကြည့်ပါ
    narration: >-
      [[mark:close-iv]] ကိုယ်တိုင် စမ်းကြည့်ဖို့ တစ်ခု ရှိပါတယ်။ [[mark:sel-try]] snapshot ကို ဒုတိယ event
      အထိ ရွှေ့ကြည့်ပါ။ sequence ကို နှစ်၊ balance ကို ယူရို ၉၇ နဲ့ ဆင့် ၁၀ လို့ ပြောင်းပြီး run ပါ။ balance
      က အရင်အတိုင်း ထွက်ပါလိမ့်မယ်၊ ဘယ် event မှာ snapshot ယူယူ ရလဒ် မပြောင်းပါဘူး။ [[mark:try-why]]
      balance ကို တမင် မှားအောင် ပြောင်းရင်တော့ ရလဒ်ပါ မှားသွားပါမယ်၊ snapshot ကို event တွေနဲ့ ပြန်စစ်နိုင်ရတာ
      ဒါကြောင့်ပါ။ [[mark:recap]] ပြန်ချုပ်ရရင်၊ event sourcing မှာ ဖြစ်ခဲ့တာကိုပဲ သိမ်းပြီး state ကို အမြဲ
      တွက်ယူလို့ trail က အမှန်နဲ့ ကွဲစရာ မရှိပါဘူး၊ ဈေးကတော့ projection နဲ့ schema evolution ပါ။ နောက်
      lesson မှာတော့ အဲဒီ event log ကို ဘယ်သူမှ မပြင်ခဲ့ဘူး ဆိုတာ ဘယ်လို သက်သေပြမလဲ ကြည့်ပါမယ်။
