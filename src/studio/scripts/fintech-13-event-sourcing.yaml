          target: { x: 0.5, y: 0.542 },
        }
      - { id: pt-cur, type: slide.point, at: { mark: pt-cur }, target: { x: 0.686, y: 0.571 } }
      - { id: evolve-3, type: slide.show, at: { mark: evolve-3 }, slideId: evolve-3 }
      - {
