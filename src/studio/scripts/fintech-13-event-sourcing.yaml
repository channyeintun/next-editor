  - id: evolve
    chapter: Upcaster
    narration: >-
      [[mark:show-evolve]] stored event ကို ပြန်ပြင်တာ ဖြေရှင်းနည်း မဟုတ်ပါဘူး၊ event တွေက ဘယ်တော့မှ
      မပြောင်းရတဲ့ မှတ်တမ်းတွေ ဖြစ်လို့ပါ။ [[mark:evolve-2]] ဒါကြောင့် ဖတ်တဲ့အချိန်မှာ ပြောင်းပေးတဲ့
      upcaster ကို သုံးပါတယ်။ upcaster က version အဟောင်း event ကို ယူပြီး ဒီနေ့ code နားလည်တဲ့ version
      အသစ် ပုံစံ ပြန်ပေးပါတယ်။ [[mark:pt-cur]] ဒီ ဥပမာမှာ version တစ်က currency မရှိခင်က ရေးခဲ့တာ ဖြစ်လို့
      amount တိုင်းကို ယူရို လို့ ယူဆပြီး ဖြည့်ပေးပါတယ်။ အဲဒီ ယူဆချက်ကိုယ်တိုင်က business က အတည်ပြုရမယ့်
      စည်းမျဉ်း တစ်ခုပါ။ [[mark:evolve-3]] stored data ကို migration နဲ့ ပြန်ရေးတာ မဟုတ်ဘဲ ဖတ်တိုင်း
      ပြောင်းတာပါ။ version တစ်ကနေ ဒီနေ့ version အထိ event အားလုံးကို ဒီနေ့ code က ဖတ်နိုင်ရမှာ ဖြစ်လို့
      version တိုင်းရဲ့ sample event တွေနဲ့ test လုပ်ထားရပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Event sourcing (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#event-sourcing",
        }
    actions:
