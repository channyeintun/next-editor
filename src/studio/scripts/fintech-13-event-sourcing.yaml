  - id: upcast
    narration: >-
      [[mark:close-evolve]] upcaster ကို ရေးကြည့်ရအောင်။ [[mark:type-up]] version တစ် ဖြစ်ရင် currency ကို
      ယူရို ဖြည့်ပြီး version နှစ် လို့ ပြောင်းပါတယ်။ တခြား version ဆိုရင်တော့ မပြောင်းဘဲ ပြန်ပေးပါတယ်။
      [[mark:type-use]] main ထဲမှာ အဲဒီ event အဟောင်းကို upcast လုပ်ပြီးမှ fold လုပ်ပါတယ်၊ stored JSON
      ကိုတော့ မထိပါဘူး။ ကျန်တဲ့ code ကလည်း version နှစ် ပုံစံ တစ်မျိုးတည်းကိုပဲ သိဖို့ လိုပါတော့တယ်။
      [[mark:run-4]] run လိုက်ရအောင်။ [[mark:pt-upcast]] ဒီတစ်ခါ ယူရို ဆယ် ဆိုတဲ့ balance ထွက်ပါတယ်။
      event အဟောင်းကို ဒီနေ့ code က ဖတ်နိုင်ပြီး history က ပြည့်စုံနေဆဲပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Event sourcing (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#event-sourcing",
        }
    actions:
      - { id: close-evolve, type: slide.close, at: { mark: close-evolve } }
      - id: type-up
        type: editor.type
        at: { mark: type-up }
        target: { file: main.go, after: "show(fold(State{}, []Event{v1})))\n}\n", occurrence: 1 }
        text: "\n// upcast reads a v1 event as v2. v1 predates multi-currency: every amount was EUR.\nfunc upcast(e Event) Event {\n\tif e.Version == 1 {\n\t\te.Version, e.Currency = 2, \"EUR\"\n\t}\n\treturn e\n}\n"
        cadence: line-by-line
      - id: type-use
        type: editor.type
        at: { mark: type-use }
        target: { file: main.go, after: "show(fold(State{}, []Event{v1})))\n", occurrence: 1 }
        text: "\tfmt.Println(\"v1 upcast:         \", show(fold(State{}, []Event{upcast(v1)})))\n"
        cadence: line-by-line
      - { id: run-4, type: runtime.run, at: { mark: run-4, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-4,
          type: expect.output,
          at: { afterAction: run-4 },
          contains: "v1 upcast:          10.00 EUR after event 1",
          timeoutMs: 8000,
        }
      - id: pt-upcast
        type: console.point
        at: { mark: pt-upcast }
        target: { text: "v1 upcast", occurrence: 1 }
      - {
          id: expect-file-upcast,
          type: expect.file,
          at: { afterAction: run-4 },
          path: main.go,
          contains: 'e.Version, e.Currency = 2, "EUR"',
        }

  - id: when
    chapter: ဘယ်မှာ သုံးမလဲ
    narration: >-
      [[mark:show-when]] ဒါဆို system တစ်ခုလုံးကို event sourcing နဲ့ ဆောက်ရမလား ဆိုတော့ မလိုပါဘူး။
      [[mark:pt-ledger]] ငွေကို ledger က ဖုံးထားပြီးသားပါ။ [[mark:pt-around]] user profile၊ settings၊ KYC
      case လို ဘေးက domain တွေအတွက်တော့ ပုံမှန် model နဲ့ ယုံကြည်ရတဲ့ change log တစ်ခုက များသောအားဖြင့်
      လုံလောက်ပါတယ်။ [[mark:when-2]] ပေးရတဲ့ ဈေးကတော့ projection အများကြီး၊ schema evolution၊
      projection တွေ နောက်ကျတာနဲ့ ပြန်ဆောက်ရတဲ့ အချိန် တို့ပါ။ [[mark:when-3]] ငွေမှာ သုံးရင် သတိထားရမှာ
      သုံးခု ရှိပါတယ်။ [[mark:pt-t1]] ပထမ၊ projection တွေက event နောက်ကနေ asynchronous လိုက်တာ ဖြစ်လို့
      withdrawal တစ်ခုအတွက် funds check ကို နောက်ကျနေတဲ့ projection ပေါ်မှာ မလုပ်ရပါဘူး။ account ရဲ့
      stream ကို snapshot နဲ့ နောက်ဆုံး event တွေကနေ fold လုပ်ပြီး၊ event အသစ် append လုပ်တဲ့အခါ sequence
      number ကို စစ်ပြီးမှ ရေးရပါမယ်။ [[mark:pt-t2]] ဒုတိယ၊ snapshot က cache ဖြစ်လို့ ဘယ် event အထိ၊
      apply ရဲ့ ဘယ် version နဲ့ တွက်ထားလဲ ပါရပါမယ်။ apply ကို ပြင်ရင် snapshot အဟောင်းတွေ မမှန်တော့လို့
      ပြန်ဆောက်ရပါတယ်။ [[mark:pt-t3]] တတိယ၊ event မှားသွားရင် stored event ကို မပြင်ဘဲ ပြင်ပေးတဲ့ event
      အသစ် ထည့်ရပါတယ်၊ ဒီအကြောင်းကို reversal lesson မှာ ကြည့်ပါမယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Event sourcing (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#event-sourcing",
        }
      - {
          title: "Fintech Engineering Handbook — Reversals and corrections (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#reversals-and-corrections",
        }
    actions:
      - {
          id: show-when,
          type: slide.show,
          at: { mark: show-when, offsetMs: -700 },
          slideId: when-1,
        }
      - {
          id: pt-ledger,
          type: slide.point,
          at: { mark: pt-ledger },
          target: { x: 0.275, y: 0.414 },
        }
      - {
          id: pt-around,
          type: slide.point,
          at: { mark: pt-around },
          target: { x: 0.725, y: 0.414 },
        }
      - { id: when-2, type: slide.show, at: { mark: when-2 }, slideId: when-2 }
