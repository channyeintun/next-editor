build:
  # Studio replaces this built-in profile at render time with the Burmese provider chosen in the
  # render console (AthanLab with the user's own key, or VoxCPM2 when that feature is enabled).
  voiceProfile: pocket-alba-v1
  seed: 3125
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "Module နဲ့ script"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ နာမည် တစ်ခုက type world မှာ နေလား၊ value world မှာ နေလား ဆိုတာ
      ကြည့်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ ဖိုင် တစ်ဖိုင်ထဲက နာမည်တွေကို ဘယ် ဖိုင်တွေက မြင်ရလဲ ဆိုတာနဲ့၊ ကိုယ် မရေးထားတဲ့
      code ရဲ့ type တွေကို TypeScript က ဘယ်ကနေ သိလဲ ဆိုတာကို ကြည့်သွားပါမယ်။ [[mark:draw-script]] TypeScript က
      ဖိုင် တစ်ဖိုင်ကို ဖတ်တဲ့အခါ import ဒါမှမဟုတ် export ပါလား ဆိုတာ အရင် ကြည့်ပါတယ်။ တစ်ခုမှ မပါရင် အဲဒီ
      ဖိုင်ကို script လို့ ယူဆပါတယ်။ script တွေက ဘယ်ဖိုင်ကမဆို မြင်ရတဲ့ global scope တစ်ခုတည်းကို
      မျှသုံးကြပြီး၊ browser ရဲ့ window လို နာမည်တွေလည်း အဲဒီမှာပဲ ရှိပါတယ်။ [[mark:draw-module]] import
      ဒါမှမဟုတ် export ပါတဲ့ ဖိုင်ကတော့ module ပါ။ module တစ်ခုစီမှာ ကိုယ်ပိုင် scope ရှိလို့၊ export မလုပ်တဲ့
      နာမည်တွေကို တခြား ဖိုင်က မမြင်ရပါဘူး။ [[mark:draw-clash]] ဒါကြောင့် script ထဲမှာ browser က ရှိပြီးသား
      နာမည် တစ်ခုကို ထပ်ကြေညာရင်၊ global scope ထဲမှာ နာမည်တူ နှစ်ခု ဖြစ်ပြီး error တက်ပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 13: Modules, Scripts, and Declaration Files",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/modules-scripts-and-declaration-files",
        }
      - {
          title: "TypeScript Handbook: Modules (how JavaScript modules are defined)",
          url: "https://www.typescriptlang.org/docs/handbook/2/modules.html",
        }
    actions:
      - id: open-board-a
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-script-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-script
        type: whiteboard.apply
        at: { mark: draw-script }
        upsertIds: [a-script-rule, a-script-box, a-script-main, a-script-dom, a-script-scope]
        drawMs: 3000
      - id: draw-module
        type: whiteboard.apply
        at: { mark: draw-module }
        upsertIds:
          [
            a-module-title,
            a-module-rule,
            a-module-box1,
            a-module-name1,
            a-module-own1,
            a-module-box2,
            a-module-name2,
            a-module-own2,
          ]
        drawMs: 3200
      - id: draw-clash
        type: whiteboard.apply
        at: { mark: draw-clash }
        upsertIds: [a-clash-circle, a-clash]
        drawMs: 1800

  - id: starter
    narration: >
      [[mark:close-board]] ဒီနေ့ code ကို ကြည့်ရအောင်။ [[mark:open-index]] ဒါက page ရဲ့ HTML ဖိုင်ပါ။
      [[mark:select-script]] ဆိုင်ရဲ့ website က ဒီ script tag ကို ထည့်ပေးထားပါတယ်။ ဒီနေ့ special ဟင်းလျာကို
      global variable တစ်ခု အနေနဲ့ သတ်မှတ်ပေးပြီး၊ စားပွဲ အရေအတွက်ကိုလည်း window ပေါ်မှာ တင်ပေးထားပါတယ်။
      HTML ထဲမှာ ရေးထားတဲ့ ရိုးရိုး JavaScript ဖြစ်လို့၊ TypeScript က ဒီ code ကို မဖတ်ပါဘူး။
      [[mark:open-main]] ဒါကတော့ ဆိုင်ရဲ့ အော်ဒါ screen အတွက် main ဖိုင်ပါ။ [[mark:select-name]] customer ရဲ့
      နာမည်ကို name ဆိုတဲ့ variable ထဲ ထည့်ထားပါတယ်။ [[mark:select-globals]] အောက်က နှစ်ကြောင်းက website
      ပေးထားတဲ့ special ဟင်းလျာနဲ့ စားပွဲ အရေအတွက်ကို ယူသုံးပြီး၊ [[mark:select-logs]] နောက်ဆုံး သုံးကြောင်းက
      အားလုံးကို ထုတ်ပြပါတယ်။ ဒီ ဖိုင်ထဲမှာ import ရော export ရော တစ်ကြောင်းမှ မပါတာကို သတိထား ကြည့်ပါ။
    sources:
      - {
          title: "MDN: The Window object (global scope in the browser)",
          url: "https://developer.mozilla.org/en-US/docs/Web/API/Window",
        }
      - {
          title: "MDN: <script> — classic scripts",
          url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/script",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: open-index
        type: workspace.openFile
        at: { mark: open-index }
        path: index.html
      - id: select-script
        type: editor.select
        at: { mark: select-script }
        target:
          {
            file: index.html,
            text: "var todaySpecial = { item: \"မုန့်ဟင်းခါး\", price: 2500 };\n      window.tableCount = 12;",
            occurrence: 1,
          }
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: src/main.ts
      - id: select-name
        type: editor.select
        at: { mark: select-name }
        target: { file: src/main.ts, text: 'const name = "လှလှ";', occurrence: 1 }
      - id: select-globals
        type: editor.select
        at: { mark: select-globals }
        target:
          {
            file: src/main.ts,
            text: "const special = todaySpecial.item;\nconst tables = window.tableCount;",
            occurrence: 1,
          }
      - id: select-logs
        type: editor.select
        at: { mark: select-logs }
        target:
          {
            file: src/main.ts,
