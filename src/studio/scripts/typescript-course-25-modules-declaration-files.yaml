      အရေအတွက်၊ သုံးကြောင်းလုံး မှန်မှန် ထွက်လာပါတယ်။ website ရဲ့ script က တန်ဖိုးတွေကို တကယ်
      ထည့်ပေးထားလို့ပါ။ [[mark:read-errors]] ဒါပေမဲ့ Errors မှာတော့ error သုံးခု ရှိပါတယ်။ ဒုတိယနဲ့ တတိယ error
      က special ဟင်းလျာကို ရှာမတွေ့ဘူး၊ window ပေါ်မှာ စားပွဲ အရေအတွက် မရှိဘူးလို့ ပြောနေပါတယ်။ HTML ထဲက
      script ကို TypeScript မဖတ်လို့ပါ။ [[mark:read-redeclare]] ပထမ error ကတော့ name ဆိုတဲ့ variable ကို
      ထပ်ကြေညာလို့ မရဘူးလို့ ပြောပါတယ်။ ဒီ ဖိုင်ထဲမှာ တစ်ခါပဲ ကြေညာထားပေမယ့်၊ TypeScript က ဒီ ဖိုင်ကို script
      လို့ ယူဆထားပါတယ်။ TypeScript ရဲ့ DOM type တွေထဲမှာလည်း browser ရဲ့ name ဆိုတဲ့ global ကို
      ကြေညာထားပြီးသား ဖြစ်လို့၊ global scope ထဲမှာ name နှစ်ခု ဖြစ်သွားတာပါ။
    sources:
