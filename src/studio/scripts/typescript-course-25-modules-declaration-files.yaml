          }
        }
      src/globals.d.ts: |
        // ဆိုင်ရဲ့ website က ထည့်ပေးတဲ့ global တွေ
      src/main.ts: |
        // ဆိုင်ရဲ့ အော်ဒါ screen
        const name = "လှလှ";
        const special = todaySpecial.item;
        const tables = window.tableCount;

        console.log("မင်္ဂလာပါ", name);
        console.log("ဒီနေ့ special:", special);
        console.log("စားပွဲ", tables, "လုံး");
      src/menu.ts: |
        export type MenuItem = {
          name: string;
          price: number;
        };

        export const menu: MenuItem[] = [
          { name: "လက်ဖက်ရည်", price: 1500 },
          { name: "ကော်ဖီ", price: 1800 },
        ];

        export function priceOf(name: string): number {
          const item = menu.find((m) => m.name === name);
          return item ? item.price : 0;
        }
      src/types/ms.d.ts: |
        // ms package အတွက် type တွေ
      tsconfig.json: |
        {
          "compilerOptions": {
            "target": "es2022",
            "module": "preserve",
            "strict": true,
            "noEmit": true
          },
          "include": ["src"]
        }
      vite.config.js: |
        import { defineConfig } from "vite";
        import courseTypeChecker from "./course/checker.js";

        export default defineConfig({
          plugins: [courseTypeChecker()],
          // Pre-bundle ms up front so Vite never discovers it mid-lesson and reloads.
          optimizeDeps: { include: ["ms"] },
        });
