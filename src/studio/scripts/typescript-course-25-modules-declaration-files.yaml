      [[mark:select-body]] ဈေးနှုန်း ရှာတဲ့ function ထဲမှာ အလုပ်လုပ်မယ့် code ရှိပါတယ်။ [[mark:read-dts]] Declaration output အပိုင်းမှာ TypeScript က ဒီ ဖိုင်ကနေ
      ထုတ်ပေးမယ့် declaration file ကို ပြထားပါတယ်။ menu array ထဲက တန်ဖိုးတွေနဲ့ function ရဲ့ code
      ပျောက်သွားပြီး type တွေပဲ ကျန်ပါတယ်။ TypeScript နဲ့ ရေးတဲ့
      library တွေက ဒီလိုပဲ run ဖို့ JavaScript ဖိုင်ရယ်၊ editor နဲ့ type checker ဖတ်ဖို့ declaration file ရယ်ကို
