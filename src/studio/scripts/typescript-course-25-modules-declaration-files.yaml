  - id: module-detection
    narration: >
      ဒီလို ဖြစ်ရတာက၊ ဖိုင် တစ်ဖိုင်ကို module အနေနဲ့ run မလား၊ script အနေနဲ့ run မလား ဆိုတာ TypeScript
      ကြိုမသိနိုင်လို့၊ import နဲ့ export ကို ကြည့်ပြီး ခန့်မှန်းရတာပါ။ ဘာမှ မပါတဲ့ export တစ်ကြောင်း
      ထည့်ရင် module ဖြစ်ပေမယ့်၊ ဖိုင်တိုင်းမှာ လိုက်ထည့်ရပါမယ်။ [[mark:open-tsconfig]] ဒါကြောင့် tsconfig ဖိုင်မှာ တစ်ခါတည်း သတ်မှတ်ပါမယ်။
      [[mark:type-force]] module detection option ကို force လို့ ထည့်လိုက်ပါမယ်။ [[mark:read-force]] name
      error ပျောက်ပြီး error နှစ်ခုပဲ ကျန်ပါတော့တယ်။ force က declaration file မဟုတ်တဲ့ ဖိုင်တိုင်းကို module
      လို့ ယူဆခိုင်းလို့၊ main ဖိုင်ရဲ့ name က ကိုယ်ပိုင် scope ထဲ ရောက်သွားတာပါ။
    sources:
      - {
          title: "TSConfig reference: moduleDetection",
          url: "https://www.typescriptlang.org/tsconfig/#moduleDetection",
        }
      - {
          title: "Total TypeScript Essentials, ch. 13: Forcing modules with moduleDetection",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/modules-scripts-and-declaration-files",
        }
      - {
          title: "create-vite: template-vanilla-ts tsconfig.json",
          url: "https://github.com/vitejs/vite/blob/main/packages/create-vite/template-vanilla-ts/tsconfig.json",
        }
    actions:
      - id: open-tsconfig
        type: workspace.openFile
        at: { mark: open-tsconfig }
        path: tsconfig.json
      - id: type-force
        type: editor.type
        at: { mark: type-force }
        target: { file: tsconfig.json, after: "\"strict\": true,\n", occurrence: 1 }
        text: "    \"moduleDetection\": \"force\",\n"
        cadence: block
      - id: expect-force-two
        type: expect.preview
        at: { afterAction: type-force }
        timeoutMs: 10000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 800 }
      - id: expect-force-first
        type: expect.preview
        at: { afterAction: expect-force-two }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-code, value: "2304" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: declare-const
    chapter: "Declaration file နဲ့ declare"
    narration: >
      [[mark:open-globals]] special ဟင်းလျာအတွက်တော့ TypeScript မဖတ်တဲ့ script ထဲမှာ ဘာ ရှိလဲ ဆိုတာ ဒီ
      ဖိုင်မှာ ပြောပြရပါမယ်။ နာမည်ရဲ့ နောက်ဆုံးမှာ D T S ပါတဲ့ ဖိုင်ကို declaration file လို့ ခေါ်ပြီး၊
      type တွေကိုပဲ ရေးရပါတယ်။ JavaScript အဖြစ် ဘယ်တော့မှ မပြောင်းလို့၊ အလုပ်လုပ်မယ့်
      code ထည့်လို့ မရပါဘူး။ [[mark:type-declare-const]] declare const ကို ရေးပါမယ်။
      declare ဆိုတာ ဒီ နာမည်နဲ့ တန်ဖိုး တစ်ခု run တဲ့ အချိန်မှာ တကယ် ရှိပါတယ်၊ ဒါပေမဲ့ သူ့ကို တခြား နေရာမှာ
      ရေးထားပါတယ်လို့ ပြောတာပါ။ [[mark:read-declare-const]] error တစ်ခု ထပ်ပျောက်သွားပါပြီ။
      ဒီ ဖိုင်မှာ import export မပါတဲ့အပြင် force ကလည်း declaration file ကို module မဖြစ်စေလို့၊ main
      ဖိုင်က import မလုပ်ဘဲ ဒီ global ကို မြင်ရတာပါ။ သတိထားရမှာက TypeScript က
      ဒီ ကြေညာချက်ကို website ရဲ့ script နဲ့ တိုက်မစစ်နိုင်တာပါ။ script ပြောင်းသွားရင် ဒီ ဖိုင်ကို ကိုယ်တိုင်
      လိုက်ပြင်ရပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 13: Declaration files, declare const, typing global variables",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/modules-scripts-and-declaration-files",
        }
      - {
          title: "TypeScript Handbook: Declaration Reference (global variables)",
          url: "https://www.typescriptlang.org/docs/handbook/declaration-files/by-example.html#global-variables",
        }
      - {
          title: "TSConfig reference: moduleDetection (force applies to non-declaration files)",
          url: "https://www.typescriptlang.org/tsconfig/#moduleDetection",
        }
    actions:
      - id: open-globals
        type: workspace.openFile
        at: { mark: open-globals }
        path: src/globals.d.ts
      - id: type-declare-const
        type: editor.type
        at: { mark: type-declare-const }
        target: { file: src/globals.d.ts, after: "global တွေ\n", occurrence: 1 }
        text: "declare const todaySpecial: { item: string; price: number };\n"
        cadence: fast-explainer
      - id: expect-const-one
        type: expect.preview
        at: { afterAction: type-declare-const }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-const-left
        type: expect.preview
        at: { afterAction: expect-const-one }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-code, value: "2339" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: declare-global
    narration: >
      [[mark:back-main]] ကျန်တဲ့ error ကို ကြည့်ရအောင်။ [[mark:select-window]] window ရဲ့ type ကို TypeScript
      ရဲ့ DOM type တွေထဲမှာ Window interface နဲ့ ကြေညာထားပြီး၊ စားပွဲ အရေအတွက် property မပါပါဘူး။ နာမည်တူ
      interface တွေ တစ်ခုတည်း ပေါင်းသွားတယ် ဆိုတာ lesson ၁၂ မှာ မြင်ခဲ့လို့၊ Window interface ကို
      ထပ်ရေးပြီး property ထည့်ပေးလို့ ရပါတယ်။ [[mark:type-declare-global]] ဒီတစ်ခါတော့ property ကို သုံးတဲ့
      main ဖိုင်ထဲမှာပဲ ရေးပါမယ်။ main ဖိုင်က အခု module ဖြစ်နေလို့ ဒီတိုင်း ရေးရင် သူ့ scope ထဲမှာပဲ
      ကျန်မှာမို့၊ declare global block ထဲ ထည့်ပြီး global scope ထဲကို ထည့်ခိုင်းပါတယ်။
      [[mark:read-declare-global]] Errors မှာ error တစ်ခုမှ
      မကျန်တော့ပါဘူး။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 13: declare global",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/modules-scripts-and-declaration-files",
        }
      - {
          title: "TypeScript Handbook: Declaration Merging (global augmentation)",
          url: "https://www.typescriptlang.org/docs/handbook/declaration-merging.html#global-augmentation",
        }
    actions:
      - id: back-main
        type: workspace.openFile
        at: { mark: back-main }
        path: src/main.ts
      - id: select-window
        type: editor.select
        at: { mark: select-window }
        target: { file: src/main.ts, text: "window.tableCount", occurrence: 1 }
      - id: type-declare-global
