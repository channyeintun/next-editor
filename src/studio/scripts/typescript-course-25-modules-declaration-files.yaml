  - id: where-types-come-from
    chapter: "Type တွေ ဘယ်က လာလဲ"
    narration: >
      [[mark:type-query-window]] window ကိုယ်တိုင်ရဲ့ type ကိုလည်း query comment နဲ့ မေးကြည့်ရအောင်။
      [[mark:read-query-window]] Types မှာ Window interface နဲ့ globalThis ကို ပေါင်းထားတဲ့ type နဲ့ MDN
      link ပါတဲ့ ရှင်းလင်းချက်ကို ပြပါတယ်။ ဒါတွေက TypeScript နဲ့ ပါလာတဲ့ lib dot dom ဆိုတဲ့
      declaration file ထဲမှာ ရေးထားတာပါ။ [[mark:board-sources]] declaration file တွေ ဘယ်က လာလဲ ဆိုတော့
      လေးမျိုး ရှိပါတယ်။
      [[mark:draw-lib]] ပထမက TypeScript မှာ ပါလာတဲ့ lib ဖိုင်တွေပါ။ JavaScript ရဲ့ built-in တွေရော browser ရဲ့
      DOM တွေရော ဒီထဲမှာ ရှိပြီး၊ tsconfig ရဲ့ lib option နဲ့ ရွေးလို့ ရပါတယ်။ မရေးထားရင် target ကို
      ကြည့်ပြီး DOM ပါ တွဲပေးပါတယ်။ [[mark:draw-packages]] ဒုတိယက Vite လို package တွေက သူ့ထဲမှာ ထည့်ပေးထားတဲ့
      type တွေ ဖြစ်ပြီး၊ package json ရဲ့ types field က အဲဒီ ဖိုင်ကို ညွှန်ပြပါတယ်။ [[mark:draw-definitely]]
      တတိယက DefinitelyTyped ပါ။ type မပါတဲ့ package တွေအတွက် community က at types package တွေ သီးသန့်
      ရေးပေးထားပါတယ်။ Node.js လို global type ထည့်ပေးတဲ့ package ကိုတော့ TypeScript ၆ ကစပြီး types
      option ထဲမှာ နာမည် ရေးပေးရပါတယ်။ [[mark:draw-own]] စတုတ္ထကတော့ ခုနက ရေးခဲ့သလို ကိုယ်တိုင် ရေးတဲ့ declaration file တွေပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 13: Declaration files you don't control, lib, DOM types, DefinitelyTyped",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/modules-scripts-and-declaration-files",
        }
      - { title: "TSConfig reference: lib", url: "https://www.typescriptlang.org/tsconfig/#lib" }
      - {
          title: "TSConfig reference: types",
          url: "https://www.typescriptlang.org/tsconfig/#types",
        }
      - {
          title: "Announcing TypeScript 6.0 (types defaults to [], dom.iterable merged into dom)",
          url: "https://devblogs.microsoft.com/typescript/announcing-typescript-6-0/",
        }
      - {
          title: "TypeScript Handbook: Consumption of declaration files (@types)",
          url: "https://www.typescriptlang.org/docs/handbook/declaration-files/consumption.html",
        }
    actions:
      - id: open-main-2
        type: workspace.openFile
        at: { mark: type-query-window }
        path: src/main.ts
      - id: type-query-window
        type: editor.type
        at: { afterAction: open-main-2 }
        target: { file: src/main.ts, after: "const tables = window.tableCount;\n", occurrence: 1 }
        text: "//             ^?\n"
        cadence: fast-explainer
      - id: expect-query-window
        type: expect.preview
        at: { afterAction: type-query-window }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        attribute: { name: data-type, value: "var window: Window & typeof globalThis" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: open-board-b
        type: whiteboard.apply
        at: { mark: board-sources }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-lib
        type: whiteboard.apply
        at: { mark: draw-lib }
        upsertIds: [b-lib-box, b-lib-name, b-lib-sub, b-lib-dom]
        drawMs: 2400
      - id: draw-packages
        type: whiteboard.apply
        at: { mark: draw-packages }
        upsertIds: [b-pkg-box, b-pkg-name, b-pkg-sub, b-pkg-field]
        drawMs: 2400
      - id: draw-definitely
        type: whiteboard.apply
        at: { mark: draw-definitely }
        upsertIds: [b-dt-box, b-dt-name, b-dt-sub, b-dt-node]
        drawMs: 2600
      - id: draw-own
        type: whiteboard.apply
        at: { mark: draw-own }
        upsertIds: [b-own-box, b-own-name, b-own-sub]
        drawMs: 1800

  - id: declare-module
    chapter: "Type မပါတဲ့ package နဲ့ declare module"
    narration: >
      [[mark:close-board-b]] type မပါတဲ့ package ကို တကယ် သုံးကြည့်ရအောင်။ M S က စာသားနဲ့ ရေးထားတဲ့
      အချိန်ကို မီလီစက္ကန့် ပြောင်းပေးတဲ့ JavaScript package လေးပါ။ [[mark:type-import]] main ဖိုင်မှာ သူ့ကို default import လုပ်ပါမယ်။
      [[mark:read-import-error]] Errors မှာ M S အတွက် declaration file ရှာမတွေ့လို့ သူ့ JavaScript
      ဖိုင်က any type ဖြစ်နေတယ် ဆိုတဲ့ error ပေါ်လာပါပြီ။ ဒုတိယ အပိုင်းက at types M S ရှိရင် ထည့်ဖို့၊ ဒါမှမဟုတ် declare module နဲ့ ကြေညာဖို့
      အကြံပေးပါတယ်။ DefinitelyTyped မှာ at types M S ရှိလို့ ပုံမှန်ဆိုရင် အဲဒါ ထည့်ရုံပါပဲ။
      [[mark:type-brew]] လက်ဖက်ရည် ဖျော်ချိန် သုံးမိနစ်ကို ပြောင်းကြည့်ပါမယ်။ [[mark:read-any]] Output
      မှာ ၁၈၀၀၀၀ ထွက်လာလို့ package က တကယ် အလုပ်လုပ်ပါတယ်။ ဒါပေမဲ့ Types မှာ ဖျော်ချိန်က any ဖြစ်နေလို့
      TypeScript က ဘာမှ မစစ်ပေးနိုင်ပါဘူး။ [[mark:open-ms-dts]] ဒီမှာတော့ type ကို ကိုယ်တိုင်
      ရေးကြည့်ပါမယ်။ src folder ထဲက ဖိုင်မို့ tsconfig ရဲ့ include ထဲ ပါပြီး TypeScript က ဖတ်ပါတယ်။
      [[mark:type-declare-module]] declare module နဲ့ package နာမည်ကို ရေးပြီး၊ ဆိုင်က ခေါ်သုံးတဲ့ ပုံစံကိုပဲ
      ကြေညာပါမယ်။ စာသား ယူပြီး number ပြန်ပေးတဲ့ default export ပါ။ error ပျောက်ပြီး
      ဖျော်ချိန်က number ဖြစ်သွားပါပြီ။ package နာမည်ကိုပဲ declare module နဲ့ တစ်ကြောင်းတည်း ရေးရင်လည်း
      error ပျောက်ပေမယ့်၊ အားလုံး any ဖြစ်သွားပါမယ်။
    sources:
      - {
          title: "npm: ms 2.1.3 (no types or typings field; the package ships index.js only)",
          url: "https://www.npmjs.com/package/ms/v/2.1.3",
        }
      - {
          title: "npm: @types/ms (DefinitelyTyped)",
          url: "https://www.npmjs.com/package/@types/ms",
        }
      - {
          title: "Total TypeScript Essentials, ch. 13: declare module; DefinitelyTyped",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/modules-scripts-and-declaration-files",
        }
      - {
          title: "TypeScript Handbook: Modules reference, ambient modules (declare module)",
          url: "https://www.typescriptlang.org/docs/handbook/modules/reference.html#ambient-modules",
        }
      - {
          title: "TypeScript Handbook: Modules .d.ts template",
          url: "https://www.typescriptlang.org/docs/handbook/declaration-files/templates/module-d-ts.html",
        }
      - {
          title: "TypeScript Handbook: Publishing declaration files (types in the package or in @types)",
          url: "https://www.typescriptlang.org/docs/handbook/declaration-files/publishing.html",
        }
      - {
          title: "TypeScript 2.0 release notes: shorthand ambient module declarations (every import is any)",
          url: "https://www.typescriptlang.org/docs/handbook/release-notes/typescript-2-0.html#shorthand-ambient-module-declarations",
        }
    actions:
      - id: close-board-b
        type: whiteboard.apply
        at: { mark: close-board-b }
        open: false
      - id: type-import
        type: editor.type
        at: { mark: type-import }
        target: { file: src/main.ts, after: "// ဆိုင်ရဲ့ အော်ဒါ screen\n", occurrence: 1 }
        text: "import ms from \"ms\";\n"
        cadence: fast-explainer
      - id: expect-import-error
        type: expect.preview
        at: { afterAction: type-import }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-import-code
        type: expect.preview
        at: { afterAction: expect-import-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-code, value: "7016" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-import-message
        type: expect.preview
        at: { mark: read-import-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Could not find a declaration file for module 'ms'."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-import-hint
        type: expect.preview
        at: { afterAction: expect-import-message }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Try `npm i --save-dev @types/ms` if it exists or add a new declaration (.d.ts) file containing `declare module 'ms';`"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-brew
        type: editor.type
        at: { mark: type-brew }
        target:
          { file: src/main.ts, after: "console.log(\"စားပွဲ\", tables, \"လုံး\");\n", occurrence: 1 }
        text: "\nconst brewTime = ms(\"3m\");\n//    ^?\nconsole.log(\"လက်ဖက်ရည် ဖျော်ချိန်\", brewTime, \"မီလီစက္ကန့်\");\n"
        cadence: line-by-line
      - id: expect-brew-output
        type: expect.preview
        at: { afterAction: type-brew }
        timeoutMs: 8000
        target: { by: testId, value: ts-output }
        attribute: { name: data-count, value: "4" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-brew-line
        type: expect.preview
        at: { afterAction: expect-brew-output }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-4 }
        textContains: "လက်ဖက်ရည် ဖျော်ချိန် 180000 မီလီစက္ကန့်"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-brew-any
        type: expect.preview
        at: { afterAction: expect-brew-line }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-2 }
        attribute: { name: data-type, value: "const brewTime: any" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-brew-still-one
        type: expect.preview
        at: { afterAction: expect-brew-any }
        timeoutMs: 5000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: open-ms-dts
        type: workspace.openFile
        at: { mark: open-ms-dts }
        path: src/types/ms.d.ts
      - id: type-declare-module
        type: editor.type
        at: { mark: type-declare-module }
        target: { file: src/types/ms.d.ts, after: "// ms package အတွက် type တွေ\n", occurrence: 1 }
        text: "declare module \"ms\" {\n  export default function ms(text: string): number;\n}\n"
        cadence: block
      - id: expect-module-clean
        type: expect.preview
        at: { afterAction: type-declare-module }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-module-type
        type: expect.preview
        at: { afterAction: expect-module-clean }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-2 }
        attribute: { name: data-type, value: "const brewTime: number" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-module-output
        type: expect.preview
        at: { afterAction: expect-module-type }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-4 }
        textContains: "လက်ဖက်ရည် ဖျော်ချိန် 180000 မီလီစက္ကန့်"
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: skiplibcheck
    chapter: "skipLibCheck ရဲ့ အားနည်းချက်"
    narration: >
      declaration file ထဲမှာ run မယ့် code ထည့်လို့ မရဘူး ဆိုတာကို တကယ်
      စမ်းကြည့်ရအောင်။ [[mark:type-impl]] ဈေးနှုန်းကို ကျပ် နဲ့ ပြတဲ့ function တစ်ခုကို၊ code ပါ ပါအောင်
      တမင် ရေးကြည့်ပါမယ်။ ambient context မှာ implementation ရေးလို့ မရဘူး ဆိုတဲ့
      error ပေါ်လာပါပြီ။ ambient ဆိုတာ code မပါဘဲ ရှိတယ်လို့ ကြေညာရုံ ကြေညာတာ ဖြစ်ပြီး၊ declaration file ထဲက
      အရာအားလုံးက ambient ပါ။ [[mark:open-tsconfig-2]] project အများစုမှာ ဖွင့်ထားတဲ့ skip lib check
      option ကို ထည့်ကြည့်ပါမယ်။ [[mark:type-skip]] ဒီ option က declaration file တွေကို type check မလုပ်ဖို့
      ပြောတာပါ။ [[mark:read-skip]] error ပျောက်သွားပေမယ့် အမှားက ရှိနေတုန်းပါ။ package တွေရဲ့ type ကို
      မစစ်တော့လို့ ပိုမြန်ပြီး၊ ကိုယ် ပြင်လို့ မရတဲ့ package ထဲက error တွေ မပေါ်တော့တာက ကောင်းကွက်ပါ။
      ကိုယ်တိုင် ရေးတဲ့ declaration file ကိုပါ မစစ်တော့တာကတော့ အားနည်းချက်ပါ။
      [[mark:type-comment-impl]] ဒါကြောင့် စမ်းထားတဲ့ line ကို comment လုပ်ပြီး ပိတ်ထားပါမယ်။ ကိုယ့် project ရဲ့
      type တွေကိုလည်း declaration file ထဲမှာ မစုဘဲ၊ TypeScript က အမြဲ စစ်ပေးတဲ့ ရိုးရိုး TypeScript ဖိုင်မှာ
      ရေးပြီး export လုပ်ပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 13: Declaration files can't contain implementations; skipLibCheck and its downsides; should you store your types in declaration files?",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/modules-scripts-and-declaration-files",
        }
      - {
          title: "TSConfig reference: skipLibCheck",
          url: "https://www.typescriptlang.org/tsconfig/#skipLibCheck",
        }
    actions:
      - id: open-globals-2
        type: workspace.openFile
        at: { mark: type-impl }
        path: src/globals.d.ts
      - id: type-impl
        type: editor.type
        at: { afterAction: open-globals-2 }
        target: { file: src/globals.d.ts, after: "price: number };\n", occurrence: 1 }
        text: "declare function formatKyat(price: number): string { return price + \" ကျပ်\"; }\n"
        cadence: block
      - id: expect-impl-error
        type: expect.preview
        at: { afterAction: type-impl }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-impl-code
        type: expect.preview
        at: { afterAction: expect-impl-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-code, value: "1183" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-impl-file
        type: expect.preview
        at: { afterAction: expect-impl-code }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-file, value: "src/globals.d.ts" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: open-tsconfig-2
        type: workspace.openFile
        at: { mark: open-tsconfig-2 }
        path: tsconfig.json
      - id: type-skip
        type: editor.type
        at: { mark: type-skip }
        target: { file: tsconfig.json, after: "\"moduleDetection\": \"force\",\n", occurrence: 1 }
        text: "    \"skipLibCheck\": true,\n"
        cadence: block
      - id: expect-skip-hidden
        type: expect.preview
        at: { afterAction: type-skip }
        timeoutMs: 10000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 800 }
      - id: open-globals-3
        type: workspace.openFile
        at: { mark: type-comment-impl }
        path: src/globals.d.ts
      - id: type-comment-impl
        type: editor.type
        at: { afterAction: open-globals-3 }
        target: { file: src/globals.d.ts, after: "price: number };\n", occurrence: 1 }
        text: "// "
      - id: expect-comment-clean
        type: expect.preview
        at: { afterAction: type-comment-impl }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: recap
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ import ဒါမှမဟုတ် export ပါတဲ့ ဖိုင်က ကိုယ်ပိုင် scope ရှိတဲ့ module ဖြစ်ပြီး၊
      မပါရင် global scope ကို မျှသုံးတဲ့ script ဖြစ်ပါတယ်။ module detection ကို force ထားရင်တော့
      declaration file ကလွဲရင် ဖိုင်တိုင်း module ဖြစ်ပါတယ်။ [[mark:recap-dts]] declaration file မှာ type ပဲ
      ပါပြီး၊ declare နဲ့ global တွေကို ကြေညာနိုင်သလို module ထဲကနေ declare global နဲ့လည်း ထည့်နိုင်ပါတယ်။
      type မပါတဲ့ package ကိုတော့ at types ဒါမှမဟုတ် declare module နဲ့ type ပေးပါ။
      skip lib check က ကိုယ်ရေးတဲ့ declaration file တွေကိုပါ မစစ်တော့တာ သတိထားပါ။ နောက် lesson မှာတော့ tsconfig ကို
      အသေးစိတ် ပြင်ဆင်ပုံကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 13: Modules, Scripts, and Declaration Files",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/modules-scripts-and-declaration-files",
        }
    actions:
      - id: select-declare
        type: editor.select
        at: { mark: recap-dts }
        target: { file: src/globals.d.ts, text: "declare const todaySpecial", occurrence: 1 }
      - id: expect-file-tsconfig
        type: expect.file
        at: { afterAction: select-declare }
        path: tsconfig.json
        contains: "    \"strict\": true,\n    \"moduleDetection\": \"force\",\n    \"skipLibCheck\": true,\n"
      - id: expect-file-globals
        type: expect.file
        at: { afterAction: expect-file-tsconfig }
        path: src/globals.d.ts
        contains: "declare const todaySpecial: { item: string; price: number };\n// declare function formatKyat"
      - id: expect-file-main
        type: expect.file
        at: { afterAction: expect-file-globals }
        path: src/main.ts
        contains: "declare global {\n  interface Window {\n    tableCount: number;\n  }\n}\n"
      - id: expect-file-main-ms
        type: expect.file
        at: { afterAction: expect-file-main }
        path: src/main.ts
        contains: "// ဆိုင်ရဲ့ အော်ဒါ screen\nimport ms from \"ms\";\n"
      - id: expect-file-ms-dts
        type: expect.file
        at: { afterAction: expect-file-main-ms }
        path: src/types/ms.d.ts
        contains: "declare module \"ms\" {\n  export default function ms(text: string): number;\n}\n"
checks:
  - { type: timing.p95Ms, max: 300 }
