build:
  voiceProfile: pocket-alba-v1
  seed: 73

runtime:
  kind: go-playground
  defaultMode: fixture
  fixture:
    latencyMs: 600
    result:
      status: success
      exitCode: 0
      output: "ready + PLAY -> playing\nplaying + EDIT -> paused\npaused + PLAY -> playing\nplaying + FINISHED -> ended\n"

scenes:
  - id: core-owners
    narration: >
      [[mark:open-core]] Start with three jobs.
      [[mark:show-workspace]] Workspace owns the current files and active file.
      [[mark:show-machine]] The editor machine owns the mode: idle, recording,
      loading, or playback. Playback contains ready, playing, paused, and ended.
      [[mark:show-clock]] Timeline owns the clock and sends ticks.
      [[mark:show-owner-rule]] One writer controls the workspace: you while
      editing, or the machine while replaying.
    sources:
      - title: "Next Editor — State Machines Documentation"
        url: "https://github.com/channyeintun/next-editor/blob/main/docs/state-machines.md"
    actions:
      - id: open-core-board
        type: whiteboard.apply
        at: { mark: open-core }
        open: true
        maximized: true
        upsertIds: [core-title]
      - id: show-workspace-owner
        type: whiteboard.apply
        at: { mark: show-workspace }
        upsertIds: [workspace-box, workspace-heading, workspace-body, workspace-foot]
      - id: show-editor-machine
        type: whiteboard.apply
        at: { mark: show-machine }
        upsertIds: [event-arrow, machine-box, machine-heading, machine-body]
      - id: show-timeline-machine
        type: whiteboard.apply
        at: { mark: show-clock }
        upsertIds: [tick-arrow, timeline-box, timeline-heading, timeline-body]
      - id: show-single-writer-rule
        type: whiteboard.apply
        at: { mark: show-owner-rule }
        upsertIds: [owner-rule-box, owner-rule]

  - id: transition-rule
    narration: >
      [[mark:close-core]] A state is the current mode. An event chooses the next
      allowed mode. [[mark:open-model]] This small Go table mirrors that rule.
      [[mark:add-edit]] Let's add Edit: playing becomes paused.
      [[mark:run-model]] Now run the path. Play starts, Edit pauses, Play
      resumes, and Finished ends. The real machine has more events, but the rule
      stays predictable.
    sources:
      - title: "Next Editor — Editor Machine Overview"
        url: "https://github.com/channyeintun/next-editor/blob/main/docs/state-machines.md#editor-machine-overview"
      - title: "The Go Programming Language Specification — Map types"
        url: "https://go.dev/ref/spec#Map_types"
    actions:
      - id: close-core-board
        type: whiteboard.apply
        at: { mark: close-core }
        open: false
      - id: open-transition-model
        type: workspace.openFile
        at: { mark: open-model }
        path: main.go
      - id: add-edit-transition
        type: editor.type
        at: { mark: add-edit, offsetMs: -300 }
        cadence: natural
        target:
          file: main.go
          after: "\t\t\"playing\": {\n"
          occurrence: 1
        text: "\t\t\t\"EDIT\": \"paused\",\n"
      - id: run-transition-model
        type: runtime.run
        at: { mark: run-model, offsetMs: 200 }
        timeoutMs: 15000
      - id: expect-transition-output
        type: expect.output
        at: { afterAction: run-transition-model }
        contains: "playing + EDIT -> paused"
        timeoutMs: 6000
      - id: expect-transition-file
        type: expect.file
        at: { afterAction: run-transition-model }
        path: main.go
        contains: '"EDIT": "paused"'

  - id: state-not-pixels
    narration: >
      [[mark:show-video-page]] Compare that with a video. A video saves pixels
      and sound, so seeking shows another picture.
      [[mark:show-next-state]] Next Editor saves code, cursor, preview, slides,
      workspace, and audio. One clock restores every track to the same moment.
      [[mark:show-edit-handoff]] Edit during playback, and it pauses before
      giving the workspace to you. That's live state, not pixels.
    sources:
      - title: "Next Editor — Core Recording Model"
        url: "https://github.com/channyeintun/next-editor/blob/main/docs/core.md#recording-model"
      - title: "Next Editor — Product Hypothesis"
        url: "https://github.com/channyeintun/next-editor/blob/main/docs/agent-lesson-production.md#3-product-hypothesis"
    actions:
      - id: show-video-page
        type: whiteboard.apply
        at: { mark: show-video-page }
        open: true
        maximized: true
        upsertIds:
          [
            video-page-cover,
            video-title,
            video-card,
            video-heading,
            video-icon,
            video-data,
            video-foot,
          ]
      - id: show-next-editor-card
        type: whiteboard.apply
        at: { mark: show-next-state }
        upsertIds: [next-card, next-heading, next-tracks, next-restore, next-verbs]
      - id: show-edit-handoff
        type: whiteboard.apply
        at: { mark: show-edit-handoff }
        upsertIds: [handoff-box, handoff-text]

  - id: agent-authoring-loop
    narration: >
      [[mark:show-agent-page]] This structure gives agents a clear authoring
      surface. They start with approved sources and one lesson goal.
      [[mark:show-script]] Then they write a versioned LessonScript with marks
      and named actions. [[mark:show-performer]] The performer executes those
      actions through the real editor, without making new choices.
      [[mark:show-checks]] State, output, preview, and timing checks reject
      broken work. The agent repairs the script instead of editing pixels. A
      human reviews before publishing.
    sources:
      - title: "Next Editor — LessonScript Authoring Contract"
        url: "https://github.com/channyeintun/next-editor/blob/main/docs/lesson-script-authoring.md"
      - title: "Next Editor — Agent Lesson Production"
        url: "https://github.com/channyeintun/next-editor/blob/main/docs/agent-lesson-production.md#4-architecture-decision"
    actions:
      - id: show-agent-page
        type: whiteboard.apply
        at: { mark: show-agent-page }
        upsertIds: [agent-page-cover, agent-title, sources-box, sources-label]
      - id: show-lesson-script
        type: whiteboard.apply
        at: { mark: show-script }
        upsertIds: [agent-arrow-one, script-box, script-heading, script-body]
      - id: show-deterministic-performer
        type: whiteboard.apply
        at: { mark: show-performer }
        upsertIds: [agent-arrow-two, performer-box, performer-heading, performer-body]
      - id: show-quality-gates
        type: whiteboard.apply
        at: { mark: show-checks }
        upsertIds:
          [
            agent-arrow-three,
            checks-box,
            checks-heading,
            checks-body,
            review-arrow,
            review-ellipse,
            review-label,
            agent-rule,
          ]

checks:
  - { type: timing.p95Ms, max: 300 }
