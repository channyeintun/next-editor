    name: Next Editor State Model
    entryFilePath: main.go
    files:
      main.go: |
        package main

        import "fmt"

        func main() {
        	transitions := map[string]map[string]string{
        		"ready": {
        			"PLAY": "playing",
        		},
        		"playing": {
        			"FINISHED": "ended",
        		},
        		"paused": {
        			"PLAY": "playing",
        		},
        	}

        	state := "ready"
        	for _, event := range []string{"PLAY", "EDIT", "PLAY", "FINISHED"} {
        		next := transitions[state][event]
        		fmt.Printf("%s + %s -> %s\n", state, event, next)
        		state = next
        	}
        }
