# One idea: Next Editor records and restores meaningful application state
# instead of flattening a lesson into pixels. Three whiteboard pages explain
# the core state owners, the difference from video, and the bounded authoring
# loop for AI agents. A small Go transition table makes the state/event rule
# runnable without presenting the model as Next Editor's production code.
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/next-editor-state-machine.yaml
schemaVersion: 1

lesson:
