# AI Builder, lesson 24: security and privacy basics (Burmese, docs kind).
#
# Start state (ws/): base-docs (package.json with a no-op dev script, notes.md = "# Notes\n",
# unused) + AGENTS.md as lesson 21 leaves it (tools/binder.ts 4 1 + 4 2 = lesson 17's final file,
# with block 4 3, the Burmese-digits line, after "- One task at a time…" in ## Rules) +
# docs/security.md pinned with its title line only. Nothing runs.
# The lesson writes docs/security.md (COURSE-KIT §4.16 outline; full text here) section by section,
# one line-by-line action each (Secrets, Access, Customer data, Untrusted text, Before real
# customers), and appends ## Security to AGENTS.md after ## Simplicity (binder block 4 4, exact).
#
# Boards: (W) where a secret may live: green "the hosting's secret settings" on the left, red
# never-places on the right (code · commit, chat with the agent, screenshot, code that reaches the
# browser), the orange why; (P) prompt injection: a customer note (blue) whose last lines try to
# instruct the AI (red), the AI that only picks from the option list (violet), the result (green)
# and the rule (orange); (Z) the quiz (the agent asks for the SMS key in the chat).
#
# Build: bun ~/Documents/ai-builder-course-work/tools/build-lesson.ts template.yaml ws ai-builder-24-security-privacy.yaml
schemaVersion: 1
lesson:
  slug: ai-builder-24-security-privacy
  title: "AI Builder 24: Security နဲ့ privacy အခြေခံ"
  locale: my-MM
  workspace:
    lessonType: javascript
    name: AI Builder
    entryFilePath: docs/security.md
    sidebarStartsCollapsed: true
    files:
      AGENTS.md: |
        # AGENTS.md · Shwe Tea House pre-order app

        ## Project
        A pre-order web app for a tea shop in Yangon. Customers order ahead and pick up at the counter.
        Read docs/spec.md before any change. If the spec does not answer a question, stop and ask.

        ## Stack
        Plain HTML, CSS and JavaScript. No framework.

        ## Rules
        - Prices are whole kyat (integers). Never use decimals.
        - Customer-facing text is Burmese (Unicode).
        - Times are Asia/Yangon.
        - Ask before adding any package.
        - One task at a time. Keep each change small.
        - Accept Burmese digits (၀–၉) wherever a number is typed.

        ## Done means
        - The acceptance criteria named in the task pass.
        - Summarise what you changed and what you did not do.

        ## Simplicity
        - Choose the simplest approach that meets the spec. Explain any new file or layer.
        - No new dependency, service or abstraction without asking first.
      docs/security.md: |+
        # Security · ကြိုမှာ app

      notes.md: |
        # Notes
      package.json: |
