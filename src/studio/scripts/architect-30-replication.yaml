schemaVersion: 1

lesson:
  slug: architect-30-replication
  title: "Architect Path 30: Replication"
  locale: my-MM
  workspace:
    lessonType: javascript
    name: Architect Notebook
    entryFilePath: notebook/30-reads.md
    sidebarStartsCollapsed: true
    files:
      README.md: |
        # ခရီးဖော် · system မှတ်စု

        ခရီးဖော်က အဝေးပြေးကား လက်မှတ်ကို app ကနေ ဝယ်လို့ရအောင် လုပ်ပေးတဲ့ ကုမ္ပဏီပါ။
        ဒီ course အတွက် စိတ်ကူးနဲ့ တည်ဆောက်ထားတဲ့ ကုမ္ပဏီ ဖြစ်ပါတယ်။

        ## သုံးတဲ့သူတွေ

        - ခရီးသည်: ခရီးစဉ် ရှာတယ်၊ ထိုင်ခုံ ရွေးတယ်၊ wallet နဲ့ ငွေချေတယ်၊ လက်မှတ် ရတယ်
        - ကားလိုင်း: ခရီးစဉ်နဲ့ ဈေးနှုန်း တင်တယ်၊ ရောင်းအား ကြည့်တယ်
        - ကောင်တာ ဝန်ထမ်း: ကားဂိတ်မှာ ထိုင်ခုံ အတူတူကိုပဲ ရောင်းတယ်

        ## အခု အခြေအနေ (ကုမ္ပဏီ သက်တမ်း 5 နှစ်)

        - developer 45 ယောက်၊ team 6 ခု: Search, Booking, Payment, Settlement, Operator, Notification
        - ကားလိုင်း 300၊ တစ်ရက် လက်မှတ် 80,000 ခန့်၊ သင်္ကြန်မှာ ပုံမှန်ရဲ့ 20 ဆ
        - Booking, Payment, Notification က သီးခြား service တွေ၊ ကျန်တာက app အဟောင်းထဲမှာ
        - database: primary တစ်ခုနဲ့ read replica 2 ခု
        - service တွေကြားမှာ event stream တစ်ခု
        - အပြင်က service: wallet payment API၊ SMS gateway
      notebook/30-reads.md: |
        # Feature တစ်ခုစီ ဘယ်ကနေ ဖတ်မလဲ

        ဖြစ်ရပ်: ခရီးသည်က ငွေချေပြီး "ကိုယ့် လက်မှတ်များ" ကို ဖွင့်တော့ လက်မှတ် မပေါ်၊ ထပ်ဝယ်မိ (follower က 3 စက္ကန့် နောက်ကျနေ)

        | Feature | လက်မခံနိုင်တဲ့ anomaly | ဘယ်ကနေ ဖတ်မလဲ |
        |---|---|---|

        Feature အသစ်တိုင်း မေးဖို့: lag က မိနစ်နဲ့ချီ ကြာသွားရင် ဒီ feature မှာ ဘာဖြစ်မလဲ?
