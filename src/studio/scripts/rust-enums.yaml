scenes:
  - id: enum-slide
    chapter: သတ်မှတ်ထားတဲ့ variant တွေထဲက တစ်ခု
    narration: >-
      [[mark:show-enum]] chat app တစ်ခုမှာ user တစ်ယောက်က active ဖြစ်နေတာ ဒါမှမဟုတ် away ဖြစ်နေတာ၊
      ဒီ နှစ်မျိုးထဲက တစ်မျိုးပဲ ဖြစ်နိုင်ပါတယ်။ တခြား ဘာသာစကား အများစုမှာဆိုရင် ဒီ အခြေအနေကို စာသား
      တစ်ခုအနေနဲ့ သိမ်းပြီး၊ away ဖြစ်နေတဲ့ မိနစ်အတွက်ကတော့ သီးသန့် ကိန်းဂဏန်း တစ်ခု
      ထပ်သိမ်းရတတ်ပါတယ်။ Rust မှာတော့ ဒါထက် ပိုကောင်းတဲ့ နည်းလမ်း တစ်ခု ရှိပါတယ်၊ အဲဒါက enum ပါ။
      enum ဆိုတာ ကြိုတင် သတ်မှတ်ထားတဲ့ variant တွေထဲက တစ်ခုပဲ ဖြစ်နိုင်တဲ့ type တစ်ခုပါ။ ဒီမှာဆိုရင်
      Status တစ်ခုက Active ဒါမှမဟုတ် Away ဖြစ်ပါတယ်။ ပြီးတော့ variant တစ်ခုက data ကိုပါ သယ်ထားလို့
      ရပါတယ်။ Away က u32 တစ်ခု သိမ်းထားပြီး၊ အဲဒါက user away ဖြစ်နေတဲ့ မိနစ် အရေအတွက်ပါ။
    sources:
      - title: "The Rust Book — Defining an Enum"
        url: "https://doc.rust-lang.org/book/ch06-01-defining-an-enum.html"
    actions:
      # Shown in the quiet handle before the first word.
      - id: show-enum
        type: slide.show
        at: { mark: show-enum, offsetMs: -1500 }
        slideId: enum-slide

  - id: one-of
    narration: >-
      ဒါကို ပုံ ဆွဲပြီး ကြည့်ရအောင်။ [[mark:draw-variants]] Status တန်ဖိုး တစ်ခုက အမြဲတမ်း ဒီ
      နှစ်ခုထဲက တစ်ခုတည်းပဲ ဖြစ်ပါတယ်။ [[mark:draw-data]] ပြီးတော့ မိနစ်က Away မှာပဲ ပါတဲ့အတွက်၊
      active ဖြစ်နေတဲ့ user မှာ မိနစ် မှားပါသွားစရာ မရှိပါဘူး။ [[mark:draw-one]] ဒါက struct နဲ့
      ကွာတဲ့ အချက်ပါ။ struct တစ်ခုမှာ သူ့ field အားလုံး တစ်ပြိုင်နက် ရှိနေပေမဲ့၊ enum တစ်ခုမှာတော့
      တစ်ချိန်မှာ variant တစ်ခုပဲ ရှိပါတယ်။ [[mark:draw-busy]] ပြီးတော့ ဒီ variant စာရင်းက ပုံသေပါ။
      စာရင်းထဲ မပါတဲ့ variant တစ်ခု၊ ဥပမာအားဖြင့် Busy ကို သုံးကြည့်ရင်၊ compiler က E0599 error နဲ့
      ရပ်သွားပြီး၊ Busy ဆိုတဲ့ variant မရှိဘူးလို့ ပြောပါတယ်။ စာသားနဲ့ သိမ်းထားမယ်ဆိုရင်တော့ ဘယ်
      စာသားမဆို လက်ခံမှာ ဖြစ်လို့၊ စာလုံးပေါင်း မှားရိုက်ထားတာတောင် ဝင်သွားပြီး၊ program run
      နေချိန်ကျမှ bug ကို တွေ့ရမှာပါ။
    sources:
      - title: "The Rust Book — Defining an Enum"
        url: "https://doc.rust-lang.org/book/ch06-01-defining-an-enum.html"
      - title: "The Rust Book — Defining and Instantiating Structs"
        url: "https://doc.rust-lang.org/book/ch05-01-defining-structs.html"
      - title: "Rust error codes — E0599"
        url: "https://doc.rust-lang.org/error_codes/E0599.html"
    actions:
      - id: close-enum-slide
        type: slide.close
        at: { scene: start }
      - id: open-board-status
        type: whiteboard.apply
        at: { scene: start, offsetMs: 300 }
        open: true
        upsertIds: [b1-title]
      - id: draw-variants
        type: whiteboard.apply
        at: { mark: draw-variants }
        upsertIds: [b1-active-box, b1-active-text, b1-or, b1-away-box, b1-away-text]
        drawMs: 2000
      - id: draw-data
        type: whiteboard.apply
        at: { mark: draw-data }
        upsertIds: [b1-data-box, b1-data-text, b1-active-note, b1-away-note]
        drawMs: 1800
      - id: draw-one
        type: whiteboard.apply
        at: { mark: draw-one }
        upsertIds: [b1-one, b1-one-line]
        drawMs: 1600
      - id: draw-busy
        type: whiteboard.apply
        at: { mark: draw-busy }
        upsertIds: [b1-busy-code, b1-busy-strike, b1-busy-err]
        drawMs: 2400

  - id: define
    chapter: Enum တစ်ခု ရေးခြင်း
    narration: >-
      ကဲ၊ အခု ရေးကြည့်ရအောင်။ [[mark:type-enum]] enum keyword နဲ့ စပြီး၊ နောက်မှာ နာမည်၊ ပြီးတော့
      variant တွေကို တွန့်ကွင်းထဲမှာ comma နဲ့ ခြားပြီး ရေးပါတယ်။ အပေါ်က derive စာကြောင်းကတော့
      စွမ်းရည် နှစ်ခု ထပ်ပေးပါတယ်။ Debug ကတော့ struct lesson မှာ တွေ့ခဲ့ပြီးသားပါ၊ သူ့ကြောင့် Status
      တစ်ခုကို print ထုတ်လို့ ရပါတယ်။ PartialEq ကတော့ Status နှစ်ခုကို double equal နဲ့
      နှိုင်းယှဉ်လို့ ရအောင် လုပ်ပေးပါတယ်။ [[mark:select-away]] ပြီးတော့ Away u32 ဆိုတာက ဒီ variant
      မှာ u32 တစ်ခု ပါတယ်လို့ ပြောတာပါ။ Active မှာတော့ ဘာမှ မပါပါဘူး။
    sources:
      - title: "The Rust Book — Defining an Enum"
        url: "https://doc.rust-lang.org/book/ch06-01-defining-an-enum.html"
      - title: "The Rust Book — Derivable Traits"
        url: "https://doc.rust-lang.org/book/appendix-03-derivable-traits.html"
    actions:
      - id: close-board-status
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-main
        type: workspace.openFile
        at: { scene: start, offsetMs: 500 }
        path: main.rs
      - id: type-enum
        type: editor.type
        at: { mark: type-enum }
        target:
          file: main.rs
          after: "// Who's online in a chat app?\n\n"
          occurrence: 1
        cadence: line-by-line
        text: "#[derive(Debug, PartialEq)]

          enum Status {

          \    Active,

          \    Away(u32),

          }

          \n"
      - id: select-away
        type: editor.select
        at: { mark: select-away }
        target:
          file: main.rs
          text: "Away(u32)"
          occurrence: 1

  - id: values
    narration: >-
      [[mark:type-values]] တန်ဖိုး တစ်ခု လုပ်ချင်ရင် enum ရဲ့ နာမည်၊ colon နှစ်ခု၊ ပြီးတော့ variant
      နာမည်ကို ရေးပါတယ်။ [[mark:select-ben]] Away အတွက်ကတော့ function တစ်ခု ခေါ်သလိုပဲ မိနစ်ကို
      ကွင်းထဲမှာ ထည့်ပေးရပါတယ်။ တကယ်တော့ Away ဆိုတာ function အစစ် တစ်ခုပါ၊ u32 တစ်ခု လက်ခံပြီး
      Status တစ်ခု တည်ဆောက်ပေးပါတယ်။ ပြီးတော့ နှစ်ခုလုံးကို print ထုတ်ပါမယ်။ [[mark:type-compare]]
      မိနစ်ကလည်း တန်ဖိုးရဲ့ အစိတ်အပိုင်း တစ်ခုပါ။ ဒါကြောင့် Away 15 ဖြစ်တဲ့ ben က Away 20 နဲ့
      မတူပါဘူး။ variant က အတူတူပဲ ဖြစ်ပေမဲ့၊ data က မတူလို့ပါ။
    sources:
      - title: "The Rust Book — Enum Values"
        url: "https://doc.rust-lang.org/book/ch06-01-defining-an-enum.html#enum-values"
      - title: "std::cmp::PartialEq (derivable)"
        url: "https://doc.rust-lang.org/std/cmp/trait.PartialEq.html#derivable"
    actions:
      - id: type-values
        type: editor.type
        at: { mark: type-values, offsetMs: -300 }
        target:
          file: main.rs
          after: "fn main() {\n"
          occurrence: 1
        cadence: line-by-line
        text: "    let ana = Status::Active;

          \    let ben = Status::Away(15);

          \    println!(\"ana is {ana:?}\");

          \    println!(\"ben is {ben:?}\");\n"
      - id: select-ben
        type: editor.select
        at: { mark: select-ben }
        target:
          file: main.rs
          text: "Status::Away(15)"
          occurrence: 1
      - id: type-compare
        type: editor.type
        at: { mark: type-compare }
        target:
          file: main.rs
          after: "    println!(\"ben is {ben:?}\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "    println!(\"ben == Away(20)? {}\", ben == Status::Away(20));\n"

  - id: option-slide
    chapter: null အစား Option
    narration: >-
      [[mark:show-option]] အခု ကိုယ် အသုံးအများဆုံး ဖြစ်လာမယ့် enum တစ်ခုကို ကြည့်ရအောင်၊ အဲဒါက
      Option ပါ။ Rust မှာ null ဆိုတာ မရှိပါဘူး။ တခြား ဘာသာစကား အများစုမှာ တန်ဖိုး တစ်ခုက null
      ဖြစ်နေနိုင်ပြီး၊ စစ်ဖို့ မေ့သွားရင် program run နေချိန်ကျမှ crash ဖြစ်သွားပါတယ်။ Rust ကတော့
      တန်ဖိုး မရှိတဲ့ အခြေအနေကို type ထဲမှာပဲ ထည့်ထားလိုက်ပါတယ်။ Option တစ်ခုက တန်ဖိုး တစ်ခု
      သိမ်းထားတဲ့ Some၊ ဒါမှမဟုတ် ဘာမှ မသိမ်းထားတဲ့ None၊ ဒီ နှစ်ခုထဲက တစ်ခု ဖြစ်ပါတယ်။ ဒါက ခုနက
      Status နဲ့ ပုံစံ အတူတူပါပဲ။ T ဆိုတာကတော့ ဘယ် type မဆို ထည့်လို့ ရတဲ့ placeholder တစ်ခု
      ဖြစ်ပြီး၊ ဒါကြောင့် Option of u32 ဆိုတာ ရှိချင်မှ ရှိမယ့် u32 တစ်ခုပါ။ ပြီးတော့ အဲဒီ အခြေအနေ
      နှစ်ခုလုံးကို handle လုပ်ဖို့ compiler က ကိုယ့်ကို ခိုင်းပါတယ်။ Some နဲ့ None ကို ရေးတဲ့အခါ
      ရှေ့မှာ Option မပါဘဲ တန်းရေးလို့ ရပါတယ်။
    sources:
      - title: "The Rust Book — The Option Enum and Its Advantages Over Null Values"
        url:
          "https://doc.rust-lang.org/book/ch06-01-defining-an-enum.html#the-option-enum-and-its-advantag\
          es-over-null-values"
      - title: "std::option::Option"
        url: "https://doc.rust-lang.org/std/option/enum.Option.html"
      - title: "std::prelude"
        url: "https://doc.rust-lang.org/std/prelude/index.html"
    actions:
      - id: show-option
        type: slide.show
        at: { mark: show-option }
        slideId: option-slide

  - id: options-code
    narration: >-
      editor ထဲ ပြန်သွားရအောင်။ [[mark:type-options]] ana က active ဖြစ်နေတဲ့အတွက် away ဖြစ်ခဲ့တာ
      လုံးဝ မရှိပါဘူး၊ ဒါကြောင့် None ပါ။ ben ကတော့ 15 မိနစ် away ဖြစ်နေတာ ဖြစ်လို့ Some 15 ပါ။
      [[mark:select-option-type]] နှစ်ခုလုံးရဲ့ type က Option of u32 ဖြစ်ပြီး၊ ဒီ နှစ်ခုကိုလည်း
      print ထုတ်ပါမယ်။
    sources:
      - title: "std::option::Option"
        url: "https://doc.rust-lang.org/std/option/enum.Option.html"
    actions:
      - id: close-option-slide
        type: slide.close
        at: { scene: start }
      - id: type-options
        type: editor.type
        at: { mark: type-options }
        target:
          file: main.rs
          after: "    println!(\"ben == Away(20)? {}\", ben == Status::Away(20));\n"
          occurrence: 1
        cadence: line-by-line
        text: "

          \    let ana_away: Option<u32> = None;

          \    let ben_away: Option<u32> = Some(15);

          \    println!(\"{ana_away:?} and {ben_away:?}\");\n"
      - id: select-option-type
        type: editor.select
        at: { mark: select-option-type }
        target:
          file: main.rs
          text: "Option<u32>"
          occurrence: 1

  - id: compiler
    chapter: Compiler ရဲ့ အဖြေ
    narration: >-
      ဒါဆို ana ရဲ့ Option ကို သာမန် ကိန်းဂဏန်း တစ်ခုလို သုံးလို့ ရမလား။ [[mark:draw-broken]] u32
      တစ်ခုထဲ ထည့်ကြည့်တယ် ဆိုပါစို့။ [[mark:draw-error]] compiler က လက်မခံပါဘူး၊ E0308 error၊
      mismatched types နဲ့ ရပ်သွားပါတယ်။ သူ မျှော်လင့်ထားတာက u32 ဖြစ်ပြီး၊ တွေ့တာက Option of u32
      ဖြစ်နေလို့ပါ။ [[mark:draw-cases]] ဘာကြောင့်လဲဆိုတော့၊ Option တစ်ခုက None ဖြစ်နေနိုင်ပြီး၊ None
      ထဲမှာ ကိန်းဂဏန်း ဘာမှ မပါလို့ပါ။ [[mark:draw-fix]] ဒါကြောင့် None ဖြစ်နေရင် ဘာလုပ်ရမလဲ
      ဆိုတာကို ကိုယ်တိုင် ပြောပေးရပါမယ်။ နည်းလမ်း တစ်ခုက unwrap or ပါ။ Some ထဲမှာ တန်ဖိုး ရှိရင်
      အဲဒီ တန်ဖိုးကို ပေးပြီး၊ None ဆိုရင်တော့ ကိုယ် ထည့်ပေးလိုက်တဲ့ default တန်ဖိုးကို ပေးပါတယ်။
    sources:
      - title: "Rust error codes — E0308"
        url: "https://doc.rust-lang.org/error_codes/E0308.html"
      - title: "The Rust Book — The Option Enum and Its Advantages Over Null Values"
        url:
          "https://doc.rust-lang.org/book/ch06-01-defining-an-enum.html#the-option-enum-and-its-advantag\
          es-over-null-values"
      - title: "std::option::Option::unwrap_or"
        url: "https://doc.rust-lang.org/std/option/enum.Option.html#method.unwrap_or"
    actions:
      - id: open-board-option
        type: whiteboard.apply
        at: { scene: start }
        open: true
        clear: true
        upsertIds: [b2-title]
      - id: draw-broken
        type: whiteboard.apply
        at: { mark: draw-broken }
        upsertIds: [b2-code-a, b2-code-b]
        drawMs: 1400
      - id: draw-error
        type: whiteboard.apply
        at: { mark: draw-error }
        upsertIds: [b2-underline, b2-err, b2-exp]
        drawMs: 2400
      - id: draw-cases
        type: whiteboard.apply
        at: { mark: draw-cases }
        upsertIds: [b2-some-box, b2-some-text, b2-or, b2-none-box, b2-none-text, b2-none-note]
        drawMs: 2400
      - id: draw-fix
        type: whiteboard.apply
        at: { mark: draw-fix }
        upsertIds: [b2-fix, b2-arrow, b2-result]
        drawMs: 2000

  - id: fix
    narration: >-
      [[mark:type-fix]] ဒါကို code ထဲမှာ လုပ်ကြည့်ရအောင်။ minutes က အရင်လိုပဲ u32 ပါ၊ ဒါပေမဲ့
      ဒီတစ်ခါ ana ရဲ့ Option ပေါ်မှာ unwrap or ကို ခေါ်ပြီး၊ default အနေနဲ့ 0 ထည့်ပေးလိုက်ပါတယ်။
      [[mark:select-unwrap]] unwrap or က Some ရော None ရော နှစ်ခုလုံးကို handle လုပ်ပေးတဲ့အတွက်၊
      minutes က သာမန် u32 တစ်ခု ဖြစ်သွားပါပြီ။ [[mark:type-print]] ပြီးတော့ အဲဒါကို print ထုတ်ပါမယ်။
    sources:
      - title: "std::option::Option::unwrap_or"
        url: "https://doc.rust-lang.org/std/option/enum.Option.html#method.unwrap_or"
    actions:
      - id: close-board-option
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: type-fix
        type: editor.type
        at: { mark: type-fix, offsetMs: 400 }
        target:
          file: main.rs
          after: "    println!(\"{ana_away:?} and {ben_away:?}\");\n"
          occurrence: 1
        cadence: fast-explainer
        text: "

          \    let minutes: u32 = ana_away.unwrap_or(0);\n"
      - id: select-unwrap
        type: editor.select
        at: { mark: select-unwrap }
        target:
          file: main.rs
          text: "unwrap_or(0)"
          occurrence: 1
      - id: type-print
        type: editor.type
        at: { mark: type-print }
        target:
          file: main.rs
          after: "    let minutes: u32 = ana_away.unwrap_or(0);\n"
          occurrence: 1
        cadence: line-by-line
        text: "    println!(\"ana: {minutes} min away\");\n"

  - id: run
    narration: >-
      [[mark:run]] ကဲ၊ run ကြည့်ရအောင်။ ana က Active ဖြစ်ပြီး၊ ben က Away 15 ပါ။ ben ကို Away 20 နဲ့
      နှိုင်းယှဉ်တော့ false ထွက်ပါတယ်။ ပြီးတော့ None နဲ့ Some 15 ပါ။ နောက်ဆုံး စာကြောင်းမှာတော့
      unwrap or က ana ရဲ့ None ကို 0 မိနစ် ဖြစ်သွားအောင် ပြောင်းပေးလိုက်တာကို မြင်ရပါတယ်။
    sources:
      - title: "The Rust Book — Defining an Enum"
        url: "https://doc.rust-lang.org/book/ch06-01-defining-an-enum.html"
      - title: "std::option::Option"
        url: "https://doc.rust-lang.org/std/option/enum.Option.html"
    actions:
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "ben == Away(20)? false"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: "let minutes: u32 = ana_away.unwrap_or(0);"

  - id: wrap
    narration: >-
      ဒါဆို ပြန်ချုပ်ရရင်၊ enum ဆိုတာ ကြိုတင် သတ်မှတ်ထားတဲ့ variant တွေထဲက တစ်ခု ဖြစ်တဲ့ type တစ်ခု
      ဖြစ်ပြီး၊ variant တစ်ခုက data ကိုပါ သယ်ထားလို့ ရပါတယ်။ Option ကတော့ null အစား Rust က သုံးတဲ့
      enum ဖြစ်ပြီး၊ None ကို handle လုပ်ဖို့ compiler က ကိုယ့်ကို ခိုင်းပါတယ်။ နောက် lesson မှာတော့
      pattern matching၊ ဆိုလိုတာက match နဲ့ variant တစ်ခုချင်းစီအတွက် မတူတဲ့ code ကို ဘယ်လို run လဲ၊
      ပြီးတော့ အထဲက data ကို ဘယ်လို ပြန်ထုတ်ယူလဲ ဆိုတာကို ကြည့်သွားပါမယ်။
    sources:
      - title: "The Rust Book — Enums and Pattern Matching"
        url: "https://doc.rust-lang.org/book/ch06-00-enums.html"
      - title: "The Rust Book — The match Control Flow Construct"
        url: "https://doc.rust-lang.org/book/ch06-02-match.html"
    actions: []

checks:
  # 500 (not 300): google-svg deck slides embed per-slide font data whose
  # paint briefly stalls the main thread at each show/close.
  - { type: timing.p95Ms, max: 500 }
