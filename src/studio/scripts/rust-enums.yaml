build:
  voiceProfile: pocket-alba-v1
  seed: 43

runtime:
  kind: rust-playground
  defaultMode: fixture
  fixture:
    latencyMs: 600
    result:
      status: success
      stdout: "ana is Active\nben is Away(15)\nben == Away(20)? false\nNone and Some(15)\nana: 0 min away\n"
      stderr: ""

scenes:
  - id: enum-slide
    chapter: One of a fixed set
    narration: >
      [[mark:show-enum]] A user in a chat app is either active, or away. In
      many languages, you'd store that as a string, plus a separate number
      for the minutes. Rust has a better tool, the enum. It's a type that's
      one of a fixed set of variants. Here, a Status is Active, or it's Away.
      And a variant can carry data. Away holds a u32, the minutes the user's
      been away.
    sources:
      - title: "The Rust Book — Defining an Enum"
        url: "https://doc.rust-lang.org/book/ch06-01-defining-an-enum.html"
    actions:
      # Shown in the quiet handle before the first word.
      - id: show-enum
        type: slide.show
        at: { mark: show-enum, offsetMs: -1500 }
        slideId: enum-slide

  - id: one-of
    narration: >
      Let's draw it. [[mark:draw-variants]] A Status value is always exactly
      one of these two. [[mark:draw-data]] And only Away has minutes, so an
      active user can't have minutes by mistake. [[mark:draw-one]] That's the
      difference from a struct. A struct holds all its fields at once. An
      enum holds one variant at a time. [[mark:draw-busy]] The list is also
      fixed. Try a variant that isn't in the list, like Busy, and the
      compiler stops you with error E0599: there's no variant named Busy. A
      string would accept any text, even a typo, and you'd only find the bug
      while the program runs.
    sources:
      - title: "The Rust Book — Defining an Enum"
        url: "https://doc.rust-lang.org/book/ch06-01-defining-an-enum.html"
      - title: "The Rust Book — Defining and Instantiating Structs"
        url: "https://doc.rust-lang.org/book/ch05-01-defining-structs.html"
      - title: "Rust error codes — E0599"
        url: "https://doc.rust-lang.org/error_codes/E0599.html"
    actions:
      - id: close-enum-slide
        type: slide.close
        at: { scene: start }
      - id: open-board-status
        type: whiteboard.apply
        at: { scene: start, offsetMs: 300 }
        open: true
        upsertIds: [b1-title]
      - id: draw-variants
        type: whiteboard.apply
        at: { mark: draw-variants }
        upsertIds: [b1-active-box, b1-active-text, b1-or, b1-away-box, b1-away-text]
        drawMs: 2000
      - id: draw-data
        type: whiteboard.apply
        at: { mark: draw-data }
        upsertIds: [b1-data-box, b1-data-text, b1-active-note, b1-away-note]
        drawMs: 1800
      - id: draw-one
        type: whiteboard.apply
        at: { mark: draw-one }
        upsertIds: [b1-one, b1-one-line]
        drawMs: 1600
      - id: draw-busy
        type: whiteboard.apply
        at: { mark: draw-busy }
        upsertIds: [b1-busy-code, b1-busy-strike, b1-busy-err]
        drawMs: 2400

  - id: define
    chapter: Writing an enum
    narration: >
      Now let's write it. [[mark:type-enum]] The enum keyword, the name, then
      the variants in curly braces, with commas between them. The derive line
      adds two abilities. Debug, which you saw with structs, lets us print a
      Status. PartialEq lets us compare two of them with double equals.
      [[mark:select-away]] And Away(u32) says this variant carries one u32.
      Active carries nothing.
    sources:
      - title: "The Rust Book — Defining an Enum"
        url: "https://doc.rust-lang.org/book/ch06-01-defining-an-enum.html"
      - title: "The Rust Book — Derivable Traits"
        url: "https://doc.rust-lang.org/book/appendix-03-derivable-traits.html"
    actions:
      - id: close-board-status
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-main
        type: workspace.openFile
        at: { scene: start, offsetMs: 500 }
        path: main.rs
      - id: type-enum
        type: editor.type
        at: { mark: type-enum }
        target:
          file: main.rs
          after: "// Who's online in a chat app?\n\n"
          occurrence: 1
        cadence: line-by-line
        text: "#[derive(Debug, PartialEq)]\nenum Status {\n    Active,\n    Away(u32),\n}\n\n"
      - id: select-away
        type: editor.select
        at: { mark: select-away }
        target:
          file: main.rs
          text: "Away(u32)"
          occurrence: 1

  - id: values
    narration: >
      [[mark:type-values]] To make a value, write the enum's name, two colons,
      and the variant. [[mark:select-ben]] For Away, you pass the minutes in
      parentheses, like a function call. In fact, Away really is a function:
      it takes a u32 and builds a Status. Then we print both.
      [[mark:type-compare]] The minutes are part of the value, too. So ben,
      which is Away(15), isn't equal to Away(20). Same variant, different
      data.
    sources:
      - title: "The Rust Book — Enum Values"
        url: "https://doc.rust-lang.org/book/ch06-01-defining-an-enum.html#enum-values"
      - title: "std::cmp::PartialEq (derivable)"
        url: "https://doc.rust-lang.org/std/cmp/trait.PartialEq.html#derivable"
    actions:
      - id: type-values
        type: editor.type
        at: { mark: type-values, offsetMs: -300 }
        target:
          file: main.rs
          after: "fn main() {\n"
          occurrence: 1
        cadence: line-by-line
        text: "    let ana = Status::Active;\n    let ben = Status::Away(15);\n    println!(\"ana is {ana:?}\");\n    println!(\"ben is {ben:?}\");\n"
      - id: select-ben
        type: editor.select
        at: { mark: select-ben }
        target:
          file: main.rs
          text: "Status::Away(15)"
          occurrence: 1
      - id: type-compare
        type: editor.type
        at: { mark: type-compare }
        target:
          file: main.rs
          after: "    println!(\"ben is {ben:?}\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "    println!(\"ben == Away(20)? {}\", ben == Status::Away(20));\n"

  - id: option-slide
    chapter: Option instead of null
    narration: >
      [[mark:show-option]] Now, an enum you'll use very often: Option. Rust
      has no null. In many languages, a value can be null, and if you forget
      to check, the program crashes while it's running. Rust puts the missing
      case into the type instead. An Option is either Some, holding a value,
      or None, holding nothing. That's the same shape as our Status.
      [[mark:option-t]] The T is a placeholder for any type, so an Option of
      u32 is a u32 that might be missing. And the compiler makes you handle
      both cases. You can write Some and None on their own, without Option
      in front.
    sources:
      - title: "The Rust Book — The Option Enum and Its Advantages Over Null Values"
        url: "https://doc.rust-lang.org/book/ch06-01-defining-an-enum.html#the-option-enum-and-its-advantages-over-null-values"
      - title: "std::option::Option"
        url: "https://doc.rust-lang.org/std/option/enum.Option.html"
      - title: "std::prelude"
        url: "https://doc.rust-lang.org/std/prelude/index.html"
    actions:
      - id: show-option
        type: slide.show
        at: { mark: show-option }
        slideId: option-slide

  - id: options-code
    narration: >
      Back in the editor. [[mark:type-options]] Ana's active, so she hasn't
      been away at all. That's None. Ben's been away fifteen minutes, so
      that's Some(15). [[mark:select-option-type]] Both have the type Option
      of u32, and we print them too.
    sources:
      - title: "std::option::Option"
        url: "https://doc.rust-lang.org/std/option/enum.Option.html"
    actions:
      - id: close-option-slide
        type: slide.close
        at: { scene: start }
      - id: type-options
        type: editor.type
        at: { mark: type-options }
        target:
          file: main.rs
          after: "    println!(\"ben == Away(20)? {}\", ben == Status::Away(20));\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n    let ana_away: Option<u32> = None;\n    let ben_away: Option<u32> = Some(15);\n    println!(\"{ana_away:?} and {ben_away:?}\");\n"
      - id: select-option-type
        type: editor.select
        at: { mark: select-option-type }
        target:
          file: main.rs
          text: "Option<u32>"
          occurrence: 1

  - id: compiler
    chapter: The compiler's answer
    narration: >
      So can you use Ana's Option as a plain number? [[mark:draw-broken]]
      Let's say you put it in a u32. [[mark:draw-error]] The compiler refuses,
      with error E0308, mismatched types. It expected a u32, and found an
      Option of u32. [[mark:draw-cases]] Here's why. An Option might be
      None, and None has no number inside. [[mark:draw-fix]] So you have to
      say what happens in the None case. One way is unwrap_or. It gives you
      the value inside Some, or the default you pass it.
    sources:
      - title: "Rust error codes — E0308"
        url: "https://doc.rust-lang.org/error_codes/E0308.html"
      - title: "The Rust Book — The Option Enum and Its Advantages Over Null Values"
        url: "https://doc.rust-lang.org/book/ch06-01-defining-an-enum.html#the-option-enum-and-its-advantages-over-null-values"
      - title: "std::option::Option::unwrap_or"
        url: "https://doc.rust-lang.org/std/option/enum.Option.html#method.unwrap_or"
    actions:
      - id: open-board-option
        type: whiteboard.apply
        at: { scene: start }
        open: true
        clear: true
        upsertIds: [b2-title]
      - id: draw-broken
        type: whiteboard.apply
        at: { mark: draw-broken }
        upsertIds: [b2-code-a, b2-code-b]
        drawMs: 1400
      - id: draw-error
        type: whiteboard.apply
        at: { mark: draw-error }
        upsertIds: [b2-underline, b2-err, b2-exp]
        drawMs: 2400
      - id: draw-cases
        type: whiteboard.apply
        at: { mark: draw-cases }
        upsertIds: [b2-some-box, b2-some-text, b2-or, b2-none-box, b2-none-text, b2-none-note]
        drawMs: 2400
      - id: draw-fix
        type: whiteboard.apply
        at: { mark: draw-fix }
        upsertIds: [b2-fix, b2-arrow, b2-result]
        drawMs: 2000

  - id: fix
    narration: >
      [[mark:type-fix]] Let's do that in code. Again, minutes is a u32,
      but this time we call unwrap_or on Ana's Option, with a default of zero.
      [[mark:select-unwrap]] unwrap_or handles both cases, so minutes is a
      plain u32. [[mark:type-print]] Then we print it.
    sources:
      - title: "std::option::Option::unwrap_or"
        url: "https://doc.rust-lang.org/std/option/enum.Option.html#method.unwrap_or"
    actions:
      - id: close-board-option
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: type-fix
        type: editor.type
        at: { mark: type-fix, offsetMs: 400 }
        target:
          file: main.rs
          after: "    println!(\"{ana_away:?} and {ben_away:?}\");\n"
          occurrence: 1
        cadence: fast-explainer
        text: "\n    let minutes: u32 = ana_away.unwrap_or(0);\n"
      - id: select-unwrap
        type: editor.select
        at: { mark: select-unwrap }
        target:
          file: main.rs
          text: "unwrap_or(0)"
          occurrence: 1
      - id: type-print
        type: editor.type
        at: { mark: type-print }
        target:
          file: main.rs
          after: "    let minutes: u32 = ana_away.unwrap_or(0);\n"
          occurrence: 1
        cadence: line-by-line
        text: "    println!(\"ana: {minutes} min away\");\n"

  - id: run
    narration: >
      [[mark:run]] Let's run it. ana is Active, and ben is Away(15).
      Comparing ben with Away(20) gives false. Then None, and Some(15). And
      unwrap_or turned Ana's None into zero minutes.
    sources:
      - title: "The Rust Book — Defining an Enum"
        url: "https://doc.rust-lang.org/book/ch06-01-defining-an-enum.html"
      - title: "std::option::Option"
        url: "https://doc.rust-lang.org/std/option/enum.Option.html"
    actions:
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "ben == Away(20)? false"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: "let minutes: u32 = ana_away.unwrap_or(0);"

  - id: wrap
    narration: >
      So an enum is a type that's one of a fixed set of variants, and a
      variant can carry data. Option is the enum Rust uses instead of null,
      and the compiler makes you handle None. Next, match: how to run
      different code for each variant, and get the data back out.
    sources:
      - title: "The Rust Book — Enums and Pattern Matching"
        url: "https://doc.rust-lang.org/book/ch06-00-enums.html"
      - title: "The Rust Book — The match Control Flow Construct"
        url: "https://doc.rust-lang.org/book/ch06-02-match.html"
    actions: []

checks:
  # 500 (not 300): google-svg deck slides embed per-slide font data whose
  # paint briefly stalls the main thread at each show/close.
  - { type: timing.p95Ms, max: 500 }
