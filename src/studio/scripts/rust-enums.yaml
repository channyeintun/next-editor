# Rust from zero, lesson 10: enums and Option.
#
# The arc: the deck page "Enums" introduces a Status that is Active or
# Away(u32); a whiteboard draws the idea (exactly one variant at a time, data
# only where a variant has it, a fixed list — Status::Busy is E0599). The
# editor builds the enum, two values, and an equality check that shows the
# data is part of the value. The deck page "Option<T> — no null" introduces
# Option; the editor adds None / Some(15); a second board shows what the
# compiler says when you use an Option<u32> as a u32 (E0308) and the fix,
# unwrap_or, which the editor then types. One run at the end. match is the
# NEXT lesson, so this one never takes data back out of a variant.
#
# Why PartialEq: a variant field that is only ever printed through a derived
# Debug impl raises "field `0` is never read" (derived Debug is ignored by the
# dead-code lint), and the live console must stay warning-free. Comparing
# `ben == Status::Away(20)` reads the field honestly and teaches that the
# data is part of the value.
#
# Compiler errors on the boards, confirmed with rustc 1.98 (edition 2024) on
# broken variants of the final program:
#   let ben = Status::Busy;
#     error[E0599]: no variant, associated function, or constant named `Busy`
#     found for enum `Status` in the current scope   (board: shortened with …)
#   let minutes: u32 = ana_away;
#     error[E0308]: mismatched types
#     expected `u32`, found `Option<u32>`
#
# Board colours: blue = the variants (the things being named), orange = the
# data a variant carries / the None caveat, green = what's valid and the fix,
# red = the errors, violet = the result. #1e1e1e paints white on the dark board.
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/rust-enums.yaml
