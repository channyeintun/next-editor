      find method က ရှာမတွေ့ရင် undefined ကို ပြန်ပေးလို့ပါ။ ဒါကို မစစ်ဘဲ ဈေးနှုန်းကို ဖတ်ရင်၊ menu ထဲမှာ
      ကော်ဖီ မရှိတဲ့ နေ့မှာ program ရပ်သွားမှာပါ။ [[mark:type-guard]] ဒါကြောင့် ရှာမတွေ့ရင် ရှင်းရှင်းလင်းလင်း
      error ကို throw လုပ်ပေးမယ့် စစ်ဆေးချက် တစ်ကြောင်း ထည့်ပါမယ်။ ဒီ line ကို ကျော်လာရင် coffee က undefined
      မဟုတ်တော့ဘူးလို့ TypeScript က narrow လုပ်ပေးပါတယ်။ [[mark:read-guard-fixed]] error ခြောက်ခု ကျန်ပါပြီ။
      optional chaining နဲ့လည်း ပြင်လို့ ရပေမယ့်၊ ဈေးနှုန်းက
      undefined ဖြစ်နိုင်တာကို နောက်က
      code တွေဆီ ဆက်ပို့သွားမှာပါ။
