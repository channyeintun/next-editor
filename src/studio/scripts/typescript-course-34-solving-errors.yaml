      ဒါကြောင့် အောက်ဆုံး အပိုင်းကနေ ဖတ်ပါ။ null ကို string ထဲ ထည့်လို့ မရဘူးလို့ ပြနေပြီး၊ သူ့အပေါ်က အပိုင်းက
