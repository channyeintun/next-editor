      မထည့်ထားဘူးလို့ ပြောပါတယ်။ [[mark:read-crash]] Output ကို ကြည့်ပါ။ မီးဖိုချောင်ထဲကို အော်ဒါ ထည့်တဲ့အခါ
      queue က undefined ဖြစ်နေလို့၊ အနီရောင် error နဲ့ program ရပ်သွားပါတယ်။ [[mark:type-init]] ဒါကြောင့်
      queue ကို ဗလာ array နဲ့ စပေးပါမယ်။ [[mark:read-init-fixed]] error သုံးခု ကျန်ပြီး၊ Output မှာ
      မီးဖိုချောင်ထဲက လက်ဖက်ရည်နဲ့ ကျသင့်ငွေ line ပေါ်လာပါပြီ။ နာမည်နောက်မှာ exclamation mark ထည့်ပြီး
      error ကို ပိတ်လို့လည်း ရပေမယ့်၊ တခြား နေရာကနေ တန်ဖိုး တကယ် ထည့်ပေးမယ်လို့ သေချာမှပဲ သုံးပါ။
    sources:
      - {
          title: "Total TypeScript: Solving TypeScript Errors (property has no initializer)",
          url: "https://www.totaltypescript.com/tutorials/solving-typescript-errors",
        }
      - {
          title: "TSConfig reference: strictPropertyInitialization",
          url: "https://www.typescriptlang.org/tsconfig/#strictPropertyInitialization",
        }
      - {
          title: "TypeScript Handbook: Classes (field initialization, definite assignment)",
          url: "https://www.typescriptlang.org/docs/handbook/2/classes.html#--strictpropertyinitialization",
        }
    actions:
      - id: select-queue
        type: editor.select
        at: { mark: select-queue }
        target: { file: src/shop.ts, text: "  queue: string[];", occurrence: 1 }
      - id: type-init
        type: editor.type
        at: { mark: type-init }
        target: { file: src/shop.ts, after: "  queue: string[]", occurrence: 1 }
        text: " = []"
      - id: expect-three
        type: expect.preview
        at: { afterAction: type-init }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "3" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-kitchen-line
        type: expect.preview
        at: { afterAction: expect-three }
        timeoutMs: 8000
        target: { by: testId, value: ts-out-1 }
        textContains: "မီးဖိုချောင်: [ 'လက်ဖက်ရည်' ]"
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-glued-total
        type: expect.preview
        at: { afterAction: expect-kitchen-line }
        timeoutMs: 8000
        target: { by: testId, value: ts-out-2 }
        textContains: "မောင်မောင် ကျသင့်ငွေ 3300500 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 1200 }

  - id: conversion
    narration: >
      ဒါပေမဲ့ ကျသင့်ငွေကို ကြည့်ပါ။ ၃၃၀၀ နဲ့ ၅၀၀ ကို ပေါင်းမယ့်အစား၊ စာသား ဆက်သလို ၃၃၀၀ နောက်မှာ ၅၀၀
      ကပ်သွားပါတယ်။ [[mark:select-as]] ဒါက နောက် error နဲ့ ဆိုင်ပါတယ်။ string နဲ့ number မှာ
      တူတဲ့ တန်ဖိုး တစ်ခုမှ မရှိလို့၊ string ကို number လို့
      as နဲ့ ပြောထားတာ မှားနိုင်တယ်လို့ သတိပေးနေတာပါ။ [[mark:explain-as]] as က
      TypeScript ကို ယုံခိုင်းရုံပဲ ဖြစ်ပြီး၊ runtime မှာ တန်ဖိုးကို မပြောင်းပါဘူး။ message က အကြံပေးသလို
      unknown ကို အရင် ပြောင်းရင်လည်း error ပဲ ပျောက်ပြီး bug က ကျန်နေမှာပါ။ [[mark:type-as-comment]]
      ဒါကြောင့် အဟောင်းကို comment ပိတ်ပြီး၊ Number function နဲ့ တကယ် ပြောင်းတဲ့ line ကို ရေးပါမယ်။
      [[mark:read-number-fixed]] error နှစ်ခု ကျန်ပြီး၊ ကျသင့်ငွေက ၃၈၀၀ ကျပ် ဖြစ်သွားပါပြီ။
    sources:
      - {
          title: "Total TypeScript: Solving TypeScript Errors (conversion of type may be a mistake)",
          url: "https://www.totaltypescript.com/tutorials/solving-typescript-errors",
        }
      - {
          title: "Total TypeScript Essentials, ch. 11: Annotations and Assertions",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/annotations-and-assertions",
        }
      - {
          title: "TypeScript Handbook: Everyday Types (type assertions)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#type-assertions",
        }
      - {
          title: "MDN: Number() converts a string to a number",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Number/Number",
        }
    actions:
      - id: select-as
        type: editor.select
        at: { mark: select-as }
        target: { file: src/shop.ts, text: "tipText as number", occurrence: 1 }
      - id: type-as-comment
        type: editor.type
        at: { mark: type-as-comment }
        target: { file: src/shop.ts, after: "const tipText = \"500\";\n", occurrence: 1 }
        text: "// "
        cadence: fast-explainer
      - id: type-number-line
        type: editor.type
        at: { afterAction: type-as-comment }
        target:
          { file: src/shop.ts, after: "export const tip = tipText as number;\n", occurrence: 1 }
        text: "export const tip = Number(tipText);\n"
        cadence: block
      - id: expect-two
        type: expect.preview
        at: { afterAction: type-number-line }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-right-total
        type: expect.preview
        at: { afterAction: expect-two }
        timeoutMs: 8000
        target: { by: testId, value: ts-out-2 }
        textContains: "မောင်မောင် ကျသင့်ငွေ 3800 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 1200 }

  - id: declaration
    chapter: "ဖိုင်နဲ့ module error တွေ"
    narration: >
      [[mark:open-main]] နောက် error က main ဖိုင်ကပါ။ [[mark:select-receipt]] program အဟောင်းက receipt ဆိုတဲ့
      JavaScript ဖိုင်အတွက် declaration file ရှာမတွေ့လို့၊ သူ့ထဲက အရာတွေ any ဖြစ်နေမယ်လို့ ပြောပါတယ်။
      [[mark:explain-dts]] npm package ဆိုရင် သူ့ရဲ့ types package ကို ထပ်ထည့်တာ ဒါမှမဟုတ် declare module နဲ့
      ကြေညာတာနဲ့ ပြင်ပါတယ်။ ကိုယ့် project ထဲက JavaScript ဖိုင် ဆိုရင်တော့ ဘေးမှာ declaration file ရေးတာ
      ဒါမှမဟုတ် TypeScript ကို JavaScript ဖိုင်ပါ ဖတ်ခိုင်းတာနဲ့ ပြင်ပါတယ်။ [[mark:open-tsconfig]] ဒီမှာ ဒုတိယ
      နည်းကို သုံးပါမယ်။ [[mark:type-allowjs]] tsconfig ထဲမှာ allow JS ကို ဖွင့်လိုက်ရင်၊ JavaScript
      ဖိုင်တွေကိုပါ TypeScript က ထည့်ဖတ်ပါတယ်။ [[mark:read-allowjs-fixed]] error တစ်ခုပဲ ကျန်ပါတော့တယ်။
      [[mark:type-receipt-query]] ဒါပေမဲ့ receipt function ကို query comment နဲ့ စစ်ကြည့်ရအောင်။
      [[mark:read-receipt-type]] Types မှာ parameter နှစ်ခုလုံး any ဖြစ်နေပါတယ်။ JavaScript
      ဖိုင်ထဲမှာ type မရေးထားလို့ပါ။ တကယ် စစ်ပေးစေချင်ရင် declaration file ဒါမှမဟုတ် JSDoc နဲ့
      type ပေးရပါမယ်။
    sources:
      - {
          title: "Total TypeScript: Solving TypeScript Errors (could not find a declaration file for module)",
          url: "https://www.totaltypescript.com/tutorials/solving-typescript-errors",
        }
      - {
          title: "Total TypeScript Essentials, ch. 13: Modules, Scripts and Declaration Files",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/modules-scripts-and-declaration-files",
        }
      - {
          title: "TSConfig reference: allowJs",
          url: "https://www.typescriptlang.org/tsconfig/#allowJs",
        }
      - {
          title: "TypeScript Handbook: Type Checking JavaScript Files",
          url: "https://www.typescriptlang.org/docs/handbook/type-checking-javascript-files.html",
        }
    actions:
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: src/main.ts
      - id: select-receipt
        type: editor.select
        at: { mark: select-receipt }
        target: { file: src/main.ts, text: '"./receipt.js"', occurrence: 1 }
      - id: open-tsconfig
        type: workspace.openFile
        at: { mark: open-tsconfig }
        path: tsconfig.json
      - id: type-allowjs
        type: editor.type
        at: { mark: type-allowjs }
        target: { file: tsconfig.json, after: "  \"compilerOptions\": {\n", occurrence: 1 }
        text: "    \"allowJs\": true,\n"
        cadence: block
      - id: expect-one
        type: expect.preview
        at: { afterAction: type-allowjs }
        timeoutMs: 10000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 800 }
      - id: expect-status-left
        type: expect.preview
        at: { afterAction: expect-one }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-code, value: "2451" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: open-main-2
        type: workspace.openFile
        at: { mark: type-receipt-query }
        path: src/main.ts
      - id: type-receipt-query
        type: editor.type
        at: { afterAction: open-main-2 }
        target:
          { file: src/main.ts, after: "printReceipt(customer.name, total + tip);\n", occurrence: 1 }
        text: "// ^?\n"
        cadence: fast-explainer
      - id: expect-receipt-any
        type: expect.preview
        at: { afterAction: type-receipt-query }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        textContains: "printReceipt(name: any, amount: any): void"
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: redeclare
    narration: >
      [[mark:open-status]] နောက်ဆုံး error ကို ကြည့်ရအောင်။ [[mark:select-status]] status ဆိုတဲ့ variable ကို
      ထပ်ကြေညာလို့ မရဘူးလို့ ပြောပေမယ့်၊ ဒီ ဖိုင်မှာ တစ်ခါပဲ ကြေညာထားပါတယ်။ ဖိုင်မှာ import ရော export ပါ
      မပါလို့ module မဟုတ်ဘဲ script ဖြစ်နေတာ ပြဿနာပါ။ script တွေက global scope တစ်ခုတည်းကို မျှသုံးကြပြီး၊
      browser ရဲ့ type တွေထဲမှာ status ဆိုတဲ့ global variable ရှိပြီးသား ဖြစ်နေလို့ပါ။ [[mark:type-export]]
      ဒါကြောင့် status ကို export လုပ်ပြီး ဖိုင်ကို module ဖြစ်အောင် လုပ်ပါမယ်။ [[mark:read-zero]] error
      ကိုးခုကနေ သုည ဖြစ်သွားပါပြီ။ ဖိုင်တိုင်းကို module လို့ သတ်မှတ်ချင်ရင်တော့ tsconfig ရဲ့ module detection
      ကို force လို့ ပေးနိုင်ပါတယ်။
    sources:
      - {
          title: "Total TypeScript: Solving TypeScript Errors (cannot redeclare block-scoped variable)",
          url: "https://www.totaltypescript.com/tutorials/solving-typescript-errors",
        }
      - {
          title: "Total TypeScript Essentials, ch. 13: Modules, Scripts and Declaration Files",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/modules-scripts-and-declaration-files",
        }
      - {
          title: "TSConfig reference: moduleDetection",
          url: "https://www.typescriptlang.org/tsconfig/#moduleDetection",
        }
    actions:
      - id: open-status
        type: workspace.openFile
        at: { mark: open-status }
        path: src/status.ts
      - id: select-status
        type: editor.select
        at: { mark: select-status }
        target: { file: src/status.ts, text: "const status", occurrence: 1 }
      - id: type-export
        type: editor.type
        at: { mark: type-export }
        target: { file: src/status.ts, after: "// ဆိုင်ရဲ့ အခြေအနေ\n", occurrence: 1 }
        text: "export "
      - id: expect-zero
        type: expect.preview
        at: { afterAction: type-export }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-final-output
        type: expect.preview
        at: { afterAction: expect-zero }
        timeoutMs: 8000
        target: { by: testId, value: ts-output }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 1200 }

  - id: course-recap
    chapter: "Course ကို ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:board-recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ error တိုင်းမှာ နေရာ၊ ပေးလိုက်တဲ့ type နဲ့ မျှော်လင့်ထားတဲ့
      type ကို ဖတ်ပါ။ error ရှည်ရင် အောက်ဆုံးကနေ ဖတ်ပြီး၊ တန်ဖိုး မှားတာလား type မှားတာလား ဆုံးဖြတ်ပြီးမှ ပြင်ပါ။ as နဲ့ ဖြစ်ဖြစ်၊ exclamation
      mark နဲ့ ဖြစ်ဖြစ် error ကို ပိတ်တာက bug ကို မပြင်ပါဘူး။ [[mark:draw-modules-1]] course တစ်ခုလုံးကို
      ပြန်ကြည့်ရင်၊ TypeScript ဆိုတာ ဘာလဲ ဆိုတာနဲ့ နေ့စဉ် သုံးတဲ့ type တွေကနေ စခဲ့ပါတယ်။
      [[mark:draw-modules-2]] ပြီးတော့ union နဲ့ narrowing ရယ်၊ object တွေ ရယ်၊ read only ရယ်၊ class တွေ
      ရယ်ကို ကြည့်ခဲ့ပါတယ်။ [[mark:draw-modules-3]] အလယ်ပိုင်းမှာ type ထုတ်ယူတာ၊ assertion တွေနဲ့ module
      တွေကို လေ့လာခဲ့ပါတယ်။ [[mark:draw-modules-4]] နောက်ပိုင်းမှာတော့ generic type တွေ၊ generic function တွေနဲ့ ကိုယ့် type တွေကို
      ကိုယ်တိုင် ဒီဇိုင်း လုပ်ခဲ့ပြီး၊ Zod ရယ်၊ React ရယ်၊ ဒီနေ့ error တွေ ရယ်နဲ့ လက်တွေ့ သုံးပုံကို
      ကြည့်ခဲ့ပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials (the course follows its chapter order)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials",
        }
      - {
          title: "TypeScript Handbook",
          url: "https://www.typescriptlang.org/docs/handbook/intro.html",
        }
    actions:
      # Board A (how to read an error) comes back for the first recap sentences; the course board
      # replaces it when the narration turns to the modules.
      - id: open-board-b
        type: whiteboard.apply
        at: { mark: board-recap }
        open: true
      - id: draw-modules-1
        type: whiteboard.apply
        at: { mark: draw-modules-1 }
        clear: true
        upsertIds: [b-title, b-m1, b-m2]
        drawMs: 1400
      - id: draw-modules-2
        type: whiteboard.apply
        at: { mark: draw-modules-2 }
        upsertIds: [b-m3, b-m4, b-m5, b-m6]
        drawMs: 2400
      - id: draw-modules-3
        type: whiteboard.apply
        at: { mark: draw-modules-3 }
        upsertIds: [b-m7, b-m8, b-m9]
        drawMs: 1800
      - id: draw-modules-4
        type: whiteboard.apply
        at: { mark: draw-modules-4 }
        upsertIds: [b-m10, b-m11, b-m12]
        drawMs: 1800
      - id: expect-file-size
        type: expect.file
        at: { afterAction: open-board-b }
        path: src/order.ts
        contains: 'export type Size = "small" | "large" | "medium";'
      - id: expect-file-table
        type: expect.file
        at: { afterAction: expect-file-size }
        path: src/order.ts
        contains: "  size: Size;\n  table?: number;\n};"
      - id: expect-file-guard
        type: expect.file
        at: { afterAction: expect-file-table }
        path: src/order.ts
        contains: "if (!coffee) throw new Error(\"ကော်ဖီ မရှိပါ\");\nexport const coffeePrice = coffee.price;"
      - id: expect-file-phone
        type: expect.file
        at: { afterAction: expect-file-guard }
        path: src/order.ts
        contains: "type Customer = { name: string; phone: string | null };"
      - id: expect-file-keyof
        type: expect.file
        at: { afterAction: expect-file-phone }
        path: src/shop.ts
        contains: "// export function priceOf(name: string): number {\nexport function priceOf(name: keyof typeof prices): number {"
      - id: expect-file-queue
        type: expect.file
        at: { afterAction: expect-file-keyof }
        path: src/shop.ts
        contains: "  queue: string[] = [];"
      - id: expect-file-tip
        type: expect.file
        at: { afterAction: expect-file-queue }
        path: src/shop.ts
        contains: "// export const tip = tipText as number;\nexport const tip = Number(tipText);"
      - id: expect-file-allowjs
        type: expect.file
        at: { afterAction: expect-file-tip }
        path: tsconfig.json
        contains: "  \"compilerOptions\": {\n    \"allowJs\": true,\n"
      - id: expect-file-status
        type: expect.file
        at: { afterAction: expect-file-allowjs }
        path: src/status.ts
        contains: 'export const status = "ဖွင့်ပါပြီ";'

  - id: next
    narration: >
      [[mark:board-next]] ဆက်လေ့လာဖို့ နေရာ သုံးခု ရှိပါတယ်။ [[mark:draw-handbook]] TypeScript
      ရဲ့ official website ပေါ်က Handbook မှာ TypeScript ရဲ့ အသေးစိတ်ကို ရှာဖတ်လို့ ရပါတယ်။
      [[mark:draw-playground]] Playground မှာတော့ browser ထဲမှာပဲ code ကို ချက်ချင်း စမ်းလို့ ရပြီး၊ query
      comment ကိုလည်း သုံးလို့ ရပါတယ်။ [[mark:draw-more]] Total TypeScript website မှာတော့ ဒီ course ရဲ့ ခေါင်းစဉ်တွေကို
      လေ့ကျင့်လို့ ရတဲ့ exercise တွေ အများကြီး ရှိပါတယ်။ [[mark:thanks]] error ပေါ်လာတိုင်း ဒီနေ့ ပုံစံအတိုင်း
      ဖတ်ကြည့်ပါ။ ဒီ course ကို အဆုံးထိ လေ့လာပေးတဲ့အတွက် ကျေးဇူးတင်ပါတယ် ခင်ဗျာ။
    sources:
      - {
          title: "TypeScript Handbook",
          url: "https://www.typescriptlang.org/docs/handbook/intro.html",
        }
      - { title: "TypeScript Playground", url: "https://www.typescriptlang.org/play" }
      - {
          title: "Total TypeScript (tutorials and Total TypeScript Essentials)",
          url: "https://www.totaltypescript.com",
        }
    actions:
      - id: open-board-c
        type: whiteboard.apply
        at: { mark: board-next }
        clear: true
        upsertIds: [c-title]
      - id: draw-handbook
        type: whiteboard.apply
        at: { mark: draw-handbook }
        upsertIds: [c-handbook, c-handbook-url]
        drawMs: 1400
      - id: draw-playground
        type: whiteboard.apply
        at: { mark: draw-playground }
        upsertIds: [c-playground, c-playground-url]
        drawMs: 1400
      - id: draw-more
        type: whiteboard.apply
        at: { mark: draw-more }
        upsertIds: [c-more, c-more-url]
        drawMs: 1400
checks:
  - { type: timing.p95Ms, max: 300 }
