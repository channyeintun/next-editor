      စာသားမဆို ဖြစ်နိုင်လို့၊ ရလာမယ့် တန်ဖိုးက any ဖြစ်သွားမှာပါ။ [[mark:explain-index-fixes]] ဘယ် နာမည်မဆို ဝင်လာနိုင်တဲ့ object
      ဆိုရင် Record နဲ့ ကြေညာရပြီး၊ menu ထဲက နာမည်တွေကိုပဲ လက်ခံချင်ရင်တော့ parameter ကို key of type of နဲ့
      ကျဉ်းပေးရပါတယ်။ [[mark:type-keyof]] ဒီမှာ ဒုတိယ နည်းကို သုံးပြီး၊ function ရဲ့ ပထမ line ကို
      အသစ် ပြန်ရေးပါမယ်။ [[mark:read-keyof-fixed]] error လေးခု ကျန်ပါပြီ။ menu မှာ
      မရှိတဲ့ နာမည်နဲ့ ခေါ်ရင်တော့ ခေါ်တဲ့ နေရာမှာပဲ error ပြပါလိမ့်မယ်။
