build:
  # Studio replaces this built-in profile at render time with the Burmese provider chosen in the
  # render console (AthanLab with the user's own key, or VoxCPM2 when that feature is enabled).
  voiceProfile: pocket-alba-v1
  seed: 3402
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "Error ကို ဖတ်နည်း"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ React component တွေရဲ့ props ရယ်၊ children ရယ်၊ event နဲ့ state
      ကိုပါ type ပေးခဲ့ပါတယ်။ ဒီ course ရဲ့ နောက်ဆုံး lesson မှာတော့ အတွေ့ရ အများဆုံး TypeScript error
      ကိုးမျိုးကို တစ်ခုချင်း ဖတ်ပြီး၊ မှန်ကန်တဲ့ နည်းနဲ့ ပြင်ကြည့်ပါမယ်။ error ဆိုတာ ကိုယ့်ကို အပြစ်တင်နေတာ
      မဟုတ်ဘဲ၊ program မ run ခင်မှာ TypeScript က ကြိုပြီး သတိပေးနေတဲ့ စကားပါ။ အဲဒီ စကားကို ဖတ်တတ်ဖို့ အဆင့်
      ငါးဆင့်ကို အရင် ကြည့်ရအောင်။ [[mark:draw-where]] ပထမဆုံး error က ဘယ် ဖိုင်၊ ဘယ် line မှာလဲ ဆိုတာ
      ကြည့်ပါ။ [[mark:draw-code]] သူ့ဘေးက TS နဲ့ စတဲ့ နံပါတ်ကတော့ error code ပါ။ message ကို နားမလည်ရင် ဒီ
      code နဲ့ internet မှာ ရှာလို့ ရပါတယ်။ [[mark:draw-message]] ပြီးရင် message ကို ဖတ်ပါ။ အတွေ့ရ အများဆုံး
      ပုံစံက X ကို Y ထဲ ထည့်လို့ မရဘူး ဆိုတာပါ။ X က ကိုယ် ပေးလိုက်တဲ့ တန်ဖိုးရဲ့ type ဖြစ်ပြီး၊ Y က အဲဒီ
      နေရာမှာ မျှော်လင့်ထားတဲ့ type ပါ။ [[mark:draw-bottom]] message မှာ အပိုင်း တွေ များနေရင်တော့၊ တကယ့်
      အကြောင်းရင်း ရှိတတ်တဲ့ အောက်ဆုံး အပိုင်းကနေ စဖတ်ပါ။ [[mark:draw-ask]] နောက်ဆုံး အရေးအကြီးဆုံး အဆင့်ကတော့
      ပြင်ခင်မှာ တန်ဖိုးက မှားနေတာလား၊ type က မှားနေတာလား ဆိုတာ မေးဖို့ပါ။ error ကို ဖျောက်ရုံ
      ဖျောက်တာနဲ့ bug ကို ပြင်တာ မတူပါဘူး။
    sources:
      - {
          title: "Total TypeScript: Solving TypeScript Errors tutorial",
          url: "https://www.totaltypescript.com/tutorials/solving-typescript-errors",
        }
      - {
          title: "Total TypeScript Essentials, ch. 2: IDE Superpowers (dealing with multi-line errors)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/ide-superpowers",
        }
      - {
          title: "TypeScript Handbook: The Basics (static type checking)",
          url: "https://www.typescriptlang.org/docs/handbook/2/basic-types.html",
        }
    actions:
      - id: open-board-a
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-where
        type: whiteboard.apply
        at: { mark: draw-where }
        upsertIds: [a-where, a-where-note]
        drawMs: 1400
      - id: draw-code
        type: whiteboard.apply
        at: { mark: draw-code }
        upsertIds: [a-code, a-code-note]
        drawMs: 1200
      - id: draw-message
        type: whiteboard.apply
        at: { mark: draw-message }
        upsertIds: [a-msg, a-msg-note]
        drawMs: 1600
      - id: draw-bottom
        type: whiteboard.apply
        at: { mark: draw-bottom }
        upsertIds: [a-bottom, a-bottom-note, a-bottom-line]
        drawMs: 1400
      - id: draw-ask
        type: whiteboard.apply
        at: { mark: draw-ask }
        upsertIds: [a-ask-box, a-ask, a-not]
        drawMs: 1800

  - id: files
    narration: >
      [[mark:close-board]] ဒီနေ့ project မှာ ဖိုင် ငါးဖိုင် ရှိပါတယ်။ အော်ဒါနဲ့ customer အတွက် order ဖိုင်၊
      ဈေးနှုန်းနဲ့ မီးဖိုချောင် အတွက် shop ဖိုင်၊ program ကို စ run တဲ့ main ဖိုင်၊ ဆိုင်ရဲ့ အခြေအနေ အတွက် status
      ဖိုင်နဲ့ program အဟောင်းက ကျန်ခဲ့တဲ့ JavaScript ဖိုင် တစ်ဖိုင်ပါ။ [[mark:open-order]] order ဖိုင်ကနေ
      စကြည့်ရအောင်။ ဒီ ဖိုင်ထဲမှာ အော်ဒါရဲ့ type ရယ်၊ menu ရယ်၊ ဆိုင်ထဲ ဝင်လာတဲ့ customer တစ်ယောက်ရဲ့
      အချက်အလက် ရယ် ရှိပါတယ်။
    sources:
      - {
          title: "Total TypeScript: Solving TypeScript Errors tutorial",
          url: "https://www.totaltypescript.com/tutorials/solving-typescript-errors",
        }
    actions:
      - id: close-board-a
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: open-order
        type: workspace.openFile
