  - id: index
    chapter: "Object နဲ့ class error တွေ"
    narration: >
      [[mark:open-shop]] နောက် error သုံးခုက shop ဖိုင်ကပါ။ [[mark:select-index]] ပထမ error က ရှည်ပေမယ့်၊
