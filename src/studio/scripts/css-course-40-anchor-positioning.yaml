      # base.css: kit sections A, B, B2 and C (section D dropped). Section E:
      # the nav links in a row, room above the special's name and the photos,
      # the look of the tag, bubble, badges, bar and info box (never where they
      # sit), and two positioned rows (the photo list and the order row) so the
      # labels inside them never depend on the preview's height.
      base.css: |
        /*
          base.css: pinned, never typed during a lesson.
          The shop's palette and the page "furniture", so the CSS a lesson types can
          focus on one idea. Each lesson keeps only the sections it needs and drops
          any declaration that its own demo types or relies on being absent
          (COURSE-KIT.md, "Deriving a lesson workspace"). B2 travels with B (every
          lesson that keeps B keeps B2, except lesson 2, which types the reset).
          Section E holds the few lesson-specific rules a start state pins.
          Lesson 40 keeps A, B, B2 and C (section D dropped). Section E pins the look
          of the tag, the bubble, the photo badges, the underline bar and the info
          box; their positions are typed in the lesson. Nothing here is anchored.
          Keep it free of the url, image-set and @-import functions (they switch on
          Vite's postcss step); images come from <img> or the pinned images.css.
        */

        /* == A. palette == */
        :root {
          color-scheme: light;
          --tea-dark: #3b2314;
          --tea: #8b5a2b;
          --tea-light: #c9a27e;
          --cream: #fff8ec;
          --paper: #fdf3e1;
          --leaf: #2f6b3a;
          --gold: #c9a227;
          --chili: #b23a2b;
          --ink: #2b1d14;
          --muted: #6b5a4c;
          --line: #e6d5bf;
          --radius: 12px;
        }

        /* == B. page == */
        body {
          margin: 0;
          font-family: "Noto Sans Myanmar", "Myanmar Sangam MN", "Myanmar MN", "Myanmar Text", "Padauk",
            system-ui, sans-serif;
          font-size: 16px;
          line-height: 1.8;
          color: var(--ink);
          background: var(--paper);
        }

        .page {
          padding: 0 16px 24px;
        }

        h1,
        h2,
        h3 {
          margin: 0 0 8px;
          line-height: 1.5;
        }

        h1 {
          font-size: 24px;
        }

        h2 {
          font-size: 20px;
        }

        h3 {
          font-size: 17px;
        }

        a {
          color: var(--tea);
        }

        /* Status lines that only expect.preview reads (kit.js data-report, data-say). */
        .visually-hidden {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip-path: inset(50%);
          white-space: nowrap;
        }

        /* == B2. reset (lesson 2 teaches it; every later lesson keeps it) == */
        *,
        *::before,
        *::after {
          box-sizing: border-box;
        }

        /* == C. furniture == */
        .site-header {
          padding: 16px;
          background: var(--tea-dark);
          color: var(--cream);
        }

        .site-header a {
          color: var(--cream);
        }

        .logo {
          display: block;
        }

        .tagline {
          margin: 0;
          color: var(--tea-light);
          font-size: 14px;
        }

        .nav ul {
          margin: 8px 0 0;
          padding: 0;
          list-style: none;
        }

        .hero {
          margin: 16px 0;
          padding: 16px;
          background: var(--cream);
          border-radius: var(--radius);
        }

        .menu {
          margin: 0;
          padding: 0;
          list-style: none;
        }

        .menu-card {
          margin: 0 0 12px;
          padding: 12px 16px;
          background: #fff;
          border: 1px solid var(--line);
          border-radius: var(--radius);
        }

        .menu-card .name,
        .menu-card .desc {
          margin: 0;
        }

        .menu-card .desc {
          color: var(--muted);
          font-size: 14px;
        }

        .price {
          font-weight: 700;
          color: var(--tea);
        }

        .badge {
          padding: 0 8px;
          border-radius: 999px;
          background: var(--leaf);
          color: #fff;
          font-size: 13px;
        }

        .sold-out {
          opacity: 0.6;
        }

        .order-link,
        .order-btn {
          display: inline-block;
          padding: 6px 16px;
          border: 0;
          border-radius: 999px;
          background: var(--tea);
          color: #fff;
          font: inherit;
          text-decoration: none;
        }

        .order-form label {
          display: block;
          margin-top: 8px;
        }

        .order-form input[type="text"],
        .order-form input[type="tel"],
        .order-form input[type="number"] {
          box-sizing: border-box;
          width: 100%;
          padding: 6px 10px;
          border: 1px solid var(--line);
          border-radius: 8px;
          background: #fff;
          font: inherit;
        }

        .order-btn {
          margin-top: 12px;
        }

        .gallery figure {
          margin: 0 0 12px;
        }

        .gallery img {
          display: block;
          max-width: 100%;
          height: auto;
          border-radius: var(--radius);
        }

        figcaption {
          color: var(--muted);
          font-size: 14px;
        }

        .hours-list {
          margin: 0;
          padding-left: 20px;
        }

        .site-footer {
          margin-top: 24px;
          padding: 16px;
          background: var(--tea-dark);
          color: var(--cream);
          font-size: 14px;
        }

        .site-footer a {
          color: var(--cream);
        }


        /* == E. lesson rules == */
        /* Lesson 40: the nav links in one row, room above the drink cards and the
           photos for the labels that will sit above an anchor, the look of the tag,
           the bubble, the photo badges, the underline bar and the info box (where
           they sit is typed in the lesson), and two positioned rows (the photo list
           and the order row) so their labels never depend on the preview's height. */
        .tabs {
          display: flex;
          gap: 24px;
          margin-top: 4px;
        }

        .nav-link {
          text-decoration: none;
        }

        .bar {
          height: 3px;
          background: var(--gold);
        }

        .drinks .menu {
          margin-top: 24px;
        }

        .tag,
        .bubble,
        .new {
          padding: 0 8px;
          border-radius: 999px;
          font-size: 13px;
          white-space: nowrap;
        }

        .tag,
        .new {
          margin: 4px;
        }

        .tag {
          background: var(--gold);
          color: var(--tea-dark);
        }

        .bubble {
          background: var(--chili);
          color: #fff;
        }

        .new {
          background: var(--leaf);
          color: #fff;
        }

        .photo-cards {
          position: relative;
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 16px;
          margin: 0;
          padding: 28px 0 0;
          list-style: none;
        }

        .photo-card img {
          display: block;
          width: 100%;
          height: 72px;
          object-fit: cover;
          border-radius: 8px;
        }

        .photo-card p {
          margin: 4px 0 0;
          font-size: 14px;
        }

        .edge-info {
          position: relative;
          display: flex;
          justify-content: flex-end;
          align-items: center;
          min-height: 120px;
        }

        .edge-btn {
          margin: 0;
        }

        .info {
          margin: 0;
          padding: 8px 12px;
          background: var(--cream);
          border: 1px solid var(--line);
          border-radius: 8px;
          font-size: 14px;
        }
