# CSS course (Burmese), lesson 40 of 43: anchor positioning.
#
# Narration is Burmese (voice-script.md next to this file holds the same text
# with its marks; DESIGN.md is the span-by-span brief). Every [[mark:…]] sits where its action
# begins, at a sentence end; each span carries one piece of meaning.
# Everything the learner sees (title, chapters, whiteboard labels, UI strings)
# is Burmese already.
#
# Shape: board (recall lesson 39; JavaScript used to measure and re-measure on
# every scroll and resize, now one CSS link between an anchor and a positioned
# element) → code tour (nav links + an empty bar, today's special with its name
# in a span, three photo cards with "new" badges, an order button against the
# right edge with its info box, and the tag + sale bubble at the very end of
# the page) → anchor-name on the name, an absolutely positioned tag with
# position-anchor, position-area: top → top right, bottom span-right, right
# (later declarations win) → board (the 3x3 grid, the cell becomes the
# containing block, spans, single keyword, logical and self- keywords) →
# photo badges pile onto the last photo (last name wins; laid-out-first rule)
# → anchor-scope on each card → the sale bubble with anchor() insets, then
# anchor(center) → board (side keywords per axis, inside/outside, start/end,
# percentages, fallback value, calc, insets only, anchor-center) → nav bar:
# anchor() insets + anchor-size(width), then a later rule names the third link
# (last wins, the bar jumps and resizes) → board (overflow, the try list) →
# the info box covers the button (no room on the right), position-try-fallbacks:
# flip-inline moves it left → board (@position-try, position-try-order and the
# shorthand, scrolling follows the default anchor, position-visibility) →
# recap (support shown on the finished page, @supports, renamed properties,
# one quiz question, the recap), hand-off to popovers and dialogs (lesson 41).
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set(; no postcss config; no reload; no
# HTML edit, no click, no kit.js. A keystroke-typed function or nth-child( has
# an unclosed "(" until its ")", and an unclosed "(" swallows the rest of the
# stylesheet, so every keystroke edit that contains "(" lands in the LAST rule
# of the file (the bubble's insets, the nth-child rules, anchor-size). Edits
# into earlier rules (the tag's position-area values, the info box's fallback)
# contain no parentheses. Until a new declaration is complete it is invalid and
# the previous one in the same rule keeps applying.
#
# Measured in headless Chrome at 432 × 720 (probe/stages.ts, same anchors):
# document 720 tall; nav links at y 60 (first 26 px wide, third 56 px); the
# special's name 33,165 99 × 38; photos 16 / 155 / 293, 342, 123 × 72; order
# row 443–563 with the button at its right edge; the tag and bubble start at
# the bottom (y 616). Tag: top 43,137 · top right 136,137 · bottom span-right
# 37,207 · right 136,172. Badges: all at 359,318 (photo 3), then 81 / 220 /
# 359. Bubble: 33,141 then 82,141. Bar: 16,89 0 wide → 26 wide → 143,89 56
# wide. Info box: 236,469 (over the button) → 157,469 (left of it).
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
