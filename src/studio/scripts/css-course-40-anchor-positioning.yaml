build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 4140

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  - id: anchor-intro
    chapter: "Anchor positioning ဆိုတာ ဘာလဲ"
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ keyframe animation တွေကို ကြည့်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ အချိန်ကနေ နေရာဘက်
      ကူးပြီး၊ element တစ်ခုကို တခြား element တစ်ခုရဲ့ ဘေးမှာ CSS သက်သက်နဲ့ ကပ်ထားကြည့်ပါမယ်။
      [[mark:start-server]] ဒီလို ပြောနေတုန်းမှာပဲ၊ board နောက်မှာ dev server ကို စ နေပါပြီ။
      [[mark:draw-old]] ဥပမာ၊ ခလုတ် တစ်ခုရဲ့ ဘေးမှာ ကပ်ပေါ်ရမယ့် label သေးသေး ဒါမှမဟုတ် menu တစ်ခုကို
      စဉ်းစားကြည့်ပါ။ မကြာသေးခင်အထိ JavaScript library တစ်ခုက ခလုတ် ဘယ်မှာ ရှိလဲ တိုင်းပြီး၊ label ကို
      အဲဒီ ဘေးကို ရွှေ့ပေးရပါတယ်။ [[mark:draw-old-cost]] ပြီးတော့ scroll လုပ်တိုင်း၊ resize ဖြစ်တိုင်း
      ပြန်တိုင်းပြီး ပြန်ရွှေ့ရပါတယ်။ [[mark:draw-new]] anchor positioning ဆိုတာ element တစ်ခုကို တခြား
      element တစ်ခုရဲ့ ဘေးမှာ ကပ်ပြီး CSS နဲ့ နေရာချတဲ့ နည်းပါ။ အခြေပြုခံရတဲ့ element ကို anchor လို့
      ခေါ်ပါတယ်။ [[mark:draw-link]] layout ပြောင်းတိုင်း browser က နှစ်ခုကို ကပ်နေအောင် ကိုယ်တိုင်
      ထိန်းပေးပါတယ်။ ပြီးတော့ နှစ်ခုက parent နဲ့ child ဖြစ်စရာ မလိုသလို၊ HTML ထဲမှာ အနီးအနား ရှိစရာတောင်
      မလိုပါဘူး။
    sources:
      - title: "web.dev Learn CSS — Anchor positioning: tethering elements"
        url: "https://web.dev/learn/css/anchor-positioning#tethering_elements"
      - title: "MDN — CSS anchor positioning (guide)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Anchor_positioning"
      - title: "CSS Anchor Positioning Module Level 1"
        url: "https://drafts.csswg.org/css-anchor-position-1/"
    actions:
      - id: open-intro-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      # Runs in the background (boot + pnpm install + spawn); waitForReady sits
      # on the preview mark in the code tour, well over 40 s of narration later.
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 45000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-old
        type: whiteboard.apply
        at: { mark: draw-old }
        upsertIds: [a-old-h, a-old-1, a-old-2]
        drawMs: 2400
      - id: draw-old-cost
        type: whiteboard.apply
        at: { mark: draw-old-cost }
        upsertIds: [a-old-3, a-old-4]
        drawMs: 1600
      - id: draw-new
        type: whiteboard.apply
        at: { mark: draw-new }
        upsertIds: [a-new-h, a-anchor, a-anchor-l, a-tag, a-tag-l]
        drawMs: 2400
      - id: draw-link
        type: whiteboard.apply
        at: { mark: draw-link }
        upsertIds: [a-arrow, a-link, a-free]
        drawMs: 2000

  - id: code-tour
    narration: >
      [[mark:close-intro-board]] page ကို ကြည့်ရအောင်။ [[mark:open-index]] ဒါက page ရဲ့ HTML ဖိုင်ပါ။
      [[mark:select-nav]] header ထဲက nav မှာ link သုံးခုနဲ့၊ နောက်မှ အောက်မျဉ်း ဖြစ်လာမယ့် span အလွတ်
      တစ်ခု ရှိပါတယ်။ [[mark:select-special]] ဒီနေ့ အထူး card က နာမည်ကို span နဲ့ ထုပ်ထားလို့၊ နာမည်
      စာသားကိုပဲ anchor အဖြစ် သုံးလို့ ရပါတယ်။ [[mark:select-photos]] ပြီးတော့ ဓာတ်ပုံနဲ့ အသစ် badge ပါတဲ့
      စားစရာ card သုံးခု ရှိပါတယ်။ [[mark:select-edge]] သူတို့ နောက်မှာ မှာမယ် ခလုတ်နဲ့ info box သေးသေး
      ရှိပါတယ်။ [[mark:select-tag]] HTML ရဲ့ အဆုံးဆုံးမှာတော့ card နဲ့ ဝေးဝေးမှာ၊ ဒီနေ့ အထူး tag နဲ့
      ဈေးလျှော့ bubble ရှိပါတယ်။ နှစ်ခုလုံးကို ဒီနေ့ အထူး နာမည်နဲ့ ချိတ်ပါမယ်။ [[mark:open-styles]] CSS
      ဖိုင်ကတော့ အလွတ်ပါ။ [[mark:preview-opens]] preview ပွင့်လာပါပြီ။ အခုတော့ tag နဲ့ bubble က HTML ထဲက
      အစဉ်အတိုင်း page ရဲ့ အောက်ဆုံးမှာ ရှိနေပါသေးတယ်။
    sources:
      - title: "web.dev Learn CSS — Anchor positioning"
        url: "https://web.dev/learn/css/anchor-positioning"
      - title: "MDN — Using CSS anchor positioning"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Anchor_positioning/Using"
    actions:
      - id: close-intro-board
        type: whiteboard.apply
        at: { mark: close-intro-board }
        open: false
      - id: open-index
        type: workspace.openFile
        at: { mark: open-index }
        path: index.html
      - id: select-nav
        type: editor.select
        at: { mark: select-nav }
        target:
          {
            file: index.html,
            text: '<span class="bar" aria-hidden="true" data-testid="bar"></span>',
            occurrence: 1,
          }
      - id: select-special
        type: editor.select
        at: { mark: select-special }
        target:
          {
            file: index.html,
            text: '<span class="special-name" data-testid="special-name">',
            occurrence: 1,
          }
      - id: select-photos
        type: editor.select
        at: { mark: select-photos }
        target:
          {
            file: index.html,
            text: '<ul class="photo-cards" data-testid="photo-cards">',
            occurrence: 1,
          }
      - id: select-edge
        type: editor.select
        at: { mark: select-edge }
        target:
          {
            file: index.html,
            text: '<section class="edge-info" id="order" data-testid="edge-info">',
            occurrence: 1,
          }
      - id: select-tag
        type: editor.select
        at: { mark: select-tag }
        target:
          {
            file: index.html,
            text: "    <span class=\"tag\" data-testid=\"tag\">ယနေ့အထူး</span>\n    <span class=\"bubble\" data-testid=\"bubble\">ဈေးလျှော့</span>\n",
            occurrence: 1,
          }
      - id: open-styles
        type: workspace.openFile
        at: { mark: open-styles }
        path: styles.css
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { mark: preview-opens }
        timeoutMs: 20000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-dev-server }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-special-name
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: special-name }
        textContains: "လက်ဖက်ရည်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-tag
        type: expect.preview
        at: { afterAction: expect-special-name }
        timeoutMs: 5000
        target: { by: testId, value: tag }
        textContains: "ယနေ့အထူး"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: collapse-runner-dock
        type: runtime.collapseDock
        at: { afterAction: expect-tag }

  - id: first-tether
    chapter: "Anchor နဲ့ ချိတ်ကြည့်ရအောင်"
    narration: >
      [[mark:type-name]] ပထမဆုံး ဒီနေ့ အထူး နာမည် စာသားကို anchor name တစ်ခု ပေးပါမယ်။ ဒါမှ တခြား element
      တွေက သူ့ကို ရှာတွေ့မှာပါ။ နာမည် ပေးရုံနဲ့ page ပေါ်မှာ ဘာမှ မပြောင်းပါဘူး။ [[mark:select-dashed]] ဒီ
      နာမည်ကို ကြည့်ပါ။ lesson 11 မှာ တွေ့ခဲ့တဲ့ custom property လိုပဲ dash နှစ်ခုနဲ့ စပေမယ့်၊ variable
      တော့ မဟုတ်ပါဘူး။ တခြား element တွေက ညွှန်းလို့ ရတဲ့ နာမည် သက်သက်ပါ။ [[mark:type-tag]] အခု tag ဘက်ကို
      သွားရအောင်။ tag ကို absolute ပေးရပါမယ်။ absolute ဒါမှမဟုတ် fixed ဖြစ်တဲ့ element ကိုပဲ anchor နဲ့
      ချိတ်လို့ ရလို့ပါ။ ပြီးတော့ position anchor က ခုနက ပေးခဲ့တဲ့ နာမည်ကို tag ရဲ့ default anchor အဖြစ်
      ရွေးပေးပါတယ်။ [[mark:after-tag]] tag က normal flow ထဲကနေ ထွက်သွားလို့၊ bubble က သူ့ နေရာထဲ
      ရွှေ့လာပြီး tag ရဲ့ အောက်ကို ဝင်သွားပါပြီ။ ဒါပေမဲ့ tag က နာမည်ဆီ မရောက်သေးပါဘူး။ ချိတ်ရုံနဲ့
      မပြီးဘဲ၊ anchor ရဲ့ ဘယ်ဘက်မှာ ထားမလဲ ဆိုတာပါ ပြောပေးရပါမယ်။ [[mark:type-top]] အလွယ်ဆုံး နည်းက
      position area ပါ။ သူက anchor ပတ်လည်က နေရာ တစ်ခုကို ရွေးပေးပါတယ်။ top လို့ ပေးကြည့်ရအောင်။
      [[mark:after-top]] tag က page ရဲ့ အောက်ဆုံးကနေ နာမည်ရဲ့ အပေါ်ကို ခုန်တက်သွားပြီး၊ နာမည်ရဲ့ အလယ်နဲ့
      ညီနေပါပြီ။ tag မရွှေ့ရင်တော့ ဒီ preview ကို ဆွဲပြနေတဲ့ ကိုယ့် browser က anchor positioning ကို
      မသိသေးလို့ပါ။ browser ကို update လုပ်ပြီးမှ ဆက်ကြည့်ပါ။ [[mark:visual-only]] HTML ထဲမှာတော့ tag က
      page အဆုံးမှာပဲ ရှိနေပါသေးတယ်။ ဒီ ချိတ်ဆက်မှုက မျက်စိနဲ့ မြင်ရတာ သက်သက်ပါ။ screen reader က HTML
      အစဉ်အတိုင်း ဖတ်လို့၊ အရေးကြီးတဲ့ label ကို HTML ထဲမှာလည်း anchor နားမှာ ထားပါ။
    sources:
      - title: "web.dev Learn CSS — Anchor positioning: tethering elements"
        url: "https://web.dev/learn/css/anchor-positioning#tethering_elements"
      - title: "MDN — anchor-name (a dashed ident)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/anchor-name"
      - title: "MDN — position-anchor (the default anchor)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/position-anchor"
      - title: "CSS Anchor Positioning — anchor-name and position-anchor"
        url: "https://drafts.csswg.org/css-anchor-position-1/#name"
      - title: "CSS Anchor Positioning — Accessibility implications (visual only, not a semantic link)"
        url: "https://drafts.csswg.org/css-anchor-position-1/#accessibility"
    actions:
      - id: type-name
        type: editor.type
        at: { mark: type-name }
        cadence: fast-explainer
        target: { file: styles.css, after: "", occurrence: 1 }
        text: ".special-name {\n  anchor-name: --special;\n}\n"
      - id: select-dashed
        type: editor.select
        at: { mark: select-dashed }
        target: { file: styles.css, text: "--special", occurrence: 1 }
      - id: type-tag
        type: editor.type
        at: { mark: type-tag }
        cadence: fast-explainer
        target: { file: styles.css, after: "  anchor-name: --special;\n}\n", occurrence: 1 }
        text: "\n.tag {\n  position: absolute;\n  position-anchor: --special;\n}\n"
      - id: expect-tag-out
        type: expect.preview
        at: { mark: after-tag }
        timeoutMs: 4000
        target: { by: testId, value: tag }
        textContains: "ယနေ့အထူး"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-top
        type: editor.type
        at: { mark: type-top }
        cadence: fast-explainer
        target: { file: styles.css, after: "  position-anchor: --special;\n", occurrence: 1 }
        text: "  position-area: top;\n"
      - id: expect-top
        type: expect.preview
        at: { mark: after-top }
        timeoutMs: 4000
        target: { by: testId, value: special-name }
        textContains: "လက်ဖက်ရည်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: area-moves
    narration: >
      [[mark:type-top-right]] အောက်မှာ position area တွေ ထပ်ထည့်ပါမယ်။ lesson 5 မှာ ကြည့်ခဲ့သလို နောက်မှ
      ရေးတဲ့ declaration က နိုင်လို့ အဟောင်းကို ဖျက်စရာ မလိုပါဘူး။ top right ကတော့ tag ကို နာမည်ရဲ့
      အပြင်ဘက်၊ ညာဘက် အပေါ် ထောင့်မှာ ထားပါတယ်။ [[mark:type-span]] bottom span right က tag ကို နာမည်ရဲ့
      အောက်မှာ ထားပါတယ်။ နာမည်ရဲ့ ဘယ်အစွန်းကနေ စပြီး ညာဘက်ကို ဆန့်ခွင့် ရလို့၊ ခလုတ် အောက်မှာ ပွင့်လာတဲ့
      dropdown menu လိုပါပဲ။ [[mark:type-right]] right ကတော့ tag ကို နာမည်ရဲ့ ညာဘက် ဘေးမှာ၊ အပေါ်အောက်
      အလယ်ကျအောင် ထားပါတယ်။ [[mark:after-right]] ဒီ နောက်ဆုံး position area က နိုင်ပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Anchor positioning: position-area"
        url: "https://web.dev/learn/css/anchor-positioning#position-area"
      - title: "MDN — position-area"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/position-area"
    actions:
      - id: type-top-right
        type: editor.type
        at: { mark: type-top-right }
        cadence: fast-explainer
        target: { file: styles.css, after: "  position-area: top;\n", occurrence: 1 }
        text: "  position-area: top right;\n"
      - id: type-span
        type: editor.type
        at: { mark: type-span }
        cadence: fast-explainer
        target: { file: styles.css, after: "  position-area: top right;\n", occurrence: 1 }
        text: "  position-area: bottom span-right;\n"
      - id: type-right
        type: editor.type
        at: { mark: type-right }
        cadence: fast-explainer
        target: { file: styles.css, after: "  position-area: bottom span-right;\n", occurrence: 1 }
        text: "  position-area: right;\n"
      - id: select-right
        type: editor.select
        at: { mark: after-right }
        target: { file: styles.css, text: "  position-area: right;", occurrence: 1 }

  - id: area-grid
    chapter: "Position area ရဲ့ grid"
    narration: >
      [[mark:open-grid]] ဒီ စကားလုံးတွေက ဘာကို ရွေးတာလဲ။ [[mark:draw-grid]] browser က anchor ရဲ့ အနား
      လေးဘက်ကနေ မျဉ်းတွေ ဆွဲပြီး၊ lesson 14 မှာ တွေ့ခဲ့တဲ့ containing block ရဲ့ အစွန်းထိ ဆန့်ထုတ်တယ်လို့
      စဉ်းစားကြည့်ပါ။ ဒါဆို အကွက် ကိုးကွက် ပါတဲ့ grid တစ်ခု ရပြီး၊ anchor က အလယ် အကွက်မှာ ရှိပါတယ်။
      [[mark:draw-labels]] top၊ bottom၊ left၊ right က anchor ပတ်လည်က row နဲ့ column တွေရဲ့ နာမည်တွေပါ။ top
      right လို စကားလုံး နှစ်လုံး တွဲပေးရင် ထောင့် အကွက်ကို ရွေးပါတယ်။ [[mark:draw-pick]] ရွေးလိုက်တဲ့
      အကွက်က tag ရဲ့ containing block အသစ် ဖြစ်သွားပါတယ်။ ဒါကြောင့် tag ကို ရာခိုင်နှုန်းနဲ့ ပေးတဲ့
      အကျယ်တို့၊ margin တို့ကို page နဲ့ မတိုင်းတော့ဘဲ အဲဒီ အကွက်နဲ့ တိုင်းပါတယ်။ [[mark:draw-span]] span
      ပါတဲ့ စကားလုံးက အလယ် အကွက်နဲ့ သူ ညွှန်းတဲ့ ဘက်က အကွက်ကို ပေါင်းယူပါတယ်။ ဥပမာ bottom span right က
      အောက်တန်းရဲ့ အလယ် အကွက်နဲ့ ညာဘက် အကွက်ကို ယူပြီး၊ span all ကတော့ အဲဒီ တန်းက အကွက် သုံးကွက်လုံးကို
      ယူပါတယ်။ [[mark:draw-single]] top လို စကားလုံး တစ်လုံးတည်း ပေးရင် ကျန်တဲ့ axis က span all
      ဖြစ်သွားပါတယ်။ အဲဒီ axis မှာ browser က tag ကို anchor ရဲ့ အလယ်နဲ့ ညှိပေးလို့၊ ခုနက tag က page ရဲ့
      အလယ်မှာ မဟုတ်ဘဲ နာမည်ရဲ့ အလယ်မှာ ရှိနေတာပါ။ start၊ center လို axis မသတ်မှတ်တဲ့ စကားလုံး ဆိုရင်တော့
      axis နှစ်ခုလုံးအတွက် ထပ်သုံးပါတယ်။ [[mark:draw-logical]] block start၊ inline end လို logical
      စကားလုံးတွေလည်း ရှိပါတယ်။ သူတို့က lesson 21 မှာ တွေ့ခဲ့တဲ့ logical property တွေလိုပဲ containing
      block ရဲ့ writing mode ကို လိုက်ပါတယ်။ မြန်မာစာနဲ့ အင်္ဂလိပ်စာမှာတော့ block start က အပေါ်ဘက်
      ဖြစ်ပြီး၊ inline end က ညာဘက်ပါ။ [[mark:draw-self]] ရှေ့မှာ self ပါရင်တော့ element ကိုယ်တိုင်ရဲ့
      writing mode ကို လိုက်ပါတယ်။ ဒါကိုတော့ သိပ် မလိုပါဘူး။
    sources:
      - title: "web.dev Learn CSS — How position-area works"
        url: "https://web.dev/learn/css/anchor-positioning#how_position-area_works"
      - title: "web.dev Learn CSS — Logical keywords, spanning, single keyword"
        url: "https://web.dev/learn/css/anchor-positioning#spanning_multiple_grid_areas"
      - title: "MDN — position-area (the grid, span keywords, one keyword)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/position-area"
      - title: "CSS Anchor Positioning — the position-area property"
        url: "https://drafts.csswg.org/css-anchor-position-1/#position-area"
    actions:
      - id: open-grid
        type: whiteboard.apply
        at: { mark: open-grid }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-grid
        type: whiteboard.apply
        at: { mark: draw-grid }
        upsertIds: [b-cb, b-row, b-col, b-cb-l, b-anchor, b-anchor-l]
        drawMs: 2400
      - id: draw-labels
        type: whiteboard.apply
        at: { mark: draw-labels }
        upsertIds: [b-top, b-bottom, b-left, b-right]
        drawMs: 1600
      - id: draw-pick
        type: whiteboard.apply
        at: { mark: draw-pick }
        upsertIds: [b-pick, b-pick-l]
        drawMs: 1600
      - id: draw-span
        type: whiteboard.apply
        at: { mark: draw-span }
        upsertIds: [b-span, b-span-l, b-spanall]
        drawMs: 2000
      - id: draw-single
        type: whiteboard.apply
        at: { mark: draw-single }
        upsertIds: [b-single, b-single-2]
        drawMs: 1600
      - id: draw-logical
        type: whiteboard.apply
        at: { mark: draw-logical }
        upsertIds: [b-logical]
        drawMs: 1000
      - id: draw-self
        type: whiteboard.apply
        at: { mark: draw-self }
        upsertIds: [b-self]
        drawMs: 1000

  - id: anchor-scope
    chapter: "Anchor scope ဘာကြောင့် လိုလဲ"
    narration: >
      [[mark:close-grid]] component တွေကို ထပ်သုံးတဲ့အခါ ကြုံရတဲ့ ပြဿနာကို ကြည့်ရအောင်။
      [[mark:scroll-photos]] စားစရာ card တိုင်းမှာ ဓာတ်ပုံနဲ့ အသစ် badge ပါပါတယ်။ [[mark:type-photo]]
      ဓာတ်ပုံ တိုင်းကို anchor name တူတူ ပေးပြီး၊ badge တိုင်းကိုလည်း အဲဒီ နာမည်နဲ့ ချိတ်ပါမယ်။ badge က
      ဓာတ်ပုံရဲ့ အပေါ်မှာ ညာဘက် အစွန်းနဲ့ ညီနေရပါမယ်။ [[mark:after-photo]] badge သုံးခုလုံး နောက်ဆုံး
      ဓာတ်ပုံဆီ ခုန်သွားပါပြီ။ တစ်ခုပေါ် တစ်ခု အတိအကျ ထပ်နေလို့ တစ်ခုပဲ မြင်ရပါတယ်။ [[mark:explain-last]]
      ဒီ anchor name ကို ကြည့်ပါ။ နာမည် တူတဲ့ anchor တွေ များနေရင် page ထဲက နောက်ဆုံး တစ်ခုက နိုင်ပါတယ်။
      [[mark:explain-layout]] နောက်ထပ် စည်းမျဉ်း တစ်ခုက၊ browser က anchor ကို သူနဲ့ ချိတ်မယ့် element ထက်
      အရင် နေရာချပြီးသား ဖြစ်ရပါမယ်။ ဒါကြောင့် HTML မှာ နောက်မှ လာတဲ့ absolute element ကို anchor အဖြစ်
      သုံးလို့ မရသလို၊ ပွင့်နေတဲ့ popover လို top layer ပေါ်က element ကိုလည်း အပြင်က element တွေအတွက်
      anchor အဖြစ် သုံးလို့ မရပါဘူး။ [[mark:type-scope]] ဖြေရှင်းနည်းက anchor scope ပါ။ ထပ်ခါ ပါနေတဲ့ card
      တစ်ခုစီကို ဓာတ်ပုံရဲ့ နာမည်နဲ့ anchor scope ပေးပါမယ်။ အဲဒီအခါ နာမည်က card တစ်ခုစီရဲ့ အထဲမှာပဲ
      အလုပ်လုပ်လို့၊ badge က ကိုယ့် card ထဲက ဓာတ်ပုံကိုပဲ ရှာတွေ့ပါတော့တယ်။ [[mark:after-scope]] အခု badge
      တိုင်း ကိုယ့် ဓာတ်ပုံရဲ့ အပေါ်ဘက်ကို ရောက်နေပါပြီ။ ထပ်သုံးတဲ့ component တိုင်းရဲ့ root element မှာ
      anchor scope ထည့်ပါ။
    sources:
      - title: "web.dev Learn CSS — Scoping the potential anchors"
        url: "https://web.dev/learn/css/anchor-positioning#scoping_the_potential_anchors"
      - title: "MDN — anchor-scope"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/anchor-scope"
      - title: "CSS Anchor Positioning — acceptable anchor element (last match wins)"
        url: "https://drafts.csswg.org/css-anchor-position-1/#acceptable-anchor-element"
    actions:
      - id: close-grid
        type: whiteboard.apply
        at: { mark: close-grid }
        open: false
      # The scroll for this step is gone: the page is only 735 px tall, so in
      # a preview this tall there is nothing to scroll and no scroll event to
      # record.
      - id: type-photo
        type: editor.type
        at: { mark: type-photo }
        cadence: line-by-line
        target: { file: styles.css, after: "  position-area: right;\n}\n", occurrence: 1 }
        text: "\n.photo-card img {\n  anchor-name: --photo;\n}\n\n.new {\n  position: absolute;\n  position-anchor: --photo;\n  position-area: top span-left;\n}\n"
      - id: expect-photo
        type: expect.preview
        at: { mark: after-photo }
        timeoutMs: 4000
        target: { by: testId, value: new-laphet-thoke }
        textContains: "အသစ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-photo-name
        type: editor.select
        at: { mark: explain-last }
        target: { file: styles.css, text: "  anchor-name: --photo;", occurrence: 1 }
      - id: type-scope
        type: editor.type
        at: { mark: type-scope }
        cadence: fast-explainer
        target: { file: styles.css, after: "  position-area: top span-left;\n}\n", occurrence: 1 }
        text: "\n.photo-card {\n  anchor-scope: --photo;\n}\n"
      - id: expect-scope
        type: expect.preview
        at: { mark: after-scope }
        timeoutMs: 4000
        target: { by: testId, value: new-mohinga }
        textContains: "အသစ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-scope
        type: editor.select
        at: { mark: after-scope }
        target: { file: styles.css, text: "anchor-scope: --photo;", occurrence: 1 }

  - id: anchor-function
    chapter: "Anchor function နဲ့ နေရာချကြည့်ရအောင်"
    narration: >
      position area က ရေးရ လွယ်ပါတယ်။ အနား တစ်ခုချင်းကို တိတိကျကျ ထိန်းချင်ရင်တော့
      anchor function ကို သုံးပါတယ်။ [[mark:type-bubble]] ဈေးလျှော့ bubble ကိုလည်း tag လိုပဲ absolute
      ပေးပြီး၊ ဒီနေ့ အထူး နာမည်ကို default anchor အဖြစ် ပေးပါမယ်။ [[mark:type-insets]] ဒီတစ်ခါ position
      area အစား lesson 14 က offset လေးခုကို သုံးပါမယ်။ သူတို့ကို inset property လို့လည်း ခေါ်ပါတယ်။ bubble
      ရဲ့ အောက်အနားကို anchor ရဲ့ အပေါ်အနားမှာ ထားပြီး၊ ဘယ်အနားကို anchor ရဲ့ ဘယ်အနားနဲ့ ညီအောင် ထားပါမယ်။
      [[mark:after-insets]] ဒီ inset နှစ်ခုကြောင့် bubble က နာမည်ရဲ့ အပေါ်ကို ရောက်လာပြီး၊ ဘယ်အစွန်းချင်း
      ညီနေပါပြီ။ [[mark:type-center]] အောက်မှာ left inset နောက်တစ်ခု ထပ်ထည့်ပြီး၊ ဒီတစ်ခါ anchor ရဲ့
      center ကို ပေးပါမယ်။ [[mark:after-center]] ဒီ center ကို ကြည့်ပါ။ အခု bubble ရဲ့ ဘယ်အစွန်းက နာမည်ရဲ့
      အလယ်ကနေ စပါပြီ။ anchor function က anchor ရဲ့ အနား ဒါမှမဟုတ် အလယ် ရှိတဲ့ နေရာကို length အဖြစ်
      ပြန်ပေးတာပါ။ ကွင်းထဲမှာ နာမည် မပေးရင် default anchor ကို သုံးပြီး၊ နာမည် ထည့်ရင် တခြား anchor
      ကိုလည်း ညွှန်းလို့ ရပါတယ်။
    sources:
      - title: "web.dev Learn CSS — The anchor() function"
        url: "https://web.dev/learn/css/anchor-positioning#the_anchor_function"
      - title: "MDN — anchor()"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/anchor"
    actions:
      # The scroll for this step is gone: the page is only 735 px tall, so in
      # a preview this tall there is nothing to scroll and no scroll event to
      # record.
      - id: type-bubble
        type: editor.type
        at: { mark: type-bubble }
        cadence: line-by-line
        target: { file: styles.css, after: "  anchor-scope: --photo;\n}\n", occurrence: 1 }
        text: "\n.bubble {\n  position: absolute;\n  position-anchor: --special;\n}\n"
      - id: type-insets
        type: editor.type
        at: { mark: type-insets }
        cadence: fast-explainer
        target:
          {
            file: styles.css,
            after: ".bubble {\n  position: absolute;\n  position-anchor: --special;\n",
            occurrence: 1,
          }
        text: "  bottom: anchor(top);\n  left: anchor(left);\n"
      - id: expect-insets
        type: expect.preview
        at: { mark: after-insets }
        timeoutMs: 4000
        target: { by: testId, value: bubble }
        textContains: "ဈေးလျှော့"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-insets
        type: editor.select
        at: { mark: after-insets }
        target:
          { file: styles.css, text: "  bottom: anchor(top);\n  left: anchor(left);", occurrence: 1 }
      - id: type-center
        type: editor.type
        at: { mark: type-center }
        cadence: fast-explainer
        target: { file: styles.css, after: "  left: anchor(left);\n", occurrence: 1 }
        text: "  left: anchor(center);\n"
      - id: select-center
        type: editor.select
        at: { mark: after-center }
        target: { file: styles.css, text: "anchor(center)", occurrence: 1 }

  - id: anchor-sides
    narration: >
      [[mark:open-sides]] ဘယ် အနား စကားလုံးတွေ သုံးလို့ ရလဲ။ [[mark:draw-sides]] ပေးတဲ့ အနားက inset နဲ့
      axis တူရပါမယ်။ top နဲ့ bottom inset တွေက anchor ရဲ့ အပေါ် ဒါမှမဟုတ် အောက် အနားကို ယူပြီး၊ left နဲ့
      right inset တွေက ဘယ် ဒါမှမဟုတ် ညာ အနားကို ယူပါတယ်။ [[mark:draw-check]] ဒါကြောင့် bubble ရဲ့ bottom
      inset ကို anchor ရဲ့ top ပေးတာ မှန်ပေမယ့်၊ left inset မှာ top ပေးရင်တော့ invalid ဖြစ်ပါတယ်။
      [[mark:draw-inside]] inside က inset နဲ့ ဘက်တူ အနား ဖြစ်ပြီး၊ outside က ဆန့်ကျင်ဘက် အနားပါ။ start နဲ့
      end က containing block ရဲ့ writing mode ကို လိုက်ပြီး၊ self start နဲ့ self end က element
      ကိုယ်တိုင်ရဲ့ writing mode ကို လိုက်ပါတယ်။ [[mark:draw-percent]] ရာခိုင်နှုန်းကို anchor ရဲ့ start
      အနားကနေ တိုင်းပြီး၊ center က 50 ရာခိုင်နှုန်းပါ။ 25 pixel လို length သက်သက်ကတော့ အနား မဟုတ်လို့
      မရပါဘူး။ [[mark:draw-fallback]] anchor ကို ရှာမတွေ့ရင် declaration တစ်ခုလုံး invalid ဖြစ်သွားလို့၊
      function ရဲ့ နောက်ဆုံးမှာ fallback တန်ဖိုး ထည့်ထားလို့ ရပါတယ်။ [[mark:draw-calc]] ရလဒ်က length
      ဖြစ်လို့ calc၊ min၊ max ထဲမှာ သုံးလို့ ရပြီး၊ ဥပမာ နေရာလွတ် နည်းနည်း ချန်ချင်တဲ့အခါ သုံးပါတယ်။
      ဒါပေမဲ့ anchor function ကို inset property တွေမှာပဲ သုံးလို့ ရပြီး၊ margin၊ width နဲ့ transform မှာ
      မရပါဘူး။ [[mark:draw-center]] anchor နဲ့ အလယ်ချင်း ညီအောင် ထားချင်ရင်တော့ justify self ဒါမှမဟုတ်
      align self ကို anchor center ပေးပါ။
    sources:
      - title: "web.dev Learn CSS — Anchor side keywords, fallback values, using anchor()"
        url: "https://web.dev/learn/css/anchor-positioning#anchor_side_keywords"
      - title: "MDN — anchor() (sides, fallback, only in inset properties)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/anchor"
      - title: "MDN — justify-self: anchor-center"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/justify-self"
      - title: "CSS Anchor Positioning — the anchor() function"
        url: "https://drafts.csswg.org/css-anchor-position-1/#anchor-pos"
    actions:
      - id: open-sides
        type: whiteboard.apply
        at: { mark: open-sides }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-sides
        type: whiteboard.apply
        at: { mark: draw-sides }
        upsertIds: [c-anchor, c-top, c-bottom, c-left, c-right]
        drawMs: 2400
      - id: draw-check
        type: whiteboard.apply
        at: { mark: draw-check }
        upsertIds: [c-ok, c-bad]
        drawMs: 1600
      - id: draw-inside
        type: whiteboard.apply
        at: { mark: draw-inside }
        upsertIds: [c-inout, c-startend]
        drawMs: 1600
      - id: draw-percent
        type: whiteboard.apply
        at: { mark: draw-percent }
        upsertIds: [c-center]
        drawMs: 1000
      - id: draw-fallback
        type: whiteboard.apply
        at: { mark: draw-fallback }
        upsertIds: [c-fallback]
        drawMs: 1000
      - id: draw-calc
        type: whiteboard.apply
        at: { mark: draw-calc }
        upsertIds: [c-calc, c-inset]
        drawMs: 1600
      - id: draw-center
        type: whiteboard.apply
        at: { mark: draw-center }
        upsertIds: [c-acenter]
        drawMs: 1000

  - id: anchor-size
    chapter: "Anchor ရဲ့ အရွယ်အစား"
    narration: >
      [[mark:close-sides]] anchor ရဲ့ အရွယ်အစားကိုလည်း ယူသုံးလို့ ရပါတယ်။ [[mark:type-first]] nav ထဲက
      ပထမဆုံး link ကို ရွေးတဲ့ selector နဲ့ rule အသစ် ရေးပါမယ်။ ကြည့်သူ အခု ရောက်နေတဲ့ အပိုင်းကို ပြတဲ့
      link ဖြစ်လို့ current ဆိုတဲ့ anchor name ပေးပါမယ်။ [[mark:type-bar]] ပြီးတော့ အောက်မျဉ်းကို absolute
      ပေးပြီး current link နဲ့ ချိတ်ပါမယ်။ မျဉ်းရဲ့ အပေါ်အနားကို link ရဲ့ အောက်အနားမှာ၊ ဘယ်အနားကို link
      ရဲ့ ဘယ်အနားမှာ ထားပါမယ်။ [[mark:after-bar]] အောက်မျဉ်းက နေရာ မှန်နေပေမယ့် မမြင်ရပါဘူး။ အကျယ်
      မပေးရသေးတော့ 0 ဖြစ်နေလို့ပါ။ [[mark:type-size]] anchor size function နဲ့ အောက်မျဉ်းရဲ့ အကျယ်ကို သူ့
      anchor ဖြစ်တဲ့ ပထမ link ရဲ့ အကျယ်အတိုင်း ပေးပါမယ်။ [[mark:after-size]] ဒီ anchor size ကို ကြည့်ပါ။
      ပထမ link ရဲ့ အောက်မှာ link နဲ့ အကျယ် တူတဲ့ ရွှေရောင် မျဉ်း ပေါ်လာပါပြီ။ anchor size ကို အကျယ်၊
      အမြင့်၊ inset နဲ့ margin တွေမှာ သုံးလို့ ရပါတယ်။ ကွင်းထဲမှာ ဘာမှ မပေးရင်တော့ သူ ရှိနေတဲ့ property
      ရဲ့ axis အတိုင်း တိုင်းပါတယ်။ [[mark:type-third]] အခု ကြည့်သူက မှာယူရန် အပိုင်းကို ရောက်သွားတယ်
      ဆိုပါစို့။ တတိယ link ကို rule အသစ်နဲ့ anchor name တူတူ ပေးပါမယ်။ ရိုက်နေတုန်း ရွှေရောင် မျဉ်းကို
      လိုက်ကြည့်ပါ။ [[mark:after-third]] အောက်မျဉ်းက တတိယ link ဆီ ခုန်သွားပြီး သူ့ အကျယ်ကို ယူလိုက်ပါပြီ။
      link နှစ်ခုက နာမည် တူနေလို့ HTML ထဲမှာ နောက်မှ လာတဲ့ link က နိုင်တာပါ။ rule ရေးတဲ့ အစဉ်ကြောင့်
      မဟုတ်ပါဘူး။ တကယ့် website မှာတော့ JavaScript က ကြည့်သူ ရောက်နေတဲ့ အပိုင်းရဲ့ link ကို class တစ်ခု
      ပေးပြီး၊ အဲဒီ class ရှိတဲ့ link ကိုပဲ anchor name ပေးပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Using the anchor's size"
        url: "https://web.dev/learn/css/anchor-positioning#using_the_anchors_size"
      - title: "MDN — anchor-size()"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/anchor-size"
    actions:
      - id: close-sides
        type: whiteboard.apply
        at: { mark: close-sides }
        open: false
      - id: type-first
        type: editor.type
        at: { mark: type-first }
        cadence: fast-explainer
        target: { file: styles.css, after: "  left: anchor(center);\n}\n", occurrence: 1 }
        text: "\n.nav-link:nth-child(1) {\n  anchor-name: --current;\n}\n"
      - id: type-bar
        type: editor.type
        at: { mark: type-bar }
        cadence: line-by-line
        target:
          {
            file: styles.css,
            after: ".nav-link:nth-child(1) {\n  anchor-name: --current;\n}\n",
            occurrence: 1,
          }
        text: "\n.bar {\n  position: absolute;\n  position-anchor: --current;\n  top: anchor(bottom);\n  left: anchor(left);\n}\n"
      - id: expect-bar
        type: expect.preview
        at: { mark: after-bar }
        timeoutMs: 4000
        target: { by: testId, value: bar }
        attribute: { name: aria-hidden, value: "true" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-size
        type: editor.type
        at: { mark: type-size }
        cadence: fast-explainer
        target:
          {
            file: styles.css,
            after: "  top: anchor(bottom);\n  left: anchor(left);\n",
            occurrence: 1,
          }
        text: "  width: anchor-size(width);\n"
      - id: select-size
        type: editor.select
        at: { mark: after-size }
        target: { file: styles.css, text: "anchor-size(width)", occurrence: 1 }
      - id: type-third
        type: editor.type
        at: { mark: type-third }
        cadence: fast-explainer
        target: { file: styles.css, after: "  width: anchor-size(width);\n}\n", occurrence: 1 }
        text: "\n.nav-link:nth-child(3) {\n  anchor-name: --current;\n}\n"
      - id: expect-third
        type: expect.preview
        at: { mark: after-third }
        timeoutMs: 4000
        target: { by: testId, value: nav-order }
        textContains: "မှာယူရန်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: overflow-board
    chapter: "နေရာ မဆံ့ရင်"
    narration: >
      [[mark:open-overflow]] anchor က screen အစွန်းနားမှာ ရှိနေရင် ဘာဖြစ်မလဲ ကြည့်ရအောင်။
      [[mark:draw-pref]] ဒီမှာ ကိုယ် ရွေးထားတဲ့ anchor ရဲ့ ညာဘက် နေရာက screen အပြင်ကို ထွက်သွားလို့
      ပြတ်နေပါတယ်။ [[mark:draw-tries]] ဒါကြောင့် browser ကို အစားထိုး နေရာ စာရင်း တစ်ခု ပေးထားလို့ ရပါတယ်။
      browser က အစဉ်လိုက် စမ်းပြီး၊ ပထမဆုံး ဆံ့တဲ့ နေရာကို သုံးပါတယ်။ [[mark:draw-keep]] ဘယ်ဟာမှ
      မဆံ့ရင်တော့ မူလ နေရာမှာပဲ ထားပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Handling overflow"
        url: "https://web.dev/learn/css/anchor-positioning#handling_overflow"
      - title: "MDN — Fallback options and conditional hiding for overflow"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Anchor_positioning/Try_options_hiding"
    actions:
      - id: open-overflow
        type: whiteboard.apply
        at: { mark: open-overflow }
        open: true
        clear: true
        upsertIds: [d-title, d-screen, d-screen-l, d-anchor]
      - id: draw-pref
        type: whiteboard.apply
        at: { mark: draw-pref }
        upsertIds: [d-pref, d-flow-1]
        drawMs: 1600
      - id: draw-tries
        type: whiteboard.apply
        at: { mark: draw-tries }
        upsertIds: [d-arrow-1, d-flow-2, d-arrow-2, d-flow-3, d-fit]
        drawMs: 2400
      - id: draw-keep
        type: whiteboard.apply
        at: { mark: draw-keep }
        upsertIds: [d-flow-4]
        drawMs: 1000

  - id: flip
    narration: >
      [[mark:close-overflow]] မှာယူရန် အတန်းမှာ စမ်းကြည့်ရအောင်။ အခုတော့ info box က အတန်းထဲမှာ မှာမယ်
      ခလုတ်ရဲ့ ညာဘက်မှာ ရှိနေပါတယ်။ [[mark:type-info]] ခလုတ်ကို order ဆိုတဲ့ anchor name ပေးပါမယ်။
      ပြီးတော့ info box ကို absolute ပေးတော့ သူက အတန်းထဲကနေ ထွက်သွားလို့၊ ခလုတ်က ညာဘက် အစွန်းကို
      ရွှေ့သွားပါမယ်။ info box ကို ခလုတ်နဲ့ ချိတ်ပြီး၊ 180 pixel ပုံသေ အကျယ်နဲ့ ခလုတ်ရဲ့ ညာဘက်မှာ
      ထားခိုင်းပါမယ်။ [[mark:after-info]] ဒီ position area က ညာဘက်ကို ပေးထားပေမယ့် နေရာ မကျန်ပါဘူး။
      ဒါကြောင့် browser က box ကို မူလ containing block ဖြစ်တဲ့ အတန်းထဲ ပြန်တွန်းထည့်လို့ ခလုတ်ကို
      ဖုံးသွားပါတယ်။ [[mark:type-flip]] position try fallbacks နဲ့ အစားထိုး နေရာ တစ်ခု ပေးပါမယ်။ flip
      inline က ခုနက နေရာကို ညာကနေ ဘယ်ကို ပြောင်းပြန် လှန်ပေးပါတယ်။ [[mark:after-flip]] အခု info box က နေရာ
      ဆံ့တဲ့ ခလုတ်ရဲ့ ဘယ်ဘက်ကို ရောက်သွားပါပြီ။ [[mark:explain-flips]] ဒီ flip inline လိုပဲ flip block က
      အပေါ်နဲ့ အောက်ကို လှန်ပေးပြီး၊ နှစ်ခု တွဲပေးရင် နှစ်ဘက်လုံး လှန်ပါတယ်။ flip start ကတော့
      ထောင့်ဖြတ်မျဉ်းအတိုင်း လှန်လို့ ညာဘက်က နေရာက အောက်ဘက်ကို ရောက်သွားပါတယ်။ စာရင်းထဲမှာ position area
      တန်ဖိုးတွေကိုလည်း comma ခြားပြီး ထည့်လို့ ရပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Fallback options"
        url: "https://web.dev/learn/css/anchor-positioning#fallback_options"
      - title: "MDN — position-try-fallbacks (flip-block, flip-inline, flip-start)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/position-try-fallbacks"
    actions:
      - id: close-overflow
        type: whiteboard.apply
        at: { mark: close-overflow }
        open: false
      # The scroll for this step is gone: the page is only 735 px tall, so in
      # a preview this tall there is nothing to scroll and no scroll event to
      # record.
      - id: type-info
        type: editor.type
        at: { mark: type-info }
        cadence: line-by-line
        target:
          {
            file: styles.css,
            after: ".nav-link:nth-child(3) {\n  anchor-name: --current;\n}\n",
            occurrence: 1,
          }
        text: "\n.edge-btn {\n  anchor-name: --order;\n}\n\n.info {\n  position: absolute;\n  position-anchor: --order;\n  width: 180px;\n  position-area: right;\n}\n"
      - id: expect-info
        type: expect.preview
        at: { mark: after-info }
        timeoutMs: 4000
        target: { by: testId, value: info }
        textContains: "မိနစ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-info-area
        type: editor.select
        at: { mark: after-info }
        target: { file: styles.css, text: "  position-area: right;", occurrence: 2 }
      - id: type-flip
        type: editor.type
        at: { mark: type-flip }
        cadence: fast-explainer
        target: { file: styles.css, after: "  position-area: right;\n", occurrence: 2 }
        text: "  position-try-fallbacks: flip-inline;\n"
      - id: expect-flip
        type: expect.preview
        at: { mark: after-flip }
        timeoutMs: 4000
        target: { by: testId, value: edge-button }
        textContains: "မှာမယ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-flip
        type: editor.select
        at: { mark: explain-flips }
        target: { file: styles.css, text: "flip-inline", occurrence: 1 }

  - id: more-control
    narration: >
      [[mark:open-more]] ပိုရှုပ်တဲ့ အခြေအနေတွေအတွက် ထိန်းလို့ ရတာတွေ ရှိပါသေးတယ်။ [[mark:draw-custom]]
      position try at-rule နဲ့ ကိုယ်ပိုင် နာမည် ပါတဲ့ အစားထိုး နေရာ တစ်ခု သတ်မှတ်လို့ ရပါတယ်။ သူ့ထဲမှာ
      position area၊ inset၊ margin နဲ့ အရွယ်အစားတွေ ပေးပြီး၊ နာမည်ကို fallback စာရင်းထဲ ထည့်ပါတယ်။
      [[mark:draw-order]] position try order က browser ရွေးပုံကို ပြောင်းပါတယ်။ ပထမဆုံး ဆံ့တဲ့ နေရာကို
      မယူဘဲ၊ အကျယ် အများဆုံး ဒါမှမဟုတ် အမြင့် အများဆုံး ရတဲ့ နေရာကို ယူပါတယ်။ position try shorthand ကတော့
      order နဲ့ fallback စာရင်းကို တစ်ခါတည်း ပေးပါတယ်။ [[mark:draw-scroll]] scroll ချောမွေ့အောင် browser က
      element ကို default anchor ရဲ့ scroll ကိုပဲ လိုက်ခိုင်းပါတယ်။ တခြား anchor တွေ ညွှန်းထားရင်တောင်ပါ။
      [[mark:draw-visibility]] position visibility ကတော့ anchor က scroll ထွက်သွားလို့ မမြင်ရတော့ရင်
      ချိတ်ထားတဲ့ element ကိုပါ ဖျောက်ပေးပါတယ်။ browser အသစ်တွေမှာ ဒါက default ဖြစ်ပေမယ့်၊ အဟောင်းတွေအတွက်
      ကိုယ်တိုင် ရေးထားပါ။
    sources:
      - title: "web.dev Learn CSS — Fallback order and scrolling"
        url: "https://web.dev/learn/css/anchor-positioning#fallback_order"
      - title: "MDN — @position-try"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/@position-try"
      - title: "MDN — position-try-order"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/position-try-order"
      - title: "MDN — position-visibility"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/position-visibility"
    actions:
      - id: open-more
        type: whiteboard.apply
        at: { mark: open-more }
        open: true
        clear: true
        upsertIds: [e-title]
      - id: draw-custom
        type: whiteboard.apply
        at: { mark: draw-custom }
        upsertIds: [e-custom, e-custom-2]
        drawMs: 1600
      - id: draw-order
        type: whiteboard.apply
        at: { mark: draw-order }
        upsertIds: [e-order, e-order-2]
        drawMs: 1600
      - id: draw-scroll
        type: whiteboard.apply
        at: { mark: draw-scroll }
        upsertIds: [e-scroll]
        drawMs: 1000
      - id: draw-visibility
        type: whiteboard.apply
        at: { mark: draw-visibility }
        upsertIds: [e-vis]
        drawMs: 1000

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:close-more]] page တစ်ခုလုံးကို နောက်တစ်ခါ ကြည့်ပါ။ ဒီမှာ မြင်ရတဲ့ label တိုင်းကို CSS
      သက်သက်နဲ့ပဲ နေရာချထားတာပါ။ anchor positioning ကို 2026 ခုနှစ် အစကတည်းက အဓိက browser အားလုံးမှာ
      သုံးလို့ ရနေပါပြီ။ [[mark:explain-support]] browser အဟောင်းတွေမှာတော့ label တွေ နေရာ မှားနေမှာမို့၊
      supports rule ထဲမှာ anchor မပါတဲ့ ရိုးရိုး fallback တစ်ခု ထားပေးပါ။ ဆောင်းပါး အဟောင်းတွေမှာ position
      area ကို inset area၊ position try fallbacks ကို position try options ဆိုတဲ့ နာမည်ဟောင်းနဲ့
      တွေ့ရနိုင်ပေမယ့်၊ အခု အလုပ် မလုပ်တော့ပါဘူး။ [[mark:open-quiz]] မေးခွန်း တစ်ခု မေးကြည့်ရအောင်။ anchor
      function ကို margin မှာ သုံးလို့ ရလား။ [[mark:quiz-answer]] မရပါဘူး။ သူ့ကို top၊ left လို inset
      property တွေမှာပဲ သုံးလို့ ရပါတယ်။ အရွယ်အစားနဲ့ margin အတွက်တော့ anchor size ရှိပါတယ်။
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ anchor name က anchor ကို နာမည်ပေးပြီး၊ position anchor က
      absolute element ကို သူနဲ့ ချိတ်ပေးပါတယ်။ position area ဒါမှမဟုတ် anchor function က နေရာချပေးပါတယ်။
      anchor scope က ထပ်သုံးတဲ့ component တွေကို မရောအောင် ခွဲထားပြီး၊ fallback တွေက နေရာ မဆံ့ရင် တခြား
      နေရာ ရှာပေးပါတယ်။ [[mark:next-lesson]] နောက် lesson မှာတော့ popover နဲ့ dialog ကို ကြည့်သွားပါမယ်။
      အဲဒီမှာ popover ကို ဖွင့်တဲ့ ခလုတ်က anchor name မပေးဘဲ အလိုလို popover ရဲ့ anchor ဖြစ်သွားတာကို
      တွေ့ရပါမယ်။
    sources:
      - title: "web.dev Learn CSS — Anchor positioning: check your understanding"
        url: "https://web.dev/learn/css/anchor-positioning#check_your_understanding"
      - title: "web.dev — New to the web platform in January 2026 (anchor positioning Baseline)"
        url: "https://web.dev/blog/web-platform-01-2026"
      - title: "MDN — @supports"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/@supports"
      - title: "Chrome for Developers — Introducing the CSS anchor positioning API (inset-area and position-try-options renames)"
        url: "https://developer.chrome.com/blog/anchor-positioning-api"
      - title: "web.dev Learn CSS — Anchor positioning: implicit tethers (next lesson)"
        url: "https://web.dev/learn/css/anchor-positioning#implicit_tethers"
    actions:
      - id: close-more
        type: whiteboard.apply
        at: { mark: close-more }
        open: false
      # The scroll for this step is gone: the page is only 735 px tall, so in
      # a preview this tall there is nothing to scroll and no scroll event to
      # record.
      - id: expect-final-tag
        type: expect.preview
        at: { mark: explain-support }
        timeoutMs: 4000
        target: { by: testId, value: tag }
        textContains: "ယနေ့အထူး"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-final-css
        type: expect.file
        at: { mark: open-quiz }
        path: styles.css
        contains: ".special-name {\n  anchor-name: --special;\n}\n\n.tag {\n  position: absolute;\n  position-anchor: --special;\n  position-area: top;\n  position-area: top right;\n  position-area: bottom span-right;\n  position-area: right;\n}\n\n.photo-card img {\n  anchor-name: --photo;\n}\n\n.new {\n  position: absolute;\n  position-anchor: --photo;\n  position-area: top span-left;\n}\n\n.photo-card {\n  anchor-scope: --photo;\n}\n"
      - id: expect-final-css-2
        type: expect.file
        at: { afterAction: expect-final-css }
        path: styles.css
        contains: ".bubble {\n  position: absolute;\n  position-anchor: --special;\n  bottom: anchor(top);\n  left: anchor(left);\n  left: anchor(center);\n}\n\n.nav-link:nth-child(1) {\n  anchor-name: --current;\n}\n\n.bar {\n  position: absolute;\n  position-anchor: --current;\n  top: anchor(bottom);\n  left: anchor(left);\n  width: anchor-size(width);\n}\n\n.nav-link:nth-child(3) {\n  anchor-name: --current;\n}\n\n.edge-btn {\n  anchor-name: --order;\n}\n\n.info {\n  position: absolute;\n  position-anchor: --order;\n  width: 180px;\n  position-area: right;\n  position-try-fallbacks: flip-inline;\n}\n"

checks:
  - { type: timing.p95Ms, max: 300 }
