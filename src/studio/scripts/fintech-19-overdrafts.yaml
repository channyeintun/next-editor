    files:
      flows.go: |
        package main

        import "fmt"

        const (
        	u1 = "liability:user:1042"
        	u2 = "liability:user:2077"
        )

        // move builds a two-line transaction: debit one account, credit the other.
        func move(id, memo, debit, credit string, amount int64) Tx {
        	return Tx{ID: id, Memo: memo, Lines: []Line{
        		{Account: debit, Debit: amount},
        		{Account: credit, Credit: amount},
        	}}
        }

        // funded returns a ledger in which user 1042 deposited 50.00 and user 2077 deposited 100.00.
        func funded() *Ledger {
        	l := &Ledger{}
        	must(l.Post(move("d1", "deposit", "asset:bank", u1, 5000)))
        	must(l.Post(move("d2", "deposit", "asset:bank", u2, 10000)))
        	return l
        }

        // settlement books what the outside world really paid out for the user.
        func settlement(id, user string, amount int64) Tx {
        	return move(id, "settlement", user, "asset:bank", amount)
        }

        func deposit(id, user string, amount int64) Tx {
        	return move(id, "deposit", "asset:bank", user, amount)
        }

        // writeOff books a debt we no longer expect to recover as a loss.
        func writeOff(id, user string, amount int64) Tx {
        	return move(id, "write-off", "expense:writeoff", user, amount)
        }

        func report(l *Ledger, label string) {
        	fmt.Printf("%s: user 1042 %s  bank %s  writeoff %s\n", label,
        		cents(l.Balance(u1)), cents(l.Balance("asset:bank")), cents(l.Balance("expense:writeoff")))
        }
      ledger.go: |
        package main

        import (
        	"fmt"
        	"strings"
        )

        // Line is one row of a transaction: an amount on the debit or the credit side of one account.
        type Line struct {
        	Account string
        	Debit   int64
        	Credit  int64
        }

        // Tx is one business event. All of its lines are posted together, or none of them.
        type Tx struct {
        	ID    string
        	Memo  string
        	Lines []Line
        }

        // Ledger is an append-only list of posted transactions. Balances are derived from it.
        type Ledger struct {
        	txs []Tx
        }

        // Post appends a transaction only if its debits equal its credits.
        func (l *Ledger) Post(tx Tx) error {
        	var debit, credit int64
        	for _, line := range tx.Lines {
        		debit += line.Debit
        		credit += line.Credit
        	}
        	if debit != credit {
        		return fmt.Errorf("tx %s is not balanced: debit %s, credit %s", tx.ID, cents(debit), cents(credit))
        	}
        	l.txs = append(l.txs, tx)
        	return nil
        }

        // Balance derives an account's balance on the side where that kind of account grows:
        // assets and expenses grow with debits; liabilities, equity and revenue grow with credits.
        func (l *Ledger) Balance(account string) int64 {
        	var debit, credit int64
        	for _, tx := range l.txs {
        		for _, line := range tx.Lines {
        			if line.Account == account {
        				debit += line.Debit
        				credit += line.Credit
        			}
        		}
        	}
        	if kind, _, _ := strings.Cut(account, ":"); kind == "asset" || kind == "expense" {
        		return debit - credit
        	}
        	return credit - debit
        }

        // must stops the program on an error that the example never expects.
        func must(err error) {
        	if err != nil {
        		panic(err)
        	}
        }

        // cents prints minor units as an amount with two decimals: cents(1234) is "12.34".
        func cents(n int64) string {
        	sign := ""
        	if n < 0 {
        		sign, n = "-", -n
        	}
        	return fmt.Sprintf("%s%d.%02d", sign, n/100, n%100)
        }
      main.go: |
        package main

        import "fmt"

        func main() {
        	// User 1042 has 50.00. A settlement of 80.00 arrives for them anyway.
        	var balance uint64 = 5000
        	balance -= 8000
        	fmt.Println("uint64 balance:", balance)
        }
