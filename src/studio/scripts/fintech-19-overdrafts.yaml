  - id: book
    chapter: Book လုပ်ပြီး ပြန်ယူ
    narration: >-
      [[mark:close-cannot]] overdraft ဖြစ်ပြီ ဆိုရင် ဖုံးမထားဘဲ book လုပ်ပြီး ထင်ထင်ရှားရှား ပြန်ယူရပါတယ်။
      [[mark:type-ledger]] ဒီတစ်ခါ signed balance ရှိတဲ့ ledger ပေါ်မှာ ယူရို ရှစ်ဆယ် settlement ကို
      အပြည့် post လုပ်ပါတယ်။ ပြီးတော့ user ရဲ့ နောက် deposit ယူရို နှစ်ဆယ်က အကြွေးကို ချေပါတယ်။
      ကျန်နေသေးတဲ့ အနုတ်ကိုတော့ ပြန်ရဖို့ မမျှော်လင့်တော့လို့ loss အဖြစ် write-off
      လုပ်ပါတယ်။ [[mark:run-3]] run လိုက်ရအောင်။ [[mark:pt-booked]] settlement ကို
      book လုပ်တော့ user ရဲ့ balance က အနုတ် သုံးဆယ်၊ ဘဏ်က ခုနစ်ဆယ် ဖြစ်ပြီး၊ ဒီတစ်ခါ ပေးစရာ
      ရှိတာနဲ့ ဘဏ်ထဲက ငွေ ကိုက်ပါတယ်။ [[mark:pt-netted]] deposit ရောက်တော့ အနုတ် ဆယ်ပဲ ကျန်ပါတယ်၊ ဒါက
      netting ပါ၊ နောက်ရောက်တဲ့ ငွေနဲ့ အကြွေးကို ချေတာပါ။ [[mark:pt-wo]] ကျန်တဲ့ ဆယ်ကို write-off
      လုပ်တော့ user က သုည ပြန်ဖြစ်ပြီး၊ expense ဘက်မှာ ယူရို ဆယ်ရဲ့ loss ကို မြင်ရပါတယ်။ [[mark:dock-3]]
      clamp နဲ့ ကွာတာက ဒီ loss က ပျောက်မသွားဘဲ entry တစ်ခု အနေနဲ့ ရှိနေတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Handling overdrafts (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#handling-overdrafts",
        }
      - {
          title: "Fintech Engineering Handbook — Accounting & ledgers (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#accounting-ledgers",
        }
    actions:
      - { id: close-cannot, type: slide.close, at: { mark: close-cannot } }
      - id: type-ledger
        type: editor.type
        at: { mark: type-ledger }
        target:
          {
            file: main.go,
            after: "\tfmt.Println(\"clamped: owed\", cents(owed), \"bank\", cents(bank), \"invented\", cents(gap))\n",
            occurrence: 1,
          }
        text: "\n\tl := funded()\n\tmust(l.Post(settlement(\"s1\", u1, 8000)))\n\treport(l, \"booked\")\n\tmust(l.Post(deposit(\"d3\", u1, 2000)))\n\treport(l, \"netted\")\n\tif b := l.Balance(u1); b < 0 {\n\t\tmust(l.Post(writeOff(\"w1\", u1, -b)))\n\t}\n\treport(l, \"written off\")\n"
        cadence: line-by-line
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "written off: user 1042 0.00",
          timeoutMs: 8000,
        }
      - {
          id: expect-file-writeoff,
          type: expect.file,
          at: { afterAction: run-3 },
          path: main.go,
          contains: 'must(l.Post(writeOff("w1", u1, -b)))',
        }
      - id: pt-booked
        type: console.point
        at: { mark: pt-booked }
        target: { text: "booked: user 1042 -30.00", occurrence: 1 }
      - id: pt-netted
        type: console.point
        at: { mark: pt-netted }
        target: { text: "netted: user 1042 -10.00", occurrence: 1 }
      - id: pt-wo
        type: console.point
        at: { mark: pt-wo }
        target: { text: "written off: user 1042 0.00", occurrence: 1 }
      - { id: dock-3, type: runtime.collapseDock, at: { mark: dock-3 } }

  - id: recover
    narration: >-
      [[mark:show-recover]] ပြန်ယူတဲ့ လမ်း သုံးလမ်းကို entry တွေနဲ့ ကြည့်ရအောင်။ [[mark:pt-s1]] အရင်ဆုံး
      overdraft ကို ဖြစ်တဲ့အတိုင်း book လုပ်ထားပါတယ်။ [[mark:recover-2]] ပထမ လမ်းက netting ပါ၊ user ရဲ့
      နောက် deposit တွေက အကြွေးကို အရင် ချေပါတယ်။ [[mark:recover-3]] ဒုတိယ လမ်းက user ကို ပြန်ဆပ်ဖို့
      တောင်းတာပါ။ တောင်းတာ ကိုယ်တိုင်က entry မဟုတ်ပါဘူး၊ ငွေ တကယ် ရောက်မှ deposit လိုပဲ book
      လုပ်ပါတယ်။ [[mark:recover-4]] တတိယ လမ်းက write-off ပါ။ expense ဒါမှမဟုတ် loss account ကို debit
      လုပ်တဲ့ compensating entry နဲ့ user ရဲ့ balance ကို ပိတ်ပါတယ်။ [[mark:pt-loss]] ဒီတော့ ဆုံးရှုံးမှုက
      report ထဲမှာ မြင်ရပြီး၊ ဘယ်ကနေ ဘယ်လို ဖြစ်လဲ ဆိုတာကို ledger က ပြောပြနိုင်ပါတယ်။
    sources:
