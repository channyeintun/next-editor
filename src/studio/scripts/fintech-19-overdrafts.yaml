  - id: try-it
    chapter: ကိုယ်တိုင် စမ်းကြည့်ပါ
    narration: >-
      [[mark:close-iv]] ကိုယ်တိုင် စမ်းကြည့်ဖို့ တစ်ခု ရှိပါတယ်။ [[mark:sel-try]] ledger ပေါ်က settlement
      ပမာဏကို user ရှိတဲ့ ယူရို ငါးဆယ်နဲ့ ညီအောင် ပြောင်းပြီး run ကြည့်ပါ။ balance က သုည ဖြစ်ပြီး
      deposit နောက်မှာ နှစ်ဆယ် ဖြစ်လာပြီး၊ write-off က ဘာမှ မလုပ်ပါဘူး။ [[mark:try-why]] code က balance
      အနုတ် ဖြစ်မှပဲ write-off လုပ်လို့ပါ။ [[mark:recap]] ပြန်ချုပ်ရရင်၊ overdraft ကို တားမြစ်ထားလို့
      ရပေမဲ့ ကိုယ်စားမပြုနိုင်အောင် လုပ်လို့ မရပါဘူး၊ ဖြစ်လာရင် book လုပ်ပြီး entry နဲ့ ပြန်ယူရပါတယ်။
      နောက် lesson မှာ ငွေရွှေ့တဲ့ request တစ်ခု timeout ဖြစ်လို့ retry လုပ်တဲ့အခါ ငွေ နှစ်ခါ
      မရွေ့အောင် idempotency key နဲ့ ဘယ်လို ကာကွယ်မလဲ ကြည့်ပါမယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Handling overdrafts (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#handling-overdrafts",
        }
      - {
          title: "Fintech Engineering Handbook — Idempotency (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#idempotency",
        }
    actions:
      - { id: close-iv, type: slide.close, at: { mark: close-iv } }
      - id: sel-try
        type: editor.select
        at: { mark: sel-try }
        target: { file: main.go, text: 'settlement("s1", u1, 8000)', occurrence: 1 }

checks:
