# Fintech Engineering, lesson 19: overdrafts (Burmese).
#
# Source: Fintech Engineering Handbook, "Handling overdrafts" and Appendix A "Write-off",
# "Chargeback" (CC BY 4.0, Voytek Pitula).
# Start state: main.go subtracts an 80.00 settlement from a 50.00 balance held in a uint64.
# ledger.go is the course ledger plus must(); flows.go has the two users, funded(), settlement,
# deposit, writeOff and report.
# Edits, all insert-only, in main.go:
#   1. a "never negative" balance column that clamps to zero   -> run-2: owed 100, bank 70, 30 invented
#   2. the same settlement on the signed ledger, a deposit netted, the rest written off
#                                                              -> run-3: -30.00, -10.00, 0.00 + 10.00 loss
# Figures: forced (settlement above the hold; a chargeback after the payout), cannot (crash, wrap,
# clamp; the right way), recover (book, net, ask, write off as entries), iv.
# Built by ~/Documents/fintech-course-work/tools/build-lesson.ts; fixtures by sim-go.ts --write.
schemaVersion: 1

lesson:
  slug: fintech-19-overdrafts
  title: "Fintech Engineering 19: Overdraft ကို ကိုင်တွယ်ခြင်း"
  locale: my-MM
