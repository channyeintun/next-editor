build:
  voiceProfile:
    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 9519

runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "uint64 balance: 18446744073709548616\n"
      run-2:
        status: success
        exitCode: 0
        output: "uint64 balance: 18446744073709548616\nclamped: owed 100.00 bank 70.00 invented 30.00\n"
      run-3:
        status: success
        exitCode: 0
        output: "uint64 balance: 18446744073709548616\nclamped: owed 100.00 bank 70.00 invented 30.00\nbooked: user 1042 -30.00  bank 70.00  writeoff 0.00\nnetted: user 1042 -10.00  bank 90.00  writeoff 0.00\nwritten off: user 1042 0.00  bank 90.00  writeoff 10.00\n"

scenes:
  - id: hook
    chapter: Balance အနုတ် ဖြစ်ခွင့် ရှိလား
    narration: >-
      policy အရ user ရဲ့ balance က အနုတ် မဖြစ်ရပါဘူး၊ ဒါပေမဲ့ မှန်ကန်တဲ့ system မှာတောင် အနုတ်
      ဖြစ်သွားတတ်ပါတယ်။ account balance အနုတ် ဖြစ်သွားတာကို overdraft လို့ ခေါ်ပါတယ်။ [[mark:kinds]]
      overdraft နှစ်မျိုး ရှိပါတယ်။ တစ်မျိုးက business က ရည်ရွယ်ပြီး ပေးတဲ့ credit product ပါ၊ limit နဲ့
      အတိုး ပါတဲ့ business feature ဖြစ်ပြီး သီးခြား account နဲ့ model လုပ်လေ့ ရှိပါတယ်၊ ဒီနေရာမှာ မပါပါဘူး။ ကျန်တစ်မျိုးက policy
      က တားထားရက်နဲ့ ဖြစ်သွားတာပါ။ [[mark:sel-uint]] ပထမဆုံး ပေါ်လာတတ်တဲ့ အကြံက အနုတ်ကို type ကနေ
      ပိတ်လိုက်ဖို့ပါ။ ဒီ balance က unsigned ကိန်းပြည့်ပါ၊ ယူရို ငါးဆယ် ရှိပါတယ်။ [[mark:sel-sub]] ယူရို
      ရှစ်ဆယ်ရဲ့ settlement တစ်ခု ရောက်လာလို့ နုတ်လိုက်ပါတယ်။ ဘာထွက်မလဲ ခန့်မှန်းကြည့်ပါ။
      [[mark:run-1]] run လိုက်ရအောင်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Handling overdrafts (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#handling-overdrafts",
        }
      - {
          title: "The Go Programming Language Specification — Integer overflow",
          url: "https://go.dev/ref/spec#Integer_overflow",
        }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }
      - id: sel-uint
        type: editor.select
        at: { mark: sel-uint }
        target: { file: main.go, text: "\tvar balance uint64 = 5000", occurrence: 1 }
      - id: sel-sub
        type: editor.select
        at: { mark: sel-sub }
        target: { file: main.go, text: "\tbalance -= 8000", occurrence: 1 }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "uint64 balance: 18446744073709548616",
          timeoutMs: 8000,
        }

  - id: read-1
    narration: >-
      [[mark:pt-uint]] error မတက်ဘဲ ဂဏန်း နှစ်ဆယ် လုံးရှိတဲ့ တန်ဖိုး ထွက်လာပါတယ်။ unsigned ကိန်းပြည့်က
      သုညအောက် ရောက်တော့ အမြင့်ဆုံး တန်ဖိုးဘက်ကို ပတ်သွားတာပါ။ [[mark:dock-1]] ဆင့်နဲ့ ရေတွက်ထားတာမို့
      user ဆီမှာ ယူရို ဂဏန်း ဆယ့်ရှစ်လုံးစာ ရှိနေတယ်လို့ system က ယုံသွားပါပြီ။ အနုတ် သုံးဆယ်
      ဖြစ်ရမယ့် balance က အပေါင်းဘက်မှာ ဂဏန်း အကြီးကြီး ဖြစ်သွားတာပါ။
    sources:
      - {
          title: "The Go Programming Language Specification — Integer overflow",
          url: "https://go.dev/ref/spec#Integer_overflow",
        }
    actions:
      - id: pt-uint
        type: console.point
        at: { mark: pt-uint }
        target: { text: "uint64 balance: 18446744073709548616", occurrence: 1 }
      - { id: dock-1, type: runtime.collapseDock, at: { mark: dock-1 } }

  - id: forced
    chapter: မှန်တဲ့ system မှာ ဘာလို့ ဖြစ်လဲ
    narration: >-
      [[mark:show-forced]] ဒါဆို balance ဘာလို့ အနုတ် ဖြစ်ရတာလဲ၊ အရင် lesson မှာ reservation ရှိတယ်
      မဟုတ်လား။ [[mark:pt-hold]] reservation က ခန့်မှန်းခြေ ပမာဏကိုပဲ hold လုပ်ပါတယ်။ [[mark:pt-paid]]
      rate ဒါမှမဟုတ် fee ပြောင်းလို့ settlement က hold ထက် ကြီးလာရင်၊ ငွေက အပြင်မှာ ထွက်သွားပြီးသားမို့
      ledger မှာ လက်ခံရုံကလွဲလို့ ရွေးစရာ မရှိပါဘူး။ [[mark:forced-2]] ဒုတိယ ဖြစ်ပုံက reversal ပါ၊ ဥပမာ
      cardholder ရဲ့ ဘဏ်က card payment ကို အတင်း ပြန်လှည့်တဲ့ chargeback ပါ။ card နဲ့ ယူရို
      ၁၀၀ deposit လုပ်ပြီး ထုတ်သွားပြီးမှ chargeback ရောက်လာရင်၊ [[mark:pt-n2]] ငွေ ထွက်သွားပြီးမှ
      ရောက်လာတာမို့ balance က အနုတ် ယူရို ၁၀၀ ဖြစ်ပါတယ်။ [[mark:forced-3]] ဆိုလိုတာက reservation က
      အနုတ် ဖြစ်နိုင်တဲ့ window ကို ကျဉ်းပေးပေမဲ့ ပိတ်ပေးနိုင်တာ မဟုတ်ပါဘူး။ အပြင်ဘက်က ကိုယ့်ကို ခွင့်
      မတောင်းပါဘူး။
    sources:
      - {
          title: "Fintech Engineering Handbook — Handling overdrafts (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#handling-overdrafts",
        }
      - {
          title: "Fintech Engineering Handbook — Payments, rails & cards (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#payments-rails-cards",
        }
    actions:
      - {
          id: show-forced,
          type: slide.show,
          at: { mark: show-forced, offsetMs: -700 },
          slideId: forced-1,
        }
      - {
          id: pt-forced-title,
          type: slide.point,
          at: { afterAction: show-forced },
          target: { x: 0.125, y: 0.184 },
        }
      - { id: pt-hold, type: slide.point, at: { mark: pt-hold }, target: { x: 0.147, y: 0.426 } }
