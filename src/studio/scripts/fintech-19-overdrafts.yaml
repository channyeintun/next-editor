  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] Fintech interview တွေမှာ balance column ပေါ်မှာ သုညနဲ့ အထက် ဖြစ်ရမယ် ဆိုတဲ့ CHECK
      constraint ထားသင့်လား လို့ မေးတတ်ပါတယ်။ ချက်ချင်း ထားမယ် လို့ မဖြေဘဲ အချက်
      သုံးချက်နဲ့ ဖြေပါ။ [[mark:iv-a]] ပထမ၊ hold ထက် ကြီးတဲ့ settlement၊ ငွေ ထွက်ပြီးမှ
      ရောက်လာတဲ့ chargeback လိုမျိုး အပြင်ဘက်က အနုတ်ကို အတင်း ဖြစ်စေနိုင်ပါတယ်။ [[mark:iv-b]] ဒုတိယ၊
      အနုတ်ကို ရေးလို့ မရတဲ့ system က crash ဖြစ်ပြီး ဖြစ်ပြီးသား fact ကို ပျောက်စေတာ၊ wrap ဖြစ်တာ၊ clamp
      လုပ်ပြီး ငွေ ဖန်တီးတာ တစ်ခုခု ဖြစ်ပါတယ်။ [[mark:iv-c]] တတိယ၊ balance သုညနဲ့ အထက် ဆိုတာ
      invariant ပါ၊ authorization မှာ စစ်ပြီး နောက်မှ monitor လုပ်ပါတယ်။ [[mark:iv-d]] ပြီးရင် ကိုယ် ဘာလုပ်မလဲ
      ဆက်ပြောပါ။ balance ကို signed ထားမယ်၊ overdraft ကို book လုပ်ပြီး alert ပေးမယ်၊ netting၊ repayment
      ဒါမှမဟုတ် write-off entry နဲ့ ပြန်ယူမယ် ဆိုတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Handling overdrafts (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#handling-overdrafts",
        }
    actions:
      - { id: show-iv, type: slide.show, at: { mark: show-iv, offsetMs: -700 }, slideId: iv-1 }
      - {
          id: pt-iv-q,
          type: slide.point,
