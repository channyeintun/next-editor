  - id: clamp
    chapter: Clamp က ငွေ ဖန်တီးတယ်
    narration: >-
      [[mark:close-forced]] unsigned type ကို ပြင်ဖို့ နောက်ထပ် ပေါ်လာတတ်တဲ့ အကြံက balance ကို သုညအောက်
      မရောက်အောင် ဖြတ်ချလိုက်တာပါ၊ ဒါကို clamp လုပ်တယ်လို့ ခေါ်ပါတယ်။ [[mark:type-clamp]] ဒီ code မှာ
      user နှစ်ယောက်ရဲ့ balance ကို column နဲ့ သိမ်းထားပြီး၊ ပထမ user ရဲ့ ယူရို ငါးဆယ်ထဲက ရှစ်ဆယ် နုတ်ပြီး
      သုညမှာ ဖြတ်ချပါတယ်။ ဘဏ်ကတော့ ယူရို ရှစ်ဆယ် အပြည့် ပေးပြီးသားပါ။ နောက်ဆုံးမှာ user တွေကို
      ပေးစရာ ရှိတဲ့ ငွေ စုစုပေါင်းနဲ့ ဘဏ်ထဲမှာ တကယ် ရှိတဲ့ ငွေကို ယှဉ်ပါတယ်။ [[mark:run-2]] run
      လိုက်ရအောင်။ [[mark:pt-clamp]] user တွေကို ယူရို ၁၀၀ ပေးစရာ ရှိတယ်လို့ ပြနေပေမဲ့ ဘဏ်ထဲမှာ
      ခုနစ်ဆယ်ပဲ ရှိပါတယ်။ user က ရှိတာထက် သုံးဆယ် ပိုထုတ်သွားပြီး အဲဒီ အကြွေးကို clamp က
      ဖျက်ပစ်လိုက်တော့၊ ကွာနေတဲ့ ယူရို သုံးဆယ်က ဘယ်ကမှ မလာတဲ့ ငွေ ဖြစ်သွားပါတယ်။ [[mark:dock-2]] ဒါက No
      invented data မူကို ချိုးတာပါ၊ ငွေကို မရှိဘဲ မဖန်တီးရဘူး ဆိုတာပါ။ accounting equation ပျက်သွားပြီး
      ဘယ်နေရာမှာ ပျက်လဲ ဆိုတာကိုလည်း ဘယ် record ကမှ မပြောနိုင်ပါဘူး။
    sources:
      - {
          title: "Fintech Engineering Handbook — Handling overdrafts (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#handling-overdrafts",
        }
      - {
          title: "Fintech Engineering Handbook — Principles (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#principles",
        }
    actions:
      - { id: close-forced, type: slide.close, at: { mark: close-forced } }
      - id: type-clamp
        type: editor.type
        at: { mark: type-clamp }
        target:
          { file: main.go, after: "\tfmt.Println(\"uint64 balance:\", balance)\n", occurrence: 1 }
        text: "\n\tcol := map[string]int64{u1: 5000, u2: 10000} // a \"never negative\" balance column\n\tcol[u1] = max(col[u1]-8000, 0)\n\tbank := int64(15000 - 8000) // the bank really paid out the whole 80.00\n\towed := col[u1] + col[u2]\n\tgap := owed - bank\n\tfmt.Println(\"clamped: owed\", cents(owed), \"bank\", cents(bank), \"invented\", cents(gap))\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "clamped: owed 100.00 bank 70.00 invented 30.00",
          timeoutMs: 8000,
        }
      - id: pt-clamp
        type: console.point
        at: { mark: pt-clamp }
        target: { text: "clamped: owed 100.00", occurrence: 1 }
      - { id: dock-2, type: runtime.collapseDock, at: { mark: dock-2 } }

  - id: cannot
    narration: >-
      [[mark:show-cannot]] ဒါက forbidden နဲ့ unrepresentable မတူဘူး ဆိုတဲ့ အချက်ပါ။ အနုတ်ကို ကိုယ်စား
      မပြုနိုင်တဲ့ system က အနုတ်ကို အတင်း လက်ခံရတဲ့အခါ မှားတဲ့ နည်း သုံးနည်းထဲက တစ်နည်းနဲ့ပဲ
      တုံ့ပြန်ပါတယ်။ [[mark:pt-crash]] ပထမက crash ပါ။ database မှာ balance သုညနဲ့ အထက် ဖြစ်ရမယ် ဆိုတဲ့
      CHECK constraint ထားရင် settlement ကို ရေးတဲ့ write က fail ပြီး flow က အလယ်မှာ ရပ်သွားပါတယ်။
      [[mark:pt-crash2]] ဘဏ်က ငွေ ပေးပြီးသားပါ၊ ledger ကသာ အဲဒီ fact ကို လက်မခံတော့ No lost data မူကို
      ချိုးပါတယ်၊ ငွေနဲ့ ပတ်သက်ပြီး ဖြစ်ခဲ့သမျှ မပျောက်ရဘူး ဆိုတာပါ။ [[mark:cannot-2]] ဒုတိယက wrap ပါ၊
      ခုနက unsigned ကိန်းပြည့်လို ပမာဏ အကြီးကြီး ဖြစ်သွားတာပါ။ [[mark:cannot-3]] တတိယက clamp ပါ၊
      ကြည့်ရတာ ပြဿနာ မရှိသလိုပဲ ဖြစ်ပေမဲ့ ငွေကို တိတ်တိတ်လေး ဖန်တီးပါတယ်။ [[mark:cannot-4]] မှန်တဲ့ နည်းက balance ကို
      signed ကိန်းပြည့်နဲ့ အနုတ်ပါ ရေးနိုင်အောင် ထားပြီး၊ သုညနဲ့ အထက် ဖြစ်ရမယ် ဆိုတာကို invariant
      တစ်ခုအဖြစ် ဆက်ဆံတာပါ။ ငွေထုတ်ခွင့် ပြုတဲ့ authorization မှာ runtime check နဲ့ စစ်ပြီး၊ နောက်မှ
      monitoring နဲ့ reconciliation နဲ့ ရှာပါတယ်၊ construction နဲ့ အတင်း မပိတ်ပါဘူး။ [[mark:pt-ok]]
      overdraft တစ်ခု တွေ့ရင် စစ်ဆေးရမယ့် signal ပါ၊ bug ဖြစ်ချင်မှ ဖြစ်ပါတယ်။ ဒါက No trust မူပါ၊
      ဘယ်သူ့ကိုမှ၊ ကိုယ့် component ကိုတောင် အလိုလို မယုံရဘူး ဆိုတာပါ။ ကိုယ့် check တွေ ဘာပဲ ပြောပြော
      အပြင်ဘက်က overdraft ကို အတင်း ဖြစ်စေနိုင်လို့ပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Handling overdrafts (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#handling-overdrafts",
