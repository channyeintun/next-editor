# Accessibility course (Burmese), lesson 19: manual testing.
#
# Hands-on lesson on the tea-shop page (base-axe workspace; panel modes
# tabs + contrast + axe). The page passes axe ("no issues" all lesson long)
# but fails five manual checks. Shape: board (what manual testing is: the
# keyboard / visual / content areas, pros and cons) → board (what a tool can
# check vs what needs a person; start from a trusted checklist) → the page:
# axe no issues, 5 tab stops (everything reachable), two failing contrast
# rows → keyboard: Tab once, focus moves but no ring → typed :focus-visible
# ring → Tab on: focus jumps back up to the featured card (moved first with
# CSS order) → typed override, visual order = DOM order → visual: pale
# Burmese link (2.67, no underline; axe skips the word) and the footer phone
# icon (1.62; axe never checks icons) fixed with typed CSS → zoom/reflow
# explained honestly (try it in your own browser) and text spacing shown
# with a pinned test style sheet: the special box clips its last line until
# its fixed height is released → board: content checks → recap → next:
# assistive technology (screen reader) testing.
#
# Start state (base.css section E, never typed or shown): `:focus { outline:
# none }`, `.featured { order: -1; grid-column: 1 / -1 }`, `.hero a` #b39478
# without underline, `.site-footer .call-link` #5c4433 on #3b2314, `.special
# { height: 9rem; overflow: hidden }`. text-spacing.css is pinned and linked
# by an inserted <link> in the spacing scene.
# Measured with research/smoke (headless Chrome 155, 432 × 720, drawer 40 %):
# axe 4.14.0 no issues (the Burmese link word is neither pass nor violation;
# link-in-text-block passes), tab stops 5, contrast 2.67 / 1.62; after the
# fixes 6.72 / 11.12, axe still no issues; with text-spacing.css the special
# box's scroll height 182 > 140 (last line cut by the border).
#
# Workspace: ws/ pinned byte-exact with tools/pin-files.ts (this file is the
# template; `bun ../../probe/build.ts template.yaml ws <slug>.yaml`).
# Validate with (from the repo root):
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   ~/Documents/a11y-course-work/tools/verify.sh <this file>
schemaVersion: 1

lesson:
  slug: a11y-course-19-manual-testing
  title: "Accessibility course 19: Manual testing"
  locale: my-MM
  workspace:
    lessonType: javascript
    name: Accessibility course 19
    entryFilePath: index.html
    files:
      axe.js: |
        // axe.js: pinned in the automated-testing lesson only (base-axe/package.json
        // installs axe-core). It hands axe to the A11y panel's "axe" mode; panel.js
        // never imports axe-core itself, so every other lesson installs without it.
        import axe from "axe-core";

        window.a11yPanelAxe = axe;
        window.dispatchEvent(new Event("a11y-panel-axe"));
      base.css: |
        /*
          base.css: pinned, never typed during a lesson.
          The shop's palette and page furniture, in its accessible form: every text
          colour passes WCAG AA, form fields have 3:1 borders, nothing hides focus.
          A lesson keeps the sections it needs and drops any declaration its own demo
          types or relies on being absent (COURSE-KIT.md, "Deriving a lesson
          workspace"). Section E holds the few rules a start state pins on purpose,
          including deliberately broken ones (a pale colour, a removed outline).
          Keep it free of the url, image-set and @-import functions (they switch on
          Vite's postcss step); images come from <img>.
        */

        /* == A. palette == */
        :root {
          color-scheme: light;
          --tea-dark: #3b2314;
          --tea: #8b5a2b;
          --tea-light: #c9a27e;
          --cream: #fff8ec;
          --paper: #fdf3e1;
          --leaf: #2f6b3a;
          --gold: #c9a227;
          --chili: #b23a2b;
          --ink: #2b1d14;
          --muted: #6b5a4c;
          --line: #e6d5bf;
          --field: #8a7866;
          --radius: 12px;
        }

        /* == B. page == */
        body {
          margin: 0;
          font-family: "Noto Sans Myanmar", "Myanmar Sangam MN", "Myanmar MN", "Myanmar Text", "Padauk",
            system-ui, sans-serif;
          font-size: 16px;
          line-height: 1.8;
          color: var(--ink);
          background: var(--paper);
        }

        .page {
          padding: 0 16px 24px;
        }

        h1,
        h2,
        h3 {
          margin: 0 0 8px;
          line-height: 1.5;
        }

        h1 {
          font-size: 22px;
        }

        h2 {
          font-size: 20px;
        }

        h3 {
          font-size: 17px;
        }

        a {
          color: var(--tea);
        }

        /* A class that sets display must never un-hide a [hidden] element. */
        [hidden] {
          display: none !important;
        }

        /* Text for screen readers only (the forms and images lessons use it). */
        .visually-hidden {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip-path: inset(50%);
          white-space: nowrap;
        }

        /* == B2. reset == */
        *,
        *::before,
        *::after {
          box-sizing: border-box;
        }

        /* == C. furniture == */
        .skip-link {
          position: absolute;
          top: -48px;
          left: 8px;
          padding: 4px 12px;
          background: var(--cream);
          color: var(--tea-dark);
        }

        .skip-link:focus {
          top: 8px;
        }

        .site-header {
          padding: 12px 16px;
          background: var(--tea-dark);
          color: var(--cream);
        }

        .site-header a {
          color: var(--cream);
        }

        .brand {
          display: flex;
          align-items: center;
          gap: 8px;
        }

        .logo {
          display: block;
        }

        .shop-name {
          margin: 0;
          flex: 1;
        }

        .call-link {
          display: inline-flex;
          padding: 8px;
          border-radius: 999px;
          background: var(--tea);
        }

        .call-link img {
          display: block;
        }

        .tagline {
          margin: 0;
          color: var(--tea-light);
          font-size: 14px;
        }

        .nav ul {
          display: flex;
          gap: 16px;
          margin: 4px 0 0;
          padding: 0;
          list-style: none;
        }

        .hero {
          margin: 16px 0;
          padding: 16px;
          background: var(--cream);
          border-radius: var(--radius);
        }

        .divider {
          display: block;
          max-width: 100%;
          height: auto;
          margin: 0 auto 16px;
        }

        .menu {
          margin: 0;
          padding: 0;
          list-style: none;
        }

        .menu-card {
          margin: 0 0 12px;
          padding: 12px 16px;
          background: #fff;
          border: 1px solid var(--line);
          border-radius: var(--radius);
        }

        .menu-card .name,
        .menu-card .desc {
          margin: 0;
        }

        .menu-card .desc {
          color: var(--muted);
          font-size: 14px;
        }

        .price {
          font-weight: 700;
          color: var(--tea);
        }

        .status {
          margin-left: 8px;
          color: var(--chili);
          font-size: 14px;
        }

        .sold-out .name {
          text-decoration: line-through;
        }

        .order-link,
        .order-btn,
        .confirm-btn,
        .disclosure,
        .fav,
        .confirm button {
          display: inline-block;
          padding: 6px 16px;
          border: 0;
          border-radius: 999px;
          background: var(--tea);
          color: #fff;
          font: inherit;
          text-decoration: none;
        }

        .fav {
          margin-left: 8px;
          padding: 0 12px;
          font-size: 14px;
        }

        .fav[aria-pressed="true"] {
          background: var(--leaf);
        }

        .tea-options {
          margin: 16px 0;
        }

        .chips {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
          margin: 12px 0 0;
          padding: 0;
          list-style: none;
        }

        .chips li {
          padding: 2px 12px;
          border: 1px solid var(--field);
          border-radius: 999px;
          background: #fff;
        }

        .gallery figure {
          margin: 0 0 12px;
        }

        .gallery img {
          display: block;
          max-width: 100%;
          height: auto;
          border-radius: var(--radius);
        }

        figcaption {
          color: var(--muted);
          font-size: 14px;
        }

        .quote {
          margin: 16px 0;
          padding: 8px 16px;
          border-left: 4px solid var(--tea);
          background: var(--cream);
          font-style: italic;
        }

        .quote p {
          margin: 0;
        }

        .hours-table {
          width: 100%;
          border-collapse: collapse;
          background: #fff;
        }

        .hours-table caption {
          text-align: start;
          color: var(--muted);
          font-size: 14px;
        }

        .hours-table th,
        .hours-table td {
          padding: 4px 8px;
          border: 1px solid var(--line);
          text-align: start;
        }

        .hours-table thead th {
          background: var(--cream);
        }

        .location {
          margin: 16px 0;
        }

        .map {
          position: relative;
          height: 120px;
          border: 1px solid var(--field);
          border-radius: var(--radius);
          background:
            linear-gradient(90deg, transparent 46%, #fff 46%, #fff 54%, transparent 54%),
            linear-gradient(0deg, transparent 40%, #fff 40%, #fff 50%, transparent 50%),
            #d9e8c9;
        }

        .map-pin {
          position: absolute;
          top: 34px;
          left: 56%;
          width: 18px;
          height: 18px;
          border: 3px solid #fff;
          border-radius: 50%;
          background: var(--chili);
        }

        .address {
          margin: 4px 0 0;
        }

        .order-form {
          margin: 16px 0;
        }

        .order-form label {
          display: block;
          margin-top: 8px;
        }

        .order-form input[type="text"],
        .order-form input[type="tel"],
        .order-form input[type="number"] {
          width: 100%;
          padding: 6px 10px;
          border: 1px solid var(--field);
          border-radius: 8px;
          background: #fff;
          font: inherit;
        }

        .hint {
          margin: 2px 0 0;
          color: var(--muted);
          font-size: 14px;
        }

        .sugar {
          margin: 12px 0 0;
          padding: 4px 12px 8px;
          border: 1px solid var(--field);
          border-radius: 8px;
        }

        .sugar label {
          display: inline-block;
          margin: 0 12px 0 0;
        }

        .order-btn {
          margin-top: 12px;
        }

        .error {
          margin: 2px 0 0;
          color: var(--chili);
          font-size: 14px;
        }

        .alert {
          margin: 8px 0 0;
          padding: 8px 12px;
          border-radius: 8px;
          background: #fde8e4;
          color: var(--chili);
        }

        .order-status {
          min-height: 1.8em;
          margin: 8px 0 0;
          color: var(--leaf);
          font-weight: 700;
        }

        .confirm {
          margin: 16px auto auto;
          max-width: 320px;
          padding: 16px;
          border: 0;
          border-radius: var(--radius);
          background: var(--cream);
          color: var(--ink);
        }

        .confirm::backdrop {
          background: rgb(0 0 0 / 0.25);
        }

        .confirm form {
          display: flex;
          gap: 8px;
        }

        .site-footer {
          margin-top: 24px;
          padding: 16px;
          background: var(--tea-dark);
          color: var(--cream);
          font-size: 14px;
        }

        .site-footer p {
          margin: 0;
        }

        .site-footer a {
          color: var(--cream);
        }

        .menu {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 12px;
        }

        .menu .menu-card {
          margin: 0;
        }

        .menu-card .name a {
          color: var(--ink);
        }

        .special {
          margin: 16px 0;
          padding: 12px 16px;
          border: 2px solid var(--gold);
          border-radius: var(--radius);
          background: #fff;
        }

        .special h2,
        .special p {
          margin: 0;
        }

        .call-link {
          margin-top: 8px;
          background: none;
        }

        /* == D. helpers == */
        /* .demo shows a box's edges without changing layout (outline takes no space). */
        .demo {
          outline: 1px dashed var(--muted);
        }

        /* == E. lesson rules == */
        /* Lesson 19 start state (deliberate problems, never typed or shown):
           1. every focus ring is removed;
           2. the featured card is moved to the top with CSS, so the visual order
              runs against the DOM (and Tab) order;
           3. the drinks link in the hero is pale and has no underline;
           4. the footer phone icon is almost the colour of the footer;
           5. the special box has a fixed height that clips its text. */
        :focus {
          outline: none;
        }

        .featured {
          order: -1;
          grid-column: 1 / -1;
        }

        .hero a {
          color: #b39478;
          text-decoration: none;
        }

        .site-footer .call-link {
          color: #5c4433;
        }

        .special {
          height: 9rem;
          overflow: hidden;
        }
      index.html: |
        <!doctype html>
        <html lang="my">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <link rel="icon" href="data:," />
            <title>ရွှေလက်ဖက်ရည်ဆိုင်</title>
            <link rel="stylesheet" href="/base.css" />
            <link rel="stylesheet" href="/styles.css" />
          </head>
          <body>
            <header class="site-header" data-testid="site-header">
              <div class="brand">
                <img class="logo" src="/cup.svg" alt="" width="40" height="40" data-testid="logo" />
                <h1 class="shop-name" data-testid="shop-name">ရွှေလက်ဖက်ရည်ဆိုင်</h1>
              </div>
              <p class="tagline" lang="en">Yangon · since 1998</p>
            </header>

            <main class="page" id="main" data-testid="main">
              <section class="hero" data-testid="hero">
