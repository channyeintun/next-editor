            <footer class="site-footer" data-testid="footer">
              <p>အမှတ် ၁၂၊ ဗဟန်း၊ ရန်ကုန်</p>
              <a class="call-link" href="tel:+959123456789" aria-label="ဖုန်းဆက်ရန်" data-contrast data-contrast-label="ဖုန်း icon" data-testid="call-link"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 3.5l2.6-.6 1.6 4.2-2 1.4a11 11 0 0 0 6.7 6.7l1.4-2 4.2 1.6-.6 2.6a2 2 0 0 1-2 1.6A15.5 15.5 0 0 1 3.5 4.9a2 2 0 0 1 1.6-2z" fill="currentColor"/></svg></a>
