build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 2619

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  - id: intro
    chapter: "Manual testing ဆိုတာ ဘာလဲ"
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ axe နဲ့ ပြဿနာ ရှစ်ခုကို သုည ဖြစ်အောင် ပြင်ခဲ့ပေမယ့်၊ tool မမြင်တဲ့
      ပြဿနာတွေ ကျန်ခဲ့တာကို တွေ့ခဲ့ပါတယ်။ ဒီ lesson မှာ အဲဒီလို ပြဿနာတွေကို လူကိုယ်တိုင်
      ရှာတဲ့ manual testing ကို လုပ်ကြည့်ပါမယ်။ [[mark:start-server]] manual testing ဆိုတာ
      tool မစစ်နိုင်တဲ့ အရာတွေကို လူတစ်ယောက်က checklist တစ်ခုနဲ့ လိုက်စစ်တာပါ။
      [[mark:draw-areas]] အဓိက နယ်ပယ် သုံးခု ရှိပါတယ်။ mouse ကို ဘေးချထားပြီး keyboard နဲ့ပဲ
      သုံးကြည့်တဲ့ keyboard စစ်ချက်၊ အရောင်၊ အကွာအဝေး၊ zoom လို မျက်စိနဲ့ မြင်ရတာတွေကို စစ်တဲ့
      visual စစ်ချက်၊ ပြီးတော့ ခေါင်းစဉ်၊ link၊ alt text လို စာသားတွေကို စစ်တဲ့ content
      စစ်ချက်တို့ ဖြစ်ပါတယ်။ [[mark:draw-pros]] manual testing က တော်တော် မြန်မြန် လုပ်လို့
      ရပြီး၊ tool သီးသန့်လည်း သိပ် မလိုပါဘူး။ automated tool တစ်ခုတည်း သုံးတာထက် ပြဿနာ
      ပိုများများ တွေ့ပါတယ်။ [[mark:draw-cons]] ဒါပေမဲ့ automated testing ထက် အချိန်
      ပိုကုန်ပြီး၊ page အများကြီးမှာ ထပ်ခါထပ်ခါ လုပ်ဖို့ ခက်ပါတယ်။ ရလဒ်ကို နားလည်ဖို့
      accessibility အသိလည်း ပိုလိုပါတယ်။ [[mark:draw-both]] ဒါကြောင့် တစ်ခုက တစ်ခုကို
      အစားထိုးတာ မဟုတ်ဘဲ၊ automated နဲ့ manual နှစ်ခုလုံးကို တွဲသုံးရပါတယ်။
    sources:
      - title: "web.dev Learn Accessibility — Manual accessibility testing (Manual testing basics)"
        url: "https://web.dev/learn/accessibility/test-manual"
    actions:
      - id: open-board-a
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      # Boot + pnpm install (axe-core included) + vite run under the two
      # opening boards; waitForReady sits on the preview mark ~2 min later.
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 90000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-areas
        type: whiteboard.apply
        at: { mark: draw-areas }
        upsertIds: [a-kbd, a-vis, a-con]
        drawMs: 2400
      - id: draw-pros
        type: whiteboard.apply
        at: { mark: draw-pros }
        upsertIds: [a-pros]
        drawMs: 1800
      - id: draw-cons
        type: whiteboard.apply
        at: { mark: draw-cons }
        upsertIds: [a-cons]
        drawMs: 1800
      - id: draw-both
        type: whiteboard.apply
        at: { mark: draw-both }
        upsertIds: [a-both, a-both-line]
        drawMs: 1600

  - id: tool-vs-human
    chapter: "Tool က စစ်နိုင်တာ၊ လူ လိုတာ"
    narration: >
      [[mark:board-split]] ဘာကို tool က စစ်နိုင်ပြီး၊ ဘာအတွက် လူ လိုလဲ ဆိုတာ ယှဉ်ကြည့်ရအောင်။
      [[mark:draw-row-contrast]] နောက်ခံ တစ်ရောင်တည်းပေါ်က စာရဲ့ contrast ကို tool က
      တိုင်းနိုင်ပေမယ့်၊ ပုံ ဒါမှမဟုတ် gradient ပေါ်က စာကိုတော့ လူက ကြည့်စစ်ရပါတယ်။
      [[mark:draw-row-alt]] alt text ရှိလား ဆိုတာ tool က သိပေမယ့်၊ မှန်လား၊ အသုံးဝင်လား ဆိုတာ
      လူကပဲ ဆုံးဖြတ်နိုင်ပါတယ်။ [[mark:draw-row-heading]] heading၊ list၊ landmark ရှိလား ဆိုတာ
      tool က ရှာနိုင်ပေမယ့်၊ မှန်မှန်ကန်ကန် သုံးထားလား ဆိုတာကိုတော့ လူက စစ်ရပါတယ်။
      [[mark:draw-row-focus]] focus ရနိုင်တဲ့ element တွေကို tool က ရှာနိုင်ပေမယ့်၊ focus အစဉ်
      ယုတ္တိ ရှိလား၊ focus ring ကို မျက်စိနဲ့ မြင်ရလား ဆိုတာကတော့ keyboard နဲ့ ကိုယ်တိုင်
      သုံးကြည့်မှ သိရပါတယ်။ [[mark:draw-checklist]] ကိုယ်တိုင် စစ်တဲ့အခါ ယုံကြည်ရတဲ့ နေရာက
      checklist တစ်ခုကနေ စပြီး၊ ကိုယ့် product နဲ့ ကိုယ့် team အတွက် ကိုယ်ပိုင် checklist
      လုပ်ထားရင် ကောင်းပါတယ်။
    sources:
      - title: "web.dev Learn Accessibility — Manual accessibility testing (can and can't be automated)"
        url: "https://web.dev/learn/accessibility/test-manual"
      - title: "IBM Equal Access Toolkit — Verify: manual testing checklist"
        url: "https://www.ibm.com/able/toolkit/verify/manual"
    actions:
      - id: board-split
        type: whiteboard.apply
        at: { mark: board-split }
        clear: true
        upsertIds: [b-title, b-head-tool, b-head-human]
      - id: draw-row-contrast
        type: whiteboard.apply
        at: { mark: draw-row-contrast }
        upsertIds: [b-tool-1, b-human-1]
        drawMs: 1600
      - id: draw-row-alt
        type: whiteboard.apply
        at: { mark: draw-row-alt }
        upsertIds: [b-tool-2, b-human-2]
        drawMs: 1400
      - id: draw-row-heading
        type: whiteboard.apply
        at: { mark: draw-row-heading }
        upsertIds: [b-tool-3, b-human-3]
        drawMs: 1400
      - id: draw-row-focus
        type: whiteboard.apply
        at: { mark: draw-row-focus }
        upsertIds: [b-tool-4, b-human-4]
        drawMs: 1400
      - id: draw-checklist
        type: whiteboard.apply
        at: { mark: draw-checklist }
        upsertIds: [b-checklist]
        drawMs: 1600

  - id: first-look
    chapter: "axe က ဘာမှ မတွေ့တဲ့ page"
    narration: >
      [[mark:close-split]] ဒါဆို ဆိုင်ရဲ့ page ကို စစ်ကြည့်ရအောင်။ [[mark:preview-opens]]
      ညာဘက်မှာ ဆိုင်ရဲ့ page ကို မြင်ရပါပြီ။ မျက်စိနဲ့ ကြည့်ရင် သပ်သပ်ရပ်ရပ် ရှိပါတယ်။
      [[mark:read-axe]] panel ရဲ့ အောက်ဆုံးကို ကြည့်ပါ။ axe က ဒီ page မှာ ပြဿနာ တစ်ခုမှ
      မတွေ့ပါဘူး။ [[mark:read-tabs]] အပေါ်ဆုံးက tab order စာရင်းမှာ link ငါးခု ရှိပြီး၊ page
      ပေါ်မှာလည်း နံပါတ် badge လေးတွေ ပေါ်နေပါတယ်။ link တိုင်း စာရင်းထဲ ပါနေလို့၊ mouse မပါဘဲ
      အကုန် ရောက်နိုင်တယ် ဆိုတာ သိရပါတယ်။ ဒါက ပထမ keyboard စစ်ချက်ပါ။ [[mark:read-contrast]]
      အလယ်က contrast row နှစ်ခုကိုတော့ နောက်မှ ပြန်လာကြည့်ပါမယ်။ mouse ကို ဘေးချပြီး keyboard
      စစ်ချက်ကနေ ဆက်ကြည့်ရအောင်။
    sources:
      - title: "web.dev Learn Accessibility — Manual accessibility testing (Demo)"
        url: "https://web.dev/learn/accessibility/test-manual"
    actions:
      - id: close-split
        type: whiteboard.apply
        at: { mark: close-split }
        open: false
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { mark: preview-opens }
        timeoutMs: 45000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-dev-server }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-axe-clean
        type: expect.preview
        at: { mark: read-axe }
        timeoutMs: 8000
        target: { by: testId, value: axe-count }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 1500 }
      - id: expect-five-stops
        type: expect.preview
        at: { mark: read-tabs }
        timeoutMs: 5000
        target: { by: testId, value: tab-count }
        attribute: { name: data-count, value: "5" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: focus-visible
    chapter: "Keyboard: focus ကို မြင်ရလား"
    narration: >
      keyboard နဲ့ စစ်တဲ့အခါ Tab key နဲ့ ရှေ့ကို၊ Shift နဲ့ Tab နဲ့ နောက်ကို သွားပါတယ်။ Enter
      နဲ့ link ကို ဖွင့်ပြီး၊ Space နဲ့ ခလုတ်ကို နှိပ်တာ၊ page ကို ဆင်းတာ လုပ်နိုင်ပါတယ်။
      arrow key နဲ့ ဆက်စပ်နေတဲ့ control တွေကြား ရွှေ့ပြီး၊ Escape နဲ့ ပေါ်လာတဲ့ အရာကို
      ပိတ်ပါတယ်။ lesson ထဲမှာ key တကယ် နှိပ်လို့ မရလို့၊ panel ကနေ Tab နှိပ်သလို focus ကို
      ရွှေ့ပါမယ်။ [[mark:tab-one]] Tab တစ်ချက် နှိပ်လိုက်ပါမယ်။ [[mark:after-tab-one]] panel
      မှာ ပထမ link ကို focused လို့ ပြပြီး၊ badge လည်း အနီ ဖြစ်သွားပါပြီ။ ဒါပေမဲ့ page ပေါ်က
      link မှာ ဘာ ဘောင်မှ မပေါ်ပါဘူး။ keyboard သုံးသူအတွက် ကိုယ် ဘယ်ရောက်နေလဲ မသိရတော့ပါဘူး။
      CSS ထဲ တစ်နေရာမှာ focus ring ကို ဖျောက်ထားလို့ပါ။ ကိုယ့် code မှာဆိုရင် အဲဒီ rule ကို ရှာပြီး
      ဖျက်ပစ်ပါ။ [[mark:open-styles]] ဒီမှာတော့ styles ဖိုင်မှာ focus visible အတွက် ကိုယ်ပိုင် ring
      တစ်ခု ထည့်ပါမယ်။ [[mark:type-ring]] အညိုရင့် ဘောင်
      အထူ ဖြစ်ပြီး၊ element နဲ့ နည်းနည်း ခွာထားပါမယ်။ focus visible ဆိုတာ keyboard နဲ့ focus
      ရောက်လာလို့ browser က ring ပြသင့်တယ်လို့ ဆုံးဖြတ်တဲ့ အခြေအနေပါ။ [[mark:after-ring]]
      ကြည့်ပါ၊ focus ရောက်နေတဲ့ link ပတ်လည်မှာ ring ပေါ်လာပါပြီ။
    sources:
      - title: "web.dev Learn Accessibility — Manual accessibility testing (Keyboard checks, Issue 1)"
        url: "https://web.dev/learn/accessibility/test-manual"
      - title: "WCAG 2.2 — Understanding 2.4.7 Focus Visible"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/focus-visible.html"
      - title: "MDN — :focus-visible"
        url: "https://developer.mozilla.org/docs/Web/CSS/:focus-visible"
    actions:
      - id: tab-one
        type: preview.click
        at: { mark: tab-one }
        timeoutMs: 5000
        target: { by: testId, value: a11y-tab-next }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-tab-one
        type: expect.preview
        at: { mark: after-tab-one }
        timeoutMs: 5000
        target: { by: testId, value: tab-drinks-link }
        textContains: '1 link "သောက်စရာ" focused'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: open-styles
        type: workspace.openFile
        at: { mark: open-styles }
        path: styles.css
      - id: type-ring
        type: editor.type
        at: { mark: type-ring }
        cadence: fast-explainer
        target: { file: styles.css, after: "", occurrence: 1 }
        text: ":focus-visible {\n  outline: 3px solid var(--tea-dark);\n  outline-offset: 2px;\n}\n"
      - id: expect-still-focused
        type: expect.preview
        at: { mark: after-ring }
        timeoutMs: 5000
        target: { by: testId, value: tab-drinks-link }
        textContains: '1 link "သောက်စရာ" focused'
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: focus-order
    chapter: "Keyboard: focus အစဉ် မှန်လား"
    narration: >
      [[mark:scroll-cards]] နောက် keyboard စစ်ချက်က focus အစဉ် ယုတ္တိ ရှိလား ဆိုတာပါ။
      [[mark:tab-two]] Tab ဆက်နှိပ်ကြည့်ရအောင်။ focus က menu ရဲ့ ဒုတိယ တန်းက ကော်ဖီကို
      ရောက်သွားပါတယ်။ [[mark:tab-three]] ပြီးတော့ ဘေးက သံပုရာရည်ကို ရောက်ပါတယ်။
      [[mark:tab-four]] နောက်တစ်ချက်မှာတော့ အပေါ်ဆုံးက လက်ဖက်ရည်ဆီ ပြန်တက်သွားပါတယ်။
      [[mark:after-tab-four]] မျက်စိနဲ့ ဖတ်တဲ့ အစဉ်မှာ လက်ဖက်ရည်က ပထမ ဖြစ်ပေမယ့်၊ Tab ကတော့
      HTML ထဲက အစဉ်အတိုင်း သွားလို့ပါ။ HTML မှာ လက်ဖက်ရည် card က နောက်ဆုံးမှာ ရှိပြီး၊ CSS ကနေ
      အပေါ်ကို ရွှေ့ထားတာပါ။ [[mark:type-order]] CSS နဲ့ ရွှေ့ထားတာကို ပယ်ဖျက်တဲ့ rule တစ်ခု
      ထည့်ပါမယ်။ [[mark:after-order]] အခု card က အောက်ဆုံးကို ရောက်သွားလို့၊ မြင်ရတဲ့ အစဉ်နဲ့
      Tab အစဉ် တူသွားပါပြီ။ လက်ဖက်ရည်ကို ရှေ့ဆုံးမှာ ထားချင်ရင်တော့ HTML ထဲမှာ card ကို
      ရှေ့ဆုံး ရွှေ့ရပါမယ်။ ကိုယ့် page မှာဆိုရင် focus ပိတ်မိနေတဲ့ နေရာ ရှိလား၊ dialog
      ပိတ်ရင် focus က နေရာမှန် ပြန်ရောက်လား၊ skip link ရှိလား ဆိုတာတွေကိုလည်း keyboard နဲ့
      စစ်ပါ။
    sources:
      - title: "web.dev Learn Accessibility — Manual accessibility testing (Keyboard checks, Issue 2)"
        url: "https://web.dev/learn/accessibility/test-manual"
      - title: "WCAG 2.2 — Understanding 2.4.3 Focus Order"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/focus-order.html"
      - title: "MDN — CSS order and accessibility"
        url: "https://developer.mozilla.org/docs/Web/CSS/order#accessibility"
    actions:
      - id: scroll-cards
        type: preview.scroll
        at: { mark: scroll-cards }
        timeoutMs: 5000
        top: 100
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: tab-two
        type: preview.click
        at: { mark: tab-two }
        timeoutMs: 5000
        target: { by: testId, value: a11y-tab-next }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-tab-two
        type: expect.preview
        at: { afterAction: tab-two }
        timeoutMs: 5000
        target: { by: testId, value: tab-link-coffee }
        textContains: '2 link "ကော်ဖီ" focused'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: tab-three
        type: preview.click
        at: { mark: tab-three }
        timeoutMs: 5000
        target: { by: testId, value: a11y-tab-next }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: tab-four
        type: preview.click
        at: { mark: tab-four }
        timeoutMs: 5000
        target: { by: testId, value: a11y-tab-next }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-tab-four
        type: expect.preview
        at: { mark: after-tab-four }
        timeoutMs: 5000
        target: { by: testId, value: tab-link-laphet-yay }
        textContains: '4 link "လက်ဖက်ရည်" focused'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-order
        type: editor.type
        at: { mark: type-order }
        cadence: fast-explainer
        target: { file: styles.css, after: "  outline-offset: 2px;\n}\n", occurrence: 1 }
        text: "\n.featured {\n  order: 0;\n}\n"
      - id: expect-order-focus
        type: expect.preview
        at: { mark: after-order }
        timeoutMs: 5000
        target: { by: testId, value: tab-link-laphet-yay }
        textContains: '4 link "လက်ဖက်ရည်" focused'
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: contrast
    chapter: "မျက်စိနဲ့ စစ်ရအောင်: link နဲ့ icon"
    narration: >
      [[mark:read-link-row]] ဒါဆို visual စစ်ချက်ကို ဆက်ရအောင်။ ကြိုဆိုတဲ့ စာထဲက သောက်စရာ link
      ကို ကြည့်ပါ။ အရောင် ဖျော့နေပြီး underline လည်း မပါလို့၊ link မှန်း သိဖို့ ခက်ပါတယ်။
      contrast row ကလည်း ၂.၆၇ နဲ့ ၁ နဲ့ fail လို့ ပြနေပါတယ်။ ဒါပေမဲ့ axe ကတော့ ဒီ မြန်မာ
      စကားလုံးကို ကျော်သွားလို့ ဘာမှ မပြောပါဘူး။ ပြီးခဲ့တဲ့ lesson က တွေ့ခဲ့တဲ့ blind spot
      အတိုင်းပါပဲ။ [[mark:type-link]] link ကို အညိုရင့် ပေးပြီး underline ပြန်ထည့်ပါမယ်။
      underline ပါရင် အရောင် တစ်ခုတည်းကို မမှီဘဲ link မှန်း သိနိုင်ပါတယ်။ underline မပါတဲ့
      link ဆိုရင်တော့ နောက်ခံနဲ့တင် မကဘဲ ဘေးက စာသားနဲ့လည်း အနည်းဆုံး ၃ နဲ့ ၁ ကွာရပါမယ်။
      underline ထည့်တာက အရှင်းဆုံး နည်းပါ။ [[mark:after-link]] row က ၆.၇၂ နဲ့ ၁ ဖြစ်ပြီး pass
      ပါပြီ။ [[mark:scroll-footer]] footer က ဖုန်း icon ကိုလည်း ကြည့်ပါ။ နောက်ခံနဲ့ အရောင်
      နီးနေလို့ မြင်ရ ခက်ပြီး၊ row ကလည်း ၁.၆၂ နဲ့ ၁ ပဲ ပြပါတယ်။ အရေးကြီးတဲ့ icon တွေက
      နောက်ခံနဲ့ အနည်းဆုံး ၃ နဲ့ ၁ ရှိရပါမယ်။ axe ရဲ့ contrast rule က စာသားကိုပဲ စစ်လို့ icon
      ကို လုံးဝ မကြည့်ပါဘူး။ [[mark:type-icon]] icon ကို ခရင်မ်ရောင် အဖျော့ ပေးလိုက်ပါမယ်။
      footer ရဲ့ နောက်ခံက အညိုရင့် ဖြစ်လို့ အဖျော့ရောင်နဲ့ဆိုရင် ကွာခြားမှု ကြီးကြီး ရပါတယ်။
      icon ကို link ရဲ့ စာလုံး အရောင်နဲ့ ဆွဲထားတဲ့အတွက်၊ link ရဲ့ အရောင်ကို ပြောင်းလိုက်တာနဲ့
      icon အရောင်ပါ လိုက်ပြောင်းပါတယ်။ ခုနက ထည့်ခဲ့တဲ့ အညိုရင့် focus ring ကလည်း ဒီ အညိုရင့်
      နောက်ခံပေါ်မှာ မမြင်ရမှာ ဖြစ်လို့၊ keyboard focus lesson မှာလိုပဲ footer ထဲမှာတော့ ring ကို
      ခရင်မ်ရောင် ပြောင်းပေးပါမယ်။ [[mark:after-icon]] row က ၁၁.၁၂ နဲ့ ၁ ဖြစ်သွားပြီး၊
      icon ကို ရှင်းရှင်း မြင်ရပါပြီ။
    sources:
      - title: "web.dev Learn Accessibility — Manual accessibility testing (Visual checks, Issues 3 and 4)"
        url: "https://web.dev/learn/accessibility/test-manual"
      - title: "WCAG 2.2 — Understanding 1.4.1 Use of Color"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/use-of-color.html"
      - title: "WCAG 2.2 — Understanding 1.4.11 Non-text Contrast"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/non-text-contrast.html"
      - title: "axe-core — color-contrast checks text only"
        url: "https://github.com/dequelabs/axe-core/blob/develop/doc/rule-descriptions.md"
    actions:
      - id: expect-link-fails
        type: expect.preview
        at: { mark: read-link-row }
        timeoutMs: 5000
        target: { by: testId, value: contrast-drinks-link }
        attribute: { name: data-ratio, value: "2.67" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-link
        type: editor.type
        at: { mark: type-link }
        cadence: fast-explainer
        target: { file: styles.css, after: "  order: 0;\n}\n", occurrence: 1 }
        text: "\n.hero a {\n  color: saddlebrown;\n  text-decoration: underline;\n}\n"
      - id: expect-link-passes
        type: expect.preview
        at: { mark: after-link }
        timeoutMs: 5000
        target: { by: testId, value: contrast-drinks-link }
        attribute: { name: data-ratio, value: "6.72" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: scroll-footer
        type: preview.scroll
        at: { mark: scroll-footer }
        timeoutMs: 5000
        top: 5000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-icon-fails
        type: expect.preview
        at: { afterAction: scroll-footer }
        timeoutMs: 5000
        target: { by: testId, value: contrast-call-link }
        attribute: { name: data-ratio, value: "1.62" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-icon
        type: editor.type
        at: { mark: type-icon }
        cadence: fast-explainer
        target: { file: styles.css, after: "  text-decoration: underline;\n}\n", occurrence: 1 }
        text: "\n.site-footer .call-link {\n  color: wheat;\n}\n\n.site-footer :focus-visible {\n  outline-color: var(--cream);\n}\n"
      - id: expect-icon-passes
        type: expect.preview
        at: { mark: after-icon }
        timeoutMs: 5000
        target: { by: testId, value: contrast-call-link }
        attribute: { name: data-ratio, value: "11.12" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-axe-still-clean
        type: expect.preview
        at: { afterAction: expect-icon-passes }
        timeoutMs: 8000
        target: { by: testId, value: axe-count }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 1500 }

  - id: spacing
    chapter: "Zoom နဲ့ စာလုံးကြား အကွာအဝေး"
    narration: >
      visual စစ်ချက်ထဲမှာ zoom လည်း ပါပါတယ်။ ကိုယ့် browser မှာ page ကို ၂၀၀ ရာခိုင်နှုန်း၊
      ၄၀၀ ရာခိုင်နှုန်း ချဲ့ကြည့်ပြီး၊ စာ ဖြတ်မသွားလား၊ ဘေးတိုက် scroll မလိုလား စစ်ပါ။ အကျယ်
      ၃၂၀ pixel လောက်မှာလည်း page ကို သုံးလို့ ရရပါမယ်။ lesson ထဲက preview ကို zoom ချဲ့လို့
      မရလို့၊ ဒါကိုတော့ ကိုယ့် ကွန်ပျူတာမှာ စမ်းကြည့်ပါ။ ဒီမှာ စမ်းလို့ ရတာကတော့ စာလုံးကြား
      အကွာအဝေးပါ။ [[mark:open-spacing]] ဒီ ဖိုင်က user တစ်ယောက်က ကိုယ်ပိုင် style နဲ့
      စာလုံးကြား၊ စာပိုဒ်ကြားကို ချဲ့ထားသလို၊ WCAG ပြောထားတဲ့ အကွာအဝေးတွေနဲ့ စမ်းတဲ့ CSS ပါ။
      [[mark:select-spacing]] စာလုံးကြားနဲ့ စကားလုံးကြားကို ချဲ့ထားပြီး၊ အောက်က rule က
      စာပိုဒ်ကြားကို ချဲ့ပါတယ်။ line height ကတော့ ဒီ page မှာ WCAG တောင်းတဲ့ ၁.၅ ထက် များတဲ့
      ၁.၈ ရှိပြီးသား ဖြစ်လို့ မပြောင်းပါဘူး။ [[mark:open-index-spacing]] page မှာ ဒီ ဖိုင်ကို ချိတ်ကြည့်ရအောင်။
      [[mark:type-spacing-link]] styles ဖိုင်ကို ချိတ်ထားတဲ့ စာကြောင်းရဲ့ အောက်မှာ link တစ်ကြောင်း
      ထည့်လိုက်ပါမယ်။
      [[mark:scroll-special]] ယနေ့ အထူး box ကို ကြည့်ပါ။ စာလုံးတွေ ကျယ်သွားလို့ စာက နေရာ
      ပိုယူလာပြီး၊ နောက်ဆုံး စာကြောင်းက box ရဲ့ အောက်ခြေမှာ ဖြတ်သွားပါတယ်။ အဲဒီ စာကို ဖတ်လို့
      မရတော့ပါဘူး။ box ရဲ့ အမြင့်ကို ပုံသေ ပေးထားလို့ပါ။ [[mark:type-height]] အမြင့်ကို ပုံသေ
      မထားဘဲ၊ စာနဲ့ လိုက်ပြီး ကြီးလာအောင် ပြင်ပါမယ်။ ဒီလို ပုံသေ အမြင့်တွေက zoom
      ချဲ့တဲ့အခါမှာလည်း စာကို ဖြတ်တတ်ပါတယ်။ [[mark:after-height]] ကြည့်ပါ၊ box က ကြီးလာပြီး စာ
      အကုန် ပြန်မြင်ရပါပြီ။
    sources:
      - title: "web.dev Learn Accessibility — Manual accessibility testing (Visual checks)"
        url: "https://web.dev/learn/accessibility/test-manual"
      - title: "WCAG 2.2 — Understanding 1.4.12 Text Spacing"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/text-spacing.html"
      - title: "WCAG 2.2 — Understanding 1.4.4 Resize Text"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/resize-text.html"
      - title: "WCAG 2.2 — Understanding 1.4.10 Reflow"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/reflow.html"
    actions:
      - id: open-spacing
        type: workspace.openFile
        at: { mark: open-spacing }
        path: text-spacing.css
      - id: select-spacing
        type: editor.select
        at: { mark: select-spacing }
        target:
          {
            file: text-spacing.css,
            text: "  letter-spacing: 0.12em !important;\n  word-spacing: 0.16em !important;\n",
            occurrence: 1,
          }
      - id: open-index-spacing
        type: workspace.openFile
        at: { mark: open-index-spacing }
        path: index.html
      - id: type-spacing-link
        type: editor.type
        at: { mark: type-spacing-link }
        cadence: block
        target:
          {
            file: index.html,
            after: "    <link rel=\"stylesheet\" href=\"/styles.css\" />\n",
            occurrence: 1,
          }
        text: "    <link rel=\"stylesheet\" href=\"/text-spacing.css\" />\n"
      - id: scroll-special
        type: preview.scroll
        at: { mark: scroll-special }
        timeoutMs: 5000
        top: 340
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-special-text
        type: expect.preview
        at: { afterAction: scroll-special }
        timeoutMs: 5000
        target: { by: testId, value: special-text }
        textContains: "နေ့တိုင်း မနက် ၆ နာရီမှာ ဖွင့်ပါတယ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: open-styles-spacing
        type: workspace.openFile
        at: { mark: type-height }
        path: styles.css
      - id: type-height
        type: editor.type
        at: { afterAction: open-styles-spacing }
        cadence: fast-explainer
        target: { file: styles.css, after: "  outline-color: var(--cream);\n}\n", occurrence: 1 }
        text: "\n.special {\n  height: auto;\n}\n"
      - id: expect-axe-spacing
        type: expect.preview
        at: { mark: after-height }
        timeoutMs: 8000
        target: { by: testId, value: axe-count }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 1500 }

  - id: content
    chapter: "စာသားကို စစ်ရအောင်"
    narration: >
      [[mark:board-content]] နောက်ဆုံး နယ်ပယ်က content စစ်ချက်ပါ။ ဒီမှာ စာသားကိုယ်တိုင်ကို
      ဖတ်ပြီး၊ တခြားသူ နားလည်မလား ဆိုတာ စစ်တာပါ။ [[mark:draw-content]] page title၊
      ခေါင်းစဉ်နဲ့ form label တွေ ရှင်းလား၊ alt text တွေ တိုပြီး မှန်လား၊ link စာက ဘယ်ကို
      သွားမလဲ ပြောလား၊ ဒီမှာ နှိပ်ပါ လို စာ မသုံးဘူးလား၊ အရောင် တစ်ခုတည်းနဲ့ အဓိပ္ပာယ်
      ပြောနေလား၊ ဘာသာစကား ပြောင်းတဲ့ နေရာမှာ lang ပါလား၊ နားလည်လွယ်တဲ့ စကား သုံးပြီး
      အတိုကောက်တွေကို ပထမဆုံး အကြိမ်မှာ ရှင်းပြထားလား၊ navigation နဲ့ form တွေက page တိုင်းမှာ
      တစ်ပုံစံတည်း ဖြစ်လား ဆိုတာတွေပါ။ [[mark:content-script]] ဒီမှာ နှိပ်ပါ လို စာကို
      script တစ်ခုနဲ့ ရှာလို့ ရပေမယ့်၊ အစားထိုးမယ့် စာကိုတော့ လူကပဲ ရေးနိုင်ပါတယ်။
    sources:
      - title: "web.dev Learn Accessibility — Manual accessibility testing (Content checks)"
        url: "https://web.dev/learn/accessibility/test-manual"
      - title: "WCAG 2.2 — Understanding 2.4.4 Link Purpose (In Context)"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/link-purpose-in-context.html"
      - title: "WCAG 2.2 — Understanding 3.2.3 Consistent Navigation"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/consistent-navigation.html"
      - title: "W3C WAI — Making Content Usable for People with Cognitive and Learning Disabilities"
        url: "https://www.w3.org/TR/coga-usable/"
    actions:
      - id: board-content
        type: whiteboard.apply
        at: { mark: board-content }
        open: true
        clear: true
        upsertIds: [d-title]
      - id: draw-content
        type: whiteboard.apply
        at: { mark: draw-content }
        upsertIds: [d-1, d-2, d-3, d-3-bad, d-3-strike, d-4, d-5, d-6, d-7]
        drawMs: 6000

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:close-content]] ဒါဆို ပြန်ချုပ်ရရင်၊ axe က ပြဿနာ မတွေ့တဲ့ page မှာ ကိုယ်တိုင်
      စစ်ကြည့်တော့ ပြဿနာ ငါးခု ထပ်တွေ့ခဲ့ပါတယ်။ [[mark:sel-ring]] focus ring မပေါ်တာ၊ focus
      အစဉ် ခုန်နေတာ၊ [[mark:sel-link]] ဖျော့နေတဲ့ link နဲ့ icon၊ [[mark:sel-height]] ပြီးတော့
      စာလုံးကြား ချဲ့ရင် ဖြတ်သွားတဲ့ box တို့ပါ။ keyboard၊ မျက်စိ၊ စာသား ဆိုတဲ့ checklist
      သုံးမျိုးက automated testing မမြင်တာတွေကို ဖြည့်ပေးပါတယ်။ ကိုယ့် website မှာလည်း mouse
      ကို ဘေးချပြီး စမ်းကြည့်ပါ။ နောက် lesson မှာတော့ screen reader လို assistive technology
      နဲ့ တကယ် သုံးပြီး စမ်းသပ်တာကို ကြည့်သွားပါမယ်။
    sources:
      - title: "web.dev Learn Accessibility — Manual accessibility testing (Next step)"
        url: "https://web.dev/learn/accessibility/test-manual"
      - title: "web.dev Learn Accessibility — Assistive technology testing"
        url: "https://web.dev/learn/accessibility/test-assistive-technology"
    actions:
      - id: close-content
        type: whiteboard.apply
        at: { mark: close-content }
        open: false
      - id: sel-ring
        type: editor.select
        at: { mark: sel-ring }
        target: { file: styles.css, text: ":focus-visible {", occurrence: 1 }
      - id: sel-link
        type: editor.select
        at: { mark: sel-link }
        target: { file: styles.css, text: "  text-decoration: underline;", occurrence: 1 }
      - id: sel-height
        type: editor.select
        at: { mark: sel-height }
        target: { file: styles.css, text: "  height: auto;", occurrence: 1 }
      - id: expect-file-css
        type: expect.file
        at: { afterAction: sel-height }
        path: styles.css
        contains: ":focus-visible {\n  outline: 3px solid var(--tea-dark);\n  outline-offset: 2px;\n}\n\n.featured {\n  order: 0;\n}\n\n.hero a {\n  color: saddlebrown;\n  text-decoration: underline;\n}\n\n.site-footer .call-link {\n  color: wheat;\n}\n\n.site-footer :focus-visible {\n  outline-color: var(--cream);\n}\n\n.special {\n  height: auto;\n}\n"
      - id: expect-file-link
        type: expect.file
        at: { afterAction: expect-file-css }
        path: index.html
        contains: "    <link rel=\"stylesheet\" href=\"/text-spacing.css\" />\n"

checks:
  - { type: timing.p95Ms, max: 300 }
