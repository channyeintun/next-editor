build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 2618

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  - id: intro
    chapter: "Automated testing ဆိုတာ ဘာလဲ"
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ design အဆင့်ကတည်းက accessibility ကို ဘယ်လို ထည့်စဉ်းစားမလဲ ဆိုတာ
      ကြည့်ခဲ့ပါတယ်။ ဒီ lesson ကစပြီး ဆောက်ပြီးသား page ကို စမ်းသပ်တဲ့ အပိုင်းကို ရောက်ပါပြီ။
      [[mark:start-server]] စမ်းသပ်တာကို အဆင့် သုံးဆင့် ခွဲကြည့်နိုင်ပါတယ်။
      [[mark:draw-steps]] tool တွေကို အလိုအလျောက် စစ်ခိုင်းတဲ့ automated testing၊ လူကိုယ်တိုင်
      keyboard နဲ့၊ မျက်စိနဲ့ လိုက်စစ်တဲ့ manual testing၊ ပြီးတော့ screen reader လို assistive
      technology နဲ့ တကယ် သုံးကြည့်တာ ဆိုပြီး ဖြစ်ပါတယ်။ ဒီနေ့ ပထမ အဆင့်ကို ကြည့်ပါမယ်။
      [[mark:draw-pros]] automated testing ဆိုတာ software တစ်ခုက page ကို စည်းကမ်း စာရင်း
      တစ်ခုနဲ့ တိုက်စစ်ပြီး၊ တွေ့တဲ့ ပြဿနာတွေကို စာရင်းနဲ့ ပြန်ပြတာပါ။ စက္ကန့်ပိုင်းအတွင်း
      ရလဒ် ထွက်လို့ code ပြင်တိုင်း ထပ်ခါထပ်ခါ run လို့ ရပြီး၊ accessibility ကို သိပ်
      မသိသေးတဲ့ သူလည်း run နိုင်ပါတယ်။ [[mark:draw-cons]] ဒါပေမဲ့ tool တွေဟာ ပြဿနာ အားလုံးကို
      မရှာနိုင်ဘဲ၊ တစ်စိတ်တစ်ပိုင်းကိုပဲ ရှာနိုင်ပါတယ်။ တကယ် ပြဿနာ မဟုတ်တာကို ပြဿနာလို့ ပြတဲ့
      false positive ရှိသလို၊ တကယ့် ပြဿနာကို လွတ်သွားတဲ့ false negative လည်း ရှိပါတယ်။ product
      အမျိုးအစား မတူရင် tool တစ်ခုထက် ပိုလိုတာလည်း ရှိပါတယ်။ [[mark:intro-warning]] ဒါကြောင့်
      tool က ပြဿနာ မရှိဘူးလို့ ပြောရုံနဲ့ page က accessible ဖြစ်ပြီလို့ မယူဆရပါဘူး။ ဒီ lesson
      ရဲ့ နောက်ပိုင်းမှာ အဲဒါကို ကိုယ့်မျက်စိနဲ့ တွေ့ရပါလိမ့်မယ်။
    sources:
      - title: "web.dev Learn Accessibility — Automated accessibility testing"
        url: "https://web.dev/learn/accessibility/test-automated"
      - title: "W3C WAI — Selecting Web Accessibility Evaluation Tools"
        url: "https://www.w3.org/WAI/test-evaluate/tools/selecting/"
    actions:
      - id: open-board-a
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      # Boot + pnpm install (axe-core included) + vite run under the two
      # opening boards; waitForReady sits on the preview mark ~2 min later.
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 90000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-steps
        type: whiteboard.apply
        at: { mark: draw-steps }
        upsertIds: [a-step-1, a-step-2, a-step-3, a-step-circle]
        drawMs: 3200
      - id: draw-pros
        type: whiteboard.apply
        at: { mark: draw-pros }
        upsertIds: [a-pro-title, a-pro-1, a-pro-2]
        drawMs: 2600
      - id: draw-cons
        type: whiteboard.apply
        at: { mark: draw-cons }
        upsertIds: [a-con-title, a-con-1, a-con-2, a-con-3]
        drawMs: 3200

  - id: tools
    chapter: "Tool အမျိုးအစားတွေ"
    narration: >
      [[mark:board-tools]] ဒီနေ့ ရွေးချယ်စရာ automated tool ပေါင်း တစ်ရာကျော် ရှိပါတယ်။
      [[mark:draw-linter]] code ရေးနေတုန်း editor ထဲမှာပဲ သတိပေးတဲ့ linter တွေ ရှိပါတယ်။
      [[mark:draw-extension]] page ကို browser ထဲမှာ စစ်တဲ့ extension တွေထဲမှာတော့ Chrome
      DevTools ထဲက Lighthouse၊ axe DevTools နဲ့ WAVE တို့က လူသုံးများပါတယ်။ Lighthouse ရဲ့
      accessibility စစ်ချက်တွေက axe-core ဆိုတဲ့ library ပေါ်မှာ အခြေခံထားပါတယ်။
      [[mark:draw-library]] axe-core လို library ကို ကိုယ့် test တွေထဲ၊ CI ထဲ ထည့်ထားရင်တော့
      code ပြောင်းတိုင်း အလိုအလျောက် စစ်ပေးပါတယ်။ [[mark:draw-crawler]] website တစ်ခုလုံးက
      page တွေကို လှည့်စစ်တဲ့ crawler တွေလည်း ရှိပါတယ်။ [[mark:draw-choose]] ဘယ် tool ရွေးမလဲ
      ဆိုတာကတော့ ဘယ် standard နဲ့ စစ်မလဲ၊ ဘာ product လဲ၊ ဘယ်သူ run မလဲ၊ ဘယ်လောက် မကြာခဏ စစ်မလဲ
      ဆိုတာတွေပေါ် မူတည်ပါတယ်။ [[mark:draw-panel]] ဒီ lesson မှာတော့ accessibility panel က
      axe-core ကိုပါ သုံးထားပါတယ်။ page ပြောင်းတိုင်း axe က ပြန်စစ်ပြီး၊ တွေ့တဲ့ ပြဿနာတွေကို စာရင်းနဲ့
      ပြပေးပါတယ်။
    sources:
      - title: "web.dev Learn Accessibility — Automated accessibility testing (Types of automated tools)"
        url: "https://web.dev/learn/accessibility/test-automated"
      - title: "W3C WAI — Web Accessibility Evaluation Tools List"
        url: "https://www.w3.org/WAI/ER/tools/"
      - title: "Chrome for Developers — Lighthouse accessibility scoring (powered by axe-core)"
        url: "https://developer.chrome.com/docs/lighthouse/accessibility/scoring"
      - title: "axe-core (Deque) on GitHub"
        url: "https://github.com/dequelabs/axe-core"
    actions:
      - id: board-tools
        type: whiteboard.apply
        at: { mark: board-tools }
        clear: true
        upsertIds: [b-title]
      - id: draw-linter
        type: whiteboard.apply
        at: { mark: draw-linter }
        upsertIds: [b-linter]
        drawMs: 1400
      - id: draw-extension
        type: whiteboard.apply
        at: { mark: draw-extension }
        upsertIds: [b-ext]
        drawMs: 1800
      - id: draw-library
        type: whiteboard.apply
        at: { mark: draw-library }
        upsertIds: [b-lib]
        drawMs: 1600
      - id: draw-crawler
        type: whiteboard.apply
        at: { mark: draw-crawler }
        upsertIds: [b-crawl]
        drawMs: 1400
      - id: draw-choose
        type: whiteboard.apply
        at: { mark: draw-choose }
        upsertIds: [b-choose]
        drawMs: 1800
      - id: draw-panel
        type: whiteboard.apply
        at: { mark: draw-panel }
        upsertIds: [b-panel]
        drawMs: 1200

  - id: first-run
    chapter: "ဆိုင်ရဲ့ page ကို axe နဲ့ စစ်ရအောင်"
    narration: >
      [[mark:close-tools]] ဒါဆို ဆိုင်ရဲ့ page ကို စစ်ကြည့်ရအောင်။ [[mark:preview-opens]]
      ညာဘက်မှာ ဆိုင်ရဲ့ page ကို မြင်ရပါပြီ။ မျက်စိနဲ့ ကြည့်ရင်တော့ ပြဿနာ မရှိသလိုပါပဲ။
      [[mark:read-count]] ဒါပေမဲ့ panel မှာ axe က ပြဿနာ ရှစ်ခု တွေ့ထားပါတယ်။ row တစ်ခုစီရဲ့
      ရှေ့ဆုံးက စကားလုံးက ပြဿနာ ဘယ်လောက် ပြင်းထန်လဲ ဆိုတာပါ။ critical က အပြင်းထန်ဆုံး ဖြစ်ပြီး၊ serious၊
      moderate၊ minor ဆိုပြီး အဆင့်လိုက် လျော့သွားပါတယ်။ နောက်မှာ rule နာမည်၊ ချိုးဖောက်နေတဲ့ element
      အရေအတွက်နဲ့ ရှင်းလင်းချက် လာပါတယ်။ [[mark:read-button]] ဥပမာ ဒုတိယ row က ခလုတ် နှစ်ခုမှာ
      name မရှိဘူးလို့ ပြောနေပါတယ်။ row တွေကို ပြင်းထန်တဲ့ အစဉ်နဲ့ စီထားပြီး၊ panel ရဲ့
      အောက်ဘက်မှာ နောက်ထပ် row တွေ ကျန်ပါသေးတယ်။ [[mark:read-contrast-row]] panel ရဲ့
      အပေါ်ဆုံးမှာတော့ contrast row တစ်ခု ပါပါတယ်။ ကော်ဖီရဲ့ ဖော်ပြချက်က ၂.၂၈ နဲ့ ၁ ပဲ ရလို့
      fail ပါ။ ဒီ row ကို မှတ်ထားပါ၊ နောက်မှ ပြန်လာကြည့်ပါမယ်။
    sources:
      - title: "web.dev Learn Accessibility — Automated accessibility testing (Demo)"
        url: "https://web.dev/learn/accessibility/test-automated"
      - title: "axe-core — rule descriptions and impact levels"
        url: "https://github.com/dequelabs/axe-core/blob/develop/doc/rule-descriptions.md"
    actions:
      - id: close-tools
        type: whiteboard.apply
        at: { mark: close-tools }
        open: false
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { mark: preview-opens }
        timeoutMs: 45000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-dev-server }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-eight
        type: expect.preview
        at: { mark: read-count }
        timeoutMs: 8000
        target: { by: testId, value: axe-count }
        attribute: { name: data-count, value: "8" }
        retry: { maxAttempts: 3, delayMs: 1500 }
      - id: expect-button-two
        type: expect.preview
        at: { mark: read-button }
        timeoutMs: 5000
        target: { by: testId, value: axe-button-name }
        textContains: "critical button-name ×2"
        retry: { maxAttempts: 3, delayMs: 1500 }
      - id: expect-desc-fails
        type: expect.preview
        at: { mark: read-contrast-row }
        timeoutMs: 5000
        target: { by: testId, value: contrast-coffee-desc }
        attribute: { name: data-ratio, value: "2.28" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-desc-aa-fail
        type: expect.preview
        at: { afterAction: expect-desc-fails }
        timeoutMs: 5000
        target: { by: testId, value: contrast-coffee-desc }
        attribute: { name: data-aa, value: "fail" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: fix-form
    chapter: "Form ထဲက ပြဿနာ လေးမျိုး"
    narration: >
      [[mark:open-index]] ပြင်းထန်ဆုံး row တွေကနေ စကြည့်ရအောင်။ [[mark:scroll-form]] အဲဒီ row
      အများစုက page ရဲ့ အောက်ဆုံးက ယနေ့ အထူး သတင်း ဆိုတဲ့ form လေး တစ်ခုတည်းကနေ လာတာပါ။
      [[mark:select-role]] ခလုတ်ပေါ်က ဒီ role ကို ကြည့်ပါ။ ခလုတ်ကို list လို့ ပြောထားလို့၊
      list ထဲမှာ list item ပါရမယ် ဆိုတဲ့ စည်းကမ်းကို ချိုးဖောက်ပြီး၊ button element မှာ
      ခွင့်မပြုတဲ့ role လည်း ဖြစ်နေပါတယ်။ role က button မဟုတ်တော့လို့၊ ခလုတ်ပေါ်က စာသားကိုလည်း
      name အဖြစ် မယူတော့ပါဘူး။ [[mark:select-tabindex]] ဘေးက tab index က သုညထက် ကြီးတဲ့အတွက်၊
      page ရဲ့ သဘာဝ အစဉ်ကို ကျော်ပြီး ဒီ ခလုတ်ကို Tab key ရဲ့ ရှေ့ဆုံး ဆွဲတင်ထားပါတယ်။
      [[mark:select-hidden]] input ပေါ်က aria hidden ကလည်း field ကို screen reader ဆီကနေ
      ဖျောက်ထားပေမယ့်၊ keyboard focus ကတော့ ရောက်နေဆဲပါ။ ဆိုတော့ screen reader သုံးသူက ဘာမှ
      မကြားရတဲ့ နေရာ တစ်ခုကို ရောက်သွားမှာပါ။ ပြင်တဲ့ နည်းက ဒီ attribute သုံးခုကို
      ဖျက်ပစ်ရုံပါပဲ။ [[mark:type-new-form]] ဒီမှာတော့ အဟောင်းနဲ့ နှိုင်းယှဉ် ကြည့်နိုင်အောင်၊
      form ကို အောက်မှာ အသစ် ပြန်ရေးပါမယ်။ role၊ tab index၊ aria hidden မပါတဲ့ သာမန် HTML ပါ။
      [[mark:after-new-form]] axe က ပြန်စစ်ပြီးပါပြီ။ ရှစ်ခု အတိုင်းပဲ ရှိနေလို့၊ form အသစ်က
      ပြဿနာ အသစ် တစ်ခုမှ မထည့်ပါဘူး။ [[mark:type-hidden]] အခု form အဟောင်းကို hidden attribute
      နဲ့ ပိတ်ပါမယ်။ ကိုယ့် code မှာဆိုရင်တော့ အဟောင်းကို ဖျက်ပစ်လိုက်ပါ။
      [[mark:after-hidden]] ကြည့်ပါ၊ ရှစ်ခုကနေ လေးခု ဖြစ်သွားပါပြီ။ row လေးခု ပျောက်သွားပြီး၊
      ခလုတ် name row ကလည်း နှစ်ခုကနေ တစ်ခု ဖြစ်သွားပါတယ်။
    sources:
      - title: "web.dev Learn Accessibility — Automated accessibility testing (Issues 1–3 and 8)"
        url: "https://web.dev/learn/accessibility/test-automated"
      - title: "Deque University — aria-required-children"
        url: "https://dequeuniversity.com/rules/axe/4.10/aria-required-children"
      - title: "Deque University — aria-hidden-focus"
        url: "https://dequeuniversity.com/rules/axe/4.10/aria-hidden-focus"
      - title: "Deque University — tabindex"
        url: "https://dequeuniversity.com/rules/axe/4.10/tabindex"
      - title: "MDN — the hidden global attribute"
        url: "https://developer.mozilla.org/docs/Web/HTML/Global_attributes/hidden"
    actions:
      - id: open-index
        type: workspace.openFile
        at: { mark: open-index }
        path: index.html
      - id: scroll-form
        type: preview.scroll
        at: { mark: scroll-form }
        timeoutMs: 5000
        top: 800
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: select-role
        type: editor.select
        at: { mark: select-role }
        target: { file: index.html, text: 'role="list"', occurrence: 1 }
      - id: select-tabindex
        type: editor.select
        at: { mark: select-tabindex }
        target: { file: index.html, text: 'tabindex="1"', occurrence: 1 }
      - id: select-hidden
        type: editor.select
        at: { mark: select-hidden }
        target: { file: index.html, text: 'aria-hidden="true"', occurrence: 1 }
      - id: type-new-form
        type: editor.type
        at: { mark: type-new-form }
        cadence: block
        target: { file: index.html, after: "      </form>\n", occurrence: 1 }
        text: "      <form class=\"news\" data-testid=\"news-form\">\n        <h2>ယနေ့ အထူး သတင်း</h2>\n        <label for=\"news-tel\">ဖုန်း</label>\n        <input id=\"news-tel\" type=\"tel\" />\n        <button type=\"submit\" class=\"news-btn\">စာရင်းသွင်းမယ်</button>\n      </form>\n"
      - id: expect-still-eight
        type: expect.preview
        at: { mark: after-new-form }
        timeoutMs: 8000
        target: { by: testId, value: axe-count }
        attribute: { name: data-count, value: "8" }
        retry: { maxAttempts: 3, delayMs: 1500 }
      - id: expect-new-form
        type: expect.preview
        at: { afterAction: expect-still-eight }
        timeoutMs: 5000
        target: { by: testId, value: news-form }
        textContains: "စာရင်းသွင်းမယ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-hidden
        type: editor.type
        at: { mark: type-hidden }
        cadence: block
        target: { file: index.html, after: '<form class="news"', occurrence: 1 }
        text: " hidden"
      - id: expect-four
        type: expect.preview
        at: { mark: after-hidden }
        timeoutMs: 8000
        target: { by: testId, value: axe-count }
        attribute: { name: data-count, value: "4" }
        retry: { maxAttempts: 3, delayMs: 1500 }
      - id: expect-button-one
        type: expect.preview
        at: { afterAction: expect-four }
        timeoutMs: 5000
        target: { by: testId, value: axe-button-name }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 1500 }
      - id: scroll-new-form
        type: preview.scroll
        at: { afterAction: expect-button-one }
        timeoutMs: 5000
        top: 780
        retry: { maxAttempts: 2, delayMs: 250 }

  - id: fix-names
    chapter: "Name မရှိတဲ့ ပုံနဲ့ ခလုတ်"
    narration: >
      [[mark:select-photo]] နောက်ထပ် critical row နှစ်ခုက name မရှိတဲ့ ပုံနဲ့ ခလုတ်ပါ။
      ဆိုင်ပုံရိပ် ဓာတ်ပုံရဲ့ ဒီ ပုံ element မှာ alt text မပါပါဘူး။ axe က alt text မရှိဘူး
      ဆိုတာကိုပဲ သိနိုင်ပြီး၊ ဘာ ရေးရမလဲ ဆိုတာကတော့ ကိုယ်က ဆုံးဖြတ်ရမှာပါ။ [[mark:type-alt]]
      ဒီ ပုံက ဆိုင်ထဲက အခင်းအကျင်းကို ပြတဲ့ ပုံ ဖြစ်လို့၊ ပုံထဲမှာ ဘာ မြင်ရလဲ ဆိုတာကို
      တိုတိုလေး ရေးပါမယ်။ [[mark:after-alt]] image alt row ပျောက်သွားလို့ သုံးခုပဲ
      ကျန်ပါတော့တယ်။ [[mark:select-fav]] လက်ဖက်ရည် card ထဲက နှလုံးပုံ ခလုတ်မှာလည်း icon ပဲ
      ပါပြီး စာသား မပါလို့ name မရှိပါဘူး။ screen reader က ခလုတ် လို့ပဲ ဖတ်ပြမှာ ဖြစ်လို့၊ ဘာ
      လုပ်တဲ့ ခလုတ်လဲ မသိနိုင်ပါဘူး။ [[mark:type-label]] aria label နဲ့ ကြိုက်တယ် ဆိုတဲ့ name
      ပေးလိုက်ပါမယ်။ [[mark:after-label]] ခလုတ် name row လည်း ပျောက်သွားလို့ နှစ်ခုပဲ
      ကျန်ပါတော့တယ်။
    sources:
      - title: "web.dev Learn Accessibility — Automated accessibility testing (Issues 3 and 4)"
        url: "https://web.dev/learn/accessibility/test-automated"
      - title: "Deque University — image-alt"
        url: "https://dequeuniversity.com/rules/axe/4.10/image-alt"
      - title: "Deque University — button-name"
        url: "https://dequeuniversity.com/rules/axe/4.10/button-name"
      - title: "web.dev Learn Accessibility — Images"
        url: "https://web.dev/learn/accessibility/images"
    actions:
      - id: select-photo
        type: editor.select
        at: { mark: select-photo }
        target: { file: index.html, text: '<img src="/teahouse.svg"', occurrence: 1 }
      - id: type-alt
        type: editor.type
        at: { mark: type-alt }
        cadence: block
        target: { file: index.html, after: '<img src="/teahouse.svg"', occurrence: 1 }
        text: ' alt="ပြတင်းပေါက်နား ခုံတန်းရှည်နဲ့ လက်ဖက်ရည်ခွက်များ"'
      - id: expect-three
        type: expect.preview
        at: { mark: after-alt }
        timeoutMs: 8000
        target: { by: testId, value: axe-count }
        attribute: { name: data-count, value: "3" }
        retry: { maxAttempts: 3, delayMs: 1500 }
      - id: select-fav
        type: editor.select
        at: { mark: select-fav }
        target: { file: index.html, text: '<button type="button" class="fav"', occurrence: 1 }
      - id: type-label
        type: editor.type
        at: { mark: type-label }
        cadence: block
        target: { file: index.html, after: '<button type="button" class="fav"', occurrence: 1 }
        text: ' aria-label="ကြိုက်တယ်"'
      - id: expect-two
        type: expect.preview
        at: { mark: after-label }
        timeoutMs: 8000
        target: { by: testId, value: axe-count }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 1500 }

  - id: fix-list
    chapter: "List item တွေကို list ထဲ ပြန်ထည့်ရအောင်"
    narration: >
      [[mark:select-list]] ကျန်တဲ့ row တစ်ခုက list item နှစ်ခုဟာ list ထဲမှာ မရှိဘူးလို့
      ပြောနေပါတယ်။ menu card တွေကို list item element နဲ့ ရေးထားပေမယ့်၊ ဒီ div ထဲမှာ
      ထည့်ထားပါတယ်။ unordered list ဒါမှမဟုတ် ordered list ထဲမှာ မရှိရင်၊ screen reader က list
      တစ်ခု ရှိတယ်၊ item နှစ်ခု ပါတယ် ဆိုတာကို ပြောပြလို့ မရပါဘူး။ [[mark:type-ul-open]] div
      ကို မပြောင်းဘဲ၊ သူ့ အတွင်းမှာ unordered list တစ်ခု ဖွင့်ပါမယ်။ [[mark:type-ul-close]]
      နောက်ဆုံး card ရဲ့ အောက်မှာ ပြန်ပိတ်ပါမယ်။ menu class က list ရဲ့ အစက်နဲ့ နေရာလွတ်တွေကို
      ဖယ်ထားလို့ မျက်စိနဲ့ ကြည့်ရင် ဘာမှ မပြောင်းပါဘူး။ [[mark:after-list]] ဒါပေမဲ့ axe ကတော့
      ပြောင်းသွားတာကို သိပါတယ်။ ပြဿနာ တစ်ခုပဲ ကျန်ပါတော့တယ်။
    sources:
      - title: "web.dev Learn Accessibility — Automated accessibility testing (Issue 7: list structure)"
        url: "https://web.dev/learn/accessibility/test-automated"
      - title: "Deque University — listitem"
        url: "https://dequeuniversity.com/rules/axe/4.10/listitem"
      - title: "web.dev Learn Accessibility — Content structure (Lists)"
        url: "https://web.dev/learn/accessibility/structure"
    actions:
      - id: select-list
        type: editor.select
        at: { mark: select-list }
        target:
          {
            file: index.html,
            text: '<div class="menu-list" data-testid="menu-drinks">',
            occurrence: 1,
          }
      - id: type-ul-open
        type: editor.type
        at: { mark: type-ul-open }
        cadence: block
        target:
          {
            file: index.html,
            after: "<div class=\"menu-list\" data-testid=\"menu-drinks\">\n",
            occurrence: 1,
          }
        text: "          <ul class=\"menu\">\n"
      - id: type-ul-close
        type: editor.type
        at: { mark: type-ul-close }
        cadence: block
        target: { file: index.html, after: "            </li>\n", occurrence: 2 }
        text: "          </ul>\n"
      - id: expect-one
        type: expect.preview
        at: { mark: after-list }
        timeoutMs: 8000
        target: { by: testId, value: axe-count }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 1500 }
      - id: expect-contrast-left
        type: expect.preview
        at: { afterAction: expect-one }
        timeoutMs: 5000
        target: { by: testId, value: axe-color-contrast }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 1500 }

  - id: fix-quote
    chapter: "နောက်ဆုံး ပြဿနာ"
    narration: >
      [[mark:scroll-quote]] နောက်ဆုံး ကျန်တဲ့ row က color contrast ပါ။ element တစ်ခုမှာ
      contrast မလောက်ဘူးလို့ ပြောနေပြီး၊ အဲဒါက ဒီ English quote ပါ။ ခရင်မ်ရောင် နောက်ခံပေါ်မှာ
      အညိုဖျော့ဖျော့ ဖြစ်နေလို့ ဖတ်ရ ခက်ပါတယ်။ [[mark:open-styles]] styles ဖိုင်ထဲမှာ quote
      ကို အညိုရင့် အရောင် ပေးပါမယ်။ [[mark:type-quote]] ရိုက်နေတုန်း panel ကို
      လိုက်ကြည့်ပါ။ CSS ပြောင်းတာနဲ့ axe က ပြန်စစ်ပါတယ်။ [[mark:after-quote]] ကြည့်ပါ၊ axe က
      no issues လို့ ပြပါပြီ။ ပြဿနာ ရှစ်ခုကနေ သုညအထိ၊ တစ်အုပ်စုချင်း ပြင်ပြီး ရောက်လာတာပါ။
    sources:
      - title: "web.dev Learn Accessibility — Automated accessibility testing (Issue 6: color contrast)"
        url: "https://web.dev/learn/accessibility/test-automated"
      - title: "Deque University — color-contrast"
        url: "https://dequeuniversity.com/rules/axe/4.10/color-contrast"
    actions:
      - id: scroll-quote
        type: preview.scroll
        at: { mark: scroll-quote }
        timeoutMs: 5000
        top: 700
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-styles
        type: workspace.openFile
        at: { mark: open-styles }
        path: styles.css
      - id: type-quote
        type: editor.type
        at: { mark: type-quote }
        cadence: fast-explainer
        target: { file: styles.css, after: "", occurrence: 1 }
        text: ".quote {\n  color: saddlebrown;\n}\n"
      - id: expect-zero
        type: expect.preview
        at: { mark: after-quote }
        timeoutMs: 8000
        target: { by: testId, value: axe-count }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 1500 }

  - id: blind-spot
    chapter: "axe မမြင်တဲ့ မြန်မာ စာသား"
    narration: >
      [[mark:scroll-desc]] ဒါပေမဲ့ ကော်ဖီ card ကို ပြန်ကြည့်ပါ။ နို့ဆီနဲ့ ကော်ဖီ ဆိုတဲ့
      ဖော်ပြချက်က ခုထိ ဖျော့နေဆဲ ဖြစ်ပြီး၊ contrast row ကလည်း ၂.၂၈ နဲ့ ၁ နဲ့ fail လို့
      ပြနေပါတယ်။ ခုနက quote ထက်တောင် ပိုဖျော့ပါတယ်။ ဒါဆို axe က ဘာလို့ မပြောတာလဲ။
      [[mark:explain-skip]] axe ရဲ့ contrast rule က စာသား တစ်ခုကို မစစ်ခင်၊ အဲဒါ icon font လား
      ဆိုတာ အရင် ခန့်မှန်းပါတယ်။ မြန်မာ စကားလုံး တော်တော်များများကို icon လို့ ထင်သွားပြီး၊
      fail ရော pass ပါ မပြဘဲ ကျော်သွားပါတယ်။ ဒါက false negative ရဲ့ တကယ့် ဥပမာ တစ်ခုပါ။
      [[mark:type-desc]] ဖော်ပြချက်ကိုလည်း အညိုရင့် ပေးလိုက်ရအောင်။ ဒီလို ကျော်သွားတတ်လို့၊
      မြန်မာ website တွေမှာ contrast ကို DevTools ရဲ့ color picker လို tool နဲ့ ကိုယ်တိုင်
      ထပ်တိုင်းဖို့ လိုပါတယ်။ [[mark:after-desc]] contrast row က ၇.၀၉ နဲ့ ၁ ဖြစ်ပြီး pass
      ပါပြီ။ axe ကတော့ ဒီ ပြဿနာကို အစကတည်းက မသိခဲ့ပါဘူး။
    sources:
      - title: "axe-core — color-contrast rule (icon ligature check)"
        url: "https://github.com/dequelabs/axe-core/blob/develop/doc/rule-descriptions.md"
      - title: "WCAG 2.2 — Understanding 1.4.3 Contrast (Minimum)"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum.html"
      - title: "Chrome DevTools — Accessibility features reference: contrast"
        url: "https://developer.chrome.com/docs/devtools/accessibility/reference#contrast"
    actions:
      - id: scroll-desc
        type: preview.scroll
        at: { mark: scroll-desc }
        timeoutMs: 5000
        top: 300
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-desc-still-fails
        type: expect.preview
        at: { afterAction: scroll-desc }
        timeoutMs: 5000
        target: { by: testId, value: contrast-coffee-desc }
        attribute: { name: data-aa, value: "fail" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-desc
        type: editor.type
        at: { mark: type-desc }
        cadence: fast-explainer
        target: { file: styles.css, after: "  color: saddlebrown;\n}\n", occurrence: 1 }
        text: "\n.menu-card .desc {\n  color: saddlebrown;\n}\n"
      - id: expect-desc-passes
        type: expect.preview
        at: { mark: after-desc }
        timeoutMs: 5000
        target: { by: testId, value: contrast-coffee-desc }
        attribute: { name: data-ratio, value: "7.09" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-still-zero
        type: expect.preview
        at: { afterAction: expect-desc-passes }
        timeoutMs: 8000
        target: { by: testId, value: axe-count }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 1500 }

  - id: judgement
    chapter: "လူကပဲ ဆုံးဖြတ်နိုင်တာတွေ"
    narration: >
      [[mark:open-index-judge]] axe က ပြဿနာ မရှိဘူးလို့ ပြောပေမယ့်၊ လူတစ်ယောက် ကြည့်မှ
      သိနိုင်တဲ့ ပြဿနာတွေ ကျန်ပါသေးတယ်။ [[mark:select-logo-alt]] logo ပုံရဲ့ alt text ကို
      ကြည့်ပါ။ ဖိုင်နာမည် ဖြစ်နေပါတယ်။ alt text ရှိလို့ axe က pass ပေးပေမယ့်၊ screen reader က
      cup dot svg လို့ ဖတ်ပြမှာပါ။ ဆိုင်နာမည်က ဘေးမှာ ရှိပြီးသား ဖြစ်လို့ ဒီ logo အတွက်
      မှန်တာက alt text အလွတ်ပါ။ [[mark:select-vague]] ကြိုဆိုတဲ့ စာသားထဲက ဒီ link ကလည်း ဒီမှာ
      နှိပ်ပါ လို့ပဲ ရေးထားပါတယ်။ name ရှိလို့ axe က pass ပေးပေမယ့်၊ screen reader မှာ link
      တွေကို စာရင်းနဲ့ ကြည့်တဲ့အခါ ဘယ်ကို ရောက်မလဲ မသိနိုင်ပါဘူး။ မီနူး အပြည့်အစုံ လို့ link
      ကိုယ်တိုင်က ပြောပြရပါမယ်။ [[mark:board-judge]] ဆိုတော့ axe က pass ပေးပေမယ့် လူက
      ဆုံးဖြတ်ရမယ့် အရာတွေ ရှိပါတယ်။ [[mark:draw-judge-rows]] alt text က ပုံရဲ့ အဓိပ္ပာယ်ကို
      မှန်မှန် ပြောလား၊ link စာသားက ဘယ်ကို သွားမလဲ ပြောလား၊ မြန်မာ စာသားရဲ့ contrast လောက်လား၊
      keyboard နဲ့ အစဉ်တကျ သုံးလို့ ရလား ဆိုတာတွေပါ။ [[mark:draw-human]] ဒါတွေကို tool က
      မဆုံးဖြတ်ပေးနိုင်ဘဲ၊ လူကပဲ ဆုံးဖြတ်နိုင်ပါတယ်။
    sources:
      - title: "web.dev Learn Accessibility — Automated accessibility testing (Automated testing basics)"
        url: "https://web.dev/learn/accessibility/test-automated"
      - title: "web.dev Learn Accessibility — Manual accessibility testing (what can't be automated)"
        url: "https://web.dev/learn/accessibility/test-manual"
      - title: "WCAG 2.2 — Understanding 2.4.4 Link Purpose (In Context)"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/link-purpose-in-context.html"
      - title: "WCAG 2.2 — Understanding 2.4.9 Link Purpose (Link Only)"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/link-purpose-link-only.html"
      - title: "W3C WAI — An alt Decision Tree"
        url: "https://www.w3.org/WAI/tutorials/images/decision-tree/"
    actions:
      - id: open-index-judge
        type: workspace.openFile
        at: { mark: open-index-judge }
        path: index.html
      - id: select-logo-alt
        type: editor.select
        at: { mark: select-logo-alt }
        target: { file: index.html, text: 'alt="cup.svg"', occurrence: 1 }
      - id: select-vague
        type: editor.select
        at: { mark: select-vague }
        target: { file: index.html, text: "ဒီမှာ နှိပ်ပါ", occurrence: 1 }
      - id: expect-vague-link
        type: expect.preview
        at: { afterAction: select-vague }
        timeoutMs: 5000
        target: { by: testId, value: vague-link }
        textContains: "ဒီမှာ နှိပ်ပါ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: board-judge
        type: whiteboard.apply
        at: { mark: board-judge }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-judge-rows
        type: whiteboard.apply
        at: { mark: draw-judge-rows }
        upsertIds:
          [c-alt, c-alt-fix, c-link, c-link-fix, c-burmese, c-burmese-fix, c-keys, c-keys-fix]
        drawMs: 5200
      - id: draw-human
        type: whiteboard.apply
        at: { mark: draw-human }
        upsertIds: [c-human, c-human-line]
        drawMs: 1600

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:close-judge]] ဒါဆို ပြန်ချုပ်ရရင်၊ automated tool တွေက မြန်ပြီး ထပ်ခါထပ်ခါ run
      လို့ ရတဲ့အတွက် စမ်းသပ်ခြင်းရဲ့ ပထမ အဆင့်အဖြစ် အရမ်း အသုံးဝင်ပါတယ်။ [[mark:sel-new-form]]
      ဒီနေ့ axe က ပြဿနာ ရှစ်ခုကို စက္ကန့်ပိုင်းအတွင်း ရှာပေးခဲ့ပြီး၊ ဒီ form အသစ်လို တစ်အုပ်စုချင်း
      ပြင်တိုင်း အရေအတွက် ကျသွားတာကို မြင်ခဲ့ရပါတယ်။ [[mark:sel-desc-rule]] ဒါပေမဲ့ no issues ဆိုတာ
      accessible ဖြစ်ပြီလို့ မဆိုလိုပါဘူး။ ဒီ ဖော်ပြချက်ရဲ့ ဖျော့နေတဲ့ အရောင်ကို axe က မပြောခဲ့သလို၊
      alt text နဲ့ link စာသားရဲ့ အရည်အသွေးကိုလည်း tool က မဆုံးဖြတ်ပေးနိုင်ပါဘူး။ နောက် lesson မှာတော့ keyboard၊
      မျက်စိနဲ့ စာသား စစ်ချက်တွေနဲ့ manual testing ကို လုပ်ကြည့်ပါမယ်။
    sources:
      - title: "web.dev Learn Accessibility — Automated accessibility testing (Next step)"
        url: "https://web.dev/learn/accessibility/test-automated"
      - title: "web.dev Learn Accessibility — Manual accessibility testing"
        url: "https://web.dev/learn/accessibility/test-manual"
    actions:
      - id: close-judge
        type: whiteboard.apply
        at: { mark: close-judge }
        open: false
      - id: sel-new-form
        type: editor.select
        at: { mark: sel-new-form }
        target:
          { file: index.html, text: '<form class="news" data-testid="news-form">', occurrence: 1 }
      - id: open-styles-recap
        type: workspace.openFile
        at: { mark: sel-desc-rule }
        path: styles.css
      - id: sel-desc-rule
        type: editor.select
        at: { afterAction: open-styles-recap }
        target: { file: styles.css, text: ".menu-card .desc {", occurrence: 1 }
      - id: expect-file-form
        type: expect.file
        at: { afterAction: sel-desc-rule }
        path: index.html
        contains: '<form class="news" hidden data-testid="news-old">'
      - id: expect-file-alt
        type: expect.file
        at: { afterAction: expect-file-form }
        path: index.html
        contains: '<img src="/teahouse.svg" alt="ပြတင်းပေါက်နား ခုံတန်းရှည်နဲ့ လက်ဖက်ရည်ခွက်များ"'
      - id: expect-file-label
        type: expect.file
        at: { afterAction: expect-file-alt }
        path: index.html
        contains: '<button type="button" class="fav" aria-label="ကြိုက်တယ်"'
      - id: expect-file-list
        type: expect.file
        at: { afterAction: expect-file-label }
        path: index.html
        contains: "          <ul class=\"menu\">\n            <li class=\"menu-card featured\""
      - id: expect-file-css
        type: expect.file
        at: { afterAction: expect-file-list }
        path: styles.css
        contains: ".quote {\n  color: saddlebrown;\n}\n\n.menu-card .desc {\n  color: saddlebrown;\n}\n"

checks:
  - { type: timing.p95Ms, max: 300 }
