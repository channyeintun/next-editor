# Accessibility course (Burmese), lesson 18: automated testing.
#
# Hands-on lesson on the tea-shop page (base-axe workspace: axe-core 4.14.0
# runs in the page and the accessibility panel lists what it finds; one
# contrast row for the Burmese coffee description). Shape: board (the three
# testing steps, pros and cons of automated tests) → board (kinds of tools)
# → first axe run: 8 issues → fix one group at a time and watch the count
# drop: the subscribe form (role, tab index, aria hidden: rewritten below the
# old one, which is switched off with hidden) 8 → 4, photo alt 4 → 3, icon
# button name 3 → 2, list items wrapped in a real list 2 → 1, the English
# quote's colour (typed CSS) 1 → 0 → axe's blind spot: the pale Burmese
# description it skipped (contrast row 2.28 fail while axe says no issues) is
# fixed too → what only a person can judge (file-name alt, vague link text)
# on a board → recap → next: manual testing.
#
# Start state (index.html + base.css section E, never typed): photo with no
# alt, icon-only favourite button, drinks <li>s inside a <div>, subscribe
# form with <button role="list" tabindex="1"> and <input aria-hidden="true">,
# English quote #a99a8c on cream (2.58), Burmese descriptions #b8a99a on
# white (2.28), logo alt "cup.svg", link text "ဒီမှာ နှိပ်ပါ".
# Measured with research/smoke (headless Chrome 155, 432 × 720, drawer 50 %):
# axe violations at load: aria-required-children, button-name ×2,
# image-alt, aria-hidden-focus, color-contrast ×1 (blockquote p only),
# listitem ×2, tabindex, aria-allowed-role = 8; the Burmese .desc is neither
# a pass nor a violation (PLATFORM §7). Positions: drawer top 360, form
# 835–1018, quote 746–819, coffee description 413–438.
#
# Workspace: ws/ pinned byte-exact with tools/pin-files.ts (this file is the
# template; `bun ../../probe/build.ts template.yaml ws <slug>.yaml`).
# Validate with (from the repo root):
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   ~/Documents/a11y-course-work/tools/verify.sh <this file>
schemaVersion: 1

lesson:
  slug: a11y-course-18-automated-testing
  title: "Accessibility course 18: Automated testing"
  locale: my-MM
  workspace:
    lessonType: javascript
    name: Accessibility course 18
    entryFilePath: index.html
    files:
      axe.js: |
        // axe.js: pinned in the automated-testing lesson only (base-axe/package.json
        // installs axe-core). It hands axe to the A11y panel's "axe" mode; panel.js
        // never imports axe-core itself, so every other lesson installs without it.
        import axe from "axe-core";

        window.a11yPanelAxe = axe;
        window.dispatchEvent(new Event("a11y-panel-axe"));
      base.css: |
        /*
          base.css: pinned, never typed during a lesson.
          The shop's palette and page furniture, in its accessible form: every text
          colour passes WCAG AA, form fields have 3:1 borders, nothing hides focus.
          A lesson keeps the sections it needs and drops any declaration its own demo
          types or relies on being absent (COURSE-KIT.md, "Deriving a lesson
          workspace"). Section E holds the few rules a start state pins on purpose,
          including deliberately broken ones (a pale colour, a removed outline).
          Keep it free of the url, image-set and @-import functions (they switch on
          Vite's postcss step); images come from <img>.
        */

        /* == A. palette == */
        :root {
          color-scheme: light;
          --tea-dark: #3b2314;
          --tea: #8b5a2b;
          --tea-light: #c9a27e;
          --cream: #fff8ec;
          --paper: #fdf3e1;
          --leaf: #2f6b3a;
          --gold: #c9a227;
          --chili: #b23a2b;
          --ink: #2b1d14;
          --muted: #6b5a4c;
          --line: #e6d5bf;
          --field: #8a7866;
          --radius: 12px;
        }

        /* == B. page == */
        body {
          margin: 0;
          font-family: "Noto Sans Myanmar", "Myanmar Sangam MN", "Myanmar MN", "Myanmar Text", "Padauk",
            system-ui, sans-serif;
          font-size: 16px;
          line-height: 1.8;
          color: var(--ink);
          background: var(--paper);
        }

        .page {
          padding: 0 16px 24px;
        }

        h1,
        h2,
        h3 {
          margin: 0 0 8px;
          line-height: 1.5;
        }

        h1 {
          font-size: 22px;
        }

        h2 {
          font-size: 20px;
        }

        h3 {
          font-size: 17px;
        }

        a {
          color: var(--tea);
        }

        /* A class that sets display must never un-hide a [hidden] element. */
        [hidden] {
          display: none !important;
        }

        /* Text for screen readers only (the forms and images lessons use it). */
        .visually-hidden {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip-path: inset(50%);
          white-space: nowrap;
        }

        /* == B2. reset == */
        *,
        *::before,
        *::after {
          box-sizing: border-box;
        }

        /* == C. furniture == */
        .skip-link {
          position: absolute;
          top: -48px;
          left: 8px;
          padding: 4px 12px;
          background: var(--cream);
          color: var(--tea-dark);
        }

        .skip-link:focus {
          top: 8px;
        }

        .site-header {
          padding: 12px 16px;
          background: var(--tea-dark);
          color: var(--cream);
        }

        .site-header a {
          color: var(--cream);
        }

        .brand {
          display: flex;
          align-items: center;
          gap: 8px;
        }

        .logo {
          display: block;
        }

        .shop-name {
          margin: 0;
          flex: 1;
        }

        .call-link {
          display: inline-flex;
          padding: 8px;
          border-radius: 999px;
          background: var(--tea);
        }

        .call-link img {
          display: block;
        }

        .tagline {
          margin: 0;
          color: var(--tea-light);
          font-size: 14px;
        }

        .nav ul {
          display: flex;
          gap: 16px;
          margin: 4px 0 0;
          padding: 0;
          list-style: none;
        }

        .hero {
          margin: 16px 0;
          padding: 16px;
          background: var(--cream);
          border-radius: var(--radius);
        }

        .divider {
          display: block;
          max-width: 100%;
          height: auto;
          margin: 0 auto 16px;
        }

        .menu {
          margin: 0;
          padding: 0;
          list-style: none;
        }

        .menu-card {
          margin: 0 0 12px;
          padding: 12px 16px;
          background: #fff;
          border: 1px solid var(--line);
          border-radius: var(--radius);
        }

        .menu-card .name,
        .menu-card .desc {
          margin: 0;
        }

        .menu-card .desc {
          color: var(--muted);
          font-size: 14px;
        }

        .price {
          font-weight: 700;
          color: var(--tea);
        }

        .status {
          margin-left: 8px;
          color: var(--chili);
          font-size: 14px;
        }

        .sold-out .name {
          text-decoration: line-through;
        }

        .order-link,
        .order-btn,
        .confirm-btn,
        .disclosure,
        .fav,
        .confirm button {
          display: inline-block;
          padding: 6px 16px;
          border: 0;
          border-radius: 999px;
          background: var(--tea);
          color: #fff;
          font: inherit;
          text-decoration: none;
        }

        .fav {
          margin-left: 8px;
          padding: 0 12px;
          font-size: 14px;
        }

        .fav[aria-pressed="true"] {
          background: var(--leaf);
        }

        .tea-options {
          margin: 16px 0;
        }

        .chips {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
          margin: 12px 0 0;
          padding: 0;
          list-style: none;
        }

        .chips li {
          padding: 2px 12px;
          border: 1px solid var(--field);
          border-radius: 999px;
          background: #fff;
        }

        .gallery figure {
          margin: 0 0 12px;
        }

        .gallery img {
          display: block;
          max-width: 100%;
          height: auto;
          border-radius: var(--radius);
        }

        figcaption {
          color: var(--muted);
          font-size: 14px;
        }

        .quote {
          margin: 16px 0;
          padding: 8px 16px;
          border-left: 4px solid var(--tea);
          background: var(--cream);
          font-style: italic;
        }

        .quote p {
          margin: 0;
        }

        .hours-table {
          width: 100%;
          border-collapse: collapse;
          background: #fff;
        }

        .hours-table caption {
          text-align: start;
          color: var(--muted);
          font-size: 14px;
        }

        .hours-table th,
        .hours-table td {
          padding: 4px 8px;
          border: 1px solid var(--line);
          text-align: start;
        }

        .hours-table thead th {
          background: var(--cream);
        }

        .location {
          margin: 16px 0;
        }

        .map {
          position: relative;
          height: 120px;
          border: 1px solid var(--field);
          border-radius: var(--radius);
          background:
            linear-gradient(90deg, transparent 46%, #fff 46%, #fff 54%, transparent 54%),
            linear-gradient(0deg, transparent 40%, #fff 40%, #fff 50%, transparent 50%),
            #d9e8c9;
        }

        .map-pin {
          position: absolute;
          top: 34px;
          left: 56%;
          width: 18px;
          height: 18px;
          border: 3px solid #fff;
          border-radius: 50%;
          background: var(--chili);
        }

        .address {
          margin: 4px 0 0;
        }

        .order-form {
          margin: 16px 0;
        }

        .order-form label {
          display: block;
          margin-top: 8px;
        }

        .order-form input[type="text"],
        .order-form input[type="tel"],
        .order-form input[type="number"] {
          width: 100%;
          padding: 6px 10px;
          border: 1px solid var(--field);
          border-radius: 8px;
          background: #fff;
          font: inherit;
        }

        .hint {
          margin: 2px 0 0;
          color: var(--muted);
          font-size: 14px;
        }

        .sugar {
          margin: 12px 0 0;
          padding: 4px 12px 8px;
          border: 1px solid var(--field);
          border-radius: 8px;
        }

        .sugar label {
          display: inline-block;
          margin: 0 12px 0 0;
        }

        .order-btn {
          margin-top: 12px;
        }

        .error {
          margin: 2px 0 0;
          color: var(--chili);
          font-size: 14px;
        }

        .alert {
          margin: 8px 0 0;
          padding: 8px 12px;
          border-radius: 8px;
          background: #fde8e4;
          color: var(--chili);
        }

        .order-status {
          min-height: 1.8em;
          margin: 8px 0 0;
          color: var(--leaf);
          font-weight: 700;
        }

        .confirm {
          margin: 16px auto auto;
          max-width: 320px;
          padding: 16px;
          border: 0;
          border-radius: var(--radius);
          background: var(--cream);
          color: var(--ink);
        }

        .confirm::backdrop {
          background: rgb(0 0 0 / 0.25);
        }

        .confirm form {
          display: flex;
          gap: 8px;
        }

        .site-footer {
          margin-top: 24px;
          padding: 16px;
          background: var(--tea-dark);
          color: var(--cream);
          font-size: 14px;
        }

        .site-footer p {
          margin: 0;
        }

        .site-footer a {
          color: var(--cream);
        }

        .news {
          margin: 16px 0;
          padding: 12px 16px;
          border-radius: var(--radius);
          background: var(--cream);
        }

        .news label {
          display: block;
        }

        .news input {
          width: 100%;
          padding: 6px 10px;
          border: 1px solid var(--field);
          border-radius: 8px;
          background: #fff;
          font: inherit;
        }

        .news-btn {
          margin-top: 8px;
          padding: 6px 16px;
          border: 0;
          border-radius: 999px;
          background: var(--tea);
          color: #fff;
          font: inherit;
        }

        /* == D. helpers == */
        /* .demo shows a box's edges without changing layout (outline takes no space). */
        .demo {
          outline: 1px dashed var(--muted);
        }

        /* == E. lesson rules == */
        /* Lesson 18 start state (deliberate problems, never typed):
           1. the drinks list items sit in a div, styled like the kit's menu list;
           2. the menu descriptions and the English quote are too pale. */
        .menu-list {
          margin: 0;
          padding: 0;
          list-style: none;
        }

        .menu-card .desc {
          color: #b8a99a;
        }

        .quote {
          color: #a99a8c;
        }
      index.html: |
        <!doctype html>
        <html lang="my">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <link rel="icon" href="data:," />
            <title>ရွှေလက်ဖက်ရည်ဆိုင်</title>
            <link rel="stylesheet" href="/base.css" />
            <link rel="stylesheet" href="/styles.css" />
          </head>
          <body>
            <header class="site-header" data-testid="site-header">
              <div class="brand">
                <img class="logo" src="/cup.svg" alt="cup.svg" width="40" height="40" data-testid="logo" />
                <h1 class="shop-name" data-testid="shop-name">ရွှေလက်ဖက်ရည်ဆိုင်</h1>
              </div>
              <p class="tagline" lang="en">Yangon · since 1998</p>
            </header>

            <main class="page" id="main" data-testid="main">
              <section class="hero" data-testid="hero">
                <h2>မင်္ဂလာပါ</h2>
                <p>မီနူး အပြည့်အစုံ ကြည့်ချင်ရင် <a href="#drinks" data-testid="vague-link">ဒီမှာ နှိပ်ပါ</a></p>
              </section>

              <section class="menu-section" id="drinks" data-testid="drinks">
                <h2>သောက်စရာ</h2>
                <div class="menu-list" data-testid="menu-drinks">
                    <li class="menu-card featured" data-testid="card-laphet-yay">
                      <h3 class="name">လက်ဖက်ရည်</h3>
                      <span class="price" data-testid="price-laphet-yay">1,500 ကျပ်</span>
                      <button type="button" class="fav" data-testid="icon-btn"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 14 2 8a3 3 0 0 1 6-4 3 3 0 0 1 6 4z" fill="#fff"/></svg></button>
                    </li>
                    <li class="menu-card" data-testid="card-coffee">
                      <h3 class="name">ကော်ဖီ</h3>
                      <p class="desc" data-contrast data-testid="coffee-desc">နို့ဆီနဲ့ ကော်ဖီ</p>
                      <span class="price">1,800 ကျပ်</span>
                    </li>
                </div>
              </section>

              <section class="gallery" data-testid="gallery">
                <h2>ဆိုင်ပုံရိပ်</h2>
