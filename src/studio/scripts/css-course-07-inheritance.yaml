      # base.css: section A (palette), B2 (border-box reset) and the card
      # furniture from C. No section B text styles: body has no colour, font,
      # size or line height (the lesson types them on body) and links keep the
      # browser's blue. Dropped from C because the lesson types them or relies
      # on their absence: font: inherit on .order-btn, the card border, the
      # description colour and margin. Section E pins the page background and
      # the page padding (the layout half of section B).
      base.css: |
        /*
          base.css: pinned, never typed during a lesson.
          Lesson 7 keeps the palette (A), the border-box reset (B2) and the
          card furniture (C). Body gets no text colour, font, size or line
          height, links keep the browser's colour, buttons keep the browser's
          font, and cards have no border: the lesson types those itself.
        */

        /* == A. palette == */
        :root {
          color-scheme: light;
          --tea-dark: #3b2314;
          --tea: #8b5a2b;
          --tea-light: #c9a27e;
          --cream: #fff8ec;
          --paper: #fdf3e1;
          --leaf: #2f6b3a;
          --gold: #c9a227;
          --chili: #b23a2b;
          --ink: #2b1d14;
          --muted: #6b5a4c;
          --line: #e6d5bf;
          --radius: 12px;
        }

        /* == B2. reset == */
        *,
        *::before,
        *::after {
          box-sizing: border-box;
        }

        /* == C. furniture == */
        .site-header {
          padding: 16px;
          background: var(--tea-dark);
          color: var(--cream);
        }

        .site-header a {
          color: var(--cream);
        }

        .logo {
          display: block;
        }

        .tagline {
          margin: 0;
          color: var(--tea-light);
          font-size: 14px;
        }

        .nav ul {
          margin: 8px 0 0;
          padding: 0;
          list-style: none;
        }

        .menu {
          margin: 0;
          padding: 0;
          list-style: none;
        }

        .menu-card {
          margin: 0 0 12px;
          padding: 12px 16px;
          background: #fff;
          border-radius: var(--radius);
        }

        .menu-card .name {
          margin: 0;
        }

        .menu-card .desc {
          font-size: 14px;
        }

        .price {
          font-weight: 700;
          color: var(--tea);
        }

        .badge {
          padding: 0 8px;
          border-radius: 999px;
          background: var(--leaf);
          color: #fff;
          font-size: 13px;
        }

        .sold-out {
          opacity: 0.6;
        }

        .order-btn {
          display: inline-block;
          margin-top: 8px;
          padding: 6px 16px;
          border: 0;
          border-radius: 999px;
          background: var(--tea);
          color: #fff;
          text-decoration: none;
        }

        /* == E. lesson rules == */
        /* Lesson 7: the layout half of section B (page background and
           padding), without any text colour or font. */
        body {
          margin: 0;
          background: var(--paper);
        }

        .page {
          padding: 0 16px 24px;
        }
