build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 4107

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  - id: recall-tree
    chapter: "Inheritance ဆိုတာ ဘာလဲ"
    narration: >
      ပြီးခဲ့တဲ့ lesson နှစ်ခုမှာ cascade နဲ့ specificity ကို ကြည့်ခဲ့ပါတယ်။ element တစ်ခုတည်းအတွက် rule
      တွေ ပြိုင်နေရင် browser က ဘယ်တစ်ခုကို ရွေးလဲ ဆိုတာပါ။ [[mark:start-server]] ဒီလို
      ပြောနေတုန်းမှာပဲ၊ board နောက်က editor ထဲမှာ dev server ကို စ နေပါပြီ။ ဒါမှ page လိုတဲ့အခါ အသင့်
      ဖြစ်နေမှာပါ။ [[mark:the-question]] ဒါပေမဲ့ element တိုင်းမှာ ဘယ် rule ကမှ မပေးထားတဲ့ property တွေက
      အများကြီး ရှိပါတယ်။ menu card ထဲက စာလုံးတွေကို ကိုယ် အရောင် တစ်ခါမှ မပေးခဲ့ပေမယ့် အရောင်
      ရှိနေပါတယ်။ ဒါဆို အဲဒီ အရောင်က ဘယ်က လာတာလဲ။ [[mark:draw-tree]] ဒါက ဆိုင်ရဲ့ page
      တစ်စိတ်တစ်ပိုင်းကို tree ပုံစံ ဆွဲထားတာပါ။ အပေါ်ဆုံးက html ဖြစ်ပြီး၊ သူ့ထဲမှာ body၊ body ထဲမှာ
      header နဲ့ main ရှိပါတယ်။ main ထဲမှာ menu list၊ list ထဲမှာ menu card တစ်ခု၊ card ထဲမှာ
      ခေါင်းစဉ်နဲ့ ဖော်ပြချက် စာပိုဒ် ရှိပါတယ်။ [[mark:draw-body]] body ကိုပဲ အရောင် တစ်ခု ပေးပြီး၊
      တခြား ဘာကိုမှ မပေးဘူး ဆိုပါစို့။ [[mark:draw-flow]] အဲဒီအခါ body အောက်က element တိုင်းက အရောင်ကို
      သူ့ parent ဆီကနေ ယူပါတယ်။ main က body ဆီက၊ card က list ဆီက၊ ခေါင်းစဉ်က card ဆီကနေ ယူတာပါ။ ဒီလို
      parent ရဲ့ တန်ဖိုးကို child က အလိုလို ဆက်ယူတာကို inheritance လို့ ခေါ်ပါတယ်၊ မိဘဆီက အမွေ
      ရသလိုပါပဲ။ [[mark:draw-root]] html က tree ရဲ့ root ပါ။ သူ့မှာ parent မရှိလို့ ဘယ်သူ့ဆီကမှ inherit
      မဖြစ်ပါဘူး။ ပြီးတော့ html မှာ ပေးထားတဲ့ တန်ဖိုးက page ထဲက element တိုင်းဆီ ရောက်နိုင်ပါတယ်။
      [[mark:draw-no-up]] inheritance က အောက်ကိုပဲ စီးပါတယ်။ ဒါကြောင့် body မှာ ပေးထားတဲ့ တန်ဖိုးက html
      ဆီ ပြန်မတက်သလို၊ child က သူ့ parent ကို ဘယ်တော့မှ မပြောင်းနိုင်ပါဘူး။ header နဲ့ main လို sibling
      တွေကြားမှာလည်း တန်ဖိုး ဘေးချင်း မကူးပါဘူး။
    sources:
      - title: "web.dev Learn CSS — Inheritance: inheritance flow"
        url: "https://web.dev/learn/css/inheritance#inheritance-flow"
      - title: "MDN — Inheritance"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/Inheritance"
      - title: "CSS Cascading and Inheritance Level 5 — Inheritance"
        url: "https://www.w3.org/TR/css-cascade-5/#inheriting"
    actions:
      - id: open-tree-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      # Runs in the background (boot + pnpm install + spawn); waitForReady
      # sits on the preview mark in the next scene, well over 40 s of
      # narration later.
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 45000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-tree
        type: whiteboard.apply
        at: { mark: draw-tree }
        upsertIds:
          [
            a-html,
            a-html-label,
            a-body,
            a-body-label,
            a-header,
            a-header-label,
            a-main,
            a-main-label,
            a-list,
            a-list-label,
            a-card,
            a-card-label,
            a-h3,
            a-h3-label,
            a-p,
            a-p-label,
          ]
        drawMs: 4600
      - id: draw-body
        type: whiteboard.apply
        at: { mark: draw-body }
        upsertIds: [a-body-circle, a-body-note]
        drawMs: 1600
      - id: draw-flow
        type: whiteboard.apply
        at: { mark: draw-flow }
        upsertIds: [a-flow-arrow, a-flow-label]
        drawMs: 1800
      - id: draw-root
        type: whiteboard.apply
        at: { mark: draw-root }
        upsertIds: [a-root-note]
        drawMs: 1200
      - id: draw-no-up
        type: whiteboard.apply
        at: { mark: draw-no-up }
        upsertIds: [a-no-up, a-no-side]
        drawMs: 1800

  - id: code-tour
    narration: >
      [[mark:close-tree-board]] project ကို ကြည့်ရအောင်။ [[mark:open-index]] ဒါက ဆိုင်ရဲ့ HTML ဖိုင်ပါ။
      header၊ သောက်စရာ menu နဲ့ သူ့အောက်က စားစရာ menu ပါပါတယ်။ [[mark:select-actions]] သောက်စရာ card
      တွေမှာ မှာမယ် ခလုတ်နဲ့ အသေးစိတ် ကြည့်ဖို့ link ပါလာပါတယ်။ [[mark:select-plain]] ကော်ဖီ card ရဲ့
      ခလုတ်မှာတော့ plain ဆိုတဲ့ class တစ်ခု ပိုပါပါတယ်။ lesson အဆုံးပိုင်းမှာ သုံးပါမယ်။
      [[mark:open-styles]] ကိုယ့် CSS ဖိုင်က အလွတ်ပါ။ ဒီတစ်ခါ base ဖိုင်က page ကို စာလုံး အရောင်နဲ့ font
      မပေးထားဘဲ၊ ဆိုင်ရဲ့ အရောင်တွေနဲ့ card ပုံစံလောက်ပဲ ပေးထားပါတယ်။ ဒါမှ တန်ဖိုးတွေ အောက်ကို
      စီးသွားတာကို ကိုယ်တိုင် မြင်ရမှာပါ။ [[mark:preview-opens]] dev server အသင့် ဖြစ်လို့ ညာဘက်မှာ
      preview ပွင့်လာပါပြီ။ menu ထဲက စာလုံးတွေက browser ရဲ့ default font နဲ့ အမည်းရောင် ဖြစ်နေပါတယ်။
      အသေးစိတ် link တွေက အပြာရောင်၊ မှာမယ် ခလုတ်တွေကတော့ အညိုရောင် နောက်ခံပေါ်မှာ အဖြူရောင် စာလုံးနဲ့ပါ။
    sources:
      - title: "web.dev Learn CSS — Inheritance"
        url: "https://web.dev/learn/css/inheritance"
      - title: "MDN — <button>: the Button element"
        url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Element/button"
      - title: "MDN — <a>: the Anchor element"
        url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Element/a"
    actions:
      - id: close-tree-board
        type: whiteboard.apply
        at: { mark: close-tree-board }
        open: false
      - id: open-index
        type: workspace.openFile
        at: { mark: open-index }
        path: index.html
      - id: select-actions
        type: editor.select
        at: { mark: select-actions }
        target:
          file: index.html
          text: "<div class=\"actions\">\n              <button class=\"order-btn\" type=\"button\">မှာမယ်</button>\n              <a href=\"#order\">အသေးစိတ်</a>\n            </div>"
          occurrence: 1
      - id: select-plain
        type: editor.select
        at: { mark: select-plain }
        target:
          {
            file: index.html,
            text: '<button class="order-btn plain" type="button" data-testid="plain-button">မှာမယ်</button>',
            occurrence: 1,
          }
      - id: open-styles
        type: workspace.openFile
        at: { mark: open-styles }
        path: styles.css
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { mark: preview-opens }
        timeoutMs: 20000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-dev-server }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-shop-name
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: shop-name }
        textContains: "ရွှေလက်ဖက်ရည်ဆိုင်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-first-card
        type: expect.preview
        at: { afterAction: expect-shop-name }
        timeoutMs: 5000
        target: { by: testId, value: card-laphet-yay }
        textContains: "အသေးစိတ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: collapse-runner-dock
        type: runtime.collapseDock
        at: { afterAction: expect-first-card }

  - id: body-hook
    chapter: "ခလုတ်နဲ့ link က ဘာကြောင့် မလိုက်လဲ"
    narration: >
      [[mark:type-body]] စာလုံး အရောင်နဲ့ အရွယ်အစားကို body element တစ်ခုတည်းမှာပဲ ပေးကြည့်ရအောင်။
      အရောင်ကို အညိုရောင်၊ font size ကို 18 pixel ပေးပါမယ်။ [[mark:type-font]] ပြီးတော့ ဆိုင်ရဲ့ မြန်မာ
      font စာရင်းကို ထည့်ပါမယ်။ font family declaration တစ်ခုတည်း ဖြစ်ပေမယ့် ရှည်လို့ နှစ်ကြောင်း
      ဖြစ်သွားတာပါ။ [[mark:after-body]] preview ကို ကြည့်ပါ။ menu ထဲက စာတွေ အညိုရောင် ဖြစ်သွားပြီး
      ခေါင်းစဉ်တွေ ကြီးလာပါပြီ။ စာလုံးတွေကလည်း ဆိုင်ရဲ့ font နဲ့ ပေါ်လာပါပြီ။ [[mark:select-body]] ဒီ
      body selector ကို ကြည့်ပါ။ body မှာ rule တစ်ခုတည်း ရေးခဲ့ပေမယ့်၊ element အများစု ပြောင်းသွားတာက
      တစ်ခုစီက သူ့ parent ဆီကနေ inherit ဖြစ်လို့ပါ။ [[mark:header-note]] header ထဲက ဆိုင်နာမည်ကတော့
      နို့နှစ်ရောင် အတိုင်းပါ။ base ဖိုင်က header ကို ကိုယ်ပိုင် အရောင် ပေးထားလို့၊ body ဆီက မဟုတ်ဘဲ
      header ဆီက ယူတာပါ။ header ထဲက link တွေကိုတော့ base ဖိုင်က တိုက်ရိုက် အရောင် ပေးထားပါတယ်။
      [[mark:odd-ones]] ဒါပေမဲ့ လိုက်မပြောင်းတဲ့ အရာ နှစ်ခု ရှိပါတယ်။ မှာမယ် ခလုတ်တွေက system font
      သေးသေးလေးနဲ့ပဲ ကျန်နေပြီး၊ အသေးစိတ် link တွေကလည်း အပြာရောင် အတိုင်းပါ။ သူတို့လည်း body ထဲမှာပဲ
      ရှိတာပါ။ ဒါဆို ဘာကြောင့် inherit မဖြစ်တာလဲ။ မကြာခင် ဖြေပါမယ်။
    sources:
      - title: "web.dev Learn CSS — Inheritance"
        url: "https://web.dev/learn/css/inheritance"
      - title: "MDN — Inheritance"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/Inheritance"
      - title: "MDN — font-family"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/font-family"
    actions:
      - id: type-body
        type: editor.type
        at: { mark: type-body }
        cadence: fast-explainer
        target: { file: styles.css, after: "", occurrence: 1 }
        text: "body {\n  color: saddlebrown;\n  font-size: 18px;\n}\n"
      - id: type-font
        type: editor.type
        at: { mark: type-font }
        cadence: line-by-line
        target: { file: styles.css, after: "  font-size: 18px;\n", occurrence: 1 }
        text: "  font-family: \"Noto Sans Myanmar\", \"Myanmar Sangam MN\", \"Myanmar MN\",\n    \"Myanmar Text\", \"Padauk\", system-ui, sans-serif;\n"
      - id: expect-drinks-after-body
        type: expect.preview
        at: { mark: after-body }
        timeoutMs: 4000
        target: { by: testId, value: menu-drinks }
        textContains: "ကော်ဖီ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-body
        type: editor.select
        at: { mark: select-body }
        target: { file: styles.css, text: "body {", occurrence: 1 }

  - id: box-props
    chapter: "Inherit ဖြစ်တဲ့ property တွေ"
    narration: >
      [[mark:scroll-to-menu]] ဒီကစပြီး menu card တွေပေါ်မှာပဲ စမ်းမှာ ဖြစ်လို့၊ page ကို အဲဒီအထိ scroll
      လုပ်ပြီး ဆင်းလိုက်ရအောင်။ [[mark:type-menu]] အခု box နဲ့ ဆိုင်တဲ့ property တွေကို စမ်းကြည့်ရအောင်။
      menu list နှစ်ခုလုံးကို 2 pixel ထူတဲ့ အညိုဖျော့ရောင် border နဲ့ padding 8 pixel ပေးပါမယ်။
      [[mark:after-menu]] list တစ်ခုစီမှာ အညိုဖျော့ရောင် ဘောင်နဲ့ အတွင်းမှာ နေရာလွတ် နည်းနည်း
      ပေါ်လာပါပြီ။ ဒါပေမဲ့ ထဲက card တွေမှာတော့ ဘောင် မပေါ်ပါဘူး။ border နဲ့ padding က inherit
      မဖြစ်လို့ပါ။ ဘယ်ဟာ inherit ဖြစ်လဲ ဆိုတာကို အကြမ်းဖျင်း မှတ်ထားလို့ ရပါတယ်။ [[mark:draw-yes]] စာနဲ့
      ဆိုင်တဲ့ property တွေက inherit ဖြစ်ပါတယ်။ အရောင်၊ font နဲ့ ဆိုင်တဲ့ property တွေ၊ line height နဲ့
      စာ ညှိပုံ စတာတွေပါ။ card ထဲက စာတွေကို font နဲ့ အရောင် တူစေချင်တာ များလို့၊ ဒီ တန်ဖိုးတွေ အလိုလို
      ဆင်းသွားတော့ element တိုင်းမှာ ထပ်ရေးစရာ မလိုပါဘူး။ [[mark:draw-no]] box နဲ့ ဆိုင်တဲ့ border၊
      padding၊ margin၊ နောက်ခံနဲ့ အကျယ် စတာတွေကတော့ inherit မဖြစ်ပါဘူး။ border သာ inherit ဖြစ်ခဲ့ရင်၊
      list ထဲက ခေါင်းစဉ်၊ စာပိုဒ်၊ ခလုတ် အားလုံးမှာ ဘောင်တွေ ပေါ်နေမှာပါ။ [[mark:background-note]] child
      က parent ရဲ့ နောက်ခံကို မျှသုံးနေသလို ထင်ရတတ်ပေမယ့်၊ တကယ်တော့ inherit ဖြစ်တာ မဟုတ်ပါဘူး။ child ရဲ့
      ကိုယ်ပိုင် နောက်ခံက ကြည်နေလို့၊ နောက်က parent ရဲ့ အရောင်ကို ဖောက်ထွင်း မြင်နေရတာပါ။
      [[mark:draw-mdn]] မသေချာရင် အဲဒီ property ကို MDN မှာ ရှာကြည့်ပါ။ formal definition ထဲမှာ
      Inherited ဆိုတဲ့ အတန်း ပါပြီး၊ yes ဒါမှမဟုတ် no လို့ ပြထားပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Inheritance: which properties are inherited by default"
        url: "https://web.dev/learn/css/inheritance#which-properties-are-inherited-by-default"
      - title: "CSS 2.2 — Full property table (Inherited? column)"
        url: "https://www.w3.org/TR/CSS22/propidx.html"
      - title: "MDN — background-color (initial value transparent, not inherited)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/background-color"
      - title: "MDN — border (formal definition)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/border"
    actions:
      # The header fills the top half of the preview; from here on every
      # demo is on the drinks cards, so the page scrolls to the drinks
      # heading (the header is 363 px tall once the body rule is in).
      - id: scroll-to-menu
        type: preview.scroll
        at: { mark: scroll-to-menu }
        top: 363
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-menu
        type: editor.type
        at: { mark: type-menu }
        cadence: fast-explainer
        target: { file: styles.css, after: "system-ui, sans-serif;\n}\n", occurrence: 1 }
        text: "\n.menu {\n  border: 2px solid tan;\n  padding: 8px;\n}\n"
      - id: expect-coffee-after-menu
        type: expect.preview
        at: { mark: after-menu }
        timeoutMs: 4000
        target: { by: testId, value: card-coffee }
        textContains: "နို့ဆီနဲ့ ကော်ဖီ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: open-lists
        type: whiteboard.apply
        at: { mark: draw-yes, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-yes
        type: whiteboard.apply
        at: { mark: draw-yes }
        upsertIds: [b-yes-head, b-yes-check, b-yes-sub, b-yes-box, b-yes-list]
        drawMs: 3000
      - id: draw-no
        type: whiteboard.apply
        at: { mark: draw-no }
        upsertIds: [b-no-head, b-no-sub, b-no-box, b-no-list]
        drawMs: 3000
      - id: draw-mdn
        type: whiteboard.apply
        at: { mark: draw-mdn }
        upsertIds: [b-mdn]
        drawMs: 1500

  - id: border-inherit
    narration: >
      [[mark:close-lists]] ဒါဆို card တွေကလည်း list ရဲ့ border ကို ယူစေချင်ရင် ဘယ်လို လုပ်မလဲ။
      [[mark:keywords-intro]] CSS မှာ property တိုင်းနဲ့ သုံးလို့ရပြီး၊ တန်ဖိုး ဘယ်က လာမလဲ ဆိုတာ
      ဆုံးဖြတ်ပေးတဲ့ အထူး keyword ငါးခု ရှိပါတယ်။ ဒီ lesson မှာ ငါးခုလုံး တွေ့ရမှာ ဖြစ်ပြီး၊ ပထမဆုံးက
      inherit ပါ။ [[mark:type-card-border]] menu card တွေရဲ့ border ကို inherit ဆိုတဲ့ keyword
      ပေးကြည့်ရအောင်။ အထူ၊ မျဉ်းပုံစံ၊ အရောင်တွေကို ထပ်မရေးတော့ဘဲ၊ keyword တစ်လုံးတည်းနဲ့ parent ဆီက
      ယူခိုင်းတာပါ။ [[mark:after-card-border]] အခု card တိုင်းမှာ list နဲ့ တူတဲ့ အညိုဖျော့ရောင် ဘောင်
      ပေါ်လာပါပြီ။ inherit keyword က ပုံမှန် inherit မဖြစ်တဲ့ property မှာတောင် parent ရဲ့ တန်ဖိုးကို
      ယူပေးပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Inheritance: explicitly inherit and control inheritance"
        url: "https://web.dev/learn/css/inheritance#explicitly-inherit-and-control-inheritance"
      - title: "MDN — inherit"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/inherit"
      - title: "CSS Cascading and Inheritance Level 5 — CSS-wide keywords"
        url: "https://www.w3.org/TR/css-cascade-5/#defaulting-keywords"
    actions:
      - id: close-lists
        type: whiteboard.apply
        at: { mark: close-lists }
        open: false
      - id: type-card-border
        type: editor.type
        at: { mark: type-card-border }
        cadence: fast-explainer
        target: { file: styles.css, after: "  padding: 8px;\n}\n", occurrence: 1 }
        text: "\n.menu-card {\n  border: inherit;\n}\n"
      - id: expect-card-after-border
        type: expect.preview
        at: { mark: after-card-border }
        timeoutMs: 4000
        target: { by: testId, value: card-laphet-yay }
        textContains: "လက်ဖက်ရည်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: value-board
    chapter: "တန်ဖိုး ဘယ်က လာလဲ"
    narration: >
      [[mark:open-value]] ဒါဆို element တစ်ခုပေါ်က property တစ်ခုရဲ့ တန်ဖိုးကို browser က ဘယ်လို ရှာလဲ။
      မေးခွန်း နှစ်ခုအထိ မေးပါတယ်။ [[mark:draw-q1]] ပထမ မေးခွန်းက၊ ဒီ element ပေါ်မှာ ဒီ property ကို
      ပေးထားတဲ့ declaration ရှိလား ဆိုတာပါ။ ကိုယ့် CSS ကပဲ ဖြစ်ဖြစ်၊ browser ရဲ့ stylesheet ကပဲ ဖြစ်ဖြစ်
      ရပါတယ်။ ရှိရင်တော့ cascade က နိုင်တဲ့ တစ်ခုကို ရွေးပါတယ်။ [[mark:draw-q2]] ဘာ declaration မှ
      မရှိမှ ဒုတိယ မေးခွန်းကို မေးပါတယ်။ inherit ဖြစ်တဲ့ property ဆိုရင် element က parent ရဲ့ computed
      value ကို ယူပါတယ်။ computed value ဆိုတာ ရေးထားတဲ့ တန်ဖိုးကို browser က တွက်ပြီးမှ ရတဲ့ တန်ဖိုးပါ။
      ဥပမာ parent ရဲ့ font size ကို သူ့ parent ရဲ့ နှစ်ဆ ဖြစ်တဲ့ 2 em လို့ ရေးထားရင်၊ child ဆီ ရောက်တာက
      2 em မဟုတ်ဘဲ pixel နဲ့ တွက်ပြီးသား ရလဒ်ပါ။ ဒါကြောင့် child က နှစ်ဆ ထပ် မကြီးသွားတာပါ။
      [[mark:draw-initial]] inherit မဖြစ်ရင်တော့ initial value ကို ရပါတယ်။ initial value ဆိုတာ CSS ရဲ့
      တရားဝင် စာတမ်း ဖြစ်တဲ့ specification က property တိုင်းအတွက် သတ်မှတ်ထားတဲ့ စံ တန်ဖိုးပါ။ card
      တွေမှာ ဘောင် မရှိခဲ့တာလည်း border မျဉ်းပုံစံရဲ့ initial value က မျဉ်း မရှိတာ ဖြစ်လို့ပါ။
      [[mark:draw-hook-answer]] အခု ခလုတ်နဲ့ link တွေ ဘာကြောင့် မလိုက်ခဲ့လဲ သိပါပြီ။ browser ရဲ့
      stylesheet မှာ ခလုတ်ကို ကိုယ်ပိုင် font၊ link ကို ကိုယ်ပိုင် အပြာရောင် တိုက်ရိုက် ပေးထားတဲ့ rule
      တွေ ရှိပါတယ်။ element ပေါ်က declaration က inheritance ကို အမြဲ နိုင်လို့၊ body ရဲ့ တန်ဖိုးတွေ
      သူတို့ဆီ မရောက်ခဲ့တာပါ။ [[mark:draw-summary]] ဆိုတော့ cascade က declaration တွေထဲက တစ်ခုကို
      ရွေးပြီး၊ inheritance ကတော့ declaration မရှိတဲ့ ကွက်လပ်တွေကိုပဲ ဖြည့်ပေးတာပါ။ DevTools ကလည်း
      inherit ဖြစ်လာတဲ့ တန်ဖိုး ဘယ် element ဆီက လာလဲ ပြပေးပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Inheritance: how inheritance works"
        url: "https://web.dev/learn/css/inheritance#how-inheritance-works"
      - title: "MDN — Computed value"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/computed_value"
      - title: "MDN — Initial value"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/initial_value"
      - title: "MDN — Introduction to the CSS cascade"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Cascade/Introduction"
      - title: "CSS Cascading and Inheritance Level 5 — Value processing"
        url: "https://www.w3.org/TR/css-cascade-5/#value-stages"
    actions:
      - id: open-value
        type: whiteboard.apply
        at: { mark: open-value }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-q1
        type: whiteboard.apply
        at: { mark: draw-q1 }
        upsertIds: [c-q1, c-q1-text, c-q1-yes, c-cascade]
        drawMs: 2400
      - id: draw-q2
        type: whiteboard.apply
        at: { mark: draw-q2 }
        upsertIds: [c-q1-no, c-q1-no-label, c-q2, c-q2-text, c-q2-yes, c-parent]
        drawMs: 3000
      - id: draw-initial
        type: whiteboard.apply
        at: { mark: draw-initial }
        upsertIds: [c-q2-no, c-q2-no-label, c-initial, c-initial-text]
        drawMs: 2200
      - id: draw-hook-answer
        type: whiteboard.apply
        at: { mark: draw-hook-answer }
        upsertIds: [c-ua-text, c-ua-arrow, c-ua-rule]
        drawMs: 2400
      - id: draw-summary
        type: whiteboard.apply
        at: { mark: draw-summary }
        upsertIds: [c-summary]
        drawMs: 2000

  - id: direct-wins
    narration: >
      [[mark:close-value]] ကိုယ့် CSS နဲ့ လက်တွေ့ စမ်းကြည့်ရအောင်။ [[mark:type-menu-color]] menu rule
      ထဲမှာ အစိမ်းရောင် စာလုံး အရောင် ထည့်ပါမယ်။ [[mark:after-menu-color]] card ခေါင်းစဉ်နဲ့
      ဖော်ပြချက်တွေ အစိမ်းရောင် ဖြစ်သွားပါပြီ။ list ဆီကနေ card ကတစ်ဆင့် ဆင်းလာတာပါ။ ဈေးနှုန်းတွေကတော့
      base ဖိုင်က ကိုယ်ပိုင် အရောင် ပေးထားလို့ အညိုရောင် အတိုင်း ကျန်နေပါတယ်။ [[mark:type-p-gray]] အခု
      အရမ်း ပေါ့တဲ့ selector နဲ့ စာပိုဒ် အားလုံးကို မီးခိုးရောင် ပေးပါမယ်။ [[mark:after-p-gray]]
      ဖော်ပြချက်တွေက စာပိုဒ်တွေ ဖြစ်လို့ မီးခိုးရောင် ဖြစ်သွားပါပြီ။ [[mark:select-menu-selector]] ဒီ
      menu selector ကို ကြည့်ပါ။ class ဖြစ်လို့ သူ့ specificity က စာပိုဒ် selector ရိုးရိုးထက်
      ပိုများပါတယ်။ [[mark:select-p-selector]] ဒါပေမဲ့ ဒီ စာပိုဒ် rule ကို ကြည့်ပါ။ specificity က
      element တစ်ခုတည်းကို ရွေးထားတဲ့ declaration တွေကြားမှာပဲ နှိုင်းယှဉ်တာပါ။ အစိမ်းရောင်က inheritance
      နဲ့ ရောက်လာတာ ဖြစ်ပြီး၊ အဲဒီလို တန်ဖိုးမှာ specificity လုံးဝ မရှိလို့၊ element ကို တိုက်ရိုက်
      ရွေးတဲ့ rule တိုင်းက သူ့ကို နိုင်ပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Specificity"
        url: "https://web.dev/learn/css/specificity"
      - title: "MDN — Specificity (directly targeted elements vs. inherited styles)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Cascade/Specificity"
      - title: "MDN — Handling conflicts"
        url: "https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Styling_basics/Handling_conflicts"
    actions:
      - id: close-value
        type: whiteboard.apply
        at: { mark: close-value }
        open: false
      - id: type-menu-color
        type: editor.type
        at: { mark: type-menu-color }
        cadence: natural
        target: { file: styles.css, after: "  padding: 8px;\n", occurrence: 1 }
        text: "  color: green;\n"
      - id: type-p-gray
        type: editor.type
        at: { mark: type-p-gray }
        cadence: fast-explainer
        target: { file: styles.css, after: "  border: inherit;\n}\n", occurrence: 1 }
        text: "\np {\n  color: dimgray;\n}\n"
      - id: expect-coffee-after-gray
        type: expect.preview
        at: { mark: after-p-gray }
        timeoutMs: 4000
        target: { by: testId, value: card-coffee }
        textContains: "1,800 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-menu-selector
        type: editor.select
        at: { mark: select-menu-selector }
        target: { file: styles.css, text: ".menu {", occurrence: 1 }
      - id: select-p-selector
        type: editor.select
        at: { mark: select-p-selector }
        target: { file: styles.css, text: "p {\n  color: dimgray;\n}", occurrence: 1 }

  - id: fix-hook
    chapter: "ခလုတ်နဲ့ link ကို ပြင်ရအောင်"
    narration: >
      [[mark:type-button-font]] အခု inherit နဲ့ ခလုတ်တွေကို ပြင်လို့ ရပါပြီ။ origin အဆင့်မှာ ကိုယ့် CSS
      က browser ရဲ့ stylesheet ကို နိုင်လို့၊ ခလုတ်တိုင်းရဲ့ font ကို parent ဆီကနေ ယူခိုင်းပါမယ်။
      [[mark:after-button-font]] ခလုတ်ထဲက စာလုံးတွေ ကြီးလာပြီး၊ page ရဲ့ font နဲ့ ပေါ်လာပါပြီ။
      [[mark:select-font-inherit]] ဒီ font declaration ကို ကြည့်ပါ။ font က font family၊ အရွယ်အစား၊
      စာလုံး အထူနဲ့ line height ကို တစ်ခါတည်း ပေးတဲ့ shorthand property ဖြစ်လို့၊ အကုန်လုံးကို parent
      ဆီက ယူလာပါတယ်။ form ထဲက ခလုတ်နဲ့ အကွက်တွေက ဒီလို မပေးရင် page ရဲ့ font ကို မသုံးလို့၊ CSS reset
      အများစုမှာ ဒီ declaration ပါလေ့ရှိပါတယ်။ [[mark:type-link-color]] link တွေအတွက်တော့ အရောင်ကို
      inherit ဖြစ်စေပါမယ်။ [[mark:after-link-color]] အသေးစိတ် link တွေက အပြာရောင် မဟုတ်တော့ဘဲ၊ card
      စာတွေလို အစိမ်းရောင် ဖြစ်သွားပါပြီ။
    sources:
      - title: "web.dev Learn CSS — Inheritance: the inherit keyword"
        url: "https://web.dev/learn/css/inheritance#inherit"
      - title: "MDN — font (shorthand)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/font"
      - title: "MDN — Styling web forms (font inheritance of form controls)"
        url: "https://developer.mozilla.org/en-US/docs/Learn_web_development/Extensions/Forms/Styling_web_forms"
    actions:
      - id: type-button-font
        type: editor.type
        at: { mark: type-button-font }
        cadence: fast-explainer
        target: { file: styles.css, after: "  color: dimgray;\n}\n", occurrence: 1 }
        text: "\nbutton {\n  font: inherit;\n}\n"
      - id: expect-plain-button
        type: expect.preview
        at: { mark: after-button-font }
        timeoutMs: 4000
        target: { by: testId, value: plain-button }
        textContains: "မှာမယ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-font-inherit
        type: editor.select
        at: { mark: select-font-inherit }
        target: { file: styles.css, text: "font: inherit;", occurrence: 1 }
      - id: type-link-color
        type: editor.type
        at: { mark: type-link-color }
        cadence: fast-explainer
        target: { file: styles.css, after: "  font: inherit;\n}\n", occurrence: 1 }
        text: "\na {\n  color: inherit;\n}\n"
      - id: expect-link-after-color
        type: expect.preview
        at: { mark: after-link-color }
        timeoutMs: 4000
        target: { by: testId, value: card-lime-juice }
        textContains: "အသေးစိတ်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: initial
    chapter: "Initial၊ revert နဲ့ unset"
    narration: >
      [[mark:type-desc-initial]] ဒုတိယ keyword က initial ပါ။ သူက property ကို specification ထဲက initial
      value ပြန်ဖြစ်အောင် လုပ်ပေးပါတယ်။ card ဖော်ပြချက်တွေရဲ့ display ကို initial ပေးကြည့်ရအောင်။
      [[mark:after-desc-initial]] ဖော်ပြချက်တွေက ကိုယ်ပိုင် စာကြောင်း သီးသန့် မရှိတော့ဘဲ၊ ဈေးနှုန်းက
      သူတို့ ဘေးကို တက်လာပါပြီ။ [[mark:initial-why]] စာပိုဒ်က block ဖြစ်လို့ initial ဆိုရင် block
      ဖြစ်မယ် ထင်စရာ ရှိပါတယ်။ ဒါပေမဲ့ display ရဲ့ initial value က element တိုင်းအတွက် inline ပါ။
      စာပိုဒ်တွေ block ဖြစ်တာက browser ရဲ့ stylesheet က ပေးထားလို့ပါ။ ဆိုတော့ initial ဆိုတာ element
      အတွက် browser ရဲ့ default မဟုတ်ဘဲ၊ property အတွက် specification ထဲက default ပါ။
    sources:
      - title: "web.dev Learn CSS — Inheritance: the initial keyword"
        url: "https://web.dev/learn/css/inheritance#initial"
      - title: "MDN — initial"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/initial"
      - title: "MDN — display (formal definition: initial value inline)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/display"
    actions:
      - id: type-desc-initial
        type: editor.type
        at: { mark: type-desc-initial }
        cadence: fast-explainer
        target: { file: styles.css, after: "  color: inherit;\n}\n", occurrence: 1 }
        text: "\n.menu-card .desc {\n  display: initial;\n}\n"
      - id: expect-price-after-initial
        type: expect.preview
        at: { mark: after-desc-initial }
        timeoutMs: 4000
        target: { by: testId, value: price-laphet-yay }
        textContains: "1,500 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: revert
    narration: >
      [[mark:type-revert]] တတိယ keyword revert က browser ရဲ့ style ကို ပြန်ယူပါတယ်။ featured class ပါတဲ့
      လက်ဖက်ရည် card ရဲ့ ဖော်ပြချက်မှာ display ကို revert ပေးပါမယ်။ [[mark:after-revert]] လက်ဖက်ရည် card
      ရဲ့ ဖော်ပြချက် တစ်ခုတည်းပဲ block ပြန်ဖြစ်ပြီး ကိုယ်ပိုင် စာကြောင်း ပြန်ရသွားပါပြီ။ revert က အဲဒီ
      property အတွက် ကိုယ် ရေးထားတဲ့ declaration တွေကို ကျော်ပြီး၊ browser ရဲ့ stylesheet က ပေးတဲ့
      တန်ဖိုးကို ပြန်ယူပါတယ်။ စာပိုဒ်အတွက်တော့ block ပါ။ [[mark:revert-note]] browser တစ်ခုစီမှာ
      ကိုယ်ပိုင် default stylesheet ရှိလို့၊ revert ရဲ့ ရလဒ်က browser တစ်ခုနဲ့ တစ်ခု နည်းနည်း
      ကွာနိုင်ပါတယ်။ အထူးသဖြင့် ခလုတ်နဲ့ form ထဲက အကွက်တွေမှာပါ။
    sources:
      - title: "web.dev Learn CSS — Inheritance: the revert keyword"
        url: "https://web.dev/learn/css/inheritance#revert"
      - title: "MDN — revert"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/revert"
      - title: "CSS Cascading and Inheritance Level 5 — Rolling back cascade origins"
        url: "https://www.w3.org/TR/css-cascade-5/#default"
    actions:
      - id: type-revert
        type: editor.type
        at: { mark: type-revert }
        cadence: fast-explainer
        target: { file: styles.css, after: "  display: initial;\n}\n", occurrence: 1 }
        text: "\n.featured .desc {\n  display: revert;\n}\n"
      - id: expect-featured-after-revert
        type: expect.preview
        at: { mark: after-revert }
        timeoutMs: 4000
        target: { by: testId, value: card-laphet-yay }
        textContains: "ချိုဆိမ့် ပေါ့ဆိမ့် ကြိုက်သလို"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: unset
    narration: >
      [[mark:type-unset-color]] လေးခုမြောက် keyword က unset ပါ။ သူက ခုနက board ပေါ်က ပထမ မေးခွန်းကို
      ကျော်ပြီး၊ browser ရဲ့ declaration အပါအဝင် ဘာ declaration မှ မရှိသလို လုပ်ပါတယ်။ အရောင်လို inherit
      ဖြစ်တဲ့ property အတွက်ဆိုရင် inherit နဲ့ အတူတူပါ။ [[mark:after-unset-color]] လက်ဖက်ရည် card ရဲ့
      ဖော်ပြချက် အစိမ်းရောင် ပြန်ဖြစ်သွားပါပြီ။ မီးခိုးရောင် စာပိုဒ် rule ကို unset က မရှိသလို
      လုပ်လိုက်လို့၊ card ဆီကနေ အရောင်ကို ယူသွားတာပါ။ [[mark:type-unset-margin]] margin က inherit
      မဖြစ်လို့၊ margin အတွက် unset က initial နဲ့ အတူတူပါ။ [[mark:after-unset-margin]] အဲဒီ
      ဖော်ပြချက်ရဲ့ အပေါ်နဲ့ အောက်က နေရာလွတ်တွေ ပျောက်သွားပါပြီ။ အဲဒီ margin တွေက browser ရဲ့ stylesheet
      က လာတာ ဖြစ်ပြီး၊ unset က သူတို့ကို initial value ဖြစ်တဲ့ သုညနဲ့ အစားထိုးလိုက်တာပါ။
    sources:
      - title: "web.dev Learn CSS — Inheritance: the unset keyword"
        url: "https://web.dev/learn/css/inheritance#unset"
      - title: "MDN — unset"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/unset"
      - title: "MDN — margin (initial value 0, not inherited)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/margin"
    actions:
      - id: type-unset-color
        type: editor.type
        at: { mark: type-unset-color }
        cadence: natural
        target: { file: styles.css, after: "  display: revert;\n", occurrence: 1 }
        text: "  color: unset;\n"
      - id: type-unset-margin
        type: editor.type
        at: { mark: type-unset-margin }
        cadence: natural
        target: { file: styles.css, after: "  color: unset;\n", occurrence: 1 }
        text: "  margin: unset;\n"
      - id: expect-featured-after-unset
        type: expect.preview
        at: { mark: after-unset-margin }
        timeoutMs: 4000
        target: { by: testId, value: badge-laphet-yay }
        textContains: "အသစ်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: all-unset
    chapter: "All နဲ့ အစကနေ ပြန်စရအောင်"
    narration: >
      [[mark:type-plain]] အခု plain class ပါတဲ့ ကော်ဖီ ခလုတ်ကို ပြင်ကြည့်ရအောင်။ all ဆိုတဲ့ property က
      element ရဲ့ property အားလုံးကို keyword တစ်ခုတည်းနဲ့ တစ်ခါတည်း ပေးပါတယ်။ အားလုံးကို unset
      လုပ်ကြည့်ပါမယ်။ [[mark:after-plain]] ကော်ဖီ ခလုတ်ရဲ့ အညိုရောင် နောက်ခံ၊ padding နဲ့ ဝိုင်းဝိုင်း
      ပုံစံ အကုန် ပျောက်သွားပါပြီ။ display က inline ပြန်ဖြစ်သွားပြီး၊ အရောင်နဲ့ font ကို card ဆီကနေ
      ယူနေပါပြီ။ စာသား ရိုးရိုးလိုပဲ မြင်ရပါတယ်။ [[mark:type-restyle]] ဒီလို ဘာမှ မရှိတဲ့ အခြေအနေကနေ
      ကိုယ် လိုချင်တာကိုပဲ ပြန်ထည့်ပါမယ်။ padding နည်းနည်း၊ စာလုံးနဲ့ အရောင်တူတဲ့ border၊ ပြီးတော့
      ထောင့်ဝိုင်းတွေပါ။ ဒါဆို ရှိသမျှ style က ကိုယ် ရေးထားတာချည်း ဖြစ်ပါမယ်။ [[mark:after-restyle]] အခု
      browser ရဲ့ ခလုတ်ပုံစံ ဘာမှ မကျန်တော့တဲ့ အစိမ်းရောင် ဘောင်ခတ် ခလုတ် ဖြစ်သွားပါပြီ။
      [[mark:focus-note]] သတိထားစရာ တစ်ခုက၊ all ကို unset လုပ်ရင် keyboard သုံးသူတွေကို ဘယ် element ပေါ်
      ရောက်နေလဲ ပြတဲ့ focus ring လည်း ပျောက်သွားပါတယ်။ ဒါကြောင့် focus style ကို ပြန်ထည့်ပေးရပါမယ်။
      lesson 28 မှာ ကြည့်ပါမယ်။ all က ကိုယ်တိုင် နာမည်ပေးထားတဲ့ custom property တွေနဲ့ စာ ရေးတဲ့
      ဦးတည်ရာကိုတော့ မထိပါဘူး။
    sources:
      - title: "web.dev Learn CSS — Inheritance: the all property"
        url: "https://web.dev/learn/css/inheritance#explicitly-inherit-and-control-inheritance"
      - title: "MDN — all"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/all"
      - title: "MDN — :focus-visible"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/:focus-visible"
    actions:
      - id: type-plain
        type: editor.type
        at: { mark: type-plain }
        cadence: fast-explainer
        target: { file: styles.css, after: "  margin: unset;\n}\n", occurrence: 1 }
        text: "\n.plain {\n  all: unset;\n}\n"
      - id: expect-plain-after-unset
        type: expect.preview
        at: { mark: after-plain }
        timeoutMs: 4000
        target: { by: testId, value: plain-button }
        textContains: "မှာမယ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-restyle
        type: editor.type
        at: { mark: type-restyle }
        cadence: fast-explainer
        target: { file: styles.css, after: "  all: unset;\n", occurrence: 1 }
        text: "  padding: 0 12px;\n  border: 2px solid;\n  border-radius: 999px;\n"
      - id: expect-coffee-after-restyle
        type: expect.preview
        at: { mark: after-restyle }
        timeoutMs: 4000
        target: { by: testId, value: card-coffee }
        textContains: "မှာမယ်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: keywords-recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:open-keywords]] keyword ငါးခုကို တစ်နေရာတည်းမှာ ကြည့်ရအောင်။ [[mark:draw-four]] inherit က
      parent ရဲ့ တန်ဖိုးကို ယူပါတယ်။ initial က specification ထဲက initial value ကို ယူပါတယ်။ unset က
      inherit ဖြစ်တဲ့ property ဆိုရင် inherit လုပ်ပြီး၊ မဟုတ်ရင် initial value ကို သုံးပါတယ်။ revert
      ကတော့ browser ရဲ့ style ကို ပြန်ယူပါတယ်။ [[mark:draw-layer]] ငါးခုမြောက် revert-layer က lesson 5 က
      cascade layer တွေနဲ့ ဆိုင်ပါတယ်။ သူက လက်ရှိ layer ကိုပဲ ကျော်ပြီး ရှေ့က layer တွေ ပေးထားတဲ့
      တန်ဖိုးကို ယူပါတယ်၊ ဥပမာ ရှေ့ဆုံး layer ထဲက library ရဲ့ style မျိုးပါ။ အဲဒီ layer တွေမှာ ဒီ
      property မပါရင်တော့ revert လိုပဲ ဖြစ်ပါတယ်။ [[mark:draw-all]] all ကတော့ ဒီ keyword တွေထဲက တစ်ခုကို
      property အားလုံးပေါ် တစ်ခါတည်း သုံးပေးပါတယ်။ [[mark:quiz]] မပြီးခင် မေးခွန်း နှစ်ခု
      စစ်ကြည့်ရအောင်။ font size၊ အရောင်၊ စာ ညှိပုံ၊ line height နဲ့ animation ထဲက ဘယ်ဟာတွေ inherit
      ဖြစ်လဲ။ ခဏ စဉ်းစားကြည့်ပါ။ animation ကလွဲရင် အကုန် ဖြစ်ပါတယ်။ ဒုတိယ မေးခွန်းက၊ inherit
      ဖြစ်နိုင်ရင် inherit လုပ်ပြီး မဖြစ်ရင် initial value ကို သုံးတဲ့ keyword က ဘာလဲ။ unset ပါ။
      ပိုသိချင်ရင် MDN မှာ inheritance နဲ့ computed value ကို ရှာဖတ်ကြည့်ပါ။ [[mark:recap]] ဒါဆို
      ပြန်ချုပ်ရရင်၊ inheritance က စာနဲ့ ဆိုင်တဲ့ တန်ဖိုးတွေကို parent ကနေ child ဆီ အောက်ကိုပဲ
      ပို့ပေးပါတယ်။ element ကို ရွေးထားတဲ့ declaration က browser က လာတာ ဖြစ်နေရင်တောင် inherit ဖြစ်လာတဲ့
      တန်ဖိုးကို အမြဲ နိုင်ပါတယ်။ keyword ငါးခုကတော့ တန်ဖိုး ဘယ်က လာမလဲ ဆိုတာ ရွေးခွင့် ပေးပါတယ်။
      [[mark:next-lesson]] အခု menu card နဲ့ ဆိုင်တဲ့ rule တွေက ပြန့်နေပြီး၊ class နာမည် တူတူကို
      ထပ်ခါထပ်ခါ ရေးနေရပါတယ်။ နောက် lesson မှာတော့ rule ထဲမှာ rule တွေ ထည့်ရေးတဲ့ nesting ကို
      ကြည့်သွားပါမယ်။ ဒါမှ ဆက်စပ်တဲ့ style တွေ တစ်နေရာတည်းမှာ စုနေပြီး ထပ်ရေးရတာ နည်းမှာပါ။
    sources:
      - title: "web.dev Learn CSS — Inheritance: check your understanding"
        url: "https://web.dev/learn/css/inheritance"
      - title: "MDN — revert-layer"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/revert-layer"
      - title: "MDN — all"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/all"
      - title: "MDN — Computed value"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/computed_value"
      - title: "CSS Cascading and Inheritance Level 5 — CSS-wide keywords"
        url: "https://www.w3.org/TR/css-cascade-5/#defaulting-keywords"
    actions:
      - id: open-keywords
        type: whiteboard.apply
        at: { mark: open-keywords }
        open: true
        clear: true
        upsertIds: [d-title]
      - id: draw-four
        type: whiteboard.apply
        at: { mark: draw-four }
        upsertIds:
          [
            d-k-inherit,
            d-v-inherit,
            d-k-initial,
            d-v-initial,
            d-k-unset,
            d-v-unset,
            d-k-revert,
            d-v-revert,
          ]
        drawMs: 5200
      - id: draw-layer
        type: whiteboard.apply
        at: { mark: draw-layer }
        upsertIds: [d-k-layer, d-v-layer]
        drawMs: 1600
      - id: draw-all
        type: whiteboard.apply
        at: { mark: draw-all }
        upsertIds: [d-k-all, d-v-all]
        drawMs: 1400
      - id: expect-final-css
        type: expect.file
        at: { mark: recap }
        path: styles.css
        contains: "body {\n  color: saddlebrown;\n  font-size: 18px;\n  font-family: \"Noto Sans Myanmar\", \"Myanmar Sangam MN\", \"Myanmar MN\",\n    \"Myanmar Text\", \"Padauk\", system-ui, sans-serif;\n}\n\n.menu {\n  border: 2px solid tan;\n  padding: 8px;\n  color: green;\n}\n\n.menu-card {\n  border: inherit;\n}\n\np {\n  color: dimgray;\n}\n\nbutton {\n  font: inherit;\n}\n\na {\n  color: inherit;\n}\n"
      - id: expect-keyword-css
        type: expect.file
        at: { afterAction: expect-final-css }
        path: styles.css
        contains: ".menu-card .desc {\n  display: initial;\n}\n\n.featured .desc {\n  display: revert;\n  color: unset;\n  margin: unset;\n}\n\n.plain {\n  all: unset;\n  padding: 0 12px;\n  border: 2px solid;\n  border-radius: 999px;\n}\n"

checks:
  - { type: timing.p95Ms, max: 300 }
