# CSS course (Burmese), lesson 7 of 43: inheritance.
#
# Narration is Burmese, applied from voice-script.md next to this file
# (DESIGN.md is the span-by-span brief). Every [[mark:…]] sits where its
# action begins, at a sentence end; each span carries one piece of meaning
# tied to what is on screen. Everything the learner sees (title, chapters,
# whiteboard labels, the tea-shop UI) is Burmese too.
#
# Shape: board (recall lessons 5-6, the page as a tree, values flow down only,
# the html root) while the dev server installs → code tour (cards with an
# order button and a details link, the coffee button's extra "plain" class,
# empty styles.css) → body colour, size and font typed live: almost
# everything follows, but the buttons keep the system font and the links stay
# blue → the menu lists get a border the cards don't → board (text
# properties inherit, box properties don't; how to check) → the cards
# inherit the border on request → board (how the browser finds a value:
# declaration → cascade, else inherit or initial; why buttons and links
# didn't follow) → a green list colour loses to a plain paragraph rule (direct
# beats inherited) → font: inherit and color: inherit fix the hook → display:
# initial makes the descriptions inline → revert brings today's special's
# description back to block → unset brings its colour back (inherit) and
# removes its margins (initial) → all: unset strips the coffee button, three
# lines restyle it → board (the five keywords, revert-layer, all) → recap,
# hand-off to nesting (lesson 8).
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set(; no postcss config. Every typed
# state is plain CSS that hot-swaps with no reload; index.html is never
# edited. Values typed keystroke by keystroke are keywords with no misleading
# prefix (saddlebrown, tan, green, dimgray, inherit, initial, revert, unset).
# No interaction: no preview.click, no hover or focus claims.
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
