scenes:
  - id: open
    chapter: "Code coverage ဆိုတာ"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ code ကို run စရာ မလိုဘဲ ဖတ်ပြီး စစ်တဲ့ static analysis ကို
      ကြည့်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ test တွေ run တဲ့အခါ code ရဲ့ ဘယ်အပိုင်းတွေ တကယ် run သွားလဲ
      ဆိုတာကို တိုင်းပေးတဲ့ code coverage ကို ကြည့်ပါမယ်။ [[mark:draw-def]] code coverage ဆိုတာ test တွေ
      run နေတုန်း code ရဲ့ ဘယ်နေရာတွေကို ဖြတ်သွားလဲ မှတ်ထားပြီး၊ ရာခိုင်နှုန်းနဲ့ ပြပေးတဲ့ တိုင်းတာချက်ပါ။
      Vitest ရဲ့ coverage ဇယားမှာ အဲဒါကို နည်း လေးမျိုးနဲ့ ပြပါတယ်။ [[mark:draw-stmts]] ပထမက statement ပါ။ လျှော့ဈေး ကုဒ်
      မှန်ရင် လျှော့ပြီးသား ဈေးနှုန်းကို ပြန်ပေးတာလို အလုပ် တစ်ခုချင်းစီ run ခဲ့လား ဆိုတာကို ရေတွက်ပါတယ်။
      [[mark:draw-branch]] ဒုတိယက branch ပါ။ ဝန်ထမ်း ဟုတ်လား ဆိုတဲ့ if မှာ ဟုတ်တဲ့ လမ်းနဲ့ မဟုတ်တဲ့ လမ်း
      နှစ်ဖက် ရှိပြီး၊ test တွေက လမ်း နှစ်ဖက်စလုံးကို ဖြတ်ခဲ့လား ကြည့်ပါတယ်။ [[mark:draw-funcs]] တတိယက
      function ပါ။ ဈေးနှုန်း တွက်တဲ့ function လို function တစ်ခုချင်းစီကို test တစ်ခုခုက ခေါ်ခဲ့လား
      ဆိုတာပါ။ [[mark:draw-lines]] နောက်ဆုံးက line ပါ။ code line တစ်ကြောင်းချင်းစီ run ခဲ့လား ဆိုတာ ဖြစ်ပြီး၊
      run မသွားတဲ့ line နံပါတ်တွေကို Uncovered ဆိုတဲ့ column မှာ ပြပါတယ်။
    sources:
      - {
          title: "web.dev Learn Testing: Test types, code coverage",
          url: "https://web.dev/learn/testing/get-started/test-types#code-coverage",
        }
      - { title: "Vitest: Coverage", url: "https://vitest.dev/guide/coverage" }
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 300000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-def
        type: whiteboard.apply
        at: { mark: draw-def }
        upsertIds: [a-def]
