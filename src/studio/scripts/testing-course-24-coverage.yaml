  - id: setup
    narration: >
      project မှာ coverage ကို ဘယ်လို ဖွင့်ထားလဲ ကြည့်ရအောင်။ ဒါက Vitest ရဲ့ config ဖိုင်ပါ။
      [[mark:select-enabled]] coverage option မှာ enabled ကို ဖွင့်ထားလို့၊ test run တိုင်း coverage ကိုပါ
      တိုင်းပါတယ်။ ကိုယ့် ကွန်ပျူတာရဲ့ terminal မှာ ဆိုရင် vitest run ကို coverage ဆိုတဲ့ option နဲ့ run လို့လည်း
      ရပါတယ်။ [[mark:select-provider]] provider ကတော့ ဘယ် tool နဲ့ တိုင်းမလဲ ဆိုတာပါ။ Vitest ရဲ့ default
      ဖြစ်တဲ့ V ၈ provider က JavaScript engine ကိုယ်တိုင် မှတ်ထားတဲ့ အချက်တွေကို ယူသုံးလို့၊ V ၈ engine ပါတဲ့
      Node နဲ့ Chrome လို နေရာမှာပဲ အလုပ်လုပ်ပါတယ်။ [[mark:about-istanbul]] ဒီ project က သုံးထားတဲ့ istanbul ကတော့
      code ကို မ run ခင် ရေတွက်တဲ့ code လေးတွေ ကြိုထည့်ပြီးမှ run လို့၊ JavaScript run တဲ့ ဘယ်နေရာမှာမဆို
      အလုပ်လုပ်ပါတယ်။ [[mark:open-package]] provider တစ်ခုချင်းစီက သူ့ package နဲ့သူ ဖြစ်လို့၊
      [[mark:select-package]] package json ထဲမှာ istanbul အတွက် coverage package ကို ထည့်ထားပါတယ်။
    sources:
      - {
          title: "Vitest: Coverage, providers and setup (facts A22)",
          url: "https://vitest.dev/guide/coverage#coverage-providers",
        }
      - {
          title: "Vitest: coverage.enabled and coverage.provider",
          url: "https://vitest.dev/config/coverage#coverage-provider",
        }
    actions:
      - id: close-board-a
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: select-enabled
        type: editor.select
        at: { mark: select-enabled }
        target: { file: vitest.config.js, text: "enabled: true", occurrence: 1 }
      - id: select-provider
        type: editor.select
        at: { mark: select-provider }
        target: { file: vitest.config.js, text: 'provider: "istanbul"', occurrence: 1 }
      - id: open-package
        type: workspace.openFile
        at: { mark: open-package }
        path: package.json
      - id: select-package
        type: editor.select
        at: { mark: select-package }
        target: { file: package.json, text: '"@vitest/coverage-istanbul": "5.1.0"', occurrence: 1 }

  - id: code
    narration: >
      [[mark:open-price]] ဒါက လျှော့ဈေးတွေ ထည့်တွက်ပြီး customer ပေးရမယ့် ဈေးနှုန်းကို တွက်တဲ့ code ပါ။ [[mark:select-code-branch]]
      ပထမ if က လျှော့ဈေး ကုဒ် မှန်ရင် ၁၀ ရာခိုင်နှုန်း လျှော့ပေးပါတယ်။ [[mark:select-happy-branch]] ဒုတိယ if
      က happy hour ဖြစ်တဲ့ နေ့လယ် ၂ နာရီကနေ ညနေ ၄ နာရီ မထိုးခင်အထိ ၂၀ ရာခိုင်နှုန်း လျှော့ပေးပါတယ်။
      [[mark:select-staff-branch]] တတိယ if ကတော့ ဝန်ထမ်း ဆိုရင် ၁၅ ရာခိုင်နှုန်း လျှော့ပေးဖို့ ရေးထားတဲ့
      အပိုင်းပါ။ ဘယ် လျှော့ဈေးမှ မရရင်တော့ နောက်ဆုံး line က ဈေးနှုန်း အပြည့်ကို ပြန်ပေးပါတယ်။
      [[mark:open-price-test]] test ဖိုင်ကို ကြည့်ရအောင်။ [[mark:select-dates]] test တွေအတွက် မနက် ၉ နာရီနဲ့
      နေ့လယ် ၂ နာရီ ဆိုတဲ့ အချိန် နှစ်ခုကို ကြိုသတ်မှတ်ထားပါတယ်။ [[mark:select-test-code]] ပထမ test က ကုဒ်နဲ့
      ၃၃၀၀ ကျပ်ဆိုရင် ၂၉၇၀ ကျပ် ဖြစ်ရမယ်လို့ စစ်ပါတယ်။ [[mark:select-test-happy]] ဒုတိယ test က happy
      hour မှာ ၁၅၀၀ ကျပ်ဆိုရင် ၁၂၀၀ ကျပ် ဖြစ်ရမယ်လို့ စစ်ထားပါတယ်။ test နှစ်ခုလုံး ဒီ function ကို ခေါ်ထားပေမဲ့၊ code ရဲ့ ဘယ်နေရာတွေကို
      တကယ် run ခဲ့လဲ ဆိုတာကိုတော့ coverage ဇယားက ပြပါလိမ့်မယ်။
    sources:
      - {
          title: "web.dev Learn Testing: Test types, code coverage",
          url: "https://web.dev/learn/testing/get-started/test-types#code-coverage",
        }
      - { title: "Vitest: Writing Tests", url: "https://vitest.dev/guide/learn/writing-tests" }
    actions:
      - id: open-price
        type: workspace.openFile
        at: { mark: open-price }
        path: src/price.js
      - id: select-code-branch
        type: editor.select
        at: { mark: select-code-branch }
        target:
          {
            file: src/price.js,
            text: "  if (code === \"TEA10\") {\n    return total * 0.9;\n  }",
            occurrence: 1,
          }
      - id: select-happy-branch
        type: editor.select
        at: { mark: select-happy-branch }
        target:
          {
            file: src/price.js,
            text: "  if (HAPPY_HOURS.includes(date.getHours())) {\n    return total * 0.8;\n  }",
            occurrence: 1,
          }
      - id: select-staff-branch
        type: editor.select
        at: { mark: select-staff-branch }
        target:
          {
            file: src/price.js,
            text: "  if (staff) {\n    return total * 0.15;\n  }",
            occurrence: 1,
          }
      - id: open-price-test
        type: workspace.openFile
        at: { mark: open-price-test }
        path: src/price.test.js
      - id: select-dates
        type: editor.select
        at: { mark: select-dates }
        target:
          {
            file: src/price.test.js,
            text: "const morning = new Date(2026, 10, 5, 9, 0);\nconst afternoon = new Date(2026, 10, 5, 14, 0);",
            occurrence: 1,
          }
      - id: select-test-code
        type: editor.select
        at: { mark: select-test-code }
        target:
          {
            file: src/price.test.js,
            text: "const price = finalPrice(3300, { code: \"TEA10\", date: morning });\n  expect(price).toBe(2970);",
            occurrence: 1,
          }
      - id: select-test-happy
        type: editor.select
        at: { mark: select-test-happy }
        target:
          {
            file: src/price.test.js,
            text: "const price = finalPrice(1500, { date: afternoon });\n  expect(price).toBe(1200);",
            occurrence: 1,
          }

  - id: panel
    narration: >
      [[mark:ready]] Vitest က ဒီ test တွေကို coverage နဲ့ run လိုက်တော့ ဘာ ပြလဲ ကြည့်ရအောင်။ panel ကလည်း
      ပြီးခဲ့တဲ့ lesson တွေလိုပဲ တကယ့် Vitest ရဲ့ ရလဒ် ဖြစ်ပြီး၊ အပေါ်ဆုံးမှာ အစိမ်းရောင် PASS ပေါ်နေပါတယ်။
      [[mark:read-table]] ဒီတစ်ခါ သူ့အောက်မှာ coverage ဇယား ပါလာပါတယ်။ All files ဆိုတဲ့ အတန်းက
      ဖိုင်အားလုံးကို ပေါင်းထားတာ ဖြစ်ပြီး၊ သူ့အောက်က အတန်းက ဈေးနှုန်း ဖိုင်ပါ။ test က import လုပ်ထားတဲ့ ဖိုင်ကိုပဲ ဇယားမှာ
      ပြတာ ဖြစ်လို့၊ မ import လုပ်တဲ့ ဖိုင်တွေကိုပါ ပြချင်ရင် coverage include ဆိုတဲ့ option နဲ့ ထည့်ပေးရပါတယ်။
      [[mark:read-numbers]] statement ရှစ်ခုထဲက ငါးခုပဲ run ခဲ့လို့ ၆၂ ဒသမ ၅ ရာခိုင်နှုန်း ဖြစ်နေပြီး၊ if လမ်း
      ခြောက်လမ်းထဲက သုံးလမ်းပဲ ဖြတ်ခဲ့လို့ branch က ၅၀ ရာခိုင်နှုန်း ဖြစ်နေပါတယ်။ function ကတော့ တစ်ခုတည်း
      ရှိပြီး test တွေက ခေါ်ခဲ့လို့ ၁၀၀ ရာခိုင်နှုန်း ပါ။ function က ပြည့်နေပေမဲ့ သူ့ထဲက line တချို့ မ run ခဲ့လို့၊
      တိုင်းတာချက် တစ်ခုတည်းကို ကြည့်ရုံနဲ့ မလုံလောက်ပါဘူး။ [[mark:read-uncovered]] အဆုံးက Uncovered
      column မှာ line ၁၀ နဲ့ ၁၁၊ ပြီးတော့ line ၁၃ ကို ပြထားပါတယ်။ ဝန်ထမ်း လျှော့ဈေး အပိုင်းနဲ့ ဈေးနှုန်း အပြည့်
      ပြန်ပေးတဲ့ line ပါ။ test နှစ်ခုလုံး ပထမ ဒါမှမဟုတ် ဒုတိယ if မှာ ပြန်ထွက်သွားလို့ ဒီ line တွေကို ဘယ် test
      မှ မရောက်ခဲ့တာပါ။
    sources:
      - {
          title: "Vitest: Coverage, including and excluding files (facts A22)",
          url: "https://vitest.dev/guide/coverage#including-and-excluding-files-from-coverage-report",
        }
      - {
          title: "Vitest: coverage.include",
          url: "https://vitest.dev/config/coverage#coverage-include",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-start-pass
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1000 }
      - id: expect-start-two
        type: expect.preview
        at: { afterAction: expect-start-pass }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "2" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-uncovered
        type: expect.preview
        at: { afterAction: expect-start-two }
        timeoutMs: 5000
        target: { by: testId, value: vt-cov-1 }
        attribute: { name: data-uncovered, value: "10-11,13" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-lines
        type: expect.preview
        at: { afterAction: expect-start-uncovered }
        timeoutMs: 5000
        target: { by: testId, value: vt-cov-all }
        attribute: { name: data-lines, value: "62.5" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-statements
        type: expect.preview
        at: { afterAction: expect-start-lines }
        timeoutMs: 5000
        target: { by: testId, value: vt-cov-all }
        attribute: { name: data-statements, value: "62.5" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-branches
        type: expect.preview
        at: { afterAction: expect-start-statements }
        timeoutMs: 5000
        target: { by: testId, value: vt-cov-all }
        attribute: { name: data-branches, value: "50" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-functions
        type: expect.preview
        at: { afterAction: expect-start-branches }
        timeoutMs: 5000
        target: { by: testId, value: vt-cov-all }
        attribute: { name: data-functions, value: "100" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-one-file
        type: expect.preview
        at: { afterAction: expect-start-functions }
        timeoutMs: 5000
        target: { by: testId, value: vt-coverage }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: find
    chapter: "Test မရှိတဲ့ နေရာကို ရှာရအောင်"
    narration: >
      coverage ရဲ့ အသုံးအဝင်ဆုံး နေရာက ဒါပါ။ ဘယ် test မှ မရောက်သေးတဲ့ code ကို ပြပေးတာပါ။ ဝန်ထမ်း
      လျှော့ဈေးအတွက် test တစ်ခု ထည့်ကြည့်ရအောင်။ [[mark:type-staff]] ဝန်ထမ်း တစ်ယောက်က ၂၀၀၀ ကျပ်ဖိုး
      ဝယ်ရင် ၁၅ ရာခိုင်နှုန်း လျှော့ပြီး ၁၇၀၀ ကျပ် ပေးရမယ်လို့ စစ်တဲ့ test ပါ။ ဒီ အဖြေကို code ကနေ ကူးထားတာ
      မဟုတ်ဘဲ၊ ဆိုင်ရဲ့ စည်းကမ်းကနေ ကိုယ်တိုင် တွက်ထားတာပါ။ [[mark:read-staff-fail]] panel မှာ test ကျသွားပါပြီ။
      ၁၇၀၀ ဖြစ်ရမယ့် နေရာမှာ ၃၀၀ ရနေတယ်လို့ ပြောနေပြီး၊ အစိမ်းရောင် Expected မှာ ၁၇၀၀၊ အနီရောင် Received
      မှာ ၃၀၀ ကို ပြထားပါတယ်။ [[mark:open-price-fix]] ဈေးနှုန်း ဖိုင်ကို ပြန်ဖွင့်ကြည့်ရအောင်။
      [[mark:select-staff-bug]] ၃၀၀ ဆိုတာ ၂၀၀၀ ရဲ့ ၁၅ ရာခိုင်နှုန်း၊ လျှော့ပေးရမယ့် ငွေပဲ ဖြစ်ပါတယ်။ ဒီ line က
      ဈေးနှုန်းကနေ နှုတ်ပေးရမယ့်အစား လျှော့ငွေကိုပဲ ပြန်ပေးနေတာပါ။ bug က အစကတည်းက ရှိနေပေမဲ့၊ ဒီ line ကို
      ဘယ် test မှ run မခဲ့လို့ မသိခဲ့ရတာပါ။ [[mark:read-covered-fail]] coverage ဇယားကိုလည်း ကြည့်ပါ။ test
      ကျနေပေမဲ့ Uncovered မှာ line ၁၃ တစ်ကြောင်းပဲ ကျန်ပြီး၊ line coverage က ၈၇ ဒသမ ၅ ရာခိုင်နှုန်း
      ဖြစ်သွားပါပြီ။ coverage က test pass ဖြစ်လား မကြည့်ဘဲ၊ run ခဲ့လား ဆိုတာကိုပဲ ရေတွက်လို့ပါ။
      [[mark:type-fix]] ဒါဆို ၁၅ ရာခိုင်နှုန်းကို ဈေးနှုန်းကနေ နှုတ်ပေးအောင် ပြင်လိုက်ပါမယ်။ [[mark:read-fixed]]
      ဈေးနှုန်း အပြည့်ထဲကနေ လျှော့ငွေကို နှုတ်လိုက်တော့၊ test သုံးခုလုံး pass ဖြစ်ပြီး အပေါ်ဆုံးက PASS
      ပြန်ဖြစ်သွားပါပြီ။
    sources:
      - {
          title: "web.dev Learn Testing: Test types, code coverage (what is missing, what to test next)",
          url: "https://web.dev/learn/testing/get-started/test-types#code-coverage",
        }
      - { title: "Vitest: Coverage", url: "https://vitest.dev/guide/coverage" }
    actions:
      - id: type-staff
        type: editor.type
        at: { mark: type-staff }
        target:
          { file: src/price.test.js, after: "  expect(price).toBe(1200);\n});\n", occurrence: 1 }
        text: "\ntest(\"gives staff 15 % off\", () => {\n  const price = finalPrice(2000, { staff: true, date: morning });\n  expect(price).toBe(1700);\n});\n"
        # One block: a new test block typed line by line would land parseable in-between states
        # (the Enter-first newline, the blank line) and could start a run on a half-typed line.
        cadence: block
      - id: expect-staff-fail
        type: expect.preview
        at: { afterAction: type-staff }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 3, delayMs: 2000 }
      - id: expect-staff-message
        type: expect.preview
        at: { afterAction: expect-staff-fail }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-message, value: "expected 300 to be 1700 // Object.is equality" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-staff-received
        type: expect.preview
        at: { afterAction: expect-staff-message }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-actual, value: "300" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-staff-covered
        type: expect.preview
        at: { afterAction: expect-staff-received }
        timeoutMs: 5000
        target: { by: testId, value: vt-cov-1 }
        attribute: { name: data-uncovered, value: "13" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-staff-lines
        type: expect.preview
        at: { afterAction: expect-staff-covered }
        timeoutMs: 5000
        target: { by: testId, value: vt-cov-all }
        attribute: { name: data-lines, value: "87.5" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: open-price-fix
        type: workspace.openFile
        at: { mark: open-price-fix }
        path: src/price.js
      - id: select-staff-bug
        type: editor.select
        at: { mark: select-staff-bug }
        target: { file: src/price.js, text: "return total * 0.15;", occurrence: 1 }
      - id: type-fix
        type: editor.type
        at: { mark: type-fix }
        target: { file: src/price.js, after: "  if (staff) {\n    return ", occurrence: 1 }
        text: "total - "
      - id: expect-fixed-pass
        type: expect.preview
        at: { afterAction: type-fix }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 2000 }
      - id: expect-fixed-three
        type: expect.preview
        at: { afterAction: expect-fixed-pass }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "3" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-price-file
        type: expect.file
        at: { afterAction: expect-fixed-three }
        path: src/price.js
        contains: "  if (staff) {\n    return total - total * 0.15;\n  }"

  - id: thresholds
    chapter: "Threshold ဆိုတာ"
    narration: >
      [[mark:board-thresholds]] team တွေမှာ coverage ကို အနည်းဆုံး ဘယ်လောက် ရှိရမယ်လို့ သတ်မှတ်ထားတာမျိုး
      ရှိပါတယ်။ [[mark:draw-config]] config ထဲက coverage option မှာ thresholds ကို ထည့်ပြီး၊ ဥပမာ line
      coverage အနည်းဆုံး ၈၀ ရာခိုင်နှုန်း ရှိရမယ်လို့ ရေးလို့ ရပါတယ်။ [[mark:draw-error]] lesson အစက code ကို ဒီ
      setting နဲ့ ကိုယ့် ကွန်ပျူတာရဲ့ terminal မှာ run ရင်၊ test နှစ်ခုလုံး pass ဖြစ်ပေမဲ့ line coverage ၆၂ ဒသမ ၅
      ရာခိုင်နှုန်းက ၈၀ ကို မမီဘူးလို့ error ပြပါတယ်။ [[mark:draw-exit]] ဒါကြောင့် run တစ်ခုလုံး fail ဖြစ်ပြီး၊ CI
      မှာ ဆိုရင်လည်း အဲဒီ run က အနီရောင် ဖြစ်သွားမှာပါ။ [[mark:draw-goal]] ဒါပေမဲ့ ၁၀၀ ရာခိုင်နှုန်းကိုတော့
      ပန်းတိုင် မထားသင့်ပါဘူး။ ခဏနေရင် မြင်ရမှာက၊ ဘာမှ မစစ်တဲ့ test တစ်ခုနဲ့တောင် ဇယားကို ၁၀၀ ပြည့်အောင်
      လုပ်လို့ ရပါတယ်။ ဂဏန်း ပြည့်ဖို့ပဲ လိုက်လုပ်ရင် အဲဒီလို test တွေ များလာပြီး၊ ကုန်တဲ့ အချိန်နဲ့ ရတဲ့
      အကျိုးလည်း မမျှတော့ပါဘူး။ ဒါကြောင့် coverage ကို ဘယ်နေရာမှာ test လိုသေးလဲ ရှာဖို့ လမ်းပြ အနေနဲ့ပဲ
      သုံးပါ။
    sources:
      - {
          title: "Vitest: coverage.thresholds",
          url: "https://vitest.dev/config/coverage#coverage-thresholds",
        }
      - {
          title: "web.dev Learn Testing: Test types, code coverage (do not aim for 100 %, facts C19)",
          url: "https://web.dev/learn/testing/get-started/test-types#code-coverage",
        }
      - {
          title: "Kent C. Dodds: Write tests. Not too many. Mostly integration. (facts C12)",
          url: "https://kentcdodds.com/blog/write-tests",
        }
      - {
          title: "Vitest: coverage.thresholds.lines",
          url: "https://vitest.dev/config/coverage#coverage-thresholds-lines",
        }
    actions:
      - id: board-thresholds
        type: whiteboard.apply
        at: { mark: board-thresholds }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-config
        type: whiteboard.apply
        at: { mark: draw-config }
        upsertIds: [c-box, c-code-1, c-code-2, c-code-3, c-code-4, c-code-5]
        drawMs: 3500
      - id: draw-error
        type: whiteboard.apply
        at: { mark: draw-error }
        upsertIds: [c-term, c-pass, c-err-1, c-err-2]
        drawMs: 4000
      - id: draw-exit
        type: whiteboard.apply
        at: { mark: draw-exit }
        upsertIds: [c-exit, c-ci]
        drawMs: 1500
      - id: draw-goal
        type: whiteboard.apply
        at: { mark: draw-goal }
        upsertIds: [c-goal-1, c-goal-2]
        drawMs: 1500

  - id: no-assert
    chapter: "Run ခဲ့တာနဲ့ စစ်ခဲ့တာ"
    narration: >
      ဇယားမှာ line ၁၃ တစ်ကြောင်းပဲ ကျန်ပါတော့တယ်။ [[mark:open-test-3]] အဲဒီ line ကို ရောက်အောင် test ဖိုင်မှာ
      test တစ်ခု ထပ်ထည့်ကြည့်ရအောင်။ [[mark:type-noassert]] coverage ပြည့်ဖို့ပဲ ရည်ရွယ်ပြီး ရေးတဲ့ test တွေမှာ
      ဖြစ်တတ်သလို၊ ဘယ် လျှော့ဈေးမှ မရတဲ့ မနက်ပိုင်း အော်ဒါ အတွက် function ကို ခေါ်ပြီး ဈေးနှုန်းကို
      သိမ်းထားရုံပါ။ ဈေးနှုန်း မှန်လား ဆိုတာကိုတော့ ဘာမှ မစစ်ထားပါဘူး။ [[mark:read-100]] coverage ဇယားကို ကြည့်ပါ။ statement ရော branch ရော function ရော line ရော လေးမျိုးလုံး
      ၁၀၀ ရာခိုင်နှုန်း ဖြစ်သွားပြီး၊ Uncovered မှာလည်း ဘာမှ မကျန်တော့ပါဘူး။ test လေးခုလုံးလည်း pass ပါ။
      [[mark:read-nothing]] ဒါပေမဲ့ ဒီ test အသစ်က ဘာကိုမှ မစစ်ပါဘူး။ နောက်ဆုံး line က ဈေးနှုန်း မှားပြီး
      ပြန်ပေးနေရင်တောင် ဒီ test က pass ဖြစ်နေမှာပါ။ coverage က run ခဲ့တာကိုပဲ ရေတွက်ပြီး၊ စစ်ခဲ့လား ဆိုတာကို
      မပြနိုင်တာ ဒါပါပဲ။ [[mark:type-assert]] ဒါကြောင့် ရလာတဲ့ ဈေးနှုန်းဟာ ၁၅၀၀ ကျပ် အပြည့် ဖြစ်ရမယ်လို့
      စစ်တဲ့ line ကို ထည့်ပါမယ်။ [[mark:read-assert]] panel မှာ ပြောင်းသွားတာ မရှိသလိုပါပဲ။ test လေးခုလုံး pass
      ဖြစ်ပြီး coverage လည်း ၁၀၀ ရာခိုင်နှုန်း အတိုင်းပါ။ ဒါပေမဲ့ အခုမှ ဒီ test က တကယ် အဓိပ္ပာယ် ရှိလာတာပါ။
      test ကောင်းမကောင်း ဘယ်လို စစ်မလဲ ဆိုတာကိုတော့ နောက်ပိုင်း lesson တစ်ခုမှာ ပြန်ကြည့်ပါမယ်။
    sources:
      - {
          title: "Vitest: expect.hasAssertions (a test with no assertion still passes; facts A33)",
          url: "https://vitest.dev/api/expect#expect-hasassertions",
        }
      - {
          title: "web.dev Learn Testing: Test types, code coverage",
          url: "https://web.dev/learn/testing/get-started/test-types#code-coverage",
        }
    actions:
      - id: close-board-c
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-test-3
        type: workspace.openFile
        at: { mark: open-test-3 }
        path: src/price.test.js
      - id: type-noassert
        type: editor.type
        at: { mark: type-noassert }
        target:
          { file: src/price.test.js, after: "  expect(price).toBe(1700);\n});\n", occurrence: 1 }
        text: "\ntest(\"charges the full price\", () => {\n  const price = finalPrice(1500, { date: morning });\n});\n"
        cadence: block
      - id: expect-noassert-four
        type: expect.preview
        at: { afterAction: type-noassert }
        timeoutMs: 8000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "4" }
        retry: { maxAttempts: 3, delayMs: 2000 }
      - id: expect-noassert-lines
        type: expect.preview
        at: { afterAction: expect-noassert-four }
        timeoutMs: 5000
        target: { by: testId, value: vt-cov-all }
        attribute: { name: data-lines, value: "100" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-noassert-branches
        type: expect.preview
        at: { afterAction: expect-noassert-lines }
        timeoutMs: 5000
        target: { by: testId, value: vt-cov-all }
        attribute: { name: data-branches, value: "100" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-noassert-statements
        type: expect.preview
        at: { afterAction: expect-noassert-branches }
        timeoutMs: 5000
        target: { by: testId, value: vt-cov-all }
        attribute: { name: data-statements, value: "100" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-noassert-functions
        type: expect.preview
        at: { afterAction: expect-noassert-statements }
        timeoutMs: 5000
        target: { by: testId, value: vt-cov-all }
        attribute: { name: data-functions, value: "100" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-noassert-uncovered
        type: expect.preview
        at: { afterAction: expect-noassert-functions }
        timeoutMs: 5000
        target: { by: testId, value: vt-cov-1 }
        attribute: { name: data-uncovered, value: "" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: type-assert
        type: editor.type
        at: { mark: type-assert }
        target:
          {
            file: src/price.test.js,
            after: "  const price = finalPrice(1500, { date: morning });\n",
            occurrence: 1,
          }
        text: "  expect(price).toBe(1500);\n"
      - id: expect-assert-pass
        type: expect.preview
        at: { afterAction: type-assert }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 2000 }
      - id: expect-assert-four
        type: expect.preview
        at: { afterAction: expect-assert-pass }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "4" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-assert-lines
        type: expect.preview
        at: { afterAction: expect-assert-four }
        timeoutMs: 5000
        target: { by: testId, value: vt-cov-all }
        attribute: { name: data-lines, value: "100" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-test-file
        type: expect.file
        at: { afterAction: expect-assert-lines }
        path: src/price.test.js
        contains: "test(\"charges the full price\", () => {\n  const price = finalPrice(1500, { date: morning });\n  expect(price).toBe(1500);\n});"

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ code coverage က test တွေ run တဲ့အခါ statement ရော branch ရော function ရော line
      ရော ဘယ်လောက် run သွားလဲ ဆိုတာကို တိုင်းပေးပြီး၊ ဘယ် test မှ မရောက်သေးတဲ့ code ကို ရှာဖို့ အသုံးဝင်ပါတယ်။
      ဒီ lesson မှာလည်း Uncovered က ပြတဲ့ line တွေအတွက် test ထည့်လိုက်တော့ bug တစ်ခုကို တွေ့ခဲ့ပါတယ်။
      [[mark:recap-limits]] ဒါပေမဲ့ coverage က run ခဲ့တာကိုပဲ ပြပြီး၊ test က တကယ် စစ်ခဲ့လား ဆိုတာကို မပြပါဘူး။
      threshold က run တစ်ခုလုံးကို fail ဖြစ်စေနိုင်ပေမဲ့၊ ၁၀၀ ရာခိုင်နှုန်းကို ပန်းတိုင် မထားဘဲ ဘာ test လိုသေးလဲ
      ရှာဖို့ပဲ သုံးပါ။ နောက် lesson မှာတော့ pass ဖြစ်နေပေမဲ့ code ကို တကယ် မစစ်တဲ့ test တွေလို ထောင်ချောက်တွေနဲ့၊
      တစ်ခါ pass တစ်ခါ fail ဖြစ်တတ်တဲ့ flaky test တွေကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "web.dev Learn Testing: Test types, code coverage",
          url: "https://web.dev/learn/testing/get-started/test-types#code-coverage",
        }
      - { title: "Vitest: Coverage", url: "https://vitest.dev/guide/coverage" }
    actions: []
checks:
  - { type: timing.p95Ms, max: 300 }
