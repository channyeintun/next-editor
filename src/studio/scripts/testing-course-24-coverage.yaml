  - id: ran-checked
    narration: >
      [[mark:draw-ran]] ဒီ တိုင်းတာချက် လေးမျိုးလုံးမှာ သတိထားရမယ့် အချက် တစ်ခု ရှိပါတယ်။ coverage က code
      line တစ်ကြောင်း run ခဲ့လား ဆိုတာကိုပဲ မှတ်တာ ဖြစ်ပြီး၊ အဲဒီ line ရဲ့ အဖြေ မှန်လား ဆိုတာကို test က
      တကယ် စစ်ခဲ့လား ဆိုတာကိုတော့ မသိပါဘူး။ run ခဲ့တာနဲ့ စစ်ခဲ့တာ မတူတာကို ဒီ lesson ရဲ့ နောက်ဆုံးမှာ panel
      ပေါ်မှာ တကယ် မြင်ရပါမယ်။
    sources:
      - { title: "Vitest: Coverage", url: "https://vitest.dev/guide/coverage" }
      - {
          title: "Vitest: expect.hasAssertions (a test with no assertion still passes; facts A33)",
