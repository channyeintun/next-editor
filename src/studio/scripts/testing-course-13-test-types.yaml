              seq,
              state: "fail",
              note: "Vitest did not start.",
              files: [],
              failures: [{ kind: "start", title: "Vitest could not start", test: "", name: "Error", message, expected: null, actual: null, diff: "", plugin: null, pluginFile: null, pluginFrame: null, codeFrame: null, frames: [], file: "", line: 0, col: 0, frame: null }],
              console: [],
              summary: emptySummary(),
              snapshot: null,
              coverage: null,
              app: await appState(),
