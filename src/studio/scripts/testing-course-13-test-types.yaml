build:
  # Studio replaces this built-in profile at render time with the Burmese provider chosen in the
  # render console (AthanLab with the user's own key, or VoxCPM2 when that feature is enabled).
  voiceProfile: pocket-alba-v1
  seed: 5113
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: open
    chapter: "Test တွေရဲ့ အရွယ်အစား"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ bug ကို fail ဖြစ်တဲ့ test နဲ့ အရင် ဖမ်းပြီးမှ ပြင်ခဲ့လို့၊ အဲဒီ test က
      regression test အဖြစ် ဆက်ကျန်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ test တွေကို သူ စစ်တဲ့ code ရဲ့ အရွယ်အစားနဲ့
      ဘယ်လို ခေါ်ကြလဲ၊ unit test တွေ အားလုံး အောင်နေရင်တောင် ဘာကြောင့် မလုံလောက်သေးလဲ ဆိုတာ ကြည့်ပါမယ်။
      [[mark:draw-unit]] အသေးဆုံးက unit test ပါ။ ဈေးနှုန်း တွက်တဲ့ function လို code အပိုင်း အသေးလေး
      တစ်ခုကို သူ့ချည်းသက်သက် ခေါ်ပြီး၊ ဒီ ဈေးနှုန်း ပေးရင် ဒီ အဖြေ ပြန်လား စစ်တာပါ။ network လို အပြင်က
      အရာတွေကို မထိလို့ ရေးရတာရော run ရတာပါ မြန်ပါတယ်။ [[mark:draw-component]] component test ကတော့
      နည်းနည်း ပိုကြီးတဲ့ code အစု တစ်ခုကို စစ်ပါတယ်။ ဥပမာ မီးဖိုချောင်ရဲ့ code ကို printer အစစ် မချိတ်ဘဲ
      စစ်တာမျိုးပါ။ [[mark:draw-integration]] integration test က အပိုင်း
      နှစ်ခု သုံးခုကို တွဲပြီး၊ ချိတ်လိုက်တဲ့အခါ မှန်မှန် အလုပ်လုပ်လား စစ်ပါတယ်။ ငွေရှင်းတဲ့ code က happy
      hour လျှော့ဈေးကို ယူသုံးတဲ့အခါ ငွေ မှန်လား ကြည့်တာမျိုးပါ။ [[mark:draw-e2e]] အကြီးဆုံးကတော့ end to
      end test ပါ။ ဆိုင်ရဲ့ website တစ်ခုလုံးကို browser အစစ်ထဲမှာ ဖွင့်ပြီး၊ customer လို အော်ဒါ
      မှာကြည့်တာပါ။ [[mark:draw-names]] ဒါပေမဲ့ ဒီ နာမည်တွေကို project အလိုက် အဓိပ္ပာယ်
      နည်းနည်းစီ ကွဲပြီး သုံးကြလို့၊ team ထဲမှာ ဘယ်လို ခေါ်မလဲ အရင် သဘောတူထားတာ ကောင်းပါတယ်။
    sources:
      - {
          title: "web.dev Learn Testing: What testing is, the scale of tests",
          url: "https://web.dev/learn/testing/get-started/what-testing-is#the_scale_of_tests",
        }
      - {
          title: "web.dev Learn Testing: Types of automated testing, common types",
          url: "https://web.dev/learn/testing/get-started/test-types#common-test-types",
        }
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 300000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-unit
        type: whiteboard.apply
        at: { mark: draw-unit }
        upsertIds: [a-unit-box, a-unit, a-unit-ex]
        drawMs: 2200
      - id: draw-component
        type: whiteboard.apply
        at: { mark: draw-component }
        upsertIds: [a-comp-box, a-comp, a-comp-ex]
        drawMs: 2200
      - id: draw-integration
        type: whiteboard.apply
        at: { mark: draw-integration }
        upsertIds: [a-int-box, a-int, a-int-ex]
        drawMs: 2200
      - id: draw-e2e
        type: whiteboard.apply
        at: { mark: draw-e2e }
        upsertIds: [a-e2e-box, a-e2e, a-e2e-ex]
        drawMs: 2200
      - id: draw-names
        type: whiteboard.apply
        at: { mark: draw-names }
        upsertIds: [a-names]
        drawMs: 1800

  - id: starter
    narration: >
      ဆိုင်ရဲ့ code ထဲမှာ ကြည့်ရအောင်။ ဒါက happy hour လျှော့ဈေး တွက်တဲ့ discount ဖိုင်ပါ။ နေ့လယ် ၂ နာရီကနေ
      ညနေ ၄ နာရီ မထိုးခင်အထိ သောက်စရာတွေကို ၂၀ ရာခိုင်နှုန်း လျှော့ပါတယ်။ [[mark:select-rate]] ဒီ function
      က လျှော့မယ့် ပမာဏကို အချိုးနဲ့ ပြန်ပေးတာ ဖြစ်လို့၊ ၂၀ ရာခိုင်နှုန်းဆိုရင် ၀ ဒသမ ၂ ကို ပြန်ပေးပါတယ်။
      [[mark:open-checkout]] ဒါကတော့ ငွေရှင်းတဲ့ checkout ဖိုင်ပါ။ [[mark:select-percent]] ဒီ function ကတော့
      ရာခိုင်နှုန်းကို ၁၀၀ နဲ့ စားပြီးမှ ဈေးနှုန်းထဲက လျှော့တာ ဖြစ်လို့၊ ၂၀ ရာခိုင်နှုန်း လျှော့ချင်ရင် ၂၀ ကို
      ပေးရပါမယ်။ [[mark:select-join]] အောက်က function က ဒီ နှစ်ခုကို ချိတ်ပြီး၊ happy hour ရဲ့ လျှော့ဈေးကို
      ဈေးနှုန်း တွက်တဲ့ function ဆီ ပို့ပေးပါတယ်။ [[mark:open-checkout-test]] checkout ရဲ့ test ဖိုင်ကို
      ဖွင့်ကြည့်ရအောင်။ [[mark:select-unit]] ဒီ test က ၁၅၀၀ ကျပ်ထဲက ၂၀ ရာခိုင်နှုန်း လျှော့ရင် ၁၂၀၀ ကျပ်
      ဖြစ်ရမယ်လို့ စစ်ပါတယ်။ ဈေးနှုန်း တွက်တဲ့ function တစ်ခုတည်းကိုပဲ ခေါ်ထားလို့ unit test ပါ။
      [[mark:select-import]] နှစ်ခုကို ချိတ်ပေးတဲ့ function ကိုတော့ import လုပ်ထားပေမဲ့၊ ဘယ် test ကမှ
      မစစ်ရသေးပါဘူး။
    sources:
      - {
          title: "web.dev Learn Testing: Types of automated testing, unit tests",
          url: "https://web.dev/learn/testing/get-started/test-types#unit",
        }
      - { title: "Vitest: Writing Tests", url: "https://vitest.dev/guide/learn/writing-tests" }
    actions:
      - id: close-scales
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: select-rate
        type: editor.select
        at: { mark: select-rate }
        target: { file: src/discount.js, text: "? 0.2 : 0", occurrence: 1 }
      - id: open-checkout
        type: workspace.openFile
        at: { mark: open-checkout }
        path: src/checkout.js
      - id: select-percent
        type: editor.select
        at: { mark: select-percent }
        target: { file: src/checkout.js, text: "percentOff / 100", occurrence: 1 }
      - id: select-join
        type: editor.select
        at: { mark: select-join }
        target:
          { file: src/checkout.js, text: "priceAfter(price, happyHourRate(date))", occurrence: 1 }
      - id: open-checkout-test
        type: workspace.openFile
        at: { mark: open-checkout-test }
        path: src/checkout.test.js
      - id: select-unit
        type: editor.select
        at: { mark: select-unit }
        target:
          {
            file: src/checkout.test.js,
            text: "expect(priceAfter(1500, 20)).toBe(1200);",
            occurrence: 1,
          }
      - id: select-import
        type: editor.select
        at: { mark: select-import }
        target: { file: src/checkout.test.js, text: "{ checkout, priceAfter }", occurrence: 1 }

  - id: panel
    narration: >
      [[mark:ready]] Vitest က ဘာ ပြလဲ ကြည့်ရအောင်။ ညာဘက်က panel ကလည်း အရင်လိုပဲ၊ code ပြောင်းတိုင်း Vitest
      က သူ့ဘာသာ ပြန် run ပြီး ပြပေးတဲ့ ရလဒ်ပါ။ [[mark:read-start]] test ဖိုင် နှစ်ဖိုင်ထဲက unit test လေးခုလုံး
      အမှန်ခြစ် ရနေပြီး၊ summary မှာလည်း Tests မှာ ၄ ခု pass လို့ ပြနေပါတယ်။ ဒါဆို happy hour မှာ
      လက်ဖက်ရည် မှာတဲ့ customer ဆီက ဆိုင်က ငွေ မှန်မှန် ယူမှာလား။
    sources:
      - { title: "Vitest: Getting Started", url: "https://vitest.dev/guide/" }
      - {
          title: "web.dev Learn Testing: What to test, unit tests on their own",
          url: "https://web.dev/learn/testing/get-started/what-to-test",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-start-pass
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1000 }
      - id: expect-start-four
        type: expect.preview
        at: { afterAction: expect-start-pass }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "4" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-files
        type: expect.preview
        at: { afterAction: expect-start-four }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-files-passed, value: "2" }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: integration
    chapter: "Integration test ရေးကြည့်ရအောင်"
    narration: >
      ဒါကို သိဖို့ အပိုင်း နှစ်ခုကို တွဲစစ်တဲ့ test တစ်ခု ရေးကြည့်ရအောင်။ [[mark:type-integration]] test
      ဖိုင်ရဲ့ အောက်ဆုံးမှာ test အသစ် တစ်ခု ထည့်ပါမယ်။ သူ့နာမည်က happy hour မှာ လက်ဖက်ရည် တစ်ခွက်ဟာ
      ၁၂၀၀ ကျပ် ကျရမယ် ဆိုတဲ့ အဓိပ္ပာယ်ပါ။ [[mark:select-time]] ဒီ line က ၂၀၂၆ ခုနှစ် နိုဝင်ဘာလ ၅ ရက်၊
      ညနေ ၃ နာရီကို ယူထားပါတယ်။ [[mark:select-expect]] အဲဒီ အချိန်မှာ ၁၅၀၀ ကျပ် လက်ဖက်ရည်ကို ငွေရှင်းပြီး၊
      ရလာတဲ့ ငွေက ၁၂၀၀ ဖြစ်ရမယ်လို့ စစ်ပါတယ်။ ငွေရှင်းတဲ့ function ကို ခေါ်လိုက်တာနဲ့ ဖိုင် နှစ်ဖိုင်လုံးက code တကယ်
      run သွားလို့ integration test ပါ။ [[mark:read-red]] panel ကို ကြည့်ပါ။ test အသစ်ရှေ့မှာ ကြက်ခြေခတ်
      ပေါ်ပြီး၊ အပေါ်က PASS ကလည်း အနီရောင် FAIL ဖြစ်သွားပါပြီ။ Failed Tests အပိုင်းမှာ ၁၂၀၀ ဖြစ်ရမယ့်
      နေရာမှာ ၁၄၉၇ ရနေတယ်လို့ ပြောနေပါတယ်။ [[mark:read-units]] ဒါပေမဲ့ unit test လေးခုကတော့ အမှန်ခြစ်အတိုင်း
      ရှိနေပါသေးတယ်။
    sources:
      - {
          title: "web.dev Learn Testing: Types of automated testing, integration tests",
          url: "https://web.dev/learn/testing/get-started/test-types#integration",
        }
      - { title: "Vitest: expect, toBe", url: "https://vitest.dev/api/expect#tobe" }
    actions:
      - id: open-checkout-test-2
        type: workspace.openFile
        at: { mark: type-integration }
        path: src/checkout.test.js
      - id: type-integration
        type: editor.type
        at: { afterAction: open-checkout-test-2 }
        target:
          {
            file: src/checkout.test.js,
            after: "  expect(priceAfter(1500, 0)).toBe(1500);\n});\n",
            occurrence: 1,
          }
        text: "\ntest(\"a tea at 15:00 costs 1200\", () => {\n  const at3pm = new Date(2026, 10, 5, 15, 0);\n  const price = checkout(1500, at3pm);\n  expect(price).toBe(1200);\n});\n"
        # One block (pilot note 1): line by line, the Enter-first newline and the blank line parse,
        # and the long test( line's pause can pass the bridge's 1 s quiet window.
        cadence: block
      - id: expect-red
        type: expect.preview
        at: { afterAction: type-integration }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-red-count
        type: expect.preview
        at: { afterAction: expect-red }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-failed, value: "1" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-red-message
        type: expect.preview
        at: { afterAction: expect-red-count }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-message, value: "expected 1497 to be 1200 // Object.is equality" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-red-test
        type: expect.preview
        at: { afterAction: expect-red-message }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-3 }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-time
        type: editor.select
        at: { mark: select-time }
        target:
          {
            file: src/checkout.test.js,
            text: "const at3pm = new Date(2026, 10, 5, 15, 0);",
            occurrence: 1,
          }
      - id: select-expect
        type: editor.select
        at: { mark: select-expect }
        target:
          {
            file: src/checkout.test.js,
            text: "const price = checkout(1500, at3pm);\n  expect(price).toBe(1200);",
            occurrence: 1,
          }
      - id: expect-diff
        type: expect.preview
        at: { mark: read-red }
        timeoutMs: 5000
        target: { by: testId, value: vt-diff-1 }
        textContains: "- 1200"
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-actual
        type: expect.preview
        at: { afterAction: expect-diff }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-actual, value: "1497" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-units-green
        type: expect.preview
        at: { mark: read-units }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "4" }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: fit
    narration: >
      ဘာကြောင့် ဒီလို ဖြစ်ရလဲ ဆိုတာ checkout ဖိုင်မှာ ကြည့်ရအောင်။ [[mark:select-why]] happy hour ရဲ့ code
      က ၀ ဒသမ ၂ ကို ပေးလိုက်ပေမဲ့၊ ဈေးနှုန်း တွက်တဲ့ function က အဲဒါကို ရာခိုင်နှုန်းလို့ ယူပြီး ၁၀၀ နဲ့
      ထပ်စားပါတယ်။ ဒါကြောင့် ၂၀ ရာခိုင်နှုန်း မဟုတ်ဘဲ ၀ ဒသမ ၂ ရာခိုင်နှုန်းပဲ လျှော့ဖြစ်ပြီး၊ ၁၅၀၀ ထဲက ၃ ကျပ်ပဲ
      လျှော့သွားတာပါ။ [[mark:cup-lid]] ပါဆယ် ခွက်ကို တစ်ဆိုင်ကနေ၊ အဖုံးကို နောက်တစ်ဆိုင်ကနေ မှာတယ် ဆိုပါစို့။ တစ်ခုချင်း
      စစ်ကြည့်ရင် ခွက်လည်း မယို၊ အဖုံးလည်း မပေါက်ပေမဲ့၊ အဖုံးကို ခွက်ပေါ် တကယ် စွပ်ကြည့်မှ အရွယ်
      မကိုက်တာ သိရပါတယ်။ unit test က တစ်ခုချင်း စစ်တာ ဖြစ်ပြီး၊ integration test က အဖုံးကို ခွက်ပေါ်
      စွပ်ကြည့်တာပါ။ [[mark:which-side]]
      ဒါဆို ဘယ်ဘက်ကို ပြင်မလဲ။ ဖိုင် တစ်ဖိုင်ချင်းစီက သူ့ comment မှာ ရေးထားတဲ့ စည်းကမ်းအတိုင်း မှန်နေလို့၊
      ပြင်ရမှာက နှစ်ခုကို ဆက်ပေးတဲ့ ဒီ line ပါ။ [[mark:type-fix]] happy hour ရဲ့ အချိုးကို မပို့ခင် ၁၀၀ နဲ့ မြှောက်ပြီး၊ ရာခိုင်နှုန်း ဖြစ်အောင်
      ပြောင်းပေးလိုက်ပါမယ်။ [[mark:read-green]] panel ကို ပြန်ကြည့်ပါ။ test ငါးခုလုံး အမှန်ခြစ် ဖြစ်ပြီး၊ အပေါ်က
      FAIL ကလည်း အစိမ်းရောင် PASS ပြန်ဖြစ်သွားပါပြီ။
    sources:
      - {
          title: "web.dev Learn Testing: What to test, an example where unit tests on their own are unhelpful",
          url: "https://web.dev/learn/testing/get-started/what-to-test",
        }
      - {
          title: "web.dev Learn Testing: Types of automated testing, integration tests",
          url: "https://web.dev/learn/testing/get-started/test-types#integration",
        }
    actions:
      - id: open-why
        type: workspace.openFile
        at: { scene: start }
        path: src/checkout.js
      - id: select-why
        type: editor.select
        at: { mark: select-why }
        target:
          { file: src/checkout.js, text: "priceAfter(price, happyHourRate(date))", occurrence: 1 }
      - id: type-fix
        type: editor.type
        at: { mark: type-fix }
        target: { file: src/checkout.js, after: "happyHourRate(date)", occurrence: 1 }
        text: " * 100"
      - id: expect-green
        type: expect.preview
        at: { afterAction: type-fix }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-green-count
        type: expect.preview
        at: { afterAction: expect-green }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "5" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-checkout-file
        type: expect.file
        at: { afterAction: expect-green-count }
        path: src/checkout.js
        contains: "return priceAfter(price, happyHourRate(date) * 100);"
      - id: expect-test-file
        type: expect.file
        at: { afterAction: expect-checkout-file }
        path: src/checkout.test.js
        contains: "  const price = checkout(1500, at3pm);\n  expect(price).toBe(1200);"

  - id: sizes
    narration: >
      [[mark:board-sizes]] Google မှာတော့ test တွေကို တခြား နည်းနဲ့ ခွဲပါတယ်။ test တစ်ခုက ဘာတွေ
      သုံးခွင့် ရှိလဲ ဆိုတာနဲ့ small test တွေ၊ medium test တွေ၊ large test တွေလို့ ခေါ်တာပါ။
      [[mark:draw-small]] small test က network ကိုရော database နဲ့ file ကိုပါ မသုံးရပါဘူး။ [[mark:draw-medium]]
      medium test ကတော့ ကိုယ့် စက်ထဲက database နဲ့ file ကို သုံးလို့ ရပြီး၊ network ကိုလည်း
      localhost အထိ ရပါတယ်။ [[mark:draw-large]] large test ကတော့ အပြင်က service တွေ အပါအဝင် ဘာမဆို သုံးလို့
      ရပါတယ်။ [[mark:draw-ours]] ဒီ စည်းကမ်းနဲ့ဆိုရင် integration test အပါအဝင် panel ပေါ်က test ငါးခုလုံးဟာ
      small test ပါ။ unit နဲ့ integration က code ဘယ်လောက် ပါလဲ ဆိုတာကို ပြောပြီး၊ small နဲ့ large က ဘာတွေ
      သုံးလဲ ဆိုတာကို ပြောတာပါ။
    sources:
      - {
          title: "Google Testing Blog: Test Sizes (facts C15)",
          url: "https://testing.googleblog.com/2010/12/test-sizes.html",
        }
      - {
          title: "web.dev Learn Testing: Types of automated testing",
          url: "https://web.dev/learn/testing/get-started/test-types",
        }
    actions:
      - id: board-sizes
        type: whiteboard.apply
        at: { mark: board-sizes }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-small
        type: whiteboard.apply
        at: { mark: draw-small }
        upsertIds: [b-small-box, b-small-head, b-small-1, b-small-2, b-small-3]
        drawMs: 2500
      - id: draw-medium
        type: whiteboard.apply
        at: { mark: draw-medium }
        upsertIds: [b-med-box, b-med-head, b-med-1, b-med-2, b-med-3]
        drawMs: 2500
      - id: draw-large
        type: whiteboard.apply
        at: { mark: draw-large }
        upsertIds: [b-large-box, b-large-head, b-large-1, b-large-2]
        drawMs: 2200
      - id: draw-ours
        type: whiteboard.apply
        at: { mark: draw-ours }
        upsertIds: [b-ours, b-axis-1, b-axis-2]
        drawMs: 3000

  - id: shapes
    chapter: "Testing pyramid နဲ့ တခြား ပုံစံတွေ"
    narration: >
      [[mark:board-shapes]] ဒါဆို test တွေကို ဘယ် အရွယ်အစား ဘယ်လောက်စီ ရေးသင့်လဲ။ [[mark:draw-pyramid]]
      လူသိအများဆုံး လမ်းညွှန်က testing pyramid ပါ။ အောက်ခြေမှာ unit test တွေ အများကြီး၊ အလယ်မှာ
      integration test တွေ၊ ထိပ်မှာ end to end test အနည်းငယ်ပဲ ထားပါတယ်။ [[mark:pyramid-why]] ဘာကြောင့်လဲဆိုတော့၊
      panel ပေါ်က test ငါးခုလို test တွေက တစ်စက္ကန့်တောင် မကြာဘဲ ပြီးလို့ ရာနဲ့ချီ ရှိလည်း ခဏခဏ run
      နိုင်ပြီး၊ browser ဖွင့်ရတဲ့ test တွေကတော့ ဆိုင် တစ်ခုလုံးကို စစ်ပေးပေမဲ့ ရေးရတာရော run ရတာပါ
      ကြာလို့ပါ။ [[mark:pyramid-top]] ပုံစံ အများစုရဲ့ ထိပ်ဆုံးမှာ
      လူကိုယ်တိုင် စစ်တဲ့ manual testing ကိုလည်း ထားတတ်ပါတယ်။ menu ပုံတွေ လှလှပပ ပေါ်လား ဆိုတာမျိုးကို
      code နဲ့ စစ်ရ ခက်လို့ပါ။ ဒီ lesson ရဲ့ panel ကလည်း unit test လေးခုပေါ်မှာ integration test တစ်ခု
      ရှိတဲ့ pyramid သေးသေးလေးပါ။ [[mark:draw-trophy]] JavaScript app တွေအတွက် trophy ပုံစံကိုလည်း သုံးကြပါတယ်။
      အောက်ခြေမှာ code ကို run စရာ မလိုဘဲ ဖတ်စစ်တဲ့ static analysis ရှိပြီး၊ ရေးရတဲ့ အချိန်နဲ့ ယှဉ်ရင်
      အကျိုး အများဆုံး ပေးတတ်တဲ့ integration test ကို အကျယ်ဆုံး ထားပါတယ်။
      [[mark:draw-cone]] ice cream cone ကတော့ pyramid ကို ပြောင်းပြန် လှန်ထားတာပါ။ manual testing နဲ့ end to
      end test များပြီး unit test နည်းလို့ စစ်ရတာ နှေးပါတယ်။ [[mark:draw-guide]] diamond လို ပုံစံတွေလည်း
      ရှိပေမဲ့၊ ဒါတွေ အားလုံးက ဥပဒေ မဟုတ်ဘဲ ကိုယ့် project နဲ့ ချိန်ညှိရမယ့် လမ်းညွှန်တွေပါ။
    sources:
      - {
          title: "web.dev Learn Testing: What testing is, the testing pyramid and other shapes",
          url: "https://web.dev/learn/testing/get-started/what-testing-is#the_scale_of_tests",
        }
      - {
          title: "Martin Fowler: Test Pyramid (facts C09)",
          url: "https://martinfowler.com/bliki/TestPyramid.html",
        }
      - {
          title: "Ham Vocke: The Practical Test Pyramid (facts C10)",
          url: "https://martinfowler.com/articles/practical-test-pyramid.html",
        }
      - {
          title: "Kent C. Dodds: The Testing Trophy and Testing Classifications (facts C11, C12)",
          url: "https://kentcdodds.com/blog/the-testing-trophy-and-testing-classifications",
        }
    actions:
      - id: board-shapes
        type: whiteboard.apply
        at: { mark: board-shapes }
        clear: true
        upsertIds: [c-title]
      - id: draw-pyramid
        type: whiteboard.apply
        at: { mark: draw-pyramid }
        upsertIds: [c-p-low, c-p-low-t, c-p-mid, c-p-mid-t, c-p-top, c-p-top-t, c-p-name]
        drawMs: 3500
      - id: draw-trophy
        type: whiteboard.apply
        at: { mark: draw-trophy }
        upsertIds:
          [
            c-t-base,
            c-t-base-t,
            c-t-low,
            c-t-low-t,
            c-t-mid,
            c-t-mid-t,
            c-t-top,
            c-t-top-t,
            c-t-name,
          ]
        drawMs: 4000
      - id: draw-cone
        type: whiteboard.apply
        at: { mark: draw-cone }
        upsertIds:
          [
            c-c-scoop,
            c-c-scoop-t,
            c-c-top,
            c-c-top-t,
            c-c-mid,
            c-c-mid-t,
            c-c-low,
            c-c-low-t,
            c-c-name,
          ]
        drawMs: 4000
      - id: draw-why
        type: whiteboard.apply
        at: { mark: pyramid-why }
        upsertIds: [c-fast, c-slow]
        drawMs: 2400

  - id: e2e
    narration: >
      [[mark:board-e2e]] pyramid ရဲ့ ထိပ်က end to end test ကို အနီးကပ် ကြည့်ရအောင်။ [[mark:draw-e2e-how]]
      Playwright ဒါမှမဟုတ် WebdriverIO လို tool က browser အစစ်ကို ထိန်းပြီး၊ customer လို လက်ဖက်ရည်
      ထည့်၊ ငွေရှင်းတဲ့ ခလုတ်ကို နှိပ်ပါတယ်။ ဒီ test တွေကို ကိုယ့် ကွန်ပျူတာ ဒါမှမဟုတ် CI server မှာ
      run ကြပါတယ်။ [[mark:draw-e2e-good]] test တစ်ခုတည်းက page ကနေ database အထိ စစ်ပေးလို့
      အစွမ်းထက်ပါတယ်။ [[mark:draw-e2e-bad]] ဒါပေမဲ့ နှေးပြီး၊ အပြင်က service တစ်ခု နှေးသွားတာနဲ့ code
      မပြောင်းဘဲ ကျတတ်ပါတယ်။ run တိုင်း database ထဲမှာ အော်ဒါ အတုတွေ ကျန်ခဲ့ရင်လည်း၊ နောက်ပိုင်း ကျတဲ့
      test ရဲ့ အကြောင်းရင်းကို ရှာရ ခက်ပါတယ်။ [[mark:draw-e2e-tip]] ဒါကြောင့် ဒီ test တွေကို ရိုးရှင်းအောင်
      ထားကြပါတယ်။ ငွေရှင်းတာကို စစ်ချင်ရင်၊ test ပတ်ဝန်းကျင်မှာပဲ ဖွင့်ထားတဲ့ flag နဲ့ sign in အဆင့်ကို
      ကျော်ခိုင်းတာမျိုးပါ။
    sources:
      - {
          title: "web.dev Learn Testing: Types of automated testing, end-to-end tests",
          url: "https://web.dev/learn/testing/get-started/test-types#e2e",
        }
      - {
          title: "web.dev Learn Testing: The testing environment, control a real browser",
          url: "https://web.dev/learn/testing/get-started/testing-environment#real-browser",
        }
    actions:
      - id: board-e2e
        type: whiteboard.apply
        at: { mark: board-e2e }
        clear: true
        upsertIds: [d-title]
      - id: draw-e2e-how
        type: whiteboard.apply
        at: { mark: draw-e2e-how }
        upsertIds: [d-how, d-where]
        drawMs: 2500
      - id: draw-e2e-good
        type: whiteboard.apply
        at: { mark: draw-e2e-good }
        upsertIds: [d-good]
        drawMs: 1500
      - id: draw-e2e-bad
        type: whiteboard.apply
        at: { mark: draw-e2e-bad }
        upsertIds: [d-bad-1, d-bad-2]
        drawMs: 2500
      - id: draw-e2e-tip
        type: whiteboard.apply
        at: { mark: draw-e2e-tip }
        upsertIds: [d-tip]
        drawMs: 1800

  - id: kinds
    chapter: "ရည်ရွယ်ချက်အလိုက် test အမျိုးအစား"
    narration: >
      test တွေကို အရွယ်အစားနဲ့ပဲ ခေါ်တာ မဟုတ်ပါဘူး။ [[mark:open-int]] ခုနက ရေးခဲ့တဲ့ test ကို
      ပြန်ကြည့်ရအောင်။ [[mark:select-int]] အရွယ်အစားနဲ့ဆိုရင် ဒါက integration test ပါ။ ဒါပေမဲ့ happy hour
      bug ကို ဖမ်းပြီး ပြင်ခဲ့လို့၊ အဲဒီ bug ပြန်မလာအောင် စောင့်ပေးတဲ့ regression test လည်း ဖြစ်သွားပါပြီ။
      [[mark:board-kinds]] ရည်ရွယ်ချက်အလိုက် အမျိုးအစားတွေကို
      ကြည့်ရအောင်။ [[mark:draw-kinds-1]] smoke test က ဆိုင်ရဲ့ page ပွင့်ပြီး menu ပေါ်လာလား ဆိုတာလို
      အဓိက အပိုင်းကို အမြန် စစ်ပါတယ်။ visual test က menu page ရဲ့ screenshot ကို အရင်ပုံနဲ့ ယှဉ်တာ
      ဖြစ်လို့ browser အစစ် လိုပါတယ်။ API test ကတော့ ဆိုင်ရဲ့ server က menu ကို မှန်မှန် ပြန်ပို့လား
      ဆိုတာလို system တွေကြား ဆက်သွယ်ပုံကို စစ်ပါတယ်။ [[mark:draw-kinds-2]] acceptance test မှာ
      ဆိုင်ရှင်က ကိုယ်တိုင် သုံးကြည့်ပြီး လိုချင်တာ ဟုတ်လား စစ်တာ များပါတယ်။ chaos test က လျှော့ဈေး ကုဒ်
      ရိုက်တဲ့ နေရာမှာ ကျပန်း စာတွေ ထည့်ပြီး site မပျက်ဘူးလား ကြည့်ပါတယ်။ failure test က ပို့ခ service ကို တမင်
      ပြတ်အောင် လုပ်ပြီး page က error ကို သေချာ ပြလား ကြည့်ပြီး၊ build test ကတော့ build လုပ်ပြီး ထွက်လာတဲ့
      ဖိုင်တွေကို စစ်ပါတယ်။ [[mark:draw-dimension]] ဒီ အမျိုးအစားတွေက အရွယ်အစားနဲ့ မဆိုင်လို့၊ smoke test တစ်ခုက unit test လည်း
      ဖြစ်နိုင်သလို end to end test လည်း ဖြစ်နိုင်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn Testing: Types of automated testing, smoke and regression tests",
          url: "https://web.dev/learn/testing/get-started/test-types#smoke",
        }
      - {
          title: "web.dev Learn Testing: Types of automated testing, visual, API and other types",
          url: "https://web.dev/learn/testing/get-started/test-types#other",
        }
      - {
          title: "web.dev Learn Testing: What to test, dimensionality",
          url: "https://web.dev/learn/testing/get-started/what-to-test#dimensionality",
        }
      - {
          title: "web.dev Learn Testing: Types of automated testing, check your understanding",
          url: "https://web.dev/learn/testing/get-started/test-types#check_your_understanding",
        }
    actions:
      - id: close-e2e
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-int
        type: workspace.openFile
        at: { mark: open-int }
        path: src/checkout.test.js
      - id: select-int
        type: editor.select
        at: { mark: select-int }
        target:
          {
            file: src/checkout.test.js,
            text: 'test("a tea at 15:00 costs 1200", () => {',
            occurrence: 1,
          }
      - id: board-kinds
        type: whiteboard.apply
        at: { mark: board-kinds }
        open: true
        clear: true
        upsertIds: [e-title]
      - id: draw-kinds-1
        type: whiteboard.apply
        at: { mark: draw-kinds-1 }
        upsertIds: [e-smoke, e-smoke-g, e-reg, e-reg-g, e-visual, e-visual-g, e-api, e-api-g]
        drawMs: 4000
      - id: draw-kinds-2
        type: whiteboard.apply
        at: { mark: draw-kinds-2 }
        upsertIds:
          [e-accept, e-accept-g, e-chaos, e-chaos-g, e-failure, e-failure-g, e-build, e-build-g]
        drawMs: 4000
      - id: draw-dimension
        type: whiteboard.apply
        at: { mark: draw-dimension }
        upsertIds: [e-dimension]
        drawMs: 1800

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:close-kinds]] ဒါဆို ပြန်ချုပ်ရရင်၊ unit test တွေ၊ integration test တွေ၊ end to end test တွေလို့
      အရွယ်အစားနဲ့ ခေါ်တဲ့ နာမည်တွေရဲ့ အဓိပ္ပာယ်ကို team ထဲမှာ သဘောတူထားရပါတယ်။ unit test
      တွေ အားလုံး အောင်နေရင်တောင် အပိုင်းတွေ မကိုက်တာကို integration test က ဖမ်းပေးပါတယ်။ [[mark:recap-shapes]]
      pyramid လို ပုံစံတွေက မြန်တဲ့ test တွေကို အောက်မှာ များများ၊ ကြာတဲ့ test တွေကို အပေါ်မှာ နည်းနည်း ထားဖို့
      လမ်းညွှန်ပြီး၊ smoke နဲ့ regression လို နာမည်တွေကတော့ ရည်ရွယ်ချက်ကို ပြောတာပါ။ နောက် lesson မှာတော့ ဘာကို
      အရင် test လုပ်မလဲ ဆိုတာကို ဆုံးဖြတ်နည်း ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "web.dev Learn Testing: Types of automated testing",
          url: "https://web.dev/learn/testing/get-started/test-types",
        }
      - {
          title: "web.dev Learn Testing: What to test and your approach",
          url: "https://web.dev/learn/testing/get-started/what-to-test",
        }
    actions:
      - id: close-kinds
        type: whiteboard.apply
        at: { mark: close-kinds }
        open: false
checks:
  - { type: timing.p95Ms, max: 300 }
