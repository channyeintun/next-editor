        }
      notebook/17-cost.md: |+
        # Reply assistant: တစ်ရက် ဘယ်လောက် ကုန်မလဲ

        ဈေးနှုန်း (2026-11၊ token 1 သန်း (MTok) အတွက်၊ Anthropic pricing page)

        | Model | Input | Output |
        |---|---|---|
        | Claude Opus 5.5 | $4 | $20 |
        | Claude Haiku 5.5 | $0.10 | $0.50 |

        Haiku 5.5 ဈေးက prompt 100K token အထိ။ ယူဆချက်: ticket 1 ခု = request 1 ခု။

