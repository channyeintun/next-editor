    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ကိုယ့် project ထဲက AI နဲ့ လုပ်ချင်တဲ့ အလုပ်
      တစ်ခုအတွက် ဒီ အဆင့် လေးဆင့်ကို ရေးကြည့်ပါ။ တစ်ကြိမ် ခေါ်ရင် input နဲ့ output token ဘယ်လောက်လဲ
      ခန့်မှန်းပြီး၊ pricing page က ဈေးနဲ့ တွက်ပါ။ ပြီးရင် တစ်ရက်ကို ဘယ်နှကြိမ် ခေါ်မလဲ ဆိုတာနဲ့ မြှောက်ပြီး၊
      model family နှစ်ခုကို ယှဉ်ကြည့်ပါ။
      [[mark:turn-2]] token အရေအတွက်ကို အတိအကျ မသိသေးရင် ယူဆချက်လို့ ရေးထားပြီး ဆက်တွက်ပါ။ အရေးကြီးတာက
      ဂဏန်း တစ်လုံးစီ ဘယ်ကလာလဲ ဆိုတာ worksheet ထဲမှာ မြင်ရဖို့ပါ။ CTO တစ်ယောက်က ယုံကြည်တာ နောက်ဆုံး
      ဂဏန်း တစ်လုံးကို မဟုတ်ဘဲ၊ အဲဒီ ဂဏန်းကို ရောက်လာတဲ့ တွက်နည်းကိုပါ။
    sources:
