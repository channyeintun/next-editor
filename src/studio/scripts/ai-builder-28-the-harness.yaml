build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 6128
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}
scenes:
  - id: recall
    chapter: Model ပတ်လည်မှာ ဘာရှိလဲ
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ agent ကို သုံးတဲ့ ငွေ ဘယ်ကို ကုန်လဲ ကြည့်ပြီး၊ rule ဖိုင်ကို တိုတို ထားတာ၊ အလုပ်နဲ့
      model ကို ကိုက်ရွေးတာ၊ spend limit ထားတာတွေကို ရေးခဲ့ပါတယ်။ အဲဒီ နည်းတွေ တစ်ခုမှ model ကိုယ်တိုင်ကို ပြင်တာ
      မဟုတ်ပါဘူး။ model ပတ်လည်မှာ ကိုယ် စီစဉ်ထားတဲ့ အရာတွေကို ပြင်တာပါ။ model တစ်ခုတည်းကို သုံးတာတောင် ပတ်လည်က
      အရာတွေ မတူရင် ရလဒ် အများကြီး ကွာသွားနိုင်ပါတယ်။ [[mark:sel-title]] ဒီနေ့ အဲဒီ ပတ်လည်က အရာတွေကို နာမည်
      တပ်ပြီး၊ ဆိုင်အတွက် စာရင်း တစ်ခုကို ဒီ ဖိုင်ထဲမှာ ရေးပါမယ်။ အခု ခေါင်းစဉ်ပဲ ရှိပါသေးတယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): Harness engineering (the model is one input of a running agent)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "The New SDLC (Burmese edition): The economics of AI development",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: sel-title,
          type: editor.select,
          at: { mark: sel-title },
          target: { file: docs/harness.md, text: "# Harness · ကြိုမှာ app", occurrence: 1 },
        }

  - id: harness-a
    chapter: Agent = model + harness
    narration: >
      [[mark:h-open]] agent ကို အပိုင်း နှစ်ပိုင်း ခွဲကြည့်ရအောင်။ အလယ်မှာ စာကို ဆက်ခန့်မှန်းပေးတဲ့ model
      ရှိပါတယ်။ model တစ်ခုတည်းနဲ့တော့ ဖိုင် မဖတ်နိုင်၊ command မ run နိုင်ပါဘူး။ model ပတ်လည်မှာ rule တွေ၊ tool
      တွေ၊ စစ်ဆေးချက်တွေ ပေါင်းထားမှ agent ဖြစ်လာတာပါ။ အဲဒီ ပတ်လည်က အရာ အားလုံးကို harness လို့ ခေါ်ပါတယ်။ Claude
      Code နဲ့ Codex လို coding agent တွေရဲ့ အပြုအမူကလည်း model တစ်ခုတည်းကနေ မဟုတ်ဘဲ harness နဲ့ ပေါင်းထားတာကနေ
      လာတာပါ။ [[mark:h-rules]] ပထမ အပိုင်းက AGENTS.md လို rule ဖိုင်ပါ။ session တိုင်း ဖတ်တဲ့ project ရဲ့
      စည်းကမ်းတွေပါ။ [[mark:h-tools]] ဒုတိယက tool တွေပါ။ agent က ကွန်ပျူတာမှာ ဘာ command တွေ run ခွင့် ရှိလဲ၊
      အပြင်က ဘာ system တွေနဲ့ ချိတ်ခွင့် ရှိလဲ ဆိုတာပါ။ အပြင်က system နဲ့ ချိတ်ဖို့ MCP လို့ ခေါ်တဲ့ စံ တစ်ခု
      ရှိပါတယ်။ ကြိုး ခေါင်း တစ်မျိုးတည်းနဲ့ စက် အမျိုးမျိုးကို ချိတ်သလို၊ agent ကို database၊ log၊ တခြား service
      တွေနဲ့ ပုံစံ တစ်မျိုးတည်းနဲ့ ချိတ်ပေးပါတယ်။ [[mark:h-skills]] တတိယက skill တွေပါ။ task လိုမှ agent ဖတ်တဲ့
      ညွှန်ကြားချက် အထုပ်တွေပါ။ အသေးစိတ်တွေကို ဒီမှာ ထားလို့ rule ဖိုင်ကို တိုတို ထားနိုင်ပါတယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): Harness engineering (Agent = Model + Harness; what the harness holds)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "Claude Code docs: Overview (reads your codebase, edits files, runs commands; CLAUDE.md or AGENTS.md, skills, hooks, MCP)",
          url: "https://code.claude.com/docs/en/overview",
        }
      - {
          title: "ChatGPT docs: Codex (AGENTS.md, MCP, skills, hooks, sandboxing in its docs)",
          url: "https://learn.chatgpt.com/docs",
        }
      - {
          title: "Model Context Protocol: What is MCP? (an open-source standard for connecting AI applications to external systems; like a USB-C port)",
          url: "https://modelcontextprotocol.io/",
        }
      - {
          title: "Claude Code docs: Skills (only the description is in context; the body loads when used)",
          url: "https://code.claude.com/docs/en/skills",
        }
    actions:
      - {
          id: open-board-h,
          type: whiteboard.apply,
          at: { mark: h-open },
          open: true,
          clear: true,
          upsertIds: [h-title, h-model-box, h-model],
          drawMs: 1400,
        }
      - {
          id: draw-h1,
          type: whiteboard.apply,
          at: { mark: h-rules },
          upsertIds: [h1-box, h1, h1-d],
          drawMs: 1200,
        }
      - {
          id: draw-h2,
          type: whiteboard.apply,
          at: { mark: h-tools },
          upsertIds: [h2-box, h2, h2-d],
          drawMs: 1200,
        }
      - {
          id: draw-h3,
          type: whiteboard.apply,
          at: { mark: h-skills },
          upsertIds: [h3-box, h3, h3-d],
          drawMs: 1200,
        }

  - id: harness-b
    narration: >
      [[mark:h-hooks]] စတုတ္ထက hook တွေပါ။ hook ဆိုတာ သတ်မှတ်ထားတဲ့ အချိန်မှာ အလိုလို run တဲ့ စစ်ဆေးချက်ပါ။ ဥပမာ
      agent က ဖိုင် တစ်ခု ပြင်ပြီးတိုင်း test တွေကို အလိုလို run ခိုင်းထားလို့ ရပါတယ်။ [[mark:h-sandbox]] ပဉ္စမက
      sandbox ပါ။ agent မှားသွားရင်တောင် တကယ့် data ကို မထိနိုင်တဲ့ သီးသန့် နေရာပါ။ agent run လိုက်တဲ့ command က
      ဘာပဲ လုပ်လုပ်၊ နယ်နိမိတ်ကို ကွန်ပျူတာက ထိန်းထားပါတယ်။ [[mark:h-logs]] နောက်ဆုံးက log ပါ။ agent ဘာ ဖတ်ခဲ့လဲ၊
      ဘာ run ခဲ့လဲ၊ ဘာ ပြင်ခဲ့လဲ ဆိုတဲ့ မှတ်တမ်းပါ။ မှတ်တမ်း မရှိရင် agent က ကောင်းကောင်း အလုပ်လုပ်နေလား၊
      တဖြည်းဖြည်း လမ်းချော်နေလား မသိနိုင်ပါဘူး။ [[mark:h-ours]] agent tool တွေမှာ ဒီ အပိုင်းတွေ အခြေခံ ပါလာပေမဲ့၊
      ကိုယ့် project အတွက် ဘာ rule၊ ဘာ hook ထားမလဲ၊ ဘယ်လောက် ခွင့်ပြုမလဲ ဆိုတာကိုတော့ ကိုယ်တိုင် စီစဉ်ရပါတယ်။
    sources:
      - {
          title: "Claude Code docs: Automate actions with hooks (shell commands that run at fixed points; deterministic control)",
          url: "https://code.claude.com/docs/en/hooks-guide",
        }
      - {
