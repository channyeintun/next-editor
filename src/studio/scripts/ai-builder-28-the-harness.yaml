          url: "https://code.claude.com/docs/en/overview",
        }
      - {
          title: "Claude Code docs: Sandboxing (the operating system enforces the boundary whatever the model chose to run)",
          url: "https://code.claude.com/docs/en/sandboxing",
        }
      - {
          title: "The New SDLC (Burmese edition): Harness engineering (sandboxes, hooks, observability; the team's surface area)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
