# CSS course (Burmese), lesson 17 of 43: flexbox part 3, alignment.
#
# Narration is an ENGLISH DRAFT for the Burmese writer (DESIGN.md next to this
# file is the span-by-span brief). Every [[mark:…]] sits where its action
# begins, at a sentence end; each span carries one piece of meaning.
# Everything the learner sees (title, chapters, whiteboard labels, UI strings)
# is Burmese already.
#
# Shape: board (recall lesson 16; justify = main axis, align = cross axis; the
# two groups, distributing space vs aligning items; Box Alignment shared with
# grid) → code tour (header nav, hero, chips, tags, drinks, wide chips; empty
# styles.css) → the chips: flex + justify-content flex-end, center,
# space-between, space-around, space-evenly (later declarations) → board
# (where the gaps go) → chips flex: 1: no free space, justify-content does
# nothing → the tag box: flex + wrap + gap + height (lines stretch), then
# align-content flex-start / center / space-between, then place-content:
# center end → board (lines; nowrap = one line; the line is the cross-axis
# space) → the drinks cards: flex row (equal heights = stretch), align-items
# flex-start / center, baseline named → align-self: flex-end on the featured
# card → board (no justify-self; an auto margin takes the free space) → nav
# last item margin-left: auto → the hero: flex column (the button stretches
# across), justify-content: center (nothing), min-height: 240px (vertical
# middle), align-items: center (both ways); margin: auto and block-layout
# align-content as sentences → the wide English chips: justify-content:
# center pushes the first chip out of reach, safe center keeps it; flex-start vs start →
# quiz (column: which property centres left to right) and recap, hand-off to
# grid (lesson 18).
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set(; no postcss config; no reload.
# Every rule is appended at the END of styles.css (an unclosed "{" typed in
# the middle would swallow the rules after it); only single declarations are
# inserted inside an existing rule. Keystroke-typed values have no valid
# prefix: every alignment keyword (flex-end, center, space-*, flex-start,
# safe center), "margin-left: auto", "min-height: 240px" (a unitless 2 / 24 /
# 240 is invalid) and "flex: 1" (complete at its first character). Three inserts
# would flash a wrong intermediate layout if typed key by key, so they land as
# line-by-line or block: the tag box (display flex before wrap squeezes eight
# tags into one line), the cards (display flex before flex 1), the hero
# column (display flex before the direction makes a row), and place-content
# (its prefix "center" is valid on its own); the wide-chips rule is
# line-by-line (narration summarises it).
#
# Measured in headless Chrome at 432 × 720 (probe/stages.ts): chips 60/65/63/51
# with 161 px free (flex-end → right; center; between; around edges 20 inner
# 40; evenly 32 each; flex 1 → 100 × 4); tags wrap into three lines whose tags
# stretch to 63 px, flex-start → 35 px packed at the top, center, between,
# place-content center end → lines centred, tags at the right end; cards
# 133/126/126 × 282 stretched → flex-start 159/282/131 → center → the
# featured card's align-self flex-end moves it 61 px down; nav last link x 120
# → 360; hero column: button 88 → 368 wide, min-height 240 moves the content 46
# px down, align-items center centres it; wide chips: center → first chip at
# x −217 (wholly out of view, the second one cut at the left edge,
# scrollLeft 0), safe center → x 16.
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
