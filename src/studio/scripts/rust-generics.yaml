# Rust from zero, lesson 16: generics.
#
# The arc: a whiteboard draws the problem generics solve (largest_i32 and
# largest_char are the same function with only the types changed). The deck's
# "Generics" page shows the one generic signature, and the editor types it,
# without a bound, so it matches the slide exactly. A second board shows the
# compiler's answer (E0369: `>` can't be applied to `&T`, and its help:
# restrict T with PartialOrd). The deck's "Trait bounds" page names the fix and
# why it costs nothing at runtime (a version is built per type: the two copies
# from the first board). Back in the editor, `: PartialOrd` is inserted and
# largest is called with i32s and chars. Then a generic struct Point<T>, and a
# third board on what one T means: x and y share a type (E0308 when they
# don't; Point<T, U> when you need two). One run at the end. Traits are the
# NEXT lesson, so PartialOrd gets a one-sentence explanation of "trait".
#
# Every compiler message on a board or in the narration was confirmed with
# rustc 1.98 (edition 2024) on broken variants of the final program:
#   fn largest<T>(list: &[T]) -> &T { … if item > biggest { … } … }
#     error[E0369]: binary operation `>` cannot be applied to type `&T`
#     help: consider restricting type parameter `T` with trait `PartialOrd`
#   let ints = Point { x: 5, y: 4.0 };   (struct Point<T> { x: T, y: T })
#     error[E0308]: mismatched types
#     expected integer, found floating-point number
#   struct Point<T, U> { x: T, y: U } with Point { x: 5, y: 4.0 } compiles.
#
# Board colours: blue = the thing being named (the functions, T and what it
# becomes, with arrows from each Point to its T), orange = what changes (the
# types in the copies), red = the errors (and the arrow from the circled `>`
# down to E0369), green = what works (the compiler's fix, two placeholders).
# #1e1e1e paints white on the dark board.
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/rust-generics.yaml
