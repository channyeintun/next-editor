build:
  voiceProfile: pocket-alba-v1
  seed: 45

runtime:
  kind: rust-playground
  defaultMode: fixture
  fixture:
    latencyMs: 600
    result:
      status: success
      stdout: "largest number: 100\nlargest letter: y\nints: (5, 10)\nfloats: (1.5, 2.5)\n"
      stderr: ""

scenes:
  - id: why
    chapter: Why generics?
    narration: >
      Say you need the largest number in a list. [[mark:draw-i32]] You write
      a function that takes a slice of i32 values, and returns the largest
      one. [[mark:draw-char]] Later, you need the largest letter in a list of
      chars. So you copy the function, and change i32 to char.
      [[mark:draw-types]] The bodies are exactly the same. Only the type is
      different. And with copied code, every fix has to be made twice.
      Generics solve this.
    sources:
      - title: "The Rust Book — Removing Duplication by Extracting a Function"
        url: "https://doc.rust-lang.org/book/ch10-00-generics.html#removing-duplication-by-extracting-a-function"
      - title: "The Rust Book — In Function Definitions"
        url: "https://doc.rust-lang.org/book/ch10-01-syntax.html#in-function-definitions"
    actions:
      # Opens in the quiet handle before the first word.
      - id: open-board-copies
        type: whiteboard.apply
        at: { scene: start, offsetMs: -1200 }
        open: true
        upsertIds: [b1-title]
      - id: draw-i32
        type: whiteboard.apply
        at: { mark: draw-i32 }
        upsertIds: [b1-box-i32, b1-sig-i32, b1-body-i32]
        drawMs: 2400
      - id: draw-char
        type: whiteboard.apply
        at: { mark: draw-char }
        upsertIds: [b1-box-char, b1-sig-char, b1-body-char]
        drawMs: 2400
      - id: draw-types
        type: whiteboard.apply
        at: { mark: draw-types }
        upsertIds: [b1-ring-1, b1-ring-2, b1-ring-3, b1-ring-4, b1-note]
        drawMs: 3000

  - id: generics-slide
    chapter: A generic function
    narration: >
      With generics, you write the function once, for many types. Look at
      the angle brackets after its name. T is a type placeholder. So list is
      a slice of T, and the function returns a reference to a T. Call it
      with i32 values, and T is i32. Call it with chars, and T is char. By
      convention, it's one capital letter, and T is short for type.
    sources:
      - title: "The Rust Book — In Function Definitions"
        url: "https://doc.rust-lang.org/book/ch10-01-syntax.html#in-function-definitions"
      - title: "Rust By Example — Generics"
        url: "https://doc.rust-lang.org/rust-by-example/generics.html"
    actions:
      - id: close-board-copies
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: show-generics
        type: slide.show
        at: { scene: start, offsetMs: 300 }
        slideId: generics-slide

  - id: write
    narration: >
      Let's write it. Here's an array of numbers, and an array of letters.
      [[mark:type-largest]] Now the function, with T in angle brackets. It
      starts with the first item as the biggest so far. Then it goes through
      the list, and keeps any item that's bigger.
      [[mark:select-compare]] Everything depends on this comparison:
      item greater than biggest. So, will it compile?
    sources:
      - title: "The Rust Book — In Function Definitions"
        url: "https://doc.rust-lang.org/book/ch10-01-syntax.html#in-function-definitions"
      - title: "The Rust Book — Other Slices"
        url: "https://doc.rust-lang.org/book/ch04-03-slices.html#other-slices"
    actions:
      - id: close-generics
        type: slide.close
        at: { scene: start }
      - id: open-main
        type: workspace.openFile
        at: { scene: start, offsetMs: 500 }
        path: main.rs
      - id: type-largest
        type: editor.type
        at: { mark: type-largest }
        target:
          file: main.rs
          after: ""
          occurrence: 1
        cadence: line-by-line
        text: "fn largest<T>(list: &[T]) -> &T {\n    let mut biggest = &list[0];\n    for item in list {\n        if item > biggest {\n            biggest = item;\n        }\n    }\n    biggest\n}\n\n"
      - id: select-compare
        type: editor.select
        at: { mark: select-compare }
        target:
          file: main.rs
          text: "item > biggest"
          occurrence: 1

  - id: error
    chapter: Trait bounds
    narration: >
      Not yet. Rust checks a generic function for every possible T, not
      only for the types you call it with. [[mark:draw-err-code]] And not
      every type can be compared with greater than.
      [[mark:draw-err-msg]] So the compiler stops you, with error E0369. The
      greater-than operation can't be applied to a reference to T.
      [[mark:draw-err-help]] It also suggests a fix: restrict T with the
      trait PartialOrd. A trait is a named set of abilities that a type can
      have. PartialOrd is the ability to be compared, with less than and
      greater than.
    sources:
      - title: "The Rust Book — In Function Definitions"
        url: "https://doc.rust-lang.org/book/ch10-01-syntax.html#in-function-definitions"
      - title: "Rust error codes — E0369"
        url: "https://doc.rust-lang.org/error_codes/E0369.html"
      - title: "The Rust Book — Traits: Defining Shared Behavior"
        url: "https://doc.rust-lang.org/book/ch10-02-traits.html"
      - title: "std::cmp::PartialOrd"
        url: "https://doc.rust-lang.org/std/cmp/trait.PartialOrd.html"
    actions:
      - id: open-board-error
        type: whiteboard.apply
        at: { scene: start }
        open: true
        clear: true
        upsertIds: [b2-title]
      - id: draw-err-code
        type: whiteboard.apply
        at: { mark: draw-err-code }
        upsertIds: [b2-code, b2-types, b2-ring]
        drawMs: 2400
      - id: draw-err-msg
        type: whiteboard.apply
        at: { mark: draw-err-msg }
        upsertIds: [b2-arrow, b2-err1, b2-err2]
        drawMs: 2800
      - id: draw-err-help
        type: whiteboard.apply
        at: { mark: draw-err-help }
        upsertIds: [b2-help1, b2-help2, b2-help-line]
        drawMs: 2600

  - id: bounds-slide
    narration: >
      So we add a trait bound. You write it after T, with a colon. T colon
      PartialOrd says T must be comparable. Now largest accepts only types
      that can be compared, like numbers and chars. And there's no runtime
      cost. When you compile, Rust builds a separate, fast version of largest
      for each type you use. One for i32, and one for char. They're the
      same two copies you saw at the start, and the compiler writes them for
      you.
    sources:
      - title: "The Rust Book — Trait Bound Syntax"
        url: "https://doc.rust-lang.org/book/ch10-02-traits.html#trait-bound-syntax"
      - title: "The Rust Book — Performance of Code Using Generics"
        url: "https://doc.rust-lang.org/book/ch10-01-syntax.html#performance-of-code-using-generics"
    actions:
      - id: close-board-error
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: show-bounds
        type: slide.show
        at: { scene: start, offsetMs: 300 }
        slideId: bounds-slide

  - id: add-bound
    narration: >
      Back in the editor. [[mark:type-bound]] Let's add the bound: a colon,
      then PartialOrd. [[mark:select-bound]] With T colon PartialOrd, every T
      that reaches the comparison can be compared. So now it compiles.
      [[mark:type-calls]] Let's call largest twice, once with the numbers,
      and once with the letters. The ampersand lends each array as a slice.
    sources:
      - title: "The Rust Book — Trait Bound Syntax"
        url: "https://doc.rust-lang.org/book/ch10-02-traits.html#trait-bound-syntax"
      - title: "The Rust Book — In Function Definitions"
        url: "https://doc.rust-lang.org/book/ch10-01-syntax.html#in-function-definitions"
      - title: "The Rust Reference — Unsized coercions (array to slice)"
        url: "https://doc.rust-lang.org/reference/type-coercions.html#unsized-coercions"
    actions:
      - id: close-bounds
        type: slide.close
        at: { scene: start }
      - id: type-bound
        type: editor.type
        at: { mark: type-bound }
        target:
          file: main.rs
          after: "fn largest<T"
          occurrence: 1
        cadence: natural
        text: ": PartialOrd"
      - id: select-bound
        type: editor.select
        at: { mark: select-bound }
        target:
          file: main.rs
          text: "T: PartialOrd"
          occurrence: 1
      - id: type-calls
        type: editor.type
        at: { mark: type-calls }
        target:
          file: main.rs
          after: "    let letters = ['y', 'm', 'a', 'q'];\n"
          occurrence: 1
        cadence: line-by-line
        text: "    println!(\"largest number: {}\", largest(&numbers));\n    println!(\"largest letter: {}\", largest(&letters));\n"

  - id: struct
    chapter: Generic structs
    narration: >
      Structs can be generic too. [[mark:type-struct]] Here's a Point, with a
      type placeholder T. [[mark:select-fields]] Both x and y have the type
      T. [[mark:type-points]] So one Point can hold integers, and another can
      hold floats. Then we print their fields.
    sources:
      - title: "The Rust Book — In Struct Definitions"
        url: "https://doc.rust-lang.org/book/ch10-01-syntax.html#in-struct-definitions"
    actions:
      - id: type-struct
        type: editor.type
        at: { mark: type-struct }
        target:
          file: main.rs
          after: ""
          occurrence: 1
        cadence: line-by-line
        text: "struct Point<T> {\n    x: T,\n    y: T,\n}\n\n"
      - id: select-fields
        type: editor.select
        at: { mark: select-fields }
        target:
          file: main.rs
          text: "x: T,\n    y: T,"
          occurrence: 1
      - id: type-points
        type: editor.type
        at: { mark: type-points }
        target:
          file: main.rs
          after: "    println!(\"largest letter: {}\", largest(&letters));\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n    let ints = Point { x: 5, y: 10 };\n    let floats = Point { x: 1.5, y: 2.5 };\n    println!(\"ints: ({}, {})\", ints.x, ints.y);\n    println!(\"floats: ({}, {})\", floats.x, floats.y);\n"

  - id: one-type
    narration: >
      Let's see what T becomes. [[mark:draw-ok]] For the first point, T is
      i32. For the second, it's f64. [[mark:draw-mixed]] But what if x is an
      integer, and y is a float? [[mark:draw-mixed-err]] That's error E0308,
      mismatched types. The five makes T an integer, so the compiler
      expected an integer for y too, and found a floating-point number. One
      T means one type for both fields.
      [[mark:draw-two]] If you really need two types, give Point two
      placeholders, like T and U.
    sources:
      - title: "The Rust Book — In Struct Definitions"
        url: "https://doc.rust-lang.org/book/ch10-01-syntax.html#in-struct-definitions"
      - title: "Rust error codes — E0308"
        url: "https://doc.rust-lang.org/error_codes/E0308.html"
    actions:
      - id: open-board-one-type
        type: whiteboard.apply
        at: { scene: start }
        open: true
        clear: true
        upsertIds: [b3-title]
      - id: draw-ok
        type: whiteboard.apply
        at: { mark: draw-ok }
        upsertIds: [b3-ints, b3-ints-arrow, b3-ints-t, b3-floats, b3-floats-arrow, b3-floats-t]
        drawMs: 3000
      - id: draw-mixed
        type: whiteboard.apply
        at: { mark: draw-mixed }
        upsertIds: [b3-mixed, b3-mixed-line, b3-mixed-arrow, b3-mixed-t]
        drawMs: 2200
      - id: draw-mixed-err
        type: whiteboard.apply
        at: { mark: draw-mixed-err }
        upsertIds: [b3-err1, b3-err2]
        drawMs: 2400
      - id: draw-two
        type: whiteboard.apply
        at: { mark: draw-two }
        upsertIds: [b3-two, b3-two-label]
        drawMs: 2000

  - id: run
    narration: >
      Back to the code. [[mark:run]] Let's run it. The largest number is one
      hundred, and the largest letter is y. Then the integer point, five and
      ten, and the float point, one point five and two point five.
    sources:
      - title: "The Rust Book — Generic Data Types"
        url: "https://doc.rust-lang.org/book/ch10-01-syntax.html"
    actions:
      - id: close-board-one-type
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "largest letter: y"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: "fn largest<T: PartialOrd>(list: &[T]) -> &T {"

  - id: wrap
    narration: >
      So generics let you write code once, for many types. A trait bound,
      like PartialOrd, says what T must be able to do. And the compiler
      builds a fast version for each type you use. Next, traits: how to
      define shared behavior of your own, and implement it for your types.
    sources:
      - title: "The Rust Book — Generic Types, Traits, and Lifetimes"
        url: "https://doc.rust-lang.org/book/ch10-00-generics.html"
      - title: "The Rust Book — Traits: Defining Shared Behavior"
        url: "https://doc.rust-lang.org/book/ch10-02-traits.html"
    actions: []

checks:
  # 500 (not 300): google-svg deck slides embed per-slide font data whose
