runtime:
  kind: rust-playground
  defaultMode: fixture
  fixture:
    latencyMs: 600
    result:
      status: success
      stdout: "largest number: 100

        largest letter: y

        ints: (5, 10)

        floats: (1.5, 2.5)\n"
      stderr: ""

scenes:
  - id: why
    chapter: Generic တွေ ဘာကြောင့် လိုလဲ
    narration: >-
      စာရင်း တစ်ခုထဲက အကြီးဆုံး ကိန်းဂဏန်းကို လိုချင်တယ် ဆိုပါစို့။ [[mark:draw-i32]] ဒါဆို i32
      slice တစ်ခု လက်ခံပြီး၊ သူ့ထဲက အကြီးဆုံး တန်ဖိုးကို ပြန်ပေးတဲ့ function တစ်ခု ရေးလိုက်ပါမယ်။
      [[mark:draw-char]] နောက်ပိုင်းမှာ char တွေ ပါတဲ့ စာရင်း တစ်ခုထဲက အကြီးဆုံး စာလုံးကိုလည်း
      လိုလာတဲ့အခါ၊ ခုနက function ကို copy ကူးပြီး i32 နေရာမှာ char လို့ ပြောင်းရေးလိုက်ရပါတယ်။
      [[mark:draw-types]] function နှစ်ခုရဲ့ body က အတိအကျ တူနေပြီး၊ ကွာသွားတာက type တစ်ခုပဲ ဆိုတာ
      သတိထား ကြည့်ပါ။ ဒီလို copy ကူးထားတဲ့ code မှာဆိုရင် ပြင်စရာ တစ်ခု ရှိလာတိုင်း နှစ်နေရာ
      ပြင်ရပါတယ်။ ဒီ ပြဿနာကို generic တွေက ဖြေရှင်းပေးပါတယ်။
    sources:
      - title: "The Rust Book — Removing Duplication by Extracting a Function"
        url:
          "https://doc.rust-lang.org/book/ch10-00-generics.html#removing-duplication-by-extracting-a-fun\
          ction"
      - title: "The Rust Book — In Function Definitions"
        url: "https://doc.rust-lang.org/book/ch10-01-syntax.html#in-function-definitions"
    actions:
      # Opens in the quiet handle before the first word.
      - id: open-board-copies
        type: whiteboard.apply
        at: { scene: start, offsetMs: -1200 }
        open: true
        upsertIds: [b1-title]
      - id: draw-i32
        type: whiteboard.apply
        at: { mark: draw-i32 }
        upsertIds: [b1-box-i32, b1-sig-i32, b1-body-i32]
        drawMs: 2400
      - id: draw-char
        type: whiteboard.apply
        at: { mark: draw-char }
        upsertIds: [b1-box-char, b1-sig-char, b1-body-char]
        drawMs: 2400
      - id: draw-types
        type: whiteboard.apply
        at: { mark: draw-types }
        upsertIds: [b1-ring-1, b1-ring-2, b1-ring-3, b1-ring-4, b1-note]
        drawMs: 3000

  - id: generics-slide
    chapter: Generic function တစ်ခု
    narration: >-
      generic တွေနဲ့ဆိုရင် function ကို တစ်ကြိမ်တည်း ရေးပြီး၊ type အများကြီးအတွက် သုံးလို့ ရပါတယ်။
      function နာမည် နောက်က angle bracket ကို ကြည့်ပါ။ အဲဒီထဲက T က type တစ်ခုအတွက် placeholder ပါ။
      ဆိုတော့ list က T slice တစ်ခု ဖြစ်ပြီး၊ function ကလည်း T reference တစ်ခု ပြန်ပေးပါတယ်။ i32
      တန်ဖိုးတွေနဲ့ ခေါ်ရင် T က i32 ဖြစ်သွားပြီး၊ char တွေနဲ့ ခေါ်ရင် T က char ဖြစ်သွားပါတယ်။
      ထုံးစံအရ placeholder ကို စာလုံးကြီး တစ်လုံးတည်းနဲ့ ရေးလေ့ ရှိပြီး၊ T ဆိုတာ type ရဲ့
      အတိုကောက်ပါ။
    sources:
      - title: "The Rust Book — In Function Definitions"
        url: "https://doc.rust-lang.org/book/ch10-01-syntax.html#in-function-definitions"
      - title: "Rust By Example — Generics"
        url: "https://doc.rust-lang.org/rust-by-example/generics.html"
    actions:
      - id: close-board-copies
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: show-generics
        type: slide.show
        at: { scene: start, offsetMs: 300 }
        slideId: generics-slide

  - id: write
    narration: >-
      ကဲ၊ ရေးကြည့်ရအောင်။ ဒီမှာ ကိန်းဂဏန်း array တစ်ခုနဲ့ စာလုံး array တစ်ခု ရှိပါတယ်။
      [[mark:type-largest]] အခု function ကို ရေးပါမယ်။ နာမည်ရဲ့ နောက်မှာ angle bracket ထဲက T ကို
      တွေ့ရပါလိမ့်မယ်။ အစမှာ ပထမ item ကို လောလောဆယ် အကြီးဆုံး အဖြစ် ယူထားပါတယ်။ ပြီးတော့ list ကို
      တစ်ခုချင်း သွားရင်း၊ ပိုကြီးတဲ့ item တွေ့တိုင်း အဲဒါကို အကြီးဆုံး အဖြစ် ပြောင်းသိမ်းပါတယ်။
      [[mark:select-compare]] အကုန်လုံးက ဒီ နှိုင်းယှဉ်မှု တစ်ခုပေါ်မှာ မူတည်နေပါတယ်၊ item က biggest
      ထက် ကြီးလား ဆိုတာပါ။ ဒါဆို compile လုပ်လို့ ရမလား။
    sources:
      - title: "The Rust Book — In Function Definitions"
        url: "https://doc.rust-lang.org/book/ch10-01-syntax.html#in-function-definitions"
      - title: "The Rust Book — Other Slices"
        url: "https://doc.rust-lang.org/book/ch04-03-slices.html#other-slices"
    actions:
      - id: close-generics
        type: slide.close
        at: { scene: start }
      - id: open-main
        type: workspace.openFile
        at: { scene: start, offsetMs: 500 }
        path: main.rs
      - id: type-largest
        type: editor.type
        at: { mark: type-largest }
        target:
          file: main.rs
          after: ""
          occurrence: 1
        cadence: line-by-line
        text: "fn largest<T>(list: &[T]) -> &T {

          \    let mut biggest = &list[0];

          \    for item in list {

          \        if item > biggest {

          \            biggest = item;

          \        }

          \    }

          \    biggest

          }

          \n"
      - id: select-compare
        type: editor.select
        at: { mark: select-compare }
        target:
          file: main.rs
          text: "item > biggest"
          occurrence: 1

  - id: error
    chapter: Trait bound တွေ
    narration: >-
      မရသေးပါဘူး။ Rust က generic function တစ်ခုကို ကိုယ် ခေါ်တဲ့ type တွေအတွက်တင် မဟုတ်ဘဲ၊
      ဖြစ်နိုင်တဲ့ T တိုင်းအတွက် စစ်ပါတယ်။ [[mark:draw-err-code]] ဒီ စာကြောင်းမှာ item နဲ့ biggest က
      T reference တွေ ဖြစ်နေပါတယ်။ ဒါပေမဲ့ type တိုင်းကို ဘယ်ဟာက ပိုကြီးလဲ ဆိုပြီး နှိုင်းယှဉ်လို့
      ရတာ မဟုတ်ပါဘူး။ [[mark:draw-err-msg]] ဒါကြောင့် compiler က E0369 error နဲ့ ရပ်သွားပါတယ်။
      ဆိုလိုတာက၊ ထက် ကြီးလား ဆိုတဲ့ နှိုင်းယှဉ်မှုကို T reference ပေါ်မှာ သုံးလို့ မရဘူးတဲ့။
      [[mark:draw-err-help]] ပြီးတော့ help စာကြောင်းမှာ ပြင်နည်းကိုပါ ပြောထားပါတယ်၊ T ကို PartialOrd
      ဆိုတဲ့ trait နဲ့ ကန့်သတ်လိုက်ပါတဲ့။ trait ဆိုတာ type တစ်ခု လုပ်နိုင်တဲ့ စွမ်းရည်တွေကို
      နာမည်ပေးထားတာပါ။ PartialOrd ကတော့ တန်ဖိုး နှစ်ခုကို ဘယ်ဟာက ပိုငယ်လဲ၊ ဘယ်ဟာက ပိုကြီးလဲ ဆိုပြီး
      နှိုင်းယှဉ်လို့ ရတဲ့ စွမ်းရည်ပါ။
    sources:
      - title: "The Rust Book — In Function Definitions"
        url: "https://doc.rust-lang.org/book/ch10-01-syntax.html#in-function-definitions"
      - title: "Rust error codes — E0369"
        url: "https://doc.rust-lang.org/error_codes/E0369.html"
      - title: "The Rust Book — Traits: Defining Shared Behavior"
        url: "https://doc.rust-lang.org/book/ch10-02-traits.html"
      - title: "std::cmp::PartialOrd"
        url: "https://doc.rust-lang.org/std/cmp/trait.PartialOrd.html"
    actions:
      - id: open-board-error
        type: whiteboard.apply
        at: { scene: start }
        open: true
        clear: true
        upsertIds: [b2-title]
      - id: draw-err-code
        type: whiteboard.apply
        at: { mark: draw-err-code }
        upsertIds: [b2-code, b2-types, b2-ring]
        drawMs: 2400
      - id: draw-err-msg
        type: whiteboard.apply
        at: { mark: draw-err-msg }
        upsertIds: [b2-arrow, b2-err1, b2-err2]
        drawMs: 2800
      - id: draw-err-help
        type: whiteboard.apply
        at: { mark: draw-err-help }
        upsertIds: [b2-help1, b2-help2, b2-help-line]
        drawMs: 2600

  - id: bounds-slide
    narration: >-
      ဒါကြောင့် trait bound တစ်ခု ထည့်ပါမယ်။ trait bound ကို T နောက်မှာ colon ခံပြီး ရေးပါတယ်။ T
      colon PartialOrd ဆိုတာ T ဟာ နှိုင်းယှဉ်လို့ ရတဲ့ type ဖြစ်ရမယ်လို့ ပြောတာပါ။ အဲဒီအခါ largest က
      နှိုင်းယှဉ်လို့ ရတဲ့ type တွေကိုပဲ လက်ခံတော့ပါတယ်၊ ဥပမာအားဖြင့် ကိန်းဂဏန်းတွေနဲ့ char တွေပါ။
      ပြီးတော့ ဒါကြောင့် program run နေချိန်မှာ ဘာမှ ပိုနှေးမသွားပါဘူး။ compile လုပ်ချိန်မှာ Rust က
      ကိုယ် သုံးတဲ့ type တစ်ခုချင်းစီအတွက် largest ရဲ့ သီးသန့် မြန်ဆန်တဲ့ version တစ်ခုစီ
      တည်ဆောက်ပေးပါတယ်။ i32 အတွက် တစ်ခု၊ char အတွက် တစ်ခုပါ။ ဒါက အစမှာ မြင်ခဲ့တဲ့ copy နှစ်ခု
      အတိုင်းပါပဲ၊ ကွာတာက အခု compiler က ကိုယ့်အစား ရေးပေးတာပါ။
    sources:
      - title: "The Rust Book — Trait Bound Syntax"
        url: "https://doc.rust-lang.org/book/ch10-02-traits.html#trait-bound-syntax"
      - title: "The Rust Book — Performance of Code Using Generics"
        url: "https://doc.rust-lang.org/book/ch10-01-syntax.html#performance-of-code-using-generics"
    actions:
      - id: close-board-error
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: show-bounds
        type: slide.show
        at: { scene: start, offsetMs: 300 }
        slideId: bounds-slide

  - id: add-bound
    narration: >-
      editor ထဲ ပြန်သွားရအောင်။ [[mark:type-bound]] bound ကို ထည့်ကြည့်ရအောင်၊ colon တစ်ခု၊ ပြီးတော့
      PartialOrd ပါ။ [[mark:select-bound]] T colon PartialOrd ဖြစ်သွားတော့၊ ဒီ နှိုင်းယှဉ်မှုဆီ
      ရောက်လာမယ့် T တိုင်းဟာ နှိုင်းယှဉ်လို့ ရတဲ့ type ဖြစ်မှာ သေချာသွားပါပြီ။ ဒါကြောင့် အခု compile
      လုပ်လို့ ရပါပြီ။ [[mark:type-calls]] largest ကို နှစ်ကြိမ် ခေါ်ကြည့်ရအောင်၊ တစ်ကြိမ်က
      ကိန်းဂဏန်းတွေနဲ့၊ နောက်တစ်ကြိမ်က စာလုံးတွေနဲ့ပါ။ array ရှေ့က ampersand က array တစ်ခုချင်းစီကို
      slice အနေနဲ့ ငှားပေးလိုက်တာပါ။
    sources:
      - title: "The Rust Book — Trait Bound Syntax"
        url: "https://doc.rust-lang.org/book/ch10-02-traits.html#trait-bound-syntax"
      - title: "The Rust Book — In Function Definitions"
        url: "https://doc.rust-lang.org/book/ch10-01-syntax.html#in-function-definitions"
      - title: "The Rust Reference — Unsized coercions (array to slice)"
        url: "https://doc.rust-lang.org/reference/type-coercions.html#unsized-coercions"
    actions:
      - id: close-bounds
        type: slide.close
        at: { scene: start }
      - id: type-bound
        type: editor.type
        at: { mark: type-bound }
        target:
          file: main.rs
          after: "fn largest<T"
          occurrence: 1
        cadence: natural
        text: ": PartialOrd"
      - id: select-bound
        type: editor.select
        at: { mark: select-bound }
        target:
          file: main.rs
          text: "T: PartialOrd"
          occurrence: 1
      - id: type-calls
        type: editor.type
        at: { mark: type-calls }
        target:
          file: main.rs
          after: "    let letters = ['y', 'm', 'a', 'q'];\n"
          occurrence: 1
        cadence: line-by-line
        text: "    println!(\"largest number: {}\", largest(&numbers));

          \    println!(\"largest letter: {}\", largest(&letters));\n"

  - id: struct
    chapter: Generic struct တွေ
    narration: >-
      struct တွေလည်း generic ဖြစ်လို့ ရပါတယ်။ [[mark:type-struct]] ဒီမှာ Point struct တစ်ခု ရှိပြီး၊
      type placeholder အနေနဲ့ T ပါပါတယ်။ [[mark:select-fields]] x ရော y ရော နှစ်ခုလုံးရဲ့ type က T
      ပါ။ [[mark:type-points]] ဒါကြောင့် Point တစ်ခုမှာ integer တွေ သိမ်းပြီး၊ နောက် Point
      တစ်ခုမှာတော့ float တွေ သိမ်းလို့ ရပါတယ်။ ပြီးတော့ သူတို့ရဲ့ field တွေကို print ထုတ်ပါမယ်။
    sources:
      - title: "The Rust Book — In Struct Definitions"
        url: "https://doc.rust-lang.org/book/ch10-01-syntax.html#in-struct-definitions"
    actions:
      - id: type-struct
        type: editor.type
        at: { mark: type-struct }
        target:
          file: main.rs
          after: ""
          occurrence: 1
        cadence: line-by-line
        text: "struct Point<T> {

          \    x: T,

          \    y: T,

          }

          \n"
      - id: select-fields
        type: editor.select
        at: { mark: select-fields }
        target:
          file: main.rs
          text: "x: T,\n    y: T,"
          occurrence: 1
      - id: type-points
        type: editor.type
        at: { mark: type-points }
        target:
          file: main.rs
          after: "    println!(\"largest letter: {}\", largest(&letters));\n"
          occurrence: 1
        cadence: line-by-line
        text: "

          \    let ints = Point { x: 5, y: 10 };

          \    let floats = Point { x: 1.5, y: 2.5 };

          \    println!(\"ints: ({}, {})\", ints.x, ints.y);

          \    println!(\"floats: ({}, {})\", floats.x, floats.y);\n"

  - id: one-type
    narration: >-
      ဒါဆို T က ဘာ ဖြစ်သွားလဲ ဆိုတာ ကြည့်ရအောင်။ [[mark:draw-ok]] ပထမ Point အတွက် T က i32 ဖြစ်ပြီး၊
      ဒုတိယ Point အတွက်ကတော့ f64 ပါ။ [[mark:draw-mixed]] ဒါပေမဲ့ x က integer ဖြစ်ပြီး y က float
      ဖြစ်နေရင်ရော။ [[mark:draw-mixed-err]] အဲဒါဆိုရင် E0308 error၊ mismatched types ပါ။ 5 ကြောင့် T
      က integer ဖြစ်သွားတဲ့အတွက်၊ compiler က y အတွက်လည်း integer ကို မျှော်လင့်ထားပေမဲ့၊ တွေ့တာက
      float ဖြစ်နေလို့ပါ။ T တစ်ခုတည်း ဆိုတာ field နှစ်ခုလုံးအတွက် type တစ်ခုတည်းလို့ ဆိုလိုတာပါ။
      [[mark:draw-two]] တကယ်ပဲ type နှစ်မျိုး လိုတယ်ဆိုရင်တော့၊ Point ကို placeholder နှစ်ခု
      ပေးလိုက်ပါ၊ ဥပမာအားဖြင့် T နဲ့ U ပါ။
    sources:
      - title: "The Rust Book — In Struct Definitions"
        url: "https://doc.rust-lang.org/book/ch10-01-syntax.html#in-struct-definitions"
      - title: "Rust error codes — E0308"
        url: "https://doc.rust-lang.org/error_codes/E0308.html"
    actions:
      - id: open-board-one-type
        type: whiteboard.apply
        at: { scene: start }
        open: true
        clear: true
        upsertIds: [b3-title]
      - id: draw-ok
        type: whiteboard.apply
        at: { mark: draw-ok }
        upsertIds: [b3-ints, b3-ints-arrow, b3-ints-t, b3-floats, b3-floats-arrow, b3-floats-t]
        drawMs: 3000
      - id: draw-mixed
        type: whiteboard.apply
        at: { mark: draw-mixed }
        upsertIds: [b3-mixed, b3-mixed-line, b3-mixed-arrow, b3-mixed-t]
        drawMs: 2200
      - id: draw-mixed-err
        type: whiteboard.apply
        at: { mark: draw-mixed-err }
        upsertIds: [b3-err1, b3-err2]
        drawMs: 2400
      - id: draw-two
        type: whiteboard.apply
        at: { mark: draw-two }
        upsertIds: [b3-two, b3-two-label]
        drawMs: 2000

  - id: run
    narration: >-
      code ဆီ ပြန်သွားရအောင်။ [[mark:run]] ကဲ၊ run ကြည့်ရအောင်။ အကြီးဆုံး ကိန်းဂဏန်းက 100 ဖြစ်ပြီး၊
      အကြီးဆုံး စာလုံးက y ပါ။ ပြီးတော့ integer Point က 5 နဲ့ 10၊ float Point ကတော့ 1.5 နဲ့ 2.5 ပါ။
    sources:
      - title: "The Rust Book — Generic Data Types"
        url: "https://doc.rust-lang.org/book/ch10-01-syntax.html"
    actions:
      - id: close-board-one-type
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "largest letter: y"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: "fn largest<T: PartialOrd>(list: &[T]) -> &T {"

  - id: wrap
    narration: >-
      ဒါဆို ပြန်ချုပ်ရရင်၊ generic တွေကြောင့် code ကို တစ်ကြိမ်တည်း ရေးပြီး type အများကြီးအတွက်
      သုံးလို့ ရပါတယ်။ PartialOrd လို trait bound တစ်ခုကတော့ T က ဘာတွေ လုပ်နိုင်ရမယ် ဆိုတာ
      ပြောပေးပါတယ်။ ပြီးတော့ compiler က ကိုယ် သုံးတဲ့ type တစ်ခုချင်းစီအတွက် မြန်ဆန်တဲ့ version
      တစ်ခုစီ တည်ဆောက်ပေးပါတယ်။ နောက် lesson မှာတော့ trait တွေ၊ ဆိုလိုတာက type အများကြီးက
      မျှဝေသုံးနိုင်တဲ့ စွမ်းရည်တွေကို ကိုယ်တိုင် ဘယ်လို သတ်မှတ်ပြီး၊ ကိုယ့် type တွေအတွက် ဘယ်လို
      implement လုပ်လဲ ဆိုတာကို ကြည့်သွားပါမယ်။
    sources:
      - title: "The Rust Book — Generic Types, Traits, and Lifetimes"
        url: "https://doc.rust-lang.org/book/ch10-00-generics.html"
      - title: "The Rust Book — Traits: Defining Shared Behavior"
        url: "https://doc.rust-lang.org/book/ch10-02-traits.html"
    actions: []

checks:
  # 500 (not 300): google-svg deck slides embed per-slide font data whose
  # paint briefly stalls the main thread at each show/close.
  - { type: timing.p95Ms, max: 500 }
