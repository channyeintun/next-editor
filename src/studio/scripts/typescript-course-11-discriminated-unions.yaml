scenes:
  - id: recall
    chapter: "Optional property တွေ စုထားရင်"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ unknown type ကို မသုံးခင် narrow လုပ်ရတယ် ဆိုတာနဲ့၊ never က
      ဘယ်တန်ဖိုးမှ ဝင်လို့ မရတဲ့ type ဖြစ်တယ် ဆိုတာ မြင်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ object တွေကို narrow
      လုပ်တဲ့အခါ အသုံးအများဆုံး ပုံစံ ဖြစ်တဲ့ discriminated union ကို ကြည့်သွားပါမယ်။
      [[mark:draw-statuses]] ဆိုင်ရဲ့ အော်ဒါမှာ ပါရမယ့် အချက်အလက်တွေက status ပေါ်မူတည်ပြီး ကွာပါတယ်။ ငွေ
      မရှင်းရသေးတဲ့ အော်ဒါမှာ ပစ္စည်းပဲ ပါပြီး၊ ငွေရှင်းပြီးသား အော်ဒါမှာ ငွေရှင်းခဲ့တဲ့ အချိန်၊ cancel
      လုပ်ထားတဲ့ အော်ဒါမှာတော့ cancel လုပ်ရတဲ့ အကြောင်းပြချက် ပါရပါတယ်။ [[mark:draw-bag]] ဒါကို type
      တစ်ခုတည်းနဲ့ ရေးရင်၊ ငွေရှင်းချိန်နဲ့ အကြောင်းပြချက်ကို မပါလည်း ရတဲ့ optional property အဖြစ်
      ထည့်ကြတာ များပါတယ်။ [[mark:draw-count]] ဒါပေမဲ့ ဒီ type က ဘာတွေကို ခွင့်ပြုလဲ တွက်ကြည့်ရအောင်။
      status က သုံးမျိုး၊ ငွေရှင်းချိန် ပါတာ မပါတာ နှစ်မျိုး၊ အကြောင်းပြချက်လည်း နှစ်မျိုး ဖြစ်လို့
      ပုံစံ ၁၂ မျိုးကို လက်ခံပါတယ်။ တကယ် အဓိပ္ပာယ် ရှိတာကတော့ သုံးမျိုးပဲ ရှိပါတယ်။ [[mark:draw-bad]]
      ကျန်တာတွေက ငွေရှင်းပြီးပေမယ့် အချိန် မပါတဲ့ အော်ဒါ၊ ငွေ မရှင်းရသေးပေမယ့် cancel အကြောင်းပြချက်
      ပါနေတဲ့ အော်ဒါလိုမျိုး၊ တကယ်တမ်း ဖြစ်လို့ မရတဲ့ ပုံစံတွေပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 5: Unions, Literals, and Narrowing (discriminated unions)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/unions-literals-and-narrowing",
        }
      - {
          title: "TypeScript Handbook: Narrowing (discriminated unions)",
          url: "https://www.typescriptlang.org/docs/handbook/2/narrowing.html#discriminated-unions",
        }
    actions:
      - id: open-board-a
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-statuses
        type: whiteboard.apply
        at: { mark: draw-statuses }
        upsertIds: [a-s1, a-ar1, a-d1, a-s2, a-ar2, a-d2, a-s3, a-ar3, a-d3]
        drawMs: 4000
      - id: draw-bag
        type: whiteboard.apply
        at: { mark: draw-bag }
        upsertIds: [a-bag]
        drawMs: 1400
      - id: draw-count
        type: whiteboard.apply
        at: { mark: draw-count }
        upsertIds: [a-count, a-sense]
        drawMs: 2400
      - id: draw-bad
        type: whiteboard.apply
        at: { mark: draw-bad }
        upsertIds: [a-bad1, a-bad2]
        drawMs: 2000

  - id: starter
    narration: >
      [[mark:close-board]] ဒီ type ကို code ထဲမှာ ကြည့်ရအောင်။ [[mark:open-order]] ဒါက အော်ဒါရဲ့ type
      နဲ့ status စာကို ထုတ်ပေးတဲ့ function ရေးထားတဲ့ ဖိုင်ပါ။ [[mark:select-optional]] ငွေရှင်းချိန်နဲ့
      အကြောင်းပြချက်ကို question mark နဲ့ optional လုပ်ထားတာ ခုနက ပုံထဲက အတိုင်းပါပဲ။
      [[mark:select-switch]] function ကတော့ switch statement နဲ့ status ကို စစ်ပြီး၊ status တစ်ခုစီအတွက်
      ပြရမယ့် စာကို ပြန်ပေးပါတယ်။ [[mark:select-slice]] ငွေရှင်းပြီးတဲ့ အော်ဒါဆိုရင် ငွေရှင်းချိန်ထဲက
      စက္ကန့်ကို ဖြတ်ပြီး၊ နာရီနဲ့ မိနစ်ကိုပဲ ပြပါတယ်။ [[mark:open-main]] main ဖိုင်မှာတော့ အော်ဒါ
      သုံးခုရဲ့ status စာကို ထုတ်ပြပါတယ်။ [[mark:select-coffee]] နောက်ဆုံး ကော်ဖီ အော်ဒါကို သတိထား
      ကြည့်ပါ။ ငွေရှင်းပြီးလို့ ရေးထားပေမယ့် ငွေရှင်းတဲ့ အချိန် မပါပါဘူး။ ခုနက ပုံထဲမှာ အနီရောင်နဲ့
      ပြခဲ့တဲ့ ဖြစ်လို့ မရတဲ့ ပုံစံ တစ်ခုပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 5: Unions, Literals, and Narrowing",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/unions-literals-and-narrowing",
        }
      - {
          title: "TypeScript Handbook: Object Types (optional properties)",
          url: "https://www.typescriptlang.org/docs/handbook/2/objects.html#optional-properties",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: open-order
        type: workspace.openFile
        at: { mark: open-order }
        path: src/order.ts
      - id: select-optional
        type: editor.select
        at: { mark: select-optional }
        target:
          { file: src/order.ts, text: "  paidAt?: string;\n  reason?: string;", occurrence: 1 }
      - id: select-switch
        type: editor.select
        at: { mark: select-switch }
        target: { file: src/order.ts, text: "switch (order.status)", occurrence: 1 }
      - id: select-slice
        type: editor.select
        at: { mark: select-slice }
        target: { file: src/order.ts, text: "order.paidAt.slice(0, 5)", occurrence: 1 }
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: src/main.ts
      - id: select-coffee
        type: editor.select
        at: { mark: select-coffee }
        target: { file: src/main.ts, text: '{ item: "ကော်ဖီ", status: "paid" }', occurrence: 1 }

  - id: symptoms
    narration: >
      [[mark:panel-ready]] panel ကို ကြည့်ရအောင်။ Output မှာ လက်ဖက်ရည်နဲ့ မုန့်ဟင်းခါး အော်ဒါတွေက
      မှန်မှန် ထွက်လာပေမယ့်၊ တတိယ line မှာ အနီရောင် error နဲ့ program ရပ်သွားပါတယ်။ ကော်ဖီမှာ
      ငွေရှင်းချိန် မရှိလို့ undefined ပေါ်မှာ စာသား ဖြတ်တဲ့ method ကို ခေါ်မိတာပါ။ [[mark:read-error]]
      Errors အပိုင်းမှာတော့ ငွေရှင်းပြီးတဲ့ case ထဲက ငွေရှင်းချိန်ဟာ undefined ဖြစ်နိုင်တယ်လို့
      ပြောနေပါတယ်။ [[mark:two-problems]] ဆိုတော့ ပြဿနာ နှစ်ခု ရှိနေပါတယ်။ ငွေရှင်းပြီးတဲ့ အော်ဒါမှာ
      အချိန် အမြဲ ပါတယ် ဆိုတာ TypeScript မသိလို့ မှန်နေတဲ့ code ကို error ပြနေပြီး၊ အချိန် မပါတဲ့ ကော်ဖီ
      အော်ဒါလို တကယ် မှားနေတဲ့ data ကိုကျတော့ ဘာမှ မပြောဘဲ လက်ခံထားပါတယ်။ အကြောင်းရင်းက တစ်ခုတည်းပါ။ ဘယ်
      property က ဘယ် status နဲ့ တွဲပါရမလဲ ဆိုတာ type ထဲမှာ ရေးမထားလို့ပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 5: Unions, Literals, and Narrowing (discriminated unions)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/unions-literals-and-narrowing",
        }
      - {
          title: "MDN: TypeError",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/TypeError",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-one-error
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-possibly-undefined
        type: expect.preview
        at: { afterAction: expect-one-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "'order.paidAt' is possibly 'undefined'."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-error-file
        type: expect.preview
        at: { afterAction: expect-possibly-undefined }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-file, value: "src/order.ts" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-tea-line
        type: expect.preview
        at: { afterAction: expect-error-file }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-1 }
        textContains: "လက်ဖက်ရည်: 09:30 မှာ ငွေရှင်းပြီး"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-crash
        type: expect.preview
        at: { afterAction: expect-tea-line }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-3 }
        textContains: "Uncaught TypeError: Cannot read properties of undefined (reading 'slice')"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-crash-level
        type: expect.preview
        at: { afterAction: expect-crash }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-3 }
        attribute: { name: data-level, value: "error" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: union-idea
    chapter: "Discriminated union"
    narration: >
      [[mark:board-union]] ဒါကို ဖြေရှင်းဖို့ property အားလုံးကို type တစ်ခုထဲ မစုဘဲ၊ status
      တစ်ခုစီအတွက် object type တစ်ခုစီ ခွဲရေးပါမယ်။ [[mark:draw-members]] ငွေရှင်းပြီးတဲ့ အော်ဒါမှာ
      ငွေရှင်းချိန်၊ cancel လုပ်ထားတဲ့ အော်ဒါမှာ အကြောင်းပြချက် ပါပြီး၊ ဘယ်ဟာမှ optional မဟုတ်တော့ပါဘူး။
      ပြီးတော့ အဲဒီ သုံးခုကို union နဲ့ ပေါင်းလိုက်ရင် Order type ရပါပြီ။ [[mark:draw-discriminant]]
      ဒီမှာ အရေးကြီးတာက status ပါ။ member တိုင်းမှာ ပါပြီး တစ်ခုစီမှာ literal type မတူတာ ရှိလို့၊ status
      ကို စစ်လိုက်တာနဲ့ ဘယ် member လဲ ဆိုတာ TypeScript က တန်းသိပါတယ်။ ဒီလို property ကို discriminant
      လို့ ခေါ်ပြီး၊ discriminant ပါတဲ့ union ကိုတော့ discriminated union လို့ ခေါ်ပါတယ်။
    sources:
      - {
          title: "TypeScript Handbook: Narrowing (discriminated unions, the discriminant property)",
          url: "https://www.typescriptlang.org/docs/handbook/2/narrowing.html#discriminated-unions",
        }
      - {
          title: "Total TypeScript Essentials, ch. 5: Unions, Literals, and Narrowing (discriminated unions)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/unions-literals-and-narrowing",
        }
    actions:
      - id: open-board-b
        type: whiteboard.apply
        at: { mark: board-union }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-members
        type: whiteboard.apply
        at: { mark: draw-members }
        upsertIds: [b-box1, b-s1, b-d1, b-or2, b-box2, b-s2, b-d2, b-or3, b-box3, b-s3, b-d3]
        drawMs: 4400
      - id: draw-discriminant
        type: whiteboard.apply
        at: { mark: draw-discriminant }
        upsertIds: [b-circle, b-disc, b-disc-sub]
        drawMs: 2800

  - id: union-code
    narration: >
      [[mark:close-board-b]] code ထဲမှာ ရေးကြည့်ရအောင်။ [[mark:open-order-2]] အော်ဒါ ဖိုင်ကို
      ပြန်ဖွင့်ပါမယ်။ [[mark:type-union]] Order type ကို member သုံးခု ပါတဲ့ union အဖြစ် ပြန်ရေးပြီး၊
      type အဟောင်းကိုတော့ နှိုင်းယှဉ်လို့ ရအောင် နာမည် ပြောင်းပြီး အောက်မှာ ချန်ထားပါမယ်။ တကယ့် project
      မှာဆိုရင်တော့ ဖျက်လိုက်ရုံပါပဲ။ [[mark:select-paid-member]] ငွေရှင်းပြီးတဲ့ member မှာ
      ငွေရှင်းချိန်က question mark မပါတော့လို့၊ ဒီ member ဖြစ်ရင် အချိန် အမြဲ ပါရပါမယ်။
      [[mark:read-union-panel]] panel မှာ function ထဲက error ပျောက်သွားပြီး၊ main ဖိုင်က ကော်ဖီ
      အော်ဒါမှာ error အသစ် ပေါ်လာပါပြီ။ အောက်ဆုံး အပိုင်းကို ဖတ်ကြည့်ရင်၊ ငွေရှင်းချိန် ပါရမယ့် member
      နဲ့ နှိုင်းယှဉ်ပြီး ငွေရှင်းချိန် မပါဘူးလို့ ပြောနေပါတယ်။ status ကို ကြည့်ပြီး ဘယ် member ဖြစ်ရမလဲ
      ဆိုတာ TypeScript က ရွေးလိုက်တာပါ။ [[mark:both-solved]] ဆိုတော့ မှန်တဲ့ code မှာ error မရှိတော့ဘဲ၊
      မှားနေတဲ့ data မှာ error ပေါ်လာပါပြီ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 5: Unions, Literals, and Narrowing (discriminated unions)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/unions-literals-and-narrowing",
        }
      - {
          title: "TypeScript Handbook: Everyday Types (union types)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#union-types",
        }
    actions:
      - id: close-board-b
        type: whiteboard.apply
        at: { mark: close-board-b }
        open: false
      - id: open-order-2
        type: workspace.openFile
        at: { mark: open-order-2 }
        path: src/order.ts
      - id: type-union
        type: editor.type
        at: { mark: type-union }
        target: { file: src/order.ts, after: "export type Order =", occurrence: 1 }
        text: "\n  | { status: \"pending\"; item: string }\n  | { status: \"paid\"; item: string; paidAt: string }\n  | { status: \"cancelled\"; item: string; reason: string };\n\ntype OrderBag ="
        cadence: block
      - id: expect-union-one-error
        type: expect.preview
        at: { afterAction: type-union }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-missing-paid-at
        type: expect.preview
        at: { afterAction: expect-union-one-error }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-1 }
        textContains: 'Property ''paidAt'' is missing in type ''{ item: string; status: "paid"; }'' but required in type ''{ status: "paid"; item: string; paidAt: string; }''.'
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-missing-file
        type: expect.preview
        at: { afterAction: expect-missing-paid-at }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-file, value: "src/main.ts" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: select-paid-member
        type: editor.select
        at: { mark: select-paid-member }
        target:
          {
            file: src/order.ts,
            text: '  | { status: "paid"; item: string; paidAt: string }',
            occurrence: 1,
          }

  - id: fix-order
    narration: >
      [[mark:open-main-2]] ဒါဆို main ဖိုင်က ကော်ဖီ အော်ဒါမှာ ငွေရှင်းတဲ့ အချိန်ကို ထည့်ပေးလိုက်ပါမယ်။
      [[mark:read-fixed]] Errors အပိုင်း ရှင်းသွားပြီး၊ Output ရဲ့ တတိယ line မှာလည်း ကော်ဖီကို ၉ နာရီ ၅၂
      မိနစ်မှာ ငွေရှင်းပြီးလို့ ပြနေပါပြီ။ run မှ ပေါ်မယ့် crash ကို code ရေးနေတုန်းမှာပဲ
      ဖမ်းမိသွားတာပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 5: Unions, Literals, and Narrowing (discriminated unions)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/unions-literals-and-narrowing",
        }
    actions:
      - id: open-main-2
        type: workspace.openFile
        at: { mark: open-main-2 }
        path: src/main.ts
      - id: type-paid-at
        type: editor.type
        at: { afterAction: open-main-2 }
        target: { file: src/main.ts, after: '{ item: "ကော်ဖီ", status: "paid"', occurrence: 1 }
        text: ', paidAt: "09:52:40"'
        cadence: fast-explainer
      - id: expect-fixed-no-errors
        type: expect.preview
        at: { afterAction: type-paid-at }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-coffee-line
        type: expect.preview
        at: { afterAction: expect-fixed-no-errors }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-3 }
        textContains: "ကော်ဖီ: 09:52 မှာ ငွေရှင်းပြီး"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: switch
    narration: >
      [[mark:open-order-3]] ဒါဆို function ထဲက error က ဘာကြောင့် ပျောက်သွားတာလဲ။
      [[mark:select-switch-2]] switch statement က status ကို စစ်ပြီး case တစ်ခုထဲ ဝင်သွားတဲ့အခါ၊
      TypeScript က အော်ဒါကို အဲဒီ status နဲ့ ကိုက်တဲ့ member တစ်ခုတည်းအထိ narrow လုပ်ပေးလို့ပါ။
      [[mark:type-query-paid]] ငွေရှင်းပြီးတဲ့ case ထဲမှာ အော်ဒါရဲ့ type ကို query comment နဲ့
      မေးကြည့်ရအောင်။ [[mark:read-query-paid]] Types အပိုင်းမှာ status က paid တစ်ခုတည်း ဖြစ်ပြီး၊
      ငွေရှင်းချိန်က string ဖြစ်နေတဲ့ member ကို ပြနေပါတယ်။ undefined ဖြစ်နိုင်ခြေ မရှိတော့လို့ စက္ကန့်
      ဖြတ်တဲ့ code ကို error မပြတော့တာပါ။
    sources:
      - {
          title: "TypeScript Handbook: Narrowing (discriminated unions with switch)",
          url: "https://www.typescriptlang.org/docs/handbook/2/narrowing.html#discriminated-unions",
        }
      - {
          title: "Total TypeScript Essentials, ch. 5: Unions, Literals, and Narrowing (narrowing with switch)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/unions-literals-and-narrowing",
        }
    actions:
      - id: open-order-3
        type: workspace.openFile
        at: { mark: open-order-3 }
        path: src/order.ts
      - id: select-switch-2
        type: editor.select
        at: { mark: select-switch-2 }
        target: { file: src/order.ts, text: "switch (order.status)", occurrence: 1 }
      - id: type-query-paid
        type: editor.type
        at: { mark: type-query-paid }
        target:
          {
            file: src/order.ts,
            after: "${order.paidAt.slice(0, 5)} မှာ ငွေရှင်းပြီး`;\n",
            occurrence: 1,
          }
        text: "      //        ^?\n"
        cadence: fast-explainer
      - id: expect-query-paid
        type: expect.preview
        at: { afterAction: type-query-paid }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        textContains: 'status: "paid";'
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-query-paid-at
        type: expect.preview
        at: { afterAction: expect-query-paid }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-1 }
        textContains: "paidAt: string;"
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: destructure
    chapter: "Destructure လုပ်မယ့် အချိန်"
    narration: >
      [[mark:open-main-3]] narrowing မှာ သတိထားရမယ့် အချက် တစ်ခု ရှိပါတယ်။ ငွေရှင်းပြီးတဲ့
      အော်ဒါတွေအတွက် ဘောင်ချာပါ ထုတ်ချင်တယ် ဆိုပါစို့။ [[mark:type-destructure]] object ထဲက property
      တွေကို variable တွေအဖြစ် တစ်ခါတည်း ဆွဲထုတ်တဲ့ destructuring ကို status မစစ်ရသေးခင် သုံးရင်
      ဘာဖြစ်မလဲ ဆိုတာ အရင် စမ်းကြည့်ရအောင်။ ပစ္စည်းနဲ့ ငွေရှင်းချိန်ကို ဆွဲထုတ်ပြီး ပြကြည့်ပါမယ်။ [[mark:read-destructure-error]] Order type မှာ ငွေရှင်းချိန် မရှိဘူး
      ဆိုတဲ့ error ပေါ်လာပါပြီ။ ဒီနေရာမှာ status ကို မစစ်ရသေးလို့ အော်ဒါက ဘယ် member မဆို ဖြစ်နိုင်ပြီး၊
      ငွေရှင်းချိန်က member တစ်ခုမှာပဲ ရှိလို့ပါ။ Output မှာလည်း မုန့်ဟင်းခါးအတွက် အချိန်နေရာမှာ
      undefined ပါတဲ့ ဘောင်ချာ ထွက်လာပါတယ်။ [[mark:type-guard]] ဒါကြောင့် destructure မလုပ်ခင် status
      ကို အရင် စစ်ပြီး၊ ငွေရှင်းပြီးသား မဟုတ်ရင် နောက် အော်ဒါကို ကျော်ခိုင်းပါမယ်။ [[mark:read-guard]]
      error ပျောက်သွားပြီး undefined ဘောင်ချာလည်း မရှိတော့ပါဘူး။ ဆိုတော့ member တချို့မှာပဲ ရှိတဲ့
      property ကို status စစ်ပြီးမှ ဆွဲထုတ်ရပါမယ်။ switch statement မှာဆိုရင်လည်း case ထဲ ရောက်ပြီးမှ
      destructure လုပ်ပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 5: Unions, Literals, and Narrowing (destructuring discriminated unions)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/unions-literals-and-narrowing",
        }
      - {
          title: "MDN: Destructuring",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Destructuring",
        }
      - {
          title: "TypeScript Handbook: Narrowing (control flow analysis)",
          url: "https://www.typescriptlang.org/docs/handbook/2/narrowing.html#control-flow-analysis",
        }
    actions:
      - id: open-main-3
        type: workspace.openFile
        at: { mark: open-main-3 }
        path: src/main.ts
      - id: type-destructure
        type: editor.type
        at: { mark: type-destructure }
        target: { file: src/main.ts, after: "  console.log(statusText(order));\n", occurrence: 1 }
        text: "  const { item, paidAt } = order;\n  console.log(\"ဘောင်ချာ\", item, paidAt);\n"
        cadence: line-by-line
      - id: expect-destructure-error
        type: expect.preview
        at: { afterAction: type-destructure }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-1 }
        textContains: "Property 'paidAt' does not exist on type 'Order'."
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-destructure-count
        type: expect.preview
        at: { afterAction: expect-destructure-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-undefined-receipt
        type: expect.preview
        at: { afterAction: expect-destructure-count }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-4 }
        textContains: "ဘောင်ချာ မုန့်ဟင်းခါး undefined"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-guard
        type: editor.type
        at: { mark: type-guard }
        target: { file: src/main.ts, after: "  console.log(statusText(order));\n", occurrence: 1 }
        text: "  if (order.status !== \"paid\") continue;\n"
        cadence: line-by-line
      - id: expect-guard-no-errors
        type: expect.preview
        at: { afterAction: type-guard }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-guard-output
        type: expect.preview
        at: { afterAction: expect-guard-no-errors }
        timeoutMs: 5000
        target: { by: testId, value: ts-output }
        attribute: { name: data-count, value: "5" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: tuple
    chapter: "Discriminated tuple"
    narration: >
      [[mark:type-find]] discriminant က tuple ရဲ့ ပထမ နေရာလည်း ဖြစ်နိုင်ပါတယ်။ အော်ဒါကို နံပါတ်နဲ့
      ရှာပေးတဲ့ function တစ်ခု ရေးပါမယ်။ သူ ပြန်ပေးတဲ့ type က tuple နှစ်မျိုးရဲ့ union ဖြစ်ပြီး၊ တွေ့ရင်
      ok နဲ့ အော်ဒါ၊ မတွေ့ရင် error နဲ့ message စာသား ပါပါတယ်။ [[mark:type-use]] ၅ နံပါတ် အော်ဒါကို
      ရှာပြီး၊ ရလာတဲ့ tuple ကို variable နှစ်ခုအဖြစ် destructure လုပ်ပါမယ်။ ပထမ တန်ဖိုးကို စစ်ပြီး ဒုတိယ
      တန်ဖိုးကို ထုတ်ပြမှာ ဖြစ်ပြီး၊ branch တစ်ခုစီမှာ query comment ထည့်ထားပါတယ်။ [[mark:read-tuple]]
      Types အပိုင်းမှာ ok branch ထဲက ဒုတိယ တန်ဖိုးကို Order လို့ ပြပြီး၊ else ထဲကကိုတော့ string လို့
      ပြနေပါတယ်။ ပထမ တန်ဖိုးကို စစ်လိုက်တာနဲ့ ဒုတိယ တန်ဖိုးပါ narrow ဖြစ်သွားတာပါ။ ခုနကလို error မတက်တာက
      tuple နှစ်မျိုးလုံးမှာ ဒုတိယ နေရာ ရှိနေလို့ပါ။ [[mark:read-tuple-output]] Output ရဲ့ နောက်ဆုံး
      line မှာလည်း ၅ နံပါတ် အော်ဒါ မရှိဘူး ဆိုတဲ့ message ထွက်လာပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 5: Unions, Literals, and Narrowing (discriminated tuples)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/unions-literals-and-narrowing",
        }
      - {
          title: "TypeScript 4.6 release notes: control-flow analysis for destructured discriminated unions",
          url: "https://www.typescriptlang.org/docs/handbook/release-notes/typescript-4-6.html#control-flow-analysis-for-destructured-discriminated-unions",
        }
      - {
          title: "TypeScript Handbook: Object Types (tuple types)",
          url: "https://www.typescriptlang.org/docs/handbook/2/objects.html#tuple-types",
        }
    actions:
      - id: type-find
        type: editor.type
        at: { mark: type-find }
        target:
          {
            file: src/main.ts,
            after: "  console.log(\"ဘောင်ချာ\", item, paidAt);\n}\n",
            occurrence: 1,
          }
        text: "\ntype FindResult = [\"ok\", Order] | [\"error\", string];\n\nfunction findOrder(index: number): FindResult {\n  const order = orders[index];\n  if (!order) return [\"error\", `${index} နံပါတ် အော်ဒါ မရှိပါ`];\n  return [\"ok\", order];\n}\n"
        cadence: block
      - id: select-find-result
        type: editor.select
        at: { afterAction: type-find }
        target: { file: src/main.ts, text: '["ok", Order] | ["error", string]', occurrence: 1 }
      - id: type-use
        type: editor.type
        at: { mark: type-use }
        target: { file: src/main.ts, after: "  return [\"ok\", order];\n}\n", occurrence: 1 }
        text: "\nconst [result, value] = findOrder(5);\nif (result === \"ok\") {\n  console.log(statusText(value));\n  //                     ^?\n} else {\n  console.log(value);\n  //          ^?\n}\n"
        cadence: block
      - id: expect-value-order
        type: expect.preview
        at: { afterAction: type-use }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-2 }
        attribute: { name: data-type, value: "const value: Order" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-value-string
        type: expect.preview
        at: { afterAction: expect-value-order }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-3 }
        attribute: { name: data-type, value: "const value: string" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-not-found
        type: expect.preview
        at: { afterAction: expect-value-string }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-6 }
        textContains: "5 နံပါတ် အော်ဒါ မရှိပါ"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: exhaustive
    chapter: "Status အသစ် ထပ်လာရင်"
    narration: >
      [[mark:open-order-4]] နောက်ဆုံးအနေနဲ့ ဆိုင်က status အသစ် ထပ်ထည့်တဲ့အခါ ဘာဖြစ်လဲ ကြည့်ရအောင်။
      [[mark:type-default]] အရင်ဆုံး switch statement မှာ default case ထည့်ပြီး၊ အော်ဒါကို never type
      ရှိတဲ့ variable ထဲ ထည့်ပါမယ်။ သူ့အောက်မှာ query comment လည်း ထည့်ထားပါတယ်။ [[mark:read-never]]
      Types အပိုင်းမှာ default ထဲက အော်ဒါကို never လို့ ပြနေပါတယ်။ အပေါ်က case သုံးခုက member
      သုံးခုလုံးကို ယူသွားပြီးလို့ ဘာမှ မကျန်တော့တာပါ။ never ထဲကို never ကလွဲရင် ဘာမှ ထည့်လို့ မရပေမယ့်၊
      ဒီနေရာက အော်ဒါကိုယ်တိုင် never ဖြစ်နေလို့ error မရှိပါဘူး။ [[mark:type-brewing]] ကဲ၊ ဖျော်နေဆဲ
      အော်ဒါကို ဘယ်သူ ဖျော်နေလဲ ဆိုတာနဲ့ မှတ်ချင်လို့၊ Order type ထဲကို member အသစ် တစ်ခု ထည့်ပါမယ်။
      [[mark:read-brewing]] ချက်ချင်းပဲ default မှာ error ပေါ်လာပါပြီ။ ဖျော်နေဆဲ member ကို never ထဲ
      ထည့်လို့ မရဘူးလို့ ပြောနေပြီး၊ Types မှာလည်း ဒီ member ကို ပြနေပါတယ်။ ဆိုလိုတာက ဒီ switch
      statement က status အသစ်ကို handle မလုပ်ရသေးဘူး ဆိုတာ program ကို run စရာ မလိုဘဲ သိရတာပါ။
      [[mark:type-case]] ဒါကြောင့် ဖျော်နေဆဲ အော်ဒါအတွက် case အသစ် ထည့်ပေးပါမယ်။ [[mark:read-case]]
      error ပျောက်ပြီး၊ default ထဲက type လည်း never ပြန်ဖြစ်သွားပါပြီ။ status အသစ် ထည့်တိုင်း ပြင်ရမယ့်
      နေရာတွေကို ဒီ စစ်ချက်က တစ်ခုမှ မကျန်အောင် ရှာပေးပါတယ်။
    sources:
      - {
          title: "TypeScript Handbook: Narrowing (the never type, exhaustiveness checking)",
          url: "https://www.typescriptlang.org/docs/handbook/2/narrowing.html#exhaustiveness-checking",
        }
      - {
          title: "Total TypeScript Essentials, ch. 5: Unions, Literals, and Narrowing (never)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/unions-literals-and-narrowing",
        }
    actions:
      - id: open-order-4
        type: workspace.openFile
        at: { mark: open-order-4 }
        path: src/order.ts
      - id: type-default
        type: editor.type
        at: { mark: type-default }
        target: { file: src/order.ts, after: "${order.reason}`;\n", occurrence: 1 }
        text: "    default:\n      const unhandled: never = order;\n      //                       ^?\n      return unhandled;\n"
        cadence: block
      - id: expect-never
        type: expect.preview
        at: { afterAction: type-default }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-2 }
        attribute: { name: data-type, value: "(parameter) order: never" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-never-no-errors
        type: expect.preview
        at: { afterAction: expect-never }
        timeoutMs: 5000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-brewing
        type: editor.type
        at: { mark: type-brewing }
        target:
          {
            file: src/order.ts,
            after: '  | { status: "cancelled"; item: string; reason: string }',
            occurrence: 1,
          }
        text: "\n  | { status: \"brewing\"; item: string; barista: string }"
        cadence: line-by-line
      - id: expect-brewing-error
        type: expect.preview
        at: { afterAction: type-brewing }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-1 }
        textContains: 'Type ''{ status: "brewing"; item: string; barista: string; }'' is not assignable to type ''never''.'
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-brewing-count
        type: expect.preview
        at: { afterAction: expect-brewing-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-brewing-query
        type: expect.preview
        at: { afterAction: expect-brewing-count }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-2 }
        textContains: 'status: "brewing";'
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-case
        type: editor.type
        at: { mark: type-case }
        target: { file: src/order.ts, after: "${order.reason}`;\n", occurrence: 1 }
        text: "    case \"brewing\":\n      return `${order.item}: ${order.barista} ဖျော်နေဆဲ`;\n"
        cadence: line-by-line
      - id: expect-case-no-errors
        type: expect.preview
        at: { afterAction: type-case }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-never-again
        type: expect.preview
        at: { afterAction: expect-case-no-errors }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-2 }
        attribute: { name: data-type, value: "(parameter) order: never" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: recap
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ optional property တွေကို type တစ်ခုထဲ စုထားရင် ဖြစ်လို့ မရတဲ့
      data ကို လက်ခံပြီး၊ မှန်တဲ့ code ကိုတော့ error ပြတတ်ပါတယ်။ status တစ်ခုစီအတွက် member တစ်ခုစီ
      ခွဲရေးပြီး literal type ရှိတဲ့ status နဲ့ ခွဲထားရင်၊ case တိုင်းမှာ TypeScript က မှန်တဲ့ member
      ကို narrow လုပ်ပေးပါတယ်။ [[mark:recap-rules]] member တချို့မှာပဲ ရှိတဲ့ property ကို status
      စစ်ပြီးမှ destructure လုပ်ရပြီး၊ tuple မှာတော့ ပထမ နေရာကို discriminant အဖြစ် သုံးနိုင်ပါတယ်။
      default ထဲက never စစ်ချက်ကတော့ status အသစ်အတွက် ကျန်ခဲ့တဲ့ နေရာကို ပြပေးပါတယ်။ နောက် lesson
      မှာတော့ object type တွေကို ပေါင်းပြီး ချဲ့ထွင်ပေးတဲ့ interface နဲ့ intersection ကို
      ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 5: Unions, Literals, and Narrowing",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/unions-literals-and-narrowing",
        }
      - {
          title: "TypeScript Handbook: Narrowing",
          url: "https://www.typescriptlang.org/docs/handbook/2/narrowing.html",
        }
    actions:
      - id: select-union-recap
        type: editor.select
        at: { mark: recap }
        target:
          {
            file: src/order.ts,
            text: "  | { status: \"pending\"; item: string }\n  | { status: \"paid\"; item: string; paidAt: string }\n  | { status: \"cancelled\"; item: string; reason: string }\n  | { status: \"brewing\"; item: string; barista: string };",
            occurrence: 1,
          }
      - id: select-never-recap
        type: editor.select
        at: { mark: recap-rules }
        target: { file: src/order.ts, text: "const unhandled: never = order;", occurrence: 1 }
      - id: expect-file-union
        type: expect.file
        at: { afterAction: select-union-recap }
        path: src/order.ts
        contains: "export type Order =\n  | { status: \"pending\"; item: string }\n  | { status: \"paid\"; item: string; paidAt: string }\n  | { status: \"cancelled\"; item: string; reason: string }\n  | { status: \"brewing\"; item: string; barista: string };\n\ntype OrderBag = {"
      - id: expect-file-never
        type: expect.file
        at: { afterAction: expect-file-union }
        path: src/order.ts
        contains: "    case \"brewing\":\n      return `${order.item}: ${order.barista} ဖျော်နေဆဲ`;\n    default:\n      const unhandled: never = order;"
      - id: expect-file-guard
        type: expect.file
        at: { afterAction: expect-file-never }
        path: src/main.ts
        contains: "  if (order.status !== \"paid\") continue;\n  const { item, paidAt } = order;"
      - id: expect-file-tuple
        type: expect.file
        at: { afterAction: expect-file-guard }
        path: src/main.ts
        contains: 'type FindResult = ["ok", Order] | ["error", string];'
      - id: expect-file-tuple-use
        type: expect.file
        at: { afterAction: expect-file-tuple }
        path: src/main.ts
        contains: "if (result === \"ok\") {\n  console.log(statusText(value));\n"
checks:
  - { type: timing.p95Ms, max: 300 }
