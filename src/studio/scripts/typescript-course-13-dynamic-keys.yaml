build:
  # Studio replaces this built-in profile at render time with the Burmese provider chosen in the
  # render console (AthanLab with the user's own key, or VoxCPM2 when that feature is enabled).
  voiceProfile: pocket-alba-v1
  seed: 3113
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "Key ကို ကြိုမသိတဲ့ object"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ interface နဲ့ intersection ကို သုံးပြီး၊ property နာမည်တွေကို
      ကြိုသိထားတဲ့ object တွေကို type ပေးခဲ့ပါတယ်။ ဒီ lesson မှာတော့ key တွေကို code ရေးနေတဲ့ အချိန်မှာ
      ကြိုမသိနိုင်တဲ့ object တွေကို type ဘယ်လို ပေးရမလဲ ဆိုတာ ကြည့်သွားပါမယ်။ [[mark:draw-known]] အော်ဒါ
      တစ်ခုမှာ ဘာ property တွေ ပါမလဲ ဆိုတာကို code ရေးကတည်းက သိပါတယ်။ ဒါကြောင့် property တစ်ခုချင်းစီကို နာမည်နဲ့ ရေးပြီး type ပေးလို့ ရပါတယ်။
      [[mark:draw-stock]] ဒါပေမဲ့ ဆိုင်ရဲ့ လက်ကျန် စာရင်းကို စဉ်းစားကြည့်ပါ။ ပစ္စည်း တစ်မျိုးစီ ဘယ်နှစ်ခု
      ကျန်သေးလဲ ဆိုတာကို၊ ပစ္စည်း နာမည်ကို key လုပ်ပြီး object တစ်ခုထဲမှာ မှတ်ထားချင်တယ် ဆိုပါစို့။ ဆိုင်က
      ပစ္စည်း အသစ် ရောင်းတိုင်း key အသစ် တိုးလာမှာ ဖြစ်လို့၊ ဘယ် key တွေ ရှိမလဲ ဆိုတာကို program run နေတဲ့
      အချိန်ကျမှပဲ သိရပါတယ်။ [[mark:draw-rule]] ဒီလို object အတွက် ကိုယ် ပြောနိုင်တာက key တစ်ခုချင်းရဲ့
      နာမည် မဟုတ်ဘဲ၊ key တိုင်းက string ဖြစ်ပြီး value တိုင်းက number ဖြစ်တယ် ဆိုတဲ့ စည်းကမ်း တစ်ခုပဲ
      ဖြစ်ပါတယ်။ 
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 6: Objects (dynamic object keys)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/objects",
        }
      - {
          title: "TypeScript Handbook: Object Types (index signatures)",
          url: "https://www.typescriptlang.org/docs/handbook/2/objects.html#index-signatures",
        }
    actions:
      - id: open-board-a
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-known
        type: whiteboard.apply
        at: { mark: draw-known }
        upsertIds: [a-known-box, a-known-label, a-known-r1, a-known-r2, a-known-r3]
        drawMs: 2400
      - id: draw-stock
        type: whiteboard.apply
        at: { mark: draw-stock }
        upsertIds: [a-dyn-box, a-dyn-label, a-dyn-r1, a-dyn-r2, a-dyn-r3]
        drawMs: 3000
      - id: draw-rule
        type: whiteboard.apply
        at: { mark: draw-rule }
        upsertIds: [a-rule]
        drawMs: 1600

  - id: starter
    narration: >
      [[mark:close-board]] ဒီနေ့ code ကို ကြည့်ရအောင်။ [[mark:open-stock]] ဒါက လက်ကျန် စာရင်းကို
      မှတ်ထားတဲ့ ဖိုင်ပါ။ [[mark:select-empty]] စာရင်းကို object အလွတ် တစ်ခုနဲ့ စထားပါတယ်။
      [[mark:select-add]] ပစ္စည်း ရောက်လာတဲ့အခါ ဒီ function က ပစ္စည်း နာမည်ကို key အဖြစ် သုံးပြီး
      အရေအတွက်ကို object ထဲ ထည့်ပေးပါတယ်။ key က parameter ကနေ ဝင်လာလို့ ဘယ် နာမည် ဖြစ်မလဲ ကြိုမသိပါဘူး။ [[mark:select-read]] အောက်က function ကတော့ ပစ္စည်း နာမည်
      ပေးလိုက်ရင် ကျန်တဲ့ အရေအတွက်ကို ပြန်ဖတ်ပေးပါတယ်။ [[mark:open-cups]] ဒုတိယ ဖိုင်မှာတော့
      ခွက်အရွယ် အလိုက် ထပ်ပေါင်းရမယ့် ငွေကို object တစ်ခုနဲ့ ရေးထားပါတယ်။ [[mark:select-cupsize]]
      အပေါ်ဆုံးမှာ ခွက်အရွယ် နှစ်မျိုးကို union type နဲ့ သတ်မှတ်ထားပေမယ့်၊ အောက်က object က အဲဒီ type ကို
      မသုံးသေးပါဘူး။ [[mark:open-main]] main ဖိုင်ကတော့ လက်ဖက်ရည် ၄၀ ခွက်နဲ့ ပလာတာ ၁၂ ချပ်ကို
      စာရင်းထဲ ထည့်ပြီး၊ လက်ကျန် အရေအတွက်တွေကို ထုတ်ပြပါတယ်။ [[mark:select-cup-log]] နောက်ဆုံး line
      ကတော့ ခွက်ကြီး ယူရင် ထပ်ပေါင်းရမယ့် ငွေကို ထုတ်ပြပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 6: Objects (dynamic object keys)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/objects",
        }
      - {
          title: "TypeScript Handbook: Everyday Types (union types)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#union-types",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: open-stock
        type: workspace.openFile
        at: { mark: open-stock }
        path: src/stock.ts
      - id: select-empty
        type: editor.select
        at: { mark: select-empty }
        target: { file: src/stock.ts, text: "const stock = {};", occurrence: 1 }
      - id: select-add
        type: editor.select
        at: { mark: select-add }
        target: { file: src/stock.ts, text: "stock[item] = count;", occurrence: 1 }
      - id: select-read
        type: editor.select
        at: { mark: select-read }
        target: { file: src/stock.ts, text: "return stock[item];", occurrence: 1 }
      - id: open-cups
        type: workspace.openFile
        at: { mark: open-cups }
        path: src/cups.ts
      - id: select-cupsize
        type: editor.select
        at: { mark: select-cupsize }
        target: { file: src/cups.ts, text: 'type CupSize = "small" | "large";', occurrence: 1 }
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: src/main.ts
      - id: select-adds
        type: editor.select
        at: { afterAction: open-main }
        target:
          {
            file: src/main.ts,
            text: "addStock(\"tea\", 40);\naddStock(\"palata\", 12);",
            occurrence: 1,
          }
      - id: select-cup-log
        type: editor.select
        at: { mark: select-cup-log }
        target:
          {
            file: src/main.ts,
            text: 'console.log("ခွက်ကြီး ထပ်ပေါင်း", cupExtra.large, "ကျပ်");',
            occurrence: 1,
          }

  - id: symptoms
    narration: >
      [[mark:panel-ready]] ညာဘက် panel ရဲ့ Output ကို အရင် ကြည့်ပါ။ လက်ဖက်ရည် ၄၀ ခွက်နဲ့ ပလာတာ ၁၂ ချပ်
      ဆိုပြီး မှန်မှန်ကန်ကန် ထွက်နေပါတယ်။ JavaScript မှာ object တစ်ခုထဲကို key အသစ် ဘယ်အချိန်မဆို ထည့်လို့
      ရလို့ပါ။ [[mark:read-errors]] ဒါပေမဲ့ Errors အပိုင်းမှာ လက်ကျန် ဖိုင်ထဲက error နှစ်ခု ပေါ်နေပါတယ်။
      object အလွတ်ကို ကြေညာလိုက်တဲ့အခါ၊ TypeScript က သူ့ type ကို property တစ်ခုမှ မရှိတဲ့ object လို့
      infer လုပ်လိုက်ပါတယ်။ ဒါကြောင့် string တစ်ခုခုကို key အဖြစ် သုံးပြီး ဒီ object ထဲ ထည့်တာ၊
      ပြန်ဖတ်တာကို လက်မခံဘဲ၊ index signature မရှိဘူးလို့ ပြောနေတာပါ။
      [[mark:read-undefined]] Output ရဲ့ နောက်ဆုံး line ကိုလည်း ကြည့်ပါ။ ခွက်ကြီးအတွက်
      ထပ်ပေါင်းရမယ့် ငွေက undefined ဖြစ်နေပေမယ့်၊ ဒီ ပြဿနာအတွက်တော့ error တစ်ခုမှ မပြပါဘူး။ ဆိုတော့
      TypeScript က အလုပ်လုပ်နေတဲ့ code ကို ငြင်းပြီး၊ မှားနေတဲ့ code ကိုတော့ ဘာမှ မပြောတာ ဖြစ်နေပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 6: Objects (dynamic key support)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/objects",
        }
      - {
          title: "TypeScript Handbook: Object Types (index signatures)",
          url: "https://www.typescriptlang.org/docs/handbook/2/objects.html#index-signatures",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-two-errors
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-code-add
        type: expect.preview
        at: { afterAction: expect-two-errors }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-code, value: "7053" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-code-read
        type: expect.preview
        at: { afterAction: expect-code-add }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-2 }
        attribute: { name: data-code, value: "7053" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-no-signature
        type: expect.preview
        at: { afterAction: expect-code-read }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "No index signature with a parameter of type 'string' was found on type '{}'."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-tea-40
        type: expect.preview
        at: { afterAction: expect-no-signature }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-1 }
        textContains: "လက်ဖက်ရည် 40 ခွက်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-palata-12
        type: expect.preview
        at: { afterAction: expect-tea-40 }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-2 }
        textContains: "ပလာတာ 12 ချပ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-undefined
        type: expect.preview
        at: { afterAction: expect-palata-12 }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-3 }
        textContains: "ခွက်ကြီး ထပ်ပေါင်း undefined ကျပ်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: index-signature
    chapter: "Index signature"
    narration: >
      [[mark:open-stock-2]] လက်ကျန် ဖိုင်ကို ပြန်သွားရအောင်။ [[mark:type-query]] ပြန်ဖတ်ပေးတဲ့ function က
      ဘာ type ကို ပြန်ပေးလဲ သိချင်လို့၊ သူ့ နာမည်ရဲ့ အောက်မှာ query comment တစ်ကြောင်း ထည့်ပါမယ်။
      [[mark:read-any]] Types အပိုင်းမှာ ဒီ function က any type ကို ပြန်ပေးတယ်လို့ ပြနေပါတယ်။ ဒီ key နဲ့ ဘာ တန်ဖိုး ပြန်ရမလဲ ဆိုတာ TypeScript မသိလို့ any ဖြစ်သွားတာပါ။ [[mark:type-alias]] အခု လက်ကျန် စာရင်းအတွက် type alias တစ်ခု ရေးပါမယ်။
      [[mark:select-signature]] ဒီ အပိုင်းကို index signature လို့ ခေါ်ပါတယ်။ ဆိုလိုတာက ဒီ object မှာ ဘယ်
      string ကိုမဆို key အဖြစ် သုံးလို့ ရပြီး၊ value တိုင်းကတော့ number ဖြစ်ရမယ် ဆိုတာပါ။ ကွင်းထဲက item
      ဆိုတဲ့ နာမည်က ဖတ်တဲ့သူ နားလည်အောင် ပေးထားတဲ့ label သက်သက် ဖြစ်လို့၊ ဘာ နာမည် ပေးပေး အဓိပ္ပာယ်
      မပြောင်းပါဘူး။ [[mark:type-annotation]] ပြီးတော့ object အလွတ်ကို ဒီ type နဲ့ ကြေညာလိုက်ပါမယ်။
      [[mark:read-fixed]] error နှစ်ခုလုံး ပျောက်သွားပြီး၊ Types မှာလည်း ပြန်ပေးတဲ့ type က any ကနေ number
      ဖြစ်သွားပါပြီ။ [[mark:caveat]] တစ်ခု သတိထားရမှာက၊ စာရင်းထဲ မရှိတဲ့ ပစ္စည်းကို ဖတ်ရင်လည်း TypeScript က number လို့ပဲ ယူဆပေမယ့်၊ run လိုက်တဲ့ အချိန်မှာတော့ undefined ရမှာပါ။ ဒါကို စစ်ပေးတဲ့ tsconfig option ကို နောက်ပိုင်း lesson တစ်ခုမှာ ကြည့်ပါမယ်။
    sources:
      - {
          title: "TypeScript Handbook: Object Types (index signatures)",
          url: "https://www.typescriptlang.org/docs/handbook/2/objects.html#index-signatures",
        }
      - {
          title: "Total TypeScript Essentials, ch. 6: Objects (index signatures for dynamic keys)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/objects",
        }
      - {
          title: "TSConfig reference: noUncheckedIndexedAccess",
          url: "https://www.typescriptlang.org/tsconfig/#noUncheckedIndexedAccess",
        }
    actions:
      - id: open-stock-2
        type: workspace.openFile
        at: { mark: open-stock-2 }
        path: src/stock.ts
      - id: type-query
        type: editor.type
        at: { mark: type-query }
        target:
          { file: src/stock.ts, after: "export function stockOf(item: string) {\n", occurrence: 1 }
        text: "//              ^?\n"
        cadence: fast-explainer
      - id: expect-any
        type: expect.preview
        at: { afterAction: type-query }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        attribute: { name: data-type, value: "function stockOf(item: string): any" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-alias
        type: editor.type
        at: { mark: type-alias }
        target: { file: src/stock.ts, after: "ဘယ်နှစ်ခု ကျန်လဲ\n", occurrence: 1 }
        text: "type Stock = {\n  [item: string]: number;\n};\n\n"
        cadence: line-by-line
      - id: select-signature
        type: editor.select
        at: { mark: select-signature }
        target: { file: src/stock.ts, text: "[item: string]: number;", occurrence: 1 }
      - id: type-annotation
        type: editor.type
        at: { mark: type-annotation }
        target: { file: src/stock.ts, after: "const stock", occurrence: 1 }
        text: ": Stock"
      - id: expect-fixed
        type: expect.preview
        at: { afterAction: type-annotation }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-number
        type: expect.preview
        at: { afterAction: expect-fixed }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-1 }
        attribute: { name: data-type, value: "function stockOf(item: string): number" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: known-keys
    narration: >
      တချို့ object တွေမှာ အမြဲ ရှိရမယ့် key တွေနဲ့ နောက်မှ ဝင်လာမယ့် key တွေ ရောနေတတ်ပါတယ်။
      ဥပမာအားဖြင့်၊ လက်ဖက်ရည်နဲ့ ကော်ဖီကို ဆိုင်က နေ့တိုင်း ရောင်းတဲ့အတွက် စာရင်းထဲမှာ အမြဲ
      ရှိနေရပါမယ်။ [[mark:type-known]] ဒါကြောင့် အဲဒီ key နှစ်ခုကို index signature ရဲ့ အပေါ်မှာ
      နာမည်နဲ့ ရေးထည့်ပါမယ်။ [[mark:read-missing]] ချက်ချင်း error တစ်ခု ပေါ်လာပါပြီ။ object အလွတ်မှာ
      လက်ဖက်ရည်နဲ့ ကော်ဖီ key တွေ မပါဘူးလို့ ပြောနေတာပါ။ ဆိုလိုတာက နာမည်နဲ့ ရေးထားတဲ့ key နှစ်ခုကို
      မဖြစ်မနေ ရှိရမယ့် property အဖြစ် စစ်ပေးပြီး၊ ကျန်တဲ့ key တွေကိုတော့ index signature နဲ့ ဆက်ပြီး
      လက်ခံနေတာပါ။ [[mark:type-known-values]] စာရင်း စကတည်းက နှစ်ခုလုံးကို သုည နဲ့ ထည့်ထားပေးပါမယ်။
      [[mark:read-known-fixed]] error ပျောက်သွားပါပြီ။ ဒီလို ရောရေးတဲ့အခါ နာမည်နဲ့ ရေးတဲ့ key တွေရဲ့ type ကလည်း index signature ရဲ့ value type နဲ့ ကိုက်ရပါတယ်။
    sources:
      - {
          title: "TypeScript Handbook: Object Types (index signatures with other properties)",
          url: "https://www.typescriptlang.org/docs/handbook/2/objects.html#index-signatures",
        }
      - {
          title: "Total TypeScript Essentials, ch. 6: Objects (default properties with dynamic keys)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/objects",
        }
    actions:
      - id: type-known
        type: editor.type
        at: { mark: type-known }
        target: { file: src/stock.ts, after: "type Stock = {\n", occurrence: 1 }
        text: "  tea: number;\n  coffee: number;\n"
        cadence: line-by-line
      - id: expect-missing
        type: expect.preview
        at: { afterAction: type-known }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-missing-text
        type: expect.preview
        at: { afterAction: expect-missing }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Type '{}' is missing the following properties from type 'Stock': tea, coffee"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-known-values
        type: editor.type
        at: { mark: type-known-values }
        target: { file: src/stock.ts, after: "const stock: Stock = {", occurrence: 1 }
        text: " tea: 0, coffee: 0 "
        cadence: fast-explainer
      - id: expect-known-fixed
        type: expect.preview
        at: { afterAction: type-known-values }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: record
    chapter: "Record နဲ့ union key"
    narration: >
      [[mark:board-record]] index signature ကို ပိုတိုတဲ့ ပုံစံနဲ့လည်း ရေးလို့ ရပါတယ်။ [[mark:draw-record]]
      TypeScript မှာ ပါပြီးသား Record ဆိုတဲ့ type ကို သုံးတာပါ။ Record ကို type နှစ်ခု ထည့်ပေးရပါတယ်။ ပထမ
      တစ်ခုက key တွေရဲ့ type ဖြစ်ပြီး၊ ဒုတိယ တစ်ခုက value တွေရဲ့ type ပါ။ ဆိုတော့ key အတွက် string ကို၊
      value အတွက် number ကို ပေးလိုက်ရင် ခုနက index signature နဲ့ အတူတူပါပဲ။ [[mark:draw-union-key]] Record
      ရဲ့ အားသာချက်က key နေရာမှာ string လို ကျယ်တဲ့ type အစား၊ literal type တွေရဲ့ union ကိုလည်း ပေးလို့
      ရတာပါ။ အဲဒီအခါ union ထဲက key တွေပဲ ရှိခွင့် ရပြီး၊ တစ်ခုမှလည်း ကျန်ခဲ့လို့ မရပါဘူး။
      [[mark:draw-no-literal]] index signature ရဲ့ key နေရာမှာတော့ ဒီလို literal union ကို ထည့်ခွင့်
      မရှိပါဘူး။ ဒါကြောင့် key တွေကို တိတိကျကျ ကန့်သတ်ချင်ရင် Record ကို သုံးရပါတယ်။
    sources:
      - {
          title: "TypeScript Handbook: Utility Types (Record<Keys, Type>)",
          url: "https://www.typescriptlang.org/docs/handbook/utility-types.html#recordkeys-type",
        }
      - {
          title: "Total TypeScript Essentials, ch. 6: Objects (the Record type, restricting keys)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/objects",
        }
    actions:
      - id: board-record
        type: whiteboard.apply
        at: { mark: board-record }
        open: true
        clear: true
        upsertIds: [b-title, b-sig]
      - id: draw-record
        type: whiteboard.apply
        at: { mark: draw-record }
        upsertIds: [b-eq, b-rec, b-parts]
        drawMs: 3000
      - id: draw-union-key
        type: whiteboard.apply
        at: { mark: draw-union-key }
        upsertIds: [b-union, b-union-note]
        drawMs: 2400
      - id: draw-no-literal
        type: whiteboard.apply
        at: { mark: draw-no-literal }
        upsertIds: [b-no-literal]
        drawMs: 1400

  - id: union-keys
    narration: >
      [[mark:close-record]] ခွက်အရွယ် ဖိုင်မှာ စမ်းကြည့်ရအောင်။ [[mark:open-cups-2]] ဒီ object ကို Record
      နဲ့ ကြေညာထားတာ မြင်ရပါတယ်။ [[mark:select-record-string]] key ကို string လို့ ပေးထားတဲ့အတွက် ဘယ်
      key မဆို လက်ခံပါတယ်။ [[mark:select-typo]] ဒါကြောင့် ခွက်ကြီးရဲ့ key မှာ စာလုံး တစ်လုံး ကျနေပေမယ့်
      TypeScript က ဘာမှ မပြောပါဘူး။ main ဖိုင်က မှန်တဲ့ နာမည်နဲ့ ဖတ်တော့ undefined ရနေတာပါ။
      [[mark:type-union-record]] အဲဒါကို ပြင်ဖို့ key နေရာမှာ အပေါ်က ခွက်အရွယ် union ကို သုံးတဲ့ line အသစ်
      ရေးပြီး၊ line အဟောင်းကိုတော့ comment လုပ်ပြီး ပိတ်ထားပါမယ်။ [[mark:read-typo-error]] Errors
      မှာ ဒီ key က Record ထဲမှာ မရှိဘူး၊ large လို့ ရေးချင်တာလား လို့ အကြံပေးနေပါပြီ။
      [[mark:type-typo-fix]] ကျနေတဲ့ စာလုံးကို ထည့်လိုက်ပါမယ်။ [[mark:read-300]] error ပျောက်သွားပြီး၊
      Output မှာ ခွက်ကြီးအတွက် ၃၀၀ ကျပ် ပေါ်လာပါပြီ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 6: Objects (restricting object keys with Record)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/objects",
        }
      - {
          title: "TypeScript Handbook: Object Types (excess property checks)",
          url: "https://www.typescriptlang.org/docs/handbook/2/objects.html#excess-property-checks",
        }
    actions:
      - id: close-record
        type: whiteboard.apply
        at: { mark: close-record }
        open: false
      - id: open-cups-2
        type: workspace.openFile
        at: { mark: open-cups-2 }
        path: src/cups.ts
      - id: select-record-string
        type: editor.select
        at: { mark: select-record-string }
        target: { file: src/cups.ts, text: "Record<string, number>", occurrence: 1 }
      - id: select-typo
        type: editor.select
        at: { mark: select-typo }
        target: { file: src/cups.ts, text: "larg", occurrence: 1 }
      - id: type-union-record
        type: editor.type
        at: { mark: type-union-record }
        target: { file: src/cups.ts, after: "ထပ်ပေါင်းရမယ့် ငွေ\n", occurrence: 1 }
        text: "export const cupExtra: Record<CupSize, number> = {\n// "
        cadence: block
      - id: expect-typo-error
        type: expect.preview
        at: { afterAction: type-union-record }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-did-you-mean
        type: expect.preview
        at: { afterAction: expect-typo-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "'larg' does not exist in type 'Record<CupSize, number>'. Did you mean to write 'large'?"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-typo-fix
        type: editor.type
        at: { mark: type-typo-fix }
        target: { file: src/cups.ts, after: "  larg", occurrence: 1 }
        text: "e"
      - id: expect-typo-fixed
        type: expect.preview
        at: { afterAction: type-typo-fix }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-300
        type: expect.preview
        at: { afterAction: expect-typo-fixed }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-3 }
        textContains: "ခွက်ကြီး ထပ်ပေါင်း 300 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: every-key
    narration: >
      ဆိုင်က ခွက်လတ် ဆိုတဲ့ အရွယ် အသစ် တစ်မျိုး ထပ်ရောင်းမယ် ဆိုပါစို့။ [[mark:type-medium]] ခွက်အရွယ် union ထဲကို medium ဆိုတဲ့ အရွယ်ကို ထည့်လိုက်ပါမယ်။
      [[mark:read-medium-error]] ချက်ချင်း error တစ်ခု ပေါ်လာပါတယ်။ object ထဲမှာ medium အတွက် ငွေ
      မပါသေးဘူးလို့ ပြောနေတာပါ။ union key နဲ့ Record ကို သုံးထားရင်၊ အရွယ် အသစ် တစ်ခု ထည့်လိုက်တိုင်း
      ပြင်ရမယ့် နေရာတွေကို TypeScript က လိုက်ပြပေးပါတယ်။ [[mark:type-medium-value]] ခွက်လတ်အတွက် ၂၀၀ ကျပ်
      ထည့်ပေးလိုက်ပါမယ်။ [[mark:read-medium-fixed]] Errors အပိုင်း ရှင်းသွားပါပြီ။
    sources:
      - {
          title: "TypeScript Handbook: Utility Types (Record<Keys, Type>)",
          url: "https://www.typescriptlang.org/docs/handbook/utility-types.html#recordkeys-type",
        }
      - {
          title: "Total TypeScript Essentials, ch. 6: Objects (restricting object keys with Record)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/objects",
        }
    actions:
      - id: type-medium
        type: editor.type
        at: { mark: type-medium }
        target: { file: src/cups.ts, after: '"small" | "large"', occurrence: 1 }
        text: ' | "medium"'
        cadence: fast-explainer
      - id: expect-medium-error
        type: expect.preview
        at: { afterAction: type-medium }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-medium-missing
        type: expect.preview
        at: { afterAction: expect-medium-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Property 'medium' is missing in type"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-medium-value
        type: editor.type
        at: { mark: type-medium-value }
        target: { file: src/cups.ts, after: "  small: 0,\n", occurrence: 1 }
        text: "  medium: 200,\n"
        cadence: fast-explainer
      - id: expect-medium-fixed
        type: expect.preview
        at: { afterAction: type-medium-value }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: property-key
    chapter: "PropertyKey နဲ့ object type"
    narration: >
      [[mark:open-main-2]] နောက်ဆုံးအနေနဲ့ main ဖိုင်မှာ၊ object တစ်ခုထဲမှာ key တစ်ခု ပါလား စစ်ပေးတဲ့
      function တစ်ခု ရေးကြည့်ရအောင်။ [[mark:type-is-listed]] function ထဲမှာ key ပါမပါကို in operator နဲ့ စစ်ပါတယ်။
      ဒီ function ကို ခွက်အရွယ်လို string key တွေနဲ့ရော၊ စားပွဲ နံပါတ်လို number key တွေနဲ့ပါ သုံးချင်လို့၊
      key ကို string လို့ မကြေညာဘဲ PropertyKey လို့ ကြေညာထားပါတယ်။ အောက်ဆုံးမှာတော့ ခွက်လတ် ပါလား၊
      စားပွဲ ငါးမှာ customer ရှိလား ဆိုပြီး စစ်ကြည့်ထားပါတယ်။ [[mark:type-pk-query]] PropertyKey ဆိုတာ ဘာလဲ
      ဆိုတာ query comment နဲ့ မေးကြည့်ရအောင်။ [[mark:read-pk]] Types မှာ string ရယ်၊ number ရယ်၊ symbol ရယ်
      သုံးမျိုးရဲ့ union လို့ ပြနေပါတယ်။ JavaScript မှာ object key ဖြစ်နိုင်တဲ့ type သုံးမျိုးလုံးကို နာမည်
      တစ်ခုတည်းနဲ့ ကြိုသတ်မှတ်ပေးထားတာပါ။ [[mark:read-true]] Output မှာလည်း string
      key နဲ့ number key နှစ်ခုလုံးအတွက် true လို့ ထွက်နေပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 6: Objects (PropertyKey)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/objects",
        }
      - {
          title: "TypeScript lib.es5.d.ts: type PropertyKey = string | number | symbol",
          url: "https://github.com/microsoft/TypeScript/blob/main/src/lib/es5.d.ts",
        }
      - {
          title: "MDN: in operator",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/in",
        }
    actions:
      - id: open-main-2
        type: workspace.openFile
        at: { mark: open-main-2 }
        path: src/main.ts
      - id: type-is-listed
        type: editor.type
        at: { mark: type-is-listed }
        target: { file: src/main.ts, after: "cupExtra.large, \"ကျပ်\");\n", occurrence: 1 }
        text: "\nconst tables = { 5: \"လှလှ\", 7: \"အောင်အောင်\" };\n\nfunction isListed(list: object, key: PropertyKey) {\n  return key in list;\n}\nconsole.log(isListed(cupExtra, \"medium\"), isListed(tables, 5));\n"
        cadence: line-by-line
      - id: expect-true-true
        type: expect.preview
        at: { afterAction: type-is-listed }
        timeoutMs: 8000
        target: { by: testId, value: ts-out-4 }
        textContains: "true true"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-pk-query
        type: editor.type
        at: { mark: type-pk-query }
        target:
          {
            file: src/main.ts,
            after: "function isListed(list: object, key: PropertyKey) {\n",
            occurrence: 1,
          }
        text: "//                                   ^?\n"
        cadence: line-by-line
      - id: expect-pk
        type: expect.preview
        at: { afterAction: type-pk-query }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-2 }
        attribute: { name: data-type, value: "type PropertyKey = string | number | symbol" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-pk-still-clean
        type: expect.preview
        at: { afterAction: expect-pk }
        timeoutMs: 5000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: object-type
    narration: >
      [[mark:select-object-param]] ပထမ parameter ကိုတော့ object type နဲ့ ကြေညာထားပါတယ်။ string ရယ်၊ number
      ရယ်၊ boolean ရယ် လို အခြေခံ တန်ဖိုးတွေကို primitive လို့ ခေါ်ပြီး၊ object type ကတော့ primitive မဟုတ်တဲ့
      တန်ဖိုး အားလုံးကို လက်ခံတဲ့ type ပါ။ [[mark:type-primitive]] စမ်းကြည့်ဖို့ ကော်ဖီ ဆိုတဲ့ string တစ်ခုကို
      object နေရာမှာ ထည့်ပေးကြည့်ရအောင်။
      [[mark:read-primitive]] Errors မှာ string ကို object နေရာမှာ ထည့်လို့ မရဘူးလို့ ပြနေပါတယ်။ Output ရဲ့
      နောက်ဆုံးမှာလည်း အနီရောင် line နဲ့ program ရပ်သွားပါတယ်။ string ပေါ်မှာ in operator ကို သုံးလို့
      မရလို့ပါ။ ဆိုတော့ object type က ဒီလို runtime error ကို program မ run ခင်ကတည်းက သတိပေးနိုင်တာပါ။
      [[mark:type-comment-out]] စမ်းကြည့်တဲ့ line ကို comment လုပ်ပြီး ပိတ်ထားပါမယ်။ [[mark:read-clean]] error
      ရော အနီရောင် line ရော ပျောက်သွားပါပြီ။ object type က array နဲ့ function ကိုပါ
      လက်ခံတာကို သတိထားပါ။ ရိုးရိုး object ကိုပဲ လက်ခံချင်ရင်တော့ value type ကို unknown ထားတဲ့ Record ကို
      ပိုသုံးကြပါတယ်။
    sources:
      - {
          title: "TypeScript Handbook: More on Functions (object)",
          url: "https://www.typescriptlang.org/docs/handbook/2/functions.html#object",
        }
      - {
          title: "Total TypeScript Essentials, ch. 6: Objects (the object type)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/objects",
        }
      - {
          title: "MDN: in operator (TypeError when the right side is not an object)",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/in",
        }
    actions:
      - id: select-object-param
        type: editor.select
        at: { mark: select-object-param }
        target: { file: src/main.ts, text: "list: object", occurrence: 1 }
      - id: type-primitive
        type: editor.type
        at: { mark: type-primitive }
        target: { file: src/main.ts, after: "isListed(tables, 5));\n", occurrence: 1 }
        text: "console.log(isListed(\"ကော်ဖီ\", \"length\"));\n"
        cadence: line-by-line
      - id: expect-primitive-error
        type: expect.preview
        at: { afterAction: type-primitive }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-primitive-text
        type: expect.preview
        at: { afterAction: expect-primitive-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Argument of type 'string' is not assignable to parameter of type 'object'."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-crash
        type: expect.preview
        at: { afterAction: expect-primitive-text }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-5 }
        textContains: "Uncaught TypeError: Cannot use 'in' operator to search for 'length' in ကော်ဖီ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-crash-level
        type: expect.preview
        at: { afterAction: expect-crash }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-5 }
        attribute: { name: data-level, value: "error" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-comment-out
        type: editor.type
        at: { mark: type-comment-out }
        target: { file: src/main.ts, after: "isListed(tables, 5));\n", occurrence: 1 }
        text: "// "
      - id: expect-clean
        type: expect.preview
        at: { afterAction: type-comment-out }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-four-lines
        type: expect.preview
        at: { afterAction: expect-clean }
        timeoutMs: 5000
        target: { by: testId, value: ts-output }
        attribute: { name: data-count, value: "4" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: recap
    narration: >
      [[mark:recap-stock]] ဒါဆို ပြန်ချုပ်ရရင်၊ key တွေကို ကြိုမသိတဲ့ object အတွက်တော့ index signature ကို
      သုံးပြီး၊ key တစ်ခုချင်းရဲ့ နာမည် အစား key ရဲ့ type နဲ့ value ရဲ့ type ကိုပဲ ပြောပေးရပါတယ်။
      [[mark:recap-record]] Record က index signature
      ကို ပိုတိုအောင် ရေးတဲ့ နည်း ဖြစ်ပြီး၊ key နေရာမှာ string
      အစား literal union ကို ပေးလိုက်ရင် ပါရမယ့် key တွေကို တိတိကျကျ စစ်ပေးပါတယ်။ [[mark:recap-pk]]
      PropertyKey က key ဖြစ်နိုင်တဲ့ type အားလုံးကို ဆိုလိုပြီး၊ object type ကတော့ primitive မဟုတ်တဲ့ တန်ဖိုး
      အားလုံးကို ဆိုလိုပါတယ်။ နောက် lesson မှာတော့ ရှိပြီးသား type တစ်ခုကနေ Partial ရယ်၊ Pick ရယ်၊ Omit ရယ်
      လို utility type တွေနဲ့ type အသစ်တွေ ထုတ်ယူပုံကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 6: Objects",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/objects",
        }
      - {
          title: "TypeScript Handbook: Utility Types",
          url: "https://www.typescriptlang.org/docs/handbook/utility-types.html",
        }
    actions:
      - id: open-stock-3
        type: workspace.openFile
        at: { mark: recap-stock }
        path: src/stock.ts
      - id: select-stock-type
        type: editor.select
        at: { afterAction: open-stock-3 }
        target:
          {
            file: src/stock.ts,
            text: "  tea: number;\n  coffee: number;\n  [item: string]: number;",
            occurrence: 1,
          }
      - id: open-cups-3
        type: workspace.openFile
        at: { mark: recap-record }
        path: src/cups.ts
      - id: select-union-record
        type: editor.select
        at: { afterAction: open-cups-3 }
        target: { file: src/cups.ts, text: "Record<CupSize, number>", occurrence: 1 }
      - id: open-main-3
        type: workspace.openFile
        at: { mark: recap-pk }
        path: src/main.ts
      - id: select-is-listed
        type: editor.select
        at: { afterAction: open-main-3 }
        target: { file: src/main.ts, text: "list: object, key: PropertyKey", occurrence: 1 }
      - id: expect-file-stock
        type: expect.file
        at: { afterAction: select-is-listed }
        path: src/stock.ts
        contains: "type Stock = {\n  tea: number;\n  coffee: number;\n  [item: string]: number;\n};\n\nconst stock: Stock = { tea: 0, coffee: 0 };"
      - id: expect-file-cups
        type: expect.file
        at: { afterAction: expect-file-stock }
        path: src/cups.ts
        contains: "type CupSize = \"small\" | \"large\" | \"medium\";\n\n// ခွက်အရွယ် အလိုက် ထပ်ပေါင်းရမယ့် ငွေ\nexport const cupExtra: Record<CupSize, number> = {"
      - id: expect-file-main
        type: expect.file
        at: { afterAction: expect-file-cups }
        path: src/main.ts
        contains: "function isListed(list: object, key: PropertyKey) {\n//                                   ^?\n  return key in list;\n}\nconsole.log(isListed(cupExtra, \"medium\"), isListed(tables, 5));\n// console.log(isListed(\"ကော်ဖီ\", \"length\"));"
checks:
  - { type: timing.p95Ms, max: 300 }
