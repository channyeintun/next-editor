build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 2610

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  - id: intro
    chapter: "ပုံတိုင်းမှာ ရည်ရွယ်ချက် ရှိပါတယ်"
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ JavaScript က page ကို ပြောင်းတဲ့အခါ၊ accessibility tree ကိုပါ မှန်အောင်
      ထိန်းပေးခဲ့ပါတယ်။ ဒီ lesson မှာတော့ ပုံတွေ အကြောင်း ကြည့်ပါမယ်။ [[mark:start-server]] ပုံကို
      မမြင်ရတဲ့သူအတွက် ပုံရဲ့ နေရာမှာ အစားထိုး ဖတ်ပြမယ့် စာကို alt text လို့ ခေါ်ပါတယ်။ alt text
      တစ်ခုခု ထည့်လိုက်ရင် ပြီးပြီ လို့ ထင်စရာ ရှိပေမယ့်၊ တကယ်တမ်း ဘာ ရေးရမလဲ ဆိုတာက ပုံရဲ့
      ရည်ရွယ်ချက်နဲ့ ပုံ ရှိနေတဲ့ နေရာပေါ် မူတည်ပါတယ်။ [[mark:draw-question]] ကိုယ့်ကိုယ်ကို
      မေးကြည့်လို့ ရတဲ့ မေးခွန်း တစ်ခုက၊ page ပေါ်က ပုံတွေကို ဖျောက်လိုက်ရင် ကျန်တဲ့ အကြောင်းအရာကို
      နားလည်သေးလား ဆိုတာပါ။ [[mark:draw-decorative]] နားလည်သေးရင် အဲဒီ ပုံက အလှဆင် ပုံ ဖြစ်ပြီး၊
      screen reader က ကျော်သွားရပါမယ်။ [[mark:draw-informative]] ပုံက အချက်အလက် တစ်ခုခု ပေးနေရင်တော့၊
      အဲဒီ အချက်ကို တိုတို ပြောပြရပါမယ်။ [[mark:draw-functional]] link ဒါမှမဟုတ် ခလုတ်ထဲက ပုံဆိုရင်၊
      ပုံရဲ့ ပုံစံကို မဟုတ်ဘဲ နှိပ်ရင် ဘာဖြစ်မလဲ ဆိုတာ ပြောရပါမယ်။ [[mark:draw-complex]] ဇယား၊ မြေပုံ
      လို ရှုပ်ထွေးတဲ့ ပုံအတွက်ကတော့ အတိုချုပ် တစ်ကြောင်းနဲ့ အသေးစိတ် ရှင်းပြချက် နှစ်ခုလုံး လိုပါတယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: Images — Image purpose and context",
          url: "https://web.dev/learn/accessibility/images#image_purpose_and_context",
        }
      - {
          title: "W3C WAI Images Tutorial: An alt Decision Tree",
          url: "https://www.w3.org/WAI/tutorials/images/decision-tree/",
        }
    actions:
      - id: open-purpose-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-question
        type: whiteboard.apply
        at: { mark: draw-question }
        upsertIds: [a-question]
        drawMs: 1400
      - id: draw-decorative
        type: whiteboard.apply
        at: { mark: draw-decorative }
        upsertIds: [a-deco-box, a-deco-head, a-deco-body]
        drawMs: 1500
      - id: draw-informative
        type: whiteboard.apply
        at: { mark: draw-informative }
        upsertIds: [a-info-box, a-info-head, a-info-body]
        drawMs: 1500
      - id: draw-functional
        type: whiteboard.apply
        at: { mark: draw-functional }
        upsertIds: [a-func-box, a-func-head, a-func-body]
        drawMs: 1500
      - id: draw-complex
        type: whiteboard.apply
        at: { mark: draw-complex }
        upsertIds: [a-complex-box, a-complex-head, a-complex-body]
        drawMs: 1500

  - id: code-tour
    narration: >
      [[mark:close-intro]] ဆိုင်ရဲ့ page မှာ ဒီ လေးမျိုးလုံး ရှိနေပါတယ်။ HTML ဖိုင်ကို ကြည့်ရအောင်။
      [[mark:select-logo]] header မှာ ဆိုင်ရဲ့ logo ပုံ ရှိပြီး၊ သူ့ဘေးမှာ ဆိုင်နာမည်ကို စာနဲ့
      ရေးထားပါတယ်။ [[mark:select-call]] ညာဘက်က ဖုန်းဆက်တဲ့ link ထဲမှာတော့ ဖုန်းပုံလေး တစ်ခုပဲ ရှိပြီး၊
      သူ့ alt က အလွတ် ဖြစ်နေပါတယ်။ [[mark:select-divider]] main ထဲမှာ အရွက်ပုံနဲ့ မျဉ်းတား ပုံ တစ်ခု
      ရှိပါတယ်။ [[mark:select-photo]] သူ့အောက်မှာ ဆိုင်ထဲက ဓာတ်ပုံ ရှိပါတယ်။ [[mark:select-chart]]
      နောက်ဆုံးမှာတော့ ဒီနေ့ ဘာ အရောင်းရဆုံးလဲ ဆိုတာ ပြတဲ့ ဇယား ရှိပြီး၊ SVG နဲ့ page ထဲမှာ တိုက်ရိုက်
      ဆွဲထားတာပါ။ ဖုန်းပုံကလွဲရင် ကျန်တဲ့ ပုံတွေမှာ alt လုံးဝ မပါသေးသလို၊ ဇယားမှာလည်း name
      မရှိသေးပါဘူး။
    sources:
      - {
          title: "web.dev Learn Accessibility: Images",
          url: "https://web.dev/learn/accessibility/images",
        }
      - {
          title: "MDN: <img> alt attribute",
          url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/img#alt",
        }
    actions:
      - id: close-purpose-board
        type: whiteboard.apply
        at: { mark: close-intro }
        open: false
      - id: select-logo
        type: editor.select
        at: { mark: select-logo }
        target: { file: index.html, text: '<img class="logo" src="/cup.svg"', occurrence: 1 }
      - id: select-call
        type: editor.select
        at: { mark: select-call }
        target: { file: index.html, text: '<img src="/phone.svg" alt=""', occurrence: 1 }
      - id: select-divider
        type: editor.select
        at: { mark: select-divider }
        target: { file: index.html, text: '<img class="divider" src="/divider.svg"', occurrence: 1 }
      - id: select-photo
        type: editor.select
        at: { mark: select-photo }
        target: { file: index.html, text: '<img src="/teahouse.svg"', occurrence: 1 }
      - id: select-chart
        type: editor.select
        at: { mark: select-chart }
        target: { file: index.html, text: '<svg class="chart"', occurrence: 1 }

  - id: first-look
    narration: >
      [[mark:preview-ready]] ညာဘက်မှာ ဆိုင်ရဲ့ page ကို မြင်ရပါပြီ။ မျက်စိနဲ့ ကြည့်ရင်တော့ ပုံတွေ
      အကုန် ကောင်းကောင်း ပေါ်နေပါတယ်။ ဒါပေမဲ့ accessibility panel ရဲ့ ထိပ်ဆုံးမှာ warning လေးခု
      ပြနေပါတယ်။ [[mark:look-rows]] tree ထဲမှာ logo၊ မျဉ်းတား၊ ဓာတ်ပုံ သုံးခုလုံးက role က img
      ဖြစ်ပေမယ့် name မရှိပါဘူး။ ဖုန်းဆက်တဲ့ link မှာလည်း name မရှိပါဘူး။ alt မပါတဲ့ ပုံကို screen
      reader တချို့က ဖိုင်နာမည်နဲ့ ဖတ်ပြတတ်ပြီး၊ တချို့က ပုံ တစ်ပုံ ရှိတယ် ဆိုတာလောက်ပဲ ပြောပါတယ်။
      ဇယားကတော့ tree ထဲမှာ လုံးဝ မပေါ်ပါဘူး။
    sources:
      - {
          title: "web.dev Learn Accessibility: Images — Empty or null alt",
          url: "https://web.dev/learn/accessibility/images#empty_or_null_alt",
        }
      - {
          title: "MDN: <img> — accessibility (missing alt)",
          url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/img#accessibility",
        }
    actions:
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { mark: preview-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-dev-server }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-four-warnings
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: a11y-summary }
        attribute: { name: data-warnings, value: "4" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-photo-unnamed
        type: expect.preview
        at: { mark: look-rows }
        timeoutMs: 5000
        target: { by: testId, value: a11y-photo-teahouse }
        textContains: "img ⚠ no name"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-call-unnamed
        type: expect.preview
        at: { afterAction: expect-photo-unnamed }
        timeoutMs: 5000
        target: { by: testId, value: a11y-call-link }
        textContains: "link ⚠ no name"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-logo-unnamed
        type: expect.preview
        at: { afterAction: expect-call-unnamed }
        timeoutMs: 5000
        target: { by: testId, value: a11y-logo }
        textContains: "img ⚠ no name"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: decorative
    chapter: "အလှဆင် ပုံ"
    narration: >
      [[mark:type-divider]] အလှဆင် ပုံကနေ စကြည့်ရအောင်။ မျဉ်းတား ပုံက page ကို လှအောင် လုပ်ပေးရုံပဲ
      ဖြစ်လို့၊ alt ကို အလွတ် ထည့်ပါမယ်။ [[mark:after-divider]] tree ကို ကြည့်ပါ၊ မျဉ်းတား ပုံရဲ့ row
      ပျောက်သွားပြီး warning သုံးခု ဖြစ်သွားပါပြီ။ alt အလွတ်ဆိုတာ ဒီ ပုံကို ကျော်သွားပါ လို့ assistive
      technology ကို ပြောလိုက်တာပါ။ [[mark:board-decorative]] အလှဆင် ပုံကို ဖျောက်တဲ့ နည်း တခြားလည်း
      ရှိပါသေးတယ်။ [[mark:draw-deco-role]] role ကို presentation ဒါမှမဟုတ် none ပေးရင်၊ ပုံရဲ့
      အဓိပ္ပာယ်ကို tree ထဲကနေ ဖယ်ပေးပါတယ်။ aria hidden ကတော့ element နဲ့ သူ့အထဲက အရာ အားလုံးကို
      ဖျောက်လို့ သတိထား သုံးရပါမယ်။ [[mark:draw-deco-css]] CSS background အဖြစ် ထည့်ထားတဲ့ ပုံကိုလည်း
      screen reader က မသိပါဘူး။ [[mark:draw-deco-missing]] သတိထားရမှာက alt လုံးဝ မပါတာနဲ့ alt အလွတ်
      ထည့်တာ မတူတာပါ။ alt မပါရင် screen reader က ဖိုင်နာမည်ကို ဖတ်ပြနိုင်ပါတယ်။ ပြီးတော့ အလှဆင်လား
      မသေချာရင် ဖော်ပြချက် ထည့်ပေးတာ ပိုကောင်းပါတယ်။ ပိုနေတဲ့ ဖော်ပြချက်ကို ကျော်နားထောင်လို့ ရပေမယ့်၊
      မရှိတဲ့ ဖော်ပြချက်ကိုတော့ ဘယ်သူမှ ကိုယ့်ဘာသာ ဖြည့်တွေးလို့ မရလို့ပါ။
    sources:
      - {
          title: "web.dev Learn Accessibility: Images — Decorative images",
          url: "https://web.dev/learn/accessibility/images#decorative_images",
        }
      - {
          title: "W3C WAI Images Tutorial: Decorative Images",
          url: "https://www.w3.org/WAI/tutorials/images/decorative/",
        }
      - {
          title: "MDN: ARIA presentation role",
          url: "https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/presentation_role",
        }
      - {
          title: "MDN: aria-hidden",
          url: "https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Attributes/aria-hidden",
        }
    actions:
      - id: type-divider-alt
        type: editor.type
        at: { mark: type-divider }
        cadence: block
        target:
          { file: index.html, after: '<img class="divider" src="/divider.svg"', occurrence: 1 }
        text: ' alt=""'
      - id: expect-three-warnings
        type: expect.preview
        at: { mark: after-divider }
        timeoutMs: 5000
        target: { by: testId, value: a11y-summary }
        attribute: { name: data-warnings, value: "3" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: board-decorative
        type: whiteboard.apply
        at: { mark: board-decorative }
        open: true
        clear: true
        upsertIds: [b-title, b-alt]
      - id: draw-deco-role
        type: whiteboard.apply
        at: { mark: draw-deco-role }
        upsertIds: [b-role, b-hidden]
        drawMs: 1600
      - id: draw-deco-css
        type: whiteboard.apply
        at: { mark: draw-deco-css }
        upsertIds: [b-css]
        drawMs: 1000
      - id: draw-deco-missing
        type: whiteboard.apply
        at: { mark: draw-deco-missing }
        upsertIds: [b-missing-box, b-missing-head, b-missing-body]
        drawMs: 1600

  - id: informative
    chapter: "အချက်အလက် ပေးတဲ့ ပုံ"
    narration: >
      [[mark:close-decorative]] ဆိုင်ထဲက ဓာတ်ပုံကတော့ မတူပါဘူး။ ဒီ ဓာတ်ပုံက ဆိုင်ထဲမှာ ဘယ်လို ရှိလဲ
      ဆိုတာ ပြပေးနေလို့ အချက်အလက် ပေးတဲ့ ပုံပါ။ [[mark:type-photo-alt]] ဒီ page မှာ ဓာတ်ပုံရဲ့ အဓိက
      အချက်က ဘာလဲ ဆိုတာ စဉ်းစားပြီး၊ ပြတင်းပေါက်နား ခုံတန်းရှည်နဲ့ လက်ဖက်ရည်ခွက်များ ဆိုတဲ့ alt text
      ကို ထည့်ပါမယ်။ page ရဲ့ ဘာသာစကား ဖြစ်တဲ့ မြန်မာလိုပဲ ရေးပြီး၊ ပုဒ်မနဲ့ အဆုံးသတ်ထားပါတယ်။
      [[mark:after-photo-alt]] ဓာတ်ပုံရဲ့ row မှာ name ပေါ်လာပြီး၊ warning နှစ်ခုပဲ ကျန်ပါတော့တယ်။
      screen reader က ဒီ စာကို ဖတ်ပြရင်း ပုံ ဖြစ်ကြောင်းကိုလည်း သူ့ဘာသာ ပြောပြမှာပါ။ ဒါကြောင့် alt
      ထဲမှာ ပုံ၊ ဓာတ်ပုံ ဆိုတဲ့ စကား ထည့်စရာ မလိုပါဘူး။ ဒါ့အပြင် အောက်က caption မှာ ဆိုင်အတွင်း လို့
      ရေးထားပြီးသားမို့၊ alt မှာ အဲဒီ စကားကို ထပ်မပြောတော့ပါဘူး။
    sources:
      - {
          title: "web.dev Learn Accessibility: Images — Informative images",
          url: "https://web.dev/learn/accessibility/images#informative_images",
        }
      - {
          title: "W3C WAI Images Tutorial: Informative Images",
          url: "https://www.w3.org/WAI/tutorials/images/informative/",
        }
      - {
          title: "W3C WAI Images Tutorial: Tips and Tricks",
          url: "https://www.w3.org/WAI/tutorials/images/tips/",
        }
    actions:
      - id: close-decorative
        type: whiteboard.apply
        at: { mark: close-decorative }
        open: false
      - id: type-photo-alt
        type: editor.type
        at: { mark: type-photo-alt }
        cadence: block
        target: { file: index.html, after: '<img src="/teahouse.svg"', occurrence: 1 }
        text: ' alt="ပြတင်းပေါက်နား ခုံတန်းရှည်နဲ့ လက်ဖက်ရည်ခွက်များ။"'
      - id: expect-photo-named
        type: expect.preview
        at: { mark: after-photo-alt }
        timeoutMs: 5000
        target: { by: testId, value: a11y-photo-teahouse }
        attribute: { name: data-name, value: "ပြတင်းပေါက်နား ခုံတန်းရှည်နဲ့ လက်ဖက်ရည်ခွက်များ။" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-two-warnings
        type: expect.preview
        at: { afterAction: expect-photo-named }
        timeoutMs: 5000
        target: { by: testId, value: a11y-summary }
        attribute: { name: data-warnings, value: "2" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: functional
    chapter: "နှိပ်လို့ရတဲ့ ပုံ"
    narration: >
      [[mark:select-call-alt]] အခု header က ဖုန်းဆက်တဲ့ link ကို ပြန်ကြည့်ရအောင်။ link ထဲမှာ ဖုန်းပုံ
      တစ်ခုပဲ ရှိပြီး၊ အဲဒီ ပုံကို alt အလွတ် ပေးထားပါတယ်။ ဒီ ပုံက အလှဆင် ပုံ မဟုတ်ဘဲ link ရဲ့
      တစ်ခုတည်းသော အကြောင်းအရာ ဖြစ်နေလို့၊ link မှာ name မရှိ ဖြစ်နေတာပါ။ [[mark:type-call-alt]]
      ဖုန်းပုံ ဆိုပြီး ပုံရဲ့ ပုံစံကို ပြောမယ့်အစား၊ နှိပ်ရင် ဖြစ်မယ့် အလုပ်ကို ပြောတဲ့ ဖုန်းဆက်ရန်
      ဆိုတာကို ထည့်ပါမယ်။ [[mark:after-call-alt]] link ရဲ့ row မှာ name က ဖုန်းဆက်ရန် ဖြစ်သွားပြီး၊
      warning တစ်ခုပဲ ကျန်ပါတော့တယ်။ screen reader က ဖုန်းဆက်ရန်၊ link လို့ ဖတ်ပြမှာပါ။ ရှာဖွေတဲ့
      ခလုတ်ထဲက မှန်ဘီလူး ပုံ၊ ပင်မ page ကို ပြန်သွားတဲ့ logo link စတာတွေလည်း ဒီ အုပ်စုထဲ ပါပါတယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: Images — Functional images",
          url: "https://web.dev/learn/accessibility/images#functional_images",
        }
      - {
          title: "W3C WAI Images Tutorial: Functional Images",
          url: "https://www.w3.org/WAI/tutorials/images/functional/",
        }
    actions:
      - id: select-call-alt
        type: editor.select
        at: { mark: select-call-alt }
        target: { file: index.html, text: '<img src="/phone.svg" alt=""', occurrence: 1 }
      - id: type-call-alt
        type: editor.type
        at: { mark: type-call-alt }
        cadence: block
        target: { file: index.html, after: '<img src="/phone.svg" alt="', occurrence: 1 }
        text: "ဖုန်းဆက်ရန်"
      - id: expect-call-named
        type: expect.preview
        at: { mark: after-call-alt }
        timeoutMs: 5000
        target: { by: testId, value: a11y-call-link }
        textContains: 'link "ဖုန်းဆက်ရန်"'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-one-warning
        type: expect.preview
        at: { afterAction: expect-call-named }
        timeoutMs: 5000
        target: { by: testId, value: a11y-summary }
        attribute: { name: data-warnings, value: "1" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: complex
    chapter: "ရှုပ်ထွေးတဲ့ ပုံ"
    narration: >
      [[mark:look-chart]] ဇယားကို ကြည့်ရအောင်။ ဇယားကို မြင်ရတဲ့သူက လက်ဖက်ရည် အရောင်းရဆုံး ဖြစ်တာနဲ့
      တစ်မျိုးချင်း ဘယ်လောက် ရောင်းရလဲ ဆိုတာကို တစ်ချက်ကြည့်ရုံနဲ့ သိပါတယ်။ ဒီလောက် အချက်အလက်ကို alt
      တစ်ကြောင်းထဲ ထည့်ရင် ရှည်လွန်းသွားပါမယ်။ [[mark:type-chart-data]] ဒါကြောင့် ဇယားရဲ့ အောက်မှာ
      ကိန်းဂဏန်းတွေကို စာနဲ့ ရေးထားတဲ့ စာပိုဒ် တစ်ခု ထည့်ပါမယ်။ [[mark:scroll-chart]] page ကို
      အောက်ဆင်း ကြည့်ရအောင်။ [[mark:after-chart-data]] ဇယားရဲ့ အောက်မှာ စာပိုဒ် ပေါ်နေပါပြီ။ ဇယား ဖတ်ရ
      ခက်တဲ့သူတွေအတွက်ပါ အကျိုးရှိလို့၊ ဖျောက်မထားဘဲ မြင်ရအောင် ထားတာ ပိုကောင်းပါတယ်။
      [[mark:type-chart-role]] အခု ဇယား ကိုယ်တိုင်ကို ပြင်ပါမယ်။ page ထဲမှာ တိုက်ရိုက် ရေးထားတဲ့ SVG
      ကို ပုံ တစ်ပုံ အဖြစ် သိအောင် role img ပေးပြီး၊ aria label နဲ့ အတိုချုပ် name ပေးပါမယ်။ aria
      describedby နဲ့ ခုနက စာပိုဒ်ကိုလည်း ချိတ်ပေးပါမယ်။ [[mark:after-chart-role]] tree ထဲမှာ ဇယားက
      img အဖြစ် ပေါ်လာပါပြီ။ name က လက်ဖက်ရည် အရောင်းရဆုံးကို ပြတဲ့ ဇယား ဖြစ်ပြီး၊ description ကတော့
      ကိန်းဂဏန်းတွေ ပါတဲ့ စာပိုဒ်ပါ။ screen reader က name ကို ဖတ်ပြီးရင် description ကိုပါ
      ဆက်ဖတ်ပြနိုင်ပါတယ်။ [[mark:select-figcaption]] ဓာတ်ပုံမှာ သုံးထားတဲ့ figure နဲ့ figcaption ကလည်း
      ပုံနဲ့ ရှင်းပြချက်ကို တွဲပေးတဲ့ နည်း တစ်ခုပါ။ အသေးစိတ် ရှင်းပြထားတဲ့ နေရာကို link ပေးတာ၊ ဒေတာကို
      table နဲ့ ပြတာ စတဲ့ နည်းတွေကိုလည်း သုံးနိုင်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: Images — Complex images",
          url: "https://web.dev/learn/accessibility/images#complex_images",
        }
      - {
          title: "W3C WAI Images Tutorial: Complex Images",
          url: "https://www.w3.org/WAI/tutorials/images/complex/",
        }
      - {
          title: "MDN: aria-describedby",
          url: "https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Attributes/aria-describedby",
        }
      - {
          title: "MDN: ARIA img role (inline SVG)",
          url: "https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/img_role",
        }
      - {
          title: "MDN: <figcaption>",
          url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/figcaption",
        }
    actions:
      - id: select-chart-svg
        type: editor.select
        at: { mark: look-chart }
        target:
          { file: index.html, text: '<svg class="chart" width="240" height="96"', occurrence: 1 }
      - id: type-chart-data
        type: editor.type
        at: { mark: type-chart-data }
        cadence: block
        target: { file: index.html, after: "</svg>", occurrence: 1 }
        text: "\n        <p class=\"hint\" id=\"chart-data\" data-testid=\"chart-data\">လက်ဖက်ရည် 120 ခွက်၊ ကော်ဖီ 80 ခွက်၊ မုန့်ဟင်းခါး 45 ပွဲ။</p>"
      - id: expect-chart-data
        type: expect.preview
        at: { mark: scroll-chart, offsetMs: -700 }
        timeoutMs: 5000
        target: { by: testId, value: chart-data }
        textContains: "လက်ဖက်ရည် 120 ခွက်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: scroll-chart
        type: preview.scroll
        at: { mark: scroll-chart }
        timeoutMs: 5000
        top: 5000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-chart-role
        type: editor.type
        at: { mark: type-chart-role }
        cadence: block
        target: { file: index.html, after: '<svg class="chart"', occurrence: 1 }
        text: ' role="img" aria-label="လက်ဖက်ရည် အရောင်းရဆုံးကို ပြတဲ့ ဇယား။" aria-describedby="chart-data"'
      - id: expect-chart-named
        type: expect.preview
        at: { mark: after-chart-role }
        timeoutMs: 5000
        target: { by: testId, value: a11y-chart }
        attribute: { name: data-name, value: "လက်ဖက်ရည် အရောင်းရဆုံးကို ပြတဲ့ ဇယား။" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-chart-desc
        type: expect.preview
        at: { afterAction: expect-chart-named }
        timeoutMs: 5000
        target: { by: testId, value: a11y-chart }
        textContains: 'desc "လက်ဖက်ရည် 120 ခွက်'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-figcaption
        type: editor.select
        at: { mark: select-figcaption }
        target: { file: index.html, text: "<figcaption>ဆိုင်အတွင်း</figcaption>", occurrence: 1 }

  - id: best-practices
    chapter: "alt text ကောင်းကောင်း ရေးနည်း"
    narration: >
      [[mark:board-tips]] alt text ရေးတဲ့အခါ သတိထားစရာ တချို့ကို စုကြည့်ရအောင်။ [[mark:draw-tip-bad]]
      image ဒါမှမဟုတ် ပုံ ဆိုတဲ့ စကားလုံး တစ်လုံးတည်း၊ ဖိုင်နာမည် စတာတွေကို alt အဖြစ် ပေးထားရင် ဘာမှ
      မပြောပြပါဘူး။ ပုံ၊ ဓာတ်ပုံ ဆိုတဲ့ စကားနဲ့ စတာကိုလည်း ရှောင်ပါ။ [[mark:draw-tip-good]]
      အရေးကြီးတာကို လူတစ်ယောက် ပြောသလို တိုတို ရေးပြီး၊ ပုဒ်မနဲ့ ဆုံးပါ။ စာလုံး ၁၅၀ လောက်ထက် မပိုအောင်
      ထားဖို့ အကြံပြုကြပြီး၊ ပိုရှည်လာရင် ခုနက ဇယားလို ပုံရဲ့ ဘေးမှာ ရေးပါ။ search engine အတွက်
      keyword တွေ စုထည့်တာကလည်း နားထောင်ရတဲ့သူကို အနှောင့်အယှက် ဖြစ်စေပါတယ်။ [[mark:draw-tip-repeat]]
      နောက်ဆုံး အချက်က ဘေးမှာ ရှိပြီးသား စာကို ထပ်မပြောဖို့ပါ။ [[mark:close-tips]] header က logo ကို
      ပြန်ကြည့်ရအောင်။ [[mark:select-shop-name]] logo ရဲ့ ဘေးမှာ ဆိုင်နာမည်က heading စာသား အနေနဲ့
      ရှိပြီးသားပါ။ logo ကို ဆိုင်နာမည် alt ပေးလိုက်ရင်၊ screen reader က ဆိုင်နာမည်ကို နှစ်ခါ ဆက်တိုက်
      ဖတ်ပြမှာပါ။ [[mark:type-logo-alt]] ဒါကြောင့် logo ကိုလည်း alt အလွတ် ပေးပါမယ်။
      [[mark:after-logo-alt]] panel ရဲ့ ထိပ်ဆုံးမှာ warning မရှိတော့ပါဘူး။ ဒါပေမဲ့ panel က alt
      ရှိမရှိကိုပဲ စစ်နိုင်ပြီး၊ alt text ကောင်းမကောင်းကိုတော့ ကိုယ်တိုင် ဆုံးဖြတ်ရပါမယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: Images — Alternative text best practices",
          url: "https://web.dev/learn/accessibility/images#alternative_text_best_practices",
        }
      - {
          title: "W3C WAI Images Tutorial: Tips and Tricks",
          url: "https://www.w3.org/WAI/tutorials/images/tips/",
        }
      - {
          title: "W3C WAI Images Tutorial: Decorative Images (image next to text)",
          url: "https://www.w3.org/WAI/tutorials/images/decorative/",
        }
    actions:
      - id: board-tips
        type: whiteboard.apply
        at: { mark: board-tips }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-tip-bad
        type: whiteboard.apply
        at: { mark: draw-tip-bad }
        upsertIds: [c-bad-box, c-bad-line1, c-bad-line2]
        drawMs: 2000
      - id: draw-tip-good
        type: whiteboard.apply
        at: { mark: draw-tip-good }
        upsertIds: [c-good-box, c-good-line1, c-good-line2]
        drawMs: 2000
      - id: draw-tip-repeat
        type: whiteboard.apply
        at: { mark: draw-tip-repeat }
        upsertIds: [c-repeat]
        drawMs: 1200
      - id: close-tips
        type: whiteboard.apply
        at: { mark: close-tips }
        open: false
      - id: select-shop-name
        type: editor.select
        at: { mark: select-shop-name }
        target:
          {
            file: index.html,
            text: '<h1 class="shop-name" data-testid="shop-name">ရွှေလက်ဖက်ရည်ဆိုင်</h1>',
            occurrence: 1,
          }
      - id: type-logo-alt
        type: editor.type
        at: { mark: type-logo-alt }
        cadence: block
        target: { file: index.html, after: '<img class="logo" src="/cup.svg"', occurrence: 1 }
        text: ' alt=""'
      - id: expect-no-warnings
        type: expect.preview
        at: { mark: after-logo-alt }
        timeoutMs: 5000
        target: { by: testId, value: a11y-summary }
        attribute: { name: data-warnings, value: "0" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-no-warnings-text
        type: expect.preview
        at: { afterAction: expect-no-warnings }
        timeoutMs: 5000
        target: { by: testId, value: a11y-summary }
        textContains: "no warnings"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ alt text ဆိုတာ ပုံကို ဖော်ပြတာထက်၊ ဒီ နေရာမှာ ပုံက ဘာ အလုပ် လုပ်နေလဲ
      ဆိုတာကို ပြောပြတာပါ။ [[mark:recap-decorative]] အလှဆင် ပုံကို alt အလွတ်နဲ့ ကျော်ခိုင်းပါ။
      [[mark:recap-informative]] အချက်အလက် ပေးတဲ့ ပုံမှာ အဓိက အချက်ကို တိုတို ရေးပါ။
      [[mark:recap-functional]] link နဲ့ ခလုတ်ထဲက ပုံမှာ နှိပ်ရင် ဘာဖြစ်မလဲ ဆိုတာ ရေးပါ။
      [[mark:recap-complex]] ရှုပ်ထွေးတဲ့ ပုံမှာ အတိုချုပ် name နဲ့ အသေးစိတ် ရှင်းပြချက်ကို တွဲပေးပါ။
      နောက် lesson မှာတော့ အရောင်နဲ့ contrast အကြောင်း ကြည့်သွားပါမယ်။ စာလုံး အရောင်နဲ့ နောက်ခံ အရောင်
      ဘယ်လောက် ကွာမှ ဖတ်လို့ ကောင်းလဲ ဆိုတာကို တိုင်းကြည့်ပါမယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: Images",
          url: "https://web.dev/learn/accessibility/images",
        }
      - {
          title: "web.dev Learn Accessibility: Color and contrast",
          url: "https://web.dev/learn/accessibility/color-contrast",
        }
    actions:
      - id: recap-decorative
        type: editor.select
        at: { mark: recap-decorative }
        target: { file: index.html, text: 'src="/divider.svg" alt=""', occurrence: 1 }
      - id: recap-informative
        type: editor.select
        at: { mark: recap-informative }
        target:
          { file: index.html, text: 'alt="ပြတင်းပေါက်နား ခုံတန်းရှည်နဲ့ လက်ဖက်ရည်ခွက်များ။"', occurrence: 1 }
      - id: recap-functional
        type: editor.select
        at: { mark: recap-functional }
        target: { file: index.html, text: 'alt="ဖုန်းဆက်ရန်"', occurrence: 1 }
      - id: recap-complex
        type: editor.select
        at: { mark: recap-complex }
        target: { file: index.html, text: 'aria-describedby="chart-data"', occurrence: 1 }
      - id: expect-file-divider
        type: expect.file
        at: { afterAction: recap-complex }
        path: index.html
        contains: '<img class="divider" src="/divider.svg" alt=""'
      - id: expect-file-photo
        type: expect.file
        at: { afterAction: expect-file-divider }
        path: index.html
        contains: '<img src="/teahouse.svg" alt="ပြတင်းပေါက်နား ခုံတန်းရှည်နဲ့ လက်ဖက်ရည်ခွက်များ။"'
      - id: expect-file-call
        type: expect.file
        at: { afterAction: expect-file-photo }
        path: index.html
        contains: '<img src="/phone.svg" alt="ဖုန်းဆက်ရန်"'
      - id: expect-file-chart
        type: expect.file
        at: { afterAction: expect-file-call }
        path: index.html
        contains: '<svg class="chart" role="img" aria-label="လက်ဖက်ရည် အရောင်းရဆုံးကို ပြတဲ့ ဇယား။" aria-describedby="chart-data"'
      - id: expect-file-chart-data
        type: expect.file
        at: { afterAction: expect-file-chart }
        path: index.html
        contains: '<p class="hint" id="chart-data" data-testid="chart-data">လက်ဖက်ရည် 120 ခွက်၊ ကော်ဖီ 80 ခွက်၊ မုန့်ဟင်းခါး 45 ပွဲ။</p>'
      - id: expect-file-logo
        type: expect.file
        at: { afterAction: expect-file-chart-data }
        path: index.html
        contains: '<img class="logo" src="/cup.svg" alt=""'

checks:
  - { type: timing.p95Ms, max: 300 }
