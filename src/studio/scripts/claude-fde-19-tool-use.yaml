      reply-assistant/src/tools.ts: |
        import Anthropic from "@anthropic-ai/sdk";
        import { betaZodTool } from "@anthropic-ai/sdk/helpers/beta/zod";
        import { z } from "zod";

        const client = new Anthropic();

        // Our code: the prototype's read-only NMS lookup (a stub here).
        async function outageFor(township: string) {
          return { township, outage: false };
        }

        export const checkOutage = betaZodTool({
          name: "check_outage",
          inputSchema: z.object({
          }),
          run: async ({ township }) => JSON.stringify(await outageFor(township)),
        });

