build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 6125
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}
scenes:
  - id: recall
    chapter: Customer ဆီ ဘေးကင်းကင်း ရောက်ဖို့
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ secret တွေကို code နဲ့ chat ထဲ မထည့်ဖို့၊ agent ကို လိုတာထက် ပိုတဲ့ access
      မပေးဖို့နဲ့၊ customer ရေးတဲ့ စာကို ညွှန်ကြားချက် အဖြစ် မဟုတ်ဘဲ data အဖြစ်ပဲ ဆက်ဆံဖို့ လေ့လာခဲ့ပါတယ်။
      ဒီနေ့တော့ စစ်ပြီးသား version တစ်ခုကို customer တွေဆီ ဘေးကင်းကင်း ဘယ်လို ရောက်အောင် လုပ်မလဲ ဆိုတာ ကြည့်ပါမယ်။
      [[mark:sel-row6]] ကိုယ်တို့ plan ရဲ့ နောက်ဆုံး task မှာ app ကို staging ဆိုတဲ့ နေရာပေါ် တင်ပြီး၊ release
      checklist နဲ့ စစ်မယ်လို့ ရေးခဲ့ပါတယ်။ [[mark:why-check]] ဒါပေမဲ့ ဘာကြောင့် checklist လိုတာလဲ။ app ကို
      customer တွေ သုံးနေပြီ ဖြစ်တဲ့ နောက်ပိုင်းမှာ၊ agent နဲ့ ပြင်ထားတဲ့ version အသစ်က ကိုယ့် laptop ပေါ်မှာ
      ကောင်းကောင်း အလုပ်လုပ်လို့ တကယ့် app ပေါ်ကို တန်းတင်လိုက်တယ် ဆိုပါစို့။ ကျောင်းသား မောင်မောင် ရဲ့ ဈေးပေါတဲ့
      ဖုန်းမှာ form က ပေါ်မလာတော့ရင်၊ အဲဒါကို အရင်ဆုံး သိမှာက customer တွေပါ။ ကောင်တာက လှလှ ကလည်း ဘာဖြစ်နေလဲ မသိဘဲ
      customer တွေရဲ့ မေးခွန်းကို ဖြေရပါလိမ့်မယ်။ [[mark:open-check]] ဒီလို customer တွေရော လှလှ ပါ ကြိုမသိဘဲ
      ဒုက္ခ မရောက်ရအောင်၊ ဒီနေ့ အဲဒီ release checklist ကို ရေးပါမယ်။ checklist ဆိုတာ မမေ့ရအောင် တစ်ခုချင်း
      စစ်ရမယ့် စာရင်းပါ။ release ဆိုတာ version အသစ်ကို customer တွေ သုံးလို့ရအောင် ထုတ်ပေးတာပါ။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The new SDLC (code review and deployment)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "Google SRE book: Release Engineering",
          url: "https://sre.google/sre-book/release-engineering/",
        }
    actions:
      - { id: open-plan, type: workspace.openFile, at: { mark: sel-row6 }, path: docs/plan.md }
      - {
          id: sel-row6,
          type: editor.select,
          at: { afterAction: open-plan },
          target:
            {
              file: docs/plan.md,
              text: "| 6 | staging ပေါ် တင်တာ | release checklist |",
              occurrence: 1,
            },
        }
      - {
          id: open-check,
          type: workspace.openFile,
          at: { mark: open-check },
          path: docs/release-checklist.md,
        }

  - id: envs
    chapter: Environment သုံးခု
    narration: >
      [[mark:e-title]] customer တွေ မမြင်ခင် စစ်လို့ရဖို့ app ကို နေရာ သုံးခုမှာ ထားပါတယ်။ app ကို run ထားပြီး
      အလုပ်လုပ်နေတဲ့ နေရာ တစ်ခုစီကို environment လို့ ခေါ်ပါတယ်။ [[mark:e-local]] ပထမက local ပါ။ ကိုယ့်စက်ပေါ်မှာ
      agent နဲ့ ပြင်ပြီး၊ စမ်းဖို့ လုပ်ထားတဲ့ test data နဲ့ စမ်းတဲ့ နေရာပါ။ [[mark:e-stag]] ဒုတိယက staging ပါ။
      customer တွေ သုံးမယ့် app နဲ့ ပုံစံတူ မိတ္တူ တစ်ခု ဖြစ်ပေမဲ့ ကိုယ်တို့ပဲ ဝင်သုံးပါတယ်။ ဒီမှာလည်း test data
      ပဲ ထည့်ပြီး၊ customer တွေရဲ့ ဖုန်းနံပါတ် အစစ်တွေကို ဒီ မိတ္တူထဲ မကူးပါဘူး။ [[mark:e-prod]] တတိယကတော့
      production ပါ။ တကယ့် customer တွေက တကယ့် အော်ဒါတွေ မှာနေတဲ့ နေရာပါ။ agent ကို စမ်းတဲ့ နေရာတွေမှာပဲ
      အလုပ်လုပ်ခိုင်းပြီး production ကို တိုက်ရိုက် ပြင်ခွင့် မပေးတာက၊ ပြီးခဲ့တဲ့ lesson က access ကို လိုသလောက်ပဲ
      ပေးဖို့ စည်းကမ်းနဲ့ အတူတူပါပဲ။ [[mark:e-deploy]] version တစ်ခုကို environment တစ်ခုရဲ့ server ပေါ် တင်တာကို
      deploy လုပ်တယ် လို့ ခေါ်ပါတယ်။ staging ပေါ် deploy လုပ်တာ မှားသွားရင် ကိုယ်တို့ပဲ မြင်ရပေမဲ့၊ production
      ပေါ်မှာ မှားရင်တော့ customer တွေ ချက်ချင်း မြင်ရပါတယ်။ [[mark:e-gate]] ဒါကြောင့် staging နဲ့ production
      ကြားမှာ တံခါး တစ်ခု ထားပါတယ်။ အဲဒီ တံခါးက ဒီနေ့ ရေးမယ့် checklist ပါ။ checklist ထဲက အချက်တွေ မပြည့်သေးရင်
      production ဆီ မဖြတ်ပါဘူး။
    sources:
      - {
          title: "Wikipedia: Deployment environment (local, staging, production)",
          url: "https://en.wikipedia.org/wiki/Deployment_environment",
        }
      - {
          title: "Google SRE book: Release Engineering (tests before deployment)",
          url: "https://sre.google/sre-book/release-engineering/",
        }
    actions:
      - {
          id: draw-e-title,
          type: whiteboard.apply,
          at: { mark: e-title },
          open: true,
          clear: true,
          upsertIds: [e-title],
