  title: "AI Builder 25: Environment နဲ့ release"
  locale: my-MM
  workspace:
    lessonType: javascript
    name: AI Builder
    entryFilePath: docs/plan.md
    sidebarStartsCollapsed: true
    files:
      docs/plan.md: |
        # Plan · v1

        | # | Task | Done when |
        |---|---|---|
        | 1 | form ကနေ အော်ဒါ တစ်ခု သိမ်းနိုင်တာ | AC-1 |
        | 2 | မှားတဲ့ input ကို ငြင်းတာ (အရေအတွက်၊ အချိန်၊ ဖုန်း) | AC-2, AC-3, AC-4 |
        | 3 | ကောင်တာစာရင်း | AC-5 |
        | 4 | နေ့စဉ် အော်ဒါနံပါတ် | Rules |
        | 5 | menu ပြင်ဖို့ admin စာမျက်နှာ | — |
        | 6 | staging ပေါ် တင်တာ | release checklist |

        - Task 5 ကို ဖယ်လိုက်ပြီ — menu ကို တစ်နှစ် အနည်းငယ်ပဲ ပြင်လို့ file ထဲမှာ ပြင်တာနဲ့ လုံလောက်တယ် (decisions.md ADR-003)
      docs/release-checklist.md: |+
        # Release checklist · ကြိုမှာ app

      notes.md: |
        # Notes
      package.json: |
        {
