# AI Builder, lesson 25: environments and release (Burmese, docs kind).
#
# Start state (ws/): base-docs (package.json with a no-op dev script, notes.md, unused),
# docs/plan.md as lesson 17 leaves it (row 6: staging, done when the release checklist passes) and
# docs/release-checklist.md pinned with only its title line. Nothing runs. The lesson writes
# docs/release-checklist.md (lesson-local, COURSE-KIT §4.17 outline; full text in DESIGN.md and
# _release-checklist-final.md): Before (test plan on staging, a cheap phone, backup, rollback written),
# During (after 10:00, never in the 7–9 rush; one person there), After (one real order, errors for
# 30 minutes, tell လှလှ).
#
# Boards: (E) local → staging → [checklist gate] → production, deploy glossed; (S) one big release vs
# small and often, feature flag; (Z) the quiz (6:45 a.m.: release now or after 10:00?). The During
# section is typed after the quiz, so no board or sentence before it carries the answer.
#
# Build: bun ~/Documents/ai-builder-course-work/tools/build-lesson.ts template.yaml ws ai-builder-25-release.yaml
schemaVersion: 1
