      - {
          id: draw-e-local,
          type: whiteboard.apply,
          at: { mark: e-local },
          upsertIds: [e-local-box, e-local, e-local-1, e-local-2],
          drawMs: 1400,
        }
      - {
          id: draw-e-stag,
          type: whiteboard.apply,
          at: { mark: e-stag },
          upsertIds: [e-ar1, e-stag-box, e-stag, e-stag-1, e-stag-2],
          drawMs: 1600,
        }
      - {
          id: draw-e-prod,
          type: whiteboard.apply,
