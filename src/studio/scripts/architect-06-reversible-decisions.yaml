  # provider chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 8106

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: second-wallet
    chapter: ဒုတိယ wallet
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ design တစ်ခုကို နောက်တစ်ခါ ပြောင်းရတာ လွယ်မလွယ်နဲ့ အကဲဖြတ်ခဲ့ပြီး၊ wallet အသစ် တစ်ခု
      ထည့်ရင် code နေရာ အများကြီး ပြင်ရမယ် ဆိုတာ တွေ့ခဲ့ပါတယ်။
      [[mark:w-open]] အဲဒီ ပြောင်းလဲမှုက ဒီအပတ်မှာ တကယ် ရောက်လာပါတယ်။ CTO ဖြစ်တဲ့ အောင်အောင် က သီတင်းကျွတ်
      လက်မှတ်တွေ မရောင်းခင် ဒုတိယ wallet တစ်ခုနဲ့ပါ ငွေချေလို့ရအောင် လုပ်ချင်ပါတယ်။ ဘယ်လောက် ကြာမလဲလို့လည်း
      မေးပါတယ်။
      [[mark:w-q1]] team ကတော့ ချက်ချင်း မဖြေရဲပါဘူး။ wallet ကုမ္ပဏီ နှစ်ခုနဲ့ ဆွေးနွေးနေတုန်းမို့ ဘယ်ကုမ္ပဏီ
      ဖြစ်မလဲ မသိသေးပါဘူး။
      [[mark:w-q2]] အသစ်ရဲ့ API က အခု သုံးနေတဲ့ wallet လိုပဲ အလုပ်လုပ်မလား ဆိုတာလည်း မသေချာပါဘူး။
      [[mark:w-q3]] team ထဲက developer မောင်မောင် အစိုးရိမ်ဆုံးကတော့ မှားရွေးမိရင် ဘာဖြစ်မလဲ ဆိုတာပါ။
      [[mark:w-fear]] ပထမ wallet ကို ထည့်တုန်းက သုံးလ ကြာခဲ့တာမို့၊ မှားရင် နောက်ထပ် သုံးလ ကုန်မှာကို
      စိုးရိမ်တာပါ။ ဒီလို အခါမျိုးမှာ လူတွေက နှစ်မျိုး လုပ်တတ်ပါတယ်။ သေချာတဲ့အထိ လနဲ့ချီ စဉ်းစားနေတာ၊
      ဒါမှမဟုတ် မသေချာဘဲနဲ့ သေချာသလို ကတိပေးလိုက်တာပါ။ နှစ်ခုလုံး မလိုဘဲ ရှေ့ဆက်နိုင်တဲ့ နည်းကို ဒီနေ့
      ကြည့်ပါမယ်။
    sources:
      - {
          title: "The Pragmatic Programmer, 20th Anniversary Edition (Thomas, Hunt)",
          url: "https://pragprog.com/titles/tpp20",
        }
    actions:
      - {
