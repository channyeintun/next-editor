    chapter: "Test environment ဆိုတာ"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ fake timers နဲ့ test ထဲက အချိန်ကို ကိုယ်တိုင် ထိန်းခဲ့ပါတယ်။ ဒီ
      lesson မှာတော့ test တွေ ဘယ်မှာ run လဲ၊ run တဲ့ နေရာ ပြောင်းရင် ဘာတွေ ပြောင်းသွားလဲ ဆိုတာကို
      ကြည့်ပါမယ်။ [[mark:draw-def]] test တစ်ခု run တဲ့ နေရာနဲ့ အဲဒီ နေရာမှာ သုံးလို့ရတဲ့ API တွေကို ပေါင်းပြီး
      test environment လို့ ခေါ်ပါတယ်။ JavaScript test တွေက အများအားဖြင့် Node ထဲမှာ ဒါမှမဟုတ်
      browser ထဲမှာ run ပြီး၊ နေရာ မတူရင် သုံးလို့ရတဲ့ API တွေလည်း မတူပါဘူး။ [[mark:draw-node]] Node
      ကတော့ server ဘက် code အတွက် ဆောက်ထားတာ ဖြစ်လို့၊ ကွန်ပျူတာထဲက ဖိုင်တွေကို ဖတ်လို့ ရေးလို့
      ရပါတယ်။ Vitest ၅ လိုအပ်တဲ့ Node ၂၂ နဲ့ အထက်မှာ network ကနေ data ယူတဲ့ fetch ရယ်၊ EventTarget
      ရယ်၊ WebSocket ရယ် ဆိုတဲ့ browser ဘက်ကလို API တွေလည်း ပါပါတယ်။ ဒါပေမဲ့ page ပေါ်က element တွေကို ဆောက်ဖို့ လိုတဲ့ document နဲ့ window ကတော့
      မရှိပါဘူး။ [[mark:draw-browser]] browser ထဲမှာကတော့ document နဲ့ window ရှိသလို fetch နဲ့
      WebSocket လည်း ရှိပါတယ်။ ဒါပေမဲ့ ကွန်ပျူတာထဲက ဖိုင်တွေကိုတော့ Node လို စိတ်ကြိုက် ဖတ်လို့ ရေးလို့
      မရပါဘူး။ ဥပမာအားဖြင့် ဆိုင်ရဲ့ menu ကို ဖိုင်ထဲကနေ ဖတ်တဲ့ test တစ်ခုက Node မှာ အလုပ်လုပ်ပေမဲ့၊
      browser ထဲမှာ run ရင်တော့ ဖိုင်ကို ဖတ်လို့ မရလို့ ကျသွားပါလိမ့်မယ်။ [[mark:draw-default]] Vitest က ဘာမှ မပြောထားရင် test တွေကို Node ထဲမှာ run
      ပါတယ်။ ဒါကြောင့် test တစ်ခု သုံးတဲ့ API တွေပေါ် မူတည်ပြီး၊ သူ run ရမယ့် environment ကို ကိုယ်တိုင်
      ရွေးပေးရပါတယ်။
    sources:
      - {
          title: "web.dev Learn Testing: The testing environment",
          url: "https://web.dev/learn/testing/get-started/testing-environment",
        }
      - {
          title: "Vitest: Test Environment (default node)",
          url: "https://vitest.dev/guide/environment",
        }
      - {
          title: "Node.js: Globals, fetch and WebSocket history (facts B03)",
          url: "https://nodejs.org/api/globals.html",
        }
      - {
          title: "Vitest: Migration guide, Vitest 5 needs Node 22.12+ (facts A01)",
          url: "https://vitest.dev/guide/migration/",
        }
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-def
        type: whiteboard.apply
        at: { mark: draw-def }
        upsertIds: [a-def]
        drawMs: 1500
      - id: draw-node
        type: whiteboard.apply
        at: { mark: draw-node }
        upsertIds: [a-node-box, a-node-head, a-node-1, a-node-2, a-node-3]
        drawMs: 4500
      - id: draw-browser
        type: whiteboard.apply
        at: { mark: draw-browser }
        upsertIds: [a-br-box, a-br-head, a-br-1, a-br-2, a-br-3]
        drawMs: 4500
      - id: draw-default
        type: whiteboard.apply
        at: { mark: draw-default }
        upsertIds: [a-default]
        drawMs: 1500

  - id: ladder
    narration: >
      [[mark:board-ladder]] ဒါဆို browser မှာ run မယ့် code ကို test လုပ်ချင်ရင် ဘယ်မှာ run မလဲ။ ရွေးစရာ
      သုံးမျိုး ရှိပါတယ်။ [[mark:draw-rungs]] ပထမက Node ထဲမှာ ရိုးရိုး run တာပါ။ ဒုတိယက Node ထဲမှာပဲ
      browser ရဲ့ DOM ကို အတုလုပ်ပေးတဲ့ library တစ်ခုနဲ့ run တာ ဖြစ်ပြီး၊ တတိယကတော့ browser အစစ်ကို
      ဖွင့်ပြီး အဲဒီထဲမှာ run တာပါ။ [[mark:draw-tradeoff]] ညာဘက်ကို သွားလေ၊ customer တွေ တကယ်
      သုံးတဲ့ browser နဲ့ ပိုတူလာလေ ဖြစ်ပေမဲ့၊ test တွေက ပိုနှေးပြီး setup လည်း ပိုလေးလာပါတယ်။ ဘယ်ဟာကို
      ရွေးမလဲ ဆိုတာ test က ဘာကို စစ်ချင်လဲ ဆိုတာပေါ် မူတည်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn Testing: Emulate browser APIs; Control a real browser",
          url: "https://web.dev/learn/testing/get-started/testing-environment#emulate_browser_apis",
        }
      - { title: "Vitest: Test Environment", url: "https://vitest.dev/guide/environment" }
    actions:
      - id: board-ladder
        type: whiteboard.apply
        at: { mark: board-ladder }
        clear: true
        upsertIds: [b-title]
      - id: draw-rungs
        type: whiteboard.apply
        at: { mark: draw-rungs }
        upsertIds:
          [
            b-node-box,
            b-node-1,
            b-node-2,
            b-arrow-1,
            b-dom-box,
            b-dom-1,
            b-dom-2,
            b-arrow-2,
            b-br-box,
            b-br-1,
            b-br-2,
          ]
        drawMs: 5500
      - id: draw-tradeoff
        type: whiteboard.apply
        at: { mark: draw-tradeoff }
        upsertIds: [b-real, b-slow]
        drawMs: 3000

  - id: starter
    narration: >
      [[mark:close-board]] ဆိုင်ရဲ့ code ကို ကြည့်ရအောင်။ ဒါက အော်ဒါ form ရဲ့ အောက်မှာ စုစုပေါင်း ငွေကို
      ပြပေးတဲ့ ဖိုင်ပါ။ [[mark:select-text]] ပထမ function က ငွေပမာဏကနေ ပြရမယ့် စာသားကို ထုတ်ပေးရုံပါ။
      DOM လည်း မလို၊ Node ရဲ့ API လည်း မလိုပါဘူး။ [[mark:select-create]] ဒုတိယ function ကတော့
      document ကို သုံးပြီး စာပိုဒ် element တစ်ခု ဆောက်၊ အထဲမှာ စာသား ထည့်ပြီး page ထဲကို ပေါင်းထည့်ပါတယ်။
      ဒါကြောင့် သူ့ကို document ရှိတဲ့ နေရာမှာပဲ run လို့ ရပါတယ်။ [[mark:open-test]] ဒါကတော့ သူ့ရဲ့ test
      ဖိုင်ပါ။ [[mark:select-render]] test က page ရဲ့ body ထဲကို ၄၈၀၀ ကျပ်ရဲ့ စုစုပေါင်း စာပိုဒ်ကို
      ထည့်ပြီး၊ စာသား မှန်လား စစ်ပါတယ်။ test ကိုယ်တိုင်ကလည်း document ကို သုံးနေတာကို သတိထား ကြည့်ပါ။
      [[mark:type-probe]] Vitest က ဒီ test တွေကို ဘယ်လို
      environment မှာ run နေလဲ သိရအောင်၊ console ထဲကို ထုတ်ပြတဲ့ test တစ်ခု ထည့်ကြည့်ပါမယ်။
      [[mark:select-probe]] type of နဲ့ fetch ကော၊ WebSocket ကော၊ document ကော ဘယ်လို အမျိုးအစား
      ဖြစ်လဲ ဆိုတာကို ထုတ်ခိုင်းတာပါ။ ရှိရင် function ဒါမှမဟုတ် object လို့ ပြပြီး၊ မရှိရင် undefined လို့
      ပြပါလိမ့်မယ်။ ဒီ test က ဘာမှ မစစ်ဘဲ ထုတ်ပြရုံ ဖြစ်လို့၊ အဖြေကို ကြည့်ပြီးရင် ဖျက်လို့ ရတဲ့ test ပါ။
    sources:
      - {
          title: "web.dev Learn Testing: The runtime environment",
          url: "https://web.dev/learn/testing/get-started/testing-environment#the_runtime_environment",
        }
      - {
          title: "MDN: typeof",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/typeof",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: select-text
        type: editor.select
        at: { mark: select-text }
        target:
          { file: src/total-view.js, text: "export function totalText(total) {", occurrence: 1 }
      - id: select-create
        type: editor.select
        at: { mark: select-create }
        target: { file: src/total-view.js, text: 'document.createElement("p")', occurrence: 1 }
      - id: open-test
        type: workspace.openFile
        at: { mark: open-test }
        path: src/total-view.test.js
      - id: select-render
        type: editor.select
        at: { mark: select-render }
        target:
          { file: src/total-view.test.js, text: "renderTotal(document.body, 4800)", occurrence: 1 }
      - id: type-probe
        type: editor.type
        at: { mark: type-probe }
        target:
          {
            file: src/total-view.test.js,
            after: "  expect(p.textContent).toBe(\"စုစုပေါင်း 4,800 ကျပ်\");\n});\n",
            occurrence: 1,
          }
        text: "\ntest(\"lists what this environment has\", () => {\n  console.log(\"fetch\", typeof fetch);\n  console.log(\"WebSocket\", typeof WebSocket);\n  console.log(\"document\", typeof document);\n});\n"
        # Typed before the runtime is ready (the editor needs none, PLATFORM.md §7); one block, so the
        # first report the panel opens on already holds its answer.
        cadence: block
      - id: select-probe
        type: editor.select
        at: { mark: select-probe }
        target:
          {
            file: src/total-view.test.js,
            text: "console.log(\"fetch\", typeof fetch);\n  console.log(\"WebSocket\", typeof WebSocket);\n  console.log(\"document\", typeof document);",
            occurrence: 1,
          }

  - id: panel
    narration: >
      [[mark:ready]] ညာဘက်က Vitest panel ကလည်း code ပြောင်းတိုင်း သူ့ဘာသာ ပြန် run တဲ့ တကယ့် Vitest
      ရဲ့ ရလဒ်ပါ။ [[mark:read-tree]] အပေါ်က အနီရောင် FAIL နဲ့အတူ၊ test နှစ်ခုထဲက စုစုပေါင်း စာပိုဒ် test က
      ကြက်ခြေခတ်နဲ့ ကျနေပြီး၊ ထုတ်ပြတဲ့ test ကတော့ pass ဖြစ်နေပါတယ်။ [[mark:read-console]] ဒီတစ်ခါ panel မှာ console output
      အပိုင်း ပါလာပါပြီ။ test တွေက console ထဲကို ထုတ်တဲ့ စာတွေကို ဒီ stdout block မှာ ပြတာပါ။ fetch
      နဲ့ WebSocket က function ဖြစ်ပေမဲ့၊ document ကတော့ undefined လို့ ပြနေပါတယ်။ [[mark:read-fail]]
      သူ့အောက်က Failed Tests အပိုင်းမှာလည်း document ဆိုတာ မသတ်မှတ်ရသေးဘူး ဆိုတဲ့ ReferenceError
      ပေါ်နေပြီး၊ code frame က test ထဲမှာ document ကို စ သုံးတဲ့ line ကို ညွှန်ပြနေပါတယ်။
    sources:
      - { title: "Vitest: Test Environment", url: "https://vitest.dev/guide/environment" }
      - {
          title: "Vitest: environment, default node (facts A06)",
          url: "https://vitest.dev/config/environment",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-start-fail
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 3, delayMs: 1500 }
      - id: expect-start-console
        type: expect.preview
        at: { afterAction: expect-start-fail }
        timeoutMs: 8000
        target: { by: testId, value: vt-log-1 }
        attribute:
          { name: data-content, value: "fetch function\nWebSocket function\ndocument undefined" }
        retry: { maxAttempts: 3, delayMs: 1000 }
      - id: expect-start-probe
        type: expect.preview
        at: { afterAction: expect-start-console }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-2 }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-message
        type: expect.preview
        at: { afterAction: expect-start-probe }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-message, value: "document is not defined" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-reference
        type: expect.preview
        at: { afterAction: expect-start-message }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-name, value: ReferenceError }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-document
        type: editor.select
        at: { mark: read-fail }
        target: { file: src/total-view.test.js, text: "document.body", occurrence: 1 }
      - id: expect-frame
        type: expect.preview
        at: { afterAction: select-document }
        timeoutMs: 5000
        target: { by: testId, value: vt-frame-1 }
        attribute: { name: data-line, value: "5" }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: node
    chapter: "Node မှာ ဘာ ရှိလဲ"
    narration: >
      console က ပြောနေတာက၊ ဒီ test တွေ run နေတဲ့ နေရာက Vitest ရဲ့ default ဖြစ်တဲ့ Node ဆိုတာပါ။ fetch
      နဲ့ WebSocket ပါတာက Node ၂၂ နဲ့ အထက်မှာ သူတို့ကို global အဖြစ် ထည့်ပေးထားလို့ပါ။ အရင် Node
      version တွေမှာ WebSocket ကို library သီးသန့် ထည့်သုံးရပေမဲ့၊ Vitest ၅ က Node ၂၂ ဒသမ ၁၂ နဲ့
      အထက်ကိုပဲ လက်ခံလို့ အခု မလိုတော့ပါဘူး။ document ကတော့ browser က ပေးတာ ဖြစ်လို့ Node မှာ
      မရှိတာပါ။ [[mark:type-node-test]] စာသား ထုတ်ပေးတဲ့ function ကိုတော့ DOM မလိုလို့ ဘယ်
      environment မှာမဆို စစ်လို့ ရပါတယ်။ သူ့ကို import လုပ်ပြီး test တစ်ခု ထည့်ကြည့်ရအောင်။
      [[mark:read-node]] panel ကို ကြည့်ပါ။ test အသစ်က Node ထဲမှာပဲ pass ဖြစ်ပြီး၊ စာပိုဒ် test ကတော့
      ကျနေတုန်းပါ။ ဈေးနှုန်း တွက်တာ၊ စာသား ပုံစံ ချတာလို ဆိုင်ရဲ့ logic တွေကို DOM နဲ့ မရောဘဲ ခွဲထားရင်၊
      ဘယ်မှာမဆို မြန်မြန် test လုပ်လို့ ရပါတယ်။
    sources:
      - {
          title: "Node.js: Globals, fetch and WebSocket (facts B03)",
          url: "https://nodejs.org/api/globals.html",
        }
      - {
          title: "web.dev Learn Testing: Test algorithmic or business logic",
          url: "https://web.dev/learn/testing/get-started/testing-environment#test_algorithmic_or_business_logic",
        }
    actions:
      - id: type-import-text
        type: editor.type
        at: { mark: type-node-test }
        target: { file: src/total-view.test.js, after: "import { renderTotal", occurrence: 1 }
        text: ", totalText"
      - id: type-node-test
        type: editor.type
        at: { afterAction: type-import-text }
        target:
          {
            file: src/total-view.test.js,
            after: "  console.log(\"document\", typeof document);\n});\n",
            occurrence: 1,
          }
        text: "\ntest(\"formats the total\", () => {\n  expect(totalText(4800)).toBe(\"စုစုပေါင်း 4,800 ကျပ်\");\n});\n"
        cadence: block
      - id: expect-node-two
        type: expect.preview
        at: { afterAction: type-node-test }
        timeoutMs: 8000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "2" }
        retry: { maxAttempts: 3, delayMs: 2000 }
      - id: expect-node-test
        type: expect.preview
        at: { afterAction: expect-node-two }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-3 }
        attribute: { name: data-name, value: "formats the total" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-dom-still-fails
        type: expect.preview
        at: { afterAction: expect-node-test }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-failed, value: "1" }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: happy-dom
    chapter: "DOM အတုကို ဖွင့်ရအောင်"
    narration: >
      စာပိုဒ် test ကိုတော့ document လိုပါတယ်။ browser အစစ် မဖွင့်ဘဲ Node ထဲမှာပဲ browser ရဲ့ DOM ကို
      အတုလုပ်ပေးတဲ့ library တွေ ရှိပါတယ်။ Vitest က အဆင်သင့် လက်ခံတဲ့ နှစ်ခုက jsdom နဲ့
      happy dom ဖြစ်ပြီး၊ jsdom ကတော့ ဆယ်နှစ်ကျော် ရှိနေပါပြီ။ ဒီ course မှာတော့ ပိုမြန်တဲ့ happy dom ကို
      သုံးပါမယ်။ နှစ်ခုလုံး Vitest နဲ့ အတူ မပါလာလို့ package
      သီးသန့် install လုပ်ရပြီး၊ ဒီ project မှာတော့ happy dom package ကို ထည့်ထားပြီးသားပါ။
      [[mark:open-config]] Vitest ရဲ့ config ဖိုင်ကို ဖွင့်ပါမယ်။ [[mark:select-empty]] test အပိုင်းက
      အလွတ် ဖြစ်နေလို့ environment က default ဖြစ်တဲ့ Node ပါ။ [[mark:type-env]] environment ဆိုတဲ့
      option ကို happy dom လို့ line တစ်ကြောင်း ထည့်ပါမယ်။ config ပြောင်းလိုက်တာနဲ့ Vitest က setting
      အသစ်နဲ့ ပြန်စပြီး၊ test အားလုံးကို ပြန် run ပါတယ်။ [[mark:read-pass]] test သုံးခုလုံး pass ဖြစ်ပြီး
      အစိမ်းရောင် PASS ပေါ်လာပါပြီ။ test ကိုရော ဆိုင်ရဲ့ code ကိုရော တစ်ကြောင်းမှ မပြင်ဘဲ၊ config
      တစ်ကြောင်း ထည့်လိုက်ရုံနဲ့ စာပိုဒ် test က pass သွားတာပါ။
      [[mark:read-object]] console မှာလည်း document က undefined ကနေ object ဖြစ်သွားပါပြီ။ happy dom
      က document နဲ့ window ကို Node ထဲမှာ ဆောက်ပေးလိုက်လို့ပါ။ [[mark:board-ways]] DOM အတုကို
      ဖွင့်တဲ့ နည်း နှစ်မျိုး ရှိပါတယ်။ [[mark:draw-project]] ခုနကလို config ဖိုင်မှာ ရေးရင် project ထဲက test
      ဖိုင် အားလုံးအတွက် ဖြစ်ပါတယ်။ [[mark:draw-file]] ဖိုင် တစ်ဖိုင်အတွက်ပဲ ဆိုရင်တော့၊ အဲဒီ ဖိုင်ရဲ့
      ထိပ်ဆုံးမှာ vitest environment ဆိုတဲ့ comment နဲ့ environment နာမည်ကို ရေးလို့ ရပါတယ်။ ဒီ
      course မှာတော့ config ဖိုင်ကိုပဲ သုံးပါမယ်။ [[mark:draw-swap]] jsdom ကို သုံးချင်ရင်တော့ jsdom
      package ကို install လုပ်ပြီး၊ config ထဲက နာမည်ကို jsdom လို့ ပြောင်းရုံပါပဲ။
    sources:
      - {
          title: "web.dev Learn Testing: Emulate browser APIs",
          url: "https://web.dev/learn/testing/get-started/testing-environment#emulate_browser_apis",
        }
      - {
          title: "Vitest: environment option (facts A06, B04)",
          url: "https://vitest.dev/config/environment",
        }
      - {
          title: "Vitest: Test Environment, the per-file comment",
          url: "https://vitest.dev/guide/environment",
        }
      - {
          title: "jsdom on npm, published since 2011 (facts B05)",
          url: "https://www.npmjs.com/package/jsdom",
        }
    actions:
      - id: open-config
        type: workspace.openFile
        at: { mark: open-config }
        path: vitest.config.js
      - id: select-empty
        type: editor.select
        at: { mark: select-empty }
        target: { file: vitest.config.js, text: "  test: {\n  },", occurrence: 1 }
      - id: type-env
        type: editor.type
        at: { mark: type-env }
        target: { file: vitest.config.js, after: "  test: {\n", occurrence: 1 }
        text: "    environment: \"happy-dom\",\n"
        # A whole, valid option line as one block (PLATFORM.md §5): Vitest restarts, no page reload.
        cadence: block
      - id: expect-dom-pass
        type: expect.preview
        at: { afterAction: type-env }
        timeoutMs: 10000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 2000 }
      - id: expect-three-passed
        type: expect.preview
        at: { afterAction: expect-dom-pass }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "3" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-object
        type: expect.preview
        at: { afterAction: expect-three-passed }
        timeoutMs: 5000
        target: { by: testId, value: vt-log-1 }
        attribute:
          { name: data-content, value: "fetch function\nWebSocket function\ndocument object" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: board-ways
        type: whiteboard.apply
        at: { mark: board-ways }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-project
        type: whiteboard.apply
        at: { mark: draw-project }
        upsertIds: [c-proj-box, c-proj-1, c-proj-2]
        drawMs: 2500
      - id: draw-file
        type: whiteboard.apply
        at: { mark: draw-file }
        upsertIds: [c-file-box, c-file-1, c-file-2]
        drawMs: 2500
      - id: draw-swap
        type: whiteboard.apply
        at: { mark: draw-swap }
        upsertIds: [c-swap-box, c-swap-1, c-swap-2]
        drawMs: 2500

  - id: limits
    chapter: "DOM အတုမှာ ဘာ မပါလဲ"
    narration: >
      DOM အတုမှာ မပါတာ တစ်ခု ရှိပါတယ်။ [[mark:open-test-2]] test ဖိုင်ကို ပြန်ဖွင့်ပါမယ်။
      [[mark:type-width]] စာပိုဒ်ကို page ထဲ ထည့်ပြီး၊ သူ့ရဲ့ အကျယ်နဲ့ window ရဲ့ အကျယ်ကို ထုတ်ပြတဲ့ test
      တစ်ခု ထည့်ပါမယ်။ [[mark:read-width]] console ကို ကြည့်ပါ။ စာပိုဒ်ရဲ့ အကျယ်က သုည ဖြစ်ပြီး၊ window
      ရဲ့ အကျယ်ကတော့ ၁၀၂၄ pixel လို့ ပြနေပါတယ်။ window ရဲ့ ၁၀၂၄ က happy dom က ကြိုသတ်မှတ်ထားတဲ့
      တန်ဖိုး တစ်ခုပါ။ စာပိုဒ်ကတော့ တကယ် တွက်ရမှာ ဖြစ်ပေမဲ့၊ DOM အတုမှာ element တွေကို screen ပေါ်မှာ
      နေရာချပြီး ဆွဲပေးတဲ့ layout engine မပါလို့ သုည ဖြစ်နေတာပါ။ ဆိုလိုတာက element တစ်ခု ဘယ်လောက်
      ကြီးလဲ၊ ဘယ်နေရာမှာ ရှိလဲ၊ CSS ကြောင့် ဘယ်လို ပုံပေါ်လဲ ဆိုတာကို DOM အတုက မသိပါဘူး။
      [[mark:keep-small]] browser အစစ်နဲ့ သိပ် မသိသာတဲ့ ကွာခြားချက်လေးတွေလည်း ရှိနိုင်လို့၊ DOM အတုနဲ့
      ရေးတဲ့ test တစ်ခုကို element နည်းနည်းနဲ့ အလုပ်လုပ်ပုံ တစ်ခုကိုပဲ စစ်ခိုင်းထားတာ ကောင်းပါတယ်။
    sources:
      - {
          title: "web.dev Learn Testing: Emulate browser APIs (no layout engine; keep these tests concise)",
          url: "https://web.dev/learn/testing/get-started/testing-environment#emulate_browser_apis",
        }
      - {
          title: "jsdom README: no layout or rendering (facts B06)",
          url: "https://github.com/jsdom/jsdom#unimplemented-parts-of-the-web-platform",
        }
      - {
          title: "Vitest: Test Environment, happy-dom lacks some APIs",
          url: "https://vitest.dev/guide/environment",
        }
    actions:
      - id: close-ways
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-test-2
        type: workspace.openFile
        at: { mark: open-test-2 }
        path: src/total-view.test.js
      - id: type-width
        type: editor.type
        at: { mark: type-width }
        target:
          {
            file: src/total-view.test.js,
            after: "  expect(totalText(4800)).toBe(\"စုစုပေါင်း 4,800 ကျပ်\");\n});\n",
            occurrence: 1,
          }
        text: "\ntest(\"has no layout\", () => {\n  const p = renderTotal(document.body, 4800);\n  console.log(\"p width\", p.offsetWidth);\n  console.log(\"window width\", window.innerWidth);\n});\n"
        cadence: block
      - id: expect-four-passed
        type: expect.preview
        at: { afterAction: type-width }
        timeoutMs: 8000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "4" }
        retry: { maxAttempts: 3, delayMs: 2000 }
      - id: expect-width
        type: expect.preview
        at: { afterAction: expect-four-passed }
        timeoutMs: 5000
        target: { by: testId, value: vt-log-2 }
        attribute: { name: data-content, value: "p width 0\nwindow width 1024" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-config-file
        type: expect.file
        at: { mark: keep-small }
        path: vitest.config.js
        contains: "  test: {\n    environment: \"happy-dom\",\n  },"
      - id: expect-test-file
        type: expect.file
        at: { afterAction: expect-config-file }
        path: src/total-view.test.js
        contains: "  console.log(\"p width\", p.offsetWidth);\n  console.log(\"window width\", window.innerWidth);"

  - id: browsers
    narration: >
      [[mark:board-browsers]] layout နဲ့ မြင်ရတဲ့ ပုံစံ၊ gesture တွေကို စစ်ချင်ရင်၊ ဒါမှမဟုတ် customer လုပ်သလို
      page တစ်ခုလုံးကို အစကနေ အဆုံးထိ စစ်ချင်ရင်တော့ browser အစစ် လိုပါတယ်။ [[mark:draw-tools]]
      Playwright ဒါမှမဟုတ် WebdriverIO လို tool တွေက browser အစစ်ကို ဖွင့်ပြီး၊ page သွား၊ ခလုတ် နှိပ်၊
      စာ ရိုက်တာတွေကို code နဲ့ ထိန်းပေးပါတယ်။ [[mark:draw-mode]] Vitest မှာတော့ browser အစစ်က environment
      option တစ်ခု မဟုတ်ဘဲ Browser Mode ဆိုတဲ့ သီးသန့် mode ဖြစ်ပြီး၊ Vitest ၄ ကစပြီး stable ဖြစ်လာပါပြီ။ test တွေကို browser အစစ်ထဲမှာ run ပေးပြီး၊ module mock
      တွေလည်း အလုပ်လုပ်ပါတယ်။ [[mark:draw-headless]] CI မှာတော့ screen မပြဘဲ run တဲ့ headless browser
      ကို သုံးကြပါတယ်။ browser တွေကို ကိုယ့်ကိုယ်စား run ပေးတဲ့ ပိုက်ဆံပေးရ service တွေကို သုံးတာလည်း
      ရှိပါတယ်။ ဒီ lesson ထဲမှာ browser အစစ်ကို ဖွင့်ပြလို့ မရလို့၊ ကိုယ့် ကွန်ပျူတာမှာ
      စမ်းကြည့်ပါ။ [[mark:draw-rules]] ဒါဆို ဘယ်ဟာ ရွေးမလဲ။ ဆိုင်ရဲ့ ဈေးနှုန်း တွက်တာလို DOM မလိုတဲ့
      test ဆိုရင် ဘယ် environment မှာ run run ရပါတယ်။ အော်ဒါ form လို component သေးသေးလေး တစ်ခုကိုတော့
      DOM အတုနဲ့ စစ်လို့ ရပြီး၊ customer တစ်ယောက် menu ကနေ ရွေးပြီး အော်ဒါ တင်တဲ့အထိ အစကနေ အဆုံး
      စစ်တဲ့ end to end test တွေကိုတော့ browser အစစ်မှာ run တာ အကောင်းဆုံးပါ။
    sources:
      - {
          title: "web.dev Learn Testing: Control a real browser; In practice",
          url: "https://web.dev/learn/testing/get-started/testing-environment#control_a_real_browser",
        }
      - {
          title: "Vitest: Browser Mode, providers and CI (facts A23)",
          url: "https://vitest.dev/guide/browser/",
        }
      - {
          title: "Vitest 4: Browser Mode is stable (facts B14)",
          url: "https://vitest.dev/blog/vitest-4",
        }
      - {
          title: "Vitest: Browser Mode, module mocking and spying (facts A24, B01)",
          url: "https://vitest.dev/guide/browser/#spying-on-module-exports",
        }
    actions:
      - id: board-browsers
        type: whiteboard.apply
        at: { mark: board-browsers }
        open: true
        clear: true
        upsertIds: [d-title]
      - id: draw-tools
        type: whiteboard.apply
        at: { mark: draw-tools }
        upsertIds: [d-tools-box, d-tools]
        drawMs: 2500
      - id: draw-mode
        type: whiteboard.apply
        at: { mark: draw-mode }
        upsertIds: [d-mode]
        drawMs: 2000
      - id: draw-headless
        type: whiteboard.apply
        at: { mark: draw-headless }
        upsertIds: [d-headless]
        drawMs: 1500
      - id: draw-rules
        type: whiteboard.apply
        at: { mark: draw-rules }
        upsertIds: [d-rules-box, d-rule-1, d-rule-2, d-rule-3]
        drawMs: 4500

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:close-browsers]] ဒါဆို ပြန်ချုပ်ရရင်၊ test environment ဆိုတာ test run တဲ့ နေရာနဲ့ အဲဒီမှာ ရှိတဲ့
      API တွေပါ။ Vitest ရဲ့ default က Node ဖြစ်လို့ fetch နဲ့ WebSocket ရှိပေမဲ့ document မရှိပါဘူး။
      [[mark:recap-dom]] DOM လိုတဲ့ test တွေအတွက် config ထဲမှာ environment ကို happy dom ဒါမှမဟုတ်
      jsdom လို့ ပေးရင် Node ထဲမှာ DOM အတု ရပါတယ်။ ဒါပေမဲ့ layout မပါလို့ အရွယ်အစားတွေက သုည
      ဖြစ်နေပြီး၊ layout နဲ့ end to end ကို စစ်ဖို့ကတော့ browser အစစ် လိုပါတယ်။ နောက် lesson မှာတော့
      Testing Library နဲ့ ဆိုင်ရဲ့ form ကို customer တစ်ယောက် သုံးသလို test လုပ်ကြည့်ပါမယ်။
    sources:
      - {
          title: "web.dev Learn Testing: The testing environment, check your understanding",
          url: "https://web.dev/learn/testing/get-started/testing-environment#check_your_understanding",
        }
      - { title: "Vitest: Test Environment", url: "https://vitest.dev/guide/environment" }
    actions:
      - id: close-browsers
        type: whiteboard.apply
        at: { mark: close-browsers }
        open: false
checks:
  - { type: timing.p95Ms, max: 300 }
