      src/total-view.js: |
        // The total line under the shop's order form.
        export function totalText(total) {
          return `စုစုပေါင်း ${total.toLocaleString("en-US")} ကျပ်`;
        }

        export function renderTotal(root, total) {
          const p = document.createElement("p");
          p.textContent = totalText(total);
          root.append(p);
          return p;
        }
      src/total-view.test.js: |
        import { expect, test } from "vitest";
        import { renderTotal } from "./total-view.js";

        test("shows the total on the page", () => {
          const p = renderTotal(document.body, 4800);
          expect(p.textContent).toBe("စုစုပေါင်း 4,800 ကျပ်");
        });
      vite.config.js: |
        import { defineConfig } from "vite";
        import courseVitestBridge from "./course/vitest-bridge.js";

        // The course panel: the dev server runs the real Vitest and the preview shows its results.
        export default defineConfig({
          plugins: [courseVitestBridge()],
        });
