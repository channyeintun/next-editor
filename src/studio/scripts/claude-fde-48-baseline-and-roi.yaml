build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 9348

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: need
    chapter: ဘာနဲ့ ယှဉ်တာလဲ
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ pilot ကို design ဆွဲခဲ့ပါတယ်။ cohort၊ scope၊ ကြာချိန်နဲ့ success criteria ကို ပထမ
      နေ့ မတိုင်ခင် ရေးပြီး၊ ရက် ၃၀ ပြည့်တဲ့နေ့မှာ ဆုံးဖြတ်ချက် ချမယ်လို့ သတ်မှတ်ခဲ့ပါတယ်။
      [[mark:cto]] အဲဒီ စာမျက်နှာကို ဖတ်ပြီးတော့ CTO ဖြစ်တဲ့ အောင်အောင် က သတိပေးချက် တစ်ခု ပြောပါတယ်။
      ဒါရိုက်တာ အဖွဲ့ ရှေ့မှာ ပိုမြန်သွားပြီလို့ ပြောလိုက်တာနဲ့၊ ဘာထက် ပိုမြန်တာလဲ လို့ ချက်ချင်း မေးကြမယ်တဲ့။
      [[mark:sel-title]] ပိုမြန်တယ် ဆိုတာ ယှဉ်ပြီး ပြောတဲ့ စကားပါ။ ယှဉ်ဖို့ဆိုရင် မစခင်က ဂဏန်း လိုပါတယ်။ အဲဒါကို
      baseline လို့ ခေါ်ပါတယ်။ baseline ဆိုတာ မစခင်က တိုင်းထားတဲ့ မူလ အခြေအနေပါ။ Anthropic ရဲ့ FDE learning
      path ဖော်ပြချက်မှာလည်း pilot မတိုင်ခင်က data မရှိရင် စားကိန်း မရှိဘူး ဆိုတဲ့ သဘော ပါပါတယ်။
      [[mark:roi]] ဒီနေ့ Delivery Plan Pack ရဲ့ တတိယ စာမျက်နှာ ဖြစ်တဲ့ ROI scorecard ကို ရေးပါမယ်။ return on
      investment၊ အတိုကောက် ROI ဆိုတာ ကုန်ကျတာနဲ့ ယှဉ်ရင် ဘယ်လောက် အကျိုးရှိလဲ ဆိုတာပါ။ ROI ကို ယုံကြည်ရအောင်
      ပြောနိုင်ဖို့ မေးခွန်း သုံးခုကို ဖြေရပါမယ်။ ဘာနဲ့ ယှဉ်မလဲ၊ ဘာကို တိုင်းမလဲ၊ ကုန်ကျတာနဲ့ ချွေတာတာကို
      ဘယ်လို တွက်မလဲ ဆိုတာပါ။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
    actions:
      - {
          id: open-roi,
          type: workspace.openFile,
          at: { scene: start },
          path: notebook/48-roi-scorecard.md,
        }
      - id: sel-title
        type: editor.select
        at: { mark: sel-title }
        target:
          file: notebook/48-roi-scorecard.md
          text: "## Baseline နဲ့ target (Day 1 မတိုင်ခင် ယူ)"
      - id: sel-roi
        type: editor.select
        at: { mark: roi }
        target:
          file: notebook/48-roi-scorecard.md
          text: "# Delivery Plan Pack · 3. ROI scorecard"

  - id: two-bars
    chapter: Baseline
    narration: >
      [[mark:b-title]] ပထမ မေးခွန်းကို report job ရွှေ့တဲ့ အလုပ်ရဲ့ ဂဏန်း နှစ်ခုနဲ့ ကြည့်ရအောင်။
      [[mark:b-hand]] ပထမ ဂဏန်းက လက်နဲ့ လုပ်ရင် ကြာမယ့် အချိန်ပါ။ developer ငါးယောက် ရှစ်ပတ်၊ ဆိုလိုတာက developer
      week ၄၀ ပါ။ developer week ဆိုတာ developer တစ်ယောက် တစ်ပတ် လုပ်တဲ့ အလုပ်ကို တစ်ခုလို့ ရေတွက်တာပါ။ ဒါက
      ကိုယ်တို့ရဲ့ baseline ပါ။
      [[mark:b-goal]] ဒုတိယ ဂဏန်းက ရည်မှန်းချက်ပါ။ developer နှစ်ယောက် သုံးပတ်၊ developer week ခြောက်ခုပါ။ ဒီ
      ဂဏန်း နှစ်ခုကြားက ကွာခြားချက်က ဒါရိုက်တာ အဖွဲ့ကို ပြောမယ့် ပုံပြင်ပါ။
      [[mark:b-weak]] ဒါပေမဲ့ သတိထားရမယ့် အချက် တစ်ခု ရှိပါတယ်။ ၄၀ ဆိုတာ တိုင်းထားတဲ့ ဂဏန်း မဟုတ်ဘဲ
      ခန့်မှန်းချက်ပါ။ ပိုမြန်ပါတယ်လို့ ပြောတဲ့အချိန်မှာ၊ ဒီ ခန့်မှန်းချက်က အစကတည်းက များနေတာ မဟုတ်လား လို့
      တစ်ယောက်ယောက်က မေးလာနိုင်ပါတယ်။
      [[mark:b-check]] ဒါကြောင့် ပထမ နေ့ မတိုင်ခင်မှာ Billing developer နှစ်ယောက်က job သုံးခုကို လက်နဲ့ပဲ
      စမ်းရွှေ့ကြည့်ပြီး အချိန် မှတ်ပါမယ်။ အချိန် တိုင်းဖို့ သက်သက်မို့ အဲဒီ ပြောင်းလဲမှုကို merge မလုပ်ပါဘူး။ အဲဒီ ဂဏန်းက
      ခန့်မှန်းချက်ကို စစ်ပေးပါတယ်။ ပထမ နေ့ ကျော်ပြီးရင်တော့ ဒီလို
      တိုင်းလို့ မရတော့ပါဘူး။ လူတွေရဲ့ အလုပ်လုပ်ပုံက Claude Code နဲ့ ပြောင်းသွားပြီ ဖြစ်လို့ပါ။ Claude Code ဆိုတာ
      terminal ထဲကနေ code ကို ဖတ်၊ ပြင်၊ command run ပေးတဲ့ coding agent ပါ။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
    actions:
      - {
          id: draw-b-title,
          type: whiteboard.apply,
          at: { mark: b-title },
          open: true,
          clear: true,
          upsertIds: [b-title],
        }
      - {
          id: draw-b-hand,
          type: whiteboard.apply,
          at: { mark: b-hand },
          upsertIds: [b-unit, b-hand, b-base, b-hand-l, b-hand-u],
          drawMs: 1800,
        }
      - {
          id: draw-b-goal,
          type: whiteboard.apply,
          at: { mark: b-goal },
          upsertIds: [b-goal, b-goal-l, b-goal-u],
          drawMs: 1200,
        }
      - {
          id: point-b-hand,
          type: whiteboard.point,
          at: { mark: b-weak },
          target: { assetId: b-hand-l },
        }

  - id: measures
    chapter: ဘာကို တိုင်းမလဲ
    narration: >
      [[mark:m-title]] ဒုတိယ မေးခွန်းက ဘာကို တိုင်းမလဲ ဆိုတာပါ။ ဂဏန်း ရှိရုံနဲ့ မလုံလောက်ဘဲ မှန်တဲ့ ဂဏန်းကို
      ရွေးဖို့လည်း လိုပါတယ်။
      [[mark:m-activity]] AI tool တွေနဲ့ ပတ်သက်ရင် လူအများဆုံး ပြတတ်တဲ့ ဂဏန်းက AI ရေးပေးတဲ့ code line အရေအတွက်နဲ့
      commit အရေအတွက်ပါ။ ဒါတွေက လုပ်ဆောင်မှု ဘယ်လောက် များလဲ ဆိုတာကို ပြတဲ့ activity ဂဏန်းတွေပါ။
      [[mark:m-strike]] Anthropic ရဲ့ ROI လမ်းညွှန်ကိုယ်တိုင်က code line အရေအတွက်ကို အားကိုးလို့ မရတဲ့ metric
      လို့ ခေါ်ပါတယ်။ developer productivity ကို လေ့လာတဲ့ နာမည်ကြီး သုတေသန တစ်ခုကလည်း၊ ဂဏန်း တစ်ခုတည်းနဲ့
      productivity ကို မဖော်ပြနိုင်ဘူး၊ activity ဂဏန်းတွေက အသုံးဝင်ပေမဲ့ ပြောနိုင်တာ နည်းတယ်လို့ ဆိုပါတယ်။ job
      တစ်ခုကို ပြန်ပြင်ရတိုင်း code line နဲ့ commit တွေ တိုးလာပေမဲ့ အလုပ်က ရှေ့မရောက်ပါဘူး။
      [[mark:m-outcome]] ကိုယ်တို့ တိုင်းမှာက outcome ဂဏန်းတွေ၊ ဆိုလိုတာက အလုပ်ရဲ့ ရလဒ်ကို ပြတဲ့ ဂဏန်းတွေပါ။ စစ်ပြီးသား job အရေအတွက်နဲ့ merge အထိ ကြာချိန်က အလုပ် ဘယ်လောက် မြန်လဲ ပြပြီး၊ review မှာ ပြန်ပြင်ရတာကတော့ မြန်တာကြောင့် အရည်အသွေး ကျသွားလား ဆိုတာကို စောင့်ကြည့်ပေးပါတယ်။
      [[mark:m-tension]] software delivery ကို တိုင်းတဲ့ နောက်ထပ် လမ်းညွှန် တစ်ခုကလည်း၊ ဂဏန်း တစ်ခုကို ပစ်မှတ်
      လုပ်လိုက်တာနဲ့ လူတွေက အဲဒီ ဂဏန်းကိုပဲ တက်အောင် လုပ်တတ်လို့၊ အချင်းချင်း ဆွဲထိန်းတဲ့ ဂဏန်း အများကြီးကို
      တွဲသုံးဖို့ အကြံပြုပါတယ်။ မြန်နှုန်းကို ပြတဲ့ ဂဏန်းနဲ့ ပြန်ပြင်ရတာကို ပြတဲ့ ဂဏန်းကို တွဲထားတာ ဒါကြောင့်ပါ။
    sources:
      - {
          title: "Claude: measuring ROI of agentic coding",
          url: "https://claude.com/resources/guides/scaling-agentic-coding-across-your-organization/measuring-roi",
        }
      - {
          title: "The SPACE of developer productivity (Forsgren et al., ACM Queue 2021)",
          url: "https://www.microsoft.com/en-us/research/?p=733804",
        }
      - {
          title: "DORA: software delivery performance metrics",
          url: "https://dora.dev/guides/dora-metrics/",
        }
    actions:
      - {
          id: draw-m-title,
          type: whiteboard.apply,
          at: { mark: m-title },
          clear: true,
          upsertIds: [m-title],
        }
      - {
          id: draw-m-act,
          type: whiteboard.apply,
          at: { mark: m-activity },
          upsertIds: [m-act, m-act-1, m-act-2],
          drawMs: 1200,
        }
      - {
          id: draw-m-strike,
          type: whiteboard.apply,
          at: { mark: m-strike },
          upsertIds: [m-strike-1, m-strike-2],
          drawMs: 900,
        }
      - {
          id: draw-m-out,
          type: whiteboard.apply,
          at: { mark: m-outcome },
          upsertIds: [m-out, m-out-1, m-out-2, m-out-3],
          drawMs: 1600,
        }
      - {
          id: draw-m-tension,
          type: whiteboard.apply,
          at: { mark: m-tension },
          upsertIds: [m-tension],
          drawMs: 900,
        }

  - id: feeling
    narration: >
      [[mark:p-feel]] developer တွေ ကိုယ်တိုင် ဘယ်လို ခံစားရလဲ ဆိုတာလည်း data ပါ။ ဒါပေမဲ့ ခံစားချက် တစ်ခုတည်းကို
      ယုံလို့ မရပါဘူး။ ၂၀၂၅ ခုနှစ် အစောပိုင်းက စမ်းသပ်မှု တစ်ခုမှာ အတွေ့အကြုံရှိတဲ့ open source developer ၁၆
      ယောက်ကို AI နဲ့ အလုပ်လုပ်စေပြီး တိုင်းကြည့်ခဲ့ပါတယ်။ သူတို့က ၂၄ ရာခိုင်နှုန်း ပိုမြန်မယ်လို့ မျှော်လင့်ခဲ့ပြီး၊
      ပြီးသွားတော့လည်း ၂၀ ရာခိုင်နှုန်း ပိုမြန်ခဲ့တယ်လို့ ထင်ခဲ့ကြပါတယ်။ တိုင်းကြည့်တော့ အလုပ်တွေက ၁၉
      ရာခိုင်နှုန်း ပိုကြာခဲ့ပါတယ်။
      [[mark:p-old]] အဲဒီ ရလဒ်ကို သုတေသန အဖွဲ့ကိုယ်တိုင်က အခုတော့ ခေတ်နောက်ကျသွားပြီလို့ မှတ်ထားပါတယ်။ ဒါကြောင့်
      AI က developer တွေကို နှေးစေတယ်လို့ ယူရမှာ မဟုတ်ပါဘူး။ ယူရမှာက ခံစားချက်နဲ့ တိုင်းတာချက် ကွဲနိုင်တယ် ဆိုတဲ့
      အချက်ပါ။ ဒါရိုက်တာ အဖွဲ့ ရှေ့မှာ တိုင်းထားတဲ့ ဂဏန်း လိုတာ ဒါကြောင့်ပါ။
    sources:
      - {
          title: "METR: early-2025 AI and experienced open-source developer productivity study",
          url: "https://metr.org/blog/2025-07-10-early-2025-ai-experienced-os-dev-study/",
        }
      - {
          title: "METR: uplift study update (February 2026)",
          url: "https://metr.org/blog/2026-02-24-uplift-update/",
        }
    actions:
      - {
          id: draw-m-feel,
          type: whiteboard.apply,
          at: { mark: p-feel },
          upsertIds: [m-feel],
          drawMs: 1000,
        }

  - id: scorecard
    chapter: ROI scorecard
    narration: >
      [[mark:k-close]] ဒီ ဂဏန်းတွေကို ROI scorecard ထဲမှာ ကော်လံ လေးခုနဲ့ ချရေးကြည့်ရအောင်။
      [[mark:type-rows-1]] ပထမ နှစ်ကြောင်းက headline ဂဏန်းပါ။ ဒုတိယ စာကြောင်းက အဲဒီ ဂဏန်းကို တစ်ပတ်ချင်း
      ယှဉ်လို့ရအောင် ပြောင်းထားတာပါ။ job ၁၄၀ ကို ရှစ်ပတ်နဲ့ စားရင် လက်နဲ့ တစ်ပတ် ၁၇ ခုခွဲ လောက် ရပြီး၊ သုံးပတ်နဲ့ စားရင်
      ရည်မှန်းချက်က တစ်ပတ် ၄၇ ခုလောက် ဖြစ်ပါတယ်။ ဒါမှ ရက် ၃၀ မပြည့်ခင် ပတ်တိုင်း ယှဉ်ကြည့်လို့ ရမှာပါ။
      [[mark:type-rows-2]] နောက် နှစ်ကြောင်းက ခန့်မှန်းချက်ကို စစ်ဖို့နဲ့ အရည်အသွေးကို စောင့်ကြည့်ဖို့ပါ။ job သုံးခုကို
      လက်နဲ့ ရွှေ့ပြီး တိုင်းမယ့် အချိန်နဲ့၊ ပြီးခဲ့တဲ့ သုံးလအတွင်း review မှာ ပြန်ပြင်ခိုင်းခဲ့တဲ့ PR အရေအတွက်ပါ။
      နှစ်ခုလုံးကို ပထမ နေ့ မတိုင်ခင် ယူရပါမယ်။
      [[mark:sel-source]] နောက်ဆုံး ကော်လံက အရေးကြီးပါတယ်။ ဂဏန်း တစ်ခုကို ပြတဲ့အခါ ဘယ်ကနေ ရလဲ လို့ မေးရင်
      ချက်ချင်း ဖြေနိုင်ရပါမယ်။ ခန့်မှန်းချက်ဆိုရင် ခန့်မှန်းချက်လို့ပဲ ရိုးရိုးသားသား ရေးထားပါ။
    sources:
      - {
          title: "Claude: measuring ROI of agentic coding",
          url: "https://claude.com/resources/guides/scaling-agentic-coding-across-your-organization/measuring-roi",
        }
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
    actions:
      - { id: close-feel, type: whiteboard.apply, at: { mark: k-close }, open: false }
      - id: type-rows-1
        type: editor.type
        at: { mark: type-rows-1 }
        cadence: line-by-line
        target: { file: notebook/48-roi-scorecard.md, after: "|---|---|---|---|\n" }
        text: "| job 140 အတွက် အချိန် | 40 developer-weeks | 6 developer-weeks | လက်နဲ့ ခန့်မှန်းချက် |\n| တစ်ပတ် စစ်ပြီးသား job | 17.5 (140 ÷ 8 ပတ်) | 47 ခန့် (140 ÷ 3 ပတ်) | ခန့်မှန်းချက်ကနေ တွက် |\n"
      - id: type-rows-2
        type: editor.type
        at: { mark: type-rows-2 }
        cadence: line-by-line
        target: { file: notebook/48-roi-scorecard.md, after: "ခန့်မှန်းချက်ကနေ တွက် |\n" }
        text: "| job 1 ခု လက်နဲ့ ရွှေ့ချိန် | job 3 ခု ရွှေ့ပြီး တိုင်း | — | developer 2 ယောက် |\n| review မှာ ပြန်ပြင်ရတဲ့ PR | ပြီးခဲ့တဲ့ 3 လ | baseline ထက် မများ | GitHub PR history |\n"
      - id: sel-source
        type: editor.select
        at: { mark: sel-source }
        target:
          file: notebook/48-roi-scorecard.md
          text: "ဂဏန်း ဘယ်က"

  - id: return
    chapter: Return ကို တွက်ခြင်း
    narration: >
      [[mark:type-return]] တတိယ မေးခွန်းက return ကို ဘယ်လို တွက်မလဲ ဆိုတာပါ။ ROI ဆိုတာ ရှုပ်ထွေးတဲ့ ပုံသေနည်း
      မဟုတ်ပါဘူး။ target ပြည့်ရင် ချွေတာမယ့် အချိန်က developer week ၄၀ ထဲက ခြောက်ခုကို နုတ်ရင် ၃၄ ပါ။ ကုန်ကျစရိတ်ဘက်မှာတော့
      Claude Code သုံးစွဲခ၊ FDE ရဲ့ အချိန်နဲ့ developer တွေ သင်ယူရတဲ့ အချိန် ပါပါတယ်။
      [[mark:sel-cost]] Claude Code ရဲ့ docs က enterprise deployment တွေမှာ ပျမ်းမျှ ကုန်ကျစရိတ်ကို developer
      တစ်ယောက် တစ်လ ဒေါ်လာ ၁၅၀ ကနေ ၂၅၀ လောက်လို့ ပြထားပါတယ်။ ဒါက ဒီ lesson ကို ရေးတဲ့ အချိန်က ဂဏန်းမို့၊
      လက်ရှိ ဂဏန်းကို docs ထဲက cost စာမျက်နှာမှာ ပြန်ကြည့်ပါ။ ကိုယ်တို့က ရှစ်ယောက်အတွက် တစ်လ ဒေါ်လာ ၁၂၀၀ ကနေ
      ၂၀၀၀ လို့ ယူဆထားပြီး၊ ပထမ ပတ် ကုန်ရင် တကယ့် ကုန်ကျစရိတ်နဲ့ အစားထိုးပါမယ်။
      [[mark:sel-assume]] ယူဆချက်တွေကိုလည်း ထုတ်ပြောထားရပါမယ်။ job တွေရဲ့ ခက်ခဲမှု ဆင်တူတယ်၊ output
      တိုက်စစ်ချိန်က ခြောက်ခုထဲ ပါတယ် ဆိုတာမျိုးပါ။ ယူဆချက်ကို ဖုံးထားတဲ့ ROI က ပထမဆုံး မေးခွန်း တစ်ခုနဲ့တင်
      ယုံကြည်မှု ပျက်သွားတတ်ပါတယ်။
      [[mark:type-board]] နောက်ဆုံးမှာ ဒါရိုက်တာ အဖွဲ့အတွက် စာကြောင်း တစ်ကြောင်း ရေးပါတယ်။ Anthropic ရဲ့ ROI လမ်းညွှန်က
      အလုပ် တစ်ခု အရင်က ဘယ်လောက် ကြာခဲ့ပြီး အခု ဘယ်လောက် ကြာလဲ ဆိုတဲ့ ပုံစံ ရိုးရိုးကို အကြံပြုပါတယ်။
      ကိုယ်တို့ စာကြောင်းမှာ ရလဒ် မဟုတ်သေးဘဲ ရည်မှန်းချက်ကိုပဲ ရေးထားပြီး၊ ရက် ၃၀ ပြည့်ရင် တကယ့် ဂဏန်းနဲ့
      အစားထိုးပါမယ်။
    sources:
      - {
          title: "Claude Code docs: manage costs effectively",
          url: "https://code.claude.com/docs/en/costs",
        }
      - {
          title: "Claude: measuring ROI of agentic coding",
          url: "https://claude.com/resources/guides/scaling-agentic-coding-across-your-organization/measuring-roi",
        }
    actions:
      - id: type-return
        type: editor.type
        at: { mark: type-return }
        cadence: line-by-line
        target: { file: notebook/48-roi-scorecard.md, after: "## Return\n" }
        text: "- ချွေတာ: 40 − 6 = 34 developer-weeks\n- ကုန်ကျ: Claude Code 8 ယောက် × $150–250 / လ (docs ပျမ်းမျှ၊ 2026-11) + FDE နဲ့ သင်ယူချိန်\n- ယူဆချက်: job တွေ ခက်ခဲမှု ဆင်တူ၊ output စစ်ချိန် 6 ထဲ ပါ၊ week 1 ကုန်ကျမှု အမှန်နဲ့ အစားထိုး\n"
      - id: sel-cost
        type: editor.select
        at: { mark: sel-cost }
        target:
          file: notebook/48-roi-scorecard.md
          text: "$150–250 / လ (docs ပျမ်းမျှ၊ 2026-11)"
      - id: sel-assume
        type: editor.select
        at: { mark: sel-assume }
        target:
          file: notebook/48-roi-scorecard.md
          text: "- ယူဆချက်: job တွေ ခက်ခဲမှု ဆင်တူ၊ output စစ်ချိန် 6 ထဲ ပါ"
      - id: type-board
        type: editor.type
        at: { mark: type-board }
        cadence: line-by-line
        target: { file: notebook/48-roi-scorecard.md, after: "## ဒါရိုက်တာ အဖွဲ့အတွက် တစ်ကြောင်း\n" }
        text: "- လက်နဲ့ 40 developer-weeks ခန့်မှန်းတဲ့ အလုပ်ကို 2 ယောက်က 6 အတွင်း ပြီးဖို့ ရည်မှန်း၊ job တိုင်း output စစ်\n"
      - id: expect-board
        type: expect.file
        at: { afterAction: type-board }
        path: notebook/48-roi-scorecard.md
        contains: "- ချွေတာ: 40 − 6 = 34 developer-weeks\n"

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ support manager လှလှ က Reply assistant pilot ရဲ့ ရလဒ်ကိုလည်း ဒါရိုက်တာ အဖွဲ့
      ရှေ့မှာ ပြချင်ပါတယ်။ Reply assistant ဆိုတာ ticket တစ်ခုအတွက် အဖြေ မူကြမ်းကို ရေးပေးပြီး၊ support agent က
      ဖတ်ပြီးမှ ပို့ရတဲ့ AI tool ပါ။ သံသယ ရှိတဲ့ ဒါရိုက်တာ အဖွဲ့က ဘယ်ဂဏန်းကို ပိုလက်ခံမလဲ။
      [[mark:q-a]] ပထမ တစ်ခုက Reply assistant က တစ်ရက်မှာ draft ဘယ်နှစောင် ရေးပေးလဲ ဆိုတာပါ။
      [[mark:q-b]] ဒုတိယ တစ်ခုက customer တွေရဲ့ ပထမဆုံး ပြန်ဖြေချိန်ကို၊ pilot မစခင်က ပျမ်းမျှ ၃၈ မိနစ်နဲ့
      ယှဉ်တာပါ။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ တစ်ခုပါ။ ဘာကြောင့်လဲဆိုတော့ draft အရေအတွက်က tool ကို သုံးနေသရွေ့
      တက်နေမှာပါ။ draft တွေကို ပစ်ထုတ်ပြီး အသစ် ပြန်ရေးနေရင်တောင် အဲဒီ ဂဏန်းက ကောင်းနေပါလိမ့်မယ်။ ပထမဆုံး
      ပြန်ဖြေချိန်ကတော့ customer တကယ် ခံစားရတဲ့ ရလဒ်ဖြစ်ပြီး၊ မစခင်က ဂဏန်း ရှိနေတော့ ယှဉ်ပြလို့ ရပါတယ်။
      [[mark:q-rule]] ဒါကြောင့် ဂဏန်း တစ်ခုကို ဒါရိုက်တာ အဖွဲ့ ရှေ့ မတင်ခင် စစ်ကြည့်ပါ။ လုပ်ဆောင်မှုကို ရေတွက်တာလား၊
      ရလဒ်ကို တိုင်းတာလား၊ မစခင်က baseline ရှိလား ဆိုတာပါ။
    sources:
      - {
          title: "Claude: measuring ROI of agentic coding",
          url: "https://claude.com/resources/guides/scaling-agentic-coding-across-your-organization/measuring-roi",
        }
      - {
          title: "The SPACE of developer productivity (Forsgren et al., ACM Queue 2021)",
          url: "https://www.microsoft.com/en-us/research/?p=733804",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: q-rule, offsetMs: 2500 },
          upsertIds: [q-t1, q-t2],
          drawMs: 1600,
        }

  - id: your-turn
    chapter: ကိုယ့် baseline
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ကိုယ့် team မှာ AI နဲ့ ပြောင်းချင်တဲ့ အလုပ် တစ်ခုအတွက်
      ဒီ အပတ်ထဲမှာ ယူထားရမယ့် baseline တစ်ခုကို ဒီ table ထဲမှာ ရေးကြည့်ပါ။ ဘာကို တိုင်းမလဲ၊ ဂဏန်းကို ဘယ်ကနေ
      ယူမလဲ ဆိုတာပါ။
      [[mark:turn-2]] git history ဒါမှမဟုတ် ticket system လို ရှိပြီးသား နေရာကနေ ယူလို့ ရရင် အကောင်းဆုံးပါ။ ဂဏန်း
      မရှိဘူး ဆိုရင်တော့၊ အဲဒါ ကိုယ့်ရဲ့ ပထမဆုံး လုပ်ရမယ့် အလုပ်ပါ။ စတင်ပြီးမှ ယူဖို့ မဖြစ်နိုင်တော့လို့ပါ။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: turn }, open: false }
      - id: sel-table
        type: editor.select
        at: { mark: turn, offsetMs: 2200 }
        target:
          file: notebook/48-roi-scorecard.md
          text: "| တိုင်းမယ့်အရာ | Baseline | Target | ဂဏန်း ဘယ်က |"

  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ ဘာထက် ပိုမြန်တာလဲ ဆိုတဲ့ မေးခွန်းကို ဖြေနိုင်ဖို့ ပထမ နေ့ မတိုင်ခင်
      baseline ကို ယူထားရပါတယ်။ လုပ်ဆောင်မှု ဘယ်လောက် များလဲ မဟုတ်ဘဲ ရလဒ်ကို ပြတဲ့ ဂဏန်းတွေကို တိုင်းပြီး၊ return
      ကို ယူဆချက်တွေနဲ့အတူ ရိုးရိုး တွက်ပြရပါတယ်။
      [[mark:recap-2]] ဒါရိုက်တာ အဖွဲ့ကို ပြောမယ့် စကားက တစ်ကြောင်းတည်းပါ။ အရင်က ဘယ်လောက် ကြာခဲ့ပြီး အခု ဘယ်လောက်
      ကြာလဲ ဆိုတာပါ။
      [[mark:next]] နောက် lesson မှာတော့ pilot ပြီးရင် ကျန်တဲ့ developer ၁၆ ယောက်ဆီ ဘယ်လို ဆက်ဖြန့်မလဲ ဆိုတာ
      ကြည့်ပါမယ်။ ခွင့်ပြုချက် တစ်ဆင့်ချင်း တောင်းပြီး သုံးရာကနေ အလုပ်ကို လွှဲအပ်တဲ့အထိ အဆင့်လိုက် roll out လုပ်တာကို
      လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
    actions:
      - id: sel-baseline
        type: editor.select
        at: { mark: recap }
        target:
          file: notebook/48-roi-scorecard.md
          text: "| job 140 အတွက် အချိန် | 40 developer-weeks | 6 developer-weeks | လက်နဲ့ ခန့်မှန်းချက် |"
      - id: sel-board
        type: editor.select
        at: { mark: recap-2 }
        target:
          file: notebook/48-roi-scorecard.md
          text: "- လက်နဲ့ 40 developer-weeks ခန့်မှန်းတဲ့ အလုပ်ကို 2 ယောက်က 6 အတွင်း ပြီးဖို့ ရည်မှန်း"

checks:
  - { type: timing.p95Ms, max: 300 }
