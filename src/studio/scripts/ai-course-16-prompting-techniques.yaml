      src/announce.js: |
        // The weekend special announcement: the same request, asked directly and step by step.
        import { panel } from "ai-panel";
        import { generate, tokensFor } from "./llm.js";
        import { showAnswer } from "./show.js";

        const system = "You write short announcements for Shwe Tea House, a tea shop in Yangon. Use only the facts you are given.";
        const request = `Plan a short announcement for the shop's page about this weekend's special: a heading under 60 characters and three bullet points, in Burmese.
        Special: မုန့်လက်ဆောင်း, a summer special with coconut milk and palm sugar syrup.
        Open Saturday and Sunday, 7:00 to 21:00.
        Use only these facts.`;

        // Chain-of-thought: one more line that asks for the steps before the answer.
        let stepByStep = "";

        export async function announce() {
          const direct = [{ role: "system", content: system }, { role: "user", content: request }];
          const cot = [{ role: "system", content: system }, { role: "user", content: `${request}\n${stepByStep}` }];
          const directAnswer = await generate(direct, { show: false });
          const cotAnswer = stepByStep ? await generate(cot, { show: false }) : "";
          panel.metrics("Answer tokens", { direct: tokensFor(direct)?.outputTokens ?? "—", "step by step": stepByStep ? tokensFor(cot)?.outputTokens ?? "—" : "—" }, { id: "cot-tokens" });
          showAnswer("Direct", directAnswer, "direct");
          if (stepByStep) showAnswer("Step by step", cotAnswer, "cot");
        }
      src/assemble.js: |
        // Prompt assembly: plain code that turns the parts into the messages the model gets (no model here).
        import { panel } from "ai-panel";

        const NAMES = { context: "Context", instruction: "Instruction", input: "Input variables", format: "Output format", examples: "Examples", constraints: "Constraints" };
        const section = ([part, text]) => `### ${NAMES[part] ?? part}\n${text}`;

        // Every part, in the order it is written, as one user message.
        export const oneMessage = (prompt) => [{ role: "user", content: Object.entries(prompt).map(section).join("\n\n") }];

        // The stable parts as the system message; only the item of the moment as the user message.
        export const systemAndUser = ({ input, ...stable }) => [
          { role: "system", content: Object.entries(stable).map(section).join("\n\n") },
          { role: "user", content: input },
        ];

        // The Prompt parts card (which message each part goes in) and the recorded token counts.
        export function showParts(prompt, messages, tokens) {
          const sentIn = (part) => (messages.length > 1 && part !== "input" ? "system" : "user");
          panel.metrics("Tokens", { prompt: tokens?.promptTokens ?? "—", answer: tokens?.outputTokens ?? "—" }, { id: "tokens" });
          panel.table("Prompt parts", Object.keys(prompt).map((part) => ({ part, "sent in": sentIn(part) })), { id: "parts", badge: "rules · AI မပါ" });
        }
      src/llm.js: |
        // The lesson's stand-in for a model API.
        // A real model is slow and can answer differently from run to run, so this lesson uses answers
        // recorded ahead of time from a real model: data/responses.json (how: data/PROVENANCE.md).
        // generate() returns the recorded answer for exactly these messages, and shows it in the panel.
        import recorded from "../data/responses.json";
        import { panel } from "ai-panel";

        export const model = recorded.provenance;

        const find = (messages) => {
          const key = JSON.stringify(messages.map(({ role, content }) => ({ role, content })));
          return recorded.responses.find((r) => JSON.stringify(r.messages) === key);
        };

        export async function generate(messages, { show = true } = {}) {
          const hit = find(messages);
          if (!hit) {
            const error = new Error("No recorded answer for these exact messages yet.");
            error.name = "CourseNotice";
            throw error;
          }
          if (show) panel.output("Model answer", hit.output, { id: "answer", badge: `recorded · ${model.label} · greedy` });
          return hit.output;
        }

        // The token counts the model's own tokenizer gave when the answer was recorded (the prompt includes
        // the chat template's own tokens): { promptTokens, outputTokens }, or null when not recorded.
        export function tokensFor(messages) {
          const hit = find(messages);
          return hit ? { promptTokens: hit.promptTokens, outputTokens: hit.outputTokens } : null;
        }
      src/main.js: |
        import { sortMessages } from "./sorter.js";
        import { announce } from "./announce.js";
        import { reflect } from "./reflect.js";

        // One task per technique; the newest one is drawn at the top of the panel.
        await sortMessages();
      src/prompt.js: |
        // The description helper's prompt: the contract between the shop's page and the model.
        // One line per part, so each part can be versioned, tested and improved on its own.
        export const helperPrompt = (item) => ({
          context: "You are the menu-writing helper of Shwe Tea House, a tea shop in Yangon. The counter staff use you to describe new items.",
          instruction: "Write three short descriptions of this menu item for the shop's website, in Burmese.",
          input: `Item: ${item.name}\nStaff notes: ${item.notes}\nStyle: ${item.style}`,
          format: 'Return only JSON in this shape: {"descriptions": ["…", "…", "…"]}',
          examples: `Item: လက်ဖက်ရည်
        Staff notes: လက်ဖက်ခြောက် ပြင်းပြင်း၊ နို့ဆီနဲ့၊ ပူပူ
        Style: friendly
        {"descriptions": ["လက်ဖက်ခြောက် ပြင်းပြင်းနဲ့ ဖျော်ထားတဲ့ လက်ဖက်ရည် ပူပူလေး", "နို့ဆီ ချိုချိုနဲ့ မနက်တိုင်း သောက်ချင်စရာ", "ရနံ့ မွှေးမွှေး၊ အရသာ ပြည့်ပြည့်နဲ့ လက်ဖက်ရည် တစ်ခွက်"]}`,
          constraints: "Each description under 60 characters. Use only facts from the notes: no prices, no discounts or free offers, no claims like best. No emoji unless the style asks. A warm, natural tone. The JSON alone, without code fences.",
        });
      src/reflect.js: |
        // Self-reflection: the helper's answer from lesson 15, then a request to review and rewrite it.
        import { panel } from "ai-panel";
        import helper from "../data/helper.json";
        import { generate, tokensFor } from "./llm.js";
        import { helperPrompt } from "./prompt.js";
        import { systemAndUser } from "./assemble.js";
        import { showAnswer } from "./show.js";

        // Lesson 15's final prompt for ထန်းလျက် ကော်ဖီ: the system prompt and the item.
        const messages = systemAndUser(helperPrompt(helper.newItems[0]));

        // The review request, sent after the model's own first answer.
        let review = "";

        export async function reflect() {
          const first = await generate(messages, { show: false });
          const again = [...messages, { role: "assistant", content: first }, { role: "user", content: review }];
          const revised = review ? await generate(again, { show: false }) : "";
          panel.metrics("Tokens", { "1st answer": tokensFor(messages)?.outputTokens ?? "—", "2nd prompt": review ? tokensFor(again)?.promptTokens ?? "—" : "—", "2nd answer": review ? tokensFor(again)?.outputTokens ?? "—" : "—" }, { id: "reflect-tokens" });
          showAnswer("First answer", first, "first");
          if (review) showAnswer("After review", revised, "revised");
        }
      src/show.js: |
        // Draws a recorded answer on its own card, with the same badge src/llm.js uses.
        import { panel } from "ai-panel";
        import { model } from "./llm.js";

        export const badge = `recorded · ${model.label} · greedy`;
        export const showAnswer = (label, text, id) => panel.output(label, text, { id, badge });
      src/sorter.js: |
        // The owner's message sorter: one label for each customer message.
        import { panel } from "ai-panel";
        import data from "../data/reviews.json";
        import { generate } from "./llm.js";
        import { badge } from "./show.js";

        const MESSAGES = ["r11", "r12", "r15", "r04", "r10", "r03", "r39", "r40"];

        // Zero-shot: the task, the labels and the format, nothing else.
        const task = `You sort customer messages for Shwe Tea House into one label: praise, complaint or question.
        Return only JSON: {"label": "…"}`;

        // Few-shot: the same task, plus examples that show how it is done.
        let examples = "";

        // One row per message: ✓ when the model's label is the shop's own label.
        function row(text, shopLabel, answer) {
          const label = /"label"\s*:\s*"(\w+)"/.exec(answer)?.[1] ?? "?";
          const notes = [label];
          if (label !== shopLabel) notes.push(`shop: ${shopLabel}`);
          if (answer.trim().startsWith("```")) notes.push("code fence");
          return { name: text, pass: label === shopLabel, detail: notes.join(" · ") };
        }

        export async function sortMessages() {
          const zero = [];
          const few = [];
          for (const id of MESSAGES) {
            const { text, type } = data.reviews.find((r) => r.id === id);
            zero.push(row(text, type, await generate([{ role: "system", content: task }, { role: "user", content: text }], { show: false })));
            if (examples) few.push(row(text, type, await generate([{ role: "system", content: `${task}\n\n${examples}` }, { role: "user", content: text }], { show: false })));
          }
          if (examples) panel.evals("Few-shot", few, { id: "few", badge });
          panel.evals("Zero-shot", zero, { id: "zero", badge });
        }
      vite.config.js: |
        import { defineConfig } from "vite";
        import courseRunner from "./course/runner.js";

        export default defineConfig({
          plugins: [courseRunner()],
        });
