        .aip-pct { min-width: 54px; text-align: right; color: #e9ecef; }
        .aip-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
        .aip-tile { background: #23272f; border-radius: 6px; padding: 6px 10px; }
        .aip-tile-name { font-size: 12px; color: #adb5bd; }
        .aip-tile-value { font-size: 20px; font-weight: 600; color: #fff; }
        .aip-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .aip-table th { text-align: left; color: #adb5bd; font-weight: 600; border-bottom: 1px solid #343a46; padding: 3px 6px; }
        .aip-table td { border-bottom: 1px solid #262a33; padding: 3px 6px; vertical-align: top; overflow-wrap: anywhere; }
        .aip-yes { color: #8ce99a; } .aip-no { color: #ff8787; }
        .aip-part { border-left: 3px solid #4dabf7; background: #1a2230; border-radius: 0 6px 6px 0; padding: 5px 10px; margin: 0 0 6px; }
        .aip-part-name { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin: 0 0 2px; }
        .aip-part-text { white-space: pre-wrap; overflow-wrap: anywhere; color: #f1f3f5; }
        .aip-foot { font-size: 12px; color: #9aa3b2; margin-top: 4px; }
