build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 5116
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "Prompting နည်းလမ်း လေးမျိုး"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ prompt ကို context၊ instruction၊ example၊ constraint လို
      အပိုင်းတွေနဲ့ ဆောက်ပြီး၊ system prompt နဲ့ user prompt ကို ခွဲခဲ့ပါတယ်။ ဒီ lesson မှာတော့ model
      တစ်ခုတည်းကို ခိုင်းပုံ မတူတဲ့ prompting နည်းလမ်း လေးမျိုးကို စမ်းကြည့်ပါမယ်။ [[mark:draw-mini]]
      blueprint မှာဆိုရင် ဒါလည်း intelligence အလွှာထဲက model ကို ခိုင်းတဲ့ အလုပ်ပါ။ [[mark:draw-today]] model
      နဲ့ အလုပ် တစ်ခုချင်းအတွက် ဘယ်နည်းက အကောင်းဆုံးလဲ ဆိုတာ ကြိုမသိနိုင်လို့၊ developer တွေက နည်းလမ်း
      အမျိုးမျိုး စမ်းပြီးမှ ရွေးကြတာ များပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Prompt engineering (common prompting techniques)",
          url: "https://web.dev/learn/ai/prompt-engineering",
        }
      - {
          title: "web.dev Learn AI: Introduction to AI on the web (the blueprint)",
          url: "https://web.dev/learn/ai/introduction",
        }
      - {
          title: "web.dev Learn AI: Welcome to Learn AI! (course credit: written by Dr. Janna Lipenkova with editorial guidance from Alexandra Klepper; text CC BY 4.0, code Apache 2.0; adapted into Burmese with the course's own tea-shop examples)",
          url: "https://web.dev/learn/ai/welcome",
        }
      - {
          title: "Creative Commons: Attribution 4.0 International (CC BY 4.0), the licence of the web.dev Learn AI text adapted here",
          url: "https://creativecommons.org/licenses/by/4.0/",
        }
    actions:
      - {
          id: open-board-a,
          type: whiteboard.apply,
          at: { scene: start, offsetMs: -450 },
          open: true,
          clear: true,
          upsertIds: [a-title],
        }
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - {
          id: draw-mini,
          type: whiteboard.apply,
          at: { mark: draw-mini },
          upsertIds:
            [
              a-opp,
              a-opp-t,
              a-arrow-1,
              a-data,
              a-data-t,
              a-intel,
              a-intel-t,
              a-ux,
              a-ux-t,
              a-arrow-2,
              a-gov,
              a-gov-t,
            ],
          drawMs: 2400,
        }
      - {
          id: draw-today,
          type: whiteboard.apply,
          at: { mark: draw-today },
          upsertIds: [a-today],
          drawMs: 1000,
        }

  - id: techniques
    narration: >
      [[mark:draw-tech]] နည်းလမ်း လေးမျိုးကို အရင် ချရေးထားပါမယ်။ [[mark:draw-zero]] zero shot ဆိုတာ နမူနာ
      မပေးဘဲ အလုပ်ကိုပဲ ပြောတာပါ။ အချက်အလက် တစ်ခု မေးတာလို ရိုးရှင်းတဲ့ အလုပ်ဆိုရင် ဒါနဲ့တင် လုံလောက်ပြီး၊
      ဘယ်အလုပ်မှာမဆို အရင်ဆုံး စမ်းကြည့်ရမယ့် အစ ဖြစ်ပါတယ်။ ဒါပေမဲ့ လက်တွေ့ app အများစုမှာ prompt ကို ဒီထက်
      ထပ်ဖြည့်ရပါတယ်။ [[mark:draw-few]] few shot ကတော့ နမူနာ အနည်းငယ် ပေးပြီး အဖြေကို ဘယ်လို ပုံစံနဲ့ ပေးရမလဲ
      ပြတာပါ။ [[mark:draw-cot]] chain of thought က အဖြေ မပေးခင် တစ်ဆင့်ချင်း စဉ်းစားပြခိုင်းတာ ဖြစ်ပြီး၊
      [[mark:draw-ref]] self reflection ကတော့ model ကို သူ့ အဖြေကို ပြန်စစ်ပြီး ပြင်ခိုင်းတာပါ။ ဒီနေ့ ဆိုင်ရဲ့
      အလုပ် သုံးခုမှာ ဒီ နည်းလမ်းတွေကို တစ်ခုချင်း စမ်းကြည့်ပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Prompt engineering (common prompting techniques)",
          url: "https://web.dev/learn/ai/prompt-engineering",
        }
    actions:
      - {
          id: draw-tech,
          type: whiteboard.apply,
          at: { mark: draw-tech },
          clear: true,
          upsertIds: [t-title],
        }
      - {
          id: draw-zero,
          type: whiteboard.apply,
          at: { mark: draw-zero },
          upsertIds: [t-zero, t-zero-n, t-zero-g],
          drawMs: 1300,
        }
      - {
          id: draw-few,
          type: whiteboard.apply,
          at: { mark: draw-few },
          upsertIds: [t-few, t-few-n, t-few-g],
          drawMs: 1300,
        }
      - {
          id: draw-cot,
          type: whiteboard.apply,
          at: { mark: draw-cot },
          upsertIds: [t-cot, t-cot-n, t-cot-g],
          drawMs: 1300,
        }
      - {
          id: draw-ref,
          type: whiteboard.apply,
          at: { mark: draw-ref },
          upsertIds: [t-ref, t-ref-n, t-ref-g],
          drawMs: 1300,
        }

  - id: zero
    chapter: "Zero shot နဲ့ few shot"
    narration: >
      [[mark:close-tech]] ပထမ အလုပ်က ဆိုင်ပိုင်ရှင် ဆီ ရောက်လာတဲ့ customer စာတွေကို ချီးကျူးတာ၊
      တိုင်ကြားတာ၊ မေးခွန်း ဆိုပြီး ခွဲတာပါ။ [[mark:open-sorter]] ဒါက sorter ဖိုင်ပါ။ customer စာ တစ်ခုချင်းကို model ဆီ request တစ်ခုစီ ပို့ပါတယ်။ [[mark:sel-task]] zero
      shot prompt မှာ label သုံးမျိုးထဲက တစ်ခုကို ရွေးပြီး JSON နဲ့ ပြန်ပေးဖို့ပဲ ပြောထားပါတယ်။
      [[mark:panel-ready]] AI panel ရဲ့ zero shot card မှာ customer စာ ရှစ်ခုကို ခွဲထားပါတယ်။ ဒီ စာတွေက lesson
      အတွက် ပြင်ဆင်ထားတဲ့ နမူနာ data ပါ။ label တွေကတော့ ဒီ prompt နဲ့ ကြိုပြီး run ထားတုန်းက တကယ် ထွက်လာခဲ့တဲ့
      အဖြေတွေပါ။ laptop ပေါ်က open model သေးသေးလေး တစ်ခုရဲ့ အဖြေကို ကြိုမှတ်ထားတာမို့ ဘယ်သူ ကြည့်ကြည့် အတူတူ
      မြင်ရပါမယ်။ [[mark:read-zero]] အမှန်ခြစ်က model ရွေးတဲ့ label က ဆိုင်က ကပ်ထားတဲ့ label နဲ့ တူတယ် ဆိုတဲ့
      အဓိပ္ပာယ်ပါ။ ရှစ်ခုထဲက ခြောက်ခု တူပြီး၊ နှစ်နာရီပဲ စောင့်ရတယ်လို့ ပြောင်းပြန် ပြောထားတဲ့ စာကိုတောင်
      တိုင်ကြားတာလို့ မှန်မှန် ခွဲပါတယ်။ [[mark:read-json]] ဒါပေမဲ့ အဖြေ ငါးခုမှာ code fence ပါနေပါတယ်။ card က label ကို စာထဲကနေ ရှာထုတ်ပြီး ပြထားပေမယ့်၊ JSON သက်သက် မဟုတ်တော့လို့ program က တိုက်ရိုက် ဖတ်လို့ မရပါဘူး။
    sources:
      - {
          title: "web.dev Learn AI: Prompt engineering (zero-shot prompting)",
          url: "https://web.dev/learn/ai/prompt-engineering",
        }
    actions:
      - { id: close-tech, type: whiteboard.apply, at: { mark: close-tech }, open: false }
      - {
          id: open-sorter,
          type: workspace.openFile,
          at: { mark: open-sorter },
          path: src/sorter.js,
        }
      - id: sel-task
        type: editor.select
        at: { mark: sel-task }
        target:
          {
            file: src/sorter.js,
            text: "const task = `You sort customer messages for Shwe Tea House into one label: praise, complaint or question.\nReturn only JSON: {\"label\": \"…\"}`;",
            occurrence: 1,
          }
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-done
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: ai-status }
        attribute: { name: data-state, value: "done" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-one-card
        type: expect.preview
        at: { afterAction: expect-done }
        timeoutMs: 5000
        target: { by: testId, value: ai-cards }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-eight-rows
        type: expect.preview
        at: { afterAction: expect-one-card }
        timeoutMs: 5000
        target: { by: testId, value: ai-zero }
        attribute: { name: data-total, value: "8" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-zero-badge
        type: expect.preview
        at: { afterAction: expect-eight-rows }
        timeoutMs: 5000
        target: { by: testId, value: ai-zero-badge }
        textContains: "recorded · Gemma 4 E2B · greedy"
