# AI course, lesson 16: prompting techniques (Burmese, hands-on, M4 recorded answers + recorded token counts).
#
# Start state (ws/): data/reviews.json + data/helper.json (COURSE-KIT §4.2/§4.5, sample data, copied
# unchanged from datasets/); src/llm.js + data/responses.json + data/PROVENANCE.md (base-llm; every answer
# recorded with tools/record-llm.ts, Gemma 4 E2B, greedy); src/show.js draws a recorded answer on its own
# card with the recorded badge. Three tasks, one per file, each drawn by a call in src/main.js (the newest
# call is typed above the others, so its cards land on top of the panel):
#   src/sorter.js    the owner's message sorter: 8 sample messages, the shop's label, zero-shot and
#                    few-shot labels (`ai-sorter`, badge recorded) and `ai-json` (answers that are bare JSON)
#   src/announce.js  the weekend special announcement, direct and step by step (`ai-cot-tokens`,
#                    `ai-direct`, `ai-cot`)
#   src/reflect.js   lesson 15's final prompt for ထန်းလျက် ကော်ဖီ (src/prompt.js + src/assemble.js are lesson
#                    15's final files), its first answer and the answer after a review request
#                    (`ai-reflect-tokens`, `ai-first`, `ai-revised`)
#
# Edits (insert-only; prompt text in one block or one line, so no half-typed prompt is looked up):
#   1. examples = … (sorter.js)        few-shot column filled; JSON only 3/8 → 8/8; r03 → praise; r40 still wrong
#   2. await announce(); (main.js)     Direct outline, 57 answer tokens
#   3. stepByStep = … (announce.js)    Step by step, 259 answer tokens
#   4. await reflect(); (main.js)      First answer: only the first description names the coffee
#   5. review = … (reflect.js)         After review: all three name it; second prompt 406 tokens
#
# Boards: (A) mini blueprint, Intelligence highlighted; (B) the four techniques, drawn at the start and
# completed with when / cost in `choose`; (Z) the quiz.
#
# Build: bun ~/Documents/ai-course-work/tools/build-lesson.ts template.yaml ws ai-course-16-prompting-techniques.yaml
