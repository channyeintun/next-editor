  - id: few
    narration: >
      [[mark:type-few]] ဒါကြောင့် few shot အတွက် example သုံးခု ထည့်ပါမယ်။ label တစ်မျိုးစီအတွက် card ထဲမှာ
      မပါတဲ့ customer စာ တစ်ခုနဲ့ သူ့ရဲ့ JSON အဖြေကို ပြထားတာပါ။ [[mark:read-few]] အပေါ်ဆုံးမှာ few shot card
      ပေါ်လာပြီး၊ ဘယ် အဖြေမှာမှ code fence မပါတော့ပါဘူး။ example တွေက label ကိုတင် မကဘဲ အဖြေ ပုံစံကိုပါ
      ပြလိုက်လို့ပါ။ ရှစ်ခုထဲက ခုနစ်ခု တူလာပြီး၊ လက်ဖက်ရည်ကို ချီးကျူးပေမယ့် တနင်္ဂနွေ မနက် လူများတယ်လို့
      ပြောတဲ့ အင်္ဂလိပ် စာကို ဆိုင်ရဲ့ label အတိုင်း ချီးကျူးတာလို့ ခွဲလာပါတယ်။ [[mark:read-miss]] ဒါပေမဲ့
      နောက်ဆုံး စာကို ကြည့်ပါ။ လက်ဖက်ရည် ချိုလွန်းတယ် ဆိုတဲ့ မြန်မာ စကားကို အင်္ဂလိပ် စာလုံးနဲ့ ရေးထားလို့၊ နည်းလမ်း
      နှစ်ခုလုံးက မေးခွန်းလို့ မှားခွဲပါတယ်။ example တွေက ဖြစ်နိုင်တဲ့ input အားလုံးကို မဖုံးနိုင်ပါဘူး။
      [[mark:few-when]] ဆိုတော့ few shot က label ခွဲတာလို predictive AI နဲ့ ဆင်တဲ့ အလုပ်၊ ဖော်ပြချက်လို
      ပုံစံ ရှင်းတဲ့ အလုပ်တွေမှာ အသုံးဝင်ပြီး၊ ရှည်ရှည် ကြိုက်သလို ရေးရတဲ့ စာမှာတော့ example နဲ့
      မလုံလောက်ပါဘူး။
    sources:
      - {
          title: "web.dev Learn AI: Prompt engineering (few-shot prompting)",
          url: "https://web.dev/learn/ai/prompt-engineering",
        }
    actions:
      - id: type-few
        type: editor.type
        at: { mark: type-few }
        target: { file: src/sorter.js, after: "let examples = \"\";\n", occurrence: 1 }
        text: "examples = `Examples:\nMessage: ဝန်ထမ်းတွေ ယဉ်ကျေးတယ်၊ ဆိုင်လည်း သန့်တယ်။\n{\"label\": \"praise\"}\nMessage: delivery နဲ့ မှာတာ တစ်နာရီ ကြာတယ်၊ ရောက်တော့ ဟင်းရည် အေးနေပြီ။\n{\"label\": \"complaint\"}\nMessage: စမ်းချောင်းကို delivery ပို့ပေးလား။\n{\"label\": \"question\"}`;\n"
        cadence: block
      - id: expect-few-seven
        type: expect.preview
        at: { afterAction: type-few }
        timeoutMs: 8000
        target: { by: testId, value: ai-few }
        attribute: { name: data-passed, value: "7" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-few-no-fence
        type: expect.preview
        at: { afterAction: expect-few-seven }
        timeoutMs: 5000
        target: { by: testId, value: ai-few-1 }
        textContains: "စောင့်ရတယ်။complaint"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-few-mixed
        type: expect.preview
        at: { afterAction: expect-few-no-fence }
        timeoutMs: 5000
        target: { by: testId, value: ai-few-6 }
        attribute: { name: data-pass, value: "true" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-two-cards
        type: expect.preview
        at: { afterAction: expect-few-mixed }
        timeoutMs: 5000
        target: { by: testId, value: ai-cards }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-few-miss
        type: expect.preview
        at: { mark: read-miss }
        timeoutMs: 5000
        target: { by: testId, value: ai-few-8 }
        textContains: "question · shop: complaint"
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: cot
    chapter: "Chain of thought"
    narration: >
      [[mark:open-main]] ဒုတိယ အလုပ်ကို main ဖိုင်မှာ ထည့်ပါမယ်။ [[mark:type-announce]] ဒီ စနေ တနင်္ဂနွေ အတွက်
      အထူး menu ကြေညာချက် တစ်ခု ရေးခိုင်းတာ ဖြစ်ပြီး၊ အသစ်ထည့်တဲ့ အလုပ်က panel ရဲ့ အပေါ်ဆုံးမှာ ပေါ်ပါမယ်။
      [[mark:read-direct]] Direct card မှာ ခေါင်းစဉ် တစ်ခုနဲ့ အချက် သုံးချက် ပါပြီး၊ Answer tokens card အရ token ၅၇ ခုပဲ ရှိပါတယ်။ ဒါပေမဲ့ အုန်းနို့ကို နို့ လို့ပဲ ရေးထားပါတယ်။ [[mark:open-announce]] ဒါကြောင့် announce
      ဖိုင်မှာ chain of thought အတွက် စာကြောင်း တစ်ကြောင်း ထည့်ပါမယ်။ [[mark:type-cot]] ကြေညာချက် မရေးခင်
      အချက်တွေကို အင်္ဂလိပ်လို မှတ်စု တိုတိုနဲ့ တစ်ဆင့်ချင်း အရင် ရေးခိုင်းတာပါ။ ဒီမှာ အဆင့် နှစ်ဆင့်ပဲ ပြောထားပြီး ကျန်တဲ့ အဆင့်တွေကို model ဘာသာ ခွဲခိုင်းထားပါတယ်။ အဆင့်တွေကို ကိုယ်တိုင် အသေးစိတ် ရေးပေးလို့လည်း
      ရပါတယ်။ [[mark:read-cot-tokens]] Answer tokens card မှာ step by step က token ၂၅၉ ခု ဖြစ်လာပြီး၊ direct
      ရဲ့ လေးဆ ကျော်ပါတယ်။ [[mark:scroll-cot]] Step by step card မှာ အင်္ဂလိပ်လို အချက်တွေနဲ့ အဆင့်တွေကို အရင် ရေးထားပြီး၊ အောက်ဆုံးမှ ကြေညာချက် ပါပါတယ်။ ခေါင်းစဉ်မှာ နွေရာသီ အထူး ဆိုတာ ပါလာပြီး၊ အချိန်ကိုလည်း မနက်နဲ့ ည ခွဲပြီး
      ရှင်းရှင်း ရေးထားပါတယ်။ ဒါပေမဲ့ အုန်းနို့နဲ့ ထန်းလျက်ရည် ဆိုတဲ့ အချက်ကတော့ ပျောက်သွားပါတယ်။
      [[mark:cot-when]] ဒီလို တိုတဲ့ ကြေညာချက်အတွက် token လေးဆ ပေးရတာ မတန်ပါဘူး။ chain of thought က အဆင့်
      များများ ဆင်ခြင်ရတဲ့ အလုပ်တွေမှာ အသုံးဝင်ပြီး၊ အဖြေ မပေးခင် ဆင်ခြင်တဲ့ အဆင့်တွေကို အရင် ထုတ်ပေးတဲ့ reasoning model တွေရဲ့ အခြေခံ နည်းလည်း ဖြစ်ပါတယ်။ token များလေ ကြာလေ၊ ကုန်လေ ဖြစ်လို့ တကယ် လိုမှ သုံးပါ။
    sources:
      - {
          title: "web.dev Learn AI: Prompt engineering (chain-of-thought prompting)",
          url: "https://web.dev/learn/ai/prompt-engineering",
        }
    actions:
      - { id: open-main, type: workspace.openFile, at: { mark: open-main }, path: src/main.js }
      - id: type-announce
        type: editor.type
        at: { mark: type-announce }
        target:
          {
            file: src/main.js,
            after: "// One task per technique; the newest one is drawn at the top of the panel.\n",
            occurrence: 1,
          }
        text: "await announce();\n"
        cadence: line-by-line
      - id: expect-direct
        type: expect.preview
        at: { afterAction: type-announce }
        timeoutMs: 8000
        target: { by: testId, value: ai-direct }
        textContains: "နို့နဲ့ ထန်းရည်သကြားရည်"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-direct-tokens
        type: expect.preview
        at: { afterAction: expect-direct }
        timeoutMs: 5000
        target: { by: testId, value: ai-cot-tokens-1 }
        attribute: { name: data-value, value: "57" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-four-cards
        type: expect.preview
        at: { afterAction: expect-direct-tokens }
        timeoutMs: 5000
        target: { by: testId, value: ai-cards }
        attribute: { name: data-count, value: "4" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - {
          id: open-announce,
          type: workspace.openFile,
          at: { mark: open-announce },
          path: src/announce.js,
        }
      - id: type-cot
        type: editor.type
        at: { mark: type-cot }
        target: { file: src/announce.js, after: "let stepByStep = \"\";\n", occurrence: 1 }
        text: "stepByStep = \"Think step by step: first write the facts in short English notes, then the announcement.\";\n"
        cadence: line-by-line
      - id: expect-cot-tokens
        type: expect.preview
        at: { afterAction: type-cot }
        timeoutMs: 8000
        target: { by: testId, value: ai-cot-tokens-2 }
        attribute: { name: data-value, value: "259" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-cot-answer
        type: expect.preview
        at: { afterAction: expect-cot-tokens }
        timeoutMs: 5000
        target: { by: testId, value: ai-cot }
        textContains: "နွေရာသီ အထူး မုန့်လက်ဆောင်း"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: scroll-cot
        type: preview.scroll
        at: { mark: scroll-cot }
        timeoutMs: 5000
        top: 480
        retry: { maxAttempts: 2, delayMs: 250 }

  - id: reflect
    chapter: "Self reflection"
    narration: >
      [[mark:scroll-top]] တတိယ အလုပ်ကတော့ ပြီးခဲ့တဲ့ lesson ရဲ့ ဖော်ပြချက် helper ပါ။ [[mark:type-reflect]]
      main ဖိုင်မှာ helper ရဲ့ အလုပ်ကို အပေါ်ဆုံး ထည့်ပါမယ်။ [[mark:read-first]] First answer card မှာ
      ပြီးခဲ့တဲ့ lesson ရဲ့ နောက်ဆုံး prompt နဲ့ ရခဲ့တဲ့ ထန်းလျက် ကော်ဖီ ဖော်ပြချက် သုံးခု ပြန်ပေါ်လာပါတယ်။
      ပထမ တစ်ခုမှာပဲ ကော်ဖီ ဆိုတဲ့ စကားလုံး ပါလို့၊ ကျန်တဲ့ နှစ်ခုကို သီးသန့် ဖတ်ရင် ဘာ item လဲ မသိနိုင်ပါဘူး။
      [[mark:open-reflect]] ဒါကြောင့် reflect ဖိုင်မှာ self reflection အတွက် review request ကို ထည့်ပါမယ်။
      [[mark:type-review]] customer က ဖော်ပြချက် တစ်ခုပဲ မြင်ရနိုင်လို့၊ တစ်ခုစီမှာ item နာမည် ပါမပါ ပြန်စစ်ပြီး မပါတာကို ပြန်ရေးခိုင်းတာပါ။ model ရဲ့ ပထမ အဖြေကို assistant message အဖြစ် ထည့်ပြီး၊ ဒီ request ကို နောက်က ပို့ပါတယ်။ [[mark:read-revised]] After
      review card မှာ ဖော်ပြချက် သုံးခုလုံး ကော်ဖီ ဆိုတာ ပါလာပြီး၊ နှစ်ခုမှာ ထန်းလျက် ကော်ဖီ လို့ နာမည် အပြည့်
      ပါပါတယ်။ [[mark:read-cost]] ကုန်ကျစရိတ်ကိုလည်း ကြည့်ပါ။ Tokens card မှာ ဒုတိယ request ရဲ့ prompt က token ၄၀၆ ခု ရှိပါတယ်။ system prompt နဲ့ ပထမ အဖြေကိုပါ ပြန်ပို့ရလို့ request တစ်ခုစာ ထပ်ကုန်တာပါ။ ဒါပေမဲ့ self reflection က request တစ်ခု ထပ်ထည့်ရုံနဲ့ ရလို့ ထည့်ရ မြန်ပြီး၊ အရည်အသွေးကိုလည်း သိသိသာသာ တက်စေနိုင်ပါတယ်။ prompt က ကောင်းကောင်း အလုပ်လုပ်နေပြီးမှ ပိုရှင်းအောင် ထပ်ညှိချင်တဲ့အခါ သုံးတာ သင့်တော်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Prompt engineering (self-reflection prompting)",
          url: "https://web.dev/learn/ai/prompt-engineering",
        }
    actions:
      - id: scroll-top
        type: preview.scroll
        at: { mark: scroll-top }
        timeoutMs: 5000
        top: 0
        retry: { maxAttempts: 2, delayMs: 250 }
      - { id: open-main-2, type: workspace.openFile, at: { mark: type-reflect }, path: src/main.js }
      - id: type-reflect
        type: editor.type
        at: { afterAction: open-main-2 }
        target:
          {
            file: src/main.js,
            after: "// One task per technique; the newest one is drawn at the top of the panel.\n",
            occurrence: 1,
          }
        text: "await reflect();\n"
        cadence: line-by-line
      - id: expect-first
        type: expect.preview
        at: { afterAction: type-reflect }
        timeoutMs: 8000
        target: { by: testId, value: ai-first }
        textContains: "နို့ဆီမပါတဲ့ အရသာကောင်းလေး"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-seven-cards
        type: expect.preview
        at: { afterAction: expect-first }
        timeoutMs: 5000
        target: { by: testId, value: ai-cards }
        attribute: { name: data-count, value: "7" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - {
          id: open-reflect,
          type: workspace.openFile,
          at: { mark: open-reflect },
          path: src/reflect.js,
        }
      - id: type-review
        type: editor.type
        at: { mark: type-review }
        target: { file: src/reflect.js, after: "let review = \"\";\n", occurrence: 1 }
        text: "review = \"Review your descriptions. A customer may see only one of them, so each one must name the item. Rewrite any that doesn't, under 60 characters each. Return the same JSON.\";\n"
        cadence: line-by-line
      - id: expect-revised
        type: expect.preview
        at: { afterAction: type-review }
        timeoutMs: 8000
        target: { by: testId, value: ai-revised }
        textContains: "အေးအေး ပူပူ ထန်းလျက် ကော်ဖီ"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-second-prompt
        type: expect.preview
        at: { mark: read-cost }
        timeoutMs: 5000
        target: { by: testId, value: ai-reflect-tokens-2 }
        attribute: { name: data-value, value: "406" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: choose
    chapter: "ဘယ်နည်းကို ရွေးမလဲ"
    narration: >
      [[mark:draw-when]] ဒါဆို ဘယ်နည်းကို ဘယ်အချိန် သုံးမလဲ။ ရိုးရှင်းတဲ့ အလုပ်ဆိုရင် zero shot နဲ့ စပါ။ အဖြေ
      ပုံစံ ပုံသေ လိုရင် few shot နဲ့ နမူနာ ပြပါ။ အဆင့်များတဲ့ ဆင်ခြင်မှု လိုမှ chain of thought ကို သုံးပြီး၊
      prompt ကောင်းနေပြီးမှ self reflection နဲ့ ထပ်ညှိပါ။ [[mark:draw-cost]] ကုန်ကျစရိတ်လည်း မတူပါဘူး။ zero shot က prompt အတိုဆုံး ဖြစ်လို့ အသက်သာဆုံးပါ။ example
      တွေက prompt ကို ရှည်စေပြီး၊ chain of thought က အဖြေကို ရှည်စေပါတယ်။ self reflection ကတော့ request ကို
      နှစ်ခါ ပို့ရပါတယ်။ [[mark:draw-try]] prompting က စမ်းသပ်ရတဲ့ အလုပ် ဖြစ်လို့ တစ်ခါတည်းနဲ့ မပြီးပါဘူး။
      အကြိမ်ကြိမ် ပြင်ပြီး စစ်မှ ရှင်းလင်းပြီး ယုံကြည်ရတဲ့ prompt ရလာပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Prompt engineering (common prompting techniques, your takeaways)",
          url: "https://web.dev/learn/ai/prompt-engineering",
        }
    actions:
      - {
          id: draw-when,
          type: whiteboard.apply,
          at: { mark: draw-when },
          open: true,
          upsertIds: [t-zero-w, t-few-w, t-cot-w, t-ref-w],
          drawMs: 2000,
        }
      - {
          id: draw-cost,
          type: whiteboard.apply,
          at: { mark: draw-cost },
          upsertIds: [t-zero-c, t-few-c, t-cot-c, t-ref-c],
          drawMs: 2000,
        }

  - id: quiz
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ few shot က ဘယ်လို အလုပ်မျိုးမှာ အသုံးဝင်ဆုံးလဲ။ lesson ကို pause
      လုပ်ပြီး စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] အဖြေကတော့ label ခွဲတာ၊ JSON လို ပုံသေ ပုံစံ လိုတာ စတဲ့
      ပုံစံ ရှင်းတဲ့ အလုပ်တွေပါ။ ဘာကြောင့်လဲဆိုတော့ example က အဖြေ ဘယ်လို ပုံစံ ရှိရမလဲ ဆိုတာကို တိုက်ရိုက်
      ပြပေးလို့ပါ။ ရှည်ပြီး ကြိုက်သလို ရေးရတဲ့ စာအတွက်တော့ ဖြစ်နိုင်တာ အားလုံးကို example နဲ့ မဖုံးနိုင်ပါဘူး။
    sources:
      - {
          title: "web.dev Learn AI: Prompt engineering (Check your understanding)",
          url: "https://web.dev/learn/ai/prompt-engineering",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [z-title, z-q1, z-q2],
          drawMs: 1500,
        }
      - {
          id: draw-quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [z-a, z-a-note],
          drawMs: 1800,
        }

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ zero shot က အလုပ်ကိုပဲ ပြောတဲ့ အစ ဖြစ်ပါတယ်။ [[mark:sel-examples]]
      few shot မှာ example တွေက အဖြေ ပုံစံကို တစ်ပုံစံတည်း ဖြစ်အောင် ပြပေးပါတယ်။ [[mark:sel-cot]] chain of
      thought က အဆင့်တွေကို အရင် ရေးခိုင်းလို့ token ပိုကုန်ပါတယ်။ [[mark:sel-review]] self reflection ကတော့ model ကို သူ့ အဖြေကို ပြန်စစ်ပြီး ပြင်ခိုင်းတာပါ။ ဘယ်နည်းက ကိုယ့် အလုပ်နဲ့ ကိုက်လဲ ဆိုတာ စမ်းပြီး စစ်ကြည့်မှ သိရပါတယ်။ နောက် lesson
      မှာတော့ prompt ကို စနစ်တကျ တိုးတက်အောင် လုပ်တဲ့ evaluation driven development ကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Prompt engineering (your takeaways)",
          url: "https://web.dev/learn/ai/prompt-engineering",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: recap }, open: false }
      - {
          id: open-sorter-recap,
          type: workspace.openFile,
          at: { mark: sel-examples },
          path: src/sorter.js,
        }
      - id: sel-examples
        type: editor.select
        at: { afterAction: open-sorter-recap }
        target: { file: src/sorter.js, text: "examples = `Examples:", occurrence: 1 }
      - {
          id: open-announce-recap,
          type: workspace.openFile,
          at: { mark: sel-cot },
          path: src/announce.js,
        }
      - id: sel-cot
        type: editor.select
        at: { afterAction: open-announce-recap }
        target:
          {
            file: src/announce.js,
            text: 'stepByStep = "Think step by step: first write the facts in short English notes, then the announcement.";',
            occurrence: 1,
          }
      - {
          id: open-reflect-recap,
          type: workspace.openFile,
          at: { mark: sel-review },
          path: src/reflect.js,
        }
      - id: sel-review
        type: editor.select
        at: { afterAction: open-reflect-recap }
        target:
          {
            file: src/reflect.js,
            text: 'const again = [...messages, { role: "assistant", content: first }, { role: "user", content: review }];',
            occurrence: 1,
          }
      - {
          id: expect-final-main,
          type: expect.file,
          at: { afterAction: sel-review },
          path: src/main.js,
          contains: "await reflect();\nawait announce();\nawait sortMessages();\n",
        }
      - {
          id: expect-final-review,
          type: expect.file,
          at: { afterAction: expect-final-main },
          path: src/reflect.js,
          contains: 'review = "Review your descriptions. A customer may see only one of them',
        }
checks:
  - { type: timing.p95Ms, max: 300 }
