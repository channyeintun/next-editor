      package.json: |
        {
          "name": "ai-course-tea-shop",
          "private": true,
          "version": "1.0.0",
          "type": "module",
          "scripts": {
            "dev": "vite --host 0.0.0.0 --port 5173 --strictPort"
          },
          "devDependencies": {
            "esbuild": "0.21.5",
            "vite": "5.4.21"
