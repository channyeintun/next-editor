lesson:
  slug: claude-fde-20-thinking
  title: "Claude FDE 20: Thinking နဲ့ effort"
  locale: my-MM
  workspace:
    lessonType: javascript
    name: FDE Notebook
    entryFilePath: reply-assistant/src/dispute.ts
    sidebarStartsCollapsed: true
    files:
      README.md: |
        # နေခြည် Fiber · FDE မှတ်စု

        နေခြည် Fiber က ရန်ကုန်နဲ့ မန္တလေးမှာ fiber internet ဝန်ဆောင်မှု ပေးတဲ့ ကုမ္ပဏီပါ။
        ဒီ course အတွက် စိတ်ကူးနဲ့ တည်ဆောက်ထားတဲ့ ကုမ္ပဏီ ဖြစ်ပါတယ်။

        ## ကုမ္ပဏီ

        - customer 62,000 ခန့် (အိမ်နဲ့ ဆိုင်)
        - ဝန်ထမ်း 430: support agent 45၊ field technician 130၊ developer 24
        - developer team 4 ခု: Customer App, Billing, Network Tools, Internal Tools

        ## Support

        - တစ်ရက် ticket 1,800 ခန့်
        - connection 55 %၊ billing 25 %၊ တပ်ဆင်နဲ့ ရွှေ့ပြောင်း 12 %၊ အခြား 8 %
        - ပထမဆုံး ပြန်ဖြေချိန် ပျမ်းမျှ 38 မိနစ်၊ ticket တစ်ခုကို ဖြေရှင်းချိန် ပျမ်းမျှ 11 မိနစ်

        ## System များ

        - Ticket system: customer ရဲ့ တိုင်ကြားချက်တွေ
        - Billing: plan၊ invoice၊ ငွေပေးချေမှု (သက်တမ်း 9 နှစ်ရှိ codebase)
        - NMS: မြို့နယ်အလိုက် လိုင်းကျမှု အခြေအနေ
        - Knowledge base: ပြဿနာဖြေရှင်းနည်း article 340

        ## မုန်တိုင်းကျတဲ့ည

        - မြို့နယ် 3 ခုမှာ လိုင်းကျ၊ ticket က ပုံမှန်ရဲ့ 4 ဆ
        - chat AI နဲ့ ရေးထားတဲ့ အဖြေ 64 စောင်က လိုင်းကျနေတဲ့ customer တွေကို router ပြန်ဖွင့်ခိုင်းခဲ့တယ်

        ## FDE အလုပ် (12 ပတ်)

        - Reply assistant: support ticket အတွက် အဖြေ မူကြမ်း ရေးပေးတဲ့ agent
        - Billing team နဲ့ Claude Code
        - ကုမ္ပဏီ တစ်ခုလုံးအတွက် Claude
      examples/dispute-response.example.json: |
        {
          "id": "msg_01Dp6tY2wK9mRc4vXn8bLq3F",
          "type": "message",
          "role": "assistant",
          "model": "claude-opus-5-5",
          "content": [
            {
              "type": "thinking",
              "thinking": "Compared the August, September and October invoices with the three payments. The plan changed from 35,000 to 45,000 on 12 September, so September holds two part-month charges, not a double charge.",
              "signature": "EqQBCkgIARABGAIiQKz7c1mVb0sXr4uQe2Ld9hT6yNw3pJ8aGf5Rk1Ys0vBt"
            },
            {
              "type": "text",
              "text": "No double charge. September shows two part-month charges because the plan changed on 12 September. Suggest explaining the plan change to the customer."
            }
          ],
          "stop_reason": "end_turn",
          "stop_sequence": null,
          "stop_details": null,
          "usage": {
            "input_tokens": 3920,
            "output_tokens": 2650
          }
        }
      package.json: |
        {
          "name": "fde-notebook",
          "private": true,
          "version": "1.0.0",
          "scripts": {
            "dev": "echo concept lesson: nothing to run"
          }
        }
      reply-assistant/src/dispute.ts: |
        import Anthropic from "@anthropic-ai/sdk";

        const client = new Anthropic();

        // A billing dispute: three months of invoices and payments that the customer says do not match.
        export async function reviewDispute(ticket: string, invoices: string) {
          const response = await client.messages.create({
            model: "claude-opus-5-5", // ID as of 2026-11
            max_tokens: 16000,
            system: "Check a disputed Naychi Fiber bill line by line. A support agent reviews your finding.",
            messages: [{ role: "user", content: `${ticket}\n\n${invoices}` }],
          });

          for (const block of response.content) {
          }
        }
