# Go course, lesson 20: interfaces (Burmese).
#
# Start state: main.go (`package main`, `import "fmt"`, an empty main), courier.go holding only
# `package main`, parcel.go and fees.go pinned from lesson 19 (COURSE-KIT §3.4).
# Edits, all insert-only:
#   1. courier.go: the Courier interface, BusGate with Fee and Hours, busHours; main.go: quote and
#      quote(BusGate{City: "MDY"}, 2.5) -> run-1: 6000 ကျပ် 9 နာရီ;
#   2. courier.go: Rider with Fee only; main.go: quote(Rider{Name: "လှလှ"}, 2.5) -> run-2: compile
#      error `./main.go:12:8: cannot use Rider{…} … (missing method Hours)`;
#   3. courier.go: Rider's Hours; parcel.go: import "fmt" and String(); main.go: a parcel printed
#      -> run-3: 6000 ကျပ် 9 နာရီ / 2600 ကျပ် 3 နာရီ / MDY-0001 2.5 kg မန္တလေး.
# Boards: (J) an interface is a job notice: anyone who can say a fee and a time, BusGate and Rider
# both fit, quote reads only the notice, no declaration needed; (S) fmt's Stringer, a parcel printed
# before and after String(); (Q) quiz: a Parcel (Fee() int, no Hours) passed to quote.
# Fixtures: bun ~/Documents/go-course-work/tools/sim-go.ts <this yaml> --write
schemaVersion: 1

lesson:
