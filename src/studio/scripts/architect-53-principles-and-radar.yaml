  - id: written
    chapter: တစ်နေရာတည်းမှာ ရေးထားခြင်း
    narration: >
      [[mark:d-close]] radar ကို team တိုင်း ဖတ်နိုင်တဲ့ နေရာမှာ ရေးထားမှ အသုံးဝင်ပါတယ်။ message broker အတွက်
      အပိုင်းကို table နဲ့ ချရေးကြည့်ရအောင်။
      [[mark:type-radar]] အလုပ်အသစ် စမယ့်သူက ဘာကို သုံးရမလဲ၊ ဘာကို ထပ်မသုံးသင့်ဘူးလဲ ဆိုတာကို တစ်ချက်ကြည့်ရုံနဲ့
      သိရပါမယ်။ broker အသစ်ရဲ့ ဘေးမှာ Notification team ရေးခဲ့တဲ့ ADR နံပါတ်ကို ထည့်ထားတာက၊ အသေးစိတ်ကို ဘယ်မှာ
      ဖတ်ရမလဲ၊ ဘယ်သူ့ကို မေးရမလဲ သိအောင်ပါ။ ဆုံးဖြတ်ချက်တွေက radar ကို ပြောင်းပေးပြီး၊ radar ကလည်း နောက်
      ဆုံးဖြတ်ချက်တွေကို ကူပေးတာပါ။ ဒါကြောင့် radar ကို ခြောက်လတစ်ခါလောက် team တွေနဲ့ အတူ ပြန်စစ်ပါတယ်။
      [[mark:sel-rest]] principle နဲ့ radar အပြင်၊ ပုံကို ပြည့်စုံစေတာ နှစ်ခု ကျန်ပါသေးတယ်။ ပထမက team တိုင်း
      တိုင်းတာလို့ရတဲ့ ပန်းတိုင်တွေပါ။ ရှာတာ ဘယ်လောက် မြန်ရမလဲ၊ ဝယ်တာ ဘယ်လောက် ရနေရမလဲ ဆိုတာကို ကိန်းဂဏန်းနဲ့
      သဘောတူထားတာပါ။
      [[mark:sel-invest]] ဒုတိယက ကုမ္ပဏီက ဒီနှစ် ဘယ်နေရာမှာ အားစိုက်မလဲ ဆိုတဲ့ စာတိုလေးပါ။ CTO ဖြစ်တဲ့
      အောင်အောင် က ဒီနှစ်အတွက် ပါဆယ် လုပ်ငန်းနဲ့ platform ကို ရွေးထားပါတယ်။ ဒီ လေးခုကို သိထားတဲ့ team က ကိုယ့်
      ခွင့်ပြုချက်ကို မစောင့်ဘဲနဲ့ ကုမ္ပဏီနဲ့ ကိုက်တဲ့ ဆုံးဖြတ်ချက်ကို ချနိုင်ပါတယ်။
    sources:
