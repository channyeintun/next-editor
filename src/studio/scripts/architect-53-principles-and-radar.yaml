build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 8153

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: need
    chapter: Broker လေးမျိုးမြောက်
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ ထိခိုက်မယ့်သူနဲ့ ကျွမ်းကျင်သူဆီက အကြံ တောင်းပြီးရင် ဘယ်သူမဆို ဆုံးဖြတ်နိုင်တဲ့ advice
      process ကို လေ့လာခဲ့ပါတယ်။
      [[mark:n-open]] Booking team နဲ့ သုံးလ စမ်းပြီး ပြန်သုံးသပ်တော့ အဆင်ပြေတာမို့၊ အခု ခရီးဖော် ရဲ့ team ၁၂ ခုလုံးက
      အဲဒီနည်းနဲ့ ကိုယ်တိုင် ဆုံးဖြတ်နေကြပါပြီ။ ဆုံးဖြတ်ချက်တွေ
      မြန်လာပေမဲ့ ပြဿနာ အသစ် တစ်ခု ပေါ်လာပါတယ်။
      [[mark:n-three]] ခရီးဖော် မှာ message broker သုံးမျိုး ရှိနေပါပြီ။ message broker ဆိုတာ service တစ်ခုက
      ပို့တဲ့ message ကို နောက် service တစ်ခုဆီ ရောက်အောင် ကြားက သယ်ပေးတဲ့ အပိုင်းပါ။ နှစ်တွေ ကြာလာတာနဲ့အမျှ
      team တစ်ခုစီက ကိုယ့် လိုအပ်ချက်အတွက် တစ်မျိုးစီ ထည့်ခဲ့ကြတာပါ။
      [[mark:n-new]] ဒီအပတ်မှာ Notification team က စတုတ္ထ အမျိုးအစား တစ်ခု ထည့်ဖို့ အကြံ လာတောင်းပါတယ်။ ကား
      မထွက်ခင် သုံးနာရီအလိုမှာ ခရီးသည်ဆီ သတိပေး SMS ပို့ချင်လို့၊ message ကို အချိန်ကျမှ ပို့ပေးနိုင်တဲ့ broker
      အသစ် တစ်ခုကို သုံးချင်တာပါ။ သူတို့ဘက်က ကြည့်ရင် ကျိုးကြောင်း ဆီလျော်ပါတယ်။
      [[mark:n-cost]] ကိုယ့်ဘက်က ကြည့်ရင်တော့ အမျိုးအစား တစ်ခု တိုးတိုင်း အဲဒါကို operate လုပ်တတ်တဲ့သူ၊ monitor
      လုပ်ဖို့ dashboard နဲ့ ညဘက် ပျက်ရင် ပြင်နိုင်မယ့်သူ လိုလာပါတယ်။ team ၁၂ ခုလုံးက ဒီလို တစ်ခုစီ ထည့်သွားရင်
      ဘယ်သူမှ မထိန်းနိုင်တော့ပါဘူး။
      [[mark:n-but]] ဒါပေမဲ့ ကိုယ်က မထည့်နဲ့လို့ တားလိုက်ရင်လည်း၊ ဆုံးဖြတ်ချက်တိုင်း ကိုယ့်ဆီ ပြန်ရောက်လာတဲ့
      ပုံစံဟောင်းကို ပြန်ရောက်သွားမှာပါ။
      [[mark:n-q]] တားမယ့်သူ မရှိဘဲ ကုမ္ပဏီ တစ်ခုလုံး ဘယ်လို တစ်သားတည်း ရှိနေမလဲ။
    sources:
      - {
          title: "Facilitating Software Architecture (Harmel-Law)",
          url: "https://oreil.ly/FacilitatingSoftwareArch",
        }
    actions:
      - {
          id: draw-n-open,
          type: whiteboard.apply,
          at: { mark: n-open },
          open: true,
          upsertIds: [n-title],
        }
      - {
          id: draw-n-three,
          type: whiteboard.apply,
          at: { mark: n-three },
          upsertIds: [n-b1, n-b1-l, n-b2, n-b2-l, n-b3, n-b3-l],
          drawMs: 2700,
        }
      - {
          id: draw-n-new,
          type: whiteboard.apply,
          at: { mark: n-new },
          upsertIds: [n-team, n-arrow, n-new, n-new-l],
          drawMs: 2000,
        }
      - {
          id: draw-n-cost,
          type: whiteboard.apply,
          at: { mark: n-cost },
          upsertIds: [n-cost],
          drawMs: 1500,
        }
      - { id: draw-n-q, type: whiteboard.apply, at: { mark: n-q }, upsertIds: [n-q], drawMs: 1300 }

  - id: shared
    chapter: ထိန်းချုပ်တာ မဟုတ်ဘဲ အတူ သိထားတာ
    narration: >
      [[mark:c-open]] အဖြေက ထိန်းချုပ်တာ မဟုတ်ဘဲ၊ ဆုံးဖြတ်မယ့်သူတိုင်း အတူတူ သိထားတာတွေ ရှိအောင် လုပ်တာပါ။
      ကုမ္ပဏီအတွက် ဘာက အရေးကြီးလဲ၊ ဘာတွေ ရှိပြီးသားလဲ ဆိုတာကို team တိုင်း သိထားရင်၊ သီးခြားစီ ဆုံးဖြတ်ကြလည်း
      ဦးတည်ရာက တူလာတတ်ပါတယ်။
      [[mark:c-principle]] အဲဒီအတွက် ပထမဆုံး လိုတာက principle တွေပါ။ principle ဆိုတာ ဆုံးဖြတ်ချက်တွေကို
      လမ်းညွှန်ပေးဖို့ အတူ သဘောတူထားတဲ့ စာကြောင်း တိုတိုတွေပါ။ architect လေးယောက်က ရေးပြီး ကြေညာတာ မဟုတ်ဘဲ၊
      team တိုင်းက လူတွေ ပါတဲ့ workshop တစ်ခုမှာ အတူတူ ရေးကြပါတယ်။ ကိုယ်တိုင် ပါဝင် ရေးခဲ့တဲ့ စာကြောင်းကို
      လူတွေက ပိုသုံးဖြစ်တတ်လို့ပါ။
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ workshop မှာ ပထမဆုံး ထွက်လာတဲ့ စာကြောင်းက ကိုယ်တို့ quality ကို
      တန်ဖိုးထားတယ် ဆိုတာပါ။ အားလုံးကလည်း ခေါင်းညိတ်ကြပါတယ်။
      [[mark:q-a]] ဒါက အသုံးဝင်တဲ့ principle လား။
      [[mark:q-b]] ဒါမှမဟုတ် အသုံးမဝင်ဘူးလား။ Notification team ရဲ့ broker ကိစ္စကို စိတ်ထဲထားပြီး၊ lesson ကို
      pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ အသုံးမဝင်ဘူး ဆိုတာပါ။ ဘာကြောင့်လဲဆိုတော့ ဒီစာကြောင်းကို ဘယ်သူမှ
      မငြင်းနိုင်လို့ပါ။ broker အသစ် ထည့်မယ့်သူကလည်း quality အတွက်လို့ ပြောမယ်၊ မထည့်ဘူး ဆိုတဲ့သူကလည်း quality
      အတွက်လို့ပဲ ပြောမှာပါ။
      [[mark:q-r]] ရွေးစရာ နှစ်ခုလုံးကို ထောက်ခံနေတဲ့ စာကြောင်းက ဘာကိုမှ မဆုံးဖြတ်ပေးပါဘူး။
      [[mark:q-test]] ဒါကြောင့် principle တစ်ခုကို စစ်တဲ့ မေးခွန်းက၊ စဉ်းစားတတ်တဲ့သူ တစ်ယောက်က ဒီ
      စာကြောင်းရဲ့ ဆန့်ကျင်ဘက်ကို ရွေးနိုင်မလား ဆိုတာပါ။ ရွေးနိုင်မှ ဒီ principle က တစ်ခုခုကို တကယ်
      ဆုံးဖြတ်ပေးနေတာပါ။
    sources:
      - {
          title: "Facilitating Software Architecture (Harmel-Law)",
          url: "https://oreil.ly/FacilitatingSoftwareArch",
        }
    actions:
      - {
          id: draw-n-ans,
