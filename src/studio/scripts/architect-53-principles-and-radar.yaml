  - id: principles
    chapter: Principle နှစ်ခု
    narration: >
      [[mark:p-close]] workshop ကနေ နောက်ဆုံး ထွက်လာတဲ့ principle ကိုးခုထဲက နှစ်ခုကို ကြည့်ရအောင်။ ဆယ်ခုဝန်းကျင်ထက်
      မပိုအောင် ထားတာက၊ လူတိုင်း ခေါင်းထဲမှာ မှတ်ထားနိုင်မှ ဆုံးဖြတ်တဲ့အချိန်မှာ သုံးဖြစ်မှာမို့ပါ။
      [[mark:type-p1]] ပထမ principle က ရှိပြီးသားကို အရင် သုံးမယ် ဆိုတာပါ။ ဒီစာကြောင်းရဲ့ ဆန့်ကျင်ဘက်ကို ရွေးတဲ့
      ကုမ္ပဏီတွေ တကယ် ရှိပါတယ်။ team တစ်ခုစီက ကိုယ့်အလုပ်နဲ့ အကိုက်ဆုံး tool ကို လွတ်လွတ်လပ်လပ် ရွေးစေတဲ့
      ကုမ္ပဏီတွေပါ။ ဒါကြောင့် ဒီ principle က ခရီးဖော် ဘယ်ဘက်ကို ရွေးထားလဲ ဆိုတာကို ပြောပြနေတာပါ။
      [[mark:type-p1-why]] principle တစ်ခုမှာ စာကြောင်းအပြင် နောက်ထပ် နှစ်ခု ပါရပါတယ်။ ဘာကြောင့်လဲ ဆိုတာနဲ့၊
      လက်တွေ့မှာ ဘာလုပ်ရမလဲ ဆိုတာပါ။ ဘာကြောင့်လဲ ဆိုတာက ကိုယ် စိုးရိမ်ခဲ့တဲ့ ကုန်ကျစရိတ်ပါပဲ။ လက်တွေ့မှာတော့
      အသစ် ထည့်ချင်တဲ့ team က ရှိပြီးသားနဲ့ ဘာလို့ မရတာလဲ ဆိုတာကို ADR ထဲမှာ ရေးပြရပါမယ်။ ADR ဆိုတာ ဘာကို
      ဘာကြောင့် ဆုံးဖြတ်ခဲ့လဲ ရေးမှတ်ထားတဲ့ စာတိုလေးပါ။
      [[mark:p-not-rule]] ဒီ principle က အသစ် ထည့်တာကို တားထားတာ မဟုတ်တာကို သတိထားပါ။ principle ဆိုတာ မျက်စိမှိတ်
      လိုက်နာရမယ့် စည်းကမ်း မဟုတ်ဘဲ၊ စဉ်းစားရမယ့် ဦးတည်ချက်ကို ပေးတာပါ။ ရှိပြီးသားနဲ့ တကယ် မရတဲ့
      လိုအပ်ချက်ဆိုရင် အကြောင်းပြချက် ရေးပြီး အသစ် ထည့်လို့ ရပါတယ်။
      [[mark:type-p2]] ဒုတိယ principle က လက်မှတ် ဝယ်တာကို အရင် ကာကွယ်မယ် ဆိုတာပါ။ ခရီးသည် ဝယ်လို့ မရတဲ့
      မိနစ်တိုင်းမှာ ရောင်းအားရော၊ ကားလိုင်းတွေရဲ့ ယုံကြည်မှုရော ဆုံးရှုံးလို့ပါ။ ဒါကြောင့် load များလာတဲ့အခါ
      report နဲ့ dashboard တွေကို အရင် နှေးခွင့်ပေးပါမယ်။ feature အားလုံး တန်းတူ အရေးကြီးတယ်လို့ ယူဆတဲ့သူက ဒါကို
      သဘောတူမှာ မဟုတ်ပါဘူး။ အဲဒီလို တစ်ခုခုကို လက်လွှတ်ရတာ ပါမှ principle က အလုပ်လုပ်တာပါ။
      [[mark:p-revisit]] principle တွေက တစ်ခါ ရေးပြီး ပြီးသွားတာလည်း မဟုတ်ပါဘူး။ ဆုံးဖြတ်ချက်တွေက principle
      တစ်ခုနဲ့ ခဏခဏ ငြိနေရင်၊ ဒါမှမဟုတ် ဘယ် ADR ကမှ မကိုးကားတော့ရင်၊ အဲဒီ principle ကို ပြန်ကြည့်ရမယ့်
      အချိန်ပါ။
    sources:
      - {
          title: "Facilitating Software Architecture (Harmel-Law)",
          url: "https://oreil.ly/FacilitatingSoftwareArch",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: p-close }, open: false }
      - {
          id: open-notebook,
          type: workspace.openFile,
          at: { afterAction: close-quiz },
          path: notebook/53-principles.md,
        }
      - id: type-p1
        type: editor.type
        at: { mark: type-p1 }
        cadence: line-by-line
        target: { file: notebook/53-principles.md, after: "## Principles (9 ခုထဲက 2 ခု)\n\n" }
        text: "### 1. ရှိပြီးသားကို အရင် သုံးမယ်\n\n"
      - id: type-p1-why
        type: editor.type
        at: { mark: type-p1-why }
        cadence: line-by-line
        target: { file: notebook/53-principles.md, after: "### 1. ရှိပြီးသားကို အရင် သုံးမယ်\n" }
        text: "- ဘာကြောင့်: technology တစ်မျိုး တိုးတိုင်း operate လုပ်ရသူနဲ့ ညဘက် တာဝန် တိုးတယ်\n- ဒါကြောင့်: အသစ် ထည့်ရင် ရှိပြီးသားနဲ့ ဘာလို့ မရလဲ ADR မှာ ရေးမယ်\n"
      - id: sel-so
        type: editor.select
        at: { mark: p-not-rule }
        target:
          {
            file: notebook/53-principles.md,
            text: "- ဒါကြောင့်: အသစ် ထည့်ရင် ရှိပြီးသားနဲ့ ဘာလို့ မရလဲ ADR မှာ ရေးမယ်",
          }
      - id: type-p2
        type: editor.type
        at: { mark: type-p2 }
        cadence: line-by-line
        target: { file: notebook/53-principles.md, after: "ဘာလို့ မရလဲ ADR မှာ ရေးမယ်\n" }
        text: "\n### 2. လက်မှတ် ဝယ်တာကို အရင် ကာကွယ်မယ်\n- ဘာကြောင့်: ဝယ်မရတဲ့ မိနစ်တိုင်း ရောင်းအားနဲ့ ကားလိုင်းရဲ့ ယုံကြည်မှု ဆုံးတယ်\n- ဒါကြောင့်: load များရင် report နဲ့ dashboard ကို အရင် နှေးခွင့်ပေးမယ်\n"

  - id: radar
    chapter: ကိုယ်ပိုင် technology radar
    narration: >
      [[mark:r-open]] principle က ဦးတည်ချက်ကို ပြောပေမဲ့၊ ရှိပြီးသား ဆိုတာ ဘာတွေလဲ ဆိုတာကိုတော့ မပြောပါဘူး။
      အဲဒါကို ပြတာက technology radar ပါ။ technology radar ဆိုတာ ကုမ္ပဏီက သုံးနေတဲ့ technology တွေကို ကွင်း
      လေးကွင်းထဲ ခွဲပြထားတဲ့ ပုံပါ။ အပြင်က radar တစ်ခုကို ကူးယူတာ မဟုတ်ဘဲ၊ team တွေ တကယ် သုံးနေတာ၊ စမ်းဖူးတာတွေကို
      စုထားတာပါ။
      [[mark:r-adopt]] အတွင်းဆုံး ကွင်းက adopt ပါ။ စိတ်ချလက်ချ သုံးလို့ရပြီး၊ အလုပ်အသစ်တိုင်းအတွက် ပထမဆုံး
      ရွေးသင့်တာတွေပါ။ ခရီးဖော် မှာ event stream နဲ့ job queue က ဒီထဲမှာ ရှိပါတယ်။
      [[mark:r-trial]] ဒုတိယ ကွင်းက trial ပါ။ team တစ်ခု နှစ်ခုက production မှာ တကယ် စမ်းသုံးနေတာတွေပါ။ feature flag ကို
      team နှစ်ခုက စမ်းနေတာမျိုးပါ။
      [[mark:r-assess]] တတိယ ကွင်းက assess ပါ။ မသုံးသေးဘဲ လေ့လာ စောင့်ကြည့်နေတာတွေပါ။ ငွေပြန်အမ်းတဲ့
      လုပ်ငန်းစဉ်အတွက် workflow engine တစ်ခုကို လေ့လာနေတာမျိုးပါ။
      [[mark:r-hold]] အပြင်ဆုံး ကွင်းက hold ပါ။ အသစ် ထပ်မသုံးဖို့ သဘောတူထားတာတွေပါ။ Payment မှာပဲ ကျန်နေတဲ့ pub sub
      broker အဟောင်းက ဒီထဲမှာပါ။
      [[mark:r-road]] adopt ကွင်းက ခင်းပြီးသား လမ်းကို ပြတာပါ။ အဲဒီလမ်းအတိုင်း သွားရင် သုံးတတ်တဲ့သူတွေ၊ dashboard
      တွေ၊ အဆင်သင့် template တွေ ရှိပြီးသားမို့ မြန်ပါတယ်။
      [[mark:r-new]] Notification team က radar ကို ကြည့်ပြီး platform team ဆီက အကြံ တောင်းပါတယ်။
      [[mark:r-queue]] platform team က job queue မှာ message ကို အချိန်ကျမှ ပို့တဲ့ လုပ်ဆောင်ချက် ပါပြီးသားလို့ ပြောပြပါတယ်။ team က broker အသစ်
      မထည့်တော့ဘဲ job queue ကို သုံးဖို့ ကိုယ်တိုင် ဆုံးဖြတ်လိုက်ပါတယ်။
      [[mark:r-note]] broker အသစ်ကိုတော့ hold ထဲမှာ မှတ်ချက်နဲ့အတူ ထည့်ထားလိုက်ပါတယ်။ နောက်တစ်ခါ တခြား team က ဒီ
      broker ကို စဉ်းစားမိရင်၊ ဘယ်သူ လေ့လာဖူးလဲ၊ ဘာကြောင့် မသုံးခဲ့လဲ ဆိုတာကို ဒီမှာ တွေ့ရမှာပါ။
      [[mark:r-leave]] hold ဆိုတာလည်း တားမြစ်ချက် မဟုတ်ပါဘူး။ ခင်းပြီးသား လမ်းပေါ်က ထွက်ချင်ရင် ထွက်လို့ ရပါတယ်။
      အကြံ တောင်းရမယ်၊ ဘာကြောင့် ထွက်လဲ ADR မှာ ရေးရမယ်၊ အဲဒီ technology ကို operate လုပ်ရတဲ့ ဝန်ကိုလည်း ကိုယ့်
      team က ထမ်းရမယ် ဆိုတာပါပဲ။
    sources:
      - {
          title: "Facilitating Software Architecture (Harmel-Law)",
          url: "https://oreil.ly/FacilitatingSoftwareArch",
        }
    actions:
      - {
          id: draw-rings,
          type: whiteboard.apply,
          at: { mark: r-open },
          open: true,
          clear: true,
          upsertIds: [rd-r1, rd-r2, rd-r3, rd-r4],
          drawMs: 2800,
        }
      - {
          id: draw-adopt,
          type: whiteboard.apply,
          at: { mark: r-adopt },
          upsertIds: [rd-l1, rd-b1],
          drawMs: 1500,
        }
      - {
          id: draw-trial,
          type: whiteboard.apply,
