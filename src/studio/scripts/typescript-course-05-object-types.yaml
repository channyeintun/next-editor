build:
  # Studio replaces this built-in profile at render time with the Burmese provider chosen in the
  # render console (AthanLab with the user's own key, or VoxCPM2 when that feature is enabled).
  voiceProfile: pocket-alba-v1
  seed: 3105
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "Object type ဆိုတာ"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ parameter တွေ၊ variable တွေကို string ရယ်၊ number ရယ် လို အခြေခံ
      type တွေနဲ့ ကြေညာခဲ့ပြီး၊ type မပေးထားတဲ့ parameter က any ဖြစ်သွားရင် TypeScript က ဘာမှ
      စစ်မပေးနိုင်တော့ဘူး ဆိုတာ မြင်ခဲ့ပါတယ်။ ဒါပေမဲ့ တကယ့် program တွေမှာ function တစ်ခုက တန်ဖိုး
      တစ်ခုတည်း မဟုတ်ဘဲ၊ တန်ဖိုး အများကြီး စုထားတဲ့ object တစ်ခုလုံးကို လက်ခံတာ များပါတယ်။ ဒီ lesson
      မှာ အဲဒီလို object တွေကို type ဘယ်လို ပေးမလဲ ဆိုတာ ကြည့်သွားပါမယ်။ [[mark:draw-value]] ဆိုင်ရဲ့
      မီးဖိုချောင်ကို ပို့တဲ့ အော်ဒါ တစ်ခုကို ကြည့်ရအောင်။ ဒီ အော်ဒါမှာ မှာတဲ့ ပစ္စည်းရဲ့ နာမည်၊ ခွက်
      အရေအတွက်နဲ့ စားပွဲ နံပါတ် ဆိုပြီး တန်ဖိုး သုံးခု ပါပါတယ်။ JavaScript မှာ ဒီလို နာမည် တစ်ခုစီနဲ့
      တန်ဖိုးတွေကို တွဲပြီး စုထားတာကို object လို့ ခေါ်ပြီး၊ နာမည် တစ်ခုချင်းစီကိုတော့ property လို့
      ခေါ်ပါတယ်။ [[mark:draw-shape]] TypeScript အတွက် အရေးကြီးတာက တန်ဖိုးတွေ ကိုယ်တိုင် မဟုတ်ဘဲ၊ ဒီ
      object ရဲ့ ပုံစံပါ။ ဆိုလိုတာက ဘယ် property တွေ ပါရမလဲ၊ property တစ်ခုချင်းစီက ဘာ type ဖြစ်ရမလဲ
      ဆိုတာပါ။ ဒီ အော်ဒါမှာဆိုရင် ပစ္စည်းနာမည်က string ဖြစ်ရပြီး၊ ခွက် အရေအတွက်နဲ့ စားပွဲ နံပါတ်ကတော့
      number ဖြစ်ရပါမယ်။ [[mark:draw-name]] ဒီလို ပုံစံကို ရေးပြတဲ့ type ကို object type လို့ ခေါ်ပါတယ်။
      object type တစ်ခု ရှိသွားရင်၊ ဒီ ပုံစံနဲ့ မကိုက်တဲ့ object ကို တွေ့တာနဲ့ TypeScript က error နဲ့
      ချက်ချင်း ထောက်ပြပေးနိုင်ပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 4: Essential Types and Annotations (object literal types)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/essential-types-and-annotations",
        }
      - {
          title: "TypeScript Handbook: Everyday Types (object types)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#object-types",
        }
      - {
          title: "MDN: Working with objects",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Working_with_objects",
        }
    actions:
      - id: open-board-a
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [o-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-value
        type: whiteboard.apply
        at: { mark: draw-value }
        upsertIds: [o-value-box, o-value-head, o-value-1, o-value-2, o-value-3]
        drawMs: 2800
      - id: draw-shape
        type: whiteboard.apply
        at: { mark: draw-shape }
        upsertIds: [o-arrow, o-type-box, o-type-head, o-type-1, o-type-2, o-type-3]
        drawMs: 3200
      - id: draw-name
        type: whiteboard.apply
        at: { mark: draw-name }
        upsertIds: [o-name, o-check]
        drawMs: 1800

  - id: starter
    narration: >
      [[mark:close-board]] ဒီနေ့ code ကို ကြည့်ရအောင်။ [[mark:open-kitchen]] ဒါက မီးဖိုချောင်အတွက်
      အော်ဒါ စာရွက် ထုတ်ပေးတဲ့ kitchen ဖိုင်ပါ။ [[mark:select-param]] ဒီ function က အော်ဒါ တစ်ခုကို
      parameter အနေနဲ့ လက်ခံပါတယ်။ parameter မှာ type မပေးထားသေးတဲ့အတွက်၊ ပြီးခဲ့တဲ့ lesson မှာ
      မြင်ခဲ့သလို သူက any ဖြစ်နေပါတယ်။ [[mark:select-body]] function ထဲမှာတော့ စားပွဲ နံပါတ်ကို
      အရင် ထုတ်ယူပြီး၊ ပစ္စည်းနာမည်၊ ခွက် အရေအတွက်နဲ့ စားပွဲ နံပါတ်ကို စာရွက်ပေါ်မှာ ရိုက်ထုတ်ပါတယ်။
      [[mark:open-main]] main ဖိုင်ကတော့ အော်ဒါ နှစ်ခုကို မီးဖိုချောင်ကို ပို့ပါတယ်။ [[mark:select-first]]
      ပထမ တစ်ခုက စားပွဲ နံပါတ် ၅ က မှာတဲ့ လက်ဖက်ရည် နှစ်ခွက်ပါ။ [[mark:select-takeaway]] ဒုတိယ
      တစ်ခုကတော့ ကော်ဖီ တစ်ခွက်ကို ပါဆယ် ယူသွားမယ့် အော်ဒါပါ။ ကောင်တာမှာ အော်ဒါကို အရင် ရေးထားပြီးမှ
      မီးဖိုချောင်ကို ပို့တာ ဖြစ်ပြီး၊ ပါဆယ် ဖြစ်လို့ စားပွဲ နံပါတ် မပါပါဘူး။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 4: Essential Types and Annotations (function parameter annotations)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/essential-types-and-annotations",
        }
      - {
          title: "TSConfig: noImplicitAny",
          url: "https://www.typescriptlang.org/tsconfig/#noImplicitAny",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: open-kitchen
        type: workspace.openFile
        at: { mark: open-kitchen }
        path: src/kitchen.ts
      - id: select-param
        type: editor.select
        at: { mark: select-param }
        target: { file: src/kitchen.ts, text: "printTicket(order)", occurrence: 1 }
      - id: select-body
        type: editor.select
        at: { mark: select-body }
        target:
          {
            file: src/kitchen.ts,
            text: "  const table = order.table;\n  console.log(order.item, order.cups, \"ခွက် · စားပွဲ\", table);",
            occurrence: 1,
          }
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: src/main.ts
      - id: select-first
        type: editor.select
        at: { mark: select-first }
        target:
          {
            file: src/main.ts,
            text: 'printTicket({ item: "လက်ဖက်ရည်", cups: 2, table: 5 });',
            occurrence: 1,
          }
      - id: select-takeaway
        type: editor.select
        at: { mark: select-takeaway }
        target:
          {
            file: src/main.ts,
            text: "const takeaway = { item: \"ကော်ဖီ\", cups: 1 };\nprintTicket(takeaway);",
            occurrence: 1,
          }

  - id: panel
    narration: >
      [[mark:panel-ready]] ညာဘက်က TypeScript panel ကို ကြည့်ရအောင်။ Errors အပိုင်းမှာ error တစ်ခု
      ရှိနေပါတယ်။ kitchen ဖိုင်က order ဆိုတဲ့ parameter မှာ type မရှိလို့ any ဖြစ်နေတယ်လို့ ပြောနေတာပါ။
      [[mark:read-output]] Output မှာတော့ အော်ဒါ စာရွက် နှစ်စောင် ထွက်လာပါတယ်။ ပထမ စာရွက်က မှန်နေပေမယ့်၊
      ပါဆယ် အော်ဒါရဲ့ စာရွက်မှာ စားပွဲ ဆိုတဲ့ စာရဲ့ နောက်မှာ undefined လို့ ပေါ်နေပါတယ်။
      မီးဖိုချောင်က ဝန်ထမ်းတွေအတွက် နားလည်ရ ခက်တဲ့ စာရွက်ပါ။ parameter က any ဖြစ်နေတော့၊ အော်ဒါ
      တစ်ခုမှာ ဘာတွေ ပါရမလဲ ဆိုတာ TypeScript မသိတဲ့အတွက် ဒီ ပြဿနာကို ဘာမှ သတိမပေးနိုင်ပါဘူး။
    sources:
      - {
          title: "TypeScript Handbook: Everyday Types (any, noImplicitAny)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#any",
        }
      - {
          title: "MDN: undefined",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/undefined",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-start-one-error
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-start-any
        type: expect.preview
        at: { afterAction: expect-start-one-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-code, value: "7006" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-start-any-file
        type: expect.preview
        at: { afterAction: expect-start-any }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-file, value: "src/kitchen.ts" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-start-output
        type: expect.preview
        at: { afterAction: expect-start-any-file }
        timeoutMs: 5000
        target: { by: testId, value: ts-output }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-start-tea
        type: expect.preview
        at: { afterAction: expect-start-output }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-1 }
        textContains: "လက်ဖက်ရည် 2 ခွက် · စားပွဲ 5"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-start-undefined
        type: expect.preview
        at: { afterAction: expect-start-tea }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-2 }
        textContains: "ကော်ဖီ 1 ခွက် · စားပွဲ undefined"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: inline
    chapter: "Parameter မှာ object type"
    narration: >
      [[mark:open-kitchen-2]] ဒါကြောင့် အော်ဒါ တစ်ခုရဲ့ ပုံစံကို TypeScript သိအောင် ပြောပြပေးရပါမယ်။
      kitchen ဖိုင်ကို ပြန်ဖွင့်ပါမယ်။ [[mark:type-inline]] parameter နာမည်ရဲ့ နောက်မှာ၊ ခုနက board ပေါ်က ပုံစံ အတိုင်း
      property သုံးခုနဲ့ သူတို့ရဲ့ type ကို ရေးပေးပါမယ်။ ပစ္စည်းနာမည်က string ဖြစ်ပြီး၊ ခွက် အရေအတွက်နဲ့
      စားပွဲ နံပါတ်ကတော့ number ပါ။ ဒီလို parameter နေရာမှာတင် တိုက်ရိုက် ရေးလိုက်တဲ့ object type ကို inline
      object type လို့ ခေါ်ပါတယ်။ [[mark:read-inline]] any error ပျောက်သွားပြီး၊ main ဖိုင်မှာ error
      အသစ် တစ်ခု ပေါ်လာပါပြီ။ [[mark:select-call]] ပါဆယ် အော်ဒါကို function ထဲ ပို့တဲ့ ဒီ နေရာကို
      ညွှန်ပြနေတာပါ။ error ရဲ့ အောက်ဆုံး အပိုင်းကို ဖတ်ကြည့်ရင်၊ ဒီ object မှာ table ဆိုတဲ့ property
      မပါဘူး၊ ဒါပေမဲ့ parameter ရဲ့ type က အဲဒါကို လိုအပ်တယ်လို့ ပြောနေပါတယ်။ ဆိုလိုတာက parameter မှာ
      object type ရေးလိုက်တာနဲ့၊ function ကို ခေါ်တဲ့ နေရာတိုင်းမှာ ပို့လိုက်တဲ့ object ကို TypeScript က
      ဒီ ပုံစံနဲ့ တိုက်စစ်ပေးနေပြီ ဆိုတာပါ။ [[mark:vs-code-inline]] function ထဲမှာလည်း အကျိုး ရှိပါတယ်။
      VS Code မှာဆိုရင် order ရဲ့ property တွေကို ရိုက်တဲ့ အခါ ဒီ သုံးခုကို autocomplete က စာရင်းနဲ့
      ပြပေးပြီး၊ နာမည် စာလုံးပေါင်း မှားရင်လည်း ချက်ချင်း error ပြပေးပါတယ်။ ကိုယ့် editor မှာ
      စမ်းကြည့်ပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 4: Essential Types and Annotations (object literal types)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/essential-types-and-annotations",
        }
      - {
          title: "TypeScript Handbook: Everyday Types (object types)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#object-types",
        }
      - {
          title: "VS Code: IntelliSense",
          url: "https://code.visualstudio.com/docs/editing/intellisense",
        }
    actions:
      - id: open-kitchen-2
        type: workspace.openFile
        at: { mark: open-kitchen-2 }
        path: src/kitchen.ts
      - id: type-inline
        type: editor.type
        at: { mark: type-inline }
        target: { file: src/kitchen.ts, after: "export function printTicket(order", occurrence: 1 }
        text: ": { item: string; cups: number; table: number }"
      - id: expect-inline-one-error
        type: expect.preview
        at: { afterAction: type-inline }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-inline-code
        type: expect.preview
        at: { afterAction: expect-inline-one-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-code, value: "2345" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-inline-file
        type: expect.preview
        at: { afterAction: expect-inline-code }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-file, value: "src/main.ts" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-inline-missing
        type: expect.preview
        at: { afterAction: expect-inline-file }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Property 'table' is missing in type '{ item: string; cups: number; }'"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: open-main-error
        type: workspace.openFile
        at: { mark: read-inline }
        path: src/main.ts
      - id: select-call
        type: editor.select
        at: { mark: select-call }
        target: { file: src/main.ts, text: "printTicket(takeaway)", occurrence: 1 }

  - id: optional
    chapter: "Optional property"
    narration: >
      [[mark:select-takeaway-2]] ဒါပေမဲ့ ဒီ နေရာမှာ ပြင်ရမှာက အော်ဒါလား၊ type လား။ ပါဆယ် အော်ဒါမှာ စားပွဲ နံပါတ်
      မပါတာ အမှား မဟုတ်ပါဘူး၊ တကယ်ကို မရှိတာပါ။ ဒါကြောင့် ပြင်ရမှာက အော်ဒါ မဟုတ်ဘဲ type ပါ။
      [[mark:type-optional]] kitchen ဖိုင်က type ထဲမှာ table ဆိုတဲ့ property နာမည်ရဲ့ နောက်မှာ question
      mark တစ်လုံး ထည့်ပါမယ်။ ဒါဆိုရင် ဒီ property က ပါလည်း ရ၊ မပါလည်း ရတဲ့ optional property
      ဖြစ်သွားပါတယ်။ [[mark:read-optional]] Errors အပိုင်းမှာ error တစ်ခုမှ မကျန်တော့ပါဘူး။
      [[mark:type-query-table]] ဒါဆို function ထဲမှာ စားပွဲ နံပါတ်ကို ထုတ်ယူတဲ့ အခါ TypeScript က သူ့ကို
      ဘာ type လို့ မြင်လဲ၊ query comment နဲ့ မေးကြည့်ရအောင်။ [[mark:read-query-table]] Types အပိုင်းမှာ
      number ဒါမှမဟုတ် undefined လို့ ပြနေပါတယ်။ ကိုယ်က number လို့ပဲ ရေးခဲ့ပေမယ့်၊ ဒီ property က
      မပါဘဲ နေနိုင်တဲ့အတွက် ဖတ်လိုက်ရင် undefined ရနိုင်တယ် ဆိုတာကို TypeScript က type ထဲမှာ ထည့်ပေးထားတာပါ။
      Output ထဲက undefined ဆိုတဲ့ စာကလည်း ဒီ ကိစ္စကြောင့်ပါ။ [[mark:type-default]] ဒါကြောင့် စားပွဲ
      နံပါတ် မပါရင် မရှိ ဆိုတဲ့ စာကို ပြဖို့၊ lesson ၂ မှာ သုံးခဲ့တဲ့ question mark နှစ်လုံးနဲ့ default
      တန်ဖိုး ထည့်ပေးပါမယ်။ [[mark:read-default]] Output မှာ ပါဆယ် အော်ဒါရဲ့ စာရွက်က စားပွဲ မရှိ ဆိုပြီး
      ရှင်းရှင်းလင်းလင်း ပြနေပါပြီ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 4: Essential Types and Annotations (optional object properties)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/essential-types-and-annotations",
        }
      - {
          title: "TypeScript Handbook: Object Types (optional properties)",
          url: "https://www.typescriptlang.org/docs/handbook/2/objects.html#optional-properties",
        }
      - {
          title: "MDN: Nullish coalescing operator (??)",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Nullish_coalescing",
        }
    actions:
      - id: select-takeaway-2
        type: editor.select
        at: { mark: select-takeaway-2 }
        target: { file: src/main.ts, text: '{ item: "ကော်ဖီ", cups: 1 }', occurrence: 1 }
      - id: open-kitchen-3
        type: workspace.openFile
        at: { mark: type-optional }
        path: src/kitchen.ts
      - id: type-optional
        type: editor.type
        at: { afterAction: open-kitchen-3 }
        target: { file: src/kitchen.ts, after: "cups: number; table", occurrence: 1 }
        text: "?"
      - id: expect-optional-clean
        type: expect.preview
        at: { afterAction: type-optional }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-query-table
        type: editor.type
        at: { mark: type-query-table }
        target: { file: src/kitchen.ts, after: "  const table = order.table;\n", occurrence: 1 }
        text: "//                    ^?\n"
        cadence: fast-explainer
      - id: expect-table-type
        type: expect.preview
        at: { afterAction: type-query-table }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        attribute: { name: data-type, value: "(property) table?: number | undefined" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-default
        type: editor.type
        at: { mark: type-default }
        target: { file: src/kitchen.ts, after: "  const table = order.table", occurrence: 1 }
        text: ' ?? "မရှိ"'
      - id: expect-default-output
        type: expect.preview
        at: { afterAction: type-default }
        timeoutMs: 8000
        target: { by: testId, value: ts-out-2 }
        textContains: "ကော်ဖီ 1 ခွက် · စားပွဲ မရှိ"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-default-clean
        type: expect.preview
        at: { afterAction: expect-default-output }
        timeoutMs: 5000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: alias
    chapter: "Type alias"
    narration: >
      [[mark:select-inline-type]] အခု parameter မှာ ရေးထားတဲ့ type ကို ကြည့်ပါ။ line တစ်ကြောင်းထဲမှာ
      property သုံးခု ကြပ်ကြပ် ရှိနေပြီး၊ ဒီ ပုံစံကို main ဖိုင်ကလည်း သုံးချင်ပါတယ်။ ဒီ type ကို လိုတဲ့
      နေရာတိုင်းမှာ ကူးရေးနေရင်၊ နောင်တစ်ချိန် property တစ်ခု ထပ်တိုးတဲ့ အခါ နေရာ အားလုံးမှာ
      လိုက်ပြင်ရပါမယ်။ [[mark:type-alias]] ဒါကြောင့် ဖိုင်ရဲ့ အပေါ်ဆုံးမှာ type ဆိုတဲ့ keyword နဲ့ ဒီ
      ပုံစံကို Order ဆိုတဲ့ နာမည် ပေးပါမယ်။ property တစ်ခုကို line တစ်ကြောင်းစီ ခွဲရေးထားလို့
      ဖတ်ရတာလည်း ပိုရှင်းပါတယ်။ ဒီလို type တစ်ခုကို နာမည်ပေးပြီး ပြန်သုံးလို့ ရအောင် လုပ်တာကို type
      alias လို့ ခေါ်ပါတယ်။ [[mark:type-signature]] ပြီးတော့ function ရဲ့ ပထမ line ကို Order type နဲ့
      အသစ် ပြန်ရေးပြီး၊ line အဟောင်းကိုတော့ comment လုပ်ပြီး ပိတ်ထားပါမယ်။ VS Code မှာဆိုရင် ဒီ အလုပ်ကို
      ကိုယ်တိုင် လုပ်စရာ မလိုပါဘူး။ type ကို select လုပ်ပြီး Refactor menu ကနေ type alias အဖြစ်
      ထုတ်ခိုင်းလိုက်ရင်၊ နာမည်ပေးတာနဲ့ အစားထိုးတာကို တစ်ခါတည်း လုပ်ပေးပါတယ်။ [[mark:read-alias]]
      panel မှာတော့ ဘာမှ မပြောင်းပါဘူး။ error မရှိသလို၊ အော်ဒါ စာရွက် နှစ်စောင်ကလည်း အရင်အတိုင်းပါပဲ။
      ဘာကြောင့်လဲဆိုတော့ type alias က type အသစ် ဖန်တီးတာ မဟုတ်ဘဲ၊ ရှိပြီးသား ပုံစံ တစ်ခုကို နာမည်
      တပ်ပေးလိုက်တာ ဖြစ်လို့ပါ။ ဒါကြောင့် Order လို့ ရေးတာနဲ့ ပုံစံ အပြည့်အစုံကို ရေးတာဟာ TypeScript
      အတွက် အတူတူပါပဲ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 4: Essential Types and Annotations (type aliases)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/essential-types-and-annotations",
        }
      - {
          title: "TypeScript Handbook: Everyday Types (type aliases)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#type-aliases",
        }
      - {
          title: "VS Code: TypeScript refactoring (Extract type to interface or type alias)",
          url: "https://code.visualstudio.com/docs/typescript/typescript-refactoring",
        }
    actions:
      - id: select-inline-type
        type: editor.select
        at: { mark: select-inline-type }
        target:
          {
            file: src/kitchen.ts,
            text: "{ item: string; cups: number; table?: number }",
            occurrence: 1,
          }
      - id: type-alias
        type: editor.type
        at: { mark: type-alias }
        target: { file: src/kitchen.ts, after: "", occurrence: 1 }
        text: "type Order = {\n  item: string;\n  cups: number;\n  table?: number;\n};\n\n"
        cadence: line-by-line
      - id: type-signature
        type: editor.type
        at: { mark: type-signature }
        target: { file: src/kitchen.ts, after: "  table?: number;\n};\n\n", occurrence: 1 }
        text: "export function printTicket(order: Order) {\n// "
        cadence: block
      - id: expect-alias-clean
        type: expect.preview
        at: { afterAction: type-signature }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-alias-output
        type: expect.preview
        at: { afterAction: expect-alias-clean }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-2 }
        textContains: "ကော်ဖီ 1 ခွက် · စားပွဲ မရှိ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-alias-type
        type: expect.preview
        at: { afterAction: expect-alias-output }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-1 }
        attribute: { name: data-type, value: "(property) table?: number | undefined" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: modules
    chapter: "ဖိုင်တွေကြား type ကို မျှသုံးခြင်း"
    narration: >
      [[mark:open-main-2]] main ဖိုင်ဘက် ပြန်သွားရအောင်။ [[mark:type-query-takeaway]] ပါဆယ် အော်ဒါရဲ့
      အောက်မှာ query comment ထည့်ကြည့်ပါမယ်။ [[mark:read-query-takeaway]] Types မှာ နာမည် မရှိတဲ့ object
      type တစ်ခုကို ပြနေပါတယ်။ TypeScript က object ထဲက တန်ဖိုးတွေကို ကြည့်ပြီး ပစ္စည်းနာမည်နဲ့ ခွက်
      အရေအတွက် ပါတဲ့ ပုံစံလို့ infer လုပ်ထားတာပါ။ ဒါက အော်ဒါ တစ်ခု ဖြစ်တယ် ဆိုတာကိုတော့ သူ မသိပါဘူး။
      [[mark:type-annotate]] ဒါကြောင့် ဒီ variable ကို Order type လို့ annotation ထည့်ကြည့်ရအောင်။
      [[mark:read-not-found]] Errors မှာ Order ဆိုတဲ့ နာမည်ကို ရှာမတွေ့ဘူး ဆိုတဲ့ error ပေါ်လာပါပြီ။
      import ဒါမှမဟုတ် export ပါတဲ့ ဖိုင်တိုင်းက module တစ်ခုစီ ဖြစ်ပြီး၊ module တစ်ခုထဲမှာ ကြေညာထားတဲ့
      နာမည်ကို တခြား ဖိုင်က တိုက်ရိုက် မမြင်ရပါဘူး။ function တွေမှာလိုပဲ type တွေကိုလည်း export လုပ်ပြီး
      import လုပ်ရပါတယ်။ [[mark:type-export]] ဒါကြောင့် kitchen ဖိုင်မှာ type alias ရဲ့ ရှေ့မှာ export
      ထည့်ပါမယ်။ [[mark:read-still-error]] error က မပျောက်သေးပါဘူး။ export လုပ်ထားပေမယ့် main ဖိုင်က
      import မလုပ်ရသေးလို့ပါ။ VS Code မှာဆိုရင် Order လို့ ရိုက်တဲ့ အခါ autocomplete က kitchen ဖိုင်ထဲက
      Order ကို ပြပေးပြီး၊ ရွေးလိုက်တာနဲ့ auto import က import line ကို ထည့်ပေးပါတယ်။
      [[mark:type-import]] ဒီမှာတော့ main ဖိုင်ရဲ့ အပေါ်ဆုံးမှာ import type နဲ့ Order ကို ကိုယ်တိုင်
      ယူလာပါမယ်။ [[mark:read-import]] error ပျောက်သွားပြီး၊ Types မှာလည်း ပါဆယ် အော်ဒါရဲ့ type ကို Order
      လို့ ပြနေပါတယ်။ အခုဆိုရင် ဒီ object မှာ property တစ်ခုခု မှားရင်၊ function ကို ပို့တဲ့ နေရာမှာ မဟုတ်ဘဲ
      object ကို ရေးတဲ့ နေရာမှာတင် error ပေါ်လာမှာပါ။ [[mark:explain-import-type]] import type လို့
      ရေးတာက ဒီ import မှာ type ပဲ ပါတယ်လို့ ရှင်းရှင်း ပြောလိုက်တာပါ။ type တွေက JavaScript ဖြစ်သွားတဲ့
      အခါ ဖယ်ထုတ်ခံရတဲ့အတွက်၊ ဒီ line တစ်ကြောင်းလုံးလည်း JavaScript ထဲမှာ ပါမသွားပါဘူး။ function လို
      တန်ဖိုးတွေနဲ့ type ကို line တစ်ကြောင်းတည်းကနေ import လုပ်ချင်ရင်တော့၊ type ဖြစ်တဲ့ နာမည်ရဲ့
      ရှေ့မှာပဲ type ဆိုတဲ့ စကားလုံး ထည့်ရေးလို့ ရပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 4: Essential Types and Annotations (sharing types across modules)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/essential-types-and-annotations",
        }
      - {
          title: "TypeScript Handbook: Modules (TypeScript-specific ES module syntax, import type)",
          url: "https://www.typescriptlang.org/docs/handbook/2/modules.html#typescript-specific-es-module-syntax",
        }
      - {
          title: "TypeScript 3.8 release notes: type-only imports and exports",
          url: "https://www.typescriptlang.org/docs/handbook/release-notes/typescript-3-8.html#type-only-imports-and-export",
        }
      - {
          title: "TypeScript 4.5 release notes: type modifiers on import names",
          url: "https://www.typescriptlang.org/docs/handbook/release-notes/typescript-4-5.html#type-modifiers-on-import-names",
        }
      - {
          title: "VS Code: TypeScript editing (auto imports)",
          url: "https://code.visualstudio.com/docs/typescript/typescript-editing",
        }
    actions:
      - id: open-main-2
        type: workspace.openFile
        at: { mark: open-main-2 }
        path: src/main.ts
      - id: type-query-takeaway
        type: editor.type
        at: { mark: type-query-takeaway }
        target:
          {
            file: src/main.ts,
            after: "const takeaway = { item: \"ကော်ဖီ\", cups: 1 };\n",
            occurrence: 1,
          }
        text: "//    ^?\n"
      - id: expect-takeaway-anonymous
        type: expect.preview
        at: { afterAction: type-query-takeaway }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-2 }
        textContains: "const takeaway: {"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-two-queries
        type: expect.preview
        at: { afterAction: expect-takeaway-anonymous }
        timeoutMs: 5000
        target: { by: testId, value: ts-types }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-annotate
        type: editor.type
        at: { mark: type-annotate }
        target: { file: src/main.ts, after: "const takeaway", occurrence: 1 }
        text: ": Order"
      - id: expect-not-found-count
        type: expect.preview
        at: { afterAction: type-annotate }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-not-found
        type: expect.preview
        at: { afterAction: expect-not-found-count }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Cannot find name 'Order'."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: open-kitchen-4
        type: workspace.openFile
        at: { mark: type-export }
        path: src/kitchen.ts
      - id: type-export
        type: editor.type
        at: { afterAction: open-kitchen-4 }
        target: { file: src/kitchen.ts, after: "", occurrence: 1 }
        text: "export "
      - id: expect-still-error
        type: expect.preview
        at: { afterAction: type-export }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-code, value: "2304" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: open-main-3
        type: workspace.openFile
        at: { mark: type-import }
        path: src/main.ts
      - id: type-import
        type: editor.type
        at: { afterAction: open-main-3 }
        target: { file: src/main.ts, after: "", occurrence: 1 }
        text: "import type { Order } from \"./kitchen\";\n"
        cadence: fast-explainer
      - id: expect-import-clean
        type: expect.preview
        at: { afterAction: type-import }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-takeaway-order
        type: expect.preview
        at: { afterAction: expect-import-clean }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-2 }
        attribute: { name: data-type, value: "const takeaway: Order" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-import-type
        type: editor.select
        at: { mark: explain-import-type }
        target:
          { file: src/main.ts, text: 'import type { Order } from "./kitchen";', occurrence: 1 }

  - id: recap
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ object type က object တစ်ခုမှာ ဘယ် property တွေ ပါရမလဲ၊ တစ်ခုချင်းစီ ဘာ
      type ဖြစ်ရမလဲ ဆိုတာကို ရေးပြတာ ဖြစ်ပြီး၊ parameter မှာ ရေးထားရင် function ကို ခေါ်တဲ့
      နေရာတိုင်းမှာ စစ်ပေးပါတယ်။ [[mark:recap-optional]] property နာမည်နောက်က question mark က မပါလည်း
      ရတဲ့ property ကို ပြပြီး၊ အဲဒီ property ကို ဖတ်တဲ့ အခါ type ထဲမှာ undefined ပါလာပါတယ်။
      [[mark:recap-alias]] type alias က ပုံစံ တစ်ခုကို နာမည်ပေးလိုက်လို့ နေရာ အများကြီးမှာ ပြန်သုံးလို့
      ရပြီး၊ export နဲ့ import type ကို သုံးရင် ဖိုင်တွေကြားမှာလည်း မျှသုံးလို့ ရပါတယ်။ နောက် lesson မှာတော့
      အော်ဒါ အများကြီးကို စုထားတဲ့ array ရယ်၊ နေရာ တစ်ခုချင်းစီမှာ type သီးသန့် ရှိတဲ့ tuple နဲ့ type
      argument ပေးတဲ့ နည်းကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 4: Essential Types and Annotations",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/essential-types-and-annotations",
        }
      - {
          title: "TypeScript Handbook: Object Types",
          url: "https://www.typescriptlang.org/docs/handbook/2/objects.html",
        }
    actions:
      - id: open-kitchen-5
        type: workspace.openFile
        at: { scene: start }
        path: src/kitchen.ts
      - id: select-optional-recap
        type: editor.select
        at: { mark: recap-optional }
        target: { file: src/kitchen.ts, text: "table?: number;", occurrence: 1 }
      - id: select-alias-recap
        type: editor.select
        at: { mark: recap-alias }
        target: { file: src/kitchen.ts, text: "export type Order = {", occurrence: 1 }
      - id: expect-file-kitchen-alias
        type: expect.file
        at: { afterAction: open-kitchen-5 }
        path: src/kitchen.ts
        contains: "export type Order = {\n  item: string;\n  cups: number;\n  table?: number;\n};\n\nexport function printTicket(order: Order) {\n// export function printTicket(order: { item: string; cups: number; table?: number }) {"
      - id: expect-file-kitchen-default
        type: expect.file
        at: { afterAction: expect-file-kitchen-alias }
        path: src/kitchen.ts
        contains: "  const table = order.table ?? \"မရှိ\";\n//                    ^?\n"
      - id: expect-file-main
        type: expect.file
        at: { afterAction: expect-file-kitchen-default }
        path: src/main.ts
        contains: "import type { Order } from \"./kitchen\";\nimport { printTicket } from \"./kitchen\";"
      - id: expect-file-takeaway
        type: expect.file
        at: { afterAction: expect-file-main }
        path: src/main.ts
        contains: "const takeaway: Order = { item: \"ကော်ဖီ\", cups: 1 };\n//    ^?\n"
checks:
  - { type: timing.p95Ms, max: 300 }
