build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 4131

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  - id: text-intro
    chapter: "စာသားကို ဘယ်လို စီမလဲ"
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ web font တွေကို ထည့်ပြီး၊ စာလုံးရဲ့ ပုံစံ၊ အရွယ်အစားနဲ့ အထူကို သတ်မှတ်ခဲ့ပါတယ်။
      ဒီ lesson မှာတော့ အဲဒီ စာသားကို page ပေါ်မှာ ဘယ်လို စီမလဲ ကြည့်ပါမယ်။ [[mark:start-server]] ဒီလို
      ပြောနေတုန်းမှာပဲ၊ board နောက်မှာ dev server ကို စနေပါပြီ။ [[mark:draw-case]] ပထမက စာလုံး အကြီး အသေးပါ။
      HTML ကို မပြင်ဘဲ၊ အင်္ဂလိပ် စာလုံးတွေကို CSS နဲ့ အကြီးတွေ အဖြစ် ပြလို့ ရပါတယ်။ [[mark:draw-lines]]
      ဒုတိယက link ရဲ့ အောက်မျဉ်း၊ ဈေးနှုန်း အဟောင်းပေါ်က ဖြတ်မျဉ်း စတဲ့ စာပေါ်က မျဉ်းတွေပါ။
      [[mark:draw-align]] တတိယက ညှိတာပါ။ စာကြောင်းတွေကို box ထဲမှာ ဘယ်နေရာ ထားမလဲ ဆိုတာပါ။
      [[mark:draw-space]] စတုတ္ထက white space ပါ။ HTML ထဲမှာ ရေးထားတဲ့ space တွေ၊ line break တွေကို page
      ပေါ်မှာ ပြမလား ဆိုတာပါ။ [[mark:draw-wrap]] ပဉ္စမက wrap ပါ။ စာကြောင်း ရှည်ကို ဘယ်မှာ ခွဲမလဲ၊
      ခေါင်းစဉ်ရဲ့ စကားလုံးတွေကို စာကြောင်းတွေကြား ဘယ်လို ဝေမလဲ ဆိုတာပါ။ [[mark:draw-cut]] နောက်ဆုံးကတော့
      မဆံ့တဲ့ စာကြောင်းကို ဖြတ်ပြီး၊ အစက် သုံးစက်နဲ့ ဆုံးစေတာပါ။ lesson 24 က ဒီ lesson အတွက် ချန်ထားခဲ့တာပါ။
    sources:
      - title: "web.dev Learn CSS — Text and typography"
        url: "https://web.dev/learn/css/typography"
      - title: "MDN — Fundamental text and font styling"
        url: "https://developer.mozilla.org/docs/Learn_web_development/Core/Text_styling/Fundamentals"
      - title: "CSS Text Module Level 3"
        url: "https://www.w3.org/TR/css-text-3/"
    actions:
      - id: open-intro-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      # Runs in the background (boot + pnpm install + spawn); waitForReady sits
      # on the preview mark in the next scene, well over 40 s of narration later.
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 45000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-case
        type: whiteboard.apply
        at: { mark: draw-case }
        upsertIds: [a-case]
        drawMs: 1400
      - id: draw-lines
        type: whiteboard.apply
        at: { mark: draw-lines }
        upsertIds: [a-lines]
        drawMs: 1400
      - id: draw-align
        type: whiteboard.apply
        at: { mark: draw-align }
        upsertIds: [a-align]
        drawMs: 1200
      - id: draw-space
        type: whiteboard.apply
        at: { mark: draw-space }
        upsertIds: [a-space]
        drawMs: 1400
      - id: draw-wrap
        type: whiteboard.apply
        at: { mark: draw-wrap }
        upsertIds: [a-wrap]
        drawMs: 1400
      - id: draw-cut
        type: whiteboard.apply
        at: { mark: draw-cut }
        upsertIds: [a-cut]
        drawMs: 1400

  - id: open-project
    narration: >
      [[mark:close-intro]] ကဲ၊ project ကို ကြည့်ရအောင်။ [[mark:open-styles]] ဒါက CSS ဖိုင်ပါ။ အခု အလွတ်
      ဖြစ်လို့၊ စာသားတွေက browser ရဲ့ default style နဲ့ base CSS ဖိုင်အတိုင်းပဲ ရှိပါသေးတယ်။
      [[mark:preview-opens]] preview ပွင့်လာပါပြီ။ header ထဲက ဆိုင်ရဲ့ မြန်မာ နာမည် အောက်မှာ အင်္ဂလိပ်
      စာကြောင်း တစ်ကြောင်း ရှိပါတယ်။ မြို့နာမည်နဲ့ ဆိုင် စဖွင့်ခဲ့တဲ့ နှစ်ကို ပြတဲ့ tagline ပါ။
    sources:
      - title: "web.dev Learn CSS — Text and typography"
        url: "https://web.dev/learn/css/typography"
    actions:
      - id: close-intro
        type: whiteboard.apply
        at: { mark: close-intro }
        open: false
      - id: open-styles
        type: workspace.openFile
        at: { mark: open-styles }
        path: styles.css
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { mark: preview-opens }
        timeoutMs: 20000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-dev-server }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-tagline-start
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: tagline }
        textContains: "Yangon · since 1998"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-hero-start
        type: expect.preview
        at: { afterAction: expect-tagline-start }
        timeoutMs: 5000
        target: { by: testId, value: hero-title }
        textContains: "ကြိုဆိုပါတယ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: collapse-runner-dock
        type: runtime.collapseDock
        at: { afterAction: expect-hero-start }

  - id: text-case
    chapter: "စာလုံး အကြီး အသေး"
    narration: >
      [[mark:type-case]] အဲဒီ အင်္ဂလိပ် စာကြောင်းကနေ စကြည့်ရအောင်။ tagline ရော ဆိုင် နာမည်ကိုပါ၊ စာလုံး
      တိုင်းကို အကြီး ပြပေးတဲ့ text transform ပေးပါမယ်။ ရိုက်နေတုန်း header ကို လိုက်ကြည့်ပါ။
      [[mark:after-case]] tagline က စာလုံး အကြီးတွေ ဖြစ်သွားပေမယ့်၊ ဆိုင် နာမည်ကတော့ မပြောင်းပါဘူး။
      မြန်မာစာမှာ စာလုံး အကြီး အသေး ဆိုတာ မရှိလို့ပါ။ [[mark:select-transform]] ဒီ
      text transform declaration ကို ကြည့်ပါ။ သူက စာသား ပေါ်ပုံကိုပဲ ပြောင်းပြီး၊ HTML ထဲက စာလုံးတွေကတော့
      မူလအတိုင်းပါ။ HTML မှာ စာလုံး အကြီးချည်း ရေးထားရင် screen reader တချို့က စာလုံး တစ်လုံးချင်း
      ပေါင်းဖတ်တတ်လို့၊ အကြီး ပြချင်ရင် CSS နဲ့ပဲ ပြောင်းပါ။ [[mark:explain-case-values]] uppercase အပြင် lowercase လည်း ရှိပြီး၊
      capitalize ကတော့ စကားလုံး တိုင်းရဲ့ ပထမ စာလုံးကို အကြီး လုပ်ပေးပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Typography: change the case of text"
        url: "https://web.dev/learn/css/typography"
      - title: "MDN — text-transform"
        url: "https://developer.mozilla.org/docs/Web/CSS/text-transform"
      - title: "W3C — Myanmar Layout Requirements"
        url: "https://www.w3.org/TR/mlreq/"
    actions:
      - id: type-case
        type: editor.type
        at: { mark: type-case }
        cadence: fast-explainer
        target: { file: styles.css, after: "", occurrence: 1 }
        text: ".tagline,\n.shop-name {\n  text-transform: uppercase;\n}\n"
      # The DOM text is unchanged: text-transform is display only.
      - id: expect-case
        type: expect.preview
        at: { mark: after-case }
        timeoutMs: 4000
        target: { by: testId, value: tagline }
        textContains: "Yangon · since 1998"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-transform
        type: editor.select
        at: { mark: select-transform }
        target: { file: styles.css, text: "text-transform: uppercase;", occurrence: 1 }

  - id: decoration
    chapter: "စာပေါ်က မျဉ်းတွေ"
    narration: >
      [[mark:scroll-drinks]] သောက်စရာတွေဆီ ဆင်းကြည့်ရအောင်။ [[mark:type-wavy]] ဒီနေ့ အထူး လက်ဖက်ရည်ကို
      ထင်ရှားအောင် လုပ်ရအောင်။ နာမည်ကို text decoration ပေးပြီး၊ declaration တစ်ခုထဲမှာ တန်ဖိုး သုံးခု
      ရေးပါမယ်။ အောက်မျဉ်း၊ လှိုင်းတွန့် ပုံစံနဲ့ အစိမ်းရောင်ပါ။ ပထမ card ကို လိုက်ကြည့်ပါ။
      [[mark:after-wavy]] နာမည် အောက်မှာ အစိမ်းရောင် လှိုင်းတွန့် မျဉ်း ပေါ်လာပါပြီ။ shorthand တစ်ခုတည်းနဲ့
      မျဉ်း၊ ပုံစံနဲ့ အရောင်ကို တစ်ခါတည်း ပေးလိုက်တာပါ။ [[mark:open-index-old]] နောက်တစ်ခုက ကော်ဖီ card ပါ။
      [[mark:select-old]] HTML မှာ သူ့ ဈေးနှုန်း အဟောင်းက s element ထဲမှာ ရှိပါတယ်။ s element က မမှန်တော့တဲ့
      စာကို မှတ်ပေးတာပါ။ [[mark:explain-ua-strike]] browser ရဲ့ default style က အဲဒီ စာပေါ်မှာ ဖြတ်မျဉ်း
      ဆွဲထားပြီးသားပါ။ ခုနက text decoration နဲ့ပဲ ဆွဲထားတာပါ။ [[mark:open-styles-old]] CSS ဖိုင်ဆီ
      ပြန်သွားရအောင်။ [[mark:type-strike]] ဒီတစ်ခါတော့ shorthand ကို မသုံးပါဘူး။ shorthand က မရေးတဲ့
      အပိုင်းတွေကို default ပြန်ထားလို့ ဖြတ်မျဉ်း ပျောက်သွားမှာပါ။ ဒါကြောင့် အရောင်နဲ့ အထူကိုပဲ longhand နဲ့
      ပေးပါမယ်။ ငရုတ်သီး အနီရောင်နဲ့ ပိုထူတဲ့ မျဉ်းပါ။ ဈေးနှုန်း အဟောင်းကို လိုက်ကြည့်ပါ။
      [[mark:after-strike]] ဈေးနှုန်း အဟောင်းပေါ်က မျဉ်းက အနီရောင် ဖြစ်ပြီး ပိုထူလာပါပြီ။ မျဉ်းအသစ် ဆွဲတာ
      မဟုတ်ဘဲ၊ browser ရဲ့ မျဉ်းကိုပဲ အရောင်နဲ့ အထူ ပြောင်းလိုက်တာပါ။
    sources:
      - title: "web.dev Learn CSS — Typography: underlines, overlines and line-throughs"
        url: "https://web.dev/learn/css/typography"
      - title: "MDN — text-decoration"
        url: "https://developer.mozilla.org/docs/Web/CSS/text-decoration"
      - title: "MDN — The s element"
        url: "https://developer.mozilla.org/docs/Web/HTML/Element/s"
      - title: "HTML Standard — rendering: phrasing content (s, u and a defaults)"
        url: "https://html.spec.whatwg.org/multipage/rendering.html#phrasing-content-3"
    actions:
      - id: scroll-drinks
        type: preview.scroll
        at: { mark: scroll-drinks }
        timeoutMs: 5000
        top: 300
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-drinks
        type: expect.preview
        at: { afterAction: scroll-drinks }
        timeoutMs: 4000
        target: { by: testId, value: card-laphet-yay }
        textContains: "လက်ဖက်ရည်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-wavy
        type: editor.type
        at: { mark: type-wavy }
        cadence: fast-explainer
        target: { file: styles.css, after: "  text-transform: uppercase;\n}\n", occurrence: 1 }
        text: "\n.featured .name {\n  text-decoration: underline wavy seagreen;\n}\n"
      - id: open-index-old
        type: workspace.openFile
        at: { mark: open-index-old }
        path: index.html
      - id: select-old
        type: editor.select
        at: { mark: select-old }
        target:
          {
            file: index.html,
            text: '<s class="old-price" data-testid="old-price">2,000 ကျပ်</s>',
            occurrence: 1,
          }
      - id: open-styles-old
        type: workspace.openFile
        at: { mark: open-styles-old }
        path: styles.css
      - id: type-strike
        type: editor.type
        at: { mark: type-strike }
        cadence: line-by-line
        target:
          {
            file: styles.css,
            after: "  text-decoration: underline wavy seagreen;\n}\n",
            occurrence: 1,
          }
        text: "\n.old-price {\n  text-decoration-color: var(--chili);\n  text-decoration-thickness: 2px;\n}\n"
      - id: expect-strike
        type: expect.preview
        at: { mark: after-strike }
        timeoutMs: 4000
        target: { by: testId, value: old-price }
        textContains: "2,000"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: decoration-board
    narration: >
      [[mark:open-deco-board]] ဆိုတော့ text decoration က property လေးခုရဲ့ shorthand ပါ။
      [[mark:draw-deco-line]] line က မျဉ်းကို ဘယ်မှာ ဆွဲမလဲ ဆိုတာပါ။ စာရဲ့ အောက်၊ အပေါ် ဒါမှမဟုတ် စာကို
      ဖြတ်ပြီး ဆွဲနိုင်ပြီး၊ တစ်ခုထက် ပိုလည်း ပေးလို့ ရပါတယ်။ [[mark:draw-deco-style]] style မှာ
      မျဉ်းဖြောင့်၊ မျဉ်း နှစ်ထပ်၊ အစက်၊ မျဉ်းပြတ်နဲ့ လှိုင်းတွန့် ရှိပါတယ်။ [[mark:draw-deco-color]] color
      ရဲ့ default က စာလုံး အရောင်ပါ။ [[mark:draw-deco-thick]] thickness ကတော့ မျဉ်း ဘယ်လောက် ထူမလဲ ဆိုတာပါ။
      [[mark:draw-deco-prop]] သတိထားစရာ တစ်ခု ရှိပါတယ်။ text decoration က inherit မဖြစ်ပါဘူး။ ဒါပေမဲ့
      browser က parent ရဲ့ မျဉ်းကို child တွေရဲ့ စာပေါ်မှာပါ ဆက်ဆွဲပေးလို့၊ child ဘက်က none ပေးပြီး ဖျက်လို့
      မရပါဘူး။
    sources:
      - title: "MDN — text-decoration (constituent properties)"
        url: "https://developer.mozilla.org/docs/Web/CSS/text-decoration"
      - title: "MDN — text-decoration-line"
        url: "https://developer.mozilla.org/docs/Web/CSS/text-decoration-line"
      - title: "MDN — text-decoration-style"
        url: "https://developer.mozilla.org/docs/Web/CSS/text-decoration-style"
      - title: "MDN — text-decoration-color"
        url: "https://developer.mozilla.org/docs/Web/CSS/text-decoration-color"
      - title: "MDN — text-decoration-thickness"
        url: "https://developer.mozilla.org/docs/Web/CSS/text-decoration-thickness"
      - title: "CSS Text Decoration Module Level 3 — line decoration propagation"
        url: "https://www.w3.org/TR/css-text-decor-3/#line-decoration"
    actions:
      - id: open-deco-board
        type: whiteboard.apply
        at: { mark: open-deco-board }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-deco-line
        type: whiteboard.apply
        at: { mark: draw-deco-line }
        upsertIds: [b-line]
        drawMs: 1600
      - id: draw-deco-style
        type: whiteboard.apply
        at: { mark: draw-deco-style }
        upsertIds: [b-style]
        drawMs: 1600
      - id: draw-deco-color
        type: whiteboard.apply
        at: { mark: draw-deco-color }
        upsertIds: [b-color]
        drawMs: 1200
      - id: draw-deco-thick
        type: whiteboard.apply
        at: { mark: draw-deco-thick }
        upsertIds: [b-thick]
        drawMs: 1000
      - id: draw-deco-prop
        type: whiteboard.apply
        at: { mark: draw-deco-prop }
        upsertIds: [b-prop, b-prop-line]
        drawMs: 1800

  - id: underline-offset
    narration: >
      [[mark:close-deco-board]] link တွေမှာလည်း browser က အောက်မျဉ်း ပေးထားပါတယ်။ [[mark:scroll-about]]
      ဆိုင်အကြောင်း အပိုင်းဆီ ဆင်းကြည့်ရအောင်။ [[mark:point-link]] စာပိုဒ် အဆုံးမှာ link တစ်ခု ရှိပါတယ်။ သူ့
      အောက်မျဉ်းက မြန်မာ စာလုံးတွေရဲ့ အောက်က သင်္ကေတတွေနဲ့ ထိနေလို့၊ browser က အဲဒီ နေရာတွေမှာ မျဉ်းကို
      ကျော်ပြီး အပြတ်ပြတ် ဆွဲထားပါတယ်။ [[mark:type-offset]] ဒီ အပိုင်းထဲက link တွေကို text underline offset
      ပေးပါမယ်။ သူက အောက်မျဉ်းကို စာနဲ့ ပိုခွာပေးပါတယ်။ em နဲ့ ပေးထားလို့ စာလုံး ကြီးရင် အကွာအဝေးလည်း
      လိုက်ကြီးပါတယ်။ link ကို လိုက်ကြည့်ပါ။ [[mark:after-offset]] အောက်မျဉ်းက သင်္ကေတတွေ အောက်ကို
      ဆင်းသွားပြီး၊ တစ်ဆက်တည်း မျဉ်း ဖြစ်သွားပါပြီ။ [[mark:explain-position]] သူနဲ့ ဆင်တဲ့ text underline
      position ကတော့ အကွာအဝေး မပေးဘဲ နေရာကို ရွေးတာပါ။ ဥပမာ under ပေးရင်၊ browser က မျဉ်းကို စာလုံးတွေရဲ့
      အောက်ဆုံး အစွန်းရဲ့ အောက်မှာ ဆွဲပါတယ်။
    sources:
      - title: "MDN — text-underline-offset"
        url: "https://developer.mozilla.org/docs/Web/CSS/text-underline-offset"
      - title: "MDN — text-underline-position"
        url: "https://developer.mozilla.org/docs/Web/CSS/text-underline-position"
      - title: "CSS Text Decoration Module Level 4 — underline offset and position"
        url: "https://drafts.csswg.org/css-text-decor-4/#underline-offset"
    actions:
      - id: close-deco-board
        type: whiteboard.apply
        at: { mark: close-deco-board }
        open: false
      - id: scroll-about
        type: preview.scroll
        at: { mark: scroll-about }
        timeoutMs: 5000
        top: 860
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-about-link
        type: expect.preview
        at: { afterAction: scroll-about }
        timeoutMs: 4000
        target: { by: testId, value: about-link }
        attribute: { name: href, value: "#hours" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-offset
        type: editor.type
        at: { mark: type-offset }
        cadence: fast-explainer
        target: { file: styles.css, after: "  text-decoration-thickness: 2px;\n}\n", occurrence: 1 }
        text: "\n.about a {\n  text-underline-offset: 0.6em;\n}\n"

  - id: alignment
    chapter: "စာကြောင်းတွေကို ညှိကြည့်ရအောင်"
    narration: >
      [[mark:scroll-top-align]] အပေါ်ကို ပြန်တက်ရအောင်။ [[mark:type-center]] ကြိုဆိုတဲ့ အပိုင်းက အလယ်မှာ
      ဆိုရင် ပိုကြည့်ကောင်းမှာ ဖြစ်လို့၊ သူ့ကို text align နဲ့ အလယ်ညှိ ပေးပါမယ်။ [[mark:after-center]]
      ခေါင်းစဉ်၊ စာကြောင်းနဲ့ မှာယူရန် link က အလယ်ကို ရောက်သွားပါပြီ။ link က inline-block ဖြစ်လို့
      စာလုံးတွေနဲ့ အတူ လိုက်ညှိတာပါ။ နို့နှစ်ရောင် box ကိုယ်တိုင်ကတော့ မရွေ့ပါဘူး။ text align က box ထဲက
      စာကြောင်းတွေကိုပဲ ရွှေ့လို့ပါ။ [[mark:scroll-story]] အခု စာပိုဒ်ကို ကြည့်ရအောင်။ [[mark:type-justify]]
      justify ကို စမ်းကြည့်ရအောင်။ သူက space ကို ချဲ့ပြီး၊ ပြည့်နေတဲ့ စာကြောင်းတွေကို အစွန်း နှစ်ဘက်လုံး
      ထိစေပါတယ်။ [[mark:after-justify]] နေရာလွတ်တွေကို ကြည့်ပါ။ မြန်မာစာမှာ space ကို စကားစုတွေကြားမှာပဲ
      ခြားလို့၊ ချဲ့စရာ space နည်းပြီး တချို့ နေရာလွတ်တွေ အရမ်း ကျယ်သွားပါတယ်။ ဒါကြောင့် မြန်မာ
      စာပိုဒ်တွေမှာ justify ကို ရှောင်ပါ။ [[mark:type-start]] အောက်မှာ start ထပ်ရေးပါမယ်။ နောက်မှ ရေးတဲ့
      declaration က နိုင်ပါတယ်။ [[mark:after-start]] start က default ဖြစ်လို့ စာပိုဒ်က မူလအတိုင်း
      ပြန်ဖြစ်သွားပါပြီ။ lesson 21 မှာ ကြည့်ခဲ့သလို start ဆိုတာ စာကြောင်း စတဲ့ ဘက်ပါ။ မြန်မာစာနဲ့
      အင်္ဂလိပ်စာမှာ ဘယ်ဘက်၊ Arabic စာမှာတော့ ညာဘက်ပါ။ end ကတော့ ဆန့်ကျင်ဘက်ပါ။ [[mark:type-indent]]
      နောက်တစ်ခုက text indent ပါ။ ပထမ စာကြောင်းကိုပဲ အထဲကို ဝင်စေပါတယ်။ [[mark:after-indent]] ပထမ စာကြောင်းက
      အထဲ ဝင်ပြီး စသွားပါပြီ။ အနုတ် တန်ဖိုး ပေးရင်တော့ ပထမ စာကြောင်းက အပြင်ကို ထွက်နေပါမယ်။
    sources:
      - title: "web.dev Learn CSS — Typography: change text alignment"
        url: "https://web.dev/learn/css/typography"
      - title: "MDN — text-align"
        url: "https://developer.mozilla.org/docs/Web/CSS/text-align"
      - title: "MDN — text-indent"
        url: "https://developer.mozilla.org/docs/Web/CSS/text-indent"
      - title: "W3C — Myanmar Layout Requirements (justification)"
        url: "https://www.w3.org/TR/mlreq/"
    actions:
      - id: scroll-top-align
        type: preview.scroll
        at: { mark: scroll-top-align }
        timeoutMs: 5000
        top: 0
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-center
        type: editor.type
        at: { mark: type-center }
        cadence: fast-explainer
        target: { file: styles.css, after: "  text-underline-offset: 0.6em;\n}\n", occurrence: 1 }
        text: "\n.hero {\n  text-align: center;\n}\n"
      - id: expect-center
        type: expect.preview
        at: { mark: after-center }
        timeoutMs: 4000
        target: { by: testId, value: hero }
        textContains: "မှာယူရန်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: scroll-story
        type: preview.scroll
        at: { mark: scroll-story }
        timeoutMs: 5000
        top: 860
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-justify
        type: editor.type
        at: { mark: type-justify }
        cadence: fast-explainer
        target: { file: styles.css, after: "  text-align: center;\n}\n", occurrence: 1 }
        text: "\n.story {\n  text-align: justify;\n}\n"
      - id: expect-justify
        type: expect.preview
        at: { mark: after-justify }
        timeoutMs: 4000
        target: { by: testId, value: story }
        textContains: "ဗဟန်းက"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-start
        type: editor.type
        at: { mark: type-start }
        cadence: fast-explainer
        target: { file: styles.css, after: "  text-align: justify;\n", occurrence: 1 }
        text: "  text-align: start;\n"
      - id: type-indent
        type: editor.type
        at: { mark: type-indent }
        cadence: fast-explainer
        target: { file: styles.css, after: "  text-align: start;\n", occurrence: 1 }
        text: "  text-indent: 2em;\n"

  - id: white-space
    chapter: "White space"
    narration: >
      စာပိုဒ်ရဲ့ အောက်မှာ ဖွင့်ချိန်တွေ ရှိပါတယ်။ [[mark:open-index-hours]] HTML ကို ကြည့်ရအောင်။
      [[mark:select-hours]] ဒီ စာပိုဒ်ထဲမှာ ဖွင့်ချိန် နှစ်ကြောင်းကို အပေါ်အောက် ခွဲရေးထားပြီး၊ line break
      element တော့ မထည့်ထားပါဘူး။ [[mark:explain-collapse]] ဒါပေမဲ့ preview ကို ကြည့်ပါ၊ စနေနေ့က ပထမ
      စာကြောင်းရဲ့ နောက်မှာ ကပ်နေပါတယ်။ default အားဖြင့် browser က line break ကို space လို သဘောထားပြီး၊ ဆက်တိုက် ရှိတဲ့ space
      တွေကို တစ်ခုတည်း ပေါင်းလို့ပါ။ [[mark:open-ws-board]] ဒါကို white space property က ထိန်းပါတယ်။
      [[mark:draw-ws-head]] တန်ဖိုး တစ်ခုစီအတွက် မေးခွန်း သုံးခု မေးကြည့်ပါ။ space တွေကို ပေါင်းသလား၊
      စာကြောင်း ရှည်ကို wrap လုပ်သလား၊ line break ကို ထားသလား ဆိုတာပါ။ [[mark:draw-ws-normal]] default
      ဖြစ်တဲ့ normal က space ပေါင်းပြီး wrap လုပ်ပေမယ့်၊ line break ကိုတော့ မထားပါဘူး။
      [[mark:draw-ws-nowrap]] nowrap က normal လိုပဲ ဖြစ်ပေမယ့် wrap မလုပ်ပါဘူး။ [[mark:draw-ws-pre]] pre
      ကတော့ code ပြတဲ့ pre element လိုပဲ၊ space နဲ့ line break အားလုံးကို ရေးထားတဲ့အတိုင်း ထားပြီး wrap
      မလုပ်ပါဘူး။ [[mark:draw-ws-prewrap]] pre wrap ကလည်း အကုန် ထားပေမယ့်၊ wrap တော့ လုပ်ပါတယ်။
      [[mark:draw-ws-preline]] pre line ကတော့ space တွေကို ပေါင်းပေမယ့် line break ကို ထားပြီး၊ wrap လည်း
      လုပ်ပါတယ်။ [[mark:draw-ws-use]] လိပ်စာ၊ ဖွင့်ချိန် လို စာတွေမှာ pre line ကို အသုံးများပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Typography: control white-space"
        url: "https://web.dev/learn/css/typography"
      - title: "MDN — white-space"
        url: "https://developer.mozilla.org/docs/Web/CSS/white-space"
      - title: "CSS Text Module Level 3 — white space processing"
        url: "https://www.w3.org/TR/css-text-3/#white-space-property"
    actions:
      - id: open-index-hours
        type: workspace.openFile
        at: { mark: open-index-hours }
        path: index.html
      - id: select-hours
        type: editor.select
        at: { mark: select-hours }
        target:
          {
            file: index.html,
            text: "တနင်္လာ မှ သောကြာ — မနက် ၆ နာရီ မှ ည ၈ နာရီ\n          စနေ၊ တနင်္ဂနွေ — မနက် ၇ နာရီ မှ ည ၉ နာရီ",
            occurrence: 1,
          }
      - id: expect-hours
        type: expect.preview
        at: { mark: explain-collapse }
        timeoutMs: 4000
        target: { by: testId, value: hours-text }
        textContains: "စနေ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: open-ws-board
        type: whiteboard.apply
        at: { mark: open-ws-board }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-ws-head
        type: whiteboard.apply
        at: { mark: draw-ws-head }
        upsertIds: [c-h-space, c-h-wrap, c-h-break]
        drawMs: 1600
      - id: draw-ws-normal
        type: whiteboard.apply
        at: { mark: draw-ws-normal }
        upsertIds: [c-normal, c-normal-1, c-normal-2, c-normal-3]
        drawMs: 1400
      - id: draw-ws-nowrap
        type: whiteboard.apply
        at: { mark: draw-ws-nowrap }
        upsertIds: [c-nowrap, c-nowrap-1, c-nowrap-2, c-nowrap-3]
        drawMs: 1400
      - id: draw-ws-pre
        type: whiteboard.apply
        at: { mark: draw-ws-pre }
        upsertIds: [c-pre, c-pre-1, c-pre-2, c-pre-3]
        drawMs: 1400
      - id: draw-ws-prewrap
        type: whiteboard.apply
        at: { mark: draw-ws-prewrap }
        upsertIds: [c-prewrap, c-prewrap-1, c-prewrap-2, c-prewrap-3]
        drawMs: 1400
      - id: draw-ws-preline
        type: whiteboard.apply
        at: { mark: draw-ws-preline }
        upsertIds: [c-preline, c-preline-1, c-preline-2, c-preline-3]
        drawMs: 1400
      - id: draw-ws-use
        type: whiteboard.apply
        at: { mark: draw-ws-use }
        upsertIds: [c-preline-mark, c-hours]
        drawMs: 1400

  - id: white-space-code
    narration: >
      [[mark:close-ws-board]] pre ကို အရင် စမ်းကြည့်ရအောင်။ [[mark:open-styles-ws]] CSS ဖိုင်ဆီ
      ပြန်သွားပါမယ်။ [[mark:type-pre]] ဖွင့်ချိန် စာပိုဒ်မှာ white space ကို pre ပေးပါမယ်။ ဖွင့်ချိန်
      နှစ်ကြောင်းကို လိုက်ကြည့်ပါ။ [[mark:after-pre]] စနေနေ့က ဒုတိယ စာကြောင်းကို ဆင်းသွားပါပြီ။ ဒါပေမဲ့
      အဲဒီ စာကြောင်းက အထဲ ဝင်ပြီးမှ စပါတယ်။ HTML ဖိုင်ထဲမှာ code သပ်ရပ်အောင် ထည့်ထားတဲ့ ရှေ့က space တွေကို pre က
      ထားလိုက်လို့ပါ။ [[mark:type-pre-line]] ဒါကြောင့် အောက်မှာ pre line ထပ်ရေးပါမယ်။
      [[mark:after-pre-line]] အခု ရှေ့က space အပိုတွေ ပျောက်သွားပြီး၊ line break ကတော့ ကျန်နေပါတယ်။ screen
      ကျဉ်းရင် ရှည်တဲ့ စာကြောင်းက wrap လည်း ဖြစ်နိုင်ပါတယ်။
    sources:
      - title: "MDN — white-space (values)"
        url: "https://developer.mozilla.org/docs/Web/CSS/white-space#values"
      - title: "web.dev Learn CSS — Typography: control white-space"
        url: "https://web.dev/learn/css/typography"
    actions:
      - id: close-ws-board
        type: whiteboard.apply
        at: { mark: close-ws-board }
        open: false
      - id: open-styles-ws
        type: workspace.openFile
        at: { mark: open-styles-ws }
        path: styles.css
      - id: type-pre
        type: editor.type
        at: { mark: type-pre }
        cadence: fast-explainer
        target: { file: styles.css, after: "  text-indent: 2em;\n}\n", occurrence: 1 }
        text: "\n.hours-text {\n  white-space: pre;\n}\n"
      - id: type-pre-line
        type: editor.type
        at: { mark: type-pre-line }
        cadence: fast-explainer
        target: { file: styles.css, after: "  white-space: pre;\n", occurrence: 1 }
        text: "  white-space: pre-line;\n"
      - id: expect-pre-line
        type: expect.preview
        at: { mark: after-pre-line }
        timeoutMs: 4000
        target: { by: testId, value: hours-text }
        textContains: "တနင်္ဂနွေ"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: overflow-wrap
    chapter: "စာကြောင်းကို ဘယ်မှာ ခွဲမလဲ"
    narration: >
      အခု အောက်ဆုံးက footer ပါ။ ဆိုင်ရဲ့ Facebook လိပ်စာက space မပါတဲ့ စကားလုံး ရှည်ကြီး တစ်လုံး ဖြစ်လို့၊
      browser က ခွဲစရာ နေရာ မတွေ့ပါဘူး။ ဒါကြောင့် ညာဘက် အစွန်းကို ကျော်ထွက်ပြီး၊ page တစ်ခုလုံး ဘေးတိုက်
      scroll လုပ်လို့ ရနေပါတယ်။ [[mark:type-wrap]] footer မှာ overflow wrap ကို anywhere ပေးပါမယ်။ သူက
      စကားလုံး မဆံ့တော့မှပဲ၊ ဘယ်နေရာမှာ မဆို ခွဲခွင့် ပေးပါတယ်။ လိပ်စာကို လိုက်ကြည့်ပါ။ [[mark:after-wrap]]
      လိပ်စာက နှစ်ကြောင်း ခွဲသွားပြီး၊ footer ထဲမှာပဲ ဆံ့သွားပါပြီ။
    sources:
      - title: "web.dev Learn CSS — Typography: control how words break"
        url: "https://web.dev/learn/css/typography"
      - title: "MDN — overflow-wrap"
        url: "https://developer.mozilla.org/docs/Web/CSS/overflow-wrap"
    actions:
      - id: type-wrap
        type: editor.type
        at: { mark: type-wrap }
        cadence: fast-explainer
        target: { file: styles.css, after: "  white-space: pre-line;\n}\n", occurrence: 1 }
        text: "\n.site-footer {\n  overflow-wrap: anywhere;\n}\n"
      - id: expect-wrap
        type: expect.preview
        at: { mark: after-wrap }
        timeoutMs: 4000
        target: { by: testId, value: fb-page }
        textContains: "facebook.com/"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: break-board
    narration: >
      [[mark:open-break-board]] overflow wrap မှာ စကားလုံးကို ခွဲပေးတဲ့ တန်ဖိုး နှစ်ခု ရှိပါတယ်။
      [[mark:draw-break-both]] break word ရော anywhere ရော မဆံ့မယ့် စကားလုံးကို ခွဲပေးပါတယ်။ ကွာတာက flex
      item လို content ပေါ် မူတည်ပြီး အကျယ် ယူတဲ့ box မှာ ပေါ်ပါတယ်။ anywhere ဆိုရင် box က စကားလုံး ရှည်ထက်
      ကျဉ်းအောင် ကျုံ့နိုင်ပါတယ်။ break word ဆိုရင်တော့ box က အဲဒီ စကားလုံး အကျယ်ထက် မကျုံ့ပါဘူး။
      [[mark:draw-word-break]] word break က property သီးသန့်ပါ။ စာကြောင်းကို ဘယ်မှာ ခွဲခွင့် ရှိလဲ ဆိုတာကို
      ပြောင်းပါတယ်။ break all ဆိုရင် ဘယ် စာလုံး နှစ်လုံးကြားမှာမဆို ခွဲပါတယ်။ [[mark:draw-keep-all]] keep
      all ကတော့ ပြောင်းပြန်ပါ။ တရုတ်၊ ဂျပန်၊ ကိုရီးယား စာမှာ စကားလုံး အထဲကို မခွဲပါဘူး။
      [[mark:draw-burmese-break]] မြန်မာစာမှာ စကားလုံးကြား space မခြားလို့၊ browser က dictionary နဲ့
      စကားလုံး ဘယ်မှာ ဆုံးလဲ ရှာပါတယ်။ break all က အဲဒါကို မကြည့်ဘဲ syllable ကိုတောင် ခွဲနိုင်လို့၊
      မြန်မာစာမှာ word break ကို normal ပဲ ထားပါ။
    sources:
      - title: "MDN — overflow-wrap (anywhere vs break-word)"
        url: "https://developer.mozilla.org/docs/Web/CSS/overflow-wrap#values"
      - title: "MDN — word-break"
        url: "https://developer.mozilla.org/docs/Web/CSS/word-break"
      - title: "CSS Text Module Level 3 — line breaking and word boundaries"
        url: "https://www.w3.org/TR/css-text-3/#line-breaking"
      - title: "W3C — Myanmar Layout Requirements (line breaking)"
        url: "https://www.w3.org/TR/mlreq/"
    actions:
      - id: open-break-board
        type: whiteboard.apply
        at: { mark: open-break-board }
        open: true
        clear: true
        upsertIds: [d-title, d-ow]
      - id: draw-break-both
        type: whiteboard.apply
        at: { mark: draw-break-both }
        upsertIds: [d-bw, d-bw-box, d-bw-word, d-any, d-any-box, d-any-w1, d-any-w2]
        drawMs: 3200
      - id: draw-word-break
        type: whiteboard.apply
        at: { mark: draw-word-break }
        upsertIds: [d-wb]
        drawMs: 1600
      - id: draw-keep-all
        type: whiteboard.apply
        at: { mark: draw-keep-all }
        upsertIds: [d-ka]
        drawMs: 1400
      - id: draw-burmese-break
        type: whiteboard.apply
        at: { mark: draw-burmese-break }
        upsertIds: [d-my]
        drawMs: 1600

  - id: text-wrap
    narration: >
      [[mark:close-break-board]] ခေါင်းစဉ်ဆီ ပြန်တက်ရအောင်။ [[mark:look-headline]] ပထမ စာကြောင်း
      ပြည့်နေပြီး၊ ဒုတိယ စာကြောင်းမှာ စာ နည်းနည်းပဲ ကျန်နေပါတယ်။ ဒီလို ဆိုရင် ခေါင်းစဉ်က ကြည့်ရ မညီဘဲ ဖတ်ရလည်း
      ခက်ပါတယ်။ [[mark:type-balance]] ခေါင်းစဉ်မှာ text wrap ကို balance ပေးပါမယ်။ ဒါဆို browser က
      စာကြောင်းတွေ အရှည် မျှမျှ ဖြစ်အောင် ခွဲမယ့် နေရာကို ရွေးပေးပါတယ်။ ခေါင်းစဉ်ကို လိုက်ကြည့်ပါ။
      [[mark:after-balance]] စာကြောင်း နှစ်ကြောင်း အရှည် နီးပါး တူသွားပါပြီ။ balance လုပ်ဖို့ browser က
      အလုပ် ပိုလုပ်ရလို့၊ Chrome မှာ 6 ကြောင်း အထိ ရှိတဲ့ စာကိုပဲ လုပ်ပေးပါတယ်။ ဒါကြောင့်
      ခေါင်းစဉ်မှာ သုံးပါ။ [[mark:explain-pretty]] စာပိုဒ်အတွက်တော့ pretty ရှိပါတယ်။ နောက်ဆုံး စာကြောင်းမှာ
      စကားလုံး တစ်လုံးတည်း ကျန်မနေအောင် လုပ်ပေးပါတယ်။ Chrome နဲ့ Safari မှာ ရပြီး၊ Firefox မှာ မရသေးလို့
      ပုံမှန် wrap ဖြစ်ပါတယ်။ [[mark:explain-stable]] text wrap မှာ default ဖြစ်တဲ့ wrap၊ nowrap
      နဲ့ stable လည်း ရှိပါတယ်။ stable က textarea ထဲမှာ စာ ပြင်နေတုန်း၊ ပြင်နေတဲ့ စာကြောင်းရဲ့ အပေါ်က စာကြောင်းတွေကို
      မရွေ့အောင် ထားပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Typography: control how text wraps"
        url: "https://web.dev/learn/css/typography"
      - title: "MDN — text-wrap"
        url: "https://developer.mozilla.org/docs/Web/CSS/text-wrap"
      - title: "Chrome for Developers — CSS text-wrap: balance"
        url: "https://developer.chrome.com/docs/css-ui/css-text-wrap-balance"
      - title: "CSS Text Module Level 4 — text-wrap-style"
        url: "https://drafts.csswg.org/css-text-4/#text-wrap-style"
    actions:
      - id: close-break-board
        type: whiteboard.apply
        at: { mark: close-break-board }
        open: false
      - id: scroll-top-balance
        type: preview.scroll
        at: { mark: close-break-board }
        timeoutMs: 5000
        top: 0
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-balance
        type: editor.type
        at: { mark: type-balance }
        cadence: fast-explainer
        target: { file: styles.css, after: "  overflow-wrap: anywhere;\n}\n", occurrence: 1 }
        text: "\n.hero-title {\n  text-wrap: balance;\n}\n"
      - id: expect-balance
        type: expect.preview
        at: { mark: after-balance }
        timeoutMs: 4000
        target: { by: testId, value: hero-title }
        textContains: "မင်္ဂလာပါ"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: clip-board
    chapter: "မဆံ့တဲ့ စာကြောင်းကို ဖြတ်ကြည့်ရအောင်"
    narration: >
      [[mark:open-clip-board]] နောက်ဆုံး အကြောင်းအရာက မဆံ့တဲ့ စာကြောင်းပါ။ CSS မှာ ဖြတ်တဲ့ tool နှစ်ခု
      ရှိပါတယ်။ [[mark:draw-clip-box]] lesson 24 မှာ ကြည့်ခဲ့တဲ့ overflow က box ပေါ်မှာ အလုပ်လုပ်ပါတယ်။
      လျှံထွက်နေတဲ့ content ကို ပြမလား၊ ဖြတ်မလား၊ scroll လုပ်ခိုင်းမလား ဆုံးဖြတ်ပါတယ်။
      [[mark:draw-clip-text]] text overflow ကတော့ စာကြောင်း တစ်ကြောင်းပေါ်မှာ အလုပ်လုပ်ပါတယ်။ ဖြတ်ခံရတဲ့
      စာကြောင်းရဲ့ အဆုံးကို ဘယ်လို ပြမလဲ ဆုံးဖြတ်ပါတယ်။ default က ရိုးရိုး ပြတ်နေပြီး၊ ellipsis ပေးရင် အစက်
      သုံးစက် ပေါ်ပါတယ်။ [[mark:draw-recipe]] text overflow က သူ့ဘာသာ ဘာကိုမှ မဖြတ်ပါဘူး။ element
      တစ်ခုတည်းမှာ သုံးခု လိုပါတယ်။ wrap မဖြစ်တဲ့ စာကြောင်း၊ အကျယ် ကန့်သတ်ထားပြီး လျှံထွက်တာကို
      ဖျောက်ထားတဲ့ block box နဲ့ အစက်တွေ ဆွဲပေးမယ့် text overflow ပါ။ [[mark:draw-recipe-need]] တစ်ခုခု မပါရင် အစက် သုံးစက် မပေါ်ပါဘူး။
    sources:
      - title: "web.dev Learn CSS — Overflow: single line overflow with text-overflow"
        url: "https://web.dev/learn/css/overflow#single_line_overflow_with_text-overflow"
      - title: "MDN — text-overflow"
        url: "https://developer.mozilla.org/docs/Web/CSS/text-overflow"
      - title: "MDN — overflow"
        url: "https://developer.mozilla.org/docs/Web/CSS/overflow"
    actions:
      - id: open-clip-board
        type: whiteboard.apply
        at: { mark: open-clip-board }
        open: true
        clear: true
        upsertIds: [e-title]
      - id: draw-clip-box
        type: whiteboard.apply
        at: { mark: draw-clip-box }
        upsertIds: [e-box1, e-text1, e-l1]
        drawMs: 1800
      - id: draw-clip-text
        type: whiteboard.apply
        at: { mark: draw-clip-text }
        upsertIds: [e-box2, e-text2, e-l2]
        drawMs: 1800
      - id: draw-recipe
        type: whiteboard.apply
        at: { mark: draw-recipe }
        upsertIds: [e-r1, e-r2, e-r3]
        drawMs: 2400
      - id: draw-recipe-need
        type: whiteboard.apply
        at: { mark: draw-recipe-need }
        upsertIds: [e-need]
        drawMs: 1000

  - id: ellipsis
    narration: >
      [[mark:close-clip-board]] စားစရာတွေဆီ သွားရအောင်။ [[mark:look-long]] ရှမ်းခေါက်ဆွဲ အထူး card မှာ နာမည်
      ရှည်ရှည် ရှိပြီး၊ စာကြောင်း နှစ်ကြောင်း ဖြစ်နေပါတယ်။ [[mark:type-nowrap]] ပထမ အဆင့်က white space ကို
      nowrap ပေးပြီး၊ နာမည်ကို wrap မဖြစ်အောင် တားတာပါ။ နောက်ဆုံး card ကို လိုက်ကြည့်ပါ။
      [[mark:after-nowrap]] နာမည်က တစ်ကြောင်းတည်း ဖြစ်သွားပေမယ့်၊ card ကနေ လျှံထွက်ပြီး page ရဲ့ အစွန်းကိုပါ
      ကျော်သွားပါပြီ။ [[mark:type-hidden]] ဒုတိယ အဆင့်က ဒီ နာမည်မှာပဲ overflow hidden ပေးတာပါ။
      [[mark:after-hidden]] စာကြောင်းက နာမည်ရဲ့ box အစွန်းမှာ ပြတ်သွားပါပြီ။ သပ်ရပ်သွားပေမယ့်၊ နာမည်
      တစ်ပိုင်း ပျောက်နေတယ် ဆိုတာ ဖတ်တဲ့သူ မသိနိုင်ပါဘူး။ [[mark:type-ellipsis]] တတိယ အဆင့်က text overflow
      ကို ellipsis ပေးတာပါ။ ဒါက အစက်တွေကို ဆွဲပေးတဲ့ အဆင့်ပါ။ [[mark:after-ellipsis]] စာကြောင်း အဆုံးမှာ
      အစက် သုံးစက် ပေါ်လာလို့၊ နာမည်က ဒီထက် ရှည်သေးတယ် ဆိုတာ ဖတ်တဲ့သူ သိပါပြီ။ နာမည် အပြည့်က HTML ထဲမှာ
      ရှိနေဆဲ ဖြစ်လို့၊ screen reader က အကုန် ဖတ်ပါတယ်။ [[mark:select-long-rule]] ဒီ rule ကို ကြည့်ပါ။
      စာသားကိုယ်တိုင်က text node ထဲမှာ ရှိပေမယ့်၊ CSS က text node ကို ရွေးလို့ မရလို့၊ သူ့ကို ထုပ်ထားတဲ့
      နာမည်မှာ ပေးရတာပါ။ နာမည်က card ရဲ့ အကျယ်အတိုင်း ရှိတဲ့ block ဖြစ်လို့ အလုပ်လုပ်တာပါ။ span လို inline
      element မှာဆိုရင် text overflow က အလုပ် မလုပ်ပါဘူး။ [[mark:explain-clamp]] စာကြောင်း အနည်းငယ် ပြပြီးမှ ဖြတ်ချင်ရင်တော့ line clamp
      ရှိပါတယ်။ အခုလောလောဆယ် webkit prefix နဲ့ display တန်ဖိုး အထူး တစ်ခုကို တွဲရေးရပေမယ့်၊ browser အဓိက
      အားလုံးမှာ ရပါတယ်။ [[mark:explain-measure]] ပြီးတော့ စာကြောင်း ရှည်လွန်းရင် ဖတ်ရ မောလို့၊
      စာပိုဒ်တွေကို အရမ်း မကျယ်အောင် ထားပါ။ အင်္ဂလိပ်စာအတွက် သုည 65 လုံးစာ အကျယ် ဖြစ်တဲ့ 65 ch လောက်ကို max
      width အဖြစ် သုံးလေ့ ရှိပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Overflow: single line overflow with text-overflow"
        url: "https://web.dev/learn/css/overflow#single_line_overflow_with_text-overflow"
      - title: "MDN — text-overflow"
        url: "https://developer.mozilla.org/docs/Web/CSS/text-overflow"
      - title: "MDN — line-clamp"
        url: "https://developer.mozilla.org/docs/Web/CSS/line-clamp"
      - title: "MDN — Fundamental text and font styling (line length)"
        url: "https://developer.mozilla.org/docs/Learn_web_development/Core/Text_styling/Fundamentals"
    actions:
      - id: close-clip-board
        type: whiteboard.apply
        at: { mark: close-clip-board }
        open: false
      - id: scroll-snacks
        type: preview.scroll
        at: { mark: close-clip-board }
        timeoutMs: 5000
        top: 560
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-long-start
        type: expect.preview
        at: { afterAction: scroll-snacks }
        timeoutMs: 4000
        target: { by: testId, value: long-name }
        textContains: "Special Shan noodles"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-nowrap
        type: editor.type
        at: { mark: type-nowrap }
        cadence: fast-explainer
        target: { file: styles.css, after: "  text-wrap: balance;\n}\n", occurrence: 1 }
        text: "\n.long-name {\n  white-space: nowrap;\n}\n"
      - id: type-hidden
        type: editor.type
        at: { mark: type-hidden }
        cadence: fast-explainer
        target: { file: styles.css, after: "  white-space: nowrap;\n", occurrence: 1 }
        text: "  overflow: hidden;\n"
      - id: type-ellipsis
        type: editor.type
        at: { mark: type-ellipsis }
        cadence: fast-explainer
        target: { file: styles.css, after: "  overflow: hidden;\n", occurrence: 1 }
        text: "  text-overflow: ellipsis;\n"
      # The DOM keeps the whole name: the dots are drawn, not written.
      - id: expect-ellipsis
        type: expect.preview
        at: { mark: after-ellipsis }
        timeoutMs: 4000
        target: { by: testId, value: long-name }
        textContains: "with extra toppings"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-long-rule
        type: editor.select
        at: { mark: select-long-rule }
        target: { file: styles.css, text: ".long-name {", occurrence: 1 }

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:open-quiz]] မပြီးခင် မေးခွန်း တစ်ခု မေးကြည့်ရအောင်။ space ပေါင်းမယ်၊ line break ထားမယ်၊ wrap
      လည်း ဖြစ်မယ့် white space တန်ဖိုးက ဘယ်ဟာလဲ။ [[mark:quiz-answer]] အဖြေက ဖွင့်ချိန်မှာ သုံးခဲ့တဲ့ pre
      line ပါ။ pre နဲ့ pre wrap က space အပိုတွေကိုပါ ထားပြီး၊ nowrap ကတော့ line break တွေကို ဖယ်ပစ်ပါတယ်။
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ text transform က စာလုံး အကြီး အသေးကို ပေါ်ပုံမှာပဲ ပြောင်းပြီး
      မြန်မာစာကို မပြောင်းပါဘူး။ text decoration က စာပေါ်မှာ မျဉ်း ဆွဲပြီး၊ underline offset က အောက်မျဉ်းကို
      သင်္ကေတတွေနဲ့ ခွာပါတယ်။ text align က box ထဲမှာ စာကြောင်းတွေကို ညှိပါတယ်။ white space က space နဲ့ line
      break ကို ထိန်းပြီး၊ overflow wrap နဲ့ text wrap က စာကြောင်း ခွဲမယ့် နေရာကို ရွေးပါတယ်။ nowrap၊
      overflow hidden နဲ့ text overflow ပေါင်းမှ အစက် သုံးစက် ရပါတယ်။ [[mark:next-lesson]] ဒါနဲ့ course ရဲ့
      စာသား အပိုင်း ပြီးပါပြီ။ နောက် lesson မှာတော့ အလှဆင်တဲ့ အပိုင်းကို gradient နဲ့ စပြီး၊ အရောင် တစ်ခုကနေ
      တစ်ခုကို ဖြည်းဖြည်း ကူးသွားတဲ့ နောက်ခံတွေကို ကြည့်သွားပါမယ်။
    sources:
      - title: "web.dev Learn CSS — Text and typography"
        url: "https://web.dev/learn/css/typography"
      - title: "web.dev Learn CSS — Overflow"
        url: "https://web.dev/learn/css/overflow"
      - title: "web.dev Learn CSS — Gradients (next lesson)"
        url: "https://web.dev/learn/css/gradients"
    actions:
      - id: open-quiz
        type: whiteboard.apply
        at: { mark: open-quiz }
        open: true
        clear: true
        upsertIds: [f-title, f-q, f-o1, f-o2, f-o3, f-o4]
      - id: draw-quiz-answer
        type: whiteboard.apply
        at: { mark: quiz-answer }
        upsertIds: [f-a3, f-a1, f-a2, f-a4]
        drawMs: 2400
      - id: expect-final-css
        type: expect.file
        at: { mark: recap }
        path: styles.css
        contains: ".tagline,\n.shop-name {\n  text-transform: uppercase;\n}\n\n.featured .name {\n  text-decoration: underline wavy seagreen;\n}\n\n.old-price {\n  text-decoration-color: var(--chili);\n  text-decoration-thickness: 2px;\n}\n\n.about a {\n  text-underline-offset: 0.6em;\n}\n\n.hero {\n  text-align: center;\n}\n\n.story {\n  text-align: justify;\n  text-align: start;\n  text-indent: 2em;\n}\n\n.hours-text {\n  white-space: pre;\n  white-space: pre-line;\n}\n\n.site-footer {\n  overflow-wrap: anywhere;\n}\n\n.hero-title {\n  text-wrap: balance;\n}\n\n.long-name {\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n"

checks:
  - { type: timing.p95Ms, max: 300 }
