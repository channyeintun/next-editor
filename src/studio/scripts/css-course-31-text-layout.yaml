# CSS course (Burmese), lesson 31 of 43: arranging text (typography part 2).
#
# Narration is Burmese (voice-script.md next to this file is its source;
# DESIGN.md is the span-by-span brief). Every [[mark:…]] sits where its action
# begins, at a sentence end; each span carries one piece of meaning.
# Everything the learner sees (title, chapters, whiteboard labels, UI strings)
# is already Burmese.
#
# Shape: board (recall lesson 30; the six things text layout controls) →
# English tagline in capitals, Burmese shop name unchanged → wavy shorthand
# underline on today's special → the old price's browser strike recoloured
# and thickened with two longhands → board (four longhands, propagation) →
# underline offset clears the Burmese marks on the about link → hero centred
# → story justified (a don't for Burmese), start appended, first-line indent →
# board (white-space table) → hours with pre (indent spaces show), then
# pre-line → footer URL wraps with overflow-wrap: anywhere → board
# (break-word vs anywhere, word-break, Burmese dictionary breaks) → headline
# balanced (pretty, stable explained) → board (two clipping tools, the
# three-part recipe) → long noodle name: nowrap, overflow hidden, ellipsis →
# quiz + recap, hand-off to gradients (lesson 32).
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set(; no postcss config; no reload.
# Half-typed values are invalid until they land ("2" → "2em", "sea" →
# "seagreen", "var(--chi" → "var(--chili)"), so the browser drops the
# declaration for a moment and keeps the earlier state — never narrated.
#
# Measured in headless Chrome at 432 × 720 (probe/stages.ts, same anchors):
# document 1527 tall (max scroll 807). Hero title 353 + 65 px wide lines
# (lonely last word), balanced 233 + 186. Story: justify fills four lines to
# 400 px; text-indent moves the first line in 32 px. Hours: normal runs the
# two lines together; pre keeps the 10 indent spaces (second line 42 px
# further in); pre-line drops them. Footer URL: one unbreakable 442 px token
# in a 400 px box (page scrolls sideways) → anywhere: two lines, page back to
# 432 wide. Long name: 2 lines → nowrap 444 px in a 366 px box (page 477 wide)
# → hidden cut → ellipsis.
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
