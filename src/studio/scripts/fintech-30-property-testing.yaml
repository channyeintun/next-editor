# Fintech Engineering, lesson 30: property-based testing for money code (Burmese).
#
# Source: Fintech Engineering Handbook, "Testing" (intro, property-based testing, invariant checks
# between steps) (CC BY 4.0, Voytek Pitula).
# Start state: split.go holds the naive split, allocate (lesson 05's fix), sum and cents;
# wallet.go a wallet with holds (reserve / capture / release) and its invariant check; gen.go a
# generator of random wallet operations; main.go a seeded testing/quick config and one example test.
# Edits, all insert-only, in main.go:
#   1. the property "the parts add up to the whole" over generated amounts and part counts
#                                                     -> run-2: counterexample 396.99 in 4 parts
#   2. a generated sequence of wallet operations with the invariant checked after every step
#                                                     -> run-3: step 25 breaks it (capture of a released hold)
# Figures: space (examples vs generated inputs), oracle (generator → code → invariant →
# counterexample), steps (a check after every step), iv (the interview answer).
# Built by ~/Documents/fintech-course-work/tools/build-lesson.ts; fixtures by sim-go.ts --write.
