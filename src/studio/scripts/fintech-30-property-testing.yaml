build:
  voiceProfile:
    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 9530

runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "example, 100.00 in 4 parts adds up: true\n"
      run-2:
        status: success
        exitCode: 0
        output: "example, 100.00 in 4 parts adds up: true\ncounterexample: 396.99 in 4 parts sums to 396.96\nproperty, parts add up: false\n"
      run-3:
        status: success
        exitCode: 0
        output: "example, 100.00 in 4 parts adds up: true\ncounterexample: 396.99 in 4 parts sums to 396.96\nproperty, parts add up: false\nstep 25 broke the books: held 42.00, open holds 45.00 (total adds up: true)\nhold 3: reserve 3.00 → release → release → capture\n"

scenes:
  - id: hook
    chapter: Testing၊ example တွေ ဘာလို့ မလုံလောက်လဲ
    narration: >-
      ငွေ system အတွက် ledger၊ invariant၊ idempotency နဲ့ control တွေကို တည်ဆောက်ခဲ့ပြီးပြီ ဆိုတော့၊ ကျန်တဲ့ မေးခွန်းက အဲဒါတွေ တကယ် မှန်ကြောင်း ဘယ်လို သိမလဲ ဆိုတာပါ။ No trust၊ ဆိုလိုတာက ဘယ်သူ့ကိုမှ၊ ကိုယ့် component ကိုတောင် အလိုလို မယုံရဘူး ဆိုတဲ့ မူအရ ကိုယ့် code ကိုယ်တိုင်ကိုလည်း မှန်တယ်လို့ ယူဆလို့ မရပါဘူး။ [[mark:hard]] ခက်တာက ငွေ system မှာ မျှော်ထားတဲ့ output တွေကို စာရင်းလုပ်လို့ မရတာပါ။ operation sequence တွေက အရမ်းများပြီး၊ bug တွေက combination ထဲမှာ ရှိတတ်ပါတယ်။ [[mark:open-split]] ပထမ ဥပမာ အနေနဲ့ ငွေပမာဏကို အပိုင်း တူတူ ခွဲတဲ့ function တစ်ခုကို ယူကြည့်ရအောင်။ [[mark:sel-split]] ဒီ split က ပမာဏကို အပိုင်းအရေအတွက်နဲ့ စားပြီး အပိုင်းတိုင်းကို အဲဒီ ရလဒ် ပေးပါတယ်။ ကြည့်လိုက်ရင် မှန်ပုံ ရပါတယ်၊ test တွေ ဘာကို ဖမ်းနိုင်လဲ ကြည့်ဖို့ ဒီ အတိုင်း ထားထားတာပါ။ [[mark:open-main]] test ရေးရင် ပုံမှန် ရေးကြတဲ့ ပုံစံက example test ပါ။ [[mark:sel-example]] ယူရို ၁၀၀ ကို လေးပုံ ခွဲပြီး၊ အပိုင်းတွေ ပြန်ပေါင်းရင် ၁၀၀ ပြန်ရလား စစ်ပါတယ်။ [[mark:run-1]] run လိုက်ရအောင်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Testing (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#testing",
        }
      - {
          title: "Fintech Engineering Handbook — Principles (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#principles",
        }
    actions:
      - { id: open-split, type: workspace.openFile, at: { mark: open-split }, path: split.go }
      - id: sel-split
        type: editor.select
        at: { mark: sel-split }
        target: { file: split.go, text: "\t\tparts[i] = total / int64(n)", occurrence: 1 }
      - { id: open-main, type: workspace.openFile, at: { mark: open-main }, path: main.go }
      - id: sel-example
        type: editor.select
        at: { mark: sel-example }
        target: { file: main.go, text: "sum(split(10000, 4)) == 10000", occurrence: 1 }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "example, 100.00 in 4 parts adds up: true",
          timeoutMs: 8000,
        }

  - id: space
    chapter: Input space
    narration: >-
      [[mark:pt-ex]] example test က pass ပါတယ်၊ ယူရို ၁၀၀ ကို လေးပုံ ခွဲရင် ၂၅ စီ အတိအကျ ရလို့ပါ။ [[mark:show-space]] ပြဿနာက ကိုယ်တို့ ရွေးတဲ့ example တွေက ဘယ်လို ဂဏန်းတွေလဲ ဆိုတာပါ။ [[mark:pt-ex1]] လူက test ရေးရင် ၁၀၀၊ ၅၀၊ ၁၀ လို ပြည့်ပြည့် ဂဏန်းတွေကို ရွေးတတ်ပြီး၊ အဲဒါတွေက အပိုင်းအရေအတွက်နဲ့ စားလို့ ပြတ်ပါတယ်။ ဖြစ်နိုင်တဲ့ input အားလုံးထဲမှာ အစက် သုံးစက်ပဲ စစ်ထားတာပါ။ [[mark:space-2]] property-based testing မှာတော့ input တွေကို framework က generate လုပ်ပေးပါတယ်။ output တစ်ခုချင်းကို မျှော်ထားပြီး စစ်တာ မဟုတ်ဘဲ၊ ဘယ် input အတွက်မဆို မှန်ရမယ့် property တစ်ခုကို စစ်ပါတယ်။ [[mark:pt-prop]] ဒီ function အတွက် property က ရှင်းပါတယ်၊ အပိုင်းတွေကို ပြန်ပေါင်းရင် မူလ ပမာဏ ပြန်ရရမယ်။ ငွေ system မှာ ဒီလို property တွေက invariant တွေပါပဲ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Testing (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#testing",
        }
    actions:
      - id: pt-ex
        type: console.point
        at: { mark: pt-ex }
        target: { text: "example, 100.00 in 4 parts adds up: true", occurrence: 1 }
      - {
          id: show-space,
          type: slide.show,
          at: { mark: show-space, offsetMs: -700 },
          slideId: space-1,
        }
      - { id: pt-ex1, type: slide.point, at: { mark: pt-ex1 }, target: { x: 0.177, y: 0.431 } }
      - { id: space-2, type: slide.show, at: { mark: space-2 }, slideId: space-2 }
      - {
          id: pt-gen,
          type: slide.point,
          at: { afterAction: space-2 },
          target: { x: 0.68, y: 0.513 },
        }
      - { id: pt-prop, type: slide.point, at: { mark: pt-prop }, target: { x: 0.738, y: 0.776 } }

  - id: property
    chapter: Property တစ်ခု ရေးကြည့်ရအောင်
    narration: >-
      [[mark:close-space]] Go ရဲ့ standard library ထဲက testing quick နဲ့ ရေးကြည့်ရအောင်။ [[mark:type-prop]] ဒီ function က framework ပေးတဲ့ random ဂဏန်း နှစ်ခုကို ယူပါတယ်။ ပထမ ဂဏန်းကနေ ယူရို တစ်ထောင် အောက် ပမာဏ တစ်ခု၊ ဒုတိယ ဂဏန်းကနေ တစ်ကနေ ခုနစ်အထိ အပိုင်းအရေအတွက် တစ်ခု ထုတ်ပါတယ်။ ပြီးရင် split ရဲ့ အပိုင်းတွေကို ပြန်ပေါင်းပြီး မူလ ပမာဏနဲ့ မညီရင် အဲဒီ input ကို counterexample အနေနဲ့ ထုတ်ပြပါတယ်။ အောက်ဆုံး line က ဒီ property ကို case တစ်ထောင်အထိ စစ်ခိုင်းတာပါ။ example test pass ခဲ့တဲ့ function ပဲ ဆိုတော့ ဘာထွက်မလဲ ခန့်မှန်းကြည့်ပါ။ [[mark:run-2]] run လိုက်ရအောင်။ [[mark:pt-cx]] framework က ယူရို ၃၉၆ ဒသမ ကိုးကိုး ကို လေးပုံ ခွဲတဲ့ case ကို ရှာတွေ့ပါတယ်။ ပြန်ပေါင်းတော့ ဆင့် သုံးပြား ပျောက်နေပါတယ်။ [[mark:pt-false]] ဒါကြောင့် property က false ပါ။ [[mark:dock-2]] စားလို့ မပြတ်တဲ့ အကြွင်းကို split က လွှင့်ပစ်လိုက်တာပါ၊ ပြည့်ပြည့် ဂဏန်းတွေနဲ့ ရေးတဲ့ example က ဒါကို ဘယ်တော့မှ မမြင်ပါဘူး။
    sources:
      - {
          title: "Fintech Engineering Handbook — Testing (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#testing",
        }
      - { title: "Go standard library — testing/quick", url: "https://pkg.go.dev/testing/quick" }
    actions:
      - { id: close-space, type: slide.close, at: { mark: close-space } }
      - id: type-prop
        type: editor.type
        at: { mark: type-prop }
        target:
          {
            file: main.go,
            after: "\tfmt.Println(\"example, 100.00 in 4 parts adds up:\", sum(split(10000, 4)) == 10000)\n",
            occurrence: 1,
          }
        text: "\n\taddsUp := func(t uint32, k uint8) bool {\n\t\ttotal, n := int64(t%100000), int(k%7)+1\n\t\tif got := sum(split(total, n)); got != total {\n\t\t\tfmt.Println(\"counterexample:\", cents(total), \"in\", n, \"parts sums to\", cents(got))\n\t\t\treturn false\n\t\t}\n\t\treturn true\n\t}\n\tfmt.Println(\"property, parts add up:\", quick.Check(addsUp, cfg) == nil)\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "property, parts add up: false",
          timeoutMs: 8000,
        }
      - id: pt-cx
        type: console.point
        at: { mark: pt-cx }
        target: { text: "counterexample: 396.99 in 4 parts sums to 396.96", occurrence: 1 }
      - id: pt-false
        type: console.point
        at: { mark: pt-false }
        target: { text: "property, parts add up: false", occurrence: 1 }
      - { id: dock-2, type: runtime.collapseDock, at: { mark: dock-2 } }

  - id: oracle
    narration: >-
      [[mark:show-oracle]] ဖြစ်သွားတာကို ပြန်ကြည့်ရအောင်။ generator က input တစ်ခု ထုတ်ပြီး code ကို ခေါ်ပါတယ်။ [[mark:oracle-2]] ရလဒ်ကို မျှော်ထားတဲ့ တန်ဖိုး တစ်ခုနဲ့ မတိုက်ဘဲ invariant နဲ့ စစ်ပါတယ်။ ဒါကြောင့် input ဘာပဲ ဖြစ်ဖြစ် အဖြေ မှန်မမှန် ဆုံးဖြတ်ပေးနိုင်တဲ့ oracle ရှိနေတာပါ။ ကိုယ်တို့ ကြိုတွက်ထားတဲ့ တန်ဖိုးက မှားနေနိုင်ပေမဲ့၊ ပေါင်းလဒ် မပြောင်းရဘူး ဆိုတဲ့ စည်းမျဉ်းက မမှားပါဘူး။ [[mark:oracle-3]] မှန်ရင် နောက် case ကို ဆက်သွားပြီး၊ မှားရင် ရပ်ပြီး counterexample ကို ပြပါတယ်။ [[mark:pt-seed]] seed ကို ပုံသေ ထားထားလို့ run တိုင်းမှာ case တွေ အတူတူ ထွက်ပြီး၊ ဒီ counterexample ကို ဘယ်အချိန်မဆို ပြန်ရပါတယ်။ [[mark:pt-princ]] split က စားလို့ မပြတ်တိုင်း ဆင့် အနည်းငယ် ပျောက်စေပြီး၊ ဘယ်သူ့ဆီမှ မရောက်တဲ့ ငွေ ဖြစ်သွားပါတယ်။ အကြွင်းကို အပိုင်းတွေဆီ ခွဲပေးတဲ့ allocate ကတော့ split ဖိုင်ထဲမှာ ရှိပြီး၊ နောက်ဆုံးမှာ ကိုယ်တိုင် စမ်းကြည့်ရပါမယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Testing (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#testing",
        }
      - {
          title: "Fintech Engineering Handbook — Rounding strategies (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#rounding-strategies",
        }
    actions:
      - {
          id: show-oracle,
          type: slide.show,
          at: { mark: show-oracle, offsetMs: -700 },
          slideId: oracle-1,
        }
      - {
          id: pt-gen2,
          type: slide.point,
          at: { afterAction: show-oracle },
          target: { x: 0.141, y: 0.642 },
        }
      - { id: oracle-2, type: slide.show, at: { mark: oracle-2 }, slideId: oracle-2 }
      - {
          id: pt-oracle,
          type: slide.point,
          at: { afterAction: oracle-2 },
          target: { x: 0.809, y: 0.642 },
        }
      - { id: oracle-3, type: slide.show, at: { mark: oracle-3 }, slideId: oracle-3 }
      - {
