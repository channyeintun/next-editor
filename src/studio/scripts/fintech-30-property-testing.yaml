  - id: sequence
    chapter: Step တိုင်းမှာ invariant စစ်ပါ
    narration: >-
      [[mark:close-oracle]] function တစ်ခုထက် ပိုခက်တာက state ရှိတဲ့ system ပါ။ wallet ဖိုင်ထဲမှာ user တစ်ယောက်ရဲ့ ငွေကို reserve လုပ်တာ၊ capture လုပ်တာ၊ release လုပ်တာ ရှိပြီး၊ invariant က held ထဲက ငွေက ဖွင့်ထားဆဲ hold တွေရဲ့ ပေါင်းလဒ်နဲ့ အမြဲ ညီရမယ် ဆိုတာပါ။ operation တစ်ခုချင်းကို သီးသန့် example test ရေးရင် pass ပါလိမ့်မယ်။ [[mark:type-seq]] ဒီ loop က generator ကို operation ငါးရာအထိ random ထုတ်ခိုင်းပါတယ်။ deposit၊ reserve၊ ပြီးတော့ ရှိပြီးသား hold တစ်ခုခုကို capture ဒါမှမဟုတ် release လုပ်တာပါ။ အရေးကြီးတာက operation တစ်ခု ပြီးတိုင်း invariant ကို စစ်ပြီး၊ ချိုးတဲ့ step မှာ ချက်ချင်း ရပ်တာပါ။ [[mark:run-3]] run လိုက်ရအောင်။ [[mark:pt-step]] step နှစ်ဆယ့်ငါးမှာ ချိုးသွားပါတယ်။ held ထဲမှာ ရှိရမယ့် ငွေထက် ယူရို သုံး လျော့နေပါတယ်။ [[mark:pt-hold]] အောက်က line က အဲဒီ hold ရဲ့ သမိုင်းပါ။ reserve လုပ်၊ release လုပ်၊ ထပ် release လုပ်ပြီးမှ capture လုပ်ထားပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Testing (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#testing",
        }
      - {
          title: "Fintech Engineering Handbook — Funds reservation (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#funds-reservation",
        }
    actions:
      - { id: close-oracle, type: slide.close, at: { mark: close-oracle } }
      - id: type-seq
        type: editor.type
        at: { mark: type-seq }
        target:
          {
            file: main.go,
            after: "\tfmt.Println(\"property, parts add up:\", quick.Check(addsUp, cfg) == nil)\n",
            occurrence: 1,
          }
        text: "\n\tw, r := &Wallet{}, rand.New(rand.NewSource(7))\n\tfor step := 1; step <= 500; step++ {\n\t\top := randomStep(r, w)\n\t\tif err := w.check(); err != nil {\n\t\t\tfmt.Println(\"step\", step, \"broke the books:\", err)\n\t\t\tfmt.Println(op)\n\t\t\tbreak\n\t\t}\n\t}\n"
        cadence: line-by-line
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "step 25 broke the books",
          timeoutMs: 8000,
        }
      - id: pt-step
        type: console.point
        at: { mark: pt-step }
        target: { text: "step 25 broke the books", occurrence: 1 }
      - id: pt-hold
        type: console.point
        at: { mark: pt-hold }
        target: { text: "hold 3: reserve 3.00", occurrence: 1 }
      - {
          id: expect-file-check,
          type: expect.file,
          at: { afterAction: run-3 },
          path: main.go,
          contains: "if err := w.check(); err != nil {",
        }

  - id: steps
    narration: >-
      [[mark:show-steps]] step တွေကို တစ်ခုချင်း ကြည့်ရအောင်။ reserve လုပ်တုန်းက check မှန်ပါတယ်၊ release လုပ်တုန်းကလည်း မှန်ပါတယ်။ ဒုတိယ release ကလည်း ဘာမှ မပြောင်းလို့ မှန်ပါတယ်။ [[mark:steps-2]] ဒါပေမဲ့ release လုပ်ပြီးသား hold ကို capture လုပ်တဲ့ အခါ wallet က လက်ခံလိုက်ပါတယ်။ user က ယူရို သုံး ပြန်ရပြီးသား၊ merchant ကလည်း အဲဒီ ယူရို သုံးကို ရသွားတော့ ငွေ နှစ်ခါ သုံးမိသွားတာပါ။ No invented data၊ ဆိုလိုတာက ငွေကို မရှိဘဲ မဖန်တီးရဘူး ဆိုတဲ့ မူကို တိုက်ရိုက် ချိုးတာပါ။ [[mark:pt-total]] စိတ်ဝင်စားစရာက စုစုပေါင်းက ကိုက်နေသေးတာပါ။ held က ရှိရမယ့်ထက် ယူရို သုံး လျော့သွားတာက ပိုထွက်သွားတဲ့ ငွေကို ဖုံးထားလို့ပါ။ ဒါကြောင့် စုစုပေါင်း ကိုက်သလား ဆိုတဲ့ invariant တစ်ခုတည်းနဲ့ မလုံလောက်ပါဘူး။ [[mark:steps-3]] step တိုင်းမှာ စစ်ရတဲ့ အကြောင်းလည်း ဒါပါ။ အဆုံးမှာပဲ စစ်ရင် step ငါးရာထဲက တစ်နေရာမှာ မှားနေတယ် လို့ပဲ သိပြီး၊ နောက်ပိုင်း step တွေက error ကို ဖုံးသွားနိုင်ပါသေးတယ်။ step တိုင်းမှာ စစ်တော့ ဘယ် step၊ ဘယ် operation ဆိုတာ တန်းသိပါတယ်။ scale ကြီးရင် ဒါကို လက်နဲ့ ရေးလို့ မရပါဘူး၊ harness က check ကို step တိုင်းကြား ထည့်ပေးရပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Testing (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#testing",
        }
      - {
          title: "Fintech Engineering Handbook — Invariants (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#invariants",
        }
    actions:
      - {
          id: show-steps,
          type: slide.show,
          at: { mark: show-steps, offsetMs: -700 },
          slideId: steps-1,
        }
      - {
          id: pt-o1,
          type: slide.point,
          at: { afterAction: show-steps },
          target: { x: 0.131, y: 0.509 },
        }
      - { id: steps-2, type: slide.show, at: { mark: steps-2 }, slideId: steps-2 }
      - {
          id: pt-o4,
          type: slide.point,
          at: { afterAction: steps-2 },
          target: { x: 0.856, y: 0.42 },
        }
      - { id: pt-total, type: slide.point, at: { mark: pt-total }, target: { x: 0.808, y: 0.619 } }
      - { id: steps-3, type: slide.show, at: { mark: steps-3 }, slideId: steps-3 }
      - {
          id: pt-each,
          type: slide.point,
          at: { afterAction: steps-3 },
          target: { x: 0.55, y: 0.758 },
        }

  - id: senior
    chapter: ဘယ်နေရာမှာ ခက်လာလဲ
    narration: >-
      [[mark:close-steps]] bug ကိုယ်တိုင်ကို ကြည့်ရအောင်။ [[mark:open-wallet]] wallet ဖိုင်ထဲက capture မှာ ရှိပါတယ်။ [[mark:sel-bug]] capture မလုပ်ခင် hold က ဖွင့်ထားဆဲလား မစစ်ဘဲ၊ capture မလုပ်ရသေးဘူးလား ဆိုတာပဲ စစ်ထားပါတယ်။ code ကို ဖတ်ရုံနဲ့ လွတ်သွားနိုင်ပြီး၊ operation သုံးခု အစီအစဉ်တကျ ပေါင်းမှ ပေါ်လာတဲ့ bug ပါ။ ဒီ နည်းကို တကယ် သုံးတဲ့ အခါ ခက်တဲ့ အချက် သုံးချက် ရှိပါတယ်။ [[mark:open-main2]] ပထမက generator ကိုယ်တိုင်က ယူဆချက်တွေ ဖြစ်တာပါ။ [[mark:sel-gen]] ဒီ line က အပိုင်းအရေအတွက်ကို သုည ဘယ်တော့မှ မထုတ်ပါဘူး၊ ပမာဏကိုလည်း ယူရို တစ်ထောင်အောက်ပဲ ထုတ်ပါတယ်။ generator မထုတ်တဲ့ input ကို test က ဘယ်တော့မှ မမေးလို့၊ သုည အပိုင်းလို case ကို သီးသန့် test ရေးရပါတယ်။ ဒုတိယက counterexample က အသေးဆုံး မဟုတ်တာပါ။ ဒီ framework က ပထမဆုံး fail တဲ့ random input ကို ပြတာ ဖြစ်လို့၊ အဲဒါကို အသေးဆုံး ဖြစ်အောင် ကိုယ်တိုင် လျှော့ပြီး example test အဖြစ် သိမ်းထားရပါတယ်။ [[mark:sel-seed]] တတိယက seed ပါ။ ဒီမှာ ပုံသေ ထားထားပေမဲ့ CI မှာတော့ run တိုင်း seed အသစ်နဲ့ run လေ့ရှိပြီး၊ fail ရင် ပြန် replay လုပ်နိုင်အောင် seed ကို log ထဲ ထုတ်ထားရပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Testing (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#testing",
        }
      - { title: "Go standard library — testing/quick", url: "https://pkg.go.dev/testing/quick" }
    actions:
      - { id: close-steps, type: slide.close, at: { mark: close-steps } }
      - { id: open-wallet, type: workspace.openFile, at: { mark: open-wallet }, path: wallet.go }
      - id: sel-bug
        type: editor.select
        at: { mark: sel-bug }
        target: { file: wallet.go, text: 'if h.State != "captured" {', occurrence: 1 }
      - { id: open-main2, type: workspace.openFile, at: { mark: open-main2 }, path: main.go }
      - id: sel-gen
        type: editor.select
        at: { mark: sel-gen }
        target: { file: main.go, text: "total, n := int64(t%100000), int(k%7)+1", occurrence: 1 }
      - id: sel-seed
        type: editor.select
        at: { mark: sel-seed }
        target: { file: main.go, text: "rand.NewSource(7)", occurrence: 1 }

  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] Fintech interview တွေမှာ ငွေတွက်တဲ့ code ကို ဘယ်လို test လုပ်မလဲ လို့ မေးလေ့ရှိပါတယ်။ unit test တွေ ရေးပါမယ် လို့ပဲ ဖြေရင် မလုံလောက်ပါဘူး၊ အချက် သုံးချက်နဲ့ ဖြေပါ။ [[mark:iv-a]] ပထမ၊ example test တွေက လူ ရွေးတဲ့ input ကိုပဲ စစ်ပြီး၊ လူက ပြည့်ပြည့် ဂဏန်းတွေကို ရွေးတတ်ပါတယ်။ bug တွေက edge နဲ့ combination တွေမှာ ရှိတတ်ပါတယ်။ [[mark:iv-b]] ဒုတိယ၊ property test နဲ့ input ဘာပဲ ဖြစ်ဖြစ် invariant မှန်ရမယ်လို့ စစ်ပါတယ်။ အပိုင်းတွေ ပြန်ပေါင်းရင် မူလ ပမာဏ ရတာ၊ books balance ဖြစ်တာ စတာတွေက oracle ပါ။ [[mark:iv-c]] တတိယ၊ state ရှိတဲ့ system အတွက် operation sequence ကို generate လုပ်ပြီး step တိုင်းမှာ invariant ကို စစ်ပါတယ်။ seed ကို log ထုတ်ထားလို့ fail ရင် replay လုပ်နိုင်ပြီး၊ counterexample ကို example test အဖြစ် သိမ်းပါတယ်။ [[mark:iv-d]] ပြီးရင် ကိုယ် ဘာလုပ်မလဲ ဆိုတာ ဆက်ပြောပါ။ အရေးကြီးတဲ့ money math နဲ့ state machine တွေမှာ property test ထားပြီး CI မှာ seed အသစ်နဲ့ run မယ်၊ example test ကို ဥပမာ အဖြစ်ပဲ ထားပြီး စည်းမျဉ်းကို property နဲ့ စစ်မယ် ဆိုတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Testing (Voytek Pitula, CC BY 4.0)",
