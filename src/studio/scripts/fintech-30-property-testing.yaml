      - {
          id: pt-iv-d,
          type: slide.point,
          at: { afterAction: iv-d },
          target: { x: 0.138, y: 0.799 },
        }

  - id: try-it
    narration: >-
      [[mark:close-iv]] ကိုယ်တိုင် စမ်းကြည့်ဖို့ တစ်ခု ရှိပါတယ်။ [[mark:sel-try]] property ထဲက split ကို allocate လို့ ပြောင်းပြီး run ကြည့်ပါ။ allocate က အကြွင်း ဆင့်တွေကို ရှေ့ဆုံး အပိုင်းတွေဆီ တစ်ပြားစီ ခွဲပေးလို့ property က case တစ်ထောင်လုံးမှာ true ဖြစ်ပါလိမ့်မယ်။ sequence အပိုင်းက seed သီးသန့် သုံးထားလို့ step နှစ်ဆယ့်ငါး ဆိုတဲ့ အဖြေကတော့ မပြောင်းပါဘူး။ [[mark:recap]] ပြန်ချုပ်ရရင်၊ ငွေ code ရဲ့ output တွေကို စာရင်းလုပ်လို့ မရတဲ့ အခါ invariant ကို oracle အဖြစ် သုံးပြီး၊ generate လုပ်ထားတဲ့ input တွေနဲ့ operation sequence တွေပေါ်မှာ step တိုင်း စစ်ရပါတယ်။ နောက် lesson မှာ ဒီ နည်းကိုပဲ idempotency၊ crash ဖြစ်ပြီး ပြန်ဆက်တာ၊ round-trip နဲ့ production test လို တခြား test နည်းတွေမှာ ဘယ်လို သုံးလဲ ကြည့်ပါမယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Testing (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#testing",
        }
    actions:
      - { id: close-iv, type: slide.close, at: { mark: close-iv } }
      - id: sel-try
        type: editor.select
        at: { mark: sel-try }
        target: { file: main.go, text: "sum(split(total, n))", occurrence: 1 }

checks:
  - { type: timing.p95Ms, max: 300 }
