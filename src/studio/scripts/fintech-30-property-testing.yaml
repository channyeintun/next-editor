      gen.go: |
        package main

        import (
        	"fmt"
        	"math/rand"
        	"strings"
        )

        // randomStep generates one operation, applies it to the wallet and names it.
        func randomStep(r *rand.Rand, w *Wallet) string {
        	amount := int64(r.Intn(50)+1) * 100
        	op := r.Intn(4)
        	switch {
        	case op == 0:
        		w.Deposit(amount)
        		return "deposit " + cents(amount)
        	case op == 1 || len(w.Holds) == 0:
        		w.Reserve(amount)
        		return "reserve " + cents(amount)
        	}
        	i := r.Intn(len(w.Holds))
        	if op == 2 {
        		w.Capture(w.Holds[i])
        	} else {
        		w.Release(w.Holds[i])
        	}
        	return fmt.Sprintf("hold %d: %s", i+1, strings.Join(w.Holds[i].Log, " → "))
        }
      main.go: |
        package main

        import (
        	"fmt"
        	"math/rand"
        	"testing/quick"
        )

        // cfg: up to 1000 generated cases from a fixed seed, so every run sees the same inputs.
        var cfg = &quick.Config{MaxCount: 1000, Rand: rand.New(rand.NewSource(7))}

        func main() {
        	fmt.Println("example, 100.00 in 4 parts adds up:", sum(split(10000, 4)) == 10000)
        }
      split.go: |
        package main

        import "fmt"

        // split divides an amount in cents into n equal parts: the version that looks right.
        func split(total int64, n int) []int64 {
        	parts := make([]int64, n)
        	for i := range parts {
        		parts[i] = total / int64(n)
        	}
        	return parts
        }

        // allocate gives the cents left over by the division to the first parts, one each.
        func allocate(total int64, n int) []int64 {
        	parts := split(total, n)
        	for i := 0; i < int(total%int64(n)); i++ {
        		parts[i]++
        	}
        	return parts
        }

        func sum(parts []int64) (s int64) {
        	for _, p := range parts {
        		s += p
        	}
        	return s
        }

        // cents prints minor units as an amount with two decimals: cents(1234) is "12.34".
        func cents(n int64) string {
        	sign := ""
        	if n < 0 {
        		sign, n = "-", -n
        	}
        	return fmt.Sprintf("%s%d.%02d", sign, n/100, n%100)
        }
      wallet.go: |
        package main

        import "fmt"

        // Hold reserves part of a user's funds until it is captured (paid out) or released.
        type Hold struct {
        	Amount int64
        	State  string // open, captured, released
        	Log    []string
        }

        // Wallet is one user's money: available, held by open holds, and paid to merchants.
        type Wallet struct {
        	Deposited, Available, Held, Paid int64
        	Holds                            []*Hold
        }

        func (w *Wallet) Deposit(a int64) { w.Deposited, w.Available = w.Deposited+a, w.Available+a }

        func (w *Wallet) Reserve(a int64) {
        	if a <= w.Available {
        		w.Available, w.Held = w.Available-a, w.Held+a
        		w.Holds = append(w.Holds, &Hold{a, "open", []string{"reserve " + cents(a)}})
        	}
        }

        func (w *Wallet) Capture(h *Hold) {
        	if h.State != "captured" {
        		w.Held, w.Paid, h.State = w.Held-h.Amount, w.Paid+h.Amount, "captured"
        	}
        	h.Log = append(h.Log, "capture")
        }

        func (w *Wallet) Release(h *Hold) {
        	if h.State == "open" {
        		w.Held, w.Available, h.State = w.Held-h.Amount, w.Available+h.Amount, "released"
        	}
        	h.Log = append(h.Log, "release")
        }

        // check is the invariant: what is held equals the sum of the open holds.
        func (w *Wallet) check() error {
        	var open int64
        	for _, h := range w.Holds {
        		if h.State == "open" {
        			open += h.Amount
        		}
        	}
        	if w.Held != open {
        		total := w.Available+w.Held+w.Paid == w.Deposited
        		return fmt.Errorf("held %s, open holds %s (total adds up: %v)", cents(w.Held), cents(open), total)
        	}
        	return nil
        }
