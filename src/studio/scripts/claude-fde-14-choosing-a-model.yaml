      - id: type-3
        type: editor.type
        at: { mark: type-3 }
        cadence: line-by-line
        target: { file: notebook/14-model-choice.md, after: "output အဟောင်းနဲ့ တိုက် |\n" }
        text: "| ticket ခွဲခြား | မြန်နှုန်း၊ ဈေး | Haiku | agent ခွဲထားပြီးသား ticket နဲ့ တိုက် |\n"
      - id: sel-header
