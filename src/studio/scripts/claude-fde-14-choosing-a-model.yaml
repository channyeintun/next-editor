build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 9314

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: three-jobs
    chapter: အလုပ် သုံးမျိုး
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ ထပ်ခါထပ်ခါ လုပ်တဲ့ အလုပ်အတွက် project၊ skill၊ connector လို capability feature
      တွေကို အလုပ်ကနေ စပြီး ရွေးခဲ့ပါတယ်။ prompt မရေးခင် ဆုံးဖြတ်ချက် လေးခုထဲက တတိယ တစ်ခုကတော့ ဘယ် model
      ကို သုံးမလဲ ဆိုတာပါ။ model ဆိုတာ ပေးလိုက်တဲ့ စာကို ဆက်ရေးပေးတဲ့ program ပါ။
      [[mark:job-reply]] ဒုတိယ ပတ်ရဲ့ နောက်ဆုံးမှာ ဒီ မေးခွန်းနဲ့ ပတ်သက်တဲ့ အလုပ် သုံးခု ရှိနေပါတယ်။ ပထမ တစ်ခုက
      Reply assistant ပါ။ တစ်ရက် ticket ၁၈၀၀ လောက်အတွက် အဖြေ မူကြမ်း ရေးရမှာဖြစ်ပြီး၊ customer ဖတ်မယ့်
      စာမို့ မှန်ကန်မှုနဲ့ လေသံ အရေးကြီးပါတယ်။
      [[mark:job-report]] ဒုတိယ တစ်ခုက Billing ထဲက report job ၁၄၀ ကို library အသစ်ပေါ် ရွှေ့ဖို့ပါ။ ကိုးနှစ်
      သက်တမ်းရှိ code ကို နားလည်ပြီး နက်နက်နဲနဲ စဉ်းစားရမယ့် အလုပ်ပါ။ လက်နဲ့ လုပ်ရင် developer ငါးယောက် ရှစ်ပတ်
      ကြာမယ်လို့ ခန့်မှန်းထားပါတယ်။
      [[mark:job-route]] တတိယ တစ်ခုက ticket ခွဲခြားတာပါ။ ဝင်လာတဲ့ message တိုင်းကို connection၊ billing၊
      တပ်ဆင်မှု ဒါမှမဟုတ် အခြား ဆိုတဲ့ အုပ်စု လေးခုထဲက ဘယ်ဟာလဲ ဆုံးဖြတ်ပေးရမှာမို့ တစ်ရက် အကြိမ် ထောင်ချီ
      ဖြစ်ပါတယ်။ ဆုံးဖြတ်ချက် တစ်ခုချင်းကတော့ သေးသေးလေးပါ။
      [[mark:sel-title]] model တစ်မျိုးတည်းကို အလုပ် သုံးခုလုံးမှာ သုံးရင် ရှင်းပါတယ်။ ဒါပေမဲ့ တစ်ခုမှာ ငွေ မလိုအပ်ဘဲ
      ကုန်နေမလား၊ နောက်တစ်ခုမှာ အရည်အသွေး မလောက်ဖြစ်နေမလား ဆိုတာ စဉ်းစားရပါမယ်။ ဒီ lesson မှာ အဲဒီ
      ဆုံးဖြတ်ချက်ကို worksheet တစ်ခုနဲ့ ချရေးပါမယ်။
    sources:
      - {
          title: "Choosing a model",
          url: "https://platform.claude.com/docs/en/about-claude/models/choosing-a-model",
        }
    actions:
      - {
          id: open-sheet,
          type: workspace.openFile,
          at: { scene: start },
          path: notebook/14-model-choice.md,
        }
      - id: sel-title
        type: editor.select
        at: { mark: sel-title }
        target:
          file: notebook/14-model-choice.md
          text: "# Model ရွေးချယ်မှု worksheet"

  - id: families
    chapter: Model family လေးမျိုး
    narration: >
      [[mark:m-open]] Anthropic ရဲ့ model တွေကို family လိုက် ခွဲထားပါတယ်။ version နံပါတ်တွေက မကြာခဏ
      ပြောင်းတာမို့ ဒီမှာ family နာမည်နဲ့ပဲ ပြောပါမယ်။ မြန်ပြီး သက်သာတဲ့ဘက်ကနေ အစွမ်းအထက်ဆုံးဘက်အထိ
      စီကြည့်ရအောင်။
      [[mark:m-small]] အမြန်ဆုံးနဲ့ ဈေးအသက်သာဆုံးက Haiku ပါ။ အကြိမ်ရေ များပြီး ချက်ချင်း အဖြေ လိုတဲ့ အလုပ်တွေအတွက်
      ရည်ရွယ်ပါတယ်။ Sonnet ကတော့ မြန်နှုန်းနဲ့ စွမ်းရည်ကို အကောင်းဆုံး ပေါင်းထားတဲ့ family ပါ။ နေ့စဉ် coding နဲ့
      agent အလုပ်တွေကို မြန်မြန် လုပ်ချင်တဲ့အခါ သင့်တော်ပါတယ်။ agent ဆိုတာ ရည်မှန်းချက် ရောက်တဲ့အထိ tool တွေကို
      ကိုယ်တိုင် ရွေးသုံးပြီး အဆင့်ဆင့် လုပ်သွားတဲ့ model ပါ။
      [[mark:m-big]] Opus ကတော့ ကြာရှည် run ရတဲ့ agent coding နဲ့ ရှုပ်ထွေးတဲ့ လုပ်ငန်း အလုပ်တွေအတွက်ပါ။ Opus
      အထက်မှာ Fable ဆိုတဲ့ အဆင့် တစ်ဆင့် ထပ်ရှိပါသေးတယ်။ customer အားလုံး သုံးနိုင်တဲ့ model တွေထဲမှာ
      အစွမ်းအထက်ဆုံးဖြစ်ပြီး၊ နာရီချီ ကြာတဲ့ agent session နဲ့ နက်နက်နဲနဲ ရှာဖွေရတဲ့ အလုပ်တွေအတွက်ပါ။
      အစွမ်းအထက်ဆုံးဘက်ကို ရွေ့လေ အဖြေ ပိုကောင်းနိုင်ပေမဲ့၊ ပိုနှေးပြီး ဈေးလည်း ပိုကြီးလေပါပဲ။
      [[mark:m-plan]] Claude app ထဲမှာတော့ family တိုင်းကို plan တိုင်းမှာ မရပါဘူး။ ဒီ lesson ကို ရေးတဲ့ အချိန်မှာ
      Haiku နဲ့ Sonnet က plan တိုင်းမှာ ရပြီး၊ Opus က Pro နဲ့ အထက်မှာ ရပါတယ်။ Fable ကို Max၊ Ultra နဲ့ Team ရဲ့
      premium seat မှာ plan ထဲ ထည့်ပေးထားပေမဲ့၊ Pro နဲ့ Team standard seat မှာတော့ usage credit နဲ့ သီးခြား
      ပေးမှ သုံးလို့ရပါတယ်။
      [[mark:m-reply]] အခု နေခြည် ရဲ့ အလုပ် နှစ်ခုကို ဒီပေါ်မှာ နေရာချကြည့်ပါမယ်။ Reply assistant ရဲ့ အဖြေက
      customer ဆီ ရောက်မှာမို့ Opus ကနေ စမ်းပါမယ်။ ticket အဟောင်းတွေနဲ့ စမ်းကြည့်လို့ Sonnet မှာလည်း
      အရည်အသွေး မကျဘူးဆိုရင် Sonnet ကို ဆင်းသုံးပါမယ်။ တစ်ရက် ၁၈၀၀ ခေါ်ရတာမို့ တစ်ဆင့် ဆင်းနိုင်တာက လစဉ်
      ကုန်ကျစရိတ်ကို သိသိသာသာ ပြောင်းစေပါတယ်။
      [[mark:m-report]] report job ရွှေ့တဲ့ အလုပ်ကတော့ ခက်ခဲတဲ့ coding အလုပ်မို့ Opus ကနေ စပါမယ်။ Opus နဲ့
      သေသေချာချာ စမ်းပြီးတာတောင် မလောက်ဘူးဆိုမှ Fable ကို စဉ်းစားပါမယ်။
      [[mark:m-measure]] ဒီလို နေရာချတာက စမ်းဖို့ စမှတ်ပဲ ဖြစ်ပါတယ်။ ဘယ် family က လောက်လဲ ဆိုတာကို ကိုယ့် ticket
      တွေ၊ ကိုယ့် code တွေနဲ့ တိုင်းကြည့်ပြီးမှ ဆုံးဖြတ်ရပါမယ်။
    sources:
      - {
          title: "Models overview",
          url: "https://platform.claude.com/docs/en/about-claude/models/overview",
        }
      - { title: "Claude plans and pricing", url: "https://claude.com/pricing" }
      - {
          title: "Claude Fable models on your plan",
          url: "https://support.claude.com/en/articles/15424964-claude-fable-models-on-your-plan",
        }
    actions:
      - {
          id: draw-m-open,
          type: whiteboard.apply,
          at: { mark: m-open },
          open: true,
          clear: true,
          upsertIds: [m-title, m-scale, m-left, m-right],
          drawMs: 1600,
        }
      - {
          id: draw-m-small,
          type: whiteboard.apply,
          at: { mark: m-small },
          upsertIds: [m-haiku, m-sonnet],
          drawMs: 900,
        }
      - {
          id: draw-m-big,
          type: whiteboard.apply,
          at: { mark: m-big },
          upsertIds: [m-opus, m-fable],
          drawMs: 900,
        }
      - {
          id: point-fable,
          type: whiteboard.point,
          at: { mark: m-plan },
          target: { assetId: m-fable },
        }
      - {
          id: draw-m-reply,
          type: whiteboard.apply,
          at: { mark: m-reply },
          upsertIds: [m-job1, m-down],
          drawMs: 1200,
        }
      - {
          id: draw-m-report,
          type: whiteboard.apply,
          at: { mark: m-report },
          upsertIds: [m-job2, m-up],
          drawMs: 1200,
        }
      - {
          id: draw-m-rule,
          type: whiteboard.apply,
          at: { mark: m-measure },
          upsertIds: [m-rule],
          drawMs: 900,
        }

  - id: criteria
    chapter: ရွေးတဲ့ စံ လေးခု
    narration: >
      [[mark:v-open]] Anthropic ရဲ့ model ရွေးချယ်ပုံ လမ်းညွှန်မှာ စဉ်းစားရမယ့် စံ လေးခုကို ပြောထားပါတယ်။
      [[mark:v-cap]] ပထမက capability ပါ။ အလုပ်ကို လိုချင်တဲ့ အရည်အသွေးအထိ လုပ်နိုင်လား ဆိုတာပါ။ ဒါကို
      စာရွက်ပေါ်က ဖော်ပြချက်ကနေ မသိနိုင်ပါဘူး။ ကိုယ့် prompt၊ ကိုယ့် data နဲ့ model အမျိုးမျိုးကို စမ်းကြည့်မှ
      သိရပါတယ်။
      [[mark:v-speed]] ဒုတိယက speed ပါ။ customer က chat ထဲမှာ စောင့်နေရင် စက္ကန့် အနည်းငယ်တောင် အရေးကြီးပါတယ်။
      support agent က ticket ကို ဖွင့်တဲ့အချိန် မူကြမ်း အသင့် ရှိနေရုံဆိုရင်တော့ နည်းနည်း နှေးတာ လက်ခံနိုင်ပါတယ်။
      [[mark:v-cost]] တတိယက cost ပါ။ API က token နဲ့ တွက်ပါတယ်။ token ဆိုတာ model က စာကို ဖြတ်ယူတဲ့
      အပိုင်းအစလေးပါ။ ဒီ lesson ကို ရေးတဲ့ အချိန်မှာ Haiku နဲ့ Fable ကြား token ဈေးက အဆ ဆယ်ချီ ကွာပါတယ်။
      ဈေး တစ်ခုတည်းကို မကြည့်ဘဲ၊ တစ်ရက် ဘယ်နှခါ ခေါ်မလဲ ဆိုတာနဲ့ မြှောက်ကြည့်မှ တကယ့် ကုန်ကျစရိတ် ပေါ်လာပါတယ်။
      [[mark:v-effort]] စတုတ္ထက effort ပါ။ effort ဆိုတာ model ကို ဘယ်လောက် နက်နက် တွေးခိုင်းမလဲ ချိန်တဲ့ setting
      ပါ။ Low ကနေ Max အထိ အဆင့်တွေ ရှိပြီး model တစ်ခုချင်းမှာ ကိုယ်ပိုင် default ရှိပါတယ်။ Anthropic ရဲ့ လမ်းညွှန်က
      effort ကို ချိန်တာက model ပြောင်းတာထက် ပိုထိရောက်လေ့ ရှိတယ်လို့ ဆိုပါတယ်။ ဒါကြောင့် အဖြေ မလောက်တိုင်း
      model အကြီးကို မပြောင်းခင် effort ကို အရင် ချိန်ကြည့်ပါ။
      [[mark:v-start]] ဘယ်ကနေ စမလဲ ဆိုတာအတွက် လမ်းညွှန်က workload အများစုကို Opus ကနေ စဖို့ ပြောပါတယ်။
      Opus နဲ့ prompt ကို ကောင်းအောင် လုပ်ပြီးမှ effort ကို လျှော့တာ၊ family ငယ်ကို ဆင်းတာ လုပ်ပါ။ effort
      အမြင့်ဆုံး အဆင့်တွေမှာတောင် မလောက်သေးမှ Fable ကို တက်ပါ။
    sources:
      - {
          title: "Choosing a model",
          url: "https://platform.claude.com/docs/en/about-claude/models/choosing-a-model",
        }
      - {
          title: "Change the model, effort and thinking settings",
          url: "https://support.claude.com/en/articles/8664678-change-the-model-effort-and-thinking-settings",
        }
    actions:
      - {
          id: close-scale,
          type: whiteboard.apply,
          at: { mark: v-open, offsetMs: -1400 },
          open: false,
        }
      - {
          id: show-criteria,
          type: slide.show,
          at: { afterAction: close-scale },
          slideId: four-criteria,
        }
      - { id: point-cap, type: slide.point, at: { mark: v-cap }, target: { x: 0.15, y: 0.39 } }
      - { id: point-speed, type: slide.point, at: { mark: v-speed }, target: { x: 0.15, y: 0.53 } }
      - { id: point-cost, type: slide.point, at: { mark: v-cost }, target: { x: 0.15, y: 0.67 } }
      - {
          id: point-effort,
          type: slide.point,
          at: { mark: v-effort },
          target: { x: 0.15, y: 0.81 },
        }
      - { id: close-criteria, type: slide.close, at: { mark: v-start } }
      - {
          id: reopen-scale,
          type: whiteboard.apply,
          at: { afterAction: close-criteria },
          open: true,
          upsertIds: [m-opus],
        }
      - {
          id: point-opus,
          type: whiteboard.point,
          at: { afterAction: reopen-scale },
          target: { assetId: m-opus },
        }

  - id: worksheet
    chapter: Model worksheet
    narration: >
      [[mark:w-close]] ဒီ ဆုံးဖြတ်ချက်တွေကို worksheet နဲ့ ချရေးကြည့်ရအောင်။ model table မှာ version နဲ့ ဈေးနှုန်းတွေ
      ပါပါတယ်။ ဒီ ဂဏန်းတွေက ပြောင်းတတ်တာမို့ ဘယ်လက ကူးခဲ့လဲ ဆိုတာကို ခေါင်းစဉ်မှာ ရေးထားပြီး၊ အသစ်ကို
      Anthropic ရဲ့ Models overview စာမျက်နှာမှာ ပြန်ကြည့်ရပါတယ်။
      [[mark:sel-id]] API ID ကိုလည်း သတိထားကြည့်ပါ။ ID တစ်ခုက model version တစ်ခုကို ပုံသေ ချိတ်ထားတာပါ။
      Anthropic က ရှိပြီးသား ID ရဲ့ model ကို မပြောင်းဘဲ၊ update တွေကို ID အသစ်နဲ့ ထုတ်ပါတယ်။ ဒါကြောင့် program
      ထဲက ID ကို ကိုယ်တိုင် ပြောင်းမှ model ပြောင်းပါတယ်။ ဒါပေမဲ့ serving ဘက်က ပြောင်းလဲမှုတွေကြောင့်
      အပြုအမူ နည်းနည်း ကွာနိုင်တာမို့ တိုင်းတာမှုကို ပုံမှန် ပြန်လုပ်ရပါတယ်။
      [[mark:type-1]] ပထမ row က Reply assistant ပါ။ အရေးကြီးဆုံးက မှန်ကန်မှုနဲ့ လေသံဖြစ်လို့ Opus ကနေ စပြီး
      Sonnet ကို ဆင်းနိုင်လား စမ်းပါမယ်။ စစ်ပုံကတော့ ticket အဟောင်း ၂၀၀ အတွက် မူကြမ်း ရေးခိုင်းပြီး support
      agent တွေက အမှတ်ပေးတာပါ။
      [[mark:type-2]] ဒုတိယ row က report job ရွှေ့တာပါ။ ခက်တဲ့ reasoning လိုတာမို့ Opus ပါ။ စစ်ပုံကတော့ job
      အသစ်ရဲ့ output ကို job အဟောင်းရဲ့ output နဲ့ တိုက်ကြည့်တာပါ။ ဒီလို အဖြေမှန် ရှိပြီးသား အလုပ်မှာ family
      တိုင်းကို စံ တစ်ခုတည်းနဲ့ နှိုင်းယှဉ်နိုင်ပါတယ်။
    sources:
      - {
          title: "Models overview",
          url: "https://platform.claude.com/docs/en/about-claude/models/overview",
        }
      - {
          title: "Model IDs and versions",
          url: "https://platform.claude.com/docs/en/about-claude/models/model-ids-and-versions",
        }
      - { title: "Pricing", url: "https://platform.claude.com/docs/en/about-claude/pricing" }
    actions:
      - { id: close-scale-2, type: whiteboard.apply, at: { mark: w-close }, open: false }
      - {
          id: open-sheet-2,
          type: workspace.openFile,
          at: { afterAction: close-scale-2 },
          path: notebook/14-model-choice.md,
        }
      - id: sel-models
        type: editor.select
        at: { mark: w-close, offsetMs: 2500 }
        target:
          file: notebook/14-model-choice.md
          text: "## Model များ · 2026-11 (Models overview မှာ ပြန်စစ်ရန်)"
      - id: sel-id
        type: editor.select
        at: { mark: sel-id }
        target:
          file: notebook/14-model-choice.md
          text: "claude-opus-5-5"
      - id: type-1
        type: editor.type
        at: { mark: type-1 }
        cadence: line-by-line
        target: { file: notebook/14-model-choice.md, after: "| ဘယ်လို စစ်မလဲ |\n|---|---|---|---|\n" }
        text: "| Reply assistant | မှန်ကန်မှု၊ လေသံ | Opus → Sonnet | ticket အဟောင်း 200၊ agent က အမှတ်ပေး |\n"
      - id: type-2
        type: editor.type
        at: { mark: type-2 }
        cadence: line-by-line
        target: { file: notebook/14-model-choice.md, after: "agent က အမှတ်ပေး |\n" }
        text: "| report job ရွှေ့ | ခက်တဲ့ reasoning | Opus (မလောက်ရင် Fable) | output အဟောင်းနဲ့ တိုက် |\n"
      - id: expect-row-1
        type: expect.file
        at: { afterAction: type-2 }
        path: notebook/14-model-choice.md
        contains: "| Reply assistant | မှန်ကန်မှု၊ လေသံ | Opus → Sonnet | ticket အဟောင်း 200၊ agent က အမှတ်ပေး |\n"

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ worksheet မှာ ticket ခွဲခြားတဲ့ အလုပ် ကျန်ပါသေးတယ်။ message
      တိုင်းအတွက် အုပ်စု လေးခုထဲက တစ်ခု ရွေးပေးရုံပါပဲ။ ဒါပေမဲ့ တစ်ရက် အကြိမ် ထောင်ချီ ခေါ်ရပါမယ်။ ဘယ် family
      ကနေ အရင် စမ်းပြီး၊ မဆုံးဖြတ်ခင် ဘာကို စစ်မလဲ။
      [[mark:q-a]] ပထမ အဖြေက workload အများစုလိုပဲ Opus ကနေ စပြီး၊ အစွမ်းအထက်ဆုံးမို့ စိတ်ချရတယ်လို့
      ယူဆတာပါ။
      [[mark:q-b]] ဒုတိယ အဖြေက Haiku ကနေ စပြီး၊ support agent တွေ ခွဲထားပြီးသား ticket အဟောင်းတွေနဲ့ အဖြေချင်း
      တိုက်ကြည့်တာပါ။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ တစ်ခုပါ။ ဘာကြောင့်လဲဆိုတော့ Anthropic ရဲ့ လမ်းညွှန်မှာ စမှတ်
      နှစ်မျိုး ရှိလို့ပါ။ Opus ကနေ စတာက capability ကို ဦးစားပေးတဲ့ လမ်းပါ။ အကြိမ်ရေ များပြီး ရိုးရှင်းတဲ့ အလုပ်၊
      မြန်ဖို့နဲ့ ဈေးသက်သာဖို့ အရေးကြီးတဲ့ အလုပ်အတွက်တော့ Haiku ကနေ စပြီး၊ စွမ်းရည် မလောက်တာ တွေ့မှ အထက်ကို
      တက်ဖို့ ပြောထားပါတယ်။ အုပ်စု လေးခုထဲက တစ်ခု ရွေးတာက အဲဒီလို အလုပ်မျိုးပါ။ စစ်ဖို့ကတော့ အဖြေမှန်ကို
      လူက ရွေးထားပြီးသား ticket အဟောင်းတွေက အကောင်းဆုံးပါ။
      [[mark:q-rule]] ဒါကြောင့် model ကို နာမည်ကြီးလို့ မရွေးပါနဲ့။ အလုပ်ရဲ့ အကြိမ်ရေနဲ့ ခက်ခဲမှုကို ကြည့်ပြီး
      စမှတ် ရွေးပါ။ ကိုယ့် ဥပမာနဲ့ တိုင်းပြီးမှ ဆုံးဖြတ်ပါ။
    sources:
      - {
          title: "Choosing a model",
          url: "https://platform.claude.com/docs/en/about-claude/models/choosing-a-model",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: q-rule },
          upsertIds: [q-t1, q-t2],
          drawMs: 1200,
        }

  - id: your-turn
    chapter: ကိုယ့် အလုပ်အတွက်
    narration: >
      [[mark:r-close]] quiz ရဲ့ အဖြေကို worksheet ရဲ့ တတိယ row အဖြစ် ထည့်ထားပါမယ်။
      [[mark:type-3]] ticket ခွဲခြားတာမှာ အရေးကြီးဆုံးက မြန်နှုန်းနဲ့ ဈေးပါ။ Haiku ကနေ စပြီး support agent တွေ
      ခွဲထားပြီးသား ticket တွေနဲ့ တိုက်စစ်ပါမယ်။
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ကိုယ့် project ထဲက AI နဲ့ လုပ်ချင်တဲ့ အလုပ်
      တစ်ခုအတွက် ဒီ worksheet မှာ row တစ်ခု ဖြည့်ကြည့်ပါ။ အရေးအကြီးဆုံးက မှန်ကန်မှုလား၊ မြန်နှုန်းလား၊
      အကြိမ်ရေလား ဆိုတာကို အရင် ရေးပါ။ ပြီးမှ စမ်းမယ့် family နဲ့၊ အဖြေမှန် သိပြီးသား ဥပမာ ဘယ်နှခုနဲ့ စစ်မလဲ
      ဆိုတာကို ဖြည့်ပါ။
    sources:
      - {
          title: "Choosing a model",
          url: "https://platform.claude.com/docs/en/about-claude/models/choosing-a-model",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: r-close }, open: false }
      - {
          id: open-sheet-3,
          type: workspace.openFile,
          at: { afterAction: close-quiz },
          path: notebook/14-model-choice.md,
