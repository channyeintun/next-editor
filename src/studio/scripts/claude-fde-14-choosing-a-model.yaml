  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ model တစ်မျိုးတည်းက အလုပ်တိုင်းအတွက် မသင့်ပါဘူး။ အလုပ်ရဲ့ အရည်အသွေး လိုအပ်ချက်၊
      မြန်နှုန်းနဲ့ အကြိမ်ရေကို ကြည့်ပြီး Haiku၊ Sonnet၊ Opus၊ Fable ထဲက စမှတ်ကို ရွေးရပါတယ်။
      [[mark:recap-2]] model မပြောင်းခင် effort ကို ချိန်ကြည့်ပါ။ ကိုယ့် ဥပမာနဲ့ တိုင်းပြီး အရည်အသွေး မကျတဲ့ နေရာအထိ
      ဆင်းပါ။ နာမည်၊ version နဲ့ ဈေးနှုန်းကိုတော့ Models overview စာမျက်နှာကနေ အမြဲ ပြန်ဖတ်ပါ။
      [[mark:next]] နောက် lesson မှာတော့ နောက်ဆုံး ဆုံးဖြတ်ချက်ဖြစ်တဲ့ context နဲ့ memory ကို လေ့လာသွားပါမယ်။
      တနင်္လာနေ့တိုင်း support lead တွေက Claude ကို နောက်ခံ အကြောင်းတွေ အစကနေ ပြန်ရှင်းပြနေရတာကနေ စပါမယ်။
    sources:
