  - id: iframe
    narration: >
      [[mark:close-e]] ဘာကြောင့် unavailable ဖြစ်နေလဲ ဆိုတာ code နဲ့ စစ်ကြည့်ရအောင်။ [[mark:type-allowed]]
      page ရဲ့ permissions policy က ဒီ API တွေကို သုံးခွင့် ပေးထားလား မေးတဲ့ စစ်ချက် တစ်ကြောင်း ထည့်ပါမယ်။
      permissions policy ဆိုတာ iframe ထဲက page ကို ဘယ် feature သုံးခွင့် ပေးမလဲ သတ်မှတ်တာပါ။
      [[mark:read-allowed]] allowed column မှာ API လေးခုလုံး ကြက်ခြေခတ် ဖြစ်နေပါတယ်။ ဒီ page ကို ဘယ် API
      မှ သုံးခွင့် မပေးထားဘူးလို့ ပြနေတာပါ။ [[mark:open-builtin]] ဒီ စစ်ချက်က summarizer လို feature
      နာမည်နဲ့ browser ကို မေးတာပါ။ [[mark:draw-iframe]] အကြောင်းရင်းက ဒီလိုပါ။ [[mark:draw-top]] built
      in AI ကို default အနေနဲ့ top level page နဲ့ origin တူတဲ့ iframe ထဲမှာပဲ သုံးလို့ ရပါတယ်။
      [[mark:draw-cross]] origin မတူတဲ့ iframe ကတော့ သူ့ကို ထည့်ထားတဲ့ page က iframe ရဲ့ allow attribute
      မှာ summarizer လို feature နာမည်ကို ထည့်ပေးမှ သုံးလို့ ရပါတယ်။ [[mark:draw-ours]] ဒီ lesson ရဲ့
      preview က origin မတူတဲ့ iframe ဖြစ်ပြီး allow attribute မပါလို့၊ ဘယ်စက်မှာ ကြည့်ကြည့် ဒီထဲမှာ built
      in AI ကို သုံးလို့ မရပါဘူး။ built in AI သုံးတဲ့ page ကို iframe နဲ့ ထည့်ပြမယ်ဆိုရင်လည်း allow
      attribute ထည့်ဖို့ သတိရပါ။
    sources:
      - {
          title: "web.dev Learn AI: The client-side AI stack (built-in AI limitations: browser-specific availability)",
          url: "https://web.dev/learn/ai/client-side",
        }
      - {
          title: "Chrome for Developers: Summarizer API (permissions policy, iframes)",
          url: "https://developer.chrome.com/docs/ai/summarizer-api",
        }
      - {
          title: "MDN: Permissions-Policy language-model",
          url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Permissions-Policy/language-model",
        }
      - {
          title: "MDN: Document.featurePolicy",
          url: "https://developer.mozilla.org/en-US/docs/Web/API/Document/featurePolicy",
        }
    actions:
      - { id: close-e, type: whiteboard.apply, at: { mark: close-e }, open: false }
      - id: type-allowed
        type: editor.type
        at: { mark: type-allowed }
        target:
          {
            file: src/main.js,
            after: "for (const row of rows) row.availability = await availability(row.api);\n",
            occurrence: 1,
          }
        text: "for (const row of rows) row.allowed = allowed(row.api);\n"
        cadence: line-by-line
      - id: expect-allowed-1
        type: expect.preview
        at: { afterAction: type-allowed }
        timeoutMs: 8000
        target: { by: testId, value: ai-apis-1 }
        textContains: "Summarizer✓unavailable✗"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-allowed-2
        type: expect.preview
        at: { afterAction: expect-allowed-1 }
        timeoutMs: 5000
        target: { by: testId, value: ai-apis-2 }
        textContains: "LanguageDetector✓unavailable✗"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-allowed-3
        type: expect.preview
        at: { afterAction: expect-allowed-2 }
        timeoutMs: 5000
        target: { by: testId, value: ai-apis-3 }
        textContains: "Translator✓unavailable✗"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-allowed-4
        type: expect.preview
        at: { afterAction: expect-allowed-3 }
        timeoutMs: 5000
        target: { by: testId, value: ai-apis-4 }
        textContains: "LanguageModel✓unavailable✗"
        retry: { maxAttempts: 2, delayMs: 300 }
      - {
          id: open-builtin,
          type: workspace.openFile,
          at: { mark: open-builtin },
          path: src/builtin.js,
        }
      - id: sel-policy
        type: editor.select
        at: { afterAction: open-builtin }
        target:
          {
            file: src/builtin.js,
            text: "document.featurePolicy?.allowsFeature(FEATURE[api])",
            occurrence: 1,
          }
      - {
          id: draw-iframe,
          type: whiteboard.apply,
          at: { mark: draw-iframe },
          open: true,
          clear: true,
          upsertIds: [f-title],
        }
      - {
          id: draw-top,
          type: whiteboard.apply,
          at: { mark: draw-top },
          upsertIds: [f-top, f-same],
          drawMs: 1600,
        }
      - {
          id: draw-cross,
          type: whiteboard.apply,
          at: { mark: draw-cross },
          upsertIds: [f-cross, f-allow],
          drawMs: 1800,
        }
      - {
          id: draw-ours,
          type: whiteboard.apply,
          at: { mark: draw-ours },
          upsertIds: [f-ours],
          drawMs: 1300,
        }

  - id: fallback
    chapter: "Fallback ထည့်ရအောင်"
    narration: >
      [[mark:close-f]] ဒါဆို built in AI မရတဲ့အခါ page က ဘာပြမလဲ စီစဉ်ရပါမယ်။ [[mark:type-summary]] model
      available ဖြစ်မှ Summarizer ကို create လုပ်ပြီး English review တွေကို အနှစ်ချုပ်ခိုင်းမယ့် code ကို
      ထည့်ပါမယ်။ ကျန်တဲ့ အခြေအနေတွေမှာ၊ ဒါမှမဟုတ် error တစ်ခုခု တက်ရင်တော့ အနှစ်ချုပ် မပါဘဲ ဆက်သွားပါမယ်။ [[mark:read-fallback]]
      panel မှာ card အသစ် တစ်ခု ပေါ်လာပြီး၊ အနှစ်ချုပ် မရနိုင်လို့ review တွေကို ဒီအတိုင်း ပြထားတယ်လို့
      ပြနေပါတယ်။ badge ကလည်း AI မပါဘူးလို့ ပြနေပါတယ်။ [[mark:sel-create]] create နဲ့ summarize ကို ခေါ်တဲ့
      ဒီ အပိုင်းက desktop Chrome ပေါ်က top level page မှာပဲ run နိုင်ပါတယ်။ ဒီ preview ထဲမှာတော့ ဘယ်တော့မှ
      မ run ပါဘူး။ [[mark:read-graceful]] ဒါပေမဲ့ page က error မတက်ဘဲ review တွေကို ဆက်ပြနေလို့
      customer အတွက် အလုပ်လုပ်နေတုန်းပါ။ create မှာ error တက်ရင်တောင် code က အဲဒီ error ကို
      ဖမ်းထားလို့ page က ဒီအတိုင်းပဲ ဆက်ပြမှာပါ။ ဒါကို graceful fallback လို့ ခေါ်ပါတယ်။ AI ရရင် ပိုကောင်းပြီး၊
      မရလည်း feature မပျက်တာပါ။
    sources:
      - {
          title: "Chrome for Developers: Summarizer API (create, summarize)",
          url: "https://developer.chrome.com/docs/ai/summarizer-api",
        }
      - {
          title: "web.dev Learn AI: The client-side AI stack (built-in AI limitations: fallbacks)",
          url: "https://web.dev/learn/ai/client-side",
        }
    actions:
      - { id: close-f, type: whiteboard.apply, at: { mark: close-f }, open: false }
      - {
          id: open-main-again,
          type: workspace.openFile,
          at: { mark: close-f, offsetMs: 650 },
          path: src/main.js,
        }
      - id: type-summary
        type: editor.type
        at: { mark: type-summary }
        target:
          { file: src/main.js, after: "// The summary at the top of the page:\n", occurrence: 1 }
        text: "let summary = null;\ntry {\n  if (\"Summarizer\" in self && (await Summarizer.availability()) === \"available\") {\n    const summarizer = await Summarizer.create({ type: \"key-points\", length: \"short\" });\n    summary = await summarizer.summarize(english);\n  }\n} catch {\n  summary = null; // the model went away or the call failed: show the page without a summary\n}\nshowSummary(summary);\n"
        cadence: block
      - id: expect-three-cards
        type: expect.preview
        at: { afterAction: type-summary }
        timeoutMs: 8000
        target: { by: testId, value: ai-cards }
        attribute: { name: data-count, value: "3" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-fallback-kind
        type: expect.preview
        at: { afterAction: expect-three-cards }
        timeoutMs: 5000
        target: { by: testId, value: ai-summary }
        attribute: { name: data-kind, value: "note" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-fallback-text
        type: expect.preview
        at: { afterAction: expect-fallback-kind }
        timeoutMs: 5000
        target: { by: testId, value: ai-summary }
        textContains: "review တွေကို ဒီအတိုင်း ပြထားပါတယ်"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-fallback-badge
        type: expect.preview
        at: { afterAction: expect-fallback-text }
        timeoutMs: 5000
        target: { by: testId, value: ai-summary-badge }
        textContains: "rules · AI မပါ"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: sel-create
        type: editor.select
        at: { mark: sel-create }
        target:
          {
            file: src/main.js,
            text: "    const summarizer = await Summarizer.create({ type: \"key-points\", length: \"short\" });\n    summary = await summarizer.summarize(english);",
            occurrence: 1,
          }
      - id: expect-reviews-still
        type: expect.preview
        at: { mark: read-graceful }
        timeoutMs: 5000
        target: { by: testId, value: ai-reviews }
        attribute: { name: data-count, value: "7" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-done-fallback
        type: expect.preview
        at: { afterAction: expect-reviews-still }
        timeoutMs: 5000
        target: { by: testId, value: ai-status }
        attribute: { name: data-state, value: "done" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: limits
    chapter: "Built-in AI ရဲ့ ကန့်သတ်ချက်"
    narration: >
      [[mark:draw-limits]] preview ရဲ့ ပြဿနာ အပြင်၊ built in AI ကိုယ်တိုင်မှာလည်း ကန့်သတ်ချက်တွေ
      ရှိပါတယ်။ [[mark:draw-l1]] model က သေးလို့ အဆင့်များတဲ့ reasoning၊ စာ အရှည်ကြီး၊ စိတ်ကြိုက်
      စကားပြောတာ လို အလုပ်တွေအတွက် မသင့်တော်ပါဘူး။ [[mark:draw-l2]] ပထမဆုံး သုံးတဲ့အခါ model ကို user
      ရဲ့ စက်ထဲ အရင် ယူရလို့ user ရဲ့ အချိန်၊ data နဲ့ disk နေရာ ကုန်ပါတယ်။ [[mark:draw-l3]] desktop ပေါ်က
      Chrome မှာပဲ ရပြီး Android နဲ့ iOS ဖုန်းတွေမှာ မရသေးပါဘူး။ Gemini Nano သုံးတဲ့ API တွေအတွက်ဆိုရင်
      ကွန်ပျူတာမှာ disk နေရာ အနည်းဆုံး gigabyte ၂၂ လွတ်နေရပြီး၊ RAM ၁၆ gigabyte ဒါမှမဟုတ် memory ၄
      gigabyte ကျော်တဲ့ GPU လိုပါတယ်။
      [[mark:draw-l4]] browser က model ကို ဘယ်အချိန်မဆို ဖယ်ပစ်နိုင်လို့ model မရှိတဲ့ အချိန်အတွက်လည်း
      ပြင်ထားရပါမယ်။ [[mark:draw-l5]] RAG၊ agent လို ကိုယ်ပိုင် workflow တွေအတွက်ဆိုရင် library ဒါမှမဟုတ်
      server လိုပါတယ်။ [[mark:draw-l6]] JSON schema နဲ့ ကိုက်တဲ့ အဖြေကိုတော့ Prompt API က အခု
      ထုတ်ပေးနိုင်ပါပြီ။ ဒါပေမဲ့ model ကတော့ သေးတုန်းပါပဲ။ [[mark:draw-l7]] ကိုယ်တို့ ဆိုင်အတွက်
      အကြီးဆုံး ကန့်သတ်ချက်ကတော့ မြန်မာစာပါ။
    sources:
      - {
          title: "web.dev Learn AI: The client-side AI stack (built-in AI limitations)",
          url: "https://web.dev/learn/ai/client-side",
        }
      - {
          title: "Chrome for Developers: Get started with built-in AI (hardware requirements)",
          url: "https://developer.chrome.com/docs/ai/get-started",
        }
      - {
          title: "Chrome for Developers: Prompt API (responseConstraint)",
          url: "https://developer.chrome.com/docs/ai/prompt-api",
        }
    actions:
      - {
          id: draw-limits,
          type: whiteboard.apply,
          at: { mark: draw-limits },
          open: true,
          clear: true,
          upsertIds: [g-title],
        }
      - {
          id: draw-l1,
          type: whiteboard.apply,
          at: { mark: draw-l1 },
          upsertIds: [g-1],
          drawMs: 1000,
        }
      - {
          id: draw-l2,
          type: whiteboard.apply,
          at: { mark: draw-l2 },
          upsertIds: [g-2],
          drawMs: 1200,
        }
      - {
          id: draw-l3,
          type: whiteboard.apply,
          at: { mark: draw-l3 },
          upsertIds: [g-3, g-4],
          drawMs: 1600,
        }
      - {
          id: draw-l4,
          type: whiteboard.apply,
          at: { mark: draw-l4 },
          upsertIds: [g-5],
          drawMs: 1000,
        }
      - {
          id: draw-l5,
          type: whiteboard.apply,
          at: { mark: draw-l5 },
          upsertIds: [g-6],
          drawMs: 1100,
        }
      - {
