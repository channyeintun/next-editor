  - id: quiz
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ ကိုယ်တိုင် ရွေးပြီး website နဲ့ တွဲပို့တဲ့ client side model နဲ့
      ယှဉ်ရင်၊ built in AI ရဲ့ အဓိက အားသာချက်က ဘာလဲ။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ model ကို ကိုယ်တိုင် မပို့၊ မ host ဘဲ product ရဲ့ အပြုအမူကို အမြန်
      စမ်းနိုင်တာပါ။ ဘာကြောင့်လဲဆိုတော့ model ကို browser က ပေးထားပြီး ထိန်းသိမ်းပေးတာမို့၊ ကိုယ်က API ကို
      ခေါ်ရုံနဲ့ user အတွေ့အကြုံကိုပဲ အာရုံစိုက်နိုင်လို့ပါ။ browser တိုင်းမှာ တူတူ ရတယ် ဆိုတဲ့ အဖြေကတော့
      မှားပါတယ်။ ဒီ lesson မှာ တွေ့ခဲ့တဲ့အတိုင်း browser နဲ့ device ပေါ် မူတည်လို့ပါ။
    sources:
      - {
          title: "web.dev Learn AI: The client-side AI stack (check your understanding)",
          url: "https://web.dev/learn/ai/client-side",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          clear: true,
          upsertIds: [z-title, z-q1, z-q2, z-q3],
          drawMs: 1800,
        }
      - {
          id: draw-quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [z-a, z-wrong],
          drawMs: 1600,
        }

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ built in AI ကို API ခေါ်ရုံနဲ့ သုံးနိုင်ပေမယ့်၊ [[mark:sel-checks]]
      feature detection၊ availability နဲ့ permissions policy ကို အရင် စစ်ရပါတယ်။ ဒီ preview ထဲမှာ API တွေ
      ရှိပေမယ့် သုံးခွင့် မရလို့ unavailable ဖြစ်နေတာကို တွေ့ခဲ့ပါတယ်။ [[mark:sel-fallback]] ဒါကြောင့် AI
      မရတဲ့အခါ page က ဆက်အလုပ်လုပ်အောင် fallback ကို အမြဲ ထည့်ပါ။ desktop Chrome မှာပဲ ရတာ၊ ဖုန်းမှာ
      မရသေးတာ၊ မြန်မာစာ မရသေးတာတွေကလည်း platform ရွေးတဲ့အခါ ထည့်စဉ်းစားရမယ့် ကန့်သတ်ချက်တွေပါ။ နောက်
      lesson မှာတော့ model ကို ကိုယ်တိုင် ရွေးပြီး browser ထဲမှာ run ပေးတဲ့ client side library တွေနဲ့
      runtime တွေကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: The client-side AI stack (your takeaways)",
          url: "https://web.dev/learn/ai/client-side",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: recap }, open: false }
      - id: sel-checks
        type: editor.select
        at: { mark: sel-checks }
        target:
          {
            file: src/main.js,
            text: "for (const row of rows) row.exists = row.api in self;\nfor (const row of rows) row.availability = await availability(row.api);\nfor (const row of rows) row.allowed = allowed(row.api);",
            occurrence: 1,
          }
      - id: sel-fallback
        type: editor.select
        at: { mark: sel-fallback }
        target: { file: src/main.js, text: "showSummary(summary);", occurrence: 1 }
      - id: expect-file-exists
        type: expect.file
        at: { afterAction: sel-fallback }
        path: src/main.js
        contains: "for (const row of rows) row.exists = row.api in self;"
      - id: expect-file-allowed
        type: expect.file
        at: { afterAction: expect-file-exists }
        path: src/main.js
        contains: "for (const row of rows) row.allowed = allowed(row.api);"
      - id: expect-file-summary
        type: expect.file
        at: { afterAction: expect-file-allowed }
        path: src/main.js
        contains: 'if ("Summarizer" in self && (await Summarizer.availability()) === "available") {'
checks:
  - { type: timing.p95Ms, max: 300 }
