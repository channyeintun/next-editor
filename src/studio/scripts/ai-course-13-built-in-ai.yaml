build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 5113
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "Browser ထဲက built-in AI"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ customer assistant ကို hybrid AI အဖြစ် ဆောက်ပြီး၊ device က
      local model ကို run မနိုင်ရင် server ကို လွှဲပေးတဲ့ compatibility fallback ကိုလည်း ထည့်ခဲ့ပါတယ်။
      ဒီ lesson ကစပြီး client side ဘက်ကို နီးနီးကပ်ကပ် ကြည့်ပါမယ်၊ ပထမဆုံးကတော့ built in AI ပါ။
      [[mark:draw-mini]] blueprint မှာဆိုရင် ဒီနေ့ ကြည့်မှာက Solution ထဲက
      intelligence အလွှာပါ။ [[mark:draw-today]] model ကို ကိုယ်တိုင် မပို့ဘဲ browser ပေးထားတဲ့ model ကို
      သုံးရင် ဘာတွေ ရပြီး ဘာတွေ သတိထားရလဲ ဆိုတာ ကြည့်မှာမို့လို့ပါ။
    sources:
      - {
          title: "web.dev Learn AI: The client-side AI stack",
          url: "https://web.dev/learn/ai/client-side",
        }
      - {
          title: "web.dev Learn AI: Introduction to AI on the web (the blueprint)",
          url: "https://web.dev/learn/ai/introduction",
        }
      - {
          title: "web.dev Learn AI: Welcome to Learn AI! (course credit: written by Dr. Janna Lipenkova with editorial guidance from Alexandra Klepper; text CC BY 4.0, code Apache 2.0; adapted into Burmese with the course's own tea-shop examples)",
          url: "https://web.dev/learn/ai/welcome",
        }
      - {
          title: "Creative Commons: Attribution 4.0 International (CC BY 4.0), the licence of the web.dev Learn AI text adapted here",
          url: "https://creativecommons.org/licenses/by/4.0/",
        }
    actions:
      - {
          id: open-board-a,
          type: whiteboard.apply,
          at: { scene: start, offsetMs: -450 },
          open: true,
          clear: true,
          upsertIds: [a-title],
        }
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - {
          id: draw-mini,
          type: whiteboard.apply,
          at: { mark: draw-mini },
          upsertIds:
            [
              a-opp,
              a-opp-t,
              a-arrow-1,
              a-data,
              a-data-t,
              a-intel,
              a-intel-t,
              a-ux,
              a-ux-t,
              a-arrow-2,
              a-gov,
              a-gov-t,
            ],
          drawMs: 2400,
        }
      - {
          id: draw-today,
          type: whiteboard.apply,
          at: { mark: draw-today },
          upsertIds: [a-today],
          drawMs: 1000,
        }

  - id: what
    narration: >
      [[mark:draw-builtin]] built in AI ဆိုတာ browser ထဲမှာ ပါပြီးသား model ကို JavaScript API နဲ့
      ခေါ်သုံးတာပါ။ [[mark:draw-nano]] Chrome မှာဆိုရင် Gemini Nano ဆိုတဲ့ model သေးလေး ပါပြီး၊
      အလုပ် တစ်ခုချင်းအတွက် API တွေကို ပေးထားပါတယ်။ [[mark:draw-apis]] စာကို အနှစ်ချုပ်ပေးတဲ့
      Summarizer နဲ့ prompt နဲ့ ကြိုက်တာ ခိုင်းလို့ ရတဲ့ Prompt API က Gemini Nano ကို သုံးပါတယ်။
      [[mark:draw-expert]] ဘာသာပြန်ပေးတဲ့ Translator နဲ့ ဘယ် ဘာသာစကားလဲ ခွဲပေးတဲ့ Language Detector
      ကတော့ အဲဒီ အလုပ် တစ်ခုတည်းအတွက် လုပ်ထားတဲ့ သီးသန့် model သေးတွေကို သုံးပါတယ်။
      [[mark:draw-status]] Summarizer၊ Translator နဲ့ Language Detector က Chrome ၁၃၈ ကတည်းက stable
      ဖြစ်ပြီး၊ Prompt API ကတော့ Chrome ၁၄၈ ကစပြီး web page တွေမှာ stable ဖြစ်လာပါတယ်။
      [[mark:draw-trial]] Writer၊ Rewriter၊ Proofreader တို့ကတော့ စမ်းသပ်ဆဲပါ။ Edge ကလည်း ကိုယ်ပိုင်
      model နဲ့ preview အဆင့်မှာ စမ်းနေပါတယ်။ [[mark:draw-benefit]] developer ဘက်က ကြည့်ရင် API ကို
      ခေါ်ပြီး အဖြေ ယူရုံပါပဲ။ model ကို host လုပ်စရာ၊ run ဖို့ ပြင်ဆင်စရာ မလိုသလို API ကို ခေါ်တိုင်း
      ငွေလည်း မပေးရပါဘူး။ ဒါကြောင့် idea တစ်ခုကို အမြန် စမ်းပြီး၊ မကောင်းရင် အမြန် ပယ်လို့ ရပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: The client-side AI stack (built-in AI)",
          url: "https://web.dev/learn/ai/client-side",
        }
      - {
          title: "Chrome for Developers: Built-in AI APIs",
          url: "https://developer.chrome.com/docs/ai/built-in-apis",
        }
      - {
          title: "Chrome for Developers: Get started with built-in AI (models per API)",
          url: "https://developer.chrome.com/docs/ai/get-started",
        }
      - {
          title: "Chrome for Developers: Prompt API",
          url: "https://developer.chrome.com/docs/ai/prompt-api",
        }
      - { title: "Chrome 148 release notes", url: "https://developer.chrome.com/release-notes/148" }
      - {
          title: "Microsoft Edge: Prompt API",
          url: "https://learn.microsoft.com/microsoft-edge/web-platform/prompt-api",
        }
    actions:
      - {
          id: draw-builtin,
          type: whiteboard.apply,
          at: { mark: draw-builtin },
          clear: true,
          upsertIds: [b-title],
        }
      - {
          id: draw-nano,
          type: whiteboard.apply,
          at: { mark: draw-nano },
          upsertIds: [b-nano, b-nano-t],
          drawMs: 1200,
        }
      - {
          id: draw-apis,
          type: whiteboard.apply,
          at: { mark: draw-apis },
          upsertIds: [b-arrow, b-api-1, b-api-4],
          drawMs: 1600,
        }
      - {
          id: draw-expert,
          type: whiteboard.apply,
          at: { mark: draw-expert },
          upsertIds: [b-exp, b-exp-t, b-arrow-2, b-api-2, b-api-3],
          drawMs: 2000,
        }
      - {
          id: draw-status,
          type: whiteboard.apply,
          at: { mark: draw-status },
          upsertIds: [b-stable],
          drawMs: 1200,
        }
      - {
          id: draw-trial,
          type: whiteboard.apply,
          at: { mark: draw-trial },
          upsertIds: [b-trial, b-edge],
          drawMs: 1600,
        }
      - {
          id: draw-benefit,
          type: whiteboard.apply,
          at: { mark: draw-benefit },
          upsertIds: [b-benefit],
          drawMs: 1400,
        }

  - id: page
    narration: >
      [[mark:close-b]] ဒါဆို ဆိုင်ရဲ့ website မှာ စမ်းကြည့်ရအောင်။ [[mark:panel-ready]] ညာဘက် AI panel မှာ
      မုန့်ဟင်းခါး page ရဲ့ review တွေ ပေါ်နေပါတယ်။ ဒီ review တွေက lesson အတွက် ပြင်ဆင်ထားတဲ့ နမူနာ data
      ပါ။ customer တွေ review အကုန် မဖတ်ရအောင် page ထိပ်မှာ အနှစ်ချုပ် တိုတို ပြချင်လို့၊ Chrome ရဲ့
      Summarizer ကို သုံးကြည့်ချင်ပါတယ်။ [[mark:open-main]] program က မုန့်ဟင်းခါး review ၇ ခုကို ယူပြီး၊
      [[mark:sel-english]] Summarizer က မြန်မာစာကို support မလုပ်သေးလို့ English review နှစ်ခုကို
      သီးသန့် စုထားပါတယ်။ [[mark:sel-rows]] Built in AI card
      မှာတော့ ဒီ page ထဲမှာ စစ်မယ့် API လေးခုကို စာရင်း လုပ်ထားပါတယ်။ ဘာမှ မစစ်ရသေးလို့ API နာမည်တွေပဲ
      ပြနေပါတယ်။
    sources:
      - {
          title: "Chrome for Developers: Summarizer API",
          url: "https://developer.chrome.com/docs/ai/summarizer-api",
        }
      - {
          title: "web.dev Learn AI: The client-side AI stack (built-in AI)",
          url: "https://web.dev/learn/ai/client-side",
        }
    actions:
      - { id: close-b, type: whiteboard.apply, at: { mark: close-b }, open: false }
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-done
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: ai-status }
        attribute: { name: data-state, value: "done" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-two-cards
        type: expect.preview
        at: { afterAction: expect-done }
        timeoutMs: 5000
        target: { by: testId, value: ai-cards }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-reviews-7
        type: expect.preview
        at: { afterAction: expect-two-cards }
        timeoutMs: 5000
        target: { by: testId, value: ai-reviews }
        attribute: { name: data-count, value: "7" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - { id: open-main, type: workspace.openFile, at: { mark: open-main }, path: src/main.js }
      - id: sel-reviews
        type: editor.select
        at: { afterAction: open-main }
        target:
          {
            file: src/main.js,
            text: 'const reviews = data.reviews.filter((r) => r.item === "mohinga");',
            occurrence: 1,
          }
      - id: sel-english
        type: editor.select
        at: { mark: sel-english }
        target: { file: src/main.js, text: 'reviews.filter((r) => r.lang === "en")', occurrence: 1 }
      - id: expect-english-row
        type: expect.preview
        at: { afterAction: sel-english }
        timeoutMs: 5000
        target: { by: testId, value: ai-reviews-5 }
        textContains: "enThe mohinga is rich"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: sel-rows
        type: editor.select
        at: { mark: sel-rows }
        target:
          { file: src/main.js, text: "const rows = APIS.map((api) => ({ api }));", occurrence: 1 }
      - id: expect-apis-4
        type: expect.preview
        at: { afterAction: sel-rows }
        timeoutMs: 5000
        target: { by: testId, value: ai-apis }
        attribute: { name: data-count, value: "4" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: detect
    chapter: "API ရှိလား အရင် စစ်ရအောင်"
    narration: >
      [[mark:type-exists]] ပထမဆုံး browser မှာ API ရှိမရှိ စစ်ပါမယ်။ ဒါကို feature detection လို့ ခေါ်ပြီး၊
      API ရဲ့ နာမည် browser ထဲမှာ ရှိလား ကြည့်ရုံပါပဲ။ [[mark:read-exists]] exists column မှာ API လေးခုလုံး
      အမှန်ခြစ် ဖြစ်သွားပါပြီ။ ဒီ browser မှာ API တွေ အကုန် ရှိနေပါတယ်။ [[mark:type-avail]] ဒါပေမဲ့ API
      ရှိတာနဲ့ model ကို သုံးလို့ ရတာ မတူပါဘူး။ ဒါကြောင့် API တစ်ခုချင်းရဲ့ availability ကို ခေါ်ပြီး model
      အခု သုံးလို့ ရလား မေးပါမယ်။ [[mark:read-avail]] availability column မှာ API လေးခုလုံး unavailable လို့
      ပြနေပါတယ်။ API ရှိပေမယ့် ဒီ page ထဲမှာ model ကို သုံးလို့ မရဘူးလို့ browser က ပြန်ဖြေတာပါ။
    sources:
      - {
          title: "web.dev Learn AI: The client-side AI stack (built-in AI limitations: browser-specific availability)",
          url: "https://web.dev/learn/ai/client-side",
        }
      - {
          title: "Chrome for Developers: Get started with built-in AI (feature detection, availability)",
          url: "https://developer.chrome.com/docs/ai/get-started",
        }
      - {
          title: "Chrome for Developers: Summarizer API",
          url: "https://developer.chrome.com/docs/ai/summarizer-api",
        }
    actions:
      - id: type-exists
        type: editor.type
        at: { mark: type-exists }
        target:
          {
            file: src/main.js,
            after: "const rows = APIS.map((api) => ({ api }));\n",
            occurrence: 1,
          }
        text: "for (const row of rows) row.exists = row.api in self;\n"
        cadence: line-by-line
      - id: expect-exists-1
        type: expect.preview
        at: { afterAction: type-exists }
        timeoutMs: 8000
        target: { by: testId, value: ai-apis-1 }
        textContains: "Summarizer✓"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-exists-4
        type: expect.preview
        at: { afterAction: expect-exists-1 }
        timeoutMs: 5000
        target: { by: testId, value: ai-apis-4 }
        textContains: "LanguageModel✓"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-avail
        type: editor.type
        at: { mark: type-avail }
        target:
          {
            file: src/main.js,
            after: "for (const row of rows) row.exists = row.api in self;\n",
            occurrence: 1,
          }
        text: "for (const row of rows) row.availability = await availability(row.api);\n"
        cadence: line-by-line
      - id: expect-avail-1
        type: expect.preview
        at: { afterAction: type-avail }
        timeoutMs: 8000
        target: { by: testId, value: ai-apis-1 }
        textContains: "Summarizer✓unavailable"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-avail-2
        type: expect.preview
        at: { afterAction: expect-avail-1 }
        timeoutMs: 5000
        target: { by: testId, value: ai-apis-2 }
        textContains: "LanguageDetector✓unavailable"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-avail-3
        type: expect.preview
        at: { afterAction: expect-avail-2 }
        timeoutMs: 5000
        target: { by: testId, value: ai-apis-3 }
        textContains: "Translator✓unavailable"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-avail-4
        type: expect.preview
        at: { afterAction: expect-avail-3 }
        timeoutMs: 5000
        target: { by: testId, value: ai-apis-4 }
        textContains: "LanguageModel✓unavailable"
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: states
    narration: >
      [[mark:draw-states]] availability က အဖြေ လေးမျိုး ပြန်ပေးနိုင်ပါတယ်။ [[mark:draw-unavailable]]
      unavailable ဆိုရင် ဒီ browser ဒါမှမဟုတ် ဒီ page မှာ သုံးလို့ မရလို့၊ AI မပါတဲ့ ပုံစံကို ပြရပါမယ်။
      [[mark:draw-not-yet]] model ကို ယူလို့ ရပေမယ့် user ရဲ့ စက်ထဲ မရောက်သေးရင်၊ user က ခလုတ်
      တစ်ခုခု နှိပ်ပြီးမှ create ကို ခေါ်လို့ ရပါတယ်။ model ရောက်လာနေတုန်း progress event တွေကို
      နားထောင်ပြီး user ကို ပြပေးရပါမယ်။ [[mark:draw-available]] available ဆိုရင်တော့ create နဲ့ session
      ဖွင့်ပြီး ချက်ချင်း သုံးလို့ ရပါတယ်။ [[mark:draw-here]] ဒီ preview ထဲမှာတော့ API လေးခုလုံး
      unavailable ပါ။
    sources:
      - {
          title: "web.dev Learn AI: The client-side AI stack (built-in AI limitations: user-side download, browser-specific availability)",
          url: "https://web.dev/learn/ai/client-side",
