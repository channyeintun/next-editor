          </head>
          <body>
            <div id="app" data-testid="app"></div>
            <script type="module" src="/course/panel.js" data-run="src/main.js" data-console="off"></script>
          </body>
        </html>
      package.json: |
        {
          "name": "ai-course-tea-shop",
          "private": true,
          "version": "1.0.0",
          "type": "module",
          "scripts": {
            "dev": "vite --host 0.0.0.0 --port 5173 --strictPort"
          },
          "devDependencies": {
            "esbuild": "0.21.5",
            "vite": "5.4.21"
          }
        }
      src/builtin.js: |
        // Chrome's built-in AI APIs for web pages: the global each one is, the name it has in a
        // permissions policy (an iframe's allow="…" attribute) and the options its availability() call
        // takes (the Translator needs a language pair; ours is English → Burmese).
        const FEATURE = {
          Summarizer: "summarizer",
          LanguageDetector: "language-detector",
          Translator: "translator",
          LanguageModel: "language-model",
        };
        const OPTIONS = { Translator: { sourceLanguage: "en", targetLanguage: "my" } };

        export const APIS = Object.keys(FEATURE);

        // What the browser says about the API's model right now: "unavailable", "downloadable",
        // "downloading" or "available" ("—" when the API does not exist in this browser).
        export async function availability(api) {
          if (!(api in self)) return "—";
          return self[api].availability(OPTIONS[api]).catch((error) => error.name);
        }

        // Whether this page's permissions policy lets it use the API at all.
        export function allowed(api) {
          return document.featurePolicy?.allowsFeature(FEATURE[api]) ?? false;
        }
      src/main.js: |
        import { panel } from "ai-panel";
        import data from "../data/reviews.json";
        import { APIS, availability, allowed } from "./builtin.js";
        import { showSummary, showReviews } from "./page.js";

        // The mohinga page: every review customers wrote about it (sample data).
        const reviews = data.reviews.filter((r) => r.item === "mohinga");
        const english = reviews.filter((r) => r.lang === "en").map((r) => r.text).join("\n");

        // Chrome's built-in AI, checked live in this page (no model runs here):
        const rows = APIS.map((api) => ({ api }));

        panel.table("Built-in AI · this page", rows, { id: "apis", badge: "live check" });

        // The summary at the top of the page:

        showReviews(reviews);
      src/page.js: |
        import { panel } from "ai-panel";

        // The top of the item page: the built-in Summarizer's summary when it ran, otherwise the
        // fallback — no summary, and the page goes on showing the reviews as they are (no AI).
        export function showSummary(summary) {
          if (summary) panel.output("Summary", summary, { id: "summary", badge: "built-in AI · Gemini Nano" });
          else panel.note("အနှစ်ချုပ် မရနိုင်လို့ review တွေကို ဒီအတိုင်း ပြထားပါတယ်", { id: "summary", badge: "rules · AI မပါ" });
        }

        // The item page's reviews, as customers wrote them ("roman" = Burmese in Latin letters).
        export function showReviews(reviews) {
          const rows = reviews.map((r) => ({ language: r.lang === "my-latn" ? "roman" : r.lang, review: r.text }));
          panel.table("Reviews · mohinga", rows, { id: "reviews", columns: ["language", "review"] });
        }
      vite.config.js: |
        import { defineConfig } from "vite";
        import courseRunner from "./course/runner.js";

        export default defineConfig({
          plugins: [courseRunner()],
        });
