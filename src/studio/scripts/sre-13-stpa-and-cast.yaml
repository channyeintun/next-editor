build:
  # Studio swaps in the Burmese voice chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 2613

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: hook
    chapter: ဘာမှ မပျက်ဘဲ ပိတ်ခံရတဲ့ wallet တွေ
    narration: >
      [[mark:show-p01]] Padauk က အခု ပုံမှန်လို့ ခေါ်နေတဲ့ ဖြတ်လမ်းတွေကို သုံးလ တစ်ခါ ပြန်စစ်နေပြီး Bank X throttle ကိုလည်း tool ဖြစ်အောင် ဆောက်ထားပါပြီ။ ဒီလ လစာထုတ်ရက် မနက်၊ အထည်ချုပ် စက်ရုံ တစ်ခုက payroll feature အသစ်နဲ့ အလုပ်သမား ၃၀၀၀ ရဲ့ wallet တွေထဲ လစာ ထည့်ပါတယ်။
      [[mark:show-p01b]] မိနစ်ပိုင်းအတွင်း wallet ၂၈၀၀ ပိတ်ခံလိုက်ရလို့ အလုပ်သမားတွေ နေ့လယ်စာ ဝယ်လို့ မရ၊ ရွာကို ငွေ ပို့လို့ မရ ဖြစ်ကုန်ပါတယ်။ ဒါပေမဲ့ ပျက်နေတာ ဘာမှ မရှိပါဘူး၊ payroll batch ရော လိမ်လည်တဲ့ ငွေလွှဲတွေကို ပိတ်ပေးတဲ့ fraud engine ရော design အတိုင်း အလုပ်လုပ်ခဲ့တာပါ။ ဒီတစ်ခါ root cause က ဘယ်မှာလဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "STAMP at Google (sre.google)",
          url: "https://sre.google/resources/practices-and-processes/stpa/",
        }
      - {
          title: "The Evolution of SRE at Google (USENIX ;login:)",
          url: "https://usenix.org/publications/loginonline/evolution-sre-google",
        }
    actions:
      # -1750 / -1450, as in Module 1: a pull-back over 1780 ms pushes the first dialog
      # past the 2 s opening handle, which src/studio/plans/index.test.ts rejects.
      - { id: collapse-dock, type: runtime.collapseDock, at: { scene: start, offsetMs: -1750 } }
      - {
          id: show-p01,
          type: slide.show,
          at: { mark: show-p01, offsetMs: -1450 },
          slideId: l13-p01,
        }
      - { id: show-p01b, type: slide.show, at: { mark: show-p01b }, slideId: l13-p01b }

  - id: worked-as-designed
    chapter: အရင်ဖြစ်တာ အကြောင်းရင်း မဟုတ်
    narration: >
      [[mark:close-p01b]] [[mark:b1-s1]] မသီရိက အပိုင်း တစ်ခုချင်းကို အရင် ကြည့်တော့ payroll batch က test အားလုံး အောင်ထားပါတယ်။ [[mark:b1-s1b]] fraud engine မှာလည်း အကောင့်အသစ်က wallet အများကြီးဆီ ငွေ ရုတ်တရက် လွှဲရင် လက်ခံတဲ့ wallet တွေကို ခဏ ပိတ်ထားတဲ့ rule အသစ် ရှိပါတယ်၊ နှစ်ခုလုံးမှာ bug မရှိပါဘူး။
      [[mark:b1-s2]] ဒါပေမဲ့ နှစ်ခု ဆုံတော့ fraud engine အမြင်မှာ စက်ရုံက wallet ထောင်ချီဆီ တစ်ပြိုင်နက် ငွေလွှဲတဲ့ အကောင့်အသစ် ဖြစ်နေလို့ လစာက လိမ်တဲ့ ပုံစံနဲ့ တူနေတာပါ။ လစာ သုံးမရတာလို user တွေ လက်မခံနိုင်တဲ့ ဆုံးရှုံးမှုကို loss လို့ ခေါ်ပါတယ်၊ အပိုင်းတိုင်း မှန်နေရက်နဲ့ loss ဖြစ်တာမို့ safety ဆိုတာ အပိုင်းတွေ ဆက်ဆံရာကနေ ပေါ်လာတာပါ။
      [[mark:b1-s3]] postmortem မှာ တစ်ယောက်က fraud rule ကို ရှေ့နေ့ ကြာသပတေးမှာ ထည့်ခဲ့လို့ အဲဒါ root cause ပဲလို့ ပြောပါတယ်။ ဒါပေမဲ့ rule က ကြာသပတေး တစ်နေ့လုံး ပြဿနာ မပေးခဲ့ပါဘူး။ [[mark:b1-s3b]] timeline က ဘာ အရင် ဖြစ်လဲ ပြပေမဲ့ အရင် ဖြစ်တာတိုင်း အကြောင်းရင်း မဟုတ်ပါဘူး။
      [[mark:b1-s4]] ဒါကြောင့် root cause ဆိုတာ မေးတာ ရပ်လိုက်တဲ့ နေရာ သက်သက်ပါ။ safety ပညာရှင် Nancy Leveson ရဲ့ System-Theoretic Accident Model and Processes၊ အတိုကောက် STAMP model ကလည်း loss တွေကို အပိုင်း ပျက်လို့ထက် ဆက်ဆံပုံကို control မလုံလောက်လို့ ဖြစ်တယ်လို့ ကြည့်ပြီး လူ ဒါမှမဟုတ် software ရဲ့ အမှားကို လက္ခဏာ အဖြစ်ပဲ မြင်ပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "CAST Handbook (Leveson, MIT PSASS, PDF)",
          url: "https://psas.scripts.mit.edu/home/get_file4.php?name=CAST_Handbook.pdf",
        }
      - {
          title: "STAMP at Google (sre.google)",
          url: "https://sre.google/resources/practices-and-processes/stpa/",
        }
    actions:
      - { id: close-p01b, type: slide.close, at: { mark: close-p01b, offsetMs: -400 } }
      # Step 1 is split at the sentence end after the payroll clause, so each part's
      # box lands as it is named: payroll first, then the fraud engine and the
      # shared "as designed" label.
      - id: b1-s1
        type: whiteboard.apply
        at: { mark: b1-s1 }
        open: true
        clear: true
        upsertIds: [l13-b1-pay, l13-b1-pay-t, l13-b1-pay-ok]
        drawMs: 1400
      - id: b1-s1b
        type: whiteboard.apply
        at: { mark: b1-s1b }
        upsertIds: [l13-b1-fraud, l13-b1-fraud-t, l13-b1-fraud-ok, l13-b1-design]
        drawMs: 1800
      - id: b1-s2
        type: whiteboard.apply
        at: { mark: b1-s2 }
        upsertIds: [l13-b1-a1, l13-b1-a2, l13-b1-frozen, l13-b1-frozen-t]
        drawMs: 1800
      # Step 3 is split in two (at most three new elements per step): the timeline
      # strip with its two days, then "before is not because" as it is said.
      - id: b1-s3
        type: whiteboard.apply
        at: { mark: b1-s3 }
        upsertIds: [l13-b1-axis, l13-b1-tick1, l13-b1-tick2, l13-b1-thu, l13-b1-fri]
        drawMs: 2200
      - id: b1-s3b
        type: whiteboard.apply
        at: { mark: b1-s3b }
        upsertIds: [l13-b1-because]
        drawMs: 1200
      - id: b1-s4
        type: whiteboard.apply
        at: { mark: b1-s4 }
        upsertIds: [l13-b1-stamp]
        drawMs: 1600

  - id: control-loop
    chapter: Control loop
    narration: >
      [[mark:close-b1]] [[mark:b2-s1]] ဒါဆို control ဆိုတာ ဘာလဲ? တစ်ခုခုကို ထိန်းတဲ့ လူ ဒါမှမဟုတ် program ကို controller လို့ ခေါ်ပြီး သူ ပို့တဲ့ command ကို control action လို့ ခေါ်ပါတယ်။ ဒီမှာတော့ fraud engine က controller ဖြစ်ပြီး wallet ပိတ်တာက သူ့ action ပါ။
      [[mark:b2-s2]] action က ထိန်းခံရတဲ့ process ကို ပြောင်းပါတယ်၊ ဒီမှာတော့ wallet တွေပါ။ ရလဒ်ကို ပြန်ပြောပြတဲ့ dashboard လို signal က feedback ဖြစ်ပြီး controller က အဲဒါကို ကြည့်ပြီး နောက် action ကို ဆုံးဖြတ်ပါတယ်။ ဒီ စက်ဝိုင်းက control loop ပါ၊ bug ရှိနေရင်တောင် process ကို ဘေးကင်းတဲ့ ဘောင်ထဲမှာ ထိန်းထားပေးပါတယ်။
      [[mark:b2-s3]] controller တိုင်းမှာ process အကြောင်း ယုံကြည်ချက် တစ်ခု ရှိပါတယ်။ fraud engine က အကောင့်အသစ်က ငွေ အများကြီး လွှဲရင် လိမ်တာပဲလို့ ယုံထားပြီး လစာ ဆိုတာ သူ့ ယုံကြည်ချက်ထဲမှာ မရှိခဲ့ပါဘူး။ ယုံကြည်ချက် မှားရင် logic မှန်နေရင်တောင် action မှားတာပါပဲ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "STPA Handbook (Leveson & Thomas, MIT PSASS, PDF)",
          url: "https://psas.scripts.mit.edu/home/get_file.php?name=STPA_Handbook.pdf",
        }
      - {
          title: "STAMP at Google (sre.google)",
          url: "https://sre.google/resources/practices-and-processes/stpa/",
        }
    actions:
      # ⟪close board⟫ straight into the next board: wipe B1 400 ms early and keep the
      # panel open (as in lesson 8), so the editor does not flash between two boards.
      - id: close-b1
        type: whiteboard.apply
        at: { mark: close-b1, offsetMs: -400 }
        clear: true
      # The ring is the track (furniture, no drawMs); the nodes are drawn on top of it,
      # filled white (it paints as the dark canvas) so the ring does not cross a label.
      - id: b2-s1
        type: whiteboard.apply
        at: { mark: b2-s1 }
        open: true
        clear: true
        upsertIds: [l13-b2-ring]
      - id: b2-s1-draw
        type: whiteboard.apply
        at: { afterAction: b2-s1 }
        upsertIds:
          [
            l13-b2-ctrl,
            l13-b2-ctrl-t1,
            l13-b2-ctrl-t2,
            l13-b2-a1,
            l13-b2-act,
            l13-b2-act-t1,
            l13-b2-act-t2,
          ]
        drawMs: 2400
      - id: b2-s2
        type: whiteboard.apply
        at: { mark: b2-s2 }
        upsertIds:
          [
            l13-b2-a2,
            l13-b2-proc,
            l13-b2-proc-t1,
            l13-b2-proc-t2,
            l13-b2-fb,
            l13-b2-fb-t1,
            l13-b2-fb-t2,
          ]
        drawMs: 2400
      - id: b2-s3
        type: whiteboard.apply
        at: { mark: b2-s3 }
        upsertIds: [l13-b2-belief-ring, l13-b2-belief]
        drawMs: 1400

  - id: every-controller
    narration: >
      [[mark:close-b2]] [[mark:show-p02]] ဘယ် controller ကိုမဆို နားလည်ချင်ရင် သူ့ တာဝန်နဲ့ ဆုံးဖြတ်တဲ့ စည်းမျဉ်း၊ မှားနိုင်တဲ့ ယုံကြည်ချက်နဲ့ အဲဒါကို ပြင်ပေးတဲ့ feedback ဆိုတဲ့ သုံးခုကို ကြည့်ပါ၊ ယုံကြည်ချက်က feedback ကောင်းသလောက်ပဲ မှန်ပါတယ်။
      [[mark:show-p02b]] ဥပမာ Operator A နှေးလို့ on-call က traffic တစ်ဝက်ကို Operator B ဆီ လွှဲတယ် ဆိုပါစို့။ dashboard က ၂ မိနစ် နောက်ကျနေလို့ လွှဲတာ မရသေးဘူး ထင်ပြီး ကျန်တာပါ ထပ်လွှဲလိုက်တော့ Operator B ပါ နှေးသွားပါတယ်၊ logic မှန်ပေမဲ့ feedback နောက်ကျခဲ့တာပါ။
      automation များလာလေ အခက်ဆုံး case တွေက လူဆီ ရောက်လာလေပါပဲ၊ မှားပြီး ပိတ်ခံရတဲ့ wallet တွေကို support က ပြန်ဖွင့်ရသလိုပါ။ ဒါကြောင့် control loop ဆွဲရင် လူတွေကိုလည်း controller အဖြစ် ထည့်ဆွဲရပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "STPA Handbook (Leveson & Thomas, MIT PSASS, PDF)",
          url: "https://psas.scripts.mit.edu/home/get_file.php?name=STPA_Handbook.pdf",
        }
      - {
          title: "STAMP at Google (sre.google)",
          url: "https://sre.google/resources/practices-and-processes/stpa/",
        }
    actions:
      - id: close-b2
        type: whiteboard.apply
        at: { mark: close-b2, offsetMs: -400 }
        open: false
      - { id: show-p02, type: slide.show, at: { mark: show-p02 }, slideId: l13-p02 }
      # p02b stays up for the scene's last two sentences (~31 s at 70 ms/char).
      - { id: show-p02b, type: slide.show, at: { mark: show-p02b }, slideId: l13-p02b }

  - id: stpa-four-steps
    chapter: STPA အဆင့် လေးဆင့်
    narration: >
      [[mark:show-p03]] payroll ရဲ့ design doc ကို ရေးတုန်းက လစာ ဝင်လာရင် wallet ပေါ်မှာ တခြား ဘယ် controller တွေ action လုပ်မလဲ၊ သူတို့ ဘာကို ယုံထားလဲလို့ မေးခဲ့ရင် ဒီ ပြဿနာကို စာရွက်ပေါ်မှာတင် တွေ့နိုင်ခဲ့မှာပါ။ ဒီလို incident မဖြစ်ခင် ကြိုရှာတဲ့ နည်းက System-Theoretic Process Analysis၊ အတိုကောက် STPA ပါ၊ အဆင့် လေးဆင့် ရှိပါတယ်။
      [[mark:show-p03b]] ပထမ အဆင့်မှာ loss တွေနဲ့ အဲဒီဆီ ဦးတည်နိုင်တဲ့ အန္တရာယ်ရှိတဲ့ အခြေအနေ၊ hazard တွေကို ရေးပါတယ်။ ဒုတိယ အဆင့်မှာ ဘယ်သူက ဘာကို ထိန်းပြီး ဘယ် feedback ပြန်ရလဲ ဆိုတဲ့ ပုံ၊ control structure ကို ဆွဲပါတယ်။
      [[mark:show-p03c]] တတိယ အဆင့်မှာ hazard ဖြစ်စေနိုင်တဲ့ action တွေ၊ unsafe control action တွေကို ရှာပါတယ်။ လုပ်သင့်ရဲ့နဲ့ မလုပ်တာ၊ မလုပ်သင့်ဘဲ လုပ်တာ၊ စောလွန်းတာ ဒါမှမဟုတ် နောက်ကျလွန်းတာ၊ ကြာလွန်းတာ ဒါမှမဟုတ် စောစော ရပ်သွားတာ ဆိုပြီး လေးမျိုး ရှိပါတယ်။
      [[mark:show-p03d]] စတုတ္ထ အဆင့်မှာတော့ အဲဒီ action တွေ ဘာကြောင့် ဖြစ်နိုင်လဲ ရေးပါတယ်၊ ဥပမာ feedback နောက်ကျတာ၊ ပျောက်တာ၊ ယုံကြည်ချက် မှားတာတွေပါ။ run နေတဲ့ system ပေါ်မှာလည်း STPA လုပ်လို့ရပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "STPA Handbook (Leveson & Thomas, MIT PSASS, PDF)",
          url: "https://psas.scripts.mit.edu/home/get_file.php?name=STPA_Handbook.pdf",
        }
      - {
          title: "Teaching a new way to prevent outages at Google (sre.google)",
          url: "https://sre.google/stpa/teaching/",
        }
    actions:
      - { id: show-p03, type: slide.show, at: { mark: show-p03 }, slideId: l13-p03 }
      - { id: show-p03b, type: slide.show, at: { mark: show-p03b }, slideId: l13-p03b }
      - { id: show-p03c, type: slide.show, at: { mark: show-p03c }, slideId: l13-p03c }
      - { id: show-p03d, type: slide.show, at: { mark: show-p03d }, slideId: l13-p03d }

  - id: refund-design
    chapter: Refund design ကို ကြိုစစ်
    narration: >
      [[mark:close-p03d]] [[mark:b3-s1]] Top-up အဖွဲ့ကလည်း operator ၁၀ မိနစ်အတွင်း အတည်မပြုရင် auto-refund job က ငွေ ပြန်အမ်းမယ့် design doc ယူလာပါတယ်။ မသီရိ၊ Top-up developer တစ်ယောက်နဲ့ support lead မစုတို့ တစ်မနက်လောက် STPA လုပ်ကြည့်တော့ ငွေဝင်ငွေထွက် စာရင်း၊ ledger ပေါ်မှာ refund ပေးနိုင်တဲ့ controller နှစ်ခု တွေ့ပါတယ်၊ support agent နဲ့ job ပါ။
      [[mark:b3-s2]] ဒီ design မှာတော့ loss က ငွေ ဆုံးတာ ဖြစ်ပြီး hazard က wallet balance နဲ့ operator ဘက်မှာ တကယ် ဖြစ်ခဲ့တာ မကိုက်တာပါ။ job ရဲ့ feedback ဖြစ်တဲ့ success callback ကလည်း traffic များတဲ့ ညနေတွေမှာ နောက်ကျတတ်ပါတယ်။
      [[mark:b3-s3]] ဒီတော့ unsafe control action နှစ်ခု ထွက်လာပါတယ်။ job က callback မလာရင် fail တာပဲလို့ ယုံထားလို့ callback နောက်ကျရင် အောင်မြင်ပြီးသား top-up ကို refund ပေးမိတာနဲ့ support ရော job ရော refund လုပ်လို့ နှစ်ခါ ပြန်အမ်းမိတာပါ။
      [[mark:b3-s4]] design doc မှာ ပြင်တာကတော့ refund မပေးခင် status ကို အရင် စစ်မယ်၊ refund ကို job ကပဲ ပေးပြီး support က တောင်းဆိုရုံပဲ လုပ်မယ်၊ refund တစ်ခုကို တစ်ခါပဲ ဖြစ်အောင် idempotency key ထည့်မယ် ဆိုတာတွေပါ။
      [[mark:b3-s5]] balance မကိုက်တဲ့ hazard ပေါ်တာနဲ့ alert တက်အောင်လည်း ထားလို့ loss တကယ် မဖြစ်ခင် သိရပါမယ်။ design doc မှာ စာပိုဒ် အနည်းငယ်ပဲ ကုန်ပေမဲ့ production ရောက်မှ ပြင်ရရင်တော့ အဖွဲ့ တစ်ဖွဲ့လုံး လိုပြီး ledger data တွေကိုပါ လိုက်ပြင်ရပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "STPA Handbook (Leveson & Thomas, MIT PSASS, PDF)",
          url: "https://psas.scripts.mit.edu/home/get_file.php?name=STPA_Handbook.pdf",
        }
      - {
          title: "STPA for Software Systems (SREcon25 EMEA)",
          url: "https://www.usenix.org/conference/srecon25emea/presentation/klein",
        }
    actions:
      - { id: close-p03d, type: slide.close, at: { mark: close-p03d, offsetMs: -400 } }
      - id: b3-s1
        type: whiteboard.apply
        at: { mark: b3-s1 }
        open: true
        clear: true
        upsertIds:
          [
            l13-b3-sup,
            l13-b3-sup-t,
            l13-b3-sup-a,
            l13-b3-job,
            l13-b3-job-t,
            l13-b3-job-a,
            l13-b3-ledger,
            l13-b3-ledger-t,
          ]
        drawMs: 2600
      - id: b3-s2
        type: whiteboard.apply
        at: { mark: b3-s2 }
        upsertIds: [l13-b3-cb, l13-b3-cb-t, l13-b3-cb-a, l13-b3-late]
        drawMs: 1600
      - id: b3-s3
