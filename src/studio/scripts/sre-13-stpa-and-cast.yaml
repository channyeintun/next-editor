# SRE from zero, lesson 13: Beyond root cause, STPA and CAST (Burmese concept lesson).
#
# Built from the approved voice script
# docs/sre-course/voice-scripts/sre-13-stpa-and-cast.md. Every spoken
# character is that script's "> " lines, unchanged; each ⟪…⟫ marker became a
# [[mark:…]] at the same place. Check it with:
#   bun ~/Documents/sre-course/work/check-narration.ts \
#     docs/sre-course/voice-scripts/sre-13-stpa-and-cast.md \
#     src/studio/scripts/sre-13-stpa-and-cast.yaml
#
# Nothing runs: deck pages and the whiteboard carry the lesson, and notes.md is
# the recap. The workspace and runtime follow the validated no-code skeleton
# (WebContainer, empty init command, a harmless dev script).
#
# Three marks add no spoken text and sit at an existing ။: b1-s1b splits
# board B1's first step so each part's box lands as it is named (payroll, then
# the fraud engine with the shared "as designed" label), b1-s3b keeps B1's
# third step to three new elements (the timeline strip and its two days, then
# "before is not because" as it is said), and ask-question makes the recap
# question its own dialog so the question-line select can hang off it for the
# ⟪pause 3s⟫, as in Module 1. No page or board step holds longer than about
# 31 s at 70 ms/char (l13_p02b, the scene 4 rider), so no pacing page was added.
#
# ⟪close board⟫ straight into the next board (scenes 3 and 7) wipes the open
# board 400 ms early (whiteboard.apply clear) instead of closing the panel, as
# in lesson 8, so the editor does not flash between two boards; the next board
# then draws with open: true, clear: true as usual. A board followed by a deck
# page closes the panel (open: false) 400 ms before the page, as in Module 1.
#
# Boards (B1 two parts over one result plus a P8 strip, B2 P3 ring, B3 the
# refund control structure, B4 P1 flow). Colour jobs: #1e1e1e ink (paints
# white) for arrows, ticks, the axis and the plain nodes; blue the thing named
# (the parts and the controllers); green healthy or done (as designed, the
# fixes); red failure (frozen wallets, unsafe actions, missing controls);
# orange the caveat (before is not because, the belief, late feedback, the
# ownership gap, the dashboard); violet the result or flow (STAMP's verdict,
# the loop's track). A label on two lines is two text assets, one per line, so
# each line meets the 0.55 em width rule on its own.
#
# Deck pages: deck "Next Editor · SRE 3 · Respond and learn". The /pub URL
# below is the deck's published link; until this lesson's pages are built
# into it, the published copy holds only the kit pages and the Director
# reports the l13 pages missing. Page plan:
# ~/Documents/sre-course/work/pages/sre-13-stpa-and-cast.json (the cover's
# title is shortened there to "Root cause ထက် ပို: STPA နဲ့ CAST", 33 code
# points, because the full title's 40 pass the K1 title's safe 34).
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/sre-13-stpa-and-cast.yaml
#   bun scripts/studio-compile-check.ts src/studio/scripts/sre-13-stpa-and-cast.yaml
