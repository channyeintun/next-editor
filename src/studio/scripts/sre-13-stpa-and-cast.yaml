  - id: cast-step-by-step
    narration: >
      [[mark:close-b4]] [[mark:show-p04]] CAST မှာ အဆင့် ငါးဆင့် ရှိပါတယ်။ ပထမ အဆင့်မှာ loss နဲ့ hazard ကို ရေးပြီး timeline ကိုတော့ မေးခွန်း ထုတ်ဖို့ပဲ သုံးပါတယ်၊ ဥပမာ fraud အဖွဲ့က payroll launch ကို ဘာလို့ မသိခဲ့လဲ ဆိုတာမျိုးပါ။ အပြစ်လည်း မရှာ၊ အဖြေလည်း မချသေးပါဘူး။ ဒုတိယ အဆင့်က ခုနက ဆွဲခဲ့တဲ့ structure ပါ။
      [[mark:show-p04b]] တတိယ အဆင့်မှာ controller တစ်ခုချင်း လုပ်ခဲ့တာ အဲဒီအချိန်က ဘာကြောင့် အဓိပ္ပာယ် ရှိခဲ့လဲ ရှာပါတယ်။ fraud အဖွဲ့က လိမ်တာ များလာတာ မြင်ခဲ့ပြီး payroll အဖွဲ့ကလည်း သေချာ test လုပ်ခဲ့ပါတယ်။ ဆုံးဖြတ်ချက်ကို ပုံသွင်းခဲ့တဲ့ ယုံကြည်ချက်၊ feedback၊ အချိန် ဖိအားတွေကို မပြင်ဘဲ လူကိုပဲ လဲရင် နောက်လူလည်း ဒီလိုပဲ ဆုံးဖြတ်မှာပါ။
      [[mark:show-p04c]] စတုတ္ထ အဆင့်မှာ controller အားလုံးကို ထိတဲ့ အချက်တွေ ရှာပါတယ်၊ ဥပမာ launch တိုင်းမှာ ဒီ wallet ပေါ် တခြား ဘယ်သူ action လုပ်လဲလို့ မေးတဲ့ review မရှိတာပါ။ engineer ၄၀ လောက် ရှိလာတော့ launch တိုင်းကို လူတိုင်း မသိတော့ဘဲ control တွေ တဖြည်းဖြည်း အားနည်းသွားတာပါ။
      [[mark:show-p04d]] ပဉ္စမ အဆင့်မှာ အကြံပြုချက် တိုင်းကို တွေ့ခဲ့တဲ့ အချက်ဆီ ပြန်ချိတ်ပြီး ဒီ incident ကိုပဲ တားမှာလား၊ ဆင်တူ incident တွေကိုပါ တားမှာလားလို့ မေးပါတယ်။ rule ကနေ စက်ရုံကို ချန်တာ၊ ပြန်ဖွင့်တဲ့ ခလုတ် ထည့်တာလို local fix တွေက လက္ခဏာကိုပဲ ကုလို့ rule တွေ ဆက်ဆံပုံ ဘယ်သူ ပိုင်မလဲ၊ support က on-call ကို ဘာလို့ မခေါ်နိုင်ခဲ့လဲလို့ ဆက်မေးရပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "CAST Handbook (Leveson, MIT PSASS, PDF)",
          url: "https://psas.scripts.mit.edu/home/get_file4.php?name=CAST_Handbook.pdf",
        }
      - {
          title: "STAMP at Google (sre.google)",
          url: "https://sre.google/resources/practices-and-processes/stpa/",
        }
    actions:
      - id: close-b4
        type: whiteboard.apply
        at: { mark: close-b4, offsetMs: -400 }
        open: false
      - { id: show-p04, type: slide.show, at: { mark: show-p04 }, slideId: l13-p04 }
      - { id: show-p04b, type: slide.show, at: { mark: show-p04b }, slideId: l13-p04b }
      - { id: show-p04c, type: slide.show, at: { mark: show-p04c }, slideId: l13-p04c }
      - { id: show-p04d, type: slide.show, at: { mark: show-p04d }, slideId: l13-p04d }

  - id: the-shift
    chapter: ကြိုကြည့်တဲ့ အမြင်
    narration: >
      [[mark:show-p05]] ဒီ incident နောက် Padauk ရဲ့ အမြင် ပြောင်းသွားပါတယ်။ root cause တစ်ခုကို ရှာမယ့်အစား အချက်တွေနဲ့ structure ကို ပြင်ပြီး၊ လူကို အပြစ်မရှာတဲ့ blameless ဖြစ်ရုံ မကဘဲ ဆုံးဖြတ်ချက်ကို ဘာက ပုံသွင်းခဲ့လဲ စနစ်တကျ ခွဲပါတယ်။ ပျက်ပြီးမှ မြန်မြန် တုံ့ပြန်ရုံနဲ့လည်း မရပ်ဘဲ loss တွေကို ကြိုစာရင်းလုပ်ပြီး အဆိုးဆုံးကို အရင် ပြင်ပါတယ်။
      [[mark:show-p05b]] fault injection test တွေက တစ်ခုခုကို တမင် ပျက်အောင် လုပ်ပြီးမှ စပေမဲ့ STPA က ဘာမှ မပျက်ဘဲ ဖြစ်တဲ့ loss တွေကို ရှာပြီး နောက် ဘယ် test လုပ်ရမလဲ ဆိုတာကိုပါ ပြပေးပါတယ်၊ lesson ၁၉ မှာ ပြန်တွေ့ရပါမယ်။ incident ပြီးရင် CAST က ပိုသက်သာပြီး STPA က ပိုကျယ်ပါတယ်။ စချင်ရင် လူ နှစ်ယောက် သုံးယောက်၊ design doc တစ်ခုနဲ့ အရင်က မထင်မှတ်ဘဲ ပြဿနာ ပေးခဲ့ဖူးတဲ့ system ကနေ စပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "The Evolution of SRE at Google (USENIX ;login:)",
          url: "https://usenix.org/publications/loginonline/evolution-sre-google",
        }
      - {
          title: "Teaching a new way to prevent outages at Google (sre.google)",
          url: "https://sre.google/stpa/teaching/",
        }
    actions:
      - { id: show-p05, type: slide.show, at: { mark: show-p05 }, slideId: l13-p05 }
      - { id: show-p05b, type: slide.show, at: { mark: show-p05b }, slideId: l13-p05b }

  - id: this-week
    narration: >
      [[mark:show-p06]] ဒီအပတ် postmortem နဲ့ design doc တွေကို မျက်လုံးအသစ်နဲ့ ကြည့်ပါ။ postmortem တစ်ခုကို ဖတ်ပြီး ဘယ်နေရာမှာ မေးတာ ရပ်သွားလဲ ရှာကြည့်ပါ။ ကိုယ့် system ထဲက control loop တစ်ခုကို ယုံကြည်ချက် ပါအောင် ဆွဲကြည့်ပါ။ ပြီးတော့ review လုပ်နေတဲ့ design doc တစ်ခုပေါ်မှာ STPA ကို စမ်းကြည့်ပါ။
    sources:
