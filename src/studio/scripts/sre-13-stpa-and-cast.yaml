        at: { mark: b3-s3 }
        upsertIds:
          [l13-b3-tag1, l13-b3-tag1-t1, l13-b3-tag1-t2, l13-b3-tag2, l13-b3-tag2-t1, l13-b3-tag2-t2]
        drawMs: 2200
      # Step 4 clears the red tags and keeps the step 1-2 structure as furniture
      # (clear never removes an id the same action upserts), then draws the fixes.
      - id: b3-s4
