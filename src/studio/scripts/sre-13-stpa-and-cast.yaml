      - { id: show-p06, type: slide.show, at: { mark: show-p06 }, slideId: l13-p06 }

  - id: recap
    narration: >
      [[mark:close-p06]] [[mark:open-notes]] ဒီ စကားလုံးတွေက control loop ကနေ လာတာပါ။ [[mark:sel-control-loop]] control loop က action လုပ်၊ feedback ပြန်ရပြီး ယုံကြည်ချက်ကို ပြင်တဲ့ စက်ဝိုင်းပါ။ [[mark:sel-hazard]] hazard က loss ဆီ ဦးတည်နေတဲ့ အခြေအနေမို့ alert ထားဖို့ ကောင်းတဲ့ နေရာပါ။ [[mark:sel-uca]] unsafe control action ကတော့ hazard ဖြစ်စေတဲ့ action ပါ။
      [[mark:sel-stpa]] STPA က incident မဖြစ်ခင် design ပေါ်မှာ ကြိုရှာတာ ဖြစ်ပြီး၊ [[mark:sel-cast]] CAST ကတော့ ဖြစ်ပြီးမှ တကယ့် structure နဲ့ ပြန်ခွဲတာပါ။ [[mark:sel-question]] fraud dashboard က ပိတ်လိုက်တဲ့ ၂၈၀၀ ကို သတင်းကောင်းလို့ ပြခဲ့ပါတယ်။ [[mark:ask-question]] control loop ရဲ့ ဘယ်အပိုင်း မှားခဲ့တာလဲ?
      [[mark:pause-question]] feedback ပါ၊ ပိတ်တဲ့ အရေအတွက်ကိုပဲ ရေတွက်ပြီး ပိတ်ခံရတဲ့သူတွေ တကယ် လိမ်တာလား မတိုင်ခဲ့လို့ပါ။ ဒီ incident တွေမှာ reliability ဘက်ကို ထမ်းခဲ့ရတာ မသီရိ တစ်ယောက်တည်းပါ။ Padauk က ဘယ်လို လူမျိုးကို ခန့်ရမလဲ၊ လူသစ်တွေကရော ဘေးကင်းကင်း ဘယ်လို သင်ယူကြမလဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "STPA Handbook (Leveson & Thomas, MIT PSASS, PDF)",
          url: "https://psas.scripts.mit.edu/home/get_file.php?name=STPA_Handbook.pdf",
        }
      - {
          title: "CAST Handbook (Leveson, MIT PSASS, PDF)",
          url: "https://psas.scripts.mit.edu/home/get_file4.php?name=CAST_Handbook.pdf",
        }
    actions:
      - { id: close-p06, type: slide.close, at: { mark: close-p06 } }
      - {
          id: open-notes,
          type: workspace.openFile,
          at: { mark: open-notes, offsetMs: 300 },
          path: notes.md,
        }
      - id: sel-control-loop
        type: editor.select
        at: { mark: sel-control-loop }
        target: { file: notes.md, text: "control loop", occurrence: 1 }
      - id: sel-hazard
        type: editor.select
        at: { mark: sel-hazard }
        target: { file: notes.md, text: "hazard", occurrence: 1 }
      - id: sel-uca
        type: editor.select
        at: { mark: sel-uca }
        target: { file: notes.md, text: "unsafe control action", occurrence: 1 }
      # occurrence 2: the title line holds the first STPA and the first CAST.
      - id: sel-stpa
        type: editor.select
        at: { mark: sel-stpa }
        target: { file: notes.md, text: "STPA", occurrence: 2 }
      - id: sel-cast
        type: editor.select
        at: { mark: sel-cast }
        target: { file: notes.md, text: "CAST", occurrence: 2 }
      # The voice script's ⟪select မေးခွန်း⟫ and ⟪pause 3s⟫, the way the Module 1
      # reviewers fixed the pause (as in lesson 7). sel-question marks where the
      # voice script puts the select, but a select there would drag under the
      # question and leave no pause, and one at pause-question would drag under
      # the answer's first words (the scheduler holds only the dialog after its
      # anchor's). So the question-line select hangs off ask-question, one more
      # mark at an existing sentence end that makes the question its own dialog:
      # it starts about as the question ends, its drag runs in silence, and the
      # answer at pause-question waits for it. The question is a short dialog (40
      # characters), so 3850 leaves about 2.8 / 2.2 / 1.2 s of quiet between the
      # question's estimated end and the answer at 55 / 70 / 95 ms per char (at 95
      # the drag starts under the question's last words, as in lesson 7); an
      # offset above ~3970 trips compile-check's 2.5 s inserted-silence warning
      # at 55.
      - id: select-question
        type: editor.select
        at: { mark: ask-question, offsetMs: 3850 }
        target:
          file: notes.md
          text: 'မေးခွန်း: fraud dashboard က "ပိတ်တာ 2,800" ကို သတင်းကောင်းလို့ ပြခဲ့တယ်။ control loop ရဲ့ ဘယ်အပိုင်း မှားခဲ့လဲ?'
          occurrence: 1

checks:
  # 500, not 300: google-svg deck pages stall the main thread at show/close.
  - { type: timing.p95Ms, max: 500 }
