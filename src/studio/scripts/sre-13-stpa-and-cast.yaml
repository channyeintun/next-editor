        drawMs: 1400

  - id: cast-frozen-wallets
    chapter: ပိတ်ခံရတဲ့ wallet တွေအပေါ် CAST
    narration: >
      [[mark:close-b3]] [[mark:b4-s1]] ပိတ်ခံရတဲ့ wallet တွေလို ဖြစ်ပြီးသွားတဲ့ incident ကိုတော့ Causal Analysis based on Systems Theory၊ အတိုကောက် CAST နဲ့ ပြန်ခွဲပါတယ်၊ ဘယ်သူ မှားလဲ မမေးဘဲ control တွေ ဘာလို့ မတားနိုင်ခဲ့လဲ မေးတာပါ။ မသီရိက org chart အတိုင်း မဟုတ်ဘဲ အဲဒီနေ့က တကယ် အလုပ်လုပ်ခဲ့တဲ့ structure ကို ဆွဲပါတယ်။
      [[mark:b4-s2]] support မှာ wallet အများကြီးကို တစ်ခါတည်း ပြန်ဖွင့်တဲ့ tool မရှိသလို on-call ကို ခေါ်တဲ့ လမ်းလည်း မရှိခဲ့ပါဘူး။ on-call မှာလည်း wallet ပိတ်တာ များလာရင် တက်မယ့် alert မရှိလို့ Facebook post တွေ ပြန့်လာမှ သိခဲ့ပါတယ်။
      [[mark:b4-s3]] ပုံ ဆွဲလိုက်တော့ payroll နဲ့ fraud rule တွေ ဆက်ဆံပုံကို ဘယ်သူ ပိုင်လဲ ဆိုတဲ့ မေးခွန်း ပေါ်လာပါတယ်၊ ဘယ်သူမှ မပိုင်ပါဘူး။ ပိုင်ရှင် မရှိတဲ့ နေရာ၊ ပိုင်ရှင် ထပ်နေတဲ့ နေရာတွေမှာ အကြောင်းရင်းတွေ ပုန်းနေတတ်ပါတယ်။
      [[mark:b4-s4]] fraud dashboard ကလည်း ပိတ်လိုက်တဲ့ ၂၈၀၀ ကို အောင်မြင်မှုလို့ ရေတွက်ခဲ့ပါတယ်။ feedback က မှားတဲ့ အရာကို တိုင်းနေလို့ fraud အဖွဲ့က rule ကောင်းနေတယ်လို့ပဲ ယုံခဲ့ကြတာပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "CAST Handbook (Leveson, MIT PSASS, PDF)",
