      notes.md: |
        # Root cause ထက် ပိုကြည့်တဲ့ STPA နဲ့ CAST

        - control loop — controller → action → process → feedback → ယုံကြည်ချက် ပြင်
        - hazard — loss မဖြစ်သေးပေမဲ့ အဲဒီဆီ ဦးတည်တဲ့ အခြေအနေ၊ alert ထားစရာ
        - unsafe control action — hazard ဖြစ်စေတဲ့ action: မလုပ် · မှားလုပ် · အချိန်မှား · ကြာချိန်မှား
        - STPA — incident မဖြစ်ခင် design ပေါ်မှာ ကြိုရှာ
        - CAST — incident ပြီးမှ တကယ့် structure နဲ့ ပြန်ခွဲ

        မေးခွန်း: fraud dashboard က "ပိတ်တာ 2,800" ကို သတင်းကောင်းလို့ ပြခဲ့တယ်။ control loop ရဲ့ ဘယ်အပိုင်း မှားခဲ့လဲ?
