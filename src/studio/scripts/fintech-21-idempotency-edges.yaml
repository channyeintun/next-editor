build:
  voiceProfile:
    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 9521

runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "k-1 provider down: 503 provider unavailable\nk-1 retry:         503 provider unavailable\nk-2 for 25.00:     201 tx-1\nk-2 for 30.00:     201 tx-1\nuser 1042: 75.00\n"
      run-2:
        status: success
        exitCode: 0
        output: "k-1 provider down: 503 provider unavailable\nk-1 retry:         503 provider unavailable\nk-2 for 25.00:     201 tx-1\nk-2 for 30.00:     422 key reused for a different request\nuser 1042: 75.00\n"
      run-3:
        status: success
        exitCode: 0
        output: "k-1 provider down: 503 provider unavailable\nk-1 retry:         503 provider unavailable\nk-2 for 25.00:     201 tx-1\nk-2 for 30.00:     422 key reused for a different request\nuser 1042: 75.00\nh-1 late retry: 201 hold-1   available: 75.00\nh-1 after 25h:  201 hold-2   available: 35.00\n"

scenes:
  - id: hook
    chapter: Key store ရဲ့ ခက်တဲ့ မေးခွန်းတွေ
    narration: >-
      Payment retry တိုင်းကို ပထမ response နဲ့ ပြန်ဖြေတယ် ဆိုတဲ့ idempotency key store ရဲ့ စည်းမျဉ်းက
      ရိုးရှင်းပါတယ်။ ပြဿနာက ပထမ response က error ဖြစ်နေရင်၊ retry မှာ ပမာဏ ပြောင်းလာရင်၊ ဒါမှမဟုတ်
      ရက်တွေ ကြာမှ ရောက်လာရင် ဘာလုပ်မလဲ ဆိုတာပါ။ [[mark:sel-claim]] ဒါက ပြီးခဲ့တဲ့ lesson ရဲ့ barrier ပါ၊
      operation တိုင်း သုံးလို့ရအောင် function တစ်ခုထဲ ရွှေ့ထားတာပါ။ key ကို အလုပ် မစခင် claim လုပ်ပြီး၊
      ရှိပြီးသား key ဆိုရင် သိမ်းထားတဲ့ response ကို ပြန်ပေးပါတယ်။ [[mark:open-main]] main ထဲမှာ payment
      နှစ်ခု ရှိပါတယ်။ [[mark:sel-down]] ပထမ တစ်ခုက provider ကျနေတုန်း ရောက်ပြီး၊ provider ပြန်ကောင်းမှ key
      အတူတူနဲ့ retry လုပ်ပါတယ်။ [[mark:sel-edit]] ဒုတိယ တစ်ခုက ယူရို ၂၅ ပေးပြီးမှ client က ပမာဏကို ၃၀
      လို့ ပြင်ပြီး key အဟောင်းနဲ့ ပြန်ပို့ပါတယ်။ [[mark:predict]] retry နှစ်ခုက ဘာပြန်ရမလဲ၊ run မလုပ်ခင်
      ခန့်မှန်းကြည့်ပါ။ [[mark:run-1]] run လိုက်ရအောင်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Idempotency (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#idempotency",
        }
    actions:
      - { id: open-idem, type: workspace.openFile, at: { scene: start }, path: idem.go }
      - id: sel-claim
        type: editor.select
        at: { mark: sel-claim }
        target:
          {
            file: idem.go,
            text: 'ks.rows[scope] = row{fingerprint, Response{409, "in progress"}, now}',
            occurrence: 1,
          }
      - { id: open-main, type: workspace.openFile, at: { mark: open-main }, path: main.go }
      - id: sel-down
        type: editor.select
        at: { mark: sel-down }
        target: { file: main.go, text: "s.providerDown = true", occurrence: 1 }
      - id: sel-edit
        type: editor.select
        at: { mark: sel-edit }
        target: { file: main.go, text: "p.Amount = 3000", occurrence: 1 }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "k-2 for 30.00:     201 tx-1",
          timeoutMs: 8000,
        }

  - id: read-1
    narration: >-
      [[mark:pt-503]] provider ပြန်ကောင်းနေပြီ ဖြစ်ပေမဲ့ retry က ပထမ error ကိုပဲ ပြန်ရပါတယ်။ store က error
      ကိုလည်း ရလဒ်လို့ သဘောထားပြီး replay လုပ်လို့ပါ။ [[mark:pt-30]] ပမာဏ ပြင်ထားတဲ့ request ကတော့ ယူရို
      ၂၅ ရဲ့ response ကို ပြန်ရပါတယ်။ [[mark:pt-bal]] ငွေကလည်း ၂၅ ပဲ ရွေ့ပါတယ်၊ client ကတော့ ၃၀
      ပေးပြီးပြီလို့ ထင်နေမှာပါ။ [[mark:dock-1]] နှစ်ခုလုံးက store ရဲ့ မူလ အပြုအမူပါ။ ပထမ တစ်ခုက ရွေးချယ်မှု
      တစ်ခု ဖြစ်ပေမဲ့၊ ဒုတိယ တစ်ခုကတော့ client ကို မှားတဲ့ အဖြေ ပေးနေတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Idempotency (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#idempotency",
        }
    actions:
      - id: pt-503
        type: console.point
        at: { mark: pt-503 }
        target: { text: "k-1 retry:", occurrence: 1 }
      - id: pt-30
        type: console.point
        at: { mark: pt-30 }
        target: { text: "k-2 for 30.00", occurrence: 1 }
      - id: pt-bal
        type: console.point
        at: { mark: pt-bal }
        target: { text: "user 1042: 75.00", occurrence: 1 }
      - { id: dock-1, type: runtime.collapseDock, at: { mark: dock-1 } }

  - id: errors
    chapter: Error ကို replay လုပ်မလား
    narration: >-
      [[mark:show-errors]] error ကို ရလဒ်လို့ သဘောထားပြီး replay လုပ်တာက ရိုးရှင်းပြီး client ဘက်က ဘာရမလဲ
      ကြိုသိနိုင်ပါတယ်။ client က ထပ်ကြိုးစားချင်ရင် key အသစ်နဲ့ ပို့ရုံပါပဲ။ ဒါပေမဲ့ error တိုင်း အတူတူ မဟုတ်ပါဘူး။
      [[mark:pt-e1]] အလုပ် မစခင် validation မှာ ငြင်းတာဆိုရင် ဘာမှ မဖြစ်ခဲ့လို့ replay လုပ်လုပ်၊ ပြန် run
      လုပ်လုပ် အဖြေ တူတူပါပဲ။ [[mark:errors-2]] အလုပ် စပြီးမှ ကိုယ့် code ထဲမှာ ကျသွားတာဆိုရင် တစ်ဝက်တစ်ပျက်
      ဖြစ်ခဲ့လား မသိလို့ သိမ်းထားတဲ့ error ကိုပဲ replay လုပ်တာ ပိုလုံခြုံပါတယ်။ [[mark:pt-stripe]] Stripe
      ရဲ့ API version တစ် ဆိုရင် ၅၀၀ error တွေကိုလည်း သိမ်းပြီး replay လုပ်ပါတယ်၊ parameter validation
      မအောင်တဲ့ request ကိုတော့ မသိမ်းပါဘူး။ [[mark:errors-3]] provider က ဒီ request ကို မလုပ်ဘူးလို့
      ရှင်းရှင်း ပြန်ပြောတဲ့ temporary error ဆိုရင်တော့ ဘာမှ မဖြစ်ခဲ့မှန်း သေချာလို့ ပြန် process လုပ်လို့
      ရနိုင်ပါတယ်။ [[mark:errors-4]] ခက်တာက timeout ပါ။ provider ဆီ ရောက်ခဲ့လား မသိတော့ ပြန် process
      လုပ်ရင် ငွေ နှစ်ခါ ဖြတ်နိုင်ပါတယ်။
    sources:
