  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] Idempotency key ကို ဘယ်လောက်ကြာ သိမ်းထားမလဲ၊ trade-off က ဘာလဲ ဆိုတာ
      မေးလေ့ရှိပါတယ်။ ၂၄ နာရီ လို့ ဂဏန်း တစ်ခုတည်း ဖြေရင် မလုံလောက်ပါဘူး။ အချက် သုံးချက်နဲ့ ဖြေပါ။
      [[mark:iv-a]] ပထမ၊ အမြဲ သိမ်းရင် မှန်ပေမဲ့ data က မဆုံးဘူး၊ window နဲ့ဆို ရိုးရှင်းပေမဲ့ window ပြီးမှ
      ရောက်တဲ့ retry က operation အသစ် ဖြစ်သွားတယ်။ [[mark:iv-b]] ဒုတိယ၊ window ကို client တွေ retry
      လုပ်နိုင်တဲ့ အရှည်ဆုံး ကာလထက် ရှည်အောင် ထားပြီး၊ backoff၊ queue၊ offline ဖြစ်နေတဲ့ app၊ လူက ပြန် run
      တာ အားလုံးကို ထည့်တွက်ရတယ်။ [[mark:iv-c]] တတိယ၊ ငွေရွေ့တဲ့ row ပေါ်မှာ key ကို unique constraint နဲ့
      အမြဲ ထားရင် cleanup ပြီးတာတောင် ငွေ နှစ်ခါ မရွေ့ဘူး။ [[mark:iv-d]] ပြီးရင် ကိုယ့် design ကို ပြောပါ။
      response cache ကို window နဲ့ ထားပြီး barrier ကို အမြဲ ထားမယ်၊ error ကို ဘယ်လို replay လုပ်မလဲ၊ payload
      မတူရင် ဘာလုပ်မလဲ ဆိုတာလည်း ဆုံးဖြတ်ထားကြောင်း ဆက်ပြောပါ။
    sources:
