  - id: try-it
    chapter: ကိုယ်တိုင် စမ်းကြည့်ပါ
    narration: >-
      [[mark:close-iv]] ကိုယ်တိုင် စမ်းကြည့်ဖို့ တစ်ခု ရှိပါတယ်။ [[mark:sel-try]] ဒီ line က key table ရဲ့
      window ပါ။ ၂၄ နာရီကို ၄၈ နာရီ လို့ ပြောင်းပြီး run ကြည့်ပါ။ ၂၅ နာရီ ကြာမှ ရောက်တဲ့ retry ကလည်း
      မူလ response ကို ပြန်ရပြီး available balance က ယူရို ၇၅ ပြန်ဖြစ်ပါလိမ့်မယ်။ ဒါပေမဲ့ ပြဿနာ ပျောက်သွားတာ
      မဟုတ်ဘဲ နယ်နိမိတ်ကို ရွှေ့လိုက်တာပဲ ဆိုတာ သတိထားပါ။ [[mark:recap]] ပြန်ချုပ်ရရင်၊ idempotency ရဲ့
      ခက်တဲ့ အပိုင်းက key ကို စစ်တာ မဟုတ်ဘဲ error၊ payload ပြောင်းတာ၊ state ပြောင်းသွားတာ၊ အချိန်ကြာတာ ဆိုတဲ့
      edge တွေမှာ ဘာလုပ်မလဲ ဆိုတာကို ကြိုဆုံးဖြတ်ထားတာပါ။ နောက် lesson မှာတော့ အဆင့် များတဲ့ flow တစ်ခုက
      အလယ်မှာ crash ဖြစ်သွားရင် ဘယ်လို ဆက်သွားမလဲ ဆိုတာ ကြည့်ပါမယ်၊ in progress မှာ တန်းလန်း ကျန်ခဲ့တဲ့ key
      လည်း အဲဒီ ပြဿနာရဲ့ တစ်စိတ်တစ်ပိုင်းပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Idempotency (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#idempotency",
        }
    actions:
      - { id: close-iv, type: slide.close, at: { mark: close-iv } }
      - {
          id: open-api,
          type: workspace.openFile,
          at: { mark: sel-try, offsetMs: -700 },
          path: api.go,
        }
      - id: sel-try
        type: editor.select
        at: { mark: sel-try }
        target: { file: api.go, text: "window: 24 * time.Hour", occurrence: 1 }

