      api.go: |
        package main

        import (
        	"fmt"
        	"time"
        )

        // Request is one call to the API. The client picks Key once per operation.
        type Request struct {
        	Client string
        	Key    string
        	From   string
        	To     string
        	Amount int64
        }

        // fingerprint is what the request asks for, everything but the key.
        func (r Request) fingerprint() string { return fmt.Sprint(r.From, r.To, r.Amount) }

        // Response is an HTTP status and a body.
        type Response struct {
        	Status int
        	Body   string
        }

        func (r Response) String() string { return fmt.Sprintf("%d %s", r.Status, r.Body) }

        // Server is the API: a ledger, holds on user 1042's funds, and one key table.
        type Server struct {
        	ledger       Ledger
        	keys         Keys
        	holds        map[string]int64
        	held         int64
        	now          time.Time
        	txs, nHolds  int
        	providerDown bool
        }

        func newServer() *Server {
        	s := &Server{holds: map[string]int64{}, now: time.Date(2026, 11, 2, 9, 0, 0, 0, time.UTC)}
        	s.keys = Keys{rows: map[string]row{}, window: 24 * time.Hour}
        	s.ledger.Post(Tx{ID: "deposit", Lines: []Line{
        		{Account: "asset:bank", Debit: 10000}, {Account: "liability:user:1042", Credit: 10000}}})
        	return s
        }

        // Pay moves money once per key. A provider that is down fails it with a 503.
        func (s *Server) Pay(r Request) Response {
        	return s.keys.Do(r.Client+"/pay/"+r.Key, r.fingerprint(), s.now, func() Response {
        		if s.providerDown {
        			return Response{503, "provider unavailable"}
        		}
        		s.txs++
        		id := fmt.Sprintf("tx-%d", s.txs)
        		s.ledger.Post(Tx{ID: id, Lines: []Line{
        			{Account: r.From, Debit: r.Amount}, {Account: r.To, Credit: r.Amount}}})
        		return Response{201, id}
        	})
        }

        // Hold reserves funds once per key; Release gives a hold's funds back.
        func (s *Server) Hold(r Request) Response {
        	return s.keys.Do(r.Client+"/hold/"+r.Key, r.fingerprint(), s.now, func() Response {
        		s.nHolds++
        		id := fmt.Sprintf("hold-%d", s.nHolds)
        		s.holds[id] = r.Amount
        		s.held += r.Amount
        		return Response{201, id}
        	})
        }

        func (s *Server) Release(id string) { s.held -= s.holds[id]; delete(s.holds, id) }

        // wait moves the clock on by some hours; the nightly key cleanup runs on the way.
        func (s *Server) wait(hours int) {
        	s.now = s.now.Add(time.Duration(hours) * time.Hour)
        	s.keys.prune(s.now)
        }

        // balance and available are user 1042's money: all of it, and what is not on hold.
        func (s *Server) balance() string { return cents(s.ledger.Balance("liability:user:1042")) }

        func (s *Server) available() string {
        	return cents(s.ledger.Balance("liability:user:1042") - s.held)
        }
      idem.go: |
        package main

        import "time"

        // row is one entry of the key table: (client, operation, key) → what happened.
        type row struct {
        	fingerprint string    // what the first request with this key asked for
        	resp        Response  // the saved response; 409 while the first call runs
        	at          time.Time // when the key was first seen
        }

        // Keys is lesson 20's barrier, moved into one place that every operation uses.
        type Keys struct {
        	rows   map[string]row
        	order  []string      // keys in the order they arrived, for the cleanup
        	window time.Duration // the cleanup forgets keys at least this old
        }

        // Do runs work once per scoped key and answers every repeat from the saved row.
        func (ks *Keys) Do(scope, fingerprint string, now time.Time, work func() Response) Response {
        	if saved, ok := ks.rows[scope]; ok {
        		return saved.resp
        	}
        	ks.rows[scope] = row{fingerprint, Response{409, "in progress"}, now}
        	ks.order = append(ks.order, scope)
        	resp := work()
        	ks.rows[scope] = row{fingerprint, resp, now}
        	return resp
        }

        // prune is the nightly cleanup: it forgets every key at least one window old.
        func (ks *Keys) prune(now time.Time) {
        	for _, k := range ks.order {
        		if saved, ok := ks.rows[k]; ok && now.Sub(saved.at) >= ks.window {
        			delete(ks.rows, k)
        		}
        	}
        }
      ledger.go: |
        package main

        import (
        	"fmt"
        	"strings"
        )

        // Line is one row of a transaction: an amount on the debit or the credit side of one account.
        type Line struct {
        	Account string
        	Debit   int64
        	Credit  int64
        }

        // Tx is one business event. All of its lines are posted together, or none of them.
        type Tx struct {
        	ID    string
        	Memo  string
        	Lines []Line
        }

        // Ledger is an append-only list of posted transactions. Balances are derived from it.
        type Ledger struct {
        	txs []Tx
        }

        // Post appends a transaction only if its debits equal its credits.
        func (l *Ledger) Post(tx Tx) error {
        	var debit, credit int64
        	for _, line := range tx.Lines {
        		debit += line.Debit
        		credit += line.Credit
        	}
        	if debit != credit {
        		return fmt.Errorf("tx %s is not balanced: debit %s, credit %s", tx.ID, cents(debit), cents(credit))
        	}
        	l.txs = append(l.txs, tx)
        	return nil
        }

        // kindOf reads the account type from the name: "asset:bank" is an asset.
        func kindOf(account string) string {
        	kind, _, _ := strings.Cut(account, ":")
        	return kind
        }

        // Balance derives an account's balance on the side where that kind of account grows:
        // assets and expenses grow with debits; liabilities, equity and revenue grow with credits.
        func (l *Ledger) Balance(account string) int64 {
        	var debit, credit int64
        	for _, tx := range l.txs {
        		for _, line := range tx.Lines {
        			if line.Account == account {
        				debit += line.Debit
        				credit += line.Credit
        			}
        		}
        	}
        	if kind := kindOf(account); kind == "asset" || kind == "expense" {
        		return debit - credit
        	}
        	return credit - debit
        }

        // cents prints minor units as an amount with two decimals: cents(1234) is "12.34".
        func cents(n int64) string {
        	sign := ""
        	if n < 0 {
        		sign, n = "-", -n
        	}
        	return fmt.Sprintf("%s%d.%02d", sign, n/100, n%100)
        }
      main.go: |
        package main

        import "fmt"

        func main() {
        	s := newServer()
        	p := Request{Client: "app", Key: "k-1", Amount: 2500,
        		From: "liability:user:1042", To: "liability:user:2077"}

        	s.providerDown = true
        	fmt.Println("k-1 provider down:", s.Pay(p))
        	s.providerDown = false
        	fmt.Println("k-1 retry:        ", s.Pay(p)) // the provider is back

        	p.Key = "k-2"
        	fmt.Println("k-2 for 25.00:    ", s.Pay(p))
        	p.Amount = 3000 // the client edits the amount and resends with the same key
        	fmt.Println("k-2 for 30.00:    ", s.Pay(p))
        	fmt.Println("user 1042:", s.balance())

        }
