  - id: both
    narration: >-
      [[mark:show-both]] ဒါကြောင့် idempotency က ခေါ်ခံရတဲ့ဘက်မှာတင် မဟုတ်ပါဘူး။ [[mark:pt-we]] client
      ဆီက key ကို ကိုယ်က dedupe လုပ်သလို၊ [[mark:both-2]] provider ကို ခေါ်တဲ့အခါ ကိုယ့် operation အလိုက်
      ထုတ်ထားတဲ့ key ကို ကိုယ်တိုင် ပို့ရပါတယ်။ [[mark:pt-why]] ဒါဆိုရင် timeout ပြီးလို့ ပြန် process
      လုပ်လည်း provider ဆီ key တူတူ ရောက်ပြီး၊ provider က အဲဒီ key ကို dedupe လုပ်ရင် ဒုတိယ charge မဖြစ်ပါဘူး။ operation တစ်ခုကို ခေါ်တိုင်း၊ API အဖြစ် ဖွင့်ပေးတိုင်း
      ဒီ နှစ်ဖက်လုံးကို စဉ်းစားရပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Idempotency (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#idempotency",
