# Fintech Engineering, lesson 21: the hard edges of idempotency (Burmese).
#
# Source: Fintech Engineering Handbook, "Idempotency" (errors, payload validation, time windows,
# testing, out-of-order retries, both sides) (CC BY 4.0, Voytek Pitula).
# Start state: idem.go is lesson 20's barrier moved into Keys.Do (claim first, replay the saved
# row; it stores a fingerprint but never compares it; prune forgets keys a window old). api.go has
# Pay (503 while the provider is down), Hold, Release and a 24-hour window. main.go: a payment
# failed by the provider and retried after it recovers; a payment resent with the same key and a
# new amount.
# Edits, all insert-only:
#   1. idem.go: compare the fingerprint            -> run-2: the 30.00 resend gets 422
#   2. main.go: hold h-1, release it, retry it late, then again 25 hours later
#                                                  -> run-3: replayed (75.00), then hold-2 (35.00)
# Figures: errors (which errors replay), both (keys on both sides), order (a retry after release),
# window (the pruned key; two layers), iv (the interview answer).
# Built by ~/Documents/fintech-course-work/tools/build-lesson.ts; fixtures by sim-go.ts --write.
