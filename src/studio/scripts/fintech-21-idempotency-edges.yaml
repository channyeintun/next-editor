  - id: payload
    chapter: Key တူ၊ request မတူ
    narration: >-
      [[mark:close-both]] ပမာဏ ပြင်ထားတဲ့ request ကို ပြန်ကြည့်ရအောင်။ [[mark:sel-fp]] row က ပထမ request
      ဘာတောင်းခဲ့လဲ ဆိုတဲ့ fingerprint ကို သိမ်းထားပြီးသားပါ၊ key မပါဘဲ request ထဲက ကျန်တာ အားလုံးပါ။ ဒါပေမဲ့
      retry ရောက်လာတဲ့အခါ အဲဒါကို မတိုက်ပါဘူး။ [[mark:type-fp]] သိမ်းထားတဲ့ row ရဲ့ fingerprint နဲ့ အခု request ရဲ့
      fingerprint မတူရင် response ကို replay မလုပ်ဘဲ unprocessable ဆိုတဲ့ error ပြန်ပေးပါမယ်။ ဒါဆိုရင်
      client က သူ့ request မှားနေမှန်း ချက်ချင်း သိပါတယ်။ [[mark:run-2]] run လိုက်ရအောင်။ [[mark:pt-422]]
      key ကို တခြား request အတွက် ပြန်သုံးတယ် ဆိုပြီး ငြင်းပါတယ်။ [[mark:dock-2]] Stripe ကလည်း ဒီလိုပဲ
      parameter တွေကို ပထမ request နဲ့ တိုက်ပြီး မတူရင် error ပြန်ပေးပါတယ်။ ဒါပေမဲ့ ဒီ check မှာ ကုန်ကျစရိတ်
      ရှိပါတယ်။ ဘယ် field တွေ ပါရမလဲ ဆုံးဖြတ်ရပြီး၊ client က ကောင်းတဲ့ အကြောင်းနဲ့ request ကို ပြင်ချင်တာကိုလည်း
      ပိတ်လိုက်ပါတယ်။ စစ်မလား မစစ်ဘူးလား ဆိုတာကို ဆုံးဖြတ်ချက်အဖြစ် ချထားပါ၊ code ထဲမှာ အလိုလို ဖြစ်နေတာမျိုး
      မဖြစ်ပါစေနဲ့။
    sources:
      - {
          title: "Fintech Engineering Handbook — Idempotency (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#idempotency",
        }
      - {
          title: "Stripe API reference — Idempotent requests",
          url: "https://docs.stripe.com/api/idempotent_requests",
        }
    actions:
      - { id: close-both, type: slide.close, at: { mark: close-both } }
      - {
          id: open-idem-2,
          type: workspace.openFile,
          at: { mark: sel-fp, offsetMs: -600 },
          path: idem.go,
        }
      - id: sel-fp
        type: editor.select
        at: { mark: sel-fp }
        target: { file: idem.go, text: "fingerprint string", occurrence: 1 }
      - id: type-fp
        type: editor.type
        at: { mark: type-fp }
        target: { file: idem.go, after: "\tif saved, ok := ks.rows[scope]; ok {\n", occurrence: 1 }
        text: "\t\tif saved.fingerprint != fingerprint {\n\t\t\treturn Response{422, \"key reused for a different request\"}\n\t\t}\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "422 key reused for a different request",
          timeoutMs: 8000,
        }
      - id: pt-422
        type: console.point
        at: { mark: pt-422 }
        target: { text: "422 key reused", occurrence: 1 }
      - { id: dock-2, type: runtime.collapseDock, at: { mark: dock-2 } }
      - {
          id: expect-file-fp,
          type: expect.file,
          at: { afterAction: run-2 },
          path: idem.go,
          contains: "if saved.fingerprint != fingerprint {",
        }

  - id: order
    chapter: State ပြောင်းပြီးမှ ရောက်တဲ့ retry
    narration: >-
      [[mark:show-order]] နောက်ထပ် ခက်တာက retry ရောက်လာချိန်မှာ system က နောက် state ကို ရောက်နေပြီ ဖြစ်တာပါ။
      [[mark:pt-hold]] flow တစ်ခုက key တစ်ခုနဲ့ ယူရို ၄၀ ကို hold လုပ်ခိုင်းပါတယ်။ [[mark:order-2]]
      အလုပ်ပြီးလို့ hold ကို release လုပ်ပြီးသွားပါပြီ။ [[mark:order-3]] အဲဒီနောက်မှ ပထမ hold request ရဲ့
      retry တစ်ခု ရောက်လာပါတယ်။ [[mark:pt-hit]] အခု state ကို ကြည့်ပြီး hold မရှိသေးလို့ အသစ် လုပ်လိုက်ရင်
      ဘယ် flow မှ မပိုင်တဲ့ hold တစ်ခုက user ရဲ့ ငွေကို ချုပ်ထားပါလိမ့်မယ်။ မှန်တဲ့ အဖြေက ဘာမှ မလုပ်ဘဲ
      မူလ response ကို ပြန်ပေးတာပါ။ ဆိုလိုတာက idempotency ကို အခု state နဲ့ မဆုံးဖြတ်ဘဲ key ရဲ့ မှတ်တမ်းနဲ့
      ဆုံးဖြတ်ရပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Idempotency (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#idempotency",
        }
    actions:
      - {
          id: show-order,
          type: slide.show,
          at: { mark: show-order, offsetMs: -700 },
          slideId: order-1,
        }
      - { id: pt-hold, type: slide.point, at: { mark: pt-hold }, target: { x: 0.648, y: 0.494 } }
      - { id: order-2, type: slide.show, at: { mark: order-2 }, slideId: order-2 }
      - {
          id: pt-rel,
          type: slide.point,
          at: { afterAction: order-2 },
          target: { x: 0.302, y: 0.578 },
        }
      - { id: order-3, type: slide.show, at: { mark: order-3 }, slideId: order-3 }
      - {
          id: pt-late-o,
          type: slide.point,
          at: { afterAction: order-3 },
          target: { x: 0.302, y: 0.744 },
        }
      - { id: pt-hit, type: slide.point, at: { mark: pt-hit }, target: { x: 0.475, y: 0.827 } }

  - id: late
    narration: >-
      [[mark:close-order]] Code နဲ့ စမ်းကြည့်ရအောင်။ [[mark:type-holds]] ယူရို ၄၀ ကို hold လုပ်ပြီး ချက်ချင်း
      release လုပ်ပါတယ်။ ပြီးတော့ hold request ကို key အတူတူနဲ့ နောက်ကျပြီး ပြန်ပို့ပါတယ်။ နောက်ဆုံး line
      နှစ်ကြောင်းက ၂၅ နာရီ စောင့်ပြီး၊ ညတိုင်း run တဲ့ key cleanup ပြီးသွားမှ အဲဒီ retry ကို ထပ်ပို့ပါတယ်။
      [[mark:run-3]] run လိုက်ရအောင်။ [[mark:pt-late]] release ပြီးမှ ရောက်လာတဲ့ retry က hold အသစ် မလုပ်ဘဲ
      မူလ response ကို ပြန်ရပြီး၊ available balance က ယူရို ၇၅ အပြည့် ရှိနေပါတယ်။ [[mark:pt-25h]] ၂၅ နာရီ
      ကြာမှ ရောက်တဲ့ retry ကတော့ hold အသစ် ဖြစ်သွားပြီး ယူရို ၄၀ ကို ဘယ်သူမှ release မလုပ်မယ့် hold က
      ချုပ်ထားပါတယ်။ [[mark:dock-3]] payment ဆိုရင် ဒါက ဒုတိယ charge ပါ။ ဘာကြောင့်လဲဆိုတော့ cleanup က
      window ထက် ဟောင်းတဲ့ key ကို ဖျက်လိုက်တော့ ဒီ retry က ပထမဆုံး request လို ဖြစ်သွားလို့ပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Idempotency (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#idempotency",
        }
    actions:
      - { id: close-order, type: slide.close, at: { mark: close-order } }
      - {
          id: open-main-2,
          type: workspace.openFile,
          at: { mark: type-holds, offsetMs: -600 },
          path: main.go,
        }
      - id: type-holds
        type: editor.type
        at: { mark: type-holds }
        target:
          { file: main.go, after: "\tfmt.Println(\"user 1042:\", s.balance())\n", occurrence: 1 }
        text: "\n\th := Request{Client: \"app\", Key: \"h-1\", From: \"liability:user:1042\", Amount: 4000}\n\ts.Release(s.Hold(h).Body) // the flow finishes and gives the funds back\n\tfmt.Println(\"h-1 late retry:\", s.Hold(h), \"  available:\", s.available())\n\ts.wait(25)\n\tfmt.Println(\"h-1 after 25h: \", s.Hold(h), \"  available:\", s.available())\n"
        cadence: line-by-line
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "h-1 after 25h:  201 hold-2",
          timeoutMs: 8000,
        }
      - id: pt-late
        type: console.point
        at: { mark: pt-late }
        target: { text: "h-1 late retry", occurrence: 1 }
      - id: pt-25h
        type: console.point
        at: { mark: pt-25h }
        target: { text: "h-1 after 25h", occurrence: 1 }
      - { id: dock-3, type: runtime.collapseDock, at: { mark: dock-3 } }

  - id: window
    chapter: Key ကို ဘယ်လောက်ကြာ ထားမလဲ
    narration: >-
      [[mark:show-window]] key တွေကို အမြဲ သိမ်းထားရင် data က ဘယ်တော့မှ မရပ်ဘဲ တိုးနေပါတယ်။ ဒါကြောင့်
      window တစ်ခု သတ်မှတ်ပြီး ဟောင်းတဲ့ key တွေကို ဖျက်ချင်စိတ် ဖြစ်ပါတယ်။ [[mark:window-2]] Stripe က ဒီ
      window ကို docs မှာ ရှင်းရှင်း ရေးထားပါတယ်။ [[mark:pt-stripe-w]] key ကို အနည်းဆုံး ၂၄ နာရီ ကြာမှ
      ဖျက်နိုင်ပြီး၊ ဖျက်ပြီးနောက် key တူတဲ့ request က request အသစ် ဖြစ်သွားပါတယ်။ [[mark:window-3]] ဆိုလိုတာက
      window ပြီးမှ ရောက်တဲ့ retry ကို system က duplicate လို့ မသိတော့ပါဘူး။ implementation ကို အများကြီး
      ရိုးရှင်းစေပေမဲ့ မှန်ကန်မှုကို ပေးလိုက်ရတာပါ၊ တကယ် မလွဲမရှောင်သာမှ ရွေးသင့်ပါတယ်။ [[mark:window-4]]
      လက်တွေ့မှာ အလွှာ နှစ်ခု ခွဲထားနိုင်ပါတယ်။ [[mark:pt-cache]] response ကို replay လုပ်ဖို့ key table က
      window နဲ့ ဖျက်လို့ ရပါတယ်။ [[mark:pt-row]] ငွေကို တကယ် ရွှေ့တဲ့ ledger row ပေါ်မှာ၊ ဒါမှမဟုတ် release
      လုပ်ပြီးလည်း မဖျက်ဘဲ released လို့ မှတ်ထားတဲ့ hold row ပေါ်မှာတော့ key ကို unique constraint နဲ့ အမြဲ
      ထားနိုင်ပါတယ်။ အဲဒီ row တွေက ဘယ်လိုမှ အမြဲ ရှိနေရမှာမို့ column တစ်ခုနဲ့ index တစ်ခုပဲ ပိုကုန်ပါတယ်။ [[mark:pt-inv]] ဒါဆိုရင် cleanup ပြီးတဲ့ late retry ကလည်း ငွေကို ဒုတိယ အကြိမ် မရွှေ့နိုင်တော့ပါဘူး၊ ဒါက
      ငွေကို မရှိဘဲ မဖန်တီးရဘူး ဆိုတဲ့ No invented data မူပါ။ [[mark:testing]] ဒီ edge တွေကို စစ်ဖို့
      integration test မှာ call တိုင်းကို နှစ်ခါ ပို့တဲ့ middleware ထည့်ပြီး ဒုတိယ call က ဘာမှ မပြောင်းစေဘူး
      ဆိုတာ assert လုပ်တာ အကျိုးရှိပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Idempotency (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#idempotency",
        }
      - {
          title: "Stripe API reference — Idempotent requests",
          url: "https://docs.stripe.com/api/idempotent_requests",
        }
      - {
          title: "Fintech Engineering Handbook — Testing (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#testing",
        }
    actions:
      - {
          id: show-window,
          type: slide.show,
          at: { mark: show-window, offsetMs: -700 },
          slideId: window-1,
        }
      - {
          id: pt-seen,
          type: slide.point,
          at: { afterAction: show-window },
          target: { x: 0.107, y: 0.584 },
        }
