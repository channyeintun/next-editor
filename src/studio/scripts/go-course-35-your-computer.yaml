# Go course, lesson 35: Go on your own computer (Burmese; the last lesson).
#
# Start state: digits.go (canonical from lesson 22: toMyanmarDigits, fromMyanmarDigits with an
# error) and main.go with only `import "fmt"` and an empty main.
# Edits, all insert-only:
#   1. a table of checks (in, want) and a loop that prints ok / FAIL -> run-1: three ok lines;
#   2. a case written with the letter ဝ for the digit zero -> run-2: FAIL ၁၅ဝဝ: got 0, want 1500;
#   3. the look-alike rule at the top of fromMyanmarDigits's loop -> run-3: four ok lines.
# Boards (the main content): (F) a folder on your own computer, go.mod and the commands;
# (T) the same check as digits_test.go and go test; (S) what to learn next; (Q) the quiz.
# Fixtures: bun ~/Documents/go-course-work/tools/sim-go.ts <this yaml> --write
schemaVersion: 1

