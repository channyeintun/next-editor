        package main

        import "fmt"

        func main() {
        }
      digits.go: |
        package main

        import (
        	"fmt"
        	"strconv"
        )

        // toMyanmarDigits writes n with Myanmar digits: 1500 → "၁၅၀၀".
        func toMyanmarDigits(n int) string {
        	digits := []rune(strconv.Itoa(n))
        	for i, r := range digits {
        		if r >= '0' && r <= '9' {
        			digits[i] = r - '0' + '၀'
        		}
        	}
        	return string(digits)
        }

        // fromMyanmarDigits reads Myanmar digits: "၁၅၀၀" → 1500.
        func fromMyanmarDigits(s string) (int, error) {
        	n := 0
        	for _, r := range s {
        		if r < '၀' || r > '၉' {
        			return 0, fmt.Errorf("%q is not a Myanmar digit", r)
        		}
        		n = n*10 + int(r-'၀')
        	}
        	return n, nil
        }
