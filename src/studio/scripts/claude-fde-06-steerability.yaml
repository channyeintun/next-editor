      ဥပမာနဲ့ format တို့နဲ့ ဦးတည်လို့ ရပါတယ်။ reply ရဲ့ လေသံ၊ အရှည်နဲ့ ပုံစံကို ပြောင်းနိုင်ပေမဲ့၊
