build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 5104
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "Predictive AI ဆိုတာ ဘာလဲ"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ menu search prototype ကို အမြန် ဆောက်ပြီး၊ customer တွေ
      ဘာရှာလဲ၊ ဘာ feedback ပေးလဲ ဆိုတာကို log ထဲမှာ မှတ်ခဲ့ပါတယ်။ ဒီ lesson ကစပြီး AI ရဲ့ intelligence
      အမျိုးအစား ပထမ တစ်ခု ဖြစ်တဲ့ predictive AI ကို လေ့လာပါမယ်။ [[mark:draw-mini]] blueprint မှာ
      ကြည့်ရင်၊ ဒီနေ့ အဓိက လုပ်မှာက Solution ထဲက data အလွှာပါ။ [[mark:draw-today]] predictive model ကို
      train မလုပ်ခင်၊ model သင်ယူလို့ ရတဲ့ ပုံစံ ဖြစ်အောင် data ကို အရင် ပြင်ဆင်ရလို့ပါ။
    sources:
      - {
          title: "web.dev Learn AI: Predictive AI: Turn data into insights",
          url: "https://web.dev/learn/ai/predictive",
        }
      - {
          title: "web.dev Learn AI: Introduction to AI on the web (the blueprint)",
          url: "https://web.dev/learn/ai/introduction",
        }
      - {
          title: "web.dev Learn AI: Welcome to Learn AI! (course credit: written by Dr. Janna Lipenkova with editorial guidance from Alexandra Klepper; text CC BY 4.0, code Apache 2.0; adapted into Burmese with the course's own tea-shop examples)",
          url: "https://web.dev/learn/ai/welcome",
        }
      - {
          title: "Creative Commons: Attribution 4.0 International (CC BY 4.0), the licence of the web.dev Learn AI text adapted here",
          url: "https://creativecommons.org/licenses/by/4.0/",
        }
    actions:
      - {
          id: open-board-a,
          type: whiteboard.apply,
          at: { scene: start, offsetMs: -450 },
          open: true,
          clear: true,
          upsertIds: [a-title],
        }
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - {
          id: draw-mini,
          type: whiteboard.apply,
          at: { mark: draw-mini },
          upsertIds:
            [
              a-opp,
              a-opp-t,
              a-arrow-1,
              a-data,
              a-data-t,
              a-intel,
              a-intel-t,
              a-ux,
              a-ux-t,
              a-arrow-2,
              a-gov,
              a-gov-t,
            ],
          drawMs: 2400,
        }
      - {
          id: draw-today,
          type: whiteboard.apply,
          at: { mark: draw-today },
          upsertIds: [a-today],
          drawMs: 1000,
        }

  - id: predictive
    narration: >
      [[mark:draw-tasks]] predictive AI ဆိုတာ ရှိပြီးသား data ကို နားလည်အောင် လုပ်ပြီး၊ နောက်
      ဘာဖြစ်လာနိုင်လဲ ခန့်မှန်းပေးတဲ့ AI ပါ။ အဓိက အလုပ် လေးမျိုး ရှိပါတယ်။ [[mark:draw-class]]
      classification က ကြိုသတ်မှတ်ထားတဲ့ အုပ်စုထဲ ခွဲထည့်တာပါ၊ ဥပမာ customer message တစ်ခုကို မေးခွန်းလား၊
      တိုင်ကြားတာလား၊ ချီးကျူးတာလား ခွဲတာမျိုးပါ။ [[mark:draw-reg]] regression ကတော့ ဂဏန်း တန်ဖိုး
      တစ်ခုကို ခန့်မှန်းတာ ဖြစ်ပြီး၊ မနက်ဖြန် မုန့်ဟင်းခါး ဘယ်နှပွဲ ရောင်းရမလဲ ဆိုတာမျိုးပါ။
      [[mark:draw-rec]] recommendation က အသင့်တော်ဆုံး item တွေကို အကြံပြုတာပါ၊ ဒါကို မှာတဲ့သူတွေ
      ဒါကိုလည်း မှာတတ်တယ် ဆိုတာမျိုးပါ။ [[mark:draw-fore]] forecasting က နောက်ဖြစ်လာမယ့် အရေအတွက်ကို
      ကြိုခန့်မှန်းတာ ဖြစ်ပြီး၊ anomaly detection က ပုံမှန် မဟုတ်တာကို ရှာတွေ့တာပါ။ တနင်္ဂနွေ မနက်
      လူများမလား ကြိုခန့်မှန်းတာ၊ ငွေ နှစ်ခါ ဖြတ်မိတာကို ဖမ်းမိတာ စတာတွေပါ။ [[mark:draw-ours]] ဒီနေ့
      ကိုယ်တို့ ပြဿနာက member တစ်ယောက် ဆိုင် ဆက်လာမလား မလာတော့ဘူးလား ဆိုတာ ဖြစ်လို့ classification ပါ။
      predictive AI ကို product ရဲ့ အဓိက အဖြစ်ရော၊ ရှိပြီးသား app ကို ပိုကောင်းအောင်ရော၊ ဆိုင်ထဲ
      အလုပ်တွေအတွက်ပါ သုံးနိုင်ပါတယ်။ ဒီလို model တွေကို များသောအားဖြင့် ကိုယ့် data နဲ့ ကိုယ်တိုင် train
      လုပ်ရတာမို့၊ တကယ့် project မှာ data science ကျွမ်းကျင်သူနဲ့ တွဲလုပ်ဖို့ လိုပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Predictive AI: Turn data into insights",
          url: "https://web.dev/learn/ai/predictive",
        }
    actions:
      - {
          id: draw-tasks,
          type: whiteboard.apply,
          at: { mark: draw-tasks },
          clear: true,
          upsertIds: [t-title],
        }
      - {
          id: draw-class,
          type: whiteboard.apply,
          at: { mark: draw-class },
          upsertIds: [t-c-box, t-c-name, t-c-ex1, t-c-ex2],
          drawMs: 1600,
        }
      - {
          id: draw-reg,
          type: whiteboard.apply,
          at: { mark: draw-reg },
          upsertIds: [t-r-box, t-r-name, t-r-ex1, t-r-ex2],
          drawMs: 1600,
        }
      - {
          id: draw-rec,
          type: whiteboard.apply,
          at: { mark: draw-rec },
          upsertIds: [t-m-box, t-m-name, t-m-ex1],
          drawMs: 1300,
        }
      - {
          id: draw-fore,
          type: whiteboard.apply,
          at: { mark: draw-fore },
          upsertIds: [t-f-box, t-f-name, t-f-ex1, t-f-ex2],
          drawMs: 1600,
        }
      - {
          id: draw-ours,
          type: whiteboard.apply,
          at: { mark: draw-ours },
          upsertIds: [t-ours, t-ours-ring],
          drawMs: 1400,
        }

  - id: loop
    narration: >
      [[mark:draw-loop]] predictive AI ကို ဆောက်တဲ့အခါ အဆင့်တွေကို အစဉ်လိုက် သွားပါတယ်။ use case ကို
      သတ်မှတ်၊ data ကို ပြင်ဆင်၊ model ကို train လုပ်ပြီး စစ်ပါတယ်။ ပြီးမှ deploy လုပ်ပြီး တကယ် သုံးပါတယ်။
      [[mark:draw-loop-back]] သုံးရင်း သင်ခန်းစာ ရလာရင် use case ကို ပြန်ကြည့်ပြီး ထပ်ပတ်တာမို့ loop လို့
      ခေါ်တာပါ။ [[mark:draw-loop-today]] ဒီနေ့ ပထမ နှစ်ဆင့်ကို လုပ်ပြီး၊ ကျန်တဲ့ အဆင့်တွေကို နောက် lesson
      မှာ ဆက်လုပ်ပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Predictive AI: Turn data into insights (the predictive AI loop)",
          url: "https://web.dev/learn/ai/predictive",
        }
    actions:
      - {
          id: draw-loop,
          type: whiteboard.apply,
          at: { mark: draw-loop },
          clear: true,
          upsertIds:
            [
              l-title,
              l-define,
              l-define-t,
              l-a1,
              l-data,
              l-data-t,
              l-a2,
              l-train,
              l-train-t,
              l-a3,
              l-eval,
              l-eval-t,
              l-a4,
              l-deploy,
              l-deploy-t,
            ],
          drawMs: 3500,
        }
      - {
          id: draw-loop-back,
          type: whiteboard.apply,
          at: { mark: draw-loop-back },
          upsertIds: [l-back],
          drawMs: 900,
        }
      - {
          id: draw-loop-today,
          type: whiteboard.apply,
          at: { mark: draw-loop-today },
          upsertIds: [l-today, l-next],
          drawMs: 1000,
        }

  - id: define
    chapter: "Use case ကို သတ်မှတ်ရအောင်"
    narration: >
      [[mark:draw-define]] ကိုယ်တို့ ဆိုင်မှာ ရွှေ member တချို့ တဖြည်းဖြည်း မလာကြတော့ပါဘူး။ အခုတော့
      ပျောက်သွားမှပဲ သိရပါတယ်။ [[mark:draw-goal]] ဒါကြောင့် ရည်မှန်းချက်က မလာတော့မယ့် member ကို စောစော
      သိပြီး၊ ကောင်တာက လှလှ က လက်ဖက်ရည် တစ်ခွက် လက်ဆောင် ပေးတာ၊ စကား တစ်ခွန်း နှုတ်ဆက်တာ
      လုပ်နိုင်ဖို့ပါ။ [[mark:draw-io]] input က member တွေ ဆိုင်လာတာ၊ မှာတာ data ဖြစ်ပြီး၊ output က
      member တစ်ယောက်ချင်း နောက်လ မလာတော့နိုင်တဲ့ ဖြစ်နိုင်ခြေပါ။ [[mark:draw-user]] အဲဒီ
      ခန့်မှန်းချက်ကို သုံးမှာက လှလှ ဖြစ်ပြီး၊ သုံးလ ကြာရင် member တွေ ပိုကျန်နေတာကို အောင်မြင်မှုလို့
      ဆိုင်ပိုင်ရှင် မြမြ က သတ်မှတ်ထားပါတယ်။ [[mark:draw-trap]] ဒါတွေကို customer တွေကို အသိဆုံး လှလှ နဲ့ မြမြ နဲ့ အတူ
      အစကတည်းက သတ်မှတ်ပြီး၊ ရှိပြီးသား data နဲ့ ဒီ မေးခွန်းကို ဖြေလို့ ရလား ဆိုတာလည်း စစ်ရပါမယ်။
      မဟုတ်ရင် နည်းပညာအရ ကောင်းပေမယ့် ဘယ်သူမှ မသုံးတဲ့ model ဖြစ်သွားတတ်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Predictive AI: Turn data into insights (define your use case)",
          url: "https://web.dev/learn/ai/predictive",
        }
    actions:
      - {
          id: draw-define,
          type: whiteboard.apply,
          at: { mark: draw-define },
          clear: true,
          upsertIds: [u-title],
        }
      - {
          id: draw-goal,
          type: whiteboard.apply,
          at: { mark: draw-goal },
          upsertIds: [u-goal-l, u-goal],
          drawMs: 1200,
        }
      - {
          id: draw-io,
          type: whiteboard.apply,
          at: { mark: draw-io },
          upsertIds: [u-in-l, u-in, u-out-l, u-out],
          drawMs: 1600,
        }
      - {
          id: draw-user,
          type: whiteboard.apply,
          at: { mark: draw-user },
          upsertIds: [u-user-l, u-user, u-ok-l, u-ok],
          drawMs: 1600,
        }
      - {
          id: draw-trap,
          type: whiteboard.apply,
          at: { mark: draw-trap },
          upsertIds: [u-trap, u-trap-x],
          drawMs: 1500,
        }

  - id: data
    chapter: "Data ကို ကြည့်ရအောင်"
    narration: >
      [[mark:close-define]] ဒါဆို data ကို ကြည့်ရအောင်။ [[mark:panel-ready]] ညာဘက် AI panel မှာ member
      data ကို စစ်ထားတဲ့ ရလဒ် ပေါ်လာပါပြီ။ ဒီ data က lesson အတွက် ပြင်ဆင်ထားတဲ့ နမူနာ data ပါ။ ပြီးခဲ့တဲ့
      လကုန်မှာ ထုတ်ထားတဲ့ member စာရင်းမို့၊ member တစ်ယောက်ချင်းစီအတွက် row တစ်ကြောင်း ရှိပါတယ်။ data
      ပြင်ဆင်တဲ့ အဆင့်မှာ model မလိုသေးလို့၊ card ရဲ့ badge ကလည်း AI မပါဘူးလို့ ပြနေပါတယ်။
      [[mark:open-main]] program က member row တွေကို ယူပြီး၊ [[mark:sel-show]] အောက်ဆုံးက function နဲ့
      data အခြေအနေကို panel မှာ ပြပါတယ်။ ပြင်ဆင်တဲ့ အဆင့်တွေကို ဒီ နှစ်ကြောင်းကြားမှာ တစ်ကြောင်းစီ
      ထည့်သွားပါမယ်။ [[mark:read-member]] Member card မှာ member တစ်ယောက်ရဲ့ row ကို column အလိုက်
      ပြထားပါတယ်။ အောက်ဆုံးက stopped က label ပါ။ label ဆိုတာ data row တစ်ကြောင်းချင်းမှာ မှန်တဲ့ အဖြေကို
      ကပ်ထားတာ ဖြစ်ပြီး၊ နောက် ရက် ၃၀ အတွင်း မလာတော့ရင် တစ်၊ လာသေးရင် သုည ပါ။ ဒီ member က တိုင်ကြားတာ ၄ ခါ
      ရှိပေမယ့် ဆက်လာနေတာကိုလည်း မှတ်ထားပါ။ [[mark:read-check]] Data check card ကတော့ ပြဿနာတွေကို
      ရေတွက်ထားပါတယ်။ row ၁၆၀ ထဲမှာ township ကို အင်္ဂလိပ် စာလုံးနဲ့ ရေးထားတာ ၆ ကြောင်း၊ township မပါတာ ၄
      ကြောင်း၊ ပျမ်းမျှ အော်ဒါ ငွေကို စာသားအဖြစ် ရေးထားတာ ၃ ကြောင်း ရှိပါတယ်။ ဒီ data တချို့ကို ကောင်တာက
      မှတ်စုထဲကနေ လက်နဲ့ ပြန်ရိုက်ထည့်ထားလို့ပါ။ website က အလိုလို မှတ်တဲ့ data ကတော့ ဒီလောက် မရှုပ်ပါဘူး။
    sources:
      - {
          title: "web.dev Learn AI: Predictive AI: Turn data into insights (prepare the data)",
          url: "https://web.dev/learn/ai/predictive",
        }
    actions:
      - { id: close-define, type: whiteboard.apply, at: { mark: close-define }, open: false }
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-done
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: ai-status }
        attribute: { name: data-state, value: "done" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-two-cards
        type: expect.preview
        at: { afterAction: expect-done }
        timeoutMs: 5000
        target: { by: testId, value: ai-cards }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - { id: open-main, type: workspace.openFile, at: { mark: open-main }, path: src/main.js }
      - id: sel-rows
        type: editor.select
        at: { afterAction: open-main }
        target: { file: src/main.js, text: "let rows = data.rows;", occurrence: 1 }
      - id: sel-show
        type: editor.select
        at: { mark: sel-show }
        target: { file: src/main.js, text: "showData(rows);", occurrence: 1 }
      - id: expect-member-rows
        type: expect.preview
        at: { mark: read-member }
        timeoutMs: 5000
        target: { by: testId, value: ai-member }
        attribute: { name: data-count, value: "10" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-member-label
        type: expect.preview
        at: { afterAction: expect-member-rows }
        timeoutMs: 5000
        target: { by: testId, value: ai-member-10 }
        textContains: "stopped0"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-member-complaints
        type: expect.preview
        at: { afterAction: expect-member-label }
        timeoutMs: 5000
        target: { by: testId, value: ai-member-9 }
        textContains: "complaints_90d4"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-rows-160
        type: expect.preview
        at: { mark: read-check }
        timeoutMs: 5000
        target: { by: testId, value: ai-check-1 }
        attribute: { name: data-value, value: "160" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-latin-6
        type: expect.preview
        at: { afterAction: expect-rows-160 }
        timeoutMs: 5000
        target: { by: testId, value: ai-check-2 }
        attribute: { name: data-value, value: "6" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-missing-4
        type: expect.preview
        at: { afterAction: expect-latin-6 }
        timeoutMs: 5000
        target: { by: testId, value: ai-check-3 }
        attribute: { name: data-value, value: "4" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-text-3
        type: expect.preview
        at: { afterAction: expect-missing-4 }
        timeoutMs: 5000
        target: { by: testId, value: ai-check-4 }
        attribute: { name: data-value, value: "3" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: clean
    chapter: "Data ကို သန့်ရှင်းအောင် လုပ်ရအောင်"
    narration: >
      [[mark:type-dups]] ပထမဆုံး တစ်ထပ်တည်း ကျနေတဲ့ row တွေကို ဖယ်ပါမယ်။ [[mark:read-dups]] row က ၁၆၀ ကနေ
      ၁၅၈ ဖြစ်သွားပါပြီ။ ကောင်တာမှာ member နှစ်ယောက်ကို နှစ်ခါစီ ရိုက်ထည့်မိခဲ့လို့ပါ။
      [[mark:type-normalize]] နောက်တစ်ဆင့်က township နာမည်တွေကို တစ်မျိုးတည်း ဖြစ်အောင် ညှိတာပါ။ အင်္ဂလိပ်
      စာလုံးနဲ့ ရေးထားတာတွေကို website မှာ သုံးတဲ့ မြန်မာ စာလုံး အဖြစ် ပြောင်းပေးတဲ့ စာရင်းကို သုံးပါမယ်။
      [[mark:read-normalize]] အင်္ဂလိပ် စာလုံးနဲ့ ရေးထားတဲ့ township သုည ဖြစ်သွားပြီး၊ member card မှာလည်း
      မြန်မာလို ဗဟန်း ဖြစ်သွားပါပြီ။ မဟုတ်ရင် စာလုံးပေါင်း မတူတာနဲ့ပဲ ဗဟန်း က မြို့နယ် နှစ်ခု ဖြစ်နေမှာပါ။
      [[mark:type-fill]] township မပါတဲ့ row လေးကြောင်းမှာတော့ မသိ ဆိုတဲ့ တန်ဖိုး ဖြည့်ပါမယ်။ row ကို
      ဖျက်လိုက်ရင် အဲဒီ member တွေရဲ့ တခြား data ပါ ဆုံးရှုံးမှာမို့လို့ပါ။ [[mark:read-fill]] township
      မပါတာ သုည ဖြစ်သွားပါပြီ။ [[mark:type-number]] အော်ဒါ ငွေကို စာသားအဖြစ် ရေးထားတဲ့ row တွေကိုလည်း
      ဂဏန်း ပြောင်းပါမယ်။ [[mark:read-number]] member card မှာ အော်ဒါ ငွေက ကော်မာ မပါတဲ့ ဂဏန်း
      ဖြစ်သွားပြီး၊ စာသားအဖြစ် ရေးထားတာလည်း မကျန်တော့ပါဘူး။
    sources:
      - {
          title: "web.dev Learn AI: Predictive AI: Turn data into insights (prepare the data)",
          url: "https://web.dev/learn/ai/predictive",
        }
    actions:
      - id: type-dups
        type: editor.type
        at: { mark: type-dups }
        target:
          {
            file: src/main.js,
            after: "// Steps that prepare the data, one line each:\n",
            occurrence: 1,
          }
        text: "rows = dropDuplicates(rows);\n"
        cadence: line-by-line
      - id: expect-rows-158
        type: expect.preview
        at: { afterAction: type-dups }
        timeoutMs: 8000
        target: { by: testId, value: ai-check-1 }
        attribute: { name: data-value, value: "158" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-normalize
        type: editor.type
        at: { mark: type-normalize }
        target: { file: src/main.js, after: "rows = dropDuplicates(rows);\n", occurrence: 1 }
        text: "rows = normalize(rows, \"township\", TOWNSHIP_SPELLINGS);\n"
        cadence: line-by-line
      - id: expect-latin-0
        type: expect.preview
        at: { afterAction: type-normalize }
        timeoutMs: 8000
        target: { by: testId, value: ai-check-2 }
        attribute: { name: data-value, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-member-township
        type: expect.preview
        at: { afterAction: expect-latin-0 }
        timeoutMs: 5000
        target: { by: testId, value: ai-member-3 }
        textContains: "townshipဗဟန်း"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-fill
        type: editor.type
        at: { mark: type-fill }
        target:
          {
            file: src/main.js,
            after: "rows = normalize(rows, \"township\", TOWNSHIP_SPELLINGS);\n",
            occurrence: 1,
          }
        text: "rows = fillMissing(rows, \"township\", \"မသိ\");\n"
        cadence: line-by-line
      - id: expect-missing-0
        type: expect.preview
        at: { afterAction: type-fill }
        timeoutMs: 8000
        target: { by: testId, value: ai-check-3 }
        attribute: { name: data-value, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-number
        type: editor.type
        at: { mark: type-number }
        target:
          {
            file: src/main.js,
            after: "rows = fillMissing(rows, \"township\", \"မသိ\");\n",
            occurrence: 1,
          }
        text: "rows = toNumber(rows, \"avg_order_kyat\");\n"
        cadence: line-by-line
      - id: expect-text-0
        type: expect.preview
        at: { afterAction: type-number }
        timeoutMs: 8000
        target: { by: testId, value: ai-check-4 }
        attribute: { name: data-value, value: "0" }
