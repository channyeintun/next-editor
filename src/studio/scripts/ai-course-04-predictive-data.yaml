  - id: features
    chapter: "Input feature ရွေးရအောင်"
    narration: >
      data သန့်သွားပြီဆိုရင် model ကို ဘယ် column တွေနဲ့ သင်ပေးမလဲ ရွေးရပါမယ်။ model ကို သင်ပေးဖို့
      ရွေးထားတဲ့ column တစ်ခုကို input feature လို့ ခေါ်ပါတယ်။ ဆိုင်လာတဲ့ အကြိမ်၊ နောက်ဆုံး လာခဲ့တာ
      ဘယ်နှရက် ရှိပြီလဲ၊ delivery နဲ့ မှာတဲ့ အချိုး၊ တိုင်ကြားတဲ့ အကြိမ် လို column တွေကို လှလှ နဲ့
      တိုင်ပင်ပြီး ရွေးထားပါတယ်။ မဆိုင်တဲ့ column တွေကတော့ model ကို ရှုပ်စေတဲ့ noise ပဲ ဖြစ်လို့ model
      ကို မပေးပါဘူး။ [[mark:type-phone]] ဖုန်းနံပါတ်ကတော့ PII ပါ။ PII ဆိုတာ နာမည်၊ ဖုန်းနံပါတ်၊ လိပ်စာ လို
      လူ တစ်ယောက်ကို ခွဲခြား သိနိုင်တဲ့ ကိုယ်ရေး အချက်အလက်ပါ။ member ဆက်လာမလာ ခန့်မှန်းဖို့ ဖုန်းနံပါတ်
      မလိုလို့ ဖယ်ထုတ်ပါမယ်။ [[mark:read-phone]] column က ၁၀ ကနေ ၉ ဖြစ်သွားပြီး၊ member card ထဲက
      ဖုန်းနံပါတ်လည်း ပျောက်သွားပါပြီ။ ကျန်တာက လာတာ၊ မှာတာကို ရေတွက်ပြီး စုထားတဲ့ data တွေပါ။ township
      ကိုတော့ အခုထိ ထားထားပြီး fairness lesson မှာ ပြန်ကြည့်ပါမယ်။ [[mark:type-encode]] နောက်ဆုံး model က
      ဂဏန်းနဲ့ပဲ တွက်လို့၊ card နဲ့ app ဆိုတဲ့ member အမျိုးအစားကိုလည်း သုည နဲ့ တစ် ပြောင်းပါမယ်။
      [[mark:read-encode]] member card မှာ member အမျိုးအစားက သုည ဖြစ်သွားပါပြီ။
    sources:
      - {
          title: "web.dev Learn AI: Predictive AI: Turn data into insights (prepare the data: features, PII, categories)",
          url: "https://web.dev/learn/ai/predictive",
        }
    actions:
      - id: type-phone
        type: editor.type
        at: { mark: type-phone }
        target:
          {
            file: src/main.js,
            after: "rows = toNumber(rows, \"avg_order_kyat\");\n",
            occurrence: 1,
          }
        text: "rows = dropColumn(rows, \"phone\");\n"
        cadence: line-by-line
      - id: expect-columns-9
        type: expect.preview
        at: { afterAction: type-phone }
        timeoutMs: 8000
        target: { by: testId, value: ai-check-5 }
        attribute: { name: data-value, value: "9" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-member-9
        type: expect.preview
        at: { afterAction: expect-columns-9 }
        timeoutMs: 5000
        target: { by: testId, value: ai-member }
        attribute: { name: data-count, value: "9" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-encode
        type: editor.type
        at: { mark: type-encode }
        target: { file: src/main.js, after: "rows = dropColumn(rows, \"phone\");\n", occurrence: 1 }
        text: "rows = encode(rows, \"member_type\", { card: 0, app: 1 });\n"
        cadence: line-by-line
      - id: expect-member-type
        type: expect.preview
        at: { afterAction: type-encode }
        timeoutMs: 8000
        target: { by: testId, value: ai-member-3 }
        textContains: "member_type0"
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: split
    chapter: "Data ကို သုံးပုံ ခွဲရအောင်"
    narration: >
      [[mark:draw-sets]] ပြင်ဆင်ပြီးသား data ကို အပိုင်း သုံးပိုင်း ခွဲပါမယ်။ training set က model ကို
      သင်ပေးတဲ့ data ဖြစ်ပြီး ၇၀ ရာခိုင်နှုန်း ယူပါမယ်။ training အတွက် ၇၀ ကနေ ၈၀ ရာခိုင်နှုန်းလောက်
      ယူလေ့ ရှိပါတယ်။ [[mark:draw-val]] validation set က setting တွေ ညှိဖို့ ခွဲထားတဲ့ data ဖြစ်ပြီး ၁၀
      ရာခိုင်နှုန်း ပါ။ [[mark:draw-test]] test set ကတော့ နောက်ဆုံး စစ်ဖို့ model ကို လုံးဝ မပြထားတဲ့
      data ဖြစ်ပြီး ၂၀ ရာခိုင်နှုန်း ပါ။ [[mark:close-sets]] code မှာ ခွဲကြည့်ရအောင်။
      [[mark:type-split]] split function က row တွေကို ကျပန်း ရောပြီး ခွဲပေမယ့်၊ seed ဆိုတဲ့ ဂဏန်း ပုံသေ
      ပေးထားလို့ run တိုင်း အတူတူ ခွဲပေးပါတယ်။ [[mark:read-split]] Split card မှာ training ၁၁၁ ယောက်၊
      validation ၁၆ ယောက်၊ test ၃၁ ယောက် ဆိုပြီး ပေါ်လာပါပြီ။ ဒီလို ခွဲထားလို့ model က train data ကို
      အလွတ်ကျက်ထားသလို ဖြစ်နေလား၊ မမြင်ဖူးသေးတဲ့ member တွေမှာလည်း မှန်မှန် ခန့်မှန်းနိုင်လား ဆိုတာ
      စစ်လို့ ရပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Predictive AI: Turn data into insights (split your dataset)",
          url: "https://web.dev/learn/ai/predictive",
        }
    actions:
      - {
          id: draw-sets,
          type: whiteboard.apply,
          at: { mark: draw-sets },
          open: true,
          clear: true,
          upsertIds: [s-title, s-train, s-train-t, s-train-p, s-train-d],
          drawMs: 1800,
        }
      - {
          id: draw-val,
          type: whiteboard.apply,
          at: { mark: draw-val },
          upsertIds: [s-val, s-val-t, s-val-p, s-val-d],
          drawMs: 1400,
        }
      - {
          id: draw-test,
          type: whiteboard.apply,
          at: { mark: draw-test },
          upsertIds: [s-test, s-test-t, s-test-p, s-test-d, s-unseen],
          drawMs: 1800,
        }
      - { id: close-sets, type: whiteboard.apply, at: { mark: close-sets }, open: false }
      - id: type-split
        type: editor.type
        at: { mark: type-split }
        target:
          {
            file: src/main.js,
            after: "rows = encode(rows, \"member_type\", { card: 0, app: 1 });\n",
            occurrence: 1,
          }
        text: "const sets = split(rows, { seed: 5104 });\nshowSplit(sets);\n"
        cadence: line-by-line
      - id: expect-three-cards
        type: expect.preview
        at: { afterAction: type-split }
        timeoutMs: 8000
        target: { by: testId, value: ai-cards }
        attribute: { name: data-count, value: "3" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-train-111
        type: expect.preview
        at: { afterAction: expect-three-cards }
        timeoutMs: 5000
        target: { by: testId, value: ai-split-1 }
        attribute: { name: data-value, value: "111" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-val-16
        type: expect.preview
        at: { afterAction: expect-train-111 }
        timeoutMs: 5000
        target: { by: testId, value: ai-split-2 }
        attribute: { name: data-value, value: "16" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-test-31
        type: expect.preview
        at: { afterAction: expect-val-16 }
        timeoutMs: 5000
        target: { by: testId, value: ai-split-3 }
        attribute: { name: data-value, value: "31" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: quiz
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ model ကို train လုပ်တဲ့အခါ test set ကို ဘာကြောင့် လုံးဝ မပြဘဲ
      ဖယ်ထားရတာလဲ။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] အဖြေကတော့ model က data
      အသစ်မှာလည်း မှန်လား စစ်ဖို့ပါ။ ဘာကြောင့်လဲဆိုတော့ train တုန်းက မြင်ဖူးတဲ့ row တွေနဲ့ စစ်ရင်၊ အဲဒီ
      row တွေကို အလွတ်ကျက်ထားသလို ဖြစ်နေတာကို မသိနိုင်လို့ပါ။
    sources:
      - {
          title: "web.dev Learn AI: Predictive AI: Turn data into insights (Check your understanding)",
          url: "https://web.dev/learn/ai/predictive",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [z-title, z-q1, z-q2],
          drawMs: 1500,
        }
      - {
          id: draw-quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [z-a, z-a-note],
          drawMs: 1800,
        }

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ predictive AI က ရှိပြီးသား data ကနေ နောက် ဖြစ်လာနိုင်တာကို
      ခန့်မှန်းပေးပြီး၊ define ကနေ deploy အထိ loop နဲ့ ဆောက်ပါတယ်။ use case ကို ရည်မှန်းချက်၊ input၊
      output၊ သုံးမယ့်သူနဲ့ အောင်မြင်မှု စံ နဲ့ အရင် သတ်မှတ်ရပါမယ်။ [[mark:sel-steps]] ပြီးတော့ data ကို
      သန့်ရှင်းအောင် လုပ်တာ၊ PII ကို ဖယ်တာ၊ အမျိုးအစားတွေကို ဂဏန်း ပြောင်းတာ လုပ်ပြီး၊
      [[mark:sel-split]] training၊ validation၊ test ဆိုပြီး ခွဲရပါမယ်။ နောက် lesson မှာတော့ ဒီ data နဲ့
      model ကို train ပြီး evaluate လုပ်တာကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Predictive AI: Turn data into insights",
          url: "https://web.dev/learn/ai/predictive",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: recap }, open: false }
      - id: sel-steps
        type: editor.select
        at: { mark: sel-steps }
        target:
          {
            file: src/main.js,
            text: "rows = dropDuplicates(rows);\nrows = normalize(rows, \"township\", TOWNSHIP_SPELLINGS);\nrows = fillMissing(rows, \"township\", \"မသိ\");\nrows = toNumber(rows, \"avg_order_kyat\");\nrows = dropColumn(rows, \"phone\");\nrows = encode(rows, \"member_type\", { card: 0, app: 1 });\n",
            occurrence: 1,
          }
      - id: sel-split
        type: editor.select
        at: { mark: sel-split }
        target:
          { file: src/main.js, text: "const sets = split(rows, { seed: 5104 });", occurrence: 1 }
      - {
          id: expect-final-steps,
          type: expect.file,
          at: { afterAction: sel-split },
          path: src/main.js,
          contains: "rows = dropColumn(rows, \"phone\");\nrows = encode(rows, \"member_type\", { card: 0, app: 1 });\nconst sets = split(rows, { seed: 5104 });\nshowSplit(sets);\n",
        }
checks:
  - { type: timing.p95Ms, max: 300 }
