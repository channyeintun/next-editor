  - id: loop-read
    chapter: Vec ကို loop ပတ်ခြင်း
    narration: >-
      [[mark:type-sum]] element တိုင်းကို တစ်ခုချင်း သွားချင်ရင် for loop ကို သုံးပါတယ်။ ဒီမှာ Vec
      ရဲ့ reference ကို loop ပတ်ပြီး၊ score အားလုံးကို total ထဲ ပေါင်းထည့်သွားပါမယ်။
      [[mark:select-ref]] scores ရှေ့က ampersand က scores ကို borrow လုပ်တာ ဖြစ်လို့၊ loop က
      ဖတ်ရုံပဲ ဖတ်ပါတယ်။ ampersand မပါဘဲ ရေးမိရင်တော့၊ loop က scores ရဲ့ ownership ကို ယူသွားပြီး၊
      loop ပြီးတဲ့နောက် scores ကို ပြန်သုံးလို့ မရတော့ပါဘူး။ [[mark:select-star]] ဒီလို reference
      ကို loop ပတ်တဲ့အခါ၊ loop တစ်ကြိမ်ချင်းစီမှာ ရတဲ့ score ကလည်း reference တစ်ခု ဖြစ်တဲ့အတွက်၊
      ရှေ့က star က အဲဒီ reference ညွှန်ထားတဲ့ ကိန်းဂဏန်းကို ဖတ်ပေးတာပါ။
    sources:
      - title: "The Rust Book — Iterating Over the Values in a Vector"
        url: "https://doc.rust-lang.org/book/ch08-01-vectors.html#iterating-over-the-values-in-a-vector"
      - title: "The Rust Reference — Dereference expressions"
        url: "https://doc.rust-lang.org/reference/expressions/operator-expr.html#the-dereference-operator"
    actions:
      - id: close-board-ref
        type: whiteboard.apply
        at: { scene: start, offsetMs: -400 }
        open: false
      - id: type-sum
        type: editor.type
        at: { mark: type-sum }
        target:
          file: main.rs
          after: "        None => println!(\"nobody at index 5\"),

            \    }\n"
          occurrence: 1
        cadence: line-by-line
        text: "

          \    let mut total = 0;

          \    for score in &scores {

          \        total += *score;

          \    }

          \    println!(\"total: {total}\");\n"
      - id: select-ref
        type: editor.select
        at: { mark: select-ref }
        target:
          file: main.rs
          text: "&scores"
          occurrence: 1
      - id: select-star
        type: editor.select
        at: { mark: select-star }
        target:
          file: main.rs
          text: "*score"
          occurrence: 1

  - id: loop-write
    narration: >-
      [[mark:type-bonus]] element တိုင်းကို ပြောင်းချင်ရင်တော့၊ ဒီတစ်ခါ mutable reference ကို loop
      ပတ်ပါမယ်။ score တိုင်းကို bonus 5 စီ ပေါင်းပေးကြည့်ရအောင်။ [[mark:select-mut-ref]] ampersand
      mut ဖြစ်သွားတော့၊ loop တစ်ကြိမ်ချင်းစီမှာ ရတဲ့ score က mutable reference တစ်ခု ဖြစ်သွားပါတယ်။
      ဒါကြောင့် ဒီတစ်ခါ star က ဖတ်ရုံ မဟုတ်ဘဲ၊ reference ကနေ တစ်ဆင့် ပြန်ရေးပေးတာ ဖြစ်ပြီး၊ Vec ထဲက
      score ကိုယ်တိုင်ကို 5 ပေါင်းပေးလိုက်တာပါ။
    sources:
      - title: "The Rust Book — Iterating Over the Values in a Vector"
        url: "https://doc.rust-lang.org/book/ch08-01-vectors.html#iterating-over-the-values-in-a-vector"
    actions:
      - id: type-bonus
        type: editor.type
        at: { mark: type-bonus, offsetMs: -200 }
        target:
          file: main.rs
          after: "    println!(\"total: {total}\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "

          \    for score in &mut scores {

          \        *score += 5;

          \    }

          \    println!(\"with bonus: {scores:?}\");\n"
      - id: select-mut-ref
        type: editor.select
        at: { mark: select-mut-ref }
        target:
          file: main.rs
          text: "&mut scores"
          occurrence: 1

  - id: run
    narration: >-
      [[mark:run]] ကဲ၊ run ကြည့်ရအောင်။ ပထမ စာကြောင်းမှာ Vec တစ်ခုလုံးကို ပြပြီး၊ score 3 ခု
      ရှိတယ်လို့ ပြောပါတယ်။ နောက်တစ်ကြောင်းက Ana က 90 ရပါတယ်။ index 5 ကိုတော့ None ပြန်ရလို့၊ panic
      မဖြစ်ဘဲ index 5 မှာ ဘယ်သူမှ မရှိဘူး ဆိုတဲ့ စာကြောင်း ထွက်လာပါတယ်။ total ကတော့ 240 ဖြစ်ပြီး၊
      bonus ပေါင်းပြီးတဲ့ နောက်မှာ score တိုင်း 5 စီ တက်သွားတာကို နောက်ဆုံး စာကြောင်းမှာ မြင်ရပါတယ်။
    sources:
      - title: "The Rust Book — Iterating Over the Values in a Vector"
        url: "https://doc.rust-lang.org/book/ch08-01-vectors.html#iterating-over-the-values-in-a-vector"
    actions:
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "with bonus: [95, 85, 75]"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: "for score in &mut scores {"

  - id: wrap
    narration: >-
      ဒါဆို ပြန်ချုပ်ရရင်၊ Vec ဆိုတာ type တစ်မျိုးတည်း ထည့်ထားတဲ့၊ ကြီးလာနိုင်တဲ့ စာရင်း တစ်ခုပါ။
      push လုပ်မယ်ဆိုရင် mut လိုပါတယ်။ တန်ဖိုးတွေကို ကြိုသိပြီးသားဆိုရင် vec macro နဲ့ တန်းလုပ်လို့
      ရပါတယ်။ index မှာ element ရှိချင်မှ ရှိမယ်ဆိုရင် get ကို သုံးပြီး၊ for loop ပတ်တဲ့အခါ
      reference ကို ပတ်ပါ။ ဒါပေမဲ့ Vec ထဲက reference တစ်ခုကို သုံးနေဆဲ အချိန်မှာတော့ push
      မလုပ်ပါနဲ့။ နောက် lesson မှာတော့ String တွေကို ကြည့်သွားပါမယ်။ String ဆိုတာလည်း byte တွေ
      ထည့်ထားတဲ့ Vec တစ်ခုပေါ်မှာ တည်ဆောက်ထားတာပါ။
    sources:
      - title: "The Rust Book — Storing Lists of Values with Vectors"
        url: "https://doc.rust-lang.org/book/ch08-01-vectors.html"
      - title: "The Rust Book — What Is a String?"
        url: "https://doc.rust-lang.org/book/ch08-02-strings.html#what-is-a-string"
    actions: []

checks:
  - { type: timing.p95Ms, max: 300 }
