  - id: past-the-end
    narration: >-
      array မှာတုန်းက အရှည်ကို compiler က ကြိုသိနေတဲ့အတွက်၊ index မှားရင် compile လုပ်ချိန်မှာတင်
      ဖမ်းမိခဲ့ပါတယ်။ [[mark:draw-index]] Vec ရဲ့ အရှည်ကတော့ program run နေချိန်ကျမှ သိရတာ ဖြစ်လို့၊
      names ရဲ့ index 5 ဆိုတာ compile လုပ်လို့ ရသွားပါတယ်။ [[mark:draw-panic]] ဒါပေမဲ့ run
      လိုက်တဲ့အခါ၊ ဒီ စာကြောင်း ရောက်တာနဲ့ program က panic ဖြစ်ပြီး ရပ်သွားပါတယ်။ message ကတော့
      index out of bounds ပါ၊ အရှည်က 3 ပဲ ရှိပြီး index က 5 ဖြစ်နေပါတယ်တဲ့။ [[mark:draw-get]] ဒီထက်
      ပိုလုံခြုံတဲ့ နည်းက get ပါ။ get က တန်ဖိုးကို တိုက်ရိုက် ပြန်မပေးဘဲ၊ Option တစ်ခု ပြန်ပေးပါတယ်။
      အဲဒီ index မှာ element ရှိရင် Some ထဲမှာ အဲဒီ element ရဲ့ reference ပါလာပြီး၊ ဥပမာအားဖြင့်
      index 0 ဆိုရင် Some Ana ပါ။ index 5 မှာလို ဘာမှ မရှိရင်တော့ None ပြန်ပေးပါတယ်။
      [[mark:draw-safe]] ဒါကြောင့် panic မဖြစ်တော့သလို၊ None ဖြစ်နိုင်တယ် ဆိုတာကိုလည်း compiler က
      ကိုယ့်ကို handle လုပ်ခိုင်းပါတယ်။
    sources:
      - title: "The Rust Book — Reading Elements of Vectors"
        url: "https://doc.rust-lang.org/book/ch08-01-vectors.html#reading-elements-of-vectors"
      - title: "std::vec::Vec::get (slice method)"
        url: "https://doc.rust-lang.org/std/primitive.slice.html#method.get"
      - title: "The Rust Book — Invalid Array Element Access"
        url: "https://doc.rust-lang.org/book/ch03-02-data-types.html#invalid-array-element-access"
    actions:
      - id: open-board-end
        type: whiteboard.apply
        at: { scene: start, offsetMs: -300 }
        open: true
        clear: true
        upsertIds: [r-title]
      - id: draw-index
        type: whiteboard.apply
        at: { mark: draw-index }
        upsertIds: [r-index, r-index-line]
        drawMs: 1200
      - id: draw-panic
