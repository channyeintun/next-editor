scenes:
  - id: what-is-a-vec
    chapter: ကြီးလာနိုင်တဲ့ စာရင်း
    narration: >-
      ပြီးခဲ့တဲ့ lesson တွေမှာ array ကို တွေ့ခဲ့ပြီး ဖြစ်ပါတယ်။ array ရဲ့ အရှည်က code
      ရေးတဲ့အချိန်ကတည်းက သတ်မှတ်ထားပြီးသား ဖြစ်တဲ့အတွက်၊ နောက်ပိုင်း ပြောင်းလို့ မရပါဘူး။ ဒါပေမဲ့
      တကယ့် program တွေမှာ element ဘယ်နှစ်ခု လာမလဲ ဆိုတာ ကြိုမသိတဲ့ အခြေအနေမျိုး အများကြီး ရှိပါတယ်။
      အဲဒီလို အခါမျိုးအတွက် Rust မှာ Vec ဆိုတာ ရှိပါတယ်။ Vec ဆိုတာ ကြီးလာနိုင်တဲ့ စာရင်း တစ်ခုပါ။
      [[mark:draw-heap]] Vec တစ်ခုက သူ့ element တွေကို heap ပေါ်မှာ တစ်ခုနဲ့ တစ်ခု ကပ်လျက်
      သိမ်းထားပါတယ်။ ပြီးတော့ element တိုင်းက type တစ်မျိုးတည်း ဖြစ်ရပါမယ်။ Vec of T ဆိုတဲ့ နာမည်ထဲက
      T က အဲဒီ element type ကို ပြောတာပါ။ ဒီဥပမာမှာဆိုရင် element တိုင်းက i32 ဖြစ်လို့၊ Vec of i32
      ပါ။ element တစ်ခုစီမှာ index တစ်ခုစီ ရှိပြီး၊ array မှာလိုပဲ သုညကနေ စရေတွက်ပါတယ်။
      [[mark:draw-var]] scores ဆိုတဲ့ variable ထဲမှာ element တွေ ကိုယ်တိုင် မရှိဘဲ၊ အချက် သုံးချက်ပဲ
      ရှိပါတယ်။ heap ပေါ်က element တွေဆီ ညွှန်ထားတဲ့ pointer တစ်ခု၊ အခု element ဘယ်နှစ်ခု ရှိလဲ
      ဆိုတဲ့ အရှည်၊ ပြီးတော့ capacity ပါ။ capacity ဆိုတာ နေရာ ထပ်မတောင်းခင် element ဘယ်နှစ်ခုအထိ
      ဆန့်လဲ ဆိုတာပါ။ [[mark:draw-push]] push က element အသစ် တစ်ခုကို စာရင်းရဲ့ အဆုံးမှာ ထည့်ပေးတာ
      ဖြစ်ပြီး၊ ဒီ နေရာလွတ်ထဲကို ဝင်သွားတာပါ။ [[mark:draw-grow]] နေရာလွတ် ကုန်သွားတဲ့အခါကျတော့၊ Vec
      က element အားလုံးကို ပိုကြီးတဲ့ memory block အသစ် တစ်ခုဆီ ရွှေ့လိုက်ပါတယ်။ ဒါ ဘာကြောင့်
      အရေးကြီးလဲ ဆိုတာ ခဏနေရင် တွေ့ရပါလိမ့်မယ်။
    sources:
      - title: "The Rust Book — Storing Lists of Values with Vectors"
        url: "https://doc.rust-lang.org/book/ch08-01-vectors.html"
      - title: "std::vec::Vec — Capacity and reallocation"
        url: "https://doc.rust-lang.org/std/vec/struct.Vec.html#capacity-and-reallocation"
      - title: "The Rust Book — The Array Type"
        url: "https://doc.rust-lang.org/book/ch03-02-data-types.html#the-array-type"
    actions:
      # Opens in the quiet handle before the first word, already titled.
      - id: open-board-vec
        type: whiteboard.apply
        at: { scene: start, offsetMs: -1500 }
        open: true
        upsertIds: [v-title]
      - id: draw-heap
        type: whiteboard.apply
        at: { mark: draw-heap }
        upsertIds:
          [v-heap, v-box0, v-val0, v-box1, v-val1, v-box2, v-val2, v-type, v-idx0, v-idx1, v-idx2]
        drawMs: 3000
      - id: draw-var
        type: whiteboard.apply
        at: { mark: draw-var }
        upsertIds: [v-var-box, v-var-name, v-var-parts, v-arrow]
        drawMs: 1800
      - id: draw-push
        type: whiteboard.apply
        at: { mark: draw-push }
        upsertIds: [v-spare, v-push]
        drawMs: 1000
      - id: draw-grow
        type: whiteboard.apply
        at: { mark: draw-grow }
        upsertIds: [v-grow]
        drawMs: 1600

  - id: new-and-push
    narration: >-
      ကဲ၊ editor ထဲမှာ Vec တစ်ခု တကယ် တည်ဆောက်ကြည့်ရအောင်။ [[mark:type-new]] scores ဆိုတဲ့ နာမည်
      ပေးလိုက်ပါမယ်။ Vec ရဲ့ new က ဘာမှ မပါသေးတဲ့ Vec အလွတ် တစ်ခု ပြန်ပေးပြီး၊ သူ့ထဲကို ခဏနေရင်
      ဖြည့်ပါမယ်။ [[mark:select-mut]] ဒီနေရာမှာ mut ကို သတိထား ကြည့်ပါ။ push လုပ်လိုက်တိုင်း Vec က
      ပြောင်းသွားတဲ့အတွက်၊ variable က mutable ဖြစ်ရပါမယ်၊ ဆိုလိုတာက ပြောင်းလို့ ရရပါမယ်။ mut မပါဘဲ
      ရေးကြည့်ရင်၊ compiler က push တစ်ခုချင်းစီကို E0596 error နဲ့ ပယ်ပါလိမ့်မယ်။ error က ပြောတာက
      scores ကို mutable အနေနဲ့ borrow လုပ်လို့ မရပါဘူးတဲ့၊ borrow ဆိုတာ ငှားသုံးတာပါ။
      [[mark:type-push]] အခု score သုံးခုကို push လုပ်ကြည့်ရအောင်။ element type ကို ဘယ်နေရာမှာမှ
      မရေးထားတာ သတိထား ကြည့်ပါ။ ထည့်လိုက်တဲ့ ကိန်းဂဏန်းတွေကို ကြည့်ပြီး၊ ဒါ Vec of i32 ပဲလို့
      compiler က ကိုယ့်အစား တွက်ပေးလိုက်တာပါ။ နောက်ဆုံး စာကြောင်းက println ထဲမှာ Debug format
      placeholder သုံးထားတဲ့အတွက်၊ Vec တစ်ခုလုံးကို print ထုတ်ပြပါလိမ့်မယ်။ ပြီးတော့ len က element
      အရေအတွက်ကို ပြန်ပေးပါတယ်။
    sources:
      - title: "The Rust Book — Creating a New Vector"
        url: "https://doc.rust-lang.org/book/ch08-01-vectors.html#creating-a-new-vector"
      - title: "The Rust Book — Updating a Vector"
        url: "https://doc.rust-lang.org/book/ch08-01-vectors.html#updating-a-vector"
      - title: "Rust error codes — E0596"
        url: "https://doc.rust-lang.org/error_codes/E0596.html"
    actions:
      - id: close-board-vec
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-main
        type: workspace.openFile
        at: { scene: start, offsetMs: 900 }
        path: main.rs
      - id: type-new
        type: editor.type
        at: { mark: type-new, offsetMs: -200 }
        target:
          file: main.rs
          after: "fn main() {\n"
          occurrence: 1
        cadence: fast-explainer
        text: "    let mut scores = Vec::new();\n"
      - id: select-mut
        type: editor.select
        at: { mark: select-mut }
        target:
          file: main.rs
          text: "mut"
          occurrence: 1
      - id: type-push
        type: editor.type
        at: { mark: type-push }
        target:
          file: main.rs
          after: "    let mut scores = Vec::new();\n"
          occurrence: 1
        cadence: line-by-line
        text: "    scores.push(90);

          \    scores.push(80);

          \    scores.push(70);

          \    println!(\"{scores:?} has {} scores\", scores.len());\n"

  - id: vec-macro
    narration: >-
      [[mark:type-names]] တန်ဖိုးတွေကို အစကတည်းက သိပြီးသားဆိုရင်တော့၊ vec macro နဲ့ ရေးတာက
      ပိုတိုပါတယ်။ ဒီမှာ names ဆိုတဲ့ Vec တစ်ခုကို နာမည် သုံးခုနဲ့ တန်းလုပ်လိုက်တာပါ။
      [[mark:select-vec]] vec နောက်က exclamation mark က println မှာလိုပဲ၊ ဒါ macro တစ်ခု ဖြစ်တယ်လို့
      ပြောတာပါ။ vec macro က Vec ကို လုပ်တာရော၊ ထဲကို တန်ဖိုး ဖြည့်တာရော၊ တစ်ဆင့်တည်းနဲ့
      ပြီးသွားပါတယ်။ names ကို နောက်ပိုင်း ဘယ်တော့မှ မပြောင်းတော့တဲ့အတွက်၊ ဒီတစ်ခါ mut မလိုပါဘူး။
    sources:
      - title: "The Rust Book — Creating a New Vector (vec!)"
        url: "https://doc.rust-lang.org/book/ch08-01-vectors.html#creating-a-new-vector"
      - title: "std::vec! macro"
