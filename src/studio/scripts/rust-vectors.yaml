# One idea: a Vec<T> is a growable, heap-allocated list of one type — you push
# to add, index to read, and loop over a reference to sum without consuming it.
# A whiteboard sketch, then a Vec of scores built and totaled, run.
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/rust-vectors.yaml
schemaVersion: 1

lesson:
  slug: rust-vectors
  title: "Rust vectors: a list that grows"
  locale: en-US
  workspace:
    lessonType: rust
    name: Rust Lesson
    entryFilePath: main.rs
    files:
      main.rs: |
        fn main() {
            let mut scores = Vec::new();
            scores.push(90);
            scores.push(80);
            scores.push(70);
            println!("count: {}", scores.len());
        }
  # Diagram: the Vec drawn as a row of indexed value boxes, with a green
  # "push" box showing it grows on the end.
  whiteboardAssets:
    - id: vec-title
      kind: text
      x: 300
      y: 170
      width: 700
      height: 44
      text: "Vec<T> — a growable list"
      strokeColor: "#1e1e1e"
      fontSize: 34
    - id: vec-arrlabel
      kind: text
      x: 360
      y: 252
      width: 400
      height: 34
      text: "scores: Vec<i32>"
      strokeColor: "#1e1e1e"
      fontSize: 26
    - id: vec-box0
      kind: rectangle
      x: 360
      y: 300
      width: 92
      height: 84
      strokeColor: "#1e1e1e"
    - id: vec-box1
      kind: rectangle
      x: 460
      y: 300
      width: 92
      height: 84
      strokeColor: "#1e1e1e"
    - id: vec-box2
      kind: rectangle
      x: 560
      y: 300
      width: 92
      height: 84
      strokeColor: "#1e1e1e"
    - id: vec-val0
      kind: text
      x: 386
      y: 324
      width: 60
      height: 40
      text: "90"
      strokeColor: "#1e1e1e"
      fontSize: 30
    - id: vec-val1
      kind: text
      x: 486
      y: 324
      width: 60
      height: 40
      text: "80"
      strokeColor: "#1e1e1e"
      fontSize: 30
    - id: vec-val2
      kind: text
      x: 586
      y: 324
      width: 60
      height: 40
      text: "70"
      strokeColor: "#1e1e1e"
      fontSize: 30
    - id: vec-idx0
      kind: text
      x: 400
      y: 398
      width: 30
      height: 26
      text: "0"
      strokeColor: "#80868b"
      fontSize: 20
    - id: vec-idx1
      kind: text
      x: 500
      y: 398
      width: 30
      height: 26
      text: "1"
      strokeColor: "#80868b"
      fontSize: 20
    - id: vec-idx2
      kind: text
      x: 600
      y: 398
      width: 30
      height: 26
      text: "2"
      strokeColor: "#80868b"
      fontSize: 20
    - id: vec-boxnext
      kind: rectangle
      x: 672
      y: 300
      width: 92
      height: 84
      strokeColor: "#2f9e44"
    - id: vec-pushlabel
      kind: text
      x: 690
      y: 326
      width: 90
      height: 34
      text: "push"
      strokeColor: "#2f9e44"
      fontSize: 26
    - id: vec-note
      kind: text
      x: 340
      y: 448
      width: 740
      height: 36
      text: "grows on the heap · index from 0 · len() = 3"
      strokeColor: "#1e1e1e"
      fontSize: 26

build:
  voiceProfile: pocket-alba-v1
  seed: 38

runtime:
  kind: rust-playground
  defaultMode: fixture
  fixture:
    latencyMs: 600
    result:
      status: success
      stdout: "count: 3\nfirst: 90\ntotal: 240\n"
      stderr: ""

scenes:
  - id: what-is-a-vec
    narration: >
      [[mark:board]] A Vec is a list that grows as you need it, all one type.
      [[mark:show-vec]] Here are three scores, at indices zero, one, and two.
      [[mark:show-push]] push adds a new value onto the end — the Vec just
      grows. [[mark:show-note]] It lives on the heap; read any slot by index, or
      ask its length. [[mark:board-close]] Let's fill one.
    sources:
      - title: "The Rust Book — Storing Lists of Values with Vectors"
        url: "https://doc.rust-lang.org/book/ch08-01-vectors.html"
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { mark: board }
        open: true
        upsertIds: [vec-title, vec-arrlabel]
      - id: show-vec
        type: whiteboard.apply
        at: { mark: show-vec }
        upsertIds:
          [vec-box0, vec-box1, vec-box2, vec-val0, vec-val1, vec-val2, vec-idx0, vec-idx1, vec-idx2]
      - id: show-push
        type: whiteboard.apply
        at: { mark: show-push }
        upsertIds: [vec-boxnext, vec-pushlabel]
      - id: show-note
        type: whiteboard.apply
        at: { mark: show-note }
        upsertIds: [vec-note]
      - id: close-board
        type: whiteboard.apply
        at: { mark: board-close }
        open: false

  - id: build-and-index
    narration: >
      [[mark:open]] Here we make an empty Vec and push three scores onto it.
      Length is three. [[mark:type-index]] Indexing reads one element — scores
      at zero is the first, ninety.
    sources:
      - title: "The Rust Book — Reading Elements of Vectors"
        url: "https://doc.rust-lang.org/book/ch08-01-vectors.html#reading-elements-of-vectors"
    actions:
      - id: open-main
        type: workspace.openFile
        at: { mark: open }
        path: main.rs
      - id: type-index
        type: editor.type
        at: { mark: type-index, offsetMs: -400 }
        target:
          file: main.rs
          after: "    println!(\"count: {}\", scores.len());\n"
          occurrence: 1
        cadence: line-by-line
        text: "    println!(\"first: {}\", scores[0]);\n"

  - id: iterate
    narration: >
      [[mark:type-loop]] To add them up, we loop over a reference to the Vec
      and sum each score. Borrowing with an ampersand means the Vec stays ours
      after the loop — we didn't consume it.
    sources:
      - title: "The Rust Book — Iterating over the Values in a Vector"
        url: "https://doc.rust-lang.org/book/ch08-01-vectors.html#iterating-over-the-values-in-a-vector"
    actions:
      - id: type-loop
        type: editor.type
        at: { mark: type-loop, offsetMs: -400 }
        target:
          file: main.rs
          after: "    println!(\"first: {}\", scores[0]);\n"
          occurrence: 1
        cadence: line-by-line
        text: "    let mut total = 0;\n    for &s in &scores {\n        total += s;\n    }\n    println!(\"total: {total}\");\n"

  - id: run
    narration: >
      [[mark:run]] Let's run it. Three scores, the first is ninety, and they
      total two hundred forty. A Vec is the list you reach for when the size
      isn't fixed.
    sources:
      - title: "Rust Playground"
        url: "https://play.rust-lang.org/"
    actions:
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "total: 240"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: "for &s in &scores {"

checks:
  - { type: timing.p95Ms, max: 300 }
