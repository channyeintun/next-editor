# Rust from zero, lesson 12: vectors.
#
# The arc: a whiteboard shows what a Vec is (elements side by side on the
# heap, all one type, indexed from 0; the variable holds pointer, length and
# capacity; push fills the spare room, and a full Vec moves to a bigger
# block). The editor then builds one with Vec::new + push (why it needs mut,
# how the element type is inferred), a second with vec!, reads by index, and
# a second board compares names[5] (compiles, panics when it runs) with
# names.get(5) (an Option — None). The editor handles the Option with match.
# A third board explains WHY you can't push while holding a reference to an
# element (push may move the elements and free the old block) and shows the
# compiler's E0502. The lesson is insert-only with one run, so no broken
# program is ever typed. Last, for loops over &scores (read) and &mut scores
# (write through `*`), and one run.
#
# Every message on a board or in the narration was confirmed with rustc 1.98
# (edition 2024) on the broken variants:
#   `let scores = Vec::new();` then the three pushes:
#     error[E0596]: cannot borrow `scores` as mutable, as it is not declared as mutable
#     (one error: `let` marked "not mutable", every push "cannot borrow as mutable")
#   `names[5]` on a 3-element Vec compiles, then panics when it runs:
#     index out of bounds: the len is 3 but the index is 5
#   `let first = &scores[0]; scores.push(60); println!("{first}");`
#     error[E0502]: cannot borrow `scores` as mutable because it is also borrowed as immutable
#   `for score in scores { … }` then using scores:
#     error[E0382]: borrow of moved value: `scores` (moved by the implicit .into_iter())
#
# Board colours: blue = the Vec / the reference being named, orange = what
# changes (push, the spare room, growing), green = the safe way / valid,
# red = the panic and the error, violet = the results get returns.
# #1e1e1e paints white on the dark board.
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/rust-vectors.yaml
