  - id: reference-then-push
    chapter: Reference ကိုင်ထားရင်း push
    narration: >-
      Vec နဲ့ ပတ်သက်ပြီး compiler က လုံးဝ ခွင့်မပြုတဲ့ အရာ တစ်ခု ရှိပါတယ်၊ အဲဒါကို ကြည့်ရအောင်။
      [[mark:draw-code]] ပထမဆုံး score ရဲ့ reference ကို first ဆိုတဲ့ နာမည်နဲ့ ကိုင်ထားပြီး၊ scores
      ထဲကို push တစ်ခု လုပ်ပြီးမှ၊ အဲဒီ first ကို ပြန်သုံးတယ်လို့ ဆိုပါစို့။ [[mark:draw-old]] first
      က element တွေ ရှိနေတဲ့ memory block ထဲကို ညွှန်ထားတာပါ။ [[mark:draw-move]] အဲဒီ block က
      ပြည့်နေပြီဆိုရင်၊ push က element အားလုံးကို ပိုကြီးတဲ့ block အသစ်ဆီ ရွှေ့ပြီး၊ block
      အဟောင်းကို ပြန်လွှတ်လိုက်ပါတယ်။ [[mark:draw-strike]] အဲဒီအခါ first က ပြန်လွှတ်ပြီးသား memory
      ကို ညွှန်နေတဲ့ သဘော ဖြစ်သွားပါပြီ။ [[mark:draw-error]] ဒါကြောင့် compiler က ဒီ code ကို E0502
      error နဲ့ ငြင်းလိုက်ပါတယ်။ scores ကို first က immutable အနေနဲ့၊ ဆိုလိုတာက ဖတ်ရုံ ဖတ်ဖို့
      borrow လုပ်ထားဆဲ ဖြစ်နေလို့၊ mutable အနေနဲ့ ထပ် borrow လုပ်လို့ မရပါဘူးတဲ့။ ဒီနေရာမှာ
      သတိထားရမှာက၊ block ထဲမှာ နေရာလွတ် ကျန်သေးလား ဆိုတာကို compiler က လိုက်မစစ်ပါဘူး။
      ဘာကြောင့်လဲဆိုတော့၊ push တိုင်းက element တွေကို ရွှေ့နိုင်ခြေ ရှိနေလို့ပါ။ [[mark:draw-rule]]
      တကယ်တော့ ဒါက ကိုယ် သိပြီးသား borrowing စည်းကမ်းပါပဲ။ ဖတ်တဲ့သူ အများကြီး၊ ဒါမှမဟုတ် ရေးတဲ့သူ
      တစ်ယောက်တည်းပါ။ first က ဖတ်နေဆဲ ဖြစ်တဲ့အတွက်၊ push က ဝင်ရေးလို့ မရတာပါ။
    sources:
      - title: "The Rust Book — Reading Elements of Vectors (why a reference blocks push)"
        url: "https://doc.rust-lang.org/book/ch08-01-vectors.html#reading-elements-of-vectors"
      - title: "Rust error codes — E0502"
        url: "https://doc.rust-lang.org/error_codes/E0502.html"
      - title: "The Rust Book — Mutable References"
        url: "https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html#mutable-references"
    actions:
      - id: open-board-ref
        type: whiteboard.apply
        at: { scene: start }
        open: true
        clear: true
        upsertIds: [e-title]
      - id: draw-code
        type: whiteboard.apply
        at: { mark: draw-code }
        upsertIds: [e-code1, e-code2, e-code3]
        drawMs: 2000
      - id: draw-old
        type: whiteboard.apply
        at: { mark: draw-old }
        upsertIds: [e-first, e-first-arrow, e-old-box, e-old-text]
        drawMs: 1800
      - id: draw-move
        type: whiteboard.apply
        at: { mark: draw-move }
        upsertIds: [e-move-arrow, e-new-box, e-new-text, e-new-label]
