      [[mark:type-index]] element တစ်ခုကို ဖတ်ချင်ရင်၊ array မှာလိုပဲ သူ့ index ကို
      လေးထောင့်ကွင်းထဲမှာ ရေးပါတယ်။ [[mark:select-index]] names ရဲ့ index 0 ဆိုတာ ပထမဆုံး နာမည်
      ဖြစ်ပြီး၊ scores ရဲ့ index 0 ကတော့ ပထမဆုံး score ပါ။ ဒါဆို index က စာရင်းရဲ့ အဆုံးကို
      ကျော်သွားရင်ရော ဘာဖြစ်မလဲ။
    sources:
      - title: "The Rust Book — Reading Elements of Vectors"
