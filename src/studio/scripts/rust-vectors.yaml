build:
  voiceProfile: pocket-alba-v1
  seed: 38

runtime:
  kind: rust-playground
  defaultMode: fixture
  fixture:
    latencyMs: 600
    result:
      status: success
      stdout: "[90, 80, 70] has 3 scores\nAna got 90\nnobody at index 5\ntotal: 240\nwith bonus: [95, 85, 75]\n"
      stderr: ""

scenes:
  - id: what-is-a-vec
    chapter: A list that can grow
    narration: >
      You've seen arrays. Their length is fixed when you write the code. When
      you don't know how many items you'll have, you use a Vec.
      [[mark:draw-heap]] A Vec keeps its elements next to each other on the
      heap, and every element has the same type: the T in Vec of T. Each one
      has an index, starting at zero.
      [[mark:draw-var]] The variable holds a pointer to them, the length,
      and the capacity: how many elements fit before it needs more room.
      [[mark:draw-push]] push adds a new element at the end, into that room.
      [[mark:draw-grow]] When the room runs out, the Vec moves everything to
      a bigger block. You'll see why that matters.
    sources:
      - title: "The Rust Book — Storing Lists of Values with Vectors"
        url: "https://doc.rust-lang.org/book/ch08-01-vectors.html"
      - title: "std::vec::Vec — Capacity and reallocation"
        url: "https://doc.rust-lang.org/std/vec/struct.Vec.html#capacity-and-reallocation"
      - title: "The Rust Book — The Array Type"
        url: "https://doc.rust-lang.org/book/ch03-02-data-types.html#the-array-type"
    actions:
      # Opens in the quiet handle before the first word, already titled.
      - id: open-board-vec
        type: whiteboard.apply
        at: { scene: start, offsetMs: -1500 }
        open: true
        upsertIds: [v-title]
      - id: draw-heap
        type: whiteboard.apply
        at: { mark: draw-heap }
        upsertIds:
          [v-heap, v-box0, v-val0, v-box1, v-val1, v-box2, v-val2, v-type, v-idx0, v-idx1, v-idx2]
        drawMs: 3000
      - id: draw-var
        type: whiteboard.apply
        at: { mark: draw-var }
        upsertIds: [v-var-box, v-var-name, v-var-parts, v-arrow]
        drawMs: 1800
      - id: draw-push
        type: whiteboard.apply
        at: { mark: draw-push }
        upsertIds: [v-spare, v-push]
        drawMs: 1000
      - id: draw-grow
        type: whiteboard.apply
        at: { mark: draw-grow }
        upsertIds: [v-grow]
        drawMs: 1600

  - id: new-and-push
    narration: >
      Let's make one in the editor. [[mark:type-new]] We'll call it scores.
      Vec::new gives you a new, empty Vec, and we'll fill it in a moment.
      [[mark:select-mut]] Notice the mut. push changes the Vec, so the
      variable has to be mutable. Without mut, the compiler rejects every
      push, with error E0596: can't borrow scores as mutable.
      [[mark:type-push]] Now let's push three scores. We never wrote the
      element type. From these numbers, the compiler works out it's a Vec of
      i32. The debug placeholder prints the whole Vec.
    sources:
      - title: "The Rust Book — Creating a New Vector"
        url: "https://doc.rust-lang.org/book/ch08-01-vectors.html#creating-a-new-vector"
      - title: "The Rust Book — Updating a Vector"
        url: "https://doc.rust-lang.org/book/ch08-01-vectors.html#updating-a-vector"
      - title: "Rust error codes — E0596"
        url: "https://doc.rust-lang.org/error_codes/E0596.html"
    actions:
      - id: close-board-vec
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-main
        type: workspace.openFile
        at: { scene: start, offsetMs: 900 }
        path: main.rs
      - id: type-new
        type: editor.type
        at: { mark: type-new, offsetMs: -200 }
        target:
          file: main.rs
          after: "fn main() {\n"
          occurrence: 1
        cadence: fast-explainer
        text: "    let mut scores = Vec::new();\n"
      - id: select-mut
        type: editor.select
        at: { mark: select-mut }
        target:
          file: main.rs
          text: "mut"
          occurrence: 1
      - id: type-push
        type: editor.type
        at: { mark: type-push }
        target:
          file: main.rs
          after: "    let mut scores = Vec::new();\n"
          occurrence: 1
        cadence: line-by-line
        text: "    scores.push(90);\n    scores.push(80);\n    scores.push(70);\n    println!(\"{scores:?} has {} scores\", scores.len());\n"

  - id: vec-macro
    narration: >
      [[mark:type-names]] When you already know the values, vec! is shorter.
      [[mark:select-vec]] The exclamation mark means it's a macro, like
      print line. It makes the Vec and fills it in one step. names never
      changes, so it doesn't need mut.
    sources:
      - title: "The Rust Book — Creating a New Vector (vec!)"
        url: "https://doc.rust-lang.org/book/ch08-01-vectors.html#creating-a-new-vector"
      - title: "std::vec! macro"
        url: "https://doc.rust-lang.org/std/macro.vec.html"
    actions:
      - id: type-names
        type: editor.type
        at: { mark: type-names, offsetMs: -200 }
        target:
          file: main.rs
          after: "scores.len());\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n    let names = vec![\"Ana\", \"Ben\", \"Cho\"];\n"
      - id: select-vec
        type: editor.select
        at: { mark: select-vec }
        target:
          file: main.rs
          text: "vec!"
          occurrence: 1

  - id: index
    chapter: Index or get
    narration: >
      [[mark:type-index]] To read one element, put its index in square
      brackets. [[mark:select-index]] names at zero is the first name. But
      what happens when the index is past the end?
    sources:
      - title: "The Rust Book — Reading Elements of Vectors"
        url: "https://doc.rust-lang.org/book/ch08-01-vectors.html#reading-elements-of-vectors"
    actions:
      - id: type-index
        type: editor.type
        at: { mark: type-index, offsetMs: -200 }
        target:
          file: main.rs
          after: "    let names = vec![\"Ana\", \"Ben\", \"Cho\"];\n"
          occurrence: 1
        cadence: line-by-line
        text: "    println!(\"{} got {}\", names[0], scores[0]);\n"
      - id: select-index
        type: editor.select
        at: { mark: select-index }
        target:
          file: main.rs
          text: "names[0]"
          occurrence: 1

  - id: past-the-end
    narration: >
      With an array, the compiler caught a bad index, because it knew the
      length. [[mark:draw-index]] A Vec's length is only known when the
      program runs, so names at five compiles.
      [[mark:draw-panic]] Then the program panics and stops: index out of
      bounds, the len is three but the index is five.
      [[mark:draw-get]] get is the safer way. It returns an
      Option: Some with a reference to the element, or None when there's
      nothing at that index.
      [[mark:draw-safe]] No panic, and the compiler makes you handle None.
    sources:
      - title: "The Rust Book — Reading Elements of Vectors"
        url: "https://doc.rust-lang.org/book/ch08-01-vectors.html#reading-elements-of-vectors"
      - title: "std::vec::Vec::get (slice method)"
        url: "https://doc.rust-lang.org/std/primitive.slice.html#method.get"
      - title: "The Rust Book — Invalid Array Element Access"
        url: "https://doc.rust-lang.org/book/ch03-02-data-types.html#invalid-array-element-access"
    actions:
      - id: open-board-end
        type: whiteboard.apply
        at: { scene: start, offsetMs: -300 }
        open: true
        clear: true
        upsertIds: [r-title]
      - id: draw-index
        type: whiteboard.apply
        at: { mark: draw-index }
        upsertIds: [r-index, r-index-line]
        drawMs: 1200
      - id: draw-panic
        type: whiteboard.apply
        at: { mark: draw-panic }
        upsertIds: [r-arrow1, r-panic, r-msg1, r-msg2]
        drawMs: 2400
      - id: draw-get
        type: whiteboard.apply
        at: { mark: draw-get }
        upsertIds: [r-get0, r-arrow2, r-some, r-get5, r-arrow3, r-none]
        drawMs: 2600
      - id: draw-safe
        type: whiteboard.apply
        at: { mark: draw-safe }
        upsertIds: [r-safe]
        drawMs: 1400

  - id: get-and-match
    narration: >
      [[mark:type-match]] Let's ask for index five with get, and match on the
      answer. [[mark:select-none]] The None arm runs when the index is past the
      end, and the program keeps going.
    sources:
      - title: "The Rust Book — The match Control Flow Construct"
        url: "https://doc.rust-lang.org/book/ch06-02-match.html"
      - title: "std::option::Option"
        url: "https://doc.rust-lang.org/std/option/enum.Option.html"
    actions:
      - id: close-board-end
        type: whiteboard.apply
        at: { scene: start, offsetMs: -400 }
        open: false
      - id: type-match
        type: editor.type
        at: { mark: type-match }
        target:
          file: main.rs
          after: "names[0], scores[0]);\n"
          occurrence: 1
        cadence: line-by-line
        text: "    match names.get(5) {\n        Some(name) => println!(\"found {name}\"),\n        None => println!(\"nobody at index 5\"),\n    }\n"
      - id: select-none
        type: editor.select
        at: { mark: select-none }
        target:
          file: main.rs
          text: "None"
          occurrence: 1

  - id: reference-then-push
    chapter: A reference, then a push
    narration: >
      Here's something the compiler won't allow with a Vec.
      [[mark:draw-code]] Say you keep a reference to the first score, push,
      and then use the reference.
      [[mark:draw-old]] first points into the block that holds the elements.
      [[mark:draw-move]] If that block is full, push moves every element to a
      bigger block, and frees the old one.
      [[mark:draw-strike]] Now first points at freed memory.
      [[mark:draw-error]] So the compiler refuses, with error E0502: can't
      borrow scores as mutable, because it's also borrowed as immutable. It
      doesn't check whether there's room, because any push might move the
      elements.
      [[mark:draw-rule]] It's the borrowing rule you already know: many
      readers, or one writer. first is still reading, so push can't write.
    sources:
      - title: "The Rust Book — Reading Elements of Vectors (why a reference blocks push)"
        url: "https://doc.rust-lang.org/book/ch08-01-vectors.html#reading-elements-of-vectors"
      - title: "Rust error codes — E0502"
        url: "https://doc.rust-lang.org/error_codes/E0502.html"
      - title: "The Rust Book — Mutable References"
        url: "https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html#mutable-references"
    actions:
      - id: open-board-ref
        type: whiteboard.apply
        at: { scene: start }
        open: true
        clear: true
        upsertIds: [e-title]
      - id: draw-code
        type: whiteboard.apply
        at: { mark: draw-code }
        upsertIds: [e-code1, e-code2, e-code3]
        drawMs: 2000
      - id: draw-old
        type: whiteboard.apply
        at: { mark: draw-old }
        upsertIds: [e-first, e-first-arrow, e-old-box, e-old-text]
        drawMs: 1800
      - id: draw-move
        type: whiteboard.apply
        at: { mark: draw-move }
        upsertIds: [e-move-arrow, e-new-box, e-new-text, e-new-label]
        drawMs: 2200
      - id: draw-strike
        type: whiteboard.apply
        at: { mark: draw-strike }
        upsertIds: [e-strike, e-old-label]
        drawMs: 1400
      - id: draw-error
        type: whiteboard.apply
        at: { mark: draw-error }
        upsertIds: [e-err1, e-err2]
        drawMs: 2400
      - id: draw-rule
        type: whiteboard.apply
        at: { mark: draw-rule }
        upsertIds: [e-rule]
        drawMs: 1200

  - id: loop-read
    chapter: Looping over a Vec
    narration: >
      [[mark:type-sum]] To visit every element, let's loop over a reference
      to the Vec, and add up the scores. [[mark:select-ref]] The ampersand
      borrows scores, so the loop only reads it. Without it, the loop would
      take ownership, and you couldn't use scores again.
      [[mark:select-star]] Each score is a reference too, so the star reads
      the number it points at.
    sources:
      - title: "The Rust Book — Iterating Over the Values in a Vector"
        url: "https://doc.rust-lang.org/book/ch08-01-vectors.html#iterating-over-the-values-in-a-vector"
      - title: "The Rust Reference — Dereference expressions"
        url: "https://doc.rust-lang.org/reference/expressions/operator-expr.html#the-dereference-operator"
    actions:
      - id: close-board-ref
        type: whiteboard.apply
        at: { scene: start, offsetMs: -400 }
        open: false
      - id: type-sum
        type: editor.type
        at: { mark: type-sum }
        target:
          file: main.rs
          after: "        None => println!(\"nobody at index 5\"),\n    }\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n    let mut total = 0;\n    for score in &scores {\n        total += *score;\n    }\n    println!(\"total: {total}\");\n"
      - id: select-ref
        type: editor.select
        at: { mark: select-ref }
        target:
          file: main.rs
          text: "&scores"
          occurrence: 1
      - id: select-star
        type: editor.select
        at: { mark: select-star }
        target:
          file: main.rs
          text: "*score"
          occurrence: 1

  - id: loop-write
    narration: >
      [[mark:type-bonus]] To change every element, let's loop over a mutable
      reference instead. [[mark:select-mut-ref]] With ampersand mut, each
      score is a mutable reference. So the star writes through it, and adds
      five to the score inside the Vec.
    sources:
      - title: "The Rust Book — Iterating Over the Values in a Vector"
        url: "https://doc.rust-lang.org/book/ch08-01-vectors.html#iterating-over-the-values-in-a-vector"
    actions:
      - id: type-bonus
        type: editor.type
        at: { mark: type-bonus, offsetMs: -200 }
        target:
          file: main.rs
          after: "    println!(\"total: {total}\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n    for score in &mut scores {\n        *score += 5;\n    }\n    println!(\"with bonus: {scores:?}\");\n"
      - id: select-mut-ref
        type: editor.select
        at: { mark: select-mut-ref }
        target:
          file: main.rs
          text: "&mut scores"
          occurrence: 1

  - id: run
    narration: >
      [[mark:run]] Let's run it. Three scores, and Ana got ninety. Index five
      gave us None, with no panic. The total is two hundred forty, and with
      the bonus, every score went up by five.
    sources:
      - title: "The Rust Book — Iterating Over the Values in a Vector"
        url: "https://doc.rust-lang.org/book/ch08-01-vectors.html#iterating-over-the-values-in-a-vector"
    actions:
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "with bonus: [95, 85, 75]"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: "for score in &mut scores {"

  - id: wrap
    narration: >
      So a Vec is a list of one type that can grow. Use push with mut, vec!
      when you know the values, get when an index might be missing, and a
      reference in the for loop. But don't push while you're still using a
      reference into it. Next, strings. A String is built on a Vec of bytes.
    sources:
      - title: "The Rust Book — Storing Lists of Values with Vectors"
        url: "https://doc.rust-lang.org/book/ch08-01-vectors.html"
      - title: "The Rust Book — What Is a String?"
        url: "https://doc.rust-lang.org/book/ch08-02-strings.html#what-is-a-string"
    actions: []

checks:
  - { type: timing.p95Ms, max: 300 }
