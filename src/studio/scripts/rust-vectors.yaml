        upsertIds: [r-safe]
        drawMs: 1400

  - id: get-and-match
    narration: >-
      [[mark:type-match]] ဒါဆို editor ထဲမှာ index 5 ကို get နဲ့ တောင်းကြည့်ပြီး၊ ပြန်ရလာတဲ့ အဖြေကို
      match နဲ့ စစ်ကြည့်ရအောင်။ Some ဆိုရင် တွေ့တဲ့ နာမည်ကို print ထုတ်ပြီး၊ None ဆိုရင်တော့ တခြား
      စာသား တစ်ခု print ထုတ်ပါမယ်။ [[mark:select-none]] index က အဆုံးကို ကျော်သွားတဲ့အခါ ဒီ None arm
      က run ပြီး၊ program ကတော့ မရပ်ဘဲ ဆက်သွားပါတယ်။
    sources:
      - title: "The Rust Book — The match Control Flow Construct"
        url: "https://doc.rust-lang.org/book/ch06-02-match.html"
      - title: "std::option::Option"
