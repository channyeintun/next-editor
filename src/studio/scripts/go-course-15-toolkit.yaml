  - id: to-digits
    narration: >-
      [[mark:close-digits]] အဲဒီ နည်းအတိုင်း function တစ်ခု ရေးကြည့်ရအောင်။ [[mark:type-to]] main ရဲ့ အပေါ်မှာ
      ကိန်းပြည့် တစ်ခုကို ယူပြီး၊ မြန်မာ ဂဏန်းနဲ့ ရေးထားတဲ့ string ကို ပြန်ပေးတဲ့ function ကို ထည့်ပါမယ်။
      [[mark:sel-itoa]] ပထမ line မှာ strconv package ထဲက function နဲ့ ကိန်းပြည့်ကို စာသား အဖြစ် အရင် ပြောင်းပြီး၊
      ပြီးခဲ့တဲ့ lesson ကလို rune slice အဖြစ် ပြောင်းထားပါတယ်။ [[mark:sel-shift]] loop က rune တစ်လုံးချင်း
      ကြည့်ပြီး၊ English ဂဏန်း ဖြစ်ရင် board ပေါ်က နည်းနဲ့ မြန်မာ ဂဏန်းကို ပြောင်းထည့်ပါတယ်။ နောက်ဆုံးမှာ
      rune slice ကို string ပြန်ပြောင်းပြီး ပြန်ပေးပါတယ်။ [[mark:type-strconv]] strconv ကို import block ထဲ
      ထည့်ပြီး၊ [[mark:type-to-call]] main ထဲမှာ တစ်ထောင့်ငါးရာကို ပြောင်းကြည့်ပါမယ်။ [[mark:run-1]] ကဲ၊ run
      လိုက်ရအောင်။
    sources:
      - { title: "strconv package — Itoa", url: "https://pkg.go.dev/strconv#Itoa" }
      - {
          title: "The Go Programming Language Specification — Conversions to and from a string type",
          url: "https://go.dev/ref/spec#Conversions_to_and_from_a_string_type",
        }
    actions:
      - {
          id: close-digits,
          type: whiteboard.apply,
          at: { mark: close-digits },
          open: false,
          upsertIds: [],
        }
      - id: type-to
        type: editor.type
        at: { mark: type-to }
        target: { file: main.go, after: ")\n\n", occurrence: 1 }
        text: "// toMyanmarDigits writes n with Myanmar digits: 1500 → \"၁၅၀၀\".\nfunc toMyanmarDigits(n int) string {\n\tdigits := []rune(strconv.Itoa(n))\n\tfor i, r := range digits {\n\t\tif r >= '0' && r <= '9' {\n\t\t\tdigits[i] = r - '0' + '၀'\n\t\t}\n\t}\n\treturn string(digits)\n}\n\n"
        cadence: line-by-line
      - id: sel-itoa
        type: editor.select
        at: { mark: sel-itoa }
        target: { file: main.go, text: "[]rune(strconv.Itoa(n))", occurrence: 1 }
      - id: sel-shift
        type: editor.select
        at: { mark: sel-shift }
        target: { file: main.go, text: "digits[i] = r - '0' + '၀'", occurrence: 1 }
      - id: type-strconv
        type: editor.type
        at: { mark: type-strconv }
        target: { file: main.go, after: "\t\"fmt\"\n", occurrence: 1 }
        text: "\t\"strconv\"\n"
      - id: type-to-call
        type: editor.type
        at: { mark: type-to-call }
        target: { file: main.go, after: "\tfmt.Println(len(parts), parts[1])\n", occurrence: 1 }
        text: "\tfmt.Println(toMyanmarDigits(1500))\n"
        cadence: line-by-line
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "3 ရန်ကုန်မှာ",
          timeoutMs: 8000,
        }
      - {
          id: expect-file-shift,
          type: expect.file,
          at: { afterAction: run-1 },
          path: main.go,
          contains: "\t\t\tdigits[i] = r - '0' + '၀'\n",
        }

  - id: read-to
    narration: >-
      [[mark:point-fields]] ပထမ စာကြောင်းမှာ သုံး နဲ့ ရန်ကုန်မှာ ထွက်လာပါတယ်။ space နှစ်နေရာမှာ ခွဲလို့ အပိုင်း
      သုံးခု ရပြီး၊ ဒုတိယ အပိုင်းက ရန်ကုန် ဆိုတဲ့ စကားလုံး တစ်လုံးတည်း မဟုတ်ဘဲ ရန်ကုန်မှာ ဆိုတဲ့ စကားစု
      တစ်ခုလုံးပါ။ မြန်မာ စာကို စကားလုံး တစ်လုံးချင်း ခွဲဖို့ဆိုရင် space တစ်ခုတည်းနဲ့ မလုံလောက်ဘူး ဆိုတာ
      သတိထားပါ။ [[mark:point-digits]] ဒုတိယ စာကြောင်းမှာတော့ တစ်ထောင့်ငါးရာက မြန်မာ ဂဏန်းနဲ့ ထွက်လာပါပြီ။
      ဒီ function ကို နောက်ပိုင်း lesson တွေမှာ ငွေပမာဏတွေကို မြန်မာ ဂဏန်းနဲ့ ပြဖို့ ပြန်သုံးသွားပါမယ်။
    sources:
      - { title: "strings package — Fields", url: "https://pkg.go.dev/strings#Fields" }
    actions:
      - {
          id: point-fields,
          type: console.point,
          at: { mark: point-fields },
          target: { text: "3 ရန်ကုန်မှာ" },
        }
      - {
          id: point-digits,
          type: console.point,
          at: { mark: point-digits },
          target: { text: "၁၅၀၀" },
        }

  - id: from-digits
    chapter: မြန်မာ ဂဏန်းကို ပြန်ဖတ်တာ
    narration: >-
      [[mark:collapse-to]] အခု ပြောင်းပြန် အလုပ်ကို ကြည့်ရအောင်။ ကောင်တာက ဝန်ထမ်း တစ်ယောက်က ငွေပမာဏကို
      မြန်မာ ဂဏန်းနဲ့ ရိုက်ထည့်တယ် ဆိုပါစို့။ program က အဲဒါကို ပေါင်းနှုတ် လုပ်လို့ရတဲ့ int အဖြစ် ပြန်ဖတ်ရပါမယ်။
      [[mark:type-from]] ဒီ function က string ထဲက rune တွေကို တစ်လုံးချင်း လျှောက်ပါတယ်။ [[mark:sel-digit]] rune
      တစ်လုံးကနေ မြန်မာ သုည ကို နှုတ်လိုက်ရင် အဲဒီ ဂဏန်းရဲ့ တန်ဖိုး ရပါတယ်။ ရှိပြီးသား တန်ဖိုးကို ဆယ်နဲ့ မြှောက်ပြီး
      ဒီ ဂဏန်းကို ပေါင်းတာက၊ ဂဏန်း တစ်လုံးကို ညာဘက်မှာ ထပ်ရေးသလိုပါပဲ။ [[mark:type-from-calls]] main ထဲမှာ
      ဂဏန်း နှစ်ခုကို ဖတ်ကြည့်ပါမယ်။ ဒုတိယ တစ်ခုက ဝန်ထမ်းတွေ ရိုက်မိတတ်တဲ့ ပုံစံပါ၊ မျက်စိနဲ့ ကြည့်ရင်
      ပထမ တစ်ခုနဲ့ အတူတူပါပဲ။ [[mark:type-isdigit]] ပြီးတော့ သုည နဲ့ တူတဲ့ စာလုံး နှစ်လုံးကို ဂဏန်း ဟုတ်လား
      လို့ unicode package ကို မေးကြည့်ပါမယ်။ [[mark:type-unicode]] unicode package ကိုလည်း import block ထဲ
      ထည့်ပါမယ်။ [[mark:run-2]] ကဲ၊ run လိုက်ရအောင်။
    sources:
      - { title: "unicode package — IsDigit", url: "https://pkg.go.dev/unicode#IsDigit" }
      - {
          title: "The Go Programming Language Specification — For statements with range clause",
          url: "https://go.dev/ref/spec#For_range",
        }
    actions:
      - { id: collapse-1, type: runtime.collapseDock, at: { mark: collapse-to } }
      - id: type-from
        type: editor.type
        at: { mark: type-from }
        target: { file: main.go, after: "\treturn string(digits)\n}\n\n", occurrence: 1 }
        text: "// fromMyanmarDigits reads Myanmar digits: \"၁၅၀၀\" → 1500.\nfunc fromMyanmarDigits(s string) int {\n\tn := 0\n\tfor _, r := range s {\n\t\tn = n*10 + int(r-'၀')\n\t}\n\treturn n\n}\n\n"
        cadence: line-by-line
      - id: sel-digit
        type: editor.select
        at: { mark: sel-digit }
        target: { file: main.go, text: "n = n*10 + int(r-'၀')", occurrence: 1 }
      - id: type-from-calls
        type: editor.type
        at: { mark: type-from-calls }
        target: { file: main.go, after: "\tfmt.Println(toMyanmarDigits(1500))\n", occurrence: 1 }
        text: "\tfmt.Println(fromMyanmarDigits(\"၁၅၀၀\"), fromMyanmarDigits(\"၁၅ဝဝ\"))\n"
        cadence: line-by-line
      - id: type-isdigit
        type: editor.type
        at: { mark: type-isdigit }
        target: { file: main.go, after: "fromMyanmarDigits(\"၁၅ဝဝ\"))\n", occurrence: 1 }
        text: "\tfmt.Println(unicode.IsDigit('၀'), unicode.IsDigit('ဝ'))\n"
        cadence: line-by-line
      - id: type-unicode
        type: editor.type
        at: { mark: type-unicode }
        target: { file: main.go, after: "\t\"strings\"\n", occurrence: 1 }
        text: "\t\"unicode\"\n"
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "1500 1115",
          timeoutMs: 8000,
        }

  - id: read-from
    chapter: ဝ နဲ့ ၀
    narration: >-
      [[mark:point-from]] တတိယ စာကြောင်းကို ကြည့်ပါ။ ပထမ တစ်ခုက တစ်ထောင့်ငါးရာ မှန်မှန် ရပေမဲ့၊ ဒုတိယ
      တစ်ခုကတော့ တစ်ထောင့်တစ်ရာ့ တစ်ဆယ့်ငါး ဖြစ်နေပါတယ်။ [[mark:point-isdigit]] နောက်ဆုံး စာကြောင်းက
      အကြောင်းရင်းကို ပြပါတယ်။ ပထမ စာလုံးကို ဂဏန်း လို့ ဖြေပေမဲ့၊ ဒုတိယ စာလုံးကိုတော့ ဂဏန်း မဟုတ်ဘူး လို့
      ဖြေပါတယ်။ [[mark:board-trap]] ဒုတိယ string ထဲမှာ သုည လို့ ထင်ရတဲ့ စာလုံး နှစ်လုံးက တကယ်တော့ ဝ ဆိုတဲ့
      ဗျည်း ဖြစ်နေလို့ပါ။ [[mark:draw-pair]] မျက်စိနဲ့ ကြည့်ရင် မြန်မာ သုည နဲ့ ဗျည်း ဝ က တူပေမဲ့၊ Unicode
      မှာတော့ ဝ က ဗျည်းတွေကြားမှာ ရှိပြီး သုည က ဂဏန်းတွေကြားမှာ ရှိတဲ့၊ မတူတဲ့ rune နှစ်လုံးပါ။
      [[mark:draw-diff]] ဝ ကနေ မြန်မာ သုည ကို နှုတ်ရင် သုည မရဘဲ အနှုတ် သုံးဆယ့်ငါး ရပါတယ်။ [[mark:draw-steps]]
      ဒါကြောင့် ဆယ့်ငါး အထိ မှန်နေပြီး၊ ဝ တစ်လုံး ရောက်တိုင်း ဆယ်နဲ့ မြှောက်ပြီး သုံးဆယ့်ငါး နှုတ်သွားလို့
      နောက်ဆုံးမှာ တစ်ထောင့်တစ်ရာ့ တစ်ဆယ့်ငါး ရတာပါ။ [[mark:draw-note]] ဒီ bug ရဲ့ အန္တရာယ် အရှိဆုံး အချက်က၊ compile error လည်း မရှိ၊ panic လည်း မဖြစ်ဘဲ၊ ဂဏန်း မှား တစ်ခု တိတ်တိတ်လေး ထွက်လာတာပါ။ ငွေပမာဏ ဆိုရင်
      သုံးရာ ရှစ်ဆယ့်ငါး ကျပ် လျော့သွားမှာပါ။
    sources:
      - { title: "unicode package — IsDigit", url: "https://pkg.go.dev/unicode#IsDigit" }
      - { title: "Strings, bytes, runes and characters in Go", url: "https://go.dev/blog/strings" }
    actions:
      - {
          id: point-from,
          type: console.point,
          at: { mark: point-from },
          target: { text: "1500 1115" },
        }
      - {
