    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 7115

runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "3 ရန်ကုန်မှာ\n၁၅၀၀\n"
      run-2:
        status: success
        exitCode: 0
        output: "3 ရန်ကုန်မှာ\n၁၅၀၀\n1500 1115\ntrue false\n"
      run-3:
        status: success
        exitCode: 0
        output: "3 ရန်ကုန်မှာ\n၁၅၀၀\n1500 -1\ntrue false\n[8500 9800 12000 15000] 15000\n"

scenes:
  - id: recall
    chapter: Standard library
    narration: >-
      ပြီးခဲ့တဲ့ lesson မှာ မြန်မာ စာသား တစ်ခုထဲမှာ byte တွေ၊ rune တွေ ဘယ်လို ရှိလဲ ဆိုတာ ကြည့်ခဲ့ပါတယ်။
      ဒီနေ့မှာတော့ အဲဒီ အသိကို သုံးပြီး မြန်မာ စာသားနဲ့ မြန်မာ ဂဏန်းတွေကို တကယ် ကိုင်တွယ်ကြည့်ပါမယ်။
      [[mark:board-tools]] အလုပ်တိုင်းအတွက် loop ကို ကိုယ်တိုင် အမြဲ ရေးနေစရာ မလိုပါဘူး။ Go မှာ standard
      library လို့ ခေါ်တဲ့၊ Go နဲ့ အတူ ပါလာတဲ့ package တွေ ရှိပါတယ်။ [[mark:draw-tools]] စာသားအတွက် strings
      package၊ စာနဲ့ ဂဏန်း ပြောင်းဖို့ strconv package၊ စာလုံး တစ်လုံးချင်း စစ်ဖို့ unicode package၊ slice
      တွေအတွက် slices package စတာတွေ ရှိပြီး၊ package တစ်ခုစီမှာ အသုံးများတဲ့ function တွေ ပါပါတယ်။
      ဥပမာ slices package မှာ sort လုပ်တာ၊ အကြီးဆုံး ရှာတာ အပြင်၊ တန်ဖိုး တစ်ခု ဘယ်နေရာမှာ ရှိလဲ ရှာတာ၊
      ပါမပါ စစ်တာ လို function တွေလည်း ရှိပါတယ်။ [[mark:draw-rule]] ဒါကြောင့် loop တစ်ခု မရေးခင်၊ ဒီ
      အလုပ်အတွက် ကိရိယာ ရှိပြီးသားလား ဆိုတာ အရင် ရှာကြည့်တာက Go ရေးတဲ့ သူတွေရဲ့ အကျင့်ပါ။
    sources:
      - { title: "Go standard library", url: "https://pkg.go.dev/std" }
      - { title: "slices package", url: "https://pkg.go.dev/slices" }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }
      - {
          id: board-tools,
          type: whiteboard.apply,
          at: { mark: board-tools },
          open: true,
          clear: true,
          upsertIds: [t-title, t-sub],
        }
      - {
          id: draw-tools,
          type: whiteboard.apply,
          at: { mark: draw-tools },
          upsertIds: [t-box, t-strings, t-strconv, t-unicode, t-slices],
          drawMs: 3000,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: draw-rule },
          upsertIds: [t-rule, t-rule-line],
          drawMs: 1400,
        }

  - id: fields
    chapter: စာကြောင်းကို ခွဲတာ
    narration: >-
      [[mark:close-tools]] ပထမဆုံး strings package နဲ့ စကြည့်ရအောင်။ မိုးလေဝသ သတင်း စာကြောင်း တစ်ကြောင်းကို
      အပိုင်းတွေ ခွဲချင်တယ် ဆိုပါစို့။ [[mark:type-fields]] ဒီ line က မနက်ဖြန် ရန်ကုန်မှာ မိုးရွာမယ် ဆိုတဲ့
      စာကြောင်းကို space နေရာတွေမှာ ခွဲပြီး၊ အပိုင်းတွေကို slice တစ်ခု အဖြစ် ပြန်ပေးပါတယ်။ အောက်က line
      မှာတော့ အပိုင်း ဘယ်နှစ်ခု ရလဲ ဆိုတာနဲ့ ဒုတိယ အပိုင်းကို print ထုတ်ပါမယ်။ [[mark:type-strings]] strings
      package ကို သုံးမှာ ဖြစ်လို့ import block ထဲ ထည့်ပေးရပါမယ်။ [[mark:phrases]] ဒီနေရာမှာ မြန်မာ စာအတွက်
      သတိထားစရာ တစ်ခု ရှိပါတယ်။ English မှာ space က စကားလုံးတွေကို ခြားပေမဲ့၊ မြန်မာ စာမှာတော့ စကားလုံးတိုင်း
      ကြားမှာ space မခြားဘဲ၊ စကားစု တစ်ခုနဲ့ တစ်ခုကြားမှာပဲ ခြားကြပါတယ်။ ဒါကြောင့် ဒီ function က မြန်မာ စာကို
      စကားလုံး တစ်လုံးချင်း မခွဲပေးဘဲ၊ space ကြားက စကားစု တစ်ခုချင်း ခွဲပေးမှာပါ။
    sources:
      - { title: "strings package — Fields", url: "https://pkg.go.dev/strings#Fields" }
      - {
          title: "The Go Programming Language Specification — Import declarations",
          url: "https://go.dev/ref/spec#Import_declarations",
        }
    actions:
      - {
          id: close-tools,
          type: whiteboard.apply,
          at: { mark: close-tools },
          open: false,
          upsertIds: [],
        }
      - id: type-fields
        type: editor.type
        at: { mark: type-fields }
        target: { file: main.go, after: "func main() {\n", occurrence: 1 }
        text: "\tparts := strings.Fields(\"မနက်ဖြန် ရန်ကုန်မှာ မိုးရွာမယ်\")\n\tfmt.Println(len(parts), parts[1])\n"
        cadence: line-by-line
      - id: type-strings
        type: editor.type
        at: { mark: type-strings }
        target: { file: main.go, after: "\t\"fmt\"\n", occurrence: 1 }
        text: "\t\"strings\"\n"

  - id: digits-board
    chapter: မြန်မာ ဂဏန်း ပြောင်းတာ
    narration: >-
      [[mark:board-digits]] နောက်တစ်ခုက ဂဏန်းပါ။ ပြေစာ၊ ကြော်ငြာ လို နေရာတွေမှာ ငွေပမာဏကို မြန်မာ ဂဏန်းနဲ့
      ပြချင်တာ များပါတယ်။ ဒါပေမဲ့ int ကို print ထုတ်ရင် English ဂဏန်းနဲ့ပဲ ထွက်ပါတယ်။ [[mark:draw-rows]]
      Unicode မှာ English ဂဏန်း ဆယ်လုံးကို သုညကနေ ကိုးအထိ နံပါတ် ဘေးချင်းကပ် စီထားပြီး၊ မြန်မာ ဂဏန်း
      ဆယ်လုံးကိုလည်း မြန်မာ သုညကနေ ကိုးအထိ ဘေးချင်းကပ် စီထားပါတယ်။ [[mark:draw-same]] ဒါကြောင့်
      ဂဏန်း တစ်လုံးဟာ သူ့အစုရဲ့ သုည ကနေ ဘယ်လောက် ဝေးလဲ ဆိုတဲ့ အကွာအဝေးက အစု နှစ်ခုလုံးမှာ တူပါတယ်။
      ဥပမာ English ခုနစ် က English သုည ကနေ ခုနစ်နေရာ ဝေးပြီး၊ မြန်မာ ခုနစ် ကလည်း မြန်မာ သုည ကနေ ခုနစ်နေရာ
      ဝေးပါတယ်။ [[mark:draw-shift]] ဒါဆို English ဂဏန်း တစ်လုံးကနေ English သုည ကို နှုတ်လိုက်ရင် အကွာအဝေး ရပါတယ်။ အဲဒီ အကွာအဝေးကို မြန်မာ သုည နဲ့ ပေါင်းလိုက်ရင် မြန်မာ ဂဏန်း ရပါပြီ။ rune တွေက Unicode နံပါတ်တွေ
      ဖြစ်လို့ ဒီလို ပေါင်းနှုတ် လုပ်လို့ ရတာပါ။
    sources:
      - {
          title: "The Go Programming Language Specification — Rune literals",
          url: "https://go.dev/ref/spec#Rune_literals",
        }
      - { title: "Strings, bytes, runes and characters in Go", url: "https://go.dev/blog/strings" }
    actions:
      - {
          id: board-digits,
          type: whiteboard.apply,
          at: { mark: board-digits },
          open: true,
          clear: true,
          upsertIds: [d-title],
        }
      - {
          id: draw-rows,
          type: whiteboard.apply,
          at: { mark: draw-rows },
          upsertIds: [d-row1-box, d-row1, d-row1-cp, d-row2-box, d-row2, d-row2-cp],
          drawMs: 2600,
        }
      - {
          id: draw-same,
          type: whiteboard.apply,
          at: { mark: draw-same },
          upsertIds: [d-same],
          drawMs: 1200,
