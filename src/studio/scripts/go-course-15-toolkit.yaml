# Go course, lesson 15: the standard toolkit and Myanmar digits (Burmese).
#
# Start state: main.go with `package main`, an import block holding only "fmt" (strings, strconv,
# unicode and slices arrive as single inserted lines in sorted position) and an empty `func main`.
# Edits, all insert-only:
#   1. strings.Fields on a Burmese weather sentence (+ "strings"), the canonical toMyanmarDigits
#      (+ "strconv") and a call with 1500 -> run-1: 3 ရန်ကုန်မှာ / ၁၅၀၀;
#   2. the canonical unguarded fromMyanmarDigits, a call on "၁၅၀၀" and on "၁၅ဝဝ" (the letter ဝ),
#      and unicode.IsDigit on the digit and the letter (+ "unicode") -> run-2 adds 1500 1115 /
#      true false;
#   3. the guard (return -1) and its doc-comment words, then a slice of phone bills sorted and maxed
#      (+ "slices") -> run-3: 1500 -1 and [8500 9800 12000 15000] 15000 (5 lines).
# Boards: (T) the standard library's packages and the tools this lesson uses or names; (D) two rows
# of ten digits, the same distance from each zero, r - '0' + '၀'; (W) the letter ဝ vs the digit ၀
# (-35, how 1115 comes out, no error at all); (Q) the quiz (English digits into the guarded reader).
# Fixtures: bun ~/Documents/go-course-work/tools/sim-go.ts <this yaml> --write
schemaVersion: 1

