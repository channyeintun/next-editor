          type: console.point,
          at: { mark: point-isdigit },
          target: { text: "true false" },
        }
      - { id: collapse-2, type: runtime.collapseDock, at: { mark: board-trap } }
      - {
          id: board-trap,
          type: whiteboard.apply,
          at: { afterAction: collapse-2 },
          open: true,
          clear: true,
          upsertIds: [w-title],
        }
      - {
          id: draw-pair,
          type: whiteboard.apply,
