          type: whiteboard.apply,
          at: { mark: draw-steps },
          upsertIds: [w-steps],
          drawMs: 1400,
        }
      - {
          id: draw-note,
          type: whiteboard.apply,
          at: { mark: draw-note },
          upsertIds: [w-note-box, w-note],
