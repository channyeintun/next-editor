  - id: guard
    narration: >-
      [[mark:close-trap]] ဒါကို ကာကွယ်ဖို့ function ထဲမှာ စစ်ပေးရပါမယ်။ [[mark:type-guard]] rune တစ်လုံးက မြန်မာ
      သုည နဲ့ ကိုး ကြားမှာ မရှိရင်၊ ဂဏန်း မဟုတ်တော့လို့ ဆက်မတွက်ဘဲ အနှုတ် တစ် ကို ပြန်ပေးလိုက်ပါမယ်။
      [[mark:type-comment]] function ရဲ့ အပေါ်က comment မှာလည်း ဒီ အချက်ကို ထပ်ရေးထားပါမယ်။ [[mark:stand-in]]
      အနှုတ် တစ် ဆိုတာ ဒီ function အတွက် ဂဏန်း မဟုတ်ဘူး လို့ ပြောတဲ့ အမှတ်အသား တစ်ခုပါ။ ငွေပမာဏက အနှုတ်
      မဖြစ်နိုင်လို့ ဒီနေရာမှာ အဆင်ပြေပါတယ်။ ဒါပေမဲ့ ဒါက ယာယီ နည်းလမ်းပါ၊ Go မှာ အလုပ် မအောင်မြင်တာကို
      ပြောပြတဲ့ တကယ့် နည်းလမ်းကို lesson နှစ်ဆယ့်နှစ်မှာ တွေ့ရပါမယ်။
    sources:
      - {
          title: "The Go Programming Language Specification — Comparison operators",
          url: "https://go.dev/ref/spec#Comparison_operators",
        }
    actions:
      - {
          id: close-trap,
          type: whiteboard.apply,
          at: { mark: close-trap },
          open: false,
          upsertIds: [],
        }
      - id: type-guard
        type: editor.type
        at: { mark: type-guard }
        target: { file: main.go, after: "\tfor _, r := range s {\n", occurrence: 1 }
        text: "\t\tif r < '၀' || r > '၉' {\n\t\t\treturn -1\n\t\t}\n"
        cadence: line-by-line
      - id: type-comment
        type: editor.type
        at: { mark: type-comment }
        target: { file: main.go, after: 'reads Myanmar digits: "၁၅၀၀" → 1500', occurrence: 1 }
        text: ", or -1 when s holds anything else"
        cadence: fast-explainer

  - id: bills
    chapter: Slice အတွက် ကိရိယာ
    narration: >-
      [[mark:type-slices]] နောက်ဆုံး ကိရိယာ အစုကတော့ slices package ပါ၊ သူ့ကိုလည်း import block ထဲ ထည့်ပါမယ်။ [[mark:type-bills]] ပြီးတော့ လေးလစာ ဖုန်းဘေလ်တွေကို slice တစ်ခုထဲ ထည့်ပါမယ်။ [[mark:sel-sort]] ဒီ line က slice ကို အငယ်ကနေ အကြီး sort
      လုပ်ပေးပါတယ်။ sort လုပ်ထားတဲ့ slice အသစ်ကို ပြန်ပေးတာ မဟုတ်ဘဲ၊ ရှိပြီးသား slice ကိုပဲ နေရာ ပြန်စီပေးတာပါ။
      [[mark:sel-max]] ပြီးတော့ ဒီ function က အကြီးဆုံး ဘေလ်ကို ရှာပေးပါတယ်။ ဒီ အလုပ် နှစ်ခုလုံးအတွက် loop
      တစ်ခုမှ ကိုယ်တိုင် မရေးရပါဘူး။ [[mark:run-3]] ကဲ၊ run လိုက်ရအောင်။
    sources:
      - { title: "slices package", url: "https://pkg.go.dev/slices" }
    actions:
      - id: type-slices
        type: editor.type
        at: { mark: type-slices }
        target: { file: main.go, after: "\t\"fmt\"\n", occurrence: 1 }
        text: "\t\"slices\"\n"
      - id: type-bills
        type: editor.type
        at: { mark: type-bills }
        target: { file: main.go, after: "unicode.IsDigit('ဝ'))\n", occurrence: 1 }
        text: "\tbills := []int{12000, 8500, 15000, 9800}\n\tslices.Sort(bills)\n\tfmt.Println(bills, slices.Max(bills))\n"
        cadence: line-by-line
      - id: sel-sort
        type: editor.select
        at: { mark: sel-sort }
        target: { file: main.go, text: "slices.Sort(bills)", occurrence: 1 }
      - id: sel-max
        type: editor.select
        at: { mark: sel-max }
        target: { file: main.go, text: "slices.Max(bills)", occurrence: 1 }
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "1500 -1",
          timeoutMs: 8000,
        }
      - {
          id: expect-file-guard,
          type: expect.file,
          at: { afterAction: run-3 },
          path: main.go,
          contains: "\t\tif r < '၀' || r > '၉' {\n\t\t\treturn -1\n",
        }

  - id: read-bills
    narration: >-
      [[mark:point-guard]] တတိယ စာကြောင်းမှာ ဒီတစ်ခါ တစ်ထောင့်ငါးရာ နဲ့ အနှုတ် တစ် ထွက်လာပါပြီ။ ဗျည်း ဝ ပါတဲ့
      စာကို ဂဏန်း အမှား အဖြစ် မဖတ်တော့ဘဲ၊ ဂဏန်း မဟုတ်ဘူး လို့ ပြောနိုင်သွားပါပြီ။ [[mark:point-bills]]
      နောက်ဆုံး စာကြောင်းမှာ ဘေလ်တွေကို အငယ်ကနေ အကြီး စီထားပြီး၊ အကြီးဆုံးက တစ်သောင်းငါးထောင် ဖြစ်ပါတယ်။
      sort လုပ်ပြီးမှ print ထုတ်တာမို့ slice ကိုယ်တိုင်က စီပြီးသား ဖြစ်နေတာကို သတိထားကြည့်ပါ။
    sources:
      - { title: "slices package", url: "https://pkg.go.dev/slices" }
    actions:
      - {
          id: point-guard,
          type: console.point,
          at: { mark: point-guard },
          target: { text: "1500 -1" },
        }
      - {
          id: point-bills,
          type: console.point,
          at: { mark: point-bills },
          target: { text: "[8500 9800 12000 15000] 15000" },
        }

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >-
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ ဒီတစ်ခါ ဝန်ထမ်းက မြန်မာ keyboard မသုံးဘဲ၊ English
      ဂဏန်းနဲ့ တစ်ထောင့်ငါးရာ လို့ ရိုက်လိုက်တယ် ဆိုပါစို့။ စစ်တာ ထည့်ပြီးတဲ့ ဒီ function က တစ်ထောင့်ငါးရာ
      ပြန်ပေးမလား၊ အနှုတ် တစ် ပြန်ပေးမလား။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]]
      အဖြေကတော့ ခ၊ အနှုတ် တစ် ပါ။ ဘာကြောင့်လဲဆိုတော့ English ဂဏန်းတွေက Unicode မှာ မြန်မာ သုည နဲ့ ကိုး
      ကြားမှာ မရှိလို့ပါ။ ဒီ function က မြန်မာ ဂဏန်းကိုပဲ ဖတ်ဖို့ ရေးထားတာ ဖြစ်လို့၊ ဂဏန်း နှစ်မျိုးလုံး
      လက်ခံချင်ရင် နောက်ထပ် စစ်ပေးရပါမယ်။
    sources:
      - {
          title: "The Go Programming Language Specification — Rune literals",
          url: "https://go.dev/ref/spec#Rune_literals",
        }
    actions:
      - { id: collapse-3, type: runtime.collapseDock, at: { mark: quiz } }
      - {
          id: quiz,
          type: whiteboard.apply,
          at: { afterAction: collapse-3 },
          open: true,
          clear: true,
          upsertIds: [q-title, q-code, q-l1, q-a, q-b],
        }
      - {
          id: quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-check],
          drawMs: 700,
        }

  - id: recap
    chapter: ပြန်ချုပ်ရရင်
    narration: >-
      [[mark:close-quiz]] ဒါဆို ပြန်ချုပ်ရရင်၊ loop မရေးခင် standard library ထဲမှာ ကိရိယာ ရှိမရှိ အရင် ရှာပါ။
      [[mark:recap-fields]] space နဲ့ ခွဲရင် မြန်မာ စာမှာ စကားလုံး မဟုတ်ဘဲ စကားစု ရပါတယ်။ [[mark:recap-shift]]
      ဂဏန်း နှစ်စုလုံးက ဘေးချင်းကပ် စီထားလို့၊ အကွာအဝေး တူတာကို သုံးပြီး နှစ်ဘက်လုံး ပြောင်းလို့ ရပါတယ်။
      [[mark:recap-guard]] ဗျည်း ဝ နဲ့ မြန်မာ သုည ကို ရောမိတတ်လို့ ဂဏန်း ဟုတ်မဟုတ် အမြဲ စစ်ပါ။ နောက် lesson မှာတော့
      ကိုယ်ပိုင် type တစ်မျိုး ဖြစ်တဲ့ struct အကြောင်းနဲ့၊ course ရဲ့ ကျန်တဲ့ အပိုင်းမှာ တဖြည်းဖြည်း တည်ဆောက်သွားမယ့်
      ပါဆယ်ပို့ ဝန်ဆောင်မှု program ကို စ လေ့လာသွားပါမယ်။
    sources:
      - { title: "strings package — Fields", url: "https://pkg.go.dev/strings#Fields" }
    actions:
      - {
          id: close-quiz,
          type: whiteboard.apply,
          at: { mark: close-quiz },
          open: false,
          upsertIds: [],
        }
      - id: recap-fields
        type: editor.select
        at: { mark: recap-fields }
        target: { file: main.go, text: "strings.Fields", occurrence: 1 }
      - id: recap-shift
        type: editor.select
        at: { mark: recap-shift }
        target: { file: main.go, text: "r - '0' + '၀'", occurrence: 1 }
      - id: recap-guard
        type: editor.select
        at: { mark: recap-guard }
        target: { file: main.go, text: "if r < '၀' || r > '၉' {", occurrence: 1 }

checks:
  - { type: timing.p95Ms, max: 300 }
