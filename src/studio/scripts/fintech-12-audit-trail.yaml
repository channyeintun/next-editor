      audit.go: |
        package main

        import (
        	"fmt"
        	"strings"
        	"time"
        )

        // Withdrawal is what the risk check sees.
        type Withdrawal struct {
        	ID        string
        	User      string
        	Amount    int64 // cents
        	KYCLevel  int
        	NewDevice bool
        }

        // Row is one rule of a decision table. It fires when every condition it sets holds.
        type Row struct {
        	Rule      string
        	MaxKYC    int   // KYCLevel <= MaxKYC (0: any level)
        	MinAmount int64 // Amount >= MinAmount
        	NewDevice bool  // only on a new device (false: any device)
        }

        // Table is a versioned decision table: a withdrawal is blocked when any row fires.
        type Table struct {
        	Version string
        	Rows    []Row
        }

        // Record is one audit record: what, when, who, why, with the inputs and the rule version.
        type Record struct {
        	What    string
        	When    time.Time
        	Who     string
        	Fired   []string
        	Version string
        	Input   Withdrawal
        }

        func (r Row) fires(w Withdrawal) bool {
        	return (r.MaxKYC == 0 || w.KYCLevel <= r.MaxKYC) && w.Amount >= r.MinAmount &&
        		(!r.NewDevice || w.NewDevice)
        }

        // Decide evaluates every row and records which ones fired, on which inputs.
        func (t Table) Decide(w Withdrawal, when time.Time) Record {
        	rec := Record{When: when, Who: w.User, Version: t.Version, Input: w}
        	for _, row := range t.Rows {
        		if row.fires(w) {
        			rec.Fired = append(rec.Fired, row.Rule)
        		}
        	}
        	rec.What = fmt.Sprintf("%s withdrawal %s %s", w.ID, cents(w.Amount), outcome(rec.Fired))
        	return rec
        }

        // replay evaluates the stored inputs again with the stored rule version.
        func replay(rec Record, tables map[string]Table) bool {
        	again := tables[rec.Version].Decide(rec.Input, rec.When)
        	return again.What == rec.What && strings.Join(again.Fired, ",") == strings.Join(rec.Fired, ",")
        }

        func outcome(fired []string) string {
        	if len(fired) > 0 {
        		return "blocked"
        	}
        	return "allowed"
        }

        func (r Record) String() string {
        	in := r.Input
        	return fmt.Sprintf("what: %s\nwhen: %s\nwho:  %s\nwhy:  %s fired %v on amount=%s kyc=%d new=%t\n",
        		r.What, r.When.Format("2006-01-02 15:04 MST"), r.Who, r.Version, r.Fired,
        		cents(in.Amount), in.KYCLevel, in.NewDevice)
        }

        func at(month time.Month, day, hour, minute int) time.Time {
        	return time.Date(2026, month, day, hour, minute, 0, 0, time.UTC)
        }

        func cents(n int64) string {
        	return fmt.Sprintf("%d.%02d", n/100, n%100)
        }
      main.go: |
        package main

        import "fmt"

        // check is the risk rule as it is often written: correct, and silent about why.
        func check(w Withdrawal) string {
        	if w.KYCLevel < 2 {
        		if w.Amount > 100000 {
        			return "blocked"
        		}
        	}
        	if w.NewDevice && w.Amount > 50000 {
        		return "blocked"
        	}
        	return "allowed"
        }

        func main() {
        	w := Withdrawal{ID: "wd-311", User: "user:1042", Amount: 80000, KYCLevel: 2, NewDevice: true}
        	fmt.Println("decision:", check(w))
        }
