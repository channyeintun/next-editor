build:
  voiceProfile:
    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 9512

runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "decision: blocked\n"
      run-2:
        status: success
        exitCode: 0
        output: "decision: blocked\nwhat: wd-311 withdrawal 800.00 blocked\nwhen: 2026-03-02 10:15 UTC\nwho:  user:1042\nwhy:  risk-v7 fired [new-device-over-500] on amount=800.00 kyc=2 new=true\n"
      run-3:
        status: success
        exitCode: 0
        output: "decision: blocked\nwhat: wd-311 withdrawal 800.00 blocked\nwhen: 2026-03-02 10:15 UTC\nwho:  user:1042\nwhy:  risk-v7 fired [new-device-over-500] on amount=800.00 kyc=2 new=true\nsame decision: true\n"

scenes:
  - id: hook
    chapter: Blocked လို့ပဲ သိမ်းရင်
    narration: >-
      ငွေ system တစ်ခုက withdrawal တစ်ခုကို ပိတ်လိုက်တိုင်း ဒါမှမဟုတ် ခွင့်ပြုလိုက်တိုင်း၊ အဲဒီ
      ဆုံးဖြတ်ချက်ကို နှစ်ပေါင်းများစွာ ကြာမှ ရှင်းပြခိုင်းခံရနိုင်ပါတယ်။ [[mark:sel-check]] ဒီ function က
      withdrawal ကို စစ်တဲ့ risk rule ပါ။ KYC ဆိုတာ user ရဲ့ identity ကို ဘယ်အဆင့်ထိ စစ်ပြီးပြီလဲ
      ဆိုတာပါ၊ အဲဒီ level နိမ့်ပြီး ပမာဏ ကြီးရင် ပိတ်ပါတယ်။ device အသစ်ကနေ ယူရို ၅၀၀ ကျော် ထုတ်ရင်လည်း
      ပိတ်ပါတယ်။ code အနေနဲ့ မှားတာ မရှိပါဘူး။ [[mark:sel-w]] user တစ်ယောက်က device အသစ်ကနေ ယူရို
      ရှစ်ရာ ထုတ်ချင်တယ်၊ KYC level က နှစ် ဆိုပါစို့။ ဒီ program က ဘာကြောင့် ပိတ်လဲ ဆိုတာပါ
      ပြောပြနိုင်မလား ခန့်မှန်းကြည့်ပါ။ [[mark:run-1]] run လိုက်ရအောင်။ [[mark:pt-blocked]] blocked
      ဆိုတဲ့ စကားလုံး တစ်လုံးပဲ ထွက်ပါတယ်။ rule နှစ်ခုထဲက ဘယ်ဟာကြောင့်လဲ၊ ဘယ် input တွေကို ကြည့်ပြီး
      ဆုံးဖြတ်ခဲ့လဲ၊ အဲဒီတုန်းက rule ရဲ့ ဘယ် version လဲ ဆိုတာ ဘာမှ မပါပါဘူး။ [[mark:dock-1]] နောက်လမှာ
      limit ကို ပြောင်းလိုက်ရင် ဒီ ဆုံးဖြတ်ချက် ဘယ်လို ရလာခဲ့လဲ ဆိုတာ ဘယ်သူမှ ပြန်ပြောလို့ မရတော့ပါဘူး။
    sources:
      - {
          title: "Fintech Engineering Handbook — Audits and audit trails (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#audits-and-audit-trails",
        }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }
      - id: sel-check
        type: editor.select
        at: { mark: sel-check }
        target:
          {
            file: main.go,
            text: "\tif w.KYCLevel < 2 {\n\t\tif w.Amount > 100000 {\n\t\t\treturn \"blocked\"\n\t\t}\n\t}\n\tif w.NewDevice && w.Amount > 50000 {\n\t\treturn \"blocked\"\n\t}",
            occurrence: 1,
          }
      - id: sel-w
        type: editor.select
        at: { mark: sel-w }
        target:
          { file: main.go, text: "Amount: 80000, KYCLevel: 2, NewDevice: true", occurrence: 1 }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "decision: blocked",
          timeoutMs: 8000,
        }
      - id: pt-blocked
        type: console.point
        at: { mark: pt-blocked }
        target: { text: "decision: blocked", occurrence: 1 }
      - { id: dock-1, type: runtime.collapseDock, at: { mark: dock-1 } }

  - id: asks
    chapter: Audit က ဘာမေးလဲ
    narration: >-
      [[mark:show-asks]] ငွေ system တွေက auditor နဲ့ regulator ရဲ့ စစ်ဆေးမှု အမျိုးမျိုးကို ခံရပါတယ်။
      [[mark:pt-q1]] ပထမ မေးခွန်းက user တွေရဲ့ ငွေကို company ငွေနဲ့ ရောမထားဘူးလား၊ company
      expense အတွက် မသုံးဘူးလား ဆိုတာပါ။ [[mark:pt-q2]] ဒုတိယက revenue တိုင်းကို ရှင်းပြနိုင်လား၊ လ
      တစ်လရဲ့ fee revenue ကို ဘယ် transaction တွေက ဖြစ်စေလဲ ညွှန်ပြနိုင်လား ဆိုတာပါ။ [[mark:asks-2]]
      တတိယက user တွေ၊ အခွန်ရုံးလို ပြင်ပကို ပြောထားတာ အမှန်နဲ့ ကိုက်လား၊ ဥပမာ user တွေကို ပေးစရာ
      ရှိသလောက် asset တကယ် ရှိလား ဆိုတာပါ။ [[mark:pt-q4]] စတုတ္ထက funds ကို ဘယ်သူ ဘယ်လို
      ထိနိုင်လဲ ဆိုတာပါ။ [[mark:asks-3]] ဒီ မေးခွန်းတွေကို လက်ရှိ balance တွေကနေ ဖြေလို့ မရပါဘူး။ state
      ဘယ်လို ဖြစ်လာခဲ့လဲ ဆိုတဲ့ history အပြည့်အစုံ လိုပါတယ်။ [[mark:pt-hist]] အဲဒါကို audit trail လို့
      ခေါ်ပါတယ်။ balance၊ report၊ ဆုံးဖြတ်ချက် တစ်ခုခုကို ရှင်းပြနိုင်၊ ပြန်ထုတ်နိုင်လောက်အောင် ဖြစ်ခဲ့သမျှကို
      အသေးစိတ် မှတ်ထားတဲ့ မှတ်တမ်းပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Audits and audit trails (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#audits-and-audit-trails",
        }
    actions:
      - {
          id: show-asks,
          type: slide.show,
          at: { mark: show-asks, offsetMs: -700 },
          slideId: asks-1,
        }
      - { id: pt-q1, type: slide.point, at: { mark: pt-q1 }, target: { x: 0.275, y: 0.426 } }
      - { id: pt-q2, type: slide.point, at: { mark: pt-q2 }, target: { x: 0.725, y: 0.426 } }
      - { id: asks-2, type: slide.show, at: { mark: asks-2 }, slideId: asks-2 }
      - {
          id: pt-q3,
          type: slide.point,
          at: { afterAction: asks-2 },
          target: { x: 0.275, y: 0.648 },
        }
      - { id: pt-q4, type: slide.point, at: { mark: pt-q4 }, target: { x: 0.725, y: 0.648 } }
      - { id: asks-3, type: slide.show, at: { mark: asks-3 }, slideId: asks-3 }
      - {
          id: pt-state,
          type: slide.point,
          at: { afterAction: asks-3 },
          target: { x: 0.238, y: 0.876 },
        }
      - { id: pt-hist, type: slide.point, at: { mark: pt-hist }, target: { x: 0.763, y: 0.876 } }

  - id: cases
    chapter: စာရင်းက မဖြေနိုင်ခဲ့တဲ့ အခါ
    narration: >-
      [[mark:show-cases]] ဒီ မေးခွန်းတွေကို မဖြေနိုင်ခဲ့တဲ့ တကယ့် အဖြစ် နှစ်ခု ရှိပါတယ်။ [[mark:pt-wnum]]
      ၂၀၂၀ ဇွန် ၁၈ ရက်မှာ Wirecard ရဲ့ auditor EY က ၂၀၁၉ accounts ကို sign off မလုပ်ပေးခဲ့ပါဘူး။ trust
      account တွေထဲမှာ ရှိတယ်လို့ ဆိုထားတဲ့ cash ယူရို ဘီလီယံ တစ်ဒသမ ကိုး တကယ် ရှိကြောင်း confirm
      မလုပ်နိုင်လို့ပါ။ [[mark:pt-wt]] ဇွန် ၂၂ ရက်မှာ Wirecard ကိုယ်တိုင်က အဲဒီ balance တွေ မရှိနိုင်ခြေ
      များတယ်လို့ ပြောပြီး၊ ဇွန် ၂၅ ရက်မှာ insolvency filing လုပ်ခဲ့ပါတယ်။ ဒါက တတိယ မေးခွန်းပါ၊ ပြောထားတဲ့
      asset တကယ် ရှိလား ဆိုတာပါ။ [[mark:cases-2]] ဒုတိယက ledger အပိုင်းမှာ တွေ့ခဲ့ပြီးတဲ့ FTX ပါ၊
      ဒီတစ်ခါ audit ရဲ့ ပထမ မေးခွန်း၊ ဆိုလိုတာက user ငွေကို သီးခြား ထားခဲ့လား ဆိုတဲ့ မေးခွန်းနဲ့ ကြည့်ပါ။
      [[mark:pt-ft]] customer ငွေတွေကို ဆက်စပ် trading ကုမ္ပဏီ တစ်ခုဆီ ထုတ်မပြောဘဲ လွှဲသုံးခဲ့တယ်လို့ SEC
      က စွပ်စွဲခဲ့ပြီး၊ founder ကို jury က ပြစ်မှု ခုနစ်ခုလုံးမှာ အပြစ်ရှိတယ်လို့ ဆုံးဖြတ်ခဲ့ပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Audits and audit trails (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#audits-and-audit-trails",
        }
      - {
          title: "Reuters via ABS-CBN — Missing $2.1 billion likely 'do not exist,' says Wirecard (22 Jun 2020)",
          url: "https://news.abs-cbn.com/business/06/22/20/missing-21-billion-likely-do-not-exist-says-wirecard",
        }
      - {
          title: "SEC press release 2022-219 (13 Dec 2022)",
          url: "https://www.sec.gov/news/press-release/2022-219",
        }
    actions:
      - {
          id: show-cases,
          type: slide.show,
          at: { mark: show-cases, offsetMs: -700 },
          slideId: cases-1,
        }
      - { id: pt-wnum, type: slide.point, at: { mark: pt-wnum }, target: { x: 0.1, y: 0.448 } }
      - { id: pt-wt, type: slide.point, at: { mark: pt-wt }, target: { x: 0.112, y: 0.738 } }
      - { id: cases-2, type: slide.show, at: { mark: cases-2 }, slideId: cases-2 }
      - {
          id: pt-f1,
          type: slide.point,
          at: { afterAction: cases-2 },
          target: { x: 0.575, y: 0.656 },
        }
      - { id: pt-ft, type: slide.point, at: { mark: pt-ft }, target: { x: 0.575, y: 0.738 } }

  - id: record
    chapter: Audit record တစ်ခုမှာ ဘာပါလဲ
    narration: >-
      [[mark:show-record]] record တစ်ခုမှာ ဘာပါရမလဲ ဆိုတာ config ပြောင်းတာ တစ်ခုနဲ့ ကြည့်ရအောင်။
      [[mark:pt-row]] fee table ထဲမှာ card fee က သုံးဒသမ တစ် ရာခိုင်နှုန်း လို့ပဲ ရှိရင် ဘယ်လောက်ကနေ
      ပြောင်းခဲ့လဲ၊ ဘယ်သူ ပြောင်းလဲ၊ ဘာကြောင့်လဲ ဆိုတာ မသိရပါဘူး။ [[mark:pt-what]] ပထမက what ပါ၊
      ဘာ ပြောင်းလဲ ဆိုတာနဲ့ အဟောင်း တန်ဖိုး၊ အသစ် တန်ဖိုး နှစ်ခုလုံး ပါပါတယ်။ [[mark:record-2]] ဒုတိယက
      when ပါ။ ခုနက lesson က value time နဲ့ booking time နှစ်ခုလုံး ဒီမှာ ပါပါတယ်။ [[mark:record-3]]
      တတိယက who ပါ၊ user လား၊ operator လား၊ automated job လား ဆိုတာပါ။ [[mark:pt-why]] နောက်ဆုံးက
      why ပါ။ change request၊ order၊ incident စတဲ့ ဒီ change ကို ဖြစ်စေတဲ့ အရာကို reference နဲ့
      ချိတ်ထားတာပါ။ [[mark:record-4]] ငွေ အရွေ့တွေအတွက်ပဲ trail လိုတာ မဟုတ်ပါဘူး။ balance ကို လက်နဲ့
      ပြင်တဲ့ manual intervention၊ fee၊ limit၊ rate source လို configuration ပြောင်းတာ၊ permission
      ပြောင်းတာ အားလုံး trail လိုပါတယ်။ [[mark:pt-lost]] ဒါက No lost data ဆိုတဲ့ မူပါ၊ ဆိုလိုတာက ငွေနဲ့
      ပတ်သက်ပြီး ဖြစ်ခဲ့သမျှ မပျောက်ရဘူး၊ ဘာကြောင့်လဲဆိုတော့ လက်ရှိ state တစ်ခုတည်းက audit ရဲ့
      မေးခွန်းကို မဖြေနိုင်လို့ပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Audits and audit trails (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#audits-and-audit-trails",
        }
    actions:
      - {
          id: show-record,
          type: slide.show,
          at: { mark: show-record, offsetMs: -700 },
          slideId: record-1,
        }
      - { id: pt-row, type: slide.point, at: { mark: pt-row }, target: { x: 0.128, y: 0.36 } }
      - { id: pt-what, type: slide.point, at: { mark: pt-what }, target: { x: 0.128, y: 0.538 } }
      - { id: record-2, type: slide.show, at: { mark: record-2 }, slideId: record-2 }
      - {
          id: pt-when,
          type: slide.point,
          at: { afterAction: record-2 },
          target: { x: 0.128, y: 0.581 },
        }
      - { id: record-3, type: slide.show, at: { mark: record-3 }, slideId: record-3 }
      - {
          id: pt-who,
          type: slide.point,
          at: { afterAction: record-3 },
          target: { x: 0.128, y: 0.625 },
        }
      - { id: pt-why, type: slide.point, at: { mark: pt-why }, target: { x: 0.128, y: 0.668 } }
      - { id: record-4, type: slide.show, at: { mark: record-4 }, slideId: record-4 }
      - {
          id: pt-kinds,
          type: slide.point,
          at: { afterAction: record-4 },
          target: { x: 0.349, y: 0.92 },
        }
      - { id: pt-lost, type: slide.point, at: { mark: pt-lost }, target: { x: 0.885, y: 0.12 } }

  - id: table
    chapter: Decision table
    narration: >-
      [[mark:close-record]] why က ဆုံးဖြတ်ချက် တစ်ခုရဲ့ ရလဒ် ဖြစ်တာ များပါတယ်၊ ခုနက risk check
      လိုမျိုးပါ။ [[mark:type-table]] ဒီတစ်ခါ rule တွေကို if တွေထဲမှာ ဝှက်မထားဘဲ decision table အနေနဲ့ data
      အဖြစ် ရေးပါမယ်။ table မှာ version နာမည် ရှိပြီး row တစ်ခုက rule တစ်ခုပါ၊ condition အားလုံး မှန်ရင်
      အဲဒီ row က fire ဖြစ်ပါတယ်။ Decide က row တိုင်းကို စစ်ပြီး fire ဖြစ်တဲ့ rule တွေ၊ input တွေ၊ version
      နဲ့ အချိန်ကို record တစ်ခုထဲ ထည့်ပေးပါတယ်။ [[mark:run-2]] run လိုက်ရအောင်။ [[mark:pt-what2]] what
      မှာ withdrawal ရဲ့ id၊ ပမာဏနဲ့ ရလဒ် ပါပါတယ်။ [[mark:pt-who2]] when က ဆုံးဖြတ်ခဲ့တဲ့ အချိန်ဖြစ်ပြီး၊
      who က request ကို စခဲ့တဲ့ user ပါ။ [[mark:pt-why2]] why မှာ rule version၊ fire ဖြစ်တဲ့ rule နဲ့
      ဆုံးဖြတ်ခဲ့တဲ့ input တွေ ပါပါတယ်။ device အသစ်ကနေ ယူရို ၅၀၀ ကျော် ထုတ်တဲ့ rule က fire ဖြစ်ပြီး၊
      KYC rule ကတော့ မဖြစ်ပါဘူး။ [[mark:dock-2]] blocked ဆိုတဲ့ အဖြေ တစ်ခုတည်းအစား၊ အဲဒီ အဖြေ ဘယ်လို
      ရလာလဲ ဆိုတာကိုပါ သိမ်းလိုက်တာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Audits and audit trails (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#audits-and-audit-trails",
        }
    actions:
      - { id: close-record, type: slide.close, at: { mark: close-record } }
      - id: type-table
        type: editor.type
        at: { mark: type-table }
        target: { file: main.go, after: "\tfmt.Println(\"decision:\", check(w))\n", occurrence: 1 }
        text: "\n\triskV7 := Table{Version: \"risk-v7\", Rows: []Row{\n\t\t{Rule: \"low-kyc-over-1000\", MaxKYC: 1, MinAmount: 100001},\n\t\t{Rule: \"new-device-over-500\", NewDevice: true, MinAmount: 50001},\n\t}}\n\trec := riskV7.Decide(w, at(3, 2, 10, 15))\n\tfmt.Print(rec)\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "fired [new-device-over-500]",
          timeoutMs: 8000,
        }
      - id: pt-what2
        type: console.point
        at: { mark: pt-what2 }
        target: { text: "what: wd-311", occurrence: 1 }
      - id: pt-who2
        type: console.point
        at: { mark: pt-who2 }
        target: { text: "who:", occurrence: 1 }
      - id: pt-why2
        type: console.point
        at: { mark: pt-why2 }
        target: { text: "why:", occurrence: 1 }
      - { id: dock-2, type: runtime.collapseDock, at: { mark: dock-2 } }
      - {
          id: expect-file-table,
          type: expect.file,
          at: { afterAction: run-2 },
          path: main.go,
          contains: '{Rule: "new-device-over-500", NewDevice: true, MinAmount: 50001},',
        }

  - id: replay
    chapter: Rule ကို data အဖြစ် ထားရင်
    narration: >-
      [[mark:show-decision]] nested if နဲ့ ရေးထားရင် ရလဒ်ပဲ ထွက်လာပြီး၊ ဘယ် လမ်းကြောင်းကနေ
      ရောက်လာလဲ ဆိုတာ code ထဲမှာပဲ ကျန်ခဲ့ပါတယ်။ [[mark:decision-2]] decision table မှာတော့ rule
      တိုင်းက ကိုယ်ပိုင် နာမည်နဲ့ row တစ်ခုစီ ဖြစ်လို့ ဘယ် row fire ဖြစ်လဲ ထုတ်ပြနိုင်ပါတယ်။ rule တွေက
      data ဖြစ်လို့ version ခွဲ သိမ်းနိုင်ပြီး review လည်း လုပ်နိုင်ပါတယ်။ DMN လို standard၊ Drools လို rules
      engine တွေက ဒီ အယူအဆကို အကြီးစား လုပ်ပေးတာပါ။ [[mark:decision-3]] ဆိုတော့ record ထဲမှာ ရလဒ်တင်
      မဟုတ်ဘဲ input၊ rule version၊ fire ဖြစ်တဲ့ rule သုံးခုလုံး ပါသွားပါတယ်။ ဒီ သုံးခု ရှိရင် ဆုံးဖြတ်ချက်ကို
      နောက်တစ်ခါ ပြန် run ကြည့်လို့ ရပါတယ်။ [[mark:close-decision]] replay လုပ်ကြည့်ရအောင်။
      [[mark:type-replay]] version နာမည်ကနေ table ကို ရှာတဲ့ map တစ်ခု ထားပါတယ်။ replay က record ထဲမှာ
      သိမ်းထားတဲ့ input တွေကို သိမ်းထားတဲ့ version နဲ့ ပြန် စစ်ပြီး၊ ရလဒ်နဲ့ fire ဖြစ်တဲ့ rule တွေ မူလ record
      နဲ့ တူလား ဆိုတာ ပြန်ပေးပါတယ်။ [[mark:run-3]] run လိုက်ရအောင်။ [[mark:pt-same]] ဆုံးဖြတ်ချက်
      အတူတူပဲ ထွက်ပါတယ်။ auditor က ဒီ withdrawal ကို ဘာလို့ ပိတ်လဲ မေးရင် record ကို ပြပြီး ပြန် run
      ပြလို့ ရပါပြီ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Audits and audit trails (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#audits-and-audit-trails",
        }
    actions:
      - {
          id: show-decision,
          type: slide.show,
          at: { mark: show-decision, offsetMs: -700 },
          slideId: decision-1,
        }
      - {
          id: pt-ifs,
          type: slide.point,
          at: { afterAction: show-decision },
          target: { x: 0.104, y: 0.615 },
        }
      - { id: decision-2, type: slide.show, at: { mark: decision-2 }, slideId: decision-2 }
      - {
          id: pt-dt,
          type: slide.point,
          at: { afterAction: decision-2 },
          target: { x: 0.476, y: 0.446 },
        }
      - { id: decision-3, type: slide.show, at: { mark: decision-3 }, slideId: decision-3 }
      - {
          id: pt-stored,
          type: slide.point,
          at: { afterAction: decision-3 },
          target: { x: 0.675, y: 0.719 },
        }
      - { id: close-decision, type: slide.close, at: { mark: close-decision } }
      - id: type-replay
        type: editor.type
        at: { mark: type-replay }
        target: { file: main.go, after: "\tfmt.Print(rec)\n", occurrence: 1 }
        text: "\n\ttables := map[string]Table{riskV7.Version: riskV7}\n\tfmt.Println(\"same decision:\", replay(rec, tables))\n"
        cadence: line-by-line
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "same decision: true",
          timeoutMs: 8000,
        }
      - id: pt-same
        type: console.point
        at: { mark: pt-same }
        target: { text: "same decision: true", occurrence: 1 }

  - id: pitfalls
    chapter: Replay ကို ဘာက ပျက်စေလဲ
    narration: >-
      [[mark:show-pitfalls]] ဒီနေရာကစပြီး စိတ်ဝင်စားစရာ ကောင်းလာပါတယ်။ replay မှန်ဖို့ စည်းကမ်း
      လေးခု ရှိပါတယ်။ [[mark:pt-p1]] ပထမ၊ input တွေကို ဆုံးဖြတ်တဲ့ အချိန်က မြင်ခဲ့တဲ့ အတိုင်း record ထဲ
      သိမ်းရပါမယ်။ replay လုပ်တဲ့အခါ user ရဲ့ KYC level ကို database ကနေ ပြန်ဖတ်ရင် ဒီနေ့ တန်ဖိုးကို
      ရမှာဖြစ်ပြီး အဲဒီတုန်းက တန်ဖိုး မဟုတ်တော့ပါဘူး။ [[mark:pt-p2]] ဒုတိယ၊ rule ကို ပြင်ချင်ရင် row ကို
      တိုက်ရိုက် မပြင်ဘဲ version အသစ် ထုတ်ပြီး version အဟောင်းကိုလည်း ဆက် သိမ်းထားရပါမယ်။ table
      ပြောင်းတာ ကိုယ်တိုင်ကလည်း ဘယ်သူ၊ ဘာကြောင့် ပြောင်းလဲ ဆိုတဲ့ audit record တစ်ခုပါ။ [[mark:pt-p3]]
      တတိယ၊ rule ထဲမှာ လက်ရှိ အချိန်ကို ဖတ်တာ၊ provider ဆီ live call ခေါ်တာ မထားရပါဘူး။ sanctions list
      လို ပြင်ပ data လိုရင် အဲဒီ list ရဲ့ version ကို input အဖြစ် record ထဲ ထည့်ရပါမယ်။ [[mark:pt-p4]]
      စတုတ္ထ၊ ပိတ်တဲ့ ဆုံးဖြတ်ချက်တင် မဟုတ်ဘဲ ခွင့်ပြုတဲ့ ဆုံးဖြတ်ချက်ကိုလည်း မှတ်ရပါမယ်။ ငွေ ထွက်သွားတဲ့
      withdrawal ကို ဘာလို့ ခွင့်ပြုခဲ့လဲ ဆိုတာလည်း မေးခံရနိုင်လို့ပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Audits and audit trails (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#audits-and-audit-trails",
        }
    actions:
      - {
          id: show-pitfalls,
          type: slide.show,
          at: { mark: show-pitfalls, offsetMs: -700 },
          slideId: decision-4,
        }
      - { id: pt-p1, type: slide.point, at: { mark: pt-p1 }, target: { x: 0.225, y: 0.831 } }
      - { id: pt-p2, type: slide.point, at: { mark: pt-p2 }, target: { x: 0.651, y: 0.831 } }
      - { id: pt-p3, type: slide.point, at: { mark: pt-p3 }, target: { x: 0.211, y: 0.926 } }
      - { id: pt-p4, type: slide.point, at: { mark: pt-p4 }, target: { x: 0.575, y: 0.926 } }

  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] Fintech interview တွေမှာ audit trail ထဲမှာ ဘာတွေ ပါရမလဲ၊ blocked လို့ပဲ သိမ်းရင်
      ဘာလို့ မရလဲ ဆိုတာ မေးတတ်ပါတယ်။ log တွေ သိမ်းထားပါတယ် လို့ပဲ ဖြေရင် မလုံလောက်ပါဘူး၊ အချက်
      သုံးချက်နဲ့ ဖြေပါ။ [[mark:iv-a]] ပထမ၊ change တိုင်းမှာ what၊ when၊ who၊ why လေးခု ပါရပြီး၊ ငွေ
      အရွေ့တင် မဟုတ်ဘဲ manual intervention၊ config နဲ့ permission ပြောင်းတာတွေပါ ပါရမယ်။ [[mark:iv-b]]
      ဒုတိယ၊ audit က မေးတာ state မဟုတ်ဘဲ state ဘယ်လို ဖြစ်လာလဲ မေးတာပါ၊ user funds ခွဲထားလား၊ revenue
      ကို transaction အထိ ရှင်းပြနိုင်လား၊ asset က ပေးစရာထက် မနည်းဘူးလား ဆိုတာတွေပါ။ [[mark:iv-c]]
      တတိယ၊ ဆုံးဖြတ်ချက်မှာ ရလဒ်တင် မလုံပါဘူး၊ fire ဖြစ်တဲ့ rule၊ input နဲ့ rule version မပါရင် ဘယ်လို
      ရလာလဲ ဖြေလို့ မရပါဘူး။ [[mark:iv-d]] ပြီးရင် ကိုယ် ဘာလုပ်မလဲ ဆက်ပြောပါ။ rule တွေကို versioned
      decision table အဖြစ် ထားပြီး၊ ခွင့်ပြုတာရော ပိတ်တာပါ record တိုင်းကို replay လုပ်နိုင်အောင် input
      တွေကို အဲဒီ အချိန်က အတိုင်း သိမ်းမယ် ဆိုတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Audits and audit trails (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#audits-and-audit-trails",
        }
    actions:
      - { id: show-iv, type: slide.show, at: { mark: show-iv, offsetMs: -700 }, slideId: iv-1 }
      - {
          id: pt-iv-q,
          type: slide.point,
          at: { afterAction: show-iv },
