# Fintech Engineering, lesson 12: audits and audit trails (Burmese).
#
# Source: Fintech Engineering Handbook, "Audits and audit trails" (CC BY 4.0, Voytek Pitula).
# Start state: main.go checks a withdrawal with nested ifs and prints only "blocked";
# audit.go holds the decision-table engine (Row, Table, Decide, Record, replay).
# Edits, all insert-only:
#   1. the risk rules as a versioned decision table, Decide and print the record -> run-2 (what/when/who/why)
#   2. a version → table map and replay(rec)                                      -> run-3 same decision: true
# Figures: asks (four audit questions; state vs history), cases (Wirecard 2020, FTX 2022–23),
# record (what / when / who / why of a config change; what needs a trail), decision (nested if vs
# decision table vs stored decision; step 4 = what breaks replay, shown again after run 3), iv.
# Built by ~/Documents/fintech-course-work/tools/build-lesson.ts; fixtures by sim-go.ts --write.
