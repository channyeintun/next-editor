build:
  voiceProfile:
    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 9514

runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "#1 deposit  100.00  prev 00000000  hash 977d16f3\n#2 fee        2.90  prev 977d16f3  hash d490183c\n#3 transfer  40.00  prev d490183c  hash 9ea86dfe\npublished head: 9ea86dfe\nverify: ok\n"
      run-2:
        status: success
        exitCode: 0
        output: "#1 deposit  100.00  prev 00000000  hash 977d16f3\n#2 fee        2.90  prev 977d16f3  hash d490183c\n#3 transfer  40.00  prev d490183c  hash 9ea86dfe\npublished head: 9ea86dfe\nverify: ok\nedit: broken at #2: hash does not match its contents\n"
      run-3:
        status: success
        exitCode: 0
        output: "#1 deposit  100.00  prev 00000000  hash 977d16f3\n#2 fee        2.90  prev 977d16f3  hash d490183c\n#3 transfer  40.00  prev d490183c  hash 9ea86dfe\npublished head: 9ea86dfe\nverify: ok\nedit: broken at #2: hash does not match its contents\nrehash: broken at #3: prev is not the hash of #2\n"
      run-4:
        status: success
        exitCode: 0
        output: "#1 deposit  100.00  prev 00000000  hash 977d16f3\n#2 fee        2.90  prev 977d16f3  hash d490183c\n#3 transfer  40.00  prev d490183c  hash 9ea86dfe\npublished head: 9ea86dfe\nverify: ok\nedit: broken at #2: hash does not match its contents\nrehash: broken at #3: prev is not the hash of #2\nrewrite the rest: ok\nhead is published: false\n"

scenes:
  - id: hook
    chapter: ပြင်လို့ရတဲ့ trail က ဘာမှ မသက်သေပြဘူး
    narration: >-
      ledger ထဲက entry တစ်ကြောင်းကို database မှာ UPDATE တစ်ခါ run ပြီး ပြင်လိုက်ရင်၊ record ကို
      ကြည့်ပြီး ဘယ်သူမှ သိနိုင်မှာ မဟုတ်ပါဘူး။ ပြင်လို့ ရတဲ့ မှတ်တမ်းက auditor ကိုရော၊ incident စစ်နေတဲ့ ကိုယ့်ကိုပါ ဘာမှ သက်သေ
      မပြနိုင်ပါဘူး။ ဒါကြောင့် ငွေနဲ့ ပတ်သက်တဲ့ record တွေကို update၊ delete မလုပ်ဘဲ append ပဲ လုပ်ပြီး၊
      အမှားကို ပြင်တာတောင် record အသစ်နဲ့ ပြင်ပါတယ်။ [[mark:q]] ဒါပေမဲ့ ပြင်ခွင့် မပေးထားဘူး ဆိုတာနဲ့၊
      ဘယ်သူမှ မပြင်ခဲ့ဘူး လို့ သက်သေပြနိုင်တာ မတူပါဘူး။ ငွေ system မှာ တကယ် လိုတာက အဲဒီ သက်သေပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Immutability (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#immutability",
        }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }

  - id: layers
    chapter: Immutability ကို အလွှာ သုံးခုနဲ့ ထိန်းမယ်
    narration: >-
      [[mark:show-layers]] Immutability က invariant တစ်ခုပါ။ invariant ဆိုတာ ဘယ်အချိန်မှာမဆို မှန်နေရမယ့်
      အခြေအနေပါ၊ ဒါကြောင့် invariant ကို ထိန်းတဲ့ နည်း သုံးမျိုးလုံး ဒီမှာ သုံးလို့ ရပါတယ်။ [[mark:pt-l1]]
      ပထမက by construction ပါ။ table ကို append-only ထားပြီး၊ application သုံးတဲ့ database role ဆီကနေ
      UPDATE နဲ့ DELETE ခွင့်ကို revoke လုပ်ထားတာပါ။ [[mark:pt-s1]] ဒါဆို application မှာ bug ရှိလည်း၊ သူ့
      credential ပေါက်သွားလည်း posted row ကို ပြင်လို့ မရတော့ပါဘူး။ [[mark:pt-m1]] ဒါပေမဲ့ table ကို
      ပိုင်တဲ့ role၊ migration run တဲ့ role ကတော့ ပြင်နိုင်ဆဲပါ။ [[mark:layers-2]] ဒုတိယက runtime ပါ။
      ledger ရဲ့ type မှာ append ပဲ ရှိပြီး update နဲ့ delete မရှိတော့၊ code အသစ်ထဲမှာ posted record ကို
      ပြင်မိတဲ့ code path ဖြစ်လာဖို့ ခက်ပါတယ်။ [[mark:pt-m2]] ဒါပေမဲ့ application ကို မဖြတ်ဘဲ database ကို
      တိုက်ရိုက် ရောက်တဲ့သူကို ဒီအလွှာက မတားနိုင်ပါဘူး။ [[mark:layers-3]] တတိယက post-factum ပါ။ record
      တွေပေါ်မှာ checksum ဒါမှမဟုတ် hash chain ထားပြီး အချိန်မှန် ပြန် verify လုပ်တာပါ။ [[mark:pt-s3]]
      ဘယ်သူ ပြင်ပြင် ဖမ်းမိတာ ဒီအလွှာ တစ်ခုပဲ ရှိပါတယ်။ [[mark:pt-m3]] ဒါပေမဲ့ ပြင်တာကို မတားပါဘူး၊
      ပြင်ပြီးမှ သိစေတာပါ။ အလွှာ တစ်ခု မဖမ်းနိုင်တာကို နောက်တစ်ခုက ဖမ်းပေးလို့ သုံးခုလုံး လိုပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Immutability (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#immutability",
        }
      - {
          title: "PostgreSQL Documentation — REVOKE",
          url: "https://www.postgresql.org/docs/current/sql-revoke.html",
        }
    actions:
      - {
          id: show-layers,
          type: slide.show,
          at: { mark: show-layers, offsetMs: -700 },
          slideId: layers-1,
        }
      - { id: pt-l1, type: slide.point, at: { mark: pt-l1 }, target: { x: 0.506, y: 0.426 } }
      - { id: pt-s1, type: slide.point, at: { mark: pt-s1 }, target: { x: 0.835, y: 0.322 } }
      - { id: pt-m1, type: slide.point, at: { mark: pt-m1 }, target: { x: 0.813, y: 0.389 } }
      - { id: layers-2, type: slide.show, at: { mark: layers-2 }, slideId: layers-2 }
      - {
          id: pt-c2,
          type: slide.point,
          at: { afterAction: layers-2 },
          target: { x: 0.506, y: 0.653 },
        }
      - { id: pt-m2, type: slide.point, at: { mark: pt-m2 }, target: { x: 0.837, y: 0.617 } }
      - { id: layers-3, type: slide.show, at: { mark: layers-3 }, slideId: layers-3 }
      - {
          id: pt-c3,
          type: slide.point,
          at: { afterAction: layers-3 },
          target: { x: 0.506, y: 0.881 },
        }
      - { id: pt-s3, type: slide.point, at: { mark: pt-s3 }, target: { x: 0.837, y: 0.778 } }
      - { id: pt-m3, type: slide.point, at: { mark: pt-m3 }, target: { x: 0.824, y: 0.844 } }

  - id: chain
    chapter: Hash chain
    narration: >-
      [[mark:show-chain]] hash chain ဆိုတာ record တိုင်းက သူ့ရှေ့က record ရဲ့ hash ကို သိမ်းထားတဲ့
      စာရင်းပါ။ [[mark:pt-git]] Git ရဲ့ commit တွေလည်း ဒီပုံစံပါပဲ၊ commit တိုင်းမှာ parent ရဲ့ hash ပါလို့ပါ။
      [[mark:chain-2]] record တစ်ခုရဲ့ hash ကို သူ့ နံပါတ်၊ ရှေ့က hash နဲ့ transaction ရဲ့
      အကြောင်းအရာ အားလုံးကနေ တွက်ပါတယ်။ ဒါကြောင့် byte တစ်ခု ပြောင်းရင် hash တစ်ခုလုံး
      ပြောင်းသွားပြီး၊ နောက်က record ရဲ့ prev နဲ့ မကိုက်တော့ပါဘူး။ [[mark:chain-3]] နောက်ဆုံး record ရဲ့
      hash ကို head လို့ ခေါ်ပါတယ်။ head တစ်ခုက သူ့ရှေ့က history တစ်ခုလုံးကို ကိုယ်စားပြုပါတယ်၊
      ရှေ့က ဘယ် record ပြောင်းပြောင်း head ပါ ပြောင်းသွားလို့ပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Immutability (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#immutability",
        }
      - {
          title: "Pro Git — Git Internals: Git Objects",
          url: "https://git-scm.com/book/en/v2/Git-Internals-Git-Objects",
        }
    actions:
      - {
          id: show-chain,
          type: slide.show,
          at: { mark: show-chain, offsetMs: -700 },
          slideId: chain-1,
        }
      - {
          id: pt-b2,
          type: slide.point,
          at: { afterAction: show-chain },
          target: { x: 0.5, y: 0.487 },
        }
      - { id: pt-git, type: slide.point, at: { mark: pt-git }, target: { x: 0.223, y: 0.887 } }
      - { id: chain-2, type: slide.show, at: { mark: chain-2 }, slideId: chain-2 }
      - {
          id: pt-formula,
          type: slide.point,
          at: { afterAction: chain-2 },
          target: { x: 0.237, y: 0.624 },
        }
      - { id: chain-3, type: slide.show, at: { mark: chain-3 }, slideId: chain-3 }
      - {
          id: pt-head,
          type: slide.point,
          at: { afterAction: chain-3 },
          target: { x: 0.769, y: 0.624 },
        }

  - id: code
    narration: >-
      [[mark:close-chain]] code မှာ ကြည့်ရအောင်။ [[mark:open-chain]] ledger ရဲ့ type တွေက သီးသန့် ဖိုင်မှာ
      ရှိပြီး၊ chain ရဲ့ code က ဒီဖိုင်မှာပါ။ [[mark:sel-hash]] hash တွက်တဲ့ function က ရှေ့က hash နဲ့
      field တွေကို အစီအစဉ် တစ်ခုတည်းနဲ့ ရေးပြီး string တွေကို quote လုပ်ထားပါတယ်။ field တွေကို ဆက်ရေးတဲ့
      နည်း မရှင်းရင် အကြောင်းအရာ မတူတဲ့ record နှစ်ခုက byte အတူတူ ထွက်လာနိုင်လို့ပါ။ [[mark:sel-append]]
      append လုပ်တဲ့အခါ နောက်ဆုံး record ရဲ့ hash ကို prev အဖြစ် ယူပြီး ချိတ်ပါတယ်။ chain မှာ append
      ကလွဲရင် ရေးတဲ့ method မရှိပါဘူး။ [[mark:open-main-2]] main ထဲမှာတော့ transaction သုံးခုကို append
      လုပ်ပြီး record တစ်ခုချင်းရဲ့ prev နဲ့ hash ကို ထုတ်ပြပါတယ်။ [[mark:sel-published]] ပြီးရင် head ကို
      system အပြင်ဘက် တစ်နေရာကို ကူးထားပါတယ်၊ ဘာကြောင့်လဲ ဆိုတာ နောက်မှ ပြန်လာပါမယ်။ [[mark:run-1]] run
      လိုက်ရအောင်။ [[mark:pt-r2]] ဒုတိယ record ရဲ့ prev က ပထမ record ရဲ့ hash နဲ့ တူပြီး၊ တတိယ record ရဲ့
      prev က ဒုတိယရဲ့ hash နဲ့ တူပါတယ်။ [[mark:pt-ok]] verify က chain တစ်ခုလုံးကို အစကနေ ပြန်တွက်ပြီး ok
      လို့ ပြပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Immutability (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#immutability",
        }
      - { title: "Go standard library — crypto/sha256", url: "https://pkg.go.dev/crypto/sha256" }
    actions:
      - { id: close-chain, type: slide.close, at: { mark: close-chain } }
      - { id: open-chain, type: workspace.openFile, at: { mark: open-chain }, path: chain.go }
      - id: sel-hash
        type: editor.select
        at: { mark: sel-hash }
        target:
          {
            file: chain.go,
            text: 'fmt.Fprintf(h, "%d %q %q %q", r.Seq, r.Prev, r.Tx.ID, r.Tx.Memo)',
            occurrence: 1,
          }
      - id: sel-append
        type: editor.select
        at: { mark: sel-append }
        target: { file: chain.go, text: "prev = c.records[n-1].Hash", occurrence: 1 }
      - { id: open-main-2, type: workspace.openFile, at: { mark: open-main-2 }, path: main.go }
      - id: sel-published
        type: editor.select
        at: { mark: sel-published }
        target:
          {
            file: main.go,
            text: "published := c.Head() // copied to a place outside this system",
            occurrence: 1,
          }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "verify: ok",
          timeoutMs: 8000,
        }
      - id: pt-r2
        type: console.point
        at: { mark: pt-r2 }
        target: { text: "#2 fee", occurrence: 1 }
      - id: pt-ok
        type: console.point
        at: { mark: pt-ok }
        target: { text: "verify: ok", occurrence: 1 }

  - id: tamper
    chapter: Database ကို တိုက်ရိုက် ပြင်ကြည့်မယ်
    narration: >-
      [[mark:type-edit]] အခု database ကို တိုက်ရိုက် ပြင်နိုင်တဲ့ တစ်ယောက်ယောက်လို လုပ်ကြည့်ပါမယ်။ append
      ကို မသုံးဘဲ ဒုတိယ record ရဲ့ fee ကို ယူရို နှစ်ဒသမ ကိုး ကနေ သုည ဒသမ နှစ်ကိုး ဖြစ်အောင် ပြင်ပါတယ်။
      debit ဘက်ရော credit ဘက်ပါ ပြင်ထားလို့ transaction က balance ဖြစ်နေဆဲပါ။ [[mark:run-2]] run
      လိုက်ရအောင်။ [[mark:pt-edit]] verify က ဒုတိယ record မှာ ကျိုးနေတယ်လို့ ပြပါတယ်၊ သိမ်းထားတဲ့ hash က
      ပြင်ပြီးသား အကြောင်းအရာနဲ့ မကိုက်တော့လို့ပါ။ [[mark:dock-2]] သတိထားရမှာက debit နဲ့ credit ညီသလား
      စစ်တဲ့ check တွေက ဒီ ပြင်ဆင်မှုကို လုံးဝ မသိပါဘူး၊ entry တိုင်းက balance ဖြစ်နေတုန်းမို့ပါ။ ဖမ်းမိတာ
      hash တစ်ခုတည်းပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Immutability (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#immutability",
        }
    actions:
      - id: type-edit
        type: editor.type
        at: { mark: type-edit }
        target: { file: main.go, after: "\tfmt.Println(\"verify:\", c.Verify())\n", occurrence: 1 }
        text: "\n\ti := 1 // edited in the database directly, not through Append\n\tc.records[i].Tx.Lines[0].Debit = 29\n\tc.records[i].Tx.Lines[1].Credit = 29\n\tfmt.Println(\"edit:\", c.Verify())\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "edit: broken at #2",
          timeoutMs: 8000,
        }
      - id: pt-edit
        type: console.point
        at: { mark: pt-edit }
        target: { text: "edit: broken at #2", occurrence: 1 }
      - { id: dock-2, type: runtime.collapseDock, at: { mark: dock-2 } }

  - id: rehash
    narration: >-
      [[mark:type-rehash]] ပြင်တဲ့သူက ဒါကို သိရင် ဒုတိယ record ရဲ့ hash ကိုပါ ပြန်တွက်ပြီး
      အစားထိုးမှာပါ။ ဒါဆို verify က ok ပြမလား။ run မလုပ်ခင်
      ခန့်မှန်းကြည့်ပါ။ [[mark:run-3]] run လိုက်ရအောင်။ [[mark:pt-rehash]] ကျိုးတဲ့ နေရာက တတိယ record
      ကို ရွှေ့သွားပါတယ်။ တတိယ record ရဲ့ prev က ဒုတိယ record ရဲ့ hash အဟောင်းကို သိမ်းထားဆဲမို့ပါ။
      [[mark:dock-3]] ဆိုလိုတာက ဖုံးချင်ရင် ပြင်တဲ့ record ကနေ နောက်ဆုံးအထိ record တိုင်းကို ပြန်ရေးရပါတယ်။
      ဒါက ခက်ပေမဲ့ မဖြစ်နိုင်တာ မဟုတ်ပါဘူး၊ database ကို write လုပ်ခွင့် ရှိရင် loop တစ်ခုနဲ့ ရပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Immutability (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#immutability",
        }
    actions:
      - id: type-rehash
        type: editor.type
        at: { mark: type-rehash }
        target: { file: main.go, after: "\tfmt.Println(\"edit:\", c.Verify())\n", occurrence: 1 }
        text: "\n\tc.records[i].Hash = hashOf(c.records[i])\n\tfmt.Println(\"rehash:\", c.Verify())\n"
        cadence: line-by-line
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "rehash: broken at #3",
          timeoutMs: 8000,
        }
      - id: pt-rehash
        type: console.point
        at: { mark: pt-rehash }
        target: { text: "rehash: broken at #3", occurrence: 1 }
      - { id: dock-3, type: runtime.collapseDock, at: { mark: dock-3 } }
      - {
          id: expect-file-rehash,
          type: expect.file,
          at: { afterAction: run-3 },
          path: main.go,
          contains: "c.records[i].Hash = hashOf(c.records[i])",
        }

  - id: anchor
    chapter: Head ကို အပြင်မှာ anchor လုပ်မယ်
    narration: >-
      [[mark:show-anchor]] ဒါကြောင့် database ထဲမှာပဲ ရှိတဲ့ hash chain တစ်ခုတည်းက မလုံလောက်ပါဘူး။
      [[mark:pt-ok-fig]] ဒုတိယ record ကနေ နောက်ဆုံးအထိ hash အားလုံး ပြန်တွက်လိုက်ရင် verify က ok
      ပြပါတယ်၊ database ကို ပြင်နိုင်တဲ့သူက အဲဒီထဲက chain ကိုလည်း ပြင်နိုင်လို့ပါ။ [[mark:anchor-2]]
      ဖြေရှင်းနည်းက head ကို ကိုယ့် database အပြင်၊ ပြင်တဲ့သူ မရောက်နိုင်တဲ့ နေရာမှာ မှတ်ထားတာပါ။
      [[mark:pt-where]] အခြား team တစ်ခုရဲ့ system ဖြစ်ဖြစ်၊ auditor ဆီ ပို့ပြီးသား statement ဖြစ်ဖြစ်
      ရပါတယ်။ [[mark:anchor-3]] ပြန်ရေးထားတဲ့ chain ရဲ့ head က အပြင်မှာ မှတ်ထားတဲ့ head နဲ့
      မကိုက်တော့လို့ ချက်ချင်း သိပါတယ်။ ဖုံးချင်ရင် အပြင်က မှတ်တမ်းကိုပါ ပြင်ရမှာမို့ system တစ်ခုတည်းကို
      ရောက်ရုံနဲ့ မရတော့ပါဘူး။ [[mark:close-anchor]] code နဲ့ စမ်းကြည့်ရအောင်။ [[mark:type-rewrite]] ဒီ
      loop က ပြင်ထားတဲ့ record နောက်က record တိုင်းရဲ့ prev နဲ့ hash ကို ပြန်တွက်ပါတယ်။ ပြီးရင် chain ကို
      verify လုပ်ပြီး၊ head ကို အစက ကူးထားတဲ့ head နဲ့ ယှဉ်ပါတယ်။ [[mark:run-4]] run လိုက်ရအောင်။
      [[mark:pt-rewrite]] chain ကိုယ်တိုင်က ok လို့ ပြပါတယ်။ [[mark:pt-false]] ဒါပေမဲ့ head က အပြင်မှာ
      ထားတဲ့ head နဲ့ မတူတော့ပါဘူး။ chain က ဘယ်နေရာ ပြင်လဲ ဆိုတာကို ပြပြီး၊ anchor က chain ကိုယ်တိုင်
      ပြန်ရေးခံရတာကို ဖမ်းပါတယ်။ သတိထားရမှာက hash chain က ရေးပြီးမှ ပြင်တာကိုပဲ သက်သေပြတာပါ၊ ရေးတဲ့
      အချိန်ကတည်းက မှားနေတဲ့ entry ကိုတော့ မဖမ်းပါဘူး။
    sources:
      - {
          title: "Fintech Engineering Handbook — Immutability (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#immutability",
        }
    actions:
      - {
          id: show-anchor,
          type: slide.show,
          at: { mark: show-anchor, offsetMs: -700 },
          slideId: anchor-1,
        }
      - {
          id: pt-ok-fig,
          type: slide.point,
          at: { mark: pt-ok-fig },
          target: { x: 0.126, y: 0.758 },
        }
      - { id: anchor-2, type: slide.show, at: { mark: anchor-2 }, slideId: anchor-2 }
      - {
          id: pt-pub,
          type: slide.point,
          at: { afterAction: anchor-2 },
          target: { x: 0.803, y: 0.809 },
        }
      - { id: pt-where, type: slide.point, at: { mark: pt-where }, target: { x: 0.713, y: 0.582 } }
      - { id: anchor-3, type: slide.show, at: { mark: anchor-3 }, slideId: anchor-3 }
      - {
          id: pt-newhead,
          type: slide.point,
          at: { afterAction: anchor-3 },
          target: { x: 0.431, y: 0.758 },
        }
      - { id: close-anchor, type: slide.close, at: { mark: close-anchor } }
      - id: type-rewrite
        type: editor.type
        at: { mark: type-rewrite }
        target: { file: main.go, after: "\tfmt.Println(\"rehash:\", c.Verify())\n", occurrence: 1 }
        text: "\n\tfor j := i + 1; j < len(c.records); j++ {\n\t\tc.records[j].Prev = c.records[j-1].Hash\n\t\tc.records[j].Hash = hashOf(c.records[j])\n\t}\n\tfmt.Println(\"rewrite the rest:\", c.Verify())\n\tfmt.Println(\"head is published:\", c.Head() == published)\n"
        cadence: line-by-line
      - { id: run-4, type: runtime.run, at: { mark: run-4, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-4,
          type: expect.output,
          at: { afterAction: run-4 },
          contains: "head is published: false",
          timeoutMs: 8000,
        }
      - id: pt-rewrite
        type: console.point
        at: { mark: pt-rewrite }
        target: { text: "rewrite the rest: ok", occurrence: 1 }
      - id: pt-false
        type: console.point
        at: { mark: pt-false }
        target: { text: "head is published: false", occurrence: 1 }

  - id: edge
    chapter: Report မပို့ခင်နဲ့ ပို့ပြီးနောက်
    narration: >-
      [[mark:show-edge]] ဒါဆို ဘယ်တော့မှ ပြင်လို့ မရဘူးလား။ bug ဆိုတာ ရှောင်လို့ မရတာမို့ log ကို
      နေရာမှာတင် ပြင်တာက ပိုလွယ်တဲ့ အခါတွေ ရှိပါတယ်။ [[mark:pt-close]] ဆုံးဖြတ်ဖို့ ကြည့်ရမှာက reporting
      schedule ပါ။ data ကို ပြန်မပြင်ရတော့တာက များသောအားဖြင့် အပြင်ကို report လုပ်ပြီးမှပါ၊ ဥပမာ လကုန်မှာ
      financial statement ပို့ပြီးတဲ့ အချိန်ပါ။ အဲဒီ မတိုင်ခင်၊ data က system ထဲကနေ မထွက်သေးခင် အမှားကို
      တွေ့ရင် နေရာမှာတင် ပြင်လို့ ရနိုင်ပါသေးတယ်။ [[mark:pt-before]] ဒါပေမဲ့ hash chain ပေါ်မှာ နေရာမှာတင်
      ပြင်တာက ခုနက loop နဲ့ operation အတူတူပါ။ ပြင်ဆင်မှုနဲ့ ခိုးပြင်တာ ကွာတာက process ပဲ ဖြစ်လို့၊ ဘယ်သူ
      ပြင်လဲ၊ ဘာကြောင့်လဲ ဆိုတာကို သီးသန့် မှတ်တမ်းတင်ရပါတယ်။ [[mark:edge-2]] statement ပို့ပြီး head ကို
      anchor လုပ်လိုက်တဲ့ အချိန်ကစပြီး ပြင်ရင် anchor နဲ့ မကိုက်တော့လို့ system ကိုယ်တိုင်က ဖမ်းပါတယ်။
      [[mark:pt-after]] အဲဒီနောက် အမှားကို original နဲ့ ချိတ်ထားတဲ့ entry အသစ်နဲ့ပဲ ပြင်ပါတယ်။
      [[mark:principle]] ဒါက no trust ဆိုတဲ့ မူပါ၊ ဘယ်သူ့ကိုမှ ကိုယ့် component ကိုတောင် အလိုလို မယုံရဘူး
      ဆိုတာပါ။ ပြင်လို့ ရတဲ့ history ကို အပြင်လူရော ကိုယ်ကိုယ်တိုင်ပါ မယုံနိုင်ပါဘူး။
    sources:
      - {
          title: "Fintech Engineering Handbook — Immutability (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#immutability",
        }
      - {
          title: "Fintech Engineering Handbook — Principles (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#principles",
        }
    actions:
      - {
          id: show-edge,
          type: slide.show,
          at: { mark: show-edge, offsetMs: -700 },
          slideId: edge-1,
        }
      - { id: pt-close, type: slide.point, at: { mark: pt-close }, target: { x: 0.583, y: 0.613 } }
      - {
          id: pt-before,
          type: slide.point,
          at: { mark: pt-before },
          target: { x: 0.294, y: 0.853 },
        }
      - { id: edge-2, type: slide.show, at: { mark: edge-2 }, slideId: edge-2 }
      - {
          id: pt-lock,
          type: slide.point,
          at: { afterAction: edge-2 },
          target: { x: 0.583, y: 0.613 },
        }
      - { id: pt-after, type: slide.point, at: { mark: pt-after }, target: { x: 0.738, y: 0.853 } }

  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] Fintech interview တွေမှာ ledger ကို ဘယ်သူမှ မပြင်ခဲ့ဘူး ဆိုတာ ဘယ်လို
      သက်သေပြမလဲ လို့ မေးတတ်ပါတယ်။ ပြင်ခွင့် မပေးထားပါဘူး လို့ပဲ ဖြေရင် မလုံလောက်ပါဘူး။ အချက်
      သုံးချက်နဲ့ ဖြေပါ။ [[mark:iv-a]] ပထမ၊ by construction ပါ။ application ရဲ့ database role မှာ UPDATE
      နဲ့ DELETE ခွင့် မရှိပြီး၊ အမှားကို entry အသစ်နဲ့ပဲ ပြင်တယ် လို့ ပြောပါ။ [[mark:iv-b]] ဒုတိယ၊
      runtime မှာ ledger ရဲ့ API က append ပဲ ပေးလို့ posted record ကို ပြင်တဲ့ code path မရှိပါဘူး။
      [[mark:iv-c]] တတိယ၊ hash chain ကို အချိန်မှန် verify လုပ်ပြီး head ကို system အပြင်မှာ anchor
      လုပ်ထားလို့ database admin က ပြင်ရင်တောင် သိနိုင်ပါတယ်။ [[mark:iv-d]] ပြီးရင် အလွှာ တစ်ခုစီက
      ဘာကို မဖမ်းနိုင်လဲ ဆိုတာနဲ့၊ period ပိတ်တိုင်း head ကို anchor လုပ်မယ် ဆိုတာ ဆက်ပြောပါ။ trade-off
      ကို သိတယ် ဆိုတာ ဒီအပိုင်းက ပြပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Immutability (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#immutability",
        }
