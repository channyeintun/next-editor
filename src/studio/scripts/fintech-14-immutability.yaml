  - id: try-it
    chapter: ကိုယ်တိုင် စမ်းကြည့်ပါ
    narration: >-
      [[mark:close-iv]] ကိုယ်တိုင် စမ်းကြည့်ဖို့ တစ်ခု ရှိပါတယ်။ [[mark:sel-try]] ဒီ index ကို တစ် ကနေ
      နှစ် ပြောင်းပြီး၊ ဆိုလိုတာက နောက်ဆုံး record ကို ပြင်ပြီး run ကြည့်ပါ။ hash ကို ပြန်တွက်လိုက်တာနဲ့
      verify က ok ပြပါလိမ့်မယ်၊ နောက်ဆုံး record နောက်မှာ သူ့ကို စစ်ပေးမယ့် record မရှိလို့ပါ။
      [[mark:try-why]] ဖမ်းမိတာ အပြင်မှာ ထားတဲ့ head တစ်ခုတည်းပါ၊ ဒါကြောင့် anchor မလုပ်ရသေးတဲ့ record
      အသစ်တွေက အကာအကွယ် အနည်းဆုံးပါ။ [[mark:recap]] ပြန်ချုပ်ရရင်၊ ပြင်ခွင့် မပေးတဲ့ database၊ append ပဲ
      ပေးတဲ့ API နဲ့ အပြင်မှာ anchor လုပ်ထားတဲ့ hash chain သုံးခုလုံး ပေါင်းမှ ledger ကို ဘယ်သူမှ
      မပြင်ခဲ့ဘူးလို့ သက်သေပြနိုင်ပါတယ်။ နောက် lesson မှာတော့ post လုပ်ပြီးသား entry မှားနေရင် history ကို
      မထိဘဲ ဘယ်လို ပြင်မလဲ ဆိုတာ ကြည့်ပါမယ်။
    sources:
