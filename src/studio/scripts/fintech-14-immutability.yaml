# Fintech Engineering, lesson 14: immutability and tamper evidence (Burmese).
#
# Source: Fintech Engineering Handbook, "Immutability" (CC BY 4.0, Voytek Pitula).
# Start state: ledger.go (Line, Tx, cents from kit/go/ledger.go), chain.go (Record, Chain with
# Append only, hashOf, Head, Verify), main.go appends three transactions, prints each record's
# prev and hash, copies the head outside ("published") and verifies.
# Edits, all insert-only, in main.go:
#   1. edit record #2's amount in place, both sides  -> run-2 prints "edit: broken at #2"
#   2. recompute record #2's hash                    -> run-3 prints "rehash: broken at #3"
#   3. recompute every record after it               -> run-4 prints "rewrite the rest: ok" and
#                                                       "head is published: false"
# Figures: layers (three ways to enforce it), chain (records linked by hashes), anchor (the head
# kept outside the database), edge (in-place fixes before the report, corrections after), iv.
# Built by ~/Documents/fintech-course-work/tools/build-lesson.ts; fixtures by sim-go.ts --write.
