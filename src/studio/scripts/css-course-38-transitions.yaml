build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 4138

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  - id: intro
    chapter: "Transition ဆိုတာ ဘာလဲ"
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ blend mode နဲ့ အရောင်တွေကို နောက်က အလွှာတွေနဲ့ ရောခဲ့ပြီး၊
      course ရဲ့ အလှဆင်တဲ့ အပိုင်း ပြီးသွားပါပြီ။ ဒီ lesson ကစပြီး page ပေါ်က အရာတွေ
      လှုပ်ရှားလာပါမယ်။ [[mark:start-server]] ဒီလို ပြောနေတုန်းမှာပဲ၊ board နောက်မှာ dev
      server ကို စ နေပါပြီ။ [[mark:draw-states]] element တွေမှာ state တွေ ရှိပါတယ်။ menu
      က ပွင့်တာ ပိတ်တာ၊ ခလုတ်က ပုံမှန်နဲ့ active ဖြစ်တာမျိုးပါ။ state တစ်ခုစီမှာ style
      ကိုယ်စီ ရှိနိုင်ပါတယ်။ [[mark:draw-jump]] state ပြောင်းတဲ့အခါ CSS က style အသစ်ကို
      frame တစ်ခုတည်းမှာ ပြောင်းထည့်လို့၊ ကြားမှာ ဘာမှ မရှိပါဘူး။ transition ဆိုတာ
      ချက်ချင်း မခုန်ဘဲ အချိန်ယူပြီး ဖြည်းဖြည်း ပြောင်းစေတာပါ။ ခုန်တာကို အရင်
      ကြည့်ရအောင်။
    sources:
      - title: "web.dev Learn CSS — Transitions"
        url: "https://web.dev/learn/css/transitions"
      - title: "MDN — Using CSS transitions"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_transitions/Using_CSS_transitions"
      - title: "CSS Transitions Level 1"
        url: "https://www.w3.org/TR/css-transitions-1/"
    actions:
      - id: open-states-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [s-title]
      # Runs in the background (boot + pnpm install + spawn); waitForReady sits
      # on the preview mark at the end of the code tour, well over 40 s later.
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 45000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-states
        type: whiteboard.apply
        at: { mark: draw-states }
        upsertIds: [s-normal, s-normal-l, s-active, s-active-l]
        drawMs: 2000
      - id: draw-jump
        type: whiteboard.apply
        at: { mark: draw-jump }
        upsertIds: [s-jump, s-jump-l]
        drawMs: 1400

  - id: code-tour
    narration: >
      [[mark:close-states]] page ကို ကြည့်ရအောင်။ [[mark:open-index]] ဒါက HTML ဖိုင်ပါ။
      [[mark:select-form]] အပေါ်ဆုံးမှာ အော်ဒါ form ရှိပြီး၊ သူ့ထဲမှာ အော်ဒါ ခလုတ်
      ပါပါတယ်။ [[mark:select-toggle]] သူ့အောက်က ပြောင်းမယ် ခလုတ်က script တိုတို တစ်ခုနဲ့
      အော်ဒါ ခလုတ်မှာ class တစ်ခု ထည့်လိုက် ဖြုတ်လိုက် လုပ်ပေးပါတယ်။
      [[mark:select-slide]] နောက်မှ ပေးမယ့် အမြန်နှုန်း ပုံစံအတိုင်း နာမည် တပ်ထားတဲ့
      chip သုံးခု ရှိပါတယ်။ [[mark:select-drinks-controls]] သောက်စရာ menu မှာ menu
      ဖွင့်တဲ့ ခလုတ်နဲ့ ယနေ့ အထူး card ကို မြှင့်တဲ့ ခလုတ် ရှိပါတယ်။
      [[mark:select-photo]] gallery ဓာတ်ပုံကို ရောင်းကုန်ပြီလို့ မှတ်ထားပြီး၊
      အောက်ဆုံးမှာ lesson 11 က လက်ဖက်ရည် ခွက် ရှိပါတယ်။ [[mark:open-styles]] CSS
      ဖိုင်ကတော့ အလွတ်ဖြစ်လို့၊ state ပြောင်းရင် ချက်ချင်း ခုန်သွားမှာပါ။
      [[mark:preview-opens]] preview ပွင့်လာပါပြီ။ အော်ဒါ ခလုတ်က အညိုရောင် ဖြစ်ပြီး၊
      chip တွေက ဘယ်ဘက်မှာ ရှိပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Transitions: transition triggers (a class from JavaScript)"
        url: "https://web.dev/learn/css/transitions#transition_triggers"
      - title: "MDN — Element.classList"
        url: "https://developer.mozilla.org/en-US/docs/Web/API/Element/classList"
    actions:
      - id: close-states-board
        type: whiteboard.apply
        at: { mark: close-states }
        open: false
      - id: open-index
        type: workspace.openFile
        at: { mark: open-index }
        path: index.html
      - id: select-form
        type: editor.select
        at: { mark: select-form }
        target:
          {
            file: index.html,
            text: '<button class="order-btn" type="button" data-testid="order-button">',
            occurrence: 1,
          }
      - id: select-toggle
        type: editor.select
        at: { mark: select-toggle }
        target:
          {
            file: index.html,
            text: 'data-toggle-class="is-active" data-target=".order-btn"',
            occurrence: 1,
          }
      - id: select-slide
        type: editor.select
        at: { mark: select-slide }
        target:
          {
            file: index.html,
            text: "<span>linear</span>\n          <span>ease</span>\n          <span>ease-out</span>",
            occurrence: 1,
          }
      - id: select-drinks-controls
        type: editor.select
        at: { mark: select-drinks-controls }
        target: { file: index.html, text: 'data-toggle-class="is-open"', occurrence: 1 }
      - id: select-photo
        type: editor.select
        at: { mark: select-photo }
        target:
          {
            file: index.html,
            text: '<figure class="photo sold-out" data-testid="photo">',
            occurrence: 1,
          }
      - id: open-styles
        type: workspace.openFile
        at: { mark: open-styles }
        path: styles.css
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { mark: preview-opens }
        timeoutMs: 20000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-dev-server }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-shop-name
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: shop-name }
        textContains: "ရွှေလက်ဖက်ရည်ဆိုင်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-order-button
        type: expect.preview
        at: { afterAction: expect-shop-name }
        timeoutMs: 5000
        target: { by: testId, value: order-button }
        attribute: { name: class, value: "order-btn" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: collapse-runner-dock
        type: runtime.collapseDock
        at: { afterAction: expect-order-button }

  - id: instant
    narration: >
      [[mark:type-active]] ပထမဆုံး အော်ဒါ ခလုတ်ရဲ့ active state ကို ရေးပါမယ်။ ခလုတ်မှာ
      active class ရှိရင် နောက်ခံက အစိမ်းရောင် ဖြစ်ပါမယ်။ အဲဒီ class မရှိသေးလို့၊
      အခုတော့ ဘာမှ မပြောင်းသေးပါဘူး။ [[mark:click-active]] ပြောင်းမယ် ခလုတ်ကို
      နှိပ်ကြည့်ရအောင်။ [[mark:after-active]] အော်ဒါ ခလုတ်က တစ်ချက်တည်းနဲ့ အစိမ်း
      ဖြစ်သွားပါပြီ။ frame တစ်ခုမှာ အညို၊ နောက် frame မှာ အစိမ်းပါ။
      [[mark:select-active]] ဒီ selector ကို ကြည့်ပါ။ click က class တစ်ခု ထည့်ပေးရုံပါ။
      အဲဒီအခါ ဒီ rule က ကိုက်လာလို့၊ နောက်ခံ အရောင် ချက်ချင်း ပြောင်းသွားတာပါ။
    sources:
      - title: "web.dev Learn CSS — Transitions (states switch instantly)"
        url: "https://web.dev/learn/css/transitions"
      - title: "MDN — Using CSS transitions"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_transitions/Using_CSS_transitions"
    actions:
      - id: type-active
        type: editor.type
        at: { mark: type-active }
        cadence: fast-explainer
        target: { file: styles.css, after: "", occurrence: 1 }
        text: ".order-btn.is-active {\n  background: darkgreen;\n}\n"
      - id: click-active
        type: preview.click
        at: { mark: click-active, offsetMs: 400 }
        timeoutMs: 5000
        target: { by: testId, value: toggle-active }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-active
        type: expect.preview
        at: { mark: after-active }
        timeoutMs: 4000
        target: { by: testId, value: order-button }
        attribute: { name: class, value: "order-btn is-active" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-active
        type: editor.select
        at: { mark: select-active }
        target: { file: styles.css, text: ".order-btn.is-active", occurrence: 1 }

  - id: interpolation
    narration: >
      [[mark:open-frames]] transition က ဒီ ကွက်လပ်ကို ဖြည့်ပေးပါတယ်။ [[mark:draw-ends]]
      တစ်ဖက်မှာ အရင် တန်ဖိုး၊ နောက်တစ်ဖက်မှာ တန်ဖိုး အသစ် ရှိပါတယ်။ [[mark:draw-frames]]
      ကြားထဲက တန်ဖိုးတွေကိုတော့ ကိုယ် ပေးတဲ့ အချိန်အတွင်းမှာ browser က frame တိုင်း
      တွက်ပေးပါတယ်။ အဲဒါကို interpolation လို့ ခေါ်ပါတယ်။ ဒါကြောင့် user က ဘာ ဘယ်လို
      ပြောင်းသွားလဲ ဆိုတာ လိုက်မြင်ရပါတယ်။ [[mark:draw-trigger]] ဒါပေမဲ့ transition က
      သူ့ဘာသာ ဘယ်တော့မှ မစပါဘူး။ class ထည့်တာ၊ pseudo-class ကိုက်လာတာမျိုးကြောင့်
      computed value တစ်ခု အရင် ပြောင်းမှ စပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Transitions (interpolation)"
        url: "https://web.dev/learn/css/transitions"
      - title: "CSS Transitions Level 1 — starting of transitions"
        url: "https://www.w3.org/TR/css-transitions-1/#starting"
      - title: "MDN — Using CSS transitions"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_transitions/Using_CSS_transitions"
    actions:
      - id: open-frames-board
        type: whiteboard.apply
        at: { mark: open-frames }
        open: true
        upsertIds: [s-strike]
        drawMs: 700
      - id: draw-ends
        type: whiteboard.apply
        at: { mark: draw-ends }
        upsertIds: [a-old, a-old-l, a-new, a-new-l]
        drawMs: 1800
      - id: draw-frames
        type: whiteboard.apply
        at: { mark: draw-frames }
        upsertIds: [a-f1, a-f2, a-f3, a-f4, a-f5, a-interp]
        drawMs: 3000
      - id: draw-trigger
        type: whiteboard.apply
        at: { mark: draw-trigger }
        upsertIds: [a-trigger]
        drawMs: 1600

  - id: duration
    chapter: "Transition ကို ဖွင့်ရအောင်"
    narration: >
      [[mark:close-frames]] editor ထဲ ပြန်သွားရအောင်။ [[mark:type-duration]] အော်ဒါ
      ခလုတ်အတွက် rule အသစ် တစ်ခုမှာ transition ကို 500 millisecond ကြာချိန် ပေးပါမယ်။
      state ပြောင်းတာ မရှိသေးလို့၊ ရိုက်နေတုန်း ဘာမှ မလှုပ်ပါဘူး။ [[mark:click-off]]
      ပြောင်းမယ် ခလုတ်ကို ထပ်နှိပ်ပါမယ်။ [[mark:after-off]] အစိမ်းက စက္ကန့် တစ်ဝက်အတွင်း
      အညိုကို ဖြည်းဖြည်း ပြန်ပြောင်းသွားပါပြီ။ [[mark:click-on]] ထပ်နှိပ်ပါမယ်။
      [[mark:after-on]] အစိမ်းဘက်ကိုလည်း ဖြည်းဖြည်း ပြောင်းပါတယ်။ ဒီ rule က state
      နှစ်ခုလုံးမှာ ကိုက်လို့ နှစ်ဘက်လုံး ချောမွေ့တာပါ။ [[mark:select-duration]] ဒီ
      transition duration ကို ကြည့်ပါ။ သူ့ initial value က 0 စက္ကန့် ဖြစ်ပြီး၊ 0 ဆိုရင်
      transition လုံးဝ မဖြစ်ပါဘူး။ ဒါကြောင့် transition ကို ဖွင့်ပေးတာက ကြာချိန်ပါ။
      [[mark:explain-all]] ကိုယ်က ဘယ် property လဲ မပြောခဲ့ပါဘူး။ transition property ရဲ့
      initial value က all ဖြစ်လို့၊ transition ဖြစ်နိုင်တာ အားလုံး ဖြစ်သွားတာပါ။
      [[mark:type-property]] လိုချင်တဲ့ property ကိုပဲ ရွေးပေးရအောင်။ ဒီ ခလုတ်မှာ
      ပြောင်းတာက နောက်ခံ အရောင် တစ်ခုတည်းပါ။ [[mark:explain-why-list]] all ဆိုရင်
      မရည်ရွယ်တဲ့ ပြောင်းလဲမှုတွေပါ ဖြည်းဖြည်း ပြောင်းပြီး browser အလုပ်လည်း
      ပိုများပါတယ်။ ရွေးပေးရင် ဘာ လှုပ်မလဲ ရှင်းရှင်း သိရပါတယ်။
      [[mark:explain-longhands]] ကျန်တဲ့ longhand နှစ်ခုက timing function နဲ့ delay
      ဖြစ်ပြီး၊ transition shorthand က လေးခုလုံးကို တစ်ခါတည်း ပေးပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Transitions: transition-duration"
        url: "https://web.dev/learn/css/transitions#transition-duration"
      - title: "web.dev Learn CSS — Transitions: transition-property"
        url: "https://web.dev/learn/css/transitions#transition-property"
      - title: "MDN — transition-duration (initial value 0s)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/transition-duration"
      - title: "MDN — transition-property (initial value all)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/transition-property"
      - title: "MDN — transition (the four longhands)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/transition"
    actions:
      - id: close-frames-board
        type: whiteboard.apply
        at: { mark: close-frames }
        open: false
      - id: type-duration
        type: editor.type
        at: { mark: type-duration }
        cadence: fast-explainer
        target: { file: styles.css, after: "  background: darkgreen;\n}\n", occurrence: 1 }
        text: "\n.order-btn {\n  transition-duration: 500ms;\n}\n"
      - id: click-off
        type: preview.click
        at: { mark: click-off, offsetMs: 400 }
        timeoutMs: 5000
        target: { by: testId, value: toggle-active }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-off
        type: expect.preview
        at: { mark: after-off }
        timeoutMs: 4000
        target: { by: testId, value: order-button }
        attribute: { name: class, value: "order-btn" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: click-on
        type: preview.click
        at: { mark: click-on }
        timeoutMs: 5000
        target: { by: testId, value: toggle-active }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-on
        type: expect.preview
        at: { mark: after-on }
        timeoutMs: 4000
        target: { by: testId, value: order-button }
        attribute: { name: class, value: "order-btn is-active" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-duration
        type: editor.select
        at: { mark: select-duration }
        target: { file: styles.css, text: "transition-duration: 500ms;", occurrence: 1 }
      - id: type-property
        type: editor.type
        at: { mark: type-property }
        cadence: fast-explainer
        target: { file: styles.css, after: "  transition-duration: 500ms;\n", occurrence: 1 }
        text: "  transition-property: background-color;\n"

  - id: easing
    chapter: "Easing ဆိုတာ ဘာလဲ"
    narration: >
      [[mark:type-slide]] အခု chip တွေဆီ သွားရအောင်။ ဒီတစ်ခါ shorthand ကို သုံးပါမယ်။
      property က translate ဖြစ်ပြီး၊ လိုက်ကြည့်လို့ ရလောက်အောင် ကြာချိန်ကို 3 စက္ကန့်
      ပေးပါမယ်။ [[mark:type-moved]] ရွှေ့ထားတဲ့ state မှာ chip တွေက ညာဘက်ကို 160 pixel
      ရွေ့သွားပါမယ်။ lesson 14 မှာ မြင်ခဲ့သလို၊ translate က ဘေးက box တွေကို မတွန်းဘဲ
      ရွှေ့ပါတယ်။ [[mark:click-move]] ရွှေ့မယ် ခလုတ်ကို နှိပ်ကြည့်ရအောင်။
      [[mark:after-move]] သုံးခုလုံး အတူတူ ရွေ့သွားပါပြီ။ အစမှာ နှေး၊ အလယ်မှာ မြန်ပြီး၊
      အဆုံးမှာ နှေးပါတယ်။ easing ဆိုတာ ပြောင်းလဲမှု တစ်လျှောက် အမြန်နှုန်း ဘယ်လို
      ပြောင်းမလဲ ဆိုတာပါ။ default က linear မဟုတ်ဘဲ ease ပါ။ [[mark:type-easings]] အခု
      timing function longhand နဲ့ ပထမ chip ကို linear၊ တတိယ chip ကို ease out ပေးပါမယ်။
      အလယ်က chip ကတော့ default ease အတိုင်း ကျန်ပါတယ်။ chip တွေကို ပြန်ပို့ပြီး သေချာ
      ကြည့်ရအောင်။ [[mark:click-back]] linear chip က အမြန်နှုန်း တစ်သမတ်တည်းနဲ့
      သွားပါတယ်။ ease out chip ကတော့ အစမှာ မြန်ပြီး၊ အဆုံးမှာ ဖြည်းဖြည်း ရပ်သွားလို့
      ပိုသဘာဝ ကျပါတယ်။ [[mark:explain-curves]] ကိုယ်ပိုင် curve တွေနဲ့ steps ကိုတော့
      lesson 39 မှာ ကြည့်ပါမယ်။ chip တွေ သွားနေတုန်း ထပ်နှိပ်ရင်တော့၊ ရောက်နေတဲ့
      နေရာကနေပဲ ပြန်လှည့်လာပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Transitions: transition-timing-function"
        url: "https://web.dev/learn/css/transitions#transition-timing-function"
      - title: "MDN — transition-timing-function (initial value ease)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/transition-timing-function"
      - title: "MDN — translate"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/translate"
      - title: "CSS Transitions Level 1 — faster reversing of interrupted transitions"
        url: "https://www.w3.org/TR/css-transitions-1/#reversing"
    actions:
      - id: type-slide
        type: editor.type
        at: { mark: type-slide }
        cadence: fast-explainer
        target:
          {
            file: styles.css,
            after: "  transition-property: background-color;\n}\n",
            occurrence: 1,
          }
        text: "\n.slide-row span {\n  transition: translate 3s;\n}\n"
      - id: type-moved
        type: editor.type
        at: { mark: type-moved }
        cadence: fast-explainer
        target: { file: styles.css, after: "  transition: translate 3s;\n}\n", occurrence: 1 }
        text: "\n.slide-row.is-moved span {\n  translate: 160px 0;\n}\n"
      - id: click-move
        type: preview.click
        at: { mark: click-move, offsetMs: 400 }
        timeoutMs: 5000
        target: { by: testId, value: toggle-move }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-moved
        type: expect.preview
        at: { mark: after-move }
        timeoutMs: 4000
        target: { by: testId, value: slide-row }
        attribute: { name: class, value: "slide-row is-moved" }
        retry: { maxAttempts: 3, delayMs: 300 }
      # line-by-line: each revealed line is a complete one-line rule, so the
      # nth-child( parenthesis never stands open.
      - id: type-easings
        type: editor.type
        at: { mark: type-easings }
        cadence: line-by-line
        target: { file: styles.css, after: "  translate: 160px 0;\n}\n", occurrence: 1 }
        text: "\n.slide-row span:nth-child(1) { transition-timing-function: linear; }\n.slide-row span:nth-child(3) { transition-timing-function: ease-out; }\n"
      - id: click-back
        type: preview.click
        at: { mark: click-back, offsetMs: -1000 }
        timeoutMs: 5000
        target: { by: testId, value: toggle-move }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-back
        type: expect.preview
        at: { mark: click-back }
        timeoutMs: 4000
        target: { by: testId, value: slide-row }
        attribute: { name: class, value: "slide-row" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-linear
        type: editor.select
        at: { mark: click-back }
        target: { file: styles.css, text: "transition-timing-function: linear;", occurrence: 1 }

  - id: stagger
    chapter: "Delay နဲ့ တစ်ခုပြီး တစ်ခု"
    narration: >
      [[mark:scroll-drinks]] သောက်စရာ menu ဆီ ဆင်းရအောင်။ [[mark:type-hide]] card တွေကို
      အရင် ဖျောက်ရအောင်။ opacity ကို 0 ပေးရင် လုံးဝ မမြင်ရတော့ပါဘူး။ ပြီးတော့ opacity
      အတွက် 600 millisecond transition ပေးပါမယ်။ [[mark:after-hide]] card တွေ ချက်ချင်း
      ပျောက်သွားပါတယ်။ opacity ပြောင်းတဲ့ အချိန်မှာ transition ကို မရေးရသေးလို့ပါ။
      [[mark:type-open]] menu မှာ open class ရှိရင် card တွေကို အပြည့် ပြန်မြင်ရပါမယ်။
      menu မပွင့်သေးလို့ အခုတော့ preview မှာ ဘာမှ မပေါ်သေးပါဘူး။ [[mark:type-delays]]
      ဒုတိယ၊ တတိယနဲ့ စတုတ္ထ card တွေက မစခင် 200၊ 400 နဲ့ 600 millisecond စောင့်ပါမယ်။
      delay ဆိုတာ ပြောင်းလဲမှု မစခင် စောင့်တဲ့ အချိန်ပါ။ [[mark:click-open]] menu ကို
      ဖွင့်ရအောင်။ [[mark:after-open]] card တွေ တစ်ခုပြီး တစ်ခု ပေါ်လာပါပြီ။ delay တွေ
      တဖြည်းဖြည်း များလာတာကို stagger လို့ ခေါ်ပြီး၊ မျက်စိက စာရင်းအတိုင်း အောက်ကို
      လိုက်သွားပါတယ်။ [[mark:explain-negative]] ဒီ delay မှာ အနုတ် တန်ဖိုးလည်း ပေးလို့
      ရပါတယ်။ အဲဒီအခါ transition က မစောင့်ဘဲ၊ အဲဒီ အချိန်စာ ရောက်ပြီးသား နေရာကနေ စပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Transitions: transition-delay"
        url: "https://web.dev/learn/css/transitions#transition-delay"
      - title: "MDN — transition-delay (negative values start partway)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/transition-delay"
      - title: "MDN — opacity"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/opacity"
    actions:
      - id: scroll-drinks
        type: preview.scroll
        at: { mark: scroll-drinks }
        timeoutMs: 5000
        top: 500
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-hide
        type: editor.type
        at: { mark: type-hide }
        cadence: line-by-line
        target:
          { file: styles.css, after: "transition-timing-function: ease-out; }\n", occurrence: 1 }
        text: "\n.drinks .menu-card {\n  opacity: 0;\n  transition: opacity 600ms;\n}\n"
      - id: expect-hidden
        type: expect.preview
        at: { mark: after-hide }
        timeoutMs: 4000
        target: { by: testId, value: menu-drinks }
        attribute: { name: class, value: "menu" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-open
        type: editor.type
        at: { mark: type-open }
        cadence: fast-explainer
        target: { file: styles.css, after: "  transition: opacity 600ms;\n}\n", occurrence: 1 }
        text: "\n.drinks .menu.is-open .menu-card {\n  opacity: 1;\n}\n"
      - id: type-delays
        type: editor.type
        at: { mark: type-delays }
        cadence: line-by-line
        target: { file: styles.css, after: "  opacity: 1;\n}\n", occurrence: 1 }
        text: "\n.drinks .menu-card:nth-child(2) { transition-delay: 200ms; }\n.drinks .menu-card:nth-child(3) { transition-delay: 400ms; }\n.drinks .menu-card:nth-child(4) { transition-delay: 600ms; }\n"
      - id: click-open
        type: preview.click
        at: { mark: click-open, offsetMs: 400 }
        timeoutMs: 5000
        target: { by: testId, value: toggle-open }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-open
        type: expect.preview
        at: { mark: after-open }
        timeoutMs: 4000
        target: { by: testId, value: menu-drinks }
        attribute: { name: class, value: "menu is-open" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-delay
        type: editor.select
        at: { mark: explain-negative }
        target: { file: styles.css, text: "transition-delay: 600ms;", occurrence: 1 }

  - id: lift
    chapter: "Transition နှစ်ခု တစ်ပြိုင်နက်"
    narration: >
      [[mark:type-lift-transition]] အခု ယနေ့ အထူး card ပါ။ သူ့ transition မှာ item
      သုံးခုကို comma နဲ့ ခြားထားပါတယ်။ ဒီ rule က card တွေရဲ့ transition စာရင်းကို
      တစ်ခုလုံး အစားထိုးလို့၊ opacity ကို ပြန်ထည့်ရပါတယ်။ item တစ်ခုစီက property
      တစ်ခုကို ကိုယ်ပိုင် အချိန် ပေးလို့၊ translate က 200 millisecond၊ box shadow က 2
      စက္ကန့် ကြာပါတယ်။ [[mark:select-item]] ဒီ item ကို ကြည့်ပါ။ item ထဲမှာ ပထမ အချိန်က
      အမြဲ ကြာချိန် ဖြစ်ပြီး၊ ဒုတိယ အချိန် ပါရင် delay ဖြစ်ပါတယ်။ [[mark:type-lift]]
      မြှင့်ထားတဲ့ state မှာ card က အပေါ်ကို 8 pixel တက်ပြီး အရိပ် ပျော့ပျော့ ရပါမယ်။
      card ကို မြှင့်ရအောင်။ [[mark:click-lift]] card က မြန်မြန် တက်သွားပြီး၊ အရိပ်ကတော့
      ခဏလောက် ဆက်ကြီးလာပါသေးတယ်။ [[mark:select-translate]] ဒီ translate ကို ကြည့်ပါ။
      lesson 14 မှာ မြင်ခဲ့တဲ့ translate၊ rotate နဲ့ scale က သီးခြား property တွေ
      ဖြစ်လို့၊ တစ်ခုစီကို အချိန် သီးသန့် ပေးလို့ ရပါတယ်။ transform property မှာတော့
      function အားလုံးက အချိန် တစ်ခုတည်း မျှသုံးရပါတယ်။ card ကို ပြန်ချကြည့်ရအောင်။
      [[mark:click-drop]] မြန်မြန် ပြန်ဆင်းလာပြီး၊ အရိပ်ကတော့ နောက်ကနေ ဖြည်းဖြည်း
      ပျောက်သွားပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Transitions: shorthand"
        url: "https://web.dev/learn/css/transitions#shorthand_transition"
      - title: "web.dev Learn CSS — Transitions: individual transform properties"
        url: "https://web.dev/learn/css/transitions#individual_transform_properties"
      - title: "web.dev Learn CSS — Transitions: shadows"
        url: "https://web.dev/learn/css/transitions#shadows"
      - title: "MDN — transition (first time = duration, second = delay)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/transition"
      - title: "CSS Transforms Level 2 — individual transform properties"
        url: "https://www.w3.org/TR/css-transforms-2/#individual-transforms"
    actions:
      - id: type-lift-transition
        type: editor.type
        at: { mark: type-lift-transition }
        cadence: fast-explainer
        target: { file: styles.css, after: "transition-delay: 600ms; }\n", occurrence: 1 }
        text: "\n.drinks .featured {\n  transition: opacity 600ms,\n    translate 200ms ease-out,\n    box-shadow 2s ease-out;\n}\n"
      - id: select-item
        type: editor.select
        at: { mark: select-item }
        target: { file: styles.css, text: "box-shadow 2s ease-out", occurrence: 1 }
      # line-by-line: the rgb( line is revealed whole, so no parenthesis stands
      # open; the rule is also the last one in the file while it appears.
      - id: type-lift
        type: editor.type
        at: { mark: type-lift }
        cadence: line-by-line
        target: { file: styles.css, after: "    box-shadow 2s ease-out;\n}\n", occurrence: 1 }
        text: "\n.drinks .featured.is-lifted {\n  translate: 0 -8px;\n  box-shadow: 0 16px 24px rgb(0 0 0 / 25%);\n}\n"
      - id: click-lift
        type: preview.click
        at: { mark: click-lift }
        timeoutMs: 5000
        target: { by: testId, value: toggle-lift }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-lifted
        type: expect.preview
        at: { afterAction: click-lift }
        timeoutMs: 4000
        target: { by: testId, value: card-laphet-yay }
        attribute: { name: class, value: "menu-card featured is-lifted" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-translate
        type: editor.select
        at: { mark: select-translate }
        target: { file: styles.css, text: "translate: 0 -8px;", occurrence: 1 }
      - id: click-drop
        type: preview.click
        at: { mark: click-drop }
        timeoutMs: 5000
        target: { by: testId, value: toggle-lift }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-dropped
        type: expect.preview
        at: { afterAction: click-drop }
        timeoutMs: 4000
        target: { by: testId, value: card-laphet-yay }
        attribute: { name: class, value: "menu-card featured" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: filter
    chapter: "ဘာတွေ transition လုပ်လို့ ရလဲ"
    narration: >
      [[mark:scroll-gallery]] အခု gallery ပါ။ [[mark:type-grey]] ရောင်းကုန်တဲ့
      ဓာတ်ပုံကို lesson 36 က grayscale filter နဲ့ မီးခိုးရောင် ပြောင်းပြီး၊ filter ကို 1
      စက္ကန့် transition ပေးပါမယ်။ [[mark:after-grey]] card တွေတုန်းကလိုပဲ၊ ဓာတ်ပုံက
      ချက်ချင်း မီးခိုးရောင် ဖြစ်သွားပါတယ်။ [[mark:type-available]] ဓာတ်ပုံကို
      ပြန်ရပြီလို့ မှတ်လိုက်ရင်၊ filter ကို none ပြန်ပေးပါမယ်။ none ဆိုတာ filter လုံးဝ
      မရှိတာပါ။ [[mark:click-photo]] ပြန်ရပြီ ခလုတ်ကို နှိပ်ရအောင်။ [[mark:after-photo]]
      အရောင်တွေ ဖြည်းဖြည်း ပြန်လာပါပြီ။ နှစ်ဘက်လုံးမှာ filter function တူတူ ဆိုရင်
      ချောချော transition ဖြစ်ပြီး၊ none ကိုတော့ မီးခိုးရောင် လုံးဝ မရှိတာလို့ ယူပါတယ်။
      ခလုတ်ရဲ့ အရောင်နဲ့ card ရဲ့ အရိပ်လည်း ဒီလိုပဲ transition ဖြစ်ခဲ့တာပါ။
    sources:
      - title: "web.dev Learn CSS — Transitions: filters"
        url: "https://web.dev/learn/css/transitions#filters"
      - title: "web.dev Learn CSS — Transitions: color"
        url: "https://web.dev/learn/css/transitions#color"
      - title: "MDN — filter (interpolation)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/filter#interpolation"
      - title: "Filter Effects Module Level 1 — interpolation of filters"
        url: "https://www.w3.org/TR/filter-effects-1/#interpolation-of-filters"
    actions:
      - id: scroll-gallery
        type: preview.scroll
        at: { mark: scroll-gallery }
        timeoutMs: 5000
        top: 960
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-grey
        type: editor.type
        at: { mark: type-grey }
        cadence: line-by-line
        target:
          {
            file: styles.css,
            after: "  box-shadow: 0 16px 24px rgb(0 0 0 / 25%);\n}\n",
            occurrence: 1,
          }
        text: "\n.sold-out img {\n  filter: grayscale(1);\n  transition: filter 1s;\n}\n"
      - id: expect-grey
        type: expect.preview
        at: { mark: after-grey }
        timeoutMs: 4000
        target: { by: testId, value: photo }
        attribute: { name: class, value: "photo sold-out" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-available
        type: editor.type
        at: { mark: type-available }
        cadence: fast-explainer
        target: { file: styles.css, after: "  transition: filter 1s;\n}\n", occurrence: 1 }
        text: "\n.sold-out.available img {\n  filter: none;\n}\n"
      - id: click-photo
        type: preview.click
        at: { mark: click-photo, offsetMs: 400 }
        timeoutMs: 5000
        target: { by: testId, value: toggle-photo }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-available
        type: expect.preview
        at: { mark: after-photo }
        timeoutMs: 4000
        target: { by: testId, value: photo }
        attribute: { name: class, value: "photo sold-out available" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: discrete
    narration: >
      [[mark:scroll-special]] ယနေ့ အထူးဆီ ပြန်တက်ရအောင်။ [[mark:type-price-all]] သူ့
      ဈေးနှုန်းကို property အားလုံးအတွက် 1 စက္ကန့် transition ပေးပါမယ်။ ရွေးပေးတာ
      ပိုကောင်းတယ်လို့ ပြောခဲ့ပေမယ့်၊ ဘယ် property တွေ ဖြည်းဖြည်း ပြောင်းမလဲ ကြည့်ဖို့
      all ကို တမင် သုံးတာပါ။ [[mark:type-price-big]] card ကို မြှင့်ထားရင် ဈေးနှုန်းက 22
      pixel ထိ ကြီးလာပြီး၊ monospace font လည်း ပြောင်းပါမယ်။ [[mark:click-lift-price]]
      card ကို ထပ်မြှင့်ပြီး ဈေးနှုန်းကို ကြည့်ရအောင်။ [[mark:after-lift-price]]
      ဈေးနှုန်းက ဖြည်းဖြည်း ကြီးလာပေမယ့်၊ font ကတော့ အစမှာပဲ တစ်ချက်တည်းနဲ့
      ပြောင်းသွားပါတယ်။ [[mark:explain-discrete]] ဒီ font family ကို ကြည့်ပါ။ font
      နှစ်မျိုးရဲ့ ကြားက font ဆိုတာ မရှိပါဘူး။ font family၊ display လို အလယ် တန်ဖိုး
      မရှိတဲ့ property တွေကို discrete လို့ ခေါ်ပြီး၊ all နဲ့တောင် ချက်ချင်း
      ပြောင်းပါတယ်။ display ကိုပါ transition ထဲ ပါဝင်စေတဲ့ နည်းကို lesson 41 မှာ
      ပြပါမယ်။
    sources:
      - title: "web.dev Learn CSS — Transitions: what can and can't transition"
        url: "https://web.dev/learn/css/transitions#what_can_and_cant_transition"
      - title: "MDN — Animatable CSS properties (animation types; discrete)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_animated_properties"
      - title: "MDN — font-family (animation type: discrete)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/font-family"
      - title: "CSS Transitions Level 2 — transition-behavior"
        url: "https://drafts.csswg.org/css-transitions-2/#transition-behavior-property"
    actions:
      - id: scroll-special
        type: preview.scroll
        at: { mark: scroll-special }
        timeoutMs: 5000
        top: 500
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-price-all
        type: editor.type
        at: { mark: type-price-all }
        cadence: fast-explainer
        target: { file: styles.css, after: "  filter: none;\n}\n", occurrence: 1 }
        text: "\n.drinks .featured .price {\n  transition: all 1s;\n}\n"
      - id: type-price-big
        type: editor.type
        at: { mark: type-price-big }
        cadence: line-by-line
        target: { file: styles.css, after: "  transition: all 1s;\n}\n", occurrence: 1 }
        text: "\n.drinks .featured.is-lifted .price {\n  font-size: 22px;\n  font-family: monospace;\n}\n"
      - id: click-lift-price
        type: preview.click
        at: { mark: click-lift-price, offsetMs: 400 }
        timeoutMs: 5000
        target: { by: testId, value: toggle-lift }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-lifted-price
        type: expect.preview
        at: { mark: after-lift-price }
        timeoutMs: 4000
        target: { by: testId, value: card-laphet-yay }
        attribute: { name: class, value: "menu-card featured is-lifted" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-family
        type: editor.select
        at: { mark: explain-discrete }
        target: { file: styles.css, text: "font-family: monospace;", occurrence: 1 }

  - id: focus-within
    chapter: "Transition ကို ဘာက စပေးလဲ"
    narration: >
      [[mark:scroll-top]] အော်ဒါ form ဆီ ပြန်တက်ရအောင်။ [[mark:type-form]] form ကို 2
      pixel အညိုဖျော့ရောင် border ပေးပြီး၊ border အရောင်ကို 400 millisecond transition
      ပေးပါမယ်။ [[mark:type-within]] form ထဲက တစ်ခုခု focus ရနေတုန်း border က
      အစိမ်းရောင် ဖြစ်ပါမယ်။ အရောင်ပဲ ပြောင်းလို့၊ transition ကိုလည်း အရောင်မှာပဲ
      ပေးထားပါတယ်။ [[mark:type-focus]] field ကိုယ်တိုင်အတွက်တော့ ရိုးရိုး focus ကို
      သုံးပါမယ်။ focus ရနေတုန်း နောက်ခံက အစိမ်းဖျော့ဖျော့ ဖြစ်ပြီး၊ နောက်ခံမှာ
      သူ့ကိုယ်ပိုင် transition ပါပါတယ်။ [[mark:input-name]] field ထဲမှာ နာမည်
      ရိုက်ထည့်ကြည့်ရအောင်။ [[mark:after-input]] နှစ်ခုလုံး ဖြည်းဖြည်း ပြောင်းလာပါပြီ။
      field က focus ရနေလို့ အစိမ်းဖျော့ဖျော့ ဖြစ်ပြီး၊ form ရဲ့ border ကတော့ focus က
      သူ့ထဲမှာ ရှိလို့ အစိမ်းရောင် ဖြစ်တာပါ။ [[mark:select-within]] ဒီ focus within ကို
      ကြည့်ပါ။ highlight လုပ်ဖို့ editor က focus ယူသွားတော့၊ ထွက်တဲ့ဘက်မှာလည်း
      transition တူတူ run လို့ field နဲ့ form က ဖြည်းဖြည်း ပြန်ပြောင်းသွားပါတယ်။
      [[mark:explain-pseudo]] ဒါကြောင့် lesson 27 နဲ့ 28 က pseudo-class တွေကလည်း class
      လိုပဲ transition ကို စပေးနိုင်ပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Transitions: transition triggers (:focus, :focus-within)"
        url: "https://web.dev/learn/css/transitions#transition_triggers"
      - title: "MDN — :focus-within"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/:focus-within"
      - title: "MDN — :focus"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/:focus"
    actions:
      - id: scroll-top
        type: preview.scroll
        at: { mark: scroll-top }
        timeoutMs: 5000
        top: 0
        retry: { maxAttempts: 2, delayMs: 250 }
      # line-by-line: the opening line stands open only while it is the last
      # rule in the file.
      - id: type-form
        type: editor.type
        at: { mark: type-form }
        cadence: line-by-line
        target: { file: styles.css, after: "  font-family: monospace;\n}\n", occurrence: 1 }
        text: "\n.order-form {\n  border: 2px solid tan;\n  transition: border-color 400ms;\n}\n"
      - id: type-within
        type: editor.type
        at: { mark: type-within }
        cadence: fast-explainer
        target: { file: styles.css, after: "  transition: border-color 400ms;\n}\n", occurrence: 1 }
        text: "\n.order-form:focus-within {\n  border-color: seagreen;\n}\n"
      # line-by-line: two complete rules, the last in the file while they
      # appear. Same specificity as base.css's white field background, and
      # later, so the focus colour wins.
      - id: type-focus
        type: editor.type
        at: { mark: type-focus }
        cadence: line-by-line
        target: { file: styles.css, after: "  border-color: seagreen;\n}\n", occurrence: 1 }
        text: "\n.order-form input {\n  transition: background-color 400ms;\n}\n\n.order-form input:focus {\n  background: #dff2e3;\n}\n"
      # The bridge focuses the field, then sets its value: :focus on the
      # field, :focus-within on the form. The next editor.select focuses the
      # editor, so both blur (rrweb records it; lesson 28 relies on the same).
      - id: input-name
        type: preview.input
        at: { mark: input-name, offsetMs: 400 }
        timeoutMs: 5000
        target: { by: testId, value: input-name }
        value: "ကိုအောင်"
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-name
        type: expect.preview
        at: { mark: after-input }
        timeoutMs: 4000
        target: { by: testId, value: input-name }
        value: "ကိုအောင်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-within
        type: editor.select
        at: { mark: select-within }
        target: { file: styles.css, text: ".order-form:focus-within", occurrence: 1 }

  - id: triggers
    narration: >
      [[mark:open-triggers]] ဒါဆို transition ကို ဘာက စပေးနိုင်လဲ။ computed value ကို
      ပြောင်းစေတဲ့ ဘယ်အရာမဆိုပါ။ [[mark:draw-hover]] hover က pointer ကို element ပေါ်
      တင်ထားတုန်း ကိုက်ပါတယ်။ touch screen တွေမှာတော့ hover ကို အားကိုးလို့ မရပါဘူး။
      replay က hover ကို သေချာ မပြနိုင်လို့၊ ဒီ lesson မှာ click ပဲ သုံးခဲ့တာပါ။
      [[mark:draw-focus]] focus နဲ့ focus within ကို ခုနက မြင်ခဲ့ပါပြီ။
      [[mark:draw-target]] target က URL အဆုံးမှာ ပါတဲ့ id နဲ့ တူတဲ့ element ကို
      ကိုက်လို့၊ link ရိုးရိုးနဲ့တင် transition ကို စလို့ ရပါတယ်။ [[mark:draw-active]]
      active က element ကို ဖိနှိပ်ထားတုန်း ကိုက်ပါတယ်။ [[mark:draw-class]] နောက်ဆုံးက ဒီ
      lesson ရဲ့ ခလုတ်တွေလို JavaScript က ထည့်လိုက် ဖြုတ်လိုက် လုပ်တဲ့ class ပါ။ ဒါက
      အယုံကြည်ရဆုံး နည်းပါ။
    sources:
      - title: "web.dev Learn CSS — Transitions: transition triggers"
        url: "https://web.dev/learn/css/transitions#transition_triggers"
      - title: "MDN — :hover"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/:hover"
      - title: "MDN — :target"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/:target"
      - title: "MDN — :active"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/:active"
    actions:
      - id: open-triggers-board
        type: whiteboard.apply
        at: { mark: open-triggers }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-hover
        type: whiteboard.apply
        at: { mark: draw-hover }
        upsertIds: [b-hover]
        drawMs: 1200
      - id: draw-focus
        type: whiteboard.apply
        at: { mark: draw-focus }
        upsertIds: [b-focus, b-within]
        drawMs: 1600
      - id: draw-target
        type: whiteboard.apply
        at: { mark: draw-target }
        upsertIds: [b-target]
        drawMs: 1200
      - id: draw-active
        type: whiteboard.apply
        at: { mark: draw-active }
        upsertIds: [b-active]
        drawMs: 1000
      - id: draw-class
        type: whiteboard.apply
        at: { mark: draw-class }
        upsertIds: [b-class, b-class-ring, b-class-l]
        drawMs: 2000

  - id: enter-exit
    chapter: "ဝင်တဲ့အခါနဲ့ ထွက်တဲ့အခါ"
    narration: >
      [[mark:close-triggers]] အော်ဒါ ခလုတ်ဆီ ပြန်သွားရအောင်။ [[mark:type-exit]] သူ့
      ပုံမှန် rule မှာ transition shorthand နဲ့ နောက်ခံကို 2 စက္ကန့် ပေးပါမယ်။ longhand
      နှစ်ခုရဲ့ နောက်မှာ ရေးထားလို့၊ သူတို့ကို အစားထိုးပါတယ်။ [[mark:type-enter]] active
      rule မှာတော့ နောက်ခံကို 150 millisecond ပဲ ပေးလို့၊ ဝင်တဲ့အခါ မြန်မြန်
      ပြောင်းပါမယ်။ active state ကနေ ထွက်ဖို့ ပြောင်းမယ် ခလုတ်ကို နှိပ်ပါမယ်။
      [[mark:click-exit]] အစိမ်းက 2 စက္ကန့် ကြာအောင် အညိုကို ဖြည်းဖြည်း
      ပြန်ပြောင်းပါတယ်။ [[mark:click-enter]] ပြန်ဝင်ပါမယ်။ [[mark:after-enter]]
      ချက်ချင်းနီးပါး အစိမ်း ဖြစ်သွားပါတယ်။ [[mark:explain-enter-exit]] ဒီ 150
      millisecond transition ကို ကြည့်ပါ။ browser က ရောက်သွားတဲ့ state ရဲ့ transition
      ကို သုံးပါတယ်။ ဝင်တဲ့အခါ active rule ရဲ့ဟာ၊ ထွက်တဲ့အခါ ပုံမှန် rule ရဲ့ဟာပါ။
      active rule မှာပဲ transition ရှိရင် ထွက်တဲ့အခါ ချက်ချင်း ပြောင်းမှာပါ။
    sources:
      - title: "web.dev Learn CSS — Transitions: different transitions for enter or exit"
        url: "https://web.dev/learn/css/transitions#different_transitions_for_enter_or_exit"
      - title: "CSS Transitions Level 1 — the after-change style decides the transition"
        url: "https://www.w3.org/TR/css-transitions-1/#starting"
    actions:
      - id: close-triggers-board
        type: whiteboard.apply
        at: { mark: close-triggers }
        open: false
      - id: type-exit
        type: editor.type
        at: { mark: type-exit }
        cadence: fast-explainer
        target:
          { file: styles.css, after: "  transition-property: background-color;\n", occurrence: 1 }
        text: "  transition: background-color 2s;\n"
      - id: type-enter
        type: editor.type
        at: { mark: type-enter }
        cadence: fast-explainer
        target: { file: styles.css, after: "  background: darkgreen;\n", occurrence: 1 }
        text: "  transition: background-color 150ms;\n"
      - id: click-exit
        type: preview.click
        at: { mark: click-exit }
        timeoutMs: 5000
        target: { by: testId, value: toggle-active }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-exit
        type: expect.preview
        at: { afterAction: click-exit }
        timeoutMs: 4000
        target: { by: testId, value: order-button }
        attribute: { name: class, value: "order-btn" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: click-enter
        type: preview.click
        at: { mark: click-enter }
        timeoutMs: 5000
        target: { by: testId, value: toggle-active }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-enter
        type: expect.preview
        at: { mark: after-enter }
        timeoutMs: 4000
        target: { by: testId, value: order-button }
        attribute: { name: class, value: "order-btn is-active" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-enter
        type: editor.select
        at: { mark: explain-enter-exit }
        target: { file: styles.css, text: "transition: background-color 150ms;", occurrence: 1 }

  - id: cup
    chapter: "Custom property ကို transition လုပ်ရအောင်"
    narration: >
      [[mark:scroll-cup]] အခု လက်ဖက်ရည် ခွက်ပါ။ လက်ဖက်ရည်ရဲ့ အမြင့်က lesson 11 မှာ
      register လုပ်ခဲ့တဲ့ tea level ပါ။ 30 ရာခိုင်နှုန်းကနေ စပြီး၊ ခွက်မှာ full class
      ရှိရင် 90 ဖြစ်ပါတယ်။ [[mark:type-cup]] လက်ဖက်ရည်ကို 2 စက္ကန့် transition
      ပေးရအောင်။ ဒီတစ်ခါ transition လုပ်မယ့် property က custom property ကိုယ်တိုင်ပါ။
      [[mark:click-fill]] ခွက်ကို ဖြည့်ရအောင်။ [[mark:after-fill]] လက်ဖက်ရည် 30 ကနေ 90
      ရာခိုင်နှုန်းထိ ချောချော တက်လာပါတယ်။ [[mark:explain-registered]] ဒီ tea level ကို
      ကြည့်ပါ။ ရာခိုင်နှုန်း type နဲ့ register လုပ်ထားလို့၊ browser က ကြားက
      တန်ဖိုးတွေကို တွက်နိုင်တာပါ။ register မလုပ်ထားတဲ့ custom property မှာ type
      မရှိလို့၊ 90 ကို တန်းခုန်သွားမှာပါ။
    sources:
      - title: "web.dev Learn CSS — Custom properties: more control with @property"
        url: "https://web.dev/learn/css/custom-properties#more_control_with_property"
      - title: "MDN — @property (registered properties can be animated)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/@property"
      - title: "MDN — Custom properties (--*): unregistered values animate discretely"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/--*"
      - title: "CSS Properties and Values API Level 1 — animation behavior"
        url: "https://www.w3.org/TR/css-properties-values-api-1/#animation-behavior-of-custom-properties"
    actions:
      - id: scroll-cup
        type: preview.scroll
        at: { mark: scroll-cup }
        timeoutMs: 5000
        top: 2000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-cup
        type: editor.type
        at: { mark: type-cup }
        cadence: fast-explainer
        target: { file: styles.css, after: "  background: #dff2e3;\n}\n", occurrence: 1 }
        text: "\n.cup-fill {\n  transition: --tea-level 2s;\n}\n"
      - id: click-fill
        type: preview.click
        at: { mark: click-fill, offsetMs: 400 }
        timeoutMs: 5000
        target: { by: testId, value: fill-cup }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-full
        type: expect.preview
        at: { mark: after-fill }
        timeoutMs: 4000
        target: { by: testId, value: cup }
        attribute: { name: class, value: "cup is-full" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-tea-level
        type: editor.select
        at: { mark: explain-registered }
        target: { file: styles.css, text: "--tea-level 2s", occurrence: 1 }

  - id: reduced-motion
    chapter: "Reduced motion နဲ့ performance"
    narration: >
      [[mark:type-reduce]] လှုပ်ရှားမှုကြောင့် မူးတဲ့သူ၊ အာရုံပျံ့တဲ့သူတွေက ကိုယ့်
      စက်မှာ reduced motion setting ဖွင့်ထားနိုင်ပါတယ်။ သူတို့အတွက် ဒီ media query က
      transition အားလုံးကို ပိတ်ပြီး၊ important က တခြား rule တွေ ပြန်ဖွင့်တာကို
      တားပေးပါတယ်။ [[mark:select-reduce]] ဒီ media query ကို ကြည့်ပါ။ သူ့ကို lesson
      ကြည့်နေတဲ့ စက်ပေါ်မှာ စစ်ပါတယ်။ လက်ဖက်ရည်ကို ပြန်လျှော့ကြည့်ရအောင်။
      [[mark:click-empty]] ကိုယ့် စက်မှာ reduced motion ဖွင့်ထားရင် ချက်ချင်း
      ကျသွားပြီး၊ မဖွင့်ထားရင် 2 စက္ကန့် ကြာအောင် ကျပါတယ်။ [[mark:explain-opt-in]]
      အားလုံးကို ပိတ်တာက အပြင်းထန်ဆုံး နည်းပါ။ ပိုနူးညံ့တဲ့ နည်းကတော့ ဘာမှ မတောင်းထားမှ
      ကိုက်တဲ့ media query ထဲမှာပဲ လှုပ်ရှားမှု ထည့်ပြီး၊ အရောင် ပြောင်းတာကိုတော့
      လူတိုင်းအတွက် ထားတာပါ။
    sources:
      - title: "web.dev Learn CSS — Transitions: accessibility considerations"
        url: "https://web.dev/learn/css/transitions#accessibility_considerations"
      - title: "MDN — prefers-reduced-motion"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/@media/prefers-reduced-motion"
      - title: "web.dev — prefers-reduced-motion"
        url: "https://web.dev/articles/prefers-reduced-motion"
    actions:
      # line-by-line: the media query's parenthesis is closed on its first
      # line; the rule is the last one in the file.
      - id: type-reduce
        type: editor.type
        at: { mark: type-reduce }
        cadence: line-by-line
        target: { file: styles.css, after: "  transition: --tea-level 2s;\n}\n", occurrence: 1 }
        text: "\n@media (prefers-reduced-motion: reduce) {\n  * {\n    transition: none !important;\n  }\n}\n"
      - id: select-reduce
        type: editor.select
        at: { mark: select-reduce }
        target: { file: styles.css, text: "@media (prefers-reduced-motion: reduce)", occurrence: 1 }
      # The preview is still at the cup (scene cup). The recording's browser has
      # no reduce setting, so the tea drops over 2 s here; a viewer whose device
      # asks for reduced motion sees it drop at once (the replay evaluates the
      # media query in the viewer's browser).
      - id: click-empty
        type: preview.click
        at: { mark: click-empty }
        timeoutMs: 5000
        target: { by: testId, value: fill-cup }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-emptied
        type: expect.preview
        at: { afterAction: click-empty }
        timeoutMs: 4000
        target: { by: testId, value: cup }
        attribute: { name: class, value: "cup" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: performance
    narration: >
      [[mark:open-pipeline]] လှုပ်ရှားမှုတွေက browser ကိုလည်း ပင်ပန်းစေပါတယ်။
      [[mark:draw-pipeline]] frame တိုင်းမှာ browser က layout လုပ်၊ pixel တွေ paint
      လုပ်ပြီး၊ နောက်ဆုံးမှာ အလွှာတွေကို composite လုပ်ပါတယ်။ [[mark:draw-slow]] width၊
      height ဒါမှမဟုတ် top ကို transition လုပ်ရင် frame တိုင်း layout ပြန်လုပ်ပြီး ဘေးက
      box တွေကိုပါ ရွှေ့ရလို့ ထစ်နိုင်ပါတယ်။ [[mark:draw-fast]] transform နဲ့ opacity
      ကတော့ အများအားဖြင့် နောက်ဆုံး composite အဆင့်ပဲ လိုပါတယ်။ ဒါကြောင့် card ကို
      translate နဲ့ မြှင့်ပြီး၊ menu ကို opacity နဲ့ ပေါ်စေခဲ့တာပါ။ [[mark:draw-auto]]
      height ကိုတော့ auto အထိ transition လုပ်လို့ မရပါဘူး။ auto က ဂဏန်း မဟုတ်လို့ပါ။
      အဲဒီအစား grid row တွေကို 0 fr ကနေ 1 fr ထိ transition လုပ်ကြပါတယ်။
      [[mark:draw-extras]] transition ပြီးသွားရင် transitionend ဆိုတဲ့ JavaScript event
      ထွက်လာပါတယ်။ lesson 5 ရဲ့ origin board မှာ မြင်ခဲ့သလို၊ run နေတဲ့ transition ရဲ့
      တန်ဖိုးက important declaration ကိုတောင် နိုင်ပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Transitions: performance considerations"
        url: "https://web.dev/learn/css/transitions#performance_considerations"
      - title: "web.dev — How to create high-performance CSS animations"
        url: "https://web.dev/articles/animations-guide"
      - title: "MDN — transitionend event"
        url: "https://developer.mozilla.org/en-US/docs/Web/API/Element/transitionend_event"
      - title: "CSS Cascading and Inheritance Level 5 — cascade sorting order (transitions)"
        url: "https://www.w3.org/TR/css-cascade-5/#cascade-sort"
    actions:
      - id: open-pipeline-board
        type: whiteboard.apply
        at: { mark: open-pipeline }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-pipeline
        type: whiteboard.apply
        at: { mark: draw-pipeline }
        upsertIds:
          [
            c-layout,
            c-layout-l,
            c-arrow-1,
            c-paint,
            c-paint-l,
            c-arrow-2,
            c-composite,
            c-composite-l,
          ]
        drawMs: 3200
      - id: draw-slow
        type: whiteboard.apply
        at: { mark: draw-slow }
        upsertIds: [c-slow]
        drawMs: 1600
      - id: draw-fast
        type: whiteboard.apply
        at: { mark: draw-fast }
        upsertIds: [c-fast]
        drawMs: 1400
      - id: draw-auto
        type: whiteboard.apply
        at: { mark: draw-auto }
        upsertIds: [c-auto]
        drawMs: 1400
      - id: draw-extras
        type: whiteboard.apply
        at: { mark: draw-extras }
        upsertIds: [c-events, c-important]
        drawMs: 2000

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:open-quiz]] မေးခွန်း နှစ်ခု မေးကြည့်ရအောင်။ easing ကို ဘယ် property နဲ့
      ပေးလဲ။ [[mark:quiz-1]] transition timing function ပါ။ transition easing ဆိုတဲ့
      property မရှိပါဘူး။ [[mark:ask-quiz-2]] all ကို သုံးတာ အကောင်းဆုံးလား။
      [[mark:quiz-2]] မဟုတ်ပါဘူး။ မရည်ရွယ်တာတွေပါ လှုပ်နိုင်ပြီး၊ property တိုင်းလည်း
      transition မဖြစ်ပါဘူး။ လိုချင်တာတွေကိုပဲ စာရင်း ပေးပါ။ [[mark:recap]] ဒါဆို
      ပြန်ချုပ်ရရင်၊ computed value ပြောင်းတဲ့အခါ transition က ကြားက frame တွေကို
      ဖြည့်ပေးပါတယ်။ ကြာချိန်က transition ကို ဖွင့်ပေးပြီး၊ property၊ easing နဲ့ delay က
      ပုံစံကို ပြင်ပေးပါတယ်။ run တာက ရောက်သွားတဲ့ state ရဲ့ transition ဖြစ်ပြီး၊ reduced
      motion တောင်းထားတဲ့ user တွေကိုလည်း ဂရုစိုက်ရပါမယ်။ [[mark:next-lesson]]
      transition က state နှစ်ခုကြားမှာပဲ သွားပြီး၊ စပေးမယ့် အရာကို စောင့်ပါတယ်။ နောက်
      lesson မှာတော့ အဆင့် အများကြီး ပါပြီး သူ့ဘာသာ run တဲ့ keyframe animation ကို
      ကြည့်သွားပါမယ်။
    sources:
      - title: "web.dev Learn CSS — Transitions: check your understanding"
        url: "https://web.dev/learn/css/transitions#check_your_understanding"
      - title: "web.dev Learn CSS — Animations (next lesson)"
        url: "https://web.dev/learn/css/animations"
    actions:
      - id: open-quiz
        type: whiteboard.apply
        at: { mark: open-quiz }
        open: true
        clear: true
        upsertIds: [d-title, d-q1]
      - id: draw-quiz-1
        type: whiteboard.apply
        at: { mark: quiz-1 }
        upsertIds: [d-a1]
        drawMs: 1400
      - id: draw-ask-quiz-2
        type: whiteboard.apply
        at: { mark: ask-quiz-2 }
        upsertIds: [d-q2]
        drawMs: 1400
      - id: draw-quiz-2
        type: whiteboard.apply
        at: { mark: quiz-2 }
        upsertIds: [d-a2]
        drawMs: 1200
      - id: expect-final-css
        type: expect.file
        at: { mark: recap }
        path: styles.css
