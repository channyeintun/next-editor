      # base.css: kit sections A, B, B2 and C minus the sold-out opacity;
      # section D dropped. Section E: the toggle buttons, the white order
      # form, the chips, and lesson 11's registered cup (full state set on
      # .cup-fill, the element that reads --tea-level).
      base.css: |
        /*
          base.css: pinned, never typed during a lesson.
          The shop's palette and the page "furniture", so the CSS a lesson types can
          focus on one idea. Each lesson keeps only the sections it needs and drops
          any declaration that its own demo types or relies on being absent
          (COURSE-KIT.md, "Deriving a lesson workspace"). B2 travels with B (every
          lesson that keeps B keeps B2, except lesson 2, which types the reset).
          Section E holds the few lesson-specific rules a start state pins.
          Lesson 38 keeps A, B, B2 and C, minus the sold-out opacity (the gallery
          photo's sold-out look is the grey filter the lesson types); section D
          dropped. Section E pins the toggle buttons, the order form's box, the
          slide-row chips and the registered tea cup. No transition, translate,
          filter or opacity on anything the lesson animates.
          Keep it free of the url, image-set and @-import functions (they switch on
          Vite's postcss step); images come from <img> or the pinned images.css.
        */

        /* == A. palette == */
        :root {
          color-scheme: light;
          --tea-dark: #3b2314;
          --tea: #8b5a2b;
          --tea-light: #c9a27e;
          --cream: #fff8ec;
          --paper: #fdf3e1;
          --leaf: #2f6b3a;
          --gold: #c9a227;
          --chili: #b23a2b;
          --ink: #2b1d14;
          --muted: #6b5a4c;
          --line: #e6d5bf;
          --radius: 12px;
        }

        /* == B. page == */
        body {
          margin: 0;
          font-family: "Noto Sans Myanmar", "Myanmar Sangam MN", "Myanmar MN", "Myanmar Text", "Padauk",
            system-ui, sans-serif;
          font-size: 16px;
          line-height: 1.8;
          color: var(--ink);
          background: var(--paper);
        }

        .page {
          padding: 0 16px 24px;
        }

        h1,
        h2,
        h3 {
          margin: 0 0 8px;
          line-height: 1.5;
        }

        h1 {
          font-size: 24px;
        }

        h2 {
          font-size: 20px;
        }

        h3 {
          font-size: 17px;
        }

        a {
          color: var(--tea);
        }

        /* Status lines that only expect.preview reads (kit.js data-report, data-say). */
        .visually-hidden {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip-path: inset(50%);
          white-space: nowrap;
        }

        /* == B2. reset (lesson 2 teaches it; every later lesson keeps it) == */
        *,
        *::before,
        *::after {
          box-sizing: border-box;
        }

        /* == C. furniture == */
        .site-header {
          padding: 16px;
          background: var(--tea-dark);
          color: var(--cream);
        }

        .site-header a {
          color: var(--cream);
        }

        .logo {
          display: block;
        }

        .tagline {
          margin: 0;
          color: var(--tea-light);
          font-size: 14px;
        }

        .nav ul {
          margin: 8px 0 0;
          padding: 0;
          list-style: none;
        }

        .hero {
          margin: 16px 0;
          padding: 16px;
          background: var(--cream);
          border-radius: var(--radius);
        }

        .menu {
          margin: 0;
          padding: 0;
          list-style: none;
        }

        .menu-card {
          margin: 0 0 12px;
          padding: 12px 16px;
          background: #fff;
          border: 1px solid var(--line);
          border-radius: var(--radius);
        }

        .menu-card .name,
        .menu-card .desc {
          margin: 0;
        }

        .menu-card .desc {
          color: var(--muted);
          font-size: 14px;
        }

        .price {
          font-weight: 700;
          color: var(--tea);
        }

        .badge {
          padding: 0 8px;
          border-radius: 999px;
          background: var(--leaf);
          color: #fff;
          font-size: 13px;
        }

        .order-link,
        .order-btn {
          display: inline-block;
          padding: 6px 16px;
          border: 0;
          border-radius: 999px;
          background: var(--tea);
          color: #fff;
          font: inherit;
          text-decoration: none;
        }

        .order-form label {
          display: block;
          margin-top: 8px;
        }

        .order-form input[type="text"],
        .order-form input[type="tel"],
        .order-form input[type="number"] {
          box-sizing: border-box;
          width: 100%;
          padding: 6px 10px;
          border: 1px solid var(--line);
          border-radius: 8px;
          background: #fff;
          font: inherit;
        }

        .order-btn {
          margin-top: 12px;
        }

        .gallery figure {
          margin: 0 0 12px;
        }

        .gallery img {
          display: block;
          max-width: 100%;
          height: auto;
          border-radius: var(--radius);
        }

        figcaption {
          color: var(--muted);
          font-size: 14px;
        }

        .hours-list {
          margin: 0;
          padding-left: 20px;
        }

        .site-footer {
          margin-top: 24px;
          padding: 16px;
          background: var(--tea-dark);
          color: var(--cream);
          font-size: 14px;
        }

        .site-footer a {
          color: var(--cream);
        }

        /* == E. lesson rules == */
        /* Lesson 38: the toggle buttons kit.js drives, a white order form, the three
           slide-row chips (one per line, so each slides along its own track) and
           lesson 11's tea cup. --tea-level is registered (inherits: false), so the
           full state sets it on .cup-fill, the element that reads it. */
        .controls {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
          margin: 8px 0 12px;
        }

        .toggle {
          padding: 2px 14px;
          border: 1px solid var(--tea);
          border-radius: 999px;
          background: #fff;
          color: var(--tea);
          font: inherit;
          font-size: 14px;
        }

        .order-form {
          margin-top: 16px;
          padding: 12px 16px;
          border-radius: var(--radius);
          background: #fff;
        }

        .easing,
        .gallery,
        .pour {
          margin-top: 16px;
        }

        .slide-row span {
          display: block;
          width: fit-content;
          margin: 0 0 8px;
          padding: 0 12px;
          border: 1px solid var(--line);
          border-radius: 999px;
          background: var(--cream);
          font-size: 14px;
        }

        @property --tea-level {
          syntax: "<percentage>";
          inherits: false;
          initial-value: 30%;
        }

        .cup {
          box-sizing: content-box;
          display: flex;
          align-items: flex-end;
          width: 80px;
          height: 120px;
          border: 3px solid var(--tea-dark);
          border-top: 0;
          border-radius: 0 0 16px 16px;
          background: #fff;
          overflow: hidden;
        }

        .cup-fill {
          width: 100%;
          height: var(--tea-level);
          background: var(--tea);
        }

        .cup.is-full .cup-fill {
          --tea-level: 90%;
        }
      styles.css: ""
      kit.js: |
        // kit.js: pinned helper for lessons that need a click to change the DOM.
        // Never typed during a lesson. Every helper is a data attribute on the clicked
        // element; data-target (a CSS selector) names the element that changes, and
        // defaults to the clicked element itself.
        //
        //   data-toggle-class="is-open"      toggles a class on the target
        //   data-toggle-attr="hidden"        toggles a boolean attribute on the target
        //   data-show-modal="#confirm"       opens that <dialog> with showModal()
        //   data-set-property="--brand"      sets a custom property on <html>
        //     data-value="#2f6b3a"           ...to this value
        //   data-say="text"                  writes the text into the target
        //
        // On a popover, <details> or <dialog>:
        //   data-report="#status"            writes "open" / "closed" into #status on
        //                                    every toggle (a DOM fact expect.preview
        //                                    can assert; popovers have no open attribute,
        //                                    and a closed dialog has none to compare)
        // On a checkbox or radio:
        //   data-report="#status"            writes "checked" / "unchecked" into #status
        //                                    on every change (a clicked checkbox never
        //                                    gets a checked attribute and its value
        //                                    stays "on", so expect.preview needs this)
        //
        // It never throws: a missing target or dialog is ignored.

        const HELPERS = "[data-toggle-class],[data-toggle-attr],[data-show-modal],[data-set-property],[data-say]";

        document.addEventListener("click", (event) => {
          const source = event.target instanceof Element ? event.target.closest(HELPERS) : null;
          if (!source) return;
          const { toggleClass, toggleAttr, showModal, setProperty, value, say, target } = source.dataset;
          const element = target ? document.querySelector(target) : source;
          if (!element) return;
          if (toggleClass) element.classList.toggle(toggleClass);
          if (toggleAttr) element.toggleAttribute(toggleAttr);
          if (setProperty) document.documentElement.style.setProperty(setProperty, value ?? "");
          if (say !== undefined) element.textContent = say;
          if (showModal) {
            const dialog = document.querySelector(showModal);
            if (dialog instanceof HTMLDialogElement && !dialog.open) dialog.showModal();
          }
        });

        // toggle does not bubble, so listen in the capture phase.
        document.addEventListener(
          "toggle",
          (event) => {
            const source = event.target instanceof HTMLElement ? event.target : null;
            const report = source?.dataset.report ? document.querySelector(source.dataset.report) : null;
            if (report) report.textContent = event.newState ?? (source.hasAttribute("open") ? "open" : "closed");
          },
          true,
        );

        // change bubbles; only checkboxes and radios report.
        document.addEventListener("change", (event) => {
          const input = event.target instanceof HTMLInputElement ? event.target : null;
          if (!input || (input.type !== "checkbox" && input.type !== "radio")) return;
          const report = input.dataset.report ? document.querySelector(input.dataset.report) : null;
          if (report) report.textContent = input.checked ? "checked" : "unchecked";
        });
