# CSS course (Burmese), lesson 38 of 43: transitions.
#
# Narration is the final Burmese (voice-script.md mirrors it span by span;
# DESIGN.md holds the design brief). Every [[mark:…]] sits where its action
# begins, at a sentence end; each span carries one piece of meaning. Edit
# this YAML directly (the probe/ assembly is retired).
#
# Shape: board (recall lesson 37; elements have states; CSS jumps between
# them in one frame) → code tour (order form + toggle, three chips, drinks
# with open/lift toggles, the sold-out photo, lesson 11's cup) → the order
# button's active state: an instant jump → board (interpolation; a computed
# value must change) → transition-duration switches it on, both ways;
# transition-property: all by default, then background-color; the four
# longhands → the chips: the shorthand with translate, ease by default, then
# linear / ease-out; interrupted transitions turn around → the drinks: hidden
# with opacity, revealed with a stagger of delays; negative delays → today's
# special: a three-item list that replaces the cards' whole list (opacity
# kept; translate fast, box shadow slow),
# individual transform properties vs transform → the gallery photo: grey to
# colour with a filter transition; colours and shadows the same way → the
# price: font-size interpolates, font-family flips (discrete) → the order
# form's border on :focus-within and the field's background on :focus after
# typing a name; both fade back when the editor takes focus → board (triggers: hover,
# focus, focus-within, target, active, a class from JavaScript) → enter vs
# exit on the order button (150ms in, 2s out) → the cup pours because
# --tea-level is registered → reduced motion (viewer's device; the tea drops
# back, at once for a viewer who asks for reduced motion; the opt-in pattern) → board (layout → paint → composite; transform and opacity;
# height: auto; events; transitions above !important) → quiz + recap,
# hand-off to keyframe animations (lesson 39).
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set(; no postcss config; no reload;
# no HTML edit. Every new rule is appended at the END of the file, so an
# unclosed "{" or "(" while typing only swallows the end of the file; the two
# edits into earlier rules (enter / exit) contain no brackets. Rules with
# rgb( or nth-child( or the media query are line-by-line (every revealed line
# is balanced) or the last rule while they are typed. Every state change is a
# class toggled by kit.js through preview.click (class changes replay, and the
# transition runs in the replay); the focus demo uses preview.input, and the
# editor.select after it takes focus back to the editor (a recorded blur).
# Each click whose motion the narration describes lands on the first word of
# that description (the chips' return 1 s before it), so the words and the
# motion overlap.
#
# Measured in headless Chrome at 432 × 720 (probe/stages.ts): header 0–101,
# form 117–304 (order button 251), toggle 312, chips 363–460 (move toggle
# 464), drinks 508–1047 (toggles 546, cards from 589), gallery 1063–1369
# (photo toggle 1338), cup 1385–1585, document 1621 (1636 at the end).
# Scroll positions: 0 (form, toggle, chips), 500 (drinks toggles and all four
# cards), 960 (gallery; clamps to 905 at 720 tall), 2000 (clamps to the end:
# the cup and its button).
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
