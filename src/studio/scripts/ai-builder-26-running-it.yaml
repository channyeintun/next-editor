# AI Builder, lesson 26: running the app in production (Burmese, docs kind).
#
# Start state (ws/): base-docs (package.json with a no-op dev script, notes.md, unused) and
# docs/runbook.md pinned with only its title line. Nothing runs. The lesson writes docs/runbook.md
# (lesson-local, COURSE-KIT §4.18 outline; full text in DESIGN.md and _runbook-final.md): Signals (the
# shop's three numbers, one alert rule, လှလှ's notes), If orders stop arriving (five steps, customer
# first, the agent reads logs but never edits production), After an incident (what, why without blame,
# what we change).
#
# Boards: (S) log / error / metric, each with a tea-shop example; (A) an alert for every error (red) vs
# only when there is something to do (green); (Z) the quiz (7:10, no orders for 20 minutes, no alert:
# read the error log, or try one order on a phone?); (I) an incident, top to bottom: customers first,
# tell people, cause after, learn without blame. The steps section is typed after the quiz.
#
# Build: bun ~/Documents/ai-builder-course-work/tools/build-lesson.ts template.yaml ws ai-builder-26-running-it.yaml
