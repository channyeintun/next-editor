# CSS course (Burmese), lesson 9 of 43: colour. Opens Part 2 (values).
#
# Narration is Burmese (voice-script.md next to this file is its source;
# DESIGN.md is the span-by-span brief). Every [[mark:…]] sits where its action
# begins, at a sentence end; each span carries one piece of meaning.
# Everything the learner sees (title, chapters, whiteboard labels, UI strings)
# is Burmese already.
#
# Shape: board (recall lesson 8; where colour goes; the ways to write it) →
# code tour (index.html: the HSL/OKLCH chip rows and the swatch squares; empty
# styles.css; the header's cream text is unreadable on its transparent
# background) → tomato header (named colour) → tea-brown hex, board (pairs,
# shorthand, alpha), the brown gets two alpha digits → rgb() with slash alpha
# on the hero → board (the HSL wheel) → HSL chips: same lightness, uneven
# brightness → OKLCH chips: even brightness; L, C, H pointed at; OKLab and the
# other spaces in one breath → board (gamut: sRGB inside Display P3, color(),
# out-of-gamut mapping, the color-gamut media query) → scroll to the menu;
# currentColor on the prices, the line follows the text colour; system
# colours explained → color-mix() tint and shade around the pinned brown,
# then blue + yellow mixed in sRGB (grey) and in OKLCH (teal) → relative
# colour syntax tints today's special, with a plain fallback line first →
# board (which syntax when; contrast 4.5:1) → recap, hand-off to units and
# sizes (lesson 10).
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set(; no postcss config. Every typed
# state is plain CSS that hot-swaps with no reload; there is no index.html
# edit and no interaction. Hex values are never keystroke-typed (a half-typed
# "#8b5" is a valid green): hex lines arrive line-by-line, and the two alpha
# digits arrive as one block insert. Every keystroke-typed function value
# (rgb(, hsl(, oklch(, color-mix() is typed into the LAST rule of the file,
# so its open bracket can only swallow the end of its own rule while typed.
# Colour keywords (tomato, sienna, seagreen, currentColor) have no valid
# prefix.
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
