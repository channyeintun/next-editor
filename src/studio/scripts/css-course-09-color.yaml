      # base.css: sections A, B and B2 of the course kit and the parts of C
      # this page uses, WITHOUT the header's background (so its cream text
      # starts unreadable on a transparent background) and WITHOUT the price
      # colour (both typed by the lesson). Section E styles the lesson's chip
      # rows (neutral brown, white text) and swatch squares (empty dashed
      # squares; the middle one pinned to the shop's brown). Never typed,
      # never shown beyond one sentence.
      base.css: |
        /*
          base.css: pinned, never typed during a lesson.
          The shop's palette and the page furniture, so the CSS a lesson types can
          focus on one idea. Lesson 9 keeps sections A, B, B2 and the parts of C its
          page uses, without the header's background and the price colour (the
          lesson types both). Section E styles the chips and swatches.
        */

        /* == A. palette == */
        :root {
          color-scheme: light;
          --tea-dark: #3b2314;
          --tea: #8b5a2b;
          --tea-light: #c9a27e;
          --cream: #fff8ec;
          --paper: #fdf3e1;
          --leaf: #2f6b3a;
          --gold: #c9a227;
          --chili: #b23a2b;
          --ink: #2b1d14;
          --muted: #6b5a4c;
          --line: #e6d5bf;
          --radius: 12px;
        }

        /* == B. page == */
        body {
          margin: 0;
          font-family: "Noto Sans Myanmar", "Myanmar Sangam MN", "Myanmar MN", "Myanmar Text", "Padauk",
            system-ui, sans-serif;
          font-size: 16px;
          line-height: 1.8;
          color: var(--ink);
          background: var(--paper);
        }

        .page {
          padding: 0 16px 24px;
        }

        h1,
        h2,
        h3 {
          margin: 0 0 8px;
          line-height: 1.5;
        }

        h1 {
          font-size: 24px;
        }

        h2 {
          font-size: 20px;
        }

        h3 {
          font-size: 17px;
        }

        a {
          color: var(--tea);
        }

        /* Status lines that only expect.preview reads (kit.js data-report, data-say). */
        .visually-hidden {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip-path: inset(50%);
          white-space: nowrap;
        }

        /* == B2. reset == */
        *,
        *::before,
        *::after {
          box-sizing: border-box;
        }

        /* == C. furniture (lesson 9: no header background, no price colour) == */
        .site-header {
          padding: 16px;
          color: var(--cream);
        }

        .site-header a {
          color: var(--cream);
        }

        .logo {
          display: block;
        }

        .tagline {
          margin: 0;
          color: var(--tea-light);
          font-size: 14px;
        }

        .nav ul {
          margin: 8px 0 0;
          padding: 0;
          list-style: none;
        }

        .hero {
          margin: 16px 0;
          padding: 16px;
          background: var(--cream);
          border-radius: var(--radius);
        }

        .menu {
          margin: 0;
          padding: 0;
          list-style: none;
        }

        .menu-card {
          margin: 0 0 12px;
          padding: 12px 16px;
          background: #fff;
          border: 1px solid var(--line);
          border-radius: var(--radius);
        }

        .menu-card .name,
        .menu-card .desc {
          margin: 0;
        }

        .menu-card .desc {
          color: var(--muted);
          font-size: 14px;
        }

        .price {
          font-weight: 700;
        }

        .badge {
          padding: 0 8px;
          border-radius: 999px;
          background: var(--leaf);
          color: #fff;
          font-size: 13px;
        }

        .order-link {
          display: inline-block;
          padding: 6px 16px;
          border: 0;
          border-radius: 999px;
          background: var(--tea);
          color: #fff;
          font: inherit;
          text-decoration: none;
        }

        /* == E. lesson rules == */
        /* Lesson 9: the chip rows and the swatch squares. The chips start a neutral
           brown with white text; the swatches start as empty dashed squares, except
           the middle one, which shows the shop's brown that the lesson mixes from. */
        .chips,
        .swatches {
          display: flex;
          align-items: center;
          gap: 10px;
          margin: 0 0 12px;
        }

        .row-label {
          width: 56px;
          color: var(--muted);
          font-size: 13px;
        }

        .chip {
          padding: 2px 16px;
          border-radius: 999px;
          background: var(--muted);
          color: #fff;
        }

        .swatch {
          width: 64px;
          height: 64px;
          border: 1px dashed var(--muted);
          border-radius: 8px;
        }

        .swatch.base {
          border-style: solid;
          background: #8b5a2b;
        }
      styles.css: ""
