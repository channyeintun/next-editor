          drawMs: 1000,
        }

  - id: table
    chapter: အစည်းအဝေးအတွက် အဖြေ
    narration: >
      [[mark:t-close]] အခု အစည်းအဝေးကို ပြန်သွားဖို့ operation တစ်ခုချင်းစီကို table နဲ့ ချရေးပါမယ်။
      [[mark:type-seat]] ခုံ ရောင်းတာက strong consistency လိုပါတယ်။ လက်ခံရတဲ့ စရိတ်က internet ပြတ်နေတဲ့ ကောင်တာက
      ခုံအသစ် မရောင်းနိုင်တာပါ။
      [[mark:type-primary]] primary ရွေးတာလည်း လိုပါတယ်။ စက် သုံးလုံးနဲ့ run တဲ့ သက်သေပြပြီးသား system တစ်ခုကို
      သုံးမယ်၊ ရွေးနေတဲ့ စက္ကန့်ပိုင်းမှာ ရေးတာ ခဏ ရပ်တာကို လက်ခံမယ်။
      [[mark:type-list]] ကောင်တာက ခရီးသည် စာရင်း ကြည့်တာနဲ့ လက်မှတ် ပြန်ထုတ်တာကတော့ မလိုပါဘူး။ ကောင်တာမှာ
      သိမ်းထားတဲ့ မိတ္တူကနေ ပြပေးရင် internet ပြတ်လည်း ဆက်လုပ်နိုင်ပါတယ်။
      [[mark:type-answer]] ဒါဆို လှလှ အတွက် အဖြေ ထွက်လာပါပြီ။ internet ပြတ်ချိန်မှာ ကောင်တာက စာရင်းကြည့်တာ၊ လက်မှတ်
      ပြန်ထုတ်တာတွေ ဆက်လုပ်နိုင်ပါမယ်။ ခုံအသစ် ရောင်းတာကိုတော့ ရပ်ထားပါမယ်။
      [[mark:type-quota]] ပြတ်ချိန်မှာပါ ရောင်းနိုင်စေချင်ရင်တော့ ကောင်တာ တစ်ခုစီအတွက် ခုံ တချို့ကို ကြိုတင်
      ခွဲပေးထားရပါမယ်။ ကြိုခွဲထားတဲ့ ခုံဆိုရင် ဘယ်သူ ရမလဲ ဆိုတာ ဆုံးဖြတ်ပြီးသားမို့ ညှိစရာ မလိုတော့ပါဘူး။ ဒါပေမဲ့
      ခွဲထားတဲ့ ခုံတွေကို app က မရောင်းနိုင်တော့တာမို့၊ ဒါက လှလှ နဲ့ ကားလိုင်းတွေ ဆုံးဖြတ်ရမယ့် business
      ဆုံးဖြတ်ချက်ပါ။ ကိုယ့်တာဝန်က ရွေးစရာနဲ့ စရိတ်ကို ရှင်းရှင်း ပြပေးဖို့ပါ။
    sources:
      - {
          title: "Designing Data-Intensive Applications, 2nd edition (Kleppmann, Riccomini)",
          url: "https://oreil.ly/DesigningDataIntensiveApps2",
        }
    actions:
      - { id: close-consensus, type: whiteboard.apply, at: { mark: t-close }, open: false }
      - {
          id: reopen-notebook,
          type: workspace.openFile,
          at: { afterAction: close-consensus },
          path: notebook/34-consistency.md,
        }
      - id: type-seat
        type: editor.type
        at: { mark: type-seat }
        cadence: line-by-line
        target: { file: notebook/34-consistency.md, after: "|---|---|---|---|\n" }
        text: "| ခုံ ရောင်းတာ | လို | တစ်ယောက်ပဲ ရရမယ် | internet ပြတ်တဲ့ ကောင်တာ မရောင်းနိုင် |\n"
      - id: type-primary
        type: editor.type
        at: { mark: type-primary }
        cadence: line-by-line
        target: { file: notebook/34-consistency.md, after: "ကောင်တာ မရောင်းနိုင် |\n" }
        text: "| primary database ရွေးတာ | လို | primary နှစ်ခု မရှိရ | စက် 3 လုံး၊ ရွေးနေတုန်း ရေးတာ ခဏ ရပ် |\n"
      - id: type-list
        type: editor.type
        at: { mark: type-list }
        cadence: line-by-line
        target: { file: notebook/34-consistency.md, after: "ရေးတာ ခဏ ရပ် |\n" }
        text: "| ကောင်တာ: စာရင်းကြည့်၊ လက်မှတ် ပြန်ထုတ် | မလို | နောက်မှ လိုက်မီလည်း ရ | မိနစ်ပိုင်း ဟောင်းနိုင် |\n"
      - id: type-answer
        type: editor.type
        at: { mark: type-answer }
        cadence: line-by-line
        target: { file: notebook/34-consistency.md, after: "| မိနစ်ပိုင်း ဟောင်းနိုင် |\n" }
        text: "\n## လှလှ အတွက် အဖြေ\n- internet ပြတ်ချိန်: စာရင်းကြည့်၊ လက်မှတ် ပြန်ထုတ် ဆက်ရမယ်\n- ပြတ်ချိန်မှာ ခုံအသစ် မရောင်းဘူး\n"
      - id: expect-answer
        type: expect.file
        at: { afterAction: type-answer }
        path: notebook/34-consistency.md
        contains: "- ပြတ်ချိန်မှာ ခုံအသစ် မရောင်းဘူး\n"
      - id: type-quota
        type: editor.type
        at: { mark: type-quota }
        cadence: line-by-line
        target: { file: notebook/34-consistency.md, after: "- ပြတ်ချိန်မှာ ခုံအသစ် မရောင်းဘူး\n" }
        text: "- ပြတ်ချိန်မှာပါ ရောင်းချင်ရင်: ကောင်တာအတွက် ခုံ ကြိုခွဲမလား၊ business က ဆုံးဖြတ်\n"

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ ခရီးစဉ် ရှာတဲ့ စာမျက်နှာက လွန်ခဲ့တဲ့ နှစ်စက္ကန့်က ရောင်းပြီးသွားတဲ့ ခုံ
      တစ်ခုံကို လွတ်နေတယ်လို့ ပြနေပါတယ်။ ခရီးသည်က အဲဒီခုံကို ရွေးပြီး ဝယ်ဖို့ ကြိုးစားတော့၊ ဒီခုံ ကုန်သွားပါပြီ၊
      တခြားခုံ ရွေးပေးပါလို့ ယဉ်ယဉ်ကျေးကျေး ပြန်ပြောပါတယ်။
      [[mark:q-a]] ဒါက လက်ခံနိုင်တဲ့ အပြုအမူလား။
      [[mark:q-b]] ဒါမှမဟုတ် ပြင်ရမယ့် အမှားလား။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ လက်ခံနိုင်တယ် ဆိုတာပါ။
      [[mark:q-why]] ဘာကြောင့်လဲဆိုတော့ မှန်ရမယ့် အချိန်က ဝယ်တဲ့ အချိန်ဖြစ်ပြီး၊ အဲဒီမှာ system က မှန်မှန်ကန်ကန်
      ငြင်းခဲ့လို့ပါ။ နှစ်စက္ကန့် ဟောင်းတဲ့ ရှာဖွေမှု ရလဒ်ကြောင့် ဘယ်သူမှ မနစ်နာပါဘူး။
      [[mark:q-cost]] ရှာတာက နောက်မှ လိုက်မီလည်း ရတဲ့ အုပ်စုထဲမှာပါ။ ရှာတာကိုပါ အမြဲ မှန်အောင် လုပ်မယ်ဆိုရင်၊ ရှာတဲ့
      request တိုင်းက primary ကို သွားမေးရပြီး၊ ပြန်ရတာကတော့ ဘာမှ မရှိသလောက်ပါပဲ။
    sources:
      - {
          title: "Designing Data-Intensive Applications, 2nd edition (Kleppmann, Riccomini)",
          url: "https://oreil.ly/DesigningDataIntensiveApps2",
        }
    actions:
      - {
