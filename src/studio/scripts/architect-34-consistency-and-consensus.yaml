          upsertIds: [q-a-line, q-a-ok],
          drawMs: 900,
        }
      - {
          id: draw-q-why,
          type: whiteboard.apply,
          at: { mark: q-why },
          upsertIds: [q-why],
          drawMs: 1200,
        }
      - {
          id: draw-q-cost,
          type: whiteboard.apply,
          at: { mark: q-cost },
          upsertIds: [q-cost],
          drawMs: 1200,
        }

  - id: your-turn
    chapter: ကိုယ့် system အတွက်
    narration: >
      [[mark:turn]] ရှာတာကိုလည်း table ထဲ ထည့်လိုက်ပါမယ်။
      [[mark:type-search]] strong consistency မလိုဘူး၊ ရောင်းပြီးသား ခုံကို ခဏ လွတ်တယ်လို့ ပြမိတာကို လက်ခံတယ်
      ဆိုတာလည်း ရေးထားရမယ့် ဆုံးဖြတ်ချက် တစ်ခုပါ။
      [[mark:turn-you]] အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ကိုယ့် system ထဲက တစ်ယောက်ပဲ အနိုင်ရရမယ့်
      operation တွေကို ဒီ table ထဲမှာ စာရင်းလုပ်ကြည့်ပါ။
      [[mark:turn-2]] တစ်ခုတည်းပဲ ရှိရမယ့် နာမည်၊ တစ်ခါပဲ သုံးလို့ရတဲ့ code၊ တစ်ယောက်ပဲ ယူလို့ရတဲ့ ပစ္စည်း စတာတွေကို
      ရှာကြည့်ပါ။ စာရင်းက ကိုယ် ထင်ထားတာထက် တိုနေပါလိမ့်မယ်။
    sources:
      - {
          title: "Designing Data-Intensive Applications, 2nd edition (Kleppmann, Riccomini)",
          url: "https://oreil.ly/DesigningDataIntensiveApps2",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: turn }, open: false }
      - id: type-search
        type: editor.type
        at: { mark: type-search }
        cadence: line-by-line
        target: { file: notebook/34-consistency.md, after: "| မိနစ်ပိုင်း ဟောင်းနိုင် |\n" }
        text: "| ခရီးစဉ် ရှာတာ | မလို | မှန်ရမယ့်အချိန်က ဝယ်တဲ့အချိန် | ရောင်းပြီးသား ခုံ ခဏ လွတ်ပြနိုင် |\n"
      - id: sel-seat
        type: editor.select
        at: { mark: turn-you }
        target: { file: notebook/34-consistency.md, text: "| ခုံ ရောင်းတာ | လို | တစ်ယောက်ပဲ ရရမယ် |" }

  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ strong consistency ဆိုတာ မိတ္တူ တစ်ခုတည်း ရှိသလို ပြုမူတာပါ။ တစ်ယောက်ပဲ အနိုင်ရရမယ့်
      ကိစ္စ အနည်းငယ်အတွက်ပဲ တကယ် လိုပြီး၊ စရိတ်ကတော့ နေ့တိုင်း နှေးတာနဲ့ network ပြတ်ချိန်မှာ ငြင်းရတာပါ။
      [[mark:recap-2]] ဒါကြောင့် သုံးခုထဲက နှစ်ခု ရွေးဖို့ မငြင်းဘဲ၊ operation တစ်ခုချင်းစီအတွက် ဘယ်နေရာမှာ ခဏလေးတောင်
      မမှားရဘူးလဲ မေးပါ။ တစ်ယောက်ပဲ အနိုင်ရရမယ့် ပုံစံကို တွေ့ရင် consensus ပြဿနာလို့ မှတ်ပြီး၊ သက်သေပြပြီးသား
      system ကို သုံးပါ။
      [[mark:next]] ကျန်တဲ့ operation အများစုကတော့ နောက်မှ လိုက်မီတဲ့ data နဲ့ပဲ အလုပ်လုပ်ပါတယ်။ အဲဒီ data တွေကို
      မူရင်းနဲ့ ဘယ်လို လိုက်မီအောင် ထားမလဲ။ နောက် lesson မှာတော့ event stream နဲ့၊ မူရင်းကနေ ထုတ်ယူထားတဲ့ derived
      data ကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "Designing Data-Intensive Applications, 2nd edition (Kleppmann, Riccomini)",
          url: "https://oreil.ly/DesigningDataIntensiveApps2",
        }
    actions:
      - id: sel-header
        type: editor.select
        at: { mark: recap-2 }
        target:
          {
            file: notebook/34-consistency.md,
            text: "| Operation | Strong consistency လိုလား | ဘာကြောင့် | လက်ခံတဲ့ စရိတ် |",
          }

checks:
  - { type: timing.p95Ms, max: 300 }
