scenes:
  - id: need
    chapter: သုံးခုထဲက နှစ်ခု ရွေးရမှာလား
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ distributed system တစ်ခုမှာ network၊ နာရီနဲ့ process တွေကို မယုံရပုံနဲ့၊ ထပ်ပို့လည်း
      အန္တရာယ် မရှိတဲ့ call ကို design ဆွဲပုံကို လေ့လာခဲ့ပါတယ်။
      [[mark:open-doc]] ဒီအပတ်မှာတော့ design အစည်းအဝေး တစ်ခုက ရှေ့မတိုးဘဲ ရပ်နေပါတယ်။
      [[mark:sel-ask]] အစက product manager လှလှ ရဲ့ တောင်းဆိုချက်ပါ။ ကားဂိတ်တွေမှာ internet က မကြာခဏ
      ပြတ်တတ်ပြီး၊ ပြတ်တိုင်း ကောင်တာ ဝန်ထမ်းတွေက ဘာမှ လုပ်မရ ဖြစ်နေပါတယ်။ internet ပြတ်နေလည်း ကောင်တာက အလုပ်
      ဆက်လုပ်နိုင်အောင် လုပ်ပေးပါ ဆိုတာပါ။
      [[mark:cap]] အစည်းအဝေးမှာ developer တစ်ယောက်က CAP theorem ကို ကိုးကားပါတယ်။ data အမြဲ မှန်နေတဲ့
      consistency၊ အမြဲ သုံးလို့ရနေတဲ့ availability နဲ့၊ network ပြတ်တာကို ခံနိုင်တဲ့ partition tolerance ဆိုတဲ့
      သုံးခုထဲက နှစ်ခုကိုပဲ ရွေးလို့ရတာမို့၊ ကိုယ်တို့က availability ကို ရွေးရမယ်လို့ ဆိုပါတယ်။
      [[mark:mm]] Booking team lead မောင်မောင် ကတော့ ထိုင်ခုံ ရောင်းတဲ့ system မှာ consistency ကို လက်မလွှတ်နိုင်ဘူးလို့ ပြန်ပြောပါတယ်။
      တစ်နာရီလုံးလုံး အဲဒီ စကားလုံး သုံးလုံးပေါ်မှာပဲ ငြင်းနေကြပါတယ်။
      [[mark:real-q]] နှစ်ယောက်လုံး မမှားပါဘူး။ မေးခွန်းက ကျယ်လွန်းနေတာပါ။ တကယ် မေးရမယ့် မေးခွန်းက၊ ခရီးဖော် က
      ဘယ်နေရာတွေမှာ ခဏလေးတောင် မမှားရဘူးလဲ ဆိုတာပါ။
    sources:
      - {
          title: "Designing Data-Intensive Applications, 2nd edition (Kleppmann, Riccomini)",
          url: "https://oreil.ly/DesigningDataIntensiveApps2",
        }
      - { title: "CAP theorem (Wikipedia)", url: "https://en.wikipedia.org/wiki/CAP_theorem" }
    actions:
      - {
          id: open-notebook,
          type: workspace.openFile,
          at: { mark: open-doc },
          path: notebook/34-consistency.md,
        }
      - id: sel-ask
        type: editor.select
        at: { mark: sel-ask }
        target:
          {
            file: notebook/34-consistency.md,
            text: "ကားဂိတ်မှာ internet ပြတ်နေလည်း ကောင်တာက အလုပ် ဆက်လုပ်နိုင်ရမယ်",
          }

  - id: one-copy
    chapter: မိတ္တူ တစ်ခုတည်း ရှိသလို
    narration: >
      [[mark:o-copies]] ခရီးဖော် ရဲ့ data က primary database တစ်ခုနဲ့ ဖတ်ဖို့သက်သက် မိတ္တူ၊ read replica နှစ်ခုမှာ
      ရှိပါတယ်။ replica တွေက primary နောက်မှာ ခဏ ကျန်နေတတ်ပါတယ်။
      [[mark:o-one]] CAP ထဲက consistency ဆိုတာ အားအကောင်းဆုံး အာမခံချက်ဖြစ်တဲ့ strong consistency ပါ။ မိတ္တူ ဘယ်နှခု ရှိရှိ၊ အပြင်ကကြည့်ရင် မိတ္တူ
      တစ်ခုတည်း ရှိသလို ပြုမူတာကို ဆိုလိုပါတယ်။ ရေးတာ တစ်ခု ပြီးတာနဲ့၊ နောက်ဖတ်တဲ့သူတိုင်းက ဘယ်ကနေ ဖတ်ဖတ် အဲဒီ
      တန်ဖိုးအသစ်ကို မြင်ရပါတယ်။ ဒါကို linearizability လို့လည်း ခေါ်ပါတယ်။
      [[mark:o-eventual]] သူ့ရဲ့ တစ်ဖက်စွန်းက eventual consistency ပါ။ မိတ္တူတွေက ခဏ ကွာနေနိုင်ပေမဲ့ နောက်ဆုံးမှာ
      တူသွားမယ် ဆိုတဲ့ အာမခံချက်ပါ။
      [[mark:o-who]] strong consistency ကို တကယ် လိုတာက ကိစ္စ အနည်းငယ်ပါပဲ။ ပထမ အမျိုးအစားက တစ်ယောက်ပဲ
      အနိုင်ရရမယ့် ကိစ္စတွေပါ။ ထိုင်ခုံ တစ်ခုံကို တစ်ယောက်ပဲ ရရမယ်၊ username တစ်ခုကို တစ်ယောက်ပဲ ယူရမယ်၊ lock
      တစ်ခုကို တစ်ယောက်ပဲ ကိုင်ရမယ် ဆိုတာမျိုးပါ။ နှစ်ယောက်လုံးက ကိုယ်ရပြီလို့ ခဏလေး ထင်သွားတာနဲ့ ပြန်ပြင်ရ
      ခက်ပါပြီ။
      [[mark:o-race]] ဒုတိယ အမျိုးအစားက လမ်းကြောင်း နှစ်ခုက အပြိုင် ပြေးတဲ့ ကိစ္စပါ။ ဥပမာ လက်မှတ် ရပြီ ဆိုတဲ့ SMS က
      ခရီးသည်ဆီ ရောက်နေပြီ၊ သူ ဖွင့်ကြည့်တဲ့ စာမျက်နှာက နောက်ကျနေတဲ့ replica ကနေ ဖတ်ရင် လက်မှတ် မပေါ်သေးတာမျိုးပါ။ ဝယ်ပြီး တစ်မိနစ်အတွင်း primary ကနေ ဖတ်ခိုင်းထားတာ ဒါကြောင့်ပါ။
    sources:
      - {
          title: "Designing Data-Intensive Applications, 2nd edition (Kleppmann, Riccomini)",
          url: "https://oreil.ly/DesigningDataIntensiveApps2",
        }
    actions:
      - {
          id: draw-o-copies,
          type: whiteboard.apply,
          at: { mark: o-copies },
          open: true,
          upsertIds: [o-p, o-p-l, o-r1, o-r1-l, o-r2, o-r2-l],
          drawMs: 2800,
        }
      - {
          id: draw-o-one,
          type: whiteboard.apply,
          at: { mark: o-one },
          upsertIds: [o-title, o-wrap, o-wrap-l],
          drawMs: 2000,
        }
      - {
          id: draw-o-eventual,
          type: whiteboard.apply,
          at: { mark: o-eventual },
          upsertIds: [o-ev],
          drawMs: 1200,
        }
      - {
          id: draw-o-who,
          type: whiteboard.apply,
          at: { mark: o-who },
          upsertIds: [o-win],
          drawMs: 1200,
        }
      - {
          id: draw-o-race,
          type: whiteboard.apply,
          at: { mark: o-race },
          upsertIds: [o-race],
          drawMs: 1200,
        }

  - id: price
    chapter: ဖြေမလား၊ မှန်မလား
    narration: >
      [[mark:p-open]] ဒီအာမခံချက်က အလကား မရပါဘူး။ စရိတ် နှစ်မျိုး ပေးရပါတယ်။
      [[mark:p-latency]] ပထမ စရိတ်ကို နေ့တိုင်း ပေးရပါတယ်။ မိတ္တူ တစ်ခုတည်းလို ပြုမူဖို့ဆိုရင်၊ ဖြေမယ့် စက်က သူ့မှာ
      ရှိတာ နောက်ဆုံး တန်ဖိုး ဟုတ်မဟုတ် တခြားစက်တွေနဲ့ အရင် ညှိရပါတယ်။ ညှိရတဲ့ အချိန်က network ကောင်းနေတဲ့ နေ့မှာတောင်
      request တိုင်းရဲ့ တုံ့ပြန်ချိန်ထဲ ပေါင်းပါသွားပါတယ်။
      [[mark:p-split]] ဒုတိယ စရိတ်ကတော့ network ပြတ်တဲ့အခါမှ ပေးရပါတယ်။ ကားဂိတ်က ကောင်တာနဲ့ primary database
      ကြားက လမ်းကြောင်း ပြတ်သွားပြီ ဆိုပါစို့။ ကောင်တာ ဝန်ထမ်းက ခုံ တစ်ခုံကို ရောင်းချင်ပါတယ်။
      [[mark:p-choice]] ဒီအခါ ရွေးစရာ နှစ်ခုပဲ ရှိပါတယ်။ ဖြေမလား၊ မှန်မလား ဆိုတာပါ။
      [[mark:p-ans]] ကောင်တာက သူ့ဆီမှာ ရှိတဲ့ data နဲ့ ရောင်းလိုက်ရင် အလုပ်တော့ ဆက်ဖြစ်ပါတယ်။ ဒါပေမဲ့ အဲဒီခုံကို
      app ကနေ တစ်ယောက်က ဝယ်ပြီးသား ဖြစ်နေနိုင်ပါတယ်။
      [[mark:p-right]] မှားမခံနိုင်ဘူးဆိုရင်တော့ ကောင်တာက လမ်းကြောင်း ပြန်ရတဲ့အထိ ငြင်းထားရပါမယ်။
      [[mark:p-cap]] CAP theorem က တကယ် ပြောတာ ဒါပါပဲ။ သုံးခုထဲက နှစ်ခု ရွေးတာ မဟုတ်ပါဘူး။ network ပြတ်တာက ကိုယ်
      ရွေးလို့ရတဲ့ အရာ မဟုတ်ဘဲ၊ တစ်နေ့နေ့ ဖြစ်လာမယ့် အရာပါ။ ပြတ်တဲ့ အချိန်ရောက်မှ ဖြေမလား မှန်မလား နှစ်ခုထဲက
      တစ်ခုကို ရွေးရတာပါ။
      [[mark:p-each]] အရေးကြီးတာက ဒီရွေးချယ်မှုကို system တစ်ခုလုံးအတွက် တစ်ခါတည်း ရွေးစရာ မလိုတာပါ။ operation တစ်ခုစီအတွက် ရွေးလို့ ရပါတယ်။
    sources:
      - {
          title: "Designing Data-Intensive Applications, 2nd edition (Kleppmann, Riccomini)",
          url: "https://oreil.ly/DesigningDataIntensiveApps2",
        }
      - { title: "CAP theorem (Wikipedia)", url: "https://en.wikipedia.org/wiki/CAP_theorem" }
    actions:
      - {
          id: draw-p-open,
          type: whiteboard.apply,
          at: { mark: p-open },
          clear: true,
          upsertIds: [p-title],
          drawMs: 900,
        }
      - {
          id: draw-p-latency,
          type: whiteboard.apply,
          at: { mark: p-latency },
          upsertIds: [p-c1],
          drawMs: 1200,
        }
      - {
          id: draw-p-split,
          type: whiteboard.apply,
          at: { mark: p-split },
          upsertIds: [p-ctr, p-ctr-l, p-link, p-db, p-db-l, p-cut],
          drawMs: 2800,
        }
      - {
          id: draw-p-choice,
          type: whiteboard.apply,
          at: { mark: p-choice },
          upsertIds: [p-c2],
          drawMs: 1200,
        }
      - {
          id: draw-p-ans,
          type: whiteboard.apply,
          at: { mark: p-ans },
          upsertIds: [p-ch1],
          drawMs: 1200,
        }
      - {
          id: draw-p-right,
          type: whiteboard.apply,
          at: { mark: p-right },
          upsertIds: [p-ch2],
          drawMs: 1200,
        }
      - { id: point-p-c2, type: whiteboard.point, at: { mark: p-cap }, target: { assetId: p-c2 } }
      - {
          id: draw-p-each,
          type: whiteboard.apply,
          at: { mark: p-each },
          upsertIds: [p-each],
          drawMs: 1200,
        }

  - id: columns
    chapter: အုပ်စု နှစ်စု ခွဲခြင်း
    narration: >
      [[mark:k-open]] ဒါဆို ခရီးဖော် ရဲ့ operation တွေကို အုပ်စု နှစ်စု ခွဲကြည့်ရအောင်။ အခုချက်ချင်း မှန်ရမယ့်
      အုပ်စုနဲ့၊ နောက်မှ လိုက်မီလည်း ရတဲ့ အုပ်စုပါ။
      [[mark:k-seat]] ခုံ ရောင်းတာက ပထမ အုပ်စုပါ။ app ကပဲ ရောင်းရောင်း၊ ကောင်တာကပဲ ရောင်းရောင်း၊ တစ်ယောက်ပဲ
      အနိုင်ရရမယ့် ကိစ္စမို့ပါ။
      [[mark:k-leader]] primary database ကို ရွေးတာလည်း ပထမ အုပ်စုပါ။ primary ပျက်လို့ replica တစ်ခုကို
      အစားထိုးတဲ့အခါ၊ primary နှစ်ခု တစ်ပြိုင်တည်း ရှိသွားရင် data က နှစ်ခြမ်း ကွဲသွားမှာပါ။
      [[mark:k-lock]] ပြီးခဲ့တဲ့ lesson က settlement job ရဲ့ lock လည်း ဒီအုပ်စုထဲမှာပါ။
      [[mark:k-list]] ဒုတိယ အုပ်စုကို ကြည့်ရအောင်။ ကောင်တာ ဝန်ထမ်းက ဒီနေ့ ထွက်မယ့် ကားရဲ့ ခရီးသည် စာရင်းကို
      ကြည့်တာ၊ ရောင်းပြီးသား လက်မှတ်ကို ပြန်ထုတ်ပေးတာတွေက မိနစ်အနည်းငယ် ဟောင်းနေလည်း ဘာမှ မဖြစ်ပါဘူး။
      [[mark:k-dash]] ကားလိုင်းတွေ ကြည့်တဲ့ ရောင်းအား dashboard နဲ့ report တွေလည်း အဲဒီလိုပါပဲ။
      [[mark:k-count]] ရေတွက်ကြည့်ရင် အခုချက်ချင်း မှန်ရမယ့် ကိစ္စက လက်ချိုးရေလို့ ရပါတယ်။ ကျန်တာ အများစုက နောက်မှ
      လိုက်မီလည်း ရပါတယ်။ ဒါကြောင့် နည်းတဲ့ဘက်ကို အမှတ်အသား လုပ်ထားပြီး၊ ကျန်တာကို eventual consistency နဲ့
      ထားလိုက်ရင် စရိတ် အများကြီး သက်သာပါတယ်။
    sources:
      - {
          title: "Designing Data-Intensive Applications, 2nd edition (Kleppmann, Riccomini)",
          url: "https://oreil.ly/DesigningDataIntensiveApps2",
        }
    actions:
      - {
          id: draw-k-open,
          type: whiteboard.apply,
          at: { mark: k-open },
          clear: true,
          upsertIds: [k-left, k-left-h, k-right, k-right-h],
          drawMs: 2400,
        }
      - {
          id: draw-k-seat,
          type: whiteboard.apply,
          at: { mark: k-seat },
          upsertIds: [k-seat],
          drawMs: 900,
        }
      - {
          id: draw-k-leader,
          type: whiteboard.apply,
          at: { mark: k-leader },
          upsertIds: [k-leader],
          drawMs: 900,
        }
      - {
          id: draw-k-lock,
          type: whiteboard.apply,
          at: { mark: k-lock },
          upsertIds: [k-lock],
          drawMs: 900,
        }
      - {
          id: draw-k-list,
          type: whiteboard.apply,
          at: { mark: k-list },
          upsertIds: [k-list, k-reprint],
          drawMs: 1500,
        }
      - {
          id: draw-k-dash,
          type: whiteboard.apply,
          at: { mark: k-dash },
          upsertIds: [k-dash],
          drawMs: 900,
        }
      - {
          id: point-k-left,
          type: whiteboard.point,
          at: { mark: k-count },
          target: { assetId: k-left-h },
        }

  - id: consensus
    chapter: Consensus ကို ကိုယ်တိုင် မရေးပါနဲ့
    narration: >
      [[mark:n-open]] ပထမ အုပ်စုထဲက ကိစ္စတွေကို သေချာကြည့်ရင် ပုံစံ တစ်ခုတည်းပါ။ ဒီခုံက ဘယ်သူ့ဟာလဲ၊ primary က
      ဘယ်စက်လဲ၊ lock က ဘယ်သူ့လက်ထဲမှာလဲ ဆိုတာတွေပါ။ စက်တွေ အများကြီးက အဖြေ တစ်ခုတည်းကို သဘောတူရတာပါ။
      [[mark:n-name]] စက်တွေ အများစု တစ်ခုတည်းကို သဘောတူအောင် လုပ်တာကို consensus လို့ ခေါ်ပါတယ်။ ပြဿနာ တစ်ခုမှာ
      တစ်ယောက်ပဲ အနိုင်ရရမယ် ဆိုတဲ့ ပုံစံ ပေါ်လာတာနဲ့၊ အဲဒါ consensus ပြဿနာ ဖြစ်နေပြီလို့ မှတ်ပါ။
      [[mark:n-hard]] consensus က ခက်ပါတယ်။ ပျောက်တဲ့ message၊ မတူတဲ့ နာရီ၊ ရပ်သွားတဲ့ process တွေ အားလုံးကြားထဲမှာ
      မှန်အောင် လုပ်ရလို့ပါ။ ကောင်းတာက ဒါကို ဖြေရှင်းပြီးသား ဖြစ်နေတာပါ။ စမ်းသပ်ခံထားပြီးသား algorithm တွေနဲ့
      အဲဒါတွေကို သုံးထားတဲ့ system တွေ ရှိပါတယ်။
      [[mark:n-nodes]] အဲဒီ system တွေက စက် အများစုရဲ့ သဘောတူညီချက်နဲ့ ဆုံးဖြတ်ပါတယ်။ စက် သုံးလုံး ထားရင် နှစ်လုံး
      သဘောတူတာနဲ့ ဆုံးဖြတ်နိုင်လို့၊ တစ်လုံး ပျက်တာကို ခံနိုင်ပါတယ်။ ငါးလုံး ထားရင် နှစ်လုံး ပျက်တာအထိ ခံနိုင်ပါတယ်။
      အများစုဘက်မှာ မပါတဲ့ စက်ကတော့ မဖြေဘဲ ရပ်နေရပါတယ်။
      [[mark:n-own]] ဒါကြောင့် စည်းကမ်း တစ်ခုကို မှတ်ထားပါ။ consensus ကို ကိုယ်တိုင် မရေးပါနဲ့။ primary ပျက်ရင် replica
      ကို အစားထိုးပေးမယ့် script လေး တစ်ခု ကိုယ်တိုင် ရေးလိုက်တာက၊ မသိလိုက်ဘဲ consensus ကို ကိုယ်တိုင် ရေးနေတာပါ။
      သက်သေပြပြီးသား system ကိုပဲ သုံးပါ။
    sources:
      - {
          title: "Designing Data-Intensive Applications, 2nd edition (Kleppmann, Riccomini)",
          url: "https://oreil.ly/DesigningDataIntensiveApps2",
        }
    actions:
      - {
