  - id: starter
    narration: >
      ဆိုင်ရဲ့ ပို့ခ code ကို ကြည့်ရအောင်။ [[mark:select-rules]] ဖိုင်ရဲ့ ထိပ်မှာ ပို့ခ စည်းကမ်းကို
      comment နဲ့ ရေးထားပါတယ်။ ၂ ကီလိုမီတာ အထိ ၁၀၀၀ ကျပ်၊ အဲဒီထက် ဝေးရင် ကီလိုမီတာ တစ်ခုစီကို ၃၀၀
      ကျပ် ထပ်ပေါင်းပြီး၊ ၂၀၀၀၀ ကျပ်နဲ့ အထက် မှာရင် အလကား ပို့ပေးပါတယ်။ ည ၉ နာရီ ကစပြီးတော့ ၅၀၀ ကျပ်
      ထပ်ယူပါတယ်။ [[mark:select-fetch]] ပို့ခ တွက်တဲ့ function က အရင်ဆုံး distance service ကို
      network ကနေ ခေါ်ပြီး ကီလိုမီတာကို ယူပါတယ်။ [[mark:select-clock]] ပြီးတော့ လက်ရှိ နာရီကို
      ကိုယ်တိုင် ဖတ်ပါတယ်။ [[mark:select-maths]] ဒီ နှစ်ခု ပြီးမှ တကယ် စစ်ချင်တဲ့ ပို့ခ တွက်တဲ့
      အပိုင်း ပါပါတယ်။ ဆိုလိုတာက ဂဏန်း တွက်တာ တစ်ခုကို စစ်ချင်ရုံနဲ့ network ရော နာရီကိုပါ
      ထိန်းထားရတာပါ။ [[mark:open-test]] test ဖိုင်ကို ကြည့်ရအောင်။ [[mark:select-stub]] ဒီ test က
      fetch ကို stub Global နဲ့ အစားထိုးပြီး၊ ဗဟန်း ဆိုရင် ၃ ကီလိုမီတာလို့ ဖြေခိုင်းထားပါတယ်။
      [[mark:select-fake-clock]] fake timers နဲ့ နာရီကိုလည်း ည ၉ နာရီမှာ ရပ်ထားပြီး၊
      [[mark:select-cleanup]] test ပြီးတိုင်း နှစ်ခုလုံးကို ပြန်ဖြုတ်ပေးရပါတယ်။ ပို့ခ ၁၈၀၀
      ဖြစ်ရမယ်လို့ စစ်တာ တစ်ခုအတွက် ပြင်ဆင်ရတာ အများကြီးပါ။ [[mark:select-import]] import line
      မှာတော့ မရှိသေးတဲ့ function တစ်ခုကို ကြိုထည့်ထားပါတယ်။ ဒီ lesson မှာ test အရင် ရေးပြီး
      ဆောက်မယ့် pure function ပါ။
    sources:
      - {
          title: "web.dev Learn Testing: What to test, opaque versus clear box",
          url: "https://web.dev/learn/testing/get-started/what-to-test",
        }
      - {
          title: "Vitest: Mocking globals (vi.stubGlobal)",
          url: "https://vitest.dev/guide/mocking/globals",
        }
      - {
          title: "Vitest: Mocking dates and timers",
          url: "https://vitest.dev/guide/mocking/timers",
        }
    actions:
      - id: close-a
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: select-rules
        type: editor.select
        at: { mark: select-rules }
        target:
          {
            file: src/delivery.js,
            text: "// Delivery fee: 1000 up to 2 km, then +300 for each started km.\n// Free for orders of 20000 Kyat or more; +500 at night (from 21:00).",
            occurrence: 1,
          }
      - id: select-fetch
        type: editor.select
        at: { mark: select-fetch }
        target: { file: src/delivery.js, text: "await fetchDistance(township)", occurrence: 1 }
      - id: select-clock
        type: editor.select
        at: { mark: select-clock }
        target: { file: src/delivery.js, text: "new Date().getHours()", occurrence: 1 }
      - id: select-maths
        type: editor.select
        at: { mark: select-maths }
        target:
          {
            file: src/delivery.js,
            text: "let fee = 1000 + 300 * Math.ceil(Math.max(0, km - 2));\n  if (hour >= 21) fee += 500;",
            occurrence: 1,
          }
      - id: open-test
        type: workspace.openFile
        at: { mark: open-test }
        path: src/delivery.test.js
      - id: select-stub
        type: editor.select
        at: { mark: select-stub }
        target:
          {
            file: src/delivery.test.js,
            text: 'vi.stubGlobal("fetch", vi.fn().mockResolvedValue(response));',
            occurrence: 1,
          }
      - id: select-fake-clock
        type: editor.select
        at: { mark: select-fake-clock }
        target:
          {
            file: src/delivery.test.js,
            text: "vi.useFakeTimers();\n  vi.setSystemTime(new Date(2026, 10, 5, 21, 0));",
            occurrence: 1,
          }
      - id: select-cleanup
        type: editor.select
        at: { mark: select-cleanup }
        target:
          {
            file: src/delivery.test.js,
            text: "vi.unstubAllGlobals();\n  vi.useRealTimers();",
            occurrence: 1,
          }
      - id: select-import
        type: editor.select
        at: { mark: select-import }
        target: { file: src/delivery.test.js, text: "deliveryQuote", occurrence: 1 }

  - id: panel
    narration: >
      [[mark:ready]] ညာဘက်က Vitest panel ကို ကြည့်ရအောင်။ ဒါက code ပြောင်းတိုင်း သူ့ဘာသာ ပြန် run ပေးတဲ့
      တကယ့် Vitest ရဲ့ ရလဒ်ပါ။ [[mark:read-pass]] test တစ်ခုပဲ ရှိပြီး pass ဖြစ်နေပါတယ်။ အလုပ်တော့
      လုပ်ပါတယ်။ ဒါပေမဲ့ နေ့ခင်း ပို့တာ၊ ဝေးဝေး ပို့တာလို case တစ်ခု ထပ်စစ်ချင်တိုင်း stub နဲ့ fake
      timers ကို အသစ် ပြန်ပြင်ဆင်ရမှာ ဖြစ်ပြီး၊ ပြန်ဖြုတ်ဖို့ မေ့သွားရင် နောက် test တွေကိုပါ
      ထိခိုက်နိုင်ပါတယ်။
    sources:
      - {
          title: "Vitest: Writing Tests, reading test output",
          url: "https://vitest.dev/guide/learn/writing-tests#reading-test-output",
        }
      - {
          title: "Vitest: Testing in Practice, when to mock",
          url: "https://vitest.dev/guide/learn/testing-in-practice#when-to-mock",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-start-pass
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1000 }
      - id: expect-start-one
        type: expect.preview
        at: { afterAction: expect-start-pass }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "1" }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: pure-core
    chapter: "Pure function ကို TDD နဲ့ ရေးရအောင်"
    narration: >
      ပို့ခ တွက်တဲ့ အပိုင်းကို pure function အဖြစ် ခွဲထုတ်ရအောင်။ TDD lesson တွေကလိုပဲ test ကို အရင်
      ရေးပါမယ်။ ဒါပေမဲ့ ဒီတစ်ခါ test သုံးခုကို တစ်ခါတည်း ရေးမှာပါ။ test list lesson မှာ အားလုံးကို
      တစ်ခါတည်း မရေးဖို့ ပြောခဲ့ပေမဲ့၊ ဒီ စည်းကမ်းတွေက ရှိပြီးသား code ထဲက ရွှေ့ထုတ်တာ ဖြစ်လို့ design
      ပြောင်းစရာ မရှိပါဘူး။ [[mark:type-pure]] test ဖိုင်ရဲ့ အောက်ဆုံးမှာ ထည့်လိုက်ပါမယ်။ test
      တစ်ခုစီက ဖိုင် ထိပ်က စည်းကမ်း တစ်ခုစီကို စစ်ပါတယ်။ တစ်ခုချင်း ကြည့်ရအောင်။ [[mark:select-pure-1]] ပထမ test က ၃ ကီလိုမီတာကို ည ၈ နာရီမှာ ပို့ရင်
      ၁၃၀၀ ကျပ် ဖြစ်ရမယ်လို့ စစ်ပါတယ်။ [[mark:select-pure-2]] ဒုတိယက အဲဒီ ခရီးကိုပဲ ည ၉ နာရီမှာ
      ပို့ရင် ၁၈၀၀ ကျပ် ဖြစ်ရမယ်လို့ စစ်ပြီး၊ [[mark:select-pure-3]] တတိယကတော့ ၂၀၀၀၀ ကျပ်ဖိုး မှာရင်
      အလကား ဖြစ်ရမယ်လို့ စစ်ပါတယ်။ stub လည်း မရှိ၊ fake timers လည်း မရှိဘဲ၊ ဂဏန်း သုံးလုံး ပေးပြီး
      အဖြေကို စစ်ရုံပါပဲ။ [[mark:read-not-fn]] panel ကို ကြည့်ပါ။ test အသစ် သုံးခုလုံး ကြက်ခြေခတ်နဲ့
      ကျနေပြီး၊ ပို့ခ တွက်မယ့် function က မရှိသေးဘူးလို့ ပြောနေပါတယ်။ ဒါက TDD lesson မှာ မြင်ခဲ့တဲ့
      မှားတဲ့ အကြောင်းနဲ့ ကျတဲ့ red ပါ။ [[mark:type-empty]] ဒါကြောင့် delivery ဖိုင်မှာ ဘာမှ
      မလုပ်သေးတဲ့ function အလွတ် တစ်ခုကို အရင် ထည့်ပါမယ်။ parameter သုံးခုကတော့ ကီလိုမီတာ၊ နာရီနဲ့
      အော်ဒါ ငွေ ပါ။ [[mark:read-right-red]] test သုံးခုလုံး ကျနေတုန်းပဲ ဖြစ်ပေမဲ့ အကြောင်း
      ပြောင်းသွားပါပြီ။ ပထမ failure က ၁၃၀၀ ဖြစ်ရမယ့် နေရာမှာ undefined ရနေတယ်လို့ ပြောနေပါတယ်။ ဒါမှ
      မှန်ကန်တဲ့ အကြောင်းကြောင့် ကျတဲ့ red ပါ။ [[mark:type-body]] အခု function ထဲမှာ ဖိုင် ထိပ်က
      စည်းကမ်း အတိုင်း တွက်တဲ့ line သုံးကြောင်းကို ထည့်ပါမယ်။ စည်းကမ်းကို သိပြီးသား ဖြစ်လို့ code
      ကို တန်းရေးလိုက်တာပါ။ [[mark:read-core-green]] panel ကို ကြည့်ပါ။ test လေးခုလုံး pass ဖြစ်ပြီး
      PASS ပြန်ဖြစ်သွားပါပြီ။ [[mark:select-body]] ကီလိုမီတာ သုည ဒါမှမဟုတ် အော်ဒါက ၂၀၀၀၀ ကျပ်နဲ့
      အထက် ဆိုရင် သုည ပြန်ပေးပြီး၊ မဟုတ်ရင် ခရီးအလိုက် ပို့ခ တွက်၊ ည ၉ နာရီ ကစပြီး ၅၀၀ ပေါင်းပါတယ်။
      ဒီ function က network ကိုလည်း မသိ၊ နာရီကိုလည်း မသိဘဲ၊ ပေးလိုက်တဲ့ ဂဏန်းတွေနဲ့ပဲ အလုပ်လုပ်လို့
      mock တစ်ခုမှ မလိုတာပါ။
    sources:
      - {
          title: "web.dev Learn Testing: Testing environment, test algorithmic or business logic",
          url: "https://web.dev/learn/testing/get-started/testing-environment",
        }
      - { title: "Vitest: expect, toBe", url: "https://vitest.dev/api/expect#tobe" }
      - {
          title: "Kent Beck: Canon TDD (facts C04)",
          url: "https://tidyfirst.substack.com/p/canon-tdd",
        }
    actions:
      - id: type-pure
        type: editor.type
        at: { mark: type-pure }
        target:
          { file: src/delivery.test.js, after: "  expect(fee).toBe(1800);\n});\n", occurrence: 1 }
        text: "\ntest(\"charges 1300 for 3 km\", () => {\n  expect(deliveryQuote(3, 20, 4800)).toBe(1300);\n});\n\ntest(\"adds 500 at 21:00\", () => {\n  expect(deliveryQuote(3, 21, 4800)).toBe(1800);\n});\n\ntest(\"is free for orders of 20000\", () => {\n  expect(deliveryQuote(3, 20, 20000)).toBe(0);\n});\n"
        # One block (pilot note 1): three new test blocks in one write, one run.
        cadence: block
      - id: expect-not-fn
        type: expect.preview
        at: { afterAction: type-pure }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-not-fn-count
        type: expect.preview
        at: { afterAction: expect-not-fn }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-failed, value: "3" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-not-fn-message
        type: expect.preview
        at: { afterAction: expect-not-fn-count }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-message, value: "deliveryQuote is not a function" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-pure-1
        type: editor.select
        at: { mark: select-pure-1 }
        target:
          {
            file: src/delivery.test.js,
            text: "expect(deliveryQuote(3, 20, 4800)).toBe(1300);",
            occurrence: 1,
          }
      - id: select-pure-2
        type: editor.select
        at: { mark: select-pure-2 }
        target:
          {
            file: src/delivery.test.js,
            text: "expect(deliveryQuote(3, 21, 4800)).toBe(1800);",
            occurrence: 1,
          }
      - id: select-pure-3
        type: editor.select
        at: { mark: select-pure-3 }
        target:
          {
            file: src/delivery.test.js,
            text: "expect(deliveryQuote(3, 20, 20000)).toBe(0);",
            occurrence: 1,
          }
      - id: open-src
        type: workspace.openFile
        at: { mark: type-empty }
        path: src/delivery.js
      - id: type-empty
        type: editor.type
        at: { afterAction: open-src }
        target: { file: src/delivery.js, after: "  return km;\n}\n\n", occurrence: 1 }
        text: "export function deliveryQuote(km, hour, total) {\n}\n\n"
        # A two-line addition, so one block (pilot note 1).
        cadence: block
      - id: expect-right-red
        type: expect.preview
        at: { afterAction: type-empty }
        timeoutMs: 8000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-name, value: AssertionError }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-right-red-message
        type: expect.preview
        at: { afterAction: expect-right-red }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute:
          { name: data-message, value: "expected undefined to be 1300 // Object.is equality" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-right-red-count
        type: expect.preview
        at: { afterAction: expect-right-red-message }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-failed, value: "3" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: type-body
        type: editor.type
        at: { mark: type-body }
        target:
          {
            file: src/delivery.js,
            after: "export function deliveryQuote(km, hour, total) {\n",
            occurrence: 1,
          }
        text: "  if (km === 0 || total >= 20000) return 0;\n  const fee = 1000 + 300 * Math.ceil(Math.max(0, km - 2));\n  return hour >= 21 ? fee + 500 : fee;\n"
        # Three lines into the empty function: one block (Obvious Implementation; the rules are known).
        cadence: block
      - id: expect-core-green
        type: expect.preview
        at: { afterAction: type-body }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-core-four
        type: expect.preview
        at: { afterAction: expect-core-green }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "4" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-body
        type: editor.select
        at: { mark: select-body }
        target:
          {
            file: src/delivery.js,
            text: "  if (km === 0 || total >= 20000) return 0;\n  const fee = 1000 + 300 * Math.ceil(Math.max(0, km - 2));\n  return hour >= 21 ? fee + 500 : fee;",
            occurrence: 1,
          }

  - id: inject
    chapter: "Dependency ကို အပြင်ကနေ ပေးရအောင်"
    narration: >
      ကျန်နေတာက network နဲ့ နာရီကို ထိတဲ့ shell ပါ။ dependency ကို function ထဲမှာ ကိုယ်တိုင်
      မဆောက်ဘဲ အပြင်ကနေ ထည့်ပေးတဲ့ dependency injection ကို သုံးပါမယ်။ [[mark:type-signature]] ပို့ခ
      function မှာ parameter တစ်ခု ထပ်ထည့်ပြီး၊ function ရဲ့ အစမှာ shell ကိုလည်း ထည့်လိုက်ပါမယ်။
      [[mark:select-deps]] ဒီ object ထဲမှာ ကီလိုမီတာ ယူပေးမယ့် function နဲ့ အချိန် ပေးမယ့် function
      နှစ်ခု ပါပြီး၊ နှစ်ခုလုံးမှာ default ပါပါတယ်။ ဘာမှ မပေးရင် အရင်လိုပဲ distance service နဲ့
      လက်ရှိ နာရီကို သုံးလို့၊ ဆိုင်ရဲ့ code ထဲက ခေါ်ထားတဲ့ နေရာတွေကို ပြင်စရာ မလိုပါဘူး။
      [[mark:select-shell]] function ရဲ့ အစမှာတော့ ကီလိုမီတာနဲ့ နာရီကို ယူပြီး pure function ဆီ
      ပေးလိုက်ရုံပါပဲ။ return က အပေါ်ဆုံးမှာ ရှိလို့ အောက်က တွက်နည်း အဟောင်းက run တော့မှာ
      မဟုတ်ပါဘူး။ ကိုယ့် project မှာဆိုရင်တော့ အဲဒီ code ဟောင်းကို ဖျက်လိုက်ပါ။ [[mark:read-still]] panel မှာ test လေးခုလုံး အရင်အတိုင်း pass ဖြစ်နေပါတယ်။ stub
      နဲ့ fake timers သုံးထားတဲ့ test ဟောင်းကလည်း default တွေကနေ ဖြတ်ပြီး ၁၈၀၀ ကို ရနေလို့၊ ဒီ
      refactor က ဘာမှ မပျက်စေဘူး ဆိုတာ သိရပါတယ်။ [[mark:type-inject]] ကဲ၊ dependency တွေကို အပြင်ကနေ
      ပေးတဲ့ test တစ်ခု ထည့်ကြည့်ရအောင်။ test ဖိုင်ရဲ့ အောက်ဆုံးမှာ ထည့်ပါမယ်။ [[mark:select-fakes]]
      ကီလိုမီတာ အတွက် ၃ ကို ပြန်ပေးတဲ့ function နဲ့၊ ည ၉ နာရီကို ပြန်ပေးတဲ့ function ကို ရိုးရိုး
      object ထဲ ထည့်ပြီး ပေးလိုက်တာပါ။ stub Global လည်း မလို၊ fake timers လည်း မလို၊ ပြန်ဖြုတ်စရာလည်း
      မရှိတော့ပါဘူး။ [[mark:read-five]] panel မှာ test ငါးခုလုံး pass ဖြစ်နေပါပြီ။ network မရှိလည်း၊
      ဘယ်အချိန်မှာ run ပါစေ၊ ဒီ test က အဖြေ တူတူပဲ ထွက်ပါတယ်။ stub နဲ့ fake timers သုံးတဲ့ test
      ဟောင်းကိုတော့ ဖျက်မပစ်ဘဲ၊ default တွေကနေ distance service နဲ့ နာရီဆီ သွားတဲ့ လမ်းကြောင်းကို
      စစ်ပေးတဲ့ test အဖြစ် ဆက်ထားပါမယ်။
    sources:
      - {
          title: "web.dev Learn Testing: What to test, opaque versus clear box (configurable dependencies)",
          url: "https://web.dev/learn/testing/get-started/what-to-test",
        }
      - {
          title: "web.dev Learn Testing: Testing environment, pass the read and write functions in",
          url: "https://web.dev/learn/testing/get-started/testing-environment",
        }
      - {
          title: "MDN: Default parameters",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Functions/Default_parameters",
        }
    actions:
      - id: type-signature
        type: editor.type
        at: { mark: type-signature }
        target:
          {
            file: src/delivery.js,
            after: "export async function quoteDelivery(township, total",
            occurrence: 1,
          }
        text: ",\n  { distanceTo = fetchDistance, now = () => new Date() } = {},\n"
        # One block: a new parameter on its own line (the signature stays readable).
        cadence: block
      - id: type-shell
        type: editor.type
        at: { afterAction: type-signature }
        target:
          {
            file: src/delivery.js,
            after: "  { distanceTo = fetchDistance, now = () => new Date() } = {},\n) {\n",
            occurrence: 1,
          }
        text: "  const distance = await distanceTo(township);\n  return deliveryQuote(distance, now().getHours(), total);\n"
        # Back to back with the parameter (both states pass): an early return through the core, so
        # the old inline maths below is unreachable (COURSE-KIT §5).
        cadence: block
      - id: select-deps
        type: editor.select
        at: { mark: select-deps }
        target:
          {
            file: src/delivery.js,
            text: "{ distanceTo = fetchDistance, now = () => new Date() } = {}",
            occurrence: 1,
          }
      - id: select-shell
        type: editor.select
        at: { mark: select-shell }
        target:
          {
            file: src/delivery.js,
            text: "const distance = await distanceTo(township);\n  return deliveryQuote(distance, now().getHours(), total);",
            occurrence: 1,
          }
      - id: expect-still-green
        type: expect.preview
        at: { mark: read-still }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-still-four
        type: expect.preview
        at: { afterAction: expect-still-green }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-1 }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: open-test-2
        type: workspace.openFile
        at: { mark: type-inject }
        path: src/delivery.test.js
      - id: type-inject
        type: editor.type
        at: { afterAction: open-test-2 }
        target:
          {
            file: src/delivery.test.js,
            after: "  expect(deliveryQuote(3, 20, 20000)).toBe(0);\n});\n",
            occurrence: 1,
          }
        text: "\ntest(\"uses the distance and clock it is given\", async () => {\n  const deps = {\n    distanceTo: async () => 3,\n    now: () => new Date(2026, 10, 5, 21, 0),\n  };\n  const fee = await quoteDelivery(\"bahan\", 4800, deps);\n  expect(fee).toBe(1800);\n});\n"
        # One block (pilot note 1).
        cadence: block
      - id: expect-five
        type: expect.preview
        at: { afterAction: type-inject }
        timeoutMs: 8000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "5" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-five-name
        type: expect.preview
        at: { afterAction: expect-five }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-5 }
        attribute: { name: data-name, value: "uses the distance and clock it is given" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-five-state
        type: expect.preview
        at: { afterAction: expect-five-name }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-5 }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-fakes
        type: editor.select
        at: { mark: select-fakes }
        target:
          {
            file: src/delivery.test.js,
            text: "distanceTo: async () => 3,\n    now: () => new Date(2026, 10, 5, 21, 0),",
            occurrence: 1,
          }
      - id: expect-core-file
        type: expect.file
        at: { mark: read-five }
        path: src/delivery.js
        contains: "export function deliveryQuote(km, hour, total) {\n  if (km === 0 || total >= 20000) return 0;\n  const fee = 1000 + 300 * Math.ceil(Math.max(0, km - 2));\n  return hour >= 21 ? fee + 500 : fee;\n}"
      - id: expect-shell-file
        type: expect.file
        at: { afterAction: expect-core-file }
        path: src/delivery.js
        contains: "export async function quoteDelivery(township, total,\n  { distanceTo = fetchDistance, now = () => new Date() } = {},\n) {\n  const distance = await distanceTo(township);\n  return deliveryQuote(distance, now().getHours(), total);\n"
      - id: expect-test-file
        type: expect.file
        at: { afterAction: expect-shell-file }
        path: src/delivery.test.js
        contains: "  const fee = await quoteDelivery(\"bahan\", 4800, deps);\n  expect(fee).toBe(1800);"

  - id: principles
    chapter: "Test လုပ်ရလွယ်တဲ့ code ရဲ့ စည်းကမ်းများ"
    narration: >
      [[mark:board-principles]] ဒီနေ့ လုပ်ခဲ့တာတွေနဲ့ ဆက်စပ်တဲ့ စည်းကမ်း ငါးခုကို စုကြည့်ရအောင်။
      [[mark:draw-p1]] ပထမ၊ ဆုံးဖြတ်ချက် ချတဲ့ code ကို pure function ထဲ ထည့်ပါ။ test အများဆုံး
      လိုတဲ့ အပိုင်း ဖြစ်လို့ပါ။ [[mark:draw-p2]] ဒုတိယ၊ network နဲ့ နာရီ၊ printer လို အပြင်ကမ္ဘာကို
      shell မှာပဲ ထိပြီး၊ shell ကို ပါးပါးလေး ထားပါ။ [[mark:draw-p3]] တတိယ၊ dependency တွေကို
      parameter နဲ့ ပေးပြီး default ထားရင်၊ ခေါ်တဲ့ code လည်း မပြောင်းရဘဲ test ကလည်း ရိုးရိုး
      function တွေ ထည့်ပေးလို့ ရပါတယ်။ [[mark:draw-p4]] စတုတ္ထ၊ ဆိုင်ရဲ့ menu ကို ဖိုင်ကနေ ဖတ်တဲ့
      code ဆိုရင်လည်း fs module ကို တိုက်ရိုက် မခေါ်ဘဲ၊ ဖတ်ပေးမယ့် function ကို parameter နဲ့
      လက်ခံပါ။ test က ဖိုင် မလိုဘဲ menu စာသားကို ပြန်ပေးတဲ့ function တစ်ခု ထည့်ပေးရုံပါပဲ။ component မှာလည်း တိုက်ရိုက် ခေါ်ထားတာ အစား callback
      ဒါမှမဟုတ် context ကနေ ပေးရင်၊ React lesson မှာ လုပ်ခဲ့သလို test ထဲကနေ အစားထိုး ပေးလို့ ရပါတယ်။
      [[mark:draw-p5]] ပဉ္စမ၊ အပြင်ကို ပြတဲ့ interface သေးပြီး ရှင်းနေရင်၊ test က အထဲကို မကြည့်ဘဲ
      opaque box အနေနဲ့ စစ်လို့ ရပါတယ်။ ဒါကြောင့် အထဲက code ကို စိတ်ချလက်ချ refactor လုပ်နိုင်ပြီး၊
      fake တွေ ရေးရတာလည်း မခက်တော့ပါဘူး။ [[mark:draw-warn]] နောက်ဆုံး သတိထားရမှာက၊ mock ကို များများ
      သုံးလေ test က code ရဲ့ အတွင်းပိုင်းကို မှီခိုလာပြီး ပျက်တတ်လေ ဖြစ်ပါတယ်။ စစ်နေတဲ့ code
      ကိုယ်တိုင်ကို ဘယ်တော့မှ mock မလုပ်ဘဲ၊ နှေးတာ၊ မတည်ငြိမ်တာ၊ side effect ရှိတာကိုပဲ အစားထိုးပါ။
    sources:
      - {
          title: "web.dev Learn Testing: Testing environment, pass the read and write functions in",
          url: "https://web.dev/learn/testing/get-started/testing-environment",
        }
      - {
          title: "web.dev Learn Testing: What to test, opaque versus clear box",
          url: "https://web.dev/learn/testing/get-started/what-to-test",
        }
      - {
          title: "web.dev Learn Testing: Static analysis, clear interfaces make fakes easier",
          url: "https://web.dev/learn/testing/get-started/static-analysis",
        }
      - {
          title: "Vitest: Testing in Practice, what not to mock",
          url: "https://vitest.dev/guide/learn/testing-in-practice#what-not-to-mock",
        }
      - {
          title: "Gerard Meszaros: Test Double, warnings (facts C07)",
          url: "http://xunitpatterns.com/Test%20Double.html",
        }
    actions:
      - id: board-principles
        type: whiteboard.apply
        at: { mark: board-principles }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-p1
        type: whiteboard.apply
        at: { mark: draw-p1 }
        upsertIds: [b-1]
        drawMs: 1500
      - id: draw-p2
        type: whiteboard.apply
        at: { mark: draw-p2 }
        upsertIds: [b-2]
        drawMs: 1500
      - id: draw-p3
        type: whiteboard.apply
        at: { mark: draw-p3 }
        upsertIds: [b-3]
        drawMs: 1500
      - id: draw-p4
        type: whiteboard.apply
        at: { mark: draw-p4 }
        upsertIds: [b-4]
        drawMs: 1500
      - id: draw-p5
        type: whiteboard.apply
        at: { mark: draw-p5 }
        upsertIds: [b-5]
        drawMs: 1500
      - id: draw-warn
        type: whiteboard.apply
        at: { mark: draw-warn }
        upsertIds: [b-warn]
        drawMs: 1500

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ code က network နဲ့ နာရီလို အပြင်ကို ကိုယ်တိုင် ထိနေရင် test လုပ်ရ
      ခက်ပါတယ်။ ဆုံးဖြတ်ချက်တွေကို pure function ဖြစ်တဲ့ core ထဲ ခွဲထုတ်ရင် mock မလိုဘဲ စစ်လို့
      ရပြီး၊ အပြင်ကို ထိတဲ့ အလုပ်ကိုတော့ ပါးပါးလေး ဖြစ်တဲ့ shell မှာပဲ ထားပါတယ်။
      [[mark:recap-inject]] dependency တွေကို default ပါတဲ့ parameter နဲ့ ပေးရင် ခေါ်တဲ့ code လည်း
      ရိုးရှင်းပြီး၊ test ကလည်း ရိုးရိုး function တွေ ထည့်ပေးလို့ ရပါတယ်။ interface ကိုလည်း သေးပြီး
      ရှင်းအောင် ထားပါ။ နောက် lesson မှာတော့ code ကို run စရာတောင် မလိုဘဲ bug ကို ရှာပေးတဲ့ static
      analysis ကို ကြည့်ပါမယ်။
    sources:
      - {
          title: "web.dev Learn Testing: Testing environment",
          url: "https://web.dev/learn/testing/get-started/testing-environment",
        }
      - {
          title: "Vitest: Testing in Practice",
          url: "https://vitest.dev/guide/learn/testing-in-practice",
        }
    actions:
      - id: close-b
        type: whiteboard.apply
        at: { scene: start }
        open: false
checks:
  - { type: timing.p95Ms, max: 300 }
