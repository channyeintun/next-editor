      package.json: |
        {
          "name": "testing-course-tea-shop",
          "private": true,
          "version": "1.0.0",
          "type": "module",
          "scripts": {
            "dev": "vite --host 0.0.0.0 --port 5173 --strictPort",
            "test": "vitest"
          },
          "devDependencies": {
            "vite": "7.3.7",
            "vitest": "5.1.0"
          }
        }
      src/delivery.js: |
        // Delivery fee: 1000 up to 2 km, then +300 for each started km.
        // Free for orders of 20000 Kyat or more; +500 at night (from 21:00).

        // The distance service: how far the shop is from a township, in km.
        export async function fetchDistance(township) {
          const response = await fetch(`https://distance.example/km?to=${township}`);
          if (!response.ok) throw new Error(`no distance for ${township}`);
          const { km } = await response.json();
          return km;
        }

        export async function quoteDelivery(township, total) {
          const km = await fetchDistance(township);
          const hour = new Date().getHours();
          if (km === 0 || total >= 20000) return 0;
          let fee = 1000 + 300 * Math.ceil(Math.max(0, km - 2));
          if (hour >= 21) fee += 500;
          return fee;
        }
      src/delivery.test.js: |
        import { afterEach, expect, test, vi } from "vitest";
        import { deliveryQuote, quoteDelivery } from "./delivery.js";

        afterEach(() => {
          vi.unstubAllGlobals();
          vi.useRealTimers();
        });

        test("charges the night fee for Bahan", async () => {
          const response = { ok: true, json: async () => ({ km: 3 }) };
          vi.stubGlobal("fetch", vi.fn().mockResolvedValue(response));
          vi.useFakeTimers();
          vi.setSystemTime(new Date(2026, 10, 5, 21, 0));

          const fee = await quoteDelivery("bahan", 4800);

          expect(fee).toBe(1800);
        });
      vite.config.js: |
        import { defineConfig } from "vite";
        import courseVitestBridge from "./course/vitest-bridge.js";

        // The course panel: the dev server runs the real Vitest and the preview shows its results.
        export default defineConfig({
          plugins: [courseVitestBridge()],
        });
      vitest.config.js: |
        import { defineConfig } from "vitest/config";

        export default defineConfig({
          test: {
          },
        });
