    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ test မရှိတဲ့ code ဟောင်းကို characterization test တွေ၊
      snapshot တွေနဲ့ ငြမ်း ဆင်ပြီး refactor လုပ်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ test လုပ်ရ လွယ်အောင်
      code ကို ဘယ်လို ရေးမလဲ ဆိုတာ ကြည့်ပါမယ်။ [[mark:draw-outside]] code တစ်ခုကို test လုပ်ရ
      ခက်တာက၊ သူက အပြင်ကို ကိုယ်တိုင် လှမ်းထိနေလို့ ဖြစ်တတ်ပါတယ်။ network ကို fetch နဲ့ ခေါ်တာ၊
      လက်ရှိ အချိန်ကို နာရီကနေ ဖတ်တာ၊ printer ကို ပို့တာ၊ module ထဲက state ကို ပြင်တာမျိုးတွေပါ။
      ပြီးခဲ့တဲ့ lesson တွေမှာ ဒါတွေကို stub တွေ၊ module mock တွေ၊ fake timers နဲ့ hook တွေ သုံးပြီး
      ထိန်းခဲ့ပါတယ်။ ဒါပေမဲ့ အဲဒီလို ပြင်ဆင်ရတာတွေ များလာလေ၊ test က ရှည်လာပြီး ပျက်တတ်လေ ဖြစ်ပါတယ်။
      [[mark:draw-core]] အဲဒီ ပြဿနာကို ဖြေရှင်းတဲ့ နည်း တစ်ခုက၊ ဆုံးဖြတ်ချက် ချတဲ့ အပိုင်းကို pure
