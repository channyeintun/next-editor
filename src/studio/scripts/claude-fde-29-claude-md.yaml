  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] ဘာရေးမလဲ မစခင် မေးခွန်း တစ်ခု မေးပါရစေ။ Billing developer နှစ်ယောက်က CLAUDE.md ထဲ ထည့်ဖို့
      စာကြောင်း တစ်ခုစီ ယူလာပါတယ်။ ဘယ်ဟာက ဝင်သင့်လဲ။
      [[mark:q-a]] ပထမ တစ်ခုက Billing database ထဲက table တိုင်းနဲ့ column တိုင်းရဲ့ ဖော်ပြချက် အပြည့်အစုံပါ။
      [[mark:q-b]] ဒုတိယ တစ်ခုက test ကို npm test နဲ့ run ပါ၊ migrations folder ထဲက file တွေကို လက်နဲ့ မပြင်ရ ဆိုတဲ့
      စာကြောင်း နှစ်ကြောင်းပါ။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ တစ်ခုပါ။ ဘာကြောင့်လဲဆိုတော့ table တွေရဲ့ ပုံစံကို Claude က schema file နဲ့
      code ကို ဖတ်ပြီး ကိုယ်တိုင် ရှာနိုင်လို့ပါ။ ဒါကို CLAUDE.md ထဲ ကူးထည့်ရင် session တိုင်း context နေရာ အများကြီး
      ယူမယ့်အပြင်၊ schema ပြောင်းတဲ့နေ့မှာ မှားနေတဲ့ စာ ဖြစ်သွားပါမယ်။ ဒုတိယ စာကြောင်းတွေကတော့ code ထဲမှာ ဘယ်နေရာမှ
      ရေးမထားတဲ့ team ရဲ့ ဆုံးဖြတ်ချက်တွေပါ။
      [[mark:q-rule]] ဒါကြောင့် CLAUDE.md ထဲမှာ Claude ကိုယ်တိုင် မခန့်မှန်းနိုင်တာကိုပဲ ရေးပါ။ စာကြောင်း တိုင်းက
      session တိုင်းမှာ context နေရာ ယူတာကိုလည်း သတိရပါ။
    sources:
      - {
          title: "Claude Code Docs: Memory (what to include)",
          url: "https://code.claude.com/docs/en/memory",
        }
    actions:
      - { id: close-memory, type: slide.close, at: { mark: quiz, offsetMs: -900 } }
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: q-rule },
          upsertIds: [q-t1, q-t2],
          drawMs: 1600,
        }

  - id: belongs
    chapter: ဘာရေးပြီး ဘာမရေးမလဲ
    narration: >
      [[mark:b-open]] ဒီ စည်းကမ်းကို ရေးမယ်၊ မရေးဘူး ဆိုပြီး နှစ်ဖက် ခွဲကြည့်ရအောင်။
      [[mark:b-in]] ရေးရမယ့် ဘက်မှာ test နဲ့ lint run တဲ့ command အတိအကျ၊ code မှာ မပေါ်တဲ့ team ရဲ့ စည်းကမ်း၊ ကြည့်ရင်
      မလိုဘူး ထင်ရပေမဲ့ မထိရမယ့် နေရာတွေ ပါပါတယ်။ Claude ကို နှစ်ခါ ပြင်ပေးရတဲ့ ကိစ္စမျိုးဆိုရင်လည်း ဒီဘက်ကို ရောက်သင့်ပါပြီ။
      [[mark:b-out]] မရေးရမယ့် ဘက်မှာ code ဖတ်ရင် သိနိုင်တာ၊ doc အရှည်ကြီးတွေနဲ့ ဒီ task တစ်ခုတည်းအတွက် စည်းကမ်းတွေ
      ပါပါတယ်။ အဆင့်ဆင့် လုပ်ရမယ့် လုပ်ထုံးလုပ်နည်း ရှည်ရှည်ဆိုရင် skill အဖြစ် သီးခြား ရေးတာ ပိုသင့်တော်ပါတယ်။
      [[mark:b-len]] အရှည်ကိုလည်း သတိထားရပါတယ်။ docs က CLAUDE.md တစ်ခုကို စာကြောင်း ၂၀၀ အောက်မှာ ထားဖို့
      အကြံပေးပါတယ်။ ရှည်လေ context နေရာ ပိုယူလေ ဖြစ်ပြီး၊ ညွှန်ကြားချက်တွေကို လိုက်နာတာလည်း ပိုအားနည်းလာတတ်လို့ပါ။
    sources:
      - {
          title: "Claude Code Docs: Memory (what to include, length)",
          url: "https://code.claude.com/docs/en/memory",
        }
    actions:
      - {
          id: draw-b-open,
          type: whiteboard.apply,
          at: { mark: b-open },
          clear: true,
          upsertIds: [b-title],
        }
      - {
          id: draw-b-in,
          type: whiteboard.apply,
          at: { mark: b-in },
          upsertIds: [b-lrect, b-lh, b-l1, b-l2, b-l3, b-l4],
          drawMs: 2400,
        }
      - {
          id: draw-b-out,
          type: whiteboard.apply,
          at: { mark: b-out },
          upsertIds: [b-rrect, b-rh, b-r1, b-r2, b-r3],
          drawMs: 2100,
        }

  - id: commands
    chapter: Billing ရဲ့ CLAUDE.md
    narration: >
      [[mark:f-open]] ဒါဆို Billing repository အတွက် CLAUDE.md ကို ရေးကြည့်ရအောင်။ init command က codebase ကို ဖတ်ပြီး
      CLAUDE.md အစ တစ်ခုကို ထုတ်ပေးနိုင်ပါတယ်။ ဒါပေမဲ့ ထွက်လာတဲ့ စာကို ဒီ စည်းကမ်းနဲ့ ပြန်ဖြတ်ရပါမယ်။ ဒီမှာတော့
      ခေါင်းစဉ်နဲ့ ဖော်ပြချက် တစ်ကြောင်း ရှိပြီးသားပါ။
      [[mark:type-commands]] ပထမ အပိုင်းက command တွေပါ။ test နဲ့ lint ကို ဘယ် command နဲ့ run ရမလဲ ရေးထားတော့၊
      Claude က session တိုင်း ပြန်ရှာစရာ မလိုတော့ပါဘူး။ ပြီးခဲ့တဲ့ lesson တွေမှာ ပြောခဲ့တဲ့ check ကို run ဖို့ command
      ဖြစ်တာမို့ ဒီ file ထဲမှာ အရေးအကြီးဆုံး စာကြောင်းလို့ ပြောလို့ ရပါတယ်။
      [[mark:type-conventions]] ဒုတိယ အပိုင်းက code ကို ကြည့်ရုံနဲ့ မသိနိုင်တဲ့ team ရဲ့ စည်းကမ်းတွေပါ။ ငွေပမာဏကို
      ကျပ် အပြည့်နဲ့ပဲ သိမ်းပြီး၊ line item တစ်ခုစီရဲ့ အဆုံးမှာ တစ်ခါပဲ round လုပ်ပါတယ်။
      [[mark:sel-dates]] ရက်စွဲ စာကြောင်းကတော့ ဒီ lesson ကို စခဲ့တဲ့ ပြဿနာအတွက်ပါ။ due date တွေအတွက် team ရဲ့ ရန်ကုန်
      အချိန် helper ကိုပဲ သုံးရမယ်လို့ ရေးထားပါတယ်။ ဘာကို သုံးရမလဲနဲ့ ဘာကို မသုံးရဘူးလဲ နှစ်ခုလုံး ပါတာက Claude
      အတွက် ပိုရှင်းပါတယ်။
    sources:
      - {
          title: "Claude Code Docs: Memory (what to include)",
          url: "https://code.claude.com/docs/en/memory",
        }
      - {
          title: "Claude Code Docs: Commands (init)",
          url: "https://code.claude.com/docs/en/commands",
        }
      - {
          title: "Claude Code Docs: Best practices",
          url: "https://code.claude.com/docs/en/best-practices",
        }
    actions:
      - { id: close-belongs, type: whiteboard.apply, at: { mark: f-open }, open: false }
      - {
          id: open-claude-md,
          type: workspace.openFile,
          at: { afterAction: close-belongs },
          path: billing-service/CLAUDE.md,
        }
      - id: type-commands
        type: editor.type
        at: { mark: type-commands }
        cadence: line-by-line
        target:
          { file: billing-service/CLAUDE.md, after: "reports for Naychi Fiber customers.\n\n" }
        text: "# Commands\n- Test: `npm test`\n- Lint: `npm run lint` (run it before every commit)\n\n"
      - id: type-conventions
        type: editor.type
        at: { mark: type-conventions }
        cadence: line-by-line
        target: { file: billing-service/CLAUDE.md, after: "(run it before every commit)\n\n" }
        text: "# Conventions\n- Amounts are whole kyat (integers). Round once, at the end of each line item.\n- Dates: use `src/lib/time.ts` (Asia/Yangon). Never `new Date()` for due dates.\n\n"
      - id: sel-dates
        type: editor.select
        at: { mark: sel-dates }
        target:
          file: billing-service/CLAUDE.md
          text: "- Dates: use `src/lib/time.ts` (Asia/Yangon). Never `new Date()` for due dates."

  - id: gotchas
    narration: >
      [[mark:type-gotchas]] တတိယ အပိုင်းက ထောင်ချောက်တွေပါ။ legacy folder က သုံးမနေတော့သလို ထင်ရပေမဲ့၊ ည ၂ နာရီမှာ run
      တဲ့ retry job က အခုထိ သုံးနေပါတယ်။ code ကို ဖတ်ရုံနဲ့ မြင်ရခက်တဲ့ အချက်မို့ ရေးထားရပါတယ်။ migrations folder
      ကိုလည်း platform team ကပဲ apply လုပ်တာမို့ လက်နဲ့ မပြင်ရဘူးလို့ ရေးထားပါတယ်။
      [[mark:expect-point]] ဒါပဲ ရှိပါတယ်။ စာကြောင်း ဆယ်ကြောင်းလောက်ပဲ ရှိပေမဲ့၊ session တိုင်း ထပ်မေးနေရတဲ့ အရာတွေနဲ့
      ပြဿနာ ဖြစ်ခဲ့ဖူးတဲ့ အရာတွေကို ဖုံးထားပါတယ်။ database table တွေရဲ့ ဖော်ပြချက်၊ folder ဖွဲ့စည်းပုံ၊ code ထဲမှာ
      ရှိပြီးသား architecture တွေကို ထည့်မရေးထားပါဘူး။
      [[mark:sel-migrations]] တစ်ခု သတိထားရမှာက migrations ကို မပြင်ရ ဆိုတဲ့ စာကြောင်းက Claude အတွက် context ပဲ ဖြစ်တာပါ။
      model က အများအားဖြင့် လိုက်နာပေမဲ့ အမြဲတမ်း လိုက်နာမယ်လို့ အာမခံချက် မရှိပါဘူး။ တစ်ခါမှ မဖြစ်စေရမယ့် အရာ
      ဆိုရင်တော့ နောက်ပိုင်း lesson မှာ လေ့လာမယ့် hook နဲ့ ထပ်ပိတ်ရပါမယ်။
    sources:
      - {
          title: "Claude Code Docs: Memory (CLAUDE.md is context, not enforced configuration)",
          url: "https://code.claude.com/docs/en/memory",
        }
    actions:
      - id: type-gotchas
        type: editor.type
        at: { mark: type-gotchas }
        cadence: line-by-line
        target: { file: billing-service/CLAUDE.md, after: "Never `new Date()` for due dates.\n\n" }
        text: "# Gotchas\n- `src/legacy/` looks unused, but the 2 a.m. retry job still imports it. Don't delete it.\n- Never edit files under `migrations/` by hand. The platform team applies migrations.\n"
      - id: expect-gotchas
        type: expect.file
        at: { afterAction: type-gotchas }
        path: billing-service/CLAUDE.md
        contains: "- Never edit files under `migrations/` by hand. The platform team applies migrations.\n"
      - id: sel-title
        type: editor.select
        at: { mark: expect-point }
        target:
          file: billing-service/CLAUDE.md
          text: "# Naychi Fiber billing service"
      - id: sel-migrations
        type: editor.select
        at: { mark: sel-migrations }
        target:
          file: billing-service/CLAUDE.md
          text: "- Never edit files under `migrations/` by hand."

  - id: your-turn
    chapter: ကိုယ့် repository အတွက်
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ကိုယ့် repository အတွက် CLAUDE.md ရဲ့ ပထမ စာကြောင်း
