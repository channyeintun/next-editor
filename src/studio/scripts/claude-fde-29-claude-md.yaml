build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 9329

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: need
    chapter: Session တိုင်း ထပ်မေးတာ
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ Claude Code session တစ်ခုရဲ့ context window ထဲမှာ ဘာတွေ ပြည့်လာလဲ၊ compact၊ clear နဲ့
      resume ကို ဘယ်အချိန် သုံးမလဲ ဆိုတာ လေ့လာခဲ့ပါတယ်။ chat ထဲမှာပဲ ပြောထားတဲ့ စည်းကမ်းက compaction ပြီးရင်
      အကျဉ်းချုပ်ပဲ ကျန်တတ်တယ် ဆိုတာလည်း တွေ့ခဲ့ပါတယ်။
      [[mark:sel-billing]] အပတ် ၆ ရဲ့ နောက်ဆုံးပိုင်းမှာ Billing team က session အသစ် စတိုင်း တူညီတဲ့ ပြဿနာ နှစ်ခုကို
      တွေ့နေရပါတယ်။ ပထမ တစ်ခုက Claude က test တွေကို ဘယ်လို run ရမလဲ ဆိုတာ session တိုင်း ပြန်ရှာတာ ဒါမှမဟုတ်
      ပြန်မေးတာပါ။
      [[mark:story-2]] ဒုတိယ တစ်ခုက ပိုအန္တရာယ် များပါတယ်။ ရက်စွဲ တွက်တဲ့ code မှာ Claude က team ရဲ့ ရန်ကုန် အချိန်
      helper ကို မသုံးဘဲ၊ ရိုးရိုး date function ကို တစ်ခါ သုံးသွားပါတယ်။ late fee bug ကို ဖြစ်စေခဲ့တဲ့ time zone ပြဿနာ
      မျိုးကို ပြန်ဖွင့်ပေးလိုက်တာပါ။
      [[mark:story-3]] ဘာကြောင့် ဒီလို ဖြစ်လဲ ဆိုတော့ session အသစ် တိုင်းက context အလွတ်နဲ့ စလို့ပါ။ မနေ့က session ထဲမှာ
      ပြောခဲ့တာတွေကို ဒီနေ့ session က မသိပါဘူး။ session တစ်ခုကနေ နောက်တစ်ခုဆီ သယ်သွားတာက ကိုယ်တို့ ရေးထားတဲ့
      CLAUDE.md file နဲ့ Claude ကိုယ်တိုင် မှတ်ထားတဲ့ auto memory ပဲ ရှိပါတယ်။ Billing team lead မောင်မောင် က team တစ်ခုလုံး မျှသုံးလို့ရတဲ့ CLAUDE.md ကို ကိုယ်နဲ့ အတူ ရေးဖို့
      သဘောတူပါတယ်။
    sources:
      - {
          title: "Claude Code Docs: How Claude Code works (sessions)",
          url: "https://code.claude.com/docs/en/how-claude-code-works",
        }
      - {
          title: "Claude Code Docs: Memory (CLAUDE.md)",
          url: "https://code.claude.com/docs/en/memory",
        }
    actions:
      - { id: open-readme, type: workspace.openFile, at: { mark: sel-billing }, path: README.md }
      - id: sel-billing
        type: editor.select
        at: { afterAction: open-readme }
        target:
          file: README.md
          text: "- Billing team နဲ့ Claude Code"
      - id: sel-codebase
        type: editor.select
        at: { mark: story-2 }
        target:
          file: README.md
          text: "- Billing: plan၊ invoice၊ ငွေပေးချေမှု (သက်တမ်း 9 နှစ်ရှိ codebase)"

  - id: locations
    chapter: CLAUDE.md ဆိုတာ
    narration: >
      [[mark:l-open]] CLAUDE.md ဆိုတာ project အကြောင်း Claude Code အမြဲ သိထားရမယ့် အချက်တွေကို markdown နဲ့ ရေးထားတဲ့
      file ပါ။ Claude Code က session တိုင်း အစမှာ ဒီ file ကို ဖတ်ပြီး context ထဲ ထည့်ပါတယ်။ ဒါကြောင့် context window
      ထဲက နေရာ တစ်ခုကို အမြဲ ယူထားပါတယ်။
      [[mark:l-1]] CLAUDE.md က နေရာ လေးမျိုးမှာ ရှိနိုင်ပါတယ်။ အကျယ်ဆုံးက managed policy ပါ။ IT ဘက်က ကုမ္ပဏီ
      တစ်ခုလုံးအတွက် ချထားတဲ့ file ဖြစ်ပါတယ်။
      [[mark:l-2]] ဒုတိယက user အဆင့်ပါ။ ကိုယ့် home folder ထဲမှာ ထားပြီး၊ ကိုယ်တစ်ယောက်တည်းအတွက် project အားလုံးမှာ သက်ရောက်ပါတယ်။
      [[mark:l-3]] တတိယက project အဆင့်ပါ။ repository ရဲ့ root မှာ ထားပြီး git ထဲ commit လုပ်တာမို့ team တစ်ခုလုံး
      မျှသုံးပါတယ်။ ဒီ lesson မှာ ရေးမယ့် file က ဒီ အမျိုးအစားပါ။
      [[mark:l-4]] စတုတ္ထက local အဆင့်ပါ။ ကိုယ့်အတွက်ပဲ ဖြစ်တဲ့ CLAUDE local file ဖြစ်ပြီး၊ git ထဲ မရောက်အောင်
      gitignore ထဲ ထည့်ထားရပါတယ်။
      [[mark:l-join]] Claude Code က တွေ့သမျှ file တွေကို ပေါင်းဖတ်ပါတယ်။ အကျယ်ဆုံးကနေ စပြီး၊ အလုပ်လုပ်နေတဲ့ folder နဲ့
      အနီးဆုံး file ကို နောက်ဆုံးမှ ဖတ်ပါတယ်။ ဆိုလိုတာက file တစ်ခုက တခြား file ကို အစားမထိုးဘဲ၊ အကုန်လုံး context
      ထဲ ဝင်တာပါ။ repository ထဲက folder ခွဲတွေမှာ ထားတဲ့ CLAUDE.md တွေကတော့ Claude က အဲဒီ folder ထဲမှာ အလုပ်လုပ်တဲ့
      အချိန်ကျမှ load ဖြစ်ပါတယ်။
    sources:
      - {
          title: "Claude Code Docs: Memory (CLAUDE.md locations)",
          url: "https://code.claude.com/docs/en/memory",
        }
    actions:
      - {
          id: draw-l-open,
          type: whiteboard.apply,
          at: { mark: l-open },
          open: true,
          clear: true,
          upsertIds: [l-title],
        }
      - {
          id: draw-l-1,
          type: whiteboard.apply,
          at: { mark: l-1 },
          upsertIds: [l-b1, l-l1, l-d1],
          drawMs: 1500,
        }
      - {
          id: draw-l-2,
          type: whiteboard.apply,
          at: { mark: l-2 },
          upsertIds: [l-b2, l-l2, l-d2],
          drawMs: 1500,
        }
      - {
          id: draw-l-3,
          type: whiteboard.apply,
          at: { mark: l-3 },
          upsertIds: [l-b3, l-l3, l-d3],
          drawMs: 1500,
        }
      - {
          id: draw-l-4,
          type: whiteboard.apply,
          at: { mark: l-4 },
          upsertIds: [l-b4, l-l4, l-d4],
          drawMs: 1500,
        }
      - {
          id: draw-l-join,
          type: whiteboard.apply,
          at: { mark: l-join },
          upsertIds: [l-join],
          drawMs: 1200,
        }

  - id: memory-view
    chapter: Memory command
    narration: >
      [[mark:m-open]] ဒီ session မှာ ဘယ် CLAUDE.md တွေ ရှိလဲ ဆိုတာကို memory command နဲ့ ကြည့်လို့ ရပါတယ်။ ဒီ screen
      မှာ Billing project ထဲက memory command ကို ဒီလို မြင်ရပါတယ်။
      [[mark:m-auto]] ပထမ အတန်းက auto memory ကို ဖွင့်ထားလား ပိတ်ထားလား ပြပါတယ်။ auto memory ဆိုတာ CLAUDE.md နဲ့
      မတူပါဘူး။ ကိုယ်က ရေးတာ မဟုတ်ဘဲ၊ Claude ကိုယ်တိုင် ဒီ စက်ပေါ်မှာ ရေးထားတဲ့ မှတ်စုတွေပါ။ session အသစ်တိုင်းမှာ
      အဲဒီ မှတ်စုရဲ့ အစပိုင်းကို load လုပ်ပါတယ်။
      [[mark:m-project]] နောက် အတန်းက project ရဲ့ CLAUDE.md ပါ။ git ထဲကို commit လုပ်ထားတဲ့ file ဖြစ်ကြောင်း ပြထားပါတယ်။
      [[mark:m-user]] အဲဒီအောက်က အတန်းကတော့ ကိုယ့် home folder ထဲက user အဆင့် CLAUDE.md ပါ။ တစ်ခုခုကို ရွေးလိုက်ရင်
      အဲဒီ CLAUDE.md ကို ကိုယ်တိုင် ပြင်လို့ ရပါတယ်။
      [[mark:m-folder]] နောက်ဆုံး အတန်းက auto memory ကို သိမ်းထားတဲ့ folder ကို ဖွင့်ကြည့်ဖို့ပါ။ Claude က ဘာတွေ မှတ်ထားလဲ
      ကိုယ်တိုင် ဖတ်ကြည့်လို့ ရပါတယ်။
    sources:
      - {
          title: "Claude Code Docs: Memory (memory command, auto memory)",
          url: "https://code.claude.com/docs/en/memory",
        }
    actions:
      - {
          id: close-locations,
          type: whiteboard.apply,
          at: { mark: m-open, offsetMs: -1400 },
          open: false,
        }
      - {
          id: show-memory,
          type: slide.show,
          at: { mark: m-open, offsetMs: -700 },
          slideId: memory-screen,
        }
      - {
          id: point-m-title,
          type: slide.point,
          at: { mark: m-open, offsetMs: 2500 },
          target: { x: 0.086, y: 0.429 },
        }
      - {
          id: point-m-auto,
          type: slide.point,
          at: { mark: m-auto },
          target: { x: 0.128, y: 0.500 },
        }
      - {
          id: point-m-project,
          type: slide.point,
          at: { mark: m-project },
          target: { x: 0.133, y: 0.571 },
        }
      - {
          id: point-m-user,
          type: slide.point,
          at: { mark: m-user },
          target: { x: 0.133, y: 0.606 },
        }
      - {
