# AI Builder, lesson 23: version control as save points (Burmese, docs kind).
#
# Start state (ws/): base-docs only (package.json with a no-op dev script, notes.md = "# Notes\n"
# byte for byte). Nothing runs. notes.md is lesson-local (COURSE-KIT §4, §4.15): the lesson types,
# after "# Notes\n", "## Lesson 23 · …" with the shop's working rhythm (### Rhythm, four steps), the
# two example commit messages (### Commit messages, good vs vague, as in the binder) and two safety
# lines (### Safety: a remote copy; never commit a secret — the bridge to lesson 24).
#
# Boards: (S) save points on a line left to right (blue commits: problem → spec → plan → BUG-3),
# the history note, then a branch going down from "plan" (orange commits, the AI note feature from
# lesson 22) that ends in "merge" under the green merge commit, and the red "delete the branch"
# outcome; (D) a diff (red line out, green line in: coffee 1,800 → 2,000 in the menu file) and its
# size, then a revert drawn below it (the reverse diff as a new commit; history keeps both); (Z) the
# quiz (30 edits broke the order form: hunt and fix, or go back and redo in smaller steps).
#
# Build: bun ~/Documents/ai-builder-course-work/tools/build-lesson.ts template.yaml ws ai-builder-23-version-control.yaml
