build:
  # Studio replaces this built-in profile at render time with the Burmese provider chosen in the
  # render console (AthanLab with the user's own key, or VoxCPM2 when that feature is enabled).
  voiceProfile: pocket-alba-v1
  seed: 3116
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "အထဲအထိ readonly"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ object ရဲ့ property တွေကို TypeScript က ကျယ်တဲ့ type နဲ့ infer
      လုပ်တာနဲ့၊ Readonly utility type က အပြင်ဆုံး အဆင့်ကိုပဲ read only လုပ်ပေးတာကို မြင်ခဲ့ပါတယ်။ ဒီ lesson
      မှာတော့ တန်ဖိုး တစ်ခုလုံးကို အထဲအထိ read only ဖြစ်စေပြီး၊ literal type တွေကိုပါ ထိန်းထားပေးတဲ့ as const
      ကို ကြည့်သွားပါမယ်။ [[mark:draw-object]] ဆိုင်ရဲ့ ပုံမှန် လက်ဖက်ရည် object ကို အလွှာလိုက်
      ပုံဆွဲကြည့်ရအောင်။ အပြင် အလွှာမှာ နာမည်ရယ်၊ size ရယ်၊ နောက်ထပ် object တစ်ခုရယ် ရှိပြီး၊ အဲဒီ အတွင်း
      object ထဲမှာ သကြား ဘယ်လောက် ထည့်မလဲ၊ ရေခဲ ထည့်မလား ဆိုတာ ရှိပါတယ်။ [[mark:draw-readonly]] Readonly
      utility type က အပြင် အလွှာက property တွေကိုပဲ read only လုပ်ပေးလို့၊ အတွင်း object ထဲက သကြားကိုတော့
      ပြောင်းလို့ ရနေဆဲပါ။ [[mark:draw-as-const]] as const ကတော့ ဒီ အလွှာ အားလုံးကို အထဲဆုံးအထိ read only
      လုပ်ပေးပါတယ်။ [[mark:draw-literal]] ပြီးတော့ string ဒါမှမဟုတ် number လို ကျယ်တဲ့ type အစား၊ ရေးထားတဲ့
      တန်ဖိုး အတိအကျကို literal type အဖြစ် ထိန်းထားပေးပါတယ်။ ဘယ်တော့မှ မပြောင်းနိုင်တော့တဲ့ တန်ဖိုး ဖြစ်လို့
      ကျယ်အောင် ယူစရာ မလိုတော့တာပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 7: Mutability (deep immutability with as const)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/mutability",
        }
      - {
          title: "TypeScript 3.4 release notes: const assertions",
          url: "https://www.typescriptlang.org/docs/handbook/release-notes/typescript-3-4.html#const-assertions",
        }
      - {
          title: "TypeScript Handbook: Utility Types (Readonly<Type>)",
          url: "https://www.typescriptlang.org/docs/handbook/utility-types.html#readonlytype",
        }
    actions:
      - id: open-board-a
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-object
        type: whiteboard.apply
        at: { mark: draw-object }
        upsertIds: [a-outer, a-outer-label, a-item, a-size, a-inner, a-inner-label, a-sugar, a-ice]
        drawMs: 3600
      - id: draw-readonly
        type: whiteboard.apply
        at: { mark: draw-readonly }
        upsertIds: [a-outer-circle, a-readonly-name, a-readonly-note]
        drawMs: 2000
      - id: draw-as-const
        type: whiteboard.apply
        at: { mark: draw-as-const }
        upsertIds: [a-inner-circle, a-asconst-name, a-asconst-note]
        drawMs: 2000
      - id: draw-literal
        type: whiteboard.apply
        at: { mark: draw-literal }
        upsertIds: [a-literal-note]
        drawMs: 1000

  - id: starter
    narration: >
      [[mark:close-board]] ဒီနေ့ code ကို ကြည့်ရအောင်။ [[mark:open-menu]] menu ဖိုင်မှာ သောက်စရာ တစ်ခွက်ကို
      ဖော်ပြတဲ့ Drink type ရှိပါတယ်။ [[mark:select-drink]] size က CupSize ဖြစ်ရပြီး၊ အတွင်း object ထဲက
      သကြားကလည်း နည်း၊ ပုံမှန်၊ များ ဆိုတဲ့ သုံးမျိုးထဲက တစ်ခုပဲ ဖြစ်ရပါမယ်။ [[mark:select-describe]] အောက်က
      function ကတော့ သောက်စရာ တစ်ခွက်ကို စာ တစ်ကြောင်းနဲ့ ဖော်ပြပေးပါတယ်။ [[mark:open-main]] main ဖိုင်မှာတော့
      ဆိုင်ရဲ့ ပုံမှန် လက်ဖက်ရည် object ရှိပါတယ်။ [[mark:select-house-tea]] ခွက်ကြီး၊ သကြား နည်းနည်း၊ ရေခဲ
      မပါတဲ့ လက်ဖက်ရည် ဖြစ်ပြီး၊ သူ့အောက်မှာ အဲဒီ function နဲ့ ထုတ်ပြပါတယ်။ [[mark:select-mutation]] ဒီ line
      ကတော့ ပုံမှန် လက်ဖက်ရည်ရဲ့ သကြားကို များများ ဖြစ်အောင် ပြောင်းလိုက်ပြီး၊ နောက် line က သကြားကို
      ထုတ်ပြပါတယ်။ ဒါပေမဲ့ ဆိုင်ရဲ့ ပုံမှန် အရသာ ဖြစ်လို့ ဘယ်သူမှ ပြောင်းလို့ မရသင့်တဲ့ တန်ဖိုးပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 7: Mutability (object property inference)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/mutability",
        }
      - {
          title: "TypeScript Handbook: Object Types",
          url: "https://www.typescriptlang.org/docs/handbook/2/objects.html",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: open-menu
        type: workspace.openFile
        at: { mark: open-menu }
        path: src/menu.ts
      - id: select-drink
        type: editor.select
        at: { mark: select-drink }
        target:
          {
            file: src/menu.ts,
            text: "  size: CupSize;\n  extras: { sugar: Sugar; ice: boolean };",
            occurrence: 1,
          }
      - id: select-describe
        type: editor.select
        at: { mark: select-describe }
        target:
          {
            file: src/menu.ts,
            text: "export function describe(drink: Drink): string {",
            occurrence: 1,
          }
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: src/main.ts
      - id: select-house-tea
        type: editor.select
        at: { mark: select-house-tea }
        target:
          {
            file: src/main.ts,
            text: "  size: \"large\",\n  extras: { sugar: \"less\", ice: false },",
            occurrence: 1,
          }
      - id: select-mutation
        type: editor.select
        at: { mark: select-mutation }
        target: { file: src/main.ts, text: 'houseTea.extras.sugar = "extra";', occurrence: 1 }

  - id: panel
    narration: >
      [[mark:panel-ready]] ညာဘက် panel ရဲ့ Errors မှာ error တစ်ခု ရှိပါတယ်။ ပုံမှန် လက်ဖက်ရည်ကို ဖော်ပြတဲ့ function ထဲ ပို့တဲ့
      နေရာမှာ string ကို CupSize နေရာမှာ ထည့်လို့ မရဘူးလို့ ပြောနေပါတယ်။ ပြီးခဲ့တဲ့ lesson မှာ မြင်ခဲ့သလိုပဲ
      object ရဲ့ property တွေကို TypeScript က ကျယ်တဲ့ type နဲ့ infer လုပ်လို့ပါ။ [[mark:read-start-output]]
      Output မှာတော့ ပထမ line က ပုံမှန် လက်ဖက်ရည်ကို ဖော်ပြပြီး၊ ဒုတိယ line မှာ သကြားက extra ဖြစ်သွားပါပြီ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 7: Mutability (object property inference)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/mutability",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
