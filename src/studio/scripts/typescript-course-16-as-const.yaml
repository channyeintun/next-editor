        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-start-error
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-start-size
        type: expect.preview
        at: { afterAction: expect-start-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Types of property 'size' are incompatible."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-start-output
        type: expect.preview
        at: { afterAction: expect-start-size }
        timeoutMs: 5000
        target: { by: testId, value: ts-output }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-start-describe
        type: expect.preview
        at: { afterAction: expect-start-output }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-1 }
        textContains: "လက်ဖက်ရည် · large · less"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-start-extra
        type: expect.preview
        at: { afterAction: expect-start-describe }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-2 }
        textContains: "သကြား extra"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: as-const
    chapter: "as const"
    narration: >
      [[mark:type-query]] object ရဲ့ နာမည် အောက်မှာ query comment ထည့်ပြီး TypeScript ဘယ်လို နားလည်ထားလဲ
      ကြည့်ရအောင်။ [[mark:read-wide]] Types မှာ size နဲ့ သကြားက string ဖြစ်ပြီး၊ ရေခဲက boolean ဖြစ်နေပါတယ်။
      ဒါကြောင့် ဖော်ပြတဲ့ function က လက်မခံတာပါ။ [[mark:type-as-const]] object ရဲ့ နောက်ဆုံးမှာ as const
      ထည့်ပါမယ်။ [[mark:read-as-const]] Types ကို ကြည့်ပါ။ property တိုင်းရဲ့ ရှေ့မှာ read only ရောက်လာပြီး၊
      type တွေကလည်း ရေးထားတဲ့ တန်ဖိုး အတိအကျ ဖြစ်တဲ့ literal type တွေ ဖြစ်သွားပါပြီ။ အတွင်း object ထဲက
      သကြားနဲ့ ရေခဲအထိ read only ဖြစ်သွားတာကို သတိထား ကြည့်ပါ။ [[mark:read-deep-error]] function ခေါ်တဲ့ နေရာက
      error ပျောက်သွားပြီး၊ သကြားကို ပြောင်းတဲ့ line မှာ read only property ကို တန်ဖိုး ထည့်လို့ မရဘူး ဆိုတဲ့
      error အသစ် ပေါ်လာပါတယ်။ အထဲဆုံး အလွှာက property ကိုပါ ကာကွယ်ပေးနိုင်တာက Readonly နဲ့ မတူတဲ့ အချက်ပါ။
      [[mark:read-still-extra]] ဒါပေမဲ့ Output မှာ သကြားက extra ဖြစ်နေတုန်းပါ။ as const ကလည်း read only လိုပဲ
      type ပိုင်းမှာပဲ ရှိပြီး၊ run တဲ့ အချိန်မှာ ဘာမှ မလုပ်ပေးပါဘူး။ [[mark:type-comment-mutation]] ဆိုင်ရဲ့
      ပုံမှန် အရသာကို ပြောင်းနေတဲ့ line ကို TypeScript က ပြပေးပြီ ဖြစ်လို့၊ အဲဒီ line ကို comment လုပ်ပြီး
      ပိတ်လိုက်ပါမယ်။ [[mark:read-recipe-kept]] error ပျောက်သွားပြီး၊ Output မှာလည်း သကြားက less အတိုင်း
      ကျန်ပါပြီ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 7: Mutability (deep immutability with as const)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/mutability",
        }
      - {
          title: "TypeScript 3.4 release notes: const assertions",
          url: "https://www.typescriptlang.org/docs/handbook/release-notes/typescript-3-4.html#const-assertions",
        }
      - {
          title: "TypeScript Handbook: Everyday Types (literal inference, as const)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#literal-inference",
        }
    actions:
      - id: type-query
        type: editor.type
        at: { mark: type-query }
        target: { file: src/main.ts, after: "const houseTea = {\n", occurrence: 1 }
        text: "//    ^?\n"
      - id: expect-query-wide
        type: expect.preview
        at: { afterAction: type-query }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        attribute:
          {
            name: data-type,
            value: "const houseTea: {\n    item: string;\n    size: string;\n    extras: {\n        sugar: string;\n        ice: boolean;\n    };\n}",
          }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-as-const
        type: editor.type
        at: { mark: type-as-const }
        target:
          {
            file: src/main.ts,
            after: "  extras: { sugar: \"less\", ice: false },\n}",
            occurrence: 1,
          }
        text: " as const"
      - id: expect-query-const
        type: expect.preview
        at: { afterAction: type-as-const }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        attribute:
          {
            name: data-type,
            value: "const houseTea: {\n    readonly item: \"လက်ဖက်ရည်\";\n    readonly size: \"large\";\n    readonly extras: {\n        readonly sugar: \"less\";\n        readonly ice: false;\n    };\n}",
          }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-deep-error
        type: expect.preview
        at: { afterAction: expect-query-const }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Cannot assign to 'sugar' because it is a read-only property."
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-deep-error-count
        type: expect.preview
        at: { afterAction: expect-deep-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-still-extra
        type: expect.preview
        at: { mark: read-still-extra }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-2 }
        textContains: "သကြား extra"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-comment-mutation
        type: editor.type
        at: { mark: type-comment-mutation }
        target: { file: src/main.ts, after: "console.log(describe(houseTea));\n", occurrence: 1 }
        text: "// "
      - id: expect-recipe-clean
        type: expect.preview
        at: { afterAction: type-comment-mutation }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-recipe-kept
        type: expect.preview
        at: { afterAction: expect-recipe-clean }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-2 }
        textContains: "သကြား less"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: annotation
    chapter: "Annotation က အနိုင်ယူတယ်"
    narration: >
      [[mark:type-sample]] ဒါဆို as const သုံးထားတဲ့ variable မှာ type annotation ပါ ထည့်လိုက်ရင် ဘာဖြစ်မလဲ။
      စမ်းကြည့်ဖို့ စားပွဲ ငါးရဲ့ နမူနာ လက်မှတ် တစ်ခုကို as const နဲ့ ရေးပြီး၊ သူ့အောက်မှာ စားပွဲ နံပါတ်ကို
      ပြောင်းကြည့်ပါမယ်။ [[mark:read-sample-error]] စားပွဲ နံပါတ်က read only ဖြစ်နေလို့ error ပေါ်လာပါတယ်။
      ခုနက သကြားမှာ တွေ့ခဲ့တဲ့ error မျိုးပါ။ [[mark:type-annotation]] အခု ဒီ variable မှာ menu ဖိုင်က Ticket
      ဆိုတဲ့ type annotation ထည့်ကြည့်ပါမယ်။ [[mark:read-annotation]] error ပျောက်သွားပါပြီ။
      ဘာကြောင့်လဲဆိုတော့၊ variable မှာ type annotation ရှိရင် TypeScript က အဲဒီ type ကိုပဲ variable ရဲ့ type
      အဖြစ် ယူလို့ပါ။ as const က တန်ဖိုးရဲ့ type ကို ကျဉ်းအောင် လုပ်ပေးပေမယ့်၊ အဲဒီ တန်ဖိုးက Ticket နဲ့
      ကိုက်တယ် ဆိုတာ စစ်ပြီးတာနဲ့ variable ကတော့ Ticket ပဲ ဖြစ်သွားပါတယ်။ ဒါကြောင့် read only တွေနဲ့ literal
      type တွေ ပျောက်ပြီး၊ စားပွဲ နံပါတ်ကို ပြန်ပြောင်းလို့ ရသွားတာပါ။ [[mark:read-annotation-rule]] ဆိုတော့
      type annotation နဲ့ as const ကို တွဲသုံးရင် annotation က အနိုင်ယူတယ် လို့ မှတ်ထားပါ။ type နဲ့ စစ်ပြီး
      as const ကိုလည်း ထိန်းထားချင်ရင် သုံးလို့ ရတဲ့ satisfies ကိုတော့ နောက်ပိုင်း lesson မှာ လေ့လာပါမယ်။
      [[mark:type-comment-sample]] စမ်းကြည့်တဲ့ line နှစ်ကြောင်းကိုတော့ comment လုပ်ပြီး ပိတ်ထားပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 7: Mutability (as const vs variable annotation)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/mutability",
        }
      - {
          title: "TypeScript Handbook: Everyday Types (type annotations on variables)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#type-annotations-on-variables",
        }
    actions:
      - id: type-sample
        type: editor.type
        at: { mark: type-sample }
        target:
          {
            file: src/main.ts,
            after: "console.log(\"သကြား\", houseTea.extras.sugar);\n",
            occurrence: 1,
          }
        text: "\nconst sample = { table: 5, size: \"small\" } as const;\nsample.table = 6;\n"
        cadence: line-by-line
      - id: expect-sample-error
        type: expect.preview
        at: { afterAction: type-sample }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-sample-readonly
        type: expect.preview
        at: { afterAction: expect-sample-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Cannot assign to 'table' because it is a read-only property."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-annotation
        type: editor.type
        at: { mark: type-annotation }
        target: { file: src/main.ts, after: "const sample", occurrence: 1 }
        text: ": Ticket"
      - id: expect-annotation-clean
        type: expect.preview
        at: { afterAction: type-annotation }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-comment-sample-change
        type: editor.type
        at: { mark: type-comment-sample }
        target: { file: src/main.ts, after: "size: \"small\" } as const;\n", occurrence: 1 }
        text: "// "
      - id: type-comment-sample
        type: editor.type
        at: { afterAction: type-comment-sample-change }
        target: { file: src/main.ts, after: "houseTea.extras.sugar);\n\n", occurrence: 1 }
        text: "// "
      - id: expect-sample-commented
        type: expect.preview
        at: { afterAction: type-comment-sample }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-sample-output
        type: expect.preview
        at: { afterAction: expect-sample-commented }
        timeoutMs: 5000
        target: { by: testId, value: ts-output }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: freeze
    chapter: "as const နဲ့ Object.freeze"
    narration: >
      [[mark:type-freeze]] run တဲ့ အချိန်မှာပါ တကယ် ကာကွယ်ချင်ရင်တော့ JavaScript ရဲ့ Object.freeze ကို
      သုံးလို့ ရပါတယ်။ ဆိုင် ပိတ်ချိန်နဲ့ ငွေကိုင် ဝန်ထမ်း ပါတဲ့ object ကို freeze လုပ်ပြီး၊ ငွေကိုင်ကို
      လှလှကနေ မောင်မောင် ပြောင်းတာရယ်၊ ပိတ်ချိန်ကို ပြောင်းတာရယ် ရေးကြည့်ပါမယ်။ [[mark:read-freeze-error]]
      Errors မှာ ပိတ်ချိန် ပြောင်းတဲ့ line အတွက်ပဲ read only error ပေါ်ပါတယ်။ TypeScript က Object.freeze
      ရဲ့ ရလဒ်ကို Readonly utility type နဲ့ ဖော်ပြလို့၊ အပြင်ဆုံး အလွှာကိုပဲ ကာကွယ်ပြီး ငွေကိုင် ပြောင်းတာကိုတော့
      ခွင့်ပြုထားတာပါ။
      [[mark:read-freeze-output]] Output ကို ကြည့်ပါ။ ငွေကိုင်က မောင်မောင် ဖြစ်သွားပေမယ့်၊ ပိတ်ချိန်
      ပြောင်းတဲ့ နေရာမှာတော့ အနီရောင် TypeError နဲ့ program ရပ်သွားပါတယ်။ ဒါက type မဟုတ်ဘဲ JavaScript
      ကိုယ်တိုင်က run နေတဲ့ အချိန်မှာ freeze လုပ်ထားတဲ့ property ကို ပြောင်းခွင့် မပေးတာပါ။
      [[mark:type-comment-close]] ပိတ်ချိန် ပြောင်းတဲ့ line ကို comment လုပ်ပြီး ပိတ်ထားပါမယ်။
      [[mark:board-compare]] as const နဲ့ Object.freeze ကို နှိုင်းယှဉ်ကြည့်ရအောင်။ [[mark:draw-when]] as const က type စစ်တဲ့ အချိန်မှာပဲ အလုပ်လုပ်ပြီး၊
      Object.freeze ကတော့ program run နေတဲ့ အချိန်မှာ တကယ် ကာကွယ်ပါတယ်။ [[mark:draw-depth]] ဒါပေမဲ့ as const က
      အထဲအထိ ကာကွယ်ပြီး၊ Object.freeze က အပြင်ဆုံး အလွှာကိုပဲ ကာကွယ်ပါတယ်။ as const က run တဲ့ JavaScript ထဲကို
      ဘာမှ မထပ်ပေါင်းတဲ့အတွက် များသောအားဖြင့် as const ကို သုံးပြီး၊ runtime မှာပါ တကယ် ပိတ်ဖို့ လိုမှသာ
      Object.freeze ကို သုံးကြပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 7: Mutability (comparing as const with Object.freeze)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/mutability",
        }
      - {
          title: "MDN: Object.freeze() (shallow freeze, TypeError in strict mode)",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/freeze",
        }
    actions:
      - id: type-freeze
        type: editor.type
        at: { mark: type-freeze }
        target: { file: src/main.ts, after: "// sample.table = 6;\n", occurrence: 1 }
        text: "\nconst shop = Object.freeze({ close: 18, staff: { cashier: \"လှလှ\" } });\nshop.staff.cashier = \"မောင်မောင်\";\nconsole.log(\"ငွေကိုင်\", shop.staff.cashier);\nshop.close = 20;\n"
        cadence: line-by-line
      - id: expect-freeze-error-count
        type: expect.preview
        at: { afterAction: type-freeze }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-freeze-error
        type: expect.preview
        at: { afterAction: expect-freeze-error-count }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Cannot assign to 'close' because it is a read-only property."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-freeze-cashier
        type: expect.preview
        at: { afterAction: expect-freeze-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-3 }
        textContains: "ငွေကိုင် မောင်မောင်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-freeze-crash
        type: expect.preview
        at: { afterAction: expect-freeze-cashier }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-4 }
        textContains: "Uncaught TypeError: Cannot assign to read only property 'close'"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-freeze-crash-level
        type: expect.preview
        at: { afterAction: expect-freeze-crash }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-4 }
        attribute: { name: data-level, value: "error" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-comment-close
        type: editor.type
        at: { mark: type-comment-close }
        target:
          {
            file: src/main.ts,
            after: "console.log(\"ငွေကိုင်\", shop.staff.cashier);\n",
            occurrence: 1,
          }
        text: "// "
      - id: expect-close-clean
        type: expect.preview
        at: { afterAction: type-comment-close }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-close-output
        type: expect.preview
        at: { afterAction: expect-close-clean }
        timeoutMs: 5000
        target: { by: testId, value: ts-output }
        attribute: { name: data-count, value: "3" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: board-compare
        type: whiteboard.apply
        at: { mark: board-compare }
        open: true
        clear: true
        upsertIds: [b-title, b-col1, b-col2]
      - id: draw-when
        type: whiteboard.apply
        at: { mark: draw-when }
        upsertIds: [b-row1-label, b-row1-c1, b-row1-c2]
        drawMs: 1800
      - id: draw-depth
        type: whiteboard.apply
        at: { mark: draw-depth }
        upsertIds: [b-row2-label, b-row2-c1, b-row2-c2]
        drawMs: 1800

  - id: tuple
    chapter: "Function က tuple ပြန်ပေးခြင်း"
    narration: >
      [[mark:type-price-tag]] as const ကို function က တန်ဖိုး နှစ်ခု တွဲပြီး ပြန်ပေးတဲ့ အခါမှာလည်း သုံးပါတယ်။
      ပစ္စည်း နာမည်နဲ့ ဈေးနှုန်းကို array တစ်ခုထဲ ထည့်ပြီး ပြန်ပေးတဲ့ function ရေးပြီး၊ ခေါ်တဲ့ နေရာမှာ နှစ်ခု
      ခွဲထုတ်ပါမယ်။ function နာမည်ရဲ့ အောက်မှာ query comment ပါ ထည့်ထားပါတယ်။ [[mark:read-tag-error]] ဈေးနှုန်းကို
      ၃၀၀ ပေါင်းတဲ့ နေရာမှာ error ပေါ်လာပါတယ်။ ဈေးနှုန်းက string ဖြစ်နိုင်သလို number လည်း ဖြစ်နိုင်လို့
      ပေါင်းလို့ မရဘူးလို့ ပြောနေတာပါ။ Output မှာတော့ ၂၁၀၀ ကျပ် မှန်မှန် ထွက်နေပေမယ့်၊ TypeScript က အဲဒါကို
      ကြိုမသိနိုင်ပါဘူး။ [[mark:read-tag-type]] Types ကို ကြည့်ရင်၊ function က string ဒါမှမဟုတ် number တွေ
      ပါတဲ့ ရိုးရိုး array ကို ပြန်ပေးတယ်လို့ infer လုပ်ထားပါတယ်။ array ကို နောက်မှ ပြောင်းလို့ ရတဲ့အတွက်၊ ပထမ
      နေရာမှာ နာမည်၊ ဒုတိယ နေရာမှာ ဈေး ဆိုတဲ့ အစီအစဉ်ကို TypeScript က မမှတ်ထားတာပါ။ [[mark:type-tag-as-const]]
      ပြန်ပေးတဲ့ array ရဲ့ နောက်မှာ as const ထည့်ပါမယ်။ [[mark:read-tag-fixed]] error ပျောက်သွားပြီး၊
      ပြန်ပေးတဲ့ type က ပထမ နေရာမှာ string ရယ်၊ ဒုတိယ နေရာမှာ number ရယ် ဆိုတဲ့ read only tuple ဖြစ်သွားပါပြီ။
      as const မသုံးဘဲ ဒီ tuple type ကို function ရဲ့ return type အဖြစ် ကိုယ်တိုင် ရေးပေးတာလည်း နောက်ထပ် နည်း
      တစ်ခုပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 7: Mutability (returning a tuple from a function)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/mutability",
        }
      - {
          title: "TypeScript Handbook: Object Types (readonly tuple types)",
          url: "https://www.typescriptlang.org/docs/handbook/2/objects.html#readonly-tuple-types",
        }
    actions:
      - id: close-board-b
        type: whiteboard.apply
        at: { mark: type-price-tag }
        open: false
      - id: type-price-tag
        type: editor.type
        at: { afterAction: close-board-b }
        target: { file: src/main.ts, after: "// shop.close = 20;\n", occurrence: 1 }
        text: "\nfunction priceTag(item: string, price: number) {\n//       ^?\n  return [item, price];\n}\nconst [item, price] = priceTag(\"ကော်ဖီ\", 1800);\nconsole.log(item, price + 300);\n"
        cadence: line-by-line
      - id: expect-tag-error
        type: expect.preview
        at: { afterAction: type-price-tag }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-1 }
        textContains: "Operator '+' cannot be applied to types 'string | number' and 'number'."
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-tag-array
        type: expect.preview
        at: { afterAction: expect-tag-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-2 }
        attribute:
          {
            name: data-type,
            value: "function priceTag(item: string, price: number): (string | number)[]",
          }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-tag-runs
        type: expect.preview
        at: { afterAction: expect-tag-array }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-4 }
        textContains: "ကော်ဖီ 2100"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-tag-as-const
        type: editor.type
        at: { mark: type-tag-as-const }
        target: { file: src/main.ts, after: "  return [item, price]", occurrence: 1 }
        text: " as const"
      - id: expect-tag-clean
        type: expect.preview
        at: { afterAction: type-tag-as-const }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-tag-tuple
        type: expect.preview
        at: { afterAction: expect-tag-clean }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-2 }
        attribute:
          {
            name: data-type,
            value: "function priceTag(item: string, price: number): readonly [string, number]",
          }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: object-array
    chapter: "Object array နဲ့ as const"
    narration: >
      [[mark:type-tickets]] နောက်ဆုံး ဥပမာက စားပွဲ နံပါတ်နဲ့ size ပါတဲ့ အော်ဒါ လက်မှတ် စာရင်းပါ။ object တွေ
      ပါတဲ့ array တစ်ခု ရေးပြီး၊ menu ဖိုင်က လက်မှတ် ထုတ်တဲ့ function ထဲ ပို့ပါမယ်။
      [[mark:read-tickets-error]] lesson အစက error မျိုး ပြန်ပေါ်လာပါပြီ။ array ထဲက object တွေရဲ့ size ကလည်း
      string အဖြစ် ကျယ်သွားလို့ပါ။ [[mark:type-tickets-as-const]] array တစ်ခုလုံးရဲ့ နောက်မှာ as const
      ထည့်ကြည့်ပါမယ်။ [[mark:read-tickets-readonly]] error ပြောင်းသွားပါပြီ။ error ထဲမှာ စားပွဲ နံပါတ်နဲ့ size
      တွေက literal type အဖြစ် ကျန်နေတာ တွေ့ရပါတယ်။ ဒါပေမဲ့ စာရင်းက read only tuple ဖြစ်သွားပြီး၊ function
      ကတော့ ပြောင်းလို့ ရတဲ့ array ကို လိုချင်နေလို့ ထည့်လို့ မရဘူးလို့ ပြောနေပါတယ်။ ပြီးခဲ့တဲ့ lesson မှာ
      တွေ့ခဲ့တဲ့ ပြဿနာပါ။ [[mark:type-readonly-param]] ဒါကြောင့် menu ဖိုင်က function ရဲ့ parameter ကို read
      only လုပ်ပေးပါမယ်။ [[mark:read-tickets-clean]] Errors ရှင်းသွားပြီး၊ Output မှာ စားပွဲ ၃ နဲ့ စားပွဲ ၈
      ရဲ့ လက်မှတ်တွေ ထွက်နေပါတယ်။ array ကို push လုပ်ဖို့ လိုသေးတယ် ဆိုရင်တော့၊ array တစ်ခုလုံးရဲ့ နောက်မှာ
      မဟုတ်ဘဲ object တစ်ခုချင်းစီရဲ့ နောက်မှာ as const ထည့်တာလည်း နည်း တစ်ခုပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 7: Mutability (inferring literal values in arrays)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/mutability",
        }
      - {
          title: "TypeScript Handbook: Object Types (the ReadonlyArray type)",
          url: "https://www.typescriptlang.org/docs/handbook/2/objects.html#the-readonlyarray-type",
        }
    actions:
      - id: type-tickets
        type: editor.type
        at: { mark: type-tickets }
        target: { file: src/main.ts, after: "console.log(item, price + 300);\n", occurrence: 1 }
        text: "\nconst tickets = [\n  { table: 3, size: \"large\" },\n  { table: 8, size: \"small\" },\n];\nprintTickets(tickets);\n"
        cadence: line-by-line
      - id: expect-tickets-error
        type: expect.preview
        at: { afterAction: type-tickets }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-1 }
        textContains: "Type 'string' is not assignable to type 'CupSize'."
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-tickets-output
        type: expect.preview
        at: { afterAction: expect-tickets-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-5 }
        textContains: "စားပွဲ 3 large၊ 8 small"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-tickets-as-const
        type: editor.type
        at: { mark: type-tickets-as-const }
        target: { file: src/main.ts, after: "  { table: 8, size: \"small\" },\n]", occurrence: 1 }
        text: " as const"
      - id: expect-tickets-readonly
        type: expect.preview
        at: { afterAction: type-tickets-as-const }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-1 }
        textContains: "is 'readonly' and cannot be assigned to the mutable type 'Ticket[]'."
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-tickets-literal
        type: expect.preview
        at: { afterAction: expect-tickets-readonly }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: 'readonly [{ readonly table: 3; readonly size: "large"; }, { readonly table: 8; readonly size: "small"; }]'
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: open-menu-2
        type: workspace.openFile
        at: { mark: type-readonly-param }
        path: src/menu.ts
      - id: type-readonly-param
        type: editor.type
        at: { afterAction: open-menu-2 }
        target: { file: src/menu.ts, after: "printTickets(tickets: ", occurrence: 1 }
        text: "readonly "
      - id: expect-tickets-clean
        type: expect.preview
        at: { afterAction: type-readonly-param }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-tickets-printed
        type: expect.preview
        at: { afterAction: expect-tickets-clean }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-5 }
        textContains: "စားပွဲ 3 large၊ 8 small"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: recap
    narration: >
      [[mark:recap-as-const]] ဒါဆို ပြန်ချုပ်ရရင်၊ as const က တန်ဖိုး တစ်ခုလုံးကို အထဲအထိ read only လုပ်ပြီး
      literal type တွေကို ထိန်းထားပေးပါတယ်။ variable မှာ type annotation ပါရင်တော့ annotation က အနိုင်ယူပါတယ်။
      [[mark:recap-freeze]] as const က type ပိုင်းမှာပဲ အလုပ်လုပ်ပြီး အထဲအထိ ရောက်ပါတယ်။ Object.freeze ကတော့
      runtime မှာ တကယ် ကာကွယ်ပေမယ့် အပြင်ဆုံး အလွှာကိုပဲ ကာကွယ်ပါတယ်။ [[mark:recap-tuple]] function က tuple
      ပြန်ပေးချင်ရင် as const ဒါမှမဟုတ် return type ကို သုံးပြီး၊ object array မှာ literal type တွေ
      ထိန်းချင်ရင်လည်း as const ကို သုံးလို့ ရပါတယ်။ နောက် lesson မှာတော့ class တွေကို TypeScript နဲ့ ဘယ်လို
      ရေးမလဲ ဆိုတာ စကြည့်သွားပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 7: Mutability (deep immutability with as const)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/mutability",
        }
      - {
          title: "TypeScript 3.4 release notes: const assertions",
          url: "https://www.typescriptlang.org/docs/handbook/release-notes/typescript-3-4.html#const-assertions",
        }
    actions:
      - id: open-main-2
        type: workspace.openFile
        at: { mark: recap-as-const }
        path: src/main.ts
      - id: select-recap-as-const
        type: editor.select
        at: { afterAction: open-main-2 }
        target: { file: src/main.ts, text: "} as const;", occurrence: 1 }
      - id: select-recap-freeze
        type: editor.select
        at: { mark: recap-freeze }
        target: { file: src/main.ts, text: "Object.freeze", occurrence: 1 }
      - id: select-recap-tuple
        type: editor.select
        at: { mark: recap-tuple }
        target: { file: src/main.ts, text: "return [item, price] as const;", occurrence: 1 }
      - id: expect-file-house-tea
        type: expect.file
        at: { afterAction: select-recap-tuple }
        path: src/main.ts
        contains: "const houseTea = {\n//    ^?\n"
      - id: expect-file-recipe
        type: expect.file
        at: { afterAction: expect-file-house-tea }
        path: src/main.ts
        contains: "} as const;\nconsole.log(describe(houseTea));\n// houseTea.extras.sugar = \"extra\";"
      - id: expect-file-sample
        type: expect.file
        at: { afterAction: expect-file-recipe }
        path: src/main.ts
        contains: "// const sample: Ticket = { table: 5, size: \"small\" } as const;\n// sample.table = 6;"
      - id: expect-file-freeze
        type: expect.file
        at: { afterAction: expect-file-sample }
        path: src/main.ts
        contains: "// shop.close = 20;"
      - id: expect-file-tuple
        type: expect.file
        at: { afterAction: expect-file-freeze }
        path: src/main.ts
        contains: "  return [item, price] as const;"
      - id: expect-file-tickets
        type: expect.file
        at: { afterAction: expect-file-tuple }
        path: src/main.ts
        contains: "  { table: 8, size: \"small\" },\n] as const;\nprintTickets(tickets);"
      - id: expect-file-param
        type: expect.file
        at: { afterAction: expect-file-tickets }
        path: src/menu.ts
        contains: "export function printTickets(tickets: readonly Ticket[]) {"
checks:
  - { type: timing.p95Ms, max: 300 }
