  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 2611

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  - id: perceive-color
    chapter: "အရောင်ကို ဘယ်လို မြင်လဲ"
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ ပုံကို မမြင်ရတဲ့ သူတွေအတွက် alt text ရေးခဲ့ပါတယ်။ ဒီ lesson မှာတော့
      page ကို မြင်ရပေမယ့်၊ အရောင်နဲ့ contrast ကြောင့် ဖတ်ရ ခက်နေတဲ့ သူတွေအကြောင်း
      ကြည့်သွားပါမယ်။ [[mark:start-server]] အရင်ဆုံး ကိုယ်တွေ အရောင်ကို ဘယ်လို မြင်လဲ
      ဆိုတာကနေ စကြည့်ရအောင်။ [[mark:draw-flow]] တကယ်တော့ ပစ္စည်းတွေမှာ အရောင် ကိုယ်တိုင်
      မရှိပါဘူး။ ပစ္စည်းက သူ့ဆီ ကျလာတဲ့ အလင်းထဲက တချို့ကို ပြန်ပြီး ရောင်ပြန်ဟပ်တာပါ။ အဲဒီ
      အလင်းကို မျက်စိက လက်ခံပြီး၊ ဦးနှောက်က အရောင် တစ်ခုအဖြစ် ပြောင်းပေးပါတယ်။
      [[mark:draw-hsl]] အရောင်ကို လူ့မျက်စိ မြင်ပုံနဲ့ နီးနီးစပ်စပ် ဖော်ပြချင်ရင် HSL ဆိုတဲ့ နည်းကို
      သုံးပါတယ်။ Hue က အနီလား၊ အစိမ်းလား၊
      အပြာလား ဆိုတဲ့ အရောင် အမျိုးအစားပါ။ Saturation က အရောင် ဘယ်လောက် ရင့်လဲ၊
      Lightness ကတော့ ဘယ်လောက် လင်းလဲ၊ ဘယ်လောက် မှောင်လဲ ဆိုတာပါ။ [[mark:circle-lightness]]
      Accessibility အတွက်တော့ နောက်ဆုံး တစ်ခုက အရေးအကြီးဆုံးပါ။ စာလုံးနဲ့ နောက်ခံ
      ကွဲကွဲပြားပြား မြင်ရဖို့က အရောင် အမျိုးအစား မတူတာထက်၊ အလင်း အမှောင် ကွာတာက
      ပိုအရေးကြီးလို့ပါ။
    sources:
      - title: "web.dev Learn Accessibility — Color and contrast (Perceive color)"
        url: "https://web.dev/learn/accessibility/color-contrast"
      - title: "MDN — hsl() colour function"
        url: "https://developer.mozilla.org/docs/Web/CSS/color_value/hsl"
    actions:
      - id: open-board-a
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      # Boot + pnpm install + vite run under the two opening boards; the
      # waitForReady sits on the preview mark more than 60 s of narration later.
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-flow
        type: whiteboard.apply
        at: { mark: draw-flow }
        upsertIds: [a-light, a-arrow-1, a-eye, a-arrow-2, a-brain]
        drawMs: 3000
      - id: draw-hsl
        type: whiteboard.apply
        at: { mark: draw-hsl }
        upsertIds: [a-hsl, a-hue, a-sat, a-lit]
        drawMs: 3200
      - id: circle-lightness
        type: whiteboard.apply
        at: { mark: circle-lightness }
        upsertIds: [a-lit-circle, a-key]
        drawMs: 1800

  - id: color-blindness
    chapter: "အရောင် ခွဲခြားရ ခက်တာ"
    narration: >
      [[mark:board-cvd]] ဒါပေမဲ့ လူတိုင်းက အရောင်ကို တစ်ပုံစံတည်း မြင်ကြတာ မဟုတ်ပါဘူး။
      [[mark:draw-stat]] ယောက်ျား ၁၂ ယောက်မှာ တစ်ယောက်လောက်နဲ့၊ အမျိုးသမီး ၂၀၀ မှာ
      တစ်ယောက်လောက်က color blindness လို့ ခေါ်တဲ့ အရောင် ခွဲခြားရ ခက်တာ ရှိပါတယ်။
      [[mark:draw-typical]] ဥပမာအားဖြင့်၊ ဆိုင်ရဲ့ menu မှာ ရနိုင်တဲ့ ဟင်းလျာကို အစိမ်းရောင်နဲ့၊
      ကုန်သွားတဲ့ ဟင်းလျာကို အနီရောင်နဲ့ ပြထားတယ် ဆိုပါစို့။ လူအများစုအတွက်တော့ ဒီ နှစ်ခုက
      ရှင်းရှင်းလင်းလင်း ကွဲပါတယ်။ [[mark:draw-deutan]] အစိမ်းရောင် အလင်းကို သိပ်
      မခံစားနိုင်တဲ့ deuteranopia ရှိသူအတွက်တော့၊ နှစ်ခုလုံး အဝါညိုညို အရောင်လို
      ဖြစ်သွားပါတယ်။ [[mark:draw-protan]] အနီရောင် အလင်းကို သိပ် မခံစားနိုင်တဲ့ protanopia
      မှာလည်း ဒီလိုပါပဲ၊ အနီဘက်က နည်းနည်း ပိုမှောင်သွားရုံပါ။ [[mark:draw-achromat]] အရမ်း
      ရှားတဲ့ achromatopsia ရှိသူကတော့ အရောင် မမြင်ဘဲ၊ မီးခိုးရောင် အဖျော့ အရင့်လောက်ပဲ
      မြင်ပါတယ်။ [[mark:draw-ratio]] ဒီ အစိမ်းနဲ့ အနီကို အလင်း အမှောင်နဲ့ပဲ နှိုင်းယှဉ်ကြည့်ရင်
      ၁.၃ နဲ့ ၁ လောက်ပဲ ကွာပါတယ်။ ဆိုလိုတာက အရောင် တစ်ခုတည်းကို အားကိုးပြီး အဓိပ္ပာယ်
      ပြောရင် လူ တော်တော်များများ လွဲသွားနိုင်ပါတယ်။
    sources:
      - title: "web.dev Learn Accessibility — Color and contrast (Measure color contrast)"
        url: "https://web.dev/learn/accessibility/color-contrast"
      - title: "Colour Blind Awareness — about 1 in 12 men and 1 in 200 women"
        url: "https://www.colourblindawareness.org/colour-blindness/"
      - title: "WCAG 2.2 — Understanding 1.4.1 Use of Color"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/use-of-color.html"
    actions:
      - id: board-cvd
        type: whiteboard.apply
        at: { mark: board-cvd }
        clear: true
        upsertIds: [b-title]
      - id: draw-stat
        type: whiteboard.apply
        at: { mark: draw-stat }
        upsertIds: [b-stat]
        drawMs: 1500
      - id: draw-typical
        type: whiteboard.apply
        at: { mark: draw-typical }
        upsertIds: [b-head-ok, b-head-out, b-row-typical, b-typical-ok, b-typical-out]
        drawMs: 2600
      - id: draw-deutan
        type: whiteboard.apply
        at: { mark: draw-deutan }
        upsertIds: [b-row-deutan, b-deutan-ok, b-deutan-out]
        drawMs: 1600
      - id: draw-protan
        type: whiteboard.apply
        at: { mark: draw-protan }
        upsertIds: [b-row-protan, b-protan-ok, b-protan-out]
        drawMs: 1600
      - id: draw-achromat
        type: whiteboard.apply
        at: { mark: draw-achromat }
        upsertIds: [b-row-achromat, b-achromat-ok, b-achromat-out]
        drawMs: 1600
      - id: draw-ratio
        type: whiteboard.apply
        at: { mark: draw-ratio }
        upsertIds: [b-ratio]
        drawMs: 1500

  - id: first-look
    chapter: "ဆိုင်ရဲ့ page ကို တိုင်းကြည့်ရအောင်"
    narration: >
      [[mark:close-cvd]] ဒါဆို ဆိုင်ရဲ့ page ကို ကြည့်ရအောင်။ [[mark:preview-opens]] ညာဘက်မှာ ဆိုင်ရဲ့
      page ကို မြင်ရပါပြီ။ page က လှပေမယ့်၊ ကြိုဆိုတဲ့ စာကြောင်းနဲ့ menu card ထဲက ဖော်ပြချက်တွေက အရမ်း
      ဖျော့နေပါတယ်။ [[mark:read-rows]] အောက်က accessibility panel က ဒီတစ်ခါ contrast ကို ပြနေပါတယ်။
      row တစ်ခုစီက စာသား အရောင်နဲ့ သူ့ နောက်ခံကို တိုင်းပြီး ratio နဲ့ ရလဒ်ကို ပြပါတယ်။ ကြိုဆိုတဲ့
      စာကြောင်းက ၂.၅၈ နဲ့ ၁၊ ကော်ဖီရဲ့ ဖော်ပြချက်က ၂.၂၈ နဲ့ ၁ ပဲ ရလို့ နှစ်ခုလုံး fail ပါ။
      [[mark:read-border]] တတိယ row ကတော့ စာသား မဟုတ်ဘဲ၊ form ထဲက ဖုန်း field ရဲ့ အနီရောင် ဘောင်ပါ။
      သူကတော့ ၅.၄ နဲ့ ၁ ရလို့ pass ပါတယ်။ ဒီ row ကို မှတ်ထားပါ၊ နောက်မှ ပြန်လာကြည့်ပါမယ်။
    sources:
      - title: "web.dev Learn Accessibility — Color and contrast"
        url: "https://web.dev/learn/accessibility/color-contrast"
      - title: "WCAG 2.2 — Understanding 1.4.3 Contrast (Minimum)"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum.html"
    actions:
      - id: close-cvd
        type: whiteboard.apply
        at: { mark: close-cvd }
        open: false
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { mark: preview-opens }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-dev-server }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-lead-fails
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: contrast-hero-lead }
        attribute: { name: data-ratio, value: "2.58" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-lead-aa-fail
        type: expect.preview
        at: { afterAction: expect-lead-fails }
        timeoutMs: 5000
        target: { by: testId, value: contrast-hero-lead }
        attribute: { name: data-aa, value: "fail" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-desc-fails
        type: expect.preview
        at: { mark: read-rows }
        timeoutMs: 5000
        target: { by: testId, value: contrast-coffee-desc }
        attribute: { name: data-ratio, value: "2.28" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-desc-aa-fail
        type: expect.preview
        at: { afterAction: expect-desc-fails }
        timeoutMs: 5000
        target: { by: testId, value: contrast-coffee-desc }
        attribute: { name: data-aa, value: "fail" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-border-passes
        type: expect.preview
        at: { mark: read-border }
        timeoutMs: 5000
        target: { by: testId, value: contrast-input-phone }
        textContains: '"ဖုန်း" border 5.40:1 needs 3:1 pass'
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: contrast-ratio
    chapter: "Contrast ratio ဆိုတာ ဘာလဲ"
    narration: >
      [[mark:board-ratio]] ဒီ ratio တွေက ဘယ်က လာတာလဲ။ [[mark:draw-scale]] contrast ratio ဆိုတာ စာလုံး
      အရောင်နဲ့ နောက်ခံ အရောင် ဘယ်လောက် ကွာလဲ ဆိုတာကို ဂဏန်းနဲ့ ပြတာပါ။ အရောင် နှစ်ခုရဲ့ relative
      luminance လို့ ခေါ်တဲ့ အလင်း ပမာဏကို နှိုင်းယှဉ်တာပါ။ ခုနက lightness နဲ့ ဆင်ပေမယ့်၊ မျက်စိက
      အဝါကို အပြာထက် ပိုလင်းတယ်လို့ မြင်တာကိုပါ ထည့်တွက်ထားပါတယ်။ အရောင် တူနေရင် ၁ နဲ့ ၁ ဖြစ်ပြီး၊
      အဖြူပေါ်က အမည်းဆိုရင် အများဆုံး ၂၁ နဲ့ ၁ ရပါတယ်။ [[mark:draw-text-rule]] WCAG ရဲ့ level AA မှာ
      ပုံမှန် စာသားအတွက် အနည်းဆုံး ၄.၅ နဲ့ ၁ လိုပါတယ်။ level AAA ဆိုရင်တော့ ၇ နဲ့ ၁ ပါ။
      [[mark:draw-large-rule]] စာလုံး ကြီးရင် ဖတ်ရ ပိုလွယ်လို့ စံက နည်းနည်း လျော့ပါတယ်။ ၂၄ pixel နဲ့
      အထက်၊ ဒါမှမဟုတ် bold ဆိုရင် ၁၈.၆၆ pixel နဲ့ အထက် စာလုံးတွေအတွက် AA က ၃ နဲ့ ၁၊ AAA က ၄.၅ နဲ့ ၁
      ပါ။ [[mark:draw-ui-rule]] စာသား မဟုတ်တဲ့ ခလုတ်ဘောင်၊ form field ဘောင်နဲ့ အရေးကြီးတဲ့ icon
      တွေကတော့ သူ့ ဘေးက အရောင်နဲ့ ၃ နဲ့ ၁ ရှိရပါမယ်။ [[mark:draw-exempt]] logo နဲ့ အလှဆင်ဖို့ သက်သက်
      ထည့်ထားတဲ့ အရာတွေကိုတော့ မစစ်ပါဘူး။ [[mark:draw-round]] သတိထားရမှာ တစ်ခုက ratio ကို အပေါ်
      တိုးပြီး မယူရပါဘူး။ ၄.၄၉ နဲ့ ၁ ဆိုရင် ၄.၅ မပြည့်လို့ fail ပါပဲ။ ကိုယ်တိုင် တွက်စရာတော့
      မလိုပါဘူး။ Chrome DevTools ရဲ့ color picker နဲ့ ဒီ panel က တွက်ပေးပါတယ်။
    sources:
      - title: "web.dev Learn Accessibility — Color and contrast (Calculate color contrast)"
        url: "https://web.dev/learn/accessibility/color-contrast"
      - title: "WCAG 2.2 — contrast ratio and relative luminance definitions"
        url: "https://www.w3.org/TR/WCAG22/#dfn-contrast-ratio"
      - title: "WCAG 2.2 — Understanding 1.4.3 Contrast (Minimum)"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum.html"
      - title: "WCAG 2.2 — Understanding 1.4.6 Contrast (Enhanced)"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/contrast-enhanced.html"
      - title: "WCAG 2.2 — Understanding 1.4.11 Non-text Contrast"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/non-text-contrast.html"
      - title: "Chrome DevTools — Accessibility features reference: contrast"
        url: "https://developer.chrome.com/docs/devtools/accessibility/reference#contrast"
    actions:
      - id: board-ratio
        type: whiteboard.apply
        at: { mark: board-ratio }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-scale
        type: whiteboard.apply
        at: { mark: draw-scale }
        upsertIds: [c-scale]
        drawMs: 1600
      - id: draw-text-rule
        type: whiteboard.apply
        at: { mark: draw-text-rule }
        upsertIds: [c-text]
        drawMs: 1400
      - id: draw-large-rule
        type: whiteboard.apply
        at: { mark: draw-large-rule }
        upsertIds: [c-large]
        drawMs: 1800
      - id: draw-ui-rule
        type: whiteboard.apply
        at: { mark: draw-ui-rule }
        upsertIds: [c-ui]
        drawMs: 1400
      - id: draw-exempt
        type: whiteboard.apply
        at: { mark: draw-exempt }
        upsertIds: [c-exempt]
        drawMs: 1000
      - id: draw-round
        type: whiteboard.apply
        at: { mark: draw-round }
        upsertIds: [c-round, c-round-line]
        drawMs: 1200

  - id: fix-text
    chapter: "ဖျော့နေတဲ့ စာသားကို ပြင်ရအောင်"
    narration: >
      [[mark:close-ratio]] ဒါဆို ဖျော့နေတဲ့ စာသား နှစ်ခုကို ပြင်ကြည့်ရအောင်။ [[mark:open-styles]]
      ဖျော့တဲ့ အရောင်တွေက base ဖိုင်ထဲမှာ ရှိပေမယ့်၊ နောက်မှ ချိတ်ထားတဲ့ ဒီ styles ဖိုင်ထဲမှာ selector
      တူတူနဲ့ ရေးရင် cascade အရ ကိုယ့် rule က နိုင်ပါတယ်။ [[mark:type-color]] အရောင်ကိုတော့ အညိုရင့်
      ပေးပါမယ်။ ဆိုင်ရဲ့ အညိုရောင် ပုံစံ မပျက်ဘဲ စာလုံးကို ထင်ရှားစေချင်လို့ပါ။  ရိုက်နေတုန်း panel
      ကို လိုက်ကြည့်ပါ။ [[mark:after-color]] ကြည့်ပါ၊ row နှစ်ခုလုံး pass ဖြစ်သွားပါပြီ။ ကြိုဆိုတဲ့
      စာကြောင်းက ၆.၇၂ နဲ့ ၁ ရလို့ AA ကို ကျော်ပေမယ့်၊ AAA ကိုတော့ မမီသေးပါဘူး။ ကော်ဖီရဲ့
      ဖော်ပြချက်ကတော့ ၇.၀၉ နဲ့ ၁ ရလို့ AAA ပါ pass ပါတယ်။ စာလုံး အရောင်က အတူတူပဲ ဖြစ်ပေမယ့်၊
      ကြိုဆိုတဲ့ စာကြောင်းရဲ့ နောက်ခံက ခရင်မ်ရောင်၊ card ရဲ့ နောက်ခံက အဖြူ ဖြစ်နေလို့ပါ။ ဒါကြောင့်
      contrast ဆိုတာ အရောင် တစ်ခုတည်းမှာ ရှိတာ မဟုတ်ဘဲ၊ အရောင် နှစ်ခု တွဲမှ တိုင်းလို့ ရတာပါ။
    sources:
      - title: "web.dev Learn Accessibility — Color and contrast"
        url: "https://web.dev/learn/accessibility/color-contrast"
      - title: "WCAG 2.2 — Understanding 1.4.6 Contrast (Enhanced)"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/contrast-enhanced.html"
      - title: "MDN — named colours (saddlebrown)"
        url: "https://developer.mozilla.org/docs/Web/CSS/named-color"
    actions:
      - id: close-ratio
        type: whiteboard.apply
        at: { mark: close-ratio }
        open: false
      - id: open-styles
        type: workspace.openFile
        at: { mark: open-styles }
        path: styles.css
      - id: type-color
        type: editor.type
        at: { mark: type-color }
        cadence: fast-explainer
        target: { file: styles.css, after: "", occurrence: 1 }
        text: ".lead,\n.menu-card .desc {\n  color: saddlebrown;\n}\n"
      - id: expect-lead-ratio
        type: expect.preview
        at: { mark: after-color }
        timeoutMs: 5000
        target: { by: testId, value: contrast-hero-lead }
        attribute: { name: data-ratio, value: "6.72" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-lead-aa-pass
        type: expect.preview
        at: { afterAction: expect-lead-ratio }
        timeoutMs: 5000
        target: { by: testId, value: contrast-hero-lead }
        attribute: { name: data-aa, value: "pass" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-lead-aaa-fail
        type: expect.preview
        at: { afterAction: expect-lead-aa-pass }
        timeoutMs: 5000
        target: { by: testId, value: contrast-hero-lead }
        attribute: { name: data-aaa, value: "fail" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-desc-ratio
        type: expect.preview
        at: { afterAction: expect-lead-aaa-fail }
        timeoutMs: 5000
        target: { by: testId, value: contrast-coffee-desc }
        attribute: { name: data-ratio, value: "7.09" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-desc-aaa-pass
        type: expect.preview
        at: { afterAction: expect-desc-ratio }
        timeoutMs: 5000
        target: { by: testId, value: contrast-coffee-desc }
        attribute: { name: data-aaa, value: "pass" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: link-underline
    chapter: "အရောင် တစ်ခုတည်းနဲ့ မပြောရအောင်"
    narration: >
      [[mark:open-index-link]] contrast ကောင်းရုံနဲ့ မပြီးသေးပါဘူး။ နောက်ထပ် စည်းကမ်း တစ်ခုက၊
      တစ်ခုခုကို ပြောပြဖို့၊ ဒါမှမဟုတ် တစ်ခုနဲ့ တစ်ခု ခွဲပြဖို့ အရောင် တစ်ခုတည်းကို အားမကိုးရပါဘူး။
      ဥပမာ အစိမ်းရောင် ခလုတ်ကို နှိပ်ပါ လို့ ရေးထားရင်၊ အစိမ်းကို မခွဲခြားနိုင်တဲ့ သူက ဘယ်ခလုတ်လဲ
      မသိပါဘူး။ page ကို အဖြူအမည်းနဲ့ ကြည့်တာက ဒီ ပြဿနာကို မြန်မြန် ရှာတဲ့ နည်းပါ။ ကိုယ့် page မှာ
      ဒီလို နေရာ သုံးခု ရှိပါတယ်။ [[mark:select-link]] ပထမ တစ်ခုက ကြိုဆိုတဲ့ နေရာက ဒီ link ပါ။
      underline မပါဘဲ အရောင်နဲ့ပဲ ခွဲထားပါတယ်။ link ရဲ့ အညိုနဲ့ ဘေးက စာသားရဲ့ အညိုရင့်က ၂.၇၉ နဲ့ ၁ ပဲ
      ကွာတဲ့အတွက်၊ ဒါ link လား ဆိုတာ မျက်စိနဲ့ ခွဲရ ခက်ပါတယ်။ [[mark:open-styles-link]] ဒါကြောင့်
      styles ဖိုင်ထဲမှာ underline ကို ပြန်ထည့်ပါမယ်။ [[mark:type-underline]] အရောင်နဲ့ မဆိုင်တဲ့
      အမှတ်အသား တစ်ခုကို ထပ်ပေးလိုက်တာပါ။ ဒီလို အမှတ်အသားက မျဉ်း ဖြစ်ဖြစ်၊ စာသား ဖြစ်ဖြစ်၊ icon
      ဖြစ်ဖြစ် ရပါတယ်။ [[mark:after-underline]] ကြည့်ပါ၊ link အောက်မှာ မျဉ်းလေး ပေါ်လာပါပြီ။ အခုဆိုရင်
      အရောင် မခွဲခြားနိုင်တဲ့ သူလည်း ဒါ link ဖြစ်မှန်း သိနိုင်ပါပြီ။
    sources:
      - title: "web.dev Learn Accessibility — Color and contrast (Using color)"
        url: "https://web.dev/learn/accessibility/color-contrast"
      - title: "WCAG 2.2 — Understanding 1.4.1 Use of Color"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/use-of-color.html"
      - title: "WCAG 2.2 Technique G183 — 3:1 between link and surrounding text, plus a non-colour cue"
        url: "https://www.w3.org/WAI/WCAG22/Techniques/general/G183"
    actions:
      - id: open-index-link
        type: workspace.openFile
        at: { mark: open-index-link }
        path: index.html
      - id: select-link
        type: editor.select
        at: { mark: select-link }
        target:
          { file: index.html, text: '<a href="#order" data-testid="note-link">', occurrence: 1 }
      - id: open-styles-link
        type: workspace.openFile
        at: { mark: open-styles-link }
        path: styles.css
      - id: type-underline
        type: editor.type
        at: { mark: type-underline }
        cadence: fast-explainer
        target: { file: styles.css, after: "  color: saddlebrown;\n}\n", occurrence: 1 }
        text: "\n.note a {\n  text-decoration: underline;\n}\n"
      - id: expect-link-still-there
        type: expect.preview
        at: { mark: after-underline }
        timeoutMs: 5000
        target: { by: testId, value: note-link }
        textContains: "အွန်လိုင်းကနေ ကြိုမှာပါ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-underline-file
        type: expect.file
        at: { afterAction: expect-link-still-there }
        path: styles.css
        contains: ".note a {\n  text-decoration: underline;\n}"

  - id: sold-out
    narration: >
      [[mark:open-index-sold]] ဒုတိယ တစ်ခုက ရှမ်းခေါက်ဆွဲပါ။ [[mark:select-sold]] ဒီ card မှာ
      ကုန်သွားပြီလို့ မှတ်ထားတဲ့ class ပါပေမယ့်၊ screen ပေါ်မှာတော့ ဟင်းလျာ နာမည်ကို
      အနီရောင် ပြောင်းထားတာ တစ်ခုပဲ ရှိပါတယ်။ အနီကို ခွဲမမြင်နိုင်တဲ့ သူအတွက်ကော၊ screen
      reader သုံးတဲ့ သူအတွက်ပါ၊ ဒီ အနီရောင်က ဘာမှ မပြောပြပါဘူး။ [[mark:type-status]]
      ဒါကြောင့် ကုန်သွားပြီ ဆိုတဲ့ စာသားကို တကယ် ထည့်ပေးပါမယ်။ [[mark:after-status]] ကြည့်ပါ၊
      ဈေးနှုန်း ဘေးမှာ ကုန်သွားပြီ ဆိုတဲ့ စာ ပေါ်လာပါပြီ။ အနီရောင်က ဆက်ရှိနေပေမယ့်၊ အခုတော့
      အရောင်က အပို အကူအညီ သက်သက်ပဲ ဖြစ်သွားပြီး၊ အဓိပ္ပာယ်ကို စာသားက ပြောပေးနေပါပြီ။
    sources:
      - title: "web.dev Learn Accessibility — Color and contrast (Using color)"
        url: "https://web.dev/learn/accessibility/color-contrast"
      - title: "WCAG 2.2 — Understanding 1.4.1 Use of Color"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/use-of-color.html"
    actions:
      - id: open-index-sold
        type: workspace.openFile
        at: { mark: open-index-sold }
        path: index.html
      - id: select-sold
        type: editor.select
        at: { mark: select-sold }
        target: { file: index.html, text: '<li class="menu-card sold-out"', occurrence: 1 }
      - id: type-status
        type: editor.type
        at: { mark: type-status }
        cadence: block
        target: { file: index.html, after: '<span class="price">3,000 ကျပ်</span>', occurrence: 1 }
        text: "\n            <span class=\"status\">ကုန်သွားပြီ</span>"
      - id: scroll-to-sold
        type: preview.scroll
        at: { mark: after-status }
        timeoutMs: 5000
        top: 560
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-sold-text
        type: expect.preview
        at: { afterAction: scroll-to-sold }
        timeoutMs: 5000
        target: { by: testId, value: card-shan-noodles }
        textContains: "ကုန်သွားပြီ"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: form-error
    narration: >
      [[mark:select-phone]] တတိယ တစ်ခုက form ထဲက ဖုန်း field ပါ။ ဖုန်းနံပါတ် မှားနေလို့ error
      ပြချင်တာပါ၊ ဒါပေမဲ့ ပြထားတာက ဘောင်ကို အနီ ပြောင်းထားတာ တစ်ခုပဲ ရှိပါတယ်။ ခုနက
      မှတ်ထားခိုင်းတဲ့ panel ထဲက row ကို ပြန်ကြည့်ပါ။ ဘောင်ရဲ့ contrast က pass ဖြစ်နေပါတယ်။
      ဒါပေမဲ့ ဘာ မှားနေလဲ၊ ဘယ်လို ပြင်ရမလဲ ဆိုတာကို အနီရောင် ဘောင်က မပြောပြနိုင်ပါဘူး။ [[mark:type-error]]
      ဒါကြောင့် field အောက်မှာ သတိပေး icon နဲ့ error စာသားကို ထည့်ပါမယ်။ [[mark:after-error]]
      ကြည့်ပါ၊ ဖုန်း field အောက်မှာ ၀၉ နဲ့ စပါ ဆိုတဲ့ စာ ပေါ်လာပါပြီ။ အခု error ကို အရောင်၊ icon
      နဲ့ စာသား သုံးမျိုးလုံးနဲ့ ပြောနေပါပြီ။ ဒီ စာကို field နဲ့ ချိတ်ပေးပြီး screen reader က
      ဖတ်ပြအောင် လုပ်တာကိုတော့ form lesson မှာ ဆက်ကြည့်ပါမယ်။
    sources:
      - title: "web.dev Learn Accessibility — Color and contrast (Using color)"
        url: "https://web.dev/learn/accessibility/color-contrast"
      - title: "WCAG 2.2 — Understanding 1.4.1 Use of Color"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/use-of-color.html"
      - title: "WCAG 2.2 — Understanding 3.3.1 Error Identification"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/error-identification.html"
    actions:
      - id: select-phone
        type: editor.select
        at: { mark: select-phone }
        target: { file: index.html, text: 'class="is-invalid"', occurrence: 1 }
      - id: type-error
        type: editor.type
        at: { mark: type-error }
        cadence: block
        target: { file: index.html, after: 'data-testid="input-phone" />', occurrence: 1 }
        text: "\n        <p class=\"error\">⚠ 09 နဲ့ စပါ</p>"
      - id: scroll-to-form
        type: preview.scroll
        at: { mark: after-error }
        timeoutMs: 5000
        top: 5000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-error-text
        type: expect.preview
        at: { afterAction: scroll-to-form }
        timeoutMs: 5000
        target: { by: testId, value: order-form }
        textContains: "⚠ 09 နဲ့ စပါ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-border-still-passes
        type: expect.preview
        at: { afterAction: expect-error-text }
        timeoutMs: 5000
        target: { by: testId, value: contrast-input-phone }
        attribute: { name: data-aa, value: "pass" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: media-queries
    chapter: "User ရဲ့ setting ကို လိုက်ရအောင်"
    narration: >
      [[mark:board-mq]] နောက်ဆုံးအနေနဲ့၊ user ရွေးထားတဲ့ setting ကို လိုက်ပေးတဲ့ media query နှစ်ခု
      ရှိပါတယ်။ [[mark:draw-scheme]] prefers color scheme က user ရဲ့ device မှာ dark mode ရွေးထားလား
      စစ်ပါတယ်။ အလင်း စူးရင် မျက်စိ ကျိန်းတဲ့ သူတွေအတွက် dark theme ကို ဒီ query ထဲမှာ
      ရေးပေးနိုင်ပါတယ်။ [[mark:draw-contrast]] prefers contrast ကတော့ user က contrast
      ပိုမြင့်ချင်တယ်လို့ setting မှာ ဖွင့်ထားလား စစ်ပါတယ်။ contrast ခွဲခြားရ ခက်တဲ့ သူတွေအတွက်
      အရောင်တွေကို ပိုရင့်ပေးလို့ ရပါတယ်။ contrast လျှော့ချင်သူအတွက် less တန်ဖိုးလည်း ရှိပါတယ်။
      [[mark:draw-layers]] query နှစ်ခုကို တွဲသုံးရင်၊ အလင်းနဲ့ အမှောင်၊ contrast ပုံမှန်နဲ့ contrast
      မြင့် ဆိုပြီး ပေါင်းစပ်မှု လေးမျိုးလုံးအတွက် သီးသန့် ရေးပေးနိုင်ပါတယ်။ [[mark:draw-limit]]
      ဒါပေမဲ့ lesson ထဲက preview က ကွန်ပျူတာရဲ့ setting ကို ပြောင်းလို့ မရလို့၊ ဒီ query တွေရဲ့
      ရလဒ်ကို ဒီမှာ ပြလို့ မရပါဘူး။ code ကိုပဲ ကြည့်ရအောင်။
    sources:
      - title: "web.dev Learn Accessibility — Color and contrast (Color-focused media queries)"
        url: "https://web.dev/learn/accessibility/color-contrast"
      - title: "MDN — prefers-color-scheme"
        url: "https://developer.mozilla.org/docs/Web/CSS/@media/prefers-color-scheme"
      - title: "MDN — prefers-contrast"
        url: "https://developer.mozilla.org/docs/Web/CSS/@media/prefers-contrast"
    actions:
      - id: board-mq
        type: whiteboard.apply
        at: { mark: board-mq }
        open: true
        clear: true
        upsertIds: [d-title]
      - id: draw-scheme
        type: whiteboard.apply
        at: { mark: draw-scheme }
        upsertIds: [d-scheme, d-scheme-who]
        drawMs: 2200
      - id: draw-contrast
        type: whiteboard.apply
        at: { mark: draw-contrast }
        upsertIds: [d-contrast, d-contrast-who]
        drawMs: 2200
      - id: draw-layers
        type: whiteboard.apply
        at: { mark: draw-layers }
        upsertIds:
          [
            d-box-1,
            d-box-1-text,
            d-box-2,
            d-box-2-text,
            d-box-3,
            d-box-3-text,
            d-box-4,
            d-box-4-text,
          ]
        drawMs: 3200
      - id: draw-limit
        type: whiteboard.apply
        at: { mark: draw-limit }
        upsertIds: [d-limit]
        drawMs: 1400

  - id: contrast-rule
    narration: >
      [[mark:close-mq]] contrast မြင့်ချင်တဲ့ user အတွက် rule တစ်ခု ရေးကြည့်ရအောင်။
      [[mark:open-styles-mq]] styles ဖိုင်ရဲ့ အောက်ဆုံးမှာ media query တစ်ခု ထည့်ပါမယ်။
      [[mark:type-mq]] user က contrast မြင့်တဲ့ setting ကို ဖွင့်ထားမှသာ၊ ခုနက စာသား နှစ်ခုကို
      အမည်းရောင် ပေးမယ့် rule ပါ။ ကျန်တဲ့ user တွေအတွက်တော့ ဘာမှ မပြောင်းပါဘူး။
      [[mark:select-query]] ဒီ query အပိုင်းက အဲဒီ setting ကို စစ်တဲ့ နေရာပါ။ panel ကတော့
      ခုနက ratio အတိုင်းပဲ ပြနေပါတယ်။ ကိုယ့် ကွန်ပျူတာမှာ contrast တိုးတဲ့ setting ကို ဖွင့်ပြီး
      ဒီလို rule ပါတဲ့ page ကို ကြည့်ရင်တော့၊ စာသား နှစ်ခု အမည်း ဖြစ်သွားတာ တွေ့ရပါလိမ့်မယ်။ dark mode ကိုလည်း ဒီ ပုံစံအတိုင်း prefers color scheme နဲ့ ရေးရပါတယ်။
    sources:
      - title: "MDN — prefers-contrast"
        url: "https://developer.mozilla.org/docs/Web/CSS/@media/prefers-contrast"
      - title: "MDN — prefers-color-scheme"
        url: "https://developer.mozilla.org/docs/Web/CSS/@media/prefers-color-scheme"
      - title: "web.dev Learn Accessibility — Color and contrast (Prefers contrast)"
        url: "https://web.dev/learn/accessibility/color-contrast"
    actions:
      - id: close-mq
        type: whiteboard.apply
        at: { mark: close-mq }
        open: false
      - id: open-styles-mq
        type: workspace.openFile
        at: { mark: open-styles-mq }
        path: styles.css
      - id: type-mq
        type: editor.type
        at: { mark: type-mq }
        cadence: line-by-line
        target: { file: styles.css, after: "  text-decoration: underline;\n}\n", occurrence: 1 }
        text: "\n@media (prefers-contrast: more) {\n  .lead,\n  .menu-card .desc {\n    color: black;\n  }\n}\n"
      - id: select-query
        type: editor.select
        at: { mark: select-query }
        target: { file: styles.css, text: "(prefers-contrast: more)", occurrence: 1 }
      - id: expect-lead-unchanged
        type: expect.preview
        at: { afterAction: select-query }
        timeoutMs: 5000
        target: { by: testId, value: contrast-hero-lead }
        attribute: { name: data-ratio, value: "6.72" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-mq-file
        type: expect.file
        at: { afterAction: expect-lead-unchanged }
        path: styles.css
        contains: "@media (prefers-contrast: more) {"

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:sel-color]] ဒါဆို ပြန်ချုပ်ရရင်၊ contrast ratio က စာလုံးနဲ့ နောက်ခံ အရောင်
      နှစ်ခုရဲ့ အလင်း အမှောင် ကွာခြားမှုပါ။ ပုံမှန် စာသားအတွက် ၄.၅ နဲ့ ၁၊ စာလုံး အကြီးနဲ့
      ခလုတ်ဘောင်လို အရာတွေအတွက် ၃ နဲ့ ၁ လိုပါတယ်။ [[mark:sel-underline]] ပြီးတော့ အရောင်
      တစ်ခုတည်းနဲ့ အဓိပ္ပာယ် မပြောဘဲ၊ underline၊ စာသား၊ icon လို အမှတ်အသား တစ်ခု အမြဲ
      တွဲပေးရပါမယ်။ [[mark:sel-mq]] user က ကိုယ်တိုင် ရွေးထားတဲ့ dark mode နဲ့ contrast setting
      ကိုလည်း media query နဲ့ လိုက်ပေးနိုင်ပါတယ်။ နောက် lesson မှာတော့ animation နဲ့ motion က
      တချို့ user တွေကို ဘယ်လို အခက်အခဲ ဖြစ်စေလဲ၊ user ကို ဘယ်လို ရွေးခွင့် ပေးမလဲ ဆိုတာ
      ကြည့်သွားပါမယ်။
    sources:
      - title: "web.dev Learn Accessibility — Color and contrast"
        url: "https://web.dev/learn/accessibility/color-contrast"
      - title: "WCAG 2.2 — Understanding 1.4.3 Contrast (Minimum)"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum.html"
    actions:
      - id: sel-color
        type: editor.select
        at: { mark: sel-color }
        target: { file: styles.css, text: "color: saddlebrown;", occurrence: 1 }
      - id: sel-underline
        type: editor.select
        at: { mark: sel-underline }
        target: { file: styles.css, text: "text-decoration: underline;", occurrence: 1 }
      - id: sel-mq
        type: editor.select
        at: { mark: sel-mq }
        target: { file: styles.css, text: "@media (prefers-contrast: more)", occurrence: 1 }
      - id: expect-color-file
        type: expect.file
        at: { afterAction: sel-mq }
        path: styles.css
        contains: ".lead,\n.menu-card .desc {\n  color: saddlebrown;\n}"

checks:
  - { type: timing.p95Ms, max: 300 }
