          at: { mark: k-one },
          upsertIds: [k-circle, k-one],
          drawMs: 1500,
        }

  - id: audit
    chapter: Module audit
    narration: >
      [[mark:a-close]] module တစ်ခုကို စစ်ဖို့ မေးခွန်း သုံးခု ရပါပြီ။ ဘာကို ဖုံးထားလဲ၊ အထဲက အရာတွေ
      ဆိုင်ကြလား၊ ဘယ်သူတွေ မှီခိုနေလဲ ဆိုတာပါ။ အဲဒီ အဖြေတွေကနေ ဘာဆက်လုပ်မလဲ ဆိုတဲ့ ဆုံးဖြတ်ချက် ထွက်လာပါတယ်။
      [[mark:a-sel]] ဒီ သုံးခုနဲ့ ခရီးဖော် ရဲ့ module တွေကို တစ်ခုချင်း စစ်ပြီး table တစ်ခုထဲ ချရေးကြည့်ရအောင်။
      [[mark:type-utils]] ပထမဆုံး utils ပါ။ သူက ဘာကိုမှ ဖုံးမထားသလို၊ အထဲက အရာတွေကလည်း တစ်ခုနဲ့တစ်ခု
      မဆိုင်ကြပါဘူး။ မှီခိုနေသူကတော့ ကျန်တဲ့ သုံးခုလုံးပါ။ ဒါကြောင့် ဆုံးဖြတ်ချက်က အထဲက code တွေကို
      အဓိပ္ပာယ်အလိုက် ခွဲထုတ်ဖို့ပါ။
      [[mark:type-payment]] ဒုတိယက Payment ပါ။ wallet API ကို ဘယ်လို ခေါ်လဲ ဆိုတာကို သူက ဖုံးထားပေးပြီး၊
      မှီခိုနေသူက Booking တစ်ခုတည်းပါ။ ပြင်ရမှာက Booking နဲ့ ဖြစ်နေတဲ့ cycle ကို ဖြတ်ဖို့ပါ။ Payment က
      ငွေဖြတ်ပြီးပြီ ဆိုတဲ့ ရလဒ်ကိုပဲ ပြန်ပေးပြီး၊ လက်မှတ် ထုတ်တာကို Booking က ကိုယ်တိုင် ဆက်လုပ်လိုက်ရင် မြားက
      တစ်ဖက်တည်းပဲ ကျန်ပါတော့မယ်။
      [[mark:type-report]] တတိယက Report ပါ။ ရောင်းအားကို ဘယ်လို တွက်လဲ ဆိုတာကို ဖုံးထားပြီး၊ သူ့ကို
      မှီခိုနေသူလည်း မရှိပါဘူး။ ဒီအတိုင်း ထားလို့ ရပါတယ်။ ပြင်စရာ မလိုတာကို မလိုဘူးလို့ ရေးထားတာလည်း ဒီလို စစ်ဆေးတာရဲ့ အသုံးဝင်တဲ့ ရလဒ် တစ်ခုပါ။
    sources:
      - {
          title: "Balancing Coupling in Software Design (Khononov)",
          url: "https://www.informit.com/store/balancing-coupling-in-software-design-universal-design-9780137353484",
        }
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - { id: close-k, type: whiteboard.apply, at: { mark: a-close }, open: false }
      - {
          id: open-notebook,
          type: workspace.openFile,
          at: { afterAction: close-k },
          path: notebook/07-module-audit.md,
        }
      - id: sel-questions
        type: editor.select
        at: { mark: a-sel }
        target:
          {
            file: notebook/07-module-audit.md,
            text: "မေးခွန်း 3 ခု: ဘာကို ဖုံးထားလဲ · အထဲက ဆိုင်ကြလား · ဘယ်သူတွေ မှီခိုနေလဲ",
          }
      - id: type-utils
        type: editor.type
        at: { mark: type-utils }
        cadence: line-by-line
        target: { file: notebook/07-module-audit.md, after: "|---|---|---|---|\n" }
        text: "| utils | ဘာမှ မဖုံး (4,000 lines) | Booking, Payment, Report | အဓိပ္ပာယ်အလိုက် ခွဲထုတ်မယ် |\n"
      - id: type-payment
        type: editor.type
        at: { mark: type-payment }
        cadence: line-by-line
        target: { file: notebook/07-module-audit.md, after: "| အဓိပ္ပာယ်အလိုက် ခွဲထုတ်မယ် |\n" }
        text: "| Payment | wallet API ခေါ်ပုံ | Booking | Booking နဲ့ cycle ကို ဖြတ်မယ် |\n"
      - id: type-report
        type: editor.type
        at: { mark: type-report }
        cadence: line-by-line
        target: { file: notebook/07-module-audit.md, after: "| Booking နဲ့ cycle ကို ဖြတ်မယ် |\n" }
        text: "| Report | ရောင်းအား တွက်ပုံ | မရှိ | ဒီအတိုင်း ထားမယ် |\n"
      - id: expect-utils
        type: expect.file
        at: { afterAction: type-report }
        path: notebook/07-module-audit.md
        contains: "| utils | ဘာမှ မဖုံး (4,000 lines) | Booking, Payment, Report | အဓိပ္ပာယ်အလိုက် ခွဲထုတ်မယ် |\n"

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ ထိုင်ခုံကို ၁၀ မိနစ် ထိန်းထားမယ် ဆိုတဲ့ စည်းမျဉ်းကို ဘယ်မှာ
      ထားသင့်လဲ။
      [[mark:q-a]] ပထမ ရွေးစရာက utils ထဲမှာ တန်ဖိုး တစ်ခုအဖြစ် ထားတာပါ။ ဘယ် code ကမဆို အဲဒီကနေ ယူသုံးလို့
      ရပါမယ်။
      [[mark:q-b]] ဒုတိယ ရွေးစရာကတော့ ထိုင်ခုံရဲ့ အခြေအနေနဲ့ ဆိုင်တာ မှန်သမျှကို ပိုင်တဲ့ module တစ်ခုထဲမှာ
      ထားတာပါ။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ တစ်ခုပါ။ ဘာကြောင့်လဲဆိုတော့ ၁၀ မိနစ် ဆိုတဲ့ တန်ဖိုးက သူ့ချည်းသက်သက်
      ရပ်တည်နေတာ မဟုတ်လို့ပါ။ ခုံကို ဘယ်အချိန် စထိန်းမလဲ၊ အချိန်ကျော်ရင် ဘယ်လို ပြန်လွှတ်မလဲ၊ ငွေချေပြီးရင်
      ဘာဖြစ်မလဲ ဆိုတဲ့ စည်းမျဉ်းတွေနဲ့ အတူတူ ပြောင်းတတ်ပါတယ်။ utils ထဲမှာ ထားလိုက်ရင် တန်ဖိုးကတော့ တစ်နေရာတည်း
      ဖြစ်သွားပါတယ်။ ဒါပေမဲ့ အဲဒီ တန်ဖိုးကို ယူပြီး အချိန် တွက်တဲ့ code တွေက ငါးနေရာမှာပဲ ကျန်နေဦးမှာပါ။
      [[mark:q-test]] အတူ ပြောင်းတတ်တဲ့ အရာတွေကို အတူ ထားတာက အဓိပ္ပာယ်အရ ဖြစ်လာတဲ့ cohesion ပါ။ ထိုင်ခုံ module
      က ခုံကို ထိန်းပေးပါ၊ ပြန်လွှတ်ပေးပါ ဆိုတာလောက်ကိုပဲ အပြင်ကို ပြပြီး၊ ၁၀ မိနစ် ဆိုတာကိုတော့ အထဲမှာ
      ဖုံးထားလိုက်ရင် နက်တဲ့ module တစ်ခု ရပါပြီ။
    sources:
      - {
          title: "Balancing Coupling in Software Design (Khononov)",
          url: "https://www.informit.com/store/balancing-coupling-in-software-design-universal-design-9780137353484",
        }
      - {
          title: "The Pragmatic Programmer, 20th Anniversary Edition (Thomas, Hunt)",
          url: "https://pragprog.com/titles/tpp20",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-test,
          type: whiteboard.apply,
          at: { mark: q-test },
          upsertIds: [q-t1, q-t2],
          drawMs: 1600,
        }

  - id: your-turn
    chapter: ကိုယ့် code အတွက်
    narration: >
      [[mark:turn]] ဒီ အဖြေကို table ထဲမှာ နောက်ဆုံး တစ်ကြောင်းအဖြစ် ထည့်လိုက်ပါမယ်။
      [[mark:type-seat]] Seat inventory ဆိုတဲ့ module အသစ် တစ်ခု ဆောက်ပြီး၊ ငါးနေရာမှာ ပြန့်နေတဲ့ ထိုင်ခုံ စည်းမျဉ်းတွေကို
      အဲဒီထဲမှာ စုပါမယ်။ app ဘက်ကရော ကောင်တာဘက်ကရော သူ့ကိုပဲ ခေါ်သုံးရမှာမို့၊ ဝင်လာတဲ့ မြား များမယ့် module
      ပါ။ ဒါကြောင့် သူ့ရဲ့ interface ကို သေသေချာချာ စဉ်းစားပြီး တည်ငြိမ်အောင် ထားရပါမယ်။
      [[mark:turn-you]] အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ကိုယ့် project ထဲက module တစ်ခုကို
      ရွေးပါ။ ပြီးရင် ဒီ table ထဲမှာ တစ်ကြောင်း ထပ်ဖြည့်ပြီး မေးခွန်း သုံးခုကို ဖြေကြည့်ပါ။
      [[mark:turn-2]] အများဆုံး ပြင်နေရတဲ့ file ကနေ စရွေးရင် အကျိုး အရှိဆုံးပါ။ ဖုံးထားတာ ဆိုတဲ့ အကွက်မှာ
      ဘာရေးရမလဲ စဉ်းစားလို့ မရဘူးဆိုရင်၊ အဲဒါကိုက တွေ့ရှိချက် တစ်ခုပါပဲ။
    sources:
      - {
          title: "Balancing Coupling in Software Design (Khononov)",
          url: "https://www.informit.com/store/balancing-coupling-in-software-design-universal-design-9780137353484",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: turn }, open: false }
      - id: type-seat
        type: editor.type
        at: { mark: type-seat }
        cadence: line-by-line
        target:
          {
            file: notebook/07-module-audit.md,
            after: "| Report | ရောင်းအား တွက်ပုံ | မရှိ | ဒီအတိုင်း ထားမယ် |\n",
          }
        text: "| Seat inventory (အသစ်) | ထိုင်ခုံ state၊ hold 10 မိနစ် | app, ကောင်တာ | module အသစ် ဆောက်မယ် |\n"
      - id: sel-turn
        type: editor.select
        at: { mark: turn-you }
        target:
          { file: notebook/07-module-audit.md, text: "| Module | ဖုံးထားတာ | မှီခိုနေသူ | ဆုံးဖြတ်ချက် |" }

  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ code ကို folder ခွဲထားရုံနဲ့ module မဖြစ်ပါဘူး။ module ဆိုတာ အတူ
      ပြောင်းတတ်တဲ့ အရာတွေကို စုထားပြီး၊ ပြောင်းဖို့ များတဲ့ ဆုံးဖြတ်ချက်တွေကို interface သေးသေးလေးရဲ့ နောက်မှာ
      ဖုံးထားပေးတဲ့ အပိုင်းပါ။ အထဲကို ကြည့်ရင် cohesion၊ အပြင်ကို ကြည့်ရင် coupling ဆိုပြီး နှစ်ဖက်လုံးက
      စစ်ရပါတယ်။ ဝင်လာတဲ့ မြား များတဲ့ module က တည်ငြိမ်ရမယ်၊ cycle ဖြစ်နေတဲ့ module နှစ်ခုကတော့ တကယ်တော့
      တစ်ခုတည်းပါ။
      [[mark:next]] နောက် lesson မှာတော့ system တစ်ခုက ဘာကြောင့် ရှုပ်ထွေးလာရတာလဲ၊ complexity ဆိုတာ ဘယ်က
      လာတာလဲ ဆိုတာကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "Balancing Coupling in Software Design (Khononov)",
          url: "https://www.informit.com/store/balancing-coupling-in-software-design-universal-design-9780137353484",
        }
