  seed: 8107

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: need
    chapter: ငါးနေရာမှာ ပြန့်နေတဲ့ စည်းမျဉ်း
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ ဆုံးဖြတ်ချက်တွေကို ပြန်ပြင်ရင် ဘယ်လောက် ကုန်ကျမလဲ ဆိုတာနဲ့ ခွဲကြည့်ပြီး၊ tracer
      bullet နဲ့ prototype ကို သုံးပြီး risk လျှော့တာကို လေ့လာခဲ့ပါတယ်။
      [[mark:folders]] ခရီးဖော် ရဲ့ code ထဲမှာ folder ကြီး သုံးခု ရှိပါတယ်။ controllers၊ models နဲ့ utils
      ပါ။
      [[mark:utils-big]] အဲဒီထဲက utils က စာကြောင်းရေ ၄၀၀၀ လောက် ရှိနေပါပြီ။ ဘယ်မှာ ထားရမှန်း မသိတဲ့ code
      မှန်သမျှ အဲဒီထဲကို ရောက်သွားတာပါ။
      [[mark:five]] သင်္ကြန် ဖြစ်ရပ် ပြီးတော့ ကိုယ်နဲ့ team ထဲက developer မောင်မောင် က ထိုင်ခုံနဲ့ ဆိုင်တဲ့
      စည်းမျဉ်းတွေ ဘယ်မှာ ရှိလဲ ဆိုတာ လိုက်ရှာကြည့်ကြပါတယ်။ ထိုင်ခုံ တစ်ခုံက ဘယ်အချိန်မှာ လွတ်တယ်၊ ဘယ်အချိန်မှာ
      ခဏ ထိန်းထားတယ်၊ ဘယ်အချိန်မှာ ရောင်းပြီးသား ဖြစ်တယ် ဆိုတာတွေကို ဆုံးဖြတ်ပေးတဲ့ code တွေပါ။
      [[mark:five-places]] တွေ့ရတာက တစ်နေရာတည်းမှာ မဟုတ်ဘဲ ငါးနေရာမှာ ပြန့်နေတာပါ။ controllers ထဲမှာ
      နှစ်နေရာ၊ models ထဲမှာ တစ်နေရာ၊ utils ထဲမှာ နှစ်နေရာပါ။ စည်းမျဉ်း တစ်ခုကို ပြင်ချင်ရင် ငါးနေရာလုံးကို
      မှတ်မိမှ ရပါမယ်။ တစ်နေရာ ကျန်ခဲ့တာနဲ့ bug ဖြစ်ပါပြီ။
      [[mark:ask]] ဒါဆို code တွေကို ဘယ်လို အုပ်စုဖွဲ့ထားသင့်လဲ။ folder ခွဲထားရုံနဲ့ မလုံလောက်ဘူး ဆိုတာတော့
      သေချာနေပါပြီ။
    sources:
      - {
          title: "Balancing Coupling in Software Design (Khononov)",
          url: "https://www.informit.com/store/balancing-coupling-in-software-design-universal-design-9780137353484",
        }
    actions:
      - {
          id: draw-folders,
          type: whiteboard.apply,
          at: { mark: folders },
          open: true,
          upsertIds: [n-c, n-c-l, n-m, n-m-l, n-u, n-u-l],
          drawMs: 2400,
        }
      - {
          id: draw-utils-size,
          type: whiteboard.apply,
          at: { mark: utils-big },
          upsertIds: [n-u-size],
          drawMs: 700,
        }
      - {
          id: draw-n-title,
          type: whiteboard.apply,
          at: { mark: five },
          upsertIds: [n-title],
          drawMs: 1000,
        }
      - {
          id: draw-five,
          type: whiteboard.apply,
          at: { mark: five-places },
          upsertIds: [n-r1, n-r2, n-r3, n-r4, n-r5],
          drawMs: 2000,
        }
      - { id: draw-n-q, type: whiteboard.apply, at: { mark: ask }, upsertIds: [n-q], drawMs: 900 }

  - id: module
    chapter: Module က ဘာကို ဖုံးထားလဲ
    narration: >
      [[mark:m-open]] code ကို အုပ်စုဖွဲ့တဲ့ အခြေခံ အပိုင်းကို module လို့ ခေါ်ပါတယ်။ module ဆိုတာ အတူတူ
      ပြောင်းလဲတတ်တဲ့ code တွေကို စုထားပြီး၊ အပြင်က သိစရာ မလိုတဲ့ အသေးစိတ်တွေကို ဖုံးထားပေးတဲ့ အပိုင်းပါ။
      function တစ်ခုကနေ service တစ်ခုလုံးအထိ ဘယ်အရွယ်မဆို module ဖြစ်နိုင်ပါတယ်။ အရွယ်အစားက အဓိက မဟုတ်ဘဲ၊ ဘာကို ဖုံးထားလဲ ဆိုတာက အဓိကပါ။
      [[mark:m-deep-if]] ဥပမာ ငွေချေတဲ့ အပိုင်းကို စဉ်းစားကြည့်ရအောင်။ ကျန်တဲ့ code တွေက သူ့ကို ပြောစရာ
      တစ်ခုပဲ ရှိပါတယ်။ ဒီ booking အတွက် ငွေ ဘယ်လောက် ဖြတ်ပေးပါ ဆိုတာပါ။ အဲဒီလို အပြင်ကနေ မြင်ရတဲ့ အပိုင်းကို
      interface လို့ ခေါ်ပါတယ်။ အပိုင်း နှစ်ခုကြားမှာ သဘောတူထားတဲ့ ပုံစံပါပဲ။
      [[mark:m-deep-body]] အထဲမှာတော့ အလုပ်တွေ အများကြီး ရှိပါတယ်။ wallet ကုမ္ပဏီရဲ့ API ကို ဘယ်လို ခေါ်ရလဲ၊
      အဖြေ မလာရင် ဘယ်နှခါ ပြန်ကြိုးစားမလဲ၊ ငွေဖြတ်ပြီးမှ တစ်ခုခု ပျက်သွားရင် ဘယ်လို ပြန်ပြင်မလဲ ဆိုတာတွေပါ။
      ဒါတွေက နောက်ပိုင်းမှာ ပြောင်းဖို့ များတဲ့ ဆုံးဖြတ်ချက်တွေပါ။ wallet အသစ် တစ်ခု ထပ်ထည့်လိုက်ရင်တောင်
      အပြင်က code တွေ ဘာမှ သိစရာ မလိုပါဘူး။
      [[mark:m-deep-name]] interface က သေးသေးလေး၊ ဖုံးထားတာက အများကြီး ဖြစ်နေတဲ့ ဒီလို module မျိုးကို နက်တဲ့
      module လို့ ခေါ်ကြပါတယ်။
      [[mark:m-shallow]] ဆန့်ကျင်ဘက်ကတော့ တိမ်တဲ့ module ပါ။ ခရီးဖော် ရဲ့ models ထဲက ခရီးစဉ် code ကို ကြည့်ပါ။
      table ထဲက column တွေကို ဖတ်တာနဲ့ ရေးတာပဲ လုပ်ပေးပါတယ်။ ခေါ်သုံးတဲ့ဘက်က column နာမည်တွေကို သိရမယ်၊
      status ထဲက နံပါတ် ၂ ဆိုတာ ခရီးစဉ် ဖျက်လိုက်တာကို ဆိုလိုတယ် ဆိုတာလည်း သိရပါမယ်။
      [[mark:m-shallow-name]] interface က အထဲမှာ ရှိသမျှနဲ့ အရွယ် တူနေတော့ ဘာကိုမှ ဖုံးမထားပါဘူး။ table ရဲ့
      ပုံစံ နည်းနည်း ပြောင်းတာနဲ့ ခေါ်သုံးထားတဲ့ နေရာ အားလုံးမှာ လိုက်ပြင်ရပါတယ်။
      [[mark:m-point]] ဒါကြောင့် module တစ်ခုကို အကဲဖြတ်ချင်ရင် ပထမဆုံး မေးရမယ့် မေးခွန်းက၊ ဒီ module က
      ဘာကို ဖုံးထားပေးလဲ ဆိုတာပါ။ ဘာမှ ဖုံးမထားရင် အဲဒါက code တွေ စုထားတဲ့ နေရာ တစ်ခုပဲ ဖြစ်ပါတယ်။
    sources:
      - {
          title: "Balancing Coupling in Software Design (Khononov)",
          url: "https://www.informit.com/store/balancing-coupling-in-software-design-universal-design-9780137353484",
        }
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - {
          id: draw-m-open,
          type: whiteboard.apply,
          at: { mark: m-open },
          clear: true,
          upsertIds: [m-title],
        }
      - {
          id: draw-deep-if,
          type: whiteboard.apply,
          at: { mark: m-deep-if },
          upsertIds: [dp-if, dp-if-l],
          drawMs: 1200,
        }
      - {
          id: draw-deep-body,
          type: whiteboard.apply,
          at: { mark: m-deep-body },
          upsertIds: [dp-body, dp-l1, dp-l2, dp-l3],
          drawMs: 2400,
        }
      - {
          id: draw-deep-cap,
          type: whiteboard.apply,
          at: { mark: m-deep-name },
          upsertIds: [dp-cap],
          drawMs: 800,
        }
      - {
          id: draw-shallow,
          type: whiteboard.apply,
          at: { mark: m-shallow },
          upsertIds: [sh-if, sh-l1, sh-l2, sh-body, sh-body-l],
          drawMs: 2400,
        }
      - {
          id: draw-shallow-cap,
          type: whiteboard.apply,
          at: { mark: m-shallow-name },
          upsertIds: [sh-cap],
          drawMs: 800,
        }
      - {
          id: point-deep,
          type: whiteboard.point,
          at: { mark: m-point },
          target: { assetId: dp-body },
        }

  - id: cohesion
    chapter: Cohesion — အထဲကို ကြည့်ခြင်း
    narration: >
      [[mark:c-open]] ဒုတိယ မေးခွန်းက module ရဲ့ အထဲကို ကြည့်တာပါ။ အထဲမှာ ရှိတဲ့ အရာတွေက တစ်ခုနဲ့တစ်ခု တကယ်
      ဆိုင်ကြရဲ့လား ဆိုတာပါ။ ဒါကို cohesion လို့ ခေါ်ပါတယ်။
      [[mark:c-items]] utils ကို ဖွင့်ကြည့်ရအောင်။ ရက်စွဲကို စာသားအဖြစ် ပြောင်းပေးတဲ့ function တွေ ရှိတယ်၊
      ဈေးနှုန်း တွက်တဲ့ function တွေ ရှိတယ်၊ ခရီးသည်ဆီ ပို့မယ့် SMS စာသားကို စီပေးတဲ့ code ရှိတယ်၊ ထိုင်ခုံ
      လွတ်မလွတ် စစ်တဲ့ code လည်း ရှိပါတယ်။
      [[mark:c-why]] ဒီ လေးမျိုးက ဘာကြောင့် အတူတူ ရှိနေတာလဲလို့ မေးရင်၊ ထားစရာ တခြားနေရာ မရှိလို့ ဆိုတဲ့
      အဖြေပဲ ရပါတယ်။ အဓိပ္ပာယ်အရ ဆိုင်လို့ မဟုတ်ဘဲ၊ တိုက်ဆိုင်လို့ အတူ ရှိနေကြတာပါ။
      [[mark:c-test]] cohesion ရှိမရှိ စစ်ဖို့ နည်း နှစ်ခု ရှိပါတယ်။ ပထမ နည်းက ဒီ module က ဘာလုပ်ပေးလဲ
      ဆိုတာကို စာကြောင်း တစ်ကြောင်းတည်းနဲ့ ပြောကြည့်တာပါ။ ဒါလည်း လုပ်တယ်၊ ဟိုဟာလည်း လုပ်တယ်၊ နောက်ပြီး ဒါလည်း
      ပါသေးတယ် ဆိုပြီး ဆက်နေရရင် cohesion နည်းနေပါပြီ။ ဒုတိယ နည်းကတော့ အထဲက အရာတွေက အကြောင်းရင်း တစ်ခုတည်းကြောင့်
      ပြောင်းကြတာလား ဆိုတာကို ကြည့်တာပါ။
      [[mark:c-change]] utils မှာဆိုရင် product manager လှလှ က discount အသစ် တောင်းတိုင်း ဈေးနှုန်း code ကို
      ပြင်ရပါတယ်။ SMS စာသား ပြောင်းချင်တိုင်းလည်း ပြင်ရပါတယ်။ ဆိုတော့ အပတ်တိုင်း တစ်ယောက်မဟုတ် တစ်ယောက်က utils
      ကို ပြင်နေရပြီး၊ မဆိုင်တဲ့ code တွေပါ အတူ ထိခိုက်နိုင်ပါတယ်။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
      - {
          title: "Balancing Coupling in Software Design (Khononov)",
          url: "https://www.informit.com/store/balancing-coupling-in-software-design-universal-design-9780137353484",
        }
    actions:
      - {
          id: draw-c-open,
          type: whiteboard.apply,
          at: { mark: c-open },
          clear: true,
          upsertIds: [c-title],
          drawMs: 900,
        }
      - {
          id: draw-c-items,
          type: whiteboard.apply,
          at: { mark: c-items },
          upsertIds: [c-box, c-box-l, c-i1, c-i2, c-i3, c-i4],
          drawMs: 3000,
        }
      - {
          id: draw-c-concl,
          type: whiteboard.apply,
          at: { mark: c-why, offsetMs: 2500 },
          upsertIds: [c-concl],
          drawMs: 1000,
        }
      - {
          id: draw-c-test,
          type: whiteboard.apply,
          at: { mark: c-change },
          upsertIds: [c-test],
          drawMs: 1000,
        }

  - id: coupling
    chapter: Coupling — အပြင်ကို ကြည့်ခြင်း
    narration: >
      [[mark:k-open]] တတိယ မေးခွန်းက module ရဲ့ အပြင်ကို ကြည့်တာပါ။ module တစ်ခုက အလုပ်လုပ်နိုင်ဖို့ နောက် module
      တစ်ခုအကြောင်း ဘယ်လောက် သိထားရလဲ ဆိုတာကို coupling လို့ ခေါ်ပါတယ်။ ခရီးဖော် ရဲ့ code ကို folder အလိုက်
      မကြည့်ဘဲ လုပ်ငန်းအလိုက် ကြည့်လိုက်ရင် အစု လေးခုကို တွေ့ရပါတယ်။
      [[mark:k-boxes]] လက်မှတ် ရောင်းတဲ့ Booking၊ ငွေချေတဲ့ Payment၊ ရောင်းအားကို တွက်ပြတဲ့ Report နဲ့ အားလုံးက
      ယူသုံးနေတဲ့ utils ပါ။
      [[mark:k-arrows]] တစ်ခုက နောက်တစ်ခုကို ခေါ်သုံးထားတိုင်း မြား တစ်ချောင်း ဆွဲကြည့်ပါ။ Booking၊ Payment နဲ့
      Report သုံးခုလုံးက utils ကို ခေါ်သုံးနေကြပါတယ်။
      [[mark:k-in]] ဆိုတော့ utils ဆီ ဝင်လာတဲ့ မြားက သုံးချောင်း ရှိပါတယ်။ ဝင်လာတဲ့ မြား များတယ် ဆိုတာ အဲဒီ
      module ကို မှီခိုနေသူ များတယ်လို့ ဆိုလိုတာပါ။ အဲဒီလို module မျိုးက တည်ငြိမ်နေဖို့ လိုပါတယ်။ သူ
      ပြောင်းလိုက်တိုင်း မှီခိုနေသူ အားလုံးကို ပြန်စစ်ရလို့ပါ။ ဒါပေမဲ့ utils က အပတ်တိုင်း ပြောင်းနေတဲ့ module
      ဖြစ်နေပါတယ်။ အများဆုံး မှီခိုခံရတဲ့ အပိုင်းက အများဆုံး ပြောင်းနေတာမို့၊ အန္တရာယ် အများဆုံး နေရာပါပဲ။
      [[mark:k-zero]] Report ကို ကြည့်ရင်တော့ ဝင်လာတဲ့ မြား တစ်ချောင်းမှ မရှိပါဘူး။ သူ့ကို ဘယ် module ကမှ
      မမှီခိုတော့၊ ပြင်လိုက်လည်း တခြား module တွေကို မထိခိုက်ပါဘူး။
      [[mark:k-cycle]] နောက်ထပ် သတိထားစရာ တစ်ခု ကျန်ပါသေးတယ်။
      [[mark:k-go]] Booking က ငွေဖြတ်ဖို့အတွက် Payment ကို ခေါ်ပါတယ်။
      [[mark:k-back]] Payment ကလည်း ငွေဖြတ်ပြီးတဲ့အခါ လက်မှတ် ထုတ်ပေးဖို့ Booking ကို ပြန်ခေါ်ပါတယ်။
      [[mark:k-one]] ဒီလို မြားတွေ ကွင်းပတ်နေတာကို cycle လို့ ခေါ်ပါတယ်။ cycle ဖြစ်နေရင် တစ်ခုကို နားလည်ဖို့
      နောက်တစ်ခုကိုပါ ဖတ်ရတယ်၊ တစ်ခုကို test လုပ်ဖို့ နောက်တစ်ခုပါ လိုတယ်၊ တစ်ခုကို ပြင်ရင် နောက်တစ်ခုပါ
      ပျက်နိုင်ပါတယ်။ နာမည်က နှစ်ခု ဖြစ်နေပေမဲ့ တကယ်တော့ module တစ်ခုတည်းပါပဲ။
    sources:
      - {
          title: "Balancing Coupling in Software Design (Khononov)",
          url: "https://www.informit.com/store/balancing-coupling-in-software-design-universal-design-9780137353484",
        }
      - {
          title: "Building Evolutionary Architectures, 2nd edition (Ford, Parsons, Kua, Sadalage)",
          url: "https://oreil.ly/evolutionary-arch-2e",
        }
    actions:
      - {
          id: draw-k-open,
          type: whiteboard.apply,
          at: { mark: k-open },
          clear: true,
          upsertIds: [k-title],
          drawMs: 900,
        }
      - {
          id: draw-k-boxes,
          type: whiteboard.apply,
          at: { mark: k-boxes },
          upsertIds: [k-b, k-b-l, k-p, k-p-l, k-r, k-r-l, k-u, k-u-l],
          drawMs: 3200,
        }
      - {
          id: draw-k-arrows,
          type: whiteboard.apply,
          at: { mark: k-arrows, offsetMs: 2500 },
          upsertIds: [k-a1, k-a2, k-a3],
          drawMs: 1500,
        }
      - {
          id: draw-k-in,
          type: whiteboard.apply,
          at: { mark: k-in },
          upsertIds: [k-in3],
          drawMs: 900,
        }
      - {
          id: draw-k-zero,
          type: whiteboard.apply,
          at: { mark: k-zero },
          upsertIds: [k-in0],
          drawMs: 900,
        }
      - {
          id: clear-k,
          type: whiteboard.apply,
          at: { mark: k-cycle },
          clear: true,
          upsertIds: [k-b, k-b-l, k-p, k-p-l],
        }
      - {
          id: draw-k-go,
          type: whiteboard.apply,
          at: { mark: k-go },
          upsertIds: [k-c1],
          drawMs: 700,
        }
      - {
          id: draw-k-back,
          type: whiteboard.apply,
          at: { mark: k-back },
          upsertIds: [k-c2],
          drawMs: 700,
        }
      - {
          id: draw-k-one,
