          target: { assetId: r-mid-l },
        }

  - id: listed
    chapter: ဘယ် skill တွေ ရောက်နေလဲ
    narration: >
      [[mark:l-open]] ပြဿနာကို ရှာဖွေတဲ့အခါ ပထမဆုံး လုပ်ရမှာက ဘယ် skill တွေ တကယ် ရောက်နေလဲ ဆိုတာ ကြည့်တာပါ။ ဒီ screen မှာ Billing
      repository ထဲမှာ skills command ကို ဖွင့်ထားတာကို ဒီလို မြင်ရပါတယ်။
      [[mark:l-skill]] outage notice skill ကို project skill အနေနဲ့ ပြထားပါတယ်။ project၊ user နဲ့ plugin ကလာတဲ့ skill
      တွေကို ဒီ စာရင်းမှာ ပြတာမို့၊ developer ရဲ့ စက်မှာ ဒီ စာရင်းကို ကြည့်ရင် ဘယ်နေရာက skill လဲ ဆိုတာ ချက်ချင်း
      မြင်ရပါမယ်။
      [[mark:l-keys]] အပေါ်က စာကြောင်းမှာ key တွေကို ပြထားပါတယ်။ space key နဲ့ skill တစ်ခုချင်း ဘယ်လောက် မြင်ရမလဲ
      ပြောင်းလို့ရပြီး၊ t key နဲ့ token အလိုက် စီကြည့်လို့ ရပါတယ်။
      [[mark:l-size]] ဘေးက token ခန့်မှန်းချက်ကလည်း အသုံးဝင်ပါတယ်။ skill description တွေအတွက် နေရာက context window ရဲ့
      တစ်ရာခိုင်နှုန်းပဲ ရှိလို့ပါ။ skill တွေ များလာရင် description တွေ ပြတ်သွားနိုင်ပါတယ်။ context command မှာလည်း
      skill စာရင်းရဲ့ အရွယ်ကို ပြပြီး၊ recent version တွေမှာ skill doctor command က skill တစ်ခုစီရဲ့ ကုန်ကျမှုနဲ့
      ဘယ်တော့မှ မသုံးဖူးတဲ့ skill တွေကို ပြပေးပါတယ်။
    sources:
      - {
          title: "Claude Code Docs: Commands (skills, context, doctor)",
          url: "https://code.claude.com/docs/en/commands",
        }
      - {
          title: "Claude Code Docs: Debug your configuration",
          url: "https://code.claude.com/docs/en/debug-your-config",
        }
    actions:
      - {
          id: close-rings,
