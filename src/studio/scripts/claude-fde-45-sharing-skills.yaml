      - { id: point-l-size, type: slide.point, at: { mark: l-size }, target: { x: 0.34, y: 0.765 } }

  - id: table
    chapter: ပြဿနာကို ရှာဖွေတဲ့ ဇယား
    narration: >
      [[mark:d-open]] ဒါဆို Billing နဲ့ Network Tools အတွက် ဖြစ်နေတာ တစ်ခုကို ပထမဆုံး ဘာစစ်ရမလဲ ဆိုတဲ့ ဇယား ရေးကြည့်ရအောင်။
      ပထမ အတန်းက စာရင်းထဲ မမြင်ရတာပါ။ docs အရ skill file တစ်ခုတည်းကို skills folder ထဲ တိုက်ရိုက် ထားရင် load မဖြစ်ပါဘူး။
      folder တစ်ခုထဲမှာ SKILL.md ရှိရပါမယ်။
      [[mark:type-auto]] Claude က အလိုအလျောက် မသုံးရင် description ထဲမှာ user တွေ တကယ် ပြောမယ့် စကားလုံး ပါမပါ စစ်ပါ။
      command နဲ့ ကိုယ်တိုင် ခေါ်လို့ အလုပ်လုပ်ပြီး အလိုအလျောက် မရွေးဘူး ဆိုရင်တော့ frontmatter ရဲ့ YAML မှားနေတာ
      ဖြစ်နိုင်ပါတယ်။ အဲဒီအခါ စာကိုယ်က metadata မပါဘဲ load ဖြစ်လို့ပါ။ debug mode နဲ့ run ရင် parse error ကို မြင်ရပါတယ်။
      [[mark:auto-2]] docs ကလည်း Claude ကို ဘယ် skill
      တွေ ရနိုင်လဲလို့ တိုက်ရိုက် မေးကြည့်ဖို့၊ request ကို စကားလုံး ပြောင်းပြီး ပြန်ခိုင်းကြည့်ဖို့ အကြံပေးပါတယ်။
      [[mark:type-often]] ပြောင်းပြန်အနေနဲ့ မလိုတဲ့ task မှာပါ ဝင်သုံးနေရင် description ကို ပိုကျဉ်းအောင် ရေးပါ။ ဒါမှမဟုတ် လူကပဲ
      ခေါ်ရမယ့် skill ဆိုရင် disable model invocation ကို true ထားပါ။
      [[mark:type-follow]] session ကြာလာတော့ skill ကို မလိုက်နာတော့ဘူး ဆိုရင်၊ မဖြစ်မနေ စည်းကမ်းကို hook ထဲ ရွှေ့ပါ။ context
      ချုံ့ပြီးနောက်မှာ skill ကို ပြန်ခေါ်ပေးတာလည်း ကူညီပါတယ်။
      [[mark:type-name]] တခြား version run နေရင် နာမည်တူ skill ကို ရှာပါ။ မေးခွန်းထဲက developer ရဲ့ ပြဿနာပါ။ description
      တွေ ပြတ်နေရင်တော့ listing budget ကို settings မှာ မြှင့်လို့ ရပါတယ်။ ခဏခဏ မသုံးတဲ့ skill တွေကို နာမည်ပဲ ပြအောင်
      ထားတာလည်း နောက်ထပ် နည်းပါ။
      [[mark:sel-name]] ဒီ ဇယားကို Network Tools နဲ့ မျှသုံးမှာမို့ အတန်း တစ်ခုစီမှာ ပထမဆုံး စစ်ရမယ့် အရာ တစ်ခုတည်းကိုပဲ
      ရေးထားပါတယ်။ ပြဿနာ ဖြစ်တိုင်း docs ကို အစကနေ ပြန်ဖတ်စရာ မလိုဘဲ၊ ဘယ်ကနေ စရမလဲ သိနေဖို့ပါ။
    sources:
      - {
          title: "Claude Code Docs: Extend Claude with skills (troubleshooting)",
          url: "https://code.claude.com/docs/en/skills",
        }
      - {
          title: "Claude Code Docs: Debug your configuration",
          url: "https://code.claude.com/docs/en/debug-your-config",
        }
    actions:
      - { id: close-skills, type: slide.close, at: { mark: d-open, offsetMs: -900 } }
      - {
          id: open-doc,
          type: workspace.openFile,
          at: { afterAction: close-skills },
          path: notebook/45-skill-troubleshooting.md,
        }
      - id: sel-row1
        type: editor.select
        at: { mark: d-open, offsetMs: 6000 }
        target:
          file: notebook/45-skill-troubleshooting.md
          text: "`.claude/skills/<name>/SKILL.md`"
      - id: type-auto
        type: editor.type
        at: { mark: type-auto }
        cadence: line-by-line
        target: { file: notebook/45-skill-troubleshooting.md, after: "/SKILL.md` ဖြစ်ရမယ် |\n" }
        text: "| Claude က အလိုအလျောက် မသုံး | description ထဲမှာ user ပြောမယ့် စကားလုံး ပါလား |\n| `/name` နဲ့မှ အလုပ်လုပ် | frontmatter YAML မှားနေလား: `claude --debug` |\n"
      - id: type-often
        type: editor.type
        at: { mark: type-often }
        cadence: line-by-line
        target: { file: notebook/45-skill-troubleshooting.md, after: "`claude --debug` |\n" }
        text: "| မလိုတဲ့ task မှာပါ သုံး | description ကို ကျဉ်း၊ ဒါမှမဟုတ် `disable-model-invocation: true` |\n"
      - id: type-follow
        type: editor.type
        at: { mark: type-follow }
        cadence: line-by-line
        target:
          {
            file: notebook/45-skill-troubleshooting.md,
            after: "`disable-model-invocation: true` |\n",
          }
        text: "| ကြာလာရင် မလိုက်နာ | မဖြစ်မနေ စည်းကမ်းကို hook ထဲ ရွှေ့ |\n"
      - id: type-name
        type: editor.type
        at: { mark: type-name }
        cadence: line-by-line
        target: { file: notebook/45-skill-troubleshooting.md, after: "စည်းကမ်းကို hook ထဲ ရွှေ့ |\n" }
        text: "| တခြား version run နေ | နာမည်တူ skill: managed > personal > project |\n| description တွေ ပြတ်နေ | listing budget: `skillListingBudgetFraction` |\n"
      - id: expect-name
        type: expect.file
        at: { afterAction: type-name }
        path: notebook/45-skill-troubleshooting.md
        contains: "| တခြား version run နေ | နာမည်တူ skill: managed > personal > project |\n"
      - id: sel-check-col
        type: editor.select
        at: { mark: sel-name }
        target:
          file: notebook/45-skill-troubleshooting.md
          text: "ပထမဆုံး စစ်ရမယ့်အရာ |"

