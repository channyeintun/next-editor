build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 9345

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: need
    chapter: တစ်ပတ်အတွင်း ပေါ်လာတဲ့ ပြဿနာ သုံးခု
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ လိုအပ်ချက် တစ်ခုအတွက် CLAUDE.md၊ skill၊ subagent၊ hook နဲ့ MCP server ထဲက ဘယ်ဟာကို ရွေးမလဲ
      ဆိုတာကို မေးခွန်း တစ်ခုစီနဲ့ ဆုံးဖြတ်ခဲ့ပါတယ်။
      [[mark:sel-teams]] outage notice skill ကို Billing repository ထဲ commit လုပ်ပြီး တစ်ပတ်အကြာမှာ ပြဿနာ သုံးခု
      ပေါ်လာပါတယ်။ ပထမ တစ်ခုက Network Tools developer တစ်ယောက်ဆီကပါ။ သူ့ repository ထဲမှာ Claude Code ကို notice
      ရေးခိုင်းတော့ skill ကို မတွေ့ပါဘူး။
      [[mark:story-2]] ဒုတိယ တစ်ခုက support lead တစ်ယောက်ဆီကပါ။ Claude app ထဲမှာ notice ရေးခိုင်းတော့ credit စည်းကမ်း
      မပါတဲ့ notice ကို ရပါတယ်။ app ထဲမှာ ဒီ skill လုံးဝ မရှိလို့ပါ။
      [[mark:story-3]] တတိယ တစ်ခုက skill ကို ရေးခဲ့တဲ့ Billing developer ကိုယ်တိုင် ဆီက မေးခွန်းပါ။ သူက skill ကို
      စမ်းတုန်းက ကိုယ့် home folder ထဲက skills folder မှာ credit စည်းကမ်း မပါသေးတဲ့ မူကြမ်း တစ်ခု အရင် ရေးခဲ့ပြီး၊
      အဲဒီ မူကြမ်းကို ဖျက်ဖို့ မေ့သွားခဲ့ပါတယ်။ အခု သူ့ စက်မှာ နာမည်တူ skill နှစ်ခု ရှိနေတော့၊ Claude Code က ဘယ်ဟာကို
      သုံးမလဲလို့ မေးလာပါတယ်။
    sources:
      - {
          title: "Claude Code Docs: Extend Claude with skills (share skills)",
          url: "https://code.claude.com/docs/en/skills",
        }
    actions:
      - { id: open-readme, type: workspace.openFile, at: { scene: start }, path: README.md }
      - id: sel-teams
        type: editor.select
        at: { mark: sel-teams }
        target:
          file: README.md
          text: "- developer team 4 ခု: Customer App, Billing, Network Tools, Internal Tools"
      - id: sel-support
        type: editor.select
        at: { mark: story-2 }
        target:
          file: README.md
          text: "- တစ်ရက် ticket 1,800 ခန့်"

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] တတိယ ပြဿနာကို အရင် ကြည့်ရအောင်။ မေးခွန်း တစ်ခု မေးပါရစေ။ အဲဒီ developer ရဲ့ စက်ပေါ်မှာ outage
      notice ဆိုတဲ့ နာမည်တူ skill နှစ်ခု ရှိနေပါတယ်။ Claude Code က ဘယ်ဟာကို သုံးမလဲ။
      [[mark:q-a]] ပထမ တစ်ခုက team နဲ့ မျှသုံးတဲ့ project ထဲက skill ပါ။
      [[mark:q-b]] ဒုတိယ တစ်ခုက သူ့ home folder ထဲက personal skill မူကြမ်း အဟောင်းပါ။ lesson ကို pause လုပ်ပြီး
      စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ တစ်ခုပါ။ ဘာကြောင့်လဲဆိုတော့ နာမည်တူ skill တွေ ရှိရင် docs အရ personal skill
      က project skill ကို အနိုင်ယူလို့ပါ။ ဒါကြောင့် team ထဲက တခြားသူတွေ notice မှန်မှန် ရနေချိန်မှာ၊ သူ့ စက်မှာတော့
      credit စည်းကမ်း မပါတဲ့ မူကြမ်း အဟောင်းက run နေမှာပါ။ ပြင်ဖို့
      နည်းက personal မူကြမ်းကို ဖျက်တာ၊ ဒါမှမဟုတ် နာမည် ပြောင်းတာပါ။
      [[mark:q-rule]] အစဉ်က ကုမ္ပဏီက managed settings နဲ့ ထည့်တဲ့ skill အရင်၊ ပြီးရင် personal၊ ပြီးရင် project ပါ။
      plugin ထဲက skill တွေကတော့ plugin နာမည်ကို ရှေ့မှာ တွဲထားလို့ ဘယ်တော့မှ မတိုက်ပါဘူး။ command file အဟောင်းနဲ့
      နာမည်တူရင်တော့ skill က အနိုင်ရပါတယ်။ repository ထဲက subfolder တစ်ခုမှာ နာမည်တူ skill ရှိရင်လည်း မတိုက်ဘဲ၊
      folder နာမည်ကို ရှေ့က တွဲပြီး နှစ်ခုလုံး load ဖြစ်ပါတယ်။
    sources:
      - {
          title: "Claude Code Docs: Extend Claude with skills (where skills live, priority)",
          url: "https://code.claude.com/docs/en/skills",
        }
      - {
          title: "Claude Code Docs: Extend Claude Code (features overview)",
          url: "https://code.claude.com/docs/en/features-overview",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz, offsetMs: 2500 },
          open: true,
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: q-rule },
          upsertIds: [q-t1, q-t2],
          drawMs: 1600,
        }

  - id: rings
    chapter: မျှဝေတဲ့ အဝိုင်း သုံးခု
    narration: >
      [[mark:r-open]] ကျန်တဲ့ ပြဿနာ နှစ်ခုကတော့ skill ကို ဘယ်အထိ မျှဝေထားလဲ ဆိုတဲ့ ပြဿနာပါ။ မျှဝေတဲ့ နည်းကို အဝိုင်း
      သုံးခုနဲ့ ဆွဲကြည့်ရအောင်။
      [[mark:r-in]] အတွင်းဆုံး အဝိုင်းက project ပါ။ repository ရဲ့ skills folder ကို commit လုပ်ရင် အဲဒီ repository ကို
      သုံးတဲ့သူ အားလုံး ရပါတယ်။ ဒါပေမဲ့ repository တစ်ခုတည်းအတွက်ပါပဲ။ Network Tools developer ရဲ့ repository မှာ မတွေ့တာ
      ဒါကြောင့်ပါ။
      [[mark:r-mid]] အလယ် အဝိုင်းက plugin ပါ။ plugin ဆိုတာ skill၊ hook၊ agent၊ MCP server တွေကို တစ်ထုပ်တည်း ထုပ်ပြီး
      install လုပ်လို့ရအောင် လုပ်ထားတာပါ။ plugin ထဲက skills folder မှာ ထည့်ရင် plugin ကို enable လုပ်ထားတဲ့ team တိုင်း
      ရပါတယ်။ command နာမည်ရှေ့မှာ plugin နာမည် ပါလာပါတယ်။ ဒါကြောင့် Billing က outage notice skill ကို team နှစ်ခု
      သုံးနေတဲ့ နေခြည် ရဲ့ plugin ထဲ ရွှေ့ပြီး၊ project ထဲက copy ကို ဖယ်ဖို့ ဆုံးဖြတ်ပါတယ်။
      [[mark:r-outer]] အပြင်ဆုံး အဝိုင်းက managed settings ပါ။ managed settings ဆိုတာ ကုမ္ပဏီက စက်တိုင်းကို ချပေးပြီး user
      က ပြောင်းလို့ မရတဲ့ setting တွေပါ။ managed settings folder ထဲက skills folder မှာ ထားရင် ကုမ္ပဏီ တစ်ခုလုံးရဲ့ Claude
      Code မှာ ရောက်ပါတယ်။ နေခြည် မှာ managed settings ကို မသုံးသေးလို့ ဒီ အဝိုင်းကို နောက်မှ စဉ်းစားပါမယ်။
      [[mark:r-app]] ဒုတိယ ပြဿနာရဲ့ အဖြေက အဝိုင်းတွေ အပြင်မှာပါ။ custom skill တွေက Claude app၊ API နဲ့ Claude
      Code ကြားမှာ sync မဖြစ်ပါဘူး။ support lead တွေ သုံးဖို့ဆိုရင် Claude app မှာ သီးခြား upload လုပ်ရပါတယ်။ upload
      လုပ်တဲ့အခါ frontmatter မှာ name၊ description အပါအဝင် field အနည်းငယ်ကိုပဲ လက်ခံပြီး၊ တခြား field ပါရင် error
      တက်ပါတယ်။ ဘယ်အဝိုင်းမှာပဲ ဖြစ်ဖြစ်၊ ယုံကြည်ရတဲ့ နေရာက skill ကိုပဲ သုံးပါ။ skill တစ်ခုက Claude ကို code run
      ခိုင်းနိုင်လို့ပါ။
      [[mark:r-cloud]] နောက်ထပ် သတိထားစရာ တစ်ခုက cloud session တွေပါ။ Cowork နဲ့ cloud session တွေက ကိုယ့် home folder
      ထဲက skill တွေကို မဖတ်ပါဘူး။ အဲဒီမှာ သုံးချင်ရင် Claude account မှာ skill ကို ဖွင့်ထားရမလား၊ repository ထဲ commit
      လုပ်ရမလား ဆိုတာ ရွေးရပါတယ်။
      [[mark:r-move]] ဒါဆို Billing ရဲ့ ဆုံးဖြတ်ချက်ကို ပြန်ကြည့်ရအောင်။ outage notice folder တစ်ခုလုံးကို plugin ရဲ့ skills
      folder ထဲ ရွှေ့လိုက်ပါတယ်။ Network Tools က plugin ကို update လုပ်လိုက်တာနဲ့ skill ကို ရပြီး၊ ကိုယ်တိုင် ခေါ်ချင်ရင်
      plugin နာမည်နဲ့ skill နာမည်ကို တွဲထားတဲ့ command ကို သုံးရပါတယ်။ support lead တွေအတွက်တော့ Claude app မှာ
      သီးခြား upload လုပ်ရမှာမို့၊ အဲဒီ copy ကို support manager လှလှ ရဲ့ team က ပိုင်ပြီး ထိန်းဖို့ သတ်မှတ်ပါမယ်။
    sources:
      - {
          title: "Claude Code Docs: Extend Claude with skills (share skills)",
          url: "https://code.claude.com/docs/en/skills",
        }
      - {
          title: "Claude Code Docs: Plugins reference (components)",
          url: "https://code.claude.com/docs/en/plugins/components",
        }
      - {
          title: "Claude Docs: Agent Skills overview (where skills work, security)",
          url: "https://platform.claude.com/docs/en/agents-and-tools/agent-skills/overview",
        }
    actions:
      - {
          id: draw-r-open,
          type: whiteboard.apply,
          at: { mark: r-open },
          clear: true,
          upsertIds: [r-title],
        }
      - {
          id: draw-r-in,
          type: whiteboard.apply,
          at: { mark: r-in },
          upsertIds: [r-in, r-in-l],
          drawMs: 1200,
        }
      - {
          id: draw-r-mid,
          type: whiteboard.apply,
          at: { mark: r-mid },
          upsertIds: [r-mid, r-mid-l],
          drawMs: 1200,
        }
      - {
          id: draw-r-outer,
          type: whiteboard.apply,
          at: { mark: r-outer },
          upsertIds: [r-outer, r-outer-l],
          drawMs: 1200,
        }
      - {
          id: draw-r-app,
          type: whiteboard.apply,
          at: { mark: r-app },
          upsertIds: [r-app, r-app-l],
          drawMs: 1200,
        }
      - {
          id: point-r-in,
          type: whiteboard.point,
          at: { mark: r-cloud },
