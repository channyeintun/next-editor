# Go course, lesson 02: the first Go program (Burmese; the course pilot, sets the voice).
#
# Start state: main.go holds only `package main` and an empty `func main`.
# Edits, all insert-only:
#   1. one Println line inside main -> run-1: compile error `./main.go:4:2: undefined: fmt`;
#   2. `import "fmt"` under the package line -> run-2: မင်္ဂလာပါ;
#   3. two more Println lines -> run-3: three lines, in the order they were written.
# Boards: (P) a program is instructions done top to bottom; (C) code -> compile -> program -> run
# -> output, with run-1's error as the compiler refusing before anything ran; (Q) the quiz.
# Fixtures: bun ~/Documents/go-course-work/tools/sim-go.ts <this yaml> --write
schemaVersion: 1

lesson:
  slug: go-course-02-hello
  title: "Go course 02: ပထမဆုံး Go program"
  locale: my-MM
  workspace:
    lessonType: go
    name: Go Course
    entryFilePath: main.go
    # One file: an open explorer would be a list of one beside the code.
    sidebarStartsCollapsed: true
    files:
      main.go: |
        package main

        func main() {
        }
  whiteboardAssets:
