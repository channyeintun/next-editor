        kind: text,
        x: 315,
        y: 275,
        width: 450,
        height: 40,
        text: "1 · မင်္ဂလာပါ လို့ ရေးပါ",
        strokeColor: "#1e1e1e",
        fontSize: 28,
      }
    - {
        id: p-step2,
