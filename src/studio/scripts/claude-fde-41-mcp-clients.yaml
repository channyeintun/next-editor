build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 9341

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: need
    chapter: Billing ရဲ့ Claude Code ကနေ
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ ticket-mcp server ထဲကို လိုင်းကျမှု စာရင်း resource၊ ticket history template နဲ့ outage reply
      prompt ကို ထည့်ပြီး၊ tool၊ resource၊ prompt ကို ဘယ်သူ ရွေးလဲ ဆိုတာနဲ့ ခွဲခြားခဲ့ပါတယ်။
      [[mark:n-open]] server ရေးပြီးသွားပါပြီ။ အခု Billing team ရဲ့ developer တွေ သုံးတဲ့ Claude Code က ဒီ server ကို
      ချိတ်ရပါမယ်။ Claude Code ဆိုတာ terminal ထဲကနေ code ကို ဖတ်၊ ပြင်၊ command run ပေးတဲ့ coding agent ပါ။ ငွေတောင်းခံမှု
      bug တစ်ခုကို ရှာနေတုန်း၊ အဲဒီ bug ကို တိုင်ထားတဲ့ ticket ကို terminal ကနေ မထွက်ဘဲ ဖတ်စေချင်တာပါ။
      [[mark:n-file]] ဒီ file က Billing repository ရဲ့ အပေါ်ဆုံးမှာ ရှိတဲ့ MCP config file ပါ။ အခုတော့ server တစ်ခုမှ မရှိသေးပါဘူး။
      [[mark:n-roles]] Model Context Protocol၊ အတိုကောက် MCP ဆိုတာ AI app တွေနဲ့ အပြင်က tool၊ data တွေကို ချိတ်တဲ့ စံ
      သဘောတူညီချက်ပါ။ MCP မှာ Claude Code က host ပါ။ host ဆိုတာ user စကားပြောနေတဲ့
      AI app ဖြစ်ပြီး၊ server တစ်ခုစီအတွက် client တစ်ခုစီကို ဖန်တီးပါတယ်။ client ဆိုတာ server တစ်ခုနဲ့ ချိတ်ပြီး host
      အတွက် လုပ်ပေးတဲ့ အပိုင်းပါ။ ချိတ်ဖို့ config မရေးခင် client က model အတွက် ဘာတွေ လုပ်ပေးလဲ အရင် ကြည့်ရအောင်။
    sources:
      - {
          title: "Model Context Protocol: Architecture overview (2026-07-28)",
          url: "https://modelcontextprotocol.io/docs/2026-07-28/learn/architecture",
        }
    actions:
      - {
          id: open-config,
          type: workspace.openFile,
          at: { mark: n-file },
          path: billing-service/.mcp.json,
        }

  - id: client
    chapter: Client ရဲ့ အလုပ်
    narration: >
      [[mark:c-open]] client ရဲ့ အလုပ်ကို Python SDK ရဲ့ Client class နဲ့ ကြည့်ရင် ရှင်းပါတယ်။ ဒီ lesson ကို ရေးတဲ့ အချိန်မှာ
      SDK version ၂ မှာ Client class တစ်ခုတည်း ရှိပြီး၊ version ၁ တုန်းက transport၊ session နဲ့ လက်နဲ့ ခေါ်ရတဲ့ initialize
      ဆိုတဲ့ အလွှာ သုံးခုကို အစားထိုးလိုက်ပါတယ်။
      [[mark:c-1]] ပထမ အဆင့်က ချိတ်တာပါ။ Client ကို URL ပေးရင် Streamable HTTP နဲ့ ချိတ်ပြီး၊ command ပေးရင် server ကို
      subprocess အနေနဲ့ stdio နဲ့ စ run ပါတယ်။ async with block ထဲ ဝင်တာနဲ့ ချိတ်ပြီး protocol version ကို ညှိပါတယ်။
      server discover ကို အရင် စမ်းပြီး၊ server အဟောင်းဆိုရင် initialize handshake နဲ့ ပြန်ချိတ်ပေးပါတယ်။
      [[mark:c-2]] ဒုတိယ အဆင့်က tool စာရင်းကို ယူတာပါ။ host က အဲဒီ စာရင်းကို model ကို ပေးပါတယ်။
      [[mark:c-3]] တတိယ အဆင့်က model ရွေးလိုက်တဲ့ tool ကို နာမည်နဲ့ arguments ပေးပြီး ခေါ်တာပါ။ tool ထဲမှာ error ဖြစ်ရင်
      client ဘက်မှာ exception မတက်ဘဲ is error ဆိုတဲ့ အမှတ်အသားနဲ့ ရလဒ် ပြန်ရလို့၊ model က error ကို ဖတ်ပြီး ပြင်ခေါ်နိုင်ပါတယ်။
      [[mark:c-4]] စတုတ္ထ အဆင့်က resource ကို URI နဲ့ ဖတ်တာပါ။ ဘယ် resource ကို ဖတ်မလဲ ဆိုတာ app က ဆုံးဖြတ်ပါတယ်။
      [[mark:c-5]] နောက်ဆုံး အဆင့်က user ရွေးလိုက်တဲ့ prompt ကို argument နဲ့ ယူပြီး message တွေ ရတာပါ။ ဆိုလိုတာက model က
      server ကို တိုက်ရိုက် မမြင်ရပါဘူး။ client က ကြားကနေ ရှာပေး၊ ခေါ်ပေး၊ ဖတ်ပေးတာပါ။
    sources:
      - { title: "MCP Python SDK: Client", url: "https://py.sdk.modelcontextprotocol.io/client/" }
      - {
          title: "MCP Python SDK: What's new in v2",
          url: "https://py.sdk.modelcontextprotocol.io/whats-new/",
        }
    actions:
      - {
          id: show-steps,
          type: slide.show,
          at: { mark: c-open, offsetMs: -1200 },
          slideId: client-steps,
        }
      - { id: pt-1, type: slide.point, at: { mark: c-1 }, target: { x: 0.15, y: 0.35 } }
      - { id: pt-2, type: slide.point, at: { mark: c-2 }, target: { x: 0.15, y: 0.47 } }
      - { id: pt-3, type: slide.point, at: { mark: c-3 }, target: { x: 0.15, y: 0.59 } }
      - { id: pt-4, type: slide.point, at: { mark: c-4 }, target: { x: 0.15, y: 0.71 } }
      - { id: pt-5, type: slide.point, at: { mark: c-5 }, target: { x: 0.15, y: 0.83 } }

  - id: config
    chapter: MCP config file
    narration: >
      [[mark:f-open]] Claude Code ကတော့ ဒီ client အလုပ်တွေကို ကိုယ်တိုင် လုပ်ပေးပါတယ်။ ကိုယ်တို့ ပြောပေးရမှာက ဘယ် server ကို
      ဘယ်လို စ run ရမလဲ ဆိုတာပဲ ဖြစ်ပါတယ်။ terminal ကနေ claude mcp add command နဲ့ ထည့်လို့ ရသလို၊ ဒီ file ထဲမှာ
      ကိုယ်တိုင် ရေးလို့လည်း ရပါတယ်။ command ကို သုံးရင် server နာမည်ရဲ့ နောက်မှာ dash နှစ်ခု ခံပြီး၊ အဲဒီနောက်က
      အရာအားလုံးကို server ကို စ run မယ့် command အဖြစ် ဘာမှ မပြင်ဘဲ ပေးပါတယ်။
      [[mark:type-name]] server ကို tickets လို့ နာမည်ပေးပြီး၊ transport type ကို stdio လို့ ရေးပါတယ်။ type ကို အမြဲ
      ရေးထားပါ။ URL ပဲ ရေးပြီး type မပါရင် Claude Code က stdio လို့ ယူဆလို့ error ဖြစ်ပါတယ်။
      [[mark:type-cmd]] command နဲ့ args က Claude Code ကို server ဘယ်လို စ run ရမလဲ ပြောတာပါ။ uv နဲ့ MCP SDK ကို
      တွဲပေးပြီး server file ကို run ပါတယ်။ server ရှိတဲ့ folder က developer တစ်ယောက်နဲ့ တစ်ယောက် မတူနိုင်လို့ environment
      variable နဲ့ ရေးထားပါတယ်။ MCP config file က command၊ args၊ env တို့ထဲမှာ environment variable ကို ချဲ့ပေးပါတယ်။
      [[mark:type-env]] env ကတော့ server ရဲ့ environment ထဲ ထည့်ပေးမယ့် တန်ဖိုးတွေပါ။ Ticket system နဲ့ NMS ရဲ့ API လိပ်စာကို
      developer ရဲ့ environment ကနေ ယူပြီး ပေးပါတယ်။ လိပ်စာ အစစ်ကို file ထဲ မရေးတော့ repository ထဲ ရောက်မသွားပါဘူး။
    sources:
      - {
          title: "Claude Code Docs: Connect Claude Code to tools via MCP",
          url: "https://code.claude.com/docs/en/mcp",
        }
      - {
          title: "Claude Code Docs: MCP quickstart",
          url: "https://code.claude.com/docs/en/mcp-quickstart",
        }
    actions:
      - { id: close-steps, type: slide.close, at: { mark: f-open } }
      - id: type-name
        type: editor.type
        at: { mark: type-name }
        cadence: line-by-line
        target: { file: billing-service/.mcp.json, after: "  \"mcpServers\": {\n" }
        text: "    \"tickets\": {\n      \"type\": \"stdio\",\n"
      - id: type-cmd
        type: editor.type
        at: { mark: type-cmd }
        cadence: line-by-line
        target: { file: billing-service/.mcp.json, after: "      \"type\": \"stdio\",\n" }
        text: "      \"command\": \"uv\",\n      \"args\": [\"run\", \"--with\", \"mcp[cli]\", \"${TICKET_MCP_DIR}/server.py\"],\n"
      - id: type-env
        type: editor.type
        at: { mark: type-env }
        cadence: line-by-line
        target: { file: billing-service/.mcp.json, after: "\"${TICKET_MCP_DIR}/server.py\"],\n" }
        text: "      \"env\": { \"TICKETS_API_URL\": \"${TICKETS_API_URL}\", \"NMS_API_URL\": \"${NMS_API_URL}\" }\n    }\n"
      - id: expect-type
        type: expect.file
        at: { afterAction: type-env }
        path: billing-service/.mcp.json
        contains: "    \"tickets\": {\n      \"type\": \"stdio\",\n"

  - id: scopes
    chapter: Scope
    narration: >
      [[mark:s-open]] ဒီ config ကို ဘယ်မှာ ထားမလဲ ဆိုတာကို scope လို့ ခေါ်ပါတယ်။
      [[mark:s-1]] local scope က default ပါ။ ဒီ project မှာ ကိုယ်တစ်ယောက်တည်းအတွက်ဖြစ်ပြီး၊ ကိုယ့် home folder ထဲက Claude
      config file မှာ ဒီ project ရဲ့ လမ်းကြောင်းအောက်မှာ သိမ်းပါတယ်။ settings file ထဲက local settings နဲ့ နာမည်တူပေမဲ့ တခြား
      နေရာပါ။
      [[mark:s-2]] project scope ကတော့ ကိုယ်တို့ ရေးနေတဲ့ ဒီ file ပါ။ project ရဲ့ အပေါ်ဆုံးမှာ ရှိပြီး git ထဲ commit
      လုပ်ထားတာမို့ team တစ်ခုလုံး မျှသုံးပါတယ်။
      [[mark:s-3]] user scope က ကိုယ့် project အားလုံးအတွက်ပါ။
      [[mark:s-pick]] Billing team အတွက်တော့ project scope ကို ရွေးပါတယ်။ developer တိုင်း server တူတူ၊ config တူတူ ရပြီး၊
      ပြင်ချင်ရင် pull request တစ်ခုနဲ့ review လုပ်ပြီး ပြင်လို့ရလို့ပါ။
      [[mark:s-note]] နာမည်တူ server က နေရာ နှစ်ခုမှာ ရှိနေရင် local က အရင်၊ ပြီးမှ project၊ ပြီးမှ user ဆိုတဲ့ အစဉ်နဲ့
      ယူပါတယ်။ ဒါကြောင့် developer တစ်ယောက်က ကိုယ့်စက်မှာ စမ်းချင်ရင် local မှာ နာမည်တူ ထည့်ပြီး ခဏ အစားထိုးလို့ ရပါတယ်။ plugin ကနေ လာတဲ့ server တွေနဲ့ Claude app ရဲ့ connector တွေကတော့ user scope ရဲ့ နောက်မှာ
      ရှိပါတယ်။
    sources:
      - {
          title: "Claude Code Docs: Connect Claude Code to tools via MCP",
          url: "https://code.claude.com/docs/en/mcp",
        }
    actions:
      - {
          id: draw-s-open,
          type: whiteboard.apply,
          at: { mark: s-open },
          open: true,
          clear: true,
          upsertIds: [s-title],
        }
      - {
          id: draw-s-1,
          type: whiteboard.apply,
          at: { mark: s-1 },
          upsertIds: [s-b1, s-l1, s-t1],
          drawMs: 1500,
        }
      - {
          id: draw-s-2,
          type: whiteboard.apply,
          at: { mark: s-2 },
          upsertIds: [s-b2, s-l2, s-t2],
          drawMs: 1500,
        }
      - {
          id: draw-s-3,
          type: whiteboard.apply,
          at: { mark: s-3 },
          upsertIds: [s-b3, s-l3, s-t3],
          drawMs: 1500,
        }
      - {
          id: draw-s-pick,
          type: whiteboard.apply,
          at: { mark: s-pick },
          upsertIds: [s-pick],
          drawMs: 900,
        }
      - {
          id: draw-s-note,
          type: whiteboard.apply,
          at: { mark: s-note },
          upsertIds: [s-note],
          drawMs: 1000,
        }

  - id: screen
    chapter: MCP view
    narration: >
      [[mark:m-open]] Claude Code ထဲမှာ MCP command ကို run ရင် ဒီလို မြင်ရပါတယ်။
      [[mark:m-title]] ဒါက MCP server တွေကို စီမံတဲ့ view ပါ။ server တစ်ခုစီကို ရွေးပြီး ဝင်ကြည့်လို့ ရပါတယ်။ remote server
      တွေမှာ OAuth နဲ့ sign in ဝင်ရမယ်ဆိုရင်လည်း ဒီ view ကနေ စလို့ ရပါတယ်။
      [[mark:m-scope]] Project MCPs ဆိုတဲ့ ခေါင်းစဉ်အောက်မှာ project ရဲ့ MCP config file ကနေ ဖတ်ထားတဲ့ server တွေ
      ပေါ်ပါတယ်။ ဘယ် file ကလဲ ဆိုတာကိုပါ လမ်းကြောင်းနဲ့ ပြထားပါတယ်။
      [[mark:m-server]] tickets server က အမှန်ခြစ်နဲ့ ချိတ်ပြီးသား ဖြစ်နေပါတယ်။
      [[mark:m-tools]] server က tool နှစ်ခု ပေးထားတာလည်း မြင်ရပါတယ်။ Claude Code ထဲမှာ ဒီ tool တွေရဲ့ နာမည် အပြည့်က mcp၊
      server နာမည်၊ tool နာမည် ဆိုပြီး underscore နှစ်ခုစီနဲ့ ဆက်ထားတာပါ။ permission rule ထဲမှာ server နာမည်အထိ ရေးရင်
      အဲဒီ server ရဲ့ tool အားလုံးနဲ့ ကိုက်ပြီး၊ tool နာမည်အထိ ရေးရင် tool တစ်ခုတည်းနဲ့ ကိုက်ပါတယ်။ Claude က tool ကို
      ပထမဆုံး ခေါ်တဲ့အခါ permission မေးနိုင်ပါတယ်။
      [[mark:m-list]] Claude Code ကို မဖွင့်ဘဲ terminal ကနေ claude mcp list ကို run ရင်လည်း server တစ်ခုစီ ချိတ်မိလား၊ authentication လိုလား၊
      ချိတ်မရဘူးလား ဆိုတဲ့ status ကို ပြပါတယ်။
      [[mark:m-search]] ဒီ server ရဲ့ tool တွေအတွက် tool search ကလည်း default ဖွင့်ထားပါတယ်။ session စတဲ့အခါ tool နာမည်တွေပဲ load လုပ်ပြီး၊ schema
      အပြည့်ကို လိုတဲ့အခါမှ load လုပ်တာမို့ server များလာလည်း context ကို သိပ် မစားပါဘူး။
    sources:
      - {
          title: "Claude Code Docs: Connect Claude Code to tools via MCP",
          url: "https://code.claude.com/docs/en/mcp",
        }
      - {
          title: "Claude Code Docs: Configure permissions",
          url: "https://code.claude.com/docs/en/permissions",
        }
    actions:
      - {
          id: close-scopes,
          type: whiteboard.apply,
          at: { mark: m-open, offsetMs: -1400 },
          open: false,
        }
      - { id: show-mcp, type: slide.show, at: { afterAction: close-scopes }, slideId: mcp-screen }
      - { id: pt-title, type: slide.point, at: { mark: m-title }, target: { x: 0.114, y: 0.518 } }
      - { id: pt-scope, type: slide.point, at: { mark: m-scope }, target: { x: 0.133, y: 0.624 } }
      - { id: pt-server, type: slide.point, at: { mark: m-server }, target: { x: 0.119, y: 0.659 } }
      - { id: pt-tools, type: slide.point, at: { mark: m-tools }, target: { x: 0.223, y: 0.659 } }
      - { id: close-mcp, type: slide.close, at: { mark: m-list } }
      - id: sel-entry-list
        type: editor.select
        at: { afterAction: close-mcp }
        target:
          file: billing-service/.mcp.json
          text: '    "tickets": {'

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ Billing team lead မောင်မောင် က ဒီ config file ကို commit လုပ်ပြီး push
      လုပ်လိုက်ပါတယ်။ နောက်တစ်နေ့ မနက် developer အသစ် တစ်ယောက်က repository ကို pull လုပ်ပြီး Claude Code ကို ဖွင့်ပါတယ်။
      tickets server ကို ဘယ်လို ဆက်ဆံမလဲ။
      [[mark:q-a]] ပထမ အဖြေက file ထဲမှာ ရှိနေပြီမို့ ချက်ချင်း ချိတ်ပြီး သုံးမယ် ဆိုတာပါ။
      [[mark:q-b]] ဒုတိယ အဖြေက ခွင့်ပြုမလား ဆိုတာ အရင် မေးမယ် ဆိုတာပါ။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ တစ်ခုပါ။ ဘာကြောင့်လဲဆိုတော့ Claude Code က project ရဲ့ MCP config file ထဲက server
      တွေကို မသုံးခင် ခွင့်ပြုချက် တောင်းလို့ပါ။ ခွင့်မပြုရသေးတဲ့ server ကို approval စောင့်နေတယ်လို့ ပြပြီး၊ folder ကို
      ယုံကြည်ကြောင်း လက်မခံရသေးရင် repository ထဲမှာ commit လုပ်ထားတဲ့ setting နဲ့လည်း ကိုယ့်ဘာသာ ခွင့်ပြုလို့ မရပါဘူး။
      [[mark:q-rule]] ဒါဟာ မှန်ပါတယ်။ MCP server ဆိုတာ developer ရဲ့ စက်ပေါ်မှာ run မယ့် command တစ်ခု ဖြစ်လို့ပါ။ ဒါကြောင့် developer
      တစ်ယောက်စီက config ကို ဖတ်ပြီးမှ ခွင့်ပြုပါ။ ပေးခဲ့တဲ့ အဖြေတွေကို ပြန်ဖျက်ချင်ရင်တော့ project choices ကို reset လုပ်တဲ့
      command ရှိပါတယ်။
    sources:
      - {
          title: "Claude Code Docs: Connect Claude Code to tools via MCP",
          url: "https://code.claude.com/docs/en/mcp",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: q-rule },
          upsertIds: [q-t1, q-t2],
          drawMs: 1600,
        }

  - id: your-turn
    chapter: ကိုယ့် server ရဲ့ config
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ဒီ file ထဲမှာ tickets ရဲ့ အောက်က နေရာမှာ ကိုယ့် system
      အတွက် server တစ်ခုရဲ့ entry ကို ရေးကြည့်ပါ။ နာမည်၊ type၊ server ကို စ run မယ့် command နဲ့ args လုံလောက်ပါတယ်။
      [[mark:turn-2]] remote server ဆိုရင်တော့ command အစား type ကို http လို့ ပေးပြီး URL ကို ရေးပါ။ ရေးပြီးရင် လိပ်စာ၊
      token လိုမျိုး repository ထဲ မရောက်သင့်တဲ့ တန်ဖိုး ကျန်နေသေးလား စစ်ပြီး၊ ကျန်ရင် environment variable နဲ့ အစားထိုးပါ။
    sources:
      - {
          title: "Claude Code Docs: MCP quickstart",
          url: "https://code.claude.com/docs/en/mcp-quickstart",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: turn }, open: false }
      - id: sel-entry
        type: editor.select
        at: { mark: turn, offsetMs: 2200 }
        target:
          file: billing-service/.mcp.json
          text: '    "tickets": {'
      - id: sel-env
        type: editor.select
        at: { mark: turn-2 }
        target:
          file: billing-service/.mcp.json
          text: '"TICKETS_API_URL": "${TICKETS_API_URL}"'

  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ MCP client က host ထဲမှာ နေပြီး server ကို ချိတ်၊ tool စာရင်း ယူ၊ tool ခေါ်၊ resource
      ဖတ်၊ prompt ယူပေးပါတယ်။ Claude Code မှာ ဒီ အလုပ်တွေကို ကိုယ်တိုင် လုပ်ပေးပြီး၊ ကိုယ်တို့က project ရဲ့ MCP config file
      ထဲမှာ server ကို ဘယ်လို စ run မလဲ ရေးပေးရုံပါ။ team မျှသုံးတဲ့ server ကိုတော့ developer တစ်ယောက်စီက ခွင့်ပြုပြီးမှ သုံးပါတယ်။
      [[mark:next]] နောက် lesson မှာတော့ လိုင်းကျတိုင်း outage notice ကို နေခြည် ရဲ့ ပုံစံနဲ့ ဘယ်လို ရေးရမလဲ ဆိုတာ တစ်ယောက်ယောက်က
      ထပ်ခါထပ်ခါ ရှင်းပြနေရတဲ့ ပြဿနာကနေ စပြီး၊ agent skill ဆိုတာ ဘာလဲ ဆိုတာကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "Claude Code Docs: Connect Claude Code to tools via MCP",
          url: "https://code.claude.com/docs/en/mcp",
        }
    actions:
      - id: sel-type
        type: editor.select
        at: { mark: recap }
        target:
          file: billing-service/.mcp.json
          text: '"command": "uv",'

checks:
  - { type: timing.p95Ms, max: 300 }
