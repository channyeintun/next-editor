runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: odd-drafts
    chapter: ထူးဆန်းတဲ့ draft လေးစောင်
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ ညွှန်ကြားချက်၊ ဥပမာနဲ့ format ကို သုံးပြီး model ရဲ့ အပြုအမူကို ပြောင်းတဲ့
      steerability အကြောင်း လေ့လာခဲ့ပါတယ်။ ညွှန်ကြားချက်နဲ့ ပြောင်းလို့ ရတာ ရှိသလို၊ ပြောင်းလို့ မရတာလည်း
      ရှိတယ် ဆိုတာ တွေ့ခဲ့ပါတယ်။
      [[mark:d-open]] ဒီတစ်ပတ် အစမှာ support manager လှလှ က support agent တွေ personal chat AI နဲ့ ရေးခဲ့တဲ့
      draft တွေကို စုပြီး ကိုယ့်ဆီ ယူလာပေးခဲ့ပါတယ်။ draft ဆိုတာ customer ဆီ မပို့ခင် ရေးထားတဲ့ အဖြေ မူကြမ်းပါ။
      အဲဒီထဲက တစ်ပတ်တည်းမှာ ရေးခဲ့တဲ့ ထူးဆန်းတဲ့ draft လေးစောင်ကို အရင် ကြည့်ရအောင်။
      [[mark:d1]] ပထမ draft က internet နှေးတဲ့ ticket အတွက်ပါ။ ticket အမျိုးအစား တူတူကို support agent
      နှစ်ယောက်က ရေးခိုင်းတော့၊ တစ်စောင်က အဆင့် သုံးဆင့်နဲ့ တိုတိုလေး ဖြေပြီး၊ နောက်တစ်စောင်က ခေါင်းစဉ်တွေနဲ့
      အဆင့် ခုနစ်ဆင့် ရေးထားပါတယ်။
      [[mark:d2]] ဒုတိယ draft က အိမ်ရွှေ့မယ့် customer တစ်ယောက်ကို ရွှေ့ပြောင်းခ ကျပ် ၁၅၀၀၀ ကျမယ်လို့
      ပြောထားပါတယ်။ နေခြည် ရဲ့ ရွှေ့ပြောင်းခက plan အလိုက် ကွာပြီး Billing ထဲမှာပဲ ရှိတာမို့၊ အဲဒီ ဂဏန်းကို
      ဘယ်စာရွက်ထဲကမှ ယူထားတာ မဟုတ်ပါဘူး။
      [[mark:d3]] တတိယ draft က message သုံးဆယ်လောက် ရှည်တဲ့ ticket အတွက်ပါ။ customer က တတိယ message
      မှာကတည်းက router ကို ပိတ်ပြီး ပြန်ဖွင့်ပြီးပြီလို့ ပြောထားပါတယ်။ ဒါပေမဲ့ draft က router ကို ပြန်ဖွင့်ကြည့်ပါလို့
      ထပ်ခိုင်းနေပါတယ်။
      [[mark:d4]] စတုတ္ထ draft ကတော့ အကြောင်းအရာ မှန်ပါတယ်။ ဒါပေမဲ့ စာပိုဒ် ငါးပိုဒ်လောက် ရှည်ပြီး၊ ရုံးစာလို
      တရားဝင်လွန်းတဲ့ အသံနဲ့ English စကားလုံးတွေ ရောရေးထားတော့ customer တစ်ယောက်အတွက် ဖတ်ရ ခက်ပါတယ်။
      [[mark:d-point]] ဒီ လေးစောင်ကို ကြည့်ပြီး AI က မှားတာပဲ၊ ညွှန်ကြားချက် ထပ်ထည့်လိုက်ရင် ပြီးမှာပဲလို့
      ပြောချင်စရာ ကောင်းပါတယ်။ ဒါပေမဲ့ လေးစောင်လုံးက မှားပုံ မတူသလို၊ မှားရတဲ့ အကြောင်းရင်းလည်း မတူပါဘူး။
      အကြောင်းရင်း မတူရင် ပြင်နည်းလည်း တူလို့ မရပါဘူး။
    sources:
