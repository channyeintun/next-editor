      package.json: |
        {
          "name": "css-course-tailwind",
          "private": true,
          "version": "1.0.0",
          "type": "module",
          "scripts": {
            "dev": "vite --host 0.0.0.0 --port 5173 --strictPort"
          },
          "devDependencies": {
            "@tailwindcss/vite": "4.3.3",
            "tailwindcss": "4.3.3",
            "vite": "5.4.21"
          }
        }
      vite.config.js: |
        import { defineConfig } from "vite";
        import tailwindcss from "@tailwindcss/vite";
        import { rescanTailwind } from "./webcontainer-fix.js";

        export default defineConfig({
          plugins: [tailwindcss(), rescanTailwind()],
        });
      webcontainer-fix.js: |
        // webcontainer-fix.js: two fixes for the browser's WebContainer. Tailwind does not
        // notice classes typed into index.html unless the CSS file looks changed, so this
        // touches the CSS file after an HTML/JS edit. And a page that is still loading can
        // miss the reload for the newest edit, so a page that connects with older HTML is
        // reloaded once more. On a real computer you do not need it.
        import fs from "node:fs";
        export function rescanTailwind() {
          let servedHtml = null;
          return {
            name: "rescan-tailwind",
            transformIndexHtml: { order: "pre", handler(html) { servedHtml = html; } },
            configureServer(server) {
              server.ws.on("connection", (socket) => {
                const html = fs.readFileSync(server.config.root + "/index.html", "utf8");
                if (servedHtml !== null && html !== servedHtml) socket.send(JSON.stringify({ type: "full-reload" }));
              });
            },
            handleHotUpdate({ file, server }) {
              if (!/\.(html|js|jsx|ts|tsx)$/.test(file)) return;
              for (const mod of server.moduleGraph.idToModuleMap.values()) {
                if (mod.file?.endsWith(".css")) {
                  const now = new Date();
                  try { fs.utimesSync(mod.file, now, now); } catch { fs.writeFileSync(mod.file, fs.readFileSync(mod.file)); }
                  server.moduleGraph.invalidateModule(mod);
                }
              }
            },
          };
        }
      # index.html: the kit's Tailwind page (COURSE-KIT.md §8). The favourite
      # button, the <details> and the order button carry a few pinned layout
      # utilities so their colour changes show; the first card and the menu
      # list start with empty class attributes.
      index.html: |
