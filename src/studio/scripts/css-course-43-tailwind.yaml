# CSS course (Burmese), lesson 43 of 43: Tailwind CSS, and the end of the course.
#
# Narration is Burmese (voice-script.md next to this file is its source;
# DESIGN.md is the span-by-span brief). Every [[mark:…]] sits where its action
# begins, at a sentence end; each span carries one piece of meaning. Everything
# the learner sees (title, chapters, whiteboard labels, UI strings) is Burmese.
#
# Shape: board A (recall lesson 42; utility-first; each class is CSS already
# learned) while pnpm installs Tailwind → board B (why teams like it, the cost,
# not inline styles) → code tour (package.json, the Vite plugin,
# webcontainer-fix.js in one sentence, the one @import line) → preview:
# Preflight → board C (the four layers) → the first card built from utilities
# typed into its class attribute → board D (spacing / text / colour scales) →
# board E (class detection, no dynamic names, @source, only used CSS) →
# aria-pressed variant on the favourite button + the attribute inserted →
# hover/focus/disabled/group/peer/stacking explained → open: variant on the
# hours <details> + a click → grid + sm:grid-cols-2 (nothing: 432 px < 640 px)
# → board F (mobile-first, max-sm, container) → @xs:grid-cols-2 (two columns)
# → board G (dark: is drawn, not shown) → @theme block (block insert) +
# bg-tea-500 on the order button → arbitrary border colour on card 2 → the
# components-layer .card loses to p-8, then an unlayered .card (block insert)
# beats it → board C again with unlayered CSS on top → board H (repeat vs
# extract, modern CSS underneath, one-liners) → board I (course map, 43
# lessons) → board J (next steps, resources, credit; no next lesson).
#
# Live-preview safety (PLATFORM.md §5): no .css file is ever keystroke-typed
# (the Tailwind plugin overlays every half-typed CSS state): src/style.css
# gets two complete `block` inserts. Utility classes are typed into
# index.html class attributes (each saved state reloads the page; Tailwind
# ignores half-typed class names). webcontainer-fix.js (pinned, never typed)
# makes Tailwind regenerate after HTML edits inside the WebContainer, and
# reloads a page that connects holding older HTML: Vite 5 sends each edit's
# full-reload only to pages already connected, and a page still waiting for
# Tailwind's CSS missed the last keystroke's ("…text-whit", 2026-10-24).
# State shown live is attribute state that replays: aria-pressed (inserted
# into the file) and <details open> (a click). hover:, focus:, dark: are
# explained or drawn only (PLATFORM.md §3).
#
# Measured in headless Chrome at 432 × 720 with Vite 5.4.21 + Tailwind 4.3.3
# (probe/stages.ts, same class strings): main content box 352 px (max-w-sm
# minus p-4), so @xs (320 px) matches and @sm (384 px) / sm: (640 px) do not;
# two columns are 170 px each, and flex-wrap puts card 1's price under its
# name there. Card 2 padding 32 px (p-8 beats @layer components) → 4 px after
# the unlayered rule. No console errors.
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
