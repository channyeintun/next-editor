build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 4111

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  - id: why-variables
    chapter: "Custom property ဘာကြောင့် လိုလဲ"
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ unit နဲ့ အရွယ်အစားကို ကြည့်ခဲ့ပါတယ်။ တကယ့် page မှာ အရောင် တစ်ခု၊ အရွယ်အစား
      တစ်ခုကို rule အများကြီးမှာ ထပ်ရေးရလေ့ ရှိပါတယ်။ [[mark:start-server]] ဒီလို ပြောနေတုန်းမှာပဲ၊ board
      နောက်မှာ dev server ကို စနေပါပြီ။ [[mark:draw-repeats]] ဒါက တွေ့နေကျ CSS ဖိုင် တစ်ခုပါ။ header၊
      ဈေးနှုန်း၊ ခလုတ်၊ link နဲ့ card ရဲ့ border အတွက်၊ အညိုရောင် တစ်ခုတည်းကို ငါးနေရာမှာ ထပ်ရေးထားပါတယ်။
      [[mark:circle-repeats]] ဆိုင်ရှင်က အရောင် ပြောင်းချင်ရင် နေရာတိုင်းကို လိုက်ရှာ ပြင်ရပါမယ်။ တစ်နေရာ
      ကျန်ခဲ့ရင် page မှာ အညိုရောင် နှစ်မျိုး ရောနေပါမယ်။ [[mark:draw-store]] ဒါကို custom property နဲ့
      ဖြေရှင်းပါတယ်။ custom property ဆိုတာ ကိုယ်တိုင် နာမည်ပေးပြီး တန်ဖိုး သိမ်းထားတဲ့ property ပါ။
      အညိုရောင်ကို brand လို နာမည်နဲ့ တစ်ခါပဲ သိမ်းပါမယ်။ [[mark:draw-read]] အညိုရောင် လိုတဲ့ rule တိုင်းက
      အဲဒီ နာမည်နဲ့ ဖတ်ယူလို့၊ အရောင် ပြောင်းချင်ရင် တစ်ကြောင်းပဲ ပြင်ရပါတော့တယ်။ [[mark:draw-aka]] custom
      property ကို CSS variable လို့လည်း ခေါ်ကြပါတယ်။ ပြီးတော့ brand လို နာမည်ကို မြင်တာနဲ့၊ ဒီ အရောင်ကို
      ဘာအတွက် သုံးလဲ ဆိုတာ တန်းသိပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Custom properties"
        url: "https://web.dev/learn/css/custom-properties"
      - title: "MDN — Using CSS custom properties (variables)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/Using_CSS_custom_properties"
      - title: "CSS Custom Properties for Cascading Variables Module Level 1"
        url: "https://www.w3.org/TR/css-variables-1/"
    actions:
      - id: open-why-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      # Runs in the background (boot + pnpm install + spawn); waitForReady sits
      # on the preview mark at the end of the next scene, well over 40 s of
      # narration later.
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 45000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-repeats
        type: whiteboard.apply
        at: { mark: draw-repeats }
        upsertIds: [a-r1, a-r2, a-r3, a-r4, a-r5]
        drawMs: 4000
      - id: circle-repeats
        type: whiteboard.apply
        at: { mark: circle-repeats }
        upsertIds: [a-circle, a-problem]
        drawMs: 2400
      - id: draw-store
        type: whiteboard.apply
        at: { mark: draw-store }
        upsertIds: [a-arrow, a-store-box, a-store, a-store-label]
        drawMs: 3000
      - id: draw-read
        type: whiteboard.apply
        at: { mark: draw-read }
        upsertIds: [a-read, a-read-label, a-one]
        drawMs: 2600
      - id: draw-aka
        type: whiteboard.apply
        at: { mark: draw-aka }
        upsertIds: [a-aka]
        drawMs: 1400

  - id: code-tour
    narration: >
      [[mark:close-why]] project ကို ကြည့်ရအောင်။ [[mark:open-index]] ဒါက page ရဲ့ HTML ဖိုင်ပါ။
      [[mark:select-header]] အပေါ်ဆုံးမှာ ဆိုင်နာမည် ပါတဲ့ header ရှိပါတယ်။ [[mark:select-theme]] header
      အောက်မှာ ခလုတ် သုံးခု ပါတဲ့ တန်း အသစ် ရှိပါတယ်။ lesson အဆုံးမှာ ဒီ ခလုတ်တွေနဲ့ ဆိုင်ရဲ့ အရောင်ကို
      JavaScript ကနေ ပြောင်းပါမယ်။ [[mark:select-featured]] သောက်စရာ menu ထဲက ဒီနေ့ အထူး card မှာ featured
      ဆိုတဲ့ class အပို ပါပါတယ်။ [[mark:select-cup]] အောက်ဘက်မှာ လက်ဖက်ရည် ခွက်အလွတ် တစ်ခု ရှိပါတယ်။
      [[mark:select-broken]] အော်ဒါ form မှာလည်း broken ဆိုတဲ့ class ပါတဲ့ ဒုတိယ ခလုတ် ရှိပါတယ်။
      [[mark:open-styles]] ကိုယ့် CSS ဖိုင်က အလွတ်ပါ။ ဒီတစ်ခါ base ဖိုင်မှာ header ရဲ့ နောက်ခံ၊ ဈေးနှုန်း
      အရောင်နဲ့ ခလုတ်တွေရဲ့ နောက်ခံ မပါလို့၊ အဲဒီ သုံးခုလုံးကို တစ်နေရာတည်းကနေ ပေးပါမယ်။
      [[mark:preview-opens]] dev server အသင့် ဖြစ်လို့ preview ပွင့်လာပါပြီ။ နောက်ခံ မရှိလို့ header ထဲက
      အရောင်ဖျော့ စာလုံးတွေ မမြင်ရသလောက်ပါ။ ဈေးနှုန်းနဲ့ မှာယူရန် link ဆီလည်း ဆိုင်ရဲ့ အရောင်
      မရောက်သေးပါဘူး။
    sources:
      - title: "web.dev Learn CSS — Custom properties"
        url: "https://web.dev/learn/css/custom-properties"
      - title: "MDN — HTML class global attribute"
        url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Global_attributes/class"
    actions:
      - id: close-why-board
        type: whiteboard.apply
        at: { mark: close-why }
        open: false
      - id: open-index
        type: workspace.openFile
        at: { mark: open-index }
        path: index.html
      - id: select-header
        type: editor.select
        at: { mark: select-header }
        target:
          {
            file: index.html,
            text: '<header class="site-header" id="site-header" data-testid="site-header">',
            occurrence: 1,
          }
      - id: select-theme
        type: editor.select
        at: { mark: select-theme }
        target:
          {
            file: index.html,
            text: '<div class="theme-buttons" role="group" aria-label="ဆိုင်ရဲ့ အရောင်" data-testid="theme-buttons">',
            occurrence: 1,
          }
      - id: select-featured
        type: editor.select
        at: { mark: select-featured }
        target:
          {
            file: index.html,
            text: '<li class="menu-card featured" id="today-special" data-temp="hot" data-testid="card-laphet-yay">',
            occurrence: 1,
          }
      - id: select-cup
        type: editor.select
        at: { mark: select-cup }
        target:
          {
            file: index.html,
            text: '<div class="cup" data-testid="cup"><div class="cup-fill"></div></div>',
            occurrence: 1,
          }
      - id: select-broken
        type: editor.select
        at: { mark: select-broken }
        target:
          {
            file: index.html,
            text: '<button class="order-btn broken" type="button" data-testid="broken-button">ဖုန်းဆက်ရန်</button>',
            occurrence: 1,
          }
      - id: open-styles
        type: workspace.openFile
        at: { mark: open-styles }
        path: styles.css
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { mark: preview-opens }
        timeoutMs: 20000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-dev-server }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-shop-name
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: shop-name }
        textContains: "ရွှေလက်ဖက်ရည်ဆိုင်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-theme-buttons
        type: expect.preview
        at: { afterAction: expect-shop-name }
        timeoutMs: 5000
        target: { by: testId, value: theme-buttons }
        textContains: "ကော်ဖီ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: collapse-runner-dock
        type: runtime.collapseDock
        at: { afterAction: expect-theme-buttons }

  - id: declare
    chapter: "ဆိုင်ရဲ့ အရောင်ကို custom property ထဲ ထည့်ရအောင်"
    narration: >
      [[mark:type-root]] ဖိုင်ရဲ့ အပေါ်ဆုံးမှာ custom property နှစ်ခု ကြေညာကြည့်ရအောင်။ brand က ဆိုင်ရဲ့
      အရောင်၊ space က padding အတွက် နေရာလွတ် ပမာဏပါ။ ရိုက်နေတုန်း preview ကို ကြည့်ထားပါ။
      [[mark:after-root]] ဘာမှ မပြောင်းပါဘူး။ ကြေညာတာက တန်ဖိုးကို သိမ်းထားရုံပဲ ဖြစ်ပြီး၊ ဖတ်မယ့် rule
      မရှိသေးလို့ပါ။ [[mark:select-name]] နာမည်ကို ကြည့်ပါ။ တုံးတို နှစ်ခုနဲ့ အမြဲ စပါတယ်။ browser ရဲ့
      property တွေထဲမှာ ဒီလို စတာ မရှိလို့၊ နောက်ပိုင်း property အသစ် ထွက်လာရင်တောင် ကိုယ့် နာမည်နဲ့
      မထပ်ပါဘူး။ နာမည်က စာလုံး အကြီး အသေးလည်း ခွဲပါတယ်။ b အသေးနဲ့ ရေးတဲ့ brand နဲ့ B အကြီးနဲ့ ရေးတဲ့ brand
      က မတူတဲ့ property နှစ်ခုပါ။ [[mark:select-root]] အခု root selector ကို ကြည့်ပါ။ သူက page
      တစ်ခုလုံးကို ထုပ်ထားတဲ့ html element ကို ရွေးလို့၊ ဒီမှာ သိမ်းတဲ့ တန်ဖိုးကို ဘယ် element ကမဆို
      ဖတ်လို့ ရပါတယ်။ ဒါကြောင့် page တစ်ခုလုံးမှာ သုံးမယ့် တန်ဖိုးတွေကို root မှာ ထားကြပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Custom properties: creating properties"
        url: "https://web.dev/learn/css/custom-properties#creating_properties"
      - title: "MDN — Custom properties (--*)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/--*"
      - title: "MDN — :root"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/:root"
      - title: "CSS Custom Properties Level 1 — defining custom properties"
        url: "https://www.w3.org/TR/css-variables-1/#defining-variables"
    actions:
      - id: type-root
        type: editor.type
        at: { mark: type-root }
        cadence: fast-explainer
        target: { file: styles.css, after: "", occurrence: 1 }
        text: ":root {\n  --brand: saddlebrown;\n  --space: 12px;\n}\n"
      - id: expect-root-header
        type: expect.preview
        at: { mark: after-root }
        timeoutMs: 4000
        target: { by: testId, value: site-header }
        textContains: "ရွှေလက်ဖက်ရည်ဆိုင်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-name
        type: editor.select
        at: { mark: select-name }
        target: { file: styles.css, text: "--brand", occurrence: 1 }
      - id: select-root
        type: editor.select
        at: { mark: select-root }
        target: { file: styles.css, text: ":root", occurrence: 1 }

  - id: use-var
    narration: >
      [[mark:type-uses]] အခု brand ကို rule သုံးခုကနေ ဖတ်ကြည့်ရအောင်။ header ရဲ့ နောက်ခံ၊ ဈေးနှုန်းရဲ့
      အရောင်၊ ပြီးတော့ မှာယူရန် link နဲ့ form ထဲက ခလုတ်တွေရဲ့ နောက်ခံပါ။ [[mark:after-uses]] header မှာ အညိုရောင် ပေါ်လာပြီး၊ မှာယူရန် link နဲ့ ဈေးနှုန်းလည်း အညိုရောင် ရပါပြီ။ [[mark:select-var]] ဒီ var
      function ကို ကြည့်ပါ။ သူက custom property ရဲ့ နာမည်ကို ယူပြီး၊ သူ့ကို သုံးတဲ့ element မှာ ရှိနေတဲ့
      တန်ဖိုးနဲ့ အစားထိုးပေးပါတယ်။ ဒါကြောင့် rule သုံးခုလုံးက အညိုရောင်ကို တစ်ကြောင်းတည်းကနေ ယူတာပါ။
    sources:
      - title: "web.dev Learn CSS — Custom properties: using a custom property"
        url: "https://web.dev/learn/css/custom-properties#using_a_custom_property"
      - title: "web.dev Learn CSS — Functions: custom properties and var()"
        url: "https://web.dev/learn/css/functions"
      - title: "MDN — var()"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/var"
    actions:
      - id: type-uses
        type: editor.type
        at: { mark: type-uses }
        cadence: line-by-line
        target: { file: styles.css, after: "  --space: 12px;\n}\n", occurrence: 1 }
        text: "\n.site-header {\n  background: var(--brand);\n}\n\n.price {\n  color: var(--brand);\n}\n\n.order-link,\n.order-btn {\n  background: var(--brand);\n}\n"
      - id: expect-order-link
        type: expect.preview
        at: { mark: after-uses }
        timeoutMs: 4000
        target: { by: testId, value: order-link }
        textContains: "မှာယူရန်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-var
        type: editor.select
        at: { mark: select-var }
        target: { file: styles.css, text: "var(--brand)", occurrence: 1 }

  - id: retheme
    narration: >
      [[mark:type-green]] အခု အသုံးဝင်ပုံကို မြင်ရပါမယ်။ အညိုရောင် declaration အောက်မှာ brand ကို
      အစိမ်းရောင် ထပ်ပေးပါမယ်။ [[mark:after-green]] header၊ မှာယူရန် link နဲ့ ဈေးနှုန်း တစ်ပြိုင်နက်
      အစိမ်းရောင် ပြောင်းသွားပါပြီ။ cascade lesson မှာ တွေ့ခဲ့သလို နောက်မှ ရေးတာ နိုင်ပြီး၊ brand ကို
      ဖတ်တဲ့ နေရာတိုင်းက လိုက်ပြောင်းတာပါ။ [[mark:live-note]] ဒီ brand လို custom property တွေက page
      ပွင့်နေသရွေ့ browser ထဲမှာ ရှိနေလို့၊ တန်ဖိုး ပြောင်းတာနဲ့ သုံးထားတဲ့ နေရာတိုင်း လိုက်ပြောင်းပါတယ်။ Sass လို
      tool တွေရဲ့ variable တွေကတော့ browser ဆီ မရောက်ခင်ပဲ ရိုးရိုး တန်ဖိုး ဖြစ်သွားလို့ ဒီလို မရပါဘူး။
    sources:
      - title: "web.dev Learn CSS — Custom properties"
        url: "https://web.dev/learn/css/custom-properties"
      - title: "MDN — Using CSS custom properties: values are computed when used"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/Using_CSS_custom_properties"
    actions:
      - id: type-green
        type: editor.type
        at: { mark: type-green }
        cadence: line-by-line
        target: { file: styles.css, after: "  --brand: saddlebrown;\n", occurrence: 1 }
        text: "  --brand: darkgreen;\n"
      - id: expect-green-header
        type: expect.preview
        at: { mark: after-green }
        timeoutMs: 4000
        target: { by: testId, value: shop-name }
        textContains: "ရွှေလက်ဖက်ရည်ဆိုင်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-green
        type: editor.select
        at: { mark: live-note }
        target: { file: styles.css, text: "  --brand: darkgreen;", occurrence: 1 }

  - id: inherit-live
    chapter: "Inherit ဖြစ်ပုံနဲ့ override လုပ်ပုံ"
    narration: >
      [[mark:scroll-drinks]] သောက်စရာ menu ဆီ ဆင်းကြည့်ရအောင်။ [[mark:type-featured]] featured card
      ကိုတော့ ကိုယ်ပိုင် brand အဖြစ် ရွှေရောင်ရင့် ပေးပါမယ်။ [[mark:after-featured]] ဒီနေ့ အထူး card ပဲ
      ပြောင်းပါတယ်။ သူ့ ဈေးနှုန်းက ရွှေရောင် ဖြစ်ပြီး၊ ကျန်တာတွေက အစိမ်းရောင် အတိုင်းပါ။
      [[mark:open-tree]] ဘာလို့ ဒီ card တစ်ခုပဲလဲ။ page ကို tree နဲ့ ဆွဲကြည့်ရအောင်။
    sources:
      - title: "web.dev Learn CSS — Custom properties: overriding and inheritance"
        url: "https://web.dev/learn/css/custom-properties#overriding_and_inheritance"
      - title: "MDN — Using CSS custom properties: inheritance"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/Using_CSS_custom_properties#inheritance_of_custom_properties"
    actions:
      - id: scroll-drinks
        type: preview.scroll
        at: { mark: scroll-drinks }
        timeoutMs: 5000
        top: 478
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-featured
        type: editor.type
        at: { mark: type-featured }
        cadence: line-by-line
        target:
          {
            file: styles.css,
            after: ".order-btn {\n  background: var(--brand);\n}\n",
            occurrence: 1,
          }
        text: "\n.featured {\n  --brand: #8b6914;\n}\n"
      - id: expect-featured-price
        type: expect.preview
        at: { mark: after-featured }
        timeoutMs: 4000
        target: { by: testId, value: price-laphet-yay }
        textContains: "1,500"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: open-tree
        type: whiteboard.apply
        at: { mark: open-tree }
        open: true
        clear: true
        upsertIds: [b-title]

  - id: inherit-board
    narration: >
      [[mark:draw-root]] custom property တွေလည်း inheritance lesson က စာလုံး အရောင်လို inherit ဖြစ်ပါတယ်။
      root မှာ အစိမ်းရောင် ရှိပါတယ်။ [[mark:draw-children]] ဒါကြောင့် header နဲ့ menu က အစိမ်းရောင် ရပြီး၊
      menu ထဲက card တိုင်းလည်း အစိမ်းရောင် ရပါတယ်။ [[mark:draw-featured]] ဒါပေမဲ့ featured card က
      ကိုယ်ပိုင် တန်ဖိုး ပေးထားပါတယ်။ element က ကိုယ်ပိုင် တန်ဖိုး မရှိမှ inherit ဖြစ်တဲ့ တန်ဖိုးကို
      ယူလို့၊ ဒီ card က ရွှေရောင်ကို သုံးပါတယ်။ [[mark:draw-prices]] ဈေးနှုန်း တစ်ခုစီက သူ့ card ဆီက
      inherit ဖြစ်လို့၊ ဒီနေ့ အထူး card ထဲမှာ ရွှေရောင်၊ ကျန်တဲ့ နေရာမှာ အစိမ်းရောင်ပါ။ rule တစ်ခုက tree
      ရဲ့ branch တစ်ခုကိုပဲ ပြောင်းပြီး၊ branch အပြင်ကို မထိပါဘူး။ [[mark:draw-note]] custom property
      ကလည်း သာမန် declaration ဖြစ်လို့ cascade က သူ့ တန်ဖိုးကို တခြား declaration တွေလိုပဲ ရွေးပါတယ်။
      specificity၊ ရေးထားတဲ့ အစဉ်၊ layer တွေ အကုန် သက်ဆိုင်ပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Custom properties: overriding and inheritance"
        url: "https://web.dev/learn/css/custom-properties#overriding_and_inheritance"
      - title: "CSS Custom Properties Level 1 — custom properties are ordinary, inherited properties"
        url: "https://www.w3.org/TR/css-variables-1/#defining-variables"
      - title: "web.dev Learn CSS — Inheritance"
        url: "https://web.dev/learn/css/inheritance"
    actions:
      - id: draw-root
        type: whiteboard.apply
        at: { mark: draw-root }
        upsertIds: [b-root-box, b-root]
        drawMs: 1400
      - id: draw-children
        type: whiteboard.apply
        at: { mark: draw-children }
        upsertIds:
          [
            b-arr-header,
            b-header-box,
            b-header,
            b-arr-menu,
            b-menu-box,
            b-menu,
            b-arr-card,
            b-card-box,
            b-card,
          ]
        drawMs: 4500
      - id: draw-featured
        type: whiteboard.apply
        at: { mark: draw-featured }
        upsertIds: [b-arr-featured, b-featured-box, b-featured]
        drawMs: 2000
      - id: draw-prices
        type: whiteboard.apply
        at: { mark: draw-prices }
        upsertIds: [b-arr-gold, b-price-gold, b-arr-green, b-price-green]
        drawMs: 3000
      - id: draw-note
        type: whiteboard.apply
        at: { mark: draw-note }
        upsertIds: [b-note]
        drawMs: 1600

  - id: space-media
    narration: >
      [[mark:close-tree]] space တန်ဖိုးလည်း ဒီလိုပဲ အလုပ်လုပ်ပါတယ်။ [[mark:type-space]] menu card
      တိုင်းရဲ့ padding ကို space ကနေ ယူကြည့်ရအောင်။ [[mark:after-space]] အခု card တွေရဲ့ လေးဘက်လုံးမှာ
      နေရာလွတ် တူတူ ရပါပြီ။ [[mark:type-media]] နောက်တစ်ဆင့်က screen အကျယ် 40 em ထက် ကျဉ်းရင် space
      တန်ဖိုးကို ပြောင်းပေးမယ့် media query ပါ။ [[mark:after-media]] card တွေရဲ့ အထဲမှာ နေရာလွတ်
      ပိုချောင်လာပါပြီ။ preview က 27 em လောက်ပဲ ကျယ်လို့ ဒီ media query က အလုပ်လုပ်ပါတယ်။ screen
      ကျယ်ရင်တော့ နေရာလွတ် သေးသေး အတိုင်းပဲ ကျန်ပါမယ်။ [[mark:select-media]] ဒီ media query ကို ကြည့်ပါ။
      card တွေကို လုံးဝ မရွေးထားပါဘူး။ တန်ဖိုးကိုပဲ ပြောင်းပေးပြီး၊ အဲဒီ တန်ဖိုးကို ဖတ်တဲ့ rule တိုင်းက
      လိုက်ပြောင်းသွားတာပါ။ [[mark:no-var-in-query]] ပြောင်းပြန် လုပ်လို့တော့ မရပါဘူး။ var function ကို
      property ရဲ့ တန်ဖိုးထဲမှာပဲ သုံးလို့ ရပြီး၊ media query ရဲ့ အခြေအနေ၊ selector နဲ့ property
      နာမည်ထဲမှာ ထည့်လို့ မရပါဘူး။
    sources:
      - title: "web.dev Learn CSS — Custom properties: overriding and inheritance (media queries)"
        url: "https://web.dev/learn/css/custom-properties#overriding_and_inheritance"
      - title: "MDN — var(): where it can be used"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/var"
      - title: "CSS Custom Properties Level 1 — using cascading variables"
        url: "https://www.w3.org/TR/css-variables-1/#using-variables"
    actions:
      - id: close-tree
        type: whiteboard.apply
        at: { mark: close-tree }
        open: false
      - id: type-space
        type: editor.type
        at: { mark: type-space }
        cadence: line-by-line
        target: { file: styles.css, after: "  --brand: #8b6914;\n}\n", occurrence: 1 }
        text: "\n.menu-card {\n  padding: var(--space);\n}\n"
      - id: expect-space-card
        type: expect.preview
        at: { mark: after-space }
        timeoutMs: 4000
        target: { by: testId, value: card-coffee }
        textContains: "ကော်ဖီ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-media
        type: editor.type
        at: { mark: type-media }
        cadence: line-by-line
        target: { file: styles.css, after: "  padding: var(--space);\n}\n", occurrence: 1 }
        text: "\n@media (width < 40em) {\n  :root {\n    --space: 20px;\n  }\n}\n"
      - id: expect-media-card
        type: expect.preview
        at: { mark: after-media }
        timeoutMs: 4000
        target: { by: testId, value: card-lime-juice }
        textContains: "သံပုရာရည်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-media
        type: editor.select
        at: { mark: select-media }
        target: { file: styles.css, text: "@media (width < 40em) {", occurrence: 1 }

  - id: fallback
    chapter: "Fallback တန်ဖိုး"
    narration: >
      [[mark:type-fallback]] custom property တစ်ခုကို ဘယ်မှာမှ မပေးထားရင် ဘာဖြစ်မလဲ။ ဈေးနှုန်း အရောင်ကို
      price color ဆိုတဲ့ property ကနေ ဖတ်ခိုင်းပြီး၊ comma နောက်မှာ ဒုတိယ တန်ဖိုး တစ်ခု ထည့်ကြည့်ရအောင်။
      [[mark:after-fallback]] ဘာမှ မပြောင်းပါဘူး။ price color မရှိလို့ var က ပထမ comma နောက်က တန်ဖိုးကို
      ယူပါတယ်။ cascade lesson က fallback declaration လိုပဲ၊ ဒါက var ရဲ့ fallback ပါ။
      [[mark:select-fallback]] ဒီ var function ကို ကြည့်ပါ။ သူ့ fallback က brand ကို ဖတ်တဲ့ နောက်ထပ် var
      တစ်ခုပါ။ ဒါကို nested fallback လို့ ခေါ်ပြီး၊ price color ကို အရင် ရှာ၊ မရှိရင် brand ကို သုံး
      ဆိုတဲ့ အဓိပ္ပာယ်ပါ။ ဖတ်ရ ရှင်းအောင် ဒီလို ဆင့်တာကို တိုတိုပဲ ထားပါ။ [[mark:type-price-color]] အခု
      price color ကို featured card မှာပဲ ပေးကြည့်ရအောင်။ [[mark:after-price-color]] သူ့ ဈေးနှုန်း
      အနီရောင် ဖြစ်သွားပြီး၊ ကျန်တာတွေကတော့ fallback ဖြစ်တဲ့ brand ကို ဆက်သုံးပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Custom properties: fallbacks"
        url: "https://web.dev/learn/css/custom-properties#fallbacks"
      - title: "web.dev Learn CSS — Functions: custom properties and var()"
        url: "https://web.dev/learn/css/functions"
      - title: "MDN — var(): syntax and fallback values"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/var#syntax"
    actions:
      - id: type-fallback
        type: editor.type
        at: { mark: type-fallback }
        cadence: line-by-line
        target: { file: styles.css, after: "  color: var(--brand);\n", occurrence: 1 }
        text: "  color: var(--price-color, var(--brand));\n"
      - id: expect-fallback-price
        type: expect.preview
        at: { mark: after-fallback }
        timeoutMs: 4000
        target: { by: testId, value: card-coffee }
        textContains: "1,800"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-fallback
        type: editor.select
        at: { mark: select-fallback }
        target: { file: styles.css, text: "var(--price-color, var(--brand))", occurrence: 1 }
      - id: type-price-color
        type: editor.type
        at: { mark: type-price-color }
        cadence: line-by-line
        target: { file: styles.css, after: "  --brand: #8b6914;\n", occurrence: 1 }
        text: "  --price-color: crimson;\n"
      - id: expect-price-color
        type: expect.preview
        at: { mark: after-price-color }
        timeoutMs: 4000
        target: { by: testId, value: price-laphet-yay }
        textContains: "1,500"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: unit-trap
    chapter: "တန်ဖိုး မှားရင် ဘာဖြစ်လဲ"
    narration: >
      [[mark:scroll-hero]] custom property ကို တခြား function ထဲမှာလည်း သုံးလို့ ရပေမယ့်၊ unit မှာ
      သတိထားစရာ ရှိပါတယ်။ [[mark:type-size]] root မှာ unit မပါတဲ့ ဂဏန်း 20 ကို size ဆိုတဲ့ နာမည်နဲ့
      သိမ်းပါမယ်။ [[mark:type-hero-px]] ပြီးရင် ကြိုဆိုတဲ့ အပိုင်းကို အဲဒီ ဂဏန်းနဲ့ padding ပေးပြီး၊ var
      function ရဲ့ နောက်မှာ pixel unit ကို တန်းကပ်ရေးပါမယ်။ [[mark:after-hero-px]] ကြိုဆိုတဲ့ အပိုင်းက 20
      pixel မရပါဘူး။ မူလ 16 pixel တောင် ပျောက်သွားလို့၊ စာသားတွေက အစွန်းနဲ့ ကပ်နေပါပြီ။
      [[mark:select-px]] ဒီ padding ကို ကြည့်ပါ။ var က တန်ဖိုးကို သီးသန့် အပိုင်း အဖြစ် ထည့်လို့၊ ရလဒ်က 20
      ဆိုတဲ့ ဂဏန်းနဲ့ သီးခြား unit တစ်ခု ဖြစ်နေပါတယ်။ အပိုင်း နှစ်ခုက length တစ်ခု မဟုတ်လို့ တန်ဖိုး
      မှားပါတယ်။ မူလ padding ဘာကြောင့် ပျောက်လဲ ဆိုတာ ခဏနေ ကြည့်ပါမယ်။ [[mark:type-calc]] ဖြေရှင်းနည်းက
      calc ထဲမှာ ဂဏန်းကို 1 pixel နဲ့ မြှောက်တာပါ။ ဂဏန်းကို length နဲ့ မြှောက်ရင် length ရလို့၊ browser က
      မှန်တဲ့ တန်ဖိုး တစ်ခုတည်းကို ရပါတယ်။ [[mark:after-calc]] အခု စာသားနဲ့ အစွန်းကြားမှာ 20 pixel
      နေရာလွတ် ရပါပြီ။ calc ကို နောက် lesson မှာ ကြည့်ပါမယ်။ အရောင် function တွေမှာလည်း ဒီလိုပဲ၊ custom property ထဲက hue ကို
      OKLCH အရောင်ထဲ ထည့်လို့ ရပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Custom properties: using a custom property (inside other functions)"
        url: "https://web.dev/learn/css/custom-properties#using_a_custom_property"
      - title: "MDN — var(): values substitute as tokens"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/var"
      - title: "MDN — calc()"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/calc"
    actions:
      - id: scroll-hero
        type: preview.scroll
        at: { mark: scroll-hero }
        timeoutMs: 5000
        top: 0
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-size
        type: editor.type
        at: { mark: type-size }
        cadence: natural
        target: { file: styles.css, after: "  --space: 12px;\n", occurrence: 1 }
        text: "  --size: 20;\n"
      - id: type-hero-px
        type: editor.type
        at: { mark: type-hero-px }
        cadence: fast-explainer
        target: { file: styles.css, after: "    --space: 20px;\n  }\n}\n", occurrence: 1 }
        text: "\n.hero {\n  padding: var(--size)px;\n}\n"
      - id: expect-hero-px
        type: expect.preview
        at: { mark: after-hero-px }
        timeoutMs: 4000
        target: { by: testId, value: hero }
        textContains: "မင်္ဂလာပါ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-px
        type: editor.select
        at: { mark: select-px }
        target: { file: styles.css, text: "var(--size)px", occurrence: 1 }
      # Typed into the LAST rule of the file: while calc( is open it can only
      # swallow the end of its own rule.
      - id: type-calc
        type: editor.type
        at: { mark: type-calc }
        cadence: natural
        target: { file: styles.css, after: "  padding: var(--size)px;\n", occurrence: 1 }
        text: "  padding: calc(var(--size) * 1px);\n"
      - id: expect-hero-calc
        type: expect.preview
        at: { mark: after-calc }
        timeoutMs: 4000
        target: { by: testId, value: order-link }
        textContains: "မှာယူရန်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: iacvt-live
    narration: >
      [[mark:scroll-form]] အော်ဒါ form ဆီ ဆင်းကြည့်ရအောင်။ [[mark:type-direct]] ပထမ form ထဲက ခလုတ်
      နှစ်ခုလုံးကို နောက်ခံ အရောင်အဖြစ် 12 pixel ဆိုတဲ့ length ကို တမင် ပေးကြည့်ပါမယ်။ [[mark:after-direct]]
      ဘာမှ မပြောင်းပါဘူး။ length က ဘယ်တော့မှ အရောင် မဖြစ်လို့၊ lesson 1 က စာလုံးပေါင်း မှားတဲ့ declaration
      လိုပဲ browser က ဖိုင်ကို ဖတ်တုန်းမှာ ကျော်သွားပါတယ်။ အစိမ်းရောင် ကျန်ပါတယ်။ [[mark:type-broken]] အခု
      broken ခလုတ်ကိုပဲ အဲဒီလို မှားတဲ့ တန်ဖိုးမျိုး ပေးကြည့်ရအောင်။ ဒီတစ်ခါတော့ length တစ်ခု
      သိမ်းထားတဲ့ space property ကနေ တစ်ဆင့် ပေးပါမယ်။ [[mark:after-broken]] ဒီတစ်ခါ ခလုတ်ရဲ့ နောက်ခံ
      လုံးဝ ပျောက်သွားပါပြီ။ ပတ်ပတ်လည်က အနီရောင် မျဉ်းပြတ်လေးကပဲ ခလုတ် ရှိတဲ့ နေရာကို ပြနေပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Custom properties: invalid values"
        url: "https://web.dev/learn/css/custom-properties#invalid_values"
      - title: "MDN — Using CSS custom properties: invalid custom properties"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/Using_CSS_custom_properties#invalid_custom_properties"
    actions:
      - id: scroll-form
        type: preview.scroll
        at: { mark: scroll-form }
        timeoutMs: 5000
        top: 5000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-direct
        type: editor.type
        at: { mark: type-direct }
        cadence: fast-explainer
        target:
          { file: styles.css, after: "  padding: calc(var(--size) * 1px);\n}\n", occurrence: 1 }
        text: "\n.order-btn {\n  background-color: 12px;\n}\n"
      - id: expect-order-button
        type: expect.preview
        at: { mark: after-direct }
        timeoutMs: 4000
        target: { by: testId, value: order-button }
        textContains: "မှာမယ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-broken
        type: editor.type
        at: { mark: type-broken }
        cadence: fast-explainer
        target: { file: styles.css, after: "  background-color: 12px;\n}\n", occurrence: 1 }
        text: "\n.order-btn.broken {\n  background-color: var(--space);\n}\n"
      - id: expect-broken-button
        type: expect.preview
        at: { mark: after-broken }
        timeoutMs: 4000
        target: { by: testId, value: broken-button }
        textContains: "ဖုန်းဆက်ရန်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: iacvt-board
    narration: >
      [[mark:open-iacvt]] ရလဒ် နှစ်ခု ဘာကြောင့် မတူတာလဲ။ [[mark:draw-direct]] browser က ဖိုင်ကို ဖတ်တဲ့အခါ
      declaration တစ်ခုချင်းကို စစ်ပါတယ်။ 12 pixel က အရောင် မဟုတ်မှန်း တန်းသိလို့၊ အဲဒီ declaration ကို
      အဲဒီမှာတင် ကျော်လိုက်ပြီး၊ အရင်က အစိမ်းရောင်က ဆက်နိုင်နေပါတယ်။ [[mark:draw-var-code]] var ပါတဲ့
      declaration ကိုတော့ ဖတ်တုန်းမှာ မစစ်နိုင်ပါဘူး။ custom property ထဲမှာ ဘာ တန်ဖိုး ရှိမလဲ ဆိုတာ
      browser က မသိသေးလို့ပါ။ [[mark:draw-accept]] ဒါကြောင့် လက်ခံပါတယ်။ [[mark:draw-wins]] သူ့ selector က
      specificity ပိုများလို့ cascade က သူ့ကို ရွေးပြီး၊ အစိမ်းရောင် declaration က ရှုံးသွားပါတယ်။
      [[mark:draw-substitute]] အဲဒီနောက်မှ browser က space ထဲက length ကို အစားထိုး ထည့်ပါတယ်။
      [[mark:draw-not-colour]] length က အရောင် မဟုတ်ပေမယ့်၊ အစိမ်းရောင် declaration က ရှုံးပြီးသားပါ။
      [[mark:draw-unset]] ဒါကြောင့် property က unset ပေးထားသလို ဖြစ်သွားပါတယ်။ နောက်ခံ အရောင်က inherit
      မဖြစ်လို့၊ initial value ဖြစ်တဲ့ transparent ကို ရပါတယ်။ [[mark:draw-term]] invalid at
      computed-value time ဆိုတာ တန်ဖိုး ထည့်ပြီးမှ မှားမှန်း သိတာပါ။ ကြိုဆိုတဲ့ အပိုင်း padding
      ပျောက်တာလည်း ဒါကြောင့်ပါ။ [[mark:draw-no-fallback]] ဒီနေရာမှာ fallback က မကူညီနိုင်ပါဘူး။ fallback
      ကို custom property မရှိမှပဲ သုံးတာ ဖြစ်ပြီး၊ ရှိပေမယ့် တန်ဖိုး မှားနေရင် မသုံးပါဘူး။
    sources:
      - title: "web.dev Learn CSS — Custom properties: invalid values"
        url: "https://web.dev/learn/css/custom-properties#invalid_values"
      - title: "CSS Custom Properties Level 1 — invalid at computed-value time"
        url: "https://www.w3.org/TR/css-variables-1/#invalid-at-computed-value-time"
      - title: "MDN — unset"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/unset"
    actions:
      - id: open-iacvt
        type: whiteboard.apply
        at: { mark: open-iacvt }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-direct
        type: whiteboard.apply
        at: { mark: draw-direct }
        upsertIds: [c-d-code, c-d-arrow, c-d-skip, c-d-keep]
        drawMs: 3600
      - id: draw-var-code
        type: whiteboard.apply
        at: { mark: draw-var-code }
        upsertIds: [c-v-code]
        drawMs: 1800
      - id: draw-accept
        type: whiteboard.apply
        at: { mark: draw-accept }
        upsertIds: [c-v-1]
        drawMs: 1000
      - id: draw-wins
        type: whiteboard.apply
        at: { mark: draw-wins }
        upsertIds: [c-v-2]
        drawMs: 1400
      - id: draw-substitute
        type: whiteboard.apply
        at: { mark: draw-substitute }
        upsertIds: [c-v-3]
        drawMs: 1200
      - id: draw-not-colour
        type: whiteboard.apply
        at: { mark: draw-not-colour }
        upsertIds: [c-v-4]
        drawMs: 1200
      - id: draw-unset
        type: whiteboard.apply
        at: { mark: draw-unset }
        upsertIds: [c-v-5]
        drawMs: 1400
      - id: draw-term
        type: whiteboard.apply
        at: { mark: draw-term }
        upsertIds: [c-term]
        drawMs: 1600
      - id: draw-no-fallback
        type: whiteboard.apply
        at: { mark: draw-no-fallback }
        upsertIds: [c-fallback]
        drawMs: 1000

  - id: at-property
    chapter: "Property at-rule နဲ့ type ပေးရအောင်"
    narration: >
      [[mark:close-iacvt]] custom property ရဲ့ type ကို browser က စစ်ပေးနိုင်ရင် ဘယ်လိုလဲ။
      [[mark:scroll-cup]] ခွက်အလွတ်ကို ဖြည့်ကြည့်ရအောင်။ [[mark:type-property]] property at-rule နဲ့ tea
      level ဆိုတဲ့ custom property ကို type နဲ့ register လုပ်ပြီး၊ ခွက်ထဲက လက်ဖက်ရည်ရဲ့ အမြင့်ကို အဲဒါကနေ
      ဖတ်ခိုင်းပါမယ်။ [[mark:after-property]] ခွက်ထဲမှာ 30 ရာခိုင်နှုန်း ပြည့်နေပါပြီ။ tea level ကို
      ဘယ်မှာမှ မပေးရသေးလို့၊ register လုပ်တုန်းက စတန်ဖိုးကို သုံးနေတာပါ။
      [[mark:open-prop-board]] at-rule ထဲမှာ အချက် သုံးခု ပါပါတယ်။ [[mark:draw-syntax]] syntax က ဘယ် type
      တန်ဖိုးကို လက်ခံမလဲ ပြောပါတယ်။ ဒီမှာတော့ ရာခိုင်နှုန်းပါ။ [[mark:draw-inherits]] inherits က child
      တွေဆီ တန်ဖိုး ရောက်မရောက် ပြောပါတယ်။ ဒီမှာတော့ မရောက်ပါဘူး။ နာမည်ရဲ့ အဆုံးမှာ s ပါတာကို သတိထားပါ။
      [[mark:draw-initial]] initial value က property ရဲ့ စတန်ဖိုးပါ။ browser က element ကို မကြည့်ဘဲ
      သိနိုင်တဲ့ တန်ဖိုး ဖြစ်ရလို့၊ 30 ရာခိုင်နှုန်း ရပေမယ့် font size ပေါ် မူတည်တဲ့ em မရပါဘူး။
      [[mark:draw-missing]]
      syntax နဲ့ inherits က အမြဲ ပါရပါမယ်။ initial value လည်း ပါရပြီး၊ syntax က ဘာမဆို လက်ခံမှသာ ချန်လို့
      ရပါတယ်။ တစ်ခု မပါရင် browser က rule တစ်ခုလုံးကို မသုံးပါဘူး။
    sources:
      - title: "web.dev Learn CSS — Custom properties: more control with @property"
        url: "https://web.dev/learn/css/custom-properties#more_control_with_property"
      - title: "MDN — @property"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/@property"
      - title: "CSS Properties and Values API Level 1 — the @property rule"
        url: "https://www.w3.org/TR/css-properties-values-api-1/#at-property-rule"
    actions:
      - id: close-iacvt
        type: whiteboard.apply
        at: { mark: close-iacvt }
        open: false
      - id: scroll-cup
        type: preview.scroll
        at: { mark: scroll-cup }
        timeoutMs: 5000
        top: 1070
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-property
        type: editor.type
        at: { mark: type-property }
        cadence: line-by-line
        target: { file: styles.css, after: "  background-color: var(--space);\n}\n", occurrence: 1 }
        text: "\n@property --tea-level {\n  syntax: \"<percentage>\";\n  inherits: false;\n  initial-value: 30%;\n}\n\n.cup-fill {\n  height: var(--tea-level);\n}\n"
      - id: expect-cup
        type: expect.preview
        at: { mark: after-property }
        timeoutMs: 4000
        target: { by: testId, value: pour }
        textContains: "လက်ဖက်ရည် တစ်ခွက်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: open-prop-board
        type: whiteboard.apply
        at: { mark: open-prop-board }
        open: true
        clear: true
        upsertIds: [d-title, d-frame]
      - id: draw-syntax
        type: whiteboard.apply
        at: { mark: draw-syntax }
        upsertIds: [d-syn-k, d-syn-v]
        drawMs: 1800
      - id: draw-inherits
        type: whiteboard.apply
        at: { mark: draw-inherits }
        upsertIds: [d-inh-k, d-inh-v]
        drawMs: 1800
      - id: draw-initial
        type: whiteboard.apply
        at: { mark: draw-initial }
        upsertIds: [d-ini-k, d-ini-v]
        drawMs: 1800
      - id: draw-missing
        type: whiteboard.apply
        at: { mark: draw-missing }
        upsertIds: [d-missing]
        drawMs: 1600

  - id: at-property-live
    narration: >
      [[mark:close-prop-board]] tea level ကို ခွက်ထဲက လက်ဖက်ရည်မှာ ပေးကြည့်ရအောင်။ [[mark:type-seventy]]
      ဖတ်နေတဲ့ element ကိုယ်တိုင်မှာပဲ 70 ရာခိုင်နှုန်း ပေးပါမယ်။ [[mark:after-seventy]] ခွက်က 70
      ရာခိုင်နှုန်းထိ ပြည့်ပါပြီ။ [[mark:type-lots]] အခု ရာခိုင်နှုန်း လုံးဝ မဟုတ်တဲ့ lots ဆိုတဲ့
      စကားလုံးကို ပေးကြည့်ပါမယ်။ [[mark:after-lots]] ခွက်က 30 ရာခိုင်နှုန်း ပြန်ဖြစ်ပါပြီ။
      [[mark:select-syntax]] ဒီ syntax ကို ကြည့်ပါ။ register လုပ်ထားတဲ့ property ရဲ့ တန်ဖိုးကို cascade
      ပြီးမှ syntax နဲ့ စစ်လို့၊ 70 ရာခိုင်နှုန်းက ရှုံးပြီးသားပါ။ ဒါကြောင့် tea level က unset လို
      ဖြစ်ပြီး၊ inherit မဖြစ်လို့ initial value ကို ရပါတယ်။ register မလုပ်ရင်တော့ အမြင့်က unset ဖြစ်ပြီး
      ခွက် အလွတ် ဖြစ်မှာပါ။ [[mark:select-inherits]] ဒီ inherits ကို ကြည့်ပါ။ tea level ကို ခွက်မှာ မပေးဘဲ
      ဘာလို့ အထဲက လက်ဖက်ရည်မှာ ပေးတာလဲ။ inherits က false ဖြစ်လို့ ခွက်မှာ ပေးရင် အထဲကို မရောက်ဘဲ၊ 30
      ရာခိုင်နှုန်းမှာပဲ ကျန်နေမှာမို့ပါ။ [[mark:animate-note]] register လုပ်ရင် browser က type ကို
      သိလို့ တန်ဖိုးကို ချောချောမွေ့မွေ့ animate လုပ်နိုင်ပါသေးတယ်။ lesson 38 မှာ ဒီ ခွက်ကို transition နဲ့
      ဖြည့်ပါမယ်။ property at-rule ကို 2024 ခုနှစ်ကတည်းက browser အဓိက အားလုံးမှာ သုံးလို့ ရပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Custom properties: more control with @property"
        url: "https://web.dev/learn/css/custom-properties#more_control_with_property"
      - title: "MDN — @property: inherits"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/@property/inherits"
      - title: "MDN — @property: initial-value"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/@property/initial-value"
      - title: "MDN — @property: syntax"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/@property/syntax"
      - title: "web.dev — @property: Next-gen CSS variables now with universal browser support"
        url: "https://web.dev/blog/at-property-baseline"
    actions:
      - id: close-prop-board
        type: whiteboard.apply
        at: { mark: close-prop-board }
        open: false
      - id: type-seventy
        type: editor.type
        at: { mark: type-seventy }
        cadence: natural
        target: { file: styles.css, after: "  height: var(--tea-level);\n", occurrence: 1 }
        text: "  --tea-level: 70%;\n"
      - id: expect-seventy
        type: expect.preview
        at: { mark: after-seventy }
        timeoutMs: 4000
        target: { by: testId, value: pour }
        textContains: "လက်ဖက်ရည် တစ်ခွက်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-lots
        type: editor.type
        at: { mark: type-lots }
        cadence: natural
        target: { file: styles.css, after: "  --tea-level: 70%;\n", occurrence: 1 }
        text: "  --tea-level: lots;\n"
      - id: select-syntax
        type: editor.select
        at: { mark: select-syntax }
        target: { file: styles.css, text: '  syntax: "<percentage>";', occurrence: 1 }
      - id: select-inherits
        type: editor.select
        at: { mark: select-inherits }
        target: { file: styles.css, text: "  inherits: false;", occurrence: 1 }

  - id: javascript
    chapter: "JavaScript ကနေ ပြောင်းရအောင်"
    narration: >
      [[mark:scroll-top]] နောက်ဆုံး၊ custom property ကို JavaScript ကနေ ပြောင်းကြည့်ရအောင်။
      [[mark:open-index-js]] HTML ဖိုင်ကို ပြန်သွားရအောင်။ [[mark:select-coffee]] ကော်ဖီ ခလုတ်ကို ကြည့်ပါ။
      သူ့ data attribute တွေမှာ brand property ရဲ့ နာမည်နဲ့ ကော်ဖီလို အညိုရင့်ရောင် ပါပါတယ်။
      [[mark:open-kit]] ခလုတ် နှိပ်တာကို project ထဲက script လေးက handle လုပ်ပေးပါတယ်။
      [[mark:select-setproperty]] ဒီ set property ကို ကြည့်ပါ။ html element ရဲ့ style ပေါ်မှာ သူ့ကို
      ခေါ်ပြီး၊ နာမည်နဲ့ တန်ဖိုးကို ပေးလိုက်တာပါ။ အဲဒါက custom property ကို style attribute ထဲ ရေးလို့၊
      inline style အနေနဲ့ ကိုယ့် root rule ကို နိုင်ပါတယ်။ [[mark:click-coffee]] ကော်ဖီ ခလုတ်ကို
      နှိပ်ကြည့်ရအောင်။ [[mark:after-coffee]] header နဲ့ မှာယူရန် link က ကော်ဖီရောင် ပြောင်းပြီး၊ အောက်က ဈေးနှုန်းနဲ့ ခလုတ်တွေလည်း ပြောင်းသွားပါတယ်။ ဒီနေ့ အထူး card ရဲ့ ဈေးနှုန်းကတော့
      အနီရောင် အတိုင်းပါ။ card မှာ ပေးထားတဲ့ price color ကို ဖတ်နေလို့၊ brand ပြောင်းတာနဲ့ မဆိုင်ပါဘူး။
      [[mark:click-tea]] လက်ဖက်ရည် ခလုတ်က ဆိုင်ရဲ့ အညိုရောင်ကို
      ပြန်ယူလာပါတယ်။ [[mark:read-value]] တန်ဖိုးကို ဖတ်ချင်ရင် element ကို ပေးပြီး get computed style ကို
      ခေါ်၊ ပြီးမှ နာမည်နဲ့ get property value ကို ခေါ်ပါ။ cascade နဲ့ inheritance ပြီးတဲ့ တန်ဖိုးကို
      ရပါတယ်။ online ဥပမာ တချို့က အဲဒီ computed style ပေါ်မှာ set property ခေါ်ထားပေမယ့်၊ သူက ဖတ်ဖို့ပဲ
      ရလို့ တန်ဖိုး ပေးရင် element ရဲ့ style ကိုပဲ သုံးပါ။ [[mark:register-js]] ပြီးတော့ CSS object ပေါ်က
      register property က property at-rule ရဲ့ JavaScript version ပါ။
    sources:
      - title: "web.dev Learn CSS — Custom properties: updating custom properties with JavaScript"
        url: "https://web.dev/learn/css/custom-properties#updating_custom_properties_with_javascript"
      - title: "MDN — CSSStyleDeclaration: setProperty()"
        url: "https://developer.mozilla.org/en-US/docs/Web/API/CSSStyleDeclaration/setProperty"
      - title: "MDN — CSSStyleDeclaration: getPropertyValue()"
        url: "https://developer.mozilla.org/en-US/docs/Web/API/CSSStyleDeclaration/getPropertyValue"
      - title: "MDN — Window: getComputedStyle()"
        url: "https://developer.mozilla.org/en-US/docs/Web/API/Window/getComputedStyle"
      - title: "MDN — CSS: registerProperty() static method"
        url: "https://developer.mozilla.org/en-US/docs/Web/API/CSS/registerProperty_static"
    actions:
      - id: scroll-top
        type: preview.scroll
        at: { mark: scroll-top }
        timeoutMs: 5000
        top: 0
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-index-js
        type: workspace.openFile
        at: { mark: open-index-js }
        path: index.html
      - id: select-coffee
        type: editor.select
        at: { mark: select-coffee }
        target:
          {
            file: index.html,
            text: 'data-set-property="--brand" data-value="#4a2c1d"',
            occurrence: 1,
          }
      - id: open-kit
        type: workspace.openFile
        at: { mark: open-kit }
        path: kit.js
      - id: select-setproperty
        type: editor.select
        at: { mark: select-setproperty }
        target:
          {
            file: kit.js,
            text: 'document.documentElement.style.setProperty(setProperty, value ?? "")',
            occurrence: 1,
          }
      - id: click-coffee
        type: preview.click
        at: { mark: click-coffee }
        timeoutMs: 5000
        target: { by: testId, value: theme-coffee }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-coffee
        type: expect.preview
        at: { mark: after-coffee }
        timeoutMs: 4000
        target: { by: testId, value: theme-status }
        textContains: "ကော်ဖီ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: click-tea
        type: preview.click
        at: { mark: click-tea }
        timeoutMs: 5000
        target: { by: testId, value: theme-tea }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-tea
        type: expect.preview
        at: { mark: read-value }
        timeoutMs: 4000
        target: { by: testId, value: theme-status }
        textContains: "လက်ဖက်ရည်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ custom property က တုံးတို နှစ်ခုနဲ့ စတဲ့ နာမည်အောက်မှာ တန်ဖိုး
      သိမ်းပြီး၊ var function က ဖတ်ပါတယ်။ page တစ်ခုလုံး သုံးမယ့် တန်ဖိုးတွေကို root မှာ ထားပြီး၊ inherit
      ဖြစ်လို့ အောက်က element မှာ ပေးရင် အဲဒီ branch ပဲ ပြောင်းပါတယ်။ fallback က မရှိတဲ့ custom property
      အတွက်ပဲ ဖြစ်ပြီး၊ မှားတဲ့ တန်ဖိုးကတော့ property ကို unset လို ဖြစ်စေပါတယ်။ property at-rule က custom
      property ကို type နဲ့ စတန်ဖိုး ပေးပါတယ်။ [[mark:next-lesson]] နောက် lesson မှာတော့ calc နဲ့
      တန်ဖိုးတွေကို တွက်ပေးတဲ့ တခြား CSS function တွေကို ကြည့်သွားပါမယ်။
    sources:
      - title: "web.dev Learn CSS — Custom properties"
        url: "https://web.dev/learn/css/custom-properties"
      - title: "MDN — Using CSS custom properties (variables)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/Using_CSS_custom_properties"
      - title: "web.dev Learn CSS — Functions (next lesson)"
        url: "https://web.dev/learn/css/functions"
    actions:
      - id: expect-final-css
        type: expect.file
        at: { mark: recap }
        path: styles.css
        contains: ":root {\n  --brand: saddlebrown;\n  --brand: darkgreen;\n  --space: 12px;\n  --size: 20;\n}\n\n.site-header {\n  background: var(--brand);\n}\n\n.price {\n  color: var(--brand);\n  color: var(--price-color, var(--brand));\n}\n\n.order-link,\n.order-btn {\n  background: var(--brand);\n}\n\n.featured {\n  --brand: #8b6914;\n  --price-color: crimson;\n}\n"
      - id: expect-final-css-2
        type: expect.file
        at: { afterAction: expect-final-css }
        path: styles.css
        contains: ".menu-card {\n  padding: var(--space);\n}\n\n@media (width < 40em) {\n  :root {\n    --space: 20px;\n  }\n}\n\n.hero {\n  padding: var(--size)px;\n  padding: calc(var(--size) * 1px);\n}\n\n.order-btn {\n  background-color: 12px;\n}\n\n.order-btn.broken {\n  background-color: var(--space);\n}\n\n@property --tea-level {\n  syntax: \"<percentage>\";\n  inherits: false;\n  initial-value: 30%;\n}\n\n.cup-fill {\n  height: var(--tea-level);\n  --tea-level: 70%;\n  --tea-level: lots;\n}\n"

checks:
  - { type: timing.p95Ms, max: 300 }
