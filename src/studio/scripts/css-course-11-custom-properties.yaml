# CSS course (Burmese), lesson 11 of 43: custom properties.
#
# Narration below is an ENGLISH DRAFT for the Burmese writer (DESIGN.md next
# to this file is the span-by-span brief). Every [[mark:…]] sits where its
# action begins, at a sentence end; each span carries one piece of meaning.
# Everything the learner sees (title, chapters, whiteboard labels, UI strings)
# is Burmese already.
#
# Shape: board (recall lesson 10; one brown typed in five places; name it once
# and read it by name) → code tour (index.html: header, theme buttons,
# today's special, the cup, the broken button; empty styles.css; the header,
# prices and buttons have no colour yet) → :root { --brand; --space } changes
# nothing → var(--brand) in three rules paints them → one appended line turns
# the whole page green → .featured { --brand } changes one branch, board
# (inheritance tree) → padding from --space, a media query changes the value;
# where var() may not appear → var() fallback (nested), then --price-color on
# the featured card only → --size: 20 and var(--size)px collapses the hero
# padding; calc(var(--size) * 1px) fixes it → background-color: 12px is
# skipped, var(--space) on the broken button removes its background, board
# (invalid at computed-value time) → @property --tea-level fills the cup to
# its initial 30%, board (syntax / inherits / initial-value), 70% on the fill,
# then "lots" falls back to 30%; inherits: false explained; animation handed
# to lesson 38 → kit.js setProperty on <html>, clicks on the coffee and tea
# buttons re-theme the page; getPropertyValue and CSS.registerProperty named
# → recap, hand-off to CSS functions (lesson 12).
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set(; no postcss config; no reload.
# Mid-typing states: a keystroke-typed var(--name) passes through undefined
# names (--b, --br, …), which would make an element that already reads it
# flash to "unset" for a moment. So every line that (re)declares a custom
# property something already reads, and every rule whose var() reads an
# existing property, lands whole (line-by-line). Keystroke typing is used only
# where every prefix is harmless: the first :root block (nothing reads it
# yet), --size (nothing reads it yet), the hero padding (it collapses to 0 at
# the first prefix and stays 0, the narrated result), calc() typed into the
# LAST rule (its open bracket can only swallow the end of its own rule), the
# two background-color rules at the end of the file (12px is never a colour;
# the var() one is transparent from its first valid prefix on), and the two
# --tea-level values (a registered <percentage>: every prefix that is not a
# percentage fails the syntax check at computed-value time, so the fill shows
# the initial 30% until "70%" lands, and again from the first letter of "lots").
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
