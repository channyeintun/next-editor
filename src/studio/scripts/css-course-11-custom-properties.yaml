      # base.css: sections A, B, B2 and C of the course kit WITHOUT the header
      # background, the price colour and the button background (the lesson
      # paints all three from --brand) and without the sold-out opacity (no
      # sold-out card here), and with a cream tagline so it reads on every brand
      # colour the header gets (the kit's tan only works on the kit's dark
      # header). Section D is not needed. Section E pins the theme
      # buttons' look, the broken button's dashed marker (so it stays visible
      # once its background is gone), the cup section's margin, and the cup:
      # an 80 x 120 content box whose fill sits at the bottom (flex end) and
      # has no height until the lesson types one.
      base.css: |
        /*
          base.css: pinned, never typed during a lesson.
          The shop's palette and the page furniture, so the CSS a lesson types can
          focus on one idea. Lesson 11 keeps sections A, B, B2 and C without the
          header background, the price colour and the button background (the lesson
          paints all three from one custom property), gives the tagline the header's
          cream so it reads on every brand colour, and pins the theme buttons, the
          broken button's marker and the cup in section E.
        */

        /* == A. palette == */
        :root {
          color-scheme: light;
          --tea-dark: #3b2314;
          --tea: #8b5a2b;
          --tea-light: #c9a27e;
          --cream: #fff8ec;
          --paper: #fdf3e1;
          --leaf: #2f6b3a;
          --gold: #c9a227;
          --chili: #b23a2b;
          --ink: #2b1d14;
          --muted: #6b5a4c;
          --line: #e6d5bf;
          --radius: 12px;
        }

        /* == B. page == */
        body {
          margin: 0;
          font-family: "Noto Sans Myanmar", "Myanmar Sangam MN", "Myanmar MN", "Myanmar Text", "Padauk",
            system-ui, sans-serif;
          font-size: 16px;
          line-height: 1.8;
          color: var(--ink);
          background: var(--paper);
        }

        .page {
          padding: 0 16px 24px;
        }

        h1,
        h2,
        h3 {
          margin: 0 0 8px;
          line-height: 1.5;
        }

        h1 {
          font-size: 24px;
        }

        h2 {
          font-size: 20px;
        }

        h3 {
          font-size: 17px;
        }

        a {
          color: var(--tea);
        }

        /* Status lines that only expect.preview reads (kit.js data-report, data-say). */
        .visually-hidden {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip-path: inset(50%);
          white-space: nowrap;
        }

        /* == B2. reset (lesson 2 teaches it; every later lesson keeps it) == */
        *,
        *::before,
        *::after {
          box-sizing: border-box;
        }

        /* == C. furniture == */
        .site-header {
          padding: 16px;
          color: var(--cream);
        }

        .site-header a {
          color: var(--cream);
        }

        .logo {
          display: block;
        }

        .tagline {
          margin: 0;
          color: var(--cream);
          font-size: 14px;
        }

        .nav ul {
          margin: 8px 0 0;
          padding: 0;
          list-style: none;
        }

        .hero {
          margin: 16px 0;
          padding: 16px;
          background: var(--cream);
          border-radius: var(--radius);
        }

        .menu {
          margin: 0;
          padding: 0;
          list-style: none;
        }

        .menu-card {
          margin: 0 0 12px;
          padding: 12px 16px;
          background: #fff;
          border: 1px solid var(--line);
          border-radius: var(--radius);
        }

        .menu-card .name,
        .menu-card .desc {
          margin: 0;
        }

        .menu-card .desc {
          color: var(--muted);
          font-size: 14px;
        }

        .price {
          font-weight: 700;
        }

        .badge {
          padding: 0 8px;
          border-radius: 999px;
          background: var(--leaf);
          color: #fff;
          font-size: 13px;
        }

        .order-link,
        .order-btn {
          display: inline-block;
          padding: 6px 16px;
          border: 0;
          border-radius: 999px;
          color: #fff;
          font: inherit;
          text-decoration: none;
        }

        .order-form label {
          display: block;
          margin-top: 8px;
        }

        .order-form input[type="text"],
        .order-form input[type="tel"],
        .order-form input[type="number"] {
          box-sizing: border-box;
          width: 100%;
          padding: 6px 10px;
          border: 1px solid var(--line);
          border-radius: 8px;
          background: #fff;
          font: inherit;
        }

        .order-btn {
          margin-top: 12px;
        }

        .gallery figure {
          margin: 0 0 12px;
        }

        .gallery img {
          display: block;
          max-width: 100%;
          height: auto;
          border-radius: var(--radius);
        }

        figcaption {
          color: var(--muted);
          font-size: 14px;
        }

        .hours-list {
          margin: 0;
          padding-left: 20px;
        }

        .site-footer {
          margin-top: 24px;
          padding: 16px;
          background: var(--tea-dark);
          color: var(--cream);
          font-size: 14px;
        }

        .site-footer a {
          color: var(--cream);
        }

        /* == E. lesson rules == */
        /* Lesson 11: the theme buttons, the broken button's marker and the cup. */
        .theme-buttons {
          display: flex;
          gap: 8px;
          margin-top: 16px;
        }

        .theme-buttons button {
          padding: 4px 12px;
          border: 1px solid var(--line);
          border-radius: 999px;
          background: #fff;
          color: var(--ink);
          font: inherit;
        }

        .broken {
          color: var(--ink);
          outline: 2px dashed var(--chili);
          outline-offset: 2px;
        }

        .pour {
          margin: 24px 0;
        }

        .cup {
          box-sizing: content-box;
          display: flex;
          align-items: flex-end;
          width: 80px;
          height: 120px;
          border: 3px solid var(--tea-dark);
          border-top: 0;
          border-radius: 0 0 16px 16px;
          background: #fff;
          overflow: hidden;
        }

        .cup-fill {
          width: 100%;
          background: var(--tea);
        }
      kit.js: |
        // kit.js: pinned helper for lessons that need a click to change the DOM.
        // Never typed during a lesson. Every helper is a data attribute on the clicked
        // element; data-target (a CSS selector) names the element that changes, and
        // defaults to the clicked element itself.
        //
        //   data-toggle-class="is-open"      toggles a class on the target
        //   data-toggle-attr="hidden"        toggles a boolean attribute on the target
        //   data-show-modal="#confirm"       opens that <dialog> with showModal()
        //   data-set-property="--brand"      sets a custom property on <html>
        //     data-value="#2f6b3a"           ...to this value
        //   data-say="text"                  writes the text into the target
        //
        // On a popover, <details> or <dialog>:
        //   data-report="#status"            writes "open" / "closed" into #status on
        //                                    every toggle (a DOM fact expect.preview
        //                                    can assert; popovers have no open attribute,
        //                                    and a closed dialog has none to compare)
        // On a checkbox or radio:
        //   data-report="#status"            writes "checked" / "unchecked" into #status
        //                                    on every change (a clicked checkbox never
        //                                    gets a checked attribute and its value
        //                                    stays "on", so expect.preview needs this)
        //
        // It never throws: a missing target or dialog is ignored.

        const HELPERS = "[data-toggle-class],[data-toggle-attr],[data-show-modal],[data-set-property],[data-say]";

        document.addEventListener("click", (event) => {
          const source = event.target instanceof Element ? event.target.closest(HELPERS) : null;
          if (!source) return;
          const { toggleClass, toggleAttr, showModal, setProperty, value, say, target } = source.dataset;
          const element = target ? document.querySelector(target) : source;
          if (!element) return;
          if (toggleClass) element.classList.toggle(toggleClass);
          if (toggleAttr) element.toggleAttribute(toggleAttr);
          if (setProperty) document.documentElement.style.setProperty(setProperty, value ?? "");
          if (say !== undefined) element.textContent = say;
          if (showModal) {
            const dialog = document.querySelector(showModal);
            if (dialog instanceof HTMLDialogElement && !dialog.open) dialog.showModal();
          }
        });

        // toggle does not bubble, so listen in the capture phase.
        document.addEventListener(
          "toggle",
          (event) => {
            const source = event.target instanceof HTMLElement ? event.target : null;
            const report = source?.dataset.report ? document.querySelector(source.dataset.report) : null;
            if (report) report.textContent = event.newState ?? (source.hasAttribute("open") ? "open" : "closed");
          },
          true,
        );

        // change bubbles; only checkboxes and radios report.
        document.addEventListener("change", (event) => {
          const input = event.target instanceof HTMLInputElement ? event.target : null;
          if (!input || (input.type !== "checkbox" && input.type !== "radio")) return;
          const report = input.dataset.report ? document.querySelector(input.dataset.report) : null;
          if (report) report.textContent = input.checked ? "checked" : "unchecked";
        });
      styles.css: ""
      public/cup.svg: |
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
          <path d="M36 30c-5-6 5-10 0-17M48 30c-5-6 5-10 0-17M60 30c-5-6 5-10 0-17" fill="none" stroke="#c9a27e" stroke-width="3" stroke-linecap="round"/>
          <path d="M18 38h52v14a26 26 0 0 1-52 0z" fill="#8b5a2b"/>
          <path d="M70 44h6a8 8 0 0 1 0 16h-8" fill="none" stroke="#8b5a2b" stroke-width="5"/>
          <path d="M22 42h44" stroke="#c9a27e" stroke-width="4" stroke-linecap="round"/>
          <ellipse cx="44" cy="82" rx="34" ry="6" fill="#3b2314"/>
        </svg>

