  - id: your-turn
    chapter: ကိုယ့် system အတွက်
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ စာရွက် တစ်ရွက် ယူပြီး ကိုယ့် system ရဲ့ အပိုင်းတွေနဲ့ database တွေကို
      ဆွဲကြည့်ပါ။ ပြီးရင် အတူတူ deploy လုပ်ရတာတွေ၊ database အတူတူ သုံးတာတွေကို မျဉ်းပြတ်နဲ့ ဝိုင်းပြီး quantum
      ဘယ်နှခု ရှိလဲ ရေတွက်ပါ။
      [[mark:turn-2]] ပြီးတော့ lesson ကို pause လုပ်ပြီး ဒီ table ထဲမှာ ကိုယ့် system ရဲ့ အပိုင်းတွေက ဘယ်
      characteristic ကို လိုလဲ ဆိုတာ ရေးကြည့်ပါ။ characteristic အုပ်စု အရေအတွက်နဲ့ quantum အရေအတွက်
      ကွာနေတယ်ဆိုရင်၊ အဲဒီ ကွာဟချက်က ကိုယ့် architecture အတွက် ပထမဆုံး စဉ်းစားရမယ့် မေးခွန်းပါပဲ။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
