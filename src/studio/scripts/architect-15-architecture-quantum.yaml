scenes:
  - id: need
    chapter: ပစ်မှတ်က ဘယ်အပိုင်းအတွက်လဲ
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ system က ဘယ်လောက် ကောင်းကောင်း လုပ်နိုင်ရမလဲ ဆိုတဲ့ architecture characteristic တွေကို
      ဂဏန်းနဲ့ တိုင်းလို့ရတဲ့ ပစ်မှတ်အဖြစ် ပြောင်းခဲ့ပါတယ်။
      [[mark:n-open]] ဒီ ပစ်မှတ်တွေကို team တွေဆီ ယူသွားတော့ Booking team lead မောင်မောင် က မေးခွန်း တစ်ခု
      မေးပါတယ်။ ဒီ ပစ်မှတ်တွေက ဘယ်အပိုင်းအတွက်လဲ ဆိုတာပါ။
      [[mark:n-el]] ရုတ်တရက် တက်လာတဲ့ load ကို ပုံမှန်ရဲ့ ၂၀ ဆ အထိ ခံနိုင်ရမယ် ဆိုတဲ့ elasticity ပစ်မှတ်ကို ကြည့်ပါ။ သင်္ကြန် လက်မှတ် ဖွင့်တဲ့ မနက်မှာ
      ၂၀ ဆ တက်လာမှာက ခရီးစဉ် ရှာတဲ့ Search အပိုင်းနဲ့ လက်မှတ် ဝယ်တဲ့ အပိုင်းတွေပါ။
      [[mark:n-set]] ကားလိုင်းတွေကို ငွေစာရင်း ရှင်းပေးတဲ့ Settlement ကတော့ တနင်္လာနေ့တိုင်း၊ တစ်ပတ်မှာ တစ်ခါပဲ run
      ပါတယ်။ သင်္ကြန်နေ့မှာ လူ ဘယ်လောက်ပဲ ဝင်ဝင် သူ့အလုပ်က မပြောင်းပါဘူး။ သူ့အတွက် အရေးကြီးတာက မြန်ဖို့
      မဟုတ်ဘဲ၊ တစ်ကျပ်မှ မမှားဖို့ပါ။
      [[mark:n-q]] ဒါဆို app တစ်ခုလုံးကို ၂၀ ဆ ခံနိုင်အောင် ဆောက်ရမှာလား။ Settlement အတွက်ပါ အဲဒီ ကုန်ကျစရိတ်ကို
      ပေးရမှာလား။ CTO ဖြစ်တဲ့ အောင်အောင် ကလည်း ဒီအချက်ကို စိုးရိမ်ပါတယ်။ တစ်နှစ်မှာ တစ်ရက်၊ နှစ်ရက်အတွက် system
      တစ်ခုလုံးကို အကြီးကြီး ပြင်ထားရရင် ကုန်ကျစရိတ် များမှာမို့ပါ။
      [[mark:n-unit]] ဒီ မေးခွန်းကို ဖြေဖို့ဆိုရင် characteristic တစ်ခုက system ရဲ့ ဘယ်အထိ သက်ရောက်လဲ ဆိုတာကို
      ပြောပြနိုင်တဲ့ အတိုင်းအတာ တစ်ခု လိုပါတယ်။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - {
          id: open-notebook,
          type: workspace.openFile,
          at: { mark: n-open },
          path: notebook/15-quanta.md,
        }
      - id: sel-el
        type: editor.select
        at: { mark: n-el }
        target: { file: notebook/15-quanta.md, text: "- elasticity: ပုံမှန်ရဲ့ 20 ဆ ခံနိုင်ရမယ်" }
      - id: sel-int
        type: editor.select
        at: { mark: n-set }
        target: { file: notebook/15-quanta.md, text: "ငွေစာရင်း မမှားရ" }

  - id: one-quantum
    chapter: Architecture quantum ဆိုတာ
    narration: >
      [[mark:s-open]] ခရီးဖော် ရဲ့ system ကို အပိုင်း သုံးခုနဲ့ ပုံကြမ်း ဆွဲကြည့်ရအောင်။
      [[mark:s-parts]] ခရီးစဉ် ရှာတဲ့ Search၊ လက်မှတ် ဝယ်တဲ့ Booking နဲ့ ငွေစာရင်း ရှင်းတဲ့ Settlement ပါ။ code
      ထဲမှာတော့ ဒီ သုံးခုကို module တွေအဖြစ် ခွဲနေပါပြီ။ module ဆိုတာ အတူ ပြောင်းလဲတတ်တဲ့ code ကို
      အုပ်စုဖွဲ့ထားတဲ့ အပိုင်းပါ။
      [[mark:s-db]] ဒါပေမဲ့ သုံးခုလုံးက database တစ်ခုတည်းကို သုံးကြပါတယ်။ deploy လုပ်တဲ့အခါမှာလည်း သုံးခုလုံးက
      app တစ်ခုတည်းအဖြစ် အတူတူ ထွက်ရပါတယ်။ Settlement ထဲက အမှား သေးသေး တစ်ခုကို ပြင်ချင်ရင်တောင် app
      တစ်ခုလုံးကို ပြန်ထုတ်ရတာပါ။
      [[mark:s-q]] ဒီလို အတူတူ deploy လုပ်ရပြီး၊ run ဖို့ လိုသမျှ အရာအားလုံး ပါဝင်တဲ့ အစုအဝေး တစ်ခုကို
      architecture quantum လို့ ခေါ်ပါတယ်။ လိုသမျှ အားလုံး ဆိုတဲ့အထဲမှာ database လည်း ပါပါတယ်။
      [[mark:s-test]] quantum တစ်ခု ဟုတ်မဟုတ် သိချင်ရင် မေးခွန်း တစ်ခု မေးကြည့်နိုင်ပါတယ်။ ဒီအပိုင်းကို ဘာမှ
      မရှိတဲ့နေရာကနေ စပြီး run ဖို့ဆိုရင် ဘာတွေ ရှိရမလဲ ဆိုတာပါ။ Search တစ်ခုတည်းကို run ချင်ရင်တောင် app
      တစ်ခုလုံးနဲ့ database တစ်ခုလုံး ရှိမှ ရပါတယ်။
      [[mark:s-one]] ဒီ အဓိပ္ပာယ်နဲ့ ကြည့်ရင် ခရီးဖော် မှာ module တွေ ဘယ်လောက်ပဲ ခွဲထားထား၊ quantum ကတော့
      တစ်ခုတည်းပါ။
      [[mark:s-why]] quantum က ဘာကြောင့် အရေးကြီးလဲဆိုတော့ characteristic တွေက quantum အလိုက်
      သက်ရောက်လို့ပါ။ quantum တစ်ခုထဲက အပိုင်းတွေက server အတူတူ၊ database အတူတူကို မျှသုံးနေကြပါတယ်။
      ဒါကြောင့် တစ်ခုက ၂၀ ဆ ခံနိုင်ဖို့ဆိုရင် အားလုံးကို အတူတူ တိုးချဲ့ရပါတယ်။
      [[mark:s-share]] Search မှာ လူတွေ ပြည့်နေလို့ database နှေးသွားရင် Settlement ပါ လိုက်နှေးပါတယ်။ တစ်ခုကြောင့်
      app ပျက်သွားရင်လည်း အားလုံး အတူတူ ပျက်ပါတယ်။ ဆိုလိုတာက quantum တစ်ခုထဲမှာ အတူ ရှိနေသရွေ့ ကံကြမ္မာ တူတူပါပဲ။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
      - {
          title: "Software Architecture: The Hard Parts (Ford, Richards, Sadalage, Dehghani)",
          url: "https://oreil.ly/sa-the-hard-parts",
        }
      - {
          title: "Building Evolutionary Architectures, 2nd edition (Ford, Parsons, Kua, Sadalage)",
          url: "https://oreil.ly/evolutionary-arch-2e",
        }
    actions:
      - {
          id: draw-s-open,
          type: whiteboard.apply,
          at: { mark: s-open },
          open: true,
          clear: true,
          upsertIds: [s-title],
        }
      - {
          id: draw-s-parts,
          type: whiteboard.apply,
          at: { mark: s-parts },
          upsertIds: [s-search, s-search-l, s-booking, s-booking-l, s-settle, s-settle-l],
          drawMs: 2400,
        }
      - {
          id: draw-s-db,
          type: whiteboard.apply,
          at: { mark: s-db },
          upsertIds: [s-db, s-db-l, s-a1, s-a2, s-a3],
          drawMs: 2200,
        }
      - {
          id: draw-s-q,
          type: whiteboard.apply,
          at: { mark: s-q },
          upsertIds: [s-bound],
          drawMs: 1200,
        }
      - {
          id: draw-s-one,
          type: whiteboard.apply,
          at: { mark: s-one },
          upsertIds: [s-one],
          drawMs: 800,
        }
      - { id: point-db, type: whiteboard.point, at: { mark: s-share }, target: { assetId: s-db } }

  - id: two-quanta
    chapter: Quantum နှစ်ခု ဖြစ်လာရင်
    narration: >
      [[mark:b-if]] ဒါဆို Search အတွက်ပဲ elasticity ကို ပေးချင်တယ် ဆိုပါစို့။
      [[mark:b-data]] အဲဒီအတွက် Search ကို သူ့ဟာသူ deploy လုပ်နိုင်အောင် ခွဲထုတ်ပြီး၊ ရှာဖို့ လိုတဲ့ data ကိုလည်း
      သူ့အတွက် သီးသန့် ထားပေးလိုက်တယ် ဆိုပါစို့။
      [[mark:b-two]] ဒီအခါမှာ quantum က နှစ်ခု ဖြစ်လာပါတယ်။ Search ရှိတဲ့ quantum ကို ၂၀ ဆ ခံနိုင်အောင်
      တိုးချဲ့လို့ရပြီး၊ ကျန်တဲ့ quantum ကိုတော့ အရင်အတိုင်း ရိုးရိုးပဲ ထားလို့ရပါတယ်။ Settlement အတွက် မလိုတဲ့
      ကုန်ကျစရိတ်ကို ပေးစရာ မလိုတော့ပါဘူး။
      [[mark:b-call]] ဒါပေမဲ့ သတိထားစရာ တစ်ခု ကျန်ပါသေးတယ်။
      [[mark:b-ask]] Search က ခုံ ဘယ်နှခုံ လွတ်သေးလဲ သိဖို့ ရှာတိုင်း Booking ကို လှမ်းမေးပြီး၊ အဖြေကို စောင့်နေတယ်
      ဆိုပါစို့။ ဒီလို အဖြေကို စောင့်နေရတဲ့ call ကို synchronous call လို့ ခေါ်ပါတယ်။
      [[mark:b-tied]] စောင့်နေတဲ့ အချိန်အတွင်းမှာ quantum နှစ်ခုက တစ်ခုတည်းလို ပြန်ဖြစ်သွားပါတယ်။ Booking နှေးရင်
      Search လည်း နှေးပြီး၊ Booking ပျက်ရင် Search လည်း အဖြေ မပေးနိုင်တော့ပါဘူး။ Search ကို ဘယ်လောက်ပဲ
      တိုးချဲ့ထားထား၊ သူ ခေါ်နေတဲ့ဘက်က ခံနိုင်သလောက်ပဲ ခံနိုင်တော့တာပါ။ အဖြေကို မစောင့်ဘဲ ဆက်သွားနိုင်တဲ့
      ဆက်သွယ်နည်းတွေလည်း ရှိပါတယ်။ အဲဒါတွေကိုတော့ နောက်ပိုင်း lesson တွေမှာ လေ့လာပါမယ်။
      [[mark:b-so]] ဒါကြောင့် quantum ကို ရေတွက်တဲ့အခါ deploy နဲ့ database ကိုပဲ မကြည့်ဘဲ၊ အဖြေကို စောင့်ရတဲ့ call
      တွေ ဘယ်နေရာမှာ ရှိလဲ ဆိုတာကိုပါ ကြည့်ရပါတယ်။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
      - {
          title: "Software Architecture: The Hard Parts (Ford, Richards, Sadalage, Dehghani)",
          url: "https://oreil.ly/sa-the-hard-parts",
        }
    actions:
      - {
          id: keep-parts,
          type: whiteboard.apply,
          at: { mark: b-if },
          clear: true,
          upsertIds:
            [
              s-title,
              s-search,
              s-search-l,
              s-booking,
              s-booking-l,
              s-settle,
              s-settle-l,
              s-db,
              s-db-l,
              s-a2,
              s-a3,
            ],
        }
      - {
          id: draw-b-data,
          type: whiteboard.apply,
          at: { mark: b-data },
          upsertIds: [s-sdata, s-sdata-l],
          drawMs: 1200,
        }
      - {
          id: draw-b-two,
          type: whiteboard.apply,
          at: { mark: b-two },
          upsertIds: [s-bound-a, s-bound-b],
          drawMs: 1600,
        }
      - {
          id: draw-b-call,
          type: whiteboard.apply,
          at: { mark: b-ask },
          upsertIds: [s-call],
          drawMs: 700,
        }
      - {
          id: point-call,
          type: whiteboard.point,
          at: { mark: b-tied },
          target: { assetId: s-booking },
        }

  - id: table
    chapter: ခရီးဖော် ရဲ့ အပိုင်းတွေကို ရေတွက်ခြင်း
    narration: >
      [[mark:t-close]] ဒါဆို ခရီးဖော် ရဲ့ အပိုင်းတွေကို တစ်ခုချင်း ကြည့်ပြီး၊ ဘယ်အပိုင်းက ဘယ် characteristic ကို
      လိုလဲ၊ တခြားအပိုင်းတွေနဲ့ တူလား ဆိုတာ ချရေးကြည့်ရအောင်။
      [[mark:t-search]] Search က ရုတ်တရက် တက်လာတဲ့ load ကို ခံနိုင်ဖို့နဲ့ မြန်ဖို့ လိုပါတယ်။ တခြား ဘယ်အပိုင်းနဲ့မှ
      မတူပါဘူး။
      [[mark:t-core]] Booking၊ Payment နဲ့ ကောင်တာက သုံးတဲ့ Operator တို့ကတော့ ထိုင်ခုံနဲ့ ငွေကို ကိုင်တွယ်တာမို့၊
      data မမှားဖို့နဲ့ အမြဲ သုံးလို့ရနေဖို့ လိုပါတယ်။ ဒီ သုံးခုက အချင်းချင်း လိုအပ်ချက် တူကြပါတယ်။
      [[mark:t-settle]] Settlement နဲ့ Report ကတော့ မမှားဖို့ပဲ လိုပါတယ်။ မြန်စရာလည်း မလို၊ ရုတ်တရက် တက်လာတဲ့
      load လည်း မရှိပါဘူး။
      [[mark:t-count]] ရေတွက်ကြည့်ရင် လိုအပ်ချက် တူတဲ့ characteristic အုပ်စုက သုံးစု ရှိနေပါတယ်။ quantum ကတော့
      အခု တစ်ခုတည်းပဲ ရှိပါတယ်။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - { id: close-b, type: whiteboard.apply, at: { mark: t-close }, open: false }
