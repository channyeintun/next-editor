  - id: reason
    chapter: အကြောင်းပြချက်လား၊ ဆုံးဖြတ်ချက်လား
    narration: >
      [[mark:r-two]] ဒီ ဂဏန်း နှစ်ခုက architecture ကို ဆုံးဖြတ်တဲ့အခါ အသုံးဝင်ပါတယ်။
      [[mark:r-same]] အပိုင်းအားလုံးက characteristic အတူတူကို လိုတယ်ဆိုရင် quantum တစ်ခုနဲ့ လုံလောက်ပါတယ်။
      ဆိုလိုတာက အားလုံးကို အတူတူ deploy လုပ်တဲ့ monolith တစ်ခုနဲ့ အဆင်ပြေပါတယ်။ monolith ဆိုတာ တစ်ခါတည်း
      အတူ deploy လုပ်ရတဲ့ app တစ်ခုလုံးပါ။ အကြောင်းမရှိဘဲ ခွဲစရာ မလိုပါဘူး။
      [[mark:r-diff]] ခရီးဖော် လို အပိုင်းတွေက မတူတဲ့ characteristic တွေ လိုနေတယ်ဆိုရင်တော့၊ quantum ကို ခွဲဖို့
      အကြောင်းပြချက် တစ်ခု ရှိလာပါပြီ။ ဒါပေမဲ့ ဒါက အကြောင်းပြချက်ပဲ ရှိပါသေးတယ်။ ဆုံးဖြတ်ချက် မဟုတ်သေးပါဘူး။
      [[mark:r-cost]] ခွဲလိုက်တာနဲ့ အပိုင်းတွေက network ပေါ်ကနေ ဆက်သွယ်ရတော့မှာ ဖြစ်ပြီး၊ data ကိုလည်း နေရာခွဲ
      ထားရတော့မှာပါ။ အဲဒီ ကုန်ကျစရိတ်တွေကို ရမယ့် အကျိုးနဲ့ ချိန်ကြည့်ပြီးမှ ဆုံးဖြတ်ရမှာပါ။ ခရီးဖော် အတွက်
      အဲဒီ ချိန်ဆမှုကို နောက် lesson တွေမှာ ဆက်လုပ်သွားပါမယ်။
      [[mark:r-not-all]] နောက်တစ်ချက်က အုပ်စု သုံးစု ရှိတိုင်း quantum သုံးခု ခွဲရမယ်လို့ မဆိုလိုပါဘူး။ Settlement က
      Booking တို့နဲ့ အတူ ရှိနေလည်း ကြီးကြီးမားမား မထိခိုက်ပါဘူး။ တကယ် ကွဲထွက်နေပြီး၊ အတူထားရင် အားလုံးကို
      ဈေးကြီးစေတာက Search တစ်ခုတည်းပါ။ ခွဲဖို့ စဉ်းစားရင် အဲဒီလို အကွာဆုံး နေရာကနေ စကြည့်ရပါတယ်။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - id: sel-count
        type: editor.select
        at: { mark: r-two }
        target: { file: notebook/15-quanta.md, text: "လိုအပ်ချက် အုပ်စု 3 စု · quantum 1 ခု" }
      - id: sel-search-row
        type: editor.select
        at: { mark: r-not-all }
        target: { file: notebook/15-quanta.md, text: "| Search | elasticity, performance | မတူ |" }

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ တခြား ကုမ္ပဏီ တစ်ခုမှာ service သုံးခု ရှိပြီး၊ တစ်ခုစီကို သီးခြား
      deploy လုပ်ကြပါတယ်။ ဒါပေမဲ့ သုံးခုလုံးက database တစ်ခုတည်းကို ဖတ်လည်း ဖတ်၊ ရေးလည်း ရေးကြပါတယ်။
      [[mark:q-opts]] ဒီ system မှာ architecture quantum ဘယ်နှခု ရှိမလဲ။ သုံးခုလား၊ တစ်ခုလား။ lesson ကို pause
      လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ တစ်ခုပါ။
      [[mark:q-why]] ဘာကြောင့်လဲဆိုတော့ quantum တစ်ခု ဖြစ်ဖို့ဆိုရင် run ဖို့ လိုသမျှ အားလုံးကို ကိုယ်ပိုင် ရှိရပါမယ်။
      ဒီ service သုံးခုကတော့ database ကို မျှသုံးနေကြပါတယ်။ database နှေးရင် သုံးခုလုံး နှေးပြီး၊ အတူသုံးတဲ့ table
      တစ်ခုရဲ့ ပုံစံကို ပြောင်းချင်ရင်လည်း သုံးခုလုံးကို ညှိပြီး အတူတူ ထုတ်ရပါတယ်။
      [[mark:q-more]] ပုံထဲမှာ box သုံးခု ဆွဲထားပေမဲ့၊ characteristic အတွက်ကတော့ တစ်ခုတည်းလိုပဲ ပြုမူပါတယ်။
      ဒါကြောင့် service ဘယ်နှခု ရှိလဲ ဆိုတာကို မရေတွက်ဘဲ၊ quantum ဘယ်နှခု ရှိလဲ ဆိုတာကို ရေတွက်ရတာပါ။
    sources:
      - {
          title: "Software Architecture: The Hard Parts (Ford, Richards, Sadalage, Dehghani)",
          url: "https://oreil.ly/sa-the-hard-parts",
        }
      - {
          title: "Building Evolutionary Architectures, 2nd edition (Ford, Parsons, Kua, Sadalage)",
          url: "https://oreil.ly/evolutionary-arch-2e",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [z-title, z-s1, z-s2],
          drawMs: 2400,
        }
      - {
          id: draw-q-opts,
          type: whiteboard.apply,
          at: { mark: q-opts },
          upsertIds: [z-a, z-b],
          drawMs: 1200,
