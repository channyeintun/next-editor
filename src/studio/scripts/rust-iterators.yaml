    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 41

runtime:
  kind: rust-playground
  defaultMode: fixture
  fixture:
    latencyMs: 600
    result:
      status: success
      stdout: "numbers: [1, 2, 3, 4, 5, 6]

        double(4) = 8

        doubled, over 5: [6, 8, 10, 12]

        nothing doubled yet

        doubling 1

        doubling 2

        doubling 3

        doubling 4

        doubling 5

        doubling 6

        sum: 42\n"
      stderr: ""

scenes:
  - id: what-is-an-iterator
    chapter: Iterator ဆိုတာ ဘာလဲ
    narration: >-
      Vec တစ်ခုကို for loop နဲ့ ပတ်ဖူးပြီးသားပါ။ အဲဒီ for loop ရဲ့ နောက်ကွယ်မှာ အလုပ်လုပ်နေတာက
      iterator တစ်ခုပါ။ [[mark:draw-vec]] ဒီမှာ ကိန်းဂဏန်းတွေ ထည့်ထားတဲ့ Vec တစ်ခု ရှိပါတယ်။
      [[mark:draw-iter]] သူ့ပေါ်မှာ iter ကို ခေါ်လိုက်ရင် iterator တစ်ခု ရပါတယ်။ [[mark:draw-next]]
      iterator တစ်ခုမှာ အဓိက method ဆိုလို့ next တစ်ခုပဲ ရှိပါတယ်။ next ကို ခေါ်လိုက်တိုင်း နောက်
      item တစ်ခုကို Some ထဲ ထည့်ပြီး ပြန်ပေးပါတယ်။ iter နဲ့ ရတဲ့ iterator ဆိုရင်၊ Some ထဲမှာ ပါလာတာက
      item ကိုယ်တိုင် မဟုတ်ဘဲ၊ item ကို ညွှန်တဲ့ reference တစ်ခုပါ။ [[mark:draw-none]] item တွေ
      ကုန်သွားတဲ့အခါမှာတော့ next က None ကို ပြန်ပေးပါတယ်။ [[mark:draw-for]] for loop ဆိုတာ None
      မရမချင်း next ကို ကိုယ့်အစား ထပ်ခါထပ်ခါ ခေါ်ပေးနေတာပါပဲ။ [[mark:draw-adapt]] ပြီးတော့ map၊
      filter၊ sum လို method တွေကလည်း ဒီ next ပေါ်မှာပဲ တည်ဆောက်ထားတာပါ။ အဲဒီ method အများစုက
      closure တစ်ခုကို လက်ခံတဲ့အတွက်၊ closure ကနေ စကြည့်ရအောင်။
    sources:
      - title: "The Rust Book — The Iterator Trait and the next Method"
        url: "https://doc.rust-lang.org/book/ch13-02-iterators.html#the-iterator-trait-and-the-next-method"
      - title: "std::iter — for loops and IntoIterator"
        url: "https://doc.rust-lang.org/std/iter/index.html#for-loops-and-intoiterator"
      - title: "std::iter::Iterator::next"
        url: "https://doc.rust-lang.org/std/iter/trait.Iterator.html#tymethod.next"
    actions:
      # Opens in the quiet handle before the first word, already titled.
      - id: open-board-iter
        type: whiteboard.apply
        at: { scene: start, offsetMs: -1500 }
        open: true
        upsertIds: [i-title]
      - id: draw-vec
        type: whiteboard.apply
        at: { mark: draw-vec }
        upsertIds: [i-name, i-box0, i-val0, i-box1, i-val1, i-box2, i-val2]
        drawMs: 1600
      - id: draw-iter
        type: whiteboard.apply
        at: { mark: draw-iter }
        upsertIds: [i-iter-label, i-iter-arrow, i-iter-box, i-iter-text]
        drawMs: 2000
      - id: draw-next
        type: whiteboard.apply
        at: { mark: draw-next }
        upsertIds: [i-next-arrow, i-next-label, i-some1, i-some2, i-some3]
        drawMs: 3000
      - id: draw-none
        type: whiteboard.apply
        at: { mark: draw-none }
        upsertIds: [i-none]
        drawMs: 800
      - id: draw-for
        type: whiteboard.apply
        at: { mark: draw-for }
        upsertIds: [i-for]
        drawMs: 1600
      - id: draw-adapt
        type: whiteboard.apply
        at: { mark: draw-adapt }
        upsertIds: [i-adapt]
        drawMs: 1600

  - id: closures
    chapter: Closure တွေ
    narration: >-
      closure ဆိုတာ နာမည် မပါတဲ့ function သေးသေးလေး တစ်ခုပါ။ [[mark:type-double]] closure တစ်ခုကို
      double ဆိုတဲ့ variable ထဲ ထည့်သိမ်းကြည့်ရအောင်။ closure ဆိုတာ တန်ဖိုး တစ်ခု ဖြစ်တဲ့အတွက်၊
      ကိန်းဂဏန်း တစ်ခုကို variable ထဲ ထည့်သလိုပဲ closure ကိုလည်း variable ထဲ ထည့်လို့ ရပါတယ်။
      [[mark:select-bars]] parameter တွေကို pipe နှစ်ခုကြားမှာ ရေးပါတယ်။ ဒီမှာတော့ x ဆိုတဲ့
      parameter တစ်ခုပဲ ရှိပါတယ်။ သူ့နောက်က body ကတော့ x ကို 2 နဲ့ မြှောက်တာပါ။ f n keyword လည်း
      မပါသလို၊ type လည်း ဘယ်နေရာမှာမှ မရေးထားပါဘူး။ ကိုယ် ဘယ်လို သုံးလဲ ဆိုတာကို ကြည့်ပြီး compiler
      က type တွေကို ကိုယ့်အစား ရွေးပေးပါတယ်။ [[mark:type-call-double]] ခေါ်တဲ့အခါကျတော့ သာမန်
      function တစ်ခုကို ခေါ်သလိုပဲ ခေါ်ပါတယ်။ 4 နဲ့ ခေါ်ကြည့်ရအောင်။
    sources:
      - title: "The Rust Book — Closures"
        url: "https://doc.rust-lang.org/book/ch13-01-closures.html"
      - title: "The Rust Book — Closure Type Inference and Annotation"
        url: "https://doc.rust-lang.org/book/ch13-01-closures.html#closure-type-inference-and-annotation"
      - title: "The Rust Reference — Closure expressions"
        url: "https://doc.rust-lang.org/reference/expressions/closure-expr.html"
    actions:
      - id: close-board-iter
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-main
        type: workspace.openFile
        at: { scene: start, offsetMs: 900 }
        path: main.rs
      - id: type-double
        type: editor.type
        at: { mark: type-double, offsetMs: -200 }
        target:
          file: main.rs
          after: "    println!(\"numbers: {numbers:?}\");\n"
          occurrence: 1
        cadence: fast-explainer
        text: "\n    let double = |x| x * 2;\n"
      - id: select-bars
        type: editor.select
        at: { mark: select-bars }
        target:
          file: main.rs
          text: "|x|"
          occurrence: 1
      - id: type-call-double
        type: editor.type
        at: { mark: type-call-double }
        target:
          file: main.rs
          after: "    let double = |x| x * 2;\n"
          occurrence: 1
        cadence: line-by-line
        text: "    println!(\"double(4) = {}\", double(4));\n"

  - id: chain
    chapter: map၊ filter နဲ့ collect
    narration: >-
      အခု closure တွေကို iterator တစ်ခုဆီ ပေးကြည့်ရအောင်။ [[mark:type-chain]] အရင်ဆုံး limit ကို 5
      လို့ သတ်မှတ်ထားပါမယ်။ ပြီးတော့ numbers ပေါ်မှာ အဆင့်တွေကို chain အနေနဲ့ ဆက်တွဲ တည်ဆောက်ပါမယ်။
      iter၊ ပြီးတော့ map၊ ပြီးတော့ filter၊ နောက်ဆုံးမှာ collect ပါ။ [[mark:select-map]] map က item
      တိုင်းအတွက် သူ့ closure ကို တစ်ကြိမ်စီ ခေါ်ပြီး၊ ထွက်လာတဲ့ ရလဒ်ကို နောက်အဆင့်ဆီ ဆက်ပေးပါတယ်။
      ဒီမှာဆိုရင် ကိန်းဂဏန်း တစ်ခုချင်းစီကို နှစ်ဆ လုပ်ပေးတာပါ။ [[mark:select-filter]] filter ကတော့
      သူ့ closure က true ပြန်ပေးတဲ့ item တွေကိုပဲ ချန်ထားပါတယ်။ filter က item တစ်ခုချင်းစီကို
      ကြည့်ရုံပဲ ကြည့်တာ ဖြစ်လို့၊ သူ့ closure ထဲက x က reference တစ်ခုပါ။ 2 နဲ့ မြှောက်တာလို
      တွက်ချက်မှုမျိုးကတော့ reference ပေါ်မှာ တန်းလုပ်လို့ ရပါတယ်။ ဒါပေမဲ့ နှိုင်းယှဉ်မယ်ဆိုရင်တော့
      ဘယ်ဘက်ရော ညာဘက်ရော type တူဖို့ လိုပါတယ်။ ဒါကြောင့် x ရှေ့က star က x ညွှန်ထားတဲ့ ကိန်းဂဏန်းကို
      ဖတ်ယူပေးတာပါ။ [[mark:select-vec-type]] collect ကတော့ ရလဒ်တွေကို စုပြီး collection အသစ် တစ်ခု
      တည်ဆောက်ပေးပါတယ်။ collection အမျိုးအစား အများကြီး တည်ဆောက်နိုင်တဲ့အတွက်၊ ဘယ်ဟာ လိုချင်လဲ
      ဆိုတာကို ကိုယ်က type နဲ့ ပြောပေးရပါတယ်။ ဒီမှာတော့ Vec of i32 ပါ။
    sources:
      - title: "The Rust Book — Methods that Produce Other Iterators"
        url: "https://doc.rust-lang.org/book/ch13-02-iterators.html#methods-that-produce-other-iterators"
      - title: "std::iter::Iterator::map"
        url: "https://doc.rust-lang.org/std/iter/trait.Iterator.html#method.map"
      - title: "std::iter::Iterator::filter"
        url: "https://doc.rust-lang.org/std/iter/trait.Iterator.html#method.filter"
      - title: "i32 — impl Mul<i32> for &i32 (times two works on a reference)"
        url: "https://doc.rust-lang.org/std/primitive.i32.html#impl-Mul%3Ci32%3E-for-%26i32"
      - title: "i32 — impl PartialOrd for i32 (an i32 compares with an i32)"
        url: "https://doc.rust-lang.org/std/primitive.i32.html#impl-PartialOrd-for-i32"
      - title: "std::iter::Iterator::collect"
        url: "https://doc.rust-lang.org/std/iter/trait.Iterator.html#method.collect"
    actions:
      - id: type-chain
        type: editor.type
        at: { mark: type-chain, offsetMs: -200 }
        target:
          file: main.rs
          after: "double(4));\n"
          occurrence: 1
        cadence: line-by-line
        text: "

          \    let limit = 5;

          \    let big: Vec<i32> = numbers

          \        .iter()

          \        .map(|x| x * 2)

          \        .filter(|x| *x > limit)

          \        .collect();

          \    println!(\"doubled, over {limit}: {big:?}\");\n"
      - id: select-map
        type: editor.select
        at: { mark: select-map }
        target:
          file: main.rs
          text: ".map(|x| x * 2)"
          occurrence: 1
      - id: select-filter
        type: editor.select
        at: { mark: select-filter }
        target:
          file: main.rs
          text: ".filter(|x| *x > limit)"
          occurrence: 1
      - id: select-vec-type
        type: editor.select
        at: { mark: select-vec-type }
        target:
          file: main.rs
          text: "Vec<i32>"
          occurrence: 1

  - id: capture
    narration: >-
      [[mark:select-limit]] filter ရဲ့ closure ထဲက limit ကို ကြည့်ပါ။ limit က closure ရဲ့ parameter
      မဟုတ်ပါဘူး။ main ထဲက variable တစ်ခု ဖြစ်ပြီး၊ closure က သူ့ကို ဒီအတိုင်း ယူသုံးလို့ ရနေတာပါ။
      ဒါကို capture လုပ်တယ်လို့ ခေါ်ပါတယ်။ [[mark:open-capture]] သာမန် function တစ်ခုကတော့ ဒီလို
      လုပ်လို့ မရပါဘူး။ [[mark:draw-fn]] ဒီမှာ x က limit ထက် ကြီးလား ဆိုတဲ့ ခုနက စစ်ဆေးချက်ကိုပဲ၊
      main ထဲမှာ သာမန် function တစ်ခု အနေနဲ့ ရေးထားပါတယ်။ [[mark:draw-err]] အဲဒီအခါ compiler က E0434
      error နဲ့ ရပ်သွားပါတယ်။ error စာသားက၊ f n item တစ်ခုထဲမှာ dynamic environment ကို capture
      လုပ်လို့ မရဘူးတဲ့။ environment ဆိုတာ သူ့ပတ်ဝန်းကျင်မှာ ရှိတဲ့ variable တွေကို ပြောတာပါ။
      [[mark:draw-closure]] အဲဒီ စစ်ဆေးချက်ကိုပဲ closure အနေနဲ့ ရေးလိုက်ရင်တော့ အဆင်ပြေသွားပါတယ်။
      [[mark:draw-holds]] ဘာကြောင့်လဲဆိုတော့၊ closure ဆိုတာ တန်ဖိုး တစ်ခု ဖြစ်ပြီး၊ သူ capture
      လုပ်ထားတာတွေကို သူ့ထဲမှာ သိမ်းထားတဲ့ struct တစ်ခုနဲ့ သဘော ဆင်လို့ပါ။ သာမန် function ကတော့ code
      သက်သက်ပဲ ဖြစ်တဲ့အတွက်၊ limit ကို သိမ်းထားစရာ နေရာ မရှိပါဘူး။
    sources:
      - title: "The Rust Book — Capturing References or Moving Ownership"
        url: "https://doc.rust-lang.org/book/ch13-01-closures.html#capturing-references-or-moving-ownership"
      - title: "The Rust Book — Using Closures that Capture Their Environment"
        url:
          "https://doc.rust-lang.org/book/ch13-02-iterators.html#using-closures-that-capture-their-envir\
          onment"
      - title: "Rust error codes — E0434"
        url: "https://doc.rust-lang.org/error_codes/E0434.html"
      - title: "The Rust Reference — Closure types (like a struct holding the captured values)"
        url: "https://doc.rust-lang.org/reference/types/closure.html#r-type.closure.intro"
    actions:
      - id: select-limit
        type: editor.select
        at: { mark: select-limit }
        target:
          file: main.rs
          text: "limit"
          occurrence: 2
      - id: open-board-capture
        type: whiteboard.apply
        at: { mark: open-capture }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-fn
        type: whiteboard.apply
        at: { mark: draw-fn }
        upsertIds: [c-let, c-fn1, c-fn2, c-fn3]
        drawMs: 2400
      - id: draw-err
        type: whiteboard.apply
        at: { mark: draw-err }
        upsertIds: [c-fn-u, c-err1, c-err2]
        drawMs: 2600
      - id: draw-closure
        type: whiteboard.apply
        at: { mark: draw-closure }
        upsertIds: [c-cl, c-cl-u, c-works]
        drawMs: 2200
      - id: draw-holds
        type: whiteboard.apply
        at: { mark: draw-holds }
        upsertIds: [c-hold-arrow, c-hold-name, c-hold-box, c-hold-ref]
        drawMs: 2400

  - id: lazy
    chapter: Iterator တွေက lazy
    narration: >-
      map နဲ့ filter အကြောင်း နောက်ထပ် တစ်ချက် ပြောစရာ ရှိပါသေးတယ်။ [[mark:draw-lazy-code]] map ကို
      ခေါ်ပြီး၊ သူ့နောက်မှာ ဘာမှ ဆက်မရေးဘူး ဆိုပါစို့။ [[mark:draw-warning]] compile လုပ်လို့တော့
      ရပါတယ်၊ ဒါပေမဲ့ warning တစ်ခု တက်လာပါတယ်။ unused Map that must be used တဲ့။ သူ့အောက်က note
      စာကြောင်းက အကြောင်းရင်းကို ပြောပြပါတယ်။ iterator တွေက lazy ဖြစ်တဲ့အတွက်၊ မခိုင်းမချင်း ဘာမှ
      မလုပ်ဘူးတဲ့။ [[mark:draw-adapters]] map နဲ့ filter ကို adapter လို့ ခေါ်ပါတယ်။ adapter တစ်ခုက
      iterator အသစ် တစ်ခု ပြန်ပေးပြီး၊ အဲဒီ iterator က လုပ်ရမယ့် အဆင့် တစ်ဆင့်ကို ဖော်ပြထားရုံပါပဲ။
      ဒီအချိန်မှာ ဘာမှ run မသွားသေးပါဘူး။ [[mark:draw-consumer]] sum၊ collect၊ ဒါမှမဟုတ် for loop
      လို consumer တစ်ခု ရောက်လာမှ chain တစ်ခုလုံး run ပါတယ်။ [[mark:draw-pass]] consumer က item
      တွေကို တစ်ခုချင်း တောင်းပြီး၊ item တစ်ခုချင်းစီက အဆင့်တိုင်းကို ဖြတ်သွားပါတယ်။ ဒါကြောင့်
      အဆင့်တွေကြားမှာ Vec အပို တစ်ခုမှ တည်ဆောက်စရာ မလိုသလို၊ ဒီ chain က ကိုယ်တိုင် လက်နဲ့ ရေးတဲ့
      loop တစ်ခုနဲ့ အမြန်နှုန်း သိပ်မကွာပါဘူး။
    sources:
      - title: "The Rust Book — Methods that Produce Other Iterators (the lazy warning)"
        url: "https://doc.rust-lang.org/book/ch13-02-iterators.html#methods-that-produce-other-iterators"
      - title: "std::iter — Laziness"
        url: "https://doc.rust-lang.org/std/iter/index.html#laziness"
      - title: "The Rust Book — Comparing Performance: Loops vs. Iterators"
        url: "https://doc.rust-lang.org/book/ch13-04-performance.html"
    actions:
      - id: open-board-lazy
        type: whiteboard.apply
        at: { scene: start, offsetMs: -300 }
        clear: true
        upsertIds: [l-title]
      - id: draw-lazy-code
        type: whiteboard.apply
        at: { mark: draw-lazy-code }
        upsertIds: [l-code]
        drawMs: 1400
      - id: draw-warning
        type: whiteboard.apply
        at: { mark: draw-warning }
        upsertIds: [l-code-u, l-warn, l-note]
        drawMs: 3000
      - id: draw-adapters
        type: whiteboard.apply
        at: { mark: draw-adapters }
        upsertIds: [l-map-box, l-map-text, l-arrow1, l-filter-box, l-filter-text, l-adapters]
        drawMs: 2800
      - id: draw-consumer
        type: whiteboard.apply
        at: { mark: draw-consumer }
        upsertIds: [l-arrow2, l-sum-box, l-sum-text, l-consumer]
        drawMs: 2000
      - id: draw-pass
        type: whiteboard.apply
        at: { mark: draw-pass }
        upsertIds: [l-pass]
        drawMs: 1800

  - id: lazy-code
    narration: >-
      အဲဒါကို လက်တွေ့ ကြည့်ရအောင်။ [[mark:type-lazy]] ဒီမှာ map ကို ထပ်သုံးထားပါတယ်။ ဒီတစ်ခါတော့
      closure ရဲ့ body က block တစ်ခု ဖြစ်တဲ့အတွက်၊ ကိန်းဂဏန်း တစ်ခုချင်းစီကို အရင် print ထုတ်ပြီးမှ၊
      နှစ်ဆ လုပ်ထားတဲ့ တန်ဖိုးကို ပြန်ပေးနိုင်ပါတယ်။ [[mark:type-sum]] ပြီးတော့ စာကြောင်း တစ်ကြောင်း
      print ထုတ်ပြီး၊ အဲဒီနောက်မှ sum ကို ခေါ်ပါမယ်။ [[mark:select-sum]] ဒီနေရာမှာ consumer က sum
      ပါ။ collect လိုပဲ sum ကလည်း ရလဒ် type ကို သိဖို့ လိုတဲ့အတွက်၊ total ကို i32 လို့
      ကြေညာထားပါတယ်။
    sources:
      - title: "The Rust Book — Methods that Consume the Iterator"
        url: "https://doc.rust-lang.org/book/ch13-02-iterators.html#methods-that-consume-the-iterator"
      - title: "std::iter::Iterator::sum"
        url: "https://doc.rust-lang.org/std/iter/trait.Iterator.html#method.sum"
    actions:
      - id: close-board-lazy
        type: whiteboard.apply
        at: { scene: start, offsetMs: -400 }
        open: false
      - id: type-lazy
        type: editor.type
        at: { mark: type-lazy, offsetMs: -200 }
        target:
          file: main.rs
          after: "{big:?}\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "

          \    let doubled = numbers.iter().map(|x| {

          \        println!(\"doubling {x}\");

          \        x * 2

          \    });\n"
      - id: type-sum
        type: editor.type
        at: { mark: type-sum, offsetMs: -200 }
        target:
          file: main.rs
          after: "        x * 2\n    });\n"
          occurrence: 1
        cadence: line-by-line
        text: "    println!(\"nothing doubled yet\");

          \    let total: i32 = doubled.sum();

          \    println!(\"sum: {total}\");\n"
      - id: select-sum
        type: editor.select
        at: { mark: select-sum }
        target:
          file: main.rs
          text: "doubled.sum()"
          occurrence: 1

  - id: run
    narration: >-
      [[mark:run]] ကဲ၊ run ကြည့်ရအောင်။ 4 ကို double လုပ်လိုက်တော့ 8 ရပါတယ်။ chain ကတော့ 6၊ 8၊ 10
      နဲ့ 12 ကို ချန်ထားပေးပါတယ်။ အခု output ရဲ့ အစီအစဉ်ကို ကြည့်ပါ။ nothing doubled yet ဆိုတဲ့
      စာကြောင်းက doubling စာကြောင်း အားလုံးရဲ့ ရှေ့မှာ ရောက်နေပါတယ်။ ဆိုလိုတာက၊ sum က item တွေကို
      တောင်းမှ closure က run သွားတာပါ။ နောက်ဆုံး sum ကတော့ 42 ပါ။
    sources:
      - title: "The Rust Book — Processing a Series of Items with Iterators"
        url: "https://doc.rust-lang.org/book/ch13-02-iterators.html"
    actions:
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "doubled, over 5: [6, 8, 10, 12]"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: ".filter(|x| *x > limit)"

  - id: wrap
    narration: >-
      ဒါဆို ပြန်ချုပ်ရရင်၊ closure ဆိုတာ သူ့ပတ်ဝန်းကျင်က variable တွေကို ယူသုံးနိုင်တဲ့ function
      သေးသေးလေး တစ်ခုပါ။ map နဲ့ filter လို adapter တွေက လုပ်ရမယ့် အဆင့်တွေကို ဖော်ပြပေးပြီး၊
      collect ဒါမှမဟုတ် sum လို consumer တစ်ခုက အဲဒီ အဆင့်တွေကို run ပေးပါတယ်။ နောက် lesson မှာတော့
      အခုထိ လေ့လာခဲ့တာ အားလုံးကို ပေါင်းစပ်ပြီး၊ စကားလုံး ရေတွက်တဲ့ program တစ်ခု ရေးကြည့်သွားပါမယ်။
    sources:
      - title: "The Rust Book — Functional Language Features: Iterators and Closures"
        url: "https://doc.rust-lang.org/book/ch13-00-functional-features.html"
      - title: "The Rust Book — Updating a Value Based on the Old Value (counting words)"
        url: "https://doc.rust-lang.org/book/ch08-03-hash-maps.html#updating-a-value-based-on-the-old-value"
    actions: []

checks:
  - { type: timing.p95Ms, max: 300 }
