# One idea: iterator adapters (filter, map) describe a lazy pipeline over a
# sequence, using closures (|n| ...), and nothing runs until a consumer like
# collect or sum. A whiteboard sketch, then a filter/map/collect chain + sum.
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/rust-iterators.yaml
schemaVersion: 1

lesson:
  slug: rust-iterators
  title: "Rust iterators: lazy pipelines with closures"
  locale: en-US
  workspace:
    lessonType: rust
    name: Rust Lesson
    entryFilePath: main.rs
    files:
      main.rs: |
        fn main() {
            let numbers = [1, 2, 3, 4, 5, 6];
            println!("numbers: {numbers:?}");
        }
  whiteboardAssets:
    - id: it-title
      kind: text
      x: 300
      y: 165
      width: 720
      height: 44
      text: "Iterators — a lazy pipeline"
      strokeColor: "#1e1e1e"
      fontSize: 34
    - id: it-inbox
      kind: rectangle
      x: 300
      y: 300
      width: 230
      height: 74
      strokeColor: "#1e1e1e"
    - id: it-inval
      kind: text
      x: 318
      y: 326
      width: 210
      height: 34
      text: "[1,2,3,4,5,6]"
      strokeColor: "#1e1e1e"
      fontSize: 24
    - id: it-op1
      kind: text
      x: 548
      y: 286
      width: 90
      height: 30
      text: "filter"
      strokeColor: "#1971c2"
      fontSize: 22
    - id: it-arrow1
      kind: text
      x: 556
      y: 320
      width: 44
      height: 40
      text: "→"
      strokeColor: "#80868b"
      fontSize: 32
    - id: it-midbox
      kind: rectangle
      x: 610
      y: 300
      width: 150
      height: 74
      strokeColor: "#1971c2"
    - id: it-midval
      kind: text
      x: 632
      y: 326
      width: 130
      height: 34
      text: "[2, 4, 6]"
      strokeColor: "#1971c2"
      fontSize: 24
    - id: it-op2
      kind: text
      x: 782
      y: 286
      width: 90
      height: 30
      text: "map"
      strokeColor: "#f08c00"
      fontSize: 22
    - id: it-arrow2
      kind: text
      x: 786
      y: 320
      width: 44
      height: 40
      text: "→"
      strokeColor: "#80868b"
      fontSize: 32
    - id: it-outbox
      kind: rectangle
      x: 840
      y: 300
      width: 195
      height: 74
      strokeColor: "#2f9e44"
    - id: it-outval
      kind: text
      x: 858
      y: 326
      width: 175
      height: 34
      text: "[20, 40, 60]"
      strokeColor: "#2f9e44"
      fontSize: 24
    - id: it-note
      kind: text
      x: 340
      y: 440
      width: 760
      height: 36
      text: "lazy — nothing runs until collect or sum"
      strokeColor: "#1e1e1e"
      fontSize: 26

build:
  voiceProfile: pocket-alba-v1
  seed: 41

runtime:
  kind: rust-playground
  defaultMode: fixture
  fixture:
    latencyMs: 2000
    result:
      status: success
      stdout: "numbers: [1, 2, 3, 4, 5, 6]\nevens doubled: [20, 40, 60]\nsum: 21\n"
      stderr: ""

scenes:
  - id: the-pipeline
    narration: >
      [[mark:board]] Iterators describe a pipeline over a sequence, and it's
      lazy. [[mark:show-in]] Start with six numbers. [[mark:show-filter]] filter
      keeps the even ones — two, four, six. [[mark:show-map]] map multiplies
      each by ten — twenty, forty, sixty. [[mark:show-note]] Nothing actually
      runs until collect gathers the result, or sum adds it up.
      [[mark:board-close]] Let's chain them.
    sources:
      - title: "The Rust Book — Processing a Series of Items with Iterators"
        url: "https://doc.rust-lang.org/book/ch13-02-iterators.html"
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { mark: board }
        open: true
        upsertIds: [it-title]
      - id: show-in
        type: whiteboard.apply
        at: { mark: show-in }
        upsertIds: [it-inbox, it-inval]
      - id: show-filter
        type: whiteboard.apply
        at: { mark: show-filter }
        upsertIds: [it-op1, it-arrow1, it-midbox, it-midval]
      - id: show-map
        type: whiteboard.apply
        at: { mark: show-map }
        upsertIds: [it-op2, it-arrow2, it-outbox, it-outval]
      - id: show-note
        type: whiteboard.apply
        at: { mark: show-note }
        upsertIds: [it-note]
      - id: close-board
        type: whiteboard.apply
        at: { mark: board-close }
        open: false

  - id: the-chain
    narration: >
      [[mark:open]] Here are six numbers. [[mark:type-chain]] We build a
      pipeline. iter goes through them, copied gives plain values, filter keeps
      the even ones, and map multiplies each by ten. collect gathers the
      results into a Vec — twenty, forty, sixty.
    sources:
      - title: "The Rust Book — Iterator Adaptors"
        url: "https://doc.rust-lang.org/book/ch13-02-iterators.html#methods-that-produce-other-iterators"
    actions:
      - id: open-main
        type: workspace.openFile
        at: { mark: open }
        path: main.rs
      - id: type-chain
        type: editor.type
        at: { mark: type-chain, offsetMs: -400 }
        target:
          file: main.rs
          after: "    println!(\"numbers: {numbers:?}\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "    let evens_doubled: Vec<i32> = numbers\n        .iter()\n        .copied()\n        .filter(|n| n % 2 == 0)\n        .map(|n| n * 10)\n        .collect();\n    println!(\"evens doubled: {evens_doubled:?}\");\n"

  - id: the-consumer
    narration: >
      [[mark:type-sum]] Not every chain ends in collect. sum is a consumer too
      — it goes through the numbers and adds them into one total, twenty-one.
    sources:
      - title: "The Rust Book — Methods that Consume the Iterator"
        url: "https://doc.rust-lang.org/book/ch13-02-iterators.html#methods-that-consume-the-iterator"
    actions:
      - id: type-sum
        type: editor.type
        at: { mark: type-sum, offsetMs: -400 }
        target:
          file: main.rs
          after: "    println!(\"evens doubled: {evens_doubled:?}\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "    let total: i32 = numbers.iter().sum();\n    println!(\"sum: {total}\");\n"

  - id: run
    narration: >
      [[mark:run]] Let's run it. The pipeline gives twenty, forty, sixty, and
      sum returns twenty-one. Iterators let you say what you want, step by
      step, and Rust runs it in one efficient pass.
    sources:
      - title: "Rust Playground"
        url: "https://play.rust-lang.org/"
    actions:
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 800 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "evens doubled: [20, 40, 60]"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: ".filter(|n| n % 2 == 0)"

checks:
  - { type: timing.p95Ms, max: 300 }
