# Rust from zero, lesson 19: iterators and closures.
#
# The arc: a whiteboard shows what an iterator is (iter() on a Vec gives an
# iterator; each next() hands out Some(&item), then None; a for loop calls
# next for you; map, filter and sum are built on next). The editor then
# builds a closure (`let double = |x| x * 2;` — bars hold the parameters, no
# fn, types inferred) and a chain: iter → map → filter → collect into a
# Vec<i32>. The star in filter is explained against map: both closures get a
# reference, times two works on one, a comparison needs the same type on both
# sides. A select on `limit` inside the filter closure leads to the second
# board: a closure captures the variables around it, a fn can't (E0434), and
# why — a closure is a value, like a struct holding what it captures (drawn
# as a box holding &limit), a fn is only code. The
# third board shows laziness: map with nothing after it only earns the
# compiler's "unused `Map` that must be used / iterators are lazy and do
# nothing unless consumed" warning; adapters describe steps, a consumer runs
# them, one item at a time. Back in the editor a map whose closure prints
# proves it: "nothing doubled yet" prints before any "doubling", because the
# closure only runs when sum asks for items. One run.
#
# Every compiler message on a board or in the narration was confirmed with
# rustc 1.98 (edition 2024) on the broken variants:
#   let limit = 5; fn is_big(x: i32) -> bool { x > limit }
#     error[E0434]: can't capture dynamic environment in a fn item
#     help: use the `|| { ... }` closure form instead
#   numbers.iter().map(|x| x * 2);   (nothing consumes it)
#     warning: unused `Map` that must be used
#     = note: iterators are lazy and do nothing unless consumed
#   .filter(|x| x > limit)   (no star) — not shown, but it is why the star
#     is there: error[E0308]: mismatched types, expected `&_`, found integer
#     (while .map(|x| x * 2) on the same &i32 items compiles, and
#     .filter(|x| x > &limit) compiles too: the two sides just have to match)
# The final program compiles with zero warnings and is rustfmt-clean.
#
# Board colours: blue = the thing being named (the numbers and is_big
# names, the iterator, the captured variable, the adapters), violet = the
# results next() hands out, orange = the caveat (None ends it; the unused Map
# warning), red = the error, green = what works (the for loop, the closure
# and its value box, the consumer). #1e1e1e paints white on the dark board.
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/rust-iterators.yaml
