build:
  voiceProfile: pocket-alba-v1
  seed: 41

runtime:
  kind: rust-playground
  defaultMode: fixture
  fixture:
    latencyMs: 600
    result:
      status: success
      stdout: "numbers: [1, 2, 3, 4, 5, 6]\ndouble(4) = 8\ndoubled, over 5: [6, 8, 10, 12]\nnothing doubled yet\ndoubling 1\ndoubling 2\ndoubling 3\ndoubling 4\ndoubling 5\ndoubling 6\nsum: 42\n"
      stderr: ""

scenes:
  - id: what-is-an-iterator
    chapter: What an iterator is
    narration: >
      You've looped over a Vec with for. That loop uses an iterator.
      [[mark:draw-vec]] Here's a Vec of numbers.
      [[mark:draw-iter]] Call iter on it, and you get an iterator.
      [[mark:draw-next]] An iterator has one main method, next. Each call
      gives you Some with the next item. With iter, that's a reference to it.
      [[mark:draw-none]] When the items run out, next returns None.
      [[mark:draw-for]] A for loop calls next for you, until it gets None.
      [[mark:draw-adapt]] Methods like map, filter and sum are built on next.
      Most take a closure, so let's start there.
    sources:
      - title: "The Rust Book — The Iterator Trait and the next Method"
        url: "https://doc.rust-lang.org/book/ch13-02-iterators.html#the-iterator-trait-and-the-next-method"
      - title: "std::iter — for loops and IntoIterator"
        url: "https://doc.rust-lang.org/std/iter/index.html#for-loops-and-intoiterator"
      - title: "std::iter::Iterator::next"
        url: "https://doc.rust-lang.org/std/iter/trait.Iterator.html#tymethod.next"
    actions:
      # Opens in the quiet handle before the first word, already titled.
      - id: open-board-iter
        type: whiteboard.apply
        at: { scene: start, offsetMs: -1500 }
        open: true
        upsertIds: [i-title]
      - id: draw-vec
        type: whiteboard.apply
        at: { mark: draw-vec }
        upsertIds: [i-name, i-box0, i-val0, i-box1, i-val1, i-box2, i-val2]
        drawMs: 1600
      - id: draw-iter
        type: whiteboard.apply
        at: { mark: draw-iter }
        upsertIds: [i-iter-label, i-iter-arrow, i-iter-box, i-iter-text]
        drawMs: 2000
      - id: draw-next
        type: whiteboard.apply
        at: { mark: draw-next }
        upsertIds: [i-next-arrow, i-next-label, i-some1, i-some2, i-some3]
        drawMs: 3000
      - id: draw-none
        type: whiteboard.apply
        at: { mark: draw-none }
        upsertIds: [i-none]
        drawMs: 800
      - id: draw-for
        type: whiteboard.apply
        at: { mark: draw-for }
        upsertIds: [i-for]
        drawMs: 1600
      - id: draw-adapt
        type: whiteboard.apply
        at: { mark: draw-adapt }
        upsertIds: [i-adapt]
        drawMs: 1600

  - id: closures
    chapter: Closures
    narration: >
      A closure is a small function with no name.
      [[mark:type-double]] Let's store one in a variable called double. A
      closure is a value, so it can go in a variable like a number can.
      [[mark:select-bars]] The parameters go between the two bars. Here
      there's one, x. Then comes the body, x times two. There's no f n
      keyword, and no types. The compiler works them out from how you use it.
      [[mark:type-call-double]] You call it like any other function. Let's
      call it with four.
    sources:
      - title: "The Rust Book — Closures"
        url: "https://doc.rust-lang.org/book/ch13-01-closures.html"
      - title: "The Rust Book — Closure Type Inference and Annotation"
        url: "https://doc.rust-lang.org/book/ch13-01-closures.html#closure-type-inference-and-annotation"
      - title: "The Rust Reference — Closure expressions"
        url: "https://doc.rust-lang.org/reference/expressions/closure-expr.html"
    actions:
      - id: close-board-iter
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-main
        type: workspace.openFile
        at: { scene: start, offsetMs: 900 }
        path: main.rs
      - id: type-double
        type: editor.type
        at: { mark: type-double, offsetMs: -200 }
        target:
          file: main.rs
          after: "    println!(\"numbers: {numbers:?}\");\n"
          occurrence: 1
        cadence: fast-explainer
        text: "\n    let double = |x| x * 2;\n"
      - id: select-bars
        type: editor.select
        at: { mark: select-bars }
        target:
          file: main.rs
          text: "|x|"
          occurrence: 1
      - id: type-call-double
        type: editor.type
        at: { mark: type-call-double }
        target:
          file: main.rs
          after: "    let double = |x| x * 2;\n"
          occurrence: 1
        cadence: line-by-line
        text: "    println!(\"double(4) = {}\", double(4));\n"

  - id: chain
    chapter: Map, filter, collect
    narration: >
      Let's give closures to an iterator.
      [[mark:type-chain]] We set a limit of five. Then we build a chain of
      steps on our numbers: iter, then map, then filter, and last, collect.
      [[mark:select-map]] map calls its closure on every item and passes on
      the result: each number, doubled.
      [[mark:select-filter]] filter keeps an item only when its closure
      returns true. It only looks at each item, so x is a reference. Math
      like times two works on a reference, but a comparison needs the same
      type on both sides. So the star reads the number behind x.
      [[mark:select-vec-type]] collect gathers the results into a new
      collection. It can build many kinds, so we name the one we want: a Vec
      of i32.
    sources:
      - title: "The Rust Book — Methods that Produce Other Iterators"
        url: "https://doc.rust-lang.org/book/ch13-02-iterators.html#methods-that-produce-other-iterators"
      - title: "std::iter::Iterator::map"
        url: "https://doc.rust-lang.org/std/iter/trait.Iterator.html#method.map"
      - title: "std::iter::Iterator::filter"
        url: "https://doc.rust-lang.org/std/iter/trait.Iterator.html#method.filter"
      - title: "i32 — impl Mul<i32> for &i32 (times two works on a reference)"
        url: "https://doc.rust-lang.org/std/primitive.i32.html#impl-Mul%3Ci32%3E-for-%26i32"
      - title: "i32 — impl PartialOrd for i32 (an i32 compares with an i32)"
        url: "https://doc.rust-lang.org/std/primitive.i32.html#impl-PartialOrd-for-i32"
      - title: "std::iter::Iterator::collect"
        url: "https://doc.rust-lang.org/std/iter/trait.Iterator.html#method.collect"
    actions:
      - id: type-chain
        type: editor.type
        at: { mark: type-chain, offsetMs: -200 }
        target:
          file: main.rs
          after: "double(4));\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n    let limit = 5;\n    let big: Vec<i32> = numbers\n        .iter()\n        .map(|x| x * 2)\n        .filter(|x| *x > limit)\n        .collect();\n    println!(\"doubled, over {limit}: {big:?}\");\n"
      - id: select-map
        type: editor.select
        at: { mark: select-map }
        target:
          file: main.rs
          text: ".map(|x| x * 2)"
          occurrence: 1
      - id: select-filter
        type: editor.select
        at: { mark: select-filter }
        target:
          file: main.rs
          text: ".filter(|x| *x > limit)"
          occurrence: 1
      - id: select-vec-type
        type: editor.select
        at: { mark: select-vec-type }
        target:
          file: main.rs
          text: "Vec<i32>"
          occurrence: 1

  - id: capture
    narration: >
      [[mark:select-limit]] Look at limit, inside the filter closure. It
      isn't a parameter. It's a variable from main, and the closure can use
      it. That's called capturing.
      [[mark:open-capture]] A function can't do that.
      [[mark:draw-fn]] Here's the same check, written as a normal function
      inside main.
      [[mark:draw-err]] The compiler stops with error E0434: can't capture
      dynamic environment in an f n item. The environment means the variables
      around it.
      [[mark:draw-closure]] As a closure, the same check works.
      [[mark:draw-holds]] A closure is a value, a bit like a struct that
      holds what it captures. A normal function is only code, with nowhere to
      keep limit.
    sources:
      - title: "The Rust Book — Capturing References or Moving Ownership"
        url: "https://doc.rust-lang.org/book/ch13-01-closures.html#capturing-references-or-moving-ownership"
      - title: "The Rust Book — Using Closures that Capture Their Environment"
        url: "https://doc.rust-lang.org/book/ch13-02-iterators.html#using-closures-that-capture-their-environment"
      - title: "Rust error codes — E0434"
        url: "https://doc.rust-lang.org/error_codes/E0434.html"
      - title: "The Rust Reference — Closure types (like a struct holding the captured values)"
        url: "https://doc.rust-lang.org/reference/types/closure.html#r-type.closure.intro"
    actions:
      - id: select-limit
        type: editor.select
        at: { mark: select-limit }
        target:
          file: main.rs
          text: "limit"
          occurrence: 2
      - id: open-board-capture
        type: whiteboard.apply
        at: { mark: open-capture }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-fn
        type: whiteboard.apply
        at: { mark: draw-fn }
        upsertIds: [c-let, c-fn1, c-fn2, c-fn3]
        drawMs: 2400
      - id: draw-err
        type: whiteboard.apply
        at: { mark: draw-err }
        upsertIds: [c-fn-u, c-err1, c-err2]
        drawMs: 2600
      - id: draw-closure
        type: whiteboard.apply
        at: { mark: draw-closure }
        upsertIds: [c-cl, c-cl-u, c-works]
        drawMs: 2200
      - id: draw-holds
        type: whiteboard.apply
        at: { mark: draw-holds }
        upsertIds: [c-hold-arrow, c-hold-name, c-hold-box, c-hold-ref]
        drawMs: 2400

  - id: lazy
    chapter: Lazy until consumed
    narration: >
      One more thing about map and filter.
      [[mark:draw-lazy-code]] Say you call map, with nothing after it.
      [[mark:draw-warning]] It compiles, but you get a warning: unused Map
      that must be used. The note says why. Iterators are lazy, and do
      nothing unless consumed.
      [[mark:draw-adapters]] map and filter are adapters. Each one returns a
      new iterator that only describes a step. Nothing runs yet.
      [[mark:draw-consumer]] A consumer, like sum, collect, or a for loop,
      runs the chain.
      [[mark:draw-pass]] It asks for one item at a time, and each item goes
      through every step. No extra Vec is built in between. And the chain
      runs about as fast as a loop you'd write by hand.
    sources:
      - title: "The Rust Book — Methods that Produce Other Iterators (the lazy warning)"
        url: "https://doc.rust-lang.org/book/ch13-02-iterators.html#methods-that-produce-other-iterators"
      - title: "std::iter — Laziness"
        url: "https://doc.rust-lang.org/std/iter/index.html#laziness"
      - title: "The Rust Book — Comparing Performance: Loops vs. Iterators"
        url: "https://doc.rust-lang.org/book/ch13-04-performance.html"
    actions:
      - id: open-board-lazy
        type: whiteboard.apply
        at: { scene: start, offsetMs: -300 }
        clear: true
        upsertIds: [l-title]
      - id: draw-lazy-code
        type: whiteboard.apply
        at: { mark: draw-lazy-code }
        upsertIds: [l-code]
        drawMs: 1400
      - id: draw-warning
        type: whiteboard.apply
        at: { mark: draw-warning }
        upsertIds: [l-code-u, l-warn, l-note]
        drawMs: 3000
      - id: draw-adapters
        type: whiteboard.apply
        at: { mark: draw-adapters }
        upsertIds: [l-map-box, l-map-text, l-arrow1, l-filter-box, l-filter-text, l-adapters]
        drawMs: 2800
      - id: draw-consumer
        type: whiteboard.apply
        at: { mark: draw-consumer }
        upsertIds: [l-arrow2, l-sum-box, l-sum-text, l-consumer]
        drawMs: 2000
      - id: draw-pass
        type: whiteboard.apply
        at: { mark: draw-pass }
        upsertIds: [l-pass]
        drawMs: 1800

  - id: lazy-code
    narration: >
      Let's watch that happen.
      [[mark:type-lazy]] Here's map again. This closure's body is a block,
      so it can print each number, then return it doubled.
      [[mark:type-sum]] Then we print a line, and only after that, we call
      sum.
      [[mark:select-sum]] sum is the consumer here. Like collect, it needs
      the result type, so total is an i32.
    sources:
      - title: "The Rust Book — Methods that Consume the Iterator"
        url: "https://doc.rust-lang.org/book/ch13-02-iterators.html#methods-that-consume-the-iterator"
      - title: "std::iter::Iterator::sum"
        url: "https://doc.rust-lang.org/std/iter/trait.Iterator.html#method.sum"
    actions:
      - id: close-board-lazy
        type: whiteboard.apply
        at: { scene: start, offsetMs: -400 }
        open: false
      - id: type-lazy
        type: editor.type
        at: { mark: type-lazy, offsetMs: -200 }
        target:
          file: main.rs
          after: "{big:?}\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n    let doubled = numbers.iter().map(|x| {\n        println!(\"doubling {x}\");\n        x * 2\n    });\n"
      - id: type-sum
        type: editor.type
        at: { mark: type-sum, offsetMs: -200 }
        target:
          file: main.rs
          after: "        x * 2\n    });\n"
          occurrence: 1
        cadence: line-by-line
        text: "    println!(\"nothing doubled yet\");\n    let total: i32 = doubled.sum();\n    println!(\"sum: {total}\");\n"
      - id: select-sum
        type: editor.select
        at: { mark: select-sum }
        target:
          file: main.rs
          text: "doubled.sum()"
          occurrence: 1

  - id: run
    narration: >
      [[mark:run]] Let's run it. Double of four is eight. The chain keeps
      six, eight, ten and twelve. Now look at the order. The line that says
      nothing doubled yet comes before every doubling line. The closure only
      ran when sum asked for the items. And the sum is forty-two.
    sources:
      - title: "The Rust Book — Processing a Series of Items with Iterators"
        url: "https://doc.rust-lang.org/book/ch13-02-iterators.html"
    actions:
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "doubled, over 5: [6, 8, 10, 12]"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: ".filter(|x| *x > limit)"

  - id: wrap
    narration: >
      So a closure is a small function that can use the variables around it.
      Adapters like map and filter describe the steps, and a consumer like
      collect or sum runs them. Next, we'll put it all together in a word
      counter.
    sources:
      - title: "The Rust Book — Functional Language Features: Iterators and Closures"
        url: "https://doc.rust-lang.org/book/ch13-00-functional-features.html"
      - title: "The Rust Book — Updating a Value Based on the Old Value (counting words)"
        url: "https://doc.rust-lang.org/book/ch08-03-hash-maps.html#updating-a-value-based-on-the-old-value"
    actions: []

checks:
  - { type: timing.p95Ms, max: 300 }
