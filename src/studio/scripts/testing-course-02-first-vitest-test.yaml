# Testing course, lesson 02: the first Vitest test (Burmese).
#
# Teaches: what a test runner does (find test files, run each test, report) and why this course
# uses Vitest (little setup, built on Vite, ES modules, a Jest-like API; about three times Jest's npm
# downloads, B07); the set-up read from package.json (vitest + its required peer vite as dev
# dependencies, Node 22.12+, the "test" script, Bun's `bun run test`); test files found by name;
# importing test and expect from "vitest" (globals are off); reading a failure (the FAIL line, the
# message, Expected / Received, the code frame) and deciding which side is wrong; watch mode versus
# `vitest run` (drawn, never a terminal on screen).
#
# Start state (ws/): package.json exactly as base/ ("test": "vitest"); src/menu.js, the canonical menu
# with coffee priced 180 (a missing zero, the planted bug); src/menu.test.js "copied from an old
# tutorial": it imports priceOf but has no vitest import, and holds two tests (tea costs 1500,
# coffee costs 1800). Panel (data-modes "tests errors summary"): FAIL, a Failed Suite (data-kind
# suite) "ReferenceError: test is not defined" at src/menu.test.js:3:1, Tests no tests (0).
#
# Then, insert-only:
#   1. menu.test.js, keystrokes at the top: import { expect, test } from "vitest"; -> 1 passed,
#      1 failed: "AssertionError: expected 180 to be 1800 // Object.is equality", - 1800 / + 180,
#      frame src/menu.test.js:9:29.
#   2. menu.js, one keystroke: "0" after "price: 180" -> PASS, Tests 2 passed (2).
# Boards: (A) what a test runner does (find -> run -> report) + why Vitest; (B) file names Vitest
# finds / ignores; (C) the shop's menu board decides which side is wrong; (D) on your own terminal:
# the install line, `vitest` (watch) and `vitest run` (once), npm test, bun run test.
#
# Build: bun ~/Documents/testing-course-work/tools/build-lesson.ts template.yaml ws testing-course-02-first-vitest-test.yaml
# Adapted from web.dev Learn Testing (Sam Thorogood et al.; text CC BY 4.0, code Apache 2.0) and the
# Vitest docs (MIT); every example is new.
schemaVersion: 1
lesson:
  slug: testing-course-02-first-vitest-test
  title: "Testing course 02: Vitest နဲ့ ပထမဆုံး test"
  locale: my-MM
  workspace:
    lessonType: javascript
    name: Testing course
    entryFilePath: package.json
    files:
      course/panel.js: |
        // Testing course · Vitest panel (runs in the preview page; pinned, never edited).
        // Draws what course/vitest-bridge.js reports from the real Vitest, laid out like Vitest's own
        // terminal reporter: the test tree (✓ × ↓ □), the failures (FAIL, the error line, - Expected /
        // + Received, the ❯ file:line:col code frame), the Test Files / Tests summary, console output,
        // snapshots and coverage. Plain DOM only, so the studio's recording replays it exactly.
        //
        //   <script type="module" src="/course/panel.js"
        //           data-modes="tests errors summary console" data-app="src/app.js"></script>
        //
        // data-modes: the sections, drawn in the order listed: tests errors summary console snapshot coverage
        //             lint (ESLint on src/, when the workspace installs eslint).
        // data-app:   a module whose default export mounts the lesson's UI: mount(rootElement). It is drawn
        //             in #app above the report and mounted again whenever its code changes.
        const EVENT = "course:vitest";
        const script = document.querySelector('script[src$="/course/panel.js"]');
        const MODES = ["tests", "errors", "summary", "console", "snapshot", "coverage", "lint"];
        const modes = (script?.dataset.modes || "tests errors summary console").split(/\s+/).filter((m) => MODES.includes(m));
        const appEntry = script?.dataset.app || "";

        const STYLE = `
        :root { color-scheme: dark; }
        html, body { margin: 0; background: #1b1d23; }
        #app { color-scheme: light; font: 15px/1.5 system-ui, "Noto Sans Myanmar", "Myanmar Sangam MN", "Myanmar Text", sans-serif; color: #1f2328; background: #f7f4ee; }
        #app:empty { display: none; }
        #vt-panel { font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", "Noto Sans Myanmar", "Myanmar Sangam MN", "Myanmar Text", monospace; color: #d6d9df; padding: 0 0 24px; }
        #vt-panel * { box-sizing: border-box; }
        .vt-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 10px; padding: 9px 14px; background: #23262e; border-bottom: 1px solid #30343d; }
        .vt-logo { font-weight: 700; color: #1b1d23; background: #fcc72b; border-radius: 4px; padding: 0 6px; font-size: 12px; }
        .vt-title { font-weight: 600; color: #fff; }
        .vt-status { margin-left: auto; font-weight: 700; padding: 1px 10px; border-radius: 4px; font-size: 12px; letter-spacing: .04em; }
        .vt-status[data-state="pass"] { background: #2ea043; color: #fff; }
        .vt-status[data-state="fail"] { background: #da3633; color: #fff; }
        .vt-status[data-state="running"], .vt-status[data-state="waiting"] { background: #1f6feb; color: #fff; }
        .vt-sec { padding: 8px 14px 2px; }
        .vt-sec[data-empty] { display: none; }
        .vt-row { white-space: pre-wrap; overflow-wrap: anywhere; }
        .vt-pass { color: #3fb950; } .vt-fail { color: #f85149; } .vt-skip, .vt-todo { color: #d29922; } .vt-dim { color: #8b929e; }
        .vt-note { color: #8b929e; }
        .vt-bar { color: #f85149; margin: 8px 0 6px; white-space: nowrap; overflow: hidden; }
        .vt-err { margin: 0 0 14px; }
        .vt-badge { display: inline-block; background: #da3633; color: #fff; font-weight: 700; padding: 0 5px; margin-right: 6px; border-radius: 2px; }
        .vt-msg { color: #ff7b72; white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 2px; }
        .vt-msg b { font-weight: 700; }
        .vt-diff { margin: 8px 0 0; }
        .vt-diff > div { white-space: pre-wrap; overflow-wrap: anywhere; }
        .vt-exp { color: #3fb950; } .vt-rec { color: #f85149; }
        .vt-at { color: #79c0ff; margin-top: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
        .vt-at.vt-other { color: #8b929e; margin-top: 0; }
        .vt-frame { position: relative; overflow-x: auto; font-size: 12px; color: #c9d1d9; margin: 2px 0 0; }
        .vt-frame > div { white-space: pre; }
        .vt-frame .vt-ln { color: #6e7681; }
        .vt-frame .vt-caret { color: #f85149; }
        .vt-frame .vt-pad::before { content: attr(data-pad); visibility: hidden; }
        .vt-plugin { color: #d29922; white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 4px; }
        .vt-sum { white-space: pre; }
        .vt-log { margin: 0 0 8px; }
        .vt-log-head { color: #8b929e; overflow-wrap: anywhere; }
        .vt-log-body { white-space: pre-wrap; overflow-wrap: anywhere; color: #e6edf3; }
        .vt-log[data-type="stderr"] .vt-log-head { color: #d29922; }
        .vt-snap { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; background: #23262e; border: 1px solid #30343d; border-radius: 4px; padding: 6px 8px; margin: 4px 0 8px; }
        .vt-cov { border-collapse: collapse; font-size: 12px; width: 100%; }
        .vt-cov th, .vt-cov td { padding: 1px 4px; text-align: right; white-space: nowrap; border-bottom: 1px solid #30343d; }
        .vt-cov th:first-child, .vt-cov td:first-child { text-align: left; }
        .vt-cov th { color: #8b929e; font-weight: 600; }
        .vt-cov .vt-low { color: #f85149; } .vt-cov .vt-mid { color: #d29922; } .vt-cov .vt-high { color: #3fb950; }
        .vt-lint-file { color: #e6edf3; text-decoration: underline; margin-top: 4px; }
        .vt-lint-row { white-space: pre-wrap; overflow-wrap: anywhere; padding-left: 2ch; }
        .vt-lint-row .vt-sev-error { color: #f85149; } .vt-lint-row .vt-sev-warning { color: #d29922; }
        .vt-lint-row .vt-rule { color: #8b929e; }
        .vt-lint-sum { margin-top: 6px; font-weight: 700; }
        `;

        const el = (tag, attrs = {}, ...children) => {
          const node = document.createElement(tag);
          for (const [k, v] of Object.entries(attrs)) {
            if (v === undefined || v === null || v === false) continue;
            if (k === "class") node.className = v;
            else node.setAttribute(k, String(v));
          }
          for (const child of children.flat()) {
            if (child === null || child === undefined || child === false) continue;
            node.append(child instanceof Node ? child : document.createTextNode(String(child)));
          }
          return node;
        };

        const style = document.createElement("style");
        style.textContent = STYLE;
        document.head.append(style);

        let app = null;
        if (appEntry) {
          app = el("div", { id: "app", "data-testid": "app" });
          document.body.append(app);
        }
        const panel = el("section", { id: "vt-panel", "data-seq": "0", "aria-label": "Vitest" });
        document.body.append(panel);
        const status = el("span", { class: "vt-status", "data-testid": "vt-status", "data-state": "waiting" }, "starting");
        panel.append(el("div", { class: "vt-head" }, el("span", { class: "vt-logo" }, "V"), el("span", { class: "vt-title" }, "Vitest"), status));

        const sections = {};
        for (const mode of modes) {
          const body = el("div", { "data-testid": `vt-${mode === "tests" ? "tests" : mode}` });
          const wrap = el("div", { class: "vt-sec", "data-section": mode }, body);
          sections[mode] = { wrap, body };
          panel.append(wrap);
        }
        const show = (mode, visible) => {
          const s = sections[mode];
          if (!s) return;
          if (visible) s.wrap.removeAttribute("data-empty");
          else s.wrap.setAttribute("data-empty", "");
        };

        // ---------------------------------------------------------------- the tree
        const ICON = { pass: "✓", fail: "×", skip: "↓", todo: "□", pending: "·" };
        const plural = (n, one, many = `${one}s`) => `${n} ${n === 1 ? one : many}`;

        function renderTests(report) {
          const s = sections.tests;
          if (!s) return;
          let fileNo = 0;
          let suiteNo = 0;
          let testNo = 0;
          const rows = [];
          const row = (depth, attrs, icon, cls, text) =>
            el("div", { class: "vt-row", style: `padding-left:${depth * 2}ch`, ...attrs }, el("span", { class: cls }, icon), ` ${text}`);
          const walk = (nodes, depth, file) => {
            for (const n of nodes) {
              if (n.kind === "suite") {
                suiteNo += 1;
                const icon = n.state === "fail" ? "❯" : n.state === "skip" ? "↓" : "✓";
                rows.push(row(depth, { "data-testid": `vt-suite-${suiteNo}`, "data-state": n.state, "data-name": n.fullName, "data-file": file }, icon, `vt-${n.state}`, `${n.name} (${n.count})`));
                walk(n.children, depth + 1, file);
              } else {
                testNo += 1;
                rows.push(row(depth, { "data-testid": `vt-test-${testNo}`, "data-state": n.state, "data-name": n.fullName, "data-file": file, "data-line": n.line || null }, ICON[n.state] ?? "·", `vt-${n.state}`, n.name));
              }
            }
          };
          for (const f of report.files ?? []) {
            fileNo += 1;
            const parts = [plural(f.count, "test")];
            if (f.failed) parts.push(`${f.failed} failed`);
            if (f.skipped) parts.push(`${f.skipped} skipped`);
            if (f.todo) parts.push(`${f.todo} todo`);
            const icon = f.state === "fail" ? "❯" : f.state === "skip" ? "↓" : "✓";
            // Type tests (Vitest's typecheck, *.test-d.ts) carry Vitest's " TS " label.
            rows.push(row(0, { "data-testid": `vt-file-${fileNo}`, "data-state": f.state, "data-file": f.file, "data-typecheck": f.typecheck ? "true" : null }, icon, `vt-${f.state}`, `${f.typecheck ? "TS " : ""}${f.file} (${parts.join(" | ")})`));
            walk(f.tests, 1, f.file);
          }
          if (!rows.length) rows.push(el("div", { class: "vt-note" }, report.note || "No test files found."));
          s.body.dataset.count = String(testNo);
          s.body.dataset.files = String(fileNo);
          s.body.replaceChildren(...joinLines(rows));
        }

        // ---------------------------------------------------------------- failures
        const GROUPS = { start: "Startup Error", suite: "Failed Suites", test: "Failed Tests", unhandled: "Unhandled Errors" };

        // Block elements plus "\n" text nodes: the layout is unchanged and textContent reads like the terminal.
        const joinLines = (nodes) => nodes.flatMap((node, i) => (i ? ["\n", node] : [node]));

        function diffLines(diff) {
          return joinLines(
            diff.split("\n").map((line) => {
              const cls = line.startsWith("-") ? "vt-exp" : line.startsWith("+") ? "vt-rec" : null;
              return el("div", { class: cls }, line === "" ? "\u00a0" : line);
            }),
          );
        }

        function frameBlock(frame, n, near) {
          if (!frame?.length) return null;
          const width = Math.max(...frame.filter((l) => l.no).map((l) => String(l.no).length), 2);
          const code = frame.map((l) => l.text);
          const indent = Math.min(...code.filter((t, i) => frame[i].no && t.trim()).map((t) => t.match(/^ */)[0].length));
          const cut = Number.isFinite(indent) ? indent : 0;
          // The caret sits under the column it names: an invisible copy of the code before it (Burmese
          // vowel signs are narrower than one monospace cell, so counting characters would drift).
          const failing = frame.findIndex((l) => !l.no) - 1;
          const lines = frame.map((l) => {
            const gutter = el("span", { class: "vt-ln" }, `${l.no ? String(l.no).padStart(width) : " ".repeat(width)}| `);
            if (l.no) return el("div", {}, gutter, l.text.slice(cut));
            const pad = (frame[failing]?.text ?? "").slice(cut, cut + Math.max(0, l.text.length - 1 - cut));
            return el("div", {}, gutter, el("span", { class: "vt-pad", "data-pad": pad }), el("span", { class: "vt-caret" }, "^"));
          });
          return el(
            "div",
            { class: "vt-frame", "data-testid": `vt-frame-${n}`, "data-file": near.file, "data-line": near.line, "data-col": near.col },
            joinLines(lines),
          );
        }

        function renderErrors(report) {
          const s = sections.errors;
          const failures = report.failures ?? [];
          if (!s) return;
          s.body.dataset.count = String(failures.length);
          show("errors", failures.length > 0);
          const out = [];
          let group = null;
          failures.forEach((f, i) => {
            const n = i + 1;
            if (f.kind !== group) {
              group = f.kind;
              const count = failures.filter((x) => x.kind === group).length;
              out.push(el("div", { class: "vt-bar" }, `⎯⎯⎯ ${GROUPS[group] ?? "Errors"} ${count} ⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯`));
            }
            // The heading is Vitest's: "FAIL <file> > <test>", "FAIL <file> [ <file> ]", or the type of an
            // unhandled error ("Unhandled Error", "Unhandled Rejection") after an ERROR badge.
            const parts = [
              el("div", { class: "vt-row" }, el("span", { class: "vt-badge" }, f.kind === "unhandled" ? "ERROR" : "FAIL"), " ", f.title),
              el("div", { class: "vt-msg" }, el("b", {}, f.name), `: ${f.message}`),
            ];
            if (f.plugin) parts.push(el("div", { class: "vt-plugin" }, `  Plugin: ${f.plugin}\n  File: ${f.pluginFile ?? ""}${f.pluginFrame ? `\n${f.pluginFrame}` : ""}`));
            if (f.codeFrame) parts.push(el("div", { class: "vt-plugin" }, f.codeFrame));
            if (f.diff) parts.push(el("div", { class: "vt-diff", "data-testid": `vt-diff-${n}` }, diffLines(f.diff)));
            (f.frames ?? []).forEach((fr, k) => {
              parts.push(el("div", { class: k === 0 ? "vt-at" : "vt-at vt-other" }, ` ❯ ${fr.method ? `${fr.method} ` : ""}${fr.file}:${fr.line}:${fr.col}`));
              if (k === 0) parts.push(frameBlock(f.frame, n, fr));
            });
            out.push(
              el(
                "div",
                {
                  class: "vt-err",
                  "data-testid": `vt-error-${n}`,
                  "data-kind": f.kind,
                  "data-test": f.test || null,
                  "data-name": f.name,
                  "data-message": f.message,
                  "data-expected": f.expected,
                  "data-actual": f.actual,
                  "data-file": f.file || null,
                  "data-line": f.line || null,
                },
                joinLines(parts.filter(Boolean)),
              ),
            );
          });
          s.body.replaceChildren(...joinLines(out));
          // A long failing line: scroll its frame sideways so the caret stays in view (Vitest's terminal
          // cuts such lines off instead).
          for (const frame of s.body.querySelectorAll(".vt-frame")) {
            const caret = frame.querySelector(".vt-caret");
            if (caret && caret.offsetLeft > frame.clientWidth - 24) frame.scrollLeft = Math.round(caret.offsetLeft - frame.clientWidth * 0.6);
          }
        }

        // ---------------------------------------------------------------- summary
        function renderSummary(report) {
          const s = sections.summary;
          if (!s) return;
          const { files, tests } = report.summary ?? { files: {}, tests: {} };
          const f = [files.failed && `${files.failed} failed`, files.passed && `${files.passed} passed`, files.skipped && `${files.skipped} skipped`].filter(Boolean);
          const t = [tests.failed && `${tests.failed} failed`, tests.passed && `${tests.passed} passed`, tests.skipped && `${tests.skipped} skipped`, tests.todo && `${tests.todo} todo`].filter(Boolean);
          const lines = [
            ` Test Files  ${f.length ? f.join(" | ") : "no tests"} (${files.total ?? 0})`,
            `      Tests  ${tests.total ? t.join(" | ") : "no tests"} (${tests.total ?? 0})`,
          ];
          const snap = report.snapshot;
          if (snap && snap.written + snap.matched + snap.failed + snap.updated + snap.obsolete > 0) {
            const p = [snap.failed && `${snap.failed} failed`, snap.written && `${snap.written} written`, snap.updated && `${snap.updated} updated`, snap.obsolete && `${snap.obsolete} obsolete`, snap.matched && `${snap.matched} passed`].filter(Boolean);
            lines.push(`  Snapshots  ${p.join(" | ")}`);
          }
          const attrs = {
            "data-files-failed": files.failed ?? 0,
            "data-files-passed": files.passed ?? 0,
            "data-files-total": files.total ?? 0,
            "data-tests-failed": tests.failed ?? 0,
            "data-tests-passed": tests.passed ?? 0,
            "data-tests-skipped": tests.skipped ?? 0,
            "data-tests-todo": tests.todo ?? 0,
            "data-tests-total": tests.total ?? 0,
          };
          for (const [k, v] of Object.entries(attrs)) s.body.setAttribute(k, String(v));
          s.body.replaceChildren(...joinLines(lines.map((line) => el("div", { class: "vt-sum" }, line))));
        }

        // ---------------------------------------------------------------- console
        function renderConsole(report) {
          const s = sections.console;
          if (!s) return;
          const logs = report.console ?? [];
          s.body.dataset.count = String(logs.length);
          show("console", logs.length > 0);
          s.body.replaceChildren(
            ...logs.map((log, i) =>
              el(
                "div",
                { class: "vt-log", "data-testid": `vt-log-${i + 1}`, "data-type": log.type, "data-file": log.file, "data-test": log.test || null, "data-content": log.content },
                el("div", { class: "vt-log-head" }, `${log.type} | ${log.file}${log.test ? ` > ${log.test}` : ""}`),
                "\n",
                el("div", { class: "vt-log-body" }, log.content),
              ),
            ),
          );
        }

        // ---------------------------------------------------------------- snapshots
        function renderSnapshot(report) {
          const s = sections.snapshot;
          if (!s) return;
          const snap = report.snapshot ?? { files: [] };
          for (const k of ["written", "matched", "failed", "updated", "obsolete"]) s.body.setAttribute(`data-${k}`, String(snap[k] ?? 0));
          s.body.dataset.count = String(snap.files?.length ?? 0);
          show("snapshot", (snap.files?.length ?? 0) > 0);
          s.body.replaceChildren(
            ...(snap.files ?? []).flatMap((file, i) => [
              el("div", { class: "vt-dim" }, file.file),
              el("div", { class: "vt-snap", "data-testid": `vt-snap-${i + 1}`, "data-file": file.file }, file.content.replace(/^\/\/ Vitest Snapshot[^\n]*\n\n?/, "").replace(/\n+$/, "")),
            ]),
          );
        }

        // ---------------------------------------------------------------- coverage
        function renderCoverage(report) {
          const s = sections.coverage;
          if (!s) return;
          const cov = report.coverage;
          show("coverage", !!cov);
          if (!cov) {
            s.body.dataset.count = "0";
            s.body.replaceChildren();
            return;
          }
          s.body.dataset.count = String(cov.rows.length);
          const grade = (p) => (p >= 80 ? "vt-high" : p >= 50 ? "vt-mid" : "vt-low");
          const cells = (r) => ["statements", "branches", "functions", "lines"].map((k) => el("td", { class: grade(r[k]) }, String(r[k])));
          const attrs = (r) => ({ "data-statements": r.statements, "data-branches": r.branches, "data-functions": r.functions, "data-lines": r.lines });
          s.body.replaceChildren(
            el(
              "table",
              { class: "vt-cov" },
              el("thead", {}, el("tr", {}, ["File", "% Stmts", "% Branch", "% Funcs", "% Lines", "Uncovered"].map((h) => el("th", {}, h)))),
              el(
                "tbody",
                {},
                el("tr", { "data-testid": "vt-cov-all", ...attrs(cov.all) }, el("td", {}, "All files"), cells(cov.all), el("td", {}, "")),
                cov.rows.map((r, i) => el("tr", { "data-testid": `vt-cov-${i + 1}`, "data-file": r.file, "data-uncovered": r.uncovered, ...attrs(r) }, el("td", {}, ` ${r.file.replace(/^src\//, "")}`), cells(r), el("td", {}, r.uncovered))),
              ),
            ),
          );
        }

        // ---------------------------------------------------------------- ESLint
        // Laid out like ESLint's default "stylish" formatter.
        let lastLint = null;
        function renderLint(report) {
          const s = sections.lint;
          if (!s) return;
          const lint = report.lint;
          const key = JSON.stringify(lint ?? null);
          if (key === lastLint) return;
          lastLint = key;
          const messages = lint?.messages ?? [];
          s.body.dataset.count = String(messages.length);
          s.body.dataset.errors = String(lint?.errors ?? 0);
          s.body.dataset.warnings = String(lint?.warnings ?? 0);
          const out = [el("div", { class: "vt-dim" }, "ESLint")];
          if (lint?.error) out.push(el("div", { class: "vt-msg" }, lint.error));
          let file = null;
          messages.forEach((m, i) => {
            if (m.file !== file) {
              file = m.file;
              out.push(el("div", { class: "vt-lint-file" }, m.file));
            }
            out.push(
              el(
                "div",
                { class: "vt-lint-row", "data-testid": `vt-lint-${i + 1}`, "data-file": m.file, "data-line": m.line, "data-col": m.col, "data-rule": m.rule, "data-severity": m.severity, "data-message": m.message },
                `${m.line}:${m.col}  `,
                el("span", { class: `vt-sev-${m.severity}` }, m.severity),
                `  ${m.message}  `,
                el("span", { class: "vt-rule" }, m.rule),
              ),
            );
          });
          const n = messages.length;
          out.push(
            el(
              "div",
