build:
  # Studio replaces this built-in profile at render time with the Burmese provider chosen in the
  # render console (AthanLab with the user's own key, or VoxCPM2 when that feature is enabled).
  voiceProfile: pocket-alba-v1
  seed: 5102
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: open
    chapter: "Test runner နဲ့ Vitest"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ test ဆိုတာ တစ်ခုခု မှားနေရင် error throw လုပ်တဲ့ code ဖြစ်တယ်
      ဆိုတာ မြင်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ Vitest ကို project ထဲမှာ ဘယ်လို ထည့်ထားလဲ၊ test ကို
      expect နဲ့ ဘယ်လို ရေးလဲ၊ test ကျရင် Vitest ပြတဲ့ ရလဒ်ကို ဘယ်လို ဖတ်ရလဲ ဆိုတာတွေကို
      ကြည့်ပါမယ်။ [[mark:draw-runner]] Vitest လို tool မျိုးကို test runner လို့ ခေါ်ပါတယ်။ test runner
      ဆိုတာ project ထဲက test ဖိုင်တွေကို ရှာ၊ ဖိုင်ထဲက test တစ်ခုချင်းစီကို run ပြီး၊ ဘယ် test pass
      ဖြစ်လဲ ဘယ် test fail ဖြစ်လဲ ဆိုတာကို စုပြပေးတဲ့ tool ပါ။ ဒါကြောင့် if နဲ့ throw ပါတဲ့ ဖိုင်တွေကို
      ကိုယ်တိုင် တစ်ဖိုင်ချင်း run နေစရာ မလိုတော့ပါဘူး။ [[mark:draw-why]] ဒီ course မှာ Vitest ကို
      ရွေးတဲ့ အကြောင်းက၊ setup လုပ်စရာ နည်းနည်းပဲ လိုလို့ပါ။ Vite ဆိုတဲ့ build tool ပေါ်မှာ
      တည်ဆောက်ထားတဲ့အတွက်၊ Vite project ဆိုရင် အဲဒီ config နဲ့ plugin တွေကို ပြန်သုံးပေးပါတယ်။ ES
      module တွေနဲ့လည်း ကောင်းကောင်း အလုပ်လုပ်ပြီး၊ လူသုံးများတဲ့ Jest ဆိုတဲ့ test runner နဲ့ API
      ပုံစံ အများစု တူပါတယ်။ [[mark:draw-downloads]] npm ပေါ်က download အရေအတွက်ကို ကြည့်ရင်လည်း၊
      ၂၀၂၆ ခုနှစ် နိုဝင်ဘာလ ၄ ရက်နေ့အထိ တစ်ပတ်မှာ Vitest ကို download လုပ်တာက Jest ရဲ့ သုံးဆလောက်
      ရှိပါတယ်။ npm download ဆိုတာ install လုပ်တဲ့ အကြိမ်ရေ ဖြစ်ပြီး ကွန်ပျူတာတွေက အလိုလို install
      လုပ်တာတွေလည်း ပါလို့၊ သုံးတဲ့ လူအရေအတွက်လို့တော့ ယူဆလို့ မရပါဘူး။
    sources:
      - {
          title: "web.dev Learn Testing: Where tests run",
          url: "https://web.dev/learn/testing/get-started/where-tests-run",
        }
      - {
          title: "web.dev Learn Testing: Appendix, Vitest as a test runner",
          url: "https://web.dev/learn/testing/appendix#vitest",
        }
      - { title: "Vitest: Why Vitest", url: "https://vitest.dev/guide/why" }
      - {
          title: "npm downloads API, last week of vitest and jest (facts B07)",
          url: "https://api.npmjs.org/downloads/point/last-week/vitest",
        }
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 300000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-runner
        type: whiteboard.apply
        at: { mark: draw-runner }
        upsertIds:
          [a-find-box, a-find, a-arrow-1, a-run-box, a-run, a-arrow-2, a-report-box, a-report]
        drawMs: 4000
      - id: draw-why
        type: whiteboard.apply
        at: { mark: draw-why }
        upsertIds: [a-why-title, a-why-1, a-why-2, a-why-3]
        drawMs: 4000
      - id: draw-downloads
        type: whiteboard.apply
        at: { mark: draw-downloads }
        upsertIds: [a-why-4]
        drawMs: 1500

  - id: setup
    narration: >
      [[mark:close-runner]] ဒါဆို Vitest ကို project ထဲမှာ ဘယ်လို ထည့်ထားလဲ ကြည့်ရအောင်။ ဒါက project
      ရဲ့ package json ဖိုင်ပါ။ [[mark:select-deps]] dev dependency တွေထဲမှာ vite နဲ့ vitest နှစ်ခု
      ပါပါတယ်။ ကိုယ့် project မှာ ဆိုရင် npm install command နဲ့ vitest ကို dev dependency အဖြစ်
      ထည့်ရပါတယ်။ Vitest ၅ ကစပြီး vite က မဖြစ်မနေ လိုအပ်တဲ့ peer dependency ဖြစ်လာလို့ project ထဲမှာ
      vite လည်း ရှိရပြီး၊ npm နဲ့ pnpm က အဲဒါကို အလိုလို ထည့်ပေးပါတယ်။ Node ကလည်း ၂၂ ဒသမ ၁၂ နဲ့
      အထက် ဖြစ်ရပါမယ်။ [[mark:select-script]] scripts ထဲက test ဆိုတဲ့ script ကတော့ ကိုယ့် ကွန်ပျူတာမှာ
      test တွေကို run တဲ့ command ပါ။ test ဆိုတဲ့ နာမည်က npm မှာ အထူး အဓိပ္ပာယ် ရှိပြီး၊ terminal မှာ
      npm test လို့ ရိုက်လိုက်ရင် ဒီ script ကို run ပေးပါတယ်။ ဒီမှာတော့ vitest ကို run ခိုင်းထားပါတယ်။
      Bun သုံးတဲ့သူတွေကတော့ bun test လို့ မရိုက်ဘဲ bun run test လို့ ရိုက်ပါ။ bun test က Bun ရဲ့
      ကိုယ်ပိုင် test runner ကို run လို့ပါ။
    sources:
      - { title: "Vitest: Getting Started", url: "https://vitest.dev/guide/" }
      - {
          title: "Vitest: Migration guide, Vitest 5 requirements (facts A01, A02)",
          url: "https://vitest.dev/guide/migration/",
        }
      - {
          title: "web.dev Learn Testing: Prerequisite script",
          url: "https://web.dev/learn/testing/get-started/where-tests-run#prereq-script",
        }
    actions:
      - id: close-runner
        type: whiteboard.apply
        at: { mark: close-runner }
        open: false
      - id: select-deps
        type: editor.select
        at: { mark: select-deps }
        target:
          {
            file: package.json,
            text: "\"vite\": \"7.3.7\",\n    \"vitest\": \"5.1.0\"",
            occurrence: 1,
          }
      - id: select-script
        type: editor.select
        at: { mark: select-script }
        target: { file: package.json, text: '"test": "vitest"', occurrence: 1 }

  - id: file-names
    narration: >
      [[mark:board-names]] Vitest က test ဖိုင်တွေကို ဖိုင်နာမည်နဲ့ ရှာပါတယ်။ [[mark:draw-names-ok]]
      ဖိုင်နာမည်ထဲမှာ test ဒါမှမဟုတ် spec ဆိုတဲ့ အပိုင်း သီးသန့် ပါမှ test ဖိုင်လို့ သိပါတယ်။
      [[mark:draw-names-bad]] ညာဘက်က နှစ်ခုလို test အစား tests လို့ ရေးမိတာ၊ ဒါမှမဟုတ် ပုံစံ
      နည်းနည်း ကွဲသွားတာမျိုးဆိုရင်တော့ Vitest က test ဖိုင်လို့ မသိတော့ပါဘူး။ တခြား test ဖိုင်တွေ
      ရှိနေရင် error တောင် မပြဘဲ ဒီ ဖိုင်ကို ကျော်သွားမှာ ဖြစ်လို့၊ test ရေးထားပေမဲ့ ဘယ်တော့မှ run
      မသွားတာမျိုး ဖြစ်တတ်ပါတယ်။ [[mark:draw-beside]] ဒီ course မှာတော့ test ဖိုင်ကို သူ စစ်တဲ့ code
      ဖိုင်ရဲ့ ဘေးမှာပဲ ထားပါတယ်။ menu ဖိုင်ကို စစ်တဲ့ test တွေကို menu test ဖိုင်ထဲမှာ ရေးတာမျိုးပါ။
    sources:
      - {
          title: "Vitest: include (default test file globs, facts A05)",
          url: "https://vitest.dev/config/include",
        }
      - {
          title: "Vitest: Writing Tests, test files",
          url: "https://vitest.dev/guide/learn/writing-tests#test-files",
        }
    actions:
      - id: board-names
        type: whiteboard.apply
        at: { mark: board-names }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-names-ok
        type: whiteboard.apply
        at: { mark: draw-names-ok }
        upsertIds: [b-ok-box, b-ok-1, b-ok-2]
        drawMs: 2500
      - id: draw-names-bad
        type: whiteboard.apply
        at: { mark: draw-names-bad }
        upsertIds: [b-no-box, b-no-1, b-no-2, b-silent]
        drawMs: 3500
      - id: draw-beside
        type: whiteboard.apply
        at: { mark: draw-beside }
        upsertIds: [b-beside]
        drawMs: 1500

  - id: test-file
    narration: >
      test ဖိုင်ကို ဖွင့်ကြည့်ရအောင်။ [[mark:open-test]] ဒီ ဖိုင်ကို အင်တာနက်ပေါ်က tutorial
      အဟောင်း တစ်ခုကနေ ကူးထားတယ် ဆိုပါစို့။ menu ဖိုင်ထဲက ဈေးနှုန်း ရှာပေးတဲ့ function ကို import
      လုပ်ထားပြီး test နှစ်ခု ပါပါတယ်။ [[mark:select-test]] test တစ်ခုကို test ဆိုတဲ့ function နဲ့
      ရေးပါတယ်။ ပထမ argument က test ရဲ့ နာမည် ဖြစ်ပြီး၊ ဒုတိယ argument ကတော့ စစ်ရမယ့် code ကို
      ထည့်ထားတဲ့ function ပါ။ [[mark:select-expect]] ဒီတစ်ခါ အထဲမှာ if နဲ့ throw ကို ကိုယ်တိုင်
      မရေးတော့ဘဲ expect ကို သုံးထားပါတယ်။ expect ထဲမှာ စစ်ချင်တဲ့ တန်ဖိုးကို ထည့်ပြီး၊ နောက်က to Be
      ထဲမှာ ဖြစ်ရမယ့် တန်ဖိုးကို ရေးပါတယ်။ နှစ်ခု မတူရင် expect က ကိုယ့်ကိုယ်စား error throw
      လုပ်ပေးပြီး၊ ဘာ မှားလဲ ဆိုတာကိုလည်း ရှင်းပြပေးပါတယ်။ ဒီ ဖိုင်မှာ လက်ဖက်ရည် ၁၅၀၀ ကျပ်နဲ့
      ကော်ဖီ ၁၈၀၀ ကျပ်ကို စစ်ထားပါတယ်။
    sources:
      - {
          title: "Vitest: Writing Tests, your first test",
          url: "https://vitest.dev/guide/learn/writing-tests#your-first-test",
        }
      - { title: "Vitest: expect, toBe", url: "https://vitest.dev/api/expect#tobe" }
    actions:
      - id: close-names
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-test
        type: workspace.openFile
        at: { mark: open-test }
        path: src/menu.test.js
      - id: select-test
        type: editor.select
        at: { mark: select-test }
        target: { file: src/menu.test.js, text: 'test("tea costs 1500", () => {', occurrence: 1 }
      - id: select-expect
        type: editor.select
        at: { mark: select-expect }
        target:
          { file: src/menu.test.js, text: 'expect(priceOf("tea")).toBe(1500);', occurrence: 1 }

  - id: panel
    narration: >
      [[mark:ready]] Vitest က ဒီ ဖိုင်ကို run လိုက်တော့ ဘာ ပြလဲ ကြည့်ရအောင်။ ညာဘက်က Vitest panel ကလည်း
      ပြီးခဲ့တဲ့ lesson ကလိုပဲ တကယ့် Vitest ရဲ့ ရလဒ်ကို ပြတာပါ။ [[mark:read-suite]] ဒီတစ်ခါ test
      တစ်ခုမှ မ run ရသေးဘဲ၊ Failed Suites ဆိုတဲ့ အပိုင်းမှာ ဖိုင်တစ်ခုလုံး ကျသွားတယ်လို့ ပြနေပါတယ်။ Failed
      Suites ဆိုတာ test တစ်ခုခုရဲ့ အထဲမှာ မဟုတ်ဘဲ၊ ဖိုင်ကို စ run တုန်းမှာပဲ error တက်သွားတာကို ပြတဲ့
      အပိုင်းပါ။ [[mark:read-reference]] test ဆိုတာ မသတ်မှတ်ရသေးဘူး ဆိုတဲ့ ReferenceError ပေါ်နေပြီး၊ summary မှာလည်း run ခဲ့တဲ့
      test မရှိဘူးလို့ ပြနေပါတယ်။ ဆိုလိုတာက Vitest က ဖိုင်ကို နာမည်နဲ့ ရှာတွေ့ပြီး run ကြည့်ပေမဲ့၊ test
      ဆိုတဲ့ function ကို ဖိုင်ထဲမှာ ဘယ်ကမှ ယူမထားလို့ မသိတာပါ။
    sources:
      - { title: "Vitest: globals (facts A08)", url: "https://vitest.dev/config/globals" }
      - {
          title: "Vitest: Writing Tests, reading test output",
          url: "https://vitest.dev/guide/learn/writing-tests#reading-test-output",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-start-fail
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 3, delayMs: 1000 }
      - id: expect-start-suite
        type: expect.preview
        at: { afterAction: expect-start-fail }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-kind, value: suite }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-message
        type: expect.preview
        at: { afterAction: expect-start-suite }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-message, value: "test is not defined" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-no-tests
        type: expect.preview
        at: { afterAction: expect-start-message }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-total, value: "0" }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: imports
    chapter: "Test နဲ့ expect ကို import လုပ်ရအောင်"
    narration: >
      ဘာကြောင့် ဒီလို ဖြစ်ရလဲဆိုတော့၊ Jest လို runner တချို့က test နဲ့ expect ကို
      ဖိုင်တိုင်းမှာ global အနေနဲ့ အလိုလို ထည့်ပေးထားပေမဲ့၊ Vitest ကတော့ default အနေနဲ့
      မထည့်ပေးလို့ပါ။ ဘယ် function ကို ဘယ်ကနေ ယူသုံးလဲ ဆိုတာ ဖိုင်ထဲမှာ ရှင်းရှင်းလင်းလင်း မြင်ရအောင်
      ဒီလို လုပ်ထားတာ ဖြစ်ပြီး၊ tutorial အဟောင်းက ဒီ ဖိုင်ကတော့ global ရှိမယ်လို့ ယူဆပြီး ရေးထားတာပါ။ [[mark:globals-option]] config ထဲမှာ globals ဆိုတဲ့ option ကို ဖွင့်ရင် Jest လို သုံးလို့ ရပေမဲ့၊ ဒီ course မှာတော့ import
      လုပ်ပြီးပဲ သုံးပါမယ်။ [[mark:type-import]] ဖိုင်ရဲ့ ထိပ်ဆုံးမှာ test နဲ့ expect ကို vitest ကနေ import
      လုပ်တဲ့ line တစ်ကြောင်း ထည့်ပါမယ်။ import လုပ်ထားတော့ editor ကလည်း ဒီ function တွေ ဘယ်က လာလဲ
      သိလို့၊ ရိုက်နေတုန်း အကူအညီ ပေးနိုင်ပါတယ်။ [[mark:read-one-one]] panel ကို ကြည့်ပါ။ Failed Suites
      ပျောက်သွားပြီး test နှစ်ခု run သွားပါပြီ။ လက်ဖက်ရည် test က အမှန်ခြစ်နဲ့ pass ဖြစ်ပေမဲ့၊ ကော်ဖီ test
      ကတော့ ကြက်ခြေခတ်နဲ့ fail ဖြစ်နေပြီး၊ summary မှာလည်း တစ်ခု fail နဲ့ တစ်ခု pass လို့ ပြနေပါတယ်။
    sources:
      - { title: "Vitest: globals (facts A08)", url: "https://vitest.dev/config/globals" }
      - {
          title: "web.dev Learn Testing: Assertions, IDE setup and importing the helpers",
          url: "https://web.dev/learn/testing/assertions/tools#ide-setup",
        }
      - {
          title: "Vitest: Writing Tests, using global imports",
          url: "https://vitest.dev/guide/learn/writing-tests#using-global-imports",
        }
    actions:
      - id: type-import
        type: editor.type
        at: { mark: type-import }
        target: { file: src/menu.test.js, after: "", occurrence: 1 }
        text: "import { expect, test } from \"vitest\";\n"
      - id: expect-one-passed
        type: expect.preview
        at: { afterAction: type-import }
        timeoutMs: 8000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "1" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-one-failed
        type: expect.preview
        at: { afterAction: expect-one-passed }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-failed, value: "1" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-coffee-fails
        type: expect.preview
        at: { afterAction: expect-one-failed }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-2 }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: read-failure
    chapter: "Failure ကို ဘယ်လို ဖတ်မလဲ"
    narration: >
      ကျနေတဲ့ test ရဲ့ ရလဒ်ကို အပိုင်းလိုက် ဖတ်ကြည့်ရအောင်။ Failed Tests အပိုင်းရဲ့ ထိပ်ဆုံးမှာ FAIL ဆိုတဲ့ စာနောက်က ဖိုင်နာမည်နဲ့ test နာမည်ကို ပြထားလို့၊ ဘယ်ဖိုင်ထဲက
      ဘယ် test ကျလဲ ဆိုတာ ချက်ချင်း သိနိုင်ပါတယ်။ [[mark:read-assert]] သူ့အောက်မှာတော့ ၁၈၀၀
      ဖြစ်ရမယ့် နေရာမှာ ၁၈၀ ရနေတယ်လို့ ပြောနေပါတယ်။ ဒီတစ်ခါ message ကို ကိုယ်တိုင် ရေးစရာ မလိုဘဲ
      expect က အလိုလို ထုတ်ပေးတာပါ။ [[mark:read-diff]] ပြီးတော့ Expected နဲ့ Received ဆိုတဲ့ အပိုင်း
      ပါပါတယ်။ Expected က ကိုယ် test ထဲမှာ ရေးထားတဲ့ ဖြစ်သင့်တဲ့ တန်ဖိုး ဖြစ်ပြီး၊ Received ကတော့ code က တကယ် ပြန်ပေးလိုက်တဲ့ တန်ဖိုးပါ။ panel မှာ Expected ကို အစိမ်းရောင်နဲ့၊ Received ကို အနီရောင်နဲ့ ပြထားပါတယ်။ [[mark:select-tobe]] နောက်ဆုံးက code frame ကလည်း test ဖိုင်ရဲ့
      ဒီ line ကို ညွှန်ပြနေပြီး၊ စစ်ရင်း ကျသွားတဲ့ to Be ရဲ့ အောက်မှာ အမှတ်အသား ထားပေးပါတယ်။
      [[mark:board-menu]] ဒါဆို မှားနေတာက test လား၊ code လား။ ဒါကို code မပြင်ခင် အရင် ဆုံးဖြတ်ရပါမယ်။
      ဆိုင်ရဲ့ menu ဘုတ်ကို ကြည့်ရအောင်။ [[mark:circle-coffee]] ကော်ဖီ တစ်ခွက်က ၁၈၀၀ ကျပ် ဖြစ်တဲ့အတွက်
      test က ဆိုင်ရဲ့ ဈေးနှုန်းနဲ့ ကိုက်ပါတယ်။ ဒါကြောင့် ဒီတစ်ခါ မှားနေတာက code ဖြစ်ပြီး၊ menu ဖိုင်ထဲက ကော်ဖီ ဈေးနှုန်းမှာ သုည တစ်လုံး လိုနေတာပါ။
    sources:
      - {
          title: "Vitest: Writing Tests, reading test output",
          url: "https://vitest.dev/guide/learn/writing-tests#reading-test-output",
        }
      - { title: "Vitest: expect, toBe", url: "https://vitest.dev/api/expect#tobe" }
    actions:
      - id: expect-message
        type: expect.preview
        at: { mark: read-assert }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-message, value: "expected 180 to be 1800 // Object.is equality" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-diff
        type: expect.preview
        at: { mark: read-diff }
        timeoutMs: 5000
        target: { by: testId, value: vt-diff-1 }
        textContains: "- 1800"
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-received
        type: expect.preview
        at: { afterAction: expect-diff }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-actual, value: "180" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-tobe
        type: editor.select
        at: { mark: select-tobe }
        target: { file: src/menu.test.js, text: "toBe(1800)", occurrence: 1 }
      - id: expect-frame
        type: expect.preview
        at: { afterAction: select-tobe }
        timeoutMs: 5000
        target: { by: testId, value: vt-frame-1 }
        attribute: { name: data-line, value: "9" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: board-menu
        type: whiteboard.apply
        at: { mark: board-menu }
        open: true
        clear: true
        upsertIds: [c-title, c-board, c-tea, c-coffee, c-lime]
        drawMs: 2500
      - id: circle-coffee
        type: whiteboard.apply
        at: { mark: circle-coffee }
        upsertIds: [c-circle, c-test-ok, c-code-bad]
        drawMs: 2500

  - id: fix
    narration: >
      code ကို ပြင်ကြည့်ရအောင်။ [[mark:open-menu]] ဒါက ဆိုင်ရဲ့ menu ဖိုင်ပါ။ [[mark:select-price]] ကော်ဖီ ဈေးနှုန်းကို ကြည့်ပါ၊
      ၁၈၀ လို့ပဲ ရေးထားပါတယ်။ [[mark:type-zero]] နောက်ကနေ သုည တစ်လုံး ထပ်ထည့်လိုက်ပါမယ်။
      [[mark:read-green]] Vitest က ချက်ချင်း ပြန် run ပြီး၊ test နှစ်ခုလုံး pass ဖြစ်သွားပါပြီ။ summary
      မှာလည်း Tests မှာ ၂ ခု pass လို့ ပြနေပြီး၊ panel ရဲ့ အပေါ်ဆုံးမှာလည်း အစိမ်းရောင် PASS ပေါ်လာပါပြီ။
    sources:
      - { title: "Vitest: Writing Tests", url: "https://vitest.dev/guide/learn/writing-tests" }
    actions:
      - id: close-menu-board
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-menu
        type: workspace.openFile
        at: { mark: open-menu }
        path: src/menu.js
      - id: select-price
        type: editor.select
        at: { mark: select-price }
        target: { file: src/menu.js, text: "price: 180", occurrence: 1 }
      - id: type-zero
        type: editor.type
        at: { mark: type-zero }
        target: { file: src/menu.js, after: "price: 180", occurrence: 1 }
        text: "0"
      - id: expect-green
        type: expect.preview
        at: { afterAction: type-zero }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-two-passed
        type: expect.preview
        at: { afterAction: expect-green }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "2" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-menu-file
        type: expect.file
        at: { afterAction: expect-two-passed }
        path: src/menu.js
        contains: 'coffee: { name: "ကော်ဖီ", price: 1800, drink: true },'
      - id: expect-test-file
        type: expect.file
        at: { afterAction: expect-menu-file }
        path: src/menu.test.js
        contains: "import { expect, test } from \"vitest\";\nimport { priceOf } from \"./menu.js\";"

  - id: run-modes
    chapter: "Watch mode နဲ့ vitest run"
    narration: >
      ခုနက ကိုယ်က ဘာ command မှ ထပ် run စရာ မလိုဘဲ၊ code ပြောင်းလိုက်တာနဲ့ Vitest က
      သူ့ဘာသာ ပြန် run သွားတာကို သတိထားမိမှာပါ။ ဒါကို watch mode လို့ ခေါ်ပါတယ်။ watch mode ဆိုတာ
      code ပြောင်းတိုင်း ဆိုင်ရာ test တွေကို ပြန် run ပေးတဲ့ mode ဖြစ်ပြီး၊ ဒီ lesson ထဲက Vitest ကလည်း
      watch mode နဲ့ run နေတာပါ။ [[mark:board-modes]] ကိုယ့် ကွန်ပျူတာမှာ ဆိုရင်တော့ ဒါတွေကို
      terminal ကနေ run ရပါတယ်။ အပေါ်ဆုံးက line ကတော့ vitest ကို install လုပ်တဲ့ command ပါ။
      [[mark:draw-watch]] terminal မှာ vitest လို့ပဲ run ရင်၊ test တွေ ပြီးသွားတဲ့အခါ မထွက်သွားဘဲ ဖိုင်
      ပြောင်းတာကို စောင့်နေပါတယ်။ ဒါကြောင့် code ရေးနေတုန်း ဘေးမှာ ဖွင့်ထားဖို့ ကောင်းပါတယ်။ [[mark:draw-run]] vitest run ဆိုတဲ့ command ကတော့ test တွေကို တစ်ခါပဲ run
      ပြီး ရလဒ်ကို ပြပြီးတာနဲ့ ထွက်သွားပါတယ်။ code ပြောင်းတိုင်း server ပေါ်မှာ test တွေကို အလိုလို run
      ပေးတဲ့ CI လို စနစ်တွေ၊ AI coding agent တွေက test run တဲ့အခါ ဒီ ပုံစံကို သုံးရပါတယ်။ Vitest ကလည်း
      CI ဒါမှမဟုတ် AI agent က run နေတာကို သိရင် vitest လို့ပဲ ရိုက်ထားလည်း တစ်ခါပဲ run ပေးပေမဲ့၊ အဲဒီ
      နေရာတွေမှာ vitest run လို့ ရှင်းရှင်း ရေးတာ ပိုကောင်းပါတယ်။ [[mark:draw-npm]] package json
      ဖိုင်ထဲက test script ကို npm test နဲ့ run ရင်တော့ အထဲက vitest ကို run တာ ဖြစ်လို့ terminal မှာ
      watch mode နဲ့ စပါတယ်။ တချို့ project တွေမှာ vitest နောက်မှာ run option ကို ထည့်ရေးထားတာလည်း
      တွေ့ရနိုင်ပြီး၊ အဲဒါလည်း vitest run လိုပဲ တစ်ခါပဲ run ပါတယ်။
    sources:
      - {
          title: "Vitest: Command Line Interface, vitest and vitest run",
          url: "https://vitest.dev/guide/cli",
        }
      - { title: "Vitest: watch (facts A03, B08)", url: "https://vitest.dev/config/watch" }
      - {
          title: "web.dev Learn Testing: Manual test invocation",
          url: "https://web.dev/learn/testing/get-started/where-tests-run#manual_test_invocation",
        }
      - {
          title: "web.dev Learn Testing: Check your understanding, the test script (facts B12)",
          url: "https://web.dev/learn/testing/get-started/where-tests-run#check_your_understanding",
        }
    actions:
      - id: board-modes
        type: whiteboard.apply
        at: { mark: board-modes }
        open: true
        clear: true
        upsertIds: [d-title, d-install]
      - id: draw-watch
        type: whiteboard.apply
        at: { mark: draw-watch }
        upsertIds: [d-watch-box, d-watch-cmd, d-watch-1, d-watch-2]
        drawMs: 3000
      - id: draw-run
        type: whiteboard.apply
        at: { mark: draw-run }
        upsertIds: [d-run-box, d-run-cmd, d-run-1, d-run-2]
        drawMs: 3000
      - id: draw-npm
        type: whiteboard.apply
        at: { mark: draw-npm }
        upsertIds: [d-npm, d-bun]
        drawMs: 2500

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:close-modes]] ဒါဆို ပြန်ချုပ်ရရင်၊ test runner က test ဖိုင်တွေကို ရှာ၊ test တစ်ခုချင်း run
      ပြီး ရလဒ်ကို ပြပေးပါတယ်။ Vitest ကို vite နဲ့ အတူ dev dependency အဖြစ် ထည့်ပြီး၊ package json ရဲ့
      test script ကနေ run ပါတယ်။ test ဖိုင် နာမည်မှာ test ဒါမှမဟုတ် spec ပါမှ Vitest က ရှာတွေ့ပြီး၊
      ဖိုင်တိုင်းမှာ test နဲ့ expect ကို vitest ကနေ import လုပ်ရပါတယ်။ [[mark:recap-read]] test ကျရင်တော့
      ဘယ် test ကျလဲ၊ ဘာ ဖြစ်ရမှာလဲ၊ ဘာ ရနေလဲ၊ ဘယ် line မှာလဲ ဆိုတာကို အစဉ်လိုက် ဖတ်ပြီး၊ code ကို
      မပြင်ခင် test နဲ့ code ဘယ်ဘက်က မှားနေလဲ အရင် ဆုံးဖြတ်ပါ။ နောက် lesson မှာတော့ to Be အပြင် တခြား
      matcher တွေကို ဘယ်လို တန်ဖိုးအတွက် ဘယ်ဟာ သုံးရမလဲ ဆိုတာနဲ့၊ diff တွေကို ဖတ်နည်းကို ကြည့်သွားပါမယ်။
    sources:
      - { title: "Vitest: Writing Tests", url: "https://vitest.dev/guide/learn/writing-tests" }
      - {
          title: "web.dev Learn Testing: Where tests run",
          url: "https://web.dev/learn/testing/get-started/where-tests-run",
        }
    actions:
      - id: close-modes
        type: whiteboard.apply
        at: { mark: close-modes }
        open: false
checks:
  - { type: timing.p95Ms, max: 300 }
