            }
            vite.parseAst(code, { jsx: /x$/.test(file) });
            return true;
          } catch {
            return false;
          }
        }

        // -------------------------------------------------------------------- the report
        const stripAnsi = (text) => String(text ?? "").replace(/\x1b\[[0-9;?]*[A-Za-z]/g, "");
        const flatten = (nodes) => nodes.flatMap((n) => (n.kind === "suite" ? flatten(n.children) : [n]));

        function emptySummary() {
          return {
            files: { failed: 0, passed: 0, skipped: 0, total: 0 },
            tests: { failed: 0, passed: 0, skipped: 0, todo: 0, total: 0 },
          };
        }

        function testState(testCase) {
          const { state } = testCase.result();
          if (state === "passed") return "pass";
          if (state === "failed") return "fail";
          if (state === "skipped") return testCase.options.mode === "todo" ? "todo" : "skip";
          return "pending";
        }

        function buildReport(vitest, unhandledErrors, { seq, root, rel, inProject }) {
          const local = (text) => stripAnsi(text).split(`${root}/`).join("");
          const modules = (vitest?.state.getTestModules() ?? []).slice().sort((a, b) => a.relativeModuleId.localeCompare(b.relativeModuleId));
          const summary = emptySummary();
          const files = [];
          const suiteFailures = [];
          const testFailures = [];
          const consoleLines = [];
          const projectFile = (file) => !!file && inProject(file) && !file.split("/").includes("node_modules");

          const framesOf = (error) => {
            let frames = (error.stacks ?? []).map((s) => ({ method: s.method || "", file: s.file, line: s.line, col: s.column }));
            if (!frames.length) frames = parseStack([error.stack, error.runnerError?.stack].filter(Boolean).join("\n"));
            return frames.filter((f) => projectFile(f.file)).map((f) => ({ ...f, file: rel(f.file) }));
          };

          const entry = (kind, title, test, error) => {
            const frames = framesOf(error);
            const near = frames[0] ?? null;
            const rollup = error.__vitest_rollup_error__;
            return {
              kind,
              title: kind === "unhandled" && typeof error.type === "string" && error.type ? error.type : title,
              test,
              name: error.name || "Error",
              message: local(error.message ?? String(error)),
              expected: typeof error.expected === "string" ? local(error.expected) : null,
              actual: typeof error.actual === "string" ? local(error.actual) : null,
              diff: error.diff ? local(error.diff) : "",
              plugin: rollup?.plugin ?? null,
              pluginFile: rollup?.id ? `${rel(rollup.id)}${rollup.loc ? `:${rollup.loc.line}:${rollup.loc.column}` : ""}` : null,
              pluginFrame: rollup?.frame ? local(rollup.frame) : null,
              codeFrame: error.codeFrame ? local(error.codeFrame) : null,
              frames,
              file: near?.file ?? "",
              line: near?.line ?? 0,
              col: near?.col ?? 0,
              frame: near ? codeFrame(join(root, near.file), near.line, near.col) : null,
            };
          };

          const logsOf = (entity, file, test) => {
            for (const log of entity.logs?.() ?? []) {
              consoleLines.push({ type: log.type, file, test, content: local(log.content).replace(/\n$/, "") });
            }
          };

          const walk = (collection, file) => {
            const nodes = [];
            for (const child of collection) {
              if (child.type === "suite") {
                logsOf(child, file, child.fullName);
                const children = walk(child.children, file);
                const states = flatten(children).map((n) => n.state);
                const errors = child.errors();
                nodes.push({
                  kind: "suite",
                  name: child.name,
                  fullName: child.fullName,
                  line: child.location?.line ?? 0,
                  state: states.includes("fail") || errors.length ? "fail" : states.length && states.every((s) => s === "skip" || s === "todo") ? "skip" : "pass",
                  count: states.length,
                  children,
                });
                for (const error of errors) suiteFailures.push(entry("suite", `${file} > ${child.fullName}`, child.fullName, error));
                continue;
              }
              const state = testState(child);
              summary.tests.total += 1;
              if (state === "pass") summary.tests.passed += 1;
              else if (state === "fail") summary.tests.failed += 1;
              else if (state === "todo") summary.tests.todo += 1;
              else if (state === "skip") summary.tests.skipped += 1;
              logsOf(child, file, child.fullName);
              nodes.push({ kind: "test", name: child.name, fullName: child.fullName, line: child.location?.line ?? 0, state });
              if (state === "fail") {
                for (const error of child.result().errors ?? []) testFailures.push(entry("test", `${file} > ${child.fullName}`, child.fullName, error));
              }
            }
            return nodes;
          };

          for (const module of modules) {
            const file = module.relativeModuleId;
            logsOf(module, file, "");
            const tests = walk(module.children, file);
            const moduleErrors = module.errors();
            const flat = flatten(tests);
            const count = (state) => flat.filter((n) => n.state === state).length;
            const state = moduleErrors.length || count("fail") || !flat.length ? "fail" : flat.every((n) => n.state === "skip" || n.state === "todo") ? "skip" : "pass";
            summary.files.total += 1;
            summary.files[state === "fail" ? "failed" : state === "skip" ? "skipped" : "passed"] += 1;
            let pool = "";
            try {
              pool = module.toTestSpecification().pool;
            } catch {
              // An older Vitest: no specification on the module.
            }
            files.push({ file, state, typecheck: pool === "typescript", count: flat.length, failed: count("fail"), skipped: count("skip"), todo: count("todo"), tests });
            for (const error of moduleErrors) suiteFailures.push(entry("suite", `${file} [ ${file} ]`, "", error));
            if (!flat.length && !moduleErrors.length) {
              suiteFailures.push(entry("suite", `${file} [ ${file} ]`, "", { name: "Error", message: `No test suite found in file ${file}` }));
            }
          }
          const unhandled = (unhandledErrors ?? []).map((error) => entry("unhandled", "Unhandled Error", "", error));
          const failures = [...suiteFailures, ...testFailures, ...unhandled];

          const s = vitest?.snapshot?.summary;
          const snapshot = {
            written: s?.added ?? 0,
            matched: s?.matched ?? 0,
            failed: s?.unmatched ?? 0,
            updated: s?.updated ?? 0,
            obsolete: s?.unchecked ?? 0,
            files: snapshotFiles(root, rel),
          };

          const ok = modules.length && !failures.length && !summary.tests.failed && !summary.files.failed;
          return {
            seq,
            state: ok ? "pass" : "fail",
            note: modules.length ? "" : "No test files found.",
            files,
            failures,
            console: consoleLines.slice(-60),
            summary,
            snapshot,
            coverage: null,
          };
        }

        function parseStack(stack) {
          const frames = [];
          for (const line of String(stack).split("\n")) {
            const m = /^\s*at (?:(.+?) \()?(?:file:\/\/)?(\/[^():]+):(\d+):(\d+)\)?\s*$/.exec(line);
            if (!m) continue;
            const method = (m[1] ?? "").replace(/^async /, "");
            frames.push({ method, file: m[2], line: Number(m[3]), col: Number(m[4]) });
          }
          return frames;
        }

        // Vitest's code frame: two lines either side of the failing line and a caret under its column.
        function codeFrame(file, line, col) {
          if (!existsSync(file)) return null;
          const lines = readFileSync(file, "utf8").split(/\r?\n/);
          const out = [];
          for (let n = line - 2; n <= line + 2; n++) {
            if (n < 1 || n > lines.length) continue;
            out.push({ no: n, text: lines[n - 1].replace(/\t/g, " ") });
            if (n === line) out.push({ no: null, text: `${" ".repeat(Math.max(0, col - 1))}^` });
          }
          return out;
        }

        function snapshotFiles(root, rel) {
          const found = [];
          const walk = (dir) => {
            if (!existsSync(dir)) return;
            for (const name of readdirSync(dir).sort()) {
              if (name === "node_modules" || name.startsWith(".")) continue;
              const path = join(dir, name);
              if (statSync(path).isDirectory()) walk(path);
              else if (name.endsWith(".snap")) found.push({ file: rel(path), content: readFileSync(path, "utf8") });
            }
          };
          walk(join(root, "src"));
          return found;
        }

        function summarizeCoverage(map, rel) {
          if (!map || typeof map.files !== "function") return null;
          const rows = [];
          const total = { statements: [0, 0], branches: [0, 0], functions: [0, 0], lines: [0, 0] };
          for (const file of map.files().sort()) {
            const fc = map.fileCoverageFor(file);
            const s = fc.toSummary();
            const pct = (k) => (s[k].total ? Math.round((s[k].covered / s[k].total) * 10000) / 100 : 100);
            for (const k of Object.keys(total)) {
              total[k][0] += s[k].covered;
              total[k][1] += s[k].total;
            }
            rows.push({ file: rel(file), statements: pct("statements"), branches: pct("branches"), functions: pct("functions"), lines: pct("lines"), uncovered: ranges(fc.getUncoveredLines().map(Number)) });
          }
          const all = (k) => (total[k][1] ? Math.round((total[k][0] / total[k][1]) * 10000) / 100 : 100);
          return { rows, all: { statements: all("statements"), branches: all("branches"), functions: all("functions"), lines: all("lines") } };
        }

        function ranges(numbers) {
          const sorted = [...new Set(numbers)].sort((a, b) => a - b);
          const out = [];
          for (let i = 0; i < sorted.length; i++) {
            let j = i;
            while (j + 1 < sorted.length && sorted[j + 1] === sorted[j] + 1) j++;
            out.push(i === j ? String(sorted[i]) : `${sorted[i]}-${sorted[j]}`);
            i = j;
          }
          return out.join(",");
        }
