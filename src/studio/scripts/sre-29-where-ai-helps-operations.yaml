      - {
          id: sel-confidence,
          type: editor.select,
          at: { mark: sel-confidence },
          target: { file: notes.md, text: "ယုံကြည်မှု မျဉ်း", occurrence: 1 },
        }
      - {
          id: sel-playbook,
          type: editor.select,
          at: { mark: sel-playbook },
          target: { file: notes.md, text: "playbook", occurrence: 1 },
        }
      - {
          id: sel-reopen,
          type: editor.select,
          at: { mark: sel-reopen },
          target: { file: notes.md, text: "reopen rate", occurrence: 1 },
