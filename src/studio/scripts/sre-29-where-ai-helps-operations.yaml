  - id: recap
    narration: >
      [[mark:close-p04]] [[mark:open-notes]] AI ကူခဲ့တဲ့ နေရာတွေပါ။ [[mark:sel-grouping]] complaint အုပ်စုဖွဲ့တာက ပျမ်းမျှထဲမှာ ပျောက်နေတဲ့ အုပ်စုကို ရှာပေးပါတယ်။ [[mark:sel-confidence]] ယုံကြည်မှု မျဉ်းအောက်က AI အကြံကိုတော့ on-call ကို လုံးဝ မပြပါဘူး။ [[mark:sel-playbook]] playbook ကို လူတွေ အောင်မြင်ခဲ့တဲ့ fix တွေကနေ ရေးပါတယ်။
      [[mark:sel-reopen]] reopen rate က agent ဖြေရှင်းပြီးသား ticket ပြန်ပွင့်တဲ့ နှုန်းပါ။ [[mark:sel-toil-limit]] toil ဖယ်တာရဲ့ အကန့်အသတ်က ဘယ်လောက် မြန်မြန် ဖယ်ဖယ် အချိန်ကိုပဲ ပြန်ရတာပါ။ [[mark:sel-fleet]] fleet scan ကတော့ အားနည်းချက် တစ်ခုကို codebase တိုင်းမှာ လိုက်ရှာတာပါ။
      [[mark:sel-question]] supermarket ရဲ့ job လိုပဲ တွက်ကြည့်ပါ။ [[mark:ask-question]] ညတိုင်း run တဲ့ job က API ကို ၅၀၀ ခါ ခေါ်ပြီး တစ်ခါချင်းမှာ error ၀.၁ ရာခိုင်နှုန်း ဆိုရင် run တစ်ခါမှာ error အနည်းဆုံး တစ်ခု ကြုံဖို့ ဘယ်လောက် ဖြစ်နိုင်လဲ?
      [[mark:pause-question]] ၃၉ ရာခိုင်နှုန်းလောက်ပါ၊ error ထက်ဝက် လျော့ပေမဲ့ ည ၅ ညမှာ ၂ ညလောက် ကြုံရဆဲပါ။ ဒီနေ့ ပြောခဲ့တာတွေက Padauk ရဲ့ ကိုယ်ပိုင် platform နဲ့ အဖွဲ့ကို အားကိုးထားပါတယ်။ အခု Padauk က မန္တလေးက delivery startup လေး တစ်ခုကို ဝယ်ပြီး ကိုမင်းက အဲဒီမှာ ပထမဆုံး SRE အဖြစ် သွားပါတယ်။ ကိုမင်း ဘယ်ကနေ စမလဲ?
    sources:
