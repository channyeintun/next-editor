  - id: beyond-toil
    chapter: Toil ထက် ပိုကြီးတဲ့ အကျိုး
    narration: >
      [[mark:close-b4]] [[mark:show-p03]] ဒါဆို AI ရဲ့ တန်ဖိုးကို သက်သာသွားတဲ့ နာရီနဲ့ပဲ တိုင်းမလား? toil က အပတ်ရဲ့ ၃၀ ရာခိုင်နှုန်း ဆိုပါစို့၊ AI နဲ့ ၁၀ ဆ မြန်အောင် လုပ်နိုင်ရင် toil က ၃ ရာခိုင်နှုန်းပဲ ကျန်ပြီး engineering အချိန်က ၇၀ ကနေ ၉၇ ရာခိုင်နှုန်း ဖြစ်လာပါတယ်။ toil ကို လုံးဝ ဖျောက်နိုင်ရင်တောင် ၁၀၀ ရာခိုင်နှုန်းကို မကျော်နိုင်ပါဘူး၊ toil ဖယ်တာက အချိန်ကိုပဲ ပြန်ပေးနိုင်လို့ အကန့်အသတ် ရှိတာပါ။
      [[mark:show-p03b]] ပိုကြီးတဲ့ အကျိုးက ဈေးကြီးလို့ အရင်က မလုပ်နိုင်ခဲ့တဲ့ အလုပ်အသစ်တွေပါ။ ဥပမာ design review နဲ့ launch review ကို AI က အရင် စစ်ပေးတာ၊ fault တစ်ခုကို တမင် inject လုပ်တဲ့ fault experiment မှာ fault တကယ် ဖြစ်ခဲ့လား၊ system ခံနိုင်ခဲ့လား စစ်တာ၊ run နေတဲ့ config ကို စည်းမျဉ်းတွေနဲ့ တိုက်စစ်တာတွေပါ။ ပြင်ရမယ်ဆိုရင်တော့ lesson ၂၈ ရဲ့ action card အောက်မှာပဲ ပြင်ပါတယ်။
      [[mark:show-p03c]] AI tool တွေကိုလည်း အဖွဲ့တွေက အရင် စမ်းပြီး အလုပ်ဖြစ်တာကိုမှ platform အဖွဲ့က အားလုံးအတွက် ယူပါတယ်။ on-call ကလည်း သိပြီးသား fix တွေကနေ ပြဿနာ အမျိုးအစား အသစ်တွေဆီ ရွေ့သွားပါတယ်။
      ops အလုပ်ကို လုပ်ရင်း နားလည်ပြီးမှ engineering နဲ့ မလိုတော့အောင် လုပ်တာက Site Reliability Engineering၊ SRE စကတည်းက ရှိခဲ့တဲ့ အယူအဆပါ။ AI ကြောင့် ကွာသွားတာက merchant chat တွေလို လူ ဖတ်မှ နားလည်ခဲ့တဲ့ အလုပ်တွေပါ အဲဒီလို ဖယ်လို့ ရလာတာပါ။
    sources:
