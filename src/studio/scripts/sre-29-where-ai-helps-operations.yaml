      - {
          id: sel-toil-limit,
          type: editor.select,
          at: { mark: sel-toil-limit },
          target: { file: notes.md, text: "toil ဖယ်တာရဲ့ အကန့်အသတ်", occurrence: 1 },
        }
      - {
          id: sel-fleet,
          type: editor.select,
          at: { mark: sel-fleet },
          target: { file: notes.md, text: "fleet scan", occurrence: 1 },
        }
      # The voice script's ⟪select မေးခွန်း⟫ and ⟪pause 3s⟫, the way the Module 1
      # reviewers fixed the pause. sel-question marks where the voice script puts
      # the select, but a select there would drag under the question and leave no
      # pause, and one at pause-question would drag under the answer's first words
      # (the scheduler holds only the dialog after its anchor's). So the
      # question-line select hangs off ask-question, one more mark at an existing
      # sentence end that makes the question its own dialog: it starts about as
      # the question ends, its drag runs in silence, and the answer at
      # pause-question waits for it. The question is 156 characters with no ၊
      # to split at, so the quiet depends on the voice's speed: 10350 leaves
      # about 2.8 / 0.5 / 0.35 s before the answer at 55 / 70 / 95 ms per char
      # (at 70 and 95 the drag starts under the question's last words, as in
      # lessons 7 and 10); an offset above ~10380 trips compile-check's 2.5 s
      # inserted-silence warning at 55.
      - id: select-question
        type: editor.select
        at: { mark: ask-question, offsetMs: 10350 }
        target:
          file: notes.md
          text: "မေးခွန်း: call 500၊ တစ်ခုချင်း error 0.1%။ run တစ်ခါမှာ error အနည်းဆုံး တစ်ခု ကြုံဖို့ ဘယ်လောက်လဲ?"
          occurrence: 1

checks:
  # 500, not 300: google-svg deck pages stall the main thread at show/close.
  - { type: timing.p95Ms, max: 500 }
