build:
  # Studio swaps in the Burmese voice chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 2629

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: hook
    chapter: Dashboard အစိမ်း၊ comment တွေ ဒေါသထွက်
    narration: >
      [[mark:show-p01]] lesson ၂၈ မှာ Padauk ရဲ့ AI operations agent၊ Ops Buddy က action card၊ budget နှစ်ခုနဲ့ stop button ဆိုတဲ့ ဘရိတ်တွေ ရလာခဲ့ပါတယ်။
      သောကြာနေ့ ညနေ top-up promo စတော့ dashboard က Top-up success rate ၉၉.၇ ရာခိုင်နှုန်းနဲ့ အစိမ်းရောင် ပြနေပါတယ်။ ဒါပေမဲ့ Operator B နဲ့ app ၅.၃ ကို သုံးသူတွေဆီက top-up မရဘူး၊ သုံးခါတောင် စမ်းပြီးပြီ ဆိုတဲ့ ဒေါသထွက်နေတဲ့ comment တွေ Facebook နဲ့ Viber ကနေ မစုရဲ့ support အဖွဲ့ဆီ ဆက်တိုက် ဝင်လာပါတယ်။ alert ဘာလို့ မတက်ခဲ့တာလဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book second edition (Google Cloud Blog)",
          url: "https://cloud.google.com/blog/products/devops-sre/sre-book-second-edition",
        }
      - {
          title: "AI in SRE: How Google is Engineering the Future of Reliable Operations (sre.google)",
          url: "https://sre.google/resources/practices-and-processes/ai-engineering-reliable-operations/",
        }
    actions:
      # -1750 / -1450, not the skeleton's -1900 / -1600: a pull-back over 1780 ms pushes the
      # first dialog past the 2 s opening handle, which src/studio/plans/index.test.ts rejects.
      - { id: collapse-dock, type: runtime.collapseDock, at: { scene: start, offsetMs: -1750 } }
      - {
          id: show-p01,
          type: slide.show,
          at: { mark: show-p01, offsetMs: -1450 },
          slideId: l29-p01,
        }

  - id: complaints-chart
    chapter: ပျမ်းမျှထဲမှာ ပျောက်နေတဲ့ user တွေ
    narration: >
      [[mark:close-p01]] [[mark:b1-s1]] ဒီ chart က အဲဒီညနေ မစုရဲ့ အဖွဲ့ဆီ ရောက်လာတဲ့ complaint တွေကို app version နဲ့ operator အလိုက် ခွဲထားတာပါ။ Operator A ဘက်က အုပ်စုတွေမှာ complaint နည်းနည်းစီပဲ ရှိပြီး promo ညတိုင်း မြင်နေကျပါ။
      [[mark:b1-s2]] ဒါပေမဲ့ app ၅.၃ နဲ့ Operator B အုပ်စုမှာတော့ complaint ၃၈ ခု တက်လာပါတယ်၊ app ၅.၃ နဲ့ Operator C ကတော့ ပုံမှန်ပါပဲ။ top-up အားလုံးထဲမှာ ဒီ အုပ်စုက သေးသေးလေးပဲ ဖြစ်တော့ ပေါင်းထားတဲ့ success rate က service level objective၊ SLO ပစ်မှတ် ၉၉.၅ ရာခိုင်နှုန်းထက် မြင့်နေဆဲမို့ alert မတက်ခဲ့တာပါ။ ပျမ်းမျှက သူတို့ ဒုက္ခကို ဖုံးထားလိုက်တာပါ။
      [[mark:b1-s3]] ဒီ chart ကို ဆွဲပေးတာက Ops Buddy ပါ။ မြန်မာလို အင်္ဂလိပ်လို ရောရေးထားတဲ့ message ၄၂၀ ကို ဖတ်ပြီး ဘယ် version၊ ဘယ် operator၊ ဘာလုပ်ရင်း ဖြစ်လဲ ဆိုတာနဲ့ အုပ်စုဖွဲ့ပေးတာပါ။ တစ်ခုချင်း ဖတ်ရင် မရေမရာ ဖြစ်နေတဲ့ စာတွေကို စုလိုက်တော့မှ ဒီ အနီရောင် bar ပေါ်လာတာပါ။
      [[mark:close-b1]] [[mark:show-p01b]] ပျမ်းမျှက နောက်တစ်မျိုးလည်း ဖုံးထားတတ်ပါတယ်။ supermarket chain ရဲ့ ညတိုင်း settlement စစ်တဲ့ job က Padauk API ကို ၅၀၀ ခါ ခေါ်ပြီး တစ်ခါ fail တာနဲ့ job တစ်ခုလုံး fail ပါတယ်။ တစ်ခါချင်းမှာ error ၀.၂ ရာခိုင်နှုန်းပဲ ဆိုရင် dashboard က ၉၉.၈ ရာခိုင်နှုန်း ပြနေပေမဲ့ သူတို့ job ကတော့ ည ၁၀၀ မှာ ၆၃ ညလောက် fail ပါတယ်။
      [[mark:p01b-anomaly]] ပုံမှန်နဲ့ မတူတာကို ရှာတဲ့ anomaly detection ကလည်း promo စတာ၊ traffic လွှဲတာလို ပုံမှန် အပြောင်းအလဲတွေကို ပျက်နေတယ်လို့ ထင်တတ်ပြီး user က top-up တကယ် ရလား မမြင်ပါဘူး။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book second edition (Google Cloud Blog)",
          url: "https://cloud.google.com/blog/products/devops-sre/sre-book-second-edition",
        }
      - {
          title: "AI in SRE: How Google is Engineering the Future of Reliable Operations (sre.google)",
          url: "https://sre.google/resources/practices-and-processes/ai-engineering-reliable-operations/",
        }
    actions:
      - { id: close-p01, type: slide.close, at: { mark: close-p01, offsetMs: -400 } }
      - {
          id: b1-s1,
          type: whiteboard.apply,
          at: { mark: b1-s1 },
          open: true,
          clear: true,
          upsertIds: [l29-b1-title, l29-b1-axis],
        }
      - id: b1-s1-draw
        type: whiteboard.apply
        at: { afterAction: b1-s1 }
        upsertIds: [l29-b1-bar1, l29-b1-lab1, l29-b1-bar2, l29-b1-lab2, l29-b1-bar3, l29-b1-lab3]
        drawMs: 1800
      - id: b1-s2
        type: whiteboard.apply
        at: { mark: b1-s2 }
        upsertIds: [l29-b1-bar4, l29-b1-lab4, l29-b1-n38, l29-b1-bar5, l29-b1-lab5]
        drawMs: 1800
      - {
          id: b1-s3,
          type: whiteboard.apply,
          at: { mark: b1-s3 },
          upsertIds: [l29-b1-ai1, l29-b1-ai2],
          drawMs: 1200,
        }
      - {
          id: close-b1,
          type: whiteboard.apply,
          at: { mark: close-b1, offsetMs: -400 },
          open: false,
        }
      - { id: show-p01b, type: slide.show, at: { mark: show-p01b }, slideId: l29-p01b }

  - id: complaints-signal
    chapter: Complaint ကို signal အဖြစ်
    narration: >
      [[mark:show-p02]] ဒါကြောင့် user ရေးတဲ့ complaint ကို signal တစ်ခုအဖြစ် သုံးလို့ရပါတယ်။ metric က ဘယ်နှစ်ခု fail လဲ ဆိုတာပဲ ပြောပေမဲ့ complaint ကတော့ user က ဘာလုပ်ချင်ခဲ့လဲ၊ ဘယ်မှာ၊ ဘယ်အချိန်က ဘာဖြစ်သွားလဲ ဆိုတာကို ကိုယ့်စကားနဲ့ ပြောပြပါတယ်။ စာရေးရတာ အချိန်ပေးရလို့ တကယ် ဒုက္ခရောက်တဲ့သူတွေပဲ ရေးလေ့ ရှိပြီး၊ အုပ်စု ကြီးလေ ပြဿနာ ကြီးလေ ဖြစ်ပါတယ်။
      တစ်စိတ်တစ်ပိုင်းပဲ ပျက်တာကို user တွေက metric ထက် အရင် သိတတ်ပေမဲ့ complaint က metric ကို ကူပေးတာပါ၊ အစားထိုးတာ မဟုတ်ပါဘူး။
      [[mark:show-p02b]] အုပ်စုက သတ်မှတ်ထားတဲ့ အရွယ်ကို ကျော်တော့ Ops Buddy က report တိုတို ရေးပြီး Top-up on-call ကျနေတဲ့ ကိုမင်းဆီ page ပို့ပါတယ်။ version နဲ့ operator ကို သိနေတော့ ထိခိုက်နေတဲ့ user ၂၁၀၀ လောက်ဆီကိုပဲ message ပို့လို့ user ၁၂ သိန်းလုံးကို မလန့်စေရပါဘူး။
      ဒီလို အလုပ်ဖြစ်တာ model တော်လို့ချည်း မဟုတ်ပါဘူး။ spam စစ်ထုတ်တာ၊ ဖုန်းနံပါတ်နဲ့ နာမည် ဖယ်တာ၊ Unicode နဲ့ ဇော်ဂျီ ညှိတာလို model ပတ်ပတ်လည်က pipeline အလုပ်တွေက အများစုပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "AI in SRE: How Google is Engineering the Future of Reliable Operations (sre.google)",
          url: "https://sre.google/resources/practices-and-processes/ai-engineering-reliable-operations/",
        }
      - {
          title: "SRE book second edition (Google Cloud Blog)",
          url: "https://cloud.google.com/blog/products/devops-sre/sre-book-second-edition",
        }
    actions:
      - { id: show-p02, type: slide.show, at: { mark: show-p02 }, slideId: l29-p02 }
      - { id: show-p02b, type: slide.show, at: { mark: show-p02b }, slideId: l29-p02b }

  - id: during
    chapter: Incident အတွင်း
    narration: >
      [[mark:close-p02b]] [[mark:b2-s1]] ကိုမင်းက incident ကြေညာလိုက်တော့ Ops Buddy က ဘာမှ မပြောင်းဘဲ ဖတ်ပြီး ရေးပေးတာကနေ စပါတယ်။ နောက်မှ ဝင်လာသူတွေအတွက် ဘာသိပြီ၊ ဘာလုပ်ပြီးပြီ ဆိုတဲ့ summary ရေးပေးပြီး shift လွှဲဖို့ handoff မူကြမ်းလည်း ပြင်ထားပေးလို့ ဘာဖြစ်နေတာလဲ ဆိုတဲ့ မေးခွန်းတွေ channel ထဲမှာ အများကြီး နည်းသွားပါတယ်။
      [[mark:b2-s2]] အကြောင်းရင်း မသိခင် user ထိခိုက်မှုကို အရင် ရပ်တဲ့ mitigation အတွက်တော့ Ops Buddy က lesson ၁၀ မှာ ရေးခဲ့တဲ့ fix စာရင်းထဲကနေ rollback၊ traffic လွှဲတာ၊ capacity တိုးတာလို တစ်ခုကို ရွေးပါတယ်။ fail တွေ စတဲ့ အချိန်က app ၅.၃ user တွေကို top-up လမ်းကြောင်းအသစ်ဆီ ပို့တဲ့ promo config ပြောင်းလဲမှုနဲ့ ကိုက်နေလို့ အဲဒါကို rollback လုပ်ဖို့ အကြံပေးပြီး ယုံကြည်မှု မြင့်တယ်လို့လည်း ပြပါတယ်။
      [[mark:b2-s3]] ဆုံးဖြတ်တာကတော့ ကိုမင်းပါ၊ အထောက်အထားကို စစ်ပြီး approve လုပ်တော့ မကြာခင် top-up တွေ ပြန်ဝင်လာပါတယ်။ [[mark:b2-s4]] Padauk က ယုံကြည်မှု မျဉ်း တစ်ခုလည်း သတ်မှတ်ထားပြီး အဲဒီ မျဉ်းအောက်က အကြံဆိုရင် Ops Buddy က လုံးဝ မပြပါဘူး။ မသေချာတဲ့ ခန့်မှန်းချက်ကို တစ်ခါ မြင်လိုက်ရရင် ပင်ပန်းနေတဲ့ on-call က အဲဒီဘက်ကိုပဲ လိုက်စဉ်းစားမိပြီး လမ်းလွဲသွားတတ်လို့ပါ။
