  - id: toil-loop
    chapter: Toil ကနေ playbook ဆီ
    narration: >
      [[mark:close-b3]] [[mark:b4-s1]] incident မရှိတဲ့ ရက်တွေမှာတော့ AI က toil ကို လျှော့ပေးပါတယ်။ လက်နဲ့ ထပ်ခါထပ်ခါ လုပ်ရတဲ့ toil ရဲ့ အဓိပ္ပာယ်က lesson ၁၇ ကတည်းက မပြောင်းပါဘူး၊ အသစ်က automation ဆောက်တာကိုယ်တိုင် မြန်လာတာပါ။ merchant တွေရဲ့ ticket နဲ့ chat တွေကို Ops Buddy က အုပ်စုဖွဲ့ကြည့်တော့ အများဆုံးက မနေ့က settlement file ကို ပြန်ပို့ပေးပါ ဆိုတာပါ၊ တစ်ဆိုင်တည်းက နှစ်ခါ တောင်းတာတွေကိုလည်း ပေါင်းပေးပါတယ်။
      [[mark:b4-s2]] engineer တွေ အရင်က file ပြန်ပို့ခဲ့ပုံတွေကနေ Ops Buddy က playbook မူကြမ်း ရေးပြီး လူက review လုပ်ပါတယ်။ file ကို ဖတ်ပြီး ပြန်ပို့ရုံမို့ action card မှာ ကိုယ်တိုင် လုပ်ပြီးမှ ပြောခွင့် ရပါတယ်၊ ငွေ ရွှေ့ရမယ့် ကိစ္စတွေနဲ့ မမြင်ဖူးသေးတဲ့ ကိစ္စတွေကတော့ လူဆီ ရောက်ပါတယ်။
      [[mark:b4-s3]] merchant တစ်ဆိုင်က file ထဲမှာ ဘာမှ မပါဘူးလို့ ပြန်ပြောတော့ ticket ပြန်ပွင့်ပြီး playbook မှာ မပို့ခင် file ထဲ data ရှိလား စစ်တဲ့ အဆင့် ထပ်တိုးလာပါတယ်။ ဒီလို agent ဖြေရှင်းပြီးသား ticket ပြန်ပွင့်တဲ့ နှုန်း၊ reopen rate က agent ကို တိုင်းတဲ့ အဓိက number ပါ။
      [[mark:b4-s4]] ငွေ မရောက်ဘူး ဆိုတဲ့ ticket တွေမှာတော့ engineer မကြည့်ခင် merchant ID နဲ့ transaction ID ကို Ops Buddy က အရင် မေးထားပေးပါတယ်။
