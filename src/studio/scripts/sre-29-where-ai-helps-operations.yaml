# SRE from zero, lesson 29: Where AI helps operations (Burmese concept lesson).
#
# Built from the approved voice script
# docs/sre-course/voice-scripts/sre-29-where-ai-helps-operations.md. Every
# spoken character is that script's "> " lines, unchanged; each ⟪…⟫ marker
# became a [[mark:…]] at the same place. Check it with:
#   bun ~/Documents/sre-course/work/check-narration.ts \
#     docs/sre-course/voice-scripts/sre-29-where-ai-helps-operations.md \
#     src/studio/scripts/sre-29-where-ai-helps-operations.yaml
#
# Nothing runs: deck pages and the whiteboard carry the lesson, and notes.md is
# the recap. The workspace and runtime follow the validated no-code skeleton
# (WebContainer, empty init command, a harmless dev script).
#
# Two marks add no spoken text and sit at an existing ။: p01b-anomaly splits
# l29_p01b's narration at its paragraph break (one 476-character dialog would
# pass the 450-character limit; no action uses it), and ask-question makes the
# recap question its own dialog so the question-line select can hang off it
# for the ⟪pause 3s⟫, as in Module 1. sel-question is the voice script's
# ⟪select မေးခွန်း⟫; it only splits the short lead-in from the question.
#
# Pacing: at 70 ms/char no page or board step holds longer than ~35 s (the
# longest is l29_p01b, 34.7 s; the cover 33.2 s), so the voice script's own
# markers carry it and no pacing page or board step was added.
#
# ⟪close board⟫ straight into the next board (scenes 5 and 6) wipes the open
# board 400 ms early (whiteboard.apply clear) instead of closing the panel, so
# the editor does not flash between two boards, as in lessons 8 and 16; the
# next board then draws with open: true, clear: true as usual. A board followed
# by a deck page closes the panel (open: false) 400 ms before the page, and a
# deck page followed by a board closes the page 400 ms before, as in Module 1.
#
# Boards (B1 P5 bars on an underline axis, B2 and B3 P6 lanes, B4 P3 ring).
# Colour jobs: #1e1e1e ink (paints white) for titles, axis, ring and arrows;
# blue the thing named and the data series (the quiet complaint bars, Ops
# Buddy's summary and handoff, the hypothesis, the postmortem draft, the past
# incidents note, the first two toil-loop steps); green healthy or done (the
# person who approves, people check and write, ask-first); red failure (the
# 5.3 / B spike, the retry without a key, "reopened?"); orange the caveat or
# limit (the confidence line, the fleet scan's 7 more calls, the guardrails);
# violet the result (Ops Buddy's grouping, the rollback suggestion, the
# playbook). A label on two lines is one text asset per line, so each line
# meets the 0.55 em width rule on its own. B1 writes "5.3 / B: 38" as the
# "5.3 / B" axis label plus "38" above the tall bar, since the five bar slots
# are 156 px wide. B3 steps down after its second box (an arrow-down into
# "postmortem", then right into "lessons"), not one row left to right as the
# voice script sketches it: four two-line boxes plus three arrows need about
# 990 px under the 0.55 rule, and the visible area is 850 px wide. B4's ring
# nodes are filled #ffffff, which inverts to the canvas colour and hides the
# track behind their labels (as lesson 2's loop does); the side box sits above
# the first node and feeds it with an arrow-down, since there are no left or
# up arrows. Every label was also measured in Chrome with Excalidraw's Virgil
# font and fits inside its box (short Burmese runs past the 0.55 em rule there:
# "အချက်အလက် အရင် မေး" is 322 px, so the side box is 345 px wide).
#
# Deck pages: deck "Next Editor · SRE 6A · AI", published; the /pub URL below
# is final. The deck holds only the kit pages until this lesson's pages are
# built from the page plan, so until then the Director reports page "l29_p01"
# missing from the published deck (with the deck URL swapped for an
# unreachable one it validates: 35 dialogs, no critic notes). The cover's Ops
# Buddy icon at သတိထားမိ · တုံ့ပြန် · သင်ယူ · တည်ဆောက် is not a K1 kit field (the
# page plan lights the whole loop, S = all, and notes the icon). Page plan:
# ~/Documents/sre-course/work/pages/sre-29-where-ai-helps-operations.json
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/sre-29-where-ai-helps-operations.yaml
#   bun scripts/studio-compile-check.ts src/studio/scripts/sre-29-where-ai-helps-operations.yaml
