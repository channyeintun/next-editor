  - id: after
    chapter: နောက်တစ်နေ့
    narration: >
      [[mark:close-b2]] [[mark:b3-s1]] user ထိခိုက်မှုကို ရပ်တာနဲ့ ဘာကြောင့်လဲ နားလည်တာက သီးခြား အလုပ်ပါ။ နောက်တစ်နေ့မှာ Ops Buddy က trace နဲ့ log တွေကနေ ဖြစ်နိုင်တဲ့ အကြောင်းရင်း၊ hypothesis တွေ ထုတ်ပေးပြီး မှန်မမှန်ကိုတော့ engineer တွေက data နဲ့ စစ်ပါတယ်။
      [[mark:b3-s2]] စစ်ကြည့်တော့ app ၅.၃ ရဲ့ လမ်းကြောင်းအသစ်က top-up အဖြေ နောက်ကျရင် idempotency key မပါဘဲ ပြန်ပို့တာ တွေ့ရပါတယ်။ ဒီ key က request တစ်ခုကို ဘယ်နှခါ ပို့ပို့ တစ်ခါပဲ လုပ်အောင် တွဲပေးတဲ့ သီးသန့် နံပါတ်ပါ၊ key မပါတော့ Operator B က ဒုတိယ request ကို ထပ်နေတယ်ဆိုပြီး ငြင်းလိုက်တာပါ။
      [[mark:b3-s3]] postmortem မူကြမ်းကိုလည်း Ops Buddy က chat နဲ့ alert မှတ်တမ်းတွေကနေ ရေးပေးပေမဲ့ ဘယ်မှာ ကံကောင်းခဲ့လဲ၊ ဘာ ပြင်မလဲ ဆိုတဲ့ သင်ခန်းစာကိုတော့ အဖွဲ့က ကိုယ်တိုင် ရေးပါတယ်။ [[mark:b3-s4]] ဆင်တူ incident အဟောင်းတွေကို ရှာပြီး dashboard ဆောက်ပေးတာ၊ alert တက်ရင် ဘာလုပ်ရမလဲ အဆင့်လိုက် ရေးထားတဲ့ playbook ကို ကိုမင်း တကယ် လုပ်ခဲ့တာနဲ့ တိုက်ပြီး ပြင်ဖို့ အကြံပေးတာတွေလည်း လုပ်ပါတယ်။
      [[mark:b3-s5]] ပြီးတော့ incident တစ်ခုက အားနည်းချက်ကို codebase တိုင်းမှာ လိုက်ရှာတဲ့ fleet scan နဲ့ idempotency key မပါတဲ့ payment call ၇ ခု ထပ်တွေ့ပါတယ်။ lesson ၁ မှာ ယူခဲ့ပြီး lesson ၁၁ မှာ ငွေ နှစ်ခါ ဖြတ်မိစေခဲ့တဲ့ အကြွေးမျိုးကို ဒီတစ်ခါတော့ user မထိခင် ဆပ်လိုက်တာပါ။
