    files:
      notes.md: |
        # AI က operations မှာ ဘယ်နေရာ ကူညီလဲ

        - complaint အုပ်စုဖွဲ့တာ — version၊ operator အလိုက် စုပြီး ပျမ်းမျှထဲက အုပ်စုကို ရှာ
        - ယုံကြည်မှု မျဉ်း — အဲဒီအောက်ဆို AI အကြံကို မပြ
        - playbook — လူ အောင်မြင်ခဲ့တဲ့ fix တွေကနေ ရေးတဲ့ အဆင့်တွေ
        - reopen rate — agent ဖြေရှင်းပြီးသား ticket ပြန်ပွင့်တဲ့ နှုန်း
        - toil ဖယ်တာရဲ့ အကန့်အသတ် — အချိန်ပဲ ပြန်ရ၊ 100% ထက် မကျော်
        - fleet scan — incident တစ်ခုက အားနည်းချက်ကို codebase တိုင်းမှာ ရှာ

        မေးခွန်း: call 500၊ တစ်ခုချင်း error 0.1%။ run တစ်ခါမှာ error အနည်းဆုံး တစ်ခု ကြုံဖို့ ဘယ်လောက်လဲ?
