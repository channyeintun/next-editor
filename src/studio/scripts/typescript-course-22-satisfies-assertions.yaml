  - id: annotation
    chapter: "Annotation နဲ့ satisfies"
    narration: >
      [[mark:type-tea-query]] ဒုတိယ error ဘာကြောင့် ပေါ်လဲ သိဖို့၊ လက်ဖက်ရည် ဈေးရဲ့ type ကို query
      comment နဲ့ ကြည့်ရအောင်။ [[mark:read-tea-price]] Types မှာ ဈေးနှုန်း type ကိုပဲ ပြပါတယ်။ ဆိုလိုတာက
      ဂဏန်း ဖြစ်နိုင်သလို object လည်း ဖြစ်နိုင်တယ် ဆိုတာလောက်ပဲ TypeScript က သိပါတော့တယ်။
      [[mark:read-annotation-wins]] variable မှာ annotation ပေးထားရင် variable ရဲ့ type က နိုင်ပါတယ်။
      TypeScript က တန်ဖိုးကို စစ်ပြီးတာနဲ့၊ လက်ဖက်ရည်မှာ ခွက်ကြီး ဈေး ပါတယ် ဆိုတဲ့ အသေးစိတ်ကို
      မေ့လိုက်ပြီး annotation ကိုပဲ မှတ်ထားလို့ပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 11: Annotations and Assertions (when you annotate a variable, the variable wins)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/annotations-and-assertions",
        }
      - {
          title: "TypeScript Handbook: Everyday Types (type annotations on variables)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#type-annotations-on-variables",
        }
    actions:
      - id: type-tea-query
        type: editor.type
        at: { mark: type-tea-query }
        target: { file: src/main.ts, after: "const tea = prices.tea;\n", occurrence: 1 }
        text: "//    ^?\n"
      - id: expect-tea-price
        type: expect.preview
        at: { afterAction: type-tea-query }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        attribute: { name: data-type, value: "const tea: Price" }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: value-wins
    narration: >
      [[mark:type-comment-open]] annotation ကို ဖယ်ကြည့်ရအောင်။ ဈေးနှုန်း ဖိုင်မှာ annotation ကို
      comment နဲ့ ပိတ်လိုက်ပါမယ်။ [[mark:read-value-wins]] Types မှာ လက်ဖက်ရည်ကို ခွက်သေး ခွက်ကြီး ဈေး
      ပါတဲ့ object အဖြစ် မြင်ရပြီး၊ large မရှိဘူး ဆိုတဲ့ error လည်း ပျောက်သွားပါပြီ။ annotation
      မရှိတော့ တန်ဖိုးက နိုင်ပြီး၊ TypeScript က တန်ဖိုးကို ကြည့်ပြီး infer လုပ်လိုက်လို့ပါ။
      [[mark:read-lost-check]] ဒါပေမဲ့ Errors ကို ကြည့်ပါ။ ပလာတာ ဈေး error ပါ ပျောက်သွားပါတယ်။ စစ်မယ့်
      type မရှိတော့လို့၊ စာသား ဈေးကို ဘယ်သူမှ မဖမ်းတော့တာပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 11: Annotations and Assertions (with no annotation, the value wins)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/annotations-and-assertions",
        }
      - {
          title: "TypeScript Handbook: Type Inference",
          url: "https://www.typescriptlang.org/docs/handbook/type-inference.html",
        }
    actions:
      - id: open-prices-2
        type: workspace.openFile
        at: { mark: type-comment-open }
        path: src/prices.ts
      - id: type-comment-open
        type: editor.type
        at: { afterAction: open-prices-2 }
        target: { file: src/prices.ts, after: "export const prices", occurrence: 1 }
        text: " /*"
        cadence: fast-explainer
      - id: type-comment-close
        type: editor.type
        at: { afterAction: type-comment-open }
        target: { file: src/prices.ts, after: "/*: PriceList", occurrence: 1 }
        text: "*/"
        cadence: fast-explainer
      - id: expect-value-wins
        type: expect.preview
        at: { afterAction: type-comment-close }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        attribute:
          { name: data-type, value: "const tea: {\n    small: number;\n    large: number;\n}" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-value-one-error
        type: expect.preview
        at: { afterAction: expect-value-wins }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-value-null-left
        type: expect.preview
        at: { afterAction: expect-value-one-error }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-code, value: "18047" }
        retry: { maxAttempts: 3, delayMs: 1200 }

  - id: satisfies
    narration: >
      [[mark:type-satisfies]] ဒီ နှစ်ခုလုံးရဲ့ အကောင်းကို လိုချင်တဲ့အခါ satisfies ကို သုံးပါတယ်။ object
      ရဲ့ နောက်မှာ satisfies နဲ့ ဈေးနှုန်း စာရင်း type ကို ရေးလိုက်ပါမယ်။ [[mark:read-satisfies]] ပလာတာ
      error ပြန်ပေါ်လာပါပြီ။ ဒါပေမဲ့ Types မှာ လက်ဖက်ရည်ရဲ့ type က ခွက်သေး ခွက်ကြီး ပါတဲ့ object အတိုင်း
      ကျန်နေပြီး၊ large error လည်း ပြန်မပေါ်ပါဘူး။ satisfies က type နဲ့ ကိုက်မကိုက် စစ်ပေးပေမယ့်၊
      variable ရဲ့ type ကိုတော့ annotation နဲ့ အစားမထိုးဘဲ တန်ဖိုးရဲ့ အသေးစိတ်အတိုင်း ထားပေးလို့ပါ။
      [[mark:type-fix-paratha]] ပလာတာ ဈေးကို ဂဏန်းနဲ့ ရေးတဲ့ line အသစ် ထည့်ပြီး၊ အဟောင်းကို comment
      ပိတ်လိုက်ပါမယ်။ [[mark:read-paratha-fixed]] Errors မှာ စားပွဲ နံပါတ် error တစ်ခုပဲ ကျန်ပါတော့တယ်။
    sources:
      - {
          title: "TypeScript 4.9 release notes: The satisfies operator",
          url: "https://www.typescriptlang.org/docs/handbook/release-notes/typescript-4-9.html#the-satisfies-operator",
        }
      - {
          title: "Total TypeScript Essentials, ch. 11: Annotations and Assertions (annotating values with satisfies)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/annotations-and-assertions",
        }
    actions:
      - id: type-satisfies
        type: editor.type
        at: { mark: type-satisfies }
        target: { file: src/prices.ts, after: "  paratha: \"1200\",\n}", occurrence: 1 }
        text: " satisfies PriceList"
        cadence: fast-explainer
      - id: expect-satisfies-two
        type: expect.preview
        at: { afterAction: type-satisfies }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-satisfies-paratha
        type: expect.preview
        at: { afterAction: expect-satisfies-two }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-1 }
        textContains: "Type 'string' is not assignable to type 'Price'."
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-satisfies-detail
        type: expect.preview
        at: { afterAction: expect-satisfies-paratha }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        attribute:
          { name: data-type, value: "const tea: {\n    small: number;\n    large: number;\n}" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: type-fix-paratha
        type: editor.type
        at: { mark: type-fix-paratha }
        target:
          {
            file: src/prices.ts,
            after: "  coffee: { small: 1800, large: 2100 },\n  ",
            occurrence: 1,
          }
        text: "paratha: 1200,\n  // "
        cadence: block
      - id: expect-paratha-fixed
        type: expect.preview
        at: { afterAction: type-fix-paratha }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: as-string
    chapter: "as နဲ့ non-null assertion"
    narration: >
      [[mark:select-table]] အခု စားပွဲ နံပါတ်ကို ကြည့်ရအောင်။ [[mark:type-table-query]] link ကနေ
      ဖတ်ထားတဲ့ တန်ဖိုးရဲ့ type ကို query comment နဲ့ ကြည့်ပါမယ်။ [[mark:read-table-null]] string
      ဒါမှမဟုတ် null လို့ ပြနေပါတယ်။ link ထဲမှာ ဒီ တန်ဖိုး မပါရင် null ပြန်ပေးလို့ပါ။ ဒါပေမဲ့
      စားပွဲတိုင်းရဲ့ QR code မှာ စားပွဲ နံပါတ် ပါအောင် ဆိုင်က ကိုယ်တိုင် လုပ်ထားလို့၊ ဒီ နေရာမှာ ကိုယ်က
      TypeScript ထက် ပိုသိပါတယ်။ [[mark:type-as-string]] ဒါကြောင့် as နဲ့ ဒါ string ပါလို့
      ပြောလိုက်ပါမယ်။ [[mark:read-as-string]] type က string ဖြစ်သွားပြီး error လည်း ပျောက်သွားပါပြီ။
      ဒါပေမဲ့ as က type ပိုင်းမှာပဲ အလုပ်လုပ်ပြီး runtime မှာ ဘာမှ မစစ်ပါဘူး။ link ထဲမှာ စားပွဲ နံပါတ်
      တကယ် မပါခဲ့ရင် null ပဲ ဖြစ်နေပြီး program က ရပ်သွားမှာပါ။
    sources:
      - {
          title: "TypeScript Handbook: Everyday Types (type assertions)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#type-assertions",
        }
      - {
          title: "Total TypeScript Essentials, ch. 11: Annotations and Assertions (the as assertion)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/annotations-and-assertions",
        }
    actions:
      - id: open-main-2
        type: workspace.openFile
        at: { mark: select-table }
        path: src/main.ts
      - id: select-table
        type: editor.select
        at: { afterAction: open-main-2 }
        target: { file: src/main.ts, text: 'link.get("table")', occurrence: 1 }
      - id: type-table-query
        type: editor.type
        at: { mark: type-table-query }
        target: { file: src/main.ts, after: "const table = link.get(\"table\");\n", occurrence: 1 }
        text: "//    ^?\n"
      - id: expect-table-null
        type: expect.preview
        at: { afterAction: type-table-query }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-2 }
        attribute: { name: data-type, value: "const table: string | null" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-as-string
        type: editor.type
        at: { mark: type-as-string }
        target: { file: src/main.ts, after: 'const table = link.get("table")', occurrence: 1 }
        text: " as string"
        cadence: fast-explainer
      - id: expect-as-string
        type: expect.preview
        at: { afterAction: type-as-string }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-2 }
        attribute: { name: data-type, value: "const table: string" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-as-string-clean
        type: expect.preview
        at: { afterAction: expect-as-string }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 1200 }

  - id: non-null
    narration: >
      [[mark:type-cup]] ခွက် အရွယ်အစားကိုလည်း link ကနေ ဖတ်ပြီး query comment နဲ့ ကြည့်ပါမယ်။
      [[mark:read-cup-null]] ဒီမှာလည်း string ဒါမှမဟုတ် null ပါ။ [[mark:type-bang]] ဒီတစ်ခါတော့ နောက်မှာ
      exclamation mark တစ်လုံး ထည့်ကြည့်ပါမယ်။ [[mark:read-cup-string]] null ပျောက်ပြီး string ပဲ
      ကျန်ပါတော့တယ်။ ဒါကို non-null assertion လို့ ခေါ်ပြီး၊ type ထဲက null နဲ့ undefined ကို
      ဖယ်ပေးပါတယ်။ as လိုပဲ runtime မှာ မစစ်ပေးတဲ့အပြင်၊ စာလုံး တစ်လုံးတည်း ဖြစ်လို့ မျက်စိ
      လွတ်သွားလွယ်တာကို သတိထားပါ။
    sources:
      - {
          title: "TypeScript Handbook: Everyday Types (non-null assertion operator)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#non-null-assertion-operator-postfix-",
        }
      - {
          title: "Total TypeScript Essentials, ch. 11: Annotations and Assertions (the non-null assertion)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/annotations-and-assertions",
        }
    actions:
      - id: type-cup
        type: editor.type
        at: { mark: type-cup }
        target:
          {
            file: src/main.ts,
            after: "console.log(\"စားပွဲ\", table.padStart(2, \"0\"));\n",
            occurrence: 1,
          }
        text: "const cup = link.get(\"cup\");\n//    ^?\n"
        cadence: line-by-line
      - id: expect-cup-null
        type: expect.preview
        at: { afterAction: type-cup }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-3 }
        attribute: { name: data-type, value: "const cup: string | null" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-bang
        type: editor.type
        at: { mark: type-bang }
        target: { file: src/main.ts, after: 'const cup = link.get("cup")', occurrence: 1 }
        text: "!"
      - id: expect-cup-string
        type: expect.preview
        at: { afterAction: type-bang }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-3 }
        attribute: { name: data-type, value: "const cup: string" }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: as-limits
    chapter: "as ရဲ့ ကန့်သတ်ချက်နဲ့ error ပိတ်ခြင်း"
    narration: >
      [[mark:type-as-number]] ဒါဆို as နဲ့ ဘာမဆို ပြောလို့ ရသလား။ စားပွဲ နံပါတ်ကို number လို့ ပြောပြီး၊
      နောက် စားပွဲရဲ့ နံပါတ်ကို တွက်ကြည့်ရအောင်။ [[mark:read-as-number]] Errors မှာ error အသစ်
      ပေါ်လာပါတယ်။ string နဲ့ number က လုံးဝ မဆိုင်တဲ့ type တွေ ဖြစ်လို့၊ ဒီ ပြောင်းလဲမှုက အမှား
      ဖြစ်နိုင်တယ်လို့ ပြောနေတာပါ။ as က ဆက်စပ်မှု ရှိတဲ့ type တွေကြားမှာပဲ ပြောင်းခွင့် ပေးပါတယ်။
      [[mark:read-71]] Output ကိုလည်း ကြည့်ပါ။ နောက် စားပွဲက ၈ မဟုတ်ဘဲ ၇၁ ဖြစ်နေပါတယ်။ တန်ဖိုးက စာသား
      ဖြစ်နေဆဲမို့ တစ် ပေါင်းလိုက်တော့ စာသား ဆက်သွားတာပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 11: Annotations and Assertions (the limits of as)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/annotations-and-assertions",
        }
      - {
          title: "TypeScript Handbook: Everyday Types (type assertions, two assertions through unknown)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#type-assertions",
        }
    actions:
      - id: type-as-number
        type: editor.type
        at: { mark: type-as-number }
        target:
          { file: src/main.ts, after: "const cup = link.get(\"cup\")!;\n//    ^?\n", occurrence: 1 }
