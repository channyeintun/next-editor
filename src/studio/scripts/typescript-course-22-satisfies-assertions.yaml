        at: { mark: draw-not-when }
        upsertIds: [b-not-when]
        drawMs: 1400

  - id: as-const
    chapter: "as const နဲ့ satisfies"
    narration: >
      [[mark:close-board-b]] နောက်ဆုံးအနေနဲ့ ဈေးနှုန်း စာရင်းကို ပြန်သွားရအောင်။ ဈေးနှုန်းတွေက program
      run နေတုန်း ပြောင်းလို့ မရသင့်တဲ့ config ပါ။ [[mark:type-as-const]] ဒါကြောင့် satisfies ရဲ့
      ရှေ့မှာ as const ကို ထည့်လိုက်ပါမယ်။ [[mark:read-as-const]] Types မှာ လက်ဖက်ရည်ရဲ့ ဈေး နှစ်ခုက
      read only ဖြစ်ပြီး၊ number အစား ၁၅၀၀ နဲ့ ၁၈၀၀ ဆိုတဲ့ literal type တွေ ဖြစ်သွားပါပြီ။ as const က
      object တစ်ခုလုံးကို အတွင်းထဲထိ read only ဖြစ်စေပြီး၊ satisfies က ပုံစံ မှန်မမှန် ဆက်စစ်ပေးပါတယ်။
      ပြင်လို့ မရတဲ့ config တွေအတွက် ဒီ နှစ်ခုကို ဒီ အစီအစဉ်အတိုင်း တွဲသုံးတာ အကောင်းဆုံးပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 11: Annotations and Assertions (as const and satisfies)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/annotations-and-assertions",
        }
      - {
          title: "TypeScript 3.4 release notes: const assertions",
          url: "https://www.typescriptlang.org/docs/handbook/release-notes/typescript-3-4.html#const-assertions",
        }
    actions:
      - id: close-board-b
        type: whiteboard.apply
        at: { mark: close-board-b }
        open: false
      - id: open-prices-3
        type: workspace.openFile
        at: { mark: type-as-const }
        path: src/prices.ts
      - id: type-as-const
        type: editor.type
        at: { afterAction: open-prices-3 }
        target: { file: src/prices.ts, after: "  // paratha: \"1200\",\n}", occurrence: 1 }
        text: " as const"
        cadence: fast-explainer
      - id: expect-as-const
        type: expect.preview
        at: { afterAction: type-as-const }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        attribute:
          {
            name: data-type,
            value: "const tea: {\n    readonly small: 1500;\n    readonly large: 1800;\n}",
          }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-as-const-clean
        type: expect.preview
        at: { afterAction: expect-as-const }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 1200 }

  - id: recap
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ variable မှာ annotation ပေးရင် variable ရဲ့ type က နိုင်ပြီး၊
      မပေးရင် တန်ဖိုးက နိုင်ပါတယ်။ satisfies ကတော့ စစ်လည်း စစ်ပေးပြီး၊ အသေးစိတ်ကိုလည်း ထိန်းထားပေးပါတယ်။
      [[mark:recap-as]] as နဲ့ non-null assertion က TypeScript ကို ကိုယ်က အတင်း ပြောတာ ဖြစ်ပြီး runtime
      မှာ ဘာမှ မစစ်ပါဘူး။ error ကို ပိတ်ရမယ် ဆိုရင် ts expect error ကို သုံးပြီး၊ ကိုယ်က တကယ် ပိုသိမှပဲ
      ပိတ်ပါ။ နောက် lesson မှာတော့ TypeScript ရဲ့ object တွေမှာ တွေ့ရတဲ့ ထူးဆန်းတဲ့ အပြုအမူတွေကို
      ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 11: Annotations and Assertions",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/annotations-and-assertions",
        }
    actions:
      - id: select-satisfies
        type: editor.select
        at: { mark: recap }
        target: { file: src/prices.ts, text: "} as const satisfies PriceList;", occurrence: 1 }
      - id: open-main-3
        type: workspace.openFile
        at: { mark: recap-as }
        path: src/main.ts
      - id: select-as
        type: editor.select
        at: { afterAction: open-main-3 }
        target: { file: src/main.ts, text: 'link.get("table") as string', occurrence: 1 }
      - id: expect-file-prices
        type: expect.file
        at: { afterAction: select-as }
        path: src/prices.ts
        contains: "export const prices /*: PriceList*/ = {\n  tea: { small: 1500, large: 1800 },\n  coffee: { small: 1800, large: 2100 },\n  paratha: 1200,\n  // paratha: \"1200\",\n} as const satisfies PriceList;"
      - id: expect-file-main
        type: expect.file
        at: { afterAction: expect-file-prices }
        path: src/main.ts
        contains: "const table = link.get(\"table\") as string;\n//    ^?\nconsole.log(\"စားပွဲ\", table.padStart(2, \"0\"));\nconst cup = link.get(\"cup\")!;\n//    ^?\n\n// // @ts-expect-error\nconst next = Number(table);\n// const next = table as unknown as number;\nconsole.log(\"နောက် စားပွဲ\", next + 1);"
checks:
  - { type: timing.p95Ms, max: 300 }
