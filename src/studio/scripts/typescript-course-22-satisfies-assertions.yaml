  - id: directives
    narration: >
      [[mark:type-expect-error]] error ကို ပိတ်တဲ့ နည်း တစ်ခုက၊ line ရဲ့ အပေါ်မှာ ts expect error ဆိုတဲ့
      comment directive ကို ရေးတာပါ။ [[mark:read-expect-error]] error ပျောက်သွားပါပြီ။ ဒီ directive က
      နောက် line မှာ error ရှိမယ်လို့ ကြိုပြောထားပြီး၊ အဲဒီ error ကို မပြတော့ပါဘူး။
      [[mark:type-unknown]] နောက်ထပ် နည်း တစ်ခုက၊ error message ထဲမှာ ပြောထားသလို unknown ကို အရင်
      ဖြတ်ပြီး as ကို နှစ်ခါ သုံးတာပါ။ [[mark:read-unused]] ဒီတစ်ခါ error အသစ် တစ်ခု ပေါ်လာပါတယ်။
      unknown ကနေ ဘာ type ကိုမဆို ပြောင်းလို့ ရလို့ ပြောင်းလဲမှု error မရှိတော့ပြီး၊ directive က ပိတ်စရာ
      error မရှိဘူးလို့ ပြန်ပြောနေတာပါ။ ts expect error ရဲ့ အားသာချက်က၊ မလိုတော့တဲ့အခါ ကိုယ့်ကို
      ပြန်သတိပေးတာပါ။ [[mark:type-directive-off]] directive ကို comment ပိတ်လိုက်ပါမယ်။ ကိုယ့် project
      မှာဆိုရင်တော့ ဒီ line ကို ဖျက်လိုက်ရုံပါပဲ။ [[mark:read-double-as]] error မရှိတော့ပေမယ့် Output
      ကတော့ ၇၁ ပဲ ဖြစ်နေဆဲပါ။ as unknown as က စစ်ဆေးမှုကို လုံးဝ ကျော်လိုက်တာပဲ ဖြစ်ပြီး၊ ဘာမှ
      ပိုလုံခြုံမလာပါဘူး။ [[mark:type-number]] စာသားကို ဂဏန်း တကယ် ပြောင်းချင်ရင်တော့ Number function ကို
      သုံးရပါမယ်။ line အသစ် ရေးပြီး အဟောင်းကို comment ပိတ်လိုက်ပါမယ်။ [[mark:read-number]] Output မှာ
      နောက် စားပွဲက ၈ ဖြစ်သွားပါပြီ။ as က type ကိုပဲ ပြောင်းပြီး၊ တန်ဖိုးကို တကယ် ပြောင်းပေးတာက runtime
      code ပါ။
    sources:
      - {
          title: "TypeScript 3.9 release notes: // @ts-expect-error comments",
          url: "https://www.typescriptlang.org/docs/handbook/release-notes/typescript-3-9.html#-ts-expect-error-comments",
        }
      - {
          title: "Total TypeScript Essentials, ch. 11: Annotations and Assertions (error suppression directives)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/annotations-and-assertions",
        }
    actions:
      - id: type-expect-error
        type: editor.type
        at: { mark: type-expect-error }
        target:
          {
            file: src/main.ts,
            after: "const cup = link.get(\"cup\")!;\n//    ^?\n\n",
            occurrence: 1,
          }
        text: "// @ts-expect-error\n"
        cadence: line-by-line
      - id: expect-silenced
        type: expect.preview
        at: { afterAction: type-expect-error }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-unknown
        type: editor.type
        at: { mark: type-unknown }
        target: { file: src/main.ts, after: "const next = table as ", occurrence: 1 }
        text: "unknown as "
        cadence: fast-explainer
      - id: expect-unused
        type: expect.preview
        at: { afterAction: type-unknown }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-unused-code
        type: expect.preview
        at: { afterAction: expect-unused }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-code, value: "2578" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-unused-text
        type: expect.preview
        at: { afterAction: expect-unused-code }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-1 }
        textContains: "Unused '@ts-expect-error' directive."
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: type-directive-off
        type: editor.type
        at: { mark: type-directive-off }
        target:
          {
            file: src/main.ts,
            after: "const cup = link.get(\"cup\")!;\n//    ^?\n\n",
            occurrence: 1,
          }
        text: "// "
        cadence: fast-explainer
      - id: expect-directive-off
        type: expect.preview
        at: { afterAction: type-directive-off }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-still-71
        type: expect.preview
        at: { afterAction: expect-directive-off }
        timeoutMs: 8000
        target: { by: testId, value: ts-out-3 }
        textContains: "နောက် စားပွဲ 71"
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: type-number
        type: editor.type
        at: { mark: type-number }
        target: { file: src/main.ts, after: "// // @ts-expect-error\n", occurrence: 1 }
        text: "const next = Number(table);\n// "
        cadence: block
      - id: expect-number-clean
        type: expect.preview
        at: { afterAction: type-number }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-8
        type: expect.preview
        at: { afterAction: expect-number-clean }
        timeoutMs: 8000
        target: { by: testId, value: ts-out-3 }
        textContains: "နောက် စားပွဲ 8"
        retry: { maxAttempts: 3, delayMs: 1200 }

  - id: when-to-silence
    narration: >
      [[mark:board-directives]] error ပိတ်တဲ့ နည်းတွေကို စုကြည့်ရအောင်။ [[mark:draw-expect]] ts expect
      error က နောက် line မှာ error ရှိမှ လက်ခံပြီး၊ error မရှိတော့ရင် ပြန်ပြောပါတယ်။
      [[mark:draw-ignore]] ts ignore ကတော့ နောက် line က error အားလုံးကို ပိတ်ပြီး၊ မလိုတော့တဲ့အခါလည်း
      ဘာမှ မပြောပါဘူး။ [[mark:prefer-expect]] ဒါကြောင့် ts expect error ကို ပိုသုံးသင့်ပါတယ်။
      [[mark:draw-nocheck]] ts no check ကတော့ ဖိုင် တစ်ခုလုံးကို မစစ်တော့ဘဲ၊ မေ့ပြီး ကျန်ခဲ့ရင်
      ရှာရခက်တဲ့ bug တွေ ဖြစ်စေလို့ ရှောင်ပါ။ [[mark:draw-asany]] as any ကတော့ expression တစ်ခုတည်းကိုပဲ
      မစစ်တော့ပါဘူး။ directive တွေက line တစ်ခုလုံးကို ပိတ်လို့ စာလုံးပေါင်း မှားတာလို တခြား
      အမှားတွေကိုပါ ဖုံးသွားနိုင်ပေမယ့်၊ as any ကတော့ ကျန်တဲ့ အမှားတွေကို ဆက်ပြပေးပါတယ်။
      [[mark:draw-when]] ဒါဆို ဘယ်အချိန် ပိတ်သင့်လဲ။ QR code မှာ စားပွဲ နံပါတ် အမြဲ ပါတာလို၊ ကိုယ်က
      TypeScript ထက် တကယ် ပိုသိတဲ့အခါ ပိတ်လို့ ရပါတယ်။ [[mark:draw-not-when]] ဒါပေမဲ့ error ကို
      နားမလည်သေးလို့ ပိတ်လိုက်ရင်တော့ ပြဿနာကို နောက်ကို ရွှေ့ထားတာပဲ ဖြစ်ပြီး၊ bug က runtime မှာ
      ပြန်ပေါ်လာတတ်ပါတယ်။ error ကို နားလည်အောင် အရင် ဖတ်ပြီး code ကို ပြင်တာ ပိုကောင်းပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 11: Annotations and Assertions (as any vs directives; when to suppress errors)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/annotations-and-assertions",
        }
      - {
          title: "TypeScript 3.7 release notes: // @ts-nocheck in TypeScript files",
          url: "https://www.typescriptlang.org/docs/handbook/release-notes/typescript-3-7.html#-ts-nocheck-in-typescript-files",
        }
    actions:
      - id: open-board-b
        type: whiteboard.apply
        at: { mark: board-directives }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-expect
        type: whiteboard.apply
        at: { mark: draw-expect }
        upsertIds: [b-expect]
        drawMs: 1400
      - id: draw-ignore
        type: whiteboard.apply
        at: { mark: draw-ignore }
        upsertIds: [b-ignore]
        drawMs: 1200
      - id: prefer-expect
        type: whiteboard.apply
        at: { mark: prefer-expect }
        upsertIds: [b-expect-circle]
        drawMs: 1200
      - id: draw-nocheck
        type: whiteboard.apply
        at: { mark: draw-nocheck }
        upsertIds: [b-nocheck, b-nocheck-strike]
        drawMs: 1800
      - id: draw-asany
