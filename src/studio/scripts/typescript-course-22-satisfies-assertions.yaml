build:
  # Studio replaces this built-in profile at render time with the Burmese provider chosen in the
  # render console (AthanLab with the user's own key, or VoxCPM2 when that feature is enabled).
  voiceProfile: pocket-alba-v1
  seed: 3122
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "Type ကို ဘယ်သူ ဆုံးဖြတ်လဲ"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ function တွေကနေ type ထုတ်ယူတာနဲ့၊ Exclude နဲ့ Extract လို
      union ကို ပြောင်းတဲ့ utility type တွေကို ကြည့်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ တန်ဖိုး တစ်ခုရဲ့ type
      ကို နောက်ဆုံး ဘယ်သူ ဆုံးဖြတ်လဲ ဆိုတာနဲ့၊ TypeScript ကို ကိုယ်က ဝင်ပြောလို့ ရတဲ့ နည်းတွေကို
      ကြည့်သွားပါမယ်။ [[mark:draw-annot]] variable ရဲ့ နာမည်နောက်မှာ type annotation ရေးလိုက်ရင်၊
      TypeScript က တန်ဖိုးကို အဲဒီ type နဲ့ စစ်ပြီး၊ နောက်ပိုင်းမှာ annotation ကိုပဲ ယုံပါတယ်။
      [[mark:draw-infer]] annotation မရေးရင်တော့ တန်ဖိုးကို ကြည့်ပြီး infer လုပ်ထားတဲ့ type ကို
      သုံးပါတယ်။ [[mark:draw-satisfies]] satisfies ကတော့ ဒီ နှစ်ခုရဲ့ အကောင်းကို ပေါင်းထားတာပါ။ type နဲ့
      ကိုက်မကိုက် စစ်ပေးပေမယ့်၊ တန်ဖိုးရဲ့ အသေးစိတ်ကိုတော့ မဖျောက်ပါဘူး။ [[mark:draw-as]] as ကတော့ စစ်တာ
      မဟုတ်ဘဲ၊ ဒီ တန်ဖိုးက ဒီ type ပဲ လို့ ကိုယ်က အတင်း ပြောလိုက်တာပါ။ [[mark:draw-silence]]
      နောက်ဆုံးမှာ error တစ်ခုကို လုံးဝ ပိတ်ပစ်တဲ့ comment directive တွေ ရှိပါတယ်။ ဒါတွေကို ဆိုင်ရဲ့
      ဈေးနှုန်း စာရင်းနဲ့၊ စားပွဲပေါ်က QR code ကို ဖတ်တဲ့ code မှာ တစ်ခုချင်း စမ်းကြည့်ပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 11: Annotations and Assertions",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/annotations-and-assertions",
        }
      - {
          title: "TypeScript Handbook: Everyday Types (type annotations, type assertions)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#type-assertions",
        }
    actions:
      - id: open-board-a
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-annot
        type: whiteboard.apply
        at: { mark: draw-annot }
        upsertIds: [a-annot]
        drawMs: 1400
      - id: draw-infer
        type: whiteboard.apply
        at: { mark: draw-infer }
        upsertIds: [a-infer]
        drawMs: 1200
      - id: draw-satisfies
        type: whiteboard.apply
        at: { mark: draw-satisfies }
        upsertIds: [a-satisfies, a-sat-check]
        drawMs: 2000
      - id: draw-as
        type: whiteboard.apply
        at: { mark: draw-as }
        upsertIds: [a-as, a-as-underline]
        drawMs: 1800
      - id: draw-silence
        type: whiteboard.apply
        at: { mark: draw-silence }
        upsertIds: [a-silence]
        drawMs: 1400

  - id: starter
    narration: >
      [[mark:close-board]] ဒီနေ့ code ကို ကြည့်ရအောင်။ [[mark:open-prices]] ဒါက ဆိုင်ရဲ့ ဈေးနှုန်း
      ဖိုင်ပါ။ [[mark:select-price-type]] ဈေးနှုန်း တစ်ခုက ဂဏန်း တစ်ခုတည်း ဖြစ်နိုင်သလို၊ ခွက်သေး
      ခွက်ကြီး အလိုက် ဈေး နှစ်မျိုး ပါတဲ့ object လည်း ဖြစ်နိုင်ပါတယ်။ [[mark:select-price-list]] အောက်က
      type ကတော့ key က string ဖြစ်ပြီး တန်ဖိုးက ဈေးနှုန်း ဖြစ်တဲ့ Record တစ်ခုပါ။
      [[mark:select-annotation]] ဆိုင်ရဲ့ ဈေးနှုန်း စာရင်းကို ဒီ type နဲ့ annotation ပေးထားပါတယ်။
      [[mark:select-paratha]] ပလာတာ ဈေးကိုတော့ ဂဏန်း မဟုတ်ဘဲ quote ထဲမှာ စာသားအနေနဲ့ ရေးထားပါတယ်။
      [[mark:open-main]] main ဖိုင်ကို ကြည့်ရအောင်။ [[mark:select-tea]] ပထမ အပိုင်းက လက်ဖက်ရည် ဈေးကို
      ယူပြီး ခွက်ကြီး ဈေးကို ထုတ်ပြပါတယ်။ [[mark:select-link]] ဒုတိယ အပိုင်းကတော့ စားပွဲပေါ်က QR code
      ရဲ့ link ထဲကနေ စားပွဲ နံပါတ်ကို ဖတ်ပါတယ်။ ပြီးတော့ ဂဏန်း နှစ်လုံး ဖြစ်အောင် ရှေ့မှာ သုည ဖြည့်ပြီး
      ထုတ်ပြပါတယ်။
    sources:
      - {
          title: "TypeScript Handbook: Utility Types (Record<Keys, Type>)",
          url: "https://www.typescriptlang.org/docs/handbook/utility-types.html#recordkeys-type",
        }
      - {
          title: "MDN: URLSearchParams.get()",
          url: "https://developer.mozilla.org/en-US/docs/Web/API/URLSearchParams/get",
        }
      - {
          title: "MDN: String.prototype.padStart()",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String/padStart",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: open-prices
        type: workspace.openFile
        at: { mark: open-prices }
        path: src/prices.ts
      - id: select-price-type
        type: editor.select
        at: { mark: select-price-type }
        target:
          { file: src/prices.ts, text: "number | { small: number; large: number }", occurrence: 1 }
      - id: select-price-list
        type: editor.select
        at: { mark: select-price-list }
        target:
          {
            file: src/prices.ts,
            text: "export type PriceList = Record<string, Price>;",
            occurrence: 1,
          }
      - id: select-annotation
        type: editor.select
        at: { mark: select-annotation }
        target: { file: src/prices.ts, text: ": PriceList", occurrence: 1 }
      - id: select-paratha
        type: editor.select
        at: { mark: select-paratha }
        target: { file: src/prices.ts, text: 'paratha: "1200"', occurrence: 1 }
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: src/main.ts
      - id: select-tea
        type: editor.select
        at: { mark: select-tea }
        target:
          {
            file: src/main.ts,
            text: "const tea = prices.tea;\nconsole.log(\"လက်ဖက်ရည် ခွက်ကြီး\", tea.large, \"ကျပ်\");",
            occurrence: 1,
          }
      - id: select-link
        type: editor.select
        at: { mark: select-link }
        target:
          {
            file: src/main.ts,
            text: "const link = new URLSearchParams(\"?table=7&cup=large\");\nconst table = link.get(\"table\");\nconsole.log(\"စားပွဲ\", table.padStart(2, \"0\"));",
            occurrence: 1,
          }

  - id: symptoms
    narration: >
      [[mark:panel-ready]] ညာဘက် panel ရဲ့ Output မှာ လက်ဖက်ရည် ခွက်ကြီး ၁၈၀၀ ကျပ်နဲ့ စားပွဲ နံပါတ် ထွက်လာပြီး၊ program
      က မှန်မှန် အလုပ်လုပ်နေပါတယ်။ [[mark:read-errors]] ဒါပေမဲ့ Errors မှာ error သုံးခု ရှိပါတယ်။ ပထမ
      error က ပလာတာ ဈေးဖြစ်တဲ့ စာသားကို ဈေးနှုန်း type ထဲ ထည့်လို့ မရဘူးလို့ ပြောပါတယ်။ annotation က
      တကယ့် အမှားကို ဖမ်းပေးလိုက်တာပါ။ [[mark:read-error-two]] ဒုတိယ error ကတော့ ဈေးနှုန်း type ပေါ်မှာ
      large ဆိုတဲ့ property မရှိဘူးလို့ ပြောပါတယ်။ လက်ဖက်ရည်မှာ ခွက်ကြီး ဈေး တကယ် ရှိနေတာ ဖြစ်လို့
      ထူးဆန်းပါတယ်။ [[mark:read-error-three]] တတိယ error ကတော့ စားပွဲ နံပါတ်က null ဖြစ်နိုင်တယ် ဆိုတာပါ။
    sources:
      - {
          title: "TypeScript Handbook: Narrowing (truthiness, null checks)",
          url: "https://www.typescriptlang.org/docs/handbook/2/narrowing.html",
        }
      - {
          title: "TypeScript Handbook: Everyday Types (union types)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#union-types",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
