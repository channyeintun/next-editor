scenes:
  - id: need
    chapter: တစ်လ သုံးကြည့်ရအောင်
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ use case တွေကို စိစစ်ပြီး၊ အလုပ်ပုံစံကိုယ်တိုင် ပြောင်းသွားတဲ့ structural gain
      နဲ့ အလုပ် အတူတူ နည်းနည်း ပိုမြန်သွားရုံ ဖြစ်တဲ့ marginal gain ကို ခွဲခြားခဲ့ပါတယ်။ စံ လေးခုနဲ့
      အမှတ်ပေးပြီး Billing ရဲ့ report job တွေကို ရွှေ့တဲ့ use case ကို ရွေးခဲ့ပါတယ်။
      [[mark:sel-usecase]] job ၁၄၀ ကို လက်နဲ့ ရွှေ့ရင် developer ငါးယောက် ရှစ်ပတ် ကြာမယ်လို့ ခန့်မှန်းထားပါတယ်။
      trial မှာတော့ developer နှစ်ယောက်က Claude Code နဲ့ ရက် သုံးရက်အတွင်း job ၁၂ ခုကို ရွှေ့ခဲ့ပါတယ်။ Claude
      Code ဆိုတာ terminal ထဲကနေ code ကို ဖတ်၊ ပြင်၊ command run ပေးတဲ့ coding agent ပါ။
      [[mark:cto]] အဲဒါကို မြင်တော့ CTO ဖြစ်တဲ့ အောင်အောင် က ရက် ၃၀ activation တစ်ခုကို တောင်းဆိုလာပါတယ်။
      activation ဆိုတာ သုံးစွဲမှုကို တကယ် စတင်နိုင်အောင် ပြင်ဆင်တဲ့ အဆင့်ပါ။ သူ လိုချင်တာက ကုမ္ပဏီရဲ့ ဒါရိုက်တာ အဖွဲ့က
      ဖတ်ပြီး ဆုံးဖြတ်နိုင်မယ့် ရလဒ် တစ်ခုပါ။
      [[mark:plan]] ပထမ အစည်းအဝေးမှာ တင်လာတဲ့ အစီအစဉ်ကတော့ developer ၂၄ ယောက်လုံးကို Claude Code ပေးပြီး၊ တစ်လ
      သုံးကြည့်ပြီး ဘာဖြစ်လာလဲ စောင့်ကြည့်မယ် ဆိုတာပါ။
      [[mark:problem]] ဒါပေမဲ့ ရက် ၃၀ ပြည့်တဲ့နေ့ကို မြင်ယောင်ကြည့်ပါ။ တချို့က အရမ်း အသုံးဝင်တယ်လို့ ပြောမယ်၊
      တချို့က သိပ် မထူးပါဘူးလို့ ပြောမယ်။ ဘာကို တိုင်းမလဲ မသတ်မှတ်ထားတော့ နှစ်ဖက်လုံး မှန်နေပြီး၊ ဒါရိုက်တာ အဖွဲ့
      ရှေ့မှာ ဆုံးဖြတ်ဖို့ အဖြေ မရှိပါဘူး။
      [[mark:sel-parts]] ဒါကြောင့် pilot တစ်ခုကို design ဆွဲရပါတယ်။ pilot ဆိုတာ အပြည့်အဝ မသုံးခင် လူနည်းနည်းနဲ့
      အချိန်တိုတို စမ်းတာပါ။ ဘယ်သူတွေ ပါမလဲ၊ ဘာကို လုပ်မလဲ၊ ဘယ်လောက် ကြာမလဲ၊ ဘာဖြစ်ရင် အောင်မြင်တယ်လို့
      ပြောမလဲ ဆိုတဲ့ လေးခုကို ကြိုဆုံးဖြတ်ရပါတယ်။ ဒါက CTO အတွက် ပြင်နေတဲ့ Delivery Plan Pack ရဲ့ ဒုတိယ စာမျက်နှာပါ။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
    actions:
      - {
          id: open-pilot,
          type: workspace.openFile,
          at: { scene: start },
          path: notebook/47-pilot-design.md,
        }
      - id: sel-usecase
        type: editor.select
        at: { mark: sel-usecase }
        target:
          file: notebook/47-pilot-design.md
          text: "Use case: Billing ရဲ့ report job 140 ကို library အသစ်ဆီ ရွှေ့ခြင်း"
      - id: sel-parts
        type: editor.select
        at: { mark: sel-parts }
        target:
          file: notebook/47-pilot-design.md
          text: "## Cohort\n\n## Scope\n\n## ကြာချိန်\n\n## Success criteria"

  - id: cohort
    chapter: Cohort
    narration: >
      [[mark:c-title]] ပထမ ဆုံးဖြတ်ချက်က cohort ပါ။ cohort ဆိုတာ pilot မှာ ပါတဲ့ လူအုပ်စုကို ခေါ်တာ ဖြစ်ပါတယ်။
      နေခြည် မှာ developer ၂၄ ယောက် ရှိပြီး team လေးခု ခွဲထားပါတယ်။
      [[mark:c-teams]] team တစ်ခုစီမှာ codebase လည်း မတူ၊ အလုပ်လုပ်ပုံလည်း မတူကြပါဘူး။ ၂၄ ယောက်လုံးကို
      တစ်ပြိုင်တည်း စလိုက်ရင် FDE တစ်ယောက်တည်းနဲ့ ဘယ်သူ့ကိုမှ သေသေချာချာ ကူညီနိုင်မှာ မဟုတ်သလို၊ ဘယ် team မှာ
      ဘာကြောင့် အလုပ်ဖြစ်လဲ ဆိုတာလည်း ခွဲပြောဖို့ ခက်ပါတယ်။
      [[mark:c-billing]] ကိုယ်တို့ ရွေးတဲ့ cohort မှာ Billing team ခြောက်ယောက်လုံး ပါပါတယ်။ ဘာကြောင့်လဲဆိုတော့
      report job တွေက သူတို့ရဲ့ codebase ထဲမှာ ရှိပြီး၊ ရွှေ့ပြီးတဲ့ job တွေကို နောက်ပိုင်း ဆက်ထိန်းရမယ့်သူတွေလည်း
      သူတို့ပဲ ဖြစ်လို့ပါ။
      [[mark:c-whole]] ဒီနေရာမှာ အရေးကြီးတာက စိတ်ပါတဲ့သူတွေချည်း ရွေးမယ့်အစား team တစ်ခုလုံးကို ယူတာပါ။
      Billing team lead မောင်မောင် ကိုယ်တိုင်က AI ရေးတဲ့ code ကို သံသယ ရှိနေသူပါ။ AI သုံးတဲ့ developer တွေကို
      လေ့လာတဲ့ သုတေသန အဖွဲ့ တစ်ခုက၊ ဘယ်သူတွေက လေ့လာမှုထဲ ဝင်ဖို့ သဘောတူလဲ ဆိုတာကိုက ရလဒ်ကို ပြောင်းစေတယ်လို့
      တွေ့ခဲ့ပါတယ်။ AI ကို သဘောကျတဲ့သူတွေချည်း ပါနေတဲ့ cohort ရဲ့ ရလဒ်က၊ ကျန်တဲ့ developer တွေအတွက် ဘာကိုမှ
      သေချာ မပြောနိုင်ပါဘူး။
      [[mark:c-network]] Network Tools ကနေလည်း နှစ်ယောက် ထပ်ထည့်ပါတယ်။ သူတို့ရဲ့ codebase က Billing နဲ့
      မတူတော့၊ Billing မှာ အလုပ်ဖြစ်တဲ့ CLAUDE.md နဲ့ setting တွေက တခြား codebase မှာပါ အလုပ်ဖြစ်လား ဆိုတာ
      စောစောစီးစီး သိရပါတယ်။ CLAUDE.md ဆိုတာ project အကြောင်း Claude Code အမြဲ သိထားရမယ့် အချက်တွေ ရေးထားတဲ့
      file ပါ။
      [[mark:c-sum]] Anthropic ရဲ့ scaling guide က AI tool သုံးနေပြီးသား developer ၂၀ ကနေ ၅၀ လောက်နဲ့ pilot ကို
      စဖို့ အကြံပြုပါတယ်။ နေခြည် မှာ developer စုစုပေါင်းကမှ ၂၄ ယောက်ပဲ ရှိတော့ ဂဏန်းကို မယူဘဲ ရည်ရွယ်ချက်ကိုပဲ
      ယူပါတယ်။ codebase ပေါ်မှာ စမ်းပေးပြီး၊ နောက်ပိုင်း ကျန်တဲ့သူတွေကို သင်ပေးနိုင်မယ့် လူအုပ်စု ဖြစ်ဖို့ပါ။
    sources:
