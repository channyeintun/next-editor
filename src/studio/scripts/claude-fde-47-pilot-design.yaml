        target: { file: notebook/47-pilot-design.md, after: "## Cohort\n" }
        text: "- 24 ယောက်ထဲက 8 ယောက်: Billing 6 ယောက်လုံးနဲ့ Network Tools 2 ယောက်\n- job ရွှေ့မယ့်သူ: trial က Billing developer 2 ယောက်။ ကျန် 6 ယောက်: နေ့စဉ် အလုပ်\n"
      - id: type-scope
        type: editor.type
        at: { mark: type-scope }
        cadence: line-by-line
        target: { file: notebook/47-pilot-design.md, after: "## Scope\n" }
        text: "- ပါ: report job 140၊ job တစ်ခုစီရဲ့ output ကို တိုက်စစ်တဲ့ test\n- မပါ: invoice တွက်တဲ့ code၊ review မပါဘဲ production ဆီ ပို့ခြင်း\n"
      - id: type-time
        type: editor.type
        at: { mark: type-time }
        cadence: line-by-line
        target: { file: notebook/47-pilot-design.md, after: "## ကြာချိန်\n" }
        text: "- Day 1 (တနင်္လာ) ကနေ Day 30 အထိ၊ Day 30 မှာ ရလဒ်ကို ဖတ်ပြီး ဆုံးဖြတ်\n"

  - id: criteria
    chapter: Success criteria
    narration: >
      [[mark:t-open]] အခု pilot ရဲ့ အရေးအကြီးဆုံး အပိုင်းကို ကြည့်ရအောင်။ 
      [[mark:t-line]] အလုပ်တွေက ဒီ ရက် ၃၀ အတွင်းမှာ ဖြစ်ပေမဲ့၊ pilot ရဲ့ အဖြေ ထွက်မထွက်ကိုတော့ ပထမ နေ့
      မတိုင်ခင်ကတည်းက ဆုံးဖြတ်ပြီးသား ဖြစ်နေပါတယ်။
      [[mark:t-criteria]] success criteria ဆိုတာ ဘာဖြစ်ရင် အောင်မြင်တယ်လို့ ပြောမလဲ ဆိုတဲ့ စံပါ။ ဒါကို ပထမ နေ့
      မတိုင်ခင် ရေးပြီး CTO နဲ့ သဘောတူထားရပါမယ်။ ရလဒ် ထွက်လာပြီးမှ စံ သတ်မှတ်မယ်ဆိုရင်၊ မသိမသာနဲ့ ရလဒ်နဲ့
      ကိုက်အောင် စံကို ညှိမိတတ်လို့ပါ။
      [[mark:t-research]] ဆေးသုတေသန လောကက pilot study တွေအတွက် ရေးထားတဲ့ လမ်းညွှန် တစ်ခုကလည်း၊ pilot ရဲ့ တာဝန်ဟာ
      အကျိုးရှိကြောင်း သက်သေပြဖို့ မဟုတ်ဘဲ ပိုကြီးတဲ့ အဆင့်ကို ဆက်လုပ်သင့်မသင့် ဆုံးဖြတ်ဖို့ ဖြစ်တယ်လို့ ဆိုပါတယ်။
      အဲဒီ ဆုံးဖြတ်ချက်အတွက် စည်းကမ်းကိုလည်း ကြိုတင် သတ်မှတ်ထားဖို့ပါ။
      [[mark:t-decide]] ဒါကြောင့် ရက် ၃၀ ပြည့်တဲ့နေ့ဟာ ရလဒ် ပြတဲ့နေ့ သက်သက် မဟုတ်ဘဲ ဆုံးဖြတ်ချက် ချတဲ့နေ့
      ဖြစ်ပါတယ်။ pilot တစ်ခုက ဆုံးဖြတ်ချက် တစ်ခုနဲ့ ဆုံးရပါတယ်။
      [[mark:t-three]] ဖြစ်နိုင်တဲ့ အဖြေ သုံးမျိုး ရှိပါတယ်။ အဓိက ရလဒ်ကို ရရင် ကျန်တဲ့ developer တွေဆီ ဆက်ဖြန့်ပါမယ်။
      လမ်းခုလတ်မှာ အရမ်း နှေးနေရင် နည်းလမ်းကို ပြင်ပြီး ဆက်ပါမယ်။ ပြဿနာ ကြီးကြီးမားမား တွေ့ရင်တော့ ရပ်ပါမယ်။ ရပ်တာ
      ဆိုတာလည်း ရှုံးတာ မဟုတ်ပါဘူး။ ငွေနဲ့ အချိန် ပိုမကုန်ခင် အဖြေ ရသွားတာပါ။

    sources:
      - {
          title: "CONSORT 2010 extension to randomised pilot and feasibility trials (Eldridge et al., BMJ 2016)",
          url: "https://europepmc.org/article/PMC/PMC5076380",
        }
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
