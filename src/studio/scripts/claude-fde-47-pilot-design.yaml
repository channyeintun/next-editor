  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ နေခြည် မှာ pilot နောက်တစ်ခုလည်း ရှိပါတယ်။ support agent ဆယ်ယောက်က
      connection ticket တွေအတွက် Reply assistant ကို သုံးနေတာပါ။ Reply assistant ဆိုတာ ticket တစ်ခုအတွက် အဖြေ
      မူကြမ်းကို ရေးပေးပြီး၊ support agent က ဖတ်ပြီးမှ ပို့ရတဲ့ AI tool ပါ။ ဒီ pilot ရဲ့ ရက် ၃၀ မှာ ဆုံးဖြတ်ချက်
      ချဖို့ ဘယ် criterion က ပိုသုံးလို့ ရမလဲ။
      [[mark:q-a]] ပထမ တစ်ခုက support agent တွေက draft တွေကို သဘောကျတယ် ဆိုတာပါ။
      [[mark:q-b]] ဒုတိယ တစ်ခုက ဘာမှ မပြင်ဘဲ ပို့လိုက်တဲ့ draft ရဲ့ အချိုးကို၊ pilot မစခင် သတ်မှတ်ထားတဲ့ ပမာဏနဲ့
      ယှဉ်တာပါ။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ တစ်ခုပါ။ ဘာကြောင့်လဲဆိုတော့ ရက် ၃၀ ပြည့်တဲ့နေ့မှာ ရေတွက်လို့ ရပြီး၊
      ကြိုသတ်မှတ်ထားတဲ့ ပမာဏကို ရောက်မရောက် ဘယ်သူ ကြည့်ကြည့် အဖြေ တူလို့ပါ။ သဘောကျတယ် ဆိုတာလည်း အရေးကြီးတဲ့
      data ပါ။ ဒါပေမဲ့ ဘယ်လောက် သဘောကျရင် ဆက်သွားမလဲ ဆိုတာ သတ်မှတ်မထားရင် ဆုံးဖြတ်ချက်အတွက် သုံးလို့ မရပါဘူး။

      [[mark:q-rule]] ဒါကြောင့် success criterion တစ်ခုကို ရေးတိုင်း မေးခွန်း နှစ်ခု မေးကြည့်ပါ။ ရက် ၃၀ ပြည့်တဲ့နေ့မှာ
      ရေတွက်လို့ ရမလား၊ ဘယ်လောက် ရောက်ရင် ဆက်သွားမလဲ ဆိုတာကို မစခင် ရေးထားပြီးပြီလား ဆိုတာပါ။
    sources:
      - {
          title: "CONSORT 2010 extension to randomised pilot and feasibility trials (Eldridge et al., BMJ 2016)",
          url: "https://europepmc.org/article/PMC/PMC5076380",
        }
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: q-rule, offsetMs: 2500 },
          upsertIds: [q-t1, q-t2],
          drawMs: 1600,
        }

  - id: your-turn
    chapter: ကိုယ့် pilot အတွက်
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ကိုယ့် team မှာ စမ်းချင်တဲ့ pilot တစ်ခုအတွက်
      success criterion တစ်ကြောင်း ရေးကြည့်ပါ။ ဒီ success criteria အပိုင်းအောက်မှာ နေခြည် အတွက် ရေးထားတာကို
      ကိုယ့်ဟာနဲ့ အစားထိုးလိုက်ပါ။
      [[mark:turn-2]] ရေးတဲ့အခါ အချက် သုံးချက် ပါပါစေ။ ဘာကို ရေတွက်မလဲ၊ ဘယ်လောက် ရောက်ရမလဲ၊ ဘယ်နေ့မှာ
      ကြည့်မလဲ ဆိုတာပါ။ ပြီးရင် ကိုယ့် team lead ကို ပြပြီး၊ ဒီ ဂဏန်းကို ကြည့်ပြီး ဆုံးဖြတ်ဖို့ သဘောတူမလား
      မေးကြည့်ပါ။ 
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: turn }, open: false }
      - id: sel-criteria
        type: editor.select
        at: { mark: turn, offsetMs: 2200 }
        target:
          file: notebook/47-pilot-design.md
          text: "## Success criteria (Day 1 မတိုင်ခင် ရေး)\n- developer 2 ယောက်၊ 3 ပတ် (6 developer-weeks) အတွင်း job 140 ရွှေ့ပြီး output တိုက်စစ် အောင်\n- တိုင်းမယ့်ပုံ: တစ်ပတ်ချင်း ရွှေ့ပြီး စစ်ပြီးသား job အရေအတွက်"

  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ developer အားလုံးကို တစ်လ သုံးကြည့်ခိုင်းတာက pilot မဟုတ်ပါဘူး။ ရက် ၃၀
      ပြည့်ရင် အဖြေ ပေးနိုင်တဲ့ pilot မှာ ဘယ်သူတွေ ပါမလဲ၊ ဘာပါပြီး ဘာမပါလဲ၊ ဘယ်လောက် ကြာမလဲ၊ ဘာဖြစ်ရင်
      အောင်မြင်တယ်လို့ ပြောမလဲ ဆိုတာကို မစခင် ရေးထားပါတယ်။
      [[mark:recap-2]] ပြီးတော့ pilot တစ်ခုဟာ ဆုံးဖြတ်ချက် တစ်ခုနဲ့ ဆုံးပါတယ်။ ဆက်သွားမလား၊ ပြင်ပြီး
      ဆက်မလား၊ ရပ်မလား ဆိုတာကို ကြိုရေးထားတဲ့ စံနဲ့ ဆုံးဖြတ်တာပါ။
      [[mark:next]] နောက် lesson မှာတော့ CTO က မေးမယ့် မေးခွန်း တစ်ခုကနေ စပါမယ်။ ဘာနဲ့ ယှဉ်ပြီး ပြောတာလဲ
      ဆိုတဲ့ မေးခွန်းပါ။ pilot မစခင် တိုင်းထားရမယ့် baseline နဲ့ ROI ကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
    actions:
      - id: sel-cohort
        type: editor.select
        at: { mark: recap }
        target:
          file: notebook/47-pilot-design.md
          text: "## Cohort"
      - id: sel-decision
        type: editor.select
        at: { mark: recap-2 }
        target:
          file: notebook/47-pilot-design.md
          text: "- ဆက်သွား: Day 30 မတိုင်ခင် job 140 လုံး စစ်ပြီး → ကျန် developer 16 ယောက်ဆီ အဆင့်လိုက် ဖြန့်"

