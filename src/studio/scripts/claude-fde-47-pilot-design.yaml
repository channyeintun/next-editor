          id: draw-t-title,
          type: whiteboard.apply,
          at: { mark: t-open },
          open: true,
          clear: true,
          upsertIds: [t-title],
        }
      - {
          id: draw-t-line,
          type: whiteboard.apply,
          at: { mark: t-line },
          upsertIds: [t-line, t-d1, t-w2, t-d30],
          drawMs: 1600,
        }
      - {
          id: draw-t-crit,
          type: whiteboard.apply,
          at: { mark: t-criteria },
          upsertIds: [t-crit],
          drawMs: 900,
        }
      - {
