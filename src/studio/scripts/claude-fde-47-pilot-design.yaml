  - id: scope
    chapter: Scope နဲ့ ကြာချိန်
    narration: >
      [[mark:s-close]] ဒီ ဆုံးဖြတ်ချက်ကို pilot design စာမျက်နှာမှာ တစ်ပိုင်းချင်း ချရေးကြည့်ရအောင်။
      [[mark:type-cohort]] cohort အောက်မှာ လူ ရှစ်ယောက်နဲ့ သူတို့ရဲ့ တာဝန်ကို ရေးပါတယ်။ report job တွေကို
      ရွှေ့မယ့်သူက trial မှာ ပါခဲ့တဲ့ Billing developer နှစ်ယောက်ပါ။ ကျန်တဲ့ ခြောက်ယောက်ကတော့ test ရေးတာလို နေ့စဉ် အလုပ်တွေမှာ သုံးပါမယ်။ 
      [[mark:type-scope]] နောက်တစ်ခုက scope ပါ။ scope ဆိုတာ pilot ထဲမှာ ဘာပါပြီး ဘာမပါလဲ ဆိုတဲ့ နယ်နိမိတ်ပါ။
      ပါတာက report job ၁၄၀ နဲ့ job တစ်ခုစီရဲ့ output ကို တိုက်စစ်တဲ့ test ပါ။ မပါတာကို ရေးထားဖို့ကလည်း
      အရေးကြီးပါတယ်။ invoice တွက်တဲ့ code ကို ဒီ ရက် ၃၀ အတွင်း မထိပါဘူး။ customer တွေ ပေးရမယ့် ငွေကို
      တိုက်ရိုက် ထိခိုက်နိုင်လို့ပါ။ review မလုပ်ရသေးတဲ့ ပြောင်းလဲမှုကို production ဆီ ပို့တာလည်း မပါပါဘူး။
      [[mark:type-time]] တတိယ တစ်ခုက ကြာချိန်ပါ။ တနင်္လာနေ့ တစ်နေ့ကို ပထမ နေ့လို့ သတ်မှတ်ပြီး၊ ရက် ၃၀
      ပြည့်တဲ့နေ့မှာ ရလဒ်ကို တင်ပြပါမယ်။ ရက် ၃၀ ဆိုတာ job တွေ ရွှေ့ဖို့ သုံးပတ်စာ အချိန် လုံလောက်ပြီး၊ ဆုံးဖြတ်ချက်
      မြန်မြန် ချနိုင်လောက်အောင်လည်း တိုပါတယ်။ Anthropic ရဲ့ scaling guide ကလည်း pilot အဆင့်ကို အကြာကြီး
      ဆွဲမထားဖို့ သတိပေးထားပါတယ်။
    sources:
      - {
          title: "Claude blog: scaling agentic coding across your organization",
          url: "https://claude.com/blog/scaling-agentic-coding",
        }
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
