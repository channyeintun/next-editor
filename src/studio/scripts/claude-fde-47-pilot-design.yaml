          type: whiteboard.apply,
          at: { mark: t-three },
          upsertIds: [t-go, t-fix, t-stop],
          drawMs: 1200,
        }

  - id: write-criteria
    chapter: Criteria ကို ဂဏန်းနဲ့ ရေးခြင်း
    narration: >
      [[mark:w-close]] ဒီ စံတွေကို စာမျက်နှာရဲ့ ကျန်တဲ့ အပိုင်းမှာ ဂဏန်းနဲ့ ရေးကြည့်ရအောင်။
      [[mark:type-criteria]] success criteria အောက်က ပထမ စာကြောင်းက headline ရလဒ်ပါ။ လက်နဲ့ဆိုရင် developer
      ငါးယောက် ရှစ်ပတ် ကြာမယ့် အလုပ်ကို developer နှစ်ယောက်က သုံးပတ်အတွင်း ပြီးအောင် လုပ်ဖို့ပါ။ developer
      တစ်ယောက် တစ်ပတ် လုပ်တာကို developer week တစ်ခုလို့ ရေတွက်ရင်၊ developer week ၄၀ ကနေ ခြောက်ခုဆီ ရောက်တာပါ။
      [[mark:sel-verified]] ဒီ စာကြောင်းမှာ ရွှေ့တယ် ဆိုတဲ့ စကားကို သေသေချာချာ ကန့်သတ်ထားပါတယ်။ job အဟောင်းရဲ့
      output နဲ့ တိုက်စစ်တာ အောင်မှ ရွှေ့ပြီးတယ်လို့ ရေတွက်ပါတယ်။ ဒုတိယ စာကြောင်းကတော့ တိုင်းမယ့်ပုံပါ။
      တစ်ပတ်ချင်း ရွှေ့ပြီး စစ်ပြီးသား job အရေအတွက်ကို မှတ်သွားပါမယ်။
      [[mark:type-decide]] နောက်ဆုံး အပိုင်းက ရက် ၃၀ ပြည့်တဲ့နေ့ရဲ့ ဆုံးဖြတ်ချက်ပါ။ ဆက်သွားဖို့ သုံးပတ် target ကို
      တစ်ရက်မှ မလွဲရဘူးလို့ မထားပါဘူး။ ရက် ၃၀ မပြည့်ခင် job ၁၄၀ လုံး စစ်ပြီးသား ဖြစ်ရင် ဆက်သွားပါမယ်။ ဒုတိယ ပတ်
      ကုန်တဲ့အထိ စစ်ပြီးသား job ၄၅ ခု မပြည့်ရင်တော့၊ job တွေကို အစုသေးသေး ခွဲပြီး နည်းလမ်း ပြင်ပါမယ်။ customer data က prompt ထဲ
      ရောက်သွားတာမျိုး တွေ့ရင်တော့ ချက်ချင်း ရပ်ပါမယ်။
      [[mark:sel-go]] ဒီ သုံးကြောင်းကို CTO က ပထမ နေ့ မတိုင်ခင် ဖတ်ပြီး သဘောတူထားရင်၊ ရက် ၃၀ ပြည့်တဲ့နေ့မှာ
      ငြင်းစရာ မကျန်တော့ပါဘူး။
    sources:
      - {
          title: "CONSORT 2010 extension to randomised pilot and feasibility trials (Eldridge et al., BMJ 2016)",
          url: "https://europepmc.org/article/PMC/PMC5076380",
        }
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
