              if (wantsLint) latest = { ...latest, lint: await lintNow() };
              running = false;
              broadcast();
            }, NO_RUN_GRACE_MS);
          };

          const onWatch = (event, file) => {
            if (closed || !["add", "change", "unlink"].includes(event) || ignored(file)) return;
            lastChangeAt = Date.now();
            pending.set(file, pending.get(file) === "add" && event === "change" ? "add" : event);
            setRunning(true);
            schedule(QUIET_MS);
          };
          server.watcher.on("all", onWatch);

          // The safety net for a missed watcher event (see the header), keyed by project-relative path:
          // `handled` is each file of src/ and each config file as last handed to Vitest ("mtime:size",
          // null = absent); `reported` is the state the check last reported for a file, so it reports a
          // state at most once.
          const inPollScope = (path) =>
            CONFIG_FILES.includes(path) ||
            (path.startsWith("src/") && !path.split("/").some((part) => part === "node_modules" || part.startsWith(".")) && !path.endsWith(".snap"));
          const stamp = (path) => {
            try {
              const stats = statSync(join(root, path));
              return stats.isFile() ? { sig: `${stats.mtimeMs}:${stats.size}`, mtimeMs: stats.mtimeMs } : null;
            } catch {
              return null;
            }
          };
