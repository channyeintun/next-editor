build:
  # Studio replaces this built-in profile at render time with the Burmese provider chosen in the
  # render console (AthanLab with the user's own key, or VoxCPM2 when that feature is enabled).
  voiceProfile: pocket-alba-v1
  seed: 5119
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: open
    chapter: "Testing Library ဆိုတာ"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ happy dom က Node ထဲမှာ browser ရဲ့ DOM ကို အတုလုပ်ပေးတာ
      မြင်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ အဲဒီ DOM ပေါ်မှာ ဆိုင်ရဲ့ အော်ဒါ form ကို customer တစ်ယောက်
      သုံးသလိုပဲ test လုပ်ကြည့်ပါမယ်။ [[mark:draw-customer]] customer က ဆိုင်ရဲ့ code ကို ဘယ်တော့မှ
      မမြင်ပါဘူး။ screen ပေါ်က ခလုတ်တွေ၊ စာတွေကိုပဲ မြင်ပြီး၊ ခလုတ်ပေါ်က စာကို ဖတ်ပြီး နှိပ်၊
      စုစုပေါင်း ငွေကိုလည်း မျက်စိနဲ့ ဖတ်ပါတယ်။ [[mark:draw-library]] Testing Library ဆိုတာ test
      ကိုလည်း အဲဒီ customer လိုပဲ page ကို သုံးခိုင်းတဲ့ library ပါ။ ခလုတ်ကို code ထဲက နာမည်နဲ့
      မရှာဘဲ screen ပေါ်က စာနဲ့ ရှာပြီး၊ ရလဒ်ကိုလည်း customer မြင်ရတဲ့ စာကိုပဲ စစ်ပါတယ်။
      [[mark:draw-rule]] သူ့ရဲ့ အဓိက အယူအဆကတော့၊ test က software ကို လူတွေ တကယ် သုံးတဲ့ ပုံစံနဲ့
      တူလေ၊ test pass ဖြစ်တဲ့အခါ ယုံကြည်လို့ ရလေ ဆိုတာပါ။ [[mark:draw-benefit]] ပြီးတော့ code ရဲ့
      အတွင်းပိုင်းကို မစစ်တဲ့အတွက်၊ customer မြင်ရတာ မပြောင်းသရွေ့ code ကို ပြန်ရေးလည်း test တွေ
      မပျက်ပါဘူး။
    sources:
      - {
          title: "Testing Library: Guiding Principles (facts C14)",
          url: "https://testing-library.com/docs/guiding-principles",
        }
      - {
          title: "Kent C. Dodds: Testing Implementation Details (facts C13)",
          url: "https://kentcdodds.com/blog/testing-implementation-details",
        }
      - {
          title: "web.dev Learn Testing: Component testing in practice",
          url: "https://web.dev/learn/testing/get-started/component-testing",
        }
      - {
          title: "web.dev Learn Testing: What testing is (behaviour on the web)",
          url: "https://web.dev/learn/testing/get-started/what-testing-is",
        }
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 300000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-customer
        type: whiteboard.apply
        at: { mark: draw-customer }
        upsertIds:
          [a-cust-box, a-cust-1, a-cust-2, a-arrow-1, a-page-box, a-page-1, a-page-2, a-page-3]
        drawMs: 4000
      - id: draw-library
        type: whiteboard.apply
        at: { mark: draw-library }
        upsertIds: [a-tl-box, a-tl-1, a-tl-2, a-arrow-2]
        drawMs: 2500
      - id: draw-rule
        type: whiteboard.apply
        at: { mark: draw-rule }
        upsertIds: [a-rule]
        drawMs: 1500
      - id: draw-benefit
        type: whiteboard.apply
        at: { mark: draw-benefit }
        upsertIds: [a-benefit]
        drawMs: 1500

  - id: queries
    narration: >
      [[mark:board-steps]] ဒါဆို test ထဲမှာ customer လို ဘယ်လို လုပ်မလဲ။ အဆင့် သုံးဆင့်နဲ့
      ကြည့်ရအောင်။ [[mark:draw-find]] ပထမ အဆင့်က ရှာတာပါ။ Testing Library မှာ ဒီလို ရှာပေးတဲ့
      function တွေကို query လို့ ခေါ်ပါတယ်။ get By Role က element ကို သူ့ role နဲ့ နာမည်နဲ့
      ရှာပါတယ်။ role ဆိုတာ ခလုတ်လား၊ စာ ရိုက်တဲ့ အကွက်လား ဆိုတဲ့ element ရဲ့ အမျိုးအစား ဖြစ်ပြီး၊ နာမည်ကတော့
      ခလုတ်ပေါ်က စာလို customer မြင်ရတဲ့ စာပါ။ screen reader တွေ ဖတ်ပြတာလည်း ဒီ role နဲ့ နာမည်ပဲ
      ဖြစ်ပါတယ်။ [[mark:draw-find-more]] get By Label Text က input ကို သူ့ label စာနဲ့ ရှာပြီး၊ get
      By Text ကတော့ page ပေါ်က စာကို ရှာပါတယ်။ [[mark:draw-act]] ဒုတိယ အဆင့်က လုပ်တာပါ။ user event က
      ခလုတ် နှိပ်တာ၊ စာ ရိုက်တာတွေကို လူတစ်ယောက် လုပ်သလို လုပ်ပေးပါတယ်။ [[mark:draw-check]]
      နောက်ဆုံး အဆင့်က စစ်တာပါ။ jest dom က to Have Text Content လို matcher တွေကို expect မှာ
      ထည့်ပေးလို့၊ element ထဲက စာကို customer ဖတ်သလို စစ်လို့ ရပါတယ်။
    sources:
      - {
          title: "Testing Library: About Queries, priority",
          url: "https://testing-library.com/docs/queries/about#priority",
        }
      - { title: "Testing Library: ByRole", url: "https://testing-library.com/docs/queries/byrole" }
      - {
          title: "Testing Library: user-event, Introduction",
          url: "https://testing-library.com/docs/user-event/intro",
        }
      - {
          title: "jest-dom: toHaveTextContent",
          url: "https://github.com/testing-library/jest-dom#tohavetextcontent",
        }
    actions:
      - id: board-steps
        type: whiteboard.apply
        at: { mark: board-steps }
        clear: true
        upsertIds: [b-title]
      - id: draw-find
        type: whiteboard.apply
        at: { mark: draw-find }
        upsertIds: [b-find-box, b-find-1, b-find-2]
        drawMs: 2500
      - id: draw-find-more
        type: whiteboard.apply
        at: { mark: draw-find-more }
        upsertIds: [b-find-3]
        drawMs: 1200
      - id: draw-act
        type: whiteboard.apply
        at: { mark: draw-act }
        upsertIds: [b-arrow-1, b-act-box, b-act-1, b-act-2]
        drawMs: 2500
      - id: draw-check
        type: whiteboard.apply
        at: { mark: draw-check }
        upsertIds: [b-arrow-2, b-check-box, b-check-1, b-check-2]
        drawMs: 2500

  - id: starter
    narration: >
      ဆိုင်ရဲ့ code ကို ကြည့်ရအောင်။ ဒါက ဆိုင်ရဲ့ အော်ဒါ form ဖိုင်ပါ။ [[mark:select-buttons]] form
      ထဲမှာ လက်ဖက်ရည် ထည့်မယ်၊ ကော်ဖီ ထည့်မယ် ဆိုတဲ့ ခလုတ် နှစ်ခု ပါပြီး၊ နှိပ်လိုက်တိုင်း အဲဒီ
      ဈေးနှုန်းကို စုစုပေါင်းထဲ ပေါင်းထည့်ပါတယ်။ [[mark:select-label]] သူ့အောက်မှာ လျှော့ဈေး ကုဒ်
      ဆိုတဲ့ label နဲ့ input တစ်ခု၊ ကုဒ် သုံးမယ် ဆိုတဲ့ ခလုတ် တစ်ခု ရှိပါတယ်။ [[mark:select-apply]]
      အဲဒီ ခလုတ်ကို နှိပ်ရင် ကုဒ်က TEA ဆယ် ဟုတ်မဟုတ် စစ်ပါတယ်။ ဟုတ်ရင် သုံးခဲ့တဲ့ ကုဒ်ကို
      မှတ်ထားပြီး၊ စုစုပေါင်းကနေ ၁၀ ရာခိုင်နှုန်း လျှော့ပါတယ်။ ဆိုင်က ဝန်ထမ်း
      လှလှ က တချို့ ဘောင်ချာတွေမှာ လျှော့ဈေး ပိုများနေတယ်လို့ ပြောထားတယ် ဆိုပါစို့။ ဘယ်မှာ မှားနေလဲ
      ဆိုတာကို form ကို လက်နဲ့ စမ်းပြီး ရှာကြည့်ပါမယ်။ [[mark:open-test]] ဒါကတော့ ဒီ form အတွက်
      ရေးထားတဲ့ test ဖိုင်ပါ။ Testing Library ရဲ့ screen နဲ့ user event ကို import လုပ်ထားပြီး၊
      screen ကတော့ page တစ်ခုလုံးထဲမှာ ရှာပေးတဲ့ object ပါ။ [[mark:select-before]] before Each ထဲမှာ
      test တစ်ခု မစခင်တိုင်း page ကို အလွတ် ဖြစ်အောင် အရင် ရှင်းပြီး၊ form အသစ် တစ်ခုကို ထည့်ပါတယ်။
      [[mark:select-zero]] ပထမ test ကတော့ ဘာမှ မမှာရသေးရင် စုစုပေါင်းက သုည ကျပ် ဖြစ်ရမယ်လို့
      စစ်ထားပါတယ်။ get By Text နဲ့ စုစုပေါင်း ဆိုတဲ့ စာ ပါတဲ့ element ကို ရှာပြီး၊ to Have Text
      Content နဲ့ သူ့ထဲက စာကို စစ်တာပါ။
    sources:
      - {
          title: "web.dev Learn Testing: The testing environment, emulate browser APIs",
          url: "https://web.dev/learn/testing/get-started/testing-environment#emulate_browser_apis",
        }
      - {
          title: "Vitest: Test Environment (facts A06)",
          url: "https://vitest.dev/guide/environment",
        }
      - {
          title: "Testing Library: About Queries, screen",
          url: "https://testing-library.com/docs/queries/about#screen",
        }
      - { title: "Vitest: beforeEach", url: "https://vitest.dev/api/hooks#beforeeach" }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: select-buttons
        type: editor.select
        at: { mark: select-buttons }
        target:
          {
            file: src/order-form.js,
            text: "<button type=\"button\" data-testid=\"add-tea\">လက်ဖက်ရည် ထည့်မယ်</button>\n        <button type=\"button\" data-testid=\"add-coffee\">ကော်ဖီ ထည့်မယ်</button>",
            occurrence: 1,
          }
      - id: select-label
        type: editor.select
        at: { mark: select-label }
        target:
          {
            file: src/order-form.js,
            text: "<label>လျှော့ဈေး ကုဒ် <input data-testid=\"code-input\" /></label>\n        <button type=\"button\" data-testid=\"apply-code\">ကုဒ် သုံးမယ်</button>",
            occurrence: 1,
          }
      - id: select-apply
        type: editor.select
        at: { mark: select-apply }
        target:
          {
            file: src/order-form.js,
            text: "if (code !== \"TEA10\") return;\n    state.code = code;\n    state.total = Math.round(state.total * 0.9);",
            occurrence: 1,
          }
      - id: open-test
        type: workspace.openFile
        at: { mark: open-test }
        path: src/order-form.test.js
      - id: select-before
        type: editor.select
        at: { mark: select-before }
        target:
          {
            file: src/order-form.test.js,
            text: "beforeEach(() => {\n  document.body.innerHTML = \"\";\n  const root = document.createElement(\"div\");\n  document.body.append(root);\n  mountOrderForm(root);\n});",
            occurrence: 1,
          }
      - id: select-zero
        type: editor.select
        at: { mark: select-zero }
        target:
          {
            file: src/order-form.test.js,
            text: "const total = screen.getByText(/စုစုပေါင်း/);\n  expect(total).toHaveTextContent(\"စုစုပေါင်း 0 ကျပ်\");",
            occurrence: 1,
          }

  - id: panel
    narration: >
      [[mark:ready]] ကဲ၊ ညာဘက်မှာ အပေါ်က ဆိုင်ရဲ့ အော်ဒါ form နဲ့ သူ့အောက်က Vitest panel ကို
      မြင်ရပါပြီ။ panel ကတော့ ထုံးစံအတိုင်း code ပြောင်းတိုင်း တကယ့် Vitest က ပြန် run ပြီး ပြတဲ့
      ရလဒ်ပါ။ test တစ်ခု pass ဖြစ်နေပြီး၊ form မှာလည်း စုစုပေါင်း သုည ကျပ်လို့
      ပြနေပါတယ်။ form ရော test ရော code တစ်ခုတည်းကို သုံးပေမဲ့၊ preview ထဲက form က browser ထဲမှာ run
      ပြီး၊ test ကတော့ happy dom ရဲ့ page ပေါ်မှာ form ကို သူ့ဘာသာ ဆောက်ပြီး စစ်တာပါ။
    sources:
      - { title: "Vitest: Getting Started", url: "https://vitest.dev/guide/" }
      - { title: "Vitest: Test Environment", url: "https://vitest.dev/guide/environment" }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-start-pass
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1000 }
      - id: expect-start-one
        type: expect.preview
        at: { afterAction: expect-start-pass }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "1" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-form
        type: expect.preview
        at: { afterAction: expect-start-one }
        timeoutMs: 8000
        target: { by: testId, value: total }
        textContains: "စုစုပေါင်း 0 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 1000 }

  - id: manual
    chapter: "လက်နဲ့ အရင် စမ်းကြည့်ရအောင်"
    narration: >
      ဒါဆို customer တစ်ယောက်လို form ကို လက်နဲ့ အရင် စမ်းကြည့်ရအောင်။ [[mark:click-drinks]]
      လက်ဖက်ရည် တစ်ခွက်နဲ့ ကော်ဖီ တစ်ခွက်ကို ထည့်ပါမယ်။ [[mark:read-3300]] စုစုပေါင်းမှာ ၃၃၀၀
      ကျပ်လို့ ပြနေပါတယ်။ ၁၅၀၀ နဲ့ ၁၈၀၀ ပေါင်းရင် ၃၃၀၀ ဖြစ်လို့ မှန်ပါတယ်။ [[mark:apply-once]] အခု
      လျှော့ဈေး ကုဒ်မှာ TEA ဆယ် လို့ ရိုက်ပြီး၊ ကုဒ် သုံးမယ် ခလုတ်ကို နှိပ်ပါမယ်။ [[mark:read-2970]]
      ၃၃၀၀ ရဲ့ ၁၀ ရာခိုင်နှုန်းက ၃၃၀ ဖြစ်လို့၊ ၂၉၇၀ ကျပ် ဖြစ်သွားတာ မှန်ပါတယ်။ [[mark:apply-twice]]
      ဒါပေမဲ့ customer က မသေချာလို့ ခလုတ်ကို နောက်တစ်ခါ ထပ်နှိပ်လိုက်တယ် ဆိုပါစို့။
      [[mark:read-2673]] စုစုပေါင်းက ၂၆၇၃ ကျပ် ဖြစ်သွားပါပြီ။ လျှော့ပြီးသား ငွေကနေ ၁၀ ရာခိုင်နှုန်း
      ထပ်လျှော့သွားတာပါ။ ကုဒ်တစ်ခုကို တစ်ခါပဲ သုံးရမှာ ဖြစ်လို့၊ လှလှ ပြောခဲ့တဲ့ bug ကို တွေ့ပါပြီ။
      [[mark:manual-cost]] လက်နဲ့ စမ်းတာက bug ရှာဖို့ ကောင်းပေမဲ့၊ code ပြင်တိုင်း ဒီ အဆင့်တွေကို
      ထပ်လုပ်နေရမှာပါ။
    sources:
      - {
          title: "web.dev Learn Testing: Automated versus manual testing",
          url: "https://web.dev/learn/testing/get-started/what-testing-is#automated-manual",
        }
    actions:
      - id: click-tea
        type: preview.click
        at: { mark: click-drinks }
        timeoutMs: 8000
        target: { by: testId, value: add-tea }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: click-coffee
        type: preview.click
        at: { mark: click-drinks, offsetMs: 1200 }
        timeoutMs: 8000
        target: { by: testId, value: add-coffee }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-3300
        type: expect.preview
        at: { mark: read-3300 }
        timeoutMs: 5000
        target: { by: testId, value: total }
        textContains: "စုစုပေါင်း 3,300 ကျပ်"
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: input-code
        type: preview.input
        at: { mark: apply-once }
        timeoutMs: 8000
        target: { by: testId, value: code-input }
        value: "TEA10"
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: click-apply
        type: preview.click
        at: { mark: apply-once, offsetMs: 1500 }
        timeoutMs: 8000
        target: { by: testId, value: apply-code }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-2970
        type: expect.preview
        at: { mark: read-2970 }
        timeoutMs: 5000
        target: { by: testId, value: total }
        textContains: "စုစုပေါင်း 2,970 ကျပ်"
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: click-apply-again
        type: preview.click
        at: { mark: apply-twice }
        timeoutMs: 8000
        target: { by: testId, value: apply-code }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-2673
        type: expect.preview
        at: { mark: read-2673 }
        timeoutMs: 5000
        target: { by: testId, value: total }
        textContains: "စုစုပေါင်း 2,673 ကျပ်"
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: automate
    chapter: "Customer လို test ရေးရအောင်"
    narration: >
      ဒါကြောင့် customer လုပ်ခဲ့တဲ့ အဆင့်တွေကို test နှစ်ခု အနေနဲ့ ရေးကြည့်ရအောင်။ [[mark:type-two]] ပထမ တစ်ခုက လက်ဖက်ရည်နဲ့ ကော်ဖီ ထည့်ရင် စုစုပေါင်း ၃၃၀၀ ကျပ် ဖြစ်ရမယ် ဆိုတာကို စစ်ပါမယ်။ နှိပ်တာကို
      စောင့်ရမှာ ဖြစ်လို့ test ကို async function နဲ့ ရေးထားပါတယ်။ [[mark:select-setup]] test ရဲ့
      အစမှာ user event ရဲ့ setup ကို ခေါ်ပြီး၊ customer ကိုယ်စား နှိပ်ပေး ရိုက်ပေးမယ့် user ကို
      ယူထားပါတယ်။ [[mark:select-click]] ပြီးတော့ get By Role နဲ့ role က button ဖြစ်ပြီး နာမည်က
      လက်ဖက်ရည် ထည့်မယ် ဖြစ်တဲ့ ခလုတ်ကို ရှာပြီး နှိပ်ပါတယ်။ await နဲ့ နှိပ်တာ ပြီးအောင် စောင့်ပြီး၊ ကော်ဖီ ခလုတ်ကိုလည်း နှိပ်ပါတယ်။ [[mark:select-expect-two]] နောက်ဆုံးမှာ
      စုစုပေါင်း ဆိုတဲ့ စာကို ရှာပြီး၊ ၃၃၀၀ ကျပ်လို့ ပြရမယ်လို့ စစ်ပါတယ်။ [[mark:read-two]] panel
      မှာ test နှစ်ခုလုံး pass ဖြစ်နေပါတယ်။ ခုနက လက်နဲ့ လုပ်ခဲ့တာကို test က သူ့ဘာသာ လုပ်ပြီး
      စစ်သွားတာပါ။
    sources:
      - { title: "Testing Library: ByRole", url: "https://testing-library.com/docs/queries/byrole" }
      - {
          title: "Testing Library: user-event, Introduction",
          url: "https://testing-library.com/docs/user-event/intro",
        }
      - {
          title: "Vitest: Component Testing, queries by role",
          url: "https://vitest.dev/guide/browser/component-testing",
        }
    actions:
      - id: type-two
        type: editor.type
        at: { mark: type-two }
        target:
          {
            file: src/order-form.test.js,
            after: "  expect(total).toHaveTextContent(\"စုစုပေါင်း 0 ကျပ်\");\n});\n",
            occurrence: 1,
          }
        text: "\ntest(\"adds a tea and a coffee\", async () => {\n  const user = userEvent.setup();\n  await user.click(screen.getByRole(\"button\", { name: \"လက်ဖက်ရည် ထည့်မယ်\" }));\n  await user.click(screen.getByRole(\"button\", { name: \"ကော်ဖီ ထည့်မယ်\" }));\n\n  const total = screen.getByText(/စုစုပေါင်း/);\n  expect(total).toHaveTextContent(\"စုစုပေါင်း 3,300 ကျပ်\");\n});\n"
        # One block, then selects (pilot note 1): line by line, the blank separator line parses and a
        # long next line's pause can pass the bridge's 1 s quiet window.
        cadence: block
      - id: expect-two-passed
        type: expect.preview
        at: { afterAction: type-two }
        timeoutMs: 8000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "2" }
        retry: { maxAttempts: 3, delayMs: 2000 }
      - id: expect-two-name
        type: expect.preview
        at: { afterAction: expect-two-passed }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-2 }
        attribute: { name: data-name, value: "adds a tea and a coffee" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-setup
        type: editor.select
        at: { mark: select-setup }
        target:
          { file: src/order-form.test.js, text: "const user = userEvent.setup();", occurrence: 1 }
      - id: select-click
        type: editor.select
        at: { mark: select-click }
        target:
          {
            file: src/order-form.test.js,
            text: 'await user.click(screen.getByRole("button", { name: "လက်ဖက်ရည် ထည့်မယ်" }));',
            occurrence: 1,
          }
      - id: select-expect-two
        type: editor.select
        at: { mark: select-expect-two }
        target:
          {
            file: src/order-form.test.js,
            text: "const total = screen.getByText(/စုစုပေါင်း/);\n  expect(total).toHaveTextContent(\"စုစုပေါင်း 3,300 ကျပ်\");",
            occurrence: 1,
          }

  - id: catch-bug
    narration: >
      [[mark:type-three]] ဒုတိယ တစ်ခုကတော့ bug ကို ဖမ်းမယ့် test ပါ။ ကုဒ် သုံးမယ် ခလုတ်ကို နှစ်ခါ နှိပ်လည်း
      တစ်ခါပဲ လျှော့ရမယ် ဆိုတဲ့ ဆိုင်ရဲ့ စည်းကမ်းကို စစ်ပါမယ်။ [[mark:select-type]] ဒီတစ်ခါ get By
      Label Text နဲ့ လျှော့ဈေး ကုဒ် ဆိုတဲ့ label ပါတဲ့ input ကို ရှာပြီး၊ user event ရဲ့ type နဲ့ TEA
      ဆယ် လို့ ရိုက်ပါတယ်။
      [[mark:select-twice]] ကုဒ် သုံးမယ် ခလုတ်ကို တစ်ခါ ရှာထားပြီး နှစ်ခါ နှိပ်ပါတယ်။ ပြီးတော့ စုစုပေါင်းက ၂၉၇၀ ကျပ် ဖြစ်ရမယ်လို့ စစ်ပါတယ်။
    sources:
      - {
          title: "Testing Library: ByLabelText",
          url: "https://testing-library.com/docs/queries/bylabeltext",
        }
      - {
          title: "Testing Library: user-event, type",
          url: "https://testing-library.com/docs/user-event/utility#type",
        }
    actions:
      - id: type-three
        type: editor.type
        at: { mark: type-three }
        target:
          {
            file: src/order-form.test.js,
            after: "  expect(total).toHaveTextContent(\"စုစုပေါင်း 3,300 ကျပ်\");\n});\n",
            occurrence: 1,
          }
        text: "\ntest(\"applies the code only once\", async () => {\n  const user = userEvent.setup();\n  await user.click(screen.getByRole(\"button\", { name: \"လက်ဖက်ရည် ထည့်မယ်\" }));\n  await user.click(screen.getByRole(\"button\", { name: \"ကော်ဖီ ထည့်မယ်\" }));\n  await user.type(screen.getByLabelText(\"လျှော့ဈေး ကုဒ်\"), \"TEA10\");\n\n  const apply = screen.getByRole(\"button\", { name: \"ကုဒ် သုံးမယ်\" });\n  await user.click(apply);\n  await user.click(apply);\n\n  const total = screen.getByText(/စုစုပေါင်း/);\n  expect(total).toHaveTextContent(\"စုစုပေါင်း 2,970 ကျပ်\");\n});\n"
        cadence: block
      - id: expect-red
        type: expect.preview
        at: { afterAction: type-three }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 3, delayMs: 2000 }
      - id: expect-red-count
        type: expect.preview
        at: { afterAction: expect-red }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-failed, value: "1" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-red-message
        type: expect.preview
        at: { afterAction: expect-red-count }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute:
          {
            name: data-message,
            value: "expect(element).toHaveTextContent()\n\nExpected element to have text content:\n  စုစုပေါင်း 2,970 ကျပ်\nReceived:\n  စုစုပေါင်း 2,673 ကျပ်",
          }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-red-test
        type: expect.preview
        at: { afterAction: expect-red-message }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-3 }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-type
        type: editor.select
        at: { mark: select-type }
        target:
          {
            file: src/order-form.test.js,
            text: 'await user.type(screen.getByLabelText("လျှော့ဈေး ကုဒ်"), "TEA10");',
            occurrence: 1,
          }
      - id: select-twice
        type: editor.select
        at: { mark: select-twice }
        target:
          {
            file: src/order-form.test.js,
            text: "const apply = screen.getByRole(\"button\", { name: \"ကုဒ် သုံးမယ်\" });\n  await user.click(apply);\n  await user.click(apply);",
            occurrence: 1,
          }

  - id: read-red
    narration: >
      panel ကို ကြည့်ပါ။ အပေါ်က PASS က အနီရောင် FAIL ဖြစ်သွားပြီး၊ test အသစ်ရှေ့မှာ ကြက်ခြေခတ်
      ပေါ်နေပါတယ်။ [[mark:read-message]] အလယ်က Failed Tests အပိုင်းမှာ ဒီတစ်ခါ AssertionError
      မဟုတ်ဘဲ Error လို့ပဲ ပြနေပြီး၊ message ကို jest dom က ရေးထားပါတယ်။ element ထဲမှာ စုစုပေါင်း
      ၂၉၇၀ ကျပ် ဆိုတဲ့ စာ ရှိရမယ့် နေရာမှာ၊ စုစုပေါင်း ၂၆၇၃ ကျပ် ရနေတယ်လို့ ပြောနေပါတယ်။ ဒီ message
      မှာ diff တော့ မပါပါဘူး။ [[mark:select-frame]] code frame ကလည်း to Have Text Content နဲ့ စစ်တဲ့
      line ကို ညွှန်ပြနေပါတယ်။ ဆိုင်ရဲ့ စည်းကမ်းအရ လျှော့ဈေး ကုဒ်ကို တစ်ခါပဲ သုံးရလို့၊ မှားနေတာက test မဟုတ်ဘဲ form ရဲ့ code ပါ။
      လက်နဲ့ တွေ့ခဲ့တဲ့ ၂၆၇၃ ကျပ်ကို test ကလည်း တိတိကျကျ ဖမ်းမိသွားတာပါ။
    sources:
      - {
          title: "jest-dom: toHaveTextContent",
          url: "https://github.com/testing-library/jest-dom#tohavetextcontent",
        }
      - {
          title: "Vitest: Writing Tests, reading test output",
          url: "https://vitest.dev/guide/learn/writing-tests#reading-test-output",
        }
    actions:
      - id: select-frame
        type: editor.select
        at: { mark: select-frame }
        target:
          {
            file: src/order-form.test.js,
            text: 'toHaveTextContent("စုစုပေါင်း 2,970 ကျပ်")',
            occurrence: 1,
          }
      - id: expect-frame
        type: expect.preview
        at: { afterAction: select-frame }
        timeoutMs: 5000
        target: { by: testId, value: vt-frame-1 }
        attribute: { name: data-line, value: "38" }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: fix
    narration: >
      form ဖိုင်ကို ပြန်ဖွင့်ပြီး bug ကို ပြင်ကြည့်ရအောင်။ [[mark:select-remember]] ကုဒ် သုံးမယ် ခလုတ်က သုံးခဲ့တဲ့ ကုဒ်ကို မှတ်တော့ မှတ်ထားပါတယ်။ ဒါပေမဲ့ နောက်တစ်ခါ နှိပ်တဲ့အခါ အဲဒီ
      မှတ်ထားတာကို ပြန်မစစ်ပါဘူး။ [[mark:type-guard]] ဒါကြောင့် ကုဒ် သုံးပြီးသား ဆိုရင် ဘာမှ မလုပ်ဘဲ
      ချက်ချင်း ပြန်ထွက်ခိုင်းတဲ့ line တစ်ကြောင်းကို ခလုတ်ရဲ့ function အစမှာ ထည့်ပါမယ်။ ဒါဆို ဒုတိယ
      အကြိမ် နှိပ်တာက စုစုပေါင်းကို ဘာမှ မပြောင်းတော့ပါဘူး။ [[mark:read-green]] panel ကို ကြည့်ပါ။
      test သုံးခုလုံး pass ဖြစ်ပြီး၊ အပေါ်က FAIL ကလည်း အစိမ်းရောင် PASS ပြန်ဖြစ်သွားပါပြီ။
      [[mark:form-fresh]] ဆိုင်ရဲ့ form ကလည်း ပြင်ပြီးသား code နဲ့ အစကနေ ပြန်စထားပါတယ်။ ဒီ test ကို
      မဖျက်ဘဲ ဆက်ထားရင်၊ နောက်တစ်ချိန် ဒီ bug ပြန်ပေါ်လာတာနဲ့ ချက်ချင်း သိရမှာပါ။
    sources:
      - {
          title: "web.dev Learn Testing: What to test, TDD for bug fixes",
          url: "https://web.dev/learn/testing/get-started/what-to-test",
        }
      - {
          title: "web.dev Learn Testing: Types of tests, regression tests",
          url: "https://web.dev/learn/testing/get-started/test-types",
        }
    actions:
      - id: open-form-fix
        type: workspace.openFile
        at: { scene: start }
        path: src/order-form.js
      - id: select-remember
        type: editor.select
        at: { mark: select-remember }
        target: { file: src/order-form.js, text: "state.code = code;", occurrence: 1 }
      - id: type-guard
        type: editor.type
        at: { mark: type-guard }
        target:
          { file: src/order-form.js, after: "addEventListener(\"click\", () => {\n", occurrence: 1 }
        text: "    if (state.code) return;\n"
      - id: expect-green
        type: expect.preview
        at: { afterAction: type-guard }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 2000 }
      - id: expect-green-count
        type: expect.preview
        at: { afterAction: expect-green }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "3" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-fresh-form
        type: expect.preview
        at: { afterAction: expect-green-count }
        timeoutMs: 8000
        target: { by: testId, value: total }
        textContains: "စုစုပေါင်း 0 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 1000 }
      - id: expect-form-file
        type: expect.file
        at: { afterAction: expect-fresh-form }
        path: src/order-form.js
        contains: "addEventListener(\"click\", () => {\n    if (state.code) return;\n    const code"
      - id: expect-test-file
        type: expect.file
        at: { afterAction: expect-form-file }
        path: src/order-form.test.js
        contains: "  await user.click(apply);\n  await user.click(apply);\n\n  const total = screen.getByText(/စုစုပေါင်း/);\n  expect(total).toHaveTextContent(\"စုစုပေါင်း 2,970 ကျပ်\");"

  - id: cleanup
    chapter: "Test တိုင်း page အသစ်နဲ့"
    narration: >
      [[mark:board-fresh]] ဒါဆို before Each က page ကို ဘာကြောင့် အရင် ရှင်းရလဲ ကြည့်ရအောင်။
      [[mark:draw-leftover]] ဖိုင်တစ်ခုထဲက test တွေက happy dom ရဲ့ page တစ်ခုတည်းကို မျှသုံးကြပါတယ်။
      ရှင်းတဲ့ line မပါရင်၊ ပထမ test ရဲ့ form က page ပေါ်မှာ ကျန်နေပြီး၊ ဒုတိယ test ရဲ့ form က သူ့အောက်မှာ
      ထပ်ရောက်လာပါမယ်။ [[mark:draw-which]] အဲဒီအခါ လက်ဖက်ရည် ထည့်မယ် ဆိုတဲ့ ခလုတ်က နှစ်ခု
      ဖြစ်သွားပါတယ်။ get By Role က ဘယ်ခလုတ်ကို ဆိုလိုလဲ ခန့်မှန်းမပေးဘဲ၊ element တစ်ခုထက် ပိုတွေ့တယ်
      ဆိုတဲ့ error ကို throw လုပ်ပါတယ်။ မှားတဲ့ ခလုတ်ကို နှိပ်မိရင် test ကို ယုံလို့ မရတော့လို့ပါ။ [[mark:draw-fix]] ဒါကြောင့် test တိုင်းကို page အလွတ်နဲ့ form အသစ် တစ်ခုကနေ
      စခိုင်းတာပါ။ test တစ်ခုက နောက် test ကို မထိခိုက်ဘဲ သီးခြား ဖြစ်နေရမယ် ဆိုတဲ့ isolation ပါပဲ။
    sources:
      - {
          title: "Testing Library: About Queries, types of queries (getBy throws on more than one match)",
          url: "https://testing-library.com/docs/queries/about#types-of-queries",
        }
      - {
          title: "Vitest: Setup and Teardown",
          url: "https://vitest.dev/guide/learn/setup-teardown",
        }
    actions:
      - id: board-fresh
        type: whiteboard.apply
        at: { mark: board-fresh }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-leftover
        type: whiteboard.apply
        at: { mark: draw-leftover }
        upsertIds: [c-page-box, c-page, c-form1-box, c-form1, c-btn1, c-form2-box, c-form2, c-btn2]
        drawMs: 4500
      - id: draw-which
        type: whiteboard.apply
        at: { mark: draw-which }
        upsertIds: [c-arrow, c-query, c-which, c-error-1, c-error-2]
        drawMs: 3000
      - id: draw-fix
        type: whiteboard.apply
        at: { mark: draw-fix }
        upsertIds: [c-fix]
        drawMs: 1500

  - id: setup-file
    narration: >
      နောက်ထပ် မေးစရာ တစ်ခု ရှိပါတယ်။ [[mark:open-config]] test ဖိုင်ထဲမှာ jest dom ကို import
      မလုပ်ထားဘဲ၊ to Have Text Content ကို ဘယ်က ရလာတာလဲ။ ဒါက Vitest ရဲ့ config ဖိုင်ပါ။
      [[mark:select-setup-files]] setup Files ဆိုတဲ့ option မှာ setup ဖိုင် တစ်ခုကို ပေးထားပါတယ်။
      setup ဖိုင်ဆိုတာ test ဖိုင်တိုင်း မစခင် Vitest က အရင် run ပေးတဲ့ ဖိုင်ပါ။ [[mark:open-setup]]
      အဲဒီ ဖိုင်ကို ဖွင့်ကြည့်ရအောင်။ [[mark:select-import]] ဖိုင်ထဲမှာ jest dom ကို Vitest အတွက်
      import လုပ်တဲ့ line တစ်ကြောင်းပဲ ရှိပြီး၊ ဒီ line က expect မှာ jest dom ရဲ့ matcher တွေကို
      ထည့်ပေးပါတယ်။ ဒါကြောင့် test ဖိုင်တိုင်းမှာ ဒီ matcher တွေကို import မလုပ်ဘဲ သုံးလို့ ရပါတယ်။
    sources:
      - { title: "Vitest: setupFiles", url: "https://vitest.dev/config/setupfiles" }
      - {
          title: "jest-dom: Usage with Vitest",
          url: "https://github.com/testing-library/jest-dom#with-vitest",
        }
    actions:
      - id: close-fresh
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-config
        type: workspace.openFile
        at: { mark: open-config }
        path: vitest.config.js
      - id: select-setup-files
        type: editor.select
        at: { mark: select-setup-files }
        target:
          { file: vitest.config.js, text: 'setupFiles: ["./src/setup-tests.js"],', occurrence: 1 }
      - id: open-setup
        type: workspace.openFile
        at: { mark: open-setup }
        path: src/setup-tests.js
      - id: select-import
        type: editor.select
        at: { mark: select-import }
        target:
          {
            file: src/setup-tests.js,
            text: 'import "@testing-library/jest-dom/vitest";',
            occurrence: 1,
          }

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ ဆိုင်ရဲ့ form ကို လက်နဲ့ အရင် စမ်းပြီး bug ကို ရှာတွေ့ခဲ့ပါတယ်။ အဲဒီ
      အဆင့်တွေကို test အနေနဲ့ ရေးထားလိုက်တော့၊ code ပြောင်းတိုင်း အလိုလို ပြန်စစ်ပေးနေပါပြီ။
      Testing Library ရဲ့ query တွေက customer မြင်ရတဲ့ role နဲ့ နာမည်၊ label
      နဲ့ စာတွေကို သုံးပြီး ရှာပါတယ်။ user event က လူလို နှိပ်ပေး ရိုက်ပေးပြီး၊ jest dom က customer
      ဖတ်သလို စစ်ပေးပါတယ်။ test တိုင်းကိုလည်း page အလွတ်နဲ့ စရပါမယ်။ [[mark:recap-any]] ဒီနည်းက DOM
      ကို စစ်တာ ဖြစ်လို့၊ ရိုးရိုး JavaScript ဖြစ်ဖြစ်၊ web component ဖြစ်ဖြစ်၊ React ဖြစ်ဖြစ်
      သုံးလို့ ရပါတယ်။ နောက် lesson မှာတော့ network ကနေ data ယူတဲ့၊ child component နဲ့ context
      ကိုပါ သုံးတဲ့ React component တစ်ခုကို test လုပ်ကြည့်ပါမယ်။
    sources:
      - {
          title: "Testing Library: Introduction (works with any framework)",
          url: "https://testing-library.com/docs/",
        }
      - {
          title: "web.dev Learn Testing: Welcome (React or Lit)",
          url: "https://web.dev/learn/testing/welcome",
        }
    actions: []
checks:
  - { type: timing.p95Ms, max: 300 }
