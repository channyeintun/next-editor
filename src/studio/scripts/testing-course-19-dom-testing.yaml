      src/app.css: |
        .order-form { padding: 8px 14px; }
        .order-form .row { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; }
        .order-form button { font: inherit; padding: 3px 10px; border: 1px solid #b7a98f; border-radius: 6px; background: #fff; cursor: pointer; }
        .order-form input { font: inherit; margin-left: 4px; padding: 2px 6px; width: 7em; }
        .order-form p { margin: 0; }
      src/app.js: |
        import { mountOrderForm } from "./order-form.js";
        import "./app.css";

        // The preview mounts this into #app (index.html: data-app="src/app.js").
        export default function mount(root) {
          mountOrderForm(root);
        }
      src/menu.js: |
        export const MENU = {
          tea: { name: "လက်ဖက်ရည်", price: 1500, drink: true },
          coffee: { name: "ကော်ဖီ", price: 1800, drink: true },
          lime: { name: "သံပုရာရည်", price: 1200, drink: true },
          mohinga: { name: "မုန့်ဟင်းခါး", price: 2500, drink: false },
          paratha: { name: "ပလာတာ", price: 1200, drink: false },
        };

        export function priceOf(id) {
          const item = MENU[id];
          if (!item) throw new Error(`${id} is not on the menu`);
          return item.price;
        }
      src/order-form.js: |
        import { priceOf } from "./menu.js";

        // The shop's order form: each button adds one drink, the code TEA10 takes 10 % off.
        export function mountOrderForm(root) {
          const state = { total: 0, code: "" };
          root.innerHTML = `
            <section class="order-form" aria-label="အော်ဒါ">
              <div class="row">
                <button type="button" data-testid="add-tea">လက်ဖက်ရည် ထည့်မယ်</button>
                <button type="button" data-testid="add-coffee">ကော်ဖီ ထည့်မယ်</button>
              </div>
              <div class="row">
                <label>လျှော့ဈေး ကုဒ် <input data-testid="code-input" /></label>
                <button type="button" data-testid="apply-code">ကုဒ် သုံးမယ်</button>
              </div>
              <p data-testid="total">စုစုပေါင်း 0 ကျပ်</p>
            </section>`;
          const total = root.querySelector("[data-testid=total]");
          const show = () => {
            total.textContent = `စုစုပေါင်း ${state.total.toLocaleString("en-US")} ကျပ်`;
          };
          const add = (id) => {
            state.total += priceOf(id);
            show();
          };
          root.querySelector("[data-testid=add-tea]").addEventListener("click", () => add("tea"));
          root.querySelector("[data-testid=add-coffee]").addEventListener("click", () => add("coffee"));
          root.querySelector("[data-testid=apply-code]").addEventListener("click", () => {
            const code = root.querySelector("[data-testid=code-input]").value.trim().toUpperCase();
            if (code !== "TEA10") return;
            state.code = code;
            state.total = Math.round(state.total * 0.9);
            show();
          });
        }
      src/order-form.test.js: |
        import { beforeEach, expect, test } from "vitest";
        import { screen } from "@testing-library/dom";
        import userEvent from "@testing-library/user-event";
        import { mountOrderForm } from "./order-form.js";

        beforeEach(() => {
          document.body.innerHTML = "";
          const root = document.createElement("div");
          document.body.append(root);
          mountOrderForm(root);
        });

        test("starts at zero", () => {
          const total = screen.getByText(/စုစုပေါင်း/);
          expect(total).toHaveTextContent("စုစုပေါင်း 0 ကျပ်");
        });
      src/setup-tests.js: |
        // Adds jest-dom's matchers (toBeInTheDocument, toHaveTextContent, …) to Vitest's expect.
        import "@testing-library/jest-dom/vitest";
      vite.config.js: |
        import { defineConfig } from "vite";
        import courseVitestBridge from "./course/vitest-bridge.js";

        // The course panel: the dev server runs the real Vitest and the preview shows its results.
        export default defineConfig({
          plugins: [courseVitestBridge()],
        });
      vitest.config.js: |
        import { defineConfig } from "vitest/config";

        export default defineConfig({
          test: {
            environment: "happy-dom",
            setupFiles: ["./src/setup-tests.js"],
          },
        });
