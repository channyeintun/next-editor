# AI Builder, lesson 31: ship and learn from users (Burmese, docs kind).
#
# Start state (ws/): base-docs (package.json with a no-op dev script, notes.md unused),
# docs/problem.md exactly as COURSE-KIT §4.1 (bun tools/binder.ts 1), and docs/next.md pinned with its
# title line only. Nothing runs. The lesson selects problem.md's "How we'll know" lines and types all
# of docs/next.md (COURSE-KIT §4.22 outline → full text), one section per action (line-by-line).
#
# Boards: (L) the course strip with module 8 orange + the build → measure → learn loop (↻);
# (N) the example numbers after a month as bars against the problem.md goals (said to be an example);
# (U) what users say vs what they do; (Z) the quiz (30 % not picked up: delivery or find out why);
# (H) honest with customers: what we keep, they choose; no pre-ticked box, no fake time limit.
# Typed: What we learned (+ one line on who the app left out) · Why not picked up · v2 shortlist ·
# Next question for the owner. The quiz sits before "Why not picked up" so the evidence is its answer.
#
# Build: bun ~/Documents/ai-builder-course-work/tools/build-lesson.ts template.yaml ws ai-builder-31-ship-and-learn.yaml
