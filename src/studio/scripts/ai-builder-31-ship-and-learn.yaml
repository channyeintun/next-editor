  - id: everyone
    narration: >
      [[mark:close-u]] ဖုန်းကို လှလှ ဆီ ပေးပြီး မှာခိုင်းခဲ့တဲ့ customer တွေက ဘာကြောင့် ဒီလို လုပ်ခဲ့လဲ။ သူတို့
      ဖုန်းကို ကိုင်ပြီး မှာပေးခဲ့ရတဲ့ လှလှ က တန်းမြင်ခဲ့ပါတယ်။ ဖုန်းဟောင်း တချို့မှာ မြန်မာစာက ပုံပျက်ပြီး
      ပေါ်ပါတယ်။ စာလုံးကို ကြီးကြီး ထားတဲ့ ဖုန်းမှာ မှာမယ် ခလုတ်ကို တခြား စာတွေက ဖုံးသွားလို့ မမြင်ရပါဘူး။ data
      နှေးရင်တော့ app ပေါ်လာဖို့ အရမ်း ကြာပါတယ်။ [[mark:type-left-out]] ဒါကို ပထမ အပိုင်းရဲ့ အောက်ဆုံးမှာ
      ထပ်ထည့်ပါမယ်။ ကိန်းဂဏန်းထဲမှာ မပေါ်တဲ့ user တွေကိုလည်း မှတ်ထားတာပါ။ [[mark:sel-left-out]] requirement ထဲမှာ
      ဒါတွေ ရေးခဲ့ပြီး၊ ဈေးပေါတဲ့ ဖုန်း တစ်လုံးနဲ့လည်း စမ်းခဲ့ပါတယ်။ ဒါပေမဲ့ customer တွေရဲ့ ဖုန်းတွေက အများကြီး
      ပိုကွဲပြားပါတယ်။ ချန်ထားခံရတဲ့ user တွေက ဘာမှ မပြောဘဲ ထွက်သွားတတ်လို့ တမင် ရှာမှ တွေ့ပါတယ်။ လူတိုင်း
      သုံးနိုင်အောင် ဘယ်လို လုပ်မလဲ ဆိုတာကိုတော့ Accessibility course မှာ အသေးစိတ် လေ့လာနိုင်ပါတယ်။
    sources:
      - {
          title: "W3C WAI: Introduction to Web Accessibility (benefits for older people, small screens, slow connections)",
          url: "https://www.w3.org/WAI/fundamentals/accessibility-intro/",
        }
      - {
          title: "W3C: Understanding WCAG 2.2 Success Criterion 1.4.4 Resize Text",
          url: "https://www.w3.org/WAI/WCAG22/Understanding/resize-text.html",
        }
      - {
          title: "Wikipedia: Zawgyi font (garbled text between Zawgyi and Unicode devices)",
          url: "https://en.wikipedia.org/wiki/Zawgyi_font",
        }
    actions:
      - { id: close-u, type: whiteboard.apply, at: { mark: close-u }, open: false }
      - id: type-left-out
        type: editor.type
        at: { mark: type-left-out }
        target: { file: docs/next.md, after: "(ADR-001 ရဲ့ 5 ခုကို ကျော်)\n", occurrence: 1 }
        text: "- မသုံးနိုင်ခဲ့တဲ့ customer — ဖုန်းဟောင်းမှာ မြန်မာစာ ပုံပျက်၊ စာလုံးကြီး setting မှာ ခလုတ် ပျောက်၊ data နှေးရင် ကြာလွန်း\n"
        cadence: line-by-line
      - {
          id: sel-left-out,
          type: editor.select,
          at: { mark: sel-left-out },
          target: { file: docs/next.md, text: "- မသုံးနိုင်ခဲ့တဲ့ customer", occurrence: 1 },
        }

  - id: quiz
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ ဆိုင်ပိုင်ရှင် က လာမယူတဲ့ အော်ဒါ ၃၀ ရာခိုင်နှုန်းကို ကြည့်ပြီး၊
      customer တချို့လည်း တောင်းနေလို့ အိမ်အရောက် ပို့ပေးတဲ့ delivery ကို အခု ထည့်ကြရအောင် လို့ ပြောတယ် ဆိုပါစို့။
      delivery ကို ထည့်မလား၊ ဘာကြောင့် လာမယူလဲ ဆိုတာ အရင် ရှာမလား။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဘာကြောင့် လာမယူလဲ အရင် ရှာတာပါ။ ဘာကြောင့်လဲဆိုတော့ အကြောင်းရင်းကို ဘယ်သူမှ
      မသိသေးလို့ပါ။ delivery က ကုန်ကျစရိတ်ရော risk ရော များတဲ့ အလုပ်ကြီး ဖြစ်ပြီး၊ အကြောင်းရင်းကို မထိရင် ပြဿနာက
      ဆက်ရှိနေနိုင်ပါတယ်။ delivery တောင်းတာက customer တွေ ပြောတာ ဖြစ်ပြီး၊ အော်ဒါ လာမယူတာကတော့ သူတို့ တကယ်
      လုပ်တာပါ။
    sources:
      - {
          title: "Nielsen Norman Group: First Rule of Usability? Don't Listen to Users",
          url: "https://www.nngroup.com/articles/first-rule-of-usability-dont-listen-to-users/",
        }
      - {
          title: "The Lean Startup: Principles (build–measure–learn, MVP, validated learning)",
          url: "https://theleanstartup.com/principles",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [z-title, z-q1, z-q2, z-o1, z-o2],
          drawMs: 2200,
        }
      - {
          id: draw-quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [z-a, z-a-note],
          drawMs: 1400,
        }

  - id: why
    chapter: နောက် version ကို အထောက်အထားနဲ့ ရွေး
    narration: >
      [[mark:close-quiz]] ဒါကြောင့် လှလှ က အော်ဒါ လာမယူခဲ့တဲ့ customer တွေ ဆိုင်ကို ပြန်ရောက်လာတဲ့အခါ ဘာဖြစ်ခဲ့လဲ
      မေးကြည့်ခဲ့ပါတယ်။ [[mark:type-why]] နောက် အပိုင်းမှာ သူတို့ ပြောခဲ့တာနဲ့ data ထဲက တွေ့ခဲ့တာကို ရေးပါတယ်။ ပထမ
      အချက် နှစ်ချက်က customer တွေ ကိုယ်တိုင် ပြောခဲ့တဲ့ အကြောင်းရင်းတွေ ဖြစ်ပြီး၊ နှစ်ခုလုံးက အော်ဒါ
      မှာပြီးနောက်မှာ ဖြစ်ခဲ့တာတွေပါ။ [[mark:sel-data]] ဒီ စာကြောင်းကတော့ customer တွေ ဘာလုပ်ခဲ့လဲ ပြနေတာပါ။
      အချိန် အကျပ်ဆုံးကို ရွေးပြီး မမီလိုက်ကြတာပါ။ ပြောတာရော လုပ်ခဲ့တာရော တစ်နေရာတည်းကို ညွှန်နေပါတယ်။ ပြဿနာက
      ဆိုင်နဲ့ ဝေးလို့ မဟုတ်ဘဲ၊ လာယူချိန်ကို ရွေးပြီးရင် ပြင်ခွင့် မရှိတာနဲ့ သတိပေးမယ့် အရာ မရှိတာပါ။ ဒါကြောင့်
      delivery ထည့်ရုံနဲ့ ဒီ ပြဿနာ မပြေပါဘူး။
    sources:
      - {
          title: "Nielsen Norman Group: First Rule of Usability? Don't Listen to Users",
          url: "https://www.nngroup.com/articles/first-rule-of-usability-dont-listen-to-users/",
        }
      - {
          title: "The Lean Startup: Principles (build–measure–learn, MVP, validated learning)",
          url: "https://theleanstartup.com/principles",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: close-quiz }, open: false }
      - id: type-why
        type: editor.type
        at: { mark: type-why }
        target: { file: docs/next.md, after: "data နှေးရင် ကြာလွန်း\n\n", occurrence: 1 }
        text: "## Why not picked up\nလှလှ က လာမယူခဲ့တဲ့ customer တွေကို ဆိုင်ပြန်ရောက်တော့ မေးခဲ့တယ်။\n- မှာပြီး အလုပ်ရှုပ်သွားလို့ မေ့သွားတယ်။\n- နောက်ကျမယ် သိပေမဲ့ လာယူချိန်ကို ပြင်လို့ မရဘူး။\n- data — လာမယူတဲ့ အော်ဒါ 10 ခုမှာ 7 ခုက အစောဆုံး ရွေးလို့ရတဲ့ အချိန် (မှာပြီး 15 မိနစ်) ကို ရွေးထားတယ်။\n\n"
        cadence: line-by-line
      - {
          id: sel-data,
          type: editor.select,
          at: { mark: sel-data },
          target:
            {
              file: docs/next.md,
              text: "- data — လာမယူတဲ့ အော်ဒါ 10 ခုမှာ 7 ခုက အစောဆုံး ရွေးလို့ရတဲ့ အချိန် (မှာပြီး 15 မိနစ်) ကို ရွေးထားတယ်။",
              occurrence: 1,
            },
        }

  - id: v2
    narration: >
      [[mark:type-v2]] ဒီ အထောက်အထားတွေနဲ့ နောက် version မှာ လုပ်မယ့် စာရင်း တိုတို တစ်ခုကို ရေးပါမယ်။ ပထမ version
      ရဲ့ scope ကို ခွဲခဲ့တဲ့ မဖြစ်မနေ၊ ဖြစ်ရင်ကောင်း၊ ဒီတစ်ခါ မလုပ်ဘူး ဆိုတဲ့ ပုံစံအတိုင်းပါပဲ။
      [[mark:sel-change]] မဖြစ်မနေ စာရင်းရဲ့ ပထမ တစ်ခုက လာယူချိန်ကို ပြင်ခွင့် မရှိတဲ့ ပြဿနာအတွက်ပါ။ ဒုတိယ
      တစ်ခုကတော့ app က ချန်ထားခဲ့တဲ့ customer တွေအတွက်ပါ။ မေ့သွားတဲ့ ပြဿနာအတွက် သတိပေး SMS ကိုတော့ SMS ပို့ခ
      ကုန်လို့ ဖြစ်ရင်ကောင်း အောက်မှာ ထားပါတယ်။ [[mark:sel-wont]] delivery ကတော့ ဒီတစ်ခါ မလုပ်ဘူး ဆိုတဲ့ အောက်မှာ
      ဆက်ရှိနေပါတယ်။ ဘေးမှာ အကြောင်းရင်းကိုပါ ရေးထားတော့၊ နောက်တစ်ခေါက် တောင်းလာရင် ဒီ တစ်လရဲ့ အထောက်အထားက
      delivery ဘက်ကို မညွှန်ခဲ့ဘူး ဆိုတာ ပြလို့ ရပါတယ်။
    sources:
      - {
          title: "The Lean Startup: Principles (build–measure–learn, MVP, validated learning)",
          url: "https://theleanstartup.com/principles",
        }
      - {
          title: "The New SDLC (Burmese edition): Conclusion",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - id: type-v2
        type: editor.type
        at: { mark: type-v2 }
        target: { file: docs/next.md, after: "ကို ရွေးထားတယ်။\n\n", occurrence: 1 }
        text: "## v2 shortlist\nMust\n- လာယူချိန်ကို ပြင်တာ၊ အော်ဒါ ဖျက်တာ\n- ဖုန်းဟောင်း၊ စာလုံးကြီး setting၊ data နှေးတဲ့ ဖုန်းမှာ ပြန်စစ်ပြီး ပြင်တာ\nShould\n- လာယူချိန် မတိုင်ခင် သတိပေး SMS — customer က ကိုယ်တိုင် ရွေးမှ ပို့\n- အော်ဒါ အသင့်ဖြစ်ရင် SMS (v1 ရဲ့ Should)\nWon't (for now)\n- delivery — အထောက်အထား မရှိသေးဘူး\n\n"
        cadence: line-by-line
      - {
          id: expect-wont,
          type: expect.file,
          at: { afterAction: type-v2 },
          path: docs/next.md,
          contains: "- delivery — အထောက်အထား မရှိသေးဘူး",
        }
      - {
          id: sel-change,
          type: editor.select,
          at: { mark: sel-change },
          target: { file: docs/next.md, text: "- လာယူချိန်ကို ပြင်တာ၊ အော်ဒါ ဖျက်တာ", occurrence: 1 },
        }
      - {
          id: sel-wont,
          type: editor.select,
          at: { mark: sel-wont },
          target: { file: docs/next.md, text: "- delivery — အထောက်အထား မရှိသေးဘူး", occurrence: 1 },
        }

  - id: honest
    narration: >
      [[mark:sel-opt-in]] သတိပေး SMS စာကြောင်းရဲ့ နောက်ဆုံး အပိုင်းကိုလည်း သတိထား ကြည့်ပါ။ SMS ပို့မပို့ကို ဆိုင်က
      မဆုံးဖြတ်ဘဲ customer ကို ရွေးခိုင်းထားတာပါ။ [[mark:h-title]] customer က ဖုန်းနံပါတ်ကို အော်ဒါ အတွက်
      ပေးခဲ့တာပါ။ [[mark:h-do]] အဲဒီ နံပါတ်ကို ရည်ရွယ်ချက် အသစ်အတွက် သုံးမယ်ဆိုရင်၊ ဘာသိမ်းလဲ၊ ဘာအတွက် သုံးမလဲ
      ရှင်းရှင်း ပြောပြီး သူ ကိုယ်တိုင် ရွေးခွင့် ပေးရပါတယ်။ [[mark:h-dont]] ကိန်းဂဏန်း မြန်မြန် တက်ဖို့
      လှည့်စားတဲ့ နည်းတွေလည်း ရှိပါတယ်။ SMS လက်ခံမယ် ဆိုတဲ့ အကွက်ကို အမှန်ခြစ် ကြိုထားပေးတာ၊ မမှန်တဲ့ အချိန်
      ကန့်သတ်ချက်ကို ပြပြီး အလောတကြီး မှာခိုင်းတာ မျိုးပါ။ [[mark:h-me]] ဒီလို နည်းတွေကို agent က မိနစ်ပိုင်းနဲ့
      ထုတ်ပေးနိုင်ပါတယ်။ ဒါပေမဲ့ ဒီ နည်းတွေက customer ရဲ့ ယုံကြည်မှုကို ဖျက်ဆီးပါတယ်။ ဒါကြောင့် ဘာကို မဆောက်ဘူးလဲ
      ဆုံးဖြတ်တာက ကိုယ့်တာဝန်ပါ။
    sources:
      - {
          title: "FTC: Report Shows Rise in Sophisticated Dark Patterns Designed to Trick and Trap Consumers (2022)",
          url: "https://www.ftc.gov/news-events/news/press-releases/2022/09/ftc-report-shows-rise-sophisticated-dark-patterns-designed-trick-trap-consumers",
        }
      - {
          title: "GDPR Recital 32: Conditions for consent (pre-ticked boxes are not consent)",
          url: "https://gdpr-info.eu/recitals/no-32/",
        }
