        text: "## Next question for the owner\n- လာယူချိန် ပြင်ခွင့်နဲ့ သတိပေး SMS ကို တစ်လ စမ်းပြီး၊ လာမယူတဲ့ အော်ဒါ တစ်မနက် 5 ခု နဲ့ အောက် ကျမကျ ပြန်တိုင်းမလား။\n"
