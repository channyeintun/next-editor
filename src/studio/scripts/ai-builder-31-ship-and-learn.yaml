          upsertIds: [l-loop],
          drawMs: 900,
        }

  - id: numbers
    chapter: ကိန်းဂဏန်းတွေ ဘာပြောလဲ
    narration: >
      [[mark:n-title]] ဒါဆို ကြိုမှာ app ရဲ့ loop ပထမ အခေါက်ကို တိုင်းကြည့်ရအောင်။ ဥပမာ အနေနဲ့ ship လုပ်ပြီး တစ်လ
      ရှိပြီ၊ ဒီ ကိန်းဂဏန်းတွေ ရလာတယ် ဆိုပါစို့။ [[mark:n-leave]] မဝယ်ဘဲ ပြန်သွားတဲ့ customer က မနက်တိုင်း ၁၀
      ယောက်လောက်ကနေ ၄ ယောက်လောက်ကို ကျသွားပါတယ်။ ကောင်းလာပေမယ့် ပန်းတိုင်က ၃ ယောက်အောက် ဖြစ်လို့ မရောက်သေးပါဘူး။
      [[mark:n-pre]] ကြိုမှာတဲ့ အော်ဒါကတော့ တစ်မနက် ၂၃ ခုလောက် ရှိလို့ ပန်းတိုင်ကို ကျော်သွားပါပြီ။
      [[mark:n-skip]] ဒါပေမဲ့ problem ဖိုင်မှာ ပန်းတိုင် မထားခဲ့တဲ့ ကိန်းဂဏန်း တစ်ခုလည်း ပေါ်လာပါတယ်။ ကြိုမှာပြီး
      လာမယူတဲ့ အော်ဒါက ၃၀ ရာခိုင်နှုန်းလောက်၊ တစ်မနက် ခုနစ်ခုလောက် ရှိနေပါတယ်။ ကောင်တာက လှလှ က အသင့် ပြင်ထားတဲ့
      အော်ဒါတွေကို ဘယ်သူမှ လာမယူတော့၊ ဆိုင်က ငွေရော အချိန်ရော ဆုံးရှုံးနေပါတယ်။
    sources:
      - {
          title: "GOV.UK Service Manual: How to set performance metrics for your service",
          url: "https://www.gov.uk/service-manual/measuring-success/how-to-set-performance-metrics-for-your-service",
        }
      - {
          title: "The Lean Startup: Principles (build–measure–learn, MVP, validated learning)",
          url: "https://theleanstartup.com/principles",
        }
    actions:
      - {
          id: draw-n-title,
          type: whiteboard.apply,
          at: { mark: n-title },
          clear: true,
          upsertIds: [n-title],
        }
      - {
          id: draw-n-leave,
          type: whiteboard.apply,
          at: { mark: n-leave },
          upsertIds: [n-l1, n-b1a, n-t1a, n-b1b, n-t1b, n-g1],
          drawMs: 2400,
        }
      - {
          id: draw-n-pre,
          type: whiteboard.apply,
          at: { mark: n-pre },
          upsertIds: [n-l2, n-b2, n-t2, n-g2],
          drawMs: 1600,
        }
      - {
          id: draw-n-skip,
          type: whiteboard.apply,
          at: { mark: n-skip },
          upsertIds: [n-l3, n-g3, n-b3, n-t3],
          drawMs: 1600,
        }

  - id: learned
    narration: >
      [[mark:close-n]] ဒီ ကိန်းဂဏန်းတွေကို စာမျက်နှာ အသစ်မှာ မှတ်ထားပါမယ်။ [[mark:open-next]] ဒီ ဖိုင်က ပထမ
      version ကနေ ဘာသင်ခဲ့လဲ၊ နောက် version မှာ ဘာလုပ်မလဲ ရေးမယ့် နေရာပါ။ [[mark:type-learned]] ပထမ အပိုင်းမှာ
      ကိန်းဂဏန်း တစ်ခုစီကို ကြိုသတ်မှတ်ခဲ့တဲ့ ပန်းတိုင်နဲ့ ဘေးချင်းယှဉ်ပြီး ရေးပါတယ်။ ပန်းတိုင် မရောက်သေးတာကိုလည်း
      ရိုးရိုးသားသား ရေးထားတော့၊ ဆိုင်ပိုင်ရှင် ဖတ်တဲ့အခါ ဘာ ရောက်ပြီ၊ ဘာ မရောက်သေးဘူး ဆိုတာ တန်းမြင်ရပါတယ်။
      [[mark:sel-skip]] နောက်ဆုံး စာကြောင်းကို ကြည့်ပါ။ ငွေကို ကောင်တာမှာပဲ ချေမယ်လို့ ဆုံးဖြတ်ခဲ့တဲ့ decision
      record ADR နံပါတ် တစ် ထဲမှာ၊ လာမယူတဲ့ အော်ဒါ တစ်မနက် ငါးခုထက် များရင် ပြန်စဉ်းစားမယ်လို့ ရေးခဲ့ပါတယ်။ အခု
      ခုနစ်ခုလောက် ရှိနေတော့ ပြန်ကြည့်ရမယ့် အချိန် ရောက်ပါပြီ။
    sources:
      - {
          title: "GOV.UK Service Manual: How to set performance metrics for your service",
          url: "https://www.gov.uk/service-manual/measuring-success/how-to-set-performance-metrics-for-your-service",
        }
      - {
          title: "The New SDLC (Burmese edition): Conclusion",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - { id: close-n, type: whiteboard.apply, at: { mark: close-n }, open: false }
      - { id: open-next, type: workspace.openFile, at: { mark: open-next }, path: docs/next.md }
      - id: type-learned
        type: editor.type
        at: { mark: type-learned }
        target: { file: docs/next.md, after: "# Next · ကြိုမှာ app\n\n", occurrence: 1 }
        text: "## What we learned\n- မဝယ်ဘဲ ပြန်သွားတဲ့ customer — 10 ကနေ 4 ယောက် (ပန်းတိုင် 3 အောက်၊ မရောက်သေး)\n- ကြိုမှာတဲ့ အော်ဒါ — တစ်မနက် 23 (ပန်းတိုင် 20၊ ရောက်ပြီ)\n- ဖုန်းနဲ့ ကြိုမှာတာ — နည်းလာ (ပန်းတိုင်အတိုင်း)\n- လာမယူတဲ့ အော်ဒါ — 30%၊ တစ်မနက် 7 ခုလောက် (ADR-001 ရဲ့ 5 ခုကို ကျော်)\n\n"
        cadence: line-by-line
      - {
          id: expect-learned,
          type: expect.file,
          at: { afterAction: type-learned },
          path: docs/next.md,
          contains: "- လာမယူတဲ့ အော်ဒါ — 30%၊ တစ်မနက် 7 ခုလောက် (ADR-001 ရဲ့ 5 ခုကို ကျော်)",
        }
      - {
          id: sel-skip,
          type: editor.select,
          at: { mark: sel-skip },
          target:
            {
              file: docs/next.md,
              text: "- လာမယူတဲ့ အော်ဒါ — 30%၊ တစ်မနက် 7 ခုလောက် (ADR-001 ရဲ့ 5 ခုကို ကျော်)",
              occurrence: 1,
            },
        }

  - id: listen
    chapter: User တွေ လုပ်တာကို ကြည့်
    narration: >
      [[mark:u-title]] ကိန်းဂဏန်းက ဘာဖြစ်နေလဲ ပြပေမယ့်၊ ဘာကြောင့်လဲ ဆိုတာကိုတော့ မပြပါဘူး။ [[mark:u-src]] အဲဒါကို
      သိဖို့ ကောင်တာက လှလှ ရဲ့ မှတ်စုကို ဖတ်တာ၊ member အောင်အောင် နဲ့ ကျောင်းသား မောင်မောင် လို customer တွေနဲ့
      စကားပြောတာ၊ app ထဲက data ကို ကြည့်တာ စတာတွေ လုပ်ရပါတယ်။ [[mark:u-say]] ဒါပေမဲ့ user တွေ ပြောတာနဲ့ လုပ်တာ
      မတူတတ်ပါဘူး။ app ဘယ်လိုလဲ လို့ မေးရင် အများစုက ကောင်းပါတယ်လို့ ယဉ်ယဉ်ကျေးကျေး ဖြေကြပါတယ်။ [[mark:u-do]] data
      ကို ကြည့်တော့ customer အသစ် တချို့က တစ်ခါပဲ မှာပြီး ရပ်သွားကြပါတယ်။ အဲဒီ လူတွေကို လှလှ က တန်းထဲမှာ
      ပြန်တွေ့နေရပါတယ်။ member အောင်အောင် ကတော့ မနက်တိုင်း app နဲ့ မှာနေပြီး ဖုန်း မဆက်တော့ပါဘူး။ လှလှ ရဲ့
      မှတ်စုမှာလည်း တချို့က ဖုန်းကို သူ့ဆီ ပေးပြီး မှာပေးခိုင်းကြတယ်လို့ ပါပါတယ်။ သူတို့ တစ်ယောက်မှ app အကြောင်း
      မကျေနပ်ကြောင်း မပြောခဲ့ပါဘူး။ [[mark:u-rule]] ဒါကြောင့် ပြောတာထက် လုပ်တာကို ပိုယုံပါ။ ship မလုပ်ခင်က user
      တွေကို ပြီးခဲ့တဲ့ နေ့အကြောင်း မေးခဲ့သလိုပဲ၊ ship ပြီးနောက်မှာလည်း သူတို့ တကယ် ဘာလုပ်ခဲ့လဲ ဆိုတာက
      အခိုင်မာဆုံး အထောက်အထားပါ။
    sources:
      - {
          title: "Nielsen Norman Group: First Rule of Usability? Don't Listen to Users",
          url: "https://www.nngroup.com/articles/first-rule-of-usability-dont-listen-to-users/",
        }
      - {
          title: "The Lean Startup: Principles (build–measure–learn, MVP, validated learning)",
          url: "https://theleanstartup.com/principles",
        }
    actions:
      - {
          id: draw-u-title,
          type: whiteboard.apply,
          at: { mark: u-title },
          open: true,
          clear: true,
