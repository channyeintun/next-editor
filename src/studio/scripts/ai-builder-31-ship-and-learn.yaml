  - id: next-question
    narration: >
      [[mark:close-h]] ဒါဆို ဒီ ဖိုင်ရဲ့ နောက်ဆုံး အပိုင်းကို ရေးရအောင်။ [[mark:type-question]] ဒီ အပိုင်းမှာ
      ဆိုင်ပိုင်ရှင် ကို မေးမယ့် မေးခွန်း တစ်ခုပဲ ပါပါတယ်။ နောက် version တစ်ခုလုံးကို တစ်ခါတည်း မဆောက်ဘဲ၊
      loop ကို နောက်တစ်ခေါက် ပိုသေးသေး၊ ပိုမြန်မြန် ပတ်ဖို့ သူ့ ဆုံးဖြတ်ချက်ကို တောင်းတာပါ။ [[mark:sel-question]]
      ဘာကို ဘယ်လောက် ကြာကြာ စမ်းမလဲ၊ ဘယ် ကိန်းဂဏန်းနဲ့ ပြန်စစ်မလဲ ဆိုတာ ပါတော့၊ နောက်လ ဒီ ဖိုင်ကို ပြန်ဖွင့်တဲ့အခါ
      ဆက်ဆုံးဖြတ်လို့ ရပါတယ်။ ကောင်တာမှာ ငွေချေတဲ့ ဆုံးဖြတ်ချက်ကို ပြန်စဉ်းစားတာကလည်း အဲဒီ ရလဒ်ကို မြင်ပြီးမှ
      လုပ်ပါမယ်။
    sources:
      - {
          title: "The Lean Startup: Principles (build–measure–learn, MVP, validated learning)",
          url: "https://theleanstartup.com/principles",
