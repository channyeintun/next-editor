build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 6131
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}
scenes:
  - id: recall
    chapter: Ship ပြီးမှ စ သင်ရတာ
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ ကိုယ့် တကယ့် ထွက်ကုန်က app တစ်ခုတည်း မဟုတ်ဘဲ app ကို ထုတ်ပေးတဲ့ စက်ရုံ၊ factory
      ဖြစ်တယ် ဆိုတာနဲ့၊ app ကို ဆက်ပြင်၊ ဆက်ထိန်းရတဲ့ maintenance ကို ကြည့်ခဲ့ပါတယ်။ ဒီနေ့တော့ course ရဲ့
      အပိုင်းကြီး ရှစ်ပိုင်းထဲက နောက်ဆုံး module၊ product နဲ့ ကြီးထွားခြင်း အပိုင်းကို ရောက်ပါပြီ။
      [[mark:r-users]] ship လုပ်တယ် ဆိုတာ app ကို customer တွေ တကယ် သုံးလို့ရအောင် ထုတ်ပေးတာပါ။ ကြိုမှာ app လည်း
      customer တွေ လက်ထဲ ရောက်နေပါပြီ။ ဒါဆို app အလုပ်ဖြစ်မဖြစ် ဘယ်သူ ဆုံးဖြတ်မလဲ။ ကိုယ်လည်း မဟုတ်၊ agent လည်း
      မဟုတ်ဘဲ၊ နေ့တိုင်း သုံးနေတဲ့ user တွေပါ။ [[mark:open-problem]] ဒါကြောင့် ကိုယ်တို့ ပထမဆုံး ရေးခဲ့တဲ့ problem
      ဖိုင်ကို ပြန်ဖွင့်ကြည့်ရအောင်။ [[mark:sel-know]] ဒီ အပိုင်းမှာ ပြဿနာ ပြေပြီလား ဆိုတာကို ကိန်းဂဏန်းနဲ့
      ကြိုသတ်မှတ်ခဲ့ပါတယ်။ app ကို ship လုပ်ပြီးသွားတာက ပန်းတိုင် မဟုတ်ပါဘူး။ ဒီ ကိန်းဂဏန်းတွေ တကယ် ပြောင်းသွားမှ
      ဆိုင်ပိုင်ရှင် ရဲ့ ပြဿနာ ပြေတာပါ။
    sources:
      - {
          title: "The New SDLC (Burmese edition): Conclusion",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "GOV.UK Service Manual: How to set performance metrics for your service",
          url: "https://www.gov.uk/service-manual/measuring-success/how-to-set-performance-metrics-for-your-service",
        }
    actions:
      - {
          id: open-problem,
          type: workspace.openFile,
          at: { mark: open-problem },
          path: docs/problem.md,
        }
      - {
          id: sel-know,
          type: editor.select,
          at: { mark: sel-know },
          target:
            {
              file: docs/problem.md,
              text: "- မဝယ်ဘဲ ပြန်သွားတဲ့ customer — တစ်မနက် 3 ယောက်အောက်\n- ကြိုမှာတဲ့ အော်ဒါ — တစ်မနက် 20 နဲ့ အထက်\n- ဖုန်းနဲ့ ကြိုမှာတာ — တဖြည်းဖြည်း နည်းလာ\n",
              occurrence: 1,
            },
        }

  - id: loop
    narration: >
      [[mark:l-title]] ship လုပ်တာက အလုပ်ရဲ့ အဆုံး မဟုတ်ဘဲ သင်ယူတာရဲ့ အစပါ။ customer တွေ တကယ် မသုံးခင်အထိ app က
      ပြဿနာကို ဖြေရှင်းမယ် ဆိုတာ ခန့်မှန်းချက် တစ်ခုပဲ ဖြစ်နေလို့ပါ။ [[mark:l-build]] ပထမ အဆင့်က ပြဿနာ တကယ်
      ပြေမပြေ စမ်းနိုင်တဲ့ အသေးဆုံး version ကို ဆောက်ပြီး ship လုပ်တာပါ။ [[mark:l-measure]] ဒုတိယ အဆင့်က
      တိုင်းတာပါ။ ပြဿနာ ပြေမပြေ တိုင်းတဲ့ ကိန်းဂဏန်းကို metric လို့ ခေါ်ပါတယ်။ metric အပြင် user တွေ ဘာလုပ်လဲ၊
      ဘာပြောလဲ ဆိုတာကိုလည်း စုရပါတယ်။ [[mark:l-learn]] တတိယ အဆင့်ကတော့ အဲဒီ အထောက်အထားကို ကြည့်ပြီး၊ app ရဲ့
      လုပ်ဆောင်ချက် တစ်ခု၊ feature တစ်ခုကို ဆက်ထားမလား၊ ပြင်မလား၊ ဖယ်မလား ဆုံးဖြတ်တာပါ။ [[mark:l-loop]] ပြီးရင်
      build ကို ပြန်သွားပါတယ်။ ဒီ ပတ်လမ်းကို build measure learn loop လို့ ခေါ်ပါတယ်။ တစ်ခေါက်ချင်းကို သေးသေး၊
      မြန်မြန် ပတ်လေ၊ ခန့်မှန်းချက် မှားနေတာကို စောစော သိလေ ဖြစ်ပါတယ်။
    sources:
      - {
          title: "The Lean Startup: Principles (build–measure–learn, MVP, validated learning)",
          url: "https://theleanstartup.com/principles",
        }
      - {
          title: "The New SDLC (Burmese edition): Conclusion",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: open-board-l,
          type: whiteboard.apply,
          at: { mark: l-title },
          open: true,
          clear: true,
          upsertIds:
            [
              m-b1,
              m-n1,
              m-b2,
              m-n2,
              m-b3,
              m-n3,
              m-b4,
              m-n4,
              m-b5,
              m-n5,
              m-b6,
              m-n6,
              m-b7,
              m-n7,
              m-b8,
              m-n8,
              l-title,
            ],
        }
      - {
          id: draw-l-build,
          type: whiteboard.apply,
          at: { mark: l-build },
          upsertIds: [l-b-box, l-b],
          drawMs: 1000,
        }
      - {
          id: draw-l-measure,
          type: whiteboard.apply,
          at: { mark: l-measure },
          upsertIds: [l-a1, l-m-box, l-m, l-m-note],
          drawMs: 1600,
        }
      - {
          id: draw-l-learn,
          type: whiteboard.apply,
