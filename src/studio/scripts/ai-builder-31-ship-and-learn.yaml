  - id: recap
    chapter: ပြန်ချုပ်ရရင်
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ ship လုပ်တာက သင်ယူတာရဲ့ အစ ဖြစ်ပြီး၊ problem ဖိုင်မှာ ကြိုရေးခဲ့တဲ့ ကိန်းဂဏန်းတွေနဲ့
      app ကို ပြန်စစ်ရပါတယ်။ [[mark:rc-learned]] ပန်းတိုင် မရောက်သေးတာကိုလည်း ရိုးရိုးသားသား ရေးပါ။
      [[mark:rc-why]] user တွေ ပြောတာထက် လုပ်တာကို ပိုယုံပြီး၊ အလုပ်ကြီး မဆောက်ခင် အကြောင်းရင်းကို အရင် ရှာပါ။
      [[mark:rc-left-out]] app က ချန်ထားခဲ့တဲ့ user တွေကို တမင် ရှာပြီး၊ customer ကိုလည်း မလှည့်စားပါနဲ့။
      [[mark:rc-next]] ပြီးရင် loop ကို နောက်တစ်ခေါက် ပိုသေးသေး၊ ပိုမြန်မြန် ပတ်ပါ။ နောက်ဆုံး lesson မှာတော့
      course တစ်ခုလုံးကို ပြန်ကြည့်ပြီး၊ ကိုယ်ပိုင် project ကို ဘယ်လို စမလဲ ဆိုတဲ့ plan ကို ရေးသွားပါမယ်။
    sources:
