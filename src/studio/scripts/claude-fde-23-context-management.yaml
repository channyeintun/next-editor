      reply-assistant/src/kb-audit.ts: |
        import Anthropic from "@anthropic-ai/sdk";

        const client = new Anthropic();
        type AuditRequest = Parameters<typeof client.beta.messages.create>[0];

        // The same instructions on every step of the audit, word for word.
        const AUDIT_PROMPT = `You audit Naychi Fiber's Knowledge base, one article per step.
        Read the article, compare it with the current plans and troubleshooting notes,
        and record a finding: up to date, needs an edit, or retire.`; // shortened: the real prompt is longer

        // One step of the audit's agent loop over all 340 articles.
        export async function auditStep(tools: AuditRequest["tools"], messages: AuditRequest["messages"]) {
          const response = await client.beta.messages.create({
            model: "claude-opus-5-5", // ID as of 2026-11
            max_tokens: 16000,
            tools,
            messages,
          });
          console.log(response.usage.cache_read_input_tokens, response.usage.cache_creation_input_tokens);
          return response;
        }
