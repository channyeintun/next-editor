scenes:
  - id: open
    chapter: "Component နဲ့ dependency သုံးခု"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ Testing Library နဲ့ ဆိုင်ရဲ့ form ကို customer သုံးသလို
      စစ်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ အဲဒီ နည်းကိုပဲ သုံးပြီး React component တစ်ခုကို test လုပ်ကြည့်ပါမယ်။
      [[mark:draw-list]] component ရဲ့ နာမည်က MenuList ဖြစ်ပြီး၊ ဆိုင်ရဲ့ ဟင်းလျာ စာရင်းကို ပြပါတယ်။ ဒီ
      component က သူ့ဘာသာတင် အလုပ်လုပ်တာ မဟုတ်ဘဲ၊ တခြား အရာ သုံးခုကို မှီခိုနေပါတယ်။ ဒီလို
      မှီခိုရတဲ့ အရာတွေကို dependency လို့ ခေါ်တာ မှတ်မိမှာပါ။ [[mark:draw-network]] ပထမ dependency
      က network ပါ။ MenuList က menu ကို server ကနေ fetch နဲ့ ယူပါတယ်။ test ထဲမှာ တကယ့် network ကို
      သုံးရင် နှေးနိုင်၊ ကျနိုင်ပြီး၊ server မရှိရင်တော့ လုံးဝ အလုပ်မလုပ်ပါဘူး။ [[mark:draw-row]]
      ဒုတိယက MenuRow ဆိုတဲ့ child component ပါ။ item တစ်ခုချင်းကို သူက ပြပေးပြီး၊ သူ့မှာ သူ့ ကိုယ်ပိုင်
      အလုပ်တွေ ရှိနိုင်ပါတယ်။ [[mark:draw-context]] တတိယက OrderContext ပါ။ ထည့်မယ် ခလုတ် နှိပ်ရင်
      ခေါ်ရမယ့် function ကို app ထဲမှာ parent component က context ကနေ ပေးထားပါတယ်။ test မှာတော့
      အဲဒီ parent မပါပါဘူး။ [[mark:draw-tools]] ဒါကြောင့် dependency တစ်ခုစီကို test အတွက် တစ်နည်းစီနဲ့
      အစားထိုးပါမယ်။ fetch ကို stub Global နဲ့ အတုလုပ်၊ MenuRow ကို vi mock နဲ့ module အတုနဲ့ လဲပြီး၊
      context ကိုတော့ test က ကိုယ်တိုင် ပေးပါမယ်။
    sources:
      - {
          title: "web.dev Learn Testing: Component testing in practice, the component under test",
          url: "https://web.dev/learn/testing/get-started/component-testing",
        }
      - {
          title: "web.dev Learn Testing: Appendix, React as a component model",
          url: "https://web.dev/learn/testing/appendix#react",
        }
      - { title: "Vitest: Mocking", url: "https://vitest.dev/guide/mocking" }
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 300000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-list
        type: whiteboard.apply
        at: { mark: draw-list }
        upsertIds: [a-list-box, a-list]
        drawMs: 1500
      - id: draw-network
        type: whiteboard.apply
        at: { mark: draw-network }
        upsertIds: [a-arrow-1, a-net-box, a-net-1, a-net-2]
        drawMs: 2500
      - id: draw-row
        type: whiteboard.apply
        at: { mark: draw-row }
        upsertIds: [a-arrow-2, a-row-box, a-row-1, a-row-2]
        drawMs: 2500
      - id: draw-context
        type: whiteboard.apply
        at: { mark: draw-context }
        upsertIds: [a-arrow-3, a-ctx-box, a-ctx-1, a-ctx-2]
        drawMs: 2500
      - id: draw-tools
        type: whiteboard.apply
        at: { mark: draw-tools }
        upsertIds:
          [
            a-arrow-4,
            a-stub-1,
            a-stub-2,
            a-arrow-5,
            a-mock-1,
            a-mock-2,
            a-arrow-6,
            a-ctx-tool-1,
            a-ctx-tool-2,
          ]
        drawMs: 4500

  - id: starter
    narration: >
      ဒါဆို MenuList ရဲ့ code ကို ကြည့်ရအောင်။ ဒါက component ဖိုင်ပါ။ [[mark:select-fetch]] use Effect
      ထဲမှာ component ပေါ်လာတာနဲ့ server ကနေ menu ကို fetch နဲ့ ယူပြီး၊ ရလာတဲ့ item တွေကို state ထဲ
      ထည့်ပါတယ်။ ဒီလို use Effect ထဲမှာ fetch ကို တိုက်ရိုက် ခေါ်တာက React က အကြံပြုတဲ့ ပုံစံ မဟုတ်ပေမဲ့၊
      ရှိပြီးသား code တွေထဲမှာ ခဏခဏ တွေ့ရလို့ ဒီလို component ကို test လုပ်တတ်ဖို့ လိုပါတယ်။
      [[mark:select-context]] use Context ကတော့ OrderContext ထဲကနေ အော်ဒါထဲကို item ထည့်ပေးတဲ့ function ကို ယူပါတယ်။ [[mark:select-row]] item တစ်ခုချင်းအတွက် MenuRow ကို ပြပြီး၊ ဘေးက ထည့်မယ် ခလုတ်ကို
      နှိပ်ရင် item ရဲ့ id နဲ့ အဲဒီ function ကို ခေါ်ပါတယ်။ [[mark:open-row]] MenuRow ဖိုင်ကိုလည်း
      ကြည့်ရအောင်။ [[mark:select-span]] row တစ်ခုက item ရဲ့ နာမည်နဲ့ ဈေးနှုန်းကို span တစ်ခုတည်းထဲမှာ
      တွဲ ပြပါတယ်။ [[mark:open-context]] OrderContext ဖိုင်ကိုလည်း ဖွင့်ကြည့်ရအောင်။ [[mark:select-default]] context ရဲ့
      default တန်ဖိုး အဖြစ် ဘာမှ မလုပ်တဲ့ function ကို ထားထားပါတယ်။ parent က တန်ဖိုး မပေးရင် component
      က ဒါကို ရပါတယ်။ [[mark:open-test]] အခု test ဖိုင်ကို ကြည့်ရအောင်။ [[mark:select-stub]] ဒီ project
      မှာ test တစ်ခုမှ တကယ့် server ကို မရောက်စေရဘူး ဆိုတဲ့ စည်းကမ်း ထားပါတယ်။ ဒါကြောင့် before Each
      မှာ fetch ကို mock function နဲ့ stub လုပ်ပြီး၊ request တိုင်းကို ဟင်းလျာ မပါတဲ့ menu အလွတ်နဲ့
      ပြန်ဖြေခိုင်းထားပါတယ်။ [[mark:why-stub]] ဒီလို မလုပ်ရင် happy dom က fetch ကို တကယ့် network
      request အဖြစ် ပို့ပါတယ်။ request မအောင်ရင် Vitest က unhandled error အဖြစ် ပြလို့၊ test အားလုံး
      pass ဖြစ်နေရင်တောင် run တစ်ခုလုံး fail ဖြစ်သွားမှာပါ။ [[mark:select-unstub]] after Each ကတော့ test
      တစ်ခု ပြီးတိုင်း stub ကို ပြန်ဖြုတ်ပေးလို့၊ နောက် test ထဲကို မပါသွားပါဘူး။ [[mark:select-quick]]
      ရှိနေတဲ့ test တစ်ခုကတော့ component ကို render လုပ်ပြီး၊ ဟင်းလျာ စာရင်း ဆိုတဲ့ ခေါင်းစဉ်
      ပေါ်လာလား စစ်ပါတယ်။ find By Text က element ပေါ်လာတဲ့အထိ စောင့်ပြီး ရှာပေးပါတယ်။
    sources:
      - {
          title: "web.dev Learn Testing: Component testing, write a quick test",
          url: "https://web.dev/learn/testing/get-started/component-testing",
        }
      - {
          title: "Vitest: Mocking Globals (facts B02)",
          url: "https://vitest.dev/guide/mocking/globals",
        }
      - {
          title: "Vitest: vi.stubGlobal and vi.unstubAllGlobals",
          url: "https://vitest.dev/api/vi#vi-stubglobal",
        }
      - {
          title: "react.dev: useContext, the default value",
          url: "https://react.dev/reference/react/useContext",
        }
      - {
          title: "Testing Library: Async methods (findBy)",
          url: "https://testing-library.com/docs/dom-testing-library/api-async",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: select-fetch
        type: editor.select
        at: { mark: select-fetch }
        target:
          {
            file: src/MenuList.jsx,
            text: "useEffect(() => {\n    fetch(\"/api/menu\")\n      .then((response) => response.json())\n      .then((menu) => setItems(menu));\n  }, []);",
            occurrence: 1,
          }
      - id: select-context
        type: editor.select
        at: { mark: select-context }
        target:
          {
            file: src/MenuList.jsx,
            text: "const { addItem } = useContext(OrderContext);",
            occurrence: 1,
          }
      - id: select-row
        type: editor.select
        at: { mark: select-row }
        target:
          {
            file: src/MenuList.jsx,
            text: "<MenuRow item={item} />\n            <button type=\"button\" onClick={() => addItem(item.id)}>",
            occurrence: 1,
          }
      - id: open-row
        type: workspace.openFile
        at: { mark: open-row }
        path: src/MenuRow.jsx
      - id: select-span
        type: editor.select
        at: { mark: select-span }
        target:
          {
            file: src/MenuRow.jsx,
            text: "return <span>{`${item.name} ${price} ကျပ်`}</span>;",
            occurrence: 1,
          }
      - id: open-context
        type: workspace.openFile
        at: { mark: open-context }
        path: src/OrderContext.js
      - id: select-default
        type: editor.select
        at: { mark: select-default }
        target:
          { file: src/OrderContext.js, text: "createContext({ addItem: () => {} })", occurrence: 1 }
      - id: open-test
        type: workspace.openFile
        at: { mark: open-test }
        path: src/MenuList.test.jsx
      - id: select-stub
        type: editor.select
        at: { mark: select-stub }
        target:
          {
            file: src/MenuList.test.jsx,
            text: "const fetchMenu = vi.fn();\nbeforeEach(() => {\n  fetchMenu.mockResolvedValue({ json: async () => [] });\n  vi.stubGlobal(\"fetch\", fetchMenu);\n});",
            occurrence: 1,
          }
      - id: select-unstub
        type: editor.select
        at: { mark: select-unstub }
        target:
          {
            file: src/MenuList.test.jsx,
            text: "afterEach(() => vi.unstubAllGlobals());",
            occurrence: 1,
          }
      - id: select-quick
        type: editor.select
        at: { mark: select-quick }
        target:
          {
            file: src/MenuList.test.jsx,
            text: "render(<MenuList />);\n  expect(await screen.findByText(\"ဟင်းလျာ စာရင်း\")).toBeInTheDocument();",
            occurrence: 1,
          }

  - id: panel
    narration: >
      [[mark:ready]] ညာဘက် panel မှာ test တစ်ခု pass ဖြစ်နေပါတယ်။ ဒီ lesson မှာ component ကို preview ထဲမှာ
      မပြဘဲ၊ test တွေကပဲ happy dom ရဲ့ page ပေါ်မှာ render လုပ်ပြီး စစ်ပါမယ်။ panel ကတော့ အရင်လိုပဲ code
      ပြောင်းတိုင်း Vitest က ပြန် run ပြီး ပြတဲ့ ရလဒ်ပါ။
    sources:
      - { title: "Vitest: Getting Started", url: "https://vitest.dev/guide/" }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-start-pass
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1000 }
      - id: expect-start-one
        type: expect.preview
        at: { afterAction: expect-start-pass }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "1" }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: quick-test
    narration: >
      ဒီ test က pass ဖြစ်တော့ ဖြစ်ပါတယ်။ ဒါပေမဲ့ သေချာ စဉ်းစားကြည့်ရင် ခေါင်းစဉ် ရှိလား ဆိုတာ တစ်ခုပဲ
      သိရပါတယ်။ menu ကို server ကနေ ယူလား၊ item တွေ ပြလား၊ ခလုတ် အလုပ်လုပ်လား ဆိုတာကို ဘာမှ
      မစစ်ရသေးပါဘူး။ [[mark:quick-warning]] ဒီလို test တစ်ခုတည်းနဲ့ panel က အစိမ်းရောင် ပြနေရင်၊ team
      ထဲက တခြားသူတွေက ဒီ component ကို စစ်ပြီးသားလို့ ယုံသွားနိုင်လို့ သတိထားရပါတယ်။
    sources:
      - {
          title: "web.dev Learn Testing: Component testing, write a quick test (render-only tests can mislead)",
          url: "https://web.dev/learn/testing/get-started/component-testing",
        }
    actions: []

  - id: mock-fetch
    chapter: "Fetch ကို stub လုပ်ရအောင်"
    narration: >
      [[mark:type-list]] ဒါဆို server က menu ပြန်ပေးတဲ့အခါ item တွေ ပြလား စစ်တဲ့ test ကို ရေးကြည့်ရအောင်။
      ဒီ test ထဲမှာ fetch ရဲ့ အဖြေကို ကိုယ် လိုချင်တဲ့ data နဲ့ ပြောင်းပေးပါမယ်။ [[mark:select-answer]] ဒီ
      test မှာတော့ mock Resolved Value နဲ့ fetch က လက်ဖက်ရည်နဲ့ ကော်ဖီ ပါတဲ့ menu ကို ပြန်ပေးခိုင်းပါတယ်။
      component က response ရဲ့ json ကိုပဲ ခေါ်တဲ့အတွက်၊ json function တစ်ခု ပါတဲ့ object နဲ့
      လုံလောက်ပါတယ်။ [[mark:select-find]] fetch ရဲ့ အဖြေက နောက်မှ ရောက်လာတာ ဖြစ်လို့၊ item တွေက
      render လုပ်ပြီးပြီးချင်း မပေါ်သေးပါဘူး။ ဒါကြောင့် find By Text နဲ့ လက်ဖက်ရည် ဆိုတဲ့ စာ ပါတဲ့
      element ပေါ်လာတဲ့အထိ စောင့်ပါတယ်။ [[mark:select-called]] နောက်ဆုံးမှာ fetch ကို menu ရဲ့
      လမ်းကြောင်းနဲ့ ခေါ်ခဲ့လား ဆိုတာကို to Have Been Called With နဲ့ စစ်ပါတယ်။ [[mark:read-list]] panel
      မှာ test နှစ်ခုလုံး pass ဖြစ်နေပါတယ်။ server မလိုဘဲ၊ test က ပေးလိုက်တဲ့ data နဲ့ပဲ list ကို
      စစ်လို့ ရသွားပါပြီ။
    sources:
      - {
          title: "web.dev Learn Testing: Component testing, mock fetch()",
          url: "https://web.dev/learn/testing/get-started/component-testing",
        }
      - { title: "Vitest: mockResolvedValue", url: "https://vitest.dev/api/mock#mockresolvedvalue" }
      - {
          title: "Vitest: toHaveBeenCalledWith",
          url: "https://vitest.dev/api/expect#tohavebeencalledwith",
        }
    actions:
      - id: type-list
        type: editor.type
        at: { mark: type-list }
        target:
          {
            file: src/MenuList.test.jsx,
            after: "  expect(await screen.findByText(\"ဟင်းလျာ စာရင်း\")).toBeInTheDocument();\n});\n",
            occurrence: 1,
          }
        text: "\ntest(\"lists the menu from the server\", async () => {\n  fetchMenu.mockResolvedValue({\n    json: async () => [\n      { id: \"tea\", name: \"လက်ဖက်ရည်\", price: 1500 },\n      { id: \"coffee\", name: \"ကော်ဖီ\", price: 1800 },\n    ],\n  });\n\n  render(<MenuList />);\n\n  expect(await screen.findByText(/လက်ဖက်ရည်/)).toBeInTheDocument();\n  expect(fetchMenu).toHaveBeenCalledWith(\"/api/menu\");\n});\n"
        # One block, then selects (pilot note 1).
        cadence: block
      - id: expect-list-passed
        type: expect.preview
        at: { afterAction: type-list }
        timeoutMs: 8000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "2" }
        retry: { maxAttempts: 3, delayMs: 2000 }
      - id: expect-list-name
        type: expect.preview
        at: { afterAction: expect-list-passed }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-2 }
        attribute: { name: data-name, value: "lists the menu from the server" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-answer
        type: editor.select
        at: { mark: select-answer }
        target:
          {
            file: src/MenuList.test.jsx,
            text: "fetchMenu.mockResolvedValue({\n    json: async () => [\n      { id: \"tea\", name: \"လက်ဖက်ရည်\", price: 1500 },\n      { id: \"coffee\", name: \"ကော်ဖီ\", price: 1800 },\n    ],\n  });",
            occurrence: 1,
          }
      - id: select-find
        type: editor.select
        at: { mark: select-find }
        target:
          {
            file: src/MenuList.test.jsx,
            text: "expect(await screen.findByText(/လက်ဖက်ရည်/)).toBeInTheDocument();",
            occurrence: 1,
          }
      - id: select-called
        type: editor.select
        at: { mark: select-called }
        target:
          {
            file: src/MenuList.test.jsx,
            text: 'expect(fetchMenu).toHaveBeenCalledWith("/api/menu");',
            occurrence: 1,
          }

  - id: mock-child
    chapter: "Child component ကို mock လုပ်ရအောင်"
    narration: >
      [[mark:type-exact]] အခု list ထဲမှာ ကော်ဖီ ဆိုတဲ့ နာမည် ပါရမယ်လို့ အတိအကျ စစ်တဲ့ line တစ်ကြောင်း
      ထပ်ထည့်ကြည့်ရအောင်။ server က ပို့တဲ့ နာမည်တွေကို ပြတာက MenuList ရဲ့ အလုပ်ပါ။ [[mark:read-exact]]
      ဒီ line က ကော်ဖီ ဆိုတဲ့ စာ အတိအကျ ပါတဲ့ element ကို ရှာပြီး၊ page ထဲမှာ ရှိလား စစ်တာပါ။ panel ကို
      ကြည့်ပါ။ test က ကျသွားပြီး၊ ကော်ဖီ ဆိုတဲ့ စာနဲ့ element ကို ရှာမတွေ့ဘူးလို့ Testing Library က
      ပြောနေပါတယ်။ [[mark:read-dom]] Testing Library က ရှာမတွေ့ရင် သူ မြင်ခဲ့တဲ့ page ကို message
      ထဲမှာ ထုတ်ပြပေးပါတယ်။ ကြည့်လိုက်ရင် row တစ်ခုချင်းမှာ နာမည်နဲ့ ဈေးနှုန်းကို span တစ်ခုတည်းထဲမှာ
      တွဲ ပြထားလို့၊ ကော်ဖီ ဆိုတဲ့ စာ သက်သက် ပါတဲ့ element မရှိတာပါ။ ဒါက MenuRow ရဲ့ ပုံစံပါ။ ဆိုလိုတာက MenuList ရဲ့ test က MenuRow ဘယ်လို ပြလဲ
      ဆိုတာပါ သိနေရပါတယ်။ MenuRow က stock ကို server ကနေ ထပ်ယူတာမျိုး ကိုယ်ပိုင် အလုပ်တွေ လုပ်လာရင်လည်း
      ဒီ test ကို ထိခိုက်ပါလိမ့်မယ်။ [[mark:type-mock]] ဒါကြောင့် ဖိုင်ရဲ့ အပေါ်ပိုင်းမှာ vi mock နဲ့ MenuRow
      module ကို အတုနဲ့ လဲလိုက်ပါမယ်။ အတု MenuRow က item ရဲ့ နာမည်ကိုပဲ ပြပါတယ်။ [[mark:read-mock]]
      panel ကို ကြည့်ပါ။ test နှစ်ခုလုံး pass ပြန်ဖြစ်သွားပြီး၊ ကော်ဖီ ဆိုတဲ့ နာမည်ကို အတိအကျ
      ရှာတွေ့သွားပါပြီ။ [[mark:select-mock]] vi mock ကို ပထမဆုံး သုံးခဲ့တဲ့ lesson မှာ ပြောခဲ့သလို၊ သူ့ကို
      test တွေရဲ့ အပြင်၊ ဖိုင်ရဲ့ အပေါ်ဆုံး အဆင့်မှာ ရေးရပါတယ်။ Vitest က သူ့ကို import တွေထက် အရင် run
      အောင် ရွှေ့ပေးလို့၊ MenuList က MenuRow ကို import လုပ်တဲ့အခါ အတုကို ရသွားတာပါ။ MenuRow အစစ်ကိုတော့ သူ့ ကိုယ်ပိုင် test ဖိုင်မှာ သီးသန့် စစ်ရပါမယ်။
    sources:
      - {
          title: "web.dev Learn Testing: Component testing, mock imports",
          url: "https://web.dev/learn/testing/get-started/component-testing",
        }
      - { title: "Vitest: Mocking Modules", url: "https://vitest.dev/guide/mocking/modules" }
      - {
          title: "Vitest: Migration guide, vi.mock must be top level (facts A17)",
          url: "https://vitest.dev/guide/migration/",
        }
      - { title: "Testing Library: ByText", url: "https://testing-library.com/docs/queries/bytext" }
    actions:
      - id: type-exact
        type: editor.type
        at: { mark: type-exact }
        target:
          {
            file: src/MenuList.test.jsx,
            after: "  expect(fetchMenu).toHaveBeenCalledWith(\"/api/menu\");\n",
            occurrence: 1,
          }
        text: "  expect(screen.getByText(\"ကော်ဖီ\")).toBeInTheDocument();\n"
      - id: expect-exact-fail
        type: expect.preview
        at: { afterAction: type-exact }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 3, delayMs: 2000 }
      - id: expect-exact-name
        type: expect.preview
        at: { afterAction: expect-exact-fail }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-name, value: TestingLibraryElementError }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-exact-message
        type: expect.preview
        at: { afterAction: expect-exact-name }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        textContains: "Unable to find an element with the text: ကော်ဖီ."
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-exact-dom
        type: expect.preview
        at: { afterAction: expect-exact-message }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        textContains: "လက်ဖက်ရည် 1,500 ကျပ်"
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: type-mock
        type: editor.type
        at: { mark: type-mock }
        target:
          {
            file: src/MenuList.test.jsx,
            after: "import { OrderContext } from \"./OrderContext.js\";\n",
            occurrence: 1,
          }
        text: "\nvi.mock(\"./MenuRow.jsx\", () => ({\n  MenuRow: ({ item }) => <span>{item.name}</span>,\n}));\n"
        cadence: block
      - id: expect-mock-pass
        type: expect.preview
        at: { afterAction: type-mock }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 2000 }
      - id: expect-mock-two
        type: expect.preview
        at: { afterAction: expect-mock-pass }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "2" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-mock
        type: editor.select
        at: { mark: select-mock }
        target:
          {
            file: src/MenuList.test.jsx,
            text: "vi.mock(\"./MenuRow.jsx\", () => ({\n  MenuRow: ({ item }) => <span>{item.name}</span>,\n}));",
            occurrence: 1,
          }

  - id: context
    chapter: "Context ကို test က ပေးရအောင်"
    narration: >
      [[mark:type-click]] နောက်ဆုံး test က ထည့်မယ် ခလုတ်ကို နှိပ်ရင် အော်ဒါထဲကို item ထည့်လား စစ်ပါမယ်။
      item ထည့်တဲ့ function အစား vi fn နဲ့ mock function တစ်ခု ဆောက်ထားပြီး၊ ခလုတ်ကို user event နဲ့ နှိပ်ပါတယ်။ ပြီးရင် အဲဒီ mock function ကို tea ဆိုတဲ့ id နဲ့ ခေါ်ခဲ့လား စစ်ပါတယ်။ [[mark:select-render]] ဒါပေမဲ့ ဒီ test မှာ
      component ကို ရိုးရိုး render လုပ်ထားတာကို သတိထား ကြည့်ပါ။ [[mark:read-click]] panel မှာ test က
      ကျနေပါတယ်။ mock function ကို tea နဲ့ ခေါ်ရမယ့် နေရာမှာ၊ ခေါ်တဲ့ အကြိမ် သုည လို့ ပြောနေပါတယ်။
      [[mark:read-why]] ဘာကြောင့်လဲဆိုတော့ ကိုယ့် mock function ကို component ဆီ ဘယ်သူမှ မပေးထားလို့ပါ။
      parent မပါရင် use Context က OrderContext ရဲ့ default တန်ဖိုးကို ပြန်ပေးပြီး၊ အဲဒီထဲက function က ဘာမှ မလုပ်ပါဘူး။ ခလုတ်ကို နှိပ်တော့ နှိပ်လိုက်ပေမဲ့ test က ဘာမှ မမြင်ရတာပါ။
    sources:
      - {
          title: "web.dev Learn Testing: Component testing, click and provide context",
          url: "https://web.dev/learn/testing/get-started/component-testing",
        }
      - { title: "Vitest: vi.fn", url: "https://vitest.dev/api/vi#vi-fn" }
      - {
          title: "react.dev: useContext, the default value",
          url: "https://react.dev/reference/react/useContext",
        }
    actions:
      - id: type-click
        type: editor.type
        at: { mark: type-click }
        target:
          {
            file: src/MenuList.test.jsx,
            after: "  expect(screen.getByText(\"ကော်ဖီ\")).toBeInTheDocument();\n});\n",
            occurrence: 1,
          }
        text: "\ntest(\"adds the chosen item to the order\", async () => {\n  fetchMenu.mockResolvedValue({\n    json: async () => [{ id: \"tea\", name: \"လက်ဖက်ရည်\", price: 1500 }],\n  });\n  const addItem = vi.fn();\n  const user = userEvent.setup();\n  render(<MenuList />);\n\n  await user.click(await screen.findByRole(\"button\", { name: \"ထည့်မယ်\" }));\n\n  expect(addItem).toHaveBeenCalledWith(\"tea\");\n});\n"
        cadence: block
      - id: expect-click-fail
        type: expect.preview
        at: { afterAction: type-click }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 3, delayMs: 2000 }
      - id: expect-click-count
        type: expect.preview
        at: { afterAction: expect-click-fail }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-failed, value: "1" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-click-message
        type: expect.preview
        at: { afterAction: expect-click-count }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute:
          {
            name: data-message,
            value: "expected \"vi.fn()\" to be called with arguments: [ 'tea' ]\n\nNumber of calls: 0\n",
          }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-click-test
        type: expect.preview
        at: { afterAction: expect-click-message }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-3 }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-render
        type: editor.select
        at: { mark: select-render }
        target: { file: src/MenuList.test.jsx, text: "render(<MenuList />);", occurrence: 3 }

  - id: provide
    narration: >
      [[mark:type-provider]] ဒါကြောင့် render လုပ်တဲ့ line ကို OrderContext နဲ့ ပတ်ပြီး၊ value ထဲမှာ ကိုယ့် mock function ကို ပေးလိုက်ပါမယ်။ React ၁၉ မှာ context ကိုယ်တိုင်ကို provider အဖြစ် သုံးလို့ ရပြီး၊ Provider
      ဆိုတဲ့ အပိုင်းကို ထပ်ရေးတာက အရင် ပုံစံပါ။ line အဟောင်းကိုတော့ comment အဖြစ် အောက်မှာ ချန်ထားပါတယ်။
      [[mark:read-provide]] panel ကို ကြည့်ပါ။ test သုံးခုလုံး pass ဖြစ်သွားပါပြီ။ ခလုတ်ကို နှိပ်တော့
      component က test ပေးထားတဲ့ mock function ကို tea နဲ့ ခေါ်သွားတာပါ။ production မှာ parent က ပေးမယ့်
      အရာကို test က ကိုယ်တိုင် ပေးလိုက်တာဖြစ်လို့၊ ဒါက dependency injection ရဲ့ ပုံစံ တစ်ခုပါပဲ။
    sources:
      - {
          title: "react.dev: createContext, providing context (React 19: <SomeContext> as a provider)",
          url: "https://react.dev/reference/react/createContext",
        }
      - {
          title: "web.dev Learn Testing: Component testing, click and provide context",
          url: "https://web.dev/learn/testing/get-started/component-testing",
        }
    actions:
      - id: type-provider
        type: editor.type
        at: { mark: type-provider }
        target:
          {
            file: src/MenuList.test.jsx,
            after: "  const user = userEvent.setup();\n  ",
            occurrence: 1,
          }
        text: "render(\n    <OrderContext value={{ addItem }}>\n      <MenuList />\n    </OrderContext>,\n  );\n  // "
        # One insert at the old line's first character (COURSE-KIT §5): the provider version above, the
        # old render line kept as a comment under it; every state parses.
        cadence: block
      - id: expect-provide-pass
        type: expect.preview
        at: { afterAction: type-provider }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 2000 }
      - id: expect-provide-three
        type: expect.preview
        at: { afterAction: expect-provide-pass }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "3" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-test-file
        type: expect.file
        at: { afterAction: expect-provide-three }
        path: src/MenuList.test.jsx
        contains: "  render(\n    <OrderContext value={{ addItem }}>\n      <MenuList />\n    </OrderContext>,\n  );\n  // render(<MenuList />);\n\n  await user.click(await screen.findByRole(\"button\", { name: \"ထည့်မယ်\" }));\n\n  expect(addItem).toHaveBeenCalledWith(\"tea\");"
      - id: expect-mock-file
        type: expect.file
        at: { afterAction: expect-test-file }
        path: src/MenuList.test.jsx
        contains: "vi.mock(\"./MenuRow.jsx\", () => ({\n  MenuRow: ({ item }) => <span>{item.name}</span>,\n}));"

  - id: cleanup
    narration: >
      တစ်ခု သတိထားမိမှာပါ။ ဒုတိယ test က ထည့်မယ် ခလုတ် နှစ်ခုကို render လုပ်ပေမဲ့၊ နောက်ဆုံး test က
      ခလုတ် တစ်ခုတည်းကိုပဲ တွေ့ပါတယ်။ ပြီးခဲ့တဲ့ lesson မှာ before Each နဲ့ page ကို ကိုယ်တိုင်
      ရှင်းခဲ့တာ မှတ်မိမှာပါ။ [[mark:open-setup]] ဒီမှာ ဒါကို setup ဖိုင်က လုပ်ပေးပါတယ်။
      [[mark:select-cleanup]] React Testing Library ရဲ့ cleanup က render လုပ်ထားတာတွေကို ဖြုတ်ပေးပါတယ်။
      Jest လို after Each ကို global အနေနဲ့ ပေးထားတဲ့ runner မှာဆိုရင် React Testing Library က cleanup ကို
      သူ့ဘာသာ ခေါ်ပေးပါတယ်။ Vitest မှာတော့ default အနေနဲ့ global မပါလို့၊ setup ဖိုင်ထဲက after Each ကနေ
      cleanup ကို ခေါ်ပေးရတာပါ။
    sources:
      - { title: "Vitest: globals (facts A08)", url: "https://vitest.dev/config/globals" }
      - {
          title: "Vitest: Migrating from Jest, globals and Testing Library's auto-cleanup",
          url: "https://vitest.dev/guide/migration/jest",
        }
      - {
          title: "Testing Library: React Testing Library API, cleanup",
          url: "https://testing-library.com/docs/react-testing-library/api#cleanup",
        }
    actions:
      - id: open-setup
        type: workspace.openFile
        at: { mark: open-setup }
        path: src/setup-tests.js
      - id: select-cleanup
        type: editor.select
        at: { mark: select-cleanup }
        target: { file: src/setup-tests.js, text: "afterEach(() => cleanup());", occurrence: 1 }

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ component တစ်ခုကို test လုပ်တဲ့အခါ သူ မှီခိုနေတဲ့ dependency တွေကို အရင်
      ရှာပါ။ ဒီ lesson မှာ network ကို fetch stub နဲ့၊ child component ကို module mock နဲ့ အစားထိုးပြီး၊
      context ကိုတော့ test က ကိုယ်တိုင် ပေးခဲ့ပါတယ်။ [[mark:recap-harness]] ဒီလို production ရဲ့ နေရာမှာ
      test အတွက် အစားထိုးထားတဲ့ ပတ်ဝန်းကျင်ကို test harness လို့ ခေါ်ပါတယ်။ render ရုံပဲ စစ်တဲ့ test
      တစ်ခုတည်းနဲ့ component ကို test လုပ်ပြီးပြီလို့ မယူဆပါနဲ့။ request တွေ များလာရင် fetch ကို
      တစ်ခုချင်း stub လုပ်ရတာ ခက်လာလို့ Mock Service Worker လို library ကို သုံးကြပါတယ်။ mock တွေ
      အများကြီး လိုလာရင်တော့ test ထဲမှာ အတုတွေ ဆက်ထပ်နေမယ့်အစား၊ code ကိုယ်တိုင်ကို test လုပ်ရလွယ်အောင်
      ပြင်ရေးတာ ပိုကောင်းပါတယ်။
      [[mark:recap-next]] နောက် lesson မှာတော့ test မပါဘဲ ကျန်ခဲ့တဲ့ code ဟောင်း အခု ဘာလုပ်နေလဲ ဆိုတာကို
      snapshot နဲ့ မှတ်ထားနည်းကို ကြည့်ပါမယ်။
    sources:
      - {
          title: "web.dev Learn Testing: Component testing, summary and quiz",
          url: "https://web.dev/learn/testing/get-started/component-testing",
        }
      - {
          title: "Vitest: Mocking Requests (facts B15)",
          url: "https://vitest.dev/guide/mocking/requests",
        }
    actions: []
checks:
  - { type: timing.p95Ms, max: 300 }
