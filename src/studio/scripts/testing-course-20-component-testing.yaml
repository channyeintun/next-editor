      src/MenuList.jsx: |
        import { useContext, useEffect, useState } from "react";
        import { MenuRow } from "./MenuRow.jsx";
        import { OrderContext } from "./OrderContext.js";

        // The shop's menu: it loads the items from the server and adds the chosen one to the order.
        export function MenuList() {
          const [items, setItems] = useState([]);
          useEffect(() => {
            fetch("/api/menu")
              .then((response) => response.json())
              .then((menu) => setItems(menu));
          }, []);
          const { addItem } = useContext(OrderContext);
          return (
            <section>
              <h2>ဟင်းလျာ စာရင်း</h2>
              <ul>
                {items.map((item) => (
                  <li key={item.id}>
                    <MenuRow item={item} />
                    <button type="button" onClick={() => addItem(item.id)}>
                      ထည့်မယ်
                    </button>
                  </li>
                ))}
              </ul>
            </section>
          );
        }
      src/MenuList.test.jsx: |
        import { afterEach, beforeEach, expect, test, vi } from "vitest";
        import { render, screen } from "@testing-library/react";
        import userEvent from "@testing-library/user-event";
        import { MenuList } from "./MenuList.jsx";
        import { OrderContext } from "./OrderContext.js";

        // The team's rule: no test reaches a real server. Every request gets an empty menu.
        const fetchMenu = vi.fn();
        beforeEach(() => {
          fetchMenu.mockResolvedValue({ json: async () => [] });
          vi.stubGlobal("fetch", fetchMenu);
        });
        afterEach(() => vi.unstubAllGlobals());

        test("shows the heading", async () => {
          render(<MenuList />);
          expect(await screen.findByText("ဟင်းလျာ စာရင်း")).toBeInTheDocument();
        });
      src/MenuRow.jsx: |
        // One line of the menu: the item's name and its price.
        export function MenuRow({ item }) {
          const price = item.price.toLocaleString("en-US");
          return <span>{`${item.name} ${price} ကျပ်`}</span>;
        }
      src/OrderContext.js: |
        import { createContext } from "react";

        // The order the customer is building. The shop's app gives the real addItem from a parent.
        export const OrderContext = createContext({ addItem: () => {} });
      src/setup-tests.js: |
        import { afterEach } from "vitest";
        import { cleanup } from "@testing-library/react";
        // jest-dom's matchers (toBeInTheDocument, toHaveTextContent, …) for Vitest's expect.
        import "@testing-library/jest-dom/vitest";

        // Unmount what each test rendered, so the next test starts with an empty page.
        afterEach(() => cleanup());
      vite.config.js: |
        import { defineConfig } from "vite";
        import courseVitestBridge from "./course/vitest-bridge.js";

        // The course panel: the dev server runs the real Vitest and the preview shows its results.
        // React is pre-bundled at start, so mounting the lesson's app never makes Vite reload the page.
        export default defineConfig({
          plugins: [courseVitestBridge()],
          esbuild: { jsx: "automatic" },
          optimizeDeps: { include: ["react", "react/jsx-runtime", "react/jsx-dev-runtime", "react-dom/client"] },
        });
      vitest.config.js: |
        import { defineConfig } from "vitest/config";

        export default defineConfig({
          // JSX uses React's automatic runtime, so a component file needs no `import React`.
          esbuild: { jsx: "automatic" },
          test: {
            environment: "happy-dom",
            setupFiles: ["./src/setup-tests.js"],
          },
        });
