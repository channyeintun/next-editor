            "vite": "5.4.21"
          }
        }
      src/main.ts: |
        import { teaPrice, coffeePrice, largeCupExtra } from "./menu";

        const largeTea = teaPrice + largeCupExtra;
        const largeCoffee = coffeePrice + largeCupExtra;

        console.log("လက်ဖက်ရည် ခွက်ကြီး", largeTea, "ကျပ်");
        console.log("ကော်ဖီ ခွက်ကြီး", largeCoffee, "ကျပ်");
      src/menu.ts: |
