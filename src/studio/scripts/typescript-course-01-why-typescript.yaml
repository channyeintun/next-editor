build:
  # Studio replaces this built-in profile at render time with the Burmese provider chosen in the
  # render console (AthanLab with the user's own key, or VoxCPM2 when that feature is enabled).
  voiceProfile: pocket-alba-v1
  seed: 3101
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: welcome
    chapter: "TypeScript ဘာကြောင့် လိုလဲ"
    narration: >
      [[mark:start]] မင်္ဂလာပါ ခင်ဗျာ။ TypeScript course ကို ကြိုဆိုပါတယ်။ ဒီ course တစ်လျှောက်လုံးမှာ
      ရန်ကုန်က ရွှေလက်ဖက်ရည်ဆိုင်ရဲ့ အော်ဒါ စနစ်လေးကို TypeScript နဲ့ အဆင့်ဆင့် ရေးသွားမှာပါ။
      TypeScript ဆိုတာ JavaScript code ထဲက အမှားတွေကို program မ run ခင်ကတည်းက ရှာပေးတဲ့ ဘာသာစကား ဖြစ်ပြီး၊
      ဒီ ပထမ lesson မှာတော့ အဲဒါ ဘာကြောင့် အရေးကြီးလဲ ဆိုတာကနေ စကြည့်ပါမယ်။ [[mark:draw-js]] JavaScript
      ရေးဖူးတဲ့သူတိုင်း ဒီ အတွေ့အကြုံကို သိကြမှာပါ။ code ကို ရေးပြီး run ကြည့်လိုက်တော့မှ အမှားကို
      တွေ့ရတာပါ။ [[mark:draw-outcomes]] တချို့ အမှားတွေက program ကို error နဲ့ ရပ်သွားစေပြီး၊ တချို့ကျတော့
      error တောင် မတက်ဘဲ အဖြေ မှားနေတာမျိုး ဖြစ်ပါတယ်။ [[mark:draw-customer]] ဆိုင်မှာ ဆိုရင်တော့
      ဘောင်ချာပေါ်က ငွေ မှားနေတာကို ကိုယ့်ထက် customer က အရင် တွေ့သွားတာမျိုးပါ။ ဘာကြောင့် ဒီလို
      ဖြစ်ရလဲဆိုတော့၊ JavaScript က တန်ဖိုး တစ်ခုဟာ ဂဏန်းလား စာသားလား ဆိုတာကို program run နေတဲ့
      အချိန်ကျမှပဲ ကြည့်လို့ပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 1: Kickstart Your TypeScript Setup",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/kickstart-your-typescript-setup",
        }
      - {
          title: "TypeScript Handbook: The Basics (static type-checking)",
          url: "https://www.typescriptlang.org/docs/handbook/2/basic-types.html#static-type-checking",
        }
    actions:
      - id: open-board-a
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-js
        type: whiteboard.apply
        at: { mark: draw-js }
        upsertIds:
          [
            a-write-box,
            a-write-label,
            a-arrow-1,
            a-run-box,
            a-run-label,
            a-arrow-2,
            a-bug-box,
            a-bug-label,
          ]
        drawMs: 3200
      - id: draw-outcomes
        type: whiteboard.apply
        at: { mark: draw-outcomes }
        upsertIds: [a-crash, a-wrong]
        drawMs: 1800
      - id: draw-customer
        type: whiteboard.apply
        at: { mark: draw-customer }
        upsertIds: [a-customer]
        drawMs: 1200

  - id: starter
    narration: >
      [[mark:close-board]] ဒီ ပြဿနာကို ဆိုင်ရဲ့ code ထဲမှာ တကယ် ကြည့်ရအောင်။ [[mark:open-menu]] ဒါက
      ဆိုင်ရဲ့ ဈေးနှုန်းတွေကို စုရေးထားတဲ့ menu ဖိုင်ပါ။ လက်ဖက်ရည် ဈေး၊ ကော်ဖီ ဈေးနဲ့ ခွက်ကြီး ယူရင်
      ထပ်ပေါင်းရမယ့် ငွေကို ဒီမှာ သတ်မှတ်ထားပါတယ်။ [[mark:select-tea-price]] လက်ဖက်ရည် ဈေးနှုန်းကို
      သေချာ ကြည့်ပါ။ ၁၅၀၀ ကို double quote ထဲမှာ ရေးထားတဲ့အတွက်၊ ဒါက ဂဏန်း မဟုတ်ဘဲ စာသား ဖြစ်နေပါတယ်။
      [[mark:select-coffee-price]] ကော်ဖီ ဈေးကတော့ quote မပါတဲ့ တကယ့် ဂဏန်းပါ။ ကြည့်လိုက်ရင်
      သိပ်မကွာတဲ့အတွက် ဒီလို အမှားမျိုးက မျက်စိ လွတ်သွားတတ်ပါတယ်။ [[mark:open-main]] ဒါကတော့ program ရဲ့
      အဓိက ဖိုင်ပါ။ [[mark:select-large-tea]] ဒီ line က လက်ဖက်ရည် ဈေးမှာ ခွက်ကြီးအတွက် ငွေ
      ထပ်ပေါင်းပြီး၊ ခွက်ကြီး တစ်ခွက်ရဲ့ ဈေးကို တွက်ပါတယ်။ သူ့အောက်က line ကလည်း ကော်ဖီအတွက် အဲဒီ
      အတိုင်းပဲ တွက်ပါတယ်။ [[mark:select-logs]] နောက်ဆုံး နှစ်ကြောင်းကတော့ တွက်လို့ ရလာတဲ့ ဈေးနှုန်း
      နှစ်ခုကို ထုတ်ပြပါတယ်။ ဒါဆို program run လိုက်တဲ့အခါ ဘာ ထွက်လာလဲ ကြည့်ရအောင်။
    sources:
      - {
          title: "TypeScript Handbook: The Basics (non-exception failures)",
          url: "https://www.typescriptlang.org/docs/handbook/2/basic-types.html#non-exception-failures",
        }
      - {
          title: "MDN: Addition (+) — string concatenation",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Addition",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: open-menu
        type: workspace.openFile
        at: { mark: open-menu }
        path: src/menu.ts
      - id: select-tea-price
        type: editor.select
        at: { mark: select-tea-price }
        target: { file: src/menu.ts, text: '"1500"', occurrence: 1 }
      - id: select-coffee-price
        type: editor.select
        at: { mark: select-coffee-price }
        target: { file: src/menu.ts, text: "1800", occurrence: 1 }
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: src/main.ts
      - id: select-large-tea
        type: editor.select
        at: { mark: select-large-tea }
        target: { file: src/main.ts, text: "teaPrice + largeCupExtra", occurrence: 1 }
      - id: select-logs
        type: editor.select
        at: { mark: select-logs }
        target:
          {
            file: src/main.ts,
            text: "console.log(\"လက်ဖက်ရည် ခွက်ကြီး\", largeTea, \"ကျပ်\");\nconsole.log(\"ကော်ဖီ ခွက်ကြီး\", largeCoffee, \"ကျပ်\");",
            occurrence: 1,
          }

  - id: panel
    narration: >
      [[mark:panel-ready]] ညာဘက်မှာ ဒီ course တစ်ခုလုံး သုံးသွားမယ့် TypeScript panel ကို မြင်ရပါပြီ။
      ဒီ panel က TypeScript ရဲ့ စစ်ဆေးချက်တွေနဲ့ program ရဲ့ ရလဒ်ကို တစ်နေရာတည်းမှာ စုပြပေးပါတယ်။
      အောက်ဆုံးက Output အပိုင်းမှာ program ထုတ်ပြတဲ့ စာတွေ ပေါ်ပါတယ်။ [[mark:read-output]] ကော်ဖီ
      ခွက်ကြီးက ၂၁၀၀ ကျပ်နဲ့ မှန်နေပေမယ့်၊ လက်ဖက်ရည် ခွက်ကြီးကတော့ ၁၅၀၀ နောက်မှာ ၃၀၀ ကပ်ပြီး ဆက်ထားတဲ့
      ဂဏန်းရှည်ကြီး ဖြစ်နေပါတယ်။ JavaScript က စာသားနဲ့ ဂဏန်းကို ပေါင်းခိုင်းရင်၊ ဂဏန်းကို စာသား ပြောင်းပြီး
      နောက်ကနေ ဆက်ပေးလိုက်လို့ပါ။ error တစ်ခုမှ မတက်ဘဲ ငွေ မှားသွားတာ ဖြစ်လို့၊ ဘောင်ချာက customer
      လက်ထဲ ရောက်သွားမှပဲ သိရမှာပါ။ [[mark:read-errors]] အပေါ်ဆုံးက Errors အပိုင်းကတော့ TypeScript တွေ့တဲ့
      အမှားတွေကို ပြတဲ့ နေရာပါ။ အခုတော့ သူကလည်း error မရှိဘူး လို့ပဲ ပြနေပါတယ်။ ဘာကြောင့်လဲဆိုတော့ စာသားနဲ့ ဂဏန်းကို
      ဆက်တာက JavaScript မှာ ခွင့်ပြုထားတဲ့ အလုပ် ဖြစ်ပြီး၊ ဒီ ဈေးနှုန်းကို ဂဏန်း ဖြစ်စေချင်တယ် ဆိုတာ
      TypeScript မသိသေးလို့ပါ။
    sources:
      - {
          title: "MDN: Addition (+) — string concatenation",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Addition",
        }
      - {
          title: "TypeScript Handbook: The Basics",
          url: "https://www.typescriptlang.org/docs/handbook/2/basic-types.html",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-start-clean
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-start-output
        type: expect.preview
        at: { afterAction: expect-start-clean }
        timeoutMs: 5000
        target: { by: testId, value: ts-output }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-wrong-tea
        type: expect.preview
        at: { afterAction: expect-start-output }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-1 }
        textContains: "လက်ဖက်ရည် ခွက်ကြီး 1500300 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-right-coffee
        type: expect.preview
        at: { afterAction: expect-wrong-tea }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-2 }
        textContains: "ကော်ဖီ ခွက်ကြီး 2100 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: what-is-typescript
    chapter: "TypeScript ဘယ်လို အလုပ်လုပ်လဲ"
    narration: >
      [[mark:board-pipeline]] ဒါဆို TypeScript ဆိုတာ ဘာလဲ။ အတိုချုပ် ပြောရရင်၊ JavaScript ကိုပဲ type တွေ
      ထပ်ထည့်ပြီး ရေးတာပါ။ type ဆိုတာ တန်ဖိုး တစ်ခုက စာသားလား၊ ဂဏန်းလား၊ ဘယ်လို အမျိုးအစား ဖြစ်ရမလဲ
      ဆိုတာကို TypeScript ကို ပြောပြတဲ့ စည်းကမ်းပါ။ [[mark:draw-ts-file]] TypeScript code ကို dot ts နဲ့
      ဆုံးတဲ့ ဖိုင်တွေထဲမှာ ရေးပါတယ်။ [[mark:draw-check]] အဲဒီ code ကို type checker က run စရာ မလိုဘဲ
      ဖတ်ကြည့်ပြီး၊ type တွေ ကိုက်မကိုက် စစ်ပေးပါတယ်။ မကိုက်တဲ့ နေရာ တွေ့ရင် error အနေနဲ့ ပြပါတယ်။
      [[mark:draw-js-file]] ပြီးတော့ compiler က type တွေကို ဖယ်ထုတ်ပြီး ရိုးရိုး JavaScript ဖိုင်ကို
      ထုတ်ပေးပါတယ်။ browser ဖြစ်ဖြစ်၊ Node.js ဖြစ်ဖြစ်၊ တကယ် run တာက အဲဒီ JavaScript ပါ။
      [[mark:draw-editor]] ဒီ အဆင့်တွေထဲမှာ အရေးအကြီးဆုံးက type checker ပါ။ VS Code လို editor မှာဆိုရင်
      ကိုယ် ရိုက်နေတုန်းမှာပဲ သူက နောက်ကွယ်ကနေ စစ်နေပြီး၊ အမှားတွေကို code အောက်မှာ အနီရောင်
      မျဉ်းကွေးလေးတွေနဲ့ ချက်ချင်း ပြပေးပါတယ်။ [[mark:draw-editor-why]] TypeScript ကို စဖန်တီးခဲ့တာကလည်း JavaScript ကို
      တင်းကျပ်အောင် လုပ်ဖို့ထက်၊ editor က code ကို နားလည်ပြီး ကိုယ့်ကို ကူညီနိုင်အောင် လုပ်ဖို့ ဖြစ်ပါတယ်။
      ဒီ lesson ထဲက editor ကတော့ အဲဒီ မျဉ်းကွေးတွေ မပြတဲ့အတွက်၊ ညာဘက် panel က type checker ရဲ့ အဖြေကို
      အစားထိုး ပြပေးတာပါ။ [[mark:draw-ts7]] နောက်ထပ် သိထားသင့်တာ တစ်ခုက၊ TypeScript ၇ မှာ compiler ကို
      Go ဘာသာစကားနဲ့ ပြန်ရေးထားတဲ့အတွက်၊ project ကြီးတွေကို အရင်ကထက် ဆယ်ဆလောက် ပိုမြန်မြန် စစ်ပေးနိုင်လာပါပြီ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 1: Kickstart Your TypeScript Setup",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/kickstart-your-typescript-setup",
        }
      - {
          title: "Total TypeScript Essentials, ch. 2: IDE Superpowers",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/ide-superpowers",
        }
      - {
          title: "TypeScript Handbook: The Basics (types for tooling, erased types)",
          url: "https://www.typescriptlang.org/docs/handbook/2/basic-types.html#erased-types",
        }
      - {
          title: "Announcing TypeScript 7.0",
          url: "https://devblogs.microsoft.com/typescript/announcing-typescript-7-0/",
        }
    actions:
      - id: open-board-b
        type: whiteboard.apply
        at: { mark: board-pipeline }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-ts-file
        type: whiteboard.apply
        at: { mark: draw-ts-file }
        upsertIds: [b-ts-box, b-ts-name, b-ts-sub]
        drawMs: 1500
      - id: draw-check
        type: whiteboard.apply
        at: { mark: draw-check }
        upsertIds: [b-arrow-1, b-check-box, b-check-name, b-check-sub, b-err-arrow, b-err]
        drawMs: 3000
      - id: draw-js-file
        type: whiteboard.apply
        at: { mark: draw-js-file }
        upsertIds: [b-arrow-2, b-js-box, b-js-name, b-js-sub, b-run-arrow, b-run]
        drawMs: 3000
      - id: draw-editor
        type: whiteboard.apply
        at: { mark: draw-editor }
        upsertIds: [b-check-circle]
        drawMs: 1400
      - id: draw-editor-why
        type: whiteboard.apply
        at: { mark: draw-editor-why }
        upsertIds: [b-editor]
        drawMs: 1600
      - id: draw-ts7
        type: whiteboard.apply
        at: { mark: draw-ts7 }
        upsertIds: [b-ts7]
        drawMs: 1500

  - id: inference
    chapter: "Type inference"
    narration: >
      [[mark:close-pipeline]] editor ထဲ ပြန်သွားရအောင်။ TypeScript က ဒီ program ကို ဘယ်လို နားလည်ထားလဲ
      ဆိုတာ မေးကြည့်ချင်ပါတယ်။ [[mark:type-query-tea]] လက်ဖက်ရည် ခွက်ကြီး ဈေးရဲ့ အောက်မှာ query comment
      တစ်ကြောင်း ထည့်ပါမယ်။ ဒီ comment က သူ့ အပေါ် line မှာ သူ ညွှန်ထားတဲ့ နာမည်ရဲ့ type ကို မေးတာပါ။
      VS Code မှာဆိုရင် mouse ကို နာမည်ပေါ် တင်ကြည့်ရုံနဲ့ မြင်ရမယ့် type ကို၊ ဒီ course မှာတော့ ဒီနည်းနဲ့
      panel ထဲမှာ ပြပါမယ်။ [[mark:read-query-tea]] panel ရဲ့ အလယ်က Types အပိုင်းမှာ အဖြေ ပေါ်လာပါပြီ။ လက်ဖက်ရည် ခွက်ကြီး
      ဈေးကို string လို့ ပြနေပါတယ်။ TypeScript မှာ စာသားကို string လို့ ခေါ်ပြီး၊ ဂဏန်းကို number လို့ ခေါ်ပါတယ်။
      [[mark:type-query-coffee]] ကော်ဖီ ခွက်ကြီးအတွက်လည်း မေးကြည့်ရအောင်။ [[mark:read-query-coffee]]
      ဒီတစ်ခါတော့ number ဖြစ်နေပါတယ်။ တွက်ပုံ တူတူပဲ ဖြစ်ပေမယ့် type မတူတာက၊ လက်ဖက်ရည် ဈေးက စာသား
      ဖြစ်နေလို့ပါ။ သတိထားကြည့်ရင် ကိုယ်က type တစ်ခုမှ ရေးမထားပါဘူး။ TypeScript က တန်ဖိုးတွေကို ကြည့်ပြီး
      type ကို သူ့ဘာသာ သိသွားတာပါ။ ဒါကို type inference လို့ ခေါ်ပါတယ်။ ဒါဆို string မှန်း သိနေရက်နဲ့
      ဘာလို့ error မပြတာလဲ။ TypeScript သိတာက ကိုယ် ရေးထားတဲ့ အတိုင်းပဲ ဖြစ်ပြီး၊ ကိုယ် တကယ် ဘာ
      ဖြစ်စေချင်လဲ ဆိုတာကိုတော့ မသိနိုင်လို့ပါ။
    sources:
      - {
          title: "TypeScript Handbook: The Basics (inference)",
          url: "https://www.typescriptlang.org/docs/handbook/2/basic-types.html#inference",
        }
      - {
          title: "TypeScript Handbook: Type Inference",
          url: "https://www.typescriptlang.org/docs/handbook/type-inference.html",
        }
      - {
          title: "TypeScript Playground: twoslash queries (// ^?)",
          url: "https://www.typescriptlang.org/dev/twoslash/",
        }
    actions:
      - id: close-pipeline
        type: whiteboard.apply
        at: { mark: close-pipeline }
        open: false
      - id: type-query-tea
        type: editor.type
        at: { mark: type-query-tea }
        target:
          {
            file: src/main.ts,
            after: "const largeTea = teaPrice + largeCupExtra;\n",
            occurrence: 1,
          }
        text: "//    ^?\n"
      - id: expect-tea-string
        type: expect.preview
        at: { afterAction: type-query-tea }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        attribute: { name: data-type, value: "const largeTea: string" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-query-coffee
        type: editor.type
        at: { mark: type-query-coffee }
        target:
          {
            file: src/main.ts,
            after: "const largeCoffee = coffeePrice + largeCupExtra;\n",
            occurrence: 1,
          }
        text: "//    ^?\n"
      - id: expect-coffee-number
        type: expect.preview
        at: { afterAction: type-query-coffee }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-2 }
        attribute: { name: data-type, value: "const largeCoffee: number" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-two-queries
        type: expect.preview
        at: { afterAction: expect-coffee-number }
        timeoutMs: 5000
        target: { by: testId, value: ts-types }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: annotation
    chapter: "ပထမဆုံး type annotation"
    narration: >
      [[mark:open-menu-2]] ဒါကြောင့် ကိုယ် ဘာ ဖြစ်စေချင်လဲ ဆိုတာကို TypeScript ကို ပြောပြရပါမယ်။ menu
      ဖိုင်ကို ပြန်ဖွင့်ပါမယ်။ [[mark:type-annotation]] လက်ဖက်ရည် ဈေးနှုန်းရဲ့ နာမည်နောက်မှာ number ဆိုတဲ့
      type ကို ကိုယ်တိုင် ရေးပေးလိုက်ပါမယ်။ ဒီလို type ကို ကိုယ်တိုင် ကြေညာပေးတာကို type annotation
      လို့ ခေါ်ပါတယ်။ [[mark:read-error]] Errors မှာ error တစ်ခု ချက်ချင်း ပေါ်လာပါပြီ။ string
      ကို number ရှိရမယ့် နေရာမှာ ထည့်လို့ မရဘူးလို့ ပြောနေတာပါ။ error က menu ဖိုင်ရဲ့ ဒုတိယ line ကို
      ညွှန်ပြနေတာကိုလည်း သတိထား ကြည့်ပါ။ ဈေးနှုန်း မှားထွက်လာတဲ့ နေရာ မဟုတ်ဘဲ၊ အမှား စဖြစ်တဲ့ နေရာကို
      တန်းပြပေးတာပါ။
    sources:
      - {
          title: "TypeScript Handbook: Everyday Types (type annotations on variables)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#type-annotations-on-variables",
        }
      - {
          title: "TypeScript Handbook: The Basics (explicit types)",
          url: "https://www.typescriptlang.org/docs/handbook/2/basic-types.html#explicit-types",
        }
    actions:
      - id: open-menu-2
        type: workspace.openFile
        at: { mark: open-menu-2 }
        path: src/menu.ts
      - id: type-annotation
        type: editor.type
        at: { mark: type-annotation }
        target: { file: src/menu.ts, after: "export const teaPrice", occurrence: 1 }
        text: ": number"
      - id: expect-one-error
        type: expect.preview
        at: { afterAction: type-annotation }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-error-code
        type: expect.preview
        at: { afterAction: expect-one-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-code, value: "2322" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-error-at-cause
        type: expect.preview
        at: { afterAction: expect-error-code }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-file, value: "src/menu.ts" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-error-line
        type: expect.preview
        at: { afterAction: expect-error-at-cause }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-line, value: "2" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-error-message
        type: expect.preview
        at: { afterAction: expect-error-line }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Type 'string' is not assignable to type 'number'."
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: still-runs
    narration: >
      [[mark:read-still-runs]] ဒါပေမဲ့ Output ကို ကြည့်ပါ။ လက်ဖက်ရည် ခွက်ကြီးက ခုနက ဂဏန်းရှည်ကြီး အတိုင်း
      ရှိနေပါသေးတယ်။ type error ရှိနေပေမယ့် program က ပုံမှန်အတိုင်း run သွားတာပါ။ ဘာကြောင့်လဲဆိုတော့ run
      တဲ့ အချိန်မှာ type တွေကို ဖယ်ထုတ်ပြီးသား ဖြစ်လို့ပါ။ type က program အလုပ်လုပ်ပုံကို ဘာမှ
      မပြောင်းပေးဘဲ၊ အမှားကို သတိပေးရုံပဲ ပေးပါတယ်။ [[mark:read-types-changed]] Types အပိုင်းမှာလည်း
      လက်ဖက်ရည် ခွက်ကြီး ဈေးက number ဖြစ်သွားပါပြီ။ ကိုယ်က number လို့ ကြေညာလိုက်တဲ့အတွက်၊ TypeScript က
      အဲဒီ အတိုင်း ယုံပြီး ဆက်တွက်ထားတာပါ။ ဒါပေမဲ့ တကယ့် တန်ဖိုးကတော့ စာသား ဖြစ်နေတုန်းပါ။ ဒါကြောင့် error ကို ဂရုစိုက်ပြီး ပြင်ပေးဖို့က ကိုယ့် တာဝန်ပါ။
    sources:
      - {
          title: "TypeScript Handbook: The Basics (emitting with errors, erased types)",
          url: "https://www.typescriptlang.org/docs/handbook/2/basic-types.html#emitting-with-errors",
        }
    actions:
      - id: expect-still-runs
        type: expect.preview
        at: { mark: read-still-runs }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-1 }
        textContains: "လက်ဖက်ရည် ခွက်ကြီး 1500300 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-tea-now-number
        type: expect.preview
        at: { mark: read-types-changed }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-1 }
        attribute: { name: data-type, value: "const largeTea: number" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: fix
    narration: >
      [[mark:type-fixed]] ဒါဆို ပြင်ကြည့်ရအောင်။ ဈေးနှုန်းကို quote မပါဘဲ တကယ့် ဂဏန်း အနေနဲ့ line အသစ်မှာ
      ပြန်ရေးပြီး၊ အမှား ပါတဲ့ line အဟောင်းကိုတော့ comment လုပ်ပြီး ပိတ်ထားပါမယ်။ [[mark:read-fixed]] error
      ပျောက်သွားပြီး၊ Output မှာ လက်ဖက်ရည် ခွက်ကြီးက ၁၈၀၀ ကျပ် ဖြစ်သွားပါပြီ။ ကော်ဖီ ခွက်ကြီးကလည်း ၂၁၀၀
      ကျပ်နဲ့ အရင်အတိုင်း မှန်နေပါတယ်။ ဘောင်ချာ customer လက်ထဲ မရောက်ခင်၊ code ရေးနေတုန်းမှာပဲ ဒီ အမှားကို
      ဖမ်းမိသွားတာပါ။
    sources:
      - {
          title: "TypeScript Handbook: Everyday Types (the primitives string and number)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#the-primitives-string-number-and-boolean",
        }
    actions:
      - id: type-fixed
        type: editor.type
        at: { mark: type-fixed }
        target: { file: src/menu.ts, after: "(ကျပ်)\n", occurrence: 1 }
        text: "export const teaPrice: number = 1500;\n// "
        cadence: block
      - id: expect-fixed-clean
        type: expect.preview
        at: { afterAction: type-fixed }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-fixed-tea
        type: expect.preview
        at: { afterAction: expect-fixed-clean }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-1 }
        textContains: "လက်ဖက်ရည် ခွက်ကြီး 1800 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-fixed-coffee
        type: expect.preview
        at: { afterAction: expect-fixed-tea }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-2 }
        textContains: "ကော်ဖီ ခွက်ကြီး 2100 ကျပ်"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-file-menu
        type: expect.file
        at: { afterAction: expect-fixed-coffee }
        path: src/menu.ts
        contains: "export const teaPrice: number = 1500;\n// export const teaPrice: number = \"1500\";"
      - id: expect-file-main
        type: expect.file
        at: { afterAction: expect-file-menu }
        path: src/main.ts
        contains: "const largeTea = teaPrice + largeCupExtra;\n//    ^?\n"

  - id: recap
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ JavaScript က တန်ဖိုးတွေရဲ့ type ကို run တဲ့ အချိန်ကျမှ ကြည့်တဲ့အတွက်
      အမှား တချို့ကို နောက်ကျမှ သိရပါတယ်။ TypeScript ကတော့ JavaScript မှာ type တွေ ထပ်ထည့်ထားတာ ဖြစ်ပြီး၊
      type checker က program ကို run စရာ မလိုဘဲ စစ်ပေးပါတယ်။ [[mark:recap-annotation]] ကိုယ် မရေးထားတဲ့
      type တွေကို TypeScript က infer လုပ်ပေးပြီး၊ ကိုယ် ဘာ ဖြစ်စေချင်လဲ ဆိုတာကိုတော့ type annotation နဲ့
      ပြောပြရပါတယ်။ type error ရှိနေလည်း program က run သွားတာမို့၊ error တွေကို ကိုယ်တိုင် ပြင်ပေးရပါတယ်။
      နောက် lesson မှာတော့ editor က TypeScript ရဲ့ အကူအညီနဲ့ code ရေးနေတဲ့ ကိုယ့်ကို ဘယ်လို ကူညီပေးလဲ
      ဆိုတာ ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 1: Kickstart Your TypeScript Setup",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/kickstart-your-typescript-setup",
        }
      - {
          title: "TypeScript Handbook: The Basics",
          url: "https://www.typescriptlang.org/docs/handbook/2/basic-types.html",
        }
    actions:
      - id: select-annotation
        type: editor.select
        at: { mark: recap-annotation }
        target: { file: src/menu.ts, text: "teaPrice: number", occurrence: 1 }
checks:
  - { type: timing.p95Ms, max: 300 }
