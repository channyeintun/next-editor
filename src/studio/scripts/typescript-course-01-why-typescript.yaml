        export const teaPrice = "1500";
        export const coffeePrice = 1800;
        export const largeCupExtra = 300;
      tsconfig.json: |
        {
          "compilerOptions": {
            "target": "es2022",
            "module": "preserve",
            "strict": true,
            "noEmit": true,
            "skipLibCheck": true,
            "moduleDetection": "force"
          },
          "include": ["src"]
        }
      vite.config.js: |
        import { defineConfig } from "vite";
        import courseTypeChecker from "./course/checker.js";

        export default defineConfig({
          plugins: [courseTypeChecker()],
        });
