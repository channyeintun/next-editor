build:
  # Studio replaces this built-in profile at render time with the Burmese provider chosen in the
  # render console (AthanLab with the user's own key, or VoxCPM2 when that feature is enabled).
  voiceProfile: pocket-alba-v1
  seed: 2727
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "Type တွေအတွက် function"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ tsconfig ထဲက setting တွေနဲ့ TypeScript ရဲ့ စစ်ဆေးပုံကို ကိုယ့်
      project နဲ့ ကိုက်အောင် ပြင်ဆင်ခဲ့ပါတယ်။ ဒီ lesson ကစပြီး ကိုယ့် type တွေကို ကိုယ်တိုင် design
      လုပ်တဲ့ အပိုင်းကို ရောက်လာပါပြီ။ ပထမဆုံး ကြည့်မှာကတော့ generic type ပါ။ [[mark:draw-value-fn]]
      ကိုယ် သိပြီးသား function တစ်ခုနဲ့ စဉ်းစားကြည့်ရအောင်။ ဈေးနှုန်းနဲ့ အရေအတွက်ကို ထည့်ပေးလိုက်ရင်
      ကျသင့်ငွေကို ပြန်ပေးတဲ့ function ပါ။ code ကို တစ်ခါပဲ ရေးထားပေမယ့်၊ ထည့်ပေးတဲ့ တန်ဖိုး ပြောင်းတိုင်း
      အဖြေ အသစ် ရပါတယ်။ [[mark:draw-type-fn]] generic type ဆိုတာ အဲဒီလို function မျိုးကို type ပိုင်းမှာ
      ရေးတာပါ။ တန်ဖိုး မဟုတ်ဘဲ type တစ်ခုကို ထည့်ပေးလိုက်ရင်၊ type အသစ် တစ်ခု ပြန်ရပါတယ်။
      ဥပမာအားဖြင့် ဆိုင်ရဲ့ API ရလဒ် type ထဲကို menu item array ကို ထည့်ပေးရင် menu ရဲ့ ရလဒ် type
      ရပြီး၊ အော်ဒါ type ကို ထည့်ပေးရင်တော့ အော်ဒါ ရဲ့ ရလဒ် type ရပါတယ်။ [[mark:draw-words]] function
      မှာ parameter နဲ့ argument ရှိသလိုပဲ၊ generic type မှာလည်း type ကို လက်ခံမယ့် နာမည်ကို type
      parameter လို့ ခေါ်ပြီး၊ သုံးတဲ့အခါ ထည့်ပေးလိုက်တဲ့ type ကိုတော့ type argument လို့ ခေါ်ပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 15: Designing Your Types (generic types)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/designing-your-types-in-typescript",
        }
      - {
          title: "TypeScript Handbook: Generics (generic types)",
          url: "https://www.typescriptlang.org/docs/handbook/2/generics.html#generic-types",
        }
    actions:
      - id: open-board-a
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-value-fn
        type: whiteboard.apply
        at: { mark: draw-value-fn }
        upsertIds: [a-v-in, a-v-arrow-1, a-v-box, a-v-name, a-v-arrow-2, a-v-out, a-v-note]
        drawMs: 3200
      - id: draw-type-fn
        type: whiteboard.apply
        at: { mark: draw-type-fn }
        upsertIds: [a-t-in, a-t-arrow-1, a-t-box, a-t-name, a-t-arrow-2, a-t-out, a-t-note]
        drawMs: 3200
      - id: draw-words
        type: whiteboard.apply
        at: { mark: draw-words }
        upsertIds: [a-words]
        drawMs: 1600

  - id: starter
    narration: >
      [[mark:close-board]] ဒီနေ့ code ကို ကြည့်ရအောင်။ [[mark:open-api]] ဒါက ဆိုင်ရဲ့ API ကနေ ပြန်လာတဲ့
      ရလဒ်တွေအတွက် type တွေ ရေးထားတဲ့ ဖိုင်ပါ။ [[mark:select-menu-result]] menu ကို တောင်းလိုက်ရင် ရလဒ်က
      နှစ်မျိုး ဖြစ်နိုင်ပါတယ်။ အောင်မြင်ရင် ok က true ဖြစ်ပြီး data ထဲမှာ menu item တွေ ပါလာပါတယ်။
      မအောင်မြင်ရင်တော့ ok က false ဖြစ်ပြီး error တစ်ခု ပါလာပါတယ်။ lesson ၁၁ မှာ လေ့လာခဲ့တဲ့
      discriminated union ပါ။ [[mark:select-order-result]] အောက်က အော်ဒါ ရလဒ် type ကို ကြည့်ပါ။ data
      ရဲ့ type တစ်ခုပဲ ကွာပြီး ကျန်တာ အားလုံး တစ်ထပ်တည်းပါ။ အပေါ်က type ကို ကူးပြီး ရေးထားတာပါ။ ဆိုင်မှာ
      API အသစ် တစ်ခု ထပ်လာတိုင်း ဒီလို ထပ်ကူးရမှာ ဖြစ်ပြီး၊ နောင်မှာ ရလဒ်ရဲ့ ပုံစံကို ပြောင်းချင်ရင်လည်း
      ကူးထားတဲ့ နေရာတိုင်းမှာ လိုက်ပြင်ရပါမယ်။ [[mark:open-main]] main ဖိုင်မှာတော့ ဒီ type နှစ်ခုနဲ့
      menu ရလဒ် တစ်ခု၊ အော်ဒါ ရလဒ် တစ်ခု ရေးထားပါတယ်။ [[mark:select-prints]] နောက်ဆုံး နှစ်ကြောင်းက menu
      မှာ ဘယ်နှစ်မျိုး ရှိလဲ ဆိုတာနဲ့၊ အော်ဒါ မအောင်မြင်တဲ့ အခါ error ရဲ့ message ကို ထုတ်ပြပါတယ်။
    sources:
      - {
          title: "TypeScript Handbook: Narrowing (discriminated unions)",
          url: "https://www.typescriptlang.org/docs/handbook/2/narrowing.html#discriminated-unions",
        }
      - {
          title: "Total TypeScript Essentials, ch. 15: Designing Your Types (generic types remove duplication)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/designing-your-types-in-typescript",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: open-api
        type: workspace.openFile
        at: { mark: open-api }
        path: src/api.ts
      - id: select-menu-result
        type: editor.select
        at: { mark: select-menu-result }
        target:
          {
            file: src/api.ts,
            text: "export type MenuResult =\n  { ok: true; data: MenuItem[] } | { ok: false; error: Error };",
            occurrence: 1,
          }
      - id: select-order-result
        type: editor.select
        at: { mark: select-order-result }
        target:
          {
            file: src/api.ts,
            text: "export type OrderResult =\n  { ok: true; data: Order } | { ok: false; error: Error };",
            occurrence: 1,
          }
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: src/main.ts
      - id: select-prints
        type: editor.select
        at: { mark: select-prints }
        target:
          {
            file: src/main.ts,
            text: "if (menuResult.ok) console.log(\"menu\", menuResult.data.length, \"မျိုး\");\nif (!orderResult.ok) console.log(orderResult.error.message);",
            occurrence: 1,
          }

  - id: panel
    narration: >
      [[mark:panel-ready]] ညာဘက် panel ရဲ့ Output မှာ menu က နှစ်မျိုး ရှိတယ် ဆိုတာနဲ့၊ အော်ဒါ ၇ ကို
      မတွေ့ဘူး ဆိုတဲ့ error message ထွက်လာပါတယ်။ Errors မှာလည်း ဘာမှ မရှိပါဘူး။ ဆိုတော့ program က
      မှန်နေပေမယ့်၊ ပြဿနာက type တွေ ထပ်နေတာပါ။ ကူးထားတဲ့ type တွေကို type parameter ပါတဲ့ type
      တစ်ခုတည်းနဲ့ အစားထိုးကြည့်ရအောင်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 15: Designing Your Types (generic types)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/designing-your-types-in-typescript",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-start-clean
        type: expect.preview
        at: { afterAction: open-preview }
