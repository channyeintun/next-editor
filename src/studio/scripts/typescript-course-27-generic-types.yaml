  - id: generic
    chapter: "Type parameter"
    narration: >
      [[mark:type-generic]] api ဖိုင်ကို ပြန်သွားပြီး၊ ကူးထားတဲ့ type တွေရဲ့ အပေါ်မှာ type အသစ် တစ်ခု
      ရေးပါမယ်။ နာမည်ကို ApiResult လို့ ပေးပြီး၊ နာမည်ရဲ့ နောက်မှာ TData ဆိုတဲ့ type parameter ကို
      ကြေညာထားပါတယ်။ ညီမျှခြင်းရဲ့ ညာဘက်ကတော့ အရင် type တွေနဲ့ ပုံစံ အတူတူပါပဲ။ [[mark:select-tdata]]
      ကွာတာက data ရဲ့ type နေရာမှာ type တစ်ခုကို ပုံသေ မရေးတော့ဘဲ TData ကို ထည့်ထားတာပါ။ function ရဲ့
      parameter လိုပဲ၊ ဒီ နာမည်က သုံးတဲ့သူ ထည့်ပေးမယ့် type ကို ကိုယ်စားပြုပါတယ်။ panel မှာတော့ ဘာမှ
      မပြောင်းသေးပါဘူး၊ type ကို ကြေညာရုံပဲ ရှိပြီး ဘယ်နေရာမှာမှ မသုံးရသေးလို့ပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 15: Designing Your Types (generic types, type parameters)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/designing-your-types-in-typescript",
        }
      - {
          title: "TypeScript Handbook: Generics (generic types)",
          url: "https://www.typescriptlang.org/docs/handbook/2/generics.html#generic-types",
        }
    actions:
      - id: open-api-2
        type: workspace.openFile
        at: { mark: type-generic }
        path: src/api.ts
      - id: type-generic
        type: editor.type
        at: { afterAction: open-api-2 }
        target:
          {
            file: src/api.ts,
            after: "export type Order = { id: number; item: string; quantity: number };\n\n",
            occurrence: 1,
          }
        text: "type ApiResult<TData> =\n  | { ok: true; data: TData }\n  | { ok: false; error: Error };\n\n"
        cadence: line-by-line
      - id: select-tdata
        type: editor.select
        at: { mark: select-tdata }
        target: { file: src/api.ts, text: "data: TData", occurrence: 1 }
      - id: expect-generic-clean
        type: expect.preview
        at: { afterAction: type-generic }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: kitchen
    narration: >
      [[mark:type-kitchen]] ဒါဆို ဒီ type ကို function ခေါ်သလို ခေါ်ကြည့်ရအောင်။ ဖိုင်ရဲ့ အောက်ဆုံးမှာ
      မီးဖိုချောင် screen အတွက် ရလဒ် type တစ်ခု ရေးပါမယ်။ မီးဖိုချောင်က ဖျော်ရမယ့် အော်ဒါ စာရင်းကို
      လိုချင်တာ ဖြစ်လို့၊ type argument အနေနဲ့ အော်ဒါ array ကို ထည့်ပေးပြီး၊ ဘာ ရလာလဲ ဆိုတာ query
      comment နဲ့ မေးကြည့်ပါမယ်။ [[mark:read-kitchen]] Types အပိုင်းမှာ အဖြေ ပေါ်လာပါပြီ။ ok က false
      ဖြစ်တဲ့ဘက်မှာ error ပါပြီး၊ true ဖြစ်တဲ့ဘက်မှာတော့ data က အော်ဒါ array ဖြစ်နေပါတယ်။ TData ရဲ့
      နေရာမှာ ကိုယ် ထည့်ပေးလိုက်တဲ့ type ဝင်သွားပြီး၊ union အပြည့်အစုံ ထွက်လာတာပါ။ ဆိုတော့ တစ်ကြောင်းမှ
      ကူးရေးစရာ မလိုဘဲ type အသစ် တစ်ခု ရသွားပါပြီ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 15: Designing Your Types (passing type arguments)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/designing-your-types-in-typescript",
        }
      - {
          title: "TypeScript Handbook: Generics",
          url: "https://www.typescriptlang.org/docs/handbook/2/generics.html",
        }
    actions:
      - id: type-kitchen
        type: editor.type
        at: { mark: type-kitchen }
        target:
          {
            file: src/api.ts,
            after: "  { ok: true; data: Order } | { ok: false; error: Error };\n",
            occurrence: 1,
          }
        text: "\n// မီးဖိုချောင် screen ရဲ့ ရလဒ်\nexport type KitchenResult = ApiResult<Order[]>;\n//          ^?\n"
        cadence: line-by-line
      - id: expect-kitchen-type
        type: expect.preview
        at: { afterAction: type-kitchen }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        textContains: "type KitchenResult = {"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-kitchen-data
        type: expect.preview
        at: { afterAction: expect-kitchen-type }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-1 }
        textContains: "data: Order[];"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-kitchen-error
        type: expect.preview
        at: { afterAction: expect-kitchen-data }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-1 }
        textContains: "error: Error;"
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: replace
    narration: >
      [[mark:type-menu-alias]] အခု ကူးထားတဲ့ type တွေကိုလည်း ဒီ type နဲ့ အစားထိုးပါမယ်။ menu ရလဒ်ကို
      ApiResult ထဲ menu item array ထည့်ပြီး ရေးလိုက်ပြီး၊ အဟောင်းကိုတော့ နှိုင်းယှဉ်ကြည့်လို့ ရအောင်
      comment အနေနဲ့ ချန်ထားပါမယ်။ တကယ့် project မှာတော့ ဖျက်ပစ်လိုက်ရုံပါပဲ။ [[mark:type-order-alias]] အော်ဒါ ရလဒ်ကိုလည်း အဲဒီ အတိုင်း အော်ဒါ
      type ကို ထည့်ပြီး ရေးလိုက်ပါမယ်။ [[mark:read-replaced]] Errors မှာ ဘာမှ မပေါ်လာသလို၊ Output
      ကလည်း အရင်အတိုင်းပါပဲ။ ပုံစံ တူတဲ့ type တွေ ထွက်လာလို့ main ဖိုင်ကို ဘာမှ ပြင်စရာ မလိုပါဘူး။ type
      တွေက run တဲ့ အချိန်မှာ ဖယ်ထုတ်ပြီးသား ဖြစ်လို့ program ရဲ့ အလုပ်လုပ်ပုံလည်း မပြောင်းပါဘူး။ အခုဆိုရင်
      ရလဒ်ရဲ့ ပုံစံကို ApiResult တစ်နေရာတည်းမှာပဲ ထိန်းထားလို့၊ ပြောင်းချင်ရင် အဲဒီ တစ်နေရာကိုပဲ
      ပြင်ရပါတော့မယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 15: Designing Your Types (generic types remove duplication)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/designing-your-types-in-typescript",
        }
      - {
          title: "TypeScript Handbook: Generics (generic types)",
          url: "https://www.typescriptlang.org/docs/handbook/2/generics.html#generic-types",
        }
    actions:
      - id: type-menu-alias
        type: editor.type
        at: { mark: type-menu-alias }
        target: { file: src/api.ts, after: "export type MenuResult =\n", occurrence: 1 }
        text: "  ApiResult<MenuItem[]>;\n//"
        cadence: block
      - id: type-order-alias
        type: editor.type
        at: { mark: type-order-alias }
        target: { file: src/api.ts, after: "export type OrderResult =\n", occurrence: 1 }
        text: "  ApiResult<Order>;\n//"
        cadence: block
      - id: expect-replaced-clean
        type: expect.preview
        at: { afterAction: type-order-alias }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-replaced-output
        type: expect.preview
        at: { afterAction: expect-replaced-clean }
        timeoutMs: 5000
        target: { by: testId, value: ts-output }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-replaced-menu
        type: expect.preview
        at: { afterAction: expect-replaced-output }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-1 }
        textContains: "menu 2 မျိုး"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: two-params
    chapter: "Type parameter နှစ်ခု"
    narration: >
      [[mark:type-kitchen-error]] မီးဖိုချောင်က ပြန်ပေးတဲ့ error တွေကတော့ ရိုးရိုး Error မဟုတ်ဘဲ၊ ဘယ်
      အပိုင်းမှာ ပြဿနာ ဖြစ်လဲ ဆိုတာ ပါပါတယ်။ အဲဒီ ပုံစံကို station ဆိုတဲ့ property နဲ့ type တစ်ခု ရေးထားပါမယ်။
      ဒါပေမဲ့ ApiResult ရဲ့ error က Error လို့ ပုံသေ ဖြစ်နေလို့၊ ဒီ type ကို ထည့်ပေးလို့ မရသေးပါဘူး။
      [[mark:type-terror]] ဒါကြောင့် ApiResult မှာ TError ဆိုတဲ့ ဒုတိယ type parameter တစ်ခု ထပ်ထည့်ပြီး၊
      [[mark:type-use-terror]] error ရဲ့ type နေရာမှာ သုံးလိုက်ပါမယ်။ [[mark:read-required]] Errors မှာ
      error သုံးခု ပေါ်လာပါပြီ။ ApiResult ကို သုံးထားတဲ့ နေရာ သုံးနေရာလုံးမှာ type argument နှစ်ခု လိုတယ်လို့
      ပြောနေတာပါ။ type parameter နှစ်ခု ကြေညာထားရင်၊ သုံးတဲ့ အခါမှာလည်း နှစ်ခုလုံး ထည့်ပေးရပါတယ်။ Types
      မှာလည်း မီးဖိုချောင် ရလဒ်ကို တွက်လို့ မရတော့လို့ any လို့ ပြနေပါတယ်။ [[mark:type-kitchen-arg]]
      မီးဖိုချောင် ရလဒ်မှာ ဒုတိယ type argument အနေနဲ့ ခုနက error type ကို ထည့်ပေးလိုက်ပါမယ်။
      [[mark:read-kitchen-arg]] error တစ်ခု ပျောက်သွားပြီး၊ Types မှာ error ရဲ့ type က မီးဖိုချောင် error
      type ဖြစ်သွားပါပြီ။ ကျန်တဲ့ error နှစ်ခုကတော့ menu နဲ့ အော်ဒါမှာ ဒုတိယ type argument မပါသေးလို့ပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 15: Designing Your Types (multiple type parameters; all type arguments must be provided)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/designing-your-types-in-typescript",
        }
      - {
          title: "TypeScript Handbook: Generics (generic types)",
          url: "https://www.typescriptlang.org/docs/handbook/2/generics.html#generic-types",
        }
    actions:
      - id: type-kitchen-error
        type: editor.type
        at: { mark: type-kitchen-error }
        target: { file: src/api.ts, after: "// မီးဖိုချောင် screen ရဲ့ ရလဒ်\n", occurrence: 1 }
        text: "type KitchenError = { station: string };\n"
        cadence: fast-explainer
      - id: type-terror
        type: editor.type
        at: { mark: type-terror }
        target: { file: src/api.ts, after: "type ApiResult<TData", occurrence: 1 }
        text: ", TError"
        cadence: fast-explainer
      - id: type-use-terror
        type: editor.type
        at: { mark: type-use-terror }
        target: { file: src/api.ts, after: "  | { ok: false; error: ", occurrence: 1 }
        text: "T"
        cadence: fast-explainer
      - id: expect-three-errors
        type: expect.preview
        at: { afterAction: type-use-terror }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "3" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-2314
        type: expect.preview
        at: { afterAction: expect-three-errors }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-code, value: "2314" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-2314-text
        type: expect.preview
        at: { afterAction: expect-2314 }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-3 }
        textContains: "Generic type 'ApiResult' requires 2 type argument(s)."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-kitchen-any
        type: expect.preview
        at: { afterAction: expect-2314-text }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-1 }
        attribute: { name: data-type, value: "type KitchenResult = any" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-kitchen-arg
        type: editor.type
        at: { mark: type-kitchen-arg }
        target: { file: src/api.ts, after: "ApiResult<Order[]", occurrence: 1 }
        text: ", KitchenError"
        cadence: fast-explainer
      - id: expect-two-errors
        type: expect.preview
        at: { afterAction: type-kitchen-arg }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-kitchen-error-type
        type: expect.preview
        at: { afterAction: expect-two-errors }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-1 }
        textContains: "error: KitchenError;"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: default
    chapter: "Default type ပေးခြင်း"
    narration: >
      [[mark:type-default]] menu နဲ့ အော်ဒါ အတွက်ကတော့ ရိုးရိုး Error ပဲ လိုတာ ဖြစ်လို့၊ နေရာတိုင်းမှာ
      Error လို့ လိုက်ရေးမယ့်အစား TError ကို default type တစ်ခု ပေးလိုက်ပါမယ်။ function parameter ကို
      default တန်ဖိုး ပေးတာနဲ့ သဘော အတူတူပါပဲ။ [[mark:read-default]] Errors မှာ error အားလုံး
      ပျောက်သွားပါပြီ။ type argument တစ်ခုတည်း ထည့်ပေးရင် TError က Error ဖြစ်သွားပြီး၊ နှစ်ခု
      ထည့်ပေးရင်တော့ ထည့်ပေးတဲ့ type ကို သုံးပါတယ်။ ဆိုတော့ default ပါတဲ့ type parameter က မထည့်လည်း ရတဲ့
      parameter လို ဖြစ်သွားတာပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 15: Designing Your Types (default type parameters)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/designing-your-types-in-typescript",
        }
      - {
          title: "TypeScript Handbook: Generics (generic parameter defaults)",
          url: "https://www.typescriptlang.org/docs/handbook/2/generics.html#generic-parameter-defaults",
        }
    actions:
      - id: type-default
        type: editor.type
        at: { mark: type-default }
        target: { file: src/api.ts, after: "type ApiResult<TData, TError", occurrence: 1 }
        text: " = Error"
        cadence: fast-explainer
      - id: expect-default-clean
        type: expect.preview
        at: { afterAction: type-default }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: constraint
    chapter: "Constraint နဲ့ ကန့်သတ်ခြင်း"
    narration: >
      ဆိုင်ရဲ့ ငွေကိုင် screen က error တိုင်းရဲ့ message ကို ပြပေးရပါတယ်။
      ဒါကြောင့် TError နေရာမှာ ဘယ် type ကို ထည့်ထည့်၊ message ဆိုတဲ့ string property တော့ ပါကို
      ပါရမယ်လို့ စည်းကမ်း သတ်မှတ်ချင်ပါတယ်။ [[mark:type-constraint]] TError ရဲ့ နောက်မှာ extends နဲ့
      message ပါတဲ့ object type ကို ရေးလိုက်ပါမယ်။ ဒါကို constraint လို့ ခေါ်ပါတယ်။ type parameter ကို
      ဘာ type တွေပဲ လက်ခံမလဲ ကန့်သတ်တာပါ။ [[mark:read-constraint]] Errors မှာ error တစ်ခု ပေါ်လာပါပြီ။
      မီးဖိုချောင် error type က constraint နဲ့ မကိုက်ဘူးလို့ ပြောပြီး၊ ဒုတိယ အပိုင်းမှာ message property
      မပါဘူးလို့ အကြောင်းရင်းကို ပြထားပါတယ်။ error က ApiResult ကို သုံးတဲ့ နေရာမှာ ချက်ချင်း ပေါ်လာလို့၊
      ငွေကိုင် screen ကို မရောက်ခင်ကတည်းက သိနိုင်ပါတယ်။ Error type ကတော့ message ရှိပြီးသား ဖြစ်လို့ menu
      နဲ့ အော်ဒါမှာ error မရှိပါဘူး။ [[mark:type-message]] မီးဖိုချောင် error type ထဲကို message
      ထည့်ပေးလိုက်ပါမယ်။ [[mark:read-message]] error ပျောက်သွားပါပြီ။ ဒီမှာ သတိထားရမှာက၊ station ဆိုတဲ့
      property က constraint ထဲမှာ မပါပေမယ့် error မတက်တာပါ။ constraint က လိုအပ်တဲ့ property တွေ ပါမပါကိုပဲ
      စစ်ပြီး၊ အပို property တွေကိုတော့ ခွင့်ပြုပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 15: Designing Your Types (type parameter constraints; constraints describe required properties)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/designing-your-types-in-typescript",
        }
      - {
          title: "TypeScript Handbook: Generics (generic constraints)",
          url: "https://www.typescriptlang.org/docs/handbook/2/generics.html#generic-constraints",
        }
    actions:
      - id: type-constraint
        type: editor.type
        at: { mark: type-constraint }
        target: { file: src/api.ts, after: "type ApiResult<TData, TError", occurrence: 1 }
        text: " extends { message: string }"
        cadence: fast-explainer
      - id: expect-one-error
        type: expect.preview
        at: { afterAction: type-constraint }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-2344
        type: expect.preview
        at: { afterAction: expect-one-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-code, value: "2344" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-2344-text
        type: expect.preview
        at: { afterAction: expect-2344 }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Property 'message' is missing in type 'KitchenError'"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-message
        type: editor.type
        at: { mark: type-message }
        target: { file: src/api.ts, after: "type KitchenError = { ", occurrence: 1 }
        text: "message: string; "
        cadence: fast-explainer
      - id: expect-constraint-clean
        type: expect.preview
        at: { afterAction: type-message }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: extends
    chapter: "extends ရဲ့ အဓိပ္ပာယ်"
    narration: >
      [[mark:board-extends]] ဒီ lesson မှာ extends ကို constraint အတွက် သုံးခဲ့ပေမယ့်၊ ဒီ စကားလုံးကို
      အရင် lesson တွေမှာလည်း တွေ့ခဲ့ပြီးသားပါ။ [[mark:draw-generic]] type parameter ရဲ့ နောက်မှာ
      ဆိုရင်၊ အဲဒီ type parameter ထဲကို ဘာ type တွေ ထည့်လို့ ရလဲ ကန့်သတ်တာပါ။ [[mark:draw-class]] class
      ရဲ့ နောက်မှာ ဆိုရင်တော့ class တစ်ခုကနေ အမွေဆက်ခံတာ ဖြစ်ပြီး၊ ဒါက runtime မှာလည်း တကယ် ရှိတဲ့
      JavaScript feature ပါ။ [[mark:draw-interface]] interface ရဲ့ နောက်မှာ ဆိုရင်တော့ တခြား interface
      တစ်ခုရဲ့ property တွေကို ယူပြီး ချဲ့တာပါ။ စကားလုံး တစ်ခုတည်း ဖြစ်ပေမယ့်၊ ဘယ်နေရာမှာ ရေးလဲ ဆိုတာပေါ်
      မူတည်ပြီး အဓိပ္ပာယ် ကွာသွားပါတယ်။ [[mark:draw-conditional]] နောက်ထပ် အဓိပ္ပာယ် တစ်ခုကတော့
      conditional type ထဲက extends ပါ။ အဲဒီမှာတော့ type တစ်ခုက နောက် type တစ်ခုနဲ့ ကိုက်မကိုက် စစ်ပြီး၊ if
      else လိုပဲ အဖြေ နှစ်ခုထဲက တစ်ခုကို ရွေးပါတယ်။ ဒါကို နောက် lesson မှာ အသေးစိတ် ကြည့်ပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 15: Designing Your Types (extends, extends, extends)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/designing-your-types-in-typescript",
        }
      - {
          title: "TypeScript Handbook: Classes (extends clauses)",
          url: "https://www.typescriptlang.org/docs/handbook/2/classes.html#extends-clauses",
        }
      - {
          title: "TypeScript Handbook: Object Types (extending types)",
          url: "https://www.typescriptlang.org/docs/handbook/2/objects.html#extending-types",
        }
      - {
          title: "TypeScript Handbook: Conditional Types",
          url: "https://www.typescriptlang.org/docs/handbook/2/conditional-types.html",
        }
    actions:
      - id: open-board-b
        type: whiteboard.apply
        at: { mark: board-extends }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-generic
        type: whiteboard.apply
        at: { mark: draw-generic }
        upsertIds: [b-gen-code, b-gen-desc]
        drawMs: 1800
      - id: draw-class
        type: whiteboard.apply
        at: { mark: draw-class }
        upsertIds: [b-cls-code, b-cls-desc]
        drawMs: 1800
      - id: draw-interface
        type: whiteboard.apply
        at: { mark: draw-interface }
        upsertIds: [b-int-code, b-int-desc]
        drawMs: 1800
      - id: draw-conditional
        type: whiteboard.apply
        at: { mark: draw-conditional }
        upsertIds: [b-cond-code, b-cond-desc]
        drawMs: 1600

  - id: recap
    narration: >
      [[mark:close-extends]] ဒါဆို ပြန်ချုပ်ရရင်၊ generic type ဆိုတာ type parameter တွေကို လက်ခံပြီး type
      အသစ်ကို ပြန်ပေးတဲ့၊ type တွေအတွက် function တစ်ခုပါ။ ကူးရေးထားတဲ့ type တွေကို အဲဒီ type တစ်ခုတည်းမှာ
      စုထားနိုင်ပါတယ်။ [[mark:recap-rules]] သုံးတဲ့အခါ type argument တွေကို အားလုံး ထည့်ပေးရပေမယ့်၊ default
      type ပါတဲ့ parameter ကိုတော့ ချန်ထားလို့ ရပါတယ်။ extends နဲ့ constraint ထည့်ထားရင် လိုအပ်တဲ့ property
      တွေကို စစ်ပေးပြီး၊ အပို property တွေကိုတော့ ခွင့်ပြုပါတယ်။ နောက် lesson မှာတော့ string ရဲ့ ပုံစံကို
      type နဲ့ သတ်မှတ်ပေးတဲ့ template literal type နဲ့၊ type ပိုင်းမှာ if else လို စစ်ပေးတဲ့ conditional
      type ကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 15: Designing Your Types",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/designing-your-types-in-typescript",
        }
    actions:
      - id: close-extends
        type: whiteboard.apply
        at: { mark: close-extends }
        open: false
      - id: select-generic
        type: editor.select
        at: { mark: recap-rules }
        target:
          {
            file: src/api.ts,
            text: "type ApiResult<TData, TError extends { message: string } = Error> =",
            occurrence: 1,
          }
      - id: expect-file-generic
        type: expect.file
        at: { afterAction: close-extends }
        path: src/api.ts
        contains: "type ApiResult<TData, TError extends { message: string } = Error> =\n  | { ok: true; data: TData }\n  | { ok: false; error: TError };"
      - id: expect-file-aliases
        type: expect.file
        at: { afterAction: close-extends }
        path: src/api.ts
        contains: "export type MenuResult =\n  ApiResult<MenuItem[]>;"
      - id: expect-file-kitchen
        type: expect.file
        at: { afterAction: close-extends }
        path: src/api.ts
        contains: "type KitchenError = { message: string; station: string };\nexport type KitchenResult = ApiResult<Order[], KitchenError>;"
checks:
  - type: timing.p95Ms
    max: 300
