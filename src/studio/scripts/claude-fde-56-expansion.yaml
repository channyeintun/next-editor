      အောင်မြင်မှုနဲ့ ဖမ်းမိတဲ့ အမှားကို ပုံမှန် မျှဝေပြီး၊ နောက် use case ကို စံ လေးချက်နဲ့ ပြန်ရွေးပါတယ်။
      [[mark:recap-2]] course တစ်ခုလုံးကို တစ်ကြောင်းတည်းနဲ့ ပြောရရင်တော့၊ forward deployed engineer ဆိုတာ model ကို
      နားလည်ပြီး၊ ကုမ္ပဏီရဲ့ system တွေထဲမှာ တည်ဆောက်ကာ၊ လူတွေ တကယ် သုံးလာအောင် ဖြန့်ကျက်ပေးတဲ့သူပါ။
