  - id: review
    chapter: Impact review
    narration: >
      [[mark:r-open]] ဒါတွေကို impact review ထဲ ချရေးကြည့်ရအောင်။
      [[mark:type-measured]] ပထမ အပိုင်းမှာ system ဂဏန်းနဲ့ လူတွေ ပြောတာကို ခွဲရေးပါတယ်။ survey ဂဏန်းဘေးမှာ
      ကိုယ်တိုင် ပြောတာ လို့ ရေးထားလို့၊ ဖတ်တဲ့သူက အဲဒါကို တိုင်းထားတဲ့ ဂဏန်းနဲ့ မရောမိပါဘူး။
      [[mark:type-share]] ဒုတိယ အပိုင်းက ဘာကို မျှဝေမလဲ ဆိုတာပါ။ path ရဲ့ အခြေခံ စည်းမျဉ်း တစ်ခုက အောင်မြင်မှုကို
      စနစ်တကျ မျှဝေတာပါ။ အဖွဲ့အစည်း အပြောင်းအလဲအတွက် လူသိများတဲ့ အဆင့် ရှစ်ဆင့် ပုံစံ တစ်ခုမှာလည်း အစောပိုင်း အောင်မြင်မှု အသေးလေးတွေကို စုပြီး
      မကြာခဏ ပြောပြဖို့ ပါပါတယ်။
      [[mark:share-2]] နေခြည် မှာတော့ လစဉ် newsletter မှာ ဌာန တစ်ခုရဲ့ ဖြစ်ရပ် တစ်ခုကို ထည့်ပြီး၊ စစ်ဆေးမှုက ဖမ်းမိခဲ့တဲ့
      အမှားကိုလည်း ထည့်ပါတယ်။ မုန်တိုင်းကျတဲ့ညကနေ သင်ခဲ့တာက အမှားကို ဖုံးထားရင် ထပ်ဖြစ်တတ်တယ် ဆိုတာပါ။
    sources:
      - {
          title: "Kotter: The 8 steps for leading change",
          url: "https://www.kotterinc.com/methodology/8-steps/",
        }
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
    actions:
      - { id: close-measure, type: whiteboard.apply, at: { mark: r-open }, open: false }
      - {
          id: reopen-review,
          type: workspace.openFile,
          at: { afterAction: close-measure },
          path: notebook/56-impact-review.md,
        }
      - id: type-measured
        type: editor.type
        at: { mark: type-measured }
        cadence: line-by-line
        target: { file: notebook/56-impact-review.md, after: "## ဘာကို တိုင်းခဲ့လဲ\n" }
        text: "- system: weekly active 290 / 430 · ပထမ ပြန်ဖြေချိန် 38 → 24 မိနစ် · report job 140 ပြီး\n- လူ: survey မှာ တစ်ပတ် 2.5 နာရီ ချွေတာ (ကိုယ်တိုင် ပြောတာ) · team lead ဖြစ်ရပ် 3 ခု\n"
      - id: type-share
        type: editor.type
        at: { mark: share-2 }
        cadence: line-by-line
        target: { file: notebook/56-impact-review.md, after: "## ဘာကို မျှဝေမလဲ\n" }
        text: "- လစဉ် newsletter: ဌာန 1 ခုရဲ့ ဖြစ်ရပ် · စစ်ဆေးမှုက ဖမ်းမိခဲ့တဲ့ အမှားလည်း ပါ\n"
      - id: sel-self
        type: editor.select
        at: { afterAction: type-measured }
        target:
          file: notebook/56-impact-review.md
          text: "(ကိုယ်တိုင် ပြောတာ)"
      - id: sel-share
        type: editor.select
        at: { mark: type-share }
        target:
          file: notebook/56-impact-review.md
          text: "## ဘာကို မျှဝေမလဲ"

  - id: next
    chapter: နောက် ဘာလုပ်မလဲ
    narration: >
      [[mark:type-next]] တတိယ အပိုင်းက နောက် ဘာလုပ်မလဲ ဆိုတာပါ။ ဒီမှာ Part ၉ မှာ use case ကို စိစစ်ခဲ့တဲ့ စံ လေးချက်ကို
      ပြန်သုံးပါတယ်။ volume၊ complexity၊ measurability နဲ့ readiness ပါ။ field technician ၁၃၀ က အလုပ်ပြီးတိုင်း ရေးရတဲ့
      job မှတ်စုက အရေအတွက် များပြီး၊ ရေးချိန်ကိုလည်း တိုင်းလို့ ရပါတယ်။ ဒါပေမဲ့ technician တွေထဲမှာ champion
      မရှိသေးလို့ readiness က အားနည်းပါတယ်။ ဒါကြောင့် champion နှစ်ယောက် အရင် ရှာပြီးမှ စပါမယ်။
      [[mark:type-next2]] Administrator Guide ကလည်း team အသစ်ဆီ ချဲ့တဲ့အခါ use case ကိုက်ညီပြီး champion လုပ်ချင်တဲ့သူ
      ရှိတဲ့ team ကို ဦးစားပေးဖို့ အကြံပေးပါတယ်။ technician တွေအတွက် champion ကို အရင် ရှာတာလည်း ဒီ အကြောင်းကြောင့်ပါ။ finance ရဲ့ invoice agent ကတော့ champion နဲ့
      တွဲပြီး ဆက်လုပ်နေပါတယ်။
    sources:
      - {
          title: "Claude Enterprise Administrator Guide (Anthropic Academy)",
          url: "https://academy.claude.com/tutorials/claude-enterprise-administrator-guide",
        }
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
    actions:
      - id: type-next
        type: editor.type
        at: { mark: type-next, offsetMs: 2500 }
        cadence: line-by-line
        target: { file: notebook/56-impact-review.md, after: "## နောက် ဘာလုပ်မလဲ\n" }
        text: "- field technician job မှတ်စု: volume၊ measurability ကိုက် · readiness အတွက် champion 2 ယောက် အရင်\n"
      - id: type-next2
        type: editor.type
        at: { mark: type-next2 }
        cadence: line-by-line
        target: { file: notebook/56-impact-review.md, after: "champion 2 ယောက် အရင်\n" }
        text: "- finance invoice agent: champion နဲ့ တွဲပြီး ဆက်\n"
      - id: expect-next
        type: expect.file
        at: { afterAction: type-next2 }
        path: notebook/56-impact-review.md
        contains: "- field technician job မှတ်စု: volume၊ measurability ကိုက် · readiness အတွက် champion 2 ယောက် အရင်\n"

  - id: look-back
    chapter: မုန်တိုင်းညကနေ ယနေ့အထိ
    narration: >
      [[mark:b-title]] ခြောက်လ ဆိုတာ ဒီ course ရဲ့ ဇာတ်လမ်း အဆုံးပါ။ engagement တစ်ခုလုံးကို လိုင်း တစ်ကြောင်းတည်းနဲ့
      ပြန်ကြည့်ရအောင်။
      [[mark:b-1]] အစက မုန်တိုင်းကျတဲ့ညပါ။ personal account တွေနဲ့ ရေးခဲ့တဲ့ အဖြေ ၆၄ စောင်က လိုင်းကျနေတဲ့ customer တွေကို
      router ပြန်ဖွင့်ခိုင်းခဲ့ပါတယ်။ model မပျက်ခဲ့သလို လူတွေလည်း မပေါ့ဆခဲ့ပါဘူး။ ဘယ်သူမှ design မဆွဲခဲ့တာပါ။
      [[mark:b-2]] ပထမ ကိုးပတ်လောက်မှာ model ဘယ်လို ပြုမူလဲ ဆိုတာကို နားလည်အောင် လုပ်ပြီး၊ Reply assistant ကို Claude Platform
      ပေါ်မှာ ဆောက်ပါတယ်။ Billing team နဲ့ Claude Code ကို သုံးတတ်အောင် လုပ်ပြီး၊ ticket နဲ့ NMS data ကို Claude
      မြင်နိုင်အောင် ချိတ်ပေးကာ၊ team တွေ ထပ်ခါထပ်ခါ လုပ်ရတဲ့ လုပ်နည်းတွေကို skill အဖြစ် ရေးပေးပါတယ်။
      [[mark:b-3]] ရက် ၃၀ activation မှာ developer နှစ်ယောက်က report job ၁၄၀ ကို အလုပ်ရက် ၁၇ ရက်နဲ့ ရွှေ့ပြီး၊ output
      တိုက်စစ်မှုက job သုံးခုကို ဖမ်းမိခဲ့ပါတယ်။
      [[mark:b-4]] အဲဒီနောက် ဝန်ထမ်း ၄၃၀ အတွက် launch လုပ်၊ CoE ကို ဖွဲ့ပြီး၊ အခု ခြောက်လအကြာမှာ နောက် use case ကို
      ရွေးနေပါပြီ။
      [[mark:b-5]] ဒီ လိုင်း တစ်လျှောက်မှာ ပြောင်းသွားတာက model တစ်ခုတည်း မဟုတ်ပါဘူး။ model က ဘာကို မြင်ရမလဲ၊ ရလဒ်ကို
      ဘယ်သူ စစ်မလဲ၊ AI သုံးလို့ တကယ် အကျိုးရှိမရှိ ဘယ်လို တိုင်းမလဲ ဆိုတဲ့ မေးခွန်းတွေကို နေခြည် ရဲ့ လူတွေ ကိုယ်တိုင်
      ဖြေတတ်လာတာပါ။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
    actions:
      - {
          id: draw-b-title,
          type: whiteboard.apply,
          at: { mark: b-title },
          open: true,
          clear: true,
          upsertIds: [b-title, b-axis],
          drawMs: 900,
        }
      - { id: draw-b-1, type: whiteboard.apply, at: { mark: b-1 }, upsertIds: [b-1], drawMs: 900 }
      - { id: draw-b-2, type: whiteboard.apply, at: { mark: b-2 }, upsertIds: [b-2], drawMs: 900 }
      - { id: draw-b-3, type: whiteboard.apply, at: { mark: b-3 }, upsertIds: [b-3], drawMs: 900 }
      - {
          id: draw-b-4,
          type: whiteboard.apply,
          at: { mark: b-4 },
          upsertIds: [b-4, b-5],
          drawMs: 1200,
        }
      - { id: point-b-1, type: whiteboard.point, at: { mark: b-5 }, target: { assetId: b-1 } }

  - id: three-kinds
    chapter: FDE ရဲ့ အလုပ် သုံးမျိုး
    narration: >
      [[mark:k-open]] ပထမဆုံး lesson မှာ FDE ရဲ့ အလုပ်ကို သုံးမျိုး ခွဲခဲ့တာ မှတ်မိမှာပါ။ course တစ်ခုလုံးကလည်း ဒီ
      သုံးမျိုးအတိုင်း သွားခဲ့ပါတယ်။
      [[mark:k-1]] ပထမ တစ်မျိုးက နားလည်တာပါ။ model က ဘာကို သိပြီး ဘာကို မသိလဲ၊ တစ်ခါမှာ ဘာကို မြင်နိုင်လဲ၊ ညွှန်ကြားချက်နဲ့
      ဘယ်လောက် ပြောင်းလို့ရလဲ ဆိုတဲ့ သဘာဝတွေပါ။ AI နဲ့ အလုပ်လုပ်တဲ့ အလေ့အကျင့် လေးခုနဲ့၊ prompt မရေးခင် ဆုံးဖြတ်ရမယ့်
      အချက် လေးခုလည်း ပါပါတယ်။ အဲဒါကြောင့် မထင်မှတ်တဲ့ output တစ်ခုကို မြင်ရင် ဘာကြောင့်လဲ ဆိုတာ
      ခွဲခြားပြီး ပြင်နည်းကို ရွေးနိုင်ပါပြီ။
      [[mark:k-2]] ဒုတိယ တစ်မျိုးက တည်ဆောက်တာပါ။ Reply assistant ကို API ပေါ်မှာ ဆောက်တာ၊ Claude Code ကို စည်းကမ်းတွေနဲ့
      ထိန်းပြီး ကြာရှည် အလုပ်တွေကို လွှတ်ထားနိုင်အောင် လုပ်တာ၊ ကုမ္ပဏီရဲ့ system တွေကို Claude မြင်နိုင်အောင် ချိတ်တာ၊
      team ရဲ့ လုပ်နည်းတွေကို skill အဖြစ် ရေးတာတွေ ပါပါတယ်။
      [[mark:k-3]] တတိယ တစ်မျိုးက ဖြန့်ကျက်တာပါ။ use case ရွေးတာ၊ လူနည်းနည်းနဲ့ အရင် စမ်းတဲ့ pilot ကို design ဆွဲတာ၊
      မစခင် ဂဏန်း ယူထားတာ၊ အဆင့်လိုက် ဖြန့်တာနဲ့ champion၊ CoE တွေကို တည်ဆောက်တာ ပါပါတယ်။ ပထမဆုံး lesson မှာ
      ပြောခဲ့သလို နည်းပညာကို တပ်ဆင်တာက ပိုလွယ်တဲ့ အပိုင်းပါ။ လူတွေရဲ့ အလုပ်လုပ်ပုံကို ပြောင်းပြီး ရလဒ်ကို
      သက်သေပြတာက ပိုခက်ပါတယ်။ ဒီ သုံးမျိုးလုံးကို နေခြည် ရဲ့ ဇာတ်လမ်းထဲမှာ အစကနေ အဆုံးထိ လိုက်လုပ်ကြည့်ခဲ့ပါပြီ။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
    actions:
      - {
          id: close-line,
          type: whiteboard.apply,
          at: { mark: k-open, offsetMs: -1400 },
          open: false,
        }
      - {
          id: show-kinds,
          type: slide.show,
          at: { mark: k-open, offsetMs: -600 },
          slideId: three-kinds,
        }
      - { id: point-k-1, type: slide.point, at: { mark: k-1 }, target: { x: 0.15, y: 0.43 } }
      - { id: point-k-2, type: slide.point, at: { mark: k-2 }, target: { x: 0.15, y: 0.59 } }
      - { id: point-k-3, type: slide.point, at: { mark: k-3 }, target: { x: 0.15, y: 0.75 } }

  - id: your-turn
    chapter: ကိုယ့် ပထမ ခြေလှမ်း
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ကိုယ့် အလုပ်မှာ Claude ကို deploy လုပ်ဖို့ ဒီအပတ် လုပ်မယ့်
      ပထမ ခြေလှမ်း တစ်ခုကို ဒီ ခေါင်းစဉ်အောက်မှာ ရေးကြည့်ပါ။ ကြီးကြီးမားမား မဟုတ်ရပါဘူး။ ကိုယ့် team မှာ AI ကို အခု
      ဘယ်လို သုံးနေလဲ ဆိုတာကို ပထမဆုံး lesson ကလို ခေါင်းစဉ် လေးခုနဲ့ ချရေးတာ၊ ဒါမှမဟုတ် use case တစ်ခုကို စံ
      လေးချက်နဲ့ အမှတ်ပေးကြည့်တာမျိုးပါ။
      [[mark:turn-2]] ဘယ်နေ့ လုပ်မလဲ၊ ဘယ်သူနဲ့ လုပ်မလဲ ဆိုတာပါ ထည့်ရေးပါ။ account၊ key ဒါမှမဟုတ် install လုပ်စရာ
      တစ်ခုမှ မလိုတဲ့ ခြေလှမ်းနဲ့ စလို့ ရပါတယ်။ FDE ရဲ့ အလုပ်က တည်ဆောက်တာ မတိုင်ခင် မေးတာနဲ့ ချရေးတာကနေ စတာပါ။
