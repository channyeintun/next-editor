scenes:
  - id: open
    chapter: ခြောက်လအကြာ
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ Center of Excellence ကို ဖွဲ့ပြီး၊ ဌာနထဲမှာ ရှေ့ကနေ ကူညီတဲ့ champion တွေကို ဆရာ
      ဖြစ်လာအောင် လေ့ကျင့်ပေးတဲ့ train the trainer ကို လေ့လာခဲ့ပါတယ်။
      [[mark:o-2]] အခု launch ပြီး ခြောက်လ ရှိပါပြီ။ CTO ဖြစ်တဲ့ အောင်အောင် က ဒါရိုက်တာ အဖွဲ့ အစည်းအဝေး မတိုင်ခင်
      ကိုယ့်ကို မေးခွန်း နှစ်ခု မေးပါတယ်။ ဘာတွေ တကယ် ပြောင်းသွားလဲ၊ နောက် ဘာ ဆက်လုပ်မလဲ ဆိုတာပါ။
      [[mark:o-3]] ဒီ မေးခွန်း နှစ်ခုက FDE learning path ရဲ့ တတိယ အဆင့်ဖြစ်တဲ့ Expansion ကို ဖွင့်ပေးပါတယ်။ Expansion
      ဆိုတာ အလုပ်ဖြစ်ပြီးသား နေရာတွေကနေ use case အသစ်တွေ၊ ဆိုလိုတာက AI နဲ့ ဖြေရှင်းမယ့် အလုပ်အသစ်တွေဆီ ဆက်ချဲ့တဲ့
      အဆင့်ပါ။ နေခြည် အတွက်ဆိုရင် ဘာ ပြောင်းသွားလဲ တိုင်းတာ၊ အလုပ်ဖြစ်တာကို မျှဝေတာ၊ နောက် use case ကို ရွေးတာ ဆိုတဲ့
      အလုပ် သုံးခု ရှိပါတယ်။
      [[mark:o-4]] ဒီ lesson မှာ အောင်အောင် အတွက် impact review တစ်စောင်ကို ရေးပြီး၊ ပြီးရင် course တစ်ခုလုံးကို
      မုန်တိုင်းကျတဲ့ညကနေ ပြန်ကြည့်ပါမယ်။ ဒါက ဒီ course ရဲ့ နောက်ဆုံး lesson ပါ။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
    actions:
      - {
          id: open-review,
          type: workspace.openFile,
          at: { mark: o-2 },
          path: notebook/56-impact-review.md,
        }
      - id: sel-title
        type: editor.select
        at: { mark: o-4 }
        target:
          file: notebook/56-impact-review.md
          text: "# Impact review · launch ပြီး 6 လ (CTO အတွက်)"

  - id: measure
    chapter: ဘယ်လို တိုင်းမလဲ
    narration: >
      [[mark:m-title]] ဘာ ပြောင်းသွားလဲ ဆိုတာကို ဂဏန်း တစ်မျိုးတည်းနဲ့ ဖြေလို့ မရပါဘူး။ တိုင်းနည်း နှစ်မျိုး လိုပါတယ်။
      [[mark:m-sys]] ပထမ တစ်မျိုးက system ထဲက ဂဏန်းတွေပါ။ ဝန်ထမ်း ၄၃၀ ထဲက ၂၉၀ က အပတ်တိုင်း ပုံမှန် သုံးနေပါတယ်။
      support ရဲ့ ပထမဆုံး ပြန်ဖြေချိန်ကလည်း ပျမ်းမျှ ၃၈ မိနစ်ကနေ ၂၄ မိနစ် ဖြစ်လာပါတယ်။
      [[mark:m-sys2]] Claude Enterprise Administrator Guide မှာ အပတ်စဉ် သုံးသူကို seat တွေရဲ့ ၇၀ ရာခိုင်နှုန်းလို
      ဂဏန်းမျိုးကို အကြံပြု target အဖြစ် ပေးထားပါတယ်။ ဒါက target ပါ၊ တခြား ကုမ္ပဏီတွေရဲ့ ရလဒ် မဟုတ်ပါဘူး။ အဲဒီ
      guide ကပဲ သုံးနေတဲ့ ပမာဏကို ကြည့်တာကနေ business အတွက် ဘာ ပြောင်းလဲလဲ ကြည့်တာဆီ ရွှေ့ဖို့ ပြောပါတယ်။
      ဒါကြောင့် login ဝင်တဲ့ လူအရေအတွက်ထက် ပြန်ဖြေချိန် ပြောင်းသွားတာက ပိုအရေးကြီးပါတယ်။
      [[mark:m-dev]] developer ဘက်အတွက်တော့ Claude Code ရဲ့ analytics dashboard ကို Team နဲ့ Enterprise ရဲ့ Admin နဲ့
      Owner တွေ ကြည့်နိုင်ပါတယ်။ အဲဒီထဲက contribution metric တွေက public beta အဆင့်မှာ ရှိပြီး၊ developer က ၂၀
      ရာခိုင်နှုန်းထက် ပိုပြန်ရေးထားတဲ့ code ကို Claude Code ရေးတာလို့ မရေတွက်ပါဘူး။ docs ကိုယ်တိုင်က အဲဒီ ဂဏန်းတွေကို
      တမင် လျှော့တွက်ထားတာလို့ ဆိုတာမို့၊ ဒါရိုက်တာ အဖွဲ့အတွက် ပိုယုံကြည်ရပါတယ်။
      [[mark:m-ppl]] ဒုတိယ တစ်မျိုးက လူတွေ ကိုယ်တိုင် ပြောတာပါ။ survey မှာ ဝန်ထမ်းတွေက တစ်ပတ်ကို ပျမ်းမျှ နှစ်နာရီခွဲလောက်
      ချွေတာနိုင်တယ်လို့ ဖြေကြပါတယ်။ team lead သုံးယောက်ဆီကလည်း တိုတိုလေး ဖြစ်ရပ် တစ်ခုစီ ရေးခိုင်းပါတယ်။ ဂဏန်းက
      ဘယ်လောက် ပြောင်းလဲလဲ ပြပြီး၊ ဖြစ်ရပ်က ဘာကြောင့်လဲ ဆိုတာကို ပြပါတယ်။
      [[mark:m-both]] ဒါပေမဲ့ နှစ်မျိုးလုံးကို ယှဉ်ကြည့်ရပါမယ်။ သုတေသန အဖွဲ့ တစ်ခုရဲ့ ၂၀၂၅ အစောပိုင်း လေ့လာမှုမှာ
      developer တွေက ပိုမြန်သွားတယ်လို့ ခံစားခဲ့ပေမဲ့၊ တိုင်းကြည့်တော့ ပိုကြာနေတာကို တွေ့ခဲ့ပါတယ်။ အဲဒီ ရလဒ်ကို အဲဒီ အဖွဲ့
      ကိုယ်တိုင်က ခေတ်မမီတော့ဘူးလို့ နောက်မှ ဆိုထားပေမဲ့၊ ခံစားချက်နဲ့ တိုင်းတာမှု ကွဲနိုင်တယ် ဆိုတဲ့ သင်ခန်းစာကတော့
      ကျန်ပါတယ်။
      [[mark:m-anon]] နောက်တစ်ချက်က Claude Enterprise ရဲ့ Analytics ထဲက survey တွေဟာ အမည်မဖော်တဲ့ survey မဟုတ်ပါဘူး။
      ဒါကို ဝန်ထမ်းတွေကို ကြိုပြောထားမှ ရိုးရိုးသားသား ဖြေကြမှာပါ။
    sources:
      - {
          title: "Claude Enterprise Administrator Guide (Anthropic Academy)",
          url: "https://academy.claude.com/tutorials/claude-enterprise-administrator-guide",
        }
      - { title: "Claude Code docs: Analytics", url: "https://code.claude.com/docs/en/analytics" }
      - {
          title: "METR: Measuring the impact of early-2025 AI on experienced open-source developer productivity",
          url: "https://metr.org/blog/2025-07-10-early-2025-ai-experienced-os-dev-study/",
        }
