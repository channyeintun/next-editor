      reply-assistant/managed/kb-audit-agent.ts: |
        import Anthropic from "@anthropic-ai/sdk";

        const client = new Anthropic();

        // Setup, once: store agent.id and agent.version; later changes update this agent.
        export async function createAuditAgent() {
          return client.beta.agents.create({
            name: "kb-audit",
            model: "claude-opus-5-5", // ID as of 2026-11
            system: "Audit Naychi Fiber's Knowledge base articles. Record one finding per article.",
          });
        }

        // Setup, once: where the sessions run.
        export async function createAuditEnvironment() {
          return client.beta.environments.create({
            name: "kb-audit-env",
            config: { type: "cloud", networking: { type: "limited", allow_package_managers: true } },
          });
        }

        // One run: a fresh session, then read its events until it stops.
        export async function runAudit(agentId: string, environmentId: string) {
          const session = await client.beta.sessions.create({
            agent: agentId,
            environment_id: environmentId,
          });

          const stream = await client.beta.sessions.events.stream(session.id); // open first
          await client.beta.sessions.events.send(session.id, {
            events: [{ type: "user.message", content: [{ type: "text", text: "Audit all 340 articles." }] }],
          });

          loop: for await (const event of stream) {
          }
        }
