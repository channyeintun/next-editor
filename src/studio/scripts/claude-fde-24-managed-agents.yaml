    entryFilePath: reply-assistant/managed/kb-audit-agent.ts
    sidebarStartsCollapsed: true
    files:
      README.md: |
        # နေခြည် Fiber · FDE မှတ်စု

        နေခြည် Fiber က ရန်ကုန်နဲ့ မန္တလေးမှာ fiber internet ဝန်ဆောင်မှု ပေးတဲ့ ကုမ္ပဏီပါ။
        ဒီ course အတွက် စိတ်ကူးနဲ့ တည်ဆောက်ထားတဲ့ ကုမ္ပဏီ ဖြစ်ပါတယ်။

        ## ကုမ္ပဏီ

        - customer 62,000 ခန့် (အိမ်နဲ့ ဆိုင်)
        - ဝန်ထမ်း 430: support agent 45၊ field technician 130၊ developer 24
        - developer team 4 ခု: Customer App, Billing, Network Tools, Internal Tools

        ## Support

        - တစ်ရက် ticket 1,800 ခန့်
        - connection 55 %၊ billing 25 %၊ တပ်ဆင်နဲ့ ရွှေ့ပြောင်း 12 %၊ အခြား 8 %
        - ပထမဆုံး ပြန်ဖြေချိန် ပျမ်းမျှ 38 မိနစ်၊ ticket တစ်ခုကို ဖြေရှင်းချိန် ပျမ်းမျှ 11 မိနစ်

        ## System များ

        - Ticket system: customer ရဲ့ တိုင်ကြားချက်တွေ
        - Billing: plan၊ invoice၊ ငွေပေးချေမှု (သက်တမ်း 9 နှစ်ရှိ codebase)
        - NMS: မြို့နယ်အလိုက် လိုင်းကျမှု အခြေအနေ
        - Knowledge base: ပြဿနာဖြေရှင်းနည်း article 340

        ## မုန်တိုင်းကျတဲ့ည

        - မြို့နယ် 3 ခုမှာ လိုင်းကျ၊ ticket က ပုံမှန်ရဲ့ 4 ဆ
        - chat AI နဲ့ ရေးထားတဲ့ အဖြေ 64 စောင်က လိုင်းကျနေတဲ့ customer တွေကို router ပြန်ဖွင့်ခိုင်းခဲ့တယ်

        ## FDE အလုပ် (12 ပတ်)

        - Reply assistant: support ticket အတွက် အဖြေ မူကြမ်း ရေးပေးတဲ့ agent
        - Billing team နဲ့ Claude Code
        - ကုမ္ပဏီ တစ်ခုလုံးအတွက် Claude
