build:
  # Studio replaces this built-in profile at render time with the Burmese provider chosen in the
  # render console (AthanLab with the user's own key, or VoxCPM2 when that feature is enabled).
  voiceProfile: pocket-alba-v1
  seed: 2828
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "String ရဲ့ ပုံစံ"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ type parameter တွေကို လက်ခံပြီး type အသစ်ကို ပြန်ပေးတဲ့ generic
      type ကို ရေးခဲ့ပါတယ်။ ဒီ lesson မှာတော့ string ရဲ့ ပုံစံကို type နဲ့ သတ်မှတ်ပေးတဲ့ template literal
      type နဲ့၊ type ပိုင်းမှာ if else လို စစ်ပေးတဲ့ conditional type ကို ကြည့်သွားပါမယ်။
      [[mark:draw-string]] ဆိုင်ရဲ့ website link တွေမှာ path က slash နဲ့ စရပါတယ်။ ဒါပေမဲ့ path ရဲ့ type
      ကို string လို့ပဲ ပေးထားရင်၊ slash ပါတဲ့ path ရော မပါတဲ့ path ရော နှစ်ခုလုံးကို TypeScript က
      လက်ခံပါတယ်။ string ဆိုတာ ဘယ် စာသားမဆို ဖြစ်နိုင်လို့ပါ။ [[mark:draw-route]] template literal type
      ဆိုတာ JavaScript ရဲ့ template string နဲ့ ရေးပုံ တူပေမယ့်၊ တန်ဖိုး မဟုတ်ဘဲ type တစ်ခုကို ဖော်ပြတာပါ။
      ပုံသေ စာသား တစ်ပိုင်းနဲ့ type တစ်ခု ဝင်မယ့် နေရာကို တွဲရေးလိုက်တာပါ။ ဥပမာ slash နဲ့ စပြီး နောက်မှာ
      ဘယ် string မဆို လိုက်လို့ ရတဲ့ type ဆိုရင်၊ menu path ကို လက်ခံပြီး slash မပါတဲ့ orders ကိုတော့
      ငြင်းပါတယ်။ [[mark:draw-id]] အော်ဒါ id ကိုလည်း order ဆိုတဲ့ စကားလုံးနဲ့ စပြီး နောက်မှာ number လိုက်ရမယ်လို့
      သတ်မှတ်လို့ ရပါတယ်။ ဒါဆို နံပါတ် သက်သက်ပဲ ရေးထားတဲ့ id ကို TypeScript က ဖမ်းပေးပါလိမ့်မယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 15: Designing Your Types (template literal types)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/designing-your-types-in-typescript",
        }
      - {
          title: "TypeScript Handbook: Template Literal Types",
          url: "https://www.typescriptlang.org/docs/handbook/2/template-literal-types.html",
        }
    actions:
      - id: open-board-a
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-string
        type: whiteboard.apply
        at: { mark: draw-string }
        upsertIds: [a-str, a-str-ok, a-str-bad]
        drawMs: 2000
      - id: draw-route
        type: whiteboard.apply
        at: { mark: draw-route }
        upsertIds: [a-route, a-note, a-route-ok, a-route-bad]
        drawMs: 2800
      - id: draw-id
        type: whiteboard.apply
        at: { mark: draw-id }
        upsertIds: [a-id, a-id-ok, a-id-bad]
        drawMs: 2000

  - id: starter
    narration: >
      [[mark:close-board]] ဒီနေ့ code ကို ကြည့်ရအောင်။ [[mark:select-site]] main ဖိုင်ရဲ့ အပေါ်ဆုံးမှာ
      ဆိုင်ရဲ့ website လိပ်စာ ရှိပါတယ်။ [[mark:select-link]] link function က အဲဒီ လိပ်စာရဲ့ နောက်မှာ
      path ကို ဆက်ပြီး link အပြည့်အစုံကို ပြန်ပေးပါတယ်။ path ရဲ့ type ကတော့ Route ဆိုတဲ့ type alias ဖြစ်ပြီး၊
      အခုအတိုင်းဆိုရင် string နဲ့ အတူတူပါပဲ။ [[mark:select-order-link]] အောက်က function ကတော့ အော်ဒါ id
      ကို ယူပြီး အဲဒီ အော်ဒါရဲ့ link ကို ဆောက်ပေးပါတယ်။ id ရဲ့ type ကလည်း string ပါပဲ။
      [[mark:select-logs]] နောက်ဆုံး လေးကြောင်းကတော့ menu page ရယ်၊ အော်ဒါ စာရင်း page ရယ်၊ အော်ဒါ နှစ်ခုရယ်ရဲ့
      link တွေကို ထုတ်ပြပါတယ်။ ဒုတိယ line မှာ path ကို slash မပါဘဲ ရေးထားပြီး၊ နောက်ဆုံး line မှာလည်း id ကို နံပါတ်
      သက်သက်ပဲ ရေးထားတာ သတိထား ကြည့်ပါ။
    sources:
      - {
          title: "MDN: Template literals (template strings)",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Template_literals",
        }
      - {
          title: "TypeScript Handbook: Template Literal Types",
          url: "https://www.typescriptlang.org/docs/handbook/2/template-literal-types.html",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: select-site
        type: editor.select
        at: { mark: select-site }
        target: { file: src/main.ts, text: 'const site = "https://shwe-tea.com";', occurrence: 1 }
      - id: select-link
        type: editor.select
        at: { mark: select-link }
        target:
          {
            file: src/main.ts,
            text: "function link(route: Route) {\n  return site + route;\n}",
            occurrence: 1,
          }
      - id: select-order-link
        type: editor.select
        at: { mark: select-order-link }
        target:
          {
            file: src/main.ts,
            text: "function orderLink(id: OrderId) {\n  return link(`/orders/${id}`);\n}",
            occurrence: 1,
          }
      - id: select-logs
        type: editor.select
        at: { mark: select-logs }
        target:
          {
            file: src/main.ts,
            text: "console.log(link(\"/menu\"));\nconsole.log(link(\"orders\"));\nconsole.log(orderLink(\"order-12\"));\nconsole.log(orderLink(\"15\"));",
            occurrence: 1,
          }

  - id: panel
    narration: >
      [[mark:panel-ready]] ညာဘက် panel ရဲ့ Output ကို ကြည့်ပါ။ ပထမ link နဲ့ တတိယ link က မှန်နေပေမယ့်၊ ဒုတိယ
      link မှာ slash မပါလို့ website လိပ်စာနဲ့ orders က ကပ်သွားပြီး link ပျက်နေပါတယ်။ နောက်ဆုံး link
      မှာလည်း id က ဆိုင်ရဲ့ ပုံစံ မဟုတ်လို့ အဲဒီ အော်ဒါကို ရှာတွေ့မှာ မဟုတ်ပါဘူး။ [[mark:read-no-errors]]
      ဒါပေမဲ့ Errors မှာ ဘာမှ မရှိပါဘူး။ type က string ဖြစ်နေတော့ ဘယ် စာသားမဆို မှန်တယ်လို့ TypeScript
      က ယူဆလို့ပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 15: Designing Your Types (template literal types)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/designing-your-types-in-typescript",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-start-clean
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-start-lines
        type: expect.preview
        at: { afterAction: expect-start-clean }
        timeoutMs: 5000
        target: { by: testId, value: ts-output }
        attribute: { name: data-count, value: "4" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-start-broken
        type: expect.preview
        at: { afterAction: expect-start-lines }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-2 }
        textContains: "https://shwe-tea.comorders"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-start-bad-id
        type: expect.preview
        at: { afterAction: expect-start-broken }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-4 }
        textContains: "https://shwe-tea.com/orders/15"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: route
    chapter: "Template literal type"
    narration: >
      [[mark:type-route]] ဒါဆို Route ကို slash နဲ့ စရမယ့် template literal type အဖြစ် ပြန်ရေးပါမယ်။ string
      ဖြစ်နေတဲ့ အဟောင်းကိုတော့ comment ပိတ်ထားလိုက်ပါမယ်။ [[mark:read-route-error]] Errors မှာ error
      တစ်ခု ပေါ်လာပါပြီ။ slash မပါတဲ့ orders ဆိုတဲ့ string ကို slash နဲ့ စရမယ့် type နေရာမှာ ထည့်လို့ မရဘူးလို့
      ပြောနေတာပါ။ menu path ကတော့ slash နဲ့ စလို့ error မရှိပါဘူး။ အော်ဒါ link ဆောက်တဲ့ function ကလည်း
      slash နဲ့ စတဲ့ template string ကို ပို့ထားလို့၊ TypeScript က လက်ခံပါတယ်။ [[mark:type-slash]] orders ရဲ့
      ရှေ့မှာ slash ထည့်လိုက်ပါမယ်။ [[mark:read-route-fixed]] error ပျောက်သွားပြီး၊ Output ရဲ့ ဒုတိယ line
      မှာလည်း link အမှန် ပေါ်လာပါပြီ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 15: Designing Your Types (template literal types)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/designing-your-types-in-typescript",
        }
      - {
          title: "TypeScript Handbook: Template Literal Types",
          url: "https://www.typescriptlang.org/docs/handbook/2/template-literal-types.html",
        }
      - {
          title: "TypeScript 4.1 release notes: Template literal types",
          url: "https://www.typescriptlang.org/docs/handbook/release-notes/typescript-4-1.html#template-literal-types",
        }
    actions:
      - id: type-route
        type: editor.type
        at: { mark: type-route }
        target:
          { file: src/main.ts, after: "const site = \"https://shwe-tea.com\";\n\n", occurrence: 1 }
        text: "type Route = `/${string}`;\n// "
        cadence: block
      - id: expect-route-error
        type: expect.preview
        at: { afterAction: type-route }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-route-2345
        type: expect.preview
        at: { afterAction: expect-route-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: 'Argument of type ''"orders"'' is not assignable to parameter of type ''`/${string}`''.'
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-slash
        type: editor.type
        at: { mark: type-slash }
        target: { file: src/main.ts, after: 'console.log(link("', occurrence: 2 }
        text: "/"
        cadence: fast-explainer
      - id: expect-route-clean
        type: expect.preview
        at: { afterAction: type-slash }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-route-link
        type: expect.preview
        at: { afterAction: expect-route-clean }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-2 }
        textContains: "https://shwe-tea.com/orders"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: order-id
    narration: >
      [[mark:type-orderid]] အော်ဒါ id ကိုလည်း အဲဒီ နည်းနဲ့ ပြန်ရေးပါမယ်။ order ဆိုတဲ့ စကားလုံးနဲ့ စပြီး၊
      နောက်မှာ number လိုက်ရမယ့် template literal type ပါ။ ဒီတစ်ခါ type ဝင်မယ့် နေရာမှာ string မဟုတ်ဘဲ
      number ကို ထည့်ထားလို့၊ အဲဒီ နေရာမှာ ဂဏန်းအဖြစ် ဖတ်လို့ရတဲ့ စာသားပဲ ရှိရပါမယ်။
      [[mark:read-id-error]] Errors မှာ နောက်ဆုံး line အတွက် error ပေါ်လာပါပြီ။ နံပါတ် သက်သက် ရေးထားတဲ့ string
      က ဒီ ပုံစံနဲ့ မကိုက်လို့ပါ။ [[mark:type-order-prefix]] id ရဲ့ ရှေ့မှာ ဆိုင်ရဲ့ ပုံစံ အတိုင်း order
      ကို ထည့်ပေးလိုက်ပါမယ်။ [[mark:read-id-fixed]] error ပျောက်သွားပြီး၊ Output မှာ link လေးခုလုံး
      မှန်သွားပါပြီ။ string သက်သက် ဆိုရင် run ကြည့်မှ သိရမယ့် အမှားတွေကို၊ template literal type က code
      ရေးနေတုန်းမှာပဲ ဖမ်းပေးလိုက်တာပါ။
    sources:
      - {
          title: "TypeScript Handbook: Template Literal Types",
          url: "https://www.typescriptlang.org/docs/handbook/2/template-literal-types.html",
        }
      - {
          title: "Total TypeScript Essentials, ch. 15: Designing Your Types (template literal types)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/designing-your-types-in-typescript",
        }
    actions:
      - id: type-orderid
        type: editor.type
        at: { mark: type-orderid }
        target: { file: src/main.ts, after: "}\n\n", occurrence: 1 }
        text: "type OrderId = `order-${number}`;\n// "
        cadence: block
      - id: expect-id-error
        type: expect.preview
        at: { afterAction: type-orderid }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-id-2345
        type: expect.preview
        at: { afterAction: expect-id-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: 'Argument of type ''"15"'' is not assignable to parameter of type ''`order-${number}`''.'
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-order-prefix
        type: editor.type
        at: { mark: type-order-prefix }
        target: { file: src/main.ts, after: 'console.log(orderLink("', occurrence: 2 }
        text: "order-"
        cadence: fast-explainer
      - id: expect-id-clean
        type: expect.preview
        at: { afterAction: type-order-prefix }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-id-link
        type: expect.preview
        at: { afterAction: expect-id-clean }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-4 }
        textContains: "https://shwe-tea.com/orders/order-15"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: combos
    chapter: "Union ပါတဲ့ template"
    narration: >
      [[mark:open-cups]] အခု template literal type ထဲကို union ထည့်ရင် ဘာ ဖြစ်လဲ ကြည့်ရအောင်။ ဒါက ခွက်
      အရွယ်အစားနဲ့ သောက်စရာ အမျိုးအစားတွေကို literal union နဲ့ ရေးထားတဲ့ ဖိုင်ပါ။ [[mark:select-unions]]
      အရွယ်အစားက ခွက်သေး၊ ခွက်ကြီး နှစ်မျိုး ရှိပြီး၊ သောက်စရာကတော့ လက်ဖက်ရည်၊ ကော်ဖီ၊ သံပုရာရည် ဆိုပြီး
      သုံးမျိုး ရှိပါတယ်။ [[mark:type-cupcode]] မီးဖိုချောင်မှာ သုံးမယ့် ခွက် code ကို အရွယ်အစားနဲ့ သောက်စရာ
      တွဲထားတဲ့ template literal type နဲ့ ရေးပြီး၊ query comment နဲ့ ကြည့်ပါမယ်။ [[mark:read-cupcode]]
      Types မှာ string literal ခြောက်ခု ပါတဲ့ union ပေါ်လာပါပြီ။ template ထဲက နေရာ တစ်ခုစီမှာ union
      ရှိနေရင်၊ TypeScript က တွဲလို့ ရသမျှ အတွဲ အားလုံးကို ထုတ်ပေးပါတယ်။ နှစ်မျိုးကို သုံးမျိုးနဲ့ မြှောက်လို့
      ခြောက်ခု ရတာပါ။ ဆိုတော့ menu မှာ သောက်စရာ အသစ် တစ်မျိုး ထပ်ထည့်လိုက်ရင်၊ ခွက် code တွေလည်း အလိုလို
      တိုးလာမှာပါ။
    sources:
      - {
          title: "TypeScript Handbook: Template Literal Types (unions in interpolated positions are cross multiplied)",
          url: "https://www.typescriptlang.org/docs/handbook/2/template-literal-types.html",
        }
      - {
          title: "Total TypeScript Essentials, ch. 15: Designing Your Types (combining template literal types with union types)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/designing-your-types-in-typescript",
        }
    actions:
      - id: open-cups
        type: workspace.openFile
        at: { mark: open-cups }
        path: src/cups.ts
      - id: select-unions
        type: editor.select
        at: { mark: select-unions }
        target:
          {
            file: src/cups.ts,
            text: "type Size = \"small\" | \"large\";\ntype Drink = \"tea\" | \"coffee\" | \"lime\";",
            occurrence: 1,
          }
      - id: type-cupcode
        type: editor.type
        at: { mark: type-cupcode }
        target:
          {
            file: src/cups.ts,
            after: "type Drink = \"tea\" | \"coffee\" | \"lime\";\n",
            occurrence: 1,
          }
        text: "\ntype CupCode = `${Size}-${Drink}`;\n//   ^?\n"
        cadence: line-by-line
      - id: expect-cupcode
        type: expect.preview
        at: { afterAction: type-cupcode }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        attribute:
          {
            name: data-type,
            value: 'type CupCode = "small-tea" | "small-coffee" | "small-lime" | "large-tea" | "large-coffee" | "large-lime"',
          }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: intrinsic
    chapter: "Uppercase နဲ့ Capitalize"
    narration: >
      [[mark:type-ticket]] မီးဖိုချောင် လက်မှတ်ပေါ်မှာတော့ ခွက် code တွေကို စာလုံးကြီးနဲ့ ရိုက်ချင်ပါတယ်။
      ဒါကြောင့် ခုနက type ကို Uppercase ထဲ ထည့်ပြီး query comment နဲ့ ကြည့်ပါမယ်။ [[mark:read-ticket]]
      code ခြောက်ခုလုံး စာလုံးကြီး ဖြစ်သွားပါပြီ။ Uppercase က string literal type ကို စာလုံးကြီး
      ပြောင်းပေးတဲ့ TypeScript ရဲ့ built-in type ဖြစ်ပြီး၊ union ပေါ်မှာ သုံးရင် member တိုင်းကို ပြောင်းပေးပါတယ်။
      [[mark:board-intrinsic]] ဒီလို type မျိုး လေးခု ရှိပါတယ်။ [[mark:draw-intrinsic]] Uppercase က အကုန်လုံးကို
      စာလုံးကြီး၊ Lowercase က အကုန်လုံးကို စာလုံးသေး ပြောင်းပါတယ်။ Capitalize ကတော့ ပထမ စာလုံး တစ်လုံးကိုပဲ
      စာလုံးကြီး ပြောင်းပြီး၊ Uncapitalize က ပထမ စာလုံးကို စာလုံးသေး ပြန်ပြောင်းပါတယ်။
      [[mark:draw-intrinsic-note]] Capitalize ကို template literal type နဲ့ တွဲသုံးရင်၊ property နာမည်ကနေ
      get နဲ့ စတဲ့ method နာမည်တွေ ထုတ်တာမျိုး လုပ်လို့ ရပါတယ်။ ဒါကို နောက် lesson မှာ တွေ့ရပါမယ်။
    sources:
      - {
          title: "TypeScript Handbook: Template Literal Types (intrinsic string manipulation types)",
          url: "https://www.typescriptlang.org/docs/handbook/2/template-literal-types.html#intrinsic-string-manipulation-types",
        }
      - {
          title: "Total TypeScript Essentials, ch. 15: Designing Your Types (transforming string types)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/designing-your-types-in-typescript",
        }
    actions:
      - id: type-ticket
        type: editor.type
        at: { mark: type-ticket }
        target:
          {
            file: src/cups.ts,
            after: "type CupCode = `${Size}-${Drink}`;\n//   ^?\n",
            occurrence: 1,
          }
        text: "type TicketCode = Uppercase<CupCode>;\n//   ^?\n"
        cadence: line-by-line
      - id: expect-ticket
        type: expect.preview
        at: { afterAction: type-ticket }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-2 }
        attribute:
          {
            name: data-type,
            value: 'type TicketCode = "SMALL-TEA" | "SMALL-COFFEE" | "SMALL-LIME" | "LARGE-TEA" | "LARGE-COFFEE" | "LARGE-LIME"',
          }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: open-board-b
        type: whiteboard.apply
        at: { mark: board-intrinsic }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-intrinsic
        type: whiteboard.apply
        at: { mark: draw-intrinsic }
        upsertIds:
          [b-upper, b-upper-out, b-lower, b-lower-out, b-cap, b-cap-out, b-uncap, b-uncap-out]
        drawMs: 4000
      - id: draw-intrinsic-note
        type: whiteboard.apply
        at: { mark: draw-intrinsic-note }
        upsertIds: [b-note]
        drawMs: 1400

  - id: conditional
    chapter: "Conditional type"
    narration: >
      [[mark:close-board-b]] ဒါဆို conditional type ကို ကြည့်ရအောင်။ ခွက်ကြီး ယူရင် ၃၀၀ ကျပ် ပိုပေးရပြီး၊
      ခွက်သေးဆိုရင်တော့ ပိုမပေးရပါဘူး။ ဒါကို type ပိုင်းမှာ ရေးကြည့်ပါမယ်။ [[mark:type-extra]] CupExtra ဆိုတဲ့
      generic type က T ကို လက်ခံပြီး၊ T က large ဆိုတဲ့ literal type ထဲ ဝင်ရင် ၃၀၀၊ မဝင်ရင် သုည ဆိုတဲ့
      number literal type ကို ပြန်ပေးပါတယ်။ အောက်မှာ large ကို ထည့်ပေးပြီး query comment နဲ့ ကြည့်ပါမယ်။
      [[mark:read-extra]] Types မှာ ၃၀၀ လို့ ပြနေပါတယ်။ [[mark:board-conditional]] ဒီလို ရေးတဲ့ type ကို
      conditional type လို့ ခေါ်ပါတယ်။ [[mark:draw-condition]] extends ရဲ့ ဘယ်ဘက်က type က ညာဘက်က type
      ထဲ ဝင်မဝင်ကို အရင် စစ်ပါတယ်။ [[mark:draw-branches]] ဝင်ရင် ပထမ အဖြေကို ယူပြီး၊ မဝင်ရင်တော့ ဒုတိယ
      အဖြေကို ယူပါတယ်။ ဆိုတော့ type ပိုင်းမှာ if else ရေးတာနဲ့ အတူတူပါပဲ။ [[mark:draw-ternary]] JavaScript
      မှာ တန်ဖိုး နှစ်ခုထဲက တစ်ခုကို ရွေးတဲ့ ternary operator နဲ့ ရေးပုံ တူပေမယ့်၊ ဒီမှာတော့ type တွေကို
      ရွေးတာပါ။ application code ထက် library တွေထဲမှာ ပိုတွေ့ရတဲ့ feature ပါ။
    sources:
      - {
          title: "TypeScript Handbook: Conditional Types",
          url: "https://www.typescriptlang.org/docs/handbook/2/conditional-types.html",
        }
      - {
          title: "Total TypeScript Essentials, ch. 15: Designing Your Types (conditional types)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/designing-your-types-in-typescript",
        }
      - {
          title: "MDN: Conditional (ternary) operator",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Conditional_operator",
        }
    actions:
      - id: close-board-b
        type: whiteboard.apply
        at: { mark: close-board-b }
        open: false
      - id: type-extra
        type: editor.type
        at: { mark: type-extra }
        target:
          {
            file: src/cups.ts,
            after: "type TicketCode = Uppercase<CupCode>;\n//   ^?\n",
            occurrence: 1,
          }
        text: "\ntype CupExtra<T> = T extends \"large\" ? 300 : 0;\ntype LargeExtra = CupExtra<\"large\">;\n//   ^?\n"
        cadence: line-by-line
      - id: expect-extra
        type: expect.preview
        at: { afterAction: type-extra }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-3 }
        attribute: { name: data-type, value: "type LargeExtra = 300" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: open-board-c
        type: whiteboard.apply
        at: { mark: board-conditional }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-condition
        type: whiteboard.apply
        at: { mark: draw-condition }
        upsertIds: [c-box, c-cond]
        drawMs: 1600
      - id: draw-branches
        type: whiteboard.apply
        at: { mark: draw-branches }
        upsertIds: [c-yes-arrow, c-yes, c-no-arrow, c-no]
        drawMs: 2400
      - id: draw-ternary
        type: whiteboard.apply
        at: { mark: draw-ternary }
        upsertIds: [c-js]
        drawMs: 1600

  - id: distribute
    chapter: "Union ပေါ်က conditional type"
    narration: >
      [[mark:close-board-c]] အခု T နေရာမှာ ခွက် အရွယ်အစား union တစ်ခုလုံးကို ထည့်ကြည့်ရအောင်။
      [[mark:read-size-extra]] Types မှာ သုည ဒါမှမဟုတ် ၃၀၀ ဆိုတဲ့ union ရပါတယ်။ union တစ်ခုလုံးက large ထဲ
      မဝင်လို့ သုည ပဲ ထွက်မယ်လို့ ထင်စရာ ရှိပေမယ့်၊ TypeScript က union ရဲ့ member တစ်ခုချင်းစီကို သီးသန့်
      စစ်ပါတယ်။ [[mark:draw-split]] ခွက်သေးအတွက် သုည၊ ခွက်ကြီးအတွက် ၃၀၀ ရပြီး၊ အဖြေတွေကို union ပြန်ပေါင်းပေးတာပါ။
      ဒါကို distributive conditional type လို့ ခေါ်ပါတယ်။ type parameter ကို extends ရဲ့ ဘယ်ဘက်မှာ ဒီအတိုင်း
      ရေးထားတဲ့ conditional type တွေမှာ ဒီလို ဖြစ်ပါတယ်။
    sources:
      - {
          title: "TypeScript Handbook: Conditional Types (distributive conditional types)",
          url: "https://www.typescriptlang.org/docs/handbook/2/conditional-types.html#distributive-conditional-types",
        }
    actions:
      - id: close-board-c
        type: whiteboard.apply
        at: { mark: close-board-c }
        open: false
      - id: type-size-extra
        type: editor.type
        at: { afterAction: close-board-c }
        target:
          {
            file: src/cups.ts,
            after: "type LargeExtra = CupExtra<\"large\">;\n//   ^?\n",
            occurrence: 1,
          }
        text: "type SizeExtra = CupExtra<Size>;\n//   ^?\n"
        cadence: line-by-line
      - id: expect-size-extra
        type: expect.preview
        at: { afterAction: type-size-extra }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-4 }
        attribute: { name: data-type, value: "type SizeExtra = 0 | 300" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: open-board-d
        type: whiteboard.apply
        at: { mark: draw-split }
        open: true
        clear: true
        upsertIds: [d-title, d-s-in, d-s-arrow-1, d-s-small, d-s-large, d-s-arrow-2, d-s-out]
        drawMs: 3200

  - id: omit-revisit
    chapter: "Distributive Omit"
    narration: >
      [[mark:open-bill]] ဒီ အချက်က lesson ၁၄ မှာ ရေးခဲ့တဲ့ distributive Omit ကို နားလည်ဖို့ သော့ချက်ပါ။
      [[mark:select-payment]] ငွေချေပုံ union မှာ ငွေသားနဲ့ KBZPay ဆိုပြီး member နှစ်ခု ရှိပါတယ်။ Omit ကို
      union ပေါ်မှာ တိုက်ရိုက် သုံးတော့ member နှစ်ခုကို တစ်ခုတည်း ပေါင်းချလိုက်လို့၊ member တစ်ခုချင်းရဲ့
      property တွေ ပျောက်သွားခဲ့တာ မှတ်မိမှာပါ။ [[mark:select-distributive]] ဒီ type က conditional type
      တစ်ခုပါ။ T က any ထဲ ဝင်လား လို့ စစ်ထားပြီး၊ type တိုင်းက any ထဲ ဝင်တာမို့ အဖြေက အမြဲ ပထမ အဖြေပါ။ ဒါဆို
      ဘာလို့ ရေးထားတာလဲ။ စစ်ဖို့ မဟုတ်ဘဲ၊ union ကို member တစ်ခုချင်း ခွဲဖို့ ရေးထားတာပါ။
      [[mark:type-newpayment-query]] အောက်က type ကို query comment နဲ့ ကြည့်ရအောင်။ [[mark:read-newpayment]]
      Types ရဲ့ အပေါ်ဆုံးမှာ Omit နှစ်ခုကို union နဲ့ ဆက်ထားတာ ပေါ်လာပါပြီ။ ငွေသား member ကနေ id ကို ဖယ်တဲ့
      Omit တစ်ခုနဲ့၊ KBZPay member ကနေ id ကို ဖယ်တဲ့ Omit တစ်ခုပါ။ [[mark:draw-payment]] ခုနက ခွက်
      အရွယ်အစား လိုပဲ၊ union ကို ခွဲပြီး member တစ်ခုစီမှာ Omit ကို သုံးပြီးမှ ပြန်ပေါင်းထားလို့၊ member
      တစ်ခုချင်းရဲ့ property တွေ မပျောက်တော့တာပါ။
    sources:
      - {
          title: "TypeScript Handbook: Conditional Types (distributive conditional types)",
          url: "https://www.typescriptlang.org/docs/handbook/2/conditional-types.html#distributive-conditional-types",
        }
      - {
          title: "Total TypeScript Essentials, ch. 6: Objects (Omit and Pick on unions; a distributive Omit)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/objects",
        }
    actions:
      - id: close-board-d
        type: whiteboard.apply
        at: { mark: open-bill }
        open: false
      - id: open-bill
        type: workspace.openFile
        at: { mark: open-bill, offsetMs: 600 }
        path: src/bill.ts
      - id: select-payment
        type: editor.select
        at: { mark: select-payment }
        target:
          {
            file: src/bill.ts,
            text: "type Payment =\n  | { id: number; method: \"cash\"; received: number }\n  | { id: number; method: \"kpay\"; phone: string };",
            occurrence: 1,
          }
      - id: select-distributive
        type: editor.select
        at: { mark: select-distributive }
        target: { file: src/bill.ts, text: "T extends any ? Omit<T, K> : never;", occurrence: 1 }
      - id: type-newpayment-query
        type: editor.type
        at: { mark: type-newpayment-query }
        target:
          {
            file: src/bill.ts,
            after: "type NewPayment = DistributiveOmit<Payment, \"id\">;\n",
            occurrence: 1,
          }
        text: "//   ^?\n"
        cadence: fast-explainer
      - id: expect-types-five
        type: expect.preview
        at: { afterAction: type-newpayment-query }
        timeoutMs: 8000
        target: { by: testId, value: ts-types }
        attribute: { name: data-count, value: "5" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-newpayment
        type: expect.preview
        at: { afterAction: expect-types-five }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-1 }
        textContains: "type NewPayment = Omit<{"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-newpayment-kpay
        type: expect.preview
        at: { afterAction: expect-newpayment }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-1 }
        textContains: 'method: "kpay";'
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: draw-payment
        type: whiteboard.apply
        at: { mark: draw-payment }
        open: true
        upsertIds: [d-p-in, d-p-arrow-1, d-p-cash, d-p-kpay, d-p-arrow-2, d-p-out, d-note]
        drawMs: 3200

  - id: recap
    narration: >
      [[mark:close-board-final]] ဒါဆို ပြန်ချုပ်ရရင်၊ template literal type က string ရဲ့ ပုံစံကို type နဲ့
      သတ်မှတ်ပေးပြီး၊ ပုံစံနဲ့ မကိုက်တဲ့ စာသားကို code ရေးနေတုန်းမှာပဲ ဖမ်းပေးပါတယ်။ union ကို ထည့်ရင်
      အတွဲ ဖြစ်နိုင်သမျှ အကုန် ထွက်လာပြီး၊ Uppercase လို type တွေနဲ့ စာလုံး ပုံစံကိုလည်း ပြောင်းလို့ ရပါတယ်။
      [[mark:recap-conditional]] conditional type ကတော့ type ပိုင်းမှာ if else လို အလုပ်လုပ်ပြီး၊ type
      parameter ထဲကို union ထည့်ရင် member တစ်ခုချင်းစီကို ခွဲစစ်ပါတယ်။ distributive Omit က ဒီ အချက်ကို
      သုံးထားတာပါ။ နောက် lesson မှာတော့ object type တစ်ခုရဲ့ key တွေကို တစ်ခုချင်း ပတ်ပြီး type အသစ်
      ဆောက်ပေးတဲ့ mapped type ကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 15: Designing Your Types",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/designing-your-types-in-typescript",
        }
    actions:
      - id: close-board-final
        type: whiteboard.apply
        at: { mark: close-board-final }
        open: false
      - id: select-conditional-recap
        type: editor.select
        at: { mark: recap-conditional }
        target: { file: src/bill.ts, text: "T extends any ? Omit<T, K> : never;", occurrence: 1 }
      - id: expect-file-route
        type: expect.file
        at: { afterAction: close-board-final }
        path: src/main.ts
        contains: "type Route = `/${string}`;\n// type Route = string;"
      - id: expect-file-orderid
        type: expect.file
        at: { afterAction: close-board-final }
        path: src/main.ts
        contains: "type OrderId = `order-${number}`;\n// type OrderId = string;"
      - id: expect-file-calls
        type: expect.file
        at: { afterAction: close-board-final }
        path: src/main.ts
        contains: "console.log(link(\"/orders\"));\nconsole.log(orderLink(\"order-12\"));\nconsole.log(orderLink(\"order-15\"));"
      - id: expect-file-cups
        type: expect.file
        at: { afterAction: close-board-final }
        path: src/cups.ts
        contains: "type CupExtra<T> = T extends \"large\" ? 300 : 0;\ntype LargeExtra = CupExtra<\"large\">;\n//   ^?\ntype SizeExtra = CupExtra<Size>;"
checks:
  - type: timing.p95Ms
    max: 300
