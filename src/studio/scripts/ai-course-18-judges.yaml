build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 5118
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "အဖြေကို ဘယ်သူ အမှတ်ပေးမလဲ"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ ဖော်ပြချက် helper ရဲ့ baseline prompt ကို input ၁၂ ခုနဲ့
      စစ်ခဲ့ပါတယ်။ code check တွေက code fence နဲ့ အုပ်ထားတဲ့ JSON၊ ရှည်လွန်းတဲ့ ဖော်ပြချက်၊ claim
      ပါတာတွေကို ဖမ်းမိခဲ့ပြီး၊ ဖတ်ကြည့်တော့ ဖော်ပြချက် အတော်များများ အရသာ နဲ့ စ နေတာကို တွေ့ခဲ့ပါတယ်။
      [[mark:draw-mini]] ဒီနေ့လည်း blueprint ရဲ့ intelligence အလွှာမှာပဲ ဆက်လုပ်ပါမယ်။ [[mark:draw-today]]
      အဖြေတွေကို ဘယ်သူ ဒါမှမဟုတ် ဘာက အမှတ်ပေးမလဲ ဆိုတဲ့ judge တွေကို ရွေးပြီး၊ prompt ကို အပြောင်းအလဲ
      သေးသေးလေးတွေနဲ့ တစ်ဆင့်ချင်း တိုးတက်အောင် လုပ်ကြည့်ပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Evaluation-driven development",
          url: "https://web.dev/learn/ai/evaluation-driven-development",
        }
      - {
          title: "web.dev Learn AI: Introduction to AI on the web (the blueprint)",
          url: "https://web.dev/learn/ai/introduction",
        }
      - {
          title: "web.dev Learn AI: Welcome to Learn AI! (course credit: written by Dr. Janna Lipenkova with editorial guidance from Alexandra Klepper; text CC BY 4.0, code Apache 2.0; adapted into Burmese with the course's own tea-shop examples)",
          url: "https://web.dev/learn/ai/welcome",
        }
      - {
          title: "Creative Commons: Attribution 4.0 International (CC BY 4.0), the licence of the web.dev Learn AI text adapted here",
          url: "https://creativecommons.org/licenses/by/4.0/",
        }
    actions:
      - {
          id: open-board-a,
          type: whiteboard.apply,
          at: { scene: start, offsetMs: -450 },
          open: true,
          clear: true,
          upsertIds: [a-title],
        }
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - {
          id: draw-mini,
          type: whiteboard.apply,
          at: { mark: draw-mini },
          upsertIds:
            [
              a-opp,
              a-opp-t,
              a-arrow-1,
              a-data,
              a-data-t,
              a-intel,
              a-intel-t,
              a-ux,
              a-ux-t,
              a-arrow-2,
              a-gov,
              a-gov-t,
            ],
          drawMs: 2400,
        }
      - {
          id: draw-today,
          type: whiteboard.apply,
          at: { mark: draw-today },
          upsertIds: [a-today],
          drawMs: 1000,
        }

  - id: judges
    narration: >
      [[mark:draw-judges]] evaluation မှာ အဖြေကို အမှတ်ပေးတဲ့ သူ ဒါမှမဟုတ် အရာကို judge လို့ ခေါ်ပြီး၊ စံ
      တစ်ခုချင်းအတွက် သင့်တော်တဲ့ judge ကို ရွေးရပါတယ်။ [[mark:draw-code]] ပထမ တစ်မျိုးက ပြီးခဲ့တဲ့ lesson က code based
      check တွေပါ။ မြန်ပြီး ဘယ်နှခါ run run ရလဒ် တူလို့၊ ခလုတ် စာ၊ form field လို ပုံသေ format ရှိတဲ့
      output တွေအတွက် အရမ်း သင့်တော်ပါတယ်။ ဒါပေမဲ့ tone ကိုတော့ မစစ်နိုင်ပါဘူး။ [[mark:draw-human]] ဒုတိယက
      လူကိုယ်တိုင် ဖတ်ပြီး အမှတ်ပေးတာပါ။ tone၊ ရှင်းလင်းမှု၊ အသုံးဝင်မှု အတွက် မရှိမဖြစ် လိုပြီး၊
      အစပိုင်းမှာ ကိုယ်တိုင် ဒါမှမဟုတ် ကောင်တာက လှလှ လို domain expert နဲ့ ဖတ်တာက အမြန်ဆုံး
      တိုးတက်စေပါတယ်။ ဒါပေမဲ့ အဖြေ များလာရင် scale မဖြစ်ပါဘူး။ app ထဲမှာ ကြယ် ပေးခိုင်းတာလို user
      signal တွေကလည်း noise များပြီး အသေးစိတ် မပြောပြနိုင်ပါဘူး။ [[mark:draw-llm]] တတိယက LLM as a
      judge ပါ။ model တစ်ခုကို judge အဖြစ် ထားပြီး အဖြေတွေကို အမှတ်ပေးခိုင်းတာ ဖြစ်လို့ လူထက် မြန်ပြီး
      scale ဖြစ်ပါတယ်။ ဒါပေမဲ့ ရိုးရိုး အမှတ်ပေး prompt တစ်ခုနဲ့ပဲ သုံးရင် model ရဲ့ bias နဲ့ အားနည်းချက်တွေကို
      ကူးယူပြီး ပိုတောင် ကြီးစေနိုင်ပါတယ်။ [[mark:draw-quality]]
      ဒါ့အပြင် predictive AI မှာလို လူ အများကြီးကို label လုပ်ခိုင်းတာက ဒီမှာ သိပ် မတန်ပါဘူး။ ဆိုင်ရဲ့
      context မသိတဲ့ လူ များများထက်၊ context ရှိတဲ့ စစ်ချက် နည်းနည်းက ပိုတန်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Evaluation-driven development (choose your judges)",
          url: "https://web.dev/learn/ai/evaluation-driven-development",
        }
    actions:
      - {
          id: draw-judges,
          type: whiteboard.apply,
          at: { mark: draw-judges },
          clear: true,
          upsertIds: [j-title],
        }
      - {
          id: draw-code,
          type: whiteboard.apply,
          at: { mark: draw-code },
          upsertIds: [j-code-box, j-code, j-code-p, j-code-l],
          drawMs: 1800,
        }
      - {
          id: draw-human,
          type: whiteboard.apply,
          at: { mark: draw-human },
          upsertIds: [j-human-box, j-human, j-human-p, j-human-l],
          drawMs: 1800,
        }
      - {
          id: draw-llm,
          type: whiteboard.apply,
          at: { mark: draw-llm },
          upsertIds: [j-llm-box, j-llm, j-llm-p, j-llm-l],
          drawMs: 1800,
        }
      - {
          id: draw-quality,
          type: whiteboard.apply,
          at: { mark: draw-quality },
          upsertIds: [j-quality],
          drawMs: 1000,
        }

  - id: panel
    chapter: "Judge သုံးမျိုးကို ယှဉ်ကြည့်ရအောင်"
    narration: >
      [[mark:close-judges]] ဒါဆို judge သုံးမျိုးကို panel မှာ ယှဉ်ကြည့်ရအောင်။ [[mark:panel-ready]] AI panel
      ရဲ့ ဒုတိယ card ဖြစ်တဲ့ Judges card မှာ၊ baseline prompt က ပထမ input အတွက် ရေးခဲ့တဲ့ ဖော်ပြချက် သုံးခုကို
      တစ်ကြောင်းစီ ပြထားပါတယ်။ ဒီ baseline ကို ပထမ version လို့ ခေါ်ပါမယ်။ code column က ဖော်ပြချက်
      တစ်ခုချင်းရဲ့ အရှည်နဲ့ claim ကို စစ်တဲ့ code check ပါ။ judge column က LLM judge ရဲ့ အမှတ် ဖြစ်ပြီး၊
      နောက်ဆုံး column က လှလှ ပေးတဲ့ အမှတ်ပါ။ [[mark:open-judge]] judge ဖိုင်ကို ဖွင့်ကြည့်ရအောင်။
      [[mark:sel-rubric]] ဒါက rubric လို့ ခေါ်တဲ့ အမှတ်ပေး စံ prompt ပါ။ judge ကို ဆိုင်ရဲ့ editor နေရာမှာ
      ထားပြီး၊ ဖော်ပြချက်တွေ မှတ်ချက်နဲ့ ကိုက်လား၊ နွေးထွေးပြီး သဘာဝ ကျလား၊ customer အတွက် အသုံးဝင်လား
      ကြည့်ပြီး တစ်ကနေ ငါး အထိ အမှတ်ပေးခိုင်းထားပါတယ်။
      [[mark:same-model]] ဒီ judge က ဖော်ပြချက်တွေ ရေးခဲ့တဲ့ open model သေးသေးလေး ကိုယ်တိုင်ပါ။ ဖော်ပြချက်တွေရော
      judge ရဲ့ အမှတ်တွေပါ ကြိုပြီး run ထားတုန်းက တကယ် ထွက်လာခဲ့တဲ့ အဖြေတွေကနေ ယူထားတာပါ။ [[mark:read-staff]]
      လှလှ ရဲ့ အမှတ်တွေကတော့ lesson အတွက် ပြင်ဆင်ထားတဲ့ နမူနာ အမှတ်တွေ ဖြစ်ပြီး၊ panel အပေါ်က case
      ခလုတ် သုံးခုက လှလှ အမှတ်ပေးထားတဲ့ input သုံးခုပါ။
    sources:
      - {
          title: "web.dev Learn AI: Evaluation-driven development (choose your judges)",
          url: "https://web.dev/learn/ai/evaluation-driven-development",
        }
    actions:
      - { id: close-judges, type: whiteboard.apply, at: { mark: close-judges }, open: false }
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-done
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: ai-status }
        attribute: { name: data-state, value: "done" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-two-cards
        type: expect.preview
        at: { afterAction: expect-done }
        timeoutMs: 5000
        target: { by: testId, value: ai-cards }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-judges-n01
        type: expect.preview
        at: { afterAction: expect-two-cards }
        timeoutMs: 5000
        target: { by: testId, value: ai-judges }
        attribute: { name: data-label, value: "Judges · v1 · n01" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-judges-badge
        type: expect.preview
        at: { afterAction: expect-judges-n01 }
        timeoutMs: 5000
        target: { by: testId, value: ai-judges-badge }
        textContains: "judge: recorded · Gemma 4 E2B · greedy"
        retry: { maxAttempts: 2, delayMs: 300 }
      - { id: open-judge, type: workspace.openFile, at: { mark: open-judge }, path: src/judge.js }
      - id: sel-rubric
        type: editor.select
        at: { mark: sel-rubric }
        target: { file: src/judge.js, text: "export const rubric =", occurrence: 1 }
      - id: sel-same-model
        type: editor.select
        at: { mark: same-model }
        target:
          {
            file: src/judge.js,
            text: "the SAME small model that wrote the descriptions (Gemma 4 E2B)",
            occurrence: 1,
          }
      - id: expect-n01-row1
        type: expect.preview
        at: { mark: read-staff }
        timeoutMs: 5000
        target: { by: testId, value: ai-judges-1 }
        textContains: "✓54"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-n01-row2
        type: expect.preview
        at: { afterAction: expect-n01-row1 }
        timeoutMs: 5000
        target: { by: testId, value: ai-judges-2 }
        textContains: "✓33"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-n01-row3
        type: expect.preview
        at: { afterAction: expect-n01-row2 }
        timeoutMs: 5000
        target: { by: testId, value: ai-judges-3 }
        textContains: "✓42"
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: blind-spot
    narration: >
      [[mark:click-e06]] အကောင်းဆုံးလို့ ရေးပေးပါလို့ တောင်းထားတဲ့ input ကို ကြည့်ပါ။ [[mark:read-e06]] ပထမ
      နှစ်ခုမှာ ရန်ကုန်မှာ အကောင်းဆုံး ဆိုတဲ့ claim ပါလို့ code check က ကြက်ခြေခတ် ပေးပြီး၊ လှလှ ကလည်း
      တစ်မှတ်ပဲ ပေးပါတယ်။ ဒါပေမဲ့ judge ကတော့ အဲဒီ နှစ်ခုကို လေးမှတ်နဲ့ ငါးမှတ် ပေးထားပါတယ်။ rubric ထဲမှာ
      ဆိုင်ရဲ့ claim စည်းကမ်း မပါလို့၊ မှတ်ချက် တောင်းတဲ့အတိုင်း ရေးတာကို ကောင်းတယ်လို့ ယူဆခဲ့တာ ဖြစ်နိုင်ပါတယ်။ [[mark:click-e01]] emoji ပါတဲ့ မှတ်ချက် input ကိုလည်း
      ကြည့်ပါ။ [[mark:read-e01]] ဒုတိယ ဖော်ပြချက်က မီးဖိုချောင်ကနေ တိုက်ရိုက် ထုတ်ထားတယ်လို့
      ရေးထားပေမယ့်၊ မှတ်ချက်ထဲမှာ အဲဒီလို မပါပါဘူး။ code check က အမှန်ခြစ် ပေးပြီး judge ကလည်း ငါးမှတ်
      ပေးထားပါတယ်။ ရေးတဲ့ model နဲ့ judge က model တစ်ခုတည်း ဖြစ်တော့၊ ရေးတုန်းက
      ထည့်ခဲ့တဲ့ အမှားကို အမှတ်ပေးတုန်းမှာလည်း မမြင်ခဲ့တာ ဖြစ်နိုင်ပါတယ်။ [[mark:read-e01-staff]] ဒါကို မိတာက
      နှစ်မှတ်ပဲ ပေးထားတဲ့ လှလှ ပါ။ ဒါပေမဲ့ လှလှ ရဲ့ အမှတ်က input ၁၂ ခုထဲက သုံးခုအတွက်ပဲ ရှိပါတယ်။
      လူကိုယ်တိုင် ဖတ်တာ scale မဖြစ်ဘူး ဆိုတာ ဒါပါ။
    sources:
