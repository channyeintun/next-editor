      src/checks.js: |
        import { graphemes, CLAIMS } from "./text.js";

        // Code checks: each test gets one recorded answer, read as { text, json, items } (text.js),
        // and returns true (pass) or false (fail). One check per line.
        export const checks = [
          { name: "json", test: (a) => a.json !== null },
          { name: "three", test: (a) => a.items.length === 3 },
          { name: "length", test: (a) => a.items.every((d) => graphemes(d) <= 60) },
          { name: "claim", test: (a) => !CLAIMS.some((w) => a.text.includes(w)) },
        ];
      src/judge.js: |
        import { generate } from "./llm.js";
        import { read } from "./text.js";

        // LLM as a judge: the SAME small model that wrote the descriptions (Gemma 4 E2B), given a rubric
        // and asked to score the three descriptions from 1 to 5. Its answers are recorded ahead of time too
        // (src/llm.js), so every judge score on the panel is a real answer of that model.
        export const rubric =
          "You are an editor at Shwe Tea House, a tea shop in Yangon. " +
          "Score the three Burmese menu descriptions from 1 (poor) to 5 (excellent): are they true to the staff notes, " +
          'warm and natural, and useful to a customer? Answer in JSON: {"score": 1, "reason": "one short sentence"}';

        export const judgeMessages = (item, descriptions) => [
          { role: "system", content: rubric },
          { role: "user", content: `Item: ${item.name}\nNotes: ${item.notes}\nDescriptions:\n${descriptions.map((d, i) => `${i + 1}. ${d}`).join("\n")}` },
        ];

        // The judge's scores, in the order it gave them. The rubric shows one JSON object, but this small
        // model mostly answers with one score per description (once with one score for all three), so
        // judge() reads every score in its answer.
        export async function judge(item, answer) {
          const text = await generate(judgeMessages(item, read(answer).items), { show: false });
          return [...text.matchAll(/"score"\s*:\s*(\d)/g)].map((m) => Number(m[1]));
        }
      src/llm.js: |
        // The lesson's stand-in for a model API.
        // A real model is slow and can answer differently from run to run, so this lesson uses answers
        // recorded ahead of time from a real model: data/responses.json (how: data/PROVENANCE.md).
        // generate() returns the recorded answer for exactly these messages, and shows it in the panel.
        import recorded from "../data/responses.json";
        import { panel } from "ai-panel";

        export const model = recorded.provenance;

        const find = (messages) => {
          const key = JSON.stringify(messages.map(({ role, content }) => ({ role, content })));
          return recorded.responses.find((r) => JSON.stringify(r.messages) === key);
        };

        export async function generate(messages, { show = true } = {}) {
          const hit = find(messages);
          if (!hit) {
            const error = new Error("No recorded answer for these exact messages yet.");
            error.name = "CourseNotice";
            throw error;
          }
          if (show) panel.output("Model answer", hit.output, { id: "answer", badge: `recorded · ${model.label} · greedy` });
          return hit.output;
        }

        // The token counts the model's own tokenizer gave when the answer was recorded (the prompt includes
        // the chat template's own tokens): { promptTokens, outputTokens }, or null when not recorded.
        export function tokensFor(messages) {
          const hit = find(messages);
          return hit ? { promptTokens: hit.promptTokens, outputTokens: hit.outputTokens } : null;
        }
      src/main.js: |
        import helper from "../data/helper.json";
        import { instruction, format, messages } from "./prompt.js";
        import { v2 } from "./prompt-v2.js";
        import { generate } from "./llm.js";
        import { checks } from "./checks.js";
        import { judge } from "./judge.js";
        import { showJudges, showComparison } from "./report.js";

        // The test inputs: the five new items (ideal) and seven messy cases (data/helper.json).
        const cases = helper.evalSet.map((c) => ({ ...helper.newItems.find((n) => n.id === c.id), ...c }));

        // One prompt version over every test input: its answer, then the judge's scores for that answer.
        // Both are recorded ahead of time (src/llm.js).
        async function run(prompt) {
          const results = [];
          for (const c of cases) {
            const answer = await generate(messages(c, prompt), { show: false });
            results.push({ ...c, answer, judge: await judge(c, answer) });
          }
          return results;
        }

        const versions = { v1: await run({ instruction, format }), v2: await run(v2) };
        showComparison(versions, checks);
        showJudges(versions, checks);
      src/prompt-v2.js: |
        import { instruction, format } from "./prompt.js";

        // Prompt v2 starts as a copy of the baseline (v1). Each change is a line below that overrides
        // one part, and the comparison card scores v2 against v1 over every test input.
        export const v2 = { instruction, format };
      src/prompt.js: |
        // The description helper's baseline prompt (zero-shot): an instruction, the output format, and
        // an input template whose {placeholders} the app fills in for each menu item.
        export const instruction =
          "You write menu descriptions for Shwe Tea House, a tea shop in Yangon. " +
          "Write three short descriptions in Burmese for the menu item the user sends.";
        export const format = 'Answer in JSON: {"descriptions": ["...", "...", "..."]}';
        export const template = "Item: {name}\nNotes: {notes}\nStyle: {style}";

        export const fill = (item) => template.replace(/\{(\w+)\}/g, (_, key) => item[key]);
        export const messages = (item, prompt = { instruction, format }) => [
          { role: "system", content: `${prompt.instruction}\n${prompt.format}` },
          { role: "user", content: fill(item) },
        ];
      src/report.js: |
        import { panel } from "ai-panel";
        import staff from "../data/ratings.json";
        import { model } from "./llm.js";
        import { read } from "./text.js";
        import { button, row } from "./ui.js";

        // What the panel shows. Plain code: the answers and the judge's scores are recorded, and
        // လှလှ's scores are sample ratings prepared for the lesson (data/ratings.json).
        const SHOWN = ["n01", "e01", "e06"]; // the test inputs လှလှ rated
        const STAFF = "လှ\u2060လှ · န\u2060မူ\u2060နာ"; // \u2060 (word joiner): the header wraps at the space, not inside a word
        const BADGE = `judge: recorded · ${model.label} · greedy`;
        const rating = new Map(staff.ratings.map((r) => [r.text, r.score]));

        // The checks that look at one description at a time (length, claim), run on one description.
        const passes = (checks, d) => checks.filter((k) => ["length", "claim"].includes(k.name)).every((k) => k.test({ text: d, json: null, items: [d] }));

        // Three judges side by side for one test input and one prompt version: the code checks, the
        // LLM judge and လှလှ. The buttons above the panel pick the input and the version.
        export function showJudges(versions, checks) {
          let id = SHOWN[0];
          let version = "v1";
          const draw = () => {
            const c = versions[version].find((x) => x.id === id);
            const rows = read(c.answer).items.map((d, i) => ({ description: d, code: passes(checks, d), judge: c.judge[i] ?? "—", [STAFF]: rating.get(d) ?? "—" }));
            panel.table(`Judges · ${version} · ${c.id}`, rows, { id: "judges", badge: BADGE });
          };
          // One row of buttons: the test input (case-1 … case-3) and the prompt version (prompt-1, prompt-2).
          const bar = row("case");
          const group = (name, options, current, pick) => {
            const buttons = options.map((option, i) => button(option, `${name}-${i + 1}`, () => {
              for (const b of buttons) b.setAttribute("aria-pressed", String(b === buttons[i]));
              pick(option);
              draw();
            }, bar));
            for (const [i, b] of buttons.entries()) b.setAttribute("aria-pressed", String(options[i] === current));
          };
          group("case", SHOWN, id, (x) => (id = x));
          const label = document.createElement("span");
          label.className = "ui-label";
          label.textContent = "prompt";
          bar.append(label);
          group("prompt", Object.keys(versions), version, (x) => (version = x));
          draw();
        }

        // v1 and v2 over every test input: the code checks, the openings count from lesson 17, how many
        // descriptions the judge scored 4 or 5, and how many of the ones လှလှ rated she scored 4 or 5.
        export function showComparison(versions, checks) {
          const summary = (results) => {
            const answers = results.map((r) => read(r.answer));
            const items = answers.flatMap((a) => a.items);
            const judged = results.flatMap((r) => r.judge);
            const rated = items.map((d) => rating.get(d)).filter((s) => s != null);
            return {
              ...Object.fromEntries(checks.map((k) => [k.name, `${answers.filter((a) => k.test(a)).length}/${answers.length}`])),
              "start with အရသာ": `${items.filter((d) => d.startsWith("အရသာ")).length}/${items.length}`,
              "judge 4+": `${judged.filter((s) => s >= 4).length}/${judged.length}`,
              "လှလှ 4+": `${rated.filter((s) => s >= 4).length}/${rated.length}`,
            };
          };
          const [a, b] = [summary(versions.v1), summary(versions.v2)];
          panel.table("v1 · v2", Object.keys(a).map((check) => ({ check, v1: a[check], v2: b[check] })), { id: "compare", badge: BADGE });
        }
      src/text.js: |
        // Small text helpers for the code checks. Plain code, no model.

        // Burmese vowel signs and marks are code points of their own, so a string's .length counts more
        // than a reader sees. Intl.Segmenter counts graphemes: the letters as they appear on screen.
        const segmenter = new Intl.Segmenter("my", { granularity: "grapheme" });
        export const graphemes = (text) => [...segmenter.segment(text)].length;

        // Claims the shop can't check (the helper's contract in data/helper.json).
        export const CLAIMS = ["အကောင်းဆုံး", "နံပါတ်တစ်", "အခမဲ့", "best", "free"];

        const parse = (text) => {
          try {
            return JSON.parse(text);
          } catch {
            return null;
          }
        };

        // How the app reads one answer: { text, json, items }.
        //   json:  the answer parsed with JSON.parse exactly as the model gave it (null when that fails)
        //   items: the descriptions, read even when the JSON sits inside a markdown code fence
        export function read(text) {
          const json = parse(text);
          const inner = json ?? parse(text.replace(/^\s*```(?:json)?\s*|\s*```\s*$/g, ""));
          const items = Array.isArray(inner?.descriptions) ? inner.descriptions.map(String) : [];
          return { text, json, items };
        }
      src/ui.js: |
        // Page controls for the lesson program: a row of buttons or choices in #app, above the AI panel.
        // Plain DOM, so the studio records every click and replay shows it exactly. Each control gets a
        // data-testid for preview.click. #app starts empty on every run, so controls are drawn by the
        // program each time. A handler that throws prints to the panel's Console (never the page).
        //
        //   import { row, button, choices } from "./ui.js";
        //   choices("threshold", [0.5, 0.7, 0.9], (t) => show(t), { selected: 0.5 });
        //     → buttons with test ids threshold-1, threshold-2, threshold-3 (1-based, in order)
        //   button("ဖော်ပြချက်တွေ ကြည့်မယ်", "show-descriptions", () => …);
        const STYLE_ID = "ui-style";
        const STYLE = `
        #app .ui-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px 0;
          font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans Myanmar", "Myanmar Sangam MN", "Myanmar Text", sans-serif; color: #d9dce2; }
        #app .ui-label { color: #adb5bd; font-size: 13px; }
        #app .ui-btn { font: inherit; color: #f1f3f5; background: #2d323c; border: 1px solid #3a404b; border-radius: 6px; padding: 3px 12px; cursor: pointer; }
        #app .ui-btn[aria-pressed="true"] { background: #7048e8; border-color: #7048e8; color: #fff; font-weight: 600; }
        `;

        function ensureStyle() {
          if (document.getElementById(STYLE_ID)) return;
          const style = document.createElement("style");
          style.id = STYLE_ID;
          style.textContent = STYLE;
          document.head.append(style);
        }

        const safe = (fn) => (...args) => {
          try {
            const result = fn(...args);
            if (result && typeof result.catch === "function") result.catch((error) => console.error(error));
          } catch (error) {
            console.error(error);
          }
        };

        /** A new row in #app, optionally with a short label in front. Returns the row element. */
        export function row(label = "") {
          ensureStyle();
          const el = document.createElement("div");
          el.className = "ui-row";
          if (label) {
            const span = document.createElement("span");
            span.className = "ui-label";
            span.textContent = label;
            el.append(span);
          }
          document.getElementById("app").append(el);
          return el;
        }

        /** One button. `testid` is used as is. */
        export function button(label, testid, onClick, parent = row()) {
          const el = document.createElement("button");
          el.type = "button";
          el.className = "ui-btn";
          el.textContent = String(label);
          el.dataset.testid = testid;
          el.addEventListener("click", safe(onClick));
          parent.append(el);
          return el;
        }

        /** A row of choices; the picked one is shown pressed. Test ids are `<name>-1`, `<name>-2`, … */
        export function choices(name, options, onPick, { label = name, selected } = {}) {
          const parent = row(label);
          const buttons = options.map((option, i) =>
            button(option, `${name}-${i + 1}`, () => {
              for (const b of buttons) b.setAttribute("aria-pressed", String(b === buttons[i]));
              onPick(option, i);
            }, parent),
          );
          for (const [i, b] of buttons.entries()) b.setAttribute("aria-pressed", String(options[i] === selected));
          return buttons;
        }
      vite.config.js: |
        import { defineConfig } from "vite";
        import courseRunner from "./course/runner.js";

        export default defineConfig({
          plugins: [courseRunner()],
        });
