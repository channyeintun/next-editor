  - id: flywheel
    narration: >
      [[mark:draw-fly]] user ဆီက ရတာတွေကို ပြန်သုံးပြီး system ကို တိုးတက်အောင် လုပ်တဲ့ flywheel
      စက်ဝိုင်းက၊ production ရောက်သွားရင် နှေးမသွားဘဲ ပိုမြန်လာရပါမယ်။ [[mark:draw-fly-1]] log
      ထဲက တကယ့် user input တွေက test case အသစ်တွေအတွက် အဖိုးအတန်ဆုံး ရင်းမြစ်ပါ။ ထပ်ခါထပ်ခါ တွေ့ရတဲ့
      ပုံစံတွေကို test input စာရင်းထဲ ထည့်ပြီး၊ နောက် ပြင်သင့်တဲ့ အဆင့်ကို ဆက်ရှာပါ။ [[mark:draw-fly-note]] user
      input ကို မမြင်ရအောင် ဒီဇိုင်းထားတဲ့ system ဆိုရင်တော့ တခြား feedback လမ်းကြောင်းတွေကို ရှာရပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Evaluation-driven development (iterate: the EDD flywheel)",
