          type: whiteboard.apply,
          at: { mark: draw-ops-1 },
          upsertIds: [o-1],
          drawMs: 1000,
        }
      - {
          id: draw-ops-2,
          type: whiteboard.apply,
          at: { mark: draw-ops-2 },
          upsertIds: [o-2],
          drawMs: 1000,
        }
      - {
          id: draw-ops-3,
          type: whiteboard.apply,
          at: { mark: draw-ops-3 },
          upsertIds: [o-3],
          drawMs: 900,
        }
      - {
          id: draw-ops-4,
          type: whiteboard.apply,
          at: { mark: draw-ops-4 },
          upsertIds: [o-4],
          drawMs: 1000,
        }
      - {
          id: draw-ops-5,
          type: whiteboard.apply,
          at: { mark: draw-ops-5 },
          upsertIds: [o-5],
          drawMs: 900,
        }
      - {
