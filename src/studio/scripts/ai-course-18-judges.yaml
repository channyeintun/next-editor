  - id: iterate
    chapter: "Prompt ကို တစ်ဆင့်ချင်း ပြင်ရအောင်"
    narration: >
      [[mark:open-v2]] အခု prompt ကို ပြင်ကြည့်ရအောင်။ ဒီ ဖိုင်က ဒုတိယ version ဖြစ်ပြီး၊ အစမှာ ပထမ version ကို
      ကူးထားတာပါ။ [[mark:read-compare]] panel အပေါ်ဆုံး card က check လေးခု၊ အရသာ နဲ့ စတဲ့ အရေအတွက်နဲ့
      judge က လေးမှတ်နဲ့ အထက် ပေးတဲ့ အရေအတွက်ကို input ၁၂ ခုလုံးပေါ်မှာ version နှစ်ခု ယှဉ်ပြထားပါတယ်။
      လှလှ ရဲ့ row ကတော့ သူ အမှတ်ပေးထားတဲ့ ဖော်ပြချက် ကိုးခုထဲကပါ။ အခုထိတော့ တူနေပါသေးတယ်။
      တစ်ခါမှာ prompt ရဲ့ အပိုင်း တစ်ခုကိုပဲ ပြင်ပြီး input အားလုံးပေါ်မှာ ပြန်စစ်ပါမယ်။
      [[mark:type-format]] ပထမဆုံး output format ကိုပဲ ပိုရှင်းအောင် ပြင်ပါမယ်။ JSON object တစ်ခုတည်းကို code
      fence မပါဘဲ ပြန်ပေးခိုင်းတာပါ။ [[mark:read-format]] JSON row မှာ ဒုတိယ version က ၁၂ ခုလုံး အောင်သွားပါပြီ။ format ကိုပဲ
      ပြင်တာ ဖြစ်ပေမယ့် length အောင်တာ ၁၀ ခု၊ claim အောင်တာ ၁၁ ခု ဖြစ်လာပြီး ဖော်ပြချက်တွေပါ ပြောင်းသွားပါတယ်။
      ဒါကြောင့် တစ်ခု ပြင်တိုင်း အားလုံးကို ပြန်စစ်ရတာပါ။ [[mark:type-instruction]] ပြီးတော့ instruction ကို
      ပိုတိကျအောင် ပြင်ပါမယ်။ ဖော်ပြချက် တစ်ခုစီကို မှတ်ချက်ထဲက အရသာနဲ့ ပါဝင်ပစ္စည်း အကြောင်း စာလုံး ၆၀
      အတွင်း ဝါကျ တစ်ကြောင်း ရေးခိုင်းပြီး၊ ဆိုင်က သက်သေ မပြနိုင်တဲ့ claim မပါဖို့၊ တစ်ခုစီ မတူတဲ့ စကားနဲ့ စဖို့
      ပြောထားပါတယ်။ [[mark:read-instruction]] length က ၁၂ ခုလုံး အောင်သွားပေမယ့်၊ claim တစ်ခု ကျန်နေသေးပြီး
      အရသာ နဲ့ စတာလည်း ၁၀ ခု ရှိနေတုန်းပါ။ [[mark:read-judges-row]] judge က လေးမှတ်နဲ့ အထက် ပေးတာ ၂၂
      ခုကနေ ၁၇ ခု ဖြစ်သွားပြီး၊ လှလှ ကလည်း လေးမှတ်နဲ့ အထက် တစ်ခုမှ မပေးတော့ပါဘူး။
    sources:
      - {
          title: "web.dev Learn AI: Evaluation-driven development (evaluate and optimize; iterate with small, targeted changes)",
          url: "https://web.dev/learn/ai/evaluation-driven-development",
        }
    actions:
      - { id: open-v2, type: workspace.openFile, at: { mark: open-v2 }, path: src/prompt-v2.js }
      - id: sel-copy
        type: editor.select
        at: { afterAction: open-v2 }
        target:
          {
            file: src/prompt-v2.js,
            text: "export const v2 = { instruction, format };",
            occurrence: 1,
          }
      - id: expect-compare-same
        type: expect.preview
        at: { mark: read-compare }
        timeoutMs: 5000
        target: { by: testId, value: ai-compare-1 }
        textContains: "json0/120/12"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-format
        type: editor.type
        at: { mark: type-format }
        target:
          {
            file: src/prompt-v2.js,
            after: "export const v2 = { instruction, format };\n",
            occurrence: 1,
          }
        text: "v2.format =\n  \"Answer with only the JSON object, with no code fence: \" +\n  '{\"descriptions\": [\"...\", \"...\", \"...\"]}';\n"
        cadence: block
      - id: expect-format-json
        type: expect.preview
        at: { afterAction: type-format }
        timeoutMs: 8000
        target: { by: testId, value: ai-compare-1 }
        textContains: "json0/1212/12"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-format-length
        type: expect.preview
        at: { afterAction: expect-format-json }
        timeoutMs: 5000
        target: { by: testId, value: ai-compare-3 }
        textContains: "length8/1210/12"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-format-claim
        type: expect.preview
        at: { afterAction: expect-format-length }
        timeoutMs: 5000
        target: { by: testId, value: ai-compare-4 }
        textContains: "claim10/1211/12"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-instruction
        type: editor.type
        at: { mark: type-instruction }
        target:
          {
            file: src/prompt-v2.js,
            after: "'{\"descriptions\": [\"...\", \"...\", \"...\"]}';\n",
            occurrence: 1,
          }
        text: "v2.instruction +=\n  \" Each description is one sentence of at most 60 letters\" +\n  \" about the taste and ingredients in the notes.\" +\n  \" Make no claims the shop cannot check,\" +\n  \" and start each description differently.\";\n"
        cadence: block
      - id: expect-instr-length
        type: expect.preview
        at: { afterAction: type-instruction }
        timeoutMs: 8000
        target: { by: testId, value: ai-compare-3 }
        textContains: "length8/1212/12"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-instr-claim
        type: expect.preview
        at: { afterAction: expect-instr-length }
        timeoutMs: 5000
        target: { by: testId, value: ai-compare-4 }
        textContains: "claim10/1211/12"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-instr-openings
        type: expect.preview
        at: { afterAction: expect-instr-claim }
        timeoutMs: 5000
        target: { by: testId, value: ai-compare-5 }
        textContains: "start with အရသာ11/3610/36"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-instr-judge
        type: expect.preview
        at: { mark: read-judges-row }
        timeoutMs: 5000
        target: { by: testId, value: ai-compare-6 }
        textContains: "judge 4+22/3617/34"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-instr-staff
        type: expect.preview
        at: { afterAction: expect-instr-judge }
        timeoutMs: 5000
        target: { by: testId, value: ai-compare-7 }
        textContains: "လှလှ 4+2/90/9"
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: read-v2
    chapter: "Check အောင်တိုင်း ကောင်းသလား"
    narration: >
      [[mark:click-v2]] ဒုတိယ version ရဲ့ အဖြေတွေကို ဖတ်ကြည့်ရအောင်။ [[mark:read-v2]] ပထမ input မှာ ဖော်ပြချက်တွေက
      တိုပြီး မှန်ပေမယ့်၊ သုံးခုလုံးမှာ အရသာ ဆိုတဲ့ စကား ပါနေပြီး ခပ်ပေါ့ပေါ့ ဖြစ်နေပါတယ်။
      [[mark:click-v2-e06]] claim တောင်းတဲ့ input ကိုလည်း ကြည့်ပါ။ [[mark:read-v2-e06]] တစ်ခုမှာ အကောင်းဆုံး
      ဆိုတဲ့ စကား ပါနေတုန်း ဖြစ်ပြီး၊ ကျန်တာတွေကလည်း ဘာမှ သိပ် မပြောတဲ့ စာတွေပါ။ ဆိုလိုတာက code check တွေ
      အောင်လာတိုင်း ဖော်ပြချက် ကောင်းလာတာ မဟုတ်ပါဘူး။ [[mark:overfit]] မတူတဲ့ စကားနဲ့ စဖို့ ပြောထားတာတောင် အရသာ နဲ့ စတာ ၁၀ ခု ကျန်နေလို့၊
      အရသာ ဆိုတဲ့ စကားလုံးကို တားလိုက်ချင်စရာ ကောင်းပါတယ်။ ဒါပေမဲ့ ဒါက ပြဿနာ
      တစ်ခုတည်းကို ဖာထေးတဲ့ စည်းကမ်း ဖြစ်လို့ prompt ကို overfit ဖြစ်စေပါတယ်။ ကိုယ် တကယ် လိုချင်တာက ကွဲပြားမှုနဲ့ ရေးဟန် ဖြစ်လို့
      အဲဒီ အဆင့်ကနေ ပြင်ရပါမယ်။ [[mark:technique]] ဘယ် prompting နည်းလမ်း သင့်လဲ မေးကြည့်ရင်၊ ရေးဟန်ကို နမူနာနဲ့
      ပြချင်တာမို့ လှလှ ရေးထားတဲ့ ဖော်ပြချက် အနည်းငယ်နဲ့ few shot က နောက်တစ်ဆင့် ဖြစ်နိုင်ပါတယ်။ အဆင့်လိုက်
      စဉ်းစားပြခိုင်းရမယ့် အလုပ်ဆိုရင် chain of thought၊ ပြန်ပြင်ခိုင်းချင်ရင် self reflection ပါ။ prompt
      ရေးတာ၊ ပြင်တာမှာ LLM ကိုလည်း အကူအညီ တောင်းလို့ ရပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Evaluation-driven development (iterate with small, targeted changes)",
          url: "https://web.dev/learn/ai/evaluation-driven-development",
        }
      - {
          title: "web.dev Learn AI: Prompt engineering (prompting techniques)",
          url: "https://web.dev/learn/ai/prompt-engineering",
        }
    actions:
      - id: click-v2
        type: preview.click
        at: { mark: click-v2 }
        target: { by: testId, value: prompt-2 }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-v2-label
        type: expect.preview
        at: { afterAction: click-v2 }
        timeoutMs: 5000
        target: { by: testId, value: ai-judges }
        attribute: { name: data-label, value: "Judges · v2 · n01" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-v2-n01
        type: expect.preview
        at: { afterAction: expect-v2-label }
        timeoutMs: 5000
        target: { by: testId, value: ai-judges-1 }
        textContains: "ထန်းလျက်ရဲ့ ချိုမြိန်မှုက အရသာရှိတယ်။"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: click-v2-e06
        type: preview.click
        at: { mark: click-v2-e06 }
        target: { by: testId, value: case-3 }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-v2-e06
        type: expect.preview
        at: { afterAction: click-v2-e06 }
        timeoutMs: 5000
        target: { by: testId, value: ai-judges-2 }
        textContains: "အကောင်းဆုံး အရသာကို ခံစားကြည့်ပါ။✗21"
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-v2-e06-label
        type: expect.preview
        at: { afterAction: expect-v2-e06 }
        timeoutMs: 5000
        target: { by: testId, value: ai-judges }
        attribute: { name: data-label, value: "Judges · v2 · e06" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: automate
    chapter: "Evaluation ကို automate လုပ်ရအောင်"
    narration: >
      [[mark:draw-ops]] ဒီလို ပြင်၊ စစ်၊ ပြန်ပြင် လုပ်တာ မြန်လာအောင် evaluation ကို automate လုပ်ပြီး၊
      development နဲ့ production ကို ချိတ်ပေးတဲ့ အလုပ်တွေကို LLM ops လို့ ခေါ်ပါတယ်။ [[mark:draw-ops-1]] ပထမ အချက်က prompt၊ metric နဲ့ test
      input တွေကို code လိုပဲ version control ထဲ ထည့်ထားတာပါ။
      [[mark:draw-ops-2]] prompt ပြင်တိုင်း CI CD workflow က input အားလုံးပေါ်မှာ evaluation ကို batch နဲ့
      run ပြီး၊ ခုနက version နှစ်ခု ယှဉ်ပြတဲ့ card လို နှိုင်းယှဉ်ချက် ထုတ်ပေးပါတယ်။ [[mark:draw-ops-3]] quality ပြန်ကျသွားရင်
      merge ကို ပိတ်တဲ့ gate လည်း ထားလို့ ရပါတယ်။ [[mark:draw-ops-4]] production မှာတော့ input၊ output၊
      error၊ latency နဲ့ token တွေကို log လုပ်ပြီး drift ကို စောင့်ကြည့်ပါ။ [[mark:draw-ops-5]] like ပေးတာ၊
      ပြန်ရေးတာ၊ ထွက်သွားတာ လို user signal တွေကို test case အသစ်အဖြစ် ပြောင်းပါ။ [[mark:draw-ops-6]] prompt
      version၊ model setting နဲ့ ရလဒ်တွေကိုလည်း experiment tracking နဲ့ မှတ်ထားပါ။ [[mark:draw-ops-7]]
      ဒီအတွက် platform တွေ ရှိပေမယ့်၊ မဝယ်ခင် ကိုယ့် workflow ကို အရင် ဒီဇိုင်း ဆွဲထားတာ ကောင်းပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Evaluation-driven development (automate your evaluation pipeline)",
          url: "https://web.dev/learn/ai/evaluation-driven-development",
        }
    actions:
