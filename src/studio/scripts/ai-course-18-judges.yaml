  - id: quiz
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ LLM as a judge ကို သုံးတဲ့အခါ သတိထားရမယ့် အန္တရာယ် တစ်ခုက
      ဘာလဲ။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] အဖြေကတော့ model ရဲ့ bias နဲ့
      အားနည်းချက်တွေကို ကူးယူပြီး ပိုတောင် ကြီးစေနိုင်တာပါ။ ဘာကြောင့်လဲဆိုတော့ judge ကိုယ်တိုင်လည်း model
      ဖြစ်လို့ပါ။ ခုနက judge က ရေးတဲ့ model ထည့်ခဲ့တဲ့ claim ကိုရော၊ မှတ်ချက်ထဲ မပါတဲ့ အကြောင်းကိုပါ
      ငါးမှတ် ပေးခဲ့ပါတယ်။ ဒါကြောင့် judge ကို မယုံခင် လူ့ အမှတ်နဲ့ အရင် တိုက်စစ်ရပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Evaluation-driven development (Check your understanding)",
          url: "https://web.dev/learn/ai/evaluation-driven-development",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
