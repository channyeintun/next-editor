        }

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ code check က မြန်ပြီး ပုံသေ format တွေကို စစ်ပေးပါတယ်။ လူကိုယ်တိုင်
      ဖတ်တာက tone နဲ့ အသုံးဝင်မှုကို မြင်ပေမယ့် scale မဖြစ်ပါဘူး။ LLM judge က scale ဖြစ်ပေမယ့် model ရဲ့
      အားနည်းချက်တွေကို ကူးယူနိုင်လို့ သုံးမျိုးလုံးကို တွဲသုံးရပါမယ်။ [[mark:sel-v2]] prompt ကို တစ်ခါမှာ
      အပိုင်း တစ်ခုပဲ ပြင်ပြီး input အားလုံးပေါ်မှာ ပြန်စစ်ပါ။ ပြဿနာ တစ်ခုကို ဖာထေးတဲ့ စည်းကမ်း မထည့်ဘဲ၊ တကယ်
      လိုချင်တာကို instruction မှာ ပိုရှင်းအောင် ရေးပါ။
      ဒီ အလုပ်တွေကို version control၊ CI နဲ့ log တွေနဲ့ automate လုပ်ပြီး flywheel ကို လည်ပတ်စေပါ။ နောက်
      lesson မှာတော့ background AI နဲ့ constrained AI ကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Evaluation-driven development (your takeaways)",
          url: "https://web.dev/learn/ai/evaluation-driven-development",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: recap }, open: false }
      - id: sel-v2
        type: editor.select
        at: { mark: sel-v2 }
        target:
          {
            file: src/prompt-v2.js,
            text: "v2.format =\n  \"Answer with only the JSON object, with no code fence: \" +\n  '{\"descriptions\": [\"...\", \"...\", \"...\"]}';\nv2.instruction +=\n  \" Each description is one sentence of at most 60 letters\" +\n  \" about the taste and ingredients in the notes.\" +\n  \" Make no claims the shop cannot check,\" +\n  \" and start each description differently.\";\n",
            occurrence: 1,
          }
      - {
          id: expect-final-v2,
          type: expect.file,
          at: { afterAction: sel-v2 },
          path: src/prompt-v2.js,
          contains: "export const v2 = { instruction, format };\nv2.format =\n  \"Answer with only the JSON object, with no code fence: \" +\n  '{\"descriptions\": [\"...\", \"...\", \"...\"]}';\nv2.instruction +=\n  \" Each description is one sentence of at most 60 letters\" +\n  \" about the taste and ingredients in the notes.\" +\n  \" Make no claims the shop cannot check,\" +\n  \" and start each description differently.\";\n",
        }
checks:
  - { type: timing.p95Ms, max: 300 }
