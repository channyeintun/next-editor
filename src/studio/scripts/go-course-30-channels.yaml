        }

  - id: read-3
    narration: >-
      [[mark:point-r1]] ပထမ သုံးကြောင်းမှာ rider က မန္တလေး၊ နေပြည်တော်၊ ရန်ကုန် ပါဆယ် code တွေကို ပို့တဲ့
      အစဉ်အတိုင်း လက်ခံပြီး ထုတ်ပြပါတယ်။ [[mark:point-r3]] code သုံးခု ကုန်သွားပြီး channel close ဖြစ်တော့
      range loop ပြီးသွားလို့၊ rider က done ထဲ ပို့နိုင်ပြီး main ဆက်သွားနိုင်တာပါ။ [[mark:point-shelf]]
      နောက်ဆုံး စာကြောင်းမှာ နှစ် နဲ့ နှစ်၊ ပြီးတော့ ပို့ပြီး ဆိုတဲ့ စာ ထွက်လာပါတယ်။ ပထမ နှစ်က shelf ထဲမှာ
      ပါဆယ် နှစ်ခု ရှိနေတာ၊ ဒုတိယ နှစ်က နေရာ စုစုပေါင်း နှစ်ခု ရှိတာပါ။ ဘယ်သူမှ မယူပေမဲ့ deadlock
      မဖြစ်ပါဘူး၊ ပို့တဲ့ ပါဆယ် နှစ်ခုလုံးအတွက် စင်ပေါ်မှာ နေရာ ရှိခဲ့လို့ပါ။
    sources:
      - {
          title: "The Go Programming Language Specification — Length and capacity",
          url: "https://go.dev/ref/spec#Length_and_capacity",
        }
      - {
          title: "The Go Programming Language Specification — For statements with range clause",
          url: "https://go.dev/ref/spec#For_range",
        }
    actions:
      - {
          id: point-r1,
          type: console.point,
          at: { mark: point-r1 },
          target: { text: "rider: MDY-0001" },
        }
      - {
