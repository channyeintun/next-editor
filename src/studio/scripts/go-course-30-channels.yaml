          type: console.point,
          at: { mark: point-r3 },
          target: { text: "rider: YGN-0001" },
        }
      - {
          id: point-shelf,
          type: console.point,
          at: { mark: point-shelf },
          target: { text: "2 2 ပို့ပြီး" },
        }

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >-
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ board ပေါ်က program မှာ goroutine တစ်ခုပဲ ရှိပါတယ်၊ main ပါ။
      [[mark:quiz-one]] main က နေရာ တစ်ခု ပါတဲ့ channel ထဲကို code တစ်ခု ပို့ပြီး၊ နောက် line မှာ အဲဒီ channel
      ကနေ ကိုယ်တိုင် ပြန်ယူပြီး ထုတ်ပြပါတယ်။ ဒီ program က deadlock ဖြစ်မလား၊ ဒါမှမဟုတ် code ကို
      ထုတ်ပြမလား။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] အဖြေကတော့ ခ၊ code ကို
      ထုတ်ပြတာပါ။ ဘာကြောင့်လဲဆိုတော့ channel မှာ နေရာ တစ်ခု ရှိလို့ ပို့တာက ယူမယ့်သူကို မစောင့်ဘဲ ချက်ချင်း
      ပြီးသွားပြီး၊ main က နောက် line ကို ရောက်လာပြီး ကိုယ်တိုင် ပြန်ယူနိုင်လို့ပါ။ ဒီနေ့ ပထမဆုံး run လို
      နေရာ မပါတဲ့ channel ဆိုရင်တော့ ပို့တဲ့ line မှာတင် deadlock ဖြစ်မှာပါ။
    sources:
      - {
          title: "The Go Programming Language Specification — Channel types",
          url: "https://go.dev/ref/spec#Channel_types",
        }
    actions:
      - { id: collapse-3, type: runtime.collapseDock, at: { mark: quiz } }
      - {
          id: quiz,
          type: whiteboard.apply,
          at: { afterAction: collapse-3 },
          open: true,
          clear: true,
          upsertIds: [q-title, q-code, q-l1, q-l2, q-l3, q-a, q-b],
        }
      - {
          id: quiz-one,
          type: whiteboard.apply,
          at: { mark: quiz-one },
          upsertIds: [q-one],
          drawMs: 900,
        }
      - {
          id: quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-check],
          drawMs: 700,
        }

  - id: recap
    chapter: ပြန်ချုပ်ရရင်
    narration: >-
      [[mark:close-quiz]] ဒါဆို ပြန်ချုပ်ရရင်၊ [[mark:recap-make]] channel ဆိုတာ goroutine တွေကြား တန်ဖိုး
      လွှဲပေးတဲ့ လမ်းဖြစ်ပြီး make နဲ့ ဖန်တီးရပါတယ်။ နေရာ မပါတဲ့ channel မှာ ပို့တဲ့သူနဲ့ ယူတဲ့သူ ဆုံမှပဲ
      လက်လွှဲပြီး၊ ယူမယ့်သူ မရှိရင် deadlock ဖြစ်ပါတယ်။ [[mark:recap-range]] ပါဆယ် အများကြီး ပို့တဲ့အခါ
      ပို့ပြီးရင် close လုပ်ပြီး၊ လက်ခံတဲ့ ဘက်က range နဲ့ close မဖြစ်မချင်း တစ်ခုချင်း ယူပါတယ်။
      [[mark:recap-shelf]] make မှာ နံပါတ် ထည့်ပေးရင် စင်လို နေရာ ပါတဲ့ buffered channel ရပြီး၊ စင်
      မပြည့်သေးသရွေ့ ပို့တာက မစောင့်ပါဘူး။ နောက် lesson မှာတော့ rider အဖွဲ့ တစ်ဖွဲ့လုံးက အလုပ်တွေကို
      ခွဲယူလုပ်တာနဲ့၊ အချိန် ကန့်သတ်ပြီး မျှော်တဲ့ select ကို လေ့လာသွားပါမယ်။
    sources:
      - { title: "Effective Go — Concurrency", url: "https://go.dev/doc/effective_go#concurrency" }
    actions:
      - {
          id: close-quiz,
          type: whiteboard.apply,
          at: { mark: close-quiz },
          open: false,
          upsertIds: [],
        }
      - id: recap-make
        type: editor.select
        at: { mark: recap-make }
        target: { file: main.go, text: "parcels := make(chan string)", occurrence: 1 }
      - id: recap-range
        type: editor.select
        at: { mark: recap-range }
        target: { file: main.go, text: "\tclose(parcels)", occurrence: 1 }
      - id: recap-shelf
        type: editor.select
        at: { mark: recap-shelf }
        target: { file: main.go, text: "shelf := make(chan string, 2)", occurrence: 1 }

checks:
  - { type: timing.p95Ms, max: 300 }
