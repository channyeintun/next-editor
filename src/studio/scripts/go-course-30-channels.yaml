# Go course, lesson 30: channels (Burmese).
#
# Start state: main.go with `package main`, `import "fmt"` and an empty `func main`.
# Edits, all insert-only (final state: probes/probe.ts `final`, output = probe 29-close-range):
#   1. `parcels := make(chan string)`, one send and a Println, nobody receiving
#      -> run-1: `fatal error: all goroutines are asleep - deadlock!` at main.go:7 (probe 29-deadlock);
#   2. a rider goroutine receiving one code above the send, then a `done` channel: the rider sends
#      true when it has printed, main receives it after the send -> run-2: rider: MDY-0001 / ပို့ပြီး
#      (probe 29-handover);
#   3. two more sends and `close(parcels)`; the one-receive line commented out by insertion and a
#      range loop over the channel in its place (the Println indented into it); a buffered `shelf`
#      with two places, two sends nobody receives, len and cap into the last Println
#      -> run-3: three rider lines and `2 2 ပို့ပြီး`.
# Boards: (H) the hand-over counter: the sender's hand stays out until the rider takes the slip;
# after run-1 the rider side struck out = deadlock; (S) buffered = a shelf with two places;
# (Q) the quiz (a shelf with one place, main sends and takes it back itself; probe `quiz`).
# Fixtures: bun ~/Documents/go-course-work/tools/sim-go.ts <this yaml> --write
schemaVersion: 1

