build:
  # Studio replaces this built-in profile at render time with the Burmese provider chosen in the
  # render console (AthanLab with the user's own key, or VoxCPM2 when that feature is enabled).
  voiceProfile: pocket-alba-v1
  seed: 3110
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "unknown နဲ့ never ဆိုတာ"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ type of တို့၊ in တို့၊ instance of တို့လို JavaScript ရဲ့ စစ်ဆေးချက်တွေနဲ့
      union type ကို narrow လုပ်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ ဘာ type မှန်း လုံးဝ မသိရတဲ့ တန်ဖိုးကို ဘေးကင်းကင်း
      သုံးနည်းနဲ့၊ တန်ဖိုး တစ်ခုမှ မရှိနိုင်တဲ့ type အကြောင်းကို ကြည့်သွားပါမယ်။ [[mark:draw-ladder-top]]
      type တွေကို အကျယ်ဆုံးကနေ အကျဉ်းဆုံးထိ လှေကားထစ်လို စီကြည့်ရအောင်။ အပေါ်ဆုံးမှာ unknown type ရှိပါတယ်။
      unknown ဆိုတာ ဘာ တန်ဖိုး မဆို ဖြစ်နိုင်တယ်လို့ ပြောတဲ့ type ဖြစ်လို့၊ JavaScript ရဲ့ တန်ဖိုး အားလုံး
      သူ့ထဲကို ဝင်ပါတယ်။ [[mark:draw-ladder-middle]] သူ့အောက်မှာ string တို့၊ number တို့၊ object တို့လို နေ့တိုင်း
      သုံးနေတဲ့ type တွေ ရှိပါတယ်။ [[mark:draw-ladder-literal]] အဲဒီ အောက်မှာတော့ လက်ဖက်ရည် ဆိုတဲ့ စာသား
      တစ်ခုတည်းကိုပဲ လက်ခံတဲ့ literal type လို ပိုကျဉ်းတဲ့ type တွေ ရှိပါတယ်။ ဆိုတော့ လှေကားအတိုင်း အောက်ကို
      ဆင်းလေ၊ လက်ခံတဲ့ တန်ဖိုး နည်းလေ ဖြစ်ပါတယ်။ [[mark:draw-any]] any type ကတော့ ဒီ လှေကားပေါ်မှာ နေရာ
      မရှိပါဘူး။ any ဆိုတာ type စစ်တာကို ပိတ်လိုက်တာ ဖြစ်လို့၊ ဘာ တန်ဖိုးကို ထည့်ထည့် လက်ခံသလို၊ သူ့ကို
      ဘာ လုပ်လုပ် TypeScript က ဘာမှ မပြောတော့ပါဘူး။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 5: unknown and never (the widest and the narrowest type)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/unions-literals-and-narrowing",
        }
      - {
          title: "TypeScript Handbook: More on Functions (unknown, never)",
          url: "https://www.typescriptlang.org/docs/handbook/2/functions.html#unknown",
        }
      - {
          title: "TypeScript Handbook: Everyday Types (any)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#any",
        }
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [l-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-ladder-top
        type: whiteboard.apply
        at: { mark: draw-ladder-top }
        upsertIds: [l-unknown-box, l-unknown-text]
        drawMs: 2000
      - id: draw-ladder-middle
        type: whiteboard.apply
        at: { mark: draw-ladder-middle }
        upsertIds: [l-arrow-1, l-middle-box, l-middle-text]
        drawMs: 2200
      - id: draw-ladder-literal
        type: whiteboard.apply
        at: { mark: draw-ladder-literal }
        upsertIds: [l-arrow-2, l-literal-box, l-literal-text, l-down-note]
        drawMs: 3000
      - id: draw-any
        type: whiteboard.apply
        at: { mark: draw-any }
        upsertIds: [l-any-box, l-any-text, l-any-sub]
        drawMs: 2200

  - id: starter
    narration: >
      [[mark:close-board]] ဒီနေ့ code ကို ကြည့်ရအောင်။ [[mark:open-inbox]] ဆိုင်က online အော်ဒါ app
      တစ်ခုနဲ့ ချိတ်ထားပြီး၊ app က အော်ဒါတွေကို JSON စာသား အနေနဲ့ ပို့ပါတယ်။ ဒီ ဖိုင်ထဲမှာ အဲဒီလို ဝင်လာတဲ့ စာ
      သုံးစောင် ရှိပါတယ်။ [[mark:select-good]] ပထမ စာမှာ
      လက်ဖက်ရည် နှစ်ခွက် ဆိုတဲ့ အော်ဒါ ပါပါတယ်။ [[mark:select-no-item]] ဒုတိယ စာမှာတော့ ခွက်ရေ ပါပေမယ့်
      ပစ္စည်း နာမည် မပါပါဘူး။ [[mark:select-broken]] တတိယ စာကတော့ တစ်ဝက်မှာ ပြတ်သွားတဲ့ JSON ပါ။ program
      ရဲ့ အပြင်ကနေ ဝင်လာတဲ့ data ဆိုတာ ဒီလိုပဲ ဘာ ဖြစ်လာမလဲ ကြိုမသိနိုင်ပါဘူး။ [[mark:open-main]] main
      ဖိုင်ကို ကြည့်ရအောင်။ [[mark:select-read-item]] ဒီ function က JSON စာသားကို JSON parse နဲ့ object
      ပြန်ပြောင်းပြီး၊ ပစ္စည်း နာမည်ကို string အနေနဲ့ ပြန်ပေးပါတယ်။ [[mark:select-loop]] အောက်က loop ကတော့
      စာ တစ်ခုချင်းစီကို ဖတ်ပြီး ထုတ်ပြပါတယ်။ [[mark:select-catch-log]] ဖတ်လို့ မရတဲ့ စာ ဆိုရင်တော့ catch
      ထဲကို ရောက်ပြီး၊ ဖတ်လို့ မရပါ ဆိုတဲ့ စာကို ပြပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 5: unknown (values from outside the program)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/unions-literals-and-narrowing",
        }
      - {
          title: "MDN: JSON.parse()",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/JSON/parse",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: open-inbox
        type: workspace.openFile
        at: { mark: open-inbox }
        path: src/inbox.ts
      - id: select-good
        type: editor.select
        at: { mark: select-good }
        target: { file: src/inbox.ts, text: '''{"item":"လက်ဖက်ရည်","cups":2}''', occurrence: 1 }
      - id: select-no-item
        type: editor.select
        at: { mark: select-no-item }
        target: { file: src/inbox.ts, text: '''{"cups":1}''', occurrence: 1 }
      - id: select-broken
        type: editor.select
        at: { mark: select-broken }
        target: { file: src/inbox.ts, text: '''{"item":'',', occurrence: 1 }
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: src/main.ts
      - id: select-read-item
        type: editor.select
        at: { mark: select-read-item }
        target:
          {
            file: src/main.ts,
            text: "function readItem(text: string): string {\n  const data = JSON.parse(text);\n  return data.item;\n}",
            occurrence: 1,
          }
      - id: select-loop
        type: editor.select
        at: { mark: select-loop }
        target: { file: src/main.ts, text: "    console.log(readItem(text));", occurrence: 1 }
      - id: select-catch-log
        type: editor.select
        at: { mark: select-catch-log }
        target:
          {
            file: src/main.ts,
            text: "  } catch (error) {\n    console.log(\"ဖတ်လို့ မရပါ\");",
            occurrence: 1,
          }

  - id: panel
    narration: >
      [[mark:panel-ready]] ညာဘက် panel ရဲ့ Errors မှာ ဘာမှ မရှိပါဘူး။ ဒါပေမဲ့ Output ကို ကြည့်ပါ။
      [[mark:read-output]] ပထမ စာက လက်ဖက်ရည် ဆိုပြီး မှန်ပေမယ့်၊ ဒုတိယ စာမှာ undefined ထွက်လာပါတယ်။
      function က string ပြန်ပေးမယ်လို့ ကတိ ပေးထားပေမယ့်၊ တကယ်တော့ undefined ကို ပြန်ပေးလိုက်တာပါ။ တတိယ
      စာကတော့ catch ထဲကို ရောက်သွားပါတယ်။ [[mark:read-why-any]] ဒါဆို ဒုတိယ စာရဲ့ ပြဿနာကို TypeScript က
      ဘာလို့ မပြောတာလဲ။ JSON parse က any type ကို ပြန်ပေးလို့ပါ။ any ဖြစ်သွားတဲ့ တန်ဖိုးကနေ ဘာ property
      ပဲ ယူယူ၊ TypeScript က လုံးဝ မစစ်တော့လို့ ကိုယ့် program ထဲကို undefined က လွတ်လွတ်လပ်လပ်
      ဝင်လာတာပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 5: What's the difference between unknown and any?",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/unions-literals-and-narrowing",
        }
      - {
          title: "TypeScript lib: JSON.parse returns any",
          url: "https://github.com/microsoft/TypeScript/blob/main/src/lib/es5.d.ts",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-no-errors
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-output-three
        type: expect.preview
        at: { afterAction: expect-no-errors }
        timeoutMs: 5000
        target: { by: testId, value: ts-output }
        attribute: { name: data-count, value: "3" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-tea
        type: expect.preview
        at: { afterAction: expect-output-three }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-1 }
        textContains: "လက်ဖက်ရည်"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-undefined
        type: expect.preview
        at: { afterAction: expect-tea }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-2 }
        textContains: "undefined"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-cannot-read
        type: expect.preview
        at: { afterAction: expect-undefined }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-3 }
        textContains: "ဖတ်လို့ မရပါ"
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: unknown
    chapter: "any အစား unknown"
    narration: >
      [[mark:select-parse]] ဒါကြောင့် JSON parse က ပြန်ပေးတဲ့ ဒီ တန်ဖိုးကို any အနေနဲ့ မထားတော့ဘဲ unknown
      အနေနဲ့ လက်ခံပါမယ်။ [[mark:type-unknown]] ဒါအတွက် variable နာမည်ရဲ့ နောက်မှာ unknown type
      annotation တစ်ခု ထည့်ပေးလိုက်ရုံပါပဲ။ [[mark:read-unknown-error]] data က unknown type ဖြစ်နေတယ် ဆိုတဲ့ error တစ်ခု ချက်ချင်း
      ပေါ်လာပါပြီ။ unknown ကလည်း any လိုပဲ ဘာ တန်ဖိုး မဆို လက်ခံပါတယ်။ ဒါပေမဲ့ any နဲ့ မတူတာက၊ ဘာ တန်ဖိုး
      ဖြစ်လဲ မစစ်ရသေးခင် သူ့ property ကို ယူတာ၊ method ခေါ်တာ ဘာမှ လုပ်ခွင့် မပေးတာပါ။ ဒါကြောင့် ပြင်ပကနေ
      ဝင်လာတဲ့ data အတွက် unknown က any ထက် အများကြီး ဘေးကင်းပါတယ်။ [[mark:read-unknown-output]] Output
      ကတော့ မပြောင်းပါဘူး။ type annotation က program run ပုံကို မပြောင်းဘဲ၊ စစ်ဖို့ လိုတဲ့ နေရာကိုပဲ
      ပြပေးတာ ဖြစ်လို့ပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 5: The widest type, unknown; unknown vs any",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/unions-literals-and-narrowing",
        }
      - {
          title: "TypeScript 3.0 release notes: the unknown type",
          url: "https://www.typescriptlang.org/docs/handbook/release-notes/typescript-3-0.html#new-unknown-top-type",
        }
    actions:
      - id: select-parse
        type: editor.select
        at: { mark: select-parse }
        target: { file: src/main.ts, text: "const data = JSON.parse(text);", occurrence: 1 }
      - id: type-unknown
        type: editor.type
        at: { mark: type-unknown }
        target: { file: src/main.ts, after: "  const data", occurrence: 1 }
        text: ": unknown"
      - id: expect-unknown-error
        type: expect.preview
        at: { afterAction: type-unknown }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-unknown-code
        type: expect.preview
        at: { afterAction: expect-unknown-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "'data' is of type 'unknown'."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-still-undefined
        type: expect.preview
        at: { afterAction: expect-unknown-code }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-2 }
        textContains: "undefined"
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: guard
    chapter: "တစ်ဆင့်ချင်း narrow လုပ်ခြင်း"
    narration: >
      [[mark:type-guard]] ဒါဆို data က ပစ္စည်း နာမည် ပါတဲ့ object ဟုတ်မဟုတ် စစ်ပေးမယ့် function တစ်ခု
      ရေးကြည့်ရအောင်။ parameter က unknown ဖြစ်ပြီး၊ ပထမ အဆင့်အနေနဲ့ object ဟုတ်မဟုတ်ကို type of နဲ့
      စစ်ပါမယ်။ function နာမည်ရဲ့ အောက်မှာ query comment လည်း ထည့်ထားပါတယ်။ [[mark:read-guard-1]] Types
      အပိုင်းကို ကြည့်ပါ။ ပြန်ပေးမယ့် type နေရာမှာ boolean အစား type predicate လို့ ခေါ်တဲ့ ပုံစံ
      ပေါ်နေပါတယ်။ ဆိုလိုတာက ဒီ function က true ပြန်ပေးရင်၊ value က object ဒါမှမဟုတ် null ဖြစ်တယ် ဆိုတာပါ။
      TypeScript ၅.၅ ကစပြီး ဒီလို စစ်ပေးတဲ့ function ရဲ့ type predicate ကို TypeScript က သူ့ဘာသာ infer
      လုပ်ပေးပါတယ်။ null ပါနေတာကတော့ JavaScript မှာ null ကို type of နဲ့ စစ်ရင် object လို့ ထွက်လို့ပါ။
      [[mark:type-not-null]] ဒါကြောင့် null မဟုတ်ဘူး ဆိုတဲ့ အဆင့်ကို ထပ်ထည့်ပါမယ်။ [[mark:read-guard-2]]
      ဒီတစ်ခါ object တစ်ခုတည်း ကျန်ပါတော့တယ်။ [[mark:type-in-item]] နောက်ဆုံး အဆင့်အနေနဲ့ item ဆိုတဲ့
      property ရှိမရှိကို in နဲ့ စစ်ပါမယ်။ [[mark:read-guard-3]] အခု item property ပါတဲ့ object လို့
      ပြနေပါတယ်။ Record ဆိုတာ key နဲ့ value ရဲ့ type ကို ပြောတဲ့ type ဖြစ်ပြီး၊ နောက် lesson တွေမှာ
      အသေးစိတ် ကြည့်ပါမယ်။ item ရဲ့ type ကတော့ unknown ဖြစ်နေတုန်းပါ။ ရှိတာ သေချာပေမယ့်၊ ဘာ တန်ဖိုးလဲ
      ဆိုတာကို မစစ်ရသေးလို့ပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 5: Narrowing unknown to a value; reusable type guards",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/unions-literals-and-narrowing",
        }
      - {
          title: "Announcing TypeScript 5.5: inferred type predicates",
          url: "https://devblogs.microsoft.com/typescript/announcing-typescript-5-5/#inferred-type-predicates",
        }
      - {
          title: 'MDN: typeof null is "object"',
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/typeof#typeof_null",
        }
    actions:
      - id: type-guard
        type: editor.type
        at: { mark: type-guard }
        target:
          { file: src/main.ts, after: "import { messages } from \"./inbox\";\n\n", occurrence: 1 }
        text: "function hasItem(value: unknown) {\n  //     ^?\n  return typeof value === \"object\";\n}\n\n"
        cadence: block
      - id: expect-guard-1
        type: expect.preview
        at: { afterAction: type-guard }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        attribute:
          { name: data-type, value: "function hasItem(value: unknown): value is object | null" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-not-null
        type: editor.type
        at: { mark: type-not-null }
        target: { file: src/main.ts, after: '  return typeof value === "object"', occurrence: 1 }
        text: " && value !== null"
        cadence: fast-explainer
      - id: expect-guard-2
        type: expect.preview
        at: { afterAction: type-not-null }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        attribute: { name: data-type, value: "function hasItem(value: unknown): value is object" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-in-item
        type: editor.type
        at: { mark: type-in-item }
        target: { file: src/main.ts, after: " && value !== null", occurrence: 1 }
        text: ' && "item" in value'
        cadence: fast-explainer
      - id: expect-guard-3
        type: expect.preview
        at: { afterAction: type-in-item }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        attribute:
          {
            name: data-type,
            value: 'function hasItem(value: unknown): value is object & Record<"item", unknown>',
          }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: use-guard
    narration: >
      [[mark:type-use-guard]] အခု ဒီ function ကို ပစ္စည်း နာမည် ဖတ်တဲ့ function ထဲမှာ သုံးပါမယ်။ စစ်လို့
      မအောင်ရင် မသိပါ ဆိုတဲ့ စာနဲ့ စောစော return လုပ်ပါမယ်။ [[mark:read-use-guard]] item မပါတဲ့ ဒုတိယ စာက
      ဒီ စစ်ဆေးချက်မှာ ကျသွားလို့၊ Output ရဲ့ ဒုတိယ line က undefined အစား မသိပါ ဖြစ်သွားပါပြီ။ error ကလည်း
      ပြောင်းသွားပါတယ်။ data ကို သုံးလို့ ရသွားပေမယ့်၊ item ရဲ့ type က unknown ဖြစ်နေလို့ string ပြန်ပေးရမယ့်
      နေရာမှာ ပြန်ပေးလို့ မရဘူးလို့ ပြောနေတာပါ။ [[mark:type-item-string]] ဒါကြောင့် item က string
      ဟုတ်မဟုတ်ကိုပါ type of နဲ့ စစ်ပါမယ်။ [[mark:read-use-guard-fixed]] error မရှိတော့ပါဘူး။ ပြင်ပကနေ
      ဝင်လာတဲ့ data ကို ဒီလို တစ်ဆင့်ချင်း စစ်ပြီးမှ သုံးရတာက unknown ရဲ့ အဓိက အလုပ်ပါ။ စစ်ရမယ့် အချက်တွေ
      များလာရင်တော့ ဒီလို code ကို ကိုယ်တိုင် မရေးဘဲ Zod လို library ကို သုံးကြပြီး၊ course ရဲ့ နောက်ပိုင်းမှာ
      ကြည့်ပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 5: Narrowing unknown to a value",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/unions-literals-and-narrowing",
        }
      - {
          title: "TypeScript Handbook: Narrowing (using type predicates)",
          url: "https://www.typescriptlang.org/docs/handbook/2/narrowing.html#using-type-predicates",
        }
    actions:
      - id: type-use-guard
        type: editor.type
        at: { mark: type-use-guard }
        target:
          { file: src/main.ts, after: "  const data: unknown = JSON.parse(text);\n", occurrence: 1 }
        text: "  if (!hasItem(data)) return \"မသိပါ\";\n"
        cadence: fast-explainer
      - id: expect-use-guard-error
        type: expect.preview
        at: { afterAction: type-use-guard }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-1 }
        textContains: "Type 'unknown' is not assignable to type 'string'."
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-unknown-item
        type: expect.preview
        at: { afterAction: expect-use-guard-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-2 }
        textContains: "မသိပါ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-item-string
        type: editor.type
        at: { mark: type-item-string }
        target:
          { file: src/main.ts, after: "  if (!hasItem(data)) return \"မသိပါ\";\n", occurrence: 1 }
        text: "  if (typeof data.item !== \"string\") return \"မသိပါ\";\n"
        cadence: line-by-line
      - id: expect-use-guard-clean
        type: expect.preview
        at: { afterAction: type-item-string }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: catch
    chapter: "catch ထဲက error"
    narration: >
      [[mark:select-catch]] အခု catch ကို ကြည့်ရအောင်။ ဖတ်လို့ မရပါ ဆိုရုံနဲ့ မလုံလောက်လို့၊ ဘာကြောင့် ဖတ်လို့
      မရလဲ ဆိုတာပါ ပြချင်ပါတယ်။ [[mark:type-message]] ဒါကြောင့် ဒီ စာရဲ့ နောက်မှာ error ရဲ့ message
      ကိုပါ ထည့်ပြီး ထုတ်ပြပါမယ်။ [[mark:read-catch-error]] Output ရဲ့ တတိယ line မှာ JSON စာ မဆုံးခင် ပြတ်သွားတယ် ဆိုတဲ့
      message ပါလာပေမယ့်၊ Errors မှာတော့ error ဟာ unknown type ဖြစ်နေတယ် ဆိုတဲ့ error ပေါ်လာပါတယ်။
      run တဲ့ အချိန်မှာ ဒီ error က တကယ် Error object ဖြစ်နေပေမယ့်၊ TypeScript က အဲဒါကို ကြိုမသိနိုင်ပါဘူး။
      [[mark:read-catch-why]] ဘာကြောင့်လဲဆိုတော့ JavaScript မှာ Error object တင် မကဘဲ၊ စာသား ဖြစ်ဖြစ်၊ ဂဏန်း ဖြစ်ဖြစ်၊ ဘာကိုမဆို
      throw လုပ်လို့ ရလို့ပါ။ ဒါကြောင့် strict mode မှာ catch ထဲက error ကို unknown လို့ သတ်မှတ်ထားတာပါ။
      [[mark:type-instanceof]] ပြီးခဲ့တဲ့ lesson မှာလိုပဲ instance of နဲ့ Error ဟုတ်မဟုတ် စစ်ပါမယ်။ Error
      မဟုတ်ရင်တော့ ဒီနေရာမှာ handle လုပ်လို့ မရတဲ့ တန်ဖိုး ဖြစ်လို့ ပြန် throw လုပ်လိုက်ပါမယ်။
      [[mark:read-catch-fixed]] error ပျောက်သွားပါပြီ။ throw လုပ်တဲ့ line ရဲ့ အောက်မှာ error က Error
      type ဖြစ်သွားလို့၊ message ကို သုံးလို့ ရသွားတာပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 5: Narrowing errors with instanceof",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/unions-literals-and-narrowing",
        }
      - {
          title: "TSConfig: useUnknownInCatchVariables (part of strict)",
          url: "https://www.typescriptlang.org/tsconfig/#useUnknownInCatchVariables",
        }
      - {
          title: "MDN: throw (any expression can be thrown)",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/throw",
        }
    actions:
      - id: select-catch
        type: editor.select
        at: { mark: select-catch }
        target: { file: src/main.ts, text: 'console.log("ဖတ်လို့ မရပါ");', occurrence: 1 }
      - id: type-message
        type: editor.type
        at: { mark: type-message }
        target: { file: src/main.ts, after: '    console.log("ဖတ်လို့ မရပါ"', occurrence: 1 }
        text: ", error.message"
      - id: expect-catch-error
        type: expect.preview
        at: { afterAction: type-message }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-1 }
        textContains: "'error' is of type 'unknown'."
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-message-output
        type: expect.preview
        at: { afterAction: expect-catch-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-3 }
        textContains: "ဖတ်လို့ မရပါ Unexpected end of JSON input"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-instanceof
        type: editor.type
        at: { mark: type-instanceof }
        target: { file: src/main.ts, after: "  } catch (error) {\n", occurrence: 1 }
        text: "    if (!(error instanceof Error)) throw error;\n"
        cadence: line-by-line
      - id: expect-catch-clean
        type: expect.preview
        at: { afterAction: type-instanceof }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: never
    chapter: "never type"
    narration: >
      [[mark:board-never]] လှေကားကို ပြန်ကြည့်ရအောင်။ [[mark:draw-never]] အောက်ဆုံးမှာ never type
      ရှိပါတယ်။ never ဆိုတာ တန်ဖိုး တစ်ခုမှ မရှိနိုင်တဲ့ type ပါ။ unknown ထဲကို ဘာ တန်ဖိုး မဆို ဝင်သလို၊ never
      ထဲကိုတော့ ဘာ တန်ဖိုးမှ ဝင်လို့ မရပါဘူး။ ဒါဆို ဘယ်လို နေရာမှာ တွေ့ရမလဲ။ [[mark:close-ladder]]
      code ထဲမှာ ကြည့်ရအောင်။ [[mark:type-fail]] ဆက်လုပ်လို့ မရတော့တဲ့ အခါ error ကို throw လုပ်ပေးမယ့်
      helper function သေးသေးလေး တစ်ခု ရေးပါမယ်။ နာမည်ရဲ့ အောက်မှာ query comment လည်း ထည့်ထားပါတယ်။
      [[mark:read-fail]] ပြန်ပေးမယ့် type ကို never လို့ ပြနေပါတယ်။ ဒီ function က အမြဲ throw လုပ်တဲ့အတွက်၊
      ပုံမှန်အတိုင်း ပြီးဆုံးပြီး တန်ဖိုး ပြန်ပေးတာ ဘယ်တော့မှ မဖြစ်လို့ပါ။ void ကတော့ function က ပုံမှန်
      ပြီးဆုံးပေမယ့် အသုံးဝင်တဲ့ တန်ဖိုး ပြန်မပေးတာ ဖြစ်လို့ အဓိပ္ပာယ် မတူပါဘူး။ [[mark:read-fail-keyword]]
      တစ်ခု သတိထားရမှာက၊ ဒီ function ကို function keyword နဲ့ ရေးထားရင်တော့ TypeScript က void လို့ပဲ infer
      လုပ်လို့၊ never ကို ကိုယ်တိုင် ရေးပေးရပါတယ်။ never ကို နောက်ထပ် တွေ့ရတဲ့ နေရာကတော့ union ထဲက type
      တွေကို တစ်ခုချင်း narrow လုပ်ရင်း ဘာမှ မကျန်တော့တဲ့ နေရာပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 5: The narrowest type, never; never vs void",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/unions-literals-and-narrowing",
        }
      - {
          title: "TypeScript Handbook: More on Functions (never)",
          url: "https://www.typescriptlang.org/docs/handbook/2/functions.html#never",
        }
      - {
          title: "TypeScript Handbook: Narrowing (the never type)",
          url: "https://www.typescriptlang.org/docs/handbook/2/narrowing.html#the-never-type",
        }
    actions:
      - id: board-never
        type: whiteboard.apply
        at: { mark: board-never }
        open: true
      - id: draw-never
        type: whiteboard.apply
        at: { mark: draw-never }
        upsertIds: [l-arrow-3, l-never-box, l-never-text, l-never-note]
        drawMs: 2800
      - id: close-ladder
        type: whiteboard.apply
        at: { mark: close-ladder }
        open: false
      - id: type-fail
        type: editor.type
        at: { mark: type-fail }
        target:
          {
            file: src/main.ts,
            after: "    console.log(\"ဖတ်လို့ မရပါ\", error.message);\n  }\n}\n",
            occurrence: 1,
          }
        text: "\nconst fail = (reason: string) => {\n  //  ^?\n  throw new Error(reason);\n};\n"
        cadence: block
      - id: expect-fail-never
        type: expect.preview
        at: { afterAction: type-fail }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-2 }
        attribute: { name: data-type, value: "const fail: (reason: string) => never" }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: recap
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ unknown က ဘာ တန်ဖိုး မဆို လက်ခံတဲ့ အကျယ်ဆုံး type ဖြစ်ပြီး၊
      မစစ်ရသေးခင် ဘာမှ လုပ်ခွင့် မပေးလို့ any ထက် ဘေးကင်းပါတယ်။ ပြင်ပကနေ ဝင်လာတဲ့ data နဲ့ catch ထဲက error
      ကို unknown အနေနဲ့ လက်ခံပြီး၊ type of တို့၊ in တို့၊ instance of တို့နဲ့ တစ်ဆင့်ချင်း narrow
      လုပ်ရပါတယ်။ [[mark:recap-guard]] ဒီ စစ်ဆေးချက်တွေကို function တစ်ခုထဲ ထည့်ထားရင်၊ TypeScript က type
      predicate ကို infer လုပ်ပေးလို့ နေရာတိုင်းမှာ ပြန်သုံးလို့ ရပါတယ်။ [[mark:recap-never]] never ကတော့
      တန်ဖိုး တစ်ခုမှ မရှိတဲ့ အကျဉ်းဆုံး type ဖြစ်ပြီး၊ အမြဲ throw လုပ်တဲ့ function က never ကို ပြန်ပေးပါတယ်။
      နောက် lesson မှာတော့ status လိုမျိုး property တစ်ခုနဲ့ ခွဲခြားလို့ရတဲ့ discriminated union ကို
      ကြည့်သွားပါမယ်။ အဲဒီမှာ never က union ထဲက type တွေ အကုန် handle လုပ်ပြီးပြီလား စစ်ပေးတာကိုပါ
      တွေ့ရပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 5: unknown and never",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/unions-literals-and-narrowing",
        }
      - {
          title: "TypeScript Handbook: Narrowing (exhaustiveness checking)",
          url: "https://www.typescriptlang.org/docs/handbook/2/narrowing.html#exhaustiveness-checking",
        }
    actions:
      - id: select-unknown
        type: editor.select
        at: { mark: recap }
        target: { file: src/main.ts, text: "const data: unknown", occurrence: 1 }
      - id: select-guard
        type: editor.select
        at: { mark: recap-guard }
        target:
          {
            file: src/main.ts,
            text: '  return typeof value === "object" && value !== null && "item" in value;',
            occurrence: 1,
          }
      - id: select-fail
        type: editor.select
        at: { mark: recap-never }
        target: { file: src/main.ts, text: "const fail = (reason: string) => {", occurrence: 1 }
      - id: expect-file-unknown
        type: expect.file
        at: { afterAction: select-unknown }
        path: src/main.ts
        contains: "  const data: unknown = JSON.parse(text);\n  if (!hasItem(data)) return \"မသိပါ\";\n  if (typeof data.item !== \"string\") return \"မသိပါ\";\n"
      - id: expect-file-guard
        type: expect.file
        at: { afterAction: expect-file-unknown }
        path: src/main.ts
        contains: '  return typeof value === "object" && value !== null && "item" in value;'
      - id: expect-file-catch
        type: expect.file
        at: { afterAction: expect-file-guard }
        path: src/main.ts
        contains: "    if (!(error instanceof Error)) throw error;\n    console.log(\"ဖတ်လို့ မရပါ\", error.message);"
      - id: expect-file-fail
        type: expect.file
        at: { afterAction: expect-file-catch }
        path: src/main.ts
        contains: "const fail = (reason: string) => {\n  //  ^?\n  throw new Error(reason);\n};"
checks:
  - { type: timing.p95Ms, max: 300 }
