# Go course, lesson 26: generics (Burmese).
#
# Start state: main.go with `sumKyats` (adds kyats, an int slice) and a main that prints it;
# parcel.go pinned (the canonical Parcel and cityNames, COURSE-KIT §3.4).
# Edits, all insert-only:
#   1. `sumKg` (the same loop for float64) and its Println -> run-1: 12500 / 4;
#   2. the generic `Sum[T int | float64]` and two calls, then `Filter[T any]`, three parcels and
#      the Filter call -> run-2: 12500 / 4 / 12500 / 4 / 2 MDY-0001;
#   3. `fmt.Println(Sum([]string{"MDY", "NPT"}))` -> run-3: compile error
#      `string does not satisfy int | float64 (string missing in int | float64)`;
#      then `// ` in front of that line (the final state compiles; it prints run-2's output).
# Boards: (D) the same loop twice, only the types differ; (G) one stamp design with a blank:
# T, the type parameter; (C) constraints: int | float64, any, comparable, cmp.Ordered;
# (W) generics all along in slices, write the plain function first, generic methods; (Q) quiz.
# Fixtures: bun ~/Documents/go-course-work/tools/sim-go.ts <this yaml> --write
schemaVersion: 1

lesson:
  slug: go-course-26-generics
  title: "Go course 26: Generics နဲ့ type မျိုးစုံ"
  locale: my-MM
  workspace:
    lessonType: go
    name: Go Course
    entryFilePath: main.go
    # Two files: the explorer shows where Parcel lives (the lesson opens parcel.go once).
    sidebarStartsCollapsed: false
    files:
      main.go: |
        package main

        import "fmt"

        // sumKyats adds up amounts of money in kyats.
        func sumKyats(xs []int) int {
        	var total int
        	for _, x := range xs {
        		total += x
        	}
        	return total
        }

        func main() {
        	fmt.Println(sumKyats([]int{6000, 4500, 2000}))
        }
      parcel.go: |
        package main

        // Parcel is one parcel handed in at the counter.
        type Parcel struct {
        	Code     string  // tracking code: "MDY-0001"
        	To       string  // city code: "MDY"
        	WeightKg float64 // weight in kilograms
        }

        // cityNames holds the cities the service sends to, by code.
        var cityNames = map[string]string{
        	"YGN": "ရန်ကုန်",
        	"BGO": "ပဲခူး",
        	"NPT": "နေပြည်တော်",
        	"MLM": "မော်လမြိုင်",
        	"MDY": "မန္တလေး",
        	"TGI": "တောင်ကြီး",
        }
