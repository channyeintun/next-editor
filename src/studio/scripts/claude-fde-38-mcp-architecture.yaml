        # ticket-mcp: ဘာ ပေးမလဲ၊ ဘယ်သူ ချိတ်မလဲ

        ## Server
        - ticket-mcp: Ticket system နဲ့ NMS ကို ဖတ်ပေးတဲ့ MCP server တစ်ခု (Python)

        ## Tool များ

        ## ချိတ်မယ့် host များ

        ## စည်းကမ်း
