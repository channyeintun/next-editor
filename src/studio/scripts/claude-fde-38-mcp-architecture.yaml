runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: need
    chapter: App သုံးခု၊ system တစ်ခု
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ Billing team ရဲ့ agent၊ hook တွေကို plugin တစ်ခုထဲ ထုပ်ပြီး၊ Network Tools team ပါ
      version တူ install လုပ်လို့ ရအောင် လုပ်ခဲ့ပါတယ်။
      [[mark:n-open]] ဒီအပတ်မှာ နေခြည် ရဲ့ app သုံးခုက တစ်ချိန်တည်းမှာ Ticket system ကို ဖတ်ချင်လာပါတယ်။
      [[mark:sel-ticket]] Ticket system ဆိုတာ customer တွေရဲ့ တိုင်ကြားချက် ticket တွေ သိမ်းထားတဲ့ system ပါ။ ပထမ
      တစ်ခုက Reply assistant ပါ။ support ticket တစ်ခုအတွက် အဖြေ မူကြမ်း ရေးပေးတဲ့ agent ဖြစ်ပြီး၊ customer ရဲ့ အရင်
      ticket တွေကို ဖတ်ဖို့ လိုပါတယ်။
      [[mark:n-cc]] ဒုတိယ တစ်ခုက Billing developer တွေ သုံးတဲ့ Claude Code ပါ။ Claude Code ဆိုတာ terminal ထဲကနေ
      code ကို ဖတ်၊ ပြင်၊ command run ပေးတဲ့ coding agent ပါ။ ငွေတောင်းခံမှု bug တစ်ခုကို ရှာတဲ့အခါ၊ အဲဒီ bug ကို
      တိုင်ထားတဲ့ ticket တွေကို ဖတ်ချင်ပါတယ်။
      [[mark:n-desk]] တတိယ တစ်ခုကတော့ support lead တွေ ခက်တဲ့ ticket အတွက် အဖြေရေးတဲ့ Claude Desktop app ပါ။
      [[mark:sel-nms]] သုံးခုလုံးက NMS ကိုလည်း ဖတ်ချင်ပါတယ်။ NMS ဆိုတာ ဘယ်မြို့နယ်မှာ အခု လိုင်းကျနေလဲ ပြတဲ့ network
      monitoring system ပါ။
      [[mark:n-q]] app တစ်ခုစီက Ticket system နဲ့ NMS ကို သီးသန့် ချိတ်ရရင် အလုပ် ဘယ်လောက် များမလဲ။ ပြီးတော့ Ticket
      system ရဲ့ API ပြောင်းတဲ့နေ့မှာ ဘယ်နှနေရာ လိုက်ပြင်ရမလဲ။ ဒီ lesson မှာ အဲဒီ မေးခွန်းကို ဖြေပေးတဲ့ Model Context
      Protocol၊ အတိုကောက် MCP ကို လေ့လာပါမယ်။
    sources:
      - {
          title: "Model Context Protocol: Architecture overview (2026-07-28)",
          url: "https://modelcontextprotocol.io/docs/2026-07-28/learn/architecture",
        }
    actions:
      - { id: open-readme, type: workspace.openFile, at: { mark: n-open }, path: README.md }
      - id: sel-ticket
        type: editor.select
        at: { mark: sel-ticket }
        target:
          file: README.md
          text: "- Ticket system: customer ရဲ့ တိုင်ကြားချက်တွေ"
      - id: sel-nms
        type: editor.select
        at: { mark: sel-nms }
        target:
          file: README.md
          text: "- NMS: မြို့နယ်အလိုက် လိုင်းကျမှု အခြေအနေ"

  - id: tangle
    chapter: Standard မရှိရင်
    narration: >
      [[mark:m-open]] standard တစ်ခု မရှိရင် ဘာဖြစ်မလဲ ဆိုတာ အရင် ကြည့်ရအောင်။
      [[mark:m-parts]] app သုံးခု ရှိပြီး၊ ဖတ်ချင်တဲ့ system နှစ်ခု ရှိပါတယ်။
      [[mark:m-lines]] app တစ်ခုစီက system တစ်ခုစီအတွက် သီးသန့် code ရေးရပါတယ်။ Reply assistant မှာ tool
      definition နဲ့ API ခေါ်တဲ့ code၊ Claude Code အတွက် နောက်တစ်မျိုး၊ Claude Desktop အတွက် နောက်တစ်မျိုး ဆိုပြီး
      ဖြစ်လာပါတယ်။
      [[mark:m-cost]] ဆိုတော့ ချိတ်ဆက်မှု ခြောက်ခု ဖြစ်ပြီး၊ team တွေက တစ်ခုစီကို သီးသန့် ရေး၊ သီးသန့် ထိန်းရပါတယ်။ app
      အသစ် တစ်ခု ထပ်လာတိုင်း၊ system အသစ် တစ်ခု ထပ်လာတိုင်း ချိတ်ဆက်မှုတွေက မြှောက်ပြီး တိုးလာပါတယ်။
      [[mark:s-open]] MCP က ဒီပုံကို ပြောင်းပေးပါတယ်။ Model Context Protocol ဆိုတာ AI app တွေနဲ့ အပြင်က tool၊ data
      တွေကို ချိတ်တဲ့ စံ သဘောတူညီချက်ပါ။
      [[mark:s-server]] Ticket system နဲ့ NMS ကို ဖတ်ပေးတဲ့ code ကို ticket-mcp ဆိုတဲ့ MCP server တစ်ခုထဲ တစ်ခါပဲ
      ရေးပါမယ်။ MCP server ဆိုတာ tool နဲ့ data ကို ထုတ်ပေးတဲ့ဘက်ပါ။
      [[mark:s-apps]] app သုံးခုလုံးက MCP ကို နားလည်ရင် အဲဒီ server တစ်ခုတည်းကိုပဲ ချိတ်ရုံပါ။ tool ကို ဘယ်လို ခေါ်ရမလဲ၊
      input က ဘာလဲ ဆိုတဲ့ definition ရော၊ tool ကို တကယ် run တဲ့ code ရော server ထဲမှာပဲ ရှိပြီး၊ app ဘက်က အဲဒါတွေကို
      ပြန်ရေးစရာ မလိုတော့ပါဘူး။
      [[mark:s-gain]] Ticket system ရဲ့ API ပြောင်းတဲ့နေ့မှာ server တစ်ခုကိုပဲ ပြင်ရပါတယ်။ ဒါပေမဲ့ server တစ်ခု
      ရေးရုံနဲ့ လုံခြုံသွားတာတော့ မဟုတ်ပါဘူး။ server က ဘာတွေကို ဖတ်ခွင့်ပေးမလဲ ဆိုတာ ဆုံးဖြတ်ရတုန်းပါပဲ။
    sources:
      - {
          title: "Model Context Protocol: Architecture overview (2026-07-28)",
          url: "https://modelcontextprotocol.io/docs/2026-07-28/learn/architecture",
        }
      - {
          title: "MCP Python SDK: First steps",
          url: "https://py.sdk.modelcontextprotocol.io/get-started/first-steps/",
        }
    actions:
      - {
          id: draw-m-open,
          type: whiteboard.apply,
          at: { mark: m-open },
          open: true,
          clear: true,
          upsertIds: [m-title],
        }
      - {
          id: draw-m-parts,
          type: whiteboard.apply,
          at: { mark: m-parts },
          upsertIds: [m-app1, m-app2, m-app3, m-sys1, m-sys2],
          drawMs: 1800,
        }
      - {
          id: draw-m-lines,
          type: whiteboard.apply,
          at: { mark: m-lines },
          upsertIds: [m-l1, m-l2, m-l3, m-l4, m-l5, m-l6],
          drawMs: 2400,
        }
      - {
          id: draw-m-cost,
          type: whiteboard.apply,
          at: { mark: m-cost },
          upsertIds: [m-cost],
          drawMs: 1000,
        }
      - {
          id: draw-s-open,
          type: whiteboard.apply,
          at: { mark: s-open },
          clear: true,
          upsertIds: [s-title, m-app1, m-app2, m-app3],
        }
      - {
          id: draw-s-server,
          type: whiteboard.apply,
          at: { mark: s-server },
          upsertIds: [s-box, s-box-l, s-down, s-sys],
          drawMs: 1800,
        }
      - {
          id: draw-s-apps,
          type: whiteboard.apply,
          at: { mark: s-apps },
          upsertIds: [s-a1, s-a2, s-a3],
          drawMs: 1200,
        }
      - {
          id: draw-s-gain,
          type: whiteboard.apply,
          at: { mark: s-gain },
          upsertIds: [s-gain],
          drawMs: 1000,
        }

  - id: roles
    chapter: Host၊ client၊ server
    narration: >
      [[mark:h-open]] MCP မှာ အခန်းကဏ္ဍ သုံးခု ရှိပါတယ်။
      [[mark:h-host]] ပထမ တစ်ခုက host ပါ။ host ဆိုတာ user က စကားပြောနေတဲ့ AI app ပါ။ Claude Code၊ Claude Desktop တို့လို
      app တွေပါ။ ဒီ ဥပမာမှာ Claude Code က host ဖြစ်ပါတယ်။
      [[mark:h-client]] ဒုတိယ တစ်ခုက client ပါ။ client ဆိုတာ host ထဲမှာ နေပြီး server တစ်ခုနဲ့ ချိတ်ထားတဲ့ အပိုင်းပါ။
      host က server တစ်ခုကို client တစ်ခုစီ ဖန်တီးပြီး၊ client တစ်ခုစီက သက်ဆိုင်ရာ server နဲ့ သီးသန့် connection တစ်ခု
      ထိန်းထားပါတယ်။
      [[mark:h-server]] တတိယ တစ်ခုက server ပါ။ ကိုယ်တို့ ရေးမယ့် program ပါ။ tool တွေနဲ့ data တွေကို client ဆီ ထုတ်ပေးပါတယ်။
      [[mark:h-stdio]] client နဲ့ server ကြားမှာ စာတွေ ဘယ်လို သွားလဲ ဆိုတာကို transport လို့ ခေါ်ပါတယ်။ spec မှာ
      standard transport နှစ်မျိုးပဲ ရှိပါတယ်။ ပထမ တစ်မျိုးက stdio ပါ။ client က server ကို စက်တစ်လုံးတည်းပေါ်မှာ
      subprocess အနေနဲ့ စ run ပြီး၊ standard input နဲ့ output ကနေ message တွေ ပို့ပါတယ်။ အများအားဖြင့် client တစ်ခုကိုပဲ
      ဝန်ဆောင်မှု ပေးပါတယ်။
      [[mark:h-http]] ဒုတိယ တစ်မျိုးက Streamable HTTP ပါ။ server မှာ URL တစ်ခု ရှိပြီး client ရဲ့ message တစ်ခုစီက POST
      request တစ်ခုစီ ဖြစ်ပါတယ်။ ဒီလို server က client အများကြီးကို တစ်ပြိုင်တည်း ဝန်ဆောင်နိုင်ပါတယ်။ အရင်က HTTP နဲ့
      SSE ကို တွဲသုံးတဲ့ transport အဟောင်း ရှိခဲ့ပေမဲ့ ကြာပြီ deprecated ဖြစ်နေပါပြီ။
    sources:
      - {
          title: "Model Context Protocol: Architecture overview (2026-07-28)",
          url: "https://modelcontextprotocol.io/docs/2026-07-28/learn/architecture",
        }
      - {
          title: "MCP specification 2026-07-28: Transports",
          url: "https://modelcontextprotocol.io/specification/2026-07-28/basic/transports",
        }
    actions:
      - {
          id: draw-h-open,
          type: whiteboard.apply,
          at: { mark: h-open },
          clear: true,
          upsertIds: [h-title],
        }
      - {
          id: draw-h-host,
          type: whiteboard.apply,
          at: { mark: h-host },
          upsertIds: [h-host],
          drawMs: 900,
        }
      - {
          id: draw-h-client,
          type: whiteboard.apply,
          at: { mark: h-client },
          upsertIds: [h-c1, h-c1-l, h-c2, h-c2-l],
          drawMs: 1800,
        }
      - {
          id: draw-h-server,
          type: whiteboard.apply,
          at: { mark: h-server },
          upsertIds: [h-a1, h-s1, h-s1-l, h-a2, h-s2, h-s2-l],
          drawMs: 2400,
        }
      - {
          id: draw-h-stdio,
          type: whiteboard.apply,
          at: { mark: h-stdio },
          upsertIds: [h-t1],
          drawMs: 900,
        }
      - {
          id: draw-h-http,
          type: whiteboard.apply,
          at: { mark: h-http },
          upsertIds: [h-t2],
          drawMs: 900,
        }

  - id: path
    chapter: မေးခွန်း တစ်ခုရဲ့ လမ်းကြောင်း
    narration: >
      [[mark:p-open]] အခု Billing developer တစ်ယောက်က Claude Code ကို ticket တစ်ခုအကြောင်း မေးလိုက်တယ် ဆိုပါစို့။ အဲဒီ
      မေးခွန်းကနေ tool ရလဒ် ရလာတဲ့အထိ message တွေ ဘယ်လို သွားလဲ ကြည့်ရအောင်။ message တွေက JSON RPC ပုံစံနဲ့
      သွားပါတယ်။ request တိုင်းမှာ id ပါပြီး response က အဲဒီ id နဲ့ ပြန်လာပါတယ်။
      [[mark:p-1]] ပထမ အဆင့်က server discover ပါ။ client က server ဘယ် version တွေ ပံ့ပိုးလဲ၊ ဘာ capability တွေ ရှိလဲ
      မေးကြည့်လို့ ရပါတယ်။ server တိုင်း ဒါကို ပံ့ပိုးရပေမဲ့၊ client က မခေါ်ဘဲ ကျော်လို့ ရပါတယ်။
      [[mark:p-2]] ဒုတိယ အဆင့်မှာ client က tools list ကို ခေါ်ပြီး server ပေးတဲ့ tool စာရင်းကို ယူပါတယ်။ tool တစ်ခုစီမှာ
      နာမည်၊ description နဲ့ input schema ပါပါတယ်။ host က server အားလုံးဆီက tool တွေကို စာရင်း တစ်ခုထဲ စုပြီး model ကို
      ပေးပါတယ်။
      [[mark:p-3]] တတိယ အဆင့်မှာ model က မေးခွန်းကို ဖတ်ပြီး ဒီ tool ကို ဒီ input နဲ့ ခေါ်ပေးပါလို့ တောင်းဆိုပါတယ်။
      [[mark:p-4]] စတုတ္ထ အဆင့်မှာ host က အဲဒီ တောင်းဆိုချက်ကို သက်ဆိုင်တဲ့ client ဆီ ပို့ပြီး၊ client က tools call
      request ကို tool နာမည်နဲ့ arguments တွေနဲ့ server ဆီ ပို့ပါတယ်။ server က tool ကို run ပါတယ်။
      [[mark:p-5]] နောက်ဆုံး အဆင့်မှာ ရလဒ်က content စာရင်း တစ်ခုနဲ့ ပြန်လာပါတယ်။ host က အဲဒါကို စကားဝိုင်းထဲ ထည့်ပေးပြီး၊
      model က ticket ကို ဖတ်ပြီးမှ developer ကို ဖြေပါတယ်။
      [[mark:p-new]] ဒီ lesson ကို ရေးတဲ့ အချိန်မှာ နောက်ဆုံး spec က ၂၀၂၆ ခုနှစ် ဇူလိုင်လ ထုတ်ထားတာပါ။ အဲဒီ spec မှာ
      စကားမပြောခင် လုပ်ရတဲ့ initialize handshake နဲ့ session ကို ဖြုတ်လိုက်ပါပြီ။ request တိုင်းမှာ protocol version
      နဲ့ client capability ပါလာတာမို့၊ server ဘက်က request တစ်ခုစီကို သီးသန့် ဖြေလို့ ရပါတယ်။
      [[mark:p-legacy]] အရင် စာတွေမှာ initialize၊ ပြီးမှ tools list၊ ပြီးမှ tools call ဆိုပြီး တွေ့ရရင် အဲဒါက legacy flow ပါ။ client အများကြီးက
      အဲဒီ flow ကို သုံးနေတုန်းဖြစ်ပြီး Python SDK version အသစ်နဲ့ ရေးတဲ့ server တွေကလည်း ဆက်ဖြေပေးပါတယ်။
    sources:
      - {
          title: "Model Context Protocol: Architecture overview (2026-07-28)",
          url: "https://modelcontextprotocol.io/docs/2026-07-28/learn/architecture",
        }
      - {
          title: "MCP specification 2026-07-28: Changelog",
          url: "https://modelcontextprotocol.io/specification/2026-07-28/changelog",
        }
      - {
          title: "MCP specification 2026-07-28: Versioning",
          url: "https://modelcontextprotocol.io/specification/2026-07-28/basic/versioning",
        }
    actions:
      - {
          id: close-roles,
          type: whiteboard.apply,
          at: { mark: p-open, offsetMs: -1400 },
          open: false,
        }
      - { id: show-path, type: slide.show, at: { afterAction: close-roles }, slideId: call-path }
      - { id: pt-1, type: slide.point, at: { mark: p-1 }, target: { x: 0.15, y: 0.35 } }
      - { id: pt-2, type: slide.point, at: { mark: p-2 }, target: { x: 0.15, y: 0.47 } }
      - { id: pt-3, type: slide.point, at: { mark: p-3 }, target: { x: 0.15, y: 0.59 } }
      - { id: pt-4, type: slide.point, at: { mark: p-4 }, target: { x: 0.15, y: 0.71 } }
      - { id: pt-5, type: slide.point, at: { mark: p-5 }, target: { x: 0.15, y: 0.83 } }
      - { id: pt-new, type: slide.point, at: { mark: p-new }, target: { x: 0.15, y: 0.35 } }

  - id: map
    chapter: ticket-mcp ရဲ့ မြေပုံ
    narration: >
      [[mark:f-open]] ticket-mcp ကို မရေးခင် ဘာ ပေးမလဲ၊ ဘယ်သူ ချိတ်မလဲ ဆိုတာကို အရင် ချရေးကြည့်ရအောင်။
      [[mark:sel-server]] server တစ်ခုတည်းက Ticket system နဲ့ NMS နှစ်ခုလုံးကို ဖတ်ပေးပြီး၊ Python နဲ့ ရေးပါမယ်။
      [[mark:type-tools]] tool ဆိုတာ model က တောင်းဆိုရင် program က လုပ်ပေးတဲ့ လုပ်ဆောင်ချက် တစ်ခုပါ။ ပထမ tool က ticket
      နံပါတ်နဲ့ ticket တစ်ခုကို ဖတ်ပေးပါတယ်။ ဒုတိယ tool က မြို့နယ် တစ်ခုမှာ အခု လိုင်းကျနေလား NMS ကနေ စစ်ပေးပါတယ်။
      Reply assistant မှာ prototype အနေနဲ့ ရေးခဲ့တဲ့ tool ကို ဒီနေရာ ရွှေ့လိုက်တာပါ။
      [[mark:type-hosts]] နောက်တစ်ပိုင်းက ချိတ်မယ့် host တွေပါ။ Claude Code နဲ့ Claude Desktop က developer နဲ့ support
      lead ရဲ့ စက်ပေါ်မှာ server ကို stdio နဲ့ စ run ပါမယ်။ Reply assistant ကတော့ URL နဲ့ ချိတ်ရမှာမို့ Streamable HTTP
      လိုပါတယ်။ Ticket system က ကုမ္ပဏီ network ထဲမှာ ရှိတာမို့ အဲဒီ HTTP server ကို ဘယ်မှာ ထားမလဲ ဆိုတာကိုတော့
      security တာဝန်ခံ က ဆုံးဖြတ်ပါမယ်။
      [[mark:type-rules]] နောက်ဆုံးပိုင်းက စည်းကမ်းပါ။ ဒီ server က ဖတ်ရုံပဲ ဖတ်ပြီး၊ ticket ကို ပြင်တာ၊ customer ဆီ စာပို့တာ
      မလုပ်ပါဘူး။ stdio မှာ standard output က MCP message တွေ သွားတဲ့ လမ်းကြောင်း ဖြစ်နေတာမို့၊ log တွေကို standard
      error ထဲမှာပဲ ရေးရပါမယ်။ spec က standard output ထဲကို MCP message မဟုတ်တာ ဘာမှ မရေးရဘူးလို့ ဆိုထားလို့ပါ။
    sources:
      - {
          title: "MCP specification 2026-07-28: stdio transport",
          url: "https://modelcontextprotocol.io/specification/2026-07-28/basic/transports/stdio",
        }
      - {
          title: "Model Context Protocol: Architecture overview (2026-07-28)",
          url: "https://modelcontextprotocol.io/docs/2026-07-28/learn/architecture",
        }
    actions:
      - { id: close-path, type: slide.close, at: { mark: f-open } }
      - {
          id: open-map,
          type: workspace.openFile,
          at: { afterAction: close-path },
