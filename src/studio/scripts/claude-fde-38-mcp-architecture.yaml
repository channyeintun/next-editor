  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ security တာဝန်ခံ က ဒီ မြေပုံကို ဖတ်ပြီး စိုးရိမ်ချက် တစ်ခု ပြောလာပါတယ်။ support
      lead တွေ Claude Desktop မှာ ပြောနေတဲ့ စကားဝိုင်းထဲမှာ customer ရဲ့ ဖုန်းနံပါတ်၊ လိပ်စာတွေ ပါတတ်ပါတယ်။ ticket-mcp
      server ဆီကို အဲဒီ စကားဝိုင်း တစ်ခုလုံး ရောက်သွားမလား။
      [[mark:q-a]] ပထမ အဖြေက ရောက်တယ်၊ server က စကားဝိုင်းကို ဖတ်ပြီးမှ ဘာ ပြန်ပေးရမလဲ ဆုံးဖြတ်တယ် ဆိုတာပါ။
      [[mark:q-b]] ဒုတိယ အဖြေက မရောက်ဘူး၊ server ဆီ ရောက်တာက tool နာမည်နဲ့ arguments ပဲ ဆိုတာပါ။ lesson ကို pause
      လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ တစ်ခုပါ။ ဘာကြောင့်လဲဆိုတော့ စကားဝိုင်းက host ထဲမှာပဲ ရှိပြီး၊ server က model နဲ့
      တိုက်ရိုက် စကားမပြောလို့ပါ။ tools call request မှာ ပါတာက model ရွေးလိုက်တဲ့ tool ရဲ့ နာမည်၊ arguments နဲ့ protocol
      version လို metadata ပဲ ဖြစ်ပါတယ်။ server က အဲဒီ input နဲ့ tool ကို run ပြီး ရလဒ်ကို ပြန်ပေးရုံပါ။
      [[mark:q-rule]] ဒါပေမဲ့ arguments ထဲမှာ ဘာပါမလဲ ဆိုတာကို model က ဖြည့်တာပါ။ ဒါကြောင့် tool ရဲ့ input ကို ticket
      နံပါတ်၊ မြို့နယ် နာမည်လို လိုသလောက်ပဲ design ဆွဲပါ။ spec ကလည်း host ဘက်မှာ tool call ကို ငြင်းနိုင်တဲ့ လူ
      အမြဲ ရှိသင့်တယ်လို့ ဆိုထားပါတယ်။
    sources:
      - {
          title: "MCP specification 2026-07-28: Tools",
          url: "https://modelcontextprotocol.io/specification/2026-07-28/server/tools",
        }
      - {
          title: "MCP Python SDK: First steps",
          url: "https://py.sdk.modelcontextprotocol.io/get-started/first-steps/",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: q-rule },
          upsertIds: [q-t1, q-t2],
          drawMs: 1600,
        }

  - id: your-turn
    chapter: ကိုယ့် ကုမ္ပဏီရဲ့ ပထမ server
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ကိုယ့် ကုမ္ပဏီမှာ AI app တွေက ဖတ်ချင်တဲ့ system တစ်ခုကို
      ရွေးပါ။ app နှစ်ခု သုံးခုက တစ်ချိန်တည်း ဖတ်ချင်နေတဲ့ system ဆိုရင် server အတွက် အသင့်တော်ဆုံးပါ။
      [[mark:turn-2]] ဒီ မြေပုံရဲ့ အောက်မှာ အဲဒီ system အတွက် ခေါင်းစဉ် လေးခုကို ပြန်ရေးကြည့်ပါ။ server ရဲ့ နာမည်၊ tool နှစ်ခု၊
      ချိတ်မယ့် host တွေနဲ့ transport၊ ပြီးတော့ server က ဘာကို မလုပ်ရဘူး ဆိုတဲ့ စည်းကမ်း တစ်ကြောင်းပါ။
    sources:
      - {
          title: "Model Context Protocol: Architecture overview (2026-07-28)",
          url: "https://modelcontextprotocol.io/docs/2026-07-28/learn/architecture",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: turn }, open: false }
      - id: sel-headings
        type: editor.select
        at: { mark: turn-2 }
        target:
          file: notebook/38-mcp-map.md
          text: "## Tool များ"

  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ standard မရှိရင် app တိုင်းက system တိုင်းကို သီးသန့် ချိတ်ရလို့ အလုပ်တွေ မြှောက်ပြီး
      များလာပါတယ်။ MCP မှာတော့ system တစ်ခုကို server တစ်ခု ရေးပြီး၊ host ထဲက client တွေက အဲဒီ server ကို ချိတ်ပါတယ်။
      tool ကို ခေါ်ဖို့ကတော့ model က ရွေးပါတယ်။
      [[mark:next]] နောက် lesson မှာတော့ ticket-mcp server ကို Python နဲ့ တကယ် ရေးပြီး၊ tool နှစ်ခုကို ဘယ်လို
      ထုတ်ပေးလဲ ဆိုတာကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "Model Context Protocol: Architecture overview (2026-07-28)",
          url: "https://modelcontextprotocol.io/docs/2026-07-28/learn/architecture",
        }
