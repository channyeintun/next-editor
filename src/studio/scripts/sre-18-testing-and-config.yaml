      notes.md: |
        # Test နဲ့ config

        - repeatable test — ပြင်ပ system မမှီ၊ ဘယ်နှခါ run run ရလဒ် တူ
        - smoke test — deploy ပြီးတာနဲ့ အဓိက journey တွေကို မြန်မြန် စစ်
        - config check — syntax · အဓိပ္ပာယ် · dry run၊ rollout မတိုင်ခင်
        - configuration drift — live နဲ့ Git ထဲက config မတူတော့တာ

        မေးခွန်း: 0 လို့ ပြောင်းရုံနဲ့ service တစ်ခုလုံး ရပ်သွားနိုင်တဲ့ config တန်ဖိုး တစ်ခုကို ပြောပါ။
