# SRE from zero, lesson 18: Testing and config (Burmese concept lesson).
#
# Built from the approved voice script
# docs/sre-course/voice-scripts/sre-18-testing-and-config.md. Every spoken
# character is that script's "> " lines, unchanged; each ⟪…⟫ marker became a
# [[mark:…]] at the same place. Check it with:
#   bun ~/Documents/sre-course/work/check-narration.ts \
#     docs/sre-course/voice-scripts/sre-18-testing-and-config.md \
#     src/studio/scripts/sre-18-testing-and-config.yaml
#
# Nothing runs: deck pages and the whiteboard carry the lesson, and notes.md is
# the recap. The workspace and runtime follow the validated no-code skeleton
# (WebContainer, empty init command, a harmless dev script).
#
# Six marks that are not in the voice script add no spoken text and sit at an
# existing ။: p01b-tests splits l18_p01b's narration at its paragraph break
# (one 471-character dialog would pass the 450-character limit; no action uses
# it); b2-s1b lets board B2's four-box top lane land two boxes and two, as
# lesson 16 lands its four-box lane, so no step adds more than three labelled
# boxes; and b1-s4b, b3-s3b, b3-s4b and b3-s5b land B1's "real world: final
# check" label, B3's "CI မှာ ရှာ" and "Git ကနေ auto-sync" boxes and B3's
# "Padauk: ညတိုင်း diff" label on the sentences that name them, not 9-14 s
# early with the rest of their step, as lesson 16's b1-s4b does. ask-question
# is the voice script's ⟪select မေးခွန်း⟫, which already starts the question's
# own dialog, so the question-line select hangs off it for the ⟪pause 3s⟫, as
# in lesson 16.
#
# Pacing: at 70 ms/char no page or board step holds longer than ~35 s (the
# longest is l18_p01b, 34.4 s from its show, then l18_p04, 31.6 s), so the
# voice script's own markers carry it and no pacing page or board step was
# added.
#
# ⟪close board⟫ straight into the next board (scene 7) wipes the open board
# 400 ms early (whiteboard.apply clear) instead of closing the panel, so the
# editor does not flash between two boards, as in lesson 16; the next board
# then draws with open: true, clear: true as usual. B3's own "cleared" step 3
# wipes steps 1-2 in the same apply that draws the new strip (clear without
# open, as lesson 2 does). A board followed by a deck page closes the panel
# (open: false) 400 ms before the page, and a deck page followed by a board
# closes the page 400 ms before, as in Module 1.
#
# Boards (B1 P1 flow, B2 P6 lanes, B3 two boxes and then a P1 flow). Colour
# jobs: #1e1e1e ink (paints white) for arrows; blue the thing named (the test
# types and "repeatable", the config checks and Padauk's three meaning checks,
# the Git copy, the four ways to handle drift); green healthy or done
# (rollout, Padauk's nightly diff); red failure (the emergency push, the next
# deploy undoing the fix); orange the caveat or limit (the real-world end of
# the map, where to start on an old system, what the emergency push skips and
# keeps and the tests it runs straight after, the hand-made live value,
# auto-sync's condition). A label on two or three lines is one text asset per
# line, so each line meets the 0.55 em width rule on its own; every label was
# also measured in Chrome with Excalidraw's Virgil font and fits its box. B1's
# "real world: final check" is set on two lines ("real world:" over "final
# check") so it sits over canary and fault alone: on one line it needs 355 px
# under the 0.55 rule and would start over smoke. B3's live box sets "live:
# weight 70" and "(လက်နဲ့ ပြင်)" on two lines for the same reason (29 code
# points need 447 px on one line).
#
# Deck pages: deck "Next Editor · SRE 5A · Toil and tests". deckUrl is the
# deck's published /pub link; until this lesson's pages are built from the
# page plan, the Director reports the l18 pages missing from the published
# deck. Scenes 3, 5 and 7 cite the curriculum's own public sources for the
# test pyramid and for GitOps and drift (Fowler, OpenGitOps; URLs checked
# 2026-10-21). Page plan:
# ~/Documents/sre-course/work/pages/sre-18-testing-and-config.json
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/sre-18-testing-and-config.yaml
#   bun scripts/studio-compile-check.ts src/studio/scripts/sre-18-testing-and-config.yaml
