  - id: quiz
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ task သုံး ဖြစ်တဲ့ ကောင်တာစာရင်းကို agent ဆီ အပ်တော့မယ် ဆိုပါစို့။
      ပထမဆုံး ဘာကို ခိုင်းမလဲ။ ကောင်တာ screen ရဲ့ design တစ်ခုလုံးကို အရောင်၊ အသံတွေနဲ့ အရင် ဆောက်ခိုင်းမလား။
      ဒါမှမဟုတ် form က အော်ဒါ တစ်ခု လှလှ ရဲ့ စာရင်းထဲ ပေါ်လာအောင် အရင် လုပ်ခိုင်းမလား။ lesson ကို pause လုပ်ပြီး
      စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ ရွေးစရာပါ။ ဘာကြောင့်လဲဆိုတော့ customer ရဲ့ form ကနေ
      လှလှ ရဲ့ screen အထိ တစ်လမ်းလုံး အလုပ်လုပ်တာကို ပြနိုင်ပြီး၊ AC ငါး နဲ့ ချက်ချင်း စစ်လို့ ရလို့ပါ။
      [[mark:quiz-why]] design ကို အရင် ဆောက်ရင်တော့ screen ဆိုတဲ့ layer တစ်ခုပဲ ရှိနေပြီး၊ စာရင်းထဲမှာ အော်ဒါ
      တစ်ခုမှ မပေါ်သေးတော့ ဘာကိုမှ မစစ်နိုင်သေးပါဘူး။ ပြီးတော့ လှလှ တကယ် သုံးကြည့်ပြီးမှ ဘာ အရောင်၊ ဘာ အသံ လိုလဲ
      ဆိုတာ ပိုသိလာမှာပါ။
    sources:
      - {
          title: "Humanizing Work: The Humanizing Work Guide to Splitting User Stories",
          url: "https://www.humanizingwork.com/the-humanizing-work-guide-to-splitting-user-stories/",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [z-title, z-q, z-o1, z-o2, z-o2b],
          drawMs: 2200,
        }
      - {
          id: draw-quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [z-a],
          drawMs: 1000,
        }
      - {
          id: draw-quiz-why,
          type: whiteboard.apply,
          at: { mark: quiz-why },
          upsertIds: [z-a-note],
          drawMs: 1000,
        }

  - id: recap
    chapter: ပြန်ချုပ်ရရင်
    narration: >
      [[mark:close-quiz]] ဒါဆို ပြန်ချုပ်ရရင်၊ ပထမ version တစ်ခုလုံးကို တစ်ခါတည်း မအပ်ဘဲ၊ agent က တစ်ကြိမ်နဲ့
      ပြီးနိုင်ပြီး ကိုယ်က တစ်ထိုင်တည်း စစ်နိုင်တဲ့ task လေးတွေ ခွဲပါ။ [[mark:rc-row1]] layer လိုက် မခွဲဘဲ screen
      ကနေ database အထိ ဖြတ်သွားတဲ့ vertical slice တွေနဲ့ ခွဲပြီး၊ ပထမ slice ကို ပါးပါးလေး ထားပြီး လမ်း
      တစ်လမ်းလုံးကို စမ်းပါ။ [[mark:rc-done]] task တိုင်းမှာ ပြီးပြီလို့ ဘာနဲ့ စစ်မလဲ ဆိုတာ ရှိရပါမယ်။ မှီနေတာနဲ့
      မသေချာတာကို ကြည့်ပြီး အစဉ်လိုက် စီပါ။ နောက် lesson မှာတော့ ဒီ slice တွေ ဖြတ်သွားတဲ့ screen၊ အော်ဒါကို စစ်တဲ့
      server၊ database ဆိုတဲ့ အပိုင်းတွေက ဘာတွေလဲ၊ အော်ဒါ တစ်ခုက သူတို့ကြားမှာ ဘယ်လို သွားလဲ ဆိုတာကို
      လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The developer's changing role (decomposition)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "Humanizing Work: The Humanizing Work Guide to Splitting User Stories",
          url: "https://www.humanizingwork.com/the-humanizing-work-guide-to-splitting-user-stories/",
        }
