  - id: order
    chapter: ဘာကို အရင် လုပ်မလဲ
    narration: >
      [[mark:type-row34]] နောက် task နှစ်ခုကို ထည့်ပါမယ်။ ကောင်တာစာရင်းကို AC ငါး နဲ့ စစ်ပြီး၊ နေ့စဉ်
      အော်ဒါနံပါတ်အတွက်တော့ AC မရှိလို့ spec ရဲ့ စည်းကမ်း အပိုင်းက နံပါတ် rule နဲ့ စစ်ပါမယ်။ [[mark:order-q]] row
      တွေကို ဘယ်လို အစဉ်လိုက် စီလဲ ဆိုတော့၊ မေးခွန်း နှစ်ခု မေးပါတယ်။ [[mark:sel-row3]] ပထမ မေးခွန်းက ဘယ် task က
      ဘယ် task ကို မှီနေလဲ ဆိုတာပါ။ ကောင်တာစာရင်းမှာ ပြစရာ ရှိဖို့ အော်ဒါတွေ သိမ်းထားပြီးသား ဖြစ်ရမှာ မို့၊ task
      သုံးက task တစ်ကို မှီနေပါတယ်။ မှားတဲ့ အော်ဒါတွေ လှလှ ရဲ့ စာရင်းထဲ မရောက်စေချင်လို့ ငြင်းတဲ့ task ကိုလည်း
      သူ့ရှေ့မှာ ထားပါတယ်။ [[mark:sel-row1b]] ဒုတိယ မေးခွန်းက ဘယ်အပိုင်းကို အနည်းဆုံး သိထားလဲ ဆိုတာပါ။ မသေချာတဲ့
      အပိုင်းကို အရင် လုပ်ရင်၊ အဆင်မပြေရင် စောစော သိရပြီး၊ အပေါ်မှာ အများကြီး မဆောက်ရသေးခင် လမ်းပြောင်းလို့
      ရပါတယ်။ ကိုယ်တို့အတွက်တော့ အော်ဒါ တစ်ခု screen ကနေ database အထိ တကယ် ရောက်မလား ဆိုတာကို အနည်းဆုံး သိထားလို့
      task တစ်ကို ပထမဆုံး ထားတာပါ။
    sources:
      - {
          title: "Humanizing Work: The Humanizing Work Guide to Splitting User Stories (core complexity first)",
          url: "https://www.humanizingwork.com/the-humanizing-work-guide-to-splitting-user-stories/",
        }
    actions:
      - id: type-row34
        type: editor.type
        at: { mark: type-row34 }
        target: { file: docs/plan.md, after: "| AC-2, AC-3, AC-4 |\n", occurrence: 1 }
        text: "| 3 | ကောင်တာစာရင်း | AC-5 |\n| 4 | နေ့စဉ် အော်ဒါနံပါတ် | Rules |\n"
        cadence: line-by-line
      - {
          id: sel-row3,
          type: editor.select,
          at: { mark: sel-row3 },
          target: { file: docs/plan.md, text: "| 3 | ကောင်တာစာရင်း | AC-5 |", occurrence: 1 },
        }
      - {
          id: sel-row1b,
          type: editor.select,
          at: { mark: sel-row1b },
          target:
            {
              file: docs/plan.md,
              text: "| 1 | form ကနေ အော်ဒါ တစ်ခု သိမ်းနိုင်တာ | AC-1 |",
              occurrence: 1,
            },
        }

  - id: last-rows
    narration: >
      [[mark:type-row56]] နောက်ဆုံး row နှစ်ခုကိုလည်း ထည့်လိုက်ပါမယ်။ [[mark:sel-row5]] task ငါးကို ကြည့်ပါ။ menu
      ကို ဆိုင်ဘက်က ပြင်ဖို့ လိုလာမယ် ထင်ပြီး ထည့်ထားတဲ့ task ဖြစ်ပေမဲ့၊ စစ်မယ့် column မှာ ဘာမှ မရှိပါဘူး။ AC
      မရှိတော့ agent ဆီ အပ်ရင် ဘယ်အချိန် ပြီးပြီလဲ ဆိုတာ ဘယ်သူမှ မပြောနိုင်ပါဘူး။ ဒါကြောင့် AC ရေးမလား၊ တကယ်ကော
      လိုရဲ့လား ဆိုတာကို မေးခွန်း အဖြစ် မှတ်ထားပြီး၊ နောက်ပိုင်း lesson တစ်ခုမှာ ပြန်ဆုံးဖြတ်ပါမယ်။
      [[mark:sel-row6]] နောက်ဆုံး task က app ကို staging ပေါ် တင်တာပါ။ staging ဆိုတာ တကယ့် customer တွေ မသုံးခင်
      ကိုယ်တို့ စမ်းဖို့ သီးသန့် ထားတဲ့ နေရာပါ။ သူ့ကိုတော့ customer တွေဆီ မဖွင့်ပေးခင် စစ်ရမယ့် စာရင်း၊ release
      checklist နဲ့ စစ်မှာ ဖြစ်ပြီး၊ အဲဒီ စာရင်းကို နောက်ပိုင်းမှ ရေးပါမယ်။ [[mark:brief]] row တစ်ခုချင်းကို agent
      ဆီ အပ်တဲ့အခါ၊ ရှေ့ lesson တစ်ခုမှာ ရေးခဲ့သလို task အပ်တဲ့ စာ၊ brief တစ်စောင်စီ ရေးပြီး၊ စစ်မယ့် column ထဲက
      အချက်ကို ပြီးတယ်လို့ သတ်မှတ်တဲ့ အချက်အဖြစ် ထည့်ပေးပါမယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The developer's changing role (specification, decomposition)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - id: type-row56
        type: editor.type
        at: { mark: type-row56 }
        target: { file: docs/plan.md, after: "| 4 | နေ့စဉ် အော်ဒါနံပါတ် | Rules |\n", occurrence: 1 }
        text: "| 5 | menu ပြင်ဖို့ admin စာမျက်နှာ | — |\n| 6 | staging ပေါ် တင်တာ | release checklist |\n"
        cadence: line-by-line
      - {
          id: sel-row5,
          type: editor.select,
          at: { mark: sel-row5 },
          target:
            { file: docs/plan.md, text: "| 5 | menu ပြင်ဖို့ admin စာမျက်နှာ | — |", occurrence: 1 },
        }
      - {
          id: sel-row6,
          type: editor.select,
          at: { mark: sel-row6 },
          target:
            {
              file: docs/plan.md,
              text: "| 6 | staging ပေါ် တင်တာ | release checklist |",
              occurrence: 1,
