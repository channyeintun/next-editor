build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 6113
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}
scenes:
  - id: recall
    chapter: တစ်ခါတည်း အကုန် ခိုင်းရင်
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ ဆိုင်ပိုင်ရှင် မြမြ ရဲ့ delivery တောင်းဆိုချက်ကို မရဘူး လို့ မငြင်းဘဲ၊ ရွေးစရာ
      နှစ်ခုကို ကုန်ကျမှုနဲ့ ပြခဲ့ပြီး၊ ဘာပြီးပြီ၊ ဘာဆက်လုပ်မယ် ဆိုတဲ့ status update ကိုလည်း ရေးခဲ့ပါတယ်။
      ဒီနေ့တော့ ဆက်လုပ်မယ့် အလုပ်တွေကို စီစဉ်ပါမယ်။ [[mark:open-spec]] editor ထဲမှာ ဘာ ဆောက်မလဲ ဆိုတာကို
      စုရေးထားတဲ့ spec ကို ဖွင့်ထားပါတယ်။ [[mark:sel-ac]] ဒီ AC ငါးခုက acceptance criteria တွေပါ။ ဆိုလိုတာက ပထမ
      version ပြီးပြီ လို့ ပြောနိုင်ဖို့ pass ဖြစ်ရမယ့် စည်းကမ်းချက်တွေပါ။ ဘာ ဆောက်ရမလဲ ဆိုတာ ဒီမှာ ရှင်းနေပါပြီ။
      ဒါပေမဲ့ ဒီ အလုပ်တွေကို agent ဆီ ဘယ်လို အပိုင်းလိုက် အပ်မလဲ ဆိုတဲ့ အစီအစဉ် မရှိသေးပါဘူး။ [[mark:b-big]]
      ဒီအချိန်မှာ agent ကို spec တစ်စောင်လုံး ပေးပြီး၊ ပထမ version တစ်ခုလုံးကို တစ်ခါတည်း ဆောက်ခိုင်းချင်စရာ
      ကောင်းပါတယ်။ စကား တစ်ကြောင်းတည်းနဲ့ app တစ်ခုလုံး ရမယ် ဆိုတော့ အချိန် ကုန်သက်သာမယ်လို့ ထင်ရပါတယ်။ ဒါပေမဲ့
      အဲဒီလို အပ်ရင် ဘာဖြစ်မလဲ ကြည့်ရအောင်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The developer's changing role (decomposition)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - { id: open-spec, type: workspace.openFile, at: { mark: open-spec }, path: docs/spec.md }
      - {
          id: sel-ac,
          type: editor.select,
          at: { mark: sel-ac },
          target: { file: docs/spec.md, text: "## Acceptance criteria", occurrence: 1 },
        }
      - {
          id: open-board-b,
          type: whiteboard.apply,
          at: { mark: b-big },
          open: true,
          clear: true,
          upsertIds: [b-title, b-big-box, b-big],
          drawMs: 1300,
        }

  - id: big-task
    narration: >
      [[mark:b-agent]] task ဆိုတာ agent ဆီ တစ်ခါ အပ်တဲ့ အလုပ်ကို ပြောတာပါ။ ဒီ task က အရမ်း ကြီးတော့ agent က ဖိုင်
      အများကြီးကို တစ်ခါတည်း ထုတ်ပေးပါလိမ့်မယ်။ spec မှာ မရေးထားတဲ့ ကွက်လပ်တွေကိုလည်း ခန့်မှန်းပြီး
      ဖြည့်သွားမှာပါ။ [[mark:b-bad]] ရလဒ် ပြန်ရောက်လာတဲ့အခါ ကိုယ့်မှာ စစ်စရာ တစ်ပုံကြီး ရှိနေပါပြီ။ AC
      ငါးခုလုံးကို တစ်ပြိုင်နက် စမ်းရပြီး၊ တစ်ခုခု မှားနေရင် ဘယ် ပြောင်းလဲမှုကြောင့်လဲ ဆိုတာ ရှာရ ခက်ပါတယ်။
      တစ်နေရာ ပြင်လိုက်တော့ တခြား တစ်နေရာ ပျက်သွားတာမျိုးလည်း ဖြစ်တတ်ပါတယ်။ ဆိုတော့ ကြီးပြီး ဝေဝါးတဲ့ task က
      ကြီးပြီး ဝေဝါးတဲ့ ရလဒ်ကိုပဲ ပြန်ပေးတတ်ပါတယ်။ [[mark:b-dec]] အဲဒီအစား အလုပ်ကြီးကို အပိုင်းလေးတွေ ခွဲပြီး
      တစ်ခုချင်း အပ်ရပါမယ်။ ဒီလို ခွဲတာကို decomposition လို့ ခေါ်ပါတယ်။ agent က code ကို မြန်မြန်
      ထုတ်ပေးနိုင်လာလေ၊ အလုပ်ကို ဘယ်လို ခွဲမလဲ ဆိုတာက builder ရဲ့ အဓိက ကျွမ်းကျင်မှု တစ်ခု ဖြစ်လာလေပါပဲ။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The developer's changing role (decomposition)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "Claude Code docs: Best practices for Claude Code",
          url: "https://code.claude.com/docs/en/best-practices",
        }
    actions:
      - {
          id: draw-b-agent,
          type: whiteboard.apply,
          at: { mark: b-agent },
          upsertIds: [b-a1, b-agent-box, b-agent],
          drawMs: 1300,
        }
      - {
          id: draw-b-bad,
          type: whiteboard.apply,
          at: { mark: b-bad },
          upsertIds: [b-a2, b-bad],
          drawMs: 1000,
        }
      - {
          id: draw-b-dec,
          type: whiteboard.apply,
          at: { mark: b-dec },
          upsertIds: [b-dec],
          drawMs: 900,
        }

  - id: split
    narration: >
      [[mark:s1]] ကိုယ်တို့ app ကို ခွဲကြည့်ရအောင်။ ပထမ အပိုင်းက customer တစ်ယောက် အော်ဒါ တစ်ခု မှာလို့ ရပြီး၊
      အဲဒီ အော်ဒါကို သိမ်းထားနိုင်တာပါ။ [[mark:s2]] ဒုတိယ အပိုင်းက အရေအတွက် မှားနေတာ၊ ဆိုင်ပိတ်ချိန်မှာ လာယူမယ်
      ဆိုတာ၊ ဖုန်းနံပါတ် မပါတာ လို အော်ဒါတွေကို ငြင်းတာပါ။ [[mark:s3]] တတိယ အပိုင်းကတော့ ကောင်တာက လှလှ ဝင်လာတဲ့
      အော်ဒါတွေကို မြင်ရတာပါ။ [[mark:s-checks]] အပိုင်း တစ်ခုစီ အောက်မှာ AC နံပါတ်တွေ ရှိနေတာကို သတိထား ကြည့်ပါ။
      အပိုင်း တစ်ခု ပြီးတိုင်း အဲဒီ AC နဲ့ ချက်ချင်း စစ်လို့ ရပါတယ်။ မှားနေရင်လည်း ပြောင်းလဲမှု သေးသေးလေးထဲမှာပဲ
      ရှာရတော့ မြန်မြန် တွေ့ပါတယ်။ [[mark:s-rule]] ဆိုတော့ အပိုင်း တစ်ခုရဲ့ အဆုံးမှာ စစ်လို့ရတဲ့ ရလဒ် တစ်ခု အမြဲ
      ရှိရပါမယ်။ ပြီးသွားတဲ့ အပိုင်းကို မြမြ ကိုယ်တိုင် ဖုန်းနဲ့ စမ်းကြည့်လို့ ရတော့၊ status update မှာလည်း
      ခန့်မှန်းထားတဲ့ ရာခိုင်နှုန်း မပြောရတော့ဘဲ၊ ဘယ်အပိုင်း ပြီးပြီ ဆိုတာကို အတိအကျ ရေးလို့ ရပါတယ်။
    sources:
      - {
          title: "Humanizing Work: The Humanizing Work Guide to Splitting User Stories",
          url: "https://www.humanizingwork.com/the-humanizing-work-guide-to-splitting-user-stories/",
        }
    actions:
      - {
          id: draw-s1,
          type: whiteboard.apply,
          at: { mark: s1 },
          upsertIds: [s1-box, s1],
          drawMs: 1000,
        }
      - {
          id: draw-s2,
          type: whiteboard.apply,
          at: { mark: s2 },
          upsertIds: [s-a1, s2-box, s2],
          drawMs: 1100,
        }
      - {
          id: draw-s3,
          type: whiteboard.apply,
          at: { mark: s3 },
          upsertIds: [s-a2, s3-box, s3],
          drawMs: 1100,
        }
      - {
          id: draw-s-checks,
          type: whiteboard.apply,
          at: { mark: s-checks },
          upsertIds: [c1, c2, c3],
          drawMs: 1200,
        }
      - {
          id: draw-s-rule,
          type: whiteboard.apply,
          at: { mark: s-rule },
          upsertIds: [b-rule],
          drawMs: 1000,
        }

  - id: layers
    chapter: Layer လား၊ slice လား
    narration: >
      [[mark:l-title]] ဒါဆို app ကို ဘယ်နေရာကနေ ဖြတ်ပြီး ခွဲမလဲ။ ခွဲနည်း နှစ်မျိုး ရှိပါတယ်။ [[mark:l-layers]] ပထမ
      နည်းက app ကို အလွှာ၊ layer လိုက် ခွဲတာပါ။ customer မြင်ရတဲ့ ဖုန်း screen တွေ အားလုံးကို အရင် ဆောက်၊ ပြီးမှ
      အော်ဒါကို စစ်တဲ့ အပိုင်း အားလုံး၊ နောက်ဆုံးမှ data ကို စနစ်တကျ သိမ်းထားတဲ့ database ကို ဆောက်တာမျိုးပါ။
      [[mark:l-late]] ကြည့်ရတာ စနစ်ကျပေမဲ့၊ layer သုံးခုလုံး မပြီးမချင်း customer တစ်ယောက်မှ အော်ဒါ
      မမှာနိုင်သေးပါဘူး။ ပထမဆုံး စမ်းလို့ ရတဲ့နေ့က အဆုံးမှာမှ ရောက်လာတော့၊ ပြဿနာတွေကိုလည်း အဆုံးမှာမှ အကုန်
      တွေ့ရပါတယ်။ [[mark:l-slice1]] ဒုတိယ နည်းကတော့ layer သုံးခုလုံးကို ဒေါင်လိုက် ပါးပါးလေး ဖြတ်ခွဲတာပါ။ ဒါကို
      vertical slice လို့ ခေါ်ပါတယ်။ screen ကနေ database အထိ တစ်လမ်းလုံး အလုပ်လုပ်တဲ့ အပိုင်းလေးပါ။ ပထမ slice မှာ
      ရိုးရိုး form တစ်ခု၊ စစ်တာ နည်းနည်းနဲ့ သိမ်းတာ နည်းနည်းပဲ ပါပေမဲ့၊ ပြီးတာနဲ့ တကယ့် အော်ဒါ တစ်ခု မှာကြည့်လို့
      ရပါပြီ။ [[mark:l-slice23]] နောက် slice တွေကလည်း layer သုံးခုလုံးကို ဖြတ်သွားတော့၊ တစ်ခု ပြီးတိုင်း စမ်းလို့
      ရပါတယ်။ [[mark:l-ugly]] ပထမ slice ရဲ့ form က ကြည့်လို့ မလှသေးလည်း ကိစ္စ မရှိပါဘူး။ ပုံစံကို နောက်မှ ပြင်လို့
      ရပေမဲ့၊ အော်ဒါ တစ်ခု တစ်လမ်းလုံး ရောက်မရောက်ကိုတော့ စောစော သိထားဖို့ လိုပါတယ်။
    sources:
      - {
          title: "Humanizing Work: The Humanizing Work Guide to Splitting User Stories",
          url: "https://www.humanizingwork.com/the-humanizing-work-guide-to-splitting-user-stories/",
        }
      - {
          title: "The New SDLC (Burmese edition): The developer's changing role (decomposition)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: draw-l-title,
          type: whiteboard.apply,
          at: { mark: l-title },
          open: true,
          clear: true,
          upsertIds: [l-title],
        }
      - {
          id: draw-l-layers,
          type: whiteboard.apply,
          at: { mark: l-layers },
          upsertIds: [l-r1, l-t1, l-r2, l-t2, l-r3, l-t3],
          drawMs: 2400,
        }
      - {
          id: draw-l-late,
          type: whiteboard.apply,
          at: { mark: l-late },
          upsertIds: [l-late],
          drawMs: 1000,
        }
      - {
          id: draw-l-slice1,
          type: whiteboard.apply,
          at: { mark: l-slice1 },
          upsertIds: [l-s1, l-n1],
          drawMs: 1200,
        }
      - {
          id: draw-l-slice23,
          type: whiteboard.apply,
          at: { mark: l-slice23 },
          upsertIds: [l-s2, l-n2, l-s3, l-n3, l-good],
          drawMs: 2200,
        }

  - id: type-plan
    chapter: Plan ကို ရေးရအောင်
    narration: >
      [[mark:close-l]] ဒီ slice တွေကို plan အဖြစ် ချရေးကြည့်ရအောင်။ [[mark:open-plan]] ဒီ plan ဖိုင်က agent
      ပြန်ပေးတဲ့ plan မဟုတ်ပါဘူး။ ဘာကို ဘယ်အစဉ်နဲ့ ဆောက်မလဲ ဆိုတာ ကိုယ်ကိုယ်တိုင် ဆုံးဖြတ်ပြီး ရေးမယ့် စာရင်းပါ။
      [[mark:type-head]] ဇယား တစ်ခုနဲ့ ရေးပါမယ်။ ဇယားရဲ့ အတန်း တစ်တန်း၊ row တစ်ခုက task တစ်ခုပါ။ ပထမ column မှာ
      အစဉ်နံပါတ်၊ ဒုတိယ column မှာ task ကို ရေးပါတယ်။ [[mark:sel-done-col]] နောက်ဆုံး column မှာတော့ ဒီ task
      ပြီးပြီလို့ ဘာနဲ့ စစ်မလဲ ဆိုတာ ရေးပါတယ်။ [[mark:sel-row1]] ပထမ row က ခုနက ပုံထဲက ပထမ slice ပါ။ သူ
      ပြီးမပြီးကို spec ထဲက AC နဲ့ပဲ ဆုံးဖြတ်မယ် ဆိုပြီး၊ AC ကို ဒီမှာ ပြန်မကူးဘဲ နံပါတ်ကိုပဲ ညွှန်ထားပါတယ်။
      ဒါကြောင့် AC တစ်ခု ပြောင်းရင် spec တစ်နေရာတည်းမှာ ပြင်ရုံပါပဲ။ စစ်မယ့် column ကို ဖြည့်လို့ မရတဲ့ task
      ဆိုရင်တော့၊ ဝေဝါးနေသေးတယ် ဆိုတဲ့ လက္ခဏာပါ။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The developer's changing role (specification, decomposition)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "Claude Code docs: Best practices for Claude Code",
          url: "https://code.claude.com/docs/en/best-practices",
        }
    actions:
      - { id: close-l, type: whiteboard.apply, at: { mark: close-l }, open: false }
      - { id: open-plan, type: workspace.openFile, at: { mark: open-plan }, path: docs/plan.md }
      - id: type-head
        type: editor.type
        at: { mark: type-head }
        target: { file: docs/plan.md, after: "# Plan · v1\n\n", occurrence: 1 }
        text: "| # | Task | Done when |\n|---|---|---|\n| 1 | form ကနေ အော်ဒါ တစ်ခု သိမ်းနိုင်တာ | AC-1 |\n"
        cadence: line-by-line
      - {
          id: sel-done-col,
          type: editor.select,
          at: { mark: sel-done-col },
          target: { file: docs/plan.md, text: "Done when", occurrence: 1 },
        }
      - {
          id: sel-row1,
          type: editor.select,
          at: { mark: sel-row1 },
          target:
            {
              file: docs/plan.md,
              text: "| 1 | form ကနေ အော်ဒါ တစ်ခု သိမ်းနိုင်တာ | AC-1 |",
              occurrence: 1,
            },
        }

  - id: size
    narration: >
      [[mark:type-row2]] ဒုတိယ task က ခုနက ပုံထဲက ဒုတိယ အပိုင်းပါ။ customer ရိုက်ထည့်တဲ့ အချက်တွေ၊ input တွေ
      မှားနေရင် အော်ဒါ မဖြစ်အောင် တားပေးတာပါ။ ဒါကို ပထမ task ထဲ ပေါင်းမထည့်ဘဲ သီးသန့် ခွဲထားတာက ပထမ slice ကို
      ပါးပါးလေးပဲ ထားချင်လို့ပါ။ [[mark:sel-row12]] lesson ၁၁ မှာ ရေးခဲ့တဲ့ order form brief က AC တစ်ကနေ AC လေး
      အထိကို တစ်ခါတည်း အပ်ထားလို့၊ တကယ်တော့ slice နှစ်ခု ပေါင်းနေသေးတာပါ။ plan မှာ အဲဒီ အလုပ်ကို task တစ်နဲ့ task
      နှစ် ခွဲလိုက်တော့၊ အော်ဒါ တစ်ခု သိမ်းလို့ရတာကို အရင် စစ်ပြီးမှ ငြင်းတာတွေကို စစ်လို့ ရပါတယ်။
      [[mark:sel-row2]] task တစ်ခု ဘယ်လောက် ကြီးသင့်လဲ ဆိုရင်၊ agent က တစ်ကြိမ်တည်းနဲ့ ပြီးနိုင်ပြီး၊ ကိုယ်က
      တစ်ထိုင်တည်း စစ်ပြီးနိုင်တဲ့ အရွယ်ပါ။ ဒီ task ဆိုရင် ဖုန်းပေါ်မှာ မှားတဲ့ အော်ဒါ သုံးခု မှာကြည့်ပြီး၊
      ငြင်းတဲ့ စာ ပေါ်မပေါ် ကြည့်ရုံနဲ့ စစ်ပြီးပါပြီ။ စစ်ဖို့ တစ်နေကုန် ကြာမယ့် task ဆိုရင်တော့ ထပ်ခွဲရပါမယ်။
      ပြောင်းပြန်အနေနဲ့ စစ်စရာ ရလဒ် မထွက်လာလောက်အောင် သေးလွန်းတဲ့ task တွေကလည်း အပ်ရတာ၊ စစ်ရတာ အကြိမ်ကြိမ်
      ဖြစ်ပြီး အချိန် ပိုကုန်စေပါတယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The developer's changing role (decomposition)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "Humanizing Work: The Humanizing Work Guide to Splitting User Stories",
          url: "https://www.humanizingwork.com/the-humanizing-work-guide-to-splitting-user-stories/",
        }
    actions:
      - id: type-row2
        type: editor.type
        at: { mark: type-row2 }
