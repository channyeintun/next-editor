  - id: recap
    narration: >
      [[mark:close-p05]] [[mark:open-notes]] cascading failure ကနေ စပါမယ်။ [[mark:sel-cascading]] cascading failure က တစ်ခု ပျက်တော့ နောက်တစ်ခုပေါ် ဝန်ပိုကျပြီး ဆင့်ကဲ ပျက်သွားတာ ဖြစ်ပြီး၊ [[mark:sel-goodput]] goodput က retry နဲ့ fail တွေကို ဖယ်ပြီး user အတွက် တကယ် အောင်မြင်တဲ့ အလုပ်ပါ။ [[mark:sel-shedding]] load shedding က ဝန်ပိရင် အရေးမကြီးတဲ့ request ကို တံခါးဝမှာတင် ငြင်းတာပါ။
      [[mark:sel-backoff]] backoff with jitter က retry တိုင်း စောင့်ချိန် တိုးပြီး ကျပန်း အချိန် ထည့်တာ ဖြစ်ပြီး၊ [[mark:sel-rule]] ပြောင်းလဲမှု စည်းကမ်းက budget နည်းချိန်၊ peak နီးချိန်နဲ့ incident ကြီးချိန်မှာ ပြောင်းလဲမှုကို ပိုတင်းတင်း စစ်တာပါ။ [[mark:sel-kit]] အရေးပေါ် အိတ်ကတော့ ကိုယ့် tool တွေ ပျက်တဲ့နေ့အတွက် ကြိုပြင်ထားတဲ့ fallback တွေပါ။
      [[mark:sel-question]] သင်္ကြန် ညက retry တွေကို ပြန်တွေးကြည့်ပါ။ [[mark:ask-question]] layer သုံးခုက call တစ်ခုကို တစ်ခုစီ သုံးခါအထိ ကြိုးစားရင် user တစ်ချက် နှိပ်တာက အောက်ဆုံးမှာ call ဘယ်နှခုအထိ ဖြစ်နိုင်လဲ?
      [[mark:pause-question]] သုံး သုံးလီ ကိုး၊ ကိုး သုံးလီ ၂၇ ခုပါ၊ ဒါကြောင့် retry ကို layer တစ်ခုတည်းမှာပဲ ထားရတာပါ။ နောက်တစ်နှစ် သင်္ကြန် change freeze အလယ်မှာ Top-up deploy တစ်ခု ထွက်သွားပါတယ်၊ freeze စည်းကမ်းက wiki စာမျက်နှာ တစ်ခုပေါ်မှာပဲ ရှိနေခဲ့လို့ပါ။ မှန်တဲ့နည်းကို လွယ်တဲ့နည်း ဖြစ်အောင် ဘယ်လို လုပ်မလဲ?
    sources:
