  - id: change-rule
    chapter: "ပြောင်းလဲမှု စည်းကမ်း"
    narration: >
      [[mark:close-p03b]] [[mark:b3-s1]] ဒီ incident နောက်မှာ Padauk က ပြောင်းလဲမှုကို ဘယ်လောက် ဂရုစိုက်ရမလဲ ဆိုတာကို ပြက္ခဒိန်နဲ့ error budget နဲ့ ချိတ်လိုက်ပါတယ်။ [[mark:b3-s1b]] အန္တရာယ် အများဆုံး ရက်တွေက လတိုင်း ၂၅ ရက်ကနေ ၁ ရက်အထိ လစာထုတ်တဲ့ အပတ်နဲ့ သင်္ကြန် မတိုင်ခင် သုံးရက်ပါ။
      [[mark:b3-s2]] error budget ၂၅ ရာခိုင်နှုန်းအောက် ကျန်ရင် ဒါမှမဟုတ် အဲဒီ ရက်တွေထဲ ရောက်ရင် ပြောင်းလဲမှုတိုင်းမှာ rollback လုပ်မယ့်သူ နာမည်ကို ကြိုရေးပြီး reviewer နောက်တစ်ယောက် လိုပါတယ်။ ဒါက Padauk ရဲ့ ပြောင်းလဲမှု စည်းကမ်းပါ။ သင်္ကြန် ညက budget အများစု ကုန်သွားလို့ Top-up က လကုန်အထိ ဒီ စည်းကမ်းအောက်မှာ ရှိနေပါတယ်။
      [[mark:b3-s3]] သင်္ကြန် အကြိုညမှာတော့ rollout အားလုံး ရပ်ပြီး အရေးပေါ် fix နဲ့ security fix ပဲ ခွင့်ပြုတဲ့ change freeze ပါ။ incident ကြီး ဖြစ်နေချိန်မှာလည်း မပျက်သေးတဲ့ service တွေနဲ့ ပြန်ကောင်းအောင် သုံးမယ့် tool တွေကို incident ပြီးတဲ့အထိ freeze အောက်မှာ ထားပါတယ်။
    sources:
