      notes.md: |
        # Overload နဲ့ emergency mode

        - cascading failure — တစ်ခု ပျက်တာက နောက်တစ်ခုပေါ် ဝန်ပိုကျပြီး ကွင်းလို ဆင့်ကဲ ပျက်
        - goodput — retry နဲ့ fail ဖယ်ပြီး user အတွက် တကယ် အောင်မြင်တဲ့ အလုပ်
        - load shedding — ဝန်ပိရင် အရေးမကြီးတဲ့ request ကို တံခါးဝမှာ ငြင်း
        - backoff with jitter — retry တိုင်း စောင့်ချိန် တိုး၊ ကျပန်း အချိန် ထည့်
        - ပြောင်းလဲမှု စည်းကမ်း — budget နည်း၊ peak နီး၊ incident ကြီးရင် ပြောင်းလဲမှုကို ပိုတင်းတင်း စစ်
        - အရေးပေါ် အိတ် — break-glass key · phone bridge · offline runbook

        မေးခွန်း: layer 3 ခု၊ တစ်ခုစီ 3 ခါအထိ ကြိုးစား။ user တစ်ချက် နှိပ်ရင် အောက်ဆုံးမှာ call ဘယ်နှခုအထိ?
