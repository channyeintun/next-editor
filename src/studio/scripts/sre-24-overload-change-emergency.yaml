build:
  # Studio swaps in the Burmese voice chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 2624

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: hook
    chapter: "သင်္ကြန် ညသန်းခေါင်"
    narration: >
      [[mark:show-p01]] ဈေးနှုန်းစာရင်း သေးသွားလား စစ်တဲ့ check၊ zone တစ်ခုစီက cache နဲ့ notification queue တွေ ထည့်ပြီးတော့ ခြောက်ပတ် ပြင်ဆင်ခဲ့တဲ့ သင်္ကြန် ညသန်းခေါင် ရောက်လာပါပြီ။
      [[mark:hook-surge]] Operator B ရဲ့ နှစ်သစ် promo စတာနဲ့ တစ်စက္ကန့်ကို request ၃၀၀၀ အတွက် ဆောက်ထားတဲ့ top-up service ဆီ ၂၀၀၀၀ ဝင်လာပါတယ်။ lesson ၂၀ မှာ ကြိုငှားခဲ့တာက top-up အစစ်တွေအတွက်ပါ၊ ဒီ request အများစုကတော့ ထပ်ပို့နေတဲ့ retry တွေပါ။ မကြာခင် server တွေလည်း တစ်လုံးပြီး တစ်လုံး restart ဖြစ်လာပါတယ်။ ပြိုမကျဘဲ ဘယ်လို တည်ငြိမ်အောင် ထိန်းမလဲ?
      [[mark:show-p01b]] အဲဒီ တစ်ညတည်းနဲ့ SLO က ခွင့်ပြုထားတဲ့ တစ်လစာ ပျက်ခွင့်၊ error budget ရဲ့ လေးပုံသုံးပုံကျော် ကုန်သွားပါတယ်။ ဒီလို ခံနိုင်တာထက် ပိုတဲ့ အလုပ် ရောက်လာတာကို overload လို့ ခေါ်ပါတယ်။ ဒီ lesson မှာ overload ကို ခံပုံ၊ ပြောင်းလဲမှုကို ဘေးကင်းအောင် လုပ်ပုံနဲ့ ကိုယ့် tool တွေပါ ပျက်တဲ့နေ့ကို ကြည့်ပါမယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book, 1st ed: Addressing Cascading Failures",
          url: "https://sre.google/sre-book/addressing-cascading-failures/",
        }
      - { title: "Workbook: Managing Overload", url: "https://sre.google/workbook/overload/" }
    actions:
      - { id: collapse-dock, type: runtime.collapseDock, at: { scene: start, offsetMs: -1750 } }
      - {
          id: show-p01,
          type: slide.show,
          at: { mark: show-p01, offsetMs: -1450 },
          slideId: l24-p01,
        }
      - { id: show-p01b, type: slide.show, at: { mark: show-p01b }, slideId: l24-p01b }

  - id: cascade
    chapter: "Cascading failure"
    narration: >
      [[mark:close-p01b]] [[mark:b1-s1]] postmortem မှာ မသီရိက အဲဒီညကို ကွင်း တစ်ခုအဖြစ် ဆွဲပြပါတယ်။ [[mark:b1-s1b]] ဝန် ပိုလာတော့ queue ရှည်လာပြီး request တွေ ကြာကြာ စောင့်ရပါတယ်။ [[mark:b1-s1c]] app က စောင့်ပေးတဲ့ ကန့်သတ်ချိန်၊ timeout ကျော်သွားတော့ စောင့်တာ ရပ်လိုက်ပေမဲ့ server ကတော့ ဘယ်သူမှ မစောင့်တော့တဲ့ request တွေကို ဆက်လုပ်နေလို့ အလုပ်တွေ အလကား ဖြစ်ကုန်ပါတယ်။
      [[mark:b1-s2]] timeout ဖြစ်တော့ app၊ Padauk API နဲ့ top-up router ဆိုတဲ့ layer သုံးခုလုံးက retry လုပ်ကြလို့ user တစ်ချက် နှိပ်တာက call အများကြီး ဖြစ်သွားပါတယ်။ [[mark:b1-s2b]] health check ကို မဖြေနိုင်တဲ့ server တွေကို cloud platform က restart လုပ်ပစ်တော့ ကျန်တဲ့ server တွေပေါ် ဝန် ပိုကျပြီး ပြန်တက်လာတဲ့ server ကလည်း cache ဗလာနဲ့ နှေးလို့ ကွင်းက အစကို ပြန်ရောက်ပါတယ်။
      [[mark:b1-s3]] ဒီလို တစ်ခု ပျက်တာက နောက်တစ်ခုပေါ် ဝန်ပိုကျပြီး ဆင့်ကဲ ပျက်သွားတာကို cascading failure လို့ ခေါ်ပါတယ်။ [[mark:b1-s3b]] ကွင်းကို ဖြတ်ဖို့ ဝန်ကို လျှော့ရမယ်၊ retry တွေကို စောင့်ခိုင်းရမယ်၊ restart တွေကိုလည်း ခဏ ရပ်ရပါမယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book, 1st ed: Addressing Cascading Failures",
          url: "https://sre.google/sre-book/addressing-cascading-failures/",
        }
      - {
          title: "Timeouts, retries, and backoff with jitter (AWS Builders' Library)",
          url: "https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/",
        }
    actions:
      - { id: close-p01b, type: slide.close, at: { mark: close-p01b, offsetMs: -400 } }
      - {
          id: b1-s1,
          type: whiteboard.apply,
          at: { mark: b1-s1 },
          open: true,
          clear: true,
          upsertIds: [l24-b1-ring],
          drawMs: 1600,
        }
      - {
          id: b1-s1b,
          type: whiteboard.apply,
          at: { mark: b1-s1b },
          upsertIds: [l24-b1-n1, l24-b1-n1-t, l24-b1-a12, l24-b1-n2, l24-b1-n2-t],
          drawMs: 2000,
        }
      - {
          id: b1-s1c,
          type: whiteboard.apply,
          at: { mark: b1-s1c },
          upsertIds: [l24-b1-a23, l24-b1-n3, l24-b1-n3-t],
          drawMs: 1200,
        }
      - {
          id: b1-s2,
          type: whiteboard.apply,
          at: { mark: b1-s2 },
          upsertIds: [l24-b1-n4, l24-b1-n4-t],
          drawMs: 1000,
        }
      - {
          id: b1-s2b,
          type: whiteboard.apply,
          at: { mark: b1-s2b },
          upsertIds: [l24-b1-n5, l24-b1-n5-t1, l24-b1-n5-t2],
          drawMs: 1400,
        }
      - {
          id: b1-s3,
          type: whiteboard.apply,
          at: { mark: b1-s3 },
          upsertIds: [l24-b1-aback],
          drawMs: 700,
        }
      - {
          id: b1-s3b,
          type: whiteboard.apply,
          at: { mark: b1-s3b },
          upsertIds: [l24-b1-x1, l24-b1-x1-t, l24-b1-x2, l24-b1-x2-t, l24-b1-x3, l24-b1-x3-t],
          drawMs: 3000,
        }

  - id: goodput
    chapter: "Goodput"
    narration: >
      [[mark:close-b1]] [[mark:b2-s1]] ဒါဆို ဘာကို တိုင်းမလဲ? server handle လုပ်သမျှ request အားလုံးကို ရေတွက်တဲ့ throughput ကတော့ retry နဲ့ fail တွေပါ ပါနေလို့ လှည့်စားတတ်ပါတယ်။ [[mark:b2-s1b]] ဒါကြောင့် ဖုန်းဘေလ် တကယ် ဝင်သွားတဲ့ top-up လို အသုံးဝင်တဲ့ အလုပ်ကိုပဲ ရေတွက်တဲ့ goodput ကို ကြည့်ပါတယ်။ [[mark:b2-s1c]] ဒီ chart မှာ ဝင်လာတဲ့ ဝန်ကို capacity ရဲ့ ၁ ဆကနေ ၆ ဆအထိ တိုးကြည့်ပါမယ်။
      [[mark:b2-s2]] အနီရောင် bar တွေက အဲဒီညက top-up service ပါ။ [[mark:b2-s2b]] capacity ကျော်တာနဲ့ goodput ပြိုကျပြီး ၆ ဆမှာ သုညနီးပါး ဖြစ်သွားပါတယ်၊ server တွေက အလုပ် အပြည့် လုပ်နေပေမဲ့ အများစုက timeout ဖြစ်ပြီးသား request တွေနဲ့ retry တွေမို့ပါ။
      [[mark:b2-s3]] Padauk လိုချင်တာက အစိမ်းရောင် bar တွေပါ။ [[mark:b2-s3b]] ဝန် ဘယ်လောက်ပဲ တက်တက် goodput က capacity နားမှာ ညီညီ ရှိနေပြီး ပိုလာတဲ့ အပိုင်းကိုပဲ ငြင်းတာပါ။ အောင်မြင်တယ် ဆိုတာ တစ်ညလုံး ငွေပေးချေမှုတွေ ဆက်စီးနေပြီး ဝန် ကျသွားတာနဲ့ ဘယ်သူမှ ဘာမှ မနှိပ်ဘဲ system က သူ့ဘာသာ ပြန်ကောင်းလာတာပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
