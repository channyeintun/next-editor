  - id: undo-toolbox
    chapter: "Undo လုပ်နည်း"
    narration: >
      [[mark:close-b3]] [[mark:show-p04]] အဲဒီညက Padauk ကို ပြန်ထိန်းခဲ့တာက promo banner ပိတ်ပြီး degrade လုပ်တာနဲ့ capacity တိုးတာပါ။ ဒါတွေက အကြောင်းရင်း မသိခင် သုံးလို့ရတဲ့ lesson ၁၀ က generic mitigation တွေပါ။ traffic လွှဲတဲ့ drain၊ rollback နဲ့ ဒုက္ခပေးနေတဲ့ caller ကို block လုပ်တာလည်း ပါပါတယ်။ version အသစ်က data ပုံစံကို ပြောင်းပြီးသွားရင်တော့ rollback လုပ်လို့ မရတော့လို့ ပြင်ပြီးသား version ကို ရှေ့ဆက်တင်တဲ့ roll forward ကို ကြိုပြင်ထားရပါမယ်။
      [[mark:show-p04b]] fix တွေကလည်း ပြောင်းလဲမှုတွေမို့ ကြိုစမ်းထားပြီး တဖြည်းဖြည်း သုံးရပါတယ်။ restart ကိုတော့ ဝန်ပိချိန်မှာ သတိထားရပါမယ်၊ capacity နဲ့ data ပြည့်နေတဲ့ cache ကို လွှင့်ပစ်လို့ပါ။ ဒါကြောင့် ဝန်ပိရင် အလိုအလျောက် restart ကို ခဏ ရပ်ပြီး အသုံးဝင်တဲ့ အလုပ် လုံးဝ မလုပ်နိုင်တော့တဲ့ server ကိုပဲ restart လုပ်ပါတယ်။
