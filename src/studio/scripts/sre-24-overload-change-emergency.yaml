      [[mark:show-p05]] ကိုယ့် system ထဲမှာ layer နှစ်ခုက retry ထပ်လုပ်နေတဲ့ client တွေကို ဒီအပတ် ရှာကြည့်ပါ။ နောက်လာမယ့် peak ရက်တွေကို ပြက္ခဒိန်ပေါ် မှတ်ပြီး အဲဒီ ရက်တွေမှာ ပြောင်းလဲမှုကို ဘယ်လောက် တင်းကျပ်မလဲ ချရေးပါ။ ပြီးတော့ chat မရှိရင် ဘယ်လို စကားပြောမလဲလို့ အဖွဲ့ကို မေးကြည့်ပါ။
