  - id: break-the-loop
    chapter: "ကွင်းကို ဖြတ်မယ်"
    narration: >
      [[mark:close-b2]] [[mark:show-p02]] Padauk က ကွင်းကို server ဘက်၊ client ဘက်နဲ့ partner တစ်ခုချင်းအလိုက် ဖြတ်ပါတယ်။ server ဘက်မှာ ဝန်ပိရင် request တချို့ကို တမင် ငြင်းပါတယ်၊ တစ်ဝက် လုပ်ပြီးမှ fail တာထက် တံခါးဝမှာတင် ငြင်းလိုက်ရင် resource ကို ကျန်တဲ့ request တွေအတွက် ချန်ထားနိုင်လို့ပါ။ ဒါကို load shedding လို့ ခေါ်ပါတယ်။
      [[mark:show-p02b]] ဘာကို အရင် ငြင်းမလဲ ဆိုတာကို request တိုင်းမှာ တပ်ထားတဲ့ priority label က ဆုံးဖြတ်ပါတယ်။ top-up ငွေပေးချေမှုကို အမြဲ ဖြေပြီး status မေးတာ၊ promo banner တွေကိုတော့ ခဏနေမှ ပြန်ကြိုးစားပါလို့ ပြောပြီး ငြင်းပါတယ်။ lesson ၂၀ မှာ ကြိုရေးထားတဲ့ အစီအစဉ်အတိုင်း feature တချို့ ပိတ်ပြီး အဓိက အလုပ်ကို ဆက်ပေးတာကတော့ graceful degradation ပါ။
      [[mark:show-p02c]] client တွေက ချက်ချင်း ပြန်ပြန်ပို့နေရင် shedding က အလကား ဖြစ်မှာမို့ client ဘက်ကလည်း ကူရပါတယ်။ retry ကို app တစ်နေရာတည်းမှာပဲ လုပ်ပြီး ပြန်ကြိုးစားတိုင်း စောင့်ချိန်ကို နှစ်ဆစီ တိုးပြီး ကျပန်း အချိန်နည်းနည်း ထည့်တဲ့ backoff with jitter ကို သုံးပါတယ်။ retry အရေအတွက်ကိုလည်း retry budget နဲ့ ကန့်သတ်ထားပြီး ခေါ်တာ အများစု fail နေရင် app က ကိုယ်တိုင် လျှော့ပို့ပြီး အရေးကြီးတဲ့ request ကိုပဲ ဆက်ပို့ပါတယ်။
      [[mark:show-p02d]] တတိယက partner တစ်ခုချင်း သုံးခွင့်ရှိတဲ့ အများဆုံး ပမာဏ၊ quota ပါ။ အဲဒီည Operator B ရဲ့ promo က service တစ်ခုလုံးကို ပိတ်ဆို့လို့ Operator A နဲ့ C သုံးတဲ့ user တွေပါ ဒုက္ခရောက်ခဲ့ပါတယ်။ အခုတော့ operator တစ်ခုစီမှာ quota ရှိလို့ ကျော်တဲ့ request တွေက Operator B ဘက်မှာပဲ error ရပြီး A နဲ့ C က ဆက်သွားပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book, 1st ed: Addressing Cascading Failures",
          url: "https://sre.google/sre-book/addressing-cascading-failures/",
        }
      - {
          title: "Timeouts, retries, and backoff with jitter (AWS Builders' Library)",
          url: "https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/",
        }
    actions:
