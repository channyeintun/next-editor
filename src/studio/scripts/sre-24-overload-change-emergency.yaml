  - id: change-safely
    chapter: "ဘေးကင်းကင်း ပြောင်း"
    narration: >
      [[mark:show-p02e]] postmortem မှာ တွေ့တာ နောက်တစ်ခုက သင်္ကြန် မတိုင်ခင် နှစ်ရက်မှာ Padauk API ရဲ့ retry ကို တစ်ခါကနေ သုံးခါ တိုးလိုက်တဲ့ config ပြောင်းလဲမှုပါ။ code ပြောင်းလဲမှု နှစ်ခုနဲ့ ရောပြီး server အားလုံးဆီ တစ်ခါတည်း ပို့ခဲ့လို့ ညသန်းခေါင်မှာ ဘယ်ဟာကြောင့်လဲ မသေချာသလို ပြန်ဖြုတ်ဖို့လည်း deploy အသစ် လိုခဲ့ပါတယ်။
      [[mark:show-p03]] production ပြဿနာ အများစုက ပြောင်းလဲမှုကနေ စတာပါ။ ဒါကြောင့် Padauk က code၊ config၊ data ဘာပဲ ပြောင်းပြောင်း lesson ၁၉ က canary လိုပဲ traffic နည်းနည်းဆီ အရင် ပို့ကြည့်ပြီး zone တစ်ခုချင်း တဖြည်းဖြည်း ဖြန့်ပါတယ်။ တစ်ကြိမ်မှာ ပြောင်းလဲမှု တစ်ခုပဲ ဖြန့်လို့ ပြဿနာ တက်ရင် ဘယ်ဟာကြောင့်လဲ ချက်ချင်း သိပါတယ်။
      [[mark:show-p03b]] ပြောင်းလဲမှုတိုင်းကို ရပ်လို့လည်း ရရပါမယ်။ retry setting ကို feature flag ခလုတ် နောက်မှာ ထားခဲ့ရင် deploy မလုပ်ဘဲ စက္ကန့်ပိုင်းအတွင်း ပြန်ပိတ်နိုင်ခဲ့မှာပါ။ rollout ရပ်တဲ့ ခလုတ်ကလည်း နှိပ်လို့ ဘေးကင်းပြီး ပြန်ဆက်လို့ရမှ လူတွေ နှိပ်ရဲမှာပါ။
    sources:
