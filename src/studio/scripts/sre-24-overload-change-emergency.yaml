# SRE from zero, lesson 24: Overload နဲ့ emergency mode (Burmese concept lesson).
#
# Built from the approved voice script
# docs/sre-course/voice-scripts/sre-24-overload-change-emergency.md. Every
# spoken character is that script's "> " lines, unchanged; each ⟪…⟫ marker
# became a [[mark:…]] at the same place. Check it with:
#   bun ~/Documents/sre-course/work/check-narration.ts \
#     docs/sre-course/voice-scripts/sre-24-overload-change-emergency.md \
#     src/studio/scripts/sre-24-overload-change-emergency.yaml
#
# Nothing runs: deck pages and the whiteboard carry the lesson, and notes.md is
# the recap. The workspace and runtime follow the validated no-code skeleton
# (WebContainer, empty init command, a harmless dev script).
#
# Fourteen marks add no spoken text and sit at an existing ။ or ?:
# - hook-surge splits the hook at its paragraph break (one 482-character
#   dialog would pass the 450-character limit; no action uses it).
# - b1-s1b and b1-s1c land B1's nodes on the sentences that name them: the
#   ring first, then "ဝန် ပိုလာ" and "queue ရှည်လာ", then "timeout". b1-s2b
#   lands the restart node on the "health check" sentence, after the retry node
#   at b1-s2. b1-s3b lands the three strikes and their fixes on "ကွင်းကို
#   ဖြတ်ဖို့", where the narration lists them. B1's step 3 mark (b1-s3) draws
#   the arrow back to "ဝန် ပိုလာ" instead of any new label: the narration has
#   just said "ကွင်းက အစကို ပြန်ရောက်ပါတယ်", and the sentence that follows only
#   gives the cascade its name, so nothing else belongs there.
# - b2-s1b lands B2's title on the sentence that says "goodput"; b2-s1c lands
#   its axis labels and (b2-s1d, afterAction) the capacity line on the
#   "chart" sentence, so no apply adds more than three labelled texts; b2-s2b
#   and b2-s3b land the red "ပြိုကျ" label and the green fix label on the
#   second sentence of steps 2 and 3, after their bars.
# - b3-s1b lands B3's two ticks on the sentence that names the two dangerous
#   periods; step 1's mark only draws the month axis.
# - b4-s1b lands the sign-on box on the sentence that says "single sign-on",
#   after b4-s1's console box and b4-s1c (afterAction) the other two red
#   boxes. b4-s2 only draws the three empty green slots of the kit (the first
#   sentence says Padauk packs a kit); b4-s2b types in each label as the
#   second sentence names the key, the bridge and the runbook. b4-s4b lands
#   the second key holder on the sentence that names Mandalay.
# - ask-question makes the recap question its own dialog (the 121-character
#   question after the lead-in "… ပြန်တွေးကြည့်ပါ။"), so the question-line
#   select can hang off it for the ⟪pause 3s⟫ (see select-question).
#   sel-question is the voice script's ⟪select မေးခွန်း⟫; it only splits the
#   recap's last term from the lead-in.
# Pacing: at 70 ms/char the longest a page or board step holds is the cover,
# l24_p01 (36.6 s: its two paragraphs have no page change between them), then
# l24_p04 (29.5 s) and l24_p02c (28.8 s); the longest dialog is 411
# characters (l24_p04's), so no pacing page or step was added.
#
# A board followed by a deck page closes the panel (open: false) 400 ms
# before the page, and a deck page followed by a board closes the page 400 ms
# before, as in Module 1. ⟪close board⟫ straight into the next board (scene 3)
# wipes the open board 400 ms early (whiteboard.apply clear) instead of closing
# the panel, so the editor does not flash between two boards, as in lesson 16;
# the next board then draws with open: true, clear: true as usual. Every board
# opens with open + clear.
#
# Boards (B1 P3 ring, B2 P5 bars, B3 P8 timeline, B4 P2 comb turned top to
# bottom). Colour jobs: #1e1e1e ink (paints white) for arrows, the axes, the
# bus and the 1×–6× marks; blue the thing named (the five cascade steps, the
# goodput title, the two calendar ticks); green healthy or done (the three
# fixes, the green goodput bars, the emergency kit, the second key holder); red
# failure or limit (the strikes, the failing goodput bars, the sign-on outage
# and what it locks, the freeze); orange the caveat or limit (the capacity
# line, the change rule, the game day); violet flow (the cascade ring). The
# five ring nodes carry a white fill (it inverts to dark on the canvas) so the
# ring runs behind them, as in lesson 2's board B3; its arrows read clockwise
# (top, right, then back into the top node). A label on two lines is one text
# asset per line, so each line meets the 0.55 em width rule on its own; every
# label was also measured in Chrome with Excalidraw's Virgil font
# (wb-fit.mjs) and stays inside its box. B2 pairs a red and a green bar at
# each load (the voice script puts the green bars "beside" the red ones), and
# the "ပြိုကျ" label sits in the gap above the 6× red bar. B4 runs top to
# bottom (an arrow-down bus) because the voice script puts each fallback under
# its red box: the right-hand comb would need six rows.
#
# Deck pages: deck "Next Editor · SRE 5C · Design and platforms", published;
# the /pub URL below is final. Its l24 pages are built later from the page
# plan, so until then the Director reports page "l24_p01" missing from the
