  - id: tools-down
    chapter: "ကိုယ့် tool တွေပါ ပျက်တဲ့အခါ"
    narration: >
      [[mark:close-p04b]] [[mark:b4-s1]] သင်္ကြန် ပြီးလို့ ဆယ်ရက်လောက်အကြာ လစာထုတ်ရက် မနက်မှာ on-call ကျနေတဲ့ ကိုမင်းက Wallet နှေးနေတာကို ကြည့်ဖို့ console ကို ဝင်ပေမဲ့ login မရပါဘူး။ [[mark:b4-s1b]] login တစ်ခါနဲ့ tool အားလုံး ဝင်ရအောင် လုပ်ပေးတဲ့ single sign-on ပျက်နေလို့ console၊ team chat နဲ့ runbook wiki အားလုံး ပိတ်သွားပါတယ်။
      [[mark:b4-s2]] on-call ကျသူတွေ မီးပျက်ရင် power bank၊ လိုင်းကျရင် ဆင်းကတ် အပို ဆောင်ထားသလိုပဲ အဲဒီနေ့ နောက်မှာ Padauk က အရေးပေါ် အိတ် တစ်ခု ပြင်ပါတယ်။ [[mark:b4-s2b]] အိတ်ထဲမှာ ပုံမှန် ကန့်သတ်ချက်ကို ကျော်ပြီး ဝင်လို့ရတဲ့ break-glass key၊ နံပါတ် တစ်ခု ခေါ်ရုံနဲ့ အားလုံး ဆုံလို့ရတဲ့ phone bridge နဲ့ ဖုန်းထဲ သိမ်းထားတဲ့ offline runbook တွေ ပါပါတယ်။
      [[mark:b4-s3]] break-glass key သုံးရင်တောင် လူ နှစ်ယောက် အတည်ပြုရပါတယ်၊ အရေးပေါ်လမ်းက ပိုလွယ်နေရင် တစ်ယောက်ယောက်က ပုံမှန်လမ်းကို တမင် ဖျက်ပြီး ကျော်သွားနိုင်လို့ပါ။ fallback တွေကိုလည်း ပုံမှန်လမ်းနဲ့ သုံးရတာ တူအောင် လုပ်ထားရပါမယ်၊ offline runbook က wiki နဲ့ အဆင့်တွေ အတူတူ ဖြစ်သလိုပါ။
      [[mark:b4-s4]] နောက်လမှာ single sign-on ကို တမင် ပိတ်တဲ့ game day လုပ်တော့ break-glass key ရှိတာ ကိုဇော် တစ်ယောက်တည်း ဖြစ်ပြီး လေယာဉ်ပေါ်မှာမို့ ဆက်သွယ်မရပါဘူး။ [[mark:b4-s4b]] အတူ ပျက်နိုင်တဲ့ failure domain ဆိုတာ လူတွေမှာလည်း ရှိလို့ မန္တလေးမှာ key ရှိတဲ့ ဒုတိယ လူ တစ်ယောက် ထားလိုက်ပါတယ်။
      [[mark:close-b4]] [[mark:show-p04c]] tool တွေ ပျက်တဲ့နေ့မှာတော့ မေးခွန်း သုံးခုကို အစဉ်လိုက် မေးပါ။ ပုံမှန်လမ်း ရသေးလား၊ မရရင် fallback ရှိလား၊ အဲဒါလည်း မရှိရင်တော့ အတွေ့အကြုံ အများဆုံး နှစ်ယောက်ကို ခေါ်ပါ။ fallback တွေ အမြဲ သုံးလို့ရနေအောင် ခေါင်းဆောင်တွေက ထိန်းထားရပြီး ခဏခဏ သေးသေးလေး လေ့ကျင့်တာကလည်း ကျွမ်းကျင်မှုကို ကြာကြာ ခံစေပါတယ်။
    sources:
