build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 8152

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: need
    chapter: ကြာသပတေးနေ့ကို စောင့်နေတဲ့ ဆုံးဖြတ်ချက်တွေ
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ တောင်းဆိုချက် တစ်ခုကို အချက်အလက်နဲ့ ရွေးစရာတွေ ပြပြီး ညှိနှိုင်းပုံနဲ့၊ ဆုံးဖြတ်ချက်
      တစ်ခုတည်းကို နားထောင်သူ လေးမျိုးအတွက် လေးမျိုး ပြောပြပုံကို လေ့လာခဲ့ပါတယ်။
      [[mark:q-open]] ဒီတစ်ခါ ပြဿနာကတော့ ဆုံးဖြတ်ချက်တွေ စောင့်နေရတာပါ။ ခရီးဖော် မှာ အခု developer ၉၀၊ team
      ၁၂ ခု ရှိနေပါပြီ။
      [[mark:q-board]] team တစ်ခုထက် ပိုထိမယ့် ဆုံးဖြတ်ချက်မှန်သမျှကို ကြာသပတေးနေ့တိုင်း ထိုင်တဲ့ architecture
      board က ခွင့်ပြုပေးရပါတယ်။ board မှာ chief architect ဖြစ်တဲ့ ကိုယ်နဲ့ တခြား architect သုံးယောက်
      ပါပါတယ်။
      [[mark:q-queue]] board က တစ်ပတ်ကို လေးခုလောက်ပဲ ကြည့်နိုင်ပါတယ်။ အခု စောင့်နေတာက ၂၃ ခု ရှိနေပြီမို့၊
      ဒီနေ့ တင်တဲ့ team က ခြောက်ပတ်နီးပါး စောင့်ရမှာပါ။
      [[mark:q-far]] ကြာတာ တစ်ခုတည်းလည်း မဟုတ်ပါဘူး။ ကိုယ်တို့ လေးယောက်က team တစ်ခု ဆယ်မိနစ်လောက် ရှင်းပြတာကို
      နားထောင်ပြီး ဆုံးဖြတ်ရတာပါ။ အဲဒီ service ကို နေ့တိုင်း ရေးနေတဲ့သူတွေ သိတာရဲ့ အနည်းငယ်လောက်နဲ့ပဲ
      ဆုံးဖြတ်နေရတာပါ။
      [[mark:q-skip]] အဆိုးဆုံးကတော့ team တချို့က board ကို မတင်တော့တာပါ။ ပြီးခဲ့တဲ့လက team တစ်ခုက cache
      အသစ် တစ်ခုကို ဘယ်သူ့ကိုမှ မမေးဘဲ ထည့်လိုက်တာကို၊ production မှာ ပြဿနာ ဖြစ်မှ ကိုယ်တို့ သိရပါတယ်။
      ခြောက်ပတ် စောင့်နေရင် အလုပ်က ပြီးမှာ မဟုတ်တာမို့၊ သူတို့ကို အပြစ်တင်လို့လည်း မရပါဘူး။
      [[mark:q-shape]] ပြဿနာက လူတွေမှာ မဟုတ်ပါဘူး။ လူ အနည်းငယ်က အားလုံးအတွက် ဆုံးဖြတ်ပေးတဲ့ ပုံစံမှာပါ။
    sources:
      - {
          title: "Facilitating Software Architecture (Harmel-Law)",
          url: "https://oreil.ly/FacilitatingSoftwareArch",
        }
    actions:
      - {
          id: draw-b-open,
          type: whiteboard.apply,
          at: { mark: q-open },
          open: true,
          upsertIds: [b-title, b-teams, b-teams-l],
          drawMs: 1500,
        }
      - {
          id: draw-b-board,
          type: whiteboard.apply,
          at: { mark: q-board },
          upsertIds: [b-board, b-board-l],
          drawMs: 1200,
        }
      - {
          id: draw-b-queue,
          type: whiteboard.apply,
          at: { mark: q-queue },
          upsertIds: [b-rate, b-a1, b-queue, b-queue-l, b-a2, b-wait],
          drawMs: 2800,
        }
      - {
          id: draw-b-far,
          type: whiteboard.apply,
          at: { mark: q-far },
          upsertIds: [b-far],
          drawMs: 1000,
        }
      - {
          id: draw-b-skip,
          type: whiteboard.apply,
          at: { mark: q-skip },
          upsertIds: [b-skip],
          drawMs: 1000,
        }
      - {
          id: point-b-queue,
          type: whiteboard.point,
          at: { mark: q-shape },
          target: { assetId: b-queue },
        }

  - id: rule
    chapter: အကြံ တောင်းပြီးမှ ဆုံးဖြတ်ခြင်း
    narration: >
      [[mark:r-open]] ဒါဆို ဆုံးဖြတ်ခွင့်ကို code နဲ့ အနီးဆုံးမှာ ရှိတဲ့ team တွေဆီ ပေးလိုက်ရင်ကော။ စိုးရိမ်စရာကတော့ team
      ၁၂ ခုက ကိုယ့်ဘာသာ ဆုံးဖြတ်ကြရင် တစ်ခုနဲ့တစ်ခု မကိုက်တာ၊ တခြား team ကို ထိခိုက်တာတွေ ဖြစ်လာနိုင်တာပါ။ ဒီ စိုးရိမ်မှုကို ဖြေပေးတဲ့ နည်းတစ်ခုကို architecture advice process လို့ ခေါ်ပါတယ်။
      [[mark:r-rule]] စည်းမျဉ်းက တစ်ခုတည်းပါ။ architecture ဆုံးဖြတ်ချက်ကို လိုအပ်တဲ့သူ ဘယ်သူမဆို
      ချနိုင်ပါတယ်။ ဒါပေမဲ့ မချခင်မှာ လူ
      နှစ်အုပ်စုဆီက အကြံကို အရင် တောင်းရပါမယ်။
      [[mark:r-aff]] ပထမ အုပ်စုက အဲဒီ ဆုံးဖြတ်ချက်ကြောင့် ထိခိုက်မယ့်သူ အားလုံးပါ။ code ကို လိုက်ပြင်ရမယ့်သူ၊
      အလုပ်လုပ်ပုံ ပြောင်းသွားမယ့်သူတွေပါ။
      [[mark:r-exp]] ဒုတိယ အုပ်စုက အဲဒီ အကြောင်းအရာကို ကျွမ်းကျင်တဲ့သူတွေပါ။ ဒီလို ကိစ္စမျိုးကို အရင်က
      ကြုံဖူးပြီး၊ ဘယ်နေရာမှာ အန္တရာယ် ရှိတတ်လဲ သိတဲ့သူတွေပါ။
      [[mark:r-example]] ခရီးဖော် မှာ ဒီနည်းကို Booking team တစ်ခုတည်းနဲ့ အရင် စမ်းကြည့်ပါတယ်။ Booking team lead
      မောင်မောင် တို့မှာ ဆုံးဖြတ်စရာ တစ်ခု ရှိနေပါတယ်။ လက်မှတ် တစ်စောင် ရောင်းပြီးတိုင်း Booking service က event
      တစ်ခု ထုတ်ပေးပါတယ်။ event ဆိုတာ ဖြစ်ပြီးသွားတဲ့ အကြောင်းအရာ တစ်ခုကို တခြား service တွေ သိအောင်
      ကြေညာတာပါ။
      [[mark:r-phone]] အဲဒီ event ထဲမှာ ခရီးသည်ရဲ့ ဖုန်းနံပါတ် ပါနေတော့၊ event ကို ဖတ်တဲ့ service တိုင်းရဲ့
      database ထဲမှာ ဖုန်းနံပါတ်တွေ မိတ္တူ ကျန်နေပါတယ်။ မောင်မောင် တို့က အဲဒါကို မကြိုက်လို့၊ event ထဲက
      ဖုန်းနံပါတ်ကို ဖြုတ်ချင်ပါတယ်။
      [[mark:r-who-aff]] ဒီ ဆုံးဖြတ်ချက်ကြောင့် ထိခိုက်မယ့်သူတွေက အဲဒီ event ကို ဖတ်နေတဲ့ team သုံးခုပါ။
      Notification၊ Settlement နဲ့ Operator team တို့ပါ။
      [[mark:r-who-exp]] ကျွမ်းကျင်သူတွေကတော့ event တွေ ဖြတ်သွားတဲ့ stream ကို ထိန်းတဲ့ platform team နဲ့
      architect တွေပါ။
      [[mark:r-why]] ထိခိုက်မယ့်သူတွေက ဆုံးဖြတ်သူ မမြင်နိုင်တဲ့ အရာကို မြင်တတ်ပါတယ်။ တစ်ခုခု ဆုံးရှုံးရမယ့်သူက
      အဲဒါကို အရင်ဆုံး သတိထားမိတတ်လို့ပါ။
      [[mark:r-adr]] အကြံတွေ ရပြီးရင် team က ကိုယ်တိုင် ဆုံးဖြတ်ပြီး၊ architecture decision record၊ အတိုကောက် ADR
      တစ်ခု ရေးပါတယ်။ ADR ဆိုတာ ဘာကို ဘာကြောင့် ဆုံးဖြတ်ခဲ့လဲ ရေးမှတ်ထားတဲ့ စာတိုလေးပါ။
      [[mark:r-small]] ဒီနည်းမှာ အကျိုးဆက် တစ်ခုလည်း ပါလာပါတယ်။ ဆုံးဖြတ်ချက် ကြီးလေ၊ မေးရမယ့်သူ များလေမို့၊ team တွေက ဆုံးဖြတ်ချက်ကို သေးသေး၊ တခြားသူကို ထိခိုက်မှု နည်းနည်း ဖြစ်အောင် ကိုယ်တိုင်
      ပုံဖော်လာတတ်ကြပါတယ်။
    sources:
      - {
          title: "Facilitating Software Architecture (Harmel-Law)",
          url: "https://oreil.ly/FacilitatingSoftwareArch",
        }
    actions:
      - {
          id: draw-r-open,
          type: whiteboard.apply,
          at: { mark: r-open },
          clear: true,
          upsertIds: [r-title],
        }
      - {
          id: draw-r-rule,
          type: whiteboard.apply,
          at: { mark: r-rule },
          upsertIds: [r-dec, r-dec-l],
          drawMs: 1200,
        }
      - {
          id: draw-r-aff,
          type: whiteboard.apply,
          at: { mark: r-aff },
          upsertIds: [r-aff, r-aff-h, r-arr1],
          drawMs: 1500,
        }
      - {
          id: draw-r-exp,
          type: whiteboard.apply,
          at: { mark: r-exp },
          upsertIds: [r-exp, r-exp-h, r-arr2],
          drawMs: 1500,
        }
      - {
          id: draw-r-example,
          type: whiteboard.apply,
          at: { mark: r-example },
          upsertIds: [r-dec-team],
          drawMs: 900,
        }
      - {
          id: draw-r-who-aff,
          type: whiteboard.apply,
          at: { mark: r-who-aff },
          upsertIds: [r-aff-l],
          drawMs: 1000,
        }
      - {
          id: draw-r-who-exp,
          type: whiteboard.apply,
          at: { mark: r-who-exp },
          upsertIds: [r-exp-l],
          drawMs: 1000,
        }
      - {
          id: draw-r-adr,
          type: whiteboard.apply,
          at: { mark: r-adr },
          upsertIds: [r-arr3, r-adr],
          drawMs: 1200,
        }
      - {
          id: point-r-dec,
          type: whiteboard.point,
          at: { mark: r-small },
          target: { assetId: r-dec },
        }

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ မောင်မောင် တို့ team က ကိုယ့်ဆီကလည်း အကြံ တောင်းပါတယ်။ ကိုယ်က
      ဖုန်းနံပါတ်ကို မဖြုတ်ဘဲ encrypt လုပ်ထားဖို့ အကြံပေးခဲ့ပါတယ်။ ဒါဆို key ကို Notification တစ်ခုတည်းကို
      ပေးရုံနဲ့ ကျန်တဲ့ team တွေ code ပြင်စရာ မလိုဘူးလို့ ကိုယ် တွက်ခဲ့လို့ပါ။
      [[mark:q-ctx]] team က ကိုယ့်အကြံကို သေချာ နားထောင်ပါတယ်။ ဒါပေမဲ့ ဖြုတ်မယ်လို့ပဲ ဆုံးဖြတ်ပြီး၊ ဘာကြောင့်လဲ
      ဆိုတာကို ADR ထဲမှာ ရေးထားပါတယ်။
      [[mark:q-a]] ဒါဆို process က ပျက်သွားပြီလား။ architect ရဲ့ အကြံကို လိုက်နာရမှာလား။
      [[mark:q-b]] ဒါမှမဟုတ် process က အလုပ်လုပ်နေတာလား။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ process က အလုပ်လုပ်နေတာပါ။ ဘာကြောင့်လဲဆိုတော့ အကြံဆိုတာ ခွင့်ပြုချက်
      မဟုတ်လို့ပါ။
      [[mark:q-r1]] အကြံကို မဖြစ်မနေ တောင်းရပါမယ်။ သေချာ နားထောင်ပြီး နားလည်အောင်လည်း လုပ်ရပါမယ်။ ဒါပေမဲ့
      လိုက်နာဖို့တော့ မလိုပါဘူး။ အကြံပေးသူရဲ့ ရာထူး ဘယ်လောက်ကြီးကြီး ဒီအတိုင်းပါပဲ။
      [[mark:q-r2]] အဲဒီအစား ဆုံးဖြတ်သူက တာဝန်ကို အပြည့်အဝ ယူရပါတယ်။ ရလဒ် ကောင်းကောင်း ဆိုးဆိုး ADR ပေါ်မှာ
      နာမည်ပါတဲ့ team ရဲ့ တာဝန်ပါ။ ရခဲ့တဲ့ အကြံတွေနဲ့၊ မလိုက်နာခဲ့ရင်
      ဘာကြောင့်လဲ ဆိုတာကို လူတိုင်း မြင်အောင် ရေးထားရတာမို့၊ ပေါ့ပေါ့ဆဆ ဆုံးဖြတ်ဖို့ ခက်သွားပါတယ်။
    sources:
      - {
          title: "Facilitating Software Architecture (Harmel-Law)",
          url: "https://oreil.ly/FacilitatingSoftwareArch",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          clear: true,
          upsertIds: [q-title],
          drawMs: 1200,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 1000 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 1000 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-q-r1,
          type: whiteboard.apply,
          at: { mark: q-r1 },
          upsertIds: [q-r1],
          drawMs: 1000,
        }
      - {
          id: draw-q-r2,
          type: whiteboard.apply,
          at: { mark: q-r2 },
          upsertIds: [q-r2],
          drawMs: 1000,
        }

  - id: adr
    chapter: အကြံတွေကို ADR ထဲ မှတ်ခြင်း
    narration: >
      [[mark:a-close]] မောင်မောင် တို့ team ရေးခဲ့တဲ့ ADR ကို ကြည့်ရအောင်။ ADR ပုံစံထဲမှာ
      အကြံတွေ မှတ်ဖို့ အပိုင်း တစ်ခု တိုးထားပါတယ်။
      [[mark:sel-options]] အပေါ်ပိုင်းမှာ ပြဿနာနဲ့ ရွေးစရာ သုံးခုကို ရေးထားပါတယ်။ team က ဒီအဆင့်မှာ မဆုံးဖြတ်သေးဘဲ အကြံ စတောင်းပါတယ်။
      [[mark:type-a1]] ပထမဆုံး မေးတာက Notification team ပါ။ သူတို့က လက်မှတ် ဝယ်ပြီးတဲ့ ခရီးသည်ဆီ SMS ပို့ဖို့
      အဲဒီ event ထဲက ဖုန်းနံပါတ်ကို သုံးနေတာပါ။ ဖြုတ်လိုက်ရင် SMS ပို့လို့ မရတော့ပါဘူး။ Booking team က ဒါကို
      မသိခဲ့ပါဘူး။ ဒါကြောင့် လက်မှတ် နံပါတ်နဲ့ ဖုန်းနံပါတ်ကို တောင်းလို့ရတဲ့ API တစ်ခု ထည့်ပေးဖို့
      ပြင်လိုက်ပါတယ်။ Settlement နဲ့ Operator team ကတော့ ဖုန်းနံပါတ်ကို မသုံးဘူးလို့ ဖြေပါတယ်။
      [[mark:type-a2]] ဒုတိယက platform team ပါ။ event ရဲ့ ပုံစံကို ပြောင်းတဲ့အခါ ဖတ်တဲ့ဘက်ကို အရင် ပြင်ပြီးမှ
      ရေးတဲ့ဘက်ကို ပြောင်းဖို့ သူတို့က အကြံပေးပါတယ်။ မဟုတ်ရင် ဖတ်တဲ့ service တွေက မရှိတော့တဲ့ ဖုန်းနံပါတ်ကို
      ရှာပြီး ပျက်နိုင်လို့ပါ။ ဒီအကြံကိုလည်း လက်ခံပြီး အလုပ်ကို နှစ်ဆင့် ခွဲလိုက်ပါတယ်။
      [[mark:type-a3]] တတိယကတော့ ကိုယ့်အကြံပါ။ မလိုက်နာခဲ့ဘူး ဆိုတာနဲ့အတူ အကြောင်းပြချက်ကိုပါ ရေးထားပါတယ်။
      encrypt လုပ်ထားလည်း ဖုန်းနံပါတ် မိတ္တူတွေက service သုံးခုလုံးရဲ့ database ထဲမှာ ဆက်ကျန်ပြီး၊
      key ကိုပါ ထပ်ထိန်းရမယ် ဆိုတာပါ။ ဖတ်ကြည့်တော့ သူတို့ မှန်တယ်လို့ ကိုယ်လည်း လက်ခံရပါတယ်။
      [[mark:advice-vs]] ဒီ အကြံတွေမှာ တူတာ တစ်ခုကို သတိထားကြည့်ပါ။ အကြံတိုင်းမှာ ဘာလုပ်သင့်လဲ ဆိုတာနဲ့အတူ
      ဘာကြောင့်လဲ ဆိုတာ ပါပါတယ်။ ဘာကြောင့်လဲ မပါရင် အဲဒါက အကြံ မဟုတ်သေးဘဲ ထင်မြင်ချက်ပဲ ရှိပါသေးတယ်။
      ရာထူးကြီးသူရဲ့ ထင်မြင်ချက်ကို အမိန့်လို့ ယူဆမိတတ်တာမို့၊ အဲဒီလို ကြားရရင် ဘာကြောင့်လဲလို့
      ပြန်မေးပါ။
      [[mark:type-dec]] အကြံတွေ စုံတော့ team က ဆုံးဖြတ်ပါတယ်။ ဖုန်းနံပါတ်ကို ဖြုတ်မယ်၊ လိုအပ်တဲ့ service က Booking
      ဆီကနေ တောင်းယူမယ် ဆိုတာပါ။
      [[mark:type-cons]] ရလဒ်ကိုလည်း ရတာရော၊ ပေးရတာရော ရေးပါတယ်။ ဖုန်းနံပါတ်က Booking တစ်နေရာတည်းမှာပဲ
      ရှိတော့မှာပါ။ အဲဒီအတွက် Notification က SMS တစ်စောင် ပို့တိုင်း Booking ကို တစ်ခါ ခေါ်ရပါမယ်။
      [[mark:type-status]] နောက်ဆုံးမှာ status ကို ပြောင်းပါတယ်။ အကြံ စတောင်းတဲ့နေ့ကနေ ဒီအထိ လေးရက်ပဲ
      ကြာပါတယ်။ ခြောက်ပတ် မဟုတ်တော့ပါဘူး။ ဆုံးဖြတ်သူရဲ့ နာမည်လည်း အဲဒီမှာ ပါပါတယ်။
    sources:
      - {
          title: "Facilitating Software Architecture (Harmel-Law)",
          url: "https://oreil.ly/FacilitatingSoftwareArch",
        }
    actions:
