        text: "\n## Consequences\n+ ဖုန်းနံပါတ်က Booking တစ်နေရာတည်းမှာပဲ ရှိမယ်\n− Notification က SMS တစ်စောင်တိုင်း Booking ကို ခေါ်ရမယ်\n"
