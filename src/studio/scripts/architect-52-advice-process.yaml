        at: { mark: sel-options }
        target:
          {
            file: notebook/52-adr-with-advice.md,
            text: "- ရွေးစရာ: ဖြုတ်မယ် / encrypt လုပ်မယ် / ဒီအတိုင်း ထားမယ်",
          }
      - id: type-a1
        type: editor.type
        at: { mark: type-a1 }
        cadence: line-by-line
        target: { file: notebook/52-adr-with-advice.md, after: "|---|---|---|\n" }
        text: "| Notification (ထိခိုက်) | SMS ပို့ဖို့ ဖုန်းနံပါတ် လိုတယ် | လက်မှတ် နံပါတ်နဲ့ တောင်းတဲ့ API ထည့်မယ် |\n| Settlement, Operator (ထိခိုက်) | ဖုန်းနံပါတ် မသုံးဘူး | ပြင်စရာ မရှိ |\n"
      - id: type-a2
        type: editor.type
        at: { mark: type-a2 }
        cadence: line-by-line
        target: { file: notebook/52-adr-with-advice.md, after: "| ပြင်စရာ မရှိ |\n" }
        text: "| Platform team (ကျွမ်းကျင်) | ဖတ်တဲ့ဘက် အရင်ပြင်၊ မဟုတ်ရင် ပျက်မယ် | အလုပ်ကို 2 ဆင့် ခွဲမယ် |\n"
      - id: type-a3
        type: editor.type
        at: { mark: type-a3 }
        cadence: line-by-line
        target: { file: notebook/52-adr-with-advice.md, after: "| အလုပ်ကို 2 ဆင့် ခွဲမယ် |\n" }
        text: "| Chief architect (ကျွမ်းကျင်) | encrypt လုပ်ပါ၊ Notification ပဲ ပြင်ရမယ် | မလိုက်နာ: မိတ္တူ 3 နေရာ ကျန်ဆဲ၊ key ပါ ထိန်းရ |\n"
      - id: expect-advice
        type: expect.file
        at: { afterAction: type-a3 }
        path: notebook/52-adr-with-advice.md
        contains: "| Chief architect (ကျွမ်းကျင်) | encrypt လုပ်ပါ၊ Notification ပဲ ပြင်ရမယ် | မလိုက်နာ: မိတ္တူ 3 နေရာ ကျန်ဆဲ၊ key ပါ ထိန်းရ |\n"
      - id: sel-reason
        type: editor.select
        at: { mark: advice-vs }
        target: { file: notebook/52-adr-with-advice.md, text: "အကြံနဲ့ အကြောင်းပြချက်" }
      - id: type-dec
