        </style>
        <div class="stage">
          <div class="title">Advice process ကို ထောက်ပေးတဲ့ အရာ သုံးခု</div>
          <div class="row" style="top: 34vh"><span class="num">1</span><span class="term blue">Advice forum</span>အပတ်စဉ် ဖွင့်ထားတဲ့ ဝိုင်း၊ ခွင့်ပြုတာ မလုပ်ဘူး</div>
          <div class="row" style="top: 50vh"><span class="num">2</span><span class="term orange">Architect</span>အဖြေပေးသူ မဟုတ်၊ စကားဝိုင်း ဖြစ်အောင် လုပ်ပေးသူ</div>
