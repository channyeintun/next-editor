  - id: supports
    chapter: Forum နဲ့ architect ရဲ့ အလုပ်သစ်
    narration: >
      [[mark:s-open]] ဒါဆို ကြာသပတေးနေ့ အစည်းအဝေးနဲ့ ကိုယ်တို့ architect လေးယောက်က ဘာလုပ်ကြတော့မလဲ။
      ပျောက်သွားတာ မဟုတ်ဘဲ၊ အလုပ် ပြောင်းသွားတာပါ။
      [[mark:s-forum]] စမ်းသပ်မှု အဆင်ပြေရင် ကြာသပတေးနေ့ အစည်းအဝေးက advice forum ဖြစ်လာပါမယ်။ ဘယ်သူမဆို တက်လို့ရတဲ့ အပတ်စဉ်
      ဝိုင်းပါ။ ဆုံးဖြတ်တော့မယ့် team တွေက ADR မူကြမ်းကို လာတင်ပြပြီး၊ ထိခိုက်မယ့်သူနဲ့
      ကျွမ်းကျင်သူတွေက အဲဒီမှာ တစ်ခါတည်း အကြံပေးကြပါတယ်။ ဒီဝိုင်းမှာ ဘယ်အရာကိုမှ ခွင့်ပြုတာ၊ ပယ်ချတာ
      မလုပ်ပါဘူး။
      [[mark:s-architect]] architect ရဲ့ အလုပ်ကလည်း ပြောင်းပါတယ်။ အရင်က ကိုယ်တို့က အဖြေကို ပေးရတဲ့သူတွေပါ။
      အခုတော့ လိုအပ်တဲ့ စကားဝိုင်းတွေ တကယ် ဖြစ်အောင် လုပ်ပေးရတဲ့သူတွေပါ။ ဘယ်သူ့ကို မေးသင့်လဲ ညွှန်ပေးတာ၊ အကြောင်းပြချက်ပါတဲ့ အကြံ ပေးတာ၊ ADR ရေးတတ်အောင် ကူပေးတာတွေပါ။
      [[mark:s-whole]] ပြီးတော့ team တစ်ခုတည်းက မမြင်နိုင်တဲ့ system တစ်ခုလုံးကို ကြည့်ပေးရပါတယ်။ team
      အများကြီးကို ဖြတ်တဲ့ ဆုံးဖြတ်ချက်တွေကိုတော့ ကိုယ်တို့ကိုယ်တိုင် အကြံတောင်းပြီး ချပါတယ်။
      [[mark:s-overrule]] အခက်ဆုံးကတော့ ကိုယ် မကြိုက်တဲ့ ဆုံးဖြတ်ချက်ကို ကြည့်နေရတာပါ။ ဒီတစ်ခါတည်း ဆိုပြီး
      ကိုယ်က ပြန်ပယ်လိုက်ရင်၊ team တွေက နောက်တစ်ခါ ကိုယ့်ခွင့်ပြုချက်ကိုပဲ ပြန်စောင့်လာတတ်ပါတယ်။
      [[mark:s-start]] ဒီ process က ယုံကြည်မှုပေါ်မှာ ရပ်တည်တာမို့၊ တစ်ရက်တည်းနဲ့ ကုမ္ပဏီ တစ်ခုလုံးကို
      ပြောင်းလို့ မရပါဘူး။ ခရီးဖော် မှာ Booking team တစ်ခုတည်းနဲ့ သုံးလ စမ်းတာလည်း ဒါကြောင့်ပါ။ သုံးလ ပြည့်ရင် ဘာအဆင်ပြေလဲ၊ ဘာမပြေလဲ
      အတူ ပြန်သုံးသပ်ပြီးမှ နောက် team တွေဆီ တိုးပါမယ်။

    sources:
      - {
          title: "Facilitating Software Architecture (Harmel-Law)",
          url: "https://oreil.ly/FacilitatingSoftwareArch",
        }
    actions:
      - {
          id: show-supports,
          type: slide.show,
          at: { mark: s-open, offsetMs: -1200 },
          slideId: supports,
        }
      - { id: point-forum, type: slide.point, at: { mark: s-forum }, target: { x: 0.15, y: 0.43 } }
      - {
          id: point-architect,
          type: slide.point,
          at: { mark: s-architect },
          target: { x: 0.15, y: 0.59 },
        }
      - { id: point-start, type: slide.point, at: { mark: s-start }, target: { x: 0.15, y: 0.75 } }

  - id: your-turn
    chapter: ကိုယ့် team အတွက်
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ ကိုယ့် team မှာ မကြာခင် ချရမယ့် ဆုံးဖြတ်ချက် တစ်ခုကို ရွေးပါ။ lesson ကို
      pause လုပ်ပြီး၊ ဒီ table ထဲမှာ အဲဒီ ဆုံးဖြတ်ချက်ကြောင့် ထိခိုက်မယ့်သူတွေနဲ့ အဲဒီ အကြောင်းအရာကို
      ကျွမ်းကျင်တဲ့သူတွေကို တစ်ယောက်ချင်း ရေးကြည့်ပါ။
      [[mark:turn-2]] စာရင်းက အရမ်း ရှည်နေရင် ဆုံးဖြတ်ချက်က ကြီးလွန်းနေတာမို့ ခွဲကြည့်ပါ။ ကိုယ်နဲ့
      သဘောမတူတတ်တဲ့သူ တစ်ယောက်လောက်ကိုလည်း စာရင်းထဲ ထည့်ပါ။
    sources:
      - {
          title: "Facilitating Software Architecture (Harmel-Law)",
          url: "https://oreil.ly/FacilitatingSoftwareArch",
        }
    actions:
      - { id: close-supports, type: slide.close, at: { mark: turn } }
      - id: sel-who
        type: editor.select
        at: { mark: turn, offsetMs: 2200 }
        target:
          {
            file: notebook/52-adr-with-advice.md,
            text: "| ဘယ်သူ့ကို မေးလဲ | အကြံနဲ့ အကြောင်းပြချက် | ဘာလုပ်လိုက်လဲ |",
          }

  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ လူ အနည်းငယ်က အားလုံးအတွက် ဆုံးဖြတ်ပေးရင် ဆုံးဖြတ်ချက်တွေက တန်းစီ စောင့်ရပါတယ်။
      [[mark:recap-rule]] advice process မှာတော့ ဘယ်သူမဆို ဆုံးဖြတ်နိုင်ပါတယ်။ ထိခိုက်မယ့်သူနဲ့ ကျွမ်းကျင်သူဆီက အကြံကို အရင်
      တောင်းရမယ်၊ ရတဲ့ အကြံကို ADR ထဲ ရေးရမယ်၊ ရလဒ်အတွက် ကိုယ်တိုင် တာဝန်ယူရမယ် ဆိုတာပါပဲ။
      [[mark:recap-2]] architect ကတော့ ဆုံးဖြတ်ပေးသူကနေ၊ မှန်တဲ့ စကားဝိုင်းတွေ ဖြစ်အောင် လုပ်ပေးပြီး system
      တစ်ခုလုံးကို ကြည့်ပေးသူ ဖြစ်သွားပါတယ်။
      [[mark:next]] ဒါပေမဲ့ team ၁၂ ခုက ကိုယ့်ဘာသာ ဆုံးဖြတ်ကြတဲ့အခါ ကုမ္ပဏီ တစ်ခုလုံး ဘယ်လို တစ်သားတည်း
      ရှိနေမလဲ။ နောက် lesson မှာတော့ အဲဒီအတွက် သုံးတဲ့ principle နဲ့ technology radar ကို လေ့လာသွားပါမယ်။
    sources:
