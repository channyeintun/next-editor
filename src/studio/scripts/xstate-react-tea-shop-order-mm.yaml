      index.html: |
        <!doctype html>
        <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <meta name="theme-color" content="#07111f" />
            <title>Tea Shop Order</title>
          </head>
          <body>
            <div id="root"></div>
            <script type="module" src="/src/main.tsx"></script>
          </body>
        </html>
      src/main.tsx: |
        import React from "react";
        import { createRoot } from "react-dom/client";
        import { assign, fromPromise, setup } from "xstate";
        import { useMachine } from "@xstate/react";
        import {
          createStore,
          useSelector as useStoreSelector,
        } from "@xstate/store-react";
        import "./styles.css";

        type OrderEvent =
          | { type: "START_PREPARING" }
          | { type: "PACK_ORDER" }
          | { type: "CHECK_ITEM" }
          | { type: "REMAKE" }
          | { type: "SERVE" };

        // MACHINE_IMPLEMENTATION

        const orderNotesStore = createStore({
          context: {
            draft: "",
            notes: ["Tea and snack order received."] as string[],
          },
          on: {
            // STORE_TRANSITIONS
          },
        });

        const stateLabels: Record<string, string> = {
          received: "Received",
          preparing: "Preparing",
          packing: "Packing",
          ready: "Ready",
          served: "Served",
        };

        const workflow = [
          "received",
          "preparing",
          "packing",
          "ready",
          "served",
        ];

        function TeaOrderApp() {
          // REACT_BINDINGS

          const state = String(snapshot.value);
          const checkedItems = snapshot.context.checkedItems;

          return (
            <main className="shell">
              <header className="hero">
                <div>
                  <p className="eyebrow">TABLE 4 · TEA + SNACK</p>
                  <h1>Tea Shop Order</h1>
                  <p className="subtitle">
                    A familiar order workflow with separate counter notes.
                  </p>
                </div>
                <output
                  className={`status status-${state}`}
                  data-testid="order-state"
                  data-state={state}
                >
                  {stateLabels[state]}
                </output>
              </header>

              <section className="workflow" aria-label="Order workflow">
                {workflow.map((step, index) => (
                  <React.Fragment key={step}>
                    <div
                      className="state-card"
                      data-active={state === step}
                      data-complete={workflow.indexOf(state) > index}
                    >
                      <span>{String(index + 1).padStart(2, "0")}</span>
                      <strong>{stateLabels[step]}</strong>
                    </div>
                    {index < workflow.length - 1 && <span className="connector">→</span>}
                  </React.Fragment>
                ))}
              </section>

              <div className="grid">
                <section className="panel">
                  <div className="panel-heading">
                    <div>
                      <p className="kicker">STATE MACHINE</p>
                      <h2>Workflow controls</h2>
                    </div>
                    <span className="actor-chip">Actor running</span>
                  </div>

                  <div className="actions">
                    <button
                      data-testid="start-button"
                      disabled={!snapshot.can({ type: "START_PREPARING" })}
                      onClick={() => send({ type: "START_PREPARING" })}
                    >
                      Start preparing
                    </button>
                    <button
                      data-testid="pack-button"
                      disabled={!snapshot.can({ type: "PACK_ORDER" })}
                      onClick={() => send({ type: "PACK_ORDER" })}
                    >
                      Pack order
                    </button>
                    <button
                      data-testid="check-button"
                      disabled={!snapshot.can({ type: "CHECK_ITEM" })}
                      onClick={() => send({ type: "CHECK_ITEM" })}
                    >
                      Check next item
                    </button>
                    <button
                      data-testid="remake-button"
                      disabled={!snapshot.can({ type: "REMAKE" })}
                      onClick={() => send({ type: "REMAKE" })}
                    >
                      Make again
                    </button>
                    <button
                      className="serve"
                      data-testid="serve-button"
                      aria-disabled={!snapshot.can({ type: "SERVE" })}
                      disabled={!snapshot.can({ type: "SERVE" })}
                      onClick={() => send({ type: "SERVE" })}
                    >
                      Serve order
                    </button>
                  </div>

                  <div className="guard-card">
                    <div>
                      <span className="guard-label">GUARD</span>
                      <strong>checkedItems ≥ 2</strong>
                    </div>
                    <div className="item-checks">
                      <output data-testid="packing-ticket">
                        {snapshot.context.packingTicket ?? "No packing ticket yet"}
                      </output>
                      <output data-testid="check-count">{checkedItems} / 2 items checked</output>
                    </div>
                  </div>
                </section>

                <section className="panel">
                  <div className="panel-heading">
                    <div>
                      <p className="kicker store">XSTATE STORE</p>
                      <h2>Counter notes</h2>
                    </div>
                    <span className="store-chip">{notes.length} notes</span>
                  </div>

                  <label htmlFor="order-note">Counter note</label>
                  <div className="note-composer">
                    <input
                      id="order-note"
                      data-testid="note-input"
                      value={draft}
                      onChange={(event) =>
                        orderNotesStore.trigger.changeDraft({ value: event.target.value })
                      }
                      placeholder="Add a short note"
                    />
                    <button
                      data-testid="add-note-button"
                      disabled={!draft.trim()}
                      onClick={() => orderNotesStore.trigger.addNote()}
                    >
                      Add note
                    </button>
                  </div>

                  <ul className="note-list" data-testid="note-list">
                    {notes.map((note, index) => (
                      <li key={`${note}-${index}`}>
                        <span>{String(index + 1).padStart(2, "0")}</span>
                        {note}
                      </li>
                    ))}
                  </ul>
                </section>
              </div>
            </main>
          );
        }

        const root = document.getElementById("root");

        if (!root) {
          throw new Error("Missing React root");
        }

        createRoot(root).render(
          <React.StrictMode>
            <TeaOrderApp />
          </React.StrictMode>,
        );
      src/styles.css: |
        :root {
          font-family:
            Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
            "Segoe UI", sans-serif;
          color: #e8f0ff;
          background: #07111f;
          font-synthesis: none;
        }

        * {
          box-sizing: border-box;
        }

        body {
          margin: 0;
          min-width: 320px;
          min-height: 100vh;
          background:
            radial-gradient(circle at 15% 10%, rgba(124, 58, 237, 0.24), transparent 28rem),
            radial-gradient(circle at 85% 20%, rgba(14, 165, 233, 0.18), transparent 26rem),
            #07111f;
        }

        button,
        input {
          font: inherit;
        }

        button {
          border: 1px solid #334766;
          border-radius: 12px;
          padding: 0.72rem 0.9rem;
          color: #dce8fb;
          background: #14243a;
          cursor: pointer;
          transition:
            transform 150ms ease,
            border-color 150ms ease,
            background 150ms ease;
        }

        button:hover:not(:disabled) {
          transform: translateY(-1px);
          border-color: #60a5fa;
          background: #1b3150;
        }

        button:disabled {
          cursor: not-allowed;
          opacity: 0.34;
        }

        .shell {
          width: min(1120px, calc(100% - 2rem));
          margin: 0 auto;
          padding: 2.5rem 0 3rem;
        }

        .hero {
          display: flex;
          align-items: flex-start;
          justify-content: space-between;
          gap: 2rem;
          margin-bottom: 1.6rem;
        }

        .eyebrow,
        .kicker {
          margin: 0 0 0.45rem;
          color: #a78bfa;
          font-size: 0.74rem;
          font-weight: 800;
          letter-spacing: 0.16em;
        }

        h1,
        h2,
        p {
          margin-top: 0;
        }

        h1 {
          margin-bottom: 0.45rem;
          font-size: clamp(2rem, 5vw, 3.4rem);
          line-height: 1;
          letter-spacing: -0.05em;
        }

        h2 {
          margin-bottom: 0;
          font-size: 1.25rem;
        }

        .subtitle {
          margin-bottom: 0;
          color: #8fa5c4;
        }

        .status {
          border: 1px solid;
          border-radius: 999px;
          padding: 0.65rem 1rem;
          font-weight: 800;
          box-shadow: 0 0 30px rgba(96, 165, 250, 0.12);
        }

        .status-received {
          color: #fda4af;
          border-color: #be123c;
          background: rgba(190, 18, 60, 0.16);
        }

        .status-preparing {
          color: #d8b4fe;
          border-color: #7e22ce;
          background: rgba(126, 34, 206, 0.16);
        }

        .status-packing {
          color: #fde68a;
          border-color: #b45309;
          background: rgba(180, 83, 9, 0.16);
        }

        .status-ready {
          color: #7dd3fc;
          border-color: #0369a1;
          background: rgba(3, 105, 161, 0.16);
        }

        .status-served {
          color: #86efac;
          border-color: #15803d;
          background: rgba(21, 128, 61, 0.16);
        }

        .workflow {
          display: flex;
          align-items: center;
          gap: 0.5rem;
          margin-bottom: 1.25rem;
        }

        .state-card {
          display: flex;
          flex: 1;
          align-items: center;
          gap: 0.6rem;
          min-height: 64px;
          border: 1px solid #253a58;
          border-radius: 14px;
          padding: 0.8rem;
          color: #7f94b2;
          background: rgba(13, 29, 49, 0.82);
        }

        .state-card span {
          color: #536b8e;
          font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
          font-size: 0.75rem;
        }

        .state-card[data-active="true"] {
          color: #f8fbff;
          border-color: #60a5fa;
          background: linear-gradient(135deg, rgba(37, 99, 235, 0.25), rgba(124, 58, 237, 0.2));
          box-shadow: 0 0 24px rgba(96, 165, 250, 0.16);
        }

        .state-card[data-complete="true"] {
          color: #86efac;
          border-color: #166534;
        }

        .connector {
          color: #4d668a;
          font-size: 1.25rem;
        }

        .grid {
          display: grid;
          grid-template-columns: 1.08fr 0.92fr;
          gap: 1.25rem;
        }

        .panel {
          border: 1px solid #213755;
          border-radius: 20px;
          padding: 1.25rem;
          background: rgba(10, 24, 42, 0.9);
          box-shadow: 0 22px 70px rgba(0, 0, 0, 0.24);
        }

        .panel-heading {
          display: flex;
          align-items: flex-start;
          justify-content: space-between;
          gap: 1rem;
          margin-bottom: 1.25rem;
        }

        .kicker.store {
          color: #22d3ee;
        }

        .actor-chip,
        .store-chip {
          border-radius: 999px;
          padding: 0.4rem 0.65rem;
          font-size: 0.72rem;
          font-weight: 800;
        }

        .actor-chip {
          color: #c4b5fd;
          background: rgba(124, 58, 237, 0.22);
        }

        .store-chip {
          color: #67e8f9;
          background: rgba(8, 145, 178, 0.2);
        }

        .actions {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 0.7rem;
        }

        .actions .serve {
          color: #bbf7d0;
          border-color: #166534;
          background: rgba(21, 128, 61, 0.18);
        }

        .guard-card {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 1rem;
          margin-top: 1rem;
          border: 1px solid #92400e;
          border-radius: 14px;
          padding: 0.9rem;
          background: rgba(146, 64, 14, 0.13);
        }

        .guard-card strong {
          display: block;
          margin-top: 0.25rem;
        }

        .guard-label {
          color: #fbbf24;
          font-size: 0.7rem;
          font-weight: 900;
          letter-spacing: 0.14em;
        }

        .guard-card output {
          color: #fcd34d;
          font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
          font-size: 0.8rem;
        }

        .item-checks {
          display: grid;
          gap: 0.3rem;
          text-align: right;
        }

        label {
          display: block;
          margin-bottom: 0.45rem;
          color: #9fb1ca;
          font-size: 0.8rem;
          font-weight: 700;
        }

        .note-composer {
          display: grid;
          grid-template-columns: 1fr auto;
          gap: 0.6rem;
        }

        input {
          min-width: 0;
          border: 1px solid #2c4364;
          border-radius: 12px;
          padding: 0.72rem 0.85rem;
          color: #eff6ff;
          outline: none;
          background: #0b1a2d;
        }

        input:focus {
          border-color: #22d3ee;
          box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.1);
        }

        .note-list {
          display: grid;
          gap: 0.6rem;
          max-height: 220px;
          margin: 1rem 0 0;
          padding: 0;
          overflow: auto;
          list-style: none;
        }

        .note-list li {
          display: flex;
          gap: 0.7rem;
          border-left: 2px solid #0891b2;
          border-radius: 0 10px 10px 0;
          padding: 0.7rem;
          color: #cbd8ea;
          background: rgba(8, 145, 178, 0.08);
        }

        .note-list span {
          color: #22d3ee;
          font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
          font-size: 0.72rem;
        }

        @media (max-width: 820px) {
          .hero {
            align-items: stretch;
            flex-direction: column;
          }

          .status {
            align-self: flex-start;
          }

          .workflow {
            align-items: stretch;
            flex-direction: column;
          }

          .connector {
            display: none;
          }

          .grid {
            grid-template-columns: 1fr;
          }
        }
