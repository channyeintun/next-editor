build:
  # Studio replaces this built-in profile with the selected Burmese VoxCPM2
  # profile at render time when the signed-in user has the D1 capability.
  voiceProfile: pocket-alba-v1
  seed: 83

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install --frozen-lockfile
  runCommand: pnpm dev
  expectedPort: 5173
  lockfilePath: pnpm-lock.yaml
  environment: {}

scenes:
  - id: why-explicit-state
    narration: >
      Code ကို ခဏဘေးထားပြီး ဆိုင်က အော်ဒါနံပါတ် ၂၄ ကို ကြည့်ရအောင်။
      လက်ဖက်ရည်တစ်ခွက်၊ ပလာတာတစ်ပွဲ မှာထားတယ်။ ဝန်ထမ်းအသစ်က
      ဒီအော်ဒါ အခုဘယ်ရောက်နေလဲလို့ မေးတယ်ဆိုပါစို့။
      [[mark:open-why-board]] Received လည်းဟုတ်၊ Preparing လည်းဟုတ်၊
      Ready လည်းဟုတ်ဆိုရင် ဘာဆက်လုပ်ရမလဲ ဝေခွဲမရတော့ဘူး။
      [[mark:show-conflicting-statuses]] တံဆိပ်သုံးခု တစ်ပြိုင်နက်မှန်နေတာ
      ဆိုင်မှာ မဖြစ်သင့်ဘူး။ [[mark:show-current-stage]] အော်ဒါကတ်ပေါ်မှာ
      Ready တစ်ခုပဲထားလိုက်တော့ ရှင်းသွားပြီ။ အခု Ready ရောက်နေတယ်။
      နောက်တစ်ဆင့်က ပစ္စည်းနှစ်ခုစစ်ပြီး တည်ခင်းဖို့။ အော်ဒါရဲ့ လက်ရှိအဆင့် —
      ဒါက State ပဲ။ [[mark:show-next-action]] State ဆိုတာ နာမည်တစ်ခုသက်သက်
      မဟုတ်ဘူး။ ဒီအချိန် ဘာဆက်လုပ်လို့ရလဲပါ ပြောပေးတယ်။ ဒါဆို
      အော်ဒါသွားမယ့်လမ်းကို ဆက်ဆွဲကြည့်ရအောင်။
    sources:
      - title: "Stately Docs — State machines"
        url: "https://stately.ai/docs/machines"
      - title: "Stately Docs — Finite states"
        url: "https://stately.ai/docs/finite-states"
      - title: "Stately Docs — Events and transitions"
        url: "https://stately.ai/docs/transitions"
    actions:
      - id: open-why-state-board
        type: whiteboard.apply
        at: { mark: open-why-board, offsetMs: -450 }
        open: true
        maximized: true
        clear: true
        upsertIds: []
      - id: draw-why-state-contrast
        type: whiteboard.apply
        at: { mark: open-why-board }
        upsertIds:
          [why-title, conflicting-status-box, conflicting-status-heading, conflicting-status-body]
        drawMs: 1500
      - id: circle-conflicting-statuses
        type: whiteboard.apply
        at: { mark: show-conflicting-statuses }
        upsertIds: [conflicting-status-circle]
        drawMs: 800
      - id: show-one-current-stage
        type: whiteboard.apply
        at: { mark: show-current-stage }
        upsertIds:
          [
            clarify-status-arrow,
            current-status-box,
            current-status-heading,
            current-status-body,
            one-stage-rule,
          ]
        drawMs: 1500
      - id: show-state-next-action
        type: whiteboard.apply
        at: { mark: show-next-action }
        upsertIds: [next-action-box, next-action-label]
        drawMs: 900

  - id: finite-automaton-order
    narration: >
      [[mark:open-domain-board]] အော်ဒါနံပါတ် ၂၄ သွားမယ့်လမ်းကို
      ဆွဲကြည့်ရအောင်။ [[mark:draw-received-state]] ကောင်တာက လက်ခံတာနဲ့
      Received မှာ စမယ်။ [[mark:draw-preparing-state]] စပြင်လိုက်ရင်
      Preparing။ [[mark:draw-packing-state]] လက်ဖက်ရည်နဲ့ ပလာတာ
      ပြီးပြီဆို Packing။ ဒီမှာ ပစ္စည်းထုပ်ပြီး အော်ဒါလက်မှတ် ထုတ်နေမယ်။
      [[mark:draw-ready-state]] လက်မှတ်ရပြီဆို Ready။
      [[mark:draw-served-state]] နှစ်မျိုးလုံးစစ်ပြီးမှ Served။
      မြှားပေါ်က စပြင်၊ ထုပ်ပိုး၊ တည်ခင်းဆိုတာတွေက Event တွေ။
      ဒီမှာ သတိထားကြည့်။ ပုံထဲမှာရှိတဲ့လမ်းပဲ သွားလို့ရတယ်။
      Received ကနေ Ready ကို တန်းခုန်လို့မရဘူး။ ဒီလို အဆင့်တွေ၊
      Event တွေ၊ သွားလို့ရတဲ့လမ်းတွေကို စုထားတဲ့ပုံက State Machine ပဲ။
    sources:
      - title: "NIST Dictionary — Finite state machine"
        url: "https://xlinux.nist.gov/dads/HTML/finiteStateMachine.html"
      - title: "Stately Docs — Finite states"
        url: "https://stately.ai/docs/finite-states"
      - title: "Stately Docs — State machines"
        url: "https://stately.ai/docs/machines"
      - title: "Stately Docs — Events and transitions"
        url: "https://stately.ai/docs/transitions"
      - title: "Stately Docs — Final states"
        url: "https://stately.ai/docs/final-states"
    actions:
      - id: open-order-domain-board
        type: whiteboard.apply
        at: { mark: open-domain-board }
        open: true
        maximized: true
        clear: true
        upsertIds: [domain-title, domain-subtitle]
        drawMs: 700
      - id: draw-received-order-state
        type: whiteboard.apply
        at: { mark: draw-received-state }
        upsertIds: [received-box, received-label, received-note]
        drawMs: 650
      - id: draw-preparing-order-state
        type: whiteboard.apply
        at: { mark: draw-preparing-state }
        upsertIds: [arrow-one, event-one, preparing-box, preparing-label, preparing-note]
        drawMs: 950
      - id: draw-packing-order-state
        type: whiteboard.apply
        at: { mark: draw-packing-state }
        upsertIds: [arrow-two, event-two, packing-box, packing-label, packing-note]
        drawMs: 950
      - id: draw-ready-order-state
        type: whiteboard.apply
        at: { mark: draw-ready-state }
        upsertIds: [arrow-on-done, event-on-done, ready-box, ready-label, ready-note]
        drawMs: 950
      - id: draw-served-order-state
        type: whiteboard.apply
        at: { mark: draw-served-state }
        upsertIds: [arrow-three, event-three, served-box, served-label, served-note]
        drawMs: 950

  - id: context-actions-guards
    narration: >
      လမ်းပုံထဲမှာ အသေးစိတ်တစ်ခု ကျန်သေးတယ်။ Ready ရောက်ရင်
      လက်ဖက်ရည်နဲ့ ပလာတာ နှစ်ခုလုံး စစ်ရမယ်။
      [[mark:draw-domain-context]] အော်ဒါကတ်အောက်မှာ အမှန်ခြစ်နှစ်ခု
      ထည့်မယ်။ တစ်ခုစစ်ပြီးလည်း Ready မှာပဲ။ နေရာမရွှေ့ဘူး။
      ကတ်ပေါ်ကမှတ်တမ်းပဲ ပြောင်းတယ်။ ဒီလို အဆင့်နဲ့အတူသယ်သွားတဲ့
      data က Context။ ကတ်ကိုပြောင်းပေးတဲ့အလုပ်က Action။
      [[mark:draw-domain-guard]] Ready ရဲ့ထွက်ပေါက်မှာ စစ်ဆေးရေးဂိတ်
      ထားမယ်။ နှစ်ခုလုံးမစစ်ရသေးရင် တည်ခင်းခိုင်းလည်း ဂိတ်မဖွင့်ဘူး။
      သွားခွင့်ရှိမရှိ စစ်ပေးတာ Guard။ [[mark:emphasize-domain-rule]]
      တစ်ခုမှားရင် Preparing ပြန်ပြီး အမှန်ခြစ်တွေကို သုညကနေပြန်စမယ်။
      UI မှာ တည်ခင်းခလုတ်ကို ပိတ်ပြထားလို့ရတယ်။ ဒါပေမဲ့ အော်ဒါကို
      တကယ်တားထားတာ ဒီ Guard ပဲ။
    sources:
      - title: "Stately Docs — Context"
        url: "https://stately.ai/docs/context"
      - title: "Stately Docs — Actions"
        url: "https://stately.ai/docs/actions"
      - title: "Stately Docs — Guards"
        url: "https://stately.ai/docs/guards"
      - title: "Stately Docs — Eventless and targetless transitions"
        url: "https://stately.ai/docs/transitions"
    actions:
      - id: draw-order-context
        type: whiteboard.apply
        at: { mark: draw-domain-context }
        upsertIds: [context-box, context-label, context-action]
        drawMs: 900
      - id: draw-order-guard
        type: whiteboard.apply
        at: { mark: draw-domain-guard }
        upsertIds: [guard-box, guard-label, guard-rule]
        drawMs: 900
      - id: emphasize-domain-invariant
        type: whiteboard.apply
        at: { mark: emphasize-domain-rule }
        upsertIds: [domain-rule]
        drawMs: 700

  - id: actor-react-model
    narration: >
      ပုံဆွဲထားရုံနဲ့ အော်ဒါက သူ့ဘာသာ ရွှေ့မသွားဘူး။
      [[mark:draw-machine-logic]] ဒီစည်းမျဉ်းစာရွက်က ဘယ်အဆင့်ကနေ
      ဘယ်အဆင့်ကို သွားလို့ရလဲ ပြောပေးရုံ။ [[mark:draw-running-actor]]
      အော်ဒါနံပါတ် ၂၄ ကို စဖွင့်လိုက်မှ လက်ရှိအဆင့်နဲ့ အော်ဒါကတ်ကို
      ကိုင်ထားတဲ့ Actor တစ်ခု အလုပ်လုပ်လာမယ်။ အော်ဒါနံပါတ် ၂၅ လည်း
      စည်းမျဉ်းတူတူ သုံးတယ်။ ဒါပေမဲ့ သူ့ Actor၊ သူ့အဆင့်နဲ့သူ။
      [[mark:draw-react-loop]] ကောင်တာမျက်နှာပြင်က Actor ဆီက
      အခြေအနေကိုယူပြတယ်။ ခလုတ်နှိပ်ရင် Event ပြန်ပို့တယ်။ Actor က
      စည်းမျဉ်းစစ်ပြီး အခြေအနေအသစ် ပြန်ပေးတယ်။ React က နောက်အဆင့်ကို
      မရွေးဘူး။ သူက အခြေအနေပြမယ်၊ တောင်းဆိုမှု ပို့မယ်။ ဆုံးဖြတ်တာ Actor။
      အဓိကက ဒီတာဝန်ခွဲပုံပဲ။
    sources:
      - title: "Stately Docs — Actors"
        url: "https://stately.ai/docs/actors"
      - title: "Stately Docs — State machine snapshots"
        url: "https://stately.ai/docs/states"
      - title: "Stately Docs — @xstate/react"
        url: "https://stately.ai/docs/xstate-react"
    actions:
      - id: draw-machine-logic
        type: whiteboard.apply
        at: { mark: draw-machine-logic }
        clear: true
        upsertIds: [actor-title, logic-box, logic-heading, logic-body]
        drawMs: 1200
      - id: draw-running-actor
        type: whiteboard.apply
        at: { mark: draw-running-actor }
        upsertIds: [actor-create-arrow, actor-create-label, actor-box, actor-heading, actor-body]
        drawMs: 1500
      - id: draw-react-event-loop
        type: whiteboard.apply
        at: { mark: draw-react-loop }
        timeoutMs: 5000
        upsertIds:
          [
            snapshot-arrow,
            snapshot-label,
            event-label,
            react-box,
            react-heading,
            react-body,
            selector-box,
            selector-label,
          ]
        drawMs: 2400

  - id: invoked-actor-lifecycle
    narration: >
      ထုပ်ပိုးပြီး လက်မှတ်ထုတ်တာ နည်းနည်းအချိန်ယူမယ်။
      [[mark:draw-invoked-parent]] အော်ဒါ Actor က Packing ဝင်တာနဲ့
      ဒီအလုပ်စမယ်။ စောင့်နေရတဲ့အချိန်ကို Packing အဆင့်က ပြထားပြီးသား။
      [[mark:draw-invoked-child]] ထုပ်ပိုးအလုပ်ကို သီးခြား Actor ဆီ
      အပ်မယ်။ လက်မှတ်ရရင် Ready။ အဆင်မပြေရင် Preparing ပြန်ပြီး
      ပြင်မယ်။ အောင်မြင်တဲ့လမ်းရော ပြန်လုပ်ရမယ့်လမ်းရော ပုံထဲမှာ
      တန်းမြင်ရတယ်။ [[mark:draw-invoke-rule]] ဒီအလုပ်ကို Packing အဆင့်က
      ပိုင်တယ်။ Packing က ထွက်သွားရင် မပြီးသေးတဲ့အလုပ်ကို ရပ်မယ်။
      အချိန်ယူတဲ့အလုပ်ကို ဘယ်အချိန်စ၊ ဘယ်အချိန်ရပ်ဆိုတာ workflow နဲ့အတူ
      ထိန်းထားတာ။
    sources:
      - title: "Stately Docs — Invoking actors"
        url: "https://stately.ai/docs/invoke"
      - title: "Stately Docs — Promise actors"
        url: "https://stately.ai/docs/promise-actors"
      - title: "Stately Docs — Actors"
        url: "https://stately.ai/docs/actors"
    actions:
      - id: draw-invoked-parent-actor
        type: whiteboard.apply
        at: { mark: draw-invoked-parent }
        clear: true
        upsertIds: [invoke-title, parent-actor-box, parent-actor-label, parent-state-label]
        drawMs: 1200
      - id: draw-invoked-promise-actor
        type: whiteboard.apply
        at: { mark: draw-invoked-child }
        timeoutMs: 5000
        upsertIds:
          [
            invoke-child-arrow,
            invoke-child-label,
            promise-actor-box,
            promise-actor-label,
            promise-actor-body,
            done-arrow,
            error-arrow,
            done-state,
            error-state,
          ]
        drawMs: 2400
      - id: draw-invoked-lifecycle-rule
        type: whiteboard.apply
        at: { mark: draw-invoke-rule }
        upsertIds: [invoke-rule-box, invoke-rule]
        drawMs: 900

  - id: machine-versus-store
    narration: >
      မျက်နှာပြင်တစ်ခုတည်းမှာရှိပေမဲ့ အော်ဒါအဆင့်နဲ့ Counter notes က
      ပြဿနာချင်းမတူဘူး။ ဘယ်မှာထားမလဲ မဆုံးဖြတ်ခင် ဒီလိုမေးကြည့်။
      ဒီ data မှာ သွားရမယ့်အစဉ်၊ မသွားရမယ့်လမ်း ရှိလား။
      [[mark:draw-machine-card]] အော်ဒါမှာရှိတယ်။ Preparing မဖြတ်ဘဲ
      Ready မရောက်ရဘူး။ နှစ်ခုလုံးမစစ်ဘဲ Served မရောက်ရဘူး။
      ဒါကြောင့် workflow ကို Machine က ထိန်းမယ်။
      [[mark:draw-store-card]] Counter note ကတော့ စာရေး၊ စာပြင်၊
      စာရင်းထဲထည့်တာပဲ။ သွားရမယ့် State လမ်းကြောင်းမရှိဘူး။
      ဒီလို UI data ကို Store က ထိန်းမယ်။ [[mark:draw-shared-rule]]
      Machine က အော်ဒါဘယ်အဆင့်လဲ ဆုံးဖြတ်တယ်။ Store က ဝန်ထမ်းမှတ်စုကို
      သိမ်းတယ်။ ပိုင်ရှင်နှစ်ခုခွဲထားတော့ note ထည့်လည်း အော်ဒါအဆင့်
      မပြောင်းဘူး။ ဒါဆို ဒီပုံတွေကို Editor ထဲက code နဲ့ ချိတ်ကြည့်ရအောင်။
    sources:
      - title: "Stately Docs — XState Store"
        url: "https://stately.ai/docs/xstate-store"
      - title: "Stately Docs — @xstate/store-react"
        url: "https://stately.ai/docs/xstate-store/react"
    actions:
      - id: draw-machine-responsibility
        type: whiteboard.apply
        at: { mark: draw-machine-card }
        clear: true
        upsertIds: [compare-title, machine-card, machine-package, machine-purpose, machine-example]
        drawMs: 1500
      - id: draw-store-responsibility
        type: whiteboard.apply
        at: { mark: draw-store-card }
        upsertIds: [store-card, store-package, store-purpose, store-example]
        drawMs: 1500
      - id: draw-responsibility-rule
        type: whiteboard.apply
        at: { mark: draw-shared-rule }
        upsertIds: [shared-rule-box, shared-rule]
        drawMs: 900

  - id: implement-machine
    narration: >
      Whiteboard ပေါ်ကပုံကို အခု [[mark:close-concept-board]] Editor ထဲက
      code နဲ့ ချိတ်ကြည့်မယ်။ [[mark:open-main-file]] main.tsx မှာ လိုတဲ့
      package တွေ ထည့်ထားပြီးသား။ Import တစ်ကြောင်းချင်း မဖတ်တော့ဘူး။
      ပုံရဲ့ ဘယ်အစိတ်အပိုင်းက code ဘယ်နေရာဖြစ်လာလဲပဲ ကြည့်ရအောင်။
      [[mark:select-event-union]] မြှားပေါ်က စပြင်၊ ထုပ်ပိုး၊ စစ်ဆေး၊
      ပြန်ပြင်နဲ့ တည်ခင်းဆိုတဲ့ ဖြစ်ရပ်တွေ OrderEvent ထဲ ဝင်လာတယ်။
      ဒီစာရင်းထဲမပါတဲ့ Event ပို့မိရင် TypeScript က ကြိုပြောပေးမယ်။
      [[mark:type-machine]] Machine တစ်ခုလုံး ထည့်လိုက်မယ်။ အပေါ်ပိုင်းမှာ
      ထုပ်ပိုးအလုပ်၊ စစ်ဆေးရေးဂိတ်နဲ့ အော်ဒါကတ်ပြောင်းပုံ ရှိတယ်။
      အောက်က states ကတော့ Whiteboard ပေါ်က အကွက်ငါးခုနဲ့ မြှားတွေပါပဲ။
      [[mark:select-initial-state]] Received က စမှတ်၊ Served က အဆုံးမှတ်။
      အော်ဒါအသစ်တိုင်း checkedItems သုည၊ packingTicket မရှိသေးတဲ့
      Context နဲ့ စမယ်။ State တစ်ခုမှာ Event အတွက် လမ်းမရှိရင်
      အော်ဒါက မရွှေ့ဘူး။ နောက်မှာ Packing အလုပ်နဲ့ စစ်ဆေးရေးဂိတ်ကို
      တစ်ခုချင်း ချဲ့ကြည့်မယ်။
    sources:
      - title: "Stately Docs — Setup"
        url: "https://stately.ai/docs/setup"
      - title: "Stately Docs — Actions"
        url: "https://stately.ai/docs/actions"
      - title: "Stately Docs — Guards"
        url: "https://stately.ai/docs/guards"
    actions:
      - id: close-concepts-whiteboard
        type: whiteboard.apply
        at: { mark: close-concept-board }
        open: false
      # The board comes down and the editor becomes the stage for the rest of
      # the lesson, so the runner dock stops earning its space here. It starts
      # expanded and nothing re-opens it, so this one action covers every
      # explanation that follows.
      - id: collapse-runner-dock
        type: runtime.collapseDock
        at: { afterAction: close-concepts-whiteboard }
      - id: open-order-main-file
        type: workspace.openFile
        at: { mark: open-main-file }
        path: src/main.tsx
      - id: select-order-event-protocol
        type: editor.select
        at: { mark: select-event-union }
        target:
          file: src/main.tsx
          text: "type OrderEvent ="
          occurrence: 1
      - id: type-order-machine
        type: editor.type
        at: { mark: type-machine }
        cadence: block
        target:
          file: src/main.tsx
          after: "// MACHINE_IMPLEMENTATION\n"
          occurrence: 1
        text: |

          const orderMachine = setup({
            types: {} as {
              context: {
                checkedItems: number;
                packingTicket: string | null;
              };
              events: OrderEvent;
            },
            actors: {
              packOrder: fromPromise(async () => {
                await new Promise<void>((resolve) => setTimeout(resolve, 700));
                return { ticket: "TKT-2048" };
              }),
            },
            guards: {
              hasCheckedBothItems: ({ context }) => context.checkedItems >= 2,
            },
            actions: {
              checkNextItem: assign({
                checkedItems: ({ context }) => context.checkedItems + 1,
              }),
              storePackingTicket: assign({
                packingTicket: ({ event }) => event.output.ticket,
              }),
              resetItemChecks: assign({
                checkedItems: 0,
              }),
            },
          }).createMachine({
            id: "order",
            initial: "received",
            context: {
              checkedItems: 0,
              packingTicket: null,
            },
            states: {
              received: {
                on: { START_PREPARING: "preparing" },
              },
              preparing: {
                on: { PACK_ORDER: "packing" },
              },
              packing: {
                invoke: {
                  src: "packOrder",
                  onDone: {
                    target: "ready",
                    actions: "storePackingTicket",
                  },
                  onError: "preparing",
                },
              },
              ready: {
                on: {
                  CHECK_ITEM: { actions: "checkNextItem" },
                  REMAKE: {
                    target: "preparing",
                    actions: "resetItemChecks",
                  },
                  SERVE: {
                    guard: "hasCheckedBothItems",
                    target: "served",
                  },
                },
              },
              served: {
                type: "final",
              },
            },
          });
      - id: select-machine-initial-state
        type: editor.select
        at: { mark: select-initial-state }
        target:
          file: src/main.tsx
          text: 'initial: "received"'
          occurrence: 1

  - id: implement-invoked-actor
    narration: >
      Machine config အကုန်တစ်ခါတည်း မကြည့်ဘဲ async အပိုင်းကို
      ခွဲကြည့်ရအောင်။ [[mark:select-promise-logic]] actors ထဲမှာ packOrder ကို
      fromPromise နဲ့ သတ်မှတ်ထားတယ်။ ဒီ demo မှာ မီလီစက္ကန့် ခုနစ်ရာစောင့်ပြီး
      TKT-2048 ဆိုတဲ့ ticket ပြန်ပေးမယ်။ Packing State ကို မျက်စိနဲ့
      မြင်ရအောင် ခဏစောင့်ထားတာ။ တကယ့် app ဆို ဒီနေရာမှာ packing API ခေါ်မယ်။
      Promise ပြန်လာတဲ့ value က Actor output ဖြစ်သွားလို့ onDone ရောက်ရင်
      event.output ဘယ်ပုံစံလဲ TypeScript သိတယ်။ [[mark:select-invoke-source]]
      Pack order Event ဝင်ရင် Packing ကိုသွားမယ်။ Packing ရောက်တာနဲ့
      packOrder Actor စမယ်။ React re-render တိုင်း API ခေါ်နေတာ မဟုတ်ဘူး။
      [[mark:select-invoke-completion]] onDone ဆို Ready သွားပြီး ticket ကို
      Context ထဲ သိမ်းမယ်။ onError ဆို Preparing ပြန်မယ်။ အောင်မြင်ရင်
      ဘယ်သွားမလဲ၊ မအောင်မြင်ရင် ဘယ်ပြန်မလဲ တစ်နေရာတည်းမှာ မြင်ရတယ်။
      isLoading နဲ့ error state တွေကို React ထဲမှာ လိုက်ညှိနေစရာ မလိုတော့ဘူး။
    sources:
      - title: "Stately Docs — Promise actors"
        url: "https://stately.ai/docs/promise-actors"
      - title: "Stately Docs — Invoking actors"
        url: "https://stately.ai/docs/invoke"
    actions:
      - id: select-promise-actor-logic
        type: editor.select
        at: { mark: select-promise-logic }
        target:
          file: src/main.tsx
          text: "fromPromise(async () => {"
          occurrence: 1
      - id: select-invoked-actor-source
        type: editor.select
        at: { mark: select-invoke-source }
        target:
          file: src/main.tsx
          text: 'src: "packOrder"'
          occurrence: 1
      - id: select-invoked-actor-completion
        type: editor.select
        at: { mark: select-invoke-completion }
        target:
          file: src/main.tsx
          text: 'actions: "storePackingTicket"'
          occurrence: 1

  - id: implement-guards-actions
    narration: >
      Async အပိုင်းပြီးပြီ။ အခု Event ရောက်တာနဲ့ ဆုံးဖြတ်ရမယ့် Transition
      တွေ ကြည့်မယ်။ [[mark:select-machine-guard]] Serve handler က target မရွေးခင်
      hasCheckedBothItems Guard ကို စစ်တယ်။ Context ဖတ်လို့ true ရမှ
      Served ကိုသွားမယ်။ false ဆို Ready မှာပဲ ဆက်နေမယ်။ React button ကို
      မတော်တဆ ဖွင့်ပေးမိရင်တောင် ဒီ Guard ရှိသရွေ့ နှစ်မျိုးလုံးမစစ်ဘဲ
      Serve လုပ်လို့မရဘူး။ [[mark:select-machine-action]] Check item ရောက်ရင်
      checkNextItem Action အလုပ်လုပ်မယ်။ assign က လက်ရှိ Context ကိုယူပြီး
      checkedItems အသစ်တွက်တယ်။ အဲဒီနောက် XState က State နဲ့ Context ပါတဲ့
      Snapshot အသစ် ထုတ်ပေးမယ်။ [[mark:select-remake-path]] Remake က Ready ကနေ
      Preparing ပြန်သွားပြီး checkedItems ကို သုညပြန်ထားတယ်။ State ပြောင်းတာနဲ့
      စစ်ဆေးမှုကို ပြန်စတာ Transition တစ်ခုတည်းမှာပြီးသွားလို့ count အဟောင်းပါတဲ့
      ကြားအခြေအနေ မပေါ်ဘူး။ Guard၊ Action နဲ့ target ကို စုဖတ်လိုက်ရင်
      အော်ဒါတည်ခင်းခွင့် စည်းမျဉ်းတစ်ခုလုံး မြင်ရပြီ။
    sources:
      - title: "Stately Docs — Guards"
        url: "https://stately.ai/docs/guards"
      - title: "Stately Docs — Actions and assign"
        url: "https://stately.ai/docs/actions"
      - title: "Stately Docs — Events and transitions"
        url: "https://stately.ai/docs/transitions"
    actions:
      - id: select-order-guard
        type: editor.select
        at: { mark: select-machine-guard }
        target:
          file: src/main.tsx
          text: 'guard: "hasCheckedBothItems"'
          occurrence: 1
      - id: select-context-assignment
        type: editor.select
        at: { mark: select-machine-action }
        target:
          file: src/main.tsx
          text: "checkedItems: ({ context }) => context.checkedItems + 1"
          occurrence: 1
      - id: select-remake-transition
        type: editor.select
        at: { mark: select-remake-path }
        target:
          file: src/main.tsx
          text: 'actions: "resetItemChecks"'
          occurrence: 1

  - id: implement-store
    narration: >
      Machine ပြီးပြီဆိုတော့ ဆိုင်ဝန်ထမ်းရဲ့ note တွေကို ထိန်းပေးမယ့် orderNotesStore ကို
      ရေးကြည့်ကြမယ်။ Store ရဲ့ initial Context မှာ draft အလွတ်တစ်ခုနဲ့ လက်ဖက်ရည်နဲ့ ပလာတာ
      အော်ဒါရောက်ထားကြောင်း note တစ်ခု ထည့်ထားတယ်။ [[mark:type-order-note-store]] on object ထဲ
      Event နှစ်ခု ထည့်မယ်။ changeDraft က
      input ကပို့လာတဲ့ value ကို လက်ခံပြီး draft အသစ်ပါတဲ့ Context ပြန်ပေးတယ်။ Context ထဲ notes
      လည်းရှိတာကြောင့် spread နဲ့ အဟောင်းကိုယူပြီး draft တစ်ခုပဲ ပြောင်းထားတယ်။ addNote က draft
      ရှေ့နောက်က whitespace တွေ ဖယ်မယ်။ စာမရှိရင် undefined ပြန်ပေးလို့ Store မပြောင်းဘူး။
      စာရှိရင် draft ကိုရှင်းပြီး note အသစ်ပါတဲ့ array တစ်ခု ပြန်ဆောက်မယ်။ ဒီ function နှစ်ခုကို
      ကြည့်လိုက်ရုံနဲ့ Event တစ်ခုစီကြောင့် data ဘယ်လိုပြောင်းသွားလဲ သိနိုင်ပါတယ်။
      [[mark:select-store-trigger]] React input က orderNotesStore.trigger.changeDraft ကို
      ခေါ်ထားတာကို ဒီမှာတွေ့ရတယ်။ XState Machine ရဲ့ send က type ပါတဲ့ Event object လက်ခံတယ်။
      Store ရဲ့ trigger ကတော့
      Event နာမည်နဲ့ method ဖန်တီးပေးတယ်။ ဒါကြောင့် trigger.changeDraft ခေါ်ချိန် value payload
      မပါရင် TypeScript ကပြောပေးမယ်။ addNote မှာ payload မလိုလို့ trigger.addNote ကို argument
      မပါဘဲ ခေါ်နိုင်တယ်။ [[mark:select-store-selector]] import မှာ Store ရဲ့ useSelector ကို
      useStoreSelector လို့ နာမည်ပြောင်းထားတယ်။ Actor အတွက် Selector နဲ့ Store အတွက် Selector
      တွေ မရောသွားအောင် နာမည်ခွဲထားတာပါ။ နောက် React binding အပိုင်းမှာ draft နဲ့ notes ကို
      သီးခြားရွေးမယ်။
    sources:
      - title: "Stately Docs — XState Store transitions"
        url: "https://stately.ai/docs/xstate-store"
      - title: "Stately Docs — @xstate/store-react useSelector"
        url: "https://stately.ai/docs/xstate-store/react"
    actions:
      - id: type-order-note-store-transitions
        type: editor.type
        at: { mark: type-order-note-store }
        cadence: line-by-line
        target:
          file: src/main.tsx
          after: "    // STORE_TRANSITIONS\n"
          occurrence: 1
        text: |
          changeDraft: (context, event: { value: string }) => ({
            ...context,
            draft: event.value,
          }),
          addNote: (context) => {
            const note = context.draft.trim();

            if (!note) {
              return;
            }

            return {
              ...context,
              draft: "",
              notes: [...context.notes, note],
            };
          },
      - id: select-store-trigger-call
        type: editor.select
        at: { mark: select-store-trigger }
        target:
          file: src/main.tsx
          text: "orderNotesStore.trigger.changeDraft({ value: event.target.value })"
          occurrence: 1
      - id: select-store-selector-import
        type: editor.select
        at: { mark: select-store-selector }
        target:
          file: src/main.tsx
          text: "useSelector as useStoreSelector"
          occurrence: 1

  - id: bind-react
    narration: >
      အခုဆိုရင် Machine နဲ့ Store နှစ်ခုလုံး ရှိနေပြီပေါ့။ React Component က သူတို့ဆီက value
      ယူပြီး Event ပြန်ပို့ဖို့သာ ကျန်တော့တယ်။ [[mark:type-react-bindings]] useMachine ကို
      orderMachine နဲ့ခေါ်မယ်။ သူပြန်ပေးတဲ့ snapshot က UI ပြဖို့သုံးမယ်၊ send က အသုံးပြုသူရဲ့
      Event ပို့ဖို့သုံးမယ်။ ပြီးရင် useStoreSelector နှစ်ကြိမ်ခေါ်ပြီး draft နဲ့ notes ကို
      သီးခြားရွေးမယ်။ draft ပဲပြောင်းရင် notes ကိုရွေးထားတဲ့ Selector ရဲ့ result က မပြောင်းဘူး။
      Note ထည့်မှသာ အဲဒီ result ပြောင်းမယ်။ ဒီလိုမျိုး ရွေးထားတဲ့အတွက် Component တွေကို
      ခွဲလိုက်တဲ့အခါ ဘယ်အစိတ်အပိုင်းက ဘာကြောင့် re-render ဖြစ်မလဲဆိုတာကို ရှင်းရှင်းလင်းလင်း
      သိနိုင်မှာပါ။ Snapshot ထဲက value ကို string ပြောင်းပြီး stateLabels နဲ့ လူဖတ်လို့ရတဲ့
      Received၊ Preparing စတဲ့စာသားတွေအဖြစ် ပြမယ်။ Context ထဲက checkedItems နဲ့ packingTicket
      ကိုလည်း တိုက်ရိုက်ဖတ်မယ်။ [[mark:select-snapshot-can]] Serve order button မှာ snapshot.can ကို
      သုံးထားတယ်။ လက်ရှိ Snapshot မှာ Serve Event ပို့ရင် Transition ဖြစ်နိုင်မလား Machine ကို
      အရင်မေးတာပါ။ false ဆို button ကို disable ပြမယ်။ ဒါပေမဲ့ button ပုံစံတစ်ခုတည်းကို
      အားကိုးထားတာမဟုတ်ဘူး။ Event တကယ်ရောက်လာချိန် Guard က ထပ်စစ်မယ်။ [[mark:select-react-send]]
      Start preparing button ကိုနှိပ်ရင် send နဲ့ Start preparing Event ပို့ထားတာကို
      ဒီမှာတွေ့ရတယ်။ Component က
      state variable အများကြီးကို တစ်ခုချင်းစီ လိုက်ပြင်နေစရာ မလိုတော့ပါဘူး။ Actor က Snapshot
      အသစ်ထုတ်ပေးပြီး React က အဲဒီ Snapshot အတိုင်း UI ကို ပြန်ဆွဲမယ်။ ဒီနေရာမှာ UI နဲ့
      လုပ်ငန်းစည်းမျဉ်း ဘယ်လိုခွဲထားလဲ မြင်လာပြီ။
    sources:
      - title: "Stately Docs — @xstate/react useMachine"
        url: "https://stately.ai/docs/xstate-react"
      - title: "Stately Docs — @xstate/store-react"
        url: "https://stately.ai/docs/xstate-store/react"
      - title: "React Docs — Responding to events"
        url: "https://react.dev/learn/responding-to-events"
    actions:
      - id: type-react-state-bindings
        type: editor.type
        at: { mark: type-react-bindings }
        cadence: block
        target:
          file: src/main.tsx
          after: "  // REACT_BINDINGS\n"
          occurrence: 1
        text: |

          const [snapshot, send] = useMachine(orderMachine);
          const draft = useStoreSelector(
            orderNotesStore,
            (storeSnapshot) => storeSnapshot.context.draft,
          );
          const notes = useStoreSelector(
            orderNotesStore,
            (storeSnapshot) => storeSnapshot.context.notes,
          );
      - id: select-snapshot-can
        type: editor.select
        at: { mark: select-snapshot-can }
        target:
          file: src/main.tsx
          text: 'snapshot.can({ type: "SERVE" })'
          occurrence: 1
      - id: select-actor-send
        type: editor.select
        at: { mark: select-react-send }
        target:
          file: src/main.tsx
          text: 'send({ type: "START_PREPARING" })'
          occurrence: 1
      - id: expect-final-machine-file
        type: expect.file
        at: { afterAction: select-actor-send }
        path: src/main.tsx
        contains: 'guard: "hasCheckedBothItems"'
      - id: expect-final-store-file
        type: expect.file
        at: { afterAction: expect-final-machine-file }
        path: src/main.tsx
        contains: "orderNotesStore.trigger.addNote()"

  - id: run-order-workflow
    narration: >
      Code အပိုင်းတွေကို တစ်ခုချင်းစီ ကြည့်ပြီးပြီဆိုတော့ အခု အဲဒီအပိုင်းတွေ တကယ် ချိတ်ဆက်ပြီး
      အလုပ်လုပ်ပုံကို Browser ထဲမှာ လိုက်ကြည့်ရအောင်။ [[mark:start-order-runtime]] WebContainer
      ကို start လုပ်မယ်။ Dependency တွေ install လုပ်ပြီး Vite server အသင့်ဖြစ်မှ Preview
      ပွင့်လာမယ်။ Dashboard ကို စဖွင့်တဲ့အချိန်မှာ Received က initial State အဖြစ်
      ရှိနေပါလိမ့်မယ်။
      ဒီအချိန် ဘယ် button ကို နှိပ်လို့ရမလဲ အရင်ခန့်မှန်းကြည့်ရအောင်။ အော်ဒါကို မစရသေးလို့
      Start preparing တစ်ခုပဲ နှိပ်လို့ရမယ်။ Pack order၊ Check next item နဲ့ Serve order
      တွေကို နှိပ်လို့မရသေးဘူး။ React က button တစ်ခုစီမှာ snapshot.can ကိုခေါ်ပြီး
      “ဒီ Snapshot မှာ ဒီ Event ပို့လို့ရပြီလား” လို့ Machine ကို မေးထားတာပါ။
      [[mark:start-order]] အခု Start preparing ကိုနှိပ်မယ်။ Component က Start preparing
      Event ကို Actor ဆီပို့တယ်။ Received State မှာ အဲဒီ Event အတွက် Transition ရှိလို့ Actor က
      Preparing Snapshot အသစ်ကို ထုတ်ပေးမယ်။ Workflow ပေါ်မှာ Received က ပြီးသွားတဲ့အဆင့်ဖြစ်ပြီး
      Preparing ကို ထင်ရှားအောင် ပြမယ်။ [[mark:pack-order]] လက်ဖက်ရည်နဲ့ ပလာတာ
      ပြင်ပြီးပြီဆိုတော့ Pack order ကိုနှိပ်မယ်။ Pack order Event ဝင်တဲ့အခါ Ready ကို
      တန်းမရောက်သေးဘူး။ အရင်ဆုံး Packing State ဝင်ပြီး Promise Actor ကို start လုပ်မယ်။
      Promise ပြီးမှ onDone Transition က Ready ဆီပို့ပြီး Action က TKT-2048 packing ticket ကို
      Context ထဲ သိမ်းမယ်။ ဒါကြောင့် Preview မှာ Packing ကို အရင်မြင်ရပြီး နောက်မှ Ready နဲ့
      ticket ကို မြင်ရမယ်။ Packing State ထည့်ထားတာက အလှဆင်ဖို့ မဟုတ်ပါဘူး။ ထုပ်ပိုးနေဆဲနဲ့
      ထုပ်ပိုးပြီးသွားပြီဆိုတဲ့ အခြေအနေနှစ်ခုကို Machine ထဲမှာ ရှင်းရှင်းလင်းလင်း ခွဲထားတာပါ။
    sources:
      - title: "Stately Docs — @xstate/react"
        url: "https://stately.ai/docs/xstate-react"
      - title: "Stately Docs — State machine transitions"
        url: "https://stately.ai/docs/transitions"
      - title: "Vite Docs — Getting Started"
        url: "https://vite.dev/guide/"
    actions:
      - id: start-order-preview-runtime
        type: runtime.start
        at: { mark: start-order-runtime }
        timeoutMs: 45000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: wait-for-order-preview
        type: runtime.waitForReady
        at: { afterAction: start-order-preview-runtime }
        timeoutMs: 20000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-order-preview
        type: preview.open
        at: { afterAction: wait-for-order-preview }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-received-snapshot
        type: expect.preview
        at: { afterAction: open-order-preview }
        timeoutMs: 5000
        target: { by: testId, value: order-state }
        textContains: "Received"
        attribute: { name: data-state, value: received }
        retry: { maxAttempts: 3, delayMs: 150 }
      - id: click-start-order
        type: preview.click
        at: { mark: start-order }
        timeoutMs: 5000
        target: { by: testId, value: start-button }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-preparing-snapshot
        type: expect.preview
        at: { afterAction: click-start-order }
        timeoutMs: 5000
        target: { by: testId, value: order-state }
        textContains: "Preparing"
        attribute: { name: data-state, value: preparing }
        retry: { maxAttempts: 3, delayMs: 100 }
      - id: click-pack-order
        type: preview.click
        at: { mark: pack-order }
        timeoutMs: 5000
        target: { by: testId, value: pack-button }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-packing-snapshot
        type: expect.preview
        at: { afterAction: click-pack-order }
        timeoutMs: 5000
        target: { by: testId, value: order-state }
        textContains: "Packing"
        attribute: { name: data-state, value: packing }
        retry: { maxAttempts: 2, delayMs: 100 }
      - id: expect-ready-snapshot
        type: expect.preview
        at: { afterAction: expect-packing-snapshot }
        timeoutMs: 5000
        target: { by: testId, value: order-state }
        textContains: "Ready"
        attribute: { name: data-state, value: ready }
        retry: { maxAttempts: 3, delayMs: 400 }
      - id: expect-packing-ticket
        type: expect.preview
        at: { afterAction: expect-ready-snapshot }
        timeoutMs: 5000
        target: { by: testId, value: packing-ticket }
        textContains: "TKT-2048"
        retry: { maxAttempts: 3, delayMs: 100 }

  - id: run-remake-path
    narration: >
      Ready ရောက်တိုင်း Served ဆီ တန်းသွားလို့မရသေးဘူး။ လက်ဖက်ရည်မှာ အချိုမှားနေနိုင်သလို
      ပလာတာမပါသေးတာလည်း ဖြစ်နိုင်တယ်။ အောင်မြင်တဲ့လမ်းတစ်လမ်းတည်းကြည့်ပြီး Machine မှန်တယ်လို့
      မဆုံးဖြတ်သင့်ဘူး။ ပစ္စည်းမှားလို့ ပြန်ပြင်ရတဲ့လမ်းကိုပါ စမ်းကြည့်ရအောင်။
      [[mark:first-check-before-remake]] အရင်ဆုံး Check next item ကို တစ်ကြိမ်နှိပ်မယ်။
      Check item Event အတွက် target မပါတဲ့ Transition က State ကို Ready မှာပဲထားပြီး
      checkNextItem Action ကို run မယ်။ ဒါကြောင့် State မပြောင်းပေမဲ့ Context ထဲက checkedItems
      က သုညကနေ တစ် ဖြစ်သွားမယ်။ Transition ဆိုတိုင်း State နာမည်ပြောင်းရမယ်လို့
      မယူဆသင့်ပါဘူး။ State မပြောင်းဘဲ Action လုပ်ဖို့လည်း Transition သုံးနိုင်တယ်။
      [[mark:remake-order]] အခု ပထမဆုံးစစ်တဲ့ပစ္စည်း မှားနေတာတွေ့တယ်ဆိုပါစို့။ Make again ကို
      နှိပ်လိုက်ရင် Remake Event ရောက်ပြီး Machine က Preparing ဆီပြန်သွားမယ်။ တစ်ချိန်တည်းမှာ
      resetItemChecks Action က checkedItems ကို သုည ပြန်ထားမယ်။ ပြန်ပြင်မယ့်အော်ဒါမှာ
      အရင်စစ်ထားတဲ့ရလဒ်ကို ဆက်မသုံးသင့်လို့ပါ။ ဒီစည်းမျဉ်းကို Component ထဲမှာ if statement နဲ့
      လိုက်ပြင်စရာမလိုဘူး။ Transition နဲ့ Action က တစ်နေရာတည်းမှာ ဖော်ပြထားတယ်။
      [[mark:repack-order]] နှစ်မျိုးလုံး ပြန်ပြင်ပြီးပြီဆိုတော့ Pack order ကို
      ပြန်နှိပ်မယ်။ Packing State ဝင်ပြီး Promise Actor အသစ်တစ်ခု စမယ်။ အဲဒီ Actor ပြီးမှ
      Ready ဆီပြန်ရောက်မယ်။ ဒီလမ်းကို စမ်းလိုက်တာနဲ့ Remake Transition၊ reset Action နဲ့ invoke
      သုံးခုလုံး အလုပ်လုပ်ကြောင်း မြင်ရပြီ။
    sources:
      - title: "Stately Docs — State machine transitions"
        url: "https://stately.ai/docs/transitions"
      - title: "Stately Docs — Actions"
        url: "https://stately.ai/docs/actions"
      - title: "Stately Docs — Invoked actors"
        url: "https://stately.ai/docs/invoke"
    actions:
      - id: click-check-before-remake
        type: preview.click
        at: { mark: first-check-before-remake }
        timeoutMs: 5000
        target: { by: testId, value: check-button }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-check-before-remake
        type: expect.preview
        at: { afterAction: click-check-before-remake }
        timeoutMs: 5000
        target: { by: testId, value: check-count }
        textContains: "1 / 2 items checked"
        retry: { maxAttempts: 3, delayMs: 100 }
      - id: click-remake-order
        type: preview.click
        at: { mark: remake-order }
        timeoutMs: 5000
        target: { by: testId, value: remake-button }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-preparing-after-remake
        type: expect.preview
        at: { afterAction: click-remake-order }
        timeoutMs: 5000
        target: { by: testId, value: order-state }
        textContains: "Preparing"
        attribute: { name: data-state, value: preparing }
        retry: { maxAttempts: 3, delayMs: 100 }
      - id: expect-check-reset-after-remake
        type: expect.preview
        at: { afterAction: expect-preparing-after-remake }
        timeoutMs: 5000
        target: { by: testId, value: check-count }
        textContains: "0 / 2 items checked"
        retry: { maxAttempts: 3, delayMs: 100 }
      - id: click-repack-order
        type: preview.click
        at: { mark: repack-order }
        timeoutMs: 5000
        target: { by: testId, value: pack-button }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-packing-after-remake
        type: expect.preview
        at: { afterAction: click-repack-order }
        timeoutMs: 5000
        target: { by: testId, value: order-state }
        textContains: "Packing"
        attribute: { name: data-state, value: packing }
        retry: { maxAttempts: 2, delayMs: 100 }
      - id: expect-ready-after-remake
        type: expect.preview
        at: { afterAction: expect-packing-after-remake }
        timeoutMs: 5000
        target: { by: testId, value: order-state }
        textContains: "Ready"
        attribute: { name: data-state, value: ready }
        retry: { maxAttempts: 3, delayMs: 400 }

  - id: run-guard-and-serve
    narration: >
      အခု Ready State ကို ပြန်ရောက်လာပြီ။ ဒီတစ်ခါ အော်ဒါကို Serve လုပ်ခွင့် Guard က
      ဘယ်လိုထိန်းလဲ
      ကြည့်မယ်။ [[mark:inspect-guarded-serve]] checkedItems က သုညဖြစ်နေတဲ့အတွက် Serve order
      button ကို နှိပ်လို့မရဘူး။ “Button ကို disable လုပ်ထားရင် လုံလောက်ပြီမဟုတ်လား” လို့
      မေးနိုင်တယ်။ မလုံလောက်ပါဘူး။ UI မဟုတ်တဲ့ API ဒါမှမဟုတ် test ကလည်း Serve Event
      ပို့နိုင်တယ်။ တကယ့်စည်းမျဉ်းက Machine ထဲက hasCheckedBothItems Guard ပါ။ React မှာသုံးတဲ့
      snapshot.can က အဲဒီ Machine စည်းမျဉ်းကို မေးပြီး button ကို ဘယ်လိုပြရမလဲ ဆုံးဖြတ်တာပါ။
      [[mark:first-final-check]] Check next item ကို တစ်ကြိမ်နှိပ်မယ်။ checkedItems က
      တစ်ဖြစ်သွားပေမဲ့ လက်ဖက်ရည်နဲ့ ပလာတာထဲက တစ်မျိုးပဲစစ်ရသေးလို့ Guard က false ပဲ။
      ဒီအချိန် Serve Event တကယ်ပို့လည်း Machine က Ready မှာပဲ ဆက်ရှိမယ်။
      [[mark:second-final-check]] Check next item ကို ဒုတိယအကြိမ် နှိပ်လိုက်ရင် checkedItems က
      နှစ်ဖြစ်လာမယ်။ နှစ်မျိုးလုံးစစ်ပြီးပြီမို့ snapshot.can က true ပြန်ပေးပြီး Serve order
      ကို နှိပ်လို့ရလာမယ်။ [[mark:serve-order]] Serve order ကိုနှိပ်လိုက်ရင် Serve Event က
      Guard ကို နောက်တစ်ကြိမ်ဖြတ်ရတယ်။ Guard က true ပြန်မှ Served Final State ကို ရောက်မယ်။
      ဒီဥပမာမှာ UI နဲ့ Machine က စည်းမျဉ်းတစ်ခုတည်းကို သုံးထားတယ်။ React က ခွင့်ပြုချက်ကို
      ကိုယ်တိုင်မဆုံးဖြတ်ဘူး။ Machine ကိုမေးပြီးပြတယ်၊ Event ရောက်လာရင် Machine ကပဲ
      နောက်ဆုံးဆုံးဖြတ်တယ်။
    sources:
      - title: "Stately Docs — Guards"
        url: "https://stately.ai/docs/guards"
      - title: "Stately Docs — State snapshots"
        url: "https://stately.ai/docs/states"
      - title: "Stately Docs — @xstate/react"
        url: "https://stately.ai/docs/xstate-react"
    actions:
      - id: expect-serve-guarded
        type: expect.preview
        at: { mark: inspect-guarded-serve }
        timeoutMs: 5000
        target: { by: testId, value: serve-button }
        textContains: "Serve order"
        attribute: { name: aria-disabled, value: "true" }
        retry: { maxAttempts: 3, delayMs: 100 }
      - id: click-first-final-check
        type: preview.click
        at: { mark: first-final-check }
        timeoutMs: 5000
        target: { by: testId, value: check-button }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-first-final-check
        type: expect.preview
        at: { afterAction: click-first-final-check }
        timeoutMs: 5000
        target: { by: testId, value: check-count }
        textContains: "1 / 2 items checked"
        retry: { maxAttempts: 3, delayMs: 100 }
      - id: expect-serve-still-guarded
        type: expect.preview
        at: { afterAction: expect-first-final-check }
        timeoutMs: 5000
        target: { by: testId, value: serve-button }
        attribute: { name: aria-disabled, value: "true" }
        retry: { maxAttempts: 3, delayMs: 100 }
      - id: click-second-final-check
        type: preview.click
        at: { mark: second-final-check }
        timeoutMs: 5000
        target: { by: testId, value: check-button }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-second-final-check
        type: expect.preview
        at: { afterAction: click-second-final-check }
        timeoutMs: 5000
        target: { by: testId, value: check-count }
        textContains: "2 / 2 items checked"
        retry: { maxAttempts: 3, delayMs: 100 }
      - id: expect-serve-allowed
        type: expect.preview
        at: { afterAction: expect-second-final-check }
        timeoutMs: 5000
        target: { by: testId, value: serve-button }
        attribute: { name: aria-disabled, value: "false" }
        retry: { maxAttempts: 3, delayMs: 100 }
      - id: click-serve-order
        type: preview.click
        at: { mark: serve-order }
        timeoutMs: 5000
        target: { by: testId, value: serve-button }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-served-snapshot
        type: expect.preview
        at: { afterAction: click-serve-order }
        timeoutMs: 5000
        target: { by: testId, value: order-state }
        textContains: "Served"
        attribute: { name: data-state, value: served }
        retry: { maxAttempts: 3, delayMs: 100 }

  - id: run-order-notes-store
    narration: >
      အော်ဒါ Actor က Served Final State ကို ရောက်သွားပြီ။ ဒါပေမဲ့ ဘေးက Counter notes ကို
      ဆက်ရေးလို့ရနေသေးတယ်။ Note စာရင်းကို အော်ဒါ Machine ထဲမှာ မထားဘဲ XState Store က
      သီးခြားထိန်းထားလို့ပါ။ [[mark:enter-order-note]] ဆိုင်ဝန်ထမ်းရဲ့ note အဖြစ် Tea is less
      sweet လို့ input ထဲ ရေးကြည့်မယ်။ စာလုံးရိုက်တိုင်း changeDraft Event က Store ဆီရောက်ပြီး
      draft ပါတဲ့ Context အသစ်ကို ပြန်ပေးမယ်။ React မှာ draft ကိုရွေးထားတဲ့ Selector က value
      ပြောင်းတာကိုသိပြီး input ကို re-render လုပ်ပေးမယ်။ [[mark:add-order-note]] Add note က
      addNote Event ပို့မယ်။ addNote Transition က ရှိပြီးသား array ကို တိုက်ရိုက်မပြင်ဘဲ notes
      array အသစ်ဖန်တီးပြီး draft ကို အလွတ်ပြန်ထားမယ်။ ဒါကြောင့် note စာရင်းမှာ စာကြောင်းအသစ်
      ပေါ်လာပြီး input က ပြန်ရှင်းသွားမယ်။ ဒီအချိန် အော်ဒါ State ကို ပြန်ကြည့်ရအောင်။ Store မှာ
      data ပြောင်းပေမဲ့ Machine ရဲ့ Snapshot က Served အတိုင်းပဲ။ Note တစ်ကြောင်း
      ထည့်လိုက်ရုံနဲ့ အော်ဒါက Received State ကို ပြန်ရောက်သွားစရာ မရှိဘူး။ Workflow အဆင့်နဲ့
      UI မှာရေးနေတဲ့ data ကို
      နေရာနှစ်ခုခွဲထိန်းထားတာကို ဒီနေရာမှာ တိတိကျကျ မြင်ရတယ်။
    sources:
      - title: "Stately Docs — @xstate/store-react"
        url: "https://stately.ai/docs/xstate-store/react"
      - title: "Stately Docs — XState Store"
        url: "https://stately.ai/docs/xstate-store"
      - title: "React Docs — Updating arrays in state"
        url: "https://react.dev/learn/updating-arrays-in-state"
    actions:
      - id: enter-order-note-input
        type: preview.input
        at: { mark: enter-order-note }
        timeoutMs: 5000
        target: { by: testId, value: note-input }
        value: "Tea is less sweet"
        retry: { maxAttempts: 2, delayMs: 150 }
      - id: expect-note-draft
        type: expect.preview
        at: { afterAction: enter-order-note-input }
        timeoutMs: 5000
        target: { by: testId, value: note-input }
        value: "Tea is less sweet"
        retry: { maxAttempts: 3, delayMs: 100 }
      - id: click-add-order-note
        type: preview.click
        at: { mark: add-order-note }
        timeoutMs: 5000
        target: { by: testId, value: add-note-button }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-order-note
        type: expect.preview
        at: { afterAction: click-add-order-note }
        timeoutMs: 5000
        target: { by: testId, value: note-list }
        textContains: "Tea is less sweet"
        retry: { maxAttempts: 3, delayMs: 100 }
      - id: expect-note-draft-cleared
        type: expect.preview
        at: { afterAction: expect-order-note }
        timeoutMs: 5000
        target: { by: testId, value: note-input }
        value: ""
        retry: { maxAttempts: 3, delayMs: 100 }
      - id: expect-machine-stays-served
        type: expect.preview
        at: { afterAction: expect-note-draft-cleared }
        timeoutMs: 5000
        target: { by: testId, value: order-state }
        textContains: "Served"
        attribute: { name: data-state, value: served }
        retry: { maxAttempts: 3, delayMs: 100 }

  - id: course-recap
    narration: >
      [[mark:open-recap-board]] အော်ဒါနံပါတ် ၂၄ ကို နောက်ဆုံးတစ်ခေါက်
      ပြန်လိုက်ကြည့်မယ်။ API နာမည်တွေကို အလွတ်ကျက်ဖို့မလိုဘူး။
      ဒီမေးခွန်းတွေ ဖြေနိုင်ရင် ကိုယ့် app မှာ ပြန်သုံးနိုင်ပြီ။
      [[mark:recap-model-and-rules]] အခုဘယ်အဆင့်မှာလဲ။ အဖြေက State
      တစ်ခုတည်းဖြစ်ရမယ်။ နောက်ဘာလုပ်ခွင့်ရှိလဲ။ Event အတွက်
      ခွင့်ပြုထားတဲ့လမ်း ရှိရမယ်။ [[mark:recap-actor-and-react]]
      အော်ဒါတစ်ခုချင်းစီရဲ့ လက်ရှိအခြေအနေကို ဘယ်သူကိုင်ပြီး ဆုံးဖြတ်လဲ။
      Actor က ကိုင်ထားတယ်။ ဘယ်သူပြသလဲ။ React က အခြေအနေကိုပြပြီး
      Event ကိုပို့တယ်။ [[mark:recap-store-and-checks]] ဘာကိုသီးခြားထားမလဲ။
      အစဉ်မရှိတဲ့ Counter notes လို data ကို Store က ထိန်းတယ်။
      ဒီလမ်းကို ဖြတ်လို့ရပြီလား။ Guard က စစ်မယ်။ Machine ကဆုံးဖြတ်၊ React ကပြ၊
      Store က သီးခြား data ကိုထိန်းတယ်။ ဒီတာဝန်ခွဲပုံ ရှင်းနေသရွေ့
      implementation ကြီးလာလည်း အော်ဒါစည်းမျဉ်း မပျောက်ဘူး။
    sources:
      - title: "Stately Docs — State machines"
        url: "https://stately.ai/docs/machines"
      - title: "Stately Docs — Actors"
        url: "https://stately.ai/docs/actors"
      - title: "Stately Docs — @xstate/react"
        url: "https://stately.ai/docs/xstate-react"
      - title: "Stately Docs — @xstate/store-react"
        url: "https://stately.ai/docs/xstate-store/react"
    actions:
      - id: open-course-recap-board
        type: whiteboard.apply
        at: { mark: open-recap-board, offsetMs: -450 }
        open: true
        maximized: true
        clear: true
        upsertIds: []
      - id: draw-course-recap-heading
        type: whiteboard.apply
        at: { mark: open-recap-board }
        upsertIds: [recap-title, recap-subtitle]
        drawMs: 900
      - id: recap-state-model-and-rules
        type: whiteboard.apply
        at: { mark: recap-model-and-rules }
        upsertIds:
          [
            recap-model-card,
            recap-model-heading,
            recap-model-body,
            recap-rules-card,
            recap-rules-heading,
            recap-rules-body,
          ]
        drawMs: 1700
      - id: recap-actors-and-react
        type: whiteboard.apply
        at: { mark: recap-actor-and-react }
        upsertIds:
          [
            recap-actor-card,
            recap-actor-heading,
            recap-actor-body,
            recap-react-card,
            recap-react-heading,
            recap-react-body,
          ]
        drawMs: 1700
      - id: recap-store-and-testing
        type: whiteboard.apply
        at: { mark: recap-store-and-checks }
        upsertIds:
          [
            recap-store-card,
            recap-store-heading,
            recap-store-body,
            recap-test-card,
            recap-test-heading,
            recap-test-body,
            recap-rule-box,
            recap-rule,
          ]
        drawMs: 2100

checks:
  - { type: timing.p95Ms, max: 300 }
