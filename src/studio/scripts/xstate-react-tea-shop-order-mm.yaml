  - id: invoked-actor-lifecycle
    narration: >
      ထုပ်ပိုးတာနဲ့ အော်ဒါလက်မှတ်ထုတ်တာက ခဏကြာတယ်။
      [[mark:draw-invoked-parent]] အော်ဒါ Actor က Packing ဝင်တဲ့အချိန်မှာပဲ
      ဒီအလုပ်ကို စတင်မယ်။ စောင့်နေတဲ့အချိန်ကို Packing ဆိုတဲ့အဆင့်က
      မြင်သာအောင် ပြထားပြီးသားပါ။ [[mark:draw-invoked-child]] ထုပ်ပိုးအလုပ်ကို
      သီးခြား Actor တစ်ခုဆီ အပ်မယ်။ အလုပ်ပြီးပြီး လက်မှတ်ပြန်ရရင် Ready။
      အဆင်မပြေရင် Preparing ဆီပြန်ပြီး ပြန်ပြင်မယ်။ အောင်မြင်တဲ့လမ်းနဲ့
      ပြန်လုပ်ရမယ့်လမ်း နှစ်ခုလုံးကို ပုံထဲမှာ တစ်ခါတည်း မြင်ရတယ်။
      [[mark:draw-invoke-rule]] ဒီအလုပ်ကို Packing အဆင့်က ပိုင်တယ်။
      အဲဒီအဆင့်ကနေ ထွက်သွားရင် မပြီးသေးတဲ့အလုပ်ကို ရပ်မယ်။ အချိန်ယူတဲ့အလုပ်ကို
      ဘယ်အချိန်စပြီး ဘယ်အချိန်ရပ်မလဲဆိုတာ workflow နဲ့အတူ ထားလိုက်တာပါ။
    sources:
      - title: "Stately Docs — Invoking actors"
        url: "https://stately.ai/docs/invoke"
      - title: "Stately Docs — Promise actors"
        url: "https://stately.ai/docs/promise-actors"
      - title: "Stately Docs — Actors"
        url: "https://stately.ai/docs/actors"
    actions:
      - id: draw-invoked-parent-actor
        type: whiteboard.apply
        at: { mark: draw-invoked-parent }
        clear: true
        upsertIds: [invoke-title, parent-actor-box, parent-actor-label, parent-state-label]
        drawMs: 1200
      - id: draw-invoked-promise-actor
        type: whiteboard.apply
        at: { mark: draw-invoked-child }
        timeoutMs: 5000
        upsertIds:
          [
            invoke-child-arrow,
