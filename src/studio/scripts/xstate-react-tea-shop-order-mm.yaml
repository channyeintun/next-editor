build:
  # Studio replaces this built-in profile with the selected Burmese VoxCPM2
  # profile at render time when the signed-in user has the D1 capability.
  voiceProfile: pocket-alba-v1
  seed: 83

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: npm ci --no-audit --no-fund
  runCommand: npm run dev
  expectedPort: 5173
  lockfilePath: package-lock.json
  environment: {}

scenes:
  - id: why-explicit-state
    narration: >
      Code ကို ခဏထားပြီး ဆိုင်ထဲက အော်ဒါနံပါတ် ၂၄ ကိုပဲ လိုက်ကြည့်မယ်။
      လက်ဖက်ရည်တစ်ခွက်နဲ့ ပလာတာတစ်ပွဲ မှာထားတယ်။ ဝန်ထမ်းအသစ်က ဒီအော်ဒါ
      အခုဘယ်အဆင့်မှာလဲလို့ မေးလာတယ်ဆိုပါစို့။ [[mark:open-why-board]] Received လည်းဟုတ်၊
      Preparing လည်းဟုတ်၊ Ready လည်းဟုတ်လို့ ဖြေရင် ဘယ်သူက ဘာဆက်လုပ်ရမလဲ မသိတော့ဘူး။
      [[mark:show-conflicting-statuses]] တံဆိပ်သုံးခု တစ်ပြိုင်နက်မှန်နေတာက ဆိုင်မှာ
      မဖြစ်သင့်တဲ့အခြေအနေပါ။ [[mark:show-current-stage]] အော်ဒါကတ်မှာ Ready တစ်ခုတည်း
      ထားလိုက်ရင် အဖြေရှင်းသွားတယ်။ အခုနေရာက Ready။ နောက်လုပ်လို့ရတာက
      ပစ္စည်းနှစ်ခုစစ်ပြီး တည်ခင်းဖို့။ ဒီလို လက်ရှိအဆင့်ကို အဖြေတစ်ခုတည်းနဲ့
      ပြောတာကို State လို့ခေါ်မယ်။ [[mark:show-next-action]] State က label တစ်ခုတည်း
      မဟုတ်ဘူး။ နောက်ဘာလုပ်ခွင့်ရှိလဲဆိုတာပါ ရှင်းစေတယ်။ အခု အော်ဒါကတ်သွားမယ့်လမ်းကို
      ဆက်ဆွဲကြည့်မယ်။
    sources:
      - title: "Stately Docs — State machines"
        url: "https://stately.ai/docs/machines"
      - title: "Stately Docs — Finite states"
        url: "https://stately.ai/docs/finite-states"
      - title: "Stately Docs — Events and transitions"
        url: "https://stately.ai/docs/transitions"
    actions:
      - id: open-why-state-board
        type: whiteboard.apply
        at: { mark: open-why-board, offsetMs: -450 }
        open: true
        maximized: true
        clear: true
        upsertIds: []
      - id: draw-why-state-contrast
        type: whiteboard.apply
        at: { mark: open-why-board }
        upsertIds:
          [why-title, conflicting-status-box, conflicting-status-heading, conflicting-status-body]
        drawMs: 1500
      - id: circle-conflicting-statuses
        type: whiteboard.apply
        at: { mark: show-conflicting-statuses }
        upsertIds: [conflicting-status-circle]
        drawMs: 800
      - id: show-one-current-stage
        type: whiteboard.apply
        at: { mark: show-current-stage }
        upsertIds:
          [
            clarify-status-arrow,
            current-status-box,
            current-status-heading,
            current-status-body,
            one-stage-rule,
          ]
        drawMs: 1500
      - id: show-state-next-action
        type: whiteboard.apply
        at: { mark: show-next-action }
        upsertIds: [next-action-box, next-action-label]
        drawMs: 900

  - id: finite-automaton-order
    narration: >
      [[mark:open-domain-board]] အော်ဒါနံပါတ် ၂၄ ရဲ့လမ်းကို စာရွက်ပေါ်မှာ ဆွဲကြည့်မယ်။
      [[mark:draw-received-state]] ကောင်တာက လက်ခံလိုက်တဲ့ Received မှာ စတယ်။
      [[mark:draw-preparing-state]] ဝန်ထမ်းက စပြင်လိုက်ရင် Preparing ကို ရွှေ့တယ်။
      [[mark:draw-packing-state]] လက်ဖက်ရည်နဲ့ ပလာတာ နှစ်မျိုးလုံးပြီးရင် Packing။
      ဒီအဆင့်မှာ ပစ္စည်းတွေထုပ်ပြီး အော်ဒါလက်မှတ် ထုတ်နေတယ်။
      [[mark:draw-ready-state]] လက်မှတ်ရလာရင် Ready ကို ရောက်တယ်။
      [[mark:draw-served-state]] နှစ်မျိုးလုံး မှန်မမှန်စစ်ပြီးမှ Served ကို ရောက်မယ်။
      မြှားပေါ်က စပြင်၊ ထုပ်ပိုး၊ တည်ခင်းလို ဖြစ်ရပ်တွေကို Event လို့ခေါ်တယ်။
      အရေးကြီးတာက ပုံထဲမှာရှိတဲ့လမ်းပဲ သွားခွင့်ရှိတာပါ။ Received ကနေ Ready ကို
      တိုက်ရိုက်သွားတဲ့မြှား မရှိဘူး။ အဆင့်တွေ၊ Event တွေနဲ့ ခွင့်ပြုထားတဲ့လမ်းတွေ
      စုပြထားတဲ့ ဒီပုံက State Machine ဖြစ်တယ်။
    sources:
      - title: "NIST Dictionary — Finite state machine"
        url: "https://xlinux.nist.gov/dads/HTML/finiteStateMachine.html"
      - title: "Stately Docs — Finite states"
        url: "https://stately.ai/docs/finite-states"
      - title: "Stately Docs — State machines"
        url: "https://stately.ai/docs/machines"
      - title: "Stately Docs — Events and transitions"
        url: "https://stately.ai/docs/transitions"
      - title: "Stately Docs — Final states"
        url: "https://stately.ai/docs/final-states"
    actions:
      - id: open-order-domain-board
        type: whiteboard.apply
        at: { mark: open-domain-board }
        open: true
        maximized: true
        clear: true
        upsertIds: [domain-title, domain-subtitle]
        drawMs: 700
      - id: draw-received-order-state
        type: whiteboard.apply
        at: { mark: draw-received-state }
        upsertIds: [received-box, received-label, received-note]
        drawMs: 650
      - id: draw-preparing-order-state
        type: whiteboard.apply
        at: { mark: draw-preparing-state }
        upsertIds: [arrow-one, event-one, preparing-box, preparing-label, preparing-note]
        drawMs: 950
      - id: draw-packing-order-state
        type: whiteboard.apply
        at: { mark: draw-packing-state }
        upsertIds: [arrow-two, event-two, packing-box, packing-label, packing-note]
        drawMs: 950
      - id: draw-ready-order-state
        type: whiteboard.apply
        at: { mark: draw-ready-state }
        upsertIds: [arrow-on-done, event-on-done, ready-box, ready-label, ready-note]
        drawMs: 950
      - id: draw-served-order-state
        type: whiteboard.apply
        at: { mark: draw-served-state }
        upsertIds: [arrow-three, event-three, served-box, served-label, served-note]
        drawMs: 950

  - id: context-actions-guards
    narration: >
      ဒီလမ်းပုံမှာ မပါတဲ့ အသေးစိတ်တစ်ခု ရှိသေးတယ်။ Ready ရောက်တဲ့အခါ
      လက်ဖက်ရည်နဲ့ ပလာတာ နှစ်မျိုးလုံး စစ်ရမယ်။ [[mark:draw-domain-context]]
      အော်ဒါကတ်အောက်မှာ အမှန်ခြစ်နှစ်ခု ထည့်မယ်။ ပထမတစ်ခုစစ်ပြီးလည်း အော်ဒါက
      Ready မှာပဲရှိတယ်။ နေရာမပြောင်းဘဲ ကတ်ပေါ်ကမှတ်တမ်းပဲ ပြောင်းသွားတာ။
      ဒီလို အဆင့်နဲ့အတူ သယ်သွားရတဲ့ data ကို Context လို့ခေါ်ပြီး ကတ်ကို
      ပြောင်းပေးတဲ့အလုပ်ကို Action လို့ခေါ်မယ်။ [[mark:draw-domain-guard]]
      Ready ရဲ့ထွက်ပေါက်မှာ စစ်ဆေးရေးဂိတ်ရှိတယ်။ အမှန်ခြစ်က ၂ ခုမှာ ၂ ခု
      မပြည့်သေးရင် တည်ခင်းဖို့တောင်းဆိုလည်း တံခါးမဖွင့်ဘူး။ ဒီလို
      ဖြတ်သွားခွင့်ရှိမရှိ စစ်တဲ့စည်းမျဉ်းက Guard ပါ။
      [[mark:emphasize-domain-rule]] တစ်ခုမှားနေရင် Preparing ဆီပြန်ပြီး
      အမှန်ခြစ်တွေကို ပြန်စမယ်။ UI က တည်ခင်းခလုတ်ကို ပိတ်ပြနိုင်ပေမဲ့
      တကယ့်စည်းမျဉ်းက ဒီဂိတ်ထဲမှာ ရှိတယ်။
    sources:
      - title: "Stately Docs — Context"
        url: "https://stately.ai/docs/context"
      - title: "Stately Docs — Actions"
        url: "https://stately.ai/docs/actions"
      - title: "Stately Docs — Guards"
        url: "https://stately.ai/docs/guards"
      - title: "Stately Docs — Eventless and targetless transitions"
        url: "https://stately.ai/docs/transitions"
    actions:
      - id: draw-order-context
        type: whiteboard.apply
        at: { mark: draw-domain-context }
        upsertIds: [context-box, context-label, context-action]
        drawMs: 900
      - id: draw-order-guard
        type: whiteboard.apply
        at: { mark: draw-domain-guard }
        upsertIds: [guard-box, guard-label, guard-rule]
        drawMs: 900
      - id: emphasize-domain-invariant
        type: whiteboard.apply
        at: { mark: emphasize-domain-rule }
        upsertIds: [domain-rule]
        drawMs: 700

  - id: actor-react-model
    narration: >
      ပုံဆွဲပြီးသွားပေမဲ့ စည်းမျဉ်းစာရွက်က သူ့ဘာသာ အော်ဒါကို မရွှေ့နိုင်ဘူး။
      [[mark:draw-machine-logic]] ဘယ်အဆင့်ကနေ ဘယ်အဆင့်ကို သွားခွင့်ရှိလဲဆိုတာ
      ဒီစာရွက်က ပြောပေးရုံပါ။ [[mark:draw-running-actor]] အော်ဒါနံပါတ် ၂၄ ကို
      တကယ်စဖွင့်လိုက်မှ လက်ရှိအဆင့်နဲ့ အော်ဒါကတ်ကို ကိုင်ထားတဲ့ Actor တစ်ခု
      အလုပ်လုပ်လာတယ်။ နောက်အော်ဒါနံပါတ် ၂၅ ကလည်း စည်းမျဉ်းတူတူ သုံးပေမဲ့
      သူ့ Actor၊ သူ့အဆင့်နဲ့ သူ ရှိမယ်။ [[mark:draw-react-loop]] ကောင်တာမျက်နှာပြင်က
      Actor ဆီက အခြေအနေကိုယူပြီး ပြတယ်။ လူက ခလုတ်နှိပ်ရင် Event ကို Actor ဆီ
      ပြန်ပို့တယ်။ Actor က စည်းမျဉ်းကိုစစ်ပြီး နောက်အခြေအနေကို ပြန်ပေးတယ်။
      React က နောက်အဆင့်ကို မရွေးဘူး။ React က ပြပြီး တောင်းဆိုမှုကိုပို့တယ်။
      Actor က ဆုံးဖြတ်တယ်။ ဒီတာဝန်ခွဲထားတာကိုပဲ မှတ်ထားရမယ်။
    sources:
      - title: "Stately Docs — Actors"
        url: "https://stately.ai/docs/actors"
