# AI Builder, lesson 17: keeping it simple (Burmese, docs kind).
#
# Start state (ws/): base-docs (package.json with a no-op dev script, notes.md, unused) +
# docs/plan.md (COURSE-KIT §4.7, as L13 leaves it), docs/decisions.md (§4.10: ADR-001, ADR-002, as
# L16 leaves it) and AGENTS.md (§4.4 base, as L10 leaves it). All three from tools/binder.ts. Nothing runs.
#
# Typed (insert-only, all from the binder): ADR-003 appended to decisions.md (block, then the
# Consequences line selected); the line under plan.md's table that removes Task 5; AGENTS.md's
# `## Simplicity` section (line-by-line). Final files == binder (tools/sim-docs.ts; DESIGN.md).
#
# Boards: (A) the same feature, changing the menu, as five parts vs two, reopened later with the
# agent's pull towards the five-part design (violet); (Q) four questions before adding anything,
# applied to Task 5 (green); (Z) the quiz (a message queue for 40 orders a morning).
#
# Build: bun ~/Documents/ai-builder-course-work/tools/build-lesson.ts template.yaml ws ai-builder-17-simplicity.yaml
schemaVersion: 1
lesson:
  slug: ai-builder-17-simplicity
  title: "AI Builder 17: ရိုးရှင်းအောင် ထိန်းခြင်း"
  locale: my-MM
  workspace:
    lessonType: javascript
    name: AI Builder
    entryFilePath: docs/plan.md
    sidebarStartsCollapsed: true
    files:
      AGENTS.md: |
        # AGENTS.md · Shwe Tea House pre-order app

        ## Project
        A pre-order web app for a tea shop in Yangon. Customers order ahead and pick up at the counter.
        Read docs/spec.md before any change. If the spec does not answer a question, stop and ask.

        ## Stack
        Plain HTML, CSS and JavaScript. No framework.

        ## Rules
        - Prices are whole kyat (integers). Never use decimals.
        - Customer-facing text is Burmese (Unicode).
        - Times are Asia/Yangon.
        - Ask before adding any package.
        - One task at a time. Keep each change small.

        ## Done means
        - The acceptance criteria named in the task pass.
        - Summarise what you changed and what you did not do.
      docs/decisions.md: |
        # Decisions

        ## ADR-001 · v1 မှာ ငွေကို ကောင်တာမှာပဲ ချေမယ် (2026-11-08)
        Context — online ငွေပေးချေမှုက risk အများဆုံး၊ ကုန်ကျစရိတ် အများဆုံး။ ကောင်တာမှာ ချေတာ အခုလည်း အလုပ်ဖြစ်နေတယ်။
        Options — online ငွေပေးချေမှု ထည့်မယ် / ကောင်တာမှာပဲ ချေမယ်
        Decision — ကောင်တာမှာပဲ ချေမယ်။
        Consequences — လာမယူတဲ့ အော်ဒါ ရှိနိုင်တယ်။ တစ်မနက် 5 ခုထက် များရင် ပြန်စဉ်းစားမယ်။

        ## ADR-002 · database ကို ကိုယ်တိုင် မ run ဘဲ managed service သုံးမယ် (2026-11-08)
        Context — ကိုယ်တစ်ယောက်တည်း၊ server ထိန်းဖို့ အချိန် မရှိဘူး။
        Options — ကိုယ်ပိုင် server ပေါ်မှာ run မယ် / managed database service သုံးမယ်
        Decision — managed service ရဲ့ free tier ကို သုံးမယ်။
        Consequences — service ကို မှီခိုရမယ်။ backup နဲ့ export လုပ်လို့ရတာ စစ်ထားရမယ်။
      docs/plan.md: |
