build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 4108

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  - id: recall-overview
    chapter: "Nesting ဆိုတာ ဘာလဲ"
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ parent ရဲ့ တန်ဖိုးတွေ child ဆီ inheritance နဲ့ ဆင်းသွားတာကို
      မြင်ခဲ့ပါတယ်။ [[mark:start-server]] ဒီလို ပြောနေတုန်းမှာပဲ၊ board နောက်မှာ dev server ကို
      စ နေပါပြီ။ [[mark:draw-flat]] ဒီ lesson မှာတော့ selector တူတူကို ထပ်ခါထပ်ခါ မရေးရအောင်
      လုပ်ပါမယ်။ ဒါက menu card တွေအတွက် rule ငါးခုကို အခုထိ ရေးခဲ့တဲ့ အတိုင်း ရေးထားတာပါ။
      [[mark:circle-repeat]] စာကြောင်းတိုင်းက card selector နဲ့ စ နေလို့ ငါးခါ ထပ်နေပါတယ်။ class
      နာမည် ပြောင်းရင် ငါးနေရာ လိုက်ပြင်ရပါမယ်။ [[mark:draw-nested]] ညာဘက်မှာတော့ card selector ကို
      တစ်ခါပဲ ရေးပြီး၊ ကျန်တဲ့ rule တွေကို သူ့ rule ထဲမှာ ထည့်ရေးထားပါတယ်။ browser က အထဲက selector
      တစ်ခုစီကို အပြင်က selector နဲ့ ဆက်ဖတ်လို့၊ ဘယ်ဘက်က selector ငါးခုနဲ့ အတူတူပဲ ဖြစ်ပါတယ်။
      [[mark:name-nesting]] rule ထဲမှာ rule တွေကို ဒီလို ထည့်ရေးတာကို nesting လို့ ခေါ်ပါတယ်။
      component တစ်ခုရဲ့ style တွေ block တစ်ခုထဲ စုနေပြီး၊ CSS ကိုလည်း HTML ရဲ့ ဖွဲ့စည်းပုံအတိုင်း
      စီရေးလို့ ရပါတယ်။ [[mark:draw-native]] Sass လို tool တွေမှာ nesting ကို နှစ်ပေါင်းများစွာ
      သုံးလာကြပေမယ့်၊ ရိုးရိုး CSS ပြန်ပြောင်းပေးတဲ့ build step တစ်ခု လိုပါတယ်။ အခုတော့ browser
      ကိုယ်တိုင် nesting ကို နားလည်ပြီး၊ 2023 ခုနှစ် နှစ်ကုန်ကတည်းက browser အဓိက အားလုံးမှာ သုံးလို့
      ရနေပါပြီ။
    sources:
      - title: "web.dev Learn CSS — Nesting"
        url: "https://web.dev/learn/css/nesting"
      - title: "MDN — Using CSS nesting"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_nesting/Using_CSS_nesting"
      - title: "CSS Nesting Module Level 1"
        url: "https://drafts.csswg.org/css-nesting-1/"
      - title: "web.dev — Baseline"
        url: "https://web.dev/baseline"
      - title: "Web Platform Status — CSS nesting"
        url: "https://webstatus.dev/features/nesting"
    actions:
      - id: open-overview-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      # Runs in the background (boot + pnpm install + spawn); waitForReady sits
      # on the preview mark in the next scene, well over 40 s of narration
      # later.
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 45000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-flat
        type: whiteboard.apply
        at: { mark: draw-flat }
        upsertIds: [a-flat-label, a-flat-1, a-flat-2, a-flat-3, a-flat-4, a-flat-5]
        drawMs: 3000
      - id: circle-repeat
        type: whiteboard.apply
        at: { mark: circle-repeat }
        upsertIds: [a-repeat-circle, a-repeat-label]
        drawMs: 1600
      - id: draw-nested
        type: whiteboard.apply
        at: { mark: draw-nested }
        upsertIds:
          [
            a-nested-label,
            a-nest-open,
            a-nest-1,
            a-nest-2,
            a-nest-3,
            a-nest-4,
            a-nest-5,
            a-nest-close,
          ]
        drawMs: 4000
      - id: name-nesting
        type: whiteboard.apply
        at: { mark: name-nesting }
        upsertIds: [a-once-label, a-once-check]
        drawMs: 1200
      - id: draw-native
        type: whiteboard.apply
        at: { mark: draw-native }
        upsertIds: [a-native-note]
        drawMs: 1500

  - id: code-tour
    narration: >
      [[mark:close-overview-board]] project ကို ကြည့်ရအောင်။ [[mark:open-index]] ဒါက page ရဲ့ HTML
      ဖိုင်ပါ၊ အရင် lesson တွေက လက်ဖက်ရည်ဆိုင် အတိုင်းပါပဲ။ header၊ ကြိုဆိုတဲ့ အပိုင်း၊ သောက်စရာ
      menu နဲ့ footer ပါပါတယ်။ [[mark:select-note]] သံပုရာရည် card ထဲမှာ box တစ်ခုနဲ့ ထုပ်ထားတဲ့
      မှတ်ချက် တိုတိုလေး အသစ် ပါပါတယ်။ ဒါကြောင့် ဒီ card မှာ စာပိုဒ် နှစ်ခု ရှိပေမယ့်၊ card ရဲ့
      တိုက်ရိုက် child ဖြစ်တာက တစ်ခုပဲ ရှိပါတယ်။ [[mark:select-promo]] footer မှာလည်း ဈေးနှုန်းနဲ့
      link ပါတဲ့ promo စာကြောင်း အသစ် ပါပါတယ်။ [[mark:open-styles]] ကိုယ့် CSS ဖိုင်က အလွတ်
      ပြန်ဖြစ်နေပါတယ်။ ဒီတစ်ခါ base ဖိုင်မှာ card တွေရဲ့ နောက်ခံ၊ padding နဲ့ card တွေကြားက နေရာလွတ်
      မပါပါဘူး။ အဲဒါတွေကို ဒီ lesson မှာ ကိုယ်တိုင် ထည့်သွားပါမယ်။ [[mark:preview-opens]] preview
      ပွင့်လာပြီး၊ menu card တွေဆီ scroll ဆင်းထားပါတယ်။ card တွေက တစ်ခုနဲ့ တစ်ခု ကပ်နေပြီး၊
      စာသားတွေကလည်း ဘောင်နဲ့ ထိနေပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Nesting"
        url: "https://web.dev/learn/css/nesting"
      - title: "MDN — Child combinator"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/Child_combinator"
    actions:
      - id: close-overview-board
        type: whiteboard.apply
        at: { mark: close-overview-board }
        open: false
      - id: open-index
        type: workspace.openFile
        at: { mark: open-index }
        path: index.html
      - id: select-note
        type: editor.select
        at: { mark: select-note }
        target:
          {
            file: index.html,
            text: "<div class=\"note\" data-testid=\"note\">\n              <p>ရေခဲ မပါဘဲလည်း မှာလို့ ရပါတယ်</p>\n            </div>",
            occurrence: 1,
          }
      - id: select-promo
        type: editor.select
        at: { mark: select-promo }
        target: { file: index.html, text: '<p class="promo" data-testid="promo">', occurrence: 1 }
      - id: open-styles
        type: workspace.openFile
        at: { mark: open-styles }
        path: styles.css
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { mark: preview-opens }
        timeoutMs: 20000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-dev-server }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-hero
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: hero }
        textContains: "မင်္ဂလာပါ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-note
        type: expect.preview
        at: { afterAction: expect-hero }
        timeoutMs: 5000
        target: { by: testId, value: note }
        textContains: "ရေခဲ မပါဘဲလည်း"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: scroll-to-cards
        type: preview.scroll
        at: { afterAction: expect-note }
        timeoutMs: 5000
        top: 420
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: collapse-runner-dock
        type: runtime.collapseDock
        at: { afterAction: scroll-to-cards }

  - id: nest-descendant
    chapter: "Card rule ထဲမှာ rule တွေ ရေးကြည့်ရအောင်"
    narration: >
      [[mark:type-card]] menu card အတွက် ရိုးရိုး rule တစ်ခုနဲ့ စကြည့်ရအောင်။ ထဲမှာ သိပြီးသား
      declaration တွေပဲ ပါပါတယ်။ အဖြူရောင် နောက်ခံ ပေးပြီး၊ စာသားတွေ ဘောင်ကနေ ခွာသွားအောင် padding
      ထည့်ပါမယ်။ [[mark:after-card]] card တွေ အဖြူရောင် box ဖြစ်သွားပါပြီ။ [[mark:type-h3]] အခု card
      selector နဲ့ စတဲ့ rule နောက်တစ်ခု ထပ်ရေးမယ့်အစား၊ သောက်စရာ နာမည်တွေအတွက် rule ကို card rule
      ထဲမှာပဲ ထည့်ရေးပါမယ်။ [[mark:after-h3]] နာမည်တွေ အညိုရောင် ဖြစ်သွားပါပြီ။ [[mark:select-h3]]
      အထဲက selector ကို ကြည့်ပါ။ ခေါင်းစဉ် element ရဲ့ နာမည် သက်သက်ပဲ ဖြစ်ပြီး ရှေ့မှာ ဘာမှ
      မပါပါဘူး။ browser က သူ့ကို အပြင်က selector ရဲ့ descendant အဖြစ် ဆက်ဖတ်လို့၊ menu card ထဲမှာ
      ဘယ်လောက် နက်နက် ရှိတဲ့ ခေါင်းစဉ်ကို မဆို ရွေးပါတယ်။ board ပေါ်က ရိုးရိုး rule နဲ့ အတူတူပါပဲ။
      [[mark:relaxed]] nesting ကို စထည့်ခဲ့တဲ့ browser version တွေမှာတော့ element နာမည်ရှေ့မှာ
      သင်္ကေတ တစ်ခု ထည့်ရခဲ့ပါတယ်။ tutorial အဟောင်းတွေမှာ အဲဒီလို တွေ့နိုင်ပေမယ့်၊ အခု browser
      တွေမှာ မလိုတော့ပါဘူး။ [[mark:type-price]] ဈေးနှုန်းအတွက်လည်း rule တစ်ခု nest လုပ်ပါမယ်။
      ဒီတစ်ခါ အထဲက selector က class ဖြစ်ပေမယ့် အလုပ်လုပ်ပုံ အတူတူပါပဲ။ menu card ထဲက ဈေးနှုန်းကို
      ရွေးတာပါ။ [[mark:after-price]] card ဈေးနှုန်းတွေ အနီရောင် ဖြစ်သွားပါပြီ။
    sources:
      - title: "web.dev Learn CSS — Nesting: grouping and establishing relationships"
        url: "https://web.dev/learn/css/nesting#grouping_and_establishing_relationships"
      - title: "MDN — Using CSS nesting"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_nesting/Using_CSS_nesting"
      - title: "CSS Nesting Module Level 1 — syntax"
        url: "https://drafts.csswg.org/css-nesting-1/#syntax"
      - title: "Chrome for Developers — CSS nesting relaxed syntax update"
        url: "https://developer.chrome.com/blog/css-nesting-relaxed-syntax-update"
    actions:
      - id: type-card
        type: editor.type
        at: { mark: type-card }
        cadence: fast-explainer
        target: { file: styles.css, after: "", occurrence: 1 }
        text: ".menu-card {\n  background: white;\n  padding: 12px;\n}\n"
      - id: expect-cards
        type: expect.preview
        at: { mark: after-card }
        timeoutMs: 4000
        target: { by: testId, value: menu-drinks }
        textContains: "ဖာလူဒါ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-h3
        type: editor.type
        at: { mark: type-h3 }
        cadence: fast-explainer
        target: { file: styles.css, after: "  padding: 12px;\n", occurrence: 1 }
        text: "\n  h3 {\n    color: saddlebrown;\n  }\n"
      - id: select-h3
        type: editor.select
        at: { mark: select-h3 }
        target: { file: styles.css, text: "h3 {", occurrence: 1 }
      - id: type-price
        type: editor.type
        at: { mark: type-price }
        cadence: fast-explainer
        target: { file: styles.css, after: "    color: saddlebrown;\n  }\n", occurrence: 1 }
        text: "\n  .price {\n    color: firebrick;\n  }\n"
      - id: expect-card-price
        type: expect.preview
        at: { mark: after-price }
        timeoutMs: 4000
        target: { by: testId, value: price-laphet-yay }
        textContains: "1,500 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: leading-combinator
    narration: >
      [[mark:type-child]] nested selector ကို combinator နဲ့လည်း စလို့ ရပါတယ်။ စာပိုဒ်တွေအတွက်
      selector ကို child combinator နဲ့ စကြည့်ရအောင်။ [[mark:after-child]] ဖော်ပြချက်တွေ
      စာလုံးစောင်း ဖြစ်သွားပါပြီ။ [[mark:select-child]] ဒီ selector က menu card ရဲ့ တိုက်ရိုက် child
      ဖြစ်တဲ့ စာပိုဒ်တွေကိုပဲ ရွေးပါတယ်။ ဒါကြောင့် သံပုရာရည် card ထဲက မှတ်ချက် စာပိုဒ်ကတော့
      မစောင်းပါဘူး။ သူက card ထဲမှာ ရှိပေမယ့် မှတ်ချက် box ထဲမှာ ထပ်ရှိနေလို့၊ card ရဲ့ တိုက်ရိုက်
      child မဟုတ်ပါဘူး။ [[mark:siblings]] sibling combinator တွေနဲ့လည်း စလို့ ရပါတယ်။ ဒါပေမဲ့ အဲဒီ
      rule က card ထဲက element ကို မဟုတ်ဘဲ card ရဲ့ နောက်က sibling ကို style ပေးပါတယ်။ ဒါကြောင့် nest
      လုပ်ထားတဲ့ rule တိုင်းက card ထဲက element ကို ရွေးတာ မဟုတ်ပါဘူး။
    sources:
      - title: "web.dev Learn CSS — Nesting: grouping and establishing relationships"
        url: "https://web.dev/learn/css/nesting#grouping_and_establishing_relationships"
      - title: "MDN — Using CSS nesting: combinators"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_nesting/Using_CSS_nesting"
      - title: "MDN — Child combinator"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/Child_combinator"
      - title: "MDN — Next-sibling combinator"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/Next-sibling_combinator"
    actions:
      - id: type-child
        type: editor.type
        at: { mark: type-child }
        cadence: fast-explainer
        target: { file: styles.css, after: "    color: firebrick;\n  }\n", occurrence: 1 }
        text: "\n  > p {\n    font-style: italic;\n  }\n"
      - id: select-child
        type: editor.select
        at: { mark: select-child }
        target: { file: styles.css, text: "> p {", occurrence: 1 }
      - id: expect-note-still-there
        type: expect.preview
        at: { mark: after-child }
        timeoutMs: 4000
        target: { by: testId, value: card-lime-juice }
        textContains: "ရေခဲ မပါဘဲလည်း"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: ampersand
    chapter: "Ampersand က ဘာကို ကိုယ်စားပြုလဲ"
    narration: >
      [[mark:type-featured]] တစ်ခါတလေ card ကိုယ်တိုင်ကို style ပေးချင်ပါတယ်၊ ဥပမာ featured class
      ပါတဲ့ လက်ဖက်ရည် card ရဲ့ border ကိုပဲ ပြောင်းချင်တာမျိုးပါ။ class ကိုပဲ nest လုပ်လိုက်ရင်
      browser က card ရဲ့ အထဲမှာ ရှာမှာ ဖြစ်လို့၊ nesting selector ဖြစ်တဲ့ ampersand ကို သုံးရပါတယ်။
      [[mark:after-featured]] လက်ဖက်ရည် card တစ်ခုတည်းမှာပဲ border လိမ္မော်ရောင် ဖြစ်သွားပါပြီ။
      [[mark:select-amp-featured]] ဒီ ampersand က အပြင်က selector ကို ကိုယ်စားပြုပါတယ်။ class နဲ့
      space မခြားဘဲ ကပ်ရေးထားလို့၊ featured class လည်း ပါတဲ့ menu card လို့ ဆိုလိုပါတယ်။ ဒါကြောင့်
      compound selector ဖြစ်ပါတယ်။ [[mark:type-badge]] ampersand ကို နောက်တစ်ခါ ရေးပါမယ်။
      ဒီတစ်ခါတော့ ampersand နောက်မှာ space တစ်ခု ခြားပြီး၊ card ထဲက badge ကို ရွေးပါမယ်။
      လိမ္မော်ရောင် နောက်ခံပေါ်မှာ ဖတ်ရ လွယ်အောင် စာလုံးကို အနက် ပေးပါမယ်။ [[mark:after-badge]] အသစ်
      ဆိုတဲ့ badge လေး လိမ္မော်ရောင် ဖြစ်သွားပါပြီ။ [[mark:select-amp-badge]] ဒီ selector မှာတော့
      space ခြားထားလို့ descendant ဖြစ်ပြီး၊ menu card ထဲက badge ကို ရွေးပါတယ်။ space တစ်ခုနဲ့တင်
      ရွေးတဲ့ element ပြောင်းသွားပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Nesting: define explicit relationships with the & selector"
        url: "https://web.dev/learn/css/nesting#define_explicit_relationships_with_the_selector"
      - title: "MDN — & nesting selector"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Selectors/Nesting_selector"
      - title: "CSS Nesting Module Level 1 — the nesting selector"
        url: "https://drafts.csswg.org/css-nesting-1/#nest-selector"
    actions:
      - id: type-featured
        type: editor.type
        at: { mark: type-featured }
        cadence: fast-explainer
        target: { file: styles.css, after: "    font-style: italic;\n  }\n", occurrence: 1 }
        text: "\n  &.featured {\n    border-color: darkorange;\n  }\n"
      - id: expect-featured
        type: expect.preview
        at: { mark: after-featured }
        timeoutMs: 4000
        target: { by: testId, value: card-laphet-yay }
        attribute: { name: class, value: "menu-card featured" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-amp-featured
        type: editor.select
        at: { mark: select-amp-featured }
        target: { file: styles.css, text: "&.featured", occurrence: 1 }
      - id: type-badge
        type: editor.type
        at: { mark: type-badge }
        cadence: fast-explainer
        target: { file: styles.css, after: "    border-color: darkorange;\n  }\n", occurrence: 1 }
        text: "\n  & .badge {\n    background: darkorange;\n    color: black;\n  }\n"
      - id: expect-badge
        type: expect.preview
        at: { mark: after-badge }
        timeoutMs: 4000
        target: { by: testId, value: badge-laphet-yay }
        textContains: "အသစ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-amp-badge
        type: editor.select
        at: { mark: select-amp-badge }
        target: { file: styles.css, text: "& .badge", occurrence: 1 }

  - id: ampersand-board
    narration: >
      [[mark:open-amp-board]] နှစ်ခုကို ယှဉ်ကြည့်ရအောင်။ [[mark:draw-amp-same]] ampersand နေရာမှာ
      အပြင်က selector ကို အစားထိုးကြည့်ပါ။ space မခြားရင် အပိုင်းတွေ ပေါင်းပြီး compound selector
      တစ်ခု ဖြစ်သွားလို့၊ element တစ်ခုတည်းကိုပဲ ပြောတာပါ။ [[mark:draw-amp-inside]] space
      ခြားရင်တော့ descendant ဖြစ်လို့၊ badge က card ရဲ့ အထဲမှာ ရှိရပါမယ်။ [[mark:draw-amp-hover]]
      pseudo-class တွေမှာ ဒီ ကွာခြားချက်က အရေးအကြီးဆုံးပါ။ space မခြားရင် pointer တင်ထားတဲ့ card
      ကိုယ်တိုင်ပါ။ space ခြားရင်တော့ card ထဲမှာ pointer အောက် ရောက်နေတဲ့ ဘယ် element မဆို
      ဖြစ်သွားလို့၊ များသောအားဖြင့် ကိုယ် လိုချင်တာ မဟုတ်ပါဘူး။ [[mark:draw-amp-optional]] ခေါင်းစဉ်
      rule လို ရိုးရိုး descendant အတွက်တော့ ampersand ထည့်စရာ မလိုပါဘူး။ ထည့်ရေးရင် ဆက်စပ်ပုံ
      ပိုမြင်သာရုံပါပဲ၊ ရလဒ်ကတော့ အတူတူပါ။
    sources:
      - title: "web.dev Learn CSS — Nesting: when is & required"
        url: "https://web.dev/learn/css/nesting#when_is_required"
      - title: "MDN — & nesting selector"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Selectors/Nesting_selector"
      - title: "MDN — Compound selectors"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_selectors/Selector_structure#compound_selector"
    actions:
      - id: open-amp-board
        type: whiteboard.apply
        at: { mark: open-amp-board }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-amp-same
        type: whiteboard.apply
        at: { mark: draw-amp-same }
        upsertIds: [b-r1-code, b-r1-arrow, b-r1-flat, b-r1-note]
        drawMs: 2400
      - id: draw-amp-inside
        type: whiteboard.apply
        at: { mark: draw-amp-inside }
        upsertIds: [b-r2-code, b-r2-arrow, b-r2-flat, b-r2-note]
        drawMs: 2400
      - id: draw-amp-hover
        type: whiteboard.apply
        at: { mark: draw-amp-hover }
        upsertIds: [b-r3-code, b-r3-arrow, b-r3-note, b-r4-code, b-r4-arrow, b-r4-note]
        drawMs: 3200
      - id: draw-amp-optional
        type: whiteboard.apply
        at: { mark: draw-amp-optional }
        upsertIds: [b-r5-code, b-r5-note]
        drawMs: 1600

  - id: hover-demo
    narration: >
      [[mark:close-amp-board]] space မခြားတဲ့ ပုံစံနဲ့ hover style တစ်ခု ရေးကြည့်ရအောင်။
      [[mark:type-hover]] ampersand နဲ့ hover pseudo-class ကို ကပ်ရေးပါမယ်။ hover က pointer
      တင်ထားတဲ့ အခြေအနေ ဖြစ်လို့၊ pointer ရောက်နေတုန်း card နောက်ခံ ဝါဖျော့ဖျော့ ဖြစ်ပါမယ်။
      [[mark:click-card]] pointer တင်ထားရုံနဲ့တော့ lesson ထဲမှာ hover ကို မပြနိုင်လို့၊ ကော်ဖီ card
      ကို နှိပ်လိုက်ပါမယ်။ နှိပ်လိုက်တဲ့ card ကို lesson က pointer တင်ထားသလို ပြပေးပါတယ်။
      [[mark:after-hover]] ကော်ဖီ card ရဲ့ နောက်ခံ ဝါဖျော့ဖျော့ ဖြစ်သွားပြီး၊ ကျန်တဲ့ card တွေက
      အဖြူအတိုင်းပါ။ [[mark:unhover-card]] တခြား နေရာကို နှိပ်လိုက်ရင်တော့ pointer ဖယ်လိုက်သလိုပဲ၊
      ကော်ဖီ card အဖြူ ပြန်ဖြစ်သွားပါတယ်။
    sources:
      - title: "MDN — :hover"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/:hover"
      - title: "web.dev Learn CSS — Nesting: when is & required"
        url: "https://web.dev/learn/css/nesting#when_is_required"
    actions:
      - id: close-amp-board
        type: whiteboard.apply
        at: { mark: close-amp-board }
        open: false
      - id: type-hover
        type: editor.type
        at: { mark: type-hover }
        cadence: fast-explainer
        target: { file: styles.css, after: "    color: black;\n  }\n", occurrence: 1 }
        text: "\n  &:hover {\n    background: wheat;\n  }\n"
      - id: click-card
        type: preview.click
        at: { mark: click-card, offsetMs: 500 }
        timeoutMs: 5000
        target: { by: testId, value: card-coffee }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-coffee
        type: expect.preview
        at: { afterAction: click-card }
        timeoutMs: 4000
        target: { by: testId, value: card-coffee }
        textContains: "ကော်ဖီ"
        retry: { maxAttempts: 3, delayMs: 300 }
      # Moves rrweb's replay hover emulation off the coffee card: the drinks
      # heading is not an ancestor of any card, so every card is white again.
      - id: unhover-card
        type: preview.click
        at: { mark: unhover-card, offsetMs: 500 }
        timeoutMs: 5000
        target: { by: testId, value: drinks-title }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-drinks-title
        type: expect.preview
        at: { afterAction: unhover-card }
        timeoutMs: 4000
        target: { by: testId, value: drinks-title }
        textContains: "သောက်စရာ"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: sibling-and-flip
    narration: >
      [[mark:type-sibling]] ampersand ကို selector တစ်ခုထဲမှာ နှစ်ခါလည်း ရေးလို့ ရပါတယ်။ card
      တွေကြားမှာ နေရာလွတ် ထည့်ဖို့ ampersand နှစ်ခုကို next-sibling combinator နဲ့ ဆက်ပြီး၊
      အပေါ်ဘက်မှာ margin ပေးပါမယ်။ [[mark:after-sibling]] card တွေကြားမှာ နေရာလွတ် ပေါ်လာပေမယ့်၊ ပထမ
      card ရဲ့ အပေါ်မှာတော့ မရှိပါဘူး။ [[mark:select-sibling]] ဒီ selector က menu card နောက်မှာ
      ကပ်လျက် ရှိတဲ့ menu card ကို ရွေးလို့၊ ရှေ့မှာ card မရှိတဲ့ ပထမ card က မကိုက်ပါဘူး။
      [[mark:scroll-footer]] အခု footer ကို ကြည့်ရအောင်။ promo စာကြောင်းထဲက ဈေးနှုန်းက အရောင်ရင့်တဲ့
      နောက်ခံပေါ်မှာ အညိုရောင် ဖြစ်နေလို့ ဖတ်ရ ခက်ပါတယ်။ သူက card ထဲမှာ မရှိလို့ ခုနက ဈေးနှုန်း rule
      နဲ့ မကိုက်ပါဘူး။ [[mark:type-flip]] ဒါကြောင့် ဈေးနှုန်းအတွက် rule တစ်ခု ရေးပြီး၊ သူ့ထဲမှာ
      footer ရဲ့ selector ကို ရှေ့မှာ၊ ampersand ကို နောက်ဆုံးမှာ ထားပါမယ်။ [[mark:after-flip]]
      footer ဈေးနှုန်း ရွှေရောင် ဖြစ်ပြီး၊ card ဈေးနှုန်းတွေ အနီအတိုင်းပါ။ [[mark:select-flip]] ဒီ
      selector မှာ ampersand က နောက်ဆုံးမှာ ရှိလို့၊ footer ထဲမှာ ရှိတဲ့ ဈေးနှုန်းလို့ ဖတ်ရပါတယ်။
      ဒီနည်းနဲ့ ဈေးနှုန်းရဲ့ နေရာအလိုက် ပုံစံတွေကို သူ့ rule ထဲမှာပဲ စုထားနိုင်ပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Nesting: define explicit relationships with the & selector"
        url: "https://web.dev/learn/css/nesting#define_explicit_relationships_with_the_selector"
      - title: "MDN — & nesting selector: appending the & nesting selector"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Selectors/Nesting_selector"
      - title: "MDN — Next-sibling combinator"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/Next-sibling_combinator"
    actions:
      - id: type-sibling
        type: editor.type
        at: { mark: type-sibling }
        cadence: fast-explainer
        target: { file: styles.css, after: "    background: wheat;\n  }\n", occurrence: 1 }
        text: "\n  & + & {\n    margin-top: 12px;\n  }\n"
      - id: expect-falooda
        type: expect.preview
        at: { mark: after-sibling }
        timeoutMs: 4000
        target: { by: testId, value: card-falooda }
        textContains: "ဖာလူဒါ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-sibling
        type: editor.select
        at: { mark: select-sibling }
        target: { file: styles.css, text: "& + &", occurrence: 1 }
      - id: scroll-footer
        type: preview.scroll
        at: { mark: scroll-footer }
        timeoutMs: 5000
        top: 5000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-flip
        type: editor.type
        at: { mark: type-flip }
        cadence: fast-explainer
        target: { file: styles.css, after: "    margin-top: 12px;\n  }\n}\n", occurrence: 1 }
        text: "\n.price {\n  .site-footer & {\n    color: gold;\n  }\n}\n"
      - id: expect-promo-price
        type: expect.preview
        at: { mark: after-flip }
        timeoutMs: 4000
        target: { by: testId, value: price-promo }
        textContains: "600 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-flip
        type: editor.select
        at: { mark: select-flip }
        target: { file: styles.css, text: ".site-footer &", occurrence: 1 }

  - id: depth-board
    chapter: "ဘယ်လောက် နက်နက် ရေးသင့်လဲ"
    narration: >
      [[mark:open-depth]] nested rule ထဲမှာလည်း nested rule တွေ ထပ်ထည့်လို့ ရပါတယ်။
      [[mark:draw-depth-1]] တစ်ဆင့်ဆိုရင် card ထဲက ခေါင်းစဉ်ပါ။ [[mark:draw-depth-2]] နှစ်ဆင့်ဆိုရင်
      card ထဲက မှတ်ချက်ထဲမှာ ရှိတဲ့ စာပိုဒ်ပါ။ [[mark:draw-depth-3]] သုံးဆင့်လည်း ရပြီး၊ CSS မှာ
      အဆင့် ကန့်သတ်ချက် မရှိပါဘူး။ [[mark:draw-depth-stop]] ဒါပေမဲ့ တစ်ဆင့် တိုးတိုင်း selector က
      ရှည်လာပြီး အလေးချိန် များလာလို့ နောက်မှ override လုပ်ရ ခက်ပါတယ်။ ပြီးတော့ HTML ကို နည်းနည်း
      ပြင်တာနဲ့ CSS ပါ လိုက်ပြင်ရနိုင်ပါတယ်။ ဒါကြောင့် နှစ်ဆင့် သုံးဆင့်မှာ ရပ်ပြီး၊ ဒီထက် နက်လာရင်
      rule ကို ခွဲရေးလိုက်ပါ။ [[mark:draw-order]] နောက် အလေ့အကျင့် တစ်ခုက၊ ကိုယ်ပိုင် declaration
      တွေကို အရင် ရေးပြီး nested rule တွေကို နောက်မှ ရေးတာပါ။ [[mark:draw-order-why]] nested rule
      နောက်မှာ ရေးထားတဲ့ declaration ကို အခု browser တွေက ရေးထားတဲ့ နေရာအတိုင်း ထားပေမယ့်၊ browser
      အဟောင်းတွေက အပေါ်ဆုံးကို ရွှေ့လိုက်လို့ ရလဒ် ကွာနိုင်ပါတယ်။ declaration ကို အရင် ရေးထားရင်တော့
      ဘယ် browser မှာမဆို အတူတူ ဖြစ်ပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Nesting: nesting more than one level deep"
        url: "https://web.dev/learn/css/nesting"
      - title: "MDN — CSSNestedDeclarations"
        url: "https://developer.mozilla.org/en-US/docs/Web/API/CSSNestedDeclarations"
      - title: "CSS Nesting Module Level 1 — the nested declarations rule"
        url: "https://drafts.csswg.org/css-nesting-1/#nested-declarations-rule"
    actions:
      - id: open-depth
        type: whiteboard.apply
        at: { mark: open-depth }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-depth-1
        type: whiteboard.apply
        at: { mark: draw-depth-1 }
        upsertIds: [c-l1, c-n1]
        drawMs: 1200
      - id: draw-depth-2
        type: whiteboard.apply
        at: { mark: draw-depth-2 }
        upsertIds: [c-l2, c-n2]
        drawMs: 1200
      - id: draw-depth-3
        type: whiteboard.apply
        at: { mark: draw-depth-3 }
        upsertIds: [c-l3, c-n3]
        drawMs: 1200
      - id: draw-depth-stop
        type: whiteboard.apply
        at: { mark: draw-depth-stop }
        upsertIds: [c-stop, c-stop-line]
        drawMs: 1600
      - id: draw-order
        type: whiteboard.apply
        at: { mark: draw-order }
        upsertIds:
          [c-o-rule, c-o-decl, c-o-nested, c-o-close, c-o-decl-label, c-o-nested-label, c-o-check]
        drawMs: 3200
      - id: draw-order-why
        type: whiteboard.apply
        at: { mark: draw-order-why }
        upsertIds: [c-o-old]
        drawMs: 1400

  - id: nested-media
    chapter: "Rule ထဲမှာ media query ရေးကြည့်ရအောင်"
    narration: >
      [[mark:close-depth]] nest လုပ်လို့ ရတာ rule တွေတင် မဟုတ်ပါဘူး။ [[mark:scroll-top]] ကြိုဆိုတဲ့
      အပိုင်းဆီ ပြန်တက်ကြည့်ရအောင်။ [[mark:type-media]] ကြိုဆိုတဲ့ အပိုင်းရဲ့ rule ထဲမှာ screen
      အကျယ် 40 em ထက် ကျဉ်းမှ အလုပ်လုပ်မယ့် media query တစ်ခု ထည့်ပြီး၊ သူ့ထဲမှာ စာသားကို
      အလယ်ပို့တဲ့ declaration တစ်ခု ထည့်ပါမယ်။ lesson 5 က media query မျိုးပါပဲ၊ ဒီတစ်ခါ rule ထဲမှာ
      ရေးတာပဲ ကွာပါတယ်။ [[mark:after-media]] ကြိုဆိုတဲ့ စာသားတွေ အလယ်ကို ရောက်သွားပါပြီ။ preview က
      ဖုန်းလောက်ပဲ ကျယ်ပြီး 40 em ထက် အများကြီး ကျဉ်းလို့၊ အခြေအနေ မှန်နေတာပါ။ [[mark:select-media]]
      ဒီ declaration ကို ကြည့်ပါ။ media query ထဲမှာ selector မပါဘဲ တိုက်ရိုက် ရေးထားလို့ ကြိုဆိုတဲ့
      အပိုင်းကို style ပေးပါတယ်၊ ဒါပေမဲ့ အခြေအနေ မှန်မှပဲ ဖြစ်ပါတယ်။ ဒီလို screen အကျယ်အလိုက်
      ပြောင်းတဲ့ style တွေကို component ရဲ့ တခြား style ဘေးမှာပဲ ထားနိုင်ပါတယ်။
      [[mark:other-at-rules]] media query လို at sign နဲ့ စတဲ့ rule တွေကို at-rule လို့ ခေါ်ပါတယ်။
      layer၊ browser က feature တစ်ခု နားလည်မှ အလုပ်လုပ်တဲ့ supports နဲ့ နောက်ပိုင်း သင်မယ့်
      container query ကိုလည်း nest လုပ်လို့ ရပါတယ်။ import ကိုတော့ nest လုပ်လို့ မရဘဲ ဖိုင်
      ထိပ်ဆုံးမှာပဲ ရေးရပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Nesting: nesting at-rules"
        url: "https://web.dev/learn/css/nesting#nesting_at-rules"
      - title: "MDN — CSS nesting at-rules"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_nesting/Nesting_at-rules"
      - title: "CSS Nesting Module Level 1 — nesting conditional rules"
        url: "https://drafts.csswg.org/css-nesting-1/#conditionals"
      - title: "MDN — @import"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/@import"
    actions:
      - id: close-depth
        type: whiteboard.apply
        at: { mark: close-depth }
        open: false
      - id: scroll-top
        type: preview.scroll
        at: { mark: scroll-top }
        timeoutMs: 5000
        top: 0
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-media
        type: editor.type
        at: { mark: type-media }
        cadence: fast-explainer
        target: { file: styles.css, after: "    color: gold;\n  }\n}\n", occurrence: 1 }
        text: "\n.hero {\n  @media (width < 40em) {\n    text-align: center;\n  }\n}\n"
      - id: expect-hero-centred
        type: expect.preview
        at: { mark: after-media }
        timeoutMs: 4000
        target: { by: testId, value: order-link }
        textContains: "မှာယူရန်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-media
        type: editor.select
        at: { mark: select-media }
        target: { file: styles.css, text: "text-align: center;", occurrence: 1 }

  - id: specificity-trap
    chapter: "Nesting နဲ့ specificity"
    narration: >
      [[mark:type-trap]] selector list ရဲ့ rule ထဲမှာလည်း nest လုပ်လို့ ရပါတယ်။ link တွေကို
      နှစ်နေရာမှာ style ပေးကြည့်ရအောင်။ header ကို သူ့ ID နဲ့၊ footer ထဲက promo စာကြောင်းကို သူ့
      class နဲ့ ရွေးပါမယ်။ ထဲမှာတော့ ampersand နဲ့ နှစ်နေရာလုံးက link တွေကို ရွေးပြီး အစိမ်းနုရောင်
      ပေးပါမယ်။ [[mark:after-trap]] header link တွေ အစိမ်းနုရောင် ဖြစ်သွားပါပြီ။
      [[mark:scroll-bottom]] footer မှာလည်း promo link က အစိမ်းနုရောင် ဖြစ်နေပေမယ့်၊ promo
      စာကြောင်းထဲ မပါတဲ့ ဖုန်းနံပါတ်နဲ့ Facebook link တွေကတော့ မပြောင်းပါဘူး။ [[mark:type-promo-a]]
      promo link ကို လိမ္မော်ရောင် ပေးချင်လို့၊ promo စာကြောင်းထဲက link တွေအတွက် ရိုးရိုး rule
      တစ်ခုကို ဖိုင်ရဲ့ နောက်ပိုင်းမှာ ထည့်ပါမယ်။ [[mark:after-promo-a]] ဘာမှ မပြောင်းပါဘူး။
      လိမ္မော်ရောင် rule က နောက်မှ ရေးထားပေမယ့် promo link က အစိမ်းနုရောင်အတိုင်းပါပဲ။
    sources:
      - title: "web.dev Learn CSS — Nesting: nesting and specificity"
        url: "https://web.dev/learn/css/nesting#nesting_and_specificity"
      - title: "MDN — Nesting and specificity"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_nesting/Nesting_and_specificity"
    actions:
      - id: type-trap
        type: editor.type
        at: { mark: type-trap }
        cadence: fast-explainer
        target: { file: styles.css, after: "    text-align: center;\n  }\n}\n", occurrence: 1 }
        text: "\n#site-header,\n.promo {\n  & a {\n    color: lightgreen;\n  }\n}\n"
      - id: expect-nav
        type: expect.preview
        at: { mark: after-trap }
        timeoutMs: 4000
        target: { by: testId, value: nav-drinks }
        textContains: "မီနူး"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: scroll-bottom
        type: preview.scroll
        at: { mark: scroll-bottom }
        timeoutMs: 5000
        top: 5000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-promo-a
        type: editor.type
        at: { mark: type-promo-a }
        cadence: fast-explainer
        target: { file: styles.css, after: "    color: lightgreen;\n  }\n}\n", occurrence: 1 }
        text: "\n.promo a {\n  color: orange;\n}\n"
      - id: expect-promo-link
        type: expect.preview
        at: { mark: after-promo-a }
        timeoutMs: 4000
        target: { by: testId, value: promo-link }
        textContains: "မီနူး ကြည့်ရန်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: is-board
    narration: >
      [[mark:open-is-board]] ဘာကြောင့်လဲ ကြည့်ရအောင်။ [[mark:draw-is]] ampersand က အပြင်က selector
      list ကို is pseudo-class နဲ့ ထုပ်ထားသလို အလုပ်လုပ်ပါတယ်။ [[mark:draw-is-score]] lesson 6 မှာ
      မြင်ခဲ့သလို is က သူ့ထဲက အလေးဆုံး selector၊ ဒီမှာဆိုရင် ID ရဲ့ အလေးချိန်ကို ယူပါတယ်။ ဒါကြောင့်
      class နဲ့ ကိုက်တဲ့ promo link တောင် ID အကွက်မှာ တစ်၊ class အကွက်မှာ သုည၊ element အကွက်မှာ တစ်
      ရပါတယ်။ [[mark:draw-is-other]] လိမ္မော်ရောင် rule ကတော့ class တစ်ခုနဲ့ element တစ်ခုပဲ ရပါတယ်။
      ID အကွက်ကို အရင် နှိုင်းယှဉ်လို့ အစိမ်းနုရောင် rule က နိုင်ပါတယ်။ [[mark:draw-is-tip]]
      ဒါကြောင့် အပြင်က selector list ထဲမှာ အလေးချိန် မတူတဲ့ selector တွေ ရောနေရင် သတိထားပါ။ ID
      မပါလည်း ဒီလိုပဲ ဖြစ်ပေမယ့်၊ ID ပါရင် ကွာခြားချက် အကြီးဆုံးပါ။ Sass က selector တစ်ခုချင်းစီကို
      သီးသန့် ခွဲရေးပေးလို့၊ Sass ကနေ ပြောင်းလာတဲ့ code မှာ ရလဒ် ကွာနိုင်ပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Nesting: nesting and specificity"
        url: "https://web.dev/learn/css/nesting#nesting_and_specificity"
      - title: "MDN — Nesting and specificity"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_nesting/Nesting_and_specificity"
      - title: "MDN — :is()"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/:is"
      - title: "web.dev Learn CSS — Specificity"
        url: "https://web.dev/learn/css/specificity"
      - title: "MDN — Specificity"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Cascade/Specificity"
    actions:
      - id: open-is-board
        type: whiteboard.apply
        at: { mark: open-is-board }
        open: true
        clear: true
        upsertIds: [d-title, d-nested]
      - id: draw-is
        type: whiteboard.apply
        at: { mark: draw-is }
        upsertIds: [d-arrow, d-is]
        drawMs: 1800
      - id: draw-is-score
        type: whiteboard.apply
        at: { mark: draw-is-score }
        upsertIds: [d-cols, d-row-is, d-score-is]
        drawMs: 2400
      - id: draw-is-other
        type: whiteboard.apply
        at: { mark: draw-is-other }
        upsertIds: [d-row-promo, d-score-promo, d-win]
        drawMs: 2000
      - id: draw-is-tip
        type: whiteboard.apply
        at: { mark: draw-is-tip }
        upsertIds: [d-tip]
        drawMs: 1400

  - id: invalid-forms
    chapter: "Nesting မှာ မရတဲ့ ရေးနည်းတွေ"
    narration: >
      [[mark:close-is-board]] ကြိုဆိုတဲ့ အပိုင်းကို ပြန်ကြည့်ရအောင်။ သူ့ စာပိုဒ်မှာ lead class
      ပါပါတယ်။ [[mark:type-bad-p]] lead class ရဲ့ rule ထဲမှာ၊ ဒီ class ပါတဲ့ စာပိုဒ်ကို ရွေးပြီး
      font size ကြီးကြီး ပေးကြည့်ပါမယ်။ ampersand ကို အရင် ရေးပြီး element နာမည်ကို နောက်မှ ရေးတဲ့
      ပုံစံကို တမင် စမ်းကြည့်တာပါ။ [[mark:after-bad-p]] ဘာမှ မပြောင်းပါဘူး။ compound selector မှာ
      element နာမည်က ရှေ့ဆုံးမှာ ရှိရလို့ ဒီ selector က မမှန်ပါဘူး။ ဒါကြောင့် browser က ဒီ nested
      rule ကို ကျော်သွားပါတယ်။ [[mark:type-good-p]] အခု ပြောင်းပြန် ရေးကြည့်ရအောင်။ element နာမည်ကို
      အရင် ရေးပြီး ampersand ကို နောက်မှ ထည့်ပါမယ်။ font size ကတော့ အတူတူပါ။ [[mark:after-good-p]]
      ကြိုဆိုတဲ့ စာပိုဒ် ကြီးလာပါပြီ။ lead class ပါ ရှိတဲ့ စာပိုဒ် ဖြစ်လို့ ကိုက်သွားတာပါ။
      [[mark:select-both]] ဒီ rule နှစ်ခုကို ကြည့်ပါ။ browser က မမှန်တဲ့ rule ကို ကျော်သွားပေမယ့်
      ကျန်တဲ့ rule က အလုပ်လုပ်နေပါတယ်။ nested rule တစ်ခု မှားရင် အဲဒီ rule ပဲ ပျက်ပါတယ်။
      [[mark:no-concat]] nesting က Sass လို စာသားတွေကို ဆက်ပေးတာလည်း မဟုတ်ပါဘူး။ Sass မှာ ampersand
      နောက် စာလုံးတွေ ဆက်ရေးရင် ပိုရှည်တဲ့ class နာမည် တစ်ခု ဖြစ်သွားပါတယ်။ CSS မှာတော့ ampersand က
      selector တစ်ခုလုံးကို ကိုယ်စားပြုလို့ class နာမည်ကို အပြည့် ရေးရပါတယ်။
      [[mark:no-pseudo-element]] ပြီးတော့ ampersand က pseudo-element ကို ကိုယ်စား မပြုနိုင်ပါဘူး။
      ဥပမာ card နဲ့ card ရဲ့ before ကို selector list တစ်ခုထဲ ရေးပြီး ampersand နဲ့ style ပေးရင်၊
      card ပဲ ရပြီး before ကတော့ မရပါဘူး။ ampersand နောက်မှာ before ဒါမှမဟုတ် after ရေးတာကတော့
      ရပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Nesting: invalid nesting"
        url: "https://web.dev/learn/css/nesting#invalid_nesting"
      - title: "MDN — Using CSS nesting: concatenation is not possible"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_nesting/Using_CSS_nesting"
      - title: "MDN — & nesting selector"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Selectors/Nesting_selector"
      - title: "CSS Nesting Module Level 1 — the nesting selector"
        url: "https://drafts.csswg.org/css-nesting-1/#nest-selector"
    actions:
      - id: close-is-board
        type: whiteboard.apply
        at: { mark: close-is-board }
        open: false
      - id: scroll-top-again
        type: preview.scroll
        at: { mark: close-is-board }
        timeoutMs: 5000
        top: 0
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-bad-p
        type: editor.type
        at: { mark: type-bad-p }
        cadence: fast-explainer
        target: { file: styles.css, after: "  color: orange;\n}\n", occurrence: 1 }
        text: "\n.lead {\n  &p {\n    font-size: 20px;\n  }\n}\n"
      - id: type-good-p
        type: editor.type
        at: { mark: type-good-p }
        cadence: fast-explainer
        target: { file: styles.css, after: "  &p {\n    font-size: 20px;\n  }\n", occurrence: 1 }
        text: "\n  p& {\n    font-size: 20px;\n  }\n"
      - id: expect-lead
        type: expect.preview
        at: { mark: after-good-p }
        timeoutMs: 4000
        target: { by: testId, value: lead }
        attribute: { name: class, value: lead }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-both
        type: editor.select
        at: { mark: select-both }
        target:
          {
            file: styles.css,
            text: "  &p {\n    font-size: 20px;\n  }\n\n  p& {\n    font-size: 20px;\n  }\n",
            occurrence: 1,
          }

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      ampersand ကို ဘယ် rule ထဲမှာမှ မထည့်ဘဲ ရေးရင်တော့ page ရဲ့ root ဖြစ်တဲ့ html element ကို
      ဆိုလိုပါတယ်၊ ဒါပေမဲ့ သုံးဖို့ ရှားပါတယ်။ [[mark:quiz]] ကိုယ့်ဘာသာ စစ်ကြည့်ပါ။ nesting က
      နှစ်ဆင့်ပဲ ရသလား၊ import ကို rule ထဲ ထည့်လို့ ရသလား။ အဆင့် ကန့်သတ်ချက် မရှိပါဘူး၊ import ကတော့
      မရပါဘူး။ [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ nested selector က descendant ဖြစ်ပြီး၊ combinator
      နဲ့လည်း စလို့ ရပါတယ်။ ampersand ကိုတော့ အပြင်က element ကိုယ်တိုင်ကို ရွေးဖို့၊ ဒါမှမဟုတ်
      footer လို နေရာ တစ်ခုကို ampersand ရှေ့မှာ ထည့်ပြီး အဲဒီ နေရာထဲမှာ ရှိမှ ရွေးဖို့ သုံးပါတယ်။
      media query နဲ့ တခြား at-rule တွေကိုလည်း nest လုပ်လို့ ရပါတယ်။ ampersand ရဲ့ အလေးချိန်ကို is
      လိုပဲ တွက်လို့၊ nested rule တိုင်းက အပြင်က list ထဲက အလေးဆုံး selector ရဲ့ အလေးချိန်ကို
      ယူပါတယ်။ [[mark:part-recap]] ဒါနဲ့ course ရဲ့ ပထမ အပိုင်း ပြီးပါပြီ။ rule၊ box model၊
      selector၊ cascade၊ specificity၊ inheritance နဲ့ nesting ကို လေ့လာခဲ့ပါတယ်။
      [[mark:next-lesson]] နောက် lesson မှာတော့ တန်ဖိုးတွေ အကြောင်း စပြီး၊ အရောင် ရေးနည်း
      အမျိုးမျိုးကို ကြည့်သွားပါမယ်။ ဒါမှ အခုထိ သုံးခဲ့တဲ့ အရောင် နာမည်တွေထက် အများကြီး ပိုတိကျတဲ့
      အရောင်တွေကို ရွေးလို့ ရမှာပါ။
    sources:
      - title: "MDN — & nesting selector: & outside a rule"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Selectors/Nesting_selector"
      - title: "web.dev Learn CSS — Nesting: check your understanding"
        url: "https://web.dev/learn/css/nesting"
      - title: "web.dev Learn CSS — Color"
        url: "https://web.dev/learn/css/color"
    actions:
      - id: expect-card-css
        type: expect.file
        at: { mark: recap }
        path: styles.css
        contains: ".menu-card {\n  background: white;\n  padding: 12px;\n\n  h3 {\n    color: saddlebrown;\n  }\n\n  .price {\n    color: firebrick;\n  }\n\n  > p {\n    font-style: italic;\n  }\n\n  &.featured {\n    border-color: darkorange;\n  }\n\n  & .badge {\n    background: darkorange;\n    color: black;\n  }\n\n  &:hover {\n    background: wheat;\n  }\n\n  & + & {\n    margin-top: 12px;\n  }\n}\n"
      - id: expect-flip-media-css
        type: expect.file
        at: { afterAction: expect-card-css }
        path: styles.css
        contains: "\n.price {\n  .site-footer & {\n    color: gold;\n  }\n}\n\n.hero {\n  @media (width < 40em) {\n    text-align: center;\n  }\n}\n"
      - id: expect-trap-lead-css
        type: expect.file
        at: { afterAction: expect-flip-media-css }
        path: styles.css
        contains: "\n#site-header,\n.promo {\n  & a {\n    color: lightgreen;\n  }\n}\n\n.promo a {\n  color: orange;\n}\n\n.lead {\n  &p {\n    font-size: 20px;\n  }\n\n  p& {\n    font-size: 20px;\n  }\n}\n"

checks:
  - { type: timing.p95Ms, max: 300 }
