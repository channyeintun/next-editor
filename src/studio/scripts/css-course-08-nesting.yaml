# CSS course (Burmese), lesson 8 of 43: nesting. Closes Part 1 (Foundations).
#
# Narration is an ENGLISH DRAFT for the Burmese writer (DESIGN.md next to this
# file is the span-by-span brief). Every [[mark:…]] sits where its action
# begins, at a sentence end; each span carries one piece of meaning.
# Everything the learner sees (title, chapters, whiteboard labels, UI strings)
# is Burmese already.
#
# Shape: board (recall lesson 7; the same five card rules flat and nested;
# no build step, Baseline 2023) → code tour (index.html: the note inside the
# lime juice card, the footer's promo line; empty styles.css) → one .menu-card
# rule grows nested rules live: descendant h3 and .price, the leading child
# combinator (> p skips the note's paragraph), &.featured vs & .badge →
# board (& as a placeholder, &:hover vs & :hover, & optional for descendants)
# → &:hover + a click on the coffee card → & + & spaces the cards → the
# context flip .site-footer & turns the footer price gold → board (depth
# ladder, declarations first) → a media query nested in .hero centres the
# welcome text → the ID-in-a-list trap keeps the promo link green → board
# (& = :is(), 1·0·1 vs 0·1·1) → &p is dropped, p& works → recap of the
# lesson and of Part 1, hand-off to colour (lesson 9).
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set(; no postcss config. Every typed
# state is plain CSS that hot-swaps with no reload. While a nested rule is
# typed into .menu-card, that rule is the LAST rule in the file, so a
# half-typed inner block can never swallow a later rule. Colour keywords have
# no misleading valid prefix (saddlebrown, firebrick, darkorange, wheat, gold,
# lightgreen, orange); unitless "padding: 1", "margin-top: 1" and
# "font-size: 2" are invalid and ignored mid-typing.
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
