  - id: market
    chapter: Market order နဲ့ slippage
    narration: >-
      [[mark:close-book]] book ထဲက ask တွေကို စားမယ့် order တစ်ခု ပို့ကြည့်ရအောင်။ [[mark:type-buy]]
      market order ဆိုတာ ဈေး မသတ်မှတ်ဘဲ ရှိတဲ့ အကောင်းဆုံး ဈေးနဲ့ ချက်ချင်း execute လုပ်တဲ့ order ပါ။ unit
      ဆယ်ခု ဝယ်ပါမယ်။ မဝယ်ခင် best ask ကို မှတ်ထားပြီး၊ take က ask တွေကို အကောင်းဆုံး level ကနေ စားပါတယ်။
      slippage ကိုတော့ best ask နဲ့ အကုန် ဝယ်ရရင် ကုန်မယ့် ငွေနဲ့ တကယ် ကုန်တဲ့ ငွေ ကွာခြားချက်အဖြစ်
      တွက်ပါတယ်။ [[mark:run-2]] run လိုက်ရအောင်။ [[mark:pt-fills]] ပထမ level မှာ ငါးခုပဲ ရှိလို့ ကျန်တဲ့
      ငါးခုကို နောက် level ကနေ ယူရပါတယ်။ [[mark:pt-slip]] ပျမ်းမျှ ဈေးက တစ်ရာ ဒသမ တစ်ငါး ဖြစ်ပြီး၊ best
      ask နဲ့ ယှဉ်ရင် စုစုပေါင်း သုည ဒသမ ငါး ပိုပေးရပါတယ်။ ဒါက slippage ပါ၊ မျှော်လင့်တဲ့ ဈေးနဲ့ တကယ် fill
      ဖြစ်တဲ့ ဈေး ကွာခြားချက်ပါ။ [[mark:dock-2]] ဘာကြောင့် ဒီလို ဖြစ်လဲ ဆိုတာ book ပေါ်မှာ ကြည့်ရအောင်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Appendix A: Trading & markets (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#trading-markets",
        }
    actions:
      - { id: close-book, type: slide.close, at: { mark: close-book } }
      - id: type-buy
        type: editor.type
        at: { mark: type-buy }
        target:
          {
            file: main.go,
            after: "\tfmt.Println(\"spread:\", cents(book.Asks[0].Price-book.Bids[0].Price))\n",
            occurrence: 1,
          }
        text: "\n\tqty, best := int64(10), book.Asks[0].Price\n\tfills, cost := take(&book.Asks, qty)\n\tfmt.Println(\"market buy\", qty, \"->\", strings.Join(fills, \", \"))\n\tfmt.Println(\"cost:\", cents(cost), \"slippage:\", cents(cost-qty*best))\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "cost: 1001.50 slippage: 0.50",
          timeoutMs: 8000,
        }
      - id: pt-fills
        type: console.point
        at: { mark: pt-fills }
        target: { text: "market buy 10 -> 5@100.10 a1, 5@100.20 a2", occurrence: 1 }
      - id: pt-slip
        type: console.point
        at: { mark: pt-slip }
        target: { text: "cost: 1001.50 slippage: 0.50", occurrence: 1 }
      - { id: dock-2, type: runtime.collapseDock, at: { mark: dock-2 } }
      - {
          id: expect-file-take,
          type: expect.file,
          at: { afterAction: run-2 },
          path: main.go,
          contains: "fills, cost := take(&book.Asks, qty)",
        }

  - id: walk
    narration: >-
      [[mark:show-walk]] ဒီ market order က taker ပါ၊ spread ကို ဖြတ်ပြီး book ထဲက order တွေကို
      ဖယ်ထုတ်သွားလို့ပါ။ [[mark:pt-makers]] book ထဲမှာ စောင့်နေတဲ့ limit order တွေကတော့ maker ပါ။ limit
      order ဆိုတာ သတ်မှတ်ဈေး ဒါမှမဟုတ် အဲဒီထက် ကောင်းတဲ့ ဈေးနဲ့ပဲ execute လုပ်တဲ့ order ဖြစ်ပြီး၊ book
      ထဲမှာ နေပြီး liquidity ထည့်ပေးပါတယ်။ exchange တွေက maker နဲ့ taker ဆီက fee ကို မတူအောင် ယူလေ့
      ရှိပါတယ်။ [[mark:walk-2]] taker က ပထမ level ကို အကုန် ယူပါတယ်။ [[mark:walk-3]] မလောက်လို့ ဒုတိယ
      level ကို ဆက်ဆင်းပြီး၊ အဲဒီမှာ သုံးခု ကျန်ခဲ့ပါတယ်။ [[mark:walk-4]] order ကြီးလေ level တွေ
      ပိုဆင်းရလေ ဖြစ်လို့ slippage များလေပါ။ [[mark:pt-depth]] ဈေး မရွေ့ခင် ဘယ်လောက် trade လုပ်နိုင်လဲ
      ဆိုတာကို liquidity ဒါမှမဟုတ် depth လို့ ခေါ်ပါတယ်။ book ပါးရင် order သေးသေးနဲ့တောင် ဈေး အများကြီး
      ရွေ့ပါတယ်။ ဒါကြောင့် market order ကို လက်ခံတဲ့ system က slippage ဘယ်လောက်အထိ ခံမလဲ ဆိုတဲ့ limit ကို
      user ဆီက ယူထားသင့်ပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Appendix A: Trading & markets (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#trading-markets",
        }
    actions:
      - {
          id: show-walk,
          type: slide.show,
          at: { mark: show-walk, offsetMs: -700 },
          slideId: walk-1,
        }
      - {
          id: pt-order,
          type: slide.point,
          at: { afterAction: show-walk },
          target: { x: 0.159, y: 0.492 },
        }
      - {
          id: pt-makers,
          type: slide.point,
          at: { mark: pt-makers },
          target: { x: 0.513, y: 0.858 },
        }
      - { id: walk-2, type: slide.show, at: { mark: walk-2 }, slideId: walk-2 }
      - {
          id: pt-t1,
          type: slide.point,
          at: { afterAction: walk-2 },
          target: { x: 0.318, y: 0.332 },
        }
      - { id: walk-3, type: slide.show, at: { mark: walk-3 }, slideId: walk-3 }
      - {
          id: pt-t2,
          type: slide.point,
          at: { afterAction: walk-3 },
          target: { x: 0.792, y: 0.556 },
        }
      - { id: walk-4, type: slide.show, at: { mark: walk-4 }, slideId: walk-4 }
      - {
          id: pt-slip-fig,
