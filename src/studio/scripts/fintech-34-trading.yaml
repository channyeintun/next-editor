  - id: try-it
    chapter: ကိုယ်တိုင် စမ်းကြည့်ပါ
    narration: >-
      [[mark:close-iv]] ကိုယ်တိုင် စမ်းကြည့်ဖို့ တစ်ခု ရှိပါတယ်။ [[mark:open-main-2]] market buy ရဲ့
      ပမာဏကို ပြောင်းကြည့်ပါ။ [[mark:sel-try]] ဆယ်ကနေ နှစ်ဆယ် လို့ ပြောင်းပြီး run ကြည့်ရင် level
      သုံးခုလုံးကို ဆင်းစားပြီး slippage က သုည ဒသမ ငါး ကနေ နှစ် ဒသမ ကိုး အထိ တက်ပါလိမ့်မယ်။ ပမာဏ နှစ်ဆ
      ဖြစ်ပေမဲ့ slippage က နှစ်ဆထက် အများကြီး ပိုပါတယ်။ [[mark:recap]] ပြန်ချုပ်ရရင်၊ order book က ask နဲ့
      bid တွေကို ဈေး level အလိုက် စီထားပြီး၊ matching က ဈေး အကောင်းဆုံးကို အရင်၊ ဈေးတူရင် အရင် ရောက်တာကို
      အရင် ပေးပါတယ်။ market order ကြီးလေ book ကို ဆင်းစားလေ slippage များလေပါ။ နောက် lesson မှာတော့
      custody နဲ့ crypto ကို ကြည့်ပါမယ်၊ key တွေကို ဘယ်သူ ကိုင်လဲ၊ on-chain deposit တစ်ခုကို ဘယ်အချိန်မှာ
      credit လုပ်လို့ ရလဲ ဆိုတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Appendix A: Trading & markets (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#trading-markets",
        }
    actions:
      - { id: close-iv, type: slide.close, at: { mark: close-iv } }
      - { id: open-main-2, type: workspace.openFile, at: { mark: open-main-2 }, path: main.go }
      - id: sel-try
        type: editor.select
        at: { mark: sel-try }
        target: { file: main.go, text: "int64(10)", occurrence: 1 }

checks:
  - { type: timing.p95Ms, max: 300 }
