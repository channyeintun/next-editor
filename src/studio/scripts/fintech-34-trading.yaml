      book.go: |
        package main

        import (
        	"fmt"
        	"slices"
        )

        // Order is one resting order: who placed it and how many units are still open.
        type Order struct {
        	ID  string
        	Qty int64
        }

        // Level is every order at one price, oldest first: that order is time priority.
        type Level struct {
        	Price  int64 // cents
        	Orders []Order
        }

        // Book keeps each side best price first: asks from the lowest, bids from the highest.
        type Book struct {
        	Asks, Bids []Level
        }

        // take fills qty from the best level down, oldest order first, and removes what it used up.
        func take(levels *[]Level, qty int64) (fills []string, cost int64) {
        	for qty > 0 && len(*levels) > 0 {
        		lv := &(*levels)[0]
        		o := &lv.Orders[0]
        		n := min(qty, o.Qty)
        		fills = append(fills, fmt.Sprintf("%d@%s %s", n, cents(lv.Price), o.ID))
        		cost, qty, o.Qty = cost+n*lv.Price, qty-n, o.Qty-n
        		if o.Qty == 0 {
        			lv.Orders = lv.Orders[1:]
        		}
        		if len(lv.Orders) == 0 {
        			*levels = (*levels)[1:]
        		}
        	}
        	return fills, cost
        }

        // addBid rests a limit buy at its price level, behind every order already there.
        func (b *Book) addBid(price int64, o Order) {
        	i := 0
        	for i < len(b.Bids) && b.Bids[i].Price > price {
        		i++
        	}
        	if i < len(b.Bids) && b.Bids[i].Price == price {
        		b.Bids[i].Orders = append(b.Bids[i].Orders, o)
        		return
        	}
        	b.Bids = slices.Insert(b.Bids, i, Level{price, []Order{o}})
        }
      main.go: |
        package main

        import (
        	"fmt"
        	"strings"
        )

        func main() {
        	book := Book{
        		Asks: []Level{
        			{10010, []Order{{"a1", 5}}},
        			{10020, []Order{{"a2", 8}}},
        			{10040, []Order{{"a3", 10}}},
        		},
        		Bids: []Level{
        			{9990, []Order{{"b1", 2}, {"b2", 2}}},
        			{9980, []Order{{"b3", 6}}},
        			{9950, []Order{{"b4", 10}}},
        		},
        	}
        	fmt.Println("asks:", side(book.Asks))
        	fmt.Println("bids:", side(book.Bids))
        	fmt.Println("spread:", cents(book.Asks[0].Price-book.Bids[0].Price))
        }

        // side prints one side as price x open quantity per level, best first.
        func side(levels []Level) string {
        	parts := []string{}
        	for _, lv := range levels {
        		var q int64
        		for _, o := range lv.Orders {
        			q += o.Qty
        		}
        		parts = append(parts, fmt.Sprintf("%sx%d", cents(lv.Price), q))
        	}
        	return strings.Join(parts, " ")
        }

        // queue prints the orders of one level in time priority.
        func queue(lv Level) string {
        	parts := []string{}
        	for _, o := range lv.Orders {
        		parts = append(parts, fmt.Sprintf("%sx%d", o.ID, o.Qty))
        	}
        	return strings.Join(parts, " ")
        }

        // cents prints minor units as an amount with two decimals: cents(1234) is "12.34".
        func cents(n int64) string {
        	sign := ""
        	if n < 0 {
        		sign, n = "-", -n
        	}
        	return fmt.Sprintf("%s%d.%02d", sign, n/100, n%100)
        }
