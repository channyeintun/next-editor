  - id: priority
    chapter: Price-time priority
    narration: >-
      [[mark:close-walk]] price-time priority ကို code နဲ့ ကြည့်ရအောင်။ [[mark:type-limit]] ထိပ်ဆုံး bid
      level မှာ unit သုံးခု ဝယ်မယ့် limit order အသစ် တစ်ခု ထည့်ပါတယ်။ best ask ထက် နိမ့်လို့ ချက်ချင်း
      မကိုက်ဘဲ book ထဲမှာ နေပါတယ်။ အဲဒီ level မှာ အရင်ကတည်းက order နှစ်ခု ရှိနေပါပြီ။ ပြီးရင် unit
      ငါးခုကို market sell လုပ်ပါတယ်။ order အသစ်က ဘယ်လောက် fill ဖြစ်မလဲ ခန့်မှန်းကြည့်ပါ။ [[mark:run-3]]
      run လိုက်ရအောင်။ [[mark:pt-queue-out]] order အသစ်က queue ရဲ့ နောက်ဆုံးကို ရောက်ပါတယ်။
      [[mark:pt-sell]] sell က အရင် ရောက်တဲ့ order နှစ်ခုကို အပြည့် ပေးပြီးမှ order အသစ်ကို တစ်ခုပဲ
      ပေးပါတယ်။ ဈေး အတူတူ ဖြစ်ပေမဲ့ အစဉ်ကို အချိန်က ဆုံးဖြတ်တာပါ။ [[mark:dock-3]] ဒါကြောင့် matching
      engine မှာ order တိုင်း ရောက်တဲ့ အစဉ်ကို မှန်မှန် သိမ်းထားရပါတယ်၊ အစဉ် လွဲရင် တခြားသူ ရရမယ့် fill
      ကို တစ်ယောက်က ယူသွားတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Appendix A: Trading & markets (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#trading-markets",
        }
      - {
          title: "CME Group — Matching Algorithm Overview",
          url: "https://www.cmegroup.com/education/matching-algorithm-overview.html",
        }
    actions:
      - { id: close-walk, type: slide.close, at: { mark: close-walk } }
      - id: type-limit
        type: editor.type
        at: { mark: type-limit }
        target:
          {
            file: main.go,
            after: "\tfmt.Println(\"cost:\", cents(cost), \"slippage:\", cents(cost-qty*best))\n",
            occurrence: 1,
          }
        text: "\n\tbook.addBid(9990, Order{\"b5\", 3})\n\tfmt.Println(\"bids at 99.90:\", queue(book.Bids[0]))\n\tfills, _ = take(&book.Bids, 5)\n\tfmt.Println(\"market sell 5 ->\", strings.Join(fills, \", \"))\n"
        cadence: line-by-line
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "market sell 5 -> 2@99.90 b1, 2@99.90 b2, 1@99.90 b5",
          timeoutMs: 8000,
        }
      - id: pt-queue-out
        type: console.point
        at: { mark: pt-queue-out }
        target: { text: "bids at 99.90: b1x2 b2x2 b5x3", occurrence: 1 }
      - id: pt-sell
        type: console.point
        at: { mark: pt-sell }
        target: { text: "market sell 5 -> 2@99.90 b1, 2@99.90 b2, 1@99.90 b5", occurrence: 1 }
      - { id: dock-3, type: runtime.collapseDock, at: { mark: dock-3 } }

  - id: terms
    chapter: Spot၊ derivative နဲ့ margin
    narration: >-
      [[mark:show-terms]] ဒီ code က spot market ပါ၊ spot ဆိုတာ asset ကိုယ်တိုင်ကို ဝယ်ရောင်းပြီး ချက်ချင်း
      လွှဲတာပါ။ [[mark:pt-fut]] derivative ကတော့ asset ကိုယ်တိုင် မဟုတ်ဘဲ asset ရဲ့ ဈေးကနေ တန်ဖိုး ရတဲ့
      contract ပါ၊ futures က နောက်ရက်တစ်ရက်မှာ ဝယ်ရောင်းမယ့် contract ပါ။ [[mark:pt-perp]] perpetual ကတော့
      expiry မရှိတဲ့ futures ပါ။ ဈေးကို spot နားမှာ ထိန်းဖို့ long နဲ့ short ကြား funding ပေးပြီး၊ rate
      အပေါင်းဆိုရင် long က short ကို၊ အနုတ်ဆိုရင် short က long ကို ပေးပါတယ်၊ exchange က အဲဒီ ငွေကို
      မယူပါဘူး။ Binance ရဲ့ default က ရှစ်နာရီ တစ်ခါ ဖြစ်ပေမဲ့ contract တချို့မှာ ပိုခဏခဏ ပေးပါတယ်။
      [[mark:terms-2]] long ဆိုတာ ဈေး တက်ရင် အမြတ်ရတဲ့ position၊ short က ဈေး ကျရင် အမြတ်ရတဲ့ position ပါ။
      [[mark:pt-lev]] leverage က ကိုယ့်ငွေထက် ကြီးတဲ့ position ကို ထိန်းတာ ဖြစ်ပြီး၊ margin က အဲဒါကို
      ဖွင့်ဖို့၊ ဆက်ထိန်းဖို့ တင်ထားတဲ့ collateral ပါ။ [[mark:pt-liq]] margin က maintenance requirement
      အောက် ကျသွားရင် position ကို အတင်း ပိတ်တာကို liquidation လို့ ခေါ်ပါတယ်။ [[mark:terms-3]] haircut
      ဆိုတာ collateral ရဲ့ တန်ဖိုးကို ဈေး ပြောင်းနိုင်လို့ လျှော့တွက်တာပါ။ [[mark:pt-cp]] counterparty က
      trade ရဲ့ တစ်ဖက် ဖြစ်ပြီး၊ counterparty risk က သူ မပေးနိုင်မှာပါ။ [[mark:pt-aum]] AUM နဲ့ AUC ကတော့ များသောအားဖြင့် fee ယူပြီး စီမံပေးတဲ့ client asset နဲ့ သိမ်းပေးရုံ client asset ကို
      ခွဲခေါ်တာ ဖြစ်ပြီး၊ asset
      တစ်ခုတည်းက နှစ်မျိုးလုံး ဖြစ်နိုင်ပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Appendix A: Trading & markets (Voytek Pitula, CC BY 4.0)",
