# Fintech Engineering, lesson 34: order books and trading terms (Burmese).
#
# Source: Fintech Engineering Handbook, Appendix A "Trading & markets" (CC BY 4.0, Voytek Pitula).
# Facts: B19, B20.
# Start state: book.go holds the order book (levels oldest first), take (fill from the best level
# down) and addBid; main.go builds a book of three ask and three bid levels, prices in cents,
# quantities in units, and prints both sides and the spread.
# Edits, all insert-only (main.go):
#   1. a market buy of 10 that walks two ask levels  -> run-2 cost: 1001.50 slippage: 0.50
#   2. a limit buy resting behind two older bids at 99.90, then a market sell of 5
#                                                     -> run-3 fills b1, b2, then b5
# Figures: book (the ladder: asks, bids, spread, price-time priority), walk (a market order
# eating two levels: maker / taker, slippage, depth), terms (spot to liquidation, one line each),
# iv (the interview answer).
# Built by ~/Documents/fintech-course-work/tools/build-lesson.ts; fixtures by sim-go.ts --write.
