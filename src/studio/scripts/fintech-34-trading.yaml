build:
  voiceProfile:
    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 9534

runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "asks: 100.10x5 100.20x8 100.40x10\nbids: 99.90x4 99.80x6 99.50x10\nspread: 0.20\n"
      run-2:
        status: success
        exitCode: 0
        output: "asks: 100.10x5 100.20x8 100.40x10\nbids: 99.90x4 99.80x6 99.50x10\nspread: 0.20\nmarket buy 10 -> 5@100.10 a1, 5@100.20 a2\ncost: 1001.50 slippage: 0.50\n"
      run-3:
        status: success
        exitCode: 0
        output: "asks: 100.10x5 100.20x8 100.40x10\nbids: 99.90x4 99.80x6 99.50x10\nspread: 0.20\nmarket buy 10 -> 5@100.10 a1, 5@100.20 a2\ncost: 1001.50 slippage: 0.50\nbids at 99.90: b1x2 b2x2 b5x3\nmarket sell 5 -> 2@99.90 b1, 2@99.90 b2, 1@99.90 b5\n"

scenes:
  - id: hook
    chapter: Order book
    narration: >-
      exchange တစ်ခုမှာ asset တစ်ခုရဲ့ ဈေးဆိုတာ ဂဏန်း တစ်ခုတည်း မဟုတ်ပါဘူး။ ဝယ်ချင်သူတွေ ပေးမယ့် ဈေးတွေနဲ့
      ရောင်းချင်သူတွေ တောင်းတဲ့ ဈေးတွေ စာရင်း ရှိပြီး၊ ကိုယ် ဘယ်ဈေးနဲ့ ရမလဲ ဆိုတာ အဲဒီ စာရင်းနဲ့ ကိုယ့်
      order ရဲ့ အရွယ်အစားပေါ် မူတည်ပါတယ်။ အဲဒီ စာရင်းကို order book လို့ ခေါ်ပါတယ်၊ ဈေး level
      တစ်ခုချင်းမှာ မပြီးသေးတဲ့ buy order နဲ့ sell order တွေကို စုထားတဲ့ live စာရင်းပါ။ [[mark:sel-asks]] lesson ၇ က ask နဲ့ bid ဟာ ဒီမှာ ဈေး နှစ်ခုတည်း မဟုတ်ဘဲ စောင့်နေတဲ့ order တွေပါ။
      ask တွေက ရောင်းဖို့ စောင့်နေတာပါ။ ဈေး level သုံးခု ရှိပြီး၊ ဈေးကို ဆင့်နဲ့၊ ပမာဏကို unit
      နဲ့ ကိန်းပြည့် ထားပါတယ်။ [[mark:sel-bids]] bid တွေကတော့ ဝယ်ဖို့ စောင့်နေတာပါ။ ထိပ်ဆုံး bid
      level မှာ order နှစ်ခု ရှိပြီး၊ အရင် ရောက်တဲ့ order က ရှေ့မှာ ရှိပါတယ်။ [[mark:run-1]] run
      လိုက်ရအောင်။ [[mark:pt-asks]] ask တွေကို အနိမ့်ဆုံး ဈေးကနေ စီပြီး၊ bid တွေကို အမြင့်ဆုံး ဈေးကနေ
      စီထားပါတယ်။ [[mark:pt-spread]] အကောင်းဆုံး ask နဲ့ အကောင်းဆုံး bid ကြား ကွာခြားချက်၊ ဆိုလိုတာက spread က ဆင့် ၂၀ ပါ။ [[mark:dock-1]] ask နဲ့ bid ကို ဈေးအလိုက် တန်းစီကြည့်ရအောင်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Appendix A: Trading & markets (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#trading-markets",
        }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }
      - id: sel-asks
        type: editor.select
        at: { mark: sel-asks }
        target:
          {
            file: main.go,
            text: "\t\t\t{10010, []Order{{\"a1\", 5}}},\n\t\t\t{10020, []Order{{\"a2\", 8}}},\n\t\t\t{10040, []Order{{\"a3\", 10}}},",
            occurrence: 1,
          }
      - id: sel-bids
        type: editor.select
        at: { mark: sel-bids }
        target:
          {
            file: main.go,
            text: "\t\t\t{9990, []Order{{\"b1\", 2}, {\"b2\", 2}}},\n\t\t\t{9980, []Order{{\"b3\", 6}}},\n\t\t\t{9950, []Order{{\"b4\", 10}}},",
            occurrence: 1,
          }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "spread: 0.20",
          timeoutMs: 8000,
        }
      - id: pt-asks
        type: console.point
        at: { mark: pt-asks }
        target: { text: "asks: 100.10x5 100.20x8 100.40x10", occurrence: 1 }
      - id: pt-spread
        type: console.point
        at: { mark: pt-spread }
        target: { text: "spread: 0.20", occurrence: 1 }
      - { id: dock-1, type: runtime.collapseDock, at: { mark: dock-1 } }

  - id: ladder
    chapter: Bid၊ ask နဲ့ spread
    narration: >-
      [[mark:show-book]] order book ကို ladder လို ပုံဖော်လေ့ ရှိပါတယ်။ ask တွေက အပေါ်မှာ ရှိပြီး ဈေး
      နိမ့်လေ အောက်ကို ဆင်းလေပါ။ [[mark:pt-bestask]] အောက်ဆုံး ask က best ask ပါ၊ ချက်ချင်း ဝယ်ရင်
      ပေးရမယ့် အနိမ့်ဆုံး ဈေးပါ။ [[mark:book-2]] bid တွေက အောက်မှာ ရှိပြီး၊ အပေါ်ဆုံး bid က best bid ပါ၊
      ချက်ချင်း ရောင်းရင် ရမယ့် အမြင့်ဆုံး ဈေးပါ။ [[mark:book-3]] နှစ်ခုကြားက ကွာဟချက်က spread ပါ။ spread
      ကျဉ်းလေ ဝယ်ပြီး ချက်ချင်း ပြန်ရောင်းရင် ဆုံးတာ နည်းလေပါ။ [[mark:book-4]] buy order နဲ့ sell order
      ကိုက်တာကို matching လို့ ခေါ်ပါတယ်။ order book သုံးတဲ့ exchange အများစုက ဈေး အကောင်းဆုံးကို အရင်
      ပေးပြီး၊ ဈေးတူရင် အရင် ရောက်တဲ့ order ကို အရင် ပေးပါတယ်၊ ဒါကို price-time priority လို့ ခေါ်ပါတယ်။
      [[mark:pt-queue]] ဒါကြောင့် ဒီ level မှာ အရင် ရောက်တဲ့ order က အရင် fill ဖြစ်ပါတယ်။ Nasdaq က ဈေးတူတဲ့ displayed order တွေကို အချိန်အလိုက် စီပြီး၊ CME Globex ရဲ့ FIFO algorithm ကလည်း
      ဈေးနဲ့ အချိန်ကိုပဲ သုံးပါတယ်။ ဒါပေမဲ့ product အားလုံး ဒီလို မဟုတ်ပါဘူး၊
      CME မှာ product တချို့က ပမာဏ အချိုးအလိုက် ခွဲပေးတဲ့ pro-rata algorithm ကို သုံးပါတယ်။
    sources:
