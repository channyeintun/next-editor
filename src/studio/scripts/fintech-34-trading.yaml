  - id: senior
    chapter: ခက်တဲ့ အပိုင်း
    narration: >-
      [[mark:close-terms]] engineer အတွက် ခက်တဲ့ အပိုင်းက matching ကိုယ်တိုင်ထက် အဲဒီ နောက်က ငွေပါ။
      [[mark:open-book]] fill တစ်ခု ဖြစ်တိုင်း ledger မှာ transaction တစ်ခု ဖြစ်ပါတယ်။ ဝယ်သူရဲ့ ငွေ လျော့၊
      ရောင်းသူရဲ့ ငွေ တိုး၊ asset က ပြောင်းပြန် ရွှေ့ပြီး၊ maker fee နဲ့ taker fee ယူရင်လည်း revenue အဖြစ် ဝင်ပါတယ်၊ ဒါတွေ အားလုံး တစ်ပြိုင်နက် post ဖြစ်ရပါမယ်။ [[mark:sel-min]] ဒီ line က fill ပမာဏကို
      resting order မှာ ကျန်တာထက် ဘယ်တော့မှ မကျော်အောင် ကန့်ထားပါတယ်။ ဒီ line မှားရင် မရှိတဲ့ asset ကို
      ရောင်းလိုက်တာ ဖြစ်ပြီး၊ No invented data ကို ချိုးတာပါ၊ ငွေကို မရှိဘဲ မဖန်တီးရဘူး ဆိုတဲ့ မူပါ။
      [[mark:sel-fifo]] ပြီးသွားတဲ့ order ကို queue ရဲ့ ရှေ့ကနေ ဖယ်တာက time priority ကို ထိန်းတာပါ။
      [[mark:design]] ဒီ အစဉ် တစ်ခုတည်း ဖြစ်ဖို့ instrument တစ်ခုကို thread တစ်ခုတည်းနဲ့ match လုပ်ပြီး၊
      ရောက်လာတဲ့ order တိုင်းကို sequence နံပါတ်နဲ့ log ထားတဲ့ design က ရိုးရှင်းပါတယ်။ အဲဒီ log ကနေ
      replay လုပ်ရင် book အတိအကျ ပြန်ရလို့ lesson ၁၃ က event sourcing နဲ့ ကိုက်ပါတယ်။ funding ကလည်း user တွေကြား ငွေ ရွှေ့တဲ့ ledger event ဖြစ်ပြီး၊ liquidation ကလည်း ledger ထဲ ရောက်ရမယ့် event ပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Principles (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#principles",
        }
    actions:
      - { id: close-terms, type: slide.close, at: { mark: close-terms } }
      - { id: open-book, type: workspace.openFile, at: { mark: open-book }, path: book.go }
      - id: sel-min
        type: editor.select
        at: { mark: sel-min }
        target: { file: book.go, text: "n := min(qty, o.Qty)", occurrence: 1 }
      - id: sel-fifo
        type: editor.select
        at: { mark: sel-fifo }
        target: { file: book.go, text: "lv.Orders = lv.Orders[1:]", occurrence: 1 }

  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] interview မှာ matching engine တစ်ခုအတွက် data structure ဘယ်လို ရွေးမလဲ လို့
      မေးတတ်ပါတယ်။ [[mark:iv-a]] ပထမ၊ side တစ်ခုစီမှာ price level တွေကို ဈေးအလိုက် sort ထားပါမယ်၊ best
      price ကို ချက်ချင်း ယူနိုင်ဖို့ပါ။ sorted tree သုံးနိုင်ပြီး၊ ဈေး range ကန့်သတ်ထားရင် tick တစ်ခုကို
      index တစ်ခုနဲ့ array သုံးနိုင်ပါတယ်။ [[mark:iv-b]] ဒုတိယ၊ level တစ်ခုစီက FIFO queue ဖြစ်ပြီး time
      priority ကို ထိန်းပါတယ်။ order id ကနေ queue ထဲက node ကို တိုက်ရိုက် ရှာနိုင်တဲ့ map ထားရင် cancel
      ကို ချက်ချင်း လုပ်နိုင်ပါတယ်။ [[mark:iv-c]] တတိယ၊ instrument တစ်ခုကို thread တစ်ခုနဲ့ match လုပ်ပြီး
      event တိုင်းကို sequence ထားလို့ result က deterministic ဖြစ်ပြီး log ကနေ replay လုပ်နိုင်ပါတယ်။
      [[mark:iv-d]] ပြီးရင် ငွေဘက်ကို ဆက်ပြောပါ။ ဈေးနဲ့ ပမာဏကို ကိန်းပြည့်နဲ့ ထားမယ်၊ fill တိုင်းကို
      balanced ledger transaction အဖြစ် post လုပ်မယ်၊ resting quantity ထက် ပို fill မဖြစ်အောင် invariant
      နဲ့ စစ်မယ် ဆိုတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Appendix A: Trading & markets (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#trading-markets",
        }
    actions:
      - { id: show-iv, type: slide.show, at: { mark: show-iv, offsetMs: -700 }, slideId: iv-1 }
      - {
          id: pt-iv-q,
          type: slide.point,
