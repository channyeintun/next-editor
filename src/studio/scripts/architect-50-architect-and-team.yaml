  - id: signs
    chapter: ဒုက္ခရောက်နေတဲ့ team ရဲ့ လက္ခဏာ
    narration: >
      [[mark:s-open]] လေးလ ကြာပြီးမှ ကိုယ် Partner API team နဲ့ တစ်ပတ် အတူ ထိုင်ကြည့်ပါတယ်။ team တစ်ခု
      ဒုက္ခရောက်နေတာကို ပြတဲ့ လက္ခဏာ သုံးခုကို တွေ့ရပါတယ်။
      [[mark:s-1]] ပထမက အလုပ်ချင်း တိုက်နေတာပါ။ developer နှစ်ယောက်က file တစ်ခုတည်းကို တစ်ပြိုင်တည်း ပြင်နေကြလို့
      merge လုပ်တိုင်း conflict ဖြစ်ပြီး၊ လူ ထပ်ထည့်လေ ပိုနှေးလေ ဖြစ်နေပါတယ်။ ဒီအခါ လူ မတိုးခင်၊ အပြိုင်
      လုပ်လို့ရအောင် အလုပ်ကို အရင် ခွဲပေးရပါတယ်။
      [[mark:s-2]] ဒုတိယက လူတွေကြားထဲမှာ ကျန်ခဲ့တဲ့ အလုပ်ပါ။ ကားလိုင်း တစ်ခုရဲ့ API key ပေါက်ကြားရင် ဘယ်သူ
      ပိတ်ပေးမလဲ ဆိုတာကို လူတိုင်းက တစ်ယောက်ယောက် လုပ်လိမ့်မယ်လို့ ထင်နေကြပါတယ်။ ဒီအခါ အလုပ် တစ်ခုစီမှာ
      ပိုင်ရှင် နာမည် တစ်ခု တပ်ပေးရပါတယ်။
      [[mark:s-3]] တတိယကတော့ အဝေးကနေ အမြင်ရ အခက်ဆုံးပါ။ ဘယ်သူမှ မယုံတဲ့ တိတ်တိတ် သဘောတူညီမှုပါ။ design
      တစ်ခုကို meeting ထဲမှာ ဘယ်သူမှ မကန့်ကွက်ပေမဲ့၊ အပြင်ရောက်မှ အလုပ်မဖြစ်ဘူးလို့ တစ်ယောက်ချင်း ပြောကြပါတယ်။
      လူတိုင်းက ကျန်တဲ့သူတွေ သဘောတူတယ်လို့ ထင်နေကြတာပါ။ ဒီအခါ တိတ်နေတဲ့သူကို နာမည်ခေါ်ပြီး ဘယ်လို ထင်လဲ
      မေးပေးရပါတယ်။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - {
          id: draw-s-open,
          type: whiteboard.apply,
          at: { mark: s-open },
          clear: true,
          upsertIds: [s-title],
          drawMs: 1000,
        }
      - {
          id: draw-s-1,
          type: whiteboard.apply,
          at: { mark: s-1 },
          upsertIds: [s-b1, s-l1, s-e1],
          drawMs: 1800,
        }
      - {
          id: draw-s-2,
          type: whiteboard.apply,
          at: { mark: s-2 },
          upsertIds: [s-b3, s-l3, s-e3],
          drawMs: 1800,
        }
      - {
          id: draw-s-3,
          type: whiteboard.apply,
          at: { mark: s-3 },
          upsertIds: [s-b2, s-l2, s-e2],
          drawMs: 1800,
        }

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] ဒါဆို team တစ်ခုနဲ့ ဘယ်လောက် နီးရမလဲ။ မေးခွန်း တစ်ခု မေးပါရစေ။ အလုပ်ဝင်တာ မကြာသေးတဲ့
      junior developer ၁၂ ယောက်နဲ့ team အသစ် တစ်ခုက ရှုပ်ထွေးတဲ့ project တစ်ခုကို စမယ် ဆိုပါစို့။
      [[mark:quiz-a]] ပထမ ရွေးစရာက ဝေးဝေးနေပြီး သူတို့ဘာသာ သင်ယူခွင့် ပေးတာပါ။ နီးလွန်းရင် မကောင်းဘူးလို့
      ခုနကပဲ ပြောခဲ့တာကိုး။
      [[mark:quiz-b]] ဒုတိယ ရွေးစရာက နီးနီးကပ်ကပ် နေပြီး အတူ ဆုံးဖြတ်ပေးတာပါ။ lesson ကို pause လုပ်ပြီး
      စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ တစ်ခု၊ နီးနီးကပ်ကပ် နေတာပါ။ ဒါပေမဲ့ အခုအတွက်ပဲ ဆိုတာကို ထည့်ပြောရပါမယ်။
      ဘာကြောင့်လဲဆိုတော့ မှန်တဲ့ အကွာအဝေးက architect ရဲ့ အကျင့်ပေါ်မှာ မဟုတ်ဘဲ၊ team ရဲ့ အခြေအနေပေါ်မှာ
      မူတည်လို့ပါ။
      [[mark:quiz-why]] ဒီ team က အတွေ့အကြုံ နည်းတယ်၊ လူများတယ်၊ အချင်းချင်းလည်း မသိကြသေးဘူး၊ အလုပ်ကလည်း
      ခက်ပါတယ်။ ဒီအခြေအနေမှာ ဝေးဝေးနေတာက လွတ်လပ်ခွင့် ပေးတာ မဟုတ်ဘဲ ပစ်ထားတာပါ။
      [[mark:quiz-later]] ခြောက်လလောက် ကြာလို့ team က ကျွမ်းကျင်လာရင်တော့ ကိုယ်က ပြန်ဆုတ်ပေးရမှာပါ။ အခုအတွက်ပဲ
      ဆိုတာ ဒါကို ပြောတာပါ။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz, offsetMs: 3000 },
          clear: true,
          upsertIds: [q-title],
          drawMs: 1000,
        }
      - {
          id: draw-quiz-a,
          type: whiteboard.apply,
          at: { mark: quiz-a },
          upsertIds: [q-a],
          drawMs: 900,
        }
      - {
          id: draw-quiz-b,
          type: whiteboard.apply,
          at: { mark: quiz-b },
          upsertIds: [q-b],
          drawMs: 900,
        }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-now,
          type: whiteboard.apply,
          at: { mark: quiz-answer, offsetMs: 4500 },
          upsertIds: [q-now],
          drawMs: 800,
        }
      - {
          id: draw-why,
          type: whiteboard.apply,
          at: { mark: quiz-later },
          upsertIds: [q-why],
          drawMs: 1200,
        }

  - id: factors
    chapter: အကွာအဝေးကို သတ်မှတ်တဲ့ အချက် ငါးချက်
    narration: >
      [[mark:f-open]] team ရဲ့ အခြေအနေကို အချက် ငါးချက်နဲ့ ကြည့်လို့ ရပါတယ်။ ပထမ သုံးချက်က team ထဲက လူတွေ
      အကြောင်းဖြစ်ပြီး၊ နောက် နှစ်ချက်က သူတို့ လုပ်ရမယ့် အလုပ်အကြောင်းပါ။
      [[mark:f-1]] ပထမက အတွေ့အကြုံပါ။ ဒီလို အလုပ်မျိုးကို လုပ်ဖူးတဲ့ senior တွေ များရင် ဝေးလို့ ရပြီး၊ junior
      တွေ များရင် နီးရပါမယ်။
      [[mark:f-2]] ဒုတိယက team ထဲက လူတွေ အချင်းချင်း ဘယ်လောက် သိကျွမ်းလဲ ဆိုတာပါ။ အတူ လုပ်ဖူးတာ ကြာပြီဆိုရင်
      ကိုယ့်ဘာသာ ညှိနိုင်ကြပါတယ်။ အသစ် စုထားတာဆိုရင်တော့ architect က ပိုနီးဖို့ လိုပါတယ်။
      [[mark:f-3]] တတိယက အရွယ်အစားပါ။ လူ များလေ အချင်းချင်း ညှိရတာ များလေမို့၊ ပိုနီးဖို့ လိုလေပါ။
      [[mark:f-4]] စတုတ္ထက အလုပ်ရဲ့ ရှုပ်ထွေးမှုပါ။ လုပ်နေကျ အလုပ်မျိုးဆိုရင် ဝေးလို့ ရပေမဲ့၊ တစ်ခါမှ မလုပ်ဖူးတဲ့
      အလုပ်ဆိုရင် နီးရပါမယ်။
      [[mark:f-5]] နောက်ဆုံးက အလုပ်က ဘယ်လောက် ကြာမလဲ ဆိုတာပါ။ ဒီအချက်က ထင်တာနဲ့ ပြောင်းပြန်ပါ။ ရက်ပိုင်းနဲ့
      ပြီးမယ့် အလုပ်မှာ team က အာရုံစိုက်ထားတတ်ပါတယ်။ တစ်နှစ်ကြာမယ့် project မှာတော့ လမ်းကြောင်းက တဖြည်းဖြည်း
      လွဲသွားတတ်တာမို့၊ ကြာလေ ပိုနီးဖို့ လိုလေပါ။
      [[mark:f-change]] ဒီ ငါးချက်က အချိန်နဲ့အမျှ ပြောင်းတတ်တာမို့၊ အကွာအဝေးကိုလည်း တစ်ခါ သတ်မှတ်ပြီး
      ထားလိုက်လို့ မရပါဘူး။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - {
          id: close-quiz,
          type: whiteboard.apply,
          at: { mark: f-open, offsetMs: -1300 },
          open: false,
        }
      - {
          id: show-factors,
          type: slide.show,
          at: { afterAction: close-quiz },
          slideId: five-factors,
        }
      - { id: point-f-1, type: slide.point, at: { mark: f-1 }, target: { x: 0.15, y: 0.35 } }
      - { id: point-f-2, type: slide.point, at: { mark: f-2 }, target: { x: 0.15, y: 0.47 } }
      - { id: point-f-3, type: slide.point, at: { mark: f-3 }, target: { x: 0.15, y: 0.59 } }
      - { id: point-f-4, type: slide.point, at: { mark: f-4 }, target: { x: 0.15, y: 0.71 } }
      - { id: point-f-5, type: slide.point, at: { mark: f-5 }, target: { x: 0.15, y: 0.83 } }

  - id: table
    chapter: Team နှစ်ခုကို အမှတ်ပေးကြည့်ခြင်း
    narration: >
      [[mark:t-close]] ဒီ ငါးချက်နဲ့ ခရီးဖော် ရဲ့ team နှစ်ခုကို ကြည့်ပါမယ်။ အချက် တစ်ခုစီက နီးဖို့ ဆွဲလား၊ ဝေးဖို့
      ဆွဲလား ဆိုတာကိုပဲ မှတ်ပါမယ်။
      [[mark:t-exp]] အတွေ့အကြုံမှာ Booking team က senior တွေ များပြီး၊ Partner API team မှာ လူသစ် သုံးယောက်
      ပါပါတယ်။
      [[mark:t-know]] Booking team က လေးနှစ် အတူ လုပ်လာကြတာပါ။ Partner API team ကတော့ ဖွဲ့တာ ငါးလပဲ ရှိသေးပြီး၊
      team လေးခုက လူတွေကို စုထားတာပါ။
      [[mark:t-size]] အရွယ်အစားက ရှစ်ယောက်နဲ့ ဆယ်ယောက်မို့ သိပ်မကွာပါဘူး။ နှစ်ခုလုံး အလယ်အလတ်ပါ။
      [[mark:t-complex]] Booking ရဲ့ အလုပ်က သူတို့ ကျွမ်းပြီးသား domain၊ ဆိုလိုတာက လုပ်ငန်းနယ်ပယ်ပါ။ Partner API
      ကတော့ အပြင်က system တွေ လှမ်းခေါ်မယ့် API မို့၊ ခရီးဖော် မှာ တစ်ခါမှ မလုပ်ဖူးတဲ့ အလုပ်ပါ။
      [[mark:t-long]] Booking ရဲ့ အလုပ်တွေက ရက်သတ္တပတ်ပိုင်းနဲ့ ပြီးတဲ့ အပိုင်းလေးတွေပါ။ Partner API ကတော့
      တစ်နှစ်ကျော် ကြာမယ့် project ပါ။
      [[mark:t-read]] ရလဒ်က ရှင်းပါတယ်။ Booking မှာ လေးချက်က ဝေးဖို့ ဆွဲနေပြီး၊ Partner API မှာ လေးချက်က နီးဖို့
      ဆွဲနေပါတယ်။ ကိုယ် လုပ်နေတာကတော့ အဲဒါနဲ့ ပြောင်းပြန်ပါ။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - { id: close-factors, type: slide.close, at: { mark: t-close } }
      - {
          id: reopen-notebook,
          type: workspace.openFile,
          at: { afterAction: close-factors },
          path: notebook/50-involvement.md,
        }
      - id: type-exp
        type: editor.type
        at: { mark: t-exp }
        cadence: line-by-line
        target: { file: notebook/50-involvement.md, after: "|---|---|---|\n" }
        text: "| အတွေ့အကြုံ | senior များ → ဝေး | လူသစ် 3 ယောက် ပါ → နီး |\n"
      - id: type-know
        type: editor.type
        at: { mark: t-know }
        cadence: line-by-line
