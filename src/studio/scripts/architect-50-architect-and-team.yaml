  - id: changes
    chapter: ကိုယ် ဘာကို ပြောင်းမလဲ
    narration: >
      [[mark:ch-booking]] Booking အတွက် ကိုယ် ပြောင်းမှာက approval ကို ရပ်လိုက်တာပါ။ ဘောင်က ရှိပြီးသားပါ။
      ဆုံးဖြတ်ချက်တွေက architecture decision record၊ အတိုကောက် ADR တွေထဲမှာ ရှိပြီး၊ fitness function၊
      ဆိုလိုတာက အလိုအလျောက် စစ်ဆေးချက်တွေက pipeline ထဲမှာ စောင့်ပေးနေပါတယ်။ ဘောင်ထဲမှာ မောင်မောင် တို့
      ကိုယ်တိုင် ဆုံးဖြတ်ပြီး၊ ကိုယ်ကတော့ နှစ်ပတ် တစ်ခါ တွေ့ပါမယ်။
      [[mark:ch-partner]] Partner API အတွက်ကတော့ အပတ်စဉ် design review တစ်ခု စပါမယ်။ ပထမဆုံး API ကိုလည်း
      သူတို့နဲ့ အတူ ထိုင်ဆွဲပါမယ်။
      [[mark:ch-check]] မေ့တတ်တဲ့ အဆင့်တွေအတွက် checklist တိုတို တစ်ခုလည်း ထည့်ပါမယ်။ checklist ဆိုတာ အလုပ်ကို
      ဘယ်လို လုပ်ရမလဲ သင်ပေးဖို့ မဟုတ်ဘဲ၊ တတ်ပြီးသား လူတွေ အလျင်စလိုမှာ မေ့တတ်တဲ့ အဆင့်တွေအတွက်ပါ။ ဥပမာ API ကို
      ပြောင်းရင် ကားလိုင်းတွေကို ကြိုအကြောင်းကြားပြီးပြီလား ဆိုတာမျိုးပါ။
      [[mark:ch-code]] နီးနီးနေမယ် ဆိုတာ team ရဲ့ အဓိက code ကို ကိုယ်တိုင် ဝင်ရေးမယ်လို့ မဆိုလိုပါဘူး။ architect က
      release အတွက် မရှိမဖြစ် code ကို ကိုင်ထားရင်၊ အစည်းအဝေးတွေကြားမှာ ကိုယ် မအားတဲ့အခါတိုင်း team က
      ကိုယ့်ကို စောင့်နေရတတ်ပါတယ်။
      [[mark:ch-tech]] technical ဖြစ်နေဖို့ဆိုရင် proof of concept၊ ဆိုလိုတာက အကြံတစ်ခု အလုပ်ဖြစ်မဖြစ် စမ်းကြည့်တဲ့
      code အသေးလေး ရေးပြတာ၊ စစ်ဆေးချက်တွေကို automate လုပ်ပေးတာနဲ့ code review လုပ်ပေးတာတွေက ပိုသင့်တော်ပါတယ်။
      [[mark:ch-again]] သုံးလကြာရင် ဒီ table ကို ပြန်ပြီး အမှတ်ပေးပါမယ်။ Partner API team ကျွမ်းကျင်လာရင် ကိုယ်လည်း
      တဖြည်းဖြည်း ပြန်ဆုတ်ရမှာပါ။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - id: type-booking
        type: editor.type
        at: { mark: ch-booking }
        cadence: line-by-line
        target: { file: notebook/50-involvement.md, after: "1 နှစ်ကျော် project → နီး |\n" }
        text: "\n## ကိုယ် ပြောင်းမယ့်အရာ\n- Booking: approval ရပ်မယ်။ ADR နဲ့ fitness function ဘောင်ထဲမှာ team က ဆုံးဖြတ်၊ 2 ပတ် တစ်ခါ တွေ့\n"
      - id: type-partner
        type: editor.type
        at: { mark: ch-partner }
        cadence: line-by-line
        target: { file: notebook/50-involvement.md, after: "2 ပတ် တစ်ခါ တွေ့\n" }
        text: "- Partner API: အပတ်စဉ် design review၊ ပထမ API ကို အတူ ဆွဲ\n"
      - id: type-check
        type: editor.type
        at: { mark: ch-check }
        cadence: line-by-line
        target: { file: notebook/50-involvement.md, after: "ပထမ API ကို အတူ ဆွဲ\n" }
        text: "- Partner API: release checklist တိုတို (မေ့တတ်တဲ့ အဆင့်တွေအတွက်)\n"
      - id: type-self
        type: editor.type
        at: { mark: ch-tech }
        cadence: line-by-line
        target: { file: notebook/50-involvement.md, after: "(မေ့တတ်တဲ့ အဆင့်တွေအတွက်)\n" }
        text: "- ကိုယ်: release အတွက် မရှိမဖြစ် code မကိုင်ဘူး။ proof of concept၊ automation၊ code review ပဲ\n"
      - id: type-again
        type: editor.type
        at: { mark: ch-again }
        cadence: line-by-line
        target: { file: notebook/50-involvement.md, after: "code review ပဲ\n" }
        text: "- 3 လကြာရင် ဒီ table ကို ပြန်အမှတ်ပေး\n"
      - id: expect-booking
        type: expect.file
        at: { afterAction: type-again }
        path: notebook/50-involvement.md
        contains: "- Booking: approval ရပ်မယ်။ ADR နဲ့ fitness function ဘောင်ထဲမှာ team က ဆုံးဖြတ်၊ 2 ပတ် တစ်ခါ တွေ့\n"

  - id: your-turn
    chapter: ကိုယ့် team အတွက်
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ဒီ table မှာ column အသစ် တစ်ခု ထည့်ပြီး ကိုယ့် team ကို
      အချက် ငါးချက်နဲ့ အမှတ်ပေးကြည့်ပါ။
      [[mark:turn-2]] ပြီးရင် ကိုယ့် team ရဲ့ architect က နီးလွန်းနေတာလား၊ ဝေးလွန်းနေတာလား တစ်ကြောင်း ရေးပါ။
      ကိုယ်တိုင်က architect ဆိုရင်တော့ ကိုယ့်အကြောင်းကို ရေးပါ။ team ထဲက တစ်ယောက်ကိုပါ မေးကြည့်ရင် ပိုမှန်တဲ့
      အဖြေ ရပါလိမ့်မယ်။
    sources:
      - {
