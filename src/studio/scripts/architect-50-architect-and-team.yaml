build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 8150

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: need
    chapter: Team နှစ်ခု၊ ပြဿနာ နှစ်မျိုး
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ diagram တစ်ခုကို လူတစ်မျိုးအတွက် မေးခွန်း တစ်ခုကို ဖြေအောင် ဆွဲပြီး၊ တစ်ပိုင်းချင်း
      တင်ပြပုံကို လေ့လာခဲ့ပါတယ်။
      [[mark:open-doc]] ဒီ lesson ကစပြီး ပုံတွေ၊ စာရွက်တွေထက် လူတွေနဲ့ အလုပ်လုပ်တဲ့ဘက်ကို ကြည့်ပါမယ်။ ခရီးဖော် မှာ
      team ၁၂ ခု ရှိပြီး၊ architect က ကိုယ် အပါအဝင် လေးယောက်ပဲ ရှိပါတယ်။ ဒီအပတ်ထဲမှာ ကိုယ် သတိထားမိတာ နှစ်ခု
      ရှိပါတယ်။
      [[mark:sel-booking]] Booking team က ပြောင်းလဲမှု သေးသေးလေးတွေအတွက်တောင် ကိုယ့် approval ကို စောင့်နေကြပါတယ်။
      Booking team lead မောင်မောင် က ပြီးခဲ့တဲ့အပတ်က change တစ်ခု ကိုယ့်ဆီမှာ ကိုးရက် ကြာနေတယ်လို့ ပြောလာပါတယ်။
      [[mark:sel-partner]] တစ်ဖက်မှာတော့ ကားလိုင်းတွေရဲ့ system နဲ့ ချိတ်ဖို့ API ကို ဆောက်နေတဲ့ Partner API team နဲ့
      ကိုယ် စကားမပြောဖြစ်တာ လေးလ ရှိနေပါပြီ။
      [[mark:n-both]] တစ်ခုက နီးလွန်းပြီး၊ နောက်တစ်ခုက ဝေးလွန်းနေတာပါ။ ဒါဆို architect တစ်ယောက်က team တစ်ခုနဲ့
      ဘယ်လောက် နီးနီး အလုပ်လုပ်သင့်လဲ။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - {
          id: open-notebook,
          type: workspace.openFile,
          at: { mark: open-doc },
          path: notebook/50-involvement.md,
        }
      - id: sel-booking
        type: editor.select
        at: { mark: sel-booking }
        target:
          {
            file: notebook/50-involvement.md,
            text: "- Booking team: ပြောင်းလဲမှုတိုင်း architect ရဲ့ approval ကို စောင့်ရတယ် (တစ်ခါ 9 ရက်)",
          }
      - id: sel-partner
        type: editor.select
        at: { mark: sel-partner }
        target:
          {
            file: notebook/50-involvement.md,
            text: "- Partner API team: architect နဲ့ စကားမပြောတာ 4 လ ရှိပြီ",
          }

  - id: dial
    chapter: ဝေးလွန်းတာနဲ့ နီးလွန်းတာ
    narration: >
      [[mark:d-open]] architect နဲ့ team ကြားက အကွာအဝေးကို မျဉ်းတစ်ကြောင်းပေါ်မှာ တင်ကြည့်ရအောင်။
      [[mark:d-far]] တစ်ဖက်စွန်းက ဝေးလွန်းတာပါ။ diagram ပေါ်မှာ box တစ်ခု ဆွဲပေးပြီး ပျောက်သွားတာမျိုးပါ။ box က
      ဘာလုပ်ရမလဲ မရှင်းသလို၊ လက်တွေ့မှာ ဘာဖြစ်နေလဲ ဆိုတာကိုလည်း ပြန်မကြည့်တော့ပါဘူး။
      [[mark:d-far-me]] Partner API team နဲ့ ကိုယ် ဖြစ်နေတာ ဒါပါပဲ။
      [[mark:d-near]] နောက်တစ်ဖက်စွန်းက နီးလွန်းတာပါ။ class နာမည်၊ table ပုံစံလို အသေးစိတ်တွေအထိ architect က
      ဆုံးဖြတ်ပေးနေတာမျိုးပါ။ developer တွေမှာ စဉ်းစားစရာ မကျန်တော့သလို၊ အလုပ်အားလုံးကလည်း လူတစ်ယောက်ကို
      စောင့်နေရပါတယ်။
      [[mark:d-near-me]] Booking team နဲ့ ကိုယ် ဖြစ်နေတာကတော့ ဒီဘက်ပါ။
      [[mark:d-trap]] နှစ်ခုလုံးက ဘယ် architect မဆို ကျတတ်တဲ့ ထောင်ချောက်တွေပါ။ အလုပ်များရင် ဝေးသွားတတ်ပြီး၊
      စိတ်ပူရင် နီးလာတတ်ပါတယ်။
      [[mark:d-zone]] အသုံးဝင်တဲ့ နေရာက အလယ်မှာပါ။ team အလုပ်လုပ်ဖို့ ကျယ်လောက်တဲ့ ဘောင်ကို သတ်မှတ်ပေးပြီး၊
      လိုတဲ့အချိန် အလွယ်တကူ တွေ့နိုင်အောင် နေပေးတာပါ။ ဘောင်ဆိုတာ ဒီ service က ဘာကို တာဝန်ယူလဲ၊ ဘယ်
      စည်းကမ်းတွေကို မချိုးရဘူးလဲ ဆိုတာမျိုးပါ။ ဘောင်ထဲမှာတော့ team က ကိုယ်တိုင် ဆုံးဖြတ်ပါတယ်။
    sources:
