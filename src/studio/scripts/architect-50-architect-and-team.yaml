  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ architect က team နဲ့ ဝေးလွန်းရင် box ဆွဲပြီး ပျောက်သွားသူ ဖြစ်ပြီး၊ နီးလွန်းရင်
      အသေးစိတ် အကုန် ဆုံးဖြတ်ပေးသူ ဖြစ်သွားပါတယ်။ အသုံးဝင်တဲ့ နေရာက ဘောင် သတ်မှတ်ပေးပြီး၊ အလွယ်တကူ
      တွေ့နိုင်အောင် နေတာပါ။
      [[mark:recap-2]] ဘယ်လောက် နီးရမလဲ ဆိုတာ team ထဲက လူတွေရော၊ သူတို့ လုပ်ရမယ့် အလုပ်ရဲ့ သဘောပါ
      ပေါ်မှာ မူတည်ပြီး၊ အချိန်နဲ့အမျှ ပြောင်းပါတယ်။ team ဒုက္ခရောက်နေတဲ့ လက္ခဏာတွေကိုတော့ အနားမှာ
      ရှိမှ မြင်ရတာပါ။
      [[mark:next]] team နဲ့ နီးနီး အလုပ်လုပ်ရင် အမြင် မတူတာတွေနဲ့လည်း ကြုံရမှာပါ။ နောက် lesson မှာတော့
      ညှိနှိုင်းတာနဲ့၊ ဆုံးဖြတ်ချက် တစ်ခုကို လူအမျိုးမျိုး နားလည်အောင် ပြောပြတာကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
