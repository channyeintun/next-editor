    latencyMs: 600
    result:
      status: success
      stdout: "Rust has 4 bytes

        readers: Rust and Rust

        owner: Rust!\n"
      stderr: ""

scenes:
  - id: recap
    chapter: ဘာကြောင့် borrow လုပ်ရလဲ
    narration: >-
      ownership ရဲ့ စည်းမျဉ်း သုံးချက်ကို အရင် lesson မှာ မြင်ခဲ့ပြီးပါပြီ။ တန်ဖိုး တိုင်းမှာ owner
      တစ်ယောက် ရှိပြီး၊ တစ်ချိန်မှာ owner တစ်ယောက်ပဲ ရှိနိုင်ပါတယ်။ ပြီးတော့ owner က scope
      ကုန်သွားတဲ့အခါ၊ အဲဒီ တန်ဖိုးကို drop လုပ်ပါတယ်။ [[mark:show-move]] move ဆိုတာကိုလည်း
      မြင်ခဲ့ပြီးပါပြီ။ s1 ကို s2 ထဲ ထည့်လိုက်ပြီးတဲ့နောက် s1 ကို ထပ်သုံးရင်၊ E0382 error တက်ပါတယ်။
      error message ထဲမှာ borrow လို့ ပါနေတာက၊ s1 ကို print ထုတ်တာဟာ s1 ကို borrow လုပ်ရုံပဲ လုပ်တာ
      ဖြစ်လို့ပါ။ borrow ဆိုတာ ငှားသုံးတာပါ။ ဒါပေမဲ့ String တစ်ခုကို function တစ်ခုဆီ
      ပေးလိုက်ရင်တော့၊ variable အသစ်ထဲ ထည့်လိုက်သလိုပဲ move ဖြစ်သွားပါတယ်။ ဒါဆို function တစ်ခုက
      ကိုယ့် String ကို မယူဘဲ ဘယ်လို သုံးနိုင်မလဲ။ အဖြေကတော့ borrow လုပ်လိုက်တာပါပဲ။
    sources:
      - title: "The Rust Book — Ownership Rules"
        url: "https://doc.rust-lang.org/book/ch04-01-what-is-ownership.html#ownership-rules"
      - title: "The Rust Book — Ownership and Functions"
        url: "https://doc.rust-lang.org/book/ch04-01-what-is-ownership.html#ownership-and-functions"
      - title: "Rust error codes — E0382"
        url: "https://doc.rust-lang.org/error_codes/E0382.html"
    actions:
      # Opens in the quiet handle before the first word.
      - id: show-rules
        type: slide.show
        at: { scene: start, offsetMs: -1200 }
        slideId: ownership-rules
      # No close first: showing another slide advances the deck in place.
      - id: show-move
        type: slide.show
        at: { mark: show-move }
        slideId: move-error

  - id: reference
    narration: >-
      reference ဆိုတာ borrow လုပ်တဲ့ နည်းလမ်းပါ။ [[mark:draw-owner]] ဒီမှာ owner ဆိုတဲ့ နာမည်နဲ့
      String တစ်ခု ရှိပါတယ်။ သူက Rust ဆိုတဲ့ စာသားကို ပိုင်ဆိုင်ပြီး၊ အဲဒီ စာသားက heap ပေါ်မှာ
      ရှိပါတယ်။ [[mark:draw-ref]] owner ရှေ့မှာ ampersand ထည့်လိုက်ရင် reference တစ်ခု ရပါတယ်။ ဒီ
      reference က owner ဆီကို ညွှန်ထားတဲ့အတွက်၊ သူ့ကနေ တစ်ဆင့် စာသားကို ဖတ်လို့ ရပါတယ်။
      [[mark:draw-drop]] ဒါပေမဲ့ reference က အဲဒီ တန်ဖိုးကို မပိုင်ဆိုင်ပါဘူး။ ဒါကြောင့် borrow
      ကုန်သွားတဲ့အခါ ဘာမှ drop မဖြစ်ပါဘူး။ စာသားက owner ဆီမှာပဲ ဆက်ရှိနေပါတယ်။
    sources:
      - title: "The Rust Book — References and Borrowing"
        url: "https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html"
    actions:
      - id: close-move
        type: slide.close
        at: { scene: start }
      - id: open-board-ref
        type: whiteboard.apply
        at: { scene: start, offsetMs: 300 }
        open: true
        upsertIds: [r-title]
      - id: draw-owner
        type: whiteboard.apply
        at: { mark: draw-owner }
        upsertIds:
          [
            r-owner-box,
            r-owner-text,
            r-heap-arrow,
            r-heap-box,
            r-heap-text,
            r-heap-label,
            r-owner-label,
          ]
        drawMs: 2400
      - id: draw-ref
        type: whiteboard.apply
        at: { mark: draw-ref }
        upsertIds: [r-ref-box, r-ref-text, r-ref-arrow, r-ref-label]
        drawMs: 2400
      - id: draw-drop
        type: whiteboard.apply
        at: { mark: draw-drop }
        upsertIds: [r-drop]
        drawMs: 1600

  - id: measure
    chapter: Function ထဲမှာ borrow လုပ်ခြင်း
    narration: >-
      ဒါကို code နဲ့ ရေးကြည့်ရအောင်။ ဒီမှာ owner ဆိုတဲ့ variable ထဲမှာ Rust ဆိုတဲ့ စာသား ရှိနေပါတယ်။
      [[mark:type-measure]] measure ဆိုတဲ့ function တစ်ခု ထည့်ကြည့်ရအောင်။ ဒီ function က String
      တစ်ခုရဲ့ အရှည်ကို byte အရေအတွက်နဲ့ ပြန်ပေးပါတယ်။ [[mark:select-ref-type]] parameter ရဲ့ type
      ကို ကြည့်ပါ။ ampersand String၊ ဆိုလိုတာက String တစ်ခုကို ညွှန်ထားတဲ့ reference တစ်ခုပါ။
      ဒါကြောင့် measure က String ကို borrow လုပ်ရုံပဲ လုပ်ပါတယ်။ ဖတ်တော့ ဖတ်ပါတယ်၊ ဒါပေမဲ့ ဘယ်တော့မှ
      မပိုင်ဆိုင်ပါဘူး။
    sources:
      - title: "The Rust Book — References and Borrowing"
        url: "https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html"
      - title: "std::string::String::len"
        url: "https://doc.rust-lang.org/std/string/struct.String.html#method.len"
    actions:
      - id: close-board-ref
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-main
        type: workspace.openFile
        at: { scene: start, offsetMs: 800 }
        path: main.rs
      - id: type-measure
        type: editor.type
        at: { mark: type-measure }
        target:
          file: main.rs
          after: ""
          occurrence: 1
        cadence: line-by-line
        text: "fn measure(text: &String) -> usize {

          \    text.len()

          }

          \n"
      - id: select-ref-type
        type: editor.select
        at: { mark: select-ref-type }
        target:
          file: main.rs
          text: "&String"
          occurrence: 1

  - id: call
    narration: >-
      [[mark:type-call]] အခု အဲဒီ function ကို ခေါ်ကြည့်ရအောင်။ ခေါ်တဲ့နေရာမှာလည်း owner ရှေ့မှာ
      ampersand ထည့်ရေးပါတယ်။ ဒါမှ owner ကို move မဖြစ်စေဘဲ ငှားပေးလိုက်တာ ဖြစ်မှာပါ။
      [[mark:select-call]] borrow က ဒီနေရာမှာ စပြီး၊ measure က အလုပ်ပြီးလို့ ပြန်ထွက်လာတဲ့အခါ
      ကုန်သွားပါတယ်။ [[mark:type-print-length]] ဒါကြောင့် owner ကို ဆက်သုံးလို့ ရနေပါသေးတယ်။ owner
      ကို သူ့ အရှည်နဲ့အတူ print ထုတ်ကြည့်ရအောင်။
    sources:
      - title: "The Rust Book — References and Borrowing"
        url: "https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html"
    actions:
      - id: type-call
        type: editor.type
        at: { mark: type-call }
        target:
          file: main.rs
          after: "    let owner = String::from(\"Rust\");\n"
          occurrence: 1
        cadence: natural
        text: "    let length = measure(&owner);\n"
      - id: select-call
        type: editor.select
        at: { mark: select-call }
        target:
          file: main.rs
          text: "&owner"
          occurrence: 1
      - id: type-print-length
        type: editor.type
        at: { mark: type-print-length }
        target:
          file: main.rs
          after: "    let length = measure(&owner);\n"
          occurrence: 1
        cadence: line-by-line
        text: "    println!(\"{owner} has {length} bytes\");\n"

  - id: readers
    narration: >-
      ampersand သက်သက်ပဲ ထည့်ထားရင် shared reference တစ်ခု ရပါတယ်၊ immutable reference လို့လည်း
      ခေါ်ပါတယ်။ immutable ဆိုတာ ပြောင်းလို့ မရဘူး ဆိုတဲ့ သဘောပါ။ shared reference တွေက ဖတ်ရုံပဲ
      ဖတ်တဲ့အတွက်၊ တစ်ချိန်တည်းမှာ ကြိုက်သလောက် အများကြီး ရှိလို့ ရပါတယ်။ [[mark:type-readers]]
      first နဲ့ second ဆိုပြီး နှစ်ခု လုပ်ပြီး၊ နှစ်ခုလုံးကို print ထုတ်ကြည့်ရအောင်။
    sources:
      - title: "The Rust Book — Mutable References"
        url: "https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html#mutable-references"
    actions:
      - id: type-readers
        type: editor.type
        at: { mark: type-readers }
        target:
          file: main.rs
          after: "    println!(\"{owner} has {length} bytes\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "    let first = &owner;

          \    let second = &owner;

          \    println!(\"readers: {first} and {second}\");\n"

  - id: mutable
    chapter: Mutable reference တွေ
    narration: >-
      ဒါဆို function တစ်ခုက String ကို ပြောင်းဖို့ လိုလာရင်ရော။ အဲဒီအခါ mutable reference တစ်ခု
      လိုပါတယ်။ mutable ဆိုလိုတာက ပြောင်းလို့ ရတယ် ဆိုတဲ့ သဘောပါ။ [[mark:type-mut]] အရင်ဆုံး owner
      ကိုယ်တိုင်က ပြောင်းခွင့် ပေးထားရမှာ ဖြစ်လို့၊ owner ရှေ့မှာ mut ထည့်ကြည့်ရအောင်။ mut မပါရင်
      E0596 error တက်ပါလိမ့်မယ်၊ owner ကို mutable အဖြစ် မကြေညာထားပါဘူးတဲ့။ [[mark:type-exclaim]]
      အခု exclaim ဆိုတဲ့ function တစ်ခု ထည့်ပါမယ်။ သူက String ရဲ့ အဆုံးမှာ exclamation mark တစ်လုံး
      ထပ်ဖြည့်ပေးပါတယ်။ [[mark:select-mut-type]] သူ့ parameter ကတော့ ampersand mut String ပါ။
      ဆိုလိုတာက သူ borrow လုပ်ထားတဲ့ တန်ဖိုးကို ပြောင်းလို့ ရတဲ့ reference တစ်ခုပါ။
      [[mark:type-exclaim-call]] ခေါ်တဲ့အခါ ampersand mut owner နဲ့ ခေါ်ပြီး၊ နောက်ဆုံး
      စာကြောင်းကတော့ ရလဒ်ကို print ထုတ်ပေးပါတယ်။
    sources:
      - title: "The Rust Book — Mutable References"
        url: "https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html#mutable-references"
      - title: "Rust error codes — E0596"
        url: "https://doc.rust-lang.org/error_codes/E0596.html"
      - title: "std::string::String::push_str"
        url: "https://doc.rust-lang.org/std/string/struct.String.html#method.push_str"
    actions:
      - id: type-mut
        type: editor.type
        at: { mark: type-mut }
        target:
          file: main.rs
          after: "fn main() {\n    let "
          occurrence: 1
        cadence: natural
        text: "mut "
      - id: type-exclaim
        type: editor.type
        at: { mark: type-exclaim }
        target:
          file: main.rs
          after: "    text.len()\n}\n"
          occurrence: 1
        cadence: line-by-line
        text: "

          fn exclaim(text: &mut String) {

          \    text.push_str(\"!\");

          }\n"
      - id: select-mut-type
        type: editor.select
        at: { mark: select-mut-type }
        target:
          file: main.rs
          text: "&mut String"
          occurrence: 1
      - id: type-exclaim-call
        type: editor.type
        at: { mark: type-exclaim-call }
        target:
          file: main.rs
          after: "    println!(\"readers: {first} and {second}\");\n"
          occurrence: 1
        cadence: fast-explainer
        text: "    exclaim(&mut owner);\n"

  - id: rule
    chapter: ဖတ်တဲ့သူ အများ ဒါမှမဟုတ် ရေးတဲ့သူ တစ်ယောက်
    narration: >-
      [[mark:show-borrow-rules]] အခု ဒါတွေအားလုံးကို ဘေးကင်းအောင် ထိန်းပေးတဲ့ စည်းမျဉ်းကို
      ကြည့်ရအောင်။ ဘယ်အချိန်မှာမဆို shared reference တွေ၊ ဆိုလိုတာက ဖတ်တဲ့သူတွေ၊ အများကြီး ရှိလို့
      ရပါတယ်။ ဒါမှမဟုတ် mutable reference၊ ဆိုလိုတာက ရေးတဲ့သူ၊ တစ်ယောက်တည်း ရှိလို့ ရပြီး၊ သူ့ဘေးမှာ
      ဖတ်တဲ့သူ တစ်ယောက်မှ မရှိရပါဘူး။ နှစ်မျိုးလုံး တစ်ပြိုင်နက်ကတော့ ဘယ်တော့မှ မရပါဘူး။ ပြီးတော့
      reference တစ်ခုဟာ သူ borrow လုပ်ထားတဲ့ တန်ဖိုးထက် ပိုကြာကြာ ရှိနေလို့ မရပါဘူး။ ဘာကြောင့်
      ဒီလောက် တင်းကျပ်ရလဲဆိုတော့၊ String တစ်ခုကို ပြောင်းလိုက်တဲ့အခါ သူ့ စာသားက memory နေရာ အသစ်ဆီ
      ရွှေ့သွားနိုင်လို့ပါ။ အဲဒီအခါ စာသား အဟောင်းကို ညွှန်ထားတဲ့ reference က ပြန်လွှတ်လိုက်ပြီးသား
      memory ကို ညွှန်နေမှာ ဖြစ်ပါတယ်။
    sources:
      - title: "The Rust Book — The Rules of References"
        url: "https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html#the-rules-of-references"
      - title: "The Rust Book — Reading Elements of Vectors"
        url: "https://doc.rust-lang.org/book/ch08-01-vectors.html#reading-elements-of-vectors"
    actions:
      - id: show-borrow-rules
        type: slide.show
        at: { mark: show-borrow-rules }
        slideId: borrow-rules

  - id: error
    narration: >-
      ဒါဆို ဖတ်တဲ့သူ တစ်ယောက်ကို သုံးနေတုန်း ရေးတဲ့သူ စဝင်လာရင် ဘာဖြစ်မလဲ။ [[mark:draw-err-code]]
      ဒီမှာ first က owner ကို borrow လုပ်ထားပါတယ်။ ပြီးတော့ exclaim က owner ကို mutable အနေနဲ့
      borrow လုပ်ပြီး၊ အဲဒီနောက်မှ first ကို print ထုတ်ပါတယ်။ [[mark:draw-err-msg]] compiler က E0502
      error နဲ့ ရပ်သွားပါတယ်။ owner ကို immutable အနေနဲ့ borrow လုပ်ထားတုန်း ဖြစ်လို့၊ mutable
      အနေနဲ့ ထပ် borrow လုပ်လို့ မရပါဘူးတဲ့။ [[mark:draw-err-labels]] compiler က immutable borrow
      ဖြစ်တဲ့ နေရာ၊ mutable borrow ဖြစ်တဲ့ နေရာ၊ ပြီးတော့ first ကို နောက်မှ ပြန်သုံးတဲ့ နေရာ၊
      သုံးနေရာလုံးကို ညွှန်ပြထားပါတယ်။ [[mark:draw-err-two]] mutable borrow နှစ်ခုကို တစ်ပြိုင်နက်
      လုပ်ကြည့်ရင်လည်း ရမှာ မဟုတ်ပါဘူး၊ အဲဒါကတော့ E0499 error ပါ။
    sources:
      - title: "Rust error codes — E0502"
        url: "https://doc.rust-lang.org/error_codes/E0502.html"
      - title: "Rust error codes — E0499"
        url: "https://doc.rust-lang.org/error_codes/E0499.html"
    actions:
      - id: close-borrow-rules
        type: slide.close
        at: { scene: start }
      - id: open-board-error
        type: whiteboard.apply
        at: { scene: start, offsetMs: 300 }
        open: true
        clear: true
        upsertIds: [e-title]
      - id: draw-err-code
        type: whiteboard.apply
        at: { mark: draw-err-code }
        upsertIds: [e-code1, e-code2, e-code3]
        drawMs: 2000
      - id: draw-err-msg
        type: whiteboard.apply
        at: { mark: draw-err-msg }
        upsertIds: [e-msg1, e-msg2]
        drawMs: 2400
      - id: draw-err-labels
        type: whiteboard.apply
        at: { mark: draw-err-labels }
        upsertIds: [e-u1, e-l1, e-u2, e-l2, e-u3, e-l3]
        drawMs: 3000
      - id: draw-err-two
        type: whiteboard.apply
        at: { mark: draw-err-two }
        upsertIds: [e-two]
        drawMs: 1600

  - id: last-use
    narration: >-
      ဒါဆို ကိုယ့် program ကျတော့ ဘာကြောင့် compile လုပ်လို့ ရနေတာလဲ။ [[mark:draw-fix]]
      ဘာကြောင့်လဲဆိုတော့၊ borrow တစ်ခုဟာ သူ့ကို နောက်ဆုံး သုံးတဲ့ နေရာအထိပဲ ကြာလို့ပါ။ ဖတ်တဲ့သူကို
      နောက်ဆုံး သုံးတဲ့ နေရာက mutable borrow မတိုင်ခင်မှာ ရှိနေရင်၊ အဆင်ပြေပါတယ်။
      [[mark:select-readers-use]] ကိုယ့် ဖတ်တဲ့သူ နှစ်ယောက်ကို နောက်ဆုံး သုံးထားတာက ဒီ စာကြောင်းမှာ
      ဖြစ်ပြီး၊ exclaim ကို မခေါ်ခင်ပါ။ ဒါကြောင့် ရေးတဲ့သူ စဝင်လာတဲ့အချိန်မှာ သူတို့ အလုပ်
      ပြီးနေပါပြီ။
    sources:
      - title: "The Rust Book — Mutable References"
        url: "https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html#mutable-references"
    actions:
      - id: draw-fix
        type: whiteboard.apply
        at: { mark: draw-fix }
        upsertIds: [e-fix]
        drawMs: 1000
      - id: close-board-error
        type: whiteboard.apply
        at: { mark: select-readers-use, offsetMs: -500 }
        open: false
      - id: select-readers-use
        type: editor.select
        at: { mark: select-readers-use }
        target:
          file: main.rs
          text: '    println!("readers: {first} and {second}");'
          occurrence: 1

  - id: run
    narration: >-
      [[mark:run]] ကဲ၊ run ကြည့်ရအောင်။ ပထမ စာကြောင်းက Rust မှာ 4 byte ရှိတယ်လို့ ပြောပါတယ်၊ ဒါက
      borrow တစ်ခုကနေ တစ်ဆင့် တိုင်းထားတာပါ။ ဖတ်တဲ့သူ နှစ်ယောက်လုံးက Rust ကို မြင်ရပါတယ်။ ပြီးတော့
      နောက်ဆုံး စာကြောင်းမှာ Rust နောက်မှာ exclamation mark တစ်လုံး ပါလာပါပြီ။ ဒါက mutable reference
      ကနေ တစ်ဆင့် ပြောင်းလိုက်တာ ဖြစ်ပြီး၊ owner ကတော့ အဲဒီ စာသားကို ဆက်ပိုင်ဆိုင်နေတုန်းပါပဲ။
    sources:
      - title: "The Rust Book — References and Borrowing"
        url: "https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html"
    actions:
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "owner: Rust!"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: "exclaim(&mut owner);"

  - id: wrap
    narration: >-
      ဒါဆို ပြန်ချုပ်ရရင်၊ reference ဆိုတာ တန်ဖိုး တစ်ခုကို မပိုင်ဆိုင်ဘဲ သုံးနိုင်အောင်
      လုပ်ပေးတာပါ။ shared reference က ဖတ်ဖို့ ဖြစ်ပြီး၊ mutable reference ကတော့ ပြောင်းဖို့ပါ။
      ပြီးတော့ ဖတ်တဲ့သူ အများကြီး ဒါမှမဟုတ် ရေးတဲ့သူ တစ်ယောက်တည်းပဲ ရပြီး၊ နှစ်မျိုးလုံး
      တစ်ပြိုင်နက်တော့ ဘယ်တော့မှ မရပါဘူး။ နောက် lesson မှာတော့ slice တွေ၊ ဆိုလိုတာက String တစ်ခု
      ဒါမှမဟုတ် array တစ်ခုရဲ့ အစိတ်အပိုင်း တစ်ခုကို ညွှန်တဲ့ reference တွေကို ကြည့်သွားပါမယ်။
    sources:
      - title: "The Rust Book — References and Borrowing"
        url: "https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html"
      - title: "The Rust Book — The Slice Type"
        url: "https://doc.rust-lang.org/book/ch04-03-slices.html"
    actions: []

checks:
  # 500 (not the default 300): google-svg deck slides embed per-slide font
  # data whose paint briefly stalls the main thread at each show/close.
  - { type: timing.p95Ms, max: 500 }
