  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ model က စာကို token တစ်ခုချင်း၊ အလေးချိန်တွေကို ချိန်ပြီး ရွေးရင်း ဆက်ရေးပါတယ်။
      ဒါကြောင့် မေးခွန်း တစ်ခုတည်းကနေ မူကြမ်း အမျိုးမျိုး ထွက်လာနိုင်ပြီး၊ ထွက်လာတဲ့ စာက ချောမွေ့ပေမဲ့
      စစ်ပြီးသား စာ မဟုတ်ပါဘူး။
      [[mark:recap-2]] တူရမယ့် အပိုင်းကို format၊ ဥပမာနဲ့ system ထဲက data နဲ့ ထိန်းရပြီး၊ မှန်ရမယ့် အချက်ကို fact
      ပေးတာနဲ့ လူ စစ်တာနဲ့ ထိန်းရပါတယ်။
      [[mark:next]] နောက် lesson မှာတော့ မူကြမ်း နှစ်စောင်ကနေ ထပ်စပါမယ်။ တစ်စောင်က packet loss ဆိုတာကို
      ပြည့်ပြည့်စုံစုံ ရှင်းပြနိုင်ပြီး၊ နောက်တစ်စောင်က နေခြည် မရောင်းတော့တဲ့ plan ရဲ့ ဈေးကို ပြောထားပါတယ်။
      model က ဘာကို သိပြီး ဘာကို မသိလဲ ဆိုတဲ့ model ရဲ့ knowledge ကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "Claude Docs: Glossary",
          url: "https://platform.claude.com/docs/en/about-claude/glossary",
        }
