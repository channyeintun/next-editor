build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 9303

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: two-drafts
    chapter: မူကြမ်း နှစ်စောင်
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ Claude လို model က ရှိပြီးသား အဖြေကို ရှာပေးတာ မဟုတ်ဘဲ၊ စာ အသစ်ကို ရေးပေးတာ
      ဖြစ်ကြောင်းနဲ့၊ အပြုအမူက အလွှာ သုံးလွှာကနေ လာကြောင်း ကြည့်ခဲ့ပါတယ်။ ဒီနေ့တော့ support manager လှလှ
      စုပေးထားတဲ့ မူကြမ်းတွေထဲက billing ticket တစ်ခုရဲ့ မူကြမ်း နှစ်စောင်ကနေ စပါမယ်။
      [[mark:ex-open]] အဲဒီ မူကြမ်းတွေကို ရေးခဲ့တဲ့ support agent က chat AI ကို မေးခွန်း တစ်ခုတည်း နှစ်ခါ
      မေးကြည့်ခဲ့ပါတယ်။ ဒါက အဲဒီ မူကြမ်း နှစ်စောင်ရဲ့ ဥပမာပါ။
      [[mark:sel-customer]] customer က ဒီလ bill ကို မှားပြီး နှစ်ခါ ပေးမိသွားလို့ ဘယ်လို လုပ်ရမလဲ လို့ မေးထားပါတယ်။
      [[mark:sel-draft-1]] ပထမ မူကြမ်းက ပိုပေးထားတဲ့ ငွေကို ခုနစ်ရက်အတွင်း ပြန်အမ်းပေးမယ်လို့ ပြောပါတယ်။
      [[mark:sel-draft-2]] ဒုတိယ မူကြမ်းကတော့ အဲဒီ ငွေကို နောက်လ bill ထဲမှာ နုတ်ပေးမယ်လို့ ပြောပါတယ်။ နှစ်စောင်လုံး
      ယဉ်ကျေးပြီး၊ ယုံကြည်မှု အပြည့်နဲ့ ရေးထားပါတယ်။
      [[mark:agent-ask]] support agent ရဲ့ မေးခွန်းက ဒီ နှစ်စောင်ထဲက ဘယ်ဟာ မှန်လဲ ဆိုတာပါ။ ဒီမေးခွန်းကို မဖြေခင်
      တခြား မေးခွန်း တစ်ခုကို အရင် ဖြေရပါမယ်။ မေးခွန်း တူတူကို ဘာကြောင့် အဖြေ နှစ်မျိုး ရတာလဲ ဆိုတာပါ။
    sources:
      - {
          title: "Claude Docs: Glossary",
          url: "https://platform.claude.com/docs/en/about-claude/glossary",
        }
    actions:
      - {
          id: open-ex,
          type: workspace.openFile,
          at: { mark: ex-open },
          path: examples/03-two-drafts.md,
        }
      - id: sel-customer
        type: editor.select
        at: { mark: sel-customer }
        target:
          file: examples/03-two-drafts.md
          text: "ဒီလ bill ကို မှားပြီး နှစ်ခါ ပေးမိသွားတယ်။ ဘယ်လို လုပ်ရမလဲ။"
      - id: sel-draft-1
        type: editor.select
        at: { mark: sel-draft-1 }
        target:
          file: examples/03-two-drafts.md
          text: "ပိုပေးထားတဲ့ ငွေကို 7 ရက်အတွင်း ပြန်အမ်းပေးပါမယ်။"
      - id: sel-draft-2
        type: editor.select
        at: { mark: sel-draft-2 }
        target:
          file: examples/03-two-drafts.md
          text: "ပိုပေးထားတဲ့ ငွေကို နောက်လ bill ထဲမှာ နုတ်ပေးပါမယ်။"

  - id: tokens
    chapter: Token တစ်ခုချင်း
    narration: >
      [[mark:t-open]] model က စာကို ဘယ်လို ရေးလဲ ကြည့်ရအောင်။ model က စာကို token လို့ ခေါ်တဲ့ အပိုင်းအစလေးတွေနဲ့
      ဖတ်ပြီး token တွေနဲ့ပဲ ရေးပါတယ်။ token တစ်ခုက စာလုံး တစ်လုံး ဖြစ်နိုင်သလို၊ စာလုံးရဲ့ အစိတ်အပိုင်း
      တစ်ခုလည်း ဖြစ်နိုင်ပါတယ်။ စာ တစ်ကြောင်းကို token ဘယ်နှခု ဖြတ်မလဲ ဆိုတာ model နဲ့ ဘာသာစကား ပေါ်မှာ
      မူတည်ပါတယ်။
      [[mark:t-ctx]] မူကြမ်း နှစ်စောင်လုံး ပိုပေးထားတဲ့ ငွေကို ဆိုတဲ့ နေရာအထိ တူတူပါပဲ။ model က ဒီအထိ
      ရေးပြီးပြီ ဆိုပါစို့။
      [[mark:t-cands]] နောက်ထပ် ဘာ လာမလဲ ဆိုတာကို model က ဖြစ်နိုင်တဲ့ token တွေ တစ်ခုချင်းစီကို အလေးချိန်
      ပေးပြီး ခန့်မှန်းပါတယ်။ ဒီ ဂဏန်းတွေကတော့ ကိုယ်တို့ နားလည်အောင် ထည့်ထားတဲ့ ဥပမာ သက်သက်ပါ။ တကယ့်
      model ထဲက ဂဏန်းတွေ မဟုတ်သလို၊ တကယ့် token တွေကလည်း ဒီ စကားလုံး အစုတွေထက် သေးပါတယ်။
      [[mark:t-pick]] ပြီးတော့ အဲဒီထဲက token တစ်ခုကို ရွေးလိုက်ပါတယ်။ ဘယ်ဟာ ရွေးခံရမလဲ ဆိုတာ အလေးချိန်ပေါ်မှာ
      မူတည်ပေမဲ့၊ ခါတိုင်း တူတူ ရွေးမယ်လို့ အာမခံချက် မရှိပါဘူး။ ပထမ အကြိမ်မှာတော့ ပြန်အမ်းပေး ဆိုတဲ့ token
      ကို ရွေးခဲ့ပါတယ်။
      [[mark:t-loop]] ရွေးလိုက်တဲ့ token ကို စာထဲ ထည့်ပြီး၊ ပိုရှည်သွားတဲ့ စာ အပေါ်မှာ နောက် token ကို ထပ်ပြီး
      ခန့်မှန်းပါတယ်။ ပြီးရင် ထပ်ရွေး၊ ထပ်ထည့်ပါတယ်။ reply တစ်စောင်လုံးကို ဒီလို token တစ်ခုချင်း ရေးသွားတာပါ။
      ရှေ့က စာကို ကြည့်ပြီး နောက်လာမယ့် token ကို ခန့်မှန်းတဲ့ ဒီ နည်းကို next token prediction လို့ ခေါ်ပါတယ်။
    sources:
      - {
          title: "Claude Docs: Glossary",
          url: "https://platform.claude.com/docs/en/about-claude/glossary",
        }
    actions:
      - {
          id: draw-t-open,
          type: whiteboard.apply,
          at: { mark: t-open },
          open: true,
          clear: true,
          upsertIds: [t-title],
        }
      - {
          id: draw-t-ctx,
          type: whiteboard.apply,
          at: { mark: t-ctx },
          upsertIds: [t-ctx, t-ctx-l],
          drawMs: 1200,
        }
      - {
          id: draw-t-cands,
          type: whiteboard.apply,
          at: { mark: t-cands },
          upsertIds: [t-brace, t-c1, t-c2, t-c3, t-note],
          drawMs: 2400,
        }
      - {
          id: draw-t-pick,
          type: whiteboard.apply,
          at: { mark: t-pick },
          upsertIds: [t-pick1],
          drawMs: 700,
        }
      - {
          id: draw-t-loop,
          type: whiteboard.apply,
          at: { mark: t-loop },
          upsertIds: [t-loop, t-loop-l],
          drawMs: 1500,
        }

  - id: two-picks
    narration: >
      [[mark:t-pick2]] ဒုတိယ အကြိမ် မေးတဲ့အခါ ဒီ နေရာမှာပဲ နောက်လ bill ထဲ ဆိုတဲ့ token ကို ရွေးမိသွားပါတယ်။
      token တစ်ခု ကွာသွားတာနဲ့ နောက်က token တွေ အားလုံးက အဲဒီ token ပေါ်မှာ ဆက်ရေးတာမို့၊ မူကြမ်း တစ်စောင်လုံး
      တခြား လမ်းကြောင်း ရောက်သွားပါတယ်။ ဒါကြောင့် မေးခွန်း တစ်ခုတည်းကို နှစ်ခါ မေးရင် မူကြမ်း နှစ်မျိုး
      ထွက်လာနိုင်ပါတယ်။ model ပျက်နေလို့ မဟုတ်ဘဲ၊ ရေးပုံကိုက ဒီလိုမို့ပါ။
      [[mark:t-temp]] developer တွေ ကြားဖူးတဲ့ temperature ဆိုတဲ့ setting တစ်ခု ရှိခဲ့ပါတယ်။ ခန့်မှန်းချက်တွေ ဘယ်လောက်
      ကျပန်းဆန်မလဲ ချိန်တဲ့ setting ပါ။ ဒါပေမဲ့ အနိမ့်ဆုံး သုည ထားတဲ့အခါတောင် အဖြေ တူတူ ထွက်မယ်လို့ အာမခံချက်
      မရှိခဲ့ပါဘူး။ [[mark:t-now]] ဒီ lesson ကို ရေးတဲ့ အချိန်မှာ Opus ရဲ့ နောက်ဆုံး model လို model တွေမှာ အဲဒီ setting ကို request
      ထဲ ထည့်ရင် error ပြန်ပါတယ်။ ဒါကြောင့် ကွာခြားမှုကို ပိတ်ပေးမယ့် ခလုတ် တစ်ခု မရှိပါဘူး။ တူညီမှုကို prompt
      နဲ့ design ကနေပဲ ရအောင် လုပ်ရပါတယ်။
    sources:
      - {
          title: "Claude Docs: Glossary",
          url: "https://platform.claude.com/docs/en/about-claude/glossary",
        }
      - {
          title: "Claude Docs: Migration guide (Claude Opus 5.5)",
          url: "https://platform.claude.com/docs/en/models/opus-5-5/migration-guide",
        }
    actions:
      - {
          id: draw-t-pick2,
          type: whiteboard.apply,
          at: { mark: t-pick2 },
          upsertIds: [t-pick2],
          drawMs: 700,
        }

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ လိုင်းကျနေတဲ့ မြို့နယ်က connection ticket တစ်ခုအတွက် မူကြမ်း နှစ်စောင်
      ရလာတယ် ဆိုပါစို့။ နှစ်စောင်လုံးက လိုင်းကျနေကြောင်း၊ technician တွေ ပြင်နေကြောင်း၊ router ကို ပြန်ဖွင့်စရာ
      မလိုကြောင်း ပြောပါတယ်။ ကွာတာက တစ်စောင်က တောင်းပန်စကားနဲ့ စပြီး၊ နောက်တစ်စောင်က နှုတ်ဆက်စကားနဲ့
      စတာပါ။ စာကြောင်း အစီအစဉ်လည်း မတူပါဘူး။ ဒီ ကွာခြားမှုက ဘာလဲ။
      [[mark:q-a]] ပထမ အဖြေက ပြင်ရမယ့် အမှား ဆိုတာပါ။
      [[mark:q-b]] ဒုတိယ အဖြေက မျှော်လင့်ထားရမယ့် ပုံမှန် အခြေအနေ ဆိုတာပါ။ lesson ကို pause လုပ်ပြီး
      စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ အဖြေပါ။ ဘာကြောင့်လဲဆိုတော့ customer သိရမယ့် အချက်တွေနဲ့ လုပ်ရမယ့်
      အဆင့်တွေက နှစ်စောင်လုံးမှာ အတူတူပဲ ဖြစ်နေလို့ပါ။ token တစ်ခုချင်း ရွေးရေးတဲ့ model ဆီကနေ စကားလုံး
      ရွေးပုံ ကွာတာကို မျှော်လင့်ထားရပါမယ်။ customer အတွက်လည်း ဘာမှ မထိခိုက်ပါဘူး။
      [[mark:q-rule]] စစ်ရမယ့် ပြဿနာ ဖြစ်လာတာက fact ကွာတဲ့အခါပါ။ တစ်စောင်က လိုင်းကျနေတယ် ပြောပြီး နောက်တစ်စောင်က
      router ပြန်ဖွင့်ခိုင်းရင်၊ ဒါမှမဟုတ် ငွေ ပြန်အမ်းမယ်၊ bill ထဲ နုတ်မယ် ဆိုပြီး ကွဲနေရင်တော့ ဒါက စာ ရေးပုံ ကွာတာ
      မဟုတ်တော့ပါဘူး။
    sources:
      - {
          title: "Claude Docs: Glossary",
          url: "https://platform.claude.com/docs/en/about-claude/glossary",
        }
      - {
          title: "Claude Docs: Reduce hallucinations",
          url: "https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: q-rule },
          upsertIds: [q-rule],
          drawMs: 1200,
        }

  - id: fluent
    chapter: ချောမွေ့တာနဲ့ စစ်ပြီးတာ
    narration: >
      [[mark:f-open]] ငွေ ပြန်အမ်းတဲ့ မူကြမ်း နှစ်စောင်ကို ပြန်ကြည့်ရအောင်။ ဒီ နှစ်စောင်က fact ချင်း ကွဲနေတာမို့
      ဘယ်ဟာ မှန်လဲ ဆိုတဲ့ မေးခွန်းက တကယ် အရေးကြီးပါတယ်။
      [[mark:f-pred]] token ကို ခန့်မှန်းတဲ့ အဆင့်မှာ model က ရှေ့က စာနဲ့ ကိုက်ညီမယ့် token ကို ရွေးပါတယ်။
      ဒါကြောင့် ထွက်လာတဲ့ စာက ဖတ်လို့ ချောမွေ့ပြီး၊ customer service စာ တစ်စောင်လို ယုံကြည်မှု ရှိရှိ ပေါ်တတ်ပါတယ်။
      လှလှ မေးခဲ့တဲ့ ဘာကြောင့် ဒီလောက် သေချာသလို ပြောလဲ ဆိုတဲ့ မေးခွန်းရဲ့ အဖြေက ဒါပါ။ သေချာတဲ့ လေသံက
      စာရဲ့ ပုံစံပါ။ စစ်ပြီးလို့ သေချာတာ မဟုတ်ပါဘူး။
      [[mark:f-check]] ဒီ ခန့်မှန်းတဲ့ အဆင့်ထဲမှာ ရေးလိုက်တဲ့ အချက်ကို နေခြည် ရဲ့ Billing စည်းကမ်းနဲ့ တိုက်စစ်တဲ့
      အပိုင်း မပါပါဘူး။ ပိုပေးတဲ့ ငွေကို ပြန်အမ်းမလား၊ နောက်လ bill ထဲ နုတ်မလား ဆိုတာ နေခြည် ရဲ့ စည်းကမ်းပေါ်
      မူတည်ပေမဲ့၊ model က အဲဒီ စည်းကမ်းကို မမြင်ရပါဘူး။ Anthropic ရဲ့ docs မှာလည်း အဆင့်မြင့် model တွေတောင်
      တစ်ခါတစ်ရံ အချက်အလက် မှားတဲ့ စာကို ရေးတတ်တယ်လို့ ဆိုထားပါတယ်။
      [[mark:f-sig]] စိတ်ဝင်စားစရာ ကောင်းတာက မူကြမ်း နှစ်စောင် ကွဲသွားတာကိုယ်တိုင်က အသုံးဝင်တဲ့ သတိပေးချက် ဖြစ်တာပါ။
      docs မှာ prompt တစ်ခုတည်းကို အကြိမ်ကြိမ် run ပြီး ရလဒ်တွေကို ယှဉ်ကြည့်တဲ့ နည်းကို ဖော်ပြထားပါတယ်။ fact ချင်း
      မတူရင် model က မသိတာကို ဖြည့်ရေးနေတဲ့ လက္ခဏာ ဖြစ်နိုင်ပါတယ်။
      [[mark:f-fix]] ဒါကြောင့် support agent ရဲ့ မေးခွန်းအတွက် အဖြေက ဘယ် မူကြမ်းမှ စစ်ပြီးသား မဟုတ်ဘူး ဆိုတာပါ။
      မှန်ဖို့ဆိုရင် စည်းကမ်း စာကို model မြင်အောင် ပေးရမယ်၊ ပို့မယ့်အချိန်မှာ လူက စစ်ရပါမယ်။
    sources:
      - {
          title: "Claude Docs: Reduce hallucinations",
          url: "https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations",
        }
    actions:
      - {
          id: draw-f-open,
          type: whiteboard.apply,
          at: { mark: f-open },
          clear: true,
          upsertIds: [f-title],
        }
      - {
          id: draw-f-pred,
          type: whiteboard.apply,
          at: { mark: f-pred },
          upsertIds: [f-b1, f-b1-l, f-ok],
          drawMs: 1500,
        }
      - {
          id: draw-f-check,
          type: whiteboard.apply,
          at: { mark: f-check },
          upsertIds: [f-b2, f-b2-l, f-no],
          drawMs: 1500,
        }
      - {
          id: draw-f-sig,
          type: whiteboard.apply,
          at: { mark: f-sig },
          upsertIds: [f-sig],
          drawMs: 1200,
        }
      - {
          id: draw-f-fix,
          type: whiteboard.apply,
          at: { mark: f-fix },
          upsertIds: [f-fix],
          drawMs: 1200,
        }

  - id: must-not-vary
    chapter: မပြောင်းရမယ့် အပိုင်း
    narration: >
      [[mark:w-open]] ဒါဆို reply တစ်စောင်ထဲမှာ ဘယ်အပိုင်းက ခါတိုင်း တူရမလဲ၊ ဘယ်အပိုင်းက ကွာလို့ ရလဲ၊ တူအောင်
      ဘယ်လို လုပ်မလဲ ဆိုတာကို table တစ်ခုနဲ့ ချရေးကြည့်ရအောင်။ ကွာခြားမှုကို ပိတ်တဲ့ ခလုတ် မရှိတော့ ဒါက
      ကိုယ်တို့ ဆွဲရမယ့် design ပါ။
      [[mark:type-1]] ပထမ အပိုင်းက ticket နံပါတ်နဲ့ customer နာမည်ပါ။ ဒါတွေကို model ကို ရေးခိုင်းစရာ မလိုပါဘူး။
      Ticket system ထဲမှာ ရှိပြီးသားမို့ program ကနေ တိုက်ရိုက် ထည့်ပေးရင် ဘယ်တော့မှ မကွာတော့ပါဘူး။
      [[mark:type-2]] ဒုတိယ အပိုင်းက ဒီနေ့ ပြဿနာ ဖြစ်ခဲ့တဲ့ ငွေ ပြန်အမ်းတဲ့ စည်းကမ်းပါ။ မှန်ဖို့ အရေးကြီးတဲ့ အချက်မို့
      နည်းလမ်း နှစ်ခုလုံး လိုပါတယ်။ စည်းကမ်း စာကို model မြင်အောင် ထည့်ပေးရမယ်၊ ပို့ခါနီးမှာ support agent
      က စစ်ရမယ်။
      [[mark:type-3]] တတိယ အပိုင်းက reply ရဲ့ ပုံစံပါ။ နှုတ်ဆက်တာ၊ လုပ်ရမယ့် အဆင့်တွေ၊ နိဂုံး ဆိုတဲ့ အစီအစဉ်က support
      agent တွေ အမြန် စစ်နိုင်ဖို့ ခါတိုင်း တူရပါမယ်။ လိုချင်တဲ့ format ကို ရှင်းရှင်း ရေးပြပြီး၊ ကောင်းတဲ့ reply
      ဥပမာ တချို့ ပေးထားရင် ရလဒ်တွေ ပိုတူလာတတ်ပါတယ်။
      [[mark:type-4]] စတုတ္ထ အပိုင်းက စကားလုံး ရွေးပုံနဲ့ စာကြောင်း အစီအစဉ်ပါ။ ဒါကတော့ ကွာလို့ ရပါတယ်။ ဒီ
      အပိုင်းကို တူအောင် အားထုတ်ရင် အချိန်ကုန်ရုံပဲ ရှိပြီး customer အတွက် ဘာမှ မပိုကောင်းလာပါဘူး။
      [[mark:sel-how]] ဒီ table ရဲ့ နောက်ဆုံး column ကို ကြည့်ရင် တူညီမှုက format၊ ဥပမာ၊ system ထဲက data ကနေ လာပြီး၊
      မှန်ကန်မှုက fact နဲ့ လူ့ စစ်ဆေးမှုကနေ လာတာ တွေ့ရပါတယ်။ ဘယ်တစ်ခုမှ model ကို ယုံလိုက်ရုံနဲ့ မရပါဘူး။
    sources:
      - {
          title: "Claude Docs: Increase output consistency",
          url: "https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/increase-consistency",
        }
      - {
          title: "Claude Docs: Prompting best practices",
          url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices",
        }
    actions:
      - { id: close-board, type: whiteboard.apply, at: { mark: w-open }, open: false }
      - {
          id: open-notebook,
          type: workspace.openFile,
          at: { afterAction: close-board },
          path: notebook/03-what-must-not-vary.md,
        }
      - id: type-1
        type: editor.type
        at: { mark: type-1 }
        cadence: line-by-line
        target: { file: notebook/03-what-must-not-vary.md, after: "|---|---|---|\n" }
        text: "| ticket နံပါတ်၊ customer နာမည် | အမြဲ တူ | Ticket system ကနေ တိုက်ရိုက် ထည့် |\n"
      - id: type-2
        type: editor.type
        at: { mark: type-2 }
        cadence: line-by-line
        target: { file: notebook/03-what-must-not-vary.md, after: "တိုက်ရိုက် ထည့် |\n" }
        text: "| ငွေ ပြန်အမ်းတဲ့ စည်းကမ်း | အမြဲ တူ | Billing စည်းကမ်း စာ ထည့်ပေး၊ support agent စစ် |\n"
      - id: type-3
        type: editor.type
        at: { mark: type-3 }
        cadence: line-by-line
        target: { file: notebook/03-what-must-not-vary.md, after: "support agent စစ် |\n" }
        text: "| reply ပုံစံ: နှုတ်ဆက်၊ အဆင့်၊ နိဂုံး | အမြဲ တူ | format ရေးပြ၊ reply ဥပမာ 3 ခု ပေး |\n"
      - id: type-4
        type: editor.type
        at: { mark: type-4 }
        cadence: line-by-line
        target: { file: notebook/03-what-must-not-vary.md, after: "reply ဥပမာ 3 ခု ပေး |\n" }
        text: "| စကားလုံး ရွေးပုံ၊ စာကြောင်း အစီအစဉ် | ကွာလို့ ရ | မလို |\n"
      - id: expect-row-2
        type: expect.file
        at: { afterAction: type-4 }
        path: notebook/03-what-must-not-vary.md
        contains: "| ငွေ ပြန်အမ်းတဲ့ စည်းကမ်း | အမြဲ တူ | Billing စည်းကမ်း စာ ထည့်ပေး၊ support agent စစ် |\n"
      - id: sel-how
        type: editor.select
        at: { mark: sel-how }
        target:
          file: notebook/03-what-must-not-vary.md
          text: "ဘယ်လို တူအောင် လုပ်မလဲ"

  - id: your-turn
    chapter: ကိုယ့် project အတွက်
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ကိုယ့် project ထဲမှာ AI ရေးပေးတဲ့ အပိုင်း တစ်ခုကို
      စဉ်းစားပါ။ အဲဒီထဲက ဘယ်တော့မှ မပြောင်းရမယ့် အရာ သုံးခုကို ဒီ table ထဲမှာ ထပ်ရေးကြည့်ပါ။
      [[mark:turn-2]] တစ်ခုချင်းအတွက် နောက်ဆုံး column မှာ အဲဒီ အရာက ဘယ်ကနေ လာရမလဲ ဆိုတာကို ရေးပါ။ system ထဲက
      data လား၊ format နဲ့ ဥပမာလား၊ လူ့ စစ်ဆေးမှုလား ဆိုတာ ခွဲပြီး ရေးကြည့်ရင်၊ model ကို ဘာ တာဝန် ပေးလို့
      မရဘူး ဆိုတာ ရှင်းလာပါလိမ့်မယ်။
    sources:
