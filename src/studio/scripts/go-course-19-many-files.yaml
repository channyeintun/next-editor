        package main

        func main() {
        	parcels := []Parcel{
        		{Code: "MDY-0001", To: "MDY", WeightKg: 2.5},
        		{Code: "NPT-0001", To: "NPT", WeightKg: 1},
        		{Code: "YGN-0001", To: "YGN", WeightKg: 0.5},
        	}
        	for _, p := range parcels {
        		printReceipt(p)
        	}
        }
      parcel.go: |
        package main
      fees.go: |
        package main
      receipt.go: |
        package main
