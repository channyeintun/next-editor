# Go course, lesson 19: one program in many files (Burmese).
#
# Start state (COURSE-KIT 3.5): main.go holds the flow (three parcels, a loop calling
# printReceipt); parcel.go, fees.go and receipt.go hold only `package main`.
# Edits, all insert-only (final files = probe 18-r3):
#   1. parcel.go: Parcel (with field comments) and cityNames -> run-1: compile error
#      `./main.go:10:3: undefined: printReceipt` (the error names the file that uses the name);
#   2. fees.go: perKg, maxWeightKg, baseFees, the Fee method; receipt.go: import "fmt",
#      formatKyat, printReceipt -> run-2: three receipt lines;
#   3. main.go: a fourth parcel to Bago (1.2 kg) -> run-3: the fourth line, priced by fees.go and
#      printed by receipt.go.
# Boards: (O) one package = the parcel office, files = its rooms; (X) one func main per program
# (`main redeclared in this block`, board only) and file names are for people; (P) packages,
# modules and go.mod, capital letters as the doors between packages; (Q) quiz: a lower-case
# function used from another file.
# Fixtures: bun ~/Documents/go-course-work/tools/sim-go.ts <this yaml> --write
schemaVersion: 1

lesson:
  slug: go-course-19-many-files
  title: "Go course 19: Program တစ်ခု၊ file အများ"
  locale: my-MM
