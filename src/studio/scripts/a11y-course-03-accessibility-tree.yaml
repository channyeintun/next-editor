# Accessibility course, lesson 3: the accessibility tree and semantic HTML.
#
# The first hands-on lesson. Two boards explain how a screen reader gets the
# page (DOM -> accessibility tree -> platform accessibility API -> assistive
# technology) and what a node carries (role, name, state, properties). Then the
# tea shop's code: the accessibility panel is introduced, a real toggle button
# shows role/name/state (and its state changing), and the order "button" made of
# a div is shown failing: it works with the mouse, but it has no row in the tree,
# no tab badge, and Tab skips it. A real <button> is inserted next to it (kept
# side by side for comparison, said honestly) and the row, the tab stop and Tab
# focus appear. One paragraph on ARIA (aria-pressed is already on the toggle)
# hands over to lesson 4. The role="button" + tabindex patch is NOT taught here.
#
# Built from template.yaml + ws/ (pinned byte-exact) with:
#   bun ~/Documents/a11y-course-work/probe/build.ts template.yaml ws a11y-course-03-accessibility-tree.yaml
# Validate with (from the repo root):
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   ~/Documents/a11y-course-work/tools/verify.sh <this file>
schemaVersion: 1

lesson:
  slug: a11y-course-03-accessibility-tree
  title: "Accessibility course 3: Accessibility tree နဲ့ semantic HTML"
  locale: my-MM
  workspace:
    lessonType: javascript
    name: Accessibility course
    entryFilePath: index.html
    files:
      base.css: |
        /*
          base.css: pinned, never typed during a lesson.
          The shop's palette and page furniture, in its accessible form: every text
          colour passes WCAG AA, form fields have 3:1 borders, nothing hides focus.
          A lesson keeps the sections it needs and drops any declaration its own demo
          types or relies on being absent (COURSE-KIT.md, "Deriving a lesson
          workspace"). Section E holds the few rules a start state pins on purpose,
          including deliberately broken ones (a pale colour, a removed outline).
          Keep it free of the url, image-set and @-import functions (they switch on
          Vite's postcss step); images come from <img>.
        */

        /* == A. palette == */
        :root {
          color-scheme: light;
          --tea-dark: #3b2314;
          --tea: #8b5a2b;
          --tea-light: #c9a27e;
          --cream: #fff8ec;
          --paper: #fdf3e1;
          --leaf: #2f6b3a;
          --gold: #c9a227;
          --chili: #b23a2b;
          --ink: #2b1d14;
          --muted: #6b5a4c;
          --line: #e6d5bf;
          --field: #8a7866;
          --radius: 12px;
        }

        /* == B. page == */
        body {
          margin: 0;
          font-family: "Noto Sans Myanmar", "Myanmar Sangam MN", "Myanmar MN", "Myanmar Text", "Padauk",
            system-ui, sans-serif;
          font-size: 16px;
          line-height: 1.8;
          color: var(--ink);
          background: var(--paper);
        }

        .page {
          padding: 0 16px 24px;
        }

        h1,
        h2,
        h3 {
          margin: 0 0 8px;
          line-height: 1.5;
        }

        h1 {
          font-size: 22px;
        }

        h2 {
          font-size: 20px;
        }

        h3 {
          font-size: 17px;
        }

        a {
          color: var(--tea);
        }

        /* A class that sets display must never un-hide a [hidden] element. */
        [hidden] {
          display: none !important;
        }

        /* Text for screen readers only (the forms and images lessons use it). */
        .visually-hidden {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip-path: inset(50%);
          white-space: nowrap;
        }

        /* == B2. reset == */
        *,
        *::before,
        *::after {
          box-sizing: border-box;
        }

        /* == C. furniture == */
        .skip-link {
          position: absolute;
          top: -48px;
          left: 8px;
          padding: 4px 12px;
          background: var(--cream);
          color: var(--tea-dark);
        }

        .skip-link:focus {
          top: 8px;
        }

        .site-header {
          padding: 12px 16px;
          background: var(--tea-dark);
          color: var(--cream);
        }

        .site-header a {
