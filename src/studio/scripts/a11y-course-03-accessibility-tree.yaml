build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 2603

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  - id: intro
    chapter: "Accessibility tree ဆိုတာ ဘာလဲ"
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ accessibility ကို WCAG နဲ့ ဘယ်လို တိုင်းတာလဲ ဆိုတာ ကြည့်ခဲ့ပါတယ်။
      ဒီ lesson ကနေစပြီး လက်ဖက်ရည်ဆိုင် website ရဲ့ code ကို ဖွင့်ပြီး လက်တွေ့ ပြင်သွားပါမယ်။
      [[mark:start-server]] ပထမဆုံး မေးခွန်းကတော့၊ screen reader က page တစ်ခုကို ဘယ်လို
      ဖတ်လဲ ဆိုတာပါ။ screen reader ဆိုတာ screen ပေါ်က အကြောင်းအရာကို အသံနဲ့ ဒါမှမဟုတ်
      braille နဲ့ ဖတ်ပြတဲ့ software ပါ။ [[mark:draw-pixels]] ကိုယ်တွေ မျက်စိနဲ့ မြင်နေရတာက
      browser က screen ပေါ်မှာ ဆွဲပြထားတဲ့ ပုံပါ။ ဒါပေမဲ့ screen reader က အဲဒီ ပုံကို
      ကြည့်ပြီး ဖတ်တာ မဟုတ်ပါဘူး။ ပုံထဲမှာ ခလုတ်လို ပုံစံ ရှိနေရုံနဲ့ ခလုတ်မှန်း သူ
      မသိနိုင်ပါဘူး။ [[mark:draw-dom]] အဲဒီအစား browser ဆီကနေ page ရဲ့ အချက်အလက်တွေကို
      သီးသန့် တောင်းယူပါတယ်။ browser က HTML ကို ဖတ်ပြီး DOM tree ကို ဆောက်တယ် ဆိုတာ
      သိကြမှာပါ။ [[mark:draw-tree]] အဲဒီ DOM ကနေ browser က tree နောက်တစ်ခုကို ထပ်ဆောက်ပါတယ်။
      အဲဒါကို accessibility tree လို့ ခေါ်ပါတယ်။ DOM ထဲက အရာတိုင်း ပါတာ မဟုတ်ဘဲ၊
      assistive technology အတွက် အရေးပါတဲ့ အရာတွေကိုပဲ ရွေးပြီး၊ ဒါ ဘာလဲ၊ ဘယ်လို ခေါ်လဲ
      ဆိုတဲ့ အချက်တွေနဲ့ ပြထားတာပါ။ [[mark:draw-api]] ပြီးတော့ browser က အဲဒီ tree ကို
      operating system ရဲ့ accessibility API ကနေတစ်ဆင့် ပေးပါတယ်။ [[mark:draw-at]] နောက်ဆုံးမှာ
      screen reader လို assistive technology က အဲဒီ API ကနေ ဖတ်ယူပြီး၊ အသံ ဒါမှမဟုတ်
      braille အဖြစ် ပြောင်းပေးတာပါ။ ဆိုလိုတာက screen reader သုံးတဲ့သူ ဘာကြားရမလဲ ဆိုတာ၊
      accessibility tree ထဲမှာ ဘာပါလဲ ဆိုတာပေါ်မှာ မူတည်ပါတယ်။
    sources:
      - title: "web.dev Learn Accessibility — ARIA and HTML: the accessibility tree"
        url: "https://web.dev/learn/accessibility/aria-html"
      - title: "MDN — Accessibility tree"
        url: "https://developer.mozilla.org/en-US/docs/Glossary/Accessibility_tree"
      - title: "W3C — Core Accessibility API Mappings 1.2"
        url: "https://www.w3.org/TR/core-aam-1.2/"
    actions:
      - id: open-tree-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      # Runs in the background (boot + pnpm install + spawn); waitForReady sits
      # on the preview mark in the code tour, two boards of narration later.
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-pixels
        type: whiteboard.apply
        at: { mark: draw-pixels }
        upsertIds: [a-pixels, a-pixels-x]
        drawMs: 1400
      - id: draw-dom
        type: whiteboard.apply
        at: { mark: draw-dom }
        upsertIds: [a-dom-box, a-dom]
        drawMs: 1200
      - id: draw-tree
        type: whiteboard.apply
        at: { mark: draw-tree }
        upsertIds: [a-arrow1, a-tree-box, a-tree, a-tree-note]
        drawMs: 2000
      - id: draw-api
        type: whiteboard.apply
        at: { mark: draw-api }
        upsertIds: [a-arrow2, a-api-box, a-api]
        drawMs: 1500
      - id: draw-at
        type: whiteboard.apply
        at: { mark: draw-at }
        upsertIds: [a-arrow3, a-at-box, a-at, a-at-out]
        drawMs: 1800

  - id: node
    narration: >
      [[mark:draw-node-title]] accessibility tree ထဲက node တစ်ခုချင်းစီမှာ အဓိက အချက် သုံးခု
      ပါပါတယ်။ [[mark:draw-role]] ပထမက role ပါ။ role က ဒါ ဘာလဲ ဆိုတာကို ပြောတာပါ။ button
      လား၊ link လား၊ heading လား ဆိုတာမျိုးပါ။ [[mark:draw-name]] ဒုတိယက name ပါ။ name က
      ဒါကို ဘယ်လို ခေါ်လဲ ဆိုတာပါ။ ခလုတ်ပေါ်က စာသား၊ ပုံရဲ့ alt text၊ form field ရဲ့ label
      စတာတွေကနေ ရလာတာပါ။ [[mark:draw-state]] တတိယက state ပါ။ state က အခု ဘယ်လို အခြေအနေ
      ရောက်နေလဲ ဆိုတာပါ။ နှိပ်ထားလား၊ ဖွင့်ထားလား၊ check လုပ်ထားလား ဆိုတာမျိုးပါ။
      [[mark:draw-property]] ဒီ သုံးခုအပြင်၊ element တစ်ခုနဲ့ တစ်ခု ဘယ်လို ဆက်စပ်လဲ၊ အပို
      ရှင်းပြချက် ရှိလား ဆိုတာကို ပြတဲ့ property တွေလည်း ရှိပါသေးတယ်။ [[mark:draw-say]]
      ဥပမာအားဖြင့်၊ ဆိုင်ရဲ့ မှာမယ် ခလုတ်ဆိုရင် role က button၊ name က မှာမယ် ဖြစ်ရပါမယ်။
      ဒါမှ screen reader က ဒါ ခလုတ် တစ်ခုပါ၊ နာမည်က မှာမယ်ပါ လို့ ဖတ်ပြနိုင်မှာပါ။ role
      တို့ name တို့ မရှိရင်တော့ screen reader သုံးတဲ့သူအတွက် အဲဒီ ခလုတ်က မရှိသလိုပါပဲ။
    sources:
      - title: "web.dev Learn Accessibility — ARIA and HTML: roles, properties and states"
        url: "https://web.dev/learn/accessibility/aria-html"
      - title: "W3C — WAI-ARIA 1.2: roles, states and properties"
        url: "https://www.w3.org/TR/wai-aria-1.2/"
      - title: "W3C — Accessible Name and Description Computation 1.2"
        url: "https://www.w3.org/TR/accname-1.2/"
    actions:
      - id: draw-node-title
        type: whiteboard.apply
        at: { mark: draw-node-title }
        clear: true
        upsertIds: [b-title, b-card]
      - id: draw-role
        type: whiteboard.apply
        at: { mark: draw-role }
        upsertIds: [b-role]
        drawMs: 1200
      - id: draw-name
        type: whiteboard.apply
        at: { mark: draw-name }
        upsertIds: [b-name]
        drawMs: 1200
      - id: draw-state
        type: whiteboard.apply
        at: { mark: draw-state }
        upsertIds: [b-state]
        drawMs: 1400
      - id: draw-property
        type: whiteboard.apply
        at: { mark: draw-property }
        upsertIds: [b-prop]
        drawMs: 1200
      - id: draw-say
        type: whiteboard.apply
        at: { mark: draw-say }
        upsertIds: [b-say]
        drawMs: 1200

  - id: code-tour
    narration: >
      [[mark:close-board]] ကဲ၊ ဆိုင်ရဲ့ code ကို ကြည့်ရအောင်။ [[mark:open-index]] ဒါက page
      ရဲ့ HTML ဖိုင်ပါ။ အပေါ်ဆုံးမှာ ဆိုင်နာမည် ပါတဲ့ header ရှိပြီး၊ သူ့အောက်မှာ
      အော်ဒါမှာတဲ့ အပိုင်း ရှိပါတယ်။ အဲဒီထဲမှာ လက်ဖက်ရည် card တစ်ခု ရှိပြီး၊ card ထဲမှာ
      ကြိုက်တယ် ဆိုတဲ့ ခလုတ်လေး ပါပါတယ်။ [[mark:select-fake]] card ရဲ့ အောက်မှာတော့ မှာမယ်
      ခလုတ် ရှိပါတယ်။ သတိထား ကြည့်ပါ၊ ဒီ ခလုတ်ကို button element နဲ့ မဟုတ်ဘဲ div နဲ့
      ရေးထားပါတယ်။ CSS နဲ့ ခလုတ်လို ပုံစံ ပေးထားပြီး၊ နှိပ်ရင် အော်ဒါ မှာပြီးကြောင်း
      စာတစ်ကြောင်း ပေါ်လာအောင် script နဲ့ ချိတ်ထားပါတယ်။ တကယ့် website တွေမှာ ဒီလို div
      ခလုတ်တွေကို မကြာခဏ တွေ့ရပါတယ်။ [[mark:preview-shows]] ညာဘက်မှာ ဆိုင်ရဲ့ page ကို
      မြင်ရပါပြီ။ မျက်စိနဲ့ ကြည့်ရင်တော့ မှာမယ် ခလုတ်က တကယ့် ခလုတ်နဲ့ ဘာမှ မကွာပါဘူး။
    sources:
      - title: "web.dev Learn Accessibility — ARIA and HTML"
        url: "https://web.dev/learn/accessibility/aria-html"
      - title: "MDN — ARIA button role (a div is not a button)"
        url: "https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/button_role"
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: open-index
        type: workspace.openFile
        at: { mark: open-index }
        path: index.html
      - id: select-fake
        type: editor.select
        at: { mark: select-fake }
        target: { file: index.html, text: '<div class="order-btn"', occurrence: 1 }
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { mark: preview-shows }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-dev-server }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-document-row
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: a11y-document }
        textContains: 'document "ရွှေလက်ဖက်ရည်ဆိုင်" lang="my"'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: collapse-runner-dock
        type: runtime.collapseDock
        at: { afterAction: expect-document-row }

  - id: panel
    chapter: "Accessibility panel"
    narration: >
      preview ရဲ့ အောက်ပိုင်းမှာ အနက်ရောင် အကွက် တစ်ခု ရှိပါတယ်။ ဒါက
      ဒီ course အတွက် ထည့်ထားတဲ့ accessibility panel ပါ။ browser က assistive technology ကို
      ပေးမယ့် အချက်အလက်တွေကို ပြတာ ဖြစ်ပြီး၊ Chrome DevTools ထဲက accessibility tree နဲ့
      သဘောတရား တူပါတယ်။ ကိုယ့် ကွန်ပျူတာမှာလည်း DevTools ကို ဖွင့်ပြီး ဒီ tree ကို ကြည့်လို့
      ရပါတယ်။ [[mark:read-document]] ပထမဆုံး row က page တစ်ခုလုံးကို ကိုယ်စားပြုတဲ့ document
      ဖြစ်ပြီး၊ page title နဲ့ ဘာသာစကားကို ပြထားပါတယ်။ [[mark:read-heading]] အောက်မှာ header
      ကို banner အဖြစ်၊ ဆိုင်နာမည်ကို heading အဖြစ် တွေ့ရပါတယ်။ role က heading ဖြစ်ပြီး၊
      name ကတော့ ဆိုင်နာမည်ပါ။ level တစ် ဆိုတာကလည်း property တစ်ခုပါပဲ။ [[mark:read-fav]]
      ကြိုက်တယ် ခလုတ်ရဲ့ row ကို ကြည့်ပါ။ role က button၊ name က ကြိုက်တယ်၊ state ကတော့ not
      pressed ပါ။ ဆိုလိုတာက ဒီ ခလုတ်ကို မနှိပ်ရသေးဘူး ဆိုတာပါ။ panel ရဲ့ အောက်ဆုံးမှာ Tab
      order စာရင်း ရှိပြီး၊ page ပေါ်မှာလည်း ကြိုက်တယ် ခလုတ်ရဲ့ ထောင့်မှာ နံပါတ် တစ် badge
      လေး ပေါ်နေပါတယ်။ keyboard နဲ့ သုံးတဲ့သူက Tab key ကို နှိပ်သွားရင် ရောက်မယ့် နေရာတွေကို
      အစဉ်လိုက် ပြတာပါ။
    sources:
      - title: "web.dev Learn Accessibility — ARIA and HTML: the accessibility tree"
        url: "https://web.dev/learn/accessibility/aria-html"
      - title: "Chrome for Developers — Full accessibility tree in Chrome DevTools"
        url: "https://developer.chrome.com/blog/full-accessibility-tree"
      - title: "W3C — HTML Accessibility API Mappings (header → banner, h1 → heading level 1)"
        url: "https://www.w3.org/TR/html-aam-1.0/"
    actions:
      - id: expect-document-lang
        type: expect.preview
        at: { mark: read-document }
        timeoutMs: 5000
        target: { by: testId, value: a11y-document }
        attribute: { name: data-lang, value: "my" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-heading-row
        type: expect.preview
        at: { mark: read-heading }
        timeoutMs: 5000
        target: { by: testId, value: a11y-shop-name }
        textContains: 'heading level 1 "ရွှေလက်ဖက်ရည်ဆိုင်"'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-banner-row
        type: expect.preview
        at: { afterAction: expect-heading-row }
        timeoutMs: 5000
        target: { by: testId, value: a11y-site-header }
        textContains: "banner"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-fav-row
        type: expect.preview
        at: { mark: read-fav }
        timeoutMs: 5000
        target: { by: testId, value: a11y-favourite }
        textContains: 'button "ကြိုက်တယ်" not pressed'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-fav-tab-one
        type: expect.preview
        at: { afterAction: expect-fav-row }
        timeoutMs: 5000
        target: { by: testId, value: tab-favourite }
        attribute: { name: data-order, value: "1" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: state
    narration: >
      [[mark:click-fav]] ကြိုက်တယ် ခလုတ်ကို နှိပ်ကြည့်ရအောင်။ [[mark:after-fav]] ခလုတ်က
      အစိမ်းရောင် ပြောင်းသွားသလို၊ panel ထဲက row မှာလည်း state က pressed ဖြစ်သွားပါပြီ။
      row ကို အပြာရောင်နဲ့ ပြထားတာကတော့ ခလုတ်ပေါ်မှာ focus ရောက်နေလို့ပါ။ focus ဆိုတာ
      keyboard နဲ့ ဘယ် element ကို ရွေးထားလဲ ဆိုတာပါ။ screen reader ကလည်း ကြိုက်တယ်
      ခလုတ်ကို နှိပ်ထားပြီ ဆိုတာမျိုး ဖတ်ပြမှာပါ။ မျက်စိနဲ့ မြင်ရတဲ့ အရောင် ပြောင်းတာကို
      မမြင်ရတဲ့သူလည်း သိရအောင်၊ state က ပြန်ပြောပေးတာပါ။
    sources:
      - title: "web.dev Learn Accessibility — ARIA and HTML: states and values"
        url: "https://web.dev/learn/accessibility/aria-html"
      - title: "MDN — aria-pressed"
        url: "https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Attributes/aria-pressed"
    actions:
      - id: click-fav
        type: preview.click
        at: { mark: click-fav }
        timeoutMs: 5000
        target: { by: testId, value: favourite }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-fav-pressed
        type: expect.preview
        at: { mark: after-fav }
        timeoutMs: 5000
        target: { by: testId, value: a11y-favourite }
        attribute: { name: data-states, value: "pressed focused" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: div-problem
    chapter: "div ခလုတ်မှာ ဘာ ပျောက်နေလဲ"
    narration: >
      [[mark:click-fake]] ဒါဆို div နဲ့ ရေးထားတဲ့ မှာမယ် ခလုတ်ကို နှိပ်ကြည့်ရအောင်။
      [[mark:after-fake]] ခလုတ်အောက်မှာ မှာပြီးပါပြီ ဆိုတဲ့ စာ ပေါ်လာပါပြီ။ mouse နဲ့
      နှိပ်တဲ့သူအတွက်တော့ ဒီ ခလုတ်က အလုပ်လုပ်ပါတယ်။ ဒါပေမဲ့ panel ကို ပြန်ကြည့်ပါ။ tree
      ထဲမှာ မှာမယ် ဆိုတဲ့ button row လုံးဝ မရှိပါဘူး။ div မှာ role မရှိတဲ့အတွက် browser က
      သူ့ကို ခလုတ်လို့ မသိပါဘူး။ ဒါကြောင့် screen reader က မှာမယ် ဆိုတဲ့ စာသားကို
      ဖတ်ပြရင်တောင်၊ ဒါက နှိပ်လို့ ရတဲ့ ခလုတ်ပါ လို့ ပြောပြနိုင်မှာ မဟုတ်ပါဘူး။ [[mark:read-tabs]] Tab order စာရင်းမှာလည်း ကြိုက်တယ် ခလုတ် တစ်ခုပဲ ရှိပြီး၊ div မှာ badge မပေါ်ပါဘူး။
      [[mark:try-keyboard]] keyboard နဲ့ စမ်းကြည့်ရအောင်။ ဒီ lesson ထဲမှာ keyboard ကို တကယ်
      နှိပ်လို့ မရတဲ့အတွက်၊ panel ကို Tab key နှိပ်သလို focus ရွှေ့ခိုင်းပြီး ပြပါမယ်။
      အခု focus က ကြိုက်တယ် ခလုတ်ပေါ်မှာ ရှိနေပြီး၊ Tab key တစ်ချက် နှိပ်လိုက်ပါမယ်။
      [[mark:after-tab-away]] focus က မှာမယ် ဆီ မရောက်ဘဲ page ကနေ ထွက်သွားပါပြီ။
      ဆိုလိုတာက mouse မသုံးနိုင်လို့ keyboard တစ်ခုတည်းနဲ့ သုံးတဲ့သူက၊ ဒီ ဆိုင်မှာ အော်ဒါ
      မှာလို့ မရပါဘူး။
    sources:
      - title: "web.dev Learn Accessibility — ARIA and HTML: Rule 1, use the semantic element"
        url: "https://web.dev/learn/accessibility/aria-html"
      - title: "web.dev Learn Accessibility — Keyboard focus"
        url: "https://web.dev/learn/accessibility/focus"
      - title: "MDN — ARIA button role (a div is not a button)"
        url: "https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/button_role"
    actions:
      - id: click-fake
        type: preview.click
        at: { mark: click-fake }
        timeoutMs: 5000
        target: { by: testId, value: fake-order }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-fake-said
        type: expect.preview
        at: { mark: after-fake }
        timeoutMs: 5000
        target: { by: testId, value: order-status }
        textContains: "မှာပြီးပါပြီ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-one-stop
        type: expect.preview
        at: { mark: read-tabs }
        timeoutMs: 5000
        target: { by: testId, value: tab-count }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: tab-away
        type: preview.click
        at: { mark: after-tab-away }
        timeoutMs: 5000
        target: { by: testId, value: a11y-tab-next }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-focus-left
        type: expect.preview
        at: { afterAction: tab-away }
        timeoutMs: 5000
        target: { by: testId, value: a11y-favourite }
        attribute: { name: data-states, value: "pressed" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: fix
    chapter: "တကယ့် button ကို သုံးရအောင်"
    narration: >
      [[mark:select-div-again]] ဒီ ပြဿနာကို ဖြေရှင်းဖို့ အကောင်းဆုံး နည်းက၊ div ကို
      ပြင်ဆင်ဖာထေးတာ မဟုတ်ဘဲ တကယ့် button element ကို သုံးတာပါ။ [[mark:type-button]] div
      ရဲ့ ဘေးမှာ button element တစ်ခု ထည့်ပါမယ်။ ခလုတ်ပေါ်က စာသားက အရင်အတိုင်း မှာမယ်
      ပဲ ဖြစ်ပြီး၊ နှိပ်ရင် လုပ်မယ့် အလုပ်လည်း မပြောင်းပါဘူး။ ဘေးချင်း ယှဉ်ကြည့်လို့ ရအောင်
      div ကို ဒီမှာ ချန်ထားပါမယ်။ ကိုယ့် project မှာဆိုရင်တော့ div ကို ဖျက်ပြီး button နဲ့
      အစားထိုးရမှာပါ။ [[mark:after-button]] panel ကို ကြည့်ပါ။ ခုနက ဘာမှ မပေါ်ခဲ့တဲ့ နေရာမှာ
      role က button၊ name က မှာမယ် ဆိုပြီး row အသစ် ပေါ်လာပါပြီ။ page ပေါ်က ခလုတ် နှစ်ခုက
      ပုံစံ တူတူပဲ ဖြစ်ပေမယ့်၊ button element ရဲ့ ထောင့်မှာပဲ နံပါတ် နှစ် badge
      ပေါ်လာပါတယ်။ ကိုယ်က role ကို
      ကိုယ်တိုင် ရေးမပေးရဘဲ၊ browser က button element အတွက် role နဲ့ focus ကို အလိုလို
      ပေးထားလို့ပါ။
    sources:
      - title: "web.dev Learn Accessibility — ARIA and HTML: use the semantic element"
        url: "https://web.dev/learn/accessibility/aria-html"
      - title: "MDN — The button element"
        url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/button"
      - title: "W3C — HTML Accessibility API Mappings: button"
        url: "https://www.w3.org/TR/html-aam-1.0/#el-button"
    actions:
      - id: select-div-again
        type: editor.select
        at: { mark: select-div-again }
        target: { file: index.html, text: '<div class="order-btn"', occurrence: 1 }
      - id: type-button
        type: editor.type
        at: { mark: type-button }
        cadence: block
        target: { file: index.html, after: 'data-testid="fake-order">မှာမယ်</div>', occurrence: 1 }
        text: "\n        <button class=\"order-btn\" type=\"button\" data-say=\"မှာပြီးပါပြီ\" data-target=\"#order-status\" data-testid=\"order-button\">မှာမယ်</button>"
      - id: expect-button-row
        type: expect.preview
        at: { mark: after-button }
        timeoutMs: 5000
        target: { by: testId, value: a11y-order-button }
        textContains: 'button "မှာမယ်"'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-button-tab-two
        type: expect.preview
        at: { afterAction: expect-button-row }
        timeoutMs: 5000
        target: { by: testId, value: tab-order-button }
        attribute: { name: data-order, value: "2" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-two-stops
        type: expect.preview
        at: { afterAction: expect-button-tab-two }
        timeoutMs: 5000
        target: { by: testId, value: tab-count }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: keyboard
    narration: >
      [[mark:tab-one]] keyboard နဲ့ ထပ် စမ်းကြည့်ရအောင်။ Tab key တစ်ချက် နှိပ်ရင် ကြိုက်တယ်
      ခလုတ်ကို အရင် ရောက်ပါတယ်။ [[mark:tab-two]] Tab ကို နောက်တစ်ချက် ထပ်နှိပ်ပါမယ်။
      [[mark:after-tab-two]] ဒီတစ်ခါတော့ focus က မှာမယ် ခလုတ်ဆီ ရောက်လာပါပြီ။ badge က
      အနီရောင် ပြောင်းသွားပြီး၊ panel ထဲက row ကလည်း focused လို့ ပြနေပါတယ်။
      [[mark:explain-enter]] focus ရောက်နေတဲ့ button ကို keyboard သုံးတဲ့သူက Enter ဒါမှမဟုတ်
      Space နဲ့ နှိပ်လို့ ရပါတယ်။ ဒါကိုလည်း browser က button element အတွက် အလိုလို
      ပေးထားတာပါ။ ဒီ lesson ထဲမှာ Enter ကို နှိပ်ပြလို့ မရတဲ့အတွက် mouse နဲ့ပဲ နှိပ်ပြပါမယ်။
      [[mark:after-real]] မှာပြီးပါပြီ ဆိုတဲ့ စာ ပေါ်လာပြီး၊ ခလုတ်က div တုန်းကလိုပဲ
      အလုပ်လုပ်ပါတယ်။ lesson ကို pause လုပ်ပြီး run ကြည့်ပါ၊ ပြီးရင် preview ထဲမှာ Tab နဲ့
      Enter ကို ကိုယ်တိုင် နှိပ်စမ်းကြည့်ပါ။ semantic HTML ဆိုတာ ဒါပါပဲ။ အဓိပ္ပာယ် ပါတဲ့ HTML element ကို
      သုံးလိုက်ရင် role၊ name၊ focus နဲ့ keyboard အလုပ်လုပ်ပုံကို browser က အလကား ပေးပါတယ်။
    sources:
      - title: "web.dev Learn Accessibility — Keyboard focus"
        url: "https://web.dev/learn/accessibility/focus"
      - title: "web.dev Learn Accessibility — Content structure (semantic HTML)"
        url: "https://web.dev/learn/accessibility/structure"
      - title: "MDN — The button element (keyboard activation with Enter and Space)"
        url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/button"
    actions:
      - id: tab-one
        type: preview.click
        at: { mark: tab-one }
        timeoutMs: 5000
        target: { by: testId, value: a11y-tab-next }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-tab-fav
        type: expect.preview
        at: { afterAction: tab-one }
        timeoutMs: 5000
        target: { by: testId, value: tab-favourite }
        textContains: '1 button "ကြိုက်တယ်" focused'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: tab-two
        type: preview.click
        at: { mark: tab-two }
        timeoutMs: 5000
        target: { by: testId, value: a11y-tab-next }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-tab-order-button
        type: expect.preview
        at: { mark: after-tab-two }
        timeoutMs: 5000
        target: { by: testId, value: tab-order-button }
        textContains: '2 button "မှာမယ်" focused'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: click-real
        type: preview.click
        at: { mark: after-real }
        timeoutMs: 5000
        target: { by: testId, value: order-button }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-real-said
        type: expect.preview
        at: { afterAction: click-real }
        timeoutMs: 5000
        target: { by: testId, value: order-status }
        textContains: "မှာပြီးပါပြီ"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: aria
    chapter: "ARIA ဆိုတာ ဘာလဲ"
    narration: >
      [[mark:select-pressed]] နောက်ဆုံး တစ်ခု ကြည့်ရအောင်။ ကြိုက်တယ် ခလုတ်ပေါ်က aria pressed
      attribute ကို ကြည့်ပါ။ ခုနက panel ထဲမှာ မြင်ခဲ့တဲ့ pressed ဆိုတဲ့ state က ဒီကနေ
      လာတာပါ။ role attribute နဲ့ ဒီလို aria နဲ့ စတဲ့ attribute တွေကို စုပြီး ARIA လို့ ခေါ်ပါတယ်။ [[mark:draw-aria]]
      ARIA ဆိုတာ HTML element တွေရဲ့ role၊ state၊ property ကို accessibility tree မှာ
      ပြောင်းပေးတဲ့ attribute တွေပါ။ [[mark:draw-aria-no]] ဒါပေမဲ့ ARIA က tree ထဲမှာ ပြတာကိုပဲ
      ပြောင်းပါတယ်။ element ရဲ့ အလုပ်လုပ်ပုံ၊ keyboard နဲ့ သုံးလို့ ရမရ၊ မျက်စိနဲ့ မြင်ရတဲ့
      ပုံစံ၊ ဘာကိုမှ မပြောင်းပါဘူး။ ဥပမာအားဖြင့်၊ ကြိုက်တယ် ခလုတ် နှိပ်ရင် pressed
      ဖြစ်သွားတာက script က attribute ကို ပြောင်းပေးလို့ ဖြစ်ပြီး၊ အစိမ်းရောင်
      ဖြစ်သွားတာကလည်း CSS ကြောင့်ပါ။ [[mark:draw-aria-next]] ဒါကြောင့် ARIA ကို ဘယ်အချိန်
      သုံးသင့်လဲ၊ ဘယ်အချိန် မသုံးသင့်ဘူးလဲ ဆိုတာ သိထားဖို့ အရေးကြီးပါတယ်။ အဲဒါကို နောက်
      lesson မှာ အသေးစိတ် ကြည့်ပါမယ်။
    sources:
      - title: "web.dev Learn Accessibility — ARIA and HTML: introduction to ARIA"
        url: "https://web.dev/learn/accessibility/aria-html"
      - title: "W3C — WAI-ARIA 1.2"
        url: "https://www.w3.org/TR/wai-aria-1.2/"
      - title: "MDN — ARIA"
        url: "https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA"
    actions:
      - id: select-pressed
        type: editor.select
        at: { mark: select-pressed }
        target: { file: index.html, text: 'aria-pressed="false"', occurrence: 1 }
      - id: draw-aria
        type: whiteboard.apply
        at: { mark: draw-aria }
        open: true
        clear: true
        upsertIds: [c-title, c-tree]
        drawMs: 1600
      - id: draw-aria-no
        type: whiteboard.apply
        at: { mark: draw-aria-no }
        upsertIds: [c-behaviour, c-look]
        drawMs: 1800
      - id: draw-aria-next
        type: whiteboard.apply
        at: { mark: draw-aria-next }
        upsertIds: [c-next]
        drawMs: 1200

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:close-aria]] ဒါဆို ပြန်ချုပ်ရရင်၊ screen reader လို assistive technology က screen
      ပေါ်က ပုံကို မဖတ်ဘဲ၊ browser က DOM ကနေ ဆောက်ထားတဲ့ accessibility tree ကို ဖတ်ပါတယ်။
      tree ထဲက node တစ်ခုစီမှာ ဒါ ဘာလဲ ဆိုတဲ့ role၊ ဘယ်လို ခေါ်လဲ ဆိုတဲ့ name၊ အခု ဘယ်လို
      အခြေအနေလဲ ဆိုတဲ့ state တို့ ပါပါတယ်။ [[mark:select-final]] div နဲ့ လုပ်ထားတဲ့ ခလုတ်က
      မျက်စိနဲ့ ကြည့်ရင် တူပေမယ့် tree ထဲမှာ မရှိသလို၊ keyboard နဲ့လည်း မရောက်ပါဘူး။ တကယ့်
      button element ကို သုံးလိုက်တော့ role၊ name၊ focus နဲ့ keyboard ကို browser က အလိုလို
      ပေးပါတယ်။ ဒါကြောင့် ခလုတ်လိုချင်ရင် button element၊ ခေါင်းစဉ်လိုချင်ရင် heading
      element စသဖြင့်၊ အဓိပ္ပာယ် ကိုက်တဲ့ element ကို အရင်ဆုံး ရွေးပါ။ နောက် lesson မှာတော့
      ARIA ကို ဘယ်အချိန် သုံးမလဲ ဆိုတာနဲ့ ARIA ရဲ့ စည်းကမ်း ငါးချက်ကို ကြည့်သွားပါမယ်။
    sources:
      - title: "web.dev Learn Accessibility — ARIA and HTML"
        url: "https://web.dev/learn/accessibility/aria-html"
      - title: "web.dev Learn Accessibility — Content structure"
        url: "https://web.dev/learn/accessibility/structure"
    actions:
      - id: close-aria
        type: whiteboard.apply
        at: { mark: close-aria }
        open: false
      - id: select-final
        type: editor.select
        at: { mark: select-final }
        target: { file: index.html, text: '<button class="order-btn" type="button"', occurrence: 1 }
      - id: expect-button-in-file
        type: expect.file
        at: { afterAction: select-final }
        path: index.html
        contains: '<button class="order-btn" type="button" data-say="မှာပြီးပါပြီ" data-target="#order-status" data-testid="order-button">မှာမယ်</button>'

checks:
  - { type: timing.p95Ms, max: 300 }
