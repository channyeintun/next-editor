          padding: 0 12px;
          font-size: 14px;
        }

        .fav[aria-pressed="true"] {
          background: var(--leaf);
        }

        .tea-options {
          margin: 16px 0;
        }

        .chips {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
          margin: 12px 0 0;
          padding: 0;
          list-style: none;
        }

        .chips li {
