      }
    - {
        id: e-nan,
        kind: text,
        x: 330,
        y: 392,
        width: 760,
        height: 40,
        text: 'Number("နှစ်") → NaN',
        strokeColor: "#e03131",
        fontSize: 28,
      }
    - {
        id: e-logic,
        kind: text,
        x: 290,
        y: 450,
        width: 800,
        height: 40,
        text: "• business logic → test နဲ့ စစ်",
        strokeColor: "#2f9e44",
        fontSize: 28,
      }
    - {
        id: e-typetest,
        kind: text,
        x: 290,
        y: 505,
        width: 800,
