build:
  # Studio replaces this built-in profile at render time with the Burmese provider chosen in the
  # render console (AthanLab with the user's own key, or VoxCPM2 when that feature is enabled).
  voiceProfile: pocket-alba-v1
  seed: 5123
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: open
    chapter: "Static analysis ဆိုတာ"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ test လုပ်ရလွယ်တဲ့ code ရေးနည်းကို ကြည့်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့
      code ကို run စရာတောင် မလိုဘဲ bug ကို ရှာပေးတဲ့ စစ်ဆေးမှုတွေကို ကြည့်ပါမယ်။ [[mark:draw-trophy]]
      lesson ၁၃ က testing trophy ကို ပြန်ဆွဲကြည့်ရအောင်။ ထိပ်မှာ end to end test တွေ၊ အလယ်မှာ
      integration test နဲ့ unit test တွေ ရှိပါတယ်။ [[mark:draw-static]] အောက်ခြေ အကျဆုံးမှာတော့ static
      analysis ရှိပါတယ်။ static analysis ဆိုတာ code ကို run စရာ မလိုဘဲ ဖတ်ပြီး စစ်တာပါ။ ဆိုင်ရဲ့ code ကို
      run မကြည့်ရသေးခင်၊ test တောင် မရေးရသေးခင်မှာ tool က အလိုလို ဖတ်ပြီး သတိပေးတာပါ။ [[mark:draw-early]] editor ထဲမှာ code ရိုက်နေရင်း မှားတဲ့
      နေရာအောက်မှာ အနီရောင် မျဉ်းကွေးလေး ပေါ်လာတာကလည်း static analysis ရဲ့ ရလဒ်ပါ။ program ကို run
      မကြည့်ရသေးခင်ကတည်းက သတိပေးတဲ့အတွက် trophy ရဲ့ အောက်ခြေမှာ ထားကြတာပါ။
    sources:
      - {
          title: "web.dev Learn Testing: Static analysis",
          url: "https://web.dev/learn/testing/get-started/static-analysis",
        }
      - {
          title: "Kent C. Dodds: The Testing Trophy and Testing Classifications (facts C11)",
          url: "https://kentcdodds.com/blog/the-testing-trophy-and-testing-classifications",
        }
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-trophy
        type: whiteboard.apply
        at: { mark: draw-trophy }
        upsertIds: [a-e2e-box, a-e2e, a-int-box, a-int, a-unit-box, a-unit]
        drawMs: 3500
      - id: draw-static
        type: whiteboard.apply
        at: { mark: draw-static }
        upsertIds: [a-static-box, a-static, a-arrow, a-def-1, a-def-2]
        drawMs: 3500
      - id: draw-early
        type: whiteboard.apply
        at: { mark: draw-early }
        upsertIds: [a-early-1, a-early-2]
        drawMs: 3000

  - id: two-kinds
    narration: >
      [[mark:board-kinds]] static analysis tool တွေကို နှစ်မျိုး ခွဲလို့ ရပါတယ်။ [[mark:draw-linter]] ပထမက linter
      ပါ။ linter ဆိုတာ code ကို run စရာ မလိုဘဲ ဖတ်ပြီး ပြဿနာ ဖြစ်နိုင်တဲ့ ရေးပုံတွေကို သတိပေးတဲ့ tool ပါ။
      JavaScript အတွက် ESLint ဆိုတဲ့ linter ကို ဒီ lesson ရဲ့ panel ထဲမှာ တကယ် run ပြထားပါတယ်။ [[mark:draw-checker]]
      ဒုတိယက TypeScript လို type checker ပါ။ ဂဏန်း ဖြစ်ရမယ့် နေရာမှာ စာသား ရောက်နေတာမျိုးကို run
      မလုပ်ခင် ဖမ်းပေးပါတယ်။ [[mark:draw-run]] ညာဘက်က test တွေကတော့ code ကို တကယ် run ပြီး စစ်ပါတယ်။
      ဆိုင်ရဲ့ bug တွေကို နှစ်ဖက်စလုံးက ဘယ်လို ဖမ်းမိလဲ ယှဉ်ကြည့်ရအောင်။
    sources:
      - {
          title: "web.dev Learn Testing: Static analysis, ESLint and type checking",
          url: "https://web.dev/learn/testing/get-started/static-analysis",
        }
      - {
          title: "ESLint: Getting Started",
          url: "https://eslint.org/docs/latest/use/getting-started",
        }
    actions:
      - id: board-kinds
        type: whiteboard.apply
        at: { mark: board-kinds }
        clear: true
        upsertIds: [b-title]
      - id: draw-linter
        type: whiteboard.apply
        at: { mark: draw-linter }
        upsertIds: [b-read-box, b-read-head, b-lint-1, b-lint-2]
        drawMs: 3000
      - id: draw-checker
        type: whiteboard.apply
        at: { mark: draw-checker }
        upsertIds: [b-type-1, b-type-2]
        drawMs: 1500
      - id: draw-run
        type: whiteboard.apply
        at: { mark: draw-run }
        upsertIds: [b-run-box, b-run-head, b-test-1, b-test-2, b-test-3, b-bug]
        drawMs: 4000

  - id: config
    narration: >
      ESLint ကို ဘယ်လို ထည့်ထားလဲ ကြည့်ရအောင်။ ဒါက ESLint ရဲ့ config ဖိုင်ပါ။ [[mark:select-recommended]]
      rule တစ်ခုစီက ESLint ရှာမယ့် ပြဿနာ တစ်မျိုးစီ ဖြစ်ပြီး၊ ဒီ line က ESLint အကြံပြုထားတဲ့ recommended
      rule စုကို ဖွင့်ထားတာပါ။ [[mark:select-globals]] အောက်က line ကတော့ console လို ကြိုရှိပြီးသား
      နာမည်တွေကို ESLint ကို ပြောပြထားတာပါ။ [[mark:where-eslint]] ကိုယ့် ကွန်ပျူတာမှာ ဆိုရင် terminal ကနေ
      ESLint ကို run ရပြီး၊ editor မှာ ESLint extension ထည့်ထားရင် ရိုက်နေတုန်း သတိပေးပါတယ်။
    sources:
      - {
          title: "ESLint: Configuration files",
          url: "https://eslint.org/docs/latest/use/configure/configuration-files",
        }
      - {
          title: "web.dev Learn Testing: Static analysis, ESLint",
          url: "https://web.dev/learn/testing/get-started/static-analysis#eslint",
        }
    actions:
      - id: close-kinds
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: select-recommended
        type: editor.select
        at: { mark: select-recommended }
        target: { file: eslint.config.js, text: "js.configs.recommended,", occurrence: 1 }
      - id: select-globals
        type: editor.select
        at: { mark: select-globals }
        target:
          {
            file: eslint.config.js,
            text: 'globals: { console: "readonly", document: "readonly", window: "readonly" }',
            occurrence: 1,
          }

  - id: kitchen
    narration: >
      [[mark:open-kitchen]] ဒါက အော်ဒါကို မီးဖိုချောင်က printer ဆီ ပို့ပေးတဲ့ code ပါ။ [[mark:select-try]] try
      အပိုင်းမှာ printer ကို အော်ဒါ စာရွက် ထုတ်ခိုင်းပြီး true ကို ပြန်ပေးပါတယ်။ printer မှာ ပြဿနာ
      ရှိရင်တော့ error က ခေါ်တဲ့ code ဆီ ဆက်ရောက်ရမှာပါ။ [[mark:select-finally]] ဒါပေမဲ့ finally ထဲမှာ
      false ကို return လုပ်ထားပါတယ်။ finally က အမြဲ run ပြီး၊ သူ့ထဲက return က try ရဲ့ ရလဒ်ကိုရော error
      ကိုရော အစားထိုးလိုက်လို့ အမြဲ false ပဲ ရပါတယ်။ ဒီ code မှာ bug ပါနေတာပါ။ [[mark:open-kitchen-test]]
      test ကို ကြည့်ရအောင်။ [[mark:select-printer]] ဒီ printer stub က ခေါ်တိုင်း printer ချိတ်မထားဘူး ဆိုတဲ့
      error ကို throw လုပ်ပါတယ်။ [[mark:select-rejects]] test က အော်ဒါ ပို့တာ အဲဒီ error နဲ့ reject
      ဖြစ်ရမယ်လို့ စစ်ထားပါတယ်။ ဒါမှ ဝန်ထမ်းက အော်ဒါ စာရွက် မထွက်တာကို သိမှာပါ။
    sources:
      - {
          title: "MDN: try...catch, returning from a finally block",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/try...catch#returning_from_a_finally_block",
        }
      - { title: "Vitest: expect, rejects", url: "https://vitest.dev/api/expect#rejects" }
    actions:
      - id: open-kitchen
        type: workspace.openFile
        at: { mark: open-kitchen }
        path: src/kitchen.js
      - id: select-try
        type: editor.select
        at: { mark: select-try }
        target:
          {
            file: src/kitchen.js,
            text: "    await printer.print(order);\n    return true;",
            occurrence: 1,
          }
      - id: select-finally
        type: editor.select
        at: { mark: select-finally }
        target:
          { file: src/kitchen.js, text: "  } finally {\n    return false;\n  }", occurrence: 1 }
      - id: open-kitchen-test
        type: workspace.openFile
        at: { mark: open-kitchen-test }
        path: src/kitchen.test.js
      - id: select-printer
        type: editor.select
        at: { mark: select-printer }
        target:
          {
            file: src/kitchen.test.js,
            text: 'throw new Error("the printer is not connected");',
            occurrence: 1,
          }
      - id: select-rejects
        type: editor.select
        at: { mark: select-rejects }
        target:
          {
            file: src/kitchen.test.js,
            text: 'await expect(sending).rejects.toThrow("not connected");',
            occurrence: 1,
          }

  - id: order-form
    narration: >
      [[mark:open-form]] နောက်ဖိုင်က အော်ဒါ form ကနေ ခွက်အရေအတွက်ကို ဖတ်ပေးတဲ့ code ပါ။ [[mark:select-read]]
      ပထမ function က input ရဲ့ တန်ဖိုးကို ဒီအတိုင်း ပြန်ပေးပါတယ်။ [[mark:select-add]] ဒုတိယ function က
      တစ်ခွက် တိုးပေးပါတယ်။ [[mark:open-form-test]] test က နှစ်ခွက်ကနေ တစ်ခွက် တိုးရင် သုံးခွက်
      ဖြစ်ရမယ်လို့ စစ်ပါတယ်။ [[mark:select-input]] Node ထဲမှာ input element မရှိလို့ value ပါတဲ့ object
      တစ်ခုကို အစားထိုး ထည့်ထားပြီး၊ တန်ဖိုးကို စာသား အနေနဲ့ ပေးထားပါတယ်။ browser ရဲ့ input ကလည်း
      ဂဏန်း ရိုက်ထားရင်တောင် value ကို စာသား အနေနဲ့ပဲ ပေးလို့ပါ။
    sources:
      - {
          title: "MDN: HTMLInputElement value (always a string)",
          url: "https://developer.mozilla.org/en-US/docs/Web/API/HTMLInputElement/value",
        }
      - {
          title: "web.dev Learn Testing: The testing environment, the runtime has no DOM",
          url: "https://web.dev/learn/testing/get-started/testing-environment#runtime",
        }
    actions:
      - id: open-form
        type: workspace.openFile
        at: { mark: open-form }
        path: src/order-form.js
      - id: select-read
        type: editor.select
        at: { mark: select-read }
        target: { file: src/order-form.js, text: "return input.value;", occurrence: 1 }
      - id: select-add
        type: editor.select
        at: { mark: select-add }
        target: { file: src/order-form.js, text: "return qty + 1;", occurrence: 1 }
      - id: open-form-test
        type: workspace.openFile
        at: { mark: open-form-test }
        path: src/order-form.test.js
      - id: select-input
        type: editor.select
        at: { mark: select-input }
        target:
          { file: src/order-form.test.js, text: 'const input = { value: "2" };', occurrence: 1 }

  - id: panel
    narration: >
      [[mark:ready]] Vitest နဲ့ ESLint က ဒီ ဖိုင်တွေကို စစ်လိုက်တော့ ဘာ ပြလဲ ကြည့်ရအောင်။ panel က ပြီးခဲ့တဲ့
      lesson တွေလိုပဲ တကယ့် Vitest ရဲ့ ရလဒ် ဖြစ်ပြီး၊ အပေါ်ဆုံးမှာ အနီရောင် FAIL ပေါ်နေပါတယ်။
      [[mark:read-lint]] သူ့အောက်မှာတော့ ဒီတစ်ခါ တကယ့် ESLint ရဲ့ ရလဒ်ကို ပြတဲ့ ESLint အပိုင်း ပါလာပါတယ်။
      မီးဖိုချောင် ဖိုင်ရဲ့ line ၆ မှာ error တစ်ခု တွေ့ပြီး၊ အဆုံးမှာ no unsafe finally ဆိုတဲ့ rule နာမည်ကို
      ပြထားပါတယ်။ [[mark:read-tree]] test စာရင်းမှာလည်း test နှစ်ခုလုံး ကြက်ခြေခတ်နဲ့ ကျနေပါတယ်။
    sources:
      - {
          title: "Vitest: Writing Tests, reading test output",
          url: "https://vitest.dev/guide/learn/writing-tests#reading-test-output",
        }
      - {
          title: "ESLint rule: no-unsafe-finally",
          url: "https://eslint.org/docs/latest/rules/no-unsafe-finally",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-start-lint
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: vt-lint-1 }
        attribute: { name: data-rule, value: no-unsafe-finally }
        retry: { maxAttempts: 3, delayMs: 1000 }
      - id: expect-start-lint-line
        type: expect.preview
        at: { afterAction: expect-start-lint }
        timeoutMs: 5000
        target: { by: testId, value: vt-lint-1 }
        attribute: { name: data-line, value: "6" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-fail
        type: expect.preview
        at: { afterAction: expect-start-lint-line }
        timeoutMs: 5000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-two-failed
        type: expect.preview
        at: { afterAction: expect-start-fail }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-failed, value: "2" }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: eslint
    chapter: "ESLint က ဘာကို တွေ့လဲ"
    narration: >
      ESLint ရဲ့ error ကနေ စကြည့်ရအောင်။ [[mark:open-kitchen-2]] မီးဖိုချောင် ဖိုင်ကို ပြန်ဖွင့်ပါမယ်။
      [[mark:select-return-false]] line ၆ က finally ထဲက ဒီ return ပါ။ finally ထဲမှာ return သုံးတာ
      စိတ်မချရဘူးလို့ ပြောနေပြီး၊ ESLint က code ကို run မကြည့်ဘဲ ရေးပုံ တစ်ခုတည်းကနေ ဒီ bug ကို တွေ့တာပါ။
      [[mark:read-kitchen-fail]] အလယ်က Failed Tests အပိုင်းကို ကြည့်ပါ။ ပထမ အပိုင်းက မီးဖိုချောင် test ပါ။ reject
      ဖြစ်ရမယ့် promise က false နဲ့ resolve ဖြစ်သွားတယ်လို့ ပြောနေပြီး၊ အစိမ်းရောင် Expected မှာ error
      တစ်ခု၊ အနီရောင် Received မှာ false ကို ပြထားပါတယ်။ [[mark:two-checks]] ဆိုတော့ bug တစ်ခုတည်းကို
      စစ်ဆေးမှု နှစ်မျိုးက ဖမ်းမိတာပါ။ ESLint က ဖတ်ရုံနဲ့ စောစော တွေ့ပေမဲ့ ရေးပုံကိုပဲ သိပါတယ်။ test
      ကတော့ run မှ တွေ့ပေမဲ့၊ function က ဘာ လုပ်ရမလဲ သိလို့ ဘာ မှားနေလဲ ရှင်းရှင်း ပြနိုင်ပါတယ်။
    sources:
      - {
          title: "ESLint rule: no-unsafe-finally",
          url: "https://eslint.org/docs/latest/rules/no-unsafe-finally",
        }
      - {
          title: "web.dev Learn Testing: Static analysis, ESLint",
          url: "https://web.dev/learn/testing/get-started/static-analysis#eslint",
        }
      - { title: "Vitest: expect, rejects", url: "https://vitest.dev/api/expect#rejects" }
    actions:
      - id: open-kitchen-2
        type: workspace.openFile
        at: { mark: open-kitchen-2 }
        path: src/kitchen.js
      - id: select-return-false
        type: editor.select
        at: { mark: select-return-false }
        target: { file: src/kitchen.js, text: "return false;", occurrence: 1 }
      - id: expect-lint-message
        type: expect.preview
        at: { afterAction: select-return-false }
        timeoutMs: 5000
        target: { by: testId, value: vt-lint-1 }
        attribute: { name: data-message, value: "Unsafe usage of ReturnStatement." }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-kitchen-message
        type: expect.preview
        at: { mark: read-kitchen-fail }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-message, value: 'promise resolved "false" instead of rejecting' }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-kitchen-received
        type: expect.preview
        at: { afterAction: expect-kitchen-message }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-actual, value: "false" }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: silence
    chapter: "Rule ကို ပိတ်ရင် bug ပျောက်လား"
    narration: >
      ESLint ရဲ့ error ကို ပျောက်အောင် လုပ်တဲ့ နည်း တစ်ခု ရှိပါတယ်။ [[mark:type-disable]] finally ထဲက
      return ရဲ့ အပေါ်မှာ၊ rule ကို line တစ်ကြောင်းအတွက်ပဲ ပိတ်တဲ့ comment ကို ထည့်ကြည့်ပါမယ်။ comment
      ထဲမှာ rule နာမည် ပါပြီး၊ ESLint က သူ့အောက်က line မှာ အဲဒီ rule ကို မစစ်တော့ပါဘူး။ [[mark:read-silenced]]
      panel ကို ကြည့်ပါ။ ESLint အပိုင်းမှာ ပြဿနာ မရှိဘူးလို့ ပြနေပေမဲ့ မီးဖိုချောင် test ကတော့ ကျနေတုန်းပါ။
      comment က ESLint ကို တိတ်စေရုံပဲ ဖြစ်ပြီး bug ကို မပြင်ပေးပါဘူး။ [[mark:red-flag]] ဒါကြောင့် teammate
      ဖြစ်ဖြစ်၊ AI assistant ဖြစ်ဖြစ် ရေးထားတဲ့ code ထဲမှာ rule ပိတ်တဲ့ comment အသစ် တွေ့ရင်၊ ဘာကြောင့်လဲ
      ဆိုတာ သေချာ မေးကြည့်ပါ။
    sources:
      - {
          title: "ESLint: Disable rules with configuration comments",
          url: "https://eslint.org/docs/latest/use/configure/rules#disable-rules",
        }
      - {
          title: "web.dev Learn Testing: Static analysis, ESLint (the disable comment)",
          url: "https://web.dev/learn/testing/get-started/static-analysis#eslint",
        }
    actions:
      - id: type-disable
        type: editor.type
        at: { mark: type-disable }
        target: { file: src/kitchen.js, after: "  } finally {\n", occurrence: 1 }
        text: "    // eslint-disable-next-line no-unsafe-finally\n"
      - id: expect-silenced
        type: expect.preview
        at: { afterAction: type-disable }
        timeoutMs: 8000
        target: { by: testId, value: vt-lint }
        attribute: { name: data-errors, value: "0" }
        retry: { maxAttempts: 3, delayMs: 1500 }
      - id: expect-silenced-clean
        type: expect.preview
        at: { afterAction: expect-silenced }
        timeoutMs: 5000
        target: { by: testId, value: vt-lint }
        textContains: "✓ no problems"
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-still-red
        type: expect.preview
        at: { afterAction: expect-silenced-clean }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-1 }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: fix
    narration: >
      [[mark:type-fix]] အခု တကယ် ပြင်ကြည့်ရအောင်။ finally ထဲက return ကို comment လုပ်ပြီး
      ပိတ်လိုက်ပါမယ်။ [[mark:read-fixed]] မီးဖိုချောင် test က အမှန်ခြစ် ဖြစ်သွားပြီး၊ printer ရဲ့ error
      ကလည်း ခေါ်တဲ့ code ဆီ ရောက်သွားပါပြီ။ [[mark:read-unused]] ESLint မှာတော့ warning အသစ် တစ်ခု
      ပေါ်လာပါတယ်။ ပိတ်ထားတဲ့ line မှာ ပြဿနာ မရှိတော့လို့ ဒီ comment ကို မလိုတော့ဘူးလို့ ပြောနေတာပါ။
      [[mark:type-undisable]] ESLint က rule ပိတ်တဲ့ comment လို့ မသိတော့အောင် ဒီ comment ကိုလည်း comment
      လုပ်လိုက်ပါမယ်။ ကိုယ့် project မှာ ဆိုရင်တော့ try နဲ့ finally ကိုပါ ဖြုတ်ပြီး၊ printer ကို ခေါ်တဲ့ line နဲ့
      true ပြန်ပေးတဲ့ line ပဲ ချန်ထားရုံပါပဲ။ [[mark:read-clean]]
      ESLint အပိုင်း ရှင်းသွားပါပြီ။ ဒီတစ်ခါတော့ bug ကို တကယ် ပြင်လို့ ရှင်းသွားတာပါ။
    sources:
      - {
          title: "ESLint: Report unused disable directives",
          url: "https://eslint.org/docs/latest/use/configure/rules#report-unused-eslint-disable-comments",
        }
      - {
          title: "ESLint rule: no-unsafe-finally",
          url: "https://eslint.org/docs/latest/rules/no-unsafe-finally",
        }
    actions:
      - id: type-fix
        type: editor.type
        at: { mark: type-fix }
        target: { file: src/kitchen.js, after: "no-unsafe-finally\n    ", occurrence: 1 }
        text: "// "
      - id: expect-kitchen-pass
        type: expect.preview
        at: { afterAction: type-fix }
        timeoutMs: 8000
        target: { by: testId, value: vt-test-1 }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1500 }
      - id: expect-one-passed
        type: expect.preview
        at: { afterAction: expect-kitchen-pass }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "1" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-unused-warning
        type: expect.preview
        at: { afterAction: expect-one-passed }
        timeoutMs: 5000
        target: { by: testId, value: vt-lint-1 }
        attribute: { name: data-severity, value: warning }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-unused-message
        type: expect.preview
        at: { afterAction: expect-unused-warning }
        timeoutMs: 5000
        target: { by: testId, value: vt-lint-1 }
        attribute:
          {
            name: data-message,
            value: "Unused eslint-disable directive (no problems were reported from 'no-unsafe-finally').",
          }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: type-undisable
        type: editor.type
        at: { mark: type-undisable }
        target: { file: src/kitchen.js, after: "  } finally {\n    ", occurrence: 1 }
        text: "// "
      - id: expect-lint-clean
        type: expect.preview
        at: { afterAction: type-undisable }
        timeoutMs: 8000
        target: { by: testId, value: vt-lint }
        attribute: { name: data-warnings, value: "0" }
        retry: { maxAttempts: 3, delayMs: 1500 }
      - id: expect-lint-empty
        type: expect.preview
        at: { afterAction: expect-lint-clean }
        timeoutMs: 5000
        target: { by: testId, value: vt-lint }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: lint-tips
    narration: >
      [[mark:board-tips]] ESLint ကို သုံးတဲ့အခါ မှတ်ထားစရာ တချို့ ရှိပါတယ်။ [[mark:tip-reason]] rule ကို တကယ်
      ပိတ်ရမယ် ဆိုရင် comment ရဲ့ နောက်မှာ ဘာကြောင့် ပိတ်လဲ ရေးထားပါ။ [[mark:tip-off]] team က အမြဲ
      ချိုးနေရတဲ့ rule ဆိုရင်တော့ config ထဲမှာ ပိတ်လိုက်တာ ပိုကောင်းပါတယ်။ [[mark:tip-early]] project
      အစကတည်းက ESLint ကို ဖွင့်ထားပါ။ နောက်မှ ဖွင့်ရင် ကောင်းနေတဲ့ code တွေအတွက်ပါ သတိပေးချက်တွေ
      အများကြီး ထွက်လာပါတယ်။ [[mark:tip-review]] ESLint က သူ့ rule ထဲက ပုံစံတွေကိုပဲ သိလို့ code review
      ကို အစားထိုးလို့ မရပါဘူး။ [[mark:tip-compat]] plugin တွေလည်း ထပ်ထည့်လို့ ရပြီး၊ ဥပမာ eslint plugin
      compat က user တွေရဲ့ browser မှာ မရှိသေးတဲ့ API ကို သုံးမိရင် သတိပေးပါတယ်။
    sources:
      - {
          title: "web.dev Learn Testing: Static analysis, ESLint",
          url: "https://web.dev/learn/testing/get-started/static-analysis#eslint",
        }
      - {
          title: "web.dev Learn Testing: Static analysis, ESLint plugins for browser support",
          url: "https://web.dev/learn/testing/get-started/static-analysis#eslint-browser-plugins",
        }
      - {
          title: "ESLint: Disabling rules, descriptions in comments",
          url: "https://eslint.org/docs/latest/use/configure/rules#comment-descriptions",
        }
      - { title: "eslint-plugin-compat", url: "https://github.com/amilajack/eslint-plugin-compat" }
    actions:
      - id: board-tips
        type: whiteboard.apply
        at: { mark: board-tips }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: tip-reason
        type: whiteboard.apply
        at: { mark: tip-reason }
        upsertIds: [c-reason, c-reason-code]
        drawMs: 2500
      - id: tip-off
        type: whiteboard.apply
        at: { mark: tip-off }
        upsertIds: [c-off]
        drawMs: 1500
      - id: tip-early
        type: whiteboard.apply
        at: { mark: tip-early }
        upsertIds: [c-early]
        drawMs: 1200
      - id: tip-review
        type: whiteboard.apply
        at: { mark: tip-review }
        upsertIds: [c-review]
        drawMs: 1200
      - id: tip-compat
        type: whiteboard.apply
        at: { mark: tip-compat }
        upsertIds: [c-compat]
        drawMs: 1500

  - id: typescript
    chapter: "TypeScript ဆိုရင် ဘယ်လိုလဲ"
    narration: >
      ကျန်နေတဲ့ test ကို ကြည့်ရအောင်။ [[mark:read-form-fail]] ခွက် တိုးတဲ့ test မှာ ၃ ဖြစ်ရမယ့် နေရာမှာ ၂
      နောက်မှာ ၁ ကပ်နေတဲ့ စာသား ရနေတယ်လို့ ပြောနေပါတယ်။ input ကနေ ရတဲ့ ၂ က စာသား ဖြစ်နေလို့ JavaScript
      က ၁ ကို နောက်ကနေ ဆက်ပေးလိုက်တာပါ။ test က ဖမ်းမိပေမဲ့ run လိုက်မှပဲ သိရပါတယ်။ [[mark:board-ts]]
      TypeScript project ဆိုရင် ဘယ်လို ဖြစ်မလဲ ကြည့်ရအောင်။ [[mark:draw-ts-code]] ဒါက ဒီ function ကိုပဲ
      TypeScript နဲ့ ရေးထားတာပါ။ parameter က input element ဖြစ်ပြီး number ပြန်ပေးမယ်လို့ type
      ကြေညာထားပါတယ်။ [[mark:draw-ts-error]] input element ရဲ့ value က အမြဲ string ဖြစ်တယ် ဆိုတာ type
      checker က သိလို့၊ number ပြန်ပေးမယ့် function က string ကို return လုပ်နေတယ်လို့ error ပြပါတယ်။
      [[mark:draw-ts-when]] ဒီ error က run စရာ မလိုသလို test ရေးစရာလည်း မလိုဘဲ၊ editor ထဲမှာ
      ရိုက်နေတုန်းကတည်းက ပေါ်လာမှာပါ။ test ကတော့ run လိုက်မှပဲ ပြနိုင်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn Testing: Static analysis, type checking and TypeScript",
          url: "https://web.dev/learn/testing/get-started/static-analysis#type-checking",
        }
      - {
          title: "TypeScript: Everyday Types (TS2322 checked with tsc 6.0.3)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html",
        }
      - {
          title: "MDN: HTMLInputElement value (always a string)",
          url: "https://developer.mozilla.org/en-US/docs/Web/API/HTMLInputElement/value",
        }
    actions:
      - id: close-tips
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: expect-form-message
        type: expect.preview
        at: { mark: read-form-fail }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-message, value: "expected '21' to be 3 // Object.is equality" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-form-received
        type: expect.preview
        at: { afterAction: expect-form-message }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-actual, value: '"21"' }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: board-ts
        type: whiteboard.apply
        at: { mark: board-ts }
        open: true
        clear: true
        upsertIds: [d-title]
      - id: draw-ts-code
        type: whiteboard.apply
        at: { mark: draw-ts-code }
        upsertIds: [d-box, d-code-1, d-code-2, d-code-3, d-code-4, d-code-5]
        drawMs: 3500
      - id: draw-ts-error
        type: whiteboard.apply
        at: { mark: draw-ts-error }
        upsertIds: [d-squiggle, d-err-1, d-err-2]
        drawMs: 3000
      - id: draw-ts-when
        type: whiteboard.apply
        at: { mark: draw-ts-when }
        upsertIds: [d-when-ts, d-test-1, d-test-2, d-when-test]
        drawMs: 3500

  - id: fix-quantity
    narration: >
      ဒါဆို အဲဒီ line မှာပဲ ပြင်ကြည့်ရအောင်။ [[mark:open-form-fix]] ခွက်အရေအတွက် ဖတ်တဲ့ ဖိုင်ကို
      ဖွင့်ပါမယ်။ [[mark:type-number]] input ရဲ့ စာသားကို Number နဲ့ ဂဏန်း ပြောင်းပြီး ပြန်ပေးတဲ့ line အသစ်ကို
      ထည့်ပြီး၊ line အဟောင်းကိုတော့ comment လုပ်ထားပါမယ်။ [[mark:read-all-green]] test နှစ်ခုလုံး အမှန်ခြစ်
      ဖြစ်သွားပြီး၊ အပေါ်ဆုံးမှာ အစိမ်းရောင် PASS ပေါ်လာပါပြီ။ ESLint အပိုင်းမှာလည်း ပြဿနာ မရှိပါဘူး။
    sources:
      - {
          title: "MDN: Number() constructor, converting text to a number",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Number/Number",
        }
    actions:
      - id: close-ts
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-form-fix
        type: workspace.openFile
        at: { mark: open-form-fix }
        path: src/order-form.js
      - id: type-number
        type: editor.type
        at: { mark: type-number }
        target:
          {
            file: src/order-form.js,
            after: "export function readQuantity(input) {\n  ",
            occurrence: 1,
          }
        text: "return Number(input.value);\n  // "
        # One block: the one-insert line replacement (the old line becomes a comment in the same
        # write). An early return would leave the old line unreachable, and ESLint's no-unreachable
        # (in the recommended set) would report it.
        cadence: block
      - id: expect-all-pass
        type: expect.preview
        at: { afterAction: type-number }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1500 }
      - id: expect-two-passed
        type: expect.preview
        at: { afterAction: expect-all-pass }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "2" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-lint-still-clean
        type: expect.preview
        at: { afterAction: expect-two-passed }
        timeoutMs: 5000
        target: { by: testId, value: vt-lint }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-form-file
        type: expect.file
        at: { afterAction: expect-lint-still-clean }
        path: src/order-form.js
        contains: "  return Number(input.value);\n  // return input.value;"
      - id: expect-kitchen-file
        type: expect.file
        at: { afterAction: expect-form-file }
        path: src/kitchen.js
        contains: "  } finally {\n    // // eslint-disable-next-line no-unsafe-finally\n    // return false;\n  }"

  - id: limits
    narration: >
      [[mark:board-limits]] TypeScript မှာ သတိထားစရာ တချို့ ရှိပါတယ်။ [[mark:tip-included]] ဖိုင် တစ်ဖိုင်မှာ error
      တစ်ခုမှ မပြရင် config ထဲမှာ ပါလား အရင် စစ်ပါ။ မပါရင် TypeScript က အဲဒီ ဖိုင်ကို လုံးဝ မစစ်ပါဘူး။
      [[mark:tip-any]] parameter မှာ
      type မရေးရင် TypeScript က ဘာမဆို ဖြစ်နိုင်တဲ့ any လို့ ယူဆပြီး မစစ်တော့ပါဘူး။ no implicit any ဆိုတဲ့
      option က အဲဒီ နေရာတွေကို error ပြပေးပြီး၊ TypeScript ၆ ကစပြီး default ဖွင့်ထားပါတယ်။
      [[mark:tip-runtime]] အရေးအကြီးဆုံးကတော့ type တွေက program run နေတဲ့ အချိန်မှာ customer ရိုက်တဲ့ data
      နဲ့ network က data ကို မစစ်ပေးတာပါ။ ခွက်အရေအတွက် နေရာမှာ စာလုံးနဲ့ နှစ် လို့ ရိုက်ရင် Number က
      NaN ပြန်ပေးပေမဲ့ type ကတော့ number ပါပဲ။ [[mark:tip-logic]] ဒီလို အခြေအနေတွေကိုရော၊ business logic
      မှန်မမှန်ကိုရော linting နဲ့ typing က သက်သေ မပြနိုင်လို့ test နဲ့ စစ်ရပါတယ်။ [[mark:tip-type-tests]] Vitest မှာ type တွေကိုယ်တိုင်ကို စစ်တဲ့ type test
      လည်း ရှိပြီး၊ expect Type Of နဲ့ ရေးတဲ့ အဲဒီ ဖိုင်တွေကို run မလုပ်ဘဲ type checker နဲ့ပဲ စစ်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn Testing: Static analysis, general TypeScript tips",
          url: "https://web.dev/learn/testing/get-started/static-analysis#typescript-tips",
        }
      - {
          title: "web.dev Learn Testing: Static analysis, TypeScript implicit any",
          url: "https://web.dev/learn/testing/get-started/static-analysis#implicit-any",
        }
      - {
          title: "TypeScript: noImplicitAny (default on since TypeScript 6 strict; checked with tsc 6.0.3)",
          url: "https://www.typescriptlang.org/tsconfig/#noImplicitAny",
        }
      - {
          title: "Kent C. Dodds: Write tests. Not too many. Mostly integration. (facts C12)",
          url: "https://kentcdodds.com/blog/write-tests",
        }
      - {
          title: "Vitest: Testing Types (facts A25)",
          url: "https://vitest.dev/guide/testing-types",
        }
    actions:
      - id: board-limits
        type: whiteboard.apply
        at: { mark: board-limits }
        open: true
        clear: true
        upsertIds: [e-title]
      - id: tip-included
        type: whiteboard.apply
        at: { mark: tip-included }
        upsertIds: [e-included]
        drawMs: 1500
      - id: tip-any
        type: whiteboard.apply
        at: { mark: tip-any }
        upsertIds: [e-any]
        drawMs: 1500
      - id: tip-runtime
        type: whiteboard.apply
        at: { mark: tip-runtime }
        upsertIds: [e-runtime, e-nan]
        drawMs: 2500
      - id: tip-logic
        type: whiteboard.apply
        at: { mark: tip-logic }
        upsertIds: [e-logic]
        drawMs: 1500
      - id: tip-type-tests
        type: whiteboard.apply
        at: { mark: tip-type-tests }
        upsertIds: [e-typetest]
        drawMs: 1800

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:close-limits]] ဒါဆို ပြန်ချုပ်ရရင်၊ static analysis က code ကို run စရာ မလိုဘဲ ဖတ်ပြီး စစ်ပါတယ်။
      ESLint က ပြဿနာ ဖြစ်နိုင်တဲ့ ရေးပုံတွေကို၊ TypeScript က type မကိုက်တာတွေကို ရိုက်နေတုန်းကတည်းက
      ပြပေးပါတယ်။ [[mark:recap-silence]] rule ပိတ်တဲ့ comment က bug ကို မပြင်ပေးပါဘူး။ test ကတော့ code ကို
      တကယ် run ပြီး အလုပ်လုပ်ပုံကို စစ်လို့၊ ဒီ သုံးမျိုးကို အတူတူ သုံးရပါတယ်။ နောက် lesson မှာတော့ test
      တွေ run တဲ့အခါ code ရဲ့ ဘယ်အပိုင်းတွေ တကယ် run သွားလဲ ဆိုတာကို တိုင်းပေးတဲ့ code coverage ကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "web.dev Learn Testing: Static analysis",
          url: "https://web.dev/learn/testing/get-started/static-analysis",
        }
      - {
          title: "web.dev Learn Testing: Test types, code coverage",
          url: "https://web.dev/learn/testing/get-started/test-types#code-coverage",
        }
    actions:
      - id: close-limits
        type: whiteboard.apply
        at: { mark: close-limits }
        open: false
checks:
  - { type: timing.p95Ms, max: 300 }
