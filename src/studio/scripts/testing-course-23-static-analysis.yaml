      src/kitchen.js: |
        export async function sendOrder(order, printer) {
          try {
            await printer.print(order);
            return true;
          } finally {
            return false;
          }
        }
      src/kitchen.test.js: |
        import { expect, test } from "vitest";
        import { sendOrder } from "./kitchen.js";

        const brokenPrinter = {
          print: async () => {
            throw new Error("the printer is not connected");
          },
        };

        test("reports a printer that is not connected", async () => {
          const sending = sendOrder({ table: 5 }, brokenPrinter);
          await expect(sending).rejects.toThrow("not connected");
        });
      src/order-form.js: |
        export function readQuantity(input) {
          return input.value;
        }

        export function addOneCup(qty) {
          return qty + 1;
        }
      src/order-form.test.js: |
        import { expect, test } from "vitest";
        import { addOneCup, readQuantity } from "./order-form.js";

        test("adds one more cup", () => {
          const input = { value: "2" };
          const qty = readQuantity(input);
          expect(addOneCup(qty)).toBe(3);
        });
      vite.config.js: |
