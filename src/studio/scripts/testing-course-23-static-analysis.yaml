        text: "type checker → ရိုက်နေတုန်း သိ",
        strokeColor: "#2f9e44",
        fontSize: 28,
      }
    - {
        id: d-when-test,
        kind: text,
        x: 290,
        y: 605,
        width: 800,
        height: 40,
        text: "test → run လိုက်မှ သိ",
        strokeColor: "#6741d9",
        fontSize: 28,
      }
    # Board E: TypeScript cautions, and type tests in one line.
    - {
        id: e-title,
        kind: text,
        x: 290,
        y: 165,
        width: 700,
        height: 50,
        text: "TypeScript သတိထားစရာ",
        strokeColor: "#1e1e1e",
        fontSize: 36,
      }
    - {
        id: e-included,
        kind: text,
        x: 290,
        y: 235,
        width: 800,
        height: 40,
        text: "• ဖိုင်တွေ တကယ် စစ်ခံရလား",
        strokeColor: "#1e1e1e",
        fontSize: 28,
      }
    - {
        id: e-any,
        kind: text,
        x: 290,
