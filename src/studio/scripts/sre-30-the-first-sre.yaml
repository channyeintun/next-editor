          type: whiteboard.apply,
          at: { mark: b2-s1 },
          open: true,
          clear: true,
          upsertIds: [l30-b2-axis],
        }
      - id: b2-s1-draw
        type: whiteboard.apply
        at: { afterAction: b2-s1 }
        upsertIds: [l30-b2-t3, l30-b2-d3-l1, l30-b2-d3-l2, l30-b2-d3-l3]
