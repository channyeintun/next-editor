  - id: day-one
    chapter: ပထမနေ့ရဲ့ မေးခွန်းတွေ
    narration: >
      [[mark:show-p02]] ကိုမင်း ပထမဆုံး စိတ်ကူးမိတာက Padauk ရဲ့ SLO တွေနဲ့ dashboard တွေကို ကူးလာဖို့ပါ၊ SLO ဆိုတာ service ဘယ်လောက် စိတ်ချရရင် လုံလောက်ပြီလို့ သဘောတူထားတဲ့ ပစ်မှတ်ပါ။ မသီရိကတော့ အဖွဲ့ကြီးအတွက် လုပ်ထားတာတွေကို ဒီအတိုင်း မကူးဘဲ Parcel နဲ့ ကိုက်အောင် ပြင်သုံးဖို့ ပြောပါတယ်။
      [[mark:p02-questions]] ဒါကြောင့် ကိုမင်းက tool မထည့်ခင် မေးခွန်း သုံးခု အရင် မေးပါတယ်။ customer ကို ဘာက အများဆုံး ဒုက္ခပေးလဲ၊ deploy ကို ဘယ်သူ လုပ်တတ်ပြီး ဘယ်နေ့အထိ ရှိမလဲ၊ တစ်နာရီ ရပ်ရင် ဘာ ဆုံးရှုံးလဲ ဆိုတာပါ။
      [[mark:show-p02b]] အဖြေတွေက ရှင်းပါတယ်။ rider တွေဆီ job ခွဲပေးတဲ့ dispatch worker က အပတ်တိုင်း hang ဖြစ်ပြီး rider တွေ အလုပ်မရဘဲ စောင့်ရပါတယ်။ deploy ကို ထွက်ခါနီး engineer ပဲ လုပ်တတ်ပါတယ်။ နေ့လယ်မှာ တစ်နာရီ ရပ်ရင် ပါဆယ် ရာနဲ့ချီ နောက်ကျပါတယ်။
      [[mark:show-p02c]] lesson ၁၅ မှာ မြင်ခဲ့သလို SRE တစ်ယောက်တည်းနဲ့ အဖွဲ့ မဖြစ်ပါဘူး။ ဒါကြောင့် ကိုမင်းရဲ့ တကယ့် အလုပ်က အကုန် ကိုယ်တိုင် ပြင်တာ မဟုတ်ဘဲ reliability အလုပ်ကို engineer ၈ ယောက်ကြား ဖြန့်ပေးတာပါ။
      ပထမ အပတ်တွေမှာ worker ကို restart လုပ်တာလို လက်နဲ့ ထပ်ခါထပ်ခါ လုပ်ရတဲ့ toil များနေတာ ပုံမှန်ပါ။ ဒါပေမဲ့ ops အလုပ်ကို အချိန်ရဲ့ တစ်ဝက်အောက်မှာ ထားရမယ် ဆိုတဲ့ ကန့်သတ်ချက်ကိုတော့ system ငြိမ်လာတာနဲ့ ပြန်လိုက်နာရပါမယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "From Nothing to SRE: Implementing SRE in Smaller Organisations (SREcon19 EMEA)",
          url: "https://www.usenix.org/conference/srecon19emea/presentation/huxtable",
        }
      - {
          title: "Succeeding as the Lone SRE in a Small Team (SREcon23 EMEA)",
          url: "https://www.usenix.org/conference/srecon23emea/presentation/kirchmeier",
        }
    actions:
      - { id: show-p02, type: slide.show, at: { mark: show-p02 }, slideId: l30-p02 }
      - { id: show-p02b, type: slide.show, at: { mark: show-p02b }, slideId: l30-p02b }
      - { id: show-p02c, type: slide.show, at: { mark: show-p02c }, slideId: l30-p02c }

  - id: team-of-one
    chapter: တစ်ယောက်တည်း အဖွဲ့
    narration: >
      [[mark:close-p02c]] [[mark:b1-s1]] SRE လို့ ကြားလိုက်ရင် အဖွဲ့ကြီး တစ်ခုကို မြင်ယောင်ကြတာ များပါတယ်။ အဲဒီလို အဖွဲ့မှာ on-call ကို လူ အများကြီး အလှည့်ကျ ယူနိုင်ပြီး အလုပ်ကို SLO၊ error budget နဲ့ automation ကနေ စနိုင်ပါတယ်။
      [[mark:b1-s2]] တစ်ယောက်တည်း အဖွဲ့ကတော့ ဦးစားပေးပုံ ကွာပါတယ်။ အရင်ဆုံး system ကို ရပ်တည်နေအောင် ထိန်းရပါတယ်၊ ပြီးရင် user တွေ ဘာကြုံနေလဲ မြင်ရအောင်၊ နောက်တော့ ပြောင်းလဲမှုတွေကို ဘေးကင်းကင်း ထုတ်နိုင်အောင် လုပ်ရပါတယ်။ SLO တွေက ဒီ အခြေခံတွေ ရပြီးမှ လာမှာပါ။ ဒီလို ဦးစားပေးတာ ပြတ်သားရင် SRE လုပ်ဖို့ အဖွဲ့ကြီး မလိုပါဘူး။
      [[mark:b1-s3]] ဒါပေမဲ့ ကိုမင်းက တာဝန် သုံးမျိုးကို တစ်ပြိုင်နက် ယူရပါတယ်။ outage မှာ ငြိမ်ငြိမ် ဦးဆောင်တဲ့ တုံ့ပြန်သူ၊ နောက်တစ်ခါ မဖြစ်အောင် tool ဆောက်တဲ့ တည်ဆောက်သူ၊ လုပ်ပုံ အသစ်ကို အဖွဲ့က လက်ခံအောင် နားချတဲ့ သင်ပေးသူပါ။ ကိုမင်း မရှိတဲ့ ညတွေမှာ system ကို ကာကွယ်မှာက သူ သင်ပေးထားတဲ့ developer တွေမို့ နားချတာနဲ့ သင်ပေးတာက အလုပ်ရဲ့ တစ်ဝက်လောက် ရှိပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Succeeding as the Lone SRE in a Small Team (SREcon23 EMEA)",
          url: "https://www.usenix.org/conference/srecon23emea/presentation/kirchmeier",
        }
      - {
          title: "Workbook: SRE: Reaching Beyond Your Walls",
          url: "https://sre.google/workbook/reaching-beyond/",
        }
    actions:
