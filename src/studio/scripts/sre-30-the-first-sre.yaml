  - id: playbooks
    chapter: Playbook
    narration: >
      [[mark:show-p04]] playbook ဆိုတာ alert တက်ရင် ဘာလုပ်ရမလဲ အဆင့်လိုက် ရေးထားတဲ့ လမ်းညွှန်ပါ။ ကိုမင်းက incident ဖြစ်နေတုန်းမှာပဲ လုပ်တဲ့ အဆင့်တွေကို developer တိုင်း လိုက်လုပ်နိုင်အောင် ချရေးပါတယ်၊ အဲဒါတွေက နောက်ပိုင်း automation ရဲ့ မူကြမ်း ဖြစ်လာပါတယ်။
      [[mark:p04-offline]] playbook တွေကို wiki မှာပဲ မထားဘဲ Git ထဲနဲ့ laptop ထဲမှာပါ offline copy ထားပါတယ်၊ လိုအပ်ဆုံး ညမှာ wiki ပါ ပျက်နေနိုင်လို့ပါ။ rollback ကိုလည်း ဘယ်သူမဆို run နိုင်အောင် ရေးပါတယ်၊ ကိုမင်း တစ်ယောက်တည်း run တတ်ရင် သူ အိပ်နေတဲ့ ညမှာ အသုံးမဝင်လို့ပါ။
      [[mark:show-p04b]] ဒါ တကယ် အလုပ်ဖြစ်လား ဆိုတာ ဒုတိယ လမှာ သိလိုက်ရပါတယ်။ တစ်ည ကိုမင်း ညကားပေါ်မှာ ဖုန်းလိုင်း မမိနေတုန်း deploy အသစ်ကြောင့် label တွေ print မထွက်တော့ဘဲ wiki ကလည်း ဖွင့်လို့ မရပါဘူး။ ဒါပေမဲ့ on-call ကျနေတဲ့ developer က Git ထဲက playbook ကို ဖွင့်ပြီး rollback လုပ်လိုက်တော့ ၁၀ မိနစ်အတွင်း ပြန်ကောင်းသွားပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Succeeding as the Lone SRE in a Small Team (SREcon23 EMEA)",
