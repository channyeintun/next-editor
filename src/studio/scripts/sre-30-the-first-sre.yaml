    narration: >
      [[mark:show-p01]] Padauk မှာ အခုဆို platform အဖွဲ့၊ complaint chart တွေနဲ့ incident မှာ ကူညီတဲ့ Ops Buddy အထိ ရှိနေပါပြီ။ ဒီနေ့တော့ အဲဒါတွေ တစ်ခုမှ မရှိတဲ့ နေရာကို သွားပါမယ်။
      [[mark:hook-parcel]] Padauk က မန္တလေးက ပါဆယ် ပို့တဲ့ startup လေး Padauk Parcel ကို ဝယ်လိုက်ပါတယ်။ engineer ၈ ယောက် ရှိပေမဲ့ outage က အပတ်တိုင်း ဖြစ်ပြီး deploy ကို တစ်ယောက်တည်းပဲ လုပ်တတ်ပါတယ်၊ သူကလည်း နှစ်ပတ်နေရင် ထွက်တော့မှာပါ။ ဒါကြောင့် developer ကိုမင်းကို Parcel ရဲ့ ပထမဆုံး Site Reliability Engineer၊ SRE အဖြစ် လွှတ်လိုက်ပါတယ်။
      [[mark:show-p01b]] ကုမ္ပဏီတွေက ပထမဆုံး SRE ကို ခန့်တာ အများအားဖြင့် ပြဿနာက မခံနိုင်လောက်အောင် ဖြစ်လာမှပါ၊ outage တွေ ခဏခဏ ဖြစ်တာ၊ deploy က လူ တစ်ယောက်အပေါ် မှီနေတာ၊ မီးငြိမ်းရင်းနဲ့ feature အတွက် အချိန် မကျန်တော့တာ မျိုးပါ။ မသီရိက mentor အဖြစ်၊ သူ့ အဖွဲ့က အဖော်တွေအဖြစ် ကူညီပေမဲ့ Parcel ထဲမှာတော့ ကိုမင်း တစ်ယောက်တည်းပါ။ ဒါဆို သူ ဘယ်ကနေ စမလဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Succeeding as the Lone SRE in a Small Team (SREcon23 EMEA)",
          url: "https://www.usenix.org/conference/srecon23emea/presentation/kirchmeier",
        }
      - {
          title: "From Nothing to SRE: Implementing SRE in Smaller Organisations (SREcon19 EMEA)",
          url: "https://www.usenix.org/conference/srecon19emea/presentation/huxtable",
        }
