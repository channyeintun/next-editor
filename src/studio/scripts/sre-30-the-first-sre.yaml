# SRE from zero, lesson 30: The first SRE (Burmese concept lesson).
#
# Built from the approved voice script
# docs/sre-course/voice-scripts/sre-30-the-first-sre.md. Every spoken
# character is that script's "> " lines, unchanged; each ⟪…⟫ marker became a
# [[mark:…]] at the same place. Check it with:
#   bun ~/Documents/sre-course/work/check-narration.ts \
#     docs/sre-course/voice-scripts/sre-30-the-first-sre.md \
#     src/studio/scripts/sre-30-the-first-sre.yaml
#
# Nothing runs: deck pages and the whiteboard carry the lesson, and notes.md is
# the recap. The workspace and runtime follow the validated no-code skeleton
# (WebContainer, empty init command, a harmless dev script).
#
# Eight marks that are not in the voice script add no spoken text and sit at
# an existing ။: hook-parcel, p02-questions, p03-journey, p03b-tools and
# p04-offline split the narration of l30_p01, l30_p02, l30_p03, l30_p03b and
# l30_p04 at their paragraph breaks (one 468-, 452-, 455-, 458- or
# 477-character dialog would pass the 450-character limit; no action uses
# them); b2-s1b and b2-s3b let board B2's day-10 and day-21 ticks land on the
# sentences that name them, not seconds early with the step's first tick, so
# each apply adds one labelled tick, as lesson 16 lands its lanes; and
# ask-question makes the recap question its own dialog so the question-line
# select can hang off it for the ⟪pause 3s⟫, as in lesson 7. sel-question is
# the voice script's ⟪select မေးခွန်း⟫; it only splits the short lead-in from
# the question.
#
# Pacing: at 70 ms/char no page or board step holds longer than ~36 s (the
# longest is the cover, l30_p01, 35.6 s from its show, then l30_p04, 34.8 s),
# so the voice script's own markers carry it and no pacing page or board step
# was added.
#
# A board followed by a deck page closes the panel (open: false) 400 ms before
# the page, and a deck page followed by a board closes the page 400 ms before,
# as in Module 1. The lesson never goes straight from one board to the next.
#
# Boards (B1 P6 lanes, B2 P8 timeline). Colour jobs: #1e1e1e ink (paints
# white) for arrows and the time axis; blue the thing named (the big SRE
# team's lane, B2's day-3 and day-14 events); green healthy or done (the
# team-of-one lane, the day-10, day-21 and day-30 milestones); red failure
# (panicked roll forward into outages in a row, struck out); orange the caveat
# or limit (Ko Min carrying three roles at once, the narration's "ဒါပေမဲ့", and
# the list's one-in-one-out rule). A label on two or three lines is one text
# asset per line, so each line meets the 0.55 em width rule on its own; every
# label was also measured in Chrome with Excalidraw's Virgil font and fits its
# box. B1's step 3 puts Ko Min's box under the team-of-one box, his three roles
# beside it. B2 sets each day's label on three lines, not the voice script's
# two ("ရက် 3:" / "deploy အဆင့်တွေ" / "ထွက်မယ့်သူနဲ့ ချရေး"): as two lines the
# three labels above the axis need 339 + 308 + 277 px under the 0.55 rule,
# more than the 850 px visible area, and as three lines 293 + 185 + 154 px. The
# roll-forward note gets one strike per line, sized to the measured text, since
# one strike through a two-line label would fall between its lines.
#
# Deck pages: deck "Next Editor · SRE 6B · Where you work, and what's next".
# deckUrl is the deck's published /pub link; until this lesson's pages are
# built from the page plan, the Director reports the l30 pages missing from
# the published deck. Page plan:
# ~/Documents/sre-course/work/pages/sre-30-the-first-sre.json
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/sre-30-the-first-sre.yaml
#   bun scripts/studio-compile-check.ts src/studio/scripts/sre-30-the-first-sre.yaml
