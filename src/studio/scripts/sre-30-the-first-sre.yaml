      - { id: show-p05b, type: slide.show, at: { mark: show-p05b }, slideId: l30-p05b }

  - id: this-week
    narration: >
      [[mark:show-p06]] ကုမ္ပဏီရဲ့ ပထမဆုံး SRE ဖြစ်ဖြစ်၊ developer ဖြစ်ဖြစ် ဒီအပတ် ဒီ သုံးခုနဲ့ စလို့ရပါတယ်။ ကိုယ့် အဖွဲ့ရဲ့ ပြန်ပြန်လောင်တဲ့ မီးကို နာမည်တပ်ပြီး ချရေးပါ။ ဘယ်သူမဆို လိုက်လုပ်နိုင်မယ့် rollback အဆင့်တွေကို ရေးပြီး တခြားသူ တစ်ယောက်ကို စမ်းခိုင်းပါ။ ပြီးတော့ ဦးစားပေး စာရင်းကို အစဉ်လိုက် စီပြီး အဖွဲ့နဲ့ မျှပါ။
