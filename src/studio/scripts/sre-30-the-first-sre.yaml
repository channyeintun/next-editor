      # The day-10 tick lands on the sentence that names it, not ~6 s early.
      - id: b2-s1b
        type: whiteboard.apply
        at: { mark: b2-s1b }
        upsertIds: [l30-b2-t10, l30-b2-d10-l1, l30-b2-d10-l2, l30-b2-d10-l3]
