      - { id: show-p04b, type: slide.show, at: { mark: show-p04b }, slideId: l30-p04b }

  - id: grow
    chapter: အဖွဲ့လိုက် ပိုင်အောင်
    narration: >
      [[mark:show-p05]] အဲဒီည developer တစ်ယောက်တည်း ဖြေရှင်းနိုင်ခဲ့တာက ကိုမင်းက developer တွေနဲ့ on-call ကို အလှည့်ကျ ခွဲယူထားလို့ပါ။ developer တွေက ပြဿနာ တစ်ခုဟာ မနေ့က ကိုယ့် code ကြောင့်လား ချက်ချင်း သိတတ်တာလည်း အားသာချက်ပါ။
      change တိုင်းကိုလည်း တခြား လူ တစ်ယောက်က review လုပ်ရပါမယ်။ အစမှာ developer တွေ ညည်းကြပေမဲ့ reviewer တစ်ယောက်က မန္တလေးထဲ ပို့တဲ့ ပါဆယ်ကို ရန်ကုန် ပို့ခ ကောက်မိမယ့် bug ကို ဖမ်းမိတော့ review ကို သူတို့ကိုယ်တိုင် အားပေးလာကြပါတယ်။
      [[mark:show-p05b]] rider job နဲ့ label print journey နှစ်ခုမှာ ပထမဆုံး SLO တွေ ထားလိုက်တော့ bug တစ်ခုကို ချက်ချင်း ပြင်ရမလား data နဲ့ ဆုံးဖြတ်နိုင်လာပါတယ်။ test တွေနဲ့ AI reviewer တွေ ကူနိုင်ပေမဲ့ SLO တွေကို alert နဲ့ ချိတ်ပြီး ပုံမှန် မီလာမှပဲ လူ review ကို လျှော့မယ်လို့ ကိုမင်း ဆုံးဖြတ်ပါတယ်။ သူ ဖြစ်ချင်တာက မရဘူးလို့ တားတဲ့သူ မဟုတ်ဘဲ ဘေးကင်းတဲ့ လမ်းကို အလွယ်ဆုံး လမ်း ဖြစ်အောင် လုပ်ပေးတဲ့သူပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Workbook: SRE: Reaching Beyond Your Walls",
          url: "https://sre.google/workbook/reaching-beyond/",
        }
      - {
          title: "From Nothing to SRE: Implementing SRE in Smaller Organisations (SREcon19 EMEA)",
          url: "https://www.usenix.org/conference/srecon19emea/presentation/huxtable",
        }
    actions:
