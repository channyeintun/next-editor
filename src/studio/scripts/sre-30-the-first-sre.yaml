    files:
      notes.md: |
        # ပထမဆုံး SRE

        - ဦးစားပေး စာရင်း — အစဉ်လိုက် စီ၊ လူတိုင်း မြင်၊ 1 ခု ဝင်ရင် 1 ခု ထွက်
        - ပြန်ပြန်လောင်တဲ့ မီး — ထပ်ခါထပ်ခါ ပြန်ဖြစ်တဲ့ outage
        - rollback — အရင် ကောင်းခဲ့တဲ့ version ကို ပြန်သွား၊ roll forward မလို
        - playbook — ဘယ်သူမဆို လိုက်လုပ်နိုင်တဲ့ အဆင့်တွေ၊ offline copy ပါ
        - on-call ခွဲယူ — SRE နဲ့ developer တွေ အလှည့်ကျ အတူ ယူ

        မေးခွန်း: deploy လုပ်တတ်တဲ့ တစ်ယောက်တည်းက နောက်လ ထွက်မယ်။ စာရင်းရဲ့ ထိပ်ဆုံးမှာ ဘာ ထားမလဲ?
