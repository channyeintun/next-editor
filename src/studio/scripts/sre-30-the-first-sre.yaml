  - id: user-checks
    chapter: User check သုံးခု
    narration: >
      [[mark:close-b2]] [[mark:show-p03]] အရင်က Parcel မှာ outage ဖြစ်ရင် ဆိုင်ရှင်တွေ Viber နဲ့ ပြောမှ သိရပါတယ်။ ကိုမင်းရဲ့ check သုံးခုကတော့ server ကို မစစ်ဘဲ user လုပ်ချင်တာ ပြီးလား စစ်ပါတယ်၊ rider က job လက်ခံနိုင်လား၊ label print ထွက်လား၊ customer က tracking မြင်ရလား ဆိုတာပါ။
      [[mark:p03-journey]] ဒါက lesson ၇ က critical user journey ကို တိုင်းတာပါ၊ journey ဆိုတာ user တစ်ယောက် ရည်ရွယ်ချက် တစ်ခု ပြီးဖို့ ဖြတ်သွားရတဲ့ အဆင့်တွေပါ။ dashboard အများကြီးထက် ဒီ check သုံးခုက မိနစ်တိုင်း အဖြေ ပေးနေတာက ပိုအရေးကြီးပါတယ်။
      [[mark:show-p03b]] alert ကိုလည်း CPU မြင့်တာလို အကြောင်းရင်းပေါ် မထားဘဲ user ခံစားရတဲ့ လက္ခဏာပေါ်မှာပဲ ထားပြီး တက်တိုင်း လုပ်စရာ ရှိအောင်၊ မလိုဘဲ မတက်အောင် ထိန်းပါတယ်။ log တွေကိုလည်း လူရော စက်ရော ဖတ်လို့ရတဲ့ JSON ပုံစံ တစ်မျိုးတည်းနဲ့ နေရာ တစ်ခုကို ပို့ပါတယ်။
      [[mark:p03b-tools]] metric၊ log၊ trace အတွက်လည်း tool တစ်စုတည်းပဲ သုံးပါတယ်၊ tool တွေကို အချင်းချင်း ဆက်ပေးနေရတာကိုယ်တိုင် toil ဖြစ်လို့ပါ။ alert အသစ်ကိုလည်း ညနေ မဟုတ်ဘဲ မနက်မှာ ဖွင့်ပါတယ်၊ မှားတက်ရင် ရုံးမှာ ရှိနေတုန်း ပြင်နိုင်အောင်ပါ။
    sources:
