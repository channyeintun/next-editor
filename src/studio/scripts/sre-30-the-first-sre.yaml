        upsertIds: [l30-b1-r1, l30-b1-r1-t, l30-b1-a1, l30-b1-r2, l30-b1-r2-t1, l30-b1-r2-t2]
        drawMs: 2000
      - id: b1-s2
        type: whiteboard.apply
        at: { mark: b1-s2 }
        upsertIds: [l30-b1-r3, l30-b1-r3-t, l30-b1-a2, l30-b1-r4, l30-b1-r4-t1, l30-b1-r4-t2]
