        drawMs: 1600

  - id: diary
    chapter: ကိုမင်းရဲ့ ပထမ ရက် 30
    narration: >
      [[mark:close-b1]] [[mark:show-p02d]] ပုံမှန်ဆိုရင် ပထမဆုံး SRE က ထပ်ခါထပ်ခါ ပြန်ဖြစ်နေတဲ့ outage၊ ပြန်ပြန်လောင်တဲ့ မီးကို အရင် ငြိမ်းပါတယ်၊ ငြိမ်းသွားရင် လူတိုင်း သက်သာပြီး SRE ကို ယုံလာလို့ပါ။ Parcel မှာ အဲဒီ မီးက dispatch worker ပါ။
      ဒါပေမဲ့ worker က restart လုပ်ရင် ပြန်ကောင်းသေးတယ်၊ deploy တတ်သူ ထွက်သွားရင်တော့ worker ရဲ့ fix ကိုတောင် ထုတ်လို့ မရတော့ပါဘူး။ ဒါကြောင့် ကိုမင်းက deploy ကို ပထမ၊ worker ကို ဒုတိယ၊ user check တွေကို တတိယ ထားပါတယ်။
      [[mark:close-p02d]] [[mark:b2-s1]] ကိုမင်းရဲ့ ပထမ ရက် ၃၀ ကို ကြည့်ရအောင်။ ရက် ၃ မှာ ထွက်ခါနီး engineer နဲ့ ထိုင်ပြီး deploy အဆင့်တိုင်းကို ချရေးပါတယ်။ [[mark:b2-s1b]] ရက် ၁၀ မှာ ခလုတ် တစ်ချက်နဲ့ deploy ရော rollback ရော လုပ်လို့ရလာပါပြီ၊ rollback ဆိုတာ ပြဿနာ ရှိတဲ့ ပြောင်းလဲမှုကို ဖယ်ပြီး အရင် ကောင်းခဲ့တဲ့ version ကို ပြန်ပြောင်းတာပါ။
      [[mark:b2-s2]] ကောင်းတဲ့ deploy က အဆင့် တစ်ဆင့်တည်းနဲ့ ပြီးရမယ်၊ service လည်း မရပ်ရဘူး၊ ဒါပေမဲ့ အရေးအကြီးဆုံးက rollback လုပ်လို့ရတာပါ။ rollback မရှိရင် deploy ပျက်တိုင်း ပြင်ဆင်ချက် အသစ်ကို ပျာပျာသလဲ ထပ်တင်ရပါတယ်၊ ဒါကို roll forward လို့ ခေါ်ပါတယ်။ စိတ်လောပြီး ရေးတဲ့ fix က ပြဿနာ အသစ်ကို ဖြစ်စေတတ်လို့ outage တွေ ဆက်တိုက် ဖြစ်လာတတ်ပါတယ်။
      [[mark:b2-s3]] ရက် ၁၄ မှာ အဲဒီ engineer ထွက်သွားပေမဲ့ deploy တွေ ဆက်လုပ်နိုင်ပါတယ်။ [[mark:b2-s3b]] dispatch worker ကတော့ လိပ်စာ ရှာပေးတဲ့ service ကို timeout မထားဘဲ ခေါ်ထားလို့ အဲဒီ service နှေးတိုင်း အဆုံးမရှိ စောင့်နေတာပါ။ timeout ထည့်ပြီး အလိုအလျောက် restart လုပ်အောင် ပြင်လိုက်တော့ ရက် ၂၁ မှာ အပတ်တိုင်း ဖြစ်နေတဲ့ outage ရပ်သွားပါတယ်။
      [[mark:b2-s4]] ရက် ၃၀ မှာတော့ user check သုံးခု live ဖြစ်လာပါတယ်။ ဒီ အလုပ်တွေကို founder တွေနဲ့ မျှထားတဲ့ ဦးစားပေး စာရင်း တစ်ခုမှာ အစဉ်လိုက် စီထားပြီး အသစ် တစ်ခု ထည့်ရင် တစ်ခုကို ထုတ်ရပါတယ်။ ပြီးသွားတာတွေကိုလည်း ပြထားလို့ founder တွေက တိုးတက်မှုကို အပတ်တိုင်း မြင်ရပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "From Nothing to SRE: Implementing SRE in Smaller Organisations (SREcon19 EMEA)",
          url: "https://www.usenix.org/conference/srecon19emea/presentation/huxtable",
        }
      - {
          title: "Succeeding as the Lone SRE in a Small Team (SREcon23 EMEA)",
          url: "https://www.usenix.org/conference/srecon23emea/presentation/kirchmeier",
        }
    actions:
      - {
          id: close-b1,
          type: whiteboard.apply,
          at: { mark: close-b1, offsetMs: -400 },
          open: false,
        }
      - { id: show-p02d, type: slide.show, at: { mark: show-p02d }, slideId: l30-p02d }
      - { id: close-p02d, type: slide.close, at: { mark: close-p02d, offsetMs: -400 } }
      # The time axis is furniture (no drawMs); then the day-3 tick and label.
      - {
