  - id: recap
    narration: >
      [[mark:close-p06]] [[mark:open-notes]] ကိုမင်း Parcel မှာ သင်ခဲ့တာတွေပါ။ [[mark:sel-priority-list]] ဦးစားပေး စာရင်းက လူတိုင်း မြင်ရတဲ့ အစဉ်လိုက် စာရင်းပါ၊ အသစ် တစ်ခု ဝင်ရင် တစ်ခု ထွက်ရပါတယ်။ [[mark:sel-repeat-fire]] ပြန်ပြန်လောင်တဲ့ မီးကတော့ ထပ်ခါထပ်ခါ ပြန်ဖြစ်နေတဲ့ outage ပါ။
      [[mark:sel-rollback]] rollback က အရင် ကောင်းခဲ့တဲ့ version ကို ပြန်သွားတာမို့ ပျာပျာသလဲ roll forward လုပ်စရာ မလိုတော့ပါဘူး။ [[mark:sel-playbook]] playbook က ဘယ်သူမဆို လိုက်လုပ်နိုင်တဲ့ အဆင့်တွေပါ၊ offline copy လည်း ထားရပါမယ်။ [[mark:sel-shared-oncall]] on-call ခွဲယူတာကတော့ SRE နဲ့ developer တွေ အလှည့်ကျ အတူ ယူတာပါ။
      [[mark:sel-question]] ကိုယ်က ကိုမင်းနေရာမှာ ဆိုပါစို့။ [[mark:ask-question]] deploy လုပ်တတ်တဲ့သူ တစ်ယောက်တည်းက နောက်လ ထွက်တော့မယ် ဆိုရင် ကိုယ့် စာရင်းရဲ့ ထိပ်ဆုံးမှာ ဘာကို ထားမလဲ?
      [[mark:pause-question]] deploy နဲ့ rollback ကို ဘယ်သူမဆို run နိုင်အောင် အရင်ဆုံး လုပ်ရပါမယ်။ startup လေးကနေ ပြင်လို့မရတဲ့ system တွေနဲ့ စည်းမျဉ်း တင်းကျပ်တဲ့ ကုမ္ပဏီကြီး အဟောင်းတွေဆီ ကူးကြည့်ရအောင်။ ညသန်းခေါင်မှာ wallet တွေ ပိတ်မိသွားပြီး ပြင်တာက ၅ မိနစ်ပဲ ကြာပေမဲ့ မိနစ် ၇၀ ပိတ်မိနေခဲ့ပါတယ်။ ကျန်တဲ့ မိနစ် ၆၅ က ဘယ်ရောက်သွားလဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Succeeding as the Lone SRE in a Small Team (SREcon23 EMEA)",
          url: "https://www.usenix.org/conference/srecon23emea/presentation/kirchmeier",
        }
      - {
          title: "From Nothing to SRE: Implementing SRE in Smaller Organisations (SREcon19 EMEA)",
          url: "https://www.usenix.org/conference/srecon19emea/presentation/huxtable",
        }
    actions:
      - { id: close-p06, type: slide.close, at: { mark: close-p06 } }
      - {
          id: open-notes,
          type: workspace.openFile,
          at: { mark: open-notes, offsetMs: 300 },
          path: notes.md,
        }
      - {
          id: sel-priority-list,
          type: editor.select,
          at: { mark: sel-priority-list },
          target: { file: notes.md, text: "ဦးစားပေး စာရင်း", occurrence: 1 },
        }
      - {
          id: sel-repeat-fire,
          type: editor.select,
          at: { mark: sel-repeat-fire },
          target: { file: notes.md, text: "ပြန်ပြန်လောင်တဲ့ မီး", occurrence: 1 },
        }
      - {
          id: sel-rollback,
          type: editor.select,
          at: { mark: sel-rollback },
          target: { file: notes.md, text: "rollback", occurrence: 1 },
        }
      - {
          id: sel-playbook,
          type: editor.select,
          at: { mark: sel-playbook },
          target: { file: notes.md, text: "playbook", occurrence: 1 },
        }
      - {
          id: sel-shared-oncall,
          type: editor.select,
          at: { mark: sel-shared-oncall },
          target: { file: notes.md, text: "on-call ခွဲယူ", occurrence: 1 },
        }
      # The voice script's ⟪select မေးခွန်း⟫ and ⟪pause 3s⟫, the way the Module 1
      # reviewers fixed the pause. sel-question marks where the voice script puts
      # the select, but a select there would drag under the lead-in and the
      # question and leave no pause, and one at pause-question would drag under
      # the answer's first words (the scheduler holds only the dialog after its
      # anchor's). So the question-line select hangs off ask-question, one more
      # mark at an existing sentence end that makes the question its own dialog:
      # it starts about as the question ends, its drag runs in silence, and the
      # answer at pause-question waits for it. The question is 102 characters,
      # so 7540 (400 + 102 x 70) would start the drag as the question ends at
      # 70 ms per char, but anything above ~7380 trips compile-check's 2.5 s
      # inserted-silence warning at 55; 7350 leaves about 2.8 / 1.3 / 0.35 s of
      # quiet before the answer at 55 / 70 / 95 (at 95, and by 0.16 s at 70, the
      # drag starts under the question's last words, as in lessons 7 and 10).
      - id: select-question
        type: editor.select
        at: { mark: ask-question, offsetMs: 7350 }
        target:
          file: notes.md
          text: "မေးခွန်း: deploy လုပ်တတ်တဲ့ တစ်ယောက်တည်းက နောက်လ ထွက်မယ်။ စာရင်းရဲ့ ထိပ်ဆုံးမှာ ဘာ ထားမလဲ?"
          occurrence: 1

checks:
  # 500, not 300: google-svg deck pages stall the main thread at show/close.
  - { type: timing.p95Ms, max: 500 }
