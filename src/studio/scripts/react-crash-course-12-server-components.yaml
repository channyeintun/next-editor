# React crash course, lesson 12 — Server Components and Server Functions
# (Burmese, my-MM).
#
# Story: until now every component ran in the browser. This lesson runs a
# real React Server Components app inside the WebContainer (Vite's official
# RSC plugin, @vitejs/plugin-rsc; no framework and no router). App is an async
# Server Component that reads the menu with node:fs through a server-only
# db.js; an AddButton marked 'use client' adds state and clicks to each dish
# row; a 'use server' placeOrder Server Function is called by a 'use client'
# OrderForm through useActionState, and the server re-renders App so the
# server-side order count updates; finally an async Specials Server Component
# streams in behind <Suspense>. Boards explain where code runs, the three
# plugin environments, the 'use client' boundary (serializable props), Server
# Functions, and a recap with cacheSignal / prerender / partial prerendering.
#
# Insert-only plan: AddButton.jsx, actions.js, OrderForm.jsx and Specials.jsx
# are pinned EMPTY and typed while nothing imports them. App.jsx is a live
# Server Component, so it only takes `block` inserts of complete lines: the
# import first, then the usage. New JSX is appended AFTER the stateful
# AddButton rows, so their client state survives every server refresh.
# Streaming comes last: once the 5 s Specials is on the page, every later
# server refresh would wait for it (none follows).
#
# The dev server starts in the first scene (install + boot take ~40 s in the
# WebContainer) and is waited on only when the preview opens, about two and a
# half minutes later.
#
# Narration is Burmese (my-MM), written span by span from the English draft
# in tools/narration-en.txt; voice-script.md next to this file is the source
# (tools/sync_check.py applies it). DESIGN.md is the writer's brief.
