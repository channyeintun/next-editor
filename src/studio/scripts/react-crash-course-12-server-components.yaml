        button:disabled {
          background: var(--line);
          color: var(--muted);
          cursor: not-allowed;
        }

        input,
        select,
        textarea {
          font: inherit;
          width: 100%;
          padding: 6px 12px;
          border: 1px solid var(--line);
          border-radius: 10px;
          background: var(--surface);
          color: var(--text);
        }

        input:focus,
        select:focus,
        textarea:focus,
        button:focus-visible {
          outline: 2px solid var(--accent);
          outline-offset: 2px;
        }

        .badge {
          display: inline-block;
          padding: 0 10px;
          border-radius: 999px;
          background: var(--accent-soft);
          color: var(--accent);
