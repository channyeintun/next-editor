build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 12412

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  # ------------------------------------------------------------------ 1
  - id: where-code-runs
    chapter: "Server Component ဆိုတာ ဘာလဲ"
    narration: >
      ဒီ lesson မှာ component တချို့ကို server ပေါ် ရွှေ့ပြီး၊ တကယ့် React Server
      Components app ထဲမှာ ကြည့်ပါမယ်။ [[mark:start-server]] package တွေ install
      လုပ်ရတာ ကြာတဲ့အတွက်၊ dev server ကို အခုကတည်းက စ run ထားလိုက်ရအောင်။
      [[mark:draw-browser]] အခုထိတော့ ကိုယ့် component အားလုံးကို browser ကပဲ run
      ခဲ့ပါတယ်။ [[mark:draw-server]] Server Component ကတော့ server ပေါ်မှာ render
      လုပ်တဲ့ component ပါ။ ဒါကြောင့် ဖိုင်တို့ database တို့ကို တိုက်ရိုက်
      ဖတ်လို့ ရပါတယ်။ [[mark:draw-arrow]] ပြီးရင် server က ထုတ်ပြီးသား HTML ကို
      ပို့လို့ page က ချက်ချင်း ပေါ်ပါတယ်။ RSC payload ဆိုတဲ့ ရလဒ် ဖော်ပြချက်လည်း
      ပါလာပြီး၊ browser ထဲက React က အဲဒါနဲ့ page ကို update လုပ်ပါတယ်။ RSC က React
      Server Components ပါ။ [[mark:draw-never]] အရေးကြီးတာကတော့၊ Server Component
      ရဲ့ code နဲ့ သူ သုံးတဲ့ library တွေက browser ဆီ ဘယ်တော့မှ မရောက်ဘဲ၊ ရလဒ်ပဲ
      ရောက်တာပါ။
    sources:
      - title: "React — Server Components"
        url: "https://react.dev/reference/rsc/server-components"
      - title: "React 19 — Server Components"
        url: "https://react.dev/blog/2024/12/05/react-19#server-components"
      - title: "Vite — Getting Started"
        url: "https://vite.dev/guide/"
    actions:
      - id: open-board-1
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        maximized: true
        clear: true
        upsertIds: [b1-title]
      - id: start-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 45000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-browser
        type: whiteboard.apply
        at: { mark: draw-browser }
        upsertIds: [b1-browser-box, b1-browser-name, b1-browser-l1, b1-browser-l2]
        drawMs: 2200
      - id: draw-server
        type: whiteboard.apply
        at: { mark: draw-server }
        upsertIds: [b1-server-box, b1-server-name, b1-server-l1, b1-server-l2]
        drawMs: 2200
      - id: draw-arrow
        type: whiteboard.apply
        at: { mark: draw-arrow }
        upsertIds: [b1-arrow, b1-sends]
        drawMs: 1600
      - id: draw-never
        type: whiteboard.apply
        at: { mark: draw-never }
        upsertIds: [b1-never, b1-never-underline]
        drawMs: 1800

  # ------------------------------------------------------------------ 2
  - id: plugin-environments
    narration: >
      [[mark:draw-envs]] ဒါကို React တစ်ခုတည်းနဲ့ မရပါဘူး၊ code ကို server နဲ့
      browser ခွဲဖို့ ဖိုင်တွေ စုပေးတဲ့ bundler လိုပါတယ်။ Vite ရဲ့ တရားဝင် Server
      Component plugin က app ကို environment သုံးခု၊ ဆိုလိုတာက code run မယ့် နေရာ
      သုံးခုနဲ့ build လုပ်ပါတယ်။ [[mark:draw-env-rsc]] rsc environment က Server
      Component နဲ့ Server Function တွေကို run ပါတယ်။ [[mark:draw-env-ssr]] ssr က
      server-side rendering ပါ၊ အဲဒီ ရလဒ်ကို HTML အဖြစ် ပြောင်းပေးပါတယ်။
      [[mark:draw-env-client]] client environment ကတော့ browser ထဲမှာ ခလုတ်တွေ
      အလုပ်လုပ်အောင် လုပ်ပေးပါတယ်။ [[mark:draw-framework]] ဒီ သုံးခုကို framework
      folder ထဲက ဖိုင်တွေက ချိတ်ပေးပါတယ်။ Next.js လို framework တွေက ဒါကို
      ကိုယ့်အစား ရေးပေးပြီး၊ ဒီမှာတော့ router မပါဘဲ မြင်သာအောင် ထားထားပါတယ်။
      [[mark:close-board-2]] ဒါက Vite ရဲ့ config ဖိုင်ပါ။ [[mark:select-entries]]
      ဒီ သုံးကြောင်းက environment တစ်ခုစီရဲ့ entry ဖိုင်တွေပါ။ [[mark:select-fix]]
      ပထမ စာကြောင်းက fix သေးသေးလေး တစ်ခုပါ။ ဒီ editor က server ကို browser tab ထဲက
      Node.js နဲ့ run ပေးလို့ လိုတာ ဖြစ်ပြီး၊ သာမန် ကွန်ပျူတာမှာတော့ ဘာမှ
      မလုပ်ပါဘူး။
    sources:
      - title: "React — Server Components"
        url: "https://react.dev/reference/rsc/server-components"
      - title: "Vite — Environment API"
        url: "https://vite.dev/guide/api-environment"
      - title: "Vite — @vitejs/plugin-rsc"
        url: "https://github.com/vitejs/vite-plugin-react/tree/main/packages/plugin-rsc"
    actions:
      - id: draw-envs
        type: whiteboard.apply
        at: { mark: draw-envs }
        clear: true
        upsertIds: [b2-title]
      - id: draw-env-rsc
        type: whiteboard.apply
        at: { mark: draw-env-rsc }
        upsertIds: [b2-rsc-box, b2-rsc-name, b2-rsc-desc]
        drawMs: 1600
      - id: draw-env-ssr
        type: whiteboard.apply
        at: { mark: draw-env-ssr }
        upsertIds: [b2-arrow-1, b2-ssr-box, b2-ssr-name, b2-ssr-desc]
        drawMs: 1600
      - id: draw-env-client
        type: whiteboard.apply
        at: { mark: draw-env-client }
        upsertIds: [b2-arrow-2, b2-client-box, b2-client-name, b2-client-desc]
        drawMs: 1600
      - id: draw-framework
        type: whiteboard.apply
        at: { mark: draw-framework }
        upsertIds: [b2-framework]
        drawMs: 1200
      - id: close-board-2
        type: whiteboard.apply
        at: { mark: close-board-2 }
        open: false
      - id: collapse-dock-early
        type: runtime.collapseDock
        at: { afterAction: close-board-2 }
      - id: open-vite-config
        type: workspace.openFile
        at: { mark: close-board-2, offsetMs: 700 }
        path: vite.config.js
      - id: select-entries
        type: editor.select
        at: { mark: select-entries }
        target:
          file: vite.config.js
          text: "rsc: \"./src/framework/entry.rsc.jsx\",\n        ssr: \"./src/framework/entry.ssr.jsx\",\n        client: \"./src/framework/entry.browser.jsx\","
          occurrence: 1
      - id: select-fix
        type: editor.select
        at: { mark: select-fix }
        target: { file: vite.config.js, text: 'import "./webcontainer-fix.js";', occurrence: 1 }

  # ------------------------------------------------------------------ 3
  - id: server-component-tour
    chapter: "Server ပေါ်မှာ data ဖတ်ရအောင်"
    narration: >
      [[mark:open-app]] App ကို ဖွင့်ရအောင်။ [[mark:select-html]] html tag ကနေ
      စပြီး page တစ်ခုလုံးကို render လုပ်တဲ့အတွက်၊ သီးသန့် HTML ဖိုင် မလိုပါဘူး။
      [[mark:select-async]] function ကိုယ်တိုင်ကို ကြည့်ပါ။ သူက async ပါ၊ browser
      ထဲက component ကတော့ ဒီလို ဖြစ်လို့ မရပါဘူး။ [[mark:select-await]] ဒါကြောင့်
      menu ကို ဒီမှာပဲ await နဲ့ စောင့်လို့ ရပြီး၊ useEffect တို့ fetch တို့
      မလိုပါဘူး။ [[mark:open-db]] ဒါဆို menu က ဘယ်က လာတာလဲ။
      [[mark:select-readfile]] ဒီ စာကြောင်းက JSON ဖိုင်ကို Node.js ရဲ့ file system
      နဲ့ ဖတ်ပါတယ်၊ browser က ဒီလို မဖတ်နိုင်ပါဘူး။ [[mark:select-server-only]]
      ပထမဆုံး import က ဒီ ဖိုင်ကို server-only လို့ အမှတ်အသား လုပ်ထားတာပါ။ browser
      ဘက်က ဖိုင်က ဒါကို import လုပ်မိရင် bundler က error နဲ့ ရပ်ပေးလို့၊ database
      code က browser ဆီ မရောက်နိုင်ပါဘူး။ [[mark:preview-opens]] dev server က
      အသင့် ဖြစ်နေပြီမို့ preview ကို ဖွင့်လိုက်ရအောင်။ [[mark:after-preview]]
      menu က server ကနေ လာတဲ့ ပထမဆုံး HTML ထဲမှာ ပါပြီးသားပါ။ ဆိုင် နာမည် အောက်က
      မှာထားတဲ့ အရေအတွက်ကတော့ server ရဲ့ memory ထဲက လာတာပါ၊ အခုတော့ 0 ပါ။
    sources:
      - title: "React — Server Components: async components"
        url: "https://react.dev/reference/rsc/server-components"
      - title: "Node.js — fs.promises.readFile"
        url: "https://nodejs.org/api/fs.html#fspromisesreadfilepath-options"
      - title: "React — 'use client' (the module boundary)"
        url: "https://react.dev/reference/rsc/use-client"
      - title: "Vite — @vitejs/plugin-rsc: server-only and client-only import"
        url: "https://github.com/vitejs/vite-plugin-react/tree/main/packages/plugin-rsc#server-only-and-client-only-import"
    actions:
      - id: open-app
        type: workspace.openFile
        at: { mark: open-app }
        path: src/App.jsx
      - id: select-html
        type: editor.select
        at: { mark: select-html }
        target: { file: src/App.jsx, text: '<html lang="my">', occurrence: 1 }
      - id: select-async
        type: editor.select
        at: { mark: select-async }
        target: { file: src/App.jsx, text: "export default async function App()", occurrence: 1 }
      - id: select-await
        type: editor.select
        at: { mark: select-await }
        target: { file: src/App.jsx, text: "const menu = await getMenu();", occurrence: 1 }
      - id: open-db
        type: workspace.openFile
        at: { mark: open-db }
        path: src/db.js
      - id: select-readfile
        type: editor.select
        at: { mark: select-readfile }
        target:
          {
            file: src/db.js,
            text: 'await readFile(new URL("./menu.json", import.meta.url), "utf8")',
            occurrence: 1,
          }
      - id: select-server-only
        type: editor.select
        at: { mark: select-server-only }
        target: { file: src/db.js, text: 'import "server-only";', occurrence: 1 }
      - id: wait-for-server
        type: runtime.waitForReady
        at: { mark: preview-opens }
        timeoutMs: 20000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-server }
        timeoutMs: 15000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-menu
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: menu }
        textContains: "မုန့်ဟင်းခါး"
        retry: { maxAttempts: 3, delayMs: 400 }
      - id: collapse-dock
        type: runtime.collapseDock
        at: { afterAction: expect-menu }
      - id: expect-no-orders
        type: expect.preview
        at: { mark: after-preview }
        timeoutMs: 5000
        target: { by: testId, value: order-count }
        textContains: "မှာထားတာ 0 ခု"
        retry: { maxAttempts: 3, delayMs: 400 }

  # ------------------------------------------------------------------ 4
  - id: client-component
    chapter: "'use client' နဲ့ Client Component"
    narration: >
      [[mark:open-addbutton]] နောက်တစ်ဆင့်မှာ ဘယ်နှစ်ပွဲ လိုချင်လဲ ရွေးလို့ ရအောင်
      လုပ်ပါမယ်။ ဒါက state နဲ့ click လိုပေမယ့်၊ Server Component က server မှာပဲ
      run လို့ ဒါတွေကို သုံးလို့ မရပါဘူး။ AddButton ဖိုင်က အခု အလွတ်ပါ။
      [[mark:type-use-client]] ပထမ စာကြောင်းက use client directive ပါ၊ directive
      ဆိုတာ ဖိုင်ထိပ်က bundler အတွက် ညွှန်ကြားချက်ပါ။ ဒီ ဖိုင်နဲ့ သူ့ import တွေ
      browser မှာလည်း run မယ်လို့ ပြောတာပါ၊ ဒီလို ဖိုင်ထဲက component ကို Client
      Component လို့ ခေါ်ပါတယ်။ [[mark:type-addbutton]] ကျန်တာက lesson 3 က like
      ခလုတ်လိုပါပဲ။ အရေအတွက်ကို state ထဲ ထားပြီး၊ နှိပ်လိုက်တိုင်း တစ်ပွဲ
      တိုးပြီး၊ အဲဒီ ဟင်းလျာရဲ့ စုစုပေါင်း ဈေးကို ပြပေးပါတယ်။
      [[mark:open-app-wire]] App ဆီ ပြန်ရအောင်။ [[mark:wire-add-import]] Server
      Component က Client Component ကို import လုပ်နိုင်ပါတယ်။
      [[mark:wire-add-use]] ဒါကြောင့် ဟင်းလျာ row တိုင်းမှာ AddButton တစ်ခုစီ
      ထည့်ပြီး၊ id နဲ့ ဈေးကို props အနေနဲ့ ပေးလိုက်ပါတယ်။ [[mark:click-add]]
      မုန့်ဟင်းခါး နှစ်ပွဲ ထည့်ကြည့်ရအောင်။ [[mark:after-add]] server ဆီ request
      မပို့ဘဲ၊ အရေအတွက်နဲ့ စုစုပေါင်းက ချက်ချင်း ပြောင်းသွားပါတယ်။ browser ထဲမှာ
      run နေတာက ဒီ AddButton ခလုတ်တွေပဲ ဖြစ်ပါတယ်။
    sources:
      - title: "React — 'use client'"
        url: "https://react.dev/reference/rsc/use-client"
      - title: "React — State: A Component's Memory"
        url: "https://react.dev/learn/state-a-components-memory"
    actions:
      - id: open-addbutton
        type: workspace.openFile
        at: { mark: open-addbutton }
        path: src/AddButton.jsx
      - id: type-use-client
        type: editor.type
        at: { mark: type-use-client }
        cadence: fast-explainer
        target: { file: src/AddButton.jsx, after: "", occurrence: 1 }
        text: "\"use client\";\n"
      - id: type-addbutton
        type: editor.type
        at: { mark: type-addbutton }
        cadence: line-by-line
        target: { file: src/AddButton.jsx, after: "\"use client\";\n", occurrence: 1 }
        text: "import { useState } from \"react\";\n\nexport function AddButton({ id, price }) {\n  const [count, setCount] = useState(0);\n  return (\n    <button data-testid={\"add-\" + id} onClick={() => setCount(count + 1)}>\n      + {count} ({(count * price).toLocaleString(\"en-US\")} ကျပ်)\n    </button>\n  );\n}\n"
      - id: open-app-wire
        type: workspace.openFile
        at: { mark: open-app-wire, offsetMs: 400 }
        path: src/App.jsx
      - id: wire-add-import
        type: editor.type
        at: { mark: wire-add-import }
        cadence: block
        target:
          {
            file: src/App.jsx,
            after: "import { getMenu, getOrders } from \"./db.js\";\n",
            occurrence: 1,
          }
        text: "import { AddButton } from \"./AddButton.jsx\";\n"
      - id: wire-add-use
        type: editor.type
        at: { mark: wire-add-use }
        cadence: block
        target:
          { file: src/App.jsx, after: "                <span>{dish.name}</span>\n", occurrence: 1 }
        text: "                <AddButton id={dish.id} price={dish.price} />\n"
      - id: expect-add-zero
        type: expect.preview
        at: { afterAction: wire-add-use }
        timeoutMs: 5000
        target: { by: testId, value: add-mohinga }
        textContains: "+ 0"
        retry: { maxAttempts: 3, delayMs: 1000 }
      - id: click-add-1
        type: preview.click
        at: { mark: click-add }
        timeoutMs: 5000
        target: { by: testId, value: add-mohinga }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: click-add-2
        type: preview.click
        at: { mark: click-add, offsetMs: 1000 }
        timeoutMs: 5000
        target: { by: testId, value: add-mohinga }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-add-two
        type: expect.preview
        at: { mark: after-add }
        timeoutMs: 5000
        target: { by: testId, value: add-mohinga }
        textContains: "+ 2 (5,000 ကျပ်)"
        retry: { maxAttempts: 3, delayMs: 400 }

  # ------------------------------------------------------------------ 5
  - id: client-boundary
    narration: >
      [[mark:draw-boundary]] ခုနက ဖြစ်သွားတာကို ပုံနဲ့ ကြည့်ရအောင်။ App က server
      ပေါ်မှာ run ပြီး၊ AddButton ကစပြီး code က browser ဘက် ကူးသွားပါတယ်။ အဲဒီ
      နေရာကို use client boundary လို့ ခေါ်ပါတယ်။ [[mark:draw-props]] boundary ကို
      ဖြတ်တဲ့ prop တိုင်း serializable ဖြစ်ရပါမယ်၊ ဆိုလိုတာက network နဲ့ ပို့လို့
      ရတဲ့ data ပါ။ string၊ ကိန်းဂဏန်း၊ array၊ plain object၊ promise တောင် ရပါတယ်။
      [[mark:draw-no-functions]] သာမန် function ကတော့ ကူးလို့ မရပါဘူး၊ သူ့ code က
      server ပေါ်မှာ ကျန်နေလို့ပါ။ ခြွင်းချက်ကတော့ နောက်မှ ရေးမယ့် Server Function
      လို function တွေပါ။ [[mark:draw-ssr-too]] ပြီးတော့ Client Component ကိုလည်း
      server မှာ HTML အဖြစ် အရင် render လုပ်ပါတယ်။ ပြီးမှ browser ထဲက React က
      ဆက်ယူလို့ click တွေ အလုပ်လုပ်လာတာပါ။
    sources:
      - title: "React — 'use client': serializable types"
        url: "https://react.dev/reference/rsc/use-client#serializable-types"
      - title: "React — Directives"
        url: "https://react.dev/reference/rsc/directives"
    actions:
      - id: draw-boundary
        type: whiteboard.apply
        at: { mark: draw-boundary }
        open: true
        maximized: true
        clear: true
        upsertIds: [b3-title, b3-app-box, b3-app-text, b3-btn-box, b3-btn-text]
        drawMs: 2000
      - id: draw-props
        type: whiteboard.apply
        at: { mark: draw-props }
        upsertIds: [b3-arrow, b3-props, b3-ok]
        drawMs: 2000
      - id: draw-no-functions
        type: whiteboard.apply
        at: { mark: draw-no-functions }
        upsertIds: [b3-no]
        drawMs: 1200
      - id: draw-ssr-too
        type: whiteboard.apply
        at: { mark: draw-ssr-too }
        upsertIds: [b3-ssr]
        drawMs: 1400

  # ------------------------------------------------------------------ 6
  - id: server-functions
    chapter: "Server Function နဲ့ 'use server'"
    narration: >
      [[mark:draw-sf-title]] အခု ပြောင်းပြန် ဘက်ကို ကြည့်ရအောင်။ order
      သိမ်းပေးပါလို့ browser က server ကို ဘယ်လို ပြောမလဲ။ [[mark:draw-sf-mark]]
      Server Function နဲ့ ပြောလို့ ရပါတယ်။ use server directive က browser က
      ခေါ်ခွင့် ရှိတဲ့ async function တွေကို အမှတ်အသား လုပ်ပါတယ်။
      [[mark:draw-sf-flow]] browser က အဲဒီ function ကို ခေါ်ရင်၊ React က server ဆီ
      request ပို့ပြီး function ကို server ပေါ်မှာ run ပါတယ်။ ဒီ app မှာတော့
      return value ရော၊ ပြန် render လုပ်ထားတဲ့ page ရော ပြန်ရောက်လာပါတယ်။
      [[mark:draw-sf-form]] form ရဲ့ action ထဲ ထည့်ရင်တော့၊ browser က form ကို
      သာမန်အတိုင်း submit လုပ်နိုင်လို့ JavaScript မရောက်ခင်မှာတောင်
      အလုပ်လုပ်ပါတယ်။ [[mark:draw-sf-validate]] အဲဒီ request ကို ဘယ်သူမဆို
      ပို့လို့ ရတဲ့အတွက်၊ argument တွေကို server မှာ အမြဲ စစ်ပါ။
    sources:
      - title: "React — Server Functions"
        url: "https://react.dev/reference/rsc/server-functions"
      - title: "React — 'use server'"
        url: "https://react.dev/reference/rsc/use-server"
    actions:
      - id: draw-sf-title
        type: whiteboard.apply
        at: { mark: draw-sf-title }
        clear: true
        upsertIds: [b4-title]
      - id: draw-sf-mark
        type: whiteboard.apply
        at: { mark: draw-sf-mark }
        upsertIds: [b4-mark]
        drawMs: 1400
      - id: draw-sf-flow
        type: whiteboard.apply
        at: { mark: draw-sf-flow }
        upsertIds:
          [
            b4-browser-label,
            b4-browser-box,
            b4-browser-text,
            b4-arrow-go,
            b4-req,
            b4-server-label,
            b4-server-box,
            b4-server-text,
            b4-back,
          ]
        drawMs: 3600
      - id: draw-sf-form
        type: whiteboard.apply
        at: { mark: draw-sf-form }
        upsertIds: [b4-form]
        drawMs: 1400
      - id: draw-sf-validate
        type: whiteboard.apply
        at: { mark: draw-sf-validate }
        upsertIds: [b4-validate]
        drawMs: 1200

  # ------------------------------------------------------------------ 7
  - id: server-function-code
    narration: >
      [[mark:close-board-sf]] ကဲ၊ editor ထဲမှာ Server Function တစ်ခု ကိုယ်တိုင်
      ရေးကြည့်ရအောင်။ [[mark:open-actions]] ဒါက actions ဖိုင်ပါ။
      [[mark:type-use-server]] သူက use server နဲ့ စလို့၊ သူ export လုပ်တဲ့
      function တိုင်း Server Function ဖြစ်သွားပါတယ်။ [[mark:type-place-order]]
      placeOrder က lesson 10 က useActionState ရဲ့ action အတိုင်းပဲ၊ အရင် state နဲ့
      form data ကို ရပါတယ်။ ရွေးလိုက်တဲ့ ဟင်းလျာကို server ပေါ်မှာ သိမ်းပြီး၊
      message တစ်ခု ပြန်ပေးပါတယ်။ [[mark:select-check]] ဒီ စစ်တဲ့ စာကြောင်းက ခုနက
      board ပေါ်က အကြံပြုချက်ပါ။ form data က browser ကနေ လာလို့၊ ဟင်းလျာက server
      ရဲ့ menu ထဲမှာ တကယ် ရှိမရှိ အရင် စစ်ပါတယ်။ [[mark:open-orderform]]
      နောက်တစ်ခုက form ပါ။ hook တစ်ခု လိုတဲ့အတွက် Client Component ဖြစ်ရပါမယ်။
      [[mark:type-orderform-head]] placeOrder ကို server ဖိုင်ကနေ တိုက်ရိုက်
      import လုပ်ပါတယ်။ browser ဘက်မှာတော့ server ကို ခေါ်ပေးမယ့် reference လေး
      တစ်ခုပဲ ရပါတယ်။ [[mark:type-orderform-state]] useActionState က Server
      Function ကို ထုပ်ပေးပါတယ်၊ lesson 10 က client action လိုပါပဲ။
      [[mark:type-orderform-jsx]] form က prop ထဲက ဟင်းလျာ စာရင်းကို ရွေးစရာ list
      အဖြစ် ပြပြီး၊ lesson 10 လိုပဲ label နဲ့ ထုပ်ထားပါတယ်။ မှာမယ့် ခလုတ်ကို
      request pending ဖြစ်နေတုန်း ပိတ်ထားပြီး၊ အောက်မှာ server က ပြန်ပို့တဲ့
      message ကို ပြပါတယ်။
    sources:
      - title: "React — 'use server'"
        url: "https://react.dev/reference/rsc/use-server"
      - title: "React — useActionState"
        url: "https://react.dev/reference/react/useActionState"
      - title: "MDN — FormData.get()"
        url: "https://developer.mozilla.org/en-US/docs/Web/API/FormData/get"
    actions:
      - id: close-board-sf
        type: whiteboard.apply
        at: { mark: close-board-sf }
        open: false
      - id: open-actions
        type: workspace.openFile
        at: { mark: open-actions }
        path: src/actions.js
      - id: type-use-server
        type: editor.type
        at: { mark: type-use-server }
        cadence: fast-explainer
        target: { file: src/actions.js, after: "", occurrence: 1 }
        text: "\"use server\";\n"
      - id: type-place-order
        type: editor.type
        at: { mark: type-place-order }
        cadence: line-by-line
        target: { file: src/actions.js, after: "\"use server\";\n", occurrence: 1 }
        text: "import { addOrder, getMenu } from \"./db.js\";\n\nexport async function placeOrder(previousState, formData) {\n  const dish = formData.get(\"dish\");\n  const menu = await getMenu();\n  if (!menu.some((item) => item.name === dish)) return \"ဟင်းလျာ ရွေးပါ\";\n  addOrder(dish);\n  return dish + \" မှာပြီးပါပြီ\";\n}\n"
      - id: select-check
        type: editor.select
        at: { mark: select-check }
        target:
          {
            file: src/actions.js,
            text: 'if (!menu.some((item) => item.name === dish)) return "ဟင်းလျာ ရွေးပါ";',
            occurrence: 1,
          }
      - id: open-orderform
        type: workspace.openFile
        at: { mark: open-orderform }
        path: src/OrderForm.jsx
      - id: type-orderform-head
        type: editor.type
        at: { mark: type-orderform-head }
        cadence: line-by-line
        target: { file: src/OrderForm.jsx, after: "", occurrence: 1 }
        text: "\"use client\";\nimport { useActionState } from \"react\";\nimport { placeOrder } from \"./actions.js\";\n"
      - id: type-orderform-state
        type: editor.type
        at: { mark: type-orderform-state }
        cadence: line-by-line
        target:
          {
            file: src/OrderForm.jsx,
            after: "import { placeOrder } from \"./actions.js\";\n",
            occurrence: 1,
          }
        text: "\nexport function OrderForm({ dishes }) {\n  const [message, formAction, isPending] = useActionState(placeOrder, \"\");\n"
      - id: type-orderform-jsx
        type: editor.type
        at: { mark: type-orderform-jsx }
        cadence: line-by-line
        target:
          { file: src/OrderForm.jsx, after: "useActionState(placeOrder, \"\");\n", occurrence: 1 }
        text: "  return (\n    <form action={formAction} className=\"card\">\n      <label>\n        ဟင်းလျာ\n        <select name=\"dish\" data-testid=\"order-dish\">\n          {dishes.map((dish) => (\n            <option key={dish}>{dish}</option>\n          ))}\n        </select>\n      </label>\n      <button data-testid=\"submit-order\" disabled={isPending}>မှာမယ်</button>\n      <p data-testid=\"order-message\">{message}</p>\n    </form>\n  );\n}\n"

  # ------------------------------------------------------------------ 8
  - id: order-round-trip
    narration: >
      [[mark:open-app-form]] App ဆီ ထပ် ပြန်ရအောင်။ [[mark:wire-form-import]] form
      ကို အရင် import လုပ်ပါတယ်။ [[mark:wire-form-use]] ပြီးတော့ menu အောက်မှာ
      render လုပ်ပါတယ်။ သူ့ prop က ဟင်းလျာ နာမည်တွေရဲ့ string array ဖြစ်လို့
      boundary ကို ဖြတ်လို့ ရပါတယ်။ [[mark:pick-dish]] ရှမ်းခေါက်ဆွဲကို
      ရွေးရအောင်။ [[mark:submit-order]] ပြီးရင် မှာလိုက်ရအောင်။
      [[mark:after-order]] message က Server Function ဆီကနေ ပြန်ရောက်လာပါပြီ။
      [[mark:check-count]] client state မသုံးဘဲ မှာထားတဲ့ အရေအတွက်ကလည်း 1
      ဖြစ်သွားပါပြီ။ server က App ကို ပြန် render လုပ်ပြီး ရလဒ်ကို
      ပို့ပေးလိုက်လို့ပါ။ [[mark:check-kept]] ကိုယ့် မုန့်ဟင်းခါး နှစ်ပွဲကလည်း
      ရှိနေပါသေးတယ်၊ React က browser ထဲက state ကို ဆက်မှတ်ထားလို့ပါ။ ဒီ နှစ်ပွဲကို
      server က မသိလို့၊ မှာထားတဲ့ အရေအတွက်ထဲ မပါပါဘူး။
    sources:
      - title: "React — Server Functions with forms"
        url: "https://react.dev/reference/rsc/server-functions"
      - title: "React — <form>"
        url: "https://react.dev/reference/react-dom/components/form"
      - title: "MDN — <select>"
        url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Element/select"
    actions:
      - id: open-app-form
        type: workspace.openFile
        at: { mark: open-app-form, offsetMs: 400 }
        path: src/App.jsx
      - id: wire-form-import
        type: editor.type
        at: { mark: wire-form-import }
        cadence: block
        target:
          {
            file: src/App.jsx,
            after: "import { AddButton } from \"./AddButton.jsx\";\n",
            occurrence: 1,
          }
        text: "import { OrderForm } from \"./OrderForm.jsx\";\n"
      - id: wire-form-use
        type: editor.type
        at: { mark: wire-form-use }
        cadence: block
        target: { file: src/App.jsx, after: "          </ul>\n", occurrence: 1 }
        text: "          <OrderForm dishes={menu.map((dish) => dish.name)} />\n"
      - id: expect-form
        type: expect.preview
        at: { afterAction: wire-form-use }
        timeoutMs: 5000
        target: { by: testId, value: submit-order }
        textContains: "မှာမယ်"
        retry: { maxAttempts: 3, delayMs: 1000 }
      - id: pick-dish
        type: preview.input
        at: { mark: pick-dish }
        timeoutMs: 5000
        target: { by: testId, value: order-dish }
        value: "ရှမ်းခေါက်ဆွဲ"
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-picked
        type: expect.preview
        at: { afterAction: pick-dish }
        timeoutMs: 5000
        target: { by: testId, value: order-dish }
        value: "ရှမ်းခေါက်ဆွဲ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: submit-order
        type: preview.click
        at: { mark: submit-order }
        timeoutMs: 5000
        target: { by: testId, value: submit-order }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-message
        type: expect.preview
        at: { mark: after-order }
        timeoutMs: 5000
        target: { by: testId, value: order-message }
        textContains: "ရှမ်းခေါက်ဆွဲ မှာပြီးပါပြီ"
        retry: { maxAttempts: 3, delayMs: 1000 }
      - id: expect-one-order
        type: expect.preview
        at: { mark: check-count }
        timeoutMs: 5000
        target: { by: testId, value: order-count }
        textContains: "မှာထားတာ 1 ခု"
        retry: { maxAttempts: 3, delayMs: 1000 }
      - id: expect-kept
        type: expect.preview
        at: { mark: check-kept }
        timeoutMs: 5000
        target: { by: testId, value: add-mohinga }
        textContains: "+ 2 (5,000 ကျပ်)"
        retry: { maxAttempts: 3, delayMs: 400 }

  # ------------------------------------------------------------------ 9
  - id: streaming
    chapter: "Suspense နဲ့ streaming"
    narration: >
      [[mark:open-specials]] နောက်ဆုံးက နှေးနှေး ရောက်လာမယ့် ဒီနေ့ အထူး ဟင်းလျာပါ။
      [[mark:type-specials]] async Server Component ဖြစ်လို့ directive မလိုပါဘူး။
      နှေးတဲ့ database လိုပဲ ငါးစက္ကန့် လောက် စောင့်ပြီးမှ ပြန်ပေးပါတယ်။
      [[mark:open-app-specials]] App ပြန်ရအောင်။ [[mark:wire-specials-import]]
      Suspense နဲ့ Specials ကို import လုပ်ပါတယ်။ ပြီးရင် ညာဘက်က preview ကို
      သတိထား ကြည့်ထားပါ။ [[mark:wire-specials-use]] ပြီးတော့ Specials ကို Suspense
      boundary ထဲ ထည့်ပါတယ်။ [[mark:after-specials]] ကြည့်ပါ၊ ခဏစောင့်ပါ ဆိုတဲ့
      fallback အရင် ပေါ်ပြီး၊ ပြီးမှ အထူး ဟင်းလျာ ရောက်လာပါတယ်။ lesson 9 က
      Suspense ပါပဲ၊ စောင့်နေတာက server ပေါ်က component ဖြစ်သွားတာပဲ ကွာပါတယ်။
      တကယ့် page မှာလည်း server က boundary အထိ HTML ကို အရင် ပို့ပြီး ကျန်တာကို
      နောက်မှ ဆက်ပို့လို့၊ page တစ်ခုလုံး မစောင့်ရပါဘူး။ ဒါကို streaming လို့
      ခေါ်ပါတယ်။
    sources:
      - title: "React — <Suspense>"
        url: "https://react.dev/reference/react/Suspense"
      - title: "React — Server Components: async components"
        url: "https://react.dev/reference/rsc/server-components"
    actions:
      - id: open-specials
        type: workspace.openFile
        at: { mark: open-specials }
        path: src/Specials.jsx
      - id: type-specials
        type: editor.type
        at: { mark: type-specials }
        cadence: line-by-line
        target: { file: src/Specials.jsx, after: "", occurrence: 1 }
        text: "export async function Specials() {\n  await new Promise((resolve) => setTimeout(resolve, 5000));\n  return <p data-testid=\"specials\">ဒီနေ့ အထူး – လက်ဖက်သုပ်</p>;\n}\n"
      - id: open-app-specials
        type: workspace.openFile
        at: { mark: open-app-specials, offsetMs: 400 }
        path: src/App.jsx
      - id: wire-specials-import
        type: editor.type
        at: { mark: wire-specials-import }
        cadence: block
        target:
          {
            file: src/App.jsx,
            after: "import { OrderForm } from \"./OrderForm.jsx\";\n",
            occurrence: 1,
          }
        text: "import { Suspense } from \"react\";\nimport { Specials } from \"./Specials.jsx\";\n"
      - id: wire-specials-use
        type: editor.type
        at: { mark: wire-specials-use }
        cadence: block
        target:
          {
            file: src/App.jsx,
            after: "          <OrderForm dishes={menu.map((dish) => dish.name)} />\n",
            occurrence: 1,
          }
        text: "          <Suspense fallback={<p className=\"muted\" data-testid=\"specials-wait\">ခဏစောင့်ပါ...</p>}>\n            <Specials />\n          </Suspense>\n"
      # The fallback is on screen for ~5 s after the refresh lands; prove it
      # showed first, then that the special replaced it. expect-specials'
      # retries span 6 s and its timeoutMs (the performer's deadline for the
      # whole retry loop) covers all three attempts: at 55 ms/char the mark
      # lands ~3.3 s after the insert, before the special exists.
      - id: expect-specials-wait
        type: expect.preview
        at: { afterAction: wire-specials-use }
        timeoutMs: 5000
        target: { by: testId, value: specials-wait }
        textContains: "ခဏစောင့်ပါ"
        retry: { maxAttempts: 3, delayMs: 1000 }
      - id: expect-specials
        type: expect.preview
        at: { mark: after-specials }
        timeoutMs: 8000
        target: { by: testId, value: specials }
        textContains: "လက်ဖက်သုပ်"
        retry: { maxAttempts: 3, delayMs: 3000 }

  # ------------------------------------------------------------------ 10
  - id: recap
    chapter: "ပြန်ချုပ်ရအောင်"
    narration: >
      [[mark:draw-recap-title]] ဒါဆို ပြန်ချုပ်ကြည့်ရအောင်။
      [[mark:draw-recap-server]] directive မပါတဲ့ component တွေက default အားဖြင့်
      Server Component ပါ၊ code ကို browser ဆီ မပို့ပါဘူး။ use client ဖိုင်က
      import လုပ်ရင်တော့ Client Component ဖြစ်သွားပါတယ်။
      [[mark:draw-recap-client]] use client ဖိုင်ထဲက Client Component တွေကိုတော့
      server မှာ HTML အရင် ထုတ်ပြီး၊ browser ထဲမှာ ဆက် run ပါတယ်။
      [[mark:draw-recap-sf]] use server ကတော့ browser က request နဲ့ ခေါ်တဲ့ Server
      Function တွေကို အမှတ်အသား လုပ်ပါတယ်။ [[mark:draw-recap-more]] framework တွေက
      ဒီမှာ run မပြတဲ့ server API တွေကိုလည်း သုံးပါတယ်။ cacheSignal က render
      ပြီးရင် မလိုတော့တဲ့ အလုပ်ကို ရပ်ခိုင်းပြီး၊ prerender က page ကို static HTML
      အဖြစ် ကြိုထုတ်ပါတယ်။ [[mark:draw-recap-ppr]] React 19.2 က partial
      prerendering ကတော့ မပြောင်းတဲ့ အပိုင်းကို ကြိုထုတ်ထားပြီး၊ ပြောင်းတဲ့
      အပိုင်းကို request တိုင်းမှာ နောက်မှ ဖြည့်ပါတယ်။ [[mark:draw-recap-next]]
      နောက်ဆုံး lesson မှာတော့ React 19.3 ရဲ့ feature အသစ်တွေကို ဒီ app ပေါ်မှာ
      ကြည့်ပြီး၊ course တစ်ခုလုံးကို ပြန်လှည့်ကြည့်ပါမယ်။
    sources:
      - title: "React — Directives"
        url: "https://react.dev/reference/rsc/directives"
      - title: "React — cacheSignal"
        url: "https://react.dev/reference/react/cacheSignal"
      - title: "React — prerender"
        url: "https://react.dev/reference/react-dom/static/prerender"
      - title: "React 19.2"
        url: "https://react.dev/blog/2025/10/01/react-19-2"
    actions:
      - id: draw-recap-title
        type: whiteboard.apply
        at: { mark: draw-recap-title }
        open: true
        maximized: true
        clear: true
        upsertIds: [b5-title]
      - id: expect-file-app
        type: expect.file
        at: { afterAction: draw-recap-title }
        path: src/App.jsx
        contains: "<AddButton id={dish.id} price={dish.price} />"
      - id: expect-file-app-form
        type: expect.file
        at: { afterAction: expect-file-app }
        path: src/App.jsx
        contains: "<OrderForm dishes={menu.map((dish) => dish.name)} />"
      - id: expect-file-app-suspense
        type: expect.file
        at: { afterAction: expect-file-app-form }
        path: src/App.jsx
        contains: "            <Specials />\n          </Suspense>"
      - id: expect-file-addbutton
        type: expect.file
        at: { afterAction: expect-file-app-suspense }
        path: src/AddButton.jsx
        contains: "\"use client\";\nimport { useState } from \"react\";"
      - id: expect-file-actions
        type: expect.file
        at: { afterAction: expect-file-addbutton }
        path: src/actions.js
        contains: "\"use server\";\nimport { addOrder, getMenu } from \"./db.js\";"
      - id: expect-file-orderform
        type: expect.file
        at: { afterAction: expect-file-actions }
        path: src/OrderForm.jsx
        contains: 'useActionState(placeOrder, "")'
      - id: expect-file-specials
        type: expect.file
        at: { afterAction: expect-file-orderform }
        path: src/Specials.jsx
        contains: "export async function Specials()"
      - id: draw-recap-server
        type: whiteboard.apply
        at: { mark: draw-recap-server }
        upsertIds: [b5-server]
        drawMs: 1400
      - id: draw-recap-client
        type: whiteboard.apply
        at: { mark: draw-recap-client }
        upsertIds: [b5-client]
        drawMs: 1400
      - id: draw-recap-sf
        type: whiteboard.apply
        at: { mark: draw-recap-sf }
        upsertIds: [b5-sf]
        drawMs: 1400
      - id: draw-recap-more
        type: whiteboard.apply
        at: { mark: draw-recap-more }
        upsertIds: [b5-more-title, b5-more-underline, b5-more]
        drawMs: 1800
      - id: draw-recap-ppr
        type: whiteboard.apply
        at: { mark: draw-recap-ppr }
        upsertIds: [b5-ppr]
        drawMs: 1000
      - id: draw-recap-next
        type: whiteboard.apply
        at: { mark: draw-recap-next }
        upsertIds: [b5-next]
        drawMs: 1000

checks:
  - { type: timing.p95Ms, max: 300 }
