        .card > button {
          justify-self: start;
        }
      src/App.jsx: |
        import { getMenu, getOrders } from "./db.js";
        import "./styles.css";

        export default async function App() {
          const menu = await getMenu();
          const orders = getOrders();
          return (
            <html lang="my">
              <head>
                <meta charSet="UTF-8" />
                <meta name="viewport" content="width=device-width, initial-scale=1.0" />
                <title>ရွှေရန်ကုန် မုန့်ဟင်းခါးဆိုင်</title>
