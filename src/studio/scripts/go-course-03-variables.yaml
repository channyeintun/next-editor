# Go course, lesson 03: variables and types (Burmese; the second pilot lesson).
#
# Start state: main.go with `package main`, `import "fmt"` and an empty `func main`.
# Edits, all insert-only:
#   1. name, age, city with := and a Println of name and city only -> run-1: compile error
#      `./main.go:7:2: declared and not used: age`;
#   2. `age, ` into that Println, then phone (a string of digits) and its Println -> run-2:
#      အောင်အောင် 21 မန္တလေး / 09000111222;
#   3. `var savings int`, `var isStudent bool` and a Println (zero values), then
#      `isStudent = true` and the same Println -> run-3 adds 0 false / 0 true.
# Boards: (V) a variable is a labelled box: label = name, value inside, shape = type, := vs =,
# the type is fixed; (K) names and numbers in code on the English keyboard, Burmese inside quotes
# (both errors said, not run); (Z) the three zero values and the three ways to declare; (Q) quiz.
# Fixtures: bun ~/Documents/go-course-work/tools/sim-go.ts <this yaml> --write
schemaVersion: 1

