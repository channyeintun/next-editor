# Go course, lesson 11: slices (Burmese).
#
# Start state: main.go with `package main`, `import "fmt"` and an empty `func main`.
# Edits, all insert-only:
#   1. `cities := []string{…}` (ရန်ကုန်, နေပြည်တော်, မန္တလေး) and a range loop printing index and
#      city -> run-1: 0 ရန်ကုန် / 1 နေပြည်တော် / 2 မန္တလေး;
#   2. `fmt.Println(cities[len(cities)])` right under the declaration (nothing printed before it)
#      -> run-2: panic `index out of range [3] with length 3` at main.go:7;
#   3. `// ` in front of that line; `cities = append(…, "ပြင်ဦးလွင်")`; `km := []int{320, 270}`,
#      `km = append(km, 70)` and a total with range; one Println with len, the last city and
#      the total -> run-3 adds 4 ပြင်ဦးလွင် 660 ကီလိုမီတာ.
# Boards: (B) bus seats numbered from 0, len, the last index, then the seat after the last that
# does not exist (drawn again at the panic); (A) append gives back the longer slice, so assign it
# back; a bare append is refused (said/board); (Q) quiz (index 2 of three).
# Fixtures: bun ~/Documents/go-course-work/tools/sim-go.ts <this yaml> --write
schemaVersion: 1

