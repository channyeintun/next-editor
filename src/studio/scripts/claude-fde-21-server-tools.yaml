      package.json: |
        {
          "name": "fde-notebook",
          "private": true,
          "version": "1.0.0",
          "scripts": {
            "dev": "echo concept lesson: nothing to run"
          }
        }
      reply-assistant/src/research.ts: |
        import Anthropic from "@anthropic-ai/sdk";

        const client = new Anthropic();

        // Network Tools: read the router vendor's public firmware notes (placeholder domain).
        export async function firmwareNotes(question: string) {
          return client.messages.create({
            model: "claude-opus-5-5", // ID as of 2026-11
            max_tokens: 16000,
            messages: [{ role: "user", content: question }],
            tools: [
            ],
          });
        }

        // Network Tools: one month of outage log lines that our code exported from the NMS.
        export async function outageAnalysis(logCsv: string) {
          return client.messages.create({
            model: "claude-opus-5-5", // ID as of 2026-11
            max_tokens: 16000,
            messages: [{ role: "user", content: `Which townships had the most outages, and when?\n${logCsv}` }],
            tools: [
            ],
          });
        }
