build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 2613

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  - id: intro
    chapter: "ဖတ်ရလွယ်တဲ့ စာသား ဆိုတာ"
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ animation တွေကို user က လျှော့လို့၊ ရပ်လို့ ရအောင် လုပ်ခဲ့ပါတယ်။ ဒီ
      lesson မှာတော့ ဆိုင်ရဲ့ စာသားတွေကို လူတိုင်း ဖတ်ရလွယ်အောင် ပြင်ကြည့်ပါမယ်။
      [[mark:start-server]] စာလုံးကို မြင်ရတာနဲ့ အဆင်ပြေပြေ ဖတ်နိုင်တာ မတူပါဘူး။ [[mark:draw-who]]
      အမြင် အားနည်းတဲ့ မြမြ၊ dyslexia ရှိတဲ့ မောင်မောင်၊ အာရုံ ကြာကြာ စူးစိုက်ရ ခက်တဲ့ ADHD
      ရှိသူတွေ အတွက်ဆိုရင်၊ font ပုံစံ၊ စာလုံး အရွယ်၊ စာကြောင်းကြားက နေရာလွတ်လို အသေးအဖွဲ ထင်ရတဲ့
      အချက်တွေက ဖတ်နိုင်မနိုင်ကို ဆုံးဖြတ်ပါတယ်။ နေပူထဲမှာ ဖုန်းကြည့်နေရတဲ့သူ၊ မိခင်ဘာသာ မဟုတ်တဲ့
      စာကို ဖတ်နေရတဲ့သူတွေလည်း အကျိုး ရပါတယ်။ [[mark:draw-areas]] ဒီ lesson မှာ font ရွေးတာ၊
      စာလုံး အရွယ်အစား၊ နေရာလွတ်နဲ့ layout ဆိုတဲ့ အချက် လေးချက်ကို ဆိုင်ရဲ့ page ပေါ်မှာ တကယ်
      ပြင်ရင်း ကြည့်သွားပါမယ်။
    sources:
      - title: "web.dev Learn Accessibility — Typography"
        url: "https://web.dev/learn/accessibility/typography"
      - title: "W3C WAI — Diverse abilities and barriers (cognitive, learning, and neurological)"
        url: "https://www.w3.org/WAI/people-use-web/abilities-barriers/cognitive/"
    actions:
      - id: open-intro-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [b1-title]
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-who
        type: whiteboard.apply
        at: { mark: draw-who }
        upsertIds: [b1-who-1, b1-who-2, b1-who-3, b1-who-4, b1-who-5]
        drawMs: 2500
      - id: draw-areas
        type: whiteboard.apply
        at: { mark: draw-areas }
        upsertIds:
          [b1-box-1, b1-area-1, b1-box-2, b1-area-2, b1-box-3, b1-area-3, b1-box-4, b1-area-4]
        drawMs: 3200

  - id: code-tour
    narration: >
      [[mark:close-intro]] ကဲ၊ code ကို ကြည့်ရအောင်။ [[mark:open-theme]] ဒါက ဆိုင်ရဲ့ စာလုံး
      ပုံစံတွေကို သတ်မှတ်ထားတဲ့ theme ဖိုင်ပါ။ အင်္ဂလိပ် website အတွက် ရေးထားတဲ့ theme ကို
      ယူသုံးထားလို့ မြန်မာစာကို မစဉ်းစားထားပါဘူး။ [[mark:select-body]] ဒီ body rule က page
      တစ်ခုလုံးကို အင်္ဂလိပ် serif font နဲ့၊ pixel နဲ့ ပုံသေ ပေးထားတဲ့ စာလုံး အသေးနဲ့၊ ကျဉ်းကျဉ်း
      line height နဲ့ ပြခိုင်းထားပါတယ်။ [[mark:select-story]] ဒီ rule က ဆိုင်အကြောင်း စာပိုဒ်ကို
      ဘယ်ညာ နှစ်ဖက် ညီအောင် justify လုပ်ထားပြီး၊ အောက်က rule တွေမှာ လက်ရေး font၊ စာလုံးကြီး
      အကုန်နဲ့ စာလုံးစောင်းတွေ ပါပါတယ်။ ဒီ ဖိုင်ကို ကိုယ်တို့ မထိပါဘူး။ [[mark:open-styles]]
      ကိုယ့် CSS ဖိုင်ကို theme ရဲ့ နောက်မှာ ချိတ်ထားလို့၊ ဒီထဲမှာ ရေးတဲ့ rule က theme ထဲက
      selector တူတဲ့ rule ကို အနိုင်ယူပါတယ်။ [[mark:preview]] ညာဘက်မှာ ဆိုင်ရဲ့ page ကို
      မြင်ရပါပြီ။ စာလုံးတွေ သေးနေပြီး၊ မြန်မာ စာကြောင်းတွေ တစ်ကြောင်းနဲ့ တစ်ကြောင်း ကပ်နေတာကို
      သတိထား ကြည့်ပါ။
    sources:
      - title: "web.dev Learn Accessibility — Typography"
        url: "https://web.dev/learn/accessibility/typography"
      - title: "MDN — Introducing the CSS cascade (source order)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/Cascade"
    actions:
      - id: close-intro
        type: whiteboard.apply
        at: { mark: close-intro }
        open: false
      - id: open-theme
        type: workspace.openFile
        at: { mark: open-theme }
        path: theme.css
      - id: select-body
        type: editor.select
        at: { mark: select-body }
        target:
          {
            file: theme.css,
            text: "body {\n  font-family: Georgia, \"Times New Roman\", serif;\n  font-size: 13px;\n  line-height: 1.2;\n}",
            occurrence: 1,
          }
      - id: select-story
        type: editor.select
        at: { mark: select-story }
        target: { file: theme.css, text: ".story {\n  text-align: justify;\n}", occurrence: 1 }
      - id: open-styles
        type: workspace.openFile
        at: { mark: open-styles }
        path: styles.css
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { mark: preview }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-dev-server }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-story
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: story }
        textContains: "ဗဟန်းက လမ်းထောင့်လေး"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: collapse-runner-dock
        type: runtime.collapseDock
        at: { afterAction: expect-story }

  - id: font-board
    chapter: "Font ရွေးတာ"
    narration: >
      [[mark:open-font-board]] font ကနေ စကြည့်ရအောင်။ [[mark:draw-common]] လူအများ နေ့တိုင်း
      မြင်နေကျ font တွေကို ပိုမြန်မြန် ဖတ်နိုင်တယ်လို့ လေ့လာမှုတွေက ပြပါတယ်။ font က ပိုကောင်းလို့
      မဟုတ်ဘဲ၊ မျက်စိက ယဉ်ပါးပြီးသား ဖြစ်လို့ပါ။ [[mark:draw-fancy]] လက်ရေး ပုံစံ၊ အလှဆင်ထားတဲ့၊
      မျဉ်း ပါးလွန်းတဲ့ font တွေကတော့ လှပေမယ့်၊ မောင်မောင်လို dyslexia ရှိသူ တော်တော်များများ
      အတွက် ဖတ်ရ အများကြီး ပိုခက်ပါတယ်။ [[mark:draw-shapes]] font တချို့မှာ I အကြီး၊ l အသေးနဲ့ ဂဏန်း တစ် ပုံစံ
      တူနေပြီး၊ b နဲ့ d လို ပြောင်းပြန် စာလုံးတွေကလည်း လွဲဖတ်မိစေပါတယ်။ [[mark:draw-kerning]]
      စာလုံး နှစ်လုံးကြားက အကွာအဝေးကို kerning လို့ ခေါ်ပြီး၊ kerning ကျဉ်းလွန်းရင် r နဲ့ n ကို m
      လို့ ဖတ်မိနိုင်ပါတယ်။ [[mark:draw-myanmar]] မြန်မာစာ
      အတွက်တော့ Unicode font ဖြစ်ဖို့နဲ့၊ စက်အများစုမှာ ပါပြီးသား font တွေကို ရှေ့ဆုံးက ထားဖို့
      အဓိကပါ။
    sources:
      - title: "web.dev Learn Accessibility — Typography: Typeface"
        url: "https://web.dev/learn/accessibility/typography#typeface"
      - title: "University of Michigan Dyslexia Help — Good fonts for dyslexia (study, PDF)"
        url: "http://dyslexiahelp.umich.edu/sites/default/files/good_fonts_for_dyslexia_study.pdf"
      - title: "Richard Ishida (W3C Internationalization) — Burmese orthography notes"
        url: "https://r12a.github.io/scripts/mymr/my.html"
    actions:
      - id: open-font-board
        type: whiteboard.apply
        at: { mark: open-font-board, offsetMs: -300 }
        open: true
        clear: true
        upsertIds: [b2-title]
      - id: draw-common
        type: whiteboard.apply
        at: { mark: draw-common }
        upsertIds: [b2-common, b2-common-check]
        drawMs: 1400
      - id: draw-fancy
        type: whiteboard.apply
        at: { mark: draw-fancy }
        upsertIds: [b2-fancy, b2-fancy-strike]
        drawMs: 1400
      - id: draw-shapes
        type: whiteboard.apply
        at: { mark: draw-shapes }
        upsertIds: [b2-shapes, b2-shapes-label]
        drawMs: 1400
      - id: draw-kerning
        type: whiteboard.apply
        at: { mark: draw-kerning }
        upsertIds: [b2-kerning, b2-kerning-label]
        drawMs: 1200
      - id: draw-myanmar
        type: whiteboard.apply
        at: { mark: draw-myanmar }
        upsertIds: [b2-myanmar-box, b2-myanmar]
        drawMs: 1400

  - id: font-stack
    narration: >
      [[mark:close-font-board]] editor ထဲ ပြန်သွားရအောင်။ [[mark:type-font-stack]] page
      တစ်ခုလုံးအတွက် font စာရင်း အသစ် ပေးပါမယ်။ Android၊ Apple နဲ့ Windows စက်တွေမှာ ပါပြီးသား
      မြန်မာ Unicode font တွေကို ရှေ့က ထားပြီး၊ နောက်ဆုံးမှာ system font ကို ထားပါတယ်။ browser က
      စာရင်းကို ရှေ့ကနေ စစ်ပြီး စက်ထဲမှာ ရှိတဲ့ ပထမဆုံး font ကို သုံးပါတယ်။ [[mark:after-font-stack]] ခုနက theme မှာ
      မြန်မာ font မပါလို့ စက်က တွေ့ရာ font နဲ့ ဖြည့်ပြခဲ့တာပါ။ အခုတော့ ကိုယ် ရွေးထားတဲ့ font နဲ့
      ပြနေပြီး၊ quote ထဲက အင်္ဂလိပ် စာလုံးတွေလည်း serif မဟုတ်တော့ပါဘူး။
    sources:
      - title: "MDN — font-family (font stacks and fallback)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/font-family"
      - title: "Google Fonts — Noto Sans Myanmar"
        url: "https://fonts.google.com/noto/specimen/Noto+Sans+Myanmar"
      - title: "SIL — Padauk font"
        url: "https://software.sil.org/padauk/"
    actions:
      - id: close-font-board
        type: whiteboard.apply
        at: { mark: close-font-board }
        open: false
      - id: type-font-stack
        type: editor.type
        at: { mark: type-font-stack }
        cadence: block
        target: { file: styles.css, after: "", occurrence: 1 }
        text: "body {\n  font-family: \"Noto Sans Myanmar\", \"Myanmar Sangam MN\", \"Myanmar MN\",\n    \"Myanmar Text\", \"Padauk\", system-ui, sans-serif;\n}\n"
      - id: expect-story-font
        type: expect.preview
        at: { mark: after-font-stack }
        timeoutMs: 4000
        target: { by: testId, value: story }
        textContains: "ရွှေလက်ဖက်ရည်ဆိုင်ကို"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: tagline-wifi
    narration: >
      [[mark:type-tagline]] tagline ကိုလည်း လက်ရေး font အစား page ရဲ့ font ကို inherit
      လုပ်ခိုင်းပါမယ်။ [[mark:after-tagline]] ခေါင်းစဉ်အောက်က အင်္ဂလိပ် tagline ဖတ်ရ
      ရှင်းသွားပါပြီ။ [[mark:type-wifi]] Wi-Fi စကားဝှက်မှာတော့ I အကြီးလား၊ l အသေးလား ခွဲမရရင်
      customer က မှားရိုက်မိမှာပါ။ code ရေးဖို့ ဒီဇိုင်း လုပ်ထားတဲ့ monospace font တွေက ဒီလို
      ဆင်တူတဲ့ စာလုံးတွေကို ပုံစံ ကွဲအောင် ဆွဲထားလေ့ ရှိလို့၊ စကားဝှက်ကို monospace font ပေးပါမယ်။ [[mark:after-wifi]] ကြည့်ပါ၊ I၊ l နဲ့ ဂဏန်း တစ် ပုံစံ ကွဲသွားပြီး၊
      O နဲ့ သုညကိုလည်း ခွဲလို့ ရသွားပါပြီ။
    sources:
      - title: "web.dev Learn Accessibility — Typography: Letter characteristics and kerning"
        url: "https://web.dev/learn/accessibility/typography#letter-characteristics-and-kerning"
      - title: "MDN — font-family (generic family monospace)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/font-family#monospace"
    actions:
      - id: type-tagline
        type: editor.type
        at: { mark: type-tagline }
        cadence: block
        target: { file: styles.css, after: "system-ui, sans-serif;\n}\n", occurrence: 1 }
        text: "\n.tagline {\n  font-family: inherit;\n}\n"
      - id: expect-tagline
        type: expect.preview
        at: { mark: after-tagline }
        timeoutMs: 4000
        target: { by: testId, value: tagline }
        textContains: "Yangon"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-wifi
        type: editor.type
        at: { mark: type-wifi }
        cadence: block
        target: { file: styles.css, after: "  font-family: inherit;\n}\n", occurrence: 1 }
        text: "\n.wifi-code {\n  font-family: Menlo, Consolas, monospace;\n}\n"
      - id: expect-wifi
        type: expect.preview
        at: { mark: after-wifi }
        timeoutMs: 4000
        target: { by: testId, value: wifi-code }
        textContains: "Il1O0shwe"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: size-board
    chapter: "စာလုံး အရွယ်အစား"
    narration: >
      [[mark:open-size-board]] နောက်တစ်ချက်က စာလုံး အရွယ်ပါ။ မြမြလို အမြင် အားနည်းသူ
      တော်တော်များများက browser setting မှာ default စာလုံး အရွယ်ကို ကြီးထားပါတယ်။ [[mark:draw-px]]
      စာလုံးကို pixel နဲ့ ပုံသေ ပေးထားရင်တော့ setting ဘယ်လောက် ကြီးကြီး စာလုံးက မပြောင်းပါဘူး။
      [[mark:draw-rem]] rem က root element ရဲ့ စာလုံး အရွယ်ကို အခြေခံတဲ့ unit ဖြစ်လို့၊ setting မပြောင်းရင် ၁ rem က ၁၆ pixel ဖြစ်ပြီး၊ setting ကို ၂၄ pixel ပြောင်းရင် ၁ rem ကလည်း ၂၄ pixel ဖြစ်သွားပါတယ်။
      [[mark:draw-zoom]] browser zoom ကတော့ pixel ကိုပါ ချဲ့ပေးပါတယ်။ level AA မှာ စာကို ၂၀၀
      ရာခိုင်နှုန်းထိ ချဲ့ရင် ဘာမှ မပျောက်ရဘူးလို့ သတ်မှတ်ထားလို့၊ နည်း နှစ်မျိုးလုံးနဲ့
      အဆင်ပြေအောင် rem ကို သုံးပါ။
    sources:
      - title: "web.dev Learn Accessibility — Typography: Font size and typographic styling"
        url: "https://web.dev/learn/accessibility/typography#font-size-and-typographic-styling"
      - title: "W3C — Understanding SC 1.4.4 Resize Text (Level AA)"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/resize-text.html"
      - title: "MDN — CSS values and units: rem"
        url: "https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Styling_basics/Values_and_units"
    actions:
      - id: open-size-board
        type: whiteboard.apply
        at: { mark: open-size-board, offsetMs: -300 }
        open: true
        clear: true
        upsertIds: [b3-title, b3-setting]
      - id: draw-px
        type: whiteboard.apply
        at: { mark: draw-px }
        upsertIds: [b3-px, b3-px-arrow, b3-px-result, b3-px-label]
        drawMs: 2000
      - id: draw-rem
        type: whiteboard.apply
        at: { mark: draw-rem }
        upsertIds: [b3-rem, b3-rem-arrow, b3-rem-result, b3-rem-label]
        drawMs: 2000
      - id: draw-zoom
        type: whiteboard.apply
        at: { mark: draw-zoom }
        upsertIds: [b3-zoom-box, b3-zoom, b3-aa]
        drawMs: 2000

  - id: font-size
    narration: >
      [[mark:close-size-board]] editor ထဲ ပြန်သွားရအောင်။ [[mark:type-size]] body ထဲမှာ စာလုံး
      အရွယ်ကို ၁ rem ထည့်ပါမယ်။ ကိုယ့် rule က theme ရဲ့ နောက်မှာ ရှိလို့ ၁၃ pixel ကို
      အနိုင်ယူသွားမှာပါ။ [[mark:after-size]] စာလုံးတွေ ကြီးလာပြီး ဖတ်ရ သက်သာသွားပါပြီ။
      ခေါင်းစဉ်တွေကတော့ rem နဲ့ ရေးပြီးသား ဖြစ်လို့ setting ကြီးရင် page တစ်ခုလုံး အတူတူ
      လိုက်ကြီးပါလိမ့်မယ်။
    sources:
      - title: "web.dev Learn Accessibility — Typography: Font size and typographic styling"
        url: "https://web.dev/learn/accessibility/typography#font-size-and-typographic-styling"
      - title: "MDN — font-size"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/font-size"
    actions:
      - id: close-size-board
        type: whiteboard.apply
        at: { mark: close-size-board }
        open: false
      - id: type-size
        type: editor.type
        at: { mark: type-size }
        cadence: fast-explainer
        target: { file: styles.css, after: "system-ui, sans-serif;\n", occurrence: 1 }
        text: "  font-size: 1rem;\n"
      - id: expect-size
        type: expect.preview
        at: { mark: after-size }
        timeoutMs: 4000
        target: { by: testId, value: story }
        textContains: "မုန့်ဟင်းခါး"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: line-height
    chapter: "မြန်မာစာအတွက် line height"
    narration: >
      အခု ဒီ lesson ရဲ့ အရေးအကြီးဆုံး အချက်ပါ။ line height ဆိုတာ စာကြောင်း တစ်ကြောင်းက ယူတဲ့
      အမြင့်ဖြစ်ပြီး၊ theme က စာလုံး အရွယ်ရဲ့ ၁.၂ ဆပဲ ပေးထားပါတယ်။ အင်္ဂလိပ်စာ အတွက်ဆိုရင် ရပေမယ့်၊ မြန်မာစာမှာတော့
      ဗျည်းရဲ့ အပေါ်မှာ လုံးကြီးတင်လို သင်္ကေတတွေ၊ အောက်မှာ တစ်ချောင်းငင်၊ ဝဆွဲ၊ ဟထိုးနဲ့ ပါဌ်ဆင့်
      စာလုံးတွေ ရှိလို့ စာကြောင်းက အပေါ်ရော အောက်ရော ပိုမြင့်ပါတယ်။ [[mark:breath-marks]]
      ဒါကြောင့် အပေါ်ကြောင်းရဲ့ အောက်ဘက် သင်္ကေတနဲ့ အောက်ကြောင်းရဲ့ အပေါ်ဘက် သင်္ကေတ ထိလုနီးပါး
      ဖြစ်နေတာပါ။ [[mark:type-line-height]] line height ကို ၁.၈ ထည့်ပါမယ်။
      [[mark:after-line-height]] ကြည့်ပါ၊ စာကြောင်းတွေ ခွာသွားလို့ မျက်စိက တစ်ကြောင်းချင်း လိုက်ရ
      လွယ်သွားပါပြီ။ WCAG ရဲ့ level AAA က စာကြောင်းကြား အနည်းဆုံး ၁.၅ ဆလို့ ပြောပေမယ့်၊ အပေါ်အောက်
      သင်္ကေတ များတဲ့ မြန်မာစာမှာ ၁.၈ ဝန်းကျင် ပေးမှ အဆင်ပြေလို့၊ ဒီ course ရဲ့ ဆိုင် website
      မှာလည်း ၁.၈ ကို သုံးထားပါတယ်။
    sources:
      - title: "W3C — Understanding SC 1.4.8 Visual Presentation (Level AAA)"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/visual-presentation.html"
      - title: "MDN — line-height"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/line-height"
      - title: "Richard Ishida (W3C Internationalization) — Burmese orthography notes: combining marks and stacked consonants"
        url: "https://r12a.github.io/scripts/mymr/my.html"
    actions:
      - id: type-line-height
        type: editor.type
        at: { mark: type-line-height }
        cadence: block
        target: { file: styles.css, after: "  font-size: 1rem;\n", occurrence: 1 }
        text: "  line-height: 1.8;\n"
      - id: expect-line-height
        type: expect.preview
        at: { mark: after-line-height }
        timeoutMs: 4000
        target: { by: testId, value: story }
        textContains: "ကျောင်းသားတွေရော"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: spacing-board
    narration: >
      [[mark:open-spacing-board]] နေရာလွတ်နဲ့ ပတ်သက်ပြီး level AA မှာ စည်းကမ်း တစ်ခု ရှိပါတယ်။
      user တချို့က ဖတ်ရ လွယ်အောင် browser extension နဲ့ နေရာလွတ်တွေကို ကိုယ်တိုင် တိုးပြီး
      ဖတ်ကြပါတယ်။ [[mark:draw-spacing-numbers]] line height ကို စာလုံး အရွယ်ရဲ့ ၁.၅ ဆ၊
      စာပိုဒ်ကြားကို ၂ ဆ၊ စာလုံးကြားကို ၀.၁၂ ဆ၊ စကားလုံးကြားကို ၀.၁၆ ဆ အထိ တိုးလိုက်ရင်တောင် စာ
      တစ်လုံးမှ မပျောက်ရ၊ ဘာမှ ပျက်မသွားရပါဘူး။ [[mark:draw-fixed-height]] အများဆုံး ပျက်တတ်တာက box
      အမြင့်ကို ပုံသေ ပေးထားတဲ့ နေရာတွေပါ။ စာကြောင်း မြင့်လာတာနဲ့ စာက box အပြင် ကျွံထွက်ပြီး
      ဖြတ်ခံရတတ်လို့၊ စာပါတဲ့ box တွေကို စာနဲ့အတူ ကြီးလာခွင့် ပေးထားပါ။
    sources:
      - title: "W3C — Understanding SC 1.4.12 Text Spacing (Level AA)"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/text-spacing.html"
      - title: "web.dev Learn Accessibility — Typography: Spacing"
        url: "https://web.dev/learn/accessibility/typography#spacing"
    actions:
      - id: open-spacing-board
        type: whiteboard.apply
        at: { mark: open-spacing-board, offsetMs: -300 }
        open: true
        clear: true
        upsertIds: [b4-title]
      - id: draw-spacing-numbers
        type: whiteboard.apply
        at: { mark: draw-spacing-numbers }
        upsertIds: [b4-n1, b4-n2, b4-n3, b4-n4, b4-note]
        drawMs: 3000
      - id: draw-fixed-height
        type: whiteboard.apply
        at: { mark: draw-fixed-height }
        upsertIds: [b4-box, b4-box-text, b4-box-label, b4-box-fix]
        drawMs: 2400

  - id: layout
    chapter: "စာပိုဒ်ကို ချထားပုံ"
    narration: >
      [[mark:close-spacing-board]] editor ထဲ ပြန်သွားရအောင်။ ဆိုင်အကြောင်း စာပိုဒ်ကို ကြည့်ပါ။
      justify လုပ်ထားလို့ browser က စာကြောင်းတိုင်း ဘယ်ညာ ညီအောင် စကားလုံးကြားက နေရာလွတ်တွေကို
      ဆွဲဆန့်ထားပြီး၊ ပထမ စာကြောင်းမှာ နေရာလွတ်တွေ အရမ်း ကျယ်နေပါတယ်။ [[mark:type-align]] ဒီလို
      မညီမညာ နေရာလွတ်တွေကြောင့် စကားလုံး ဘယ်မှာ ဆုံးလဲ ရှာရ ခက်ပြီး၊ space နည်းတဲ့ မြန်မာစာမှာ
      ပိုဆိုးပါတယ်။ ဒါကြောင့် စာကို ရေးတဲ့ဘက်ကနေ ညှိတဲ့ start ကို ပေးပါမယ်။ [[mark:after-align]]
      နေရာလွတ်တွေ ညီသွားပြီး ညာဘက် အစွန်းကတော့ တန်းမညီ ဖြစ်သွားပါတယ်။ ဒါက ဖတ်ရ ပိုလွယ်တဲ့ ပုံစံပါ။
      [[mark:type-measure]] စာကြောင်း ရှည်လွန်းရင်လည်း နောက်တစ်ကြောင်းကို ပြန်ဆင်းတဲ့အခါ မျက်စိ
      လမ်းပျောက်တတ်လို့၊ တစ်ကြောင်းကို စာလုံး ၈၀ အောက် ထားဖို့ အကြံပြုကြပါတယ်။ ch unit က သုည ဂဏန်း
      တစ်လုံးစာ အကျယ် ဖြစ်လို့ max width ကို ch နဲ့ ပေးပါမယ်။ [[mark:after-measure]] ဒီ preview က
      ဖုန်းလောက်ပဲ ကျယ်လို့ ဘာမှ မပြောင်းပေမယ့်၊ screen ကျယ်ကျယ်မှာတော့ စာပိုဒ်က စာလုံး ၇၀
      လောက်ထက် ပိုမကျယ်တော့ပါဘူး။
    sources:
      - title: "web.dev Learn Accessibility — Typography: Content alignment"
        url: "https://web.dev/learn/accessibility/typography#content-alignment"
      - title: "W3C — Understanding SC 1.4.8 Visual Presentation (Level AAA)"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/visual-presentation.html"
      - title: "MDN — text-align"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/text-align"
      - title: "MDN — CSS values and units: ch"
        url: "https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Styling_basics/Values_and_units"
    actions:
      - id: close-spacing-board
        type: whiteboard.apply
        at: { mark: close-spacing-board }
        open: false
      - id: type-align
        type: editor.type
        at: { mark: type-align }
        cadence: fast-explainer
        target:
          {
            file: styles.css,
            after: "  font-family: Menlo, Consolas, monospace;\n}\n",
            occurrence: 1,
          }
        text: "\n.story {\n  text-align: start;\n}\n"
      - id: expect-align
        type: expect.preview
        at: { mark: after-align }
        timeoutMs: 4000
        target: { by: testId, value: story }
        textContains: "ပလာတာနဲ့"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-measure
        type: editor.type
        at: { mark: type-measure }
        cadence: fast-explainer
        target: { file: styles.css, after: "  text-align: start;\n", occurrence: 1 }
        text: "  max-width: 70ch;\n"
      - id: expect-measure
        type: expect.preview
        at: { mark: after-measure }
        timeoutMs: 4000
        target: { by: testId, value: about }
        textContains: "ဆိုင်အကြောင်း"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: caps-italic
    chapter: "စာလုံးကြီး အကုန်နဲ့ စာလုံးစောင်း"
    narration: >
      နောက်ဆုံး ပြဿနာက အင်္ဂလိပ် quote ပါ။ စာလုံးကြီး အကုန်နဲ့ ရေးပြီး စောင်းထားပါတယ်။ စာလုံး
      အသေးတွေမှာ အပေါ်ထွက်၊ အောက်ထွက် ပုံစံတွေ ရှိပေမယ့်၊ စာလုံးကြီး အကုန်ဆိုရင် စကားလုံးတိုင်း
      အမြင့်တူ လေးထောင့်တုံးလို ဖြစ်သွားပါတယ်။ လူတွေက အဲဒီလို စာကို ဖတ်ရ ယဉ်ပါးမှု နည်းလို့
      ဖတ်ရ ပိုနှေးပါတယ်။ [[mark:type-quote]] စာလုံးကို မတ်မတ် ပြန်ထားပြီး စာလုံးကြီး ပြောင်းထားတာကိုလည်း
      ပယ်ပါမယ်။ စာလုံးစောင်းကလည်း dyslexia ရှိသူတွေ အတွက် ဖတ်ရ ခက်ပါတယ်။ ပြီးတော့ screen reader
      တွေက bold နဲ့ italic ကို များသောအားဖြင့် ဖတ်မပြလို့၊ အလေးပေးချင်တဲ့ အဓိပ္ပာယ်ကိုလည်း style
      တစ်ခုတည်းနဲ့ မပြပါနဲ့။ [[mark:after-quote]] quote က စာလုံး အကြီး အသေး ရောပြီး မတ်မတ်
      ဖြစ်သွားလို့ ဖတ်ရ ပိုမြန်သွားပါပြီ။
    sources:
      - title: "web.dev Learn Accessibility — Typography: Font size and typographic styling"
        url: "https://web.dev/learn/accessibility/typography#font-size-and-typographic-styling"
      - title: "MDN — text-transform"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/text-transform"
      - title: "MDN — font-style"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/font-style"
    actions:
      - id: type-quote
        type: editor.type
        at: { mark: type-quote }
        cadence: fast-explainer
        target: { file: styles.css, after: "  max-width: 70ch;\n}\n", occurrence: 1 }
        text: "\n.quote {\n  font-style: normal;\n  text-transform: none;\n}\n"
      - id: expect-quote
        type: expect.preview
        at: { mark: after-quote }
        timeoutMs: 4000
        target: { by: testId, value: quote }
        textContains: "the first cup of the morning"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-final-body
        type: expect.file
        at: { mark: after-quote }
        path: styles.css
        contains: "  font-size: 1rem;\n  line-height: 1.8;\n}"
      - id: expect-final-story
        type: expect.file
        at: { mark: after-quote }
        path: styles.css
        contains: ".story {\n  text-align: start;\n  max-width: 70ch;\n}"
      - id: expect-final-quote
        type: expect.file
        at: { mark: after-quote }
        path: styles.css
        contains: ".quote {\n  font-style: normal;\n  text-transform: none;\n}"

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:open-recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ ဖတ်ရလွယ်တဲ့ စာသားအတွက် အချက် ငါးချက် ရှိပါတယ်။
      [[mark:draw-recap-1]] စာလုံး တစ်လုံးချင်း ကွဲပြားတဲ့ font ကို ရွေးပြီး၊ မြန်မာ Unicode font
      တွေကို ရှေ့ဆုံးက ထားပါ။ [[mark:draw-recap-2]] စာလုံး အရွယ်ကို rem နဲ့ ပေးရင် setting ရော
      zoom ရော လိုက်ပါတယ်။ [[mark:draw-recap-3]] မြန်မာစာမှာ line height ကို ၁.၈ ဝန်းကျင် ပေးပြီး
      box အမြင့်ကို ပုံသေ မထားပါနဲ့။ [[mark:draw-recap-4]] စာပိုဒ်ကို start နဲ့ ညှိ၊ စာကြောင်း
      အလျားကို ကန့်သတ်ပြီး၊ စာလုံးကြီး အကုန်နဲ့ စာလုံးစောင်းကို နည်းနည်းပဲ သုံးပါ။
      [[mark:draw-recap-5]] စာကို ပုံထဲမှာ မရေးဘဲ HTML စာသား အဖြစ် ရေးပါ။ ပုံထဲက စာကို screen
      reader က ဖတ်မပြနိုင်သလို ချဲ့ရင်လည်း ဝါးသွားလို့ပါ။ [[mark:next-lesson]] နောက် lesson
      မှာတော့ လှလှလို နားမကြားသူတွေနဲ့ မျက်မမြင်တွေပါ video နဲ့ audio ကို သုံးနိုင်အောင် caption၊
      transcript နဲ့ audio description တွေ အကြောင်း ကြည့်သွားပါမယ်။
    sources:
      - title: "web.dev Learn Accessibility — Typography: Accessible typography takeaways"
        url: "https://web.dev/learn/accessibility/typography#accessible-typography-takeaways"
      - title: "W3C — Understanding SC 1.4.5 Images of Text (Level AA)"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/images-of-text.html"
    actions:
      - id: open-recap
        type: whiteboard.apply
        at: { mark: open-recap, offsetMs: -300 }
        open: true
        clear: true
        upsertIds: [b5-title]
      - id: draw-recap-1
        type: whiteboard.apply
        at: { mark: draw-recap-1 }
        upsertIds: [b5-c1, b5-l1]
        drawMs: 1200
      - id: draw-recap-2
        type: whiteboard.apply
        at: { mark: draw-recap-2 }
        upsertIds: [b5-c2, b5-l2]
        drawMs: 1000
      - id: draw-recap-3
        type: whiteboard.apply
        at: { mark: draw-recap-3 }
        upsertIds: [b5-c3, b5-l3]
        drawMs: 1200
      - id: draw-recap-4
        type: whiteboard.apply
        at: { mark: draw-recap-4 }
        upsertIds: [b5-c4, b5-l4]
        drawMs: 1200
      - id: draw-recap-5
        type: whiteboard.apply
        at: { mark: draw-recap-5 }
        upsertIds: [b5-c5, b5-l5]
        drawMs: 1000
      - id: draw-next
        type: whiteboard.apply
        at: { mark: next-lesson }
        upsertIds: [b5-next]
        drawMs: 800

checks:
  - { type: timing.p95Ms, max: 300 }
