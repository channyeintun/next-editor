      styles.css: ""
      theme.css: |
        /*
          theme.css: the text theme the shop's site started from.
          It was written for an English website and never thought about Burmese.
          We leave this file as it is; styles.css loads after it and wins.
        */

        body {
          font-family: Georgia, "Times New Roman", serif;
          font-size: 13px;
          line-height: 1.2;
        }

        .story {
          text-align: justify;
        }

        .tagline {
          font-family: "Brush Script MT", "Segoe Script", cursive;
        }

        .quote {
          font-style: italic;
          text-transform: uppercase;
        }

        .wifi-code {
          font-family: Arial, Helvetica, sans-serif;
        }
