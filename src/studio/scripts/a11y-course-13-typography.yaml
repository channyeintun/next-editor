# Accessibility course (Burmese), lesson 13 of 20: readable text (typography).
#
# Built from template.yaml + ws/ with `bun build.ts` (pins ws/ byte-exact).
# Narration is Burmese, written directly; voice-script.md next to this file is
# the lint's copy. DESIGN.md is the brief. Every [[mark:…]] sits where its
# action begins, after ။ or ၊.
#
# Shape: board (recall lesson 12; who struggles with text; the four areas) →
# code tour (theme.css: an English-only text theme; styles.css empty and
# loaded after it) → board (choosing a font: common faces, no decorative
# faces, I l 1 and b/d, rn → m, Burmese = Unicode fonts) → Myanmar font stack
# on body → tagline inherits the page font → Wi-Fi password in a monospace
# face with distinct letters → board (px vs rem against the browser font-size
# setting; zoom; 200 % at level AA) → body font size 1rem → Burmese line
# height 1.8 (the marks above and below stop touching) → board (text spacing
# overrides at level AA; fixed heights clip) → story start-aligned instead of
# justified, max width in ch (no change in the narrow preview, said so) →
# English quote back to mixed case and upright → recap board, hand-off to
# lesson 14 (video and audio).
#
# No accessibility panel: nothing in this lesson changes the accessibility
# tree, and the preview shows every change directly (DESIGN.md). So the
# workspace pins the CSS course's vite-only package.json and no panel.js.
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set(. Font-family rules land as
# `block` inserts (a half-typed family name is a valid unknown font and would
# flash the default serif); line-height lands as a block (a typed "1" would
# flash line-height 1). Keystroke-typed values have no valid prefix: 1rem,
# start, 70ch, normal, none. Every insert that sits in front of existing code
# ends with \n.
#
# Measured in headless Chrome 155 at 432 × 720 (scratch stages script, CDP
# CSS.getPlatformFontsForNode, macOS): start — story Burmese in Noto Serif
# Myanmar (system fallback from Georgia), 13 px / 1.2, 78 px tall; tagline in
# Brush Script MT; Wi-Fi code in Arial (I and l identical); quote Georgia
# italic capitals. Font stack — story in Noto Sans Myanmar, quote English in
# Myanmar Sangam MN (sans). Tagline inherit — sans; Wi-Fi code Menlo (serifed
# I, tailed l, slashed 0). 1rem — story 115 px tall, justified first line
# with wide gaps. line-height 1.8 — story 173 px tall, marks clear. Start +
# 70ch — ragged right, width unchanged (400 px < 70ch). Quote mixed case,
# upright, at y 372–446; document 1032 tall.
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   ~/Documents/a11y-course-work/tools/verify.sh <this file>
schemaVersion: 1

lesson:
  slug: a11y-course-13-typography
  title: "Accessibility course 13: ဖတ်ရလွယ်တဲ့ စာသား"
  locale: my-MM
  workspace:
    lessonType: javascript
    name: Accessibility course 13
    entryFilePath: index.html
    files:
      base.css: |
        /*
          base.css: pinned, never typed during a lesson.
          The shop's palette and page furniture. Every font size here is in rem, so it
          follows the reader's browser font-size setting. The text theme (font family,
          body size, line height, alignment) lives in theme.css.
          Keep it free of the url, image-set and @-import functions (they switch on
          Vite's postcss step); images come from <img>.
        */

        /* == A. palette == */
        :root {
          color-scheme: light;
          --tea-dark: #3b2314;
          --tea: #8b5a2b;
          --tea-light: #c9a27e;
          --cream: #fff8ec;
          --paper: #fdf3e1;
          --ink: #2b1d14;
          --muted: #6b5a4c;
          --line: #e6d5bf;
          --radius: 12px;
        }

        /* == B. page == */
        body {
          margin: 0;
          color: var(--ink);
          background: var(--paper);
        }

        .page {
          padding: 0 16px 24px;
        }

        h1,
        h2,
        h3 {
          margin: 0 0 8px;
          line-height: 1.5;
        }

        h1 {
          font-size: 1.375rem;
        }

        h2 {
          font-size: 1.25rem;
        }

        h3 {
          font-size: 1.0625rem;
        }

        a {
          color: var(--tea);
        }

        [hidden] {
          display: none !important;
        }

        /* == B2. reset == */
        *,
        *::before,
        *::after {
          box-sizing: border-box;
        }

        /* == C. furniture == */
        .site-header {
          padding: 12px 16px;
          background: var(--tea-dark);
          color: var(--cream);
        }

        .site-header a {
          color: var(--cream);
        }

        .brand {
          display: flex;
          align-items: center;
          gap: 8px;
        }

        .logo {
          display: block;
        }

        .shop-name {
          margin: 0;
          flex: 1;
        }

        .call-link {
          display: inline-flex;
          padding: 8px;
          border-radius: 999px;
          background: var(--tea);
        }

        .call-link img {
          display: block;
        }

        .tagline {
          margin: 0;
          color: var(--tea-light);
          font-size: 1.125rem;
        }

        .nav ul {
          display: flex;
          gap: 16px;
          margin: 4px 0 0;
          padding: 0;
          list-style: none;
        }

        .about {
          margin: 16px 0;
        }

        .story {
          margin: 0;
        }

        .quote {
          margin: 16px 0;
          padding: 8px 16px;
          border-left: 4px solid var(--tea);
          background: var(--cream);
        }

        .quote p {
          margin: 0;
        }

        .wifi {
          margin: 0 0 16px;
        }

        .wifi-code {
          padding: 2px 8px;
          border: 1px solid var(--line);
          border-radius: 6px;
          background: #fff;
          font-size: 1.125rem;
        }

        .menu {
          margin: 0;
          padding: 0;
          list-style: none;
        }

        .menu-card {
          margin: 0 0 12px;
          padding: 12px 16px;
          background: #fff;
          border: 1px solid var(--line);
          border-radius: var(--radius);
        }

        .menu-card .name,
        .menu-card .desc {
          margin: 0;
        }

        .menu-card .desc {
          color: var(--muted);
          font-size: 0.875rem;
        }

        .price {
          font-weight: 700;
          color: var(--tea);
        }

        .site-footer {
          margin-top: 24px;
          padding: 16px;
          background: var(--tea-dark);
          color: var(--cream);
          font-size: 0.875rem;
        }

        .site-footer p {
          margin: 0;
        }

        .site-footer a {
          color: var(--cream);
        }
      index.html: |
        <!doctype html>
        <html lang="my">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <link rel="icon" href="data:," />
            <title>ရွှေလက်ဖက်ရည်ဆိုင်</title>
            <link rel="stylesheet" href="/base.css" />
            <link rel="stylesheet" href="/theme.css" />
            <link rel="stylesheet" href="/styles.css" />
          </head>
          <body>
            <header class="site-header" data-testid="site-header">
              <div class="brand">
                <img class="logo" src="/cup.svg" alt="" width="40" height="40" data-testid="logo" />
                <h1 class="shop-name" data-testid="shop-name">ရွှေလက်ဖက်ရည်ဆိုင်</h1>
                <a class="call-link" href="tel:+959123456789" data-testid="call-link"><img src="/phone.svg" alt="ဖုန်းဆက်ရန်" width="24" height="24" /></a>
              </div>
              <p class="tagline" lang="en" data-testid="tagline">Yangon · since 1998</p>
              <nav class="nav" aria-label="အဓိက" data-testid="nav">
                <ul>
                  <li><a class="nav-link" href="#drinks" data-testid="nav-drinks">မီနူး</a></li>
                  <li><a class="nav-link" href="#about" data-testid="nav-about">ဆိုင်အကြောင်း</a></li>
                </ul>
              </nav>
            </header>

            <main class="page" id="main" data-testid="main">
              <section class="about" id="about" data-testid="about">
                <h2>ဆိုင်အကြောင်း</h2>
                <p class="story" data-testid="story">ရွှေလက်ဖက်ရည်ဆိုင်ကို ၁၉၉၈ ခုနှစ်မှာ ဗဟန်းက လမ်းထောင့်လေး တစ်ခုမှာ စဖွင့်ခဲ့ပါတယ်။ လက်ဖက်ရည်ကို ခွက်တိုင်း လက်နဲ့ ဖျော်ပြီး၊ ပလာတာနဲ့ မုန့်ဟင်းခါးကိုလည်း ဆိုင်မှာပဲ ကိုယ်တိုင် ချက်ပါတယ်။ ရပ်ကွက်ထဲက လူကြီးတွေရော ကျောင်းသားတွေရော မနက်တိုင်း လာထိုင်ကြတဲ့ နေရာလေး ဖြစ်ပါတယ်။</p>
              </section>

              <blockquote class="quote" lang="en" data-testid="quote">
                <p>Since 1998, the first cup of the morning has been ours.</p>
              </blockquote>

              <p class="wifi" data-testid="wifi">ဆိုင်ရဲ့ Wi-Fi စကားဝှက် <code class="wifi-code" lang="en" data-testid="wifi-code">Il1O0shwe</code></p>

              <section class="menu-section" id="drinks" data-testid="drinks">
                <h2>သောက်စရာ</h2>
                <ul class="menu" data-testid="menu-drinks">
                  <li class="menu-card featured" data-testid="card-laphet-yay">
                    <h3 class="name">လက်ဖက်ရည်</h3>
                    <p class="desc">ချိုဆိမ့် ပေါ့ဆိမ့် ကြိုက်သလို</p>
                    <span class="price" data-testid="price-laphet-yay">1,500 ကျပ်</span>
                  </li>
                  <li class="menu-card" data-testid="card-coffee">
                    <h3 class="name">ကော်ဖီ</h3>
                    <p class="desc">နို့ဆီနဲ့ ကော်ဖီ</p>
                    <span class="price">1,800 ကျပ်</span>
                  </li>
                  <li class="menu-card" data-testid="card-lime-juice">
                    <h3 class="name">သံပုရာရည်</h3>
                    <p class="desc">ရေခဲနဲ့ အေးအေး</p>
                    <span class="price">1,200 ကျပ်</span>
                  </li>
                </ul>
              </section>
            </main>

            <footer class="site-footer" data-testid="footer">
              <p>အမှတ် ၁၂၊ ဗဟန်း၊ ရန်ကုန်</p>
              <p><a href="tel:+959123456789" data-testid="footer-phone">09 123 456 789</a></p>
            </footer>
          </body>
        </html>
