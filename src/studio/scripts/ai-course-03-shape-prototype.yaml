      src/prototype.js: |
        // The prototype's panel: one card for the plain-code steps, and the AI step's log with the
        // customer's feedback buttons above the panel.
        import { panel } from "ai-panel";
        import { model } from "./llm.js";
        import { button, row } from "./ui.js";
        import { keywordSearch, synonymSearch } from "./search.js";

        const STEP = new Map([[keywordSearch, "keyword"], [synonymSearch, "synonym"]]);
        const names = (items) => (items.length ? items.map((item) => item.name).join("၊ ") : "—");

        // Every search goes through the steps in order; the first step that finds something wins.
        // Returns the searches that no step could find.
        export function showSearches(items, searches, steps) {
          const rows = searches.map((search) => {
            for (const step of steps) {
              const found = step(items, search);
              if (found.length) return { search, step: STEP.get(step), found: names(found) };
            }
            return { search, step: "—", found: "—" };
          });
          panel.table("Plain code", rows, { id: "search", badge: "rules · AI မပါ" });
          return rows.filter((r) => r.step === "—").map((r) => r.search);
        }

        // The AI step for those searches, and its log: what the customer typed, the model's answer (its
        // want and avoid tags), what the customer got and the customer's feedback (✓ useful, ✗ not useful;
        // each button redraws the log).
        const list = (tags) => (tags.length ? tags.join(", ") : "—");
        export async function showLog(items, searches, aiSearch) {
          const log = [];
          for (const search of searches) {
            const { want, avoid, found } = await aiSearch(items, search);
            log.push({ search, "AI tags": `want: ${list(want)} · avoid: ${list(avoid)}`, found: names(found), feedback: "—" });
          }
          const draw = () => panel.table("AI log", log, { id: "log", badge: `recorded · ${model.label} · greedy` });
          log.forEach((entry, i) => {
            const buttons = row(entry.search);
            button("အသုံးဝင်တယ်", `useful-${i + 1}`, () => { entry.feedback = true; draw(); }, buttons);
            button("မဝင်ဘူး", `not-useful-${i + 1}`, () => { entry.feedback = false; draw(); }, buttons);
          });
          draw();
        }
      src/search.js: |
        // The menu search prototype's plain-code steps. Each one takes the menu items and what the customer
        // typed, and returns the items it finds ([] when it finds nothing). No model anywhere in this file.

        // The search the website has today: the words are part of an item's Burmese or English name.
        export function keywordSearch(items, search) {
          const q = search.trim().toLowerCase();
          return items.filter((item) => item.name.includes(q) || item.en.toLowerCase().includes(q));
        }

        // Words customers use, each mapped to a menu tag or item (written by hand from the searches that
        // found nothing).
        export const SYNONYMS = {
          "အေး": "cold", "ရေခဲ": "cold", "ပူ": "hot", "ချို": "sweet", "ချဉ်": "sour", "စပ်": "spicy",
          "မနက်စာ": "breakfast", "ခေါက်ဆွဲ": "noodles", "သောက်": "drink",
          "laphet yay": "laphet-yay", "mohinga": "mohinga", "palata": "palata",
        };

        // Items that have every wanted tag and none of the avoided ones (a tag, the category or the id).
        export function byTags(items, want, avoid = []) {
          const has = (item, tag) => item.tags.includes(tag) || item.category === tag || item.id === tag;
          if (!want.length) return [];
          return items.filter((item) => want.every((tag) => has(item, tag)) && !avoid.some((tag) => has(item, tag)));
        }

        // Every word from the list that appears in the search becomes a wanted tag.
        export function synonymSearch(items, search) {
          const words = Object.keys(SYNONYMS).filter((word) => search.toLowerCase().includes(word));
          return byTags(items, [...new Set(words.map((word) => SYNONYMS[word]))]);
        }
      src/ui.js: |
        // Page controls for the lesson program: a row of buttons or choices in #app, above the AI panel.
        // Plain DOM, so the studio records every click and replay shows it exactly. Each control gets a
        // data-testid for preview.click. #app starts empty on every run, so controls are drawn by the
        // program each time. A handler that throws prints to the panel's Console (never the page).
        //
        //   import { row, button, choices } from "./ui.js";
        //   choices("threshold", [0.5, 0.7, 0.9], (t) => show(t), { selected: 0.5 });
        //     → buttons with test ids threshold-1, threshold-2, threshold-3 (1-based, in order)
        //   button("ဖော်ပြချက်တွေ ကြည့်မယ်", "show-descriptions", () => …);
        const STYLE_ID = "ui-style";
        const STYLE = `
        #app .ui-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px 0;
          font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans Myanmar", "Myanmar Sangam MN", "Myanmar Text", sans-serif; color: #d9dce2; }
        #app .ui-label { color: #adb5bd; font-size: 13px; }
        #app .ui-btn { font: inherit; color: #f1f3f5; background: #2d323c; border: 1px solid #3a404b; border-radius: 6px; padding: 3px 12px; cursor: pointer; }
        #app .ui-btn[aria-pressed="true"] { background: #7048e8; border-color: #7048e8; color: #fff; font-weight: 600; }
        `;

        function ensureStyle() {
          if (document.getElementById(STYLE_ID)) return;
          const style = document.createElement("style");
          style.id = STYLE_ID;
          style.textContent = STYLE;
          document.head.append(style);
        }

        const safe = (fn) => (...args) => {
          try {
            const result = fn(...args);
            if (result && typeof result.catch === "function") result.catch((error) => console.error(error));
          } catch (error) {
            console.error(error);
          }
        };

        /** A new row in #app, optionally with a short label in front. Returns the row element. */
        export function row(label = "") {
          ensureStyle();
          const el = document.createElement("div");
          el.className = "ui-row";
          if (label) {
            const span = document.createElement("span");
            span.className = "ui-label";
            span.textContent = label;
            el.append(span);
          }
          document.getElementById("app").append(el);
          return el;
        }

        /** One button. `testid` is used as is. */
        export function button(label, testid, onClick, parent = row()) {
          const el = document.createElement("button");
          el.type = "button";
          el.className = "ui-btn";
          el.textContent = String(label);
          el.dataset.testid = testid;
          el.addEventListener("click", safe(onClick));
          parent.append(el);
          return el;
        }

        /** A row of choices; the picked one is shown pressed. Test ids are `<name>-1`, `<name>-2`, … */
        export function choices(name, options, onPick, { label = name, selected } = {}) {
          const parent = row(label);
          const buttons = options.map((option, i) =>
            button(option, `${name}-${i + 1}`, () => {
              for (const b of buttons) b.setAttribute("aria-pressed", String(b === buttons[i]));
              onPick(option, i);
            }, parent),
          );
          for (const [i, b] of buttons.entries()) b.setAttribute("aria-pressed", String(options[i] === selected));
          return buttons;
        }
      vite.config.js: |
        import { defineConfig } from "vite";
        import courseRunner from "./course/runner.js";

        export default defineConfig({
          plugins: [courseRunner()],
        });
