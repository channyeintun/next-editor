build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 5103
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "Idea ကို ပုံဖော်ရအောင်"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ user journey တစ်လျှောက် AI idea တွေကို ချရေးပြီး၊
      အဆင့်တိုင်းမှာ အခွင့်အလမ်း မတူတာကို တွေ့ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ idea တွေကို ပုံဖော်ပြီး ဘယ်ဟာ
      အရင် လုပ်မလဲ ဆုံးဖြတ်ပါမယ်။ ပြီးရင် menu search prototype တစ်ခုကို အမြန် ဆောက်ကြည့်ပါမယ်။
      [[mark:draw-mini]] blueprint မှာဆိုရင် ဒီနေ့ အဓိက ကြည့်မှာက Solution အပိုင်းပါ။ [[mark:draw-roles]]
      idea ကို ပုံဖော်တာက team အလုပ်ပါ။ များသောအားဖြင့် ဘာ ဆောက်မလဲ၊ ဘာကြောင့် ဆောက်မလဲ ဆုံးဖြတ်တဲ့
      product manager က ဦးဆောင်ပြီး၊ ကိုယ်တို့ ဆိုင်မှာတော့ ဆိုင်ပိုင်ရှင် က အဲဒီ နေရာကို ယူပါတယ်။
      idea ကို blueprint နဲ့ ချရေးတဲ့အခါ Opportunity ကို ဆိုင်ပိုင်ရှင် က ဖြည့်ပြီး Solution ကို ကိုယ်က ဖြည့်ပါတယ်။
      [[mark:draw-dev-job]] developer အနေနဲ့ ကိုယ့် တာဝန်က ဆောက်ဖို့ ဘယ်လောက် ကုန်ကျမလဲ၊ ဘယ်လောက်
      အလုပ်များမလဲ၊ ဘာ risk တွေ ရှိလဲ ခန့်မှန်းပေးဖို့ပါ။
    sources:
      - {
          title: "web.dev Learn AI: Explore use cases (Shape your solution, Specify your ideas)",
          url: "https://web.dev/learn/ai/use-cases",
        }
      - {
          title: "web.dev Learn AI: Introduction to AI on the web (the blueprint)",
          url: "https://web.dev/learn/ai/introduction",
        }
      - {
          title: "web.dev Learn AI: Welcome to Learn AI! (course credit: written by Dr. Janna Lipenkova with editorial guidance from Alexandra Klepper; text CC BY 4.0, code Apache 2.0; adapted into Burmese with the course's own tea-shop examples)",
          url: "https://web.dev/learn/ai/welcome",
        }
      - {
          title: "Creative Commons: Attribution 4.0 International (CC BY 4.0), the licence of the web.dev Learn AI text adapted here",
          url: "https://creativecommons.org/licenses/by/4.0/",
        }
    actions:
      - {
          id: open-board-a,
          type: whiteboard.apply,
          at: { scene: start, offsetMs: -450 },
          open: true,
          clear: true,
          upsertIds: [a-title],
        }
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - {
          id: draw-mini,
          type: whiteboard.apply,
          at: { mark: draw-mini },
          upsertIds:
            [
              a-opp,
              a-opp-t,
              a-arrow-1,
              a-data,
              a-data-t,
              a-intel,
              a-intel-t,
              a-ux,
              a-ux-t,
              a-arrow-2,
              a-gov,
              a-gov-t,
              a-today,
            ],
          drawMs: 2600,
        }
      - {
          id: draw-roles,
          type: whiteboard.apply,
          at: { mark: draw-roles },
          upsertIds: [a-who-opp, a-who-sol],
          drawMs: 900,
        }
      - {
          id: draw-dev-job,
          type: whiteboard.apply,
          at: { mark: draw-dev-job },
          upsertIds: [a-dev],
          drawMs: 1200,
        }

  - id: cost
    chapter: "ဘယ်လောက် ခက်လဲ၊ ဘယ်လောက် ကုန်မလဲ"
    narration: >
      [[mark:draw-cost]] idea နှစ်ခုကို နှိုင်းယှဉ်ကြည့်ရအောင်။ [[mark:draw-cheap]] ပထမ တစ်ခုက customer
      ရိုက်တဲ့ စာကနေ မနက်စာ၊ အအေး လို filter တွေကို ရွေးပေးမယ့် smart filter ပါ။ စာကို prompt နဲ့ LLM
      API ဆီ ပို့ပြီး filter တွေ ပြန်ယူရုံမို့ prototype လုပ်ရတာ မြန်ပြီး ပြင်ရတာလည်း မခက်ပါဘူး။ [[mark:draw-heavy]] ဒုတိယ တစ်ခုက
      customer တစ်ယောက်ချင်းအတွက် အော်ဒါ မှာပေးမယ့် assistant ပါ။ data pipeline အသစ်၊ အော်ဒါ တင်မယ့် API၊
      လူက ကြားထဲမှာ စစ်မယ့် အဆင့်တွေ လိုလို့ အလုပ် အများကြီး ပိုများပါတယ်။ [[mark:draw-dims]] ဘယ်လောက်
      ခက်လဲ ဆိုတာကို ငါးချက်နဲ့ ကြည့်ပါ။ data အသင့် ဖြစ်မဖြစ်၊ သုံးလို့ ရမယ့် model ရှိပြီးသားလား၊ request
      ပို့ပြီး အဖြေ ပြန်ရတဲ့အထိ စောင့်ရတဲ့ latency၊ ချိတ်ဆက်ရမယ့် system အရေအတွက်နဲ့ feature ကို run
      နေသရွေ့ ကုန်ကျမယ့် ငွေ တို့ပါ။ [[mark:draw-scale]] prototype မှာ model ကို ခေါ်တာ နည်းလို့
      ဈေးပေါ်ပေမယ့်၊ user ထောင်ချီ သုံးလာရင် ဈေးကြီးလာတတ်တာကို သတိထားပါ။ [[mark:draw-user-cost]] user
      ဘက်ကလည်း ကုန်ကျတာ ရှိပါတယ်။ AI က အမှားနဲ့ မသေချာမှုကို ယူလာသလို၊ user ရဲ့ device ထဲမှာ run တဲ့ AI
      ဆိုရင် သူ့ internet data၊ storage နဲ့ battery ကို သုံးပါတယ်။ [[mark:draw-first]] ဒါကြောင့်
      အကျိုးကျေးဇူး များပြီး ဆောက်ရ မခက်တဲ့ idea ကို အရင် လုပ်ပြီး၊ ခက်တာတွေကို data နဲ့ အတွေ့အကြုံ ရလာမှ
      လုပ်ပါ။
    sources:
      - {
          title: "web.dev Learn AI: Explore use cases (Assess effort and cost)",
          url: "https://web.dev/learn/ai/use-cases",
        }
    actions:
      - {
          id: draw-cost,
          type: whiteboard.apply,
          at: { mark: draw-cost },
          clear: true,
          upsertIds: [k-title],
        }
      - {
          id: draw-cheap,
          type: whiteboard.apply,
          at: { mark: draw-cheap },
          upsertIds: [k-cheap-box, k-cheap-t, k-cheap-d],
          drawMs: 1400,
        }
      - {
          id: draw-heavy,
          type: whiteboard.apply,
          at: { mark: draw-heavy },
          upsertIds: [k-heavy-box, k-heavy-t, k-heavy-d],
          drawMs: 1400,
        }
      - {
          id: draw-dims,
          type: whiteboard.apply,
          at: { mark: draw-dims },
          upsertIds: [k-dims-1, k-dims-2],
          drawMs: 2200,
        }
      - {
          id: draw-scale,
          type: whiteboard.apply,
          at: { mark: draw-scale },
          upsertIds: [k-scale],
          drawMs: 1200,
        }
      - {
          id: draw-user-cost,
          type: whiteboard.apply,
          at: { mark: draw-user-cost },
          upsertIds: [k-user],
          drawMs: 1200,
        }
      - {
          id: draw-first,
          type: whiteboard.apply,
          at: { mark: draw-first },
          upsertIds: [k-first],
          drawMs: 1200,
        }

  - id: failure
    chapter: "ဘယ်လို မှားနိုင်လဲ"
    narration: >
      [[mark:draw-fail]] model တွေ မှားတတ်ပြီး feature တွေလည်း မျှော်လင့်သလို အလုပ် မလုပ်တာ ရှိပါတယ်။
      system က မှားနိုင်တဲ့ ပုံစံ တစ်ခုချင်းကို failure mode လို့ ခေါ်ပါတယ်။ [[mark:draw-cold-1]]
      ပြီးခဲ့တဲ့ lesson ရဲ့ ဇယားမှာ customer တစ်ယောက်ချင်းအတွက် အကြံပြုတဲ့ idea ရှိခဲ့ပါတယ်။ customer
      တွေကလည်း လိုချင်ပြီး ဆိုင်ပိုင်ရှင် ကလည်း လုပ်ချင်ပါတယ်။ ဒါပေမဲ့ ဒီနေ့မှ app ကို စသုံးတဲ့ ကျောင်းသား
      မောင်မောင် အကြောင်း ဆိုင်မှာ data မရှိသေးပါဘူး။ [[mark:draw-cold-2]] ဒါကြောင့် သူ့ကို ပြတဲ့ အကြံတွေက
      မကိုက်ဘဲ၊ နောက်ဆုံး သူ feature ကို မသုံးတော့ပါဘူး။ [[mark:draw-cold-name]] ဒါကို cold start လို့
      ခေါ်ပါတယ်။ user အသစ်၊ item အသစ်အတွက် data မရှိသေးလို့ AI က အကူအညီ မပေးနိုင်သေးတာပါ။ data ရှိမရှိကို
      အစကတည်းက သိထားရင်၊ အကျိုးကျေးဇူးကို ပြန်ခန့်မှန်းပြီး ဒီ idea ကို နောက်မှ လုပ်ဖို့
      ဆုံးဖြတ်နိုင်ခဲ့မှာပါ။ [[mark:draw-halluc]] hallucination ကတော့ menu မှာ မရှိတဲ့ item ဒါမှမဟုတ်
      ဆိုင်က မပေးတဲ့ discount ကို model က အမှန်လို ပြောတာပါ။ [[mark:draw-bias]] bias ဆိုတာ training data
      ထဲက မမျှတတဲ့ အမြင်တွေကို model က လိုက်ယူ ဒါမှမဟုတ် ပိုချဲ့ပြီး၊ လူ တချို့ကို မတရား ဆက်ဆံမိတာပါ။ ဥပမာ
      မြန်မာလို ရှာတဲ့သူကို ရလဒ် ညံ့ညံ့ ပေးတာမျိုးပါ။ [[mark:draw-drift]] menu အသစ်၊ စကားလုံး အသစ်တွေ
      ပေါ်လာတော့ model ကို train တုန်းက data နဲ့ လက်တွေ့ data မတူတော့ဘဲ မှန်ကန်မှု ကျလာတာကိုတော့ data
      drift လို့ ခေါ်ပါတယ်။ [[mark:draw-tell]] ဘယ်လို မှားမှား၊ ဘယ်နေရာမှာ မှားလဲ ဆိုတာကို user ကို
      ပြောပြပါ။ ဒါမှ user က စကားလုံး ပြောင်းပြီး ထပ်ရှာသင့်လား ဆိုတာ သိမှာပါ။
    sources:
      - {
          title: "web.dev Learn AI: Explore use cases (Estimate failure modes)",
          url: "https://web.dev/learn/ai/use-cases",
        }
      - {
          title: "web.dev Learn AI: Glossary and concepts (data drift)",
          url: "https://web.dev/learn/ai/glossary",
        }
    actions:
      - {
          id: draw-fail,
          type: whiteboard.apply,
          at: { mark: draw-fail },
          clear: true,
          upsertIds: [f-title],
        }
      - {
          id: draw-cold-1,
          type: whiteboard.apply,
          at: { mark: draw-cold-1 },
          upsertIds: [f-c1, f-c-a1, f-c2],
          drawMs: 1600,
        }
      - {
          id: draw-cold-2,
          type: whiteboard.apply,
          at: { mark: draw-cold-2 },
          upsertIds: [f-c3, f-c-a2, f-c4],
          drawMs: 1600,
        }
      - {
          id: draw-cold-name,
          type: whiteboard.apply,
          at: { mark: draw-cold-name },
          upsertIds: [f-cold],
          drawMs: 1300,
        }
      - {
          id: draw-halluc,
          type: whiteboard.apply,
          at: { mark: draw-halluc },
          upsertIds: [f-h, f-h-ex],
          drawMs: 1100,
        }
      - {
          id: draw-bias,
          type: whiteboard.apply,
          at: { mark: draw-bias },
          upsertIds: [f-b, f-b-ex],
          drawMs: 1100,
        }
      - {
          id: draw-drift,
          type: whiteboard.apply,
          at: { mark: draw-drift },
          upsertIds: [f-d, f-d-ex],
          drawMs: 1100,
        }
      - {
          id: draw-tell,
          type: whiteboard.apply,
          at: { mark: draw-tell },
          upsertIds: [f-tell],
          drawMs: 1100,
        }

  - id: prototype
    chapter: "Prototype အမြန် ဆောက်ရအောင်"
    narration: >
      [[mark:draw-proto]] ဒီ ခန့်မှန်းချက်တွေက အစမှာ အကြမ်းဖျင်းပဲ ရှိလို့၊ ယုံကြည်မှု ရဖို့
      အကောင်းဆုံး နည်းက prototype ဆောက်ကြည့်တာပါ။ prototype ဆိုတာ အမြန် ဆောက်ကြည့်တဲ့ အစမ်း version ပါ။
      data အသင့် ဖြစ်လား၊ အဖြေ မြန်လား၊ မှန်လား ဆိုတာ စာဖတ်ပြီး ခန့်မှန်းတာထက် ဆောက်ကြည့်ရင် ပိုမြန်မြန်
      သိရပါတယ်။ [[mark:draw-loop]] ဒါကြောင့် အသေးလေး ဆောက်၊ စောင့်ကြည့်ပြီး ဆက်တိုက် ပြင်သွားပါ။ AI code
      tool တွေနဲ့ဆိုရင် prototype ကို အရမ်း မြန်မြန် ရေးလို့ ရပါတယ်။ [[mark:draw-vibe]] ဒါပေမဲ့ AI ကို
      ခိုင်းပြီး code ကို အမြန် ရေးယူတဲ့ vibe coding နဲ့ ရလာတဲ့ prototype ကို မစစ်ဘဲ production ထဲ
      မထည့်ပါနဲ့။ ရှိပြီးသား code နဲ့ ချိတ်ပုံ၊ user အတွက် လုံခြုံမှုကို အရင် စစ်ရပါမယ်။ [[mark:draw-p1]]
      prototype ဆောက်တဲ့အခါ data၊ model နဲ့ U X ပါတဲ့ flow တစ်ခုလုံးကို အစောကြီး ဆောက်ပါ။ [[mark:draw-p2]]
      API နဲ့ ကြို train ပြီးသား model လို shortcut တွေကို အရင် သုံးပါ။ [[mark:draw-p3]] input၊ output နဲ့
      user ပြင်တာတွေကို အကုန် log လုပ်ပါ။ [[mark:draw-p4]] customer တွေ တကယ် ရိုက်သလို ရှုပ်ပွနေတဲ့ data
      နဲ့ စမ်းပါ။ [[mark:draw-p5]] နောက်ဆုံး user က အမှားကို ပြောလို့ ရ၊ ရလဒ်ကို ပြင်လို့ ရအောင် feedback
      ပေးတဲ့ နည်း ထည့်ပါ။
    sources:
      - {
          title: "web.dev Learn AI: Explore use cases (Prototype)",
          url: "https://web.dev/learn/ai/use-cases",
        }
    actions:
      - {
          id: draw-proto,
          type: whiteboard.apply,
          at: { mark: draw-proto },
          clear: true,
          upsertIds: [r-title],
        }
      - {
          id: draw-loop,
          type: whiteboard.apply,
          at: { mark: draw-loop },
          upsertIds: [r-loop],
          drawMs: 1400,
        }
      - {
          id: draw-vibe,
          type: whiteboard.apply,
          at: { mark: draw-vibe },
          upsertIds: [r-vibe, r-vibe-x],
          drawMs: 1600,
        }
      - {
          id: draw-p1,
          type: whiteboard.apply,
          at: { mark: draw-p1 },
          upsertIds: [r-1],
          drawMs: 900,
        }
      - {
          id: draw-p2,
          type: whiteboard.apply,
          at: { mark: draw-p2 },
          upsertIds: [r-2],
          drawMs: 900,
        }
      - {
          id: draw-p3,
          type: whiteboard.apply,
          at: { mark: draw-p3 },
          upsertIds: [r-3],
          drawMs: 900,
        }
      - {
          id: draw-p4,
          type: whiteboard.apply,
          at: { mark: draw-p4 },
          upsertIds: [r-4],
          drawMs: 900,
        }
      - {
          id: draw-p5,
          type: whiteboard.apply,
          at: { mark: draw-p5 },
          upsertIds: [r-5],
          drawMs: 900,
        }

  - id: prototype-code
    chapter: "Menu search prototype"
    narration: >
      [[mark:close-proto]] ဒါဆို smart filter ကို menu search prototype အဖြစ် ဆောက်ကြည့်ရအောင်။
      [[mark:panel-ready]] ညာဘက်က AI panel က prototype ရဲ့ ရလဒ်ကို ပြပေးပါတယ်။ [[mark:open-main]] ဒီ
      စာရင်းက customer တွေ ရိုက်ရှာမယ့် ပုံစံအတိုင်း lesson အတွက် ပြင်ဆင်ထားတဲ့ နမူနာ search
      ခြောက်ခုပါ။ မြန်မာ စကားကို အင်္ဂလိပ် စာလုံးနဲ့ ရိုက်တာ၊ အင်္ဂလိပ်လို ရိုက်တာ၊ ကိုယ့်စကားနဲ့ ရိုက်တာ
      ရောထားတာက ရှုပ်ပွနေတဲ့ data နဲ့ စမ်းဖို့ပါ။ [[mark:sel-steps]] search တစ်ခုစီကို ဒီ step တွေက
      အစဉ်လိုက် ရှာပေးပါတယ်။ အခုတော့ website မှာ သုံးနေတဲ့ နာမည်နဲ့ ရှာတဲ့ step တစ်ခုပဲ ရှိပါသေးတယ်။
      [[mark:read-keyword]] Plain code card မှာ မုန့်ဟင်းခါး တစ်ခုပဲ တွေ့ပြီး၊ ကျန်တဲ့ ငါးခုက ဘာမှ
      မတွေ့ပါဘူး။ AI မပါတဲ့ code ဖြစ်လို့ card ရဲ့ badge ကလည်း AI မပါဘူးလို့ ပြနေပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Explore use cases (Prototype: test with real data)",
          url: "https://web.dev/learn/ai/use-cases",
        }
      - {
          title: "web.dev Learn AI: Introduction to AI on the web (Opportunity: use case)",
          url: "https://web.dev/learn/ai/introduction",
        }
    actions:
      - { id: close-proto, type: whiteboard.apply, at: { mark: close-proto }, open: false }
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-done
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: ai-status }
        attribute: { name: data-state, value: "done" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-one-card
        type: expect.preview
        at: { afterAction: expect-done }
        timeoutMs: 5000
        target: { by: testId, value: ai-cards }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-search-rows
        type: expect.preview
        at: { afterAction: expect-one-card }
        timeoutMs: 5000
        target: { by: testId, value: ai-search }
        attribute: { name: data-count, value: "6" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - { id: open-main, type: workspace.openFile, at: { mark: open-main }, path: src/main.js }
      - id: sel-searches
        type: editor.select
        at: { afterAction: open-main }
        target: { file: src/main.js, text: "const searches = [", occurrence: 1 }
      - id: sel-steps
        type: editor.select
        at: { mark: sel-steps }
        target: { file: src/main.js, text: "const steps = [\n  keywordSearch,\n];", occurrence: 1 }
      - id: expect-keyword-found
        type: expect.preview
        at: { mark: read-keyword }
        timeoutMs: 5000
        target: { by: testId, value: ai-search-1 }
        textContains: "keyword"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-keyword-miss
        type: expect.preview
        at: { afterAction: expect-keyword-found }
        timeoutMs: 5000
        target: { by: testId, value: ai-search-2 }
        textContains: "laphet yay——"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-badge
        type: expect.preview
        at: { afterAction: expect-keyword-miss }
        timeoutMs: 5000
        target: { by: testId, value: ai-search-badge }
        textContains: "rules · AI မပါ"
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: synonyms
    narration: >
      [[mark:open-search]] AI မသုံးခင် သာမန် code နဲ့ ဘယ်လောက်ထိ ရလဲ အရင် ကြည့်ရအောင်။ ဒီ စာရင်းက customer
      တွေ သုံးတဲ့ စကားလုံးကို menu ရဲ့ tag နဲ့ တွဲပေးထားတဲ့ အဓိပ္ပာယ်တူ စကားလုံး စာရင်းပါ။ ရှာမတွေ့တဲ့
      search တွေကို ကြည့်ပြီး လက်နဲ့ ရေးထားတာမို့ model မလိုပါဘူး။ [[mark:type-synonym]] ဒီ စာရင်းနဲ့
      ရှာတဲ့ step ကို ဒုတိယ step အဖြစ် ထည့်ပါမယ်။ [[mark:read-synonym]] ခြောက်ခုထဲက လေးခု တွေ့သွားပါပြီ။
      မြန်မာ စကားကို အင်္ဂလိပ် စာလုံးနဲ့ ရိုက်တဲ့ လက်ဖက်ရည်လည်း ပါပါတယ်။ ရှာမတွေ့တဲ့ ပြဿနာ
      အများစုကို AI မပါဘဲ ဖြေရှင်းလို့ ရတာပါ။ ကျန်တဲ့ နှစ်ခုကတော့ customer က မလိုချင်တာကို ပြောထားတာ
      ဖြစ်ပြီး၊ တစ်ခုက အင်္ဂလိပ်လိုပါ။ ဒီလို ပြောပုံမျိုးကို စကားလုံး စာရင်း တစ်ခုတည်းနဲ့ ဖြေရှင်းဖို့ ခက်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Introduction to AI on the web (Solution: data, a synonym list)",
          url: "https://web.dev/learn/ai/introduction",
        }
      - {
          title: "web.dev Learn AI: Explore use cases (Prototype)",
          url: "https://web.dev/learn/ai/use-cases",
        }
    actions:
      - {
          id: open-search,
          type: workspace.openFile,
          at: { mark: open-search },
          path: src/search.js,
        }
      - id: sel-synonyms
        type: editor.select
        at: { afterAction: open-search }
        target: { file: src/search.js, text: "export const SYNONYMS = {", occurrence: 1 }
      - { id: open-main-2, type: workspace.openFile, at: { mark: type-synonym }, path: src/main.js }
      - id: type-synonym
        type: editor.type
        at: { afterAction: open-main-2 }
        target: { file: src/main.js, after: "  keywordSearch,\n", occurrence: 1 }
        text: "  synonymSearch,\n"
        cadence: line-by-line
      - id: expect-synonym-found
        type: expect.preview
        at: { afterAction: type-synonym }
        timeoutMs: 8000
        target: { by: testId, value: ai-search-2 }
        textContains: "laphet yaysynonymလက်ဖက်ရည်"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-synonym-cold
        type: expect.preview
        at: { mark: read-synonym }
        timeoutMs: 5000
        target: { by: testId, value: ai-search-3 }
        textContains: "synonymသံပုရာရည်၊ ဖာလူဒါ"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-synonym-hot
        type: expect.preview
        at: { afterAction: expect-synonym-cold }
        timeoutMs: 5000
        target: { by: testId, value: ai-search-4 }
        textContains: "synonymလက်ဖက်ရည်၊ ကော်ဖီ"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-left-1
        type: expect.preview
        at: { afterAction: expect-synonym-hot }
        timeoutMs: 5000
        target: { by: testId, value: ai-search-5 }
        textContains: "မစပ်တဲ့ မနက်စာ——"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-left-2
        type: expect.preview
        at: { afterAction: expect-left-1 }
        timeoutMs: 5000
        target: { by: testId, value: ai-search-6 }
        textContains: "not too sweet——"
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: ai-step
    chapter: "AI shortcut နဲ့ log"
    narration: >
      [[mark:open-ai]] ဒီ နှစ်ခုအတွက် AI shortcut ကို သုံးပါမယ်။ model ကို ကိုယ်တိုင် train မလုပ်ဘဲ၊ ကြို
      train ပြီးသား model ကို ဘာလုပ်ရမလဲ ပြောတဲ့ prompt နဲ့ ခိုင်းတာပါ။ [[mark:sel-tags]] ဒီ prompt က
      customer ရှာတဲ့ စာကို စာရင်းထဲက menu tag တွေအဖြစ် ပြောင်းခိုင်းပြီး၊ [[mark:sel-json]] လိုချင်တာနဲ့
      ရှောင်ချင်တာကို JSON နဲ့ ပြန်ပေးခိုင်းထားပါတယ်။
      [[mark:type-ai]] main ဖိုင်မှာ ရှာမတွေ့တဲ့ search တွေကိုပဲ ဒီ AI step ဆီ ပို့ပါမယ်။ ဒါကြောင့် model
      ကို ခေါ်ရတာလည်း နည်းပါတယ်။ [[mark:read-ai]] panel မှာ AI log card ပေါ်လာပါပြီ။ ဒီ အဖြေတွေက open
      model သေးသေးလေး တစ်ခုကို laptop ပေါ်မှာ ဒီ prompt နဲ့ ကြိုပြီး run ထားတုန်းက တကယ် ထွက်လာခဲ့တဲ့
      အဖြေတွေပါ။ ဒါကြောင့် ဘယ်သူ ကြည့်ကြည့် အဖြေ တူတူပဲ မြင်ရမှာ ဖြစ်ပြီး၊ badge ကလည်း ကြိုမှတ်ထားတဲ့
      အဖြေလို့ ပြနေပါတယ်။ [[mark:read-ai-1]] မစပ်တဲ့ မနက်စာ အတွက် model က လိုချင်တဲ့ tag အဖြစ် မနက်စာ ကို
      ပေးလို့ မုန့်ဟင်းခါး၊ ပလာတာ၊ အီကြာကွေး ကို တွေ့ပါတယ်။ ဒါပေမဲ့ ရှောင်ရမယ့် tag ထဲမှာ ဘာမှ
      မထည့်ခဲ့လို့ မစပ်တဲ့ ဆိုတဲ့ အချက် ပျောက်သွားပါတယ်။ menu ထဲက မနက်စာ တွေက မစပ်တာချည်း ဖြစ်နေလို့သာ
      ရလဒ် မှန်နေတာပါ။
      [[mark:read-ai-2]] အင်္ဂလိပ်လို ရှာတဲ့ ဒုတိယ search မှာ customer က သိပ် မချိုတာကို လိုချင်တာပါ။
      ဒါပေမဲ့ model က အချို tag ကို လိုချင်တဲ့ဘက်မှာ ထည့်ထားလို့၊ ချိုတဲ့ လက်ဖက်ရည်နဲ့ ဖာလူဒါကို
      ပြနေပါတယ်။ customer လိုချင်တာနဲ့ ပြောင်းပြန် ဖြစ်နေပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Explore use cases (Prototype: start with shortcuts, log everything)",
          url: "https://web.dev/learn/ai/use-cases",
        }
      - {
          title: "Gemma 4 E2B instruct, 4-bit GGUF (the recorded model)",
          url: "https://huggingface.co/unsloth/gemma-4-E2B-it-GGUF",
        }
    actions:
      - { id: open-ai, type: workspace.openFile, at: { mark: open-ai }, path: src/ai.js }
      - id: sel-system
        type: editor.select
        at: { afterAction: open-ai }
        target: { file: src/ai.js, text: "export const SYSTEM = [", occurrence: 1 }
      - id: sel-tags
        type: editor.select
        at: { mark: sel-tags }
        target: { file: src/ai.js, text: "Turn it into menu tags.", occurrence: 1 }
      - id: sel-json
        type: editor.select
        at: { mark: sel-json }
        target:
          { file: src/ai.js, text: "Reply with one JSON object and nothing else", occurrence: 1 }
      - { id: open-main-3, type: workspace.openFile, at: { mark: type-ai }, path: src/main.js }
      - id: type-ai
        type: editor.type
        at: { afterAction: open-main-3 }
        target:
          { file: src/main.js, after: "// The searches plain code can't find:\n", occurrence: 1 }
        text: "await showLog(menu.items, notFound, aiSearch);\n"
        cadence: line-by-line
      - id: expect-ai-done
        type: expect.preview
        at: { afterAction: type-ai }
        timeoutMs: 8000
        target: { by: testId, value: ai-status }
        attribute: { name: data-state, value: "done" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-log-card
        type: expect.preview
        at: { afterAction: expect-ai-done }
        timeoutMs: 8000
        target: { by: testId, value: ai-log }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-log-badge
        type: expect.preview
        at: { mark: read-ai }
        timeoutMs: 5000
        target: { by: testId, value: ai-log-badge }
        textContains: "recorded · Gemma 4 E2B · greedy"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-log-breakfast
        type: expect.preview
        at: { mark: read-ai-1 }
        timeoutMs: 5000
        target: { by: testId, value: ai-log-1 }
        textContains: "want: breakfast · avoid: —မုန့်ဟင်းခါး၊ ပလာတာ၊ အီကြာကွေး"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-log-sweet
        type: expect.preview
        at: { mark: read-ai-2 }
        timeoutMs: 5000
        target: { by: testId, value: ai-log-2 }
        textContains: "want: sweet · avoid: —လက်ဖက်ရည်၊ ဖာလူဒါ"
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: feedback
    narration: >
      [[mark:show-buttons]] panel ရဲ့ အပေါ်မှာ AI ရှာပေးတဲ့ search တစ်ခုစီအတွက် feedback ခလုတ် နှစ်ခုစီ
      ရှိပါတယ်။ customer တွေ နှိပ်မယ့်အတိုင်း ကိုယ် နှိပ်ကြည့်ပါမယ်။ [[mark:click-useful]] ပထမ customer
      ဆိုရင် လိုချင်တာ ရလို့ အသုံးဝင်တယ် ကို နှိပ်မှာပါ။ [[mark:click-not-useful]] ဒုတိယ customer ကတော့
      လိုချင်တာ မဟုတ်လို့ မဝင်ဘူး ကို နှိပ်မှာပါ။ [[mark:read-feedback]] AI log ရဲ့ feedback column မှာ ပထမ search အတွက်
      အမှန်ခြစ်၊ ဒုတိယ အတွက် ကြက်ခြေခတ် ပေါ်လာပါပြီ။ ဒီ prototype မှာ data၊ model နဲ့ customer နှိပ်တဲ့
      ခလုတ်အထိ flow တစ်ခုလုံး ပါပြီး၊ log ကလည်း ရှာတဲ့ စာ၊ model ရဲ့ အဖြေ၊ ရလဒ်နဲ့ feedback ကို
      တစ်နေရာတည်းမှာ ပြပါတယ်။ log ကို ကြည့်လိုက်ရင် customer က မလိုချင်တာကို ပြောတဲ့အခါ model က နှစ်ခါလုံး
      မှားတာကို တွေ့ရပါတယ်။ ဒါက ပြင်ရမယ့် failure mode ဖြစ်လို့၊ ပြင်ပြီး ထပ်စမ်းရပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Explore use cases (Prototype: log everything, add feedback and control mechanisms)",
          url: "https://web.dev/learn/ai/use-cases",
        }
    actions:
      - id: expect-buttons
        type: expect.preview
        at: { mark: show-buttons }
        timeoutMs: 5000
        target: { by: testId, value: useful-1 }
        textContains: "အသုံးဝင်တယ်"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: click-useful
        type: preview.click
        at: { mark: click-useful }
        target: { by: testId, value: useful-1 }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-useful
        type: expect.preview
        at: { afterAction: click-useful }
        timeoutMs: 5000
        target: { by: testId, value: ai-log-1 }
        textContains: "အီကြာကွေး✓"
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: click-not-useful
        type: preview.click
        at: { mark: click-not-useful }
        target: { by: testId, value: not-useful-2 }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-not-useful
        type: expect.preview
        at: { afterAction: click-not-useful }
        timeoutMs: 5000
        target: { by: testId, value: ai-log-2 }
        textContains: "ဖာလူဒါ✗"
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-same-cards
        type: expect.preview
        at: { mark: read-feedback }
        timeoutMs: 5000
        target: { by: testId, value: ai-cards }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: quiz
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ prototype ဆောက်တဲ့အခါ input၊ output နဲ့ customer ရဲ့ feedback
      တွေကို ဘာကြောင့် log လုပ်ထားသင့်တာလဲ။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]]
      အဖြေကတော့ ခဏခဏ ဖြစ်တဲ့ failure mode တွေကို ရှာတွေ့ဖို့ပါ။ ဘာကြောင့်လဲဆိုတော့ search တစ်ခုချင်းမှာ
      မသိသာတဲ့၊ ထပ်ခါထပ်ခါ ဖြစ်တဲ့ အမှားကို log က တစ်နေရာတည်းမှာ စုပြလို့ပါ။ ရလဒ် မှန်နေတဲ့ မနက်စာ
      search ထဲက အမှားကိုလည်း log ကနေပဲ မြင်ရပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Explore use cases (Check your understanding)",
          url: "https://web.dev/learn/ai/use-cases",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [z-title, z-q1, z-q2, z-q3],
          drawMs: 1800,
        }
      - {
          id: draw-quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [z-a, z-a-note],
          drawMs: 1800,
        }

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:close-quiz]] ဒါဆို ပြန်ချုပ်ရရင်၊ idea တစ်ခုကို blueprint နဲ့ ချရေးပြီး ကုန်ကျစရိတ်၊ အလုပ်နဲ့
      မှားနိုင်တဲ့ ပုံစံတွေကို ခန့်မှန်းရပါတယ်။ အကျိုးကျေးဇူး များပြီး ဆောက်ရ မခက်တာကို အရင် လုပ်ပါ။
      [[mark:sel-final-steps]] prototype မှာ သာမန် code နဲ့ ရတာကို အရင် ဖြေရှင်းပြီး၊
      [[mark:sel-final-ai]] ကျန်တာကိုမှ AI shortcut နဲ့ ဖြေရှင်းပါ။ log ကို ဖတ်ပြီး ဆက်ပြင်သွားပါ။ နောက်
      lesson မှာတော့ intelligence အမျိုးအစား ပထမ တစ်ခု ဖြစ်တဲ့ predictive AI နဲ့ သူ့အတွက် data
      ပြင်ဆင်တာကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Explore use cases (Your takeaways)",
          url: "https://web.dev/learn/ai/use-cases",
        }
      - {
          title: "web.dev Learn AI: Predictive AI: Turn data into insights (next lesson)",
          url: "https://web.dev/learn/ai/predictive",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: close-quiz }, open: false }
      - id: sel-final-steps
        type: editor.select
        at: { mark: sel-final-steps }
        target: { file: src/main.js, text: "  keywordSearch,\n  synonymSearch,\n", occurrence: 1 }
      - id: sel-final-ai
        type: editor.select
        at: { mark: sel-final-ai }
        target:
          {
            file: src/main.js,
            text: "await showLog(menu.items, notFound, aiSearch);",
            occurrence: 1,
          }
      - id: expect-final-feedback
        type: expect.preview
        at: { afterAction: sel-final-ai }
        timeoutMs: 5000
        target: { by: testId, value: ai-log-2 }
        textContains: "ဖာလူဒါ✗"
        retry: { maxAttempts: 2, delayMs: 300 }
      - {
          id: expect-file-steps,
          type: expect.file,
          at: { afterAction: expect-final-feedback },
          path: src/main.js,
          contains: "  keywordSearch,\n  synonymSearch,\n];",
        }
      - {
          id: expect-file-ai,
          type: expect.file,
          at: { afterAction: expect-file-steps },
          path: src/main.js,
          contains: "await showLog(menu.items, notFound, aiSearch);",
        }
checks:
  - { type: timing.p95Ms, max: 300 }
