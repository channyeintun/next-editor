      src/ai.js: |
        // The AI shortcut: instead of training a model of our own, the prototype asks a pre-trained model
        // (with a prompt) to turn the customer's words into the menu's tags; byTags() then finds the items.
        // The model's answers were recorded ahead of time (src/llm.js, data/responses.json).
        import { generate } from "./llm.js";
        import { byTags } from "./search.js";

        export const SYSTEM = [
          "You help the menu search of Shwe Tea House, a tea shop in Yangon.",
          "A customer typed a search that the shop's word list could not match. Turn it into menu tags.",
          "Use only these tags: hot, cold, sweet, sour, milk, no-milk, breakfast, fish, soup, vegetarian, noodles, chicken, spicy, drink, food, snack.",
          'Reply with one JSON object and nothing else, no code fences: {"want": [tags the customer asks for], "avoid": [tags the customer does not want]}',
        ].join("\n");

        export async function aiSearch(items, search) {
          const answer = await generate([{ role: "system", content: SYSTEM }, { role: "user", content: search }], { show: false });
          let tags = null;
          try {
            tags = JSON.parse(answer);
          } catch {
            // not the JSON we asked for: the log shows that nothing was found
          }
          const want = tags?.want ?? [];
          const avoid = tags?.avoid ?? [];
          return { answer, want, avoid, found: byTags(items, want, avoid) };
        }
      src/llm.js: |
        // The lesson's stand-in for a model API.
        // A real model is slow and can answer differently from run to run, so this lesson uses answers
        // recorded ahead of time from a real model: data/responses.json (how: data/PROVENANCE.md).
        // generate() returns the recorded answer for exactly these messages, and shows it in the panel.
        import recorded from "../data/responses.json";
        import { panel } from "ai-panel";

        export const model = recorded.provenance;

        const find = (messages) => {
          const key = JSON.stringify(messages.map(({ role, content }) => ({ role, content })));
          return recorded.responses.find((r) => JSON.stringify(r.messages) === key);
        };

        export async function generate(messages, { show = true } = {}) {
          const hit = find(messages);
          if (!hit) {
            const error = new Error("No recorded answer for these exact messages yet.");
            error.name = "CourseNotice";
            throw error;
          }
          if (show) panel.output("Model answer", hit.output, { id: "answer", badge: `recorded · ${model.label} · greedy` });
          return hit.output;
        }

        // The token counts the model's own tokenizer gave when the answer was recorded (the prompt includes
        // the chat template's own tokens): { promptTokens, outputTokens }, or null when not recorded.
        export function tokensFor(messages) {
          const hit = find(messages);
          return hit ? { promptTokens: hit.promptTokens, outputTokens: hit.outputTokens } : null;
        }
      src/main.js: |
