        - Runtime: node-llama-cpp 3.22.2 (llama.cpp v0.7.0, Metal GPU) on an Apple M1
        - Prompt: the model's own chat template from the GGUF file, thinking off
        - Decoding: greedy (temperature 0), at most 300 new tokens, so the same messages always give the same answer
        - Answers: 2
