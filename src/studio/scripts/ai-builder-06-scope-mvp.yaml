build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 6106
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}
scenes:
  - id: recall
    chapter: စာရင်းက ရှည်လာပြီ
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ app ကို သုံးမယ့် လူတွေဆီကနေ requirement တွေကို ရှာပြီး ဒီ ဖိုင်ထဲမှာ ရေးခဲ့ပါတယ်။
      [[mark:sel-stories]] customer၊ ကောင်တာနဲ့ ဆိုင်ပိုင်ရှင် ဘက်က story တွေ၊ app ဘယ်လောက် ကောင်းရမလဲ ဆိုတာနဲ့
      ရွေးလို့ မရတဲ့ ကန့်သတ်ချက်တွေ ပါပါတယ်။ [[mark:w-open]] ဒါပေမဲ့ requirement တွေကို စုနေတုန်းမှာ လူတွေက
      လိုချင်တာ အသစ်တွေကိုလည်း ထပ်ပြောခဲ့ကြပါတယ်။ အားလုံးကို စာရင်း တစ်ခုထဲ စုကြည့်ရအောင်။ [[mark:w-must]]
      ပထမ နှစ်ကြောင်းကတော့ story တွေ အလုပ်ဖြစ်ဖို့ လိုတဲ့ အချက်တွေပါ။ ကြိုမှာတာ၊ လာယူချိန် ရွေးတာ၊ ကောင်တာမှာ
      ပြောပြီး ယူလို့ရမယ့် အော်ဒါနံပါတ်နဲ့ ကောင်တာစာရင်း ဖြစ်ပါတယ်။ [[mark:w-sms]] ကောင်တာက လှလှ က အော်ဒါ အသင့်ဖြစ်ရင် customer ဆီ SMS ပို့ချင်တယ်လို့
      ပြောခဲ့ပါတယ်။ [[mark:w-could]] member အောင်အောင် က menu မှာ ပုံလေးတွေ ပါစေချင်ပြီး၊ ကျောင်းသား မောင်မောင်
      က ပစ္စည်း အမျိုးမျိုးကို တစ်ခါတည်း မှာချင်ပါတယ်။ [[mark:w-wont]] ဆိုင်ပိုင်ရှင် ကတော့ delivery ကို ထည့်နိုင်မလား ထပ်မေးခဲ့ပါတယ်။
      agent ကို ဒီ ဖိုင် ပေးပြီး ထပ်ထည့်သင့်တာတွေ စာရင်းလုပ်ခိုင်းကြည့်တော့၊ customer account နဲ့ login စာမျက်နှာ ပါလာတယ် ဆိုပါစို့။
      [[mark:w-pay]] online နဲ့ ငွေချေလို့ ရရင်ကော ဆိုတဲ့ မေးခွန်းလည်း ဆိုင်ပိုင်ရှင် ဆီက ပါလာပါတယ်။ စာရင်းက ရှည်လာပါပြီ။ ဒါတွေ
      အားလုံးကို ပထမ version မှာ ထည့်မလား။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The new SDLC (requirements and planning)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: sel-stories,
          type: editor.select,
          at: { mark: sel-stories },
          target: { file: docs/requirements.md, text: "## User stories", occurrence: 1 },
        }
      - {
          id: draw-w-open,
          type: whiteboard.apply,
          at: { mark: w-open },
          open: true,
          clear: true,
          upsertIds: [w-title],
        }
      - {
          id: draw-w-must,
          type: whiteboard.apply,
          at: { mark: w-must },
          upsertIds: [w-1, w-2],
          drawMs: 1600,
        }
      - {
          id: draw-w-sms,
          type: whiteboard.apply,
          at: { mark: w-sms },
          upsertIds: [w-3],
          drawMs: 900,
        }
      - {
          id: draw-w-could,
          type: whiteboard.apply,
          at: { mark: w-could },
          upsertIds: [w-4],
          drawMs: 1100,
        }
      - {
          id: draw-w-wont,
          type: whiteboard.apply,
          at: { mark: w-wont },
          upsertIds: [w-5],
          drawMs: 1000,
        }
      - {
          id: draw-w-pay,
          type: whiteboard.apply,
          at: { mark: w-pay },
          upsertIds: [w-6],
          drawMs: 800,
        }

  - id: cost
    chapter: Feature တိုင်းမှာ ကုန်ကျစရိတ် ရှိတယ်
    narration: >
      [[mark:c-title]] agent ရှိတော့ feature တစ်ခု၊ ဆိုလိုတာက app ရဲ့ လုပ်ဆောင်ချက် တစ်ခုကို ထပ်ထည့်တာ အလကားလို
      ထင်ရပါတယ်။ ခိုင်းလိုက်ရုံနဲ့ code ကို မိနစ်ပိုင်းအတွင်း ထုတ်ပေးနိုင်လို့ပါ။ [[mark:c-build]] ဒါပေမဲ့ ဆောက်တာက
      feature တစ်ခုရဲ့ ကုန်ကျစရိတ်ထဲက တစ်ပိုင်းပဲ ဖြစ်ပါတယ်။ agent က မြန်အောင် လုပ်ပေးနိုင်တာလည်း ဒီ အပိုင်းပါ။
      [[mark:c-check]] ဆောက်ပြီးရင် မှန်မမှန် စစ်ရပါတယ်။ ပုံမှန် အော်ဒါ တစ်ခုတင် မဟုတ်ဘဲ မှားနိုင်တဲ့ နေရာတွေကိုပါ
      စစ်ရပါတယ်။ [[mark:c-run]] ပြီးတော့ customer တွေ သုံးနေသရွေ့ app ကို အမြဲ အလုပ်လုပ်နေအောင် run ထားရပြီး၊
      ပျက်ရင် ပြင်ရပါတယ်။ SMS ပို့ဖို့ဆိုရင် အပြင်က service ကို ငွေပေးပြီး သုံးရလေ့ ရှိလို့ လစဉ် ကုန်ကျစရိတ်လည်း
      တိုးပါတယ်။ [[mark:c-explain]] နောက်ဆုံး ကောင်တာက လှလှ နဲ့ customer တွေကို feature အသစ် ဘယ်လို သုံးရလဲ
      ရှင်းပြရပါတယ်။ [[mark:c-note]] ဆိုလိုတာက ကုန်ကျစရိတ်က ပျောက်သွားတာ မဟုတ်ဘဲ၊ code ရိုက်တာကနေ စစ်တာ၊ run
      ထားတာ၊ ရှင်းပြတာဆီကို ရွှေ့သွားတာပါ။ ဒီ အလုပ်တွေကို ကိုယ် တစ်ယောက်တည်း လုပ်ရမှာမို့၊ feature တစ်ခု
      ထပ်ထည့်တိုင်း ကိုယ့် အချိန် ကုန်ပါတယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The economics of AI development",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "The New SDLC (Burmese edition): The new SDLC",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: draw-c-title,
          type: whiteboard.apply,
          at: { mark: c-title },
          open: true,
          clear: true,
          upsertIds: [c-title],
        }
      - {
          id: draw-c-build,
          type: whiteboard.apply,
          at: { mark: c-build },
          upsertIds: [c-1, c-1b],
          drawMs: 1200,
        }
      - {
          id: draw-c-check,
          type: whiteboard.apply,
          at: { mark: c-check },
          upsertIds: [c-2],
          drawMs: 900,
        }
      - {
          id: draw-c-run,
          type: whiteboard.apply,
          at: { mark: c-run },
          upsertIds: [c-3],
          drawMs: 900,
        }
      - {
          id: draw-c-explain,
          type: whiteboard.apply,
          at: { mark: c-explain },
          upsertIds: [c-4],
          drawMs: 900,
        }
      - {
          id: draw-c-note,
          type: whiteboard.apply,
          at: { mark: c-note },
          upsertIds: [c-box, c-mine, c-note],
          drawMs: 1600,
        }

  - id: mvp
    chapter: MVP ဆိုတာ ဘာလဲ
    narration: >
      [[mark:close-c]] ဒါဆို ပထမ version မှာ ဘာတွေ ပါသင့်လဲ။ [[mark:open-problem]] ဖြေဖို့ problem ဖိုင်ကို ပြန်ကြည့်ရအောင်။
      [[mark:sel-know]] ဒီ အပိုင်းမှာ ပြဿနာ ပြေပြီလား ဆိုတာကို ဘယ် ကိန်းဂဏန်းတွေနဲ့ တိုင်းမလဲ ဆုံးဖြတ်ထားခဲ့ပါတယ်။
      [[mark:mvp]] ပထမ version ရဲ့ အဓိက အလုပ်က ဒီ ကိန်းဂဏန်းတွေ တကယ် ပြောင်းမပြောင်း စမ်းကြည့်နိုင်ဖို့ပါ။ ပြဿနာ
      ပြေမပြေကို တကယ့် လူတွေနဲ့ စမ်းနိုင်တဲ့ အသေးဆုံး version ကို MVP၊ minimum viable product လို့
      ခေါ်ပါတယ်။ [[mark:mvp-not]] MVP ဆိုတာ အရာအားလုံးကို နည်းနည်းစီ ညံ့ညံ့ ဆောက်ထားတာ မဟုတ်ပါဘူး။ customer က
      ကြိုမှာတာကနေ ကောင်တာက လှလှ အော်ဒါကို မြင်တာ၊ customer လာယူသွားတာ အထိ လမ်း တစ်လမ်းလုံး တကယ် အလုပ်လုပ်ရပါမယ်။
      အဲဒီ လမ်း တစ်လမ်း ရှိရင်ပဲ customer တွေ တန်းထဲကနေ ပြန်ထွက်သွားတာ နည်းလာလား ဆိုတာကို တိုင်းလို့ ရပါပြီ။
    sources:
      - {
          title: "Agile Alliance: What is a Minimum Viable Product (MVP)?",
          url: "https://www.agilealliance.org/glossary/mvp/",
        }
      - {
          title: "GOV.UK Service Manual: How the alpha phase works",
          url: "https://www.gov.uk/service-manual/agile-delivery/how-the-alpha-phase-works",
        }
    actions:
      - { id: close-c, type: whiteboard.apply, at: { mark: close-c }, open: false }
      - {
          id: open-problem,
          type: workspace.openFile,
          at: { mark: open-problem },
          path: docs/problem.md,
        }
      - {
          id: sel-know,
          type: editor.select,
          at: { mark: sel-know },
          target:
            {
              file: docs/problem.md,
              text: "- မဝယ်ဘဲ ပြန်သွားတဲ့ customer — တစ်မနက် 3 ယောက်အောက်\n- ကြိုမှာတဲ့ အော်ဒါ — တစ်မနက် 20 နဲ့ အထက်\n",
              occurrence: 1,
            },
        }

  - id: slice
    narration: >
      [[mark:l-open]] ဒါကို ပုံနဲ့ ကြည့်ရအောင်။ app မှာ အလွှာ သုံးလွှာ ရှိတယ်လို့ မြင်ကြည့်ပါ။ customer ရဲ့ ဖုန်း
      screen၊ အော်ဒါကို သိမ်းတဲ့ အပိုင်းနဲ့ ကောင်တာက စာရင်းပါ။ [[mark:l-thick]] တစ်နည်းက ဖုန်း screen အလွှာကို
      အရင် အကုန် ပြီးအောင် ဆောက်တာပါ။ menu ပုံတွေ၊ login၊ ရောင်စုံ ဒီဇိုင်း အကုန် ပါလာပေမယ့်၊ အော်ဒါတွေက
      ကောင်တာကို မရောက်သေးပါဘူး။ အပတ်တွေ ကြာသွားပေမယ့် customer တစ်ယောက်မှ တကယ် မှာလို့ မရသေးပါဘူး။
      [[mark:l-thin]] နောက်တစ်နည်းကတော့ အလွှာ သုံးလွှာလုံးကို ဖြတ်သွားတဲ့ ပါးပါး အချပ်လေး တစ်ချပ်ကို အရင်
      ဆောက်တာပါ။ ရိုးရိုး form တစ်ခု၊ အော်ဒါ သိမ်းတာနဲ့ ကောင်တာမှာ စာရင်း ပြတာ ပါပါတယ်။ ရောင်စုံ ဒီဇိုင်းနဲ့ ပုံတွေ မပါသေးပါဘူး။
      ဒါပေမဲ့ အော်ဒါ တစ်ခုက အစကနေ အဆုံးထိ တကယ် ရောက်ပါတယ်။ [[mark:l-win]] ဒီ ပါးပါး အချပ်ကို ဆိုင်မှာ
      စမ်းသုံးပြီး ခုနက ကိန်းဂဏန်းတွေကို တိုင်းလို့ ရပါတယ်။ ဒါကြောင့် အရာ အားလုံးကို တစ်ဝက်စီ ဆောက်ထားတာထက်၊
      အစအဆုံး အလုပ်လုပ်တဲ့ အသေးလေးက ပိုတန်ဖိုး ရှိပါတယ်။
    sources:
      - {
          title: "The Humanizing Work Guide to Splitting User Stories",
          url: "https://www.humanizingwork.com/the-humanizing-work-guide-to-splitting-user-stories/",
        }
      - {
          title: "Agile Alliance: What is a Minimum Viable Product (MVP)?",
          url: "https://www.agilealliance.org/glossary/mvp/",
        }
    actions:
      - {
          id: draw-l-open,
          type: whiteboard.apply,
          at: { mark: l-open },
          open: true,
          clear: true,
          upsertIds: [l-title, l-a1, l-f1, l-a2, l-f2, l-a3, l-f3],
          drawMs: 2200,
        }
      - {
          id: draw-l-thick,
          type: whiteboard.apply,
          at: { mark: l-thick },
          upsertIds: [l-thick-box, l-thick, l-n1],
          drawMs: 1500,
        }
      - {
          id: draw-l-thin,
          type: whiteboard.apply,
          at: { mark: l-thin },
          upsertIds: [l-thin-box, l-thin-arrow, l-n2],
          drawMs: 1800,
        }

  - id: moscow
    chapter: Must၊ Should၊ Could၊ Won't
    narration: >
      [[mark:w-reopen]] ခုနက လိုချင်တာ စာရင်းကို ပြန်ကြည့်ရအောင်။ ဒီ စာရင်းကို အုပ်စု လေးစု ခွဲပါမယ်။ ဒီလို ခွဲတဲ့
      နည်းကို MoSCoW လို့ ခေါ်ပါတယ်။ [[mark:k-must]] ပထမ အုပ်စု Must ကတော့ မဖြစ်မနေ ပါရမယ့် အရာတွေပါ။ မပါရင်
      ပထမ version နဲ့ ပြဿနာကို စမ်းလို့ မရတော့ပါဘူး။ ပထမ နှစ်ကြောင်းက ဒီ အုပ်စုထဲ ရောက်ပါတယ်။
      [[mark:k-should]] ဒုတိယ Should ကတော့ အရေးကြီးပေမယ့် မပါလည်း app အလုပ်ဖြစ်နေဆဲ အရာတွေပါ။ SMS မပါရင်လည်း
      customer က သူ ရွေးထားတဲ့ အချိန်မှာ လာယူလို့ ရပါတယ်။ [[mark:k-could]] တတိယ Could ကတော့ အချိန် ပိုမှ လုပ်မယ့်
      အရာတွေပါ။ အချိန် မလောက်ရင် အရင်ဆုံး ဖြုတ်ရမယ့် အုပ်စုလည်း ဖြစ်ပါတယ်။ [[mark:k-wont]] နောက်ဆုံး Won't
      ကတော့ ဒီ version မှာ မလုပ်ဘူးလို့ သဘောတူ ဆုံးဖြတ်ထားတဲ့ အရာတွေပါ။ delivery နဲ့ login ကို ဒီထဲ ထည့်ပါတယ်။
      [[mark:k-q]] online ငွေချေတာကိုတော့ ချန်ထားပြီး၊ နောက်မှ အတူတူ ဆုံးဖြတ်ကြည့်ပါမယ်။
    sources:
      - {
          title: "Agile Business Consortium: What is MoSCoW Prioritization?",
          url: "https://www.agilebusiness.org/resource/what-is-moscow-prioritization/",
        }
    actions:
