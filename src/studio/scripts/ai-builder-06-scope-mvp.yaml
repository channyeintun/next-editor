#
# Start state (ws/): base-docs (package.json with a no-op dev script, notes.md), docs/problem.md pinned
# in full (COURSE-KIT §4.1) and docs/requirements.md pinned as L05 leaves it (COURSE-KIT §4.2 from the
# title through ## Constraints, ending with one \n). Nothing runs. The lesson types ## Scope (v1):
# Must (3) and Should (1) after the MoSCoW board, Won't (for now) with delivery and login before the
# quiz, and the online-payment line under Won't after the quiz answer, so the file ends exactly as the
# binder (and L07's pinned start, `login\n\n`).
#
# Boards: (W) the wish list, items white, re-opened later and sorted by coloured labels (Must green,
# Should blue, Could white, Won't red, ? orange); (C) one feature's four costs (build violet, the rest
# boxed orange as our time); (L) layers vs a thin slice (red thick layer, green slice); (Z) quiz.
#
