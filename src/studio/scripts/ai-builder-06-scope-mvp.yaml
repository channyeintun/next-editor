          upsertIds: [w-title, w-1, w-2, w-3, w-4, w-5, w-6],
        }
      - {
          id: draw-k-must,
          type: whiteboard.apply,
          at: { mark: k-must },
          upsertIds: [k-must],
          drawMs: 600,
        }
      - {
          id: draw-k-should,
          type: whiteboard.apply,
          at: { mark: k-should },
          upsertIds: [k-should],
          drawMs: 600,
        }
      - {
          id: draw-k-could,
          type: whiteboard.apply,
          at: { mark: k-could },
          upsertIds: [k-could],
          drawMs: 600,
        }
      - {
          id: draw-k-wont,
          type: whiteboard.apply,
          at: { mark: k-wont },
          upsertIds: [k-wont],
          drawMs: 600,
        }
      - { id: draw-k-q, type: whiteboard.apply, at: { mark: k-q }, upsertIds: [k-q], drawMs: 500 }

  - id: scope-must
    narration: >
      [[mark:close-w]] ဒီ ဆုံးဖြတ်ချက်တွေကို ဖိုင်ထဲမှာ ရေးထားရအောင်။ [[mark:open-req]] မဖြစ်မနေ လုပ်ရမယ့် Must တွေကနေ
      စပါမယ်။ [[mark:type-must]] အောက်ဆုံးမှာ ပထမ version ရဲ့ scope ဆိုတဲ့ အပိုင်း အသစ် ထည့်ပါတယ်။ scope
      ဆိုတာ ဒီတစ်ခါ လုပ်မယ့် အရာနဲ့ မလုပ်မယ့် အရာကြားက မျဉ်းပါ။ Must အောက်က သုံးခု ပေါင်းလိုက်တာ ကိုယ်တို့ရဲ့ MVP
      ပါ။ [[mark:sel-counter]] ဒီ ကောင်တာစာရင်းက ခုနက ပါးပါး အချပ်ရဲ့ အောက်ဆုံး အလွှာပါ။ ဒါ မပါရင် အော်ဒါတွေက
      လှလှ ဆီ မရောက်ဘဲ လမ်းတစ်ဝက်မှာ ပြတ်နေပြီး၊ ပြဿနာ ပြေမပြေကို စမ်းလို့ မရတော့ပါဘူး။ [[mark:type-should]]
      Should အောက်မှာတော့ SMS ကို ထည့်ပါတယ်။ အချိန် ရရင် လုပ်မယ်၊ မရရင်လည်း ပထမ version ကို ထုတ်လို့ ရတယ် ဆိုတဲ့
      သဘောပါ။ [[mark:could-note]] Could အုပ်စုကိုတော့ ဒီ စာမျက်နှာမှာ မရေးပါဘူး။ ကိုယ် တစ်ယောက်တည်း ဆောက်တာမို့
      ပထမ version မှာ အချိန် ပိုမယ် မထင်လို့ပါ။ menu ပုံနဲ့ ပစ္စည်း အမျိုးမျိုး မှာတာကို app ကို တကယ် သုံးပြီးမှ
      ပြန်ကြည့်ပါမယ်။
    sources:
      - {
          title: "Agile Business Consortium: What is MoSCoW Prioritization?",
          url: "https://www.agilebusiness.org/resource/what-is-moscow-prioritization/",
        }
      - {
          title: "Agile Alliance: What is a Minimum Viable Product (MVP)?",
          url: "https://www.agilealliance.org/glossary/mvp/",
        }
    actions:
      - { id: close-w, type: whiteboard.apply, at: { mark: close-w }, open: false }
      - {
          id: open-req,
          type: workspace.openFile,
          at: { mark: open-req },
          path: docs/requirements.md,
        }
      - id: type-must
        type: editor.type
        at: { mark: type-must }
        target: { file: docs/requirements.md, after: "စနေ–တနင်္ဂနွေ 7:00–21:00\n", occurrence: 1 }
        text: "\n## Scope (v1)\nMust\n- လာယူမယ့် အချိန်နဲ့ ကြိုမှာလို့ရတာ\n- အော်ဒါနံပါတ်\n- ကောင်တာမှာ အော်ဒါစာရင်း မြင်ရတာ\n"
        cadence: line-by-line
      - {
          id: expect-must,
          type: expect.file,
          at: { afterAction: type-must },
          path: docs/requirements.md,
          contains: "## Scope (v1)\nMust\n- လာယူမယ့် အချိန်နဲ့ ကြိုမှာလို့ရတာ",
        }
      - {
          id: sel-counter,
          type: editor.select,
          at: { mark: sel-counter },
          target:
            { file: docs/requirements.md, text: "- ကောင်တာမှာ အော်ဒါစာရင်း မြင်ရတာ", occurrence: 1 },
        }
      - id: type-should
        type: editor.type
        at: { mark: type-should }
        target:
          { file: docs/requirements.md, after: "- ကောင်တာမှာ အော်ဒါစာရင်း မြင်ရတာ\n", occurrence: 1 }
        text: "Should\n- အော်ဒါ အသင့်ဖြစ်ရင် SMS ပို့တာ\n"
        cadence: line-by-line

  - id: wont
    narration: >
      [[mark:type-wont]] နောက်ဆုံး Won't အောက်မှာ delivery နဲ့ login ကို ရေးပါမယ်။ ဒီ အကြံတွေကို ပယ်လိုက်တာ
      မဟုတ်ပါဘူး။ ပထမ version ကို အချိန်မီ ထုတ်နိုင်ဖို့ ဆိုင်ပိုင်ရှင် နဲ့ အတူ ချထားတဲ့ ဆုံးဖြတ်ချက်ပါ။ [[mark:sel-delivery-w]]
      ရေးထားရင် ဘာအကျိုး ရှိလဲ ဆိုတော့၊ နောက်တစ်ပတ်မှာ delivery လေးလည်း ထည့်ရင် ကောင်းမယ် ဆိုတဲ့ စကား ပြန်ပေါ်လာရင်၊
      ဆိုင်ပိုင်ရှင် နဲ့ သဘောတူထားတဲ့ ဒီ စာကြောင်းကို ပြန်ပြလို့ ရပါတယ်။ ဒါမှ customer တွေဆီ app ရောက်မယ့် ရက်ကို
      ထိန်းထားနိုင်မှာပါ။ [[mark:sel-login]] agent ဆီကလည်း ခိုင်းထားတာထက် ပိုတာတွေ ထွက်လာနိုင်ပါတယ်။ ဥပမာ order
      form တစ်ခု ခိုင်းရင်တောင် login စာမျက်နှာ ပါလာနိုင်ပါတယ်။ agent ကို ဒီ ဖိုင် ဖတ်ခိုင်းထားရင်၊ login က ဒီ
      version ထဲ မပါဘူး ဆိုတာ စာထဲမှာ ရှိနေပါပြီ။ ဒါပေမဲ့ ထွက်လာတာကို ဒီ စာရင်းနဲ့ တိုက်စစ်ပြီး scope ကို
      ထိန်းတာကတော့ ကိုယ့် တာဝန်ပါ။
    sources:
      - {
          title: "Agile Business Consortium: What is MoSCoW Prioritization?",
          url: "https://www.agilebusiness.org/resource/what-is-moscow-prioritization/",
        }
      - {
          title: "The New SDLC (Burmese edition): The new SDLC",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - id: type-wont
        type: editor.type
        at: { mark: type-wont }
        target: { file: docs/requirements.md, after: "- အော်ဒါ အသင့်ဖြစ်ရင် SMS ပို့တာ\n", occurrence: 1 }
        text: "Won't (for now)\n- delivery\n- customer account နဲ့ login\n\n"
        cadence: line-by-line
      - {
          id: sel-delivery-w,
          type: editor.select,
          at: { mark: sel-delivery-w },
          target: { file: docs/requirements.md, text: "- delivery\n", occurrence: 1 },
        }
      - {
          id: sel-login,
          type: editor.select,
          at: { mark: sel-login },
          target: { file: docs/requirements.md, text: "- customer account နဲ့ login", occurrence: 1 },
        }

  - id: quiz
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ ခုနက ချန်ထားခဲ့တဲ့ online ငွေချေတာကို ပထမ version မှာ Must ထဲ
      ထည့်မလား၊ Won't ထဲ ထည့်မလား။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] အဖြေကတော့
      Won't ပါ။ ဘာကြောင့်လဲဆိုတော့ ငွေနဲ့ ဆိုင်တဲ့ အပိုင်းက risk အများဆုံး ဖြစ်လို့ပါ။ ဆိုလိုတာက မှားသွားရင်
      အနစ်နာဆုံးဖြစ်ပြီး၊ ကုန်ကျစရိတ်လည်း အများဆုံးပါ။ အပြင်က ငွေပေးချေမှု service နဲ့ ချိတ်ရမှာ ဖြစ်ပြီး၊ မှားရင်
      customer ရဲ့ ငွေကို ထိခိုက်နိုင်ပါတယ်။ [[mark:quiz-why2]] ပြီးတော့ ကောင်တာမှာ ငွေချေတာက အခုလည်း အလုပ်ဖြစ်နေပြီး၊ constraint ထဲမှာလည်း
      ရေးထားပြီးသားပါ။ online ငွေချေတာ မပါလည်း ကြိုမှာတာ အလုပ်ဖြစ်မဖြစ်ကို စမ်းလို့ ရပါတယ်။ app ကို တကယ်
      သုံးကြည့်ပြီးမှ၊ ဥပမာ လာမယူတဲ့ အော်ဒါတွေ များလာရင် ပြန်စဉ်းစားပါမယ်။
    sources:
      - {
          title: "Agile Business Consortium: What is MoSCoW Prioritization?",
          url: "https://www.agilebusiness.org/resource/what-is-moscow-prioritization/",
        }
      - {
          title: "Agile Alliance: What is a Minimum Viable Product (MVP)?",
          url: "https://www.agilealliance.org/glossary/mvp/",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [z-title, z-q, z-o1, z-o2],
          drawMs: 1800,
        }
      - {
          id: draw-quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [z-a, z-r1],
          drawMs: 1300,
        }
      - {
          id: draw-quiz-why2,
          type: whiteboard.apply,
          at: { mark: quiz-why2 },
          upsertIds: [z-r2, z-r3],
          drawMs: 1300,
        }

  - id: pay-line
    narration: >
      [[mark:close-quiz]] ဒီ ဆုံးဖြတ်ချက်ကိုလည်း ဖိုင်ထဲမှာ ချက်ချင်း ရေးထားရအောင်။ [[mark:type-pay]] Won't ထဲမှာ
      delivery ရဲ့ အောက်က တစ်ကြောင်းအဖြစ် ထည့်လိုက်ပါတယ်။ ဆုံးဖြတ်ပြီးသား ကိစ္စကို နောက်မှ ပြန်ငြင်းခုံနေစရာ
      မလိုအောင်၊ ဆုံးဖြတ်တဲ့ နေ့မှာပဲ ရေးထားတာပါ။
    sources:
      - {
          title: "Agile Business Consortium: What is MoSCoW Prioritization?",
          url: "https://www.agilebusiness.org/resource/what-is-moscow-prioritization/",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: close-quiz }, open: false }
      - id: type-pay
        type: editor.type
        at: { mark: type-pay }
        target: { file: docs/requirements.md, after: "- delivery\n", occurrence: 1 }
        text: "- online ငွေပေးချေမှု\n"
        cadence: line-by-line
      - {
          id: expect-pay,
          type: expect.file,
          at: { afterAction: type-pay },
          path: docs/requirements.md,
          contains: "Won't (for now)\n- delivery\n- online ငွေပေးချေမှု\n- customer account နဲ့ login",
        }

  - id: recap
    chapter: ပြန်ချုပ်ရရင်
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ agent က code ကို မြန်မြန် ထုတ်ပေးနိုင်ပေမယ့် feature တိုင်းမှာ စစ်ဖို့၊ run ထားဖို့၊
      ရှင်းပြဖို့ ကုန်ကျစရိတ် ရှိနေဆဲပါ။ [[mark:sel-must-r]] ပထမ version ဟာ ပြဿနာ ပြေမပြေကို စမ်းနိုင်တဲ့
      အသေးဆုံး MVP ပါ။ အစကနေ အဆုံးထိ အလုပ်လုပ်တဲ့ ပါးပါး အချပ် ဖြစ်ရပါမယ်။ [[mark:sel-wont-r]] မလုပ်မယ့်
      အရာတွေကိုလည်း Won't အောက်မှာ ရေးထားပြီး၊ scope ကို ကိုယ်ကိုယ်တိုင် ထိန်းပါ။ နောက် lesson မှာတော့ ဒီ scope
      သေးသေးလေးထဲမှာတောင် ဘယ်သူမှ မပြောခဲ့တဲ့ အနားသတ်က အခြေအနေတွေ၊ edge case တွေနဲ့ assumption တွေကို
      ရှာသွားပါမယ်။
    sources:
      - {
          title: "Agile Alliance: What is a Minimum Viable Product (MVP)?",
          url: "https://www.agilealliance.org/glossary/mvp/",
        }
      - {
          title: "Agile Business Consortium: What is MoSCoW Prioritization?",
          url: "https://www.agilebusiness.org/resource/what-is-moscow-prioritization/",
        }
      - {
          title: "The New SDLC (Burmese edition): The economics of AI development",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: sel-must-r,
          type: editor.select,
          at: { mark: sel-must-r },
          target:
            {
              file: docs/requirements.md,
              text: "Must\n- လာယူမယ့် အချိန်နဲ့ ကြိုမှာလို့ရတာ\n- အော်ဒါနံပါတ်\n- ကောင်တာမှာ အော်ဒါစာရင်း မြင်ရတာ\n",
              occurrence: 1,
            },
        }
      - {
          id: sel-wont-r,
          type: editor.select,
          at: { mark: sel-wont-r },
          target:
            {
              file: docs/requirements.md,
              text: "Won't (for now)\n- delivery\n- online ငွေပေးချေမှု\n- customer account နဲ့ login\n",
              occurrence: 1,
            },
        }
checks:
  - { type: timing.p95Ms, max: 300 }
