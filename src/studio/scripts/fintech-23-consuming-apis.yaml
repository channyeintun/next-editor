build:
  voiceProfile:
    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 9523

runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "naive: po_1 paid, po_2 paid, po_3 paid\n"
      run-2:
        status: success
        exitCode: 0
        output: "naive: po_1 paid, po_2 paid, po_3 paid\npo_1 paid 100.00 EUR\npo_2 rejected: error body in an HTTP 200: insufficient_funds\npo_3 rejected: status, amount or currency missing\n"
      run-3:
        status: success
        exitCode: 0
        output: "naive: po_1 paid, po_2 paid, po_3 paid\npo_1 paid 100.00 EUR\npo_2 rejected: error body in an HTTP 200: insufficient_funds\npo_3 rejected: status, amount or currency missing\n0x9f2c: node-a 12 confirmations, node-b not found -> hold, alert\n"

scenes:
  - id: hook
    chapter: "External world: ကိုယ် မပိုင်တဲ့ code"
    narration: >-
      ငွေကို တကယ် ရွှေ့ပေးတာက ကိုယ့် code မဟုတ်ပါဘူး။ PSP၊ ဘဏ်၊ custodian၊ blockchain node လို
      ကိုယ် မပိုင်တဲ့ system တွေပါ။ ကိုယ့် ledger ဘယ်လောက် မှန်မှန်၊ အဲဒီ system တွေ ပြောတာကို
      စစ်မကြည့်ဘဲ ယုံလိုက်ရင် မှားတဲ့ data က ledger ထဲ တန်းဝင်လာပါတယ်။ [[mark:sel-naive]] ဒီ function
      က payout တစ်ခု ဘာဖြစ်သွားလဲ ဆိုတာ provider ကို မေးပြီး၊ HTTP status code ၂၀၀ ပြန်လာရင် ငွေ
      ပေးပြီးပြီလို့ ယူဆပါတယ်။ [[mark:sel-loop]] main က
      payout သုံးခုကို ဒီ function နဲ့ စစ်ပြီး ရလဒ်ကို တစ်ကြောင်းတည်း ထုတ်ပါတယ်။ [[mark:run-1]] run
      လိုက်ရအောင်။ [[mark:pt-naive]] သုံးခုလုံး paid လို့ ထွက်ပါတယ်။ provider တကယ် ပြန်ပို့ထားတာကို
      ကြည့်ရအောင်။ [[mark:open-resp]] ဒီဖိုင်ထဲမှာ response body တွေကို byte တစ်လုံးမှ မပြောင်းဘဲ
      ထည့်ထားပါတယ်။ [[mark:sel-po2]] ဒုတိယ payout က status code ၂၀၀ နဲ့ ပြန်လာပေမဲ့ body ထဲမှာ error
      ပါပါတယ်၊ provider ဘက်မှာ ငွေ မလောက်လို့ payout မဖြစ်ခဲ့ပါဘူး။ [[mark:sel-po3]] တတိယ payout က
      paid လို့ ဆိုပေမဲ့ amount နေရာမှာ null ပါနေပါတယ်။ ဆိုလိုတာက ယုံလို့ရတဲ့ အဖြေ တစ်ခုပဲ ရှိပေမဲ့
      ကိုယ့် system က သုံးခုလုံးကို settle လုပ်လိုက်မှာပါ။ ဒုတိယ payout ဆိုရင် ledger က user ဆီ ငွေ ပို့ပြီးပြီလို့ မှတ်ပေမဲ့ တကယ်တော့ ဘယ်ကိုမှ မရောက်ပါဘူး။
    sources:
      - {
          title: "Fintech Engineering Handbook — Consuming APIs (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#consuming-apis",
        }
      - {
          title: "Fintech Engineering Handbook — The external world (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#the-external-world",
        }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }
      - id: sel-naive
        type: editor.select
        at: { mark: sel-naive }
        target:
          {
            file: main.go,
            text: "\tif c.HTTP == 200 {\n\t\treturn c.ID + \" paid\"\n\t}",
            occurrence: 1,
          }
      - id: sel-loop
        type: editor.select
        at: { mark: sel-loop }
        target:
          { file: main.go, text: 'fmt.Println("naive:", strings.Join(says, ", "))', occurrence: 1 }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "naive: po_1 paid, po_2 paid, po_3 paid",
          timeoutMs: 8000,
        }
      - id: pt-naive
        type: console.point
        at: { mark: pt-naive }
        target: { text: "naive: po_1 paid, po_2 paid, po_3 paid", occurrence: 1 }
      - { id: open-resp, type: workspace.openFile, at: { mark: open-resp }, path: responses.go }
      - id: sel-po2
        type: editor.select
        at: { mark: sel-po2 }
        target: { file: responses.go, text: '"error":{"code":"insufficient_funds"', occurrence: 1 }
      - id: sel-po3
        type: editor.select
        at: { mark: sel-po3 }
        target: { file: responses.go, text: '"amount":null', occurrence: 1 }

  - id: boundary
    chapter: Schema ကို မယုံနဲ့
    narration: >-
      [[mark:show-boundary]] provider ရဲ့ code၊ quality၊ uptime ဘယ်ဟာကိုမှ ကိုယ် မထိန်းနိုင်ပါဘူး။
      ဒါကြောင့် တစ်ချိန်ချိန်မှာ မှားလာမယ်လို့ ကြိုယူဆပြီး ကာကွယ်ထားရပါတယ်။ ဒါက No trust ဆိုတဲ့
      မူပါ၊ ဘယ်သူ့ကိုမှ အလိုလို မယုံရဘူး ဆိုတာပါ။ [[mark:bd-2]] response ဝင်လာတဲ့ နေရာ၊ ကိုယ့် system
      ရဲ့ အစွန်းမှာ စစ်တဲ့ အဆင့် တစ်ခု ထားပါတယ်။ contract ထဲက schema အတိုင်း အမြဲ ပြန်လာမယ်လို့
      မယုံရပါဘူး၊ field ပျောက်တာ၊ type ပြောင်းတာ၊ မရှိသင့်တဲ့ နေရာမှာ null ပေါ်တာတွေ ဖြစ်တတ်လို့ပါ။
      [[mark:bd-3]] စစ်တာကတော့ ဆုံးဖြတ်ချက် ချဖို့ ကိုယ် တကယ် သုံးမယ့် field တွေကိုပဲ စစ်ပါတယ်၊ ဒီနေရာမှာ error၊ status၊ amount နဲ့ currency ပါ။ [[mark:pt-ignored]] ကျန်တဲ့ field တွေကို လုံးဝ မစစ်ပါဘူး၊ ဘာကြောင့်လဲဆိုတော့ မလိုတဲ့
      field ကိုပါ စစ်ထားရင် provider က ကိုယ် မသုံးတဲ့ field တစ်ခုကို ပြောင်းလိုက်တာနဲ့ ကိုယ့်ဘက်မှာ
      outage ဖြစ်လို့ပါ။ [[mark:bd-4]] စစ်လို့
      မှန်တဲ့ response ပဲ ledger ဆီ ရောက်ပြီး၊ မထင်ထားတာ ပါလာရင် ချက်ချင်း ငြင်းပြီး alert ပို့ပါတယ်၊ မှားနေတဲ့ data ကို default တန်ဖိုးနဲ့ ဖုံးပြီး ဆက်မသွားပါဘူး။
    sources:
      - {
          title: "Fintech Engineering Handbook — Consuming APIs (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#consuming-apis",
        }
      - {
          title: "Fintech Engineering Handbook — Principles (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#principles",
        }
    actions:
      - {
          id: show-boundary,
          type: slide.show,
          at: { mark: show-boundary, offsetMs: -700 },
          slideId: boundary-1,
        }
      - {
          id: pt-psp,
          type: slide.point,
          at: { afterAction: show-boundary },
          target: { x: 0.119, y: 0.564 },
        }
      - { id: bd-2, type: slide.show, at: { mark: bd-2 }, slideId: boundary-2 }
      - {
          id: pt-parse,
          type: slide.point,
          at: { afterAction: bd-2 },
          target: { x: 0.453, y: 0.564 },
        }
      - { id: bd-3, type: slide.show, at: { mark: bd-3 }, slideId: boundary-3 }
      - {
          id: pt-checked,
          type: slide.point,
          at: { afterAction: bd-3 },
          target: { x: 0.579, y: 0.731 },
        }
      - {
          id: pt-ignored,
          type: slide.point,
          at: { mark: pt-ignored },
          target: { x: 0.584, y: 0.831 },
        }
      - { id: bd-4, type: slide.show, at: { mark: bd-4 }, slideId: boundary-4 }
      - {
          id: pt-alert,
          type: slide.point,
          at: { afterAction: bd-4 },
          target: { x: 0.831, y: 0.642 },
        }

  - id: parse
    narration: >-
      [[mark:close-boundary]] ဒီ boundary ကို code နဲ့ ရေးကြည့်ရအောင်။ [[mark:open-main-2]] parse က
      အခု JSON ကို decode လုပ်ရုံပဲ လုပ်ပါတယ်။ [[mark:sel-wire]] Wire struct မှာ ကိုယ် သုံးမယ့် field လေးခုပဲ
      ပါပြီး၊ JSON decoder က ကျန်တဲ့ field တွေကို ဘာမှ မပြောဘဲ ကျော်သွားပါတယ်။ [[mark:sel-ptr]] amount
      ကို pointer နဲ့ ထားတာက null နဲ့ သုည ကို ခွဲသိဖို့ပါ။ ရိုးရိုး ကိန်းပြည့်ဆိုရင် null က သုည ဖြစ်သွားပြီး
      ယူရို သုည ဆိုတဲ့ တရားဝင် တန်ဖိုး တစ်ခုလို ledger ထဲ ဝင်သွားပါမယ်။ [[mark:type-checks]] parse ထဲမှာ
      စစ်ချက် နှစ်ခု ထည့်ပါမယ်။ ပထမက body ထဲမှာ error ပါရင် status code ဘာပဲ ဖြစ်ဖြစ် ငြင်းတာပါ။
      ဒုတိယက status၊ amount၊ currency ထဲက တစ်ခုခု မပါရင် ငြင်းတာပါ။ [[mark:type-loop]] main မှာ
      payout တစ်ခုချင်းကို parse နဲ့ ဖတ်ပြီး ဘာလုပ်မလဲ ဆိုတာ ထုတ်ပါမယ်။ run မလုပ်ခင် ခန့်မှန်းကြည့်ပါ၊
      သုံးခုထဲက ဘယ်နှခုကို လက်ခံမလဲ။ [[mark:run-2]] run လိုက်ရအောင်။ [[mark:pt-po1]] ပထမ payout ကို
      လက်ခံပါတယ်၊ မသုံးတဲ့ field တွေ ပါပေမဲ့ ဘာမှ မထိခိုက်ပါဘူး။
      [[mark:pt-po2]] ဒုတိယကို status code ၂၀၀ ဖြစ်နေတာတောင် error body ကြောင့် ငြင်းပါတယ်။
      [[mark:pt-po3]] တတိယကို amount မရှိလို့ ငြင်းပါတယ်။ [[mark:dock-2]] ငြင်းခံရတဲ့ payout တွေက ledger
      ထဲ မဝင်ဘဲ hold အတိုင်း ကျန်နေပြီး၊ လူ တစ်ယောက် စစ်ဖို့ ရောက်သွားပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Consuming APIs (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#consuming-apis",
        }
      - {
          title: "Go standard library — encoding/json, Unmarshal",
          url: "https://pkg.go.dev/encoding/json#Unmarshal",
        }
    actions:
      - { id: close-boundary, type: slide.close, at: { mark: close-boundary } }
      - { id: open-main-2, type: workspace.openFile, at: { mark: open-main-2 }, path: main.go }
      - id: sel-wire
        type: editor.select
        at: { mark: sel-wire }
        target: { file: main.go, text: "type Wire struct {", occurrence: 1 }
      - id: sel-ptr
        type: editor.select
        at: { mark: sel-ptr }
        target: { file: main.go, text: "*int64", occurrence: 1 }
      - id: type-checks
        type: editor.type
        at: { mark: type-checks }
        target:
          {
            file: main.go,
            after: "\t\treturn w, fmt.Errorf(\"not JSON: %v\", err)\n\t}\n",
            occurrence: 1,
          }
        text: "\tif w.Error != nil {\n\t\treturn w, fmt.Errorf(\"error body in an HTTP %d: %s\", c.HTTP, w.Error.Code)\n\t}\n\tif w.Status == \"\" || w.Amount == nil || w.Currency == \"\" {\n\t\treturn w, fmt.Errorf(\"status, amount or currency missing\")\n\t}\n"
        cadence: line-by-line
      - id: type-loop
        type: editor.type
        at: { mark: type-loop }
        target:
          {
            file: main.go,
            after: "\tfmt.Println(\"naive:\", strings.Join(says, \", \"))\n",
            occurrence: 1,
          }
        text: "\n\tfor _, c := range calls {\n\t\tfmt.Println(c.ID, verdict(parse(c)))\n\t}\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "po_2 rejected: error body in an HTTP 200",
          timeoutMs: 8000,
        }
      - id: pt-po1
        type: console.point
        at: { mark: pt-po1 }
        target: { text: "po_1 paid 100.00 EUR", occurrence: 1 }
      - id: pt-po2
        type: console.point
        at: { mark: pt-po2 }
        target: { text: "po_2 rejected", occurrence: 1 }
      - id: pt-po3
        type: console.point
        at: { mark: pt-po3 }
        target: { text: "po_3 rejected", occurrence: 1 }
      - { id: dock-2, type: runtime.collapseDock, at: { mark: dock-2 } }
      - {
          id: expect-file-checks,
          type: expect.file,
          at: { afterAction: run-2 },
          path: main.go,
          contains: 'if w.Status == "" || w.Amount == nil || w.Currency == "" {',
        }

  - id: fails
    chapter: Provider တွေ မှားတတ်ပုံ
    narration: >-
      [[mark:show-fails]] ဒီလို response တွေက ထူးဆန်းတာ မဟုတ်ပါဘူး။ မကောင်းဘူးလို့ ထင်ရတဲ့
      engineering အလေ့အထ မှန်သမျှကို အချိန်တန်ရင် provider တစ်ခုခုမှာ တွေ့ရမှာမို့၊ ဒါကို အလုပ်ရဲ့
      အစိတ်အပိုင်းလို့ သဘောထားရပါတယ်။ [[mark:pt-f1]] ခုနက တွေ့ခဲ့တာက status code ၂၀၀ နဲ့ error
      ပြန်တာရယ်၊ [[mark:pt-f2]] field ပျောက်တာ ဒါမှမဟုတ် null ဖြစ်နေတာရယ်ပါ။ [[mark:fails-3]] နေ့စွဲကို
      ကိုယ်ပိုင် format နဲ့ ပို့တာ၊ pagination က endpoint တစ်ခုနဲ့ တစ်ခု မတူတာ၊ precision ပျောက်တာ၊ token
      ကို URL ထဲ ထည့်ခိုင်းတာတွေလည်း ရှိပါတယ်။ ဒါတွေကို provider တစ်ခုစီရဲ့ adapter ထဲမှာ handle
      လုပ်ပြီး၊ ကိုယ့် system ထဲကို ကိုယ့် type နဲ့ပဲ ဝင်စေပါတယ်။ [[mark:fails-4]] call တိုင်းလည်း fail
      နိုင်လို့ timeout နဲ့ retry က မရှိမဖြစ်ပါ၊ ငွေရွှေ့တဲ့ call ကို retry လုပ်တိုင်း idempotency key တူတူ ပါရပါမယ်။ circuit
      breaker ကတော့ အများအားဖြင့် optional ပါ။ ကိုယ့် latency နဲ့ connection လို resource တွေကို
      ကာကွယ်ဖို့ တကယ် လိုမှ ထည့်ပါ။ [[mark:fails-5]] rate limit နဲ့ quota ကိုလည်း မေ့တတ်ပါတယ်။ provider
      က တစ်စက္ကန့်ကို request တစ်ရာ ခွင့်ပြုပြီး ညဘက် job က payout status တစ်သန်းကို စစ်ရမယ် ဆိုရင်
      သုံးနာရီ နီးပါး ကြာပါမယ်။ ဒီလို အကြမ်း တွက်ကြည့်တာကို launch မလုပ်ခင် လုပ်ထားပါ။
    sources:
