# Fintech Engineering, lesson 23: consuming provider APIs (Burmese).
#
# Source: Fintech Engineering Handbook, "Consuming APIs" (CC BY 4.0, Voytek Pitula).
# Start state: responses.go holds three raw answers of a payout provider (all HTTP 200) and what
# two blockchain nodes say about one deposit; main.go has a naive check that trusts the status
# code, a parse() that only decodes, and verdict().
# Edits, all insert-only:
#   1. two checks in parse(): an error body, a missing status, amount or currency
#   2. a loop that runs every response through parse()      -> run-2: one accepted, two rejected
#   3. the two nodes compared before crediting a deposit     -> run-3: they disagree, hold + alert
# Figures: boundary (check what you act on, ignore the rest), fails (what providers do),
# unknown (a timeout is the third outcome), evidence (store every request and response), iv.
# Built by ~/Documents/fintech-course-work/tools/build-lesson.ts; fixtures by sim-go.ts --write.
