lesson:
  slug: fintech-23-consuming-apis
  title: "Fintech Engineering 23: Provider API ကို မယုံဘဲ သုံးခြင်း"
  locale: my-MM
  workspace:
    lessonType: go
    name: Fintech Engineering
    entryFilePath: main.go
    files:
      main.go: |
        package main

        import (
        	"encoding/json"
        	"fmt"
        	"strings"
        )

        // Wire holds only the fields we act on. encoding/json skips every other field.
        type Wire struct {
        	Error    *struct{ Code string }
        	Status   string
        	Amount   *int64
        	Currency string
        }

        // naive trusts the HTTP status code.
        func naive(c Call) string {
        	if c.HTTP == 200 {
        		return c.ID + " paid"
        	}
        	return c.ID + " failed"
        }

        // parse reads one response at the boundary.
        func parse(c Call) (Wire, error) {
        	var w Wire
        	if err := json.Unmarshal([]byte(c.Body), &w); err != nil {
        		return w, fmt.Errorf("not JSON: %v", err)
        	}
        	return w, nil
        }

        // verdict says what we do with one response.
        func verdict(w Wire, err error) string {
        	if err != nil {
        		return "rejected: " + err.Error()
        	}
        	return w.Status + " " + cents(*w.Amount) + " " + w.Currency
        }

        func main() {
        	var says []string
        	for _, c := range calls {
        		says = append(says, naive(c))
        	}
        	fmt.Println("naive:", strings.Join(says, ", "))
        }

        // cents prints minor units as an amount with two decimals: cents(1234) is "12.34".
        func cents(n int64) string {
        	return fmt.Sprintf("%d.%02d", n/100, n%100)
        }
      responses.go: |
        package main

        import "fmt"

        // Call is one call we made to the payout provider and the raw answer it gave.
        type Call struct {
        	ID   string // our payout id
        	HTTP int    // the HTTP status code
        	Body string // the response body, byte for byte
        }

        // The provider's answers to "what happened to this payout?"
        var calls = []Call{
        	{"po_1", 200, `{"id":"po_1","status":"paid","amount":10000,"currency":"EUR",
        		"created":"27/11/2026 10:04","fees":null,"trace":{"rail":"sepa"}}`},
        	{"po_2", 200, `{"error":{"code":"insufficient_funds","message":"payout failed"}}`},
        	{"po_3", 200, `{"id":"po_3","status":"paid","amount":null,"currency":"EUR"}`},
        }

        // Deposit is what one blockchain node says about a transaction to our address.
        type Deposit struct {
        	Found         bool
        	Confirmations int
        }

        func (d Deposit) String() string {
        	if !d.Found {
        		return "not found"
        	}
        	return fmt.Sprintf("%d confirmations", d.Confirmations)
        }

        // Two independent nodes asked about the same deposit.
        const tx = "0x9f2c"

        var nodeA = map[string]Deposit{tx: {Found: true, Confirmations: 12}}
        var nodeB = map[string]Deposit{}
