  - id: unknown
    chapter: Timeout ရဲ့ ရလဒ်က unknown
    narration: >-
      [[mark:show-unknown]] payout call
      တစ်ခုရဲ့ ရလဒ်က နှစ်မျိုး မဟုတ်ဘဲ သုံးမျိုး ရှိပါတယ်။ paid ဆိုရင် settle လုပ်ပြီး၊ failed ဆိုရင် hold
      ကို release လုပ်ပါတယ်။ [[mark:pt-timeout]] timeout ကတော့ idempotency lesson မှာ တွေ့ခဲ့သလို ရလဒ် မသိတာပါ၊ provider က ငွေ ပေးပြီးသား ဖြစ်နိုင်ပါတယ်။ [[mark:unk-2]] အဲဒါကို failure
      လို့ ယူပြီး hold ကို release လုပ်လိုက်ရင် user က အဲဒီ ငွေကို ထပ်ထုတ်နိုင်သွားပြီး ငွေက နှစ်ခါ ထွက်သွားနိုင်ပါတယ်။
      [[mark:unk-3]] မှန်တာက unknown ကို state တစ်ခု သီးသန့် ထားပြီး hold ကို ဆက်ထိန်းထားတာပါ။ ပြီးမှ
      key တူတူနဲ့ retry လုပ်တာ ဒါမှမဟုတ် status ကို query လုပ်တာနဲ့ known ဖြစ်တဲ့အထိ ဖြေရှင်းပါတယ်။
      resumable flow ထဲမှာဆိုရင် ဒီ unknown က driver ပြန်ကောက်ပြီး ဆက်လုပ်ပေးမယ့် state တစ်ခုပါ။
    sources:
