  - id: evidence
    narration: >-
      [[mark:show-evidence]] provider ကို ခေါ်တိုင်း ပို့လိုက်တဲ့ request နဲ့ ပြန်ရလာတဲ့ response ကို
      raw အတိုင်း သိမ်းထားပါ။ အလွန်အကျွံလို့ ထင်ရပေမဲ့ provider က မပြန်သင့်တာ ပြန်လာတဲ့ နေ့မှာ အဲဒီ
      မှတ်တမ်းပဲ ရှိပါတယ်။ [[mark:pt-row]] log ဖိုင်တွေ ပုံထားတာ မဟုတ်ဘဲ query လုပ်လို့ ရတဲ့ table
      တစ်ခုထဲမှာ structured ဖြစ်အောင် ထားရပါမယ်၊ ဥပမာ Redshift table လိုမျိုးပါ။ [[mark:ev-2]] ဒါက
      နေရာ သုံးခုမှာ အသုံးဝင်ပါတယ်။ provider ဘာပြောခဲ့လဲ စစ်ဆေးဖို့၊ provider နဲ့ အငြင်းပွားတဲ့အခါ
      သက်သေပြဖို့၊ ကိုယ့် bug တစ်ခုကို ပြင်ပြီးနောက် provider ဆီ ပြန်တောင်းစရာ မလိုဘဲ ပြန် process
      လုပ်ဖို့ပါ။ ဒါက No lost data ပါ၊ ငွေနဲ့ ပတ်သက်ပြီး ဖြစ်ခဲ့သမျှ မပျောက်ရဘူး ဆိုတဲ့ မူပါ။
    sources:
