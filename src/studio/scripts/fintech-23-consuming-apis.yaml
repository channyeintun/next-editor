  - id: nodes
    chapter: Source နှစ်ခုနဲ့ တိုက်စစ်
    narration: >-
      [[mark:close-evidence]] အရေးအကြီးဆုံး နေရာတွေမှာတော့ source တစ်ခုတည်း ပြောတာ မလုံလောက်ပါဘူး။
      [[mark:open-resp-2]] ဒီဖိုင်ရဲ့ အောက်ဆုံးမှာ deposit transaction တစ်ခုအကြောင်း မေးထားတာ ရှိပါတယ်။
      [[mark:sel-nodes]] blockchain node နှစ်ခုကို သီးခြားစီ မေးထားပြီး၊ တစ်ခုက confirmation ဆယ့်နှစ်ခု ရှိပြီလို့ ပြောပါတယ်၊ ဆိုလိုတာက အဲဒီ transaction ပါတဲ့ block နောက်မှာ block တွေ ထပ်ဆက်လာပြီလို့ပါ။ ဒါပေမဲ့ နောက်တစ်ခုက အဲဒီ transaction ကို မတွေ့ပါဘူးလို့ ပြောပါတယ်။ [[mark:type-cross]] user
      ကို credit မလုပ်ခင် node နှစ်ခုရဲ့ အဖြေကို ယှဉ်ပါမယ်။ မတူရင် credit မလုပ်ဘဲ hold ထားပြီး alert
      ပို့ပါတယ်။ ဘယ် node က မှန်လဲ ဆိုတာကို code က ရွေးမပေးပါဘူး၊ တစ်ခုက နောက်ကျနေတာလည်း ဖြစ်နိုင်၊
      မှားနေတာလည်း ဖြစ်နိုင်လို့ပါ။ [[mark:run-3]] run လိုက်ရအောင်။ [[mark:pt-nodes]] node နှစ်ခု မတူလို့
      deposit ကို hold ထားလိုက်ပါတယ်။ ဆက်ကွဲနေရင် လူ ကြည့်ရပါမယ်။ provider
      နှစ်ခု၊ ဘဏ် နှစ်ခု၊ custodian နှစ်ခု ထားတာက development၊ fee နဲ့ complexity အားလုံး ဈေးကြီးလို့ အရေးအကြီးဆုံး အပိုင်းမှာပဲ စဉ်းစားရပါတယ်။ [[mark:dock-3]] sandbox ကိုလည်း သိပ် မယုံပါနဲ့။ basic
      scenario တွေအတွက် ရပေမဲ့ production နဲ့ အများကြီး ကွာတတ်လို့ canary release နဲ့ ပမာဏ
      သေးသေးလေးတွေနဲ့ production မှာ စမ်းဖို့ ပြင်ထားရပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Consuming APIs (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#consuming-apis",
        }
    actions:
      - { id: close-evidence, type: slide.close, at: { mark: close-evidence } }
      - { id: open-resp-2, type: workspace.openFile, at: { mark: open-resp-2 }, path: responses.go }
      - id: sel-nodes
        type: editor.select
        at: { mark: sel-nodes }
        target:
          {
            file: responses.go,
            text: "var nodeA = map[string]Deposit{tx: {Found: true, Confirmations: 12}}\nvar nodeB = map[string]Deposit{}",
            occurrence: 1,
          }
      - {
          id: open-main-3,
          type: workspace.openFile,
          at: { mark: type-cross, offsetMs: -600 },
          path: main.go,
        }
      - id: type-cross
        type: editor.type
        at: { mark: type-cross }
        target:
          { file: main.go, after: "\t\tfmt.Println(c.ID, verdict(parse(c)))\n\t}\n", occurrence: 1 }
        text: "\n\ta, b := nodeA[tx], nodeB[tx]\n\tif a != b {\n\t\tfmt.Printf(\"%s: node-a %v, node-b %v -> hold, alert\\n\", tx, a, b)\n\t}\n"
        cadence: line-by-line
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "node-b not found -> hold, alert",
          timeoutMs: 8000,
        }
      - id: pt-nodes
        type: console.point
        at: { mark: pt-nodes }
        target: { text: "node-b not found -> hold, alert", occurrence: 1 }
      - { id: dock-3, type: runtime.collapseDock, at: { mark: dock-3 } }

  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] Fintech interview တွေမှာ payment provider တစ်ခုကို integrate လုပ်ရင် ဘာတွေ
      သတိထားမလဲ လို့ မေးလေ့ရှိပါတယ်။ retry ထည့်မယ် လို့ပဲ ဖြေရင် မလုံလောက်ပါဘူး။ အချက် သုံးချက်နဲ့
      ဖြေပါ။ [[mark:iv-a]] ပထမ၊ boundary မှာ ကိုယ် သုံးမယ့် field တွေကိုပဲ စစ်ပြီး မှားနေရင် fail loudly
      လုပ်မယ်၊ ကျန်တာကို မစစ်လို့ provider ရဲ့ contract ပြောင်းတာ ကိုယ့် outage မဖြစ်ဘူး ဆိုတာပါ။
      [[mark:iv-b]] ဒုတိယ၊ timeout နဲ့ retry ကို idempotency key နဲ့ တွဲထားပြီး၊ timeout ကို failure
      မဟုတ်ဘဲ unknown အဖြစ် ထားကာ status ကို query လုပ်ပြီး ဖြေရှင်းမယ် ဆိုတာပါ။ [[mark:iv-c]] တတိယ၊
      request နဲ့ response တိုင်းကို raw အတိုင်း query လုပ်လို့ရအောင် သိမ်းမယ် ဆိုတာပါ။ [[mark:iv-d]]
      ပြီးရင် ကိုယ် ဘာလုပ်မလဲ ဆက်ပြောပါ။ provider တစ်ခုစီကို adapter တစ်ခုနဲ့ ခွဲထားမယ်၊ critical
      ဖြစ်တဲ့ အပိုင်းမှာ source နှစ်ခုနဲ့ တိုက်စစ်မယ်၊ production မှာ ပမာဏ သေးသေးနဲ့ canary လုပ်မယ်
      ဆိုတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Consuming APIs (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#consuming-apis",
        }
    actions:
      - { id: show-iv, type: slide.show, at: { mark: show-iv, offsetMs: -700 }, slideId: iv-1 }
      - {
          id: pt-iv-q,
          type: slide.point,
          at: { afterAction: show-iv },
          target: { x: 0.125, y: 0.184 },
        }
      - { id: iv-a, type: slide.show, at: { mark: iv-a }, slideId: iv-2 }
      - {
          id: pt-iv-a,
          type: slide.point,
          at: { afterAction: iv-a },
          target: { x: 0.138, y: 0.359 },
        }
      - { id: iv-b, type: slide.show, at: { mark: iv-b }, slideId: iv-3 }
      - {
