  - id: try-it
    narration: >-
      [[mark:close-iv]] ကိုယ်တိုင် စမ်းကြည့်ဖို့ တစ်ခု ရှိပါတယ်။ [[mark:open-resp-3]] ပထမ payout ရဲ့
      response ကို ကြည့်ပါ။ [[mark:sel-try]] provider က ထပ်ထည့်လိုက်သလို field အသစ် တစ်ခု ဒီထဲ
      ထည့်ပြီး run ကြည့်ပါ။ ရလဒ် ဘာမှ မပြောင်းဘဲ ပထမ payout ကို အရင်အတိုင်း လက်ခံပါတယ်။ unknown field ကို ငြင်းတဲ့ strict decoder ဆိုရင်တော့ မှန်နေတဲ့ payout ကိုပါ ငြင်းပြီး outage ဖြစ်မှာပါ။ [[mark:recap]] ပြန်ချုပ်ရရင်၊ provider ပြောတာကို ကိုယ် သုံးမယ့် အပိုင်းမှာပဲ စစ်ပြီး
      ယုံ၊ fail ဖြစ်မယ်လို့ ကြိုယူဆ၊ ပြောခဲ့တာ အားလုံးကို သက်သေအဖြစ် သိမ်းထားပါ။ နောက် lesson မှာတော့
      provider က ကိုယ့်ကို ပြန်ခေါ်တဲ့ webhook ကို ဘယ်လို လက်ခံမလဲ၊ ဘာကြောင့် အဲဒါကိုလည်း မယုံရလဲ
      ဆိုတာ ကြည့်ပါမယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Consuming APIs (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#consuming-apis",
        }
