scenes:
  - id: open
    chapter: "ကူးထားတဲ့ test တွေနဲ့ ဇယား"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ watch mode ကို သုံးပုံနဲ့၊ run ချင်တဲ့ test တွေကို ရွေး run နည်းကို
      ကြည့်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ ပုံစံ တူတူ test တွေကို ကူးရေးမယ့်အစား၊ data ဇယား တစ်ခုနဲ့
      စစ်ပုံ တစ်ခုတည်းကနေ test တွေ အများကြီး ထုတ်ပေးတဲ့ test for ကို ကြည့်ပါမယ်။ [[mark:draw-table]]
      ဆိုင်ရဲ့ menu ကို ဇယား တစ်ခုလို စဉ်းစားကြည့်ရအောင်။ ဘယ်ဘက်မှာ id နဲ့ ဈေးနှုန်း ပါတဲ့ row ငါးခု
      ရှိပါတယ်။ ဈေးနှုန်း မှန်မမှန် စစ်တဲ့ test တွေက row တိုင်းအတွက် ပုံစံ အတူတူပါပဲ။ id ကို ယူ၊ ဈေးကို
      ရှာ၊ ဇယားထဲက ဈေးနဲ့ တူလား စစ်တာပါ။ ကွာတာက row ထဲက data ပဲ ဖြစ်ပါတယ်။ [[mark:draw-tests]]
      ဒါကြောင့် စစ်ပုံကို တစ်ခါပဲ ရေးပြီး row တွေကို Vitest ဆီ ပေးလိုက်ရင်၊ Vitest က row တစ်ခုချင်းအတွက်
      test တစ်ခုစီကို ထုတ်ပေးပါတယ်။ test နာမည်ကိုလည်း row ထဲက data နဲ့ ဖွဲ့ပေးလို့ ရတဲ့အတွက်၊ ညာဘက်လို
      နာမည် ကိုယ်စီ ပါတဲ့ test ငါးခု ရပါတယ်။ [[mark:draw-body]] ဒီလို data ဇယား တစ်ခုကနေ test တွေ
      အများကြီး ထုတ်ပေးတာကို table test ဒါမှမဟုတ် parameterized test လို့ ခေါ်ပါတယ်။ menu ပစ္စည်း
      အသစ် ရောက်လာရင်လည်း test တစ်ခုလုံးကို ကူးစရာ မလိုဘဲ၊ ဇယားထဲမှာ row တစ်ကြောင်း ထပ်ထည့်ရုံပါပဲ။
    sources:
      - {
          title: "Vitest: Writing Tests, parameterized tests",
          url: "https://vitest.dev/guide/learn/writing-tests#parameterized-tests",
        }
      - {
          title: "web.dev Learn Testing: Assertions and other primitives, test cases that can be individually addressed",
          url: "https://web.dev/learn/testing/assertions/tools",
        }
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 300000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-table
        type: whiteboard.apply
        at: { mark: draw-table }
        upsertIds: [a-table-box, a-table-1, a-table-2, a-table-3, a-table-4, a-table-5]
        drawMs: 3500
      - id: draw-tests
        type: whiteboard.apply
        at: { mark: draw-tests }
        upsertIds: [a-arrow, a-tests-box, a-test-1, a-test-2, a-test-3, a-test-4, a-test-5]
        drawMs: 4000
      - id: draw-body
        type: whiteboard.apply
        at: { mark: draw-body }
        upsertIds: [a-body, a-label]
        drawMs: 2500

  - id: starter
    narration: >
      ဆိုင်ရဲ့ test ဖိုင်ကို ဖွင့်ကြည့်ရအောင်။ [[mark:open-menu-test]] ဒါက menu ဖိုင်အတွက် test ဖိုင်ပါ။
      [[mark:select-tea]] ပထမ test က လက်ဖက်ရည် ဈေးဟာ ၁၅၀၀ ကျပ် ဖြစ်ရမယ်လို့ စစ်ထားပါတယ်။
      [[mark:select-coffee]] ဒုတိယ test ကလည်း ပုံစံ အတူတူပဲ ဖြစ်ပြီး၊ ကွာတာက id နဲ့ ဈေးနှုန်း နှစ်ခုပဲ
      ရှိပါတယ်။ ဒီ ဖိုင်ထဲမှာ ဒီလို test ငါးခုကို ကူးပြီး ရေးထားပါတယ်။ စစ်ပုံကို ပြောင်းချင်ရင်
      ငါးနေရာလုံးမှာ လိုက်ပြင်ရမှာ ဖြစ်ပြီး၊ တစ်နေရာ မေ့သွားရင် test တွေ အချင်းချင်း မတူတော့ပါဘူး။
      [[mark:open-order]] ဒါကတော့ အော်ဒါ line တစ်ကြောင်းရဲ့ ဈေးကို တွက်တဲ့ order ဖိုင်ပါ။
      [[mark:select-large]] ဒီ line က ခွက်ကြီး မှာရင် ၅၀၀ ကျပ် ထပ်ပေါင်းပါတယ်။ ဒီ line ကို မှတ်ထားပါ။
      နောက်မှာ ဇယားက ဒီ line ထဲက ပြဿနာ တစ်ခုကို ရှာပေးပါလိမ့်မယ်။ [[mark:open-order-test]] order test
      ဖိုင်မှာတော့ ခွက်ကြီးအတွက် test တစ်ခုပဲ ရှိပြီး၊ လက်ဖက်ရည် ခွက်ကြီး တစ်ခွက်က ၂၀၀၀ ကျပ် ဖြစ်ရမယ်လို့
      စစ်ထားပါတယ်။
    sources:
      - {
          title: "Vitest: Writing Tests, parameterized tests",
          url: "https://vitest.dev/guide/learn/writing-tests#parameterized-tests",
        }
      - { title: "Vitest: expect, toBe", url: "https://vitest.dev/api/expect#tobe" }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-menu-test
        type: workspace.openFile
        at: { mark: open-menu-test }
        path: src/menu.test.js
      - id: select-tea
        type: editor.select
        at: { mark: select-tea }
        target:
          { file: src/menu.test.js, text: 'expect(priceOf("tea")).toBe(1500);', occurrence: 1 }
      - id: select-coffee
        type: editor.select
        at: { mark: select-coffee }
        target:
          { file: src/menu.test.js, text: 'expect(priceOf("coffee")).toBe(1800);', occurrence: 1 }
      - id: open-order
        type: workspace.openFile
        at: { mark: open-order }
        path: src/order.js
      - id: select-large
        type: editor.select
        at: { mark: select-large }
        target:
          { file: src/order.js, text: 'if (size === "large") price += LARGE_EXTRA;', occurrence: 1 }
      - id: open-order-test
        type: workspace.openFile
        at: { mark: open-order-test }
        path: src/order.test.js

  - id: panel
    narration: >
      [[mark:ready]] Vitest က ဒီ ဖိုင်တွေကို run လိုက်တော့ ဘာ ပြလဲ ကြည့်ရအောင်။ watch mode နဲ့ run နေတဲ့
      Vitest ရဲ့ ရလဒ်ကို ညာဘက်က panel မှာ ပြနေပြီး၊ ဖိုင် နှစ်ဖိုင်ထဲက test ခြောက်ခုလုံး အမှန်ခြစ် ရနေပါတယ်။
      အပေါ်က PASS ကလည်း အစိမ်းရောင် ဖြစ်နေပါတယ်။
      [[mark:read-start]] ခွက်ကြီး test ကလည်း လက်ဖက်ရည် တစ်မျိုးကိုပဲ စစ်ထားလို့ pass ဖြစ်နေတာပါ။
      summary မှာလည်း ၆ ခု pass လို့ ပြနေပါတယ်။
    sources:
      - {
          title: "Vitest: Writing Tests, reading test output",
          url: "https://vitest.dev/guide/learn/writing-tests#reading-test-output",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-start-pass
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1000 }
      - id: expect-start-six
        type: expect.preview
        at: { afterAction: expect-start-pass }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "6" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-file
        type: expect.preview
        at: { afterAction: expect-start-six }
        timeoutMs: 5000
        target: { by: testId, value: vt-file-1 }
        textContains: "src/menu.test.js (5 tests)"
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: table
    chapter: "Test for နဲ့ data ဇယား"
    narration: >
      ကဲ၊ ကူးထားတဲ့ test ငါးခုကို ဇယား တစ်ခုတည်းနဲ့ ရေးကြည့်ရအောင်။ [[mark:open-menu-again]] menu test
      ဖိုင်ကို ပြန်ဖွင့်ပါမယ်။ [[mark:type-table]] ဖိုင်ရဲ့ အောက်ဆုံးမှာ test for ကို သုံးတဲ့ ဇယား တစ်ခု
      ထည့်ပါမယ်။ [[mark:select-rows]] test for ထဲကို ပထမဆုံး row တွေ ပါတဲ့ array ကို ပေးပါတယ်။ row
      တစ်ခုချင်းက id ရယ်၊ မြန်မာ နာမည်ရယ်၊ ဈေးနှုန်းရယ် ပါတဲ့ object ပါ။ [[mark:select-title]] ပြီးတော့ test ရဲ့
      နာမည်ကို ပေးပါတယ်။ နာမည်ထဲက name နဲ့ price ဆိုတဲ့ နေရာ နှစ်ခုကို၊ row တစ်ခုချင်းရဲ့ တန်ဖိုးနဲ့ Vitest
      က အစားထိုးပေးပါတယ်။ [[mark:select-body]] နောက်ဆုံးက test body ပါ။ row တစ်ခုကို object အနေနဲ့
      လက်ခံပြီး၊ ကူးထားတဲ့ test တွေနဲ့ တူတူပဲ ဈေးကို စစ်ပါတယ်။ စစ်ပုံကို ဒီ တစ်နေရာတည်းမှာပဲ
      ရေးထားတာပါ။ [[mark:read-table]] panel ကို ကြည့်ပါ။ menu test ဖိုင်မှာ test ၁၀ ခု ဖြစ်သွားပြီး၊ အသစ်
      ငါးခုက လက်ဖက်ရည် costs ၁၅၀၀ ဆိုသလို row တစ်ခုစီရဲ့ နာမည်နဲ့ ဈေးနှုန်းကို ယူထားပါတယ်။ Vitest ၅ မှာ
      စာသား တန်ဖိုးတွေကို quote မပါဘဲ ပြပြီး၊ မြန်မာစာလည်း ရေးထားတဲ့ အတိုင်း ပေါ်ပါတယ်။
      [[mark:read-copies]] အသစ် ငါးခုက အပေါ်က ကူးထားတဲ့ test ငါးခုနဲ့ အတူတူ စစ်ပေးတာ ဖြစ်လို့၊ ကိုယ့်
      project မှာဆိုရင် ကူးထားတဲ့ test တွေကို ဖျက်လိုက်လို့ ရပါပြီ။ summary မှာလည်း ၁၁ ခု pass လို့
      ပြနေပါတယ်။
    sources:
      - { title: "Vitest: test.for", url: "https://vitest.dev/api/test#test-for" }
      - {
          title: "Vitest: Writing Tests, parameterized tests ($property in the name)",
          url: "https://vitest.dev/guide/learn/writing-tests#parameterized-tests",
        }
      - {
          title: "Vitest 5 migration guide: $ placeholders print strings without quotes; non-ASCII works (facts A18)",
          url: "https://vitest.dev/guide/migration/",
        }
    actions:
      - id: open-menu-again
        type: workspace.openFile
        at: { mark: open-menu-again }
        path: src/menu.test.js
      - id: type-table
        type: editor.type
        at: { mark: type-table }
        target:
          {
            file: src/menu.test.js,
            after: "  expect(priceOf(\"paratha\")).toBe(1200);\n});\n",
            occurrence: 1,
          }
        text: "\ntest.for([\n  { id: \"tea\", name: \"လက်ဖက်ရည်\", price: 1500 },\n  { id: \"coffee\", name: \"ကော်ဖီ\", price: 1800 },\n  { id: \"lime\", name: \"သံပုရာရည်\", price: 1200 },\n  { id: \"mohinga\", name: \"မုန့်ဟင်းခါး\", price: 2500 },\n  { id: \"paratha\", name: \"ပလာတာ\", price: 1200 },\n])(\"$name costs $price\", ({ id, price }) => {\n  expect(priceOf(id)).toBe(price);\n});\n"
        # One block (pilot note 1): one write, one run — no half-typed state reaches Vitest.
        cadence: block
      - id: expect-table
        type: expect.preview
        at: { afterAction: type-table }
        timeoutMs: 8000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "11" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-table-pass
        type: expect.preview
        at: { afterAction: expect-table }
        timeoutMs: 5000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-table-file
        type: expect.preview
        at: { afterAction: expect-table-pass }
        timeoutMs: 5000
        target: { by: testId, value: vt-file-1 }
        textContains: "src/menu.test.js (10 tests)"
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-table-tea
        type: expect.preview
        at: { afterAction: expect-table-file }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-6 }
        attribute: { name: data-name, value: "လက်ဖက်ရည် costs 1500" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-table-paratha
        type: expect.preview
        at: { afterAction: expect-table-tea }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-10 }
        attribute: { name: data-name, value: "ပလာတာ costs 1200" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-rows
        type: editor.select
        at: { mark: select-rows }
        target:
          {
            file: src/menu.test.js,
            text: '{ id: "tea", name: "လက်ဖက်ရည်", price: 1500 },',
            occurrence: 1,
          }
      - id: select-title
        type: editor.select
        at: { mark: select-title }
        target: { file: src/menu.test.js, text: '"$name costs $price"', occurrence: 1 }
      - id: select-body
        type: editor.select
        at: { mark: select-body }
        target:
          {
            file: src/menu.test.js,
            text: "({ id, price }) => {\n  expect(priceOf(id)).toBe(price);",
            occurrence: 1,
          }
      - id: expect-table-code
        type: expect.file
        at: { afterAction: select-body }
        path: src/menu.test.js
        contains: "])(\"$name costs $price\", ({ id, price }) => {\n  expect(priceOf(id)).toBe(price);\n});\n"

  - id: rows
    chapter: "Row တစ်ခုက bug ကို ရှာပေး"
    narration: >
      ခွက်ကြီး ဈေးအတွက်လည်း ဇယား တစ်ခု လုပ်ကြည့်ရအောင်။ [[mark:open-order-test-2]] order test ဖိုင်ကို
      ဖွင့်ပါမယ်။ [[mark:type-rows]] ဒီတစ်ခါ row တစ်ခုချင်းကို object မဟုတ်ဘဲ array နဲ့ ရေးပါမယ်။
      [[mark:select-size-rows]] row တစ်ခုမှာ id ရယ်၊ ခွက် အရွယ်ရယ်၊ ဈေးနှုန်းရယ် သုံးခု ပါပြီး၊ လက်ဖက်ရည်
      ခွက်သေး၊ လက်ဖက်ရည် ခွက်ကြီး၊ ကော်ဖီ ခွက်ကြီးနဲ့ မုန့်ဟင်းခါး ခွက်ကြီး ဆိုပြီး လေးခု ရှိပါတယ်။
      [[mark:select-format]] array row ဆိုရင်တော့ နာမည်ထဲက placeholder တွေကို array ထဲက တန်ဖိုးတွေနဲ့
      အစဉ်လိုက် အစားထိုးပါတယ်။ ပထမ နှစ်ခုက စာသားအတွက်၊ နောက်ဆုံး တစ်ခုက ကိန်းပြည့်အတွက် ဖြစ်ပါတယ်။
      [[mark:read-red]] panel ကို ကြည့်ပါ။ အပေါ်က PASS က အနီရောင် FAIL ဖြစ်သွားပြီး၊ သူ့အောက်မှာ Failed
      Tests အပိုင်း ပေါ်လာပါတယ်။ မုန့်ဟင်းခါး ခွက်ကြီး ဆိုတဲ့ row က ကျနေပြီး၊ ၂၅၀၀ ဖြစ်ရမယ့် နေရာမှာ ၃၀၀၀
      ရနေတယ်လို့ ပြောနေပါတယ်။ Expected ကို အစိမ်းရောင်၊ Received ကို အနီရောင်နဲ့ ပြထားပါတယ်။ [[mark:select-shared]] code frame ကတော့ row
      ကို မညွှန်ဘဲ၊ row လေးခုလုံး မျှသုံးနေတဲ့ test body ထဲက ဒီ line ကို ညွှန်ပြနေပါတယ်။ ဒါကြောင့်
      ဘယ် row ကျလဲ ဆိုတာကို FAIL အပိုင်းက test နာမည်ကနေပဲ သိရပါတယ်။ row ရဲ့ data ကို နာမည်ထဲမှာ
      ထည့်ထားတာ ဒီအတွက်ပါ။ [[mark:decide-rows]] ဒါဆို ဘယ်ဘက် မှားနေလဲ။ ဆိုင်ရဲ့ စည်းကမ်းအရ ခွက်ကြီး
      ဈေးက သောက်စရာတွေအတွက်ပဲ ဖြစ်ပြီး၊ မုန့်ဟင်းခါးလို စားစရာမှာ ခွက် အရွယ် မရှိပါဘူး။ ဒါကြောင့် row
      က မှန်ပြီး၊ code က စားစရာကိုပါ ခွက်ကြီး ဈေး ထပ်ပေါင်းနေတာပါ။
    sources:
      - {
          title: "Vitest: test.for with array rows and printf placeholders",
          url: "https://vitest.dev/api/test#test-for",
        }
      - {
          title: "Vitest: test.each, printf formatting (%s, %i)",
          url: "https://vitest.dev/api/test#test-each",
        }
      - {
          title: "Vitest 5.1 output: a failing row's frame points at the shared body (capture 17)",
          url: "https://vitest.dev/guide/learn/writing-tests#parameterized-tests",
        }
    actions:
      - id: open-order-test-2
        type: workspace.openFile
        at: { mark: open-order-test-2 }
        path: src/order.test.js
      - id: type-rows
        type: editor.type
        at: { mark: type-rows }
        target:
          {
            file: src/order.test.js,
            after: "  expect(lineTotal({ id: \"tea\", size: \"large\" })).toBe(2000);\n});\n",
            occurrence: 1,
          }
        text: "\ntest.for([\n  [\"tea\", \"small\", 1500],\n  [\"tea\", \"large\", 2000],\n  [\"coffee\", \"large\", 2300],\n  [\"mohinga\", \"large\", 2500],\n])(\"%s %s costs %i\", ([id, size, price]) => {\n  expect(lineTotal({ id, size })).toBe(price);\n});\n"
        cadence: block
      - id: expect-red
        type: expect.preview
        at: { afterAction: type-rows }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-red-count
        type: expect.preview
        at: { afterAction: expect-red }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-failed, value: "1" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-red-row
        type: expect.preview
        at: { afterAction: expect-red-count }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-test, value: "mohinga large costs 2500" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-red-message
        type: expect.preview
        at: { afterAction: expect-red-row }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-message, value: "expected 3000 to be 2500 // Object.is equality" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-red-tree
        type: expect.preview
        at: { afterAction: expect-red-message }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-15 }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-size-rows
        type: editor.select
        at: { mark: select-size-rows }
        target:
          {
            file: src/order.test.js,
            text: "[\"tea\", \"small\", 1500],\n  [\"tea\", \"large\", 2000],\n  [\"coffee\", \"large\", 2300],\n  [\"mohinga\", \"large\", 2500],",
            occurrence: 1,
          }
      - id: select-format
        type: editor.select
        at: { mark: select-format }
        target: { file: src/order.test.js, text: '"%s %s costs %i"', occurrence: 1 }
      - id: expect-red-diff
        type: expect.preview
        at: { mark: read-red }
        timeoutMs: 5000
        target: { by: testId, value: vt-diff-1 }
        textContains: "- 2500"
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-shared
        type: editor.select
        at: { mark: select-shared }
        target:
          {
            file: src/order.test.js,
            text: "expect(lineTotal({ id, size })).toBe(price);",
            occurrence: 1,
          }
      - id: expect-red-frame
        type: expect.preview
        at: { afterAction: select-shared }
        timeoutMs: 5000
        target: { by: testId, value: vt-frame-1 }
        attribute: { name: data-line, value: "14" }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: fix
    narration: >
      [[mark:open-order-fix]] code ကို ပြင်ကြည့်ရအောင်။ order ဖိုင်ကို ပြန်ဖွင့်ပါမယ်။ [[mark:type-drink]]
      ခွက်ကြီး ဆိုတဲ့ စစ်ချက်ရဲ့ နောက်မှာ၊ menu ထဲက ပစ္စည်းဟာ သောက်စရာ ဖြစ်မှ ဆိုတဲ့ စစ်ချက်ကို
      ထပ်ထည့်ပါမယ်။ [[mark:read-green]] Vitest က ပြန် run လိုက်တော့ Failed Tests အပိုင်း ပျောက်သွားပြီး၊
      test ၁၅ ခုလုံး pass ဖြစ်သွားပါပြီ။ PASS ကလည်း အစိမ်းရောင် ပြန်ဖြစ်သွားပါပြီ။ အရင်က ခွက်ကြီး
      test က လက်ဖက်ရည် တစ်မျိုးကိုပဲ စစ်ထားလို့ ဒီ bug ကို မဖမ်းနိုင်ခဲ့ပေမဲ့၊ ဇယားမှာ မုန့်ဟင်းခါး row
      တစ်ကြောင်း ထည့်လိုက်ရုံနဲ့ ဖမ်းမိသွားတာပါ။ [[mark:edge-case]] ဒီလို ပုံမှန် မဟုတ်ပေမဲ့ ဖြစ်နိုင်တဲ့ input ကို
      edge case လို့ ခေါ်ပါတယ်။ ခွက်ကြီး ဈေးရဲ့ စည်းကမ်းက သောက်စရာနဲ့ စားစရာ ကြားမှာ ပြောင်းသွားတဲ့အတွက်၊
      အဲဒီ နှစ်ဘက်လုံးက row တွေ ပါဖို့ အရေးကြီးပါတယ်။ ဒီလို စည်းကမ်း ပြောင်းသွားတဲ့ အစွန်းကို boundary
      လို့ ခေါ်ပါတယ်။ [[mark:open-order-test-3]] row တစ်ကြောင်း ထည့်ရတာ အလုပ် သိပ် မများတဲ့အတွက်၊ edge case
      တစ်ခု ထပ်ထည့်ကြည့်ရအောင်။
      [[mark:type-row]] ပလာတာ ခွက်ကြီး ဆိုတဲ့ row တစ်ကြောင်းကို ထည့်ပါမယ်။ စားစရာ ဖြစ်လို့ ခွက်ကြီးလို့
      မှာလည်း မူလ ဈေး ၁၂၀၀ ကျပ်ပဲ ဖြစ်ရပါမယ်။ [[mark:read-row]] panel မှာ ပလာတာ ခွက်ကြီး ဆိုတဲ့ test
      အသစ် တစ်ခု ပေါ်လာပြီး pass ဖြစ်နေပါတယ်။ test body အသစ် မရေးဘဲ၊ row တစ်ကြောင်းနဲ့ပဲ test တစ်ခု
      ရသွားတာပါ။
    sources:
      - {
          title: "Vitest: Testing in Practice, testing edge cases",
          url: "https://vitest.dev/guide/learn/testing-in-practice#testing-edge-cases",
        }
      - { title: "Vitest: test.for", url: "https://vitest.dev/api/test#test-for" }
    actions:
      - id: open-order-fix
        type: workspace.openFile
        at: { mark: open-order-fix }
        path: src/order.js
      - id: type-drink
        type: editor.type
        at: { mark: type-drink }
        target: { file: src/order.js, after: 'if (size === "large"', occurrence: 1 }
        text: " && MENU[id].drink"
      - id: expect-green
        type: expect.preview
        at: { afterAction: type-drink }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-green-count
        type: expect.preview
        at: { afterAction: expect-green }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "15" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-green-row
        type: expect.preview
        at: { afterAction: expect-green-count }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-15 }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-order-file
        type: expect.file
        at: { afterAction: expect-green-row }
        path: src/order.js
        contains: 'if (size === "large" && MENU[id].drink) price += LARGE_EXTRA;'
      - id: open-order-test-3
        type: workspace.openFile
        at: { mark: open-order-test-3 }
        path: src/order.test.js
      - id: type-row
        type: editor.type
        at: { mark: type-row }
        target:
          { file: src/order.test.js, after: "  [\"mohinga\", \"large\", 2500],\n", occurrence: 1 }
        text: "  [\"paratha\", \"large\", 1200],\n"
      - id: expect-row
        type: expect.preview
        at: { afterAction: type-row }
        timeoutMs: 8000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "16" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-row-name
        type: expect.preview
        at: { afterAction: expect-row }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-16 }
        attribute: { name: data-name, value: "paratha large costs 1200" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-row-pass
        type: expect.preview
        at: { afterAction: expect-row-name }
        timeoutMs: 5000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-rows-file
        type: expect.file
        at: { afterAction: expect-row-pass }
        path: src/order.test.js
        contains: "  [\"mohinga\", \"large\", 2500],\n  [\"paratha\", \"large\", 1200],\n])(\"%s %s costs %i\", ([id, size, price]) => {\n  expect(lineTotal({ id, size })).toBe(price);\n});\n"

  - id: each
    chapter: "Test each နဲ့ ဘာကွာလဲ"
    narration: >
      [[mark:board-each]] code ဟောင်းတွေမှာ test each ဆိုတာကိုလည်း တွေ့ရပါလိမ့်မယ်။ [[mark:draw-each]]
      test each က Jest နဲ့ တူအောင် ထည့်ထားတဲ့ ပုံစံဟောင်း ဖြစ်ပြီး၊ array row ကို ဖြန့်ပြီး
      တန်ဖိုး တစ်ခုချင်းကို argument တစ်ခုစီ အနေနဲ့ ပေးပါတယ်။ [[mark:draw-for]] test for ကတော့ row
      တစ်ခုလုံးကို တန်ဖိုး တစ်ခုတည်း အနေနဲ့ ပေးပါတယ်။ ဒါကြောင့် test body က array တစ်ခုလုံးကို လက်ခံပြီး၊
      မျဉ်းတားထားတဲ့ နေရာမှာ တန်ဖိုးတွေကို ခွဲထုတ်ရပါတယ်။ ဒုတိယ argument အနေနဲ့ test context လို့ ခေါ်တဲ့ object ကိုပါ ရလို့၊ test တွေကို
      တစ်ပြိုင်နက် run တဲ့အခါလို နေရာမျိုးမှာ အသုံးဝင်ပါတယ်။ [[mark:draw-prefer]] အဲဒီအတွက် code
      အသစ်မှာတော့ test for ကို သုံးတာ ပိုကောင်းပါတယ်။ [[mark:draw-describe]] test တစ်ခုထက် ပိုတဲ့
      test တွေက data တူတူကို မျှသုံးရင်တော့၊ row တစ်ခုစီအတွက် describe တစ်ခုစီ ထုတ်ပေးတဲ့ describe for
      ကိုလည်း သုံးလို့ ရပါတယ်။ [[mark:draw-one]] ဘယ်ပုံစံပဲ သုံးသုံး၊ ဇယား တစ်ခုက အလုပ်လုပ်ပုံ
      တစ်ခုကိုပဲ စစ်သင့်ပါတယ်။ ဈေးနှုန်းနဲ့ ခွက်ကြီး ဈေးကို ဇယား နှစ်ခု ခွဲထားတာ ဒါကြောင့်ပါ။
    sources:
      - {
          title: "Vitest: test.each (Jest compatibility)",
          url: "https://vitest.dev/api/test#test-each",
        }
      - {
          title: "Vitest: test.for (does not spread arrays; the test context)",
          url: "https://vitest.dev/api/test#test-for",
        }
      - { title: "Vitest: describe.for", url: "https://vitest.dev/api/describe#describe-for" }
      - {
          title: "Vitest: Writing Tests, prefer test.for in new code",
          url: "https://vitest.dev/guide/learn/writing-tests#parameterized-tests",
        }
    actions:
      - id: board-each
        type: whiteboard.apply
        at: { mark: board-each }
        open: true
        clear: true
        upsertIds: [e-title]
      - id: draw-each
        type: whiteboard.apply
        at: { mark: draw-each }
        upsertIds: [e-each-code, e-each-mean]
        drawMs: 2500
      - id: draw-for
        type: whiteboard.apply
        at: { mark: draw-for }
        upsertIds: [e-for-code, e-underline, e-for-mean]
        drawMs: 3000
      - id: draw-prefer
        type: whiteboard.apply
        at: { mark: draw-prefer }
        upsertIds: [e-prefer]
        drawMs: 1200
      - id: draw-describe
        type: whiteboard.apply
        at: { mark: draw-describe }
        upsertIds: [e-describe-code, e-describe-mean]
        drawMs: 2500
      - id: draw-one
        type: whiteboard.apply
        at: { mark: draw-one }
        upsertIds: [e-one]
        drawMs: 1500

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ ပုံစံ တူပြီး data ပဲ ကွာတဲ့ test တွေကို test for နဲ့ ဇယား တစ်ခုအဖြစ်
      ရေးနိုင်ပါတယ်။ row တစ်ခုစီက သူ့ data နဲ့ နာမည်ပေးထားတဲ့ test တစ်ခုစီ ဖြစ်လို့၊ ကျရင် ဘယ် row လဲ
      ဆိုတာကို နာမည်ကနေ သိရပါတယ်။ [[mark:recap-rows]] row တစ်ကြောင်း ထည့်ရုံနဲ့ test တစ်ခု ရတဲ့အတွက်
      edge case တွေနဲ့ boundary တွေကို row အဖြစ် ထည့်ပါ။ test each ကတော့ ပုံစံဟောင်း ဖြစ်ပြီး၊ code
      အသစ်မှာ test for ကို သုံးပါ။ နောက် lesson မှာတော့ အဖြေကို ချက်ချင်း မပေးဘဲ နောက်မှ ပေးတဲ့ async
      code ကို ဘယ်လို test လုပ်ရလဲ ဆိုတာ ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "Vitest: Writing Tests, parameterized tests",
          url: "https://vitest.dev/guide/learn/writing-tests#parameterized-tests",
        }
      - {
          title: "Vitest: Testing in Practice, testing edge cases",
          url: "https://vitest.dev/guide/learn/testing-in-practice#testing-edge-cases",
        }
    actions:
      - id: close-each
        type: whiteboard.apply
        at: { scene: start }
        open: false
checks:
  - { type: timing.p95Ms, max: 300 }
