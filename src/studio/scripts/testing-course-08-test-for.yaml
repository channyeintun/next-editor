      package.json: |
        {
          "name": "testing-course-tea-shop",
          "private": true,
          "version": "1.0.0",
          "type": "module",
          "scripts": {
            "dev": "vite --host 0.0.0.0 --port 5173 --strictPort",
            "test": "vitest"
          },
          "devDependencies": {
            "vite": "7.3.7",
            "vitest": "5.1.0"
          }
        }
      src/menu.js: |
        export const MENU = {
          tea: { name: "လက်ဖက်ရည်", price: 1500, drink: true },
          coffee: { name: "ကော်ဖီ", price: 1800, drink: true },
          lime: { name: "သံပုရာရည်", price: 1200, drink: true },
          mohinga: { name: "မုန့်ဟင်းခါး", price: 2500, drink: false },
          paratha: { name: "ပလာတာ", price: 1200, drink: false },
        };

        export function priceOf(id) {
          const item = MENU[id];
          if (!item) throw new Error(`${id} is not on the menu`);
          return item.price;
        }
      src/menu.test.js: |
        import { expect, test } from "vitest";
        import { priceOf } from "./menu.js";

        test("tea costs 1500", () => {
          expect(priceOf("tea")).toBe(1500);
        });

        test("coffee costs 1800", () => {
          expect(priceOf("coffee")).toBe(1800);
        });

        test("lime costs 1200", () => {
          expect(priceOf("lime")).toBe(1200);
        });

        test("mohinga costs 2500", () => {
          expect(priceOf("mohinga")).toBe(2500);
        });

        test("paratha costs 1200", () => {
          expect(priceOf("paratha")).toBe(1200);
        });
      src/order.js: |
        import { MENU, priceOf } from "./menu.js";

        export const LARGE_EXTRA = 500;
        export const SUGAR_FEE = 100;

        export function lineTotal({ id, qty = 1, size = "small", sugar = false }) {
          let price = priceOf(id);
          if (size === "large") price += LARGE_EXTRA;
          if (sugar) price += SUGAR_FEE;
          return price * qty;
        }

        export function orderTotal(lines) {
          return lines.reduce((sum, line) => sum + lineTotal(line), 0);
        }
      src/order.test.js: |
        import { expect, test } from "vitest";
        import { lineTotal } from "./order.js";

        test("adds the large-cup extra", () => {
          expect(lineTotal({ id: "tea", size: "large" })).toBe(2000);
        });
      vite.config.js: |
        import { defineConfig } from "vite";
        import courseVitestBridge from "./course/vitest-bridge.js";

        // The course panel: the dev server runs the real Vitest and the preview shows its results.
        export default defineConfig({
          plugins: [courseVitestBridge()],
        });
