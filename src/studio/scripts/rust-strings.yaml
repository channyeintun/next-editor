# Rust from zero, lesson 13: strings.
#
# The arc: a whiteboard draws the two string types side by side. A String is
# a pointer, length and capacity (like a Vec) that owns its text on the heap
# and can grow into spare room; a string slice (&str) is only a pointer and a
# length that borrows text someone else owns, such as a literal stored in the
# program. Why two: owning text costs a heap allocation, and code that only
# reads doesn't need one. The editor then builds a String: String::from
# copies a literal into an owned String, push_str appends a string slice,
# push appends one char, and format! joins a String and a &str into a new
# String without taking ownership of either (the + operator, by contrast,
# takes the left String). A second board answers why place[0] doesn't
# compile: strings are UTF-8, "café" is five bytes but four characters, a
# byte index could land inside é and a character index couldn't be fast, so
# the compiler refuses with E0277; a byte range that cuts é panics at run
# time; .chars() gives whole characters. Back in the editor, len (bytes)
# against chars().count() (characters), and a for loop over chars(). The
# lesson is insert-only with one run, so the broken lines are only shown on
# the board. One run at the end.
#
# Every message on a board or in the narration was confirmed with rustc 1.98
# (edition 2024) on the broken variants:
#   `let place: &str = "café"; let first = place[0];` (and the same on a String)
#     error[E0277]: the type `str` cannot be indexed by `{integer}`
#       ^ string indices are ranges of `usize`
#   `let part = &place[0..4];` compiles, then panics when it runs:
#     end byte index 4 is not a char boundary; it is inside 'é' (bytes 3..5 of string)
#   `let s3 = s1 + &s2; println!("{s1} {s3}");` (the + operator takes s1)
#     error[E0382]: borrow of moved value: `s1`   (not shown; narration only
#     says + takes ownership of the String on its left)
# The bytes on board 2 are the real UTF-8 bytes of "café": 63 61 66 C3 A9.
#
# Spoken forms: the narration says "format" and "print line" (the course's
# convention from rust-hello; a "!" mid-sentence breaks the TTS prosody and the
# lexicon has no println entry), and "the e with an accent" rather than a lone
# "é" or spelled letters, which Pocket TTS may drop or misread. "café" as a
# whole word stays. The captions and the board keep the real code.
#
# Board colours: blue = the variable being named (message: String,
# place: &str), green = what works (owned text that can grow, .chars()),
# orange = the caveat (spare room, borrowed and fixed, the two bytes of é,
# half a character, a range that panics), red = the error, violet = the
# result (only read → &str / build → String, 5 bytes but 4 characters).
# #1e1e1e paints white on the dark board.
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/rust-strings.yaml
schemaVersion: 1

