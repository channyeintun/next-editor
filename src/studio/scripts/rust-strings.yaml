runtime:
  kind: rust-playground
  defaultMode: fixture
  fixture:
    latencyMs: 600
    result:
      status: success
      stdout: "Hello, world!

        Hello, world! Meet me at the café.

        café: 5 bytes, 4 characters

        c

        a

        f

        é\n"
      stderr: ""

scenes:
  - id: two-types
    chapter: String အမျိုးအစား နှစ်မျိုး
    narration: >-
      Rust မှာ အဓိက string type နှစ်မျိုး ရှိပြီး၊ program အများစုက နှစ်မျိုးလုံးကို သုံးပါတယ်။
      [[mark:draw-string]] ပထမ တစ်မျိုးက String ပါ။ Vec လိုပဲ သူ့ထဲမှာ အချက် သုံးချက် ရှိပါတယ်၊ heap
      ပေါ်က စာသားဆီ ညွှန်ထားတဲ့ pointer တစ်ခု၊ အရှည် တစ်ခုနဲ့ capacity တစ်ခုပါ။ String က အဲဒီ
      စာသားကို ပိုင်ဆိုင်တဲ့အတွက်၊ ပြောင်းလို့ရော ထပ်ဖြည့်လို့ပါ ရပါတယ်။ capacity ထဲမှာ အပို
      နေရာလွတ် ပါနေနိုင်ပြီး၊ အဲဒီ နေရာလွတ် ပြည့်သွားတဲ့အခါ String က သူ့ စာသားကို heap ပေါ်က
      ပိုကြီးတဲ့ block တစ်ခုဆီ ရွှေ့လိုက်ပါတယ်။ [[mark:draw-str]] နောက် တစ်မျိုးကတော့ string slice
      ပါ၊ ampersand str လို့ ရေးပါတယ်။ သူ့ထဲမှာ pointer တစ်ခုနဲ့ အရှည် တစ်ခုပဲ ရှိပါတယ်။ သူက တခြား
      တစ်ခုခုက ပိုင်ဆိုင်ထားတဲ့ စာသားကို borrow လုပ်ထားတာပါ၊ borrow ဆိုတာ ငှားသုံးတာပါ။ အဲဒီ စာသားက
      String တစ်ခုရဲ့ အပိုင်း တစ်ပိုင်း ဖြစ်နိုင်သလို၊ ကိုယ့် program ထဲမှာ သိမ်းထားတဲ့ literal
      တစ်ခုလည်း ဖြစ်နိုင်ပါတယ်။ အဲဒီ စာသားကို ဖတ်လို့တော့ ရပေမယ့်၊ ထပ်ဖြည့်လို့တော့ မရပါဘူး။
      [[mark:draw-why]] ဒါဆို ဘာကြောင့် type နှစ်မျိုး လိုရတာလဲ။ စာသားကို ပိုင်ဆိုင်ဖို့ဆိုရင် heap
      ပေါ်မှာ allocation တစ်ခု လုပ်ရပြီး၊ ဖတ်ရုံ ဖတ်ဖို့ဆိုရင်တော့ အဲဒါ မလိုပါဘူး။ ဒါကြောင့်
      စာသားကို ဖတ်ရုံပဲ ဖတ်တဲ့ function တွေက string slice ကို လက်ခံပြီး၊ စာသား တည်ဆောက်တဲ့ code
      ကတော့ String ကို သုံးပါတယ်။
    sources:
      - title: "The Rust Book — Defining Strings"
        url: "https://doc.rust-lang.org/book/ch08-02-strings.html#defining-strings"
      - title: "std::string::String — Representation"
        url: "https://doc.rust-lang.org/std/string/struct.String.html#representation"
      - title: "The Rust Book — String Literals as Slices"
        url: "https://doc.rust-lang.org/book/ch04-03-slices.html#string-literals-as-slices"
      - title: "The Rust Book — String Slices as Parameters"
        url: "https://doc.rust-lang.org/book/ch04-03-slices.html#string-slices-as-parameters"
    actions:
      # Opens in the quiet handle before the first word, already titled.
      - id: open-board-types
        type: whiteboard.apply
        at: { scene: start, offsetMs: -1500 }
        open: true
        upsertIds: [t1-title]
      - id: draw-string
        type: whiteboard.apply
        at: { mark: draw-string }
        upsertIds:
          [
            t1-s-box,
            t1-s-name,
            t1-s-fields,
            t1-s-arrow,
            t1-heap-box,
            t1-heap-text,
            t1-spare-box,
            t1-spare-text,
            t1-heap-label,
          ]
        drawMs: 4000
      - id: draw-str
        type: whiteboard.apply
        at: { mark: draw-str }
        upsertIds:
          [
            t1-v-box,
            t1-v-name,
            t1-v-fields,
            t1-v-arrow,
            t1-lit-box,
            t1-lit-text,
            t1-lit-where,
            t1-lit-label,
          ]
        drawMs: 3600
      - id: draw-why
        type: whiteboard.apply
        at: { mark: draw-why }
        upsertIds: [t1-why]
        drawMs: 1600

  - id: build
    chapter: String တစ်ခု တည်ဆောက်ခြင်း
    narration: >-
      ဒါဆို code ထဲမှာ String တစ်ခု တည်ဆောက်ကြည့်ရအောင်။ [[mark:open-main]] ကိုယ့် program က message
      ဆိုတဲ့ String တစ်ခုနဲ့ စထားပါတယ်။ [[mark:select-from]] String ရဲ့ from က literal တစ်ခုကို
      လက်ခံပါတယ်၊ literal ဆိုတာ string slice တစ်ခုပါ။ ပြီးတော့ အဲဒီ literal ထဲက စာသားကို heap ပေါ်က
      String အသစ် တစ်ခုထဲ ကူးထည့်ပေးပါတယ်။ အခု message က အဲဒီ စာသားကို ပိုင်ဆိုင်သွားပါပြီ။ mut နဲ့
      ကြေညာထားတဲ့အတွက် ပြောင်းလို့လည်း ရပါတယ်။ [[mark:type-push-str]] push str က String ရဲ့ အဆုံးမှာ
      string slice တစ်ခု ထပ်ဖြည့်ပေးပါတယ်။ အပို နေရာလွတ် မရှိတော့ရင် String က ကိုယ့်အစား သူ့ဘာသာ
      ကြီးလာပါတယ်။ [[mark:type-push]] push ကတော့ စာလုံး တစ်လုံးတည်း ထပ်ဖြည့်ပေးတာပါ။ exclamation
      mark ကို single quote ထဲမှာ ရေးထားတာ သတိထား ကြည့်ပါ၊ ဘာကြောင့်လဲဆိုတော့ သူက string မဟုတ်ဘဲ
      char တစ်လုံး ဖြစ်လို့ပါ။
    sources:
      - title: "The Rust Book — Creating a New String"
        url: "https://doc.rust-lang.org/book/ch08-02-strings.html#creating-a-new-string"
      - title: "The Rust Book — Appending with push_str or push"
        url: "https://doc.rust-lang.org/book/ch08-02-strings.html#appending-with-push_str-or-push"
      - title: "std::string::String::push_str"
        url: "https://doc.rust-lang.org/std/string/struct.String.html#method.push_str"
      - title: "std::string::String::push"
        url: "https://doc.rust-lang.org/std/string/struct.String.html#method.push"
    actions:
      - id: close-board-types
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: main.rs
      - id: select-from
        type: editor.select
        at: { mark: select-from }
        target:
          file: main.rs
          text: 'String::from("Hello")'
          occurrence: 1
      - id: type-push-str
        type: editor.type
        at: { mark: type-push-str }
        target:
          file: main.rs
          after: "    let mut message = String::from(\"Hello\");\n"
          occurrence: 1
        cadence: natural
        text: "    message.push_str(\", world\");\n"
      - id: type-push
        type: editor.type
        at: { mark: type-push }
        target:
          file: main.rs
          after: "    message.push_str(\", world\");\n"
          occurrence: 1
        cadence: natural
        text: "    message.push('!');\n"

  - id: join
    narration: >-
      [[mark:type-format]] အခု စာသား နှစ်ခုကို တစ်ခုတည်း ပေါင်းကြည့်ရအောင်။ place က literal တစ်ခု
      ဖြစ်တဲ့အတွက်၊ သူ့ type က string slice ပါ။ [[mark:select-format]] format macro က println နဲ့
      အလုပ်လုပ်ပုံ အတူတူပါပဲ၊ ဒါပေမဲ့ print မထုတ်ဘဲ String အသစ် တစ်ခုကို ပြန်ပေးပါတယ်။ သူက message
      နဲ့ place ကို borrow လုပ်ရုံပဲ လုပ်တာ ဖြစ်လို့၊ နှစ်ခုလုံးကို ဆက်သုံးလို့ ရပါသေးတယ်။ plus sign
      နဲ့လည်း string တွေကို ပေါင်းလို့ ရပါတယ်၊ ဒါပေမဲ့ သူက ဘယ်ဘက်က String ရဲ့ ownership ကို
      ယူသွားပါတယ်။ ဒါကြောင့် format နဲ့ ရေးတာက အများအားဖြင့် ပိုရှင်းပါတယ်။
    sources:
      - title: "The Rust Book — Concatenating with + or format!"
        url: "https://doc.rust-lang.org/book/ch08-02-strings.html#concatenating-with--or-format"
      - title: "std — macro format!"
        url: "https://doc.rust-lang.org/std/macro.format.html"
    actions:
      - id: type-format
        type: editor.type
        at: { mark: type-format, offsetMs: -400 }
        target:
          file: main.rs
          after: "    println!(\"{message}\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "

          \    let place: &str = \"café\";

          \    let invite = format!(\"{message} Meet me at the {place}.\");

          \    println!(\"{invite}\");\n"
      - id: select-format
        type: editor.select
        at: { mark: select-format }
        target:
          file: main.rs
          text: "format!"
          occurrence: 1

  - id: indexing
    chapter: place[0] ဘာကြောင့် compile မရလဲ
    narration: >-
      တခြား ဘာသာစကား အများစုမှာ ပထမ စာလုံးကို ယူချင်ရင် လေးထောင့်ကွင်းထဲမှာ 0 ထည့်ပြီး ယူလို့
      ရပါတယ်။ Rust မှာတော့ အဲဒီလို ရေးရင် compile လုပ်လို့ မရပါဘူး။ ဘာကြောင့်လဲ ဆိုတာ ကြည့်ရအောင်။
      [[mark:draw-bytes]] Rust မှာ string တွေကို UTF-8 byte တွေအနေနဲ့ သိမ်းထားပါတယ်။ ဒီမှာ အကွက်
      တစ်ကွက်က byte တစ်ခုပါ။ ရိုးရိုး English စာလုံး တစ်လုံးက 1 byte ပဲ ယူပေမယ့်၊ accent ပါတဲ့ e
      ကတော့ 2 byte ယူပါတယ်။ တခြား စာလုံးတွေဆိုရင် 3 byte၊ 4 byte အထိ ယူနိုင်ပါတယ်။ ဒါက string တစ်ခုက
      သူ့ စာသားကို သိမ်းထားတဲ့ ပုံစံပါ။ char တန်ဖိုး တစ်ခုတည်းကိုတော့ data type တွေ lesson မှာ
      မြင်ခဲ့သလိုပဲ 4 byte နဲ့ သိမ်းပါတယ်။ [[mark:draw-counts]] ဒါကြောင့် café က 5 byte ရှည်ပေမယ့်၊
      စာလုံးကတော့ 4 လုံးပဲ ရှိပါတယ်။ [[mark:draw-code]] ဒါဆို index 0 က ဘာကို ပြန်ပေးသင့်လဲ။ byte
      တစ်ခုလား။ အဲဒီလိုဆိုရင် index 3 က အဲဒီ e ရဲ့ တစ်ဝက်ကို ပြန်ပေးမှာပါ။ စာလုံး တစ်လုံးလား။
      အဲဒီလိုဆိုရင်တော့ Rust က အဲဒီ စာလုံးကို ရှာဖို့ အစကနေ ဖတ်လာရမှာ ဖြစ်ပြီး၊ index နဲ့
      ယူတာမျိုးကတော့ အမြဲ မြန်နေသင့်တဲ့ အလုပ်ပါ။ [[mark:draw-error]] ဒါကြောင့် Rust က ခန့်မှန်းပြီး
      မလုပ်ပါဘူး။ compiler က E0277 error နဲ့ ရပ်သွားပါတယ်၊ str type ကို integer နဲ့ index လုပ်လို့
      မရပါဘူးတဲ့။ str ဆိုတာ string slice က ညွှန်ထားတဲ့ စာသားပါ။ String မှာလည်း ဒီ error ပဲ တက်ပါတယ်။
      [[mark:draw-panic]] byte range နဲ့တော့ slice လုပ်လို့ ရပါသေးတယ်။ ဒါပေမဲ့ အဲဒီ range က e ကို
      တစ်ဝက် ဖြတ်မိရင် program run နေချိန်မှာ panic ဖြစ်သွားပါလိမ့်မယ်။ [[mark:draw-chars]] စာလုံး
      အပြည့်အစုံတွေ လိုချင်ရင် chars နဲ့ တောင်းရပါတယ်။
    sources:
      - title: "The Rust Book — Indexing into Strings"
        url: "https://doc.rust-lang.org/book/ch08-02-strings.html#indexing-into-strings"
      - title: "The Rust Book — Internal Representation"
        url: "https://doc.rust-lang.org/book/ch08-02-strings.html#internal-representation"
      - title: "The Rust Book — Slicing Strings"
        url: "https://doc.rust-lang.org/book/ch08-02-strings.html#slicing-strings"
      - title: "Rust error codes — E0277"
        url: "https://doc.rust-lang.org/error_codes/E0277.html"
    actions:
      - id: open-board-index
        type: whiteboard.apply
        at: { scene: start }
        open: true
        clear: true
        upsertIds: [t2-title]
      - id: draw-bytes
        type: whiteboard.apply
        at: { mark: draw-bytes }
        upsertIds:
          [
            t2-b0,
            t2-b1,
            t2-b2,
            t2-b3,
            t2-b4,
            t2-v0,
            t2-v1,
            t2-v2,
            t2-v3,
            t2-v4,
            t2-i0,
            t2-i1,
            t2-i2,
            t2-i3,
            t2-i4,
            t2-ch0,
            t2-ch1,
            t2-ch2,
            t2-ch3,
          ]
        drawMs: 4200
      - id: draw-counts
        type: whiteboard.apply
        at: { mark: draw-counts }
        upsertIds: [t2-nbytes, t2-nchars]
        drawMs: 1400
      - id: draw-code
        type: whiteboard.apply
        at: { mark: draw-code }
        upsertIds: [t2-code, t2-u-code, t2-half]
        drawMs: 2400
      - id: draw-error
        type: whiteboard.apply
        at: { mark: draw-error }
        upsertIds: [t2-err1, t2-err2]
        drawMs: 2400
      - id: draw-panic
        type: whiteboard.apply
        at: { mark: draw-panic }
        upsertIds: [t2-panic]
        drawMs: 1400
      - id: draw-chars
        type: whiteboard.apply
        at: { mark: draw-chars }
        upsertIds: [t2-fix]
        drawMs: 1400

  - id: chars
    chapter: စာလုံး တစ်လုံးချင်း သွားခြင်း
    narration: >-
      [[mark:type-counts]] editor ထဲ ပြန်သွားပြီး၊ café ကို နည်းလမ်း နှစ်မျိုးလုံးနဲ့
      တိုင်းကြည့်ရအောင်။ [[mark:select-len]] len က အရှည်ကို byte အရေအတွက်နဲ့ ပြန်ပေးပါတယ်၊
      ဘာကြောင့်လဲဆိုတော့ string တစ်ခုက သိမ်းထားတာက byte တွေ ဖြစ်လို့ပါ။ [[mark:select-chars]] chars
      ကတော့ စာလုံးတွေကို တစ်လုံးချင်း ထုတ်ပေးပြီး၊ count က အဲဒါတွေကို ရေတွက်ပေးပါတယ်။
      [[mark:type-loop]] ပြီးတော့ chars ပေါ်မှာ for loop တစ်ခု ပတ်လိုက်ရင်၊ စာလုံး တစ်လုံးချင်းစီကို
      သူ့ စာကြောင်းနဲ့သူ print ထုတ်ပေးပါတယ်။
    sources:
      - title: "The Rust Book — Iterating Over Strings"
        url: "https://doc.rust-lang.org/book/ch08-02-strings.html#iterating-over-strings"
      - title: "std — str::len"
        url: "https://doc.rust-lang.org/std/primitive.str.html#method.len"
      - title: "std — str::chars"
        url: "https://doc.rust-lang.org/std/primitive.str.html#method.chars"
    actions:
      - id: close-board-index
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: type-counts
        type: editor.type
        at: { mark: type-counts, offsetMs: 300 }
        target:
          file: main.rs
          after: "    println!(\"{invite}\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "

          \    let bytes = place.len();

          \    let characters = place.chars().count();

          \    println!(\"{place}: {bytes} bytes, {characters} characters\");\n"
      - id: select-len
        type: editor.select
        at: { mark: select-len }
        target:
          file: main.rs
          text: "place.len()"
          occurrence: 1
      - id: select-chars
        type: editor.select
        at: { mark: select-chars }
        target:
          file: main.rs
          text: "place.chars().count()"
          occurrence: 1
      - id: type-loop
        type: editor.type
        at: { mark: type-loop }
        target:
          file: main.rs
          after: "{characters} characters\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "    for c in place.chars() {

          \        println!(\"{c}\");

          \    }\n"

  - id: run
    narration: >-
      [[mark:run]] ကဲ၊ run ကြည့်ရအောင်။ ပထမ စာကြောင်းက Hello, world ဖြစ်ပြီး၊ အဆုံးက exclamation
      mark က push နဲ့ ထည့်လိုက်တာပါ။ နောက် စာကြောင်းကတော့ format က တည်ဆောက်ပေးလိုက်တဲ့ invite ပါ။
      café ဆိုတဲ့ စကားလုံးက 5 byte ရှိပေမယ့်၊ စာလုံးကတော့ 4 လုံးပါ။ ပြီးတော့ loop က စာလုံး
      တစ်လုံးချင်းစီကို အပြည့်အစုံ print ထုတ်ပေးပြီး၊ accent ပါတဲ့ e ကိုတောင် အပြည့် ထုတ်ပေးပါတယ်။
    sources:
      - title: "The Rust Book — Storing UTF-8 Encoded Text with Strings"
        url: "https://doc.rust-lang.org/book/ch08-02-strings.html"
    actions:
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "5 bytes, 4 characters"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: 'message.push_str(", world");'

  - id: wrap
    narration: >-
      ဒါဆို ပြန်ချုပ်ရရင်၊ String က သူ့ စာသားကို ပိုင်ဆိုင်ပြီး ထပ်ဖြည့်လို့ ရပါတယ်၊ string slice
      ကတော့ စာသားကို ဖတ်ဖို့ borrow လုပ်ထားတာပါ။ နှစ်မျိုးလုံးက UTF-8 ဖြစ်တဲ့အတွက်၊ ကိန်းဂဏန်း index
      နဲ့ မယူဘဲ chars နဲ့ တောင်းရပါတယ်။ နောက် lesson မှာတော့ HashMap၊ ဆိုလိုတာက key တစ်ခုနဲ့
      သိမ်းပြီး key နဲ့ပဲ ပြန်ရှာလို့ ရတဲ့ တန်ဖိုးတွေကို ကြည့်သွားပါမယ်။
    sources:
      - title: "The Rust Book — Handling the Complexities of Strings"
        url: "https://doc.rust-lang.org/book/ch08-02-strings.html#handling-the-complexities-of-strings"
      - title: "The Rust Book — Storing Keys with Associated Values in Hash Maps"
        url: "https://doc.rust-lang.org/book/ch08-03-hash-maps.html"
    actions: []

checks:
  - { type: timing.p95Ms, max: 300 }
