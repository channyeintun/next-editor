build:
  voiceProfile: pocket-alba-v1
  seed: 39

runtime:
  kind: rust-playground
  defaultMode: fixture
  fixture:
    latencyMs: 600
    result:
      status: success
      stdout: "Hello, world!\nHello, world! Meet me at the café.\ncafé: 5 bytes, 4 characters\nc\na\nf\né\n"
      stderr: ""

scenes:
  - id: two-types
    chapter: Two kinds of string
    narration: >
      Rust has two main string types, and most programs use both.
      [[mark:draw-string]] First, String. Like a Vec, it holds three things:
      a pointer to its text on the heap, a length, and a capacity. The String
      owns that text, so it can change and grow it. The capacity can
      include spare room. When that's full, the String moves its text to a
      bigger block on the heap.
      [[mark:draw-str]] The other type is the string slice, written ampersand
      str. It's only a pointer and a length. It borrows text that something
      else owns: part of a String, or a literal stored in your program. It
      can read that text, but it can't grow it.
      [[mark:draw-why]] So why two types? Owning text needs a heap
      allocation, and reading text doesn't. That's why functions that only
      read take a string slice, and code that builds text uses a String.
    sources:
      - title: "The Rust Book — Defining Strings"
        url: "https://doc.rust-lang.org/book/ch08-02-strings.html#defining-strings"
      - title: "std::string::String — Representation"
        url: "https://doc.rust-lang.org/std/string/struct.String.html#representation"
      - title: "The Rust Book — String Literals as Slices"
        url: "https://doc.rust-lang.org/book/ch04-03-slices.html#string-literals-as-slices"
      - title: "The Rust Book — String Slices as Parameters"
        url: "https://doc.rust-lang.org/book/ch04-03-slices.html#string-slices-as-parameters"
    actions:
      # Opens in the quiet handle before the first word, already titled.
      - id: open-board-types
        type: whiteboard.apply
        at: { scene: start, offsetMs: -1500 }
        open: true
        upsertIds: [t1-title]
      - id: draw-string
        type: whiteboard.apply
        at: { mark: draw-string }
        upsertIds:
          [
            t1-s-box,
            t1-s-name,
            t1-s-fields,
            t1-s-arrow,
            t1-heap-box,
            t1-heap-text,
            t1-spare-box,
            t1-spare-text,
            t1-heap-label,
          ]
        drawMs: 4000
      - id: draw-str
        type: whiteboard.apply
        at: { mark: draw-str }
        upsertIds:
          [
            t1-v-box,
            t1-v-name,
            t1-v-fields,
            t1-v-arrow,
            t1-lit-box,
            t1-lit-text,
            t1-lit-where,
            t1-lit-label,
          ]
        drawMs: 3600
      - id: draw-why
        type: whiteboard.apply
        at: { mark: draw-why }
        upsertIds: [t1-why]
        drawMs: 1600

  - id: build
    chapter: Building a String
    narration: >
      Let's build a String in code. [[mark:open-main]] Our program starts
      with one, called message.
      [[mark:select-from]] String::from takes a literal, which is a string
      slice, and copies its text into a new String on the heap. Now message
      owns that text. It's declared with mut, so we can change it.
      [[mark:type-push-str]] push_str adds a string slice to the end. If
      there's no spare room, the String grows for you.
      [[mark:type-push]] push adds one character. The exclamation mark is in
      single quotes, because it's a char, not a string.
    sources:
      - title: "The Rust Book — Creating a New String"
        url: "https://doc.rust-lang.org/book/ch08-02-strings.html#creating-a-new-string"
      - title: "The Rust Book — Appending with push_str or push"
        url: "https://doc.rust-lang.org/book/ch08-02-strings.html#appending-with-push_str-or-push"
      - title: "std::string::String::push_str"
        url: "https://doc.rust-lang.org/std/string/struct.String.html#method.push_str"
      - title: "std::string::String::push"
        url: "https://doc.rust-lang.org/std/string/struct.String.html#method.push"
    actions:
      - id: close-board-types
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: main.rs
      - id: select-from
        type: editor.select
        at: { mark: select-from }
        target:
          file: main.rs
          text: 'String::from("Hello")'
          occurrence: 1
      - id: type-push-str
        type: editor.type
        at: { mark: type-push-str }
        target:
          file: main.rs
          after: "    let mut message = String::from(\"Hello\");\n"
          occurrence: 1
        cadence: natural
        text: "    message.push_str(\", world\");\n"
      - id: type-push
        type: editor.type
        at: { mark: type-push }
        target:
          file: main.rs
          after: "    message.push_str(\", world\");\n"
          occurrence: 1
        cadence: natural
        text: "    message.push('!');\n"

  - id: join
    narration: >
      [[mark:type-format]] Now let's join some text. place is a literal, so
      its type is a string slice.
      [[mark:select-format]] The format macro works like print line, but
      instead of printing, it returns a new String. It only borrows message
      and place, so you can still use both. A plus sign can join strings
      too, but it takes ownership of the String on its left. So format is
      usually the clearer choice.
    sources:
      - title: "The Rust Book — Concatenating with + or format!"
        url: "https://doc.rust-lang.org/book/ch08-02-strings.html#concatenating-with--or-format"
      - title: "std — macro format!"
        url: "https://doc.rust-lang.org/std/macro.format.html"
    actions:
      - id: type-format
        type: editor.type
        at: { mark: type-format, offsetMs: -400 }
        target:
          file: main.rs
          after: "    println!(\"{message}\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n    let place: &str = \"café\";\n    let invite = format!(\"{message} Meet me at the {place}.\");\n    println!(\"{invite}\");\n"
      - id: select-format
        type: editor.select
        at: { mark: select-format }
        target:
          file: main.rs
          text: "format!"
          occurrence: 1

  - id: indexing
    chapter: Why place[0] doesn't compile
    narration: >
      In many languages, you'd get the first letter with a zero in square
      brackets. In Rust, that doesn't compile. Let's see why.
      [[mark:draw-bytes]] Strings in Rust are stored as UTF-8 bytes. Each box
      is one byte. Plain English letters take one byte each, but the e with
      an accent takes two. Other characters can take three or four.
      That's how a string stores its text. A char value on its own is still
      four bytes, as you saw with data types.
      [[mark:draw-counts]] So café is five bytes long, but it's only four
      characters.
      [[mark:draw-code]] Now, what should index zero give you? A byte? Then
      index three would give you half of that e. A character? Then Rust
      would have to read from the start to find it, and indexing should
      always be fast.
      [[mark:draw-error]] So Rust doesn't guess. The compiler stops with
      error E0277: the type str can't be indexed by an integer. str is the
      text a string slice points to. A String gives the same error.
      [[mark:draw-panic]] You can still slice with a byte range. But a range
      that cuts that e in half panics when the program runs.
      [[mark:draw-chars]] To get whole characters, ask for them with chars.
    sources:
      - title: "The Rust Book — Indexing into Strings"
        url: "https://doc.rust-lang.org/book/ch08-02-strings.html#indexing-into-strings"
      - title: "The Rust Book — Internal Representation"
        url: "https://doc.rust-lang.org/book/ch08-02-strings.html#internal-representation"
      - title: "The Rust Book — Slicing Strings"
        url: "https://doc.rust-lang.org/book/ch08-02-strings.html#slicing-strings"
      - title: "Rust error codes — E0277"
        url: "https://doc.rust-lang.org/error_codes/E0277.html"
    actions:
      - id: open-board-index
        type: whiteboard.apply
        at: { scene: start }
        open: true
        clear: true
        upsertIds: [t2-title]
      - id: draw-bytes
        type: whiteboard.apply
        at: { mark: draw-bytes }
        upsertIds:
          [
            t2-b0,
            t2-b1,
            t2-b2,
            t2-b3,
            t2-b4,
            t2-v0,
            t2-v1,
            t2-v2,
            t2-v3,
            t2-v4,
            t2-i0,
            t2-i1,
            t2-i2,
            t2-i3,
            t2-i4,
            t2-ch0,
            t2-ch1,
            t2-ch2,
            t2-ch3,
          ]
        drawMs: 4200
      - id: draw-counts
        type: whiteboard.apply
        at: { mark: draw-counts }
        upsertIds: [t2-nbytes, t2-nchars]
        drawMs: 1400
      - id: draw-code
        type: whiteboard.apply
        at: { mark: draw-code }
        upsertIds: [t2-code, t2-u-code, t2-half]
        drawMs: 2400
      - id: draw-error
        type: whiteboard.apply
        at: { mark: draw-error }
        upsertIds: [t2-err1, t2-err2]
        drawMs: 2400
      - id: draw-panic
        type: whiteboard.apply
        at: { mark: draw-panic }
        upsertIds: [t2-panic]
        drawMs: 1400
      - id: draw-chars
        type: whiteboard.apply
        at: { mark: draw-chars }
        upsertIds: [t2-fix]
        drawMs: 1400

  - id: chars
    chapter: Walking the characters
    narration: >
      [[mark:type-counts]] Back in the code, let's measure café both ways.
      [[mark:select-len]] len gives you the length in bytes, because bytes
      are what a string stores.
      [[mark:select-chars]] chars gives you the characters one at a time, and
      count counts them.
      [[mark:type-loop]] And a for loop over chars prints each character on
      its own line.
    sources:
      - title: "The Rust Book — Iterating Over Strings"
        url: "https://doc.rust-lang.org/book/ch08-02-strings.html#iterating-over-strings"
      - title: "std — str::len"
        url: "https://doc.rust-lang.org/std/primitive.str.html#method.len"
      - title: "std — str::chars"
        url: "https://doc.rust-lang.org/std/primitive.str.html#method.chars"
    actions:
      - id: close-board-index
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: type-counts
        type: editor.type
        at: { mark: type-counts, offsetMs: 300 }
        target:
          file: main.rs
          after: "    println!(\"{invite}\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n    let bytes = place.len();\n    let characters = place.chars().count();\n    println!(\"{place}: {bytes} bytes, {characters} characters\");\n"
      - id: select-len
        type: editor.select
        at: { mark: select-len }
        target:
          file: main.rs
          text: "place.len()"
          occurrence: 1
      - id: select-chars
        type: editor.select
        at: { mark: select-chars }
        target:
          file: main.rs
          text: "place.chars().count()"
          occurrence: 1
      - id: type-loop
        type: editor.type
        at: { mark: type-loop }
        target:
          file: main.rs
          after: "{characters} characters\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "    for c in place.chars() {\n        println!(\"{c}\");\n    }\n"

  - id: run
    narration: >
      [[mark:run]] Let's run it. Hello, world, with the exclamation mark from
      push. Then the invite that format built. The word café is five bytes,
      but four characters. And the loop prints each character whole, even
      the e with the accent.
    sources:
      - title: "The Rust Book — Storing UTF-8 Encoded Text with Strings"
        url: "https://doc.rust-lang.org/book/ch08-02-strings.html"
    actions:
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "5 bytes, 4 characters"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: 'message.push_str(", world");'

  - id: wrap
    narration: >
      So a String owns its text and can grow it, and a string slice borrows
      text to read it. Both are UTF-8, so you don't index them by number. You
      ask for chars instead. Next, hash maps: values you store and look up by
      a key.
    sources:
      - title: "The Rust Book — Handling the Complexities of Strings"
        url: "https://doc.rust-lang.org/book/ch08-02-strings.html#handling-the-complexities-of-strings"
      - title: "The Rust Book — Storing Keys with Associated Values in Hash Maps"
        url: "https://doc.rust-lang.org/book/ch08-03-hash-maps.html"
    actions: []

checks:
  - { type: timing.p95Ms, max: 300 }
