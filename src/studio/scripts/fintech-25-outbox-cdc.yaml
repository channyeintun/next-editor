# Fintech Engineering, lesson 25: the outbox and CDC (Burmese).
#
# Source: Fintech Engineering Handbook, "Notifying reliably (Outbox and CDC)" (CC BY 4.0, Voytek Pitula).
# Start state: store.go holds a tiny transactional DB (postings + outbox tables), Event with a
# stable id, and a scripted Broker ("ok" / "timeout" = delivered but an error / "down"); consumer.go
# a Consumer that applies every event; main.go the two dual writes and relay().
# Edits, all insert-only:
#   1. withOutbox(): the posting and its outbox row in one transaction
#   2. two postings through the outbox, a relay that crashes after one publish, a second relay
#                                         -> run-2: nothing lost, but p3 applied twice
#   3. the consumer dedupes on the event id   -> run-3: got 3, applied [p3 p4]
# Figures: dual (the two failure orders), outbox (one transaction, the relay, at-least-once),
# cdc (tail the log; row-shaped events), options (four ways to publish), iv.
# Built by ~/Documents/fintech-course-work/tools/build-lesson.ts; fixtures by sim-go.ts --write.
schemaVersion: 1

lesson:
  slug: fintech-25-outbox-cdc
  title: "Fintech Engineering 25: Outbox နဲ့ CDC"
  locale: my-MM
  workspace:
