  - id: try-it
    chapter: ကိုယ်တိုင် စမ်းကြည့်ပါ
    narration: >-
      [[mark:close-iv]] ကိုယ်တိုင် စမ်းကြည့်ဖို့ တစ်ခု ရှိပါတယ်။ [[mark:sel-try]] consumer ထဲက dedupe
      လုပ်တဲ့ line လေးကြောင်းကို ဖျက်ပြီး run ကြည့်ပါ။ message သုံးခု ရောက်တာ အတူတူပဲ ဖြစ်ပေမဲ့ ပထမ
      posting ကို နှစ်ခါ apply လုပ်တာ ပြန်ပေါ်လာပါမယ်။ outbox က ဘာမှ မပျောက်အောင် ကာကွယ်ပေးပြီး၊ dedupe
      က နှစ်ခါ မဖြစ်အောင် ကာကွယ်ပေးတာမို့ နှစ်ခုလုံး လိုပါတယ်။ [[mark:recap]] ပြန်ချုပ်ရရင်၊ publish လုပ်မယ့်
      intent ကို state နဲ့ transaction တစ်ခုတည်းမှာ သိမ်းပြီး၊ relay ဒါမှမဟုတ် log က ထုတ်ပေးပါစေ။ consumer
      ဘက်က အမြဲ dedupe လုပ်ပါ။ နောက် lesson မှာတော့ ဒီလောက် ကာကွယ်ထားတာတောင် ကိုယ့် ledger နဲ့ provider
      ရဲ့ record တွေ ကွဲလာတဲ့အခါ ဘယ်လို ရှာပြီး ပြင်မလဲ ဆိုတဲ့ reconciliation ကို ကြည့်ပါမယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Notifying reliably (Outbox and CDC) (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#notifying-reliably-outbox-and-cdc",
        }
    actions:
      - { id: close-iv, type: slide.close, at: { mark: close-iv } }
      - id: sel-try
        type: editor.select
        at: { mark: sel-try }
        target:
          {
            file: consumer.go,
            text: "\tif c.seen[e.ID] {\n\t\treturn\n\t}\n\tc.seen[e.ID] = true",
            occurrence: 1,
          }

checks:
  - { type: timing.p95Ms, max: 300 }
