    files:
      consumer.go: |
        package main

        import "fmt"

        // Consumer applies the events it receives.
        type Consumer struct {
        	seen    map[string]bool
        	got     int
        	applied []string
        }

        func (c *Consumer) Handle(e Event) {
        	c.got++
        	c.applied = append(c.applied, e.Posting)
        }

        func (c *Consumer) String() string {
        	return fmt.Sprintf("consumer got %d, applied %v", c.got, c.applied)
        }
      main.go: |
        package main

        import "fmt"

        // publishThenCommit: the publish times out, so we roll back. The broker had it already.
        func publishThenCommit(db *DB, b *Broker, id string) {
        	tx := db.Begin()
        	tx.Post(id)
        	if err := b.Publish(event(id)); err != nil {
        		tx.Rollback()
        		return
        	}
        	tx.Commit()
        }

        // commitThenPublish: the commit lands, then the publish fails, and nothing retries it.
        func commitThenPublish(db *DB, b *Broker, id string) {
        	tx := db.Begin()
        	tx.Post(id)
        	tx.Commit()
        	_ = b.Publish(event(id)) // the error is logged; nothing publishes it again
        }

        // relay publishes unsent outbox rows in order and marks each one sent. A failed publish
        // stops it until its next run. crashAfter kills it after that publish, before the mark.
        func (db *DB) relay(b *Broker, crashAfter string) {
        	for i := range db.outbox {
        		r := &db.outbox[i]
        		if r.Sent {
        			continue
        		}
        		if b.Publish(r.Event) != nil || r.Event.ID == crashAfter {
        			return
        		}
        		r.Sent = true
        	}
        }

        func main() {
        	db, c, b := setup("timeout", "down")
        	publishThenCommit(db, b, "p1")
        	commitThenPublish(db, b, "p2")
        	fmt.Println("dual write:", db, "|", c)
        }
      store.go: |
        package main

        import "fmt"

        // Event is what we publish when a posting commits. Its ID is stable: one posting, one ID.
        type Event struct {
        	ID      string
        	Posting string
        }

        func event(posting string) Event { return Event{"evt-" + posting, posting} }

        // DB is a tiny database with two tables, changed only through a transaction.
        type DB struct {
        	postings []string
        	outbox   []Row
        }

        // Row is one outbox row: an event to publish and whether the relay has marked it sent.
        type Row struct {
        	Event Event
        	Sent  bool
        }

        // Tx buffers writes: Commit applies all of them, Rollback none.
        type Tx struct {
        	db       *DB
        	postings []string
        	outbox   []Row
        }

        func (db *DB) Begin() *Tx     { return &Tx{db: db} }
        func (tx *Tx) Post(id string) { tx.postings = append(tx.postings, id) }
        func (tx *Tx) Outbox(e Event) { tx.outbox = append(tx.outbox, Row{Event: e}) }
        func (tx *Tx) Rollback()      {}
        func (tx *Tx) Commit() {
        	tx.db.postings = append(tx.db.postings, tx.postings...)
        	tx.db.outbox = append(tx.db.outbox, tx.outbox...)
        }

        func (db *DB) String() string { return fmt.Sprint("db ", db.postings) }

        // Broker hands each published event to the consumer. Its script decides each publish:
        // "ok", "timeout" (delivered, but the caller gets an error) or "down" (not delivered).
        type Broker struct {
        	to     *Consumer
        	script []string
        }

        func (b *Broker) Publish(e Event) error {
        	outcome := "ok"
        	if len(b.script) > 0 {
        		outcome, b.script = b.script[0], b.script[1:]
        	}
        	if outcome != "down" {
        		b.to.Handle(e)
        	}
        	if outcome != "ok" {
        		return fmt.Errorf("publish %s: %s", e.ID, outcome)
        	}
        	return nil
        }

        func setup(script ...string) (*DB, *Consumer, *Broker) {
        	c := &Consumer{seen: map[string]bool{}}
        	return &DB{}, c, &Broker{to: c, script: script}
        }
