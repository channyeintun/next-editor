  - id: options
    narration: >-
      [[mark:show-opt]] outbox နဲ့ CDC အပြင် နောက်ထပ် နည်း နှစ်မျိုး ရှိပါတယ်။ [[mark:opt-2]] listen-to-yourself
      မှာ အစဉ်ကို ပြောင်းပြန် လုပ်ပါတယ်။ event ကို Kafka ကို အရင် publish လုပ်ပြီး၊ ကိုယ့် state ကိုလည်း
      အဲဒီ event ကနေ ပြန်တည်ဆောက်ပါတယ်။ ဒါကြောင့် ကိုယ့် state က event stream ထက် နောက်ကျပါတယ်။
      [[mark:opt-3]] event sourcing သုံးထားရင်တော့ event log က database ထဲမှာ ရှိပြီးသားမို့ publish လုပ်တာက
      အဲဒီ log ကို ဖတ်ရုံပါပဲ။ [[mark:pt-alo]] ဘယ်နည်းကို ရွေးရွေး delivery က at-least-once ပါ။ relay ဖြစ်ဖြစ်
      connector ဖြစ်ဖြစ်၊ publish လုပ်ပြီး မှတ်မထားရခင် crash ဖြစ်နိုင်လို့ပါ။ ဒါကြောင့် consumer တိုင်းက
      stable event id နဲ့ dedupe လုပ်ရပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Notifying reliably (Outbox and CDC) (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#notifying-reliably-outbox-and-cdc",
        }
      - {
          title: "Fintech Engineering Handbook — Event sourcing (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#event-sourcing",
        }
    actions:
