  voiceProfile:
    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 9525

runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "dual write: db [p2] | consumer got 1, applied [p1]\n"
      run-2:
        status: success
        exitCode: 0
        output: "dual write: db [p2] | consumer got 1, applied [p1]\noutbox:     db [p3 p4] | consumer got 3, applied [p3 p3 p4]\n"
      run-3:
        status: success
        exitCode: 0
        output: "dual write: db [p2] | consumer got 1, applied [p1]\noutbox:     db [p3 p4] | consumer got 3, applied [p3 p4]\n"

scenes:
