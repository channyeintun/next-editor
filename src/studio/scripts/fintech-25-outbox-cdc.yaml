    chapter: Dual write
    narration: >-
      ledger မှာ posting တစ်ခု commit ဖြစ်တိုင်း အဲဒါကို သိဖို့ လိုတဲ့ system တွေ ရှိပါတယ်။ user ကို
      notification ပို့တဲ့ service၊ risk စစ်တဲ့ service၊ reporting လိုမျိုးပါ။ Kafka ကို event publish လုပ်တာ၊ webhook ခေါ်တာ စတဲ့ နည်းတွေနဲ့ အသိပေးကြပါတယ်။ ပြဿနာက database commit နဲ့ publish ဟာ transaction
      တစ်ခုတည်း ထဲမှာ မရှိတာပါ။ [[mark:sel-ptc]] ဒီ function က အရင် publish လုပ်ပြီးမှ commit လုပ်ပါတယ်။
      publish က timeout ဖြစ်ရင် fail တယ်လို့ ယူပြီး rollback လုပ်ပါတယ်။ [[mark:sel-ctp]] ဒီ function
      ကတော့ အရင် commit လုပ်ပြီးမှ publish လုပ်ပါတယ်၊ publish fail ရင် log ပဲ ထားခဲ့ပါတယ်။
      [[mark:sel-setup]] broker က ပထမ publish မှာ timeout ပြန်ပြီး ဒုတိယ publish မှာ down နေပါမယ်။
      ဒီ demo ရဲ့ timeout က message က broker ဆီ ရောက်ပြီးမှ ack ပျောက်တဲ့ ကိစ္စပါ။ posting နှစ်ခုအတွက် database
      ထဲမှာ ဘာရှိပြီး consumer က ဘာရမလဲ ခန့်မှန်းကြည့်ပါ။ [[mark:run-1]] run လိုက်ရအောင်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Notifying reliably (Outbox and CDC) (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#notifying-reliably-outbox-and-cdc",
        }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }
      - id: sel-ptc
        type: editor.select
        at: { mark: sel-ptc }
        target:
          {
            file: main.go,
            text: "\tif err := b.Publish(event(id)); err != nil {\n\t\ttx.Rollback()",
            occurrence: 1,
          }
      - id: sel-ctp
        type: editor.select
        at: { mark: sel-ctp }
        target: { file: main.go, text: "\ttx.Commit()\n\t_ = b.Publish(event(id))", occurrence: 1 }
      - id: sel-setup
        type: editor.select
        at: { mark: sel-setup }
        target: { file: main.go, text: 'setup("timeout", "down")', occurrence: 1 }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "dual write: db [p2] | consumer got 1, applied [p1]",
          timeoutMs: 8000,
        }

  - id: dual
    chapter: Phantom နဲ့ missing event
    narration: >-
      [[mark:pt-dual]] database ထဲမှာ ဒုတိယ posting ပဲ ရှိပြီး၊ consumer ကတော့ ပထမ posting ကိုပဲ
      ရထားပါတယ်။ နှစ်ခုလုံး မှားနေပါတယ်။ [[mark:show-dual]] ပထမ အစဉ်မှာ broker က message ကို
      ရထားပြီးပြီ ဖြစ်ပေမဲ့ ကိုယ်က response မရလို့ rollback လုပ်လိုက်ပါတယ်။ ဒါကြောင့် consumer က
      မဖြစ်ခဲ့တဲ့ posting တစ်ခုအတွက် အလုပ်လုပ်ပါတယ်။ ဒါက No invented data ကို ချိုးတာပါ၊ ငွေကို
      မရှိဘဲ မဖန်တီးရဘူး ဆိုတဲ့ မူပါ။ [[mark:dual-2]] ဒုတိယ အစဉ်မှာ commit ဖြစ်သွားပေမဲ့ publish fail
      လို့ ဘယ်သူမှ မကြားရပါဘူး။ ဒါက No lost data ကို ချိုးတာပါ၊ ငွေနဲ့ ပတ်သက်ပြီး ဖြစ်ခဲ့သမျှ
      မပျောက်ရဘူး ဆိုတဲ့ မူပါ။ ဘယ်အစဉ်နဲ့ ရေးရေး ပြဿနာ တစ်ခု ကျန်ပါတယ်၊ database နဲ့ broker ကို
      transaction တစ်ခုတည်း ထဲ ထည့်လို့ မရလို့ပါ။ [[mark:pt-tpc]] textbook အဖြေကတော့ distributed transaction ဖြစ်တဲ့ two-phase commit ပါ။ ဒါပေမဲ့ ရှုပ်ထွေးလွန်းပြီး standard လုပ်ပြီး ပြန်သုံးဖို့ ကောင်းတဲ့
      နည်းလမ်း မရှိလို့ လက်တွေ့မှာ သုံးတာ ရှားပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Notifying reliably (Outbox and CDC) (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#notifying-reliably-outbox-and-cdc",
        }
      - {
          title: "Fintech Engineering Handbook — Principles (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#principles",
        }
    actions:
      - id: pt-dual
        type: console.point
        at: { mark: pt-dual }
        target: { text: "dual write: db [p2] | consumer got 1, applied [p1]", occurrence: 1 }
      - {
          id: show-dual,
          type: slide.show,
          at: { mark: show-dual, offsetMs: -700 },
          slideId: dual-1,
        }
      - {
          id: pt-a3,
          type: slide.point,
          at: { afterAction: show-dual },
          target: { x: 0.256, y: 0.809 },
        }
      - { id: dual-2, type: slide.show, at: { mark: dual-2 }, slideId: dual-2 }
      - {
          id: pt-b3,
          type: slide.point,
          at: { afterAction: dual-2 },
          target: { x: 0.744, y: 0.809 },
        }
      - { id: pt-tpc, type: slide.point, at: { mark: pt-tpc }, target: { x: 0.272, y: 0.92 } }

  - id: outbox
    chapter: Outbox pattern
    narration: >-
      [[mark:show-outbox]] လက်တွေ့မှာ သုံးတဲ့ အဖြေ တစ်ခုက outbox pattern ပါ။ posting ကို ရေးတဲ့
      transaction ထဲမှာပဲ နောက်ထပ် row တစ်ခု ထည့်ရေးပါတယ်။ [[mark:outbox-2]] အဲဒါက outbox table ထဲက
      row ပါ၊ event ကို publish မလုပ်သေးဘဲ publish လုပ်မယ့် intent ကို သိမ်းထားတာပါ။ commit ဖြစ်ရင်
      နှစ်ခုလုံး ရှိပြီး၊ rollback ဖြစ်ရင် နှစ်ခုလုံး မရှိပါဘူး။ [[mark:outbox-3]] ပြီးရင် relay ဆိုတဲ့ သီးခြား
      process က sent မဖြစ်သေးတဲ့ row တွေကို ယူပြီး broker ကို publish လုပ်ပါတယ်။ အောင်မြင်ရင် sent
      လို့ မှတ်ပြီး၊ fail ရင် နောက်တစ်ခါ ထပ်ကြိုးစားပါတယ်၊ အောင်မြင်တဲ့အထိပါ။ [[mark:outbox-4]] ဒီမှာ
      ကျန်နေတဲ့ ပြဿနာ တစ်ခု ရှိပါတယ်။ relay က publish လုပ်ပြီးမှ sent လို့ မမှတ်ရခင် crash ဖြစ်ရင်၊
      ပြန်စတဲ့အခါ အဲဒီ row ကို ထပ် publish လုပ်ပါတယ်။ ဒါကြောင့် delivery က at-least-once ပဲ ဖြစ်ပြီး၊
      consumer က event id နဲ့ dedupe လုပ်ရပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Notifying reliably (Outbox and CDC) (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#notifying-reliably-outbox-and-cdc",
        }
    actions:
      - {
          id: show-outbox,
          type: slide.show,
          at: { mark: show-outbox, offsetMs: -700 },
          slideId: outbox-1,
        }
      - {
          id: pt-txb,
          type: slide.point,
          at: { afterAction: show-outbox },
          target: { x: 0.069, y: 0.292 },
        }
      - { id: outbox-2, type: slide.show, at: { mark: outbox-2 }, slideId: outbox-2 }
      - {
          id: pt-row,
          type: slide.point,
          at: { afterAction: outbox-2 },
          target: { x: 0.238, y: 0.72 },
        }
      - { id: outbox-3, type: slide.show, at: { mark: outbox-3 }, slideId: outbox-3 }
      - {
          id: pt-relay,
          type: slide.point,
          at: { afterAction: outbox-3 },
          target: { x: 0.588, y: 0.72 },
        }
      - { id: outbox-4, type: slide.show, at: { mark: outbox-4 }, slideId: outbox-4 }
      - {
          id: pt-crash,
          type: slide.point,
          at: { afterAction: outbox-4 },
          target: { x: 0.369, y: 0.898 },
        }

  - id: relay
    chapter: Relay နဲ့ dedupe
    narration: >-
      [[mark:close-outbox]] code နဲ့ စမ်းကြည့်ရအောင်။ [[mark:sel-relay]] relay က sent မဖြစ်သေးတဲ့ row
      တွေကို အစဉ်အတိုင်း publish လုပ်ပြီး တစ်ခုချင်း sent လို့ မှတ်ပါတယ်။ publish fail ရင် ရပ်ပြီး နောက်တစ်ကြိမ်
      run မှ ဆက်လုပ်တာမို့ event တွေက outbox ထဲ ရေးထားတဲ့ အစဉ်အတိုင်း ထွက်ပါတယ်။ နောက်ဆုံး parameter က event
      တစ်ခုကို publish လုပ်ပြီးတာနဲ့ မမှတ်ရခင် process သေသွားတာကို ပုံဖော်ပါတယ်။ [[mark:type-outbox]] ဒီ
      function က posting နဲ့ outbox row ကို transaction တစ်ခုတည်းမှာ ရေးပါတယ်။ publish လုပ်တဲ့ code
      ဒီမှာ မပါတော့ပါဘူး။ [[mark:type-main]] main မှာ posting နှစ်ခုကို outbox နဲ့ ရေးပြီး relay ကို နှစ်ကြိမ်
      run ပါမယ်။ ပထမ run က ပထမ event ကို publish လုပ်ပြီးတာနဲ့ crash ဖြစ်ပါတယ်။ ဒုတိယ run က process
      ပြန်တက်လာပြီးနောက် run တာပါ။ [[mark:run-2]] run လိုက်ရအောင်။ [[mark:pt-out]] database မှာ posting
      နှစ်ခုလုံး ရှိပြီး consumer ဆီလည်း နှစ်ခုလုံး ရောက်ပါတယ်၊ ဘာမှ မပျောက်ပါဘူး။ ဒါပေမဲ့ consumer
      က message သုံးခု ရပြီး ပထမ posting ကို နှစ်ခါ apply လုပ်ထားပါတယ်။ [[mark:dock-2]] user ကို notification နှစ်ခါ
      ပို့တာ၊ credit နှစ်ခါ လုပ်တာမျိုး ဖြစ်နိုင်ပါတယ်။ [[mark:open-cons]] consumer ကို ပြင်ရအောင်။
      [[mark:type-dedupe]] event id ကို မြင်ဖူးရင် ကျော်ပြီး၊ မမြင်ဖူးရင် မှတ်ပြီးမှ apply လုပ်ပါမယ်။ ဒါ
      အလုပ်လုပ်ဖို့ event id က stable ဖြစ်ရပါမယ်၊ posting တစ်ခုကို ဘယ်နှခါ publish လုပ်လုပ် id တူရပါမယ်။
      [[mark:run-3]] run လိုက်ရအောင်။ [[mark:pt-dedupe]] message သုံးခု ရပေမဲ့ posting တစ်ခုကို
      တစ်ခါပဲ apply လုပ်ပါတယ်။ publish က နှစ်ခါ ဖြစ်ပေမဲ့ effect က တစ်ခါပဲ ဖြစ်ပါတယ်။ တကယ့် consumer မှာတော့ event id ကို မှတ်တာနဲ့ effect ကို transaction တစ်ခုတည်းမှာ commit လုပ်ရပါမယ်၊ မဟုတ်ရင် ကြားမှာ crash ဖြစ်တဲ့အခါ event တစ်ခု ပျောက်သွားနိုင်ပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Notifying reliably (Outbox and CDC) (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#notifying-reliably-outbox-and-cdc",
        }
      - {
          title: "Fintech Engineering Handbook — Idempotency (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#idempotency",
        }
    actions:
      - { id: close-outbox, type: slide.close, at: { mark: close-outbox } }
      - id: sel-relay
        type: editor.select
        at: { mark: sel-relay }
        target:
          {
            file: main.go,
            text: "func (db *DB) relay(b *Broker, crashAfter string) {",
            occurrence: 1,
          }
      - id: type-outbox
        type: editor.type
        at: { mark: type-outbox }
        target: { file: main.go, after: "\t\tr.Sent = true\n\t}\n}\n", occurrence: 1 }
        text: "\nfunc withOutbox(db *DB, id string) {\n\ttx := db.Begin()\n\ttx.Post(id)\n\ttx.Outbox(event(id))\n\ttx.Commit()\n}\n"
        cadence: line-by-line
      - id: type-main
        type: editor.type
        at: { mark: type-main }
        target:
          { file: main.go, after: "\tfmt.Println(\"dual write:\", db, \"|\", c)\n", occurrence: 1 }
        text: "\n\tdb, c, b = setup()\n\twithOutbox(db, \"p3\")\n\twithOutbox(db, \"p4\")\n\tdb.relay(b, \"evt-p3\")\n\tdb.relay(b, \"\")\n\tfmt.Println(\"outbox:    \", db, \"|\", c)\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "applied [p3 p3 p4]",
          timeoutMs: 8000,
        }
      - id: pt-out
        type: console.point
        at: { mark: pt-out }
        target: { text: "outbox:     db [p3 p4]", occurrence: 1 }
      - { id: dock-2, type: runtime.collapseDock, at: { mark: dock-2 } }
      - { id: open-cons, type: workspace.openFile, at: { mark: open-cons }, path: consumer.go }
      - id: type-dedupe
        type: editor.type
        at: { mark: type-dedupe }
        target: { file: consumer.go, after: "\tc.got++\n", occurrence: 1 }
        text: "\tif c.seen[e.ID] {\n\t\treturn\n\t}\n\tc.seen[e.ID] = true\n"
        cadence: line-by-line
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "consumer got 3, applied [p3 p4]",
          timeoutMs: 8000,
        }
      - id: pt-dedupe
        type: console.point
        at: { mark: pt-dedupe }
        target: { text: "consumer got 3, applied [p3 p4]", occurrence: 1 }
      - {
          id: expect-file-dedupe,
          type: expect.file,
          at: { afterAction: run-3 },
          path: consumer.go,
          contains: "c.seen[e.ID] = true",
        }

  - id: cdc
    chapter: "CDC: database log ကို ဖတ်"
    narration: >-
      [[mark:show-cdc]] ဒုတိယ နည်းက change data capture ပါ၊ CDC လို့ ခေါ်ပါတယ်။ database က commit
      တိုင်းကို write-ahead log ဒါမှမဟုတ် replication log ထဲ ရေးပြီးသားမို့ အဲဒီ log ကို tail လုပ်ပြီး event
      stream အဖြစ် ပြောင်းတာပါ။ [[mark:pt-conn]] Debezium က CDC အတွက် open source platform တစ်ခုပါ။ သူ့ရဲ့
      PostgreSQL connector က logical decoding ကနေ၊ MySQL connector က binlog ကနေ commit ဖြစ်ပြီးသား
      ပြောင်းလဲမှုတွေကို ဖတ်ပြီး row တစ်ခုချင်းအတွက် change event ထုတ်ပေးပါတယ်။ AWS DMS လို service
      တွေလည်း ရှိပါတယ်။ [[mark:cdc-2]] log ကနေ တိုက်ရိုက် ဖတ်တာမို့ commit ဖြစ်တဲ့ ပြောင်းလဲမှု တစ်ခုမှ
      မလွတ်ပါဘူး၊ application ထဲမှာ publish လုပ်တဲ့ code လည်း မလိုပါဘူး။ [[mark:cdc-3]] ပေးရတဲ့ အဖိုးကတော့
      coupling နဲ့ operation ပိုင်း ဝန်ပါ။ raw CDC event က ကိုယ့် table ရဲ့ row ပုံစံ အတိုင်း ထွက်လာလို့
      column တစ်ခု နာမည် ပြောင်းတာနဲ့ consumer တွေ ပျက်နိုင်ပါတယ်။ ဒါကြောင့် internal schema ကို အပြင်
      မပေါက်အောင် ပြန်ပြင်ပြီးမှ ထုတ်ရပါတယ်။ [[mark:pt-router]] Debezium မှာ outbox pattern အတွက် Outbox
      Event Router ဆိုတဲ့ transformation တောင် ပါပါတယ်။ ဆိုလိုတာက outbox table ကို CDC နဲ့ ဖတ်ရင် relay
      ကိုယ်တိုင် မရေးဘဲ၊ public event ပုံစံကိုလည်း ကိုယ်တိုင် ထိန်းနိုင်ပါတယ်။
    sources:
