  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] Fintech interview တွေမှာ database update နဲ့ Kafka publish ကို ဘယ်လို စိတ်ချရအောင်
      လုပ်မလဲ လို့ မေးလေ့ရှိပါတယ်။ commit ပြီးမှ publish လုပ်မယ် လို့ပဲ ဖြေရင် မလုံလောက်ပါဘူး။ အချက်
      သုံးချက်နဲ့ ဖြေပါ။ [[mark:iv-a]] ပထမ၊ dual write ဘာကြောင့် မရလဲ ဆိုတာပါ။ publish ပြီးမှ rollback
      ဖြစ်ရင် phantom event၊ commit ပြီးမှ publish fail ရင် missing event ဖြစ်ပါတယ်။ [[mark:iv-b]] ဒုတိယ၊
      outbox ပါ။ state နဲ့ event ကို transaction တစ်ခုတည်းမှာ ရေးပြီး၊ relay က sent မဖြစ်သေးတဲ့ row တွေကို
      retry လုပ်ပြီး publish လုပ်ပါတယ်။ [[mark:iv-c]] တတိယ၊ at-least-once ပါ။ relay က publish ပြီး mark
      မလုပ်ခင် crash ဖြစ်နိုင်လို့ consumer က stable event id နဲ့ dedupe လုပ်ရပါတယ်။ [[mark:iv-d]] ပြီးရင်
      ကိုယ် ဘာရွေးမလဲ ဆက်ပြောပါ။ outbox နဲ့ relay နဲ့ dedupe ကို ရွေးမယ်၊ ဒါမှမဟုတ် CDC ကို သုံးမယ်ဆိုရင်
      row event ကို public event အဖြစ် ပြောင်းပြီးမှ ထုတ်မယ် ဆိုတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Notifying reliably (Outbox and CDC) (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#notifying-reliably-outbox-and-cdc",
        }
