  - id: typeswitch
    narration: >
      [[mark:type-kind]] Any holds a value of any type. [[mark:type-use-kind]] To
      get at it you ask what it is. [[mark:select-typeswitch]] A type switch tests
      the concrete type and binds it, so each case has a real typed value to work
      with.
    sources:
      - { title: "A Tour of Go — Type switches", url: "https://go.dev/tour/methods/16" }
    actions:
      - id: type-kind
        type: editor.type
        at: { mark: type-kind, offsetMs: -400 }
        target:
          { file: main.go, after: "\ntype shape interface {\n\tarea() int\n}\n", occurrence: 1 }
        cadence: block
        text: "\nfunc kind(v any) string {\n\tswitch t := v.(type) {\n\tcase int:\n\t\treturn fmt.Sprint(\"int \", t)\n\tcase string:\n\t\treturn \"string \" + t\n\tdefault:\n\t\treturn \"other\"\n\t}\n}\n"
      - id: type-use-kind
        type: editor.type
