            after: "\treturn fmt.Sprintf(\"point %d,%d\", p.x, p.y)\n}\n",
            occurrence: 1,
          }
        cadence: block
        text: "\ntype base struct {\n\tid int\n}\n\nfunc (b base) who() string {\n\treturn fmt.Sprint(\"base \", b.id)\n}\n\ntype wrapper struct {\n\tbase\n\tname string\n}\n"
      - id: type-use-base
        type: editor.type
        at: { mark: type-use-base }
        target: { file: main.go, after: "\tfmt.Println(p.label())\n", occurrence: 1 }
        cadence: block
