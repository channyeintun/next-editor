      x: 322
      y: 242
      width: 260
      height: 30
      text: "package main"
      strokeColor: "#1e1e1e"
      fontSize: 24
    - id: anat-arrow-1
      kind: freedraw
      stroke: arrow-down
      x: 436
      y: 294
      width: 44
      height: 36
      strokeColor: "#1e1e1e"
    - id: anat-imp-box
