build:
  voiceProfile: pocket-alba-v1
  seed: 17

runtime:
  kind: go-playground
  defaultMode: fixture
  fixture:
    latencyMs: 600
    result:
      status: success
      exitCode: 0
      output: "Go, in one file\ngo.dev Go 3 1.5\ntotal 6\n0=90 1=80 2=70 len 3 cap 4\nada is 36\ncount is three\npoint 6,8\narea 48\n(deferred runs last)\ndescribed\nhalve 7: odd number true\n9 2.5\nsum 14\n"

scenes:
  - id: shape
    narration: >
      [[mark:draw-pkg]] Every Go file starts with a package clause.
      [[mark:draw-imp]] Then the imports it needs. [[mark:draw-funcs]] Then the
      functions. [[mark:circle-main]] And func main, in package main, is where
      the program starts. [[mark:to-code]] Let's build a whole program from
      there.
    sources:
      - title: "A Tour of Go — Packages"
        url: "https://go.dev/tour/basics/1"
      - title: "The Go Programming Language Specification — Program execution"
        url: "https://go.dev/ref/spec#Program_execution"
    actions:
      # Both land in the two quiet seconds the studio reserves before the first
      # dialog, so the panel is open and titled when the voice starts. The
      # title's draw budget is busy time, so it finishes clear of that dialog
      # rather than pushing the opening handle past two seconds.
      - id: open-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -1700 }
        open: true
      - id: draw-title
        type: whiteboard.apply
        at: { scene: start, offsetMs: -1200 }
        upsertIds: [anat-title]
        drawMs: 700
      - id: draw-pkg
        type: whiteboard.apply
        at: { mark: draw-pkg }
        upsertIds: [anat-pkg-box, anat-pkg-text]
        drawMs: 800
      - id: draw-imp
        type: whiteboard.apply
        at: { mark: draw-imp }
        upsertIds: [anat-arrow-1, anat-imp-box, anat-imp-text]
        drawMs: 1000
      - id: draw-funcs
        type: whiteboard.apply
        at: { mark: draw-funcs }
        upsertIds: [anat-arrow-2, anat-main-box, anat-main-text]
        drawMs: 1000
      - id: circle-main
        type: whiteboard.apply
        at: { mark: circle-main }
        upsertIds: [anat-entry-circle]
        drawMs: 900
      - id: close-board
        type: whiteboard.apply
        at: { mark: to-code }
        open: false

  - id: values
    narration: >
      [[mark:open-main]] Here's the starting point. [[mark:type-values]] Values
      first. [[mark:select-short-decl]] Colon equals declares and assigns, and
      Go takes the type from the value. Const is fixed at compile time. Var lets
      you name the type yourself, or leave it to Go.
    sources:
      - title: "A Tour of Go — Short variable declarations"
        url: "https://go.dev/tour/basics/10"
      - title: "The Go Programming Language Specification — Constant declarations"
        url: "https://go.dev/ref/spec#Constant_declarations"
    actions:
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: main.go
      - id: type-values
        type: editor.type
        at: { mark: type-values, offsetMs: -400 }
        target:
          file: main.go
          after: "\tfmt.Println(\"Go, in one file\")\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n\tconst site = \"go.dev\"\n\tname, count := \"Go\", 3\n\tvar ratio = 1.5\n\tfmt.Println(site, name, count, ratio)\n"
      - id: select-short-decl
        type: editor.select
        at: { mark: select-short-decl }
        target:
          file: main.go
          text: 'name, count := "Go", 3'
          occurrence: 1

  - id: loops
    narration: >
      [[mark:type-for]] Go has one loop keyword. [[mark:select-for]] For covers
      counting loops, while loops, and loops that never stop. There's no while
      and no do.
    sources:
      - title: "A Tour of Go — For"
        url: "https://go.dev/tour/flowcontrol/1"
    actions:
      - id: type-for
        type: editor.type
        at: { mark: type-for, offsetMs: -400 }
        target:
          file: main.go
          after: "\tfmt.Println(site, name, count, ratio)\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n\ttotal := 0\n\tfor i := 1; i <= count; i++ {\n\t\ttotal += i\n\t}\n\tfmt.Println(\"total\", total)\n"
      - id: select-for
        type: editor.select
        at: { mark: select-for }
        target:
          file: main.go
          text: "for i := 1; i <= count; i++ {"
          occurrence: 1

  - id: slices
    narration: >
      [[mark:type-slices]] Slices are Go's growable lists, and append adds to
      one. [[mark:draw-slice]] A slice is a window onto an array.
      [[mark:draw-len]] Length is how many values it holds.
      [[mark:draw-cap]] Capacity is the room in that array, before Go has to
      allocate a bigger one. [[mark:close-slice]] And range walks it,
      [[mark:select-range]] handing you the index and the value each time.
    sources:
      - title: "The Go Blog — Go Slices: usage and internals"
        url: "https://go.dev/blog/slices-intro"
    actions:
      - id: type-slices
        type: editor.type
        at: { mark: type-slices, offsetMs: -400 }
        target:
          file: main.go
          after: "\tfmt.Println(\"total\", total)\n"
          occurrence: 1
        cadence: block
        text: "\n\tscores := []int{90, 80}\n\tscores = append(scores, 70)\n\tfor i, s := range scores {\n\t\tfmt.Print(i, \"=\", s, \" \")\n\t}\n\tfmt.Println(\"len\", len(scores), \"cap\", cap(scores))\n"
      - id: open-slice-board
        type: whiteboard.apply
        at: { mark: draw-slice, offsetMs: -700 }
        open: true
      # The anatomy sketch is wiped — this diagram reuses its canvas.
      - id: draw-slice
        type: whiteboard.apply
        at: { mark: draw-slice }
        clear: true
        upsertIds: [sl-title, sl-box-0, sl-val-0, sl-box-1, sl-val-1, sl-box-2, sl-val-2, sl-box-3]
        drawMs: 2400
      - id: draw-len
        type: whiteboard.apply
        at: { mark: draw-len }
        upsertIds: [sl-len-underline, sl-len-label]
        drawMs: 900
      - id: draw-cap
        type: whiteboard.apply
        at: { mark: draw-cap }
        upsertIds: [sl-cap-arrow, sl-cap-label]
        drawMs: 1000
      - id: close-slice-board
        type: whiteboard.apply
        at: { mark: close-slice }
        open: false
      - id: select-range
        type: editor.select
        at: { mark: select-range }
        target:
          file: main.go
          text: "for i, s := range scores {"
          occurrence: 1

  - id: maps
    narration: >
      [[mark:type-maps]] Maps hold keys and values. [[mark:select-comma-ok]] A
      lookup gives back two things: the value, and whether the key was there.
      That second value is how you tell a missing key from a zero.
    sources:
      - title: "The Go Blog — Go maps in action"
        url: "https://go.dev/blog/maps"
    actions:
      - id: type-maps
        type: editor.type
        at: { mark: type-maps, offsetMs: -400 }
        target:
          file: main.go
          after: "\tfmt.Println(\"len\", len(scores), \"cap\", cap(scores))\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n\tages := map[string]int{\"ada\": 36}\n\tif age, found := ages[\"ada\"]; found {\n\t\tfmt.Println(\"ada is\", age)\n\t}\n"
      - id: select-comma-ok
        type: editor.select
        at: { mark: select-comma-ok }
        target:
          file: main.go
          text: 'if age, found := ages["ada"]; found {'
          occurrence: 1

  - id: branch
    narration: >
      [[mark:type-switch]] Switch needs no break. [[mark:select-switch]] Each
      case stops on its own, and the value can be any type, not only a number.
    sources:
      - title: "A Tour of Go — Switch"
        url: "https://go.dev/tour/flowcontrol/9"
    actions:
      - id: type-switch
        type: editor.type
        at: { mark: type-switch, offsetMs: -400 }
        target:
          file: main.go
          after: "\t\tfmt.Println(\"ada is\", age)\n\t}\n"
          occurrence: 1
        cadence: block
        text: "\n\tswitch count {\n\tcase 3:\n\t\tfmt.Println(\"count is three\")\n\tdefault:\n\t\tfmt.Println(\"count is other\")\n\t}\n"
      - id: select-switch
        type: editor.select
        at: { mark: select-switch }
        target:
          file: main.go
          text: "switch count {"
          occurrence: 1

  - id: structs
    narration: >
      [[mark:type-point]] Structs group fields under a name, and methods attach
      to the type. [[mark:type-use-point]] So we build a point and scale it.
      [[mark:select-pointer]] That star makes the receiver a pointer, so scale
      changes the real point instead of a copy.
    sources:
      - title: "A Tour of Go — Structs"
        url: "https://go.dev/tour/moretypes/2"
      - title: "A Tour of Go — Pointer receivers"
        url: "https://go.dev/tour/methods/4"
    actions:
      - id: type-point
        type: editor.type
        at: { mark: type-point, offsetMs: -400 }
        target:
          file: main.go
          after: "\t\tfmt.Println(\"count is other\")\n\t}\n}\n"
          occurrence: 1
        cadence: block
        text: "\ntype point struct {\n\tx int\n\ty int\n}\n\nfunc (p *point) scale(by int) {\n\tp.x *= by\n\tp.y *= by\n}\n\nfunc (p point) label() string {\n\treturn fmt.Sprintf(\"point %d,%d\", p.x, p.y)\n}\n"
      - id: type-use-point
        type: editor.type
        at: { mark: type-use-point }
        target:
          file: main.go
          after: "\t\tfmt.Println(\"count is other\")\n\t}\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n\tp := point{x: 3, y: 4}\n\tp.scale(2)\n\tfmt.Println(p.label())\n"
      - id: select-pointer
        type: editor.select
        at: { mark: select-pointer }
        target:
          file: main.go
          text: "func (p *point) scale(by int) {"
          occurrence: 1

  - id: interfaces
    narration: >
      [[mark:type-shape]] Interfaces name behaviour, not data.
      [[mark:type-use-shape]] Point already has an area method, so it fits
      shape. [[mark:draw-iface]] Nothing had to say so. [[mark:draw-iface-note]]
      Go compares the methods, and the type either fits or it doesn't.
      [[mark:close-iface]] There's no implements keyword to write.
    sources:
      - title: "A Tour of Go — Interfaces are implemented implicitly"
        url: "https://go.dev/tour/methods/10"
    actions:
      - id: type-shape
        type: editor.type
        at: { mark: type-shape, offsetMs: -400 }
        target:
          file: main.go
          after: "\treturn fmt.Sprintf(\"point %d,%d\", p.x, p.y)\n}\n"
          occurrence: 1
        cadence: block
        text: "\nfunc (p point) area() int {\n\treturn p.x * p.y\n}\n\ntype shape interface {\n\tarea() int\n}\n"
      - id: type-use-shape
        type: editor.type
        at: { mark: type-use-shape }
        target:
          file: main.go
          after: "\tfmt.Println(p.label())\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n\tvar s shape = p\n\tfmt.Println(\"area\", s.area())\n"
      - id: open-iface-board
        type: whiteboard.apply
        at: { mark: draw-iface, offsetMs: -700 }
        open: true
      - id: draw-iface
        type: whiteboard.apply
        at: { mark: draw-iface }
        clear: true
        upsertIds:
          [
            if-title,
            if-point-box,
            if-point-text,
            if-point-method,
            if-arrow,
            if-shape-box,
            if-shape-text,
            if-shape-method,
          ]
        drawMs: 2400
      - id: draw-iface-note
        type: whiteboard.apply
        at: { mark: draw-iface-note }
        upsertIds: [if-note, if-note-underline]
        drawMs: 900
      - id: close-iface-board
        type: whiteboard.apply
        at: { mark: close-iface }
        open: false

  - id: defer
    narration: >
      [[mark:type-defer]] Defer schedules work for when the function returns.
      [[mark:type-use-defer]] Here we call describe and print what comes back.
      [[mark:select-defer]] The deferred line runs last, even if the function
      panics on the way out. That's how Go closes files and unlocks things.
    sources:
      - title: "The Go Blog — Defer, Panic, and Recover"
        url: "https://go.dev/blog/defer-panic-and-recover"
    actions:
      - id: type-defer
        type: editor.type
        at: { mark: type-defer, offsetMs: -400 }
        target:
          file: main.go
          after: "\ntype shape interface {\n\tarea() int\n}\n"
          occurrence: 1
        cadence: block
        text: "\nfunc describe() string {\n\tdefer fmt.Println(\"(deferred runs last)\")\n\treturn \"described\"\n}\n"
      - id: type-use-defer
        type: editor.type
        at: { mark: type-use-defer }
        target:
          file: main.go
          after: "\tfmt.Println(\"area\", s.area())\n"
          occurrence: 1
        cadence: block
        text: "\n\tfmt.Println(describe())\n"
      - id: select-defer
        type: editor.select
        at: { mark: select-defer }
        target:
          file: main.go
          text: 'defer fmt.Println("(deferred runs last)")'
          occurrence: 1

  - id: errors
    narration: >
      [[mark:type-import-errors]] Go hands errors back as ordinary values.
      [[mark:type-errors]] So a function that can fail returns one.
      [[mark:type-use-errors]] And you check it right where it happens.
      [[mark:select-wrap]] Percent w wraps one error inside another, so code
      further up can still recognise the original.
    sources:
      - title: "The Go Blog — Working with Errors in Go 1.13"
        url: "https://go.dev/blog/go1.13-errors"
      - title: "Effective Go — Errors"
        url: "https://go.dev/doc/effective_go#errors"
    actions:
      - id: type-import-errors
        type: editor.type
        at: { mark: type-import-errors, offsetMs: -400 }
        target:
          file: main.go
          after: "import (\n"
          occurrence: 1
        text: "\t\"errors\"\n"
      - id: type-errors
        type: editor.type
        at: { mark: type-errors }
        target:
          file: main.go
          after: "\treturn \"described\"\n}\n"
          occurrence: 1
        cadence: block
        text: "\nvar errOdd = errors.New(\"odd number\")\n\nfunc halve(n int) (int, error) {\n\tif n%2 != 0 {\n\t\treturn 0, fmt.Errorf(\"halve %d: %w\", n, errOdd)\n\t}\n\treturn n / 2, nil\n}\n"
      - id: type-use-errors
        type: editor.type
        at: { mark: type-use-errors }
        target:
          file: main.go
          after: "\tfmt.Println(describe())\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n\tif _, err := halve(7); err != nil {\n\t\tfmt.Println(err, errors.Is(err, errOdd))\n\t}\n"
      - id: select-wrap
        type: editor.select
        at: { mark: select-wrap }
        target:
          file: main.go
          text: 'fmt.Errorf("halve %d: %w", n, errOdd)'
          occurrence: 1

  - id: generics
    narration: >
      [[mark:type-generic]] Go got generics in version one point eighteen.
      [[mark:type-use-generic]] We call largest twice, on two different slice
      types. [[mark:select-generic]] That's the type parameter. Largest works on
      ints or floats, from one body, with nothing to convert.
    sources:
      - title: "Go — Tutorial: Getting started with generics"
        url: "https://go.dev/doc/tutorial/generics"
    actions:
      - id: type-generic
        type: editor.type
        at: { mark: type-generic, offsetMs: -400 }
        target:
          file: main.go
          after: "\treturn n / 2, nil\n}\n"
          occurrence: 1
        cadence: block
        text: "\nfunc largest[T int | float64](values []T) T {\n\tbest := values[0]\n\tfor _, v := range values[1:] {\n\t\tif v > best {\n\t\t\tbest = v\n\t\t}\n\t}\n\treturn best\n}\n"
      - id: type-use-generic
        type: editor.type
        at: { mark: type-use-generic }
        target:
          file: main.go
          after: "\t\tfmt.Println(err, errors.Is(err, errOdd))\n\t}\n"
          occurrence: 1
        cadence: block
        text: "\n\tfmt.Println(largest([]int{3, 9, 4}), largest([]float64{2.5, 1.5}))\n"
      - id: select-generic
        type: editor.select
        at: { mark: select-generic }
        target:
          file: main.go
          text: "[T int | float64]"
          occurrence: 1

  - id: concurrency
    narration: >
      [[mark:type-import-sync]] Now the part Go is known for.
      [[mark:type-collect]] Go, in front of a call, starts a goroutine — a
      thread so cheap you can start thousands. [[mark:draw-go]] Three of them
      run here. [[mark:draw-chan]] A channel carries values between them
      safely. [[mark:draw-note]] The wait group tells us when the senders have
      finished, so the channel can close. [[mark:close-go]] Ranging over a
      channel reads until that happens.
    sources:
      - title: "A Tour of Go — Goroutines"
        url: "https://go.dev/tour/concurrency/1"
      - title: "Effective Go — Concurrency"
        url: "https://go.dev/doc/effective_go#concurrency"
    actions:
      - id: type-import-sync
        type: editor.type
        at: { mark: type-import-sync, offsetMs: -400 }
        target:
          file: main.go
          after: "\t\"fmt\"\n"
          occurrence: 1
        text: "\t\"sync\"\n"
      - id: type-collect
        type: editor.type
        at: { mark: type-collect }
        target:
          file: main.go
          after: "\treturn best\n}\n"
          occurrence: 1
        cadence: block
        text: "\nfunc collect() int {\n\tresults := make(chan int)\n\tvar wg sync.WaitGroup\n\tfor i := 1; i <= 3; i++ {\n\t\twg.Add(1)\n\t\tgo func(n int) {\n\t\t\tdefer wg.Done()\n\t\t\tresults <- n * n\n\t\t}(i)\n\t}\n\tgo func() {\n\t\twg.Wait()\n\t\tclose(results)\n\t}()\n\tsum := 0\n\tfor v := range results {\n\t\tsum += v\n\t}\n\treturn sum\n}\n"
      - id: type-use-collect
        type: editor.type
        at: { mark: type-collect, offsetMs: 1200 }
        target:
          file: main.go
          after: "\tfmt.Println(largest([]int{3, 9, 4}), largest([]float64{2.5, 1.5}))\n"
          occurrence: 1
        cadence: block
        text: "\n\tfmt.Println(\"sum\", collect())\n"
      - id: open-go-board
        type: whiteboard.apply
        at: { mark: draw-go, offsetMs: -700 }
        open: true
      - id: draw-go
        type: whiteboard.apply
        at: { mark: draw-go }
        clear: true
        upsertIds: [go-title, go-box-1, go-text-1, go-box-2, go-text-2, go-box-3, go-text-3]
        drawMs: 2100
      - id: draw-chan
        type: whiteboard.apply
        at: { mark: draw-chan }
        upsertIds: [go-arrow-in, go-chan-box, go-chan-text, go-arrow-out, go-sum-text]
        drawMs: 1500
      - id: draw-note
        type: whiteboard.apply
        at: { mark: draw-note }
        upsertIds: [go-note, go-note-underline]
        drawMs: 900
      - id: close-go-board
        type: whiteboard.apply
        at: { mark: close-go }
        open: false

  - id: run
    narration: >
      [[mark:run]] Let's run the whole file. The values and the loop total. The
      slice, with its length and capacity. The map, and the switch. The scaled
      point, and its area through the interface. The deferred line arriving
      first. The wrapped error. Generics on two types. And fourteen, summed from
      three goroutines.
    sources:
      - title: "Go Playground"
        url: "https://go.dev/play/"
    actions:
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 15000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "sum 14"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.go
        contains: "func largest[T int | float64](values []T) T"

  - id: wrap
    narration: >
      That's a tour of Go in one file. A small language, with few keywords, and
      types you can see rather than guess. All of it comes from the standard
      library and the language itself.
    sources:
      - title: "Effective Go"
        url: "https://go.dev/doc/effective_go"
    actions: []

