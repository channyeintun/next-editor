build:
  voiceProfile: pocket-alba-v1
  seed: 13

runtime:
  kind: go-playground
  defaultMode: fixture
  fixture:
    latencyMs: 600
    result:
      status: success
      exitCode: 0
      output: "Go, in one file\nGo 3\n[90 80 70] 3 4\n36 true\npoint 3,4\n0 7 is odd\n"

scenes:
  - id: shape
    narration: >
      [[mark:draw-pkg]] Every Go file opens with a package clause.
      [[mark:draw-imp]] Under that, the imports it needs. [[mark:draw-funcs]]
      And then the functions. That's the whole shape. [[mark:circle-main]] In
      package main, func main is where the program starts. [[mark:to-code]]
      Let's build one up, piece by piece.
    sources:
      - title: "A Tour of Go — Packages"
        url: "https://go.dev/tour/basics/1"
      - title: "The Go Programming Language Specification — Program execution"
        url: "https://go.dev/ref/spec#Program_execution"
    actions:
      # Both of these land in the two quiet seconds the studio reserves before
      # the first dialog, so the panel is open and titled when the voice starts
      # instead of animating over the opening words. The title's draw budget is
      # busy time, so it finishes clear of the first dialog rather than pushing
      # the opening handle past two seconds.
      - id: open-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -1700 }
        open: true
      - id: draw-title
        type: whiteboard.apply
        at: { scene: start, offsetMs: -1200 }
        upsertIds: [anat-title]
        drawMs: 700
      - id: draw-pkg
        type: whiteboard.apply
        at: { mark: draw-pkg }
        upsertIds: [anat-pkg-box, anat-pkg-text]
        drawMs: 800
      - id: draw-imp
        type: whiteboard.apply
        at: { mark: draw-imp }
        upsertIds: [anat-arrow-1, anat-imp-box, anat-imp-text]
        drawMs: 1000
      - id: draw-funcs
        type: whiteboard.apply
        at: { mark: draw-funcs }
        upsertIds: [anat-arrow-2, anat-main-box, anat-main-text]
        drawMs: 1000
      - id: circle-main
        type: whiteboard.apply
        at: { mark: circle-main }
        upsertIds: [anat-entry-circle]
        drawMs: 900
      - id: close-board
        type: whiteboard.apply
        at: { mark: to-code }
        open: false

  - id: read
    narration: >
      [[mark:open-main]] Here's the starting point. [[mark:select-package]]
      Package main makes this a program, not a library.
      [[mark:select-print]] And main prints one line. That already compiles and
      runs.
    sources:
      - title: "The Go Programming Language Specification — Package clause"
        url: "https://go.dev/ref/spec#Package_clause"
    actions:
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: main.go
      - id: select-package
        type: editor.select
        at: { mark: select-package }
        target:
          file: main.go
          text: "package main"
          occurrence: 1
      - id: select-print
        type: editor.select
        at: { mark: select-print }
        target:
          file: main.go
          text: 'fmt.Println("Go, in one file")'
          occurrence: 1

  - id: vars
    narration: >
      [[mark:type-vars]] First, variables. [[mark:select-declare]] Colon equals
      declares and assigns in one step. Go reads the type from the value, so
      name is a string and count is an int.
    sources:
      - title: "A Tour of Go — Short variable declarations"
        url: "https://go.dev/tour/basics/10"
    actions:
      - id: type-vars
        type: editor.type
        at: { mark: type-vars, offsetMs: -400 }
        target:
          file: main.go
          after: "\tfmt.Println(\"Go, in one file\")\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n\tname := \"Go\"\n\tcount := 3\n\tfmt.Println(name, count)\n"
      - id: select-declare
        type: editor.select
        at: { mark: select-declare }
        target:
          file: main.go
          text: 'name := "Go"'
          occurrence: 1

  - id: slices
    narration: >
      [[mark:type-slices]] Next, slices — Go's growable lists.
      [[mark:draw-slice]] A slice points at an array underneath.
      [[mark:draw-len]] Length is how many values you've put in.
      [[mark:draw-cap]] Capacity is how much room that array has. Append filled
      the third slot and left one spare. [[mark:close-slice]] Back to the code.
    sources:
      - title: "The Go Blog — Go Slices: usage and internals"
        url: "https://go.dev/blog/slices-intro"
    actions:
      - id: type-slices
        type: editor.type
        at: { mark: type-slices, offsetMs: -400 }
        target:
          file: main.go
          after: "\tfmt.Println(name, count)\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n\tscores := []int{90, 80}\n\tscores = append(scores, 70)\n\tfmt.Println(scores, len(scores), cap(scores))\n"
      - id: open-slice-board
        type: whiteboard.apply
        at: { mark: draw-slice, offsetMs: -700 }
        open: true
      # The anatomy sketch is wiped here — this diagram reuses its canvas.
      - id: draw-slice
        type: whiteboard.apply
        at: { mark: draw-slice }
        clear: true
        upsertIds: [sl-title, sl-box-0, sl-val-0, sl-box-1, sl-val-1, sl-box-2, sl-val-2, sl-box-3]
        drawMs: 2400
      - id: draw-len
        type: whiteboard.apply
        at: { mark: draw-len }
        upsertIds: [sl-len-underline, sl-len-label]
        drawMs: 900
      - id: draw-cap
        type: whiteboard.apply
        at: { mark: draw-cap }
        upsertIds: [sl-cap-arrow, sl-cap-label]
        drawMs: 1000
      - id: close-slice-board
        type: whiteboard.apply
        at: { mark: close-slice }
        open: false

  - id: maps
    narration: >
      [[mark:type-maps]] Maps hold key and value pairs.
      [[mark:select-comma-ok]] Reading one gives you two things: the value, and
      whether the key was there at all.
    sources:
      - title: "The Go Blog — Go maps in action"
        url: "https://go.dev/blog/maps"
    actions:
      - id: type-maps
        type: editor.type
        at: { mark: type-maps, offsetMs: -400 }
        target:
          file: main.go
          after: "\tfmt.Println(scores, len(scores), cap(scores))\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n\tages := map[string]int{\"ada\": 36}\n\tage, found := ages[\"ada\"]\n\tfmt.Println(age, found)\n"
      - id: select-comma-ok
        type: editor.select
        at: { mark: select-comma-ok }
        target:
          file: main.go
          text: 'age, found := ages["ada"]'
          occurrence: 1

  - id: structs
    narration: >
      [[mark:type-point]] Structs group fields under one name.
      [[mark:type-use-point]] And here we build one and print it.
      [[mark:select-receiver]] That receiver, p point, attaches the method to
      the type. Go has no classes. A method is a function with a receiver.
    sources:
      - title: "A Tour of Go — Structs"
        url: "https://go.dev/tour/moretypes/2"
      - title: "A Tour of Go — Methods"
        url: "https://go.dev/tour/methods/1"
    actions:
      - id: type-point
        type: editor.type
        at: { mark: type-point, offsetMs: -400 }
        target:
          file: main.go
          after: "\tfmt.Println(age, found)\n}\n"
          occurrence: 1
        cadence: line-by-line
        text: "\ntype point struct {\n\tx int\n\ty int\n}\n\nfunc (p point) label() string {\n\treturn fmt.Sprintf(\"point %d,%d\", p.x, p.y)\n}\n"
      - id: type-use-point
        type: editor.type
        at: { mark: type-use-point }
        target:
          file: main.go
          after: "\tfmt.Println(age, found)\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n\tp := point{x: 3, y: 4}\n\tfmt.Println(p.label())\n"
      - id: select-receiver
        type: editor.select
        at: { mark: select-receiver }
        target:
          file: main.go
          text: "(p point)"
          occurrence: 1

  - id: errors
    narration: >
      [[mark:type-halve]] Last piece: what happens when a function can't do its
      job. [[mark:type-use-halve]] We call it, and read back both values.
      [[mark:select-results]] A Go function returns its result and an error
      together. Seven is odd, so halve returns zero and an error.
    sources:
      - title: "Effective Go — Multiple return values"
        url: "https://go.dev/doc/effective_go#multiple-returns"
    actions:
      - id: type-halve
        type: editor.type
        at: { mark: type-halve, offsetMs: -400 }
        target:
          file: main.go
          after: "\treturn fmt.Sprintf(\"point %d,%d\", p.x, p.y)\n}\n"
          occurrence: 1
        cadence: line-by-line
        text: "\nfunc halve(n int) (int, error) {\n\tif n%2 != 0 {\n\t\treturn 0, fmt.Errorf(\"%d is odd\", n)\n\t}\n\treturn n / 2, nil\n}\n"
      - id: type-use-halve
        type: editor.type
        at: { mark: type-use-halve }
        target:
          file: main.go
          after: "\tfmt.Println(p.label())\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n\thalf, err := halve(7)\n\tfmt.Println(half, err)\n"
      - id: select-results
        type: editor.select
        at: { mark: select-results }
        target:
          file: main.go
          text: "(int, error)"
          occurrence: 1

  - id: run
    narration: >
      [[mark:run]] Now let's run all of it. Name and count. The slice, with its
      length and capacity. The map lookup. The struct's label. And the error
      from seven.
    sources:
      - title: "Go Playground"
        url: "https://go.dev/play/"
    actions:
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 15000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "[90 80 70] 3 4"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.go
        contains: "func halve(n int) (int, error)"

  - id: recap
    narration: >
      [[mark:draw-recap]] So that's Go in one file. [[mark:circle-err]] One
      package, types written out, and errors returned to you, not thrown.
      [[mark:draw-note]] Check the error, then use the result.
    sources:
      - title: "How to Write Go Code"
        url: "https://go.dev/doc/code"
    actions:
      # Reopened a beat ahead of the words, for the same reason the first open
      # sits in the lead handle. The slice diagram is wiped for this one.
      - id: open-recap
        type: whiteboard.apply
        at: { mark: draw-recap, offsetMs: -700 }
        open: true
      - id: draw-recap
        type: whiteboard.apply
        at: { mark: draw-recap }
        clear: true
        upsertIds:
          [
            tv-title,
            tv-call-box,
            tv-call-text,
            tv-arrow,
            tv-val-box,
            tv-val-text,
            tv-err-box,
            tv-err-text,
          ]
        drawMs: 2400
      - id: circle-err
        type: whiteboard.apply
        at: { mark: circle-err }
        upsertIds: [tv-err-circle]
        drawMs: 900
      - id: draw-note
        type: whiteboard.apply
        at: { mark: draw-note }
        upsertIds: [tv-note, tv-note-underline]
        drawMs: 800
      # Lands in the trailing quiet handle: the final sentence finishes, the
      # board closes, then the studio's two seconds of silence close the tape.
      - id: close-recap
        type: whiteboard.apply
        at: { mark: draw-note, offsetMs: 2800 }
        open: false

checks:
  - { type: timing.p95Ms, max: 300 }
