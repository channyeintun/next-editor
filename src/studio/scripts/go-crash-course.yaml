# Go crash course — the whole language in one file, built from a bare main.
#
# Covers, in order: package + imports, constants and the two declaration forms,
# `for` as the only loop keyword, slices with append/len/cap, `range`, maps and
# the comma-ok lookup, `switch` without break, structs with pointer and value
# receivers, implicitly satisfied interfaces, `defer`, sentinel errors with %w
# wrapping, generics with a type constraint, and goroutines feeding a channel
# under a WaitGroup. Then it runs the lot.
#
# A survey, so it takes the critic's `scope.scenes` note on purpose — fourteen
# scenes is not "one concept", which is the whole point of a crash course.
# `go-error-values.yaml` still owns the deep dive on errors.
#
# Insert-only, including the import block: it is pinned as a parenthesized group
# holding only "fmt", and "errors" and "sync" are inserted into it at the moment
# the lesson needs them (a bare `import "fmt"` could not be grown without a
# replace, which the editor actions do not allow).
#
# Four drawn boards, wiped between topics with `clear: true`: the file's anatomy,
# a slice over its backing array, interface satisfaction, and goroutines feeding a
# channel. Boxes grow from their corner, labels type a character at a time, and
# the freedraw strokes trace point by point. The first open and the last close sit
# inside the studio's quiet recording handles, so the voice never starts or ends
# over a panel animation.
#
# The program's output is verified against the real Go toolchain, not read off the
# page: gofmt and vet clean, and five runs produce identical bytes (collect() sums
# its goroutine results so scheduling cannot reorder the output).
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/go-crash-course.yaml
schemaVersion: 1

