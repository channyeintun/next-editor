# Go crash course: one lesson that tours the language's essentials in a single
# file — the shape of a Go program, short variable declarations, slices with len
# and cap, maps and the two-value lookup, structs with a method receiver, and the
# result-plus-error return — then runs the whole thing.
#
# A survey, not a single concept: it deliberately takes the critic's
# `scope.scenes` note (9 scenes against a suggested 5). `go-error-values.yaml`
# still owns the deep dive on errors; this lesson only passes through it.
#
# Three drawn boards, wiped between topics with `clear: true` (an apply only ever
# adds, and closing the panel keeps the elements, so a new diagram over the same
# coordinates would land on top of the old one). Every board is drawn rather than
# pasted: boxes grow from their corner, labels type a character at a time, and
# the freedraw strokes trace point by point. The first open and the last close sit
# inside the studio's own quiet recording handles, so the voice never starts or
# ends on top of a panel animation.
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/go-crash-course.yaml
schemaVersion: 1

lesson:
  slug: go-crash-course
  title: "Go crash course: a whole program, one piece at a time"
  locale: en-US
  workspace:
    lessonType: go
    name: Go Lesson
    entryFilePath: main.go
    files:
      main.go: |
        package main

        import "fmt"

        func main() {
        	fmt.Println("Go, in one file")
        }
  # Authored dark (#1e1e1e): the whiteboard renders with Excalidraw's dark
  # theme, which inverts element colors, so near-black draws as white. Pale
  # colors would invert to near-black and disappear.
  whiteboardAssets:
    # --- Board one: the shape of a Go file ---------------------------------
    - id: anat-title
