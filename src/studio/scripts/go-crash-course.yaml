  - id: funcs
    narration: >
      [[mark:type-sum]] Functions are values in Go. [[mark:type-use-sum]] Sum
      takes any number of ints, and three dots spreads a slice into it.
      [[mark:select-closure]] Counter returns a function that keeps its own n
      alive. That's a closure.
    sources:
      - {
          title: "Effective Go — Variadic functions",
          url: "https://go.dev/doc/effective_go#functions",
        }
      - { title: "A Tour of Go — Function closures", url: "https://go.dev/tour/moretypes/25" }
    actions:
      - id: type-sum
        type: editor.type
        at: { mark: type-sum, offsetMs: -400 }
        target: { file: main.go, after: "\t\treturn \"other\"\n\t}\n}\n", occurrence: 1 }
        cadence: block
        text: "\nfunc sum(nums ...int) int {\n\tt := 0\n\tfor _, v := range nums {\n\t\tt += v\n\t}\n\treturn t\n}\n\nfunc counter() func() int {\n\tn := 0\n\treturn func() int {\n\t\tn++\n\t\treturn n\n\t}\n}\n"
      - id: type-use-sum
        type: editor.type
        at: { mark: type-use-sum }
        target:
          {
            file: main.go,
            after: "\tfmt.Println(kind(7), kind(\"go\"), kind(1.5))\n",
            occurrence: 1,
          }
        cadence: block
        text: "\n\tfmt.Println(sum(1, 2, 3), sum(scores...))\n\tnext := counter()\n\tnext()\n\tfmt.Println(\"counter\", next())\n"
      - id: select-closure
        type: editor.select
        at: { mark: select-closure }
        target: { file: main.go, text: "func counter() func() int {", occurrence: 1 }

  - id: defer
    narration: >
      [[mark:type-defer]] Defer schedules work for when the function returns.
      [[mark:type-use-defer]] Here we call describe and print what comes back.
      [[mark:select-defer]] The deferred line runs last, even if the function
      panics on the way out. That's how Go closes files and unlocks things.
    sources:
      - {
          title: "The Go Blog — Defer, Panic, and Recover",
          url: "https://go.dev/blog/defer-panic-and-recover",
        }
    actions:
      - id: type-defer
        type: editor.type
        at: { mark: type-defer, offsetMs: -400 }
        target:
          {
            file: main.go,
            after: "\treturn func() int {\n\t\tn++\n\t\treturn n\n\t}\n}\n",
            occurrence: 1,
          }
        cadence: block
        text: "\nfunc describe() string {\n\tdefer fmt.Println(\"(deferred runs last)\")\n\treturn \"described\"\n}\n"
      - id: type-use-defer
        type: editor.type
        at: { mark: type-use-defer }
        target: { file: main.go, after: "\tfmt.Println(\"counter\", next())\n", occurrence: 1 }
        cadence: block
        text: "\n\tfmt.Println(describe())\n"
      - id: select-defer
        type: editor.select
        at: { mark: select-defer }
        target: { file: main.go, text: 'defer fmt.Println("(deferred runs last)")', occurrence: 1 }

  - id: recover
    narration: >
      [[mark:type-safe]] A panic unwinds the stack. [[mark:type-use-safe]] Recover,
      inside a deferred function, stops it and hands you the value.
      [[mark:select-named-return]] And that named result lets the deferred
      function set what gets returned. Save panics for bugs you can't recover
      from.
    sources:
      - {
          title: "The Go Blog — Defer, Panic, and Recover",
          url: "https://go.dev/blog/defer-panic-and-recover",
        }
    actions:
      - id: type-safe
        type: editor.type
        at: { mark: type-safe, offsetMs: -400 }
        target: { file: main.go, after: "\treturn \"described\"\n}\n", occurrence: 1 }
        cadence: block
        text: "\nfunc safe() (msg string) {\n\tdefer func() {\n\t\tif r := recover(); r != nil {\n\t\t\tmsg = fmt.Sprint(\"recovered: \", r)\n\t\t}\n\t}()\n\tpanic(\"boom\")\n}\n"
      - id: type-use-safe
        type: editor.type
        at: { mark: type-use-safe }
        target: { file: main.go, after: "\tfmt.Println(describe())\n", occurrence: 1 }
        cadence: block
        text: "\n\tfmt.Println(safe())\n"
      - id: select-named-return
        type: editor.select
        at: { mark: select-named-return }
        target: { file: main.go, text: "func safe() (msg string) {", occurrence: 1 }

  - id: errors
    narration: >
      [[mark:type-import-errors]] Go hands errors back as ordinary values.
      [[mark:type-errors]] So a function that can fail returns one.
      [[mark:type-use-errors]] And you check it right where it happens.
      [[mark:select-wrap]] Percent w wraps one error inside another, so code
      further up can still recognise the original.
    sources:
      - {
          title: "The Go Blog — Working with Errors in Go 1.13",
          url: "https://go.dev/blog/go1.13-errors",
        }
      - { title: "Effective Go — Errors", url: "https://go.dev/doc/effective_go#errors" }
    actions:
      - id: type-import-errors
        type: editor.type
        at: { mark: type-import-errors, offsetMs: -400 }
        target: { file: main.go, after: "import (\n", occurrence: 1 }
        text: "\t\"errors\"\n"
      - id: type-errors
        type: editor.type
        at: { mark: type-errors }
        target: { file: main.go, after: "\tpanic(\"boom\")\n}\n", occurrence: 1 }
        cadence: block
        text: "\nvar errOdd = errors.New(\"odd number\")\n\nfunc halve(n int) (int, error) {\n\tif n%2 != 0 {\n\t\treturn 0, fmt.Errorf(\"halve %d: %w\", n, errOdd)\n\t}\n\treturn n / 2, nil\n}\n"
      - id: type-use-errors
        type: editor.type
        at: { mark: type-use-errors }
        target: { file: main.go, after: "\tfmt.Println(safe())\n", occurrence: 1 }
        cadence: line-by-line
        text: "\n\tif _, err := halve(7); err != nil {\n\t\tfmt.Println(err, errors.Is(err, errOdd))\n\t}\n"
      - id: select-wrap
        type: editor.select
        at: { mark: select-wrap }
        target: { file: main.go, text: 'fmt.Errorf("halve %d: %w", n, errOdd)', occurrence: 1 }

  - id: generics
    narration: >
      [[mark:type-generic]] Go got generics in version one point eighteen.
      [[mark:type-use-generic]] We call largest twice, on two different slice
      types. [[mark:select-generic]] That's the type parameter. Largest works on
      ints or floats, from one body, with nothing to convert.
    sources:
      - {
          title: "Go — Tutorial: Getting started with generics",
          url: "https://go.dev/doc/tutorial/generics",
        }
    actions:
      - id: type-generic
        type: editor.type
        at: { mark: type-generic, offsetMs: -400 }
        target: { file: main.go, after: "\treturn n / 2, nil\n}\n", occurrence: 1 }
        cadence: block
        text: "\nfunc largest[T int | float64](values []T) T {\n\tbest := values[0]\n\tfor _, v := range values[1:] {\n\t\tif v > best {\n\t\t\tbest = v\n\t\t}\n\t}\n\treturn best\n}\n"
      - id: type-use-generic
        type: editor.type
        at: { mark: type-use-generic }
        target:
          {
            file: main.go,
            after: "\t\tfmt.Println(err, errors.Is(err, errOdd))\n\t}\n",
            occurrence: 1,
          }
        cadence: block
        text: "\n\tfmt.Println(largest([]int{3, 9, 4}), largest([]float64{2.5, 1.5}))\n"
      - id: select-generic
        type: editor.select
        at: { mark: select-generic }
        target: { file: main.go, text: "[T int | float64]", occurrence: 1 }

  - id: concurrency
    narration: >
      [[mark:type-import-sync]] Now the part Go is known for.
      [[mark:type-collect]] Go, in front of a call, starts a goroutine — a thread
      so cheap you can start thousands. [[mark:draw-go]] Three of them run here.
      [[mark:draw-chan]] A channel carries values between them safely.
      [[mark:draw-note]] The wait group tells us when the senders have finished,
      so the channel can close. [[mark:close-go]] Ranging over a channel reads
      until that happens.
    sources:
      - { title: "A Tour of Go — Goroutines", url: "https://go.dev/tour/concurrency/1" }
      - { title: "Effective Go — Concurrency", url: "https://go.dev/doc/effective_go#concurrency" }
    actions:
      - id: type-import-sync
        type: editor.type
        at: { mark: type-import-sync, offsetMs: -400 }
        target: { file: main.go, after: "\t\"fmt\"\n", occurrence: 1 }
        text: "\t\"sync\"\n"
      - id: type-collect
        type: editor.type
        at: { mark: type-collect }
        target: { file: main.go, after: "\treturn best\n}\n", occurrence: 1 }
        cadence: block
        text: "\nfunc collect() int {\n\tresults := make(chan int)\n\tvar wg sync.WaitGroup\n\tfor i := 1; i <= 3; i++ {\n\t\twg.Add(1)\n\t\tgo func(k int) {\n\t\t\tdefer wg.Done()\n\t\t\tresults <- k * k\n\t\t}(i)\n\t}\n\tgo func() {\n\t\twg.Wait()\n\t\tclose(results)\n\t}()\n\tsum := 0\n\tfor v := range results {\n\t\tsum += v\n\t}\n\treturn sum\n}\n"
      - {
          id: open-go-board,
          type: whiteboard.apply,
          at: { mark: draw-go, offsetMs: -700 },
          open: true,
        }
      - id: draw-go
        type: whiteboard.apply
        at: { mark: draw-go }
        clear: true
        upsertIds: [go-title, go-box-1, go-text-1, go-box-2, go-text-2, go-box-3, go-text-3]
        drawMs: 2100
      - {
          id: draw-chan,
          type: whiteboard.apply,
          at: { mark: draw-chan },
          upsertIds: [go-arrow-in, go-chan-box, go-chan-text, go-arrow-out, go-sum-text],
          drawMs: 1500,
        }
      - {
          id: draw-note,
          type: whiteboard.apply,
          at: { mark: draw-note },
          upsertIds: [go-note, go-note-underline],
          drawMs: 900,
        }
      - { id: close-go-board, type: whiteboard.apply, at: { mark: close-go }, open: false }

  - id: sync
    narration: >
      [[mark:type-tally]] Channels aren't the only tool. [[mark:select-mutex]] A
      mutex guards shared state directly, when passing it around would be
      awkward. [[mark:type-race]] Select is the other half of channels.
      [[mark:select-select]] It waits on several at once, and takes whichever is
      ready first.
    sources:
      - { title: "sync.Mutex", url: "https://pkg.go.dev/sync#Mutex" }
      - { title: "A Tour of Go — Select", url: "https://go.dev/tour/concurrency/5" }
    actions:
      - id: type-tally
        type: editor.type
        at: { mark: type-tally, offsetMs: -400 }
        target:
          {
            file: main.go,
            after: "\tfor v := range results {\n\t\tsum += v\n\t}\n\treturn sum\n}\n",
            occurrence: 1,
          }
        cadence: block
        text: "\nfunc tally() int {\n\tvar mu sync.Mutex\n\tvar wg sync.WaitGroup\n\ttotal := 0\n\tfor i := 1; i <= 4; i++ {\n\t\twg.Add(1)\n\t\tgo func(k int) {\n\t\t\tdefer wg.Done()\n\t\t\tmu.Lock()\n\t\t\ttotal += k\n\t\t\tmu.Unlock()\n\t\t}(i)\n\t}\n\twg.Wait()\n\treturn total\n}\n"
      - id: select-mutex
        type: editor.select
        at: { mark: select-mutex }
        target: { file: main.go, text: "mu.Lock()", occurrence: 1 }
      - id: type-race
        type: editor.type
        at: { mark: type-race }
        target: { file: main.go, after: "\twg.Wait()\n\treturn total\n}\n", occurrence: 1 }
        cadence: block
        text: "\nfunc race() string {\n\ta := make(chan string, 1)\n\tb := make(chan string, 1)\n\ta <- \"first\"\n\tselect {\n\tcase v := <-a:\n\t\treturn v\n\tcase v := <-b:\n\t\treturn v\n\t}\n}\n"
      # Chained rather than mark-anchored: the three result lines follow the
      # select declaration immediately, and an own mark would have to be timed
      # against type-race's draw budget by hand.
      - id: type-use-conc
        type: editor.type
        at: { afterAction: type-race }
        target:
          {
            file: main.go,
            after: "\tfmt.Println(largest([]int{3, 9, 4}), largest([]float64{2.5, 1.5}))\n",
            occurrence: 1,
          }
        cadence: block
        text: "\n\tfmt.Println(\"sum\", collect())\n\tfmt.Println(\"tally\", tally())\n\tfmt.Println(\"select\", race())\n"
      - id: select-select
        type: editor.select
        at: { mark: select-select }
        target: { file: main.go, text: "select {", occurrence: 1 }

  - id: run
    narration: >
      [[mark:run]] Let's run the whole file. Values, pointers, the loop total. The
      array and the slice, with length and capacity. Bytes against runes. The map,
      the switch, the named constant. The scaled point, the embedded field, the
      area through an interface. The type switch, variadic sum, and closure. The
      deferred line arriving first, then the recovered panic. The wrapped error.
      Generics on two types. And three concurrency results at the end.
    sources:
      - { title: "Go Playground", url: "https://go.dev/play/" }
    actions:
      - { id: run, type: runtime.run, at: { mark: run, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-output,
          type: expect.output,
          at: { afterAction: run },
          contains: "select first",
          timeoutMs: 8000,
        }
      - {
          id: expect-file-main,
          type: expect.file,
          at: { afterAction: run },
          path: main.go,
          contains: "func largest[T int | float64](values []T) T",
        }

  - id: wrap
    narration: >
      That's the language, in one file. Twenty five keywords, types you can see
      rather than guess, and concurrency built into the syntax. All of it comes
      from the standard library and the language itself.
    sources:
      - { title: "Effective Go", url: "https://go.dev/doc/effective_go" }
    actions: []

checks:
  - { type: timing.p95Ms, max: 300 }
