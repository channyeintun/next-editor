  - id: structs
    narration: >
      [[mark:type-point]] Structs group fields under a name, and methods attach to
      the type. [[mark:type-use-point]] So we build a point and scale it.
      [[mark:select-pointer]] That star makes the receiver a pointer, so scale
      changes the real point instead of a copy.
    sources:
