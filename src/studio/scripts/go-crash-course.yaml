  - id: interfaces
    narration: >
      [[mark:type-shape]] Interfaces name behaviour, not data.
      [[mark:type-use-shape]] Point already has an area method, so it fits shape.
      [[mark:draw-iface]] Nothing had to say so. [[mark:draw-iface-note]] Go
      compares the methods, and the type either fits or it doesn't.
      [[mark:close-iface]] There's no implements keyword to write.
    sources:
      - {
          title: "A Tour of Go — Interfaces are implemented implicitly",
          url: "https://go.dev/tour/methods/10",
        }
    actions:
