build:
  voiceProfile: pocket-alba-v1
  seed: 17

runtime:
  kind: go-playground
  defaultMode: fixture
  fixture:
    latencyMs: 600
    result:
      status: success
      exitCode: 0
      output: "Go, in one file\ngo.dev Go 3 1.5\nbumped 15 via 15\ntotal 6\n[1 0 0] 1 8\n0=90 1=80 2=70 len 3 cap 4\nbytes 6 runes 5\nada is 36\ncount is three\nhigh true\npoint 6,8\nbase 9 9 w\narea 48\nint 7 string go other\n6 240\ncounter 2\n(deferred runs last)\ndescribed\nrecovered: boom\nhalve 7: odd number true\n9 2.5\nsum 14\ntally 10\nselect first\n"

scenes:
  - id: shape
    narration: >
      [[mark:draw-pkg]] Every Go file starts with a package clause.
      [[mark:draw-imp]] Then the imports it needs. [[mark:draw-funcs]] Then the
      functions. [[mark:circle-main]] And func main, in package main, is where
      the program starts. [[mark:to-code]] We'll build the whole language from
      there.
    sources:
      - { title: "A Tour of Go — Packages", url: "https://go.dev/tour/basics/1" }
      - {
          title: "The Go Programming Language Specification — Program execution",
          url: "https://go.dev/ref/spec#Program_execution",
        }
    actions:
      # Both land in the two quiet seconds the studio reserves before the first
      # dialog, so the panel is open and titled when the voice starts. The
      # title's draw budget is busy time, so it finishes clear of that dialog
      # rather than pushing the opening handle past two seconds.
      - {
          id: open-board,
          type: whiteboard.apply,
          at: { scene: start, offsetMs: -1700 },
          open: true,
        }
      - {
          id: draw-title,
          type: whiteboard.apply,
          at: { scene: start, offsetMs: -1200 },
          upsertIds: [anat-title],
          drawMs: 700,
        }
      - {
          id: draw-pkg,
          type: whiteboard.apply,
          at: { mark: draw-pkg },
          upsertIds: [anat-pkg-box, anat-pkg-text],
          drawMs: 800,
        }
      - {
          id: draw-imp,
          type: whiteboard.apply,
          at: { mark: draw-imp },
          upsertIds: [anat-arrow-1, anat-imp-box, anat-imp-text],
          drawMs: 1000,
        }
      - {
          id: draw-funcs,
          type: whiteboard.apply,
          at: { mark: draw-funcs },
          upsertIds: [anat-arrow-2, anat-main-box, anat-main-text],
          drawMs: 1000,
        }
      - {
          id: circle-main,
          type: whiteboard.apply,
          at: { mark: circle-main },
          upsertIds: [anat-entry-circle],
          drawMs: 900,
        }
      - { id: close-board, type: whiteboard.apply, at: { mark: to-code }, open: false }

  - id: values
    narration: >
      [[mark:open-main]] Here's the starting point. [[mark:type-values]] Values
      first. [[mark:select-short-decl]] Colon equals declares and assigns, and Go
      takes the type from the value. Const is fixed at compile time. Var lets you
      name the type yourself, or leave it to Go.
    sources:
      - {
          title: "A Tour of Go — Short variable declarations",
          url: "https://go.dev/tour/basics/10",
        }
    actions:
      - { id: open-main, type: workspace.openFile, at: { mark: open-main }, path: main.go }
      - id: type-values
        type: editor.type
        at: { mark: type-values, offsetMs: -400 }
        target: { file: main.go, after: "\tfmt.Println(\"Go, in one file\")\n", occurrence: 1 }
        cadence: line-by-line
        text: "\n\tconst site = \"go.dev\"\n\tname, count := \"Go\", 3\n\tvar ratio = 1.5\n\tfmt.Println(site, name, count, ratio)\n"
      - id: select-short-decl
        type: editor.select
        at: { mark: select-short-decl }
        target: { file: main.go, text: 'name, count := "Go", 3', occurrence: 1 }

  - id: pointers
    narration: >
      [[mark:type-bump]] A pointer holds an address. [[mark:type-use-bump]] So we
      pass the address of n, with an ampersand. [[mark:select-deref]] And a star
      reads or writes through it. Bump changed the real n, not a copy. Go has
      pointers, but no pointer arithmetic.
    sources:
      - { title: "A Tour of Go — Pointers", url: "https://go.dev/tour/moretypes/1" }
    actions:
      - id: type-bump
        type: editor.type
        at: { mark: type-bump, offsetMs: -400 }
        target:
          { file: main.go, after: "\tfmt.Println(site, name, count, ratio)\n}\n", occurrence: 1 }
        cadence: block
        text: "\nfunc bump(v *int) {\n\t*v += 5\n}\n"
      - id: type-use-bump
        type: editor.type
        at: { mark: type-use-bump }
        target: { file: main.go, after: "\tfmt.Println(site, name, count, ratio)\n", occurrence: 1 }
        cadence: line-by-line
        text: "\n\tn := 10\n\tbump(&n)\n\tfmt.Println(\"bumped\", n, \"via\", *(&n))\n"
      - id: select-deref
        type: editor.select
        at: { mark: select-deref }
        target: { file: main.go, text: "*v += 5", occurrence: 1 }

  - id: loops
    narration: >
      [[mark:type-for]] Go has one loop keyword. [[mark:select-for]] For covers
      counting loops, while loops, and loops that never stop. There's no while
      and no do.
    sources:
      - { title: "A Tour of Go — For", url: "https://go.dev/tour/flowcontrol/1" }
    actions:
      - id: type-for
        type: editor.type
        at: { mark: type-for, offsetMs: -400 }
        target:
          { file: main.go, after: "\tfmt.Println(\"bumped\", n, \"via\", *(&n))\n", occurrence: 1 }
        cadence: line-by-line
        text: "\n\ttotal := 0\n\tfor i := 1; i <= count; i++ {\n\t\ttotal += i\n\t}\n\tfmt.Println(\"total\", total)\n"
      - id: select-for
        type: editor.select
        at: { mark: select-for }
        target: { file: main.go, text: "for i := 1; i <= count; i++ {", occurrence: 1 }

  - id: arrays
    narration: >
      [[mark:type-arrays]] Arrays have a fixed length, baked into the type.
      [[mark:select-make]] Make builds a slice with a length and a capacity, so it
      can grow without reallocating straight away. You'll reach for slices almost
      every time.
    sources:
      - { title: "A Tour of Go — Arrays", url: "https://go.dev/tour/moretypes/6" }
    actions:
      - id: type-arrays
        type: editor.type
        at: { mark: type-arrays, offsetMs: -400 }
        target: { file: main.go, after: "\tfmt.Println(\"total\", total)\n", occurrence: 1 }
        cadence: block
        text: "\n\tvar arr [3]int\n\tarr[0] = 1\n\tbuf := make([]int, 0, 8)\n\tbuf = append(buf, 2)\n\tfmt.Println(arr, len(buf), cap(buf))\n"
      - id: select-make
        type: editor.select
        at: { mark: select-make }
        target: { file: main.go, text: "make([]int, 0, 8)", occurrence: 1 }

  - id: slices
    narration: >
      [[mark:type-slices]] Slices are Go's growable lists, and append adds to one.
      [[mark:draw-slice]] A slice is a window onto an array. [[mark:draw-len]]
      Length is how many values it holds. [[mark:draw-cap]] Capacity is the room
      in that array, before Go has to allocate a bigger one.
      [[mark:close-slice]] And range walks it, [[mark:select-range]] handing you
      the index and the value each time.
    sources:
      - {
          title: "The Go Blog — Go Slices: usage and internals",
          url: "https://go.dev/blog/slices-intro",
        }
    actions:
      - id: type-slices
        type: editor.type
        at: { mark: type-slices, offsetMs: -400 }
        target: { file: main.go, after: "\tfmt.Println(arr, len(buf), cap(buf))\n", occurrence: 1 }
        cadence: block
        text: "\n\tscores := []int{90, 80}\n\tscores = append(scores, 70)\n\tfor i, s := range scores {\n\t\tfmt.Print(i, \"=\", s, \" \")\n\t}\n\tfmt.Println(\"len\", len(scores), \"cap\", cap(scores))\n"
      - {
          id: open-slice-board,
          type: whiteboard.apply,
          at: { mark: draw-slice, offsetMs: -700 },
          open: true,
        }
      # The anatomy sketch is wiped — this diagram reuses its canvas.
      - id: draw-slice
        type: whiteboard.apply
        at: { mark: draw-slice }
        clear: true
        upsertIds: [sl-title, sl-box-0, sl-val-0, sl-box-1, sl-val-1, sl-box-2, sl-val-2, sl-box-3]
        drawMs: 2400
      - {
          id: draw-len,
          type: whiteboard.apply,
          at: { mark: draw-len },
          upsertIds: [sl-len-underline, sl-len-label],
          drawMs: 900,
        }
      - {
          id: draw-cap,
          type: whiteboard.apply,
          at: { mark: draw-cap },
          upsertIds: [sl-cap-arrow, sl-cap-label],
          drawMs: 1000,
        }
      - { id: close-slice-board, type: whiteboard.apply, at: { mark: close-slice }, open: false }
      - id: select-range
        type: editor.select
        at: { mark: select-range }
        target: { file: main.go, text: "for i, s := range scores {", occurrence: 1 }

  - id: strings
    narration: >
      [[mark:type-strings]] A Go string is bytes, not characters.
      [[mark:select-runes]] This word is five letters but six bytes, because the
      accented one takes two. Convert to runes when you need characters.
    sources:
      - {
          title: "The Go Blog — Strings, bytes, runes and characters in Go",
          url: "https://go.dev/blog/strings",
        }
    actions:
      - id: type-strings
        type: editor.type
        at: { mark: type-strings, offsetMs: -400 }
        target:
          {
            file: main.go,
            after: "\tfmt.Println(\"len\", len(scores), \"cap\", cap(scores))\n",
            occurrence: 1,
          }
        cadence: block
        text: "\n\tword := \"héllo\"\n\tfmt.Println(\"bytes\", len(word), \"runes\", len([]rune(word)))\n"
      - id: select-runes
        type: editor.select
        at: { mark: select-runes }
        target: { file: main.go, text: "len([]rune(word))", occurrence: 1 }

  - id: maps
    narration: >
      [[mark:type-maps]] Maps hold keys and values. [[mark:select-comma-ok]] A
      lookup gives back two things: the value, and whether the key was there. That
      second value is how you tell a missing key from a zero.
    sources:
      - { title: "The Go Blog — Go maps in action", url: "https://go.dev/blog/maps" }
    actions:
      - id: type-maps
        type: editor.type
        at: { mark: type-maps, offsetMs: -400 }
        target:
          {
            file: main.go,
