  - id: enums
    narration: >
      [[mark:type-level]] Go has no enum keyword. [[mark:select-iota]] Iota
      numbers a constant block from zero, and a named type gives those numbers
      meaning. [[mark:type-use-level]] Add a String method and printing shows the
      name instead of the number.
