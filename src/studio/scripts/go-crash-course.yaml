  - id: embedding
    narration: >
      [[mark:type-base]] Go has no inheritance. [[mark:type-use-base]] Instead you
      embed one struct in another. [[mark:select-embed]] Wrapper has no name for
      that field, so base's fields and methods come through as if they were its
      own. Composition, not a class tree.
    sources:
      - { title: "Effective Go — Embedding", url: "https://go.dev/doc/effective_go#embedding" }
    actions:
      - id: type-base
        type: editor.type
        at: { mark: type-base, offsetMs: -400 }
