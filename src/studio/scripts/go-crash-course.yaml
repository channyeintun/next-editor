# Go crash course — the whole language in one file, built from a bare main.
#
# Covers, in order: package + imports; constants and both declaration forms;
# pointers with & and *; `for` as the only loop keyword; arrays against slices
# and `make` with capacity; append/len/cap; `range`; bytes against runes; maps
# and the comma-ok lookup; `switch` without break; iota constants with a String
# method; structs with pointer and value receivers; embedding; implicitly
# satisfied interfaces; a type switch over `any`; variadic functions and
# closures; `defer`; panic/recover with a named return; sentinel errors with %w
# wrapping and errors.Is; generics with a type constraint; goroutines feeding a
# channel under a WaitGroup; a mutex; and `select`. Then it runs the lot.
#
# Insert-only, including the import block: it is pinned as a parenthesized group
# holding only "fmt", and "errors" and "sync" are inserted into it at the moment
# the lesson needs them, in the order gofmt wants (a bare `import "fmt"` could
# not be grown without a replace, which editor actions do not allow). Each topic
# inserts its declaration at the end of the file first, then the call in main —
# so every anchor is the previous topic's last line and stays predictable.
#
# Four drawn boards, wiped between topics with `clear: true`: the file's anatomy,
# a slice over its backing array, interface satisfaction, and goroutines feeding a
# channel. Boxes grow from their corner, labels type a character at a time, and
# the freedraw strokes trace point by point with the thin pen. The first open and
# the last close sit inside the studio's quiet recording handles, so the voice
# never starts or ends over a panel animation.
#
# The program is verified against the real Go toolchain, not read off the page:
# gofmt and vet clean, and eight runs produce identical bytes. Nothing printed
# depends on goroutine scheduling — collect() and tally() sum their results, and
# race() has a value waiting on only one channel.
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/go-crash-course.yaml
schemaVersion: 1

