# A Go crash course in one lesson: the shape of a Go file — package clause,
# imports, functions, and func main as the one entry point — sketched on the
# whiteboard, then built and run in the editor. It deliberately stops short of
# the two-value return, which `go-error-values.yaml` teaches on its own.
#
# The whiteboard work is drawn, not pasted: every `whiteboard.apply` that adds
# assets carries a `drawMs` budget, so boxes grow from their corner, labels type
# a character at a time, and the freedraw strokes (the arrows, the circles, the
# underline) trace point by point. Both panel moves sit inside the studio's own
# quiet recording handles — the board opens and is titled during the two seconds
# before the first word, and closes after the last one — so the voice never
# starts or ends on top of a panel animation.
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/go-crash-course.yaml
schemaVersion: 1

lesson:
  slug: go-crash-course
  title: "Go in one file: package, imports, and one entry point"
  locale: en-US
  workspace:
    lessonType: go
    name: Go Lesson
    entryFilePath: main.go
    files:
      main.go: |
        package main

        import "fmt"

        func main() {
        	fmt.Println("Go, in one file")
        }
  # Authored dark (#1e1e1e): the whiteboard renders with Excalidraw's dark
  # theme, which inverts element colors, so near-black draws as white. Pale
  # colors would invert to near-black and disappear.
  whiteboardAssets:
    # --- Board one: the shape of a Go file ---------------------------------
    - id: anat-title
      kind: text
      x: 340
      y: 164
      width: 440
      height: 40
      text: "The shape of a Go file"
      strokeColor: "#1e1e1e"
      fontSize: 30
    - id: anat-pkg-box
      kind: rectangle
      x: 340
      y: 226
      width: 320
      height: 64
      strokeColor: "#1e1e1e"
    - id: anat-pkg-text
      kind: text
      x: 364
      y: 244
      width: 280
      height: 30
      text: "package main"
      strokeColor: "#1e1e1e"
      fontSize: 24
    - id: anat-arrow-1
      kind: freedraw
      stroke: arrow-down
      x: 478
      y: 298
      width: 48
      height: 40
      strokeColor: "#1e1e1e"
    - id: anat-imp-box
      kind: rectangle
      x: 340
      y: 350
      width: 320
      height: 64
      strokeColor: "#1e1e1e"
    - id: anat-imp-text
      kind: text
      x: 364
      y: 368
      width: 280
      height: 30
      text: 'import "fmt"'
      strokeColor: "#1e1e1e"
      fontSize: 24
    - id: anat-arrow-2
      kind: freedraw
      stroke: arrow-down
      x: 478
      y: 422
      width: 48
      height: 40
      strokeColor: "#1e1e1e"
    - id: anat-main-box
      kind: rectangle
      x: 340
      y: 474
      width: 320
      height: 64
      strokeColor: "#1e1e1e"
    - id: anat-main-text
      kind: text
      x: 364
      y: 492
      width: 280
      height: 30
      text: "func main()"
      strokeColor: "#1e1e1e"
      fontSize: 24
    - id: anat-entry-circle
      kind: freedraw
      stroke: circle
      x: 324
      y: 462
      width: 352
      height: 88
      strokeColor: "#1e1e1e"
    # --- Board two: main calls, the function returns ------------------------
    - id: ret-title
      kind: text
      x: 340
      y: 164
      width: 620
      height: 40
      text: "main calls, the function returns"
      strokeColor: "#1e1e1e"
      fontSize: 30
    - id: ret-main-box
      kind: rectangle
      x: 340
      y: 248
      width: 220
      height: 80
      strokeColor: "#1e1e1e"
    - id: ret-main-text
      kind: text
      x: 364
      y: 274
      width: 190
      height: 34
      text: "func main()"
      strokeColor: "#1e1e1e"
      fontSize: 24
    - id: ret-arrow
      kind: freedraw
      stroke: arrow-right
      x: 578
      y: 266
      width: 112
      height: 44
      strokeColor: "#1e1e1e"
    - id: ret-fn-box
      kind: rectangle
      x: 708
      y: 248
      width: 220
      height: 80
      strokeColor: "#1e1e1e"
    - id: ret-fn-text
      kind: text
      x: 740
      y: 274
      width: 190
      height: 34
      text: "triple(7)"
      strokeColor: "#1e1e1e"
      fontSize: 24
    - id: ret-down-arrow
      kind: freedraw
      stroke: arrow-down
      x: 794
      y: 342
      width: 48
      height: 40
      strokeColor: "#1e1e1e"
    - id: ret-val-text
      kind: text
      x: 800
      y: 392
      width: 80
      height: 36
      text: "21"
      strokeColor: "#1e1e1e"
      fontSize: 26
    - id: ret-val-circle
      kind: freedraw
      stroke: circle
      x: 772
      y: 382
      width: 124
      height: 56
      strokeColor: "#1e1e1e"
    - id: ret-note
      kind: text
      x: 340
      y: 470
      width: 600
      height: 34
      text: "one package, nothing to import"
      strokeColor: "#1e1e1e"
      fontSize: 24
    - id: ret-note-underline
      kind: freedraw
      stroke: underline
      x: 340
      y: 470
      width: 520
      height: 40
      strokeColor: "#1e1e1e"

build:
  voiceProfile: pocket-alba-v1
  seed: 13

runtime:
  kind: go-playground
  defaultMode: fixture
  fixture:
    latencyMs: 600
    result:
      status: success
      exitCode: 0
      output: "Go, in one file\ntriple 7 is 21\n"

scenes:
  - id: shape
    narration: >
      [[mark:draw-pkg]] Every Go file opens with a package clause.
      [[mark:draw-imp]] Under that, the imports it needs. [[mark:draw-funcs]]
      And then the functions. That's the whole shape of a Go file.
      [[mark:circle-main]] One of them is special. In package main, func main
      is where the program starts. [[mark:to-code]] Let's open a real file.
    sources:
      - title: "A Tour of Go — Packages"
        url: "https://go.dev/tour/basics/1"
      - title: "The Go Programming Language Specification — Program execution"
        url: "https://go.dev/ref/spec#Program_execution"
    actions:
      # Both of these land in the two quiet seconds the studio reserves before
      # the first dialog, so the panel is open and titled when the voice starts
      # instead of animating over the opening words. The title's draw budget is
      # busy time, so it finishes clear of the first dialog rather than pushing
      # the opening handle past two seconds.
      - id: open-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -1700 }
        open: true
      - id: draw-title
        type: whiteboard.apply
        at: { scene: start, offsetMs: -1200 }
        upsertIds: [anat-title]
        drawMs: 700
      - id: draw-pkg
        type: whiteboard.apply
        at: { mark: draw-pkg }
        upsertIds: [anat-pkg-box, anat-pkg-text]
        drawMs: 800
      - id: draw-imp
        type: whiteboard.apply
        at: { mark: draw-imp }
        upsertIds: [anat-arrow-1, anat-imp-box, anat-imp-text]
        drawMs: 1000
      - id: draw-funcs
        type: whiteboard.apply
        at: { mark: draw-funcs }
        upsertIds: [anat-arrow-2, anat-main-box, anat-main-text]
        drawMs: 1000
      - id: circle-main
        type: whiteboard.apply
        at: { mark: circle-main }
        upsertIds: [anat-entry-circle]
        drawMs: 900
      - id: close-board
        type: whiteboard.apply
        at: { mark: to-code }
        open: false

  - id: read
    narration: >
      [[mark:open-main]] Here's the file. [[mark:select-package]] Package main
      tells Go this is a program, not a library. [[mark:select-print]] And main
      prints one line. That's a complete Go program.
    sources:
      - title: "The Go Programming Language Specification — Package clause"
        url: "https://go.dev/ref/spec#Package_clause"
    actions:
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: main.go
      - id: select-package
        type: editor.select
        at: { mark: select-package }
        target:
          file: main.go
          text: "package main"
          occurrence: 1
      - id: select-print
        type: editor.select
        at: { mark: select-print }
        target:
          file: main.go
          text: 'fmt.Println("Go, in one file")'
          occurrence: 1

  - id: add-func
    narration: >
      [[mark:type-triple]] Let's add a second function, right below main.
      [[mark:select-sig]] It takes an int and returns an int. Both types are
      written out. Go never guesses them.
    sources:
      - title: "A Tour of Go — Functions"
        url: "https://go.dev/tour/basics/4"
    actions:
      - id: type-triple
        type: editor.type
        at: { mark: type-triple, offsetMs: -400 }
        target:
          file: main.go
          after: "\tfmt.Println(\"Go, in one file\")\n}\n"
          occurrence: 1
        cadence: line-by-line
        text: "\nfunc triple(n int) int {\n\treturn n * 3\n}\n"
      - id: select-sig
        type: editor.select
        at: { mark: select-sig }
        target:
          file: main.go
          text: "(n int) int"
          occurrence: 1

  - id: call-and-run
    narration: >
      [[mark:type-call]] Now main can call it. Same package, so there's nothing
      to import. [[mark:select-call]] One call, one value back. [[mark:run]]
      Let's run it. Seven tripled is twenty one.
    sources:
      - title: "The Go Programming Language Specification — Declarations and scope"
        url: "https://go.dev/ref/spec#Declarations_and_scope"
      - title: "Go Playground"
        url: "https://go.dev/play/"
    actions:
      - id: type-call
        type: editor.type
        at: { mark: type-call, offsetMs: -400 }
        target:
          file: main.go
          after: "\tfmt.Println(\"Go, in one file\")\n"
          occurrence: 1
        text: "\tfmt.Println(\"triple 7 is\", triple(7))\n"
      - id: select-call
        type: editor.select
        at: { mark: select-call }
        target:
          file: main.go
          text: "triple(7)"
          occurrence: 1
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 15000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "triple 7 is 21"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.go
        contains: "func triple(n int) int"

  - id: recap
    narration: >
      [[mark:draw-recap]] So that's a Go program. One package, one entry point.
      [[mark:circle-ret]] main calls what it needs, and gets values back.
      [[mark:board-close]] That's the whole shape.
    sources:
      - title: "How to Write Go Code"
        url: "https://go.dev/doc/code"
    actions:
      # Reopened a beat ahead of the words, for the same reason the first open
      # sits in the lead handle.
      - id: open-recap
        type: whiteboard.apply
        at: { mark: draw-recap, offsetMs: -700 }
        open: true
      - id: draw-recap
        type: whiteboard.apply
        at: { mark: draw-recap }
        upsertIds: [ret-title, ret-main-box, ret-main-text, ret-arrow, ret-fn-box, ret-fn-text]
        drawMs: 1800
      - id: draw-return
        type: whiteboard.apply
        at: { mark: circle-ret }
        upsertIds: [ret-down-arrow, ret-val-text, ret-val-circle]
        drawMs: 1200
      - id: draw-note
        type: whiteboard.apply
        at: { mark: board-close }
        upsertIds: [ret-note, ret-note-underline]
        drawMs: 800
      # Lands in the trailing quiet handle: the final sentence finishes, the
      # board closes, then the studio's two seconds of silence close the tape.
      - id: close-recap
        type: whiteboard.apply
        at: { mark: board-close, offsetMs: 2800 }
        open: false

checks:
  - { type: timing.p95Ms, max: 300 }
