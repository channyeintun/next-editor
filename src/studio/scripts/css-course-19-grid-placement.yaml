# CSS course (Burmese), lesson 19 of 43: grid part 2, lines and placement.
#
# Narration is an ENGLISH DRAFT for the Burmese writer (DESIGN.md next to this
# file is the span-by-span brief). Every [[mark:…]] sits where its action
# begins, at a sentence end; each span carries one piece of meaning.
# Everything the learner sees (title, chapters, whiteboard labels, UI strings)
# is Burmese already.
#
# Shape: board (recall lesson 18; auto placement fills cells in HTML order,
# row by row; order changes only what you see; grid-auto-flow: column) → code
# tour (hero strip, two specials, seven numbered tiles with a wide third one,
# snacks, a photo card whose badge comes first; empty styles.css) → specials
# repeat(auto-fill, minmax(110px, 1fr)) (two cards + an empty third column) →
# auto-fit (the empty column collapses, the cards stretch) → board (fill vs
# fit; the same once a row is full; a definite size is needed) → tiles
# repeat(3, 1fr) → .wide span 2 (a hole after tile 2) → dense (tile 4
# backfills) → board (the visual order vs the HTML order) → board (lines 1..4
# and -4..-1; 1 / 3 = two columns; 1 / -1 = the whole row) → first tile 1 / 3
# → 1 / -1 (a banner) → board (explicit vs implicit grid; -1 is the last
# explicit line; grid-auto-rows / -columns) → snacks: two columns, one
# minmax(150px, auto) row (150 tall; the added rows are auto) →
# grid-auto-rows: minmax(150px, auto) (every
# row 150) → photo card: display grid (two rows) → same cell (the later photo
# covers the badge) → z-index: 1 (badge on top, no position needed) → hero:
# named lines (no change, not a grid yet) → children in "content" → display
# grid (everything moves in 16px) → strip in "full" (edge to edge) → quiz
# (4 columns, 2 / -1 = 3 columns) and recap; hand-off to lesson 20 (areas,
# subgrid, alignment).
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set(; no postcss config; no reload.
# Rules are appended at the END of styles.css. Keystroke-typed values have no
# misleading valid prefix: the specials rule is typed at the end of the file
# (an unclosed "repeat(… 1fr" is only complete once it is the final value;
# "minmax(110px, 1" is invalid); the auto-fit and auto-rows lines are typed at
# the END of their rule, so their open parenthesis swallows only the rule's
# closing brace and they stay invalid until the last ")"; "span 2", "1 / 3",
# "dense", "z-index: 1" pass through no other valid layout ("grid-column: 1"
# alone keeps tile 1 where it already is); the photo rule types grid-column
# before grid-row (column 1 alone changes nothing); the hero's named-line
# track list and its children's "content" rule are typed while the hero is
# not a grid yet (no effect), and display: grid is inserted last. Line-by-line
# where a prefix would flash: "1 / -1" ("1" alone would shrink the banner),
# the strip's "full" ("f", "fu", "ful" are valid names that would push the
# strip into an implicit column), and the tiles and snacks rules (the
# narration summarises them).
#
# Measured in headless Chrome at 432 × 720 (probe/stages.ts): specials 400
# wide stacked → auto-fill 125 / 125 + an empty 125 track → auto-fit 194 /
# 194; tiles 128 wide, 3 per row → span 2: tile 3 264 wide on row 2, hole at
# row 1 column 3 → dense: tile 4 fills it (row 1: 1 2 4; row 2: 3 3 5) →
# 1 / 3: tile 1 264 wide (row 1: 1 1 2; order 1-7 again) → 1 / -1: tile 1
# 400 wide; snacks 194 wide, row 1 150 tall, rows 2-3 105 → auto rows: all
# 150; photo: badge line then photo → grid: badge top right of row 1, photo
# row 2 → same cell: the photo hides the badge → z-index: badge on top;
# hero: text at the box's left edge → grid: text inset 16 (368 wide) → strip
# 400 wide again.
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
