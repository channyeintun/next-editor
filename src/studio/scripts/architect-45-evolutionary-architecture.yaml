        cadence: line-by-line
        target: { file: notebook/45-fitness-functions.md, after: "| change တိုင်း | fail 0 |\n" }
        text: "| elasticity + data integrity | 20 ဆ load test | သင်္ကြန် မတိုင်ခင် (လူက စ) | error 1 % အောက်၊ နှစ်ခါရောင်း 0 |\n"
      - id: sel-first
        type: editor.select
        at: { mark: d-start }
        target: { file: notebook/45-fitness-functions.md, text: "| module boundary |" }

  - id: your-turn
    chapter: ကိုယ့် system အတွက်
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ ကိုယ့် team မှာလည်း လူတိုင်း သိတယ်လို့ ထင်ရပေမဲ့ ဘယ်သူမှ မစစ်တဲ့ စည်းကမ်း
      တစ်ခုတော့ ရှိမှာပါ။ lesson ကို pause လုပ်ပြီး၊ ဒီ table ထဲမှာ ကိုယ့် system ရဲ့ စည်းကမ်း တစ်ခုကို
      စစ်ဆေးချက်နဲ့ threshold အဖြစ် ရေးကြည့်ပါ။
