    files:
      README.md: |
        # ခရီးဖော် · system မှတ်စု

        ခရီးဖော်က အဝေးပြေးကား လက်မှတ်ကို app ကနေ ဝယ်လို့ရအောင် လုပ်ပေးတဲ့ ကုမ္ပဏီပါ။
        ဒီ course အတွက် စိတ်ကူးနဲ့ တည်ဆောက်ထားတဲ့ ကုမ္ပဏီ ဖြစ်ပါတယ်။

        ## သုံးတဲ့သူတွေ

        - ခရီးသည်: ခရီးစဉ် ရှာတယ်၊ ထိုင်ခုံ ရွေးတယ်၊ wallet နဲ့ ငွေချေတယ်၊ လက်မှတ် ရတယ်
        - ကားလိုင်း: ခရီးစဉ်နဲ့ ဈေးနှုန်း တင်တယ်၊ ရောင်းအား ကြည့်တယ်
        - ကောင်တာ ဝန်ထမ်း: ကားဂိတ်မှာ ထိုင်ခုံ အတူတူကိုပဲ ရောင်းတယ်
        - ပါဆယ် ပို့သူ: ကားနဲ့ ပါဆယ် ထည့်ပေးတယ် (လုပ်ငန်း အသစ်)

        ## အခု အခြေအနေ (ကုမ္ပဏီ သက်တမ်း 7 နှစ်)

        - developer 90 ယောက်၊ team 12 ခု၊ architect 4 ယောက်
        - ကားလိုင်း 500၊ တစ်ရက် လက်မှတ် 200,000 ခန့်
        - service အများကြီး၊ team တိုင်း သုံးတဲ့ platform တစ်ခုပေါ်မှာ
        - လုပ်ငန်း အသစ်: ကားတွေနဲ့ ပါဆယ် ပို့ပေးတာ
      examples/module-boundaries.test.js: |
        // Example: module boundary ကို စစ်တဲ့ fitness function (ဥပမာ သက်သက်ပါ)
        import test from "node:test";
        import assert from "node:assert";
        import { findTableAccess } from "./tools/table-access.js";

        // module တစ်ခုစီ ပိုင်တဲ့ table
        const owns = {
          booking: ["tickets", "seat_holds", "seat_counts"],
          payment: ["payments", "refunds"],
          parcel: ["parcels"],
        };

        test("module တစ်ခုက တခြား module ရဲ့ table ကို မထိရ", () => {
          const violations = findTableAccess("src").filter(
            (use) => !owns[use.module].includes(use.table),
          );
          assert.equal(violations.length, 0);
        });
      notebook/45-fitness-functions.md: |
        # Fitness function စာရင်း

        ## Wiki ထဲက စည်းကမ်း (ရေးထားတာ 2 နှစ်ကျော်ပြီ)
        - module တစ်ခုက တခြား module ရဲ့ table ကို တိုက်ရိုက် မထိရ
        - ခရီးစဉ် ရှာတာ မြန်ရမယ်
        - code ကို ကောင်းကောင်း ဖွဲ့စည်းထားရမယ်

        ## Fitness function
        | ကာကွယ်တဲ့ အရာ | စစ်ဆေးချက် | ဘယ်အချိန် run | Threshold |
        |---|---|---|---|
