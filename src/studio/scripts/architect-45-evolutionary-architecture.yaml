  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ business ရော၊ technology ရော၊ team ပါ အမြဲ ပြောင်းနေတာမို့၊ architecture ကို
      အဆင့်သေးသေးလေးတွေနဲ့ ပြောင်းနိုင်အောင် ဆောက်ရပါတယ်။ ပြောင်းရင်းနဲ့ မပျောက်ရမယ့် characteristic တွေကိုတော့
      fitness function တွေက စောင့်ပေးပါတယ်။
      [[mark:recap-2]] fitness function ဆိုတာ ဘယ်သူ စစ်စစ် အဖြေတူပြီး၊ threshold ကို ဂဏန်းနဲ့ ရေးထားတဲ့ စစ်ဆေးချက်ပါ။
      ဖြစ်နိုင်သမျှ လူက စပေးစရာ မလိုဘဲ အလိုအလျောက် run အောင် လုပ်ထားရပါတယ်။ wiki ထဲမှာပဲ ရှိတဲ့ စည်းကမ်းကို
      ချိုးမိတာက လေးလကြာမှ ပေါ်ခဲ့ပေမဲ့၊ pipeline ထဲက စစ်ဆေးချက်ကတော့ မိနစ်ပိုင်းအတွင်း ပြောပြပါတယ်။
      [[mark:next]] နောက် lesson မှာတော့ ဒီ စစ်ဆေးချက်ကို ပထမဆုံး run လိုက်တဲ့အခါ ချိုးဖောက်မှု ရာနဲ့ချီ တွေ့ရင်
      ဘာလုပ်မလဲ ဆိုတာကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "Building Evolutionary Architectures, 2nd edition (Ford, Parsons, Kua, Sadalage)",
          url: "https://oreil.ly/evolutionary-arch-2e",
        }
