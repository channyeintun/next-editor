  - id: padauk-agreed
    narration: >
      [[mark:close-b2]] [[mark:p03]] သင်္ကြန် ပြီးတော့ Padauk အဖွဲ့ ထိုင်ဆွေးနွေးကြပါတယ်။ ဘယ်အဖွဲ့မှ
      အကြွေး လုံးဝ မရှိဘဲ မနေနိုင်ပါဘူး၊ အဲဒီလို ကြိုးစားရင်လည်း feature တစ်ခုမှ အချိန်မီ ထုတ်နိုင်မှာ
      မဟုတ်ပါဘူး။ ဒါကြောင့် ဘယ်အထိ ချေးလို့ရလဲ ဆိုတာကို နောက် ပြဿနာ မတက်ခင် ကြိုသဘောတူလိုက်ကြပါတယ်။
      [[mark:p03b]] စည်းကမ်းက သုံးချက်ပါ။ အကြွေး အားလုံးကို စာရင်း တစ်ခုထဲ ရေးမယ်၊ အတိုးက တစ်ပတ်ကို 5
      နာရီ ကျော်ရင် နောက် sprint မှာ ဆပ်မယ်၊ နောက် peak မရောက်ခင် ဆပ်ပြီးအောင် လုပ်မယ်။ Top-up ရဲ့ 6
      နာရီက 5 နာရီ စည်းကို ကျော်နေလို့ စာရင်း ထိပ်ဆုံးကို ရောက်သွားပါတယ်။ ဒီလို ကြိုသဘောတူထားတဲ့ risk
      အကန့်အသတ်ကို နောက်ပိုင်းမှာ သူ့ နာမည် အမှန်နဲ့ ပြန်တွေ့ရပါမယ်။ [[mark:p03c]] SRE တွေက ဒီ
      စာရင်းထဲက အကြွေးတွေကို code ရေးပြီး ကိုယ်တိုင် ဆပ်ပေးသလို၊ ဖြတ်လမ်း အသစ် တစ်ခု လိုက်ရင် risk
      ဘယ်လောက် ရှိလဲ ဆိုတာလည်း အကြံပေးပါတယ်။ feature အသစ်တွေ ဝင်လာတိုင်း အကြွေး အသစ်တွေ ပေါ်လာမှာမို့
      ဒီ စာရင်းကို တစ်ခါ ရေးပြီး ပစ်ထားလို့ မရပါဘူး၊ reliability ဆိုတာ ဘယ်တော့မှ ပြီးမသွားတဲ့ အလုပ်ပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - { title: "20 Years of SRE at Google", url: "https://sre.google/20/" }
