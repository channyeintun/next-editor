# SRE from zero, lesson 1: why running software is the long, hard part.
#
# A concept lesson: nothing runs. Deck pages (deck SRE 1) and four whiteboard
# boards carry the lesson, and the recap highlights the key terms in notes.md.
# The narration is the approved Burmese voice script
# docs/sre-course/voice-scripts/sre-01-why-reliability-now.md, word for word:
# each ⟪…⟫ marker became a [[mark:…]] at the same place. Marks with a letter
# suffix (p01b, b1-step2b, …) were added at existing sentence ends so that
# something on screen changes at least every ~35 s; they add no spoken text.
# ask-question (recap) is one more mark at an existing sentence end: the
# question-line select hangs off it so the ⟪pause 3s⟫ is real silence.
#
# Deck: every page points at deck SRE 1's placeholder /pub URL until Chan
# publishes the deck; the Director's unreachable-deck warning is expected.
# Page plan (kit fields per page): ~/Documents/sre-course/work/pages/sre-01-why-reliability-now.json
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/sre-01-why-reliability-now.yaml
#   bun scripts/studio-compile-check.ts src/studio/scripts/sre-01-why-reliability-now.yaml
