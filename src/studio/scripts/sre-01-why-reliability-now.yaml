  - id: course-loop
    narration: >
      [[mark:b4-step1]] ဒီသင်တန်း တစ်ခုလုံးကို Padauk reliability loop ဆိုတဲ့ စက်ဝိုင်းနဲ့
      ကြည့်ရအောင်။ Padauk မှာ ပြဿနာ ဖြစ်တိုင်း ဒီ စက်ဝိုင်းကို ပတ်ရပါတယ်။ ဘယ်လောက် စိတ်ချရရင်
      လုံလောက်လဲ သဘောတူတယ်၊ user ထိခိုက်နေတာကို သတိထားမိတယ်၊ တုံ့ပြန်တယ်၊ သင်ယူတယ်၊ ပြီးတော့
      သင်ခန်းစာကို system ထဲ ထည့်တည်ဆောက်ပြီး အစကို ပြန်ရောက်ပါတယ်။ Module 2 မှာ သဘောတူတာနဲ့
      သတိထားမိတာ၊ Module 3 မှာ တုံ့ပြန်တာနဲ့ သင်ယူတာ၊ Module 5 မှာ system ထဲ ထည့်တည်ဆောက်တာကို
      လေ့လာပါမယ်။ [[mark:b4-step2]] အလယ်မှာတော့ လဲတိုင်း ပြန်ထတဲ့ ပစ်တိုင်းထောင် အရုပ်လေး ရှိပါတယ်၊
      အဲဒါက ဒီ စက်ဝိုင်းကို ဆက်လည်နေအောင် လုပ်ပေးတဲ့ လူတွေပါ။ Module 4 က အဲဒီ လူတွေ အကြောင်း ဖြစ်ပြီး၊
