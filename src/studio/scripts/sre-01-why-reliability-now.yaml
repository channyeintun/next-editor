  - id: recap
    narration: >
      [[mark:close-p05]] [[mark:notes]] ပြန်ချုပ်ကြည့်ရအောင်။ [[mark:sel-sre]] SRE ဆိုတာ ကံကို
      အားမကိုးဘဲ engineering နဲ့ service တွေကို စိတ်ချရအောင် ထိန်းတဲ့ အလုပ်ပါ။ [[mark:sel-build-run]]
      build လုပ်တာက ခဏပဲ ကြာပေမဲ့ run တာကတော့ နှစ်နဲ့ချီ ကြာပါတယ်။ [[mark:sel-debt]] ဖြတ်လမ်းက ချေးတာ၊
      လက်နဲ့ ပြင်ရတာနဲ့ ပြောင်းရမှာ ကြောက်တာက အတိုး၊ outage က ဆပ်ရမယ့် နေ့ပါ။ [[mark:sel-risk-limit]]
      ဘယ်အထိ ချေးမလဲ ဆိုတာကို ပြဿနာ မတက်ခင် ကြိုသဘောတူထားရပါတယ်။ [[mark:sel-socio]] reliability
      ဆိုတာလည်း tool တွေချည်း မဟုတ်ဘဲ လူတွေ၊ အဖွဲ့တွေနဲ့ပါ အတူ တည်ဆောက်ရတာပါ။ မေးခွန်း တစ်ခု မေးပါရစေ။
      ကိုယ့်အဖွဲ့က fail ဖြစ်တဲ့ job တစ်ခုကို သောကြာနေ့တိုင်း လက်နဲ့ ပြန် run ပေးနေရတယ် ဆိုပါစို့။ [[mark:ask-question]] ဒါက
      အကြွေးလား၊ အတိုးလား၊ ဒါမှမဟုတ် ဆပ်ရမယ့် နေ့လား? [[mark:pause-question]] အဖြေကတော့ အတိုးပါ။ job
      ကို သေချာ မပြင်ခဲ့တာက အကြွေး ဖြစ်ပြီး၊ သောကြာနေ့တိုင်း လက်နဲ့ ပြန် run နေရတာက သူ့ရဲ့ အတိုးပါ။
      နောက် lesson မှာတော့ config ထဲက typo တစ်ခုကြောင့် user တွေ မိနစ် 20 လုံးလုံး ဝန်ဆောင်ခ 10 ဆ
      ပေးခဲ့ရပါတယ်။ ဘာကို အရင်ဆုံး ပြင်မလဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - { title: "SRE book, 1st ed: Foreword", url: "https://sre.google/sre-book/foreword/" }
      - { title: "SRE book, 1st ed: Preface", url: "https://sre.google/sre-book/preface/" }
    actions:
      - { id: close-p05, type: slide.close, at: { mark: close-p05 } }
      - {
          id: open-notes,
          type: workspace.openFile,
          at: { mark: notes, offsetMs: 300 },
          path: notes.md,
        }
      - {
          id: sel-sre,
          type: editor.select,
          at: { mark: sel-sre },
          target: { file: notes.md, text: "Site Reliability Engineering", occurrence: 1 },
        }
      - {
          id: sel-build-run,
          type: editor.select,
          at: { mark: sel-build-run },
          target: { file: notes.md, text: "build နဲ့ run", occurrence: 1 },
        }
      - {
          id: sel-debt,
          type: editor.select,
          at: { mark: sel-debt },
          target: { file: notes.md, text: "technical debt", occurrence: 1 },
        }
      - {
          id: sel-risk-limit,
          type: editor.select,
          at: { mark: sel-risk-limit },
          target: { file: notes.md, text: "ကြိုသဘောတူထားတဲ့ risk အကန့်အသတ်", occurrence: 1 },
        }
      - {
          id: sel-socio,
          type: editor.select,
          at: { mark: sel-socio },
          target: { file: notes.md, text: "sociotechnical", occurrence: 1 },
        }
      # ⟪pause 3s⟫: the question line is swept after the question ends, and the answer at
      # pause-question waits for the drag (the scheduler holds the next dialog until a select
      # anchored to an earlier dialog finishes). ask-question, one more mark at an existing
      # sentence end, makes the question its own short dialog so the offset tracks its end
      # at any speaking rate. 4500 ms leaves about 2.8 / 2.0 / 0.7 s of quiet after the
      # question at 55 / 70 / 95 ms per character; more trips compile-check's 2.5 s
      # inserted-silence warning at 55.
      - {
          id: pause-question,
          type: editor.select,
          at: { mark: ask-question, offsetMs: 4500 },
          target:
            {
              file: notes.md,
              text: "မေးခွန်း: fail ဖြစ်တဲ့ job တစ်ခုကို သောကြာနေ့တိုင်း လက်နဲ့ ပြန် run ရတယ်။ ဒါ အကြွေးလား၊ အတိုးလား၊ ဆပ်ရမယ့် နေ့လား?",
              occurrence: 1,
            },
        }

checks:
  # 500, not 300: google-svg deck pages stall the main thread at show/close.
  - { type: timing.p95Ms, max: 500 }
