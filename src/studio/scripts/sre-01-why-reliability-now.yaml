  - id: any-company
    chapter: "SRE အဖွဲ့ မရှိဘဲ စလို့ရ"
    narration: >
      [[mark:p04]] ဆွေးနွေးပွဲ အဆုံးမှာ CTO ကိုနေလင်းက မသီရိကို Top-up အလုပ်နဲ့ တွဲပြီး reliability
      ကိုပါ ကြည့်ပေးဖို့ ပြောပါတယ်။ SRE အလေ့အကျင့်တွေက အဖွဲ့ ဘယ်လို ဖွဲ့ထားလဲ ဆိုတာနဲ့ မဆိုင်လို့ SRE
      အဖွဲ့ မရှိဘဲ စလို့ရပါတယ်။ ဥပမာ developer တွေက ကိုယ်ရေးတဲ့ service ကို ကိုယ်တိုင် run ပြီး
      on-call ပါ ယူနိုင်ပါတယ်။ [[mark:p04b]] user အနည်းစုဆီ အရင် ထုတ်ကြည့်ပြီးမှ တဖြည်းဖြည်း rollout
      လုပ်တာလို ဘေးကင်းတဲ့ နည်းတွေအတွက်လည်း အဖွဲ့ သီးသန့် မလိုပါဘူး။ ကုမ္ပဏီ သေးသေး ဖြစ်ဖြစ်၊ system
      ဟောင်းဟောင်း ဖြစ်ဖြစ်၊ ဘဏ်လို စည်းမျဉ်း တင်းတဲ့ လုပ်ငန်း ဖြစ်ဖြစ် စလို့ရပါတယ်။ [[mark:p04c]]
      ဒါပေမဲ့ ဒီအလုပ်ကိုပဲ တာဝန်ယူထားတဲ့သူ မရှိရင် စတာထက် ဆက်လုပ်နေဖို့က ပိုခက်ပါတယ်။ အပိုအလုပ်အဖြစ်
      လုပ်ရတဲ့ reliability က feature deadline တွေကြားမှာ အမြဲ နောက်ကျ ကျန်ခဲ့တတ်လို့၊ lesson 5
      အဆုံးမှာ Padauk က မသီရိကို အချိန်ပြည့် SRE အဖြစ် ခန့်လိုက်မှာပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - { title: "20 Years of SRE at Google", url: "https://sre.google/20/" }
      - {
          title: "SRE book second edition (Google Cloud Blog)",
          url: "https://cloud.google.com/blog/products/devops-sre/sre-book-second-edition",
        }
    actions:
