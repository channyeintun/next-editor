    files:
      notes.md: |
        # SRE ဘာကြောင့် လိုလာတာလဲ

        - Site Reliability Engineering — service ကြီးတွေကို user တွေအတွက် software နဲ့ စိတ်ချရအောင် ထိန်းတဲ့ engineering
        - build နဲ့ run — build လုပ်တာ ခဏ၊ run တာ နှစ်နဲ့ချီ
        - technical debt — ဖြတ်လမ်းက ချေးတာ၊ လက်နဲ့ ပြင်ရတာနဲ့ ပြောင်းရမှာ ကြောက်တာက အတိုး၊ outage က ဆပ်ရမယ့် နေ့
        - ကြိုသဘောတူထားတဲ့ risk အကန့်အသတ် — ဘယ်အထိ ချေးမလဲ ပြဿနာ မတက်ခင် သဘောတူ
        - sociotechnical — code၊ server နဲ့ လူ၊ အဖွဲ့ အားလုံး system တစ်ခုတည်း

        မေးခွန်း: fail ဖြစ်တဲ့ job တစ်ခုကို သောကြာနေ့တိုင်း လက်နဲ့ ပြန် run ရတယ်။ ဒါ အကြွေးလား၊ အတိုးလား၊ ဆပ်ရမယ့် နေ့လား?
