      - { id: show-p04b, type: slide.show, at: { mark: p04b }, slideId: l01_p04b }
      - { id: show-p04c, type: slide.show, at: { mark: p04c }, slideId: l01_p04c }

  - id: meet-padauk
    chapter: "Padauk နဲ့ သင်တန်း မြေပုံ"
    narration: >
      [[mark:close-p04c]] [[mark:b3-step1]] Padauk ကို သေချာ မိတ်ဆက်ပေးပါရစေ။ Padauk က တစ်လကို user 12
      သိန်းလောက် သုံးနေတဲ့ app ပါ။ app ကနေ ပို့တဲ့ request တိုင်းက gateway ကို အရင် ရောက်ပါတယ်။
      [[mark:b3-step2]] အဲဒီကနေ ငွေလွှဲတာ၊ QR နဲ့ ငွေချေတာအတွက် Wallet၊ ဖုန်းဘေလ် ဖြည့်ဖို့ Top-up၊
      မကြာခင် launch လုပ်မယ့် မီတာခ ရေခ ဆောင်ဖို့ Bill Pay ဆီ ခွဲသွားပါတယ်။ [[mark:b3-step3]] Wallet က
      ဘဏ်တွေနဲ့၊ Top-up က Operator A၊ B၊ C ဆိုတဲ့ ဖုန်းကုမ္ပဏီတွေနဲ့ ချိတ်ထားပါတယ်။ engineer 25 ယောက်
      ရှိပေမဲ့ SRE အဖွဲ့ မရှိသေးပါဘူး။ ဒီသင်တန်းရဲ့ လမ်းပြကတော့ Top-up ရဲ့ backend developer မသီရိပါ။
      CTO ကိုနေလင်းကတော့ feature တွေ မြန်မြန် ထုတ်ချင်ပြီး app ကလည်း 100 ရာခိုင်နှုန်း
      အလုပ်လုပ်နေစေချင်တဲ့သူပါ။ Wallet ရဲ့ product manager မနှင်းကတော့ business ဘက်ကို
