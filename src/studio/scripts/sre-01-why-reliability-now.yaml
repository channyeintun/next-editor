  - id: this-week
    narration: >
      [[mark:close-b4]] [[mark:p05]] ဒီအပတ်ထဲမှာ SRE အဖွဲ့နဲ့ tool အသစ် မလိုဘဲ လုပ်ကြည့်လို့ရတာ သုံးခု
      ရှိပါတယ်။ ပထမ၊ ကိုယ့်အဖွဲ့က အခုထိ အတိုး ပေးနေရတဲ့ ဖြတ်လမ်း သုံးခုကို စာရင်း ချရေးကြည့်ပါ။ ဒုတိယ၊
      ကိုယ့် service နှေးသွားရင် user ဘက်က ဘာ ခံစားရမလဲ ဆိုတာ အဖွဲ့ထဲမှာ မေးကြည့်ပါ။ တတိယ၊ တစ်ခုခု
      ပျက်ရင် အရင်ဆုံး ကာကွယ်ရမယ့် service တစ်ခုကို ရွေးထားပါ။
