build:
  # Studio swaps in the Burmese voice chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 2601

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: hook
    chapter: "သင်္ကြန် အကြိုည"
    narration: >
      [[mark:p01]] မင်္ဂလာပါ ခင်ဗျာ။ ဒီသင်တန်းမှာ user တွေ အားကိုးနေတဲ့ software ကို စိတ်ချရအောင်
      ဘယ်လို run ထားမလဲ ဆိုတာ အခြေခံကစ လေ့လာသွားပါမယ်။ သင်တန်း တစ်လျှောက်လုံး Padauk ဆိုတဲ့ ရန်ကုန်က
      စိတ်ကူးယဉ် fintech app တစ်ခုရဲ့ ဇာတ်လမ်းကို လိုက်ကြည့်ကြမှာပါ။ သင်္ကြန် အကြိုနေ့မှာ Padauk ရဲ့
      developer တစ်ယောက်က AI assistant နဲ့ rewards screen အသစ်ကို နေ့လယ် တစ်ခင်းတည်းနဲ့ ဆောက်ပြီး
      ထုတ်လိုက်ပါတယ်။ [[mark:p01b]] ဒါပေမဲ့ ညရောက်တော့ ဖုန်းဘေလ် ဖြည့်တဲ့ top-up တချို့ fail ဖြစ်တယ်၊
      တချို့က စက္ကန့် 40 လောက် စောင့်ရတယ်၊ ပိုဆိုးတာက တချို့ user တွေ ငွေ နှစ်ခါ ဖြတ်ခံလိုက်ရပါတယ်။
      Top-up ရဲ့ backend developer မသီရိကတော့ ပွဲတော်ညမှာ ငွေ ပြန်အမ်းရမယ့် user တွေကို တစ်ယောက်ချင်း
      လိုက်ရှာနေရပါတယ်။ ဒါဆို user တွေ မှတ်မိနေမှာက rewards screen အသစ်လေးလား၊ ငွေ နှစ်ခါ
      ဖြတ်ခံရတာလား?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book second edition (Google Cloud Blog)",
          url: "https://cloud.google.com/blog/products/devops-sre/sre-book-second-edition",
        }
    actions:
      # -1750 / -1450, not the skeleton's -1900 / -1600: a pull-back over 1780 ms pushes the
      # first dialog past the 2 s opening handle, which src/studio/plans/index.test.ts rejects.
      - { id: collapse-dock, type: runtime.collapseDock, at: { scene: start, offsetMs: -1750 } }
      - { id: show-p01, type: slide.show, at: { mark: p01, offsetMs: -1450 }, slideId: l01_p01 }
      - { id: show-p01b, type: slide.show, at: { mark: p01b }, slideId: l01_p01b }

  - id: hoping-vs-engineering
    narration: >
      [[mark:p02]] အဖြေကတော့ ငွေ နှစ်ခါ ဖြတ်ခံရတာပါ။ ဒီလို ဖြစ်ရတာက Padauk က ဘယ်ဘက်ခြမ်းမှာ ပြထားသလို
      မပျက်ဖို့ပဲ မျှော်လင့်ပြီး အလုပ်လုပ်နေလို့ပါ။ ပျက်မှ လိုက်ပြင်တယ်၊ ထုတ်ပြီးရင် ဆုတောင်းထားတယ်၊
      ပြဿနာ တက်ရင် ညဘက်မှာ hero တစ်ယောက်ယောက်က ကယ်ပေးလိမ့်မယ်လို့ အားကိုးထားတယ်။ ညာဘက်ခြမ်းကတော့
      engineering နဲ့ ထိန်းတဲ့ နည်းပါ။ user ခံစားရတာကို တိုင်းတယ်၊ ဘယ်လောက်ဆို လုံလောက်လဲ ဆိုတာ
      ကြိုသဘောတူထားတယ်၊ လူကို ပိုပင်ပန်းအောင် မလုပ်ဘဲ system ကို ပြောင်းလိုက်တယ်။ [[mark:p02b]]
      ဒီနည်းကို Site Reliability Engineering၊ အတိုကောက် SRE လို့ ခေါ်ပါတယ်။ SRE ဆိုတာ
      စက်အများကြီးပေါ်မှာ run နေတဲ့ service ကြီးတွေကို၊ သူတို့ကို အားကိုးနေတဲ့ user တွေအတွက်
      စိတ်ချရအောင် software ရေးပြီး ထိန်းပေးတဲ့ engineer တွေရဲ့ အလုပ်ပါ။ ဒီလို စိတ်ချရတာကို
      reliability လို့ ခေါ်ပါတယ်။ ဒီအလုပ်ကို DevOps engineer၊ platform engineer လို နာမည်
      အမျိုးမျိုးနဲ့ ခေါ်ကြပေမဲ့ လုပ်ရတာကတော့ အတူတူပါပဲ။ [[mark:p02c]] ပြီးတော့ ဒီလို system တွေထဲမှာ
      code နဲ့ server တွေ တင်မကဘဲ အဲဒါတွေကို run တဲ့ လူတွေ၊ အဖွဲ့တွေပါ ပါနေလို့ sociotechnical system
      လို့ ခေါ်ပါတယ်။ ဒါကြောင့် လူတွေက tool တွေနဲ့ တန်းတူ အရေးကြီးပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - { title: "SRE book, 1st ed: Foreword", url: "https://sre.google/sre-book/foreword/" }
      - { title: "SRE book, 1st ed: Preface", url: "https://sre.google/sre-book/preface/" }
    actions:
      - { id: show-p02, type: slide.show, at: { mark: p02 }, slideId: l01_p02 }
      - { id: show-p02b, type: slide.show, at: { mark: p02b }, slideId: l01_p02b }
      - { id: show-p02c, type: slide.show, at: { mark: p02c }, slideId: l01_p02c }

  - id: build-short-run-long
    chapter: "build နဲ့ run"
    narration: >
      [[mark:close-p02c]] [[mark:b1-step1]] ဒီ အပြာရောင် အကွက်လေးက rewards screen ကို build လုပ်ခဲ့တဲ့
      အချိန်ပါ၊ နေ့လယ် တစ်ခင်းပဲ ကြာပါတယ်။ [[mark:b1-step2]] ဒါပေမဲ့ ထုတ်လိုက်တဲ့ နေ့ကစပြီး run ရတဲ့
      အလုပ်က ဒီ ခရမ်းရောင် bar ရှည်ကြီးလိုပဲ နှစ်နဲ့ချီ ကြာပါတယ်။ [[mark:b1-step2b]] အဲဒီ နှစ်တွေမှာ
      monitoring လုပ်ရတယ်၊ ညသန်းခေါင် ပြဿနာ တက်ရင် on-call ကျနေတဲ့သူက ထဖြေရှင်းရတယ်၊ upgrade လုပ်ရတယ်၊
      data ကို ထိန်းရတယ်၊ user များလာရင် capacity တိုးရတယ်၊ မလိုတော့တဲ့ နေ့မှာလည်း ဘေးကင်းကင်း
      ပိတ်သိမ်းရပါတယ်။ လက်ဖက်ရည်ဆိုင် တစ်ဆိုင် ဖွင့်တာ တစ်ပတ်ပဲ ကြာပေမဲ့ နေ့တိုင်း ရောင်းရတာက
      နှစ်နဲ့ချီ ဖြစ်သလိုပါပဲ။ [[mark:b1-step3]] အခု AI ကြောင့် build လုပ်တာ မြန်ပြီး ဈေးပေါလာပေမဲ့
      run တာကတော့ ခက်တုန်းပါပဲ။ server တွေကို cloud ကနေ ငှားသုံးလာပေမဲ့ အလုပ်က ပျောက်မသွားဘဲ၊ ဘာကို
      ငှားမလဲ ရွေးတာ၊ ဘယ်လို config လုပ်မလဲ ဆုံးဖြတ်တာ၊ ငှားထားတဲ့ အပိုင်းတွေ ဘယ်လို ပျက်တတ်လဲ
      နားလည်တာဆီကို ရွှေ့သွားတာပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - { title: "SRE book, 1st ed: Preface", url: "https://sre.google/sre-book/preface/" }
      - {
          title: "SRE book second edition (Google Cloud Blog)",
          url: "https://cloud.google.com/blog/products/devops-sre/sre-book-second-edition",
        }
    actions:
      - { id: close-p02c, type: slide.close, at: { mark: close-p02c, offsetMs: -400 } }
      - {
          id: b1-step1,
          type: whiteboard.apply,
          at: { mark: b1-step1 },
          open: true,
          clear: true,
          upsertIds: [l01-b1-axis, l01-b1-build, l01-b1-build-label],
          drawMs: 1400,
        }
      - {
          id: b1-step2,
          type: whiteboard.apply,
          at: { mark: b1-step2 },
          upsertIds: [l01-b1-run, l01-b1-run-label],
          drawMs: 1400,
        }
      - {
          id: b1-step2b,
          type: whiteboard.apply,
          at: { mark: b1-step2b },
          upsertIds: [l01-b1-ops-1, l01-b1-ops-2, l01-b1-ops-3],
          drawMs: 2000,
        }
      - {
          id: b1-step3,
          type: whiteboard.apply,
          at: { mark: b1-step3 },
          upsertIds: [l01-b1-ai, l01-b1-hard],
          drawMs: 1600,
        }

  - id: padauk-loan
    chapter: "ဖြတ်လမ်းဆိုတာ အကြွေး"
    narration: >
      ဒါဆို ငွေ နှစ်ခါ ဖြတ်တဲ့ ပြဿနာက ဘယ်က စလာတာလဲ။ [[mark:b2-step1]] လအနည်းငယ် အရင်က Top-up အဖွဲ့က
      promo တစ်ခုကို အချိန်မီ ထုတ်နိုင်ဖို့ idempotency key ထည့်တာကို ချန်ထားခဲ့ပါတယ်။ ဒီ key က top-up
      တစ်ခုချင်းကို သီးသန့် နံပါတ် ပေးထားပြီး ပြန်ပို့ရင်လည်း အဲဒီ နံပါတ်ပဲ ပါလို့၊ ငွေကို တစ်ခါပဲ
      ဖြတ်ပါတယ်။ ဒီလို ဖြတ်လမ်းလိုက်တာက ချေးငွေ ယူလိုက်တာနဲ့ တူပါတယ်။ [[mark:b2-step1b]] promo က
      အချိန်မီ ထွက်သွားပေမဲ့ အတိုး စပေးရပါပြီ။ key မရှိတော့ တစ်ခါတလေ ငွေ နှစ်ခါ ဖြတ်မိလို့၊ မသီရိတို့
      အဖွဲ့က တနင်္လာနေ့တိုင်း လက်နဲ့ တိုက်စစ်ပြီး ငွေ ပြန်အမ်းရတာ 3 နာရီ ကြာပါတယ်။ [[mark:b2-step2]]
      လတွေ ကြာလာတော့ retry code ကို ထိရင် ဘာ ပျက်မလဲ မသိလို့ ဘယ်သူမှ မထိရဲတော့ပါဘူး၊ ဒါလည်း အတိုးပါပဲ။
      [[mark:b2-step2b]] ပြီးတော့ သင်္ကြန် အကြိုည peak အချိန်မှာ ဖုန်းကုမ္ပဏီ Operator B က
      နှေးသွားပါတယ်။ app က အဖြေ မရတော့ retry လုပ်ပါတယ်၊ key မပါတဲ့အတွက် Top-up service က retry
      တိုင်းကို top-up အသစ်လို့ ထင်ပြီး ငွေ ထပ်ဖြတ်လိုက်ပါတယ်။ ဒါက ဆပ်ရမယ့် နေ့ ရောက်လာတာပါ။
      [[mark:b2-step3]] တနင်္လာနေ့ အလုပ်ကလည်း 3 နာရီကနေ 6 နာရီအထိ ဘယ်သူမှ သတိမထားမိဘဲ တိတ်တိတ်လေး
      တိုးလာခဲ့ပါတယ်။ developer တွေက ဒီလို အကြွေးကို technical debt လို့ ခေါ်ပါတယ်။ ဖြတ်လမ်းက ချေးတာ၊
      လက်နဲ့ ပြင်ရတဲ့ အချိန်နဲ့ code ကို ထိရမှာ ကြောက်တာက အတိုး၊ outage က ဆပ်ရမယ့် နေ့ပါ။ ဆပ်ရမယ့် နေ့
      နောက်တစ်မျိုးလည်း ရှိပါသေးတယ်၊ ကြောက်လွန်းလို့ ဘယ်သူမှ deploy မလုပ်ရဲတော့တဲ့ နေ့ပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - { title: "SRE book, 1st ed: Preface", url: "https://sre.google/sre-book/preface/" }
      - { title: "20 Years of SRE at Google", url: "https://sre.google/20/" }
    actions:
      - {
          id: b2-step1,
          type: whiteboard.apply,
          at: { mark: b2-step1 },
          open: true,
          clear: true,
          upsertIds: [l01-b2-axis, l01-b2-tick-promo, l01-b2-promo, l01-b2-key],
          drawMs: 1800,
        }
      - {
          id: b2-step1b,
          type: whiteboard.apply,
          at: { mark: b2-step1b },
