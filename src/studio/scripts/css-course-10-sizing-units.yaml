# CSS course (Burmese), lesson 10 of 43: units and sizing.
#
# Narration is Burmese (voice-script.md next to this file is its source;
# DESIGN.md is the span-by-span brief). Every [[mark:…]] sits where its action
# begins, at a sentence end; each span carries one piece of meaning.
# Everything the learner sees (title, chapters, whiteboard labels, UI strings)
# is Burmese already.
#
# Shape: board (recall lesson 9; three kinds of value: number, percentage,
# length; absolute vs relative; the unitless zero) → code tour (index.html:
# the sale stamp, the about story, the new nested sweetness levels, the
# sold-out card; empty styles.css) → opacity 0.5 on the sold-out card →
# line height 16px crowds the Burmese story, a plain 1.8 lets it breathe →
# board (a pixel line height is inherited as a length, a number as a number)
# → board (a percentage of what?) → the first snack card at width 50%, a
# surprise padding-top 25% (from the list's WIDTH), height 50% does nothing →
# board (absolute ladder, px as a reference pixel, the relative units) → em
# compounds down the nested levels, board (16 → 19.2 → 23.04 → 27.65 vs rem
# flat 19.2), rem makes them equal → em padding on the stamp grows with its
# font size; rem and the reader's text-size setting → max-width 30ch on the
# story; lh, ex, cap, ic and the root units named → min-height 100vh fills the
# preview (the preview IS the viewport) → board (svh / lvh / dvh on a phone),
# then min-height 100svh typed under the 100vh (later wins; no change on a
# desktop) → board (angles, time, resolution, container units), quiz (question
# first, answer after a pause) → recap, hand-off to custom properties (lesson 11).
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set(; no postcss config; no reload.
# Mid-typing prefixes: a line height or opacity typed keystroke by keystroke
# passes through valid unitless numbers ("line-height: 1" = 16px, "2" = twice
# the font, "opacity: 0" = invisible), so those three declarations are typed
# line-by-line (each line lands whole). Every keystroke-typed value has no
# misleading valid prefix (unitless "width: 50", "font-size: 1.2", "min-height:
# 100" are invalid and ignored).
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
