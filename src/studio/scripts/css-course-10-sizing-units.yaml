build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 4110

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  - id: recall-values
    chapter: "CSS တန်ဖိုး အမျိုးအစားတွေ"
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ အရောင်ကို ပုံစံ အမျိုးမျိုးနဲ့ ရေးခဲ့ပြီး၊ ဖောက်ထွင်း မြင်ရအောင် လုပ်တဲ့
      alpha လို တန်ဖိုးတွေကို ဂဏန်း ဒါမှမဟုတ် ရာခိုင်နှုန်းနဲ့ ရေးခဲ့ပါတယ်။ [[mark:start-server]]
      ဒီလို ပြောနေတုန်းမှာပဲ၊ board နောက်မှာ dev server ကို စနေပါပြီ။ [[mark:draw-types]] ဒီနေ့
      အရွယ်အစားတွေ အကြောင်းပါ။ CSS မှာ ရေးတဲ့ အရွယ်အစား တိုင်းက တန်ဖိုး သုံးမျိုးထဲက တစ်မျိုးပါ။
      [[mark:draw-number]] ပထမက 1.8 လို unit မပါတဲ့ ဂဏန်းပါ။ unit က ဂဏန်းကို ဘာနဲ့ တိုင်းလဲ ပြပါတယ်။
      unit မပါတော့ အဓိပ္ပာယ်ကို property က ပေးပါတယ်။ [[mark:draw-percent]] ဒုတိယက ရာခိုင်နှုန်းပါ။
      ရာခိုင်နှုန်းက တခြား တစ်ခုခုရဲ့ အစိတ်အပိုင်း အမြဲ ဖြစ်ပြီး၊ ဘာရဲ့ အစိတ်အပိုင်းလဲ ဆိုတာ property
      ပေါ် မူတည်ပါတယ်။ [[mark:draw-length]] တတိယက length ပါ။ 16 pixel လိုမျိုး ဂဏန်းနောက်မှာ unit
      ကပ်ပါနေတဲ့ တန်ဖိုးပါ။ unit ပါတဲ့ ဂဏန်းကို dimension လို့ ခေါ်ပြီး၊ အကွာအဝေးကို တိုင်းတဲ့
      dimension တွေကို length လို့ ခေါ်ပါတယ်။ [[mark:draw-abs-rel]] length တွေမှာ အုပ်စု နှစ်စု
      ရှိပါတယ်။ absolute unit က ပုံသေ ဖြစ်လို့ ဘယ်နေရာမှာ မဆို အရွယ် တူပါတယ်။ relative unit ကတော့ font
      size ဒါမှမဟုတ် window ရဲ့ အရွယ်အစားလို တခြား တစ်ခုခုကို အခြေခံပြီး ပြောင်းပါတယ်။
      [[mark:draw-zero]] သုညကတော့ ဘယ် unit နဲ့ ရေးရေး အတူတူ
      ဖြစ်လို့ unit မလိုပါဘူး။ ကျန်တဲ့ length တိုင်းမှာတော့ unit ပါရပြီး၊ မပါရင် browser က အဲဒီ
      declaration ကို ကျော်သွားပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Sizing units"
        url: "https://web.dev/learn/css/sizing"
      - title: "web.dev Learn CSS — Sizing units: dimensions and lengths"
        url: "https://web.dev/learn/css/sizing#dimensions-and-lengths"
      - title: "MDN — CSS values and units"
        url: "https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Styling_basics/Values_and_units"
      - title: "MDN — <length> (unitless zero)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/length"
    actions:
      - id: open-values-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      # Runs in the background (boot + pnpm install + spawn); waitForReady sits
      # on the preview mark in the next scene, well over 40 s of narration
      # later.
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 45000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-number
        type: whiteboard.apply
        at: { mark: draw-number }
        upsertIds: [a-num, a-num-label]
        drawMs: 1200
      - id: draw-percent
        type: whiteboard.apply
        at: { mark: draw-percent }
        upsertIds: [a-pct, a-pct-label]
        drawMs: 1200
      - id: draw-length
        type: whiteboard.apply
        at: { mark: draw-length }
        upsertIds: [a-len, a-len-underline, a-len-label]
        drawMs: 1800
      - id: draw-abs-rel
        type: whiteboard.apply
        at: { mark: draw-abs-rel }
        upsertIds: [a-abs, a-rel]
        drawMs: 3000
      - id: draw-zero
        type: whiteboard.apply
        at: { mark: draw-zero }
        upsertIds: [a-zero-ok, a-zero-bad, a-zero-note]
        drawMs: 2400

  - id: code-tour
    narration: >
      [[mark:close-values]] project ကို ကြည့်ရအောင်။ [[mark:open-index]] HTML က လက်ဖက်ရည်ဆိုင်
      အတိုင်းပါပဲ။ အပေါ်ဆုံးမှာ ကြိုဆိုတဲ့ အပိုင်း ရှိပါတယ်။ [[mark:select-stamp]] အဲဒီ အပိုင်းထဲမှာ
      ရွှေရောင် ဈေးလျှော့ တံဆိပ်လေး ရှိပါတယ်။ [[mark:select-story]] သူ့အောက်က ဆိုင်အကြောင်း အပိုင်းမှာ စာပိုဒ် အရှည် တစ်ခု
      ရှိပါတယ်။ line height နဲ့ စာကြောင်း အရှည်ကို ဒီ စာပိုဒ်နဲ့ ကြည့်ပါမယ်။ [[mark:select-levels]]
      နောက်မှာ အချို အဆင့် list အသစ် ပါလာပါတယ်။ လက်ဖက်ရည်၊ ချိုဆိမ့်၊ ပိုချို ဆိုပြီး တစ်ခုထဲမှာ တစ်ခု
      သုံးဆင့် ဆင့်ထားပါတယ်။ font ကို အခြေခံတဲ့ unit တွေ ဘယ်လို ကွာလဲ ဆိုတာ ဒီ list မှာ မြင်ရပါမယ်။
      [[mark:select-sold-out]] စားစရာ menu ရဲ့ နောက်ဆုံး card ကတော့ ကုန်သွားတဲ့ ရှမ်းခေါက်ဆွဲပါ။
      [[mark:open-styles]] ကိုယ့် CSS ဖိုင်က အလွတ်ပါ။ ဆိုင်ရဲ့ အရောင်တွေနဲ့ card တွေကို base ဖိုင်က
      ပေးထားပေမယ့်၊ ဆိုင်အကြောင်း စာပိုဒ်ရဲ့ line height နဲ့ ကုန်သွားတဲ့ card ကို မှိန်အောင် လုပ်တာကိုတော့
      ဒီနေ့ ကိုယ်တိုင် ရေးမှာမို့ ချန်ထားပါတယ်။ [[mark:preview-opens]] dev server အသင့် ဖြစ်လို့ preview
      ပွင့်လာပါပြီ။
    sources:
      - title: "web.dev Learn CSS — Sizing units"
        url: "https://web.dev/learn/css/sizing"
      - title: "MDN — <ul>: the Unordered List element (nested lists)"
        url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Element/ul"
    actions:
      - id: close-values-board
        type: whiteboard.apply
        at: { mark: close-values }
        open: false
      - id: open-index
        type: workspace.openFile
        at: { mark: open-index }
        path: index.html
      - id: select-stamp
        type: editor.select
        at: { mark: select-stamp }
        target:
          {
            file: index.html,
            text: '<span class="stamp" data-testid="stamp">ဈေးလျှော့</span>',
            occurrence: 1,
          }
      - id: select-story
        type: editor.select
        at: { mark: select-story }
        target: { file: index.html, text: '<p class="story" data-testid="story">', occurrence: 1 }
      - id: select-levels
        type: editor.select
        at: { mark: select-levels }
        target:
          {
            file: index.html,
            text: "<li>လက်ဖက်ရည်\n            <ul>\n              <li>ချိုဆိမ့်\n                <ul>\n                  <li data-testid=\"level-3\">ပိုချို</li>",
            occurrence: 1,
          }
      - id: select-sold-out
        type: editor.select
        at: { mark: select-sold-out }
        target:
          {
            file: index.html,
            text: '<li class="menu-card sold-out" data-testid="card-shan-noodles">',
            occurrence: 1,
          }
      - id: open-styles
        type: workspace.openFile
        at: { mark: open-styles }
        path: styles.css
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { mark: preview-opens }
        timeoutMs: 20000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-dev-server }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-hero
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: hero }
        textContains: "မင်္ဂလာပါ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-story
        type: expect.preview
        at: { afterAction: expect-hero }
        timeoutMs: 5000
        target: { by: testId, value: story }
        textContains: "ဗဟန်း"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: collapse-runner-dock
        type: runtime.collapseDock
        at: { afterAction: expect-story }

  - id: plain-numbers
    chapter: "Unit မပါတဲ့ ဂဏန်း"
    narration: >
      [[mark:scroll-sold-out]] အောက်ဆုံးက ကုန်သွားတဲ့ card နဲ့ unit မပါတဲ့ ဂဏန်းကို စကြည့်ရအောင်။
      [[mark:type-opacity]] သူ့ opacity ကို တစ်ဝက် ပေးပါမယ်။ opacity က သုညကနေ တစ်အထိ ဂဏန်းကို ယူပြီး၊
      သုည ဆိုရင် လုံးဝ မမြင်ရဘဲ၊ တစ် ဆိုရင် အပြည့် မြင်ရပါတယ်။ [[mark:after-opacity]] ကုန်သွားတဲ့ card
      က တစ်ဝက်လောက် ဖောက်ထွင်း မြင်ရပါပြီ။ ဖတ်လို့ ရနေသေးပေမယ့်၊ မှာလို့ မရတော့ဘူး ဆိုတာ
      သိသာပါတယ်။ [[mark:other-numbers]] ဒီ တစ်ဝက် ဆိုတဲ့ ဂဏန်းလိုပဲ၊ တခြား property တွေကလည်း unit
      မပါတဲ့ ဂဏန်းကို ယူပြီး အဓိပ္ပာယ် ကိုယ်စီ ရှိပါတယ်။ scale 1.2 က 20 ရာခိုင်နှုန်း ပိုကြီးစေပြီး၊
      z-index 2 က 1 ရဲ့ အပေါ်မှာ ထပ်ပါတယ်။ font weight 700 ကတော့ စာလုံးထူပါ။
    sources:
      - title: "web.dev Learn CSS — Sizing units: numbers"
        url: "https://web.dev/learn/css/sizing#numbers"
      - title: "MDN — <number>"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/number"
      - title: "MDN — opacity"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/opacity"
    actions:
      # Was 5000: the page is 1330 px tall here, so a preview up to about 828
      # px high reaches 500; a larger target is clamped and the gate finds no
      # recorded command.
      - id: scroll-sold-out
        type: preview.scroll
        at: { mark: scroll-sold-out }
        timeoutMs: 5000
        top: 500
        retry: { maxAttempts: 2, delayMs: 250 }
      # line-by-line: keystroke typing would pass through "opacity: 0"
      # (the card vanishes for a keystroke).
      - id: type-opacity
        type: editor.type
        at: { mark: type-opacity }
        cadence: line-by-line
        target: { file: styles.css, after: "", occurrence: 1 }
        text: ".sold-out {\n  opacity: 0.5;\n}\n"
      - id: expect-sold-out
        type: expect.preview
        at: { mark: after-opacity }
        timeoutMs: 4000
        target: { by: testId, value: card-shan-noodles }
        textContains: "ကုန်သွားပြီ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-opacity
        type: editor.select
        at: { mark: other-numbers }
        target: { file: styles.css, text: "0.5", occurrence: 1 }

  - id: line-height
    narration: >
      [[mark:scroll-story]] unit မပါတဲ့ ဂဏန်း အသုံးအဝင်ဆုံး နေရာက line height ပါ။ line height ဆိုတာ
      စာကြောင်း တစ်ကြောင်းစီရဲ့ အမြင့်ပါ။ အခု စာပိုဒ်က browser ရဲ့ ပုံမှန် line height ကို သုံးနေပြီး၊
      အဲဒါက font ပေါ် မူတည်ပါတယ်။ [[mark:type-lh-px]] အရင်ဆုံး ဒီ စာပိုဒ်ကို line height 16 pixel
      ပုံသေ ပေးကြည့်ပါမယ်။ သူ့ font size နဲ့ အတူတူပါ။ [[mark:after-lh-px]] စာကြောင်းတွေ ကပ်သွားပါပြီ။
      မြန်မာစာမှာ စာလုံးရဲ့ အပေါ်နဲ့ အောက်မှာ သင်္ကေတတွေ ဆင့်ပါတတ်လို့၊ နေရာ အပို မရှိရင်
      စာကြောင်းချင်း ထပ်သွားပါတယ်။ [[mark:type-lh-num]] အခု အောက်မှာ unit မပါတဲ့ ဂဏန်းနဲ့ line height
      ထပ်ထည့်ပါမယ်။ နောက်မှ ရေးတဲ့ declaration က နိုင်ပါတယ်။ [[mark:after-lh-num]] စာကြောင်းတွေ
      ပြန်ချောင်ပါပြီ။ [[mark:select-lh-num]] ဒီ line height ကို ကြည့်ပါ။ unit မပါတဲ့ ဂဏန်းက font size
      နဲ့ မြှောက်ရမယ့် အဆပါ။ 16 pixel ရဲ့ 1.8 ဆ ဆိုတော့ တစ်ကြောင်းကို 29 pixel နီးပါး ရပါတယ်။
      အင်္ဂလိပ်စာအတွက် တစ်ဆခွဲလောက် လုံလောက်ပေမယ့်၊ မြန်မာစာက ပိုလိုပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Typography: line height"
        url: "https://web.dev/learn/css/typography#line-height"
      - title: "MDN — line-height"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/line-height"
      - title: "MDN — Fundamental text and font styling"
        url: "https://developer.mozilla.org/docs/Learn_web_development/Core/Text_styling/Fundamentals"
    actions:
      - id: scroll-story
        type: preview.scroll
        at: { mark: scroll-story }
        timeoutMs: 5000
        top: 0
        retry: { maxAttempts: 2, delayMs: 250 }
      # line-by-line: a keystroke-typed "line-height: 16px" passes through
      # "1" (16px) and "16" (sixteen times the font size).
      - id: type-lh-px
        type: editor.type
        at: { mark: type-lh-px }
        cadence: line-by-line
        target: { file: styles.css, after: "  opacity: 0.5;\n}\n", occurrence: 1 }
        text: "\n.about p {\n  line-height: 16px;\n}\n"
      - id: type-lh-num
        type: editor.type
        at: { mark: type-lh-num }
        cadence: line-by-line
        target: { file: styles.css, after: "  line-height: 16px;\n", occurrence: 1 }
        text: "  line-height: 1.8;\n"
      - id: expect-story-lh
        type: expect.preview
        at: { mark: after-lh-num }
        timeoutMs: 4000
        target: { by: testId, value: story }
        textContains: "ပလာတာ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-lh-num
        type: editor.select
        at: { mark: select-lh-num }
        target: { file: styles.css, text: "  line-height: 1.8;", occurrence: 1 }

  - id: line-height-board
    narration: >
      [[mark:open-lh-board]] ဒါဆို ဘာလို့ length မဟုတ်ဘဲ unit မပါတဲ့ ဂဏန်းကို သုံးကြတာလဲ။ line height
      က inherit ဖြစ်ပြီး၊ length နဲ့ ဂဏန်းက inherit ဖြစ်ပုံ မတူလို့ပါ။ [[mark:draw-lh-px]] parent မှာ
      line height 16 pixel ပေးထားရင်၊ child တွေက အဲဒီ length ကိုပဲ inherit ဖြစ်ပါတယ်။ ဒါကြောင့် အထဲက
      ခေါင်းစဉ် စာလုံးကြီးလည်း တစ်ကြောင်းကို 16 pixel ပဲ ရလို့၊ နှစ်ကြောင်း ဖြစ်ရင် စာကြောင်းတွေ
      ထပ်ကုန်ပါတယ်။ [[mark:draw-lh-num]] unit မပါတဲ့ ဂဏန်းကတော့ ဂဏန်းအတိုင်းပဲ inherit ဖြစ်ပါတယ်။
      ခေါင်းစဉ်က အဲဒီ ဂဏန်းကို သူ့ font size နဲ့ ပြန်မြှောက်လို့၊ စာလုံး ကြီးရင် စာကြောင်း မြင့်ပြီး၊
      သေးရင် နိမ့်ပါတယ်။ [[mark:draw-lh-also]] line height ကို ရာခိုင်နှုန်း ဒါမှမဟုတ် font size ကို
      အခြေခံတဲ့ em နဲ့ ပေးရင်လည်း pixel လိုပါပဲ။ parent မှာ တွက်ပြီးမှ ရောက်လို့ child တွေက ပုံသေ
      length ပဲ ရပါတယ်။ ဒါကြောင့် unit မပါတဲ့ ဂဏန်းကို ရွေးကြတာပါ။
    sources:
      - title: "web.dev Learn CSS — Sizing units: numbers (unitless line-height)"
        url: "https://web.dev/learn/css/sizing#numbers"
      - title: "MDN — line-height: prefer unitless numbers"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/line-height#prefer_unitless_numbers_for_line-height_values"
      - title: "CSS Inline Layout Module Level 3 — line-height"
        url: "https://www.w3.org/TR/css-inline-3/#line-height-property"
    actions:
      - id: open-lh-board
        type: whiteboard.apply
        at: { mark: open-lh-board }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-lh-px
        type: whiteboard.apply
        at: { mark: draw-lh-px }
        upsertIds: [b-px-head, b-px-arrow, b-px-child, b-px-line1, b-px-line2, b-px-note]
        drawMs: 3600
      - id: draw-lh-num
        type: whiteboard.apply
        at: { mark: draw-lh-num }
        upsertIds: [b-num-head, b-num-arrow, b-num-child, b-num-calc, b-num-note]
        drawMs: 3200
      - id: draw-lh-also
        type: whiteboard.apply
        at: { mark: draw-lh-also }
        upsertIds: [b-also]
        drawMs: 1600

  - id: percent-board
    chapter: "ဘာရဲ့ ရာခိုင်နှုန်းလဲ"
    narration: >
      [[mark:open-percent]] အခု ရာခိုင်နှုန်းကို ကြည့်ရအောင်။ ရေးတိုင်း ဘာရဲ့ ရာခိုင်နှုန်းလဲ လို့
      အရင် မေးကြည့်ပါ။ [[mark:draw-pct-width]] အကျယ်အတွက်ဆိုရင် parent ရဲ့ content အကျယ်ပါ။ 50
      ရာခိုင်နှုန်း ဆိုတာ parent ပေးထားတဲ့ နေရာရဲ့ တစ်ဝက်ပါ။ [[mark:draw-pct-pad]] padding နဲ့ margin
      အတွက်လည်း parent ရဲ့ အကျယ်ပါပဲ။ အပေါ်နဲ့ အောက်မှာတောင် အကျယ်ကိုပဲ ယူတာကို လူအများစု
      မထင်ထားကြပါဘူး။ [[mark:draw-pct-height]] အမြင့်ကတော့ parent ရဲ့ အမြင့်ပါ။ ဒါပေမဲ့ parent ရဲ့
      အမြင့်ကို ပုံသေ ပေးထားမှ ရပါတယ်။ [[mark:draw-pct-translate]] translate နဲ့ element ကို
      ရွှေ့တဲ့အခါမှာတော့ ရာခိုင်နှုန်းက element ကိုယ်တိုင်ရဲ့ အရွယ်အစားကနေ တွက်ပါတယ်။
      [[mark:draw-pct-font]] font size ကို ရာခိုင်နှုန်းနဲ့ ပေးရင်တော့ parent ရဲ့ font size ကနေ
      တွက်ပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Sizing units: percentages"
        url: "https://web.dev/learn/css/sizing#percentages"
      - title: "MDN — <percentage>"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/percentage"
      - title: "MDN — padding (percentages refer to the containing block's width)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/padding"
      - title: "MDN — height (percentages need a definite containing-block height)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/height"
    actions:
      - id: open-percent
        type: whiteboard.apply
        at: { mark: open-percent }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-pct-width
        type: whiteboard.apply
        at: { mark: draw-pct-width }
        upsertIds: [c-width-k, c-width-v]
        drawMs: 1500
      - id: draw-pct-pad
        type: whiteboard.apply
        at: { mark: draw-pct-pad }
        upsertIds: [c-pad-k, c-pad-v, c-pad-circle]
        drawMs: 2600
      - id: draw-pct-height
        type: whiteboard.apply
        at: { mark: draw-pct-height }
        upsertIds: [c-height-k, c-height-v]
        drawMs: 2000
      - id: draw-pct-translate
        type: whiteboard.apply
        at: { mark: draw-pct-translate }
        upsertIds: [c-tr-k, c-tr-v]
        drawMs: 1600
      - id: draw-pct-font
        type: whiteboard.apply
        at: { mark: draw-pct-font }
        upsertIds: [c-fs-k, c-fs-v]
        drawMs: 1600

  - id: percent-live
    narration: >
      [[mark:close-percent]] ဒီ အချက်တွေကို ပထမ စားစရာ card ပေါ်မှာ စမ်းကြည့်ရအောင်။
      [[mark:type-width]] lesson 4 မှာ တွေ့ခဲ့တဲ့ first-child နဲ့ list ထဲက ပထမဆုံး card ကို ရွေးပြီး၊
      အကျယ် 50 ရာခိုင်နှုန်း ပေးပါမယ်။
      [[mark:after-width]] မုန့်ဟင်းခါး card က list ရဲ့ တစ်ဝက်အထိ ကျဉ်းသွားပါပြီ။ [[mark:type-padtop]]
      အခု အပေါ်ဘက် padding 25 ရာခိုင်နှုန်း ထည့်ပါမယ်။ [[mark:after-padtop]] card က အများကြီး
      မြင့်လာပြီး၊ နာမည်ရဲ့ အပေါ်မှာ နေရာလွတ် ပေါ်လာပါပြီ။ [[mark:select-padtop]] ဒီ padding ကို
      ကြည့်ပါ။ အဲဒီ နေရာလွတ်က card ရဲ့ အမြင့်ကနေ တွက်တာ မဟုတ်ဘဲ၊ list အကျယ်ရဲ့ လေးပုံ တစ်ပုံပါ။ padding
      ရာခိုင်နှုန်းက အမြဲ အကျယ်ကို လိုက်လို့ပါ။ [[mark:type-height]] နောက်ဆုံး အမြင့် 50
      ရာခိုင်နှုန်းပါ။ [[mark:after-height]] ဘာမှ မပြောင်းပါဘူး။ list ရဲ့ အမြင့်က card တွေကနေ လာလို့၊
      တစ်ဝက် ယူစရာ ပုံသေ အမြင့် မရှိပါဘူး။ ဒါကြောင့် browser က ဒီ အမြင့်ကို auto လိုပဲ တွက်လိုက်ပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Sizing units: percentages"
        url: "https://web.dev/learn/css/sizing#percentages"
      - title: "MDN — width"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/width"
      - title: "MDN — padding-top"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/padding-top"
      - title: "CSS Box Sizing Module Level 3 — percentage sizes"
        url: "https://www.w3.org/TR/css-sizing-3/#percentage-sizing"
    actions:
      - id: close-percent
        type: whiteboard.apply
        at: { mark: close-percent }
        open: false
      # Was 579: the page is 1305 px tall here, so a preview up to about 828
      # px high reaches 475; a larger target is clamped and the gate finds no
      # recorded command.
      - id: scroll-snacks
        type: preview.scroll
        at: { mark: close-percent, offsetMs: 300 }
        timeoutMs: 5000
        top: 475
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-width
        type: editor.type
        at: { mark: type-width }
        cadence: fast-explainer
        target: { file: styles.css, after: "  line-height: 1.8;\n}\n", occurrence: 1 }
        text: "\n.menu-card:first-child {\n  width: 50%;\n}\n"
      - id: expect-first-card
        type: expect.preview
        at: { mark: after-width }
        timeoutMs: 4000
        target: { by: testId, value: card-mohinga }
        textContains: "မုန့်ဟင်းခါး"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-padtop
        type: editor.type
        at: { mark: type-padtop }
        cadence: natural
        target: { file: styles.css, after: "  width: 50%;\n", occurrence: 1 }
        text: "  padding-top: 25%;\n"
      - id: select-padtop
        type: editor.select
        at: { mark: select-padtop }
        target: { file: styles.css, text: "  padding-top: 25%;", occurrence: 1 }
      - id: type-height
        type: editor.type
        at: { mark: type-height }
        cadence: natural
        target: { file: styles.css, after: "  padding-top: 25%;\n", occurrence: 1 }
        text: "  height: 50%;\n"

  - id: lengths-board
    chapter: "Absolute unit နဲ့ relative unit"
    narration: >
      [[mark:open-lengths]] အခု length တွေကို ကြည့်ရအောင်။ ဘယ်ဘက်က absolute unit တွေနဲ့ စပါမယ်။
      [[mark:draw-ladder]] သူတို့ အားလုံးကြားမှာ အချိုး ပုံသေ ရှိပါတယ်။ 1 inch က 96 pixel၊ 2.54
      centimetre၊ 72 point၊ 6 pica နဲ့ ညီပါတယ်။ millimetre က centimetre ရဲ့ ဆယ်ပုံ တစ်ပုံ၊ Q unit က
      millimetre ရဲ့ လေးပုံ တစ်ပုံပါ။ [[mark:draw-print]] ဒါပေမဲ့ screen ပေါ်က CSS centimetre က
      ပေတံနဲ့ တိုင်းရင် တကယ့် centimetre မဟုတ်ပါဘူး။ ဒါကြောင့် centimetre၊ inch၊ point တွေကို print
      ထုတ်တဲ့အခါမှာ အဓိက သုံးပါတယ်။ [[mark:draw-px-note]] screen အတွက် absolute unit က pixel ပါ။ CSS
      pixel က screen ရဲ့ အစက် တစ်စက် မဟုတ်ဘဲ၊ တိုင်းဖို့ သတ်မှတ်ထားတဲ့ အရွယ်အစားပါ။ ပြတ်သားတဲ့ ဖုန်း
      screen မှာ CSS pixel တစ်ခုက ဘေးတိုက်ရော ဒေါင်လိုက်ပါ တကယ့် အစက် နှစ်စက်၊ သုံးစက်စီ ဖုံးပါတယ်။
      [[mark:draw-relative]] ညာဘက်မှာတော့ relative unit တွေ ရှိပြီး၊ တစ်ခုစီက တခြား တစ်ခုခုကနေ
      တိုင်းပါတယ်။ em က font size ကနေ၊ rem က root ရဲ့ font size ကနေ၊ ch က သုည ဂဏန်းရဲ့ အကျယ်ကနေ၊
      viewport unit တွေကတော့ window ကနေ တိုင်းပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Sizing units: absolute lengths"
        url: "https://web.dev/learn/css/sizing#absolute-lengths"
      - title: "web.dev Learn CSS — Sizing units: relative lengths"
        url: "https://web.dev/learn/css/sizing#relative-lengths"
      - title: "CSS Values and Units Module Level 4 — absolute lengths"
        url: "https://www.w3.org/TR/css-values-4/#absolute-lengths"
      - title: "MDN — <length>"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/length"
    actions:
      - id: open-lengths
        type: whiteboard.apply
        at: { mark: open-lengths }
        open: true
        clear: true
        upsertIds: [d-title, d-abs-head]
      - id: draw-ladder
        type: whiteboard.apply
        at: { mark: draw-ladder }
        upsertIds: [d-l1, d-l2, d-l3, d-l4]
        drawMs: 4000
      - id: draw-print
        type: whiteboard.apply
        at: { mark: draw-print }
        upsertIds: [d-print]
        drawMs: 1600
      - id: draw-px-note
        type: whiteboard.apply
        at: { mark: draw-px-note }
        upsertIds: [d-px]
        drawMs: 1600
      - id: draw-relative
        type: whiteboard.apply
        at: { mark: draw-relative }
        upsertIds: [d-rel-head, d-r1, d-r2, d-r3, d-r4]
        drawMs: 4500

  - id: em-rem
    chapter: "Em နဲ့ rem"
    narration: >
      [[mark:close-lengths]] အချို အဆင့် list ပေါ်မှာ em နဲ့ စကြည့်ရအောင်။ [[mark:type-em]] item
      တိုင်းကို font size 1.2 em ပေးပါမယ်။ em က font size ကို အခြေခံတဲ့ unit ပါ။ font size မှာဆို 1 em
      က parent ရဲ့ font size ပါ။ [[mark:after-em]] အဆင့် တစ်ခုစီက သူ့ အပေါ်က အဆင့်ထက် ကြီးလာပြီး၊
      အောက်ဆုံးက ပိုချိုက အကြီးဆုံး ဖြစ်နေပါတယ်။ [[mark:open-em-board]] ဘာကြောင့်လဲ။
      [[mark:draw-em-tree]] page ရဲ့ font size က 16 pixel နဲ့ စပါတယ်။ ပထမ အဆင့်က အဲဒီရဲ့ 1.2 ဆ၊ 19
      pixel လောက်ပါ။ ဒုတိယ အဆင့်ရဲ့ parent က ပထမ အဆင့် ဖြစ်လို့၊ 19 ရဲ့ 1.2 ဆ၊ 23 လောက်ပါ။ တတိယ အဆင့်က
      ထပ်ကြီးပြီး 28 နီးပါး ဖြစ်ပါတယ်။ ဆိုတော့ em က အဆင့်တိုင်းမှာ ထပ်ထပ် မြှောက်သွားတာပါ။
      [[mark:draw-rem-col]] rem ကတော့ root em ကို ဆိုလိုပါတယ်။ root element ဖြစ်တဲ့ html element ရဲ့
      font size ကနေ အမြဲ တိုင်းလို့၊ 1.2 rem က ဘယ် အဆင့်မှာ မဆို 19 pixel လောက်ပဲ ရပါတယ်။
      [[mark:close-em-board]] rem ကို em ရဲ့ အောက်မှာ ထည့်ကြည့်ရအောင်။ [[mark:type-rem]] font size ကို
      1.2 rem ထပ်ပေးပါမယ်။ [[mark:after-rem]] အခု အဆင့် သုံးဆင့်လုံး အရွယ် တူသွားပါပြီ။ ဘယ်လောက်
      နက်နက် ဆင့်ထားထား rem က မပြောင်းပါဘူး။
    sources:
      - title: "web.dev Learn CSS — Sizing units: font-size-relative units"
        url: "https://web.dev/learn/css/sizing#font-size-relative-units"
      - title: "web.dev Learn CSS — Typography: font-size"
        url: "https://web.dev/learn/css/typography#font-size"
      - title: "MDN — <length>: em and rem"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/length#relative_length_units_based_on_font"
    actions:
      - id: close-lengths
        type: whiteboard.apply
        at: { mark: close-lengths }
        open: false
      - id: scroll-levels
        type: preview.scroll
        at: { mark: close-lengths, offsetMs: 300 }
        timeoutMs: 5000
        top: 412
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-em
        type: editor.type
        at: { mark: type-em }
        cadence: fast-explainer
        target: { file: styles.css, after: "  height: 50%;\n}\n", occurrence: 1 }
        text: "\n.levels li {\n  font-size: 1.2em;\n}\n"
      - id: expect-levels
        type: expect.preview
        at: { mark: after-em }
        timeoutMs: 4000
        target: { by: testId, value: level-3 }
        textContains: "ပိုချို"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: open-em-board
        type: whiteboard.apply
        at: { mark: open-em-board }
        open: true
        clear: true
        upsertIds: [e-title, e-root]
      - id: draw-em-tree
        type: whiteboard.apply
        at: { mark: draw-em-tree }
        upsertIds: [e-em-head, e-lv-1, e-em-1, e-lv-2, e-em-2, e-lv-3, e-em-3, e-em-note]
        drawMs: 5600
      - id: draw-rem-col
        type: whiteboard.apply
        at: { mark: draw-rem-col }
        upsertIds: [e-rem-head, e-rem-1, e-rem-2, e-rem-3, e-rem-note]
        drawMs: 3200
      - id: close-em-board
        type: whiteboard.apply
        at: { mark: close-em-board }
        open: false
      - id: type-rem
        type: editor.type
        at: { mark: type-rem }
        cadence: natural
        target: { file: styles.css, after: "  font-size: 1.2em;\n", occurrence: 1 }
        text: "  font-size: 1.2rem;\n"
      - id: expect-levels-rem
        type: expect.preview
        at: { mark: after-rem }
        timeoutMs: 4000
        target: { by: testId, value: levels }
        textContains: "ချိုဆိမ့်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: em-padding
    narration: >
      [[mark:scroll-top]] ဒါဆို em က ပြဿနာပဲလား။ မဟုတ်ပါဘူး။ font size မဟုတ်တဲ့ property မှာ 1 em က
      element ကိုယ်ပိုင် font size ဖြစ်လို့ အသုံးဝင်ပါတယ်။ [[mark:type-stamp]] ဈေးလျှော့ တံဆိပ်ကို
      font size 14 pixel ပေးပါမယ်။ ပြီးတော့ padding ကို pixel နဲ့ မပေးဘဲ em နဲ့ ပေးပါမယ်။
      အပေါ်အောက်မှာ em တစ်ဝက်၊ ဘယ်ညာမှာ 1 em ပါ။ [[mark:after-stamp]] တံဆိပ်ရဲ့ စာလုံး ပတ်လည်မှာ
      နေရာလွတ် နည်းနည်း ရလာပါပြီ။ [[mark:type-stamp-big]] အခု အောက်မှာ font size ကို 22 pixel
      ထပ်ပေးပါမယ်။ [[mark:after-stamp-big]] စာလုံး ကြီးလာတာနဲ့အမျှ၊ padding ကို မပြင်ရဘဲ နေရာလွတ်ပါ
      လိုက်ကြီးလာပါတယ်။ [[mark:select-stamp-pad]] ဒီ padding ကို ကြည့်ပါ။ တံဆိပ်ရဲ့ font size နဲ့
      တိုင်းထားလို့၊ နေရာလွတ်က စာလုံးနဲ့ အမြဲ အချိုးကျပါတယ်။ [[mark:rem-access]] font size အတွက်တော့
      rem က ပိုကောင်းပါတယ်။ root ရဲ့ font size က default 16 pixel ဖြစ်ပေမယ့်၊ ဖတ်တဲ့သူက browser
      setting မှာ စာလုံး ပိုကြီးအောင် ရွေးထားနိုင်ပါတယ်။ rem က အဲဒီ setting ကို လိုက်ပေမယ့် pixel က
      မလိုက်ပါဘူး။ ဒါကြောင့် font size ကို rem နဲ့၊ စာလုံးနဲ့ အချိုးကျရမယ့် နေရာလွတ်ကို em နဲ့ ပေးပါ။
      တံဆိပ်မှာ pixel သုံးခဲ့တာက ပြောင်းလဲမှု မြင်သာအောင်ပဲ ဖြစ်ပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Sizing units: font-size-relative units"
        url: "https://web.dev/learn/css/sizing#font-size-relative-units"
      - title: "MDN — font-size: rem values and accessibility"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/font-size#accessibility_concerns"
      - title: "CSS Values and Units Module Level 4 — font-relative lengths"
        url: "https://www.w3.org/TR/css-values-4/#font-relative-lengths"
    actions:
      - id: scroll-top
        type: preview.scroll
        at: { mark: scroll-top }
        timeoutMs: 5000
        top: 0
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-stamp
        type: editor.type
        at: { mark: type-stamp }
        cadence: fast-explainer
        target: { file: styles.css, after: "  font-size: 1.2rem;\n}\n", occurrence: 1 }
        text: "\n.stamp {\n  font-size: 14px;\n  padding: 0.5em 1em;\n}\n"
      - id: expect-stamp
        type: expect.preview
        at: { mark: after-stamp }
        timeoutMs: 4000
        target: { by: testId, value: stamp }
        textContains: "ဈေးလျှော့"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-stamp-big
        type: editor.type
        at: { mark: type-stamp-big }
        cadence: natural
        target: { file: styles.css, after: "  padding: 0.5em 1em;\n", occurrence: 1 }
        text: "  font-size: 22px;\n"
      - id: select-stamp-pad
        type: editor.select
        at: { mark: select-stamp-pad }
        target: { file: styles.css, text: "  padding: 0.5em 1em;", occurrence: 1 }

  - id: font-units
    chapter: "စာလုံးကို အခြေခံတဲ့ unit တွေ"
    narration: >
      ဆိုင်အကြောင်း စာပိုဒ်ကို ပြန်ကြည့်ရအောင်။ စာကြောင်း အရမ်း ရှည်ရင်၊ နောက်တစ်ကြောင်း အစကို
      ပြန်သွားတဲ့အခါ မျက်စိက နေရာ မှားတတ်လို့ ဖတ်ရ ခက်ပါတယ်။ [[mark:type-ch]] စာပိုဒ်ကို အကျယ်
      အများဆုံး 30 ch ပေးပါမယ်။ 1 ch ဆိုတာ element ရဲ့ font မှာ သုည ဂဏန်း တစ်လုံးရဲ့ အကျယ်ပါ။
      [[mark:after-ch]] စာပိုဒ် ကျဉ်းသွားပြီး၊ စာကြောင်းတွေ တိုသွားပါပြီ။ အင်္ဂလိပ်စာအတွက်
      တစ်ကြောင်းကို စာလုံး 45 ကနေ 75 လောက်ဆို ဖတ်ရ အဆင်ပြေပေမယ့်၊ ဒီ preview က ကျဉ်းလို့ 30 ကို
      ရွေးထားပါတယ်။ [[mark:ch-estimate]] ဒီ 30 ch ကို ကြည့်ပါ။ စာလုံးတွေရဲ့ အကျယ်က သုညနဲ့ အမြဲ မတူပါဘူး၊
      မြန်မာ စာလုံးဆို ပိုကွာပါတယ်။ ဒါကြောင့် ch က ခန့်မှန်းခြေပဲ ဖြစ်ပါတယ်။ [[mark:lh-unit]] lh
      ဆိုတဲ့ unit လည်း ရှိပါတယ်။ 1 lh က element ရဲ့ line height ပါ။ box ကို စာကြောင်း သုံးကြောင်းစာ
      အမြင့် ပေးတာ၊ တစ်ကြောင်းစာ နေရာလွတ် ခြားတာမျိုး လုပ်နိုင်ပါတယ်။ [[mark:other-font-units]] font
      ကို အခြေခံတဲ့ unit နောက်ထပ် တချို့လည်း ရှိပါတယ်။ ex က x အသေး တစ်လုံးရဲ့ အမြင့်၊ cap က အင်္ဂလိပ်
      စာလုံးကြီးတွေရဲ့ အမြင့်၊ ic က တရုတ် စာလုံး တစ်လုံးရဲ့ အကျယ်ပါ။ တစ်ခုစီမှာ rch၊ rlh လို root
      version လည်း ရှိပြီး၊ rem လိုပဲ root ရဲ့ font ကနေ တိုင်းပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Sizing units: font-size-relative units"
        url: "https://web.dev/learn/css/sizing#font-size-relative-units"
      - title: "MDN — <length>: ch, ex, cap, ic, lh and the root versions"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/length"
      - title: "CSS Values and Units Module Level 4 — font-relative lengths"
        url: "https://www.w3.org/TR/css-values-4/#font-relative-lengths"
    actions:
      - id: type-ch
        type: editor.type
        at: { mark: type-ch }
        cadence: natural
        target: { file: styles.css, after: "  line-height: 1.8;\n", occurrence: 1 }
        text: "  max-width: 30ch;\n"
      - id: expect-story-ch
        type: expect.preview
        at: { mark: after-ch }
        timeoutMs: 4000
        target: { by: testId, value: story }
        textContains: "အီကြာကွေး"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-ch
        type: editor.select
        at: { mark: ch-estimate }
        target: { file: styles.css, text: "30ch", occurrence: 1 }

  - id: viewport-units
    chapter: "Viewport unit တွေ"
    narration: >
      နောက်ဆုံး relative unit အုပ်စုက viewport ပေါ် မူတည်ပါတယ်။ viewport ဆိုတာ browser ထဲမှာ page ကို
      မြင်ရတဲ့ နေရာပါ။ 1 vw က viewport အကျယ်ရဲ့ 1 ရာခိုင်နှုန်း၊ 1 vh က အမြင့်ရဲ့ 1 ရာခိုင်နှုန်းပါ။
      [[mark:type-vh]] ကြိုဆိုတဲ့ အပိုင်းကို အမြင့် အနည်းဆုံး 100 vh ပေးပါမယ်။ viewport ရဲ့ အမြင့်
      အပြည့်ပါ။ [[mark:after-vh]] ကြိုဆိုတဲ့ အပိုင်းက preview တစ်ခုလုံးလောက် မြင့်သွားပါပြီ။ preview က
      ဒီ page ကို frame တစ်ခုထဲမှာ ပြတာ ဖြစ်လို့၊ ဒီမှာ viewport ဆိုတာ ကိုယ့် screen မဟုတ်ဘဲ preview
      ပါ။ [[mark:more-viewport]] ဒီ 100 vh ကို ကြည့်ပါ။ vh အပြင် vmin က viewport ရဲ့ အကျယ်နဲ့
      အမြင့်ထဲက ငယ်တဲ့ဘက်၊ vmax က ကြီးတဲ့ဘက်ကို ယူပါတယ်။ vi နဲ့ vb ကတော့ စာ ရေးသွားတဲ့ ဦးတည်ရာကို
      လိုက်ပြီး၊ lesson 21 မှာ writing mode နဲ့အတူ တွေ့ရပါမယ်။ စာလုံးကို vw နဲ့ ပေးရင် window နဲ့အတူ
      ကြီးလိုက် သေးလိုက် ဖြစ်လို့၊ အငယ်ဆုံးနဲ့ အကြီးဆုံး အရွယ်ကို ကန့်သတ်ပေးရပါတယ်။ lesson 12 မှာ
      ကြည့်ပါမယ်။
    sources:
      - title: "web.dev Learn CSS — Sizing units: viewport-relative units"
        url: "https://web.dev/learn/css/sizing#viewport-relative-units"
      - title: "MDN — <length>: viewport-percentage lengths"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/length#relative_length_units_based_on_viewport"
      - title: "CSS Values and Units Module Level 4 — viewport-percentage lengths"
        url: "https://www.w3.org/TR/css-values-4/#viewport-relative-lengths"
    actions:
      - id: type-vh
        type: editor.type
        at: { mark: type-vh }
        cadence: fast-explainer
        target: { file: styles.css, after: "  font-size: 22px;\n}\n", occurrence: 1 }
        text: "\n.hero {\n  min-height: 100vh;\n}\n"
      - id: expect-hero-vh
        type: expect.preview
        at: { mark: after-vh }
        timeoutMs: 4000
        target: { by: testId, value: order-link }
        textContains: "မှာယူရန်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-vh
        type: editor.select
        at: { mark: more-viewport }
        target: { file: styles.css, text: "100vh", occurrence: 1 }

  - id: phone-board
    narration: >
      [[mark:open-phone]] ဖုန်းမှာဆိုရင် viewport ရဲ့ အမြင့်က တစ်မျိုးတည်း မဟုတ်ပါဘူး။
      [[mark:draw-small]] page ပွင့်ပွင့်ချင်းမှာ browser ရဲ့ toolbar တွေ ပေါ်နေပါတယ်။ toolbar တွေ
      ပေါ်နေတုန်း viewport အမြင့်က အနိမ့်ဆုံး ဖြစ်ပြီး၊ အဲဒါကို small viewport လို့ ခေါ်ပါတယ်။ 1 svh
      က အဲဒီ အမြင့်ရဲ့ 1 ရာခိုင်နှုန်းပါ။ [[mark:draw-large]] scroll ဆင်းလိုက်ရင် toolbar တွေ ပျောက်ပြီး
      viewport မြင့်လာပါတယ်။ အမြင့်ဆုံး အမြင့်ကို large viewport လို့ ခေါ်ပြီး၊ lvh နဲ့ ရေးပါတယ်။
      ရိုးရိုး vh က ဒီ အမြင့်ကို သုံးလို့၊ 100 vh မြင့်တဲ့ အပိုင်းရဲ့ အောက်ခြေက toolbar နောက်မှာ
      ကွယ်နေနိုင်ပါတယ်။ [[mark:draw-dynamic]] dynamic viewport ဖြစ်တဲ့ dvh ကတော့ လက်ရှိ အမြင့်ကို
      လိုက်ပြီး၊ toolbar တွေ ရွေ့တိုင်း ပြောင်းပါတယ်။ ဒါပေမဲ့ toolbar ရွေ့နေတုန်း browser က layout ကို
      ခဏခဏ ပြန်တွက်ရလို့၊ dvh ကို တကယ် လိုမှ သုံးပါ။ [[mark:draw-rule]] ဒါကြောင့် ကိုယ့် ကြိုဆိုတဲ့
      အပိုင်းလို screen အပြည့် ယူမယ့် အပိုင်းအတွက် 100 svh က အမြဲ ဆံ့လို့ စိတ်ချရပါတယ်။
      [[mark:type-svh]] ကြိုဆိုတဲ့ အပိုင်းမှာ 100 svh ကို အောက်က ထပ်ထည့်ပါမယ်။ နောက်မှ ရေးတာ
      ဖြစ်လို့ သူက နိုင်ပါတယ်။ ကွန်ပျူတာမှာ viewport သုံးမျိုးလုံး တူလို့ preview မှာ ဘာမှ
      မပြောင်းပေမယ့်၊ ဖုန်းမှာတော့ အောက်ခြေ မကွယ်တော့ပါဘူး။
    sources:
      - title: "web.dev Learn CSS — Sizing units: alternative viewport-relative units"
        url: "https://web.dev/learn/css/sizing#alternative-viewport-relative-units"
      - title: "web.dev — The large, small, and dynamic viewport units"
        url: "https://web.dev/blog/viewport-units"
      - title: "CSS Values and Units Module Level 4 — small, large and dynamic viewport sizes"
        url: "https://www.w3.org/TR/css-values-4/#viewport-variants"
    actions:
      - id: open-phone
        type: whiteboard.apply
        at: { mark: open-phone }
        open: true
        clear: true
        upsertIds: [f-title]
      - id: draw-small
        type: whiteboard.apply
        at: { mark: draw-small }
        upsertIds: [f-s-body, f-s-top, f-s-bottom, f-s-area, f-s-label, f-s-note]
        drawMs: 3600
      - id: draw-large
        type: whiteboard.apply
        at: { mark: draw-large }
        upsertIds: [f-l-body, f-l-area, f-l-label, f-l-note]
        drawMs: 3000
      - id: draw-dynamic
        type: whiteboard.apply
        at: { mark: draw-dynamic }
        upsertIds: [f-d-body, f-d-top, f-d-area, f-d-arrow, f-d-label, f-d-note]
        drawMs: 3600
      - id: draw-rule
        type: whiteboard.apply
        at: { mark: draw-rule }
        upsertIds: [f-rule]
        drawMs: 1800
      - id: close-phone
        type: whiteboard.apply
        at: { mark: type-svh }
        open: false
      # natural keystrokes: "1", "10", "100", "100s" and "100sv" are invalid
      # min-height values (ignored); only "100svh" applies, and on a desktop
      # it equals 100vh, so the preview never moves while it is typed.
      - id: type-svh
        type: editor.type
        at: { mark: type-svh, offsetMs: 400 }
        cadence: natural
        target: { file: styles.css, after: "  min-height: 100vh;\n", occurrence: 1 }
        text: "  min-height: 100svh;\n"
      - id: expect-hero-svh
        type: expect.preview
        at: { afterAction: type-svh }
        timeoutMs: 4000
        target: { by: testId, value: order-link }
        textContains: "မှာယူရန်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: other-units
    chapter: "Length မဟုတ်တဲ့ unit တွေ"
    narration: >
      [[mark:open-other]] unit တိုင်းက length မဟုတ်ပါဘူး။ [[mark:draw-angles]] ထောင့်ကို တိုင်းတဲ့
      unit တွေ ရှိပါတယ်။ ဒီဂရီ၊ turn၊ radian နဲ့ gradian ဖြစ်ပြီး၊ 1 turn ဆိုတဲ့ တစ်ပတ်က 360 ဒီဂရီပါ။
      ပြီးခဲ့တဲ့ lesson မှာ hue ကို ထောင့်နဲ့ ရေးခဲ့သလို၊ element ကို လှည့်တဲ့အခါမှာလည်း သုံးပါတယ်။
      [[mark:draw-time]] အချိန်ကို စက္ကန့်၊ millisecond နဲ့ ရေးပြီး transition၊ animation တွေမှာ
      သုံးပါတယ်။ [[mark:draw-resolution]] dpi နဲ့ dppx လို resolution unit တွေကိုတော့ ပြတ်သားတဲ့
      screen တွေကို ပိုပြတ်သားတဲ့ ပုံ ပေးဖို့ media query မှာ အဓိက သုံးပါတယ်။ [[mark:draw-container]]
      container unit တွေက viewport unit နဲ့ တူပေမယ့် container ကို တိုင်းပါတယ်။ lesson 25 မှာ
      container query နဲ့အတူ တွေ့ရပါမယ်။ [[mark:draw-quiz]] မေးခွန်း တစ်ခု မေးကြည့်ရအောင်။ viewport
      unit က absolute လား၊ relative လား။ ခဏ စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] relative ပါ။ window
      ပေါ် မူတည်လို့၊ window ပြောင်းရင် လိုက်ပြောင်းပါတယ်။ unit တစ်ခုခု
      မသေချာရင် MDN မှာ ရှာကြည့်ပါ။
    sources:
      - title: "web.dev Learn CSS — Sizing units: miscellaneous units"
        url: "https://web.dev/learn/css/sizing#miscellaneous-units"
      - title: "MDN — <angle>"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/angle"
      - title: "MDN — <resolution>"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/resolution"
      - title: "MDN — Container query length units"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_containment/Container_queries#container_query_length_units"
      - title: "MDN — CSS values and units"
        url: "https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Styling_basics/Values_and_units"
    actions:
      - id: open-other
        type: whiteboard.apply
        at: { mark: open-other }
        open: true
        clear: true
        upsertIds: [g-title]
      - id: draw-angles
        type: whiteboard.apply
        at: { mark: draw-angles }
        upsertIds: [g-ang-k, g-ang-v]
        drawMs: 2400
      - id: draw-time
        type: whiteboard.apply
        at: { mark: draw-time }
        upsertIds: [g-time-k, g-time-v]
        drawMs: 1800
      - id: draw-resolution
        type: whiteboard.apply
        at: { mark: draw-resolution }
        upsertIds: [g-res-k, g-res-v]
        drawMs: 1800
      - id: draw-container
        type: whiteboard.apply
        at: { mark: draw-container }
        upsertIds: [g-cq-k, g-cq-v]
        drawMs: 1800
      - id: draw-quiz
        type: whiteboard.apply
        at: { mark: draw-quiz }
        upsertIds: [g-quiz-q]
        drawMs: 1200
      - id: draw-quiz-answer
        type: whiteboard.apply
        at: { mark: quiz-answer }
        upsertIds: [g-quiz-a, g-quiz-check]
        drawMs: 1400

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ unit မပါတဲ့ ဂဏန်းက property ကနေ အဓိပ္ပာယ် ရပြီး၊ line height
      အတွက် အကောင်းဆုံးပါ။ ရာခိုင်နှုန်းက တစ်ခုခုရဲ့ အစိတ်အပိုင်း ဖြစ်လို့ ဘာရဲ့လဲ ဆိုတာ အမြဲ
      မေးရပါမယ်။ pixel က ပုံသေ ဖြစ်ပြီး၊ em က font size ကို၊ rem က root ရဲ့ font size ကို၊ viewport
      unit တွေက window ကို လိုက်ပါတယ်။ [[mark:next-lesson]] နောက် lesson မှာတော့ ဒီလို တန်ဖိုးတွေကို
      custom property နဲ့ နာမည် ပေးပြီး၊ တစ်နေရာ ပြင်ရုံနဲ့ အကုန် ပြောင်းအောင် လုပ်တာကို
      ကြည့်သွားပါမယ်။
    sources:
      - title: "web.dev Learn CSS — Sizing units"
        url: "https://web.dev/learn/css/sizing"
      - title: "MDN — CSS values and units"
        url: "https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Styling_basics/Values_and_units"
      - title: "web.dev Learn CSS — Custom properties (next lesson)"
        url: "https://web.dev/learn/css/custom-properties"
    actions:
      - id: expect-final-css
        type: expect.file
        at: { mark: recap }
        path: styles.css
        contains: ".sold-out {\n  opacity: 0.5;\n}\n\n.about p {\n  line-height: 16px;\n  line-height: 1.8;\n  max-width: 30ch;\n}\n\n.menu-card:first-child {\n  width: 50%;\n  padding-top: 25%;\n  height: 50%;\n}\n"
      - id: expect-final-css-2
        type: expect.file
        at: { afterAction: expect-final-css }
        path: styles.css
        contains: ".levels li {\n  font-size: 1.2em;\n  font-size: 1.2rem;\n}\n\n.stamp {\n  font-size: 14px;\n  padding: 0.5em 1em;\n  font-size: 22px;\n}\n\n.hero {\n  min-height: 100vh;\n  min-height: 100svh;\n}\n"

checks:
  - { type: timing.p95Ms, max: 300 }
