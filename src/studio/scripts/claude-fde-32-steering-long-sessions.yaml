        - trial: Billing developer 2 ယောက်၊ Claude Code နဲ့ 3 ရက်

        ## Scope

        ## Compaction မှာ မပျောက်စေရ

        ## ပြီးပြီလို့ ဘယ်လို သိမလဲ

        ## Session ကို ဘယ်လို ထိန်းမလဲ
