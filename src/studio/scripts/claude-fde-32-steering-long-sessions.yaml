build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 9332

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: need
    chapter: နာရီ ချီ ကြာမယ့် session
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ hook တွေကို လေ့လာခဲ့ပါတယ်။ hook ဆိုတာ model က မှတ်မိမှ လုပ်တာ မဟုတ်ဘဲ၊ Claude
      Code ကိုယ်တိုင်က သတ်မှတ်ထားတဲ့ အချိန်မှာ အမြဲ run ပေးတဲ့ ကိုယ့် command ပါ။
      [[mark:n-file]] အခု ခုနစ်ပတ်မြောက်ကို ရောက်ပါပြီ။ Billing team lead မောင်မောင် နဲ့ ကိုယ်တို့က ပိုကြီးတဲ့
      အလုပ် တစ်ခုကို စမ်းကြည့်ဖို့ ဆုံးဖြတ်လိုက်ပါတယ်။
      [[mark:sel-jobs]] Billing ထဲမှာ report job ၁၄၀ ရှိပြီး၊ အားလုံးကို နောက်နှစ်မှာ support ရပ်သွားမယ့် report
      library အဟောင်းပေါ်မှာ ရေးထားပါတယ်။
      [[mark:sel-trial]] ဒါကြောင့် trial တစ်ခု လုပ်ပါမယ်။ Billing developer နှစ်ယောက်က Claude Code နဲ့ ရက်
      သုံးရက်အတွင်း ပထမ job တွေကို library အသစ်ဆီ ရွှေ့ကြည့်မှာပါ။ Claude Code ဆိုတာ terminal ထဲကနေ code ကို
      ဖတ်၊ ပြင်၊ command run ပေးတဲ့ coding agent ပါ။
      [[mark:n-risk]] job တစ်ခု ရွှေ့တာက နာရီ ချီပြီး ကြာမယ့် session ရှည် တစ်ခုပါ။ အဲဒီလို session မှာ ပြဿနာ သုံးခု ကြုံတတ်ပါတယ်။ လမ်းမှားနဲ့ စသွားတာ၊ အလယ်မှာ
      သဘောတူထားတာတွေကို မေ့သွားတာ၊ ဘယ်အချိန်မှာ ပြီးပြီလဲ မသိတာ တို့ပါ။
      [[mark:n-plan]] ဒီ သုံးခုအတွက် trial ရဲ့ plan ကို တစ်ပိုင်းချင်း ရေးသွားပါမယ်။
    sources:
      - {
          title: "Claude Code Docs: Best practices",
          url: "https://code.claude.com/docs/en/best-practices",
        }
    actions:
      - {
          id: open-plan,
          type: workspace.openFile,
          at: { mark: n-file },
          path: notebook/32-session-plan.md,
        }
      - id: sel-jobs
        type: editor.select
        at: { mark: sel-jobs }
        target:
          file: notebook/32-session-plan.md
          text: "- report job 140 ခု၊ library အဟောင်းက နောက်နှစ် support ရပ်မယ်"
      - id: sel-trial
        type: editor.select
        at: { mark: sel-trial }
        target:
          file: notebook/32-session-plan.md
          text: "- trial: Billing developer 2 ယောက်၊ Claude Code နဲ့ 3 ရက်"
      - id: sel-headings
        type: editor.select
        at: { mark: n-plan }
        target:
          file: notebook/32-session-plan.md
          text: "## Scope"

  - id: plan
    chapter: Plan mode နဲ့ စခြင်း
    narration: >
      ပထမ ပြဿနာ၊ လမ်းမှားနဲ့ စတာကို plan mode နဲ့ ကာကွယ်ပါတယ်။ plan mode ဆိုတာ ဘာမှ မပြင်ဘဲ
      အရင် ဖတ်ပြီး အစီအစဉ် ဆွဲခိုင်းတဲ့ mode ပါ။ Shift နဲ့ Tab ကို တွဲနှိပ်ပြီး ဒါမှမဟုတ် plan command နဲ့
      ဝင်လို့ ရပါတယ်။ Claude က file တွေ ဖတ်၊ command တွေ run ပြီး plan တစ်ခု ရေးပါတယ်။ ကိုယ်က approve
      မလုပ်မချင်း source code ကို မပြင်ပါဘူး။
      [[mark:p-title]] plan ရေးပြီးသွားရင် ဒီလို မြင်ရပါတယ်။ ဒီ ဥပမာက invoice မှာ လျှော့ဈေး ထည့်တဲ့ အလုပ်
      သေးသေးလေးပါ။
      [[mark:p-plan]] ဘာကို ဘယ် file မှာ ပြောင်းမလဲ၊ ဘယ်လို စစ်မလဲ ဆိုတာ ရေးထားပြီး၊ Claude က ဒီ plan ကို
      file တစ်ခုထဲမှာ သိမ်းထားပါတယ်။
      [[mark:p-auto]] အောက်မှာ ရွေးစရာ သုံးခု ရှိပါတယ်။ ပထမ တစ်ခုက plan ကို လက်ခံပြီး auto mode နဲ့
      ဆက်လုပ်ခိုင်းတာပါ။ auto mode ဆိုတာ action တစ်ခုချင်းကို ကိုယ့်အစား classifier model တစ်ခုက စစ်ပြီး
      ခွင့်ပြုတဲ့ mode ပါ။
      [[mark:p-manual]] ဒုတိယ တစ်ခုက plan ကို လက်ခံပေမဲ့ edit တစ်ခုချင်းကို ကိုယ်တိုင် approve လုပ်မယ် ဆိုတာပါ။
      [[mark:p-back]] တတိယ တစ်ခုကတော့ ဘာပြင်ရမလဲ ပြောပြီး plan ကို ပြန်ပို့တာပါ။
      [[mark:p-job]] report job အတွက်ဆိုရင် job တစ်ခုချင်းရဲ့ data ဘယ်က လာလဲ၊ ဘယ် helper တွေကို မျှသုံးလဲ ဆိုတာ
      plan ထဲမှာ မပါမချင်း ပြန်ပို့ပါမယ်။
    sources:
      - {
          title: "Claude Code Docs: Permission modes",
          url: "https://code.claude.com/docs/en/permission-modes",
        }
    actions:
      - {
          id: show-plan,
          type: slide.show,
          at: { mark: p-title, offsetMs: -1200 },
          slideId: plan-screen,
        }
      - {
          id: pt-plan-title,
          type: slide.point,
          at: { mark: p-title },
          target: { x: 0.171, y: 0.228 },
        }
      - {
          id: pt-plan-text,
          type: slide.point,
          at: { mark: p-plan },
          target: { x: 0.171, y: 0.349 },
        }
      - {
          id: pt-plan-auto,
          type: slide.point,
          at: { mark: p-auto },
          target: { x: 0.211, y: 0.802 },
        }
      - {
          id: pt-plan-manual,
