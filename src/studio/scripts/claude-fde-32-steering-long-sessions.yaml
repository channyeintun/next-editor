  - id: line
    chapter: လမ်းလွဲရင် rewind
    narration: >
      [[mark:b-open]] plan ကောင်းရင်တောင် session ရှည်ရှည်မှာ Claude က လမ်းလွဲသွားနိုင်ပါတယ်။ ဒါကို session
      တစ်ခုရဲ့ လမ်းကြောင်း အဖြစ် ဆွဲကြည့်ရအောင်။
      [[mark:b-line]] အလှည့် တစ်ခုကို စတဲ့ prompt တိုင်းမှာ Claude Code က checkpoint တစ်ခု အလိုအလျောက် ယူထားပါတယ်။
      checkpoint ဆိုတာ အဲဒီ အချိန်က file တွေကို မှတ်ထားတာပါ။
      [[mark:b-wrong]] ဆိုပါစို့၊ တတိယ prompt ပြီးနောက် Claude က job တစ်ခုကို ရွှေ့ရင်း job အားလုံး မျှသုံးတဲ့
      helper တွေကို ပြန်ရေးလာတယ်။ docs ရဲ့ အကြံက ပထမ မိနစ်ကို စောင့်ကြည့်ပြီး လမ်းလွဲတာ မြင်ရင်
      Esc နဲ့ ရပ်ဖို့ပါ။
      [[mark:b-rewind]] လမ်းလွဲပြီးမှ သိရင်တော့ rewind လုပ်ပါတယ်။ rewind command နဲ့ ဒါမှမဟုတ် prompt ဗလာမှာ Esc
      ကို နှစ်ခါ နှိပ်ပြီး checkpoint တစ်ခုဆီ ပြန်သွားလို့ ရပါတယ်။ code ကိုပဲလား၊ စကားဝိုင်းကိုပဲလား၊
      နှစ်ခုလုံးလား ပြန်ယူမလဲ ရွေးလို့ ရပါတယ်။
      [[mark:b-not]] ဒါပေမဲ့ rewind က git မဟုတ်ပါဘူး။ Claude ရဲ့ edit tool နဲ့ မဟုတ်ဘဲ Bash command နဲ့
      ပြောင်းသွားတဲ့ file တွေ၊ session အပြင်ကနေ ပြင်တာတွေ၊ subagent ပြင်တာ အများစုကို ပြန်မယူပေးပါဘူး။ report
      job တွေက script နဲ့ output file ထုတ်တာမို့ ဒါ အရေးကြီးပါတယ်။
      [[mark:b-git]] ဒါကြောင့် job တစ်ခု ရွှေ့ပြီး စစ်လို့ အောင်တိုင်း git commit လုပ်ထားပါမယ်။
      [[mark:r-open]] rewind menu ကို ဖွင့်ရင် ဒီလို မြင်ရပါတယ်။ ဒီ ဥပမာမှာ late fee အကြောင်း မေးခွန်း နှစ်ခု
      ရှိပါတယ်။
      [[mark:r-points]] prompt တစ်ခုချင်းက ပြန်သွားလို့ရတဲ့ နေရာ တစ်ခုစီပါ။ ရွေးလိုက်တဲ့ prompt မတိုင်ခင် အခြေအနေကို
      ပြန်ရောက်သွားမှာပါ။
      [[mark:r-nochange]] prompt တစ်ခုချင်းအောက်မှာ အဲဒီ အလှည့်က code ကို ပြောင်းခဲ့လား မပြောင်းခဲ့ဘူးလား
      ပြထားပါတယ်။ job ရွှေ့နေတဲ့ session မှာဆိုရင် ဘယ် prompt ကစပြီး file တွေ ပြောင်းသွားလဲ ဒီနေရာမှာ
      မြင်ရပါမယ်။
    sources:
      - {
          title: "Claude Code Docs: Checkpointing",
          url: "https://code.claude.com/docs/en/checkpointing",
        }
      - {
          title: "Claude Code Docs: Best practices",
          url: "https://code.claude.com/docs/en/best-practices",
        }
    actions:
      - { id: close-plan, type: slide.close, at: { mark: b-open } }
      - {
          id: draw-b-open,
          type: whiteboard.apply,
          at: { afterAction: close-plan },
          open: true,
          clear: true,
          upsertIds: [b1-title],
        }
      - {
          id: draw-b-line,
          type: whiteboard.apply,
          at: { mark: b-line },
          upsertIds: [b1-cp-l, b1-line, b1-cp1, b1-cp2, b1-cp3],
          drawMs: 2000,
        }
      - {
          id: draw-b-wrong,
          type: whiteboard.apply,
          at: { mark: b-wrong },
          upsertIds: [b1-w-arrow, b1-w-box, b1-w-l],
          drawMs: 1500,
        }
      - {
          id: draw-b-rewind,
          type: whiteboard.apply,
          at: { mark: b-rewind },
          upsertIds: [b1-rw, b1-rw-l],
          drawMs: 1200,
        }
      - {
          id: draw-b-not,
          type: whiteboard.apply,
          at: { mark: b-not },
          upsertIds: [b1-not-l],
          drawMs: 900,
        }
      - {
          id: draw-b-git,
          type: whiteboard.apply,
          at: { mark: b-git },
          upsertIds: [b1-git-l],
          drawMs: 900,
        }
      - { id: close-b1, type: whiteboard.apply, at: { mark: r-open, offsetMs: -1400 }, open: false }
      - { id: show-rewind, type: slide.show, at: { afterAction: close-b1 }, slideId: rewind-screen }
      - { id: pt-rw-title, type: slide.point, at: { mark: r-open }, target: { x: 0.146, y: 0.560 } }
      - {
          id: pt-rw-points,
          type: slide.point,
          at: { mark: r-points },
          target: { x: 0.187, y: 0.772 },
        }
      - {
          id: pt-rw-nochange,
          type: slide.point,
          at: { mark: r-nochange },
          target: { x: 0.187, y: 0.802 },
        }

  - id: notes
    chapter: Compaction မှာ ဘာ ကျန်မလဲ
    narration: >
      [[mark:c-open]] ဒုတိယ ပြဿနာက သဘောတူထားတာတွေကို မေ့သွားတာပါ။ session ရှည်လာရင် context window
      ပြည့်လာပါတယ်။ context window ဆိုတာ request တစ်ခုမှာ model မြင်နိုင်တဲ့ စာ အားလုံးအတွက် နေရာပါ။ ပြည့်လာရင်
      Claude Code က compaction လုပ်ပါတယ်။ compaction ဆိုတာ စကားဝိုင်း အဟောင်းကို အကျဉ်းချုပ်ပြီး နေရာ ပြန်ယူတာပါ။
      မမေ့စေရမယ့် အရာတွေကို မရေးခင် scope ကို အရင် ရေးပါမယ်။
      [[mark:type-scope]] scope ထဲမှာ ပထမဆုံး job ၁၂ ခုပဲ ပါပါတယ်။ invoice တွက်တဲ့ code ကို မထိသလို၊ job အဟောင်းတွေကိုလည်း
      မဖျက်ပါဘူး။ output ကို နှိုင်းယှဉ်ဖို့ လိုသေးလို့ပါ။
      [[mark:c-survive]] compaction ပြီးရင် ဘာ ကျန်လဲ သိထားရပါမယ်။ root က CLAUDE.md၊ Claude ရေးထားတဲ့ plan
      နဲ့ မကြာခင်က ပြင်ထားတဲ့ file အချို့ကို disk ကနေ ပြန်ဖတ်ပေးပါတယ်။ စကားဝိုင်းထဲမှာ ပြောခဲ့တာတွေကတော့
      အကျဉ်းချုပ်ထဲမှာ ပါမှပဲ ကျန်ပါတယ်။
      [[mark:type-keep]] ဒါကြောင့် အကျဉ်းချုပ်မှာ မပျောက်စေချင်တာတွေကို စာရင်း လုပ်ထားပါမယ်။ ဘယ် job တွေ ပြီးပြီလဲ
      ဆိုတဲ့ စာရင်း၊ ငွေပမာဏကို တစ်ခါပဲ round လုပ်မယ် ဆိုတဲ့ သဘောတူချက်နဲ့ shared helper တွေကို မပြင်ဘူး ဆိုတဲ့
      ဆုံးဖြတ်ချက်ပါ။
      [[mark:sel-keep]] compact command ကို ကိုယ်တိုင် run တဲ့အခါ ဒီ စာရင်းကို ညွှန်ကြားချက် အဖြစ် နောက်က ထည့်ပေးလို့
      ရပါတယ်။ အမြဲ လိုတဲ့ ညွှန်ကြားချက်ဆိုရင်တော့ CLAUDE.md ထဲမှာ compact instructions ဆိုတဲ့
      ခေါင်းစဉ်အောက်မှာ ရေးထားလို့ ရပါတယ်။
    sources:
      - {
          title: "Claude Code Docs: Context window",
          url: "https://code.claude.com/docs/en/context-window",
        }
      - {
          title: "Claude Code Docs: Manage costs effectively",
          url: "https://code.claude.com/docs/en/costs",
        }
    actions:
      - { id: close-rewind, type: slide.close, at: { mark: c-open } }
      - id: type-scope
        type: editor.type
        at: { mark: type-scope }
        cadence: line-by-line
        target: { file: notebook/32-session-plan.md, after: "## Scope\n" }
        text: "- src/reports/jobs/ ထဲက ပထမ job 12 ခု\n- မထိ: invoice တွက်တဲ့ code၊ job အဟောင်း (output နှိုင်းယှဉ်ဖို့)\n"
      - id: type-keep
        type: editor.type
        at: { mark: type-keep }
        cadence: line-by-line
        target: { file: notebook/32-session-plan.md, after: "## Compaction မှာ မပျောက်စေရ\n" }
        text: "- ပြီးပြီးသား job စာရင်း\n- ငွေပမာဏကို တစ်ခါပဲ round\n- shared helper တွေ မပြင်\n"
      - id: sel-keep
        type: editor.select
        at: { mark: sel-keep }
        target:
          file: notebook/32-session-plan.md
          text: "## Compaction မှာ မပျောက်စေရ"

  - id: engines
    chapter: Goal နဲ့ loop
    narration: >
      [[mark:g-open]] တတိယ ပြဿနာက ဘယ်အချိန်မှာ ပြီးပြီလဲ ဆိုတာပါ။ Claude က အလုပ် ပြီးသလို ထင်ရတဲ့ အချိန်မှာ
      ရပ်တတ်ပါတယ်။ ကိုယ်က နောက် prompt မရိုက်ဘဲ Claude Code ကို ဆက်လုပ်ခိုင်းတဲ့ နည်း သုံးမျိုး ရှိပါတယ်။
      [[mark:g-goal]] ပထမ တစ်ခုက goal ပါ။ goal command နောက်မှာ ပြီးဆုံးရမယ့် အခြေအနေကို ရေးပေးလိုက်ရင်၊ အလှည့်
      တစ်ခု ပြီးတိုင်း သေးပြီး မြန်တဲ့ model တစ်ခုက အဲဒီ အခြေအနေ ပြည့်ပြီလား စစ်ပါတယ်။ မပြည့်သေးရင် Claude က
      နောက် အလှည့် တစ်ခု ဆက်စပါတယ်။ goal က တစ်ကြိမ်မှာ တစ်ခုပဲ ရှိနိုင်ပါတယ်။
      [[mark:g-loop]] ဒုတိယ တစ်ခုက loop ပါ။ ဖွင့်ထားတဲ့ session ထဲမှာ prompt တစ်ခုကို အချိန်
      ပုံသေနဲ့ ဒါမှမဟုတ် Claude ရွေးတဲ့ အချိန်နဲ့ ထပ်ခါထပ်ခါ run ပေးတာပါ။ ဒီလို loop တွေက ခုနစ်ရက် ကြာရင်
      သက်တမ်းကုန်ပါတယ်။
      [[mark:g-hook]] တတိယ တစ်ခုက ပြီးခဲ့တဲ့ lesson က hook ပါပဲ။ Claude ရပ်ခါနီးမှာ run တဲ့ Stop hook က
      ဆက်လုပ်ရမလား မလုပ်ရဘူးလား ကိုယ့် script က ဆုံးဖြတ်ပါတယ်။
      [[mark:g-stop]] goal ကတော့ စစ်တဲ့ model က ပြည့်ပြီ ဒါမှမဟုတ် မဖြစ်နိုင်ဘူးလို့
      ဆုံးဖြတ်ရင်၊ ကိုယ်တိုင် ပြင်ရမယ့် error တစ်ခု တက်ရင်၊ ဒါမှမဟုတ် goal ကို ကိုယ်က clear လုပ်လိုက်ရင် ရပ်ပါတယ်။
      goal က permission mode ကို မပြောင်းပေးတာမို့၊ လူ မစောင့်တဲ့ goal run အတွက်ဆိုရင် auto mode ကို သုံးရပါတယ်။
    sources:
      - {
          title: "Claude Code Docs: Keep Claude working toward a goal",
          url: "https://code.claude.com/docs/en/goal",
        }
      - {
          title: "Claude Code Docs: Run prompts on a schedule",
          url: "https://code.claude.com/docs/en/scheduled-tasks",
        }
    actions:
      - {
          id: draw-g-open,
          type: whiteboard.apply,
          at: { mark: g-open },
          open: true,
          clear: true,
          upsertIds: [b2-title],
        }
      - {
          id: draw-g-goal,
          type: whiteboard.apply,
          at: { mark: g-goal },
          upsertIds: [b2-g, b2-g-l, b2-g-t],
          drawMs: 1500,
        }
      - {
          id: draw-g-loop,
          type: whiteboard.apply,
          at: { mark: g-loop },
          upsertIds: [b2-l, b2-l-l, b2-l-t],
          drawMs: 1500,
        }
      - {
          id: draw-g-hook,
          type: whiteboard.apply,
          at: { mark: g-hook },
          upsertIds: [b2-h, b2-h-l, b2-h-t],
          drawMs: 1500,
        }
      - {
          id: draw-g-mark,
          type: whiteboard.apply,
          at: { mark: g-stop },
          upsertIds: [b2-g-mark],
          drawMs: 900,
        }

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ trial ထဲက job ၁၂ ခုကို goal တစ်ခုနဲ့ လွှတ်ထားပြီး ဆက်လုပ်ခိုင်းမယ်
      ဆိုပါစို့။ ဘယ် အခြေအနေကို goal အဖြစ် ယုံပြီး ပေးလို့ ရမလဲ။
      [[mark:q-a]] ပထမ တစ်ခုက report code ကို ပိုကောင်းအောင် ပြင်ပါ ဆိုတာပါ။
      [[mark:q-b]] ဒုတိယ တစ်ခုက job ၁၂ ခုရဲ့ output က job အဟောင်းတွေရဲ့ output နဲ့ တူရမယ် ဆိုတာပါ။ lesson ကို
      pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ တစ်ခုပါ။ ဘာကြောင့်လဲဆိုတော့ goal ကို စစ်တဲ့ model က စကားဝိုင်းကိုပဲ
      ဖတ်ပြီး၊ command ကို ကိုယ်တိုင် run မကြည့်လို့ပါ။ ပိုကောင်းတယ် ဆိုတာကို စကားဝိုင်းထဲက ဘာနဲ့မှ သက်သေ
      မပြနိုင်တော့၊ Claude က ကောင်းပါပြီလို့ ပြောတာကိုပဲ ယုံရပါမယ်။ output တူတယ် ဆိုတာကတော့ နှိုင်းယှဉ်တဲ့
      command ရဲ့ ရလဒ်နဲ့ စကားဝိုင်းထဲမှာတင် သက်သေပြနိုင်ပါတယ်။
      [[mark:q-rule]] ဒါကြောင့် goal ရေးတဲ့အခါ တိုင်းလို့ရတဲ့ အဆုံး အခြေအနေ၊ အဲဒါကို သက်သေပြမယ့် command နဲ့ အလှည့်
      ဘယ်နှခု ပြည့်ရင် ရပ်မလဲ ဆိုတဲ့ ကန့်သတ်ချက် ပါရပါမယ်။
    sources:
      - {
          title: "Claude Code Docs: Keep Claude working toward a goal",
          url: "https://code.claude.com/docs/en/goal",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: q-rule, offsetMs: 1500 },
          upsertIds: [q-t1, q-t2],
          drawMs: 1600,
        }

  - id: finish
    chapter: ပြီးဆုံးချက်နဲ့ mode
    narration: >
      [[mark:f-open]] ဒီ စည်းကမ်းအတိုင်း trial ရဲ့ ပြီးဆုံးချက်ကို ရေးပါမယ်။
      [[mark:type-finish]] job တစ်ခုစီကို စစ်တဲ့ command က report compare ပါ။ job အသစ်နဲ့ job အဟောင်းကို data
      တူတူနဲ့ run ပြီး output ကို တိုက်စစ်ပေးတဲ့ Billing team ရဲ့ script ပါ။ test အားလုံးပါ အောင်မှ ပြီးတယ်လို့
      သတ်မှတ်ပါတယ်။
      [[mark:type-goal]] goal အဖြစ် ရေးမယ်ဆိုရင်တော့ ဒီ အခြေအနေကို English နဲ့ ရေးပြီး၊ အလှည့် သုံးဆယ် ပြည့်ရင်
      ရပ်ပါ ဆိုတဲ့ ကန့်သတ်ချက်ကိုပါ နောက်ဆုံးမှာ ထည့်ထားပါတယ်။
      [[mark:type-mode]] နောက်ဆုံး ဆုံးဖြတ်ချက်က session ကို လက်နဲ့ ထိန်းမလား၊ goal နဲ့ လွှတ်ထားမလား ဆိုတာပါ။
      ပြီးဆုံးချက်ကို Claude ကိုယ်တိုင် စစ်လို့ရတဲ့ command နဲ့ ရေးနိုင်သလား၊
      ဒီလို အလုပ်မျိုး လုပ်တာကို ကိုယ်တို့ စောင့်ကြည့်ဖူးပြီလား ဆိုတာပါ။ ပထမ တစ်ခုက ရပြီး၊ ဒုတိယ တစ်ခုက
      မရသေးပါဘူး။
      [[mark:sel-mode]] ဒါကြောင့် trial မှာ plan mode နဲ့ စပြီး၊ edit တစ်ခုချင်းကို developer က ကိုယ်တိုင် approve
      လုပ်ပါမယ်။ goal နဲ့ လွှတ်ထားတာကိုတော့ trial ရလဒ် ကြည့်ပြီးမှ စဉ်းစားပါမယ်။
    sources:
      - {
          title: "Claude Code Docs: Keep Claude working toward a goal",
          url: "https://code.claude.com/docs/en/goal",
        }
      - {
          title: "Claude Code Docs: Permission modes",
          url: "https://code.claude.com/docs/en/permission-modes",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: f-open }, open: false }
      - id: type-finish
        type: editor.type
        at: { mark: type-finish }
        cadence: line-by-line
        target: { file: notebook/32-session-plan.md, after: "## ပြီးပြီလို့ ဘယ်လို သိမလဲ\n" }
        text: "- job တိုင်း: npm run report:compare -- <job> က exit 0၊ npm test က exit 0\n"
      - id: type-goal
        type: editor.type
        at: { mark: type-goal }
        cadence: line-by-line
        target: { file: notebook/32-session-plan.md, after: "npm test က exit 0\n" }
        text: "- /goal report:compare exits 0 for all 12 jobs and npm test exits 0,\n  or stop after 30 turns\n"
      - id: expect-goal
        type: expect.file
        at: { afterAction: type-goal }
        path: notebook/32-session-plan.md
        contains: "- /goal report:compare exits 0 for all 12 jobs and npm test exits 0,\n  or stop after 30 turns\n"
      - id: type-mode
        type: editor.type
        at: { mark: type-mode }
        cadence: line-by-line
        target: { file: notebook/32-session-plan.md, after: "## Session ကို ဘယ်လို ထိန်းမလဲ\n" }
        text: "- trial: plan mode နဲ့ စ၊ edit တိုင်း developer က approve\n- job တစ်ခု အောင်တိုင်း git commit\n- goal run: trial ရလဒ် ကြည့်ပြီးမှ\n"
      - id: sel-mode
        type: editor.select
        at: { mark: sel-mode }
        target:
          file: notebook/32-session-plan.md
          text: "- trial: plan mode နဲ့ စ၊ edit တိုင်း developer က approve"

  - id: your-turn
    chapter: ကိုယ့် အလုပ် ရှည်အတွက်
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ကိုယ့် project ထဲက နာရီ ချီ ကြာမယ့် အလုပ်
      တစ်ခုကို ရွေးပါ။ ပြီးရင် ဒီ အပိုင်းလိုမျိုး၊ ပြီးပြီလို့ ဘယ် command ရဲ့ ရလဒ်နဲ့ သိနိုင်လဲ တစ်ကြောင်း
      ရေးကြည့်ပါ။
      [[mark:turn-2]] ပြီးရင် ဒီ တစ်ကြောင်းကို ဖတ်ရုံနဲ့ project ကို မသိတဲ့ developer တစ်ယောက်က ပြီးမပြီး
      ဆုံးဖြတ်နိုင်သလား စစ်ကြည့်ပါ။ ပိုကောင်းအောင် ဆိုတဲ့ စကားလုံးမျိုး ပါနေရင်
      တိုင်းလို့ရတဲ့ ဂဏန်း ဒါမှမဟုတ် command တစ်ခုနဲ့ အစားထိုးပါ။
    sources:
      - {
          title: "Claude Code Docs: Keep Claude working toward a goal",
          url: "https://code.claude.com/docs/en/goal",
        }
    actions:
      - id: sel-finish
        type: editor.select
        at: { mark: turn }
        target:
          file: notebook/32-session-plan.md
          text: "- job တိုင်း: npm run report:compare -- <job> က exit 0၊ npm test က exit 0"

  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ session ရှည် တစ်ခုကို plan mode နဲ့ လမ်းကြောင်း သဘောတူပြီးမှ စပါတယ်။
      လမ်းလွဲရင် rewind နဲ့ ပြန်သွားပြီး၊ rewind မယူပေးနိုင်တာအတွက် git commit ကို အားကိုးပါတယ်။ compaction မှာ
      မပျောက်စေချင်တာကို ကြိုရေးထားပါတယ်။
      [[mark:recap-2]] goal နဲ့ လွှတ်ထားမလား၊ လက်နဲ့ ထိန်းမလား ဆိုတာကိုတော့ ပြီးဆုံးချက်ကို command တစ်ခုနဲ့
      သက်သေပြနိုင်လား၊ အဲဒီ အလုပ်မျိုးကို စောင့်ကြည့်ဖူးပြီလား ဆိုတာနဲ့ ဆုံးဖြတ်ပါတယ်။
      [[mark:next]] နောက် lesson မှာတော့ ရှည်လာတဲ့ CLAUDE.md ကို Claude က တစ်ဝက်လောက်ပဲ လိုက်နာနေတဲ့ ပြဿနာကနေ စပြီး၊
      စည်းကမ်း တစ်ခုချင်းကို တကယ် လိုက်နာမယ့် နေရာမှာ ထားတာကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "Claude Code Docs: Checkpointing",
          url: "https://code.claude.com/docs/en/checkpointing",
        }
    actions:
      - id: sel-goal
        type: editor.select
        at: { mark: recap-2 }
        target:
          file: notebook/32-session-plan.md
          text: "- /goal report:compare exits 0 for all 12 jobs and npm test exits 0,"

checks:
  - { type: timing.p95Ms, max: 300 }
