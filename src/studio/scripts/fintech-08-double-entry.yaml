# Fintech Engineering, lesson 08: the double-entry ledger, in the direction view (Burmese).
#
# Source: Fintech Engineering Handbook, "Double-entry bookkeeping" (first half) and Appendix A
# "Ledger", "Posting" (CC BY 4.0, Voytek Pitula).
# Start state: ledger.go holds Entry{From, To, Amount}, an append-only Ledger, a derived Balance
# and Accounts; main.go records a deposit and a transfer and prints the two users' balances.
# Edits, all insert-only:
#   1. a fee entry, then every account's balance and their sum   -> run-2 prints total 0.00
#   2. the fee entry once more (a retried request)                -> run-3: fees 3.00, total 0.00
# Figures: column (what an UPDATE forgets), move (entries between accounts, Σ = 0), derive (balance
# derived from entries, a cache that can be rebuilt), limits (what Σ = 0 does and does not stop),
# iv (the interview answer).
# Built by ~/Documents/fintech-course-work/tools/build-lesson.ts; fixtures by sim-go.ts --write.
schemaVersion: 1

lesson:
  slug: fintech-08-double-entry
  title: "Fintech Engineering 08: Double-entry ledger"
  locale: my-MM
  workspace:
    lessonType: go
    name: Fintech Engineering
    entryFilePath: main.go
    files:
      ledger.go: |
        package main

        import (
        	"fmt"
        	"maps"
        	"slices"
        )

        // Entry moves Amount, in cents, out of one account and into another.
        type Entry struct {
        	From   string
        	To     string
        	Amount int64
        }

        // Ledger is an append-only list of entries. No balance is stored anywhere.
        type Ledger struct {
        	entries []Entry
        }

        // Record appends an entry. Nothing is ever updated in place.
        func (l *Ledger) Record(e Entry) {
        	l.entries = append(l.entries, e)
        }

        // Balance is derived from the entries: what came in minus what went out.
        func (l *Ledger) Balance(account string) int64 {
        	var b int64
        	for _, e := range l.entries {
        		if e.To == account {
        			b += e.Amount
        		}
        		if e.From == account {
        			b -= e.Amount
        		}
        	}
        	return b
        }

        // Accounts lists every account that appears in an entry, sorted.
        func (l *Ledger) Accounts() []string {
        	seen := map[string]bool{}
        	for _, e := range l.entries {
        		seen[e.From], seen[e.To] = true, true
        	}
        	return slices.Sorted(maps.Keys(seen))
        }

        // row prints one labelled amount: an account and its balance, or a total.
        func row(label string, amount int64) {
        	fmt.Printf("%-14s %8s\n", label, cents(amount))
        }

        // cents prints minor units as an amount with two decimals: cents(1234) is "12.34".
        func cents(n int64) string {
        	sign := ""
        	if n < 0 {
        		sign, n = "-", -n
        	}
        	return fmt.Sprintf("%s%d.%02d", sign, n/100, n%100)
        }
      main.go: |
        package main

        func main() {
        	var l Ledger
        	l.Record(Entry{From: "external:bank", To: "user:1042", Amount: 10000})
        	l.Record(Entry{From: "user:1042", To: "user:2077", Amount: 4000})
        	row("user:1042", l.Balance("user:1042"))
        	row("user:2077", l.Balance("user:2077"))
        }
