  - id: balanced
    chapter: Balance ညီတာ မှန်တာ မဟုတ်ဘူး
    narration: >-
      [[mark:close-derive]] စုစုပေါင်း သုည ဖြစ်တာက ဘယ်အထိ အာမခံလဲ စမ်းကြည့်ရအောင်။ [[mark:type-dup]]
      fee request က timeout ဖြစ်ပြီး client က retry လုပ်လိုက်လို့ အဲဒီ fee entry တစ်ကြောင်း ထပ်ဝင်သွားတယ်
      ဆိုပါစို့။ [[mark:ask-dup]] စုစုပေါင်းကို စစ်တဲ့ အပိုင်းက ဒီ အမှားကို ဖမ်းနိုင်မလား ဆိုတာ run မလုပ်ခင်
      ခန့်မှန်းကြည့်ပါ။ [[mark:run-3]] run လိုက်ရအောင်။ [[mark:pt-fees3]] fee ကို နှစ်ခါ ဖြတ်လိုက်လို့
      revenue က သုံးယူရို ဖြစ်သွားပြီး၊ [[mark:pt-57]] user မှာ ၅၇ ယူရိုပဲ ကျန်ပါတယ်။ [[mark:pt-total3]]
      ဒါပေမဲ့ စုစုပေါင်းကတော့ သုည ပါပဲ။ [[mark:dock-3]] ဒီ model မှာ entry တိုင်းက တစ်ဖက်မှာ ပေါင်းတာနဲ့
      တစ်ဖက်မှာ နုတ်တာ အမြဲ ညီလို့ စုစုပေါင်းက သုည မဟုတ်ဖို့ နည်းလမ်း မရှိပါဘူး။ ဆိုလိုတာက ဒီ total က bug ကို ဖမ်းတဲ့
      check မဟုတ်ဘဲ model ရဲ့ အာမခံချက် တစ်ခုပါ။ [[mark:show-limits]] ဒါဆို အဲဒီ အာမခံချက်က ဘာကို
      တားပေးလဲ။ [[mark:pt-g1]] source မရှိတဲ့ ငွေကိုတော့ လုံးဝ မဖြစ်နိုင်အောင် တားပေးပါတယ်။ [[mark:limits-2]]
      ဒါပေမဲ့ ခုနက entry ထပ်နေတာလို အမှားက balance ညီနေရင်းနဲ့ ဖြစ်နိုင်ပါတယ်။ [[mark:limits-3]] fee ကို
      account မှားပြီး ထည့်တာ၊ ပမာဏ မှားတာလည်း အတူတူပါပဲ၊ entry တစ်ကြောင်းချင်းက ညီနေတော့ စုစုပေါင်းက ဘယ်တော့မှ မပြောင်းပါဘူး။ [[mark:pt-next]] ဒီ အမှားတွေကို ဖမ်းတာက တခြား
      အလွှာတွေရဲ့ တာဝန်ပါ။ request တစ်ခုကို တစ်ခါပဲ မှတ်အောင် idempotency key သုံးတာ၊ ledger ကို
      ဘဏ်နဲ့ provider ရဲ့ မှတ်တမ်းတွေနဲ့ reconcile လုပ်တာတွေကို နောက်ပိုင်း lesson တွေမှာ ကြည့်ပါမယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Double-entry bookkeeping (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#double-entry-bookkeeping",
