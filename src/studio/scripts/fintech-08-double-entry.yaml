  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] Fintech interview တွေမှာ balance column ကို တိုက်ရိုက် UPDATE လုပ်တာ ဘာမှားလဲ လို့
      မေးလေ့ရှိပါတယ်။ race condition ဖြစ်နိုင်လို့ပါ လို့ပဲ ဖြေရင် မလုံလောက်ပါဘူး၊ အဲဒါက lock နဲ့
      ဖြေရှင်းလို့ ရတဲ့ ပြဿနာပါ။ အချက် သုံးချက်နဲ့ ဖြေပါ။ [[mark:iv-a]] ပထမ၊ history မရှိပါဘူး။
      တန်ဖိုး ဘာကြောင့် ပြောင်းလဲ ဆိုတာ row က မပြောနိုင်လို့ audit၊ user ရဲ့ dispute၊ debugging
      တွေအတွက် သက်သေ မကျန်ပါဘူး။ [[mark:iv-b]] ဒုတိယ၊ UPDATE တစ်ခုက ဘက်တစ်ဖက်တည်းမှာပဲ
      ပြောင်းလို့ source မရှိဘဲ ငွေ ပေါ်လာနိုင်၊ ပျောက်သွားနိုင်ပါတယ်။ entry မှာတော့ ထွက်တဲ့ account နဲ့ ဝင်တဲ့
      account ပါရလို့ စုစုပေါင်းက အမြဲ သုည ဖြစ်ပါတယ်။ [[mark:iv-c]] တတိယ၊ တန်ဖိုး တစ်ခုတည်း
      ရှိရင် ဘာနဲ့မှ တိုက်စစ်လို့ မရပါဘူး။ entry တွေကနေ ပြန်တွက်လို့ ရမှ cache လုပ်ထားတဲ့ balance ကို
      စစ်လို့ ရပါတယ်။ [[mark:iv-d]] ပြီးရင် ကိုယ် ဘာလုပ်မလဲ ဆက်ပြောပါ။ entry တွေကို append-only
      သိမ်းမယ်၊ balance ကို entry တွေကနေ တွက်ယူမယ်၊ write ကို idempotent ဖြစ်အောင်၊ ဆိုလိုတာက နှစ်ခါ
      ရောက်လာလည်း တစ်ခါပဲ မှတ်အောင် လုပ်မယ်။ balance ညီတာက မှန်တယ်လို့ မဆိုလိုလို့ပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Double-entry bookkeeping (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#double-entry-bookkeeping",
        }
    actions:
      - { id: show-iv, type: slide.show, at: { mark: show-iv, offsetMs: -700 }, slideId: iv-1 }
