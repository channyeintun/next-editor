  - id: derive
    chapter: Balance ကို တွက်ယူတယ်
    narration: >-
      [[mark:open-ledger]] balance ကို ဘယ်လို တွက်လဲ ကြည့်ရအောင်။ [[mark:sel-balance]] Balance က entry
      တိုင်းကို တစ်ကြောင်းချင်း ကြည့်ပြီး၊ ဒီ account ထဲ ဝင်တဲ့ ပမာဏကို ပေါင်း၊ ထွက်တဲ့ ပမာဏကို နုတ်ပါတယ်။
      [[mark:sel-record]] Record ကတော့ entry အသစ်ကို list ရဲ့ နောက်ဆုံးမှာ ထပ်ထည့်ရုံပါ၊ ရှိပြီးသား entry
      ကို ပြင်တဲ့ code ဘယ်နေရာမှာမှ မရှိပါဘူး။ ဒါကြောင့် balance က သိမ်းထားတဲ့ တန်ဖိုး မဟုတ်ဘဲ entry
      တွေကနေ တွက်ယူတဲ့ ရလဒ်ပဲ ဖြစ်ပါတယ်။ [[mark:open-main2]] ဒီ ledger ထဲမှာ ပါတဲ့ account အားလုံးကို
      စစ်ကြည့်ရအောင်။ [[mark:type-total]] fee entry ကို ထည့်ပြီးတော့၊ ledger ထဲမှာ ပေါ်တဲ့ account
      တိုင်းရဲ့ balance ကို ထုတ်ပြပြီး ပေါင်းပါမယ်။ ဘဏ်ရဲ့ account လည်း အဲဒီထဲမှာ ပါပါတယ်။
      [[mark:why-total]] ငွေ ဖန်တီးလို့ မရဘူး ဆိုတာ မှန်ရင် ဒီ ပေါင်းလဒ်က သုည ဖြစ်ရပါမယ်။ [[mark:run-2]]
      run လိုက်ရအောင်။ [[mark:pt-neg]] ဘဏ်ရဲ့ account က အနှုတ် ၁၀၀ ဖြစ်နေပါတယ်။ ယူရို ၁၀၀ က ဘဏ်ကနေ
      ထွက်ပြီး user ဆီ ရောက်သွားလို့ပါ။ [[mark:pt-585]] ပထမ user မှာ fee ဖြတ်ပြီး ငါးဆယ့်ရှစ်ယူရို
      ငါးဆယ်ဆင့် ကျန်ပါတယ်။ [[mark:pt-total]] account လေးခုလုံး ပေါင်းတော့ သုည အတိအကျ ရပါတယ်။
      [[mark:dock-2]] ဘဏ်မှာ ငွေ အနှုတ် ရှိတာ မဟုတ်လို့ ဒီ အနှုတ် လက္ခဏာကို ဘယ်လို ဖတ်ရမလဲ ဆိုတာ
      နောက် lesson ရဲ့ ခေါင်းစဉ်ပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Double-entry bookkeeping (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#double-entry-bookkeeping",
        }
    actions:
      - { id: open-ledger, type: workspace.openFile, at: { mark: open-ledger }, path: ledger.go }
      - id: sel-balance
        type: editor.select
        at: { mark: sel-balance }
        target:
          {
            file: ledger.go,
            text: "if e.To == account {\n\t\t\tb += e.Amount\n\t\t}\n\t\tif e.From == account {\n\t\t\tb -= e.Amount\n\t\t}",
            occurrence: 1,
          }
      - id: sel-record
        type: editor.select
        at: { mark: sel-record }
        target: { file: ledger.go, text: "l.entries = append(l.entries, e)", occurrence: 1 }
      - { id: open-main2, type: workspace.openFile, at: { mark: open-main2 }, path: main.go }
      - id: type-total
        type: editor.type
        at: { mark: type-total }
        target:
          {
            file: main.go,
            after: "\trow(\"user:2077\", l.Balance(\"user:2077\"))\n",
            occurrence: 1,
          }
        text: "\n\tl.Record(Entry{From: \"user:1042\", To: \"revenue:fees\", Amount: 150})\n\tvar total int64\n\tfor _, a := range l.Accounts() {\n\t\trow(a, l.Balance(a))\n\t\ttotal += l.Balance(a)\n\t}\n\trow(\"total\", total)\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "58.50",
          timeoutMs: 8000,
        }
      - id: pt-neg
        type: console.point
        at: { mark: pt-neg }
        target: { text: "-100.00", occurrence: 1 }
      - id: pt-585
        type: console.point
        at: { mark: pt-585 }
        target: { text: "58.50", occurrence: 1 }
      - id: pt-total
        type: console.point
        at: { mark: pt-total }
        target: { text: "total", occurrence: 1 }
      - { id: dock-2, type: runtime.collapseDock, at: { mark: dock-2 } }

  - id: cache
    narration: >-
      [[mark:show-derive]] ledger မှာ source of truth က entry တွေပါ။ ရှိပြီးသား row ကို UPDATE မလုပ်ဘဲ
      အသစ်ကိုပဲ ထပ်ထည့်တဲ့ append-only list ပါ။ [[mark:derive-2]] account တစ်ခုရဲ့ balance က အဲဒီ list
      ထဲမှာ သူ ပါတဲ့ entry တွေကို ပေါင်းနုတ်ထားတာပါ။ [[mark:pt-calc]] ဒါပေမဲ့ balance ကို
      ခေါ်တိုင်း entry အားလုံးကို ပြန်ဖတ်ရရင် account တစ်ခုမှာ entry သန်းချီ ရှိလာတဲ့အခါ နှေးပါတယ်။
      [[mark:derive-3]] ဒါကြောင့် balance ကို cache လုပ်ထားလို့ ရပါတယ်။ ကွာတာက cache က source of
      truth မဟုတ်တာပါ။ [[mark:pt-cache]] entry တွေကနေ ဘယ်အချိန်မဆို ပြန်ဆောက်လို့ ရပြီး၊ entry
      တွေကနေ ပြန်တွက်တာနဲ့ မကိုက်ရင် မှားနေတာက cache ပါ။ balance column မှာတော့ တန်ဖိုး
      မှားသွားရင် တိုက်စစ်စရာ တခြား ဘာမှ မရှိပါဘူး၊ မှားနေမှန်းတောင် မသိနိုင်ပါဘူး။
