scenes:
  - id: hook
    chapter: Balance column က မဖြေနိုင်တာ
    narration: >-
      ငွေကို မှတ်တဲ့ design တွေထဲမှာ အလွယ်ဆုံးက user တစ်ယောက်ကို balance column တစ်ခု
      ပေးထားတာပါ။ [[mark:show-column]] ငွေဝင်ရင် အဲဒီ column ကို ပေါင်းပြီး၊ ငွေထွက်ရင် နုတ်ပြီး
      UPDATE လုပ်ပါတယ်။ [[mark:pt-row]] ဒီ account မှာ ယူရို ၁၀၀ ရှိတယ် ဆိုပါစို့။ [[mark:column-2]]
      UPDATE တစ်ခု ပြီးတော့ balance က ၆၀ ဖြစ်သွားပါတယ်။ [[mark:pt-gap]] ကွာသွားတဲ့ ယူရို ၄၀ က ဘယ်ကို
      ရောက်သွားလဲ။ တခြား user ကို လွှဲလိုက်တာလား၊ fee ဖြတ်တာလား၊ request တစ်ခုကို နှစ်ခါ
      လုပ်မိတာလား၊ bug လား ဆိုတာ ဒီ row က မပြောနိုင်ပါဘူး။ [[mark:pt-only]] row ထဲမှာ ကျန်တာက
      လက်ရှိ တန်ဖိုး တစ်ခုတည်းပါ။ ဘယ်လို ဖြစ်လာလဲ ဆိုတာက UPDATE လုပ်လိုက်တဲ့ အချိန်မှာပဲ
      ပျောက်သွားပါပြီ။ user က ငွေ ဘယ်ရောက်သွားလဲ လို့ မေးတဲ့အခါ၊ auditor က ဒီ ၆၀ ကို ဘယ်လို
      ရလာလဲ လို့ မေးတဲ့အခါ ပြစရာ ဘာမှ မရှိတော့ပါဘူး။
    sources:
      - {
          title: "Fintech Engineering Handbook — Double-entry bookkeeping (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#double-entry-bookkeeping",
        }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }
      - {
          id: show-column,
          type: slide.show,
          at: { mark: show-column, offsetMs: -700 },
          slideId: column-1,
        }
      - { id: pt-row, type: slide.point, at: { mark: pt-row }, target: { x: 0.109, y: 0.476 } }
      - { id: column-2, type: slide.show, at: { mark: column-2 }, slideId: column-2 }
      - {
          id: pt-sql,
          type: slide.point,
          at: { afterAction: column-2 },
          target: { x: 0.124, y: 0.759 },
        }
      - { id: pt-gap, type: slide.point, at: { mark: pt-gap }, target: { x: 0.588, y: 0.464 } }
      - { id: pt-only, type: slide.point, at: { mark: pt-only }, target: { x: 0.682, y: 0.92 } }

  - id: move
    chapter: ငွေက ရွေ့တာပဲ
    narration: >-
      [[mark:show-move]] ledger ဆိုတာ ငွေ အရွေ့အပြောင်းတိုင်းကို မှတ်ထားတဲ့ စာရင်းပါ။ double-entry
      ledger က balance ကို မှတ်တာ မဟုတ်ဘဲ ငွေ ရွေ့တာ တစ်ခုချင်းကို entry တစ်ကြောင်းစီ အနေနဲ့
      မှတ်ပါတယ်။ [[mark:pt-a1]] entry တစ်ကြောင်းမှာ ငွေ ထွက်တဲ့ account၊ ဝင်တဲ့
      account နဲ့ ပမာဏ ဆိုပြီး သုံးခုပဲ ပါပါတယ်။ ပထမ entry က ဘဏ်ကနေ ယူရို ၁၀၀ ကို ပထမ user ရဲ့
      account ထဲ ထည့်တာပါ။ [[mark:pt-bank]] ဘဏ်ကိုယ်တိုင်လည်း account တစ်ခု ရတာကို သတိထားပါ။ ဘဏ်၊ card
      payment လက်ခံပေးတဲ့ PSP လို အပြင်ဘက်က provider တွေကိုလည်း သီးသန့် account ပေးထားတော့ ငွေ system ထဲ ဝင်လာတာ၊
      ထွက်သွားတာ အားလုံးက account နှစ်ခုကြား ရွေ့တာပဲ ဖြစ်သွားပါတယ်။ [[mark:move-2]] ဒုတိယ entry က
      ပထမ user ကနေ ဒုတိယ user ကို ယူရို ၄၀ လွှဲတာပါ။ balance column မှာ ပျောက်သွားခဲ့တဲ့ ၄၀ က ဒီမှာ
      ဘယ်ကနေ ဘယ်ကို သွားလဲ ဆိုတာနဲ့ အတူ ကျန်နေပါတယ်။ [[mark:move-3]] တတိယ entry က fee
      တစ်ယူရို ငါးဆယ်ဆင့်ကို platform ရဲ့ revenue account ထဲ ရွှေ့တာပါ။ [[mark:move-4]] account
      တိုင်းရဲ့ balance ကို entry တွေကနေ တွက်ပြီး အားလုံး ပေါင်းကြည့်ရင် သုည ရပါတယ်။ [[mark:pt-sum]]
      ဘာကြောင့်လဲဆိုတော့ entry တိုင်းက account တစ်ခုမှာ ပေါင်းတဲ့ ပမာဏ အတိုင်း နောက် account
      တစ်ခုမှာ နုတ်လို့ပါ။ ဆိုလိုတာက entry ရေးရုံနဲ့ ငွေ အသစ် ဖန်တီးလို့ မရဘဲ ရွှေ့လို့ပဲ ရပါတယ်။
      ငွေကို မရှိဘဲ မဖန်တီးရဘူး ဆိုတဲ့ No invented data မူကို data model ကိုယ်တိုင်က ထိန်းပေးတာပါ။
      [[mark:history]] ဒီနည်းက အသစ် မဟုတ်ပါဘူး။ ၁၄၉၄ ခုနှစ်မှာ Venice မှာ ပုံနှိပ်ခဲ့တဲ့ သင်္ချာ
      စာအုပ် တစ်အုပ်က double-entry ကို ပုံနှိပ်စာနဲ့ ပထမဆုံး ရှင်းပြခဲ့ပါတယ်။ အဲဒီ စာအုပ်ကတောင်
      ဒီနည်းကို Venice နည်းလို့ ခေါ်ထားတာပါ၊ ဆိုလိုတာက ပုံနှိပ်တာထက် အရင်ကတည်းက ကုန်သည်တွေ
      သုံးနေကြတဲ့ နည်းပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Double-entry bookkeeping (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#double-entry-bookkeeping",
        }
      - {
          title: "History of Information — Summa de arithmetica (Pacioli, 1494)",
          url: "https://www.historyofinformation.com/detail.php?entryid=2046",
        }
    actions:
      - {
          id: show-move,
          type: slide.show,
          at: { mark: show-move, offsetMs: -700 },
          slideId: move-1,
        }
      - { id: pt-a1, type: slide.point, at: { mark: pt-a1 }, target: { x: 0.318, y: 0.512 } }
      - { id: pt-bank, type: slide.point, at: { mark: pt-bank }, target: { x: 0.172, y: 0.598 } }
      - { id: move-2, type: slide.show, at: { mark: move-2 }, slideId: move-2 }
      - {
          id: pt-a2,
          type: slide.point,
          at: { afterAction: move-2 },
          target: { x: 0.612, y: 0.391 },
        }
      - { id: move-3, type: slide.show, at: { mark: move-3 }, slideId: move-3 }
      - { id: pt-a3, type: slide.point, at: { afterAction: move-3 }, target: { x: 0.828, y: 0.82 } }
      - { id: move-4, type: slide.show, at: { mark: move-4 }, slideId: move-4 }
      - { id: pt-sum, type: slide.point, at: { mark: pt-sum }, target: { x: 0.161, y: 0.871 } }
      - { id: move-5, type: slide.show, at: { mark: history }, slideId: move-5 }
      - {
          id: pt-hist,
          type: slide.point,
          at: { afterAction: move-5 },
          target: { x: 0.493, y: 0.864 },
        }

  - id: code
    narration: >-
      [[mark:close-move]] code နဲ့ ကြည့်ရအောင်။ [[mark:sel-entries]] ဒီ program က entry နှစ်ကြောင်း
      မှတ်ထားပါတယ်၊ deposit နဲ့ transfer ပါ။ ပမာဏတွေက ဆင့်နဲ့ ရေတွက်ထားတဲ့ ကိန်းပြည့်တွေ ဖြစ်လို့
      တစ်သောင်းက ယူရို ၁၀၀ ပါ။ [[mark:sel-rows]] အောက်က line နှစ်ကြောင်းက user နှစ်ယောက်ရဲ့
      balance ကို ထုတ်ပြတာပါ။ program ထဲမှာ balance ကို သိမ်းထားတဲ့ variable တစ်ခုမှ မရှိပါဘူး။
      [[mark:run-1]] run လိုက်ရအောင်။ [[mark:pt-60]] ပထမ user မှာ ယူရို ၆၀ ကျန်ပြီး၊ [[mark:pt-40]]
      ဒုတိယ user မှာ ၄၀ ရှိပါတယ်။ ဂဏန်းတွေက balance column နဲ့ အတူတူပါပဲ။ [[mark:dock-1]] ကွာတာက
      ၆၀ ဘာကြောင့် ဖြစ်လာလဲ ဆိုတာကို entry တွေက အမြဲ ပြန်ပြောပြနိုင်တာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Double-entry bookkeeping (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#double-entry-bookkeeping",
        }
    actions:
      - { id: close-move, type: slide.close, at: { mark: close-move } }
      - id: sel-entries
        type: editor.select
        at: { mark: sel-entries }
        target:
          {
            file: main.go,
            text: "l.Record(Entry{From: \"external:bank\", To: \"user:1042\", Amount: 10000})\n\tl.Record(Entry{From: \"user:1042\", To: \"user:2077\", Amount: 4000})",
            occurrence: 1,
          }
      - id: sel-rows
        type: editor.select
        at: { mark: sel-rows }
        target:
          {
            file: main.go,
