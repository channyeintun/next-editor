# AI Builder, lesson 14: the parts of a web app (Burmese, docs kind).
#
# Start state (ws/): base-docs (package.json with a no-op dev script, notes.md) + docs/plan.md as
# COURSE-KIT §4.7 (L13's final file; the recall points at row 1) + docs/system-map.md pinned with only
# its title line. Nothing runs. The lesson writes docs/system-map.md (COURSE-KIT §4.8, lesson-local;
# its full text is this lesson's): Parts · One order's journey · Where rules are checked.
#
# Boards: (J) one order's journey left to right — phone screen (frontend) → server (backend) → the
# counter's tablet, the database under the server, the reply on the phone, API on the first arrow,
# outside services at the bottom (blue = the product's parts, orange = this lesson's point, green =
# what works, red = what can fail, white = someone else's); (R) where a rule is checked, with the
# quantity rule as the example: the screen (convenient, can be skipped) vs the server (every order
# passes it); (Z) the quiz on the pickup-time rule.
#
# Build: bun ~/Documents/ai-builder-course-work/tools/build-lesson.ts template.yaml ws ai-builder-14-how-software-fits.yaml
schemaVersion: 1
lesson:
