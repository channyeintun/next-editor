          retry: { maxAttempts: 3, delayMs: 300 },
        }

  - id: edge-closed
    narration: >
      [[mark:sel-closed]] ဒုတိယ တစ်ကြောင်းက ဆိုင်ပိတ်ထားတဲ့ အချိန်ကို လာယူချိန်အဖြစ် ရွေးတာပါ။ ဒါကို စမ်းဖို့
      ခုနက ပြောင်းခဲ့တဲ့ အရေအတွက်ကို အရင် ပြန်ထားရပါမယ်။ [[mark:qty-back]] အရေအတွက်ကို နှစ်ခွက် ပြန်ထည့်ပါမယ်။
      [[mark:closed]] လာယူချိန်ကို မနက် နှစ်နာရီ လို့ ပြောင်းပါမယ်။ [[mark:order-closed]] ပြီးရင် မှာမယ် ကို
      ထပ်နှိပ်ပါမယ်။ [[mark:card-closed]] အော်ဒါနံပါတ် ၁၀၃ ရသွားပြီး၊ လာယူချိန် မနက် နှစ်နာရီ လို့
      ပြနေပါတယ်။ ဆိုင်က ဘယ်နေ့မှ မနက် ခြောက်နာရီ မတိုင်ခင် မဖွင့်ပါဘူး။ ဒီ customer က ပိတ်ထားတဲ့ ဆိုင်ရှေ့မှာ
      ရောက်နေမှာပါ။ AC သုံးကတော့ ဒီ အော်ဒါကို ငြင်းပြီး ဖွင့်ချိန်ကို ပြခိုင်းထားပါတယ်။
    sources:
      - {
