  - id: edge-zero
    chapter: Edge case တစ်ခုချင်း စမ်းရအောင်
    narration: >
      [[mark:open-req]] အခု ရေအောက်ကို ဆင်းကြည့်ရအောင်။ ခေါင်းထဲ ပေါ်လာတာကို လျှောက်စမ်းမယ့်အစား၊
      requirement ဖိုင်ထဲမှာ ရေးထားခဲ့တဲ့ edge case စာရင်းကို တစ်ကြောင်းချင်း လိုက်စမ်းပါမယ်။ တစ်ခါ စမ်းတိုင်း
      တစ်ခုတည်းကိုပဲ ပြောင်းပြီး၊ ကျန်တာတွေကို ပုံမှန်အတိုင်း ထားပါမယ်။ ဒါမှ ရလဒ် ထူးလာရင် ဘာကြောင့်လဲ ဆိုတာ
      ရှင်းရှင်းလင်းလင်း သိရမှာပါ။ [[mark:sel-zero]] ပထမ တစ်ကြောင်းက အရေအတွက်ပါ။ course ရဲ့ ပထမဆုံး lesson
      မှာ သုည ခွက် အော်ဒါကို သံသယ အဖြစ်ပဲ မှတ်ခဲ့ပါတယ်။ အခုတော့ အဖြေကို ရေးထားပြီးပါပြီ။ လက်မခံဘဲ
      တစ်ခွက်ကနေ နှစ်ဆယ်အထိ ရွေးခိုင်းရမှာပါ။ [[mark:zero]] အရေအတွက်ကို သုည လို့ ပြောင်းထည့်ပါမယ်။
      [[mark:order-zero]] မှာမယ် ကို နှိပ်ပြီး ဘာဖြစ်လဲ ကြည့်ပါမယ်။ [[mark:card-zero]] ငြင်းတဲ့ စာ
      တစ်ကြောင်းမှ မပေါ်ဘဲ၊ အော်ဒါနံပါတ် ၁၀၂ နဲ့ သုည ကျပ် အော်ဒါ တစ်ခု ဖြစ်သွားပါတယ်။ ဒါက AC နှစ်နဲ့
      မကိုက်ပါဘူး။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The developer's changing role (the 80% problem)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "The New SDLC (Burmese edition): The new SDLC (testing and quality assurance)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: open-req,
          type: workspace.openFile,
          at: { mark: open-req },
          path: docs/requirements.md,
        }
      - {
          id: sel-zero,
          type: editor.select,
          at: { mark: sel-zero },
          target:
            {
              file: docs/requirements.md,
              text: "- အရေအတွက် 0 ဒါမှမဟုတ် အနုတ် → လက်မခံ၊ 1 ကနေ 20 အထိ",
              occurrence: 1,
            },
        }
      - {
          id: in-qty-0,
          type: preview.input,
          at: { mark: zero },
          timeoutMs: 5000,
          target: { by: testId, value: qty },
          value: "0",
          retry: { maxAttempts: 2, delayMs: 250 },
        }
      - {
          id: click-zero,
          type: preview.click,
          at: { mark: order-zero },
          timeoutMs: 5000,
          target: { by: testId, value: order },
          retry: { maxAttempts: 1, delayMs: 0 },
        }
      - {
          id: expect-zero,
          type: expect.preview,
          at: { mark: card-zero },
          timeoutMs: 5000,
          target: { by: testId, value: result-total },
          textContains: "စုစုပေါင်း 0 ကျပ်",
          retry: { maxAttempts: 3, delayMs: 300 },
        }
      - {
          id: expect-number-2,
          type: expect.preview,
