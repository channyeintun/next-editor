      src/main.js: |
        // Shwe Tea House pre-order: the order form.
        const MENU = [
          { id: "laphet-yay", name: "လက်ဖက်ရည်", price: 1500 },
          { id: "coffee", name: "ကော်ဖီ", price: 1800 },
          { id: "lime-juice", name: "သံပုရာရည်", price: 1200 },
          { id: "mohinga", name: "မုန့်ဟင်းခါး", price: 2500 },
          { id: "palata", name: "ပလာတာ", price: 1200 },
          { id: "e-kya-kwe", name: "အီကြာကွေး", price: 500 },
        ];

        let nextNumber = 101;

        const form = document.querySelector("#order-form");
        const itemSelect = document.querySelector("#item");
        const result = document.querySelector("#result");

        function formatKyat(amount) {
          return `${amount.toLocaleString("en-US")} ကျပ်`;
        }

        for (const item of MENU) {
          const option = document.createElement("option");
          option.value = item.id;
          option.textContent = `${item.name} · ${formatKyat(item.price)}`;
          itemSelect.append(option);
        }

        function showOrder(order) {
          const field = (id) => result.querySelector(`[data-testid="${id}"]`);
          field("result-number").textContent = `အော်ဒါ #${order.number} ရပါပြီ`;
          field("result-line").textContent = `${order.item.name} × ${order.quantity}`;
          field("result-total").textContent = `စုစုပေါင်း ${formatKyat(order.total)}`;
          field("result-pickup").textContent = `လာယူချိန် ${order.pickup || "-"}`;
          result.hidden = false;
        }

        form.addEventListener("submit", (event) => {
          event.preventDefault();
          const data = new FormData(form);
          const item = MENU.find((entry) => entry.id === data.get("item"));
          const quantity = parseInt(data.get("quantity"), 10);
          showOrder({
            number: nextNumber++,
            item,
            quantity,
            total: item.price * quantity,
            pickup: data.get("pickup"),
            name: data.get("name"),
            phone: data.get("phone"),
          });
        });
