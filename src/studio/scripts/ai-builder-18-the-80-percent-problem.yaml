  - id: below
    narration: >
      [[mark:i-reopen]] ရေခဲတောင်ကို ပြန်ကြည့်ရအောင်။ [[mark:i-found]] စာရင်းထဲက စမ်းခဲ့တဲ့ သုံးကြောင်းလုံးမှာ
      app က ငြင်းရမယ့် အော်ဒါကို လက်ခံသွားပါတယ်။ app ပျက်သွားတာ၊ error ပြတာ တစ်ခုမှ မရှိပါဘူး။
      [[mark:i-shift]] အရင်က code ထဲမှာ စာလုံး တစ်လုံး မှားရုံနဲ့ program က လုံးဝ
      အလုပ်မလုပ်တော့တတ်လို့ အမှားကို ချက်ချင်း မြင်ရလေ့ ရှိပါတယ်။ agent ထုတ်ပေးတဲ့ code မှာတော့ အဲဒီလို အမှား နည်းလာပြီး၊
      ချောချောမွေ့မွေ့ အလုပ်လုပ်ပေမယ့် ယူဆချက် မှားနေတဲ့ အမှားတွေ ပိုတွေ့လာရပါတယ်။ ဒီ app ကလည်း ဘယ်
      အရေအတွက်၊ ဘယ်အချိန် ဖြစ်ဖြစ် ရတယ်လို့ ယူဆထားသလိုပါပဲ။ မှန်သလို ပုံပေါ်နေလို့ ဖမ်းရ ပိုခက်တာပါ။
      [[mark:i-counter]] ရေအောက်မှာ နောက်တစ်ခု ကျန်ပါသေးတယ်။ customer ရဲ့ ဖုန်းပေါ်မှာ အော်ဒါနံပါတ်
      ရပေမယ့်၊ လှလှ ကြည့်ရမယ့် ကောင်တာစာရင်းကို မဆောက်ရသေးပါဘူး။ customer ဘက်က ကြည့်ရင် ပြီးနေသလို ထင်ရပေမယ့်၊
      အော်ဒါက ကောင်တာဆီ မရောက်သေးတာပါ။ [[mark:close-i]] ဒီ တွေ့ရှိချက်တွေကို notes ဖိုင်ထဲမှာ တိုတိုလေး
      မှတ်ထားရအောင်။ [[mark:type-found]] ရေပေါ် တစ်ကြောင်း၊ ရေအောက် တစ်ကြောင်း ခွဲရေးထားတော့၊ app ကို
      ဘယ်နေရာမှာ ယုံလို့ရပြီး ဘယ်နေရာမှာ မယုံရသေးလဲ ဆိုတာ တစ်ချက်ကြည့်ရုံနဲ့ သိရပါတယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The developer's changing role (the 80% problem)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "The New SDLC (Burmese edition): Where to start",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - { id: reopen-i, type: whiteboard.apply, at: { mark: i-reopen }, open: true }
      - {
          id: draw-i-found,
          type: whiteboard.apply,
          at: { mark: i-found },
          upsertIds: [i-x1],
          drawMs: 1000,
        }
      - {
          id: draw-i-shift,
          type: whiteboard.apply,
          at: { mark: i-shift },
          upsertIds: [i-x2],
          drawMs: 900,
        }
      - {
          id: draw-i-counter,
          type: whiteboard.apply,
          at: { mark: i-counter },
          upsertIds: [i-x3],
          drawMs: 900,
        }
      - { id: close-i, type: whiteboard.apply, at: { mark: close-i }, open: false }
      - { id: open-notes, type: workspace.openFile, at: { afterAction: close-i }, path: notes.md }
      - id: type-found
        type: editor.type
        at: { mark: type-found }
        target: { file: notes.md, after: "# Notes\n", occurrence: 1 }
        text: "\n## Lesson 18 · 80% problem\n- ရေပေါ် — ပုံမှန် အော်ဒါ မှန်တယ် (AC-1)။\n- ရေအောက် — 0 ခွက်၊ 02:00၊ ဖုန်း မပါ၊ သုံးခုလုံး လက်ခံတယ်။\n"
        cadence: line-by-line

  - id: attention
    chapter: အာရုံကို ဘယ်မှာ ထားမလဲ
    narration: >
      [[mark:a-title]] ဒါဆို agent နဲ့ဆိုရင် အလုပ်က တကယ် ပိုမြန်သွားသလား။ [[mark:a-study]] ၂၀၂၅ ခုနှစ်
      အစပိုင်းက AI tool တွေနဲ့ လုပ်ခဲ့တဲ့ လေ့လာမှု တစ်ခုမှာ၊ အတွေ့အကြုံ ရင့်တဲ့ developer ၁၆ ယောက်ကို
      သူတို့ နှစ်နဲ့ချီ ရေးလာခဲ့တဲ့ project ကြီးတွေထဲက တကယ့် task တွေနဲ့ စမ်းခဲ့ပါတယ်။ AI tool သုံးခွင့် ရတဲ့ task တွေမှာ ပိုမြန်မယ်လို့
      သူတို့ ထင်ခဲ့ကြပေမယ့်၊ [[mark:a-measured]] တကယ် တိုင်းကြည့်တော့ ၁၉ ရာခိုင်နှုန်း ပိုကြာခဲ့ပါတယ်။
      ပြီးသွားတဲ့ နောက်မှာတောင် ပိုမြန်ခဲ့တယ်လို့ ထင်နေကြတုန်းပါ။ [[mark:a-caveat]] ဒီ ရလဒ်က developer တိုင်း၊
      tool တိုင်းအတွက် မှန်တယ်လို့ လေ့လာသူတွေကိုယ်တိုင် မပြောပါဘူး။ နောက်ပိုင်း tool အသစ်တွေနဲ့ ရလဒ်
      ပြောင်းနိုင်တယ်လို့လည်း သူတို့ ဆိုပါတယ်။ [[mark:a-point]] ဘယ်လိုပဲ ဖြစ်ဖြစ်၊ ထုတ်ပေးတာ မြန်တာနဲ့ အလုပ်
      ပြီးတာ မြန်တာ မတူပါဘူး။ ထွက်လာတာကို စစ်တာ၊ ပြင်တာက အချိန် တကယ် ယူပြီး၊ မြန်တယ် နှေးတယ်
      ဆိုတာကိုလည်း ခံစားချက်နဲ့ မဟုတ်ဘဲ တိုင်းကြည့်မှ သိရပါတယ်။ [[mark:a-cheap]] အချိန်က အကန့်အသတ်
      ရှိတော့၊ အာရုံကို ဘယ်မှာ ထားမလဲ ရွေးရပါမယ်။ page ပေါ်လား၊ မြန်မာစာတွေ မှန်မှန် ပေါ်လား ဆိုတာမျိုးက
      တစ်ချက် ကြည့်ရုံနဲ့ သိရပြီး၊ နောက်ပိုင်းမှာ စက်ကို အလိုလို စစ်ခိုင်းလို့လည်း ရပါတယ်။ [[mark:a-mine]]
      ကိုယ့် အာရုံကို အများဆုံး ပေးရမှာကတော့ ဆိုင်ကို သိမှ ဆုံးဖြတ်လို့ရတဲ့ နေရာတွေပါ။ ဆိုင်ရဲ့ စည်းကမ်းတွေ၊
      edge case တွေ၊ ပြီးတော့ အော်ဒါ တစ်ခု ကောင်တာအထိ ရောက်တဲ့ လမ်းတစ်လျှောက်လုံးပါ။ agent ထုတ်ပေးသမျှကို
      လက်ခံပြီး မြန်အောင် လုပ်မယ့်အစား၊ ကိုယ့် အသိ အရေးပါဆုံး နေရာမှာ အချိန်ပေးရပါမယ်။ [[mark:close-a]]
      ဒီ အချက်ကိုလည်း notes ထဲ ထည့်ထားပါမယ်။ [[mark:type-attention]] ဒီ စာကြောင်းက နောက်တစ်ခါ app ကို
      စစ်တဲ့အခါ ဘယ်ကနေ စမလဲ ဆိုတာကို ဆုံးဖြတ်ထားတာပါ။ screen ရဲ့ ပုံစံထက်၊ ငြင်းရမယ့် ကိစ္စတွေကို
      အရင် စမ်းမှာ ဖြစ်ပါတယ်။
    sources:
      - {
          title: "METR: Measuring the Impact of Early-2025 AI on Experienced Open-Source Developer Productivity",
          url: "https://metr.org/blog/2025-07-10-early-2025-ai-experienced-os-dev-study/",
        }
      - {
          title: "METR: We are Changing our Developer Productivity Experiment Design (2026-02-24 update)",
          url: "https://metr.org/blog/2026-02-24-uplift-update/",
        }
      - {
          title: "The New SDLC (Burmese edition): The developer's changing role (the 80% problem)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "The New SDLC (Burmese edition): The new SDLC (implementation)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: open-board-a,
          type: whiteboard.apply,
          at: { mark: a-title },
          open: true,
          clear: true,
          upsertIds: [a-title],
        }
      - {
          id: draw-a-study,
          type: whiteboard.apply,
          at: { mark: a-study },
          upsertIds: [a-ctx, a-s1],
          drawMs: 1200,
        }
      - {
          id: draw-a-measured,
          type: whiteboard.apply,
          at: { mark: a-measured },
          upsertIds: [a-s2],
          drawMs: 900,
        }
      - {
          id: draw-a-caveat,
          type: whiteboard.apply,
          at: { mark: a-caveat },
          upsertIds: [a-cav],
          drawMs: 900,
        }
      - {
          id: draw-a-point,
          type: whiteboard.apply,
          at: { mark: a-point },
          upsertIds: [a-s3],
          drawMs: 900,
        }
      - {
          id: draw-a-cheap,
          type: whiteboard.apply,
          at: { mark: a-cheap },
          upsertIds: [a-h1, a-l1, a-l2],
          drawMs: 1400,
        }
      - {
          id: draw-a-mine,
          type: whiteboard.apply,
          at: { mark: a-mine },
          upsertIds: [a-h2, a-r1, a-r2, a-r3],
          drawMs: 1800,
        }
      - { id: close-a, type: whiteboard.apply, at: { mark: close-a }, open: false }
      - id: type-attention
        type: editor.type
        at: { mark: type-attention }
        target: { file: notes.md, after: "သုံးခုလုံး လက်ခံတယ်။\n", occurrence: 1 }
        text: "- အာရုံ — ရေအောက်ကို အရင် စစ်။\n"
        cadence: line-by-line
      - {
          id: expect-notes,
          type: expect.file,
          at: { afterAction: type-attention },
          path: notes.md,
          contains: "- ရေအောက် — 0 ခွက်၊ 02:00၊ ဖုန်း မပါ၊ သုံးခုလုံး လက်ခံတယ်။",
        }

  - id: quiz
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ အောင်အောင် ရဲ့ လက်ဖက်ရည် နှစ်ခွက် အော်ဒါက အားလုံး မှန်နေပါပြီ။
      နောက်ထပ် တစ်ခါပဲ စမ်းခွင့် ရှိတယ် ဆိုပါစို့။ ကော်ဖီ သုံးခွက်နဲ့ ပုံမှန် အော်ဒါ တစ်ခု စမ်းမလား၊ အခုချိန်ကနေ
      ငါးမိနစ်ပဲ ကြိုပြီး လာယူမယ့် အော်ဒါ စမ်းမလား။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ငါးမိနစ်ပဲ ကြိုတဲ့ အော်ဒါပါ။ ဘာကြောင့်လဲဆိုတော့ spec ရဲ့ စည်းကမ်းထဲမှာ
      အနည်းဆုံး ၁၅ မိနစ် ကြိုမှာရမယ်လို့ ရှိပြီး၊ အဲဒါက screen ပေါ်မှာ မမြင်ရတဲ့ ရေအောက်က အပိုင်းမို့ပါ။ ဒီ စည်းကမ်းကို စစ်မယ့် AC လည်း မရှိသေးပါဘူး။ ကော်ဖီ
      အော်ဒါကတော့ ခုနက မှန်ခဲ့တဲ့ လမ်းအတိုင်းပဲ သွားမှာ ဖြစ်လို့ အသစ် သိရမှာ နည်းပါတယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The developer's changing role (the 80% problem)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [z-title, z-q1, z-q2, z-o1, z-o2],
          drawMs: 2400,
        }
      - {
          id: draw-quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [z-a, z-r1, z-r2],
          drawMs: 1800,
        }

  - id: recap
    chapter: ပြန်ချုပ်ရရင်
    narration: >
      [[mark:close-quiz]] ဒါဆို ပြန်ချုပ်ရရင်၊ agent က မြင်ရလွယ်တဲ့ ရေပေါ်က အပိုင်းကို မြန်မြန် ထုတ်ပေးနိုင်ပါတယ်။
      [[mark:sel-top]] ဒါကြောင့် ပုံမှန် အော်ဒါ တစ်ခု မှန်တာက စမှတ်ပဲ ရှိပါသေးတယ်။ [[mark:sel-bottom]] edge case၊
      စည်းကမ်း၊ ငြင်းပုံ၊ အပိုင်းချင်း ချိတ်တာ စတဲ့ ရေအောက်က အပိုင်းကိုတော့ ကိုယ်တိုင် စမ်းမှ တွေ့ရပြီး၊ ဒီနေ့
      စမ်းတဲ့ သုံးခုလုံးမှာ app က မှားနေတာကို မြင်ခဲ့ရပါတယ်။ [[mark:sel-attention]] စစ်တာက အချိန် တကယ်
      ယူလို့၊ ကိုယ့် အာရုံကို ဆိုင်ကို သိမှ ဆုံးဖြတ်လို့ရတဲ့ နေရာမှာ ထားရပါမယ်။ ဒီနေ့က စာရင်းကို လက်နဲ့
      လိုက်စမ်းပြီး တိုတိုပဲ မှတ်ခဲ့ပါတယ်။ နောက် lesson မှာတော့ ဘယ်သူမဆို ထပ်ခါထပ်ခါ စနစ်တကျ စစ်နိုင်အောင်၊ ဘာမြင်ရမလဲ
      ဆိုတာကို မစမ်းခင် ကြိုရေးထားတဲ့ test plan ကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The developer's changing role (the 80% problem)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "The New SDLC (Burmese edition): Where to start",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: close-quiz }, open: false }
      - {
          id: sel-top,
          type: editor.select,
          at: { mark: sel-top },
          target: { file: notes.md, text: "ရေပေါ် — ပုံမှန် အော်ဒါ မှန်တယ် (AC-1)။", occurrence: 1 },
        }
      - {
          id: sel-bottom,
          type: editor.select,
          at: { mark: sel-bottom },
          target:
            { file: notes.md, text: "ရေအောက် — 0 ခွက်၊ 02:00၊ ဖုန်း မပါ၊ သုံးခုလုံး လက်ခံတယ်။", occurrence: 1 },
        }
      - {
          id: sel-attention,
          type: editor.select,
          at: { mark: sel-attention },
          target: { file: notes.md, text: "အာရုံ — ရေအောက်ကို အရင် စစ်။", occurrence: 1 },
        }
checks:
  - { type: timing.p95Ms, max: 300 }
