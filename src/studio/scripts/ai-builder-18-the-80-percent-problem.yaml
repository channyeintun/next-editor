  - id: edge-phone
    narration: >
      [[mark:sel-phone]] တတိယ တစ်ကြောင်းက ဖုန်းနံပါတ် မပါတဲ့ အော်ဒါပါ။ [[mark:time-back]] လာယူချိန်ကို
      ရှစ်နာရီခွဲ ပြန်ရွေးပါမယ်။ [[mark:phone-empty]] ဖုန်းနံပါတ်ကိုတော့ ဖျက်ပြီး အလွတ် ထားလိုက်ပါမယ်။
      [[mark:order-phone]] မှာမယ် ကို နောက်တစ်ခါ နှိပ်ပါမယ်။ [[mark:card-phone]] ဒီတစ်ခါလည်း အော်ဒါနံပါတ်
      ၁၀၄ နဲ့ လက်ခံသွားပါတယ်။ customer မလာရင် ကောင်တာက လှလှ ဖုန်းဆက်စရာ နံပါတ်
      မရှိတော့ပါဘူး။ AC လေးအရ ဒီလို အော်ဒါမှာ ဖုန်းနံပါတ် ထည့်ခိုင်းရမှာပါ။
      စာရင်းရဲ့ နောက်ဆုံး တစ်ကြောင်းကိုတော့ နောက် lesson မှာ စမ်းပါမယ်။
