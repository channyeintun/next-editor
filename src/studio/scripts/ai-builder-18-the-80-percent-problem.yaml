# AI Builder, lesson 18: the 80% problem (Burmese, preview kind).
#
# Start state (ws/): the tea-shop pre-order app exactly as base-app/ ("the first version an agent
# built", prepared for the lesson; never edited, never typed into), docs/requirements.md (COURSE-KIT
# §4.2, complete), docs/spec.md (§4.3 without AC-6) and notes.md with only "# Notes".
# The runtime starts at the first mark; the recall and the iceberg board carry ~1,500 narration
# characters before runtime.waitForReady.
#
# Boards: (I) the iceberg: above the waterline the screen and the happy path (blue, the agent's fast
# 80% in violet), below it edges, unwritten rules, refusing bad input and the parts connecting (red
# box, "20% · ကိုယ်က စစ်" in orange); reopened after the tries and annotated in red. (A) time and
# attention: the 2025 study as measured, with its caveat, then where to spend attention (two
# columns). (Z) the quiz.
# Preview: အောင်အောင်'s order (2 milk teas, 08:30) → #101, 3,000 ကျပ်; then requirements.md's first
# three edge cases, one change at a time: quantity 0 → #102, 0 ကျပ်; quantity back to 2, pickup 02:00
# → #103, 02:00; pickup back to 08:30, phone empty → #104. Each is accepted (COURSE-KIT §3).
# notes.md gets "## Lesson 18 · 80% problem" and three lines; the recap selects them.
#
