build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 6118
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: အလုပ်လုပ်တာနဲ့ မှန်တာ
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ agent က မလိုတဲ့ အပိုတွေ ထည့်တတ်လို့ အရိုးရှင်းဆုံး နည်းကို
      ရွေးခိုင်းပြီး၊ app ကို သေးသေး ထိန်းခဲ့ပါတယ်။ ဒီနေ့တော့ order form ရဲ့ ပထမ version ကို
      စစ်ကြည့်ပါမယ်။ form ကို ဖြည့်ပြီး မှာမယ် ကို နှိပ်လိုက်ရင် အော်ဒါနံပါတ် ထွက်လာတော့၊ ပြီးသွားပြီလို့
      ထင်စရာ ရှိပါတယ်။ [[mark:sel-rules]] ဒါပေမဲ့ app တစ်ခု အလုပ်လုပ်တာနဲ့ မှန်တာ မတူပါဘူး။ ဒီ requirement
      ဖိုင်ထဲက edge case တွေလို ဆိုင်ပိုင်ရှင် ရဲ့ စည်းကမ်းတွေ၊ ကောင်တာက လှလှ ရဲ့ မနက်ခင်း အလုပ်နဲ့
      ကိုက်မှပဲ မှန်တယ်လို့ ပြောလို့ ရပါတယ်။ ဒီ lesson မှာ အဲဒီ ကွာခြားချက်ကို ရှာကြည့်ပါမယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The developer's changing role (the 80% problem)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "The New SDLC (Burmese edition): The economics of AI development",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: start-runtime,
          type: runtime.start,
          at: { mark: start },
          timeoutMs: 60000,
          retry: { maxAttempts: 2, delayMs: 500 },
        }
      - {
          id: open-req-start,
          type: workspace.openFile,
          at: { mark: sel-rules, offsetMs: -700 },
          path: docs/requirements.md,
        }
      - {
          id: sel-rules,
          type: editor.select,
          at: { mark: sel-rules },
          target: { file: docs/requirements.md, text: "## Edge cases", occurrence: 1 },
        }

  - id: iceberg
    narration: >
      [[mark:i-title]] ဒီလို ကွာခြားချက်ကို ၈၀ ရာခိုင်နှုန်း problem လို့ ခေါ်ကြပါတယ်။ ၈၀ နဲ့ ၂၀ ဆိုတာ
      တိုင်းထားတဲ့ ကိန်းဂဏန်း မဟုတ်ဘဲ၊ မှတ်မိလွယ်အောင် ပြောတဲ့ ပုံစံပါ။ ရေခဲတောင် ပုံလေး တစ်ခုနဲ့
      ကြည့်ရအောင်။ [[mark:i-top]] ရေပေါ်မှာ ပေါ်နေတဲ့ အပိုင်းက screen တွေနဲ့ happy path ပါ။ happy path ဆိုတာ
      customer က ပုံမှန်အတိုင်း ဖြည့်ပြီး ပုံမှန်အတိုင်း မှာသွားတဲ့ လမ်းပါ။ [[mark:i-agent]] ဒီ အပိုင်းကို agent
      က အရမ်း မြန်မြန် ထုတ်ပေးနိုင်ပါတယ်။ မျက်စိနဲ့ မြင်ရလွယ်တော့ စမ်းရလည်း လွယ်ပြီး၊ ဒီ အပိုင်း မှန်နေရင် app
      တစ်ခုလုံး မှန်ပြီလို့ ထင်မိတတ်ပါတယ်။ [[mark:i-line]] ဒီ မျဉ်းက ရေမျက်နှာပြင်ပါ။ အောက်ကို ငုံ့ကြည့်မှ
      မြင်ရတဲ့ အပိုင်းတွေ ရှိပါတယ်။ [[mark:i-below]] ပုံမှန် မဟုတ်တဲ့ အနားသတ်က edge case တွေ၊ ဘယ်သူမှ
      ချရေးမထားတဲ့ ဆိုင်ရဲ့ စည်းကမ်းတွေ ရှိပါတယ်။ customer က မှားထည့်ရင် ငြင်းပြီး ဘာလုပ်ရမလဲ
      ပြောပြတာ၊ ပြီးတော့ customer ရဲ့ ဖုန်းကနေ ကောင်တာအထိ အပိုင်းချင်း ချိတ်ဆက်တာတွေလည်း
      ရှိပါတယ်။ [[mark:i-why]] ဒီ အပိုင်းတွေက ဆိုင်ကို သိမှ မှန်အောင် လုပ်နိုင်တဲ့ အပိုင်းတွေပါ။ document
      တွေမှာ ရေးထားရင်တောင် agent က အကုန် လိုက်လုပ်မယ်လို့ အာမခံချက် မရှိပါဘူး။ မရေးထားတဲ့ ကိစ္စ
      ဆိုရင်တော့ ဖြစ်နိုင်လောက်တာကို ခန့်မှန်းပြီး ထုတ်ပေးတာပါ။ [[mark:i-me]] ဒါကြောင့် ရေအောက်က အပိုင်းကို
      ကိုယ်က စစ်ရပါမယ်။ ထွက်လာတာ မှန်မမှန် စစ်တဲ့ ဒီ အလုပ်ကို verification လို့ ခေါ်ပါတယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The developer's changing role (the 80% problem)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "The New SDLC (Burmese edition): The new SDLC (implementation)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: open-board-i,
          type: whiteboard.apply,
          at: { mark: i-title },
          open: true,
          clear: true,
          upsertIds: [i-title],
        }
      - {
          id: draw-i-top,
          type: whiteboard.apply,
          at: { mark: i-top },
          upsertIds: [i-top-box, i-top1, i-top2],
          drawMs: 1400,
        }
      - {
          id: draw-i-agent,
          type: whiteboard.apply,
          at: { mark: i-agent },
          upsertIds: [i-agent],
          drawMs: 900,
        }
      - {
          id: draw-i-line,
          type: whiteboard.apply,
          at: { mark: i-line },
          upsertIds: [i-line],
          drawMs: 900,
        }
      - {
          id: draw-i-below,
          type: whiteboard.apply,
          at: { mark: i-below },
          upsertIds: [i-bot-box, i-b1, i-b2, i-b3, i-b4],
          drawMs: 2600,
        }
      - {
          id: draw-i-me,
          type: whiteboard.apply,
          at: { mark: i-me },
          upsertIds: [i-me],
          drawMs: 900,
        }

  - id: app
    chapter: ရေပေါ်က အပိုင်းကို စစ်ရအောင်
    narration: >
      [[mark:ready]] ကဲ၊ ရေပေါ်က အပိုင်းကို အရင် စစ်ကြည့်ရအောင်။ ညာဘက်မှာ ကြိုမှာ app ကို မြင်ရပါပြီ။
      ဒီ app က agent တစ်ခု ထုတ်ပေးတဲ့ order form ရဲ့ ပထမ version လို့ သဘောထားပြီး lesson အတွက် ပြင်ဆင်ထားတာပါ။
      [[mark:menu]] member အောင်အောင် မနက်တိုင်း မှာနေကျ အော်ဒါနဲ့ စမ်းပါမယ်။ လက်ဖက်ရည်ကို ရွေးပြီးသား
      ဖြစ်နေပါတယ်။ [[mark:qty]] အရေအတွက်ကို နှစ်ခွက်လို့ ထည့်ပါမယ်။ [[mark:time]] လာယူချိန်ကို မနက်
      ရှစ်နာရီခွဲ လို့ ရွေးပါမယ်။ [[mark:name]] နာမည်နေရာမှာ အောင်အောင် လို့ ရိုက်ပါမယ်။ [[mark:phone]]
      ဖုန်းနေရာမှာ lesson အတွက် နမူနာ နံပါတ် ထည့်ပါမယ်။ [[mark:order]] ပြီးတော့ မှာမယ် ကို နှိပ်လိုက်ပါမယ်။
      [[mark:card]] အော်ဒါနံပါတ် ၁၀၁ ရပါပြီ။ လက်ဖက်ရည် နှစ်ခွက်၊ စုစုပေါင်း ၃၀၀၀ ကျပ်၊ လာယူချိန်
      ရှစ်နာရီခွဲ ဆိုတော့၊ spec ထဲမှာ ပြီးပြီ ဆိုတာ စစ်ဖို့ ရေးထားတဲ့ acceptance criteria ရဲ့ ပထမ တစ်ခု၊ AC
      တစ်နဲ့ ကိုက်ပါတယ်။ ရေအောက်ကိုတော့ မစမ်းရသေးပါဘူး။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The developer's changing role (the 80% problem)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: close-board-i,
          type: whiteboard.apply,
          at: { scene: start, offsetMs: -400 },
          open: false,
        }
      - {
          id: wait-ready,
          type: runtime.waitForReady,
          at: { mark: ready },
          timeoutMs: 30000,
          retry: { maxAttempts: 2, delayMs: 250 },
        }
      - {
          id: open-preview,
          type: preview.open,
          at: { afterAction: wait-ready },
          timeoutMs: 10000,
          mode: docked,
          retry: { maxAttempts: 2, delayMs: 250 },
        }
      - {
          id: expect-menu,
          type: expect.preview,
          at: { mark: menu },
          timeoutMs: 5000,
          target: { by: testId, value: item },
          textContains: "လက်ဖက်ရည်",
          retry: { maxAttempts: 3, delayMs: 300 },
        }
      - {
          id: in-qty,
          type: preview.input,
          at: { mark: qty },
          timeoutMs: 5000,
          target: { by: testId, value: qty },
          value: "2",
          retry: { maxAttempts: 2, delayMs: 250 },
        }
      - {
          id: in-time,
          type: preview.input,
          at: { mark: time },
          timeoutMs: 5000,
          target: { by: testId, value: pickup },
          value: "08:30",
          retry: { maxAttempts: 2, delayMs: 250 },
        }
      - {
          id: in-name,
          type: preview.input,
          at: { mark: name },
          timeoutMs: 5000,
          target: { by: testId, value: name },
          value: "အောင်အောင်",
          retry: { maxAttempts: 2, delayMs: 250 },
        }
      - {
          id: in-phone,
          type: preview.input,
          at: { mark: phone },
          timeoutMs: 5000,
          target: { by: testId, value: phone },
          value: "09 000 111 222",
          retry: { maxAttempts: 2, delayMs: 250 },
        }
      - {
          id: click-order,
          type: preview.click,
          at: { mark: order },
          timeoutMs: 5000,
          target: { by: testId, value: order },
          retry: { maxAttempts: 1, delayMs: 0 },
        }
      - {
          id: expect-number,
          type: expect.preview,
          at: { mark: card },
          timeoutMs: 5000,
          target: { by: testId, value: result-number },
          textContains: "#101",
          retry: { maxAttempts: 3, delayMs: 300 },
        }
      - {
          id: expect-line,
