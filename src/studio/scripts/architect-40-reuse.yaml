          upsertIds: [q-home],
          drawMs: 1200,
        }

  - id: home
    chapter: စည်းမျဉ်း တစ်ခု၊ အိမ် တစ်ခု
    narration: >
      [[mark:h-close]] ဒီ ဆုံးဖြတ်ချက်ကိုလည်း table ထဲ ထည့်လိုက်ပါမယ်။
      [[mark:type-comm]] commission စည်းမျဉ်းရဲ့ အိမ်က Settlement ပါ။ စည်းမျဉ်း ပြောင်းတဲ့အခါ တစ်နေရာတည်းမှာ ပြင်ရုံနဲ့
      အားလုံးအတွက် ပြောင်းသွားပါမယ်။
      [[mark:h-context]] ဒီ table ကနေ လမ်းညွှန် တစ်ခု ထုတ်လို့ ရပါတယ်။ bounded context တစ်ခုအတွင်းမှာ စည်းမျဉ်း
      တစ်ခုအတွက် အိမ် တစ်ခုပဲ ထားပါ။ bounded context ဆိုတာ စကားလုံး တစ်လုံးက အဓိပ္ပာယ် တစ်ခုတည်း ရှိတဲ့
      နယ်နိမိတ်ပါ။ context တွေကို ဖြတ်တဲ့အခါမှာတော့ ကူးယူထားတာက များသောအားဖြင့် ပိုသက်သာတဲ့ coupling ပါ။
      [[mark:h-price]] ဥပမာ ဈေးနှုန်း ဆိုတာ Booking အတွက် ခရီးသည် ပေးရမယ့် ငွေ ဖြစ်ပြီး၊ Settlement အတွက်တော့ ကားလိုင်း
      ရမယ့် ငွေပါ။ နှစ်ခုကို class တစ်ခုတည်းနဲ့ မျှသုံးလိုက်ရင်၊ တစ်ဖက်ရဲ့ ပြောင်းလဲမှုတိုင်းက နောက်တစ်ဖက်ကို
      လိုက်ထိပါလိမ့်မယ်။
      [[mark:h-fair]] မောင်မောင် ရဲ့ အဆိုပြုချက်က မှားတာ မဟုတ်ပါဘူး။ မိတ္တူတွေ ကွဲနေတဲ့ ပြဿနာကို သူ မြင်တာ မှန်ပါတယ်။
      ကွာသွားတာက အရာအားလုံးကို နည်း တစ်မျိုးတည်းနဲ့ မဖြေရှင်းဘဲ၊ တစ်ခုစီကို သူ့ ပြောင်းနှုန်းအလိုက် ရွေးလိုက်တာပါ။
      [[mark:sel-rule]] အောက်ဆုံးက စာကြောင်းက ဒီ lesson ကို ချုပ်ထားတာပါ။ မျှသုံးမယ့် အရာ တစ်ခုစီကို ဘယ်လောက် ပြောင်းလဲ
      မေးပြီးမှ နည်းကို ရွေးပါ။ common တစ်ခုတည်းထဲ အကုန် မထည့်ပါနဲ့။
    sources:
      - {
          title: "Software Architecture: The Hard Parts (Ford, Richards, Sadalage, Dehghani)",
          url: "https://oreil.ly/sa-the-hard-parts",
        }
      - {
          title: "Building Evolutionary Architectures, 2nd edition (Ford, Parsons, Kua, Sadalage)",
          url: "https://oreil.ly/evolutionary-arch-2e",
        }
