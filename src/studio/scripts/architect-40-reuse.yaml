  - id: your-turn
    chapter: ကိုယ့် system အတွက်
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ ကိုယ့် system ထဲမှာလည်း common၊ shared၊ utils လို နာမည်နဲ့ folder ဒါမှမဟုတ် library
      တစ်ခု ရှိနေတတ်ပါတယ်။ lesson ကို pause လုပ်ပြီး၊ အဲဒီထဲက သုံးခုကို ရွေးပြီး ဒီ table ထဲမှာ ကိုယ့် project အတွက်
      ရေးကြည့်ပါ။
      [[mark:turn-2]] တစ်ခုစီအတွက် ပြီးခဲ့တဲ့ နှစ်အတွင်း ဘယ်နှခါ ပြောင်းခဲ့လဲ ဆိုတာကို git history ထဲမှာ ကြည့်ပြီးမှ၊
      ကူးယူမလား၊ library လား၊ sidecar လား၊ service တစ်ခုက ပိုင်မလား ဆိုတာ ရွေးပါ။
    sources:
      - {
          title: "Software Architecture: The Hard Parts (Ford, Richards, Sadalage, Dehghani)",
          url: "https://oreil.ly/sa-the-hard-parts",
        }
    actions:
      - id: sel-header
        type: editor.select
        at: { mark: turn, offsetMs: 8000 }
        target:
          { file: notebook/40-sharing.md, text: "| မျှသုံးမယ့် အရာ | ပြောင်းနှုန်း | ရွေးချယ်မှု | ဘာကြောင့် |" }
      - id: sel-rate
        type: editor.select
        at: { mark: turn-2 }
        target: { file: notebook/40-sharing.md, text: "ပြောင်းနှုန်း" }

  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ reuse က အခမဲ့ မဟုတ်ပါဘူး။ မျှသုံးတိုင်း coupling ဖြစ်လာတာမို့၊ ပြောင်းခဲတဲ့
      အရာအတွက်ပဲ တန်ပါတယ်။ သေးပြီး တည်ငြိမ်တာကို ကူးယူ၊ နေရာတိုင်း တူရမယ့် ပြောင်းခဲတာကို library သေးသေး၊ operation
      ကိစ္စကို sidecar၊ မြန်မြန် ပြောင်းတဲ့ business rule ကိုတော့ ပိုင်ရှင် service တစ်ခုတည်းမှာ ထားပါ။
      [[mark:next]] နောက် lesson မှာတော့ ဘယ်သူမှ အဖြေ ရေးမထားတဲ့ ဆုံးဖြတ်ချက် တစ်ခုအတွက် trade off analysis ကို
      ကိုယ်တိုင် ဘယ်လို လုပ်မလဲ ဆိုတာကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "Software Architecture: The Hard Parts (Ford, Richards, Sadalage, Dehghani)",
          url: "https://oreil.ly/sa-the-hard-parts",
        }
    actions:
      - id: sel-title
        type: editor.select
        at: { mark: recap }
        target: { file: notebook/40-sharing.md, text: "# Sharing: မျှသုံးမလား၊ ကူးယူမလား" }

