# Accessibility course, lesson 17: design and user experience.
#
# A concept lesson: nothing runs. Course-deck pages and two whiteboard boards
# carry the lesson, and the recap highlights the key lines in notes.md.
# Flow: recall lesson 16 (native details/dialog), experience differs from
# person to person; inclusive design drawn as a Venn diagram (accessibility,
# usability, inclusivity, the centre) and set against universal design; the
# seven inclusive design principles; personas (what they are, two tea-shop
# personas with goals, AT and barriers, the persona spectrum, three rules);
# disability simulators (left column first, then the better ways); accessibility
# heuristics (Nielsen/Molich 1990, Deque 2019, "up to 67%", a heuristic review
# of the tea-shop design); accessibility annotations drawn live over a wireframe
# of the tea-shop order page (landmarks, heading levels, focus order, alt text,
# accessible names) plus a page of the other areas to annotate; a quiz page with
# its reveal; the recap.
#
# Deck: every page points at the course deck's placeholder /pub URL until Chan
# publishes it; the Director's unreachable-deck warning is expected.
# Page plan (kit fields per page): ~/Documents/a11y-course-work/pages/a11y-course-17-design-ux.json
#
# Validate with (from the repo root):
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
schemaVersion: 1

lesson:
  slug: a11y-course-17-design-ux
  title: "Accessibility course 17: Design နဲ့ UX"
  locale: my-MM
  workspace:
    lessonType: javascript
    name: Accessibility course
    entryFilePath: notes.md
    sidebarStartsCollapsed: true
    files:
      notes.md: |
        # Design နဲ့ UX

        - inclusive design — accessibility · usability · inclusivity၊ လူ တစ်ယောက်ကနေ စပြီး အားလုံးဆီ ချဲ့
        - persona — မသန်စွမ်းမှု ထည့်၊ user testing ကို အစားမထိုး
        - simulator — သတိထား၊ မသန်စွမ်းသူတွေ ကိုယ်တိုင်ရဲ့ အတွေ့အကြုံကို လေ့လာ
        - heuristic — design ကို စောစော စစ် (Deque · bug 67% အထိ)
        - annotation — landmark · heading · focus အစဉ် · alt text · name

        နောက် lesson: automated testing
