build:
  # Studio swaps in the Burmese voice chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 2622

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: hook
    chapter: Backup ထက် အသက်ကြီးတဲ့ bug
    narration: >
      [[mark:show-p01]] ဆရာမရဲ့ စာကြောင့် Padauk က data catalog၊ ဖျက်တဲ့ pipeline နဲ့ synthetic test data ကို စသုံးလိုက်ပါတယ်။ ဒီလကုန် စာရင်းပိတ်တော့ finance အဖွဲ့က Wallet ရဲ့ cashback စုစုပေါင်း မကိုက်တာကို တွေ့ပါတယ်။
      [[mark:show-p01b]] ခြေရာခံကြည့်တော့ ၁၁ ရက်အရင်က deploy လုပ်ခဲ့တဲ့ cashback code က round လုပ်ပုံ မှားပြီး wallet တွေထဲ ကျပ် အနည်းငယ်စီ လွဲထည့်နေတာပါ။ မသီရိက bug မဝင်ခင်က backup ကို restore လုပ်ချင်ပေမဲ့ backup တွေကို ၇ ရက်စာပဲ သိမ်းထားပါတယ်။ ဒါဆို နောက်ပြန် ဘယ်အထိ သွားလို့ ရမလဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book, 1st ed: Data Integrity: What You Read Is What You Wrote",
          url: "https://sre.google/sre-book/data-integrity/",
        }
    actions:
      # -1750 / -1450, as in Module 1: a pull-back over 1780 ms pushes the first dialog
      # past the 2 s opening handle, which src/studio/plans/index.test.ts rejects.
      - { id: collapse-dock, type: runtime.collapseDock, at: { scene: start, offsetMs: -1750 } }
      - id: show-p01
        type: slide.show
        at: { mark: show-p01, offsetMs: -1450 }
        slideId: l22-p01
      - { id: show-p01b, type: slide.show, at: { mark: show-p01b }, slideId: l22-p01b }

  - id: how-far-back
    chapter: နောက်ပြန် ဘယ်အထိ
    narration: >
      [[mark:close-p01b]] [[mark:b1-s1]] ဒီ lesson မှာ data incident သုံးခုကို ဖြစ်ခဲ့တဲ့ အစဉ်အတိုင်း ကြည့်ပါမယ်။ [[mark:b1-s1b]] အပြာရောင် အမှတ်တွေက ညတိုင်း ယူတဲ့ backup၊ data ရဲ့ သီးခြား မိတ္တူတွေပါ၊ အဲဒီကနေ ပြန်ယူတာက restore ပါ။ [[mark:b1-s1c]] အနီရောင်က bug ဝင်လာတဲ့ နေ့ပါ၊ bug ကြောင့် မှားတဲ့ data တွေက error မပြဘဲ database copy တိုင်းကို ချက်ချင်း ရောက်သွားပါတယ်။
      [[mark:b1-s2]] bug ကို ၁၁ ရက်မြောက်မှ သတိထားမိပါတယ်၊ ညတိုင်း balance စစ်တဲ့ check က ကျပ် အနည်းငယ် ကွာတာကို lesson ၂၁ က ပုံမှန် reconciliation လို့ ယူဆပြီး ညှိပေးနေခဲ့လို့ပါ။ [[mark:b1-s2b]] ၇ ရက်စာပဲ သိမ်းလို့ အဟောင်းဆုံး backup တောင် bug ဝင်ပြီး ၄ ရက်ကြာမှ ယူထားတာပါ။
      [[mark:b1-s3]] ဒါကြောင့် ဘယ် backup မှ bug မဝင်ခင် အချိန်ကို မမီပါဘူး။ backup ကို bug သတိထားမိဖို့ ကြာတဲ့ အချိန်ထက် ပိုကြာကြာ သိမ်းရပေမဲ့ ထာဝရတော့ မသိမ်းနိုင်ပါဘူး၊ lesson ၂၁ က ဖျက်ရမယ့် deadline တွေနဲ့ storage ကုန်ကျစရိတ်က ကန့်သတ်ပါတယ်။ ပြီးတော့ backup ရှိနေရင်တောင် နောက်ဆုံး backup ယူပြီးမှ ဝင်လာတဲ့ write တွေကို ဆုံးရှုံးနိုင်ပါသေးတယ်။
      [[mark:b1-s4]] ဒီတစ်ခါ ကယ်လိုက်တာက ledger ပါ။ ရေးပြီးသား entry ကို မပြင်ဘဲ အသစ်ပဲ ထပ်ရေးတဲ့ append-only စာရင်းမို့ ပြန်ညှိတဲ့ entry အသစ်တွေနဲ့ ပြင်နိုင်ခဲ့ပါတယ်။ [[mark:b1-s5]] balance check ကိုလည်း batch နဲ့ မရှင်းနိုင်တဲ့ ကွာဟချက် တစ်ခုပဲ ရှိရှိ alert တက်အောင် ပြင်လိုက်ပါတယ်၊ စောစော သိလေ ပြင်ရ သက်သာလေပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book, 1st ed: Data Integrity: What You Read Is What You Wrote",
          url: "https://sre.google/sre-book/data-integrity/",
        }
    actions:
      - { id: close-p01b, type: slide.close, at: { mark: close-p01b, offsetMs: -400 } }
      - id: b1-s1
        type: whiteboard.apply
        at: { mark: b1-s1 }
        open: true
        clear: true
        upsertIds: [l22-b1-axis]
        drawMs: 900
      - id: b1-s1b
        type: whiteboard.apply
        at: { mark: b1-s1b }
        upsertIds:
          [
            l22-b1-tick-1,
            l22-b1-tick-2,
            l22-b1-tick-3,
            l22-b1-tick-4,
            l22-b1-tick-5,
            l22-b1-tick-6,
            l22-b1-tick-7,
            l22-b1-tick-8,
            l22-b1-tick-9,
            l22-b1-tick-10,
            l22-b1-nightly,
          ]
        drawMs: 2600
      - id: b1-s1c
        type: whiteboard.apply
        at: { mark: b1-s1c }
        upsertIds: [l22-b1-tick-bug, l22-b1-bug]
        drawMs: 1200
      - id: b1-s2
        type: whiteboard.apply
        at: { mark: b1-s2 }
        upsertIds: [l22-b1-tick-seen, l22-b1-seen]
        drawMs: 1200
      - id: b1-s2b
        type: whiteboard.apply
        at: { mark: b1-s2b }
        upsertIds: [l22-b1-kept, l22-b1-kept-t]
        drawMs: 1600
      - id: b1-s3
        type: whiteboard.apply
        at: { mark: b1-s3 }
        upsertIds: [l22-b1-cant]
        drawMs: 1200
      - id: b1-s4
        type: whiteboard.apply
        at: { mark: b1-s4 }
        upsertIds: [l22-b1-ledger, l22-b1-ledger-t1, l22-b1-ledger-t2]
        drawMs: 1800
      - id: b1-s5
        type: whiteboard.apply
        at: { mark: b1-s5 }
        upsertIds: [l22-b1-alert]
        drawMs: 1000

  - id: two-numbers
    chapter: RPO နဲ့ RTO
    narration: >
      [[mark:close-b1]] [[mark:show-p02]] ပြီးတော့ မသီရိက tool တွေ ဘာလုပ်နိုင်လဲ ဆိုတာကနေ မစဘဲ မနှင်းနဲ့ finance အဖွဲ့ကို ငွေ data အတွက် မေးခွန်း နှစ်ခု မေးပါတယ်။ ပထမက ဘယ်လောက် ကြာချိန်စာ data ကို ဆုံးရှုံးခံနိုင်လဲ ဆိုတာပါ၊ ဒါကို recovery point objective၊ RPO လို့ ခေါ်ပါတယ်။ ဒုတိယက service ပြန်ကောင်းဖို့ ဘယ်လောက်အထိ ကြာခွင့်ရှိလဲ ဆိုတဲ့ recovery time objective၊ RTO ပါ။
      [[mark:show-p02b]] သူတို့က ledger အတွက် RPO ကို မိနစ်ပိုင်း၊ RTO ကို တစ်နာရီလို့ ဆုံးဖြတ်ပါတယ်။ RPO က backup ကို ဘယ်လောက် ခဏခဏ ယူရမလဲ ဆုံးဖြတ်ပေးပြီး အဲဒါက tool ရွေးတာ၊ data ကို ခွဲထားပုံအထိ သက်ရောက်လို့ စောစော ဆုံးဖြတ်ထားရပါမယ်။
      [[mark:show-p02c]] ဒါပေမဲ့ ဒီ နံပါတ် နှစ်ခုက disaster အတွက်ပါ၊ တစ်ခုခု ပျက်ပြီးမှ စရေတွက်ပါတယ်။ နေ့စဉ် ကျန်းမာရေးကိုတော့ သဘောတူထားတဲ့ reliability ပစ်မှတ် ဖြစ်တဲ့ service level objective၊ SLO နဲ့ သူ့ error budget က အချိန်ရှိတုန်း ကြိုသတိပေးပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Google Cloud: Disaster recovery planning guide",
          url: "https://docs.cloud.google.com/architecture/dr-scenarios-planning-guide",
        }
    actions:
      - id: close-b1
        type: whiteboard.apply
        at: { mark: close-b1, offsetMs: -400 }
        open: false
      - { id: show-p02, type: slide.show, at: { mark: show-p02 }, slideId: l22-p02 }
      - { id: show-p02b, type: slide.show, at: { mark: show-p02b }, slideId: l22-p02b }
      - { id: show-p02c, type: slide.show, at: { mark: show-p02c }, slideId: l22-p02c }

  - id: replication
    chapter: Replication က အမှားကိုပါ ကူးတယ်
    narration: >
      [[mark:close-p02c]] [[mark:b2-s1]] ဒုတိယ incident မှာတော့ developer တစ်ယောက်က test merchant တွေ ရှင်းဖို့ cleanup script ကို AI coding assistant နဲ့ ရေးပြီး admin credential နဲ့ run လိုက်ပါတယ်။ နာမည် မပြောင်းရသေးတဲ့ staging database နဲ့ production database က စာလုံး တစ်လုံးပဲ ကွာလို့ production ထဲက တကယ့် merchant ၁၀၀၀၀ ကို ဖျက်မိသွားပြီး ဆိုင်တွေ ငွေလက်ခံလို့ မရတော့ပါဘူး။
      [[mark:b2-s2]] database မှာ write လက်ခံတဲ့ primary နဲ့ သူ့ကို လိုက်ကူးတဲ့ copy သုံးခု ရှိပါတယ်၊ ဒီလို ကူးထားတာက replication၊ copy တစ်ခုချင်းက replica ပါ။ zone တစ်ခု ပျက်ရင် replica က ကယ်ပေးပေမဲ့ delete တွေကိုလည်း ချက်ချင်း ကူးလို့ merchant တွေ နေရာတိုင်းမှာ ပျောက်ကုန်ပါတယ်၊ ဒါကြောင့် replication က backup မဟုတ်ပါဘူး။
      [[mark:b2-s3]] primary ပျက်လို့ replica ကို ပြောင်းသုံးတဲ့ failover မှာလည်း ခဏ နောက်ကျပြီး လိုက်ကူးတဲ့ asynchronous replica ဆိုရင် မကူးရသေးတဲ့ write တွေ ပျောက်ပါတယ်။ write တိုင်း replica ဆီ ရောက်မှ ပြီးတဲ့ synchronous ကတော့ ပိုနှေးပေမဲ့ ပြန်ယူရ ပိုရိုးရှင်းပါတယ်။
      [[mark:b2-s4]] merchant တွေကိုတော့ data ကို ဓာတ်ပုံရိုက်သလို နာရီတိုင်း မှတ်ထားတဲ့ snapshot ကနေ restore လုပ်ပြီး write တိုင်းကို မှတ်ထားတဲ့ write log ကနေ script မ run ခင်အထိ ပြန်ထည့်လို့ ပြန်ရခဲ့ပါတယ်။ [[mark:b2-s4b]] အခုတော့ backup တွေကို သီးခြား account ထဲမှာ read-only ထားလို့ production ကို ရေးနိုင်တဲ့ လူ၊ script၊ AI ဘယ်သူမှ မှားလို့ဖြစ်စေ၊ တမင်ဖြစ်စေ backup ကို မဖျက်နိုင်ပါဘူး။
