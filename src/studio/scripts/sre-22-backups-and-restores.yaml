  - id: one-mistake
    chapter: အမှား တစ်ခု နေရာတိုင်း မရောက်အောင်
    narration: >
      [[mark:close-p03c]] [[mark:b3-s1]] merchant incident ရဲ့ postmortem မှာ developer ကို အပြစ်မရှာဘဲ script တစ်ခုက production တစ်ခုလုံးကို ဘာကြောင့် ထိနိုင်ခဲ့လဲလို့ မေးပါတယ်။ စာလုံး တစ်လုံး မှားတာက ဘယ်သူ့မှာမဆို ဖြစ်နိုင်ပါတယ်၊ ပြဿနာက ဘယ်သူမှ ထပ်မစစ်ဘဲ ဖျက်လို့ရပြီး ဖျက်လိုက်တာနဲ့ အပြီး ပျောက်သွားတာပါ။
      [[mark:b3-s2]] ဒါကြောင့် အခု ဖျက်တာကို အဆင့်လိုက် လုပ်ပါတယ်၊ lesson ၂၁ က soft delete လိုပဲ ဖျက်လိုက်တဲ့ data ကို trash ထဲမှာ ရက်အနည်းငယ် ထားတော့ ပြန်ယူလို့ရပါတယ်။ data အများကြီး ဖျက်တဲ့ script ကိုလည်း ဒုတိယ လူတစ်ယောက် အတည်ပြုမှ run လို့ရပါတယ်။
      [[mark:b3-s3]] script တစ်ခါ run ရင် ဖျက်နိုင်တဲ့ အရေအတွက်ကို ကန့်သတ်ထားပြီး backup တွေကလည်း script မရောက်နိုင်တဲ့ နေရာမှာ ရှိပါတယ်။ အန္တရာယ်ရှိတဲ့ data ပြောင်းလဲမှုတွေကိုလည်း နေရာတိုင်းမှာ တစ်ပြိုင်နက် မလုပ်ဘဲ zone တစ်ခုပြီးမှ တစ်ခု လုပ်ပါတယ်။ ဒီ incident က lesson ၂၈ မှာ AI agent တွေကို read-only နဲ့ပဲ စပေးရတဲ့ အကြောင်းရင်း ဖြစ်လာပါမယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book, 1st ed: Data Integrity: What You Read Is What You Wrote",
          url: "https://sre.google/sre-book/data-integrity/",
        }
      - {
          title: "Building Secure and Reliable Systems, Ch 9: Design for Recovery",
          url: "https://google.github.io/building-secure-and-reliable-systems/raw/ch09.html",
        }
    actions:
      - { id: close-p03c, type: slide.close, at: { mark: close-p03c, offsetMs: -400 } }
      - id: b3-s1
        type: whiteboard.apply
        at: { mark: b3-s1 }
        open: true
        clear: true
        upsertIds:
          [l22-b3-script, l22-b3-script-t, l22-b3-a1, l22-b3-prod, l22-b3-prod-t1, l22-b3-prod-t2]
        drawMs: 2400
      - id: b3-s2
        type: whiteboard.apply
        at: { mark: b3-s2 }
        upsertIds: [l22-b3-g1, l22-b3-g1-t, l22-b3-g2, l22-b3-g2-t]
