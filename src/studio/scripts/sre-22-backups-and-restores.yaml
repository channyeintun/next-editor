    sidebarStartsCollapsed: true
    files:
      notes.md: |
        # Backup ထက် restore က ပိုအရေးကြီးတယ်

        - RPO — ဆုံးရှုံးခံနိုင်တဲ့ data ကို အချိန်နဲ့ ပြော
        - RTO — ပျက်ပြီး ပြန်ကောင်းဖို့ ကြာခွင့်
        - replication ≠ backup — replica တိုင်းဆီ အမှားကိုပါ ချက်ချင်း ကူး
        - snapshot — မြန်၊ ဈေးပေါ၊ storage ပျက်ရင် အတူ ပျက်
        - 3-2-1 — မိတ္တူ 3 ခု · storage 2 မျိုး · တခြားနေရာမှာ 1 ခု
        - restore drill — တကယ် restore လုပ်ပြီး ကြာချိန်နဲ့ data စစ်

        မေးခွန်း: backup ကို 6 နာရီ တစ်ခါ ယူတယ်။ အဆိုးဆုံး RPO က ဘယ်လောက်လဲ?
