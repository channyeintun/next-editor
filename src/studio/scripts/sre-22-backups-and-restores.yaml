# SRE from zero, lesson 22: Backups and restores (Burmese concept lesson).
#
# Built from the approved voice script
# docs/sre-course/voice-scripts/sre-22-backups-and-restores.md. Every spoken
# character is that script's "> " lines, unchanged; each ⟪…⟫ marker became a
# [[mark:…]] at the same place. Check it with:
#   bun ~/Documents/sre-course/work/check-narration.ts \
#     docs/sre-course/voice-scripts/sre-22-backups-and-restores.md \
#     src/studio/scripts/sre-22-backups-and-restores.yaml
#
# Nothing runs: deck pages and the whiteboard carry the lesson, and notes.md is
# the recap. The workspace and runtime follow the validated no-code skeleton
# (WebContainer, empty init command, a harmless dev script).
#
# Five marks add no spoken text and sit at an existing ။:
# - b1-s1b and b1-s1c split B1 step 1 so the timeline lands as the narration
#   names it: the axis opens the board, the blue nightly ticks come with "အပြာရောင်
#   အမှတ်တွေက ညတိုင်း ယူတဲ့ backup" and the red bug tick with "အနီရောင်က bug ဝင်လာတဲ့
#   နေ့ပါ", instead of all three landing together, and no apply adds more than
#   three labelled elements.
# - b1-s2b lets the orange "kept 7 days" bar land on the sentence that says it
#   (~12 s after the "noticed on day 11" tick), not with the tick.
# - b2-s4b lets the green "separate account · read-only backup" boxes land on the
#   sentence that names them ("အခုတော့ backup တွေကို သီးခြား account …"), ~13 s
#   after the paragraph starts; b2-s4 itself keeps the script's marker position
#   and drives nothing.
# - b4-s3b lets the green "split the data · weekly restore test" line land on
#   the sentence that says it, ~13 s after the orange validator line.
# ask-question is the voice script's ⟪select မေးခွန်း⟫, which already starts the
# question's own dialog, so the question-line select hangs off it (offset 5600)
# for the ⟪pause 3s⟫ (see select-question), as in lesson 16.
# Pacing: at 70 ms/char no page or board step holds longer than ~31 s (l22_p05
# with its two paragraphs, 428 characters) and the longest dialog is that same
# 428 characters, so no pacing page or step was added; the voice script already
# carries the continuation pages (l22_p01b, l22_p02b, l22_p02c, …).
#
# ⟪close board⟫ straight into the next board (scene 7, B3 into B4) wipes the
# open board 400 ms early (whiteboard.apply clear) instead of closing the panel,
# so the editor does not flash between two boards, as in lesson 16; B4 then
# draws with open: true, clear: true as usual. A board followed by a deck page
# closes the panel (open: false) 400 ms before the page, and a deck page
# followed by a board closes the page 400 ms before, as in Module 1. Every board
# opens with open + clear.
#
# Boards (B1 P8 timeline, B2 P2 comb, B3 P1 flow, B4 P8 + P5 bar). Colour jobs:
# #1e1e1e ink (paints white) for axes, ticks of the drill, buses, arrows and the
# primary; blue the thing named (the nightly backups, the cleanup script, the
# measured parts of the drill); green healthy or done (the ledger's correcting
# entry, the independent backup account, the guards, the drill's fix); red
# failure (the rounding bug, "can't go back", the cleanup script's delete, the
# replicas holding it, production, the 7-hour restore); orange the caveat or
# limit (the day-11 tick, the 7-day retention bar, "one fix-up = alert", the
# async-failover note, the 1-hour target, the validator). A label on two lines is
# one text asset per line, so each line meets the 0.55 em width rule on its own;
# every label was also measured in Chrome with Excalidraw's Virgil font
# (wb-fit.mjs) and stays inside its box.
# B1 puts ten nightly ticks on a 64 px-per-day axis (the first three fall
# outside the orange bar: those backups have already expired). B3 runs top to
# bottom: a long arrow-down from the script to production, with the four guards
# in a column beside it ("along the path"), because the six boxes of a row would
# be about 1,300 px wide and the visible area is 850.
#
# Deck pages: deck "Next Editor · SRE 5B · Capacity and data", published; the
# /pub URL below is final. Its l22 pages are built later from the page plan, so
# until then the Director reports page "l22_p01" missing from the published deck
