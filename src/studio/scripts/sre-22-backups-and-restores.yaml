  - id: proof-restore
    narration: >
      [[mark:close-b4]] [[mark:show-p04]] backup job အစိမ်းရောင် ပြနေတာက copy တစ်ခု ရေးပြီးသွားတယ် ဆိုတာပဲ ပြောပါတယ်၊ data ပြန်ရမယ်လို့ သက်သေပြတာက အောင်မြင်တဲ့ restore ပါ။ ဒါကြောင့် restore ကို အချိန်ဇယားနဲ့ စမ်းပါ၊ fail ရင်ဖြစ်စေ၊ RTO ထက် ကြာရင်ဖြစ်စေ alert တက်အောင် ထားပြီး ပြန်ရတဲ့ data အဓိပ္ပာယ် ရှိလားလည်း စစ်ပါ။
      [[mark:show-p04b]] site တစ်ခုလုံး ပြန်ယူတာတင် မဟုတ်ဘဲ cashback လို မှားရေးခဲ့တဲ့ write တွေ၊ user တစ်ယောက်ရဲ့ data စတဲ့ restore အမျိုးအစား တိုင်းကို စမ်းရပါမယ်။ ဒီ စမ်းသပ်မှုအတွက် machine နဲ့ အချိန်ကိုလည်း feature တစ်ခုလိုပဲ budget တောင်းရပါမယ်။
