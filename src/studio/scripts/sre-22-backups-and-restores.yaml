  - id: data-list
    chapter: Padauk ရဲ့ data စာရင်း
    narration: >
      [[mark:show-p05]] ပြဿနာ သုံးခု ပြီးတော့ Padauk က သတိရမှ backup ထည့်တာကို ရပ်ပြီး database အသစ်တိုင်းမှာ အလိုအလျောက် ထည့်ပါတယ်။ data catalog ထဲက data တွေကို အုပ်စု အနည်းငယ် ခွဲပြီး အုပ်စုတိုင်းကို RPO နဲ့ RTO ပေးပါတယ်။
      ငွေ data ကို point-in-time recovery နဲ့ ကာကွယ်ပြီး အပတ်တိုင်း restore စမ်းပါတယ်။ settlement file လို ပြန်ထုတ်လို့ရတဲ့ data ကိုတော့ ပြန်ထုတ်ရတာ နှေးမှ ကာကွယ်ပြီး test data လို backup မလိုတဲ့ data ကိုလည်း မလိုဘူးလို့ ရေးထားပါတယ်။
      [[mark:show-p05b]] restore က စမ်းထားပြီးသား လမ်းပါ၊ အဲဒါ မရတော့မှ ကျန်တာကို ဆယ်ယူရတာက recovery ပါ။ recovery မှာ ဘာလုပ်မလဲ ဆိုတာကို မနက် ၃ နာရီမှ မဆုံးဖြတ်ဘဲ အခုကတည်းက ဆုံးဖြတ်ထားပါတယ်။ ဥပမာ ledger ပျောက်ရင် Wallet ကို လုံးဝ မပိတ်ဘဲ balance တွေ ပြန်ယူနေဆဲလို့ ပြတဲ့ read-only အနေနဲ့ အရင် ဖွင့်ပါမယ်။
      [[mark:show-p05c]] recovery လုပ်နေတုန်း balance တွေကို လက်နဲ့ မပြင်ဘဲ review လုပ်ပြီးသား code ကနေပဲ ပြင်ပါတယ်၊ တကယ် လက်နဲ့ ပြင်ရမယ်ဆိုရင်တော့ CTO ကိုနေလင်းရဲ့ စာနဲ့ ခွင့်ပြုချက် လိုပါတယ်။ ဒီ plan ကိုလည်း ခေါင်းဆောင်တွေက လက်မှတ်ထိုး အတည်ပြုထားပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Google Cloud: Disaster recovery planning guide",
          url: "https://docs.cloud.google.com/architecture/dr-scenarios-planning-guide",
        }
      - {
          title: "Building Secure and Reliable Systems, Ch 9: Design for Recovery",
          url: "https://google.github.io/building-secure-and-reliable-systems/raw/ch09.html",
        }
    actions:
      - { id: show-p05, type: slide.show, at: { mark: show-p05 }, slideId: l22-p05 }
      - { id: show-p05b, type: slide.show, at: { mark: show-p05b }, slideId: l22-p05b }
      - { id: show-p05c, type: slide.show, at: { mark: show-p05c }, slideId: l22-p05c }

  - id: this-week
    narration: >
      [[mark:show-p06]] မသီရိရဲ့ drill လိုပဲ backup တစ်ခုကို ဒီအပတ် တကယ် restore လုပ်ကြည့်ပြီး ဘယ်လောက် ကြာလဲ အချိန် မှတ်ပါ။ ငွေ data အတွက် RPO နဲ့ RTO ကို business ဘက်က လူနဲ့ အတူ ချရေးပါ။ ပြီးတော့ data ဖျက်တဲ့ လုပ်ဆောင်ချက် တစ်ခုကို လူ နှစ်ယောက် အတည်ပြုမှ လုပ်လို့ရအောင် ပြောင်းပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book, 1st ed: Data Integrity: What You Read Is What You Wrote",
          url: "https://sre.google/sre-book/data-integrity/",
        }
    actions:
      - { id: show-p06, type: slide.show, at: { mark: show-p06 }, slideId: l22-p06 }

  - id: recap
    narration: >
      [[mark:close-p06]] [[mark:open-notes]] incident သုံးခုကို အတိုချုပ်ရရင် ဒီလိုပါ။ [[mark:sel-rpo]] RPO က ဘယ်လောက် ကြာချိန်စာ data ကို ဆုံးရှုံးခံနိုင်လဲ၊ [[mark:sel-rto]] RTO က ပြန်ကောင်းဖို့ ဘယ်လောက် ကြာခွင့်ရှိလဲ ဆိုတာ ဖြစ်ပြီး နှစ်ခုလုံး disaster အတွက်ပါ။ [[mark:sel-replication]] replication က replica တိုင်းဆီ အမှားကိုပါ ချက်ချင်း ကူးပေးလို့ backup မဟုတ်ပါဘူး။
      [[mark:sel-snapshot]] snapshot က မြန်ပြီး ဈေးပေါပေမဲ့ storage ပျက်ရင် အတူ ပျက်ပါတယ်။ [[mark:sel-3-2-1]] သုံး နှစ် တစ် rule က မိတ္တူ သုံးခု၊ storage နှစ်မျိုး၊ တခြားနေရာမှာ တစ်ခု ထားတာ ဖြစ်ပြီး၊ [[mark:sel-restore-drill]] restore drill က backup ကို တကယ် restore လုပ်ပြီး ကြာချိန်နဲ့ data မှန်လား စစ်တာပါ။ [[mark:ask-question]] ဒါဆို backup ကို ၆ နာရီ တစ်ခါ ယူတယ် ဆိုရင် အဆိုးဆုံး RPO က ဘယ်လောက်လဲ?
      [[mark:pause-question]] ၆ နာရီစာ write တွေပါ၊ နောက် backup မယူခင် ခဏလေးမှာ ပျက်ရင် အဲဒီကြားက write တွေ အကုန် ဆုံးရှုံးနိုင်လို့ပါ။ တစ်ညမှာတော့ ဈေးနှုန်းစာရင်း ထုတ်တဲ့ job တစ်ခုက တစ်ဝက်ကိုပဲ ပို့လိုက်လို့ ည ၁ နာရီမှာ top-up တွေ နေရာတိုင်း ရပ်သွားပါတယ်။ ကြိုမစီစဉ်ထားတဲ့ failure ကို ဘယ်လို ဘောင်ခတ်မလဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Google Cloud: Disaster recovery planning guide",
          url: "https://docs.cloud.google.com/architecture/dr-scenarios-planning-guide",
        }
      - {
          title: "SRE book, 1st ed: Data Integrity: What You Read Is What You Wrote",
          url: "https://sre.google/sre-book/data-integrity/",
        }
    actions:
      - { id: close-p06, type: slide.close, at: { mark: close-p06 } }
      - {
          id: open-notes,
          type: workspace.openFile,
          at: { mark: open-notes, offsetMs: 300 },
          path: notes.md,
        }
      - {
          id: sel-rpo,
          type: editor.select,
          at: { mark: sel-rpo },
          target: { file: notes.md, text: "RPO", occurrence: 1 },
        }
      - {
          id: sel-rto,
          type: editor.select,
          at: { mark: sel-rto },
          target: { file: notes.md, text: "RTO", occurrence: 1 },
        }
      - {
          id: sel-replication,
          type: editor.select,
          at: { mark: sel-replication },
          target: { file: notes.md, text: "replication ≠ backup", occurrence: 1 },
        }
      - {
          id: sel-snapshot,
          type: editor.select,
          at: { mark: sel-snapshot },
          target: { file: notes.md, text: "snapshot", occurrence: 1 },
        }
      - {
          id: sel-3-2-1,
          type: editor.select,
          at: { mark: sel-3-2-1 },
          target: { file: notes.md, text: "3-2-1", occurrence: 1 },
        }
      - {
          id: sel-restore-drill,
          type: editor.select,
          at: { mark: sel-restore-drill },
          target: { file: notes.md, text: "restore drill", occurrence: 1 },
        }
      # The voice script's ⟪select မေးခွန်း⟫ and ⟪pause 3s⟫, as in lessons 3, 5 and 16. ask-question
      # (the ⟪select မေးခွန်း⟫ marker) starts the question's own dialog, so the question-line
      # select hangs off it with an offset: it starts about as the question ends, its drag runs
      # in silence, and the answer at pause-question waits for it (the scheduler holds only the
      # dialog after the select's anchor). The question is 82 characters: 6140 (400 + 82 x 70)
      # would start the drag as the question ends at 70 ms per char, but an offset above ~5600
      # trips compile-check's 2.5 s inserted-silence warning at 55, so 5600 leaves about
      # 2.8 / 1.8 / 0.35 s of quiet before the answer at 55 / 70 / 95 ms per char.
      - id: select-question
        type: editor.select
        at: { mark: ask-question, offsetMs: 5600 }
        target:
          file: notes.md
          text: "မေးခွန်း: backup ကို 6 နာရီ တစ်ခါ ယူတယ်။ အဆိုးဆုံး RPO က ဘယ်လောက်လဲ?"
          occurrence: 1

checks:
