  - id: snapshot-backup
    chapter: Snapshot နဲ့ backup
    narration: >
      [[mark:close-b2]] [[mark:show-p03]] snapshot က data ရှိတဲ့ storage ထဲမှာပဲ ယူတာမို့ မြန်ပြီး ဈေးပေါပါတယ်၊ ဒီတစ်ခါလို မှားဖျက်တာကနေ ကယ်နိုင်ပေမဲ့ storage ကိုယ်တိုင် ပျက်ရင်တော့ အတူ ပျက်ပါတယ်။ backup ကတော့ တခြားနေရာမှာ သီးခြား ကူးထားလို့ ပိုနှေးပေမဲ့ storage ပျက်လည်း ကျန်ပါတယ်၊ ဒါကြောင့် နှစ်မျိုးလုံး ထားရပါမယ်။
      [[mark:show-p03b]] Padauk က သုံး နှစ် တစ် rule ကို လိုက်ပါတယ်၊ မိတ္တူ သုံးခု ထားမယ်၊ storage နှစ်မျိုးမှာ သိမ်းမယ်၊ တစ်ခုကို တခြားနေရာမှာ ထားမယ် ဆိုတာပါ။ merchant တွေတုန်းကလိုပဲ backup ပေါ်မှာ write log ကို လိုတဲ့ မိနစ်အထိ ပြန်ထည့်တာကို point-in-time recovery လို့ ခေါ်ပါတယ်၊ RPO ကို အရမ်း သေးစေလို့ ledger မှာ ဖွင့်ထားပါတယ်။
      [[mark:show-p03c]] backup ကို ပြန်ဖွင့်ဖို့ encryption key နဲ့ ဘယ်ထဲမှာ ဘာရှိလဲ ပြတဲ့ metadata လည်း လိုလို့ ledger ရဲ့ key နဲ့ metadata ကို login ပါ သီးခြားဖြစ်တဲ့ တခြား cloud account မှာ backup ယူထားပါတယ်။ backup နည်းကိုလည်း ဆန်းပြားတာထက် ပြဿနာ တက်ချိန်မှာ restore လုပ်ရ လွယ်တဲ့ ရိုးရှင်းတဲ့ နည်းကို ရွေးပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book, 1st ed: Data Integrity: What You Read Is What You Wrote",
          url: "https://sre.google/sre-book/data-integrity/",
        }
      - {
          title: "Building Secure and Reliable Systems, Ch 9: Design for Recovery",
          url: "https://google.github.io/building-secure-and-reliable-systems/raw/ch09.html",
        }
