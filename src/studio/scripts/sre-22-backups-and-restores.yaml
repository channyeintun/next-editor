  - id: the-drill
    chapter: ပထမဆုံး restore drill
    narration: >
      [[mark:close-b3]] [[mark:b4-s1]] တတိယ ပြဿနာကိုတော့ Padauk ကိုယ်တိုင် ရှာတွေ့တာပါ။ Eats ရဲ့ backup တွေကို တစ်ခါမှ မစမ်းဖူးလို့ မသီရိရဲ့ အဖွဲ့က ပထမဆုံး restore drill၊ backup ကို တကယ် restore လုပ်ပြီး ကြာချိန်နဲ့ data မှန်လား စစ်တာကို လုပ်ပါတယ်။ payment နဲ့ order database ၉၀၀ gigabyte ကို restore လုပ်တာ ၇ နာရီ ကြာခဲ့ပါတယ်၊ ပစ်မှတ် RTO က တစ်နာရီပဲ ရှိတာပါ။
      [[mark:b4-s2]] ခွဲကြည့်တော့ machine ရှာရတာ ၂ နာရီ၊ data ကူးတာ ၄ နာရီ၊ စစ်တာ ၁ နာရီ ကြာခဲ့ပါတယ်။ drill က တကယ့် restore နဲ့ machine တူတူ သုံးရလို့ ဒီ ၂ နာရီက တကယ့် outage မှာလည်း ကုန်မှာပါ။ ပြီးတော့ RTO ထဲမှာ ပြဿနာ သတိထားမိဖို့နဲ့ ဘာလုပ်မလဲ ဆုံးဖြတ်ဖို့ အချိန်တွေလည်း ပါလို့ restore ကိုယ်တိုင်က တစ်နာရီထက် အများကြီး တိုရပါမယ်။
      [[mark:b4-s3]] ပြန်ယူထားတဲ့ data ကို စစ်တဲ့ program၊ validator ကလည်း order မရှိတဲ့ payment တွေကို တွေ့ပါတယ်၊ payment database ကို order database ထက် နှစ်နာရီ နောက်ကျမှ backup ယူထားလို့ပါ။ [[mark:b4-s3b]] ဒါကြောင့် အခု database နှစ်ခုကို အချိန် တစ်ခုတည်းအထိ ပြန်ယူပါတယ်၊ data ကို အပိုင်းလေးတွေ ခွဲပြီး တစ်ပြိုင်နက် restore လုပ်ပါတယ်၊ restore test ကိုလည်း အပတ်တိုင်း အလိုအလျောက် run ပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
