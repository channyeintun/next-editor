# React crash course (Burmese), lesson 2 of 12: props, children, lists and
# conditions. The narration is the Burmese voice script (voice-script.md next
# to this file), applied span by span with tools/apply-voice.py; every visible
# string (title, chapters, whiteboard labels, app UI) is Burmese. DESIGN.md is
# the span-by-span brief.
#
# Start state differs from lesson 1's end state on purpose (insert-only edits
# could not remove code): lesson 1's Menu.jsx with its three identical
# <DishCard /> lines is dropped, and the shop name and hours that lesson 1
# wrote directly in App now live in a new Header.jsx (lesson 1's closing
# announces this move). App renders <Header /> and an empty menu section;
# Card.jsx, DishCard.jsx and menu.js are pinned EMPTY so they can be typed
# while nothing imports them. Every edit to an imported module (App.jsx, then
# DishCard.jsx once App imports it) is a block insert of complete lines,
# import before usage, so no half-typed JSX ever reaches Vite. A list without
# keys or a component that mutates outside data would log console.error and
# fail the render, so the missing key and the impure Cup component live on the
# whiteboard only.
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
schemaVersion: 1

lesson:
  slug: react-crash-course-02-props-lists
  title: "React crash course 2: Props၊ list နဲ့ condition"
  locale: my-MM
  workspace:
    lessonType: javascript
    name: React Crash Course 2
    entryFilePath: src/App.jsx
    files:
      package.json: |
        {
          "name": "react-course-mm",
          "private": true,
          "version": "1.0.0",
          "type": "module",
          "scripts": {
            "dev": "vite --host 0.0.0.0 --port 5173 --strictPort"
          },
          "dependencies": {
            "react": "19.3.1",
            "react-dom": "19.3.1"
          },
          "devDependencies": {
            "vite": "5.4.21"
          }
        }
      vite.config.js: |
        import { defineConfig } from "vite";

        export default defineConfig({
          // JSX through esbuild's automatic runtime: components never import React.
          esbuild: { jsx: "automatic" },
          // Pre-bundle every React entry up front so Vite never discovers a new
          // dependency mid-lesson and force-reloads the preview.
          optimizeDeps: {
            include: [
              "react",
              "react/jsx-dev-runtime",
              "react/jsx-runtime",
              "react-dom",
              "react-dom/client",
            ],
          },
        });
      index.html: |
        <!doctype html>
        <html lang="my">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>React သင်ခန်းစာ</title>
          </head>
          <body>
            <div id="root"></div>
            <script type="module" src="/src/main.jsx"></script>
          </body>
        </html>
      src/main.jsx: |
        import { StrictMode } from "react";
        import { createRoot } from "react-dom/client";
        import App from "./App.jsx";
        import "./styles.css";

        createRoot(document.getElementById("root")).render(
          <StrictMode>
            <App />
          </StrictMode>,
        );
      src/App.jsx: |
        import { Header } from "./Header.jsx";

        export default function App() {
          return (
            <main className="page">
              <Header />
              <section className="menu" data-testid="menu">
              </section>
            </main>
          );
        }
      src/Header.jsx: |
        export function Header() {
          return (
            <>
              <h1 data-testid="title" style={{ color: "#c2410c" }}>
                ရွှေရန်ကုန် မုန့်ဟင်းခါးဆိုင်
              </h1>
              <p className="muted">မနက် ၆ နာရီ မှ ညနေ ၆ နာရီ အထိ</p>
            </>
          );
        }
      src/Card.jsx: ""
      src/DishCard.jsx: ""
      src/menu.js: ""
      src/styles.css: |
        :root {
          --bg: #f1f3f5;
          --surface: #ffffff;
          --text: #1e1e1e;
          --muted: #5c636a;
          --line: #dee2e6;
          --accent: #1971c2;
          --accent-soft: #e7f1fb;
          --ok: #2f9e44;
          --warn: #e67700;
          --radius: 12px;
          font-family: "Noto Sans Myanmar", "Myanmar Sangam MN", "Myanmar MN", "Padauk",
            system-ui, -apple-system, "Segoe UI", sans-serif;
          font-size: 17px;
          line-height: 1.8;
          color: var(--text);
          background: var(--bg);
        }

        * {
          box-sizing: border-box;
        }

        body {
          margin: 0;
          min-height: 100vh;
        }

        .page {
          max-width: 560px;
          margin: 0 auto;
          padding: 20px 16px 40px;
          display: grid;
          gap: 14px;
        }

        .header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 12px;
          padding-bottom: 10px;
          border-bottom: 2px solid var(--line);
        }

        h1,
        h2,
        h3 {
          margin: 0;
          line-height: 1.6;
        }

        h1 {
          font-size: 1.45rem;
        }

        h2 {
          font-size: 1.15rem;
        }

        p {
          margin: 0;
        }

        .muted {
          color: var(--muted);
        }

        .card {
          display: grid;
          gap: 8px;
          padding: 14px 16px;
          border: 1px solid var(--line);
          border-radius: var(--radius);
          background: var(--surface);
          box-shadow: 0 4px 14px rgb(0 0 0 / 0.05);
        }

        .row {
          display: flex;
          align-items: center;
          gap: 10px;
          flex-wrap: wrap;
        }

        .list {
          display: grid;
          gap: 8px;
          margin: 0;
          padding: 0;
          list-style: none;
        }

        .list > li {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 10px;
          padding: 8px 12px;
          border: 1px solid var(--line);
          border-radius: 10px;
          background: var(--surface);
        }

        button {
          font: inherit;
          padding: 6px 16px;
          border: 0;
          border-radius: 999px;
          background: var(--accent);
          color: white;
          cursor: pointer;
        }

        button.secondary {
          background: var(--accent-soft);
          color: var(--accent);
        }

        button:disabled {
          background: var(--line);
          color: var(--muted);
          cursor: not-allowed;
        }

        input,
        select,
        textarea {
          font: inherit;
          width: 100%;
          padding: 6px 12px;
          border: 1px solid var(--line);
          border-radius: 10px;
          background: var(--surface);
          color: var(--text);
        }

        input:focus,
        select:focus,
        textarea:focus,
        button:focus-visible {
          outline: 2px solid var(--accent);
          outline-offset: 2px;
        }

        .badge {
          display: inline-block;
          padding: 0 10px;
          border-radius: 999px;
          background: var(--accent-soft);
          color: var(--accent);
          font-size: 0.85rem;
        }

        .badge.ok {
          background: #ebfbee;
          color: var(--ok);
        }

        .badge.warn {
          background: #fff4e6;
          color: var(--warn);
        }

        /* Lesson 2: the menu list, the spicy badge inside a card, sold out. */
        .menu {
          display: grid;
          gap: 12px;
        }

        .card .badge {
          justify-self: start;
        }

        .sold-out {
          color: var(--warn);
          font-weight: 600;
        }

