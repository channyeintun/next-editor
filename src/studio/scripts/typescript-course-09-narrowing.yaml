scenes:
  - id: recall
    chapter: "Narrowing ဆိုတာ"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ union type က တန်ဖိုး တစ်ခုကို ဒီ type ဒါမှမဟုတ် ဟို type
      ဖြစ်နိုင်တယ်လို့ ပြောပေးတာ မြင်ခဲ့ပါတယ်။ ဒါပေမဲ့ တန်ဖိုး တစ်ခုက ဂဏန်းလည်း ဖြစ်နိုင်၊ စာသားလည်း
      ဖြစ်နိုင်တယ် ဆိုရင်၊ ဂဏန်းမှာပဲ လုပ်လို့ရတဲ့ အလုပ်ကို သူ့အပေါ်မှာ ဘယ်လို လုပ်မလဲ။ ဒီ lesson မှာ အဲဒီ
      မေးခွန်းကို ဖြေပေးမယ့် narrowing ကို ကြည့်သွားပါမယ်။ [[mark:draw-union]] ဥပမာအားဖြင့် ဆိုင်ရဲ့
      ဈေးနှုန်းက menu ကနေ လာရင် ဂဏန်း ဖြစ်ပေမယ့်၊ ဖောင်ကနေ လာရင်တော့ စာသား ဖြစ်နေတတ်ပါတယ်။ ဒါကြောင့်
      သူ့ type က number ဒါမှမဟုတ် string ဆိုတဲ့ union ပါ။ [[mark:draw-check]] code ထဲမှာ ကိုယ်က ဒီ
      ဈေးနှုန်းဟာ string ဟုတ်မဟုတ်ကို type of နဲ့ if ထဲမှာ စစ်လိုက်တယ် ဆိုပါစို့။ [[mark:draw-yes]] စစ်ဆေးချက် မှန်လို့
      if ထဲကို ရောက်လာရင်၊ ဒီ တန်ဖိုးက string ပဲ ဖြစ်နိုင်ပါတော့တယ်။ [[mark:draw-no]] string မဟုတ်လို့
      if ကို ကျော်သွားရင်တော့ number ပဲ ကျန်ပါတော့တယ်။ TypeScript က ကိုယ် ရေးထားတဲ့ စစ်ဆေးချက်ကို
      ဖတ်ပြီး၊ code ရဲ့ နေရာ တစ်ခုချင်းစီမှာ ဘာ type ပဲ ဖြစ်နိုင်တော့လဲ ဆိုတာကို ကျဉ်းသွားအောင်
      နားလည်ပေးပါတယ်။ [[mark:draw-rule]] ဒါကို narrowing လို့ ခေါ်ပါတယ်။ ဒီ စစ်ဆေးချက်တွေက TypeScript
      အတွက် သီးသန့် ရေးရတဲ့ code မဟုတ်ဘဲ၊ JavaScript မှာ အရင်ကတည်းက ရေးနေကျ if တွေပဲ ဖြစ်ပါတယ်။ ဒါကြောင့်
      program run တဲ့ အချိန်မှာလည်း တကယ် စစ်ပေးပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 5: Unions, Literals and Narrowing (what is narrowing)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/unions-literals-and-narrowing",
        }
      - {
          title: "TypeScript Handbook: Narrowing",
          url: "https://www.typescriptlang.org/docs/handbook/2/narrowing.html",
        }
    actions:
      - id: open-board-a
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-union
        type: whiteboard.apply
