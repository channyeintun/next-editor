      - id: expect-instanceof-no-errors
        type: expect.preview
        at: { afterAction: type-instanceof }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-query-error
        type: editor.type
        at: { mark: type-query-error }
        target: { file: src/orders.ts, after: "    return reply.message;\n", occurrence: 1 }
        text: "    //     ^?\n"
        cadence: fast-explainer
      - id: expect-query-error
        type: expect.preview
        at: { afterAction: type-query-error }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-6 }
        attribute: { name: data-type, value: "(parameter) reply: Error" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: open-main-2
        type: workspace.openFile
        at: { mark: open-main-2 }
