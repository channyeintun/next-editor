  - id: panel
    narration: >
      [[mark:panel-ready]] ညာဘက် panel ရဲ့ Output ကို အရင် ကြည့်ရအောင်။ ပထမ line က ဖောင်ကနေ လာတဲ့ ၁၈၀၀
      ကျပ်ကို ၂၀၀ ကျပ် ထပ်ပေါင်းထားတာ ဖြစ်ပေမယ့်၊ ၂၀၀၀ မဖြစ်ဘဲ ဂဏန်း နှစ်ခု ကပ်နေတဲ့ စာသား ဖြစ်နေပါတယ်။
      [[mark:read-output-rest]] ဒုတိယ line ကလည်း ရေနွေးကြမ်းရဲ့ ဈေးကို မသိသေးဘူးလို့ ပြနေပါတယ်။ တတိယ line
      က မှန်နေပေမယ့်၊ နောက်ဆုံး line ကတော့ ပါဆယ် အော်ဒါကို စားပွဲ undefined ဆီ ပို့ခိုင်းနေပါတယ်။ [[mark:read-errors]] အပေါ်က
      Errors အပိုင်းမှာလည်း error သုံးခု ရှိပါတယ်။ ဒီ ပြဿနာ အားလုံးက union type ထဲက တန်ဖိုးကို မှန်မှန်ကန်ကန်
      မစစ်ဘဲ သုံးထားလို့ ဖြစ်တာပါ။ တစ်ခုချင်း narrow လုပ်ပြီး ပြင်ကြည့်ရအောင်။
    sources:
      - {
