      - id: expect-query-order
        type: expect.preview
        at: { afterAction: type-query-order }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-4 }
        attribute: { name: data-type, value: "const order: Order" }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: in-operator
    chapter: "in နဲ့ instanceof"
    narration: >
      [[mark:select-table]] ကျန်နေတဲ့ error က အော်ဒါရဲ့ စားပွဲ နံပါတ်ကို ယူထားတဲ့ ဒီ နေရာမှာပါ။ union type ပေါ်မှာ property တစ်ခုကို
      သုံးချင်ရင်၊ union ထဲက type အားလုံးမှာ အဲဒီ property ရှိရပါမယ်။ ပါဆယ် အော်ဒါမှာ စားပွဲ နံပါတ်
      မရှိတဲ့အတွက် TypeScript က ခွင့်မပြုတာပါ။ Output မှာ စားပွဲ undefined ပေါ်နေတာလည်း ဒါကြောင့်ပါ။
      [[mark:type-in]] object ပုံစံ နှစ်မျိုးကို ခွဲဖို့ JavaScript ရဲ့ in operator ကို သုံးပါမယ်။ in
      operator က object ထဲမှာ ဒီ နာမည်နဲ့ property ရှိမရှိ စစ်ပေးပါတယ်။ လာယူမယ့်သူ ပါရင် ပါဆယ် အော်ဒါ
      ဖြစ်လို့၊ သူ့ နာမည်နဲ့ ပါဆယ် ဆိုတဲ့ စာကို ပြန်ပေးပါမယ်။ [[mark:read-in-fixed]] error ပျောက်သွားပြီး၊
      Output မှာလည်း မောင်မောင် ပါဆယ် ဆိုပြီး မှန်သွားပါပြီ။ [[mark:type-query-parcel]] if ထဲမှာ query
      ထည့်ကြည့်ရအောင်။ [[mark:read-query-parcel]] Types အပိုင်းမှာ အော်ဒါက Parcel type ဖြစ်သွားတာ တွေ့ရပါတယ်။ if ရဲ့ အောက်မှာတော့
      ကျန်တဲ့ Order ပဲ ဖြစ်နိုင်လို့၊ စားပွဲ နံပါတ်ကို သုံးလို့ ရသွားတာပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 5: Using in to narrow",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/unions-literals-and-narrowing",
        }
      - {
          title: "TypeScript Handbook: Narrowing (the in operator narrowing)",
          url: "https://www.typescriptlang.org/docs/handbook/2/narrowing.html#the-in-operator-narrowing",
        }
      - {
          title: "MDN: in operator",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/in",
        }
    actions:
      - id: select-table
        type: editor.select
        at: { mark: select-table }
        target: { file: src/orders.ts, text: "order.table", occurrence: 1 }
      - id: type-in
        type: editor.type
        at: { mark: type-in }
        target:
          {
            file: src/orders.ts,
            after: "export function whereTo(order: Order | Parcel): string {\n",
            occurrence: 1,
          }
        text: "  if (\"pickupBy\" in order) {\n    return `${order.pickupBy} ပါဆယ်`;\n  }\n"
        cadence: block
      - id: expect-in-no-errors
        type: expect.preview
        at: { afterAction: type-in }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-parcel-output
        type: expect.preview
        at: { afterAction: expect-in-no-errors }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-4 }
        textContains: "မောင်မောင် ပါဆယ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-query-parcel
        type: editor.type
        at: { mark: type-query-parcel }
        target:
          { file: src/orders.ts, after: "    return `${order.pickupBy} ပါဆယ်`;\n", occurrence: 1 }
        text: "    //        ^?\n"
        cadence: fast-explainer
      - id: expect-query-parcel
        type: expect.preview
        at: { afterAction: type-query-parcel }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-5 }
        attribute: { name: data-type, value: "(parameter) order: Parcel" }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: instanceof
    narration: >
      [[mark:select-kitchen-param]] နောက်ဆုံး function ကို ကြည့်ရအောင်။ မီးဖိုချောင်က အခုထိ စာသားပဲ
      ပြန်ပို့ပေမယ့်၊ ပစ္စည်း ကုန်သွားတဲ့အခါ Error object ကို ပို့မယ်လို့ ပြောလာပါတယ်။
      [[mark:type-error-union]] ဒါကြောင့် parameter ရဲ့ type မှာ Error ကိုပါ union နဲ့ ထည့်ပါမယ်။
      [[mark:read-error-union]] ချက်ချင်းပဲ error တစ်ခု ပေါ်လာပါပြီ။ Error object ကို string ပြန်ပေးရမယ့်
      နေရာမှာ ပြန်ပေးလို့ မရဘူးလို့ ပြောနေတာပါ။ type ကို ချဲ့လိုက်တဲ့အခါ၊ ပြင်ရမယ့် နေရာတွေကို TypeScript က
      ဒီလို လိုက်ပြပေးပါတယ်။ [[mark:type-instanceof]] Error လို class ကနေ ဆောက်ထားတဲ့ object ကို စစ်ဖို့
      instance of operator ကို သုံးပါမယ်။ Error ဖြစ်ရင် သူ့ message ကို ပြန်ပေးပါမယ်။
      [[mark:read-instanceof-fixed]] error ပျောက်သွားပါပြီ။ [[mark:type-query-error]] if ထဲမှာ query
      ထည့်ကြည့်ရင်၊ [[mark:read-query-error]] Types အပိုင်းမှာ Error type ဖြစ်နေတာ မြင်ရပါတယ်။ if ရဲ့ အောက်မှာတော့ string ပဲ
      ကျန်ပါတယ်။ [[mark:open-main-2]] main ဖိုင်မှာ မုန့်ဟင်းခါး ကုန်သွားတဲ့ Error နဲ့ ခေါ်ကြည့်ရအောင်။
      [[mark:read-kitchen-output]] Output ရဲ့ နောက်ဆုံး line မှာ မုန့်ဟင်းခါး ကုန်သွားပါပြီ ဆိုတဲ့ စာ
      ပေါ်လာပါပြီ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 5: Other ways to narrow (instanceof)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/unions-literals-and-narrowing",
        }
      - {
          title: "TypeScript Handbook: Narrowing (instanceof narrowing)",
          url: "https://www.typescriptlang.org/docs/handbook/2/narrowing.html#instanceof-narrowing",
        }
      - {
          title: "MDN: instanceof",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/instanceof",
        }
    actions:
      - id: select-kitchen-param
        type: editor.select
        at: { mark: select-kitchen-param }
        target: { file: src/orders.ts, text: "reply: string", occurrence: 1 }
      - id: type-error-union
        type: editor.type
        at: { mark: type-error-union }
        target:
          {
            file: src/orders.ts,
            after: "export function kitchenReply(reply: string",
            occurrence: 1,
          }
        text: " | Error"
      - id: expect-union-error
        type: expect.preview
        at: { afterAction: type-error-union }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-union-error-text
        type: expect.preview
        at: { afterAction: expect-union-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Type 'string | Error' is not assignable to type 'string'."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-instanceof
        type: editor.type
        at: { mark: type-instanceof }
        target:
          {
            file: src/orders.ts,
            after: "export function kitchenReply(reply: string | Error): string {\n",
