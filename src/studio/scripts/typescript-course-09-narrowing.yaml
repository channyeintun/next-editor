  - id: typeof
    chapter: "typeof နဲ့ narrow လုပ်ခြင်း"
    narration: >
      [[mark:open-price-2]] ဈေးနှုန်း ဖိုင်ကို ပြန်သွားရအောင်။ [[mark:select-return-price]] ပထမ error က
      ဈေးနှုန်းကို ပြန်ပေးထားတဲ့ ဒီ line မှာပါ။ ဈေးနှုန်းက string ဖြစ်နိုင်သေးတဲ့အတွက်၊ number ပြန်ပေးရမယ့်
      function ကနေ ဒီအတိုင်း ပြန်ပေးလို့ မရဘူးလို့ ပြောနေတာပါ။ run လိုက်တော့လည်း စာသားကို ဒီအတိုင်း
      ပြန်ပေးလိုက်လို့၊ ခုနက ဂဏန်း ကပ်နေတဲ့ စာသား ထွက်လာတာပါ။ [[mark:type-typeof]] ဒါကြောင့် JavaScript
      ရဲ့ type of operator နဲ့ ဈေးနှုန်းက string ဟုတ်မဟုတ် စစ်ပါမယ်။ type of က တန်ဖိုးရဲ့ အမျိုးအစားကို string
      ဒါမှမဟုတ် number လိုမျိုး စာသား တစ်ခုနဲ့ ပြန်ပြောပေးပါတယ်။ string ဆိုရင် Number function နဲ့ ဂဏန်း
      ပြောင်းပြီး ချက်ချင်း ပြန်ပေးလိုက်ပါမယ်။ [[mark:read-typeof-fixed]] error ပျောက်သွားပြီး၊ Output ရဲ့ ပထမ line ကလည်း ၂၀၀၀
      ဖြစ်သွားပါပြီ။ [[mark:type-query-string]] TypeScript က ဈေးနှုန်းကို နေရာအလိုက် ဘယ်လို မြင်လဲ ဆိုတာ
      query comment နဲ့ မေးကြည့်ရအောင်။ ပထမ query ကို if ရဲ့ အထဲမှာ ထည့်ပါမယ်။ [[mark:read-query-string]]
      Types အပိုင်းမှာ string လို့ ပြနေပါတယ်။ if ထဲကို string ဖြစ်မှပဲ ရောက်လာနိုင်လို့ပါ။
      [[mark:type-query-number]] နောက် query တစ်ခုကို if ရဲ့ အောက်က line မှာ ထည့်ပါမယ်။
      [[mark:read-query-number]] ဒီမှာတော့ number လို့ ပြနေပါတယ်။ string ဆိုရင် if ထဲမှာ return လုပ်ပြီး
      ထွက်သွားပြီးသား ဖြစ်လို့၊ ဒီ line ကို ရောက်လာနိုင်တာ number တစ်ခုပဲ ကျန်လို့ပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 5: Narrowing with typeof",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/unions-literals-and-narrowing",
        }
      - {
          title: "TypeScript Handbook: Narrowing (typeof type guards, control flow analysis)",
          url: "https://www.typescriptlang.org/docs/handbook/2/narrowing.html#typeof-type-guards",
        }
      - {
          title: "MDN: typeof",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/typeof",
        }
    actions:
      - id: open-price-2
        type: workspace.openFile
        at: { mark: open-price-2 }
        path: src/price.ts
      - id: select-return-price
        type: editor.select
        at: { mark: select-return-price }
        target: { file: src/price.ts, text: "return price;", occurrence: 1 }
      - id: type-typeof
        type: editor.type
        at: { mark: type-typeof }
        target:
          {
            file: src/price.ts,
            after: "export function toKyat(price: number | string): number {\n",
            occurrence: 1,
          }
        text: "  if (typeof price === \"string\") {\n    return Number(price);\n  }\n"
        cadence: block
      - id: expect-typeof-two-errors
        type: expect.preview
        at: { afterAction: type-typeof }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-two-thousand
        type: expect.preview
        at: { afterAction: expect-typeof-two-errors }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-1 }
        textContains: "2000"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-query-string
        type: editor.type
        at: { mark: type-query-string }
        target: { file: src/price.ts, after: "    return Number(price);\n", occurrence: 1 }
        text: "    //            ^?\n"
        cadence: fast-explainer
      - id: expect-query-string
        type: expect.preview
        at: { afterAction: type-query-string }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        attribute: { name: data-type, value: "(parameter) price: string" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-query-number
        type: editor.type
        at: { mark: type-query-number }
        target: { file: src/price.ts, after: "  }\n  return price;\n", occurrence: 1 }
        text: "  //     ^?\n"
        cadence: fast-explainer
      - id: expect-query-number
        type: expect.preview
        at: { afterAction: type-query-number }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-2 }
        attribute: { name: data-type, value: "(parameter) price: number" }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: truthiness
    chapter: "Truthiness စစ်ဆေးချက်ရဲ့ ထောင်ချောက်"
    narration: >
      [[mark:select-if-price]] အခု ဒုတိယ function ကို ကြည့်ရအောင်။ ဒီ if က ဈေးနှုန်းကို ဘာနဲ့မှ
      မနှိုင်းယှဉ်ဘဲ၊ တန်ဖိုး ရှိမရှိကိုပဲ စစ်ထားပါတယ်။ JavaScript မှာ null နဲ့ undefined ကို if ထဲ ထည့်ရင်
      false လို အလုပ်လုပ်ပါတယ်။ ဒီလို if က false လို့ သတ်မှတ်တဲ့ တန်ဖိုးတွေကို falsy လို့ ခေါ်ပါတယ်။
      [[mark:type-query-truthy]] if ထဲမှာ query comment ထည့်ကြည့်ရအောင်။ [[mark:read-query-truthy]]
      Types အပိုင်းမှာ ဈေးနှုန်းကို number လို့ ပြနေပါတယ်။ null က falsy ဖြစ်လို့၊ TypeScript က if ထဲကနေ null ကို ဖယ်ပေးလိုက်တာပါ။
      ဒီအထိတော့ အဆင်ပြေနေပါတယ်။ [[mark:read-free-tea]] ဒါပေမဲ့ Output ရဲ့ ဒုတိယ line ကို ကြည့်ပါ။
      ရေနွေးကြမ်းကို ဆိုင်က အလကား တိုက်လို့ သူ့ ဈေးက သုည ဖြစ်ပါတယ်။ သုည ကလည်း falsy ဖြစ်နေလို့၊ ဈေး
      မသိသေးဘူး ဆိုတဲ့ ဘက်ကို ရောက်သွားတာပါ။ စာသား အလွတ်ကလည်း ဒီလိုပဲ falsy ဖြစ်ပါတယ်။ type တွေ
      မှန်နေတဲ့အတွက် TypeScript က ဒီ အမှားကို error အနေနဲ့ မပြနိုင်ပါဘူး။ [[mark:type-not-null]] ဒါကြောင့်
      ကိုယ် တကယ် ဖယ်ချင်တာ null ပဲ ဆိုတာကို တိတိကျကျ ရေးပါမယ်။ [[mark:read-free-tea-fixed]] Output မှာ
      ရေနွေးကြမ်းက သုည ကျပ် ဖြစ်သွားပါပြီ။ Types အပိုင်းမှာလည်း number ပဲ ဆက်ပြနေပါတယ်။ null နဲ့
      တိုက်ရိုက် နှိုင်းယှဉ်တာလည်း narrowing ပဲ ဖြစ်ပြီး၊ ဒီတစ်ခါတော့ သုည ကို မထိတော့တာပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 5: Other ways to narrow (truthiness and its empty-string trap)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/unions-literals-and-narrowing",
        }
      - {
          title: "TypeScript Handbook: Narrowing (truthiness narrowing, equality narrowing)",
          url: "https://www.typescriptlang.org/docs/handbook/2/narrowing.html#truthiness-narrowing",
        }
      - { title: "MDN: Falsy", url: "https://developer.mozilla.org/en-US/docs/Glossary/Falsy" }
    actions:
      - id: select-if-price
        type: editor.select
        at: { mark: select-if-price }
        target: { file: src/price.ts, text: "if (price) {", occurrence: 1 }
      - id: type-query-truthy
        type: editor.type
        at: { mark: type-query-truthy }
        target: { file: src/price.ts, after: "    return `${price} ကျပ်`;\n", occurrence: 1 }
        text: "    //        ^?\n"
        cadence: fast-explainer
      - id: expect-query-truthy
        type: expect.preview
        at: { afterAction: type-query-truthy }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-3 }
        attribute: { name: data-type, value: "(parameter) price: number" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-not-null
        type: editor.type
        at: { mark: type-not-null }
        target: { file: src/price.ts, after: "  if (price", occurrence: 1 }
        text: " !== null"
      - id: expect-free-tea
        type: expect.preview
        at: { afterAction: type-not-null }
        timeoutMs: 8000
        target: { by: testId, value: ts-out-2 }
        textContains: "ရေနွေးကြမ်း 0 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-query-still-number
        type: expect.preview
        at: { afterAction: expect-free-tea }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-3 }
        attribute: { name: data-type, value: "(parameter) price: number" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: early-exit
    chapter: "return နဲ့ throw"
    narration: >
      [[mark:open-orders-2]] အော်ဒါ ဖိုင်ကို သွားရအောင်။ [[mark:select-find]] စားပွဲ နံပါတ်နဲ့ ရှာတဲ့အခါ၊
      array ရဲ့ find method က ကိုက်တဲ့ အော်ဒါ မတွေ့ရင် undefined ကို ပြန်ပေးပါတယ်။ ဒါကြောင့် ရလာတဲ့
      တန်ဖိုးရဲ့ type က Order ဒါမှမဟုတ် undefined ဖြစ်ပြီး၊ Errors မှာ undefined ဖြစ်နိုင်တယ်လို့
      ပြနေတာပါ။ စားပွဲ ငါးမှာ အော်ဒါ ရှိလို့ Output က မှန်နေပေမယ့်၊ အော်ဒါ မရှိတဲ့ စားပွဲ ဆိုရင်တော့
      program က ဒီနေရာမှာ ရပ်သွားမှာပါ။ [[mark:type-throw]] ဒါကြောင့် အော်ဒါ မတွေ့ရင်၊ ဘာ ဖြစ်တာလဲ ဆိုတာ
      ရှင်းရှင်း ပြောတဲ့ error ကို throw လုပ်ပြီး function ကနေ ထွက်ပါမယ်။ ဒီတစ်ခါ undefined နဲ့ တိုက်ရိုက်
      နှိုင်းယှဉ်ထားတာကိုလည်း သတိထား ကြည့်ပါ။ [[mark:read-throw-fixed]] ဒီ error ပျောက်သွားပါပြီ။
      [[mark:type-query-order]] if ရဲ့ အောက်က line မှာ query ထည့်ကြည့်ရင်၊ [[mark:read-query-order]] Types
      အပိုင်းမှာ undefined မပါတော့ဘဲ Order တစ်ခုတည်း ပြပါတော့တယ်။ throw လုပ်ပြီးရင် function က ဆက်မ run တော့တဲ့အတွက်၊ undefined က if ရဲ့ အောက်ကို
      ရောက်မလာနိုင်လို့ပါ။ return ဖြစ်ဖြစ်၊ throw ဖြစ်ဖြစ်၊ ဒီလို စောစော ထွက်သွားတဲ့ စစ်ဆေးချက်က function ရဲ့
      ကျန်တဲ့ အပိုင်း တစ်ခုလုံးကို narrow လုပ်ပေးပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 5: Throwing errors to narrow",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/unions-literals-and-narrowing",
        }
      - {
          title: "TypeScript Handbook: Narrowing (control flow analysis, equality narrowing)",
          url: "https://www.typescriptlang.org/docs/handbook/2/narrowing.html#control-flow-analysis",
        }
      - {
          title: "MDN: Array.prototype.find() returns undefined when nothing matches",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/find",
        }
    actions:
      - id: open-orders-2
        type: workspace.openFile
        at: { mark: open-orders-2 }
