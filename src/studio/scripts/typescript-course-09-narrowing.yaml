      - id: type-kitchen-call
        type: editor.type
        at: { afterAction: open-main-2 }
        target:
          {
            file: src/main.ts,
            after: "console.log(whereTo({ item: \"လက်ဖက်ရည်\", pickupBy: \"မောင်မောင်\" }));\n",
            occurrence: 1,
          }
        text: "console.log(kitchenReply(new Error(\"မုန့်ဟင်းခါး ကုန်သွားပါပြီ\")));\n"
        cadence: block
      - id: expect-output-five
        type: expect.preview
        at: { afterAction: type-kitchen-call }
        timeoutMs: 8000
        target: { by: testId, value: ts-output }
        attribute: { name: data-count, value: "5" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-kitchen-output
        type: expect.preview
        at: { afterAction: expect-output-five }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-5 }
        textContains: "မုန့်ဟင်းခါး ကုန်သွားပါပြီ"
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: recap
    narration: >
      [[mark:board-recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ union type ကို သုံးတဲ့အခါ JavaScript ရဲ့ စစ်ဆေးချက်တွေနဲ့
      narrow လုပ်ပေးရပါတယ်။ [[mark:recap-typeof]] string တို့ number တို့လို type တွေကို type of နဲ့ ခွဲပါတယ်။
      [[mark:recap-truthy]] တန်ဖိုး ရှိမရှိ စစ်တဲ့ truthiness check က null နဲ့အတူ သုည နဲ့ စာသား အလွတ်ကိုပါ
      ဖယ်မိတတ်လို့၊ [[mark:recap-equal]] null ကိုပဲ ဖယ်ချင်ရင် null နဲ့ တိုက်ရိုက် နှိုင်းယှဉ်ပါ။
      [[mark:recap-exit]] return ဒါမှမဟုတ် throw နဲ့ စောစော ထွက်ရင် function ရဲ့ ကျန်တဲ့ အပိုင်း တစ်ခုလုံး
      narrow ဖြစ်ပါတယ်။ [[mark:recap-in]] object ပုံစံ မတူတာတွေကို in နဲ့ ခွဲပြီး၊ [[mark:recap-instanceof]]
      Error လို class ကနေ ဆောက်ထားတဲ့ object တွေကိုတော့ instance of နဲ့ ခွဲပါတယ်။ [[mark:recap-runtime]]
      ဒါတွေ အားလုံးက program run တဲ့ အချိန်မှာ တကယ် အလုပ်လုပ်တဲ့ JavaScript code တွေ ဖြစ်ပါတယ်။ နောက်
      lesson မှာတော့ ဘာ တန်ဖိုး မဆို ဖြစ်နိုင်တဲ့ unknown type နဲ့၊ ဘာ တန်ဖိုးမှ မရှိနိုင်တဲ့ never type ကို
      ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 5: Unions, Literals and Narrowing",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/unions-literals-and-narrowing",
        }
      - {
          title: "TypeScript Handbook: Narrowing",
          url: "https://www.typescriptlang.org/docs/handbook/2/narrowing.html",
        }
