      - id: draw-check
        type: whiteboard.apply
        at: { mark: draw-check }
        upsertIds: [a-arrow-1, a-check-box, a-check-name, a-check-sub]
        drawMs: 2600
      - id: draw-yes
        type: whiteboard.apply
        at: { mark: draw-yes }
        upsertIds: [a-arrow-yes, a-yes-box, a-yes-name, a-yes-sub]
        drawMs: 2400
      - id: draw-no
        type: whiteboard.apply
        at: { mark: draw-no }
        upsertIds: [a-arrow-no, a-no-box, a-no-name, a-no-sub]
        drawMs: 2400
      - id: draw-rule
        type: whiteboard.apply
        at: { mark: draw-rule }
        upsertIds: [a-rule]
        drawMs: 1800

  - id: starter
    narration: >
      [[mark:close-board]] ဒီနေ့ code ကို ကြည့်ရအောင်။ [[mark:open-price]] ဒါက ဈေးနှုန်းနဲ့ ဆိုင်တဲ့
      function တွေ ရေးထားတဲ့ ဖိုင်ပါ။ [[mark:select-to-kyat]] ပထမ function က ဈေးနှုန်းကို ကျပ်
      ဂဏန်းအဖြစ် ပြန်ပေးရပါမယ်။ parameter က number ဒါမှမဟုတ် string ဖြစ်နိုင်ပေမယ့်၊ ပြန်ပေးတာကတော့ number
      ဖြစ်ရပါမယ်။ [[mark:select-price-label]] ဒုတိယ function ကတော့ ဈေးနှုန်းကို စာသားအဖြစ် ပြပေးပါတယ်။
      ဈေး မသတ်မှတ်ရသေးတဲ့ ပစ္စည်းအတွက် null ကိုလည်း လက်ခံပါတယ်။ [[mark:open-orders]] ဒါကတော့ အော်ဒါတွေနဲ့
      ဆိုင်တဲ့ ဖိုင်ပါ။ [[mark:select-item-at]] ပထမ function က စားပွဲ နံပါတ်နဲ့ အော်ဒါကို ရှာပြီး၊ မှာထားတဲ့
      ပစ္စည်းကို ပြန်ပေးပါတယ်။ [[mark:select-where-to]] ဒုတိယ function ကတော့ အော်ဒါကို ဘယ်ကို ပို့ရမလဲ
      ဆိုတာ ပြောပေးပါတယ်။ ဆိုင်ထဲမှာ ထိုင်စားတဲ့ အော်ဒါမှာ စားပွဲ နံပါတ် ပါပါတယ်။ [[mark:select-parcel]] ပါဆယ်
      အော်ဒါမှာတော့ စားပွဲ နံပါတ် မပါဘဲ၊ လာယူမယ့်သူရဲ့ နာမည် ပါပါတယ်။ [[mark:select-kitchen]] နောက်ဆုံး
      function ကတော့ မီးဖိုချောင်က ပြန်ပြောတဲ့ စာကို ငွေရှင်းတဲ့ screen မှာ ပြဖို့ ပြန်ပေးပါတယ်။
      [[mark:open-main]] main ဖိုင်ကတော့ ဒီ function တွေကို ခေါ်ပြီး၊ ရလဒ် လေးခုကို ထုတ်ပြပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 5: Unions, Literals and Narrowing",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/unions-literals-and-narrowing",
        }
      - {
          title: "TypeScript Handbook: Everyday Types (union types)",
