scenes:
  - id: hook
    chapter: Flow ၃၊ conversion နဲ့ cashback
    narration: >-
      ငွေ system အတွင်းမှာပဲ ရွေ့တဲ့ conversion မှာ မယုံရတဲ့ rail လည်း မရှိ၊ ပြန်ယူမရတဲ့ broadcast လည်း
      မရှိပါဘူး။ အခက်က ငွေပမာဏကို ဘယ်လို ကိုယ်စားပြုလဲ၊ ဘယ်လို round လုပ်လဲ ဆိုတဲ့ layer မှာ ရှိပြီး၊ No
      invented data၊ ငွေကို မရှိဘဲ မဖန်တီးရဘူး ဆိုတဲ့ မူကို အပြင်းဆုံး စမ်းတဲ့ flow ပါ။ [[mark:sel-paid]] ဒီ
      program မှာ user က ယူရို တစ်ထောင်ကို USDC ပြောင်းပါတယ်။ [[mark:sel-early]] ပထမ နည်းက rate ကို ဒသမ
      လေးနေရာ အရင် round လုပ်ပြီးမှ ယူရို ပမာဏနဲ့ မြှောက်တာပါ။ [[mark:sel-buy]] ဒုတိယ နည်းက ယူရိုကို quote ရဲ့
      ဈေးနဲ့ အတိအကျ စားပြီး၊ နောက်ဆုံးမှ တစ်ခါပဲ round လုပ်တာပါ။ နှစ်ခု ဘယ်လောက် ကွာမလဲ ခန့်မှန်းကြည့်ပါ။
      [[mark:run-1]] run လိုက်ရအောင်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Flow 3: An in-app conversion with cashback (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#flow-3-an-in-app-conversion-with-cashback",
        }
      - {
          title: "Fintech Engineering Handbook — Precision handling (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#precision-handling",
        }
      - { title: "Go standard library — math/big (Rat)", url: "https://pkg.go.dev/math/big#Rat" }
    actions:
      - { id: open-main-1, type: workspace.openFile, at: { scene: start }, path: main.go }
      - id: sel-paid
        type: editor.select
        at: { mark: sel-paid }
        target: { file: main.go, text: "\tpaid := int64(1000_00)", occurrence: 1 }
      - id: sel-early
        type: editor.select
        at: { mark: sel-early }
        target:
          {
            file: main.go,
            text: "\trate4 := rat(new(big.Rat).Inv(quote.Ask).FloatString(4))",
            occurrence: 1,
          }
      - id: sel-buy
        type: editor.select
        at: { mark: sel-buy }
        target: { file: main.go, text: "\texact, got := buy(paid, quote.Ask)", occurrence: 1 }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "spread to revenue:  1.350390 USDC",
          timeoutMs: 8000,
        }

  - id: read-1
    narration: >-
      [[mark:pt-early]] rate ကို စောစော round လုပ်တဲ့ နည်းက USDC တစ်ထောင့်ရှစ်ဆယ့်သုံး အတိအကျ ပေးပါတယ်။
      [[mark:pt-full]] full precision နဲ့ဆို အဲဒီထက် USDC သုည ဒသမ သုညလေးငါး လောက် နည်းပါတယ်။ ကွာတဲ့ ငွေက ဘယ်
      account ကမှ မလာပါဘူး၊ rate ရဲ့ ဒသမ နောက်ဆုံး နေရာတွေကနေ မရှိဘဲ ပေါ်လာတာပါ၊ conversion တိုင်းမှာ ပမာဏ တစ်မျိုးစီနဲ့ ထပ်ဖြစ်နိုင်ပါတယ်။
      [[mark:pt-mid]] mid rate နဲ့ဆို ဒီ ယူရိုက USDC ပိုရပါတယ်။ [[mark:pt-spread]] အဲဒီ ကွာခြားချက်က spread ပါ၊ ကိုယ့်
      revenue ဖြစ်ပြီး explicit book လုပ်ရမယ့် ငွေပါ။ [[mark:dock-1]] ဂဏန်းတွေ ဘယ်က လာလဲ အဆင့်လိုက် ကြည့်ရအောင်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Rounding strategies (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#rounding-strategies",
        }
    actions:
      - id: pt-early
        type: console.point
        at: { mark: pt-early }
        target: { text: "rate rounded first: 1083.000000 USDC", occurrence: 1 }
      - id: pt-full
        type: console.point
        at: { mark: pt-full }
        target: { text: "full precision:     1082.954299 USDC", occurrence: 1 }
      - id: pt-mid
        type: console.point
        at: { mark: pt-mid }
        target: { text: "at the mid 0.92225: 1084.304689 USDC", occurrence: 1 }
      - id: pt-spread
        type: console.point
        at: { mark: pt-spread }
        target: { text: "spread to revenue:  1.350390 USDC", occurrence: 1 }
      - { id: dock-1, type: runtime.collapseDock, at: { mark: dock-1 } }

  - id: quote
    chapter: Quote၊ reservation၊ asset
    narration: >-
      [[mark:show-quote]] ပထမ အဆင့်က quote ပါ။ [[mark:pt-ask]] lesson ၇ မှာ မြင်ခဲ့သလို rate မှာ direction ရှိပါတယ်။
      user က USDC ဝယ်တာမို့ ကိုယ်က ask ဈေးနဲ့ ရောင်းပါတယ်။ [[mark:pt-bid]] USDC ကို ယူရို ပြန်ပြောင်းရင် bid ဈေးကို
      သုံးရပြီး၊ ဒါက ask ရဲ့ ပြောင်းပြန် မဟုတ်ပါဘူး။ [[mark:pt-qmid]] အလယ်က mid ဈေးနဲ့ ဒီ quote မှာ trade မလုပ်ပါဘူး၊
      spread ကို တိုင်းဖို့နဲ့ နောက်မှ holding ရဲ့ တန်ဖိုး တွက်ဖို့ reference အဖြစ်ပဲ သုံးပါတယ်။ [[mark:quote-2]]
      request က တခြား flow တွေလိုပဲ idempotency key နဲ့ ရောက်ပြီး၊ quote id ကို တွဲထားပြီး ယူရို တစ်ထောင်ကို lesson
      ၁၈ မှာလို reserve လုပ်ပါတယ်။ [[mark:pt-assets]] ပြီးတော့ ယူရိုနဲ့ USDC ကို ဘယ်တော့မှ ပေါင်းမတွက်ပါဘူး။ lesson ၆
      မှာလို USDC ဆိုတာ network နဲ့ contract address နဲ့ ခွဲသိရတဲ့ token ဖြစ်ပြီး ဒေါ်လာနဲ့ အတူတူ မဟုတ်ပါဘူး၊ ဒသမ
      ခြောက်နေရာ သုံးပါတယ်။ currency နှစ်ခုကြားက တံတားက ထိန်းထားတဲ့ rate နဲ့ explicit conversion တစ်ခုပဲ ရှိပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — FX Rates (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#fx-rates",
        }
      - {
          title: "Fintech Engineering Handbook — Currency handling (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#currency-handling",
        }
      - {
          title: "Circle — USDC-backed stablecoin specification (native USDC, 6 decimal places)",
          url: "https://developers.circle.com/xreserve/concepts/usdc-backed-stablecoin-specification",
        }
    actions:
      - {
          id: show-quote,
          type: slide.show,
          at: { mark: show-quote, offsetMs: -700 },
          slideId: quote-1,
        }
      - { id: pt-ask, type: slide.point, at: { mark: pt-ask }, target: { x: 0.256, y: 0.409 } }
      - { id: pt-bid, type: slide.point, at: { mark: pt-bid }, target: { x: 0.256, y: 0.687 } }
      - { id: pt-qmid, type: slide.point, at: { mark: pt-qmid }, target: { x: 0.123, y: 0.493 } }
      - { id: quote-2, type: slide.show, at: { mark: quote-2 }, slideId: quote-2 }
      - {
          id: pt-res,
          type: slide.point,
          at: { afterAction: quote-2 },
          target: { x: 0.738, y: 0.587 },
        }
      - {
          id: pt-assets,
          type: slide.point,
          at: { mark: pt-assets },
          target: { x: 0.355, y: 0.842 },
        }

  - id: math
    chapter: Full precision၊ rounding တစ်ခါ
    narration: >-
      [[mark:show-math]] တွက်တဲ့အခါ ကြားထဲမှာ ဘာမှ round မလုပ်ပါဘူး။ [[mark:pt-ex]] ယူရို တစ်ထောင်ကို ask ဈေးနဲ့ စားရင်
      ဒသမ နောက်မှာ အဆုံးမရှိ ဆက်သွားတဲ့ ဂဏန်း ထွက်လို့ Go ရဲ့ rational number type နဲ့ ပိုင်းဝေ ပိုင်းခြေ အတိုင်း ထားပါတယ်။
      [[mark:math-2]] နယ်နိမိတ်ကို ရောက်မှ၊ ဆိုလိုတာက သိမ်းမယ့် ပမာဏ ဖြစ်မှ USDC ရဲ့ ဒသမ ခြောက်နေရာကို တစ်ခါပဲ round
      လုပ်ပါတယ်။ lesson ၅ မှာလို mode ကိုလည်း တမင် ရွေးပါတယ်၊ ဒီမှာ round down ပါ၊ မရှိတဲ့ ငွေကို မပေးမိအောင် conservative
      ဖြစ်တဲ့ ရွေးချယ်မှုပါ။ [[mark:pt-early2]] rate ကို စောစော round လုပ်တဲ့ နည်းကတော့ ဒီ ဆုံးဖြတ်ချက်ကို ကြားထဲမှာ
      ဝှက်ထားတာပါ၊ ဒီ ဥပမာမှာ ငွေ ဖန်တီးမိပြီး တခြား rate မှာဆို ငွေ ပျောက်နိုင်ပါတယ်။ [[mark:math-3]] spread
      ကိုတော့ explicit book လုပ်ပါတယ်။ ယူရို တစ်ထောင်ကို mid နဲ့ တန်ဖိုးထားတဲ့ USDC ထဲက user ရတဲ့ USDC ကို
      နုတ်ပြီး revenue spread account ထဲ ထည့်တာပါ။ [[mark:pt-rev]] ဒါကြောင့် round down လုပ်လိုက်လို့ ကျန်တဲ့ အပိုင်းအစလေးတွေ ပျောက်မသွားဘဲ spread
      ထဲမှာ နာမည်နဲ့ ရှိနေပါတယ်။ transaction rate ကိုလည်း column တစ်ခုအဖြစ် မသိမ်းပါဘူး၊ amount နှစ်ခုကို စားရင်
      ထွက်လာလို့ပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Flow 3: An in-app conversion with cashback (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#flow-3-an-in-app-conversion-with-cashback",
        }
      - {
          title: "Fintech Engineering Handbook — Rounding strategies (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#rounding-strategies",
        }
    actions:
      - { id: show-math, type: slide.show, at: { mark: show-math }, slideId: math-1 }
      - { id: pt-ex, type: slide.point, at: { mark: pt-ex }, target: { x: 0.1, y: 0.369 } }
      - { id: math-2, type: slide.show, at: { mark: math-2 }, slideId: math-2 }
      - {
          id: pt-got,
          type: slide.point,
          at: { afterAction: math-2 },
          target: { x: 0.263, y: 0.576 },
        }
      - {
