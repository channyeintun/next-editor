  - id: try-it
    chapter: ကိုယ်တိုင် စမ်းကြည့်ပါ
    narration: >-
      [[mark:close-iv]] ကိုယ်တိုင် စမ်းကြည့်ဖို့ တစ်ခု ရှိပါတယ်။ [[mark:sel-try]] cashback ရာခိုင်နှုန်းကို သုည ဒသမ တစ် ကနေ
      သုည ဒသမ နှစ် ကို ပြောင်းပြီး run ကြည့်ပါ။ promo expense က spread ထက် များသွားလို့ ဒီ trade မှာ ကိုယ်က ရှုံးပေမဲ့၊
      USDC ပေါင်းလဒ်ကတော့ သုည ဖြစ်နေဆဲ ဆိုတာ တွေ့ရပါမယ်။ books ညီတာနဲ့ business မှာ အမြတ်ရတာက မတူပါဘူး။
      [[mark:recap]] ပြန်ချုပ်ရရင်၊ conversion မှာ quote က direction ရှိ၊ currency တွေကို ဘယ်တော့မှ မပေါင်း၊ တစ်ခါပဲ
      round လုပ်ပြီး၊ spread နဲ့ cashback နှစ်ခုလုံးကို နာမည်ရှိတဲ့ account ထဲ post လုပ်မှ ငွေ မပေါ်မပျောက်ပါဘူး။
      နောက်ဆုံး lesson မှာ ဒီ course တစ်ခုလုံးကို system design interview တစ်ခုအတွက် အဆင့် ခြောက်ဆင့်နဲ့ ပြန်စုပြီး
      wallet transfer API တစ်ခုကို ဒီဇိုင်းဆွဲကြည့်ပါမယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Flow 3: An in-app conversion with cashback (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#flow-3-an-in-app-conversion-with-cashback",
        }
    actions:
      - { id: close-iv, type: slide.close, at: { mark: close-iv } }
      - id: sel-try
        type: editor.select
        at: { mark: sel-try }
        target: { file: main.go, text: 'rat("0.001")', occurrence: 1 }

