  - id: post
    chapter: Currency တစ်ခုချင်း balance
    narration: >-
      [[mark:close-math]] ဒီ conversion ကို post လုပ်ကြည့်ရအောင်။ [[mark:open-ledger]] ဒီ lesson ရဲ့ ledger မှာ line
      တိုင်းမှာ currency ပါပါတယ်။ [[mark:sel-net]] Post က debit နဲ့ credit ကို currency တစ်ခုချင်း သီးခြား စစ်ပြီး၊ ယူရိုနဲ့
      USDC ကို ဘယ်တော့မှ ပေါင်းမတွက်ပါဘူး။ [[mark:open-main-2]] main မှာ conversion ကို post လုပ်ပါမယ်။ [[mark:type-post]] reservation ကို settle လုပ်တဲ့
      conversion transaction ထဲမှာ ယူရိုဘက်က user ကို debit လုပ်ပြီး fx conversion account ကို credit လုပ်ပါတယ်။
      fx conversion account ဆိုတာ currency နှစ်ခုကြားက တံတားဖြစ်ပြီး ကိုယ့် FX position ကို ပြတဲ့ account ပါ။ USDC ဘက်မှာတော့ အဲဒီ account ကို mid rate နဲ့ တွက်ထားတဲ့ ပမာဏ
      နဲ့ debit လုပ်၊ user ကို ရတဲ့ ပမာဏ credit လုပ်ပြီး၊ ကွာတာကို revenue spread ထဲ credit လုပ်ပါတယ်။ [[mark:post-trail]] တကယ့် system မှာ
      posting က lesson ၁၁ ရဲ့ အချိန်တွေနဲ့ audit trail ပါရပါမယ်။ posting နဲ့ outbox row ကို database transaction
      တစ်ခုတည်းမှာ commit လုပ်ပြီး၊ နောက်ဆုံးမှာ currency တစ်ခုချင်းရဲ့ ပေါင်းလဒ်ကို
      ထုတ်ပါတယ်။ [[mark:run-2]] run လိုက်ရအောင်။ [[mark:pt-eur]] ယူရို ပေါင်းလဒ်က သုည ဖြစ်ပြီး user ရဲ့ ယူရိုက
      conversion account ကို ရောက်သွားပါတယ်။ [[mark:pt-usdc]] USDC ပေါင်းလဒ်ကလည်း သုည ဖြစ်ပါတယ်၊ user ရတဲ့ ပမာဏနဲ့
      spread ပေါင်းရင် conversion account ရဲ့ USDC နဲ့ အတိအကျ ညီလို့ပါ။ ဆိုလိုတာက conversion account ရဲ့ balance နှစ်ခုက
      mid rate နဲ့ တန်ဖိုး တူပြီး၊ ကွာတာ အားလုံးက spread ထဲ ရောက်နေပါတယ်။ [[mark:pt-out1]] outbox ထဲမှာလည်း conversion
      event ရှိနေပါပြီ။ [[mark:dock-2]] ဒါပေမဲ့ ဒီ flow မှာ cashback မပါသေးပါဘူး။
    sources:
      - {
          title: "Fintech Engineering Handbook — Double-entry bookkeeping (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#double-entry-bookkeeping",
        }
      - {
          title: "Fintech Engineering Handbook — Notifying reliably (Outbox and CDC) (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#notifying-reliably-outbox-and-cdc",
        }
    actions:
      - { id: close-math, type: slide.close, at: { mark: close-math } }
      - { id: open-ledger, type: workspace.openFile, at: { mark: open-ledger }, path: ledger.go }
      - id: sel-net
        type: editor.select
        at: { mark: sel-net }
        target:
          {
            file: ledger.go,
            text: "\t\tnet[line.Currency] += line.Debit - line.Credit",
            occurrence: 1,
          }
      - { id: open-main-2, type: workspace.openFile, at: { mark: open-main-2 }, path: main.go }
      - id: type-post
        type: editor.type
        at: { mark: type-post }
        target:
          {
            file: main.go,
            after: "\tfmt.Println(\"spread to revenue: \", format(spread, 6), \"USDC\")\n",
            occurrence: 1,
          }
        text: "\n\ts.Commit(Tx{ID: \"conv-1\", Memo: \"EUR to USDC at quote q-1\", Lines: []Line{\n\t\t{Account: user, Currency: eur, Debit: paid},\n\t\t{Account: \"equity:fx-conversion\", Currency: eur, Credit: paid},\n\t\t{Account: \"equity:fx-conversion\", Currency: usdc, Debit: atMid},\n\t\t{Account: user, Currency: usdc, Credit: got},\n\t\t{Account: \"revenue:spread\", Currency: usdc, Credit: spread},\n\t}}, Event{\"conv-1\", \"conversion.settled\"})\n\ts.report()\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "USDC sum 0.000000  user 1082.954299  spread 1.350390  promo 0.000000",
          timeoutMs: 8000,
        }
      - id: pt-eur
        type: console.point
        at: { mark: pt-eur }
        target: { text: "EUR  sum 0.00", occurrence: 1 }
      - id: pt-usdc
        type: console.point
        at: { mark: pt-usdc }
        target: { text: "USDC sum 0.000000  user 1082.954299", occurrence: 1 }
      - id: pt-out1
        type: console.point
        at: { mark: pt-out1 }
        target: { text: "outbox: dep-1 conv-1", occurrence: 1 }
      - { id: dock-2, type: runtime.collapseDock, at: { mark: dock-2 } }
      - {
          id: expect-file,
          type: expect.file,
          at: { afterAction: run-2 },
          path: main.go,
          contains: '{Account: "revenue:spread", Currency: usdc, Credit: spread},',
        }

  - id: cashback
    chapter: Cashback က တကယ့် ငွေ
    narration: >-
      [[mark:type-cb]] cashback အတွက် user ရဲ့ balance ကို တိုက်ရိုက် တိုးလိုက်ရင် ငွေကို မရှိဘဲ ဖန်တီးလိုက်တာပါ။ ဒါကြောင့် ဒီ
      line တွေက USDC ပမာဏရဲ့ သုည ဒသမ တစ် ရာခိုင်နှုန်းကို တွက်ပြီး၊ သူ့ကိုယ်ပိုင် rounding ဆုံးဖြတ်ချက်နဲ့ round down
      လုပ်ပြီး၊ company ရဲ့ promo expense account ကနေ user ဆီကို ပုံမှန် posting တစ်ခုနဲ့ ရွှေ့ပါတယ်။ outbox row
      လည်း တွဲပါပါတယ်။ [[mark:run-3]] run လိုက်ရအောင်။ [[mark:pt-usdc3]] USDC ပေါင်းလဒ်က သုည ဖြစ်နေဆဲပါ။ user
      ရဲ့ USDC တိုးလာပြီး promo expense က အဲဒီ ပမာဏအတိုင်း ပေါ်လာပါတယ်၊ ငွေ ဘယ်ကလာလဲ ဆိုတာ ledger က
      ဖြေနိုင်ပါတယ်။ [[mark:pt-out3]] outbox ထဲမှာ cashback event ထပ်ရောက်ပါတယ်။ lesson ၂၅ မှာလို relay က at least once
      publish လုပ်လို့ statement၊ notification၊ analytics လို consumer တွေက event id နဲ့ dedupe လုပ်ရပါတယ်။
      [[mark:show-books]] entry အားလုံးကို currency အလိုက် ပြန်ကြည့်ရအောင်။ [[mark:pt-eurrows]] ယူရို line နှစ်ကြောင်းက
      သူ့ချင်း သုည ဖြစ်ပါတယ်။ [[mark:books-2]] USDC line သုံးကြောင်းကလည်း သူ့ချင်း သုည ဖြစ်ပြီး၊ [[mark:pt-norate]]
      rate column မရှိပါဘူး၊ USDC ပမာဏကို ယူရို ပမာဏနဲ့ စားရင် ရပါတယ်။ [[mark:books-3]] cashback line နှစ်ကြောင်းက
      USDC ထဲမှာပဲ ထပ်ပြီး ညီပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Flow 3: An in-app conversion with cashback (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#flow-3-an-in-app-conversion-with-cashback",
        }
      - {
          title: "Fintech Engineering Handbook — Notifying reliably (Outbox and CDC) (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#notifying-reliably-outbox-and-cdc",
        }
    actions:
      - id: type-cb
        type: editor.type
        at: { mark: type-cb }
        target: { file: main.go, after: "\ts.report()\n", occurrence: 1 }
        text: "\n\tback := share(got, rat(\"0.001\")) // a 0.1% cashback, rounded down: our decision\n\ts.Commit(Tx{ID: \"cb-1\", Memo: \"cashback on conv-1\", Lines: []Line{\n\t\t{Account: \"expense:promo\", Currency: usdc, Debit: back},\n\t\t{Account: user, Currency: usdc, Credit: back},\n\t}}, Event{\"cb-1\", \"cashback.paid\"})\n\ts.report()\n"
        cadence: line-by-line
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
