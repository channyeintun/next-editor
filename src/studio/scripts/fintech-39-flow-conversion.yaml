# Fintech Engineering, lesson 39: end to end, a conversion with cashback (Burmese).
#
# Source: Fintech Engineering Handbook, Appendix B "Flow 3: An in-app conversion with cashback"
# (CC BY 4.0, Voytek Pitula), with pointers back to the lessons that taught each pattern.
# Start state: ledger.go (the course ledger, every line in one currency, balanced per currency,
# Sum per currency), convert.go (the two assets, USDC as (network, contract); a directional quote
# in EUR per USDC; big.Rat math; toMinor = the one rounding, down; share; the outbox Store),
# main.go (1000.00 EUR deposited; the rate rounded too early vs full precision; the mid; the spread).
# Edits, all insert-only, in main.go:
#   1. the conversion posted in EUR and USDC, spread to revenue, outbox row -> run-2 both sums zero
#   2. a 0.1% cashback funded from expense:promo                             -> run-3 still zero
# Runs: run-1 (early rounding 1083.000000 vs 1082.954299, mid, spread), run-2, run-3.
# Figures: quote (direction, key, reservation, asset identity), math (one rounding, the spread),
# books (the entries per currency), pull (spread vs cashback), iv.
# Facts: A03 (USDC uses 6 decimals).
# Built by ~/Documents/fintech-course-work/tools/build-lesson.ts; fixtures by sim-go.ts --write.
