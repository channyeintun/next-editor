      convert.go: |
        package main

        import "math/big"

        // The two assets. USDC is a token, identified by (network, contract), not by its symbol and not
        // equal to the dollar; the ids here are illustrative (lesson 06).
        const (
        	eur  = "EUR"
        	usdc = "net-a:0x1111"
        )

        var symbol = map[string]string{eur: "EUR", usdc: "USDC"}
        var decimals = map[string]int{eur: 2, usdc: 6}

        // Quote prices one USDC in EUR. It is directional: the user buys USDC at the ask; selling USDC
        // back would get the bid, which is not the inverse of the ask.
        type Quote struct {
        	ID       string
        	Bid, Ask *big.Rat
        }

        var quote = Quote{"q-1", rat("0.92110"), rat("0.92340")}

        func rat(s string) *big.Rat {
        	r, _ := new(big.Rat).SetString(s)
        	return r
        }

        // toMinor is the one rounding: an exact amount of an asset, down to its minor units.
        func toMinor(x *big.Rat, asset string) int64 {
        	scale := new(big.Int).Exp(big.NewInt(10), big.NewInt(int64(decimals[asset])), nil)
        	return down(new(big.Rat).Mul(x, new(big.Rat).SetInt(scale)))
        }

        // down drops what is left below one minor unit.
        func down(x *big.Rat) int64 { return new(big.Int).Quo(x.Num(), x.Denom()).Int64() }

        // buy is how much USDC paid EUR (in cents) buys at price EUR per USDC, exact and then rounded.
        func buy(paid int64, price *big.Rat) (*big.Rat, int64) {
        	exact := new(big.Rat).Quo(big.NewRat(paid, 100), price)
        	return exact, toMinor(exact, usdc)
        }

        // share is rate × an amount in minor units, rounded down like everything else.
        func share(amount int64, rate *big.Rat) int64 {
        	return down(new(big.Rat).Mul(big.NewRat(amount, 1), rate))
        }

        // Event is an outbox row: published after the commit, at least once, deduped on ID downstream.
        type Event struct{ ID, Type string }

        // Store commits a posting and its outbox row in one database transaction, or neither.
        type Store struct {
        	ledger Ledger
        	outbox []Event
        }

        func (s *Store) Commit(tx Tx, evt Event) {
        	if err := s.ledger.Post(tx); err != nil {
        		panic(err)
        	}
        	s.outbox = append(s.outbox, evt)
        }
      ledger.go: |
        package main

        import (
        	"fmt"
        	"strings"
        )

        // Line is one row of a transaction: an amount of one asset on one side of one account.
        type Line struct {
        	Account  string
        	Currency string // the asset: a fiat code, or a token's (network, contract)
        	Debit    int64
        	Credit   int64
        }

        // Tx is one business event. All of its lines are posted together, or none of them.
        type Tx struct {
        	ID    string
        	Memo  string
        	Lines []Line
        }

        // Ledger is an append-only list of posted transactions. Balances are derived from it.
        type Ledger struct {
        	txs []Tx
        }

        // Post appends a transaction only if, in every currency, its debits equal its credits.
        // Two currencies are never added together.
        func (l *Ledger) Post(tx Tx) error {
        	net := map[string]int64{}
        	for _, line := range tx.Lines {
        		net[line.Currency] += line.Debit - line.Credit
        	}
        	for _, c := range []string{eur, usdc} {
        		if net[c] != 0 {
        			return fmt.Errorf("tx %s is not balanced in %s: %s", tx.ID, symbol[c], format(net[c], decimals[c]))
        		}
        	}
        	l.txs = append(l.txs, tx)
        	return nil
        }

        // Balance derives an account's balance in one currency, on the side where its kind grows.
        func (l *Ledger) Balance(account, currency string) int64 {
        	var debit, credit int64
        	for _, tx := range l.txs {
        		for _, line := range tx.Lines {
        			if line.Account == account && line.Currency == currency {
        				debit += line.Debit
        				credit += line.Credit
        			}
        		}
        	}
        	if kind, _, _ := strings.Cut(account, ":"); kind == "asset" || kind == "expense" {
        		return debit - credit
        	}
        	return credit - debit
        }

        // Sum is Σ debits − Σ credits over every account in one currency: always zero.
        func (l *Ledger) Sum(currency string) int64 {
        	var n int64
        	for _, tx := range l.txs {
        		for _, line := range tx.Lines {
        			if line.Currency == currency {
        				n += line.Debit - line.Credit
        			}
        		}
        	}
        	return n
        }

        // format prints minor units with exp decimal places: format(1234, 2) is "12.34" (money.go).
        func format(minor int64, exp int) string {
        	sign := ""
        	if minor < 0 {
        		sign, minor = "-", -minor
        	}
        	digits := fmt.Sprintf("%0*d", exp+1, minor)
        	if exp == 0 {
        		return sign + digits
        	}
        	return sign + digits[:len(digits)-exp] + "." + digits[len(digits)-exp:]
        }
      main.go: |
        package main

        import (
        	"fmt"
        	"math/big"
        )

        const user = "liability:user:1042"

        func main() {
        	s := &Store{}
        	s.Commit(Tx{ID: "dep-1", Memo: "deposit", Lines: []Line{
        		{Account: "asset:bank", Currency: eur, Debit: 1000_00},
        		{Account: user, Currency: eur, Credit: 1000_00},
        	}}, Event{"dep-1", "deposit.credited"})
        	paid := int64(1000_00) // the user converts 1000.00 EUR into USDC, key k-1, reserved

        	rate4 := rat(new(big.Rat).Inv(quote.Ask).FloatString(4)) // USDC per EUR, rounded too early
        	early := toMinor(new(big.Rat).Mul(big.NewRat(paid, 100), rate4), usdc)
        	exact, got := buy(paid, quote.Ask)
        	mid := new(big.Rat).Quo(new(big.Rat).Add(quote.Bid, quote.Ask), big.NewRat(2, 1))
        	_, atMid := buy(paid, mid)
        	spread := atMid - got
        	fmt.Println("rate rounded first:", format(early, 6), "USDC")
        	fmt.Println("full precision:    ", format(got, 6), "USDC, exact", exact.FloatString(10)+"…")
        	fmt.Println("at the mid", mid.FloatString(5)+":", format(atMid, 6), "USDC")
        	fmt.Println("spread to revenue: ", format(spread, 6), "USDC")
        }

        // report prints each currency on its own: the sum, then the accounts this flow touches.
        func (s *Store) report() {
        	l, u := &s.ledger, func(c string) string { return format(s.ledger.Balance(user, c), decimals[c]) }
        	fmt.Printf("EUR  sum %s  user %s  fx-conversion %s\n", format(l.Sum(eur), 2), u(eur),
        		format(l.Balance("equity:fx-conversion", eur), 2))
        	fmt.Printf("USDC sum %s  user %s  spread %s  promo %s\n", format(l.Sum(usdc), 6), u(usdc),
        		format(l.Balance("revenue:spread", usdc), 6), format(l.Balance("expense:promo", usdc), 6))
        	fmt.Print("outbox:")
        	for _, e := range s.outbox {
        		fmt.Print(" ", e.ID)
        	}
        	fmt.Println()
        }
