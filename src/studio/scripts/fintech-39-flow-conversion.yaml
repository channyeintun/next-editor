  - id: pull
    chapter: ခက်တဲ့ နေရာ၊ ဆန့်ကျင်ဘက် ဆွဲအား
    narration: >-
      [[mark:show-pull]] ခက်တဲ့ နေရာက transaction တစ်ခုတည်းမှာ ငွေ နှစ်စု ဆန့်ကျင်ဘက် ရွေ့တာပါ။ [[mark:pt-sprd]] spread က
      user ဆီကနေ ကိုယ့်ဆီ ရောက်တဲ့ revenue ပါ။ [[mark:pull-2]] cashback ကတော့ ကိုယ်က user ကို ပေးတဲ့ expense ပါ။
      နှစ်ခုလုံး တကယ့် ငွေ ဖြစ်ပြီး၊ နှစ်ခုလုံး books ထဲကို ဖြတ်ပြီး နှစ်ခုလုံး round လုပ်ရပါတယ်။ [[mark:pt-net]] ဒါကြောင့်
      ဒီ trade တစ်ခုရဲ့ margin ကို account နှစ်ခုကနေ တိုက်ရိုက် ဖတ်လို့ ရပါတယ်။ cashback ကို spread ထဲက နုတ်ပြီး
      net တစ်ခုတည်း book လုပ်လိုက်ရင်တော့ marketing ကုန်ကျစရိတ်လည်း မမြင်ရ၊ spread ဝင်ငွေလည်း မမြင်ရ ဖြစ်သွားပါတယ်။
      [[mark:pt-both]] ဒါကြောင့် ဒီ transaction တစ်ခုတည်းက မူ နှစ်ခုကို တပြိုင်နက် ထိန်းရပါတယ်။ currency တိုင်းမှာ
      books ညီပြီး ဘာမှ မဖန်တီးတာက No invented data ဖြစ်ပြီး၊ အပိုင်းအစ တိုင်းကို account တစ်ခုခုမှာ ခြေရာခံထားတာက
      No lost data ပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Flow 3: An in-app conversion with cashback (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#flow-3-an-in-app-conversion-with-cashback",
        }
    actions:
      - { id: show-pull, type: slide.show, at: { mark: show-pull }, slideId: pull-1 }
      - { id: pt-sprd, type: slide.point, at: { mark: pt-sprd }, target: { x: 0.194, y: 0.42 } }
      - { id: pull-2, type: slide.show, at: { mark: pull-2 }, slideId: pull-2 }
      - {
          id: pt-pro,
          type: slide.point,
          at: { afterAction: pull-2 },
          target: { x: 0.806, y: 0.42 },
        }
      - { id: pt-net, type: slide.point, at: { mark: pt-net }, target: { x: 0.351, y: 0.82 } }
      - { id: pt-both, type: slide.point, at: { mark: pt-both }, target: { x: 0.309, y: 0.92 } }

  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] Fintech system design interview တွေမှာ currency conversion feature တစ်ခု ဒီဇိုင်းဆွဲပါ၊ ငွေ
      မပေါ်မပျောက်ဘူး ဆိုတာ ဘယ်လို သေချာမလဲ လို့ မေးလေ့ရှိပါတယ်။ decimal type သုံးမယ် လို့ပဲ ဖြေရင် မလုံလောက်ပါဘူး။
      [[mark:iv-a]] ပထမ၊ direction ပါတဲ့ quote ကို id နဲ့ request မှာ တွဲ၊ idempotency key နဲ့ ယူရိုကို reserve လုပ်ပါ။
      [[mark:iv-b]] ဒုတိယ၊ ကြားထဲမှာ full precision နဲ့ တွက်ပြီး၊ သိမ်းမယ့် ပမာဏကို mode ရွေးပြီး တစ်ခါပဲ round
      လုပ်ပါ၊ spread ကို revenue account ထဲ explicit book လုပ်ပြီး rate ကို column အဖြစ် မသိမ်းပါနဲ့။ [[mark:iv-c]]
      တတိယ၊ currency တစ်ခုချင်းစီမှာ balance ဖြစ်ရပြီး၊ cashback ကို promo account ကနေ ပုံမှန် posting နဲ့ fund
      လုပ်ပြီး ကိုယ်ပိုင် rounding ဆုံးဖြတ်ချက် ပေးပါ။ [[mark:iv-d]] ပြီးရင် ကိုယ် ဘာ build လုပ်မလဲ ဆက်ပြောပါ။ asset ကို
      network နဲ့ contract နဲ့ ခွဲသိမယ်၊ posting နဲ့ outbox row ကို တစ်ခါတည်း commit လုပ်မယ်၊ currency အလိုက် ပေါင်းလဒ်
      သုည ဆိုတာကို invariant အဖြစ် နေ့တိုင်း စစ်မယ် ဆိုတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Flow 3: An in-app conversion with cashback (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#flow-3-an-in-app-conversion-with-cashback",
        }
    actions:
