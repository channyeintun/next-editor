schemaVersion: 1

lesson:
  slug: claude-fde-30-subagents
  title: "Claude FDE 30: Subagent များ"
  locale: my-MM
  workspace:
    lessonType: javascript
    name: FDE Notebook
    entryFilePath: billing-service/.claude/agents/test-runner.md
    sidebarStartsCollapsed: true
    files:
      README.md: |
        # နေခြည် Fiber · FDE မှတ်စု

        နေခြည် Fiber က ရန်ကုန်နဲ့ မန္တလေးမှာ fiber internet ဝန်ဆောင်မှု ပေးတဲ့ ကုမ္ပဏီပါ။
        ဒီ course အတွက် စိတ်ကူးနဲ့ တည်ဆောက်ထားတဲ့ ကုမ္ပဏီ ဖြစ်ပါတယ်။

        ## ကုမ္ပဏီ

        - customer 62,000 ခန့် (အိမ်နဲ့ ဆိုင်)
        - ဝန်ထမ်း 430: support agent 45၊ field technician 130၊ developer 24
        - developer team 4 ခု: Customer App, Billing, Network Tools, Internal Tools

        ## Support

        - တစ်ရက် ticket 1,800 ခန့်
        - connection 55 %၊ billing 25 %၊ တပ်ဆင်နဲ့ ရွှေ့ပြောင်း 12 %၊ အခြား 8 %
        - ပထမဆုံး ပြန်ဖြေချိန် ပျမ်းမျှ 38 မိနစ်၊ ticket တစ်ခုကို ဖြေရှင်းချိန် ပျမ်းမျှ 11 မိနစ်

        ## System များ

        - Ticket system: customer ရဲ့ တိုင်ကြားချက်တွေ
        - Billing: plan၊ invoice၊ ငွေပေးချေမှု (သက်တမ်း 9 နှစ်ရှိ codebase)
        - NMS: မြို့နယ်အလိုက် လိုင်းကျမှု အခြေအနေ
        - Knowledge base: ပြဿနာဖြေရှင်းနည်း article 340

        ## မုန်တိုင်းကျတဲ့ည

        - မြို့နယ် 3 ခုမှာ လိုင်းကျ၊ ticket က ပုံမှန်ရဲ့ 4 ဆ
        - chat AI နဲ့ ရေးထားတဲ့ အဖြေ 64 စောင်က လိုင်းကျနေတဲ့ customer တွေကို router ပြန်ဖွင့်ခိုင်းခဲ့တယ်

        ## FDE အလုပ် (12 ပတ်)

        - Reply assistant: support ticket အတွက် အဖြေ မူကြမ်း ရေးပေးတဲ့ agent
        - Billing team နဲ့ Claude Code
        - ကုမ္ပဏီ တစ်ခုလုံးအတွက် Claude
      billing-service/.claude/agents/test-runner.md: |+
        ---
        name: test-runner
        ---

      package.json: |
        {
          "name": "fde-notebook",
          "private": true,
          "version": "1.0.0",
          "scripts": {
            "dev": "echo concept lesson: nothing to run"
          }
        }
  slides:
    - id: agents-screen
      contentType: html
      name: Agents command
      content: |
        <style>
          .shot { position: relative; width: 100vw; height: 100vh; background: #0b0d12; }
          .shot img { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; object-fit: contain; }
        </style>
        <div class="shot"><img src="data:image/webp;base64," alt="Claude Code: the agents command says the wizard was removed and names the two agents folders"></div>
    - id: run-screen
      contentType: html
      name: Subagent run
      content: |
        <style>
          .shot { position: relative; width: 100vw; height: 100vh; background: #0b0d12; }
          .shot img { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; object-fit: contain; }
        </style>
        <div class="shot"><img src="data:image/webp;base64," alt="Claude Code: the test-runner subagent runs in the background and its permission request comes up in the main session"></div>
  whiteboardAssets:
    # Board 1 — the quiz: white question and options, green answer, orange rule.
    - {
        id: q-title,
        kind: text,
        x: 270,
        y: 170,
        width: 820,
        height: 45,
        text: "Subagent ဆီက ဘာ ပြန်ရောက်လာမလဲ?",
        fontSize: 36,
      }
    - {
        id: q-a,
        kind: text,
        x: 290,
        y: 270,
        width: 790,
        height: 35,
        text: "က) subagent ဖတ်ခဲ့တဲ့ output အားလုံး",
        fontSize: 28,
      }
    - {
        id: q-b,
        kind: text,
        x: 290,
        y: 345,
        width: 790,
        height: 35,
        text: "ခ) နောက်ဆုံး report တစ်ခုပဲ",
        fontSize: 28,
      }
    - {
        id: q-b-line,
        kind: freedraw,
        stroke: underline,
        x: 290,
        y: 350,
        width: 420,
        height: 42,
        strokeColor: "#2f9e44",
      }
    - {
        id: q-b-ok,
        kind: freedraw,
        stroke: check,
        x: 740,
        y: 338,
        width: 44,
        height: 44,
        strokeColor: "#2f9e44",
      }
    - {
        id: q-t1,
        kind: text,
        x: 290,
        y: 470,
        width: 760,
        height: 35,
        text: "အလုပ်က subagent ရဲ့ context ထဲမှာ",
        fontSize: 28,
        strokeColor: "#f08c00",
      }
    - {
        id: q-t2,
        kind: text,
        x: 290,
        y: 535,
        width: 760,
        height: 35,
        text: "main session ဆီ report ပဲ ပြန်လာ",
        fontSize: 28,
        strokeColor: "#f08c00",
      }
    # Board 2 — two context windows (dashed white): the main session and the test-runner subagent.
    # Blue our conversation, violet the task going in, red the noisy output that stays out, green the
    # one report that comes back; violet arrows are the two messages that cross.
