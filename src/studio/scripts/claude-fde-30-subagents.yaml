build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 9330

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: need
    chapter: Test output က session ကို ပြည့်စေတယ်
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ session တိုင်း အစမှာ Claude Code ဖတ်တဲ့ CLAUDE.md ထဲမှာ Claude ကိုယ်တိုင် မခန့်မှန်းနိုင်တာကိုပဲ
      တိုတိုနဲ့ ရေးဖို့ လေ့လာခဲ့ပါတယ်။ Billing ရဲ့ CLAUDE.md ထဲက အရေးအကြီးဆုံး စာကြောင်းက test command ပါ။
      [[mark:sel-billing]] ဒါပေမဲ့ အဲဒီ command ကို run တိုင်း ပြဿနာ အသစ် တစ်ခု ပေါ်လာပါတယ်။ Billing ရဲ့ test suite
      အပြည့်ကို run ရင် output စာကြောင်း ထောင်ချီ ထွက်ပါတယ်။ Claude Code ဆိုတာ terminal ထဲကနေ code ကို ဖတ်၊ ပြင်ပြီး
      command တွေ run ပေးတဲ့ coding agent ဖြစ်တာမို့၊ အဲဒီ output အားလုံးက session ရဲ့ context window ထဲ ဝင်လာပါတယ်။
      [[mark:story]] Billing team lead မောင်မောင် ရဲ့ team က တစ်ရက်ကို test suite ကို အကြိမ်ကြိမ် run ရပါတယ်။ ဆိုလိုတာက
      လိုချင်တာက fail နေတဲ့ test နှစ်ခု သုံးခုပဲ ဖြစ်ပေမဲ့၊ pass တဲ့ စာကြောင်း ထောင်ချီက context ထဲမှာ နေရာ ယူသွားတာပါ။
      [[mark:story-2]] ဒီလို အလုပ်မျိုးအတွက် Claude Code မှာ subagent ဆိုတာ ရှိပါတယ်။ subagent ဆိုတာ အလုပ် တစ်ပိုင်းကို
      သီးသန့် context နဲ့ လုပ်ပေးတဲ့ လက်ထောက် agent ပါ။ main session က အလုပ် တစ်ပိုင်းကို subagent ကို လွှဲပေးပြီး၊
      subagent က အဲဒီ အလုပ်ကို သီးခြား နေရာ တစ်ခုထဲမှာ လုပ်ပါတယ်။
    sources:
      - { title: "Claude Code Docs: Subagents", url: "https://code.claude.com/docs/en/sub-agents" }
    actions:
      - { id: open-readme, type: workspace.openFile, at: { mark: sel-billing }, path: README.md }
      - id: sel-billing
        type: editor.select
        at: { afterAction: open-readme }
        target:
          file: README.md
          text: "- Billing team နဲ့ Claude Code"
      - id: sel-team
        type: editor.select
        at: { mark: story }
        target:
          file: README.md
          text: "- developer team 4 ခု: Customer App, Billing, Network Tools, Internal Tools"

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] ဆက်မသွားခင် မေးခွန်း တစ်ခု မေးပါရစေ။ test suite ကို subagent တစ်ခုက run ပြီး ပြီးသွားပြီ ဆိုပါစို့။
      main session ဆီကို ဘာ ပြန်ရောက်လာမလဲ။
      [[mark:q-a]] ပထမ အဖြေက subagent ဖတ်ခဲ့တဲ့ file တွေနဲ့ test output အားလုံးပါ။
      [[mark:q-b]] ဒုတိယ အဖြေက subagent ရဲ့ နောက်ဆုံး report တစ်ခုပဲ ဖြစ်ပါတယ်။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ တစ်ခုပါ။ ဘာကြောင့်လဲဆိုတော့ subagent က သီးသန့် context window နဲ့
      အလုပ်လုပ်ပြီး၊ ပြီးသွားတဲ့အခါ အကျဉ်းချုပ် report တစ်ခုကိုပဲ main session ဆီ ပြန်ပို့လို့ပါ။ ထောင်ချီတဲ့ output
      စာကြောင်းတွေက subagent ရဲ့ context ထဲမှာပဲ ကျန်ခဲ့ပါတယ်။ ဒါကြောင့် report ထဲမှာ ဘာပါရမလဲ ဆိုတာကို ကိုယ်က
      သေချာ သတ်မှတ်ပေးရပါတယ်။
      [[mark:q-rule]] ဆိုလိုတာက subagent ရဲ့ အလုပ် အပြည့်အစုံက subagent ရဲ့ context ထဲမှာပဲ ရှိပြီး၊ main session ဆီ ပြန်လာတာက
      report တစ်ခုပါပဲ။
    sources:
      - { title: "Claude Code Docs: Subagents", url: "https://code.claude.com/docs/en/sub-agents" }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: q-rule },
          upsertIds: [q-t1, q-t2],
          drawMs: 1600,
        }

  - id: two-contexts
    chapter: Context နှစ်ခု
    narration: >
      [[mark:c-main]] ဒါကို context နှစ်ခုနဲ့ ဆွဲကြည့်ရအောင်။ ပထမ တစ်ခုက ကိုယ်နဲ့ Claude စကားပြောနေတဲ့ main session ပါ။
      [[mark:c-sub]] ဒုတိယ တစ်ခုက test-runner ဆိုတဲ့ subagent ရဲ့ context ပါ။ subagent က အလွတ်ကနေ စပါတယ်။ main session
      ထဲက စကားဝိုင်းကိုလည်း မမြင်၊ ဖတ်ထားတဲ့ file တွေကိုလည်း မမြင်ပါဘူး။
      [[mark:c-in]] subagent ရတာက subagent file ထဲမှာ ရေးထားတဲ့ ညွှန်ကြားချက်နဲ့ Claude က လွှဲပေးလိုက်တဲ့ task message ပါ။
      ဒီအပြင် project ရဲ့ CLAUDE.md နဲ့ git status ကိုလည်း ရပါတယ်။ subagent တစ်ခုစီမှာ သီးခြား ညွှန်ကြားချက်၊ tool တွေနဲ့
      model ကိုလည်း သတ်မှတ်ပေးလို့ ရပါတယ်။
      [[mark:c-noise]] test ကို run တော့ ထောင်ချီတဲ့ output က ဒီ context ထဲကိုပဲ ဝင်ပါတယ်။ main session ကို မထိပါဘူး။
      [[mark:c-out]] ပြီးသွားတဲ့အခါ fail နေတဲ့ test တွေကို ပြောပြတဲ့ report တစ်ခုပဲ main session ဆီ ပြန်ရောက်လာပါတယ်။
      [[mark:c-limit]] ဒါပေမဲ့ subagent က အရာအားလုံးအတွက် မဟုတ်ပါဘူး။ docs က လွှဲပေးရုံနဲ့ အဖြေ ပိုကောင်းလာမှာ မဟုတ်ဘူးလို့
      သတိပေးထားပါတယ်။ output များတဲ့ အလုပ်၊ အပြိုင် လုပ်လို့ရတဲ့ အလုပ်၊ သီးခြား review လုပ်ချင်တဲ့ အလုပ်မျိုးမှာ
      အသုံးဝင်ပါတယ်။ subagent ရဲ့ request တွေက main session နဲ့ usage limit တစ်ခုတည်းကို သုံးတာကိုလည်း သတိထားပါ။
    sources:
      - {
          title: "Claude Code Docs: Subagents (context isolation)",
          url: "https://code.claude.com/docs/en/sub-agents",
        }
      - {
          title: "Claude Code Docs: Best practices",
          url: "https://code.claude.com/docs/en/best-practices",
        }
    actions:
      - {
          id: draw-c-main,
          type: whiteboard.apply,
          at: { mark: c-main },
          clear: true,
          upsertIds: [m-rect, m-name, m-b1, m-l1],
          drawMs: 1600,
        }
      - {
          id: draw-c-sub,
          type: whiteboard.apply,
          at: { mark: c-sub },
          upsertIds: [s-rect, s-name],
          drawMs: 900,
        }
      - {
          id: draw-c-in,
          type: whiteboard.apply,
          at: { mark: c-in },
          upsertIds: [a-in, s-b1, s-l1],
          drawMs: 1200,
        }
      - {
          id: draw-c-noise,
          type: whiteboard.apply,
          at: { mark: c-noise },
          upsertIds: [s-b2, s-l2],
          drawMs: 900,
        }
      - {
          id: draw-c-out,
          type: whiteboard.apply,
          at: { mark: c-out },
          upsertIds: [a-out, m-b2, m-l2],
          drawMs: 1200,
        }
      - {
          id: point-c-limit,
          type: whiteboard.point,
          at: { mark: c-limit },
          target: { assetId: s-b2 },
        }

  - id: agents-command
    chapter: Subagent ကို ဘယ်မှာ ရေးလဲ
    narration: >
      [[mark:a-open]] subagent တစ်ခုကို ဘယ်လို ဖန်တီးမလဲ ဆိုတဲ့ နေရာမှာ မကြာသေးခင်က ပြောင်းလဲမှု တစ်ခု ရှိပါတယ်။ ဒီ screen
      မှာ agents command ကို run ထားတာကို ဒီလို မြင်ရပါတယ်။
      [[mark:a-removed]] အရင်က agents command က subagent ဖန်တီးဖို့ အဆင့်ဆင့် မေးတဲ့ wizard တစ်ခု ဖွင့်ပေးခဲ့ပါတယ်။ အခု
      အဲဒီ wizard ကို ဖယ်လိုက်ပြီလို့ ပြနေပါတယ်။ ဒါကြောင့် အဟောင်း tutorial တွေထဲက အဆင့်တွေကို လိုက်လုပ်ရင် မကိုက်တော့ပါဘူး။
      [[mark:a-ask]] အခု နည်းလမ်း နှစ်ခု ရှိပါတယ်။ ပထမ နည်းက Claude ကို subagent တစ်ခု ရေးပေးဖို့ တိုက်ရိုက် ခိုင်းတာပါ။
      [[mark:a-project]] ဒုတိယ နည်းက file ကို ကိုယ်တိုင် ရေးတာပါ။ project ရဲ့ agents folder ထဲမှာ ထားရင် team တစ်ခုလုံး git
      ကနေ မျှသုံးလို့ ရပါတယ်။
      [[mark:a-user]] ကိုယ့် home folder ထဲက agents folder မှာ ထားရင်တော့ ကိုယ့် project အားလုံးမှာ ကိုယ်တစ်ယောက်တည်း
      သုံးလို့ ရပါတယ်။ နာမည်တူ နှစ်ခု ရှိရင် project ထဲက တစ်ခုက ဦးစားပေး ရပါတယ်။ Claude Code က ဒီ folder တွေကို
      စောင့်ကြည့်နေတာမို့ file ကို ပြင်ရင် စက္ကန့်ပိုင်းအတွင်း သက်ရောက်ပါတယ်။ agents folder ကို အသစ် ဖန်တီးလိုက်တာ ဆိုရင်တော့
      Claude Code ကို ပြန်စဖို့ လိုပါတယ်။
    sources:
      - {
          title: "Claude Code Docs: Commands (agents)",
          url: "https://code.claude.com/docs/en/commands",
        }
      - {
          title: "Claude Code Docs: Subagents (where the files live)",
          url: "https://code.claude.com/docs/en/sub-agents",
        }
    actions:
      - {
          id: close-contexts,
          type: whiteboard.apply,
          at: { mark: a-open, offsetMs: -1400 },
          open: false,
        }
      - {
          id: show-agents,
          type: slide.show,
          at: { mark: a-open, offsetMs: -700 },
          slideId: agents-screen,
        }
      - {
          id: point-a-cmd,
          type: slide.point,
          at: { mark: a-open, offsetMs: 3500 },
          target: { x: 0.081, y: 0.376 },
        }
      - {
          id: point-a-removed,
          type: slide.point,
          at: { mark: a-removed },
          target: { x: 0.133, y: 0.412 },
        }
      - { id: point-a-ask, type: slide.point, at: { mark: a-ask }, target: { x: 0.106, y: 0.482 } }
      - {
          id: point-a-project,
          type: slide.point,
          at: { mark: a-project },
          target: { x: 0.171, y: 0.588 },
        }
      - {
          id: point-a-user,
          type: slide.point,
          at: { mark: a-user },
          target: { x: 0.171, y: 0.624 },
        }

  - id: frontmatter
    chapter: test-runner ကို ရေးခြင်း
    narration: >
      [[mark:f-open]] ဒါဆို Billing ရဲ့ test-runner ကို ကိုယ်တိုင် ရေးကြည့်ရအောင်။ subagent file က markdown file ပါ။ ထိပ်ဆုံးမှာ
      dash သုံးခုကြားက YAML frontmatter ပါပြီး၊ အောက်က စာကိုယ်က subagent ရဲ့ system prompt ဖြစ်လာပါတယ်။ system prompt
      ဆိုတာ စကားမပြောခင် model ကို ကြိုပေးထားတဲ့ တာဝန်နဲ့ စည်းကမ်းပါ။
      [[mark:type-desc]] မဖြစ်မနေ လိုတဲ့ field က name နဲ့ description နှစ်ခုပဲ ရှိပါတယ်။ name ကို ရေးပြီးသားပါ။ description
      က အရေးကြီးပါတယ်။ Claude က ဘယ်အချိန် ဒီ subagent ကို သုံးမလဲ ဆိုတာကို ကိုယ့် request၊ ဒီ description နဲ့ လက်ရှိ
      context ကို ကြည့်ပြီး ဆုံးဖြတ်လို့ပါ။ use proactively ဆိုတဲ့ စကားကို ထည့်ထားရင် Claude က ပိုပြီး လွှဲပေးတတ်ပါတယ်။
      [[mark:type-tools]] tools field က ဒီ subagent သုံးလို့ရတဲ့ tool တွေကို ကန့်သတ်ပါတယ်။ test run ဖို့ Bash နဲ့ error
      ပေါ်တဲ့ file ကို ဖတ်ဖို့ Read ပဲ ပေးထားပါတယ်။ Edit နဲ့ Write ကို မပေးထားတော့ file ပြင်တဲ့ tool မပါပါဘူး။
      [[mark:sel-model]] model field မှာတော့ Haiku ကို ရွေးထားပါတယ်။ test run ပြီး ရလဒ် ချုပ်တာလို ရိုးရှင်းတဲ့ အလုပ်မျိုးမှာ
      အမြန်ဆုံးနဲ့ ဈေးအသက်သာဆုံး model family က လုံလောက်ပါတယ်။ field နာမည်တွေကို စာလုံး အတိအကျ ရေးဖို့ သတိထားပါ။
      Claude Code က မသိတဲ့ field ကို error မပြဘဲ ကျော်သွားလို့ပါ။
    sources:
      - {
          title: "Claude Code Docs: Subagents (file format, frontmatter)",
          url: "https://code.claude.com/docs/en/sub-agents",
        }
      - {
          title: "Claude Docs: Models overview",
          url: "https://platform.claude.com/docs/en/about-claude/models/overview",
        }
    actions:
      - { id: close-agents, type: slide.close, at: { mark: f-open, offsetMs: -900 } }
      - {
          id: open-agent,
          type: workspace.openFile,
          at: { afterAction: close-agents },
          path: billing-service/.claude/agents/test-runner.md,
        }
      - id: type-desc
        type: editor.type
        at: { mark: type-desc }
        cadence: line-by-line
        target:
          { file: billing-service/.claude/agents/test-runner.md, after: "name: test-runner\n" }
        text: "description: Runs npm test and reports only the failing tests. Use proactively after edits.\n"
      - id: type-tools
        type: editor.type
        at: { mark: type-tools }
        cadence: line-by-line
        target:
          {
            file: billing-service/.claude/agents/test-runner.md,
            after: "Use proactively after edits.\n",
          }
        text: "tools: Bash, Read\nmodel: haiku\n"
      - id: sel-model
        type: editor.select
        at: { mark: sel-model }
        target:
          file: billing-service/.claude/agents/test-runner.md
          text: "model: haiku"

  - id: body
    narration: >
      [[mark:type-body]] အခု frontmatter အောက်မှာ system prompt ကို ရေးပါမယ်။ ပထမ စာကြောင်းက ဘာ run ရမလဲနဲ့ ဘာကို မလုပ်ရဘူးလဲ
      ပြောပါတယ်။ Bash ကတော့ file ကို ပြောင်းနိုင်တဲ့ command တွေကိုလည်း run နိုင်တာမို့၊ မပြင်ရဘူး ဆိုတာကို
      စကားနဲ့လည်း ရှင်းရှင်း ပြောထားပါတယ်။
      [[mark:type-report]] ဒီ file ရဲ့ အရေးအကြီးဆုံး အပိုင်းက report ရဲ့ ပုံစံပါ။ မေးခွန်းမှာ တွေ့ခဲ့သလို main session ဆီ
      ပြန်ရောက်တာ ဒီ report ပဲ ဖြစ်လို့ပါ။ pass နဲ့ fail အရေအတွက်၊ fail တစ်ခုစီရဲ့ test နာမည်၊ file နဲ့ line၊ မအောင်မြင်တဲ့
      assertion ကို တောင်းထားပြီး၊ တစ်ခုစီကို စာကြောင်း အနည်းငယ်အတွင်း ကန့်သတ်ထားပါတယ်။
      [[mark:sel-pass]] အားလုံး pass ရင်တော့ စာကြောင်း တစ်ကြောင်းတည်းနဲ့ ဖြေဖို့ ပြောထားပါတယ်။ အများဆုံး ဖြစ်တတ်တဲ့
      အခြေအနေမှာ main session ထဲ ဝင်တာက စာကြောင်း တစ်ကြောင်းပဲ ဖြစ်သွားပါတယ်။
    sources:
      - {
          title: "Claude Code Docs: Subagents (file format)",
          url: "https://code.claude.com/docs/en/sub-agents",
        }
    actions:
      - id: type-body
        type: editor.type
        at: { mark: type-body }
        cadence: line-by-line
        target:
          { file: billing-service/.claude/agents/test-runner.md, after: "model: haiku\n---\n\n" }
        text: "You run `npm test` in the Naychi Fiber billing repository. Never edit any file.\n"
      - id: type-report
        type: editor.type
        at: { mark: type-report }
        cadence: line-by-line
        target:
          { file: billing-service/.claude/agents/test-runner.md, after: "Never edit any file.\n" }
        text: "\nReport the number of passing and failing tests. For each failure give:\n- the test name, the file and line, and the assertion that failed (at most 5 lines)\n\nIf every test passes, answer in one line.\n"
      - id: expect-report
        type: expect.file
        at: { afterAction: type-report }
        path: billing-service/.claude/agents/test-runner.md
        contains: "- the test name, the file and line, and the assertion that failed (at most 5 lines)\n"
      - id: sel-pass
        type: editor.select
        at: { mark: sel-pass }
        target:
          file: billing-service/.claude/agents/test-runner.md
          text: "If every test passes, answer in one line."

  - id: the-run
    chapter: Subagent အလုပ်လုပ်ပုံ
    narration: >
      [[mark:r-open]] ဒီ subagent ကို ဘယ်လို ခေါ်သုံးလဲ ကြည့်ရအောင်။ Claude က description ကို ကြည့်ပြီး ကိုယ်တိုင် လွှဲပေးနိုင်သလို၊
      ကိုယ်က prompt ထဲမှာ နာမည်နဲ့ ခိုင်းလို့လည်း ရပါတယ်။ ဒီ screen မှာ test-runner agent ကို သုံးပြီး test run ခိုင်းထားတာကို
      ဒီလို မြင်ရပါတယ်။
      [[mark:r-deleg]] Claude က အလုပ်ကို test-runner ဆီ လွှဲပေးလိုက်ပါတယ်။
      [[mark:r-bg]] subagent က background မှာ အလုပ်လုပ်တာကို ပြနေပါတယ်။ main session က လွှဲလိုက်တဲ့ subagent တွေဟာ
      အခုဆိုရင် background မှာ စတာ ပုံမှန်ပါပဲ။
      [[mark:r-from]] စိတ်ဝင်စားစရာက အောက်က ခွင့်ပြုချက် တောင်းတာပါ။ npm test ကို run ချင်တာက subagent ဖြစ်ပေမဲ့၊ ခွင့်ပြုချက်
      တောင်းတာက main session ထဲမှာ ပေါ်လာပါတယ်။ test-runner agent ဆီက ဖြစ်ကြောင်းလည်း ပြထားပါတယ်။
      [[mark:r-rule]] ဒီ ဥပမာ screen ရဲ့ project မှာ npm test ကို အမြဲ မေးဖို့ ask rule ထားထားလို့ မေးနေတာပါ။ ဆိုလိုတာက subagent တစ်ခုက ကိုယ့် permission
      rule တွေကို ကျော်ပြီး လုပ်လို့ မရပါဘူး။
    sources:
      - {
          title: "Claude Code Docs: Subagents (invoking, background)",
          url: "https://code.claude.com/docs/en/sub-agents",
        }
    actions:
      - {
          id: show-run,
          type: slide.show,
          at: { mark: r-open, offsetMs: -1200 },
          slideId: run-screen,
        }
      - {
          id: point-r-prompt,
          type: slide.point,
          at: { mark: r-open, offsetMs: 7000 },
          target: { x: 0.134, y: 0.198 },
        }
      - {
          id: point-r-deleg,
          type: slide.point,
          at: { mark: r-deleg },
          target: { x: 0.163, y: 0.319 },
        }
      - { id: point-r-bg, type: slide.point, at: { mark: r-bg }, target: { x: 0.158, y: 0.349 } }
      - {
          id: point-r-from,
          type: slide.point,
          at: { mark: r-from, offsetMs: 2500 },
          target: { x: 0.275, y: 0.591 },
        }
      - {
          id: point-r-rule,
          type: slide.point,
          at: { mark: r-rule },
          target: { x: 0.155, y: 0.741 },
        }

  - id: your-turn
    chapter: ကိုယ့် project အတွက်
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ကိုယ့် project ထဲက output များပြီး ဆူညံတဲ့ အလုပ် တစ်ခုကို
      ရွေးပါ။ test suite၊ build log၊ log file ရှည်ရှည် ရှာဖွေတာ ဆိုရင် ဖြစ်ပါတယ်။
      [[mark:turn-2]] ပြီးရင် အဲဒီ အလုပ်အတွက် subagent ရဲ့ name နဲ့ description ကို ဒီ file လို ရေးကြည့်ပါ။ နောက်ပြီး main
      session ဆီ ပြန်လာရမယ့် report မှာ ဘာ ပါရမလဲ ဆိုတာကို စာကြောင်း နှစ်ကြောင်းနဲ့ ရေးပါ။
    sources:
      - { title: "Claude Code Docs: Subagents", url: "https://code.claude.com/docs/en/sub-agents" }
    actions:
      - { id: close-run, type: slide.close, at: { mark: turn } }
      - id: sel-desc
        type: editor.select
        at: { mark: turn-2 }
        target:
          file: billing-service/.claude/agents/test-runner.md
          text: "description: Runs npm test and reports only the failing tests. Use proactively after edits."

  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ test output ထောင်ချီက main session ကို ပြည့်စေတဲ့ ပြဿနာကို subagent နဲ့ ဖြေရှင်းပါတယ်။
      subagent က သီးသန့် context ထဲမှာ အလုပ်လုပ်ပြီး report တစ်ခုပဲ ပြန်ပို့ပါတယ်။
      [[mark:recap-2]] file က project ရဲ့ agents folder ထဲမှာ frontmatter နဲ့ system prompt ပါတဲ့ markdown file ပါ။
      description က Claude ဘယ်အချိန် သုံးမလဲ ဆုံးဖြတ်ပေးပြီး၊ report ပုံစံက main session ဆီ ဘာရောက်မလဲ ဆုံးဖြတ်ပေးပါတယ်။
      [[mark:next]] နောက် lesson မှာတော့ CLAUDE.md ထဲမှာ ရေးထားတာကို တစ်ခါတလေ မလုပ်ဘဲ ကျန်ခဲ့တဲ့ ပြဿနာအတွက်၊ Claude Code
      ကိုယ်တိုင် အမြဲ run ပေးတဲ့ hook တွေကို လေ့လာသွားပါမယ်။
    sources:
      - { title: "Claude Code Docs: Subagents", url: "https://code.claude.com/docs/en/sub-agents" }
    actions:
      - id: sel-report
        type: editor.select
        at: { mark: recap }
        target:
          file: billing-service/.claude/agents/test-runner.md
          text: "Report the number of passing and failing tests."
      - id: sel-name
        type: editor.select
        at: { mark: recap-2 }
        target:
          file: billing-service/.claude/agents/test-runner.md
          text: "name: test-runner"

checks:
  - { type: timing.p95Ms, max: 300 }
