build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 5106
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "Generative AI ဆိုတာ ဘာလဲ"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ member တစ်ယောက်ချင်းစီ ဆိုင် ဆက်မလာတော့နိုင်တဲ့ ဖြစ်နိုင်ခြေကို model က
      ရာခိုင်နှုန်းနဲ့ ခန့်မှန်းပေးတာ မြင်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ အဲဒီလို ခန့်မှန်းတဲ့ အလုပ်ကိုပဲ အများကြီး
      ပိုကြီးတဲ့ အတိုင်းအတာနဲ့ လုပ်ပြီး၊ စာအသစ်တွေ ရေးပေးတဲ့ generative AI ကို လေ့လာပါမယ်။ [[mark:draw-mini]]
      blueprint မှာ ကြည့်ရင်၊ ဒီနေ့ အဓိက ကြည့်မှာက Solution ထဲက intelligence အလွှာပါ။ [[mark:draw-today]] model က
      စာကို ဘယ်လို ခွဲဖတ်ပြီး နောက် စကားလုံးကို ဘယ်လို ရွေးလဲ ဆိုတာ model သေးသေးလေး တစ်ခုနဲ့ ကြည့်ပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Generative AI: Create new content",
          url: "https://web.dev/learn/ai/generative",
        }
      - {
          title: "web.dev Learn AI: Introduction to AI on the web (the blueprint)",
          url: "https://web.dev/learn/ai/introduction",
        }
      - {
          title: "web.dev Learn AI: Welcome to Learn AI! (course credit: written by Dr. Janna Lipenkova with editorial guidance from Alexandra Klepper; text CC BY 4.0, code Apache 2.0; adapted into Burmese with the course's own tea-shop examples)",
          url: "https://web.dev/learn/ai/welcome",
        }
      - {
          title: "Creative Commons: Attribution 4.0 International (CC BY 4.0), the licence of the web.dev Learn AI text adapted here",
          url: "https://creativecommons.org/licenses/by/4.0/",
        }
    actions:
      - {
          id: open-board-a,
          type: whiteboard.apply,
          at: { scene: start, offsetMs: -450 },
          open: true,
          clear: true,
          upsertIds: [a-title],
        }
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - {
          id: draw-mini,
          type: whiteboard.apply,
          at: { mark: draw-mini },
          upsertIds:
            [
              a-opp,
              a-opp-t,
              a-arrow-1,
              a-data,
              a-data-t,
              a-intel,
              a-intel-t,
              a-ux,
              a-ux-t,
              a-arrow-2,
              a-gov,
              a-gov-t,
            ],
          drawMs: 2400,
        }
      - {
          id: draw-today,
          type: whiteboard.apply,
          at: { mark: draw-today },
          upsertIds: [a-today],
          drawMs: 1000,
        }

  - id: generative
    narration: >
      [[mark:draw-gen]] generative AI ဆိုတာ သင်ယူထားတဲ့ pattern တွေကနေ စာ၊ ပုံ၊ code လို အသစ်တွေ ဖန်တီးပေးတဲ့
      AI ပါ။ predictive AI က ရှိပြီးသား data ကနေ နောက် ဖြစ်လာမယ့်အရာကို ခန့်မှန်းပေမယ့်၊ generative AI ကတော့
      မရှိသေးတဲ့ အရာ တစ်ခုကို ထုတ်ပေးတာပါ။ [[mark:draw-write]] ဥပမာ ဝန်ထမ်းတွေအတွက် menu ဖော်ပြချက် မူကြမ်း
      ရေးပေးတာ၊ ရေးပြီးသား စာကို ပိုသပ်ရပ်အောင် ပြင်ပေးတာ၊ [[mark:draw-sum]] customer review ရှည်ရှည်တွေကို
      အတိုချုပ်ပေးတာ၊ [[mark:draw-code]] developer တွေအတွက် code ရေးပေးတာ၊ [[mark:draw-image]] ဆိုင်ရဲ့ page
      အတွက် banner ပုံ ဖန်တီးပေးတာ စတာတွေ ရှိပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Generative AI: Create new content",
          url: "https://web.dev/learn/ai/generative",
        }
      - {
          title: "web.dev Learn AI: Glossary and concepts (generative AI)",
          url: "https://web.dev/learn/ai/glossary",
        }
    actions:
      - {
          id: draw-gen,
          type: whiteboard.apply,
          at: { mark: draw-gen },
          clear: true,
          upsertIds: [g-title, g-vs],
        }
      - {
          id: draw-write,
          type: whiteboard.apply,
          at: { mark: draw-write },
          upsertIds: [g-write, g-write-t, g-write-e],
          drawMs: 1300,
        }
      - {
          id: draw-sum,
          type: whiteboard.apply,
          at: { mark: draw-sum },
          upsertIds: [g-sum, g-sum-t, g-sum-e],
          drawMs: 1100,
        }
      - {
          id: draw-code,
          type: whiteboard.apply,
          at: { mark: draw-code },
          upsertIds: [g-code, g-code-t, g-code-e],
          drawMs: 1000,
        }
      - {
          id: draw-image,
          type: whiteboard.apply,
          at: { mark: draw-image },
          upsertIds: [g-image, g-image-t, g-image-e],
          drawMs: 1100,
        }

  - id: scale
    chapter: "Predictive နဲ့ ဘာကွာလဲ"
    narration: >
      [[mark:draw-next]] ဒီလို model အများစုကို neural network နဲ့ transformer လို့ ခေါ်တဲ့ ပုံစံတွေနဲ့ ဆောက်ထားပါတယ်။
      သူတို့ train လုပ်ရင်း သင်ယူတာက ရှေ့က အပိုင်းတွေကို ကြည့်ပြီး နောက် အပိုင်း တစ်ခုကို ခန့်မှန်းတာပါ။ စာမှာဆိုရင်
      အဲဒီ အပိုင်းလေးတွေကို token လို့ ခေါ်ပါတယ်။ token ဆိုတာ model က စာသားကို ဖတ်တဲ့အခါ ခွဲဖတ်တဲ့ အပိုင်းလေးတွေ
      ဖြစ်ပြီး၊ စကားလုံး တစ်လုံး ဖြစ်ချင်မှ ဖြစ်ပါတယ်။ [[mark:draw-pred]] သင်္ချာအရ ကြည့်ရင် predictive AI နဲ့ သိပ်
      မကွာပါဘူး။ member model က ဆက်လာမယ်၊ မလာတော့ဘူး ဆိုတဲ့ label နှစ်ခုထဲက တစ်ခုကို ရွေးပါတယ်။ [[mark:draw-fan]]
      language model ကတော့ လက်ဖက်ရည် နောက်မှာ ချိုဆိမ့် လာမလား၊ ပေါ့ဆိမ့် လာမလား ဆိုတာကို token တစ်ခုချင်းရဲ့
      ဖြစ်နိုင်ခြေနဲ့ ရွေးပါတယ်။ board ပေါ်က ဖြစ်နိုင်ခြေတွေကတော့ ခဏနေ train လုပ်မယ့် model သေးသေးလေးဆီက
      ယူထားတာပါ။ [[mark:draw-scale]] ကွာတာက အတိုင်းအတာပါ။ ဒီ course ရဲ့ ကြိုမှတ်ထားတဲ့ အဖြေတွေကို ထုတ်ပေးခဲ့တဲ့
      Gemma model ဆိုရင် ရွေးစရာ token နှစ်သိန်း ခြောက်သောင်းကျော် ရှိပါတယ်။ ဒီလို model တွေကို စာ နမူနာ
      သန်းထောင်ချီနဲ့ train လုပ်ထားလို့၊ မမြင်ဖူးတဲ့ စာအသစ်တွေကိုတောင် ရေးနိုင်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Generative AI: Create new content (the generative AI loop)",
          url: "https://web.dev/learn/ai/generative",
        }
      - {
          title: "Machine Learning Glossary: token",
          url: "https://developers.google.com/machine-learning/glossary#token",
        }
      - {
          title: "Gemma 4 E2B GGUF (tokenizer vocabulary: 262,144 tokens, read from the file's metadata)",
          url: "https://huggingface.co/unsloth/gemma-4-E2B-it-GGUF",
        }
    actions:
      - {
          id: draw-next,
          type: whiteboard.apply,
          at: { mark: draw-next },
          clear: true,
          upsertIds: [c-title],
        }
      - {
          id: draw-pred,
          type: whiteboard.apply,
          at: { mark: draw-pred },
          upsertIds: [c-pred-t, c-yes, c-yes-t, c-no, c-no-t, c-pred-n],
          drawMs: 1800,
        }
      - {
          id: draw-fan,
          type: whiteboard.apply,
          at: { mark: draw-fan },
          upsertIds: [c-gen-t, c-start, c-arrow, c-w1, c-w2, c-w3, c-w4],
          drawMs: 2400,
        }
      - {
          id: draw-scale,
          type: whiteboard.apply,
          at: { mark: draw-scale },
          upsertIds: [c-scale, c-data],
          drawMs: 1500,
        }

  - id: tokens
    chapter: "Token ဆိုတာ ဘာလဲ"
    narration: >
      [[mark:close-scale]] ဒီ token တွေကို panel မှာ တကယ် ကြည့်ရအောင်။ [[mark:panel-ready]] ညာဘက် AI panel ရဲ့ ပထမ
      card က ဆိုင်ရဲ့ စကားစု တစ်ခုကို token တွေ ခွဲထားတာပါ။ [[mark:sel-split]] ဒီ lesson ရဲ့ model သေးသေးလေးက
      စာကို space နေရာတိုင်းမှာ ခွဲပြီး၊ စကားလုံး တစ်လုံးကို token တစ်ခုအဖြစ် ယူပါတယ်။ ဒါကြောင့် လက်ဖက်ရည်၊ ချိုဆိမ့်၊
      ပူပူလေး ဆိုပြီး token သုံးခု ရပါတယ်။ စာ ခွဲတာ သက်သက်မို့ card ရဲ့ badge ကလည်း AI မပါဘူးလို့ ပြနေပါတယ်။
      [[mark:read-counts]] တကယ့် model တွေကတော့ စာသားကို token တွေ ခွဲပေးတဲ့ tokenizer နဲ့ ခွဲပါတယ်။ အောက်က card ရဲ့
      ဂဏန်းက Gemma ရဲ့ tokenizer ရေတွက်ခဲ့တာပါ။ model ရဲ့ အဖြေတွေကို ကြိုပြီး မှတ်ထားတုန်းက တစ်ခါတည်း ထွက်လာခဲ့လို့
      badge ကလည်း ကြိုမှတ်ထားတာလို့ ပြနေပါတယ်။ [[mark:sel-burmese]] မနက်ဖြန် မနက်အတွက် လက်ဖက်ရည် နှစ်ခွက် ကြိုမှာချင်တယ်
      ဆိုတဲ့ customer စာက token ၃၂ ခု ရှိပါတယ်။ [[mark:type-english]] အဓိပ္ပာယ် တူတဲ့ English စာကိုလည်း စာရင်းထဲ
      ထည့်ကြည့်ရအောင်။ [[mark:read-english]] English စာကတော့ token ၂၄ ခုပဲ ရှိပါတယ်။ ဂဏန်း နှစ်ခုလုံးမှာ model ဆီ ပို့တဲ့အခါ စာရဲ့
      အရှေ့နောက်မှာ ထည့်ရတဲ့ token တွေ အတူတူ ပါလို့၊ ကွာတဲ့ ရှစ်ခုက စာ ကိုယ်တိုင်ကြောင့်ပါ။ [[mark:why-tokens]] ဒါက
      အရေးကြီးပါတယ်။ server ပေါ်က model API အများစုက token အရေအတွက်ပေါ် မူတည်ပြီး ငွေ
      တောင်းပြီး၊ token များလေ အဖြေ ရဖို့ ကြာလေ
      ဖြစ်လို့ပါ။ model တစ်ခါ ဖတ်နိုင်တဲ့ token အရေအတွက်ကိုလည်း ကန့်သတ်ထားလို့၊ မြန်မာလို သုံးမယ့် feature တွေမှာ ဒါကို
      ကြိုတွက်ထားရပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Generative AI: Create new content",
          url: "https://web.dev/learn/ai/generative",
        }
      - {
          title: "Gemini API: Understand and count tokens (cost and limits per token)",
          url: "https://aistudio.google.com/docs/tokens",
        }
    actions:
      - { id: close-scale, type: whiteboard.apply, at: { mark: close-scale }, open: false }
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-done
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: ai-status }
        attribute: { name: data-state, value: "done" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-two-cards
        type: expect.preview
        at: { afterAction: expect-done }
        timeoutMs: 5000
        target: { by: testId, value: ai-cards }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - {
          id: open-main,
          type: workspace.openFile,
          at: { afterAction: expect-two-cards },
          path: src/main.js,
        }
      - id: sel-split
        type: editor.select
        at: { mark: sel-split }
        target: { file: src/main.js, text: 'showSplit("လက်ဖက်ရည် ချိုဆိမ့် ပူပူလေး");', occurrence: 1 }
      - id: expect-split
        type: expect.preview
        at: { afterAction: sel-split }
        timeoutMs: 5000
        target: { by: testId, value: ai-split }
        attribute: { name: data-label, value: "Toy model tokens: 3" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-counts-1
        type: expect.preview
        at: { mark: read-counts }
        timeoutMs: 5000
        target: { by: testId, value: ai-counts }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: sel-burmese
        type: editor.select
        at: { mark: sel-burmese }
        target:
          { file: src/main.js, text: '"မနက်ဖြန် မနက်အတွက် လက်ဖက်ရည် နှစ်ခွက် ကြိုမှာချင်ပါတယ်။"', occurrence: 1 }
      - id: expect-burmese-32
        type: expect.preview
        at: { afterAction: sel-burmese }
        timeoutMs: 5000
        target: { by: testId, value: ai-counts-1 }
        textContains: "မြန်မာ32"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-english
        type: editor.type
        at: { mark: type-english }
        target:
          {
            file: src/main.js,
            after: "  [\"မြန်မာ\", \"မနက်ဖြန် မနက်အတွက် လက်ဖက်ရည် နှစ်ခွက် ကြိုမှာချင်ပါတယ်။\"],\n",
            occurrence: 1,
          }
        text: "  [\"English\", \"I'd like to pre-order two milk teas for tomorrow morning.\"],\n"
        cadence: line-by-line
      - id: expect-counts-2
        type: expect.preview
        at: { afterAction: type-english }
        timeoutMs: 8000
        target: { by: testId, value: ai-counts }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-english-24
        type: expect.preview
        at: { afterAction: expect-counts-2 }
        timeoutMs: 5000
        target: { by: testId, value: ai-counts-2 }
        textContains: "English24"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-counts-badge
        type: expect.preview
        at: { mark: read-english }
        timeoutMs: 5000
        target: { by: testId, value: ai-counts-badge }
        textContains: "recorded · Gemma 4 E2B tokenizer"
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: toy
    chapter: "Model သေးသေးလေး train လုပ်ရအောင်"
    narration: >
      [[mark:type-train]] အခု ဆိုင်ရဲ့ စကားစုတွေနဲ့ နောက် token ကို ခန့်မှန်းတဲ့ model တစ်ခု train လုပ်ပါမယ်။ ဒီ
      lesson အတွက် ရေးထားတဲ့ model သေးသေးလေး ဖြစ်ပြီး၊ ဒီ page ထဲမှာပဲ train လုပ်တာပါ။ [[mark:read-toy]] Toy model
      card မှာ lesson အတွက် ရေးထားတဲ့ နမူနာ စကားစု ၈၀ ထဲမှာ မတူတဲ့ token ၅၁ ခု ရှိပြီး၊ ဘယ် token နောက်မှာ ဘယ် token
      လာလဲ ဆိုတဲ့ အတွဲ ၁၆၆ မျိုး တွေ့တယ်လို့ ပြနေပါတယ်။ ဒီ model က အဲဒီ အတွဲတွေကို ရေတွက်ထားရုံပါပဲ။ token ၅၁ ခုနဲ့
      နှစ်သိန်းကျော်၊ စကားစု ၈၀ နဲ့ သန်းထောင်ချီ ဆိုတော့ အတိုင်းအတာ ဘယ်လောက် ကွာလဲ မြင်နိုင်ပါတယ်။ [[mark:type-next]] ဒါဆို လက်ဖက်ရည် နောက်မှာ ဘာလာနိုင်လဲ
      ကြည့်ရအောင်။ [[mark:read-next]] Next word card မှာ ဖြစ်နိုင်ခြေ အများဆုံးက
      ချိုဆိမ့် ဖြစ်ပြီး ၂၈ ရာခိုင်နှုန်းလောက် ရှိပါတယ်။ ပေါ့ဆိမ့် က ၁၇ ရာခိုင်နှုန်းလောက် ရှိပြီး၊ ကျန်တဲ့ ငါးခုက ၁၁
      ရာခိုင်နှုန်းစီ ပါ။ စကားစုတွေထဲမှာ လက်ဖက်ရည် နောက်က ချိုဆိမ့် အများဆုံး လိုက်လာလို့ပါ။
    sources:
      - {
          title: "web.dev Learn AI: Generative AI: Create new content (the generative AI loop)",
          url: "https://web.dev/learn/ai/generative",
        }
    actions:
      - id: type-train
        type: editor.type
        at: { mark: type-train }
        target:
          {
            file: src/main.js,
            after: "// A toy next-word model, trained here in the page on the shop's phrases:\n",
            occurrence: 1,
          }
        text: "const model = trainBigram(data.phrases);\nshowModel(model);\n"
        cadence: line-by-line
      - id: expect-three-cards
        type: expect.preview
        at: { afterAction: type-train }
        timeoutMs: 8000
        target: { by: testId, value: ai-cards }
        attribute: { name: data-count, value: "3" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-phrases
        type: expect.preview
        at: { afterAction: expect-three-cards }
        timeoutMs: 5000
        target: { by: testId, value: ai-toy-1 }
        attribute: { name: data-value, value: "80" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-vocab
        type: expect.preview
        at: { afterAction: expect-phrases }
