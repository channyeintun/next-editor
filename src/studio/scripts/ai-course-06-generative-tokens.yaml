        // A toy next-word model, trained here in the page on the shop's phrases:

        // Tokens: the toy model splits a text at its spaces, one word per token.
        showSplit("လက်ဖက်ရည် ချိုဆိမ့် ပူပူလေး");

        // One customer message in two languages, counted by a real model's own tokenizer.
        const messages = [
          ["မြန်မာ", "မနက်ဖြန် မနက်အတွက် လက်ဖက်ရည် နှစ်ခွက် ကြိုမှာချင်ပါတယ်။"],
