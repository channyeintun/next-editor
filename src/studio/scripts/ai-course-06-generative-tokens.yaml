  - id: loop
    chapter: "Generative AI loop"
    narration: >
      [[mark:draw-loop]] ဒီ model သေးသေးလေးက generative AI ရဲ့ အဆင့် တစ်ဆင့်ကိုပဲ ပြတာပါ။ တကယ့် generative feature
      တစ်ခုကို predictive AI လိုပဲ loop နဲ့ ဆောက်ပါတယ်။ use case ကို သတ်မှတ်၊ base model ကို ရွေး၊ prompt နဲ့ context
      ကို ပြင်ဆင်ပြီး၊ model ကို run တဲ့ inference နဲ့ အဖြေကို စစ်ပြင်တဲ့ post processing ကို လုပ်ပါတယ်။ ပြီးရင်
      evaluation လုပ်ပြီး user တွေရဲ့ feedback နဲ့ ပြန်ပတ်ပါတယ်။ [[mark:draw-loop-today]] ဒီနေ့ နှိပ်ကြည့်ခဲ့တဲ့
      temperature နဲ့ max tokens က inference အဆင့်မှာ ညှိရတဲ့ setting တွေပါ။ [[mark:draw-loop-next]] ကျန်တဲ့
      အဆင့်တွေကိုတော့ နောက် lesson မှာ ဆိုင်ရဲ့ feature တစ်ခုနဲ့ တစ်ဆင့်ချင်း ဆောက်ကြည့်ပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Generative AI: Create new content (the generative AI loop)",
          url: "https://web.dev/learn/ai/generative",
        }
    actions:
      - {
          id: draw-loop,
          type: whiteboard.apply,
          at: { mark: draw-loop },
          open: true,
          clear: true,
          upsertIds:
            [
              l-title,
              l-define,
              l-define-t,
              l-a1,
              l-base,
              l-base-t,
              l-a2,
              l-prompt,
              l-prompt-t,
              l-a3,
              l-infer,
              l-infer-t,
              l-a4,
              l-eval,
              l-eval-t,
              l-back,
            ],
          drawMs: 4500,
        }
      - {
          id: draw-loop-today,
          type: whiteboard.apply,
          at: { mark: draw-loop-today },
          upsertIds: [l-today, l-today-2, l-today-3],
          drawMs: 1000,
        }
      - {
          id: draw-loop-next,
          type: whiteboard.apply,
          at: { mark: draw-loop-next },
          upsertIds: [l-next],
          drawMs: 900,
        }

  - id: quiz
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ member တွေကို သတိပေးတဲ့ model နဲ့ စာ ဆက်ရေးတဲ့ language model ရဲ့ output
      က အဓိက ဘာကွာလဲ။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] အဖြေကတော့ language model က
      ရွေးစရာ အများကြီးထဲကနေ စာအသစ် ဖန်တီးတာပါ။ ဘာကြောင့်လဲဆိုတော့ member model က ကြိုသတ်မှတ်ထားတဲ့ label
      နှစ်ခုထဲက တစ်ခုကိုပဲ ရွေးပေမယ့်၊ language model ကတော့ token အများကြီးထဲက နောက် token ကို တစ်ခုချင်း ဆက်တိုက်
      ရွေးသွားလို့ပါ။ ဒါကြောင့် ဘယ်မှာမှ မရှိသေးတဲ့ စာကြောင်း အသစ်တွေ ထွက်လာပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Generative AI: Create new content (Check your understanding)",
