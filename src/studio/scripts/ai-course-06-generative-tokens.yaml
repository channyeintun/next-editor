  - id: sampling
    chapter: "Temperature နဲ့ max tokens"
    narration: >
      [[mark:type-runs]] ဒါဆို model ကို လက်ဖက်ရည် ကနေ စပြီး ဆက်ရေးခိုင်းကြည့်ရအောင်။ [[mark:read-runs]] model က နောက်
      token ကို ဖြစ်နိုင်ခြေအလိုက် ကျပန်း ရွေးပြီး၊ ရွေးပြီးသား token နောက်မှာ ထပ်ရွေးတာကို ဆက်တိုက် လုပ်သွားပါတယ်။
      ဒီလို ဖြစ်နိုင်ခြေအလိုက် ရွေးတာကို sampling လို့ ခေါ်ပါတယ်။ [[mark:read-diff]] Two runs card မှာ တူတူပဲ နှစ်ခါ
      ရေးခိုင်းထားပေမယ့်၊ နှစ်ခုလုံး လက်ဖက်ရည် နို့စိမ်း တစ်ခွက် နဲ့ စပြီး ပထမက သံပုရာရည် ဘက်၊ ဒုတိယက ကော်ဖီ ဘက်
      ရောက်သွားပါတယ်။ ဒါကြောင့် generative AI က deterministic မဟုတ်ပါဘူး။ input တူရင်တောင် output တူမယ်လို့ အာမ
      မခံနိုင်ပါဘူး။ ဒီ lesson မှာတော့ ပြန်ကြည့်တိုင်း တူအောင် run တစ်ခုစီကို seed ဂဏန်း ပုံသေ ပေးထားပါတယ်။
      [[mark:read-controls]] panel ရဲ့ အပေါ်မှာ program က ဆွဲထားတဲ့ ခလုတ် နှစ်တန်းလည်း ပေါ်လာပါပြီ။ temperature ဆိုတာ
      နောက် token ကို ရွေးတဲ့အခါ ဘယ်လောက် ကွဲကွဲပြားပြား ရွေးမလဲ ထိန်းတဲ့ setting ပါ။ max tokens ကတော့ အဖြေ ဘယ်လောက်
      ရှည်ခွင့် ရှိလဲ ကန့်သတ်တဲ့ setting ဖြစ်ပြီး၊ အခု temperature တစ်၊ max tokens ရှစ် ကို ရွေးထားပါတယ်။
    sources:
