  - id: temperature
    narration: >
      [[mark:click-t0]] temperature ကို သုည နှိပ်ကြည့်ပါမယ်။ [[mark:read-t0]] Next word card မှာ ချိုဆိမ့် က ၁၀၀
      ရာခိုင်နှုန်း ဖြစ်သွားပြီး ကျန်တာ အားလုံး သုည ဖြစ်သွားပါပြီ။ ဒါကြောင့် run နှစ်ခုလုံးက လက်ဖက်ရည် ချိုဆိမ့်
      ပူပူလေး ဆိုတာကိုပဲ ထပ်ခါထပ်ခါ ရေးပါတယ်။ temperature နိမ့်ရင် အဖြေကို ကြိုသိရ လွယ်ပြီး၊ သုည ဆိုရင် အမြဲ
      တူပါတယ်။ ဒါပေမဲ့ ဒီလို စာကြောင်း တစ်ကြောင်းတည်းကို ပြန်ပြန်ရေးနေတတ်ပါတယ်။ [[mark:click-t2]] အခု temperature ကို နှစ် ပြောင်းကြည့်ပါမယ်။ [[mark:read-t2]]
      ဖြစ်နိုင်ခြေတွေ ပိုညီလာပြီး၊ ချိုဆိမ့် က ၂၀ ရာခိုင်နှုန်းလောက်ပဲ ကျန်ပါတော့တယ်။ ဒါကြောင့် ဖြစ်နိုင်ခြေ နည်းတဲ့
      token တွေကိုလည်း ပိုရွေးလာပြီး၊ စာကြောင်းတွေ ပိုကွဲပြားလာပါတယ်။ [[mark:read-odd]] ဒါပေမဲ့ ထူးဆန်းတာတွေလည်း
      ပါလာပါတယ်။ ပထမ run က မုန့်ဟင်းခါးကို ပဲဟင်းနဲ့ တွဲပေးထားပြီး၊ ဒုတိယ run က လက်ဖက်ရည်ကို
      အေးအေး ချဉ်ချဉ် လို့ ရေးထားပါတယ်။ ဆိုင်မှာ ဒီလို မရောင်းပါဘူး။ ကပ်လျက် စကားလုံး နှစ်လုံးတိုင်းကို စကားစုတွေထဲမှာ တွေ့ဖူးပေမယ့်၊ model
      က menu ကို တကယ် မသိဘဲ ဖြစ်နိုင်တဲ့ token တွေကို ဆက်ရုံပဲ ဖြစ်လို့ပါ။ မှန်သလိုလို ထင်ရပေမယ့် မမှန်တာကို
      ထုတ်ပေးတဲ့ hallucination က ဒီလိုနဲ့ စတာပါ။
