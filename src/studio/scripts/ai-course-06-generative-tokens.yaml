      src/bigram.js: |
        // A toy next-word model for this lesson (a "word bigram"), trained in the page: it counts which
        // word follows which in the shop's phrases, then writes text by picking the next word again and
        // again. Real language models do the same job, next token after next token, with a neural network
        // trained on billions of examples instead of a table of counts.
        import { rng } from "./ml.js";

        // The end of a phrase is a token too: the model can pick it, then start a new phrase.
        export const END = "။";

        // Split text into this model's tokens: one word between spaces, and the end mark on its own.
        export function splitWords(text) {
          return text.replace(/။/g, " ။ ").split(/\s+/).filter(Boolean);
        }

        // Count every pair of neighbouring words (and which words start and end a phrase).
        export function trainBigram(phrases) {
          const next = {};
          const vocab = new Set();
          for (const phrase of phrases) {
            let prev = END;
            for (const word of [...splitWords(phrase), END]) {
              vocab.add(word);
              next[prev] ??= {};
              next[prev][word] = (next[prev][word] ?? 0) + 1;
              prev = word;
            }
          }
          const pairs = Object.values(next).reduce((n, followers) => n + Object.keys(followers).length, 0);
          return { phrases: phrases.length, words: vocab.size, pairs, next };
        }

        // The probability of each next word after `word`. Temperature reshapes the counted probabilities:
        // 1 keeps them, lower makes the likely word more likely (0 = always the most likely one), higher
        // flattens them so unlikely words are picked more often.
        export function nextWords(model, word, temperature = 1) {
          const followers = Object.entries(model.next[word] ?? {});
          if (!followers.length) return {};
          if (temperature === 0) {
            const top = Math.max(...followers.map(([, count]) => count));
            const first = followers.find(([, count]) => count === top)[0];
            return Object.fromEntries(followers.map(([w]) => [w, w === first ? 1 : 0]));
          }
          const weights = followers.map(([w, count]) => [w, count ** (1 / temperature)]);
          const total = weights.reduce((s, [, x]) => s + x, 0);
          return Object.fromEntries(weights.map(([w, x]) => [w, x / total]));
        }

        // Write on from `start`: pick each next word by its probability, up to `maxTokens` new tokens.
        // The seed fixes the random numbers, so a run gives the same text every time it is replayed.
        export function writeOn(model, start, { temperature = 1, maxTokens = 8, seed = 1 } = {}) {
          const random = rng(seed);
          const words = [start];
          let word = start;
          for (let i = 0; i < maxTokens; i++) {
            const probs = Object.entries(nextWords(model, word, temperature));
            if (!probs.length) break;
            let r = random();
            let pick = probs[probs.length - 1][0];
            for (const [w, p] of probs) {
              if ((r -= p) < 0) {
                pick = w;
                break;
              }
            }
            words.push(pick);
            word = pick;
          }
          return words.join(" ").replace(/ ။/g, "။");
        }
      src/llm.js: |
        // The lesson's stand-in for a model API.
        // A real model is slow and can answer differently from run to run, so this lesson uses answers
        // recorded ahead of time from a real model: data/responses.json (how: data/PROVENANCE.md).
        // generate() returns the recorded answer for exactly these messages, and shows it in the panel.
        import recorded from "../data/responses.json";
        import { panel } from "ai-panel";

        export const model = recorded.provenance;

        const find = (messages) => {
          const key = JSON.stringify(messages.map(({ role, content }) => ({ role, content })));
          return recorded.responses.find((r) => JSON.stringify(r.messages) === key);
        };

        export async function generate(messages, { show = true } = {}) {
          const hit = find(messages);
          if (!hit) {
            const error = new Error("No recorded answer for these exact messages yet.");
            error.name = "CourseNotice";
            throw error;
          }
          if (show) panel.output("Model answer", hit.output, { id: "answer", badge: `recorded · ${model.label} · greedy` });
          return hit.output;
        }

        // The token counts the model's own tokenizer gave when the answer was recorded (the prompt includes
        // the chat template's own tokens): { promptTokens, outputTokens }, or null when not recorded.
        export function tokensFor(messages) {
          const hit = find(messages);
          return hit ? { promptTokens: hit.promptTokens, outputTokens: hit.outputTokens } : null;
        }
      src/main.js: |
        import data from "../data/phrases.json";
