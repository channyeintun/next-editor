  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ generative AI က predictive AI လိုပဲ ခန့်မှန်းပေမယ့်၊ token အများကြီးထဲက
      နောက် token ကို တစ်ခုချင်း ရွေးပြီး စာအသစ် ရေးပါတယ်။ [[mark:sel-counts]] ကုန်ကျစရိတ်နဲ့ အချိန်က token
      အရေအတွက်ပေါ် မူတည်ပြီး၊ ဒီ ဥပမာမှာတော့ မြန်မာစာက token ပိုများပါတယ်။ [[mark:sel-runs]] temperature က ရွေးတာကို
      ကြိုသိရ ပိုလွယ်အောင် ဒါမှမဟုတ် ပိုကွဲပြားအောင် ညှိပြီး၊ max tokens က အရှည်ကို ကန့်သတ်ပါတယ်။ model က
      ဖြစ်နိုင်တာကိုပဲ ဆက်ရေးလို့ မမှန်တာလည်း ရေးနိုင်ပါတယ်။ နောက် lesson မှာတော့ generative AI ရဲ့ loop ကို
      ဝန်ထမ်းတွေအတွက် menu ဖော်ပြချက် helper တစ်ခုနဲ့ အဆင့်လိုက် ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Generative AI: Create new content",
          url: "https://web.dev/learn/ai/generative",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: recap }, open: false }
      - id: sel-counts
        type: editor.select
        at: { mark: sel-counts }
        target: { file: src/main.js, text: "showTokenCounts(messages);", occurrence: 1 }
      - id: sel-runs
        type: editor.select
        at: { mark: sel-runs }
        target: { file: src/main.js, text: 'showContinuations(model, "လက်ဖက်ရည်");', occurrence: 1 }
      - {
          id: expect-final-code,
          type: expect.file,
          at: { afterAction: sel-runs },
          path: src/main.js,
          contains: "const model = trainBigram(data.phrases);\nshowNextWords(model, \"လက်ဖက်ရည်\");\nshowContinuations(model, \"လက်ဖက်ရည်\");\nshowModel(model);\n",
        }
      - {
          id: expect-final-english,
          type: expect.file,
          at: { afterAction: expect-final-code },
          path: src/main.js,
          contains: "  [\"English\", \"I'd like to pre-order two milk teas for tomorrow morning.\"],\n",
        }
checks:
  - { type: timing.p95Ms, max: 300 }
