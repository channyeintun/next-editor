  - id: max-tokens
    narration: >
      [[mark:click-max]] နောက်ဆုံး max tokens ကို လေး နှိပ်ကြည့်ပါမယ်။ [[mark:read-max]] run တိုင်းက token အသစ်
      လေးခု ပြည့်တာနဲ့ ရပ်သွားပါတယ်။ ဒုတိယ run ဆိုရင် သံပုရာရည် ဆိုပြီး စကားစု အသစ် စတုန်းမှာပဲ ပြတ်သွားပါတယ်။
      max tokens က အဖြေ ရှည်တာကို ကန့်သတ်ပေမယ့်၊ model က စာကို ပြီးအောင် ရေးပေးတာ မဟုတ်ဘဲ ကန့်သတ်ချက်
      ရောက်တာနဲ့ ရပ်ရုံပါ။ token နည်းလေ ငွေ သက်သာပြီး မြန်လေ ဖြစ်ပေမယ့်၊ အဖြေ မပြည့်စုံမှာကိုလည်း ချိန်ဆရပါမယ်။
