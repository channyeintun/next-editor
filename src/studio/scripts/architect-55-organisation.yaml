    - id: autonomy
      contentType: html
      name: ကိုယ်တိုင် ဆုံးဖြတ်နိုင်ဖို့ လိုတာ
      content: |
        <style>
          .stage { position: relative; width: 100vw; height: 100vh; background: #0b0d12; color: #e7e9ee; font-family: system-ui, "Noto Sans Myanmar", sans-serif; text-align: left; }
          .title { position: absolute; left: 8vw; top: 9vh; height: 12vh; line-height: 12vh; font-size: 3.6vw; font-weight: 700; white-space: nowrap; }
          .row { position: absolute; left: 8vw; height: 10vh; line-height: 10vh; font-size: 2.4vw; white-space: nowrap; }
          .num { display: inline-block; width: 4vw; color: #8b93a7; }
          .term { display: inline-block; width: 18vw; font-weight: 700; }
          .wide { width: 26vw; }
          .blue { color: #74c0fc; } .orange { color: #ffc078; } .green { color: #8ce99a; } .red { color: #ffa8a8; } .violet { color: #b197fc; }
        </style>
        <div class="stage">
          <div class="title">Team တစ်ခု ကိုယ်တိုင် ဆုံးဖြတ်နိုင်ဖို့ လိုတာ သုံးခု</div>
          <div class="row" style="top: 34vh"><span class="num">1</span><span class="term orange">ဦးတည်ချက်</span>ဘာလုပ်ရမလဲ မဟုတ်၊ ဘာကို ရချင်တာလဲ</div>
          <div class="row" style="top: 50vh"><span class="num">2</span><span class="term violet">Feedback</span>ကိုယ်ဆောက်တာရဲ့ ရလဒ်ကို ကိုယ်တိုင် မြင်ရ</div>
          <div class="row" style="top: 66vh"><span class="num">3</span><span class="term blue">Platform</span>မှန်တဲ့ နည်းက အလွယ်ဆုံး နည်း ဖြစ်နေ</div>
        </div>
