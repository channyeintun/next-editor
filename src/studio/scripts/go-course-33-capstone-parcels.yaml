scenes:
  - id: recall
    chapter: Capstone ၁၊ ပါဆယ် ဈေးတွက်တာ
    narration: >-
      ပြီးခဲ့တဲ့ lesson မှာ rider နှစ်ယောက်က ငွေ စုစုပေါင်း တစ်ခုတည်းကို တစ်ပြိုင်နက် ပေါင်းတဲ့အခါ ငွေ
      ပျောက်သွားတာကို mutex နဲ့ ကာကွယ်ခဲ့ပါတယ်။ ဒီနေ့ကစပြီး lesson နှစ်ခုမှာ၊ course တစ်ခုလုံး
      လေ့လာခဲ့တာတွေကို ပေါင်းပြီး program အပြည့်အစုံ တစ်ခု ရေးပါမယ်။ ဒါကို capstone လို့ ခေါ်ပါတယ်။
      [[mark:today-plan]] ပါဆယ် ဝန်ဆောင်မှုရဲ့ တစ်နေ့တာ အလုပ်ကို ကူညီပေးမယ့် program ပါ။ ဒီနေ့ ပထမပိုင်းမှာတော့ မနက်ပိုင်း
      လက်ခံထားတဲ့ ပါဆယ်တွေရဲ့ ပို့ခကို တွက်မယ်၊ ပို့လို့ မရတဲ့ ပါဆယ်ကို အကြောင်းပြချက်နဲ့ ငြင်းမယ်၊ ပြီးတော့
      ပြေစာတွေ ထုတ်ပါမယ်။ [[mark:sel-today]] main ဖိုင်ထဲမှာ ဒီနေ့ မနက် ကောင်တာမှာ လက်ခံထားတဲ့ ပါဆယ်
      လေးခုရဲ့ slice ရှိပါတယ်။ ပါဆယ် တစ်ခုစီမှာ code၊ ပို့မယ့် မြို့၊ အလေးချိန်နဲ့ လက်ခံတဲ့ အချိန် ပါပါတယ်။
      အချိန်တွေက ၂၀၂၆ ခုနှစ်၊ ဧပြီလ ၁၇ ရက်၊ သောကြာနေ့ရဲ့ မြန်မာစံတော်ချိန်ပါ၊ ဥပမာ ပထမ ပါဆယ်ကို မနက်
      ကိုးနာရီ ဆယ်မိနစ်မှာ လက်ခံထားတာပါ။
    sources:
      - {
          title: "How to Write Go Code — Code organization",
          url: "https://go.dev/doc/code#code-organization",
        }
      - { title: "time package — Date", url: "https://pkg.go.dev/time#Date" }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }
      - id: sel-today
        type: editor.select
        at: { mark: sel-today }
        target: { file: main.go, text: "var today = []Parcel{", occurrence: 1 }

  - id: map
    chapter: ဖိုင် ခုနစ်ခု
    narration: >-
      [[mark:board-map]] ဒီ program မှာ ဖိုင် ခုနစ်ခု ရှိပါတယ်။ ဖိုင် အများကြီးပါတဲ့ program တစ်ခုကို
      စဖတ်တဲ့အခါ၊ ဖိုင် တစ်ခုစီ ဘာလုပ်လဲ၊ ဘယ်ဖိုင်က ဘယ်ဖိုင်ကို ခေါ်လဲ ဆိုတာကို ပုံ တစ်ခုနဲ့ အရင် ဆွဲကြည့်ရင်
      လမ်း မပျောက်တော့ပါဘူး။ [[mark:draw-main]] အပေါ်ဆုံးမှာ main ဖိုင်ပါ။ ဒီနေ့ ကိုယ်တို့ ရေးမယ့် ဖိုင်ဖြစ်ပြီး၊
      တစ်နေ့တာ အလုပ် အစဉ်ကို ဒီမှာ ရေးပါမယ်။ [[mark:draw-called]] main က တိုက်ရိုက် ခေါ်မယ့် ဖိုင် သုံးခု
      ရှိပါတယ်။ receipt ဖိုင်က ပြေစာ ပုံစံပါ၊ ငွေကို ကျပ်နဲ့ ပြတဲ့ function က lesson ကိုးကတည်းက ပါလာတာပါ။
      errors ဖိုင်က ပါဆယ်ကို ပို့လို့ ရမရ စစ်ပြီး error ပြန်ပေးတဲ့ lesson နှစ်ဆယ့်သုံးက code ပါ။ clock
      ဖိုင်ကတော့ lesson နှစ်ဆယ့်ရှစ်က မြန်မာစံတော်ချိန်ပါ။ [[mark:draw-base]] အောက်ဆုံး တန်းမှာတော့ ဖိုင်
      တိုင်းက ပြန်သုံးတဲ့ အခြေခံ ဖိုင်တွေ ရှိပါတယ်။ digits ဖိုင်က lesson ဆယ့်ငါးက မြန်မာ ဂဏန်း function
      တွေ၊ parcel ဖိုင်က Parcel struct နဲ့ မြို့ နာမည်တွေ၊ fees ဖိုင်ကတော့ ပို့ခ စည်းကမ်းပါ။
      [[mark:draw-reuse]] ဆိုလိုတာက ဒီနေ့ အသစ် ရေးရမှာ နည်းနည်းလေးပဲ ရှိပြီး၊ ကျန်တာ အားလုံးကို အရင်
      lesson တွေကနေ ပြန်သုံးတာပါ။
    sources:
      - {
          title: "How to Write Go Code — Code organization",
          url: "https://go.dev/doc/code#code-organization",
        }
      - {
          title: "The Go Programming Language Specification — Packages",
          url: "https://go.dev/ref/spec#Packages",
        }
    actions:
      - {
          id: board-map,
          type: whiteboard.apply,
          at: { mark: board-map, offsetMs: -300 },
          open: true,
          clear: true,
          upsertIds: [m-title],
        }
      - {
          id: draw-main,
          type: whiteboard.apply,
          at: { mark: draw-main },
          upsertIds: [m-main-box, m-main],
          drawMs: 1200,
        }
      - {
          id: draw-called,
          type: whiteboard.apply,
          at: { mark: draw-called },
          upsertIds:
            [
              m-a1,
              m-a2,
              m-a3,
              m-receipt-box,
              m-receipt,
              m-receipt-l,
              m-errors-box,
              m-errors,
              m-errors-l,
              m-clock-box,
              m-clock,
              m-clock-l,
              m-row2,
            ],
          drawMs: 4500,
        }
      - {
          id: draw-base,
          type: whiteboard.apply,
          at: { mark: draw-base },
          upsertIds:
            [
              m-digits-box,
              m-digits,
              m-digits-l,
              m-parcel-box,
              m-parcel,
              m-parcel-l,
              m-fees-box,
              m-fees,
              m-fees-l,
              m-row3,
            ],
