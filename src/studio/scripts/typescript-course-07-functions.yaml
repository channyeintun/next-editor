  - id: optional
    chapter: "Optional parameter"
    narration: >
      [[mark:open-main-2]] main ဖိုင်က နောက် error တစ်ခုကို ကြည့်ရအောင်။ လက်ဖက်ရည်ရဲ့ ဘောင်ချာ စာကြောင်းက
      မှတ်ချက်ကို မပေးထားလို့၊ argument သုံးခု လိုပေမယ့် နှစ်ခုပဲ ရတယ်လို့ ပြောနေပါတယ်။ [[mark:open-shop-2]]
      ဒါပေမဲ့ function ထဲက ဒီ line ကို ကြည့်ပါ။ မှတ်ချက် ရှိမှပဲ ဆက်ထည့်ပြီး၊ မရှိရင် ဘာမှ မထည့်ပါဘူး။
      ဆိုလိုတာက code က မှတ်ချက် မပါတာကို handle လုပ်ထားပြီးသား ဖြစ်ပေမယ့်၊ type က မဖြစ်မနေ ထည့်ခိုင်းနေတာပါ။
      [[mark:type-optional]] ဒါကြောင့် မှတ်ချက် parameter ရဲ့ နာမည်နောက်မှာ question mark တစ်လုံး ထည့်ပါမယ်။
      [[mark:read-optional]] error ပျောက်သွားပါပြီ။ ဒါကို optional parameter လို့ ခေါ်ပါတယ်။
      [[mark:type-query-note]] function အထဲမှာ မှတ်ချက်ရဲ့ type ကို query comment နဲ့ ကြည့်ရအောင်။
      [[mark:read-query-note]] string ဒါမှမဟုတ် undefined လို့ ပြနေပါတယ်။ default parameter နဲ့ မတူတာက၊
      optional parameter မှာ တန်ဖိုး မပါဘဲ လာနိုင်လို့ undefined ကိုပါ စစ်ပြီးမှ သုံးရတာပါ။ [[mark:no-both]]
      question mark နဲ့ default တန်ဖိုးကိုတော့ parameter တစ်ခုတည်းမှာ တွဲရေးလို့ မရပါဘူး၊ TypeScript က error
      ပြပါတယ်။ ဘာကြောင့်လဲဆိုတော့ default တန်ဖိုး ပေးထားတာနဲ့ အဲဒီ parameter က မထည့်လည်း ရတဲ့
      parameter ဖြစ်ပြီးသားမို့လို့ပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 4: Essential Types and Annotations (optional parameters)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/essential-types-and-annotations",
        }
      - {
          title: "TypeScript Handbook: More on Functions (optional parameters)",
          url: "https://www.typescriptlang.org/docs/handbook/2/functions.html#optional-parameters",
        }
    actions:
      - id: open-main-2
        type: workspace.openFile
        at: { mark: open-main-2 }
        path: src/main.ts
      - id: select-tea-receipt
        type: editor.select
        at: { afterAction: open-main-2 }
        target: { file: src/main.ts, text: 'receiptLine("လက်ဖက်ရည်", tea)', occurrence: 1 }
      - id: expect-note-message
        type: expect.preview
        at: { afterAction: select-tea-receipt }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-2 }
        textContains: "Expected 3 arguments, but got 2."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: open-shop-2
        type: workspace.openFile
        at: { mark: open-shop-2 }
        path: src/shop.ts
      - id: select-extra
        type: editor.select
        at: { afterAction: open-shop-2 }
        target:
          { file: src/shop.ts, text: 'const extra = note ? ` · ${note}` : "";', occurrence: 1 }
      - id: type-optional
        type: editor.type
        at: { mark: type-optional }
        target: { file: src/shop.ts, after: "amount: number, note", occurrence: 1 }
        text: "?"
      - id: expect-two-errors
        type: expect.preview
        at: { afterAction: type-optional }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-query-note
        type: editor.type
        at: { mark: type-query-note }
        target:
          {
            file: src/shop.ts,
            after: "  const extra = note ? ` · ${note}` : \"\";\n",
