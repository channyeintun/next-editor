  - id: default
    chapter: "Default parameter"
    narration: >
      [[mark:select-coffee-call]] ကော်ဖီ ဈေးကနေ စကြည့်ရအောင်။ ဒီ line က ခွက်ရေကို မပေးထားလို့၊ error က
      argument နှစ်ခု လိုပေမယ့် တစ်ခုပဲ ရတယ်လို့ ပြောနေပါတယ်။ run လိုက်တဲ့အခါ ခွက်ရေက undefined ဖြစ်ပြီး၊
      ဂဏန်းကို undefined နဲ့ မြှောက်တော့ NaN ထွက်လာတာပါ။ ဆိုင်မှာ ခွက်ရေ မပေးရင် တစ်ခွက်လို့ ယူစေချင်ပါတယ်။
      [[mark:open-shop-1]] ဒါကြောင့် shop ဖိုင်မှာ၊ ခွက်ရေ parameter ကို တစ် ဆိုတဲ့ default တန်ဖိုး
      ပေးလိုက်ပါမယ်။ [[mark:read-default]] error တစ်ခု ပျောက်သွားပြီး၊ ကော်ဖီက ၁၈၀၀ ကျပ်၊ စုစုပေါင်းက ၄၈၀၀
      ဖြစ်သွားပါပြီ။ ဒါကို default parameter လို့ ခေါ်ပါတယ်။ ခေါ်တဲ့သူအတွက်တော့ မထည့်လည်း ရတဲ့ parameter
      ဖြစ်သွားပေမယ့်၊ [[mark:explain-default]] function အထဲမှာတော့ တန်ဖိုး အမြဲ ရှိလို့ number ပဲ ဖြစ်ပါတယ်။
      default တန်ဖိုးကနေ number လို့ infer လုပ်နိုင်တဲ့အတွက် type annotation ကို မရေးလည်း ရပါတယ်။
    sources:
