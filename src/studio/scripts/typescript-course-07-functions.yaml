build:
  # Studio replaces this built-in profile at render time with the Burmese provider chosen in the
  # render console (AthanLab with the user's own key, or VoxCPM2 when that feature is enabled).
  voiceProfile: pocket-alba-v1
  seed: 3107
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "Function ရဲ့ type"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ array နဲ့ tuple ကို type ပေးပုံ၊ Set နဲ့ Map ကို type argument
      ပေးပုံကို ကြည့်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ ဆိုင်ရဲ့ program ထဲက function တွေကို type ပေးပုံကို
      ကြည့်သွားပါမယ်။ [[mark:draw-function]] function တစ်ခုမှာ ဘယ်ဘက်ကနေ parameter တွေအဖြစ် တန်ဖိုးတွေ
      ဝင်လာပြီး၊ ညာဘက်ကနေ ရလဒ် တန်ဖိုး တစ်ခု ပြန်ထွက်သွားပါတယ်။ parameter တွေကို ဘာနဲ့ ခေါ်မလဲ ဆိုတာ
      TypeScript ကြိုမသိနိုင်လို့ type ကို ကိုယ်တိုင် ရေးပေးရပြီး၊ ပြန်ပေးတဲ့ type ကိုတော့ များသောအားဖြင့်
      function ရဲ့ code ကို ကြည့်ပြီး infer လုပ်ပေးပါတယ်။ [[mark:draw-params]] parameter ဘက်မှာ မထည့်လည်း
      ရတဲ့ optional parameter ရယ်၊ မထည့်ရင် ကိုယ်ပေးထားတဲ့ တန်ဖိုးကို သုံးမယ့် default parameter ရယ်၊
      ကျန်တဲ့ argument အားလုံးကို array တစ်ခုထဲ စုယူတဲ့ rest parameter ရယ်ကို ကြည့်ပါမယ်။ [[mark:draw-return]] ညာဘက်မှာတော့
      return type ကို ကိုယ်တိုင် ကြေညာပုံ၊ ပြန်ပေးတဲ့ တန်ဖိုးကို မသုံးဘူး ဆိုတဲ့ void နဲ့၊ async function
      တွေ ပြန်ပေးတဲ့ Promise ကို ကြည့်ပါမယ်။ [[mark:draw-callback]] ပြီးတော့ function တစ်ခုရဲ့ ပုံစံကိုယ်တိုင်ကိုလည်း type
      အဖြစ် ရေးလို့ ရပါတယ်။ function တစ်ခုကို နောက် function တစ်ခုဆီ ပို့ပေးတဲ့ callback တွေမှာ ဒါကို
      အများဆုံး သုံးပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 4: Essential Types and Annotations (typing functions)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/essential-types-and-annotations",
        }
      - {
          title: "TypeScript Handbook: More on Functions",
          url: "https://www.typescriptlang.org/docs/handbook/2/functions.html",
        }
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [w-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-function
        type: whiteboard.apply
        at: { mark: draw-function }
        upsertIds:
          [
            w-in-box,
            w-in-name,
            w-in-sub,
            w-arrow-1,
            w-fn-box,
            w-fn-name,
            w-arrow-2,
            w-out-box,
            w-out-name,
            w-out-sub,
          ]
        drawMs: 4000
      - id: draw-params
        type: whiteboard.apply
        at: { mark: draw-params }
        upsertIds: [w-p-opt, w-p-def, w-p-rest]
        drawMs: 2400
      - id: draw-return
        type: whiteboard.apply
        at: { mark: draw-return }
        upsertIds: [w-r-num, w-r-void, w-r-promise]
        drawMs: 2000
      - id: draw-callback
        type: whiteboard.apply
        at: { mark: draw-callback }
        upsertIds: [w-callback]
        drawMs: 1600

  - id: starter
    narration: >
      [[mark:close-board]] ဒီနေ့ code ကို ကြည့်ရအောင်။ [[mark:open-shop]] ဒါက ဆိုင်ရဲ့ ငွေတွက်တဲ့ function
      တွေ ရေးထားတဲ့ ဖိုင်ပါ။ [[mark:select-cup-price]] ပထမ function က တစ်ခွက်ဈေးကို ခွက်ရေနဲ့ မြှောက်ပြီး၊
      [[mark:select-receipt]] ဒုတိယ function က ဘောင်ချာ စာကြောင်း တစ်ကြောင်းကို ရေးပေးပါတယ်။ customer က
      မှတ်ချက် ပေးထားရင် နောက်ဆုံးမှာ ဆက်ထည့်ပါတယ်။ [[mark:select-payable]] အောက်ဆုံး function ကတော့
      member ဖြစ်ရင် ၃၀၀ ကျပ် လျှော့ပေးပါတယ်။ [[mark:open-kitchen]] ဒါကတော့ မီးဖိုချောင် ဖိုင်ပါ။
      [[mark:select-brew]] ပထမ function က သောက်စရာ အသင့်ဖြစ်တဲ့အခါ၊ ကိုယ်ပေးလိုက်တဲ့ function ကို ပြန်ခေါ်ပြီး
      အသိပေးပါတယ်။ [[mark:select-wait]] ဒုတိယ function ကတော့ အချိန် နည်းနည်း ယူပြီးမှ၊ customer စောင့်ရမယ့်
      မိနစ်ကို ပြန်ပေးတဲ့ async function ပါ။ [[mark:open-main]] main ဖိုင်ကတော့ ဒီ function တွေကို ခေါ်ပြီး
      ရလဒ်တွေကို ထုတ်ပြပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 4: Essential Types and Annotations (typing functions)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/essential-types-and-annotations",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: open-shop
        type: workspace.openFile
        at: { mark: open-shop }
        path: src/shop.ts
      - id: select-cup-price
        type: editor.select
        at: { mark: select-cup-price }
        target: { file: src/shop.ts, text: "cupPrice(price: number, cups: number)", occurrence: 1 }
      - id: select-receipt
        type: editor.select
        at: { mark: select-receipt }
        target:
          { file: src/shop.ts, text: 'const extra = note ? ` · ${note}` : "";', occurrence: 1 }
      - id: select-payable
        type: editor.select
        at: { mark: select-payable }
        target: { file: src/shop.ts, text: "if (isMember) return total - 300;", occurrence: 1 }
      - id: open-kitchen
        type: workspace.openFile
        at: { mark: open-kitchen }
        path: src/kitchen.ts
      - id: select-brew
        type: editor.select
        at: { mark: select-brew }
        target: { file: src/kitchen.ts, text: "onReady(`${item} အသင့်ဖြစ်ပါပြီ`);", occurrence: 1 }
      - id: select-wait
        type: editor.select
        at: { mark: select-wait }
        target:
          {
            file: src/kitchen.ts,
            text: "export async function waitMinutes(cups: number)",
            occurrence: 1,
          }
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: src/main.ts

  - id: symptoms
    chapter: "ဒီနေ့ ပြဿနာတွေ"
    narration: >
      [[mark:panel-ready]] ညာဘက် panel ရဲ့ Output ကို အရင် ကြည့်ရအောင်။ ကော်ဖီရဲ့ ဈေးက ဂဏန်း မဟုတ်ဘူး
      ဆိုတဲ့ NaN ဖြစ်နေလို့၊ စုစုပေါင်းကလည်း NaN ဖြစ်နေပါတယ်။ ပေးရမယ့် ငွေကတော့ undefined လို့ ပြနေပါတယ်။
      [[mark:read-errors]] အပေါ်က Errors အပိုင်းမှာလည်း error လေးခု ရှိပါတယ်။ ဒီ error တွေကို တစ်ခုချင်း
      ပြင်ရင်း၊ function ရဲ့ type အပိုင်း တစ်ခုစီကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "TypeScript Handbook: More on Functions",
          url: "https://www.typescriptlang.org/docs/handbook/2/functions.html",
        }
      - {
          title: "MDN: NaN",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/NaN",
        }
