  - id: rest
    chapter: "Rest parameter"
    narration: >
      [[mark:select-rest]] စုစုပေါင်း တွက်တဲ့ function ကို ကြည့်ပါ။ parameter ရှေ့က အစက် သုံးစက်က၊ ထည့်ပေးတဲ့
      argument အားလုံးကို array တစ်ခုထဲ စုပေးတဲ့ rest parameter ပါ။ ဒါကြောင့် type ကို number array လို့
      ရေးရပြီး၊ မရေးရင် any array ဖြစ်လို့ error ပြပါတယ်။ [[mark:open-main-3]] main ဖိုင်မှာ ၁၂၀၀ ကျပ်တန်
      ပလာတာ တစ်ချပ်ကို တတိယ argument အနေနဲ့ ထပ်ထည့်ကြည့်ပါမယ်။ [[mark:read-plata]] function ကို မပြင်ရဘဲ
      စုစုပေါင်းက ၆၀၀၀ ဖြစ်သွားပါပြီ။ ဒါပေမဲ့ ပေးရမယ့် ငွေကတော့ undefined ဖြစ်နေတုန်းပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 4: Essential Types and Annotations (rest parameters)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/essential-types-and-annotations",
        }
      - {
          title: "TypeScript Handbook: More on Functions (rest parameters)",
          url: "https://www.typescriptlang.org/docs/handbook/2/functions.html#rest-parameters-and-arguments",
        }
    actions:
      - id: select-rest
        type: editor.select
        at: { mark: select-rest }
        target: { file: src/shop.ts, text: "...prices: number[]", occurrence: 1 }
      - id: open-main-3
        type: workspace.openFile
        at: { mark: open-main-3 }
        path: src/main.ts
      - id: type-plata
        type: editor.type
        at: { afterAction: open-main-3 }
        target: { file: src/main.ts, after: "orderTotal(tea, coffee", occurrence: 1 }
        text: ", 1200"
      - id: expect-total-6000
        type: expect.preview
        at: { afterAction: type-plata }
        timeoutMs: 8000
        target: { by: testId, value: ts-out-3 }
        textContains: "စုစုပေါင်း 6000 · ပေးရမှာ undefined"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-still-two
        type: expect.preview
        at: { afterAction: expect-total-6000 }
        timeoutMs: 5000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: return-type
    chapter: "Return type"
    narration: >
      [[mark:open-shop-3]] အဲဒီ ငွေကို တွက်တဲ့ function ကို ကြည့်ရအောင်။ [[mark:select-payable-if]] member
      ဖြစ်ရင် ၃၀၀ ကျပ် လျှော့ပြီး ပြန်ပေးပေမယ့်၊ member မဟုတ်ရင် ဘာ ပြန်ပေးရမလဲ ရေးဖို့ ကျန်ခဲ့ပါတယ်။ ဘာမှ
      ပြန်မပေးတဲ့ function က undefined ကို ပြန်ပေးတာမို့ Output မှာ undefined ပေါ်နေတာပါ။
      [[mark:type-query-pay]] TypeScript က ဒီ function ကို ဘယ်လို နားလည်ထားလဲ query comment နဲ့
      မေးကြည့်ရအောင်။ [[mark:read-query-pay]] ပြန်ပေးမယ့် type ကို number ဒါမှမဟုတ် undefined လို့
      ပြနေပါတယ်။ TypeScript သိနေပေမယ့်၊ ကိုယ်က ဘာ ပြန်ပေးစေချင်လဲ မပြောထားလို့ error မပြတာပါ။
      [[mark:type-return]] ဒါကြောင့် number ကို ပြန်ပေးရမယ် ဆိုတဲ့ return type ကို ကြေညာလိုက်ပါမယ်။
      [[mark:read-return-error]] function ရဲ့ အဆုံးမှာ return မရှိဘဲ၊ return type ထဲမှာလည်း undefined မပါဘူး
      ဆိုတဲ့ error ပေါ်လာပါပြီ။ အရင်က Output ကျမှ အမှားကို မြင်ရပေမယ့်၊ အခုတော့ TypeScript က အမှားကို
      function ထဲမှာပဲ တန်းပြပေးပါတယ်။ [[mark:type-fix]] member မဟုတ်ရင် စုစုပေါင်း အတိုင်း ပြန်ပေးတဲ့ line
      ကို ထည့်ပါမယ်။ [[mark:read-fix]] error ပျောက်ပြီး၊ ပေးရမယ့် ငွေက ၆၀၀၀ ကျပ် ဖြစ်သွားပါပြီ။ Types မှာလည်း
      ပြန်ပေးမယ့် type က number တစ်ခုတည်း ဖြစ်သွားပါပြီ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 4: Essential Types and Annotations (function return types)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/essential-types-and-annotations",
        }
      - {
          title: "TypeScript Handbook: Everyday Types (return type annotations)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#return-type-annotations",
        }
      - {
          title: "MDN: return (a function without return gives undefined)",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/return",
        }
    actions:
      - id: open-shop-3
        type: workspace.openFile
        at: { mark: open-shop-3 }
        path: src/shop.ts
      - id: select-payable-if
        type: editor.select
        at: { mark: select-payable-if }
        target: { file: src/shop.ts, text: "if (isMember) return total - 300;", occurrence: 1 }
      - id: type-query-pay
        type: editor.type
        at: { mark: type-query-pay }
        target:
          {
            file: src/shop.ts,
            after: "export function payable(total: number, isMember: boolean) {\n",
            occurrence: 1,
          }
        text: "  //            ^?\n"
        cadence: fast-explainer
      - id: expect-pay-inferred
        type: expect.preview
        at: { afterAction: type-query-pay }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-2 }
        attribute:
          {
            name: data-type,
            value: "function payable(total: number, isMember: boolean): number | undefined",
          }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-return
        type: editor.type
        at: { mark: type-return }
        target: { file: src/shop.ts, after: "isMember: boolean)", occurrence: 1 }
        text: ": number"
      - id: expect-return-error-count
        type: expect.preview
        at: { afterAction: type-return }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "3" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-return-error
        type: expect.preview
        at: { afterAction: expect-return-error-count }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-2 }
        textContains: "Function lacks ending return statement and return type does not include 'undefined'."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-fix
        type: editor.type
        at: { mark: type-fix }
        target: { file: src/shop.ts, after: "  if (isMember) return total - 300;\n", occurrence: 1 }
        text: "  return total;\n"
      - id: expect-fixed-count
        type: expect.preview
        at: { afterAction: type-fix }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-payable-6000
        type: expect.preview
        at: { afterAction: expect-fixed-count }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-3 }
        textContains: "စုစုပေါင်း 6000 · ပေးရမှာ 6000"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-pay-declared
        type: expect.preview
        at: { afterAction: expect-payable-6000 }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-2 }
        attribute:
          { name: data-type, value: "function payable(total: number, isMember: boolean): number" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: callback
    chapter: "Function type နဲ့ callback"
    narration: >
      [[mark:open-kitchen-1]] မီးဖိုချောင် ဖိုင်ကို သွားရအောင်။ [[mark:select-on-ready]] ကျန်နေတဲ့ ပထမ error က
      ဒီ parameter မှာ type မရှိလို့ any ဖြစ်နေတယ်လို့ ပြောပါတယ်။ ဒီ parameter က သောက်စရာ အသင့်ဖြစ်တဲ့အခါ
      ပြန်ခေါ်ပေးရမယ့် function ဖြစ်ပြီး၊ ဒီလို parameter အဖြစ် ပို့ပေးတဲ့ function ကို callback လို့
      ခေါ်ပါတယ်။ [[mark:type-alias]] function မှာလည်း type ရှိပါတယ်။ ဖိုင်ရဲ့ အပေါ်ဆုံးမှာ၊ string parameter
      တစ်ခု လက်ခံပြီး void ကို ပြန်ပေးတဲ့ function type ကို OnReady ဆိုတဲ့ type alias အဖြစ် ရေးပါမယ်။
      ကွင်းထဲမှာ parameter တွေ၊ မြှားနောက်မှာ return type ဖြစ်လို့ function ရေးပုံနဲ့ တူပါတယ်။
      [[mark:type-annotate]] ပြီးတော့ callback parameter ကို ဒီ type နဲ့ ကြေညာပါမယ်။ [[mark:read-annotate]]
      ကြည့်ပါ၊ error နှစ်ခုလုံး တစ်ပြိုင်နက် ပျောက်သွားပါပြီ။ [[mark:open-main-4]] ဒုတိယ error က main ဖိုင်ထဲက
      callback ရဲ့ parameter မှာ ဖြစ်ခဲ့တာပါ။ သူ့ type ကို query comment နဲ့ မေးကြည့်ရအောင်။
      [[mark:read-query-msg]] string လို့ ပြနေပါတယ်။ ဒီမှာ type မရေးထားပေမယ့်၊ callback ကို ပို့တဲ့ နေရာက
      OnReady ဖြစ်နေလို့ TypeScript က အဲဒီကနေ သိသွားတာပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 4: Essential Types and Annotations (function types)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/essential-types-and-annotations",
        }
      - {
          title: "TypeScript Handbook: More on Functions (function type expressions)",
          url: "https://www.typescriptlang.org/docs/handbook/2/functions.html#function-type-expressions",
        }
      - {
          title: "TypeScript Handbook: Everyday Types (contextual typing)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#anonymous-functions",
        }
    actions:
      - id: open-kitchen-1
        type: workspace.openFile
        at: { mark: open-kitchen-1 }
        path: src/kitchen.ts
      - id: select-on-ready
        type: editor.select
        at: { mark: select-on-ready }
        target: { file: src/kitchen.ts, text: "onReady", occurrence: 1 }
      - id: expect-on-ready-message
        type: expect.preview
        at: { afterAction: select-on-ready }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Parameter 'onReady' implicitly has an 'any' type."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-alias
        type: editor.type
        at: { mark: type-alias }
        target: { file: src/kitchen.ts, after: "", occurrence: 1 }
        text: "export type OnReady = (message: string) => void;\n\n"
      - id: type-annotate
        type: editor.type
        at: { mark: type-annotate }
        target: { file: src/kitchen.ts, after: "item: string, onReady", occurrence: 1 }
        text: ": OnReady"
      - id: expect-no-errors
        type: expect.preview
        at: { afterAction: type-annotate }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: open-main-4
        type: workspace.openFile
        at: { mark: open-main-4 }
        path: src/main.ts
      - id: type-query-msg
        type: editor.type
        at: { afterAction: open-main-4 }
        target:
          {
            file: src/main.ts,
            after: "brew(\"ကော်ဖီ\", (message) => readyList.push(message));\n",
            occurrence: 1,
          }
        text: "//              ^?\n"
        cadence: fast-explainer
      - id: expect-message-type
        type: expect.preview
        at: { afterAction: type-query-msg }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-3 }
        attribute: { name: data-type, value: "(parameter) message: string" }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: void
    chapter: "void ဆိုတာ"
    narration: >
      [[mark:select-push]] ဒီ callback ကို သေချာ ကြည့်ပါ။ push method က array ရဲ့ length အသစ်ကို ပြန်ပေးလို့၊
      ဒီ callback က number ကို ပြန်ပေးနေပါတယ်။ OnReady က void လို့ ရေးထားပေမယ့် error မရှိပါဘူး။
      ဘာကြောင့်လဲဆိုတော့ void ဆိုတာ၊ ပြန်ပေးတဲ့ တန်ဖိုးကို ခေါ်တဲ့သူက မသုံးဘူး ဆိုတဲ့ အဓိပ္ပာယ် ဖြစ်လို့ပါ။
      [[mark:type-check]] ဒါဆို void အစား undefined လို့ ရေးရင် ဘာ ဖြစ်မလဲ။ နှိုင်းယှဉ်ဖို့ undefined ကို
      ပြန်ပေးရမယ့် function type နဲ့ line တစ်ကြောင်း ရေးကြည့်ပါမယ်။ [[mark:read-check]] number ကို undefined
      နေရာမှာ ထည့်လို့ မရဘူး ဆိုတဲ့ error ပေါ်လာပါပြီ။ undefined က တကယ်ကို undefined ပဲ ပြန်ပေးရမယ်လို့
      တောင်းတာ ဖြစ်လို့၊ push လို တန်ဖိုး ပြန်ပေးတဲ့ function တွေကို လက်မခံပါဘူး။ ဒါကြောင့် callback type တွေမှာ
      void ကို သုံးတာပါ။ [[mark:type-comment]] နှိုင်းယှဉ်ပြီးပြီ ဖြစ်လို့ ဒီ line ကို comment လုပ်ပြီး
      ပိတ်ထားပါမယ်။ [[mark:read-comment]] Errors အပိုင်းမှာ error တစ်ခုမှ မကျန်တော့ပါဘူး။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 4: Essential Types and Annotations (the void type)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/essential-types-and-annotations",
        }
      - {
          title: "TypeScript Handbook: More on Functions (return type void)",
          url: "https://www.typescriptlang.org/docs/handbook/2/functions.html#return-type-void",
        }
      - {
          title: "MDN: Array.prototype.push() returns the new length",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/push",
        }
    actions:
      - id: select-push
        type: editor.select
        at: { mark: select-push }
        target: { file: src/main.ts, text: "(message) => readyList.push(message)", occurrence: 1 }
      - id: type-check
        type: editor.type
        at: { mark: type-check }
        target: { file: src/main.ts, after: "console.log(readyList);\n", occurrence: 1 }
        text: "const check: (text: string) => undefined = (text) => readyList.push(text);\n"
        cadence: line-by-line
      - id: expect-check-count
        type: expect.preview
        at: { afterAction: type-check }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-check-error
        type: expect.preview
        at: { afterAction: expect-check-count }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Type 'number' is not assignable to type 'undefined'."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-comment
        type: editor.type
        at: { mark: type-comment }
        target: { file: src/main.ts, after: "console.log(readyList);\n", occurrence: 1 }
        text: "// "
      - id: expect-clean-again
        type: expect.preview
        at: { afterAction: type-comment }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: async
    chapter: "Async function"
    narration: >
      [[mark:open-kitchen-2]] နောက်ဆုံးအနေနဲ့ async function ကို ကြည့်ရအောင်။ [[mark:type-query-wait]] စောင့်ရမယ့်
      မိနစ် တွက်တဲ့ function ကို query comment နဲ့ မေးကြည့်ပါမယ်။ [[mark:read-query-wait]] Types ရဲ့
      ထိပ်ဆုံးမှာ၊ ပြန်ပေးမယ့် type ကို number မဟုတ်ဘဲ number ပါတဲ့ Promise လို့ ပြနေပါတယ်။ async function
      တွေက အဖြေကို ချက်ချင်း မပေးဘဲ၊ နောက်မှ ရလာမယ့် တန်ဖိုးကို ကိုယ်စားပြုတဲ့ Promise ကို အမြဲ ပြန်ပေးလို့ပါ။
      [[mark:type-promise]] return type ကို ကိုယ်တိုင် ရေးရင်လည်း Promise ရဲ့ အထဲမှာ number ကို ထည့်ရေးရပါတယ်။
      number တစ်ခုတည်း ရေးရင်တော့ TypeScript က error ပြပြီး၊ Promise နဲ့ ရေးချင်တာလား လို့ အကြံပေးပါတယ်။
      [[mark:read-promise]] error မရှိပါဘူး။ Output ရဲ့ နောက်ဆုံး line ကတော့ Promise ထဲက အဖြေ ရောက်လာမှ
      ထုတ်ပြတဲ့ စောင့်ရမယ့် မိနစ်ပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 4: Essential Types and Annotations (typing async functions)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/essential-types-and-annotations",
        }
      - {
          title: "TypeScript Handbook: Everyday Types (functions which return promises)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#functions-which-return-promises",
        }
      - {
          title: "MDN: async function (always returns a Promise)",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/async_function",
        }
    actions:
      - id: open-kitchen-2
        type: workspace.openFile
        at: { mark: open-kitchen-2 }
        path: src/kitchen.ts
      - id: type-query-wait
        type: editor.type
        at: { mark: type-query-wait }
        target:
          {
            file: src/kitchen.ts,
            after: "export async function waitMinutes(cups: number) {\n",
            occurrence: 1,
          }
        text: "  //                  ^?\n"
        cadence: fast-explainer
      - id: expect-wait-type
        type: expect.preview
        at: { afterAction: type-query-wait }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        attribute: { name: data-type, value: "function waitMinutes(cups: number): Promise<number>" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-four-types
        type: expect.preview
        at: { afterAction: expect-wait-type }
        timeoutMs: 5000
        target: { by: testId, value: ts-types }
        attribute: { name: data-count, value: "4" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-promise
        type: editor.type
        at: { mark: type-promise }
        target: { file: src/kitchen.ts, after: "waitMinutes(cups: number)", occurrence: 1 }
        text: ": Promise<number>"
        cadence: fast-explainer
      - id: expect-promise-clean
        type: expect.preview
        at: { afterAction: type-promise }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-promise-type
        type: expect.preview
        at: { afterAction: expect-promise-clean }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-1 }
        attribute: { name: data-type, value: "function waitMinutes(cups: number): Promise<number>" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-wait-output
        type: expect.preview
        at: { afterAction: expect-promise-type }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-5 }
        textContains: "စောင့်ရမှာ 6 မိနစ်"
        retry: { maxAttempts: 3, delayMs: 400 }

  - id: recap
    narration: >
      [[mark:recap-params]] ဒါဆို ပြန်ချုပ်ရရင်၊ optional parameter က function ထဲမှာ undefined ဖြစ်နိုင်ပြီး၊
      default parameter ကတော့ ကိုယ်ပေးထားတဲ့ တန်ဖိုးကို သုံးပါတယ်။ rest parameter က argument တွေကို array
      တစ်ခုထဲ စုပေးပါတယ်။ return type ကို ကြေညာထားရင် အမှားကို function ထဲမှာပဲ ဖမ်းပေးပြီး၊ async function
      က Promise ကို အမြဲ ပြန်ပေးပါတယ်။ [[mark:recap-callback]] callback တွေကို function type နဲ့ ကြေညာပြီး၊
      ပြန်ပေးတဲ့ တန်ဖိုးကို မသုံးရင် void လို့ ရေးပါ။ နောက် lesson မှာတော့ ဒီ type ဒါမှမဟုတ် ဟို type
      ဖြစ်နိုင်တဲ့ union type နဲ့၊ တန်ဖိုး တစ်ခုတည်းကိုပဲ လက်ခံတဲ့ literal type ကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 4: Essential Types and Annotations (typing functions)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/essential-types-and-annotations",
        }
      - {
          title: "TypeScript Handbook: More on Functions",
          url: "https://www.typescriptlang.org/docs/handbook/2/functions.html",
        }
    actions:
      - id: select-callback-type
        type: editor.select
        at: { mark: recap-callback }
        target: { file: src/kitchen.ts, text: "(message: string) => void", occurrence: 1 }
      - id: expect-file-default
        type: expect.file
        at: { mark: recap-params }
        path: src/shop.ts
        contains: "export function cupPrice(price: number, cups: number = 1) {"
      - id: expect-file-optional
        type: expect.file
        at: { afterAction: expect-file-default }
        path: src/shop.ts
        contains: "export function receiptLine(item: string, amount: number, note?: string) {"
      - id: expect-file-return
        type: expect.file
        at: { afterAction: expect-file-optional }
        path: src/shop.ts
        contains: "export function payable(total: number, isMember: boolean): number {\n  //            ^?\n  if (isMember) return total - 300;\n  return total;\n}"
      - id: expect-file-plata
        type: expect.file
        at: { afterAction: expect-file-return }
        path: src/main.ts
        contains: "const total = orderTotal(tea, coffee, 1200);"
      - id: expect-file-alias
        type: expect.file
        at: { afterAction: expect-file-plata }
        path: src/kitchen.ts
        contains: "export type OnReady = (message: string) => void;\n\nexport function brew(item: string, onReady: OnReady) {"
      - id: expect-file-check
        type: expect.file
        at: { afterAction: expect-file-alias }
        path: src/main.ts
        contains: "// const check: (text: string) => undefined = (text) => readyList.push(text);"
      - id: expect-file-promise
        type: expect.file
        at: { afterAction: expect-file-check }
        path: src/kitchen.ts
        contains: "export async function waitMinutes(cups: number): Promise<number> {"
checks:
  - { type: timing.p95Ms, max: 300 }
