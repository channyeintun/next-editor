build:
  # Studio swaps in the Burmese voice chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 2610

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: hook
    chapter: လစာထုတ်ရက် ညနေ 6:40
    narration: >
      [[mark:show-p01]] လူ ၆၀ ရှိတဲ့ Viber group အစား Padauk က service တစ်ခုချင်းရဲ့ rotation တွေ၊ ဆန္ဒရှိတဲ့ senior တွေရဲ့ swarm နဲ့ incident role တွေကို သုံးနေပါပြီ။ လစာထုတ်ရက် ညနေ ၆ နာရီ ၄၀ မှာ Top-up ရဲ့ burn-rate page ဝင်လာပါတယ်၊ error budget ကို ပုံမှန်ထက် အများကြီး မြန်မြန် သုံးနေလို့ on-call ကျနေသူကို ခေါ်တဲ့ page ပါ။
      [[mark:show-p01b]] အဲဒီ မိနစ်မှာပဲ support lead မစုဆီကိုလည်း ငွေဖြတ်သွားပေမဲ့ ဖုန်းဘေလ် မဝင်ဘူး ဆိုတဲ့ message တွေ ဝင်လာပါတယ်။ တစ်နာရီကို top-up ၁၀၀၀၀ လောက် ဝင်နေတဲ့ အချိန်မှာ on-call ကျနေတဲ့ မသီရိ ဘယ်ကနေ စမလဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Google SRE Incident Management Guide (sre.google)",
          url: "https://sre.google/resources/practices-and-processes/incident-management-guide/",
        }
      - {
          title: "Workbook: Incident Response",
          url: "https://sre.google/workbook/incident-response/",
        }
    actions:
      # -1750 / -1450, as in Module 1: a pull-back over 1780 ms pushes the first dialog
      # past the 2 s opening handle, which src/studio/plans/index.test.ts rejects.
      - { id: collapse-dock, type: runtime.collapseDock, at: { scene: start, offsetMs: -1750 } }
      - {
          id: show-p01,
          type: slide.show,
          at: { mark: show-p01, offsetMs: -1450 },
          slideId: l10-p01,
        }
      - { id: show-p01b, type: slide.show, at: { mark: show-p01b }, slideId: l10-p01b }

  - id: timeline
    chapter: မိနစ် 45 ရဲ့ timeline
    narration: >
      [[mark:close-p01b]] [[mark:b1-s1]] အဖြေက graph တွေကနေ မစဘဲ ဦးဆောင်မယ့်သူကို နာမည်နဲ့ သတ်မှတ်ပြီး user တွေ ဘာ ခံစားနေရလဲ မေးတာကနေ စတာပါ။ [[mark:b1-s1b]] ၆ နာရီ ၄၀ မှာ page နဲ့ support ticket တွေ အတူ ရောက်လာပြီး နှစ်ခုလုံးက အရေးကြီးတဲ့ signal ပါ။ ၆ နာရီ ၄၅ မှာ မသီရိက incident ကြေညာပြီး incident commander ဖြစ်လာပါတယ်၊ incident တစ်ခုလုံးကို ညှိနှိုင်းပြီး ဆုံးဖြတ်ချက်ချတဲ့သူပါ။
      [[mark:b1-s2]] ၆ နာရီ ၅၅ မှာ မနေ့က release ကို rollback လုပ်ပေမဲ့ ဘာမှ မပြောင်းပါဘူး။ ၇ နာရီ ၅ မိနစ်မှာ backup endpoint ဆီ traffic လွှဲတော့မှ ဖုန်းဘေလ်တွေ ပြန်ဝင်လာပါတယ်။ incident မှာ ပြဿနာကို သိတာ၊ ဘယ်လောက် ဆိုးလဲ ချိန်တာ၊ အကြောင်းရင်း ရှာတာ၊ user ကို အဆင်ပြေအောင် လုပ်တာ၊ အပြီးတိုင် ပြင်တာ၊ သင်ယူတာ ဆိုတဲ့ အဆင့်တွေ ရှိပေမဲ့ ဒီညကလို fix မအောင်မြင်ရင် ရှာတဲ့ အဆင့်ကို ပြန်ရောက်လို့ မျဉ်းဖြောင့်အတိုင်း မသွားပါဘူး။
      [[mark:b1-s3]] graph တွေ အစိမ်းရောင် ပြန်ဖြစ်ပေမဲ့ မိနစ် ၂၀ စောင့်ကြည့်ပြီးမှ ၇ နာရီ ၂၅ မှာ ပိတ်ကြောင်း ကြေညာပါတယ်။ ဒီ timeline က lesson ရဲ့ ကျောရိုးမို့ တစ်ဆင့်ချင်း ချဲ့ကြည့်ရအောင်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book, 1st ed: Managing Incidents",
          url: "https://sre.google/sre-book/managing-incidents/",
        }
      - {
          title: "Google SRE Incident Management Guide (sre.google)",
          url: "https://sre.google/resources/practices-and-processes/incident-management-guide/",
        }
    actions:
      - { id: close-p01b, type: slide.close, at: { mark: close-p01b, offsetMs: -400 } }
      # The bare axis is furniture: it lands with the board, without drawMs.
      - {
          id: b1-s1,
          type: whiteboard.apply,
          at: { mark: b1-s1 },
          open: true,
          clear: true,
          upsertIds: [l10-b1-axis],
        }
      # The 18:40 and 18:45 ticks as the narration reaches "6:40".
      - id: b1-s1b
        type: whiteboard.apply
        at: { mark: b1-s1b }
        upsertIds:
          [l10-b1-k1, l10-b1-k1-time, l10-b1-k1-text, l10-b1-k2, l10-b1-k2-time, l10-b1-k2-text]
        drawMs: 2000
      - id: b1-s2
        type: whiteboard.apply
        at: { mark: b1-s2 }
        upsertIds:
          [
            l10-b1-k3,
            l10-b1-k3-time,
            l10-b1-k3-text,
            l10-b1-k4,
            l10-b1-k4-time,
            l10-b1-k4-text1,
            l10-b1-k4-text2,
          ]
        drawMs: 2400
      - id: b1-s3
        type: whiteboard.apply
        at: { mark: b1-s3 }
        upsertIds: [l10-b1-k5, l10-b1-k5-time, l10-b1-k5-text1, l10-b1-k5-text2]
        drawMs: 1400

  - id: triage
    chapter: User ဘက်ကနေ triage
    narration: >
      [[mark:close-b1]] [[mark:show-p02]] မသီရိက dashboard မဖွင့်ခင် မစုဆီက အချက် သုံးခု အရင် တောင်းပါတယ်၊ ငွေဖြတ်ပြီး ဖုန်းဘေလ် မဝင်တာ တကယ်လား၊ ဘယ် operator လဲ၊ များလာနေလား ဆိုတာပါ။ ဒီလို user ဘာ ခံစားနေရလဲ ဆိုတာကနေ ပြဿနာ ဘယ်လောက် ပြင်းလဲ မြန်မြန် ချိန်ပြီး ဘာကို အရင် လုပ်မလဲ ဆုံးဖြတ်တာကို triage လို့ ခေါ်ပါတယ်။
      [[mark:show-p02b]] အဖြေက ငွေ တကယ် ဖြတ်သွားတယ်၊ ticket အများစုက Operator A ကနေ လာတယ်၊ များလာနေတယ် ဆိုတာပါ။ အချက် မစုံသေးပေမဲ့ လစာထုတ်ရက်မှာ ငွေ ဖြတ်ခံနေရတဲ့ user တွေ များလာပြီး ထိခိုက်မှု ကြီးနေတော့ မသီရိက ပိုရဲတဲ့ fix ကိုပါ လက်ခံမယ်လို့ ဆုံးဖြတ်ပါတယ်၊ ထိခိုက်မှု သေးရင်တော့ သတိထားပြီး ဖြည်းဖြည်း လုပ်ရပါတယ်။ PagerDuty ရဲ့ public incident လမ်းညွှန်ထဲက severity အဆင့်တွေနဲ့လည်း ထိခိုက်မှုကို ချိန်လို့ရပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Google SRE Incident Management Guide (sre.google)",
          url: "https://sre.google/resources/practices-and-processes/incident-management-guide/",
        }
      - {
          title: "Workbook: Incident Response",
          url: "https://sre.google/workbook/incident-response/",
        }
      - {
          title: "PagerDuty Incident Response docs: Severity Levels",
          url: "https://response.pagerduty.com/before/severity_levels/",
        }
    actions:
      - {
          id: close-b1,
          type: whiteboard.apply,
          at: { mark: close-b1, offsetMs: -400 },
          open: false,
        }
      - { id: show-p02, type: slide.show, at: { mark: show-p02 }, slideId: l10-p02 }
      - { id: show-p02b, type: slide.show, at: { mark: show-p02b }, slideId: l10-p02b }

  - id: hypotheses
    chapter: Hypothesis သုံးခု တစ်ပြိုင်နက်
    narration: >
      [[mark:close-p02b]] [[mark:b2-s1]] မသီရိက ဘာကြောင့် ဖြစ်နေလဲ ဆိုတဲ့ ယူဆချက်၊ hypothesis သုံးခုကို ချရေးပါတယ်၊ [[mark:b2-s1b]] မနေ့က release၊ database connection pool ပြည့်နေတာနဲ့ Operator A နှေးနေတာပါ။ တစ်ခုစီကို owner တစ်ယောက်စီ ပေးပြီး မှန်ကြောင်း မဟုတ်ဘဲ မှားကြောင်း သက်သေပြဖို့ ကြိုးစားခိုင်းပါတယ်၊ ဒါမှ ကိုယ်ထင်ထားတာကိုပဲ မြင်မိတဲ့ confirmation bias ကို ကာကွယ်နိုင်ပါတယ်။
      [[mark:b2-s2]] Operator A ကိုတော့ Top-up developer ကိုမင်းကို ပေးပါတယ်၊ ကိုမင်း၊ latency ကို စစ်ပြီး ၇ နာရီမှာ ပြန်ပြောပါလို့ နာမည်နဲ့ အချိန် တပ်ပြီး ခိုင်းတာပါ။ ကိုမင်းက operator အလိုက် latency ကို ဘယ်မှာ ကြည့်ရမလဲ မသိလို့ ၁၀ မိနစ်ထဲက အများစုဟာ မှန်တဲ့ dashboard ရှာရင်း ကုန်သွားပါတယ်။ ဒါ သူ့ အပြစ် မဟုတ်ပါဘူး၊ tool တွေကို incident မတိုင်ခင် ကြိုသုံးတတ်ထားရပါမယ်။
      [[mark:b2-s3]] ပြင်တဲ့ အလုပ်ကို ဦးဆောင်တဲ့ operations lead က rollback လုပ်ကြည့်တော့ ဘာမှ မပြောင်းလို့ ပထမ hypothesis ပြုတ်သွားပါတယ်။ [[mark:b2-s3b]] swarm ထဲက volunteer တစ်ယောက်ကလည်း database မှာ connection တွေ လွတ်နေတာ တွေ့လို့ ဒုတိယ တစ်ခုလည်း ပြုတ်ပါတယ်။ စစ်တာ သုံးခု တစ်ပြိုင်နက် လုပ်ပေမဲ့ production ပြောင်းတာကိုတော့ operations lead ကနေ တစ်ကြိမ်မှာ တစ်ခုပဲ လုပ်ပါတယ်၊ နှစ်ခု တစ်ပြိုင်နက် ဝင်ရင် ဘယ်ဟာက ဘာ ဖြစ်စေလဲ မသိနိုင်တော့လို့ပါ။
      [[mark:b2-s4]] ၇ နာရီမှာ ကိုမင်းက Operator A မှာ timeout တွေ တွေ့ကြောင်း ပြောတော့ operations lead က backup endpoint ဆီ traffic လွှဲလိုက်ပါတယ်။ ကြည့်၊ နားလည်၊ ဆုံးဖြတ်၊ လုပ်တဲ့ စက်ဝိုင်းကို hypothesis တစ်ခုချင်း ပတ်ရင် နှေးလို့ လူ သုံးယောက် ရှိတော့ သုံးခု တစ်ပြိုင်နက် စစ်တာပါ။ ရှာတာကလည်း fix ရွေးနိုင်ဖို့ပါ၊ root cause တစ်ခုတည်းကို လိုက်ရှာဖို့ မဟုတ်ပါဘူး။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book, 1st ed: Managing Incidents",
          url: "https://sre.google/sre-book/managing-incidents/",
        }
      - { title: "OODA loop (Wikipedia)", url: "https://en.wikipedia.org/wiki/OODA_loop" }
    actions:
      - { id: close-p02b, type: slide.close, at: { mark: close-p02b, offsetMs: -400 } }
      # Step 1 in two: the IC, its arrow and the bus land with the board; the
      # three cards are drawn in right after the ၊ that introduces them.
      - {
