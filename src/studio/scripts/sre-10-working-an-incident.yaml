      notes.md: |
        # Incident တစ်ခုကို အစကနေ အဆုံးထိ

        - triage — user ဘာ ခံစားနေရလဲကနေ ဘယ်လောက် ပြင်းလဲ မြန်မြန် ချိန်
        - hypothesis — ဘာကြောင့်လဲ ယူဆချက်၊ owner က မှားကြောင်း သက်သေပြဖို့ ကြိုးစား
        - mitigation — အကြောင်းရင်း မသိခင် user ကို အရင် အဆင်ပြေအောင်
        - စောင့်ကြည့်ချိန် — fix ပြီးတာနဲ့ မပိတ်ဘဲ တည်ငြိမ်လား ခဏ စောင့်ကြည့်
        - outcome bias — ရလဒ် ဆိုးလို့ ဆုံးဖြတ်ချက်ကိုပါ ဆိုးတယ်လို့ ထင်မိတာ

        မေးခွန်း: engineer နှစ်ယောက်က မတူတဲ့ fix တွေကို တစ်ပြိုင်နက် ထည့်ချင်တယ်။ စည်းမျဉ်းက ဘာလဲ?
