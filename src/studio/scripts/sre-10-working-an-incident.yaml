# SRE from zero, lesson 10: Working an incident (Burmese concept lesson).
#
# Built from the approved voice script
# docs/sre-course/voice-scripts/sre-10-working-an-incident.md. Every spoken
# character is that script's "> " lines, unchanged; each ⟪…⟫ marker became a
# [[mark:…]] at the same place. Check it with:
#   bun ~/Documents/sre-course/work/check-narration.ts \
#     docs/sre-course/voice-scripts/sre-10-working-an-incident.md \
#     src/studio/scripts/sre-10-working-an-incident.yaml
#
# Nothing runs: deck pages and the whiteboard carry the lesson, and notes.md is
# the recap. The workspace and runtime follow the validated no-code skeleton
# (WebContainer, empty init command, a harmless dev script).
#
# Five marks add no spoken text and sit at an existing ။ or ၊:
# b1-s1b draws the first two timeline ticks as "6:40" is said (the board opens
# on the bare axis while the first sentence gives the answer); b2-s1b draws the
# three hypothesis cards right after the ၊ that introduces them, so board B2's
# first step adds the IC alone and the cards land as they are named (at most
# three new elements per step); b2-s3b strikes the second hypothesis when the
# narration reaches the database check (B3 step 3 is likewise split in two,
# by an offset on b3-s3, so its two flows land as each is named); p03b-split
# and p03c-split only split a dialog that would pass 450 characters (no action
# uses them). The voice
# script's ⟪select မေးခွန်း⟫ became ask-question: it already starts the
# question's own dialog, so the question-line select hangs off it for the
# ⟪pause 3s⟫, as in Module 1.
#
# No page or board step holds longer than ~34 s at 70 ms/char, so the lesson
# needs no pacing pages beyond the voice script's own.
#
# Boards (B1 P8 timeline, B2 P2 comb downward, B3 P6 lanes). Colour jobs:
# #1e1e1e ink (paints white) for the axis, arrows, the bus, tick times and
# the neutral hypothesis cards; blue the person named (IC, Ko Min); green
# healthy or done; red failure; orange the threshold (the burn-rate page) or
# the caveat (the banner over marketing's objection); violet the result of a
# redirect. A label on two lines is two text assets, one per line, so each
# line meets the 0.55 em width rule on its own. Every label was also measured
# in Chrome with the Virgil font and is narrower than its box.
#
# Deck pages: deck "Next Editor · SRE 3 · Respond and learn", published at the
# /pub URL below. Until this lesson's pages are built into it, the Director
# reports page l10_p01 missing from the deck; that error is expected until
# then. Page plan:
# ~/Documents/sre-course/work/pages/sre-10-working-an-incident.json
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/sre-10-working-an-incident.yaml
#   bun scripts/studio-compile-check.ts src/studio/scripts/sre-10-working-an-incident.yaml
