        upsertIds: [l10-b2-ok, l10-b2-a4, l10-b2-fix, l10-b2-fix-t1, l10-b2-fix-t2]
        drawMs: 2000

  - id: mitigate-first
    chapter: User ကို အရင် အဆင်ပြေအောင်
    narration: >
      [[mark:close-b2]] [[mark:show-p03]] Operator A ဘာကြောင့် နှေးလဲ မသိသေးဘဲ backup endpoint ဆီ လွှဲလိုက်သလို အကြောင်းရင်း မသိခင် user ထိခိုက်မှုကို ရပ်အောင် ဒါမှမဟုတ် လျှော့အောင် လုပ်တာက mitigation ပါ။ user ကို အရင် အဆင်ပြေအောင် လုပ်ရပါတယ်၊ တစ်စိတ်တစ်ပိုင်း သက်သာတာတောင် ကောင်းပါတယ်။
      ဒီညပြီးတော့ Padauk က ဘယ်ပြဿနာမှာမဆို သုံးလို့ရတဲ့ fix စာရင်းကို ရေးထားပါတယ်၊ rollback၊ capacity တိုးတာ၊ restart လုပ်တာ၊ traffic လွှဲတာ၊ feature ပိတ်တာနဲ့ provider ပြောင်းတာပါ။
      [[mark:show-p03b]] fix တိုင်းက စမ်းသပ်ချက်လည်း ဖြစ်ပါတယ်။ ဒီညက rollback က user ကို မကယ်နိုင်ပေမဲ့ release ကို သံသယ စာရင်းက ဖယ်ပေးခဲ့ပါတယ်၊ version အဟောင်းက data အသစ်ကို ဖတ်နိုင်လို့သာ လုပ်လို့ရခဲ့တာပါ။ အဲဒါကို အချိန်ဖြုန်းတာလို့ ပြောရင် ရလဒ် ဆိုးလို့ ဆုံးဖြတ်ချက်ကိုပါ ဆိုးတယ်လို့ ထင်မိတဲ့ outcome bias ပါ၊ အဲဒီတုန်းက သိတာနဲ့ ချိန်ရင် ဆီလျော်ပါတယ်။
      [[mark:p03b-split]] ဆီလျော်တဲ့ fix က ပိုဆိုးသွားလို့ အပြစ်ပေးရင် လူတွေ ချီတုံချတုံ ဖြစ်လာမှာပါ၊ ဘာမှ မလုပ်ဘဲ စောင့်တာလည်း ကုန်ကျစရိတ် ရှိတဲ့ ရွေးချယ်မှုပါ။
      [[mark:show-p03c]] ဒါဆို incident ကို ဘယ်တော့ ပိတ်မလဲ? fix ပြီးတာနဲ့ မပိတ်ဘဲ စောင့်ကြည့်ချိန် ထားပြီး တည်ငြိမ်ရဲ့လား ခဏ ကြည့်ရပါတယ်။ ကျန်တဲ့ အလုပ်ကို ပုံမှန် အလုပ်ချိန်ထဲ လုပ်လို့ရပြီလား၊ မှားတဲ့ ပြောင်းလဲမှုကို rollback လုပ်ပြီး ပြန်မဝင်အောင် တားထားပြီလား၊ ဘာကြောင့်လဲ သိပြီး ထပ်မဖြစ်တော့ဘူးလား၊ အဲဒီထဲက တစ်ခု ဟုတ်ရင် ပိတ်လို့ရပါတယ်။
      [[mark:p03c-split]] ဒီညက ပထမ တစ်ခုပါ၊ ပင်မ endpoint ကို ပြန်သုံးဖို့ အပြီးတိုင် ပြင်တဲ့ resolution ကို နောက်နေ့ လုပ်နိုင်လို့ ပိတ်ကြောင်း channel တိုင်းမှာ ကြေညာပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Google SRE Incident Management Guide (sre.google)",
