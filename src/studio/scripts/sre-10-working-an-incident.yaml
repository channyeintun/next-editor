  - id: eats-call
    chapter: လူ 25 ယောက်ရဲ့ call
    narration: >
      [[mark:close-p03c]] [[mark:b3-s1]] အဲဒီ လထဲမှာပဲ Padauk Eats မှာ နေ့လယ်စာချိန် order တင်မရတဲ့ outage ဖြစ်တော့ incident call ထဲကို လူ ၂၅ ယောက် ရောက်လာပါတယ်။ marketing က ဘယ်တော့ ပြီးမလဲလို့ ခဏခဏ မေးနေပြီး senior developer တစ်ယောက်ကလည်း dispatch service ကို ပြန်ရေးရမယ်လို့ ငြင်းနေပါတယ်။
      [[mark:b3-s2]] Eats အဖွဲ့က အလယ်အလတ်အဆင့် engineer ဖြစ်တဲ့ incident commander က communications lead ကို ခန့်ပြီး update တွေကို channel တစ်ခုတည်းမှာ တင်ခိုင်းပါတယ်၊ call ထဲမှာတော့ operations lead နဲ့ ကျွမ်းကျင်သူ သုံးယောက်ပဲ ချန်ထားပါတယ်။
      [[mark:b3-s3]] redesign အကြံကို incident ပြီးမှ လုပ်မယ့် postmortem စာရင်းထဲ မှတ်ခိုင်းပြီး အခြေခံ မေးခွန်းတွေကို doc တွေဆီ လမ်းညွှန်ပါတယ်။ incident commander က ရာထူး မရွေး ဦးဆောင်တာမို့ senior တွေကလည်း လိုက်နာကြပါတယ်။ [[mark:b3-s4]] ကျန်တဲ့ လူတွေကိုတော့ ကျေးဇူးတင်ပြီး လွှတ်ပေးပါတယ်၊ လိုရင် chat ထဲမှာ နာမည် တပ်ရုံ မဟုတ်ဘဲ page ပို့ပြီး ခေါ်မှာပါ။
      [[mark:b3-s5]] incident commander ကိုယ်တိုင် ဝင်မပြင်ဘဲ ညှိတာကိုပဲ လုပ်ပါတယ်။ promo banner ကြောင့် တိုးလာတဲ့ traffic က database ကို ဝန်ပိနေတာ တွေ့တော့ ပြဿနာက dispatch မဟုတ်ဘူး ဆိုတာ အားလုံး ကြားအောင် ပြောပြီး marketing ကန့်ကွက်ပေမဲ့ banner ကို ပိတ်ခိုင်းလိုက်ပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "PagerDuty Incident Response docs: Different Roles",
          url: "https://response.pagerduty.com/before/different_roles/",
        }
      - {
          title: "SRE book, 1st ed: Managing Incidents",
          url: "https://sre.google/sre-book/managing-incidents/",
        }
    actions:
      - { id: close-p03c, type: slide.close, at: { mark: close-p03c, offsetMs: -400 } }
      - {
          id: b3-s1,
          type: whiteboard.apply,
          at: { mark: b3-s1 },
          open: true,
          clear: true,
          upsertIds: [l10-b3-call, l10-b3-call-t1, l10-b3-call-t2],
          drawMs: 1200,
        }
      - {
          id: b3-s2,
          type: whiteboard.apply,
          at: { mark: b3-s2 },
          upsertIds: [l10-b3-a1, l10-b3-core, l10-b3-core-t1, l10-b3-core-t2],
          drawMs: 1600,
        }
      # Step 3 in two, so no apply adds more than three labels: the redesign
      # flow lands at the mark, and the basic-questions flow lands as the
      # sentence reaches "အခြေခံ မေးခွန်း" (77 characters in). That sentence
      # has no ၊ to carry a mark of its own, so the second half hangs off b3-s3
      # with an offset: by the compiler's word estimate it lands on the words at
      # 70 ms/char, ~1.1 s after them at 55 and ~1.7 s before them at 95.
      - {
          id: b3-s3,
          type: whiteboard.apply,
          at: { mark: b3-s3 },
          upsertIds: [l10-b3-m1, l10-b3-m1-a, l10-b3-m1-to],
          drawMs: 1200,
        }
      - {
          id: b3-s3b,
          type: whiteboard.apply,
          at: { mark: b3-s3, offsetMs: 5000 },
          upsertIds: [l10-b3-m2, l10-b3-m2-a, l10-b3-m2-to],
          drawMs: 1200,
        }
      - {
          id: b3-s4,
          type: whiteboard.apply,
          at: { mark: b3-s4 },
          upsertIds: [l10-b3-rest, l10-b3-rest-a, l10-b3-rest-to],
          drawMs: 1200,
        }
      - {
          id: b3-s5,
          type: whiteboard.apply,
          at: { mark: b3-s5 },
          upsertIds: [l10-b3-promo-t1, l10-b3-promo-t2],
          drawMs: 1000,
        }

  - id: drill-card
    chapter: Padauk ရဲ့ drill card
    narration: >
      [[mark:close-b3]] [[mark:show-p04]] ဒီ incident နှစ်ခုကနေ Padauk က စည်းမျဉ်း သုံးခု ပါတဲ့ drill card လေး တစ်ခု ထုတ်ပါတယ်။ ပထမက နာမည်နဲ့ အချိန် တပ်ပြီး ခိုင်းဖို့ပါ၊ ဘယ်သူ ကြည့်ပေးမလဲလို့ မေးရင် lesson ၉ က bystander effect လို လူတိုင်း တခြားသူကို စောင့်နေကြလို့ပါ။ ခိုင်းခံရသူကလည်း မရှင်းရင် မေးရဲရပါမယ်။ ဒုတိယက redesign စကားကို postmortem အထိ ချန်ထားဖို့၊ တတိယက မလိုတော့တဲ့ လူကို အသံထွက်ပြီး လွှတ်ပေးဖို့ပါ။
      [[mark:show-p04b]] system တစ်ခုလုံးကို မြင်တာ၊ အချက် မစုံခင် ဆုံးဖြတ်ရဲတာ၊ နာမည်နဲ့ ရှင်းရှင်း ခိုင်းတာ၊ ဖိအားအောက်မှာ စိတ်ငြိမ်တာ ဆိုတဲ့ စွမ်းရည်တွေက မွေးရာပါ မဟုတ်ဘဲ လေ့ကျင့်လို့ရပါတယ်။ ဒါကြောင့် Padauk က လတိုင်း မိနစ် ၃၀ ကြာ incident ဟောင်း တစ်ခုကို ပြန်သရုပ်ဆောင်တဲ့ role-play လုပ်ပြီး အတွေ့အကြုံ ရှိသူတွေက ဘာကြောင့် ဒီလို ဆုံးဖြတ်လဲ အသံထွက် တွေးပြပါတယ်။
      [[mark:show-p04c]] tool အသစ် မဝယ်ခင် ယဉ်ကျေးမှုနဲ့ role တွေကို အရင် ခိုင်မာအောင် လုပ်ပါ၊ အပြစ်တင်ခံရမှာ ကြောက်တဲ့ အဖွဲ့က ဘယ် tool နဲ့မဆို အမှားကို ဖုံးထားကြမှာပါ။ role ရှင်းပြီး လေ့ကျင့်ထားတဲ့ အဖွဲ့က အလောတကြီး မလုပ်ဘဲ incident ကို ပိုမြန်မြန် ပြီးစေပါတယ်။ incident ပိတ်လိုက်ပေမဲ့ loop ရဲ့ နောက်တစ်ဆင့်၊ သင်ယူတာ ကျန်ပါသေးတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Workbook: Incident Response",
