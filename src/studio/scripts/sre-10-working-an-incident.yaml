  - id: this-week
    narration: >
      [[mark:show-p05]] နောက် incident မတိုင်ခင် ဒီအပတ် လုပ်ထားစရာ သုံးခုပါ။ ကိုယ့် service အတွက် ဘယ်ပြဿနာမှာမဆို သုံးလို့ရတဲ့ fix စာရင်းကို ရေးထားပါ။ incident ဟောင်း တစ်ခုကို အဖွဲ့လိုက် role-play လုပ်ကြည့်ပါ။ ပြီးတော့ ကိုမင်း၊ ဒါကို ၇ နာရီမှာ စစ်ပြီး ပြန်ပြောပါ ဆိုသလို ခိုင်းတာကို လေ့ကျင့်ပါ။
    sources:
