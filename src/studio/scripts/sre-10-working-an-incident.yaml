  - id: recap
    narration: >
      [[mark:close-p05]] [[mark:open-notes]] အဲဒီ ၄၅ မိနစ်ကို ချုံ့ကြည့်ရအောင်။ [[mark:sel-triage]] triage က user တွေ ဘာ ခံစားနေရလဲကနေ ပြဿနာ ဘယ်လောက် ပြင်းလဲ မြန်မြန် ချိန်တာပါ။ [[mark:sel-hypothesis]] hypothesis က ဘာကြောင့်လဲ ဆိုတဲ့ ယူဆချက်ဖြစ်ပြီး owner တစ်ယောက်က မှားကြောင်း သက်သေပြဖို့ ကြိုးစားရပါတယ်။
      [[mark:sel-mitigation]] mitigation က အကြောင်းရင်း မသိခင် user တွေကို အရင် အဆင်ပြေအောင် လုပ်တာပါ။ [[mark:sel-watch]] စောင့်ကြည့်ချိန်က fix ပြီးတာနဲ့ မပိတ်ဘဲ တည်ငြိမ်ရဲ့လား ခဏ စောင့်ကြည့်တာဖြစ်ပြီး၊ [[mark:sel-outcome]] outcome bias ကတော့ ရလဒ် ဆိုးလို့ ဆုံးဖြတ်ချက်ကိုပါ ဆိုးတယ်လို့ ထင်မိတာပါ။
      [[mark:ask-question]] ဒါဆို incident တစ်ခုအတွင်း engineer နှစ်ယောက်က မတူတဲ့ fix တွေကို တစ်ချိန်တည်း production ထဲ ထည့်ချင်နေရင် စည်းမျဉ်းက ဘာလဲ?
      [[mark:pause-question]] operations lead ကနေ တစ်ကြိမ်မှာ ပြောင်းလဲမှု တစ်ခုပဲ ထည့်ရပါမယ်။ တစ်ပတ်အကြာ promotion တစ်ခုအတွင်း Wallet က user တချို့ဆီက ငွေ နှစ်ခါ ဖြတ်မိသွားပါတယ်။ code အပြောင်းအလဲကို ရေးခဲ့တဲ့သူကို အပြစ်မရှာဘဲ ဒီ incident ကနေ ဘာ သင်ခန်းစာ ယူမလဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book, 1st ed: Managing Incidents",
          url: "https://sre.google/sre-book/managing-incidents/",
        }
      - { title: "OODA loop (Wikipedia)", url: "https://en.wikipedia.org/wiki/OODA_loop" }
    actions:
      - { id: close-p05, type: slide.close, at: { mark: close-p05 } }
      - {
          id: open-notes,
          type: workspace.openFile,
          at: { mark: open-notes, offsetMs: 300 },
          path: notes.md,
        }
      - {
          id: sel-triage,
          type: editor.select,
          at: { mark: sel-triage },
          target: { file: notes.md, text: "triage", occurrence: 1 },
        }
      - {
          id: sel-hypothesis,
          type: editor.select,
          at: { mark: sel-hypothesis },
          target: { file: notes.md, text: "hypothesis", occurrence: 1 },
        }
      - {
          id: sel-mitigation,
          type: editor.select,
          at: { mark: sel-mitigation },
          target: { file: notes.md, text: "mitigation", occurrence: 1 },
        }
      - {
          id: sel-watch,
          type: editor.select,
          at: { mark: sel-watch },
          target: { file: notes.md, text: "စောင့်ကြည့်ချိန်", occurrence: 1 },
        }
      - {
          id: sel-outcome,
          type: editor.select,
          at: { mark: sel-outcome },
          target: { file: notes.md, text: "outcome bias", occurrence: 1 },
        }
      # The voice script's ⟪select မေးခွန်း⟫ and ⟪pause 3s⟫, the way the Module 1
      # reviewers fixed the pause. The ⟪select မေးခွန်း⟫ mark (ask-question) already
      # starts the question's own dialog, but a select right there would drag
      # under the question and leave no pause, and one at pause-question would
      # drag under the answer's first words (the scheduler holds only the dialog
      # after its anchor's). So the question-line select hangs off ask-question
      # with an offset of about the question's length: it starts about as the
      # question ends, its drag runs in silence, and the answer at
      # pause-question waits for it. The question is 122 characters with no ၊
      # to split at, so the quiet depends on the voice's speed: 8450 leaves
      # about 2.8 / 1.0 / 0.35 s before the answer at 55 / 70 / 95 ms per char
      # (at 95 the drag starts under the question's last words, as in lesson 7);
      # an offset above ~8480 trips compile-check's 2.5 s inserted-silence
      # warning at 55.
      - id: select-question
        type: editor.select
        at: { mark: ask-question, offsetMs: 8450 }
        target:
          file: notes.md
          text: "မေးခွန်း: engineer နှစ်ယောက်က မတူတဲ့ fix တွေကို တစ်ပြိုင်နက် ထည့်ချင်တယ်။ စည်းမျဉ်းက ဘာလဲ?"
          occurrence: 1

checks:
  # 500, not 300: google-svg deck pages stall the main thread at show/close.
  - { type: timing.p95Ms, max: 500 }
