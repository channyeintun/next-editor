          type: whiteboard.apply,
          at: { mark: b2-s1 },
          open: true,
          clear: true,
          upsertIds: [l10-b2-ic, l10-b2-ic-t, l10-b2-ic-a, l10-b2-bus],
        }
      - id: b2-s1b
        type: whiteboard.apply
        at: { mark: b2-s1b }
