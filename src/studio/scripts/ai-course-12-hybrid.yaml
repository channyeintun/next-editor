        text: "အလုပ်ကို နေရာ 2 ခု ခွဲပေးတာ",
        strokeColor: "#2f9e44",
        fontSize: 36,
      }
    - {
        id: z-a-n1,
        kind: text,
        x: 300,
        y: 462,
        width: 700,
        height: 40,
        text: "လွယ်တာ → page ထဲ · မြန်၊ ငွေမကုန်",
        strokeColor: "#6741d9",
        fontSize: 28,
      }
    - {
        id: z-a-n2,
        kind: text,
        x: 300,
        y: 510,
        width: 700,
        height: 40,
        text: "ခက်တာ → server · စွမ်းအား",
        strokeColor: "#6741d9",
        fontSize: 28,
      }
build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 5112
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "Assistant အတွက် platform ရွေးရအောင်"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ platform လေးမျိုးကို criteria တွေနဲ့ ယှဉ်ကြည့်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့
      customer မေးခွန်းတွေကို ဖြေပေးမယ့် assistant အတွက် platform တစ်ခု တကယ် ရွေးပြီး၊ client side နဲ့ server
      side ကို တွဲသုံးတဲ့ hybrid AI ဖြစ်အောင် လုပ်ကြည့်ပါမယ်။ [[mark:draw-mini]] blueprint မှာ ဒီနေ့ လုပ်မှာက
      Solution ထဲက intelligence အလွှာပါ။ [[mark:draw-today]] model ကို ဘယ်မှာ run မလဲ၊ မေးခွန်း တစ်ခုကို ဘယ်
      model ဆီ ပို့မလဲ ဆိုတာ ဒီ အလွှာမှာ ဆုံးဖြတ်ရလို့ပါ။
    sources:
      - {
          title: "web.dev Learn AI: Choose your platform",
          url: "https://web.dev/learn/ai/platform",
        }
      - {
          title: "web.dev Learn AI: Introduction to AI on the web (the blueprint)",
          url: "https://web.dev/learn/ai/introduction",
        }
      - {
          title: "web.dev Learn AI: Welcome to Learn AI! (course credit: written by Dr. Janna Lipenkova with editorial guidance from Alexandra Klepper; text CC BY 4.0, code Apache 2.0; adapted into Burmese with the course's own tea-shop examples)",
          url: "https://web.dev/learn/ai/welcome",
        }
      - {
          title: "Creative Commons: Attribution 4.0 International (CC BY 4.0), the licence of the web.dev Learn AI text adapted here",
          url: "https://creativecommons.org/licenses/by/4.0/",
        }
    actions:
      - {
          id: open-board-a,
          type: whiteboard.apply,
          at: { scene: start, offsetMs: -450 },
          open: true,
          clear: true,
          upsertIds: [a-title],
        }
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - {
          id: draw-mini,
          type: whiteboard.apply,
          at: { mark: draw-mini },
          upsertIds:
            [
              a-opp,
              a-opp-t,
              a-arrow-1,
              a-data,
              a-data-t,
              a-intel,
              a-intel-t,
              a-ux,
              a-ux-t,
              a-arrow-2,
              a-gov,
              a-gov-t,
            ],
          drawMs: 2400,
        }
      - {
          id: draw-today,
          type: whiteboard.apply,
          at: { mark: draw-today },
          upsertIds: [a-today],
          drawMs: 1000,
        }

  - id: analysis
    narration: >
      [[mark:draw-r]] ဆိုင်ပိတ်ချိန်မှာလည်း customer မေးတာကို ဖြေပေးနိုင်အောင် assistant တစ်ခု ထည့်ချင်ပါတယ်။ use
      case က ဘာလိုလဲ၊ ဆိုင်နဲ့ team ဘက်က ဘာ ကန့်သတ်ချက် ရှိလဲ ဆိုတာကို အရင် ကြည့်ပါမယ်။
      [[mark:draw-r1]] customer တွေက အော်ဒါ၊ delivery၊ အစားအသောက် အကြောင်း အမျိုးမျိုး မေးကြလို့ model ရဲ့
      စွမ်းရည်နဲ့ မှန်ကန်မှု အရေးကြီးပြီး LLM တစ်ခု လိုပါတယ်။ [[mark:draw-r2]] အဖြေတွေက ဆိုင်ရဲ့ ကိုယ်ပိုင်
      အချက်တွေနဲ့ ကိုက်ရပေမယ့် model ကို fine tune လုပ်စရာ မလိုပါဘူး။ RAG နဲ့ ဆိုင်ရဲ့ အချက်တွေထဲက
      သက်ဆိုင်တာကို ရှာပြီး request တိုင်းမှာ prompt ထဲ ထည့်ပေးရင် ရပါတယ်။ [[mark:draw-r3]] ကန့်သတ်ချက် ဘက်မှာ
      customer အများစုက ဖုန်းနဲ့ မှာကြလို့ device တိုင်းမှာ အလုပ်လုပ်ရပါမယ်။ [[mark:draw-r4]] ဆိုင်မှာ developer က
      ကိုယ် တစ်ယောက်တည်းပါ။ launch လုပ်ပြီးရင် တခြား feature တွေကို ဆက်လုပ်ရမှာမို့၊ ထိန်းသိမ်းရ လွယ်ပြီး ML
      ကျွမ်းကျင်မှု သိပ် မလိုတဲ့ နည်း ဖြစ်ရပါမယ်။ [[mark:draw-win]] ဒါတွေကို ပြီးခဲ့တဲ့ lesson ရဲ့ ဇယားနဲ့
      တိုက်ကြည့်ရင်၊ model စွမ်းရည်နဲ့ compatibility မှာ server side က နိုင်ပါတယ်။ server side ထဲမှာဆိုရင်
      ထိန်းသိမ်းရတာနဲ့ developer အဆင်ပြေတာမှာ managed service က နိုင်ပါတယ်။ စိတ်ကြိုက် ပြင်လို့ ရတာမှာတော့
      self hosted model က နိုင်ပေမယ့်၊ ဆိုင်ရဲ့ အချက်တွေကို prompt နဲ့ ပေးလို့ ရတာမို့ အဲဒီ အားသာချက်ကို
      လက်လွှတ်လို့ ရပါတယ်။ ဒါကြောင့် RAG နဲ့ တွဲထားတဲ့ managed service ကို စရွေးပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Choose your platform (analyze trade-offs)",
          url: "https://web.dev/learn/ai/platform",
        }
    actions:
      - {
          id: draw-r,
          type: whiteboard.apply,
          at: { mark: draw-r },
          clear: true,
          upsertIds: [r-title],
        }
      - {
          id: draw-r1,
          type: whiteboard.apply,
          at: { mark: draw-r1 },
          upsertIds: [r1-l, r1-a, r1-r],
          drawMs: 1500,
        }
      - {
          id: draw-r2,
          type: whiteboard.apply,
          at: { mark: draw-r2 },
          upsertIds: [r2-l, r2-a, r2-r],
          drawMs: 1500,
        }
      - {
          id: draw-r3,
          type: whiteboard.apply,
          at: { mark: draw-r3 },
          upsertIds: [r3-l, r3-a, r3-r],
          drawMs: 1500,
        }
      - {
          id: draw-r4,
          type: whiteboard.apply,
          at: { mark: draw-r4 },
          upsertIds: [r4-l, r4-a, r4-r, r5-l, r5-a, r5-r],
          drawMs: 2200,
        }
      - {
          id: draw-win,
          type: whiteboard.apply,
          at: { mark: draw-win },
          upsertIds: [r-win],
          drawMs: 1600,
        }

  - id: logs
    chapter: "Launch ပြီးနောက် log ကို ကြည့်ရအောင်"
    narration: >
      [[mark:close-r]] launch လုပ်ပြီး လအနည်းငယ် ကြာတော့ ဘာတွေ တွေ့ရလဲ ကြည့်ရအောင်။ [[mark:panel-ready]] ညာဘက်
      AI panel မှာ ပြီးခဲ့တဲ့လ customer message တွေကို ရေတွက်ထားပါတယ်။ ဒီ message တွေက lesson အတွက်
      ပြင်ဆင်ထားတဲ့ နမူနာ data ပါ။ [[mark:read-logs]] Messages card ရဲ့ ပထမ တန်းမှာ message ၃၄ ခုထဲက ၂၆ ခုက routine
      ဆိုတဲ့ ပုံမှန် မေးခွန်းပါ။ ဆိုင် ဖွင့်ချိန်၊ delivery ခ၊ ဈေးနှုန်း လို FAQ မှာ အဖြေ ရှိပြီးသား မေးခွန်းတွေ ဖြစ်လို့၊
      managed service ဆီ ပို့တိုင်း ငွေကုန်ပြီး customer လည်း network ကို ဖြတ်ပြီး အဖြေကို စောင့်ရပါတယ်။ ငွေ
      နှစ်ခါ ဖြတ်တာ၊ အစားအသောက် မတည့်တာ လို complex ဆိုတဲ့ ခက်တဲ့ မေးခွန်းက ၈ ခုပဲ ရှိပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Choose your platform (spot opportunities for hybrid AI)",
          url: "https://web.dev/learn/ai/platform",
        }
    actions:
      - { id: close-r, type: whiteboard.apply, at: { mark: close-r }, open: false }
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-done
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: ai-status }
        attribute: { name: data-state, value: "done" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-four-cards
        type: expect.preview
        at: { afterAction: expect-done }
        timeoutMs: 5000
        target: { by: testId, value: ai-cards }
        attribute: { name: data-count, value: "4" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-logs-34
        type: expect.preview
        at: { mark: read-logs }
        timeoutMs: 5000
        target: { by: testId, value: ai-test-1 }
        attribute: { name: data-value, value: "34" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-logs-26
        type: expect.preview
        at: { afterAction: expect-logs-34 }
        timeoutMs: 5000
        target: { by: testId, value: ai-test-2 }
        attribute: { name: data-value, value: "26" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-logs-8
        type: expect.preview
        at: { afterAction: expect-logs-26 }
        timeoutMs: 5000
        target: { by: testId, value: ai-test-3 }
        attribute: { name: data-value, value: "8" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: hybrid
    chapter: "Hybrid AI ဆိုတာ"
    narration: >
      [[mark:draw-h]] ဒီလို အခြေအနေမှာ hybrid AI က အသုံးဝင်ပါတယ်။ hybrid AI ဆိုတာ client side နဲ့ server
      side ကို တွဲပြီး အလုပ်ခွဲပေးတာပါ။ [[mark:draw-h1]] မေးခွန်း တစ်ခု ဝင်လာရင် browser ထဲက router ဆိုတဲ့
      model သေးလေးက ပုံမှန်လား ခက်လား အရင် ခွဲပါတယ်။ [[mark:draw-h2]] message ရဲ့ ၇၆ ရာခိုင်နှုန်းလောက်က
      ပုံမှန် မေးခွန်းတွေမို့၊ FAQ ထဲက အဖြေနဲ့ page ထဲမှာတင် ဖြေရင် မြန်ပြီး ငွေလည်း မကုန်ပါဘူး။ [[mark:draw-h3]] ခက်တာ၊ ရှားတာ၊ မရှင်းတာကိုတော့ server ပေါ်က
      ပိုစွမ်းတဲ့ model ဆီ ပို့ပါတယ်။ default က client side ဖြစ်ပြီး လိုမှပဲ server ကို သုံးလို့၊ ကုန်ကျစရိတ်ရော
      latency ပါ လျော့ပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Choose your platform (hybrid AI)",
          url: "https://web.dev/learn/ai/platform",
        }
    actions:
      - {
          id: draw-h,
          type: whiteboard.apply,
          at: { mark: draw-h },
          open: true,
          clear: true,
          upsertIds: [h-title],
        }
      - {
          id: draw-h1,
          type: whiteboard.apply,
          at: { mark: draw-h1 },
          upsertIds: [h-q, h-q-t1, h-q-t2, h-a1, h-router, h-router-t1, h-router-t2],
          drawMs: 2400,
        }
      - {
          id: draw-h2,
          type: whiteboard.apply,
          at: { mark: draw-h2 },
          upsertIds: [h-a2, h-faq, h-faq-t1, h-faq-t2, h-faq-n],
          drawMs: 1800,
        }
      - {
          id: draw-h3,
          type: whiteboard.apply,
          at: { mark: draw-h3 },
          upsertIds: [h-a3, h-server, h-server-t1, h-server-t2, h-server-n],
          drawMs: 1800,
        }

  - id: router
    narration: >
      [[mark:close-h]] code ထဲမှာ ကြည့်ရအောင်။ [[mark:sel-train]] ဒီ router ကို ပြီးခဲ့တဲ့လ message ၂၄ ခုနဲ့
      train လုပ်ထားပါတယ်။ ဒီ lesson အတွက် ရေးထားတဲ့ model သေးသေးလေး ဖြစ်ပြီး၊ ဒီ page ထဲမှာပဲ train
      လုပ်တာပါ။ [[mark:sel-route]] route function က ပုံမှန် မေးခွန်း ဖြစ်နိုင်ခြေ ၅၀ ရာခိုင်နှုန်းနဲ့ အထက်ဆိုရင် ဒီ
      page ထဲမှာ ဖြေပြီး၊ မဟုတ်ရင် server ကို ပို့ပါတယ်။ [[mark:read-test]] ဒုတိယ တန်းမှာတော့ model
      မမြင်ဖူးတဲ့ message ၁၀ ခုထဲက ၈ ခုကို မှန်မှန် ပို့ထားပါတယ်။ [[mark:read-mistakes]] Mistakes card က မှားတဲ့
      နှစ်ခုကို ပြပါတယ်။ ဆိုင်လိပ်စာ တောင်းတာက ပုံမှန် မေးခွန်း ဖြစ်ပေမယ့် server ကို ရောက်သွားလို့ ကုန်ကျစရိတ်
      နည်းနည်း ပိုရုံပါ။ နို့ မတည့်တဲ့ customer ရဲ့ မေးခွန်းကို page ထဲမှာ ဖြေဖို့ ပို့ထားတာကတော့ ပိုဆိုးပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Choose your platform (distribute the workload)",
          url: "https://web.dev/learn/ai/platform",
        }
    actions:
      - { id: close-h, type: whiteboard.apply, at: { mark: close-h }, open: false }
      - id: sel-train
        type: editor.select
        at: { mark: sel-train }
        target:
          {
            file: src/main.js,
            text: "const router = trainNaiveBayes(train.map((m) => ({ text: m.text, label: m.route })));",
            occurrence: 1,
          }
      - id: sel-route
        type: editor.select
        at: { mark: sel-route }
        target:
          { file: src/main.js, text: '  return routine >= 0.5 ? "here" : "server";', occurrence: 1 }
      - id: expect-test-10
        type: expect.preview
        at: { mark: read-test }
        timeoutMs: 5000
        target: { by: testId, value: ai-test-5 }
        attribute: { name: data-value, value: "10" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-test-8
        type: expect.preview
        at: { afterAction: expect-test-10 }
        timeoutMs: 5000
        target: { by: testId, value: ai-test-6 }
        attribute: { name: data-value, value: "8" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-mistakes-2
        type: expect.preview
        at: { mark: read-mistakes }
        timeoutMs: 5000
        target: { by: testId, value: ai-mistakes }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-mistake-address
        type: expect.preview
        at: { afterAction: expect-mistakes-2 }
        timeoutMs: 5000
        target: { by: testId, value: ai-mistakes-1 }
        textContains: "ဆိုင်လိပ်စာ ပို့ပေးပါroutineserver"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-mistake-milk
        type: expect.preview
        at: { afterAction: expect-mistake-address }
        timeoutMs: 5000
        target: { by: testId, value: ai-mistakes-2 }
        textContains: "complexhere"
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: ask
    narration: >
      [[mark:read-buttons]] panel အပေါ်က ခလုတ်တွေက customer မေးခွန်း သုံးခုပါ။ တစ်ခု နှိပ်လိုက်ရင် program က
      အဲဒီ မေးခွန်းကို route လုပ်ပါတယ်။ အခုတော့ ဆိုင် ဖွင့်ချိန် မေးခွန်းကို ရွေးထားပါတယ်။ [[mark:read-here]] Route card မှာ
      ပုံမှန် မေးခွန်း ဖြစ်နိုင်ခြေ ၉၉ ရာခိုင်နှုန်း ရှိလို့ page ထဲမှာပဲ ဖြေပါတယ်။ FAQ ထဲက ဘယ် အဖြေနဲ့ ကိုက်လဲကို
      ဒီ page ထဲက နောက်ထပ် model သေးလေး တစ်ခုက ရွေးပေမယ့်၊ အဖြေ စာကတော့ ဆိုင်က ရေးထားတာမို့ badge က AI
      မပါဘူးလို့ ပြနေပါတယ်။ [[mark:click-charge]] ရွှေ member အောင်အောင် ရေးတဲ့ ငွေ နှစ်ခါ ဖြတ်သွားတယ် ဆိုတာကို
      နှိပ်ကြည့်ပါမယ်။ [[mark:read-server]] ပုံမှန် ဖြစ်နိုင်ခြေ ၂ ရာခိုင်နှုန်းပဲ ရှိလို့ server ကို ပို့ပါတယ်။ ဒီ lesson
      ရဲ့ server ဘက် အဖြေတွေက open model သေးသေးလေး တစ်ခုကို ဆိုင်ရဲ့ အချက်တွေ ပါတဲ့ prompt နဲ့ ကြိုပြီး run
      ထားတုန်းက တကယ် ထွက်လာခဲ့တဲ့ အဖြေတွေပါ။ managed service ရဲ့ model ကြီး မဟုတ်ဘဲ၊ ဆိုင်က ကိုယ့် server
      ပေါ်မှာ run နိုင်လောက်တဲ့ model မျိုးပါ။ [[mark:read-answer]] ပထမ စာကြောင်းက ငွေချေနည်းကို ပြန်ပြောနေလို့ မေးတာနဲ့ မဆိုင်ပေမယ့်၊ ဒုတိယ စာကြောင်းက
      ဝန်ထမ်းက စစ်ပြီး ပြန်ဖြေမယ်လို့ ပြောပါတယ်။ server ဘက်က အဖြေကိုလည်း စစ်ဖို့ လိုပါတယ်။ [[mark:click-milk]]
      နို့ မတည့်တဲ့ မေးခွန်းကိုလည်း နှိပ်ကြည့်ရအောင်။ [[mark:read-milk]] router က ပုံမှန် မေးခွန်းလို့ ၉၇
      ရာခိုင်နှုန်း သေချာနေလို့၊ page ထဲမှာပဲ ကြိုမှာလို့ ရတယ် ဆိုတဲ့ FAQ အဖြေကို ပြန်ပေးလိုက်ပါတယ်။ ဒီ customer
      အတွက် မှားပြီး အန္တရာယ်လည်း ရှိပါတယ်။ model သေချာတာနဲ့ အဖြေ မှန်တာ မတူပါဘူး။
