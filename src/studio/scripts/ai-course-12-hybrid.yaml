        timeoutMs: 5000
        target: { by: testId, value: ai-mistakes }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: click-milk-2
        type: preview.click
        at: { mark: click-milk-2 }
