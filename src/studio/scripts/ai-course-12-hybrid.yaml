        textContains: "ကောင်တာက လှလှ ဆီ လွှဲပေးလိုက်ပါပြီ"
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: fallback
    narration: >
      [[mark:draw-f]] server ကို ပို့ရတဲ့ အကြောင်းရင်း နှစ်မျိုး ရှိပါတယ်။ [[mark:draw-f1]] ပထမက capability
      based escalation ပါ။ ငွေ နှစ်ခါ ဖြတ်တာလို page ထဲက model အတွက် ခက်လွန်းတဲ့ မေးခွန်းကို ကြိုသတ်မှတ်ထားတဲ့
      စံနဲ့ server ဆီ လွှဲတာပါ။ [[mark:draw-f2]] နောက်တစ်မျိုးက compatibility based fallback ပါ။ fallback ဆိုတာ တစ်ခု
      မရရင် သုံးဖို့ ပြင်ထားတဲ့ အစားထိုး လမ်းပါ။ customer ရဲ့ ဖုန်းက page ထဲက model ကို run မနိုင်ရင် ပုံမှန်
      မေးခွန်းကိုပါ server ကို ပို့ရပါတယ်။ [[mark:draw-f3]] compatibility အတွက်ပဲ server ကို သုံးမယ်ဆိုရင်
      နှစ်ဘက်မှာ model တစ်ခုတည်းကို သုံးတာ ပိုကောင်းပါတယ်။ အဖြေ ပုံစံ တူပြီး ထိန်းရတာလည်း သက်သာလို့ပါ။
      [[mark:close-f]] ဒါကို code ထဲ ထည့်ကြည့်ရအောင်။ [[mark:type-device]] device က page ထဲက model ကို run
      မနိုင်ရင် server ကို တန်းပို့တဲ့ check ပါ။ panel အပေါ်က device ခလုတ်ကတော့ အဲဒီလို ဖုန်းမျိုးကို စမ်းကြည့်ဖို့ ထည့်ထားတာပါ။
      [[mark:click-device]] local model မရ ဆိုတာကို နှိပ်ပါမယ်။ [[mark:read-fallback]] ဆိုင် ဖွင့်ချိန် မေးခွန်းက
      server ကို ရောက်သွားပြီး၊ page ထဲက model ကို မ run လို့ ဖြစ်နိုင်ခြေလည်း မပြတော့ပါဘူး။ server ဘက်က model
      ပေးခဲ့တဲ့ အဖြေက FAQ ထဲက ဖွင့်ချိန် စာကြောင်းကို စာလုံး မပြောင်းဘဲ ပြန်ကူးထားတာပါ။ customer အတွက် အဖြေ
      အတူတူပဲ ဖြစ်ပေမယ့်၊ ဒီတစ်ခါမှာတော့ server ကုန်ကျစရိတ် ကုန်ပြီး network ကိုလည်း ဖြတ်ရပါတယ်။
    sources:
