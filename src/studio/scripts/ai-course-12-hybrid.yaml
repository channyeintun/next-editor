  - id: cost
    chapter: "Hybrid ရဲ့ ကုန်ကျစရိတ်"
    narration: >
      [[mark:draw-c]] ဒါပေမဲ့ platform နှစ်ခု တွဲသုံးတာမှာ ကုန်ကျစရိတ် ရှိပါတယ်။ [[mark:draw-c1]] request ကို ဘယ်ကို
      ပို့မလဲ၊ မရရင် ဘယ်လို ပြန်ကြိုးစားမလဲ ထိန်းတဲ့ orchestration logic ကို ရေးပြီး ထိန်းရပါတယ်။ ခုနက route
      function က အဲဒီ logic ရဲ့ အစပါ။ [[mark:draw-c2]] model တူရင် version ကိုက်အောင် ထိန်းရပြီး၊ model မတူရင်
      prompt ကို တစ်ခုချင်းအတွက် ရေးရပါတယ်။ [[mark:draw-c3]] log တွေ နှစ်နေရာ ခွဲနေပြီး၊ တိုက်ခိုက်ခံရနိုင်တဲ့
      နေရာလည်း နှစ်ခု ဖြစ်လာပါတယ်။ [[mark:draw-c5]] ဒါကြောင့် team သေးရင်၊ ဒါမှမဟုတ် မဖြစ်မနေ လိုတဲ့ feature
      မဟုတ်ရင် hybrid ကို မလုပ်သေးတာ ပိုကောင်းနိုင်ပါတယ်။ use case နဲ့ ကိုယ့် team ကနေ စပြီး၊ platform က
      product နဲ့အတူ ပြောင်းသွားမယ်လို့ ကြိုမျှော်ထားပါ။
    sources:
      - {
          title: "web.dev Learn AI: Choose your platform (flexibility introduces more complexity, your takeaways)",
          url: "https://web.dev/learn/ai/platform",
        }
    actions:
      - {
          id: draw-c,
          type: whiteboard.apply,
          at: { mark: draw-c },
          open: true,
          clear: true,
          upsertIds: [c-title],
        }
      - {
          id: draw-c1,
          type: whiteboard.apply,
          at: { mark: draw-c1 },
          upsertIds: [c1],
          drawMs: 1200,
        }
      - {
          id: draw-c2,
          type: whiteboard.apply,
          at: { mark: draw-c2 },
          upsertIds: [c2],
          drawMs: 1200,
        }
      - {
          id: draw-c3,
          type: whiteboard.apply,
          at: { mark: draw-c3 },
          upsertIds: [c3, c4],
          drawMs: 1600,
        }
      - {
          id: draw-c5,
          type: whiteboard.apply,
          at: { mark: draw-c5 },
          upsertIds: [c5, c6],
          drawMs: 2000,
        }

  - id: quiz
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ hybrid AI ရဲ့ အဓိက အကျိုးကျေးဇူးက ဘာလဲ။ lesson ကို pause လုပ်ပြီး
      စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] အဖြေကတော့ အလုပ်ကို နေရာ နှစ်ခုမှာ ခွဲပေးနိုင်တာပါ။ ဘာကြောင့်လဲဆိုတော့
      လွယ်တဲ့ မေးခွန်းကို page ထဲမှာ ဖြေရင် မြန်ပြီး ငွေ မကုန်သလို၊ ခက်တဲ့ မေးခွန်းကို server ကို ပို့ရင် ပိုစွမ်းတဲ့
      model ရဲ့ အကူအညီ ရလို့ပါ။ ဒါပေမဲ့ fallback logic ကတော့ ခုနက device check လို ပိုတောင် လိုလာပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Choose your platform (Check your understanding)",
          url: "https://web.dev/learn/ai/platform",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [z-title, z-q1, z-q2],
          drawMs: 1500,
        }
      - {
          id: draw-quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [z-a, z-a-n1, z-a-n2],
          drawMs: 1800,
        }

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ platform ကို use case လိုအပ်ချက်နဲ့ team ရဲ့ ကန့်သတ်ချက်ကနေ ရွေးပြီး၊
      assistant အတွက် RAG နဲ့ managed service ကို စရွေးခဲ့ပါတယ်။ log မှာ ပုံမှန် မေးခွန်း များနေတော့ page ထဲက
      router နဲ့ ပုံမှန် မေးခွန်းကို ဒီမှာ ဖြေပြီး၊ ခက်တာကို server ကို ပို့ခဲ့ပါတယ်။ [[mark:sel-rules]] ကြိုရေးထားတဲ့
      rule က အန္တရာယ် ရှိတဲ့ မေးခွန်းကို လူဆီ လွှဲပြီး၊ compatibility check က model ကို run မနိုင်တဲ့ device ရဲ့
      မေးခွန်းတွေကို server ဆီ ပို့ပါတယ်။ hybrid က ကုန်ကျစရိတ် လျော့ပေးပေမယ့် ရှုပ်ထွေးမှုလည်း တိုးပါတယ်။ နောက် lesson မှာတော့
      browser ထဲက built in AI ကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Choose your platform (your takeaways)",
          url: "https://web.dev/learn/ai/platform",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: recap }, open: false }
      - id: sel-rules
        type: editor.select
        at: { mark: sel-rules }
        target:
          {
            file: src/main.js,
            text: "  if (question.includes(\"မတည့်\")) return \"person\";\n  if (!device.localModel) return \"server\";\n",
            occurrence: 1,
          }
      - {
          id: expect-final-rules,
          type: expect.file,
          at: { afterAction: sel-rules },
          path: src/main.js,
          contains: "  // Rules decided in advance (no model needed):\n  if (question.includes(\"မတည့်\")) return \"person\";\n  if (!device.localModel) return \"server\";\n\n  const routine = predict(router, question).routine;\n  return routine >= 0.5 ? \"here\" : \"server\";\n",
        }
checks:
  - { type: timing.p95Ms, max: 300 }
