  - id: rules
    chapter: "Rule တွေကို ကြိုသတ်မှတ်ရအောင်"
    narration: >
      [[mark:type-health]] ဒါကြောင့် rule တချို့ကို ဆိုင်ပိုင်ရှင် နဲ့ တိုင်ပင်ပြီး ကြိုသတ်မှတ်ရပါမယ်။ မတည့်
      ဆိုတဲ့ စကားလုံး ပါရင် model ကို မမေးဘဲ ဝန်ထမ်းဆီ တန်းလွှဲပါမယ်။ [[mark:read-health]] Messages card မှာ
      မှန်တာ ၉ ခု ဖြစ်သွားပြီး၊ Mistakes card ထဲက နို့ မတည့်တဲ့ မေးခွန်း ပျောက်သွားပါပြီ။ [[mark:click-milk-2]] အဲဒီ
      မေးခွန်းကို ပြန်နှိပ်ကြည့်ရအောင်။ [[mark:read-person]] route က person ဖြစ်သွားပြီး၊ ကောင်တာက လှလှ ဆီ
      လွှဲပေးလိုက်ပြီလို့ ပြပါတယ်။ ဒီလို အလုပ်ကို ပိုစွမ်းတဲ့ model ဒါမှမဟုတ် လူဆီ လွှဲပေးတာကို escalation လို့
      ခေါ်ပါတယ်။ ဘယ်အချိန် လွှဲမလဲ ဆိုတာကို model ရဲ့ သေချာမှုကိုပဲ အားမကိုးဘဲ ကြိုရေးထားတဲ့ rule နဲ့
      ဆုံးဖြတ်တာပါ။
    sources:
      - {
          title: "web.dev Learn AI: Choose your platform (capability-based escalation)",
          url: "https://web.dev/learn/ai/platform",
        }
    actions:
