        import { explain, showAbout, showInbox } from "./inbox.js";

        // The sorter: a small model trained in this page on the shop's labelled messages.
        const sorter = trainNaiveBayes(training);

        // What the owner sees for one message: the group the sorter picked, and cues that say how sure it is.
        function view(text, line) {
          const scores = predict(sorter, text);
          const group = topLabel(scores);
          const sure = scores[group];
          const card = { group };
          // Trust cues:

