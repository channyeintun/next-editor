# AI course, lesson 10: trust and transparency (Burmese, hands-on, M1 + M0).
#
# Start state (ws/): data/reviews.json and data/support.json (COURSE-KIT §4.2, §4.4, unchanged) and
# src/data.js's older labelled reviews (from base/); src/messages.js (pinned) builds the sorter's
# sample data: seven new messages for the owner's inbox (r18 r22 q15 q13 r23 r11 q27), 16 messages she
# checked by hand last week, and 89 labelled training messages; src/inbox.js (pinned) draws the inbox
# in #app (group chips; the badge and the "why" button when view() adds them; the line choices) and
# the panel cards `ai-about` (input "Training data": sources, languages, version, where it is weak) and
# `ai-checks` (metrics "Past checks", badge `ဒီ page ထဲမှာ train ထားတဲ့ model`: right 12 / 16, then the
# sure / check split); src/main.js trains the naive Bayes sorter (src/ml.js) in the page and has
# view(text, line) with an empty "Trust cues" section.
#
# Edits, all insert-only, one line each (line-by-line), inside view():
#   1. card.check = sure < line;                     badges: 3 sure, 4 check; Past checks 10 / 11 · 2 / 5
#   2. if (sure < 0.6) card.group = "unsorted";      q13 (48%, wrongly a complaint) → မခွဲရသေးတာ
#   3. card.why = explain(sorter, text);             a ဘာကြောင့်လဲ button on every message
# Clicks (after the last edit): why-6 → "အရမ်း · မြန်တာပဲ ကြောင့် ချီးကျူး 92%" (the sarcastic complaint,
# confidently wrong); line-2 (95%) → message 6 asks for a check too; Past checks 7 / 7 · 5 / 9.
# M1: the sorter is trained in the page (deterministic: sim = verify); M0: the cues and the UI.
#
# Boards: (A) the mini blueprint, Governance highlighted; (P) predictable apps vs AI's failures;
# (D) the trust dial; (U) UX techniques; (T) the module's takeaways; (Z) the quiz.
#
# Build: bun ~/Documents/ai-course-work/tools/build-lesson.ts template.yaml ws ai-course-10-trust.yaml
