build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 5110
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "Trust ဆိုတာ ဘာလဲ"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ model ကို ဘယ်လို data နဲ့ train ထားလဲ၊ ဘယ်နေရာမှာ အားနည်းလဲ
      ဆိုတာကို coverage statement နဲ့ ပွင့်ပွင့်လင်းလင်း ပြောပြခဲ့ပါတယ်။ ဒီ lesson မှာတော့ governance ရဲ့ တတိယ
      အချက် ဖြစ်တဲ့ trust နဲ့ transparency ကို ကြည့်ပါမယ်။ [[mark:draw-mini]] blueprint မှာ ဒီ အချက်ကလည်း
      Governance ထဲမှာ ရှိပေမယ့်၊ data၊ intelligence၊ U X အလွှာ သုံးခုလုံးနဲ့ ဆိုင်ပါတယ်။ [[mark:draw-today]]
      trust ဆိုတာ user တွေက product ကို ယုံပြီး ဆက်သုံးမလား ဆိုတာပါ။ transparency ကတော့ AI ဘာလုပ်နေလဲ၊
      ဘယ်လောက် သေချာလဲ ဆိုတာကို user မြင်အောင် ပွင့်ပွင့်လင်းလင်း ပြတာပါ။
    sources:
      - {
          title: "web.dev Learn AI: AI governance: Build responsibly (trust and transparency)",
          url: "https://web.dev/learn/ai/responsibility",
        }
      - {
          title: "web.dev Learn AI: Introduction to AI on the web (the blueprint)",
          url: "https://web.dev/learn/ai/introduction",
        }
      - {
          title: "web.dev Learn AI: Welcome to Learn AI! (course credit: written by Dr. Janna Lipenkova with editorial guidance from Alexandra Klepper; text CC BY 4.0, code Apache 2.0; adapted into Burmese with the course's own tea-shop examples)",
          url: "https://web.dev/learn/ai/welcome",
        }
      - {
          title: "Creative Commons: Attribution 4.0 International (CC BY 4.0), the licence of the web.dev Learn AI text adapted here",
          url: "https://creativecommons.org/licenses/by/4.0/",
        }
    actions:
      - {
          id: open-board-a,
          type: whiteboard.apply,
          at: { scene: start, offsetMs: -450 },
          open: true,
          clear: true,
          upsertIds: [a-title],
        }
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - {
          id: draw-mini,
          type: whiteboard.apply,
          at: { mark: draw-mini },
          upsertIds:
            [
              a-opp,
              a-opp-t,
              a-arrow-1,
              a-data,
              a-data-t,
              a-intel,
              a-intel-t,
              a-ux,
              a-ux-t,
              a-arrow-2,
              a-gov,
              a-gov-t,
            ],
          drawMs: 2400,
        }
      - {
          id: draw-today,
          type: whiteboard.apply,
          at: { mark: draw-today },
          upsertIds: [a-today],
          drawMs: 1000,
        }

  - id: predictable
    narration: >
      [[mark:draw-pred]] user တွေက app တစ်ခုကို အမြဲ တစ်ပုံစံတည်း အလုပ်လုပ်မယ်လို့ မျှော်လင့်ကြပါတယ်။ ဥပမာ
      ဆိုင်ရဲ့ website မှာ အော်ဒါ ခလုတ်ကို ဘယ်နှခါ နှိပ်နှိပ် အော်ဒါ page ကိုပဲ ရောက်ပါတယ်။ [[mark:draw-ai]] AI ကတော့
      ဒီလို မဟုတ်ပါဘူး။ language model တွေက မရှိတာကို ရှိသလို hallucinate ဖြစ်တတ်ပြီး၊ predictive model တွေက
      label မှားကပ်တတ်ပါတယ်။ ကိုယ့်ဘာသာ အဆင့်တွေ ဆုံးဖြတ်တဲ့ agent တွေလည်း လမ်းလွဲသွားတတ်ပါတယ်။
      [[mark:draw-last]] ဒါကြောင့် ဒီ အမှားတွေကို နောက်ဆုံး ဖမ်းမိမယ့်သူက user ကိုယ်တိုင်ပါ။
    sources:
      - {
          title: "web.dev Learn AI: AI governance: Build responsibly (trust and transparency)",
          url: "https://web.dev/learn/ai/responsibility",
        }
    actions:
      - {
          id: draw-pred,
          type: whiteboard.apply,
          at: { mark: draw-pred },
          clear: true,
          upsertIds: [p-title, p-btn],
          drawMs: 1400,
        }
      - {
          id: draw-ai,
          type: whiteboard.apply,
          at: { mark: draw-ai },
          upsertIds: [p-ai, p-f1, p-f2, p-f3],
          drawMs: 2400,
        }
      - {
          id: draw-last,
          type: whiteboard.apply,
          at: { mark: draw-last },
          upsertIds: [p-last],
          drawMs: 1000,
        }

  - id: dial
    narration: >
      [[mark:draw-dial]] user ရဲ့ ယုံကြည်မှုကို အစွန်း နှစ်ဖက် ရှိတဲ့ အတိုင်းအတာ တစ်ခုလို စဉ်းစားကြည့်ရအောင်။
      [[mark:draw-under]] တစ်ဖက်စွန်းမှာ ယုံကြည်မှု နည်းလွန်းလို့ မသုံးတော့တာ ရှိပါတယ်။ ဆိုင်ပိုင်ရှင် က
      AI တစ်ခါ မှားတာ မြင်ပြီး dashboard ကို လုံးဝ မဖွင့်တော့တာမျိုးပါ။ [[mark:draw-over]] နောက်တစ်ဖက်စွန်းမှာ
      လွန်ကဲ ယုံကြည်တာ ရှိပါတယ်။ ကောင်တာက လှလှ က AI ရေးပေးတဲ့ စာကို မဖတ်ဘဲ customer ဆီ ပို့လိုက်တာမျိုးပါ။
      [[mark:draw-calibrated]] ကိုယ် လိုချင်တာက အလယ်က calibrated trust ပါ။ AI ကို အချိန်ကုန်သက်သာဖို့
      သုံးရင်းနဲ့ နောက်ဆုံး အဖြေကိုတော့ ကိုယ်တိုင် စစ်ပြီး တာဝန်ယူတဲ့ သင့်တင့်တဲ့ ယုံကြည်မှုပါ။ user တွေကို
      အစွန်း နှစ်ဖက်ကနေ အလယ်ကို ရောက်အောင် ကိုယ့် design က ကူညီရပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: AI governance: Build responsibly (calibrated trust)",
          url: "https://web.dev/learn/ai/responsibility",
        }
    actions:
      - {
          id: draw-dial,
          type: whiteboard.apply,
          at: { mark: draw-dial },
          clear: true,
          upsertIds: [d-title],
        }
      - {
          id: draw-under,
          type: whiteboard.apply,
          at: { mark: draw-under },
          upsertIds: [d-under, d-under-t, d-under-e],
          drawMs: 1400,
        }
      - {
          id: draw-over,
          type: whiteboard.apply,
          at: { mark: draw-over },
          upsertIds: [d-over, d-over-t, d-over-e],
          drawMs: 1400,
        }
      - {
          id: draw-calibrated,
          type: whiteboard.apply,
          at: { mark: draw-calibrated },
          upsertIds: [d-cal, d-cal-t, d-cal-e, d-ring, d-goal],
          drawMs: 2400,
        }

  - id: inbox
    chapter: "Message တွေကို ခွဲရအောင်"
    narration: >
      [[mark:close-dial]] ဆိုင်ရဲ့ code ကို ကြည့်ရအောင်။ [[mark:panel-ready]] ဆိုင်ပိုင်ရှင် ဆီကို review တွေ၊ customer
      message တွေ နေ့တိုင်း ရောက်လာလို့၊ ချီးကျူးတာ၊ တိုင်ကြားတာ၊ မေးခွန်း ဆိုပြီး model က အုပ်စု ခွဲပေးပါတယ်။
      [[mark:open-main]] ဒီ model က lesson အတွက် ရေးထားတဲ့ model သေးသေးလေး ဖြစ်ပြီး၊ ဒီ page ထဲမှာပဲ train
      လုပ်တာပါ။ [[mark:sel-view]] view function က message တစ်ခုချင်းအတွက် model ရွေးတဲ့ အုပ်စုကိုပဲ
      ပြန်ပေးပါတယ်။ [[mark:read-inbox]] panel အပေါ်မှာ ဒီမနက် ရောက်လာတဲ့ message ခုနစ်ခုကို အုပ်စုနဲ့
      ပြထားပါတယ်။ ဒီ message တွေက lesson အတွက် ပြင်ဆင်ထားတဲ့ နမူနာ data ပါ။ [[mark:read-wrong]] အများစု
      မှန်ပေမယ့်၊ လက်ဖက်ရည် တစ်ခွက် ဘယ်လောက်လဲ ဆိုတဲ့ မေးခွန်းကို တိုင်ကြားတာလို့ ခွဲထားပါတယ်။ အရမ်း မြန်တာပဲ၊
      နှစ်နာရီပဲ စောင့်ရတယ် လို့ ရွဲ့ပြီး တိုင်ကြားထားတာကိုလည်း ချီးကျူးတာလို့ ခွဲထားပါတယ်။ ဘယ်ဟာကို
      စစ်ရမလဲ ဆိုတာကိုတော့ page က ဆိုင်ပိုင်ရှင် ကို ဘာမှ မပြောပြပါဘူး။ [[mark:read-past-all]] အောက်က Past checks card ကတော့
      ဆိုင်ပိုင်ရှင် ပြီးခဲ့တဲ့ အပတ်က လက်နဲ့ စစ်ထားတဲ့ message ၁၆ ခုမှာ model က ၁၂ ခု မှန်ခဲ့တယ်လို့ ပြနေပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: AI governance: Build responsibly (trust and transparency)",
          url: "https://web.dev/learn/ai/responsibility",
        }
    actions:
      - { id: close-dial, type: whiteboard.apply, at: { mark: close-dial }, open: false }
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-done
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: ai-status }
        attribute: { name: data-state, value: "done" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-two-cards
        type: expect.preview
        at: { afterAction: expect-done }
        timeoutMs: 5000
        target: { by: testId, value: ai-cards }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - { id: open-main, type: workspace.openFile, at: { mark: open-main }, path: src/main.js }
      - id: sel-train
        type: editor.select
        at: { afterAction: open-main }
        target:
          { file: src/main.js, text: "const sorter = trainNaiveBayes(training);", occurrence: 1 }
      - id: sel-view
        type: editor.select
        at: { mark: sel-view }
        target: { file: src/main.js, text: "  const card = { group };", occurrence: 1 }
      - id: expect-seven
        type: expect.preview
        at: { mark: read-inbox }
        timeoutMs: 5000
        target: { by: testId, value: msg-7 }
        textContains: "ငွေ နှစ်ခါ ဖြတ်သွားတယ်"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-price-complaint
        type: expect.preview
        at: { mark: read-wrong }
        timeoutMs: 5000
        target: { by: testId, value: msg-4 }
        attribute: { name: data-group, value: "complaint" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-sarcasm-praise
        type: expect.preview
        at: { afterAction: expect-price-complaint }
        timeoutMs: 5000
        target: { by: testId, value: msg-6 }
        attribute: { name: data-group, value: "praise" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-past-12
        type: expect.preview
        at: { mark: read-past-all }
        timeoutMs: 5000
        target: { by: testId, value: ai-checks-1 }
        attribute: { name: data-value, value: "12 / 16" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: data
    narration: >
      [[mark:read-data]] data အလွှာမှာ trust ရဖို့ data ဘယ်က လာလဲ၊ ဘယ်လောက် လတ်ဆတ်လဲ ဆိုတာကို ရှင်းရှင်း
      ပြောပြရပါမယ်။ [[mark:read-sources]] Training data card မှာ label ကပ်ထားတဲ့ message ၈၉ ခုကို ဆိုင်ရဲ့
      review တွေ၊ customer message တွေနဲ့ အရင်က review တွေကနေ ယူထားတယ်လို့ ပြထားပါတယ်။ မြန်မာစာက ၇၃ ခု
      ရှိပြီး အင်္ဂလိပ်စာက ၁၂ ခုပဲ ပါပါတယ်။ [[mark:read-weak]] model ဘယ်နေရာမှာ အားနည်းလဲ ဆိုတာလည်း ပါပါတယ်။ စစ်ထားတဲ့
      အင်္ဂလိပ် message က သုံးခုပဲ ရှိပေမယ့် တစ်ခုပဲ မှန်ခဲ့လို့၊ inbox ရဲ့ ခေါင်းစဉ်အောက်မှာလည်း အင်္ဂလိပ်လို
      ရေးထားတာကို မှားတတ်ပါတယ် လို့ ကြိုပြောထားပါတယ်။ [[mark:read-version]] version နဲ့ update လုပ်တဲ့ ရက်လည်း
      ပါပါတယ်။ model ကို ပြန် train လုပ်တိုင်း version အသစ် ပေးပြီး အဲဒီ အချိန်က data ကို သိမ်းထားရင်၊ အဖြေတွေ
      ဘာကြောင့် ပြောင်းသွားလဲ နောက်မှ ရှင်းပြနိုင်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: AI governance: Build responsibly (trust: data)",
          url: "https://web.dev/learn/ai/responsibility",
        }
    actions:
      - id: sel-about
        type: editor.select
        at: { mark: read-data }
        target: { file: src/main.js, text: "showAbout(training, checked, sorter);", occurrence: 1 }
      - id: expect-about-89
        type: expect.preview
        at: { mark: read-sources }
        timeoutMs: 5000
        target: { by: testId, value: ai-about }
        textContains: "89 labelled messages · reviews 24 · customer messages 27 · older reviews 38"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-about-langs
        type: expect.preview
        at: { afterAction: expect-about-89 }
        timeoutMs: 5000
        target: { by: testId, value: ai-about }
        textContains: "Burmese 73 · English 12"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-about-weak
        type: expect.preview
        at: { mark: read-weak }
        timeoutMs: 5000
        target: { by: testId, value: ai-about }
        textContains: "weak at · English, 1 of 3 right in past checks"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-limits
        type: expect.preview
        at: { afterAction: expect-about-weak }
        timeoutMs: 5000
        target: { by: testId, value: limits }
        textContains: "အင်္ဂလိပ်လို ရေးထားတာကို မှားတတ်ပါတယ်"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-version
        type: expect.preview
        at: { mark: read-version }
        timeoutMs: 5000
        target: { by: testId, value: ai-about }
        textContains: "version 1 · updated 2026-11-05"
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: confidence
    chapter: "ဘယ်လောက် သေချာလဲ ပြရအောင်"
    narration: >
      intelligence အလွှာမှာ ပထမ နည်းက confidence indicator ပါ။ confidence ဆိုတာ model က ဒီ
      အဖြေကို ဘယ်လောက် သေချာလဲ ဆိုတဲ့ ခန့်မှန်းချက်ပါ။ ဒီ model က အုပ်စု တစ်ခုစီအတွက် ဖြစ်နိုင်ခြေ ထုတ်ပေးလို့
      အဲဒါကို သုံးပါမယ်။ [[mark:type-check]] ဖြစ်နိုင်ခြေက threshold မျဉ်းထက် နိမ့်ရင် စစ်ပေးဖို့ မှတ်ထားတဲ့ စာကြောင်း
      ရေးပါမယ်။ [[mark:read-badges]] message တိုင်းမှာ badge ပေါ်လာပြီး၊ အောက်မှာ မျဉ်း ရွေးတဲ့ ခလုတ်လည်း
      ပါလာပါပြီ။ ၈၀ ရာခိုင်နှုန်း မျဉ်းထက် မြင့်တဲ့ သုံးခုက သေချာမှု မြင့်လို့ ပြပြီး၊ ကျန်တဲ့ လေးခုကတော့
      သေချာမှု နိမ့်၊ စစ်ပေးပါ လို့ ပြနေပါတယ်။ [[mark:read-past]] ဒီ badge ကို ယုံလို့ ရလား ဆိုတာ Past checks
      card မှာ ကြည့်လို့ ရပါတယ်။ စစ်ထားတဲ့ ၁၆ ခုထဲမှာ သေချာမှု မြင့်တဲ့ ၁၁ ခုထဲက ၁၀ ခု မှန်ပြီး၊ သေချာမှု
      နိမ့်တဲ့ ငါးခုမှာတော့ နှစ်ခုပဲ မှန်ခဲ့ပါတယ်။ အရင်က ဘယ်လောက် မှန်ခဲ့လဲ ဆိုတာကလည်း confidence ကို
      ခန့်မှန်းတဲ့ နည်း တစ်ခုပါ။
    sources:
      - {
          title: "web.dev Learn AI: AI governance: Build responsibly (trust: intelligence, confidence indicators)",
          url: "https://web.dev/learn/ai/responsibility",
        }
    actions:
      - id: type-check
        type: editor.type
        at: { mark: type-check }
        target: { file: src/main.js, after: "  // Trust cues:\n", occurrence: 1 }
        text: "  card.check = sure < line;\n"
        cadence: line-by-line
      - id: expect-badge-sure
        type: expect.preview
        at: { afterAction: type-check }
        timeoutMs: 8000
        target: { by: testId, value: badge-1 }
        attribute: { name: data-check, value: "false" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-badge-check
        type: expect.preview
        at: { afterAction: expect-badge-sure }
        timeoutMs: 5000
        target: { by: testId, value: badge-3 }
        attribute: { name: data-check, value: "true" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-badge-sarcasm
        type: expect.preview
        at: { afterAction: expect-badge-check }
        timeoutMs: 5000
        target: { by: testId, value: badge-6 }
        attribute: { name: data-check, value: "false" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-line-80
        type: expect.preview
        at: { mark: read-badges }
        timeoutMs: 5000
        target: { by: testId, value: line-1 }
        attribute: { name: aria-pressed, value: "true" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-sure-10-11
        type: expect.preview
        at: { mark: read-past }
        timeoutMs: 5000
        target: { by: testId, value: ai-checks-2 }
        attribute: { name: data-value, value: "10 / 11" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-check-2-5
        type: expect.preview
        at: { afterAction: expect-sure-10-11 }
        timeoutMs: 5000
        target: { by: testId, value: ai-checks-3 }
        attribute: { name: data-value, value: "2 / 5" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: fallback
    narration: >
      အရမ်း မသေချာတဲ့ အဖြေအတွက်တော့ safe fallback လိုပါတယ်။ fallback ဆိုတာ တစ်ခု မရရင်
      သုံးဖို့ ပြင်ထားတဲ့ အစားထိုး လမ်းပါ။ [[mark:type-fallback]] ဖြစ်နိုင်ခြေ ၆၀ ရာခိုင်နှုန်း မရောက်ရင်
      အုပ်စု မခွဲဘဲ မခွဲရသေးတာ ထဲ ပို့တဲ့ စာကြောင်း ထည့်ပါမယ်။ [[mark:read-fallback]] လက်ဖက်ရည် ဈေးမေးတဲ့
      message က တိုင်ကြားတာ အုပ်စုကနေ မခွဲရသေးတာ ကို ရောက်သွားပါပြီ။ မှားမှား ခွဲထားတာထက် မသေချာဘူးလို့
      ဝန်ခံတာက ဆိုင်ပိုင်ရှင် ရဲ့ ယုံကြည်မှုကို ပိုထိန်းပေးပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: AI governance: Build responsibly (trust: safe fallbacks)",
          url: "https://web.dev/learn/ai/responsibility",
        }
    actions:
      - id: type-fallback
        type: editor.type
        at: { mark: type-fallback }
        target: { file: src/main.js, after: "  card.check = sure < line;\n", occurrence: 1 }
        text: "  if (sure < 0.6) card.group = \"unsorted\";\n"
        cadence: line-by-line
      - id: expect-unsorted
        type: expect.preview
        at: { afterAction: type-fallback }
        timeoutMs: 8000
        target: { by: testId, value: group-4 }
        textContains: "မခွဲရသေးတာ"
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: why
    chapter: "ဘာကြောင့်လဲ ပြရအောင်"
    narration: >
      နောက်တစ်ချက်က သုံးနေရင်းနဲ့ပဲ ချက်ချင်း ဖတ်လို့ ရတဲ့ ရှင်းပြချက် တိုတိုလေးပါ။ လူတွေက
      လမ်းညွှန်စာကို အရင် မဖတ်ဘဲ တန်း သုံးကြလို့ပါ။ [[mark:type-why]] model ရွေးတဲ့ အုပ်စုဆီ အများဆုံး
      တွန်းပို့တဲ့ စကားလုံးတွေကိုပါ ပြန်ပေးတဲ့ စာကြောင်း ထည့်ပါမယ်။ [[mark:read-why]] message တိုင်းမှာ ဘာကြောင့်လဲ ခလုတ်
      ပေါ်လာပါပြီ။ [[mark:click-why]] ရွဲ့ပြီး တိုင်ကြားထားတဲ့ message ရဲ့ ခလုတ်ကို နှိပ်ကြည့်ပါမယ်။
      [[mark:read-reason]] အရမ်း နဲ့ မြန်တာပဲ ဆိုတဲ့ စကားလုံးတွေကြောင့် ချီးကျူးတာလို့ ၉၂ ရာခိုင်နှုန်း
      ခွဲထားတာပါ။ model က စကားလုံးတွေ ဘယ် အုပ်စုမှာ ခဏခဏ ပါလဲ ဆိုတာကိုပဲ ကြည့်တာမို့ ရွဲ့ပြောတာကို ခွဲထုတ်လို့
      မရပါဘူး။ ဒါကြောင့်
      သေချာမှု မြင့်တာနဲ့ မှန်တာ မတူပါဘူး။ ဘာကြောင့် ဒီ အဖြေ ထွက်လာလဲ ရှင်းပြနိုင်ရင် ဆိုင်ပိုင်ရှင် က အမှားကို မြန်မြန်
      တွေ့ပါတယ်။ [[mark:click-line]] မျဉ်းကို ၉၅ ရာခိုင်နှုန်း တင်ကြည့်ရင်၊ [[mark:read-line]] ဒီ message ပါ
      စစ်ပေးပါ ဖြစ်သွားပြီး၊ Past checks မှာလည်း သေချာမှု မြင့်တဲ့ ခုနစ်ခုလုံး မှန်ပါတယ်။ ဒါပေမဲ့ ၁၆ ခုမှာ
      စစ်ရမယ့်ဟာ ကိုးခု ဖြစ်သွားပါတယ်။ ဒါကြောင့် မျဉ်းကို ဘယ်မှာ ထားမလဲ ဆိုတာက မှားရင် ဘယ်လောက် နစ်နာလဲ၊ ဆိုင်ပိုင်ရှင်
      မှာ အချိန် ဘယ်လောက် ရှိလဲ ဆိုတာပေါ် မူတည်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: AI governance: Build responsibly (trust: just-in-time explanations)",
          url: "https://web.dev/learn/ai/responsibility",
        }
      - {
          title: "Laws of UX: Paradox of the Active User",
          url: "https://lawsofux.com/paradox-of-the-active-user/",
        }
    actions:
      - id: type-why
        type: editor.type
        at: { mark: type-why }
        target:
          {
            file: src/main.js,
            after: "  if (sure < 0.6) card.group = \"unsorted\";\n",
            occurrence: 1,
          }
        text: "  card.why = explain(sorter, text);\n"
        cadence: line-by-line
      - id: expect-why-button
        type: expect.preview
        at: { afterAction: type-why }
        timeoutMs: 8000
        target: { by: testId, value: why-6 }
        textContains: "ဘာကြောင့်လဲ"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: click-why
        type: preview.click
        at: { mark: click-why }
        target: { by: testId, value: why-6 }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-reason
        type: expect.preview
        at: { afterAction: click-why }
        timeoutMs: 5000
        target: { by: testId, value: reason-6 }
        textContains: "အရမ်း · မြန်တာပဲ ကြောင့် ချီးကျူး 92%"
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: click-line
        type: preview.click
        at: { mark: click-line }
        target: { by: testId, value: line-2 }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-line-95
        type: expect.preview
        at: { afterAction: click-line }
        timeoutMs: 5000
        target: { by: testId, value: line-2 }
        attribute: { name: aria-pressed, value: "true" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-sarcasm-check
        type: expect.preview
        at: { mark: read-line }
        timeoutMs: 5000
        target: { by: testId, value: badge-6 }
        attribute: { name: data-check, value: "true" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-sure-7-7
        type: expect.preview
        at: { afterAction: expect-sarcasm-check }
        timeoutMs: 5000
        target: { by: testId, value: ai-checks-2 }
        attribute: { name: data-value, value: "7 / 7" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-check-5-9
        type: expect.preview
        at: { afterAction: expect-sure-7-7 }
        timeoutMs: 5000
        target: { by: testId, value: ai-checks-3 }
        attribute: { name: data-value, value: "5 / 9" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: ux
    chapter: "UX နဲ့ ယုံကြည်မှု ညှိရအောင်"
    narration: >
      [[mark:draw-ux]] U X အလွှာမှာ ယုံကြည်မှုကို ညှိဖို့ နည်းတွေ ရှိပါသေးတယ်။ AI အကြောင်း မသိသေးတဲ့ user အတွက်
      ရှင်းပြချက် ပိုပေးပြီး၊ ကျွမ်းကျင်တဲ့ user အတွက်တော့ badge လို အမှတ်အသား တိုတိုလေးပဲ ပေးပါ။
      [[mark:draw-ux-disclose]] AI က ခွဲထားတာပါ ဆိုတဲ့ စာ တိုတိုနဲ့ စပြီး၊ ဘာကြောင့်လဲ နှိပ်မှ အသေးစိတ် ပြတာက
      progressive disclosure ပါ။ [[mark:draw-ux-feedback]] ဆိုင်ပိုင်ရှင် ပြင်ပေးတဲ့ အုပ်စုတွေကို နောက် version မှာ ထည့်သုံးပြီး၊
      ဘာ ပြောင်းသွားလဲ ပြန်ပြောပြပါ။ ဥပမာ ဈေးမေးတဲ့ message တွေကို အခု မေးခွန်းထဲ ခွဲပါပြီ လို့ ပြတာမျိုးပါ။
      feedback က အလကား မဖြစ်ဘူးလို့ မြင်ရရင် ပိုယုံပါတယ်။
      [[mark:draw-ux-error]] AI မှားတဲ့အခါ ဝန်ခံပြီး၊ ဒီ အကြံက မှားနိုင်ပါတယ်၊ မသုံးခင် စစ်ပါ လို့ user ကို
      စစ်ခိုင်းပါ။ ပြန်စမ်းတာ၊ ပြင်တာ၊ AI မပါတဲ့ ပုံစံကို ပြန်သွားတာ လုပ်လို့ ရရပါမယ်။ [[mark:draw-ux-steps]]
      အဆင့် တစ်ဆင့်ချင်း ခွဲလုပ်တဲ့ system ဆိုရင်လည်း အဆင့် တစ်ခုစီက ဘာ ပြောင်းလိုက်လဲ ပြောပြရင်
      ပိုရှင်းပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: AI governance: Build responsibly (trust: user experience)",
          url: "https://web.dev/learn/ai/responsibility",
        }
    actions:
      - {
          id: draw-ux,
          type: whiteboard.apply,
          at: { mark: draw-ux },
          open: true,
          clear: true,
          upsertIds: [u-title, u-guide],
          drawMs: 1400,
        }
      - {
          id: draw-ux-disclose,
          type: whiteboard.apply,
          at: { mark: draw-ux-disclose },
          upsertIds: [u-disclose],
          drawMs: 1000,
        }
      - {
          id: draw-ux-feedback,
          type: whiteboard.apply,
          at: { mark: draw-ux-feedback },
          upsertIds: [u-feedback],
          drawMs: 1000,
        }
      - {
          id: draw-ux-error,
          type: whiteboard.apply,
          at: { mark: draw-ux-error },
          upsertIds: [u-error, u-path],
          drawMs: 1600,
        }
      - {
          id: draw-ux-steps,
          type: whiteboard.apply,
          at: { mark: draw-ux-steps },
          upsertIds: [u-steps],
          drawMs: 1000,
        }

  - id: takeaways
    narration: >
      [[mark:draw-take]] governance အပိုင်း တစ်ခုလုံးကို ကြည့်ရင်၊ privacy၊ fairness၊ trust ကို တစ်ခါတည်း အကုန်
      ပြည့်စုံအောင် လုပ်စရာ မလိုပါဘူး။ [[mark:draw-take-1]] ကိုယ့် product မှာ အရေးကြီးဆုံး နေရာကနေ စပြီး၊
      [[mark:draw-take-2]] ကိုယ့် team အတွက် governance နည်းလမ်းကို ကိုယ်တိုင် သတ်မှတ်ပါ။ [[mark:draw-take-3]]
      version အသစ်တိုင်း၊ user feedback တိုင်းကနေ ဘယ်မှာ guardrail၊ ရှင်းပြချက် ထပ်လိုလဲ သင်ယူပြီး
      ဆက်ပြင်သွားရပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: AI governance: Build responsibly (your takeaways)",
          url: "https://web.dev/learn/ai/responsibility",
        }
    actions:
      - {
          id: draw-take,
          type: whiteboard.apply,
          at: { mark: draw-take },
          clear: true,
          upsertIds: [t-title, t-ptf],
          drawMs: 1400,
        }
      - {
          id: draw-take-1,
          type: whiteboard.apply,
          at: { mark: draw-take-1 },
          upsertIds: [t-1],
          drawMs: 1000,
        }
      - {
          id: draw-take-2,
          type: whiteboard.apply,
          at: { mark: draw-take-2 },
          upsertIds: [t-2],
          drawMs: 1000,
        }
      - {
          id: draw-take-3,
          type: whiteboard.apply,
          at: { mark: draw-take-3 },
          upsertIds: [t-3],
          drawMs: 1000,
        }

  - id: quiz
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ ဆိုင်ပိုင်ရှင် က ဒီ model ကို calibrated trust နဲ့ သုံးတယ် ဆိုတာ ဘယ်လို
      သုံးတာလဲ။ ခွဲထားတာတွေကို မစစ်ဘဲ အကုန် ယုံတာလား၊ တစ်ခါ မှားလို့ လုံးဝ မသုံးတော့တာလား၊ model ကို
      သုံးရင်းနဲ့ ရလဒ်ကို ကိုယ်တိုင် စစ်တာလား။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]]
      အဖြေကတော့ model ကို အချိန် သက်သာဖို့ သုံးရင်းနဲ့ ရလဒ်ကို ကိုယ်တိုင် စစ်တာပါ။ ဘာကြောင့်လဲဆိုတော့ model က
      အသုံးဝင်ပေမယ့် မှားနိုင်လို့၊ ခုနက ရွဲ့ပြီး တိုင်ကြားထားတာလို အမှားကို ဆိုင်ပိုင်ရှင် ကပဲ နောက်ဆုံး ဖမ်းနိုင်လို့ပါ။
      အကုန် ယုံတာက လွန်ကဲ ယုံကြည်တာ ဖြစ်ပြီး၊ လုံးဝ မသုံးတာက ယုံကြည်မှု နည်းလွန်းတာပါ။
    sources:
      - {
          title: "web.dev Learn AI: AI governance: Build responsibly (Check your understanding)",
          url: "https://web.dev/learn/ai/responsibility",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          clear: true,
          upsertIds: [z-title, z-q, z-o1, z-o2, z-o3],
          drawMs: 2000,
        }
      - {
          id: draw-quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [z-ring, z-a, z-note],
          drawMs: 1800,
        }

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ AI က မှားနိုင်လို့ user ကို အလယ်က calibrated trust ဆီ ရောက်အောင်
      ကူညီရပါတယ်။ [[mark:sel-final-about]] data မှာ ဘယ်က လာလဲ၊ ဘယ်မှာ အားနည်းလဲ ပြောပြပါတယ်။
      [[mark:sel-final-check]] intelligence မှာ
      မသေချာရင် စစ်ခိုင်းပြီး၊ [[mark:sel-final-fallback]] အရမ်း မသေချာရင် အုပ်စု မခွဲဘဲ ထားပါတယ်။
      [[mark:sel-final-why]] ဘာကြောင့်လဲ ဆိုတာကိုလည်း ချက်ချင်း ပြပြီး၊ U X မှာ အတိုကနေ အသေးစိတ်ကို
      ဖွင့်ကြည့်ခွင့် ပေးပါတယ်။ နောက် lesson မှာတော့ model ကို ဘယ်မှာ run မလဲ၊ client side လား server side လား
      ဆိုတာကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: AI governance: Build responsibly",
          url: "https://web.dev/learn/ai/responsibility",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: recap }, open: false }
      - id: sel-final-about
        type: editor.select
        at: { mark: sel-final-about }
        target: { file: src/main.js, text: "showAbout(training, checked, sorter);", occurrence: 1 }
      - id: sel-final-check
        type: editor.select
        at: { mark: sel-final-check }
        target: { file: src/main.js, text: "  card.check = sure < line;", occurrence: 1 }
      - id: sel-final-fallback
        type: editor.select
        at: { mark: sel-final-fallback }
        target:
          { file: src/main.js, text: '  if (sure < 0.6) card.group = "unsorted";', occurrence: 1 }
      - id: sel-final-why
        type: editor.select
        at: { mark: sel-final-why }
        target: { file: src/main.js, text: "  card.why = explain(sorter, text);", occurrence: 1 }
      - {
          id: expect-final-code,
          type: expect.file,
          at: { afterAction: sel-final-why },
          path: src/main.js,
          contains: "  // Trust cues:\n  card.check = sure < line;\n  if (sure < 0.6) card.group = \"unsorted\";\n  card.why = explain(sorter, text);\n\n  return card;\n",
        }
checks:
  - { type: timing.p95Ms, max: 300 }
