      src/inbox.js: |
        // the owner's inbox in #app, and the AI panel's cards about the sorter. The sorter itself is in main.js.
        import { panel } from "ai-panel";
        import { predict, tokenize, topLabel } from "./ml.js";
        import { choices } from "./ui.js";

        const GROUP = { praise: "ချီးကျူး", complaint: "တိုင်ကြား", question: "မေးခွန်း", unsorted: "မခွဲရသေးတာ" };
        const pct = (p) => `${Math.round(p * 100)}%`;
        const count = (list, test) => list.filter(test).length;

        // Why the sorter picked its group: the words of the message whose syllables push it there most,
        // compared with the next best group (how much more often they appear in that group's examples).
        export function explain(model, text) {
          const scores = predict(model, text);
          const [top, next] = Object.entries(scores).sort((a, b) => b[1] - a[1]).map(([label]) => label);
          const weight = (label, t) => Math.log(((model.labels[label].counts[t] ?? 0) + 1) / (model.labels[label].tokens + model.vocab.size));
          const words = text
            .split(/\s+/)
            .map((word) => ({
              word: word.replace(/[။၊.,!?]/g, ""),
              push: tokenize(word).filter((t) => model.vocab.has(t)).reduce((s, t) => s + weight(top, t) - weight(next, t), 0),
            }))
            .filter((w) => w.word && w.push > 0)
            .sort((a, b) => b.push - a.push)
            .slice(0, 2);
          return { group: top, sure: scores[top], words: words.map((w) => w.word) };
        }

        // The AI panel: what the sorter was trained on (data provenance), and how it did on the messages
        // the owner checked by hand.
        export function showAbout(training, checked, model) {
          const n = (key, value) => count(training, (m) => m[key] === value);
          const en = checked.filter((m) => m.lang === "en");
          const enRight = count(en, (m) => topLabel(predict(model, m.text)) === m.label);
          panel.input("Training data", [
            `${training.length} labelled messages · reviews ${n("source", "review")} · customer messages ${n("source", "message")} · older reviews ${n("source", "older")}`,
            `Burmese ${n("lang", "my")} · English ${n("lang", "en")} · mixed ${n("lang", "mixed")} · romanized ${n("lang", "my-latn")}`,
            "version 1 · updated 2026-11-05",
            `weak at · English, ${enRight} of ${en.length} right in past checks`,
          ].join("\n"), { id: "about" });
        }

        function showChecks(checked, view, model, line) {
          const rows = checked.map((m) => ({ card: view(m.text, line), right: topLabel(predict(model, m.text)) === m.label }));
          const values = { right: `${count(rows, (r) => r.right)} / ${rows.length}` };
          if (rows.every((r) => "check" in r.card)) {
            const sure = rows.filter((r) => !r.card.check);
            const check = rows.filter((r) => r.card.check);
            values["sure · right"] = `${count(sure, (r) => r.right)} / ${sure.length}`;
            values["check · right"] = `${count(check, (r) => r.right)} / ${check.length}`;
          }
          panel.metrics("Past checks", values, { id: "checks", badge: "ဒီ page ထဲမှာ train ထားတဲ့ model" });
        }

        const STYLE = `
        #app .ib-head { padding: 8px 12px 0; font: 600 13px/1.45 system-ui, "Noto Sans Myanmar", "Myanmar Sangam MN", sans-serif; color: #f1f3f5; }
        #app .ib-note { padding: 0 12px 2px; font: 12px/1.45 system-ui, "Noto Sans Myanmar", "Myanmar Sangam MN", sans-serif; color: #ffc078; }
        #app .ib-list { padding: 0 12px; display: flex; flex-direction: column; font: 13px/1.45 system-ui, "Noto Sans Myanmar", "Myanmar Sangam MN", sans-serif; color: #d9dce2; }
        #app .ib-row { border-bottom: 1px solid #262a33; padding: 2px 0; }
        #app .ib-chip { display: inline-block; font-size: 11px; border-radius: 4px; padding: 0 5px; margin-right: 5px; background: #2d323c; color: #e9ecef; }
        #app .ib-chip[data-group="praise"] { background: #1f3d2a; color: #8fe0a6; }
        #app .ib-chip[data-group="complaint"] { background: #4a1f24; color: #ffb3b8; }
        #app .ib-chip[data-group="question"] { background: #1f2f4a; color: #a5d8ff; }
        #app .ib-chip[data-group="unsorted"] { background: #3a3a3a; color: #dee2e6; }
        #app .ib-badge { display: inline-block; white-space: nowrap; font-size: 11px; margin-left: 5px; color: #8ce99a; }
        #app .ib-badge[data-check="true"] { color: #ffc078; }
        #app .ib-why { display: inline-block; white-space: nowrap; font: 11px/1.4 system-ui, "Noto Sans Myanmar", "Myanmar Sangam MN", sans-serif; margin-left: 5px; color: #d0bfff; background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; }
        #app .ib-reason { font-size: 12px; color: #d0bfff; padding: 0 0 0 4px; }
        `;

        const el = (tag, cls, text, testid) => {
          const node = document.createElement(tag);
          node.className = cls;
          if (text !== undefined) node.textContent = text;
          if (testid) node.dataset.testid = testid;
          return node;
        };

        // The inbox: one row per new message with the group the sorter picked, and whatever cues view()
        // adds (a confidence badge that asks for a check, a "why" button). Clicks redraw it in place.
        export function showInbox(inbox, checked, view, model) {
          if (!document.getElementById("ib-style")) {
            const style = el("style", "", STYLE);
            style.id = "ib-style";
            document.head.append(style);
          }
          const app = document.getElementById("app");
          let line = 0.8;
          const open = new Set();
          const list = el("div", "ib-list", undefined, "inbox");
          app.append(
            el("div", "ib-head", "ဆိုင်ပိုင်ရှင် ရဲ့ message တွေ · AI က ခွဲထားတာပါ"),
            el("div", "ib-note", "အင်္ဂလိပ်လို ရေးထားတာကို မှားတတ်ပါတယ်", "limits"),
            list,
          );
          const draw = () => {
            list.replaceChildren(
              ...inbox.map((m, i) => {
                const n = i + 1;
                const card = view(m.text, line);
                const row = el("div", "ib-row", undefined, `msg-${n}`);
                row.dataset.group = card.group;
                const chip = el("span", "ib-chip", GROUP[card.group], `group-${n}`);
                chip.dataset.group = card.group;
                row.append(chip, m.text);
                if ("check" in card) {
                  const badge = el("span", "ib-badge", card.check ? "သေချာမှု နိမ့် · စစ်ပေးပါ" : "သေချာမှု မြင့်", `badge-${n}`);
                  badge.dataset.check = String(card.check);
                  row.append(badge);
                }
                if (card.why) {
                  const why = el("button", "ib-why", "ဘာကြောင့်လဲ", `why-${n}`);
                  why.type = "button";
                  why.addEventListener("click", () => {
                    if (open.has(n)) open.delete(n);
                    else open.add(n);
                    draw();
                  });
                  row.append(why);
                  if (open.has(n)) {
                    const { group, sure, words } = card.why;
                    row.append(el("div", "ib-reason", `${words.join(" · ")} ကြောင့် ${GROUP[group]} ${pct(sure)}`, `reason-${n}`));
                  }
                }
                return row;
              }),
            );
            showChecks(checked, view, model, line);
          };
          draw();
          if ("check" in view(inbox[0].text, line)) {
            choices("line", ["80%", "95%"], (_choice, i) => {
              line = [0.8, 0.95][i];
              draw();
            }, { label: "စစ်ခိုင်းမယ့် မျဉ်း", selected: "80%" });
          }
        }
