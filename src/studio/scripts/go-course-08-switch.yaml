    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 7108

runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "ပူး\n"
      run-2:
        status: success
        exitCode: 0
        output: "Fri ဆိုတဲ့ နေ့ မရှိပါ\n"
      run-3:
        status: success
        exitCode: 0
        output: "ပူး\n72 B\n"

scenes:
  - id: recall
    chapter: switch ဆိုတာ
    narration: >-
      ပြီးခဲ့တဲ့ lesson မှာ for loop နဲ့ အလုပ် တစ်ခုကို ထပ်ခါထပ်ခါ လုပ်တာကို လေ့လာခဲ့ပါတယ်။ အဲဒီ မတိုင်ခင်
      lesson မှာတော့ if နဲ့ else ကို သုံးပြီး လမ်း နှစ်လမ်း သုံးလမ်းထဲက တစ်လမ်းကို ရွေးခဲ့ပါတယ်။ ဒါပေမဲ့ ရွေးစရာက
      ခုနစ်ခု ရှစ်ခုလောက် ရှိနေရင်ကော ဘယ်လို ရေးမလဲ။ ဒီနေ့ lesson မှာ အဲဒီလို အခြေအနေအတွက် switch ကို
      လေ့လာပါမယ်။ [[mark:board-doors]] ဥပမာ အနေနဲ့ မြန်မာ ဓလေ့ထဲက မွေးနေ့ တိရစ္ဆာန်ကို ယူကြည့်ရအောင်။
      ကိုယ် ဘာနေ့ မွေးလဲ ဆိုတာကို ကြည့်ပြီး တိရစ္ဆာန် တစ်ကောင် သတ်မှတ်ကြပါတယ်။ [[mark:draw-doors]] တနင်္လာနေ့ ဆိုရင်
      ကျား၊ အင်္ဂါနေ့ ခြင်္သေ့၊ ဗုဒ္ဓဟူးနေ့ ဆင်၊ ကြာသပတေးနေ့ ကြွက်၊ သောကြာနေ့ ပူး၊ စနေနေ့ နဂါး၊
      တနင်္ဂနွေနေ့ ဆိုရင်တော့ ဂဠုန် ဖြစ်ပါတယ်။ ဗုဒ္ဓဟူးနေ့ ညနေပိုင်း မွေးရင် ရာဟု လို့ ခွဲပြောကြတာလည်း
      ရှိပေမဲ့၊ ဒီနေ့ program မှာတော့ နေ့ရဲ့ နာမည်ကိုပဲ ကြည့်ပါမယ်။
    sources:
      - {
          title: "The Go Programming Language Specification — Switch statements",
          url: "https://go.dev/ref/spec#Switch_statements",
        }
      - { title: "Effective Go — Switch", url: "https://go.dev/doc/effective_go#switch" }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }
      - {
          id: board-doors,
          type: whiteboard.apply,
          at: { mark: board-doors },
          open: true,
          clear: true,
          upsertIds: [d-title],
        }
      - id: draw-doors
        type: whiteboard.apply
        at: { mark: draw-doors }
        upsertIds:
          [
            d-mon-box,
            d-tue-box,
            d-wed-box,
            d-thu-box,
            d-fri-box,
            d-sat-box,
            d-sun-box,
            d-mon,
            d-tue,
            d-wed,
            d-thu,
            d-fri,
            d-sat,
            d-sun,
            d-mon-a,
            d-tue-a,
            d-wed-a,
            d-thu-a,
            d-fri-a,
            d-sat-a,
            d-sun-a,
          ]
        drawMs: 4000

  - id: doors
    narration: >-
      [[mark:draw-default]] board ပေါ်က တံခါး တစ်ပေါက်စီကို case လို့ ခေါ်ပါတယ်။ case တစ်ခုစီမှာ နေ့ နာမည်
      တစ်ခုစီ ကပ်ထားပြီး၊ နောက်ဆုံး တံခါးကတော့ default ပါ။ အပေါ်က case တစ်ခုနဲ့မှ မကိုက်တဲ့အခါ အဲဒီ
      တံခါးကို ဖွင့်ပါတယ်။ [[mark:draw-pick]] switch က variable တစ်ခုရဲ့ တန်ဖိုးကို တစ်ခါ ကြည့်ပြီး၊ အဲဒီ
      တန်ဖိုးနဲ့ ကိုက်တဲ့ တံခါး တစ်ပေါက်တည်းကို ဖွင့်ပေးပါတယ်။ ဥပမာ တန်ဖိုးက Friday ဆိုရင် Friday တံခါးကိုပဲ
      ဖွင့်ပြီး၊ ကျန်တဲ့ တံခါးတွေကို လုံးဝ မဖွင့်ပါဘူး။ [[mark:draw-rule]] if နဲ့ else ကိုပဲ သုံးပြီး ရေးလည်း
      ရပါတယ်။ ဒါပေမဲ့ နေ့ ခုနစ်နေ့ အတွက် တူညီတဲ့ နှိုင်းယှဉ်ချက်ကို ခုနစ်ခါ ထပ်ရေးရမှာပါ။ switch ကတော့ ဘာကို
      ကြည့်မလဲ ဆိုတာကို ထိပ်မှာ တစ်ခါပဲ ရေးပြီး၊ ရွေးစရာတွေကို အောက်မှာ စီထားလို့ ဖတ်ရတာ ပိုရှင်းပါတယ်။
    sources:
      - {
          title: "The Go Programming Language Specification — Expression switches",
          url: "https://go.dev/ref/spec#Expression_switches",
        }
      - { title: "Effective Go — Switch", url: "https://go.dev/doc/effective_go#switch" }
    actions:
      - {
          id: draw-default,
          type: whiteboard.apply,
          at: { mark: draw-default },
          upsertIds: [d-def-box, d-def, d-def-a],
          drawMs: 1500,
        }
      - {
          id: draw-pick,
          type: whiteboard.apply,
          at: { mark: draw-pick },
          upsertIds: [d-value, d-pick],
          drawMs: 1800,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: draw-rule },
          upsertIds: [d-rule],
          drawMs: 1200,
        }

  - id: write
    chapter: switch ကို ရေးကြည့်ရအောင်
    narration: >-
      [[mark:close-doors]] ဒါဆို code နဲ့ ရေးကြည့်ရအောင်။ [[mark:sel-day]] main ထဲမှာ day ဆိုတဲ့ variable
      ရှိပြီး Friday လို့ ထည့်ထားပါတယ်။ ၂၀၂၆ ခုနှစ်ရဲ့ မြန်မာ နှစ်သစ်ကူးနေ့က သောကြာနေ့ ကျလို့
      အဲဒီ နေ့ကို ယူထားတာပါ။ နောက်ပိုင်း lesson တစ်ခုမှာတော့ ဒီ နေ့ နာမည်ကို ရက်စွဲကနေ Go က ကိုယ်တိုင် တွက်ပေးတာကို တွေ့ရပါမယ်။
      [[mark:type-switch-a]] အခု အောက်မှာ switch ကို ရေးပါမယ်။ ထိပ်ဆုံး line မှာ switch ဆိုတဲ့
      keyword နောက်က day ကို ရေးထားလို့၊ ဒီ switch က day ရဲ့ တန်ဖိုးကို ကြည့်မှာပါ။ အောက်က case တစ်ခုစီမှာ
      နေ့ နာမည် တစ်ခုကို ရေးပြီး၊ အဲဒီ နေ့နဲ့ ကိုက်ရင် လုပ်ရမယ့် အလုပ်ကို နောက် line မှာ ရေးပါတယ်။ ဒီမှာတော့
      ကိုက်တဲ့ တိရစ္ဆာန် နာမည်ကို print ထုတ်တာပါ။ [[mark:sel-case]] ပထမ case ကို ကြည့်ပါ။ day ထဲမှာ Monday
      ရှိရင် ကျား လို့ ထုတ်ပြမယ်လို့ ပြောတာပါ။ case တစ်ခုရဲ့ အလုပ်က နောက် case မရောက်ခင်အထိ ရှိတဲ့ line
      တွေပါ။ [[mark:type-switch-b]] ကျန်တဲ့ သောကြာ၊ စနေ၊ တနင်္ဂနွေ အတွက် case တွေကိုလည်း အဲဒီ ပုံစံအတိုင်း
      ဆက်ထည့်ပါမယ်။ ဒါဆို case ခုနစ်ခု ရှိသွားပါပြီ။ day ထဲမှာ Friday ရှိနေတော့ ဘာ ထွက်လာမလဲ ကြည့်ရအောင်။
      [[mark:run-1]] ကဲ၊ run လိုက်ရအောင်။
    sources:
      - {
          title: "The Go Programming Language Specification — Expression switches",
          url: "https://go.dev/ref/spec#Expression_switches",
        }
    actions:
      - {
          id: close-doors,
          type: whiteboard.apply,
          at: { mark: close-doors },
          open: false,
          upsertIds: [],
        }
      - id: sel-day
        type: editor.select
        at: { mark: sel-day }
        target: { file: main.go, text: 'day := "Friday"', occurrence: 1 }
      - id: type-switch-a
        type: editor.type
        at: { mark: type-switch-a }
        target: { file: main.go, after: "\tday := \"Friday\"\n", occurrence: 1 }
        text: "\tswitch day {\n\tcase \"Monday\":\n\t\tfmt.Println(\"ကျား\")\n\tcase \"Tuesday\":\n\t\tfmt.Println(\"ခြင်္သေ့\")\n\tcase \"Wednesday\":\n\t\tfmt.Println(\"ဆင်\")\n\tcase \"Thursday\":\n\t\tfmt.Println(\"ကြွက်\")\n\t}\n"
        cadence: line-by-line
      - id: sel-case
        type: editor.select
        at: { mark: sel-case }
        target:
          { file: main.go, text: "\tcase \"Monday\":\n\t\tfmt.Println(\"ကျား\")\n", occurrence: 1 }
      - id: type-switch-b
        type: editor.type
        at: { mark: type-switch-b }
        target: { file: main.go, after: "\t\tfmt.Println(\"ကြွက်\")\n", occurrence: 1 }
        text: "\tcase \"Friday\":\n\t\tfmt.Println(\"ပူး\")\n\tcase \"Saturday\":\n\t\tfmt.Println(\"နဂါး\")\n\tcase \"Sunday\":\n\t\tfmt.Println(\"ဂဠုန်\")\n"
        cadence: line-by-line
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "ပူး",
          timeoutMs: 8000,
        }
      - {
          id: expect-file-switch,
          type: expect.file,
          at: { afterAction: run-1 },
          path: main.go,
          contains: "\tswitch day {\n",
        }

  - id: one-case
    chapter: case တစ်ခုပဲ run တယ်
    narration: >-
      [[mark:point-1]] output မှာ ပူး ဆိုတဲ့ စာ တစ်ကြောင်းတည်း ထွက်လာပါတယ်။ day ထဲမှာ Friday ရှိလို့ Friday
      case တစ်ခုတည်း run သွားတာပါ။ [[mark:no-fall]] သတိထားရမှာက Friday case ရဲ့ အောက်မှာ Saturday နဲ့ Sunday
      case တွေ ရှိနေပေမဲ့၊ နဂါး နဲ့ ဂဠုန် ကို ထုတ်မပြတာပါ။ Go ရဲ့ switch မှာ ကိုက်တဲ့ case တစ်ခုကို run
      ပြီးတာနဲ့ switch တစ်ခုလုံး ပြီးသွားပါတယ်။ ပြီးခဲ့တဲ့ lesson မှာ loop ကနေ ထွက်ဖို့ break ကို
      သုံးခဲ့ပေမဲ့၊ switch မှာတော့ break ရေးပေးစရာ မလိုပါဘူး၊ Go က case တစ်ခု ပြီးတာနဲ့ အလိုအလျောက် ထွက်ပေးလို့ပါ။
    sources:
      - { title: "Effective Go — Switch", url: "https://go.dev/doc/effective_go#switch" }
      - {
          title: "The Go Programming Language Specification — Expression switches",
          url: "https://go.dev/ref/spec#Expression_switches",
        }
    actions:
      - { id: point-1, type: console.point, at: { mark: point-1 }, target: { text: "ပူး" } }

  - id: default
