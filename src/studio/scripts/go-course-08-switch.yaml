  - id: bands
    chapter: တန်ဖိုး မပါတဲ့ switch
    narration: >-
      [[mark:board-bands]] switch မှာ နောက်ထပ် ပုံစံ တစ်မျိုး ရှိပါသေးတယ်။ စာမေးပွဲ အမှတ် ဥပမာကို
      ပြန်ယူကြည့်ရအောင်။ [[mark:draw-bands]] အမှတ် ရှစ်ဆယ်နဲ့ အထက်ဆိုရင် A၊ ခြောက်ဆယ်နဲ့ အထက်ဆိုရင် B၊
      ကျန်တာ အားလုံးကတော့ C ပါ။ ဒီမှာ တန်ဖိုး တစ်ခုနဲ့ ကိုက်လား မကိုက်လား စစ်တာ မဟုတ်ဘဲ၊ ကြီးလား ငယ်လား
      ဆိုတဲ့ condition တွေ ဖြစ်နေပါတယ်။ [[mark:draw-order]] အဲဒီလို အခါမျိုးမှာ switch ရဲ့ နောက်မှာ ဘာမှ
      မရေးဘဲ၊ case တစ်ခုစီမှာ condition တစ်ခုစီ ရေးလို့ ရပါတယ်။ Go က case တွေကို အပေါ်ကနေ အောက်ကို
      တစ်ခုချင်း စစ်ပြီး၊ ပထမဆုံး true ဖြစ်တဲ့ case ကို run ပါတယ်။ [[mark:draw-72]] ဥပမာ ခုနစ်ဆယ့်နှစ် မှတ်
      ဆိုရင် ပထမ condition က false ဖြစ်ပြီး ဒုတိယ condition က true ဖြစ်လို့ B ရပါတယ်။ ဒါက if နဲ့ else if
      တွေကို ဆက်ရေးတာနဲ့ အတူတူပါပဲ၊ ဒါပေမဲ့ ဖတ်ရတာ ပိုသပ်ရပ်ပါတယ်။
    sources:
      - {
          title: "The Go Programming Language Specification — Expression switches",
          url: "https://go.dev/ref/spec#Expression_switches",
        }
      - { title: "Effective Go — Switch", url: "https://go.dev/doc/effective_go#switch" }
    actions:
      - {
          id: board-bands,
          type: whiteboard.apply,
          at: { mark: board-bands },
          open: true,
          clear: true,
          upsertIds: [b-title],
        }
      - {
          id: draw-bands,
          type: whiteboard.apply,
          at: { mark: draw-bands },
          upsertIds: [b-a-box, b-b-box, b-c-box, b-a, b-b, b-c],
          drawMs: 2400,
        }
      - {
          id: draw-order,
          type: whiteboard.apply,
          at: { mark: draw-order },
          upsertIds: [b-order, b-order-label, b-rule],
          drawMs: 2000,
        }
      - {
          id: draw-72,
