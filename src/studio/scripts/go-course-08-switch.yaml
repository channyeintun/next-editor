    narration: >-
      [[mark:collapse-1]] ဒါဆို day ထဲကို ဘယ် case နဲ့မှ မကိုက်တဲ့ တန်ဖိုး ရောက်လာရင် ဘာဖြစ်မလဲ။ ဥပမာ
      တစ်ယောက်ယောက်က Friday ကို အတိုကောက် ရေးလိုက်တယ် ဆိုပါစို့။ [[mark:type-fri]] ဒီ line က day ထဲကို
      တန်ဖိုး အသစ် ပြန်ထည့်တာပါ။ switch မတိုင်ခင်မှာ ရှိလို့ switch က ဒီ တန်ဖိုး အသစ်ကို မြင်ရမှာပါ။
      [[mark:type-default]] ပြီးတော့ switch ရဲ့ အောက်ဆုံးမှာ default ကို ထည့်ပါမယ်။ default ဆိုတာ အပေါ်က case
      တစ်ခုမှ မကိုက်တဲ့အခါ run မယ့် အပိုင်းပါ။ ဒီမှာတော့ day ထဲက တန်ဖိုးနဲ့အတူ အဲဒီ နေ့ မရှိပါဘူး ဆိုတဲ့ စာကို
      ထုတ်ပြပါမယ်။ default မပါရင်တော့ ဘယ် case နဲ့မှ မကိုက်တဲ့အခါ switch က ဘာမှ မလုပ်ဘဲ ကျော်သွားမှာပါ။
      [[mark:run-2]] ကဲ၊ run ကြည့်ရအောင်။
    sources:
