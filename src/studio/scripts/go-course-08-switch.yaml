# Go course, lesson 08: switch (Burmese).
#
# Start state: main.go with `package main`, `import "fmt"` and `day := "Friday"` in main.
# Edits, all insert-only:
#   1. `switch day {` with the Monday-Thursday cases and the closing brace, then the
#      Friday-Sunday cases -> run-1: ပူး (one case runs; the cases below it do not);
#   2. `day = "Fri"` under the first line and a `default` case -> run-2: Fri ဆိုတဲ့ နေ့ မရှိပါ;
#   3. `, "Fri"` into the Friday case (several values in one case), then `mark := 72` and a
#      tagless switch on the mark bands -> run-3: ပူး / 72 B.
# Boards: (D) eight doors (seven days + default), exactly one opens; (B) the mark bands checked
# from the top; (Q) quiz: the same value in two cases is a compile error.
# Fixtures: bun ~/Documents/go-course-work/tools/sim-go.ts <this yaml> --write
schemaVersion: 1

