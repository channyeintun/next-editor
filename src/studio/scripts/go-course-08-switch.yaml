      ဒါကို အပေါ်ဆုံးမှာ ထားရပါမယ်။ ဘာကြောင့်လဲဆိုတော့ ရှစ်ဆယ် ပြည့်တဲ့ အမှတ်က ခြောက်ဆယ်ထက်လည်း
      များတာမို့၊ ခြောက်ဆယ် case က အပေါ်မှာ ရှိနေရင် A ရမယ့်သူကို B လို့ ပြမိမှာ ဖြစ်လို့ပါ။ [[mark:run-3]] ကဲ၊
      run လိုက်ရအောင်။
    sources:
      - {
          title: "The Go Programming Language Specification — Switch statements",
