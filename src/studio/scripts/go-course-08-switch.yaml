        target:
          { file: main.go, after: "\t\tfmt.Println(day, \"ဆိုတဲ့ နေ့ မရှိပါ\")\n\t}\n", occurrence: 1 }
        text: "\tmark := 72\n\tswitch {\n\tcase mark >= 80:\n\t\tfmt.Println(mark, \"A\")\n\tcase mark >= 60:\n\t\tfmt.Println(mark, \"B\")\n\tdefault:\n\t\tfmt.Println(mark, \"C\")\n\t}\n"
        cadence: line-by-line
      - id: sel-band
        type: editor.select
        at: { mark: sel-band }
        target: { file: main.go, text: "case mark >= 80:", occurrence: 1 }
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "72 B",
          timeoutMs: 8000,
        }
      - {
          id: expect-file-short,
          type: expect.file,
          at: { afterAction: run-3 },
          path: main.go,
          contains: "\tcase \"Friday\", \"Fri\":\n",
        }
      - {
          id: expect-file-tagless,
          type: expect.file,
          at: { afterAction: run-3 },
          path: main.go,
          contains: "\tswitch {\n\tcase mark >= 80:\n",
        }

  - id: read-3
    narration: >-
      [[mark:point-3a]] ပထမ စာကြောင်းမှာ ပူး ပြန်ထွက်လာပါပြီ။ day ထဲမှာ Fri ပဲ ရှိနေပေမဲ့၊ Friday case က Fri
      ကိုပါ လက်ခံလို့ပါ။ [[mark:point-3b]] ဒုတိယ စာကြောင်းမှာတော့ ခုနစ်ဆယ့်နှစ် နဲ့ B ကို တွေ့ရပါတယ်။ ရှစ်ဆယ်
      မပြည့်လို့ ပထမ case ကို ကျော်သွားပြီး၊ ခြောက်ဆယ် ကျော်လို့ ဒုတိယ case မှာ ရပ်သွားတာပါ။ default ကိုတော့
      မရောက်တော့ပါဘူး။
    sources:
      - {
          title: "The Go Programming Language Specification — Expression switches",
          url: "https://go.dev/ref/spec#Expression_switches",
        }
    actions:
      - { id: point-3a, type: console.point, at: { mark: point-3a }, target: { text: "ပူး" } }
      - { id: point-3b, type: console.point, at: { mark: point-3b }, target: { text: "72 B" } }

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >-
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ board ပေါ်က code မှာ Friday case ထဲကို Fri ကို ထည့်ထားပြီးသားပါ။
      [[mark:quiz-line]] အဲဒီ အောက်မှာ Fri အတွက်ပဲ case တစ်ခု ထပ်ရေးထားပြီး၊ သောကြာ လို့ ထုတ်ပြခိုင်းထားပါတယ်။
      ဒီ program ကို run ရင် ပထမ case က ပူး လို့ ထုတ်ပြမလား၊ ဒါမှမဟုတ် compile error ရမလား။ lesson ကို pause
      လုပ်ပြီး စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] အဖြေကတော့ ခ ပါ၊ ဒီ program ကို compiler က လက်မခံပါဘူး။ ဘာကြောင့်လဲဆိုတော့ တန်ဖိုး
      တစ်ခုတည်းကို case နှစ်ခုမှာ ထပ်ရေးထားရင်၊ အပေါ်က case ကပဲ အမြဲ ကိုက်မှာမို့ အောက်က case က ဘယ်တော့မှ
      run ခွင့် ရမှာ မဟုတ်လို့ပါ။ ဒါက ရေးမှားထားတာ သေချာသလောက် ဖြစ်လို့၊ compiler က တန်ဖိုး ထပ်နေတယ် ဆိုပြီး
      run မလုပ်ခင်ကတည်းက ငြင်းပါတယ်။
    sources:
      - {
          title: "The Go Programming Language Specification — Expression switches",
          url: "https://go.dev/ref/spec#Expression_switches",
        }
    actions:
      - { id: collapse-3, type: runtime.collapseDock, at: { mark: quiz } }
      - {
          id: quiz,
          type: whiteboard.apply,
          at: { afterAction: collapse-3 },
          open: true,
          clear: true,
          upsertIds: [q-title, q-code, q-l1, q-l2, q-l3, q-l4, q-l5, q-l6, q-l7, q-a, q-b],
        }
      - {
          id: quiz-line,
          type: whiteboard.apply,
          at: { mark: quiz-line },
          upsertIds: [q-mark],
          drawMs: 900,
        }
      - {
          id: quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-check],
          drawMs: 700,
        }

  - id: recap
    chapter: ပြန်ချုပ်ရရင်
    narration: >-
      [[mark:close-quiz]] ဒါဆို ပြန်ချုပ်ရရင်၊ [[mark:recap-switch]] switch က variable တစ်ခုရဲ့ တန်ဖိုးကို တစ်ခါ
      ကြည့်ပြီး ကိုက်တဲ့ case တစ်ခုတည်းကို run ပါတယ်၊ run ပြီးတာနဲ့ switch ပြီးသွားပါတယ်။ [[mark:recap-short]]
      case တစ်ခုမှာ တန်ဖိုး အများ ထည့်လို့ ရပြီး၊ [[mark:recap-default]] ဘာနဲ့မှ မကိုက်ရင်တော့ default ကို
      run ပါတယ်။ [[mark:recap-tagless]] switch နောက်မှာ တန်ဖိုး မရေးရင်တော့ case တွေမှာ condition ရေးပြီး၊ if
      နဲ့ else တွေကို ပိုသပ်ရပ်အောင် ရေးတာ ဖြစ်ပါတယ်။ နောက် lesson မှာတော့ အလုပ် တစ်ခုကို နာမည်ပေးထားပြီး
      လိုတဲ့အခါ ခေါ်သုံးလို့ရတဲ့ function အကြောင်းကို လေ့လာသွားပါမယ်။
    sources:
      - { title: "Effective Go — Switch", url: "https://go.dev/doc/effective_go#switch" }
    actions:
      - {
          id: close-quiz,
          type: whiteboard.apply,
          at: { mark: close-quiz },
          open: false,
          upsertIds: [],
        }
      - id: recap-switch
        type: editor.select
        at: { mark: recap-switch }
        target: { file: main.go, text: "switch day {", occurrence: 1 }
      - id: recap-short
        type: editor.select
        at: { mark: recap-short }
        target: { file: main.go, text: 'case "Friday", "Fri":', occurrence: 1 }
      - id: recap-default
        type: editor.select
        at: { mark: recap-default }
        target: { file: main.go, text: "default:", occurrence: 1 }
      - id: recap-tagless
        type: editor.select
        at: { mark: recap-tagless }
        target: { file: main.go, text: "switch {", occurrence: 1 }

checks:
  - { type: timing.p95Ms, max: 300 }
