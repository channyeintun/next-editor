# TypeScript course, lesson 02: what the editor does with TypeScript (Burmese).
#
# Start state (ws/): src/order.ts describes an order (customer, item, quantity, an optional note)
# and computes its total; src/main.ts builds two orders and prints them. Three real problems are
# in the start state on purpose, so the panel (data-modes "errors types output") lists 3 errors
# and the program prints NaN for the tea and then crashes:
#   - a misspelled `quantiy` key            -> TS2561 at the key ("Did you mean ... 'quantity'?"),
#                                              Output "လက်ဖက်ရည် NaN ကျပ်" (no crash, wrong answer)
#   - a table number that came from a form as text "7" -> TS2345, a 3-line error at the call
#   - `order.note.trim()` on an optional note -> TS18048, and the run stops with
#                                              "Uncaught TypeError: Cannot read properties of undefined (reading 'trim')"
# Fixes, all insert-only: `?` and ` ?? "မရှိပါ"` (crash gone), the missing `t` (3000 Kyat), and
# `Number(` + `)` around "7" (0 errors). Then a `^?` query on the orderTotal call shows its
# parameter and return types, and a JSDoc block (description + @example) above orderTotal adds its
# text to the Types section. Boards: (A) the editor and the TypeScript server, (B) reading the
# 3-line error from the bottom up, (C) the VS Code features the recording cannot show.
#
# Build: bun ~/Documents/typescript-course-work/tools/build-lesson.ts template.yaml ws typescript-course-02-editor-superpowers.yaml
schemaVersion: 1
lesson:
  slug: typescript-course-02-editor-superpowers
  title: "TypeScript course 02: Editor က ဘယ်လို ကူညီပေးလဲ"
  locale: my-MM
  workspace:
    lessonType: typescript
    name: TypeScript course
    entryFilePath: src/main.ts
    files:
      course/checker.js: |
        // TypeScript course · type checker (Vite plugin, runs in the dev server).
        // Checks every file of the project with the real TypeScript compiler and sends the
        // errors, the `// ^?` type queries, the JavaScript output and a runnable copy of the
        // program to the preview page (course/panel.js) after every change.
        import ts from "typescript";
        import { existsSync, readFileSync } from "node:fs";
        import { isAbsolute, join, relative, resolve } from "node:path";

        const EVENT = "course:ts";
        const DEBOUNCE_MS = 200;
        const QUERY = /^(\s*)\/\/(\s*)\^\?\s*$/;

        export default function courseTypeChecker() {
          return {
            name: "course-type-checker",
            apply: "serve",
            configureServer(server) {
              const checker = createChecker(server.config.root);
              let wants = { js: [], dts: [] };
              let latest = checker.check(wants, 1);
              let seq = 1;
              let timer = null;
              const publish = () => {
                timer = null;
                latest = checker.check(wants, ++seq);
                server.ws.send({ type: "custom", event: EVENT, data: latest });
              };
              const schedule = () => {
                if (timer) clearTimeout(timer);
                timer = setTimeout(publish, DEBOUNCE_MS);
              };
              server.watcher.on("all", (_event, file) => {
                if (checker.watches(file)) schedule();
              });
              server.ws.on(`${EVENT}:hello`, (data, client) => {
                const next = {
                  js: Array.isArray(data?.js) ? data.js.map(String) : [],
                  dts: Array.isArray(data?.dts) ? data.dts.map(String) : [],
                };
                if (JSON.stringify(next) !== JSON.stringify(wants)) {
                  wants = next;
                  latest = checker.check(wants, ++seq);
                }
                client.send(EVENT, latest);
              });
            },
          };
        }

        function createChecker(root) {
          const configPath = join(root, "tsconfig.json");
          const contents = new Map(); // project file -> { text, version }
          let configText = null;
          let parsed = null;

          const isProjectFile = (file) => {
            const rel = relative(root, file);
            return !rel.startsWith("..") && !isAbsolute(rel) && !rel.split(/[\\/]/).includes("node_modules");
          };

          const readConfig = () => {
            const text = existsSync(configPath) ? readFileSync(configPath, "utf8") : "{}";
            if (text === configText && parsed) return;
            configText = text;
            const host = {
              useCaseSensitiveFileNames: ts.sys.useCaseSensitiveFileNames,
              readDirectory: ts.sys.readDirectory,
              fileExists: ts.sys.fileExists,
              readFile: (file) => (resolve(file) === configPath ? text : ts.sys.readFile(file)),
              getCurrentDirectory: () => root,
              onUnRecoverableConfigFileDiagnostic: () => {},
            };
            parsed = ts.getParsedCommandLineOfConfigFile(configPath, {}, host) ?? {
              options: {},
              fileNames: [],
              errors: [],
            };
          };

          const version = (file) => {
            if (!isProjectFile(file)) return "0";
            const text = ts.sys.readFile(file) ?? "";
            const known = contents.get(file);
            if (known && known.text === text) return String(known.version);
            const next = { text, version: (known?.version ?? 0) + 1 };
            contents.set(file, next);
            return String(next.version);
          };

          readConfig();
          const host = {
            getScriptFileNames: () => parsed.fileNames,
            getScriptVersion: version,
            getScriptSnapshot: (file) => {
              const text = ts.sys.readFile(file);
              return text === undefined ? undefined : ts.ScriptSnapshot.fromString(text);
            },
            getCurrentDirectory: () => root,
            getCompilationSettings: () => parsed.options,
            getDefaultLibFileName: (options) => ts.getDefaultLibFilePath(options),
            fileExists: ts.sys.fileExists,
            readFile: ts.sys.readFile,
            readDirectory: ts.sys.readDirectory,
            directoryExists: ts.sys.directoryExists,
            getDirectories: ts.sys.getDirectories,
            realpath: ts.sys.realpath,
          };
          const service = ts.createLanguageService(host, ts.createDocumentRegistry());

          const rel = (file) => relative(root, file).split("\\").join("/");
          const toDiagnostic = (d) => {
            const out = {
              file: d.file ? rel(d.file.fileName) : rel(configPath),
              line: 0,
              col: 0,
              code: d.code,
              category: ts.DiagnosticCategory[d.category].toLowerCase(),
              // Project paths print relative to the project, so a message reads the same everywhere.
              message: ts.flattenDiagnosticMessageText(d.messageText, "\n").split(`${root}/`).join(""),
            };
            if (d.file && d.start !== undefined) {
              const pos = d.file.getLineAndCharacterOfPosition(d.start);
              out.line = pos.line + 1;
              out.col = pos.character + 1;
            }
            return out;
          };

          const queries = (file) => {
            const text = ts.sys.readFile(file) ?? "";
            const lines = text.split("\n");
            const found = [];
            let offset = 0;
            const starts = lines.map((line) => {
              const start = offset;
              offset += line.length + 1;
              return start;
            });
            for (let i = 1; i < lines.length; i++) {
              const m = QUERY.exec(lines[i].replace(/\r$/, ""));
              if (!m) continue;
              const col = lines[i].indexOf("^");
              const target = lines[i - 1];
              let info;
              for (const dc of [0, -1, 1, -2, 2]) {
                const c = col + dc;
                if (c < 0 || c >= target.length) continue;
                info = service.getQuickInfoAtPosition(file, starts[i - 1] + c);
                if (info) break;
              }
              found.push({
                file: rel(file),
                line: i,
                col: col + 1,
                text: info ? ts.displayPartsToString(info.displayParts) : "",
                docs: info ? ts.displayPartsToString(info.documentation) : "",
                tags: info?.tags
                  ? info.tags.map((t) => `@${t.name} ${ts.displayPartsToString(t.text ?? [])}`.trim())
                  : [],
              });
            }
            return found;
          };

          const runnable = (file, options) => {
            const text = ts.sys.readFile(file) ?? "";
            return ts.transpileModule(text, {
              fileName: file,
              reportDiagnostics: false,
              compilerOptions: {
                target: ts.ScriptTarget.ES2022,
                module: ts.ModuleKind.CommonJS,
                jsx: options.jsx ?? ts.JsxEmit.ReactJSX,
                jsxImportSource: options.jsxImportSource,
                esModuleInterop: true,
                experimentalDecorators: options.experimentalDecorators,
                useDefineForClassFields: true,
              },
            }).outputText;
          };

          const emitted = (file, options) => {
            const text = ts.sys.readFile(file) ?? "";
            return ts.transpileModule(text, {
              fileName: file,
              reportDiagnostics: false,
              compilerOptions: { ...options, noEmit: false, declaration: false, sourceMap: false, inlineSourceMap: false },
            }).outputText;
          };

          return {
            watches: (file) => isProjectFile(resolve(file)) && /\.(c|m)?(ts|tsx|js|jsx)$|tsconfig\.json$/.test(file),
            check(wants, seq) {
              const started = Date.now();
              readConfig();
              const program = service.getProgram();
              const files = program
                .getSourceFiles()
                .map((sf) => sf.fileName)
                .filter((f) => isProjectFile(f));
              const diagnostics = [];
              const config = [...parsed.errors, ...program.getOptionsDiagnostics(), ...program.getGlobalDiagnostics()];
              for (const d of config) diagnostics.push(toDiagnostic(d));
              const syntax = {};
              for (const f of files) {
                const syn = service.getSyntacticDiagnostics(f);
                syntax[rel(f)] = syn.length;
                for (const d of syn) diagnostics.push(toDiagnostic(d));
                for (const d of service.getSemanticDiagnostics(f)) diagnostics.push(toDiagnostic(d));
              }
              const types = files.flatMap((f) => queries(f));
              const run = {};
              // Everything under src/ runs, including .js files the type check leaves out.
              const runnables = new Set(files);
              const srcDir = join(root, "src");
              if (ts.sys.directoryExists(srcDir)) {
                for (const f of ts.sys.readDirectory(srcDir, [".ts", ".tsx", ".js", ".jsx", ".mts", ".mjs"])) runnables.add(resolve(f));
              }
              for (const f of runnables) if (!f.endsWith(".d.ts")) run[rel(f)] = runnable(f, parsed.options);
              const js = {};
              for (const name of wants.js) {
                const f = join(root, name);
                if (existsSync(f)) js[name] = emitted(f, parsed.options);
              }
              const dts = {};
              for (const name of wants.dts) {
                const f = join(root, name);
                if (!existsSync(f)) continue;
                const out = service.getEmitOutput(f, true, true);
                dts[name] = out.outputFiles.find((o) => o.name.endsWith(".d.ts"))?.text ?? "";
              }
              return {
                seq,
                ms: Date.now() - started,
                files: files.map(rel),
                syntax,
                diagnostics,
                types,
                run,
                js,
                dts,
              };
            },
          };
        }
      course/panel.js: |
        // TypeScript course · panel (runs in the preview page).
        // Shows what course/checker.js reports: the errors, the `// ^?` types, the program's
        // output and, when asked for, the JavaScript or .d.ts that TypeScript emits.
        //
        //   <script type="module" src="/course/panel.js"
        //           data-modes="errors types output" data-run="src/main.ts"
        //           data-js="src/menu.ts" data-dts="src/menu.ts"></script>
        const EVENT = "course:ts";
        const script = document.querySelector('script[src$="/course/panel.js"]');
        const modes = new Set((script?.dataset.modes || "errors types output").split(/\s+/).filter(Boolean));
        const entry = script?.dataset.run || "src/main.ts";
        const jsFiles = (script?.dataset.js || "").split(/\s+/).filter(Boolean);
        const dtsFiles = (script?.dataset.dts || "").split(/\s+/).filter(Boolean);
        if (jsFiles.length) modes.add("js");
        if (dtsFiles.length) modes.add("dts");

        const STYLE = `
        :root { color-scheme: dark; }
        html, body { margin: 0; background: #16181d; }
        #ts-panel { font: 13px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", "Noto Sans Myanmar", "Myanmar Sangam MN", "Myanmar Text", monospace; color: #d7dae0; padding: 0 0 24px; }
        #ts-panel * { box-sizing: border-box; }
        .tsp-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #1f2229; border-bottom: 1px solid #2c313a; }
        .tsp-logo { font-weight: 700; color: #fff; background: #3178c6; border-radius: 4px; padding: 1px 6px; font-size: 12px; }
        .tsp-title { font-weight: 600; color: #fff; }
        .tsp-status { margin-left: auto; font-weight: 600; padding: 2px 10px; border-radius: 999px; font-size: 12px; }
        .tsp-status[data-state="ok"] { background: #1f3d2a; color: #8fe0a6; }
        .tsp-status[data-state="errors"] { background: #4a1f24; color: #ffb3b8; }
        .tsp-status[data-state="waiting"] { background: #2c313a; color: #c2c7d0; }
        .tsp-sec { padding: 10px 14px 4px; }
        .tsp-sec-title { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #9aa3b2; margin: 0 0 6px; font-weight: 600; }
        .tsp-empty { color: #8a93a3; }
        .tsp-err { border-left: 3px solid #f2545b; background: #22191c; padding: 6px 10px; margin: 0 0 6px; border-radius: 0 4px 4px 0; }
        .tsp-loc { color: #ff9ca1; }
        .tsp-code { color: #c2c7d0; margin-left: 8px; }
        .tsp-msg { white-space: pre-wrap; overflow-wrap: anywhere; color: #f1f2f4; }
        .tsp-type { border-left: 3px solid #4ea1ff; background: #182130; padding: 6px 10px; margin: 0 0 6px; border-radius: 0 4px 4px 0; }
        .tsp-type-text { white-space: pre-wrap; overflow-wrap: anywhere; color: #e8f1ff; }
        .tsp-docs { white-space: pre-wrap; color: #b9c4d6; margin-top: 4px; font-family: system-ui, "Noto Sans Myanmar", "Myanmar Sangam MN", sans-serif; }
        .tsp-out { white-space: pre-wrap; overflow-wrap: anywhere; padding: 2px 10px; border-left: 3px solid #3a404b; margin: 0 0 2px; }
        .tsp-out[data-level="warn"] { border-color: #e0a800; color: #ffe08a; }
        .tsp-out[data-level="error"] { border-color: #f2545b; color: #ffb3b8; }
        .tsp-pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #1d2027; border: 1px solid #2c313a; border-radius: 4px; padding: 8px 10px; margin: 0 0 8px; color: #e6e6e6; }
        .tsp-file { color: #9aa3b2; margin: 0 0 4px; }
        .tsp-kw { color: #c792ea; } .tsp-str { color: #c3e88d; } .tsp-num { color: #f78c6c; } .tsp-com { color: #7f8a99; }
        `;

        const el = (tag, attrs = {}, ...children) => {
          const node = document.createElement(tag);
          for (const [k, v] of Object.entries(attrs)) {
            if (v === undefined || v === null) continue;
            if (k === "class") node.className = v;
            else node.setAttribute(k, String(v));
          }
          for (const child of children.flat()) {
            if (child === null || child === undefined || child === false) continue;
            node.append(child instanceof Node ? child : document.createTextNode(String(child)));
          }
          return node;
        };

        const style = document.createElement("style");
        style.textContent = STYLE;
        document.head.append(style);

        const appTemplate = document.getElementById("app")?.cloneNode(true) ?? null;
        const panel = el("section", { id: "ts-panel", "data-testid": "ts-panel", "data-seq": "0", "aria-label": "TypeScript" });
        document.body.append(panel);

        const status = el("span", { class: "tsp-status", "data-testid": "ts-status", "data-state": "waiting", "data-count": "" }, "checking…");
        panel.append(el("div", { class: "tsp-head" }, el("span", { class: "tsp-logo" }, "TS"), el("span", { class: "tsp-title" }, "TypeScript"), status));

        const sections = {};
        const addSection = (mode, title) => {
          const body = el("div", { "data-testid": `ts-${mode}` });
          sections[mode] = body;
          panel.append(el("div", { class: "tsp-sec" }, el("h2", { class: "tsp-sec-title" }, title), body));
        };
        const TITLES = { errors: "Errors", types: "Types", output: "Output", js: "JavaScript output", dts: "Declaration output" };
        // Sections appear in the order data-modes names them.
        for (const mode of modes) if (TITLES[mode]) addSection(mode, TITLES[mode]);

        // ---------------------------------------------------------------- rendering
        const short = (file) => file.replace(/^src\//, "");
        const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

        function renderErrors(diagnostics) {
          const errors = diagnostics.filter((d) => d.category === "error");
          status.dataset.state = errors.length ? "errors" : "ok";
          status.dataset.count = String(errors.length);
          status.textContent = errors.length ? `✖ ${plural(errors.length, "error", "errors")}` : "✓ No errors";
          const body = sections.errors;
          if (!body) return;
          body.dataset.count = String(errors.length);
          if (!errors.length) {
            body.replaceChildren(el("div", { class: "tsp-empty" }, "No errors."));
            return;
          }
          body.replaceChildren(
            ...errors.map((d, i) =>
              el(
                "div",
                { class: "tsp-err", "data-testid": `ts-error-${i + 1}`, "data-code": d.code, "data-file": d.file, "data-line": d.line },
                el("div", {}, el("span", { class: "tsp-loc" }, d.line ? `${short(d.file)}:${d.line}:${d.col}` : short(d.file)), el("span", { class: "tsp-code" }, `TS${d.code}`)),
                el("div", { class: "tsp-msg" }, d.message),
              ),
            ),
          );
        }

        function renderTypes(types) {
          const body = sections.types;
          if (!body) return;
          body.dataset.count = String(types.length);
          if (!types.length) {
            body.replaceChildren(el("div", { class: "tsp-empty" }, "Write // ^? under a name to see its type."));
            return;
          }
          body.replaceChildren(
            ...types.map((t, i) =>
              el(
                "div",
                { class: "tsp-type", "data-testid": `ts-type-${i + 1}`, "data-type": t.text, "data-file": t.file, "data-line": t.line },
                el("div", { class: "tsp-type-text" }, t.text || "(no type here)"),
                t.docs || t.tags.length ? el("div", { class: "tsp-docs" }, [t.docs, ...t.tags].filter(Boolean).join("\n")) : null,
              ),
            ),
          );
        }

        const KEYWORDS = new Set("const let var function return export import from class extends new this if else for of in while switch case break default async await typeof void null undefined true false throw try catch interface type enum declare readonly private public protected static get set as satisfies keyof namespace module require exports super".split(" "));
        function highlight(code) {
          const out = [];
          const token = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`)|(\b\d[\d_]*(?:\.\d+)?n?\b)|([A-Za-z_$][\w$]*)/g;
          let last = 0;
          for (const m of code.matchAll(token)) {
            if (m.index > last) out.push(code.slice(last, m.index));
            const [text, com, str, num, word] = m;
            if (com) out.push(el("span", { class: "tsp-com" }, text));
            else if (str) out.push(el("span", { class: "tsp-str" }, text));
            else if (num) out.push(el("span", { class: "tsp-num" }, text));
            else if (word && KEYWORDS.has(word)) out.push(el("span", { class: "tsp-kw" }, text));
            else out.push(text);
            last = m.index + text.length;
          }
          out.push(code.slice(last));
          return out;
        }

        function renderEmit(mode, map, files, ext) {
          const body = sections[mode];
          if (!body) return;
          body.replaceChildren(
            ...files.map((file, i) =>
              el(
                "div",
                { "data-testid": `ts-${mode}-${i + 1}`, "data-file": file },
                el("div", { class: "tsp-file" }, short(file).replace(/\.(c|m)?tsx?$/, ext)),
                el("pre", { class: "tsp-pre" }, highlight((map[file] ?? "").replace(/\n+$/, ""))),
              ),
            ),
          );
        }

        // ---------------------------------------------------------------- output
        function inspect(value, depth = 0, seen = new Set()) {
          const t = typeof value;
          if (t === "string") return depth === 0 ? value : `'${value}'`;
          if (t === "number" || t === "boolean") return String(value);
          if (t === "bigint") return `${value}n`;
          if (t === "undefined") return "undefined";
          if (t === "symbol") return value.toString();
          if (t === "function") return value.toString().startsWith("class") ? `[class ${value.name || "(anonymous)"}]` : `[Function: ${value.name || "(anonymous)"}]`;
          if (value === null) return "null";
          if (value instanceof Error) return `${value.name}: ${value.message}`;
          if (value instanceof Date) return Number.isNaN(value.getTime()) ? "Invalid Date" : value.toISOString();
          if (value instanceof Promise) return "Promise { <pending> }";
          if (seen.has(value)) return "[Circular]";
          if (depth > 2) return Array.isArray(value) ? "[Array]" : "[Object]";
          seen.add(value);
          try {
            if (Array.isArray(value)) {
              if (!value.length) return "[]";
              return `[ ${value.map((v) => inspect(v, depth + 1, seen)).join(", ")} ]`;
            }
            if (value instanceof Map) {
              const items = [...value].map(([k, v]) => `${inspect(k, depth + 1, seen)} => ${inspect(v, depth + 1, seen)}`);
              return `Map(${value.size}) {${items.length ? ` ${items.join(", ")} ` : ""}}`;
            }
            if (value instanceof Set) {
              const items = [...value].map((v) => inspect(v, depth + 1, seen));
              return `Set(${value.size}) {${items.length ? ` ${items.join(", ")} ` : ""}}`;
            }
            const proto = Object.getPrototypeOf(value);
            const name = proto && proto !== Object.prototype && proto.constructor?.name ? `${proto.constructor.name} ` : proto === null ? "[Object: null prototype] " : "";
            const keys = Object.keys(value);
            if (!keys.length) return `${name}{}`;
            const items = keys.map((k) => `${/^[A-Za-z_$][\w$]*$/.test(k) ? k : `'${k}'`}: ${inspect(value[k], depth + 1, seen)}`);
            return `${name}{ ${items.join(", ")} }`;
          } finally {
            seen.delete(value);
          }
        }

        let runGeneration = 0;
        let outputLines = [];
        function renderOutput(note) {
          const body = sections.output;
          if (!body) return;
          body.dataset.count = String(outputLines.length);
          const rows = outputLines.map((line, i) => el("div", { class: "tsp-out", "data-testid": `ts-out-${i + 1}`, "data-level": line.level }, line.text));
          if (!rows.length) rows.push(el("div", { class: "tsp-empty" }, note || "Nothing printed."));
          body.replaceChildren(...rows);
        }

        const RESOLVE_EXT = ["", ".ts", ".tsx", ".js", ".jsx", "/index.ts", "/index.tsx", "/index.js"];
        function resolveModule(from, spec, sources) {
          const base = from.split("/").slice(0, -1);
          for (const part of spec.split("/")) {
            if (part === "..") base.pop();
            else if (part !== ".") base.push(part);
          }
          const path = base.join("/");
          const stem = path.replace(/\.(c|m)?js$/, "");
          for (const candidate of [...RESOLVE_EXT.map((e) => path + e), ...RESOLVE_EXT.map((e) => stem + e)]) {
            if (candidate in sources) return candidate;
          }
          return null;
        }

        function runProgram(payload) {
          const generation = ++runGeneration;
          outputLines = [];
          if (!sections.output) return;
          const sources = payload.run || {};
          if (!(entry in sources)) {
            renderOutput(`${entry} not found.`);
            return;
          }
          const broken = Object.entries(payload.syntax || {}).filter(([, n]) => n > 0).map(([f]) => short(f));
          if (broken.length) {
            renderOutput(`Not run: fix the syntax error in ${broken.join(", ")} first.`);
            return;
          }
          const push = (level) => (...args) => {
            if (generation !== runGeneration) return;
            outputLines.push({ level, text: args.map((a) => inspect(a)).join(" ") });
            if (outputLines.length > 200) outputLines.shift();
            scheduleOutput();
          };
          const sandboxConsole = { log: push("log"), info: push("log"), debug: push("log"), warn: push("warn"), error: push("error"), dir: push("log"), table: push("log") };
          // Fresh #app for every run, so a program can render into it from scratch.
          const app = document.getElementById("app");
          if (app && appTemplate) app.replaceWith(appTemplate.cloneNode(true));
          const cache = {};
          const load = (path) => {
            if (cache[path]) return cache[path].exports;
            const module = { exports: {} };
            cache[path] = module;
            const require = (spec) => {
              if (!spec.startsWith(".") && !spec.startsWith("/")) {
                const known = window.__courseModules?.[spec];
                if (known) return known;
                throw new Error(`Cannot find module '${spec}'`);
              }
              const target = resolveModule(path, spec, sources);
              if (!target) throw new Error(`Cannot find module '${spec}'`);
              return load(target);
            };
            const fn = new Function("exports", "require", "module", "console", `${sources[path]}\n//# sourceURL=${path}`);
            fn(module.exports, require, module, sandboxConsole);
            return module.exports;
          };
          try {
            load(entry);
          } catch (error) {
            if (generation === runGeneration) outputLines.push({ level: "error", text: `Uncaught ${inspect(error)}` });
          }
          renderOutput();
        }

        let outputTimer = null;
        function scheduleOutput() {
          if (outputTimer) return;
          outputTimer = setTimeout(() => {
            outputTimer = null;
            renderOutput();
          }, 30);
        }

        // ---------------------------------------------------------------- wiring
        let lastSeq = 0;
        function render(payload) {
          if (!payload || payload.seq < lastSeq) return;
          lastSeq = payload.seq;
          panel.dataset.seq = String(payload.seq);
          renderErrors(payload.diagnostics || []);
          renderTypes(payload.types || []);
          renderEmit("js", payload.js || {}, jsFiles, ".js");
          renderEmit("dts", payload.dts || {}, dtsFiles, ".d.ts");
          runProgram(payload);
        }

        if (import.meta.hot) {
          const hello = () => import.meta.hot.send(`${EVENT}:hello`, { js: jsFiles, dts: dtsFiles });
          import.meta.hot.on(EVENT, render);
          import.meta.hot.on("vite:ws:connect", hello);
          hello();
        }
      index.html: |
        <!doctype html>
        <html lang="my">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <link rel="icon" href="data:," />
            <title>TypeScript course</title>
          </head>
          <body>
            <div id="app" data-testid="app"></div>
            <script type="module" src="/course/panel.js" data-modes="errors types output"></script>
          </body>
        </html>
      package.json: |
        {
          "name": "typescript-course-tea-shop",
          "private": true,
          "version": "1.0.0",
          "type": "module",
          "scripts": {
            "dev": "vite --host 0.0.0.0 --port 5173 --strictPort"
          },
          "devDependencies": {
            "typescript": "6.0.3",
            "vite": "5.4.21"
          }
        }
      src/main.ts: |
        import { orderTotal, type Order } from "./order";

        const order: Order = {
          customer: { name: "လှလှ", table: 5 },
          item: "လက်ဖက်ရည်",
          quantiy: 2,
        };
        const teaTotal = orderTotal(order, 1500);
        console.log(order.item, teaTotal, "ကျပ်");

        // ဖောင်ကနေ ဝင်လာတဲ့ အော်ဒါ
        const formOrder = {
          customer: { name: "အောင်အောင်", table: "7" },
          item: "ကော်ဖီ",
          quantity: 1,
        };
        console.log(formOrder.item, orderTotal(formOrder, 1800), "ကျပ်");

        console.log("မှတ်ချက်", order.note.trim());
      src/order.ts: |
        export type Customer = { name: string; table: number };

        export type Order = {
          customer: Customer;
          item: string;
          quantity: number;
          note?: string;
        };

        export function orderTotal(order: Order, price: number) {
          return order.quantity * price;
        }
      tsconfig.json: |
        {
          "compilerOptions": {
            "target": "es2022",
            "module": "preserve",
            "strict": true,
            "noEmit": true,
            "skipLibCheck": true,
            "moduleDetection": "force"
          },
          "include": ["src"]
        }
      vite.config.js: |
        import { defineConfig } from "vite";
        import courseTypeChecker from "./course/checker.js";

        export default defineConfig({
          plugins: [courseTypeChecker()],
        });
