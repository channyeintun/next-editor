build:
  # Studio replaces this built-in profile at render time with the Burmese provider chosen in the
  # render console (AthanLab with the user's own key, or VoxCPM2 when that feature is enabled).
  voiceProfile: pocket-alba-v1
  seed: 3102
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "Editor ထဲက TypeScript"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ TypeScript က program ကို run စရာ မလိုဘဲ type တွေကို စစ်ပေးတယ်
      ဆိုတာ မြင်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ အဲဒီ စစ်ဆေးမှုက code ရေးနေတဲ့ ကိုယ့်ကို editor ထဲမှာ ဘယ်လို
      ကူညီပေးလဲ ဆိုတာ ကြည့်သွားပါမယ်။ [[mark:draw-editor]] VS Code မှာ TypeScript ဖိုင် တစ်ခုကို
      ဖွင့်လိုက်တာနဲ့၊ TypeScript server လို့ ခေါ်တဲ့ program တစ်ခုက နောက်ကွယ်မှာ အလုပ် စလုပ်ပါတယ်။
      [[mark:draw-server]] ကိုယ် ရိုက်လိုက်တိုင်း သူက code ကို ပြန်စစ်ပြီး၊ ဘယ် နာမည်က ဘာ type လဲ၊
      ဘယ်နေရာမှာ အမှား ရှိလဲ ဆိုတာကို အမြဲ သိနေပါတယ်။ [[mark:draw-results]] အဲဒီ အချက်အလက်တွေနဲ့ပဲ editor
      က အမှားတွေကို မျဉ်းကွေးနဲ့ ပြတာ၊ mouse တင်ရင် type ကို ပြတာ၊ ရိုက်နေတုန်း ဆက်ရေးစရာတွေကို အကြံပြုတာ
      စတာတွေကို လုပ်ပေးပါတယ်။ [[mark:draw-panel]] ဒီ lesson ထဲက editor ကတော့ အဲဒါတွေကို မပြပါဘူး။
      ဒါကြောင့် အမှားတွေနဲ့ type တွေကို ညာဘက် panel မှာ ကြည့်ပြီး၊ panel မှာ ပြလို့ မရတဲ့ feature
      တွေကိုတော့ ပုံနဲ့ ရှင်းပြပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 2: IDE Superpowers",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/ide-superpowers",
        }
      - {
          title: "TypeScript Handbook: The Basics (types for tooling)",
          url: "https://www.typescriptlang.org/docs/handbook/2/basic-types.html#types-for-tooling",
        }
    actions:
      - id: open-board-a
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [e-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-editor
        type: whiteboard.apply
        at: { mark: draw-editor }
        upsertIds: [e-code-box, e-code-name, e-code-sub, e-arrow-1, e-server-box, e-server-name]
        drawMs: 3000
      - id: draw-server
        type: whiteboard.apply
        at: { mark: draw-server }
        upsertIds: [e-server-sub]
        drawMs: 1000
      - id: draw-results
        type: whiteboard.apply
        at: { mark: draw-results }
        upsertIds: [e-arrow-2, e-result-box, e-result-name, e-result-sub, e-features]
        drawMs: 3200
      - id: draw-panel
        type: whiteboard.apply
        at: { mark: draw-panel }
        upsertIds: [e-panel]
        drawMs: 1400

  - id: starter
    narration: >
      [[mark:close-board]] ဒီနေ့ code ကို ကြည့်ရအောင်။ [[mark:open-order]] ဒါက အော်ဒါ တစ်ခုမှာ ဘာတွေ
      ပါရမလဲ ဆိုတာ ရေးထားတဲ့ ဖိုင်ပါ။ [[mark:select-order-type]] အော်ဒါ တစ်ခုမှာ customer ရယ်၊ မှာတဲ့
      ပစ္စည်းရယ်၊ အရေအတွက်ရယ်၊ မှတ်ချက်ရယ် ပါပါတယ်။ ဒီလို object ပုံစံကို type နဲ့ ရေးပုံကိုတော့ နောက်
      lesson တွေမှာ အသေးစိတ် လေ့လာပါမယ်။ [[mark:select-note]] မှတ်ချက်ရဲ့ နာမည်နောက်က question mark ကတော့
      ဒီ property က မပါလည်း ရတယ် ဆိုတဲ့ အဓိပ္ပာယ်ပါ။ customer တိုင်း မှတ်ချက် ရေးမှာ မဟုတ်လို့ပါ။
      [[mark:select-total]] အောက်က function ကတော့ အရေအတွက်ကို တစ်ခွက်ဈေးနဲ့ မြှောက်ပြီး ကျသင့်ငွေကို
      တွက်ပေးပါတယ်။ [[mark:open-main]] main ဖိုင်မှာတော့ အော်ဒါ နှစ်ခု ရှိပါတယ်။ [[mark:select-mya-order]]
      ပထမ တစ်ခုက လှလှ မှာတဲ့ လက်ဖက်ရည် နှစ်ခွက်ပါ။ [[mark:select-form-order]] ဒုတိယ တစ်ခုကတော့ ဖောင်ကနေ
      ဝင်လာတဲ့ အောင်အောင်ရဲ့ ကော်ဖီ တစ်ခွက်ပါ။ [[mark:select-note-log]] နောက်ဆုံး line ကတော့ လှလှရဲ့
      မှတ်ချက်ကို ထုတ်ပြပါတယ်။
    sources:
      - {
          title: "TypeScript Handbook: Object Types (optional properties)",
          url: "https://www.typescriptlang.org/docs/handbook/2/objects.html#optional-properties",
        }
      - {
          title: "Total TypeScript Essentials, ch. 2: IDE Superpowers",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/ide-superpowers",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: open-order
        type: workspace.openFile
        at: { mark: open-order }
        path: src/order.ts
      - id: select-order-type
        type: editor.select
        at: { mark: select-order-type }
        target:
          {
            file: src/order.ts,
            text: "  customer: Customer;\n  item: string;\n  quantity: number;\n  note?: string;",
            occurrence: 1,
          }
      - id: select-note
        type: editor.select
        at: { mark: select-note }
        target: { file: src/order.ts, text: "note?", occurrence: 1 }
      - id: select-total
        type: editor.select
        at: { mark: select-total }
        target: { file: src/order.ts, text: "return order.quantity * price;", occurrence: 1 }
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: src/main.ts
      - id: select-mya-order
        type: editor.select
        at: { mark: select-mya-order }
        target:
          {
            file: src/main.ts,
            text: "  customer: { name: \"လှလှ\", table: 5 },\n  item: \"လက်ဖက်ရည်\",",
            occurrence: 1,
          }
      - id: select-form-order
        type: editor.select
        at: { mark: select-form-order }
        target:
          {
            file: src/main.ts,
            text: "  customer: { name: \"အောင်အောင်\", table: \"7\" },\n  item: \"ကော်ဖီ\",",
            occurrence: 1,
          }
      - id: select-note-log
        type: editor.select
        at: { mark: select-note-log }
        target:
          { file: src/main.ts, text: 'console.log("မှတ်ချက်", order.note.trim());', occurrence: 1 }

  - id: symptoms
    chapter: "Error သုံးခု"
    narration: >
      [[mark:panel-ready]] ညာဘက် panel ရဲ့ Output ကို အရင် ကြည့်ရအောင်။ လက်ဖက်ရည် နှစ်ခွက်ရဲ့ ကျသင့်ငွေက
      ဂဏန်း မဟုတ်ဘူး ဆိုတဲ့ NaN ဖြစ်နေပြီး၊ ကော်ဖီကတော့ ၁၈၀၀ ကျပ်နဲ့ မှန်နေပါတယ်။ [[mark:read-crash]]
      နောက်ဆုံး line မှာတော့ အနီရောင် error တစ်ခုနဲ့ program ရပ်သွားပါတယ်။ undefined ဖြစ်နေတဲ့ တန်ဖိုး
      ပေါ်မှာ method ကို ခေါ်မိလို့၊ program run နေတဲ့ အချိန်မှာ ဖြစ်တဲ့ runtime error ပါ။
      [[mark:read-errors]] ဒါပေမဲ့ အပေါ်က Errors အပိုင်းကို ကြည့်ပါ။ TypeScript က program ကို run စရာ
      မလိုဘဲ ဒီ ပြဿနာတွေကို error သုံးခုနဲ့ ပြထားပြီးသားပါ။ VS Code မှာဆိုရင် ဒါတွေက code ထဲမှာ အနီရောင်
      မျဉ်းကွေး သုံးနေရာ ဖြစ်နေမှာပါ။ တစ်ခုချင်း ကြည့်ပြီး ပြင်ကြည့်ရအောင်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 2: IDE Superpowers (TypeScript error checking)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/ide-superpowers",
        }
      - {
          title: "MDN: TypeError",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/TypeError",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-three-errors
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "3" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-code-typo
        type: expect.preview
        at: { afterAction: expect-three-errors }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-code, value: "2561" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-code-argument
        type: expect.preview
        at: { afterAction: expect-code-typo }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-2 }
        attribute: { name: data-code, value: "2345" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-code-undefined
        type: expect.preview
        at: { afterAction: expect-code-argument }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-3 }
        attribute: { name: data-code, value: "18048" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-nan
        type: expect.preview
        at: { afterAction: expect-code-undefined }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-1 }
        textContains: "လက်ဖက်ရည် NaN ကျပ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-coffee
        type: expect.preview
        at: { afterAction: expect-nan }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-2 }
        textContains: "ကော်ဖီ 1800 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-crash
        type: expect.preview
        at: { afterAction: expect-coffee }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-3 }
        textContains: "Uncaught TypeError: Cannot read properties of undefined (reading 'trim')"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-crash-level
        type: expect.preview
        at: { afterAction: expect-crash }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-3 }
        attribute: { name: data-level, value: "error" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: crash
    chapter: "Program ကို ရပ်စေမယ့် error"
    narration: >
      [[mark:select-note-call]] program ရပ်သွားတဲ့ နေရာကနေ စကြည့်ရအောင်။ ဒီ line က မှတ်ချက်ရဲ့ ရှေ့နောက်က
      နေရာလွတ်တွေကို ဖယ်ပြီး ထုတ်ပြပါတယ်။ panel ရဲ့ တတိယ error က မှတ်ချက်ဟာ undefined ဖြစ်နိုင်တယ်လို့
      ပြောနေပါတယ်။ မှတ်ချက်က မပါလည်း ရတဲ့ property ဖြစ်ပြီး လှလှရဲ့ အော်ဒါမှာ တကယ်ကို မပါလို့၊ run
      လိုက်တော့ undefined ပေါ်မှာ method ကို ခေါ်မိပြီး ရပ်သွားတာပါ။ [[mark:type-optional]] ဒါကြောင့်
      မှတ်ချက်ရဲ့ နောက်မှာ question mark တစ်လုံး ထည့်ပါမယ်။ ဒါက မှတ်ချက် မရှိရင် method ကို မခေါ်တော့ဘဲ undefined ကိုပဲ ပြန်ပေးတဲ့ optional chaining ပါ။ [[mark:type-default]] ပြီးတော့ undefined ဖြစ်တဲ့အခါ
      မရှိပါ ဆိုတဲ့ စာကို ပြဖို့၊ nullish coalescing operator နဲ့ default တန်ဖိုး ထည့်ပေးပါမယ်။
      [[mark:read-crash-fixed]] Output ထဲက အနီရောင် line ပျောက်ပြီး၊ မှတ်ချက် မရှိပါ ဆိုတာ ပေါ်လာပါပြီ။
      Errors မှာလည်း နှစ်ခုပဲ ကျန်ပါတော့တယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 2: IDE Superpowers (catching runtime errors)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/ide-superpowers",
        }
      - {
          title: "MDN: Optional chaining (?.)",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Optional_chaining",
        }
      - {
          title: "MDN: Nullish coalescing operator (??)",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Nullish_coalescing",
        }
    actions:
      - id: select-note-call
        type: editor.select
        at: { mark: select-note-call }
        target: { file: src/main.ts, text: "order.note.trim()", occurrence: 1 }
      - id: type-optional
        type: editor.type
        at: { mark: type-optional }
        target: { file: src/main.ts, after: 'console.log("မှတ်ချက်", order.note', occurrence: 1 }
        text: "?"
      - id: type-default
        type: editor.type
        at: { mark: type-default }
        target: { file: src/main.ts, after: "order.note?.trim()", occurrence: 1 }
        text: ' ?? "မရှိပါ"'
      - id: expect-two-errors
        type: expect.preview
        at: { afterAction: type-default }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-no-crash
        type: expect.preview
        at: { afterAction: expect-two-errors }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-3 }
        textContains: "မှတ်ချက် မရှိပါ"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: typo
    chapter: "Error က အကြောင်းရင်းနားမှာ ပေါ်တယ်"
    narration: >
      [[mark:select-typo]] အခု NaN ဘယ်က လာလဲ ကြည့်ရအောင်။ ပထမ error က လှလှရဲ့ အော်ဒါထဲက ဒီ property ကို
      ညွှန်ပြနေပါတယ်။ အရေအတွက်ရဲ့ နာမည်မှာ စာလုံး တစ်လုံး ကျနေပါတယ်။ ဒါကြောင့် TypeScript က ဒီ နာမည် Order
      type ထဲမှာ မရှိဘူးလို့ ပြောပြီး၊ စာလုံး မှန်တဲ့ နာမည်ကို ရေးချင်တာလား လို့ အကြံပေးနေပါတယ်။
      [[mark:close-to-cause]] JavaScript သက်သက်ဆိုရင်တော့ NaN ပေါ်တဲ့ နေရာကနေ နောက်ပြန် လိုက်ရှာရမှာ
      ဖြစ်ပေမယ့်၊ TypeScript က အမှား စဖြစ်တဲ့ နေရာကို တန်းပြပေးပါတယ်။ VS Code မှာဆိုရင် quick fix နဲ့ အဲဒီ
      အကြံပြုချက်ကို တစ်ချက်တည်း လက်ခံလို့ ရပါတယ်။ [[mark:type-typo]] ကျနေတဲ့ စာလုံးကို ထည့်လိုက်ပါမယ်။
      [[mark:read-typo-fixed]] error တစ်ခု ထပ်ပျောက်ပြီး၊ လက်ဖက်ရည် နှစ်ခွက်က ၃၀၀၀ ကျပ် ဖြစ်သွားပါပြီ။
      [[mark:crash-vs-warning]] ဒီ error နဲ့ ခုနက error ကွာတာကို သတိထား ကြည့်ပါ။ ခုနက အမှားက program ကို
      တကယ် ရပ်သွားစေပေမယ့်၊ ဒီ အမှားကတော့ program ကို မရပ်စေဘဲ အဖြေကိုပဲ မှားစေပါတယ်။ TypeScript က program
      ရပ်သွားမယ့် အမှားတွေတင် မကဘဲ၊ ရပ်မသွားပေမယ့် bug ဖြစ်နိုင်တဲ့ code တွေကိုပါ error အနေနဲ့ ပြပေးပါတယ်။
      ဘာကြောင့်လဲဆိုတော့ ဒီလို code က များသောအားဖြင့် တကယ့် bug ဖြစ်နေလို့ပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 2: IDE Superpowers (warnings close to the source, non-runtime errors)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/ide-superpowers",
        }
      - {
          title: "TypeScript Handbook: The Basics (non-exception failures)",
          url: "https://www.typescriptlang.org/docs/handbook/2/basic-types.html#non-exception-failures",
        }
    actions:
      - id: select-typo
        type: editor.select
        at: { mark: select-typo }
        target: { file: src/main.ts, text: "quantiy", occurrence: 1 }
      - id: expect-did-you-mean
        type: expect.preview
        at: { afterAction: select-typo }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "'quantiy' does not exist in type 'Order'. Did you mean to write 'quantity'?"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-typo
        type: editor.type
        at: { mark: type-typo }
        target: { file: src/main.ts, after: "  quanti", occurrence: 1 }
        text: "t"
      - id: expect-one-left
        type: expect.preview
        at: { afterAction: type-typo }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-tea-total
        type: expect.preview
        at: { afterAction: expect-one-left }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-1 }
        textContains: "လက်ဖက်ရည် 3000 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: long-error
    chapter: "Error ရှည်ကို ဖတ်နည်း"
    narration: >
      [[mark:select-form-arg]] ကျန်နေတဲ့ error က အောင်အောင်ရဲ့ အော်ဒါကို function ထဲ ပို့တဲ့ ဒီ နေရာကို
      ညွှန်ပြနေပါတယ်။ ဒီ error က ရှည်ပြီး အပိုင်း သုံးပိုင်း ပါပါတယ်။ panel မှာ ကြည့်ရင် အောက်ကို ဆင်းလေ
      အတွင်းဘက် ပိုဝင်လေ ဖြစ်နေတာကို တွေ့ရပါမယ်။ အပေါ်ကနေ ဖတ်ရင် object တစ်ခုလုံးရဲ့ type ကို ပြထားလို့
      ရှုပ်နေပါတယ်။ ဒါကြောင့် error ရှည်တွေကို အောက်ဆုံး အပိုင်းကနေ စဖတ်ပါ။ [[mark:board-bottom]]
      အောက်ဆုံး အပိုင်းက string ကို number နေရာမှာ ထည့်လို့ မရဘူးလို့ ပြောပါတယ်။ ဒါက တကယ့် အကြောင်းရင်းပါ။
      [[mark:board-middle]] သူ့အပေါ်က အပိုင်းကတော့ အဲဒီ အမှား ဖြစ်နေတဲ့ နေရာက customer ထဲက table
      ဖြစ်တယ်လို့ ပြောပါတယ်။ [[mark:board-top]] အပေါ်ဆုံး အပိုင်းကတော့ အဲဒီအတွက် အော်ဒါ တစ်ခုလုံးက
      Order type နဲ့ မကိုက်ဘူးလို့ အနှစ်ချုပ် ပြောတာပါ။ [[mark:select-table-text]] ဆိုတော့ ပြဿနာက ဒီ စားပွဲ နံပါတ်ပါ။
      ဖောင်ကနေ ဝင်လာတဲ့ တန်ဖိုးတွေက အမြဲ စာသား ဖြစ်လို့၊ စားပွဲ နံပါတ်ကလည်း ဂဏန်း မဟုတ်ဘဲ string
      ဖြစ်နေတာပါ။ ဒီ အမှားကလည်း program ကို မရပ်စေပါဘူး၊ ကော်ဖီ ဈေးက မှန်နေတာ မြင်ခဲ့ပါတယ်။ ဒါပေမဲ့ စားပွဲ
      နံပါတ်ကို ဂဏန်းလို့ ယူဆပြီး ရေးထားတဲ့ code တွေမှာ နောက်ပိုင်း ပြဿနာ ပေးနိုင်ပါတယ်။
      [[mark:type-number]] ဒါကြောင့် စာသားကို ဂဏန်း ပြောင်းပေးတဲ့ Number function နဲ့ ပတ်ပေးလိုက်ပါမယ်။
      [[mark:read-all-fixed]] Errors အပိုင်းမှာ error တစ်ခုမှ မကျန်တော့ပါဘူး။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 2: IDE Superpowers (dealing with multi-line errors)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/ide-superpowers",
        }
      - {
          title: "MDN: Number() constructor (conversion)",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Number/Number",
        }
      - {
          title: "MDN: HTMLInputElement value (always a string)",
          url: "https://developer.mozilla.org/en-US/docs/Web/API/HTMLInputElement/value",
        }
    actions:
      - id: select-form-arg
        type: editor.select
        at: { mark: select-form-arg }
        target: { file: src/main.ts, text: "formOrder, 1800", occurrence: 1 }
      - id: expect-long-middle
        type: expect.preview
        at: { afterAction: select-form-arg }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "The types of 'customer.table' are incompatible between these types."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-long-bottom
        type: expect.preview
        at: { afterAction: expect-long-middle }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Type 'string' is not assignable to type 'number'."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: board-bottom
        type: whiteboard.apply
        at: { mark: board-bottom }
        open: true
        clear: true
        upsertIds: [m-title, m-bottom, m-underline, m-start]
        drawMs: 2400
      - id: board-middle
        type: whiteboard.apply
        at: { mark: board-middle }
        upsertIds: [m-mid]
        drawMs: 1200
      - id: board-top
        type: whiteboard.apply
        at: { mark: board-top }
        upsertIds: [m-top]
        drawMs: 1200
      - id: close-board-b
        type: whiteboard.apply
        at: { mark: select-table-text }
        open: false
      - id: select-table-text
        type: editor.select
        at: { afterAction: close-board-b }
        target: { file: src/main.ts, text: 'table: "7"', occurrence: 1 }
      - id: type-number-open
        type: editor.type
        at: { mark: type-number }
        target: { file: src/main.ts, after: 'name: "အောင်အောင်", table: ', occurrence: 1 }
        text: "Number("
        cadence: fast-explainer
      - id: type-number-close
        type: editor.type
        at: { afterAction: type-number-open }
        target: { file: src/main.ts, after: 'table: Number("7"', occurrence: 1 }
        text: ")"
        cadence: fast-explainer
      - id: expect-no-errors
        type: expect.preview
        at: { afterAction: type-number-close }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-output-three
        type: expect.preview
        at: { afterAction: expect-no-errors }
        timeoutMs: 5000
        target: { by: testId, value: ts-output }
        attribute: { name: data-count, value: "3" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: hover
    chapter: "Hover နဲ့ JSDoc"
    narration: >
      [[mark:type-query]] အခု function တစ်ခုကို သုံးတဲ့အခါ editor က ဘယ်လို ကူညီလဲ ကြည့်ရအောင်။ ကျသင့်ငွေ
      တွက်တဲ့ function ကို ခေါ်ထားတဲ့ line အောက်မှာ query comment ထည့်ပါမယ်။ [[mark:read-signature]] Types
      အပိုင်းမှာ function ရဲ့ parameter တွေနဲ့ ပြန်ပေးမယ့် type ပေါ်လာပါပြီ။ ပထမ parameter က Order type
      ရှိတဲ့ အော်ဒါ၊ ဒုတိယက number ဖြစ်တဲ့ ဈေးနှုန်းပါ။ နောက်ဆုံးက number ကတော့ function ပြန်ပေးမယ့် type
      ဖြစ်ပြီး၊ ကိုယ် မရေးထားပေမယ့် TypeScript က infer လုပ်ထားတာပါ။ [[mark:read-alias]] ရှေ့က alias နဲ့
      အောက်က import ကတော့ ဒီ နာမည်ကို တခြား ဖိုင်ကနေ import လုပ်ထားတယ် ဆိုတာ ပြတာပါ။ VS Code မှာ mouse
      တင်လိုက်ရင် ဒီ အတိုင်း မြင်ရမှာ ဖြစ်လို့၊ function ရေးထားတဲ့ ဖိုင်ကို ဖွင့်စရာ မလိုဘဲ ဘာ ထည့်ပေးရမလဲ
      ဆိုတာ သိနိုင်ပါတယ်။ [[mark:open-order-2]] ဒါပေမဲ့ type တွေက function ဘာ လုပ်လဲ ဆိုတာကိုတော့
      မပြောပြပါဘူး။ [[mark:type-jsdoc]] ဒါကြောင့် function ရဲ့ အပေါ်မှာ JSDoc comment တစ်ခု ရေးပါမယ်။
      JSDoc comment ဆိုတာ function တို့ type တို့ရဲ့ အပေါ်မှာ ရေးတဲ့ ရှင်းလင်းချက် comment ပုံစံ
      တစ်မျိုးပါ။ ဒီ comment ထဲမှာ function ဘာ လုပ်လဲ ဆိုတဲ့ စာ တစ်ကြောင်း ရေးပြီး၊ example tag နဲ့
      ခေါ်သုံးပုံ ဥပမာ တစ်ခုပါ ထည့်ထားပါတယ်။ [[mark:read-jsdoc]] Types အပိုင်းမှာ ခုနက type တွေရဲ့
      အောက်မှာ ရှင်းလင်းချက်နဲ့ ဥပမာ ပေါ်လာပါပြီ။ VS Code ကလည်း mouse တင်တဲ့အခါ ဒီ comment ကို
      ပြပေးတဲ့အတွက်၊ အဖွဲ့လိုက် အလုပ်လုပ်တဲ့အခါ အရမ်း အသုံးဝင်ပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 2: IDE Superpowers (introspecting variables, JSDoc comments)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/ide-superpowers",
        }
      - {
          title: "TypeScript: JSDoc Reference (@example and other tags)",
          url: "https://www.typescriptlang.org/docs/handbook/jsdoc-supported-types.html",
        }
      - {
          title: "VS Code: TypeScript editing (hover information, JSDoc)",
          url: "https://code.visualstudio.com/docs/typescript/typescript-editing",
        }
    actions:
      - id: type-query
        type: editor.type
        at: { mark: type-query }
        target:
          { file: src/main.ts, after: "const teaTotal = orderTotal(order, 1500);\n", occurrence: 1 }
        text: "//               ^?\n"
        cadence: fast-explainer
      - id: expect-signature
        type: expect.preview
        at: { afterAction: type-query }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        textContains: "orderTotal(order: Order, price: number): number"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: open-order-2
        type: workspace.openFile
        at: { mark: open-order-2 }
        path: src/order.ts
      - id: type-jsdoc
        type: editor.type
        at: { mark: type-jsdoc }
        target: { file: src/order.ts, after: "  note?: string;\n};\n\n", occurrence: 1 }
        text: "/**\n * အော်ဒါရဲ့ အရေအတွက်ကို တစ်ခွက်ဈေးနဲ့ မြှောက်ပြီး ကျသင့်ငွေကို ပြန်ပေးပါတယ်။\n * @example orderTotal(order, 1500) // 3000\n */\n"
        cadence: block
      - id: expect-jsdoc-text
        type: expect.preview
        at: { afterAction: type-jsdoc }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        textContains: "ကျသင့်ငွေကို ပြန်ပေးပါတယ်။"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-jsdoc-example
        type: expect.preview
        at: { afterAction: expect-jsdoc-text }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-1 }
        textContains: "@example orderTotal(order, 1500) // 3000"
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: features
    chapter: "VS Code မှာ စမ်းကြည့်ပါ"
    narration: >
      [[mark:board-features]] ဒီ lesson ထဲက editor မှာ ပြလို့ မရပေမယ့်၊ VS Code မှာ နေ့တိုင်း သုံးရမယ့် feature
      တွေ ရှိပါသေးတယ်။ [[mark:draw-autocomplete]] ပထမက autocomplete ပါ။ TypeScript က type ကို သိနေလို့၊
      ရိုက်နေတုန်း အဲဒီ နေရာမှာ သုံးလို့ရတဲ့ property နဲ့ method တွေကို စာရင်းနဲ့ ပြပေးပါတယ်။ Ctrl နဲ့
      Space ကို နှိပ်ပြီး ကိုယ်တိုင်လည်း ခေါ်လို့ ရပါတယ်။ [[mark:draw-definition]] Go to Definition က
      နာမည် တစ်ခုကို ကြေညာထားတဲ့ နေရာကို တန်းခေါ်သွားပြီး၊ Go to References ကတော့ အဲဒီ နာမည်ကို သုံးထားတဲ့
      နေရာ အားလုံးကို ရှာပေးပါတယ်။ [[mark:draw-rename]] Rename Symbol ကတော့ နာမည် တစ်ခုကို ပြောင်းလိုက်ရင်
      သုံးထားတဲ့ နေရာတိုင်းမှာ လိုက်ပြောင်းပေးပါတယ်။ find and replace နဲ့ မတူတာက၊ နာမည် တူပေမယ့် တခြား အရာ
      ဖြစ်နေတဲ့ နေရာတွေကို မထိတာပါ။ [[mark:draw-import]] auto import ကတော့ တခြား ဖိုင်က နာမည်ကို
      ရိုက်ပြီး autocomplete စာရင်းထဲက ရွေးလိုက်တာနဲ့၊ import line ကို ဖိုင်ရဲ့ အပေါ်ဆုံးမှာ ထည့်ပေးပါတယ်။ [[mark:draw-quickfix]] Quick Fix
      ကတော့ error တစ်ခုကို ပြင်နည်းတွေ၊ code ကို ပြန်စီနည်းတွေကို menu နဲ့ အကြံပြုပေးပါတယ်။
      [[mark:draw-restart]] တစ်ခါတစ်လေ editor က အမှား အဟောင်းတွေကို ဆက်ပြနေရင်၊ Command Palette ကနေ
      Restart TS Server ကို ရွေးပြီး TypeScript server ကို ပြန်စ ခိုင်းလို့ ရပါတယ်။ [[mark:draw-js]] ဒီ
      feature အများစုက JavaScript ဖိုင်တွေမှာလည်း ရပါတယ်။ ဒါပေမဲ့ type မရှိတဲ့အတွက် error တွေကိုတော့
      များသောအားဖြင့် မပြပါဘူး။ lesson ကို pause လုပ်ပြီး ကိုယ့် editor မှာ တစ်ခုချင်း စမ်းကြည့်ပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 2: IDE Superpowers (autocomplete, navigation, rename, auto imports, quick fixes, restarting the server, working in JavaScript)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/ide-superpowers",
        }
      - {
          title: "VS Code: Code Navigation (Go to Definition F12, Go to References Shift+F12, Rename Symbol F2)",
          url: "https://code.visualstudio.com/docs/editing/editingevolved",
        }
      - {
          title: "VS Code: IntelliSense (Ctrl+Space)",
          url: "https://code.visualstudio.com/docs/editing/intellisense",
        }
      - {
          title: "VS Code: Refactoring and Quick Fixes",
          url: "https://code.visualstudio.com/docs/typescript/typescript-refactoring",
        }
    actions:
      - id: open-board-c
        type: whiteboard.apply
        at: { mark: board-features }
        open: true
        clear: true
        upsertIds: [f-title]
      - id: draw-autocomplete
        type: whiteboard.apply
        at: { mark: draw-autocomplete }
        upsertIds: [f-ac-key, f-ac-desc]
        drawMs: 1600
      - id: draw-definition
        type: whiteboard.apply
        at: { mark: draw-definition }
        upsertIds: [f-def-key, f-def-desc, f-ref-key, f-ref-desc]
        drawMs: 2400
      - id: draw-rename
        type: whiteboard.apply
        at: { mark: draw-rename }
        upsertIds: [f-ren-key, f-ren-desc]
        drawMs: 1400
      - id: draw-import
        type: whiteboard.apply
        at: { mark: draw-import }
        upsertIds: [f-imp-key, f-imp-desc]
        drawMs: 1200
      - id: draw-quickfix
        type: whiteboard.apply
        at: { mark: draw-quickfix }
        upsertIds: [f-fix-key, f-fix-desc]
        drawMs: 1200
      - id: draw-restart
        type: whiteboard.apply
        at: { mark: draw-restart }
        upsertIds: [f-rst-key, f-rst-desc]
        drawMs: 1400
      - id: draw-js
        type: whiteboard.apply
        at: { mark: draw-js }
        upsertIds: [f-js]
        drawMs: 1400

  - id: recap
    narration: >
      [[mark:close-features]] ဒါဆို ပြန်ချုပ်ရရင်၊ TypeScript server က ကိုယ် ရိုက်နေတုန်း code ကို အမြဲ
      စစ်နေပြီး၊ error ကို အမှား စဖြစ်တဲ့ နေရာမှာ ပြပေးပါတယ်။ program ကို ရပ်သွားစေမယ့် အမှားတွေရော၊
      ရပ်မသွားပေမယ့် အဖြေ မှားစေမယ့် အမှားတွေကိုပါ ဖမ်းပေးပါတယ်။ error ရှည်တွေကိုတော့ အောက်ဆုံး
      အပိုင်းကနေ စဖတ်ရပါတယ်။ [[mark:recap-hover]] ပြီးတော့ mouse တင်ကြည့်ရုံနဲ့ function တစ်ခုရဲ့
      parameter တွေ၊ ပြန်ပေးမယ့် type နဲ့ JSDoc ရှင်းလင်းချက်ကို မြင်နိုင်ပါတယ်။ နောက် lesson မှာတော့ TypeScript code က browser မှာ
      run လို့ ရတဲ့ JavaScript ဖြစ်လာပုံကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 2: IDE Superpowers",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/ide-superpowers",
        }
    actions:
      - id: close-features
        type: whiteboard.apply
        at: { mark: close-features }
        open: false
      - id: select-jsdoc
        type: editor.select
        at: { mark: recap-hover }
        target:
          {
            file: src/order.ts,
            text: " * အော်ဒါရဲ့ အရေအတွက်ကို တစ်ခွက်ဈေးနဲ့ မြှောက်ပြီး ကျသင့်ငွေကို ပြန်ပေးပါတယ်။\n * @example orderTotal(order, 1500) // 3000",
            occurrence: 1,
          }
      - id: expect-file-main
        type: expect.file
        at: { afterAction: close-features }
        path: src/main.ts
        contains: 'console.log("မှတ်ချက်", order.note?.trim() ?? "မရှိပါ");'
      - id: expect-file-typo
        type: expect.file
        at: { afterAction: expect-file-main }
        path: src/main.ts
        contains: "  quantity: 2,"
      - id: expect-file-table
        type: expect.file
        at: { afterAction: expect-file-typo }
        path: src/main.ts
        contains: 'table: Number("7")'
      - id: expect-file-jsdoc
        type: expect.file
        at: { afterAction: expect-file-table }
        path: src/order.ts
        contains: " * @example orderTotal(order, 1500) // 3000\n */\nexport function orderTotal("
checks:
  - { type: timing.p95Ms, max: 300 }
