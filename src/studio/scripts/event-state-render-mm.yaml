          }
        </style>
        <div class="stage">
          <div class="title">ခလုတ် တစ်ချက်၊ အဆင့် သုံးဆင့်</div>
          <div class="row" style="top: 36vh">
            <span class="num">၁</span><span class="term" style="color: #74c0fc">Event</span>user က တစ်ခုခု လုပ်လိုက်တယ်
          </div>
          <div class="row" style="top: 52vh">
            <span class="num">၂</span><span class="term" style="color: #ffc078">State</span>မှတ်ထားတဲ့ data ပြောင်းတယ်
