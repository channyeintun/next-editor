schemaVersion: 1

lesson:
  slug: event-state-render-mm
  title: "ခလုတ် တစ်ချက် နှိပ်ရင် ဘာဖြစ်သလဲ — Event, State, Render"
  locale: my-MM
  workspace:
    lessonType: javascript
    name: Event State Render
    entryFilePath: main.js
    files:
      package.json: |
        {
          "name": "event-state-render",
          "private": true,
          "version": "1.0.0",
          "type": "module",
          "scripts": {
            "dev": "vite --host 0.0.0.0 --port 5173 --strictPort"
          },
          "devDependencies": {
            "vite": "5.4.21"
          }
        }
      index.html: |
        <!doctype html>
        <html lang="my">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <link rel="icon" href="data:," />
            <title>ရေတွက်စက်</title>
            <link rel="stylesheet" href="/style.css" />
          </head>
          <body>
            <main class="card">
              <h1 data-testid="title">ရေတွက်စက်</h1>
              <p class="count" data-testid="count">0</p>
              <button type="button" id="add" data-testid="add">တစ်ခု တိုးမယ်</button>
            </main>
            <script type="module" src="/main.js"></script>
          </body>
        </html>
      main.js: |
        const countText = document.querySelector("[data-testid='count']");
        const addButton = document.querySelector("#add");

        let count = 0;

        function render() {
          countText.textContent = count;
        }

        render();
      style.css: |
        :root {
          color-scheme: dark;
        }

        body {
          margin: 0;
          min-height: 100vh;
          display: grid;
          place-items: center;
          background: #11141c;
          color: #e7e9ee;
          font-family: system-ui, "Noto Sans Myanmar", sans-serif;
        }

        .card {
          padding: 28px 40px;
          border: 1px solid #2b3140;
          border-radius: 16px;
          text-align: center;
        }

        h1 {
          margin: 0;
          font-size: 20px;
          font-weight: 600;
          color: #9aa3b5;
        }

        .count {
          margin: 18px 0 36px;
          font-size: 48px;
          line-height: 1;
          font-weight: 700;
        }

        button {
          font: inherit;
          font-size: 18px;
          padding: 10px 22px;
          border: 0;
          border-radius: 10px;
          background: #3b82f6;
          color: white;
          cursor: pointer;
        }
  slides:
    - id: three-steps
      contentType: html
      name: အဆင့် သုံးဆင့်
      content: |
        <style>
          .stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #0b0d12;
            color: #e7e9ee;
            font-family: system-ui, "Noto Sans Myanmar", sans-serif;
            text-align: left;
          }
          .title {
            position: absolute;
            left: 8vw;
