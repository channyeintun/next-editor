schemaVersion: 1

lesson:
  slug: claude-fde-31-hooks
  title: "Claude FDE 31: Hook များ"
  locale: my-MM
  workspace:
    lessonType: javascript
    name: FDE Notebook
    entryFilePath: billing-service/.claude/settings.json
    sidebarStartsCollapsed: true
    files:
      README.md: |
        # နေခြည် Fiber · FDE မှတ်စု

        နေခြည် Fiber က ရန်ကုန်နဲ့ မန္တလေးမှာ fiber internet ဝန်ဆောင်မှု ပေးတဲ့ ကုမ္ပဏီပါ။
        ဒီ course အတွက် စိတ်ကူးနဲ့ တည်ဆောက်ထားတဲ့ ကုမ္ပဏီ ဖြစ်ပါတယ်။

        ## ကုမ္ပဏီ

        - customer 62,000 ခန့် (အိမ်နဲ့ ဆိုင်)
        - ဝန်ထမ်း 430: support agent 45၊ field technician 130၊ developer 24
        - developer team 4 ခု: Customer App, Billing, Network Tools, Internal Tools

        ## Support

        - တစ်ရက် ticket 1,800 ခန့်
        - connection 55 %၊ billing 25 %၊ တပ်ဆင်နဲ့ ရွှေ့ပြောင်း 12 %၊ အခြား 8 %
        - ပထမဆုံး ပြန်ဖြေချိန် ပျမ်းမျှ 38 မိနစ်၊ ticket တစ်ခုကို ဖြေရှင်းချိန် ပျမ်းမျှ 11 မိနစ်

        ## System များ

        - Ticket system: customer ရဲ့ တိုင်ကြားချက်တွေ
        - Billing: plan၊ invoice၊ ငွေပေးချေမှု (သက်တမ်း 9 နှစ်ရှိ codebase)
        - NMS: မြို့နယ်အလိုက် လိုင်းကျမှု အခြေအနေ
        - Knowledge base: ပြဿနာဖြေရှင်းနည်း article 340

        ## မုန်တိုင်းကျတဲ့ည

        - မြို့နယ် 3 ခုမှာ လိုင်းကျ၊ ticket က ပုံမှန်ရဲ့ 4 ဆ
        - chat AI နဲ့ ရေးထားတဲ့ အဖြေ 64 စောင်က လိုင်းကျနေတဲ့ customer တွေကို router ပြန်ဖွင့်ခိုင်းခဲ့တယ်

        ## FDE အလုပ် (12 ပတ်)

        - Reply assistant: support ticket အတွက် အဖြေ မူကြမ်း ရေးပေးတဲ့ agent
        - Billing team နဲ့ Claude Code
        - ကုမ္ပဏီ တစ်ခုလုံးအတွက် Claude
      billing-service/.claude/hooks/block-migrations.sh: |
        #!/bin/bash
        # Block any shell command that would run a database migration.
        cmd=$(jq -r '.tool_input.command // ""')
        if [[ "$cmd" == *migrate* ]]; then
          echo "Blocked by project hook: migrations never run from the billing repo. Ask the platform team." >&2
          exit 2
        fi
        exit 0
      billing-service/.claude/settings.json: |
        {
          "permissions": {
            "defaultMode": "default",
            "allow": ["Bash(npm test)", "Bash(npm run lint)"],
            "ask": ["Bash(git push *)"],
            "deny": ["Read(./.env)", "Read(./customer-exports/**)"]
          },
          "hooks": {
            "PostToolUse": [
              {
              }
            ],
            "PreToolUse": [
              {
              }
            ]
          }
        }
      package.json: |
        {
          "name": "fde-notebook",
          "private": true,
          "version": "1.0.0",
          "scripts": {
            "dev": "echo concept lesson: nothing to run"
          }
        }
  slides:
    - id: blocked-screen
      contentType: html
      name: A blocked command
      content: |
        <style>
          .shot { position: relative; width: 100vw; height: 100vh; background: #0b0d12; }
          .shot img { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; object-fit: contain; }
        </style>
        <div class="shot"><img src="data:image/webp;base64," alt="Claude Code: npm run migrate blocked by the project's PreToolUse hook, and Claude's reply"></div>
    - id: hooks-screen
      contentType: html
      name: Hooks command
      content: |
        <style>
          .shot { position: relative; width: 100vw; height: 100vh; background: #0b0d12; }
          .shot img { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; object-fit: contain; }
        </style>
        <div class="shot"><img src="data:image/webp;base64," alt="Claude Code: the read-only hooks view with one PreToolUse hook from project settings"></div>
