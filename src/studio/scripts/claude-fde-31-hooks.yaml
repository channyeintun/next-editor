build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 9331

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: need
    chapter: ဆယ်ခါမှာ တစ်ခါ ကျော်သွားတယ်
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ test output လို ဆူညံတဲ့ အလုပ်ကို သီးသန့် context နဲ့ လုပ်ပြီး report တစ်ခုပဲ ပြန်ပို့တဲ့ subagent
      ကို ရေးခဲ့ပါတယ်။
      [[mark:sel-billing]] Billing team က CLAUDE.md ထဲမှာ စည်းကမ်း အသစ် တစ်ကြောင်း ထပ်ထည့်ခဲ့ပါတယ်။ file တစ်ခုကို
      ပြင်ပြီးတိုင်း Prettier နဲ့ format လုပ်ပါ ဆိုတာပါ။ Claude ကလည်း အများအားဖြင့် လိုက်လုပ်ပါတယ်။ ဒါပေမဲ့ တစ်ပတ်အကြာ
      review လုပ်တော့ ပြင်ထားတဲ့ file ဆယ်ခုမှာ တစ်ခုလောက်က format မလုပ်ထားတာ တွေ့ရပါတယ်။
      [[mark:story-2]] Billing team lead မောင်မောင် အတွက် ဒါက အသေးအဖွဲ ပြဿနာ မဟုတ်ပါဘူး။ format လိုမျိုး စည်းကမ်း
      သေးသေးလေးတောင် တစ်ခါတလေ ကျော်သွားရင်၊ ပိုအရေးကြီးတဲ့ စည်းကမ်းတွေကို ဘယ်လို ယုံမလဲလို့ မေးပါတယ်။ အဲဒီ မေးခွန်းက
      သဘာဝကျပါတယ်။ CLAUDE.md ထဲက စာကြောင်းဆိုတာ model ဖတ်ပြီး ဆုံးဖြတ်တဲ့ ညွှန်ကြားချက်ပဲ ဖြစ်လို့ပါ။
      [[mark:story-3]] Claude Code မှာ ဒီအတွက် hook ဆိုတာ ရှိပါတယ်။ hook ဆိုတာ Claude Code ရဲ့ အဆင့် တစ်ခုခုမှာ အလိုအလျောက်
      run တဲ့ ကိုယ့် command ပါ။ model က run ဖို့ ရွေးမှ run တာ မဟုတ်ဘဲ၊ Claude Code ကိုယ်တိုင်က အဲဒီ အဆင့်ရောက်တိုင်း
      run ပေးတာပါ။
    sources:
      - {
          title: "Claude Code Docs: Hooks guide",
          url: "https://code.claude.com/docs/en/hooks-guide",
        }
      - {
          title: "Claude Code Docs: Best practices",
          url: "https://code.claude.com/docs/en/best-practices",
        }
    actions:
      - { id: open-readme, type: workspace.openFile, at: { mark: sel-billing }, path: README.md }
      - id: sel-billing
        type: editor.select
        at: { afterAction: open-readme }
        target:
          file: README.md
          text: "- Billing team နဲ့ Claude Code"
      - id: sel-codebase
        type: editor.select
        at: { mark: story-2 }
        target:
          file: README.md
          text: "- Billing: plan၊ invoice၊ ငွေပေးချေမှု (သက်တမ်း 9 နှစ်ရှိ codebase)"

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] ဆက်မသွားခင် မေးခွန်း တစ်ခု မေးပါရစေ။ platform team က Billing repository ကနေ database migration
      command ကို ဘယ်တော့မှ မ run ရဘူးလို့ ပြောထားပါတယ်။ ဒီ စည်းကမ်းကို ဘယ်မှာ ထားသင့်လဲ။
      [[mark:q-a]] ပထမ အဖြေက CLAUDE.md ထဲမှာ စာကြောင်း တစ်ကြောင်း ရေးထားတာပါ။
      [[mark:q-b]] ဒုတိယ အဖြေက hook ဒါမှမဟုတ် deny rule တစ်ခုနဲ့ ပိတ်ထားတာပါ။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ တစ်ခုပါ။ ဘာကြောင့်လဲဆိုတော့ migration ကို တစ်ခါ မှားပြီး run မိတာနဲ့
      ပြန်ပြင်ရ ခက်တဲ့ ပြဿနာ ဖြစ်နိုင်လို့ပါ။ format တုန်းကလို ဆယ်ခါမှာ တစ်ခါ ကျော်သွားတာကို လက်ခံလို့ မရပါဘူး။
      [[mark:q-why]] hook နဲ့ deny rule နှစ်ခုလုံးကို model က မဟုတ်ဘဲ Claude Code က ကျင့်သုံးတာမို့ အမြဲ အလုပ်လုပ်ပါတယ်။ command
      ပုံစံ တစ်ခုကို ပိတ်ရုံဆိုရင် deny rule လုံလောက်ပြီး၊ command ထဲကို ကြည့်ပြီး ဆုံးဖြတ်ရမယ်၊ ကိုယ်ပိုင် message ပြချင်တယ်
      ဆိုရင်တော့ hook က ပိုသင့်တော်ပါတယ်။
      [[mark:q-rule]] ဆိုလိုတာက အများအားဖြင့် လိုက်နာရင် ရတဲ့ စည်းကမ်းကို CLAUDE.md မှာ ရေးပါ။ အမြဲ ဖြစ်ရမယ့် စည်းကမ်းကိုတော့
      hook ဒါမှမဟုတ် deny rule နဲ့ ထားပါ။
    sources:
      - {
          title: "Claude Code Docs: Best practices (deterministic and non-deterministic controls)",
          url: "https://code.claude.com/docs/en/best-practices",
        }
      - {
          title: "Claude Code Docs: Permissions",
          url: "https://code.claude.com/docs/en/permissions",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: q-rule },
          upsertIds: [q-t1, q-t2],
          drawMs: 1600,
        }

  - id: timeline
    chapter: Hook run တဲ့ နေရာ
    narration: >
      [[mark:h-open]] ဒီ ကွာခြားချက်ကို board ပေါ်မှာ နှစ်ကြောင်းနဲ့ ချုပ်ကြည့်ရအောင်။
      [[mark:h-c1]] CLAUDE.md ထဲက စာကြောင်းကို model က ဖတ်ပြီး ဘယ်အချိန် လုပ်မလဲ ကိုယ်တိုင် ဆုံးဖြတ်ပါတယ်။
      [[mark:h-c2]] hook ကတော့ Claude Code က သတ်မှတ်ထားတဲ့ အဆင့် ရောက်တိုင်း run ပါတယ်။ docs က ဒါကို deterministic လို့
      ခေါ်ပါတယ်။ ဆိုလိုတာက ဘယ်နှခါ ဖြစ်ဖြစ် အတူတူ ဖြစ်တယ် ဆိုတာပါ။
      [[mark:h-line]] အဲဒီ အဆင့်တွေကို turn တစ်ခုရဲ့ အချိန်လိုင်းပေါ်မှာ ကြည့်ပါ။ ကိုယ်က prompt ပို့ပြီးတဲ့နောက် Claude က tool
      တွေကို တစ်ခုပြီးတစ်ခု သုံးသွားပါတယ်။
      [[mark:h-pre]] tool တစ်ခု မ run ခင်မှာ PreToolUse ဆိုတဲ့ event ရှိပါတယ်။ ဒီမှာ hook က tool call ကို ပိတ်နိုင်ပါတယ်။
      Billing အတွက် migration command ကို ပိတ်မယ့် နေရာပါ။
      [[mark:h-post]] tool run ပြီးတာနဲ့ PostToolUse ဆိုတဲ့ event ရှိပါတယ်။ file ကို ပြင်ပြီးတိုင်း format လုပ်မယ့် hook ကို ဒီမှာ
      ထားပါမယ်။
      [[mark:h-stop]] နောက်ဆုံး Claude က အဖြေ ပေးပြီး ရပ်ခါနီးမှာ Stop ဆိုတဲ့ event ရှိပါတယ်။ ဒီမှာ check တစ်ခုကို run ပြီး
      မအောင်မြင်ရင် Claude ကို ဆက်လုပ်ခိုင်းလို့ ရပါတယ်။ ဒါကြောင့် test pass မှ ရပ်ရမယ် ဆိုတဲ့ စည်းကမ်းကို model ရဲ့
      ဆုံးဖြတ်ချက်အစား Claude Code က စစ်ပေးအောင် လုပ်လို့ ရပါတယ်။ ဒါပေမဲ့ ဆက်တိုက် ရှစ်ခါ ပိတ်ပြီးရင်တော့ Claude Code က
      turn ကို ပြီးခွင့် ပေးလိုက်ပါတယ်။
      [[mark:h-more]] event တွေ အများကြီး ရှိပါတယ်။ session စတဲ့အချိန်၊ prompt ပို့တဲ့အချိန်၊ compaction မတိုင်ခင် စတာတွေပါ။
      ဒါပေမဲ့ စစချင်း ဒီ သုံးခု သိရင် လုံလောက်ပါတယ်။
    sources:
      - {
          title: "Claude Code Docs: Hooks reference (events)",
          url: "https://code.claude.com/docs/en/hooks",
        }
      - {
          title: "Claude Code Docs: Hooks guide",
          url: "https://code.claude.com/docs/en/hooks-guide",
        }
    actions:
      - {
          id: draw-h-open,
          type: whiteboard.apply,
          at: { mark: h-open },
          clear: true,
          upsertIds: [h-title],
        }
      - {
          id: draw-h-c1,
          type: whiteboard.apply,
          at: { mark: h-c1 },
          upsertIds: [h-c1],
          drawMs: 900,
        }
      - {
          id: draw-h-c2,
          type: whiteboard.apply,
          at: { mark: h-c2 },
          upsertIds: [h-c2],
          drawMs: 900,
        }
      - {
          id: draw-h-line,
          type: whiteboard.apply,
          at: { mark: h-line },
          upsertIds: [h-line, h-e0],
          drawMs: 1200,
        }
      - {
          id: draw-h-pre,
          type: whiteboard.apply,
          at: { mark: h-pre },
          upsertIds: [h-e1, h-d1, h-u1],
          drawMs: 1500,
        }
      - {
          id: draw-h-post,
          type: whiteboard.apply,
          at: { mark: h-post },
          upsertIds: [h-e2, h-d2, h-u2],
          drawMs: 1500,
        }
      - {
          id: draw-h-stop,
          type: whiteboard.apply,
          at: { mark: h-stop },
          upsertIds: [h-e3, h-d3, h-u3],
          drawMs: 1500,
        }

  - id: format-hook
    chapter: Format hook
    narration: >
      [[mark:f-open]] ဒါဆို hook နှစ်ခုကို Billing ရဲ့ shared settings file ထဲမှာ ရေးကြည့်ရအောင်။ permission rule တွေ ရှိပြီးသား
      ဖြစ်ပြီး၊ hooks ဆိုတဲ့ key အောက်မှာ event နှစ်ခုရဲ့ နေရာကို ချထားပါတယ်။ settings file က JSON အတိအကျ ဖြစ်ရလို့
      comment ဒါမှမဟုတ် ပိုနေတဲ့ comma တစ်ခုတောင် error ဖြစ်ပါတယ်။
      [[mark:sel-post]] ပထမ hook က PostToolUse event အောက်မှာပါ။ hook တစ်ခုမှာ အဆင့် သုံးဆင့် ရှိပါတယ်။ event၊ matcher နဲ့
      run မယ့် handler ပါ။
      [[mark:type-format]] matcher က Edit နဲ့ Write ပါ။ ဒီ နှစ်ခုကို နာမည် အတိအကျနဲ့ တိုက်စစ်တာမို့ file ပြင်တဲ့ tool
      တွေ run ပြီးမှပဲ ဒီ hook က run ပါတယ်။ handler က command အမျိုးအစား ဖြစ်ပါတယ်။ model ကို ဆုံးဖြတ်ခိုင်းတဲ့ prompt
      hook နဲ့ စမ်းသပ်ဆဲ feature ဖြစ်တဲ့ agent hook ဆိုတာလည်း ရှိပေမဲ့ အဲဒါတွေက deterministic မဟုတ်ပါဘူး။ တကယ် ကျင့်သုံးစေချင်ရင် command hook ကို
      သုံးပါ။
      [[mark:sel-format-cmd]] command ကတော့ Claude Code က hook ကို ပို့ပေးတဲ့ JSON ထဲကနေ ပြင်လိုက်တဲ့ file ရဲ့ path ကို jq နဲ့
      ထုတ်ယူပြီး၊ အဲဒီ file ကို Prettier နဲ့ format လုပ်တာပါ။ ဒီ command ကို Claude ကိုယ်တိုင် ရွေးတာ မဟုတ်တော့ ပြင်တဲ့
      file တိုင်းမှာ အမြဲ run ပါတယ်။
    sources:
      - {
          title: "Claude Code Docs: Hooks guide (format after edit)",
          url: "https://code.claude.com/docs/en/hooks-guide",
        }
      - {
          title: "Claude Code Docs: Hooks reference (configuration, matchers)",
          url: "https://code.claude.com/docs/en/hooks",
        }
      - { title: "Claude Code Docs: Settings", url: "https://code.claude.com/docs/en/settings" }
    actions:
      - { id: close-timeline, type: whiteboard.apply, at: { mark: f-open }, open: false }
      - {
          id: open-settings,
          type: workspace.openFile,
          at: { afterAction: close-timeline },
          path: billing-service/.claude/settings.json,
        }
      - id: sel-post
        type: editor.select
        at: { mark: sel-post }
        target:
          file: billing-service/.claude/settings.json
          text: '"PostToolUse": ['
      - id: type-format
        type: editor.type
        at: { mark: type-format }
        cadence: line-by-line
        target:
          { file: billing-service/.claude/settings.json, after: "\"PostToolUse\": [\n      {\n" }
        text: |2
                  "matcher": "Edit|Write",
                  "hooks": [{
                    "type": "command",
                    "command": "f=$(jq -r '.tool_input.file_path') && npx prettier --write --ignore-unknown \"$f\""
                  }]
      - id: sel-format-cmd
        type: editor.select
        at: { mark: sel-format-cmd }
        target:
          file: billing-service/.claude/settings.json
          text: "f=$(jq -r '.tool_input.file_path') && npx prettier --write --ignore-unknown"

  - id: block-hook
    chapter: Command ကို ပိတ်တဲ့ hook
    narration: >
      [[mark:type-block]] ဒုတိယ hook က PreToolUse event အောက်မှာပါ။ matcher က Bash ဖြစ်လို့ shell command တိုင်း မ run ခင်
      ဒီ hook က run ပါတယ်။ handler ကတော့ project ထဲက script တစ်ခုကို ခေါ်ပါတယ်။
      [[mark:open-script]] အဲဒီ script ကို ကြည့်ရအောင်။ Claude Code က run မယ့် command ကို JSON နဲ့ ပို့ပေးတော့၊ script က
      command ထဲမှာ migrate ဆိုတဲ့ စကားလုံး ပါလား စစ်ပါတယ်။
      [[mark:sel-exit2]] ပါရင် အကြောင်းပြချက်ကို standard error ကို ရေးပြီး exit code နှစ်နဲ့ ထွက်ပါတယ်။ PreToolUse မှာ exit code
      နှစ်က tool call ကို ပိတ်လိုက်ပြီး၊ standard error ထဲက စာက Claude ဆီ အကြောင်းပြချက် အဖြစ် ရောက်သွားပါတယ်။
      [[mark:sel-exit0]] မပါရင် exit code သုညနဲ့ ထွက်ပါတယ်။ ဒါက ခွင့်ပြုချက် ပေးတာ မဟုတ်ဘဲ hook က မပိတ်လိုက်တာပဲ
      ဖြစ်လို့၊ ပုံမှန် permission စစ်တာက ဆက်ရှိနေပါသေးတယ်။ တခြား exit code တွေကတော့ ပိတ်တဲ့
      error မဟုတ်လို့ action က ဆက်သွားပါတယ်။
      [[mark:sel-exit2-post]] PostToolUse မှာတော့ exit code နှစ်နဲ့ ထွက်လည်း tool က run ပြီးသွားပြီ ဖြစ်လို့
      ဘာမှ မပိတ်တော့ဘဲ၊ Claude က error စာကိုပဲ မြင်ရပါတယ်။ exit code အစား JSON နဲ့ ဖြေချင်ရင်တော့ exit code သုညနဲ့ ထွက်ပြီး၊
      permission decision ကို deny၊ allow ဒါမှမဟုတ် ask ပေးလို့ ရပါတယ်။
    sources:
      - {
          title: "Claude Code Docs: Hooks reference (exit codes, JSON output)",
          url: "https://code.claude.com/docs/en/hooks",
        }
      - {
          title: "Claude Code Docs: Hooks guide (block a command)",
          url: "https://code.claude.com/docs/en/hooks-guide",
        }
    actions:
      - id: type-block
        type: editor.type
        at: { mark: type-block }
        cadence: line-by-line
        target:
          { file: billing-service/.claude/settings.json, after: "\"PreToolUse\": [\n      {\n" }
        text: |2
                  "matcher": "Bash",
                  "hooks": [{
                    "type": "command",
                    "command": "\"$CLAUDE_PROJECT_DIR\"/.claude/hooks/block-migrations.sh"
                  }]
      - id: expect-block
        type: expect.file
        at: { afterAction: type-block }
        path: billing-service/.claude/settings.json
        contains: "        \"matcher\": \"Bash\",\n"
      - {
          id: open-script,
          type: workspace.openFile,
          at: { mark: open-script },
          path: billing-service/.claude/hooks/block-migrations.sh,
        }
      - id: sel-migrate
        type: editor.select
        at: { afterAction: open-script }
        target:
          file: billing-service/.claude/hooks/block-migrations.sh
          text: 'if [[ "$cmd" == *migrate* ]]; then'
      - id: sel-exit2
        type: editor.select
        at: { mark: sel-exit2 }
        target:
          file: billing-service/.claude/hooks/block-migrations.sh
          text: "  exit 2"
      - id: sel-exit0
        type: editor.select
        at: { mark: sel-exit0 }
        target:
          file: billing-service/.claude/hooks/block-migrations.sh
          text: "exit 0"
      - id: sel-exit2-post
        type: editor.select
        at: { mark: sel-exit2-post }
        target:
          file: billing-service/.claude/hooks/block-migrations.sh
          text: "  exit 2"

  - id: blocked
    chapter: Hook ပိတ်လိုက်တဲ့အခါ
    narration: >
      [[mark:b-open]] ဒီ hook အလုပ်လုပ်တဲ့အခါ ဘယ်လို မြင်ရလဲ ကြည့်ရအောင်။ ဒီ screen မှာ project hook တစ်ခုက
      command တစ်ခုကို ပိတ်လိုက်တာကို ဒီလို မြင်ရပါတယ်။
      [[mark:b-prompt]] prompt က pending ဖြစ်နေတဲ့ database migration ကို run ပေးဖို့ပါ။
      [[mark:b-call]] Claude က npm run migrate ကို run ဖို့ ကြိုးစားပါတယ်။
      [[mark:b-hook]] PreToolUse hook က အဲဒီ call ကို ပိတ်လိုက်ပြီး၊ script ရဲ့ message က tool ရဲ့ ရလဒ်အဖြစ် Claude ဆီ ပြန်ရောက်ပါတယ်။
      [[mark:b-reply]] Claude ရဲ့ အဖြေကို ကြည့်ပါ။ hook က ပိတ်လိုက်ကြောင်း ပြောပြီး၊ တခြား နည်းနဲ့ ထပ်မကြိုးစားဘဲ platform team
      ကို မေးဖို့ ပြန်ပြောပါတယ်။ ဒီ screen က စမ်းသပ်ဖို့ ပြင်ထားတဲ့ session ဖြစ်ပြီး Claude ရဲ့ အဖြေ စာသားကို ကြိုရေးထားတာပါ။
      ဒါပေမဲ့ hook ကတော့ တကယ် run ပြီး exit code နှစ်နဲ့ ပိတ်ခဲ့တာပါ။
    sources:
      - {
          title: "Claude Code Docs: Hooks reference (exit code 2)",
          url: "https://code.claude.com/docs/en/hooks",
        }
    actions:
      - {
          id: show-blocked,
          type: slide.show,
          at: { mark: b-open, offsetMs: -1200 },
          slideId: blocked-screen,
        }
      - {
          id: point-b-title,
          type: slide.point,
          at: { mark: b-open, offsetMs: 3500 },
          target: { x: 0.243, y: 0.349 },
        }
      - {
          id: point-b-prompt,
          type: slide.point,
          at: { mark: b-prompt },
          target: { x: 0.163, y: 0.259 },
        }
      - {
          id: point-b-call,
          type: slide.point,
          at: { mark: b-call },
          target: { x: 0.163, y: 0.319 },
        }
      - {
          id: point-b-hook,
          type: slide.point,
          at: { mark: b-hook },
          target: { x: 0.187, y: 0.379 },
        }
      - {
          id: point-b-reply,
          type: slide.point,
          at: { mark: b-reply },
          target: { x: 0.163, y: 0.470 },
        }

  - id: hooks-view
    chapter: Hooks command
    narration: >
      [[mark:v-open]] project မှာ ဘယ် hook တွေ ရှိလဲ ဆိုတာကို hooks command နဲ့ ကြည့်လို့ ရပါတယ်။ ဒီ screen မှာ အဲဒီ command
      ကို ဒီလို မြင်ရပါတယ်။
      [[mark:v-readonly]] ဒီ view က ဖတ်ဖို့သက်သက်ပါ။ hook ကို ထည့်ချင်၊ ပြင်ချင်ရင် settings file ကို ကိုယ်တိုင် ပြင်ရပါတယ်၊
      ဒါမှမဟုတ် Claude ကို ပြင်ခိုင်းရပါတယ်။
      [[mark:v-event]] PreToolUse event အောက်မှာ project settings ကလာတဲ့ hook တစ်ခု ရှိပြီး၊ Bash matcher နဲ့ command
      handler ဖြစ်ကြောင်း ပြထားပါတယ်။
      [[mark:v-trust]] project settings ထဲက hook တွေက repository ကို clone လုပ်တဲ့ developer တိုင်းရဲ့ စက်ပေါ်မှာ run မှာ
      ဖြစ်လို့၊ folder ကို ယုံကြည်ကြောင်း ခွင့်ပြုပြီးမှ သက်ရောက်ပါတယ်။ hook ကို code တစ်ခုလို review လုပ်ပြီးမှ commit
      လုပ်ပါ။ hook တွေက settings file ကနေသာမက plugin တွေ၊ skill တွေနဲ့ subagent file တွေကနေလည်း လာနိုင်ပါတယ်။
    sources:
      - {
          title: "Claude Code Docs: Hooks reference (the hooks command)",
          url: "https://code.claude.com/docs/en/hooks",
        }
    actions:
      - {
          id: show-hooks,
          type: slide.show,
          at: { mark: v-open, offsetMs: -1200 },
          slideId: hooks-screen,
        }
      - {
          id: point-v-title,
          type: slide.point,
          at: { mark: v-open, offsetMs: 2500 },
          target: { x: 0.081, y: 0.429 },
        }
      - {
          id: point-v-readonly,
          type: slide.point,
          at: { mark: v-readonly },
          target: { x: 0.114, y: 0.535 },
        }
      - {
          id: point-v-event,
          type: slide.point,
          at: { mark: v-event },
          target: { x: 0.124, y: 0.606 },
        }
      - {
          id: point-v-trust,
          type: slide.point,
          at: { mark: v-trust },
          target: { x: 0.119, y: 0.641 },
        }

  - id: your-turn
    chapter: ကိုယ့် team အတွက်
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ကိုယ့် team ရဲ့ စည်းကမ်းတွေထဲက ဘယ်တော့မှ မကျော်ရမယ့်
      စည်းကမ်း တစ်ခုကို ရွေးပါ။ ပြီးရင် ဒီ settings file ထဲက ပုံစံအတိုင်း event၊ matcher နဲ့ command ကို ရေးကြည့်ပါ။
      [[mark:turn-2]] tool မ run ခင် ပိတ်ရမှာလား၊ tool ပြီးမှ လုပ်ရမှာလား၊ Claude ရပ်ခါနီးမှ စစ်ရမှာလား ဆိုတာ အရင် ဆုံးဖြတ်ပါ။
      အဲဒီ အဖြေက ဘယ် event ကို သုံးမလဲ ဆိုတာကို ပြောပြပါလိမ့်မယ်။
    sources:
      - {
          title: "Claude Code Docs: Hooks guide",
          url: "https://code.claude.com/docs/en/hooks-guide",
        }
    actions:
