# AI course, lesson 11: client-side or server-side — the four platform options and their criteria
# (Burmese, concept lesson).
#
# A concept lesson (no deck, lead decision 2026-11-05): whiteboard boards carry the lists and the
# diagrams; the AI panel shows one static table card drawn by pinned code. No code is typed.
#
# Start state (ws/): notes.md (the key lines, highlighted in the recap); src/platforms.js holds the
# estimates (four options × eleven criteria, 1–5, 5 = the best for you; curriculum §3.5's corrected
# cells: managed privacy 2, self-hosted privacy 3, self-hosted cost per request 3, server-side user
# convenience 4); src/main.js draws them as the table card `ai-estimates` (badge `ခန့်မှန်းချက်`:
# estimates, no model anywhere, M0). The runtime starts at the first mark only to show that card
# (≥ 1,000 board characters before runtime.waitForReady).
#
# Boards: (A) the mini blueprint with Intelligence highlighted; (P) client side vs server side with
# the example pair; (X) the 2×2 — where the model runs × how much control — with the four options;
# (M) the Burmese constraint; (Z) the quiz. The board is a modal: the panel is seen in the three
# `criteria-*` scenes, the editor (notes.md) in the recap.
#
# Build: bun ~/Documents/ai-course-work/tools/build-lesson.ts template.yaml ws ai-course-11-platforms.yaml
