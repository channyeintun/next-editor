build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 5111
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "Model ကို ဘယ်မှာ run မလဲ"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ model မသေချာတဲ့ အဖြေကို စစ်ခိုင်းတာ၊ ဘာကြောင့်လဲ ဆိုတာ ပြတာတွေနဲ့
      user က AI ကို calibrated trust နဲ့ သုံးနိုင်အောင် လုပ်ခဲ့ပါတယ်။ ဒီ lesson ကစပြီး model ကို
      ဘယ်မှာ run မလဲ ဆိုတဲ့ platform ရွေးတာကို လေ့လာပါမယ်။ ဒီ ရွေးချယ်မှုက feature ရဲ့ မြန်နှုန်း၊
      ကုန်ကျစရိတ်၊ user များလာရင် ခံနိုင်မခံနိုင်နဲ့ user ရဲ့ ယုံကြည်မှုအထိ သက်ရောက်ပါတယ်။
      [[mark:draw-mini]] blueprint မှာ ကြည့်ရင်၊ ဒီနေ့ အဓိက ကြည့်မှာက Solution ထဲက intelligence
      အလွှာပါ။ [[mark:draw-today]] model ကို user ရဲ့ browser ထဲမှာ run မလား၊ server ပေါ်မှာ run မလား
      ဆိုတာ ဒီ အလွှာမှာ ဆုံးဖြတ်ရလို့ပါ။
    sources:
      - {
          title: "web.dev Learn AI: Choose your platform",
          url: "https://web.dev/learn/ai/platform",
        }
      - {
          title: "web.dev Learn AI: Introduction to AI on the web (the blueprint)",
          url: "https://web.dev/learn/ai/introduction",
        }
      - {
          title: "web.dev Learn AI: Welcome to Learn AI! (course credit: written by Dr. Janna Lipenkova with editorial guidance from Alexandra Klepper; text CC BY 4.0, code Apache 2.0; adapted into Burmese with the course's own tea-shop examples)",
          url: "https://web.dev/learn/ai/welcome",
        }
      - {
          title: "Creative Commons: Attribution 4.0 International (CC BY 4.0), the licence of the web.dev Learn AI text adapted here",
          url: "https://creativecommons.org/licenses/by/4.0/",
        }
    actions:
      - {
          id: open-board-a,
          type: whiteboard.apply,
          at: { scene: start, offsetMs: -450 },
          open: true,
          clear: true,
          upsertIds: [a-title],
        }
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - {
          id: draw-mini,
          type: whiteboard.apply,
          at: { mark: draw-mini },
          upsertIds:
            [
              a-opp,
              a-opp-t,
              a-arrow-1,
              a-data,
              a-data-t,
              a-intel,
              a-intel-t,
              a-ux,
              a-ux-t,
              a-arrow-2,
              a-gov,
              a-gov-t,
            ],
          drawMs: 2400,
        }
      - {
          id: draw-today,
          type: whiteboard.apply,
          at: { mark: draw-today },
          upsertIds: [a-today],
          drawMs: 1000,
        }

  - id: two-sides
    chapter: "Client side နဲ့ server side"
    narration: >
      [[mark:draw-sides]] platform ကို အကြမ်းဖျင်း နှစ်မျိုး ခွဲလို့ ရပါတယ်။ [[mark:draw-client]] ပထမ
      တစ်မျိုးက client side AI ပါ။ user ရဲ့ browser ထဲမှာ model ကို run တာ ဖြစ်လို့၊ data က user ရဲ့
      device ထဲမှာပဲ ကျန်သလို၊ network ကနေ အဖြေ ပြန်လာတာကိုလည်း စောင့်စရာ မလိုပါဘူး။ [[mark:draw-client-limit]]
      ဒါပေမဲ့ device ထဲမှာ run နိုင်တဲ့ model တွေက သေးလို့၊ review တစ်ခု ကောင်းလား ဆိုးလား ခွဲတာ၊
      မသင့်တော်တဲ့ စာကို ဖမ်းတာ လို ဖြစ်နိုင်တဲ့ အဖြေ နည်းနည်းပဲ ရှိတဲ့ ကျဉ်းကျဉ်း အလုပ်တွေမှာ ပိုသင့်တော်ပါတယ်။
      [[mark:draw-server]] ဒုတိယ တစ်မျိုးက server side AI ပါ။ cloud ပေါ်က server မှာ model ကို run တာ
      ဖြစ်လို့၊ model ကြီးတွေကို သုံးနိုင်ပြီး user များလာလည်း ခံနိုင်ပါတယ်။ user ရဲ့ device
      ဘယ်လောက်ပဲ အားနည်းနည်း အလုပ်လုပ်ပါတယ်။ [[mark:draw-server-cost]] အဲဒီအစား request တိုင်း network
      ကို ဖြတ်ရလို့ latency ရှိပြီး၊ server အတွက် ငွေလည်း ကုန်ပါတယ်။ [[mark:draw-pair]] ဥပမာအားဖြင့်၊
      ကောင်တာက လှလှ ရဲ့ နေ့စဉ် မှတ်စုထဲမှာ customer ဖုန်းနံပါတ်တွေ ပါနေရင်၊ အဲဒီ မှတ်စုကို လှလှ
      သုံးနေတဲ့ browser ထဲမှာပဲ အနှစ်ချုပ်တာက PII ကို ဆိုင် အပြင် မပို့ရလို့ ပိုသင့်တော်ပါတယ်။ customer မေးခွန်းကို
      ဖြေမယ့် assistant ကတော့ ဆိုင်ရဲ့ menu၊ delivery၊ အော်ဒါ အချက်အလက် အားလုံးကို သုံးရလို့ cloud
      ပေါ်က model ကြီးနဲ့ ပိုအသုံးဝင်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Choose your platform",
          url: "https://web.dev/learn/ai/platform",
        }
    actions:
      - {
          id: draw-sides,
          type: whiteboard.apply,
          at: { mark: draw-sides },
          clear: true,
          upsertIds: [p-title],
        }
      - {
          id: draw-client,
          type: whiteboard.apply,
          at: { mark: draw-client },
          upsertIds: [p-c-box, p-c-t, p-c-1, p-c-2, p-c-3],
          drawMs: 2200,
        }
      - {
          id: draw-client-limit,
          type: whiteboard.apply,
          at: { mark: draw-client-limit },
          upsertIds: [p-c-4],
          drawMs: 900,
        }
      - {
          id: draw-server,
          type: whiteboard.apply,
          at: { mark: draw-server },
          upsertIds: [p-s-box, p-s-t, p-s-1, p-s-2, p-s-3],
          drawMs: 2200,
        }
      - {
          id: draw-server-cost,
          type: whiteboard.apply,
          at: { mark: draw-server-cost },
          upsertIds: [p-s-4],
          drawMs: 900,
        }
      - {
          id: draw-pair,
          type: whiteboard.apply,
          at: { mark: draw-pair },
          upsertIds: [p-c-ex, p-s-ex],
          drawMs: 1400,
        }

  - id: axes
    chapter: "Platform လေးမျိုး"
    narration: >
      [[mark:draw-axes]] platform ရွေးတဲ့အခါ မေးခွန်း နှစ်ခုကို အရင် မေးရပါတယ်။ [[mark:draw-where]]
      ပထမက model ကို ဘယ်မှာ run မလဲ ဆိုတာပါ။ board ပေါ်မှာ ဘယ်ဘက်က server side၊ ညာဘက်က client side
      ဖြစ်ပြီး ညာဘက်ကို သွားလေ user နဲ့ ပိုနီးလေပါ။ [[mark:draw-control]] ဒုတိယက model ကို ကိုယ်
      ဘယ်လောက် ထိန်းချုပ်ချင်လဲ ဆိုတာပါ။ lesson ၅ မှာ train လုပ်ရင်း ညှိယူတဲ့ ဂဏန်းတွေကို model weights
      လို့ ခေါ်ခဲ့တာ မှတ်မိမှာပါ။ Gemma လို open model တွေမှာ အဲဒီ weight တွေကို ကိုယ်တိုင် ပြင်လို့
      ရလို့၊ model ရဲ့ အပြုအမူကို ကိုယ့် လိုအပ်ချက်နဲ့ ကိုက်အောင် ပြောင်းနိုင်ပါတယ်။ board ပေါ်မှာ
      အောက်ကို ဆင်းလေ ထိန်းချုပ်နိုင်လေပါ။
    sources:
      - {
          title: "web.dev Learn AI: Choose your platform (review the options)",
          url: "https://web.dev/learn/ai/platform",
        }
      - {
          title: "web.dev Learn AI: Glossary and concepts (model weights)",
          url: "https://web.dev/learn/ai/glossary",
        }
    actions:
      - {
          id: draw-axes,
          type: whiteboard.apply,
          at: { mark: draw-axes },
          clear: true,
          upsertIds: [x-title],
        }
      - {
          id: draw-where,
          type: whiteboard.apply,
          at: { mark: draw-where },
          upsertIds: [x-h-server, x-near-arrow, x-h-client, x-near],
          drawMs: 2000,
        }
      - {
          id: draw-control,
          type: whiteboard.apply,
          at: { mark: draw-control },
          upsertIds: [x-ctrl-arrow, x-ctrl],
          drawMs: 1400,
        }

  - id: client-options
    narration: >
      [[mark:draw-builtin]] client side မှာ ပထမ တစ်မျိုးက built in AI ပါ။ browser ထဲမှာ ပါပြီးသား
      model ကို JavaScript API နဲ့ ခေါ်သုံးတာပါ။ Chrome မှာဆိုရင် Gemini Nano ဆိုတဲ့ model ပါပြီး၊ Edge
      ကလည်း စမ်းသပ်နေပါတယ်။ ကိုယ်က model ကို host လုပ်စရာ မလိုသလို၊ browser က model ကို တစ်ခါ
      ယူထားပြီးရင် website အားလုံးက အဲဒီ model တစ်ခုတည်းကို မျှသုံးပါတယ်။ ဒါပေမဲ့ weight တွေကို ပြင်လို့
      မရလို့ prompt နဲ့ပဲ အပြုအမူကို ပြောင်းနိုင်ပါတယ်။ [[mark:draw-custom]] ဒုတိယ တစ်မျိုးက custom
      model ပါ။ Transformers.js၊ MediaPipe လို library တွေနဲ့ ကိုယ်တိုင် ရွေးထားတဲ့ model ကို website နဲ့
      တွဲပို့တာပါ။ weight တွေကို ကိုယ် ထိန်းချုပ်နိုင်ပေမယ့်၊ website ကို လာတဲ့ user တိုင်းက အဲဒီ model
      ဖိုင်ကို သူ့ device ထဲ အရင် ယူရပါတယ်။ website တစ်ခုအတွက်ဆိုရင် model အသေးဆုံးတောင် ဖိုင်
      အရမ်း ကြီးပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Choose your platform (client-side AI)",
          url: "https://web.dev/learn/ai/platform",
        }
      - {
          title: "Chrome for Developers: Built-in AI",
          url: "https://developer.chrome.com/docs/ai/built-in",
        }
      - {
          title: "Microsoft Edge: Prompt API",
          url: "https://learn.microsoft.com/microsoft-edge/web-platform/prompt-api",
        }
    actions:
      - {
          id: draw-builtin,
          type: whiteboard.apply,
          at: { mark: draw-builtin },
          upsertIds: [x-builtin, x-builtin-t, x-builtin-s],
          drawMs: 1500,
        }
      - {
          id: draw-custom,
          type: whiteboard.apply,
          at: { mark: draw-custom },
          upsertIds: [x-custom, x-custom-t, x-custom-s],
          drawMs: 1500,
        }

  - id: server-options
    narration: >
      [[mark:draw-managed]] server side မှာတော့ ပထမ တစ်မျိုးက managed service ပါ။ Gemini၊ GPT၊ Claude
      လို model တွေကို ပိုင်ရှင် ကုမ္ပဏီရဲ့ server ပေါ်မှာ ထားပြီး API နဲ့ ခေါ်သုံးတာပါ။ setup နည်းနည်းနဲ့
      အစွမ်းထက်ဆုံး model တွေကို သုံးနိုင်လို့၊ prototype အမြန် လုပ်တာ၊ စိတ်ကြိုက် စကားပြောတာ၊ အဆင့်ဆင့်
      ကျိုးကြောင်း ဆက်စပ်ရတဲ့ အလုပ်တွေအတွက် အသင့်တော်ဆုံးပါ။ [[mark:draw-self]] ဒုတိယ တစ်မျိုးက self hosted model ပါ။ Gemma၊ Llama
      လို weight တွေကို ယူပြီး ပြင်လို့ ရတဲ့ open weight model တွေကို ကိုယ့် server ပေါ်မှာ ဒါမှမဟုတ် ငှားထားတဲ့ container ထဲမှာ ကိုယ်တိုင်
      run တာပါ။ model ပိုင်ရှင်က ကြို train ထားတာကို အသုံးချရင်း၊ model နဲ့ data ကို ကိုယ်ပဲ
      ထိန်းချုပ်ထားနိုင်ပါတယ်။ [[mark:server-privacy]] server ဘက်မှာလည်း user ရဲ့ privacy ကို ကာကွယ်ဖို့
      Google ရဲ့ Private AI Compute လို နည်းအသစ်တွေ ထွက်လာနေပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Choose your platform (server-side AI)",
          url: "https://web.dev/learn/ai/platform",
        }
      - {
          title: "Google: Private AI Compute",
          url: "https://blog.google/technology/ai/google-private-ai-compute/",
        }
    actions:
      - {
          id: draw-managed,
          type: whiteboard.apply,
          at: { mark: draw-managed },
          upsertIds: [x-managed, x-managed-t, x-managed-s],
          drawMs: 1500,
        }
      - {
          id: draw-self,
          type: whiteboard.apply,
          at: { mark: draw-self },
          upsertIds: [x-self, x-self-t, x-self-s],
          drawMs: 1500,
        }

  - id: criteria-model
    chapter: "ဘယ် platform ရွေးမလဲ"
    narration: >
      [[mark:close-x]] ဒါဆို platform လေးမျိုးကို criteria တွေနဲ့ ယှဉ်ကြည့်ရအောင်။ [[mark:panel-ready]]
      ညာဘက်က AI panel မှာ ဇယား card တစ်ခု ပေါ်နေပါတယ်။ ဒီ card မှာ platform လေးမျိုးကို
      criteria တစ်ခုချင်းအလိုက် အမှတ် ၁ ကနေ ၅ အထိ ပေးထားပါတယ်။ [[mark:open-estimates]] အမှတ်တွေက ဒီ
      ဖိုင်ထဲမှာ ရှိပြီး၊ ၅ ဆိုတာ ကိုယ့်ဘက်က အသာဆုံးပါ။ ကုန်ကျစရိတ်ဆိုရင် အသက်သာဆုံး၊ latency ဆိုရင်
      အမြန်ဆုံး၊ maintenance ဆိုရင် အလုပ် အနည်းဆုံးလို့ ဆိုလိုပါတယ်။ card ရဲ့ badge ကလည်း ခန့်မှန်းချက်လို့
      ပြနေပါတယ်။ hardware၊ model၊ သုံးတဲ့ ပမာဏ ပေါ်မူတည်ပြီး တကယ့် အခြေအနေမှာ ပြောင်းနိုင်လို့ပါ။
      [[mark:sel-model]] ပထမ အုပ်စုက model နဲ့ ဆိုင်တာပါ။ model ရဲ့ စွမ်းရည်နဲ့ မှန်ကန်မှုမှာ server side
      က အမှတ် များပါတယ်။ browser ထဲက model သေးတွေက ကျဉ်းကျဉ်း အလုပ်မှာ
      လုံလောက်ပေမယ့် ရှုပ်ထွေးတဲ့ input တွေမှာ မှားတာ ပိုများပါတယ်။
      [[mark:sel-custom]] စိတ်ကြိုက် ပြင်လို့ ရတာမှာတော့ weight ကို ကိုင်ခွင့် ရှိတဲ့ custom model နဲ့ self
      hosted model က ၅ ရပြီး၊ built in AI နဲ့ managed service က ၁ ပဲ ရပါတယ်။ ဒီ criteria တချို့က platform ထက် model နဲ့ ပိုဆိုင်ပေမယ့်၊ model က
      platform ကို ကန့်သတ်သလို platform ကလည်း ရွေးလို့ ရတဲ့ model ကို ကန့်သတ်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Choose your platform (define your architectural requirements)",
          url: "https://web.dev/learn/ai/platform",
        }
    actions:
      - { id: close-x, type: whiteboard.apply, at: { mark: close-x }, open: false }
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-done
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: ai-status }
        attribute: { name: data-state, value: "done" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-estimates-card
        type: expect.preview
        at: { afterAction: expect-done }
        timeoutMs: 5000
        target: { by: testId, value: ai-estimates }
        attribute: { name: data-label, value: "Platform estimates · 5 = best" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-estimates-rows
        type: expect.preview
        at: { afterAction: expect-estimates-card }
        timeoutMs: 5000
        target: { by: testId, value: ai-estimates }
        attribute: { name: data-count, value: "11" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - {
          id: open-estimates,
          type: workspace.openFile,
          at: { mark: open-estimates },
          path: src/platforms.js,
        }
      - id: sel-header
        type: editor.select
        at: { afterAction: open-estimates }
        target:
          {
            file: src/platforms.js,
            text: "scored 1–5 for each criterion (5 = the best for you: a stronger\n// model, cheaper, faster, less work)",
            occurrence: 1,
          }
      - id: expect-badge
        type: expect.preview
        at: { afterAction: sel-header }
        timeoutMs: 5000
        target: { by: testId, value: ai-estimates-badge }
        textContains: "ခန့်မှန်းချက်"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: sel-model
        type: editor.select
        at: { mark: sel-model }
        target:
          {
            file: src/platforms.js,
            text: "{ criterion: \"model power\", \"built-in\": 2, custom: 3, managed: 4, \"self-host\": 4 },\n  { criterion: \"accuracy\", \"built-in\": 2, custom: 3, managed: 5, \"self-host\": 4 },",
            occurrence: 1,
          }
      - id: expect-power
        type: expect.preview
        at: { afterAction: sel-model }
        timeoutMs: 5000
        target: { by: testId, value: ai-estimates-1 }
        textContains: "model power2344"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-accuracy
        type: expect.preview
        at: { afterAction: expect-power }
        timeoutMs: 5000
        target: { by: testId, value: ai-estimates-2 }
        textContains: "accuracy2354"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: sel-custom
        type: editor.select
        at: { mark: sel-custom }
        target:
          {
            file: src/platforms.js,
            text: '{ criterion: "customizability", "built-in": 1, custom: 5, managed: 1, "self-host": 5 },',
            occurrence: 1,
          }
      - id: expect-custom
        type: expect.preview
        at: { afterAction: sel-custom }
        timeoutMs: 5000
        target: { by: testId, value: ai-estimates-3 }
        textContains: "customizability1515"
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: criteria-cost
    narration: >
      [[mark:sel-client-wins]] နောက် အုပ်စုမှာတော့ client side က ၅ ချည်းပဲ ရပါတယ်။ user ရဲ့ device ထဲမှာ
      run လို့ network အသွားအပြန် မရှိသလို၊ data လည်း device အပြင် မထွက်ပါဘူး။ user ရဲ့ device ကိုပဲ
      သုံးလို့ server ငွေလည်း မပေးရပါဘူး။ [[mark:sel-privacy]] server ဘက်မှာ privacy ကို ကြည့်ရင်၊
      managed service မှာ user ရဲ့ စာက တခြား ကုမ္ပဏီရဲ့ server ဆီ ရောက်သွားလို့ ၂ ပဲ ရပါတယ်။ self hosted
      model မှာတော့ data က ကိုယ့် server ထဲမှာ ကျန်ပေမယ့် user ရဲ့ device ကနေ ထွက်သွားလို့ ၃ ရပါတယ်။
      [[mark:sel-costs]] ကုန်ကျစရိတ်မှာလည်း အပေးအယူ ရှိပါတယ်။ user ဘယ်လောက် သုံးသုံး အမြဲ ပေးရတဲ့ ပုံသေ
      ကုန်ကျစရိတ်က managed service မှာ မရှိပေမယ့်၊ request တစ်ခုချင်းရဲ့ ကုန်ကျစရိတ်ကိုတော့ ပေးရလို့ user
      များလာလေ ငွေ ပိုကုန်လေပါ။ self hosted model ကတော့ server ကို အမြဲ run ထားရလို့ ပုံသေ ကုန်ကျစရိတ် များပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Choose your platform (define your architectural requirements)",
          url: "https://web.dev/learn/ai/platform",
        }
    actions:
      - id: sel-client-wins
        type: editor.select
        at: { mark: sel-client-wins }
        target:
          {
            file: src/platforms.js,
            text: "{ criterion: \"latency\", \"built-in\": 5, custom: 5, managed: 2, \"self-host\": 2 },\n  { criterion: \"privacy\", \"built-in\": 5, custom: 5, managed: 2, \"self-host\": 3 },\n  { criterion: \"fixed cost\", \"built-in\": 5, custom: 5, managed: 5, \"self-host\": 2 },\n  { criterion: \"cost per request\", \"built-in\": 5, custom: 5, managed: 2, \"self-host\": 3 },",
            occurrence: 1,
          }
      - id: expect-latency
        type: expect.preview
        at: { afterAction: sel-client-wins }
        timeoutMs: 5000
        target: { by: testId, value: ai-estimates-4 }
        textContains: "latency5522"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: sel-privacy
        type: editor.select
        at: { mark: sel-privacy }
        target:
          {
            file: src/platforms.js,
            text: '{ criterion: "privacy", "built-in": 5, custom: 5, managed: 2, "self-host": 3 },',
            occurrence: 1,
          }
      - id: expect-privacy
        type: expect.preview
        at: { afterAction: sel-privacy }
        timeoutMs: 5000
        target: { by: testId, value: ai-estimates-5 }
        textContains: "privacy5523"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: sel-costs
        type: editor.select
        at: { mark: sel-costs }
        target:
          {
            file: src/platforms.js,
            text: "{ criterion: \"fixed cost\", \"built-in\": 5, custom: 5, managed: 5, \"self-host\": 2 },\n  { criterion: \"cost per request\", \"built-in\": 5, custom: 5, managed: 2, \"self-host\": 3 },",
            occurrence: 1,
          }
      - id: expect-fixed
        type: expect.preview
        at: { afterAction: sel-costs }
        timeoutMs: 5000
        target: { by: testId, value: ai-estimates-6 }
        textContains: "fixed cost5552"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-per-request
        type: expect.preview
        at: { afterAction: expect-fixed }
        timeoutMs: 5000
        target: { by: testId, value: ai-estimates-7 }
        textContains: "cost per request5523"
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: criteria-reach
    narration: >
      [[mark:sel-compat]] နောက်ဆုံး အုပ်စုက user ဆီ ဘယ်လောက် ရောက်နိုင်လဲ၊ ကိုယ့်ဘက်က အလုပ် ဘယ်လောက်
      များလဲ ဆိုတာပါ။ compatibility ဆိုတာ fallback မလိုဘဲ browser၊ device ဘယ်လောက် များများမှာ
      အလုပ်လုပ်လဲ ဆိုတာပါ။ browser က API ကိုပဲ ခေါ်ရတဲ့ server side က ဒီမှာ ၅ ရပါတယ်။ built in AI က browser နဲ့ device ပေါ် မူတည်ပြီး၊ custom
      model က user ရဲ့ hardware ပေါ် မူတည်လို့ အမှတ် နည်းပါတယ်။ user ဘက်ကလည်း client side မှာ model ကို
      အရင် ယူထားရလို့ server side လောက် မအဆင်ပြေပါဘူး။ [[mark:sel-dev]] developer ဘက်ကတော့ setup နည်းနည်းနဲ့
      AI ကျွမ်းကျင်မှု သိပ် မလိုတဲ့ built in AI က ၅ ရပြီး၊ server၊ model နဲ့ စောင့်ကြည့်တာ အားလုံး ကိုယ်တိုင်
      လုပ်ရတဲ့ self hosted model က ၁ ပဲ ရပါတယ်။ [[mark:sel-maint]] ထိန်းသိမ်းရတဲ့ အလုပ်မှာတော့ ပိုင်ရှင်
      ကုမ္ပဏီက ထိန်းပေးတဲ့ managed service က ၅ ရပါတယ်။ ဒီလို အမှတ် ၅ ချည်း ရတဲ့ platform မရှိလို့၊ ကိုယ့် feature
      အတွက် ဘယ် criteria က အရေးကြီးဆုံးလဲ ဆိုတာ အရင် ဆုံးဖြတ်ရပါမယ်။
    sources:
