        retry: { maxAttempts: 2, delayMs: 300 }

  - id: burmese
    narration: >
      [[mark:draw-burmese]] ကိုယ်တို့ ဆိုင်အတွက် ဇယားထဲမှာ မပါတဲ့ အရေးကြီးတဲ့ အချက် တစ်ခုလည်း ရှိပါတယ်။
      [[mark:draw-burmese-no]] အခုအချိန်မှာ Chrome ရဲ့ built in AI က မြန်မာစာကို အနှစ်ချုပ်တာ၊ ဘာသာပြန်တာ၊
      prompt နဲ့ ခိုင်းတာ မလုပ်ပေးနိုင်သေးပါဘူး။ [[mark:draw-burmese-yes]] ဒါကြောင့် မြန်မာလို ရေးထားတဲ့
      review တွေ၊ message တွေအတွက် feature ဆိုရင် custom model ဒါမှမဟုတ် server side ကို ရွေးရပါမယ်။
      ဇယားမှာ အမှတ် ဘယ်လောက် များများ၊ user ရဲ့ ဘာသာစကားကို မရရင် အဲဒီ platform က ကိုယ့် feature အတွက်
      မသုံးနိုင်ပါဘူး။
    sources:
      - {
          title: "Chrome for Developers: Built-in AI APIs (supported languages)",
          url: "https://developer.chrome.com/docs/ai/built-in-apis",
        }
      - {
          title: "Chrome for Developers: Translator API",
          url: "https://developer.chrome.com/docs/ai/translator-api",
        }
      - {
          title: "web.dev Learn AI: Choose your platform",
          url: "https://web.dev/learn/ai/platform",
        }
    actions:
      - {
          id: draw-burmese,
          type: whiteboard.apply,
          at: { mark: draw-burmese },
          open: true,
          clear: true,
          upsertIds: [m-title, m-in],
        }
      - {
          id: draw-burmese-no,
          type: whiteboard.apply,
          at: { mark: draw-burmese-no },
          upsertIds: [m-arrow, m-no],
          drawMs: 1300,
        }
      - {
          id: draw-burmese-yes,
          type: whiteboard.apply,
          at: { mark: draw-burmese-yes },
          upsertIds: [m-yes],
          drawMs: 1100,
        }

  - id: quiz
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ ဆိုင်ပိုင်ရှင် မြမြ က AI feature အသစ် တစ်ခုအတွက် platform
      ရွေးခိုင်းရင်၊ အရင်ဆုံး မေးရမယ့် အဓိက မေးခွန်း နှစ်ခုက ဘာတွေလဲ။ lesson ကို pause လုပ်ပြီး
      စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] အဖြေကတော့ model ကို ဘယ်မှာ run မလဲ၊ model ကို ဘယ်လောက်
      ထိန်းချုပ်မလဲ ဆိုတာပါ။ ဘာကြောင့်လဲဆိုတော့ ဒီ နှစ်ခုက platform လေးမျိုးကို ခွဲပေးပြီး၊ latency၊
      privacy၊ ကုန်ကျစရိတ် လို တခြား အချက်တွေက ဒီ ရွေးချယ်မှု နှစ်ခုကနေ ထွက်လာလို့ပါ။ ကုန်ကျစရိတ်က
      အရေးကြီးပေမယ့် အဲဒီ ရွေးချယ်မှုရဲ့ အကျိုးဆက်ပါ။
    sources:
      - {
          title: "web.dev Learn AI: Choose your platform (check your understanding)",
          url: "https://web.dev/learn/ai/platform",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          clear: true,
          upsertIds: [z-title, z-q1, z-q2],
          drawMs: 1500,
        }
      - {
          id: draw-quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [z-a1, z-a2, z-a-note],
          drawMs: 1800,
        }

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:close-quiz]] ဒါဆို ပြန်ချုပ်ရရင်၊ client side က data ကို device ထဲမှာ ထားနိုင်ပြီး မြန်ပေမယ့်
      model သေးပါတယ်။ [[mark:sel-server]] server side ကတော့ model ကြီးနဲ့ အစွမ်း ရှိပေမယ့် latency ရှိပြီး
      ငွေလည်း ကုန်ပါတယ်။ [[mark:sel-questions]] model ဘယ်မှာ run မလဲ၊ ဘယ်လောက် ထိန်းချုပ်မလဲ ဆိုတဲ့ မေးခွန်း
      နှစ်ခုက built in AI၊ custom model၊ managed service၊ self hosted model ဆိုတဲ့ platform လေးမျိုးကို
      ခွဲပေးပါတယ်။ [[mark:sel-tradeoff]] ဘယ် platform မှာမဆို အပေးအယူ ရှိလို့ ကိုယ့် feature အတွက် အရေးကြီးတဲ့
      criteria ကို ရွေးပြီး ဆုံးဖြတ်ပါ။ [[mark:sel-terms]] စကားလုံး အသစ်တွေကိုလည်း notes ဖိုင်မှာ စာရင်း
      လုပ်ထားပါတယ်။ နောက် lesson မှာတော့ ဆိုင်ရဲ့ customer assistant အတွက် platform တကယ် ရွေးပြီး၊ client
      side နဲ့ server side ကို တွဲသုံးတဲ့ hybrid AI ကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Choose your platform (your takeaways)",
          url: "https://web.dev/learn/ai/platform",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: close-quiz }, open: false }
      - {
          id: open-notes,
          type: workspace.openFile,
          at: { mark: close-quiz, offsetMs: 400 },
          path: notes.md,
        }
      - id: sel-client
        type: editor.select
        at: { afterAction: open-notes }
        target:
          {
            file: notes.md,
            text: "user ရဲ့ browser ထဲမှာ run · data device ထဲမှာပဲ · network မစောင့်ရ · model သေး",
            occurrence: 1,
          }
      - id: sel-server
        type: editor.select
        at: { mark: sel-server }
        target:
          {
            file: notes.md,
            text: "cloud ပေါ်က server မှာ run · model ကြီး · user များလည်း ရ · latency ရှိ · ငွေ ကုန်",
            occurrence: 1,
          }
      - id: sel-questions
        type: editor.select
        at: { mark: sel-questions }
        target:
          { file: notes.md, text: "model ဘယ်မှာ run မလဲ · model ကို ဘယ်လောက် ထိန်းချုပ်မလဲ", occurrence: 1 }
      - id: sel-tradeoff
        type: editor.select
        at: { mark: sel-tradeoff }
        target:
          {
            file: notes.md,
            text: "အမှတ် 5 ချည်း ရတဲ့ platform မရှိ · ကိုယ့် feature အတွက် အရေးကြီးတဲ့ criteria ကို ရွေး",
            occurrence: 1,
          }
      - id: sel-terms
        type: editor.select
        at: { mark: sel-terms }
        target: { file: notes.md, text: "ဒီ lesson ထဲက စကားလုံး အသစ်တွေ", occurrence: 1 }
checks:
  - { type: timing.p95Ms, max: 300 }
