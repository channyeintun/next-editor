      notes.md: |
        # Client side လား server side လား

        - client side — user ရဲ့ browser ထဲမှာ run · data device ထဲမှာပဲ · network မစောင့်ရ · model သေး
        - server side — cloud ပေါ်က server မှာ run · model ကြီး · user များလည်း ရ · latency ရှိ · ငွေ ကုန်
        - မေးခွန်း 2 ခု — model ဘယ်မှာ run မလဲ · model ကို ဘယ်လောက် ထိန်းချုပ်မလဲ
        - platform 4 မျိုး — built-in AI · custom model · managed service · self-hosted model
        - အမှတ် 5 ချည်း ရတဲ့ platform မရှိ · ကိုယ့် feature အတွက် အရေးကြီးတဲ့ criteria ကို ရွေး
        - မြန်မာစာ — Chrome ရဲ့ built-in AI မရသေး → custom model ဒါမှမဟုတ် server side

        ဒီ lesson ထဲက စကားလုံး အသစ်တွေ: client side AI · server side AI · built-in AI · custom model ·
        managed service · self-hosted model · open-weight model · customizability · compatibility

        နောက် lesson: Platform ရွေးခြင်းနဲ့ hybrid AI
      package.json: |
        {
          "name": "ai-course-tea-shop",
          "private": true,
          "version": "1.0.0",
          "type": "module",
          "scripts": {
            "dev": "vite --host 0.0.0.0 --port 5173 --strictPort"
          },
          "devDependencies": {
            "esbuild": "0.21.5",
            "vite": "5.4.21"
          }
        }
      src/main.js: |
        import { panel } from "ai-panel";
        import { OPTIONS, ESTIMATES } from "./platforms.js";

        // One static card: the four platform options against each criterion (no model runs here).
        panel.table("Platform estimates · 5 = best", ESTIMATES, {
          id: "estimates",
          columns: ["criterion", ...OPTIONS],
          badge: "ခန့်မှန်းချက်",
        });
      src/platforms.js: |
        // The four platform options, scored 1–5 for each criterion (5 = the best for you: a stronger
        // model, cheaper, faster, less work). These are estimates: the real picture depends on the
        // user's hardware, the model and how much the feature is used. Where the stars and the notes of
        // the source table disagree, the notes win (managed and self-hosted privacy, self-hosted cost per
        // request, server-side user convenience).
        export const OPTIONS = ["built-in", "custom", "managed", "self-host"];

        export const ESTIMATES = [
          { criterion: "model power", "built-in": 2, custom: 3, managed: 4, "self-host": 4 },
          { criterion: "accuracy", "built-in": 2, custom: 3, managed: 5, "self-host": 4 },
          { criterion: "customizability", "built-in": 1, custom: 5, managed: 1, "self-host": 5 },
          { criterion: "latency", "built-in": 5, custom: 5, managed: 2, "self-host": 2 },
          { criterion: "privacy", "built-in": 5, custom: 5, managed: 2, "self-host": 3 },
          { criterion: "fixed cost", "built-in": 5, custom: 5, managed: 5, "self-host": 2 },
          { criterion: "cost per request", "built-in": 5, custom: 5, managed: 2, "self-host": 3 },
          { criterion: "compatibility", "built-in": 2, custom: 1, managed: 5, "self-host": 5 },
          { criterion: "user convenience", "built-in": 3, custom: 2, managed: 4, "self-host": 4 },
          { criterion: "dev convenience", "built-in": 5, custom: 2, managed: 4, "self-host": 1 },
          { criterion: "maintenance", "built-in": 4, custom: 2, managed: 5, "self-host": 2 },
        ];
      vite.config.js: |
        import { defineConfig } from "vite";
        import courseRunner from "./course/runner.js";

        export default defineConfig({
          plugins: [courseRunner()],
        });
