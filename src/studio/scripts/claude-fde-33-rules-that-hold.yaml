build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 9333

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: need
    chapter: စာမျက်နှာ လေးမျက်နှာ
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ session ရှည် တစ်ခုကို plan mode နဲ့ စပြီး၊ rewind နဲ့ compaction နဲ့ ထိန်းကျောင်းတာ၊
      ပြီးဆုံးချက်ကို command တစ်ခုနဲ့ ရေးတာကို လေ့လာခဲ့ပါတယ်။
      [[mark:n-open]] trial အတွက် ပြင်ဆင်ရင်း Billing team lead မောင်မောင် က ပြဿနာ တစ်ခုကို ပြောလာပါတယ်။
      Billing ရဲ့ CLAUDE.md က စာမျက်နှာ လေးမျက်နှာ ရှည်လာပြီး၊ Claude က အဲဒီထဲက တစ်ဝက်လောက်ကိုပဲ လိုက်နာပုံ
      ရတယ် ဆိုတာပါ။ CLAUDE.md ဆိုတာ project အကြောင်း Claude Code အမြဲ သိထားရမယ့် အချက်တွေ ရေးထားတဲ့ file ပါ။
      [[mark:n-why]] ဒါက Claude ပေါ့ဆလို့ မဟုတ်ပါဘူး။ docs အရ CLAUDE.md file တစ်ခုကို စာကြောင်း ၂၀၀ အောက်မှာ
      ထားဖို့ ရည်ရွယ်ရပြီး၊ ပိုရှည်ရင် လိုက်နာမှု လျော့သွားတတ်ပါတယ်။ တခြား file တွေကို import လုပ်ပြီး ခွဲထားလည်း
      context ထဲ ဝင်တာ အတူတူပဲမို့ ကုန်ကျတာ မလျော့ပါဘူး။
      [[mark:n-kinds]] ပိုအရေးကြီးတာက ညွှန်ကြားချက် နှစ်မျိုး ရှိတာပါ။ prompt၊ CLAUDE.md၊ skill လိုမျိုး Claude
      ဖတ်ပြီး ဆုံးဖြတ်ရတဲ့ ညွှန်ကြားချက်က အမြဲ တစ်ပုံစံတည်း မဖြစ်ပါဘူး။ hook၊ deny rule၊ managed setting လိုမျိုး
      Claude Code ကိုယ်တိုင် စောင့်ကြပ်တဲ့ အရာတွေကတော့ အမြဲ တစ်ပုံစံတည်း အလုပ်လုပ်ပါတယ်။ managed setting ဆိုတာ
      ကုမ္ပဏီ admin က ချပေးပြီး ဘယ်သူမှ ကျော်လို့ မရတဲ့ setting ပါ။
      [[mark:n-plan]] ဒါကြောင့် Billing ရဲ့ စည်းကမ်း တစ်ခုစီကို တကယ် လိုက်နာမယ့် နေရာမှာ ထားပြီး၊ အလုပ်
      အမျိုးအစား တစ်ခုစီမှာ Claude ကို ဘယ်လောက် လွှတ်ပေးမလဲ ဆိုတာကိုလည်း ဆုံးဖြတ်ပါမယ်။
    sources:
      - {
          title: "Claude Code Docs: Manage Claude's memory",
          url: "https://code.claude.com/docs/en/memory",
        }
      - {
          title: "Claude Code Docs: Best practices",
          url: "https://code.claude.com/docs/en/best-practices",
        }
    actions:
      - {
          id: open-rules,
          type: workspace.openFile,
          at: { mark: n-open },
          path: notebook/33-rules.md,
        }
      - id: sel-title
        type: editor.select
        at: { mark: n-plan }
        target:
          file: notebook/33-rules.md
          text: "# Billing ရဲ့ စည်းကမ်း တစ်ခုစီ ဘယ်မှာ နေမလဲ"

  - id: shelves
    chapter: နေရာ သုံးခု
    narration: >
      [[mark:s-open]] စည်းကမ်း တစ်ခုကို နေရာ သုံးခုထဲက တစ်ခုမှာ ထားလို့ ရပါတယ်။
      [[mark:s-1]] ပထမ နေရာက CLAUDE.md ပါ။ ဒါက လမ်းညွှန်ချက်အတွက်ပါ။ test ဘယ်လို run ရမလဲ လိုမျိုး Claude
      ကိုယ်တိုင် ရှာလို့ မတွေ့နိုင်တာ၊ ခန့်မှန်းလို့ မရတာတွေကို ရေးပါတယ်။ Claude ကို နှစ်ခါ ပြင်ပြောခဲ့ရတဲ့ အချက်
      ဆိုရင်လည်း ဒီမှာ ထားသင့်ပါပြီ။
      [[mark:s-out]] architecture နဲ့ file တွေ ဘယ်မှာ ရှိလဲ ဆိုတာကိုတော့ မရေးပါနဲ့။ Claude က repo ကို ကိုယ်တိုင်
      ဖတ်လို့ပါ။ အဆင့်များတဲ့ လုပ်ထုံးလုပ်နည်းက skill ထဲမှာ၊ folder တစ်ခုအတွက်ပဲ ဆိုင်တဲ့ စည်းကမ်းက rules folder
      ထဲမှာ နေသင့်ပါတယ်။ မောင်မောင် ရဲ့ စာမျက်နှာ လေးမျက်နှာ တစ်ဝက်ကျော်က ဒီလို အရာတွေပါ။
      [[mark:s-2]] ဒုတိယ နေရာက permission rule ပါ။ ဒါက ကန့်သတ်ချက်အတွက်ပါ။ ဘာကို မမေးဘဲ လုပ်ခွင့်ရှိလဲ၊ ဘာကို
      မေးပြီးမှ လုပ်ရမလဲ၊ ဘာကို လုံးဝ မလုပ်ရဘူးလဲ ဆိုတာကို settings file ထဲမှာ ရေးပါတယ်။
      [[mark:s-3]] တတိယ နေရာက hook ပါ။ hook ဆိုတာ Claude Code ရဲ့ အဆင့် တစ်ခုခုမှာ အလိုအလျောက် run တဲ့ ကိုယ့်
      command ပါ။ ဒါက တစ်ခါမှ မလွတ်ရမယ့် အရာအတွက်ပါ။
      [[mark:s-ex]] Billing ရဲ့ စည်းကမ်းတွေကို ခွဲကြည့်ရင်၊ test command က CLAUDE.md မှာ၊ secret file တွေ မဖတ်ရဘူး
      ဆိုတာက deny rule မှာ၊ edit ပြီးတိုင်း format လုပ်တာက hook မှာ နေပါတယ်။
      [[mark:s-enforce]] ဒုတိယနဲ့ တတိယ နေရာက Claude ရဲ့ ဆုံးဖြတ်ချက်အပေါ် မမူတည်ပါဘူး။ Claude Code ကိုယ်တိုင်က
      စောင့်ကြပ်ပါတယ်။ ပြောင်းပြန်လည်း မှန်ပါတယ်။ စိတ်ကြိုက် သက်သက်ကို hook နဲ့ အတင်း လုပ်ခိုင်းထားရင် ဖယ်ပစ်ပါ။
    sources:
      - {
          title: "Claude Code Docs: Best practices",
          url: "https://code.claude.com/docs/en/best-practices",
        }
      - {
          title: "Claude Code Docs: Manage Claude's memory",
          url: "https://code.claude.com/docs/en/memory",
        }
    actions:
      - {
          id: draw-s-open,
          type: whiteboard.apply,
          at: { mark: s-open },
          open: true,
          clear: true,
          upsertIds: [s-title],
        }
      - {
          id: draw-s-1,
          type: whiteboard.apply,
          at: { mark: s-1 },
          upsertIds: [s-k1, s-b1, s-l1],
          drawMs: 1200,
        }
      - {
          id: draw-s-2,
          type: whiteboard.apply,
          at: { mark: s-2 },
          upsertIds: [s-k2, s-b2, s-l2],
          drawMs: 1200,
        }
      - {
          id: draw-s-3,
          type: whiteboard.apply,
          at: { mark: s-3 },
          upsertIds: [s-k3, s-b3, s-l3],
          drawMs: 1200,
        }
      - {
          id: draw-s-ex,
          type: whiteboard.apply,
          at: { mark: s-ex },
          upsertIds: [s-e1, s-e2, s-e3],
          drawMs: 1500,
        }
      - {
          id: draw-s-enf,
          type: whiteboard.apply,
          at: { mark: s-enforce },
          upsertIds: [s-enf],
          drawMs: 900,
        }

  - id: deny
    chapter: Deny rule နဲ့ hook
    narration: >
      [[mark:d-open]] permission rule တွေကို permissions command နဲ့ ဖွင့်ကြည့်ရင် ဒီလို မြင်ရပါတယ်။ ဒါက ဥပမာ
      project တစ်ခုရဲ့ deny tab ပါ။
      [[mark:d-means]] deny လုပ်ထားတဲ့ tool အသုံးပြုမှုကို Claude Code က အမြဲ ငြင်းမယ်လို့ ရေးထားပါတယ်။
      [[mark:d-push]] ဒီ ဥပမာမှာ git push ကို လုံးဝ ပိတ်ထားပါတယ်။ Billing မှာတော့ push ကို ask rule နဲ့ မေးခိုင်းထားပါတယ်။
      [[mark:d-env]] env file ကို ဖတ်တာကိုလည်း ပိတ်ထားပါတယ်။
      [[mark:d-every]] deny rule က auto mode နဲ့ bypass mode အပါအဝင် ဘယ်
      mode မှာမဆို ပိတ်ပါတယ်။ allow rule နဲ့ ထိပ်တိုက်တွေ့ရင်လည်း deny က နိုင်ပါတယ်။ ask rule ကိုလည်း ဘယ် mode
      ကမှ ကိုယ့်အစား ခွင့်မပြုပေးပါဘူး။
      [[mark:h-open]] hook က ပိတ်လိုက်ရင်တော့ ဒီလို မြင်ရပါတယ်။ ဒီ repo မှာ migration command ကို ပိတ်ထားတဲ့ hook
      ရှိပါတယ်။
      [[mark:h-call]] Claude က migration ကို run ဖို့ shell command တစ်ခု ခေါ်လိုက်ပါတယ်။
      [[mark:h-err]] command မ run ခင် PreToolUse hook က အရင် run ပြီး၊ exit code နှစ်နဲ့ ထွက်လိုက်တော့ အဲဒီ
      command ကို ပိတ်လိုက်ပါတယ်။
      [[mark:h-msg]] hook ရဲ့ error စာသားက Claude ဆီကို အကြောင်းပြချက် အဖြစ် ရောက်သွားပါတယ်။
      [[mark:h-reply]] ဒီ ဥပမာမှာ Claude ရဲ့ အဖြေကို ကြိုရေးထားပေမဲ့၊ hook ကတော့ တကယ် run ပြီး ပိတ်ခဲ့တာပါ။
      Claude က ဒီ စည်းကမ်းကို မှတ်မိနေစရာ မလိုပါဘူး။
      [[mark:h-hold]] hook က ပိတ်လိုက်ရင် bypass mode မှာတောင် ကျော်လို့ မရပါဘူး။
      [[mark:h-trust]] သတိထားရမှာ တစ်ခုက repo ရဲ့ settings file ထဲက hook တွေဟာ developer တစ်ယောက်ချင်းက
      workspace trust ကို လက်ခံပြီးမှ အလုပ်လုပ်တာပါ။ workspace trust ဆိုတာ ဒီ folder ကို ယုံကြည်တယ်လို့ လက်ခံတဲ့
      မေးခွန်းပါ။ ကုမ္ပဏီ တစ်ခုလုံးမှာ ဘယ်သူမှ ကျော်လို့ မရစေချင်ရင်တော့ managed setting ထဲမှာ ထားရပါတယ်။
    sources:
      - {
          title: "Claude Code Docs: Configure permissions",
          url: "https://code.claude.com/docs/en/permissions",
        }
      - {
          title: "Claude Code Docs: Hooks guide",
          url: "https://code.claude.com/docs/en/hooks-guide",
        }
    actions:
      - {
          id: close-shelves,
          type: whiteboard.apply,
          at: { mark: d-open, offsetMs: -1400 },
          open: false,
        }
      - {
