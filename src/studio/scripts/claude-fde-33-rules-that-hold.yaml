  - id: table
    chapter: Billing ရဲ့ စည်းကမ်း table
    narration: >
      အခု Billing ရဲ့ စည်းကမ်းတွေကို table နဲ့ ချရေးကြည့်ရအောင်။
      [[mark:type-r1]] ပထမ တစ်ကြောင်းက test နဲ့ lint command ပါ။ Claude ခန့်မှန်းလို့ မရတဲ့ အချက်ဖြစ်လို့
      CLAUDE.md ထဲမှာ ထားပါတယ်။ စည်းကမ်းကို စစ်လို့ရအောင် ရေးပါ။ ငွေကို သေချာ တွက်ပါ ဆိုတာထက်
      line item တစ်ခုစီရဲ့ အဆုံးမှာ တစ်ခါပဲ round လုပ်ပါ ဆိုတာက ပိုလိုက်နာလို့ ကောင်းပါတယ်။
      [[mark:type-r2]] ဒုတိယ တစ်ကြောင်းက env file နဲ့ secrets folder ကို မဖတ်ရဘူး ဆိုတာပါ။ ခြွင်းချက် မရှိတဲ့
      စည်းကမ်းမို့ deny rule ပါ။
      [[mark:type-r3]] တတိယ တစ်ကြောင်းက commit မလုပ်ခင် မေးခိုင်းတာပါ။ ask rule ဖြစ်လို့ auto mode မှာတောင်
      developer ကို မေးပါတယ်။
      [[mark:type-r4]] စတုတ္ထ တစ်ကြောင်းက edit ပြီးတိုင်း formatter run တာပါ။ CLAUDE.md မှာ ရေးထားတုန်းက ဆယ်ခါမှာ
      တစ်ခါလောက် လွတ်သွားခဲ့လို့ PostToolUse hook အဖြစ် ပြောင်းထားပါတယ်။
      [[mark:t-cut]] ဒီလို ခွဲလိုက်တော့ CLAUDE.md ထဲမှာ ကျန်တာက Claude ခန့်မှန်းလို့ မရတဲ့ အချက်တွေပဲ ဖြစ်လာပါတယ်။
      doctor command က ဖြတ်လို့ရတာတွေကို အကြံပြုပေးပြီး၊ context command ကို all နဲ့ run ရင် load ဖြစ်နေတဲ့
      CLAUDE.md တွေကို မြင်ရပါတယ်။ စည်းကမ်း နှစ်ခု ဆန့်ကျင်နေရင် Claude က တစ်ခုကို အလွတ်သဘော ရွေးသွားနိုင်လို့
      အဲဒါတွေကိုလည်း ရှင်းထားပါ။
    sources:
      - {
          title: "Claude Code Docs: Manage Claude's memory",
          url: "https://code.claude.com/docs/en/memory",
        }
      - {
          title: "Claude Code Docs: Best practices",
          url: "https://code.claude.com/docs/en/best-practices",
        }
    actions:
      - id: type-r1
        type: editor.type
        at: { mark: type-r1 }
        cadence: line-by-line
        target: { file: notebook/33-rules.md, after: "|---|---|---|\n" }
        text: "| test: npm test၊ lint: npm run lint | CLAUDE.md | Claude ခန့်မှန်းလို့ မရ |\n"
      - id: type-r2
        type: editor.type
        at: { mark: type-r2 }
        cadence: line-by-line
        target: { file: notebook/33-rules.md, after: "| Claude ခန့်မှန်းလို့ မရ |\n" }
        text: "| .env နဲ့ secrets/ ကို မဖတ် | deny rule | ခြွင်းချက် မရှိ၊ mode တိုင်းမှာ ပိတ် |\n"
      - id: type-r3
        type: editor.type
        at: { mark: type-r3 }
        cadence: line-by-line
        target: { file: notebook/33-rules.md, after: "mode တိုင်းမှာ ပိတ် |\n" }
        text: "| git commit မလုပ်ခင် မေး | ask rule | auto mode မှာလည်း မေး |\n"
      - id: type-r4
        type: editor.type
        at: { mark: type-r4 }
        cadence: line-by-line
        target: { file: notebook/33-rules.md, after: "auto mode မှာလည်း မေး |\n" }
        text: "| edit ပြီးတိုင်း prettier | PostToolUse hook | တစ်ခါမှ မလွတ်ရ |\n"
      - id: expect-r4
        type: expect.file
        at: { afterAction: type-r4 }
        path: notebook/33-rules.md
        contains: "| edit ပြီးတိုင်း prettier | PostToolUse hook | တစ်ခါမှ မလွတ်ရ |\n"
      - id: sel-r1
        type: editor.select
        at: { mark: t-cut }
        target:
          file: notebook/33-rules.md
          text: "| test: npm test၊ lint: npm run lint | CLAUDE.md | Claude ခန့်မှန်းလို့ မရ |"

  - id: modes
    chapter: Job အလိုက် mode
    narration: >
      နောက်တစ်ခုက permission mode ပါ။ permission mode ဆိုတာ ဘယ်အရာတွေကို မမေးဘဲ လုပ်ခွင့်ပေးမလဲ
      သတ်မှတ်တဲ့ mode ပါ။ ဒီ lesson ကို ရေးတဲ့ အချိန်မှာ terminal ထဲက session တွေက auto mode နဲ့ စပြီး၊ print
      mode နဲ့ run တဲ့ script တွေကတော့ manual mode နဲ့ စပါတယ်။
      [[mark:type-m1]] invoice code လို ထိလွယ်တဲ့ အလုပ်မှာ manual mode ကို သုံးပါမယ်။ ဖတ်တာကလွဲပြီး ကျန်တာ အားလုံးကို
      မေးပါတယ်။ project ရဲ့ settings file မှာ default mode ကို manual လို့ ထားလို့ ရပါတယ်။ auto ဒါမှမဟုတ် bypass
      ကို project settings မှာ default ထားရင်တော့ ဘာမှ မပြောဘဲ လျစ်လျူရှုသွားပါတယ်။
      [[mark:type-m2]] report job trial မှာတော့ ပြီးခဲ့တဲ့ lesson က ဆုံးဖြတ်ထားသလို plan mode ပြီးမှ edit
      တစ်ခုချင်းကို approve လုပ်ပါတယ်။
      [[mark:type-m3]] နာရီရှည် လူမစောင့်တဲ့ အလုပ်ကျမှ auto mode ပါ။ classifier က အပြင်က script ကို download လုပ်ပြီး
      run တာ၊ production ကို deploy လုပ်တာ၊ data ကို အပြင် ပို့တာ စတာတွေကို ပိတ်ပေးပါတယ်။ ဆက်တိုက် သုံးခါ ဒါမှမဟုတ်
      စုစုပေါင်း နှစ်ဆယ်ခါ ပိတ်ရရင် ရပ်ပြီး လူကို မေးပါတယ်။ ဒါပေမဲ့ docs ကိုယ်တိုင်က auto mode က ဘေးကင်းမှုကို
      အာမမခံဘူးလို့ သတိပေးထားပါတယ်။
      [[mark:type-m4]] CI ထဲက script အတွက်တော့ don't ask mode ပါ။ ကြိုခွင့်ပြုထားတဲ့ tool တွေကလွဲပြီး ကျန်တာ
      အားလုံးကို ငြင်းပါတယ်။ bypass permissions ကတော့ အကုန် ခွင့်ပြုပြီး prompt injection ကိုလည်း မကာကွယ်ပေးလို့၊
      သီးခြား container ဒါမှမဟုတ် VM ထဲမှာပဲ သုံးပါမယ်။ prompt injection ဆိုတာ Claude ဖတ်လိုက်တဲ့ စာထဲက
      ညွှန်ကြားချက်နဲ့ လှည့်စားခံရတာပါ။
    sources:
      - {
          title: "Claude Code Docs: Permission modes",
          url: "https://code.claude.com/docs/en/permission-modes",
        }
    actions:
      - id: type-m1
        type: editor.type
        at: { mark: type-m1 }
        cadence: line-by-line
        target: { file: notebook/33-rules.md, after: "## Job အလိုက် permission mode\n" }
        text: "- invoice code ပြင်: manual (default)၊ edit တိုင်း ကြည့်\n"
      - id: type-m2
        type: editor.type
        at: { mark: type-m2 }
        cadence: line-by-line
        target: { file: notebook/33-rules.md, after: "edit တိုင်း ကြည့်\n" }
        text: "- report job trial: plan mode ပြီးမှ edit တိုင်း approve\n"
      - id: type-m3
        type: editor.type
        at: { mark: type-m3 }
        cadence: line-by-line
        target: { file: notebook/33-rules.md, after: "edit တိုင်း approve\n" }
        text: "- လူမစောင့်တဲ့ အလုပ်ရှည်: auto (trial ရလဒ် ကြည့်ပြီးမှ)\n"
      - id: type-m4
        type: editor.type
        at: { mark: type-m4 }
        cadence: line-by-line
        target: { file: notebook/33-rules.md, after: "trial ရလဒ် ကြည့်ပြီးမှ)\n" }
        text: "- CI script: dontAsk + --allowedTools\n- bypassPermissions: container / VM ထဲမှာပဲ\n"

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ Billing repo မှာ customer export folder ရှိပြီး၊ team ရဲ့ settings file
      က အဲဒီ folder ကို Read tool နဲ့ မဖတ်ရအောင် deny rule နဲ့ ပိတ်ထားပါတယ်။ ဆိုပါစို့၊ တစ်နေ့မှာ Claude က
      အဲဒီ folder ထဲက file ကို ဖတ်ယူတဲ့ script တစ်ခု ရေးပြီး run ဖို့ ကြိုးစားတယ်။ deny rule က ဒါကိုပါ ပိတ်ပေးမလား။
      [[mark:q-a]] ပထမ အဖြေက ပိတ်တယ် ဆိုတာပါ။ deny rule က ဘယ် mode မှာမဆို ပိတ်လို့ပါ။
      [[mark:q-b]] ဒုတိယ အဖြေက မပိတ်ဘူး ဆိုတာပါ။ script က file ကို ကိုယ်တိုင် ဖတ်လို့ပါ။ lesson ကို pause လုပ်ပြီး
      စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ တစ်ခုပါ။ ဘာကြောင့်လဲဆိုတော့ Read ကို deny လုပ်ထားရင် Claude ရဲ့ Read
      tool နဲ့ အဲဒီ file ကို cat နဲ့ ဖတ်တာကိုတော့ ပိတ်ပါတယ်။ ဒါပေမဲ့ program တစ်ခုက file ကို ကိုယ်တိုင် ဖတ်တာကို
      မမြင်ပါဘူး။ အဲဒီ script ကို run ခွင့် ရသွားရင် file ကို ဖတ်နိုင်ပါတယ်။ deny rule က ဘယ် mode မှာမဆို ပိတ်တယ်
      ဆိုတာ မှန်ပေမဲ့၊ ပိတ်တာက Claude ရဲ့ tool ခေါ်မှုပါ။
      [[mark:q-rule]] ဒါကြောင့် operating system အဆင့်မှာ ကန့်သတ်ချင်ရင် sandbox ကို သုံးပါ။ ဒီ lesson ကို ရေးတဲ့
      အချိန်မှာ macOS နဲ့ Linux မှာ ရပြီး၊ Windows မှာတော့ WSL ထဲမှာ ရပါတယ်။ အကောင်းဆုံးကတော့ customer data ကို repo ထဲ မထားတာပါ။
    sources:
      - {
          title: "Claude Code Docs: Best practices",
          url: "https://code.claude.com/docs/en/best-practices",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: q-rule },
          upsertIds: [q-t1, q-t2],
          drawMs: 1600,
        }

  - id: your-turn
    chapter: ကိုယ့် team ရဲ့ စည်းကမ်း
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ကိုယ့် team ရဲ့ စည်းကမ်း ငါးခုကို ဒီ table ထဲ
      ထည့်ရေးကြည့်ပါ။ တစ်ခုချင်းအတွက် CLAUDE.md၊ permission rule၊ hook ထဲက ဘယ်မှာ ထားမလဲ၊ ဘာကြောင့်လဲ ရေးပါ။
      [[mark:turn-2]] ဆုံးဖြတ်ရ ခက်ရင် မေးခွန်း နှစ်ခု မေးကြည့်ပါ။ ခြွင်းချက် ရှိသလား၊ တစ်ခါ လွတ်သွားရင် ဘာ
      ဖြစ်မလဲ ဆိုတာပါ။ ခြွင်းချက် ရှိရင် CLAUDE.md၊ ခြွင်းချက် မရှိတဲ့ ကန့်သတ်ချက်ဆိုရင် permission rule၊ လွတ်လို့
      မရတဲ့ လုပ်ဆောင်ချက်ဆိုရင် hook ပါ။
    sources:
      - {
          title: "Claude Code Docs: Best practices",
          url: "https://code.claude.com/docs/en/best-practices",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: turn }, open: false }
      - id: sel-table
        type: editor.select
        at: { mark: turn, offsetMs: 2200 }
        target:
          file: notebook/33-rules.md
          text: "| စည်းကမ်း | ဘယ်မှာ | ဘာကြောင့် |"

  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ CLAUDE.md ကို တိုတိုနဲ့ Claude ခန့်မှန်းလို့ မရတာတွေပဲ ထားမှ လိုက်နာမှု ကောင်းပါတယ်။
      လမ်းညွှန်ချက်က CLAUDE.md မှာ၊ ကန့်သတ်ချက်က permission rule မှာ၊ အမြဲ ဖြစ်ရမယ့် အရာက hook မှာ နေပါတယ်။
      [[mark:recap-2]] permission mode ကိုလည်း အလုပ် အမျိုးအစားအလိုက် ရွေးပြီး၊ မေးတာ အနည်းဆုံး mode တွေကိုတော့
      docs ရဲ့ သတိပေးချက်တွေကို သိပြီးမှ သုံးပါတယ်။
      [[mark:next]] နောက် lesson မှာတော့ ညတိုင်း run တဲ့ report job တွေရဲ့ စုစုပေါင်း ဂဏန်းကို မနက်တိုင်း စစ်ရတဲ့
      အလုပ်ကနေ စပြီး၊ keyboard ရှေ့မှာ ဘယ်သူမှ မရှိဘဲ prompt ကို run တဲ့ scheduled task နဲ့ headless mode ကို
      လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "Claude Code Docs: Permission modes",
          url: "https://code.claude.com/docs/en/permission-modes",
        }
    actions:
      - id: sel-modes
        type: editor.select
        at: { mark: recap-2 }
        target:
          file: notebook/33-rules.md
          text: "## Job အလိုက် permission mode"

