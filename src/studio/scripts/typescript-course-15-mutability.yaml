        retry: { maxAttempts: 3, delayMs: 300 }

  - id: let-const
    chapter: "let နဲ့ const"
    narration: >
      [[mark:type-query-default]] ပုံမှန် size ရဲ့ အောက်မှာ query comment ထည့်ကြည့်ရအောင်။
      [[mark:read-query-default]] Types မှာ small ဆိုတဲ့ literal type ပေါ်လာပါပြီ။ const နဲ့ ကြေညာထားလို့
      တန်ဖိုး အသစ် ပြန်ထည့်လို့ မရတဲ့အတွက်၊ TypeScript က တန်ဖိုး အတိအကျကို type အဖြစ် ယူထားတာပါ။
      [[mark:type-query-chosen]] customer ရွေးတဲ့ size ကိုလည်း မေးကြည့်ရအောင်။ [[mark:read-query-chosen]]
      ဒီတစ်ခါတော့ string ဖြစ်နေပါတယ်။ let နဲ့ ကြေညာထားတဲ့ variable က နောက်မှ ပြောင်းလို့ ရတဲ့အတွက်၊ TypeScript
      က ကျယ်တဲ့ string ကို ယူထားတာပါ။ ဒါကြောင့် small နဲ့ large ပဲ လက်ခံတဲ့ function ထဲ ပို့တော့ error
      ပြနေတာပါ။ [[mark:type-annotation]] ဒီ variable ရဲ့ နာမည်နောက်မှာ CupSize ဆိုတဲ့ type annotation
      ထည့်ပေးပါမယ်။ [[mark:read-annotation]] ပထမ error ပျောက်ပြီး၊ Types မှာလည်း CupSize ဖြစ်သွားပါပြီ။
      variable ကို ပြောင်းလို့ ရနေတုန်းပဲ ဖြစ်ပေမယ့်၊ small နဲ့ large ကြားမှာပဲ ပြောင်းခွင့် ရှိတော့တာပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 7: Mutability (how TypeScript infers let and const)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/mutability",
        }
      - {
          title: "TypeScript Handbook: Everyday Types (literal types)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#literal-types",
        }
