  - id: readonly-helper
    narration: >
      [[mark:open-order-3]] property တိုင်းကို read only ဖြစ်စေချင်ရင်တော့ တစ်ခုချင်း လိုက်ရေးစရာ မလိုပါဘူး။
      [[mark:type-paid-receipt]] Readonly ဆိုတဲ့ utility type ထဲကို Receipt ကို ထည့်ပြီး၊ ငွေရှင်းပြီးသား
      ဘောင်ချာအတွက် type အသစ် တစ်ခု ရေးပါမယ်။ အောက်မှာ query comment ပါ ထည့်ထားပါတယ်။
      [[mark:read-paid-receipt]] Types ရဲ့ အပေါ်ဆုံးမှာ နံပါတ်၊ ငွေနဲ့ customer သုံးခုလုံး read only
      ဖြစ်သွားပါပြီ။ [[mark:read-nested]] ဒါပေမဲ့ customer ရဲ့ အထဲက နာမည်နဲ့ စားပွဲ နံပါတ်မှာတော့ read only
      မပါပါဘူး။ Readonly က အပြင်ဆုံး အဆင့် တစ်ဆင့်ကိုပဲ ပြောင်းပေးလို့ပါ။ တန်ဖိုး တစ်ခုကို အထဲအထိ read only
      ဖြစ်အောင် လုပ်နည်းကိုတော့ နောက် lesson မှာ ကြည့်ပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 7: Mutability (the Readonly type helper)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/mutability",
        }
      - {
          title: "TypeScript Handbook: Utility Types (Readonly<Type>)",
          url: "https://www.typescriptlang.org/docs/handbook/utility-types.html#readonlytype",
        }
    actions:
      - id: open-order-3
        type: workspace.openFile
        at: { mark: open-order-3 }
        path: src/order.ts
      - id: type-paid-receipt
        type: editor.type
        at: { mark: type-paid-receipt }
        target:
          {
            file: src/order.ts,
            after: "  customer: { name: string; table: number };\n};\n",
            occurrence: 1,
          }
        text: "\nexport type PaidReceipt = Readonly<Receipt>;\n//          ^?\n"
        cadence: line-by-line
      - id: expect-four-queries
        type: expect.preview
        at: { afterAction: type-paid-receipt }
        timeoutMs: 8000
        target: { by: testId, value: ts-types }
        attribute: { name: data-count, value: "4" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-paid-receipt
        type: expect.preview
        at: { afterAction: expect-four-queries }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-1 }
        attribute:
          {
            name: data-type,
            value: "type PaidReceipt = {\n    readonly id: number;\n    readonly total: number;\n    readonly customer: {\n        name: string;\n        table: number;\n    };\n}",
          }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: readonly-array
    chapter: "readonly array"
    narration: >
      [[mark:open-main-3]] array တွေကိုလည်း read only လုပ်လို့ ရပါတယ်။ [[mark:select-push]] ဒီနေ့ အထူး
      စာရင်းကို မနက်ကတည်းက ဆိုင်ရှေ့က ဘုတ်ပေါ်မှာ ရေးထားပြီးသား ဆိုပါစို့။ ဒါဆို ပလာတာ ထပ်ထည့်တဲ့ ဒီ line
      မျိုးကို တားချင်ပါတယ်။ [[mark:type-readonly-array]] စာရင်းရဲ့ နာမည်နောက်မှာ string တွေ သိမ်းတဲ့
      ReadonlyArray ဆိုတဲ့ type annotation ထည့်ပါမယ်။ [[mark:read-push-error]] error နှစ်ခု ပေါ်လာပါပြီ။ ပထမ တစ်ခုက
      read only string array မှာ push method မရှိဘူးလို့ ပြောနေပါတယ်။ ကိုယ်က ReadonlyArray လို့ ရေးခဲ့ပေမယ့်၊
      TypeScript က array ရဲ့ ရှေ့မှာ read only ထည့်တဲ့ ပုံစံနဲ့ ပြနေတာ သတိထား ကြည့်ပါ။ ဒီ ရေးပုံ နှစ်မျိုးက
      အဓိပ္ပာယ် အတူတူပါပဲ။ [[mark:read-other-methods]] push လို စာရင်းကို ပြောင်းတဲ့ method တွေ
      မရှိတော့ပေမယ့်၊ join နဲ့ map လို စာရင်းကို မပြောင်းဘဲ ဖတ်ရုံပဲ ဖတ်တဲ့ method တွေကတော့ သုံးလို့
      ရပါတယ်။
      [[mark:type-comment-push]] ပလာတာ ထည့်တဲ့ line ကို comment လုပ်လိုက်ပါမယ်။ [[mark:read-push-gone]] Output
      မှာ ဒီနေ့ အထူး စာရင်းက မုန့်ဟင်းခါး တစ်မျိုးတည်း ဖြစ်သွားပါပြီ။ ဒါပေမဲ့ Errors မှာ error တစ်ခု
      ကျန်နေပါသေးတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 7: Mutability (readonly arrays)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/mutability",
        }
      - {
          title: "TypeScript Handbook: Object Types (the ReadonlyArray type)",
          url: "https://www.typescriptlang.org/docs/handbook/2/objects.html#the-readonlyarray-type",
        }
    actions:
      - id: open-main-3
        type: workspace.openFile
        at: { mark: open-main-3 }
        path: src/main.ts
      - id: select-push
        type: editor.select
        at: { mark: select-push }
        target: { file: src/main.ts, text: 'specials.push("ပလာတာ");', occurrence: 1 }
      - id: type-readonly-array
        type: editor.type
        at: { mark: type-readonly-array }
        target: { file: src/main.ts, after: "const specials", occurrence: 1 }
        text: ": ReadonlyArray<string>"
      - id: expect-two-array-errors
        type: expect.preview
        at: { afterAction: type-readonly-array }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-push-error
        type: expect.preview
        at: { afterAction: expect-two-array-errors }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Property 'push' does not exist on type 'readonly string[]'."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-mutable-error
        type: expect.preview
        at: { afterAction: expect-push-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-2 }
        textContains: "The type 'readonly string[]' is 'readonly' and cannot be assigned to the mutable type 'string[]'."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-comment-push
        type: editor.type
        at: { mark: type-comment-push }
        target: { file: src/main.ts, after: "[\"မုန့်ဟင်းခါး\"];\n", occurrence: 1 }
        text: "// "
      - id: expect-push-gone
        type: expect.preview
        at: { afterAction: type-comment-push }
        timeoutMs: 8000
        target: { by: testId, value: ts-out-6 }
        textContains: "ဒီနေ့ အထူး 1 မျိုး · မုန့်ဟင်းခါး"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-one-array-error
        type: expect.preview
        at: { afterAction: expect-push-gone }
        timeoutMs: 5000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: array-direction
    chapter: "ဘယ် array ကို ဘယ်မှာ ထည့်လို့ ရလဲ"
    narration: >
      [[mark:select-call]] ကျန်တဲ့ error က ဒီနေ့ အထူး စာရင်းကို function ထဲ ပို့တဲ့ ဒီ နေရာမှာပါ။ read only
      array ကို ပြောင်းလို့ ရတဲ့ array နေရာမှာ ထည့်လို့ မရဘူးလို့ ပြောနေပါတယ်။ [[mark:board-arrays]]
      ဘာကြောင့်လဲ ဆိုတာ ပုံနဲ့ ကြည့်ရအောင်။ [[mark:draw-readonly-to-mutable]] parameter က ပြောင်းလို့ ရတဲ့
      array ဆိုရင်၊ function က အထဲမှာ push လုပ်လို့ ရပါတယ်။ အဲဒီ ထဲကို read only array ပို့ခွင့် ပေးရင်၊
      ပြောင်းလို့ မရသင့်တဲ့ စာရင်းကို function က ပြောင်းသွားနိုင်လို့ TypeScript က တားတာပါ။
      [[mark:draw-mutable-to-readonly]] parameter က read only ဆိုရင်တော့ function က စာရင်းကို ဖတ်ရုံပဲ ဖတ်မှာ
      ဖြစ်လို့၊ ဘယ် array ပို့ပို့ ပြဿနာ မရှိပါဘူး။ [[mark:open-order-4]] ဒါကြောင့် စာရင်းကို ဖတ်ရုံပဲ ဖတ်တဲ့
      function ရဲ့ parameter ကို read only လုပ်ပေးတာ ကောင်းတဲ့ အလေ့အကျင့်ပါ။ [[mark:type-readonly-param]]
      စာရင်းကို လက်ခံတဲ့ parameter မှာ read only ထည့်ပါမယ်။ [[mark:read-all-clean]] Errors ရှင်းသွားပြီး၊
      ပြောင်းလို့ ရတဲ့ သောက်စရာ စာရင်းရော၊ read only ဖြစ်တဲ့ ဒီနေ့ အထူး စာရင်းရော၊ နှစ်ခုလုံးကို function က
      လက်ခံပြီး ထုတ်ပြနေပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 7: Mutability (how read-only and mutable arrays work together)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/mutability",
        }
      - {
          title: "TypeScript Handbook: Object Types (ReadonlyArray assignability)",
          url: "https://www.typescriptlang.org/docs/handbook/2/objects.html#the-readonlyarray-type",
        }
    actions:
      - id: select-call
        type: editor.select
        at: { mark: select-call }
        target: { file: src/main.ts, text: 'printList("ဒီနေ့ အထူး", specials);', occurrence: 1 }
      - id: board-arrays
        type: whiteboard.apply
        at: { mark: board-arrays }
        open: true
        clear: true
        upsertIds: [b-title, b-head-array, b-head-param]
      - id: draw-readonly-to-mutable
        type: whiteboard.apply
        at: { mark: draw-readonly-to-mutable }
        upsertIds: [b-r1-left, b-r1-left-text, b-r1-arrow, b-r1-right, b-r1-right-text, b-r1-note]
        drawMs: 3200
      - id: draw-mutable-to-readonly
        type: whiteboard.apply
        at: { mark: draw-mutable-to-readonly }
        upsertIds: [b-r2-left, b-r2-left-text, b-r2-arrow, b-r2-right, b-r2-right-text, b-r2-note]
        drawMs: 3200
      - id: close-board-b
        type: whiteboard.apply
        at: { mark: open-order-4 }
        open: false
      - id: open-order-4
        type: workspace.openFile
        at: { mark: open-order-4, offsetMs: 700 }
        path: src/order.ts
      - id: type-readonly-param
        type: editor.type
        at: { mark: type-readonly-param }
        target: { file: src/order.ts, after: "items: ", occurrence: 1 }
        text: "readonly "
      - id: expect-all-clean
        type: expect.preview
        at: { afterAction: type-readonly-param }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-drinks-list
        type: expect.preview
        at: { afterAction: expect-all-clean }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-5 }
        textContains: "သောက်စရာ 2 မျိုး · လက်ဖက်ရည်၊ ကော်ဖီ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-specials-list
        type: expect.preview
        at: { afterAction: expect-drinks-list }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-6 }
        textContains: "ဒီနေ့ အထူး 1 မျိုး · မုန့်ဟင်းခါး"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: recap
    narration: >
      [[mark:recap-inference]] ဒါဆို ပြန်ချုပ်ရရင်၊ const variable က literal type ကို ယူပြီး၊ let variable နဲ့
      object ရဲ့ property တွေကတော့ နောက်မှ ပြောင်းလို့ ရတဲ့အတွက် ကျယ်တဲ့ type ကို ယူပါတယ်။ အဲဒါကို type
      annotation ထည့်တာ၊ ဒါမှမဟုတ် object ကို function ခေါ်တဲ့ နေရာမှာ တိုက်ရိုက် ရေးတာနဲ့ ပြင်လို့ ရပါတယ်။ [[mark:recap-readonly]] read only property
      နဲ့ Readonly utility type က ပြောင်းတာကို တားပေးပေမယ့်၊ Readonly က အပြင်ဆုံး အဆင့်ကိုပဲ ကာကွယ်ပါတယ်။
      [[mark:recap-array]] read only array မှာ push မရှိပါဘူး။ ပြောင်းလို့ ရတဲ့ array ကို read only parameter
      ထဲ ပို့လို့ ရပေမယ့်၊ ပြောင်းပြန်ကတော့ မရပါဘူး။ ဒါတွေ အားလုံးက type စစ်တဲ့ အချိန်မှာပဲ အလုပ်လုပ်ပြီး၊ run
      တဲ့ အချိန်မှာ မရှိတော့ပါဘူး။ နောက် lesson မှာတော့ တန်ဖိုး တစ်ခုလုံးကို အထဲအထိ read only လုပ်ပြီး literal
      type တွေကိုပါ ထိန်းထားပေးတဲ့ as const ကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 7: Mutability",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/mutability",
        }
      - {
          title: "TypeScript Handbook: Object Types (readonly properties)",
          url: "https://www.typescriptlang.org/docs/handbook/2/objects.html#readonly-properties",
        }
    actions:
      - id: open-main-4
        type: workspace.openFile
        at: { mark: recap-inference }
        path: src/main.ts
      - id: select-recap-annotation
        type: editor.select
        at: { afterAction: open-main-4 }
        target: { file: src/main.ts, text: "let chosenSize: CupSize", occurrence: 1 }
      - id: open-order-5
        type: workspace.openFile
        at: { mark: recap-readonly }
        path: src/order.ts
      - id: select-recap-readonly
        type: editor.select
        at: { afterAction: open-order-5 }
        target:
          {
            file: src/order.ts,
            text: "export type PaidReceipt = Readonly<Receipt>;",
            occurrence: 1,
          }
      - id: select-recap-array
        type: editor.select
        at: { mark: recap-array }
        target: { file: src/order.ts, text: "items: readonly string[]", occurrence: 1 }
      - id: expect-file-order
        type: expect.file
        at: { afterAction: select-recap-array }
        path: src/order.ts
        contains: "  readonly total: number;\n  customer: { name: string; table: number };\n};\n\nexport type PaidReceipt = Readonly<Receipt>;\n//          ^?\n"
      - id: expect-file-order-param
        type: expect.file
        at: { afterAction: expect-file-order }
        path: src/order.ts
        contains: "export function printList(title: string, items: readonly string[]) {"
      - id: expect-file-main-sizes
        type: expect.file
        at: { afterAction: expect-file-order-param }
        path: src/main.ts
        contains: "let chosenSize: CupSize = \"small\";\n//  ^?\n"
      - id: expect-file-main-order
        type: expect.file
        at: { afterAction: expect-file-main-sizes }
        path: src/main.ts
        contains: 'const teaOrder: Drink = { item: "လက်ဖက်ရည်", size: "large" };'
      - id: expect-file-main-lists
        type: expect.file
        at: { afterAction: expect-file-main-order }
        path: src/main.ts
        contains: "// receipt.total = 0;"
      - id: expect-file-main-push
        type: expect.file
        at: { afterAction: expect-file-main-lists }
        path: src/main.ts
        contains: "const specials: ReadonlyArray<string> = [\"မုန့်ဟင်းခါး\"];\n// specials.push(\"ပလာတာ\");"
checks:
  - { type: timing.p95Ms, max: 300 }
