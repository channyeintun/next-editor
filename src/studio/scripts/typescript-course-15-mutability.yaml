build:
  # Studio replaces this built-in profile at render time with the Burmese provider chosen in the
  # render console (AthanLab with the user's own key, or VoxCPM2 when that feature is enabled).
  voiceProfile: pocket-alba-v1
  seed: 3115
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "ပြောင်းလဲနိုင်မှုနဲ့ type"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ utility type တွေနဲ့ type တစ်ခုကနေ နောက် type တစ်ခုကို
      ထုတ်ယူခဲ့ပါတယ်။ ဒီ lesson မှာတော့ တန်ဖိုး တစ်ခုကို နောက်မှ ပြောင်းလို့ ရမရ ဆိုတဲ့ mutability က
      TypeScript ရဲ့ inference အပေါ် ဘယ်လို သက်ရောက်လဲ၊ ပြီးတော့ မပြောင်းစေချင်တဲ့ တန်ဖိုးတွေကို read only နဲ့
      ဘယ်လို ကာကွယ်မလဲ ဆိုတာ ကြည့်သွားပါမယ်။ [[mark:draw-sets]] type တွေကို အစုလိုက် ပုံဆွဲကြည့်ရင်၊ string ထဲမှာ
      စာသား အားလုံး ပါပြီး၊ ဆိုင်ရဲ့ ခွက် size ဖြစ်တဲ့ CupSize ထဲမှာတော့ small နဲ့ large နှစ်ခုပဲ ပါပါတယ်။
      ဒါဆို variable တစ်ခုထဲကို large ထည့်လိုက်ရင်၊ TypeScript က ဘယ် အစုကို သူ့ type အဖြစ် ရွေးမလဲ။
      [[mark:draw-const]] const နဲ့ ကြေညာထားလို့ နောက် ဘယ်တော့မှ ပြောင်းလို့ မရတဲ့ variable ဆိုရင်၊ တန်ဖိုးက large တစ်ခုတည်းပဲ
      ဖြစ်နိုင်လို့ large ဆိုတဲ့ literal type ကို ယူပါတယ်။ [[mark:draw-let]] let နဲ့ ကြေညာထားလို့ ပြောင်းလို့ ရတဲ့
      variable ဆိုရင်တော့ နောက်မှ ဘာ စာသား ဝင်လာမလဲ မသိနိုင်လို့ string တစ်ခုလုံးကို ယူပါတယ်။ [[mark:draw-annotation]]
      ကိုယ် တကယ် လိုချင်တဲ့ အလယ်က CupSize ကိုတော့ TypeScript က ခန့်မှန်းလို့ မရလို့၊ type annotation နဲ့
      ကိုယ်တိုင် ပြောပြရပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 7: Mutability (mutability and inference)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/mutability",
        }
      - {
          title: "TypeScript Handbook: Everyday Types (literal inference)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#literal-inference",
        }
      - {
          title: "TypeScript Handbook: Type Inference (best common type, widening)",
          url: "https://www.typescriptlang.org/docs/handbook/type-inference.html",
        }
    actions:
      - id: open-board-a
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-sets
        type: whiteboard.apply
        at: { mark: draw-sets }
        upsertIds: [a-string-set, a-string-label, a-cup-set, a-cup-label, a-small, a-large]
        drawMs: 3600
      - id: draw-const
        type: whiteboard.apply
        at: { mark: draw-const }
        upsertIds: [a-large-circle, a-const]
        drawMs: 1800
      - id: draw-let
        type: whiteboard.apply
        at: { mark: draw-let }
        upsertIds: [a-let]
        drawMs: 1000
      - id: draw-annotation
        type: whiteboard.apply
        at: { mark: draw-annotation }
        upsertIds: [a-annotation]
        drawMs: 1300

  - id: starter
    narration: >
      [[mark:close-board]] ဒီနေ့ code ကို ကြည့်ရအောင်။ [[mark:open-order]] order ဖိုင်မှာ ဆိုင်ရဲ့ type တွေနဲ့
      function တွေ ရှိပါတယ်။ [[mark:select-cup-size]] CupSize type က small နဲ့ large နှစ်ခုပဲ လက်ခံပြီး၊ ဈေး
      တွက်တဲ့ function နှစ်ခုလုံးက CupSize ကို သုံးပါတယ်။ [[mark:select-receipt-type]] Receipt type ကတော့
      ဘောင်ချာ တစ်စောင်ကို ဖော်ပြပြီး၊ နံပါတ်၊ စုစုပေါင်း ငွေနဲ့ customer ပါပါတယ်။ [[mark:select-print-list]]
      အောက်ဆုံးက function ကတော့ စာရင်း တစ်ခုကို ခေါင်းစဉ်နဲ့ အရေအတွက်ပါ တွဲပြီး ထုတ်ပြပေးပါတယ်။
      [[mark:open-main]] main
      ဖိုင်မှာတော့ ဒီ type တွေကို သုံးတဲ့ အပိုင်း လေးပိုင်း ရှိပါတယ်။ [[mark:select-sizes]] ပထမ အပိုင်းမှာ
      ဆိုင်ရဲ့ ပုံမှန် size နဲ့ customer ရွေးတဲ့ size ရှိပြီး၊ ရွေးတဲ့ size ကိုတော့ နောက်မှ large လို့
      ပြောင်းထားပါတယ်။ [[mark:select-tea-order]] ဒုတိယက လက်ဖက်ရည် ခွက်ကြီး အော်ဒါ object ပါ။
      [[mark:select-receipt-lines]] တတိယက မြမြရဲ့ ဘောင်ချာ ဖြစ်ပြီး၊ စားပွဲ ပြောင်းတဲ့ line နဲ့ စုစုပေါင်း
      ငွေကို သုည ပြောင်းတဲ့ line ပါပါတယ်။ [[mark:select-lists]] နောက်ဆုံး အပိုင်းမှာတော့ စာရင်း နှစ်ခု
      ရှိပြီး၊ ဒီနေ့ အထူး စာရင်းထဲကို ပလာတာ ထပ်ထည့်ထားပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 7: Mutability",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/mutability",
        }
      - {
          title: "TypeScript Handbook: Object Types",
          url: "https://www.typescriptlang.org/docs/handbook/2/objects.html",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
