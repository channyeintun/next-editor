  - id: panel
    narration: >
      [[mark:panel-ready]] ညာဘက် panel ကို ကြည့်ရအောင်။ ဒီတစ်ခါ Errors ရဲ့ အောက်မှာ Output ရှိပြီး၊ Types
      ကတော့ အောက်ဆုံးမှာ ရှိပါတယ်။ [[mark:read-start-output]] Output မှာ မြမြရဲ့ ဘောင်ချာက သုည ကျပ် ဖြစ်နေပြီး၊
      ဒီနေ့ အထူး စာရင်းက နှစ်မျိုး ဖြစ်နေပါတယ်။ ပြောင်းလို့ မရသင့်တဲ့ တန်ဖိုးတွေကို code က ပြောင်းလိုက်လို့ပါ။
      ဒါကို lesson ရဲ့ နောက်ပိုင်းမှာ ကာကွယ်ပါမယ်။ [[mark:read-start-errors]] Errors မှာတော့ error နှစ်ခုလုံးက
      string ကို CupSize ရှိရမယ့် နေရာမှာ ထည့်လို့ မရဘူးလို့ ပြောနေပါတယ်။ code ထဲမှာ ရေးထားတဲ့ size တွေက small
      နဲ့ large ပဲ ဖြစ်ပေမယ့်၊ ဘာကြောင့် string လို့ ပြောနေတာလဲ။
    sources:
