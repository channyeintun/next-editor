  - id: object
    chapter: "Object ရဲ့ property တွေ"
    narration: >
      [[mark:type-query-order]] ကျန်တဲ့ error က လက်ဖက်ရည် အော်ဒါ object မှာပါ။ ဒီ object ကို const နဲ့
      ကြေညာထားပေမယ့် error ပြနေလို့ query comment နဲ့ ကြည့်ရအောင်။ [[mark:read-query-order]] size က large မဟုတ်ဘဲ string ဖြစ်နေပါတယ်။
      ဘာကြောင့်လဲဆိုတော့၊ const က variable ထဲကို object အသစ် ပြန်ထည့်တာကိုပဲ တားပြီး၊ object ထဲက property
      တွေကိုတော့ နောက်မှ ပြောင်းလို့ ရနေသေးလို့ပါ။ ဒါကြောင့် TypeScript က property တိုင်းကို let လိုပဲ ကျယ်တဲ့
      type နဲ့ infer လုပ်ပါတယ်။ error ကို အောက်ဆုံး အပိုင်းကနေ ဖတ်ကြည့်ရင်လည်း၊ string ကို CupSize နေရာမှာ
      ထည့်လို့ မရဘူး ဆိုတဲ့ ပြဿနာက size property မှာ ဖြစ်နေတာ တွေ့ရပါတယ်။ [[mark:type-inline]] ပြင်နည်း နှစ်မျိုး ရှိပါတယ်။ ပထမ
      နည်းက object ကို function ခေါ်တဲ့ နေရာမှာ တိုက်ရိုက် ရေးတာပါ။ ကော်ဖီ ခွက်ကြီးကို ဒီ နည်းနဲ့
      တွက်ကြည့်ပါမယ်။ [[mark:read-inline]] ဒီ line မှာ error မရှိဘဲ၊ Output မှာ ကော်ဖီ ၂၁၀၀ ကျပ် ထွက်လာပါပြီ။
      ဒီ နေရာမှာ Drink type ဖြစ်ရမယ် ဆိုတာ TypeScript က ကြိုသိနေလို့၊ large ကို CupSize အဖြစ် တန်းစစ်ပေးတာပါ။
      [[mark:type-drink-annotation]] ဒုတိယ နည်းကတော့ variable မှာ Drink ဆိုတဲ့ type annotation ထည့်တာပါ။
      [[mark:read-no-errors]] error တစ်ခုမှ မကျန်တော့ဘဲ၊ query ကလည်း Drink ဖြစ်သွားပါပြီ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 7: Mutability (object property inference, inline object, adding a type)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/mutability",
        }
      - {
          title: "TypeScript Handbook: Everyday Types (literal inference)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#literal-inference",
        }
      - {
          title: "TypeScript Handbook: Type Inference (contextual typing)",
          url: "https://www.typescriptlang.org/docs/handbook/type-inference.html#contextual-typing",
        }
    actions:
      - id: type-query-order
        type: editor.type
        at: { mark: type-query-order }
        target:
          {
            file: src/main.ts,
            after: "const teaOrder = { item: \"လက်ဖက်ရည်\", size: \"large\" };\n",
            occurrence: 1,
          }
        text: "//    ^?\n"
      - id: expect-query-order
        type: expect.preview
        at: { afterAction: type-query-order }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-3 }
        textContains: "size: string;"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-inline
        type: editor.type
        at: { mark: type-inline }
        target:
          {
            file: src/main.ts,
            after: "console.log(\"လက်ဖက်ရည်\", drinkPrice(teaOrder));\n",
            occurrence: 1,
          }
        text: "console.log(\"ကော်ဖီ\", drinkPrice({ item: \"ကော်ဖီ\", size: \"large\" }));\n"
        cadence: line-by-line
      - id: expect-inline-output
        type: expect.preview
        at: { afterAction: type-inline }
        timeoutMs: 8000
        target: { by: testId, value: ts-out-3 }
        textContains: "ကော်ဖီ 2100"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-inline-no-error
        type: expect.preview
        at: { afterAction: expect-inline-output }
        timeoutMs: 5000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-drink-annotation
        type: editor.type
        at: { mark: type-drink-annotation }
        target: { file: src/main.ts, after: "const teaOrder", occurrence: 1 }
        text: ": Drink"
      - id: expect-no-errors
        type: expect.preview
        at: { afterAction: type-drink-annotation }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-query-drink
        type: expect.preview
        at: { afterAction: expect-no-errors }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-3 }
        attribute: { name: data-type, value: "const teaOrder: Drink" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: readonly-property
    chapter: "readonly property"
    narration: >
      [[mark:select-receipt-again]] အခု ပြောင်းလို့ လုံးဝ မရစေချင်တဲ့ တန်ဖိုးတွေကို ကြည့်ရအောင်။ ဘောင်ချာမှာ
      စားပွဲ ပြောင်းတာက ဖြစ်တတ်ပေမယ့်၊ ငွေရှင်းပြီးသား စုစုပေါင်း ငွေကို ပြောင်းတာကတော့ မဖြစ်သင့်ပါဘူး။
      [[mark:open-order-2]] order ဖိုင်ကို ပြန်ဖွင့်ပါမယ်။ [[mark:type-readonly-total]] စုစုပေါင်း ငွေ
      property ရဲ့ ရှေ့မှာ read only ထည့်ပါမယ်။ read only ဆိုတာ ဖတ်လို့ပဲ ရပြီး ပြန်ပြင်လို့ မရတဲ့ property
      ပါ။ [[mark:read-readonly-error]] read only property ကို တန်ဖိုး အသစ် ထည့်လို့ မရဘူး ဆိုတဲ့ error
      ပေါ်လာပြီး၊ ငွေကို ပြောင်းနေတဲ့ main ဖိုင်ရဲ့ line ကို ညွှန်ပြနေပါတယ်။ [[mark:read-still-zero]] ဒါပေမဲ့
      Output မှာ ဘောင်ချာက သုည ကျပ် အတိုင်း ရှိနေပါသေးတယ်။ read only က type ပိုင်းမှာပဲ ရှိပြီး run တဲ့
      အချိန်မှာ ဖယ်ထုတ်ပြီးသား ဖြစ်လို့၊ တကယ့် object ကိုတော့ ကာကွယ်မပေးပါဘူး။ [[mark:type-comment-total]]
      TypeScript ပြပေးတဲ့ အမှားကို ပြင်ဖို့၊ ငွေ ပြောင်းတဲ့ line ကို comment လုပ်ပြီး ပိတ်လိုက်ပါမယ်။ [[mark:read-total-back]] error
      ပျောက်ပြီး၊ ဘောင်ချာက ၃၃၀၀ ကျပ် ပြန်ဖြစ်သွားပါပြီ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 7: Mutability (readonly object properties)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/mutability",
        }
      - {
          title: "TypeScript Handbook: Object Types (readonly properties)",
          url: "https://www.typescriptlang.org/docs/handbook/2/objects.html#readonly-properties",
        }
    actions:
      - id: select-receipt-again
