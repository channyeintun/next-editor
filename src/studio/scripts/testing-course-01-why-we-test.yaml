            "vite": "7.3.7",
            "vitest": "5.1.0"
          }
        }
      src/app.css: |
        .order-form { padding: 10px 14px; }
        .order-form h2 { margin: 0 0 6px; font-size: 16px; }
        .order-form .buttons { display: flex; gap: 8px; }
        .order-form button { font: inherit; padding: 4px 10px; border: 1px solid #b7a98f; border-radius: 6px; background: #fff; cursor: pointer; }
        .order-form p { margin: 6px 0 0; }
      src/app.js: |
        import { mountOrderForm } from "./order-form.js";
        import "./app.css";

        // The preview mounts this into #app (index.html: data-app="src/app.js").
        export default function mount(root) {
          mountOrderForm(root);
        }
      src/menu.js: |
        export const MENU = {
          tea: { name: "လက်ဖက်ရည်", price: 1500, drink: true },
          coffee: { name: "ကော်ဖီ", price: 1800, drink: true },
          lime: { name: "သံပုရာရည်", price: 1200, drink: true },
          mohinga: { name: "မုန့်ဟင်းခါး", price: 2500, drink: false },
          paratha: { name: "ပလာတာ", price: 1200, drink: false },
        };

        export function priceOf(id) {
          const item = MENU[id];
          if (!item) throw new Error(`${id} is not on the menu`);
          return item.price;
        }
      src/order-form.js: |
        import { MENU } from "./menu.js";
        import { orderTotal } from "./order.js";

        // The shop's order form. Each button adds one cup; the same drink twice is one line with qty 2.
        export function mountOrderForm(root) {
          const lines = [];
          root.innerHTML = `
            <section class="order-form" aria-label="အော်ဒါ">
              <h2>ရွှေလက်ဖက်ရည်ဆိုင်</h2>
              <div class="buttons">
                <button type="button" data-testid="add-tea">လက်ဖက်ရည် ထည့်မယ်</button>
                <button type="button" data-testid="add-coffee">ကော်ဖီ ထည့်မယ်</button>
              </div>
              <p data-testid="order-lines">အော်ဒါ မရှိသေးပါ</p>
              <p data-testid="total">စုစုပေါင်း 0 ကျပ်</p>
            </section>`;
          const shown = root.querySelector("[data-testid=order-lines]");
          const total = root.querySelector("[data-testid=total]");
          const add = (id) => {
            const line = lines.find((l) => l.id === id);
            if (line) line.qty += 1;
            else lines.push({ id, qty: 1 });
            shown.textContent = lines.map((l) => `${MENU[l.id].name} x${l.qty}`).join("၊ ");
            total.textContent = `စုစုပေါင်း ${orderTotal(lines).toLocaleString("en-US")} ကျပ်`;
          };
          root.querySelector("[data-testid=add-tea]").addEventListener("click", () => add("tea"));
          root.querySelector("[data-testid=add-coffee]").addEventListener("click", () => add("coffee"));
        }
      src/order.js: |
        import { priceOf } from "./menu.js";

        // An order is a list of lines: { id: "tea", qty: 2 } is two cups of tea.
        export function orderTotal(lines) {
          return lines.reduce((sum, line) => sum + priceOf(line.id), 0);
        }
      src/order.test.js: |
        import { test } from "vitest";
        import { orderTotal } from "./order.js";

        test("an empty order costs nothing", () => {
          const total = orderTotal([]);
          if (total !== 0) {
            throw new Error(`expected 0, got ${total}`);
          }
        });
      vite.config.js: |
        import { defineConfig } from "vite";
        import courseVitestBridge from "./course/vitest-bridge.js";

        // The course panel: the dev server runs the real Vitest and the preview shows its results.
        export default defineConfig({
          plugins: [courseVitestBridge()],
        });
      vitest.config.js: |
        import { defineConfig } from "vitest/config";

        export default defineConfig({
          test: {
          },
        });
