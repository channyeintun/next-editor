  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: open
    chapter: "Testing ဆိုတာ ဘာလဲ"
    narration: >
      [[mark:start]] မင်္ဂလာပါ ခင်ဗျာ။ Testing course ကို ကြိုဆိုပါတယ်။ ဒီ course တစ်လျှောက်လုံးမှာ
      ရန်ကုန်က ရွှေလက်ဖက်ရည်ဆိုင်ရဲ့ code တွေကို test တွေနဲ့ စစ်ရင်း၊ testing ကို အခြေခံကနေ စပြီး
      အဆင့်ဆင့် လေ့လာသွားမှာပါ။ [[mark:course-plan]] test တွေ ရေးပြီး run ဖို့အတွက် Vitest ဆိုတဲ့ tool ကို course
      အစကနေ အဆုံးထိ သုံးသွားပါမယ်။ code မရေးခင် test ကို အရင် ရေးတဲ့ TDD ဆိုတဲ့ နည်းကိုလည်း
      လေ့လာမှာ ဖြစ်ပြီး၊ နောက်ဆုံးပိုင်းမှာတော့ AI နဲ့ code ရေးနေကြတဲ့ ဒီခေတ်မှာ test တွေ ဘာကြောင့်
      ပိုအရေးကြီးလာလဲ ဆိုတာကို အသေးစိတ် ကြည့်ပါမယ်။ [[mark:draw-daily]] ဒီ နောက်ဆုံး အချက်ကို
      ကိန်းဂဏန်း နှစ်ခုနဲ့ အရင် ကြည့်ရအောင်။ ၂၀၂၆ ခုနှစ်မှာ Stack Overflow က developer တွေကို survey
      ကောက်တော့၊ AI coding assistant တွေကို သုံးနေသူတွေထဲက ၇၃ ရာခိုင်နှုန်းက နေ့တိုင်း သုံးနေတယ်လို့
      ဖြေထားကြပါတယ်။ [[mark:draw-almost]] ၂၀၂၅ ခုနှစ် survey မှာတော့ developer တွေ စိတ်ညစ်ရဆုံး
      အချက်က၊ AI ရေးပေးတဲ့ code ဟာ မှန်သလိုလိုနဲ့ အပြည့်အဝ မမှန်တာ ဖြစ်ပြီး၊ ဖြေဆိုသူ ၆၆
      ရာခိုင်နှုန်းက ဒီ အချက်ကို ရွေးထားကြပါတယ်။ ဒီ ကိန်းဂဏန်းတွေက ဖြေဆိုသူတွေ ကိုယ်တိုင်
      ပြောထားတာ ဖြစ်ပါတယ်။ [[mark:draw-point]] ဆိုလိုတာက AI က code ကို အရမ်း မြန်မြန်
      ရေးပေးနိုင်ပေမဲ့၊ အဲဒီ code မှန်မမှန် သိဖို့ကတော့ ကိုယ်တိုင် စစ်ရဆဲ ဖြစ်ပါတယ်။ code ကို ဘယ်သူပဲ ရေးရေး၊
      မှန်မမှန် စစ်ပေးတဲ့ အလုပ်ကို testing လို့ ခေါ်ပြီး၊ ဒီ course ရဲ့ နောက်ပိုင်း lesson တွေမှာ ဒီ
      အကြောင်းကို ပြန်ကြည့်ပါမယ်။
    sources:
      - { title: "web.dev Learn Testing: Welcome", url: "https://web.dev/learn/testing/welcome" }
      - { title: "Vitest: Getting Started", url: "https://vitest.dev/guide/" }
      - {
          title: "Stack Overflow Developer Survey 2026: AI (facts D12)",
          url: "https://survey.stackoverflow.co/2026/ai",
        }
      - {
          title: "Stack Overflow Developer Survey 2025: AI (facts D11)",
          url: "https://survey.stackoverflow.co/2025/ai",
        }
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-daily
        type: whiteboard.apply
        at: { mark: draw-daily }
        upsertIds: [a-daily-box, a-daily-num, a-daily-1, a-daily-2, a-daily-src]
        drawMs: 3000
      - id: draw-almost
        type: whiteboard.apply
        at: { mark: draw-almost }
        upsertIds: [a-almost-box, a-almost-num, a-almost-1, a-almost-2, a-almost-src]
        drawMs: 3000
      - id: draw-point
        type: whiteboard.apply
        at: { mark: draw-point }
        upsertIds: [a-point]
        drawMs: 1800

  - id: what-testing-is
    narration: >
      [[mark:board-testing]] ဒါဆို testing ဆိုတာ တကယ် ဘာလဲ။ code ကို run ကြည့်ပြီး ရလာတဲ့ ရလဒ်ကို
      ဖြစ်ရမယ့် အဖြေနဲ့ တိုက်စစ်တာပါ။ ဘာကို ဘယ်လို စစ်မလဲ ဆိုတာကို ကြိုဆုံးဖြတ်ထားတဲ့အတွက်၊ code က
      ကိုယ် ဆိုလိုတဲ့ အတိုင်း အလုပ်လုပ်လား ဆိုတာ သိနိုင်ပါတယ်။ [[mark:draw-examples]]
      ဆိုင်ရဲ့ website နဲ့ ဥပမာ ပေးရရင်၊ ခလုတ်ကို နှိပ်လိုက်တာနဲ့ အော်ဒါထဲကို လက်ဖက်ရည် ဝင်လာလား၊
      စုစုပေါင်း ငွေ မှန်လား၊ လျှော့ဈေး ကုဒ်ကို မှားရိုက်ရင် error ပြလား၊ အင်တာနက် အရမ်း နှေးနေရင်တောင်
      page က အလုပ်လုပ်နေသေးလား ဆိုတာတွေကို စစ်ချင်ပါတယ်။ ဒါတွေ တစ်ခုချင်းစီက ဆိုင်ရဲ့ အလုပ်လုပ်ပုံ တစ်ခုစီ ဖြစ်ပြီး၊ test တစ်ခုက အဲဒီ အလုပ်လုပ်ပုံ တစ်ခုကို စစ်ပေးပါတယ်။
    sources:
      - {
          title: "web.dev Learn Testing: What testing is",
          url: "https://web.dev/learn/testing/get-started/what-testing-is",
        }
    actions:
      - id: board-testing
        type: whiteboard.apply
        at: { mark: board-testing }
        clear: true
        upsertIds: [b-title, b-def-1, b-def-2]
        drawMs: 2000
      - id: draw-examples
        type: whiteboard.apply
        at: { mark: draw-examples }
        upsertIds: [b-ex-box, b-ex-1, b-ex-2, b-ex-3, b-ex-4]
        drawMs: 4500

  - id: starter
    chapter: "ဆိုင်ရဲ့ code နဲ့ Vitest panel"
    narration: >
      [[mark:close-board]] ဆိုင်ရဲ့ code ထဲကို ဝင်ကြည့်ရအောင်။ ဒါက အော်ဒါတွေရဲ့ ငွေကို တွက်ပေးတဲ့
      order ဖိုင်ပါ။ [[mark:select-sum]] ဒီ အပိုင်းက အော်ဒါထဲက line တစ်ကြောင်းချင်းစီရဲ့ ဈေးနှုန်းကို
      menu ထဲကနေ ရှာပြီး၊ တစ်ခုပြီးတစ်ခု ပေါင်းသွားတာပါ။ အော်ဒါ line တစ်ကြောင်းမှာ ဘာ မှာလဲ ဆိုတာနဲ့ ဘယ်နှခွက်လဲ ဆိုတာ ပါပြီး၊
      ဆိုင်ရဲ့ page ပေါ်က form ကလည်း စုစုပေါင်း ငွေကို ဒီ function နဲ့ပဲ တွက်ပါတယ်။ ဒီ code ထဲမှာ bug
      တစ်ခု ရှိနေပါတယ်။ ဘယ်မှာလဲ ဆိုတာကို form ကို လက်နဲ့ စမ်းပြီး ရှာကြည့်ပါမယ်။ [[mark:open-test]]
      ဒါကတော့ ဒီ function အတွက် ရေးထားတဲ့ test ဖိုင်ပါ။ test ဆိုတာ code တစ်ခုက ကိုယ်
      ရည်ရွယ်ထားတဲ့ အတိုင်း အလုပ်လုပ်လား ဆိုတာကို run ပြီး စစ်ပေးတဲ့ code ပါ။ [[mark:select-name]]
      ဒီ test ကို ဘာမှ မမှာရသေးတဲ့ အော်ဒါရဲ့ စုစုပေါင်းဟာ သုည ဖြစ်ရမယ် ဆိုတဲ့ နာမည်နဲ့
      ရေးထားပါတယ်။ [[mark:select-throw]] function ကို run လို့ ရလာတဲ့ အဖြေ သုည မဟုတ်ရင်၊ error
      တစ်ခုကို throw လုပ်ပါတယ်။ test တစ်ခုဆိုတာ အခြေခံအားဖြင့် ဒီလိုပါပဲ၊ တစ်ခုခု မှားနေရင် error
      throw လုပ်တဲ့ code ပါ။ test ဆိုတဲ့ function ထဲမှာ နာမည်နဲ့ ထည့်ရေးထားတဲ့အတွက်၊ Vitest က ဒါကို
      test တစ်ခုအဖြစ် သိပြီး သူ့ဘာသာ run ပေးပါတယ်။
    sources:
      - {
          title: "web.dev Learn Testing: The fundamentals through an example",
          url: "https://web.dev/learn/testing/get-started/what-testing-is#fundamentals-example",
        }
      - { title: "Vitest: Writing Tests", url: "https://vitest.dev/guide/learn/writing-tests" }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: select-sum
        type: editor.select
        at: { mark: select-sum }
        target: { file: src/order.js, text: "sum + priceOf(line.id)", occurrence: 1 }
      - id: open-test
        type: workspace.openFile
        at: { mark: open-test }
        path: src/order.test.js
      - id: select-name
        type: editor.select
        at: { mark: select-name }
        target:
          {
            file: src/order.test.js,
            text: 'test("an empty order costs nothing", () => {',
            occurrence: 1,
          }
      - id: select-throw
        type: editor.select
        at: { mark: select-throw }
        target:
          {
            file: src/order.test.js,
            text: "throw new Error(`expected 0, got ${total}`);",
            occurrence: 1,
          }

  - id: panel
    narration: >
      [[mark:ready]] ကဲ၊ ဒီ test ကို Vitest က run လိုက်တော့ ဘာ ပြလဲ ကြည့်ရအောင်။ ညာဘက်မှာ အပေါ်က
      ဆိုင်ရဲ့ အော်ဒါ form နဲ့ သူ့အောက်က Vitest panel ကို မြင်ရပါပြီ။ panel မှာ ပြနေတာတွေက တကယ့်
      Vitest က test တွေကို run ပြီး ထုတ်ပေးတဲ့ ရလဒ်တွေပါ။ code ပြောင်းလိုက်တိုင်း Vitest က သူ့ဘာသာ
      ပြန် run ပြီး၊ ဒီ panel မှာ ချက်ချင်း ပြပေးပါတယ်။ [[mark:read-pass]] အခု test တစ်ခု ရှိပြီး၊
      သူ့ရှေ့မှာ အမှန်ခြစ် ပါနေတဲ့အတွက် pass ဖြစ်နေပါတယ်။ အောက်ဆုံးက summary မှာလည်း Tests မှာ ၁ ခု
      pass လို့ ပြနေပြီး၊ အပေါ်ဆုံးက အစိမ်းရောင် PASS ကတော့ test အားလုံး အောင်နေတယ် ဆိုတဲ့
      အဓိပ္ပာယ်ပါ။
    sources:
      - { title: "Vitest: Getting Started", url: "https://vitest.dev/guide/" }
      - {
          title: "Vitest: Writing Tests, reading test output",
          url: "https://vitest.dev/guide/learn/writing-tests#reading-test-output",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-start-pass
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1000 }
      - id: expect-start-one
        type: expect.preview
        at: { afterAction: expect-start-pass }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "1" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-form
        type: expect.preview
        at: { afterAction: expect-start-one }
        timeoutMs: 8000
        target: { by: testId, value: total }
        textContains: "စုစုပေါင်း 0 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 1000 }

  - id: manual
    chapter: "လက်နဲ့ နှိပ်ပြီး စစ်ကြည့်ရအောင်"
    narration: >
      အရင်ဆုံး ဆိုင်ရဲ့ form ကို လက်နဲ့ စမ်းကြည့်ရအောင်။ [[mark:click-tea]] လက်ဖက်ရည်
      ခလုတ်ကို နှစ်ခါ နှိပ်ပြီး၊ ကော်ဖီ ခလုတ်ကို တစ်ခါ နှိပ်ပါမယ်။ [[mark:read-total]] form မှာ
      လက်ဖက်ရည် နှစ်ခွက်နဲ့ ကော်ဖီ တစ်ခွက်လို့ မှန်မှန် ပြနေပြီး၊ စုစုပေါင်းကတော့ ၃၃၀၀ ကျပ်လို့
      ပြနေပါတယ်။ ကြည့်လိုက်ရင် ပုံမှန် ဈေးနှုန်းလိုပဲ ထင်ရပါတယ်။ ဒါပေမဲ့ ကိုယ်တိုင် တွက်ကြည့်ရအောင်။
      လက်ဖက်ရည် တစ်ခွက်က ၁၅၀၀ ကျပ် ဆိုတော့ နှစ်ခွက်က ၃၀၀၀ ကျပ်၊ ကော်ဖီ တစ်ခွက်က ၁၈၀၀ ကျပ်
      ဖြစ်လို့ စုစုပေါင်း ၄၈၀၀ ကျပ် ဖြစ်ရပါမယ်။ [[mark:almost-right]] ၃၃၀၀ ဆိုတာ လက်ဖက်ရည်
      တစ်ခွက်နဲ့ ကော်ဖီ တစ်ခွက်ရဲ့ ဈေးပါ။ ဆိုလိုတာက ဘယ်နှခွက် မှာလဲ ဆိုတာကို code က ထည့်မတွက်ဘဲ
      ကျော်သွားနေတာပါ။ ဒီ bug က ခုနက ပြောခဲ့တဲ့ မှန်သလိုလိုနဲ့ မမှန်တဲ့ အမျိုးအစားပါ။ ဂဏန်းက
      မှားပုံ မပေါ်တဲ့အတွက်၊ ဆိုင်က လက်ဖက်ရည် တစ်ခွက်ဖိုး လျော့ယူမိနေတာကို ဘယ်သူမှ
      သတိမထားမိဘဲ ကျော်သွားနိုင်ပါတယ်။ [[mark:manual-cost]] ဒီလို လူကိုယ်တိုင် နှိပ်ပြီး မျက်စိနဲ့
      စစ်တာကို manual testing လို့ ခေါ်ပါတယ်။ bug ကို တွေ့တော့ တွေ့ပါပြီ။ ဒါပေမဲ့ code ကို
      ပြင်လိုက်တိုင်း၊ ဒီ ခလုတ်တွေကို ထပ်နှိပ်ပြီး ဂဏန်းကို ထပ်တွက်နေရဦးမှာပါ။
    sources:
      - {
          title: "web.dev Learn Testing: Automated versus manual testing",
          url: "https://web.dev/learn/testing/get-started/what-testing-is#automated-manual",
        }
      - {
          title: "Stack Overflow Developer Survey 2025: AI (facts D11)",
          url: "https://survey.stackoverflow.co/2025/ai",
        }
    actions:
      - id: click-tea
        type: preview.click
        at: { mark: click-tea }
        timeoutMs: 8000
        target: { by: testId, value: add-tea }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: click-tea-2
        type: preview.click
        at: { mark: click-tea, offsetMs: 1200 }
        timeoutMs: 8000
        target: { by: testId, value: add-tea }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: click-coffee
        type: preview.click
        at: { mark: click-tea, offsetMs: 2400 }
        timeoutMs: 8000
        target: { by: testId, value: add-coffee }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-total-3300
        type: expect.preview
        at: { mark: read-total }
        timeoutMs: 5000
        target: { by: testId, value: total }
        textContains: "စုစုပေါင်း 3,300 ကျပ်"
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-lines
        type: expect.preview
        at: { afterAction: expect-total-3300 }
        timeoutMs: 5000
        target: { by: testId, value: order-lines }
        textContains: "လက်ဖက်ရည် x2၊ ကော်ဖီ x1"
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: manual-vs-automated
    narration: >
      [[mark:board-ways]] ဒါကြောင့် စစ်တဲ့ နည်း နှစ်မျိုးကို ယှဉ်ကြည့်ရအောင်။ [[mark:draw-manual]]
      ခုနက လုပ်ခဲ့တဲ့ manual testing မှာ လူကိုယ်တိုင် ခလုတ်တွေကို နှိပ်ပြီး၊ ရလဒ်ကို မျက်စိနဲ့
      ကြည့်စစ်ပါတယ်။ လူက တွေးခေါ်ဖန်တီးနိုင်တဲ့အတွက်၊ ဘယ်သူမှ မတွေးမိသေးတဲ့ ပြဿနာတွေကို စူးစမ်းရှာဖွေဖို့ အရမ်း ကောင်းပြီး၊ ခုနကလိုပဲ ဘာကို test ရေးသင့်လဲ ဆိုတာကိုလည်း ပြပေးပါတယ်။ ဒါပေမဲ့ တစ်ခါ စစ်တိုင်း လူရဲ့ အချိန် ကုန်ပြီး၊ တူညီတဲ့
      အလုပ်ကို ထပ်ခါထပ်ခါ လုပ်ရတဲ့အခါ အမှားကို မမြင်လိုက်တာမျိုး ဖြစ်တတ်ပါတယ်။
      [[mark:draw-automated]] နောက်တစ်နည်းကတော့ automated testing ပါ။ စစ်ရမယ့် အဆင့်တွေကို code
      အနေနဲ့ တစ်ခါ ရေးထားလိုက်ရင်၊ ကွန်ပျူတာက လူ မလိုဘဲ ထပ်ခါထပ်ခါ အလိုလို စစ်ပေးပါတယ်။ တစ်ခါ
      စစ်တာ တစ်စက္ကန့်တောင် မကြာသလို၊ ဘယ်နှစ်ခါ run run အမြဲ တစ်ပုံစံတည်း စစ်ပေးပြီး၊ code
      ပြင်တိုင်း ပြန်စစ်ခိုင်းထားလို့လည်း ရပါတယ်။ ခုနက ညာဘက် panel မှာ မြင်ခဲ့ရတဲ့ test ကလည်း ဒီ
      automated test အမျိုးအစားပါ။
    sources:
      - {
          title: "web.dev Learn Testing: Automated versus manual testing",
          url: "https://web.dev/learn/testing/get-started/what-testing-is#automated-manual",
        }
    actions:
      - id: board-ways
        type: whiteboard.apply
        at: { mark: board-ways }
        clear: true
        upsertIds: [c-title]
      - id: draw-manual
        type: whiteboard.apply
        at: { mark: draw-manual }
        upsertIds: [c-man-box, c-man-head, c-man-1, c-man-2, c-man-3, c-man-4]
        drawMs: 5000
      - id: draw-automated
        type: whiteboard.apply
        at: { mark: draw-automated }
        upsertIds: [c-auto-box, c-auto-head, c-auto-1, c-auto-2, c-auto-3, c-auto-4]
        drawMs: 5000

  - id: first-check
    chapter: "ပထမဆုံး test ကို ရေးရအောင်"
    narration: >
      ကဲ၊ ခုနက လက်နဲ့ စစ်ခဲ့တာကို code နဲ့ ရေးကြည့်ရအောင်။ [[mark:type-test]] test ဖိုင်ရဲ့
      အောက်ဆုံးမှာ test အသစ် တစ်ခု ထည့်ပါမယ်။ သူ့နာမည်ကတော့ လက်ဖက်ရည် နှစ်ခွက်နဲ့ ကော်ဖီ
      တစ်ခွက်ကို ပေါင်းတွက်တယ် ဆိုတဲ့ အဓိပ္ပာယ်ပါ။ [[mark:select-order]] ဒီ အပိုင်းက လက်ဖက်ရည်
      နှစ်ခွက်နဲ့ ကော်ဖီ တစ်ခွက် ပါတဲ့ အော်ဒါကို function ဆီ ပေးပြီး၊ စုစုပေါင်းကို တွက်ခိုင်းတာပါ။
      [[mark:select-check]] ရလာတဲ့ စုစုပေါင်းက ၄၈၀၀ မဟုတ်ရင် error throw လုပ်ခိုင်းထားပြီး၊ error
      message ထဲမှာလည်း ဖြစ်ရမယ့် တန်ဖိုးနဲ့ တကယ် ရလာတဲ့ တန်ဖိုး နှစ်ခုလုံး ပါအောင် ရေးထားပါတယ်။
      [[mark:read-red]] panel ကို ကြည့်ပါ။ test ဖိုင် ပြောင်းသွားတာနဲ့ Vitest က test တွေကို ပြန် run
      လိုက်ပြီး၊ test အသစ်ရှေ့မှာ ကြက်ခြေခတ် ပေါ်နေပါပြီ။ အပေါ်က PASS ကလည်း အနီရောင် FAIL ဖြစ်သွားပါပြီ။ အောက်ဆုံးက summary မှာတော့ test တစ်ခု fail နဲ့ တစ်ခု pass လို့ ပြနေပါတယ်။ [[mark:read-message]]
      အလယ်က Failed Tests အပိုင်းမှာ ကျသွားတဲ့ test ရဲ့ ဖိုင်နာမည်နဲ့ test နာမည်ကို အရင် ပြပြီး၊
      သူ့အောက်မှာ ကိုယ် ရေးထားတဲ့ message ကို ပြနေပါတယ်။ ၄၈၀၀ ဖြစ်ရမယ့် နေရာမှာ ၃၃၀၀ ရနေတယ်လို့
      ပြောနေတာပါ။ ဆိုလိုတာက Vitest က test ဖိုင်ကို ရှာတွေ့ပြီး၊ test ထဲက function ကို run
      လိုက်တော့ throw လုပ်လိုက်တဲ့ error ကို ဖမ်းပြီး ပြပေးတာ ဖြစ်ပါတယ်။ [[mark:read-frame]] message
      ရဲ့ အောက်က code frame ကလည်း error ဖြစ်သွားတဲ့ line ကို ဖိုင်နာမည်၊ line နံပါတ်နဲ့ တွဲပြီး
      ညွှန်ပြပေးပါတယ်။ [[mark:select-template]] ဒီ message ကို backtick နဲ့ ရေးတဲ့ template literal
      အနေနဲ့ ရေးထားလို့၊ တကယ် ရလာတဲ့ ၃၃၀၀ က message ထဲကို ဝင်လာတာပါ။ ရိုးရိုး quote နဲ့
      ရေးမိရင်တော့ တန်ဖိုး မဝင်တော့ဘဲ ရေးထားတဲ့ စာအတိုင်းပဲ ထွက်လာမှာ ဖြစ်လို့၊ ဘယ်လောက်
      ရနေလဲ ဆိုတာကို message ကနေ သိရမှာ မဟုတ်တော့ပါဘူး။
    sources:
      - {
          title: "web.dev Learn Testing: The fundamentals through an example",
          url: "https://web.dev/learn/testing/get-started/what-testing-is#fundamentals-example",
        }
      - { title: "Vitest: test", url: "https://vitest.dev/api/test" }
      - {
          title: "MDN: Template literals (facts B11)",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Template_literals",
        }
    actions:
      - id: close-ways
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-test-2
        type: workspace.openFile
        at: { mark: type-test }
        path: src/order.test.js
      - id: type-test
        type: editor.type
        at: { afterAction: open-test-2 }
        target:
          {
            file: src/order.test.js,
            after: "    throw new Error(`expected 0, got ${total}`);\n  }\n});\n",
            occurrence: 1,
          }
        text: "\ntest(\"adds up two teas and a coffee\", () => {\n  const total = orderTotal([\n    { id: \"tea\", qty: 2 },\n    { id: \"coffee\", qty: 1 },\n  ]);\n  if (total !== 4800) {\n    throw new Error(`expected 4800, got ${total}`);\n  }\n});\n"
        # One block: line by line, the Enter-first newline and the blank line leave the file parseable
        # and the long test( line's pause (500 ms + 14 ms a character, ±20 %) can pass the bridge's
        # 1 s quiet window, so Vitest ran early, read the half-typed next line and flashed a
        # vite:import-analysis Failed Suite (first verify run). One write gives one run.
        cadence: block
      - id: expect-red
        type: expect.preview
        at: { afterAction: type-test }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-red-count
        type: expect.preview
        at: { afterAction: expect-red }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-failed, value: "1" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-red-message
        type: expect.preview
        at: { afterAction: expect-red-count }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-message, value: "expected 4800, got 3300" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-red-test
        type: expect.preview
        at: { afterAction: expect-red-message }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-2 }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-red-frame
        type: expect.preview
        at: { afterAction: expect-red-test }
        timeoutMs: 5000
        target: { by: testId, value: vt-frame-1 }
        attribute: { name: data-line, value: "17" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-order
        type: editor.select
        at: { mark: select-order }
        target:
          {
            file: src/order.test.js,
            text: "const total = orderTotal([\n    { id: \"tea\", qty: 2 },\n    { id: \"coffee\", qty: 1 },\n  ]);",
            occurrence: 1,
          }
      - id: select-check
        type: editor.select
        at: { mark: select-check }
        target:
          {
            file: src/order.test.js,
            text: "if (total !== 4800) {\n    throw new Error(`expected 4800, got ${total}`);\n  }",
            occurrence: 1,
          }
      - id: select-template
        type: editor.select
        at: { mark: select-template }
        target: { file: src/order.test.js, text: "`expected 4800, got ${total}`", occurrence: 1 }

  - id: fix
    narration: >
      [[mark:open-order-fix]] bug ကို ပြင်ကြည့်ရအောင်။ order ဖိုင်ကို ပြန်ဖွင့်ပါမယ်။ [[mark:type-fix]]
      line တစ်ကြောင်းချင်းရဲ့ ဈေးနှုန်းကို ရှာပြီးတဲ့ နေရာမှာ၊ ခွက်အရေအတွက်နဲ့ မြှောက်ပေးလိုက်ပါမယ်။
      [[mark:read-green]] Vitest က ပြန် run လိုက်တော့၊ test နှစ်ခုလုံး အမှန်ခြစ် ဖြစ်သွားပြီး အပေါ်က
      FAIL ကလည်း အစိမ်းရောင် PASS ပြန်ဖြစ်သွားပါပြီ။ summary မှာလည်း ၂ ခုလုံး pass လို့ ပြနေပါတယ်။
      ကိုယ်က ဘာမှ ထပ်နှိပ်စရာ မလိုဘဲ၊ code ပြောင်းလိုက်တာနဲ့ test တွေက သူ့ဘာသာ ပြန်စစ်ပေးသွားတာပါ။
      [[mark:form-fresh]] ဆိုင်ရဲ့ form ကလည်း ပြင်ပြီးသား code နဲ့ အစကနေ ပြန်စထားပါတယ်။
      [[mark:click-again]] လူကိုယ်တိုင် စစ်ချင်ရင်တော့ ခုနက ခလုတ် သုံးချက်ကို ထပ်နှိပ်ရပါဦးမယ်။
      [[mark:read-4800]] ဒီတစ်ခါတော့ စုစုပေါင်းက ၄၈၀၀ ကျပ် ဖြစ်သွားပါပြီ။ ဒီမှာ ကွာခြားချက်ကို သတိထား
      ကြည့်ပါ။ လက်နဲ့ စစ်တဲ့သူက ခလုတ်တွေကို ထပ်နှိပ်ပြီး ဂဏန်းကို ထပ်တွက်ရပေမဲ့၊ test ကတော့
      ဘယ်သူမှ မနှိပ်ဘဲ သူ့ဘာသာ စစ်ပေးသွားပါတယ်။ အခုကစပြီး code ကို ဘယ်လောက်ပဲ ပြောင်းပြောင်း၊ ဒီ
      test နှစ်ခုက အလကား ပြန်စစ်ပေးနေမှာ ဖြစ်ပြီး၊ ဒါကို automated testing လို့ ခေါ်တာပါ။
    sources:
      - {
          title: "web.dev Learn Testing: Automated versus manual testing",
          url: "https://web.dev/learn/testing/get-started/what-testing-is#automated-manual",
        }
      - { title: "Vitest: Features (watch mode)", url: "https://vitest.dev/guide/features" }
    actions:
      - id: open-order-fix
        type: workspace.openFile
        at: { mark: open-order-fix }
        path: src/order.js
      - id: type-fix
        type: editor.type
        at: { mark: type-fix }
        target: { file: src/order.js, after: "priceOf(line.id)", occurrence: 1 }
        text: " * line.qty"
      - id: expect-green
        type: expect.preview
        at: { afterAction: type-fix }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-green-count
        type: expect.preview
        at: { afterAction: expect-green }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "2" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-fresh-form
        type: expect.preview
        at: { afterAction: expect-green-count }
        timeoutMs: 8000
        target: { by: testId, value: total }
        textContains: "စုစုပေါင်း 0 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 1000 }
      - id: click-tea-again
        type: preview.click
        at: { mark: click-again }
        timeoutMs: 8000
        target: { by: testId, value: add-tea }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: click-tea-again-2
        type: preview.click
        at: { mark: click-again, offsetMs: 1200 }
        timeoutMs: 8000
        target: { by: testId, value: add-tea }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: click-coffee-again
        type: preview.click
        at: { mark: click-again, offsetMs: 2400 }
        timeoutMs: 8000
        target: { by: testId, value: add-coffee }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-total-4800
        type: expect.preview
        at: { mark: read-4800 }
        timeoutMs: 5000
        target: { by: testId, value: total }
        textContains: "စုစုပေါင်း 4,800 ကျပ်"
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-order-file
        type: expect.file
        at: { afterAction: expect-total-4800 }
        path: src/order.js
        contains: "sum + priceOf(line.id) * line.qty"
      - id: expect-test-file
        type: expect.file
        at: { afterAction: expect-order-file }
        path: src/order.test.js
        contains: "throw new Error(`expected 4800, got ${total}`);"

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ testing ဆိုတာ code ကို run ကြည့်ပြီး ရလာတဲ့ ရလဒ်ကို ဖြစ်ရမယ့် အဖြေနဲ့
      တိုက်စစ်တာပါ။ လူကိုယ်တိုင် နှိပ်ပြီး စစ်တဲ့ manual testing က bug ကို ရှာတွေ့နိုင်ပေမဲ့၊
      code ပြောင်းတိုင်း အစကနေ ထပ်လုပ်ရပါတယ်။ [[mark:recap-automated]] automated test ကတော့ တစ်ခုခု မှားနေရင် error throw
      လုပ်တဲ့ code ဖြစ်ပြီး၊ တစ်ခါ ရေးထားရင် ကွန်ပျူတာက အမြဲ ပြန်စစ်ပေးပါတယ်။ AI က code တွေကို
      မြန်မြန် ရေးပေးနိုင်တဲ့ ဒီခေတ်မှာ၊ code မှန်မမှန် အလိုလို စစ်ပေးတဲ့ ဒီလို test တွေက ပိုအရေးကြီးလာပါတယ်။
      နောက် lesson မှာတော့ Vitest ကို project ထဲမှာ ဘယ်လို ထည့်ရလဲ ဆိုတာနဲ့၊ if နဲ့ throw အစား expect
      ကို သုံးပြီး test ရေးနည်းကို ကြည့်သွားပါမယ်။
