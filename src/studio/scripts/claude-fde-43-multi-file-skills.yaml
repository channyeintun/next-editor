scenes:
  - id: need
    chapter: ရှည်လျားတဲ့ လုပ်ငန်းစဉ်
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ outage notice skill ကို ရေးပြီး၊ description ကောင်းမှ Claude က skill ကို အချိန်မှန်
      ရွေးတယ် ဆိုတာ လေ့လာခဲ့ပါတယ်။ အဲဒီ skill က အဆင့် လေးဆင့်ပဲ ရှိတဲ့ skill အသေးလေးပါ။
      [[mark:sel-billing]] Billing မှာ နောက်ထပ် skill လုပ်ချင်တဲ့ လုပ်ငန်းစဉ် တစ်ခု ရှိပါတယ်။ report job ရွှေ့တဲ့
      အလုပ်ပါ။ trial မှာ Billing developer နှစ်ယောက်က Claude Code နဲ့ ၃ ရက်အတွင်း report job ၁၄၀ ထဲက ၁၂ ခုကို
      ရွှေ့ခဲ့ပြီး၊ ကျန်တဲ့ job တွေကိုလည်း အဲဒီ နည်းအတိုင်း ဆက်ရွှေ့ရပါမယ်။
      [[mark:story]] ဒါပေမဲ့ ဒီ လုပ်ငန်းစဉ်က ရှည်ပါတယ်။ trial ကနေ ရလာတဲ့ စည်းကမ်းတွေ ရှိတယ်၊ library အဟောင်းရဲ့ call
      တစ်ခုစီကို အသစ်နဲ့ ဘယ်လို အစားထိုးရမလဲ ဆိုတဲ့ mapping table က စာကြောင်း ၃၀၀ လောက် ရှိတယ်၊ ပြီးတော့ output
      ကို job အဟောင်းနဲ့ တိုက်စစ်တဲ့ script လည်း ရှိပါတယ်။ session အသစ် တစ်ခု စတိုင်း developer တွေက ဒါတွေကို Claude
      ကို ပြန်ရှင်းပြနေရပါတယ်။
      [[mark:story-2]] ဒါကို skill လုပ်ဖို့ ဆုံးဖြတ်လိုက်တော့ ပထမဆုံး ပေါ်လာတဲ့ အတွေးက အားလုံးကို SKILL.md တစ်ခုတည်းထဲ
      ထည့်လိုက်ဖို့ပါ။ ဒီ lesson မှာ အဲဒီလို ရှည်တဲ့ skill ကို context window ထဲ လိုတာလောက်ပဲ ရောက်အောင် ဘယ်လို
      ဖွဲ့စည်းမလဲ ဆိုတာ ကြည့်ပါမယ်။ context window ဆိုတာ request တစ်ခုမှာ model မြင်နိုင်တဲ့ စာ အားလုံးအတွက်
      နေရာပါ။
