    sidebarStartsCollapsed: true
    files:
      README.md: |
        # နေခြည် Fiber · FDE မှတ်စု

        နေခြည် Fiber က ရန်ကုန်နဲ့ မန္တလေးမှာ fiber internet ဝန်ဆောင်မှု ပေးတဲ့ ကုမ္ပဏီပါ။
        ဒီ course အတွက် စိတ်ကူးနဲ့ တည်ဆောက်ထားတဲ့ ကုမ္ပဏီ ဖြစ်ပါတယ်။

        ## ကုမ္ပဏီ

        - customer 62,000 ခန့် (အိမ်နဲ့ ဆိုင်)
        - ဝန်ထမ်း 430: support agent 45၊ field technician 130၊ developer 24
        - developer team 4 ခု: Customer App, Billing, Network Tools, Internal Tools

        ## Support

        - တစ်ရက် ticket 1,800 ခန့်
        - connection 55 %၊ billing 25 %၊ တပ်ဆင်နဲ့ ရွှေ့ပြောင်း 12 %၊ အခြား 8 %
        - ပထမဆုံး ပြန်ဖြေချိန် ပျမ်းမျှ 38 မိနစ်၊ ticket တစ်ခုကို ဖြေရှင်းချိန် ပျမ်းမျှ 11 မိနစ်

        ## System များ

        - Ticket system: customer ရဲ့ တိုင်ကြားချက်တွေ
        - Billing: plan၊ invoice၊ ငွေပေးချေမှု (သက်တမ်း 9 နှစ်ရှိ codebase)
        - NMS: မြို့နယ်အလိုက် လိုင်းကျမှု အခြေအနေ
        - Knowledge base: ပြဿနာဖြေရှင်းနည်း article 340

        ## မုန်တိုင်းကျတဲ့ည

        - မြို့နယ် 3 ခုမှာ လိုင်းကျ၊ ticket က ပုံမှန်ရဲ့ 4 ဆ
        - chat AI နဲ့ ရေးထားတဲ့ အဖြေ 64 စောင်က လိုင်းကျနေတဲ့ customer တွေကို router ပြန်ဖွင့်ခိုင်းခဲ့တယ်

        ## FDE အလုပ် (12 ပတ်)

        - Reply assistant: support ticket အတွက် အဖြေ မူကြမ်း ရေးပေးတဲ့ agent
        - Billing team နဲ့ Claude Code
        - ကုမ္ပဏီ တစ်ခုလုံးအတွက် Claude
      billing-service/.claude/skills/report-migration/SKILL.md: |
        ---
        name: report-migration
        description: Moves one report job to the new report library and checks its output. Use when asked to migrate a report job.
        ---

        # Report migration

        One job at a time, from `src/reports/jobs/`.

        ## Rules
        - Never edit the invoice code or the old job: the old job stays for the comparison.
        - Round amounts once, at the end. Do not change the shared helpers.

        ## Steps
        1. Read the old job and list every old library call it makes.
      billing-service/.claude/skills/report-migration/references/library-mapping.md: |
        # Old report library → new report library

        The full table has about 300 rows. This copy shows the first row of each section.
        Read only the section the job needs.

        ## Contents
        1. Queries
        2. Totals and rounding
        3. Dates and time zones
        4. Output files

        ## 1. Queries
        | Old call | New call | Note |
        |---|---|---|
        | `rpt.query(sql)` | `db.select(sql)` | returns rows, not a cursor |

        ## 2. Totals and rounding
        | Old call | New call | Note |
        |---|---|---|
        | `rpt.round(x)` | `roundKyat(x)` | once, at the end of the job |

        ## 3. Dates and time zones
        | Old call | New call | Note |
        |---|---|---|
        | `rpt.today()` | `todayYangon()` | from `src/lib/time.ts` |

        ## 4. Output files
        | Old call | New call | Note |
        |---|---|---|
        | `rpt.writeCsv(path, rows)` | `writeReport(path, rows, "csv")` | same column order |
      billing-service/.claude/skills/report-migration/scripts/compare.sh: |
        #!/usr/bin/env bash
        # Runs the Billing team's output comparison for one moved report job.
        # Prints MATCH, or DIFF and the first 20 lines of the difference. Exits 0 only on a match.
        set -euo pipefail
        job="$1"
        if out=$(npm run --silent report:compare -- "$job" 2>&1); then
          echo "MATCH $job"
        else
          echo "DIFF $job"
          echo "$out" | head -n 20
          exit 1
        fi
