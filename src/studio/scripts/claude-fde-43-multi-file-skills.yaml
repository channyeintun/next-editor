      ဖွင့်ဖတ်တာပါ။ skill တစ်ခုမှာ ဒီလို အဆင့် သုံးဆင့် ရှိပါတယ်။
      [[mark:p-l1]] ပထမ အဆင့်က name နဲ့ description ပါ။ session စကတည်းက context ထဲ အမြဲ ရှိနေပြီး၊ platform docs အရ
      skill တစ်ခုကို token ၁၀၀ လောက် ကုန်ပါတယ်။ token ဆိုတာ model က စာကို ဖြတ်ယူတဲ့ အပိုင်းအစလေးပါ။
      [[mark:p-l2]] ဒုတိယ အဆင့်က SKILL.md ရဲ့ စာကိုယ်ပါ။ task က description နဲ့ ကိုက်လို့ skill ကို ရွေးတဲ့အခါမှ ဝင်လာပြီး၊
      docs က token ၅၀၀၀ အောက်မှာ ထားဖို့ ပြောပါတယ်။ ဒီထဲမှာ စည်းကမ်းတွေနဲ့ အဆင့်တွေ ရှိပါတယ်။
      [[mark:p-l3]] တတိယ အဆင့်က skill folder ထဲက တခြား file တွေပါ။ အဆင့် တစ်ခုက လိုမှပဲ ထိတာမို့၊ မထိသမျှ token
      တစ်ခုမှ မကုန်ပါဘူး။
      [[mark:p-ref]] ဒီ file တွေမှာ နှစ်မျိုး ရှိပါတယ်။ reference file ကို Claude က ဖတ်တာမို့၊ ဖတ်လိုက်တဲ့ အပိုင်းက context
      ထဲ ဝင်ပါတယ်။
      [[mark:p-out]] script ကိုတော့ Claude က run ပါတယ်။ script ရဲ့ code က context ထဲ မဝင်ဘဲ၊ run လို့ ထွက်လာတဲ့ output
      ပဲ ဝင်ပါတယ်။ ဒါကြောင့် output တိုက်စစ်တဲ့ code ကို Claude က အလုပ် လုပ်ရင်း ကိုယ်တိုင် ရေးနေမယ့်အစား၊ စစ်ပြီးသား
      script ကို run ခိုင်းတာက token လည်း သက်သာ၊ ရလဒ်လည်း တစ်ခါနဲ့ တစ်ခါ တူပါတယ်။
    sources:
      - {
          title: "Claude Docs: Agent Skills overview (how skills work)",
          url: "https://platform.claude.com/docs/en/agents-and-tools/agent-skills/overview",
        }
      - {
          title: "Agent Skills: Specification (progressive disclosure)",
          url: "https://agentskills.io/specification",
        }
    actions:
      - {
          id: draw-p-open,
          type: whiteboard.apply,
          at: { mark: p-open },
          clear: true,
          upsertIds: [p-title],
        }
      - {
          id: draw-p-l1,
          type: whiteboard.apply,
          at: { mark: p-l1 },
          upsertIds: [p-l1, p-l1-l, p-w1],
          drawMs: 1200,
        }
      - {
          id: draw-p-l2,
          type: whiteboard.apply,
          at: { mark: p-l2 },
          upsertIds: [p-l2, p-l2-l, p-w2],
          drawMs: 1200,
        }
      - {
          id: draw-p-l3,
          type: whiteboard.apply,
          at: { mark: p-l3 },
          upsertIds: [p-l3, p-l3-l, p-w3],
          drawMs: 1200,
        }
      - {
          id: draw-p-ref,
          type: whiteboard.apply,
          at: { mark: p-ref },
          upsertIds: [p-ref],
          drawMs: 900,
        }
      - {
          id: draw-p-out,
          type: whiteboard.apply,
          at: { mark: p-out },
          upsertIds: [p-out],
          drawMs: 900,
        }

  - id: reference
    chapter: Reference file
    narration: >
      [[mark:f-open]] ဒါဆို Billing ရဲ့ report migration skill ကို ဖွဲ့စည်းကြည့်ရအောင်။ folder ထဲမှာ SKILL.md အပြင်၊
      Agent Skills standard က အကြံပေးထားတဲ့ နာမည်အတိုင်း references folder နဲ့ scripts folder ရှိပါတယ်။ mapping table
      က references folder ထဲမှာပါ။
      [[mark:sel-contents]] file ရဲ့ ထိပ်ဆုံးမှာ မာတိကာ ထားထားပါတယ်။ docs က ရှည်တဲ့ reference file ကို မာတိကာနဲ့ စဖို့
      အကြံပေးပါတယ်။ Claude က မာတိကာကို ကြည့်ပြီး လိုတဲ့ အပိုင်းကိုပဲ ဆက်ဖတ်နိုင်လို့ပါ။
      [[mark:sel-rules]] SKILL.md ထဲမှာတော့ job တိုင်းအတွက် လိုတဲ့ စည်းကမ်းတွေကို ထားထားပါတယ်။ invoice code နဲ့ job
      အဟောင်းကို မပြင်ရဘူး၊ ပမာဏကို အဆုံးမှာ တစ်ခါပဲ round လုပ်ရမယ် ဆိုတာတွေပါ။ ဒါတွေက job တိုင်းမှာ လိုတာမို့
      SKILL.md ထဲမှာ နေရမှာပါ။
      [[mark:type-map]] အခု ဒုတိယ အဆင့်ကို ရေးပါမယ်။ call တစ်ခုစီရဲ့ ပုံစံအသစ်ကို mapping table ထဲမှာ ရှာဖို့ link နဲ့
      ပြောထားပါတယ်။ link ထားမှ Claude က ဒီ file ထဲမှာ ဘာရှိလဲ၊ ဘယ်အချိန် ဖွင့်ရမလဲ သိပါတယ်။ docs က reference file
      တွေကို SKILL.md ကနေ တိုက်ရိုက် link ဖို့၊ file တစ်ခုကနေ နောက် file တစ်ခုကို ဆင့်ပြီး မညွှန်ဖို့ ပြောပါတယ်။
      [[mark:type-write]] တတိယ အဆင့်က job အသစ်ကို job အဟောင်းဘေးမှာ ရေးဖို့ပါ။ job အဟောင်းက output တိုက်စစ်ဖို့
      ကျန်နေရမှာမို့ အစားထိုး မရေးပါဘူး။
    sources:
      - {
          title: "Claude Docs: Skill authoring best practices (progressive disclosure patterns)",
          url: "https://platform.claude.com/docs/en/agents-and-tools/agent-skills/best-practices",
        }
      - {
          title: "Agent Skills: Specification (optional directories)",
          url: "https://agentskills.io/specification",
        }
    actions:
      - {
          id: close-levels,
          type: whiteboard.apply,
          at: { mark: f-open, offsetMs: -900 },
          open: false,
        }
      - {
          id: open-map,
          type: workspace.openFile,
          at: { afterAction: close-levels },
          path: billing-service/.claude/skills/report-migration/references/library-mapping.md,
        }
      - id: sel-contents
        type: editor.select
        at: { mark: sel-contents }
        target:
          file: billing-service/.claude/skills/report-migration/references/library-mapping.md
          text: "## Contents\n1. Queries\n2. Totals and rounding\n3. Dates and time zones\n4. Output files"
      - {
          id: open-skill,
          type: workspace.openFile,
          at: { mark: sel-rules },
          path: billing-service/.claude/skills/report-migration/SKILL.md,
        }
      - id: sel-rules
        type: editor.select
        at: { afterAction: open-skill }
        target:
          file: billing-service/.claude/skills/report-migration/SKILL.md
          text: "## Rules\n- Never edit the invoice code or the old job: the old job stays for the comparison.\n- Round amounts once, at the end. Do not change the shared helpers."
      - id: type-map
        type: editor.type
        at: { mark: type-map }
        cadence: line-by-line
        target:
          {
            file: billing-service/.claude/skills/report-migration/SKILL.md,
            after: "list every old library call it makes.\n",
          }
        text: "2. Find each call's new form in [the mapping table](references/library-mapping.md).\n"
      - id: type-write
        type: editor.type
        at: { mark: type-write }
        cadence: line-by-line
        target:
          {
            file: billing-service/.claude/skills/report-migration/SKILL.md,
            after: "(references/library-mapping.md).\n",
          }
        text: "3. Write the new job beside the old one, using the new calls from step 2.\n"

  - id: script
    chapter: Script ကို run ခိုင်းခြင်း
    narration: >
      [[mark:type-run]] စတုတ္ထ အဆင့်က output တိုက်စစ်တာပါ။ ဒီမှာ script ကို run ဖို့ ရှင်းရှင်း ရေးထားပါတယ်။ docs က script
      တစ်ခုကို run ရမလား၊ reference အနေနဲ့ ဖတ်ရမလား ဆိုတာ Claude ကို ပြောပြဖို့ အကြံပေးပါတယ်။ ဒီ skill မှာ run ဖို့ပဲ
      လိုပါတယ်။
      [[mark:sel-dir]] script ရဲ့ လမ်းကြောင်းမှာ skill folder ကို ညွှန်တဲ့ variable ကို သုံးထားပါတယ်။ Claude Code က
      ဒါကို skill folder ရဲ့ လမ်းကြောင်းနဲ့ အစားထိုးပေးတာမို့၊ ဘယ် folder ကနေ အလုပ်လုပ်နေနေ script ကို တွေ့ပါတယ်။
      [[mark:type-commit]] နောက်ဆုံး အဆင့်က ရလဒ်အပေါ် ဘာလုပ်ရမလဲ ပြောပါတယ်။ ကိုက်ရင်မှ commit လုပ်ပြီး၊ မကိုက်ရင် ရပ်ပြီး
      developer ကို ကွာခြားချက် ပြရပါမယ်။ trial မှာ သုံးခဲ့တဲ့ job တစ်ခု pass မှ commit တစ်ခါ ဆိုတဲ့ စည်းကမ်းပါ။
      [[mark:sel-script]] script က Billing team ရဲ့ compare command ကို run ပြီး၊ ကိုက်ရင် MATCH၊ မကိုက်ရင် DIFF နဲ့
      ကွာခြားချက် စာကြောင်း နှစ်ဆယ်ကိုပဲ ထုတ်ပေးပါတယ်။ ဒါကြောင့် job တစ်ခုစီကို စစ်တိုင်း context ထဲ ဝင်တာ စာကြောင်း
      အနည်းငယ်ပဲ ဖြစ်ပါတယ်။
    sources:
      - {
          title: "Claude Docs: Skill authoring best practices (executable scripts)",
          url: "https://platform.claude.com/docs/en/agents-and-tools/agent-skills/best-practices",
        }
      - {
          title: "Claude Code Docs: Extend Claude with skills (supporting files)",
          url: "https://code.claude.com/docs/en/skills",
        }
    actions:
      - id: type-run
        type: editor.type
        at: { mark: type-run }
        cadence: line-by-line
        target:
          {
            file: billing-service/.claude/skills/report-migration/SKILL.md,
            after: "using the new calls from step 2.\n",
          }
        text: "4. Run `${CLAUDE_SKILL_DIR}/scripts/compare.sh <job>` and use its output.\n"
      - id: expect-run
        type: expect.file
        at: { afterAction: type-run }
        path: billing-service/.claude/skills/report-migration/SKILL.md
        contains: "4. Run `${CLAUDE_SKILL_DIR}/scripts/compare.sh <job>` and use its output.\n"
      - id: sel-dir
        type: editor.select
        at: { mark: sel-dir }
        target:
          file: billing-service/.claude/skills/report-migration/SKILL.md
          text: "${CLAUDE_SKILL_DIR}"
      - id: type-commit
        type: editor.type
        at: { mark: type-commit }
        cadence: line-by-line
        target:
          {
            file: billing-service/.claude/skills/report-migration/SKILL.md,
            after: "<job>` and use its output.\n",
          }
        text: "5. Commit only after MATCH. After DIFF, stop and show the difference to the developer.\n"
      - {
          id: open-script,
          type: workspace.openFile,
          at: { mark: sel-script },
          path: billing-service/.claude/skills/report-migration/scripts/compare.sh,
        }
      - id: sel-script
        type: editor.select
        at: { afterAction: open-script }
        target:
          file: billing-service/.claude/skills/report-migration/scripts/compare.sh
          text: "# Prints MATCH, or DIFF and the first 20 lines of the difference. Exits 0 only on a match."

  - id: frontmatter
    chapter: allowed-tools တကယ် လုပ်တာ
    narration: >
      [[mark:t-back]] Billing team က Manual mode နဲ့ အလုပ်လုပ်တာမို့ script ကို run တိုင်း Claude Code က ခွင့်ပြုချက် မေးပါတယ်။ job တစ်ခုစီမှာ အကြိမ်ကြိမ် run ရတော့
      developer တွေက ဒီ script အတွက်ပဲ မမေးစေချင်ပါဘူး။
      [[mark:type-tools]] ဒါအတွက် frontmatter မှာ allowed tools field ကို ထည့်ပါမယ်။ ဒီ field က skill ကို ခေါ်လိုက်တဲ့
      turn အတွင်းမှာ ဒီ tool ကို မမေးဘဲ သုံးခွင့် ကြိုပေးထားတာပါ။ developer ရဲ့ နောက် message ရောက်တာနဲ့ အဲဒီ ခွင့်က
      ပြန်ပျောက်ပါတယ်။
      [[mark:sel-tools]] ဒီနေရာမှာ အမှားများပါတယ်။ allowed tools က ဒီ tool တွေကိုပဲ သုံးရမယ်လို့ ကန့်သတ်တဲ့ စာရင်း မဟုတ်ပါဘူး။
      ကျန်တဲ့ tool တွေကို ပိတ်မထားသလို၊ ခါတိုင်းလို ခွင့်တောင်းပြီး သုံးနိုင်ပါသေးတယ်။ တကယ် ကန့်သတ်ချင်ရင် disallowed tools
      field ဒါမှမဟုတ် settings ထဲက deny rule ကို သုံးရပါတယ်။ Agent Skills standard ကလည်း ဒီ field ကို experimental လို့
      မှတ်ထားပြီး၊ ကုမ္ပဏီတွေက managed settings ကနေ ပိတ်ထားလို့လည်း ရပါတယ်။
      [[mark:t-other]] frontmatter မှာ တခြား option တွေလည်း ရှိပါတယ်။ disable model invocation ကို true ထားရင် skill
      ကို လူကပဲ ခေါ်လို့ရပြီး၊ လူက မခေါ်မချင်း description က context ထဲ မဝင်ပါဘူး။ context ကို fork ထားရင် skill ရဲ့ စာကိုယ်က
      subagent အသစ် တစ်ခုရဲ့ task ဖြစ်သွားပါတယ်။ နာမည်က fork ဖြစ်ပေမဲ့ အဲဒီ subagent က ကိုယ့် စကားဝိုင်းကို မမြင်ရပါဘူး။
      subagent ဆိုတာ အလုပ် တစ်ပိုင်းကို သီးသန့် context နဲ့ လုပ်ပေးတဲ့ လက်ထောက် agent ပါ။
    sources:
      - {
          title: "Claude Code Docs: Extend Claude with skills (frontmatter reference, pre-approve tools)",
          url: "https://code.claude.com/docs/en/skills",
        }
      - {
          title: "Agent Skills: Specification (allowed-tools)",
          url: "https://agentskills.io/specification",
        }
    actions:
      - {
          id: open-skill-2,
          type: workspace.openFile,
          at: { mark: t-back },
          path: billing-service/.claude/skills/report-migration/SKILL.md,
        }
      - id: type-tools
        type: editor.type
        at: { mark: type-tools }
        cadence: line-by-line
        target:
          {
            file: billing-service/.claude/skills/report-migration/SKILL.md,
            after: "Use when asked to migrate a report job.\n",
          }
        text: "allowed-tools: Bash(${CLAUDE_SKILL_DIR}/scripts/compare.sh *)\n"
      - id: sel-tools
        type: editor.select
        at: { mark: sel-tools }
        target:
          file: billing-service/.claude/skills/report-migration/SKILL.md
          text: "allowed-tools: Bash(${CLAUDE_SKILL_DIR}/scripts/compare.sh *)"

  - id: size
    chapter: SKILL.md ကို တိုအောင်
    narration: >
      [[mark:s-open]] skill ကို ဖွဲ့စည်းတဲ့အခါ docs က အရွယ်အစားအတွက် လမ်းညွှန် အချို့ ပေးထားပါတယ်။
      [[mark:s-1]] ပထမ တစ်ခုက SKILL.md ကို စာကြောင်း ၅၀၀ အောက်မှာ ထားဖို့ပါ။ ဒီထက် ရှည်လာရင် အသေးစိတ်ကို သီးခြား
      file တွေထဲ ရွှေ့ပါ။
      [[mark:s-2]] ဒုတိယ တစ်ခုက ညွှန်ကြားချက်ကို token ၅၀၀၀ အောက်မှာ ထားဖို့ပါ။ skill ရဲ့ စာကိုယ် ဝင်လာပြီးရင် စကားဝိုင်း
      တစ်လျှောက်လုံး ကျန်နေတာမို့ စာကြောင်း တိုင်းက turn တိုင်းမှာ token ကုန်ပါတယ်။ context ပြည့်လို့ အလိုအလျောက်
      ချုံ့တဲ့အခါမှာလည်း Claude Code က skill တစ်ခုစီရဲ့ ပထမ token ၅၀၀၀ ကိုပဲ ပြန်တွဲပေးပါတယ်။
      [[mark:s-3]] တတိယ တစ်ခုက reference file တွေကို SKILL.md ကနေ တစ်ဆင့်တည်း link ထားဖို့ပါ။ Billing skill မှာ
      ရေးခဲ့သလိုပါ။
      [[mark:s-4]] စတုတ္ထ တစ်ခုက ရှည်တဲ့ reference file မှာ မာတိကာ ထည့်ဖို့ပါ။ mapping table မှာ ထည့်ထားတဲ့ မာတိကာက
      ဒီအတွက်ပါ။
    sources:
      - {
          title: "Claude Code Docs: Extend Claude with skills (size, content lifecycle)",
          url: "https://code.claude.com/docs/en/skills",
