      - id: expect-sugar-none
        type: expect.preview
        at: { afterAction: expect-text-cups }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-3 }
        textContains: "1 ခွက် သံပုရာရည် · သကြား none"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-zero-cups
        type: expect.preview
        at: { afterAction: expect-sugar-none }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-4 }
        textContains: "0 ခွက် ကော်ဖီ · သကြား less"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-js-no-type
        type: expect.preview
        at: { mark: read-js }
        timeoutMs: 5000
        target: { by: testId, value: ts-js-1 }
        textContains: "const order = JSON.parse(text);"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: schema
    chapter: "Zod schema"
    narration: >
      [[mark:type-schema]] ဒါဆို အော်ဒါရဲ့ ပုံစံကို Zod schema နဲ့ ရေးကြည့်ရအောင်။ import တွေရဲ့
      အောက်မှာ schema တစ်ခု ထည့်ပါမယ်။ [[mark:select-object]] Zod ရဲ့ object function က object တစ်ခုမှာ
      ဘယ် property တွေ ပါရမလဲ ဆိုတာ သတ်မှတ်ပေးပါတယ်။ [[mark:select-string-number]] item က string
      ဖြစ်ရပြီး၊ cups က number ဖြစ်ရပါမယ်။ [[mark:select-enum]] sugar ကိုတော့ Zod ရဲ့ enum နဲ့
      ရေးထားလို့၊ ဒီ စကားလုံး သုံးလုံးထဲက တစ်ခုခုပဲ ဖြစ်ရပါမယ်။ lesson ၁၉ က TypeScript enum မဟုတ်ဘဲ၊
      ခွင့်ပြုတဲ့ စာသားတွေကို စာရင်းပေးတဲ့ Zod function ပါ။ [[mark:read-js-schema]] JavaScript output
      ကို ပြန်ကြည့်ပါ။ type တွေ ပျောက်သွားပေမယ့်၊ schema ကတော့ JavaScript တန်ဖိုး ဖြစ်လို့ အဲဒီ ထဲမှာ
      ဆက်ရှိနေပါတယ်။ ဒါကြောင့် run နေတဲ့ အချိန်မှာ data ကို စစ်ဖို့ သုံးလို့ ရပါတယ်။
    sources:
      - { title: "Zod: Basic usage (defining a schema)", url: "https://zod.dev/basics" }
      - {
          title: "Zod: Defining schemas (objects, strings, numbers, enums)",
          url: "https://zod.dev/api",
        }
      - {
          title: "Total TypeScript: Zod tutorial (be specific with allowed types)",
          url: "https://www.totaltypescript.com/tutorials/zod/zod-section/union",
        }
    actions:
      - id: type-schema
        type: editor.type
        at: { mark: type-schema, offsetMs: 300 }
        target:
          { file: src/main.ts, after: "import { inbox } from \"./inbox\";\n\n", occurrence: 1 }
        text: "const OrderSchema = z.object({\n  item: z.string(),\n  cups: z.number(),\n  sugar: z.enum([\"less\", \"normal\", \"extra\"]),\n});\n\n"
        cadence: block
      - id: select-object
        type: editor.select
        at: { mark: select-object }
        target: { file: src/main.ts, text: "const OrderSchema = z.object({", occurrence: 1 }
      - id: select-string-number
        type: editor.select
        at: { mark: select-string-number }
        target:
          { file: src/main.ts, text: "  item: z.string(),\n  cups: z.number(),", occurrence: 1 }
      - id: select-enum
        type: editor.select
        at: { mark: select-enum }
        target: { file: src/main.ts, text: 'z.enum(["less", "normal", "extra"])', occurrence: 1 }
      - id: expect-js-schema
        type: expect.preview
        at: { mark: read-js-schema }
        timeoutMs: 8000
        target: { by: testId, value: ts-js-1 }
        textContains: "const OrderSchema = z.object({"
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: parse
    chapter: "parse နဲ့ safeParse"
    narration: >
      [[mark:type-parse]] ပထမဆုံး schema ရဲ့ parse method ကို သုံးကြည့်ပါမယ်။ JSON parse ရဲ့ ရလဒ်ကို
      schema ရဲ့ parse ထဲ ထည့်တဲ့ line အသစ် ရေးပြီး၊ အဟောင်း line ကို comment လုပ်လိုက်ပါမယ်။
      [[mark:read-parse-throw]] Output မှာ ပထမ ticket ပဲ ထွက်ပြီး၊ ဒုတိယ အော်ဒါမှာ ZodError ဆိုတဲ့
      အနီရောင် error နဲ့ program ရပ်သွားပါပြီ။ parse က data မှန်ရင် data ကို ပြန်ပေးပြီး၊
      မှားရင်တော့ error ကို throw လုပ်ပါတယ်။ [[mark:read-zod-error]] error ထဲမှာ cups ဆိုတဲ့ နေရာမှာ
      number ကို မျှော်လင့်ထားပေမယ့် string ရောက်လာတယ် ဆိုတာ အသေးစိတ် ပါပါတယ်။ ဒါပေမဲ့ program
      ဖတ်ဖို့ ရေးထားတဲ့ ပုံစံ ဖြစ်လို့ လူ ဖတ်ရ ခက်ပြီး၊ ကျန်တဲ့ အော်ဒါ နှစ်ခုကိုလည်း
      မစစ်လိုက်ရတော့ပါဘူး။
    sources:
      - { title: "Zod: Basic usage (parsing data, handling errors)", url: "https://zod.dev/basics" }
      - {
          title: "Total TypeScript: Zod tutorial (runtime checking with Zod)",
          url: "https://www.totaltypescript.com/tutorials/zod/zod-section/number",
        }
    actions:
      - id: type-parse
        type: editor.type
        at: { mark: type-parse, offsetMs: 300 }
        target: { file: src/main.ts, after: "for (const text of inbox) {\n  ", occurrence: 1 }
        text: "const order: Order = OrderSchema.parse(JSON.parse(text));\n  // "
        cadence: block
      - id: expect-two-lines
        type: expect.preview
        at: { afterAction: type-parse }
        timeoutMs: 8000
        target: { by: testId, value: ts-output }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-zod-error
        type: expect.preview
        at: { afterAction: expect-two-lines }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-2 }
        textContains: "Uncaught ZodError:"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-zod-error-level
        type: expect.preview
        at: { afterAction: expect-zod-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-2 }
        attribute: { name: data-level, value: "error" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-zod-error-detail
        type: expect.preview
        at: { afterAction: expect-zod-error-level }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-2 }
        textContains: '"message": "Invalid input: expected number, received string"'
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: safe-parse
    narration: >
      [[mark:board-result]] ဒီလို program ရပ်မသွားစေချင်ရင် safe parse ကို သုံးပါတယ်။ [[mark:draw-ok]]
      safe parse က error ကို throw မလုပ်ဘဲ ရလဒ် object တစ်ခု ပြန်ပေးပါတယ်။ data မှန်ရင် success က true
      ဖြစ်ပြီး data ပါလာပါတယ်။ [[mark:draw-bad]] မှားရင်တော့ success က false ဖြစ်ပြီး error ပါလာပါတယ်။
      [[mark:draw-union]] ဒါက lesson ၁၁ က discriminated union ပါ။ success ဆိုတဲ့ property နဲ့
      ခွဲခြားလို့ ရတဲ့အတွက်၊ success ကို စစ်လိုက်တာနဲ့ TypeScript က ရလဒ်ကို narrow လုပ်ပေးပါတယ်။
      [[mark:close-board-b]] code ထဲမှာ ရေးကြည့်ရအောင်။ [[mark:type-safe-parse]] safe parse ရဲ့ ရလဒ်ကို
      စစ်ပါမယ်။ မှားနေရင် error ကို ထုတ်ပြပြီး နောက် အော်ဒါကို ဆက်သွားပါမယ်။ parse သုံးထားတဲ့ line
      ကိုတော့ comment လုပ်လိုက်ပါမယ်။ [[mark:select-success]] success မဖြစ်တဲ့ ဒီ branch ထဲမှာ ရလဒ်ထဲမှာ
      error ပါလာပြီး၊ [[mark:select-prettify]] Zod ရဲ့ prettify error function က အဲဒီ error ကို လူ
      ဖတ်လို့ ရတဲ့ စာသား ပြောင်းပေးပါတယ်။ [[mark:select-data]] if ရဲ့ အောက်ကို ရောက်ရင်တော့ success
      ဖြစ်တာ သေချာလို့ data ကို ယူသုံးလို့ ရပါတယ်။ [[mark:read-pretty]] ဒီတစ်ခါ program မရပ်ဘဲ အော်ဒါ
      လေးခုလုံးကို စစ်ပြီးသွားပါပြီ။ Output မှာ ဒုတိယ အော်ဒါက cups မှာ number လိုချင်ပေမယ့် string
      ရောက်လာတယ်လို့၊ တတိယ အော်ဒါက sugar မှာ ဒီ သုံးမျိုးထဲက တစ်ခု ဖြစ်ရမယ်လို့ ရှင်းရှင်းလင်းလင်း
      ပြနေပါတယ်။ ဒါပေမဲ့ သုည ခွက်ကတော့ number ဖြစ်နေလို့ စစ်ဆေးချက်ကို ကျော်ပြီး ticket ထွက်သွားပါတယ်။
    sources:
      - {
          title: "Zod: Basic usage (safeParse returns a discriminated union)",
          url: "https://zod.dev/basics",
        }
      - {
          title: "Zod: Formatting errors (z.prettifyError)",
          url: "https://zod.dev/error-formatting",
        }
      - {
          title: "TypeScript Handbook: Narrowing (discriminated unions)",
          url: "https://www.typescriptlang.org/docs/handbook/2/narrowing.html#discriminated-unions",
        }
    actions:
      - id: open-board-b
        type: whiteboard.apply
        at: { mark: board-result }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-ok
        type: whiteboard.apply
        at: { mark: draw-ok }
        upsertIds: [b-ok-box, b-ok-1, b-ok-2]
        drawMs: 2200
      - id: draw-bad
        type: whiteboard.apply
        at: { mark: draw-bad }
        upsertIds: [b-bad-box, b-bad-1, b-bad-2]
        drawMs: 2200
      - id: draw-union
        type: whiteboard.apply
        at: { mark: draw-union }
        upsertIds: [b-union, b-parse]
        drawMs: 2400
      - id: close-board-b
        type: whiteboard.apply
        at: { mark: close-board-b }
        open: false
      - id: type-safe-parse
        type: editor.type
        at: { mark: type-safe-parse, offsetMs: 300 }
        target: { file: src/main.ts, after: "for (const text of inbox) {\n  ", occurrence: 1 }
        text: "const result = OrderSchema.safeParse(JSON.parse(text));\n  if (!result.success) {\n    console.log(z.prettifyError(result.error));\n    continue;\n  }\n  const order = result.data;\n  // "
        cadence: block
      - id: select-success
        type: editor.select
        at: { mark: select-success }
        target: { file: src/main.ts, text: "if (!result.success) {", occurrence: 1 }
      - id: select-prettify
        type: editor.select
        at: { mark: select-prettify }
        target: { file: src/main.ts, text: "z.prettifyError(result.error)", occurrence: 1 }
      - id: select-data
        type: editor.select
        at: { mark: select-data }
        target: { file: src/main.ts, text: "const order = result.data;", occurrence: 1 }
      - id: expect-four-again
        type: expect.preview
        at: { mark: read-pretty }
        timeoutMs: 8000
        target: { by: testId, value: ts-output }
        attribute: { name: data-count, value: "4" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-pretty-cups
        type: expect.preview
        at: { afterAction: expect-four-again }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-2 }
        textContains: "✖ Invalid input: expected number, received string\n  → at cups"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-pretty-sugar
        type: expect.preview
        at: { afterAction: expect-pretty-cups }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-3 }
        textContains: "✖ Invalid option: expected one of \"less\"|\"normal\"|\"extra\"\n  → at sugar"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-zero-passes
        type: expect.preview
        at: { afterAction: expect-pretty-sugar }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-4 }
        textContains: "0 ခွက် ကော်ဖီ · သကြား less"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-safe-clean
        type: expect.preview
        at: { afterAction: expect-zero-passes }
        timeoutMs: 5000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: refine
    chapter: "Schema ကို ပိုတိကျအောင်"
    narration: >
      [[mark:select-cups]] schema မှာ cups ကို number လို့ပဲ ပြောထားပါတယ်။ number က သုည၊ အနုတ်ကိန်း၊ ဒဿမ
      ဂဏန်းတွေကိုပါ လက်ခံပါတယ်။ Zod မှာတော့ schema ကို ဆက်ပြီး ကန့်သတ်လို့ ရပါတယ်။
      [[mark:type-int-positive]] cups မှာ int နဲ့ positive ကို ဆက်ရေးလိုက်ပါမယ်။ ဒါဆို ကိန်းပြည့်
      ဖြစ်ရမယ်၊ သုညထက် ကြီးရမယ် ဆိုတဲ့ စည်းကမ်း နှစ်ခု ထပ်ပါသွားပါတယ်။ [[mark:read-too-small]] Output
      ရဲ့ နောက်ဆုံးမှာ သုည ခွက် အော်ဒါကိုလည်း သုညထက် ကြီးရမယ်လို့ ပြပြီး ငြင်းလိုက်ပါပြီ။ ဒီ
      စည်းကမ်းတွေက run ချိန်မှာ စစ်တာ ဖြစ်လို့၊ type ကတော့ number အတိုင်းပဲ ကျန်နေပါတယ်။
    sources:
      - {
          title: "Zod: Defining schemas (numbers: int, positive)",
          url: "https://zod.dev/api#numbers",
        }
      - {
          title: "Total TypeScript: Zod tutorial (complex schema validation)",
          url: "https://www.totaltypescript.com/tutorials/zod/zod-section/validations",
        }
    actions:
      - id: select-cups
        type: editor.select
        at: { mark: select-cups }
        target: { file: src/main.ts, text: "cups: z.number()", occurrence: 1 }
      - id: type-int-positive
        type: editor.type
        at: { mark: type-int-positive }
        target: { file: src/main.ts, after: "cups: z.number()", occurrence: 1 }
        text: ".int().positive()"
        cadence: fast-explainer
      - id: expect-too-small
        type: expect.preview
        at: { afterAction: type-int-positive }
        timeoutMs: 8000
        target: { by: testId, value: ts-out-4 }
        textContains: "✖ Too small: expected number to be >0\n  → at cups"
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: infer
    chapter: "Schema ကနေ type ထုတ်ယူခြင်း"
    narration: >
      [[mark:select-old-type]] အခု ကိုယ့် code ထဲမှာ အော်ဒါရဲ့ ပုံစံက နှစ်နေရာမှာ ရှိနေပါတယ်။ ကိုယ်တိုင်
      ရေးထားတဲ့ type နဲ့ Zod schema ပါ။ တစ်ခုကို ပြင်ပြီး ကျန်တစ်ခုကို မေ့သွားရင် နှစ်ခု
      မကိုက်တော့ပါဘူး။ lesson ၂၁ မှာ ပြောခဲ့သလို အတူတူ ပြောင်းရမယ့် type တွေကို တစ်နေရာကနေ ထုတ်ယူတာ
      ပိုကောင်းပါတယ်။ [[mark:type-infer]] ဒါကြောင့် type ကို schema ကနေ ထုတ်ယူပါမယ်။ type of နဲ့ schema
      ရဲ့ type ကို ယူပြီး၊ Zod ရဲ့ infer နဲ့ schema က စစ်ပြီး ပြန်ပေးမယ့် data ရဲ့ type ကို ထုတ်ယူတာပါ။
      ကိုယ်တိုင် ရေးထားတဲ့ type ကိုတော့ comment လုပ်လိုက်ပါမယ်။ [[mark:read-infer]] Types အပိုင်းမှာ
      item ကို string လို့၊ cups ကို number လို့၊ sugar ကို စကားလုံး သုံးလုံးရဲ့ union လို့ ပြတဲ့ type
      ပေါ်လာပါပြီ။ ကိုယ်တိုင် ရေးခဲ့တဲ့ type နဲ့ အတူတူပဲ ဖြစ်လို့ ticket function ကလည်း error မရှိဘဲ ဆက်
      အလုပ်လုပ်ပါတယ်။ [[mark:type-note]] ဒီ အချိန်ကစပြီး ပုံစံ ပြောင်းချင်ရင် schema ကိုပဲ
      ပြင်ရပါတော့မယ်။ ဥပမာအားဖြင့် မပါလည်း ရတဲ့ မှတ်ချက်ကို optional နဲ့ ထည့်ကြည့်ပါမယ်။
      [[mark:read-note]] Types မှာ မပါလည်း ရတဲ့ note property ချက်ချင်း ပေါ်လာပါပြီ။ schema တစ်ခုတည်းကနေ
      run ချိန် စစ်ဆေးချက်ရော၊ TypeScript type ရော နှစ်ခုလုံး ရတာပါ။
    sources:
      - { title: "Zod: Basic usage (inferring types)", url: "https://zod.dev/basics" }
      - {
          title: "Total TypeScript: Zod tutorial (extract a type from a parser object)",
          url: "https://www.totaltypescript.com/tutorials/zod/zod-section/infer",
        }
      - {
          title: "Total TypeScript: Zod tutorial (make schemas optional)",
          url: "https://www.totaltypescript.com/tutorials/zod/zod-section/optional",
        }
      - {
          title: "Total TypeScript Essentials, ch. 10: Deriving Types",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/deriving-types",
        }
    actions:
      - id: select-old-type
        type: editor.select
        at: { mark: select-old-type }
        target:
          {
            file: src/main.ts,
            text: 'type Order = { item: string; cups: number; sugar: "less" | "normal" | "extra" };',
            occurrence: 1,
          }
      - id: type-infer
        type: editor.type
        at: { mark: type-infer, offsetMs: 300 }
        target: { file: src/main.ts, after: "});\n\n", occurrence: 1 }
        text: "type Order = z.infer<typeof OrderSchema>;\n//   ^?\n// "
        cadence: block
      - id: expect-inferred
        type: expect.preview
        at: { afterAction: type-infer }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        textContains: 'sugar: "less" | "normal" | "extra";'
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-inferred-clean
        type: expect.preview
        at: { afterAction: expect-inferred }
        timeoutMs: 5000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-note
        type: editor.type
        at: { mark: type-note }
        target:
          {
            file: src/main.ts,
            after: "  sugar: z.enum([\"less\", \"normal\", \"extra\"]),\n",
            occurrence: 1,
          }
        text: "  note: z.string().optional(),\n"
        cadence: fast-explainer
      - id: expect-note
        type: expect.preview
        at: { afterAction: type-note }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        textContains: "note?: string | undefined;"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-note-output
        type: expect.preview
        at: { afterAction: expect-note }
        timeoutMs: 5000
        target: { by: testId, value: ts-output }
        attribute: { name: data-count, value: "4" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: recap
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ TypeScript ရဲ့ type တွေက run ချိန်မှာ မရှိတော့လို့၊ အပြင်က ဝင်လာတဲ့ data
      ကို annotation တစ်ခုနဲ့ စစ်လို့ မရပါဘူး။ [[mark:recap-schema]] Zod schema ကတော့ run ချိန်မှာ
      data ကို တကယ် စစ်ပေးပါတယ်။ parse က မှားရင် throw လုပ်ပြီး၊ safe parse ကတော့ success နဲ့
      ခွဲလို့ ရတဲ့ ရလဒ်ကို ပြန်ပေးပါတယ်။ [[mark:recap-infer]] type ကိုလည်း Zod ရဲ့ infer နဲ့ schema
      ကနေ ထုတ်ယူတာ ဖြစ်လို့၊ ပုံစံကို နေရာ တစ်ခုတည်းမှာပဲ ထိန်းထားရပါတယ်။ [[mark:recap-next]] နောက်
      lesson မှာတော့ React component တွေကို TypeScript နဲ့ ဘယ်လို ရေးမလဲ ဆိုတာ ကြည့်သွားပါမယ်။
    sources:
      - { title: "Zod: Intro", url: "https://zod.dev/" }
      - {
          title: "Total TypeScript: React with TypeScript tutorial",
          url: "https://www.totaltypescript.com/tutorials/react-with-typescript",
        }
    actions:
      - id: select-recap-schema
        type: editor.select
        at: { mark: recap-schema }
        target:
          { file: src/main.ts, text: "OrderSchema.safeParse(JSON.parse(text))", occurrence: 1 }
      - id: select-recap-infer
        type: editor.select
        at: { mark: recap-infer }
        target: { file: src/main.ts, text: "z.infer<typeof OrderSchema>", occurrence: 1 }
      - id: expect-file-schema
        type: expect.file
        at: { mark: recap-next }
        path: src/main.ts
        contains: "const OrderSchema = z.object({\n  item: z.string(),\n  cups: z.number().int().positive(),\n  sugar: z.enum([\"less\", \"normal\", \"extra\"]),\n  note: z.string().optional(),\n});"
      - id: expect-file-infer
        type: expect.file
        at: { afterAction: expect-file-schema }
        path: src/main.ts
        contains: "type Order = z.infer<typeof OrderSchema>;"
      - id: expect-file-safe-parse
        type: expect.file
        at: { afterAction: expect-file-infer }
        path: src/main.ts
        contains: "  const result = OrderSchema.safeParse(JSON.parse(text));\n  if (!result.success) {\n    console.log(z.prettifyError(result.error));\n    continue;\n  }\n  const order = result.data;"
checks:
  - type: timing.p95Ms
    max: 300
