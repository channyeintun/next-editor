runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "Run ချိန်မှာ type မရှိတော့ဘူး"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ type predicate နဲ့ assertion function ကို ကိုယ်တိုင်
      ရေးခဲ့ပြီး၊ အထဲက စစ်ဆေးချက် မပြည့်စုံရင်တောင် TypeScript က ကိုယ့် ကတိကို ယုံလိုက်တာကို
      မြင်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ အပြင်ကနေ ဝင်လာတဲ့ data ကို Zod ဆိုတဲ့ library နဲ့ run နေတဲ့
      အချိန်မှာ ဘယ်လို စစ်မလဲ ဆိုတာ ကြည့်သွားပါမယ်။ [[mark:draw-ts]] ပထမဆုံး သိထားရမှာက၊ type တွေဟာ
      TypeScript က code ကို စစ်နေတဲ့ အချိန်မှာပဲ ရှိတယ် ဆိုတာပါ။ [[mark:draw-run]] JavaScript အဖြစ်
      ပြောင်းလိုက်တာနဲ့ type တွေ အကုန် ပျောက်သွားလို့၊ program run နေတဲ့ အချိန်မှာ Order ဆိုတဲ့ type က
      ဘယ်နေရာမှာမှ မရှိတော့ပါဘူး။ [[mark:draw-outside]] ဒါကြောင့် ဖောင်ကနေ ဝင်လာတဲ့ တန်ဖိုး၊ API ကနေ
      ပြန်လာတဲ့ data တွေ၊ JSON parse လုပ်ထားတဲ့ စာသား စတာတွေကို type annotation ပေးထားရုံနဲ့ စစ်ပြီးသား
      မဖြစ်ပါဘူး။ TypeScript က ကိုယ့် annotation ကို ယုံလိုက်တာပဲ ရှိပါတယ်။ [[mark:draw-zod]] Zod
      မှာတော့ data ရဲ့ ပုံစံကို schema လို့ ခေါ်တဲ့ JavaScript တန်ဖိုး တစ်ခုနဲ့ ရေးပါတယ်။ schema က
      တန်ဖိုး ဖြစ်လို့ run နေတဲ့ အချိန်မှာလည်း ရှိနေပြီး၊ data ကို တကယ် စစ်ပေးနိုင်ပါတယ်။
      [[mark:draw-infer]] ပြီးတော့ အဲဒီ schema ကနေ TypeScript type ကိုပါ ထုတ်ယူလို့ ရတဲ့အတွက်၊ ပုံစံကို
      နေရာ တစ်ခုတည်းမှာပဲ ရေးဖို့ လိုပါတယ်။
    sources:
      - {
          title: "Total TypeScript: Zod tutorial",
          url: "https://www.totaltypescript.com/tutorials/zod",
        }
      - { title: "Zod: Intro", url: "https://zod.dev/" }
      - {
          title: "TypeScript Handbook: The Basics (erased types)",
          url: "https://www.typescriptlang.org/docs/handbook/2/basic-types.html#erased-types",
        }
    actions:
      - id: open-board-a
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-ts
        type: whiteboard.apply
        at: { mark: draw-ts }
        upsertIds: [a-ts-box, a-ts-name, a-ts-sub]
        drawMs: 2000
      - id: draw-run
        type: whiteboard.apply
        at: { mark: draw-run }
        upsertIds: [a-arrow, a-js-box, a-js-name, a-js-sub]
        drawMs: 2600
      - id: draw-outside
        type: whiteboard.apply
        at: { mark: draw-outside }
        upsertIds: [a-outside]
        drawMs: 2000
      - id: draw-zod
        type: whiteboard.apply
        at: { mark: draw-zod }
        upsertIds: [a-zod]
        drawMs: 2000
      - id: draw-infer
        type: whiteboard.apply
        at: { mark: draw-infer }
        upsertIds: [a-infer]
        drawMs: 1600

  - id: starter
    narration: >
      [[mark:close-board]] ဒီနေ့ code ကို ကြည့်ရအောင်။ [[mark:open-inbox]] ဒါက QR code app ကနေ
      စာသားအနေနဲ့ ဝင်လာတဲ့ အော်ဒါ လေးခုပါ။ [[mark:select-good]] ပထမ တစ်ခုက လက်ဖက်ရည် နှစ်ခွက်၊ သကြား
      နည်းနည်းနဲ့ မှန်မှန်ကန်ကန် ဝင်လာပါတယ်။ [[mark:select-text-cups]] ဒုတိယ တစ်ခုမှာတော့ ခွက်
      အရေအတွက်ကို ဂဏန်း မဟုတ်ဘဲ စာလုံးနဲ့ ရေးထားပါတယ်။ [[mark:select-none]] တတိယ တစ်ခုမှာ ဆိုင်မှာ
      မရှိတဲ့ သကြား အဆင့် ပါလာပြီး၊ [[mark:select-zero]] နောက်ဆုံး တစ်ခုကတော့ သုည ခွက် မှာထားပါတယ်။
      [[mark:open-main]] main ဖိုင်မှာ Zod ကို import လုပ်ထားပြီးသား ဖြစ်ပါတယ်။ [[mark:select-type]]
      အော်ဒါ တစ်ခုရဲ့ type ကို ကိုယ်တိုင် ရေးထားပြီး၊ [[mark:select-ticket]] ticket function က
      မီးဖိုချောင်အတွက် စာကြောင်း တစ်ကြောင်း ထုတ်ပေးပါတယ်။ [[mark:select-parse]] loop ထဲမှာတော့ အော်ဒါ
      စာသားကို JSON parse နဲ့ object ပြောင်းပြီး၊ Order type ကို annotation အနေနဲ့ ပေးထားပါတယ်။
    sources:
      - {
          title: "MDN: JSON.parse()",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/JSON/parse",
        }
      - {
          title: "Total TypeScript: Zod tutorial (verify unknown APIs with an object schema)",
          url: "https://www.totaltypescript.com/tutorials/zod/zod-section/object",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: open-inbox
        type: workspace.openFile
        at: { mark: open-inbox }
        path: src/inbox.ts
      - id: select-good
        type: editor.select
        at: { mark: select-good }
        target:
          {
            file: src/inbox.ts,
            text: '''{"item":"လက်ဖက်ရည်","cups":2,"sugar":"less"}''',
            occurrence: 1,
          }
      - id: select-text-cups
        type: editor.select
        at: { mark: select-text-cups }
        target: { file: src/inbox.ts, text: '"cups":"two"', occurrence: 1 }
      - id: select-none
        type: editor.select
        at: { mark: select-none }
        target: { file: src/inbox.ts, text: '"sugar":"none"', occurrence: 1 }
      - id: select-zero
        type: editor.select
        at: { mark: select-zero }
        target: { file: src/inbox.ts, text: '"cups":0', occurrence: 1 }
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: src/main.ts
      - id: select-type
        type: editor.select
        at: { mark: select-type }
        target:
          {
            file: src/main.ts,
            text: 'type Order = { item: string; cups: number; sugar: "less" | "normal" | "extra" };',
            occurrence: 1,
          }
      - id: select-ticket
        type: editor.select
        at: { mark: select-ticket }
        target:
          {
            file: src/main.ts,
            text: "  return `${order.cups} ခွက် ${order.item} · သကြား ${order.sugar}`;",
            occurrence: 1,
          }
      - id: select-parse
        type: editor.select
        at: { mark: select-parse }
        target:
          { file: src/main.ts, text: "  const order: Order = JSON.parse(text);", occurrence: 1 }

  - id: symptoms
    narration: >
      [[mark:panel-ready]] panel ကို ကြည့်ရအောင်။ Errors အပိုင်းမှာ error တစ်ခုမှ မရှိဘဲ၊ Output မှာ
      ticket လေးခုလုံး ထွက်လာပါတယ်။ ဒါပေမဲ့ ပထမ တစ်ခုပဲ မှန်ပါတယ်။ ဒုတိယ ticket မှာ ခွက် အရေအတွက်
      နေရာမှာ စာလုံး ပေါ်နေပြီး၊ တတိယမှာ ဆိုင်မှာ မရှိတဲ့ သကြား အဆင့် ပါနေပါတယ်။ စတုတ္ထမှာတော့ သုည ခွက်
      ဖြစ်နေပါတယ်။ JSON parse က any type ကို ပြန်ပေးလို့၊ Order လို့ annotation ပေးလိုက်တာကို TypeScript
      က ဘာမှ မစစ်ဘဲ လက်ခံလိုက်တာပါ။ [[mark:read-js]] အောက်ဆုံးက JavaScript output ကို ကြည့်ပါ။ Order
      type ရော annotation ရော မရှိတော့ပါဘူး။ run နေတဲ့ အချိန်မှာ ဒီ data ကို စစ်ပေးမယ့် code
      တစ်ကြောင်းမှ မရှိတာ မြင်ရပါတယ်။
    sources:
      - {
          title: "TypeScript Handbook: The Basics (erased types)",
          url: "https://www.typescriptlang.org/docs/handbook/2/basic-types.html#erased-types",
        }
      - {
          title: "Total TypeScript Essentials, ch. 4: Essential Types and Annotations (JSON.parse returns any)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/essential-types-and-annotations",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-no-errors
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-four-lines
        type: expect.preview
        at: { afterAction: expect-no-errors }
        timeoutMs: 5000
        target: { by: testId, value: ts-output }
