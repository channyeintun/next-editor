      - id: expect-text-cups
        type: expect.preview
        at: { afterAction: expect-four-lines }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-2 }
        textContains: "two ခွက် ကော်ဖီ · သကြား normal"
