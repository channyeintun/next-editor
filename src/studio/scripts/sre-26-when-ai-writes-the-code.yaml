  - id: recap
    narration: >
      [[mark:close-p06]] [[mark:open-notes]] agent တွေ ရောက်လာတဲ့ လမှာ သုံးခဲ့တဲ့ စကားလုံးတွေပါ။ [[mark:sel-wall]] production နံရံက code ဘယ်လောက် မြန်မြန် ရေးရေး production ထဲ ဘေးကင်းကင်း ဝင်ရတာ မလွယ်လာဘူး ဆိုတာပါ။ [[mark:sel-rollback]] rollback သန့်သန့် လုပ်လို့ရရင် rollback အရင် လုပ်ပြီး၊ မရရင်တော့ flag နောက်မှာ ၅ ရာခိုင်နှုန်းကစ canary နဲ့ roll forward လုပ်ပါတယ်။
      [[mark:sel-drift]] coherence drift က အပိုင်းလိုက် မှန်နေပေမဲ့ system တစ်ခုလုံးရဲ့ design မညီညွတ်တော့တာပါ။ [[mark:sel-fee-spec]] fee spec က ပို့ခ တွက်ပုံကို လူရော agent ပါ ဖတ်ဖို့ တစ်နေရာတည်းမှာ ရေးထားတာ ဖြစ်ပြီး၊ [[mark:sel-change-record]] change record က ပြောင်းလဲမှု တိုင်းရဲ့ task၊ အကြောင်းပြချက်နဲ့ run ခဲ့တဲ့ test တွေပါ။
      [[mark:ask-question]] agent တွေကြောင့် ကိုယ့်အဖွဲ့ရဲ့ merge တွေ နှစ်ဆ ဖြစ်လာပြီး တခြား ဘာမှ မပြောင်းရင် incident တွေ ဘာဖြစ်လာမယ်လို့ ထင်လဲ?
      [[mark:pause-question]] incident တွေလည်း နှစ်ဆလောက် များလာမှာပါ၊ အဲဒီထက် နည်းဖို့ကတော့ ရှားပါတယ်။ AI က code ရေးရုံ မကဘဲ feature တစ်ခုလည်း ဖြစ်လာပါတယ်။ မြန်မာလို ဖြေပေးတဲ့ AI support assistant၊ Ask Padauk က chat တွေရဲ့ ၉၉.၉ ရာခိုင်နှုန်းမှာ success code ပြန်ပေးပေမဲ့ refund ticket တွေကို မှားတဲ့ transaction တွေအတွက် ဖွင့်နေပါတယ်။ success code ပြန်လာရုံနဲ့ ဘယ်တော့ မလုံလောက်တော့လဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "DORA: State of AI-assisted Software Development 2025",
          url: "https://dora.dev/research/2025/dora-report/",
        }
      - {
          title: "AI in SRE: How Google is Engineering the Future of Reliable Operations (sre.google)",
          url: "https://sre.google/resources/practices-and-processes/ai-engineering-reliable-operations/",
        }
    actions:
      - { id: close-p06, type: slide.close, at: { mark: close-p06 } }
      - {
          id: open-notes,
          type: workspace.openFile,
          at: { mark: open-notes, offsetMs: 300 },
          path: notes.md,
        }
      - {
          id: sel-wall,
          type: editor.select,
          at: { mark: sel-wall },
          target: { file: notes.md, text: "production နံရံ", occurrence: 1 },
        }
      - {
          id: sel-rollback,
          type: editor.select,
          at: { mark: sel-rollback },
          target: { file: notes.md, text: "rollback အရင်", occurrence: 1 },
        }
      - {
          id: sel-drift,
          type: editor.select,
          at: { mark: sel-drift },
          target: { file: notes.md, text: "coherence drift", occurrence: 1 },
        }
      - {
          id: sel-fee-spec,
          type: editor.select,
          at: { mark: sel-fee-spec },
          target: { file: notes.md, text: "fee spec", occurrence: 1 },
        }
      - {
          id: sel-change-record,
          type: editor.select,
          at: { mark: sel-change-record },
          target: { file: notes.md, text: "change record", occurrence: 1 },
        }
      # The voice script's ⟪select မေးခွန်း⟫ and ⟪pause 3s⟫, the way the Module 1
      # reviewers fixed the pause. ⟪select မေးခွန်း⟫ (ask-question) already starts
      # the question's own dialog, but a select right there would drag under the
      # question and leave no pause, and one at pause-question would drag under
      # the answer's first words (the scheduler holds only the dialog after its
      # anchor's). So the question-line select hangs off ask-question with an
      # offset: it starts about as the question ends, its drag runs in silence,
      # and the answer at pause-question waits for it. The question is 117
      # characters, so 8200 leaves about 3.0 / 1.2 / 0.5 s of quiet before the
      # answer at 55 / 70 / 95 ms per char (at 95 the drag runs under the
      # question's last words, as in lessons 2 and 7); 8300 trips
      # compile-check's 2.5 s inserted-silence warning at 55.
      - id: select-question
        type: editor.select
        at: { mark: ask-question, offsetMs: 8200 }
        target:
          file: notes.md
          text: "မေးခွန်း: agent တွေကြောင့် merge 2 ဆ ဖြစ်လာတယ်။ တခြား ဘာမှ မပြောင်းရင် incident တွေ ဘာဖြစ်မလဲ?"
          occurrence: 1

checks:
  # 500, not 300: google-svg deck pages stall the main thread at show/close.
  - { type: timing.p95Ms, max: 500 }
