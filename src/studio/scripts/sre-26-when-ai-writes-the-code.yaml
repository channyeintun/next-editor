  - id: coherence-drift
    chapter: Coherence drift
    narration: >
      [[mark:close-p03c]] [[mark:b3-s1]] helper ထပ်တဲ့ incident တွေကို ကြည့်ရအောင်။ Eats ရဲ့ ပို့ခကို round လုပ်ဖို့ agent တွေက task လေးခုမှာ helper လေးခု ရေးခဲ့ပါတယ်။ [[mark:b3-s1b]] အနီးဆုံး ကျပ် ၅၀ ကို round လုပ်တာ၊ အမြဲ round up လုပ်တာ၊ ကျပ် ၁၀ ကို round လုပ်တာနဲ့ ဘာမှ round မလုပ်တာပါ။ တစ်ခုချင်း ကြည့်ရင် မှန်နေလို့ review မှာလည်း အောင်ခဲ့ပါတယ်။
      [[mark:b3-s2]] ဒါပေမဲ့ ငွေဖြတ်တဲ့ code နဲ့ refund code က မတူတဲ့ helper တွေကို သုံးနေလို့ refund တွေက ဖြတ်ခဲ့တဲ့ ငွေနဲ့ မကိုက်တော့ပါဘူး။ နောက်ပိုင်း rounding ကို ပြင်ခိုင်းတဲ့ agent ကလည်း helper မှားကို သွားပြင်ပါတယ်။ agent တစ်ခုချင်းက ဖိုင် နည်းနည်းကိုပဲ မြင်လို့ ကိုယ့်အပိုင်းမှာ မှန်နေပေမဲ့ system တစ်ခုလုံးရဲ့ design ကတော့ တဖြည်းဖြည်း မညီညွတ်တော့ပါဘူး။ ဒါကို coherence drift လို့ ခေါ်ပါတယ်။
      [[mark:b3-s3]] အဖြေကတော့ design စည်းမျဉ်းတွေကို လူရော agent ပါ ဖတ်ရအောင် စာနဲ့ ချရေးထားတာပါ။ platform အဖွဲ့က ပို့ခ တွက်ပုံကို fee spec အဖြစ် ရေးပြီး ငွေတွက်တဲ့ code ကို money module တစ်ခုတည်းထဲ စုပါတယ်။ agent တွေ အလုပ်မစခင် ဖတ်ရတဲ့ agent instruction file မှာလည်း ဒီ module ကိုပဲ သုံးဖို့ ရေးထားပြီး၊ module အပြင်မှာ round လုပ်ရင် lint rule က တားပါတယ်။
      [[mark:b3-s4]] agent က helper မှားကို ဘာလို့ ပြင်ခဲ့လဲ၊ လစာထုတ်ရက် ညက retry ကို ဘာလို့ ထည့်ခဲ့လဲ ဆိုတာ ဘယ်သူမှ မသိခဲ့ပါဘူး၊ agent ရဲ့ အကြောင်းပြချက်ကို နောက်မှ မမြင်ရလို့ပါ။ ဒါကြောင့် အခု agent ပြောင်းလဲမှု တိုင်းမှာ ဘယ် task အတွက်လဲ၊ ဘာကြောင့်လဲ၊ ဘယ် test တွေ run ခဲ့လဲ ဆိုတာကို change record အဖြစ် မှတ်ပါတယ်။
      [[mark:b3-s5]] metric ထည့်ရတာ လွယ်လာတော့ metric တွေမှာလည်း ဒီ drift ဖြစ်ပြီး incident တစ်ခုမှာ top-up အောင်မြင်နှုန်း သုံးမျိုး မတူဘဲ ပြနေခဲ့ပါတယ်။ အခုတော့ journey တစ်ခုစီမှာ owner ရှိတဲ့ service level indicator၊ SLI တစ်ခုတည်းပဲ ထားပါတယ်။
    sources:
