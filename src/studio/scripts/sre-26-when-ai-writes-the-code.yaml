build:
  # Studio swaps in the Burmese voice chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 2626

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: hook
    chapter: Agent တွေ ရောက်လာတဲ့လ
    narration: >
      [[mark:show-p01]] Padauk ရဲ့ platform အဖွဲ့က အခု golden path၊ shared gateway client နဲ့ exception စာရင်းကို ထိန်းနေပါပြီ။ ဒီလမှာတော့ code ကို ကိုယ်တိုင် ရေး၊ ပြင်၊ test လုပ်ပေးတဲ့ coding agent တွေကို အဖွဲ့တိုင်းက စသုံးလာကြပါတယ်။
      [[mark:hook-split]] engineer ၆၀ လောက် ရှိတဲ့ အဖွဲ့က အရင်အတိုင်း ဖြစ်ပေမဲ့ merge တွေက တစ်ရက်ကို ၁၅ ကနေ ၁၂၀ အထိ ခုန်တက်သွားပါတယ်။ incident တွေလည်း တစ်လကို ၃ ခုကနေ ပထမလမှာပဲ ၁၁ ခု ဖြစ်ပြီး ဆက်တက်နေပါတယ်။ ဒါဆို Site Reliability Engineering၊ SRE အလုပ်မှာ ဘာတွေ ပြောင်းသွားမလဲ?
      [[mark:show-map]] Module ၆ မှာ AI က reliability loop ရဲ့ အဆင့်တိုင်းကို ရောက်လာပါတယ်။ code ရေးတာ၊ feature အဖြစ် run တာ၊ operations မှာ ကူတာကို အရင် ကြည့်ပြီး၊ ဘယ်ကုမ္ပဏီမှာမဆို SRE ကို ဘယ်လို စမလဲ၊ ရှေ့ဆက် ဘာလာမလဲ ဆိုတာနဲ့ အဆုံးသတ်ပါမယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "DORA: State of AI-assisted Software Development 2025",
          url: "https://dora.dev/research/2025/dora-report/",
        }
      - {
          title: "AI in SRE: How Google is Engineering the Future of Reliable Operations (sre.google)",
          url: "https://sre.google/resources/practices-and-processes/ai-engineering-reliable-operations/",
        }
    actions:
      # -1750 / -1450, not the skeleton's -1900 / -1600: a pull-back over 1780 ms pushes the
      # first dialog past the 2 s opening handle, which src/studio/plans/index.test.ts rejects.
      - { id: collapse-dock, type: runtime.collapseDock, at: { scene: start, offsetMs: -1750 } }
      - {
          id: show-p01,
          type: slide.show,
          at: { mark: show-p01, offsetMs: -1450 },
          slideId: l26-p01,
        }
      # Module 6 opens: the module map advances in place from the cover.
      - { id: show-map, type: slide.show, at: { mark: show-map }, slideId: m6-map }

  - id: code-is-cheap
    chapter: Code ဈေးပေါလာပြီ
    narration: >
      [[mark:show-p02]] lesson ၁ မှာ software ဆောက်ရတာ ခဏပဲ ကြာပြီး run ရတာက နှစ်နဲ့ချီ ကြာတယ်လို့ ပြောခဲ့ပါတယ်။ agent တွေက ဆောက်တဲ့ အပိုင်းကိုပဲ တိုစေလို့ code ရေးတာ လတိုင်း ဈေးပေါလာပေမဲ့ ကုန်ကျစရိတ်က ပျောက်မသွားဘဲ တခြား နေရာကို ရွေ့သွားတာပါ။
      ဘေးကင်းကင်း run ရတာက အရင်လိုပဲ ခက်ပြီး code ကို နားလည်ရတာကတော့ ပိုခက်လာပါတယ်။ ဥပမာ agent ရေးပြီး review မှာ ခဏပဲ ကြည့်ခဲ့တဲ့ code တစ်ခု ညဘက် ပျက်တော့ on-call ကျနေတဲ့သူက အဲဒီ code ကို ပထမဆုံး အကြိမ် ဖတ်ရပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "AI in SRE: How Google is Engineering the Future of Reliable Operations (sre.google)",
          url: "https://sre.google/resources/practices-and-processes/ai-engineering-reliable-operations/",
        }
      - {
          title: "DORA: State of AI-assisted Software Development 2025",
          url: "https://dora.dev/research/2025/dora-report/",
        }
    actions:
      - { id: show-p02, type: slide.show, at: { mark: show-p02 }, slideId: l26-p02 }

  - id: production-wall
    chapter: Production နံရံ
    narration: >
      [[mark:close-p02]] [[mark:b1-s1]] ပြောင်းလဲမှု တစ်ခုက design၊ code ရေးပြီး test၊ deploy ဆိုတဲ့ အဆင့်တွေ ဖြတ်ပြီးမှ user ဆီ ရောက်ပြီး အကြာကြီး run ရပါတယ်။ ဘယ်လောက် စိတ်ချရဖို့ လိုလဲ ဆိုတာကို design မှာကတည်းက ဆုံးဖြတ်ရလို့ SRE က run တဲ့ အဆင့်ကျမှ မဟုတ်ဘဲ design ကတည်းက ပါရပါမယ်။
      [[mark:b1-s2]] agent တွေ ရောက်လာတော့ အဆင့် တစ်ခုမှ မပျောက်ပါဘူး။ အဆင့်တိုင်း တိုသွားပြီး build နဲ့ test လည်း ပေါင်းသွားတော့ code တွေ အဆပေါင်းများစွာ ပိုထွက်လာပါတယ်။ [[mark:b1-s2b]] ဒါပေမဲ့ deploy ရှေ့က ဒီ အနီရောင် နံရံကို ကျော်ရတာကတော့ မလွယ်လာပါဘူး။ ဟိုဘက်မှာ user အစစ်တွေနဲ့ Bank X ကို ပေးထားတဲ့ ကတိတွေ ရှိလို့ ဘယ်သူ ရေးတဲ့ code ပဲ ဖြစ်ဖြစ် အမှားရဲ့ ဒဏ်က အတူတူပါပဲ။ ဒါကို production နံရံလို့ ခေါ်ပါမယ်။
      [[mark:b1-s3]] code တစ်ကြောင်း ပြောင်းရုံနဲ့ reliability က ဘယ်အဆင့်မှာမဆို ပျက်နိုင်လို့ အဆင့်တိုင်းမှာ အလုပ် လုပ်ရပါတယ်။ ဒါပေမဲ့ အဆင့်တွေ တိုလာတော့ အမှားကို သတိထားမိပြီး ပြင်ဖို့ အချိန်က နည်းသွားပါတယ်။
      [[mark:b1-split]] မြန်မြန် release လုပ်တော့ user တွေ feature ကို ကြိုက်လား ချက်ချင်း သိရပေမဲ့ reliability ပြဿနာကတော့ ကိုယ့်ဘာသာ ထွက်မပြောပါဘူး။ ဥပမာ timeout မပါတဲ့ call တစ်ခုဟာ test pass ဖြစ်ပေမဲ့ လစာထုတ်ရက် ညကျမှ ပြဿနာ ပေါ်လာတတ်ပါတယ်။ ဒါကြောင့် အလုပ်လုပ်တယ် ဆိုတာနဲ့ စိတ်ချရတယ် ဆိုတာ မတူပါဘူး။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "AI in SRE: How Google is Engineering the Future of Reliable Operations (sre.google)",
          url: "https://sre.google/resources/practices-and-processes/ai-engineering-reliable-operations/",
        }
      - { title: "DORA AI Capabilities Model", url: "https://dora.dev/ai/capabilities-model/" }
    actions:
      - { id: close-p02, type: slide.close, at: { mark: close-p02, offsetMs: -400 } }
      # Step 1: the top lane's four boxes land two and two while the first sentence names them.
      - {
          id: b1-s1,
          type: whiteboard.apply,
          at: { mark: b1-s1 },
          open: true,
          clear: true,
          upsertIds: [l26-b1-r1, l26-b1-t1, l26-b1-a1, l26-b1-r2, l26-b1-t2],
          drawMs: 1600,
        }
      - {
          id: b1-s1b,
          type: whiteboard.apply,
          at: { afterAction: b1-s1 },
          upsertIds: [l26-b1-a2, l26-b1-r3, l26-b1-t3, l26-b1-a3, l26-b1-r4, l26-b1-t4],
          drawMs: 1600,
        }
      # Step 2: the "with AI" lane (title, then the narrower boxes two and two).
      - { id: b1-s2, type: whiteboard.apply, at: { mark: b1-s2 }, upsertIds: [l26-b1-lane2] }
      - {
          id: b1-s2-draw,
          type: whiteboard.apply,
          at: { afterAction: b1-s2 },
          upsertIds: [l26-b1-r5, l26-b1-t5, l26-b1-a5, l26-b1-r6, l26-b1-t6],
          drawMs: 1400,
        }
      - {
          id: b1-s2-draw2,
          type: whiteboard.apply,
          at: { afterAction: b1-s2-draw },
          upsertIds: [l26-b1-a6, l26-b1-r7, l26-b1-t7, l26-b1-a7, l26-b1-r8, l26-b1-t8],
          drawMs: 1400,
        }
      # The red wall lands on the sentence that points at it.
      - {
          id: b1-s2b,
          type: whiteboard.apply,
          at: { mark: b1-s2b },
          upsertIds: [l26-b1-wall, l26-b1-wall-t],
          drawMs: 1200,
        }
      - {
          id: b1-s3,
          type: whiteboard.apply,
          at: { mark: b1-s3 },
          upsertIds: [l26-b1-note1, l26-b1-note2],
          drawMs: 1600,
        }

  - id: eleven-incidents
    chapter: Incident 11 ခု
    narration: >
      [[mark:close-b1]] [[mark:b2-s1]] မသီရိက incident ၁၁ ခုကို အကြောင်းရင်းအလိုက် ခွဲကြည့်ပါတယ်။ agent မရောက်ခင် လမှာတော့ config မှားတာ တစ်ခု၊ retry ကြောင့် တစ်ခု၊ database ရဲ့ data ပုံစံ၊ schema ပြောင်းတာကြောင့် တစ်ခု၊ စုစုပေါင်း သုံးခုပဲ ရှိခဲ့ပါတယ်။
      [[mark:b2-s2]] agent ရောက်ပြီးတဲ့ လမှာတော့ config နဲ့ retry က သုံးခုစီ၊ schema က နှစ်ခု ဖြစ်လာပြီး၊ [[mark:b2-s2b]] အလုပ်တူ helper function တွေ ထပ်နေလို့ ဖြစ်တဲ့ အမျိုးအစား အသစ် သုံးခုလည်း ပေါ်လာပါတယ်။
      [[mark:b2-s3]] merge ၁၅ ကနေ ၁၂၀ ဆိုတာ ရှစ်ဆပါ။ တခြား ဘာမှ မပြောင်းဘဲ ပြောင်းလဲမှုပဲ များလာရင် ပြဿနာလည်း အဲဒီနှုန်းနီးပါး များလာတတ်ပြီး အဲဒီထက် နည်းတာ ရှားပါတယ်။ ရိုးရိုး ပြဿနာတွေကို automation က ဖြေရှင်းပေးလေ လူဆီ ရောက်လာတာက ခက်ပြီး ရှားပါးတဲ့ ပြဿနာတွေ ဖြစ်လေပါပဲ။
      [[mark:close-b2]] [[mark:show-p02b]] အဲဒီလို ပြဿနာ တစ်ခုက လစာထုတ်ရက် ညမှာ ရောက်လာပါတယ်။ Bank X ကို ငွေလွှဲတာတွေ timeout ဖြစ်လာတော့ AI assistant က database pool ပြည့်နေလို့ပါ၊ server အားလုံး restart လုပ်ပါလို့ သေချာတဲ့ လေသံနဲ့ အကြံပေးပါတယ်။
      [[mark:p02b-split]] on-call ကျနေတဲ့ ကိုမင်းကတော့ ပြောင်းလဲမှုတွေရဲ့ timeline ကို ကြည့်ပါတယ်။ agent ထည့်ခဲ့တဲ့ retry၊ fraud rule အသစ်နဲ့ Bank X ရဲ့ လစာ batch သုံးခု တစ်ပြိုင်တည်း ဆုံနေတာ တွေ့တော့ retry ကို deploy ပြန်မလုပ်ဘဲ ဖွင့်ပိတ်လို့ရတဲ့ ခလုတ်၊ feature flag နဲ့ ပိတ်လိုက်ပါတယ်။
      [[mark:show-p02c]] assistant က ဒီလို ပေါင်းစပ်မှုမျိုးကို တစ်ခါမှ မမြင်ဖူးခဲ့ပါဘူး၊ ဒါပေမဲ့ သေချာသလို ပြောခဲ့ပြီး မှားသွားတာပါ။ ပြီးတော့ ဘာဖြစ်ခဲ့လဲ ဆိုတာ Bank X နဲ့ ကိုနေလင်းကို ရှင်းပြပြီး တာဝန်ယူရမှာကလည်း လူပါ။ ဒါကြောင့် incident တွေမှာ လူ ဆက်ရှိနေရပါမယ်။
    sources:
