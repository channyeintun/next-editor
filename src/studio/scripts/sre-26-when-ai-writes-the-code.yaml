  - id: roll-forward
    chapter: Rollback လား roll forward လား
    narration: >
      [[mark:show-p03]] အဲဒီလမှာပဲ Top-up မှာ SMS တစ်စောင်ကို နှစ်ခါ ပို့နေတဲ့ bug ပေါ်လာပါတယ်။ ပုံမှန်ဆို အရင် ကောင်းခဲ့တဲ့ version ကို ပြန်ပြောင်းတဲ့ rollback လုပ်ရုံပါ။ ဒါပေမဲ့ အဲဒီ deploy က schema ကိုပါ ပြောင်းထားလို့ version ဟောင်းက data အသစ်ကို မဖတ်နိုင်တော့ပါဘူး။
      [[mark:p03-split]] ဒီတော့ ပြင်ထားတဲ့ version ကို ရှေ့ဆက် တင်တဲ့ roll forward ကို ရွေးပြီး fix ကို flag နောက်မှာ ထားပါတယ်။ user ၅ ရာခိုင်နှုန်းဆီ အရင် ဖွင့်ပြီး version ဟောင်းနဲ့ နှိုင်းယှဉ်ကြည့်တဲ့ canary မှာ ကောင်းနေမှ ဆက်ဖွင့်ပါတယ်။
      [[mark:show-p03b]] ပြောင်းလဲမှုတွေက လူ လိုက်ကြည့်နိုင်တာထက် ပိုမြန်မြန် ရောက်လာရင် ပြန်သွားစရာ သန့်တဲ့ version မရှိတော့လို့ roll forward က rollback နေရာကို မကြာခဏ ယူလာမယ်လို့ မျှော်လင့်ရပါတယ်။ ဒါပေမဲ့ rollback သန့်သန့် လုပ်လို့ရရင်တော့ lesson ၁၀ မှာလိုပဲ rollback အရင်ပါ။
      ပြင်ရတာ ဈေးပေါလာလို့ ကာကွယ်တဲ့ အလုပ်ကို ခေါင်းဆောင်တွေ ငွေ မစိုက်တော့ရင်တော့ မှားပါမယ်၊ မြန်မြန် ပြန်ကောင်းတာက အကြောင်းရင်းကို ပြင်တာကို အစားမထိုးပါဘူး။
      [[mark:show-p03c]] တစ်နေကုန် deploy လုပ်နေတော့ ဘယ် version run နေလဲ ဆိုတာ အဖြေ တစ်ခုတည်း မရှိတော့သလို staging ကလည်း production နဲ့ မတူတော့ပါဘူး။ အဲဒီအတွက် Padauk က request တိုင်းမှာ ဘယ် build၊ ဘယ် flag တွေ၊ app ဘယ် version နဲ့ run ခဲ့လဲ မှတ်ထားပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "AI in SRE: How Google is Engineering the Future of Reliable Operations (sre.google)",
          url: "https://sre.google/resources/practices-and-processes/ai-engineering-reliable-operations/",
        }
