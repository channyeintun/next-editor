# SRE from zero, lesson 26: When AI writes the code (Burmese concept lesson).
#
# Built from the approved voice script
# docs/sre-course/voice-scripts/sre-26-when-ai-writes-the-code.md. Every
# spoken character is that script's "> " lines, unchanged; each ⟪…⟫ marker
# became a [[mark:…]] at the same place. Check it with:
#   bun ~/Documents/sre-course/work/check-narration.ts \
#     docs/sre-course/voice-scripts/sre-26-when-ai-writes-the-code.md \
#     src/studio/scripts/sre-26-when-ai-writes-the-code.yaml
#
# Nothing runs: deck pages and the whiteboard carry the lesson, and notes.md is
# the recap. The workspace and runtime follow the validated no-code skeleton
# (WebContainer, empty init command, a harmless dev script).
#
# The arc: the month the coding agents arrived (cover), and Module 6 opens on
# the whole loop (m6_map). Page: code is cheap, so what isn't. Board B1 (P6
# lanes): the four phases, the narrower "with AI" lane and the red production
# wall before deploy, then the orange "one changed line" caveat. Board B2 (P5
# bars): the 11 incidents by cause before and after the agents, and "trouble
# grows with changes". Pages: payday night (the assistant against the
# timeline), why people stay in incidents; roll back or roll forward, when
# changes come too fast, which version is live. Board B3 (P2 fan-in): four
# rounding helpers comb into "refund ≠ charge", then the fee spec, the change
# record and one SLI per journey. Pages: what changes and what doesn't, blurred
# team edges, keeping the skill, where SRE work moves, this week; recap on
# notes.md.
#
# Nine marks add no spoken text and sit at an existing ။ or ၊:
# hook-split, b1-split, p02b-split, p03-split and p05-split split dialogs of
# 461-463 characters at their paragraph breaks (one dialog would pass the
# 450-character limit; no action uses them); b1-s2b lands B1's red wall on the
# sentence that points at it ("ဒီ အနီရောင် နံရံ"), b2-s2b lands B2's
# "helper ထပ်" bar after "ဖြစ်လာပြီး၊" as the new cause is named, and b3-s1b
# lands the last two helper boxes as the narration lists the four helpers, so
# no apply adds more than three labelled boxes (the four-box lanes of B1 land
# two and two through afterAction chains, as in Module 1). ask-question is the
# voice script's ⟪select မေးခွန်း⟫ and pause-question its ⟪pause 3s⟫ (see
# select-question). No page or board step holds longer than ~35 s at
# 70 ms/char (the cover, then l26_p02b, l26_p03 and l26_p05 at ~34 s), so no
# pacing page was added beyond the voice script's own.
#
# ⟪close board⟫ straight into the next board (scene 4) wipes B1 400 ms early
# (whiteboard.apply clear) instead of closing the panel, as in lesson 8, so the
# editor does not flash between two boards; B2 then draws with open: true,
# clear: true as usual. A board followed by a deck page closes the panel
# (open: false) 400 ms before the page, as in Module 1.
#
# Boards. Colour jobs: #1e1e1e ink (paints white) for arrows, the bus, the
# axis, the bar names and the "with AI" lane title; blue the thing named (the
# phases today, the "before agents" series, the four helpers, the change
# record and the one SLI); violet the second series (the "with AI" lane, the
# "after agents" bars); red failure or limit (the production wall, refunds that
# don't match); green the fix (fee spec + money module + agent instruction
# file); orange the caveat (one changed line, trouble grows with changes). A
# label on two lines is two text assets, one per line, so each line meets the
# 0.55 em width rule on its own. B1's orange caveat sits under both lanes, not
# between them: the wall spans the gap between the lanes, and the 37-code-point
# second line (570 px) would cross it there.
#
# Deck pages: deck "Next Editor · SRE 6A · AI", published; the /pub URL below
# is final. The deck holds only the kit pages until this lesson's pages are
# built from the page plan, so until then the Director reports page "l26_p01"
# missing from the published deck. m6_map lights all five stations; the kit
# has no Ops Buddy icon, so the page plan carries that as a note. Page plan:
# ~/Documents/sre-course/work/pages/sre-26-when-ai-writes-the-code.json
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/sre-26-when-ai-writes-the-code.yaml
#   bun scripts/studio-compile-check.ts src/studio/scripts/sre-26-when-ai-writes-the-code.yaml
