    actions:
      - { id: show-p05, type: slide.show, at: { mark: show-p05 }, slideId: l26-p05 }

  - id: this-week
    narration: >
      [[mark:show-p06]] agent တွေနဲ့ အလုပ်လုပ်တဲ့ အဖွဲ့ သေးသေးလေးမှာ ဒီအပတ် လုပ်ကြည့်ဖို့ သုံးခုပါ။ agent တွေ ဖတ်ရမယ့် design စည်းမျဉ်းတွေကို စာနဲ့ ချရေးပါ။ ငွေတွက်တာ၊ retry လို risk များတဲ့ ပြောင်းလဲမှု တစ်ခုကို feature flag နောက်မှာ ထားပါ။ ပြီးတော့ AI assistant ပိတ်ပြီး incident တစ်ခုကို လေ့ကျင့်ကြည့်ပါ။
    sources:
