  - id: what-changes
    chapter: ပြောင်းတာနဲ့ မပြောင်းတာ
    narration: >
      [[mark:close-b3]] [[mark:show-p04]] ဒီလကို ပြန်ကြည့်ရင် အဆင့်တစ်ခုစီရဲ့ ကြာချိန်နဲ့ code ရေးတဲ့သူ ပြောင်းသွားပေမဲ့ ပြောင်းလဲမှု တစ်ခုစီမှာ ပါတဲ့ bug နဲ့ deploy မှားရင် ပေးရတဲ့ တန်ဖိုးကတော့ မပြောင်းပါဘူး။ အဖွဲ့ နယ်နိမိတ် မပီပြင်တော့ပေမဲ့ system တစ်ခုလုံးကို မြင်နေတဲ့သူ လိုတာလည်း မပြောင်းပါဘူး။
      [[mark:show-p04b]] အရင်က Eats ရဲ့ ပြောင်းလဲမှုက Wallet code ကို ထိရင် Wallet အဖွဲ့က review လုပ်ရပါတယ်။ အခုတော့ engineer တစ်ယောက်နဲ့ agent တစ်ခုက နှစ်ဖက်လုံးကို တစ်ခါတည်း ပြင်နိုင်လို့ အဲဒီ စစ်ဆေးမှုကို ကျော်သွားနိုင်ပါတယ်။ ဒါကြောင့် ledger ကို ထိရင် Wallet review ဆက်လိုမယ်လို့ Padauk က တမင် ဆုံးဖြတ်ပါတယ်။
      [[mark:show-p04c]] မသုံးဖြစ်တဲ့ ကျွမ်းကျင်မှုကလည်း တဖြည်းဖြည်း ပျောက်တတ်လို့ Padauk က လစဉ် incident role-play ကို AI assistant ပိတ်ပြီး လုပ်ပါတယ်။ အများအားဖြင့် မှန်တဲ့ tool က ရှားပါးတဲ့ ပြဿနာမှာ အားအနည်းဆုံး ဖြစ်တတ်လို့ ဒီညလည်း မှန်မယ်လို့ မယူဆဘဲ ကိုမင်းလိုပဲ tool ရဲ့ အကြံကို ခလုတ် မနှိပ်ခင် စစ်ကြည့်ပါ။
    sources:
