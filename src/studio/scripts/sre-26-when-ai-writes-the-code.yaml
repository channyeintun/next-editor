      notes.md: |
        # AI က code ရေးတဲ့ခေတ်

        - production နံရံ — code ဘယ်လောက် မြန်မြန် ရေးရေး production ထဲ ဘေးကင်းကင်း ဝင်ရတာ မလွယ်လာ
        - rollback အရင်၊ roll forward ဘေးကင်းကင်း — rollback သန့်ရင် rollback၊ မသန့်ရင် flag နောက်မှာ 5% ကစ canary နဲ့
        - coherence drift — အပိုင်းလိုက် မှန်ပေမဲ့ system တစ်ခုလုံးရဲ့ design မညီညွတ်တော့
        - fee spec — ပို့ခ တွက်ပုံကို လူရော agent ပါ ဖတ်ဖို့ တစ်နေရာတည်းမှာ ရေး
        - change record — ပြောင်းလဲမှုတိုင်းရဲ့ task၊ အကြောင်းပြချက်၊ run ခဲ့တဲ့ test

        မေးခွန်း: agent တွေကြောင့် merge 2 ဆ ဖြစ်လာတယ်။ တခြား ဘာမှ မပြောင်းရင် incident တွေ ဘာဖြစ်မလဲ?
