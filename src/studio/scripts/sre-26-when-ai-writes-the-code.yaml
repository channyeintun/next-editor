  - id: where-sre-moves
    chapter: SRE အလုပ် ဘယ်ကို ရွေ့မလဲ
    narration: >
      [[mark:show-p05]] ဒါဆို SRE အလုပ်က ဘယ်ကို ရွေ့မလဲ? deploy မတိုင်ခင် spec နဲ့ guardrail ရေးတာ၊ ပြောင်းလဲမှုတွေကို သေးသေးလေး ခွဲပြီး flag နဲ့ canary နောက်က ထုတ်တာဘက်ကို ပိုရွေ့လာဖွယ် ရှိပါတယ်။ agent တွေက လစာထုတ်ရက်၊ သင်္ကြန်လို Padauk ရဲ့ လက်တွေ့ ကမ္ဘာကို နည်းနည်းပဲ သိသေးလို့ system တစ်ခုလုံးကို မြင်နေတဲ့သူလည်း ဆက်လိုပါမယ်။
      [[mark:p05-split]] production ကို run ရတာကတော့ ဆက်ခက်နေဦးမှာပါ။ SRE တွေ tool အများကြီး ပိုလိုလာပေမဲ့ အများစုကို ကိုယ့်ဘာသာ လုပ်ခွင့် ပေးလောက်အောင် မယုံရသေးလို့ ဦးဆောင်တာက လူပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "AI in SRE: How Google is Engineering the Future of Reliable Operations (sre.google)",
          url: "https://sre.google/resources/practices-and-processes/ai-engineering-reliable-operations/",
        }
