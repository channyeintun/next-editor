        <!doctype html>
        <html lang="my">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <link rel="icon" href="data:," />
            <title>AI course</title>
          </head>
          <body>
            <div id="app" data-testid="app"></div>
            <script type="module" src="/course/modules-transformers.js"></script>
            <script type="module" src="/course/panel.js" data-run="src/main.js" data-console="off"></script>
          </body>
        </html>
      package.json: |
        {
          "name": "ai-course-tea-shop",
          "private": true,
          "version": "1.0.0",
          "type": "module",
          "scripts": {
            "dev": "vite --host 0.0.0.0 --port 5173 --strictPort"
          },
          "devDependencies": {
            "esbuild": "0.21.5",
            "vite": "5.4.21"
          }
        }
      src/main.js: |
        import { pipeline } from "@huggingface/transformers";
        import { panel } from "ai-panel";
        import data from "../data/reviews.json";

        // The reviews that visitors wrote in English (this small model reads English only).
        const reviews = data.reviews.filter((r) => r.lang === "en" && r.type !== "question").map((r) => r.text);

        // What a customer types into the review search, in their own words.
        const questions = [
          "Is it crowded on the weekend?",
        ];

        // A small embedding model: it turns each sentence into 384 numbers.
        const embed = await pipeline("feature-extraction", "Xenova/all-MiniLM-L6-v2", { dtype: "q8", device: "wasm" });
        const toVectors = async (texts) => (await embed(texts, { pooling: "mean", normalize: true })).tolist();

        const reviewVectors = await toVectors(reviews);
        const similarity = (a, b) => a.reduce((sum, x, i) => sum + x * b[i], 0);

        for (const [i, question] of questions.entries()) {
          const [q] = await toVectors([question]);
          const closest = reviews
            .map((review, j) => ({ review, similarity: similarity(q, reviewVectors[j]) }))
            .sort((a, b) => b.similarity - a.similarity)
            .slice(0, 3);
          panel.table(question, closest, { id: `closest-${i + 1}` });
        }
      vite.config.js: |
        import { defineConfig } from "vite";
        import courseRunner from "./course/runner.js";

        export default defineConfig({
          plugins: [courseRunner()],
        });
