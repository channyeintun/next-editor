build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 5114
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "Built-in AI မလုံလောက်ရင်"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ Chrome ရဲ့ built in AI ကို API ခေါ်ရုံနဲ့ သုံးလို့
      ရပေမယ့်၊ ဒီ preview ထဲမှာ သုံးခွင့် မရတာ၊ ဖုန်းတွေမှာ မရသေးတာ၊ မြန်မာစာကို support မလုပ်သေးတာ
      စတဲ့ ကန့်သတ်ချက်တွေ ရှိတာကို တွေ့ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ အဲဒီလို မလုံလောက်တဲ့အခါ ကိုယ်တိုင်
      ရွေးထားတဲ့ model ကို browser ထဲမှာ run ပေးတဲ့ client side library တွေနဲ့၊ သူတို့ အောက်က runtime
      တွေကို ကြည့်ပါမယ်။ [[mark:draw-mini]] blueprint မှာဆိုရင် ဒီနေ့ ကြည့်မှာက Solution ထဲက
      intelligence အလွှာပါ။ [[mark:draw-today]] model ကို server ပေါ်မှာ မဟုတ်ဘဲ customer ရဲ့
      browser ထဲမှာ ကိုယ်တိုင် run ရင် ဘာတွေ လိုလဲ ဆိုတာ ကြည့်မှာမို့လို့ပါ။
    sources:
      - {
          title: "web.dev Learn AI: The client-side AI stack",
          url: "https://web.dev/learn/ai/client-side",
        }
      - {
          title: "web.dev Learn AI: Introduction to AI on the web (the blueprint)",
          url: "https://web.dev/learn/ai/introduction",
        }
      - {
          title: "web.dev Learn AI: Welcome to Learn AI! (course credit: written by Dr. Janna Lipenkova with editorial guidance from Alexandra Klepper; text CC BY 4.0, code Apache 2.0; adapted into Burmese with the course's own tea-shop examples)",
          url: "https://web.dev/learn/ai/welcome",
        }
      - {
          title: "Creative Commons: Attribution 4.0 International (CC BY 4.0), the licence of the web.dev Learn AI text adapted here",
          url: "https://creativecommons.org/licenses/by/4.0/",
        }
    actions:
      - {
          id: open-board-a,
          type: whiteboard.apply,
          at: { scene: start, offsetMs: -450 },
          open: true,
          clear: true,
          upsertIds: [a-title],
        }
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - {
          id: draw-mini,
          type: whiteboard.apply,
          at: { mark: draw-mini },
          upsertIds:
            [
              a-opp,
              a-opp-t,
              a-arrow-1,
              a-data,
              a-data-t,
              a-intel,
              a-intel-t,
              a-ux,
              a-ux-t,
              a-arrow-2,
              a-gov,
              a-gov-t,
            ],
          drawMs: 2400,
        }
      - {
          id: draw-today,
          type: whiteboard.apply,
          at: { mark: draw-today },
          upsertIds: [a-today],
          drawMs: 1000,
        }

  - id: libraries
    narration: >
      [[mark:draw-libs]] built in AI မှာ model ကို browser က ပေးထားပေမယ့်၊ library နဲ့ဆိုရင် model
      ကို ကိုယ်တိုင် ရွေးပြီး ကိုယ့် website နဲ့ တွဲပို့ရပါတယ်။ ဒါကြောင့် ရွေးစရာ model ပိုများသလို၊
      library တချို့မှာ train လုပ်တာ၊ fine tune လုပ်တာအထိ ရပါတယ်။ [[mark:draw-tjs]] Transformers.js
      နဲ့ဆိုရင် open model တွေ အများဆုံး တင်ထားတဲ့ Hugging Face Hub က model တွေကို pipeline
      တစ်ခုနဲ့ ခေါ်သုံးလို့ ရပြီး၊ embedding လို စာသား အလုပ်တွေအတွက် ကောင်းပါတယ်။ ဒီနေ့ သုံးမှာ ဒါပါ။
      [[mark:draw-tf]] TensorFlow.js က TensorFlow နဲ့ Keras model တွေကို run ပေးပြီး browser
      ထဲမှာတင် train လုပ်လို့ ရလို့၊ ပုံ၊ အသံ၊ ကိုယ်ပိုင် classifier တွေအတွက် သုံးကြပါတယ်။ Google
      ကတော့ TensorFlow Lite model တွေအတွက် LiteRT.js ကိုလည်း ထုတ်ထားပါတယ်။ [[mark:draw-llm]] WebLLM
      က language model သေးတွေကို browser ထဲမှာ run ပေးလို့၊ chat feature တွေ၊ internet မရှိလည်း
      အလုပ်လုပ်ရမယ့် feature တွေအတွက် ရွေးပါတယ်။ [[mark:draw-mp]] MediaPipe က မျက်နှာ၊ လက် ရှာတာလို
      vision အလုပ်တွေကို ကိုယ်ပိုင် runtime နဲ့ real time run ပေးပြီး၊ LLM inference လည်း ပါပါတယ်။
      [[mark:draw-ort]] ONNX Runtime Web ကတော့ PyTorch လို framework တွေကနေ ONNX ပုံစံ ထုတ်ထားတဲ့
      model မှန်သမျှကို run ပေးပြီး၊ Transformers.js ကိုယ်တိုင်လည်း သူ့ပေါ်မှာ run တာပါ။
    sources:
      - {
          title: "web.dev Learn AI: The client-side AI stack (custom deployments with libraries)",
          url: "https://web.dev/learn/ai/client-side",
        }
      - {
          title: "Transformers.js documentation",
          url: "https://huggingface.co/docs/transformers.js",
        }
      - {
          title: "LiteRT.js (@litertjs/core on npm)",
          url: "https://www.npmjs.com/package/@litertjs/core",
        }
      - { title: "WebLLM", url: "https://webllm.mlc.ai/" }
    actions:
      - {
          id: draw-libs,
          type: whiteboard.apply,
          at: { mark: draw-libs },
          clear: true,
          upsertIds: [b-title],
        }
      - {
          id: draw-tjs,
          type: whiteboard.apply,
          at: { mark: draw-tjs },
          upsertIds: [b-tjs-n, b-tjs-d, b-tjs-u],
          drawMs: 1400,
        }
      - {
          id: draw-tf,
          type: whiteboard.apply,
          at: { mark: draw-tf },
          upsertIds: [b-tf-n, b-tf-d, b-lite],
          drawMs: 1600,
        }
      - {
          id: draw-llm,
          type: whiteboard.apply,
          at: { mark: draw-llm },
          upsertIds: [b-llm-n, b-llm-d],
          drawMs: 1200,
        }
      - {
          id: draw-mp,
          type: whiteboard.apply,
          at: { mark: draw-mp },
          upsertIds: [b-mp-n, b-mp-d],
          drawMs: 1200,
        }
      - {
          id: draw-ort,
          type: whiteboard.apply,
          at: { mark: draw-ort },
          upsertIds: [b-ort-n, b-ort-d],
          drawMs: 1200,
        }

  - id: code
    narration: >
      [[mark:close-libs]] ဒါဆို Transformers.js ကို code ထဲမှာ ကြည့်ရအောင်။ [[mark:open-main]] ဒါက
      ဆိုင် website ရဲ့ review search program ပါ။ [[mark:sel-reviews]] ပထမဆုံး customer တွေ
      အင်္ဂလိပ်လို ရေးထားတဲ့ review တွေကိုပဲ ရွေးယူပါတယ်။ ဒီ review တွေက lesson အတွက် ပြင်ဆင်ထားတဲ့
      နမူနာ data ပါ။ [[mark:sel-question]] ဒါကတော့ customer က search box ထဲမှာ ကိုယ့်စကားနဲ့ကိုယ်
      ရိုက်မယ့် မေးခွန်းပါ။ စနေ တနင်္ဂနွေမှာ ဆိုင်က လူကြပ်လား လို့ မေးထားတာပါ။ [[mark:sel-pipeline]]
      ဒီ line က Transformers.js ဆီကနေ MiniLM ဆိုတဲ့ embedding model သေးသေး တစ်ခုကို တောင်းတာပါ။ ဒီ
      model က စာကြောင်း တစ်ကြောင်းကို ဂဏန်း ၃၈၄ လုံး ပြောင်းပေးပါတယ်။ [[mark:sel-options]] နောက်က
      option နှစ်ခုက model ကို ဘယ်လောက် သေးတဲ့ ပုံစံနဲ့ ယူမလဲ၊ ဘယ် runtime ပေါ်မှာ run မလဲ ဆိုတာပါ။
      [[mark:sel-similarity]] အဓိပ္ပာယ် နီးမနီးကိုတော့ ဂဏန်း နှစ်တန်းကို တစ်လုံးချင်း မြှောက်ပြီး
      ပေါင်းတာနဲ့ တွက်ပါတယ်။ နီးလေ similarity များလေ ဖြစ်ပြီး၊ [[mark:sel-table]] မေးခွန်း တစ်ခုစီအတွက်
      အနီးဆုံး review သုံးခုကို table နဲ့ ပြပါတယ်။ [[mark:panel-ready]] program ကို run လိုက်တာနဲ့
      browser က model ဖိုင်တွေကို Hugging Face Hub ကနေ download လုပ်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: The client-side AI stack (Transformers.js)",
          url: "https://web.dev/learn/ai/client-side",
        }
      - {
          title: "Transformers.js: feature extraction pipeline",
          url: "https://huggingface.co/docs/transformers.js/api/pipelines#module_pipelines.FeatureExtractionPipeline",
        }
      - {
          title: "Xenova/all-MiniLM-L6-v2 on the Hugging Face Hub",
          url: "https://huggingface.co/Xenova/all-MiniLM-L6-v2",
        }
    actions:
      - { id: close-libs, type: whiteboard.apply, at: { mark: close-libs }, open: false }
      - { id: open-main, type: workspace.openFile, at: { mark: open-main }, path: src/main.js }
      - id: sel-reviews
        type: editor.select
        at: { mark: sel-reviews }
        target:
          {
            file: src/main.js,
            text: 'data.reviews.filter((r) => r.lang === "en" && r.type !== "question")',
            occurrence: 1,
          }
      - id: sel-question
        type: editor.select
        at: { mark: sel-question }
        target: { file: src/main.js, text: '"Is it crowded on the weekend?",', occurrence: 1 }
      - id: sel-pipeline
        type: editor.select
        at: { mark: sel-pipeline }
        target:
          {
            file: src/main.js,
            text: 'pipeline("feature-extraction", "Xenova/all-MiniLM-L6-v2"',
            occurrence: 1,
          }
      - id: sel-options
        type: editor.select
        at: { mark: sel-options }
        target: { file: src/main.js, text: '{ dtype: "q8", device: "wasm" }', occurrence: 1 }
      - id: sel-similarity
        type: editor.select
        at: { mark: sel-similarity }
        target:
          { file: src/main.js, text: "a.reduce((sum, x, i) => sum + x * b[i], 0)", occurrence: 1 }
      - id: sel-table
        type: editor.select
        at: { mark: sel-table }
        target:
          {
            file: src/main.js,
            text: "panel.table(question, closest, { id: `closest-${i + 1}` });",
            occurrence: 1,
          }
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-model-card
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 10000
        target: { by: testId, value: ai-model-1 }
        attribute: { name: data-label, value: "Model" }
        retry: { maxAttempts: 3, delayMs: 1000 }

  - id: download
    chapter: "Model download ရဲ့ ကုန်ကျစရိတ်"
    narration: >
      [[mark:read-model]] ညာဘက် AI panel မှာ MODEL card ပေါ်လာပါပြီ။ model နာမည်၊ task၊ dtype နဲ့
      device ကို ပြထားပြီး၊ download ဘယ်လောက် ရောက်ပြီလဲ ဆိုတာကိုလည်း ပြပေးပါတယ်။ ဒီ panel ထဲက
      ရလဒ်တွေက ကြိုမှတ်ထားတာ မဟုတ်ဘဲ၊ ဒီ page ထဲမှာ model အစစ်ကို တကယ် run ပြီး တွက်မှာပါ။
      [[mark:quantize]] dtype ရဲ့ q ၈ ဆိုတာ quantization ပါ။ quantization ဆိုတာ model ကို သေးအောင်
      ဂဏန်းတွေရဲ့ တိကျမှုကို နည်းနည်း လျှော့ပြီး သိမ်းတာပါ။ ဂဏန်း အများစုကို ၃၂ bit အစား ၈ bit နဲ့
      သိမ်းလို့၊ မူရင်း ၉၀ megabyte လောက်ကနေ ၂၄ megabyte လောက်အထိ လေးဆလောက် သေးသွားပါတယ်။
      [[mark:cost]] ဒီ download က တကယ့် website မှာဆိုရင် ဝင်လာတဲ့ user တိုင်း ပေးရမယ့် ကုန်ကျစရိတ်ပါ။
      feature က အဖြေ တစ်ခုမှ မပေးခင် user ရဲ့ ဖုန်း data၊ အချိန်နဲ့ disk နေရာ ကုန်ပြီး၊ internet
      နှေးရင် ပိုကြာပါတယ်။ ဖိုင်တွေကို browser က cache ထဲ သိမ်းထားလို့ နောက်တစ်ခါ လာရင်တော့ ထပ်
      download မလုပ်ရပါဘူး။ [[mark:burmese-size]] မြန်မာစာပါ ဖတ်နိုင်တဲ့ embedding model တွေကတော့
      သေးတဲ့ ဟာတွေတောင် ၁၁၈ megabyte လောက် ရှိလို့ ငါးဆလောက် ပိုကြီးပါတယ်။ ဒါကြောင့် ဒီ lesson မှာ အင်္ဂလိပ် review
      တွေကိုပဲ ရှာထားတာပါ။ [[mark:draw-stack]] library တစ်ခုက browser ထဲမှာ ဘယ်လို အလွှာတွေနဲ့
      အလုပ်လုပ်လဲ board မှာ ကြည့်ရအောင်။ အပေါ်ဆုံးမှာ ကိုယ့် app ရဲ့ code ရှိပြီး၊ သူ့အောက်မှာ model
      ကို pipeline နဲ့ ခေါ်ပေးတဲ့ library ရှိပါတယ်။ [[mark:draw-runtime]] library ရဲ့ အောက်မှာတော့
      runtime ရှိပါတယ်။ runtime ဆိုတာ library ရဲ့ အောက်မှာ hardware ပေါ်မှာ တကယ် တွက်ပေးတဲ့ အလွှာပါ။
      Transformers.js က ONNX Runtime Web ကို သုံးပြီး၊ ဒီ lesson မှာ runtime အဖြစ် CPU ပေါ်မှာ run
      တဲ့ WebAssembly ကို ရွေးထားပါတယ်။ [[mark:draw-hw]] အောက်ဆုံးမှာတော့ CPU၊ GPU၊ NPU လို
      hardware ရှိပါတယ်။ library က ဒီ အလွှာတွေကို ဖုံးထားလို့ ကိုယ်က pipeline တစ်ကြောင်းပဲ ရေးရပေမယ့်၊ ဘယ်
      runtime ပေါ်မှာ run နေလဲ သိထားရင် နှေးတာ၊ memory များတာ လို ပြဿနာတွေကို ပိုမြန်မြန်
      ရှာနိုင်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: The client-side AI stack (runtimes)",
          url: "https://web.dev/learn/ai/client-side",
        }
      - {
          title: "web.dev Learn AI: Design AI user experiences (minimize disruption during the setup)",
          url: "https://web.dev/learn/ai/ux-patterns",
        }
      - {
          title: "Xenova/all-MiniLM-L6-v2: files (model.onnx 90.4 MB, model_quantized.onnx 23.0 MB)",
          url: "https://huggingface.co/Xenova/all-MiniLM-L6-v2/tree/main/onnx",
        }
      - {
          title: "Transformers.js: using quantized models (dtypes)",
          url: "https://huggingface.co/docs/transformers.js/guides/dtypes",
        }
    actions:
      - id: expect-model-q8
        type: expect.preview
        at: { mark: read-model }
        timeoutMs: 5000
        target: { by: testId, value: ai-model-1 }
        textContains: "dtypeq8"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-model-wasm
        type: expect.preview
        at: { afterAction: expect-model-q8 }
        timeoutMs: 5000
        target: { by: testId, value: ai-model-1 }
        textContains: "devicewasm"
        retry: { maxAttempts: 2, delayMs: 300 }
      - {
          id: draw-stack,
          type: whiteboard.apply,
          at: { mark: draw-stack },
          open: true,
          clear: true,
          upsertIds: [c-title, c-app, c-app-t, c-ar1, c-lib, c-lib-t],
          drawMs: 1800,
        }
      - {
          id: draw-runtime,
          type: whiteboard.apply,
          at: { mark: draw-runtime },
          upsertIds: [c-ar2, c-rt, c-rt-t, c-ours],
          drawMs: 1600,
        }
      - {
          id: draw-hw,
          type: whiteboard.apply,
          at: { mark: draw-hw },
          upsertIds: [c-ar3, c-hw, c-hw-t],
          drawMs: 1300,
        }

  - id: search
    chapter: "အဓိပ္ပာယ်နဲ့ ရှာရအောင်"
    narration: >
      [[mark:close-stack]] panel ကို ပြန်ကြည့်ရအောင်။ [[mark:read-closest]] MODEL card မှာ model ရဲ့
      အရွယ်အစား ၂၄ megabyte လောက် download ပြီးသွားပြီး၊ အောက်က table မှာ မေးခွန်းနဲ့ အနီးဆုံး
      review သုံးခုကို similarity အလိုက် စီပြထားပါတယ်။ [[mark:read-match]] ပထမ နှစ်ခုက တနင်္ဂနွေ
      မနက်တွေမှာ လူပြည့်ပြီး နှေးတယ်၊ တနင်္ဂနွေမှာ မိနစ် ၄၀ စောင့်ရတယ် ဆိုတဲ့ review တွေပါ။
      မေးခွန်းထဲက အဓိက စကားလုံးတွေ review ထဲမှာ မပါပေမယ့် အဓိပ္ပာယ် နီးလို့ ရှာတွေ့တာ ဖြစ်ပြီး၊ ဒါက
      ပထမ lesson မှာ ပြောခဲ့တဲ့ semantic search ပါ။ [[mark:read-third]] တတိယ review ကတော့ ဖာလူဒါ
      အကြောင်းပါ။ similarity သိသိသာသာ နိမ့်ပြီး မေးခွန်းနဲ့ မဆိုင်တာမို့၊ တကယ့် search မှာ similarity
      နိမ့်တဲ့ ရလဒ်တွေကို ဖြတ်ထုတ်ရပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: The client-side AI stack",
          url: "https://web.dev/learn/ai/client-side",
        }
      - {
          title: "web.dev Learn AI: Introduction to AI on the web (semantic search)",
          url: "https://web.dev/learn/ai/introduction",
        }
    actions:
      - { id: close-stack, type: whiteboard.apply, at: { mark: close-stack }, open: false }
      - id: wait-model
        type: expect.preview
        at: { mark: read-closest }
        timeoutMs: 120000
        target: { by: testId, value: ai-model-1 }
        attribute: { name: data-status, value: "ready" }
        retry: { maxAttempts: 3, delayMs: 45000 }
      - id: expect-done
        type: expect.preview
        at: { afterAction: wait-model }
        timeoutMs: 60000
        target: { by: testId, value: ai-status }
        attribute: { name: data-state, value: "done" }
        retry: { maxAttempts: 3, delayMs: 25000 }
      - id: expect-size
        type: expect.preview
        at: { afterAction: expect-done }
        timeoutMs: 5000
        target: { by: testId, value: ai-model-1 }
        textContains: "23.7 MB downloaded"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-two-cards
        type: expect.preview
        at: { afterAction: expect-size }
        timeoutMs: 5000
        target: { by: testId, value: ai-cards }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-closest-1
        type: expect.preview
        at: { mark: read-match }
        timeoutMs: 5000
        target: { by: testId, value: ai-closest-1-1 }
        textContains: "packed and slow"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-closest-2
        type: expect.preview
        at: { afterAction: expect-closest-1 }
        timeoutMs: 5000
        target: { by: testId, value: ai-closest-1-2 }
        textContains: "forty minutes on Sunday"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-closest-3
        type: expect.preview
        at: { mark: read-third }
        timeoutMs: 5000
        target: { by: testId, value: ai-closest-1-3 }
        textContains: "falooda"
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: second
    narration: >
      [[mark:type-question]] မေးခွန်း နောက်တစ်ခု ထည့်ကြည့်ရအောင်။ သောက်စရာက ချိုလွန်းလား လို့
      မေးပါမယ်။ [[mark:read-second]] ဒုတိယ table ပေါ်လာပြီး၊ သံပုရာရည် ချိုလွန်းတယ် ဆိုတဲ့ review က
      ထိပ်ဆုံးမှာ ရှိပါတယ်။ ဒီတစ်ခါ model ကို ထပ် download မလုပ်ရပါဘူး။ program က edit တိုင်း အစကနေ
      ပြန် run ပေမယ့်၊ model က page ရဲ့ memory ထဲမှာ ရှိနေပြီးသား ဖြစ်လို့ ပြန်သုံးလိုက်တာပါ။
      [[mark:read-device]] MODEL card ရဲ့ device မှာ wasm လို့ ပြထားတာကတော့ WebAssembly ကို
      ဆိုလိုတာပါ။
    sources:
      - {
          title: "web.dev Learn AI: The client-side AI stack",
          url: "https://web.dev/learn/ai/client-side",
        }
      - {
          title: "Transformers.js: running models on WebGPU or WebAssembly (device)",
          url: "https://huggingface.co/docs/transformers.js/guides/webgpu",
        }
    actions:
      - id: type-question
        type: editor.type
        at: { mark: type-question }
        target:
          { file: src/main.js, after: "  \"Is it crowded on the weekend?\",\n", occurrence: 1 }
        text: "  \"Is the drink too sugary?\",\n"
        cadence: line-by-line
      - id: expect-second
        type: expect.preview
        at: { afterAction: type-question }
        timeoutMs: 8000
        target: { by: testId, value: ai-closest-2-1 }
        textContains: "too sweet"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-three-cards
        type: expect.preview
        at: { afterAction: expect-second }
        timeoutMs: 5000
        target: { by: testId, value: ai-cards }
        attribute: { name: data-count, value: "3" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-reused
        type: expect.preview
        at: { afterAction: expect-three-cards }
        timeoutMs: 5000
        target: { by: testId, value: ai-model-1 }
        attribute: { name: data-status, value: "ready" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: sel-device
        type: editor.select
        at: { mark: read-device }
        target: { file: src/main.js, text: 'device: "wasm"', occurrence: 1 }

  - id: runtimes
    chapter: "Runtime သုံးမျိုး"
    narration: >
      [[mark:draw-runtimes]] browser ထဲက runtime အဓိက သုံးမျိုးကို နှိုင်းယှဉ်ကြည့်ရအောင်။
      [[mark:draw-wasm]] WebAssembly ဆိုတာ CPU ပေါ်မှာ မြန်မြန် run တဲ့ code ပုံစံ ဖြစ်ပြီး browser
      တိုင်းမှာ ရပါတယ်။ ဂဏန်း အများကြီးကို တစ်ပြိုင်နက် တွက်တဲ့ SIMD ကို သုံးနိုင်ပြီး၊ ခွင့်ရတဲ့
      page မှာ thread တွေပါ သုံးနိုင်လို့ embedding၊ classifier လို model သေးတွေအတွက် ကောင်းပါတယ်။
      တခြား runtime မရတဲ့အခါမှာလည်း fallback အဖြစ် အမြဲ အလုပ်လုပ်ပါတယ်။ [[mark:draw-webgpu]] WebGPU ကတော့ browser ကနေ GPU ကို ခိုင်းလို့ ရတဲ့ API
      ပါ။ model ကြီးတွေ၊ LLM တွေကို အများကြီး ပိုမြန်မြန် run နိုင်ပြီး WebLLM ဆိုရင် မဖြစ်မနေ
      လိုပါတယ်။ browser အများစုမှာ ရလာပေမယ့် platform တိုင်းမှာ မရသေးလို့ WebAssembly fallback ကို
      ထားရပါမယ်။ [[mark:draw-webnn]] WebNN ကတော့ GPU၊ NPU လို accelerator တွေကို ရွေးသုံးပေးမယ့် API
      ဖြစ်ပေမယ့်၊ Chrome မှာ site တွေကို အချိန် ကန့်သတ်ပြီး စမ်းသုံးခွင့် ပေးတဲ့ origin trial
      အဆင့်ပဲ ရှိသေးလို့ စမ်းသပ်ဆဲပါ။ [[mark:draw-why]] runtime ပေါ် မူတည်ပြီး မြန်နှုန်း၊ memory၊
      ဂဏန်း တိကျမှုနဲ့ ရတဲ့ device တွေ ကွာပါတယ်။ similarity ဂဏန်းရဲ့ နောက်ဆုံး ဒဿမ နေရာတွေတောင်
      runtime မတူရင် နည်းနည်း ကွာနိုင်ပါတယ်။ ဒီ lesson မှာ WebAssembly
      ကို ပုံသေ ရွေးထားတာက ဘယ် စက်မှာမဆို အလုပ်လုပ်အောင်ပါ။
    sources:
      - {
          title: "web.dev Learn AI: The client-side AI stack (runtimes: WebAssembly, WebGPU, WebNN)",
          url: "https://web.dev/learn/ai/client-side",
        }
      - { title: "WebAssembly", url: "https://webassembly.org/" }
      - {
          title: "Chrome for Developers: WebGPU overview",
          url: "https://developer.chrome.com/docs/web-platform/webgpu/overview",
        }
      - {
          title: "web.dev: WebGPU is now supported in major browsers",
          url: "https://web.dev/blog/webgpu-supported-major-browsers",
        }
      - {
          title: "Chrome for Developers: WebNN origin trial",
          url: "https://developer.chrome.com/origintrials/#/trials/active",
        }
    actions:
      - {
          id: draw-runtimes,
          type: whiteboard.apply,
          at: { mark: draw-runtimes },
          open: true,
          clear: true,
          upsertIds: [d-title],
        }
      - {
          id: draw-wasm,
          type: whiteboard.apply,
          at: { mark: draw-wasm },
          upsertIds: [d-wasm, d-wasm-n, d-wasm-1, d-wasm-2, d-wasm-3],
          drawMs: 1800,
        }
      - {
          id: draw-webgpu,
          type: whiteboard.apply,
          at: { mark: draw-webgpu },
          upsertIds: [d-gpu, d-gpu-n, d-gpu-1, d-gpu-2, d-gpu-3],
          drawMs: 1800,
        }
      - {
          id: draw-webnn,
          type: whiteboard.apply,
          at: { mark: draw-webnn },
          upsertIds: [d-nn, d-nn-n, d-nn-1, d-nn-2],
          drawMs: 1500,
        }
      - {
          id: draw-why,
          type: whiteboard.apply,
          at: { mark: draw-why },
          upsertIds: [d-why, d-ours],
          drawMs: 1400,
        }

  - id: takeaway
    narration: >
      [[mark:draw-choose]] ဒါဆို built in AI နဲ့ library ကို ဘယ်အချိန် ရွေးမလဲ။ built in AI က API
      ခေါ်ရုံပဲ ဖြစ်လို့ အလုပ် သေးသေး တစ်ခုကို အမြန် စမ်းပြီး ထည့်ချင်ရင် ကောင်းပါတယ်။
      [[mark:draw-lib-side]] library ကတော့ model ကို ကိုယ်တိုင် ရွေးပြီး ပို့ရလို့ ပိုရှုပ်ပေမယ့်
      ကိုယ်က ထိန်းချုပ်နိုင်ပါတယ်။ ဒီ review search လို embedding အလုပ်အတွက် built in API မရှိလို့
      library ကို သုံးရတာပါ။ [[mark:draw-change]] app ကြီးလာပြီး လိုအပ်ချက် ပြောင်းရင်တော့ stack
      ကိုလည်း ပြန်ရွေးလို့ ရပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: The client-side AI stack (your takeaways)",
          url: "https://web.dev/learn/ai/client-side",
        }
      - {
          title: "Chrome for Developers: Built-in AI APIs",
          url: "https://developer.chrome.com/docs/ai/built-in-apis",
        }
    actions:
      - {
          id: draw-choose,
          type: whiteboard.apply,
          at: { mark: draw-choose },
          clear: true,
          upsertIds: [e-title, e-bi, e-bi-n, e-bi-1, e-bi-2],
          drawMs: 1800,
        }
      - {
          id: draw-lib-side,
          type: whiteboard.apply,
          at: { mark: draw-lib-side },
          upsertIds: [e-lib, e-lib-n, e-lib-1, e-lib-2],
          drawMs: 1600,
        }
      - {
          id: draw-change,
          type: whiteboard.apply,
          at: { mark: draw-change },
          upsertIds: [e-change],
          drawMs: 1000,
        }

  - id: quiz
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ ဆိုင်ရဲ့ review search ကို browser တိုင်း၊ device
      တိုင်းမှာ အလုပ်လုပ်စေချင်ရင်၊ ဘယ် runtime ကို fallback အဖြစ် ထားရမလဲ။ lesson ကို pause
      လုပ်ပြီး စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] အဖြေကတော့ WebAssembly ပါ။ ဘာကြောင့်လဲဆိုတော့ CPU
      ပေါ်မှာ run တာမို့ browser တိုင်း၊ device တိုင်းမှာ ရလို့ပါ။ WebGPU က ပိုမြန်ပေမယ့်
      နေရာတိုင်းမှာ မရသေးပြီး၊ WebNN ကတော့ စမ်းသပ်ဆဲပဲ ရှိပါသေးတယ်။
    sources:
      - {
          title: "web.dev Learn AI: The client-side AI stack (Check your understanding)",
          url: "https://web.dev/learn/ai/client-side",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          clear: true,
          upsertIds: [z-title, z-q1, z-q2],
          drawMs: 1500,
        }
      - {
          id: draw-quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [z-a, z-a-note],
          drawMs: 1600,
        }

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ built in AI မလုံလောက်တဲ့အခါ Transformers.js လို client
      side library နဲ့ model ကို ကိုယ်တိုင် ရွေးပြီး browser ထဲမှာ run နိုင်ပါတယ်။
      [[mark:sel-final-pipeline]] model download က user တိုင်း ပေးရတဲ့ ကုန်ကျစရိတ်မို့ quantization
      နဲ့ model ကို သေးအောင် ထားပြီး၊ download ပြီးရင် page ထဲမှာ ပြန်သုံးပါတယ်။
      [[mark:sel-final-device]] library အောက်မှာ WebAssembly၊ WebGPU၊ WebNN ဆိုတဲ့ runtime တွေ
      ရှိပြီး၊ WebAssembly က နေရာတိုင်းမှာ ရတဲ့ fallback ပါ။ နောက် lesson မှာတော့ app နဲ့ model
      ကြားက စာချုပ် တစ်ခုလို ဖြစ်တဲ့ prompt ရဲ့ အစိတ်အပိုင်းတွေကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: The client-side AI stack (your takeaways)",
          url: "https://web.dev/learn/ai/client-side",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: recap }, open: false }
      - id: sel-final-pipeline
        type: editor.select
        at: { mark: sel-final-pipeline }
        target:
          {
            file: src/main.js,
            text: 'await pipeline("feature-extraction", "Xenova/all-MiniLM-L6-v2", { dtype: "q8", device: "wasm" });',
            occurrence: 1,
          }
      - id: sel-final-device
        type: editor.select
        at: { mark: sel-final-device }
        target: { file: src/main.js, text: 'device: "wasm"', occurrence: 1 }
      - {
          id: expect-final-questions,
          type: expect.file,
          at: { afterAction: sel-final-device },
          path: src/main.js,
          contains: "  \"Is it crowded on the weekend?\",\n  \"Is the drink too sugary?\",\n];\n",
        }
checks:
  - { type: timing.p95Ms, max: 300 }
