  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ မုန်တိုင်းကျတဲ့ညက AI ရေးခဲ့တဲ့ အဖြေတွေကို ပြန်ဖတ်ကြည့်ရင်
      အားလုံးလိုလို နွေးထွေးပြီး တောင်းပန်စကား ပါပါတယ်။ အဲဒီ လေသံက ဘယ်က လာတာလဲ။
      [[mark:q-a]] ပထမ အဖြေက နေခြည် ရဲ့ ညွှန်ကြားချက်ကနေ လာတာ ဆိုတာပါ။
      [[mark:q-b]] ဒုတိယ အဖြေက model ရဲ့ training ကနေ လာတာ ဆိုတာပါ။ lesson ကို pause လုပ်ပြီး
      စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ အဖြေပါ။ ဘာကြောင့်လဲဆိုတော့ support agent တွေက personal
      account တွေကို သုံးခဲ့တာမို့၊ နေခြည် ဘက်က လေသံအတွက် ညွှန်ကြားချက် တစ်ကြောင်းမှ မရေးခဲ့ဘဲ အဲဒီ လေသံက
      ရှိနေခဲ့လို့ပါ။ model ကို အကူအညီပေးတဲ့ assistant ဖြစ်အောင် train လုပ်တဲ့အခါ ယဉ်ယဉ်ကျေးကျေး ကူညီတတ်တဲ့ ပုံစံကပါ တစ်ပါတည်း ပါလာတာပါ။ လှလှ ရဲ့ ဒုတိယ မေးခွန်းထဲက ဘာကြောင့် ဒီလောက်
      ယဉ်ကျေးလဲ ဆိုတဲ့ အပိုင်းရဲ့ အဖြေလည်း ဒါပါပဲ။
      [[mark:q-rule]] ဒါကြောင့် AI ရဲ့ အပြုအမူ တစ်ခုကို မကြိုက်ရင် ပထမဆုံး မေးရမှာက ဒါ ဘယ်အလွှာက လာလဲ
      ဆိုတာပါ။ training ကနေ လာတဲ့ ပုံမှန် အပြုအမူကိုတော့ system prompt ထဲမှာ နေခြည် လိုချင်တဲ့ ပုံစံကို ရေးပြီး
      ချိန်ညှိလို့ ရပါတယ်။ ဒါပေမဲ့ Anthropic ရဲ့ ဘောင်ထဲမှာပဲ ရပါတယ်။
    sources:
      - { title: "Anthropic: Claude's constitution", url: "https://www.anthropic.com/constitution" }
      - {
          title: "Claude Docs: Glossary",
          url: "https://platform.claude.com/docs/en/about-claude/glossary",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: q-rule },
          upsertIds: [q-rule],
          drawMs: 1200,
        }

  - id: your-turn
    chapter: ကိုယ့် team အတွက်
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ကိုယ့် team မှာ AI အကြောင်း အများဆုံး
      ကြားရတဲ့ ယုံကြည်ချက် နှစ်ခုကို ဒီ table ရဲ့ အောက်မှာ အတန်း နှစ်ခု ထပ်ရေးကြည့်ပါ။ ထင်နေတာ ဆိုတဲ့ column မှာ
      လူတွေ ပြောနေကျ စကားကို ရေးပြီး၊ တကယ် ဆိုတဲ့ column မှာ အမှန်ကို ရေးပါ။
      [[mark:turn-2]] အမှန်ကို ရေးတဲ့အခါ ဒီနေ့ ကြည့်ခဲ့တဲ့ အလွှာ သုံးလွှာနဲ့ ချိတ်ကြည့်ပါ။ ဒီလို ခွဲကြည့်ရင်
      နည်းပညာ မသိတဲ့ လုပ်ဖော်ကိုင်ဖက်ကို ရှင်းပြရတာ ပိုရှင်းလာပါတယ်။
    sources:
      - {
          title: "Claude Docs: Glossary",
          url: "https://platform.claude.com/docs/en/about-claude/glossary",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: turn }, open: false }
      - id: sel-table
        type: editor.select
        at: { mark: turn, offsetMs: 2200 }
        target:
          file: notebook/02-what-ai-is.md
          text: "| ထင်နေတာ | တကယ် |"

  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ Claude လို model က search engine လို ရှာပေးတာလည်း
      မဟုတ်၊ rule program လို လူ ကြိုရေးထားတာကို လိုက်လုပ်တာလည်း မဟုတ်ပါဘူး။ စာ အများကြီးကနေ သင်ယူထားတဲ့
      pattern နဲ့ စာ အသစ် ရေးပေးတဲ့ program ပါ။
      [[mark:recap-2]] model ရဲ့ အပြုအမူက training၊ Anthropic ရဲ့ constitution၊ ပြီးတော့ app တစ်ခုချင်းစီရဲ့ system
      prompt ဆိုတဲ့ အလွှာ သုံးလွှာကနေ လာပါတယ်။ FDE ရေးပြီး ပြင်နိုင်တာကတော့ အပေါ်ဆုံး အလွှာပါ။
      [[mark:next]] နောက် lesson မှာတော့ လှလှ ရဲ့ မေးခွန်းထဲက ကျန်နေတဲ့ အပိုင်း၊ model က ဘာကြောင့် ဒီလောက်
      ချောချောမွေ့မွေ့နဲ့ သေချာသလို ရေးနိုင်လဲ ဆိုတာကို ဖြေဖို့၊ model က စာကို token တစ်ခုချင်း ဘယ်လို
      ဆက်ရေးလဲ ဆိုတဲ့ next token prediction ကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "Claude Docs: Glossary",
          url: "https://platform.claude.com/docs/en/about-claude/glossary",
        }
    actions:
      - id: sel-row-1
        type: editor.select
        at: { mark: recap }
        target:
          file: notebook/02-what-ai-is.md
          text: "| AI က internet ပေါ်ကနေ အဖြေ ရှာပေးတာ | ရှာတာ မဟုတ်။ သင်ယူထားတဲ့ pattern နဲ့ စာ အသစ် ရေးတာ |"
      - id: sel-row-4
        type: editor.select
        at: { mark: recap-2 }
        target:
          file: notebook/02-what-ai-is.md
          text: "| prompt ကောင်းရင် ကြိုက်သလို ပြောင်းလို့ရ | prompt က အပေါ်ဆုံး အလွှာကိုပဲ ပြောင်းနိုင် |"

