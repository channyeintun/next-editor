  seed: 9302

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: drafts
    chapter: လှလှ ရဲ့ မေးခွန်း
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ မုန်တိုင်းကျတဲ့ညက model မပျက်ခဲ့ဘဲ၊ model က ဘာကို မြင်ရမလဲ၊ ဘယ်သူ စစ်မလဲ
      ဆိုတာကို ဘယ်သူမှ design မဆွဲခဲ့တာ ဖြစ်ကြောင်း တွေ့ခဲ့ပါတယ်။ ဒီတစ်ပတ်မှာတော့ ကိုယ်က နေခြည် ရဲ့
      support team နဲ့ အတူ ထိုင်ပြီး၊ model တစ်ခု ဘယ်လို ပြုမူလဲ ဆိုတာကို တကယ့် မူကြမ်းတွေကနေ
      လေ့လာနေပါတယ်။
      [[mark:ex-open]] support manager လှလှ က support agent တွေ မုန်တိုင်းကျတဲ့ည မတိုင်ခင်ကရော အဲဒီညကပါ
      chat AI နဲ့ ရေးခဲ့တဲ့ မူကြမ်းတွေကို စုပြီး ကိုယ့်ဆီ ယူလာပေးပါတယ်။ ဒါက အဲဒီထဲက ဥပမာ တစ်ခုပါ။
      [[mark:sel-customer]] customer က နောက်လ အိမ်ပြောင်းမှာမို့ internet ကို အိမ်အသစ်ကို ရွှေ့လို့ ရမလား
      လို့ မေးထားပါတယ်။
      [[mark:sel-draft]] AI ရေးပေးတဲ့ မူကြမ်းကတော့ စာကြောင်းတိုင်း ယဉ်ကျေးပါတယ်။ customer ဘက်မှာ ဘာ
      ပြဿနာမှ မဖြစ်သေးဘဲနဲ့ တောင်းပန်စကားကို အရင်ဆုံး ပြောထားပါတယ်။
      [[mark:sel-sure]] ရွှေ့ပြောင်းခ မရှိဘူး၊ နှစ်ရက်အတွင်း ပြီးမယ် ဆိုတာကိုလည်း ယုံကြည်မှု အပြည့်နဲ့
      ပြောထားပါတယ်။ ဒီ နှစ်ချက်ကို နေခြည် က AI ကို ဘယ်တုန်းကမှ မပြောထားပါဘူး။
      [[mark:hla-ask]] ဒီ မူကြမ်းကို ဖတ်ပြီး လှလှ က မေးခွန်း နှစ်ခု မေးပါတယ်။ ပထမ တစ်ခုက
      AI က ဒီအဖြေကို ဘယ်က ယူလာတာလဲ၊ Google လို internet ပေါ်ကနေ ရှာလာတာလား၊ ဒါမှမဟုတ် အဖြေ
      အဆင်သင့်တွေ သိမ်းထားတဲ့ စက်လား ဆိုတာပါ။ ဒုတိယ တစ်ခုက ဘာကြောင့် ဒီလောက် သေချာသလို ပြောပြီး
      ဒီလောက် ယဉ်ကျေးနေရတာလဲ ဆိုတာပါ။ ဒီ မေးခွန်းတွေကို ဖြေကြည့်ရအောင်။
    sources:
      - {
          title: "Claude Docs: Glossary",
          url: "https://platform.claude.com/docs/en/about-claude/glossary",
        }
    actions:
      - {
          id: open-ex,
          type: workspace.openFile,
          at: { mark: ex-open },
          path: examples/02-moving-draft.md,
        }
      - id: sel-customer
        type: editor.select
        at: { mark: sel-customer }
        target:
          file: examples/02-moving-draft.md
          text: "နောက်လ အိမ်ပြောင်းမှာပါ။ internet ကို အိမ်အသစ်ကို ရွှေ့လို့ ရမလား။"
      - id: sel-draft
        type: editor.select
        at: { mark: sel-draft }
        target:
          file: examples/02-moving-draft.md
          text: "မင်္ဂလာပါ ခင်ဗျာ။ အဆင်မပြေ ဖြစ်ရတဲ့အတွက် အရင်ဆုံး တောင်းပန်ပါတယ်။"
      - id: sel-sure
        type: editor.select
        at: { mark: sel-sure }
        target:
          file: examples/02-moving-draft.md
          text: "ရွှေ့ပြောင်းခ မရှိပါဘူး၊ 2 ရက်အတွင်း ပြီးစီးပါမယ်။"

  - id: three-programs
    chapter: ရှာတာလား၊ ရေးတာလား
    narration: >
      [[mark:p-open]] ပထမ မေးခွန်းကို ဖြေဖို့ program သုံးမျိုးကို customer မေးခွန်း တစ်ခုတည်း ပေးကြည့်ရအောင်။
      [[mark:p-q]] မေးခွန်းက ညဘက်ဆို internet နှေးတယ်၊ ဘာလုပ်ရမလဲ ဆိုတာပါ။
      [[mark:p-search]] ပထမ တစ်မျိုးက search engine ပါ။ search engine က စာ အသစ် မရေးပါဘူး။ internet ပေါ်မှာ
      ရှိပြီးသား page တွေထဲက ဒီ စကားလုံးတွေ ပါတဲ့ page တွေကို ရှာပြီး link စာရင်း ပြန်ပေးတာပါ။ ဘယ် page က ကိုက်လဲ ရွေးရတာကတော့ ကိုယ့်တာဝန်ပါ။
      [[mark:p-rule]] ဒုတိယ တစ်မျိုးက developer တွေ ရေးနေကျ ပုံမှန် program ပါ။ နှေး ဆိုတဲ့
      စကားလုံး ပါရင် ဒီ စာကို ပို့ ဆိုပြီး rule တွေကို လူက ကြိုရေးထားရပါတယ်။ ရေးထားတဲ့ rule အတိုင်းပဲ လုပ်တာမို့
      မေးခွန်း တူရင် အဖြေလည်း တူပါတယ်။ rule မရေးထားတဲ့ မေးခွန်း ရောက်လာရင်တော့ ဘာမှ မလုပ်နိုင်ပါဘူး။
      [[mark:p-model]] တတိယ တစ်မျိုးက model ပါ။ model ဆိုတာ စာတွေ အများကြီးကနေ သင်ယူထားပြီး၊ ပေးလိုက်တဲ့
      စာကို ဆက်ရေးပေးတဲ့ program ပါ။ model က ရှိပြီးသား page ကို ရှာမပေးသလို၊ လူက ကြိုရေးထားတဲ့ စာကိုလည်း
      ထုတ်မပေးပါဘူး။ ဒီ မေးခွန်းနဲ့ ကိုက်မယ့် စာကို အဲဒီအချိန်မှာမှ အသစ် ရေးပေးတာပါ။
      [[mark:p-gen]] ဒါကြောင့် ဒီလို စာ အသစ် ထုတ်ပေးတဲ့ AI အမျိုးအစားကို generative AI လို့ ခေါ်ပါတယ်။ Claude လည်း ဒီ အမျိုးအစားထဲ ပါပါတယ်။
      [[mark:p-proof]] ကိုယ်က အိမ်ပြောင်း မူကြမ်းထဲက စာကြောင်းတွေကို Knowledge base ထဲမှာရော
      internet ပေါ်မှာပါ ရှာကြည့်ပါတယ်။ စကားလုံး တစ်လုံးမကျန် တူတဲ့ page တစ်ခုမှ မတွေ့ပါဘူး။ ဆိုလိုတာက
      လှလှ ရဲ့ ပထမ မေးခွန်းအတွက် အဖြေက ရှာလာတာလည်း မဟုတ်၊ သိမ်းထားတာလည်း မဟုတ်ဘဲ၊ ရေးလိုက်တာပါ။
    sources:
      - {
          title: "Claude Docs: Glossary",
          url: "https://platform.claude.com/docs/en/about-claude/glossary",
        }
