  - id: training
    chapter: အပြုအမူ ဘယ်က လာလဲ
    narration: >
      [[mark:l-open]] ဒါဆို model က ဘယ်လို စာမျိုး ရေးမလဲ ဆိုတာကို ဘာက ဆုံးဖြတ်လဲ။ Claude လို model
      တစ်ခုရဲ့ အပြုအမူက အလွှာ သုံးလွှာကနေ လာပါတယ်။ အောက်ဆုံး အလွှာကနေ စကြည့်ရအောင်။
      [[mark:l-train]] အောက်ဆုံး အလွှာက training ပါ။ training ဆိုတာ model ကို စာတွေနဲ့ သင်ပေးတဲ့
      လုပ်ငန်းစဉ်ပါ။ ပထမ အဆင့်မှာ model က အလွန် များပြားတဲ့ စာသားတွေကို ဖတ်ပြီး၊ ရှေ့က စာကို ကြည့်ပြီး
      နောက်လာမယ့် စကားလုံးကို ခန့်မှန်းတတ်အောင် သင်ယူပါတယ်။ ဒီလို စာသား အမြောက်အမြားနဲ့ train လုပ်ထားတဲ့
      model အကြီးစားကို large language model လို့ ခေါ်ပါတယ်။
      [[mark:l-train-2]] ဒါပေမဲ့ အဲဒီ အဆင့်မှာတင် ရပ်ထားရင် model က စာကို ဆက်ရေးတတ်ရုံပါပဲ။ မေးခွန်း ဖြေတာ၊
      ညွှန်ကြားချက် လိုက်နာတာ မကောင်းသေးပါဘူး။ ဒါကြောင့် နောက်ထပ် training တွေ ထပ်လုပ်ပါတယ်။
      [[mark:l-rlhf]] အဲဒီထဲမှာ လူတွေက အဖြေ နှစ်ခု သုံးခုကို ဘယ်ဟာ ပိုကောင်းလဲ အဆင့်စီပေးပြီး၊ model ကို ပိုကောင်းတဲ့ အဖြေမျိုးဘက်
      ရောက်အောင် သင်တာလည်း ပါပါတယ်။ ရိုးသားမှု လို စရိုက်တွေ ရှိလာအောင် train လုပ်တာလည်း ပါပါတယ်။ ဒါကြောင့် Claude က စာ ဆက်ရေးရုံ model မဟုတ်ဘဲ၊ အကူအညီပေးတဲ့ assistant
      တစ်ခု ဖြစ်အောင် train လုပ်ထားပြီးသား model ပါ။
    sources:
      - {
          title: "Claude Docs: Glossary",
          url: "https://platform.claude.com/docs/en/about-claude/glossary",
        }
      - {
          title: "Anthropic: Claude's character",
          url: "https://www.anthropic.com/research/claude-character",
        }
    actions:
      - {
          id: draw-l-open,
          type: whiteboard.apply,
          at: { mark: l-open },
          clear: true,
          upsertIds: [l-title],
        }
      - {
          id: draw-l-train,
          type: whiteboard.apply,
          at: { mark: l-train },
          upsertIds: [l-b1, l-b1-l],
          drawMs: 1200,
        }

  - id: principles
    narration: >
      [[mark:l-const]] ဒုတိယ အလွှာက Anthropic ထုတ်ပြန်ထားတဲ့ Claude ရဲ့ constitution ပါ။ Claude ဘယ်လို
      တန်ဖိုးတွေ ထားပြီး ဘယ်လို ပြုမူစေချင်လဲ ဆိုတာကို ရေးထားတဲ့ စာတမ်းပါ။ training အဆင့် အမျိုးမျိုးမှာ
      ဒီ စာတမ်းကို သုံးပါတယ်။
      [[mark:l-const-2]] ဒီ စာတမ်းမှာ ဘေးကင်းဖို့ကနေ တကယ် အသုံးဝင်ဖို့အထိ အဓိက တန်ဖိုး လေးခုကို ဦးစားပေး
      အစဉ်လိုက် ရေးထားပါတယ်။ နေ့စဉ် အလုပ်တွေမှာ
      ဒီ တန်ဖိုးတွေ အချင်းချင်း ဆန့်ကျင်တာ ရှားပါတယ်။
      [[mark:l-why]] စိတ်ဝင်စားစရာ ကောင်းတာက rule တွေကို စာရင်း
      ချပေးမယ့်အစား ဘာကြောင့်လဲ ဆိုတဲ့ အကြောင်းပြချက်ကို ရှင်းပြထားတာပါ။ ဘယ်သူမှ ကြိုမမြင်ခဲ့တဲ့ အခြေအနေမှာ
      rule တစ်ခုကို မှားသုံးမိနိုင်လို့ပါ။
      [[mark:l-sys]] အပေါ်ဆုံး အလွှာကတော့ Claude ကို သုံးတဲ့ app တစ်ခုချင်းစီက ပေးတဲ့ ညွှန်ကြားချက်ပါ။
      အဓိကကတော့ system prompt ပါ။ system prompt ဆိုတာ စကားမပြောခင် model ကို ကြိုပေးထားတဲ့ တာဝန်နဲ့
      စည်းကမ်းပါ။ Claude ကို ကိုယ့် product ထဲ ထည့်သုံးတဲ့ ကုမ္ပဏီကို operator လို့ ခေါ်ပြီး၊ operator က
      အများအားဖြင့် system prompt ကနေ ညွှန်ကြားပါတယ်။ စကားပြောနေတဲ့ လူကိုတော့ user လို့ ခေါ်ပါတယ်။
      [[mark:l-app]] Claude ရဲ့ ကိုယ်ပိုင် chat app တွေမှာတောင် Anthropic က system prompt တစ်ခုကို
      စကားဝိုင်းတိုင်းရဲ့ အစမှာ ထည့်ထားပါတယ်။ ဒါပေမဲ့ အဲဒီ system prompt က API ကနေ ခေါ်တဲ့အခါ မပါပါဘူး။
      ဒါကြောင့် model တစ်ခုတည်းကို chat app ထဲမှာ သုံးတာနဲ့ ကိုယ့် program ကနေ ခေါ်သုံးတာ ပြုမူပုံ
      ကွာနိုင်ပါတယ်။
    sources:
      - {
          title: "Anthropic: Claude's new constitution",
          url: "https://www.anthropic.com/news/claude-new-constitution",
        }
      - { title: "Anthropic: Claude's constitution", url: "https://www.anthropic.com/constitution" }
      - {
          title: "Claude Docs: System prompts (release notes)",
          url: "https://platform.claude.com/docs/en/release-notes/system-prompts/overview",
        }
    actions:
      - {
          id: draw-l-const,
          type: whiteboard.apply,
          at: { mark: l-const },
          upsertIds: [l-b2, l-b2-l],
          drawMs: 1200,
        }
      - {
          id: draw-l-sys,
          type: whiteboard.apply,
          at: { mark: l-sys },
          upsertIds: [l-b3, l-b3-l],
          drawMs: 1200,
        }

  - id: what-fde-changes
    narration: >
      [[mark:l-yes]] FDE အနေနဲ့ ဒီ သုံးလွှာထဲက ဘယ်ဟာကို ပြင်လို့ ရလဲ။ အပေါ်ဆုံး အလွှာကိုပဲ ပြင်လို့ ရပါတယ်။
      နေခြည် အတွက် Reply assistant ကို ဆောက်တဲ့အခါ system prompt ကို ကိုယ်တို့ ကိုယ်တိုင် ရေးရမှာပါ။
      [[mark:l-no]] အောက်က နှစ်လွှာကိုတော့ ပြင်လို့ မရပါဘူး။ training ကို ထပ်လုပ်ပေးတဲ့ fine tuning ကိုလည်း
      ဒီ lesson ကို ရေးတဲ့ အချိန်မှာ Claude API က customer တွေကို မပေးသေးပါဘူး။
      [[mark:l-conc]] ဆိုလိုတာက FDE ရဲ့ အလုပ်က model ကို ပြောင်းလဲတာ မဟုတ်ပါဘူး။ ရှိပြီးသား အပြုအမူ အပေါ်မှာ
      နေခြည် ရဲ့ အလုပ်နဲ့ ကိုက်မယ့် ညွှန်ကြားချက်ကို သေသေချာချာ ရေးပေးတာ ဖြစ်ပါတယ်။
    sources:
      - {
          title: "Claude Docs: Glossary",
          url: "https://platform.claude.com/docs/en/about-claude/glossary",
        }
      - { title: "Anthropic: Claude's constitution", url: "https://www.anthropic.com/constitution" }
    actions:
      - {
          id: draw-l-yes,
          type: whiteboard.apply,
          at: { mark: l-yes },
          upsertIds: [l-yes-ok, l-yes],
          drawMs: 1200,
        }
      - {
          id: draw-l-no,
          type: whiteboard.apply,
          at: { mark: l-no },
          upsertIds: [l-brace, l-no],
          drawMs: 1200,
        }
      - {
          id: draw-l-conc,
          type: whiteboard.apply,
          at: { mark: l-conc },
          upsertIds: [l-conc],
          drawMs: 1200,
        }

  - id: beliefs
    chapter: ထင်နေတာနဲ့ တကယ်
    narration: >
      [[mark:b-open]] နေခြည် မှာ AI အကြောင်း ကြားရတဲ့ ယုံကြည်ချက် လေးခုကို ထင်နေတာနဲ့ တကယ် ဆိုပြီး table
      တစ်ခုနဲ့ ချရေးကြည့်ရအောင်။
      [[mark:type-1]] ပထမ ယုံကြည်ချက်က AI က internet ပေါ်ကနေ အဖြေ ရှာပေးတာ ဆိုတာပါ။ တကယ်တော့ ရှာတာ
      မဟုတ်ဘဲ၊ သင်ယူထားတဲ့ pattern တွေကို သုံးပြီး စာ အသစ် ရေးတာပါ။ စာကြောင်း တစ်ကြောင်းချင်း နောက်မှာ မူရင်း page ရှိနေတာ မဟုတ်ပါဘူး။
      [[mark:type-2]] ဒုတိယ ယုံကြည်ချက်က developer တွေ ရေးထားတဲ့ rule တွေအတိုင်း ဖြေတာ ဆိုတာပါ။ model ထဲမှာ
      if else တွေ မရှိပါဘူး။ training ကနေ ရလာတဲ့ အလေ့အထ အတိုင်း ရေးတာမို့၊ မှားတဲ့ rule
      တစ်ကြောင်းကို ရှာပြီး ပြင်လိုက်ရုံနဲ့ မရပါဘူး။
      [[mark:type-3]] တတိယ ယုံကြည်ချက်က AI က နေခြည် အကြောင်း သိပြီးသား ဆိုတာပါ။ training စာသားထဲမှာ နေခြည်
      ရဲ့ plan တွေ၊ စည်းကမ်းတွေ၊ လိုင်းကျမှု အခြေအနေတွေ မပါပါဘူး။ အိမ်ပြောင်း မူကြမ်းက ရွှေ့ပြောင်းခ
      မရှိဘူးလို့ ပြောတာလည်း သိလို့ ပြောတာ မဟုတ်ဘဲ၊ ဖြစ်နိုင်ခြေ များတဲ့ စာကို ရေးလိုက်တာပါ။
      [[mark:type-4]] စတုတ္ထ ယုံကြည်ချက်က prompt ကောင်းကောင်း ရေးရင် AI ကို ကြိုက်သလို ပြောင်းလို့ ရတယ်
      ဆိုတာပါ။ prompt ဆိုတာ model ကို ပေးလိုက်တဲ့ စာပါ။ prompt က အပေါ်ဆုံး အလွှာကိုပဲ
      ထိန်းပါတယ်။ အောက်က အလွှာ နှစ်ခုကိုတော့ ဘယ် prompt ကမှ ဖယ်ထုတ်လို့ မရပါဘူး။
    sources:
      - {
          title: "Claude Docs: Glossary",
          url: "https://platform.claude.com/docs/en/about-claude/glossary",
        }
      - { title: "Anthropic: Claude's constitution", url: "https://www.anthropic.com/constitution" }
    actions:
      - { id: close-layers, type: whiteboard.apply, at: { mark: b-open }, open: false }
      - {
          id: open-notebook,
          type: workspace.openFile,
          at: { afterAction: close-layers },
          path: notebook/02-what-ai-is.md,
        }
