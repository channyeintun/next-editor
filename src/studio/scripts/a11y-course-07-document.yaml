build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 2607

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  - id: intro
    chapter: "Page တစ်ခုလုံးနဲ့ ဆိုင်တဲ့ အချက်တွေ"
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ list နဲ့ table တွေကို screen reader က ဘယ်လို နားလည်လဲ ဆိုတာ
      ကြည့်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ page
      တစ်ခုလုံးနဲ့ ဆိုင်တဲ့ အချက်လေးတွေကို ကြည့်သွားပါမယ်။ [[mark:start-server]] page ရဲ့
      title၊ page ကို ဘယ် ဘာသာစကားနဲ့ ရေးထားလဲ ဆိုတဲ့ အချက်နဲ့၊ page ထဲမှာ ထည့်ထားတဲ့
      တခြား page တစ်ခု ဖြစ်တဲ့ iframe တို့ပါ။ ဒါတွေက မျက်စိနဲ့ ကြည့်ရင် သိပ် မထင်ရှားပေမယ့်၊
      screen reader သုံးတဲ့သူအတွက်တော့ အရေးကြီးပါတယ်။ ဥပမာ title ဆိုရင် page ကို ဖွင့်လိုက်တာနဲ့
      ပထမဆုံး ကြားရမယ့် စာပါ။ ပြီးတော့ မြန်မာလို ရေးတဲ့ ကိုယ်တွေအတွက် အထူး သတိထားရမယ့် အချက် တစ်ခုလည်း
      ပါပါသေးတယ်။
    sources:
      - title: "web.dev Learn Accessibility — The Document"
        url: "https://web.dev/learn/accessibility/more-html"
      - title: "MDN — <title>: The Document Title element"
        url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Element/title"
      - title: "MDN — lang global attribute"
        url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Global_attributes/lang"
    actions:
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: code-tour
    narration: >
      [[mark:open-index]] ဒါက ဆိုင်ရဲ့ HTML ဖိုင်ပါ။ ဒီ lesson အတွက် page ကို တိုတိုလေးပဲ
      ထားထားပါတယ်။ အပေါ်မှာ ဆိုင်နာမည်နဲ့ English tagline၊ အလယ်မှာ ကြိုဆိုတဲ့ စာနဲ့ English
      quote တစ်ခု၊ အောက်ဆုံးမှာတော့ ဆိုင်တည်နေရာကို ပြတဲ့ iframe တစ်ခု ပါပါတယ်။
      [[mark:select-html]] ဖိုင်ရဲ့ အစက html element ကို ကြည့်ပါ။ page ကို ဘယ် ဘာသာစကားနဲ့
      ရေးထားလဲ ဆိုတာ ဒီမှာ ဘာမှ မပြောထားပါဘူး။ [[mark:select-title]] head ထဲက title
      element ကလည်း ဗလာ ဖြစ်နေပါတယ်။ [[mark:select-iframe]] iframe မှာလည်း သူ့ထဲမှာ ဘာ ရှိလဲ
      ဆိုတာ ပြောပြမယ့် title မပါပါဘူး။ ဒါတွေက တကယ့် website တွေမှာ မကြာခဏ တွေ့ရတဲ့
      အမှားတွေပါ။ [[mark:preview-shows]] ညာဘက်မှာ ဆိုင်ရဲ့ page ကို မြင်ရပါပြီ။ မျက်စိနဲ့
      ကြည့်ရင်တော့ ပြဿနာ မရှိသလိုပါပဲ။ ဒါပေမဲ့ အောက်က accessibility panel ကို ကြည့်ပါ။
      ပထမဆုံး row က page တစ်ခုလုံးကို ကိုယ်စားပြုတဲ့ document row ပါ။ အဲဒီမှာ title မရှိဘူး၊
      lang မရှိဘူး ဆိုတဲ့ သတိပေးချက် နှစ်ခု ပေါ်နေပြီး၊ အောက်ဆုံးက iframe row မှာလည်း name
      မရှိဘူးလို့ ပြနေပါတယ်။ ဒါကြောင့် အပေါ်ဆုံးမှာ warning သုံးခု ရှိတယ်လို့ ရေတွက်ပြထားတာပါ။
    sources:
      - title: "web.dev Learn Accessibility — The Document"
        url: "https://web.dev/learn/accessibility/more-html"
      - title: "WCAG 2.2 Understanding — Page Titled"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/page-titled"
      - title: "WCAG 2.2 Understanding — Language of Page"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/language-of-page"
    actions:
      - id: open-index
        type: workspace.openFile
        at: { mark: open-index }
        path: index.html
      - id: select-html
        type: editor.select
        at: { mark: select-html }
        target: { file: index.html, text: "<html>", occurrence: 1 }
      - id: select-title
        type: editor.select
        at: { mark: select-title }
        target: { file: index.html, text: "<title></title>", occurrence: 1 }
      - id: select-iframe
        type: editor.select
        at: { mark: select-iframe }
        target: { file: index.html, text: '<iframe class="map-frame"', occurrence: 1 }
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { mark: preview-shows }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-dev-server }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-no-title
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: a11y-document }
        textContains: "⚠ no title"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-no-lang
        type: expect.preview
        at: { afterAction: expect-no-title }
        timeoutMs: 5000
        target: { by: testId, value: a11y-document }
        textContains: "⚠ no lang"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-frame-unnamed
        type: expect.preview
        at: { afterAction: expect-no-lang }
        timeoutMs: 5000
        target: { by: testId, value: a11y-map-frame }
        textContains: "iframe ⚠ no name"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-three-warnings
        type: expect.preview
        at: { afterAction: expect-frame-unnamed }
        timeoutMs: 5000
        target: { by: testId, value: a11y-summary }
        attribute: { name: data-warnings, value: "3" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: collapse-runner-dock
        type: runtime.collapseDock
        at: { afterAction: expect-three-warnings }

  - id: title
    chapter: "Page title က ဘာကြောင့် အရေးကြီးလဲ"
    narration: >
      page title ဆိုတာ page ပေါ်မှာ မပေါ်ပေမယ့်၊ browser tab ပေါ်မှာ၊ bookmark နဲ့ history
      ထဲမှာ၊ search result တွေမှာ ပေါ်တဲ့ page ရဲ့ နာမည်ပါ။ screen reader သုံးတဲ့သူ
      အတွက်ဆိုရင်တော့ page တစ်ခုကို ဖွင့်လိုက်တာနဲ့ ပထမဆုံး ဖတ်ပြမယ့် စာက ဒီ title ပါ။
      [[mark:title-breath]] ဆိုလိုတာက၊ ကိုယ် ဘယ် page ကို ရောက်နေလဲ ဆိုတာကို title ကနေ အရင်ဆုံး သိရတာပါ။ title
      ဗလာ ဖြစ်နေရင်တော့ browser က page ရဲ့ လိပ်စာကိုပဲ ပြလေ့ရှိပြီး၊ tab တွေ အများကြီး
      ဖွင့်ထားတဲ့အခါ ဘယ် tab က ဘာလဲ ခွဲလို့ မရတော့ပါဘူး။ [[mark:type-title]] ဒါဆို title
      ထဲမှာ ဆိုင်ရဲ့ နာမည်ကို ထည့်ကြည့်ရအောင်။ [[mark:after-title]] accessibility panel ရဲ့
      document row ကို ကြည့်ပါ။ title မရှိဘူး ဆိုတဲ့ သတိပေးချက် နေရာမှာ ရွှေလက်ဖက်ရည်ဆိုင်
      ဆိုတဲ့ နာမည် ဝင်လာပြီး၊ warning ကလည်း နှစ်ခုပဲ ကျန်ပါတော့တယ်။ ဒါဆို screen reader က page
      ကို ဖွင့်တာနဲ့ ဒီ နာမည်ကို အရင်ဆုံး ဖတ်ပြမှာပါ။
    sources:
      - title: "web.dev Learn Accessibility — The Document: page title"
        url: "https://web.dev/learn/accessibility/more-html#page_title"
      - title: "MDN — <title>: The Document Title element"
        url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Element/title"
      - title: "WCAG 2.2 Understanding — Page Titled"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/page-titled"
    actions:
      - id: type-title
        type: editor.type
        at: { mark: type-title }
        cadence: block
        target: { file: index.html, after: "<title>", occurrence: 1 }
        text: "ရွှေလက်ဖက်ရည်ဆိုင်"
      - id: expect-title
        type: expect.preview
        at: { mark: after-title }
        timeoutMs: 5000
        target: { by: testId, value: a11y-document }
        attribute: { name: data-title, value: "ရွှေလက်ဖက်ရည်ဆိုင်" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-two-warnings
        type: expect.preview
        at: { afterAction: expect-title }
        timeoutMs: 5000
        target: { by: testId, value: a11y-summary }
        attribute: { name: data-warnings, value: "2" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: title-board
    narration: >
      [[mark:open-tabs-board]] ဒါဆို title ကို ဘယ်လို ရေးရင် ကောင်းမလဲ။ ဆိုင်ရဲ့ website မှာ
      မီနူး၊ ဖွင့်ချိန်၊ အော်ဒါမှာတဲ့ page ဆိုပြီး page တွေ အများကြီး ရှိတယ် ဆိုပါစို့။
      [[mark:draw-tabs-bad]] page တိုင်းရဲ့ title ကို ဆိုင်နာမည်နဲ့ စရေးထားရင်၊ tab တွေ ကျဉ်းလာတဲ့
      အခါ ရှေ့ပိုင်းလေးပဲ မြင်ရလို့ tab အားလုံးက တစ်ပုံစံတည်း ဖြစ်နေပါတယ်။ screen reader
      သုံးတဲ့သူကလည်း page တစ်ခု ရောက်တိုင်း သိပြီးသား ဆိုင်နာမည်ကို အရင် နားထောင်ပြီးမှ၊ ဒီ
      page က ဘာလဲ ဆိုတာ သိရပါတယ်။ [[mark:draw-tabs-good]] အဲဒီအစား page တစ်ခုချင်းရဲ့ ကိုယ်ပိုင်
      အချက်ကို ရှေ့ဆုံးမှာ ထားပြီး၊ ဆိုင်နာမည်ကို နောက်မှာ ထားပါ။ ဒါဆို tab ကျဉ်းနေရင်တောင်
      မီနူးလား၊ ဖွင့်ချိန်လား၊ အော်ဒါမှာတဲ့ page လား ဆိုတာ ချက်ချင်း သိနိုင်ပါတယ်။
      [[mark:draw-title-rules]] ဒါကြောင့် title တိုင်းကို page တစ်ခုနဲ့ တစ်ခု မတူအောင်၊ page
      ထဲမှာ ဘာ ရှိလဲ ဆိုတာ ရှင်းရှင်း ပြောအောင်၊ ပြီးတော့ တိုတိုနဲ့ ရေးရပါမယ်။ search engine
      အတွက်ဆိုပြီး keyword တွေ အများကြီး ထည့်ဖို့ မလိုပါဘူး။ ခုနက page က ဆိုင်ရဲ့ ပင်မ page
      ဖြစ်လို့ ဆိုင်နာမည် တစ်ခုတည်းနဲ့ အဆင်ပြေပါတယ်။ [[mark:draw-spa]] React
      လို framework နဲ့ ရေးတဲ့ single page app တွေမှာတော့ page အသစ်ကို တကယ် မဖွင့်ဘဲ
      မြင်ကွင်းပဲ ပြောင်းသွားတာ ဖြစ်လို့၊ title ကို JavaScript နဲ့ ကိုယ်တိုင် ပြောင်းပေးရပါတယ်။
      အဲဒါကို lesson ၉ မှာ လုပ်ကြည့်ပါမယ်။
    sources:
      - title: "web.dev Learn Accessibility — The Document: page title (front-load the page's own content)"
        url: "https://web.dev/learn/accessibility/more-html#page_title"
      - title: "W3C Technique G88 — Providing descriptive titles for web pages"
        url: "https://www.w3.org/WAI/WCAG22/Techniques/general/G88"
      - title: "MDN — Document.title"
        url: "https://developer.mozilla.org/en-US/docs/Web/API/Document/title"
      - title: "Hidde de Vries — Accessible page titles in a single page app"
        url: "https://hidde.blog/accessible-page-titles-in-a-single-page-app/"
    actions:
      - id: open-tabs-board
        type: whiteboard.apply
        at: { mark: open-tabs-board }
        open: true
        clear: true
        upsertIds: [t-title]
      - id: draw-tabs-bad
        type: whiteboard.apply
        at: { mark: draw-tabs-bad }
        upsertIds:
          [t-bad, t-bad-tab1, t-bad-text1, t-bad-tab2, t-bad-text2, t-bad-tab3, t-bad-text3]
        drawMs: 2400
      - id: draw-tabs-good
        type: whiteboard.apply
        at: { mark: draw-tabs-good }
        upsertIds:
          [t-good, t-good-tab1, t-good-text1, t-good-tab2, t-good-text2, t-good-tab3, t-good-text3]
        drawMs: 2400
      - id: draw-title-rules
        type: whiteboard.apply
        at: { mark: draw-title-rules }
        upsertIds: [t-rules]
        drawMs: 1200
      - id: draw-spa
        type: whiteboard.apply
        at: { mark: draw-spa }
        upsertIds: [t-spa]
        drawMs: 1200

  - id: lang
    chapter: "Page ရဲ့ ဘာသာစကား"
    narration: >
      [[mark:open-lang-board]] နောက်တစ်ခုက page ရဲ့ ဘာသာစကားပါ။ screen reader က စာကို အသံထွက်
      ဖတ်တဲ့အခါ၊ ဘာသာစကား တစ်ခုချင်းအတွက် သီးသန့် အသံနဲ့ အသံထွက် စည်းမျဉ်းကို သုံးပါတယ်။
      [[mark:draw-no-lang]] page မှာ ဘာသာစကား ပြောမထားရင်၊ screen reader က သုံးတဲ့သူရဲ့ device
      မှာ သတ်မှတ်ထားတဲ့ ဘာသာစကားနဲ့ပဲ ဖတ်ပါတယ်။ ဥပမာအားဖြင့်၊ English နဲ့ သတ်မှတ်ထားတဲ့
      ဖုန်းနဲ့ ဆိုင်ရဲ့ page ကို ဖွင့်ရင်၊ မြန်မာစာတွေကို English အသံထွက်နဲ့ ဖတ်ဖို့ ကြိုးစားမှာ
      ဖြစ်လို့ နားထောင်လို့ မရတော့ပါဘူး။ [[mark:draw-with-lang]] html element မှာ lang attribute
      နဲ့ ဒီ page က မြန်မာလို ရေးထားတယ်လို့ ပြောထားရင်တော့၊ device မှာ မြန်မာ အသံ ရှိတဲ့အခါ
      screen reader က အဲဒီ အသံကို ရွေးသုံးနိုင်ပါတယ်။ [[mark:draw-lang-uses]] screen reader
      တင် မကပါဘူး။ ဘာသာပြန် tool တွေက ဘယ်ဘာသာကနေ ပြန်ရမလဲ ဆိုတာ သိသွားသလို၊ browser
      ကလည်း စာလုံးပုံစံ ရွေးတာ၊ spelling စစ်တာမှာ ဒီ အချက်ကို သုံးပါတယ်။ [[mark:draw-codes]]
      lang ရဲ့ တန်ဖိုးက နိုင်ငံတကာ စံနှုန်းအဖွဲ့က သတ်မှတ်ထားတဲ့ ဘာသာစကား code ပါ။ board ပေါ်မှာ မြင်ရတဲ့အတိုင်း
      မြန်မာနဲ့ English အတွက် စာလုံး နှစ်လုံးစီ ပါတဲ့ code တွေ ရှိပြီး၊ ဒီလို code တိုတွေက
      assistive technology အများဆုံးနဲ့ အဆင်ပြေပါတယ်။ [[mark:draw-one-lang]] သတိထားရမှာက html
      element မှာ ဘာသာစကား တစ်ခုပဲ ပေးလို့ ရတာပါ။ page ထဲမှာ ဘာသာ နှစ်မျိုး ပါနေရင်တောင်၊
      html မှာ အဓိက ဘာသာကိုပဲ ပေးရပါမယ်။
    sources:
      - title: "web.dev Learn Accessibility — The Document: page language"
        url: "https://web.dev/learn/accessibility/more-html#page_language"
      - title: "W3C Internationalization — Declaring language in HTML"
        url: "https://www.w3.org/International/questions/qa-html-language-declarations"
      - title: "W3C Internationalization — Choosing a language tag"
        url: "https://www.w3.org/International/questions/qa-choosing-language-tags"
      - title: "WCAG 2.2 Understanding — Language of Page"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/language-of-page"
    actions:
      - id: open-lang-board
        type: whiteboard.apply
        at: { mark: open-lang-board }
        clear: true
        upsertIds: [l-title, l-box, l-word]
      - id: draw-no-lang
        type: whiteboard.apply
        at: { mark: draw-no-lang }
        upsertIds: [l-arrow-no, l-no]
        drawMs: 1600
      - id: draw-with-lang
        type: whiteboard.apply
        at: { mark: draw-with-lang }
        upsertIds: [l-arrow-yes, l-yes]
        drawMs: 1600
      - id: draw-lang-uses
        type: whiteboard.apply
        at: { mark: draw-lang-uses }
        upsertIds: [l-uses]
        drawMs: 1200
      - id: draw-codes
        type: whiteboard.apply
        at: { mark: draw-codes }
        upsertIds: [l-codes]
        drawMs: 1200
      - id: draw-one-lang
        type: whiteboard.apply
        at: { mark: draw-one-lang }
        upsertIds: [l-one]
        drawMs: 1200

  - id: lang-fix
    narration: >
      [[mark:close-lang-board]] editor ထဲ ပြန်သွားရအောင်။ [[mark:type-lang]] html element မှာ
      lang attribute ထည့်ပြီး မြန်မာ ဘာသာရဲ့ code ကို ပေးပါမယ်။ [[mark:after-lang]] panel ရဲ့
      document row မှာ lang ပေါ်လာပြီး၊ warning ကလည်း တစ်ခုပဲ ကျန်ပါတော့တယ်။ page ထဲက စာတွေ
      အားလုံးက html ရဲ့ ဘာသာစကားကို inherit ဖြစ်ကြလို့၊ ဒီ attribute တစ်ခုတည်းက page
      တစ်ခုလုံးကို မြန်မာလို့ ပြောပေးလိုက်တာပါ။
    sources:
      - title: "web.dev Learn Accessibility — The Document: page language"
        url: "https://web.dev/learn/accessibility/more-html#page_language"
      - title: "MDN — lang global attribute"
        url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Global_attributes/lang"
    actions:
      - id: close-lang-board
        type: whiteboard.apply
        at: { mark: close-lang-board }
        open: false
      - id: type-lang
        type: editor.type
        at: { mark: type-lang }
        cadence: block
        target: { file: index.html, after: "<html", occurrence: 1 }
        text: ' lang="my"'
      - id: expect-lang
        type: expect.preview
        at: { mark: after-lang }
        timeoutMs: 5000
        target: { by: testId, value: a11y-document }
        attribute: { name: data-lang, value: "my" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-one-warning
        type: expect.preview
        at: { afterAction: expect-lang }
        timeoutMs: 5000
        target: { by: testId, value: a11y-summary }
        attribute: { name: data-warnings, value: "1" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: section-lang
    chapter: "ဘာသာ မတူတဲ့ အပိုင်းတွေ"
    narration: >
      [[mark:select-tagline]] ဆိုင်နာမည် အောက်က English tagline ကို ကြည့်ပါ။ သူ့မှာ English
      ဖြစ်ကြောင်း ပြောတဲ့ lang attribute ပါပြီးသားပါ။ ဒါကြောင့် page တစ်ခုလုံးက မြန်မာ
      ဖြစ်ပေမယ့်၊ ဒီ စာကြောင်းကို ရောက်တဲ့အခါ screen reader က English အသံကို ပြောင်းသုံးနိုင်ပါတယ်။
      panel ထဲက tagline row မှာလည်း English lang ကို မြင်ရပါတယ်။ [[mark:select-quote]] ဒါပေမဲ့
      အောက်က English quote မှာတော့ ထည့်ဖို့ မေ့ကျန်ခဲ့ပါတယ်။ အခု html မှာ မြန်မာလို့
      ပြောထားပြီ ဖြစ်လို့၊ ဒီ English စာကြောင်းကို မြန်မာ အသံထွက်နဲ့ ဖတ်မိနိုင်ပါတယ်။
      [[mark:type-quote-lang]] ဒါကြောင့် quote ကို ဖုံးထားတဲ့ blockquote element မှာ English
      code ကို ထည့်ပေးပါမယ်။ [[mark:after-quote-lang]] panel ထဲက blockquote row မှာ English
      lang ပေါ်လာပါပြီ။ element တစ်ခုမှာ lang ပေးလိုက်ရင် သူ့အထဲက အရာအားလုံးကို သက်ရောက်ပြီး၊
      element ဆုံးသွားတာနဲ့ page ရဲ့ အဓိက ဘာသာကို ပြန်ရောက်ပါတယ်။ ဒါကြောင့် စာကြောင်း တစ်ဝက်
      လောက်ပဲ ဆိုရင်လည်း span နဲ့ ဖုံးပြီး lang ပေးလို့ ရပါတယ်။ ဒါပေမဲ့ နာမည်တွေ၊ technical
      term တွေ၊ ကိုယ်တွေ မြန်မာလိုပဲ ပြောနေကျ ဖြစ်သွားတဲ့ English စကားလုံးတွေအတွက်တော့
      သီးသန့် ပေးစရာ မလိုပါဘူး။
    sources:
      - title: "web.dev Learn Accessibility — The Document: section language"
        url: "https://web.dev/learn/accessibility/more-html#section_language"
      - title: "WCAG 2.2 Understanding — Language of Parts (exceptions for names, technical terms and everyday words)"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/language-of-parts"
      - title: "W3C Technique H58 — Using language attributes to identify changes in the human language"
        url: "https://www.w3.org/WAI/WCAG22/Techniques/html/H58"
    actions:
      - id: select-tagline
        type: editor.select
        at: { mark: select-tagline }
        target: { file: index.html, text: '<p class="tagline" lang="en"', occurrence: 1 }
      - id: expect-tagline-en
        type: expect.preview
        at: { afterAction: select-tagline }
        timeoutMs: 5000
        target: { by: testId, value: a11y-tagline }
        textContains: 'lang="en"'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-quote
        type: editor.select
        at: { mark: select-quote }
        target: { file: index.html, text: '<blockquote class="quote"', occurrence: 1 }
      - id: type-quote-lang
        type: editor.type
        at: { mark: type-quote-lang }
        cadence: block
        target: { file: index.html, after: '<blockquote class="quote"', occurrence: 1 }
        text: ' lang="en"'
      - id: expect-quote-en
        type: expect.preview
        at: { mark: after-quote-lang }
        timeoutMs: 5000
        target: { by: testId, value: a11y-quote }
        textContains: 'blockquote lang="en"'
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: zawgyi
    chapter: "မြန်မာစာကို Unicode နဲ့ ရေးပါ"
    narration: >
      [[mark:open-zawgyi-board]] မြန်မာလို ရေးတဲ့ ကိုယ်တွေ သိထားရမယ့် အချက် တစ်ခု ရှိပါတယ်။ lang
      က ဘာသာစကားကို ပြောပေးပေမယ့်၊ စာလုံးတွေကိုယ်တိုင် မှန်ကန်တဲ့ encoding နဲ့ ရေးထားမှ
      အလုပ်ဖြစ်ပါတယ်။ [[mark:draw-unicode]] Unicode စံနှုန်းမှာ မြန်မာ စာလုံး တစ်လုံးချင်းစီကို
      code တစ်ခုစီ သတ်မှတ်ထားပြီး၊ screen reader၊ စာကို အသံပြောင်းပေးတဲ့ text to speech၊
      search engine၊ ဘာသာပြန် tool တွေ အားလုံးက ဒီ စံနှုန်းအတိုင်း ဖတ်ပါတယ်။
      [[mark:draw-zawgyi]] Zawgyi ကတော့ အဲဒီ code တွေထဲက တချို့ကို တခြား စာလုံးပုံစံတွေအတွက်
      ယူသုံးထားပြီး၊ စာလုံးတွေကိုလည်း မျက်စိနဲ့ မြင်ရတဲ့ အစဉ်အတိုင်း ရိုက်ထည့်ရပါတယ်။ ဥပမာ
      သဝေထိုးကို ဗျည်းရဲ့ ရှေ့မှာ ရိုက်ရပါတယ်။ ဒါကြောင့်
      Zawgyi font နဲ့ ကြည့်ရင် မှန်နေပေမယ့်၊ Unicode အတိုင်း ဖတ်တဲ့ software တွေအတွက်တော့
      စာလုံးတွေ မှားနေတာပါ။ screen reader က မှားဖတ်တာ၊ search မှာ ရှာမတွေ့တာ၊ ဘာသာပြန်
      မှားတာတွေ ဖြစ်လာပါတယ်။ [[mark:draw-use-unicode]] ဒါကြောင့် website ရဲ့ စာသားတွေ၊ alt
      text တွေ၊ title တွေ အားလုံးကို Unicode နဲ့ပဲ ရေးပါ။ ဒီ ဆိုင်ရဲ့ page ကတော့ Unicode နဲ့
      ရေးထားပြီးသားပါ။
    sources:
      - title: "Unicode FAQ — Myanmar Scripts and Languages (Zawgyi)"
        url: "https://www.unicode.org/faq/myanmar.html"
      - title: "Google myanmar-tools — detecting and converting Zawgyi text"
        url: "https://github.com/google/myanmar-tools"
      - title: "Engineering at Meta — Facebook's path from Zawgyi to Unicode (Zawgyi is incompatible with Unicode)"
        url: "https://engineering.fb.com/2019/09/26/android/unicode-font-converter/"
    actions:
      - id: open-zawgyi-board
        type: whiteboard.apply
        at: { mark: open-zawgyi-board }
        open: true
        clear: true
        upsertIds: [z-title]
      - id: draw-unicode
        type: whiteboard.apply
        at: { mark: draw-unicode }
        upsertIds: [z-uni-box, z-uni-1, z-uni-2]
        drawMs: 2000
      - id: draw-zawgyi
        type: whiteboard.apply
        at: { mark: draw-zawgyi }
        upsertIds: [z-zg-box, z-zg-1, z-zg-2]
        drawMs: 2000
      - id: draw-use-unicode
        type: whiteboard.apply
        at: { mark: draw-use-unicode }
        upsertIds: [z-use]
        drawMs: 1200

  - id: iframe
    chapter: "iframe ကို နာမည် ပေးရအောင်"
    narration: >
      [[mark:close-zawgyi-board]] နောက်ဆုံး ပြဿနာက ဆိုင်တည်နေရာ အပိုင်းထဲမှာပါ။
      [[mark:scroll-map]] iframe ဆိုတာ page ထဲမှာ တခြား page တစ်ခုကို ထည့်ပြတဲ့ element ပါ။
      map၊ video၊ ကြော်ငြာ စတာတွေကို ထည့်တဲ့အခါ သုံးကြပါတယ်။ panel ထဲက iframe row မှာ name
      မရှိဘူးလို့ ပြနေပါတယ်။ ဆိုလိုတာက screen reader သုံးတဲ့သူ ဒီနေရာ ရောက်တဲ့အခါ frame တစ်ခု
      ရှိတယ် ဆိုတာပဲ သိရပြီး၊ အထဲကို ဝင်မကြည့်ခင် ဘာ ရှိလဲ ဆိုတာ မသိနိုင်ပါဘူး။
      [[mark:type-iframe-title]] ဒါကြောင့် iframe မှာ title attribute ထည့်ပြီး၊ အထဲမှာ ဆိုင်
      တည်နေရာ မြေပုံ ရှိတယ်လို့ ရေးပေးပါမယ်။ [[mark:after-iframe-title]] iframe row မှာ name
      ဝင်လာပြီး၊ အပေါ်ဆုံးမှာလည်း warning မရှိတော့ပါဘူး။ ဒါပေမဲ့ title ထည့်ရုံနဲ့ မပြီးသေးပါဘူး။
      iframe ထဲမှာ ပြတဲ့ page ကိုယ်တိုင်ကလည်း သူ့ title၊ သူ့ lang နဲ့ accessible ဖြစ်ရပါမယ်။
      ဒီ မြေပုံ page မှာတော့ သူ့ title နဲ့ lang ပါပြီးသားပါ။
      တခြား company တွေက ပေးတဲ့ map နဲ့ video တွေကို ထည့်တဲ့အခါ အဲဒါကိုပါ စစ်ကြည့်ပါ။
    sources:
      - title: "web.dev Learn Accessibility — The Document: iFrames"
        url: "https://web.dev/learn/accessibility/more-html#iframes"
      - title: "W3C Technique H64 — Using the title attribute of the iframe element"
        url: "https://www.w3.org/WAI/WCAG22/Techniques/html/H64"
      - title: "MDN — <iframe>: Accessibility concerns"
        url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Element/iframe#accessibility"
    actions:
      - id: close-zawgyi-board
        type: whiteboard.apply
        at: { mark: close-zawgyi-board }
        open: false
      - id: scroll-map
        type: preview.scroll
        at: { mark: scroll-map }
        timeoutMs: 5000
        top: 5000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-iframe-title
        type: editor.type
        at: { mark: type-iframe-title }
        cadence: block
        target: { file: index.html, after: '<iframe class="map-frame"', occurrence: 1 }
        text: ' title="ဆိုင် တည်နေရာ မြေပုံ"'
      - id: expect-frame-named
        type: expect.preview
        at: { mark: after-iframe-title }
        timeoutMs: 5000
        target: { by: testId, value: a11y-map-frame }
        textContains: 'iframe "ဆိုင် တည်နေရာ မြေပုံ"'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-no-warnings
        type: expect.preview
        at: { afterAction: expect-frame-named }
        timeoutMs: 5000
        target: { by: testId, value: a11y-summary }
        attribute: { name: data-warnings, value: "0" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:select-final-html]] ဒါဆို ပြန်ချုပ်ရရင်၊ html element ရဲ့ lang က page ရဲ့ အဓိက
      ဘာသာစကားကို ပြောပေးပြီး၊ ဘာသာ မတူတဲ့ အပိုင်းတွေမှာတော့ သူ့ lang ကို သီးသန့် ပေးရပါတယ်။
      [[mark:select-final-title]] page title က screen reader က ပထမဆုံး ဖတ်ပြမယ့် page ရဲ့ နာမည်
      ဖြစ်လို့၊ page တိုင်းမှာ မတူအောင်၊ page ရဲ့ ကိုယ်ပိုင် အချက်ကို ရှေ့ဆုံးမှာ ထားပြီး
      ရေးရပါတယ်။ မြန်မာစာကို Unicode နဲ့ပဲ ရေးပြီး၊ iframe တိုင်းမှာ အထဲက အကြောင်းအရာကို
      ပြောတဲ့ title ပေးရပါတယ်။ [[mark:recap-try]] ကိုယ့်
      ကွန်ပျူတာ ဒါမှမဟုတ် ဖုန်းမှာ VoiceOver၊ NVDA ဒါမှမဟုတ် TalkBack ကို ဖွင့်ပြီး၊ lang
      ပါတဲ့ page နဲ့ မပါတဲ့ page ကို နားထောင် ကြည့်ပါ။ နောက် lesson မှာတော့ mouse မသုံးဘဲ
      keyboard နဲ့ပဲ page ကို သုံးတဲ့သူတွေအတွက် keyboard focus ကို ကြည့်သွားပါမယ်။
    sources:
      - title: "web.dev Learn Accessibility — The Document"
        url: "https://web.dev/learn/accessibility/more-html"
      - title: "web.dev Learn Accessibility — Keyboard focus (next lesson)"
        url: "https://web.dev/learn/accessibility/focus"
    actions:
      - id: select-final-html
        type: editor.select
        at: { mark: select-final-html }
        target: { file: index.html, text: '<html lang="my">', occurrence: 1 }
      - id: select-final-title
        type: editor.select
        at: { mark: select-final-title }
        target: { file: index.html, text: "<title>ရွှေလက်ဖက်ရည်ဆိုင်</title>", occurrence: 1 }
      - id: expect-file-lang
        type: expect.file
        at: { afterAction: select-final-title }
        path: index.html
        contains: '<html lang="my">'
      - id: expect-file-title
        type: expect.file
        at: { afterAction: expect-file-lang }
        path: index.html
        contains: "<title>ရွှေလက်ဖက်ရည်ဆိုင်</title>"
      - id: expect-file-quote
        type: expect.file
        at: { afterAction: expect-file-title }
        path: index.html
        contains: '<blockquote class="quote" lang="en"'
      - id: expect-file-iframe
        type: expect.file
        at: { afterAction: expect-file-quote }
        path: index.html
        contains: '<iframe class="map-frame" title="ဆိုင် တည်နေရာ မြေပုံ"'

checks:
  - { type: timing.p95Ms, max: 300 }
