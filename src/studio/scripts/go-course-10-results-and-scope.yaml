# Go course, lesson 10: several results, scope and shadowing (Burmese).
#
# Start state: main.go with `package main`, `import "fmt"` and an empty `func main`.
# Edits, all insert-only:
#   1. splitBill(total, people int) (each, left int) above main, and a call that prints both
#      results -> run-1: 3333 1;
#   2. pay(total, amount int) (int, bool), then a loop over three friends that writes
#      `total, ok := pay(total, each)` inside the loop -> run-2: a clean run that is wrong
#      (1 3333 / 2 3333 / 3 3333 / 0 ကျပ် ရပြီ): the loop's := makes a second total;
#   3. `var ok bool` before the loop, `// ` in front of the := line and a new line with `=`
#      -> run-3: 2 6666 / 3 9999 / 9999 ကျပ် ရပြီ.
# Boards: (R) two results in, `_` to drop one on purpose, one name for two results refused;
# (S) scope: main's block and the loop's block, a name looked up from the inside out, := in the
# inner block = a second box with the same name; (Q) quiz (shadowing inside an if).
# Fixtures: bun ~/Documents/go-course-work/tools/sim-go.ts <this yaml> --write
schemaVersion: 1

