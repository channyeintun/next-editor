        </style>
        <div class="stage">
          <div class="title">ADR ရေးထိုက်တဲ့ ဆုံးဖြတ်ချက် 5 မျိုး</div>
          <div class="row" style="top: 26vh"><span class="num">1</span><span class="term wide orange">Characteristic</span>ထိုင်ခုံ နှစ်ခါ မရောင်းမိအောင် ကာတာ</div>
          <div class="row" style="top: 38vh"><span class="num">2</span><span class="term wide violet">Interface</span>ကားလိုင်းတွေ ခေါ်တဲ့ API ကို ပြောင်းတာ</div>
          <div class="row" style="top: 50vh"><span class="num">3</span><span class="term wide red">Dependency</span>wallet ကုမ္ပဏီ အသစ် ထပ်ချိတ်တာ</div>
          <div class="row" style="top: 62vh"><span class="num">4</span><span class="term wide blue">Structure</span>Booking ကို service အဖြစ် ခွဲထုတ်တာ</div>
          <div class="row" style="top: 74vh"><span class="num">5</span><span class="term wide green">ဆောက်ပုံ</span>pipeline ထဲ စစ်ဆေးချက် အသစ် ထည့်တာ</div>
        </div>
