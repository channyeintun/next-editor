  - id: adr-context
    chapter: ADR ကို မဆုံးဖြတ်ခင် ရေးခြင်း
    narration: >
      [[mark:a-close]] အဲဒီ စာတိုကို architecture decision record၊ အတိုကောက် ADR လို့ ခေါ်ပါတယ်။ ဘာကို
      ဘာကြောင့် ဆုံးဖြတ်ခဲ့လဲ ဆိုတာ ရေးမှတ်ထားတဲ့ စာတစ်မျက်နှာ၊ နှစ်မျက်နှာလောက်ပါပဲ။ code နဲ့အတူ
      repository ထဲမှာ text file အဖြစ် ထားတာမို့၊ code ကို ဖတ်တဲ့သူက ဘေးနားမှာတင် တွေ့ရပါတယ်။
      [[mark:a-parts]] ပုံစံကလည်း တိုပါတယ်။ ခေါင်းစဉ် တစ်ကြောင်းနဲ့ အပိုင်း ငါးပိုင်းပဲ ရှိပါတယ်။ ထိုင်ခုံ
      ကိစ္စအတွက် တစ်ပိုင်းချင်း ဖြည့်ကြည့်ရအောင်။
      [[mark:a-status]] ပထမဆုံး Status ကို Proposed၊ ဆိုလိုတာက အဆိုပြုထားဆဲလို့ ရေးပါမယ်။ ဒီတစ်ခါတော့
      အရင် ငြင်းပြီးမှ မှတ်တမ်းတင်တာ မဟုတ်ဘဲ၊ မဆုံးဖြတ်ခင်မှာ စာနဲ့ အရင် ရေးကြည့်တာပါ။
      ရေးကြည့်မှ ကိုယ့် အတွေးထဲက ကွက်လပ်တွေကို မြင်ရတာမို့၊ ADR က မှတ်တမ်း တစ်ခုတင် မဟုတ်ဘဲ စဉ်းစားဖို့
      ကိရိယာ တစ်ခုလည်း ဖြစ်ပါတယ်။
      [[mark:a-forces]] Context အောက်မှာ ဒီ ဆုံးဖြတ်ချက်ကို ဘာတွေက ဖိအားပေးနေလဲ ဆိုတာ အရင် ရေးပါတယ်။ ထိုင်ခုံ
      တစ်ခုံကို app ကပဲ ရောင်းရောင်း၊ ကောင်တာကပဲ ရောင်းရောင်း နှစ်ခါ ရောင်းမိလို့ မရပါဘူး။ ပြီးတော့ သင်္ကြန်
      လက်မှတ် ဖွင့်ရောင်းတဲ့ မနက်လို အချိန်မျိုးမှာ ပျက်နိုင်တဲ့ အပိုင်း နည်းလေ ကောင်းလေပါ။
      [[mark:a-options]] ပြီးရင် ရွေးစရာတွေကို ရေးပါတယ်။ ပထမ ရွေးစရာက အခု သုံးနေတဲ့အတိုင်း၊ ခရီးစဉ် တစ်ခုရဲ့
      ထိုင်ခုံ တစ်ခုံအတွက် row တစ်ခုပဲ ရှိခွင့်ပေးတဲ့ database ရဲ့ unique constraint ပါ။ ဒုတိယ ရွေးစရာက architect
      အသစ် အဆိုပြုတဲ့ lock service ပါ။ ထိုင်ခုံကို မရောင်းခင် ရောင်းခွင့်ကို အရင် တောင်းရတဲ့ သီးခြား service
      တစ်ခုပါ။ ရွေးစရာ တစ်ခုတည်းပဲ ရေးထားတဲ့ ADR ဆိုရင်တော့၊ တကယ် စဉ်းစားခဲ့တာ ဟုတ်ရဲ့လားလို့ သံသယ
      ဝင်စရာပါ။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
      - {
          title: "Facilitating Software Architecture (Harmel-Law)",
          url: "https://oreil.ly/FacilitatingSoftwareArch",
        }
    actions:
      - { id: close-three, type: whiteboard.apply, at: { mark: a-close }, open: false }
      - {
          id: open-notebook,
          type: workspace.openFile,
          at: { afterAction: close-three },
          path: notebook/47-adr-seat-uniqueness.md,
        }
      - id: sel-parts
        type: editor.select
        at: { mark: a-parts }
        target:
          file: notebook/47-adr-seat-uniqueness.md
          text: "## Status\n\n## Context\n\n## Decision\n\n## Consequences\n\n## Compliance"
      - id: type-status
        type: editor.type
        at: { mark: a-status }
        cadence: line-by-line
        target: { file: notebook/47-adr-seat-uniqueness.md, after: "## Status\n" }
        text: "Proposed\n"
      - id: type-forces
        type: editor.type
        at: { mark: a-forces }
        cadence: line-by-line
        target: { file: notebook/47-adr-seat-uniqueness.md, after: "## Context\n" }
        text: "- ထိုင်ခုံ တစ်ခုံကို app ကရော ကောင်တာကရော နှစ်ခါ ရောင်းလို့ မရဘူး\n- သင်္ကြန် peak မှာ ပျက်နိုင်တဲ့ အပိုင်း နည်းလေ ကောင်းလေ\n"
      - id: type-options
        type: editor.type
        at: { mark: a-options }
        cadence: line-by-line
        target: { file: notebook/47-adr-seat-uniqueness.md, after: "နည်းလေ ကောင်းလေ\n" }
        text: "- Option 1: database ရဲ့ unique constraint (ခရီးစဉ် + ထိုင်ခုံ = row တစ်ခု)\n- Option 2: lock service သီးခြား တစ်ခု (မရောင်းခင် ရောင်းခွင့် တောင်း)\n"

  - id: adr-decision
    chapter: Decision၊ Consequences နဲ့ Compliance
    narration: >
      [[mark:d-decision]] Decision ကို ကိုယ်တို့ ဘာလုပ်မယ် ဆိုတဲ့ ပုံစံနဲ့၊ ဘာကြောင့်လဲ ဆိုတာပါ တွဲပြီး
      ရေးပါတယ်။ ဆုံးဖြတ်ချက်က unique constraint ကို ဆက်သုံးမယ် ဆိုတာပါ။ ဘာကြောင့်လဲဆိုတော့ constraint က
      data ရှိတဲ့ နေရာမှာပဲ၊ ရေးတဲ့ အချိန်မှာပဲ စစ်ပေးလို့ပါ။
      [[mark:d-why]] lock service မှာတော့ ရောင်းခွင့် ရထားတဲ့ process တစ်ခုက ခဏ ရပ်သွားပြီး၊ ရောင်းခွင့်
      သက်တမ်းကုန်မှ ပြန်နိုးလာတာမျိုး ဖြစ်နိုင်ပါတယ်။ အဲဒီအခါ data သိမ်းတဲ့ဘက်က နောက်ဆုံး တစ်ခါ
      ထပ်စစ်ပေးမှ စိတ်ချရပါတယ်။ ဆိုတော့ lock service ထည့်လည်း database ရဲ့ စစ်ဆေးမှုကို အစားမထိုးနိုင်ဘဲ၊
      ထိန်းရမယ့် အပိုင်း တစ်ခုပဲ တိုးလာမှာပါ။
      [[mark:d-cons]] Consequences အောက်မှာ ရတာရော ပေးရတာပါ ရေးရပါတယ်။ ရတာက ထိန်းရမယ့် system အသစ်
      မတိုးတာနဲ့၊ ဘယ် code ကပဲ ရေးရေး ကာကွယ်ပြီးသား ဖြစ်တာပါ။
      [[mark:d-minus]] ပေးရတာကတော့ ထိုင်ခုံ ရောင်းတဲ့ write အားလုံးက database ရဲ့ ရေးခွင့်ရှိတဲ့ မိတ္တူ၊ leader
      တစ်ခုတည်းကို ဖြတ်ရတာပါ။ ပြီးတော့ database က ငြင်းလိုက်တဲ့ write ကို ခုံ မရတော့ဘူးလို့ ပြပေးဖို့ code
      ဘက်က handle လုပ်ပေးရပါတယ်။ အားနည်းချက်ကို ရိုးရိုးသားသား ရေးထားမှ၊ နောက် နှစ်နှစ်မှာ ဖတ်တဲ့သူက
      အခြေအနေ ပြောင်းပြီလား ဆိုတာ ကိုယ်တိုင် အကဲဖြတ်နိုင်မှာပါ။
      [[mark:d-comp]] နောက်ဆုံး အပိုင်း Compliance က ဒီ ဆုံးဖြတ်ချက်ကို တကယ် လိုက်နာနေလား ဘယ်လို စစ်မလဲ
      ဆိုတာပါ။ စာထဲမှာ ရေးထားရုံနဲ့ဆို တစ်နေ့ တစ်ယောက်ယောက်က constraint ကို မသိဘဲ ဖြုတ်မိနိုင်ပါတယ်။
      ဒါကြောင့် pipeline ထဲမှာ ခုံ တစ်ခုံတည်းကို ပြိုင်တူ နှစ်ခါ ရောင်းကြည့်တဲ့ test တစ်ခု ထားပြီး၊ ညတိုင်းလည်း
      နှစ်ခါ ရောင်းမိတဲ့ ခုံ မရှိဘူး ဆိုတာ တိုက်စစ်ပါမယ်။ ဒီလို အလိုအလျောက် စစ်ဆေးချက်၊ fitness function
      တွေက ADR ထဲက ဆုံးဖြတ်ချက်ကို စောင့်ပေးတာပါ။
      [[mark:d-title]] အားလုံး ရေးပြီးမှ ခေါင်းစဉ်ကို ဆုံးဖြတ်ချက် တစ်ကြောင်းနဲ့ ဖြည့်ပါမယ်။ ခေါင်းစဉ်ကို
      ဖတ်ရုံနဲ့ ဘာ ဆုံးဖြတ်ထားလဲ သိရပါမယ်။ ADR တစ်စောင်မှာ ဆုံးဖြတ်ချက် တစ်ခုပဲ ပါရပါတယ်။ ထိုင်ခုံကို
      ဆယ်မိနစ် hold လုပ်တာလို ကိစ္စကတော့ သီးခြား ADR တစ်စောင် ဖြစ်ရပါမယ်။
      [[mark:d-advice]] Status က Proposed ပဲ ရှိသေးတာမို့၊ ဒီ draft ကို team lead တွေနဲ့ operations engineer
      တွေဆီ ပို့ပြီး တစ်ပတ် အကြံတောင်းပါမယ်။ အစည်းအဝေးမှာဆို အသံကျယ်တဲ့သူရဲ့ အမြင်က နိုင်သွားတတ်ပေမဲ့၊
      စာထဲမှာတော့ မတူတဲ့ အမြင်တွေကို အေးအေးဆေးဆေး ထည့်ရေးနိုင်ပါတယ်။ သဘောတူပြီဆိုမှ Accepted ဖြစ်မှာပါ။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
      - {
          title: "Facilitating Software Architecture (Harmel-Law)",
          url: "https://oreil.ly/FacilitatingSoftwareArch",
        }
      - {
          title: "Designing Data-Intensive Applications, 2nd edition (Kleppmann, Riccomini)",
          url: "https://oreil.ly/DesigningDataIntensiveApps2",
        }
    actions:
      - id: type-decision
        type: editor.type
        at: { mark: d-decision }
        cadence: line-by-line
        target: { file: notebook/47-adr-seat-uniqueness.md, after: "## Decision\n" }
        text: "- ထိုင်ခုံ နှစ်ခါ မရောင်းမိအောင် database ရဲ့ unique constraint ကို သုံးမယ်\n"
      - id: type-why
        type: editor.type
        at: { mark: d-why }
        cadence: line-by-line
        target: { file: notebook/47-adr-seat-uniqueness.md, after: "unique constraint ကို သုံးမယ်\n" }
        text: "- ဘာကြောင့်: ရေးတဲ့ အချိန်မှာ data ဘေးမှာတင် စစ်တယ်။ lock service ပါလည်း database က ထပ်စစ်ရတုန်းပဲ\n"
      - id: type-plus
        type: editor.type
        at: { mark: d-cons }
        cadence: line-by-line
        target: { file: notebook/47-adr-seat-uniqueness.md, after: "## Consequences\n" }
        text: "+ ထိန်းရမယ့် system အသစ် မတိုးဘူး\n+ ဘယ် code ကပဲ ရေးရေး ကာကွယ်ပြီးသား\n"
      - id: type-minus
        type: editor.type
        at: { mark: d-minus }
        cadence: line-by-line
        target: { file: notebook/47-adr-seat-uniqueness.md, after: "ကာကွယ်ပြီးသား\n" }
        text: "− ထိုင်ခုံ write အားလုံး leader တစ်ခုတည်းကို ဖြတ်ရတယ်\n− database ငြင်းတဲ့ write ကို ခုံ မရတော့ဘူးလို့ ပြဖို့ code က handle လုပ်ရတယ်\n"
      - id: type-compliance
        type: editor.type
        at: { mark: d-comp }
        cadence: line-by-line
