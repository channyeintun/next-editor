  - id: worth
    chapter: ဘယ် ဆုံးဖြတ်ချက်တွေ ADR ရေးထိုက်သလဲ
    narration: >
      [[mark:w-open]] ဒါဆို ဆုံးဖြတ်ချက်တိုင်းအတွက် ADR ရေးရမလား။ မရေးရပါဘူး။ ADR ရေးထိုက်တာက architecture ကို
      ထိတဲ့ ဆုံးဖြတ်ချက် ငါးမျိုးပါ။
      [[mark:w-1]] ပထမက architecture characteristic၊ system က ဘယ်လောက် ကောင်းကောင်း လုပ်နိုင်ရမလဲ ဆိုတဲ့
      အရည်အသွေးကို ထိတဲ့ ဆုံးဖြတ်ချက်ပါ။ ထိုင်ခုံ constraint က ဒီထဲမှာ ပါပါတယ်။
      [[mark:w-2]] ဒုတိယက interface ပါ။ ကားလိုင်းတွေရဲ့ system က လှမ်းခေါ်နေတဲ့ API လို၊ တခြားသူတွေ
      အားကိုးနေတဲ့ ပုံစံကို ပြောင်းတော့မယ် ဆိုရင်ပါ။
      [[mark:w-3]] တတိယက dependency ပါ။ wallet ကုမ္ပဏီ အသစ် တစ်ခုလို၊ ကိုယ် မထိန်းနိုင်တဲ့ အရာ တစ်ခုကို
      ထပ်မှီခိုတော့မယ် ဆိုရင်ပါ။
      [[mark:w-4]] စတုတ္ထက structure၊ ဆိုလိုတာက system ကို ဘယ်လို အပိုင်းခွဲပြီး ဘယ်လို ဆက်ထားလဲ ဆိုတာကို
      ပြောင်းတဲ့ ဆုံးဖြတ်ချက်ပါ။ Booking ကို service အဖြစ် ခွဲထုတ်ခဲ့တာမျိုးပါ။
      [[mark:w-5]] နောက်ဆုံးက system ကို ဘယ်လို ဆောက်ပြီး production ဆီ ဘယ်လို ပို့လဲ ဆိုတဲ့ နည်းကို
      ပြောင်းတာပါ။ pipeline ထဲမှာ စစ်ဆေးချက် အသစ် ထည့်တာမျိုးပါ။ function နာမည် ပေးတာ၊ unit test tool
      ရွေးတာလို ကိစ္စတွေကတော့ team ထဲမှာပဲ ဆုံးဖြတ်လိုက်ရုံပါ။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
      - {
          title: "Facilitating Software Architecture (Harmel-Law)",
          url: "https://oreil.ly/FacilitatingSoftwareArch",
        }
    actions:
      - {
          id: show-worth,
          type: slide.show,
          at: { mark: w-open, offsetMs: -1200 },
          slideId: worth-an-adr,
        }
      - { id: point-w-1, type: slide.point, at: { mark: w-1 }, target: { x: 0.15, y: 0.35 } }
      - { id: point-w-2, type: slide.point, at: { mark: w-2 }, target: { x: 0.15, y: 0.47 } }
      - { id: point-w-3, type: slide.point, at: { mark: w-3 }, target: { x: 0.15, y: 0.59 } }
      - { id: point-w-4, type: slide.point, at: { mark: w-4 }, target: { x: 0.15, y: 0.71 } }
      - { id: point-w-5, type: slide.point, at: { mark: w-5 }, target: { x: 0.15, y: 0.83 } }

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ နှစ်နှစ်လောက် ကြာတော့ အခြေအနေ ပြောင်းလို့ ထိုင်ခုံ ဆုံးဖြတ်ချက်ကို
      ပြောင်းရတော့မယ် ဆိုပါစို့။
      [[mark:quiz-a]] ပထမ နည်းက ADR နံပါတ် ဆယ့်လေးကို ပြန်ဖွင့်ပြီး၊ ဆုံးဖြတ်ချက် အသစ်နဲ့ ပြင်ရေးလိုက်တာပါ။
      [[mark:quiz-b]] ဒုတိယ နည်းက အဟောင်းကို မထိဘဲ ADR အသစ် တစ်စောင် ရေးတာပါ။ ဘယ်နည်းကို ရွေးမလဲ။ lesson
      ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ နည်းပါ။ ဘာကြောင့်လဲဆိုတော့ ADR ရဲ့ တန်ဖိုးက သမိုင်းကြောင်းမှာ
      ရှိလို့ပါ။ အဟောင်းကို ပြင်ရေးလိုက်ရင် အရင်က ဘာကို သိထားပြီး ဘာကြောင့် အဲဒီလို ဆုံးဖြတ်ခဲ့လဲ ဆိုတာ
      ပျောက်သွားပါတယ်။ ဒီနေ့ ကိုယ်တို့ ကြုံခဲ့တဲ့ ပြဿနာကို ကိုယ်တိုင် ပြန်ဖန်တီးမိမှာပါ။
      [[mark:quiz-link]] ဒါကြောင့် လက်ခံပြီးသား ADR ကို ဘယ်တော့မှ ပြင်မရေးပါဘူး။ အဟောင်းမှာ Status
      တစ်ကြောင်းကိုပဲ Superseded၊ ဆိုလိုတာက အစားထိုးခံရပြီလို့ ပြောင်းပြီး၊ ADR အသစ်ဆီ ညွှန်းပေးထားပါတယ်။
      ဖတ်တဲ့သူက နှစ်စောင်လုံးကို ဖတ်ပြီး၊ ဘာကြောင့် ပြောင်းခဲ့လဲ ဆိုတာပါ သိနိုင်ပါတယ်။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
      - {
          title: "Facilitating Software Architecture (Harmel-Law)",
          url: "https://oreil.ly/FacilitatingSoftwareArch",
        }
    actions:
      - { id: close-worth, type: slide.close, at: { mark: quiz } }
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { afterAction: close-worth },
          open: true,
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - {
          id: draw-quiz-a,
          type: whiteboard.apply,
          at: { mark: quiz-a },
          upsertIds: [q-a],
          drawMs: 900,
        }
      - {
          id: draw-quiz-b,
          type: whiteboard.apply,
          at: { mark: quiz-b },
          upsertIds: [q-b],
          drawMs: 900,
        }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-reason,
          type: whiteboard.apply,
          at: { mark: quiz-answer, offsetMs: 2600 },
          upsertIds: [q-reason],
          drawMs: 1200,
        }
      - {
          id: draw-link,
          type: whiteboard.apply,
          at: { mark: quiz-link },
          upsertIds: [q-old, q-old-l, q-arrow, q-new, q-new-l],
          drawMs: 2400,
        }

  - id: your-turn
    chapter: ကိုယ့် system အတွက်
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ ကိုယ့် system ထဲမှာလည်း လူတိုင်း လိုက်နာနေပေမဲ့၊ ဘာကြောင့်လဲ ဆိုတာ
      ဘယ်မှာမှ ရေးမထားတဲ့ ဆုံးဖြတ်ချက် တစ်ခုခု ရှိမှာပါ။
      [[mark:turn-ctx]] lesson ကို pause လုပ်ပြီး၊ အဲဒီ ဆုံးဖြတ်ချက်အတွက် ခေါင်းစဉ် တစ်ကြောင်းနဲ့ ဒီ Context
      အပိုင်းကို ကိုယ့်ဟာနဲ့ အစားထိုး ရေးကြည့်ပါ။ ဘာတွေက ဖိအားပေးခဲ့လဲ၊ ဘာ ရွေးစရာတွေ ရှိခဲ့လဲ ဆိုတာပါ။
      [[mark:turn-2]] ရေးရင်း ဘာကြောင့်လဲ ဆိုတာ ကိုယ်တိုင်လည်း မသိတာ တွေ့ရင်၊ သိနိုင်မယ့်သူ တစ်ယောက်ကို
      ဒီအပတ်ထဲမှာပဲ မေးကြည့်ပါ။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: turn }, open: false }
      - id: sel-title
        type: editor.select
        at: { mark: turn, offsetMs: 2200 }
        target:
          {
            file: notebook/47-adr-seat-uniqueness.md,
            text: "# ADR-014 · ထိုင်ခုံ နှစ်ခါ မရောင်းမိအောင် database constraint ကို သုံးမယ်",
          }
      - id: sel-context
        type: editor.select
        at: { mark: turn-ctx, offsetMs: 2500 }
        target:
          file: notebook/47-adr-seat-uniqueness.md
          text: "## Context\n- ထိုင်ခုံ တစ်ခုံကို app ကရော ကောင်တာကရော နှစ်ခါ ရောင်းလို့ မရဘူး\n- သင်္ကြန် peak မှာ ပျက်နိုင်တဲ့ အပိုင်း နည်းလေ ကောင်းလေ\n- Option 1: database ရဲ့ unique constraint (ခရီးစဉ် + ထိုင်ခုံ = row တစ်ခု)\n- Option 2: lock service သီးခြား တစ်ခု (မရောင်းခင် ရောင်းခွင့် တောင်း)"

  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ ဆုံးဖြတ်ချက်တွေက ကြောက်လို့ မချတာ၊ ဘာကြောင့်လဲ ပျောက်လို့ ထပ်ငြင်းရတာ၊ chat ထဲမှာ
      မြုပ်နေတာ ဆိုတဲ့ ပုံစံ သုံးမျိုးနဲ့ ပျက်တတ်ပါတယ်။ ADR က ဆုံးဖြတ်ချက် တစ်ခုရဲ့ Context၊ Decision၊
      Consequences နဲ့ Compliance ကို တိုတိုရေးထားတဲ့ စာပါ။ မဆုံးဖြတ်ခင် ရေးရင် စဉ်းစားဖို့ရော အကြံတောင်းဖို့ပါ
      အသုံးဝင်ပြီး၊ ပြောင်းစရာ ရှိရင်လည်း အဟောင်းကို မပြင်ဘဲ အသစ်နဲ့ အစားထိုးရပါတယ်။
      [[mark:two-years]] နောက် နှစ်နှစ်မှာ လူအသစ် တစ်ယောက်က ဘယ်သူ့ကိုမှ မမေးဘဲ ဖတ်ပြီး နားလည်နိုင်ရင်၊ အဲဒီ
      ADR က သူ့အလုပ်ကို လုပ်ပြီးပါပြီ။
      [[mark:next]] နောက် lesson မှာတော့ သင်္ကြန် မတိုင်ခင် system ရဲ့ ဘယ်အပိုင်းမှာ အန္တရာယ် အများဆုံးလဲ
      ဆိုတာကို လူတိုင်း မြင်အောင် ကြည့်တဲ့နည်း၊ risk ကို အကဲဖြတ်တာကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions: []

checks:
