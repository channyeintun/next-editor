build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 8147

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: need
    chapter: မေးခွန်း တစ်ခုတည်း၊ လေးခါမြောက်
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ စည်းကမ်း တစ်ခုကို ချိုးဖောက်နေပြီးသား system ထဲမှာ၊ အလိုအလျောက် စစ်ဆေးချက်ကို
      တစ်ဆင့်ချင်း တင်းကျပ်သွားပုံကို လေ့လာခဲ့ပါတယ်။
      [[mark:n-open]] ဒီအပတ်မှာတော့ ပြီးခဲ့တဲ့လကမှ ဝင်လာတဲ့ architect အသစ်က မေးခွန်း တစ်ခု မေးလာပါတယ်။
      ထိုင်ခုံ တစ်ခုံကို နှစ်ခါ မရောင်းမိအောင် database ရဲ့ constraint ကိုပဲ ဘာလို့ အားကိုးထားတာလဲ၊ lock service
      သီးခြား တစ်ခု ဘာလို့ မသုံးတာလဲ တဲ့။ ကိုယ် အပါအဝင် ကျန်တဲ့ architect သုံးယောက်လုံး အဖြေကို ချက်ချင်း
      မပြောနိုင်ခဲ့ပါဘူး။
      [[mark:n-1]] Booking team lead မောင်မောင် ကတော့ ဒီ အငြင်းအခုံကို မှတ်မိနေပါတယ်။ Booking ကို service
      အဖြစ် ခွဲထုတ်တုန်းက တစ်ခါ ငြင်းခဲ့ကြဖူးတာပါ။
      [[mark:n-2]] သင်္ကြန် peak အတွက် ပြင်ဆင်တုန်းကလည်း တစ်ခါ ထပ်ငြင်းခဲ့ကြပါတယ်။
      [[mark:n-3]] မနှစ်က service တွေကို platform အသစ်ပေါ် ရွှေ့တုန်းကလည်း နောက်တစ်ခါ ငြင်းခဲ့ကြပါသေးတယ်။
      [[mark:n-same]] သုံးခါလုံး နှစ်နာရီလောက် ဆွေးနွေးပြီး၊ constraint ကိုပဲ ဆက်သုံးမယ်လို့ အဆုံးသတ်ခဲ့တာပါ။
      [[mark:n-why]] ဒါပေမဲ့ ဘာကြောင့် အဲဒီလို ဆုံးဖြတ်ခဲ့လဲ ဆိုတာကိုတော့ ဘယ်မှာမှ ရေးမထားခဲ့ပါဘူး။
      [[mark:n-q]] ဆိုတော့ အခု လေးခါမြောက် ထပ်ငြင်းရတော့မလို ဖြစ်နေပါပြီ။ ဒီ သံသရာကို ဘယ်လို ဖြတ်မလဲ
      ဆိုတာ ဒီနေ့ ကြည့်ကြရအောင်။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - {
          id: draw-n-open,
          type: whiteboard.apply,
          at: { mark: n-open },
          open: true,
          upsertIds: [n-title],
        }
      - {
          id: draw-n-1,
          type: whiteboard.apply,
          at: { mark: n-1 },
          upsertIds: [n-b1, n-l1],
          drawMs: 1200,
        }
      - {
          id: draw-n-2,
          type: whiteboard.apply,
          at: { mark: n-2 },
          upsertIds: [n-a1, n-b2, n-l2],
          drawMs: 1400,
        }
      - {
          id: draw-n-3,
          type: whiteboard.apply,
          at: { mark: n-3 },
          upsertIds: [n-a2, n-b3, n-l3],
          drawMs: 1400,
        }
      - {
          id: draw-n-same,
          type: whiteboard.apply,
          at: { mark: n-same },
          upsertIds: [n-brace, n-same],
          drawMs: 1300,
        }
      - {
          id: draw-n-why,
          type: whiteboard.apply,
          at: { mark: n-why },
          upsertIds: [n-why],
          drawMs: 900,
        }
      - { id: draw-n-q, type: whiteboard.apply, at: { mark: n-q }, upsertIds: [n-q], drawMs: 1000 }

  - id: three-ways
    chapter: ဆုံးဖြတ်ချက် ပျက်ပုံ သုံးမျိုး
    narration: >
      [[mark:f-open]] ဒါက ခရီးဖော် တစ်ခုတည်းမှာ ဖြစ်တာ မဟုတ်ပါဘူး။ architecture ဆုံးဖြတ်ချက်တွေက ပုံစံ
      သုံးမျိုးနဲ့ ပျက်တတ်ပါတယ်။
      [[mark:f-1]] ပထမ တစ်မျိုးက မှားသွားမှာ ကြောက်လို့ မဆုံးဖြတ်ဘဲ ရွှေ့နေတာပါ။ ခရီးဖော် မှာဆိုရင် ပါဆယ်
      လုပ်ငန်းအတွက် ငွေချေတာကို ရှိပြီးသား Payment service နဲ့ပဲ လုပ်မလား၊ သီးသန့် ဆောက်မလား ဆိုတာ သုံးလ
      ရှိပါပြီ။ ဘယ်သူမှ မဆုံးဖြတ်ရဲသေးပါဘူး။ အဲဒီ ကြားထဲမှာ ပါဆယ် ဘက်က developer တွေက ယာယီ code တွေ
      ရေးနေရပါပြီ။
      [[mark:f-2]] ဒုတိယ တစ်မျိုးက ဆုံးဖြတ်ပြီးသားကို ထပ်ခါထပ်ခါ ပြန်ငြင်းရတာပါ။ ဘာကြောင့် ဆိုတဲ့
      အကြောင်းပြချက် ပျောက်သွားတဲ့အခါ၊ လူအသစ် တစ်ယောက် မေးတိုင်း အစကနေ ပြန်စရပါတယ်။ ထိုင်ခုံ constraint
      ကိစ္စက ဒီ အမျိုးအစားပါ။
      [[mark:f-3]] တတိယ တစ်မျိုးက ဆုံးဖြတ်ချက်က chat ထဲမှာ မြုပ်နေတာပါ။ မောင်မောင် နဲ့ အတူ ပြန်ရှာကြည့်တော့
      အရင် ဆွေးနွေးချက် တစ်ခုကို message နှစ်ရာကျော်တဲ့ chat thread တစ်ခုထဲမှာ တွေ့ပါတယ်။ အဲဒီ channel ထဲမှာ
      မပါခဲ့တဲ့သူတွေကတော့ ဆုံးဖြတ်ချက် ရှိမှန်းတောင် မသိကြပါဘူး။
      [[mark:f-fix]] သုံးမျိုးလုံးကို သက်သာစေတဲ့ အလေ့အထ တစ်ခု ရှိပါတယ်။ ဆုံးဖြတ်ချက် တစ်ခုကို စာတို တစ်စောင်နဲ့၊
      လူတိုင်း ရှာတွေ့နိုင်တဲ့ နေရာ တစ်ခုတည်းမှာ ရေးမှတ်ထားတာပါ။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
