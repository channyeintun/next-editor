build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 5107
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "Generative AI ရဲ့ loop"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ model က နောက် token ကို ဖြစ်နိုင်ခြေနဲ့ ရွေးပြီး စာ ဆက်ရေးတာ၊ temperature
      နဲ့ max tokens က အဖြေကို ဘယ်လို ပြောင်းစေလဲ ဆိုတာ မြင်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ generative AI ရဲ့ loop ကို
      အဆင့်လိုက် ဆောက်ကြည့်ပါမယ်။ [[mark:draw-mini]] blueprint မှာ ကြည့်ရင်၊ ဒီနေ့ ဆောက်မှာက
      intelligence အလွှာထဲက helper တစ်ခုပါ။ [[mark:draw-today]] ကောင်တာနဲ့ ဆိုင်ရဲ့ page ကို တာဝန်ယူတဲ့ လှလှ က menu
      အသစ် ထွက်တိုင်း ဖော်ပြချက် ရေးရပါတယ်။ helper က သူ့အတွက် မူကြမ်းတွေ ရေးပေးမှာ ဖြစ်ပြီး၊ ရွေးတာ၊ ပြင်တာကိုတော့
      လှလှ ကိုယ်တိုင် လုပ်ပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Generative AI: Create new content (the generative AI loop)",
          url: "https://web.dev/learn/ai/generative",
        }
      - {
          title: "web.dev Learn AI: Introduction to AI on the web (the blueprint)",
          url: "https://web.dev/learn/ai/introduction",
        }
      - {
          title: "web.dev Learn AI: Welcome to Learn AI! (course credit: written by Dr. Janna Lipenkova with editorial guidance from Alexandra Klepper; text CC BY 4.0, code Apache 2.0; adapted into Burmese with the course's own tea-shop examples)",
          url: "https://web.dev/learn/ai/welcome",
        }
      - {
          title: "Creative Commons: Attribution 4.0 International (CC BY 4.0), the licence of the web.dev Learn AI text adapted here",
          url: "https://creativecommons.org/licenses/by/4.0/",
        }
    actions:
      - {
          id: open-board-a,
          type: whiteboard.apply,
          at: { scene: start, offsetMs: -450 },
          open: true,
          clear: true,
          upsertIds: [a-title],
        }
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - {
          id: draw-mini,
          type: whiteboard.apply,
          at: { mark: draw-mini },
          upsertIds:
            [
              a-opp,
              a-opp-t,
              a-arrow-1,
              a-data,
              a-data-t,
              a-intel,
              a-intel-t,
              a-ux,
              a-ux-t,
              a-arrow-2,
              a-gov,
              a-gov-t,
            ],
          drawMs: 2400,
        }
      - {
          id: draw-today,
          type: whiteboard.apply,
          at: { mark: draw-today },
          upsertIds: [a-today],
          drawMs: 1000,
        }

  - id: define
    chapter: "Use case နဲ့ base model"
    narration: >
      [[mark:draw-loop]] loop ရဲ့ ပထမ အဆင့်က use case နဲ့ ဘာ ဆောက်မလဲ ဆိုတာကို သတ်မှတ်တာပါ။ [[mark:draw-define]] input က item နာမည်
      တစ်ကွက်နဲ့ လှလှ စိတ်ကြိုက် ရေးတဲ့ မှတ်ချက် တစ်ကွက် ပါတဲ့ စာသားပါ။ output ကတော့ ဖော်ပြချက် တိုတို သုံးခု
      ဖြစ်ပြီး၊ သုံးမယ့်သူက ဆိုင်ရဲ့ အစားအသောက်ကို ကောင်းကောင်း သိတဲ့ ဝန်ထမ်းတွေပါ။ [[mark:draw-quality]] အဖြေ
      ကောင်းမကောင်း ဆုံးဖြတ်မယ့် စံကိုလည်း အစကတည်းက သတ်မှတ်ထားရပါမယ်။ ဒီမှာတော့ တိုရမယ်၊ menu နဲ့ ကိုက်ရမယ်၊
      လက်ဖက်ရည်ဆိုင်ရဲ့ နွေးထွေးတဲ့ လေသံ ရှိရမယ် ဆိုတာပါ။ အောင်မြင်မှုကို ဘယ်လို တိုင်းမလဲ ဆိုတာကိုတော့ evaluation
      lesson တွေမှာ ကြည့်ပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Generative AI: Create new content (define your use case)",
          url: "https://web.dev/learn/ai/generative",
        }
    actions:
      - {
          id: draw-loop,
          type: whiteboard.apply,
          at: { mark: draw-loop },
          clear: true,
          upsertIds:
            [
              b-title,
              b-1,
              b-1-t,
              b-a1,
              b-2,
              b-2-t,
              b-a2,
              b-3,
              b-3-t,
              b-a3,
              b-4,
              b-4-t,
              b-a4,
              b-5,
              b-5-t,
              b-back,
            ],
          drawMs: 3500,
        }
      - {
          id: draw-define,
          type: whiteboard.apply,
          at: { mark: draw-define },
          upsertIds: [f-1a],
          drawMs: 1200,
        }
      - {
          id: draw-quality,
          type: whiteboard.apply,
          at: { mark: draw-quality },
          upsertIds: [f-1b],
          drawMs: 1200,
        }

  - id: base-model
    narration: >
      [[mark:draw-base]] ဒုတိယ အဆင့်က base model ရွေးတာပါ။ base model ဆိုတာ data အများကြီးနဲ့ ကြို train ပြီးသား model
      ပါ။ generative model တွေက predictive model ထက် အများကြီး ကြီးပြီး ရှုပ်ထွေးလို့၊ ကိုယ်တိုင် train မလုပ်ဘဲ
      ရှိပြီးသား model ပေါ်မှာ ဆောက်တာ ပိုကောင်းပါတယ်။ [[mark:draw-base-choice]] ဘယ် model ရွေးလဲ ဆိုတာက feature ရဲ့
      စွမ်းရည်၊ ကုန်ကျစရိတ်၊ စိတ်ကြိုက် ပြင်လို့ ရမရနဲ့ user ရဲ့ data ဘယ်ကို ရောက်မလဲ ဆိုတာကို ဆုံးဖြတ်ပါတယ်။ model
      ကို ဘယ်မှာ run မလဲ ဆိုတဲ့ platform နဲ့လည်း ဆက်နေလို့ နောက်ပိုင်း ပြန်ကြည့်ပါမယ်။ ဒီ lesson မှာတော့ Gemma ဆိုတဲ့
      open model သေးသေးလေးကို သုံးပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Generative AI: Create new content (select the base model)",
          url: "https://web.dev/learn/ai/generative",
        }
      - {
          title: "web.dev Learn AI: Choose your platform",
          url: "https://web.dev/learn/ai/platform",
        }
    actions:
      - {
          id: draw-base,
          type: whiteboard.apply,
          at: { mark: draw-base },
          upsertIds: [f-2],
          drawMs: 1200,
        }

  - id: prompt
    chapter: "Prompt နဲ့ context"
    narration: >
      [[mark:close-loop]] code ထဲမှာ ကြည့်ရအောင်။ [[mark:panel-ready]] ညာဘက် AI panel မှာ helper ရဲ့ အဖြေကို မြင်ရပါတယ်။
      ဒါက model ကို ဒီ prompt နဲ့ ကြိုပြီး run ထားတုန်းက တကယ် ထွက်လာခဲ့တဲ့ အဖြေ ဖြစ်လို့ card ရဲ့ badge ကလည်း ကြိုမှတ်ထားတဲ့
      အဖြေလို့ ပြနေပါတယ်။ အပေါ်က item ခလုတ်တွေနဲ့ notes ကတော့ lesson အတွက် ပြင်ဆင်ထားတဲ့ နမူနာ data ပါ။
      [[mark:sel-system]] prompt ဆိုတာ model ကို ဘာလုပ်ရမလဲ ပြောတဲ့ input ပါ။ ပထမ အပိုင်းက system prompt ဖြစ်ပြီး၊
      developer ရေးထားတဲ့ request တိုင်းမှာ မပြောင်းဘဲ ပါနေတဲ့ စည်းကမ်းတွေပါ။ ဒီမှာတော့ ဝန်ထမ်းတွေအတွက် menu
      ဖော်ပြချက်ကို မြန်မာလို ရေးဖို့ ပြောထားပါတယ်။ [[mark:sel-request]] request က ဖော်ပြချက် သုံးခုကို တစ်ကြောင်းစီ ရေးခိုင်းပြီး၊ item
      နာမည်ကို ထည့်ပေးတာပါ။ prompt ကို English နဲ့ ရေးပြီး၊ item data နဲ့ အဖြေကိုတော့ မြန်မာလို ထားပါတယ်။ chat app
      မှာဆိုရင် user ရိုက်တဲ့ instruction လည်း ပါလာပါမယ်။ [[mark:read-generic]] အဖြေကို ကြည့်ပါ။ သုံးကြောင်းလုံး item
      နာမည်နဲ့ စပြီး၊ နွေးထွေးတဲ့ အရသာ၊ မြန်မာ့ အရသာ ဆိုတဲ့ ဘယ် ဟင်းမှာမဆို ရေးလို့ ရတဲ့ စာတွေ ဖြစ်နေပါတယ်။ ပထမ
      စာကြောင်းမှာဆိုရင် နို့ထွက် ပရိုတင်း ပါတယ်လို့ ဆိုင်က တစ်ခါမှ မပြောဖူးတာကိုတောင် ရေးထားပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Generative AI: Create new content (prompt and context engineering)",
          url: "https://web.dev/learn/ai/generative",
        }
    actions:
      - { id: close-loop, type: whiteboard.apply, at: { mark: close-loop }, open: false }
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-done
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: ai-status }
        attribute: { name: data-state, value: "done" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-two-cards
        type: expect.preview
        at: { afterAction: expect-done }
        timeoutMs: 5000
        target: { by: testId, value: ai-cards }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-answer-badge
        type: expect.preview
        at: { afterAction: expect-two-cards }
        timeoutMs: 5000
        target: { by: testId, value: ai-answer-badge }
        textContains: "recorded · Gemma 4 E2B · greedy"
        retry: { maxAttempts: 2, delayMs: 300 }
      - {
          id: open-main,
          type: workspace.openFile,
          at: { afterAction: expect-answer-badge },
          path: src/main.js,
        }
      - id: sel-system
        type: editor.select
        at: { mark: sel-system }
        target:
          {
            file: src/main.js,
            text: "const system =\n  \"You help the staff of Shwe Tea House, a tea shop in Bahan, Yangon, write menu descriptions. \" +\n  \"Write in Burmese.\";\n",
            occurrence: 1,
          }
      - id: sel-request
        type: editor.select
        at: { mark: sel-request }
        target:
          {
            file: src/main.js,
            text: "  \"Write three short descriptions for this new menu item, one per line, with nothing else.\",\n  `Item: ${item.name}`,\n",
            occurrence: 1,
          }
      - id: expect-generic
        type: expect.preview
        at: { mark: read-generic }
        timeoutMs: 5000
        target: { by: testId, value: ai-answer }
        textContains: "နို့ထွက်ပရိုတင်း"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-checked-3
        type: expect.preview
        at: { afterAction: expect-generic }
        timeoutMs: 5000
        target: { by: testId, value: ai-checked }
        attribute: { name: data-count, value: "3" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: context
    narration: >
      [[mark:sel-item]] ဘာကြောင့်လဲဆိုတော့ model ဆီကို item နာမည်ကလွဲလို့ ဘာမှ မပို့ထားလို့ပါ။ request တစ်ခုအတွက်
      အသုံးဝင်ဆုံး အချက်တွေကိုပဲ ရွေးပြီး model ဆီ ပို့ပေးတာကို context engineering လို့ ခေါ်ပါတယ်။ ဒီ item အတွက်တော့
      page ရဲ့ notes မှာ မြင်ရတဲ့ လှလှ ရဲ့ မှတ်ချက်က အသုံးဝင်ဆုံး context ပါ။ [[mark:type-notes]] ဒါကြောင့် request
      ထဲကို ကောင်တာက မှတ်ချက် တစ်ကြောင်း ထည့်ပါမယ်။ [[mark:read-notes]] အဖြေ ပြောင်းသွားပါပြီ။ သောကြာနေ့၊ ကြက်သားနဲ့
      ဟင်းရည် ပျစ်ပျစ် ဆိုတာတွေကို မှတ်ချက်ထဲကနေ ယူသုံးလာပါတယ်။ [[mark:read-spicy]] ဒါပေမဲ့ ဒုတိယ စာကြောင်းမှာ စပ်စပ် လို့ ပါနေပါတယ်။
      မှတ်ချက်ထဲမှာ အစပ်အကြောင်း ဘယ်သူမှ မရေးထားလို့ ဒါက hallucination ပါ။ model က ဆိုင်ရဲ့ ဟင်းကို တကယ် မသိဘဲ
      ဖြစ်နိုင်လောက်တဲ့ စကားလုံးတွေကို ဆက်ရေးတာ ဖြစ်လို့ပါ။ model အဖြေ မထုတ်ခင် ဆိုင်ရဲ့ data ထဲက သက်ဆိုင်တဲ့
      အချက်တွေကို ရှာပြီး prompt ထဲ ထည့်ပေးတဲ့ RAG လို နည်းက ဒီလို အမှားကို လျှော့ပေးနိုင်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Generative AI: Create new content (prompt and context engineering; common pitfalls)",
          url: "https://web.dev/learn/ai/generative",
        }
      - {
          title: "web.dev Learn AI: Glossary and concepts (context engineering)",
          url: "https://web.dev/learn/ai/glossary",
        }
    actions:
      - id: sel-item
        type: editor.select
        at: { mark: sel-item }
        target: { file: src/main.js, text: "`Item: ${item.name}`", occurrence: 1 }
      - id: expect-notes-shown
        type: expect.preview
        at: { afterAction: sel-item }
        timeoutMs: 5000
        target: { by: testId, value: item-notes }
        textContains: "သောကြာနေ့ပဲ ရမယ်၊ ကြက်သား၊ ဟင်းရည် ပျစ်ပျစ်"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-notes
        type: editor.type
        at: { mark: type-notes }
        target: { file: src/main.js, after: "  `Item: ${item.name}`,\n", occurrence: 1 }
        text: "  `Notes from the counter: ${item.notes}`,\n"
        cadence: line-by-line
      - id: expect-notes-answer
        type: expect.preview
        at: { afterAction: type-notes }
        timeoutMs: 8000
        target: { by: testId, value: ai-answer }
        textContains: "သောကြာနေ့အတွက်"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-spicy
        type: expect.preview
        at: { mark: read-spicy }
        timeoutMs: 5000
        target: { by: testId, value: ai-checked-2 }
        textContains: "စပ်စပ်"
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: inference
    chapter: "Inference နဲ့ post-processing"
    narration: >
      [[mark:open-provenance]] ပြင်ဆင်ပြီးသား prompt ကို model ဆီ ပို့ပြီး အဖြေ ထုတ်ခိုင်းတာကို inference လို့
      ခေါ်ပါတယ်။ ဒီ ဖိုင်က ကြိုမှတ်ထားတဲ့ အဖြေတွေကို ဘယ် model၊ ဘယ် setting နဲ့ ထုတ်ခဲ့လဲ ပြောထားပါတယ်။
      [[mark:sel-decoding]] greedy ဆိုတာ ပြီးခဲ့တဲ့ lesson က temperature သုည လိုပဲ ဖြစ်နိုင်ခြေ အများဆုံး token ကို
      အမြဲ ရွေးတာ ဖြစ်လို့၊ message တူရင် အဖြေ အမြဲ တူပါတယ်။ ဒါကြောင့် temperature ကို လျှော့တာက
      အဖြေ တည်ငြိမ်အောင် လုပ်တဲ့ နည်း တစ်ခုပါ။ max tokens ကိုလည်း ၃၀၀ နဲ့
      ကန့်ထားပါတယ်။ [[mark:read-post]] inference ပြီးရင် အဖြေကို user မမြင်ခင် စစ်တာ၊ ပြင်တာကို post processing လို့
      ခေါ်ပါတယ်။ helper မှာ rule နှစ်ခု ထည့်ကြည့်ရအောင်။
    sources:
      - {
          title: "web.dev Learn AI: Generative AI: Create new content (inference and post-processing)",
          url: "https://web.dev/learn/ai/generative",
        }
    actions:
      - {
          id: open-provenance,
          type: workspace.openFile,
          at: { mark: open-provenance },
          path: data/PROVENANCE.md,
        }
      - id: sel-decoding
        type: editor.select
        at: { mark: sel-decoding }
        target:
          {
            file: data/PROVENANCE.md,
            text: "- Decoding: greedy (temperature 0), at most 300 new tokens, so the same messages always give the same answer",
            occurrence: 1,
          }

  - id: post
    narration: >
      [[mark:type-claim]] ပထမ rule က ဆိုင်က စစ်ပြလို့ မရတဲ့ အကောင်းဆုံး လို စကားလုံးနဲ့ ဆိုင်မှာ မရှိတဲ့ အခမဲ့ ဆိုတဲ့
      စကားလုံးကို ဖမ်းပါမယ်။ [[mark:read-claim]] Checked card က ဖော်ပြချက် တစ်ခုချင်းကို rule တွေနဲ့ စစ်ထားတဲ့ ရလဒ်ပါ။
      စစ်တာက code သက်သက်မို့ badge ကလည်း AI မပါဘူးလို့ ပြနေပါတယ်။ ဒီ item ရဲ့ သုံးခုလုံး အမှန်ခြစ် ရပါတယ်။
      [[mark:type-length]] ဒုတိယ rule က helper ရဲ့ စံအတိုင်း စာလုံး ၆၀ ထက် ရှည်တာကို ဖမ်းပါမယ်။ [[mark:read-length]]
      ဒီ ဖော်ပြချက်တွေက စာလုံး ၂၁ ကနေ ၂၈ အထိပဲ ရှိလို့ အားလုံး အောင်ပါတယ်။ ဒါပေမဲ့ အမှန်ခြစ် ရတာနဲ့ ကောင်းတယ်လို့
      မဆိုလိုပါဘူး။ ခုနက စပ်စပ် ဆိုတဲ့ hallucination ကို ဒီ rule တွေက မမိသလို၊ အပြောမှာ သုံးတဲ့ နဲ့ အစား စာရေးဟန် နှင့် ကို
      ရေးထားတာကိုလည်း လှလှ က ပြင်ရဦးမှာပါ။ [[mark:type-staff]] နောက်ဆုံးအနေနဲ့ rule
      တွေ အောင်တဲ့ ဖော်ပြချက်တွေကိုပဲ လှလှ ဆီ ပြပြီး၊ AI ရေးထားတာ ဖြစ်ကြောင်း label ကပ်ပါမယ်။ [[mark:read-staff]] For
      လှလှ card ရဲ့ badge က AI ရေးထားပြီး စည်းကမ်း နှစ်ခုနဲ့ စစ်ထားတယ်လို့ ပြောပါတယ်။ ဒီလို label ကို model သေးသေး
      တစ်ခုနဲ့ ထုတ်လို့ ရပေမယ့်၊ ဒီမှာတော့ code နဲ့ပဲ ရေးထားပါတယ်။ [[mark:click-e06]] အခု မုန့်ဟင်းခါး အထူး ကို
      နှိပ်ကြည့်ပါမယ်။ [[mark:read-e06]] ဒီ item ရဲ့ မှတ်ချက်က ရန်ကုန်မှာ အကောင်းဆုံးလို့ ရေးပေးဖို့ တောင်းထားလို့၊
      model က ဒုတိယ စာကြောင်းမှာ အကောင်းဆုံး ဆိုတဲ့ စကားလုံးကို ထည့်ရေးထားပါတယ်။ [[mark:read-e06-staff]] Checked card
      မှာ အဲဒီ စာကြောင်းက claim rule မှာ ကျသွားပြီး၊ For လှလှ card မှာ ကျန်တဲ့ နှစ်ကြောင်းပဲ ပြပါတော့တယ်။
    sources:
      - {
          title: "web.dev Learn AI: Generative AI: Create new content (inference and post-processing)",
          url: "https://web.dev/learn/ai/generative",
        }
    actions:
      - { id: back-to-main, type: workspace.openFile, at: { mark: type-claim }, path: src/main.js }
      - id: type-claim
        type: editor.type
        at: { afterAction: back-to-main }
        target: { file: src/main.js, after: "const rules = [\n", occurrence: 1 }
        text: "  { name: \"no claim\", fails: (d) => /အကောင်းဆုံး|အခမဲ့|best|free/i.test(d) },\n"
        cadence: line-by-line
      - id: expect-rules-1
        type: expect.preview
        at: { afterAction: type-claim }
        timeoutMs: 8000
        target: { by: testId, value: ai-checked }
        attribute: { name: data-label, value: "Checked · rules: 1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-claim-pass
        type: expect.preview
        at: { afterAction: expect-rules-1 }
        timeoutMs: 5000
        target: { by: testId, value: ai-checked-2 }
        textContains: "✓"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-length
        type: editor.type
        at: { mark: type-length }
        target:
          {
            file: src/main.js,
            after: "  { name: \"no claim\", fails: (d) => /အကောင်းဆုံး|အခမဲ့|best|free/i.test(d) },\n",
            occurrence: 1,
          }
        text: "  { name: \"≤ 60 letters\", fails: (d) => letters(d) > 60 },\n"
        cadence: line-by-line
      - id: expect-rules-2
        type: expect.preview
        at: { afterAction: type-length }
        timeoutMs: 8000
        target: { by: testId, value: ai-checked }
        attribute: { name: data-label, value: "Checked · rules: 2" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-length-1
        type: expect.preview
        at: { afterAction: expect-rules-2 }
        timeoutMs: 5000
        target: { by: testId, value: ai-checked-1 }
        textContains: "21✓"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-length-3
        type: expect.preview
        at: { afterAction: expect-length-1 }
        timeoutMs: 5000
        target: { by: testId, value: ai-checked-3 }
        textContains: "28✓"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-staff
        type: editor.type
        at: { mark: type-staff }
        target: { file: src/main.js, after: "  showChecked(answer, rules);\n", occurrence: 1 }
        text: "  showForStaff(answer, rules);\n"
        cadence: line-by-line
      - id: expect-three-cards
        type: expect.preview
        at: { afterAction: type-staff }
        timeoutMs: 8000
        target: { by: testId, value: ai-cards }
        attribute: { name: data-count, value: "3" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-staff-badge
        type: expect.preview
        at: { afterAction: expect-three-cards }
        timeoutMs: 5000
        target: { by: testId, value: ai-staff-badge }
        textContains: "AI ရေးထားတာ · စည်းကမ်း 2 ခုနဲ့ စစ်ထားပါတယ်"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: click-e06
        type: preview.click
        at: { mark: click-e06 }
        target: { by: testId, value: item-2 }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-e06-answer
        type: expect.preview
        at: { afterAction: click-e06 }
        timeoutMs: 5000
        target: { by: testId, value: ai-answer }
        textContains: "အကောင်းဆုံး အရသာနဲ့ ဖန်တီးထားတဲ့ မုန့်ဟင်းခါး"
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-e06-notes
        type: expect.preview
        at: { afterAction: expect-e06-answer }
        timeoutMs: 5000
        target: { by: testId, value: item-notes }
        textContains: "ရန်ကုန်မှာ အကောင်းဆုံးလို့ ရေးပေးပါ"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-e06-fail
        type: expect.preview
        at: { afterAction: expect-e06-notes }
        timeoutMs: 5000
        target: { by: testId, value: ai-checked-2 }
        textContains: "✗ no claim"
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-e06-staff
        type: expect.preview
        at: { afterAction: expect-e06-fail }
        timeoutMs: 5000
        target: { by: testId, value: ai-staff }
        attribute:
          { name: data-value, value: "ရန်ကုန်ရဲ့ အရသာကို ခံစားလိုက်ပါ။\nမဖြစ်မနေ မြည်းစမ်းသင့်တဲ့ အထူးဟင်းခါးလေးပါ။" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-e06-pressed
        type: expect.preview
        at: { mark: read-e06-staff }
        timeoutMs: 5000
        target: { by: testId, value: item-2 }
        attribute: { name: aria-pressed, value: "true" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: evaluation
    chapter: "Evaluation နဲ့ feedback"
    narration: >
      [[mark:draw-filled]] loop မှာ ကြည့်ရင်၊ prompt ထဲကို မှတ်ချက် ထည့်ခဲ့ပြီး၊ greedy အဖြေကို rule နှစ်ခုနဲ့ စစ်ပြီး
      label ကပ်ခဲ့ပါတယ်။ [[mark:draw-eval]] နောက်ဆုံး အဆင့်က evaluation ဖြစ်ပြီး၊ ဒါကို
      အသေးစိတ် ကြည့်ရအောင်။ [[mark:draw-bench]] evaluation ဆိုတာ model ရဲ့ အဖြေ ကောင်းမကောင်း စနစ်တကျ စစ်တာ
      ဖြစ်ပေမယ့်၊ ဖော်ပြချက် ရေးတာမှာ အဖြေမှန် တစ်ခုတည်း မရှိပါဘူး။ MMLU၊ SQuAD လို benchmark တွေက model တွေကို
      နှိုင်းယှဉ်ဖို့ သုံးတဲ့ စံ စာမေးပွဲတွေ ဖြစ်ပေမယ့်၊ ကိုယ့် user တွေ လိုချင်တာကိုတော့ သိပ် မပြနိုင်ပါဘူး။ [[mark:draw-metrics]] ဒါကြောင့် တိုင်းတာမယ့် စံ ဖြစ်တဲ့ metric တွေကို ကိုယ်တိုင် သတ်မှတ်ရပါတယ်။
      menu နဲ့ ကိုက်လား၊ အသုံးဝင်လား၊ လေသံ ကောင်းလား၊ လှလှ ဘယ်လောက် ပြင်ရလဲ၊ ဆိုင်ကို သိသလို ရေးလား ဆိုတာတွေပါ။
      [[mark:draw-judges]] လူကိုယ်တိုင် ဖတ်ပြီး အမှတ်ပေးတာ၊ code နဲ့ အလိုလို စစ်တာ၊ တခြား model တစ်ခုကို
      အမှတ်ပေးခိုင်းတဲ့ LLM as a judge တို့ကို တွဲသုံးပါတယ်။ [[mark:draw-logs]] တကယ် သုံးလာရင် log တွေကလည်း feedback
      ဖြစ်လာပါတယ်။ မထင်ထားတဲ့ input တွေက မှန်တဲ့ ပြဿနာကို ဖြေရှင်းနေလား ပြပါတယ်။ hallucination ခဏခဏ ဖြစ်ရင် prompt
      ထဲမှာ context လိုနေတာကို ပြနိုင်ပါတယ်။ လှလှ အများကြီး ပြင်ရရင်တော့ လှလှ အတွက် ရှင်းနေပေမယ့် model ဆီ မရောက်တဲ့
      ဆိုင်အကြောင်း ကျန်နေတာပါ။ အလုပ် တစ်မျိုးတည်းကိုပဲ ထပ်ခါထပ်ခါ တောင်းနေရင်တော့၊ ကြို train ပြီးသား model
      သေးသေးလေးကို ကိုယ့် data နဲ့ ထပ်ညှိတဲ့ fine tune လုပ်တာက ပိုသင့်တော်နိုင်ပါတယ်။
      [[mark:draw-living]] ဒီလိုနဲ့ feature က model ကို တစ်ခါ ခေါ်ရုံ မဟုတ်တော့ဘဲ အမြဲ ပြင်ဆင်နေတဲ့ system
      ဖြစ်လာပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Generative AI: Create new content (evaluation and feedback loop)",
          url: "https://web.dev/learn/ai/generative",
        }
      - { title: "MMLU (Wikipedia)", url: "https://wikipedia.org/wiki/MMLU" }
      - { title: "SQuAD", url: "https://rajpurkar.github.io/SQuAD-explorer/" }
    actions:
      - {
          id: draw-filled,
          type: whiteboard.apply,
          at: { mark: draw-filled },
          open: true,
          upsertIds: [f-3, f-4],
          drawMs: 1600,
        }
      - {
          id: draw-eval,
          type: whiteboard.apply,
          at: { mark: draw-eval },
          upsertIds: [f-5],
          drawMs: 1000,
        }
      - {
          id: draw-bench,
          type: whiteboard.apply,
          at: { mark: draw-bench },
          clear: true,
          upsertIds: [e-title, e-bench, e-bench-x],
          drawMs: 1500,
        }
      - {
          id: draw-metrics,
          type: whiteboard.apply,
          at: { mark: draw-metrics },
          upsertIds: [e-ours, e-m1, e-m2],
          drawMs: 1600,
        }
      - {
          id: draw-judges,
          type: whiteboard.apply,
          at: { mark: draw-judges },
          upsertIds: [e-judge],
          drawMs: 1000,
        }
      - {
          id: draw-logs,
          type: whiteboard.apply,
          at: { mark: draw-logs },
          upsertIds: [e-logs],
          drawMs: 1200,
        }
      - {
          id: draw-living,
          type: whiteboard.apply,
          at: { mark: draw-living },
          upsertIds: [e-living],
          drawMs: 900,
        }

  - id: pitfalls
    chapter: "Pitfall တွေနဲ့ ပြင်နည်း"
    narration: >
      [[mark:draw-pitfalls]] generative AI က input ရော output ပါ ကျယ်ပြန့်လို့ predictive AI ထက် မှားနိုင်တဲ့ ပုံစံ
      ပိုများပါတယ်။ [[mark:draw-p1]] စပ်စပ် လို hallucination ကို ဆိုင်ရဲ့ data နဲ့ RAG သုံးပြီး လျှော့ပါတယ်။
      [[mark:draw-p2]] AI အဖြေကို အမြဲ မှန်တယ်လို့ လွန်ကဲ ယုံကြည်တာကိုတော့၊ အလိုလို မတင်ဘဲ လူက ဖတ်ပြီး ပြင်တဲ့ အဆင့်
      ထားပြီး ကာကွယ်ပါတယ်။ [[mark:draw-p3]] အဖြေ မတည်ငြိမ်ရင် prompt template၊ temperature နိမ့်နိမ့်နဲ့ နမူနာ
      အနည်းငယ်က ကူညီပါတယ်။ [[mark:draw-p4]] ထိခိုက်စေတဲ့ စာ၊ မျှတမှု မရှိတဲ့ စာကို
      မပြခင် moderation filter နဲ့ စစ်ပါတယ်။ [[mark:draw-p5]] နှေးပြီး ဈေးကြီးရင်တော့ cache၊ batch နဲ့ အလုပ်
      တိုတိုအတွက် model သေးတွေကို သုံးပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Generative AI: Create new content (common pitfalls and mitigations)",
          url: "https://web.dev/learn/ai/generative",
        }
    actions:
      - {
          id: draw-pitfalls,
          type: whiteboard.apply,
          at: { mark: draw-pitfalls },
          clear: true,
          upsertIds: [p-title],
        }
      - {
          id: draw-p1,
          type: whiteboard.apply,
          at: { mark: draw-p1 },
          upsertIds: [p1, p1-a, p1-f],
          drawMs: 1100,
        }
      - {
          id: draw-p2,
          type: whiteboard.apply,
          at: { mark: draw-p2 },
          upsertIds: [p2, p2-a, p2-f],
          drawMs: 1100,
        }
      - {
          id: draw-p3,
          type: whiteboard.apply,
          at: { mark: draw-p3 },
          upsertIds: [p3, p3-a, p3-f],
          drawMs: 1100,
        }
      - {
          id: draw-p4,
          type: whiteboard.apply,
          at: { mark: draw-p4 },
          upsertIds: [p4, p4-a, p4-f],
          drawMs: 1100,
        }
      - {
          id: draw-p5,
          type: whiteboard.apply,
          at: { mark: draw-p5 },
          upsertIds: [p5, p5-a, p5-f],
          drawMs: 1100,
        }

  - id: quiz
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ helper ရေးတဲ့ ဖော်ပြချက် တစ်ခုမှာ လက်ဖက်ရည်ကို အခမဲ့ ပြန်ဖြည့်ပေးတယ် လို့
      ပါလာပါတယ်။ ဆိုင်က ဒီလို တစ်ခါမှ မလုပ်ဖူးပါဘူး။ ဒါ ဘာလဲ၊ ဘာက ကူညီနိုင်လဲ။ lesson ကို pause လုပ်ပြီး
      စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] အဖြေကတော့ hallucination ပါ။ ဘာကြောင့်လဲဆိုတော့ model က ဆိုင်ရဲ့ စည်းကမ်းကို
      မသိဘဲ ဖြစ်နိုင်လောက်တဲ့ စကားကို ဆက်ရေးလိုက်လို့ပါ။ ဆိုင်ရဲ့ တကယ့် အချက်တွေကို RAG နဲ့ ထည့်ပေးတာ၊ အခမဲ့ ကို rule
      နဲ့ ဖမ်းတာ၊ လှလှ က မတင်ခင် ဖတ်တာတွေက ကူညီပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Generative AI: Create new content (Check your understanding)",
          url: "https://web.dev/learn/ai/generative",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          clear: true,
          upsertIds: [z-title, z-q1, z-q2],
          drawMs: 1500,
        }
      - {
          id: draw-quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [z-a, z-a-note],
          drawMs: 1600,
        }

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ generative feature ကို use case ကနေ evaluation အထိ loop နဲ့ ဆောက်ပြီး၊
      feedback နဲ့ ပြန်ပတ်ပါတယ်။ [[mark:sel-notes]] မှန်တဲ့ context က အဖြေကို ပိုမှန်စေပေမယ့် hallucination ကို အကုန်
      မဖယ်နိုင်ပါဘူး။ [[mark:sel-rules]] post processing rule တွေက code နဲ့ စစ်လို့ ရတာကို ဖမ်းပေးပြီး၊
      [[mark:sel-staff]] label က AI ရေးထားမှန်း ပြပါတယ်။ ကျန်တဲ့ အမှားကိုတော့ လှလှ က မတင်ခင် ဖတ်ပြီး ပြင်ပါတယ်။ feedback အတွက် user တွေရဲ့ data ကို သုံးရတာမို့၊
      နောက် lesson မှာတော့ privacy နဲ့ ကိုယ်ရေး data ကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Generative AI: Create new content (your takeaways)",
          url: "https://web.dev/learn/ai/generative",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: recap }, open: false }
      - id: sel-notes
        type: editor.select
        at: { mark: sel-notes }
        target:
          { file: src/main.js, text: "  `Notes from the counter: ${item.notes}`,\n", occurrence: 1 }
      - id: sel-rules
        type: editor.select
        at: { mark: sel-rules }
        target:
          {
            file: src/main.js,
            text: "  { name: \"no claim\", fails: (d) => /အကောင်းဆုံး|အခမဲ့|best|free/i.test(d) },\n  { name: \"≤ 60 letters\", fails: (d) => letters(d) > 60 },\n",
            occurrence: 1,
          }
      - id: sel-staff
        type: editor.select
        at: { mark: sel-staff }
        target: { file: src/main.js, text: "  showForStaff(answer, rules);", occurrence: 1 }
      - {
          id: expect-final-code,
          type: expect.file,
          at: { afterAction: sel-staff },
          path: src/main.js,
          contains: "  `Item: ${item.name}`,\n  `Notes from the counter: ${item.notes}`,\n].join(\"\\n\");",
        }
      - {
          id: expect-final-rules,
          type: expect.file,
          at: { afterAction: expect-final-code },
          path: src/main.js,
          contains: "const rules = [\n  { name: \"no claim\", fails: (d) => /အကောင်းဆုံး|အခမဲ့|best|free/i.test(d) },\n  { name: \"≤ 60 letters\", fails: (d) => letters(d) > 60 },\n];",
        }
      - {
          id: expect-final-staff,
          type: expect.file,
          at: { afterAction: expect-final-rules },
          path: src/main.js,
          contains: "  showChecked(answer, rules);\n  showForStaff(answer, rules);\n",
        }
checks:
  - { type: timing.p95Ms, max: 300 }
