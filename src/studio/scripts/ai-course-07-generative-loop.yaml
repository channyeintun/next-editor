      src/llm.js: |
        // The lesson's stand-in for a model API.
        // A real model is slow and can answer differently from run to run, so this lesson uses answers
        // recorded ahead of time from a real model: data/responses.json (how: data/PROVENANCE.md).
        // generate() returns the recorded answer for exactly these messages, and shows it in the panel.
        import recorded from "../data/responses.json";
        import { panel } from "ai-panel";

        export const model = recorded.provenance;

        const find = (messages) => {
          const key = JSON.stringify(messages.map(({ role, content }) => ({ role, content })));
          return recorded.responses.find((r) => JSON.stringify(r.messages) === key);
        };

        export async function generate(messages, { show = true } = {}) {
          const hit = find(messages);
          if (!hit) {
            const error = new Error("No recorded answer for these exact messages yet.");
            error.name = "CourseNotice";
            throw error;
          }
          if (show) panel.output("Model answer", hit.output, { id: "answer", badge: `recorded · ${model.label} · greedy` });
          return hit.output;
        }

        // The token counts the model's own tokenizer gave when the answer was recorded (the prompt includes
        // the chat template's own tokens): { promptTokens, outputTokens }, or null when not recorded.
        export function tokensFor(messages) {
          const hit = find(messages);
          return hit ? { promptTokens: hit.promptTokens, outputTokens: hit.outputTokens } : null;
        }
      src/main.js: |
        // The staff's menu-description helper, version 0.
        import helper from "../data/helper.json";
        import { generate } from "./llm.js";
        import { itemButtons, showChecked, showForStaff, letters } from "./page.js";

        // The system prompt: the helper's general behaviour, the same for every request.
        const system =
          "You help the staff of Shwe Tea House, a tea shop in Bahan, Yangon, write menu descriptions. " +
          "Write in Burmese.";

        // The request: the instruction, then this item's details as context.
        const request = (item) => [
          "Write three short descriptions for this new menu item, one per line, with nothing else.",
          `Item: ${item.name}`,
        ].join("\n");

        // Post-processing: rules every description must pass before လှလှ sees it.
        const rules = [
        ];

        async function describe(item) {
          // Inference: the model's answer for these exact messages, recorded ahead of time (data/PROVENANCE.md).
          const answer = await generate([
            { role: "system", content: system },
            { role: "user", content: request(item) },
          ]);
          showChecked(answer, rules);
        }

        await itemButtons(helper, ["n03", "e06"], describe);
      src/page.js: |
        // The helper's page for this lesson: the item buttons and the counter's notes above the AI panel,
        // and the cards that show what post-processing did. Plain code, no model.
        import { panel } from "ai-panel";
        import { choices, row } from "./ui.js";

        // Letters as a reader sees them (a Burmese letter with its marks counts once).
        const graphemes = new Intl.Segmenter("my", { granularity: "grapheme" });
        export const letters = (text) => [...graphemes.segment(text)].length;

        const lines = (answer) => answer.split("\n").map((line) => line.trim()).filter(Boolean);
        const firstFail = (line, rules) => rules.find((rule) => rule.fails(line));

        // One button per item and, below them, the counter's notes for the picked item (what လှလှ typed
        // on the helper's page). A click describes that item. The first item is described when the page runs.
        export function itemButtons(helper, ids, describe) {
          const all = [...helper.newItems, ...helper.evalSet.filter((item) => item.name)];
          const items = ids.map((id) => all.find((item) => item.id === id));
          const notes = document.createElement("span");
          notes.dataset.testid = "item-notes";
          const pick = (item) => {
            notes.textContent = item.notes;
            return describe(item);
          };
          choices("item", items.map((item) => item.name), (_name, i) => pick(items[i]), { label: "item", selected: items[0].name });
          row("notes").append(notes);
          return pick(items[0]);
        }

        // Every description of the answer, its length and the first rule it fails.
        export function showChecked(answer, rules) {
          const rows = lines(answer).map((line) => {
            const failed = firstFail(line, rules);
            return { description: line, letters: letters(line), result: failed ? `✗ ${failed.name}` : "✓" };
          });
          panel.table(`Checked · rules: ${rules.length}`, rows, { id: "checked", columns: ["description", "letters", "result"], badge: "rules · AI မပါ" });
        }

        // What လှလှ sees: only the descriptions that pass, labelled as AI-written and checked.
        export function showForStaff(answer, rules) {
          const kept = lines(answer).filter((line) => !firstFail(line, rules));
          panel.output("For လှလှ", kept.join("\n"), { id: "staff", badge: `AI ရေးထားတာ · စည်းကမ်း ${rules.length} ခုနဲ့ စစ်ထားပါတယ်` });
        }
      src/ui.js: |
        // Page controls for the lesson program: a row of buttons or choices in #app, above the AI panel.
        // Plain DOM, so the studio records every click and replay shows it exactly. Each control gets a
        // data-testid for preview.click. #app starts empty on every run, so controls are drawn by the
        // program each time. A handler that throws prints to the panel's Console (never the page).
        //
        //   import { row, button, choices } from "./ui.js";
        //   choices("threshold", [0.5, 0.7, 0.9], (t) => show(t), { selected: 0.5 });
        //     → buttons with test ids threshold-1, threshold-2, threshold-3 (1-based, in order)
        //   button("ဖော်ပြချက်တွေ ကြည့်မယ်", "show-descriptions", () => …);
        const STYLE_ID = "ui-style";
        const STYLE = `
        #app .ui-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px 0;
          font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans Myanmar", "Myanmar Sangam MN", "Myanmar Text", sans-serif; color: #d9dce2; }
        #app .ui-label { color: #adb5bd; font-size: 13px; }
        #app .ui-btn { font: inherit; color: #f1f3f5; background: #2d323c; border: 1px solid #3a404b; border-radius: 6px; padding: 3px 12px; cursor: pointer; }
        #app .ui-btn[aria-pressed="true"] { background: #7048e8; border-color: #7048e8; color: #fff; font-weight: 600; }
        `;

        function ensureStyle() {
          if (document.getElementById(STYLE_ID)) return;
          const style = document.createElement("style");
          style.id = STYLE_ID;
          style.textContent = STYLE;
          document.head.append(style);
        }

        const safe = (fn) => (...args) => {
          try {
            const result = fn(...args);
            if (result && typeof result.catch === "function") result.catch((error) => console.error(error));
          } catch (error) {
            console.error(error);
          }
        };

        /** A new row in #app, optionally with a short label in front. Returns the row element. */
        export function row(label = "") {
          ensureStyle();
          const el = document.createElement("div");
          el.className = "ui-row";
          if (label) {
            const span = document.createElement("span");
            span.className = "ui-label";
            span.textContent = label;
            el.append(span);
          }
          document.getElementById("app").append(el);
          return el;
        }

        /** One button. `testid` is used as is. */
        export function button(label, testid, onClick, parent = row()) {
          const el = document.createElement("button");
          el.type = "button";
          el.className = "ui-btn";
          el.textContent = String(label);
          el.dataset.testid = testid;
          el.addEventListener("click", safe(onClick));
          parent.append(el);
          return el;
        }

        /** A row of choices; the picked one is shown pressed. Test ids are `<name>-1`, `<name>-2`, … */
        export function choices(name, options, onPick, { label = name, selected } = {}) {
          const parent = row(label);
          const buttons = options.map((option, i) =>
            button(option, `${name}-${i + 1}`, () => {
              for (const b of buttons) b.setAttribute("aria-pressed", String(b === buttons[i]));
              onPick(option, i);
            }, parent),
          );
          for (const [i, b] of buttons.entries()) b.setAttribute("aria-pressed", String(options[i] === selected));
          return buttons;
        }
