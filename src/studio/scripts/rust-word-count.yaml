  - id: collect
    chapter: စီပြီး print ထုတ်ခြင်း
    narration: >-
      [[mark:type-collect]] main ထဲ ပြန်သွားပြီး count words ကို ခေါ်ပါမယ်။ ပြီးတော့ ရလာတဲ့ map ကို
      key နဲ့ value အတွဲတွေ ပါတဲ့ Vec တစ်ခု အဖြစ် ပြောင်းပါမယ်။ [[mark:select-into]] into iter
      ကြောင့် key နဲ့ value တစ်တွဲချင်းစီက map ထဲကနေ tuple တစ်ခုအနေနဲ့ move ဖြစ်သွားပြီး၊ collect
      ကတော့ အဲဒီ tuple တွေနဲ့ Vec ကို တည်ဆောက်ပေးပါတယ်။ [[mark:select-pairs-type]] ကိုယ် ရေးထားတဲ့
      type က collect ကို ဘာ တည်ဆောက်ရမလဲ ပြောပေးတာပါ။ ဒီမှာတော့ String နဲ့ u32 tuple တွေ ထည့်ထားတဲ့
      Vec ပါ။ pairs မှာ mut လိုပါတယ်။ ဘာကြောင့်လဲဆိုတော့ စီတဲ့အခါ Vec အသစ် မလုပ်ဘဲ ဒီ Vec ထဲမှာပဲ
      နေရာ ပြောင်းပေးတာ ဖြစ်လို့ပါ။
    sources:
      - title: "std::collections::HashMap (IntoIterator: moves out each key-value pair)"
        url:
          "https://doc.rust-lang.org/std/collections/struct.HashMap.html#impl-IntoIterator-for-HashMap%3\
          CK,+V,+S%3E"
      - title: "std::iter::Iterator::collect"
        url: "https://doc.rust-lang.org/std/iter/trait.Iterator.html#method.collect"
      - title: "slice::sort_by (takes &mut self)"
        url: "https://doc.rust-lang.org/std/primitive.slice.html#method.sort_by"
    actions:
      - id: close-board-keys
        type: whiteboard.apply
        at: { scene: start, offsetMs: -400 }
        open: false
      - id: type-collect
        type: editor.type
        at: { mark: type-collect }
        target:
          file: main.rs
          after: "    let text = \"the cat sat on the mat The cat was happy\";\n"
          occurrence: 1
        cadence: line-by-line
        text: "    let counts = count_words(text);

          \    let mut pairs: Vec<(String, u32)> = counts.into_iter().collect();\n"
      - id: select-into
        type: editor.select
        at: { mark: select-into }
        target:
          file: main.rs
          text: "counts.into_iter().collect()"
          occurrence: 1
      - id: select-pairs-type
        type: editor.select
        at: { mark: select-pairs-type }
        target:
          file: main.rs
          text: "mut pairs: Vec<(String, u32)>"
          occurrence: 1

  - id: sort
    narration: >-
      [[mark:type-sort]] အခု စီဖို့ sort by ကို သုံးပါမယ်။ [[mark:select-closure]] sort by က closure
      တစ်ခုကို လက်ခံပြီး၊ အဲဒီ closure က အတွဲ နှစ်တွဲ ဖြစ်တဲ့ a နဲ့ b ကို နှိုင်းယှဉ်ပေးပါတယ်။ အတွဲ
      တစ်တွဲချင်းစီမှာ dot 0 က စကားလုံး ဖြစ်ပြီး၊ dot 1 ကတော့ count ပါ။ cmp ကတော့ တန်ဖိုး နှစ်ခုကို
      နှိုင်းယှဉ်ပြီး၊ ငယ်တာလား၊ တူတာလား၊ ကြီးတာလား ဆိုတဲ့ အဖြေ တစ်ခု ပြန်ပေးပါတယ်။
      [[mark:select-count-cmp]] ဒီမှာ b ရဲ့ count ကို a ရဲ့ count နဲ့ နှိုင်းယှဉ်ပါတယ်။ b ကို
      ရှေ့မှာ ထားတဲ့အတွက်၊ count အများဆုံးက အပေါ်ဆုံး ရောက်သွားပါတယ်။ [[mark:select-then]] count
      နှစ်ခု တူနေတဲ့အခါကျတော့ then ဆိုတဲ့ method က စကားလုံးတွေကို အက္ခရာစဉ်အတိုင်း
      နှိုင်းယှဉ်ပေးပါတယ်။ ဒါ မပါရင် count တူတဲ့ စကားလုံးတွေက run တစ်ကြိမ်နဲ့ တစ်ကြိမ် အစီအစဉ်
      ပြောင်းသွားနိုင်ပါတယ်။ ဘာကြောင့်လဲဆိုတော့ map မှာ အစီအစဉ် မရှိလို့ပါ။ [[mark:type-print]]
      နောက်ဆုံးမှာ စကားလုံး မတူတာ ဘယ်နှစ်လုံး ရှိလဲ ဆိုတာကို print ထုတ်ပြီး၊ take 3 ကတော့ ပထမ
      သုံးတွဲကိုပဲ ချန်ထားပေးတဲ့အတွက်၊ အဲဒီ သုံးတွဲကို print ထုတ်ပါတယ်။
    sources:
      - title: "slice::sort_by (a stable sort with a comparison closure)"
        url: "https://doc.rust-lang.org/std/primitive.slice.html#method.sort_by"
      - title: "std::cmp::Ord::cmp"
        url: "https://doc.rust-lang.org/std/cmp/trait.Ord.html#tymethod.cmp"
      - title: "std::cmp::Ordering::then"
        url: "https://doc.rust-lang.org/std/cmp/enum.Ordering.html#method.then"
      - title: "std::iter::Iterator::take"
        url: "https://doc.rust-lang.org/std/iter/trait.Iterator.html#method.take"
      - title: "The Rust Book — Closures"
        url: "https://doc.rust-lang.org/book/ch13-01-closures.html"
    actions:
      - id: type-sort
        type: editor.type
        at: { mark: type-sort, offsetMs: -200 }
        target:
          file: main.rs
          after: "    let mut pairs: Vec<(String, u32)> = counts.into_iter().collect();\n"
          occurrence: 1
        cadence: line-by-line
        text: "    pairs.sort_by(|a, b| b.1.cmp(&a.1).then(a.0.cmp(&b.0)));\n"
      - id: select-closure
        type: editor.select
        at: { mark: select-closure }
        target:
          file: main.rs
          text: "|a, b|"
          occurrence: 1
      - id: select-count-cmp
        type: editor.select
        at: { mark: select-count-cmp }
        target:
          file: main.rs
          text: "b.1.cmp(&a.1)"
          occurrence: 1
      - id: select-then
        type: editor.select
        at: { mark: select-then }
        target:
          file: main.rs
          text: ".then(a.0.cmp(&b.0))"
          occurrence: 1
      - id: type-print
        type: editor.type
        at: { mark: type-print }
        target:
          file: main.rs
          after: "    pairs.sort_by(|a, b| b.1.cmp(&a.1).then(a.0.cmp(&b.0)));\n"
          occurrence: 1
        cadence: line-by-line
        text: "    println!(\"{} different words\", pairs.len());

          \    for (word, count) in pairs.iter().take(3) {

          \        println!(\"{word}: {count}\");

          \    }\n"

  - id: run
    narration: >-
      [[mark:run]] ကဲ၊ run ကြည့်ရအောင်။ စကားလုံး မတူတာ 7 လုံး ရှိပါတယ်။ the က 3 ကြိမ်နဲ့ ထိပ်ဆုံးမှာ
      ရောက်နေပါတယ်။ ဘာကြောင့်လဲဆိုတော့ စာလုံးကြီးနဲ့ စတဲ့ The ကိုပါ ထည့်ရေတွက်လိုက်လို့ပါ။ ပြီးတော့
      cat က 2 ကြိမ်ပါ။ ကျန်တဲ့ စကားလုံး ငါးလုံးကတော့ တစ်ကြိမ်စီပဲ ပါပါတယ်။ သူတို့ကို စကားလုံး
      အက္ခရာစဉ်အတိုင်း စီထားတဲ့အတွက်၊ happy က တတိယ နေရာမှာ ရောက်လာတာပါ။
    sources:
      - title: "The Rust Book — Updating a Value Based on the Old Value"
        url: "https://doc.rust-lang.org/book/ch08-03-hash-maps.html#updating-a-value-based-on-the-old-value"
      - title: "std::cmp::Ordering::then"
        url: "https://doc.rust-lang.org/std/cmp/enum.Ordering.html#method.then"
    actions:
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "happy: 1"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: "pairs.sort_by(|a, b| b.1.cmp(&a.1).then(a.0.cmp(&b.0)));"

  - id: wrap
    narration: >-
      ဒီ program တစ်ခုထဲမှာ ဒီ course တစ်လျှောက် လေ့လာခဲ့တဲ့ အယူအဆ အများကြီး ပါသွားပါတယ်။ ownership
      နဲ့ borrowing က garbage collector မလိုဘဲ memory ကို ဘေးကင်းအောင် ထိန်းပေးပါတယ်။ Option နဲ့
      Result က မရှိတဲ့ တန်ဖိုးတွေနဲ့ error တွေကို handle လုပ်ဖို့ ကိုယ့်ကို ခိုင်းပါတယ်။ ပြီးတော့
      collection တွေနဲ့ iterator တွေကတော့ ကိုယ့် data ကို သိမ်းပေးပြီး ကိုင်တွယ်ပေးပါတယ်။ အခုဆိုရင်
      ကိုယ်ပိုင် Rust program တွေ ရေးဖို့ အသင့် ဖြစ်နေပါပြီ။ ကျေးဇူးတင်ပါတယ် ခင်ဗျာ။
    sources:
      - title: "The Rust Book — Understanding Ownership"
