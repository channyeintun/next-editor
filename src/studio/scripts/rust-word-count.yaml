scenes:
  - id: plan
    chapter: ဘာ တည်ဆောက်မလဲ
    narration: >-
      ဒါက ဒီ course ရဲ့ နောက်ဆုံး lesson ဖြစ်တဲ့အတွက်၊ အခုထိ လေ့လာခဲ့သမျှကို program တစ်ခုတည်းထဲမှာ
      ပေါင်းသုံးကြည့်ရအောင်။ ရေးမှာက စကားလုံး ရေတွက်တဲ့ program သေးသေးလေး တစ်ခုပါ။ စာသား တစ်ခုထဲမှာ
      ဘယ် စကားလုံးတွေကို အများဆုံး သုံးထားလဲ ဆိုတာကို ရှာပြီး print ထုတ်ပေးမှာပါ။ [[mark:draw-text]]
      ပထမဆုံး စာသားကနေ စပါတယ်၊ အဲဒါက string slice တစ်ခုပါ။ [[mark:draw-split]] split whitespace က
      အဲဒီ စာသားကို စကားလုံး တစ်လုံးချင်း ခွဲထုတ်ပေးပါတယ်။ ပြီးတော့ to lowercase က စကားလုံး
      အားလုံးကို စာလုံးသေး ပြောင်းပေးတဲ့အတွက်၊ စာလုံးကြီးနဲ့ စတဲ့ The နဲ့ စာလုံးသေး the ကို စကားလုံး
      တစ်လုံးတည်းအဖြစ် ရေတွက်သွားမှာပါ။ [[mark:draw-map]] စကားလုံး တစ်လုံးချင်းစီကို HashMap
      တစ်ခုနဲ့ ရေတွက်ပါမယ်။ map ထဲမှာ စကားလုံးတွေ ဘယ်လို အစီအစဉ်နဲ့ ရှိနေလဲ ကြည့်ပါ။ ဘာ အစီအစဉ်မှ
      မရှိပါဘူး။ HashMap က အစီအစဉ် ဆိုတာကို လုံးဝ မသိမ်းထားလို့ပါ။ [[mark:draw-sort]] ဒါကြောင့် key
      နဲ့ value အတွဲတွေကို Vec တစ်ခုထဲ collect လုပ်ပြီး၊ အရေအတွက် အများဆုံးက အပေါ်ဆုံး ရောက်အောင်
      စီပါမယ်။ [[mark:draw-top]] ပြီးရင် ထိပ်ဆုံး သုံးလုံးကို print ထုတ်ပါမယ်။
    sources:
      - title: "The Rust Book — Updating a Value Based on the Old Value (a word count)"
        url: "https://doc.rust-lang.org/book/ch08-03-hash-maps.html#updating-a-value-based-on-the-old-value"
      - title: "str::split_whitespace"
        url: "https://doc.rust-lang.org/std/primitive.str.html#method.split_whitespace"
      - title: "str::to_lowercase"
        url: "https://doc.rust-lang.org/std/primitive.str.html#method.to_lowercase"
      - title: "std::collections::HashMap (iteration visits pairs in arbitrary order)"
        url: "https://doc.rust-lang.org/std/collections/struct.HashMap.html"
    actions:
      # Opens in the quiet handle before the first word, already titled.
      - id: open-board-plan
        type: whiteboard.apply
        at: { scene: start, offsetMs: -1500 }
        open: true
        upsertIds: [p-title]
      - id: draw-text
        type: whiteboard.apply
        at: { mark: draw-text }
        upsertIds: [p-text-box, p-text, p-text-type]
        drawMs: 1800
      - id: draw-split
        type: whiteboard.apply
        at: { mark: draw-split }
        upsertIds: [p-arrow1, p-split]
        drawMs: 1800
      - id: draw-map
        type: whiteboard.apply
        at: { mark: draw-map }
        upsertIds: [p-map-box, p-map, p-map-type, p-no-order]
        drawMs: 2400
      - id: draw-sort
        type: whiteboard.apply
        at: { mark: draw-sort }
        upsertIds: [p-arrow2, p-sort]
        drawMs: 1800
      - id: draw-top
        type: whiteboard.apply
        at: { mark: draw-top }
        upsertIds: [p-top-box, p-top, p-top-type]
        drawMs: 1600

  - id: function
    chapter: စကားလုံးတွေကို ရေတွက်ခြင်း
    narration: >-
      ကဲ၊ တည်ဆောက်ကြည့်ရအောင်။ ဒီမှာ ရေတွက်မယ့် စာသား ရှိပါတယ်။ [[mark:select-capital]] the ဆိုတဲ့
      စကားလုံး တစ်လုံးက စာလုံးကြီးနဲ့ စထားတာ သတိထား ကြည့်ပါ။ [[mark:type-use]] HashMap က prelude
      ထဲမှာ မပါတဲ့အတွက်၊ HashMap lesson တုန်းက လုပ်ခဲ့သလိုပဲ use နဲ့ ခေါ်သွင်းရပါတယ်။
      [[mark:type-fn]] ရေတွက်တဲ့ အပိုင်းကိုတော့ count words ဆိုတဲ့ သီးသန့် function တစ်ခုထဲမှာ
      ရေးပါမယ်။ ဒီ function က စာသားကို string slice အနေနဲ့ borrow လုပ်ပါတယ်၊ ဆိုလိုတာက ပိုင်ဆိုင်တာ
      မဟုတ်ဘဲ ငှားသုံးတာပါ။ ပြီးတော့ HashMap တစ်ခု ပြန်ပေးပါတယ်။ [[mark:select-sig]] key တွေက String
      တွေ ဖြစ်ပြီး၊ count တစ်ခုချင်းစီကတော့ u32 ပါ။ u32 ဆိုတာ ဘယ်တော့မှ အနုတ်ကိန်း မဖြစ်တဲ့
      ကိန်းဂဏန်းပါ။ [[mark:select-return]] နောက်ဆုံး စာကြောင်း ဖြစ်တဲ့ counts မှာ semicolon
      မပါတဲ့အတွက်၊ အဲဒါက ဒီ function ပြန်ပေးတဲ့ တန်ဖိုး ဖြစ်သွားပါတယ်။
    sources:
      - title: "The Rust Book — Bringing Paths into Scope with the use Keyword"
        url: "https://doc.rust-lang.org/book/ch07-04-bringing-paths-into-scope-with-the-use-keyword.html"
      - title: "The Rust Book — Functions with Return Values"
        url: "https://doc.rust-lang.org/book/ch03-03-how-functions-work.html#functions-with-return-values"
      - title: "The Rust Book — Integer Types (unsigned u32)"
        url: "https://doc.rust-lang.org/book/ch03-02-data-types.html#integer-types"
    actions:
      - id: close-board-plan
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-main
        type: workspace.openFile
        at: { scene: start, offsetMs: 800 }
        path: main.rs
      - id: select-capital
        type: editor.select
        at: { mark: select-capital }
        target:
          file: main.rs
          text: "The"
          occurrence: 1
      - id: type-use
        type: editor.type
        at: { mark: type-use }
        target:
          file: main.rs
          after: ""
          occurrence: 1
        cadence: fast-explainer
        text: "use std::collections::HashMap;\n\n"
      - id: type-fn
        type: editor.type
        at: { mark: type-fn, offsetMs: -200 }
        target:
          file: main.rs
          after: "use std::collections::HashMap;\n\n"
          occurrence: 1
        cadence: line-by-line
        text: "fn count_words(text: &str) -> HashMap<String, u32> {

          \    let mut counts = HashMap::new();

          \    counts

          }

          \n"
      - id: select-sig
        type: editor.select
        at: { mark: select-sig }
        target:
          file: main.rs
          text: "HashMap<String, u32>"
          occurrence: 1
      - id: select-return
        type: editor.select
        at: { mark: select-return }
        target:
          file: main.rs
          text: "counts"
          occurrence: 2

  - id: loop
    narration: >-
      [[mark:type-loop]] အခု loop ပါ။ ဒီ loop က စာသားထဲက စကားလုံး တစ်လုံးစီအတွက် တစ်ကြိမ်စီ
      ပတ်ပါတယ်။ [[mark:select-split]] split whitespace က စကားလုံးတွေကို တစ်လုံးချင်း ထုတ်ပေးပါတယ်။
      စကားလုံး တစ်လုံးချင်းစီက မူလ စာသားရဲ့ slice တစ်ခုစီ ဖြစ်တဲ့အတွက်၊ ဘာမှ copy ကူးစရာ မလိုပါဘူး။
      [[mark:select-lower]] to lowercase ကတော့ စာလုံးသေး ပြောင်းထားတဲ့ String အသစ် တစ်ခု
      လုပ်ပေးပါတယ်။ အဲဒီ String အသစ်နဲ့ word ကို shadow လုပ်လိုက်တဲ့အတွက်၊ ဒီနေရာကစပြီး word ဆိုတာ
      အဲဒီ String ပါ။ [[mark:select-entry]] ပြီးတော့ အရင်က မြင်ဖူးတဲ့ ရေတွက်နည်းပါပဲ။ entry က အဲဒီ
      String ကို လက်ခံပြီး၊ or insert ကတော့ key က အသစ် ဖြစ်နေရင် 0 နဲ့ map ထဲ ထည့်ပေးပါတယ်။ အသစ်
      ဖြစ်ဖြစ်၊ ရှိပြီးသား ဖြစ်ဖြစ်၊ ပြန်ရတာကတော့ map ထဲက count ကို ညွှန်တဲ့ mutable reference
      တစ်ခုပါ။ [[mark:select-star]] star က အဲဒီ reference ညွှန်ထားတဲ့ နေရာကို လိုက်သွားပေးတဲ့အတွက်၊
      plus equal 1 က map ထဲက count ကိုယ်တိုင်ကို ပြောင်းပေးလိုက်တာပါ။
    sources:
      - title: "str::split_whitespace"
        url: "https://doc.rust-lang.org/std/primitive.str.html#method.split_whitespace"
      - title: "str::to_lowercase (returns a new String)"
        url: "https://doc.rust-lang.org/std/primitive.str.html#method.to_lowercase"
      - title: "The Rust Book — Shadowing"
        url: "https://doc.rust-lang.org/book/ch03-01-variables-and-mutability.html#shadowing"
      - title: "std::collections::hash_map::Entry::or_insert"
        url: "https://doc.rust-lang.org/std/collections/hash_map/enum.Entry.html#method.or_insert"
    actions:
      - id: type-loop
        type: editor.type
        at: { mark: type-loop, offsetMs: -200 }
        target:
          file: main.rs
          after: "    let mut counts = HashMap::new();\n"
          occurrence: 1
        cadence: line-by-line
        text: "    for word in text.split_whitespace() {

          \        let word = word.to_lowercase();

          \        let count = counts.entry(word).or_insert(0);

          \        *count += 1;

          \    }\n"
      - id: select-split
        type: editor.select
        at: { mark: select-split }
        target:
          file: main.rs
          text: "text.split_whitespace()"
          occurrence: 1
      - id: select-lower
        type: editor.select
        at: { mark: select-lower }
        target:
          file: main.rs
          text: "let word = word.to_lowercase();"
          occurrence: 1
      - id: select-entry
        type: editor.select
        at: { mark: select-entry }
        target:
          file: main.rs
          text: "counts.entry(word).or_insert(0)"
          occurrence: 1
      - id: select-star
        type: editor.select
        at: { mark: select-star }
        target:
          file: main.rs
          text: "*count += 1"
          occurrence: 1

  - id: owned-keys
    chapter: Map က key ကို ဘာကြောင့် ပိုင်လဲ
    narration: >-
      ဒါဆို map က key တွေကို ဘာကြောင့် String အနေနဲ့ သိမ်းထားရလဲ။ key တွေကို borrow လုပ်ရုံနဲ့
      မရဘူးလား။ [[mark:draw-err-sig]] key တွေကို String အစား string slice၊ ဆိုလိုတာက ampersand str
      နဲ့ ထားကြည့်ရအောင်။ [[mark:draw-err-borrow]] အဲဒီအခါ key တစ်ခုချင်းစီက word ရဲ့ slice
      ဖြစ်သွားပါတယ်၊ ဆိုလိုတာက စာလုံးသေး ပြောင်းထားတဲ့ String အသစ်ရဲ့ slice ပါ။ အဲဒီ slice ကို as
      str က လုပ်ပေးတာပါ။ [[mark:draw-err-msg]] compiler ကတော့ E0515 error နဲ့ ရပ်သွားပါတယ်။ local
      variable ဖြစ်တဲ့ word ကို ညွှန်ထားတဲ့ တန်ဖိုးကို ပြန်ပေးလို့ မရပါဘူးတဲ့။
      [[mark:draw-err-drop]] ဘာကြောင့်လဲဆိုတော့၊ word ကို loop အထဲမှာ လုပ်ထားတာ ဖြစ်ပြီး၊ loop
      တစ်ကြိမ် ပတ်ပြီးတိုင်း အဆုံးမှာ drop ဖြစ်သွားလို့ပါ။ [[mark:draw-err-return]] ဒါပေမဲ့ map
      ကတော့ function ကနေ ပြန်ထွက်သွားမှာ ဖြစ်တဲ့အတွက်၊ သူ့ key တွေက ပြန်လွှတ်လိုက်ပြီးသား memory ကို
      ညွှန်နေမှာ ဖြစ်ပါတယ်။ [[mark:draw-text-ok]] text ရဲ့ slice တွေ ဆိုရင်တော့ ရပါတယ်။
      ဘာကြောင့်လဲဆိုတော့ text က function ရဲ့ အပြင်ကနေ ဝင်လာတာ ဖြစ်လို့ပါ။ ကိုယ့် စာလုံးသေး String
      တွေကတော့ function အထဲမှာ လုပ်ထားတာပါ။ [[mark:draw-fix]] ဒါကြောင့် map က String တစ်ခုချင်းစီကို
      ကိုယ်တိုင် ယူထားလိုက်ပါတယ်။ map က သူ့ key တွေကို ပိုင်ဆိုင်တဲ့အတွက်၊ map ရှိနေသရွေ့ key
      တွေလည်း ရှိနေပါတယ်။
    sources:
      - title: "Rust error codes — E0515"
        url: "https://doc.rust-lang.org/error_codes/E0515.html"
      - title: "The Rust Book — Hash Maps and Ownership"
        url: "https://doc.rust-lang.org/book/ch08-03-hash-maps.html#hash-maps-and-ownership"
      - title: "The Rust Book — Dangling References"
        url: "https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html#dangling-references"
      - title: "The Rust Book — Lifetime Elision (a returned reference borrows from the &str parameter)"
        url: "https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#lifetime-elision"
    actions:
