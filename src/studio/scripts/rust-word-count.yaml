# Rust from zero, lesson 20 (the last one): putting it together.
#
# The arc: a whiteboard draws the plan for a small word counter — a string
# slice of text, split_whitespace and to_lowercase to get the words, a
# HashMap to count them (it has no order), collect into a Vec and sort_by,
# then the top three. The editor builds it: `use` for HashMap, a function
# count_words(&str) -> HashMap<String, u32> whose last expression is the
# return value, then the loop (split_whitespace gives borrowed slices,
# to_lowercase makes a new String that shadows `word`, entry() takes it and
# or_insert(0) hands back a &mut to the count, which `*count += 1` follows).
# A second board answers "why String keys and not &str?": it shows the loop,
# the borrow, the loop's closing brace where `word` is dropped, and the
# returned `counts` — the map would point into Strings that die inside the
# loop, and the compiler says E0515. Slices of `text` itself would be fine
# (they come from outside), so the problem is only the lowercase copies.
# Back in main, into_iter + collect
# move the pairs into a Vec (it needs mut to sort), sort_by compares counts
# biggest first and `.then` breaks ties by word — without that tie-break the
# third line changes from run to run, because the map's order is random. One
# run, then a short recap of the whole course (no "next" line: it's the last
# lesson).
#
# Every compiler message on the board or in the narration was confirmed with
# rustc 1.98 (edition 2024) on the broken variants:
#   return type HashMap<&str, u32> and counts.entry(word.as_str())
#     error[E0515]: cannot return value referencing local variable `word`
#       `word` is borrowed here / returns a value referencing data owned by
#       the current function
#   keys borrowed from `text` instead (no to_lowercase, entry(word)) with
#   the same HashMap<&str, u32> signature: compiles and runs (8 keys) —
#   backs "slices of text would be fine".
#   `let pairs` (no mut) before pairs.sort_by(…) — backs "pairs needs mut";
#   the code isn't said aloud:
#     error[E0596]: cannot borrow `pairs` as mutable, as it is not declared
#       as mutable
#   sort_by(|a, b| b.1.cmp(&a.1)) with no tie-break: eight runs printed the
#   third line as was, sat, mat, on, happy, mat, on, happy — so the
#   narration's claim that ties can change order between runs is observed,
#   not assumed.
#
# Board colours: blue = the thing being named (the text, HashMap, the &str
# keys), orange = what changes or the caveat (the steps that transform the
# data, "no order", the borrow, where `word` is dropped), red = the error and
# its spotlight, green = the way that works (the `text: &str` parameter, the
# String-keyed map), violet = the result (the top three). #1e1e1e paints
# white on the dark board.
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/rust-word-count.yaml
