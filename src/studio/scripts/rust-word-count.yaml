scenes:
  - id: plan
    chapter: The plan
    narration: >
      In this last lesson, let's use what you've learned in one program: a
      small word counter that prints the words a text uses most.
      [[mark:draw-text]] It starts with the text, a string slice.
      [[mark:draw-split]] split_whitespace breaks the text into words. Then
      to_lowercase makes them all lowercase, so The and the count as one
      word.
      [[mark:draw-map]] A HashMap counts each word. Look at the order: there
      isn't one. A HashMap doesn't keep any.
      [[mark:draw-sort]] So we collect the pairs into a Vec, and sort it,
      biggest count first.
      [[mark:draw-top]] Then we print the top three.
    sources:
      - title: "The Rust Book — Updating a Value Based on the Old Value (a word count)"
        url: "https://doc.rust-lang.org/book/ch08-03-hash-maps.html#updating-a-value-based-on-the-old-value"
      - title: "str::split_whitespace"
        url: "https://doc.rust-lang.org/std/primitive.str.html#method.split_whitespace"
      - title: "str::to_lowercase"
        url: "https://doc.rust-lang.org/std/primitive.str.html#method.to_lowercase"
      - title: "std::collections::HashMap (iteration visits pairs in arbitrary order)"
        url: "https://doc.rust-lang.org/std/collections/struct.HashMap.html"
    actions:
      # Opens in the quiet handle before the first word, already titled.
      - id: open-board-plan
        type: whiteboard.apply
        at: { scene: start, offsetMs: -1500 }
        open: true
        upsertIds: [p-title]
      - id: draw-text
        type: whiteboard.apply
        at: { mark: draw-text }
        upsertIds: [p-text-box, p-text, p-text-type]
        drawMs: 1800
      - id: draw-split
        type: whiteboard.apply
        at: { mark: draw-split }
        upsertIds: [p-arrow1, p-split]
        drawMs: 1800
      - id: draw-map
        type: whiteboard.apply
        at: { mark: draw-map }
        upsertIds: [p-map-box, p-map, p-map-type, p-no-order]
        drawMs: 2400
      - id: draw-sort
        type: whiteboard.apply
        at: { mark: draw-sort }
        upsertIds: [p-arrow2, p-sort]
        drawMs: 1800
      - id: draw-top
        type: whiteboard.apply
        at: { mark: draw-top }
        upsertIds: [p-top-box, p-top, p-top-type]
        drawMs: 1600

  - id: function
    chapter: Counting the words
    narration: >
      Let's build it. Here's the text.
      [[mark:select-capital]] Notice that one The has a capital.
      [[mark:type-use]] HashMap isn't in the prelude, so we bring it in with
      use, as you did in the hash maps lesson.
      [[mark:type-fn]] The counting goes in its own function, count_words. It
      borrows the text as a string slice, and returns a HashMap.
      [[mark:select-sig]] The keys are Strings, and each count is a u32, a
      number that's never negative.
      [[mark:select-return]] The last line, counts, has no semicolon, so it's
      the value the function returns.
    sources:
      - title: "The Rust Book — Bringing Paths into Scope with the use Keyword"
        url: "https://doc.rust-lang.org/book/ch07-04-bringing-paths-into-scope-with-the-use-keyword.html"
      - title: "The Rust Book — Functions with Return Values"
        url: "https://doc.rust-lang.org/book/ch03-03-how-functions-work.html#functions-with-return-values"
      - title: "The Rust Book — Integer Types (unsigned u32)"
        url: "https://doc.rust-lang.org/book/ch03-02-data-types.html#integer-types"
    actions:
      - id: close-board-plan
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-main
        type: workspace.openFile
        at: { scene: start, offsetMs: 800 }
        path: main.rs
      - id: select-capital
        type: editor.select
        at: { mark: select-capital }
        target:
          file: main.rs
          text: "The"
          occurrence: 1
      - id: type-use
        type: editor.type
        at: { mark: type-use }
        target:
          file: main.rs
          after: ""
          occurrence: 1
        cadence: fast-explainer
        text: "use std::collections::HashMap;\n\n"
      - id: type-fn
        type: editor.type
        at: { mark: type-fn, offsetMs: -200 }
        target:
          file: main.rs
          after: "use std::collections::HashMap;\n\n"
          occurrence: 1
        cadence: line-by-line
        text: "fn count_words(text: &str) -> HashMap<String, u32> {\n    let mut counts = HashMap::new();\n    counts\n}\n\n"
      - id: select-sig
        type: editor.select
        at: { mark: select-sig }
        target:
          file: main.rs
          text: "HashMap<String, u32>"
          occurrence: 1
      - id: select-return
        type: editor.select
        at: { mark: select-return }
        target:
          file: main.rs
          text: "counts"
          occurrence: 2

  - id: loop
    narration: >
      [[mark:type-loop]] Now the loop. It runs once for every word in the
      text.
      [[mark:select-split]] split_whitespace gives us the words one at a time.
      Each word is a slice of the text, so nothing is copied.
      [[mark:select-lower]] to_lowercase makes a new String, in lowercase. We
      shadow word with it, so from here on, word is that String.
      [[mark:select-entry]] Then the counting you've seen before. entry takes
      the String, and or_insert puts it in the map with a zero if it's new.
      Either way, you get back a mutable reference to the count.
      [[mark:select-star]] The star follows that reference, so plus-equals one
      changes the count inside the map.
    sources:
      - title: "str::split_whitespace"
        url: "https://doc.rust-lang.org/std/primitive.str.html#method.split_whitespace"
      - title: "str::to_lowercase (returns a new String)"
        url: "https://doc.rust-lang.org/std/primitive.str.html#method.to_lowercase"
      - title: "The Rust Book — Shadowing"
        url: "https://doc.rust-lang.org/book/ch03-01-variables-and-mutability.html#shadowing"
      - title: "std::collections::hash_map::Entry::or_insert"
        url: "https://doc.rust-lang.org/std/collections/hash_map/enum.Entry.html#method.or_insert"
    actions:
      - id: type-loop
        type: editor.type
        at: { mark: type-loop, offsetMs: -200 }
        target:
          file: main.rs
          after: "    let mut counts = HashMap::new();\n"
          occurrence: 1
        cadence: line-by-line
        text: "    for word in text.split_whitespace() {\n        let word = word.to_lowercase();\n        let count = counts.entry(word).or_insert(0);\n        *count += 1;\n    }\n"
      - id: select-split
        type: editor.select
        at: { mark: select-split }
        target:
          file: main.rs
          text: "text.split_whitespace()"
          occurrence: 1
      - id: select-lower
        type: editor.select
        at: { mark: select-lower }
        target:
          file: main.rs
          text: "let word = word.to_lowercase();"
          occurrence: 1
      - id: select-entry
        type: editor.select
        at: { mark: select-entry }
        target:
          file: main.rs
          text: "counts.entry(word).or_insert(0)"
          occurrence: 1
      - id: select-star
        type: editor.select
        at: { mark: select-star }
        target:
          file: main.rs
          text: "*count += 1"
          occurrence: 1

  - id: owned-keys
    chapter: Why the map owns its keys
    narration: >
      Why does the map hold Strings? Couldn't it borrow its keys?
      [[mark:draw-err-sig]] Let's say the keys are string slices instead,
      ampersand str.
      [[mark:draw-err-borrow]] Then each key is a slice of word, the new
      lowercase String. as_str makes that slice.
      [[mark:draw-err-msg]] The compiler refuses, with error E0515. It can't
      return a value that references the local variable word.
      [[mark:draw-err-drop]] word is made inside the loop, and it's dropped at
      the end of each pass.
      [[mark:draw-err-return]] But the map is returned, so its keys would
      point at freed memory.
      [[mark:draw-text-ok]] Slices of text would be fine, because text comes
      from outside the function. Our lowercase Strings are made inside it.
      [[mark:draw-fix]] So the map takes each String itself. It owns its keys,
      so they live as long as it does.
    sources:
      - title: "Rust error codes — E0515"
        url: "https://doc.rust-lang.org/error_codes/E0515.html"
      - title: "The Rust Book — Hash Maps and Ownership"
        url: "https://doc.rust-lang.org/book/ch08-03-hash-maps.html#hash-maps-and-ownership"
      - title: "The Rust Book — Dangling References"
        url: "https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html#dangling-references"
      - title: "The Rust Book — Lifetime Elision (a returned reference borrows from the &str parameter)"
        url: "https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#lifetime-elision"
    actions:
      - id: open-board-keys
        type: whiteboard.apply
        at: { scene: start }
        open: true
        clear: true
        upsertIds: [w-title]
      - id: draw-err-sig
        type: whiteboard.apply
        at: { mark: draw-err-sig }
        upsertIds: [w-code1, w-u-str, w-code-for]
        drawMs: 2200
      - id: draw-err-borrow
        type: whiteboard.apply
        at: { mark: draw-err-borrow }
        upsertIds: [w-code2, w-code3, w-u-borrow, w-l-borrow, w-code-end, w-code4]
        drawMs: 3000
      - id: draw-err-msg
        type: whiteboard.apply
        at: { mark: draw-err-msg }
        upsertIds: [w-err1, w-err2]
        drawMs: 2400
      - id: draw-err-drop
        type: whiteboard.apply
        at: { mark: draw-err-drop }
        upsertIds: [w-c-drop, w-l-drop]
        drawMs: 1600
      - id: draw-err-return
        type: whiteboard.apply
        at: { mark: draw-err-return }
        upsertIds: [w-u-counts]
        drawMs: 600
      - id: draw-text-ok
        type: whiteboard.apply
        at: { mark: draw-text-ok }
        upsertIds: [w-u-text]
        drawMs: 700
      - id: draw-fix
        type: whiteboard.apply
        at: { mark: draw-fix }
        upsertIds: [w-fix]
        drawMs: 1400

  - id: collect
    chapter: Sorting and printing
    narration: >
      [[mark:type-collect]] Back in main, let's call count_words, and turn the
      map into a Vec of pairs.
      [[mark:select-into]] into_iter moves each key and value out of the map,
      as a pair, and collect builds the Vec.
      [[mark:select-pairs-type]] The type we wrote tells collect what to
      build: a Vec of String and u32 tuples. pairs needs mut, because sorting
      changes it in place.
    sources:
      - title: "std::collections::HashMap (IntoIterator: moves out each key-value pair)"
        url: "https://doc.rust-lang.org/std/collections/struct.HashMap.html#impl-IntoIterator-for-HashMap%3CK,+V,+S%3E"
      - title: "std::iter::Iterator::collect"
        url: "https://doc.rust-lang.org/std/iter/trait.Iterator.html#method.collect"
      - title: "slice::sort_by (takes &mut self)"
        url: "https://doc.rust-lang.org/std/primitive.slice.html#method.sort_by"
    actions:
      - id: close-board-keys
        type: whiteboard.apply
        at: { scene: start, offsetMs: -400 }
        open: false
      - id: type-collect
        type: editor.type
        at: { mark: type-collect }
        target:
          file: main.rs
          after: "    let text = \"the cat sat on the mat The cat was happy\";\n"
          occurrence: 1
        cadence: line-by-line
        text: "    let counts = count_words(text);\n    let mut pairs: Vec<(String, u32)> = counts.into_iter().collect();\n"
      - id: select-into
        type: editor.select
        at: { mark: select-into }
        target:
          file: main.rs
          text: "counts.into_iter().collect()"
          occurrence: 1
      - id: select-pairs-type
        type: editor.select
        at: { mark: select-pairs-type }
        target:
          file: main.rs
          text: "mut pairs: Vec<(String, u32)>"
          occurrence: 1

  - id: sort
    narration: >
      [[mark:type-sort]] Now sort_by.
      [[mark:select-closure]] It takes a closure that compares two pairs, a
      and b. In each pair, dot zero is the word, and dot one is the count. cmp
      compares two values and returns less, equal, or greater.
      [[mark:select-count-cmp]] Here we compare b's count with a's. b comes
      first, so the biggest count goes to the top.
      [[mark:select-then]] When two counts are equal, the method called then
      compares the words, in alphabetical order. Without it, equal counts
      could come out in a different order on each run, because the map has no
      order.
      [[mark:type-print]] Last, we print the number of different words, and
      take three keeps only the first three pairs to print.
    sources:
      - title: "slice::sort_by (a stable sort with a comparison closure)"
        url: "https://doc.rust-lang.org/std/primitive.slice.html#method.sort_by"
      - title: "std::cmp::Ord::cmp"
        url: "https://doc.rust-lang.org/std/cmp/trait.Ord.html#tymethod.cmp"
      - title: "std::cmp::Ordering::then"
        url: "https://doc.rust-lang.org/std/cmp/enum.Ordering.html#method.then"
      - title: "std::iter::Iterator::take"
        url: "https://doc.rust-lang.org/std/iter/trait.Iterator.html#method.take"
      - title: "The Rust Book — Closures"
        url: "https://doc.rust-lang.org/book/ch13-01-closures.html"
    actions:
      - id: type-sort
        type: editor.type
        at: { mark: type-sort, offsetMs: -200 }
        target:
          file: main.rs
          after: "    let mut pairs: Vec<(String, u32)> = counts.into_iter().collect();\n"
          occurrence: 1
        cadence: line-by-line
        text: "    pairs.sort_by(|a, b| b.1.cmp(&a.1).then(a.0.cmp(&b.0)));\n"
      - id: select-closure
        type: editor.select
        at: { mark: select-closure }
        target:
          file: main.rs
          text: "|a, b|"
          occurrence: 1
      - id: select-count-cmp
        type: editor.select
        at: { mark: select-count-cmp }
        target:
          file: main.rs
          text: "b.1.cmp(&a.1)"
          occurrence: 1
      - id: select-then
        type: editor.select
        at: { mark: select-then }
        target:
          file: main.rs
          text: ".then(a.0.cmp(&b.0))"
          occurrence: 1
      - id: type-print
        type: editor.type
        at: { mark: type-print }
        target:
          file: main.rs
          after: "    pairs.sort_by(|a, b| b.1.cmp(&a.1).then(a.0.cmp(&b.0)));\n"
          occurrence: 1
        cadence: line-by-line
        text: "    println!(\"{} different words\", pairs.len());\n    for (word, count) in pairs.iter().take(3) {\n        println!(\"{word}: {count}\");\n    }\n"

  - id: run
    narration: >
      [[mark:run]] Let's run it. Seven different words. The word the comes
      first, three times, because the capital The counts too. Then cat, with
      two. Five words appear once. They're sorted by word, so happy comes
      third.
    sources:
      - title: "The Rust Book — Updating a Value Based on the Old Value"
        url: "https://doc.rust-lang.org/book/ch08-03-hash-maps.html#updating-a-value-based-on-the-old-value"
      - title: "std::cmp::Ordering::then"
        url: "https://doc.rust-lang.org/std/cmp/enum.Ordering.html#method.then"
    actions:
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "happy: 1"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: "pairs.sort_by(|a, b| b.1.cmp(&a.1).then(a.0.cmp(&b.0)));"

  - id: wrap
    narration: >
      That program used many ideas from this course. Ownership and borrowing
      keep memory safe without a garbage collector. Option and Result make you
      handle missing values and errors, and collections and iterators store
      and process your data. You're ready to write your own Rust programs.
    sources:
      - title: "The Rust Book — Understanding Ownership"
        url: "https://doc.rust-lang.org/book/ch04-00-understanding-ownership.html"
      - title: "The Rust Book — Error Handling"
        url: "https://doc.rust-lang.org/book/ch09-00-error-handling.html"
      - title: "The Rust Book — Functional Language Features: Iterators and Closures"
        url: "https://doc.rust-lang.org/book/ch13-00-functional-features.html"
    actions: []

checks:
  - { type: timing.p95Ms, max: 300 }
