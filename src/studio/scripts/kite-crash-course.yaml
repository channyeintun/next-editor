  - id: wrap
    narration: "[[mark:wrap]] Twenty-seven keywords, and you've now seen all of them. Go has twenty-five, C has thirty-two, Rust thirty-nine, Swift over ninety. That number is a design position rather than a boast: one loop keyword, no null, one formatter with no options, and one rule about failure that the compiler keeps for you. Kite targets WebAssembly first, so it's meant to sit beside HTML and CSS and take the parts of a page worth type checking. And the version is the point — Kite pins its language at one and doesn't intend to break you later. What you just learned is what it stays."
