# Kite: a crash course.
#
# A survey lesson — it tours a whole language rather than teaching one idea, so
# it is long by design (docs/studio-persona.md, "pick a shape and commit to it").
#
# Four whiteboard boards open the lesson and one interrupts it, because the
# things a viewer needs before the code — why this language exists, what happens
# when you press Run, how many words there are to learn, and the one rule about
# failure — are not things a file of source can show. The board is never
# maximized: it opens docked so the editor stays in frame beside it.
#
# Boards are authored for Excalidraw's dark theme, which inverts colors, so the
# mid-tone palette (#1971c2, #2f9e44, #f08c00, #e03131, #6741d9) draws as the
# lighter version of the same hue and #1e1e1e draws as white — see the note
# above `whiteboardAssets` for what each color means.
#
# The 27 keywords this lesson claims are the compiler's own census, not a count
# taken from prose: `KEYWORDS` in `kite-lexer/src/kinds.rs` is an array of
# exactly `TokenKind::KEYWORD_COUNT == 27` entries, and the lesson names all of
# them. `while`, `loop`, `const` and `null` are absent from that array, which is
# what the narration means when it says the language has no `while` keyword and
# no null — the "for does all three jobs" claim is likewise `ForHeader::{Loop,
# In, While}` in the parser, spelled out in the AST.
#
# The keywords are the spine, but they are not the whole surface, so the lesson
# also covers the parts of Kite that are not words: `@derive`, `dyn`, `..spread`,
# `require`/`assert`, `"""` blocks, typed errors, `_ =`, and the two shapes of
# test. Each of those scenes sits after the keyword it leans on rather than next
# to its topic, which is why two are not where you would first look for them:
# `decode` is separated from `derive` by the whole error section, because
# `read_order` returns `(Order, error)` and spends a `check`, neither of which
# the lesson has shown before `errorboard`; and `blocks` sits with `as` and
# interpolation rather than with the later material, because its one real trap
# is that a hole turns the dedent off.
#
# `run` and `wrap` are the last two scenes and must stay that way: `run` is where
# the program is executed and the pinned output appears, so nothing may be typed
# after it. Every scene that adds a file-scope declaration adds it *above*
# `restocked`, because `async`'s `type-async-main` inserts the bare word `async `
# after `restocked`'s closing brace and would otherwise prefix the wrong `fn`.
#
# src/studio/kiteCrashCourse.test.ts replays the typing actions below through the
# bundled `kite-compiler.wasm` and checks the pinned fixture against what it
# really prints, so the code and the fixture cannot drift apart.
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/kite-crash-course.yaml
schemaVersion: 1

lesson:
  slug: kite-crash-course
  title: "Kite: a crash course"
  locale: en-US
  workspace:
    lessonType: kite
    name: Kite Crash Course
    entryFilePath: main.kite
    # One file for the whole lesson, so the explorer is a list of one taking
    # width from the code beside it — the same argument as the runner dock
    # below, on the other axis.
    sidebarStartsCollapsed: true
    files:
      main.kite: |
        // A crash course in Kite.

        fn main() {
        }
  # Authored for Excalidraw's DARK theme (WhiteboardPanel pins theme="dark"),
