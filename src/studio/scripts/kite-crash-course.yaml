  # near-white, and the standard mid-tone Excalidraw palette below draws as the
  # legible lighter version of the same hue. Colour carries meaning here — blue
  # names the thing under discussion, green is what is safe or already done,
  # orange is the caveat, red is the part under the spotlight, purple is the
  # result. Never author pale/near-white: it inverts to near-black and vanishes.
