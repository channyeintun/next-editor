build:
  voiceProfile: pocket-alba-v1
  seed: 11

runtime:
  kind: kite-playground
  defaultMode: fixture
  fixture:
    # 200ms run offset + 600ms latency puts the output on screen at ~0.8s, right
    # as the "let's run it" lead ends, so the narration reads a result that is
    # already visible instead of announcing one that has not arrived.
    latencyMs: 600
    transientErrorKinds: []
    result:
      status: success
      stdout: "Kite & Co, visit 1\nfirst time here, open is true\ncounted 10\n(tally is done)\ntally 12\n3 names, first kite\na kite costs 40\nsquares 1 4 9 16\nevens 2\na quarter of a kite is 10.0\nand math.max_int is positive: true\nkite at 40\nkite x2\ncard ending 4242\ncredit, net 30\nloudest wind\nas expected: nothing divides by zero\nmean 4\nrestocked to 12\n"
      stderr: ""

scenes:
  - id: why
    narration: >
      [[mark:draw-why-kite]] Kite is a small language, and the shortest way to
      say what it's for is to say where it runs. It compiles to WebAssembly,
      which it was designed around rather than given later.
      [[mark:draw-why-page]] That's the thing a browser already knows how to
      load, so a Kite program sits in a page next to the HTML and the CSS.
      [[mark:draw-why-note]] The idea is that
      you write the parts of a page that are worth type checking in Kite, and
      leave the rest alone. [[mark:draw-why-pos]] And it's deliberately small.
      Twenty-seven keywords, no null, one formatter with no options to argue
      about, and the language version is pinned at one, so what you learn today
      keeps working. Let's look at what happens when you run it.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      # Both land in the two quiet seconds the studio reserves before the first
      # dialog, so the panel is open and titled when the voice starts. The board
      # opens docked — never maximized — so the editor stays in frame beside it.
      - {
          id: open-board,
          type: whiteboard.apply,
          at: { scene: start, offsetMs: -1700 },
          open: true,
        }
      - {
          id: draw-why-title,
          type: whiteboard.apply,
          at: { scene: start, offsetMs: -1200 },
          upsertIds: [why-title],
          drawMs: 600,
        }
      - {
          id: draw-why-kite,
          type: whiteboard.apply,
          at: { mark: draw-why-kite },
          upsertIds: [why-kite-box, why-kite-t1, why-kite-t2],
          drawMs: 1200,
        }
      - {
          id: draw-why-page,
          type: whiteboard.apply,
          at: { mark: draw-why-page },
          upsertIds: [why-arrow, why-page-box, why-page-t1, why-page-t2],
          drawMs: 1600,
        }
      - {
          id: draw-why-note,
          type: whiteboard.apply,
          at: { mark: draw-why-note },
          upsertIds: [why-note, why-underline],
          drawMs: 1100,
        }
      - {
          id: draw-why-pos,
          type: whiteboard.apply,
          at: { mark: draw-why-pos },
          upsertIds: [why-pos-1, why-pos-2, why-pos-3, why-pos-4],
          drawMs: 1600,
        }

  - id: compiler
    narration: >
      [[mark:draw-comp-src]] You press Run, and the compiler reads your file.
      [[mark:draw-comp-check]] It works out what every name means, checks the
      types line up, and makes sure you've handled every case you said you
      would. If any of that fails, nothing runs, and you get the error instead.
      [[mark:draw-comp-out]] What comes out the other side is WebAssembly.
      [[mark:draw-comp-note]] Now here's the part worth stopping on, and it's
      about this page rather than about Kite. Normally kitec is a program you
      install and run in a terminal, like any other compiler. But it's written
      in Rust, and Rust builds for WebAssembly too. [[mark:draw-comp-where]] So
      there's a build of that same compiler that runs in a browser, and that's
      the one this page loaded. No server, and nothing to sign in to. The errors
      you'll see are the ones a terminal would show, because either way it's the
      same compiler.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
      - {
          title: "WebAssembly — Concepts",
          url: "https://developer.mozilla.org/en-US/docs/WebAssembly/Concepts",
        }
    actions:
      # The first board is wiped — this diagram reuses its canvas.
      - id: draw-comp-src
        type: whiteboard.apply
        at: { mark: draw-comp-src }
        clear: true
        upsertIds: [comp-title, comp-src-box, comp-src-t, comp-arrow-1]
        drawMs: 1500
      - {
          id: draw-comp-check,
          type: whiteboard.apply,
          at: { mark: draw-comp-check },
          upsertIds: [comp-check-box, comp-check-t1, comp-check-t2, comp-check-t3],
          drawMs: 1700,
        }
      - {
          id: draw-comp-out,
          type: whiteboard.apply,
          at: { mark: draw-comp-out },
          upsertIds: [comp-arrow-2, comp-out-box, comp-out-t],
          drawMs: 1200,
        }
      - {
          id: draw-comp-note,
          type: whiteboard.apply,
          at: { mark: draw-comp-note },
          upsertIds: [comp-note-1, comp-note-2, comp-circle],
          drawMs: 1500,
        }
      - {
          id: draw-comp-where,
          type: whiteboard.apply,
          at: { mark: draw-comp-where },
          upsertIds: [comp-note-3, comp-note-4],
          drawMs: 1100,
        }

  - id: keywords
    narration: >
      [[mark:draw-kw-bind]] Before any code, here's the whole vocabulary, so
      you know how much there is. Two words bind a value.
      [[mark:draw-kw-declare]] Nine declare things — functions, types, structs,
      enums, traits, and the words that say who can see them.
      [[mark:draw-kw-flow]] Nine steer the program. There's one loop keyword in
      that row, and you'll see why in a moment. [[mark:draw-kw-values]] Four are
      values and conversion — and notice what's missing from that row, because
      there's no null anywhere in this language. [[mark:draw-kw-fail]] And three
      are about failing and waiting. [[mark:kw-to-code]] That's it. That's the
      list. Every keyword you're about to see is one of these twenty-seven, and
      by the end we'll have used all of them.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      # The compiler diagram is wiped — the vocabulary reuses its canvas.
      - id: draw-kw-bind
        type: whiteboard.apply
        at: { mark: draw-kw-bind }
        clear: true
        upsertIds: [kw-title, kw-g1, kw-w1]
        drawMs: 1400
      - {
          id: draw-kw-declare,
          type: whiteboard.apply,
          at: { mark: draw-kw-declare },
          upsertIds: [kw-g2, kw-w2a, kw-w2b],
          drawMs: 1600,
        }
      - {
          id: draw-kw-flow,
          type: whiteboard.apply,
          at: { mark: draw-kw-flow },
          upsertIds: [kw-g3, kw-w3a, kw-w3b],
          drawMs: 1600,
        }
      - {
          id: draw-kw-values,
          type: whiteboard.apply,
          at: { mark: draw-kw-values },
          upsertIds: [kw-g4, kw-w4],
          drawMs: 1100,
        }
      - {
          id: draw-kw-fail,
          type: whiteboard.apply,
          at: { mark: draw-kw-fail },
          upsertIds: [kw-g5, kw-w5],
          drawMs: 1100,
        }
      - { id: close-board, type: whiteboard.apply, at: { mark: kw-to-code }, open: false }

  - id: shape
    narration: >
      [[mark:open]] Here's the whole program we're starting from. A function
      called main, and that's where a run begins. Notice what isn't here: no
      build file, no class wrapped around the function, nothing to configure.
      [[mark:values]] So, two ways to name a value. Let binds once. Var is the
      one you're allowed to reassign, and you have to say so up front — which
      means anything not marked var can be read without wondering who changed
      it later. That last line puts a value inside a string with a backslash and
      parentheses.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: open-main
        type: workspace.openFile
        at: { mark: open }
        path: main.kite
      - id: type-values
        type: editor.type
        at: { mark: values }
        cadence: line-by-line
        target: { file: main.kite, after: "fn main() {\n", occurrence: 1 }
        text: "    // `let` binds once; `var` is the one that can be reassigned.\n    let shop = \"Kite & Co\"\n    var visits = 0\n    visits += 1\n    io.print(\"\\(shop), visit \\(visits)\")\n\n"

  - id: modules
    narration: >
      [[mark:use]] Use imports a module. A Kite module is a directory, so the
      files sitting beside this one are already part of the same program and
      need no import at all — use is for reaching outside it, and here that's
      the standard library. There's one exception: the prelude, which is in
      scope everywhere without asking for it.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-use
        type: editor.type
        at: { mark: use }
        cadence: line-by-line
        target: { file: main.kite, after: "// A crash course in Kite.\n\n", occurrence: 1 }
        text: "use std/math\n\n"

  - id: aliases
    narration: >
      [[mark:type]] Type gives a type a second spelling. An alias gets replaced
      by what it names before anything else is checked, so the two are
      interchangeable everywhere — a Prices is a map, not a new type that wraps
      one. We'll use this name in a minute.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-alias
        type: editor.type
        at: { mark: type }
        cadence: line-by-line
        target: { file: main.kite, after: "use std/math\n\n", occurrence: 1 }
        text: "/// An alias is a second spelling, interchangeable with what it names.\ntype Prices = { str: int }\n\n"

  - id: branch
    narration: >
      [[mark:branch]] If and else read the way they do everywhere else. The
      condition needs no parentheses around it, and the braces aren't optional,
      so there's no argument to have about where a one-line body goes. The
      condition here checks two things with a double ampersand, and both
      branches print. [[mark:bools]] True and false are the two bool literals,
      and a condition has to actually be a bool. There's no truthiness to learn
      here, and no zero that quietly means no.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-branch
        type: editor.type
        at: { mark: branch }
        cadence: line-by-line
        target:
          {
            file: main.kite,
            after: "    io.print(\"\\(shop), visit \\(visits)\")\n\n",
            occurrence: 1,
          }
        text: "    // `if` and `else` read the way you expect, and `bool` is `true`/`false`.\n    let open = true\n    if open && visits == 1 {\n        io.print(\"first time here, open is \\(open)\")\n    } else {\n        io.print(\"closed today, open is \\(false)\")\n    }\n\n"
      - id: select-bools
        type: editor.select
        at: { mark: bools }
        target: { file: main.kite, text: "    let open = true\n", occurrence: 1 }

  - id: loops
    narration: >
      [[mark:loops]] Here's the first real surprise. Kite has no while, and no
      loop keyword either. For does all three jobs: for something in a list
      walks the list, for followed by a condition is a while, and a bare for on
      its own runs until you break out of it. One keyword, three headers,
      nothing extra to look up. This one adds up three numbers.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-loop
        type: editor.type
        at: { mark: loops }
        cadence: line-by-line
        target: { file: main.kite, after: "    }\n\n", occurrence: 1 }
        text: "    // There is no `while` and no `loop`: `for` covers all three.\n    var counted = 0\n    for n in [2, 3, 5] {\n        counted += n\n    }\n    io.print(\"counted \\(counted)\")\n\n"

  - id: flow
    narration: >
      [[mark:tally]] Now a function that adds up an order, and it carries three
      more keywords at once. It takes a list of numbers and hands back a single
      number. Watch the three lines that steer it as they land — one skips a
      value, one stops the loop early, and one runs at the very end no matter
      how the function leaves. The rule the function follows is: ignore the
      zeroes, and stop completely at the first order that's too big.
      [[mark:skip]] Continue skips to the next turn of the loop, so a zero adds
      nothing and we move on. [[mark:stop]] Break leaves the loop altogether —
      that nine hundred stops the count where it stands. [[mark:defer]] And
      defer runs its line on the way out, however the function leaves. So the
      cleanup sits next to the thing it cleans up, instead of at the bottom
      where you'd have to trust that every path reaches it. [[mark:call]] Watch
      the order when we run this at the end: the deferred line prints before the
      value it computed.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-tally
        type: editor.type
        at: { mark: tally }
        cadence: line-by-line
        target: { file: main.kite, after: "type Prices = { str: int }\n\n", occurrence: 1 }
        text: "/// Skipping zeroes and stopping at the first oversized order.\nfn tally(orders: [int]) -> int {\n    defer io.print(\"(tally is done)\")\n    var total = 0\n    for n in orders {\n        if n == 0 {\n            continue\n        }\n        if n > 100 {\n            break\n        }\n        total += n\n    }\n    return total\n}\n\n"
      - id: select-continue
        type: editor.select
        at: { mark: skip }
        target: { file: main.kite, text: "            continue\n", occurrence: 1 }
      - id: select-break
        type: editor.select
        at: { mark: stop }
        target: { file: main.kite, text: "            break\n", occurrence: 1 }
      - id: select-defer
        type: editor.select
        at: { mark: defer }
        target:
          { file: main.kite, text: "    defer io.print(\"(tally is done)\")\n", occurrence: 1 }
      - id: type-call-tally
        type: editor.type
        at: { mark: call }
        cadence: line-by-line
        target:
          { file: main.kite, after: "    io.print(\"counted \\(counted)\")\n\n", occurrence: 1 }
        text: "    // `break` and `continue` steer a loop; `defer` runs on the way out.\n    io.print(\"tally \\(tally([5, 0, 7, 900, 1]))\")\n\n"

  - id: slices
    narration: >
      [[mark:slices]] A list of values is a slice, written in square brackets,
      and its type is written the same way — so a list of ints is int in
      brackets. [[mark:prelude]] Length is a method on it. First comes from the
      prelude, and it hands back an Option rather than a value, because a list
      might be empty. Or-else is where you supply the fallback for that.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-slice
        type: editor.type
        at: { mark: slices }
        cadence: line-by-line
        target:
          {
            file: main.kite,
            after: "    io.print(\"tally \\(tally([5, 0, 7, 900, 1]))\")\n\n",
            occurrence: 1,
          }
        text: "    // A slice, and the prelude that comes with it.\n    let names = [\"kite\", \"string\", \"wind\"]\n    io.print(\"\\(names.len()) names, first \\(or_else(first(names), \"none\"))\")\n\n"
      - id: select-prelude
        type: editor.select
        at: { mark: prelude }
        target: { file: main.kite, text: 'or_else(first(names), "none")', occurrence: 1 }

  - id: maps
    narration: >
      [[mark:maps]] A map is written with braces, keys pointing at values — and
      here it's declared through that alias from earlier, which is this map type
      by another name. [[mark:lookup]] Looking a key up also answers with an
      Option, for the same reason a list's first does: the key might not be
      there. Kite makes you say what happens when it isn't, right at the point
      where you ask.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-map
        type: editor.type
        at: { mark: maps }
        cadence: line-by-line
        target:
          {
            file: main.kite,
            after: "    io.print(\"\\(names.len()) names, first \\(or_else(first(names), \"none\"))\")\n\n",
            occurrence: 1,
          }
        text: "    // A map, named through the alias. Lookup answers an Option.\n    let prices: Prices = { \"kite\": 40, \"string\": 5 }\n    io.print(\"a kite costs \\(or_else(prices[\"kite\"], 0))\")\n\n"
      - id: select-lookup
        type: editor.select
        at: { mark: lookup }
        target: { file: main.kite, text: 'or_else(prices["kite"], 0)', occurrence: 1 }

  - id: closures
    narration: >
      [[mark:closures]] Closures are ordinary values here. The parameters go
      between pipe characters and the body is an expression. Map, filter, count
      and about forty others live in the prelude and take them, so most of the
      work you'd write a loop for is already a function. There's one rule worth
      knowing: a closure captures by value, so it can't capture a var. If it
      could, you'd be writing to a copy and never seeing the change, so the
      language refuses the line rather than letting you find that out later.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-closure
        type: editor.type
        at: { mark: closures }
        cadence: line-by-line
        target:
          {
            file: main.kite,
            after: "    io.print(\"a kite costs \\(or_else(prices[\"kite\"], 0))\")\n\n",
            occurrence: 1,
          }
        text: "    // Closures are ordinary values, and the prelude takes them.\n    let squares = map([1, 2, 3, 4], |n: int| n * n)\n    let shown = join(map(squares, |n: int| \"\\(n)\"), \" \")\n    io.print(\"squares \\(shown)\")\n    io.print(\"evens \\(count([1, 2, 3, 4], |n: int| divides(n, 2)))\")\n\n"

  - id: conversions
    narration: >
      [[mark:as]] As converts a value from one type to another, and you have to
      write it yourself. There are no implicit numeric conversions in Kite — an
      int doesn't quietly turn into a float because the other side of the
      expression happened to be one. [[mark:module]] And there's that imported
      module finally being used, with its name in front of what you're calling.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-as
        type: editor.type
        at: { mark: as }
        cadence: line-by-line
        target:
          {
            file: main.kite,
            after: "    io.print(\"evens \\(count([1, 2, 3, 4], |n: int| divides(n, 2)))\")\n\n",
            occurrence: 1,
          }
        text: "    // `as` converts explicitly. Kite has no implicit numeric conversion.\n    let quarter = 40 as float / 4.0\n    io.print(\"a quarter of a kite is \\(quarter)\")\n    io.print(\"and math.max_int is positive: \\(math.max_int() > 0)\")\n\n"
      - id: select-module
        type: editor.select
        at: { mark: module }
        target: { file: main.kite, text: "math.max_int() > 0", occurrence: 1 }

  - id: structs
    narration: >
      [[mark:struct]] A struct is a named group of fields — here, a line item in
      a very small shop. Fields are read-only unless the field itself says var,
      so a type gets to decide which parts of it can move. Name and price are
      fixed once it's built; stock can change. [[mark:pub]] And there's pub.
      Without it a declaration is private to its module; with it, the module
      lets it out. Private is the default, which is the way round you want.
      [[mark:doc]] Those triple-slash lines are documentation, and the compiler
      reads them — that's the text an editor shows you on hover.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-struct
        type: editor.type
        at: { mark: struct }
        cadence: line-by-line
        target: { file: main.kite, after: "    return total\n}\n\n", occurrence: 1 }
        text: "/// A line item in a very small shop. `pub` is what crosses a module boundary.\npub struct Item {\n    name: str\n    price: int\n    var stock: int\n}\n\n"
      - id: select-pub
        type: editor.select
        at: { mark: pub }
        target: { file: main.kite, text: "pub struct Item {\n", occurrence: 1 }
      - id: select-doc
        type: editor.select
        at: { mark: doc }
        target: { file: main.kite, text: "/// A line item in a very small shop.", occurrence: 1 }

  - id: methods
    narration: >
      [[mark:impl]] Methods live in an impl block, written apart from the data
      they work on. Two of them here: one builds a label out of the fields, and
      one sells some of the stock. A method that only reads takes self, and you
      can see that on the first one. [[mark:varself]] The one that writes takes
      var self instead — so the signature tells you which is which before you
      read a single line of the body. [[mark:use-it]] And structs are
      references, so selling one is visible out here afterwards. There are no
      pointers to take, and no hidden copy to be surprised by.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-impl
        type: editor.type
        at: { mark: impl }
        cadence: line-by-line
        target: { file: main.kite, after: "    var stock: int\n}\n\n", occurrence: 1 }
        text: "impl Item {\n    /// A method that only reads takes `self`.\n    fn label(self) -> str {\n        return \"\\(self.name) at \\(self.price)\"\n    }\n\n    /// One that writes takes `var self`.\n    fn sell(var self, n: int) {\n        self.stock -= n\n    }\n}\n\n"
      - id: select-varself
        type: editor.select
        at: { mark: varself }
        target: { file: main.kite, text: "    fn sell(var self, n: int) {\n", occurrence: 1 }
      - id: type-use-struct
        type: editor.type
        at: { mark: use-it }
        cadence: line-by-line
        target:
          {
            file: main.kite,
            after: "    io.print(\"and math.max_int is positive: \\(math.max_int() > 0)\")\n\n",
            occurrence: 1,
          }
        text: "    // Structs are references, so `sell` is visible here afterwards.\n    var kite = Item{ name: \"kite\", price: 40, stock: 3 }\n    io.print(kite.label())\n    kite.sell(1)\n"

  - id: traits
    narration: >
      [[mark:trait]] A trait is behaviour that a type promises to have. It's
      signatures and no bodies — a list of what you'll be able to call, with the
      how left out. Here it's one method that turns something into text. Then
      underneath, the part that supplies the bodies for a particular type.
      [[mark:implfor]] That's impl Describe for Item. Because the trait and the
      implementation are written separately, you can give a trait to a type you
      didn't define — the type doesn't have to know the trait exists.
      [[mark:calldesc]] And calling it looks like any other method.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-trait
        type: editor.type
        at: { mark: trait }
        cadence: line-by-line
        target: { file: main.kite, after: "    }\n}\n\n", occurrence: 1 }
        text: "/// A trait is behaviour a type promises.\ntrait Describe {\n    fn describe(self) -> str\n}\n\nimpl Describe for Item {\n    fn describe(self) -> str {\n        return \"\\(self.name) x\\(self.stock)\"\n    }\n}\n\n"
      - id: select-implfor
        type: editor.select
        at: { mark: implfor }
        target: { file: main.kite, text: "impl Describe for Item {\n", occurrence: 1 }
      - id: type-describe
        type: editor.type
        at: { mark: calldesc }
        cadence: line-by-line
        target: { file: main.kite, after: "    kite.sell(1)\n", occurrence: 1 }
        text: "    io.print(kite.describe())\n\n"

  - id: enums
    narration: >
      [[mark:enum]] An enum names every shape a value is allowed to take, and a
      variant can carry data along with it. This one is a payment: it's either
      cash, which carries nothing, or a card, which carries the last four
      digits, or credit, which carries a number of days. Three shapes, and no
      fourth. Underneath it, a function that turns any payment into text.
      [[mark:match]] Match is how you pull a shape apart, and it binds what was
      inside so you can use it. The important part is that it's exhaustive: miss
      a variant and the program doesn't compile, and the error names the ones
      you missed. That's what makes adding a variant later a safe thing to do —
      the compiler walks you through every place that has to change.
      [[mark:calls]] And match is an expression, so it returns a value straight
      out of the arm that matched.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-enum
        type: editor.type
        at: { mark: enum }
        cadence: line-by-line
        target:
          {
            file: main.kite,
            after: "        return \"\\(self.name) x\\(self.stock)\"\n    }\n}\n\n",
            occurrence: 1,
          }
        text: "/// An enum names every shape a value is allowed to take.\nenum Payment {\n    Cash\n    Card(last4: str)\n    Credit(days: int)\n}\n\nfn describe_payment(p: Payment) -> str {\n    return match p {\n        Cash => \"cash\",\n        Card(last4) => \"card ending \\(last4)\",\n        Credit(days) => \"credit, net \\(days)\",\n    }\n}\n\n"
      - id: select-match
        type: editor.select
        at: { mark: match }
        target: { file: main.kite, text: "    return match p {\n", occurrence: 1 }
      - id: type-payments
        type: editor.type
        at: { mark: calls }
        cadence: line-by-line
        target: { file: main.kite, after: "    io.print(kite.describe())\n\n", occurrence: 1 }
        text: "    // An enum plus `match`, which the compiler checks is exhaustive.\n    io.print(describe_payment(Card(last4: \"4242\")))\n    io.print(describe_payment(Credit(days: 30)))\n\n"

  - id: generics
    narration: >
      [[mark:generic]] Generics use angle brackets, and the T there stands for
      whatever type you hand it. They're checked once, where they're written,
      rather than again at every call site. [[mark:option]] This one gives back
      an Option, which is how Kite spells the absence of a value. There's no
      null in this language at all. A thing that might not be there says so in
      its type, and you can't read it without answering that question first.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-generic
        type: editor.type
        at: { mark: generic }
        cadence: line-by-line
        target:
          {
            file: main.kite,
            after: "        Credit(days) => \"credit, net \\(days)\",\n    }\n}\n\n",
            occurrence: 1,
          }
        text: "/// Generics are checked once, where they are written.\nfn loudest<T>(items: [T]) -> Option<T> {\n    return last(items)\n}\n\n"
      - id: type-option
        type: editor.type
        at: { mark: option }
        cadence: line-by-line
        target:
          {
            file: main.kite,
            after: "    io.print(describe_payment(Credit(days: 30)))\n\n",
            occurrence: 1,
          }
        text: "    // Option is how \"no value\" is spelled. There is no null in Kite.\n    io.print(\"loudest \\(or_else(loudest(names), \"none\"))\")\n\n"

  - id: errorboard
    narration: >
      [[mark:draw-err-fn]] Before the last few keywords, let's put one idea on
      the board, because it's the promise Kite makes that the languages it
      borrows from don't. Take a function that divides two numbers. It can fail
      — someone might pass a zero. [[mark:draw-err-out]] So it doesn't answer
      with a number. It answers with two things: a number, and an error that
      says why there isn't one. [[mark:draw-err-rule]] And here's the rule the
      compiler keeps for you. You can't read the number until the error has been
      tested. Not "you shouldn't" — the program won't compile.
      [[mark:draw-err-check]] Handling it on the spot is one option. The other
      is one keyword: check, which says if this failed, hand it back to whoever
      called me. [[mark:err-to-code]] Let's write both.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      # Re-open the docked board mid-lesson, wiping the vocabulary behind it.
      - {
          id: reopen-board,
          type: whiteboard.apply,
          at: { scene: start, offsetMs: -400 },
          open: true,
        }
      - id: draw-err-fn
        type: whiteboard.apply
        at: { mark: draw-err-fn }
        clear: true
        upsertIds: [err-title, err-fn-box, err-fn-t]
        drawMs: 1400
      - {
          id: draw-err-out,
          type: whiteboard.apply,
          at: { mark: draw-err-out },
          upsertIds: [err-arrow, err-val-box, err-val-t, err-err-box, err-err-t],
          drawMs: 1800,
        }
      - {
          id: draw-err-rule,
          type: whiteboard.apply,
          at: { mark: draw-err-rule },
          upsertIds: [err-rule-1, err-rule-2, err-underline],
          drawMs: 1600,
        }
      - {
          id: draw-err-check,
          type: whiteboard.apply,
          at: { mark: draw-err-check },
          upsertIds: [err-check-t1, err-check-t2],
          drawMs: 1300,
        }
      - { id: close-err-board, type: whiteboard.apply, at: { mark: err-to-code }, open: false }

  - id: errors
    narration: >
      [[mark:divide]] Here's that function. Look at the failing return, the one
      inside the if — where the number should be, there's an underscore. Not a
      zero, not an empty string. On that path there's no number, and the
      language lets you say so instead of inventing one. And on the good path,
      the error slot says nil. Nil is the error that isn't one.
      [[mark:tainted]] So a call hands you both at once, and you name them both.
      Move that print above the test and it stops compiling. Ignore the error
      completely and that's rejected too. The failure path gets written on the
      line where the failure can happen, which is the whole point.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-divide
        type: editor.type
        at: { mark: divide }
        cadence: line-by-line
        target: { file: main.kite, after: "    return last(items)\n}\n\n", occurrence: 1 }
        text: "/// A quotient, or a reason there is not one.\nfn divide(a: int, b: int) -> (int, error) {\n    if b == 0 {\n        return _, errors.new(\"nothing divides by zero\")\n    }\n    return a / b, nil\n}\n\n"
      - id: type-use-divide
        type: editor.type
        at: { mark: tainted }
        cadence: line-by-line
        target:
          {
            file: main.kite,
            after: "    io.print(\"loudest \\(or_else(loudest(names), \"none\"))\")\n\n",
            occurrence: 1,
          }
        text: "    // A failure is an ordinary value, and cannot be read until it is tested.\n    let (bad, berr) = divide(1, 0)\n    if berr != nil {\n        io.print(\"as expected: \\(berr.message())\")\n    }\n\n"

  - id: check
    narration: >
      [[mark:check]] Handling a failure where it happens is one case. Handing it
      to your caller is the other, and it's most of what you'll actually write.
      That gets the one keyword. This function works out a mean, and the divide
      inside it can fail — but it isn't this function's job to decide what to do
      about that. So it doesn't. Check err means: if this failed, return it to
      whoever called me. [[mark:margin]] It sits on a line of its own, so you
      can read down the left edge of a function and see every place it can fail.
      That's deliberate — it isn't a question mark tucked away at the end of a
      long expression. [[mark:usemean]] And the caller handles it once, at the
      top, before using the value. That's the shape almost all Kite error
      handling takes: check it up the chain until you reach the one place that
      knows what to do, and deal with it there.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-mean
        type: editor.type
        at: { mark: check }
        cadence: line-by-line
        target: { file: main.kite, after: "    return a / b, nil\n}\n\n", occurrence: 1 }
        text: "/// The mean, propagating the failure rather than handling it.\nfn mean(totals: [int]) -> (int, error) {\n    let (avg, err) = divide(sum(totals), totals.len())\n    check err\n    return avg, nil\n}\n\n"
      - id: select-margin
        type: editor.select
        at: { mark: margin }
        target: { file: main.kite, text: "    check err\n", occurrence: 1 }
      - id: type-use-mean
        type: editor.type
        at: { mark: usemean }
        cadence: line-by-line
        target:
          {
            file: main.kite,
            after: "        io.print(\"as expected: \\(berr.message())\")\n    }\n\n",
            occurrence: 1,
          }
        text: "    // `check` hands the failure to our caller instead of handling it here.\n    let (avg, err) = mean([2, 4, 6])\n    if err != nil {\n        io.print(\"failed: \\(err.message())\")\n        return\n    }\n    io.print(\"mean \\(avg)\")\n\n"

  - id: async
    narration: >
      [[mark:asyncfn]] Two keywords left, and they go together. An async
      function is one that's allowed to pause partway through, and calling one
      hands you back a Task rather than the value you asked for. Think of the
      Task as a receipt for a result that isn't ready yet. [[mark:mainasync]] A
      function that waits for one has to be async itself — main included, which
      is why we're adding that word to it now. So pausing is always visible in
      the signature, and never hides inside a call that looks ordinary.
      [[mark:await]] And await is what turns the Task back into the value.
      That's twenty-seven.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-async-fn
        type: editor.type
        at: { mark: asyncfn }
        cadence: line-by-line
        target: { file: main.kite, after: "    return avg, nil\n}\n\n", occurrence: 1 }
        text: "/// An async function answers with a Task, which `await` unwraps.\nasync fn restocked(item: Item, by: int) -> int {\n    return item.stock + by\n}\n\n"
      - id: type-async-main
        type: editor.type
        at: { mark: mainasync }
        cadence: line-by-line
        target: { file: main.kite, after: "    return item.stock + by\n}\n\n", occurrence: 1 }
        text: "async "
      - id: type-await
        type: editor.type
        at: { mark: await }
        cadence: line-by-line
        target: { file: main.kite, after: "    io.print(\"mean \\(avg)\")\n\n", occurrence: 1 }
        text: "    // `await` waits for a task and unwraps it.\n    let restock = await restocked(kite, 10)\n    io.print(\"restocked to \\(restock)\")\n"

  - id: run
    narration: >
      That's the whole language. [[mark:run]] Let's run it. Remember, that's the
      compiler working here in the page rather than on a server, so nothing left
      your machine. Nineteen lines. Look for three of them in
      particular: the deferred line printing before the tally it belongs to, the
      division by zero coming back as a value we printed on purpose, and the
      mean arriving through a check. Nothing crashed, and nothing was quietly
      swallowed, because there was never a way to write the version that does.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: run-final
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 20000
      - id: saw-0
        type: expect.output
        at: { afterAction: run-final }
        contains: "Kite & Co, visit 1"
        timeoutMs: 20000
      - id: saw-1
        type: expect.output
        at: { afterAction: saw-0 }
        contains: "open is true"
        timeoutMs: 20000
      - id: saw-2
        type: expect.output
        at: { afterAction: saw-1 }
        contains: "(tally is done)"
        timeoutMs: 20000
      - id: saw-3
        type: expect.output
        at: { afterAction: saw-2 }
        contains: "tally 12"
        timeoutMs: 20000
      - id: saw-4
        type: expect.output
        at: { afterAction: saw-3 }
        contains: "a quarter of a kite is 10.0"
        timeoutMs: 20000
      - id: saw-5
        type: expect.output
        at: { afterAction: saw-4 }
        contains: "kite x2"
        timeoutMs: 20000
      - id: saw-6
        type: expect.output
        at: { afterAction: saw-5 }
        contains: "card ending 4242"
        timeoutMs: 20000
      - id: saw-7
        type: expect.output
        at: { afterAction: saw-6 }
        contains: "loudest wind"
        timeoutMs: 20000
      - id: saw-8
        type: expect.output
        at: { afterAction: saw-7 }
        contains: "as expected: nothing divides by zero"
        timeoutMs: 20000
      - id: saw-9
        type: expect.output
        at: { afterAction: saw-8 }
        contains: "mean 4"
        timeoutMs: 20000
      - id: saw-10
        type: expect.output
        at: { afterAction: saw-9 }
        contains: "restocked to 12"
        timeoutMs: 20000
      - id: file-has-check
        type: expect.file
        at: { afterAction: saw-10 }
        path: main.kite
        contains: "check err"

  - id: wrap
    narration: >
      [[mark:wrap]] Twenty-seven keywords, and you've now seen every one of
      them. For comparison, Go has twenty-five and Rust has thirty-eight. That
      number is a design position rather than a boast: one loop
      keyword, no null, one formatter with nothing to configure, and one rule
      about failure that the compiler keeps for you. Kite targets WebAssembly
      first, so it's meant to sit beside HTML and CSS and take the parts of a
      page worth type checking. And that version number is the point. Kite pins
      its language at one, so it isn't planning to break your code later. What
      you learned today is the language you'll come back to.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
      - { title: "The Go Programming Language Specification", url: "https://go.dev/ref/spec" }
      - {
          title: "The Rust Reference — Keywords",
          url: "https://doc.rust-lang.org/reference/keywords.html",
        }
    actions:
      - id: tidy-up
        type: runtime.collapseDock
        at: { mark: wrap }

checks:
  - { type: timing.p95Ms, max: 300 }
