build:
  voiceProfile: pocket-alba-v1
  seed: 11

runtime:
  kind: kite-playground
  # Nothing runs until `run-final`, the second-to-last scene, so the dock would
  # otherwise sit open and empty over the whole lesson — 288px of editor spent
  # on nothing, and this lesson plays inside a 16:10 iframe on kite-lang.dev
  # where that is most of the code on screen. Shut from frame one; `runtime.run`
  # opens it when the output lands, and `tidy-up` shuts it once that's been read.
  dockStartsCollapsed: true
  defaultMode: fixture
  fixture:
    # 200ms run offset + 600ms latency puts the output on screen at ~0.8s, right
    # as the "let's run it" lead ends, so the narration reads a result that is
    # already visible instead of announcing one that has not arrived.
    latencyMs: 600
    transientErrorKinds: []
    result:
      status: success
      stdout: "Kite & Co, visit 1\nfirst time here, open is true\ncounted 10\n(tally is done)\ntally 12\n3 names, first kite\na kite costs 40\nsquares 1 4 9 16\nevens 2\na quarter of a kite is 10.0\nand math.max_int is positive: true\nKite & Co\nthank you\n[\n        owed 45\n        ]\nkite at 40\nkite x2\nkite x2\nstarter kit, 4 parts\nkite x5, from kite x2\nOrder{ id: 7, item: \"kite\", qty: 2 }\n{\"id\":7,\"item\":\"kite\",\"qty\":2}\ncard ending 4242\ncredit, net 30\nloudest wind\nas expected: nothing divides by zero\nmean 4\nread back order 8: 5 x string\nrejected: Order.qty: expected a whole number\nlooking for anchor on the shelf\nunderneath, NotFound.is says true\nno anchor on the shelf\nnoting visit 1\n2 full rows\nrestocked to 12\n"
      stderr: ""

scenes:
  - id: why
    narration: >
      [[mark:draw-why-kite]] Kite is a small language, and the shortest way to
      say what it's for is to say where it runs. It compiles to WebAssembly,
      which it was designed around rather than given later.
      [[mark:draw-why-page]] That's the thing a browser already knows how to
      load, so a Kite program sits in a page next to the HTML and the CSS.
      [[mark:draw-why-note]] The idea is that
      you write the parts of a page that are worth type checking in Kite, and
      leave the rest alone. [[mark:draw-why-pos]] And it's deliberately small.
      Twenty-seven keywords, no null, one formatter with no options to argue
      about, and the version never leaves nought point one, so what you learn today
      keeps working. Let's look at what happens when you run it.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      # Both land in the two quiet seconds the studio reserves before the first
      # dialog, so the panel is open and titled when the voice starts. The board
      # opens docked — never maximized — so the editor stays in frame beside it.
      - {
          id: open-board,
          type: whiteboard.apply,
          at: { scene: start, offsetMs: -1700 },
          open: true,
        }
      - {
          id: draw-why-title,
          type: whiteboard.apply,
          at: { scene: start, offsetMs: -1200 },
          upsertIds: [why-title],
          drawMs: 600,
        }
      - {
          id: draw-why-kite,
          type: whiteboard.apply,
          at: { mark: draw-why-kite },
          upsertIds: [why-kite-box, why-kite-t1, why-kite-t2],
          drawMs: 1200,
        }
      - {
          id: draw-why-page,
          type: whiteboard.apply,
          at: { mark: draw-why-page },
          upsertIds: [why-arrow, why-page-box, why-page-t1, why-page-t2],
          drawMs: 1600,
        }
      - {
          id: draw-why-note,
          type: whiteboard.apply,
          at: { mark: draw-why-note },
          upsertIds: [why-note, why-underline],
          drawMs: 1100,
        }
      - {
          id: draw-why-pos,
          type: whiteboard.apply,
          at: { mark: draw-why-pos },
          upsertIds: [why-pos-1, why-pos-2, why-pos-3, why-pos-4],
          drawMs: 1600,
        }

  - id: compiler
    narration: >
      [[mark:draw-comp-src]] You press Run, and the compiler reads your file.
      [[mark:draw-comp-check]] It works out what every name means, checks the
      types line up, and makes sure you've handled every case you said you
      would. If any of that fails, nothing runs, and you get the error instead.
      [[mark:draw-comp-out]] What comes out the other side is WebAssembly.
      [[mark:draw-comp-note]] Now here's the part worth stopping on, and it's
      about this page rather than about Kite. Normally kitec is a program you
      install and run in a terminal, like any other compiler. But it's written
      in Rust, and Rust builds for WebAssembly too. [[mark:draw-comp-where]] So
      there's a build of that same compiler that runs in a browser, and that's
      the one this page loaded. No server, and nothing to sign in to. The errors
      you'll see are the ones a terminal would show, because either way it's the
      same compiler.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
      - {
          title: "WebAssembly — Concepts",
          url: "https://developer.mozilla.org/en-US/docs/WebAssembly/Concepts",
        }
    actions:
      # The first board is wiped — this diagram reuses its canvas.
      - id: draw-comp-src
        type: whiteboard.apply
        at: { mark: draw-comp-src }
        clear: true
        upsertIds: [comp-title, comp-src-box, comp-src-t, comp-arrow-1]
        drawMs: 1500
      - {
          id: draw-comp-check,
          type: whiteboard.apply,
          at: { mark: draw-comp-check },
          upsertIds: [comp-check-box, comp-check-t1, comp-check-t2, comp-check-t3],
          drawMs: 1700,
        }
      - {
          id: draw-comp-out,
          type: whiteboard.apply,
          at: { mark: draw-comp-out },
          upsertIds: [comp-arrow-2, comp-out-box, comp-out-t],
          drawMs: 1200,
        }
      - {
          id: draw-comp-note,
          type: whiteboard.apply,
          at: { mark: draw-comp-note },
          upsertIds: [comp-note-1, comp-note-2, comp-circle],
          drawMs: 1500,
        }
      - {
          id: draw-comp-where,
          type: whiteboard.apply,
          at: { mark: draw-comp-where },
          upsertIds: [comp-note-3, comp-note-4],
          drawMs: 1100,
        }

  - id: keywords
    narration: >
      [[mark:draw-kw-bind]] Before any code, here's the whole vocabulary, so
      you know how much there is. Two words bind a value.
      [[mark:draw-kw-declare]] Nine declare things — functions, types, structs,
      enums, traits, and the words that say who can see them.
      [[mark:draw-kw-flow]] Nine steer the program. There's one loop keyword in
      that row, and you'll see why in a moment. [[mark:draw-kw-values]] Four are
      values and conversion — and notice what's missing from that row, because
      there's no null anywhere in this language. [[mark:draw-kw-fail]] And three
      are about failing and waiting. [[mark:kw-to-code]] That's it. That's the
      list. Every keyword you're about to see is one of these twenty-seven, and
      by the end we'll have used all of them.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      # The compiler diagram is wiped — the vocabulary reuses its canvas.
      - id: draw-kw-bind
        type: whiteboard.apply
        at: { mark: draw-kw-bind }
        clear: true
        upsertIds: [kw-title, kw-g1, kw-w1]
        drawMs: 1400
      - {
          id: draw-kw-declare,
          type: whiteboard.apply,
          at: { mark: draw-kw-declare },
          upsertIds: [kw-g2, kw-w2a, kw-w2b],
          drawMs: 1600,
        }
      - {
          id: draw-kw-flow,
          type: whiteboard.apply,
          at: { mark: draw-kw-flow },
          upsertIds: [kw-g3, kw-w3a, kw-w3b],
          drawMs: 1600,
        }
      - {
          id: draw-kw-values,
          type: whiteboard.apply,
          at: { mark: draw-kw-values },
          upsertIds: [kw-g4, kw-w4],
          drawMs: 1100,
        }
      - {
          id: draw-kw-fail,
          type: whiteboard.apply,
          at: { mark: draw-kw-fail },
          upsertIds: [kw-g5, kw-w5],
          drawMs: 1100,
        }
      - { id: close-board, type: whiteboard.apply, at: { mark: kw-to-code }, open: false }

  - id: shape
    narration: >
      [[mark:open]] Here's the whole program we're starting from. A function
      called main, and that's where a run begins. Notice what isn't here: no
      build file, no class wrapped around the function, nothing to configure.
      [[mark:values]] So, two ways to name a value. Let binds once. Var is the
      one you're allowed to reassign, and you have to say so up front — which
      means anything not marked var can be read without wondering who changed
      it later. That last line puts a value inside a string with a backslash and
      parentheses.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: open-main
        type: workspace.openFile
        at: { mark: open }
        path: main.kite
      - id: type-values
        type: editor.type
        at: { mark: values }
        cadence: line-by-line
        target: { file: main.kite, after: "fn main() {\n", occurrence: 1 }
        text: "    // `let` binds once; `var` is the one that can be reassigned.\n    let shop = \"Kite & Co\"\n    var visits = 0\n    visits += 1\n    io.print(\"\\(shop), visit \\(visits)\")\n\n"

  - id: modules
    narration: >
      [[mark:use]] Use imports a module. A module is a directory, or a single
      file — and neither one is a module until a use names it. A file sitting
      beside this one is not already part of your program: you reach it by
      name, exactly like the standard library. What is in scope without asking
      is the prelude, and the handful of builtins reached by a dotted name —
      io dot print is one, and errors dot new, which this program calls without
      ever importing anything.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-use
        type: editor.type
        at: { mark: use }
        cadence: line-by-line
        target: { file: main.kite, after: "// A crash course in Kite.\n\n", occurrence: 1 }
        text: "use std/math\n\n"

  - id: aliases
    narration: >
      [[mark:type]] Type gives a type a second spelling. An alias gets replaced
      by what it names before anything else is checked, so the two are
      interchangeable everywhere — a Prices is a map, not a new type that wraps
      one. We'll use this name in a minute.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-alias
        type: editor.type
        at: { mark: type }
        cadence: line-by-line
        target: { file: main.kite, after: "use std/math\n\n", occurrence: 1 }
        text: "/// An alias is a second spelling, interchangeable with what it names.\ntype Prices = { str: int }\n\n"

  - id: branch
    narration: >
      [[mark:branch]] If and else read the way they do everywhere else. The
      condition needs no parentheses around it, and the braces aren't optional,
      so there's no argument to have about where a one-line body goes. The
      condition here checks two things with a double ampersand, and both
      branches print. [[mark:bools]] True and false are the two bool literals,
      and a condition has to actually be a bool. There's no truthiness to learn
      here, and no zero that quietly means no.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-branch
        type: editor.type
        at: { mark: branch }
        cadence: line-by-line
        target:
          {
            file: main.kite,
            after: "    io.print(\"\\(shop), visit \\(visits)\")\n\n",
            occurrence: 1,
          }
        text: "    // `if` and `else` read the way you expect, and `bool` is `true`/`false`.\n    let open = true\n    if open && visits == 1 {\n        io.print(\"first time here, open is \\(open)\")\n    } else {\n        io.print(\"closed today, open is \\(false)\")\n    }\n\n"
      - id: select-bools
        type: editor.select
        at: { mark: bools }
        target: { file: main.kite, text: "    let open = true\n", occurrence: 1 }

  - id: loops
    narration: >
      [[mark:loops]] Here's the first real surprise. Kite has no while, and no
      loop keyword either. For does all three jobs: for something in a list
      walks the list, for followed by a condition is a while, and a bare for on
      its own runs until you break out of it. One keyword, three headers,
      nothing extra to look up. This one adds up three numbers.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-loop
        type: editor.type
        at: { mark: loops }
        cadence: line-by-line
        target: { file: main.kite, after: "    }\n\n", occurrence: 1 }
        text: "    // There is no `while` and no `loop`: `for` covers all three.\n    var counted = 0\n    for n in [2, 3, 5] {\n        counted += n\n    }\n    io.print(\"counted \\(counted)\")\n\n"

  - id: flow
    narration: >
      [[mark:tally]] Now a function that adds up an order, and it carries three
      more keywords at once. It takes a list of numbers and hands back a single
      number. Watch the three lines that steer it as they land — one skips a
      value, one stops the loop early, and one runs at the very end no matter
      how the function leaves. The rule the function follows is: ignore the
      zeroes, and stop completely at the first order that's too big.
      [[mark:skip]] Continue skips to the next turn of the loop, so a zero adds
      nothing and we move on. [[mark:stop]] Break leaves the loop altogether —
      that nine hundred stops the count where it stands. [[mark:defer]] And
      defer runs its line on the way out, however the function leaves. So the
      cleanup sits next to the thing it cleans up, instead of at the bottom
      where you'd have to trust that every path reaches it. [[mark:call]] Watch
      the order when we run this at the end: the deferred line prints before the
      value it computed.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-tally
        type: editor.type
        at: { mark: tally }
        cadence: line-by-line
        target: { file: main.kite, after: "type Prices = { str: int }\n\n", occurrence: 1 }
        text: "/// Skipping zeroes and stopping at the first oversized order.\nfn tally(orders: [int]) -> int {\n    defer io.print(\"(tally is done)\")\n    var total = 0\n    for n in orders {\n        if n == 0 {\n            continue\n        }\n        if n > 100 {\n            break\n        }\n        total += n\n    }\n    return total\n}\n\n"
      - id: select-continue
        type: editor.select
        at: { mark: skip }
        target: { file: main.kite, text: "            continue\n", occurrence: 1 }
      - id: select-break
        type: editor.select
        at: { mark: stop }
        target: { file: main.kite, text: "            break\n", occurrence: 1 }
      - id: select-defer
        type: editor.select
        at: { mark: defer }
        target:
          { file: main.kite, text: "    defer io.print(\"(tally is done)\")\n", occurrence: 1 }
      - id: type-call-tally
        type: editor.type
        at: { mark: call }
        cadence: line-by-line
        target:
          { file: main.kite, after: "    io.print(\"counted \\(counted)\")\n\n", occurrence: 1 }
        text: "    // `break` and `continue` steer a loop; `defer` runs on the way out.\n    io.print(\"tally \\(tally([5, 0, 7, 900, 1]))\")\n\n"

  - id: slices
    narration: >
      [[mark:slices]] A list of values is a slice, written in square brackets,
      and its type is written the same way — so a list of ints is int in
      brackets. [[mark:prelude]] Length is a method on it. First comes from the
      prelude, and it hands back an Option rather than a value, because a list
      might be empty. Or-else is where you supply the fallback for that.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-slice
        type: editor.type
        at: { mark: slices }
        cadence: line-by-line
        target:
          {
            file: main.kite,
            after: "    io.print(\"tally \\(tally([5, 0, 7, 900, 1]))\")\n\n",
            occurrence: 1,
          }
        text: "    // A slice, and the prelude that comes with it.\n    let names = [\"kite\", \"string\", \"wind\"]\n    io.print(\"\\(names.len()) names, first \\(or_else(first(names), \"none\"))\")\n\n"
      - id: select-prelude
        type: editor.select
        at: { mark: prelude }
        target: { file: main.kite, text: 'or_else(first(names), "none")', occurrence: 1 }

  - id: maps
    narration: >
      [[mark:maps]] A map is written with braces, keys pointing at values — and
      here it's declared through that alias from earlier, which is this map type
      by another name. [[mark:lookup]] Looking a key up also answers with an
      Option, for the same reason a list's first does: the key might not be
      there. Kite makes you say what happens when it isn't, right at the point
      where you ask.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-map
        type: editor.type
        at: { mark: maps }
        cadence: line-by-line
        target:
          {
            file: main.kite,
            after: "    io.print(\"\\(names.len()) names, first \\(or_else(first(names), \"none\"))\")\n\n",
            occurrence: 1,
          }
        text: "    // A map, named through the alias. Lookup answers an Option.\n    let prices: Prices = { \"kite\": 40, \"string\": 5 }\n    io.print(\"a kite costs \\(or_else(prices[\"kite\"], 0))\")\n\n"
      - id: select-lookup
        type: editor.select
        at: { mark: lookup }
        target: { file: main.kite, text: 'or_else(prices["kite"], 0)', occurrence: 1 }

  - id: closures
    narration: >
      [[mark:closures]] Closures are ordinary values here. The parameters go
      between pipe characters and the body is an expression. Map, filter, count
      and fifty-odd others live in the prelude and take them, so most of the
      work you'd write a loop for is already a function. There's one rule worth
      knowing: a closure captures by value, so it can't capture a var. If it
      could, you'd be writing to a copy and never seeing the change, so the
      language refuses the line rather than letting you find that out later.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-closure
        type: editor.type
        at: { mark: closures }
        cadence: line-by-line
        target:
          {
            file: main.kite,
            after: "    io.print(\"a kite costs \\(or_else(prices[\"kite\"], 0))\")\n\n",
            occurrence: 1,
          }
        text: "    // Closures are ordinary values, and the prelude takes them.\n    let squares = map([1, 2, 3, 4], |n: int| n * n)\n    let shown = join(map(squares, |n: int| \"\\(n)\"), \" \")\n    io.print(\"squares \\(shown)\")\n    io.print(\"evens \\(count([1, 2, 3, 4], |n: int| divides(n, 2)))\")\n\n"

  - id: conversions
    narration: >
      [[mark:as]] As converts between int and float — those two and nothing
      else — and you have to write it yourself. There are no implicit numeric
      conversions in Kite — an
      int doesn't quietly turn into a float because the other side of the
      expression happened to be one. [[mark:module]] And there's that imported
      module finally being used, with its name in front of what you're calling.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-as
        type: editor.type
        at: { mark: as }
        cadence: line-by-line
        target:
          {
            file: main.kite,
            after: "    io.print(\"evens \\(count([1, 2, 3, 4], |n: int| divides(n, 2)))\")\n\n",
            occurrence: 1,
          }
        text: "    // `as` converts explicitly. Kite has no implicit numeric conversion.\n    let quarter = 40 as float / 4.0\n    io.print(\"a quarter of a kite is \\(quarter)\")\n    io.print(\"and math.max_int is positive: \\(math.max_int() > 0)\")\n\n"
      - id: select-module
        type: editor.select
        at: { mark: module }
        target: { file: main.kite, text: "math.max_int() > 0", occurrence: 1 }

  - id: blocks
    narration: >
      [[mark:block]] Text that runs over more than one line gets triple quotes.
      An ordinary string can't contain a newline at all, so this is the one that
      can. [[mark:dedent]] And it dedents. Whatever indentation the closing
      delimiter sits at comes off every line above it — so the string can line up
      with the code around it without dragging that indentation into the value.
      There's no trailing newline either. What sits between the delimiters is
      what you get. [[mark:hole]] Now the trap, and it'll cost you an afternoon
      if nobody tells you. Put one hole anywhere in a block string and the dedent
      switches off. [[mark:raw]] Not for that line — for the whole string. The
      leading newline comes back, and every space, as typed, which is what those
      brackets in the output are showing you. The reason is that the dedent only
      runs for a block string with no interpolation in it; add a hole and the
      string is built a different way that never reaches it. When you need both,
      join the pieces with plus, or drop the finished block into an ordinary
      string.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-block
        type: editor.type
        at: { mark: block }
        cadence: line-by-line
        target:
          {
            file: main.kite,
            after: "    io.print(\"and math.max_int is positive: \\(math.max_int() > 0)\")\n\n",
            occurrence: 1,
          }
        text: "    // The closing delimiter's indentation comes off every line.\n    let receipt = \"\"\"\n        Kite & Co\n        thank you\n        \"\"\"\n    io.print(receipt)\n\n"
      - id: select-close
        type: editor.select
        at: { mark: dedent }
        target: { file: main.kite, text: "        thank you\n        \"\"\"\n", occurrence: 1 }
      - id: type-hole
        type: editor.type
        at: { mark: hole }
        cadence: line-by-line
        target: { file: main.kite, after: "    io.print(receipt)\n\n", occurrence: 1 }
        text: "    // One hole anywhere switches the dedent off, and the raw text survives.\n    let owed = 45\n    let holed = \"\"\"\n        owed \\(owed)\n        \"\"\"\n    io.print(\"[\\(holed)]\")\n\n"
      - id: select-hole
        type: editor.select
        at: { mark: raw }
        target: { file: main.kite, text: "        owed \\(owed)\n", occurrence: 1 }

  - id: structs
    narration: >
      [[mark:struct]] A struct is a named group of fields — here, a line item in
      a very small shop. Fields are read-only unless the field itself says var,
      so a type gets to decide which parts of it can move. Name and price are
      fixed once it's built; stock can change. [[mark:pub]] And there's pub.
      Without it a declaration is private to its module; with it, the module
      lets it out. Private is the default, which is the way round you want.
      [[mark:doc]] Those triple-slash lines are documentation, and the compiler
      reads them — that's the text an editor shows you on hover.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-struct
        type: editor.type
        at: { mark: struct }
        cadence: line-by-line
        target: { file: main.kite, after: "    return total\n}\n\n", occurrence: 1 }
        text: "/// A line item in a very small shop. `pub` is what crosses a module boundary.\npub struct Item {\n    name: str\n    price: int\n    var stock: int\n}\n\n"
      - id: select-pub
        type: editor.select
        at: { mark: pub }
        target: { file: main.kite, text: "pub struct Item {\n", occurrence: 1 }
      - id: select-doc
        type: editor.select
        at: { mark: doc }
        target: { file: main.kite, text: "/// A line item in a very small shop.", occurrence: 1 }

  - id: methods
    narration: >
      [[mark:impl]] Methods live in an impl block, written apart from the data
      they work on. Two of them here: one builds a label out of the fields, and
      one sells some of the stock. A method that only reads takes self, and you
      can see that on the first one. [[mark:varself]] The one that writes takes
      var self instead — so the signature tells you which is which before you
      read a single line of the body. [[mark:use-it]] And structs are
      references, so selling one is visible out here afterwards. There are no
      pointers to take, and no hidden copy to be surprised by.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-impl
        type: editor.type
        at: { mark: impl }
        cadence: line-by-line
        target: { file: main.kite, after: "    var stock: int\n}\n\n", occurrence: 1 }
        text: "impl Item {\n    /// A method that only reads takes `self`.\n    fn label(self) -> str {\n        return \"\\(self.name) at \\(self.price)\"\n    }\n\n    /// One that writes takes `var self`.\n    fn sell(var self, n: int) {\n        self.stock -= n\n    }\n}\n\n"
      - id: select-varself
        type: editor.select
        at: { mark: varself }
        target: { file: main.kite, text: "    fn sell(var self, n: int) {\n", occurrence: 1 }
      - id: type-use-struct
        type: editor.type
        at: { mark: use-it }
        cadence: line-by-line
        target: { file: main.kite, after: "    io.print(\"[\\(holed)]\")\n\n", occurrence: 1 }
        text: "    // Structs are references, so `sell` is visible here afterwards.\n    var kite = Item{ name: \"kite\", price: 40, stock: 3 }\n    io.print(kite.label())\n    kite.sell(1)\n"

  - id: traits
    narration: >
      [[mark:trait]] A trait is behaviour that a type promises to have. It's
      signatures and no bodies — a list of what you'll be able to call, with the
      how left out. Here it's one method that turns something into text. Then
      underneath, the part that supplies the bodies for a particular type.
      [[mark:implfor]] That's impl Describe for Item. Because the trait and the
      implementation are written separately, you can give a trait to a type you
      didn't define — the type doesn't have to know the trait exists.
      [[mark:calldesc]] And calling it looks like any other method.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-trait
        type: editor.type
        at: { mark: trait }
        cadence: line-by-line
        target: { file: main.kite, after: "    }\n}\n\n", occurrence: 1 }
        text: "/// A trait is behaviour a type promises.\ntrait Describe {\n    fn describe(self) -> str\n}\n\nimpl Describe for Item {\n    fn describe(self) -> str {\n        return \"\\(self.name) x\\(self.stock)\"\n    }\n}\n\n"
      - id: select-implfor
        type: editor.select
        at: { mark: implfor }
        target: { file: main.kite, text: "impl Describe for Item {\n", occurrence: 1 }
      - id: type-describe
        type: editor.type
        at: { mark: calldesc }
        cadence: line-by-line
        target: { file: main.kite, after: "    kite.sell(1)\n", occurrence: 1 }
        text: "    io.print(kite.describe())\n\n"

  - id: dynamic
    narration: >
      [[mark:kit]] Every call to describe so far has been static — the compiler
      knew the type, so it knew the body. Here's a second type that makes the
      same promise, and now there's a question worth asking: can one slice hold
      both of them? [[mark:shelf]] Not on its own. A slice is one type, and an
      item isn't a kit. What you can do instead is store the promise rather than
      the type. [[mark:dyn]] That's dyn Describe. Each value goes in carrying a
      small table of its own methods, so the loop calls describe without knowing
      what it's holding, and the right body runs. You have to write dyn — a
      generic is decided when you compile, this is decided when you run, and the
      language makes you say which one you meant. What it costs is everything the
      trait didn't mention: a dyn Describe has no label on it, even though the
      item inside does.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-kit
        type: editor.type
        at: { mark: kit }
        cadence: line-by-line
        target:
          {
            file: main.kite,
            after: "        return \"\\(self.name) x\\(self.stock)\"\n    }\n}\n\n",
            occurrence: 1,
          }
        text: "/// A second type that keeps the same promise.\nstruct Kit {\n    title: str\n    parts: int\n}\n\nimpl Describe for Kit {\n    fn describe(self) -> str {\n        return \"\\(self.title), \\(self.parts) parts\"\n    }\n}\n\n"
      - id: type-shelf
        type: editor.type
        at: { mark: shelf }
        cadence: line-by-line
        target: { file: main.kite, after: "    io.print(kite.describe())\n\n", occurrence: 1 }
        text: "    // `dyn` is a vtable, so one slice can hold two different types.\n    let shelf: [dyn Describe] = [kite, Kit{ title: \"starter kit\", parts: 4 }]\n    for thing in shelf {\n        io.print(thing.describe())\n    }\n\n"
      - id: select-dyn
        type: editor.select
        at: { mark: dyn }
        target:
          {
            file: main.kite,
            text: "    let shelf: [dyn Describe] = [kite, Kit{ title: \"starter kit\", parts: 4 }]\n",
            occurrence: 1,
          }

  - id: spread
    narration: >
      [[mark:spread]] Building a new value out of an old one with a single field
      changed comes up constantly, and copying every other field across by hand
      is how you get the bug where you miss one. So there's a spread: two dots
      and the value you're starting from, then only the fields that differ.
      [[mark:order]] The spread comes first, before the fields — you read the
      starting point, then the changes, in that order. Put it last and it doesn't
      parse, which is worth knowing if you've written Rust, where it's the other
      way round. And this is a new value, not a change to the old one: kite is
      still exactly what it was, which is what the second half of that line
      prints. Every field still has to end up with something, either from the
      base or from you — there are no zero values here for a field you forgot to
      fall back to.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-spread
        type: editor.type
        at: { mark: spread }
        cadence: line-by-line
        target:
          { file: main.kite, after: "        io.print(thing.describe())\n    }\n\n", occurrence: 1 }
        text: "    // `..kite` first, then the fields that differ. `kite` itself is untouched.\n    let bigger = Item{..kite, stock: 5 }\n    io.print(\"\\(bigger.describe()), from \\(kite.describe())\")\n\n"
      - id: select-spread
        type: editor.select
        at: { mark: order }
        target: { file: main.kite, text: "Item{..kite, stock: 5 }", occurrence: 1 }

  - id: derive
    narration: >
      [[mark:derive]] Four of Kite's traits can be written for you rather than by
      you, and this is how you ask. The attribute goes in front of the struct,
      and before a single name in it gets resolved it expands into ordinary Kite
      — the same bodies you'd have typed, over the same fields, in the same
      order. Debug is
      the field-by-field text, Hash is a number you can key a map with, Encode
      turns one of these into JSON, and Decode is the way back, which we'll come
      to once there's a way to say it failed. [[mark:usejson]] Which is why we go
      back up to the top and import that module: the code the attribute writes
      names Json, so a file that derives Encode without the import fails on a
      name your source never wrote. [[mark:derivecalls]] What comes out is
      ordinary methods, called the ordinary way. And Display isn't among the four, which
      is deliberate — how a type reads to a person is a decision, so you're the
      one who makes it.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-derive
        type: editor.type
        at: { mark: derive }
        cadence: line-by-line
        target:
          {
            file: main.kite,
            after: "        return \"\\(self.title), \\(self.parts) parts\"\n    }\n}\n\n",
            occurrence: 1,
          }
        text: "/// `@derive` writes these bodies out of the fields, as ordinary Kite.\n@derive(Debug, Hash, Encode, Decode)\nstruct Order {\n    id: int\n    item: str\n    qty: int\n}\n\n"
      - id: type-use-json
        type: editor.type
        at: { mark: usejson }
        cadence: line-by-line
        target: { file: main.kite, after: "use std/math\n", occurrence: 1 }
        text: "use std/json\n"
      - id: type-derive-calls
        type: editor.type
        at: { mark: derivecalls }
        cadence: line-by-line
        target:
          {
            file: main.kite,
            after: "    io.print(\"\\(bigger.describe()), from \\(kite.describe())\")\n\n",
            occurrence: 1,
          }
        text: "    // `@derive` wrote `debug` and `encode` out of the fields themselves.\n    let order = Order{ id: 7, item: \"kite\", qty: 2 }\n    io.print(order.debug())\n    io.print(json.stringify(order.encode()))\n\n"

  - id: enums
    narration: >
      [[mark:enum]] An enum names every shape a value is allowed to take, and a
      variant can carry data along with it. This one is a payment: it's either
      cash, which carries nothing, or a card, which carries the last four
      digits, or credit, which carries a number of days. Three shapes, and no
      fourth. Underneath it, a function that turns any payment into text.
      [[mark:match]] Match is how you pull a shape apart, and it binds what was
      inside so you can use it. The important part is that it's exhaustive: miss
      a variant and the program doesn't compile, and the error names the ones
      you missed. That's what makes adding a variant later a safe thing to do —
      the compiler walks you through every place that has to change.
      [[mark:calls]] And match is an expression, so it returns a value straight
      out of the arm that matched.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-enum
        type: editor.type
        at: { mark: enum }
        cadence: line-by-line
        target:
          {
            file: main.kite,
            after: "    id: int\n    item: str\n    qty: int\n}\n\n",
            occurrence: 1,
          }
        text: "/// An enum names every shape a value is allowed to take.\nenum Payment {\n    Cash\n    Card(last4: str)\n    Credit(days: int)\n}\n\nfn describe_payment(p: Payment) -> str {\n    return match p {\n        Cash => \"cash\",\n        Card(last4) => \"card ending \\(last4)\",\n        Credit(days) => \"credit, net \\(days)\",\n    }\n}\n\n"
      - id: select-match
        type: editor.select
        at: { mark: match }
        target: { file: main.kite, text: "    return match p {\n", occurrence: 1 }
      - id: type-payments
        type: editor.type
        at: { mark: calls }
        cadence: line-by-line
        target:
          {
            file: main.kite,
            after: "    io.print(json.stringify(order.encode()))\n\n",
            occurrence: 1,
          }
        text: "    // An enum plus `match`, which the compiler checks is exhaustive.\n    io.print(describe_payment(Card(last4: \"4242\")))\n    io.print(describe_payment(Credit(days: 30)))\n\n"

  - id: generics
    narration: >
      [[mark:generic]] Generics use angle brackets, and the T there stands for
      whatever type you hand it. They're checked once, where they're written,
      rather than again at every call site. [[mark:option]] This one gives back
      an Option, which is how Kite spells the absence of a value. There's no
      null in this language at all. A thing that might not be there says so in
      its type, and you can't read it without answering that question first.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-generic
        type: editor.type
        at: { mark: generic }
        cadence: line-by-line
        target:
          {
            file: main.kite,
            after: "        Credit(days) => \"credit, net \\(days)\",\n    }\n}\n\n",
            occurrence: 1,
          }
        text: "/// Generics are checked once, where they are written.\nfn loudest<T>(items: [T]) -> Option<T> {\n    return last(items)\n}\n\n"
      - id: type-option
        type: editor.type
        at: { mark: option }
        cadence: line-by-line
        target:
          {
            file: main.kite,
            after: "    io.print(describe_payment(Credit(days: 30)))\n\n",
            occurrence: 1,
          }
        text: "    // Option is how \"no value\" is spelled. There is no null in Kite.\n    io.print(\"loudest \\(or_else(loudest(names), \"none\"))\")\n\n"

  - id: errorboard
    narration: >
      [[mark:draw-err-fn]] Before the last few keywords, let's put one idea on
      the board, because it's the promise Kite makes that the languages it
      borrows from don't. Take a function that divides two numbers. It can fail
      — someone might pass a zero. [[mark:draw-err-out]] So it doesn't answer
      with a number. It answers with two things: a number, and an error that
      says why there isn't one. [[mark:draw-err-rule]] And here's the rule the
      compiler keeps for you. You can't read the number until the error has been
      tested. Not "you shouldn't" — the program won't compile.
      [[mark:draw-err-check]] Handling it on the spot is one option. The other
      is one keyword: check, which says if this failed, hand it back to whoever
      called me. [[mark:err-to-code]] Let's write both.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      # Re-open the docked board mid-lesson, wiping the vocabulary behind it.
      - {
          id: reopen-board,
          type: whiteboard.apply,
          at: { scene: start, offsetMs: -400 },
          open: true,
        }
      - id: draw-err-fn
        type: whiteboard.apply
        at: { mark: draw-err-fn }
        clear: true
        upsertIds: [err-title, err-fn-box, err-fn-t]
        drawMs: 1400
      - {
          id: draw-err-out,
          type: whiteboard.apply,
          at: { mark: draw-err-out },
          upsertIds: [err-arrow, err-val-box, err-val-t, err-err-box, err-err-t],
          drawMs: 1800,
        }
      - {
          id: draw-err-rule,
          type: whiteboard.apply,
          at: { mark: draw-err-rule },
          upsertIds: [err-rule-1, err-rule-2, err-underline],
          drawMs: 1600,
        }
      - {
          id: draw-err-check,
          type: whiteboard.apply,
          at: { mark: draw-err-check },
          upsertIds: [err-check-t1, err-check-t2],
          drawMs: 1300,
        }
      - { id: close-err-board, type: whiteboard.apply, at: { mark: err-to-code }, open: false }

  - id: errors
    narration: >
      [[mark:divide]] Here's that function. Look at the failing return, the one
      inside the if — where the number should be, there's an underscore. Not a
      zero, not an empty string. On that path there's no number, and the
      language lets you say so instead of inventing one. And on the good path,
      the error slot says nil. Nil is the error that isn't one.
      [[mark:tainted]] So a call hands you both at once, and you name them both.
      Move that print above the test and it stops compiling. Ignore the error
      completely and that's rejected too. The failure path gets written on the
      line where the failure can happen, which is the whole point.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-divide
        type: editor.type
        at: { mark: divide }
        cadence: line-by-line
        target: { file: main.kite, after: "    return last(items)\n}\n\n", occurrence: 1 }
        text: "/// A quotient, or a reason there is not one.\nfn divide(a: int, b: int) -> (int, error) {\n    if b == 0 {\n        return _, errors.new(\"nothing divides by zero\")\n    }\n    return a / b, nil\n}\n\n"
      - id: type-use-divide
        type: editor.type
        at: { mark: tainted }
        cadence: line-by-line
        target:
          {
            file: main.kite,
            after: "    io.print(\"loudest \\(or_else(loudest(names), \"none\"))\")\n\n",
            occurrence: 1,
          }
        text: "    // A failure is an ordinary value, and cannot be read until it is tested.\n    let (bad, berr) = divide(1, 0)\n    if berr != nil {\n        io.print(\"as expected: \\(berr.message())\")\n    }\n\n"

  - id: check
    narration: >
      [[mark:check]] Handling a failure where it happens is one case. Handing it
      to your caller is the other, and it's most of what you'll actually write.
      That gets the one keyword. This function works out a mean, and the divide
      inside it can fail — but it isn't this function's job to decide what to do
      about that. So it doesn't. Check err means: if this failed, return it to
      whoever called me. [[mark:margin]] It sits on a line of its own, so you
      can read down the left edge of a function and see every place it can fail.
      That's deliberate — it isn't a question mark tucked away at the end of a
      long expression. [[mark:usemean]] And the caller handles it once, at the
      top, before using the value. That's the shape almost all Kite error
      handling takes: check it up the chain until you reach the one place that
      knows what to do, and deal with it there.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-mean
        type: editor.type
        at: { mark: check }
        cadence: line-by-line
        target: { file: main.kite, after: "    return a / b, nil\n}\n\n", occurrence: 1 }
        text: "/// The mean, propagating the failure rather than handling it.\nfn mean(totals: [int]) -> (int, error) {\n    let (avg, err) = divide(sum(totals), totals.len())\n    check err\n    return avg, nil\n}\n\n"
      - id: select-margin
        type: editor.select
        at: { mark: margin }
        target: { file: main.kite, text: "    check err\n", occurrence: 1 }
      - id: type-use-mean
        type: editor.type
        at: { mark: usemean }
        cadence: line-by-line
        target:
          {
            file: main.kite,
            after: "        io.print(\"as expected: \\(berr.message())\")\n    }\n\n",
            occurrence: 1,
          }
        text: "    // `check` hands the failure to our caller instead of handling it here.\n    let (avg, err) = mean([2, 4, 6])\n    if err != nil {\n        io.print(\"failed: \\(err.message())\")\n        return\n    }\n    io.print(\"mean \\(avg)\")\n\n"

  - id: decode
    narration: >
      [[mark:read]] Now check is in hand, here's the other half of that derive,
      and the two of them are the pair worth remembering. Json.parse gives you a
      Json — a tree, whatever shape the text turned out to be. Order.decode turns
      one of those into an Order, checking every field on the way in: there, and
      the right shape. So it can fail, and it says so in its type.
      [[mark:named]] It's Order.decode rather than a method on the document, and
      it has to be: it gives back the type itself, and a trait method has no way
      to say "the type I'm implemented for" in return position. So it's an
      associated function, with the type named at the front. That's also why
      there's no turbofish in this language — where a type can't be inferred,
      it's already sitting there at the start of the call. [[mark:back]] A good
      document comes back as an Order. You still name the error and test it; that
      doesn't change because this one happened to work. [[mark:bad]] And this one
      has no qty. Most languages would hand you a cast that never looks, and
      you'd find out later, somewhere else, holding a zero. Here you're told
      which field. [[mark:limit]] The honest limit is that the check is strict. A
      field that's absent is only allowed if you typed it Option. A default that
      isn't nil, or a key the server spells differently, is where you stop
      deriving and write the reader by hand — json.field, int_or, text_or, out of
      the same module.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
      - {
          title: "RFC 8259 — The JavaScript Object Notation (JSON) Data Interchange Format",
          url: "https://www.rfc-editor.org/rfc/rfc8259",
        }
    actions:
      - id: type-read-order
        type: editor.type
        at: { mark: read }
        cadence: line-by-line
        target: { file: main.kite, after: "    return avg, nil\n}\n\n", occurrence: 1 }
        text: "/// A document in, a checked `Order` out, or the reason there is not one.\nfn read_order(text: str) -> (Order, error) {\n    let (doc, err) = json.parse(text)\n    check err\n    return Order.decode(doc)\n}\n\n"
      - id: select-named
        type: editor.select
        at: { mark: named }
        target: { file: main.kite, text: "    return Order.decode(doc)\n", occurrence: 1 }
      - id: type-read-good
        type: editor.type
        at: { mark: back }
        cadence: line-by-line
        target: { file: main.kite, after: "    io.print(\"mean \\(avg)\")\n\n", occurrence: 1 }
        text: "    // Reading one back checks every field, and names the one it cannot read.\n    let (bought, rerr) = read_order(\"{\\\"id\\\": 8, \\\"item\\\": \\\"string\\\", \\\"qty\\\": 5}\")\n    if rerr != nil {\n        io.print(\"rejected: \\(rerr.message())\")\n        return\n    }\n    io.print(\"read back order \\(bought.id): \\(bought.qty) x \\(bought.item)\")\n\n"
      - id: type-read-bad
        type: editor.type
        at: { mark: bad }
        cadence: line-by-line
        target:
          {
            file: main.kite,
            after: "    io.print(\"read back order \\(bought.id): \\(bought.qty) x \\(bought.item)\")\n\n",
            occurrence: 1,
          }
        text: "    // The same call, on a document with no `qty` in it at all.\n    let (short, serr) = read_order(\"{\\\"id\\\": 9, \\\"item\\\": \\\"wind\\\"}\")\n    if serr != nil {\n        io.print(\"rejected: \\(serr.message())\")\n    }\n\n"
      - id: select-limit
        type: editor.select
        at: { mark: limit }
        target: { file: main.kite, text: "    qty: int\n", occurrence: 1 }

  - id: typed-errors
    narration: >
      [[mark:carry]] errors.new hands back a sentence, and a sentence is a poor
      thing to make a decision on — matching on the text of a message is how you
      find out, a year later, that someone reworded it. So let a type be the
      error. Any struct with an impl of Error goes wherever an error goes, and
      takes its type along with it. [[mark:context]] This one wraps on the way
      out, with a note about what it was doing, so now there are two: the note on
      the outside, and the NotFound underneath it. [[mark:ask]] Cause is how you
      reach the one underneath. And then the type answers questions about itself
      — is, which is yes or no, and as, which hands back an Option, because it
      might not be that failure at all. [[mark:spelling]] Notice which end the
      type is written at: the same end Order.decode put it, for the same reason.
      There's no turbofish, so there's nowhere inside the call to write one. The
      type goes first and names itself.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-notfound
        type: editor.type
        at: { mark: carry }
        cadence: line-by-line
        target: { file: main.kite, after: "    return Order.decode(doc)\n}\n\n", occurrence: 1 }
        text: "/// A failure that names itself, so a caller can ask which one it was.\nstruct NotFound {\n    what: str\n}\n\nimpl Error for NotFound {\n    fn message(self) -> str {\n        return \"no \\(self.what) on the shelf\"\n    }\n}\n\n/// The item, or a note about the search with a `NotFound` underneath.\nfn find_item(shelf: [Item], want: str) -> (Item, error) {\n    for it in shelf {\n        if it.name == want {\n            return it, nil\n        }\n    }\n    let missing: error = NotFound{ what: want }\n    return _, errors.because(\"looking for \\(want) on the shelf\", missing)\n}\n\n"
      - id: select-because
        type: editor.select
        at: { mark: context }
        target:
          {
            file: main.kite,
            text: "    return _, errors.because(\"looking for \\(want) on the shelf\", missing)\n",
            occurrence: 1,
          }
      - id: type-ask
        type: editor.type
        at: { mark: ask }
        cadence: line-by-line
        target:
          {
            file: main.kite,
            after: "        io.print(\"rejected: \\(serr.message())\")\n    }\n\n",
            occurrence: 1,
          }
        text: "    // An error can carry a type, and the type names itself: no turbofish.\n    let (found, ferr) = find_item([kite], \"anchor\")\n    if ferr == nil {\n        io.print(found.label())\n    } else {\n        io.print(ferr.message())\n        let under = ferr.cause()\n        io.print(\"underneath, NotFound.is says \\(NotFound.is(under))\")\n        let miss = NotFound.as (under)\n        if miss != nil {\n            io.print(miss.message())\n        }\n    }\n\n"
      - id: select-names-itself
        type: editor.select
        at: { mark: spelling }
        target: { file: main.kite, text: "NotFound.is(under)", occurrence: 1 }

  - id: discard
    narration: >
      [[mark:log]] One loose end. You've seen that an error can't be ignored — a
      call left standing on its own line doesn't compile, and neither does
      reading a value whose error you haven't tested. But sometimes you
      genuinely don't want it. This writes the day's visit log, and today the log
      is full, and a shop whose log is full still sells kites. [[mark:drop]] So:
      underscore, equals, the call. [[mark:grep]] That's the whole spelling, and
      it's the only one there is. Typing it out is the point — the failure
      doesn't disappear quietly, it leaves a line, one a reader sees and grep
      finds. What you'd write in most languages is a comma and an underscore
      tucked inside a destructuring, which looks like nothing at all. Kite
      rejects that one so it can keep this one meaning something.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-note-visit
        type: editor.type
        at: { mark: log }
        cadence: line-by-line
        target:
          {
            file: main.kite,
            after: "    return _, errors.because(\"looking for \\(want) on the shelf\", missing)\n}\n\n",
            occurrence: 1,
          }
        text: "/// The visit log. Best effort: a shop whose log is full still sells kites.\nfn note_visit(n: int) -> error {\n    io.print(\"noting visit \\(n)\")\n    return errors.new(\"the log is full\")\n}\n\n"
      - id: type-discard
        type: editor.type
        at: { mark: drop }
        cadence: line-by-line
        target:
          {
            file: main.kite,
            after: "            io.print(miss.message())\n        }\n    }\n\n",
            occurrence: 1,
          }
        text: "    // `_ =` is the one way to throw an error away, and it is greppable.\n    _ = note_visit(visits)\n\n"
      - id: select-discard
        type: editor.select
        at: { mark: grep }
        target: { file: main.kite, text: "    _ = note_visit(visits)\n", occurrence: 1 }

  - id: asserts
    narration: >
      [[mark:req]] Two ways to write down something you believe is true. Both
      take a condition and a message — both arguments, always. The message isn't
      a nicety: a check that fires and can't tell you what it was checking has
      wasted the trip. [[mark:release]] These are builtins rather than functions,
      which is what makes the next part possible. Build with --release and every
      assert is gone from the program. Every require stays. So assert is for your
      own reasoning — the things you want caught while you're working and are
      happy to pay nothing for afterwards. Require is for what has to hold no
      matter who's calling, like a divisor that mustn't be zero. That difference
      is the whole reason there are two of them. [[mark:rowscall]] And when
      either one
      fails it traps, and a trap isn't catchable — there's no recover in this
      language. A broken invariant stops the program instead of becoming another
      value somebody forgets to test.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-rows
        type: editor.type
        at: { mark: req }
        cadence: line-by-line
        target:
          {
            file: main.kite,
            after: "    return errors.new(\"the log is full\")\n}\n\n",
            occurrence: 1,
          }
        text: "/// `require` guards the caller's input; `assert` checks our own arithmetic.\nfn full_rows(items: int, per_row: int) -> int {\n    require(per_row > 0, \"a row with no room in it is not a row\")\n    let rows = items / per_row\n    assert(rows * per_row <= items, \"a full row never invents stock\")\n    return rows\n}\n\n"
      - id: select-require
        type: editor.select
        at: { mark: release }
        target:
          {
            file: main.kite,
            text: "    require(per_row > 0, \"a row with no room in it is not a row\")\n",
            occurrence: 1,
          }
      - id: type-rows-call
        type: editor.type
        at: { mark: rowscall }
        cadence: line-by-line
        target: { file: main.kite, after: "    _ = note_visit(visits)\n\n", occurrence: 1 }
        text: "    // `assert` goes away under `--release`; `require` never does.\n    io.print(\"\\(full_rows(7, 3)) full rows\")\n\n"

  - id: tests
    narration: >
      [[mark:fence]] Two ways to write a test, and kitec test runs both. Here's
      the first: a fenced kite block inside a doc comment isn't an illustration,
      it's compiled and run. And it's appended to its own module, so in there
      tally is just tally — nothing to import, because the thing the comment
      documents is already in scope. [[mark:testfn]] The other is a function
      whose name starts with test underscore, and the assertions come from std
      test. [[mark:claims]] Give it the fallible pair as its return type and
      every assertion is a check on a line of its own, so a test reads as a list
      of claims. The first one that fails ends that test and reports itself;
      the other tests still run.
      [[mark:testpub]] Pub is load-bearing there. A private function nothing calls
      has already been dropped by the time the runner goes looking, and it finds
      no tests at all. [[mark:entry]] And kitec test only reads the file you hand
      it. A test that arrived through use is compiled under its module's name, so
      it no longer starts with test underscore and the runner walks straight past
      it. Keep a module's tests in the file they test.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-doc-fence
        type: editor.type
        at: { mark: fence }
        cadence: line-by-line
        target:
          {
            file: main.kite,
            after: "/// Skipping zeroes and stopping at the first oversized order.\n",
            occurrence: 1,
          }
        text: "///\n/// ```kite\n/// io.print(\"\\(tally([2, 0, 3]))\")\n/// ```\n"
      - id: type-use-test
        type: editor.type
        at: { mark: testfn }
        cadence: line-by-line
        target: { file: main.kite, after: "use std/math\n", occurrence: 1 }
        text: "use std/test\n"
      - id: type-test-fn
        type: editor.type
        at: { mark: claims }
        cadence: line-by-line
        target: { file: main.kite, after: "    return total\n}\n\n", occurrence: 1 }
        text: "pub fn test_tally() -> (int, error) {\n    check test.equal_int(tally([5, 0, 7, 900, 1]), 12, \"zeroes skipped, 900 stops it\")\n    return 0, nil\n}\n\n"
      - id: select-test-pub
        type: editor.select
        at: { mark: testpub }
        target: { file: main.kite, text: "pub fn test_tally() -> (int, error) {\n", occurrence: 1 }
      # The `use` the last beat is about: a test reached through one of these is
      # compiled as `test.…` and stops looking like a test at all.
      - id: select-use-test
        type: editor.select
        at: { mark: entry }
        target: { file: main.kite, text: "use std/test\n", occurrence: 1 }

  - id: async
    narration: >
      [[mark:asyncfn]] Two keywords left, and they go together. An async
      function is one that's allowed to pause partway through, and calling one
      hands you back a Task rather than the value you asked for. Think of the
      Task as a receipt for a result that isn't ready yet. [[mark:mainasync]] A
      function that waits for one has to be async itself — main included, which
      is why we're adding that word to it now. So pausing is always visible in
      the signature, and never hides inside a call that looks ordinary.
      [[mark:await]] And await is what turns the Task back into the value.
      That's twenty-seven.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: type-async-fn
        type: editor.type
        at: { mark: asyncfn }
        cadence: line-by-line
        # `restocked` must land immediately above `fn main`, because
        # `type-async-main` prefixes whatever declaration follows it.
        target: { file: main.kite, after: "    return rows\n}\n\n", occurrence: 1 }
        text: "/// An async function answers with a Task, which `await` unwraps.\nasync fn restocked(item: Item, by: int) -> int {\n    return item.stock + by\n}\n\n"
      - id: type-async-main
        type: editor.type
        at: { mark: mainasync }
        cadence: line-by-line
        target: { file: main.kite, after: "    return item.stock + by\n}\n\n", occurrence: 1 }
        text: "async "
      - id: type-await
        type: editor.type
        at: { mark: await }
        cadence: line-by-line
        target:
          {
            file: main.kite,
            after: "    io.print(\"\\(full_rows(7, 3)) full rows\")\n\n",
            occurrence: 1,
          }
        text: "    // `await` waits for a task and unwraps it.\n    let restock = await restocked(kite, 10)\n    io.print(\"restocked to \\(restock)\")\n"

  - id: run
    narration: >
      That's the whole language. [[mark:run]] Let's run it. Remember, that's the
      compiler working here in the page rather than on a server, so nothing left
      your machine. Thirty-six lines. Look for four of them in particular: the
      deferred line printing before the tally it belongs to, the division by zero
      coming back as a value we printed on purpose, the mean arriving through a
      check, and the order that was rejected naming the one field it couldn't
      read. Nothing crashed, and nothing was quietly swallowed, because there was
      never a way to write the version that does.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
    actions:
      - id: run-final
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 20000
      - id: saw-0
        type: expect.output
        at: { afterAction: run-final }
        contains: "Kite & Co, visit 1"
        timeoutMs: 20000
      - id: saw-1
        type: expect.output
        at: { afterAction: saw-0 }
        contains: "open is true"
        timeoutMs: 20000
      - id: saw-2
        type: expect.output
        at: { afterAction: saw-1 }
        contains: "(tally is done)"
        timeoutMs: 20000
      - id: saw-3
        type: expect.output
        at: { afterAction: saw-2 }
        contains: "tally 12"
        timeoutMs: 20000
      - id: saw-4
        type: expect.output
        at: { afterAction: saw-3 }
        contains: "a quarter of a kite is 10.0"
        timeoutMs: 20000
      # The dedented block string: no leading newline, no eight spaces.
      - id: saw-5
        type: expect.output
        at: { afterAction: saw-4 }
        contains: "thank you"
        timeoutMs: 20000
      - id: saw-6
        type: expect.output
        at: { afterAction: saw-5 }
        contains: "kite x2"
        timeoutMs: 20000
      # The second element of the `dyn Describe` slice — a `Kit`, not an `Item`.
      - id: saw-7
        type: expect.output
        at: { afterAction: saw-6 }
        contains: "starter kit, 4 parts"
        timeoutMs: 20000
      - id: saw-8
        type: expect.output
        at: { afterAction: saw-7 }
        contains: "kite x5, from kite x2"
        timeoutMs: 20000
      - id: saw-9
        type: expect.output
        at: { afterAction: saw-8 }
        contains: '{"id":7,"item":"kite","qty":2}'
        timeoutMs: 20000
      - id: saw-10
        type: expect.output
        at: { afterAction: saw-9 }
        contains: "card ending 4242"
        timeoutMs: 20000
      - id: saw-11
        type: expect.output
        at: { afterAction: saw-10 }
        contains: "loudest wind"
        timeoutMs: 20000
      - id: saw-12
        type: expect.output
        at: { afterAction: saw-11 }
        contains: "as expected: nothing divides by zero"
        timeoutMs: 20000
      - id: saw-13
        type: expect.output
        at: { afterAction: saw-12 }
        contains: "mean 4"
        timeoutMs: 20000
      - id: saw-14
        type: expect.output
        at: { afterAction: saw-13 }
        contains: "read back order 8: 5 x string"
        timeoutMs: 20000
      # The derived `decode` names the field it could not read, not a zero.
      - id: saw-15
        type: expect.output
        at: { afterAction: saw-14 }
        contains: "rejected: Order.qty: expected a whole number"
        timeoutMs: 20000
      - id: saw-16
        type: expect.output
        at: { afterAction: saw-15 }
        contains: "underneath, NotFound.is says true"
        timeoutMs: 20000
      - id: saw-17
        type: expect.output
        at: { afterAction: saw-16 }
        contains: "noting visit 1"
        timeoutMs: 20000
      - id: saw-18
        type: expect.output
        at: { afterAction: saw-17 }
        contains: "2 full rows"
        timeoutMs: 20000
      - id: saw-19
        type: expect.output
        at: { afterAction: saw-18 }
        contains: "restocked to 12"
        timeoutMs: 20000
      - id: file-has-check
        type: expect.file
        at: { afterAction: saw-19 }
        path: main.kite
        contains: "check err"

  - id: wrap
    narration: >
      [[mark:wrap]] Twenty-seven keywords, and you've now seen every one of
      them. For comparison, Go has twenty-five and Rust has thirty-eight. That
      number is a design position rather than a boast: one loop
      keyword, no null, one formatter with nothing to configure, and one rule
      about failure that the compiler keeps for you. The rest of what we wrote
      isn't keywords at all — the attribute that writes four trait bodies out of
      your fields, the vtable you have to spell dyn before you get, the two
      assertions that differ only in what a release build does to them, and tests
      that live in the file they test. Kite targets WebAssembly
      first, so it's meant to sit beside HTML and CSS and take the parts of a
      page worth type checking. And the version line is the point. Kite's
      number climbs inside nought point one and is meant never to leave it —
      a major number is a licence to break things, and this language does not
      want one. What you learned today is the language you'll come back to.
    sources:
      - { title: "The Kite Language Specification", url: https://kite-lang.dev/read/specification }
      - { title: "The Go Programming Language Specification", url: "https://go.dev/ref/spec" }
      - {
          title: "The Rust Reference — Keywords",
          url: "https://doc.rust-lang.org/reference/keywords.html",
        }
    actions:
      - id: tidy-up
        type: runtime.collapseDock
        at: { mark: wrap }

checks:
  - { type: timing.p95Ms, max: 300 }
