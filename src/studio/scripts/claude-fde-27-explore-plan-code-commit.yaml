    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ late fee bug ပြီးတော့ မောင်မောင် က နောက်ထပ် အလုပ် တစ်ခု ပေးပါတယ်။ လစဉ်
      ဝင်ငွေ report ထဲမှာ late fee ကို သီးခြား line တစ်ခုအဖြစ် ပြချင်တာပါ။ Claude က ဒီအလုပ် ပြီးပြီလို့ ကိုယ်တိုင်
      သိနိုင်အောင် ဘယ်ညွှန်ကြားချက်က ကူညီမလဲ။
      [[mark:q-a]] ပထမ တစ်ခုက report ထုတ်ပြီးရင် finance manager က ကြည့်ပြီး မှန်တယ်လို့ ပြောမှ ပြီးမယ် ဆိုတဲ့ ညွှန်ကြားချက်ပါ။
      [[mark:q-b]] ဒုတိယ တစ်ခုက test data ထဲက late fee စုစုပေါင်းနဲ့ report ရဲ့ late fee line ကိုက်ရမယ် ဆိုတဲ့ test
      အသစ်ကို ရေးပြီး pass ရမယ် ဆိုတာပါ။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ တစ်ခုပါ။ ဘာကြောင့်လဲဆိုတော့ finance manager ရဲ့ အတည်ပြုချက်ကို Claude က
      ကိုယ်တိုင် run လို့ မရပါဘူး။ test တစ်ခုကတော့
      fail နေသရွေ့ ဆက်ပြင်ရမယ်၊ pass မှ ရပ်ရမယ် ဆိုတာကို ရှင်းရှင်း ပြပါတယ်။
      [[mark:q-rule]] ဒါကြောင့် prompt တစ်ခုမှာ ပြီးပြီ ဆိုတာကို pass နဲ့ fail ပြတဲ့၊ Claude ကိုယ်တိုင် run နိုင်တဲ့
      check တစ်ခုနဲ့ ဖော်ပြပါ။ finance manager လို လူ စစ်ရမယ့် အချက်ကိုတော့ commit မလုပ်ခင် review အဆင့်မှာ ထားပါ။
    sources:
      - {
          title: "Claude Code Docs: Best practices (give Claude a way to verify its work)",
          url: "https://code.claude.com/docs/en/best-practices",
        }
    actions:
