runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: need
    chapter: တစ်ကြောင်းတည်းနဲ့ ခိုင်းတော့
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ Claude Code က တစ်ခုခု မလုပ်ခင် တောင်းတဲ့ permission request တွေ၊ ဘာကို မမေးဘဲ
      လုပ်ခွင့်ပေးမလဲ သတ်မှတ်တဲ့ permission mode တွေနဲ့ allow၊ ask၊ deny rule တွေကို လေ့လာခဲ့ပါတယ်။ ဒီနေ့ မေးခွန်းကတော့ ခွင့်ပေးထားတဲ့ နယ်ထဲမှာ အလုပ်
      တစ်ခုကို ဘယ်လို ခိုင်းမလဲ ဆိုတာပါ။
      [[mark:sel-billing]] အခု အပတ် ၆ ရောက်ပါပြီ။ ကိုယ်က Billing team နဲ့ အတူ Billing codebase ထဲမှာ Claude Code ကို
      စသုံးနေပါတယ်။ Claude Code ဆိုတာ terminal ထဲကနေ code ကို ဖတ်၊ ပြင်ပြီး command တွေ run ပေးတဲ့ coding
      agent ပါ။ Billing team lead မောင်မောင် က ပထမဆုံး တကယ့် အလုပ်အဖြစ် customer တွေ တိုင်ကြားထားတဲ့ late fee bug
      တစ်ခုကို ရွေးပါတယ်။ due date နေ့ ညဘက်မှာ ငွေပေးတဲ့ customer တွေကိုလည်း late fee ကောက်နေတာပါ။
      [[mark:story]] team ထဲက developer တစ်ယောက်က Claude Code ကို late fee bug ကို ပြင်ပေးပါလို့ တစ်ကြောင်းတည်း
      ခိုင်းလိုက်ပါတယ်။ Claude က code နည်းနည်း ဖတ်ပြီး ရက်စွဲ နှိုင်းယှဉ်တဲ့ စာကြောင်း တစ်ကြောင်းကို ပြင်ပြီး၊
      ပြီးပါပြီလို့ ပြောပါတယ်။
      [[mark:story-2]] developer က ကိုယ်တိုင် လိုက်စစ်ကြည့်တော့ ညဘက်မှာ ပေးတဲ့ customer ကို fee မကောက်တော့တာ
      မှန်ပါတယ်။ ဒါပေမဲ့ တစ်ရက် တကယ် နောက်ကျတဲ့ customer ကိုလည်း fee မကောက်တော့တာ တွေ့ရပါတယ်။ bug တစ်ခု
      ပြင်ရင်း နောက် bug တစ်ခု ဝင်လာပြီး၊ အဲဒါကို တွေ့ဖို့ developer က တစ်နာရီလောက် ထိုင်စစ်ခဲ့ရပါတယ်။
      [[mark:story-3]] မောင်မောင် ရဲ့ သံသယက နားလည်လို့ ရပါတယ်။ ဒါပေမဲ့ ဒီမှာ ပျက်သွားတာ model ရဲ့ စွမ်းရည် မဟုတ်ဘဲ
      ခိုင်းပုံပါ။ အကြောင်းရင်းကို အရင် မရှာခဲ့ဘူး၊ ဘယ်လို ပြင်မလဲ သဘောမတူခဲ့ဘူး၊ ပြီးပြီ ဆိုတာကို Claude ဘယ်လို
      သိမလဲ ဆိုတာလည်း မပေးခဲ့ပါဘူး။ ဒီ lesson မှာ အလုပ် တစ်ခုကို အဆင့် လေးဆင့် ခွဲခိုင်းပုံနဲ့၊ Claude ကိုယ်တိုင် run
      လို့ရတဲ့ check ပေးပုံကို လေ့လာပါမယ်။
    sources:
      - {
          title: "Claude Code Docs: Best practices",
          url: "https://code.claude.com/docs/en/best-practices",
        }
    actions:
      - { id: open-readme, type: workspace.openFile, at: { mark: sel-billing }, path: README.md }
      - id: sel-billing
        type: editor.select
        at: { afterAction: open-readme }
        target:
          file: README.md
          text: "- Billing: plan၊ invoice၊ ငွေပေးချေမှု (သက်တမ်း 9 နှစ်ရှိ codebase)"
      - id: sel-claude-code
        type: editor.select
        at: { mark: story }
        target:
          file: README.md
          text: "- Billing team နဲ့ Claude Code"

  - id: four-steps
    chapter: အဆင့် လေးဆင့်
    narration: >
      [[mark:s-open]] ဒီ လေးဆင့်ကို ကိုယ်တို့ Billing team နဲ့ အလုပ်လုပ်ပုံ အဖြစ် သဘောတူလိုက်ပါတယ်။ အဆင့် တစ်ခုစီမှာ
      Claude လုပ်တာ တစ်ခု၊ နောက်အဆင့် မသွားခင် လူက စစ်တာ တစ်ခု ရှိပါတယ်။
      [[mark:s-1]] ပထမ အဆင့်က explore ပါ။ Claude ကို ဘာမှ မပြင်ခိုင်းသေးဘဲ၊ ဆိုင်တဲ့ code တွေကို ဖတ်ပြီး ဘယ်လို
      အလုပ်လုပ်လဲ ရှင်းပြခိုင်းတာပါ။ late fee bug မှာဆိုရင် ငွေပေးတဲ့ အချိန်ကို time zone တစ်ခုနဲ့ ယူပြီး၊ due date
      ကိုတော့ နောက် time zone တစ်ခုနဲ့ နှိုင်းယှဉ်နေတာ ဒီအဆင့်မှာ ပေါ်လာပါတယ်။ လူက စစ်ရမှာက အကြောင်းရင်း တကယ်
      တွေ့ပြီလား ဆိုတာပါ။
      [[mark:s-2]] ဒုတိယ အဆင့်က plan ပါ။ ဘယ် file တွေကို ဘယ်လို ပြင်မလဲ၊ ပြီးပြီ ဆိုတာကို ဘာနဲ့ စစ်မလဲ ဆိုတာကို
      code မထိခင် သဘောတူတာပါ။
      [[mark:s-3]] တတိယ အဆင့်က code ပါ။ plan အတိုင်း ပြင်ပြီး၊ check ကို pass တဲ့အထိ Claude ကိုယ်တိုင်
      run ခိုင်းတာပါ။ လူက ကြည့်ရမှာက Claude ရဲ့ ပြီးပါပြီ ဆိုတဲ့ စကား မဟုတ်ဘဲ၊ pass ခဲ့တဲ့ အထောက်အထားပါ။
      [[mark:s-4]] စတုတ္ထ အဆင့်က commit ပါ။ ဘာမှားခဲ့လဲ၊ ဘယ်လို ပြင်လဲ ရှင်းပြတဲ့ message နဲ့ commit လုပ်ခိုင်းပါတယ်။
      လူကတော့ diff ကို ကိုယ်တိုင် review လုပ်ပြီးမှ ခွင့်ပြုပါတယ်။
      [[mark:s-point]] သတိထားရမှာက ဒီ လေးဆင့်ဟာ Claude Code ထဲက feature တစ်ခု မဟုတ်ဘူး ဆိုတာပါ။ Claude Code က ပေးထားတဲ့ plan mode နဲ့၊ Claude ကိုယ်တိုင် run နိုင်တဲ့ check ဆိုတဲ့
      နှစ်ခုပေါ်မှာ ကိုယ်တို့ တည်ဆောက်ထားတဲ့ အလေ့အကျင့် တစ်ခုပါ။
    sources:
