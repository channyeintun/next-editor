  - id: plan-mode
    chapter: Plan mode
    narration: >
      [[mark:p-open]] ဒုတိယ အဆင့်မှာ သုံးတဲ့ plan mode ကို ကြည့်ရအောင်။ plan mode ဆိုတာ ဘာမှ မပြင်ဘဲ အရင် ဖတ်ပြီး
      အစီအစဉ် ဆွဲခိုင်းတဲ့ mode ပါ။ Claude က code ကို ဖတ်ပြီး plan ကို ရေးပေမဲ့၊ ကိုယ်က ခွင့်မပြုမချင်း source file
      တွေကို မပြင်ပါဘူး။ ဒီ screen မှာ အဲဒီ plan တစ်ခုက ခွင့်ပြုချက် စောင့်နေတာကို ဒီလို မြင်ရပါတယ်။
      [[mark:p-enter]] session ထဲမှာ Shift နဲ့ Tab ကို တွဲနှိပ်ပြီး mode တွေကြား ပြောင်းရင်း plan mode ကို ရောက်နိုင်သလို၊
      plan command နဲ့လည်း တိုက်ရိုက် ဝင်နိုင်ပါတယ်။
      [[mark:p-title]] ဒီ ဥပမာ plan ရဲ့ အလုပ်ကတော့ late fee bug မဟုတ်ဘဲ၊ တစ်နှစ်စာ ကြိုပေးတဲ့ customer ကို ၂ ရာခိုင်နှုန်း
      လျှော့ပေးမယ့် change တစ်ခုပါ။
      [[mark:p-steps]] plan ထဲမှာ ဘယ် file ထဲက ဘာကို ပြင်မလဲ ဆိုတာ အဆင့်လိုက် ပါပါတယ်။ ဒီအချိန်မှာ code မပြင်ရသေးတာမို့၊
      မကြိုက်တဲ့ အဆင့်ကို ပြောင်းခိုင်းတာက ဘာမှ မကုန်ပါဘူး။
      [[mark:p-check]] သတိထားကြည့်စရာက plan ထဲမှာ Check ဆိုတဲ့ အပိုင်း ပါနေတာပါ။ ဘယ် test တွေ ထည့်မလဲ၊ ဘယ် ဂဏန်း
      ထွက်ရမလဲ ဆိုတာကို plan ကတည်းက သဘောတူထားရင်၊ code အဆင့်မှာ Claude က ဘယ်အချိန် ရပ်ရမလဲ သိပါတယ်။
      [[mark:p-yes]] အောက်ဆုံးမှာ ရွေးစရာ သုံးခု ရှိပါတယ်။ ပထမ တစ်ခုက plan ကို လက်ခံပြီး auto mode နဲ့ ဆက်လုပ်ခိုင်းတာပါ။
      auto mode ဆိုတာ နောက်ကွယ်က classifier တစ်ခုက action တစ်ခုချင်းကို စစ်ပေးပြီး မမေးဘဲ ဆက်သွားတဲ့ mode ပါ။
      [[mark:p-manual]] ဒုတိယ တစ်ခုက plan ကို လက်ခံပေမဲ့ edit တစ်ခုချင်းကို ကိုယ်တိုင် ခွင့်ပြုမယ် ဆိုတာပါ။ Billing လို
      သက်တမ်းကြာတဲ့ codebase မှာ ပထမဆုံး အလုပ်တွေအတွက် ဒါက ပိုသင့်တော်ပါတယ်။
      [[mark:p-change]] တတိယ တစ်ခုကတော့ ဘာကို ပြောင်းစေချင်လဲ ပြောပြပြီး Claude ကို plan ဆက်ဆွဲခိုင်းတာပါ။
    sources:
      - {
          title: "Claude Code Docs: Permission modes (plan mode)",
          url: "https://code.claude.com/docs/en/permission-modes",
        }
    actions:
      - {
          id: close-steps,
          type: whiteboard.apply,
          at: { mark: p-open, offsetMs: -1400 },
          open: false,
        }
      - {
          id: show-plan,
          type: slide.show,
          at: { mark: p-open, offsetMs: -700 },
          slideId: plan-screen,
        }
      - {
          id: point-p-ready,
          type: slide.point,
          at: { mark: p-open, offsetMs: 1500 },
          target: { x: 0.171, y: 0.228 },
        }
      - {
          id: point-p-title,
          type: slide.point,
          at: { mark: p-title },
          target: { x: 0.171, y: 0.349 },
        }
      - {
          id: point-p-steps,
          type: slide.point,
          at: { mark: p-steps },
          target: { x: 0.171, y: 0.470 },
        }
      - {
          id: point-p-check,
          type: slide.point,
          at: { mark: p-check },
          target: { x: 0.15, y: 0.621 },
        }
      - { id: point-p-yes, type: slide.point, at: { mark: p-yes }, target: { x: 0.211, y: 0.802 } }
      - {
          id: point-p-manual,
          type: slide.point,
          at: { mark: p-manual },
          target: { x: 0.211, y: 0.832 },
        }
      - {
          id: point-p-change,
          type: slide.point,
          at: { mark: p-change },
          target: { x: 0.211, y: 0.862 },
        }

  - id: the-check
    chapter: Claude run လို့ရတဲ့ check
    narration: >
      [[mark:k-open]] အဆင့် လေးဆင့်ထဲမှာ အရေးအကြီးဆုံး အပိုင်းက check ပါ။ check ဆိုတာ pass ဒါမှမဟုတ် fail ကို ရှင်းရှင်း
      ပြတဲ့ အရာပါ။
      [[mark:k-left]] check မပေးဘဲ ခိုင်းရင် Claude က အလုပ် ပြီးပုံ ရတဲ့အခါ ရပ်တတ်ပါတယ်။ တကယ် ပြီးမပြီး ဆုံးဖြတ်ရတဲ့သူက
      ကိုယ်ပဲ ဖြစ်သွားပါတယ်။
      [[mark:k-left-2]] ဆိုလိုတာက ကိုယ်ကိုယ်တိုင် test suite ဖြစ်သွားတာပါ။ late fee bug တုန်းက တစ်နာရီ ထိုင်စစ်ခဲ့ရတာ
      ဒါပါပဲ။
      [[mark:k-right]] check ပေးလိုက်ရင်တော့ ပုံစံ ပြောင်းသွားပါတယ်။ test၊ build ရဲ့ exit code၊ lint လိုမျိုး Claude
      ကိုယ်တိုင် run ပြီး ရလဒ်ကို ဖတ်နိုင်တဲ့ command ဖြစ်ရပါမယ်။
      [[mark:k-pass]] fail ရင် Claude က error ကို ဖတ်ပြီး ဆက်ပြင်ပါတယ်။ pass မှ ရပ်ရမယ် ဆိုတာလည်း ရှင်းသွားပါတယ်။ ဒါကြောင့် prompt ထဲမှာ test
      တွေ pass တဲ့အထိ ဆက်လုပ်ပါလို့ ပြောပေးရပါတယ်။
      [[mark:k-loop]] Claude က ပြီးပါပြီလို့ ပြောတဲ့အခါ run ခဲ့တဲ့ command နဲ့ ထွက်လာတဲ့ output ကို အထောက်အထား
      အဖြစ် ပြခိုင်းပါ။
    sources:
      - {
          title: "Claude Code Docs: Best practices (give Claude a way to verify its work)",
          url: "https://code.claude.com/docs/en/best-practices",
        }
    actions:
      - { id: close-plan, type: slide.close, at: { mark: k-open, offsetMs: -1200 } }
      - {
          id: draw-k-open,
          type: whiteboard.apply,
          at: { mark: k-open },
          open: true,
          clear: true,
          upsertIds: [k-title],
        }
      - {
          id: draw-k-left,
          type: whiteboard.apply,
          at: { mark: k-left },
          upsertIds: [k-lb, k-ll],
          drawMs: 1200,
        }
      - {
          id: draw-k-left-2,
          type: whiteboard.apply,
          at: { mark: k-left-2 },
          upsertIds: [k-lt],
          drawMs: 900,
        }
      - {
          id: draw-k-right,
          type: whiteboard.apply,
          at: { mark: k-right },
          upsertIds: [k-rb1, k-rl1],
          drawMs: 1200,
        }
      - {
          id: draw-k-pass,
          type: whiteboard.apply,
          at: { mark: k-pass },
          upsertIds: [k-ra, k-rb2, k-rl2],
          drawMs: 1500,
        }
      - {
          id: draw-k-loop,
          type: whiteboard.apply,
          at: { mark: k-loop },
          upsertIds: [k-loop, k-lt2],
          drawMs: 1200,
        }

  - id: explore-plan
    chapter: Prompt လေးခု
    narration: >
      [[mark:f-open]] ဒါဆို late fee bug ကို ဒီ လေးဆင့်နဲ့ ပြန်ခိုင်းကြည့်ရအောင်။ အဆင့် တစ်ခုစီအတွက် prompt တစ်ခုနဲ့၊
      နောက်အဆင့် မသွားခင် ကိုယ်က စစ်ရမယ့် အချက် တစ်ချက်ကို ရေးပါမယ်။
      [[mark:type-explore]] ပထမ prompt က explore အတွက်ပါ။ ငွေပေးတဲ့ မှတ်တမ်းကနေ fee ကောက်တဲ့အထိ ဘယ်လို ဆုံးဖြတ်လဲ
      ရှင်းပြခိုင်းပြီး၊ file တစ်ခုမှ မပြင်ဖို့ ပြောထားပါတယ်။ ကိုယ်က စစ်ရမှာက ငွေပေးတဲ့ အချိန်ကို ဘယ် time
      zone နဲ့ သိမ်းလဲ ဆိုတာ Claude တွေ့ခဲ့လား ဆိုတာပါ။
      [[mark:type-plan]] ဒုတိယ prompt ကို plan mode ထဲမှာ ရေးပါတယ်။ ဒီနေ့ fail နေတဲ့ test တွေနဲ့ စဖို့၊ ပြင်မယ့် file
      တိုင်းကို စာရင်းပြဖို့ တောင်းထားပါတယ်။ test ကို အရင် ရေးခိုင်းတာက bug ကို သက်သေ အရင် ပြခိုင်းတာပါ။
      [[mark:sel-plan-check]] plan ကို လက်မခံခင် ညဘက် ငွေပေးတဲ့ case နဲ့ တစ်ရက်
      နောက်ကျတဲ့ case နှစ်ခုလုံး test ထဲမှာ ပါရပါမယ်။ ဒုတိယ case က ပထမ အကြိမ်က ကျိုးသွားခဲ့တဲ့ နေရာပါ။
    sources:
      - { title: "Claude Code Docs: Quickstart", url: "https://code.claude.com/docs/en/quickstart" }
      - {
          title: "Claude Code Docs: Permission modes (plan mode)",
          url: "https://code.claude.com/docs/en/permission-modes",
        }
    actions:
      - { id: close-check, type: whiteboard.apply, at: { mark: f-open }, open: false }
      - {
          id: open-notebook,
          type: workspace.openFile,
          at: { afterAction: close-check },
          path: notebook/27-four-prompts.md,
        }
      - id: type-explore
        type: editor.type
        at: { mark: type-explore }
        cadence: line-by-line
        target: { file: notebook/27-four-prompts.md, after: "late fee ကောက်နေတယ်\n\n" }
        text: "## 1. Explore (ဘာမှ မပြင်ရ)\n> Explain how a payment record leads to a late fee. Don't edit any files yet.\n- စစ်ရမှာ: payment အချိန်ကို ဘယ် time zone နဲ့ သိမ်းလဲ တွေ့လား\n\n"
      - id: type-plan
        type: editor.type
        at: { mark: type-plan }
        cadence: line-by-line
        target: { file: notebook/27-four-prompts.md, after: "time zone နဲ့ သိမ်းလဲ တွေ့လား\n\n" }
        text: "## 2. Plan (plan mode)\n> Plan the fix. Start with tests that fail today, and list every file you will change.\n- စစ်ရမှာ: ညဘက် ပေးတဲ့ case နဲ့ 1 ရက် နောက်ကျတဲ့ case နှစ်ခုလုံး test ထဲ ပါလား\n\n"
      - id: sel-plan-check
        type: editor.select
        at: { mark: sel-plan-check }
        target:
          file: notebook/27-four-prompts.md
          text: "- စစ်ရမှာ: ညဘက် ပေးတဲ့ case နဲ့ 1 ရက် နောက်ကျတဲ့ case နှစ်ခုလုံး test ထဲ ပါလား"

  - id: code-commit
    narration: >
      [[mark:type-code]] တတိယ prompt က code အတွက်ပါ။ plan ထဲက test တွေကို ထည့်၊ bug ကို ပြင်၊ npm test ကို run ပြီး
      pass တဲ့အထိ ဆက်လုပ်ပါလို့ ခိုင်းထားပါတယ်။ ဒီ နောက်ဆုံး အပိုင်းက Claude ကို ဘယ်အချိန် ရပ်ရမလဲ ပြောပေးတာပါ။
      ကိုယ်က စစ်ရမှာကတော့ Claude ပြတဲ့ command နဲ့ output ပါ။
      [[mark:type-commit]] စတုတ္ထ prompt က commit အတွက်ပါ။ time zone ကြောင့် ဘာမှားခဲ့လဲ၊ ဘယ် test အသစ်တွေက
      ပြင်ချက်ကို သက်သေပြလဲ ဆိုတာ message ထဲမှာ ပါစေပါတယ်။ နောက်မှ ဒီ commit ကို ပြန်ဖတ်မယ့် developer အတွက်ပါ။
      [[mark:sel-commit-check]] နောက်ဆုံး စစ်ချက်ကတော့ diff ကို ကိုယ်တိုင် review လုပ်တာပါ။ test pass တာနဲ့ code
      ကောင်းတာ တစ်ခုတည်း မဟုတ်ပါဘူး။ ပြင်ထားတဲ့ file တွေက plan ထဲက စာရင်းနဲ့ ကိုက်လား၊ မလိုတဲ့ နေရာတွေ ထိသွားလား
      ဆိုတာကို ကိုယ်တိုင် ကြည့်ပါ။
      [[mark:sel-first]] တစ်ကြောင်းတည်းနဲ့ ခိုင်းတာထက် အလုပ် ပိုများတယ် ထင်ရပေမဲ့၊ prompt လေးခု ရေးတာ မိနစ်ပိုင်းပဲ
      ကြာပြီး တစ်နာရီကြာ ထိုင်စစ်ရတာကနေ ကယ်ပေးပါတယ်။
    sources:
      - {
          title: "Claude Code Docs: Best practices",
          url: "https://code.claude.com/docs/en/best-practices",
        }
