build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 2608

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  - id: intro
    chapter: "Keyboard နဲ့ သုံးတဲ့သူတွေ"
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ page ရဲ့ title နဲ့ ဘာသာစကားကို ပြင်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ mouse
      မသုံးဘဲ keyboard နဲ့ page ကို သုံးတဲ့သူတွေအတွက် keyboard focus ကို ကြည့်သွားပါမယ်။
      [[mark:start-server]] ဥပမာ အောင်အောင်ကို စဉ်းစားကြည့်ရအောင်။ wheelchair
      သုံးပြီး လက်ကို လှုပ်ရှားရ ခက်တဲ့အတွက် mouse ကို ကောင်းကောင်း မသုံးနိုင်ပါဘူး။ ဒါကြောင့်
      keyboard ဒါမှမဟုတ် keyboard လို အလုပ်လုပ်တဲ့ switch device နဲ့ page ကို သုံးပါတယ်။ screen
      reader သုံးတဲ့ မျက်မမြင်တွေကလည်း ကွန်ပျူတာမှာ mouse အစား keyboard ကို သုံးကြပြီး၊ လက်ကျိုးနေတဲ့သူ၊
      မြန်မြန် အလုပ်လုပ်ချင်လို့ keyboard ကို ပိုကြိုက်တဲ့သူတွေလည်း ရှိပါတယ်။ [[mark:draw-focus]]
      keyboard နဲ့ သုံးတဲ့အခါ အရေးအကြီးဆုံးက focus ပါ။ focus ဆိုတာ keyboard နဲ့ အခု ဘယ် element
      ကို ရွေးထားလဲ ဆိုတာပါ။ [[mark:draw-keys]]
      Tab key က focus ကို နောက် element တစ်ခုဆီ ရွှေ့ပြီး၊ Shift နဲ့ Tab က ရှေ့က element ဆီ
      ပြန်ရွှေ့ပါတယ်။ focus ရောက်နေတဲ့ link ဒါမှမဟုတ် ခလုတ်ကို Enter နဲ့ နှိပ်လို့ ရပြီး၊
      ခလုတ်ကို Space နဲ့လည်း နှိပ်လို့ ရပါတယ်။ radio ခလုတ် အုပ်စုလို နေရာတွေမှာတော့ arrow key ကို သုံးပါတယ်။ [[mark:draw-studio]] ဒီ lesson ထဲမှာ key တွေကို နှိပ်ပြလို့ မရလို့၊ accessibility panel က Tab key နှိပ်သလို focus ကို ရွှေ့ပေးပြီး၊ Tab
      နဲ့ ရောက်မယ့် အစဉ်ကိုလည်း နံပါတ်လေးတွေနဲ့ ပြပေးပါမယ်။
    sources:
      - title: "web.dev Learn Accessibility — Keyboard focus"
        url: "https://web.dev/learn/accessibility/focus"
      - title: "W3C WAI — Keyboard compatibility (diverse abilities and barriers)"
        url: "https://www.w3.org/WAI/perspective-videos/keyboard/"
      - title: "WAI-ARIA Authoring Practices — Developing a keyboard interface"
        url: "https://www.w3.org/WAI/ARIA/apg/practices/keyboard-interface/"
    actions:
      - id: open-intro-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [k-title]
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-who
        type: whiteboard.apply
        at: { afterAction: start-dev-server }
        upsertIds: [k-who1, k-who2]
        drawMs: 1600
      - id: draw-focus
        type: whiteboard.apply
        at: { mark: draw-focus }
        upsertIds: [k-focus-box, k-focus]
        drawMs: 1200
      - id: draw-keys
        type: whiteboard.apply
        at: { mark: draw-keys }
        upsertIds: [k-keys1, k-keys2]
        drawMs: 1600
      - id: draw-studio
        type: whiteboard.apply
        at: { mark: draw-studio }
        upsertIds: [k-studio]
        drawMs: 1200

  - id: code-tour
    narration: >
      [[mark:close-intro]] ဆိုင်ရဲ့ page ကို ကြည့်ရအောင်။ [[mark:open-index]] ဒါက HTML ဖိုင်ပါ။
      [[mark:select-nav]] အပေါ်က nav ထဲမှာ မီနူး၊ ဖွင့်ချိန်၊ မှာယူရန် ဆိုတဲ့ link သုံးခုကို ဒီ
      အစဉ်အတိုင်း ရေးထားပါတယ်။ [[mark:select-special]] သူ့အောက်မှာတော့ ယနေ့ အထူး card
      ရှိပါတယ်။ mouse နဲ့ နှိပ်ရင် အထူးကို ရွေးပေးပေမယ့်၊ div တစ်ခုပဲ ဖြစ်ပါတယ်။ [[mark:preview-shows]] ညာဘက်မှာ
      ဆိုင်ရဲ့ page ကို မြင်ရပါပြီ။ accessibility panel က Tab နဲ့ ရောက်နိုင်တဲ့ element တွေကို အစဉ်လိုက် ပြပြီး၊ page ပေါ်မှာလည်း နံပါတ် badge လေးတွေ ကပ်ပြထားပါတယ်။ အားလုံး ငါးခု ရှိပါတယ်။ ယနေ့ အထူး card မှာတော့ နံပါတ် မရှိပါဘူး။
      ဆိုလိုတာက mouse နဲ့ နှိပ်လို့ ရပေမယ့်၊ keyboard နဲ့ ရောက်လို့ မရပါဘူး။
    sources:
      - title: "web.dev Learn Accessibility — Keyboard focus: focus order"
        url: "https://web.dev/learn/accessibility/focus#focus_order"
      - title: "MDN — Keyboard-navigable JavaScript widgets"
        url: "https://developer.mozilla.org/en-US/docs/Web/Accessibility/Keyboard-navigable_JavaScript_widgets"
    actions:
      - id: close-intro
        type: whiteboard.apply
        at: { mark: close-intro }
        open: false
      - id: open-index
        type: workspace.openFile
        at: { mark: open-index }
        path: index.html
      - id: select-nav
        type: editor.select
        at: { mark: select-nav }
        target: { file: index.html, text: '<nav class="nav"', occurrence: 1 }
      - id: select-special
        type: editor.select
        at: { mark: select-special }
        target: { file: index.html, text: '<div class="menu-card special"', occurrence: 1 }
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { mark: preview-shows }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-dev-server }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-five-stops
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: tab-count }
        attribute: { name: data-count, value: "5" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-menu-first
        type: expect.preview
        at: { afterAction: expect-five-stops }
        timeoutMs: 5000
        target: { by: testId, value: tab-nav-drinks }
        attribute: { name: data-order, value: "1" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-favourite-fourth
        type: expect.preview
        at: { afterAction: expect-menu-first }
        timeoutMs: 5000
        target: { by: testId, value: tab-favourite }
        attribute: { name: data-order, value: "4" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: collapse-runner-dock
        type: runtime.collapseDock
        at: { afterAction: expect-favourite-fourth }

  - id: order
    chapter: "Focus order နဲ့ မြင်ရတဲ့ အစဉ်"
    narration: >
      [[mark:tab-1]] Tab key ကို နှိပ်ကြည့်ရအောင်။ [[mark:after-tab-1]] focus က nav ရဲ့ ညာဘက်
      အစွန်ဆုံးက မီနူး link ကို ရောက်သွားပြီး၊ သူ့ badge က အနီရောင် ပြောင်းသွားပါတယ်။ ဒါပေမဲ့
      page ပေါ်မှာ focus ရောက်နေတယ် ဆိုတာ ပြတဲ့ ဘောင် ဘာမှ မရှိတာကို သတိထား ကြည့်ပါ။ [[mark:tab-2]] နောက်တစ်ချက် နှိပ်တော့ ဖွင့်ချိန်ကို ရောက်ပြီး၊
      [[mark:tab-3]] နောက်တစ်ချက်မှာတော့ မှာယူရန်ကို ရောက်ပါတယ်။ [[mark:explain-order]] focus က
      ညာကနေ ဘယ်ကို သွားနေပါတယ်။ ကိုယ်တွေ စာကို ဘယ်ကနေ ညာ ဖတ်တဲ့အတွက် ဒါက ဖတ်တဲ့ အစဉ်နဲ့
      ပြောင်းပြန်ပါ။ [[mark:why-order]] ဘာကြောင့်လဲဆိုတော့၊ Tab အစဉ်က HTML ထဲမှာ ရေးထားတဲ့ အစဉ်ကို လိုက်လို့ပါ။
      HTML ထဲမှာ မီနူး က ပထမ ဖြစ်ပေမယ့်၊ link တွေကို ညာဘက် ကပ်ချင်လို့ CSS မှာ flexbox ရဲ့
      row reverse နဲ့ အစဉ်ကို လှန်ပြထားတာပါ။ မျက်စိနဲ့ မြင်ရတဲ့ အစဉ်နဲ့ focus သွားတဲ့ အစဉ်
      မတူရင်၊ keyboard သုံးတဲ့သူက focus ဘယ်ကို ခုန်သွားမလဲ မှန်းလို့ မရတော့ပါဘူး။ WCAG ရဲ့ focus order စည်းကမ်းကလည်း ဒီ အချက်အတွက်ပါ။ [[mark:open-styles]]
      ဒါကို ပြင်ဖို့ CSS ဖိုင်ကို ဖွင့်ပါမယ်။ [[mark:type-nav]] link တွေကို ညာဘက် ကပ်ချင်ရင်
      အစဉ်ကို မလှန်ဘဲ၊ ပုံမှန် row အတိုင်း ထားပြီး justify content နဲ့ ညာဘက်ကို တွန်းရပါမယ်။ [[mark:after-nav]] link တွေ ညာဘက်မှာပဲ ရှိနေပေမယ့်၊
      မီနူး၊ ဖွင့်ချိန်၊ မှာယူရန် ဆိုပြီး ဘယ်ကနေ ညာ ဖြစ်သွားပြီး၊ badge နံပါတ်တွေကလည်း ဘယ်ကနေ
      ညာ စီသွားပါပြီ။ တကယ်လို့ မှာယူရန် ကို ရှေ့ဆုံးမှာ ပြချင်ရင်တော့ CSS နဲ့ မလှည့်ဘဲ၊ HTML
      ထဲမှာပဲ ရှေ့ဆုံးကို ရွှေ့ရေးပါ။
    sources:
      - title: "web.dev Learn Accessibility — Keyboard focus: focus order"
        url: "https://web.dev/learn/accessibility/focus#focus_order"
      - title: "WCAG 2.2 Understanding — Focus Order"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/focus-order"
      - title: "MDN — Ordering flex items (reordering and accessibility)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_flexible_box_layout/Ordering_flex_items"
    actions:
      - id: tab-1
        type: preview.click
        at: { mark: tab-1 }
        timeoutMs: 5000
        target: { by: testId, value: a11y-tab-next }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-tab-menu
        type: expect.preview
        at: { mark: after-tab-1 }
        timeoutMs: 5000
        target: { by: testId, value: tab-nav-drinks }
        textContains: '1 link "မီနူး" focused'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: tab-2
        type: preview.click
        at: { mark: tab-2 }
        timeoutMs: 5000
        target: { by: testId, value: a11y-tab-next }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: tab-3
        type: preview.click
        at: { mark: tab-3 }
        timeoutMs: 5000
        target: { by: testId, value: a11y-tab-next }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-tab-order-link
        type: expect.preview
        at: { mark: explain-order }
        timeoutMs: 5000
        target: { by: testId, value: tab-nav-order }
        textContains: '3 link "မှာယူရန်" focused'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: open-styles
        type: workspace.openFile
        at: { mark: open-styles }
        path: styles.css
      - id: type-nav
        type: editor.type
        at: { mark: type-nav }
        cadence: fast-explainer
        target: { file: styles.css, after: "", occurrence: 1 }
        text: ".nav ul {\n  flex-direction: row;\n  justify-content: flex-end;\n}\n"
      - id: expect-file-nav
        type: expect.file
        at: { mark: after-nav }
        path: styles.css
        contains: "flex-direction: row;"
      - id: expect-menu-still-first
        type: expect.preview
        at: { afterAction: expect-file-nav }
        timeoutMs: 5000
        target: { by: testId, value: tab-nav-drinks }
        attribute: { name: data-order, value: "1" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: tabindex
    chapter: "tab index ရဲ့ တန်ဖိုး သုံးမျိုး"
    narration: >
      [[mark:open-index-2]] HTML ဖိုင်ကို ပြန်သွားရအောင်။ tab index attribute က element တစ်ခုကို
      Tab အစဉ်ထဲ ထည့်တာ၊ ထုတ်တာ၊ အစဉ်ကို ပြောင်းတာ လုပ်ပေးပါတယ်။ တန်ဖိုး သုံးမျိုးကို
      စမ်းကြည့်ဖို့ အကွက်လေး တစ်ခု ထည့်ကြည့်ရအောင်။
      [[mark:type-demo]] အကွက်ထဲမှာ tab index သုံး ပါတဲ့ link တစ်ခု၊ tab index သုည ပါတဲ့ span
      တစ်ခုနဲ့ tab index အနှုတ် တစ် ပါတဲ့ span တစ်ခု ပါပါတယ်။ [[mark:after-demo]] panel ကို
      ကြည့်ပါ။ page ရဲ့ အလယ်မှာ ရှိတဲ့ tab index သုံး link က nav ကိုတောင် ကျော်ပြီး နံပါတ်
      တစ် ဖြစ်သွားပါတယ်။ [[mark:tab-demo]] page ကို အစကနေ Tab နှိပ်ကြည့်ရင်၊ [[mark:after-tab-demo]]
      focus က header ကို ကျော်ပြီး ဒီ link ကို တန်း ရောက်သွားပါတယ်။ ဒါကြောင့် အပေါင်း တန်ဖိုး
      ပါတဲ့ tab index ကို မသုံးပါနဲ့။ သူက page ရဲ့ သဘာဝ အစဉ်ကို ဖျက်ပြီး၊ element အသစ် ထည့်တိုင်း
      နံပါတ်တွေကို ပြန်ညှိနေရပါတယ်။ [[mark:explain-zero]] tab index သုည ပါတဲ့ span ကတော့ မူလက
      focus မရနိုင်ပေမယ့်၊ HTML ထဲမှာ ရေးထားတဲ့ နေရာအတိုင်း Tab အစဉ်ထဲ ဝင်လာပြီး နံပါတ် ငါး
      ရပါတယ်။ tab index အနှုတ် တစ် ပါတဲ့ span ကတော့ နံပါတ် မရပါဘူး။ Tab နဲ့ မရောက်ပေမယ့်
      JavaScript ကနေ focus ပေးလို့ ရတဲ့ element အတွက် သုံးပါတယ်။ ဥပမာ dialog ဖွင့်တဲ့အခါ focus
      ပို့ချင်တဲ့ နေရာမျိုးပါ။ [[mark:type-hide]] စမ်းသပ်ချက် ပြီးသွားပြီမို့ ဒီ အကွက်ကို hidden
      attribute နဲ့ ဖျောက်ထားလိုက်ပါမယ်။ [[mark:after-hide]] badge တွေ ပျောက်သွားပြီး၊ Tab အစဉ်က
      ငါးခုကို ပြန်ရောက်ပါပြီ။ hidden element တွေက Tab အစဉ်ထဲ မပါလို့ပါ။
    sources:
      - title: "web.dev Learn Accessibility — Keyboard focus: tabindex"
        url: "https://web.dev/learn/accessibility/focus#tabindex"
      - title: "MDN — tabindex global attribute"
        url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Global_attributes/tabindex"
      - title: "MDN — hidden global attribute"
        url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Global_attributes/hidden"
    actions:
      - id: open-index-2
        type: workspace.openFile
        at: { mark: open-index-2 }
        path: index.html
      - id: type-demo
        type: editor.type
        at: { mark: type-demo }
        cadence: block
        target: { file: index.html, after: "      </section>\n", occurrence: 1 }
        text: "\n      <div class=\"demo tab-demo\" data-testid=\"tab-demo\">\n        <a href=\"#order\" tabindex=\"3\" data-testid=\"demo-three\">tab index 3</a>\n        <span tabindex=\"0\" data-testid=\"demo-zero\">tab index 0</span>\n        <span tabindex=\"-1\" data-testid=\"demo-minus\">tab index -1</span>\n      </div>\n"
      - id: expect-demo-three-first
        type: expect.preview
        at: { mark: after-demo }
        timeoutMs: 5000
        target: { by: testId, value: tab-demo-three }
        attribute: { name: data-order, value: "1" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-seven-stops
        type: expect.preview
        at: { afterAction: expect-demo-three-first }
        timeoutMs: 5000
        target: { by: testId, value: tab-count }
        attribute: { name: data-count, value: "7" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: tab-demo
        type: preview.click
        at: { mark: tab-demo }
        timeoutMs: 5000
        target: { by: testId, value: a11y-tab-next }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-demo-focused
        type: expect.preview
        at: { mark: after-tab-demo }
        timeoutMs: 5000
        target: { by: testId, value: tab-demo-three }
        textContains: '1 link "tab index 3" focused'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-zero-fifth
        type: expect.preview
        at: { mark: explain-zero }
        timeoutMs: 5000
        target: { by: testId, value: tab-demo-zero }
        attribute: { name: data-order, value: "5" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-hide
        type: editor.type
        at: { mark: type-hide }
        cadence: block
        target: { file: index.html, after: '<div class="demo tab-demo"', occurrence: 1 }
        text: " hidden"
      - id: expect-five-again
        type: expect.preview
        at: { mark: after-hide }
        timeoutMs: 5000
        target: { by: testId, value: tab-count }
        attribute: { name: data-count, value: "5" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: card
    narration: >
      [[mark:select-special-2]] အခု ယနေ့ အထူး card ကို ပြန်ကြည့်ရအောင်။ div က မူလက focus မရတဲ့
      element ဖြစ်လို့ Tab နဲ့ ရောက်လို့ မရပါဘူး။ ခလုတ်လို သုံးနေတာ ဖြစ်လို့ အကောင်းဆုံးကတော့ lesson ၃ မှာ လုပ်ခဲ့သလို တကယ့် button element ကို သုံးတာပါ။ ဒီတစ်ခါတော့
      tab index သုည ဘယ်လို အလုပ်လုပ်လဲ မြင်ရအောင် div ကိုပဲ ထားပြီး၊ [[mark:type-card]] button
      ဆိုတဲ့ role နဲ့ tab index သုည ကို ထည့်ပါမယ်။ [[mark:after-card]] card မှာ နံပါတ် လေး
      ဆိုတဲ့ badge ပေါ်လာပြီး၊ panel စာရင်းမှာလည်း role က button၊ name က ယနေ့ အထူး ဆိုပြီး
      ဝင်လာပါပြီ။
      ဒါပေမဲ့ သတိထားရမှာက၊ div ကို focus ရအောင် လုပ်ရုံနဲ့ Enter ဒါမှမဟုတ် Space နှိပ်ရင် အလုပ်
      မလုပ်သေးပါဘူး။ တကယ့် button မှာ browser က အလိုလို ပေးတဲ့ အဲဒီ key တွေကို၊ div မှာတော့
      JavaScript နဲ့ ကိုယ်တိုင် ရေးပေးရပါမယ်။ အဲဒါကို နောက် lesson မှာ ကြည့်ပါမယ်။
    sources:
      - title: "web.dev Learn Accessibility — Keyboard focus: tabindex 0 needs extra keyboard support"
        url: "https://web.dev/learn/accessibility/focus#tabindex"
      - title: "MDN — ARIA: button role (keyboard interactions)"
        url: "https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Roles/button_role"
    actions:
      - id: select-special-2
        type: editor.select
        at: { mark: select-special-2 }
        target: { file: index.html, text: '<div class="menu-card special"', occurrence: 1 }
      - id: type-card
        type: editor.type
        at: { mark: type-card }
        cadence: block
        target: { file: index.html, after: '<div class="menu-card special"', occurrence: 1 }
        text: ' role="button" tabindex="0"'
      - id: expect-card-stop
        type: expect.preview
        at: { mark: after-card }
        timeoutMs: 5000
        target: { by: testId, value: tab-special-card }
        textContains: '4 button "ယနေ့ အထူး'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-six-stops
        type: expect.preview
        at: { afterAction: expect-card-stop }
        timeoutMs: 5000
        target: { by: testId, value: tab-count }
        attribute: { name: data-count, value: "6" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: indicator-board
    chapter: "Focus ကို မြင်ရအောင်"
    narration: >
      [[mark:open-focus-board]] ခုနက Tab နှိပ်တုန်းက focus ဘယ်ရောက်နေလဲ ဆိုတာ panel ရဲ့ badge
      ကနေပဲ သိခဲ့ရပါတယ်။ page ပေါ်မှာတော့ ဘာမှ မမြင်ရပါဘူး။ [[mark:draw-outline-none]] browser
      တိုင်းက focus ရောက်နေတဲ့ element ပတ်လည်မှာ focus ring လို့ ခေါ်တဲ့ ဘောင်ကို default အနေနဲ့
      ဆွဲပေးပါတယ်။ ဒါပေမဲ့ ဒီ page ရဲ့ CSS က အဲဒီ ring ကို မလှဘူး ဆိုပြီး outline none နဲ့
      ဖျောက်ထားပါတယ်။ ring မရှိရင် မျက်စိနဲ့ မြင်ပြီး
      keyboard နဲ့ သုံးတဲ့ အောင်အောင်လို သူတွေက ကိုယ် ဘယ်ရောက်နေလဲ မသိတော့ပါဘူး။
      [[mark:draw-focus-visible]] mouse နဲ့ နှိပ်တဲ့အခါ ring မပေါ်စေချင်လို့ ဖျောက်တာ ဆိုရင်၊ focus
      အစား focus visible ကို သုံးပါ။ focus က focus ရောက်တိုင်း အလုပ်လုပ်ပေမယ့်၊ focus visible ကတော့
      keyboard နဲ့ ရောက်တဲ့အခါလို ring ပြသင့်တယ်လို့ browser က ဆုံးဖြတ်မှပဲ အလုပ်လုပ်ပါတယ်။
      [[mark:draw-contrast]] ကိုယ်ပိုင် ring ကို design လုပ်ရင်တော့ ring ရဲ့ အရောင်နဲ့ ဘေးက နောက်ခံ
      အရောင်ကို အနည်းဆုံး ၃ နဲ့ ၁ ကွာအောင် ထားပါ။ အရောင် တစ်ခုတည်း ပြောင်းတာထက်၊ ဘောင်လို
      ပုံသဏ္ဌာန် တစ်ခု ပေါ်လာတာက ပိုသိသာပါတယ်။ [[mark:draw-wcag]] WCAG ရဲ့ level AA မှာ keyboard focus ကို မြင်ရရမယ်လို့ သတ်မှတ်ထားပြီး၊ WCAG ၂.၂ ရဲ့ စည်းကမ်း အသစ် တစ်ခုက sticky header လို အရာတွေက focus ရောက်နေတဲ့ element ကို အပြည့် မဖုံးရဘူးလို့ ဆိုပါတယ်။
    sources:
      - title: "web.dev Learn Accessibility — Keyboard focus: focus indicator"
        url: "https://web.dev/learn/accessibility/focus#focus_indicator"
      - title: "MDN — :focus-visible"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/:focus-visible"
      - title: "WCAG 2.2 Understanding — Focus Visible"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/focus-visible"
      - title: "WCAG 2.2 Understanding — Non-text Contrast (3:1 for focus indicators)"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/non-text-contrast"
      - title: "WCAG 2.2 Understanding — Focus Not Obscured (Minimum)"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/focus-not-obscured-minimum"
    actions:
      - id: open-focus-board
        type: whiteboard.apply
        at: { mark: open-focus-board }
        open: true
        clear: true
        upsertIds: [f-title]
      - id: draw-outline-none
        type: whiteboard.apply
        at: { mark: draw-outline-none }
        upsertIds: [f-none, f-strike, f-default]
        drawMs: 2000
      - id: draw-focus-visible
        type: whiteboard.apply
        at: { mark: draw-focus-visible }
        upsertIds: [f-visible]
        drawMs: 1200
      - id: draw-contrast
        type: whiteboard.apply
        at: { mark: draw-contrast }
        upsertIds: [f-contrast]
        drawMs: 1200
      - id: draw-wcag
        type: whiteboard.apply
        at: { mark: draw-wcag }
        upsertIds: [f-wcag1, f-wcag2]
        drawMs: 1600

  - id: indicator-fix
    narration: >
      [[mark:close-focus-board]] ring ကို ပြန်ထည့်ကြည့်ရအောင်။ [[mark:open-styles-2]] CSS ဖိုင်ကို ဖွင့်ပါမယ်။
      [[mark:type-ring]] focus visible ဖြစ်တဲ့ element အားလုံးကို ဆိုင်ရဲ့ အညိုရင့်ရောင် outline ထူထူ
      ပေးပြီး၊ element နဲ့ နည်းနည်း ခွာထားပါမယ်။ ခရင်မ်ရောင် နောက်ခံနဲ့ဆိုရင် ၁၃ နဲ့ ၁ ကျော် ကွာပါတယ်။ [[mark:type-ring-header]] header ရဲ့ နောက်ခံကတော့ အညိုရင့် ဖြစ်နေလို့၊ header ထဲက element တွေနဲ့ နောက်မှ ထည့်မယ့် skip link မှာတော့ ring ကို ခရင်မ်ရောင် ပြောင်းပေးပါမယ်။ [[mark:tab-ring]]
      Tab ကို နှိပ်ကြည့်ရအောင်။ [[mark:after-tab-ring]] မီနူး link ပတ်လည်မှာ ခရင်မ်ရောင် ring
      ပေါ်လာပါပြီ။ [[mark:tab-r2]] ဆက်နှိပ်ရင် ဖွင့်ချိန်ကို ရောက်ပြီး၊ [[mark:tab-r3]] နောက်တစ်ချက်မှာ မှာယူရန်ကို
      ရောက်ပါတယ်။ [[mark:tab-r4]] ပြီးတော့ ယနေ့ အထူး card ကို ရောက်ပါတယ်။ [[mark:after-r4]] card ပတ်လည်မှာ အညိုရင့်ရောင်
      ring ပေါ်နေတာကို ကြည့်ပါ။ အခုဆိုရင် အောင်အောင်က page ပေါ်မှာတင် ကိုယ် ဘယ်ရောက်နေလဲ မြင်ရပါပြီ။
    sources:
      - title: "web.dev Learn Accessibility — Keyboard focus: custom styles"
        url: "https://web.dev/learn/accessibility/focus#custom_styles"
      - title: "MDN — outline-offset"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/outline-offset"
      - title: "W3C Technique C40 — Creating a two-color focus indicator"
        url: "https://www.w3.org/WAI/WCAG22/Techniques/css/C40"
    actions:
      - id: close-focus-board
        type: whiteboard.apply
        at: { mark: close-focus-board }
        open: false
      - id: open-styles-2
        type: workspace.openFile
        at: { mark: open-styles-2 }
        path: styles.css
      - id: type-ring
        type: editor.type
        at: { mark: type-ring }
        cadence: fast-explainer
        target: { file: styles.css, after: "  justify-content: flex-end;\n}\n", occurrence: 1 }
        text: "\n:focus-visible {\n  outline: 3px solid var(--tea-dark);\n  outline-offset: 2px;\n}\n"
      - id: type-ring-header
        type: editor.type
        at: { mark: type-ring-header }
        cadence: block
        target: { file: styles.css, after: "  outline-offset: 2px;\n}\n", occurrence: 1 }
        text: "\n.site-header :focus-visible,\n.skip-link:focus-visible {\n  outline-color: var(--cream);\n}\n"
      - id: tab-ring
        type: preview.click
        at: { mark: tab-ring }
        timeoutMs: 5000
        target: { by: testId, value: a11y-tab-next }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-ring-menu
        type: expect.preview
        at: { mark: after-tab-ring }
        timeoutMs: 5000
        target: { by: testId, value: tab-nav-drinks }
        textContains: '1 link "မီနူး" focused'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: tab-r2
        type: preview.click
        at: { mark: tab-r2 }
        timeoutMs: 5000
        target: { by: testId, value: a11y-tab-next }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: tab-r3
        type: preview.click
        at: { mark: tab-r3 }
        timeoutMs: 5000
        target: { by: testId, value: a11y-tab-next }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: tab-r4
        type: preview.click
        at: { mark: tab-r4 }
        timeoutMs: 5000
        target: { by: testId, value: a11y-tab-next }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-ring-card
        type: expect.preview
        at: { mark: after-r4 }
        timeoutMs: 5000
        target: { by: testId, value: tab-special-card }
        textContains: '2,500 ကျပ်" focused'
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: skip-link
    chapter: "Skip link"
    narration: >
      အခု keyboard သုံးတဲ့သူက page ကို ဖွင့်လိုက်တိုင်း၊ main content ကို
      ရောက်ဖို့ nav link တွေကို Tab နဲ့ အရင် ဖြတ်သွားရပါတယ်။ တကယ့် website တွေမှာ menu link အများကြီး ရှိတတ်လို့ page တိုင်းမှာ ဖြတ်ရတာ ပင်ပန်းပါတယ်။ ဒါကြောင့် main content ဆီ တန်းခုန်သွားတဲ့ skip link ကို page ရဲ့ ပထမဆုံး
      focus ရနိုင်တဲ့ element အဖြစ် ထည့်လေ့ ရှိပါတယ်။ [[mark:open-index-3]] HTML ဖိုင်ကို
      ပြန်ဖွင့်ပြီး၊ [[mark:type-skip]] body ရဲ့ အစမှာ main element ရဲ့ id ကို ညွှန်တဲ့ link တစ်ခု
      ထည့်ပါမယ်။ [[mark:after-skip]] page ပေါ်မှာတော့
      ဘာမှ ပြောင်းမသွားသလိုပါပဲ။ CSS က ဒီ link ကို focus မရခင် screen အပြင်ဘက်မှာ ထားထားလို့ပါ။
      ဒါပေမဲ့ panel စာရင်းမှာ နံပါတ် တစ် အဖြစ် ဝင်လာပါပြီ။ [[mark:tab-skip]] Tab ကို
      နှိပ်ကြည့်ရအောင်။ [[mark:after-tab-skip]] page ရဲ့ ဘယ်ဘက် အပေါ်ထောင့်မှာ skip link ပေါ်လာပြီး၊
      ring လည်း ပါပါတယ်။ ဒီအချိန် Enter နှိပ်ရင် main content ကို တန်း ခုန်သွားပြီး၊ နောက် Tab က
      main ထဲကနေ ဆက်သွားပါတယ်။
    sources:
      - title: "web.dev Learn Accessibility — Keyboard focus: skip links"
        url: "https://web.dev/learn/accessibility/focus#skip_links"
      - title: "WebAIM — Skip Navigation Links"
        url: "https://webaim.org/techniques/skipnav/"
      - title: "WCAG 2.2 Understanding — Bypass Blocks"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/bypass-blocks"
    actions:
      - id: open-index-3
        type: workspace.openFile
        at: { mark: open-index-3 }
        path: index.html
      - id: type-skip
        type: editor.type
        at: { mark: type-skip }
        cadence: block
        target: { file: index.html, after: "  <body>\n", occurrence: 1 }
        text: "    <a class=\"skip-link\" href=\"#main\" data-testid=\"skip-link\">အဓိက အကြောင်းအရာသို့</a>\n\n"
      - id: expect-skip-first
        type: expect.preview
        at: { mark: after-skip }
        timeoutMs: 5000
        target: { by: testId, value: tab-skip-link }
        attribute: { name: data-order, value: "1" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-seven-final
        type: expect.preview
        at: { afterAction: expect-skip-first }
        timeoutMs: 5000
        target: { by: testId, value: tab-count }
        attribute: { name: data-count, value: "7" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: tab-skip
        type: preview.click
        at: { mark: tab-skip }
        timeoutMs: 5000
        target: { by: testId, value: a11y-tab-next }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-skip-focused
        type: expect.preview
        at: { mark: after-tab-skip }
        timeoutMs: 5000
        target: { by: testId, value: tab-skip-link }
        textContains: '1 link "အဓိက အကြောင်းအရာသို့" focused'
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ Tab အစဉ်က HTML ထဲက အစဉ်ကို လိုက်တဲ့အတွက် CSS နဲ့ မြင်ရတဲ့ အစဉ်ကို
      မလှန်ရပါဘူး။ tab index သုည က focus မရတဲ့ element ကို အစဉ်ထဲ ထည့်ပေးပြီး၊ အနှုတ် တစ်
      ကတော့ JavaScript ကနေပဲ focus ပေးဖို့ပါ။ အပေါင်း တန်ဖိုးကိုတော့ မသုံးပါနဲ့။
      focus ring ကို အစားထိုး မပေးဘဲ ဘယ်တော့မှ မဖျောက်ပါနဲ့၊ focus visible နဲ့ နောက်ခံကနေ
      ထင်ရှားတဲ့ ring ကို ပေးပါ။ [[mark:recap-skip]] skip link ကလည်း menu တွေကို ကျော်ပြီး main content ဆီ တန်း ပို့ပေးပါတယ်။ ကိုယ့် website မှာ mouse ကို ဘေးချထားပြီး၊ Tab key နဲ့ပဲ အစကနေ
      အဆုံးထိ သုံးကြည့်ပါ။ နောက် lesson မှာတော့ JavaScript နဲ့ ပြောင်းလဲသွားတဲ့ အရာတွေကို
      accessible ဖြစ်အောင် ဘယ်လို လုပ်မလဲ ဆိုတာ ကြည့်သွားပါမယ်။
    sources:
      - title: "web.dev Learn Accessibility — Keyboard focus"
        url: "https://web.dev/learn/accessibility/focus"
      - title: "web.dev Learn Accessibility — JavaScript (next lesson)"
        url: "https://web.dev/learn/accessibility/javascript"
    actions:
      - id: select-final-skip
        type: editor.select
        at: { mark: recap-skip }
        target: { file: index.html, text: '<a class="skip-link" href="#main"', occurrence: 1 }
      - id: expect-file-skip
        type: expect.file
        at: { afterAction: select-final-skip }
        path: index.html
        contains: '<a class="skip-link" href="#main" data-testid="skip-link">အဓိက အကြောင်းအရာသို့</a>'
      - id: expect-file-card
        type: expect.file
        at: { afterAction: expect-file-skip }
        path: index.html
        contains: '<div class="menu-card special" role="button" tabindex="0"'
      - id: expect-file-hidden
        type: expect.file
        at: { afterAction: expect-file-card }
        path: index.html
        contains: '<div class="demo tab-demo" hidden'
      - id: expect-file-ring
        type: expect.file
        at: { afterAction: expect-file-hidden }
        path: styles.css
        contains: "outline: 3px solid var(--tea-dark);"
      - id: expect-file-header-ring
        type: expect.file
        at: { afterAction: expect-file-ring }
        path: styles.css
        contains: ".skip-link:focus-visible {"

checks:
  - { type: timing.p95Ms, max: 300 }
