# Accessibility course, lesson 8: keyboard focus — who uses the keyboard,
# focus order vs visual order, tab index values, the focus indicator and a
# skip link.
#
# Hands-on (WebContainer + accessibility panel, tabs mode: badges + ordered
# list). Studio cannot press keys, so Tab presses are preview.click on the
# panel's hidden a11y-tab-next control (narrated as pressing Tab). Start state
# (base.css section E, never shown): the nav is pushed right with
# flex-direction: row-reverse (visual order runs against the Tab order) and
# `:focus { outline: none }` removes every focus ring; the "today's special"
# card is a clickable div with no tab stop; there is no skip link.
# Insert-only tactics: the nav order and the ring are fixed by later rules in
# styles.css (keystroke-typed, no reload); the tab index values are shown in a
# clearly labelled demo strip that the lesson inserts, walks with Tab, then
# hides with `hidden`; the card gets role + tabindex 0; the skip link is a
# block insert at the start of <body>.
#
# Built from template.yaml + ws/ with `bun ../a11y-course-07-document/build.ts .`
# Validate with (from the repo root):
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   ~/Documents/a11y-course-work/tools/verify.sh <this file>
