build:
  # Studio swaps in the Burmese voice chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 2615

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: hook
    chapter: SRE နှစ်ယောက်နဲ့ rotation မဖြစ်သေး
    narration: >
      [[mark:show-p01]] ကိုဇော် အလုပ်စတဲ့ တနင်္လာနေ့မှာ သူ့အတွက် action တွေနဲ့ ရေးထားတဲ့ on-call checklist ရှိနေပြီး ကိုအောင်နဲ့ တွဲလုပ်ဖို့လည်း စီစဉ်ထားပါတယ်။ အခု Padauk မှာ Site Reliability Engineer၊ SRE နှစ်ယောက် ဖြစ်လာပါပြီ။ ဒီ နှစ်ယောက်ကို ဘယ်မှာ ထားပြီး ဘာတွေကို တာဝန်ယူခိုင်းမလဲ?
      [[mark:show-p01b]] ပြဿနာက နှစ်ယောက်တည်း on-call ယူရင် တစ်ယောက်ချင်း တစ်ပတ်ခြား ကျပြီး ညတွေရဲ့ တစ်ဝက်ကို page စောင့်ရင်း အိပ်ရမှာပါ။ တစ်ယောက် ခွင့်ယူတာနဲ့ ကျန်တစ်ယောက်က အကုန် ယူရလို့ on-call ကို အလှည့်ကျ ခွဲယူတဲ့ rotation တစ်ခု မဖြစ်သေးပါဘူး။ ဒါကြောင့် အချိန်ပြည့် SRE ဖြစ်ကတည်းက မသီရိ တစ်ရက်မှ ခွင့် မယူနိုင်သေးပါဘူး။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE at Google: How to structure your SRE team (Google Cloud Blog)",
          url: "https://cloud.google.com/blog/products/devops-sre/how-sre-teams-are-organized-and-how-to-get-started",
        }
      - {
          title: "Workbook: SRE Team Lifecycles",
          url: "https://sre.google/workbook/team-lifecycles/",
        }
    actions:
      # -1750 / -1450, as Module 1: a pull-back over 1780 ms pushes the first dialog
      # past the 2 s opening handle, which src/studio/plans/index.test.ts rejects.
      - { id: collapse-dock, type: runtime.collapseDock, at: { scene: start, offsetMs: -1750 } }
      - {
          id: show-p01,
          type: slide.show,
          at: { mark: show-p01, offsetMs: -1450 },
          slideId: l15-p01,
        }
      # The voice script's own continuation page: why two people are not a rotation.
      - { id: show-p01b, type: slide.show, at: { mark: show-p01b }, slideId: l15-p01b }

  - id: where-the-pain-is
    chapter: ဝန် ဘယ်မှာ များလဲ
    narration: >
      [[mark:close-p01b]] [[mark:b1-s1]] မသီရိက ဝန် ဘယ်မှာ များနေလဲ အရင် တိုင်းပါတယ်။ နှစ်ပတ် sprint တစ်ခုမှာ page ဖြေတာ၊ ticket ရှင်းတာလို production အလုပ်ထဲ နာရီ ဘယ်လောက် ကုန်လဲ မှတ်ခိုင်းတော့ developer တစ်ယောက်ရဲ့ နာရီ ၈၀ ထဲက ပျမ်းမျှ Wallet မှာ ၃၀ နာရီ၊ Top-up မှာ ၂၆ နာရီ၊ Eats မှာ ၈ နာရီ ကုန်နေပါတယ်။
      [[mark:b1-s2]] အဲဒီ နာရီ အများစုက လက်နဲ့ ထပ်ခါထပ်ခါ လုပ်ရပြီး ရေရှည် တန်ဖိုး မပေးတဲ့ toil ပါ။ တစ်ပတ်ချင်း နည်းနည်းစီ တိုးလာလို့ အကျင့်ပါသွားပြီး ဘယ်သူမှ သတိမထားမိခဲ့ပါဘူး။ Padauk က sprint ရဲ့ လေးပုံတစ်ပုံ၊ နာရီ ၂၀ မှာ မျဉ်း ဆွဲပြီး အဲဒီထက် ကျော်ရင် အဖွဲ့ကိုယ်တိုင် on-call ယူတာနဲ့ မနိုင်တော့ဘူးလို့ သဘောတူထားပါတယ်။
      [[mark:b1-s3]] Wallet နဲ့ Top-up က မျဉ်းကို ကျော်နေပါတယ်။ ကိုယ်ရေးတဲ့ service ကို ကိုယ်တိုင် on-call ယူတဲ့ you build it, you run it ပုံစံက service ငယ်တုန်း ကောင်းပေမဲ့ ဒီ နှစ်ခုကတော့ အဲဒီ ပုံစံထက် ကြီးလာပါပြီ။ feature ဦးစားပေးတွေ ပြောင်းနေတဲ့ကြားက reliability ကို အာရုံ မပျက်ဘဲ လုပ်မယ့် သီးသန့် အဖွဲ့ လိုလာပါပြီ။ Eats ကတော့ ၈ နာရီပဲ ဆိုတော့ အဆင်ပြေပုံ ရပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE at Google: How to structure your SRE team (Google Cloud Blog)",
          url: "https://cloud.google.com/blog/products/devops-sre/how-sre-teams-are-organized-and-how-to-get-started",
        }
      - {
          title: "Workbook: SRE Team Lifecycles",
          url: "https://sre.google/workbook/team-lifecycles/",
        }
    actions:
      - { id: close-p01b, type: slide.close, at: { mark: close-p01b, offsetMs: -400 } }
      # The title and axis are furniture (no drawMs); the bars draw in after them.
      - {
          id: b1-s1,
          type: whiteboard.apply,
          at: { mark: b1-s1 },
          open: true,
          clear: true,
          upsertIds: [l15-b1-title, l15-b1-axis],
        }
      - id: b1-s1-draw
        type: whiteboard.apply
        at: { afterAction: b1-s1 }
        upsertIds:
          [l15-b1-wallet, l15-b1-wallet-t, l15-b1-topup, l15-b1-topup-t, l15-b1-eats, l15-b1-eats-t]
        drawMs: 2400
      - {
          id: b1-s2,
          type: whiteboard.apply,
          at: { mark: b1-s2 },
          upsertIds: [l15-b1-limit, l15-b1-limit-t1, l15-b1-limit-t2],
          drawMs: 1400,
        }
      - {
          id: b1-s3,
          type: whiteboard.apply,
          at: { mark: b1-s3 },
          upsertIds: [l15-b1-outgrew],
          drawMs: 1200,
        }

  - id: slider
    chapter: Centralized နဲ့ embedded
    narration: >
      [[mark:close-b1]] [[mark:b2-s1]] ဒါဆို ဒီ အဖွဲ့ကို ဘယ်မှာ ထားမလဲ? ထားနိုင်တဲ့ နေရာတွေကို slider တစ်ခုလို ကြည့်နိုင်ပါတယ်။ တစ်ဖက်စွန်းက SRE အားလုံးကို အဖွဲ့ တစ်ခုတည်းမှာ စုပြီး စံ တစ်ခုတည်းနဲ့ ကူတဲ့ centralized ပုံစံ၊ နောက်တစ်ဖက်စွန်းက SRE တွေကို product အဖွဲ့ထဲ ထည့်ပြီး နေ့တိုင်း အတူ လုပ်လို့ product ကို နက်နက် သိတဲ့ embedded ပုံစံပါ။
      [[mark:b2-s2]] ကုမ္ပဏီ အများစုကတော့ ကြားထဲက နှစ်မျိုး ရောထားတဲ့ hybrid မှာ ရှိကြပါတယ်။ ဘယ်နေရာ ရွေးလဲ ဆိုတာက နှစ်နဲ့ချီ သက်ရောက်ပါတယ်၊ system ပုံစံဟာ ဆောက်တဲ့ အဖွဲ့တွေ ဆက်သွယ်ပုံအတိုင်း ထွက်လာတတ်လို့ပါ။ ဒါကို Conway's law လို့ ခေါ်ပါတယ်။ ဥပမာ Eats နဲ့ Wallet အဖွဲ့ တစ်ခါမှ စကား မပြောဖူးလို့ ငွေချေတဲ့ retry code ကို Eats က ကိုယ့်ဘာသာ ထပ်ရေးထားပါတယ်။
      [[mark:b2-s3]] အဖွဲ့တွေက ရွေးထားတဲ့ နေရာကနေ တဖြည်းဖြည်း လွင့်သွားတတ်ပြီး Eats ရဲ့ ၈ နာရီ နောက်ကွယ်မှာလည်း ဒါ ဖြစ်နေတာပါ။ Eats က SRE အကူအညီကို နှစ်ပတ် စောင့်ပေမဲ့ မရတော့ ops လူ တစ်ယောက်ကို တိတ်တိတ်လေး ခန့်ပြီး monitoring tool နောက်တစ်ခုလည်း ဝယ်ထားပါတယ်။ production အလုပ်ကို အဲဒီလူက ယူထားလို့ နာရီ နည်းနေတာပါ။
      [[mark:b2-s4]] တရားဝင် အကူအညီ နှေးလို့ ဘယ်သူနဲ့မှ မညှိဘဲ ကိုယ်ပိုင် လူ၊ ကိုယ်ပိုင် tool တွေနဲ့ လုပ်တဲ့အထိ လွင့်သွားရင် အဲဒီ reliability အလုပ်ကို shadow SRE လို့ ခေါ်ပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE at Google: How to structure your SRE team (Google Cloud Blog)",
          url: "https://cloud.google.com/blog/products/devops-sre/how-sre-teams-are-organized-and-how-to-get-started",
        }
      - {
          title: "Workbook: Organizational Change Management in SRE",
          url: "https://sre.google/workbook/organizational-change/",
        }
      - {
          title: "Melvin Conway: Conway's Law",
          url: "https://www.melconway.com/Home/Conways_Law.html",
        }
    actions:
      # ⟪close board⟫ into the next board: wipe B1 400 ms early, keep the panel open.
      - {
          id: close-b1,
          type: whiteboard.apply,
          at: { mark: close-b1, offsetMs: -400 },
          clear: true,
        }
      - id: b2-s1
        type: whiteboard.apply
        at: { mark: b2-s1 }
        open: true
        clear: true
        upsertIds: [l15-b2-slider, l15-b2-left1, l15-b2-left2, l15-b2-right1, l15-b2-right2]
        drawMs: 2000
      - {
          id: b2-s2,
          type: whiteboard.apply,
          at: { mark: b2-s2 },
          upsertIds: [l15-b2-knob, l15-b2-hybrid, l15-b2-conway],
          drawMs: 1800,
        }
      - {
          id: b2-s3,
          type: whiteboard.apply,
          at: { mark: b2-s3 },
          upsertIds: [l15-b2-arrow, l15-b2-eats, l15-b2-eats1, l15-b2-eats2],
          drawMs: 2000,
        }
      - {
          id: b2-s4,
          type: whiteboard.apply,
          at: { mark: b2-s4 },
          upsertIds: [l15-b2-shadow1, l15-b2-shadow2],
          drawMs: 1200,
        }

  - id: central-vs-embedded
    narration: >
      [[mark:close-b2]] [[mark:show-p02]] centralized အဖွဲ့က စံ တစ်ခုတည်းနဲ့ ညီညွတ်ပေမဲ့ product တွေနဲ့ ဝေးလာရင် ticket ဖြေပေးရုံ ကောင်တာ ဖြစ်သွားတတ်ပါတယ်။ embedded SRE က product ကို နက်နက် သိပေမဲ့ အဖွဲ့တိုင်း ကိုယ့် tool ကိုယ် ဆောက်လို့ tool တွေ ထပ်တတ်ပါတယ်။ hybrid ကတော့ centralized အဖွဲ့ရဲ့ အကူအညီနဲ့ အရေးကြီးတဲ့ product အတွက် သီးသန့် SRE တွေကို ပေါင်းထားတာပါ။
      [[mark:show-p02b]] ယုံကြည်မှု ဒါမှမဟုတ် senior SRE နည်းသေးရင် centralized က ပိုသင့်တော်ပြီး embedded ကတော့ နှစ်ဘက်စလုံး ယုံကြည်ပြီး senior လုံလောက်မှ အလုပ်ဖြစ်ပါတယ်။ CTO ကိုနေလင်းက နောက်တစ်ယောက် ခန့်ခွင့် ပေးလို့ SRE သုံးယောက် ဖြစ်လာပေမဲ့ product အဖွဲ့တွေထဲ ခွဲထည့်ရင် တစ်ယောက်ချင်း တစ်ယောက်တည်း ပြန်ဖြစ်မှာမို့ Padauk က အဖွဲ့ တစ်ခုတည်း စုပြီး Wallet နဲ့ Top-up ကို အာရုံစိုက်တဲ့ hybrid ကို ရွေးပါတယ်။
      [[mark:show-p02c]] အလယ်မှာ ထိန်းထားဖို့ Padauk က အဖွဲ့တိုင်းကနေ reliability စိတ်ဝင်စားသူတွေ လတိုင်း စုတွေ့တဲ့ အုပ်စု တစ်ခု စပြီး အဲဒီ အလုပ်ကို ရာထူးတိုးတဲ့အခါ ထည့်တွက်ပါတယ်။ SRE ဆီ အကူအညီ တောင်းတဲ့ လမ်း တစ်ခုတည်း ထားပြီး အဖွဲ့ကြား plan တွေ ရွေ့နေအောင် တာဝန်ယူမယ့်သူ တစ်ယောက်လည်း ထားပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE at Google: How to structure your SRE team (Google Cloud Blog)",
          url: "https://cloud.google.com/blog/products/devops-sre/how-sre-teams-are-organized-and-how-to-get-started",
        }
      - {
          title: "Workbook: SRE Team Lifecycles",
          url: "https://sre.google/workbook/team-lifecycles/",
        }
    actions:
      - {
          id: close-b2,
          type: whiteboard.apply,
          at: { mark: close-b2, offsetMs: -400 },
          open: false,
        }
      - { id: show-p02, type: slide.show, at: { mark: show-p02 }, slideId: l15-p02 }
      # The voice script's continuation pages: Padauk's choice, then holding the middle.
      - { id: show-p02b, type: slide.show, at: { mark: show-p02b }, slideId: l15-p02b }
      - { id: show-p02c, type: slide.show, at: { mark: show-p02c }, slideId: l15-p02c }

  - id: ops-limits
    chapter: Ops အလုပ်ကို ကန့်သတ်
    narration: >
      [[mark:show-p03]] ဘယ်မှာ ထားထား ops အလုပ်ကိုတော့ ကန့်သတ်ရပါမယ်။ on-call၊ ticket နဲ့ toil လို ops အလုပ်က အဖွဲ့ရဲ့ အချိန် တစ်ဝက်ထက် မကျော်ရဘဲ အနည်းဆုံး တစ်ဝက်ကို engineering အတွက် ထားရပါတယ်။ on-call ကတော့ တစ်ယောက်ချင်းရဲ့ အချိန် လေးပုံတစ်ပုံထက် မကျော်ရပါဘူး။ ဒါတွေက ပန်းတိုင် မဟုတ်ဘဲ မကျော်ရမယ့် မျဉ်းပါ၊ ကျန်းမာတဲ့ အဖွဲ့တွေက အများကြီး အောက်မှာ ရှိပါတယ်။ ဒီ မျဉ်းအောက်မှာ နေနိုင်ဖို့ ရုံး တစ်ခုတည်းကနေ ညတွေပါ ယူတဲ့ rotation မှာ လူ ၈ ယောက်လောက် လိုပါတယ်။
      [[mark:show-p03b]] SRE သုံးယောက်တည်းဆိုရင် တစ်ယောက်ချင်း သုံးပတ်မှာ တစ်ပတ် ကျလို့ လေးပုံတစ်ပုံ ကျော်ပါတယ်။ ဒါကြောင့် ကိုယ်ရေးတဲ့ code ကို အသိဆုံး ဖြစ်တဲ့ Wallet နဲ့ Top-up developer ငါးယောက်က rotation ထဲ ဝင်လာပါတယ်။ on-call ကျသူက အဲဒီ အပတ်ရဲ့ ops အလုပ် အကုန် ယူနိုင်ရင် ops က ၈ ယောက်မှာ တစ်ယောက်စာလောက်ပဲ ရှိပါတော့မယ်။
      [[mark:show-p03c]] မသီရိက အဖွဲ့ ဘာအတွက် ရှိလဲ၊ ဘာကို ပိုင်လဲ၊ အောင်မြင်ရင် ဘယ်လို သိမလဲ ဆိုတာကို charter အဖြစ် ရေးပါတယ်။ ရည်ရွယ်ချက်က user တွေ Wallet နဲ့ Top-up ကို ယုံလို့ရအောင်ပါ။ နယ်ပယ်က service အဟောင်းတွေ မဟုတ်ဘဲ ဆောက်နေဆဲ Wallet နဲ့ Top-up ပါ၊ Eats ကတော့ SRE ဆောက်ပေးတဲ့ tool တွေနဲ့ ကိုယ့် on-call ကို ကိုယ် ဆက်ယူပါတယ်။ အောင်မြင်မှုကို ရက်စွဲနဲ့ ရေးပါတယ်၊ ဥပမာ သီတင်းကျွတ်မှာ မသီရိ တစ်ပတ်လုံး ခွင့်ယူပြီး page တစ်ခုမှ မရောက်ရဘူး ဆိုတာမျိုးပါ။
    sources:
