      notes.md: |
        # SRE အဖွဲ့ကို ဘယ်မှာ ထားမလဲ

        - Conway's law — system ပုံစံက ဆောက်တဲ့ အဖွဲ့တွေ ဆက်သွယ်ပုံအတိုင်း ထွက်လာ
        - charter — ရည်ရွယ်ချက်၊ နယ်ပယ်၊ ရက်စွဲပါတဲ့ အောင်မြင်မှု
        - ops အလုပ် ကန့်သတ်ချက် — engineering အနည်းဆုံး တစ်ဝက်၊ on-call အများဆုံး လေးပုံတစ်ပုံ၊ ပန်းတိုင် မဟုတ်
        - shadow SRE — တရားဝင် အကူအညီ နှေးလို့ ပေါ်လာတဲ့ ကိုယ်ပိုင် ops လူနဲ့ tool
        - scorecard — ကျန်းမာရေးကို ကိန်းဂဏန်း အနည်းငယ်နဲ့ ပြ
        - Goodhart's law — ပစ်မှတ် ဖြစ်သွားတဲ့ ကိန်းဂဏန်းက အခြေအနေကို မပြတော့

        မေးခွန်း: ရုံး တစ်ခုတည်းက 5 ယောက်က ညတွေကိုပါ on-call ယူနေတယ်။ ဘာ အကြံပေးမလဲ?
