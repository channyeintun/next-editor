  - id: scorecards
    chapter: Scorecard
    narration: >
      [[mark:close-b3]] [[mark:show-p05]] ကိုနေလင်းက အဖွဲ့တိုင်းရဲ့ service level objective ခေါ် SLO ပစ်မှတ်တွေ၊ incident နဲ့ page အရေအတွက်ကို ပြတဲ့ scorecard ကို လတိုင်း ကြည့်ပါတယ်။ scorecard က ခံစားချက်ကို လူတိုင်း တူတူ ဖတ်တဲ့ ကိန်းဂဏန်း ဖြစ်စေလို့ ငြင်းခုံစရာ မလိုတော့ပါဘူး၊ မတိုင်ထားရင်တော့ ဘယ်သူမှ မကြည့်တဲ့ အရာက မသိမသာ ဆိုးလာတတ်ပါတယ်။ [[mark:scorecards-proxy]] ဒါပေမဲ့ ကိန်းဂဏန်းက တကယ့် ကျန်းမာရေးကို အစားထိုး တိုင်းထားတာမို့ ပြဿနာ မပြင်ဘဲ ကိန်းဂဏန်းကိုပဲ လှအောင် လုပ်လို့ရပါတယ်။ ranking က ပြဿနာကိုတောင် ဖုံးတတ်ပါတယ်။
      [[mark:show-p05b]] ဥပမာ Padauk က incident အနည်းဆုံး အဖွဲ့ကို ထိပ်ဆုံး ထားတဲ့ လစဉ် ranking ကို ပြလိုက်တော့ နောက်လမှာ အဖွဲ့ တစ်ဖွဲ့ရဲ့ incident က လေးခုကနေ သုည ဖြစ်သွားပါတယ်။ ဒါပေမဲ့ support lead မစုဆီ ရောက်တဲ့ complaint တွေကတော့ တက်လာပါတယ်၊ incident သေးသေးလေးတွေကို ကြေညာတာ ရပ်လိုက်လို့ပါ။ ကိန်းဂဏန်း တစ်ခုကို ပစ်မှတ် လုပ်လိုက်တာနဲ့ လူတွေက အဲဒီ ကိန်းဂဏန်းကိုပဲ လိုက်ပြင်လို့ တကယ့် အခြေအနေကို မပြတော့တာကို Goodhart's law လို့ ခေါ်ပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - { title: "DORA Quick Check", url: "https://dora.dev/quickcheck/" }
      - {
          title: "Workbook: Organizational Change Management in SRE",
          url: "https://sre.google/workbook/organizational-change/",
        }
    actions:
      - {
          id: close-b3,
          type: whiteboard.apply,
          at: { mark: close-b3, offsetMs: -400 },
          open: false,
        }
      - { id: show-p05, type: slide.show, at: { mark: show-p05 }, slideId: l15-p05 }
      # The ranking that backfired, as the narration tells it.
      - { id: show-p05b, type: slide.show, at: { mark: show-p05b }, slideId: l15-p05b }

  - id: review-rule
    chapter: Padauk ရဲ့ review စည်းကမ်း
    narration: >
      [[mark:show-p06]] ဒါကြောင့် Padauk က scorecard ကို ဆက်ထားပေမဲ့ ranking ကို ဖြုတ်ပြီး review စည်းကမ်း တစ်ခု ထားပါတယ်။ ကိန်းဂဏန်းက စကား စဖို့ပဲ ဖြစ်ပြီး နောက်ကွယ်က အကြောင်းကို အဖွဲ့ကိုယ်တိုင် ရှင်းပြပါတယ်၊ ဘယ်အဖွဲ့ကိုမှ အဆင့် မစီပါဘူး။ DevOps Research and Assessment၊ DORA ရဲ့ သုတေသနကလည်း delivery ကိန်းဂဏန်းတွေနဲ့ အဖွဲ့တွေကို အချင်းချင်း မနှိုင်းယှဉ်ဖို့ သတိပေးထားပါတယ်။
      [[mark:show-p06b]] review မှာ လူတွေ ပြောရဲလာတော့ incident ဖုံးခဲ့တဲ့ အဖွဲ့ဟာ အသေးလေးတွေကို ပြန်ကြေညာလာပါတယ်။ SRE ကို ဘယ်မှာ ထားလဲ ဆိုတဲ့ ဖွဲ့စည်းပုံနဲ့ သတင်းဆိုးကို ဘယ်လို ဆက်ဆံလဲ ဆိုတဲ့ ယဉ်ကျေးမှုက တစ်ခုကို တစ်ခု အားပေးပါတယ်၊ ဒါကြောင့် ဘယ် ကိန်းဂဏန်းထက်မဆို ပြောရဲတဲ့ review က ပိုအရေးကြီးပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "DORA's software delivery performance metrics (dora.dev)",
          url: "https://dora.dev/guides/dora-metrics-four-keys/",
        }
      - {
          title: "Workbook: Organizational Change Management in SRE",
          url: "https://sre.google/workbook/organizational-change/",
        }
    actions:
      - { id: show-p06, type: slide.show, at: { mark: show-p06 }, slideId: l15-p06 }
      # Structure and culture feed each other.
      - { id: show-p06b, type: slide.show, at: { mark: show-p06b }, slideId: l15-p06b }

  - id: this-week
    narration: >
      [[mark:show-p07]] ကိုယ့်အဖွဲ့ကို ပြန်မဖွဲ့ခင် ဒီအပတ် အရင် လုပ်ကြည့်သင့်တာ သုံးခုပါ။ အဖွဲ့ ဘာအတွက် ရှိလဲ၊ ဘယ် service တွေ ပိုင်လဲ၊ ဘယ်လိုဆိုရင် အောင်မြင်လဲ ဆိုတာကို သုံးကြောင်းနဲ့ charter ရေးကြည့်ပါ။ နောက် sprint မှာ production အလုပ် နာရီကို တိုင်းကြည့်ပါ။ ပြီးတော့ တိုင်းနေတဲ့ ကိန်းဂဏန်း တစ်ခုကို ပြဿနာ မပြင်ဘဲ လှအောင် လုပ်လို့ရလား စစ်ကြည့်ပါ။
    sources:
