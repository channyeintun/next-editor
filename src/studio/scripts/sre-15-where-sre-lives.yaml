  - id: canary
    chapter: အဖွဲ့ကို canary လို ပြောင်း
    narration: >
      [[mark:show-p04]] အဖွဲ့ ဖွဲ့ပုံ ပြောင်းတာကိုလည်း version အသစ်ကို user နည်းနည်းဆီ အရင် ပို့ပြီး ကောင်းမှ ဆက်ဖြန့်တဲ့ canary လို လုပ်ပါတယ်။ Wallet နဲ့ Top-up က အရင် စပြီး incident တွေနဲ့ လစဉ် စစ်တမ်းကို ကြည့်ပြီး အလုပ်ဖြစ်မှ ချဲ့ပါမယ်။ ပထမ လတွေမှာ ပိုဆိုးသလို ဖြစ်မယ်လို့လည်း ကြိုမျှော်ထားပါတယ်။ လူတွေ context ပျောက်တတ်ပြီး Viber ကနေ မသီရိကို တိုက်ရိုက် မေးတဲ့ အကျင့်လည်း ချက်ချင်း မပျောက်လို့ပါ။ အဖွဲ့ ပြန်ဖွဲ့တာက အချိန် တကယ် ကုန်ပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Workbook: Organizational Change Management in SRE",
          url: "https://sre.google/workbook/organizational-change/",
        }
    actions:
      - { id: show-p04, type: slide.show, at: { mark: show-p04 }, slideId: l15-p04 }

  - id: how-much-help
    chapter: Service တစ်ခုကို ဘယ်လောက် ကူမလဲ
    narration: >
      [[mark:close-p04]] [[mark:b3-s1]] ဘာလို့ Wallet နဲ့ Top-up ကိုပဲ ကူတာလဲလို့ တခြား အဖွဲ့တွေက မေးလာပါတယ်။ SRE သုံးယောက်နဲ့ service ၃၀ လောက်ကို အညီအမျှ ကူလို့ မရတော့ မသီရိက ပျက်ရင် ဘယ်လောက် ဆိုးလဲ၊ ဘယ်လောက် ခဏခဏ ပျက်လဲ ဆိုတဲ့ မေးခွန်း နှစ်ခုနဲ့ ပုံ ဆွဲပြပါတယ်။
      [[mark:b3-s2]] Wallet က လူတွေရဲ့ ငွေကို ထိပြီး လစာထုတ်ရက် တိုင်းလိုလို ပြဿနာ တက်လို့ ညာဘက် အပေါ်ဆုံးမှာ ရှိပြီး အကူအညီ အများဆုံး ရပါတယ်။ Eats ပျက်ရင် နေ့လယ်စာ နောက်ကျတာလောက်ပဲ ဖြစ်ပေမဲ့ incident တွေ များလာလို့ ညာဘက် ရွေ့လာပါတယ်။ ဝန်ထမ်းတွေပဲ သုံးတဲ့ ကုန်စုံ pilot လေးကတော့ ထိခိုက်မှုလည်း နည်း၊ ပျက်တာလည်း ရှားလို့ အကူအညီ နည်းနည်းပဲ ပေးဖို့ တမင် ရွေးထားပါတယ်။
      [[mark:b3-s3]] အကူအညီက ကျလည်း ကျနိုင်ပါတယ်၊ ဥပမာ ပိတ်တော့မယ့် ဖုန်းဘေလ် ခြစ်ကတ် voucher အဟောင်းက အောက်ဆင်းသွားပါတယ်။ Wallet ကို ရှားရှားပဲ ပျက်တဲ့ ဘယ်ဘက်ဆီ ရွှေ့ဖို့ကတော့ နှစ်အတော်ကြာ လုပ်ရပြီး ဂရုမစိုက်ရင် ပြန်ရွေ့လာတတ်ပါတယ်။ ဒီပုံက service ကို အမှတ်ပေးဖို့ မဟုတ်ဘဲ SRE အကူအညီ ဘယ်လောက် ပေးမလဲ ဆုံးဖြတ်ဖို့ပဲ ဖြစ်ပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE at Google: How to structure your SRE team (Google Cloud Blog)",
          url: "https://cloud.google.com/blog/products/devops-sre/how-sre-teams-are-organized-and-how-to-get-started",
        }
