# SRE from zero, lesson 15: Where SRE lives (Burmese concept lesson).
#
# Built from the approved voice script
# docs/sre-course/voice-scripts/sre-15-where-sre-lives.md. Every spoken
# character is that script's "> " lines, unchanged; each ⟪…⟫ marker became a
# [[mark:…]] at the same place. Check it with:
#   bun ~/Documents/sre-course/work/check-narration.ts \
#     docs/sre-course/voice-scripts/sre-15-where-sre-lives.md \
#     src/studio/scripts/sre-15-where-sre-lives.yaml
#
# Nothing runs: deck pages and the whiteboard carry the lesson, and notes.md is
# the recap. The workspace and runtime follow the validated no-code skeleton
# (WebContainer, empty init command, a harmless dev script).
#
# The arc: Ko Zaw starts, but two SREs are still not a rotation (cover). Board
# B1 (P5 bars): production hours per sprint against the quarter-sprint line.
# Board B2 (slider): centralized to embedded, the hybrid knob, Conway's law,
# and Eats drifting into shadow SRE. Pages: the three placements, Padauk's
# hybrid choice, holding the middle; limits on ops work, the 3 + 5 = 8
# rotation, the charter; changing the org like a canary. Board B3 (P5
# two-axis placement): how bad and how often decide how much SRE help a
# service gets. Pages: scorecards, the 4 → 0 ranking, Padauk's review rule,
# structure and culture, this week; recap on notes.md.
#
# Every mark is one of the voice script's own ⟪…⟫ markers; none was added.
# The voice script already carries its pacing pages (p01b, p02b, p02c, p03b,
# p03c, p05b, p06b), every dialog stays under 450 characters, and no page or
# board step holds longer than ~31 s at 70 ms/char (l15_p03, 433
# characters), so no pacing page or board step was needed. ask-question is the
# voice script's ⟪select မေးခွန်း⟫: it sits right before the question, so the
# question is already its own dialog and the question-line select hangs off it
# for the ⟪pause 3s⟫, as the Module 1 reviewers fixed the pause.
#
# ⟪close board⟫ straight into the next board (scene 3) wipes B1 400 ms early
# (whiteboard.apply clear) instead of closing the panel, as lesson 8 does, so
# the editor does not flash between two boards; B2 then draws with open: true,
# clear: true as usual. A board followed by a deck page closes the panel
# (open: false) 400 ms before the page, as in Module 1.
#
# Boards. Colour jobs: #1e1e1e ink (paints white) for titles, axes, the slider
# and arrows; blue the thing named (the outgrown-model label, the placements,
# Conway's law, the services placed on B3); red toil and failure (the
# production-hour bars, Eats's shadow ops person and tool); orange the limit
# (the quarter-sprint line, low help by choice); violet the result (the hybrid
# knob). A label on two lines is two text assets, one per line: the overflow
# rule counts a whole text's length. Mostly-Latin labels get extra width,
# since Virgil's Latin and digits run wider than the 0.55 em rule.
#
# Deck pages: deck "Next Editor · SRE 4 · People and teams". The /pub URL
# below is a placeholder until Chan publishes the deck with this lesson's
# pages; until then the Director reports the deck unreachable or, while the
# published copy still holds only the kit pages, the l15 pages missing. Page
# plan: ~/Documents/sre-course/work/pages/sre-15-where-sre-lives.json
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/sre-15-where-sre-lives.yaml
#   bun scripts/studio-compile-check.ts src/studio/scripts/sre-15-where-sre-lives.yaml
