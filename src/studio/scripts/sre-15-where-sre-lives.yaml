  - id: recap
    narration: >
      [[mark:close-p07]] [[mark:open-notes]] SRE အဖွဲ့ကို ဘယ်မှာ ထားမလဲ ဆုံးဖြတ်ရင် လိုမယ့် အချက်တွေပါ။ [[mark:sel-conway]] Conway's law က system ပုံစံဟာ ဆောက်တဲ့ အဖွဲ့တွေ ဆက်သွယ်ပုံအတိုင်း ထွက်လာတတ်တာပါ။ [[mark:sel-charter]] charter က ရည်ရွယ်ချက်၊ နယ်ပယ်နဲ့ ရက်စွဲပါတဲ့ အောင်မြင်မှုကို ရေးထားတဲ့ စာတမ်း ဖြစ်ပြီး၊ [[mark:sel-ops-limits]] ops အလုပ် ကန့်သတ်ချက်က engineering အနည်းဆုံး တစ်ဝက်၊ on-call အများဆုံး လေးပုံတစ်ပုံ ဆိုတဲ့ မျဉ်းပါ၊ ပန်းတိုင် မဟုတ်ပါဘူး။
      [[mark:sel-shadow]] shadow SRE က တရားဝင် အကူအညီ နှေးလို့ တိတ်တိတ်လေး ပေါ်လာတဲ့ ကိုယ်ပိုင် ops လူနဲ့ tool တွေပါ။ [[mark:sel-scorecard]] scorecard က ကျန်းမာရေးကို ကိန်းဂဏန်း အနည်းငယ်နဲ့ ပြပေမဲ့၊ [[mark:sel-goodhart]] Goodhart's law အရ ပစ်မှတ် ဖြစ်သွားတဲ့ ကိန်းဂဏန်းက တကယ့် အခြေအနေကို မပြတော့ပါဘူး။ [[mark:ask-question]] တကယ်လို့ အဖွဲ့ တစ်ခုမှာ ရုံး တစ်ခုတည်းကနေ လူ ၅ ယောက်က ညတွေကိုပါ on-call ယူနေရင် ဘာ အကြံပေးမလဲ?
      [[mark:pause-question]] ငါးပတ်မှာ တစ်ပတ် ကျလို့ မျဉ်းအောက်မှာ ရှိပေမဲ့ တစ်ယောက် ခွင့်ယူတာနဲ့ ကျန်တဲ့ လေးယောက်က လေးပုံတစ်ပုံ မျဉ်းပေါ် ရောက်ပါပြီ။ ဒါကြောင့် ၈ ယောက်လောက်ထိ တိုးမလား၊ ညဘက် on-call နာရီတွေကို လျှော့မလား စဉ်းစားပါ။ charter ရေးပြီး မကြာခင်မှာပဲ Bill Pay အဖွဲ့က သူတို့ on-call တစ်ခုလုံးကို မသီရိရဲ့ သုံးယောက် အဖွဲ့က ယူပေးဖို့ လာတောင်းပါတယ်။ SRE က အဲဒီအစား ဘာကို ယူသင့်လဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE at Google: How to structure your SRE team (Google Cloud Blog)",
          url: "https://cloud.google.com/blog/products/devops-sre/how-sre-teams-are-organized-and-how-to-get-started",
        }
      - {
          title: "Workbook: Organizational Change Management in SRE",
          url: "https://sre.google/workbook/organizational-change/",
        }
    actions:
      - { id: close-p07, type: slide.close, at: { mark: close-p07 } }
      - {
          id: open-notes,
          type: workspace.openFile,
          at: { mark: open-notes, offsetMs: 300 },
          path: notes.md,
        }
      - {
          id: sel-conway,
          type: editor.select,
          at: { mark: sel-conway },
          target: { file: notes.md, text: "Conway's law", occurrence: 1 },
        }
      - {
          id: sel-charter,
          type: editor.select,
          at: { mark: sel-charter },
          target: { file: notes.md, text: "charter", occurrence: 1 },
        }
      - {
          id: sel-ops-limits,
          type: editor.select,
          at: { mark: sel-ops-limits },
          target: { file: notes.md, text: "ops အလုပ် ကန့်သတ်ချက်", occurrence: 1 },
        }
      - {
          id: sel-shadow,
          type: editor.select,
          at: { mark: sel-shadow },
          target: { file: notes.md, text: "shadow SRE", occurrence: 1 },
        }
      - {
          id: sel-scorecard,
          type: editor.select,
          at: { mark: sel-scorecard },
          target: { file: notes.md, text: "scorecard", occurrence: 1 },
        }
      - {
          id: sel-goodhart,
          type: editor.select,
          at: { mark: sel-goodhart },
          target: { file: notes.md, text: "Goodhart's law", occurrence: 1 },
        }
      # The voice script's ⟪select မေးခွန်း⟫ and ⟪pause 3s⟫, the way the Module 1
      # reviewers fixed the pause. ⟪select မေးခွန်း⟫ sits right before the
      # question, so its mark (ask-question) already makes the question its own
      # dialog; a select at the mark itself would drag under the question and
      # leave no pause, and one at pause-question would drag under the answer's
      # first words (the scheduler holds only the dialog after its anchor's). So
      # the question-line select hangs off ask-question with an offset: it starts
      # about as the question ends, its drag runs in silence, and the answer at
      # pause-question waits for it. The question is 94 characters
      # (no ၊ to split at), so the quiet depends on the voice's speed: 6850
      # leaves about 2.8 / 1.35 / 0.35 s before the answer at 55 / 70 / 95 ms
      # per char (at 95 the drag starts under the question's last words, as in
      # lessons 7 and 8); above ~6940 trips compile-check's 2.5 s
      # inserted-silence warning at 55.
      - id: select-question
        type: editor.select
        at: { mark: ask-question, offsetMs: 6850 }
        target:
          file: notes.md
          text: "မေးခွန်း: ရုံး တစ်ခုတည်းက 5 ယောက်က ညတွေကိုပါ on-call ယူနေတယ်။ ဘာ အကြံပေးမလဲ?"
          occurrence: 1

checks:
  # 500, not 300: google-svg deck pages stall the main thread at show/close.
  - { type: timing.p95Ms, max: 500 }
