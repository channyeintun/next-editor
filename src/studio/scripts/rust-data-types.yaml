  title: "Rust from zero: Data type တွေ"
  locale: my-MM
  workspace:
    lessonType: rust
    name: Rust Lesson
    entryFilePath: main.rs
    files:
      main.rs: |
        fn main() {
            let score = 1250;
            let lives: u8 = 3;
            println!("score {score}, lives {lives}");
        }
