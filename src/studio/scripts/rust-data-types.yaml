# One idea: every Rust value has a fixed type, in two families — scalars (one
# value: integer, float, bool, char) and compound types (tuple, array). A
# whiteboard type-map, then each family is built live and run. Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/rust-data-types.yaml
schemaVersion: 1

lesson:
  slug: rust-data-types
  title: "Rust data types: scalars and compounds"
  locale: en-US
  workspace:
    lessonType: rust
    name: Rust Lesson
    entryFilePath: main.rs
    files:
      main.rs: |
        fn main() {
            let year: i32 = 2015;
            let pi = 3.14159;
            println!("year {year}, pi {pi}");
        }
  # Tree diagram: a "Type" root branching to the Scalar and Compound families.
  whiteboardAssets:
    - id: dt-title
      kind: text
      x: 300
      y: 158
      width: 720
      height: 44
      text: "Every value has a type"
      strokeColor: "#1e1e1e"
      fontSize: 34
    - id: dt-rootbox
      kind: rectangle
      x: 590
      y: 214
      width: 160
      height: 54
      strokeColor: "#1e1e1e"
    - id: dt-rootlabel
      kind: text
      x: 638
      y: 228
      width: 120
      height: 32
      text: "Type"
      strokeColor: "#1e1e1e"
      fontSize: 26
    - id: dt-branchL
      kind: text
      x: 520
      y: 278
      width: 44
      height: 40
      text: "↙"
      strokeColor: "#80868b"
      fontSize: 34
    - id: dt-branchR
      kind: text
      x: 770
      y: 278
      width: 44
      height: 40
      text: "↘"
      strokeColor: "#80868b"
      fontSize: 34
    - id: scalar-card
      kind: rectangle
      x: 290
      y: 330
      width: 350
      height: 210
      strokeColor: "#1971c2"
    - id: scalar-head
      kind: text
      x: 312
      y: 346
      width: 320
