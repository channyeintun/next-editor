build:
  voiceProfile: pocket-alba-v1
  seed: 32

runtime:
  kind: rust-playground
  defaultMode: fixture
  fixture:
    latencyMs: 2000
    result:
      status: success
      stdout: "year 2015, pi 3.14159\nstable true, grade A\ntuple parts: 1, 2.5, x\nfirst score 90, count 3\n"
      stderr: ""

scenes:
  - id: type-map
    narration: >
      [[mark:board]] Every value in Rust has a type. Two families.
      [[mark:show-scalar]] Scalars hold one value — integers, floats, true or
      false, single characters. [[mark:show-compound]] Compound types hold
      several — a tuple mixes types, an array holds many of one.
      [[mark:board-close]] Let's code them.
    sources:
      - title: "The Rust Book — Data Types"
        url: "https://doc.rust-lang.org/book/ch03-02-data-types.html"
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { mark: board }
        open: true
        upsertIds: [dt-title, dt-rootbox, dt-rootlabel]
      - id: show-scalars
        type: whiteboard.apply
        at: { mark: show-scalar }
        upsertIds: [dt-branchL, scalar-card, scalar-head, scalar-row1, scalar-row2]
      - id: show-compound
        type: whiteboard.apply
        at: { mark: show-compound }
        upsertIds: [dt-branchR, compound-card, compound-head, compound-row1, compound-row2]
      - id: close-board
        type: whiteboard.apply
        at: { mark: board-close }
        open: false

  - id: scalars
    narration: >
      [[mark:open]] Two scalars already. year, annotated i32 — a 32-bit signed
      integer. pi has none, so Rust infers f64, the default float.
      [[mark:type-scalars]] Add the other two. A bool: true or false. A char:
      one Unicode character, in single quotes.
    sources:
      - title: "The Rust Book — Scalar Types"
        url: "https://doc.rust-lang.org/book/ch03-02-data-types.html#scalar-types"
    actions:
      - id: open-main
        type: workspace.openFile
        at: { mark: open }
        path: main.rs
      - id: type-scalars
        type: editor.type
        at: { mark: type-scalars, offsetMs: -400 }
        target:
          file: main.rs
          after: "    println!(\"year {year}, pi {pi}\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "    let stable = true;\n    let grade = 'A';\n    println!(\"stable {stable}, grade {grade}\");\n"

  - id: compound
    narration: >
      [[mark:type-compound]] Now compound types. A tuple packs a fixed group —
      an integer, a float, a char. Unpack it with a pattern, naming each part.
      An array is different: a fixed count, all one type. Read one by index from
      zero; its length is known at compile time.
    sources:
      - title: "The Rust Book — Compound Types"
        url: "https://doc.rust-lang.org/book/ch03-02-data-types.html#compound-types"
    actions:
      - id: type-compound
        type: editor.type
        at: { mark: type-compound, offsetMs: -400 }
        target:
          file: main.rs
          after: "    println!(\"stable {stable}, grade {grade}\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "    let point = (1, 2.5, 'x');\n    let (a, b, c) = point;\n    println!(\"tuple parts: {a}, {b}, {c}\");\n    let scores = [90, 80, 70];\n    println!(\"first score {}, count {}\", scores[0], scores.len());\n"

  - id: run
    narration: >
      [[mark:run]] Run it. Two scalars, then bool and char. The tuple splits
      into three parts. The array gives its first value and its length. Types
      are fixed, checked before the program runs — no runtime surprises.
    sources:
      - title: "Rust Playground"
        url: "https://play.rust-lang.org/"
    actions:
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 800 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "first score 90, count 3"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: "let scores = [90, 80, 70];"

checks:
  - { type: timing.p95Ms, max: 300 }
