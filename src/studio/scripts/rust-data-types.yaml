build:
  voiceProfile: pocket-alba-v1
  seed: 32

runtime:
  kind: rust-playground
  defaultMode: fixture
  fixture:
    latencyMs: 600
    result:
      status: success
      stdout: "score 1250, lives 3\nspeed 2.5, alive true, heart ♥\nlevel 7, health 92.5, player.0 = 7\nfirst 40, last 60, count 3\n"
      stderr: ""

scenes:
  - id: integer-sizes
    chapter: Integers come in sizes
    narration: >
      Every value in Rust has a type, and the compiler knows it before your
      program runs. You've met i32 and u32, so let's start with
      integers. [[mark:draw-bars]] There are several integer types, and the
      name tells you the size. The number is how many bits it uses, like 8, 16, 32 or 64.
      [[mark:draw-signs]] The letter matters too. i means signed, so it can be
      negative. u means unsigned: zero and up.
      [[mark:draw-default]] When you don't write a type, Rust picks i32.
    sources:
      - title: "The Rust Book — Data Types: Integer Types"
        url: "https://doc.rust-lang.org/book/ch03-02-data-types.html#integer-types"
      - title: "The Rust Reference — Integer types"
        url: "https://doc.rust-lang.org/reference/types/numeric.html#integer-types"
    actions:
      # Opens in the quiet handle before the first dialog, so the title is up
      # when the voice starts.
      - id: open-int-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -1500 }
        open: true
        upsertIds: [int-title]
      - id: draw-bars
        type: whiteboard.apply
        at: { mark: draw-bars }
        upsertIds:
          [
            int-i8,
            int-u8,
            int-bar8,
            int-i16,
            int-u16,
            int-bar16,
            int-i32,
            int-u32,
            int-bar32,
            int-i64,
            int-u64,
            int-bar64,
          ]
        drawMs: 3600
      - id: draw-signs
        type: whiteboard.apply
        at: { mark: draw-signs }
        upsertIds: [int-signed, int-unsigned]
        drawMs: 1600
      - id: draw-default
        type: whiteboard.apply
        at: { mark: draw-default }
        upsertIds: [int-default-circle, int-default]
        drawMs: 1400

  - id: integer-limits
    narration: >
      Why does the size matter? [[mark:draw-range]] A smaller type uses less
      memory, but it holds a smaller range. A u8 is one byte, so it only holds
      zero to 255. [[mark:draw-error]] Try to put 256 in it, and the program
      doesn't compile. The error says: literal out of range for u8. A literal
      is a value written in your code, like this 256. [[mark:after-error]] So
      you pick a size that fits your data.
    sources:
      - title: "The Rust Book — Data Types: Integer Overflow"
        url: "https://doc.rust-lang.org/book/ch03-02-data-types.html#integer-overflow"
      - title: "The Rust Reference — Integer literal expressions"
        url: "https://doc.rust-lang.org/reference/expressions/literal-expr.html#integer-literal-expressions"
      - title: "The rustc book — overflowing_literals (deny by default)"
        url: "https://doc.rust-lang.org/rustc/lints/listing/deny-by-default.html#overflowing-literals"
    actions:
      - id: draw-range
        type: whiteboard.apply
        at: { mark: draw-range }
        upsertIds: [int-range]
        drawMs: 1000
      - id: draw-error
        type: whiteboard.apply
        at: { mark: draw-error }
        upsertIds: [int-err-code, int-err-underline, int-err-msg]
        drawMs: 2600

  - id: scalars
    chapter: Floats, booleans and characters
    narration: >
      [[mark:open-main]] Here's our program. [[mark:select-score]] score has
      no type written, so Rust makes it an i32. [[mark:select-u8]] lives has
      its type after the colon: u8. Three is between zero and 255, so it fits.
      Integers are one of four scalar types, which hold a single value.
      [[mark:type-scalars]] Let's add the other three. A number with a
      decimal point is a float. The default is f64. On modern CPUs it's about
      as fast as f32, and more precise. A bool is true or false. And a
      char goes in single quotes. Double quotes make a string.
      [[mark:char-size]] A char is four bytes, so it can hold one Unicode
      character, not only an English letter. [[mark:select-heart]] Here,
      it's a heart.
    sources:
      - title: "The Rust Book — Data Types: Floating-Point, Boolean and Character Types"
        url: "https://doc.rust-lang.org/book/ch03-02-data-types.html#floating-point-types"
      - title: "std — primitive type char"
        url: "https://doc.rust-lang.org/std/primitive.char.html"
    actions:
      - id: close-int-board
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-main
        type: workspace.openFile
        # Clear of the board closing at the scene's first word, so the cursor
        # has time to glide to the file row.
        at: { mark: open-main, offsetMs: 700 }
        path: main.rs
      - id: select-score
        type: editor.select
        at: { mark: select-score }
        target:
          file: main.rs
          text: "score = 1250"
          occurrence: 1
      - id: select-u8
        type: editor.select
        at: { mark: select-u8 }
        target:
          file: main.rs
          text: "lives: u8"
          occurrence: 1
      - id: type-scalars
        type: editor.type
        at: { mark: type-scalars, offsetMs: -300 }
        target:
          file: main.rs
          after: "    println!(\"score {score}, lives {lives}\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n    let speed = 2.5;\n    let alive = true;\n    let heart = '♥';\n    println!(\"speed {speed}, alive {alive}, heart {heart}\");\n"
      # '♥' (U+2665) is one UTF-16 unit, so Monaco's offsets and the drag
      # endpoints line up with the characters on screen.
      - id: select-heart
        type: editor.select
        at: { mark: select-heart }
        target:
          file: main.rs
          text: "'♥'"
          occurrence: 1

  - id: compound-board
    chapter: Tuples and arrays
    narration: >
      [[mark:open-compound]] Compound types group several values into one.
      [[mark:draw-tuple]] A tuple has a fixed number of parts, and each part
      can have its own type. This one holds an i32 and an f64. The f64 box is
      twice as wide, because it's 64 bits. You read a part by its position:
      dot zero, dot one. [[mark:draw-array]] An array is stricter.
      Every element has the same type, and the length can't change. Indexes
      go in square brackets, and they start at zero. [[mark:draw-fixed]] So
      an array's type names both: i32, and three of them. For a list that can
      grow, you'll use a vector, later in the course.
    sources:
      - title: "The Rust Book — Data Types: Compound Types"
        url: "https://doc.rust-lang.org/book/ch03-02-data-types.html#compound-types"
    actions:
      # The integer board is wiped; this diagram reuses its canvas.
      - id: open-compound
        type: whiteboard.apply
        at: { mark: open-compound }
        open: true
        clear: true
        upsertIds: [cmp-title]
      - id: draw-tuple
        type: whiteboard.apply
        at: { mark: draw-tuple }
        upsertIds:
          [
            cmp-tuple-name,
            cmp-tuple-type,
            cmp-t-cell0,
            cmp-t-cell1,
            cmp-t-val0,
            cmp-t-val1,
            cmp-t-idx0,
            cmp-t-idx1,
          ]
        drawMs: 3200
      - id: draw-array
        type: whiteboard.apply
        at: { mark: draw-array }
        upsertIds:
          [
            cmp-array-name,
            cmp-a-cell0,
            cmp-a-cell1,
            cmp-a-cell2,
            cmp-a-val0,
            cmp-a-val1,
            cmp-a-val2,
            cmp-a-idx0,
            cmp-a-idx1,
            cmp-a-idx2,
          ]
        drawMs: 3600
      - id: draw-fixed
        type: whiteboard.apply
        at: { mark: draw-fixed }
        upsertIds: [cmp-array-type, cmp-fixed-underline]
        drawMs: 1400

  - id: tuple
    narration: >
      [[mark:to-code]] Let's write both. [[mark:type-tuple]] First, a player
      tuple, in parentheses: a level of seven, and a health of 92.5.
      [[mark:type-destructure]] Then let's take it apart. [[mark:select-destructure]] The pattern on the left has
      the same shape as the tuple. So level gets the first part, and health
      gets the second. That's called destructuring. [[mark:select-dot]] And
      player dot zero reads the first part by its position. Braces in the
      string can only name a plain variable, so player dot zero goes after the
      string, into empty braces.
    sources:
      - title: "The Rust Book — Data Types: The Tuple Type"
        url: "https://doc.rust-lang.org/book/ch03-02-data-types.html#the-tuple-type"
      - title: "std — fmt: Named parameters"
        url: "https://doc.rust-lang.org/std/fmt/index.html#named-parameters"
    actions:
      - id: close-compound
        type: whiteboard.apply
        at: { mark: to-code }
        open: false
      - id: type-tuple
        type: editor.type
        at: { mark: type-tuple, offsetMs: -300 }
        target:
          file: main.rs
          after: "    println!(\"speed {speed}, alive {alive}, heart {heart}\");\n"
          occurrence: 1
        cadence: fast-explainer
        text: "\n    let player = (7, 92.5);\n"
      - id: type-destructure
        type: editor.type
        at: { mark: type-destructure }
        target:
          file: main.rs
          after: "    let player = (7, 92.5);\n"
          occurrence: 1
        cadence: line-by-line
        text: "    let (level, health) = player;\n    println!(\"level {level}, health {health}, player.0 = {}\", player.0);\n"
      - id: select-destructure
        type: editor.select
        at: { mark: select-destructure }
        target:
          file: main.rs
          text: "(level, health)"
          occurrence: 1
      # Occurrence 2: the first "player.0" is inside the format string.
      - id: select-dot
        type: editor.select
        at: { mark: select-dot }
        target:
          file: main.rs
          text: "player.0"
          occurrence: 2

  - id: array
    narration: >
      [[mark:type-array]] Now an array of three lap times, and a line that
      prints the first, the last, and the count.
      [[mark:select-array-type]] Its type says i32, then a semicolon and the
      length, three. [[mark:select-last]] So the last index is two.
      [[mark:select-len]] And len gives the number of elements. Lengths and
      indexes use usize, an unsigned integer that's as wide as a memory
      address. On most machines, that's 64 bits.
    sources:
      - title: "The Rust Book — Data Types: The Array Type"
        url: "https://doc.rust-lang.org/book/ch03-02-data-types.html#the-array-type"
      - title: "std — primitive type usize"
        url: "https://doc.rust-lang.org/std/primitive.usize.html"
    actions:
      - id: type-array
        type: editor.type
        at: { mark: type-array, offsetMs: -300 }
        target:
          file: main.rs
          after: "    println!(\"level {level}, health {health}, player.0 = {}\", player.0);\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n    let laps: [i32; 3] = [40, 25, 60];\n    println!(\"first {}, last {}, count {}\", laps[0], laps[2], laps.len());\n"
      - id: select-array-type
        type: editor.select
        at: { mark: select-array-type }
        target:
          file: main.rs
          text: "[i32; 3]"
          occurrence: 1
      - id: select-last
        type: editor.select
        at: { mark: select-last }
        target:
          file: main.rs
          text: "laps[2]"
          occurrence: 1
      - id: select-len
        type: editor.select
        at: { mark: select-len }
        target:
          file: main.rs
          text: "laps.len()"
          occurrence: 1

  - id: out-of-bounds
    chapter: Reading past the end
    narration: >
      What if we asked for index three? [[mark:open-bounds]] There's no
      fourth element. [[mark:draw-bounds]] The compiler knows the length and
      the index, so it stops with an error: this operation will panic at
      runtime. The length is 3 but the index is 3. [[mark:bounds-why]] And
      when the index is only known while the program runs, Rust still checks
      it. If it's too big, the program stops with an error called a panic. In
      C, that read could return whatever is next in memory.
      [[mark:close-bounds]] Rust never reads past the end of an array.
    sources:
      - title: "The Rust Book — Data Types: Invalid Array Element Access"
        url: "https://doc.rust-lang.org/book/ch03-02-data-types.html#invalid-array-element-access"
      - title: "The rustc book — unconditional_panic (deny by default)"
        url: "https://doc.rust-lang.org/rustc/lints/listing/deny-by-default.html#unconditional-panic"
    actions:
      # Re-opens board 2 as it was left; the missing slot and the error are
      # added under the array the viewer already saw.
      - id: open-bounds
        type: whiteboard.apply
        at: { mark: open-bounds }
        open: true
        upsertIds: [cmp-b-idx3, cmp-b-circle]
        drawMs: 1200
      - id: draw-bounds
        type: whiteboard.apply
        at: { mark: draw-bounds }
        upsertIds: [cmp-b-code, cmp-b-underline, cmp-b-err1, cmp-b-err2]
        drawMs: 3600
      # Closed a sentence before the run, so the cursor has time to glide to
      # the Run button.
      - id: close-bounds
        type: whiteboard.apply
        at: { mark: close-bounds }
        open: false

  - id: run
    narration: >
      [[mark:run]] Let's run it. Score 1250 and three lives. Then the float,
      the bool and the heart. Level 7, health 92.5, and player dot zero is 7
      too. Then first 40, last 60, and a count of 3.
    sources:
      - title: "Rust by Example — Primitives"
        url: "https://doc.rust-lang.org/rust-by-example/primitives.html"
    actions:
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "first 40, last 60, count 3"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: "let laps: [i32; 3] = [40, 25, 60];"

  - id: wrap
    narration: >
      So every value has one fixed type, and the type decides its size. Scalars
      hold one value, and tuples and arrays group a fixed number of them.
      Next, we'll write functions of our own, with typed parameters and a
      return type.
    sources:
      - title: "The Rust Book — Data Types"
        url: "https://doc.rust-lang.org/book/ch03-02-data-types.html"
    actions: []

checks:
  - { type: timing.p95Ms, max: 300 }
