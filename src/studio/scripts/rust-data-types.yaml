# Rust from zero, lesson 3: data types. Every value has one fixed type, and
# the type decides its size. Board 1 draws the integer family as bars sized by
# their bits (i/u, 8 to 64, i32 the default) and the u8 range, then the
# "literal out of range for `u8`" error for 256. In the editor: score (an
# inferred i32) and lives (a u8) are pinned; f64, bool and char are added.
# Board 2 draws a tuple (parts of different types, read by .0 and .1) and an
# array (one type, fixed length, [i32; 3], indexes from zero); the code builds
# both, with destructuring, .0, indexing and len (usize). The board is then
# re-opened to show reading past the end ("this operation will panic at
# runtime"). One run at the end.
#
# Every error shown or spoken was confirmed with rustc 1.98 --edition 2024:
#   let lives: u8 = 256;          → error: literal out of range for `u8`
#   println!("{}", laps[3]);      → error: this operation will panic at runtime
#                                   (index out of bounds: the length is 3 but
#                                   the index is 3)
# The fixture is the exact output of the final program, which compiles with no
# warnings. Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/rust-data-types.yaml
schemaVersion: 1

