# CSS course (Burmese), lesson 34 of 43: borders and shadows.
#
# Narration is Burmese (voice-script.md next to this file; DESIGN.md is the
# span-by-span brief). Every [[mark:…]] sits where its action
# begins, at a sentence end; each span carries one piece of meaning.
# Everything the learner sees (title, chapters, whiteboard labels, UI strings)
# is Burmese already.
#
# Shape: board (recall lesson 33; the border is the box's frame; style, width,
# colour; one of them is the switch) → code tour (shop name, three drink cards
# with no border, five style squares, the owner photo stand-in and a green
# badge, the order form) → cards: border-width alone shows nothing,
# border-style: solid switches it on, color: sienna recolours the frame
# (currentColor) → squares: dotted, then dashed / double / groove / ridge
# (browsers draw them differently) → cards: the border shorthand, then one
# side → border-radius on the cards, a 9999px pill on the order button, a 50%
# circle on the owner photo → board (corner order clockwise from the top left,
# two values, per-corner and logical longhands) → the green badge: elliptical
# corners with the slash → today's special: a 10px border, then a gradient
# border-image (square corners) → board (9 slices, repeat, width, outset,
# fill) → board (box / text / drop shadow; the values of a box shadow) →
# cards: hard shadow right, left, blur, a see-through colour, a spread ring →
# two layered shadows (first on top, overflow clips) → inset on the text
# field → text-shadow on the shop name, then three stepped shadows (no spread
# or inset, inherited, shows through see-through text) → quiz + recap,
# hand-off to clip-path (lesson 35).
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set(; no postcss config; no reload.
# A keystroke-typed function has an unclosed "(" until its ")", and an
# unclosed function swallows the rest of the stylesheet. So every keystroke
# edit that contains "(" lands in the LAST rule of the file (the featured
# border image, the second .menu-card rule with the shadows, the input's
# inset shadow); edits into earlier rules contain no parentheses; the two
# multi-line shadow lists are line-by-line (every revealed line is balanced).
# Until a new declaration is complete it is invalid and the previous one in
# the same rule keeps painting.
#
# Measured in headless Chrome at 432 × 720 (probe/stages.ts, same anchors):
# header 0–113 (shop name 32px), cards at y 151 / 267 / 382 (400 × 103 with
# no border), badge row 502 (five 70 × 70 squares in one row), owner photo
# 96 × 96 at y 588 with the 64 × 64 leaf badge, form 700–862, document 886
# tall; with every border typed: cards 151 / 287 / 410, badges 538, owner
# 624, form 736, document 922 (screenshots in probe/).
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
