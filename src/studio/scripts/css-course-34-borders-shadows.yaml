build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 4134

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  - id: borders-intro
    chapter: "Border ဆိုတာ ဘာလဲ"
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ box ရဲ့ content နောက်က နောက်ခံ အရောင်နဲ့ ပုံတွေကို
      ကြည့်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ box ရဲ့ အစွန်းကို ကြည့်ပြီး၊ border ကို အရင်၊
      အရိပ်တွေကို နောက်မှ ကြည့်ပါမယ်။ [[mark:start-server]] ဒီလို ပြောနေတုန်းမှာပဲ၊ board
      နောက်မှာ dev server ကို စ နေပါပြီ။ [[mark:draw-box]] lesson 2 မှာ ကြည့်ခဲ့တဲ့ box
      model ကို ပြန်စဉ်းစားကြည့်ပါ။ border ဆိုတာ box ကို ပတ်ထားတဲ့ ဘောင်ပါ။
      [[mark:draw-layers]] သူက padding ရဲ့ အပြင်ဘက်၊ margin ရဲ့ အတွင်းဘက်မှာ ရှိပါတယ်။ box
      sizing က border box ဖြစ်လို့၊ border ထူလာရင် ပေးထားတဲ့ အကျယ်ထက် မကြီးဘဲ content နေရာ
      ကျဉ်းသွားပါတယ်။ ပြီးတော့ border ကို နောက်ခံ အပေါ်မှာ ဆွဲပါတယ်။
      [[mark:draw-settings]] border မှာ setting သုံးခု ရှိပါတယ်။ မျဉ်းပုံစံ ဖြစ်တဲ့ style၊
      အထူ ဖြစ်တဲ့ width နဲ့ အရောင် ဖြစ်တဲ့ color ပါ။ [[mark:circle-style]] ဒီ သုံးခုထဲမှာ
      border ပေါ်မပေါ် ဆိုတာကို style က ဆုံးဖြတ်ပါတယ်။ ဘာကြောင့်လဲ ဆိုတာ editor ထဲမှာ
      ကြည့်ရအောင်။
    sources:
      - title: "web.dev Learn CSS — Borders"
        url: "https://web.dev/learn/css/borders"
      - title: "web.dev Learn CSS — Box model"
        url: "https://web.dev/learn/css/box-model"
      - title: "MDN — border"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/border"
      - title: "CSS Backgrounds and Borders Module Level 3 — borders"
        url: "https://www.w3.org/TR/css-backgrounds-3/#borders"
    actions:
      - id: open-intro-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      # Runs in the background (boot + pnpm install + spawn); waitForReady sits
      # on the preview mark in the code tour, well over 40 s of narration later.
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 45000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-box
        type: whiteboard.apply
        at: { mark: draw-box }
        upsertIds: [a-border, a-padding, a-content, a-content-l, a-l-border]
        drawMs: 2400
      - id: draw-layers
        type: whiteboard.apply
        at: { mark: draw-layers }
        upsertIds: [a-margin, a-l-padding, a-l-margin, a-l-paint]
        drawMs: 2400
      - id: draw-settings
        type: whiteboard.apply
        at: { mark: draw-settings }
        upsertIds: [a-style, a-width, a-color]
        drawMs: 2400
      - id: circle-style
        type: whiteboard.apply
        at: { mark: circle-style }
        upsertIds: [a-switch, a-switch-l]
        drawMs: 1600

  - id: code-tour
    narration: >
      [[mark:close-intro-board]] page ကို ကြည့်ရအောင်။ [[mark:open-index]] ဒါက HTML
      ဖိုင်ပါ။ [[mark:select-header]] header ထဲမှာ ဆိုင်ရဲ့ နာမည် ရှိပါတယ်။
      [[mark:select-menu]] ပြီးတော့ သောက်စရာ card သုံးခု ရှိပါတယ်။ ပထမ card က ဒီနေ့ အထူး
      ဖြစ်လို့၊ featured class ပါပါတယ်။ [[mark:select-badges]] border style တစ်မျိုးစီရဲ့
      နာမည် တပ်ထားတဲ့ လေးထောင့် သေးသေး ငါးခု ရှိပါတယ်။ [[mark:select-owner]] ဆိုင်ရှင်
      ဓာတ်ပုံအစား ထားတဲ့ စတုရန်းနဲ့ အစိမ်းရောင် badge လည်း ရှိပါတယ်။ [[mark:select-form]]
      နောက်ဆုံးက field တစ်ခုနဲ့ မှာမယ့် ခလုတ် ပါတဲ့ အော်ဒါ form ပါ။ [[mark:open-styles]]
      CSS ဖိုင်ကတော့ အလွတ်ပါ။ base CSS ဖိုင်ကလည်း card တွေကို border နဲ့ ထောင့်ဝိုင်း
      မပေးထားပါဘူး။ [[mark:preview-opens]] preview ပွင့်လာပါပြီ။ card တွေက နို့နှစ်ရောင်
      page ပေါ်က ဘောင် မပါတဲ့ အဖြူ box တွေပါ။
    sources:
      - title: "web.dev Learn CSS — Borders"
        url: "https://web.dev/learn/css/borders"
      - title: "MDN — border-style (initial value none)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/border-style"
    actions:
      - id: close-intro-board
        type: whiteboard.apply
        at: { mark: close-intro-board }
        open: false
      - id: open-index
        type: workspace.openFile
        at: { mark: open-index }
        path: index.html
      - id: select-header
        type: editor.select
        at: { mark: select-header }
        target:
          {
            file: index.html,
            text: '<h1 class="shop-name" data-testid="shop-name">',
            occurrence: 1,
          }
      - id: select-menu
        type: editor.select
        at: { mark: select-menu }
        target: { file: index.html, text: '<li class="menu-card featured"', occurrence: 1 }
      - id: select-badges
        type: editor.select
        at: { mark: select-badges }
        target:
          {
            file: index.html,
            text: '<ul class="badge-row" data-testid="badge-row" lang="en">',
            occurrence: 1,
          }
      - id: select-owner
        type: editor.select
        at: { mark: select-owner }
        target:
          {
            file: index.html,
            text: '<div class="owner-row" data-testid="owner-row">',
            occurrence: 1,
          }
      - id: select-form
        type: editor.select
        at: { mark: select-form }
        target:
          {
            file: index.html,
            text: '<form class="order-form" id="order" data-testid="order-form">',
            occurrence: 1,
          }
      - id: open-styles
        type: workspace.openFile
        at: { mark: open-styles }
        path: styles.css
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { mark: preview-opens }
        timeoutMs: 20000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-dev-server }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-shop-name
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: shop-name }
        textContains: "ရွှေလက်ဖက်ရည်ဆိုင်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-menu
        type: expect.preview
        at: { afterAction: expect-shop-name }
        timeoutMs: 5000
        target: { by: testId, value: menu-drinks }
        textContains: "သံပုရာရည်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: collapse-runner-dock
        type: runtime.collapseDock
        at: { afterAction: expect-menu }

  - id: border-style
    chapter: "Border ကို ပေါ်အောင် လုပ်ရအောင်"
    narration: >
      [[mark:type-width]] သောက်စရာ card တွေရဲ့ border ကို 4 pixel ထူအောင် ပေးကြည့်ရအောင်။
      ရိုက်နေတုန်း card တွေကို လိုက်ကြည့်ပါ။ [[mark:after-width]] ဘာမှ မပေါ်လာပါဘူး။
      [[mark:explain-none]] ဒီ အထူကို ကြည့်ပါ။ border style ရဲ့ default က none ပါ။ none
      ဖြစ်နေသရွေ့ အထူကို ဘယ်လောက် ရေးရေး သုည ဖြစ်သွားပါတယ်။ [[mark:type-style]] ဒါကြောင့်
      အောက်မှာ style ကို မျဉ်းဖြောင့် ထပ်ပေးပါမယ်။ [[mark:after-style]] အခု card တိုင်းမှာ
      4 pixel ထူတဲ့ အရောင်ရင့် ဘောင် ပေါ်လာပါပြီ။ ဆိုတော့ border ကို ဖွင့်ပေးတဲ့ switch က
      style ပါ။ [[mark:select-width]] ဒီ 4 pixel ကို ကြည့်ပါ။ အထူကို pixel၊ rem လို unit
      နဲ့ ပေးသလို၊ thin၊ medium၊ thick ဆိုတဲ့ keyword တွေနဲ့လည်း ပေးလို့ ရပါတယ်။ default က
      3 pixel ရှိတဲ့ medium ပါ။ ရာခိုင်နှုန်းနဲ့တော့ ပေးလို့ မရပါဘူး။
    sources:
      - title: "web.dev Learn CSS — Borders: style"
        url: "https://web.dev/learn/css/borders#style"
      - title: "MDN — border-style (none computes the width to 0)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/border-style"
      - title: "MDN — border-width (thin, medium, thick; no percentages)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/border-width"
      - title: "CSS Backgrounds and Borders Module Level 3 — border-width"
        url: "https://www.w3.org/TR/css-backgrounds-3/#border-width"
    actions:
      - id: type-width
        type: editor.type
        at: { mark: type-width }
        cadence: fast-explainer
        target: { file: styles.css, after: "", occurrence: 1 }
        text: ".menu-card {\n  border-width: 4px;\n}\n"
      - id: expect-width
        type: expect.preview
        at: { mark: after-width }
        timeoutMs: 4000
        target: { by: testId, value: card-laphet-yay }
        textContains: "လက်ဖက်ရည်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-none
        type: editor.select
        at: { mark: explain-none }
        target: { file: styles.css, text: "border-width: 4px;", occurrence: 1 }
      - id: type-style
        type: editor.type
        at: { mark: type-style }
        cadence: fast-explainer
        target: { file: styles.css, after: "  border-width: 4px;\n", occurrence: 1 }
        text: "  border-style: solid;\n"
      - id: expect-style
        type: expect.preview
        at: { mark: after-style }
        timeoutMs: 4000
        target: { by: testId, value: card-coffee }
        textContains: "ကော်ဖီ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-width
        type: editor.select
        at: { mark: select-width }
        target: { file: styles.css, text: "4px", occurrence: 1 }

  - id: border-color
    narration: >
      [[mark:type-color]] border ကို အရောင် မပေးရသေးပါဘူး။ အဲဒီအစား card ရဲ့ စာလုံး
      အရောင်ကို အညိုနီရောင် ပေးကြည့်ရအောင်။ နာမည်တွေတင် မကဘဲ ဘောင်တွေကိုပါ လိုက်ကြည့်ပါ။
      [[mark:after-color]] နာမည်တွေရော ဘောင်တွေပါ အညိုနီရောင် ဖြစ်သွားပါပြီ။
      [[mark:explain-current]] ဒီ စာလုံး အရောင်ကို ကြည့်ပါ။ border ကို အရောင် မပေးရင်၊
      lesson 9 မှာ တွေ့ခဲ့တဲ့ currentColor ဆိုတဲ့ စာလုံး အရောင်ကို သုံးပါတယ်။
      ဖော်ပြချက်နဲ့ ဈေးနှုန်းကတော့ ကိုယ်ပိုင် အရောင် ရှိလို့ မပြောင်းပါဘူး။
    sources:
      - title: "web.dev Learn CSS — Borders: color"
        url: "https://web.dev/learn/css/borders#color"
      - title: "MDN — border-color (initial value currentcolor)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/border-color"
      - title: "MDN — currentcolor keyword"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/color_value#currentcolor_keyword"
    actions:
      - id: type-color
        type: editor.type
        at: { mark: type-color }
        cadence: fast-explainer
        target: { file: styles.css, after: "  border-style: solid;\n", occurrence: 1 }
        text: "  color: sienna;\n"
      - id: expect-color
        type: expect.preview
        at: { mark: after-color }
        timeoutMs: 4000
        target: { by: testId, value: card-lime-juice }
        textContains: "သံပုရာရည်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-color
        type: editor.select
        at: { mark: explain-current }
        target: { file: styles.css, text: "color: sienna;", occurrence: 1 }

  - id: style-gallery
    chapter: "Border style တွေ"
    narration: >
      [[mark:scroll-badges]] လေးထောင့်လေးတွေဆီ သွားရအောင်။ [[mark:type-dotted]]
      လေးထောင့်တွေအတွက် rule အသစ်မှာ border တစ်ခုလုံးကို တစ်ကြောင်းတည်း ရေးပါမယ်။ 6 pixel
      ထူတဲ့ အညိုနီရောင် အစက် ဘောင်ပါ။ [[mark:after-dotted]] လေးထောင့် ငါးခုလုံးမှာ အစက်
      ဘောင် ပေါ်လာပါပြီ။ [[mark:type-styles]] ပြီးတော့ rule လေးခုနဲ့ ဒုတိယကနေ နောက်ဆုံး
      လေးထောင့်အထိ style တစ်မျိုးစီ ပေးပါမယ်။ လေးထောင့်တွေကို lesson 4 မှာ တွေ့ခဲ့တဲ့
      nth-child နဲ့ ရွေးထားပါတယ်။ [[mark:after-styles]] ဒုတိယက မျဉ်းပြတ် တိုတိုတွေပါ။
      တတိယက ကြားမှာ နေရာလွတ် ခြားထားတဲ့ မျဉ်း နှစ်ကြောင်းမို့၊ အထူ အနည်းဆုံး 3 pixel
      လိုပါတယ်။ [[mark:explain-3d]] ဒီ groove က ထွင်းထားသလို၊ ridge က မို့နေသလို
      ပေါ်ပါတယ်။ browser က ဘောင်ရဲ့ တချို့ကို ပိုလင်းအောင်၊ တချို့ကို ပိုရင့်အောင်
      ဆွဲလို့ပါ။ inset နဲ့ outset ကတော့ box တစ်ခုလုံးကို နစ်နေသလို၊ ကြွနေသလို ပြပါတယ်။
      [[mark:explain-browsers]] အရောင် အလင်း အမှောင်နဲ့ အစက်၊ မျဉ်းပြတ် အရွယ်ကိုတော့
      browser တစ်ခုချင်း ကိုယ့်ဘာသာ ဆုံးဖြတ်ပါတယ်။ ဒီ preview ကိုလည်း ကိုယ့် browser ကပဲ
      ဆွဲပြတာမို့ နည်းနည်း ကွဲနိုင်ပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Borders: style"
        url: "https://web.dev/learn/css/borders#style"
      - title: "MDN — border-style (dotted, dashed, double, groove, ridge, inset, outset)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/border-style"
      - title: "CSS Backgrounds and Borders Module Level 3 — border-style"
        url: "https://www.w3.org/TR/css-backgrounds-3/#border-style"
    actions:
      - id: scroll-badges
        type: preview.scroll
        at: { mark: scroll-badges }
        timeoutMs: 5000
        top: 2000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-dotted
        type: editor.type
        at: { mark: type-dotted }
        cadence: fast-explainer
        target: { file: styles.css, after: "  color: sienna;\n}\n", occurrence: 1 }
        text: "\n.style-badge {\n  border: 6px dotted sienna;\n}\n"
      - id: expect-dotted
        type: expect.preview
        at: { mark: after-dotted }
        timeoutMs: 4000
        target: { by: testId, value: badge-row }
        textContains: "dotted"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-styles
        type: editor.type
        at: { mark: type-styles }
        cadence: line-by-line
        target: { file: styles.css, after: "  border: 6px dotted sienna;\n}\n", occurrence: 1 }
        text: "\n.style-badge:nth-child(2) { border-style: dashed; }\n.style-badge:nth-child(3) { border-style: double; }\n.style-badge:nth-child(4) { border-style: groove; }\n.style-badge:nth-child(5) { border-style: ridge; }\n"
      - id: expect-styles
        type: expect.preview
        at: { mark: after-styles }
        timeoutMs: 4000
        target: { by: testId, value: badge-row }
        textContains: "ridge"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-3d
        type: editor.select
        at: { mark: explain-3d }
        target: { file: styles.css, text: "border-style: groove;", occurrence: 1 }

  - id: shorthand
    chapter: "Shorthand နဲ့ ဘက်တစ်ဘက်ချင်း"
    narration: >
      [[mark:scroll-top]] card တွေဆီ ပြန်သွားရအောင်။ [[mark:type-shorthand]] border
      shorthand က အထူ၊ style နဲ့ အရောင်ကို တစ်ခါတည်း ပေးပါတယ်။ 2 pixel ထူတဲ့
      အညိုဖျော့ရောင် မျဉ်းဖြောင့် ဘောင် ပေးပါမယ်။ သူ့ကို နောက်မှ ရေးထားလို့ အပေါ်က border
      declaration တွေကို နိုင်ပါတယ်။ [[mark:after-shorthand]] card တွေမှာ အညိုဖျော့ရောင်
      ဘောင် ပါးပါး ဖြစ်သွားပါပြီ။ [[mark:explain-reset]] တန်ဖိုး သုံးခုကို ကြိုက်တဲ့
      အစဉ်နဲ့ ရေးလို့ ရပြီး၊ မရေးတဲ့ တန်ဖိုးက default ပြန်ဖြစ်သွားပါတယ်။ shorthand က
      နောက်မှ တွေ့မယ့် border image ကိုလည်း default ပြန်ထားပါတယ်။ [[mark:type-bottom]] ဘက်
      တစ်ဘက်တည်း ပြောင်းချင်ရင်၊ ဘက်တိုင်းမှာ ကိုယ်ပိုင် shorthand ရှိပါတယ်။ အောက်ဘက်ကို
      လက်ဖက်ရွက်လို အစိမ်းရောင်နဲ့ 6 pixel ထူအောင် ပေးပါမယ်။ [[mark:after-bottom]]
      အောက်ဘက် ဘောင်ပဲ ပြောင်းသွားပါတယ်။ [[mark:explain-longhands]] ဒီ border bottom
      အပြင်၊ border top style လို setting တစ်ခုတည်းကို ပြောင်းတဲ့ longhand တွေလည်း
      ရှိပါတယ်။ lesson 21 က border block end လို logical property တွေကတော့ စာ ရေးတဲ့
      ဦးတည်ရာကို လိုက်ပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Borders: shorthand"
        url: "https://web.dev/learn/css/borders#shorthand"
      - title: "MDN — border (omitted values reset; also resets border-image)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/border"
      - title: "MDN — border-bottom"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/border-bottom"
      - title: "MDN — border-block"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/border-block"
    actions:
      - id: scroll-top
        type: preview.scroll
        at: { mark: scroll-top }
        timeoutMs: 5000
        top: 0
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-shorthand
        type: editor.type
        at: { mark: type-shorthand }
        cadence: fast-explainer
        target: { file: styles.css, after: "  color: sienna;\n", occurrence: 1 }
        text: "  border: 2px solid tan;\n"
      - id: expect-shorthand
        type: expect.preview
        at: { mark: after-shorthand }
        timeoutMs: 4000
        target: { by: testId, value: card-laphet-yay }
        textContains: "1,500 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-bottom
        type: editor.type
        at: { mark: type-bottom }
        cadence: fast-explainer
        target: { file: styles.css, after: "  border: 2px solid tan;\n", occurrence: 1 }
        text: "  border-bottom: 6px solid seagreen;\n"
      - id: expect-bottom
        type: expect.preview
        at: { mark: after-bottom }
        timeoutMs: 4000
        target: { by: testId, value: card-coffee }
        textContains: "1,800 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-bottom
        type: editor.select
        at: { mark: explain-longhands }
        target: { file: styles.css, text: "border-bottom", occurrence: 1 }

  - id: radius
    chapter: "ထောင့်တွေကို ဝိုင်းရအောင်"
    narration: >
      [[mark:type-radius]] ထောင့်ချွန်တွေက ကြည့်ရတာ မာနေပါတယ်။ border radius နဲ့ card
      ထောင့်တွေကို 16 pixel ဝိုင်းပေးပါမယ်။ [[mark:after-radius]] ထောင့် လေးခုလုံး
      ဝိုင်းသွားပါပြီ။ ဘောင်ရော အဖြူရောင် နောက်ခံပါ အကွေးအတိုင်း လိုက်သွားတာကို သတိထား
      ကြည့်ပါ။ [[mark:scroll-bottom]] border radius က border မရှိလည်း အလုပ်လုပ်ပါတယ်။
      [[mark:type-pill]] မှာမယ့် ခလုတ်မှာ border မရှိပါဘူး။ rule အသစ်နဲ့ သူ့ကို 9999 pixel
      ဆိုတဲ့ radius အကြီးကြီး ပေးကြည့်ရအောင်။ [[mark:after-pill]] ခလုတ်က ဆေးတောင့်ပုံ
      ဖြစ်သွားပါပြီ။ radius က box ထဲ မဆံ့ရင် browser က radius အားလုံးကို အချိုးတူ
      လျှော့ပေးလို့၊ ဘယ်ညာ အစွန်း နှစ်ဘက်က စက်ဝိုင်း တစ်ခြမ်းစီ ဖြစ်သွားပါတယ်။
      [[mark:type-circle]] ဆိုင်ရှင်ရဲ့ ဓာတ်ပုံအတွက်တော့ သူ့ အရွယ်အစားရဲ့ တစ်ဝက် ဖြစ်တဲ့
      50 ရာခိုင်နှုန်းကို သုံးပါမယ်။ [[mark:after-circle]] စတုရန်းက စက်ဝိုင်း
      ဖြစ်သွားပါပြီ။ အကျယ်နဲ့ အမြင့် မတူတဲ့ box ဆိုရင်တော့ ဘဲဥပုံ ဖြစ်ပါမယ်။
      ရာခိုင်နှုန်းကို အလျားလိုက်မှာ အကျယ်ကနေ၊ ဒေါင်လိုက်မှာ အမြင့်ကနေ တွက်လို့ပါ။
    sources:
      - title: "web.dev Learn CSS — Borders: border radius"
        url: "https://web.dev/learn/css/borders#border_radius"
      - title: "MDN — border-radius"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/border-radius"
      - title: "CSS Backgrounds and Borders Module Level 3 — corner overlap (radii are scaled down)"
        url: "https://www.w3.org/TR/css-backgrounds-3/#corner-overlap"
    actions:
      - id: type-radius
        type: editor.type
        at: { mark: type-radius }
        cadence: fast-explainer
        target: { file: styles.css, after: "  border-bottom: 6px solid seagreen;\n", occurrence: 1 }
        text: "  border-radius: 16px;\n"
      - id: expect-radius
        type: expect.preview
        at: { mark: after-radius }
        timeoutMs: 4000
        target: { by: testId, value: card-lime-juice }
        textContains: "1,200 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: scroll-bottom
        type: preview.scroll
        at: { mark: scroll-bottom }
        timeoutMs: 5000
        top: 2000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-pill
        type: editor.type
        at: { mark: type-pill }
        cadence: fast-explainer
        target:
          {
            file: styles.css,
            after: ".style-badge:nth-child(5) { border-style: ridge; }\n",
            occurrence: 1,
          }
        text: "\n.order-btn {\n  border-radius: 9999px;\n}\n"
      - id: expect-pill
        type: expect.preview
        at: { mark: after-pill }
        timeoutMs: 4000
        target: { by: testId, value: order-button }
        textContains: "မှာမယ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-circle
        type: editor.type
        at: { mark: type-circle }
        cadence: fast-explainer
        target: { file: styles.css, after: "  border-radius: 9999px;\n}\n", occurrence: 1 }
        text: "\n.owner {\n  border-radius: 50%;\n}\n"
      - id: expect-circle
        type: expect.preview
        at: { mark: after-circle }
        timeoutMs: 4000
        target: { by: testId, value: owner }
        attribute: { name: aria-label, value: "ဆိုင်ရှင်ရဲ့ ဓာတ်ပုံ" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: corner-order
    narration: >
      [[mark:open-corners]] တန်ဖိုး တစ်ခုပဲ ပေးရင် ထောင့် လေးခုလုံးကို တူတူ ဝိုင်းပြီး၊
      တန်ဖိုး လေးခုအထိ ပေးလို့ ရပါတယ်။ [[mark:draw-order]] ဘယ်အပေါ်ထောင့်ကနေ စပြီး
      နာရီလက်တံ အတိုင်း သွားပါတယ်။ ဘယ်အပေါ်၊ ညာအပေါ်၊ ညာအောက်၊ ပြီးမှ ဘယ်အောက်ထောင့်ပါ။
      [[mark:draw-trap]] margin ရဲ့ အပေါ်၊ ညာ၊ အောက်၊ ဘယ် ဆိုတဲ့ ဘေး လေးဘက်နဲ့ မရောပါနဲ့။
      ဒီမှာ ပေးနေတာက ဘေးတွေ မဟုတ်ဘဲ ထောင့်တွေပါ။ [[mark:draw-two]] တန်ဖိုး နှစ်ခု ပေးရင်၊
      ပထမ တန်ဖိုးက ဘယ်အပေါ်နဲ့ ညာအောက်ထောင့်အတွက်၊ ဒုတိယက ကျန်တဲ့ ထောင့် နှစ်ခုအတွက်
      ဖြစ်ပါတယ်။ [[mark:draw-longhands]] ထောင့်တိုင်းမှာ border top left radius လို
      ကိုယ်ပိုင် longhand လည်း ရှိပါတယ်။ [[mark:draw-logical]] lesson 21 က border start
      start radius လို logical နာမည်တွေကတော့ စာ ရေးတဲ့ ဦးတည်ရာကို လိုက်ပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Borders: border radius (shorthand order)"
        url: "https://web.dev/learn/css/borders#border_radius"
      - title: "MDN — border-radius (1 to 4 values, from the top-left corner)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/border-radius"
      - title: "MDN — border-start-start-radius"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/border-start-start-radius"
    actions:
      - id: open-corners
        type: whiteboard.apply
        at: { mark: open-corners }
        open: true
        clear: true
        upsertIds: [b-title, b-box]
      - id: draw-order
        type: whiteboard.apply
        at: { mark: draw-order }
        upsertIds: [b-1, b-arrow, b-2, b-3, b-4, b-cw, b-cw2]
        drawMs: 3600
      - id: draw-trap
        type: whiteboard.apply
        at: { mark: draw-trap }
        upsertIds: [b-trap]
        drawMs: 1200
      - id: draw-two
        type: whiteboard.apply
        at: { mark: draw-two }
        upsertIds: [b-two]
        drawMs: 1400
      - id: draw-longhands
        type: whiteboard.apply
        at: { mark: draw-longhands }
        upsertIds: [b-long]
        drawMs: 1400
      - id: draw-logical
        type: whiteboard.apply
        at: { mark: draw-logical }
        upsertIds: [b-logical]
        drawMs: 1600

  - id: elliptical
    narration: >
      [[mark:close-corners]] အခုထိ ထောင့်တိုင်းက စက်ဝိုင်းရဲ့ လေးပုံ တစ်ပုံ ဖြစ်ခဲ့ပါတယ်။
      [[mark:type-leaf]] ထောင့်ကို ဘဲဥပုံရဲ့ လေးပုံ တစ်ပုံလည်း လုပ်လို့ ရပါတယ်။
      အလျားလိုက်နဲ့ ဒေါင်လိုက် radius ကို မတူအောင် ပေးရတာပါ။ အစိမ်းရောင် badge မှာ
      အလျားလိုက် တန်ဖိုး လေးခု၊ မျဉ်းစောင်း တစ်ခု၊ ပြီးမှ ဒေါင်လိုက် တန်ဖိုး လေးခု
      ရေးပါမယ်။ [[mark:after-leaf]] စတုရန်းက လက်ဖက်ရွက်လို မညီမညာ ကွေးနေတဲ့ ပုံလေး
      ဖြစ်သွားပါပြီ။ [[mark:select-slash]] ဒီ တန်ဖိုး ရှစ်ခုကို ကြည့်ပါ။ မျဉ်းစောင်း ရှေ့က
      အလျားလိုက်၊ နောက်က ဒေါင်လိုက် radius တွေ ဖြစ်ပြီး၊ နှစ်စုလုံး နာရီလက်တံ အစဉ်ပါ။
      [[mark:explain-longhand-ellipse]] ထောင့် တစ်ခုတည်းရဲ့ longhand မှာတော့ radius
      နှစ်ခုကို မျဉ်းစောင်း မပါဘဲ space နဲ့ပဲ ခြားရေးပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Borders: border radius (elliptical corners)"
        url: "https://web.dev/learn/css/borders#border_radius"
      - title: "MDN — border-radius (the slash separates horizontal and vertical radii)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/border-radius#syntax"
      - title: "MDN — border-top-left-radius (two values, no slash)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/border-top-left-radius"
    actions:
      - id: close-corners
        type: whiteboard.apply
        at: { mark: close-corners }
        open: false
      - id: type-leaf
        type: editor.type
        at: { mark: type-leaf }
        cadence: fast-explainer
        target: { file: styles.css, after: "  border-radius: 50%;\n}\n", occurrence: 1 }
        text: "\n.leaf-badge {\n  border-radius: 60% 40% 60% 40% / 40% 60% 40% 60%;\n}\n"
      - id: expect-leaf
        type: expect.preview
        at: { mark: after-leaf }
        timeoutMs: 4000
        target: { by: testId, value: leaf-badge }
        attribute: { name: aria-hidden, value: "true" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-slash
        type: editor.select
        at: { mark: select-slash }
        target: { file: styles.css, text: "60% 40% 60% 40% / 40% 60% 40% 60%", occurrence: 1 }

  - id: border-image
    chapter: "Border image"
    narration: >
      [[mark:scroll-special]] ဒီနေ့ အထူး card ဆီ ပြန်တက်ရအောင်။ သူ့ကို ပိုထူးခြားတဲ့ ဘောင်
      ပေးချင်ပါတယ်။ [[mark:type-featured]] featured card အတွက် rule အသစ်မှာ၊ အရောင် မပါဘဲ
      10 pixel ထူတဲ့ မျဉ်းဖြောင့် border ပေးပါမယ်။ ပထမ card ကို လိုက်ကြည့်ပါ။
      [[mark:after-featured]] အညိုနီရောင် ဘောင် ထူထူ ပေါ်လာပါပြီ။ ဒီတစ်ခါလည်း စာလုံး
      အရောင်ကို ယူသုံးတာပါ။ [[mark:type-bimage]] border image ကတော့ မျဉ်းအစား ပုံ
      တစ်ပုံနဲ့ ဘောင်ကို ဆွဲပေးပါတယ်။ lesson 32 က gradient ကလည်း ပုံ ဖြစ်လို့၊ အစိမ်းကနေ
      ရွှေရောင် ကူးတဲ့ gradient ပေးပါမယ်။ ပြီးမှ ဂဏန်း 1 ကို ထည့်ပါမယ်။
      [[mark:after-bimage]] ဘောင်က gradient ဖြစ်သွားပါပြီ။ [[mark:explain-order]] ဒီ
      border နဲ့ border image ကို ကြည့်ပါ။ shorthand က border image ကို default
      ပြန်ထားလို့၊ border image ကို နောက်မှ တမင် ရေးထားတာပါ။ [[mark:explain-width]] ပုံကို
      border ရဲ့ အထူအတိုင်း ဆွဲပါတယ်။ style က none ဖြစ်ရင် အထူ သုည ဖြစ်သွားလို့၊
      မျဉ်းဖြောင့် style ကို ထားခဲ့ရတာပါ။ [[mark:explain-square]] ထောင့်တွေကို ကြည့်ပါ။
      border radius က border image ကို မဝိုင်းပေးလို့၊ ဒီ ဘောင်က ထောင့်ချွန် ဖြစ်နေပါတယ်။
      [[mark:select-source]] ဒီ gradient ကို ကြည့်ပါ။ သူ့နေရာမှာ url နဲ့ ပေးတဲ့ ပုံ
      ဖိုင်ကိုလည်း သုံးလို့ ရပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Borders: border images"
        url: "https://web.dev/learn/css/borders#border_images"
      - title: "MDN — border-image"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/border-image"
      - title: "MDN — border-image-source (an image or a gradient)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/border-image-source"
      - title: "CSS Backgrounds and Borders Module Level 3 — border images (not clipped by border-radius)"
        url: "https://www.w3.org/TR/css-backgrounds-3/#border-images"
    actions:
      - id: scroll-special
        type: preview.scroll
        at: { mark: scroll-special }
        timeoutMs: 5000
        top: 0
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-featured
        type: editor.type
        at: { mark: type-featured }
        cadence: fast-explainer
        target:
          {
            file: styles.css,
            after: "  border-radius: 60% 40% 60% 40% / 40% 60% 40% 60%;\n}\n",
            occurrence: 1,
          }
        text: "\n.featured {\n  border: 10px solid;\n}\n"
      - id: expect-featured
        type: expect.preview
        at: { mark: after-featured }
        timeoutMs: 4000
        target: { by: testId, value: card-laphet-yay }
        attribute: { name: class, value: "menu-card featured" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-bimage
        type: editor.type
        at: { mark: type-bimage }
        cadence: fast-explainer
        target: { file: styles.css, after: "  border: 10px solid;\n", occurrence: 1 }
        text: "  border-image: linear-gradient(135deg, #2f6b3a, #c9a227) 1;\n"
      - id: expect-bimage
        type: expect.preview
        at: { mark: after-bimage }
        timeoutMs: 4000
        target: { by: testId, value: badge-laphet-yay }
        textContains: "အသစ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-order
        type: editor.select
        at: { mark: explain-order }
        target: { file: styles.css, text: "  border: 10px solid;\n  border-image", occurrence: 1 }
      - id: select-source
        type: editor.select
        at: { mark: select-source }
        target:
          { file: styles.css, text: "linear-gradient(135deg, #2f6b3a, #c9a227)", occurrence: 1 }

  - id: nine-slices
    narration: >
      [[mark:open-slice]] ဒါဆို 1 က ဘာအတွက်လဲ။ [[mark:draw-grid]] browser က ဖြတ်မျဉ်း
      လေးကြောင်းနဲ့ ပုံကို ကိုးပိုင်း ပိုင်းပါတယ်။ အဲဒီ ဂဏန်းက slice ဖြစ်ပြီး၊ ပုံရဲ့
      အစွန်းကနေ pixel ဘယ်နှခု အထဲဝင်ပြီး ဖြတ်မလဲ ဆိုတာပါ။ [[mark:draw-corners]] ထောင့်
      အပိုင်း လေးခုက box ရဲ့ ထောင့် လေးခုမှာ ရောက်သွားပါတယ်။ [[mark:draw-edges]] ဘေး
      အပိုင်း လေးခုကတော့ ထောင့်တွေကြားက ဘေးတွေကို ဖြည့်ပါတယ်။ [[mark:draw-middle]] အလယ်
      အပိုင်းကိုတော့ default မှာ မဆွဲပါဘူး။ fill keyword ထည့်မှပဲ box ရဲ့ အထဲမှာ
      ဆွဲပေးပါတယ်။ [[mark:explain-one]] slice က 1 ဖြစ်တော့ ထောင့် အပိုင်းတွေက ပုံရဲ့ 1
      pixel ပဲ ရှိပြီး၊ border အထူအထိ ဆွဲဆန့်ပါတယ်။ ဘေးတွေကလည်း gradient အစွန်းက အစင်း
      ပါးပါးလေးတွေကို ဘေးတစ်လျှောက် ဆွဲဆန့်ထားတာပါ။ [[mark:draw-repeat]] border image
      repeat က ဘေး အပိုင်းတွေကို ဘယ်လို ဖြည့်မလဲ ဆုံးဖြတ်ပါတယ်။ default ဖြစ်တဲ့ stretch က
      ဆွဲဆန့်ပါတယ်။ repeat က ထပ်ခါ စီလို့ အစွန်းက အကွက်တွေ ပြတ်နိုင်ပါတယ်။ round က အကွက်
      အပြည့်တွေ ဆံ့အောင် အရွယ် ညှိပြီး၊ space က အကွက်တွေကြားမှာ နေရာလွတ် ထည့်ပါတယ်။
      [[mark:draw-width]] border image width က ပုံကို ဘယ်လောက် ထူထူ ဆွဲမလဲ ဆိုတာ ဖြစ်ပြီး၊
      border image outset ကတော့ ဘာမှ မရွှေ့ဘဲ ပုံကို box အပြင်ထိ ထုတ်ဆွဲပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Borders: border-image-slice"
        url: "https://web.dev/learn/css/borders#border-image-slice"
      - title: "web.dev Learn CSS — Borders: border-image-repeat"
        url: "https://web.dev/learn/css/borders#border-image-repeat"
      - title: "MDN — border-image-slice (nine regions; fill keeps the middle)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/border-image-slice"
      - title: "MDN — border-image-repeat"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/border-image-repeat"
      - title: "MDN — border-image-width"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/border-image-width"
      - title: "MDN — border-image-outset"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/border-image-outset"
    actions:
      - id: open-slice
        type: whiteboard.apply
        at: { mark: open-slice }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-grid
        type: whiteboard.apply
        at: { mark: draw-grid }
        upsertIds: [c-tl, c-t, c-tr, c-l, c-m, c-r, c-bl, c-b, c-br, c-slice-l]
        drawMs: 3200
      - id: draw-corners
        type: whiteboard.apply
        at: { mark: draw-corners }
        upsertIds: [c-corner-l]
        drawMs: 1200
      - id: draw-edges
        type: whiteboard.apply
        at: { mark: draw-edges }
        upsertIds: [c-edge-l]
        drawMs: 1200
      - id: draw-middle
        type: whiteboard.apply
        at: { mark: draw-middle }
        upsertIds: [c-middle-l]
        drawMs: 1200
      - id: draw-repeat
        type: whiteboard.apply
        at: { mark: draw-repeat }
        upsertIds: [c-repeat]
        drawMs: 1600
      - id: draw-width
        type: whiteboard.apply
        at: { mark: draw-width }
        upsertIds: [c-width]
        drawMs: 1600

  - id: shadow-kinds
    chapter: "အရိပ် သုံးမျိုး"
    narration: >
      [[mark:open-shadows]] အခု အရိပ်တွေ ကြည့်ရအောင်။ CSS မှာ အရိပ် သုံးမျိုး ရှိပြီး၊
      အရိပ်က ဘာကို လိုက်ရမလဲ ဆိုတာနဲ့ ရွေးရပါတယ်။ [[mark:draw-box-shadow]] box shadow က
      box ရဲ့ နောက်မှာ အရိပ် ထည့်ပါတယ်။ [[mark:draw-text-shadow]] text shadow ကတော့
      စာလုံးတွေ နောက်မှာ အရိပ် ထည့်ပါတယ်။ [[mark:draw-drop-shadow]] drop shadow ကတော့
      lesson 36 မှာ တွေ့ရမယ့် filter တစ်ခုပါ။ box ကို မဟုတ်ဘဲ ပုံထဲက ပုံသဏ္ဌာန်ကို
      လိုက်ပါတယ်။ နောက်ခံ ဖောက်ထွင်း မြင်ရတဲ့ ခွက် ပုံဆိုရင်၊ ခွက်ရဲ့ ပုံအတိုင်း အရိပ်
      ကျပါတယ်။ [[mark:draw-values]] box shadow မှာ ဘယ်လောက် ရွှေ့မလဲ ဆိုတဲ့ x နဲ့ y offset
      ပါပြီး၊ blur နဲ့ spread ကို မပေးလည်း ရပါတယ်။ နောက်ဆုံးက အရောင်ပါ။ တစ်ခုချင်း
      စမ်းကြည့်ရအောင်။
    sources:
      - title: "web.dev Learn CSS — Shadows"
        url: "https://web.dev/learn/css/shadows"
      - title: "MDN — box-shadow"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/box-shadow"
      - title: "MDN — drop-shadow()"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/filter-function/drop-shadow"
    actions:
      - id: open-shadows
        type: whiteboard.apply
        at: { mark: open-shadows }
        open: true
        clear: true
        upsertIds: [d-title]
      - id: draw-box-shadow
        type: whiteboard.apply
        at: { mark: draw-box-shadow }
        upsertIds: [d-box-sh, d-box, d-box-l, d-box-f]
        drawMs: 1600
      - id: draw-text-shadow
        type: whiteboard.apply
        at: { mark: draw-text-shadow }
        upsertIds: [d-letter-sh, d-letter, d-letter-l, d-letter-f]
        drawMs: 1400
      - id: draw-drop-shadow
        type: whiteboard.apply
        at: { mark: draw-drop-shadow }
        upsertIds: [d-shape-sh, d-shape, d-shape-l, d-shape-f]
        drawMs: 1600
      - id: draw-values
        type: whiteboard.apply
        at: { mark: draw-values }
        upsertIds: [d-values]
        drawMs: 1800

  - id: box-shadow
    chapter: "Box shadow"
    narration: >
      [[mark:close-shadows]] card တွေဆီ ပြန်သွားရအောင်။ [[mark:type-hard]] ဖိုင် အဆုံးမှာ
      card တွေအတွက် ဒုတိယ rule ထည့်ပါမယ်။ ညာနဲ့ အောက်ကို 8 pixel စီ ရွှေ့ထားပြီး blur
      မပါတဲ့ အမည်းရောင် အရိပ်ပါ။ card တွေကို လိုက်ကြည့်ပါ။ [[mark:after-hard]] card
      တိုင်းရဲ့ ညာဘက်နဲ့ အောက်မှာ အစွန်း ပြတ်ပြတ် အမည်းရောင် အရိပ် ပေါ်လာပါပြီ။ x က
      အပေါင်း ဆိုရင် အရိပ်က ညာကို ရွေ့ပြီး၊ y က အပေါင်း ဆိုရင် အောက်ကို ရွေ့ပါတယ်။
      [[mark:explain-no-layout]] တခြား ဘာမှ မရွေ့ပါဘူး။ lesson 2 မှာ ပြောခဲ့သလို အရိပ်က
      နေရာ မယူလို့ပါ။ [[mark:type-left]] အောက်မှာ x ကို အနုတ် 8 ပေးပြီး၊ y ကို ဒီအတိုင်း
      ထားပါမယ်။ အရိပ် ဘယ်လို ပြောင်းမလဲ လိုက်ကြည့်ပါ။ [[mark:after-left]] အရိပ်က ဘယ်ဘက်ကို
      ရွေ့သွားပါပြီ။ [[mark:type-blur]] ပြီးတော့ x ကို သုည၊ y ကို 8 ထားပြီး၊ 20 pixel
      ရှိတဲ့ blur ထည့်ပါမယ်။ [[mark:after-blur]] အရိပ် အစွန်းတွေ ဝါးသွားပါပြီ။ blur များလေ
      အရိပ်က ပိုကျယ်ပြီး ပိုဖျော့လေ ဖြစ်ပါတယ်။ blur ကိုတော့ အနုတ် ပေးလို့ မရပါဘူး။
      [[mark:type-alpha]] အမည်းရောင် သက်သက်က ရင့်လွန်းလို့၊ lesson 9 မှာ တွေ့ခဲ့တဲ့ rgb
      နဲ့ alpha ကို သုံးပြီး၊ 20 ရာခိုင်နှုန်းပဲ မြင်ရတဲ့ အမည်းရောင် ပေးကြည့်ရအောင်။
      [[mark:after-alpha]] အခု card တွေက page ပေါ်မှာ နည်းနည်းလေး ကြွနေပါပြီ။ ဖောက်ထွင်း
      မြင်ရတဲ့ အရိပ်က ပိုသဘာဝ ကျပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Shadows: box shadow"
        url: "https://web.dev/learn/css/shadows#box_shadow"
      - title: "MDN — box-shadow (offsets, blur radius; no effect on layout)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/box-shadow"
      - title: "CSS Backgrounds and Borders Module Level 3 — box-shadow"
        url: "https://www.w3.org/TR/css-backgrounds-3/#box-shadow"
    actions:
      - id: close-shadows
        type: whiteboard.apply
        at: { mark: close-shadows }
        open: false
      - id: type-hard
        type: editor.type
        at: { mark: type-hard }
        cadence: fast-explainer
        target: { file: styles.css, after: "#c9a227) 1;\n}\n", occurrence: 1 }
        text: "\n.menu-card {\n  box-shadow: 8px 8px 0 black;\n}\n"
      - id: expect-hard
        type: expect.preview
        at: { mark: after-hard }
        timeoutMs: 4000
        target: { by: testId, value: card-coffee }
        textContains: "ကော်ဖီ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-left
        type: editor.type
        at: { mark: type-left }
        cadence: fast-explainer
        target: { file: styles.css, after: "  box-shadow: 8px 8px 0 black;\n", occurrence: 1 }
        text: "  box-shadow: -8px 8px 0 black;\n"
      - id: expect-left
        type: expect.preview
        at: { mark: after-left }
        timeoutMs: 4000
        target: { by: testId, value: card-lime-juice }
        textContains: "သံပုရာရည်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-blur
        type: editor.type
        at: { mark: type-blur }
        cadence: fast-explainer
        target: { file: styles.css, after: "  box-shadow: -8px 8px 0 black;\n", occurrence: 1 }
        text: "  box-shadow: 0 8px 20px black;\n"
      - id: expect-blur
        type: expect.preview
        at: { mark: after-blur }
        timeoutMs: 4000
        target: { by: testId, value: card-coffee }
        textContains: "1,800 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-alpha
        type: editor.type
        at: { mark: type-alpha }
        cadence: fast-explainer
        target: { file: styles.css, after: "  box-shadow: 0 8px 20px black;\n", occurrence: 1 }
        text: "  box-shadow: 0 8px 20px rgb(0 0 0 / 20%);\n"
      - id: expect-alpha
        type: expect.preview
        at: { mark: after-alpha }
        timeoutMs: 4000
        target: { by: testId, value: card-laphet-yay }
        textContains: "လက်ဖက်ရည်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: spread
    narration: >
      [[mark:type-ring]] blur ရဲ့ နောက်က ဂဏန်းက spread ဖြစ်ပြီး၊ blur မလုပ်ခင် အရိပ်ကို
      ချဲ့ပေးပါတယ်။ offset မပါ၊ blur မပါဘဲ spread ကို 4 pixel နဲ့ အစိမ်းရောင် ပေးရင်၊
      ကွင်း တစ်ခု ရပါတယ်။ [[mark:after-ring]] card တိုင်းရဲ့ border အပြင်ဘက်မှာ 4 pixel
      ထူတဲ့ အစိမ်းရောင် ကွင်း ပေါ်လာပြီး၊ ကွင်းက ထောင့်ဝိုင်းတွေကိုပါ လိုက်ပါတယ်။
      [[mark:explain-spread]] ဒီ spread ကို အနုတ် ပေးရင်တော့ အရိပ်က ကျုံ့သွားပါတယ်။
      [[mark:explain-color]] အရောင်ကို မရေးရင် border လိုပဲ currentColor ကို သုံးပါတယ်။
      ဒါပေမဲ့ အမြဲ ရေးထားတာက ပိုရှင်းပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Shadows: box shadow (spread, color)"
        url: "https://web.dev/learn/css/shadows#box_shadow"
      - title: "MDN — box-shadow (spread radius; color defaults to currentcolor)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/box-shadow#values"
    actions:
      - id: type-ring
        type: editor.type
        at: { mark: type-ring }
        cadence: fast-explainer
        target:
          { file: styles.css, after: "  box-shadow: 0 8px 20px rgb(0 0 0 / 20%);\n", occurrence: 1 }
        text: "  box-shadow: 0 0 0 4px seagreen;\n"
      - id: expect-ring
        type: expect.preview
        at: { mark: after-ring }
        timeoutMs: 4000
        target: { by: testId, value: card-coffee }
        textContains: "ကော်ဖီ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-spread
        type: editor.select
        at: { mark: explain-spread }
        target: { file: styles.css, text: "4px seagreen", occurrence: 1 }

  - id: layered
    chapter: "အရိပ် အလွှာ ထပ်ရအောင်"
    narration: >
      [[mark:type-layered]] သဘာဝကျတဲ့ အရိပ်တွေက များသောအားဖြင့် နှစ်ထပ်ပါ။ card နဲ့
      ကပ်နေတဲ့ သေးပြီး ပြတ်တဲ့ အရိပ်နဲ့၊ ပိုဝေးတဲ့ ကြီးပြီး ပျော့တဲ့ အရိပ်ကို comma နဲ့
      ခြားရေးပါတယ်။ [[mark:after-layered]] အခု card တွေက စားပွဲပေါ် တင်ထားတဲ့ စက္ကူလို
      ဖြစ်သွားပါပြီ။ [[mark:select-first]] စာရင်းထဲက ပထမ အရိပ်ကို ကြည့်ပါ။ lesson 32 က
      gradient အလွှာတွေလိုပဲ ပထမ အရိပ်ကို အပေါ်ဆုံးမှာ ဆွဲပြီး၊ ဘယ်နှခု ရေးရေး ကန့်သတ်ချက်
      မရှိပါဘူး။ [[mark:explain-radius]] အရိပ် နှစ်ခုလုံးက ထောင့်ဝိုင်းကို လိုက်ပါတယ်။
      [[mark:explain-overflow]] overflow hidden ပေးထားတဲ့ parent ကတော့ child တွေရဲ့
      အရိပ်ကို သူ့ အစွန်းမှာ ဖြတ်ပစ်ပါတယ်။ [[mark:scroll-form]] အခု အော်ဒါ form ထဲက field
      ကို ကြည့်ရအောင်။ [[mark:type-inset]] field အတွက် rule အသစ် ရေးပြီး၊ တန်ဖိုးတွေရဲ့
      ရှေ့မှာ inset keyword ကို ထည့်ပါမယ်။ inset က အရိပ်ကို box ရဲ့ အတွင်းဘက်မှာ ဆွဲလို့၊
      box ကို page ထဲ ဖိနှိပ်ထားသလို ဖြစ်စေပါတယ်။ field ကို လိုက်ကြည့်ပါ။
      [[mark:after-inset]] field ရဲ့ အတွင်းဘက် အပေါ်အစွန်း တစ်လျှောက် အရိပ် ဖျော့ဖျော့
      ပေါ်လာလို့၊ အထဲကို နစ်ဝင်နေသလို ဖြစ်သွားပါပြီ။ inset အရိပ်ကို နောက်ခံရဲ့ အပေါ်၊
      စာသားရဲ့ အောက်မှာ ဆွဲပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Shadows: multiple shadows"
        url: "https://web.dev/learn/css/shadows#multiple_shadows"
      - title: "web.dev Learn CSS — Shadows: properties affecting box-shadow (border-radius, overflow)"
        url: "https://web.dev/learn/css/shadows#properties_affecting_box-shadow"
      - title: "MDN — box-shadow (inset; the first shadow is on top)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/box-shadow"
    actions:
      # line-by-line: every revealed line has balanced parentheses, and the
      # list stays invalid (the ring keeps painting) until its last line lands.
      - id: type-layered
        type: editor.type
        at: { mark: type-layered }
        cadence: line-by-line
        target: { file: styles.css, after: "  box-shadow: 0 0 0 4px seagreen;\n", occurrence: 1 }
        text: "  box-shadow:\n    0 1px 2px rgb(0 0 0 / 15%),\n    0 8px 24px rgb(0 0 0 / 12%);\n"
      - id: expect-layered
        type: expect.preview
        at: { mark: after-layered }
        timeoutMs: 4000
        target: { by: testId, value: card-lime-juice }
        textContains: "1,200 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-first
        type: editor.select
        at: { mark: select-first }
        target: { file: styles.css, text: "0 1px 2px rgb(0 0 0 / 15%),", occurrence: 1 }
      - id: scroll-form
        type: preview.scroll
        at: { mark: scroll-form }
        timeoutMs: 5000
        top: 2000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-inset
        type: editor.type
        at: { mark: type-inset }
        cadence: fast-explainer
        target: { file: styles.css, after: "    0 8px 24px rgb(0 0 0 / 12%);\n}\n", occurrence: 1 }
        text: "\n.order-form input {\n  box-shadow: inset 0 2px 4px rgb(0 0 0 / 20%);\n}\n"
      - id: expect-inset
        type: expect.preview
        at: { mark: after-inset }
        timeoutMs: 4000
        target: { by: testId, value: input-name }
        attribute: { name: placeholder, value: "ဥပမာ ကိုအောင်" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: text-shadow
    chapter: "Text shadow"
    narration: >
      [[mark:scroll-header]] အပေါ်ဆုံးက ဆိုင် နာမည်ဆီ ပြန်တက်ရအောင်။ [[mark:type-tshadow]]
      text shadow မှာလည်း x၊ y၊ မပေးလည်း ရတဲ့ blur နဲ့ အရောင် ရှိပါတယ်။ ညာနဲ့ အောက်ကို 2
      pixel စီ၊ blur မပါဘဲ အညိုဖျော့ရောင် အရိပ် ပေးကြည့်ရအောင်။ [[mark:after-tshadow]]
      နာမည်ရဲ့ နောက်မှာ အညိုဖျော့ရောင် အရိပ် ကပ်လျက် ပေါ်လာပါပြီ။ အရိပ်က box ကို မဟုတ်ဘဲ
      စာလုံးတိုင်းရဲ့ ပုံသဏ္ဌာန်ကို လိုက်ပါတယ်။ [[mark:type-stepped]] text shadow
      တွေကိုလည်း comma နဲ့ စာရင်းလုပ်လို့ ရပါတယ်။ 1 pixel စီ ပိုဝေးပြီး ပိုရင့်တဲ့ အရိပ်
      သုံးခုနဲ့ လှေကားထစ် အစွန်း လုပ်ပါမယ်။ [[mark:after-stepped]] အခု နာမည်က ကြွနေတဲ့
      ဆိုင်းဘုတ်လို ဖြစ်သွားပါပြီ။ [[mark:explain-no-spread]] ဒီ text shadow ကို ကြည့်ပါ။
      spread နဲ့ inset က box shadow မှာပဲ ရှိပြီး၊ သူ့မှာ မရှိပါဘူး။
      [[mark:explain-inherit]] box shadow နဲ့ မတူတာက text shadow က inherit ဖြစ်တာပါ။
      header မှာ ပေးခဲ့ရင် နာမည် အောက်က အင်္ဂလိပ် စာကြောင်းလည်း အရိပ် ရမှာပါ။
      [[mark:explain-transparent]] စာလုံးကို ဖောက်ထွင်း မြင်ရအောင် လုပ်ရင်တော့၊ စာလုံး
      အောက်က အရိပ်ကို ဖြတ်မထားလို့ စာလုံးထဲကနေ အရိပ်ကို ဖောက်မြင်ရပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Shadows: text shadow"
        url: "https://web.dev/learn/css/shadows#text_shadow"
      - title: "web.dev Learn CSS — Typography: text shadow"
        url: "https://web.dev/learn/css/typography#text-shadow"
      - title: "MDN — text-shadow (no spread, inherited)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/text-shadow"
      - title: "CSS Text Decoration Module Level 3 — text-shadow"
        url: "https://www.w3.org/TR/css-text-decor-3/#text-shadow-property"
    actions:
      - id: scroll-header
        type: preview.scroll
        at: { mark: scroll-header }
        timeoutMs: 5000
        top: 0
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-tshadow
        type: editor.type
        at: { mark: type-tshadow }
        cadence: fast-explainer
        target:
          {
            file: styles.css,
            after: "  box-shadow: inset 0 2px 4px rgb(0 0 0 / 20%);\n}\n",
            occurrence: 1,
          }
        text: "\n.shop-name {\n  text-shadow: 2px 2px 0 tan;\n}\n"
      - id: expect-tshadow
        type: expect.preview
        at: { mark: after-tshadow }
        timeoutMs: 4000
        target: { by: testId, value: shop-name }
        textContains: "ရွှေလက်ဖက်ရည်ဆိုင်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-stepped
        type: editor.type
        at: { mark: type-stepped }
        cadence: line-by-line
        target: { file: styles.css, after: "  text-shadow: 2px 2px 0 tan;\n", occurrence: 1 }
        text: "  text-shadow:\n    1px 1px 0 #c9a27e,\n    2px 2px 0 #a8845f,\n    3px 3px 0 #7a5a3b;\n"
      - id: expect-stepped
        type: expect.preview
        at: { mark: after-stepped }
        timeoutMs: 4000
        target: { by: testId, value: site-header }
        textContains: "Yangon · since 1998"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-tshadow
        type: editor.select
        at: { mark: explain-no-spread }
        target: { file: styles.css, text: "1px 1px 0 #c9a27e,", occurrence: 1 }

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:open-quiz]] မပြီးခင် မေးခွန်း နှစ်ခု မေးကြည့်ရအောင်။ border ကို style ပဲ
      ပေးထားရင် အထူနဲ့ အရောင်က ဘာ ဖြစ်မလဲ။ [[mark:quiz-1]] default ဖြစ်တဲ့ 3 pixel ရှိတဲ့
      medium နဲ့ currentColor ပါ။ ဒါကြောင့် ဥပမာ မျဉ်းဖြောင့်နဲ့ ပန်းရောင် ရင့်ရင့်ပဲ
      ရေးရင်လည်း border အပြည့် ရပါတယ်။ [[mark:ask-quiz-2]] box shadow မှာပဲ ရှိတဲ့ တန်ဖိုး
      နှစ်ခုက ဘာလဲ။ [[mark:quiz-2]] inset နဲ့ spread ပါ။ [[mark:recap]] ဒါဆို
      ပြန်ချုပ်ရရင်၊ border ကို style က ဖွင့်ပေးပြီး၊ အရောင် မပေးရင် စာလုံး အရောင်ကို
      လိုက်ပါတယ်။ border radius က ထောင့်ဝိုင်း ပေးပြီး၊ border image က ပုံကို ကိုးပိုင်း
      ပိုင်းပြီး ဘောင် ဆွဲပါတယ်။ box shadow က box ကို၊ text shadow က စာလုံးကို လိုက်ပြီး၊
      အရိပ်တွေက နေရာ မယူပါဘူး။ အရိပ် စာရင်းမှာတော့ ပထမ အရိပ်က အပေါ်ဆုံးပါ။
      [[mark:next-lesson]] ထောင့်ဝိုင်းက လေးထောင့် မဟုတ်တဲ့ ပုံ ရဖို့ အရိုးရှင်းဆုံး
      နည်းပါ။ နောက် lesson မှာတော့ clip path နဲ့ box ကို ကြိုက်တဲ့ ပုံသဏ္ဌာန် ဖြတ်တာ
      ကြည့်သွားပါမယ်။
    sources:
      - title: "web.dev Learn CSS — Borders: check your understanding"
        url: "https://web.dev/learn/css/borders#check_your_understanding"
      - title: "web.dev Learn CSS — Shadows: check your understanding"
        url: "https://web.dev/learn/css/shadows#check_your_understanding"
      - title: "web.dev Learn CSS — Paths, shapes, clipping and masking (next lesson)"
        url: "https://web.dev/learn/css/paths-shapes-clipping-masking"
    actions:
      - id: open-quiz
        type: whiteboard.apply
        at: { mark: open-quiz }
        open: true
        clear: true
        upsertIds: [e-title, e-q1]
      - id: draw-quiz-1
        type: whiteboard.apply
        at: { mark: quiz-1 }
        upsertIds: [e-a1]
        drawMs: 1400
      - id: draw-ask-quiz-2
        type: whiteboard.apply
        at: { mark: ask-quiz-2 }
        upsertIds: [e-q2]
        drawMs: 1400
      - id: draw-quiz-2
        type: whiteboard.apply
        at: { mark: quiz-2 }
        upsertIds: [e-a2]
        drawMs: 1200
      - id: expect-final-css
        type: expect.file
        at: { mark: recap }
        path: styles.css
