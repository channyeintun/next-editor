      # base.css: kit sections A, B, B2 and C minus the cards' border and
      # radius and the order button's radius (section D dropped). Section E:
      # a 32 px shop name, the badge row and squares, the owner photo stand-in
      # (a square with a gradient), the square leaf badge.
      base.css: |
        /*
          base.css: pinned, never typed during a lesson.
          The shop's palette and the page "furniture", so the CSS a lesson types can
          focus on one idea. Each lesson keeps only the sections it needs and drops
          any declaration that its own demo types or relies on being absent
          (COURSE-KIT.md, "Deriving a lesson workspace"). B2 travels with B (every
          lesson that keeps B keeps B2, except lesson 2, which types the reset).
          Section E holds the few lesson-specific rules a start state pins.
          Lesson 34 keeps A, B, B2 and C, minus the menu cards' border and corner
          radius and the order button's radius (the lesson types them); section D
          dropped. Section E pins a bigger shop name, the badge row, the owner photo
          stand-in and the leaf badge. No border, box shadow or text shadow on
          anything the lesson styles.
          Keep it free of the url, image-set and @-import functions (they switch on
          Vite's postcss step); images come from <img> or the pinned images.css.
        */

        /* == A. palette == */
        :root {
          color-scheme: light;
          --tea-dark: #3b2314;
          --tea: #8b5a2b;
          --tea-light: #c9a27e;
          --cream: #fff8ec;
          --paper: #fdf3e1;
          --leaf: #2f6b3a;
          --gold: #c9a227;
          --chili: #b23a2b;
          --ink: #2b1d14;
          --muted: #6b5a4c;
          --line: #e6d5bf;
          --radius: 12px;
        }

        /* == B. page == */
        body {
          margin: 0;
          font-family: "Noto Sans Myanmar", "Myanmar Sangam MN", "Myanmar MN", "Myanmar Text", "Padauk",
            system-ui, sans-serif;
          font-size: 16px;
          line-height: 1.8;
          color: var(--ink);
          background: var(--paper);
        }

        .page {
          padding: 0 16px 24px;
        }

        h1,
        h2,
        h3 {
          margin: 0 0 8px;
          line-height: 1.5;
        }

        h1 {
          font-size: 24px;
        }

        h2 {
          font-size: 20px;
        }

        h3 {
          font-size: 17px;
        }

        a {
          color: var(--tea);
        }

        /* Status lines that only expect.preview reads (kit.js data-report, data-say). */
        .visually-hidden {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip-path: inset(50%);
          white-space: nowrap;
        }

        /* == B2. reset (lesson 2 teaches it; every later lesson keeps it) == */
        *,
        *::before,
        *::after {
          box-sizing: border-box;
        }

        /* == C. furniture == */
        .site-header {
          padding: 16px;
          background: var(--tea-dark);
          color: var(--cream);
        }

        .site-header a {
          color: var(--cream);
        }

        .logo {
          display: block;
        }

        .tagline {
          margin: 0;
          color: var(--tea-light);
          font-size: 14px;
        }

        .nav ul {
          margin: 8px 0 0;
          padding: 0;
          list-style: none;
        }

        .hero {
          margin: 16px 0;
          padding: 16px;
          background: var(--cream);
          border-radius: var(--radius);
        }

        .menu {
          margin: 0;
          padding: 0;
          list-style: none;
        }

        .menu-card {
          margin: 0 0 12px;
          padding: 12px 16px;
          background: #fff;
        }

        .menu-card .name,
        .menu-card .desc {
          margin: 0;
        }

        .menu-card .desc {
          color: var(--muted);
          font-size: 14px;
        }

        .price {
          font-weight: 700;
          color: var(--tea);
        }

        .badge {
          padding: 0 8px;
          border-radius: 999px;
          background: var(--leaf);
          color: #fff;
          font-size: 13px;
        }

        .sold-out {
          opacity: 0.6;
        }

        .order-link,
        .order-btn {
          display: inline-block;
          padding: 6px 16px;
          border: 0;
          background: var(--tea);
          color: #fff;
          font: inherit;
          text-decoration: none;
        }

        .order-form label {
          display: block;
          margin-top: 8px;
        }

        .order-form input[type="text"],
        .order-form input[type="tel"],
        .order-form input[type="number"] {
          box-sizing: border-box;
          width: 100%;
          padding: 6px 10px;
          border: 1px solid var(--line);
          border-radius: 8px;
          background: #fff;
          font: inherit;
        }

        .order-btn {
          margin-top: 12px;
        }

        .gallery figure {
          margin: 0 0 12px;
        }

        .gallery img {
          display: block;
          max-width: 100%;
          height: auto;
          border-radius: var(--radius);
        }

        figcaption {
          color: var(--muted);
          font-size: 14px;
        }

        .hours-list {
          margin: 0;
          padding-left: 20px;
        }

        .site-footer {
          margin-top: 24px;
          padding: 16px;
          background: var(--tea-dark);
          color: var(--cream);
          font-size: 14px;
        }

        .site-footer a {
          color: var(--cream);
        }

        /* == E. lesson rules == */
        /* Lesson 34: a bigger shop name (for the text shadow), a row of five style
           badges, the owner photo stand-in (a square with a gradient) and a square
           leaf badge. Their borders, corners and shadows are typed in the lesson. */
        .shop-name {
          font-size: 32px;
        }

        .badge-row {
          display: flex;
          flex-wrap: wrap;
          gap: 12px;
          margin: 16px 0;
          padding: 0;
          list-style: none;
        }

        .style-badge {
          display: grid;
          place-items: center;
          width: 70px;
          height: 70px;
          background: #fff;
          color: var(--muted);
          font-size: 13px;
        }

        .owner-row {
          display: flex;
          align-items: center;
          gap: 24px;
          margin: 16px 0;
        }

        .owner {
          width: 96px;
          height: 96px;
          background-image: linear-gradient(135deg, var(--tea-light), var(--tea));
        }

        .leaf-badge {
          display: block;
          width: 64px;
          height: 64px;
          background: var(--leaf);
        }

        .owner-name {
          margin: 0;
          color: var(--muted);
        }
      styles.css: ""

