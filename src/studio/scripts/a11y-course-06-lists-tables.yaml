build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 2606

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  - id: intro
    chapter: "List က ဘာကြောင့် အရေးကြီးလဲ"
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ landmark နဲ့ heading တွေနဲ့ page ရဲ့ structure ကို ပြင်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့
      အဲဒီ အပိုင်းတွေ အထဲမှာ ရှိတဲ့ list နဲ့ table တွေကို ကြည့်ပါမယ်။ [[mark:draw-plain]] ဆိုင်ရဲ့ menu မှာ
      သောက်စရာ သုံးမျိုး ရှိပါတယ်။ အဲဒါကို စာပိုဒ် သုံးခုနဲ့ ရေးထားရင်၊ screen reader က စာကြောင်း
      တစ်ကြောင်းချင်းကိုပဲ ဖတ်ပြမှာပါ။ ဒါ စာရင်း တစ်ခု ဖြစ်မှန်းရော၊ ဘယ်နှစ်ခု ပါမှန်းရော မသိရပါဘူး။
      [[mark:draw-list]] list element နဲ့ ရေးထားရင်တော့ screen reader က list ဖြစ်ကြောင်းနဲ့ item သုံးခု
      ပါကြောင်း အရင် ပြောပြီး၊ item တစ်ခုချင်းမှာ သုံးခုထဲက ပထမ၊ ဒုတိယ ဆိုတာမျိုး ဖတ်ပြတတ်ပါတယ်။ ဒါကြောင့်
      နားထောင်တဲ့သူက စာရင်း ဘယ်လောက် ရှည်လဲ၊ ဘယ်နေရာ ရောက်နေပြီလဲ သိနေပါတယ်။ ကြားရမယ့် စကားလုံး
      အတိအကျကတော့ screen reader တစ်ခုနဲ့ တစ်ခု မတူပါဘူး။ [[mark:draw-sighted]] list က မျက်စိနဲ့
      ဖတ်တဲ့သူတွေကိုလည်း ကူညီပါတယ်။ အချက်တွေကို တိုတိုနဲ့ ခွဲပြီး နေရာလွတ်နဲ့ ပြတဲ့အတွက်၊ စာဖတ်ရ
      ခက်တဲ့သူ၊ အာရုံစူးစိုက်ရ ခက်တဲ့သူတွေအတွက် ဖတ်ရတာ ပိုအဆင်ပြေပါတယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: Content structure (Lists)",
          url: "https://web.dev/learn/accessibility/structure#lists",
        }
      - {
          title: "W3C WAI: Page Structure Tutorial, Content (Lists)",
          url: "https://www.w3.org/WAI/tutorials/page-structure/content/#lists",
        }
    actions:
      - id: start-dev-server
        type: runtime.start
        at: { scene: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: open-board-a
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [l06-a-title]
      - id: draw-plain
        type: whiteboard.apply
        at: { mark: draw-plain }
        upsertIds: [l06-a-plain, l06-a-p1, l06-a-p2, l06-a-p3, l06-a-plain-note]
        drawMs: 2400
      - id: draw-list
        type: whiteboard.apply
        at: { mark: draw-list }
        upsertIds: [l06-a-list, l06-a-l1, l06-a-l2, l06-a-l3, l06-a-list-note]
        drawMs: 2600
      - id: draw-sighted
        type: whiteboard.apply
        at: { mark: draw-sighted }
        upsertIds: [l06-a-sighted]
        drawMs: 1200

  - id: code-tour
    narration: >
      [[mark:close-board-a]] ဆိုင်ရဲ့ code ကို ကြည့်ရအောင်။ [[mark:open-index]] ဒါက ပြီးခဲ့တဲ့ lesson ကနေ
      ဆက်လာတဲ့ HTML ဖိုင်ပါ။ header၊ main၊ footer တွေက landmark element တွေ ဖြစ်နေပါပြီ။
      [[mark:select-menu-div]] သောက်စရာ menu ကိုတော့ div တစ်ခုထဲမှာ စာပိုဒ် သုံးခုနဲ့ ရေးထားပါတယ်။
      [[mark:select-old-table]] ဖွင့်ချိန်ကို table နဲ့ ပြထားပေမယ့် cell တိုင်းက td ဖြစ်နေပြီး၊ header cell
      တစ်ခုမှ မပါပါဘူး။ [[mark:preview-opens]] ညာဘက်မှာ ဆိုင်ရဲ့ page ကို မြင်ရပါပြီ။ မျက်စိနဲ့ ကြည့်ရင်
      menu က စာရင်းလိုပဲ မြင်ရပါတယ်။ ဒီတစ်ခါ accessibility panel
      က main ထဲက အရာတွေကိုပဲ ပြထားပါတယ်။ [[mark:point-menu]] သောက်စရာ heading ရဲ့ အောက်မှာ menu အတွက်
      row တစ်ခုမှ မရှိဘဲ၊ နောက် heading ကို တန်းရောက်သွားပါတယ်။ panel က ရိုးရိုး စာပိုဒ်တွေကို row
      အဖြစ် မပြလို့ပါ။ ဆိုလိုတာက ဒီ menu က screen reader အတွက် စာရင်း မဟုတ်ပါဘူး။
    sources:
      - {
          title: "web.dev Learn Accessibility: Content structure (Lists)",
          url: "https://web.dev/learn/accessibility/structure#lists",
        }
      - {
          title: "web.dev Learn Accessibility: Content structure (Tables)",
          url: "https://web.dev/learn/accessibility/structure#tables",
        }
    actions:
      - id: close-board-a
        type: whiteboard.apply
        at: { mark: close-board-a }
        open: false
      - id: open-index
        type: workspace.openFile
        at: { mark: open-index }
        path: index.html
      - id: select-menu-div
        type: editor.select
        at: { mark: select-menu-div }
        target:
          { file: index.html, text: '<div class="menu" data-testid="menu-old">', occurrence: 1 }
      - id: select-old-table
        type: editor.select
        at: { mark: select-old-table }
        target: { file: index.html, text: '<td data-testid="old-day">နေ့</td>', occurrence: 1 }
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { mark: preview-opens }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-dev-server }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-document-row
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: a11y-document }
        textContains: 'document "ရွှေလက်ဖက်ရည်ဆိုင်" lang="my"'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-main-scope
        type: expect.preview
        at: { afterAction: expect-document-row }
        timeoutMs: 5000
        target: { by: testId, value: a11y-main }
        textContains: "main"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: collapse-runner-dock
        type: runtime.collapseDock
        at: { afterAction: expect-main-scope }
      - id: expect-drinks-region
        type: expect.preview
        at: { mark: point-menu }
        timeoutMs: 5000
        target: { by: testId, value: a11y-drinks }
        textContains: 'region "သောက်စရာ"'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-drinks-heading
        type: expect.preview
        at: { afterAction: expect-drinks-region }
        timeoutMs: 5000
        target: { by: testId, value: a11y-drinks-title }
        textContains: 'heading level 2 "သောက်စရာ"'
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: make-a-list
    chapter: "စာပိုဒ်တွေကို list ပြောင်းရအောင်"
    narration: >
      [[mark:type-ul]] div ရဲ့ အောက်မှာ unordered list ဖြစ်တဲ့ ul ကို ထည့်ပြီး၊ သောက်စရာ တစ်မျိုးကို list
      item တစ်ခုစီ ထည့်ပါမယ်။ list item ကိုတော့ li element နဲ့ ရေးပါတယ်။ [[mark:hide-menu-div]]
      ပြီးခဲ့တဲ့ lesson ကလိုပဲ၊ ကိုယ့် project မှာ div အဟောင်းကို ဖျက်ရမှာ ဖြစ်ပေမယ့် ဒီမှာတော့ hidden နဲ့
      ဖျောက်ထားပါမယ်။ [[mark:after-ul]] panel ထဲမှာ item သုံးခု ပါတဲ့ list တစ်ခုနဲ့ list item သုံးခု
      ပေါ်လာပါပြီ။ page ပေါ်မှာလည်း item တစ်ခုချင်းရဲ့ ရှေ့မှာ အစက်လေးတွေ ပေါ်လာပါတယ်။ screen reader က
      အခု ဒီ menu ကို item သုံးခု ပါတဲ့ list အဖြစ် ဖတ်ပြမှာပါ။
    sources:
      - {
          title: "web.dev Learn Accessibility: Content structure (Lists)",
          url: "https://web.dev/learn/accessibility/structure#lists",
        }
      - { title: "MDN: <ul>", url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Element/ul" }
      - { title: "MDN: <li>", url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Element/li" }
    actions:
      - id: type-ul
        type: editor.type
        at: { mark: type-ul }
        cadence: block
        target:
          {
            file: index.html,
            after: "          <p>သံပုရာရည် · 1,200 ကျပ်</p>\n        </div>\n",
            occurrence: 1,
          }
        text: "        <ul class=\"menu-list\" data-testid=\"menu-drinks\">\n          <li>လက်ဖက်ရည် · 1,500 ကျပ်</li>\n          <li>ကော်ဖီ · 1,800 ကျပ်</li>\n          <li>သံပုရာရည် · 1,200 ကျပ်</li>\n        </ul>\n"
      - id: hide-menu-div
        type: editor.type
        at: { mark: hide-menu-div }
        cadence: block
        target: { file: index.html, after: '<div class="menu"', occurrence: 1 }
        text: " hidden"
      - id: expect-list-row
        type: expect.preview
        at: { mark: after-ul }
        timeoutMs: 5000
        target: { by: testId, value: a11y-menu-drinks }
        textContains: "list 3 items"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-menu-div-hidden
        type: expect.preview
        at: { afterAction: expect-list-row }
        timeoutMs: 5000
        target: { by: testId, value: menu-old }
        attribute: { name: hidden, value: "" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: list-kinds
    chapter: "List သုံးမျိုး"
    narration: >
      [[mark:open-board-b]] HTML မှာ list သုံးမျိုး ရှိပါတယ်။ [[mark:draw-ul]] ခုနက ul က အစဉ်
      အရေးမကြီးတဲ့ စာရင်းပါ။ menu မှာ ကော်ဖီကို အရင် ရေးရေး၊ လက်ဖက်ရည်ကို အရင် ရေးရေး အဓိပ္ပာယ်
      မပြောင်းပါဘူး။ [[mark:draw-ol]] ordered list ဖြစ်တဲ့ ol ကတော့ အစဉ် အရေးကြီးတဲ့ စာရင်းပါ။ ဥပမာ
      မှာယူနည်း အဆင့်တွေလို၊ အစဉ် ပြောင်းရင် အဓိပ္ပာယ် ပြောင်းသွားတဲ့ နေရာမှာ သုံးပါတယ်။ ul ရော ol ရော
      item တွေကို li နဲ့ပဲ ရေးပါတယ်။ [[mark:draw-dl]] description list ဖြစ်တဲ့ dl ကတော့ ဝေါဟာရနဲ့ သူ့
      ရှင်းချက်ကို တွဲပြတဲ့ စာရင်းပါ။ ဝေါဟာရကို dt နဲ့၊ ရှင်းချက်ကို dd နဲ့ ရေးပါတယ်။ ချိုဆိမ့် ဆိုတာ ဘာလဲ
      ဆိုတဲ့ ရှင်းချက်လိုမျိုးပါ။ [[mark:draw-panel-dl]] accessibility panel မှာဆိုရင် dl ကို list အဖြစ်၊ dt
      ကို term၊ dd ကို definition အဖြစ် ပြပါတယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: Content structure (Lists)",
          url: "https://web.dev/learn/accessibility/structure#lists",
        }
      - { title: "MDN: <ol>", url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Element/ol" }
      - { title: "MDN: <dl>", url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Element/dl" }
      - {
          title: "W3C HTML-AAM: dt (term) and dd (definition) mappings",
          url: "https://www.w3.org/TR/html-aam-1.0/#html-element-role-mappings",
        }
    actions:
      - id: open-board-b
        type: whiteboard.apply
        at: { mark: open-board-b }
        open: true
        clear: true
        upsertIds: [l06-b-title]
      - id: draw-ul
        type: whiteboard.apply
        at: { mark: draw-ul }
        upsertIds: [l06-b-ul, l06-b-ul-1, l06-b-ul-2, l06-b-ul-note]
        drawMs: 2000
      - id: draw-ol
        type: whiteboard.apply
        at: { mark: draw-ol }
        upsertIds: [l06-b-ol, l06-b-ol-1, l06-b-ol-2, l06-b-ol-3, l06-b-ol-note]
        drawMs: 2200
      - id: draw-dl
        type: whiteboard.apply
        at: { mark: draw-dl }
        upsertIds: [l06-b-dl, l06-b-dt, l06-b-dd, l06-b-dl-note]
        drawMs: 2000
      - id: draw-panel-dl
        type: whiteboard.apply
        at: { mark: draw-panel-dl }
        upsertIds: [l06-b-panel]
        drawMs: 1200

  - id: layout-table
    chapter: "Layout table နဲ့ data table"
    narration: >
      [[mark:close-board-b]] အခု table တွေဘက် ပြောင်းရအောင်။ table ကို သုံးတဲ့ နည်း နှစ်မျိုး ရှိပါတယ်။
      data တွေကို row နဲ့ column နဲ့ စီပြတဲ့ data table နဲ့၊ page ပေါ်မှာ အရာတွေကို နေရာချဖို့ပဲ သုံးတဲ့
      layout table ပါ။ [[mark:select-promo]] page ရဲ့ အပေါ်က ယနေ့အထူး အကွက်ကို ကြည့်ပါ။ ဆိုင်ရဲ့ email
      newsletter ကနေ ကူးလာတာမို့၊ ပုံနဲ့ စာကို ဘေးချင်း ယှဉ်ထားဖို့ table ကို သုံးထားပါတယ်။
      [[mark:point-promo]] panel ရဲ့ အပေါ်ဆုံးမှာ table၊ row၊ cell ဆိုပြီး row တွေ ပေါ်နေပါတယ်။ browser
      တွေက ဒီလို ဇယားမျိုးကို layout table လို့ ခန့်မှန်းပြီး ကျော်ပေးတတ်ပေမယ့်၊ ခန့်မှန်းချက် မှားရင် screen
      reader က ဇယား ဖြစ်ကြောင်း၊ column ဘယ်နှစ်ခု ပါကြောင်း ဖတ်ပြမိမှာပါ။ [[mark:type-presentation]] ဒါကြောင့်
      layout table ကို ဆက်သုံးရမယ်ဆိုရင် role presentation ကို ပေးပြီး ဇယားရဲ့ အဓိပ္ပာယ်ကို ကိုယ်တိုင်
      ဖြုတ်ပါ။ [[mark:after-presentation]] table၊ row၊ cell row တွေ ပျောက်သွားပါပြီ။ ပုံနဲ့ စာကတော့
      အရင်နေရာမှာပဲ ရှိနေပြီး၊ screen reader ကလည်း ယနေ့အထူး စာကို ရိုးရိုး စာအဖြစ် ဆက်ဖတ်ပြမှာပါ။ aria
      hidden နဲ့ ဖျောက်ရင်တော့ ဒီ စာပါ ပျောက်သွားမှာမို့ မသုံးပါနဲ့။ layout table ထဲမှာ th တို့ caption တို့လို data table အတွက် element တွေ
      မထည့်ရပါဘူး။ ဖြစ်နိုင်ရင်တော့ layout အတွက် table မသုံးဘဲ CSS ရဲ့ flexbox ဒါမှမဟုတ် grid ကို သုံးပါ။
    sources:
      - {
          title: "web.dev Learn Accessibility: Content structure (Tables: Layout)",
          url: "https://web.dev/learn/accessibility/structure#layout",
        }
      - {
          title: "MDN: ARIA presentation role",
          url: "https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/presentation_role",
        }
      - { title: "W3C WAI: Tables Tutorial", url: "https://www.w3.org/WAI/tutorials/tables/" }
      - {
          title: "WebAIM: Creating Accessible Tables (layout tables)",
          url: "https://webaim.org/techniques/tables/",
        }
      - {
          title: "MDN: aria-hidden (hides the content itself)",
          url: "https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Attributes/aria-hidden",
        }
    actions:
      - id: close-board-b
        type: whiteboard.apply
        at: { mark: close-board-b }
        open: false
      - id: select-promo
        type: editor.select
        at: { mark: select-promo }
        target:
          { file: index.html, text: '<table class="promo" data-testid="promo">', occurrence: 1 }
      - id: expect-promo-cell
        type: expect.preview
        at: { mark: point-promo }
        timeoutMs: 5000
        target: { by: testId, value: a11y-promo-text }
        textContains: 'cell "ယနေ့အထူး'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-promo-table
        type: expect.preview
        at: { afterAction: expect-promo-cell }
        timeoutMs: 5000
        target: { by: testId, value: a11y-promo }
        textContains: "table"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-presentation
        type: editor.type
        at: { mark: type-presentation }
        cadence: block
        target: { file: index.html, after: '<table class="promo"', occurrence: 1 }
        text: ' role="presentation"'
      - id: expect-promo-role
        type: expect.preview
        at: { mark: after-presentation }
        timeoutMs: 5000
        target: { by: testId, value: promo }
        attribute: { name: role, value: "presentation" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-list-first
        type: expect.preview
        at: { afterAction: expect-promo-role }
        timeoutMs: 5000
        target: { by: testId, value: a11y-menu-drinks }
        textContains: "list 3 items"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: data-table-problem
    chapter: "Data table ကို ပြင်ရအောင်"
    narration: >
      [[mark:scroll-panel-old]] ဖွင့်ချိန် ဇယားကို page ပေါ်မှာရော panel ထဲမှာပါ ကြည့်ရအောင်။ row တစ်ခုချင်းထဲမှာ cell တွေပဲ
      ရှိပြီး၊ ခေါင်းစဉ် cell တစ်ခုမှ မရှိပါဘူး။ [[mark:point-old-cell]] screen reader သုံးသူက ဇယားထဲမှာ
      ရွှေ့ကြည့်ရင်း မနက် ခုနစ် နာရီ ဆိုတဲ့ cell ကို ရောက်လာရင်၊ ဒါ ဘယ်နေ့အတွက်လဲ၊ ဖွင့်ချိန်လား ပိတ်ချိန်လား
      ဆိုတာ မကြားရပါဘူး။ မျက်စိနဲ့ ကြည့်တဲ့သူကတော့ page ပေါ်မှာ ထူထူ ရေးထားတဲ့ ပထမ row နဲ့ ပထမ column ကို
      ကြည့်ပြီး ခေါင်းစဉ်မှန်း သိပေမယ့်၊ အဲဒီ ထူထူ ဖြစ်နေတာက CSS သက်သက်ပါ။ header cell တွေကို th element နဲ့ ရေးမှပဲ data cell တိုင်းကို
      သူ့ ခေါင်းစဉ်နဲ့ ချိတ်ပေးနိုင်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: Content structure (Tables: Data)",
          url: "https://web.dev/learn/accessibility/structure#data",
        }
      - { title: "W3C WAI: Tables Tutorial", url: "https://www.w3.org/WAI/tutorials/tables/" }
      - {
          title: "W3C WAI: Understanding SC 1.3.1 Info and Relationships",
          url: "https://www.w3.org/WAI/WCAG22/Understanding/info-and-relationships.html",
        }
    actions:
      - id: scroll-panel-old
        type: preview.scroll
        at: { mark: scroll-panel-old }
        timeoutMs: 5000
        target: { by: testId, value: a11y-panel }
        top: 5000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: scroll-page-old
        type: preview.scroll
        at: { afterAction: scroll-panel-old }
        timeoutMs: 5000
        top: 5000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-old-header-cell
        type: expect.preview
        at: { afterAction: scroll-page-old }
        timeoutMs: 5000
        target: { by: testId, value: a11y-old-day }
        textContains: 'cell "နေ့"'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-old-data-cell
        type: expect.preview
        at: { mark: point-old-cell }
        timeoutMs: 5000
        target: { by: testId, value: a11y-old-open }
        textContains: 'cell "မနက် ၇ နာရီ"'
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: header-cells
    narration: >
      [[mark:type-new-table]] ဇယားအဟောင်းရဲ့ အောက်မှာ header cell တွေ ပါတဲ့ ဇယားအသစ်ကို ထည့်ပါမယ်။ [[mark:hide-old-table]]
      အဟောင်းကိုတော့ ခုနကလိုပဲ ဖျောက်ထားပါမယ်။ [[mark:select-th-col]] အပေါ်ဆုံး row က header cell တွေကို
      th နဲ့ ရေးပြီး scope col ပေးထားပါတယ်။ ဆိုလိုတာက ဒီ ခေါင်းစဉ်က သူ့အောက်က column တစ်ခုလုံးအတွက်
      ဖြစ်ပါတယ်။ [[mark:select-th-row]] row တိုင်းရဲ့ ပထမ cell ကလည်း th ဖြစ်ပြီး scope row ပါပါတယ်။ ဒီ
      ခေါင်းစဉ်က သူ့ ဘေးက row တစ်ခုလုံးအတွက်ပါ။ [[mark:scroll-panel-new]] panel ကို ကြည့်ပါ။ နေ့၊ ဖွင့်၊
      ပိတ် တွေက columnheader ဖြစ်ပြီး၊ နေ့ အမည်တွေက rowheader ဖြစ်လာပါပြီ။ ဒါဆို screen reader က မနက်
      ခုနစ် နာရီ ကို ဖတ်တဲ့အခါ၊ သူ့ row ခေါင်းစဉ်နဲ့ column ခေါင်းစဉ်ကို တွဲပြီး ဖတ်ပြနိုင်ပါပြီ။
      [[mark:explain-scope]] တကယ်တော့ ဒီလို ရိုးရှင်းတဲ့ ဇယားမှာ scope မပါလည်း၊ browser က data row ရဲ့
      ပထမ th ကို rowheader လို့ ခန့်မှန်းပေးပါတယ်။ panel ကလည်း Chrome လိုပဲ ခန့်မှန်းတာမို့၊ ဒီ row တွေက
      scope ကြောင့် ပြောင်းလာတာ မဟုတ်ပါဘူး။ scope က ခန့်မှန်းစရာ မလိုအောင် ကိုယ်တိုင် ရှင်းရှင်း ပြောလိုက်တာပါ။
      [[mark:select-thead]] header row ကို thead ထဲ၊ data row တွေကို tbody ထဲမှာ အုပ်စု ခွဲထားပါတယ်။
      thead၊ tbody နဲ့ tfoot တို့ရဲ့ role က rowgroup ပါ။ rowgroup ဆိုတဲ့ element ကတော့ HTML မှာ မရှိပါဘူး။
      panel က rowgroup ကို row အဖြစ် မပြပေမယ့်၊ Chrome DevTools ရဲ့ accessibility tree မှာတော့ မြင်ရပါတယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: Content structure (Tables: Data)",
          url: "https://web.dev/learn/accessibility/structure#data",
        }
      - {
          title: "MDN: <th> and the scope attribute",
          url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Element/th",
        }
      - {
          title: "W3C WAI: Tables with two headers",
          url: "https://www.w3.org/WAI/tutorials/tables/two-headers/",
        }
      - {
          title: "MDN: ARIA rowgroup role (thead, tbody, tfoot)",
          url: "https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/rowgroup_role",
        }
      - {
          title: "W3C HTML-AAM: th mapping (rowheader / columnheader)",
          url: "https://www.w3.org/TR/html-aam-1.0/#el-th",
        }
    actions:
      - id: type-new-table
        type: editor.type
        at: { mark: type-new-table }
        cadence: block
        target:
          {
            file: index.html,
            after: "            <td>ည ၉ နာရီ</td>\n          </tr>\n        </table>\n",
            occurrence: 1,
          }
        text: "        <table class=\"hours-table\" data-testid=\"hours-table\">\n          <thead>\n            <tr>\n              <th scope=\"col\">နေ့</th>\n              <th scope=\"col\" data-testid=\"col-open\">ဖွင့်</th>\n              <th scope=\"col\">ပိတ်</th>\n            </tr>\n          </thead>\n          <tbody>\n            <tr>\n              <th scope=\"row\" data-testid=\"hours-weekdays\">တနင်္လာ – သောကြာ</th>\n              <td>မနက် ၆ နာရီ</td>\n              <td>ည ၈ နာရီ</td>\n            </tr>\n            <tr>\n              <th scope=\"row\" data-testid=\"hours-weekend\">စနေ၊ တနင်္ဂနွေ</th>\n              <td>မနက် ၇ နာရီ</td>\n              <td>ည ၉ နာရီ</td>\n            </tr>\n          </tbody>\n        </table>\n"
      - id: hide-old-table
        type: editor.type
        at: { mark: hide-old-table }
        cadence: block
        target:
          {
            file: index.html,
            after: '<table class="hours-table" data-testid="hours-old"',
            occurrence: 1,
          }
        text: " hidden"
      - id: select-th-col
        type: editor.select
        at: { mark: select-th-col }
        target: { file: index.html, text: '<th scope="col">နေ့</th>', occurrence: 1 }
      - id: select-th-row
        type: editor.select
        at: { mark: select-th-row }
        target:
          { file: index.html, text: '<th scope="row" data-testid="hours-weekdays">', occurrence: 1 }
      - id: expect-old-hidden
        type: expect.preview
        at: { mark: scroll-panel-new }
        timeoutMs: 5000
        target: { by: testId, value: hours-old }
        attribute: { name: hidden, value: "" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: scroll-panel-new
        type: preview.scroll
        at: { afterAction: expect-old-hidden }
        timeoutMs: 5000
        target: { by: testId, value: a11y-panel }
        top: 5000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-columnheader
        type: expect.preview
        at: { afterAction: scroll-panel-new }
        timeoutMs: 5000
        target: { by: testId, value: a11y-col-open }
        textContains: 'columnheader "ဖွင့်"'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-rowheader
        type: expect.preview
        at: { afterAction: expect-columnheader }
        timeoutMs: 5000
        target: { by: testId, value: a11y-hours-weekend }
        textContains: 'rowheader "စနေ၊ တနင်္ဂနွေ"'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-thead
        type: editor.select
        at: { mark: select-thead }
        target: { file: index.html, text: "<thead>", occurrence: 1 }

  - id: caption
    narration: >
      [[mark:type-caption]] နောက်ဆုံး၊ ဇယားရဲ့ အပေါ်မှာ caption ကို ထည့်ပါမယ်။ caption က ဇယား တစ်ခုလုံး
      ဘာအကြောင်းလဲ ဆိုတာ ပြောတဲ့ ခေါင်းစဉ်ပါ။ [[mark:after-caption]] panel ထဲမှာ table row ရဲ့ name က
      တစ်ပတ်အတွင်း ဖွင့်ချိန် ဖြစ်လာပါပြီ။ screen reader က ဇယားထဲ မဝင်ခင် ဒီ နာမည်ကို အရင် ဖတ်ပြမှာမို့၊
      ဇယားထဲ ဝင်ကြည့်ဖို့ လိုမလို အသုံးပြုသူက ဆုံးဖြတ်နိုင်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: Content structure (Tables: Data)",
          url: "https://web.dev/learn/accessibility/structure#data",
        }
      - {
          title: "MDN: <caption>",
          url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Element/caption",
        }
      - {
          title: "W3C WAI: Caption & Summary",
          url: "https://www.w3.org/WAI/tutorials/tables/caption-summary/",
        }
    actions:
      - id: type-caption
        type: editor.type
        at: { mark: type-caption }
        cadence: block
        target:
          {
            file: index.html,
            after: "<table class=\"hours-table\" data-testid=\"hours-table\">\n",
            occurrence: 1,
          }
        text: "          <caption>တစ်ပတ်အတွင်း ဖွင့်ချိန်</caption>\n"
      - id: expect-table-name
        type: expect.preview
        at: { mark: after-caption }
        timeoutMs: 5000
        target: { by: testId, value: a11y-hours-table }
        textContains: 'table "တစ်ပတ်အတွင်း ဖွင့်ချိန်"'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-table-name-exact
        type: expect.preview
        at: { afterAction: expect-table-name }
        timeoutMs: 5000
        target: { by: testId, value: a11y-hours-table }
        attribute: { name: data-name, value: "တစ်ပတ်အတွင်း ဖွင့်ချိန်" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: complex-tables
    chapter: "ရှုပ်ထွေးတဲ့ ဇယား"
    narration: >
      [[mark:open-board-c]] ဆိုင်ခွဲ နှစ်ဆိုင်ရဲ့ ဖွင့်ချိန်ကို ဇယား တစ်ခုတည်းမှာ ပြမယ် ဆိုပါစို့။
      [[mark:draw-groups]] ဒါဆို ဆိုင်ခွဲ နာမည် ခေါင်းစဉ် တစ်ခုစီက ဖွင့်နဲ့ ပိတ် column နှစ်ခုစီကို
      ဖုံးထားပါတယ်။ [[mark:draw-colgroup]] ဒီလို column အုပ်စုတွေကို colgroup element နဲ့ သတ်မှတ်ပြီး၊
      ဆိုင်ခွဲ ခေါင်းစဉ်ရဲ့ th မှာ scope colgroup ကို ပေးပါတယ်။ ဖွင့်၊ ပိတ် ခေါင်းစဉ်တွေကတော့ scope col
      ပါ။ [[mark:draw-rowgroup]] row အုပ်စုတွေအတွက်တော့ ခုနက thead၊ tbody၊ tfoot ကို သုံးပါတယ်။ ဇယား
      ဒီလောက် ရှုပ်ထွေးလာရင်၊ ရိုးရှင်းတဲ့ ဇယား နှစ်ခု ခွဲလိုက်လို့ ရမလား ဆိုတာလည်း အရင် စဉ်းစားကြည့်ပါ။
    sources:
      - {
          title: "web.dev Learn Accessibility: Content structure (Tables: Data)",
          url: "https://web.dev/learn/accessibility/structure#data",
        }
      - {
          title: "W3C WAI: Tables with multi-level headers (colgroup, scope=colgroup)",
          url: "https://www.w3.org/WAI/tutorials/tables/multi-level/",
        }
      - {
          title: "W3C WAI: Tables with irregular headers",
          url: "https://www.w3.org/WAI/tutorials/tables/irregular/",
        }
      - {
          title: "MDN: <colgroup>",
          url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Element/colgroup",
        }
    actions:
      - id: open-board-c
        type: whiteboard.apply
        at: { mark: open-board-c }
        open: true
        clear: true
        upsertIds: [l06-c-title]
      - id: draw-groups
        type: whiteboard.apply
        at: { mark: draw-groups }
        upsertIds:
          [
            l06-c-g1,
            l06-c-g1-t,
            l06-c-g2,
            l06-c-g2-t,
            l06-c-c1,
            l06-c-c1-t,
            l06-c-c2,
            l06-c-c2-t,
            l06-c-c3,
            l06-c-c3-t,
            l06-c-c4,
            l06-c-c4-t,
          ]
        drawMs: 3000
      - id: draw-colgroup
        type: whiteboard.apply
        at: { mark: draw-colgroup }
        upsertIds: [l06-c-colgroup, l06-c-col]
        drawMs: 1800
      - id: draw-rowgroup
        type: whiteboard.apply
        at: { mark: draw-rowgroup }
        upsertIds: [l06-c-rowgroup, l06-c-no-element]
        drawMs: 1800

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:close-board-c]] ဒါဆို ပြန်ချုပ်ရရင်၊ ဒီ lesson မှာ မှတ်စရာ သုံးချက် ရှိပါတယ်။ [[mark:select-ul]] စာရင်း ဖြစ်တဲ့ အရာတွေကို ul၊ ol
      ဒါမှမဟုတ် dl နဲ့ ရေးပါ။ ဒါမှ screen reader က item အရေအတွက်နဲ့ ရောက်နေတဲ့ နေရာကို ပြောပြနိုင်ပါတယ်။
      [[mark:select-presentation]] layout အတွက် table ကို ရှောင်ပြီး၊ မရှောင်နိုင်ရင် role presentation
      ပေးပါ။ [[mark:select-caption]] data table မှာတော့ caption၊ th နဲ့ scope ကို သုံးပြီး data cell တိုင်းကို
      ခေါင်းစဉ်နဲ့ ချိတ်ပေးပါ။ နောက် lesson မှာတော့ document တစ်ခုလုံးရဲ့ page title နဲ့ ဘာသာစကားကို
      ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: Content structure",
          url: "https://web.dev/learn/accessibility/structure",
        }
      - { title: "W3C WAI: Tables Tutorial", url: "https://www.w3.org/WAI/tutorials/tables/" }
    actions:
      - id: close-board-c
        type: whiteboard.apply
        at: { mark: close-board-c }
        open: false
      - id: select-ul
        type: editor.select
        at: { mark: select-ul }
        target:
          {
            file: index.html,
            text: '<ul class="menu-list" data-testid="menu-drinks">',
            occurrence: 1,
          }
      - id: select-presentation
        type: editor.select
        at: { mark: select-presentation }
        target: { file: index.html, text: 'role="presentation"', occurrence: 1 }
      - id: select-caption
        type: editor.select
        at: { mark: select-caption }
        target: { file: index.html, text: "<caption>တစ်ပတ်အတွင်း ဖွင့်ချိန်</caption>", occurrence: 1 }
      - id: expect-file-list
        type: expect.file
        at: { afterAction: select-caption }
        path: index.html
        contains: "<li>ကော်ဖီ · 1,800 ကျပ်</li>"
      - id: expect-file-presentation
        type: expect.file
        at: { afterAction: expect-file-list }
        path: index.html
        contains: '<table class="promo" role="presentation" data-testid="promo">'
      - id: expect-file-caption
        type: expect.file
        at: { afterAction: expect-file-presentation }
        path: index.html
        contains: "<table class=\"hours-table\" data-testid=\"hours-table\">\n          <caption>တစ်ပတ်အတွင်း ဖွင့်ချိန်</caption>"
      - id: expect-file-scope
        type: expect.file
        at: { afterAction: expect-file-caption }
        path: index.html
        contains: '<th scope="row" data-testid="hours-weekdays">တနင်္လာ – သောကြာ</th>'

checks:
  - { type: timing.p95Ms, max: 300 }
