  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] Fintech interview တွေမှာ user ရဲ့ balance က platform အတွက် ဘာလို့ liability
      ဖြစ်တာလဲ လို့ မေးတတ်ပါတယ်။ user ရဲ့ ငွေ မို့လို့ပါ လို့ပဲ ဖြေရင် မလုံလောက်ပါဘူး။ ငွေ ဘယ်မှာ
      ရှိလဲ၊ ဘယ်သူ့ ငွေလဲ ဆိုတာ ခွဲပြီး ဖြေပါ။ [[mark:iv-a]] ပထမ၊ user ငွေ ပို့လိုက်တဲ့အခါ ငွေက
      platform ရဲ့ ဘဏ်ထဲ ရောက်ပါတယ်၊ အဲဒါက platform ရဲ့ asset ပါ။ [[mark:iv-b]] ဒုတိယ၊ user ရဲ့
      balance က အဲဒီ ငွေကို ပြန်ပေးမယ် ဆိုတဲ့ ကတိ ဖြစ်လို့ IOU ပါ၊ ပေးစရာ ရှိတာ ဖြစ်လို့ credit ဘက်မှာ
      တိုးတဲ့ liability ပါ။ [[mark:iv-c]] တတိယ၊ platform ကိုယ်ပိုင် ငွေက equity နဲ့ fee လို revenue ဘက်မှာ
      ရှိပြီး၊ accounting equation က asset၊ liability နဲ့ အဲဒါတွေကို ချိတ်ထားပါတယ်။ [[mark:iv-d]] ပြီးရင် ဘာကြောင့်
      အရေးကြီးလဲ ဆက်ပြောပါ။ user liability တွေကို sub-ledger ကနေ roll up လုပ်ပြီး ဘဏ်ထဲက asset နဲ့
      ပုံမှန် တိုက်စစ်ရပါတယ်။ asset က liability ထက် နည်းနေရင် user တွေရဲ့ ငွေကို တခြား နေရာမှာ
      သုံးထားတာ ဖြစ်နိုင်လို့ပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Appendix A: Know your domain, Accounting & ledgers (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#accounting-ledgers",
        }
      - {
          title: "Fintech Engineering Handbook — Audits and audit trails (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#audits-and-audit-trails",
        }
    actions:
