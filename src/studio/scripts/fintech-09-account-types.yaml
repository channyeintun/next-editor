# Fintech Engineering, lesson 09: debit, credit and account types (Burmese).
#
# Source: Fintech Engineering Handbook, "Double-entry bookkeeping" (account types, the accounting
# equation), "Audits and audit trails" (assets against what is owed to users), Appendix A
# "Accounting & ledgers" (CC BY 4.0, Voytek Pitula).
# Start state: ledger.go is kit/go/ledger.go unchanged (Line, Tx, Ledger.Post, Balance by normal
# side, cents); books.go adds Accounts, TrialBalance and Total(kind); main.go posts a deposit as
# Dr asset:bank / Cr liability:user:1042 and prints every account's balance.
# Edits, all insert-only:
#   1. the fee as Dr liability:user:1042 / Cr revenue:fees      -> run-2: user 98.50, fees 1.50
#   2. the trial balance and the accounting equation           -> run-3: 101.50 = 101.50, true
# Figures: sign (the −100 that is a +100 debit), types (five types and the side each grows on),
# iou (assets against whose money it is), chart (sub-ledger rolled up into the general ledger),
# iv (the interview answer).
# Built by ~/Documents/fintech-course-work/tools/build-lesson.ts; fixtures by sim-go.ts --write.
schemaVersion: 1

lesson:
  slug: fintech-09-account-types
  title: "Fintech Engineering 09: Debit၊ credit နဲ့ account type"
  locale: my-MM
  workspace:
    lessonType: go
