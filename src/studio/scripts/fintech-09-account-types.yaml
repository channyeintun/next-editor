  - id: try-it
    chapter: ကိုယ်တိုင် စမ်းကြည့်ပါ
    narration: >-
      [[mark:close-iv]] ကိုယ်တိုင် စမ်းကြည့်ဖို့ တစ်ခု ရှိပါတယ်။ [[mark:sel-try]] ဒီ fee transaction
      အောက်မှာ user က ယူရို ၂၅ ထုတ်ယူတဲ့ withdrawal transaction တစ်ခု ထည့်ကြည့်ပါ။ မရေးခင် ဘယ်
      account နှစ်ခုက ဘယ်ဘက်မှာ ပြောင်းမလဲ အရင် ခန့်မှန်းပါ။ [[mark:try-answer]] အဖြေက user ရဲ့
      liability ကို debit၊ ဘဏ်ရဲ့ asset ကို credit ပါ။ run လိုက်ရင် နှစ်ခုလုံး ၂၅ စီ လျော့ပြီး equation က
      true ပါပဲ။ [[mark:recap]] ပြန်ချုပ်ရရင်၊ debit နဲ့ credit က အဝင် အထွက် မဟုတ်ဘဲ ဘက် နှစ်ဖက်ပါ။
      ဘယ်ဘက်မှာ တိုးလဲ ဆိုတာ account type က သတ်မှတ်ပြီး၊ user ရဲ့ balance က platform ရဲ့ liability
      ပါ။ နောက် lesson မှာတော့ card deposit လို business event တစ်ခုက line နှစ်ကြောင်းထက် ပိုလာတဲ့အခါ
      transaction တစ်ခုလုံးကို ဘယ်လို post လုပ်မလဲ၊ PSP ဆီမှာ ရှိနေသေးတဲ့ ငွေကို ဘယ်မှာ မှတ်မလဲ ဆိုတာ
      ကြည့်ပါမယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Double-entry bookkeeping (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#double-entry-bookkeeping",
        }
    actions:
      - { id: close-iv, type: slide.close, at: { mark: close-iv } }
      - id: sel-try
        type: editor.select
        at: { mark: sel-try }
        target:
          {
            file: main.go,
            text: "{Account: \"liability:user:1042\", Debit: 150},\n\t\t{Account: \"revenue:fees\", Credit: 150},",
            occurrence: 1,
          }

