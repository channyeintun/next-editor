      books.go: |
        package main

        import (
        	"maps"
        	"slices"
        )

        // Accounts lists every account that has a posted line, sorted.
        func (l *Ledger) Accounts() []string {
        	seen := map[string]bool{}
        	for _, tx := range l.txs {
        		for _, line := range tx.Lines {
        			seen[line.Account] = true
        		}
        	}
        	return slices.Sorted(maps.Keys(seen))
        }

        // TrialBalance adds up every debit and every credit in the books.
        func (l *Ledger) TrialBalance() (debits, credits int64) {
        	for _, tx := range l.txs {
        		for _, line := range tx.Lines {
        			debits += line.Debit
        			credits += line.Credit
        		}
        	}
        	return debits, credits
        }

        // Total adds up the balances of every account of one kind: Total("liability").
        func (l *Ledger) Total(kind string) int64 {
        	var sum int64
        	for _, a := range l.Accounts() {
        		if kindOf(a) == kind {
        			sum += l.Balance(a)
        		}
        	}
        	return sum
        }
      ledger.go: |
        package main

        import (
        	"fmt"
        	"strings"
        )

        // Line is one row of a transaction: an amount on the debit or the credit side of one account.
        type Line struct {
        	Account string
        	Debit   int64
        	Credit  int64
        }

        // Tx is one business event. All of its lines are posted together, or none of them.
        type Tx struct {
        	ID    string
        	Memo  string
        	Lines []Line
        }

        // Ledger is an append-only list of posted transactions. Balances are derived from it.
        type Ledger struct {
        	txs []Tx
        }

        // Post appends a transaction only if its debits equal its credits.
        func (l *Ledger) Post(tx Tx) error {
        	var debit, credit int64
        	for _, line := range tx.Lines {
        		debit += line.Debit
        		credit += line.Credit
        	}
        	if debit != credit {
        		return fmt.Errorf("tx %s is not balanced: debit %s, credit %s", tx.ID, cents(debit), cents(credit))
        	}
        	l.txs = append(l.txs, tx)
        	return nil
        }

        // kindOf reads the account type from the name: "asset:bank" is an asset.
        func kindOf(account string) string {
        	kind, _, _ := strings.Cut(account, ":")
        	return kind
        }

        // Balance derives an account's balance on the side where that kind of account grows:
        // assets and expenses grow with debits; liabilities, equity and revenue grow with credits.
        func (l *Ledger) Balance(account string) int64 {
        	var debit, credit int64
        	for _, tx := range l.txs {
        		for _, line := range tx.Lines {
        			if line.Account == account {
        				debit += line.Debit
        				credit += line.Credit
        			}
        		}
        	}
        	if kind := kindOf(account); kind == "asset" || kind == "expense" {
        		return debit - credit
        	}
        	return credit - debit
        }

        // cents prints minor units as an amount with two decimals: cents(1234) is "12.34".
        func cents(n int64) string {
        	sign := ""
        	if n < 0 {
        		sign, n = "-", -n
        	}
        	return fmt.Sprintf("%s%d.%02d", sign, n/100, n%100)
        }
      main.go: |
        package main

        import "fmt"

        // post records tx and stops the program if the ledger refuses it.
        func post(l *Ledger, tx Tx) {
        	if err := l.Post(tx); err != nil {
        		panic(err)
        	}
        }

        func main() {
        	var l Ledger
        	post(&l, Tx{ID: "dep-1", Memo: "deposit", Lines: []Line{
        		{Account: "asset:bank", Debit: 10000},
        		{Account: "liability:user:1042", Credit: 10000},
        	}})

        	for _, acct := range l.Accounts() {
        		fmt.Printf("%-20s %8s\n", acct, cents(l.Balance(acct)))
        	}
        }
