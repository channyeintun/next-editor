build:
  voiceProfile:
    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 9509

runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "asset:bank             100.00\nliability:user:1042    100.00\n"
      run-2:
        status: success
        exitCode: 0
        output: "asset:bank             100.00\nliability:user:1042     98.50\nrevenue:fees             1.50\n"
      run-3:
        status: success
        exitCode: 0
        output: "asset:bank             100.00\nliability:user:1042     98.50\nrevenue:fees             1.50\ndebits 101.50 = credits 101.50\nassets = liabilities + equity + revenue - expenses: true\n"

scenes:
  - id: hook
    chapter: အနှုတ် ၁၀၀ ဖြစ်နေတဲ့ ဘဏ်
    narration: >-
      ငွေ ရွေ့တာကို ဘယ်ကနေ ဘယ်ကို ဆိုပြီး မှတ်တော့ ယူရို ၁၀၀ deposit ဝင်လာတဲ့အခါ ဘဏ်ရဲ့ account က
      အနှုတ် ၁၀၀ ဖြစ်သွားပါတယ်။ [[mark:show-sign]] ဒါပေမဲ့ ဘဏ်ထဲမှာ ငွေ အနှုတ် ရှိတာ မဟုတ်ပါဘူး၊ တကယ်တော့
      platform ရဲ့ ဘဏ်ထဲမှာ ယူရို ၁၀၀ တိုးလာတာပါ။ [[mark:pt-q]] ဆိုတော့ အဲဒီ ဂဏန်းကို ဘယ်လို
      ဖတ်ရမလဲ။ [[mark:sign-2]] accounting မှာ account တိုင်းကို ဘက် နှစ်ဖက် ခွဲထားပါတယ်။ ဘယ်ဘက်ကို
      debit၊ ညာဘက်ကို credit လို့ ခေါ်ပါတယ်။ [[mark:pt-tb]] deposit မှာ ဘဏ်ရဲ့ account ကို debit
      ဘက်မှာ ၁၀၀ ရေးပြီး၊ [[mark:pt-tu]] user ရဲ့ account ကို credit ဘက်မှာ ၁၀၀ ရေးပါတယ်။
      [[mark:sign-3]] entry တစ်ခုမှာ debit စုစုပေါင်းနဲ့ credit စုစုပေါင်း အမြဲ ညီရပါတယ်။ from နဲ့ to
      ဆိုတဲ့ ပုံစံက ဒါကို ကျစ်ကျစ်လျစ်လျစ် ရေးထားတာပဲ ဖြစ်ပြီး၊ classic ပုံစံကတော့ ရွေ့တာ
      တစ်ခုချင်းကို debit line နဲ့ credit line ခွဲရေးတာပါ။ data က အတူတူပါပဲ။ ခုနက အနှုတ်
      လက္ခဏာက debit နဲ့ credit ဆိုတဲ့ ဘက် ဖြစ်သွားတာပါ။ [[mark:pt-grow]] ဘယ်ဘက်က တိုးတာလဲ
      ဆိုတာကတော့ account ရဲ့ type ပေါ်မှာ မူတည်ပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Double-entry bookkeeping (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#double-entry-bookkeeping",
        }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }
      - {
          id: show-sign,
          type: slide.show,
          at: { mark: show-sign, offsetMs: -700 },
          slideId: sign-1,
        }
      - { id: pt-q, type: slide.point, at: { mark: pt-q }, target: { x: 0.1, y: 0.591 } }
      - { id: sign-2, type: slide.show, at: { mark: sign-2 }, slideId: sign-2 }
      - { id: pt-tb, type: slide.point, at: { mark: pt-tb }, target: { x: 0.519, y: 0.467 } }
      - { id: pt-tu, type: slide.point, at: { mark: pt-tu }, target: { x: 0.881, y: 0.467 } }
      - { id: sign-3, type: slide.show, at: { mark: sign-3 }, slideId: sign-3 }
      - {
          id: pt-same,
          type: slide.point,
          at: { afterAction: sign-3 },
          target: { x: 0.692, y: 0.776 },
        }
      - { id: pt-grow, type: slide.point, at: { mark: pt-grow }, target: { x: 0.513, y: 0.836 } }

  - id: types
    chapter: Account type ငါးမျိုး
    narration: >-
      [[mark:show-types]] account တိုင်းမှာ type တစ်ခု ရှိပါတယ်။ [[mark:pt-asset]] asset က ကိုယ်
      ပိုင်တဲ့ အရာ၊ ကိုယ့်ဆီ ရှိနေတဲ့ ငွေပါ၊ ဘဏ်ထဲက ငွေလိုမျိုးပါ။ asset က debit ဘက်မှာ
      တိုးပါတယ်။ [[mark:pt-liab]] liability က ကိုယ် ပြန်ပေးစရာ ရှိတဲ့ အကြွေးပါ။ equity ကတော့
      owner တွေ ထည့်ထားတဲ့ capital လို owner တွေရဲ့ အပိုင်ပါ။ အဲဒီ နှစ်မျိုးလုံး credit ဘက်မှာ
      တိုးပါတယ်။ ဒီ သုံးမျိုးက balance sheet ပေါ်မှာ ပေါ်ပါတယ်။ [[mark:types-2]] လက်တွေ့မှာ နောက်ထပ်
      နှစ်မျိုး လိုပါတယ်။ revenue က fee လို ရလာတဲ့ ဝင်ငွေ ဖြစ်လို့ credit ဘက်မှာ တိုးပါတယ်။
      expense က card processing fee လို ကိုယ် ပေးလိုက်ရတဲ့ စရိတ် ဖြစ်လို့ debit ဘက်မှာ တိုးပါတယ်။
      ဒီ နှစ်မျိုးက income statement ပေါ်မှာ ပေါ်ပါတယ်။ [[mark:types-3]] သတိထားရမှာက debit နဲ့ credit
      က ဘက်တွေပါ၊ ငွေ အဝင် အထွက် မဟုတ်ပါဘူး။ debit ဆိုတာ အဝင် လို့ မှတ်ထားရင် liability account
      တွေမှာ ပြောင်းပြန် ဖြစ်သွားပါတယ်။ ဒါကို code နဲ့ စမ်းကြည့်ပါမယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Double-entry bookkeeping (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#double-entry-bookkeeping",
        }
      - {
          title: "Fintech Engineering Handbook — Appendix A: Know your domain, Accounting & ledgers (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#accounting-ledgers",
        }
    actions:
      - {
          id: show-types,
          type: slide.show,
          at: { mark: show-types, offsetMs: -700 },
          slideId: types-1,
        }
      - { id: pt-asset, type: slide.point, at: { mark: pt-asset }, target: { x: 0.138, y: 0.389 } }
      - { id: pt-liab, type: slide.point, at: { mark: pt-liab }, target: { x: 0.138, y: 0.482 } }
      - { id: types-2, type: slide.show, at: { mark: types-2 }, slideId: types-2 }
      - {
          id: pt-is,
          type: slide.point,
          at: { afterAction: types-2 },
          target: { x: 0.138, y: 0.669 },
        }
      - { id: types-3, type: slide.show, at: { mark: types-3 }, slideId: types-3 }
      - {
          id: pt-side,
