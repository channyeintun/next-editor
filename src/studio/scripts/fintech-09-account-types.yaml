          at: { afterAction: types-3 },
          target: { x: 0.303, y: 0.902 },
        }

  - id: code
    narration: >-
      [[mark:close-types]] code ကို ကြည့်ရအောင်။ [[mark:sel-dep]] deposit ကို transaction တစ်ခုအနေနဲ့
      post လုပ်ထားပါတယ်။ ပထမ line က ဘဏ်ရဲ့ asset account ကို debit ဘက်မှာ ၁၀၀၊ ဒုတိယ line က user
      ရဲ့ liability account ကို credit ဘက်မှာ ၁၀၀ ပါ။ account နာမည်ရဲ့ ရှေ့ဆုံး အပိုင်းက သူ့ type ပါ။
      [[mark:run-1]] run လိုက်ရအောင်။ [[mark:pt-bank]] ဘဏ်ရဲ့ account က အပေါင်း ၁၀၀ ဖြစ်သွားပါပြီ။
      [[mark:pt-user]] user ရဲ့ account လည်း အပေါင်း ၁၀၀ ပါ။ ငွေ ရွေ့တာက အရင်အတိုင်းပါပဲ၊
      ပြောင်းသွားတာက balance ကို ဖတ်ပုံပါ။ [[mark:open-ledger]] ဖတ်ပုံကို Balance ထဲမှာ
      ကြည့်ရအောင်။ [[mark:sel-kind]] Balance က account type ကို နာမည်ကနေ ဖတ်ပါတယ်။ asset နဲ့
      expense ဆိုရင် debit ထဲက credit ကို နုတ်ပြီး၊ ကျန်တဲ့ သုံးမျိုးဆိုရင် credit ထဲက debit ကို
      နုတ်ပါတယ်။ ဒါကြောင့် account တိုင်းရဲ့ balance ကို သူ တိုးတဲ့ ဘက်ကနေ အပေါင်းနဲ့ ပြပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Double-entry bookkeeping (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#double-entry-bookkeeping",
        }
    actions:
      - { id: close-types, type: slide.close, at: { mark: close-types } }
      - id: sel-dep
        type: editor.select
        at: { mark: sel-dep }
        target:
          {
            file: main.go,
            text: "{Account: \"asset:bank\", Debit: 10000},\n\t\t{Account: \"liability:user:1042\", Credit: 10000},",
            occurrence: 1,
          }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "liability:user:1042    100.00",
          timeoutMs: 8000,
        }
      - id: pt-bank
        type: console.point
        at: { mark: pt-bank }
        target: { text: "asset:bank", occurrence: 1 }
      - id: pt-user
        type: console.point
        at: { mark: pt-user }
        target: { text: "liability:user:1042", occurrence: 1 }
      - { id: open-ledger, type: workspace.openFile, at: { mark: open-ledger }, path: ledger.go }
      - id: sel-kind
        type: editor.select
        at: { mark: sel-kind }
        target:
          {
            file: ledger.go,
            text: "if kind := kindOf(account); kind == \"asset\" || kind == \"expense\" {\n\t\treturn debit - credit\n\t}\n\treturn credit - debit",
            occurrence: 1,
          }

  - id: fee
    chapter: Debit က အဝင် မဟုတ်ဘူး
    narration: >-
      [[mark:open-main2]] fee ဖြတ်တာကို ထည့်ကြည့်ရအောင်။ [[mark:type-fee]] fee တစ်ယူရို ငါးဆယ်ဆင့်ကို
      user ရဲ့ account ကနေ platform ရဲ့ revenue account ထဲ ရွှေ့ပါမယ်။ user ရဲ့ liability account ကို
      debit လုပ်ပြီး revenue account ကို credit လုပ်ပါတယ်။ [[mark:ask-fee]] debit ကို အဝင် လို့
      ထင်ထားရင် user ရဲ့ balance တက်မယ်လို့ ထင်စရာပါ။ တကယ် တက်မလား၊ ကျမလား run မလုပ်ခင်
      ခန့်မှန်းကြည့်ပါ။ [[mark:run-2]] run လိုက်ရအောင်။ [[mark:pt-985]] user ရဲ့ balance က ၉၈ ယူရို
      ၅၀ ဆင့်အထိ ကျသွားပါတယ်။ liability က credit ဘက်မှာ တိုးတော့ debit ဘက်မှာ ရေးလိုက်ရင်
      လျော့ပါတယ်။ [[mark:pt-rev]] revenue ကတော့ credit ရလို့ တစ်ယူရို ငါးဆယ်ဆင့် တိုးလာပါတယ်။
      [[mark:pt-bank2]] ဘဏ်ထဲက ငွေကတော့ ၁၀၀ ပါပဲ၊ ငွေ ဘဏ်ကနေ ဘယ်ကိုမှ မသွားသေးလို့ပါ။
      [[mark:dock-2]] ပြောင်းသွားတာက ဒီ ၁၀၀ ထဲက ဘယ်လောက်က user ရဲ့ ငွေ ဖြစ်ပြီး ဘယ်လောက်က
      platform ရဲ့ ငွေလဲ ဆိုတာပဲ ဖြစ်ပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Double-entry bookkeeping (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#double-entry-bookkeeping",
        }
    actions:
      - { id: open-main2, type: workspace.openFile, at: { mark: open-main2 }, path: main.go }
      - id: type-fee
        type: editor.type
        at: { mark: type-fee }
        target:
          {
            file: main.go,
            after: "\t\t{Account: \"liability:user:1042\", Credit: 10000},\n\t}})\n",
            occurrence: 1,
          }
        text: "\tpost(&l, Tx{ID: \"fee-1\", Memo: \"deposit fee\", Lines: []Line{\n\t\t{Account: \"liability:user:1042\", Debit: 150},\n\t\t{Account: \"revenue:fees\", Credit: 150},\n\t}})\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "98.50",
          timeoutMs: 8000,
        }
      - id: pt-985
        type: console.point
        at: { mark: pt-985 }
        target: { text: "98.50", occurrence: 1 }
      - id: pt-rev
        type: console.point
        at: { mark: pt-rev }
        target: { text: "revenue:fees", occurrence: 1 }
      - id: pt-bank2
        type: console.point
        at: { mark: pt-bank2 }
        target: { text: "asset:bank", occurrence: 1 }
      - {
          id: expect-file-fee,
          type: expect.file,
          at: { afterAction: run-2 },
          path: main.go,
          contains: '{Account: "liability:user:1042", Debit: 150},',
        }
      - { id: dock-2, type: runtime.collapseDock, at: { mark: dock-2 } }

  - id: iou
    chapter: User ရဲ့ ငွေက ကိုယ့်အကြွေး
    narration: >-
      [[mark:show-iou]] ဘဏ်ထဲမှာ ရှိတဲ့ ယူရို ၁၀၀ က platform ရဲ့ asset ပါ။ [[mark:iou-2]] ဒါပေမဲ့ အဲဒီထဲက
      ၉၈ ယူရို ၅၀ ဆင့်က user ကို ပြန်ပေးရမယ့် ငွေပါ။ custodial platform၊ ဆိုလိုတာက user ရဲ့ ငွေကို
      ကိုယ်က ကိုင်ထားပေးတဲ့ platform မှာ user ရဲ့ balance ဆိုတာ platform က user ကို ပေးထားတဲ့ IOU
      ပါ။ ပြန်ပေးမယ်လို့ ကတိပေးထားတဲ့ အကြွေး ဖြစ်လို့ liability ဘက်မှာ ရှိတာပါ။ [[mark:pt-rev2]]
      platform ကိုယ်တိုင်ရဲ့ ငွေက fee ဖြတ်ထားတဲ့ တစ်ယူရို ငါးဆယ်ဆင့်ပဲ ရှိပါတယ်။ အဲဒီ ဝင်ငွေတောင်
      ပေါ်လာတာ မဟုတ်ဘဲ user ရဲ့ liability ထဲကနေ ရွှေ့လာတာပါ၊ ငွေကို မရှိဘဲ မဖန်တီးရဘူး ဆိုတဲ့
      No invented data မူက ဒီမှာလည်း ထိန်းထားပါတယ်။ [[mark:iou-3]] ဒီ ဆက်စပ်မှုကို accounting
      equation လို့ ခေါ်ပါတယ်။ asset က liability၊ equity နဲ့ revenue ကို ပေါင်းပြီး expense ကို
      နုတ်ထားတာနဲ့ အမြဲ ညီရပါတယ်။ [[mark:pt-audit]] audit မှာ စစ်တတ်တဲ့ မေးခွန်း တစ်ခုက ဒီ
      equation ပေါ်မှာ အခြေခံပါတယ်။ user တွေကို ပေးစရာ ရှိသလောက် asset တကယ် ရှိရဲ့လား ဆိုတာပါ။
      user ရဲ့ ငွေကို ကုမ္ပဏီ စရိတ်အတွက် သုံးလိုက်ရင် liability က မပြောင်းဘဲ asset ပဲ လျော့သွားလို့
      ဒီ မေးခွန်းမှာ ချက်ချင်း ပေါ်ပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Double-entry bookkeeping (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#double-entry-bookkeeping",
        }
      - {
          title: "Fintech Engineering Handbook — Audits and audit trails (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#audits-and-audit-trails",
        }
    actions:
      - { id: show-iou, type: slide.show, at: { mark: show-iou, offsetMs: -700 }, slideId: iou-1 }
      - {
          id: pt-ba,
          type: slide.point,
          at: { afterAction: show-iou },
          target: { x: 0.488, y: 0.48 },
        }
      - { id: iou-2, type: slide.show, at: { mark: iou-2 }, slideId: iou-2 }
      - { id: pt-br, type: slide.point, at: { afterAction: iou-2 }, target: { x: 0.481, y: 0.724 } }
      - { id: pt-rev2, type: slide.point, at: { mark: pt-rev2 }, target: { x: 0.755, y: 0.549 } }
      - { id: iou-3, type: slide.show, at: { mark: iou-3 }, slideId: iou-3 }
      - { id: pt-eq, type: slide.point, at: { afterAction: iou-3 }, target: { x: 0.322, y: 0.842 } }
      - { id: pt-audit, type: slide.point, at: { mark: pt-audit }, target: { x: 0.284, y: 0.942 } }

  - id: trial
    chapter: Trial balance
    narration: >-
      [[mark:close-iou]] equation ကို code နဲ့ စစ်ကြည့်ရအောင်။ [[mark:type-trial]] ပထမ နှစ်ကြောင်းက
      trial balance ပါ၊ ledger တစ်ခုလုံးမှာ debit စုစုပေါင်းနဲ့ credit စုစုပေါင်း ညီသလား စစ်တာပါ။
      နောက် သုံးကြောင်းက type တစ်ခုချင်းရဲ့ balance စုစုပေါင်းကို ယူပြီး accounting equation
      မှန်သလား စစ်ပါတယ်။ [[mark:why-trial]] account သိန်းချီ ရှိတဲ့ ledger မှာတောင် ဒီ စစ်ဆေးမှု
      နှစ်ခုက ဂဏန်း နှစ်လုံးစီကိုပဲ ယှဉ်ရတာပါ။ [[mark:run-3]] run လိုက်ရအောင်။ [[mark:pt-dc]] debit နဲ့
      credit နှစ်ဖက်လုံး ညီပါတယ်။ ၁၀၀ မဟုတ်ဘဲ ၁၀၁ ကျော် ဖြစ်နေတာက transaction နှစ်ခုလုံးရဲ့ line
      တွေကို ပေါင်းထားလို့ပါ။ [[mark:pt-eq-true]] equation ကလည်း true ပါ။ [[mark:dock-3]] စိတ်ဝင်စားစရာက
      ဒီ ledger မှာ trial balance က fail ဖို့ မဖြစ်နိုင်တာပါ၊ Post က debit နဲ့ credit မညီတဲ့
      transaction ကို လက်မခံလို့ပါ။ ဒါဆို ဘာလို့ စစ်နေသေးလဲ။ [[mark:why-check]] ledger ထဲကို data ဝင်တာ Post တစ်ခုတည်းကနေ
      မဟုတ်လို့ပါ။ migration၊ data import၊ database ကို တိုက်ရိုက် ပြင်တဲ့ script၊ sub-ledger
      အများကြီးကို ပေါင်းထားတဲ့ report တွေမှာ trial balance က အဲဒီ code path တွေကို မယုံဘဲ ရလဒ်ကို
      ပြန်စစ်တာပါ။ ဒါပေမဲ့ account မှားပြီး post လုပ်တာကိုတော့ trial balance က မဖမ်းနိုင်ပါဘူး၊
      line တိုင်း ညီနေလို့ပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Appendix A: Know your domain, Accounting & ledgers (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#accounting-ledgers",
        }
      - {
          title: "Fintech Engineering Handbook — Principles (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#principles",
        }
    actions:
      - { id: close-iou, type: slide.close, at: { mark: close-iou } }
      - id: type-trial
        type: editor.type
        at: { mark: type-trial }
        target:
          {
            file: main.go,
            after: "\t\tfmt.Printf(\"%-20s %8s\\n\", acct, cents(l.Balance(acct)))\n\t}\n",
            occurrence: 1,
          }
        text: "\tdebits, credits := l.TrialBalance()\n\tfmt.Println(\"debits\", cents(debits), \"= credits\", cents(credits))\n\ta, li, e := l.Total(\"asset\"), l.Total(\"liability\"), l.Total(\"equity\")\n\tr, x := l.Total(\"revenue\"), l.Total(\"expense\")\n\tfmt.Println(\"assets = liabilities + equity + revenue - expenses:\", a == li+e+r-x)\n"
        cadence: line-by-line
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "expenses: true",
          timeoutMs: 8000,
        }
      - id: pt-dc
        type: console.point
        at: { mark: pt-dc }
        target: { text: "= credits", occurrence: 1 }
      - id: pt-eq-true
        type: console.point
        at: { mark: pt-eq-true }
        target: { text: "expenses: true", occurrence: 1 }
      - { id: dock-3, type: runtime.collapseDock, at: { mark: dock-3 } }

  - id: chart
    narration: >-
      [[mark:show-chart]] user တစ်ယောက်ချင်းစီမှာ ကိုယ်ပိုင် liability account ရှိပါတယ်။ အဲဒီ account
      တွေ အားလုံးကို sub-ledger လို့ ခေါ်ပါတယ်၊ ဆိုလိုတာက domain တစ်ခုအတွက် အသေးစိတ် စာရင်းပါ။
      [[mark:pt-many]] user တစ်သိန်း ရှိရင် account တစ်သိန်း ရှိပါတယ်။ [[mark:chart-2]] general ledger
      ကတော့ ကုမ္ပဏီ တစ်ခုလုံးရဲ့ စာရင်းချုပ်ပါ။ sub-ledger ထဲက balance တွေကို ပေါင်းပြီး user တွေကို
      ပေးစရာ ရှိတဲ့ liability တစ်ကြောင်းအဖြစ် ပြပါတယ်။ [[mark:pt-roll]] audit ရဲ့ မေးခွန်းကို ဖြေတာက
      ဒီ တစ်ကြောင်းကို ဘဏ်ထဲက asset နဲ့ ယှဉ်တာပါ။ [[mark:pt-coa]] post လုပ်လို့ ရတဲ့ account တွေရဲ့
      စာရင်းကို chart of accounts လို့ ခေါ်ပါတယ်။ legal entity တစ်ခုချင်းအတွက်၊ reporting standard
      တစ်ခုချင်းအတွက် chart of accounts သီးသန့် ရှိနိုင်ပါတယ်။ [[mark:chart-3]] ဒီ lesson ရဲ့ code မှာတော့ post လုပ်လိုက်တဲ့
      account နာမည်တိုင်းက account ဖြစ်သွားလို့ user id မှာ ဂဏန်း တစ်လုံး မှားရုံနဲ့ account
      အသစ်တစ်ခု တိတ်တိတ်လေး ပေါ်လာနိုင်ပါတယ်။ [[mark:pt-gl-same]] ငွေက account မှားထဲ ရောက်သွားပေမဲ့ စုစုပေါင်းတွေက
      မပြောင်းလို့ trial balance ရော roll up ရော မဖမ်းနိုင်ပါဘူး။ chart of accounts ထဲမှာ မပါတဲ့ account ကို post
      လုပ်ခွင့် မပေးတာက အဲဒါကို တားပါတယ်။
    sources:
