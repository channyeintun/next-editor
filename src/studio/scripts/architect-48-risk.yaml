    chapter: ပြန်ချုပ်
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ risk ဆိုတာ ထိခိုက်မှုနဲ့ ဖြစ်နိုင်ခြေကို တွဲကြည့်တာပါ။ system တစ်ခုလုံးကို မဟုတ်ဘဲ၊
      အပိုင်း တစ်ခုစီကို characteristic တစ်ခုချင်းနဲ့ တွဲပြီး အကဲဖြတ်ရပါတယ်။ မစမ်းရသေးတဲ့ နည်းပညာကို
      မြင့်တယ်လို့ ယူပါ။
      [[mark:recap-2]] တစ်ယောက်တည်း မပေးဘဲ အဖွဲ့လိုက် ပေးပြီး၊ အမှတ် ကွဲတဲ့နေရာမှာ မေးပါ။ ပြီးရင်
      လျှော့ချမလား၊ လက်ခံမလား ဆုံးဖြတ်ပြီး ပုံမှန် ပြန်စစ်ပါ။ ဒါဆို ဘယ်နေရာက အရင် ပျက်မလဲ ဆိုတဲ့ မေးခွန်းကို
      ထင်မြင်ချက်နဲ့ မဟုတ်ဘဲ၊ နှိုင်းယှဉ်လို့ရတဲ့ အမှတ်တွေနဲ့ ဖြေနိုင်ပါပြီ။
      [[mark:next]] risk တွေကို တွေ့ပြီဆိုရင် တခြားသူတွေ နားလည်အောင် ပြဖို့ လိုလာပါတယ်။ နောက် lesson မှာတော့
      architecture ကို diagram နဲ့ ဘယ်လို ဆွဲပြီး ဘယ်လို တင်ပြမလဲ ဆိုတာကို လေ့လာသွားပါမယ်။
