# Accessibility course (Burmese), lesson 14 of 20: video and audio.
#
# Built from template.yaml + ws/ + slides.part with `bun build.ts` (pins ws/
# byte-exact). Narration is Burmese, written directly; voice-script.md next to
# this file is the lint's copy. DESIGN.md is the brief.
#
# A concept lesson: nothing runs and there is no preview. Deck pages (course
# deck, kits K1-K11) carry the ideas; the editor shows the markup a learner
# would write for the shop's tea-making video: a <track kind="captions"> line
# in video.html, two WebVTT cues (a speaker voice tag and a sound in brackets)
# in captions.vtt, and a transcript section under the video. No video or audio
# file can be pinned in a workspace, so the narration says once that we look
# at the code only, and never claims a video plays.
#
# Shape: cover + recall lesson 13 → persona လှလှ (deaf customer) → who needs
# which alternative → what decides the alternatives → captions vs subtitles →
# open vs closed captions → good captions (speaker, sounds, check auto
# captions) → editor: track element → captions.vtt cues → transcripts (page)
# → editor: transcript section with a visual-only line → audio description
# (page; integrated / separate version / description file; extended) → sign
# language (300+, Burmese sign language, AAA) → accessible media player
# (keyboard, names, no autoplay with sound; the native controls attribute
# selected) → WCAG 1.2 levels (K11) → quiz + reveal → recap on the code,
# hand-off to lesson 15 (forms).
#
# Deck: every page points at the course deck's placeholder /pub URL until Chan
# publishes it; the Director's unreachable-deck warning is expected.
# Page plan (kit fields per page): ~/Documents/a11y-course-work/pages/a11y-course-14-video-audio.json
#
# Validate with (from the repo root):
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
schemaVersion: 1

lesson:
  slug: a11y-course-14-video-audio
  title: "Accessibility course 14: Video နဲ့ audio"
  locale: my-MM
  workspace:
    lessonType: javascript
    name: Accessibility course 14
    entryFilePath: video.html
    files:
      captions.vtt: ""
      package.json: |
        {
          "name": "a11y-course-lesson",
          "private": true,
          "version": "1.0.0",
          "scripts": {
            "dev": "echo concept lesson: nothing to run"
          }
        }
      video.html: |
        <!doctype html>
        <html lang="my">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>လက်ဖက်ရည် ဖျော်နည်း — ရွှေလက်ဖက်ရည်ဆိုင်</title>
          </head>
          <body>
            <main>
              <h1>လက်ဖက်ရည် ဖျော်နည်း</h1>
              <video controls width="640" preload="metadata">
                <source src="tea-making.mp4" type="video/mp4" />
              </video>
            </main>
          </body>
        </html>
  slides:
    - {
        id: l14_p01,
        contentType: google,
        name: "Cover: video and audio",
        deckUrl: "https://docs.google.com/presentation/d/e/A11Y-COURSE-NOT-PUBLISHED-YET/pub",
        pageId: l14_p01,
      }
    - {
        id: l14_p02,
        contentType: google,
        name: "Persona: လှလှ (deaf customer)",
        deckUrl: "https://docs.google.com/presentation/d/e/A11Y-COURSE-NOT-PUBLISHED-YET/pub",
        pageId: l14_p02,
      }
    - {
        id: l14_p03,
        contentType: google,
        name: "Who needs which alternative",
        deckUrl: "https://docs.google.com/presentation/d/e/A11Y-COURSE-NOT-PUBLISHED-YET/pub",
        pageId: l14_p03,
      }
    - {
        id: l14_p04,
        contentType: google,
        name: "What decides the alternatives",
        deckUrl: "https://docs.google.com/presentation/d/e/A11Y-COURSE-NOT-PUBLISHED-YET/pub",
        pageId: l14_p04,
      }
    - {
        id: l14_p05,
        contentType: google,
        name: "Subtitles vs captions",
        deckUrl: "https://docs.google.com/presentation/d/e/A11Y-COURSE-NOT-PUBLISHED-YET/pub",
        pageId: l14_p05,
      }
    - {
