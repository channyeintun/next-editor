  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ နေရာ နှစ်ခုကို တစ်ခုပြီးမှ တစ်ခု ရေးနေရင် တစ်နေ့နေ့မှာ တစ်ခုက လွတ်သွားမှာပါ။ အမှန်လို့
      ယူရတဲ့ မူရင်းကို တစ်နေရာတည်းမှာ ထားပြီး၊ ကျန်တဲ့ derived data အားလုံးကို အစဉ်လိုက် ပြန်ဖတ်လို့ရတဲ့ log ကနေ
      တည်ဆောက်ပါ။
      [[mark:recap-2]] event တွေက ထပ်ရောက်လာနိုင်တာမို့၊ consumer တိုင်းက မြင်ဖူးပြီးသား event ကို မှတ်မိအောင်
      လုပ်ထားရပါမယ်။
      [[mark:next]] ဒီ lesson နဲ့ data အပိုင်း ပြီးပါပြီ။ Booking၊ Payment နဲ့ Notification ကို service အဖြစ်
      ခွဲထုတ်ထားပေမဲ့၊ ကျန်နေတဲ့ app အဟောင်းက အခုထိ ကြီးနေပါသေးတယ်။ နောက် lesson မှာတော့ အတူတူ deploy လုပ်ရတဲ့
      app ကြီး၊ ဆိုလိုတာက monolith တစ်ခုကို ဘာကြောင့်၊ ဘယ်အစီအစဉ်နဲ့ ခွဲထုတ်မလဲ ဆိုတာကို လေ့လာသွားပါမယ်။
    sources:
