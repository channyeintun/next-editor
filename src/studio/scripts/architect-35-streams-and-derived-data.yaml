    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ ကိုယ့် system ထဲမှာ နေရာ နှစ်ခုကို တစ်ခုပြီးမှ တစ်ခု ရေးနေတဲ့ code
      တစ်နေရာကို ရှာကြည့်ပါ။ database မှာ သိမ်းပြီးမှ message ပို့တာ၊ cache ကို ပြင်တာ၊ search index ထဲ ထည့်တာ၊
