      ပျက်သွားရင် ဘာလွတ်သွားမလဲ ဆိုတာပါ တွဲရေးပါ။ တစ်ခုထက်ပို တွေ့ရင် ငွေနဲ့ ဆိုင်တဲ့ နေရာကို အရင် ရွေးပါ။
    sources:
