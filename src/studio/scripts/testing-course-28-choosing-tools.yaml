      package.json: |
        {
          "name": "testing-course-tea-shop",
          "private": true,
          "version": "1.0.0",
          "type": "module",
          "scripts": {
            "dev": "vite --host 0.0.0.0 --port 5173 --strictPort",
            "test": "vitest"
          },
          "devDependencies": {
            "vite": "7.3.7",
            "vitest": "5.1.0"
          }
        }
      src/kitchen.js: |
        export const READY_AFTER_MS = 3 * 60 * 1000;

        export function createKitchen({ print }) {
          const queue = [];
          let lastNo = 0;
          return {
            add(order) {
              lastNo += 1;
              const ticket = { no: lastNo, ...order };
              queue.push(ticket);
              print(ticket);
              return ticket;
            },
            next: () => queue.shift(),
            size: () => queue.length,
          };
        }

        export function brew(ticket, onReady) {
          setTimeout(() => onReady(ticket), READY_AFTER_MS);
        }
      src/kitchen.test.js: |
        import { createKitchen } from "./kitchen.js";

        describe("createKitchen", () => {
          test("prints a ticket for each order", () => {
            const print = jest.fn();
            const kitchen = createKitchen({ print });

            kitchen.add({ id: "tea" });

            expect(print).toHaveBeenCalledWith({ no: 1, id: "tea" });
          });

          test("serves tickets in order", () => {
            const kitchen = createKitchen({ print: () => {} });
            kitchen.add({ id: "tea" });
            kitchen.add({ id: "coffee" });

            expect(kitchen.next().id).toBe("tea");
          });
        });
      vite.config.js: |
        import { defineConfig } from "vite";
        import courseVitestBridge from "./course/vitest-bridge.js";

        // The course panel: the dev server runs the real Vitest and the preview shows its results.
        export default defineConfig({
          plugins: [courseVitestBridge()],
        });
      vitest.config.js: |
        import { defineConfig } from "vitest/config";

        export default defineConfig({
          test: {
          },
        });
