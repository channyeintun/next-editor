      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ pull request တိုင်းမှာ test တွေကို CI နဲ့ အလိုလို run
      ခိုင်းခဲ့ပါတယ်။ ဒီ lesson မှာတော့ testing tool တွေ ဘာတွေ ရှိလဲ၊ project တစ်ခုအတွက် ဘယ်လို ရွေးမလဲ
      ဆိုတာ ကြည့်ပြီး၊ Jest နဲ့ ရေးထားတဲ့ test တစ်ခုကို Vitest မှာ run လို့ ရအောင်လည်း ပြောင်းကြည့်ပါမယ်။
      [[mark:draw-runner]] tool တွေကို အလုပ်အလိုက် ခွဲကြည့်ရအောင်။ ပထမက test runner ပါ။ test ဖိုင်တွေကို
      ရှာ၊ run ပြီး ရလဒ်ကို ပြပေးတဲ့ tool ဖြစ်ပြီး၊ Vitest ရယ်၊ Jest ရယ်၊ Mocha ရယ် စတာတွေဟာ runner တွေပါ။
      [[mark:draw-assert]] ဒုတိယက assertion ပါ။ expect လို တန်ဖိုး မှန်မမှန် စစ်ပေးတဲ့ အပိုင်းပါ။ Mocha
      လို runner တချို့မှာ assertion မပါလို့၊ Chai လို library ကို ထပ်ထည့်ရပါတယ်။ [[mark:draw-double]]
      တတိယက test double ပါ။ mock function နဲ့ module mock လို၊ dependency အစစ်ရဲ့ နေရာမှာ အစားထိုးတဲ့ tool
      တွေပါ။ [[mark:draw-env]] စတုတ္ထက environment ပါ။ test ကို Node မှာပဲ run မလား၊ happy dom ဒါမှမဟုတ်
      jsdom ဆောက်ပေးတဲ့ DOM အတုထဲမှာ run မလား ဆိုတာပါ။ [[mark:draw-framework]] Vitest လို test framework
      တစ်ခုက ဒီ လေးမျိုးလုံးကို ပေးထားပြီး၊ watch mode နဲ့ coverage နဲ့ reporter တွေကိုပါ ထည့်ပေးထားပါတယ်။
      DOM library နဲ့ coverage provider လို တချို့ကိုတော့ package သီးသန့် ထပ် install လုပ်ရပါတယ်။ [[mark:draw-browser]] framework အပြင်မှာ ထပ်ထည့်သုံးတဲ့ tool တွေလည်း ရှိပါတယ်။
      Playwright ရယ်၊ WebdriverIO ရယ်၊ Cypress ရယ် စတဲ့ tool တွေက browser အစစ်ကို ထိန်းပြီး end to end
      test တွေကို run ပါတယ်။ Vitest မှာလည်း test ကို browser အစစ်ထဲမှာ run ပေးတဲ့ browser mode ရှိပါတယ်။
      [[mark:draw-util]] နောက်ဆုံးက utility library တွေပါ။ DOM ကို လူ သုံးသလို စစ်တဲ့ Testing Library ရယ်၊
      network ကို အတုလုပ်ပေးတဲ့ Mock Service Worker ရယ်၊ input အမျိုးမျိုးနဲ့ စစ်ပေးတဲ့ fast check ရယ် စတာတွေကို framework
      နဲ့ တွဲသုံးပါတယ်။
    sources:
      - {
          title: "web.dev Learn Testing: Welcome, coming soon (test libraries and utilities, decide on a test framework)",
          url: "https://web.dev/learn/testing/welcome",
        }
      - {
          title: "web.dev Learn Testing: Coming soon",
          url: "https://web.dev/learn/testing/coming-soon",
        }
      - {
          title: "Vitest: Comparisons with Other Test Runners",
          url: "https://vitest.dev/guide/comparisons",
        }
      - { title: "Vitest: Browser Mode (facts A23)", url: "https://vitest.dev/guide/browser/" }
      - {
          title: "Vitest: Mocking requests, MSW (facts B15)",
          url: "https://vitest.dev/guide/mocking/requests",
        }
      - {
          title: "Testing Library: Guiding principles (facts C14)",
          url: "https://testing-library.com/docs/guiding-principles",
        }
      - {
          title: "fast-check: What is property-based testing (facts C17)",
          url: "https://fast-check.dev/docs/introduction/what-is-property-based-testing/",
        }
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 300000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-runner
        type: whiteboard.apply
        at: { mark: draw-runner }
        upsertIds: [a-run-k, a-run-v]
        drawMs: 1500
      - id: draw-assert
        type: whiteboard.apply
        at: { mark: draw-assert }
        upsertIds: [a-assert-k, a-assert-v]
        drawMs: 1500
      - id: draw-double
        type: whiteboard.apply
        at: { mark: draw-double }
        upsertIds: [a-double-k, a-double-v]
        drawMs: 1200
      - id: draw-env
        type: whiteboard.apply
        at: { mark: draw-env }
        upsertIds: [a-env-k, a-env-v]
        drawMs: 1500
      - id: draw-framework
        type: whiteboard.apply
        at: { mark: draw-framework }
        upsertIds: [a-fw-box, a-fw-note]
        drawMs: 2000
      - id: draw-browser
        type: whiteboard.apply
        at: { mark: draw-browser }
        upsertIds: [a-plug-box, a-browser-k, a-browser-v]
        drawMs: 2000
      - id: draw-util
        type: whiteboard.apply
        at: { mark: draw-util }
        upsertIds: [a-util-k, a-util-v]
        drawMs: 1500

  - id: starter
    narration: >
      ဆိုင်ရဲ့ code ကို ကြည့်ရအောင်။ ဒါက မီးဖိုချောင်အတွက် test ဖိုင်ပါ။ ဆိုင်က အရင် Jest သုံးခဲ့တဲ့
      project တစ်ခုကနေ ဒီ ဖိုင်ကို ကူးလာတယ် ဆိုပါစို့။ [[mark:select-top]] ဖိုင်ရဲ့ ထိပ်မှာ မီးဖိုချောင်
      function ကိုပဲ import လုပ်ထားပါတယ်။ describe နဲ့ test နဲ့ expect ကိုတော့ ဘယ်ကမှ import မလုပ်ဘဲ
      သုံးထားပါတယ်။ Jest က ဒါတွေကို global အနေနဲ့ ဖိုင်တိုင်းမှာ အလိုလို ထည့်ပေးလို့ပါ။
      [[mark:select-jest-fn]] ပထမ test ထဲမှာ printer အစား jest fn နဲ့ mock function တစ်ခု ဆောက်ထားပါတယ်။
      အော်ဒါ တစ်ခု ထည့်လိုက်ရင်၊ နံပါတ် တစ် တပ်ထားတဲ့ အော်ဒါ စာရွက်ကို printer ဆီ ပို့လား စစ်ပါတယ်။
      [[mark:select-dummy]] ဒုတိယ test ကတော့ printer နေရာမှာ ဘာမှ မလုပ်တဲ့ function ကို ထည့်ပြီး၊
      အော်ဒါတွေကို ဝင်တဲ့ အစဉ်အတိုင်း ထုတ်ပေးလား စစ်ပါတယ်။
    sources:
      - {
          title: "Vitest: Migrating from Jest, globals as a default (facts A08, A27)",
          url: "https://vitest.dev/guide/migration/jest",
        }
      - {
          title: "web.dev Learn Testing: IDE setup can be a lifesaver",
          url: "https://web.dev/learn/testing/assertions/tools#ide-setup",
        }
    actions:
      - id: close-map
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: select-top
        type: editor.select
        at: { mark: select-top }
        target:
          {
            file: src/kitchen.test.js,
            text: 'import { createKitchen } from "./kitchen.js";',
            occurrence: 1,
          }
      - id: select-jest-fn
        type: editor.select
        at: { mark: select-jest-fn }
        target: { file: src/kitchen.test.js, text: "const print = jest.fn();", occurrence: 1 }
      - id: select-dummy
        type: editor.select
        at: { mark: select-dummy }
        target:
          { file: src/kitchen.test.js, text: "createKitchen({ print: () => {} })", occurrence: 1 }

  - id: panel
    narration: >
      [[mark:ready]] Vitest က ဒီ ဖိုင်ကို run လိုက်တော့ ဘာ ပြလဲ ကြည့်ရအောင်။ ညာဘက်က panel ကလည်း code
      ပြောင်းတိုင်း ပြန် run တဲ့ တကယ့် Vitest ရဲ့ ရလဒ်ပါ။ [[mark:read-suite]] အပေါ်မှာ အနီရောင် FAIL
      ပြနေပြီး၊ Failed Suites အပိုင်းမှာ describe ဆိုတာ မသတ်မှတ်ရသေးဘူး ဆိုတဲ့ ReferenceError ပေါ်နေပါတယ်။
      summary မှာလည်း test တစ်ခုမှ မ run ရဘူးလို့ ပြနေပါတယ်။ Vitest မှာ global တွေကို default အနေနဲ့
      ပိတ်ထားလို့၊ ဖိုင်ကို စ run တာနဲ့ ပထမဆုံး တွေ့တဲ့ describe မှာတင် ကျသွားတာပါ။
    sources:
      - { title: "Vitest: globals (facts A08)", url: "https://vitest.dev/config/globals" }
      - {
          title: "Vitest: Migrating from Jest, globals as a default",
          url: "https://vitest.dev/guide/migration/jest#globals-as-a-default",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-start-fail
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 3, delayMs: 1000 }
      - id: expect-start-suite
        type: expect.preview
        at: { afterAction: expect-start-fail }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-kind, value: suite }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-message
        type: expect.preview
        at: { afterAction: expect-start-suite }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-message, value: "describe is not defined" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-none
        type: expect.preview
        at: { afterAction: expect-start-message }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-total, value: "0" }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: port
    chapter: "Jest test ကို Vitest မှာ run ရအောင်"
    narration: >
      [[mark:type-import]] ဒါကြောင့် ဖိုင်ရဲ့ ထိပ်ဆုံးမှာ vitest ကနေ import လုပ်တဲ့ line တစ်ကြောင်း
      ထည့်ပါမယ်။ describe နဲ့ test နဲ့ expect အပြင်၊ Jest ရဲ့ jest object နေရာမှာ သုံးရမယ့် vi ကိုပါ
      ထည့်ထားပါတယ်။ Vitest နဲ့ ပထမဆုံး test ရေးခဲ့တဲ့ lesson မှာ tutorial အဟောင်းက ကူးထားတဲ့ ဖိုင်ကို
      ပြင်ခဲ့တာနဲ့ အတူတူပါပဲ။ [[mark:read-jest]] panel ကို ကြည့်ပါ။ Failed Suites ပျောက်သွားပြီး test နှစ်ခု run
      သွားပါပြီ။ ဒုတိယ test က အမှန်ခြစ်နဲ့ pass ဖြစ်ပေမဲ့၊ ပထမ test မှာတော့ ကြက်ခြေခတ် ပေါ်နေပါတယ်။
      ဒီတစ်ခါ jest ဆိုတာ မသတ်မှတ်ရသေးဘူး ဆိုတဲ့ ReferenceError ပါ။ [[mark:select-frame]] code frame ကလည်း
      jest fn ရှိတဲ့ ဒီ line ကို ညွှန်ပြနေပါတယ်။ Vitest မှာ jest ဆိုတဲ့ object မရှိဘဲ၊ mock function
      ဆောက်တာလို အလုပ်တွေကို vi က လုပ်ပေးလို့ပါ။ [[mark:ai-slip]] Vitest ရဲ့ AI နဲ့ test ရေးတဲ့ guide
      ကလည်း AI ရေးတဲ့ Vitest test တွေမှာ အဖြစ်အများဆုံး အမှားက ဒီလို API မှားသုံးတာပဲလို့ ပြောထားပါတယ်။ AI
      model တွေက Jest code အများကြီးကနေ သင်ယူထားလို့၊ vi fn အစား jest fn ကို ရေးမိတတ်တာပါ။ [[mark:type-vifn]] jest fn ရှိတဲ့ line ရဲ့ အပေါ်မှာ vi fn နဲ့ line
      အသစ်ကို ရေးပြီး၊ line အဟောင်းကိုတော့ comment လုပ်ထားပါမယ်။ ကိုယ့် project မှာဆိုရင်တော့ jest ဆိုတဲ့
      စကားလုံးကို vi လို့ ပြောင်းလိုက်ရုံပါပဲ။ [[mark:read-green]] panel ကို ကြည့်ပါ။ test နှစ်ခုလုံး pass
      ဖြစ်ပြီး၊ အစိမ်းရောင် PASS ပေါ်လာပါပြီ။ describe ရော test ရော၊ to Have Been Called With လို matcher
      ရော တစ်လုံးမှ မပြောင်းဘဲ အလုပ်လုပ်ပါတယ်။ Jest test အများစုကို ပြောင်းဖို့ import ထည့်ပြီး jest
      နေရာမှာ vi သုံးရုံ လုံလောက်ပါတယ်။ [[mark:globals-tip]] test ဖိုင် အများကြီး ရှိတဲ့ project
      ဆိုရင်တော့ ဖိုင်တိုင်းမှာ import မထည့်ဘဲ၊ config ထဲက globals option ကို ဖွင့်ထားလို့လည်း ရပါတယ်။ ဒီ
      course မှာတော့ editor အတွက် ပိုရှင်းလို့ import နဲ့ပဲ သုံးပါတယ်။
    sources:
      - {
          title: "Vitest: Migrating from Jest (facts A27)",
          url: "https://vitest.dev/guide/migration/jest",
        }
      - { title: "Vitest: vi.fn", url: "https://vitest.dev/api/vi#vi-fn" }
      - {
          title: "Vitest: Writing tests with AI, Jest APIs in generated tests (facts D17)",
          url: "https://vitest.dev/guide/learn/writing-tests-with-ai",
        }
      - {
          title: "web.dev Learn Testing: IDE setup can be a lifesaver",
          url: "https://web.dev/learn/testing/assertions/tools#ide-setup",
        }
    actions:
      - id: type-import
        type: editor.type
        at: { mark: type-import }
        target: { file: src/kitchen.test.js, after: "", occurrence: 1 }
        text: "import { describe, expect, test, vi } from \"vitest\";\n"
      - id: expect-jest-count
        type: expect.preview
        at: { afterAction: type-import }
        timeoutMs: 8000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-failed, value: "1" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-jest-passed
        type: expect.preview
        at: { afterAction: expect-jest-count }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "1" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-jest-message
        type: expect.preview
        at: { afterAction: expect-jest-passed }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-message, value: "jest is not defined" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-jest-frame
        type: expect.preview
        at: { afterAction: expect-jest-message }
        timeoutMs: 5000
        target: { by: testId, value: vt-frame-1 }
        attribute: { name: data-line, value: "6" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-frame
        type: editor.select
        at: { mark: select-frame }
        target: { file: src/kitchen.test.js, text: "jest.fn()", occurrence: 1 }
      - id: type-vifn
        type: editor.type
        at: { mark: type-vifn }
        target:
          {
            file: src/kitchen.test.js,
            after: "\"prints a ticket for each order\", () => {\n    ",
            occurrence: 1,
          }
        # The one-insert line replacement (COURSE-KIT §5): at the jest.fn() line's first character,
        # the vi.fn() line, a newline, the indent and "// " — every state parses.
        text: "const print = vi.fn();\n    // "
      - id: expect-green
        type: expect.preview
        at: { afterAction: type-vifn }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-two
        type: expect.preview
        at: { afterAction: expect-green }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "2" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-import-file
        type: expect.file
        at: { afterAction: expect-two }
        path: src/kitchen.test.js
        contains: "import { describe, expect, test, vi } from \"vitest\";\nimport { createKitchen } from \"./kitchen.js\";\n"
      - id: expect-vifn-file
        type: expect.file
        at: { afterAction: expect-import-file }
        path: src/kitchen.test.js
        contains: "    const print = vi.fn();\n    // const print = jest.fn();\n"

  - id: differences
    chapter: "Jest နဲ့ Vitest ဘာကွာလဲ"
    narration: >
      [[mark:board-diff]] Jest နဲ့ Vitest က API အများစု တူပေမဲ့၊ ကွာတာ နည်းနည်း ရှိပါတယ်။ test တွေကို
      ပြောင်းရွှေ့တဲ့အခါ တွေ့ရမယ့် အချက်တွေကို ယှဉ်ကြည့်ရအောင်။ [[mark:draw-globals]] ပထမ နှစ်ချက်က ခုနက
      မြင်ခဲ့တာပါ။ Jest မှာ global တွေ အလိုလို ပါပေမဲ့ Vitest မှာ import လုပ်ရပြီး၊ jest fn နဲ့ jest mock
      အစား vi fn နဲ့ vi mock ကို သုံးရပါတယ်။ [[mark:draw-factory]] တတိယက module mock ရဲ့ factory function
      ပါ။ Jest မှာ factory က ပြန်ပေးတဲ့ တန်ဖိုးကို default export အဖြစ် ယူပေမဲ့၊ Vitest မှာတော့ export
      တစ်ခုချင်းစီ ပါတဲ့ object ကို ပြန်ပေးရပါတယ်။ ဥပမာ မီးဖိုချောင် module ကို mock လုပ်ရင်၊ မီးဖိုချောင်
      ဆောက်ပေးတဲ့ function ကို သူ့နာမည်နဲ့ object ထဲ ထည့်ပေးရမှာပါ။ [[mark:draw-hooks]] စတုတ္ထက hook တွေ
      run တဲ့ အစဉ်ပါ။ after Each လို after hook တွေကို Jest က ရေးထားတဲ့ အစဉ်အတိုင်း run ပေမဲ့၊ Vitest က
      stack လို ပြောင်းပြန် run ပါတယ်။ [[mark:draw-done]] ပဉ္စမက done callback ပါ။ Jest မှာ done ဆိုတဲ့
      function ကို ခေါ်မှ test ပြီးတယ်လို့ ရေးလို့ ရပေမဲ့၊ Vitest မှာ မရလို့ async နဲ့ await ကို
      သုံးရပါတယ်။ [[mark:draw-each]] နောက်ဆုံးက table test ပါ။ test each က Jest နဲ့ တူအောင် ပါပြီး၊ Vitest
      မှာ test for ဆိုတာ ထပ်ပါပါတယ်။ ဒီ course မှာ code အသစ်တွေအတွက် test for ကို သုံးခဲ့ပါတယ်။
    sources:
      - {
          title: "Vitest: Migrating from Jest, module mocks, hooks, done callback (facts A27)",
          url: "https://vitest.dev/guide/migration/jest",
        }
      - { title: "Vitest: sequence.hooks", url: "https://vitest.dev/config/sequence" }
      - { title: "Vitest: test.each and test.for", url: "https://vitest.dev/api/test#test-for" }
    actions:
      - id: board-diff
        type: whiteboard.apply
        at: { mark: board-diff }
        open: true
        clear: true
        upsertIds: [b-title, b-jest-box, b-vitest-box, b-jest-h, b-vitest-h]
        drawMs: 2500
      - id: draw-globals
        type: whiteboard.apply
        at: { mark: draw-globals }
        upsertIds: [b-1-j, b-1-v, b-2-j, b-2-v]
        drawMs: 2500
      - id: draw-factory
        type: whiteboard.apply
        at: { mark: draw-factory }
        upsertIds: [b-3-j, b-3-v]
        drawMs: 1800
      - id: draw-hooks
        type: whiteboard.apply
        at: { mark: draw-hooks }
        upsertIds: [b-4-j, b-4-v]
        drawMs: 1800
      - id: draw-done
        type: whiteboard.apply
        at: { mark: draw-done }
        upsertIds: [b-5-j, b-5-v]
        drawMs: 1500
      - id: draw-each
        type: whiteboard.apply
        at: { mark: draw-each }
        upsertIds: [b-6-j, b-6-v]
        drawMs: 1500

  - id: choose
    chapter: "Tool ကို ဘယ်လို ရွေးမလဲ"
    narration: >
      [[mark:board-choose]] ဒါဆို project တစ်ခုအတွက် tool ကို ဘယ်လို ရွေးမလဲ။ [[mark:draw-project]]
      ပထမဆုံး project က ဘာ သုံးထားလဲ ကြည့်ပါ။ ဆိုင်ရဲ့ website လို Vite နဲ့ ဆောက်ထားတဲ့ project ဆိုရင်၊
      Vitest က Vite ရဲ့ config နဲ့ plugin တွေကို ပြန်သုံးလို့ build နဲ့ test အတွက် setting နှစ်စုံ
      ထိန်းစရာ မလိုပါဘူး။ [[mark:draw-modern]] ဒုတိယက ES module တွေ၊ TypeScript နဲ့ JSX ကို ထပ် setup
      မလုပ်ဘဲ သုံးလို့ ရလား ဆိုတာပါ။ တတိယက မြန်ဆန်မှုနဲ့ watch mode ပါ။ code ပြောင်းတိုင်း ဆိုင်ရာ test
      တွေကိုပဲ ချက်ချင်း ပြန် run ပေးရင် အလုပ် ပိုမြန်ပါတယ်။ [[mark:draw-team]] စတုတ္ထက ecosystem နဲ့
      အဖွဲ့ပါ။ ကိုယ် သုံးချင်တဲ့ library တွေနဲ့ အလုပ်လုပ်လား၊ အဖွဲ့က ဘယ် tool ကို သိပြီးသားလဲ ဆိုတာလည်း
      အရေးကြီးပါတယ်။ [[mark:draw-browser-need]] ပဉ္စမက browser အစစ် လိုမလို ပါ။ layout လို browser
      အစစ်မှာမှ သိနိုင်တဲ့ အရာတွေကို DOM အတုနဲ့ စစ်လို့ မရပါဘူး။ [[mark:draw-downloads]] download
      အရေအတွက်ကိုတော့ သတိထားပြီး ကြည့်ပါ။ npm ပေါ်မှာ ၂၀၂၅ ခုနှစ် နိုဝင်ဘာလ ၄ ရက်နေ့အထိ တစ်ပတ်မှာ Vitest ရဲ့
      download က Jest ရဲ့ ထက်ဝက်လောက်ပဲ ရှိခဲ့ပေမဲ့၊ ၂၀၂၆ ခုနှစ် အလားတူ တစ်ပတ်မှာတော့ Jest ရဲ့ သုံးဆလောက်
      ဖြစ်လာပါတယ်။ ဒါပေမဲ့ course အစပိုင်းမှာ ပြောခဲ့သလို၊ npm download မှာ CI စက်တွေနဲ့ bot တွေ package
      ကို install လုပ်တာတွေပါ ပါလို့ လူ ဘယ်နှယောက် သုံးလဲ ဆိုတာ မဟုတ်ပါဘူး။ ကိုယ့် project အတွက် ဆုံးဖြတ်ချက်ကိုတော့ download က
      မပေးနိုင်ပါဘူး။ [[mark:draw-pair]] tool တွေကို ပြိုင်ဘက်လို မမြင်ဘဲ တွဲသုံးကြတာလည်း များပါတယ်။
      browser မလိုတဲ့ logic နဲ့ component test တွေကို Vitest နဲ့ မြန်မြန် စစ်ပြီး၊ customer သုံးမယ့်
      အရေးကြီးတဲ့ လမ်းကြောင်းတွေကိုတော့ browser အစစ်ထဲမှာ Playwright လို tool နဲ့ စစ်တာ ပုံမှန်ပါပဲ။
      [[mark:same-basics]] ဘယ် tool ကို ရွေးရွေး၊ test နဲ့ expect နဲ့ hook လို အခြေခံ အကြောင်းအရာတွေက tool
      တိုင်းမှာ ဆင်တူလို့၊ ဒီ course မှာ သင်ခဲ့တာတွေက တခြား tool တွေမှာလည်း အသုံးဝင်ပါတယ်။ Jest နဲ့
      အဆင်ပြေနေတဲ့ project ကိုလည်း မဖြစ်မနေ ပြောင်းစရာ မလိုပါဘူး။ ပြောင်းရွှေ့တာ ကိုယ်တိုင်က အလုပ် တစ်ခု
      ဖြစ်လို့၊ ရလာမယ့် အကျိုးနဲ့ ချိန်ပြီးမှ ဆုံးဖြတ်ပါ။
    sources:
      - { title: "Vitest: Why Vitest (facts A26)", url: "https://vitest.dev/guide/why" }
      - {
          title: "Vitest: Comparisons, Mocha, Playwright and Cypress",
          url: "https://vitest.dev/guide/comparisons",
        }
      - {
          title: "npm downloads API, last week of vitest and jest (facts B07)",
          url: "https://api.npmjs.org/downloads/point/last-week/vitest",
        }
      - {
          title: "web.dev Learn Testing: Primitives are a guide",
          url: "https://web.dev/learn/testing/assertions/tools#primitives-guide",
        }
      - {
          title: "web.dev Learn Testing: Appendix, Vitest as a test runner",
          url: "https://web.dev/learn/testing/appendix#vitest",
        }
    actions:
      - id: board-choose
        type: whiteboard.apply
        at: { mark: board-choose }
        clear: true
        upsertIds: [c-title]
      - id: draw-project
        type: whiteboard.apply
        at: { mark: draw-project }
        upsertIds: [c-1]
        drawMs: 1500
      - id: draw-modern
        type: whiteboard.apply
        at: { mark: draw-modern }
        upsertIds: [c-2, c-3]
        drawMs: 2000
      - id: draw-team
        type: whiteboard.apply
        at: { mark: draw-team }
        upsertIds: [c-4]
        drawMs: 1200
      - id: draw-browser-need
        type: whiteboard.apply
        at: { mark: draw-browser-need }
        upsertIds: [c-5]
        drawMs: 1200
      - id: draw-downloads
        type: whiteboard.apply
        at: { mark: draw-downloads }
        upsertIds: [c-dl]
        drawMs: 1800
      - id: draw-pair
        type: whiteboard.apply
        at: { mark: draw-pair }
        upsertIds: [c-pair-box, c-pair]
        drawMs: 2000

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ test framework တစ်ခုမှာ runner နဲ့ assertion နဲ့ test double နဲ့ environment
      တွေ ပါပြီး၊ browser အစစ် လိုတဲ့ test တွေနဲ့ utility တွေအတွက်တော့ သီးသန့် tool တွေကို တွဲသုံးပါတယ်။
      tool ကို project က သုံးထားတာ၊ လိုအပ်ချက်နဲ့ အဖွဲ့နဲ့ ကိုက်အောင် ရွေးပြီး၊ download အရေအတွက်ကိုတော့
      အရိပ်အမြွက် တစ်ခုလောက်ပဲ ယူပါ။ [[mark:recap-port]] Jest test ကို Vitest မှာ run ဖို့ import ထည့်ပြီး
      jest ကို vi နဲ့ အစားထိုးတာ များသောအားဖြင့် လုံလောက်ပါတယ်။ နောက် lesson မှာတော့ AI က code ရေးပေးတဲ့
      ဒီခေတ်မှာ AI ရေးတဲ့ code ကို ကိုယ့် test တွေနဲ့ ဘယ်လို စစ်မလဲ ဆိုတာ ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "web.dev Learn Testing: Coming soon",
          url: "https://web.dev/learn/testing/coming-soon",
        }
      - {
          title: "Vitest: Comparisons with Other Test Runners",
          url: "https://vitest.dev/guide/comparisons",
        }
    actions:
      - id: close-choose
        type: whiteboard.apply
        at: { scene: start }
        open: false
checks:
  - { type: timing.p95Ms, max: 300 }
