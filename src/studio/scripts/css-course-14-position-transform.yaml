# CSS course (Burmese), lesson 14 of 43: position and transform.
#
# Narration is Burmese (voice-script.md next to this file is the same text,
# span by span; DESIGN.md is the design brief). Every [[mark:…]] sits where its
# action begins, at a sentence end; each span carries one piece of meaning.
#
# Shape: board (recall lesson 13's normal flow; the five position values, in
# flow or not, measured from what; out of flow; the offsets and inset) → code
# tour (index.html: the special's price and badge, the stamp, the cups, the
# call button; empty styles.css) → relative price (space kept) → absolute badge
# (predict first, then its offsets fly it to the page corner) → board (the
# containing-block search) → the card made relative catches the badge → fixed
# call button + scrolls → sticky menu headings + scrolls (in flow, stuck, gone
# with its section; z-index: 1) → quiz (does an offset take a box out of
# flow?) → board (position changes layout, transform only paints; the
# function list; origin; translate %) → stamp: rotate, scale, translate (each
# declaration repeats the list) and skew on the order button → the individual
# rotate/scale/translate properties on the logo → two cups, same functions in
# opposite order → board (the moving-paper model) → the special turns in 3-D:
# rotateY, transform-origin left, perspective on the list; perspective()
# named → recap, hand-off to flexbox (lesson 15).
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set(; no postcss config; no reload.
# Every keystroke-typed value has no misleading valid prefix (unitless "10",
# "8", "16", "600" lengths and "-1", "3" angles are invalid and ignored;
# "scale: 1" equals the untransformed state). The stamp's 2nd and 3rd
# transform declarations and both cup rules are line-by-line: keystroke
# typing would pass through valid shorter lists ("translate(80px" alone
# moves the cup, a half-typed second function drops the whole list for
# seconds).
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
