  - id: code-tour
    narration: >
      ဆိုင်ရဲ့ code ထဲမှာ ဒီ Promise ကို ကြည့်ရအောင်။ ဒါက ပို့ခ တွက်ပေးတဲ့ delivery ဖိုင်ပါ။
      [[mark:select-rules]] ပို့ခ စည်းကမ်းကတော့၊ ၂၀၀၀၀ ကျပ်နဲ့ အထက် အော်ဒါတွေကို ပို့ခ မယူဘဲ
      ပို့ပေးပါတယ်။ ကျန်တဲ့ အော်ဒါတွေအတွက်တော့ ပထမ ၂ ကီလိုမီတာအထိ ၁၀၀၀ ကျပ် ဖြစ်ပြီး၊
      အဲဒီ နောက် ကီလိုမီတာ တစ်ခုစီအတွက် ၃၀၀ ကျပ် ထပ်ပေါင်းပါတယ်။ [[mark:select-async]] အောက်က function
      ကတော့ မြို့နယ် တစ်ခုအတွက် ပို့ခကို တွက်ပေးတာ ဖြစ်ပြီး၊ async function ဖြစ်လို့ Promise ကို
      ပြန်ပေးပါတယ်။ [[mark:select-await]] အထဲမှာ ဆိုင်ကနေ မြို့နယ်အထိ ဘယ်နှစ် ကီလိုမီတာ ဝေးလဲ
      ဆိုတာကို အကွာအဝေး ဇယားကနေ မေးပြီး၊ အဖြေ ရတဲ့အထိ await နဲ့ စောင့်ပါတယ်။
      [[mark:open-test]] ဒါကတော့ ဒီ
      function အတွက် မောင်မောင် ရေးထားတဲ့ test ဖိုင်ပါ။ [[mark:select-bahan]] ပထမ test က
      ဗဟန်းကို ၃၀၀၀ ကျပ် ဖိုး အော်ဒါ ပို့ရင်၊ ပို့ခ ၁၃၀၀ ကျပ် ဖြစ်ရမယ်လို့ စစ်ထားပါတယ်။ ဗဟန်းက ၃
      ကီလိုမီတာ ဝေးလို့ ၁၀၀၀ နဲ့ ၃၀၀ ကို ပေါင်းတာပါ။ [[mark:select-then]] ဒုတိယ test ကတော့ ၂၅၀၀၀
      ကျပ် ဖိုး အော်ဒါကြီးကို ပို့ခ မယူဘဲ ပို့ပေးရမယ်လို့ စစ်ထားပြီး၊ အဖြေကို then နဲ့ ယူထားပါတယ်။
      then ဆိုတာ Promise ထဲကို အဖြေ ရောက်လာတဲ့အခါ run ဖို့ function တစ်ခုကို ကြိုပေးထားတာပါ။
    sources:
      - {
          title: "Vitest: Testing Asynchronous Code, Async/Await",
          url: "https://vitest.dev/guide/learn/async#async-await",
        }
      - {
          title: "MDN: Promise.prototype.then()",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise/then",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: select-rules
        type: editor.select
        at: { mark: select-rules }
        target:
          {
            file: src/delivery.js,
            text: "if (total >= 20000) return 0;\n  return 1000 + 300 * Math.ceil(Math.max(0, km - 2));",
            occurrence: 1,
          }
      - id: select-async
        type: editor.select
        at: { mark: select-async }
        target: { file: src/delivery.js, text: "async function quoteDelivery", occurrence: 1 }
      - id: select-await
        type: editor.select
        at: { mark: select-await }
        target: { file: src/delivery.js, text: "await distanceTo(township)", occurrence: 1 }
      - id: open-test
        type: workspace.openFile
        at: { mark: open-test }
        path: src/delivery.test.js
      - id: select-bahan
        type: editor.select
        at: { mark: select-bahan }
        target:
          {
            file: src/delivery.test.js,
            text: "const fee = quoteDelivery(\"bahan\", 3000);\n  expect(fee).toBe(1300);",
            occurrence: 1,
          }
      - id: select-then
        type: editor.select
        at: { mark: select-then }
        target:
          {
            file: src/delivery.test.js,
            text: "quoteDelivery(\"bahan\", 25000).then((fee) => {\n    expect(fee).toBe(0);\n  });",
            occurrence: 1,
          }

  - id: panel
    narration: >
      [[mark:ready]] Vitest က ဒီ test နှစ်ခုကို run လိုက်တော့ ဘာ ပြလဲ ကြည့်ရအောင်။ ညာဘက်က panel
      ကလည်း code ပြောင်းတိုင်း သူ့ဘာသာ ပြန် run နေတဲ့ တကယ့် Vitest ရဲ့ ရလဒ်ပါ။ [[mark:read-tree]]
      အပေါ်ဆုံးက status က အနီရောင် FAIL ဖြစ်နေပါတယ်။ test စာရင်းမှာတော့ ဗဟန်း test က
      ကြက်ခြေခတ်နဲ့ fail ဖြစ်နေပြီး၊ အော်ဒါကြီး test က အမှန်ခြစ်နဲ့ pass ဖြစ်နေပါတယ်။ [[mark:read-promise]] Failed Tests အပိုင်းမှာ ၁၃၀၀ ဖြစ်ရမယ့်
      နေရာမှာ Promise တစ်ခု ရနေတယ်လို့ ပြောနေပြီး၊ အစိမ်းရောင် Expected ရဲ့ အောက်မှာ ၁၃၀၀၊
      အနီရောင် Received ရဲ့ အောက်မှာ Promise လို့ ပြထားပါတယ်။ ဆိုလိုတာက test က ပို့ခကို မစစ်ဘဲ၊
      လက်မှတ်ကိုပဲ စစ်မိနေတာပါ။ [[mark:read-unhandled]] သူ့အောက်မှာ Unhandled Errors ဆိုတဲ့
      အပိုင်း တစ်ခု ထပ်ပေါ်နေပါသေးတယ်။ အဲဒါကိုတော့ ပထမ test ကို ပြင်ပြီးမှ ပြန်လာကြည့်ပါမယ်။
    sources:
      - { title: "Vitest: Testing Asynchronous Code", url: "https://vitest.dev/guide/learn/async" }
      - { title: "Vitest: expect, toBe", url: "https://vitest.dev/api/expect#tobe" }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-start-fail
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 3, delayMs: 1000 }
      - id: expect-start-counts
        type: expect.preview
        at: { afterAction: expect-start-fail }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "1" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-bahan
        type: expect.preview
        at: { afterAction: expect-start-counts }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-1 }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-promise
        type: expect.preview
        at: { mark: read-promise }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute:
          { name: data-message, value: "expected Promise{…} to be 1300 // Object.is equality" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-received
        type: expect.preview
        at: { afterAction: expect-start-promise }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-actual, value: "Promise {}" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-unhandled
        type: expect.preview
        at: { mark: read-unhandled }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-2 }
        attribute: { name: data-kind, value: unhandled }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: await
    chapter: "Await နဲ့ အဖြေကို စောင့်ရအောင်"
    narration: >
      ဗဟန်း test ကို ပြင်ဖို့၊ ပို့ခ ရတဲ့အထိ test ကို စောင့်ခိုင်းရပါမယ်။ [[mark:type-async]] test ရဲ့
      function ရှေ့မှာ async ကို ထည့်ပြီး၊ ပို့ခ တွက်တဲ့ function ကို ခေါ်တဲ့ နေရာမှာ await ကို
      ထည့်ပါမယ်။ await ကို async function ထဲမှာပဲ သုံးလို့ ရတဲ့အတွက် နှစ်ခုလုံး လိုပါတယ်။
      [[mark:read-bahan]] panel ကို ကြည့်ပါ။ ဗဟန်း test ရှေ့မှာ အမှန်ခြစ် ပေါ်လာပါပြီ။ ဒီတစ်ခါ test
      က Promise ကို မစစ်တော့ဘဲ၊ Promise ထဲက ၁၃၀၀ ကို ရတဲ့အထိ စောင့်ပြီးမှ စစ်လိုက်တာပါ။ test
      function က async ဖြစ်သွားတော့ Promise ကို ပြန်ပေးတဲ့အတွက်၊ Vitest ကလည်း အဲဒီ Promise
      ပြီးတဲ့အထိ စောင့်ပေးပါတယ်။
    sources:
      - {
          title: "Vitest: Testing Asynchronous Code, Async/Await",
          url: "https://vitest.dev/guide/learn/async#async-await",
        }
      - { title: "Vitest: test", url: "https://vitest.dev/api/test" }
    actions:
      - id: type-async
        type: editor.type
        at: { mark: type-async }
        target:
          { file: src/delivery.test.js, after: 'test("charges 1300 to Bahan", ', occurrence: 1 }
        text: "async "
      - id: type-await
        type: editor.type
        at: { afterAction: type-async }
        target: { file: src/delivery.test.js, after: "const fee = ", occurrence: 1 }
        text: "await "
      - id: expect-bahan-passed
        type: expect.preview
        at: { afterAction: type-await }
        timeoutMs: 8000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "2" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-bahan-test
        type: expect.preview
        at: { afterAction: expect-bahan-passed }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-1 }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: then-trap
    chapter: "အမှန်ခြစ် ပြနေတဲ့ then ထောင်ချောက်"
    narration: >
      ဒါပေမဲ့ panel ကို သေချာ ကြည့်ပါ။ test နှစ်ခုလုံး အမှန်ခြစ် ဖြစ်နေပြီး၊ အောက်ဆုံးက summary
      မှာလည်း ၂ ခုလုံး pass လို့ ပြနေပါတယ်။ အပေါ်ဆုံးက status ကတော့ အနီရောင် FAIL ပဲ
      ဖြစ်နေပါသေးတယ်။ ဘာကြောင့်လဲဆိုတော့ Unhandled Errors အပိုင်း ကျန်နေသေးလို့ပါ။
      [[mark:read-unhandled-2]] Unhandled Errors ဆိုတာ test တစ်ခုရဲ့ အပြင်ဘက်မှာ
      ဖြစ်ပြီး၊ ဘယ်သူမှ မဖမ်းထားတဲ့ error တွေကို ပြတဲ့ အပိုင်းပါ။ ဒီမှာ ပို့ခ သုည ဖြစ်ရမယ့် နေရာမှာ
      ၁၃၀၀ ရနေတယ်လို့ ပြောနေပါတယ်။ [[mark:select-then-expect]] code frame ကလည်း အော်ဒါကြီး
      test ရဲ့ then ထဲက ဒီ စစ်ချက်ကို ညွှန်ပြနေပါတယ်။ ဆိုလိုတာက ဒီ စစ်ချက်က တကယ် ကျသွားပါတယ်။
      ဒါပေမဲ့ test function က then ကို ချိတ်ပြီးတာနဲ့ ဘာကိုမှ မစောင့်ဘဲ ပြီးသွားလို့၊ Vitest အတွက်တော့
      error မတက်ဘဲ ပြီးသွားတဲ့ test တစ်ခုပါပဲ။ [[mark:why-late]] စစ်ချက်က test ပြီးမှ နောက်ကျပြီး run
      တာ ဖြစ်လို့၊ သူ ကျသွားတာကို test ရဲ့ ရလဒ်ထဲ ထည့်လို့ မရတော့ပါဘူး။ ကိုယ့် ကွန်ပျူတာရဲ့
      terminal မှာဆိုရင် summary ထဲမှာ Errors ဆိုတဲ့ line ကိုပါ ထပ်ပြပါတယ်။ ဒါကြောင့်
      အမှန်ခြစ်တွေတင် မကြည့်ဘဲ၊ error အပိုင်းကိုပါ အမြဲ ဖတ်ပါ။ [[mark:type-return]] ဒီ test ကို
      ပြင်ဖို့ then ဆက်ထားတဲ့ တစ်ခုလုံးကို return လုပ်ပေးလိုက်ပါမယ်။ test function က Promise ကို
      ပြန်ပေးတော့၊ ခုနကလိုပဲ Vitest က အဲဒီ Promise ပြီးတဲ့အထိ စောင့်ပေးပါတယ်။
      [[mark:read-honest]] အခုတော့ အော်ဒါကြီး test က ကြက်ခြေခတ်နဲ့ ရိုးရိုးသားသား fail
      ဖြစ်သွားပြီး၊ Failed Tests အပိုင်းမှာ သုည ဖြစ်ရမယ့် နေရာမှာ ၁၃၀၀ ရနေတယ်လို့ ပြောနေပါတယ်။
      Unhandled Errors အပိုင်းလည်း ပျောက်သွားပါပြီ။ ဒါဆို မှားနေတာက test လား၊ code လား။ ဆိုင်ရဲ့
      စည်းကမ်းအရ ၂၀၀၀၀ ကျပ်နဲ့ အထက် အော်ဒါကို ပို့ခ မယူရတဲ့အတွက်၊ test က မှန်ပါတယ်။
    sources:
      - {
          title: "Vitest: Testing Asynchronous Code, Unhandled Rejections",
          url: "https://vitest.dev/guide/learn/async#unhandled-rejections",
        }
      - {
          title: "Vitest: Testing Asynchronous Code, Assertion Counting",
          url: "https://vitest.dev/guide/learn/async#assertion-counting",
        }
      - {
          title: "Vitest 5 migration: un-awaited assertions (facts A15, capture 09)",
          url: "https://vitest.dev/guide/migration/",
        }
    actions:
      - id: select-then-expect
        type: editor.select
        at: { mark: select-then-expect }
        target: { file: src/delivery.test.js, text: "expect(fee).toBe(0);", occurrence: 1 }
      - id: expect-trap-status
        type: expect.preview
        at: { afterAction: select-then-expect }
        timeoutMs: 5000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-trap-unhandled
        type: expect.preview
        at: { afterAction: expect-trap-status }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-kind, value: unhandled }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-trap-message
        type: expect.preview
        at: { afterAction: expect-trap-unhandled }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-message, value: "expected 1300 to be +0 // Object.is equality" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: type-return
        type: editor.type
        at: { mark: type-return }
        target:
          {
            file: src/delivery.test.js,
            after: "test(\"delivers big orders for free\", () => {\n  ",
            occurrence: 1,
          }
        text: "return "
      - id: expect-honest-red
        type: expect.preview
        at: { afterAction: type-return }
        timeoutMs: 8000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-failed, value: "1" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-honest-kind
        type: expect.preview
        at: { afterAction: expect-honest-red }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-kind, value: test }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-honest-message
        type: expect.preview
        at: { afterAction: expect-honest-kind }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-message, value: "expected 1300 to be +0 // Object.is equality" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-honest-test
        type: expect.preview
        at: { afterAction: expect-honest-message }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-2 }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-honest-one-block
        # The narration says the Unhandled Errors block is gone: one failure block left, the test's.
        type: expect.preview
        at: { afterAction: expect-honest-test }
        timeoutMs: 5000
        target: { by: testId, value: vt-errors }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: fix
    narration: >
      [[mark:open-delivery]] delivery ဖိုင်ကို ပြန်ကြည့်ရအောင်။ [[mark:select-fee-call]] ပို့ခ တွက်တဲ့
      function ကို ခေါ်တဲ့ နေရာမှာ ကီလိုမီတာကိုပဲ ပေးထားပြီး၊ အော်ဒါ တန်ဖိုးကို ပေးဖို့
      ကျန်ခဲ့ပါတယ်။ ဒါကြောင့် ဘယ်လောက် ကြီးတဲ့ အော်ဒါပဲ ဖြစ်ဖြစ် ပို့ခ ယူနေတာပါ။
      [[mark:type-total]] အော်ဒါ တန်ဖိုးကို ထည့်ပေးလိုက်ပါမယ်။ [[mark:read-green]] panel ကို ကြည့်ပါ။
      Vitest က ပြန် run လိုက်တော့ test နှစ်ခုလုံး pass ဖြစ်ပြီး၊ အပေါ်ဆုံးမှာလည်း အစိမ်းရောင် PASS
      ပေါ်လာပါပြီ။ then
      နဲ့ ရေးထားတဲ့ test က ဒီ bug ကို အစကတည်းက ဖမ်းမိနိုင်ပေမဲ့၊ Promise ကို စောင့်မထားလို့
      အမှန်ခြစ် ပြနေခဲ့တာပါ။ [[mark:assertions-note]] test ရဲ့ ထိပ်မှာ expect assertions ကို
      ဂဏန်း တစ်ခုနဲ့ ရေးထားရင်လည်း၊ test ပြီးတဲ့အချိန်မှာ စစ်ချက် အဲဒီ အရေအတွက် မ run ရသေးရင်
      Vitest က fail ပေးလို့၊ ဒီလို နောက်ကျတဲ့ စစ်ချက်ကို ဖမ်းမိပါတယ်။
    sources:
      - {
          title: "Vitest: expect.assertions",
          url: "https://vitest.dev/api/expect#expect-assertions",
        }
      - {
          title: "Vitest: Testing Asynchronous Code, Assertion Counting",
          url: "https://vitest.dev/guide/learn/async#assertion-counting",
        }
    actions:
      - id: open-delivery
        type: workspace.openFile
        at: { mark: open-delivery }
        path: src/delivery.js
      - id: select-fee-call
        type: editor.select
        at: { mark: select-fee-call }
        target: { file: src/delivery.js, text: "deliveryFee(km)", occurrence: 1 }
      - id: type-total
        type: editor.type
        at: { mark: type-total }
        target: { file: src/delivery.js, after: "return deliveryFee(km", occurrence: 1 }
        text: ", total"
      - id: expect-green
        type: expect.preview
        at: { afterAction: type-total }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-green-two
        type: expect.preview
        at: { afterAction: expect-green }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "2" }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: resolves-rejects
    chapter: "Resolves နဲ့ rejects"
    narration: >
      Promise ကို စစ်ဖို့ နောက်ထပ် နည်း တစ်ခု ရှိပါသေးတယ်။ [[mark:open-test-again]] test ဖိုင်ကို
      ပြန်ဖွင့်ပြီး၊ ကမာရွတ်ကို ပို့ရင် ပို့ခ ၁၉၀၀ ကျပ် ဖြစ်ရမယ် ဆိုတဲ့ test အသစ်ကို ထည့်ပါမယ်။
      ကမာရွတ်က ၅ ကီလိုမီတာ ဝေးလို့၊ ၁၀၀၀ ပေါ်မှာ ၃၀၀ ကို သုံးခါ ပေါင်းတာပါ။
      [[mark:select-resolves]] ဒီတစ်ခါ Promise ထဲက အဖြေကို await နဲ့ အရင် ထုတ်မယူဘဲ၊ expect ထဲကို
      Promise အတိုင်း ထည့်ပြီး resolves ကို သုံးထားပါတယ်။ resolves က Promise ထဲက အဖြေကို ထုတ်ပြီးမှ
      နောက်က to Be နဲ့ စစ်ပေးတာပါ။ ဒီ line မှာ await ကို တမင် မထည့်ထားပါဘူး။ Vitest ၅ က ဘာ
      ပြောမလဲ ကြည့်ဖို့ပါ။
      [[mark:read-not-awaited]] ညာဘက်က panel မှာ test အသစ်က fail ဖြစ်နေပြီး၊ resolves နဲ့ စစ်တဲ့
      Promise ကို await မလုပ်ထားဘူးလို့ Vitest က ပြောနေပါတယ်။ await ထည့်ပြီး ရေးရမယ့်
      ပုံစံကိုလည်း တစ်ခါတည်း ပြပေးထားပါတယ်။ Vitest ၅ မတိုင်ခင်က ဒီလို ရေးထားရင် warning ပဲ
      ပြခဲ့ပေမဲ့၊ Vitest ၅ ကစပြီး resolves နဲ့ rejects ကို await မလုပ်ရင် test ကို fail ပေးပါတယ်။
      [[mark:type-await-2]]
      expect ရဲ့ ရှေ့မှာ await ကို ထည့်လိုက်ပါမယ်။ [[mark:read-three]] panel ကို ကြည့်ပါ။ test
      သုံးခုလုံး pass ဖြစ်သွားပါပြီ။ [[mark:type-rejects]] rejects ကတော့ Promise က error နဲ့
      reject ဖြစ်ရမယ့် အခါအတွက်ပါ။ ဆိုင်က မပို့တဲ့ ဒဂုံ မြို့နယ်ကို မေးရင်၊ အကွာအဝေး မရှိဘူး ဆိုတဲ့ error နဲ့
      ကျရမယ်လို့ စစ်တဲ့ test ကို ထည့်ပါမယ်။ [[mark:read-four]] ဒီ test လည်း pass ဖြစ်ပြီး၊ summary
      မှာ ၄ ခုလုံး pass လို့ ပြနေပါတယ်။ [[mark:select-rejects]] rejects က Promise ထဲက error ကို
      ထုတ်ပြီး to Throw နဲ့ စစ်ပေးတာ ဖြစ်လို့၊ ဒီမှာလည်း await ကို မမေ့ရပါဘူး။
    sources:
      - { title: "Vitest: expect, resolves", url: "https://vitest.dev/api/expect#resolves" }
      - { title: "Vitest: expect, rejects", url: "https://vitest.dev/api/expect#rejects" }
      - {
          title: "Vitest 5: Stricter Assertions (facts A15)",
          url: "https://vitest.dev/blog/vitest-5",
        }
    actions:
      - id: open-test-again
        type: workspace.openFile
        at: { mark: open-test-again }
        path: src/delivery.test.js
      - id: type-resolves
        type: editor.type
        at: { afterAction: open-test-again }
        target:
          {
            file: src/delivery.test.js,
            after: "    expect(fee).toBe(0);\n  });\n});\n",
            occurrence: 1,
          }
        text: "\ntest(\"charges 1900 to Kamayut\", async () => {\n  const quote = quoteDelivery(\"kamayut\", 3000);\n  expect(quote).resolves.toBe(1900);\n});\n"
        cadence: block
      - id: select-resolves
        type: editor.select
        at: { mark: select-resolves }
        target:
          { file: src/delivery.test.js, text: "expect(quote).resolves.toBe(1900);", occurrence: 1 }
      - id: expect-not-awaited
        type: expect.preview
        at: { afterAction: select-resolves }
        timeoutMs: 8000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-total, value: "3" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-not-awaited-count
        type: expect.preview
        at: { afterAction: expect-not-awaited }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-failed, value: "1" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-not-awaited-message
        type: expect.preview
        at: { afterAction: expect-not-awaited-count }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        textContains: "was not awaited"
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: type-await-2
        type: editor.type
        at: { mark: type-await-2 }
        target:
          {
            file: src/delivery.test.js,
            after: "const quote = quoteDelivery(\"kamayut\", 3000);\n  ",
            occurrence: 1,
          }
        text: "await "
      - id: expect-three
        type: expect.preview
        at: { afterAction: type-await-2 }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-three-count
        type: expect.preview
        at: { afterAction: expect-three }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "3" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: type-rejects
        type: editor.type
        at: { mark: type-rejects }
        target:
          {
            file: src/delivery.test.js,
            after: "  await expect(quote).resolves.toBe(1900);\n});\n",
            occurrence: 1,
          }
        text: "\ntest(\"rejects an unknown township\", async () => {\n  const quote = quoteDelivery(\"dagon\", 3000);\n  await expect(quote).rejects.toThrow(\"no distance\");\n});\n"
        cadence: block
      - id: expect-four
        type: expect.preview
        at: { afterAction: type-rejects }
        timeoutMs: 8000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "4" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-four-test
        type: expect.preview
        at: { afterAction: expect-four }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-4 }
        attribute: { name: data-name, value: "rejects an unknown township" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-rejects
        type: editor.select
        at: { mark: select-rejects }
        target:
          {
            file: src/delivery.test.js,
            text: 'await expect(quote).rejects.toThrow("no distance");',
            occurrence: 1,
          }
      - id: expect-test-file
        type: expect.file
        at: { afterAction: select-rejects }
        path: src/delivery.test.js
        contains: 'const fee = await quoteDelivery("bahan", 3000);'
      - id: expect-test-file-return
        type: expect.file
        at: { afterAction: expect-test-file }
        path: src/delivery.test.js
        contains: 'return quoteDelivery("bahan", 25000).then((fee) => {'
      - id: expect-test-file-resolves
        type: expect.file
        at: { afterAction: expect-test-file-return }
        path: src/delivery.test.js
        contains: "await expect(quote).resolves.toBe(1900);"
      - id: expect-test-file-rejects
        type: expect.file
        at: { afterAction: expect-test-file-resolves }
        path: src/delivery.test.js
        contains: 'await expect(quote).rejects.toThrow("no distance");'
      - id: expect-delivery-file
        type: expect.file
        at: { afterAction: expect-test-file-rejects }
        path: src/delivery.js
        contains: "return deliveryFee(km, total);"

  - id: timeout
    narration: >
      [[mark:board-timeout]] နောက်ဆုံး တစ်ခုက ဘယ်တော့မှ မပြီးတဲ့ Promise ပါ။ ဥပမာ မီးဖိုချောင်က
      ဘယ်တော့မှ အဖြေ ပြန်မပေးတဲ့ Promise ကို test တစ်ခုက စောင့်နေတယ် ဆိုပါစို့။ [[mark:draw-default]] Vitest က test တစ်ခုကို default
      အနေနဲ့ ၅ စက္ကန့်အထိ စောင့်ပေးပါတယ်။ အဲဒီ အချိန်ကို ကျော်သွားရင် test ကို ရပ်ပြီး၊ timed out
      ဆိုတဲ့ error နဲ့ fail ပေးပါတယ်။ ဒါကြောင့် မပြီးတဲ့ test တစ်ခုကြောင့် test အားလုံး ရပ်နေတာမျိုး
      မဖြစ်ပါဘူး။ [[mark:draw-option]] test တစ်ခုချင်းစီအတွက် timeout option ကို ပေးလို့လည်း
      ရပါတယ်။ ဒီ ဥပမာမှာ ၁၀၀၀ မီလီစက္ကန့် ပေးထားလို့၊ တစ်စက္ကန့် ကျော်တာနဲ့ timed out
      ဖြစ်သွားပြီလို့ ပြပါတယ်။ [[mark:draw-config]] project တစ်ခုလုံးအတွက်ဆိုရင်တော့ config ထဲက
      test Timeout ဆိုတဲ့ option နဲ့ ပြောင်းလို့ ရပါတယ်။ [[mark:draw-careful]] ဒါပေမဲ့ test တစ်ခု
      ဘာကြောင့် နှေးလဲ မသိဘဲ timeout ကို တိုးလိုက်တာက ပြဿနာကို ဖုံးထားတာပဲ ဖြစ်တတ်ပါတယ်။ အချိန် စောင့်ရတဲ့ code
      အတွက်တော့ နောက်ပိုင်း lesson တွေမှာ fake timers ကို သုံးသွားပါမယ်။
    sources:
      - {
          title: "Vitest: Testing Asynchronous Code, Timeouts",
          url: "https://vitest.dev/guide/learn/async#timeouts",
        }
      - { title: "Vitest: testTimeout (facts A14)", url: "https://vitest.dev/config/testtimeout" }
      - { title: "Vitest: test options, timeout", url: "https://vitest.dev/api/test#timeout" }
    actions:
      - id: board-timeout
        type: whiteboard.apply
        at: { mark: board-timeout }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-default
        type: whiteboard.apply
        at: { mark: draw-default }
        upsertIds: [b-default]
        drawMs: 1500
      - id: draw-option
        type: whiteboard.apply
        at: { mark: draw-option }
        upsertIds: [b-code-box, b-code, b-error]
        drawMs: 3000
      - id: draw-config
        type: whiteboard.apply
        at: { mark: draw-config }
        upsertIds: [b-config]
        drawMs: 1500
      - id: draw-careful
        type: whiteboard.apply
        at: { mark: draw-careful }
        upsertIds: [b-careful]
        drawMs: 1500

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ async function က အဖြေကို တိုက်ရိုက် မပေးဘဲ Promise ဆိုတဲ့ လက်မှတ်ကို
      ပြန်ပေးပါတယ်။ ဒါကြောင့် test ထဲမှာ Promise ကို await နဲ့ စောင့်ရမယ်၊ ဒါမှမဟုတ် return လုပ်ပြီး
      Vitest ကို စောင့်ခိုင်းရပါမယ်။ resolves နဲ့ rejects က Promise ကို တိုက်ရိုက် စစ်ပေးပြီး၊ Vitest ၅
      မှာ သူတို့ ရှေ့က await ကို မဖြစ်မနေ ထည့်ရပါတယ်။ [[mark:recap-then]] then ကို စောင့်မထားတဲ့ test
      က ကျနေရင်တောင် အမှန်ခြစ် ပြနေတတ်လို့၊ Unhandled Errors အပိုင်းကိုပါ အမြဲ ဖတ်ပါ။ ပြီးမသွားတဲ့
      Promise ကိုတော့ timeout က ရပ်ပေးပါတယ်။ နောက် lesson မှာတော့ code မရေးခင် ကျမယ့် test ကို
      အရင် ရေးတဲ့ TDD ဆိုတဲ့ နည်းကို စကြည့်ပါမယ်။
    sources:
      - { title: "Vitest: Testing Asynchronous Code", url: "https://vitest.dev/guide/learn/async" }
      - {
          title: "web.dev Learn Testing: What to test, an aside on test-driven development",
          url: "https://web.dev/learn/testing/get-started/what-to-test",
        }
    actions:
      - id: close-timeout
        type: whiteboard.apply
        at: { scene: start }
        open: false
checks:
  - { type: timing.p95Ms, max: 300 }
