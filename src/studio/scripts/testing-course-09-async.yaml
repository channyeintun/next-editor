scenes:
  - id: open
    chapter: "Async code နဲ့ Promise"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ test for ကို သုံးပြီး၊ data ဇယား တစ်ခုထဲက row
      တစ်ခုချင်းစီကို test တစ်ခုစီ ဖြစ်အောင် လုပ်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ အဖြေကို ချက်ချင်း
      မပေးဘဲ နောက်မှ ပေးတဲ့ async code ကို ဘယ်လို test လုပ်ရမလဲ ဆိုတာ ကြည့်ပါမယ်။ ဒီလို code
      မှာ test က အမှန်ခြစ် ပြနေပေမဲ့ တကယ်တော့ ဘာမှ မစစ်ထားတာမျိုး ဖြစ်တတ်ပါတယ်။
      [[mark:draw-order]] async code ကို ဆိုင်မှာ လက်ဖက်ရည် မှာတာနဲ့ ယှဉ်ပြီး
      စဉ်းစားကြည့်ရအောင်။ ကောင်တာမှာ လက်ဖက်ရည် မှာလိုက်ရင်၊ လက်ဖက်ရည်ကို ချက်ချင်း
      မရပါဘူး။ [[mark:draw-ticket]] အဲဒီအစား နံပါတ် ပါတဲ့ လက်မှတ် တစ်စောင်ကို ချက်ချင်း ရပါတယ်။
      JavaScript မှာ ဒီ လက်မှတ်ကို Promise လို့ ခေါ်ပါတယ်။ Promise ဆိုတာ နောက်မှ ရမယ့်
      အဖြေအတွက် ကြိုပေးထားတဲ့ လက်မှတ်ပါ။ async ဆိုတဲ့ စကားလုံးနဲ့ ရေးထားတဲ့ function တွေက
      တန်ဖိုးကို တိုက်ရိုက် ပြန်မပေးဘဲ၊ ဒီလို Promise ကိုပဲ အမြဲ ပြန်ပေးပါတယ်။ [[mark:draw-drink]]
      ခဏနေတော့ လက်ဖက်ရည် ရလာသလိုပဲ၊ Promise ထဲကိုလည်း တကယ့် အဖြေ ရောက်လာပါတယ်။
      [[mark:draw-await]] await ဆိုတာကတော့ လက်မှတ်ကို ကိုင်ပြီး၊ လက်ဖက်ရည် ရတဲ့အထိ ကောင်တာမှာ
      စောင့်နေတာနဲ့ တူပါတယ်။ [[mark:draw-no-await]] await မပါရင်တော့ လက်ထဲမှာ လက်ဖက်ရည်
      မဟုတ်ဘဲ လက်မှတ်ပဲ ရှိနေပါသေးတယ်။
    sources:
