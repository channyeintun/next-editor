      package.json: |
        {
          "name": "testing-course-tea-shop",
          "private": true,
          "version": "1.0.0",
          "type": "module",
          "scripts": {
            "dev": "vite --host 0.0.0.0 --port 5173 --strictPort",
            "test": "vitest"
          },
          "devDependencies": {
            "vite": "7.3.7",
            "vitest": "5.1.0"
          }
        }
      src/delivery.js: |
        import { distanceTo } from "./distance-table.js";

        export function deliveryFee(km, total = 0) {
          if (km === 0) return 0;
          if (total >= 20000) return 0;
          return 1000 + 300 * Math.ceil(Math.max(0, km - 2));
        }

        export async function quoteDelivery(township, total) {
          const km = await distanceTo(township);
          return deliveryFee(km);
        }
      src/delivery.test.js: |
        import { expect, test } from "vitest";
        import { quoteDelivery } from "./delivery.js";

        test("charges 1300 to Bahan", () => {
          const fee = quoteDelivery("bahan", 3000);
          expect(fee).toBe(1300);
        });

        test("delivers big orders for free", () => {
          quoteDelivery("bahan", 25000).then((fee) => {
            expect(fee).toBe(0);
          });
        });
      src/distance-table.js: |
        // How far each township is from the shop, in km. It is async because the
        // real answer will come from a distance service (lesson 16); for now it
        // answers from this table.
        const KM = { sanchaung: 2, bahan: 3, kamayut: 5, hlaing: 7 };

        export async function distanceTo(township) {
          if (!(township in KM)) throw new Error(`no distance for ${township}`);
          return KM[township];
        }
      vite.config.js: |
        import { defineConfig } from "vite";
        import courseVitestBridge from "./course/vitest-bridge.js";

        // The course panel: the dev server runs the real Vitest and the preview shows its results.
        export default defineConfig({
          plugins: [courseVitestBridge()],
        });
      vitest.config.js: |
        import { defineConfig } from "vitest/config";

        export default defineConfig({
          test: {
          },
        });
