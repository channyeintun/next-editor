    chapter: ရွေးစရာ တိုင်းမှာ ပေးရတာ ရှိတယ်
    narration: >
      [[mark:sel-price-each]] ပြီးခဲ့တဲ့ lesson မှာ app ရဲ့ data ပုံစံကို ဒီ data ဖိုင်ထဲ ရေးခဲ့ပါတယ်။ order line
      ထဲမှာ ဈေးကို ထပ်မှတ်လိုက်တော့ အော်ဒါ အဟောင်းတွေရဲ့ ဈေး မပြောင်းတော့ပေမဲ့၊ သိမ်းရမယ့် data နည်းနည်း
      ပိုလာပါတယ်။ [[mark:tradeoff]] ဒီလို တစ်ခု ရဖို့ နောက်တစ်ခုကို လျှော့ပေးရတာကို trade off လို့ ခေါ်ပါတယ်။
      ဒီနေ့တော့ ပိုကြီးတဲ့ trade off နှစ်ခုကို ကြည့်ပါမယ်။ customer တွေ ငွေကို ဘယ်လို ချေမလဲ၊ database ကို ဘယ်သူ
      ထိန်းမလဲ ဆိုတာပါ။ ဒီလို ရွေးချယ်မှုတွေက app တစ်ခုလုံးရဲ့ ပုံစံကို သတ်မှတ်လို့ architecture decision လို့
      ခေါ်ပြီး၊ နောက်မှ ပြောင်းဖို့ ခက်ပါတယ်။ ဒါကြောင့် ဆုံးဖြတ်ရုံနဲ့ မပြီးဘဲ၊ ဘာကြောင့် ဒီလို ရွေးခဲ့လဲ
      ဆိုတာကိုလည်း ရေးထားရပါမယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The new SDLC (design and architecture)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: sel-price-each,
          type: editor.select,
          at: { mark: sel-price-each },
          target: { file: docs/data.md, text: "price_each (မှာတဲ့အချိန်က ဈေး)", occurrence: 1 },
        }

  - id: who-decides
    chapter: ဘယ်သူ ဆုံးဖြတ်မလဲ
    narration: >
      [[mark:k-title]] ဒီလို မေးခွန်းကို agent ကို မေးကြည့်ရင်၊ ယုတ္တိရှိပုံရတဲ့ အဖြေ တစ်ခုကို ချက်ချင်း
      ထုတ်ပေးနိုင်ပါတယ်။ ဒါပေမဲ့ ဘယ်အဖြေက မှန်လဲ ဆိုတာ နည်းပညာထက် ဆိုင်ရဲ့ ငွေ၊ လူ၊ အချိန် လို business
      ကိစ္စတွေပေါ်မှာ ပိုမူတည်ပါတယ်။ [[mark:k-business]] ဥပမာ ဆိုင်ပိုင်ရှင် မြမြ က app ကို ဆက် အလုပ်လုပ်နေအောင်
      ထားဖို့ တစ်လ ၃၀၀၀၀ ကျပ်ထက် မသုံးချင်ပါဘူး။ app ကို ကိုယ်တစ်ယောက်တည်း ထိန်းရမှာ ဖြစ်ပြီး၊ ဆိုင်
      အလုပ်အများဆုံး အချိန်က မနက်ပိုင်းပါ။ ဒီလို အချက်တွေကို ကိုယ်က ရေးမပေးရင် agent ဆီမှာ မရှိပါဘူး။ ဒါကြောင့် ဒီ
      အချက်တွေကို ချိန်ပြီး ဆုံးဖြတ်တာက ကိုယ်နဲ့ မြမြ ရဲ့ အလုပ်ပါ။ [[mark:k-agent]] ဆုံးဖြတ်ပြီးသား ပုံစံကို
      ရှင်းရှင်း ရေးပေးထားရင်တော့၊ အဲဒီအတိုင်း ဆောက်တာမှာ agent က မြန်ပါတယ်။ ဆိုတော့ ဆုံးဖြတ်တာနဲ့ အဲဒီ
      ဆုံးဖြတ်ချက်ကို ရေးထားတာက ကိုယ့်ဘက်က အလုပ် ဖြစ်ပြီး၊ ရေးထားတဲ့အတိုင်း ဆောက်တာက agent ဘက်က အလုပ်ပါ။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The new SDLC (design and architecture)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "Architectural Decision Records (adr.github.io): an AD is a justified design choice",
          url: "https://adr.github.io/",
        }
    actions:
      - {
          id: draw-k-title,
          type: whiteboard.apply,
          at: { mark: k-title },
          open: true,
          clear: true,
          upsertIds: [k-title],
        }
      - {
          id: draw-k-business,
          type: whiteboard.apply,
          at: { mark: k-business },
          upsertIds: [k-b1, k-t1, k-t1b],
          drawMs: 1500,
        }
      - {
          id: draw-k-agent,
          type: whiteboard.apply,
          at: { mark: k-agent },
          upsertIds: [k-a1, k-b2, k-t2, k-t2b],
          drawMs: 1600,
        }

  - id: kinds
    narration: >
      [[mark:k-p1]] trade off တွေထဲမှာ ခဏခဏ တွေ့ရတဲ့ အမျိုးအစား သုံးမျိုး ရှိပါတယ်။ ပထမက ကိုယ်တိုင် ဆောက်မလား၊
      တခြားသူ ဆောက်ပြီး ထိန်းပေးနေတဲ့ service ကို ငှားသုံးမလား ဆိုတာပါ။ ကိုယ်တို့ ဆိုင်မှာတော့ database ကို ဘယ်သူ
      ထိန်းမလဲ ဆိုတဲ့ မေးခွန်းပါ။ [[mark:k-p2]] ဒုတိယက ရိုးရှင်းတာနဲ့ ပြောင်းလွယ်တာကြား ရွေးတာပါ။ app ဆောက်ဖို့
      တခြားသူတွေ အသင့် ရေးထားတဲ့ code အစု၊ framework ကို သုံးရင် နောက်မှ လုပ်ဆောင်ချက် အသစ်တွေ တိုးရ လွယ်ပေမဲ့၊
      နားလည်ရမယ့် အပိုင်းတွေ များလာပါတယ်။ AGENTS.md မှာ framework မသုံးဘူး လို့ ရေးခဲ့တာက ဒီ trade off မှာ
      ရိုးရှင်းတဲ့ဘက်ကို ရွေးခဲ့တာပါ။ [[mark:k-p3]] တတိယက အခု လုပ်မလား၊ နောက်မှ လုပ်မလား ဆိုတာပါ။ online
      ငွေချေတာကို ပထမ version မှာ ထည့်မလား ဆိုတာ ဒီ အမျိုးအစားထဲ ပါပါတယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The new SDLC (design and architecture)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: draw-k-p1,
          type: whiteboard.apply,
          at: { mark: k-p1 },
          upsertIds: [k-sub, k-p1, k-e1],
          drawMs: 1500,
        }
      - {
          id: draw-k-p2,
          type: whiteboard.apply,
          at: { mark: k-p2 },
          upsertIds: [k-p2, k-e2],
          drawMs: 1200,
        }
      - {
          id: draw-k-p3,
          type: whiteboard.apply,
          at: { mark: k-p3 },
          upsertIds: [k-p3, k-e3],
          drawMs: 1200,
        }

  - id: scale
    chapter: ချိန်ခွင်ပေါ် တင်ကြည့်ရအောင်
    narration: >
      [[mark:t-title]] database ကို ဘယ်သူ ထိန်းမလဲ ဆိုတာကို ချိန်ခွင် တစ်ခုပေါ် တင်ပြီး ချိန်ကြည့်ရအောင်။ ပထမ
      အဆင့်က ရွေးစရာ၊ option တွေကို စာရင်းလုပ်တာပါ။ [[mark:t-left]] တစ်ခုက server တစ်လုံး ငှားပြီး database ကို
      ကိုယ်တိုင် တင်ပြီး ထိန်းထားတာပါ။ စိတ်ကြိုက် ပြင်လို့ ရပေမဲ့၊ data ကို မိတ္တူကူးတဲ့ backup နဲ့ software
      update တွေကို ကိုယ်တိုင် လုပ်ရပြီး၊ ညဘက် ပျက်ရင်လည်း ကိုယ်ပဲ ထပြင်ရပါမယ်။ [[mark:t-right]] နောက်တစ်ခုက
      ကုမ္ပဏီ တစ်ခုက ထိန်းပေးတဲ့ managed database service ကို ငှားသုံးတာပါ။ backup နဲ့ update ကို service ဘက်က
      လုပ်ပေးပြီး၊ app သေးသေးလေးတွေ အခမဲ့ သုံးလို့ရတဲ့ free tier လည်း ရှိတတ်ပါတယ်။ ဒါပေမဲ့ အဲဒီ service ကို
      မှီခိုရပါတယ်။ [[mark:t-cost]] ဒုတိယ အဆင့်က option တစ်ခုစီရဲ့ ကုန်ကျမှုကို ဒီနေ့ရော နောင်လတွေမှာပါ ကြည့်တာပါ။
      ကိုယ်ပိုင် server က ငှားခ အပြင် လတိုင်း ထိန်းရတဲ့ အချိန်ပါ ကုန်ပြီး၊ managed service ကတော့ app ကြီးလာလို့
      free tier ကျော်ရင် ငွေ စကုန်ပါမယ်။ [[mark:t-change]] တတိယ အဆင့်က ဘာဖြစ်ရင် ပြန်စဉ်းစားမလဲ ဆိုတာ
      ကြိုတွေးထားတာပါ။ service ကို စိတ်မချရတော့တဲ့ နေ့မှာ data တွေကို ယူပြီး ထွက်လို့ ရရပါမယ်။ [[mark:t-decide]]
      ကိုယ်တစ်ယောက်တည်း ထိန်းရပြီး သုံးလို့ရတဲ့ ငွေ၊ budget လည်း နည်းတော့၊ ဒီ ဆိုင်အတွက်တော့ managed service ရဲ့
      free tier ကို ရွေးပါတယ်။
    sources:
      - {
          title: "AWS docs: What is Amazon RDS? (an example of a managed database service: backups, patching, free tier)",
          url: "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Welcome.html",
        }
      - {
          title: "The New SDLC (Burmese edition): The new SDLC (design and architecture)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: draw-t-title,
          type: whiteboard.apply,
          at: { mark: t-title },
          open: true,
          clear: true,
          upsertIds: [t-title, t-beam, t-post, t-base],
          drawMs: 1500,
        }
      - {
          id: draw-t-left,
          type: whiteboard.apply,
          at: { mark: t-left },
          upsertIds: [t-h-left, t-l1, t-l2, t-l3],
          drawMs: 1800,
        }
      - {
          id: draw-t-right,
          type: whiteboard.apply,
          at: { mark: t-right },
          upsertIds: [t-h-right, t-r1, t-r2, t-r3],
          drawMs: 1800,
        }
      - {
          id: draw-t-cost,
          type: whiteboard.apply,
          at: { mark: t-cost },
          upsertIds: [t-cost],
          drawMs: 900,
        }
      - {
