          upsertIds: [t-decide],
          drawMs: 1000,
        }

  - id: adr-parts
    chapter: Decision record ရေးနည်း
    narration: >
      [[mark:a-title]] ဆုံးဖြတ်ပြီးရင် ဘာကို ဘာကြောင့် ရွေးခဲ့လဲ ဆိုတာ ရေးထားရပါမယ်။ ဘာဆုံးဖြတ်လဲ၊ ဘာကြောင့်လဲ
      ဆိုတာကို ရက်စွဲနဲ့ မှတ်ထားတဲ့ စာကို decision record လို့ ခေါ်ပြီး၊ architecture decision record ကို
      အတိုကောက် ADR လို့ ခေါ်ပါတယ်။ [[mark:a-ctx]] ADR မှာ အများအားဖြင့် အပိုင်း လေးပိုင်း ပါပါတယ်။ ပထမ အပိုင်း
      Context က ဘာကြောင့် ဆုံးဖြတ်ရလဲ၊ အဲဒီနေ့က အခြေအနေ ဘယ်လိုလဲ ဆိုတာပါ။ [[mark:a-opt]] Options မှာ ချိန်ခဲ့တဲ့
      ရွေးစရာတွေကို ရေးပါတယ်။ [[mark:a-dec]] Decision မှာ ဘာကို ရွေးလိုက်လဲ ဆိုတာ ရေးပါတယ်။ [[mark:a-con]]
      Consequences မှာတော့ ဒီ ရွေးချယ်မှုကြောင့် ဘာ ပေးရမလဲ၊ ဘာဖြစ်ရင် ပြန်စဉ်းစားမလဲ ဆိုတာ ရေးပါတယ်။ ကောင်းကျိုး
      တင် မကဘဲ ဆိုးကျိုးကိုပါ ရေးရပါမယ်။ [[mark:a-short]] ADR ကို တိုတိုပဲ ရေးပြီး နံပါတ်နဲ့ ရက်စွဲ တပ်ပါတယ်။
      [[mark:a-keep]] နောက်ပိုင်း ဆုံးဖြတ်ချက် ပြောင်းရင်တောင် ADR အဟောင်းကို မဖျက်ပါဘူး။ ADR အသစ် တစ်ခု ရေးပြီး
      အဟောင်းကို အစားထိုးလိုက်ပြီ လို့ မှတ်ပါတယ်။ ဒါမှ အစက ဘာကြောင့် ရွေးခဲ့လဲ၊ နောက်မှ ဘာကြောင့် ပြောင်းခဲ့လဲ
      ဆိုတာ နှစ်ခုလုံး မပျောက်မှာပါ။
    sources:
      - {
          title: "Michael Nygard: Documenting Architecture Decisions",
          url: "https://cognitect.com/blog/2011/11/15/documenting-architecture-decisions",
        }
      - {
          title: "MADR: Markdown Architectural Decision Records (Considered Options; date; superseded)",
          url: "https://adr.github.io/madr/",
        }
    actions:
      - {
          id: draw-a-title,
          type: whiteboard.apply,
          at: { mark: a-title },
          open: true,
          clear: true,
          upsertIds: [a-title],
        }
      - {
          id: draw-a-ctx,
          type: whiteboard.apply,
          at: { mark: a-ctx },
          upsertIds: [a-n1, a-d1],
          drawMs: 1000,
        }
      - {
          id: draw-a-opt,
          type: whiteboard.apply,
          at: { mark: a-opt },
          upsertIds: [a-n2, a-d2],
          drawMs: 1000,
        }
      - {
          id: draw-a-dec,
          type: whiteboard.apply,
          at: { mark: a-dec },
          upsertIds: [a-n3, a-d3],
          drawMs: 1000,
        }
      - {
          id: draw-a-con,
          type: whiteboard.apply,
          at: { mark: a-con },
          upsertIds: [a-n4, a-d4],
          drawMs: 1200,
        }
      - {
          id: draw-a-short,
          type: whiteboard.apply,
          at: { mark: a-short },
          upsertIds: [a-short],
          drawMs: 900,
        }
      - {
          id: draw-a-keep,
          type: whiteboard.apply,
          at: { mark: a-keep },
          upsertIds: [a-keep],
          drawMs: 1100,
        }

  - id: adr-1
    narration: >
      [[mark:close-a]] ကဲ၊ ကိုယ်တို့ ဆိုင်ရဲ့ ADR တွေကို ရေးကြည့်ရအောင်။ [[mark:open-dec]] docs ထဲက decisions
      ဖိုင်မှာ project တစ်ခုလုံးရဲ့ ADR တွေကို အစဉ်လိုက် စုထားမှာ ဖြစ်ပြီး၊ အခု ခေါင်းစဉ်ပဲ ရှိပါသေးတယ်။
      [[mark:type-adr1a]] ပထမ ADR က ဘာလုပ်မယ်၊ ဘာမလုပ်ဘူး ဆိုတဲ့ scope ကို ဆုံးဖြတ်တုန်းက မြမြ နဲ့ ရွေးခဲ့တဲ့
      ငွေချေနည်းပါ။ ခေါင်းစဉ် တစ်ကြောင်းတည်း ဖတ်ရုံနဲ့ ဆုံးဖြတ်ချက်ကို သိနိုင်အောင် ရေးပြီး ရက်စွဲ တပ်ထားပါတယ်။
      [[mark:sel-adr1-ctx]] Context ကို ကြည့်ပါ။ ဆုံးဖြတ်တဲ့ နေ့က အခြေအနေကို မှတ်ထားတာ ဖြစ်လို့၊ နောက်တစ်ချိန် ဒီ
      အခြေအနေ ပြောင်းသွားရင် ဆုံးဖြတ်ချက်ကိုလည်း ပြန်စဉ်းစားလို့ ရပါတယ်။ [[mark:sel-adr1-opt]] Options မှာ
      ချိန်ခဲ့တဲ့ နှစ်လမ်းလုံးကို ရေးထားလို့၊ မရွေးခဲ့တဲ့ လမ်းကိုလည်း မေ့မသွားပါဘူး။
    sources:
      - {
          title: "Michael Nygard: Documenting Architecture Decisions",
          url: "https://cognitect.com/blog/2011/11/15/documenting-architecture-decisions",
        }
    actions:
      - { id: close-a, type: whiteboard.apply, at: { mark: close-a }, open: false }
      - { id: open-dec, type: workspace.openFile, at: { mark: open-dec }, path: docs/decisions.md }
      - id: type-adr1a
        type: editor.type
        at: { mark: type-adr1a }
        target: { file: docs/decisions.md, after: "# Decisions\n\n", occurrence: 1 }
        text: "## ADR-001 · v1 မှာ ငွေကို ကောင်တာမှာပဲ ချေမယ် (2026-11-08)\nContext — online ငွေပေးချေမှုက risk အများဆုံး၊ ကုန်ကျစရိတ် အများဆုံး။ ကောင်တာမှာ ချေတာ အခုလည်း အလုပ်ဖြစ်နေတယ်။\nOptions — online ငွေပေးချေမှု ထည့်မယ် / ကောင်တာမှာပဲ ချေမယ်\n"
        cadence: line-by-line
      - {
          id: sel-adr1-ctx,
          type: editor.select,
          at: { mark: sel-adr1-ctx },
          target:
            {
              file: docs/decisions.md,
              text: "Context — online ငွေပေးချေမှုက risk အများဆုံး၊ ကုန်ကျစရိတ် အများဆုံး။",
              occurrence: 1,
            },
        }
      - {
          id: sel-adr1-opt,
          type: editor.select,
          at: { mark: sel-adr1-opt },
          target:
            {
              file: docs/decisions.md,
              text: "Options — online ငွေပေးချေမှု ထည့်မယ် / ကောင်တာမှာပဲ ချေမယ်",
              occurrence: 1,
            },
        }

  - id: adr-1-decision
    narration: >
      [[mark:type-adr1b]] ပြီးတော့ ရွေးလိုက်တဲ့ လမ်းနဲ့ သူ့ နောက်ဆက်တွဲကို ထည့်ပါတယ်။ [[mark:sel-adr1-con]]
      Consequences ကို သတိထား ကြည့်ပါ။ ဒီ ရွေးချယ်မှုမှာ ပေးရတဲ့ဘက်ကို ဖုံးမထားပါဘူး။ ငွေ ကြိုမချေရလို့ မှာပြီး
      လာမယူတဲ့သူ ရှိနိုင်ပါတယ်။ ဘယ်လောက် များလာရင် ပြန်စဉ်းစားမလဲ ဆိုတာကိုလည်း ကိန်းဂဏန်းနဲ့ ကြိုရေးထားပါတယ်။
      ပြီးခဲ့တဲ့ lesson မှာ status ကို ပုံသေ စာရင်းနဲ့ ထားခဲ့တော့၊ လာမယူတဲ့ အော်ဒါကို app ထဲမှာ ရေတွက်ပြီး
      ငြင်းခုံစရာ မလိုဘဲ ဆုံးဖြတ်လို့ ရပါမယ်။
    sources:
      - {
          title: "Michael Nygard: Documenting Architecture Decisions",
          url: "https://cognitect.com/blog/2011/11/15/documenting-architecture-decisions",
        }
    actions:
      - id: type-adr1b
        type: editor.type
        at: { mark: type-adr1b }
        target:
          {
            file: docs/decisions.md,
            after: "Options — online ငွေပေးချေမှု ထည့်မယ် / ကောင်တာမှာပဲ ချေမယ်\n",
            occurrence: 1,
          }
        text: "Decision — ကောင်တာမှာပဲ ချေမယ်။\nConsequences — လာမယူတဲ့ အော်ဒါ ရှိနိုင်တယ်။ တစ်မနက် 5 ခုထက် များရင် ပြန်စဉ်းစားမယ်။\n\n"
        cadence: line-by-line
      - {
          id: expect-adr1,
          type: expect.file,
          at: { afterAction: type-adr1b },
          path: docs/decisions.md,
          contains: "Consequences — လာမယူတဲ့ အော်ဒါ ရှိနိုင်တယ်။ တစ်မနက် 5 ခုထက် များရင် ပြန်စဉ်းစားမယ်။",
        }
      - {
          id: sel-adr1-con,
          type: editor.select,
          at: { mark: sel-adr1-con },
          target:
            { file: docs/decisions.md, text: "တစ်မနက် 5 ခုထက် များရင် ပြန်စဉ်းစားမယ်။", occurrence: 1 },
        }

  - id: adr-2
    narration: >
      [[mark:type-adr2]] ဒုတိယ ADR ကတော့ ခုနက ချိန်ခွင်ပေါ် တင်ခဲ့တဲ့ database ဆုံးဖြတ်ချက်ပါ။ ဒီတစ်ခါ
      တစ်ခုလုံးကို တစ်ခါတည်း ထည့်ပြီး ပြန်ကြည့်ပါမယ်။ [[mark:sel-adr2-ctx]] Context မှာ ကိုယ်တို့ ဆိုင်ရဲ့
      အခြေအနေကိုပဲ ရေးထားတာ သတိထား ကြည့်ပါ။ server ထိန်းပေးမယ့် လူ ရှိတဲ့ တခြား ဆိုင်တစ်ဆိုင်မှာဆိုရင် အဖြေ
      ပြောင်းနိုင်ပါတယ်။ ADR ဆိုတာ အမြဲ မှန်တဲ့ စည်းကမ်း မဟုတ်ဘဲ၊ အဲဒီ အခြေအနေအတွက် ရွေးချယ်မှု ဖြစ်ပါတယ်။
      [[mark:sel-adr2-con]] Consequences မှာတော့ service ကို မှီခိုရမယ် ဆိုတာကို ဝန်ခံထားပြီး၊ ထွက်ပေါက်ကိုပါ
      ကြိုစစ်ခိုင်းထားပါတယ်။ backup ယူလို့ ရလား၊ data ကို အပြင် ထုတ်ယူတဲ့ export လုပ်လို့ ရလား ဆိုတာပါ။ ဒါက
      ချိန်ခွင်ပေါ်က တတိယ အဆင့်ပါ။ တစ်နေ့ service ကို စိတ်မချရတော့လို့ ထွက်ချင်လာရင်၊ data ကို ယူသွားလို့ ရအောင်
      ဒီနေ့ကတည်းက ကြိုတွေးထားတာပါ။
    sources:
      - {
          title: "Michael Nygard: Documenting Architecture Decisions",
          url: "https://cognitect.com/blog/2011/11/15/documenting-architecture-decisions",
        }
      - {
          title: "AWS docs: What is Amazon RDS? (an example of a managed database service)",
          url: "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Welcome.html",
        }
    actions:
      - id: type-adr2
        type: editor.type
        at: { mark: type-adr2 }
        target: { file: docs/decisions.md, after: "ပြန်စဉ်းစားမယ်။\n\n", occurrence: 1 }
        text: "## ADR-002 · database ကို ကိုယ်တိုင် မ run ဘဲ managed service သုံးမယ် (2026-11-08)\nContext — ကိုယ်တစ်ယောက်တည်း၊ server ထိန်းဖို့ အချိန် မရှိဘူး။\nOptions — ကိုယ်ပိုင် server ပေါ်မှာ run မယ် / managed database service သုံးမယ်\nDecision — managed service ရဲ့ free tier ကို သုံးမယ်။\nConsequences — service ကို မှီခိုရမယ်။ backup နဲ့ export လုပ်လို့ရတာ စစ်ထားရမယ်။\n"
        cadence: block
      - {
          id: expect-adr2,
          type: expect.file,
          at: { afterAction: type-adr2 },
          path: docs/decisions.md,
          contains: "Decision — managed service ရဲ့ free tier ကို သုံးမယ်။",
        }
      - {
          id: sel-adr2-ctx,
          type: editor.select,
          at: { mark: sel-adr2-ctx },
          target:
            {
              file: docs/decisions.md,
              text: "Context — ကိုယ်တစ်ယောက်တည်း၊ server ထိန်းဖို့ အချိန် မရှိဘူး။",
              occurrence: 1,
            },
        }
      - {
          id: sel-adr2-con,
          type: editor.select,
          at: { mark: sel-adr2-con },
          target:
            { file: docs/decisions.md, text: "backup နဲ့ export လုပ်လို့ရတာ စစ်ထားရမယ်။", occurrence: 1 },
        }

  - id: who-reads
    narration: >
      [[mark:open-spec]] ဒီ ADR တွေကို ဘယ်သူတွေ ဖတ်မလဲ။ spec ဖိုင်ကို ပြန်ကြည့်ရအောင်။ [[mark:sel-dod]] definition
      of done က task တိုင်းမှာ decisions ဖိုင်ကိုပါ update လုပ်ခိုင်းထားပြီးသားပါ။ ငွေချေတာ ဒါမှမဟုတ် database နဲ့
      ဆိုင်တဲ့ task ကို agent ဆီ အပ်တဲ့အခါမှာလည်း decisions ဖိုင်ကို ဖတ်ခိုင်းပါ။ agent ထုတ်ပေးတဲ့ plan က
      ဆုံးဖြတ်ပြီးသား ကိစ္စနဲ့ မကိုက်ရင်လည်း၊ ADR ကို ပြပြီး ပြန်ပြင်ခိုင်းလို့ ရပါတယ်။ [[mark:people]]
      လူတွေအတွက်လည်း ဒီအတိုင်းပါပဲ။ အကြောင်းရင်း မရေးထားရင်၊ နောက်မှ ရောက်လာတဲ့ သူမှာ ဆုံးဖြတ်ချက်ကို အကြောင်းရင်း
      မသိဘဲ လက်ခံမလား၊ မသိဘဲ ပြောင်းပစ်မလား ဆိုတဲ့ နှစ်လမ်းပဲ ကျန်ပါတယ်။
    sources:
      - {
          title: "Michael Nygard: Documenting Architecture Decisions (newcomers either blindly accept or blindly change a decision)",
          url: "https://cognitect.com/blog/2011/11/15/documenting-architecture-decisions",
        }
      - {
          title: "The New SDLC (Burmese edition): The new SDLC (design and architecture)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - { id: open-spec, type: workspace.openFile, at: { mark: open-spec }, path: docs/spec.md }
      - {
          id: sel-dod,
          type: editor.select,
          at: { mark: sel-dod },
          target:
            {
              file: docs/spec.md,
              text: "- spec.md နဲ့ decisions.md ကို update လုပ်ပြီးပြီ။",
              occurrence: 1,
            },
        }

  - id: quiz
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ ခြောက်လ ကြာတဲ့အခါ customer တွေက online နဲ့ ဘာလို့ ငွေချေလို့ မရတာလဲ
      လို့ မေးလာကြလို့၊ ကောင်တာက လှလှ က ကိုယ့်ကို လာမေးတယ် ဆိုပါစို့။ အဖြေကို requirements ဖိုင်ရဲ့ Won't
      စာရင်းမှာ ရှာမလား၊ decisions ဖိုင်ရဲ့ ADR နံပါတ် တစ်မှာ ရှာမလား။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ADR နံပါတ် တစ်ပါ။ ဘာကြောင့်လဲဆိုတော့ Won't စာရင်းက ပထမ version မှာ မလုပ်ဘူး
      ဆိုတာကိုပဲ ပြောပြီး၊ ADR နံပါတ် တစ်ကတော့ ဘာကြောင့် မလုပ်လဲ ဆိုတာရော၊ ဘယ်အချိန် ပြန်စဉ်းစားမလဲ ဆိုတာရော
      ပြောလို့ပါ။ ဒါဆို လှလှ ကို အကြောင်းရင်း ပြောပြရုံ မကဘဲ၊ လာမယူတဲ့ အော်ဒါ အရေအတွက်ကို ကြည့်ပြီး
      ပြန်စဉ်းစားရမယ့် အချိန် ရောက်ပြီလား ဆိုတာပါ ဆုံးဖြတ်လို့ ရပါတယ်။
    sources:
      - {
          title: "Michael Nygard: Documenting Architecture Decisions",
          url: "https://cognitect.com/blog/2011/11/15/documenting-architecture-decisions",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [z-title, z-q1, z-q2, z-o1, z-o2],
          drawMs: 2200,
        }
      - {
          id: draw-quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [z-a, z-a1, z-a2],
          drawMs: 1600,
        }

  - id: recap
    chapter: ပြန်ချုပ်ရရင်
    narration: >
      [[mark:close-quiz]] ဒါဆို ပြန်ချုပ်ရရင်၊ app ရဲ့ အကြီးစား ဆုံးဖြတ်ချက်တွေက business ပေါ်မှာ မူတည်တဲ့ trade
      off တွေ ဖြစ်လို့ ကိုယ်တို့ ကိုယ်တိုင် ချိန်ဆ ဆုံးဖြတ်ရပါတယ်။ [[mark:sel-r-opt]] option တွေကို
      စာရင်းလုပ်ပြီး၊ တစ်ခုစီရဲ့ ကုန်ကျမှုကို ဒီနေ့ရော နောင်မှာပါ ကြည့်ပါ။ [[mark:sel-r-con]] ဘာဖြစ်ရင်
      ပြန်စဉ်းစားမလဲ ဆိုတာကိုလည်း ကြိုရေးထားပါ။ [[mark:sel-r-head]] ဆုံးဖြတ်ပြီးတာနဲ့ ADR ကို တိုတို ရေးပြီး
      နံပါတ်နဲ့ ရက်စွဲ တပ်ပါ။ ပြောင်းရင်လည်း မဖျက်ဘဲ ADR အသစ်နဲ့ အစားထိုးပါ။ နောက် lesson မှာတော့ ဒီလို
      ရွေးချယ်မှုတွေထဲမှာ ပိုရိုးရှင်းတဲ့ လမ်းက ဘာကြောင့် အများအားဖြင့် ပိုကောင်းလဲ ဆိုတာ လေ့လာသွားပါမယ်။
    sources:
