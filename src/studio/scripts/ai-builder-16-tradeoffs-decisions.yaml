# AI Builder, lesson 16: trade-offs and decision records (Burmese, docs kind).
#
# Start state (ws/): base-docs (package.json with a no-op dev script, notes.md, unused);
# docs/data.md complete as L15 leaves it (COURSE-KIT §4.9); docs/spec.md as L09 leaves it (§4.3 without
# AC-6); docs/decisions.md pinned with only its title line (§4.10: L16 creates it). Nothing runs.
#
# Typed into decisions.md (COURSE-KIT §4.10, ADR-001 and ADR-002 exactly; L17 appends ADR-003):
# ADR-001 in two line-by-line actions (heading + Context + Options; Decision + Consequences), then
# ADR-002 as one block walked through with selects. The final file equals §4.10's first block
# (tools/sim-docs.ts).
#
# Boards: (K) who decides a trade-off (orange: us and မြမြ, the business; violet: the agent builds the
# decided design) and three common kinds with the shop's question for each; (T) a balance scale for
# where the database lives: own server vs managed service, gains green and costs red on each side,
# costs today and later (orange), the question that would change our mind (orange) and the choice (green); (A) the ADR's four parts
# (blue) with what each answers, short/numbered/dated (orange), never deleted (green); (Z) the quiz.
#
# Build: bun ~/Documents/ai-builder-course-work/tools/build-lesson.ts template.yaml ws ai-builder-16-tradeoffs-decisions.yaml
