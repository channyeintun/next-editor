  - id: late
    chapter: တတ်နိုင်သမျှ နောက်ကျမှ round
    narration: >-
      [[mark:show-late]] တတိယ စည်းမျဉ်းက တတ်နိုင်သမျှ နည်းနည်းနဲ့ တတ်နိုင်သမျှ နောက်ကျမှ round လုပ်ဖို့ပါ။
      user တစ်ယောက်မှာ ယူရို တစ်ထောင် ရှိပြီး တစ်နှစ်ကို တစ် ရာခိုင်နှုန်း အတိုး ရတယ် ဆိုပါစို့။ တစ်ရက်စာ
      အတိုးက ဆင့် နှစ်ပြား ခွဲကျော်လောက်ပဲ ရှိပါတယ်။ [[mark:pt-daily]] နေ့တိုင်း round လုပ်ရင် ဆင့် သုံးပြား
      ဖြစ်သွားပြီး ရက် သုံးဆယ်မှာ ဆင့် ကိုးဆယ် ပေးမိပါတယ်။ [[mark:late-2]] full precision နဲ့ စုထားပြီး
      post လုပ်တဲ့ အချိန်မှာ တစ်ခါပဲ round လုပ်ရင်တော့ ဆင့် ရှစ်ဆယ့်နှစ်ပြား ရပါတယ်။ [[mark:pt-once]]
      ကွာတာက account တစ်ခုကို တစ်လ ဆင့် ရှစ်ပြားပါ။ account တစ်သန်းဆိုရင် တစ်လကို ယူရို ရှစ်သောင်း
      ဖြစ်ပါတယ်။ [[mark:late-3]] နေ့တိုင်း post လုပ်ရမယ် ဆိုရင်တော့ round လုပ်လို့ ကျန်တဲ့ residual ကို
      လွှင့်မပစ်ဘဲ နောက်နေ့ဆီ သယ်သွားပါ၊ residual ဆိုတာ round လုပ်တုန်း ချန်ခဲ့တဲ့ အပိုင်းလေးပါ။ ဒါဆို
      ရက် သုံးဆယ်ရဲ့ ပေါင်းလဒ်က ရှစ်ဆယ့်နှစ်ပြား ပြန်ဖြစ်ပါတယ်။ boundary လို့ ပြောတာက database ထဲ
      သိမ်းတဲ့ အချိန်၊ user ကို ပြတဲ့ အချိန်၊ ငွေ တကယ် ပေးတဲ့ အချိန်တွေပါ။
    sources:
