  - id: modes
    chapter: Rounding က business ဆုံးဖြတ်ချက်
    narration: >-
      [[mark:show-modes]] ဘာကြောင့်လဲ ဆိုတာ ကိန်းစဉ် ပေါ်မှာ ကြည့်ရအောင်။ [[mark:pt-ties]] tie လေးခုက
      ကိန်းပြည့် နှစ်ခုကြားရဲ့ အလယ်တည့်တည့်မှာ ရှိပါတယ်။ [[mark:modes-2]] half-up မှာ မြှားတိုင်း
      ညာဘက်ကို သွားပါတယ်။ တစ်ခါချင်းမှာ သေးပေမဲ့ ဘက်တစ်ဘက်တည်းကို အမြဲ ကွာနေတော့ ပေါင်းလဒ်မှာ bias
      ဖြစ်လာပါတယ်၊ bias ဆိုတာ တစ်ဘက်တည်းကို စောင်းပြီး စုလာတဲ့ အမှားပါ။ [[mark:modes-3]] half-even
      မှာတော့ တစ်ဝက်က ဘယ်ဘက်၊ တစ်ဝက်က ညာဘက် သွားလို့ အမှားတွေ အချင်းချင်း ကြေသွားပါတယ်။ ဒါပေမဲ့ ဒါက
      tie အများကြီးမှာ ပျမ်းမျှ မှန်တာပါ၊ payment တစ်ခုတည်းအတွက်တော့ ဘယ် mode မဆို ဆင့် တစ်ပြား
      ကွာနိုင်ပါတယ်။ [[mark:pt-even]] ဒါကြောင့် mode ရွေးတာက business ဆုံးဖြတ်ချက်ပါ။ statistical bias
      ကို ဂရုစိုက်ရင် half-even ကို ရွေးပါတယ်။ မရှိတဲ့ ငွေကို သုံးမိမှာ စိုးရတဲ့ နေရာ၊ ဥပမာ user
      ထုတ်ယူလို့ ရတဲ့ ပမာဏမှာဆိုရင် conservative ဖြစ်အောင် round down လုပ်ပါတယ်။ ကျန်တဲ့ အပိုင်းလေးကို ဘယ်သူ
      ရမလဲ ဆိုတာ legal နဲ့ tax အကျိုးဆက် ရှိနိုင်လို့ engineer တစ်ယောက်တည်း ဆုံးဖြတ်ရမယ့် ကိစ္စ
      မဟုတ်ပါဘူး။ [[mark:modes-4]] နောက်ထပ် ထောင်ချောက် တစ်ခုက language တွေရဲ့ default ပါ။ Go ရဲ့
      standard round function က tie ကို သုညနဲ့ ဝေးတဲ့ဘက် ပို့ပါတယ်။ [[mark:pt-py]] Python ရဲ့ round နဲ့
      .NET ရဲ့ Math Round ကတော့ default အနေနဲ့ စုံကိန်းဘက် ပို့ပါတယ်။ [[mark:pt-java]] Java မှာ half
      even mode ကို ကိုယ်တိုင် ထည့်ပေးမှ ရပါတယ်။ ဆိုလိုတာက language မတူတဲ့ service နှစ်ခုက ပမာဏ
      တစ်ခုတည်းကို ဆင့် တစ်ပြား ကွာအောင် round လုပ်နိုင်ပြီး၊ reconciliation မှာ မကိုက်တော့ပါဘူး။
