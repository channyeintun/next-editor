  - id: case
    chapter: Vancouver index ရဲ့ သင်ခန်းစာ
    narration: >-
      [[mark:show-case]] ဒီ စည်းမျဉ်းကို မလိုက်ရင် ဘာဖြစ်လဲ ဆိုတာ တကယ် ဖြစ်ခဲ့ဖူးပါတယ်။ ၁၉၈၂ ခုနှစ်
      ဇန်နဝါရီမှာ Vancouver Stock Exchange က index အသစ် တစ်ခုကို တစ်ထောင်ကနေ စခဲ့ပါတယ်။
      [[mark:pt-rule]] trade တစ်ခု ပြီးတိုင်း index ကို ပြန်တွက်ပြီး၊ အဲဒါ တစ်ရက်ကို သုံးထောင်ခါလောက်
      ရှိပါတယ်။ အကြိမ်တိုင်း ရလဒ်ကို ဒသမ သုံးနေရာမှာ round မလုပ်ဘဲ ဖြတ်ချခဲ့ပါတယ်၊ truncate
      လုပ်တာပါ။ [[mark:case-2]] ၁၉၈၃ နိုဝင်ဘာ နှောင်းပိုင်းမှာ index က ငါးရာ နှစ်ဆယ့်လေး လောက်ပဲ
      ကျန်ပါတော့တယ်။ [[mark:case-3]] အဲဒီ လကုန်ပိုင်း ပိတ်ရက်မှာ မှန်မှန်ကန်ကန် ပြန်တွက်လိုက်တော့
      တစ်ထောင့် ကိုးဆယ့်ရှစ် ကျော် ဖြစ်ပါတယ်။ ဆိုလိုတာက index ရဲ့ တန်ဖိုး တစ်ဝက်လောက်က ဖြတ်ချမှု
      သေးသေးလေးတွေ စုပြီး ပျောက်သွားခဲ့တာပါ။ ဒါက binary float bug မဟုတ်ဘဲ decimal truncation bug
      ပါ။ [[mark:pt-lesson]] update တိုင်း ဘက်တစ်ဘက်တည်းကို ဖြတ်တော့ bias က နေ့တိုင်း
      စုလာတာပါ၊ balance ကို update တိုင်း တစ်ဘက်တည်းကို round လုပ်တဲ့ ငွေ system မှာလည်း ဒီလိုပဲ စုလာနိုင်ပါတယ်။
    sources:
