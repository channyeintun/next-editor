build:
  voiceProfile:
    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 9505

runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "round down: 3333 + 3333 + 3333 = 9999\nround up:   3334 + 3334 + 3334 = 10002\n"
      run-2:
        status: success
        exitCode: 0
        output: "round down: 3333 + 3333 + 3333 = 9999\nround up:   3334 + 3334 + 3334 = 10002\nallocate:   3334 + 3333 + 3333 = 10000\n"
      run-3:
        status: success
        exitCode: 0
        output: "round down: 3333 + 3333 + 3333 = 9999\nround up:   3334 + 3334 + 3334 = 10002\nallocate:   3334 + 3333 + 3333 = 10000\nhalf-up:    1 + 2 + 3 + 4 = 10\nhalf-even:  0 + 2 + 2 + 4 = 8\n"

scenes:
  - id: hook
    chapter: သုံးပုံခွဲရင် cent ဘယ်ရောက်လဲ
    narration: >-
      ငွေကို အပိုင်းတွေ ခွဲတာ၊ currency တစ်ခုကနေ တစ်ခု ပြောင်းတာ၊ fee ယူတာ၊ အတိုး တွက်တာ၊ precision
      မတူတဲ့ system တစ်ခုဆီ ပို့တာ၊ ဒါတွေ အားလုံးမှာ အသေးဆုံး unit ထက် သေးတဲ့ အပိုင်းလေး ကျန်လာပြီး
      round လုပ်ရပါတယ်။ rounding ကို ရှောင်လို့ မရပါဘူး၊ ဆုံးဖြတ်ရမှာက ဘယ်နေရာမှာ ဘယ်လို
      လုပ်မလဲ ဆိုတာပါ။ [[mark:sel-amount]] ဒီ program က ယူရို တစ်ရာကို ဆင့်နဲ့
      ရေတွက်တဲ့ ကိန်းပြည့်အဖြစ် ထားပါတယ်။ [[mark:sel-split]] ပထမ line က ကိန်းပြည့်နဲ့ သုံးပုံ စားပြီး
      အကြွင်းကို လွှင့်ပစ်ပါတယ်၊ ဆိုလိုတာက round down ပါ။ ဒုတိယ line က အပေါ်ကို round up လုပ်ပါတယ်။
      နှစ်မျိုးလုံးမှာ အပိုင်း သုံးခုကို ပြန်ပေါင်းပြီး ပြပါမယ်။ [[mark:run-1]] run လိုက်ရအောင်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Rounding strategies (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#rounding-strategies",
        }
      - {
          title: "The Go Programming Language Specification — Arithmetic operators (integer division)",
          url: "https://go.dev/ref/spec#Arithmetic_operators",
        }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }
      - id: sel-amount
        type: editor.select
        at: { mark: sel-amount }
        target: { file: main.go, text: "amount := int64(10000)", occurrence: 1 }
      - id: sel-split
        type: editor.select
        at: { mark: sel-split }
        target:
          {
            file: main.go,
            text: "down := amount / 3     // integer division drops the remainder\n\tup := (amount + 2) / 3",
