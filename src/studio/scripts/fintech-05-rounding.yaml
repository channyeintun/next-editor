  - id: allocate
    chapter: Allocate၊ ကျန်တဲ့ cent ကို တမင် ပေး
    narration: >-
      [[mark:close-split]] allocate ကို code နဲ့ ရေးကြည့်ရအောင်။ [[mark:type-alloc]] အပိုင်းတိုင်းကို
      ကိန်းပြည့် စားလဒ်နဲ့ စပြီး၊ အကြွင်း ရှိသလောက် ရှေ့ဆုံးက အပိုင်းတွေကို unit တစ်ခုစီ ထပ်ပေးပါတယ်။
      ဒါကြောင့် အပိုင်းတွေ အများဆုံး unit တစ်ခုပဲ ကွာပြီး ပေါင်းလဒ်က မူရင်းနဲ့ အမြဲ ညီပါတယ်။ [[mark:type-call]] ယူရို တစ်ရာကို ဒီ function နဲ့ သုံးပုံ ခွဲပြီး ပြပါမယ်။
      ပထမ အပိုင်းက ဆင့် တစ်ပြား ပိုရပြီး ကျန်တဲ့ နှစ်ခုက အတူတူ ဖြစ်ရပါမယ်။ [[mark:run-2]] run
      လိုက်ရအောင်။ [[mark:pt-alloc]] ပေါင်းလဒ်က ဆင့် တစ်သောင်း အတိအကျ ပြန်ဖြစ်ပါပြီ။
      [[mark:alloc-who]] ဒီမှာ တကယ် ဆုံးဖြတ်ရတာက ပိုတဲ့ ဆင့်ကို ဘယ်အပိုင်း ရမလဲ ဆိုတာပါ။ ဒီ code မှာ
      ရှေ့ဆုံးက အပိုင်း ရပါတယ်။ အရေးကြီးတာက rule က deterministic ဖြစ်ဖို့ပါ၊ ဆိုလိုတာက input
      တူရင် ဘယ်နှခါ run run ရလဒ် တူရပါမယ်။ retry လုပ်တိုင်း ပိုတဲ့ ဆင့် နေရာ ပြောင်းနေရင် နောက်မှ
      reconcile လုပ်လို့ မရတော့ပါဘူး။ [[mark:dock-2]] အချိုး မညီတဲ့ ခွဲဝေမှု၊ ဥပမာ fee ကို ရာခိုင်နှုန်း ခုနစ်ဆယ်နဲ့
      သုံးဆယ် ခွဲတာမျိုးမှာတော့ ဖြတ်ချလိုက်တဲ့ အပိုင်း အကြီးဆုံး အပိုင်းကို ပိုတဲ့ ဆင့် အရင် ပေးတဲ့ နည်းကို သုံးနိုင်ပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Rounding strategies (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#rounding-strategies",
        }
    actions:
      - { id: close-split, type: slide.close, at: { mark: close-split } }
      - id: type-alloc
        type: editor.type
        at: { mark: type-alloc }
        target:
          { file: main.go, after: "\tshow(\"round up\", []int64{up, up, up})\n}\n", occurrence: 1 }
        text: "\n// allocate splits amount into n parts that add up to exactly amount.\nfunc allocate(amount, n int64) []int64 {\n\tparts := make([]int64, n)\n\tfor i := range parts {\n\t\tparts[i] = amount / n\n\t\tif int64(i) < amount%n {\n\t\t\tparts[i]++\n\t\t}\n\t}\n\treturn parts\n}\n"
        cadence: line-by-line
      - id: type-call
        type: editor.type
        at: { mark: type-call }
        target:
          { file: main.go, after: "\tshow(\"round up\", []int64{up, up, up})\n", occurrence: 1 }
        text: "\n\tshow(\"allocate\", allocate(amount, 3))\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "3334 + 3333 + 3333 = 10000",
          timeoutMs: 8000,
        }
      - id: pt-alloc
        type: console.point
        at: { mark: pt-alloc }
        target: { text: "allocate:", occurrence: 1 }
      - { id: dock-2, type: runtime.collapseDock, at: { mark: dock-2 } }

  - id: modes-code
    chapter: Half-up နဲ့ half-even
    narration: >-
      [[mark:sel-up]] file ရဲ့ အောက်ပိုင်းမှာ rounding mode နှစ်မျိုး ရှိပါတယ်။ ပထမ တစ်ခုက half-up
      ပါ။ ကိန်းပြည့် နှစ်ခုရဲ့ အလယ်တည့်တည့်မှာ ရှိတဲ့ တန်ဖိုးကို tie လို့ ခေါ်ပြီး၊ half-up က tie ကို
      အပေါ်ကို အမြဲ ယူပါတယ်။ [[mark:sel-even]] ဒုတိယက half-even ပါ။ tie ကို အနီးဆုံး စုံကိန်းဆီ
      ပို့ပြီး၊ banker's rounding လို့လည်း ခေါ်ပါတယ်။ [[mark:type-ties]] သုည ဒသမ ငါး၊ တစ် ဒသမ
      ငါး၊ နှစ် ဒသမ ငါး၊ သုံး ဒသမ ငါး ဆိုတဲ့ tie လေးခုကို ဆယ်ပုံတစ်ပုံ unit နဲ့ ကိန်းပြည့်အဖြစ် ထားပြီး
      mode နှစ်မျိုးနဲ့ round လုပ်ပြီး ပေါင်းပါမယ်။ မူရင်း ပေါင်းလဒ်က ရှစ် အတိအကျပါ။ run မလုပ်ခင် ဘယ်
      mode က ရှစ်ကို ရမလဲ ခန့်မှန်းကြည့်ပါ။ [[mark:run-3]] run လိုက်ရအောင်။ [[mark:pt-halfup]]
      half-up က ဆယ် ရပါတယ်၊ tie တိုင်း အပေါ်ကို သွားလို့ နှစ် ပိုနေပါတယ်။ [[mark:pt-halfeven]]
      half-even ကတော့ ရှစ် အတိအကျ ရပါတယ်။ [[mark:dock-3]] ဂဏန်း တစ်လုံးချင်းမှာ mode နှစ်ခုလုံး
      သုည ဒသမ ငါးပဲ ကွာတာပါ။ ကွာခြားချက်က ပေါင်းလဒ်မှာမှ ပေါ်လာတာပါ။
    sources:
