  - id: split
    chapter: Rounding က ပေါင်းလဒ်ကို ဖျက်တယ်
    narration: >-
      [[mark:show-split]] ဒသမနဲ့ ကြည့်ရင် ပိုရှင်းပါတယ်။ ယူရို တစ်ရာကို သုံးနဲ့ စားရင် သုံးဆယ့်သုံး
      ဒသမ သုံးသုံး ပြီးတော့လည်း သုံးတွေ အဆုံးမရှိ ဆက်သွားပါတယ်။ [[mark:pt-down-row]] အောက်ကို
      ဖြတ်လိုက်ရင် ဆင့် တစ်ပြား ပျောက်ပါတယ်။ ဒါက No lost data ကို ချိုးဖောက်တာပါ၊ ဆိုလိုတာက ငွေနဲ့
      ပတ်သက်ပြီး ဖြစ်ခဲ့သမျှ မပျောက်ရဘူး ဆိုတဲ့ မူပါ။ [[mark:split-2]] အပေါ်ကို ယူလိုက်ရင် ဆင့်
      နှစ်ပြား ပေါ်လာပါတယ်။ ဒါက No invented data ကို ချိုးဖောက်တာပါ၊ ငွေကို မရှိဘဲ မဖန်တီးရဘူး
      ဆိုတဲ့ မူပါ။ [[mark:split-3]] ဖြေရှင်းနည်းက အကြွင်းကို တမင် ခွဲပေးတာပါ။ allocate ဆိုတာ ပမာဏ
      တစ်ခုကို အပိုင်းတွေ ခွဲတဲ့အခါ ကျန်တဲ့ unit တွေကို တစ်ခုချင်း ဝေပေးပြီး၊ အပိုင်းတွေ ပေါင်းလဒ်ကို
      မူရင်းနဲ့ အမြဲ ညီအောင် လုပ်တာပါ။ [[mark:pt-fix]] နောက်တစ်နည်းက အပိုင်းတွေကို အညီ ထားပြီး
      ကျန်တဲ့ ဆင့်ကို rounding account လို့ ခေါ်တဲ့ သီးသန့် account ထဲ မှတ်ထားတာပါ။ ဘယ်နည်းပဲ
      သုံးသုံး ဆင့်တိုင်း ဘယ်ကို ရောက်သွားလဲ ဆိုတာ မှတ်တမ်း ရှိနေရပါမယ်။
    sources:
