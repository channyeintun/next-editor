  - id: try-it
    chapter: ကိုယ်တိုင် စမ်းကြည့်ပါ
    narration: >-
      [[mark:close-iv]] ကိုယ်တိုင် စမ်းကြည့်ဖို့ တစ်ခု ရှိပါတယ်။ [[mark:sel-try]] ဒီ line မှာ သုံးကို
      ခုနစ်လို့ ပြောင်းပြီး run ကြည့်ပါ။ ယူရို တစ်ရာကို ခုနစ်ပုံ ခွဲရင် ဆင့် လေးပြား ကျန်လို့ ရှေ့က
      အပိုင်း လေးခုက တစ်ထောင့်လေးရာ နှစ်ဆယ့်ကိုး စီ၊ နောက်က သုံးခုက တစ်ထောင့်လေးရာ နှစ်ဆယ့်ရှစ် စီ
      ရပြီး၊ ပေါင်းလဒ်က တစ်သောင်း အတိအကျ ဖြစ်နေပါလိမ့်မယ်။ [[mark:recap]] ပြန်ချုပ်ရရင်၊ rounding ကို
      ရှောင်လို့ မရပေမဲ့ ဘယ်နေရာမှာ၊ ဘယ် mode နဲ့၊ ကျန်တဲ့ ဆင့်ကို ဘယ်သူ ရမလဲ ဆိုတာကို တမင်
      ဆုံးဖြတ်ပြီး code ထဲမှာ ရေးထားရပါတယ်။ နောက် lesson မှာတော့ ကိန်းပြည့် တစ်ခုတည်းက ငွေ မဟုတ်ဘူး
      ဆိုတာ ကြည့်ပါမယ်။ ဒေါ်လာနဲ့ ယန်းကို ပေါင်းမိတာကို type က ဘယ်လို တားမလဲ ဆိုတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Rounding strategies (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#rounding-strategies",
        }
