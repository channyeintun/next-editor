# Fintech Engineering, lesson 05: rounding is a business decision (Burmese).
#
# Source: Fintech Engineering Handbook, "Rounding strategies" (CC BY 4.0, Voytek Pitula).
# Start state: main.go splits 100.00 EUR (10000 cents) three ways with integer division and with
# ceiling division and prints each split with its sum; the rounding helpers are pinned below main.
# Edits, all insert-only:
#   1. allocate(): the remainder handed out one cent at a time   (typed after main)
#   2. a call that prints allocate(amount, 3)                     -> run-2 prints ... = 10000
#   3. four ties (0.5 1.5 2.5 3.5 in tenths) under two modes     -> run-3 prints 10 vs 8
# Figures: split (the lost and the invented cent), modes (where ties go), late (round once, at the
# boundary), case (the Vancouver index), iv (the interview answer).
# Built by ~/Documents/fintech-course-work/tools/build-lesson.ts; fixtures by sim-go.ts --write.
schemaVersion: 1

lesson:
  slug: fintech-05-rounding
  title: "Fintech Engineering 05: Rounding က business ဆုံးဖြတ်ချက်"
  locale: my-MM
  workspace:
    lessonType: go
    name: Fintech Engineering
    entryFilePath: main.go
    # One file: an open explorer would be a list of one beside the code.
    sidebarStartsCollapsed: true
    files:
      main.go: |
        package main

        import (
        	"fmt"
        	"strings"
        )

        func main() {
        	amount := int64(10000) // 100.00 EUR, counted in cents

        	down := amount / 3     // integer division drops the remainder
        	up := (amount + 2) / 3 // ceiling division
        	show("round down", []int64{down, down, down})
        	show("round up", []int64{up, up, up})
        }

        // roundHalfUp rounds tenths to a whole number; a tie (x.5) always goes up.
        func roundHalfUp(tenths int64) int64 {
        	return (tenths + 5) / 10
        }

        // roundHalfEven rounds tenths to a whole number; a tie goes to the even neighbour.
        func roundHalfEven(tenths int64) int64 {
        	q, r := tenths/10, tenths%10
        	if r > 5 || (r == 5 && q%2 == 1) {
        		q++
        	}
        	return q
        }

        // roundAll applies one rounding mode to every value.
        func roundAll(values []int64, round func(int64) int64) []int64 {
        	out := make([]int64, len(values))
        	for i, v := range values {
        		out[i] = round(v)
        	}
        	return out
        }

        // show prints the parts and what they add up to: "allocate: 3334 + 3333 + 3333 = 10000".
        func show(label string, parts []int64) {
        	var total int64
        	terms := make([]string, len(parts))
        	for i, p := range parts {
        		total += p
        		terms[i] = fmt.Sprint(p)
        	}
        	fmt.Printf("%-11s %s = %d\n", label+":", strings.Join(terms, " + "), total)
        }
