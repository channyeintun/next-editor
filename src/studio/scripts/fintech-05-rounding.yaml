  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] Fintech interview တွေမှာ ဒေါ်လာ တစ်ရာကို သုံးယောက် အညီအမျှ ခွဲပေးပါ ဆိုတဲ့
      မေးခွန်းကို မေးလေ့ရှိပါတယ်။ သုံးဆယ့်သုံး ဒသမ သုံးသုံး လို့ ဖြေရင် ဆင့် တစ်ပြား ပျောက်သွားပါပြီ။
      [[mark:iv-a]] ပထမ၊ minor unit ကိန်းပြည့်နဲ့ တွက်ပြီး စားလဒ်နဲ့ အကြွင်းကို ခွဲထုတ်ပါ။ ဆင့် တစ်သောင်းကို
      သုံးနဲ့ စားရင် တစ် ကျန်ပါတယ်။ [[mark:iv-b]] ဒုတိယ၊ ကျန်တဲ့
      ဆင့်ကို deterministic rule တစ်ခုနဲ့ ပေးပါ၊ ဒါမှမဟုတ် rounding account ထဲ မှတ်ပါ။ [[mark:iv-c]] တတိယ၊ ဘယ်သူက ပိုတဲ့ ဆင့်ကို
      ရမလဲ၊ ဘယ် mode သုံးမလဲ ဆိုတာ business ဆုံးဖြတ်ချက် ဖြစ်ပြီး legal နဲ့ tax အကျိုးဆက် ရှိနိုင်တယ်
      ဆိုတာ ထည့်ပြောပါ။ [[mark:iv-d]] ပြီးရင် ကိုယ် ဘာလုပ်မလဲ ဆိုတာ ဆက်ပြောပါ။ allocate function
      တစ်ခု ရေးပြီး၊ n တိုင်းအတွက် အပိုင်းတွေ ပေါင်းလဒ်က မူရင်းနဲ့ ညီရမယ် ဆိုတဲ့ test ထည့်မယ်၊ round
      ကိုလည်း boundary မှာ တစ်ခါပဲ လုပ်မယ် ဆိုတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Rounding strategies (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#rounding-strategies",
        }
    actions:
