          target: { assetId: f-2q },
        }

  - id: table
    chapter: Billing ရဲ့ လမ်းညွှန်
    narration: >
      [[mark:d-open]] ဒါဆို Network Tools အတွက် လမ်းညွှန်ကို Billing ရဲ့ လိုအပ်ချက် ခြောက်ခုနဲ့ ရေးကြည့်ရအောင်။ ပထမ
      သုံးခုကို ရေးထားပြီးပါပြီ။
      [[mark:sel-row1]] test command က session တိုင်း သိရမှာမို့ CLAUDE.md ထဲမှာ ရှိပါတယ်။ outage notice အဆင့်တွေက notice
      ရေးတဲ့အခါမှ လိုလို့ skill ပါ။ test suite အပြည့်ကတော့ output ထောင်ချီ ထွက်လို့ subagent ကို လွှဲပါတယ်။
      [[mark:type-hook]] စတုတ္ထ လိုအပ်ချက်က database migration file တွေကို ဘယ်တော့မှ မပြင်ရဘူး ဆိုတာပါ။ platform team ပဲ
      ပြင်ခွင့်ရှိတာမို့ ခြွင်းချက် မရှိပါဘူး။ ဒါကြောင့် tool မသုံးခင် run တဲ့ hook နဲ့ ပိတ်ပါတယ်။
      [[mark:type-mcp]] ပဉ္စမ လိုအပ်ချက်က Ticket system နဲ့ NMS ကို ဖတ်တာပါ။ အပြင် system နဲ့ ချိတ်တာမို့ MCP server ပါ။
      Billing မှာ ticket MCP server ရှိပြီးသားပါ။
      [[mark:type-pair]] ဆဋ္ဌမ လိုအပ်ချက်က အဲဒီ tool တွေကို ဘယ်လို သုံးရမလဲ ဆိုတာပါ။ ဥပမာ outage ကို ဘယ် field က ပြလဲ၊
      ticket တွေကို ဘယ်လို ရှာရမလဲ ဆိုတာမျိုးပါ။ ဒါက MCP tool ကို သုံးတဲ့ skill ပါ။ ချိတ်တာက server ရဲ့ အလုပ်၊ သုံးပုံကတော့
      skill ရဲ့ အလုပ်ပါ။
      ဒီ ခြောက်ခုမြောက် အတန်းက မေးခွန်း ငါးခုထဲက နှစ်ခုကို ဟုတ်တယ်လို့ ဖြေတဲ့ လိုအပ်ချက်မို့ feature နှစ်ခုကို တွဲထားတာပါ။
      [[mark:sel-hook]] ဒီ ဇယားထဲမှာ တန်ဖိုးအရှိဆုံး ကော်လံက ဘာကြောင့် ဆိုတဲ့ ကော်လံပါ။ feature နာမည်ကို မှတ်တာထက်၊ မေးခွန်း
      ငါးခုထဲက ဘယ်ဟာကို ဖြေပြီး ရွေးလဲ ဆိုတာ ရေးထားမှ Network Tools က လိုအပ်ချက် အသစ်တွေကို ကိုယ်တိုင် ခွဲနိုင်မှာပါ။
    sources:
      - {
          title: "Claude Code Docs: Extend Claude Code (features overview)",
          url: "https://code.claude.com/docs/en/features-overview",
        }
      - {
          title: "Claude Code Docs: Hooks guide",
          url: "https://code.claude.com/docs/en/hooks-guide",
        }
    actions:
      - {
          id: close-five,
          type: whiteboard.apply,
          at: { mark: d-open, offsetMs: -900 },
          open: false,
        }
      - {
          id: open-doc,
          type: workspace.openFile,
          at: { afterAction: close-five },
          path: notebook/44-which-feature.md,
        }
      - id: sel-row1
        type: editor.select
        at: { mark: sel-row1 }
        target:
          file: notebook/44-which-feature.md
          text: "| test နဲ့ lint command | CLAUDE.md | session တိုင်း သိထားရမယ် |"
      - id: type-hook
        type: editor.type
        at: { mark: type-hook }
        cadence: line-by-line
        target: { file: notebook/44-which-feature.md, after: "report တစ်ခုပဲ ပြန်လို |\n" }
        text: "| migration file တွေကို မပြင်ရ | hook (PreToolUse) | ခြွင်းချက်မရှိ အမြဲ ပိတ်ရမယ် |\n"
      - id: type-mcp
        type: editor.type
        at: { mark: type-mcp }
        cadence: line-by-line
        target: { file: notebook/44-which-feature.md, after: "ခြွင်းချက်မရှိ အမြဲ ပိတ်ရမယ် |\n" }
        text: "| Ticket system နဲ့ NMS ကို ဖတ် | MCP server | အပြင် system နဲ့ ချိတ်တာ |\n"
      - id: type-pair
        type: editor.type
        at: { mark: type-pair }
        cadence: line-by-line
        target: { file: notebook/44-which-feature.md, after: "အပြင် system နဲ့ ချိတ်တာ |\n" }
        text: "| ticket ရှာပုံ၊ outage ဖတ်ပုံ | skill + MCP tool | tool ကို ဘယ်လို သုံးရမလဲ သင်ပေး |\n"
      - id: expect-hook
        type: expect.file
        at: { afterAction: type-pair }
        path: notebook/44-which-feature.md
        contains: "| migration file တွေကို မပြင်ရ | hook (PreToolUse) | ခြွင်းချက်မရှိ အမြဲ ပိတ်ရမယ် |\n"
      - id: sel-hook
        type: editor.select
        at: { mark: sel-hook }
        target:
          file: notebook/44-which-feature.md
          text: "ဘာကြောင့်"

  - id: commands
    chapter: Command အဟောင်းတွေ
    narration: >
      [[mark:type-cmd]] လမ်းညွှန်ရဲ့ အောက်ဆုံးမှာ ပြောင်းလဲမှု တစ်ခုကို မှတ်ထားပါမယ်။ အရင်က custom command ဆိုတာ သီးခြား
      feature တစ်ခု ဖြစ်ခဲ့ပါတယ်။ အခုတော့ custom command တွေကို skill ထဲ ပေါင်းလိုက်ပါပြီ။ commands folder ထဲက file
      တစ်ခုနဲ့ skills folder ထဲက နာမည်တူ skill တစ်ခုက command တစ်ခုတည်းကို ဖန်တီးပြီး၊ နှစ်ခုလုံး ရှိရင် skill က
      ဦးစားပေး ရပါတယ်။
      [[mark:sel-cmd]] command file အဟောင်းတွေက ဆက်အလုပ်လုပ်ပါသေးတယ်။ ဒါပေမဲ့ အခုဆိုရင် Claude က အဲဒီ command တွေကို
      ကိုယ်တိုင်လည်း ခေါ်နိုင်ပါတယ်။ disable model invocation ကို true မထားရင်ပါ။
      [[mark:sel-dmi]] docs ကလည်း deploy command ကို ဥပမာ ပေးထားပါတယ်။
      deploy လုပ်မလား ဆိုတာ လူက ဆုံးဖြတ်ရမယ့် ကိစ္စမို့၊ code အဆင်သင့် ဖြစ်ပုံရတိုင်း Claude က စခေါ်လို့ မဖြစ်ပါဘူး။ ဒါကြောင့် လူကပဲ ခေါ်ရမယ့် command
      အဟောင်း ရှိရင် အဲဒီ setting ကို ထည့်ပြီး၊ အသစ်ရေးမယ့်ဟာတွေကိုတော့ skill folder နဲ့ ရေးဖို့ မှတ်ထားပါတယ်။
    sources:
      - {
          title: "Claude Code Docs: Extend Claude with skills (custom commands merged into skills)",
          url: "https://code.claude.com/docs/en/skills",
        }
    actions:
      - id: type-cmd
        type: editor.type
        at: { mark: type-cmd }
        cadence: line-by-line
        target: { file: notebook/44-which-feature.md, after: "tool ကို ဘယ်လို သုံးရမလဲ သင်ပေး |\n" }
        text: "\n## Command အဟောင်း\n- `.claude/commands/` file တွေ ဆက်အလုပ်လုပ်တယ်။ Claude ကလည်း ခေါ်နိုင်ပြီ\n- လူကပဲ ခေါ်ရမယ့်ဟာမှာ `disable-model-invocation: true`။ အသစ်ကို skill နဲ့ ရေး\n"
      - id: sel-cmd
        type: editor.select
        at: { mark: sel-cmd }
        target:
          file: notebook/44-which-feature.md
          text: "- `.claude/commands/` file တွေ ဆက်အလုပ်လုပ်တယ်။ Claude ကလည်း ခေါ်နိုင်ပြီ"
      - id: sel-dmi
        type: editor.select
        at: { mark: sel-dmi }
        target:
          file: notebook/44-which-feature.md
          text: "`disable-model-invocation: true`"

