  - id: together
    chapter: တွဲသုံးတဲ့ feature များ
    narration: >
      ဒီ မေးခွန်း ငါးခုက တစ်ခုကို ရွေးရင် ကျန်တာ မသုံးရဘူး ဆိုတာ မဟုတ်ပါဘူး။ feature တွေက အတူ
      အလုပ်လုပ်ပါတယ်။
      [[mark:t-mcp]] ပထမ တွဲပုံက skill နဲ့ MCP server ပါ။ MCP server က Claude ကို system နဲ့ ချိတ်ပေးပြီး၊ skill က အဲဒီ
      tool တွေကို ဘယ်လို ကောင်းကောင်း သုံးရမလဲ သင်ပေးပါတယ်။ docs ကလည်း ဒီ နှစ်ခုက သဘာဝကျကျ တွဲသုံးလို့ရတယ်လို့
      ပြောပါတယ်။
      [[mark:t-sub]] ဒုတိယ တွဲပုံက skill နဲ့ subagent ပါ။ subagent file ရဲ့ skills field မှာ skill နာမည်တွေ ရေးထားရင်၊ subagent
      စတာနဲ့ အဲဒီ skill တွေရဲ့ စာကိုယ် အပြည့်ကို ကြိုထည့်ပေးပါတယ်။ အဲဒီ field မပါလည်း subagent က လိုရင် skill တွေကို ကိုယ်တိုင် ရှာပြီး
      ခေါ်သုံးနိုင်ပါတယ်။ ပြောင်းပြန်အနေနဲ့ ပြီးခဲ့တဲ့ lesson က context fork
      option ကို သုံးရင် skill တစ်ခုကို subagent ထဲမှာ run နိုင်ပါတယ်။
      [[mark:t-back]] ဒါပေမဲ့ hook ကိုတော့ ဘယ် feature နဲ့မှ အစားထိုးလို့ မရပါဘူး။ အမြဲ ဖြစ်ရမယ့် အရာအတွက် hook ပဲ
      Claude ရဲ့ ဆုံးဖြတ်ချက်အပေါ် မမူတည်လို့ပါ။
    sources:
      - {
          title: "Claude Code Docs: Extend Claude Code (MCP vs skill)",
          url: "https://code.claude.com/docs/en/features-overview",
        }
      - {
          title: "Claude Code Docs: Subagents (preload skills)",
          url: "https://code.claude.com/docs/en/sub-agents",
        }
    actions:
      - {
          id: draw-t-mcp,
          type: whiteboard.apply,
          at: { mark: t-mcp },
          upsertIds: [f-pair-mcp],
          drawMs: 900,
