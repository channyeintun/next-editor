build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 9344

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: need
    chapter: နည်း ငါးမျိုး၊ ကျပန်း သုံးနေတာ
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ report migration skill ကို SKILL.md၊ reference file နဲ့ script ဆိုပြီး ခွဲဖွဲ့စည်းကာ၊ လိုတာလောက်ပဲ
      context ထဲ ဝင်အောင် လုပ်ခဲ့ပါတယ်။
      [[mark:sel-teams]] အခု Billing မှာ Claude Code ကို ပြင်ဆင်တဲ့ နည်း ငါးမျိုး ရှိနေပါပြီ။ CLAUDE.md၊ skill၊ subagent၊
      hook နဲ့ MCP server ပါ။ Network Tools team ကလည်း Billing ရဲ့ setup ကို plugin နဲ့ ယူသုံးနေပါပြီ။
      [[mark:story]] ပြဿနာက လိုအပ်ချက် အသစ် တစ်ခု ပေါ်တိုင်း ဘယ်နည်းကို သုံးမလဲ ဆိုတာ လူတိုင်း မတူတာပါ။ တစ်ယောက်က
      လုပ်ငန်းစဉ် ရှည်ရှည်ကို CLAUDE.md ထဲ ထည့်လို့ session တိုင်း token ကုန်နေတယ်။ နောက်တစ်ယောက်က အမြဲ ဖြစ်ရမယ့်
      စည်းကမ်းကို skill ထဲ ရေးထားပြီး၊ Claude က တစ်ခါတလေ လိုက်မလုပ်တာကို ကြုံရတယ်။
      [[mark:story-2]] ဒါကြောင့် Network Tools ရဲ့ team lead က စာမျက်နှာ တစ်မျက်နှာ စာ တောင်းလာပါတယ်။ လိုအပ်ချက် တစ်ခု
      ရောက်လာရင် ဘယ် feature ကို ရွေးမလဲ ဆိုတာ ဆုံးဖြတ်ပေးတဲ့ လမ်းညွှန်ပါ။ ဒီ lesson မှာ အဲဒီ လမ်းညွှန်ကို feature
      တစ်ခုစီအတွက် မေးခွန်း တစ်ခုစီနဲ့ ရေးသွားပါမယ်။
    sources:
      - {
          title: "Claude Code Docs: Extend Claude Code (features overview)",
          url: "https://code.claude.com/docs/en/features-overview",
        }
    actions:
      - { id: open-readme, type: workspace.openFile, at: { scene: start }, path: README.md }
      - id: sel-teams
        type: editor.select
        at: { mark: sel-teams }
        target:
          file: README.md
          text: "- Billing team နဲ့ Claude Code"
      - id: sel-team-list
        type: editor.select
        at: { mark: story-2 }
        target:
          file: README.md
          text: "- developer team 4 ခု: Customer App, Billing, Network Tools, Internal Tools"

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] လမ်းညွှန်ကို မရေးခင် မေးခွန်း တစ်ခု မေးပါရစေ။ Network Tools team က Claude က turn တစ်ခု မပြီးခင်
      test တွေ pass ဖြစ်ကို ဖြစ်ရမယ်လို့ လိုချင်ပါတယ်။ turn ဆိုတာ ကိုယ့် message တစ်ခုကို Claude က ဖြေပြီး ရပ်သွားတဲ့အထိ
      ပါ။
      [[mark:q-a]] ပထမ နည်းက test run ပြီးမှ ရပ်ပါလို့ skill တစ်ခုထဲမှာ ရေးထားတာပါ။
      [[mark:q-b]] ဒုတိယ နည်းက Claude ရပ်ခါနီးတိုင်း test ကို run ပေးတဲ့ Stop hook ထားတာပါ။ lesson ကို pause လုပ်ပြီး
      စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ နည်းပါ။ ဘာကြောင့်လဲဆိုတော့ skill က Claude ဖတ်ပြီး ကိုယ်တိုင် အဓိပ္ပာယ်ဖော်ရတဲ့
      ညွှန်ကြားချက် ဖြစ်လို့ ရလဒ်က တစ်ခါနဲ့ တစ်ခါ ကွာနိုင်ပါတယ်။ hook ကတော့ Claude Code ရဲ့ အဆင့် တစ်ခုခုမှာ အလိုအလျောက်
      run တဲ့ ကိုယ့် command ပါ။ Claude က ဆုံးဖြတ်စရာ မလိုဘဲ event ရောက်တိုင်း run ပြီး၊ test fail ရင် Claude ကို
      ဆက်အလုပ်လုပ်ခိုင်းပါတယ်။
      [[mark:quiz-cap]] ဆက်တိုက် ရှစ်ခါ ပြန်ခိုင်းပြီးရင်တော့ Claude Code က turn ကို ပြီးခွင့်ပေးတဲ့ အကန့်အသတ်
      ရှိတာမို့၊ hook က test ကို အမြဲ run ပေးပေမဲ့ pass ဖြစ်မယ်လို့တော့ အာမမခံပါဘူး။
      [[mark:q-rule]] docs ရဲ့ ဥပမာနဲ့ ပြောရရင် env file ကို ဘယ်တော့မှ မပြင်ပါနဲ့လို့ skill ထဲ ရေးထားတာက တောင်းဆိုချက်
      ပါ။ tool မသုံးခင် run တဲ့ hook ကတော့ တကယ် ပိတ်တာပါ။ ခြွင်းချက် မရှိရမယ့် စည်းကမ်းကို hook ထဲ ထားပါ။
    sources:
      - {
          title: "Claude Code Docs: Extend Claude Code (hook vs skill)",
          url: "https://code.claude.com/docs/en/features-overview",
        }
      - {
          title: "Claude Code Docs: Hooks reference (Stop, exit code 2)",
          url: "https://code.claude.com/docs/en/hooks",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - { id: point-cap, type: whiteboard.point, at: { mark: quiz-cap }, target: { assetId: q-b } }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: q-rule },
          upsertIds: [q-t1, q-t2],
          drawMs: 1600,
        }

  - id: five
    chapter: Feature ငါးခု၊ မေးခွန်း ငါးခု
    narration: >
      [[mark:f-open]] ဒီ စည်းကမ်းကို feature ငါးခုလုံးအတွက် ချဲ့ကြည့်ရအောင်။ feature တစ်ခုစီမှာ မေးရမယ့် မေးခွန်း တစ်ခုစီ
      ရှိပါတယ်။
      [[mark:f-1]] ပထမ မေးခွန်းက session တိုင်းမှာ သိထားရမလား ဆိုတာပါ။ ဟုတ်ရင် CLAUDE.md ပါ။ CLAUDE.md ဆိုတာ project
      အကြောင်း Claude Code အမြဲ သိထားရမယ့် အချက်တွေ ရေးထားတဲ့ file ပါ။ request တိုင်းမှာ token ကုန်တာမို့ docs က စာကြောင်း
      ၂၀၀ အောက်မှာ ထားဖို့ ပြောပါတယ်။
      [[mark:f-1b]] Claude က project ရဲ့ စည်းကမ်း တစ်ခုကို နှစ်ခါ မှားပြီဆိုရင် CLAUDE.md ထဲ ထည့်ဖို့
      အချိန်ရောက်ပါပြီ။ ဒါပေမဲ့ Claude Code က CLAUDE.md ကို context အနေနဲ့ ဖတ်တာပါ။ အတင်းအကျပ် လိုက်နာစေတဲ့ setting
      မဟုတ်ပါဘူး။
      [[mark:f-2]] ဒုတိယ မေးခွန်းက ခုနက တွေ့ခဲ့တဲ့ ခြွင်းချက် မရှိ ဖြစ်ရမလား ဆိုတာပါ။ ဟုတ်ရင် hook ပါ။ Billing မှာ
      format လုပ်ဖို့ CLAUDE.md ထဲ ရေးထားတာကို တစ်ပတ်အတွင်း ဆယ်ခါမှာ တစ်ခါလောက် ကျော်သွားလို့ hook နဲ့ အစားထိုးခဲ့တာ
      ဒီ မေးခွန်းကြောင့်ပါ။ hook က output မပြန်ရင် context တစ်ခုမှ မကုန်ပါဘူး။
      [[mark:f-3]] တတိယ မေးခွန်းက သီးသန့် context လိုလား ဆိုတာပါ။ output များတဲ့ အလုပ်ကို main session ထဲ မဝင်စေချင်ရင်
      subagent ပါ။ subagent ဆိုတာ အလုပ် တစ်ပိုင်းကို သီးသန့် context နဲ့ လုပ်ပေးပြီး အကျဉ်းချုပ်ကိုပဲ ပြန်ပို့တဲ့ လက်ထောက်
      agent ပါ။ ဘေးအလုပ် တစ်ခုက ကိုယ့် စကားဝိုင်းကို output တွေနဲ့ ပြည့်စေနေရင် subagent ကို စဉ်းစားပါ။
      [[mark:f-4]] စတုတ္ထ မေးခွန်းက task တချို့မှာပဲ လိုတဲ့ လုပ်ငန်းစဉ်လား ဆိုတာပါ။ ဟုတ်ရင် skill ပါ။ session တိုင်း
      ကုန်တာ description လောက်ပဲ ဖြစ်ပြီး၊ စာကိုယ်ကို လိုမှ ဖတ်ပါတယ်။ လုပ်ငန်းစဉ် တစ်ခုကို chat ထဲ သုံးခါမြောက်
      ကူးထည့်ရပြီ ဆိုရင် skill လုပ်ဖို့ အချိန်ရောက်ပါပြီ။
      [[mark:f-5]] ပဉ္စမ မေးခွန်းက အပြင်က system တစ်ခုနဲ့ ချိတ်ရမလား ဆိုတာပါ။ ဟုတ်ရင် MCP server ပါ။ MCP server ဆိုတာ
      tool နဲ့ data ကို ထုတ်ပေးတဲ့ဘက်ပါ။ tool ကို မသုံးမချင်း context ကုန်တာ နည်းပါတယ်။
    sources:
