      - id: expect-final-css
        type: expect.file
        at: { mark: recap }
        path: styles.css
        contains: ".round-photo {\n  clip-path: circle(50%);\n  clip-path: circle(30% at 65% 35%);\n}\n\n.bowl {\n  clip-path: ellipse(50% 100% at top);\n}\n\n.crop-banner {\n  clip-path: inset(10px 20px);\n  clip-path: inset(10px 20px round 16px);\n}\n\n"
      - id: expect-final-css-2
        type: expect.file
        at: { afterAction: expect-final-css }
        path: styles.css
        contains: ".price-tag {\n  clip-path: polygon(0 0, 85% 0, 100% 50%, 85% 100%, 0 100%);\n}\n\n.hero {\n  clip-path: polygon(0 0, 100% 0, 100% 85%, 0 100%);\n}\n\n.star {\n  clip-path: polygon(evenodd, 50% 0, 79% 90%, 2% 35%, 98% 35%, 21% 90%);\n}\n\n.teapot {\n  clip-path: circle(50%);\n  shape-outside: circle(50%);\n  shape-margin: 10px;\n}\n\n.story {\n  mask-image: linear-gradient(black 60%, transparent);\n}\n\n.coaster {\n  mask:\n    linear-gradient(black 0 0),\n    radial-gradient(circle 30px, black 98%, transparent);\n  mask-composite: exclude;\n}\n\n.leaf-dot {\n  offset-path: circle(80px);\n  offset-distance: 0%;\n  offset-distance: 25%;\n  offset-distance: 50%;\n  offset-distance: 75%;\n}\n"

