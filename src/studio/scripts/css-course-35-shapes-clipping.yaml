build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 4135

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  - id: shapes-intro
    chapter: "Shape function တွေ ဘယ်မှာ သုံးလဲ"
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ ထောင့်ဝိုင်းဟာ လေးထောင့် မဟုတ်တဲ့ ပုံ ရဖို့ အရိုးရှင်းဆုံး နည်း
      ဖြစ်တယ်လို့ ပြောခဲ့ပါတယ်။ ဒီ lesson မှာတော့ box တွေကို ကြိုက်တဲ့ ပုံသဏ္ဌာန် ဖြတ်ကြည့်ပါမယ်။
      [[mark:start-server]] ဒီလို ပြောနေတုန်းမှာပဲ၊ board နောက်မှာ dev server ကို စနေပါပြီ။
      [[mark:draw-box]] page ပေါ်က element တိုင်းက အခုထိ လေးထောင့် box တွေပါပဲ။ clip path ဆိုတာ
      element ကို ပုံသဏ္ဌာန် တစ်ခုအတိုင်း ဖြတ်ပြီး၊ အဲဒီ ပုံသဏ္ဌာန်ထဲက အပိုင်းကိုပဲ မြင်ရအောင်
      လုပ်တာပါ။ [[mark:draw-functions]] ပုံသဏ္ဌာန်ကိုတော့ shape function နဲ့ ဖော်ပြပါတယ်။ ဒီနေ့
      ရိုက်မယ့် လေးခုက circle၊ ellipse၊ inset နဲ့ polygon ပါ။ [[mark:draw-uses]] ဒီ shape function
      တွေကို နေရာ သုံးခုမှာ သုံးပါတယ်။ clip path က box ကို ဖြတ်ယူပါတယ်။ shape outside က စာကို
      ပုံသဏ္ဌာန် ပတ်လည်မှာ စီးစေပြီး၊ offset path ကတော့ ပုံသဏ္ဌာန်ကို element ရွေ့မယ့် လမ်း
      ဖြစ်စေပါတယ်။ [[mark:draw-mask]] နောက်ပိုင်းမှာ box ကို မှိန်သွားအောင်ပါ လုပ်နိုင်တဲ့ mask ကိုလည်း တွေ့ရပါမယ်။
    sources:
      - title: "web.dev Learn CSS — Paths, shapes, clipping, and masking"
        url: "https://web.dev/learn/css/paths-shapes-clipping-masking#paths_and_shapes"
      - title: "MDN — <basic-shape>"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/basic-shape"
      - title: "MDN — clip-path"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/clip-path"
      - title: "CSS Shapes Module Level 1 — basic shapes"
        url: "https://drafts.csswg.org/css-shapes-1/#basic-shape-functions"
    actions:
      - id: open-intro-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      # Runs in the background (boot + pnpm install + spawn); waitForReady sits
      # on the preview mark in the code tour, well over 40 s of narration later.
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 45000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-box
        type: whiteboard.apply
        at: { mark: draw-box }
        upsertIds: [a-box, a-cut, a-box-l, a-cut-l]
        drawMs: 2800
      - id: draw-functions
        type: whiteboard.apply
        at: { mark: draw-functions }
        upsertIds: [a-funcs]
        drawMs: 1800
      - id: draw-uses
        type: whiteboard.apply
        at: { mark: draw-uses }
        upsertIds: [a-arrow, a-use1, a-use2, a-use3]
        drawMs: 3200
      - id: draw-mask
        type: whiteboard.apply
        at: { mark: draw-mask }
        upsertIds: [a-mask]
        drawMs: 1200

  - id: code-tour
    narration: >
      [[mark:close-intro-board]] page ကို ကြည့်ရအောင်။ [[mark:open-index]] ဒါက HTML ဖိုင်ပါ။
      [[mark:select-hero]] အပေါ်ဆုံးက အမြင့် ပုံသေ ရှိတဲ့ ကြိုဆိုတဲ့ အပိုင်းပါ။ [[mark:select-photos]]
      သူ့အောက်မှာ ပုံ သုံးခု ရှိပါတယ်။ ဆိုင်ရဲ့ ပုံ၊ မုန့်ဟင်းခါး ပန်းကန်နဲ့ ဘေးမှာ box
      တစ်ခု ကပ်ထားတဲ့ banner ပါ။ box တွေ ဘယ်မှာ ရှိလဲ ဆိုတာ မျဉ်းပြတ် ဘောင်တွေက ပြပါတယ်။
      [[mark:select-card]] ဒီနေ့ အထူး card မှာ ရွှေရောင် စတုရန်း ပါပြီး၊ ဈေးနှုန်းက တံဆိပ်
      သေးသေးလေးပါ။ [[mark:select-about]] ဆိုင်အကြောင်း အပိုင်းမှာတော့ ကရား ပုံက စာ အရှည်ကြီးရဲ့
      ဘယ်ဘက်မှာ float လုပ်ထားပါတယ်။ [[mark:select-extras]] အောက်ဆုံးမှာ အစိမ်းရောင် စားပွဲပေါ်က
      ခွက်ခံနဲ့၊ မျဉ်းပြတ် စက်ဝိုင်း ဘေးက အစက် အစိမ်းလေး ရှိပါတယ်။ [[mark:open-styles]] CSS ဖိုင်ကတော့
      အလွတ်ပါ။ [[mark:preview-opens]] preview ပွင့်လာပါပြီ။ အခုတော့ page ပေါ်က အရာအားလုံး
      လေးထောင့်တွေပဲ ဖြစ်ပါသေးတယ်။
    sources:
      - title: "web.dev Learn CSS — Paths, shapes, clipping, and masking"
        url: "https://web.dev/learn/css/paths-shapes-clipping-masking"
      - title: "MDN — clip-path (initial value none)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/clip-path"
    actions:
      - id: close-intro-board
        type: whiteboard.apply
        at: { mark: close-intro-board }
        open: false
      - id: open-index
        type: workspace.openFile
        at: { mark: open-index }
        path: index.html
      - id: select-hero
        type: editor.select
        at: { mark: select-hero }
        target:
          { file: index.html, text: '<section class="hero" data-testid="hero">', occurrence: 1 }
      - id: select-photos
        type: editor.select
        at: { mark: select-photos }
        target:
          {
            file: index.html,
            text: '<section class="shape-photos" data-testid="shape-photos">',
            occurrence: 1,
          }
      - id: select-card
        type: editor.select
        at: { mark: select-card }
        target:
          {
            file: index.html,
            text: '<span class="star" aria-hidden="true" data-testid="star"></span>',
            occurrence: 1,
          }
      - id: select-about
        type: editor.select
        at: { mark: select-about }
        target:
          {
            file: index.html,
            text: '<div class="teapot" role="img" aria-label="ကရား" data-testid="teapot"></div>',
            occurrence: 1,
          }
      - id: select-extras
        type: editor.select
        at: { mark: select-extras }
        target: { file: index.html, text: '<div class="extras">', occurrence: 1 }
      - id: open-styles
        type: workspace.openFile
        at: { mark: open-styles }
        path: styles.css
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { mark: preview-opens }
        timeoutMs: 20000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-dev-server }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-hero
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: hero }
        textContains: "မင်္ဂလာပါ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-story
        type: expect.preview
        at: { afterAction: expect-hero }
        timeoutMs: 5000
        target: { by: testId, value: story }
        textContains: "ဗဟန်းက လမ်းထောင့်လေးမှာ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: collapse-runner-dock
        type: runtime.collapseDock
        at: { afterAction: expect-story }

  - id: circle
    chapter: "Circle နဲ့ ellipse"
    narration: >
      [[mark:type-circle]] ဆိုင်ရဲ့ ပုံကနေ စကြည့်ရအောင်။ rule အသစ် တစ်ခုနဲ့ သူ့ကို 50 ရာခိုင်နှုန်း
      ရှိတဲ့ circle ကို clip path အဖြစ် ပေးပါမယ်။ ရိုက်နေတုန်း ပုံကို လိုက်ကြည့်ပါ။
      [[mark:after-circle]] စတုရန်း ပုံက ဝိုင်းသွားပါပြီ။ [[mark:explain-radius]] ဒီ 50
      ရာခိုင်နှုန်းကို ကြည့်ပါ။ ဒါက circle ရဲ့ အချင်းဝက် ဖြစ်ပြီး၊ box ကို အခြေခံ တွက်တာပါ။
      စတုရန်းမှာဆိုရင် ဘေးတိုင်းရဲ့ အလယ်ထိ ရောက်ပါတယ်။ အချင်းဝက် မပေးရင်တော့ circle က အနီးဆုံး ဘေးကို
      ထိတဲ့အထိ ကြီးလာပါတယ်။ [[mark:explain-hard]] အစွန်းက ပြတ်ပြတ်သားသားပါ။ pixel တစ်ခုချင်းကို ပုံသဏ္ဌာန်ထဲမှာ ရှိရင် ဆွဲပြီး၊ အပြင်မှာ ရှိရင် ဖျောက်လိုက်လို့ပါ။ [[mark:type-at]] အောက်မှာ 30
      ရာခိုင်နှုန်း ရှိတဲ့ ပိုသေးတဲ့ circle ရေးပါမယ်။ at ဆိုတဲ့ စကားလုံး နောက်မှာ အလယ်ရဲ့ ညာဘက်၊
      နည်းနည်း အပေါ်က အလယ်မှတ် အသစ် ပေးပါမယ်။ [[mark:after-at]] circle က ပိုသေးသွားပြီး ညာဘက် အပေါ်ကို
      ရွေ့သွားပါပြီ။ [[mark:explain-at]] at နောက်က နေရာကို lesson 33 က background position လိုပဲ
      ရေးပါတယ်။ မပေးရင်တော့ circle ရဲ့ အလယ်က box ရဲ့ အလယ်ပါ။ element တစ်ခုမှာ clip path တစ်ခုပဲ
      ရှိနိုင်လို့၊ နောက်က declaration က ပထမကို အစားထိုးပါတယ်။
    sources:
      - title: "web.dev Learn CSS — circle() and ellipse()"
        url: "https://web.dev/learn/css/paths-shapes-clipping-masking#circle_and_ellipse"
      - title: "web.dev Learn CSS — Clipping"
        url: "https://web.dev/learn/css/paths-shapes-clipping-masking#clipping"
      - title: "MDN — circle() (radius, closest-side default, at <position>)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/basic-shape/circle"
      - title: "CSS Shapes Module Level 1 — circle()"
        url: "https://drafts.csswg.org/css-shapes-1/#funcdef-basic-shape-circle"
    actions:
      - id: type-circle
        type: editor.type
        at: { mark: type-circle }
        cadence: fast-explainer
        target: { file: styles.css, after: "", occurrence: 1 }
        text: ".round-photo {\n  clip-path: circle(50%);\n}\n"
      - id: expect-circle
        type: expect.preview
        at: { mark: after-circle }
        timeoutMs: 4000
        target: { by: testId, value: round-photo }
        attribute: { name: alt, value: "ဆိုင်အတွင်းပိုင်း" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-radius
        type: editor.select
        at: { mark: explain-radius }
        target: { file: styles.css, text: "50%", occurrence: 1 }
      - id: type-at
        type: editor.type
        at: { mark: type-at }
        cadence: fast-explainer
        target: { file: styles.css, after: "  clip-path: circle(50%);\n", occurrence: 1 }
        text: "  clip-path: circle(30% at 65% 35%);\n"
      - id: expect-at
        type: expect.preview
        at: { mark: after-at }
        timeoutMs: 4000
        target: { by: testId, value: round-photo }
        attribute: { name: width, value: "160" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-at
        type: editor.select
        at: { mark: explain-at }
        target: { file: styles.css, text: "at 65% 35%", occurrence: 1 }

  - id: ellipse
    narration: >
      [[mark:type-bowl]] ellipse မှာတော့ ဘေးတိုက် အချင်းဝက်နဲ့ အပေါ်အောက် အချင်းဝက် နှစ်ခု လိုပါတယ်။
      ပန်းကန်အတွက် ဘေးတိုက်ကို အကျယ်ရဲ့ တစ်ဝက်၊ အပေါ်အောက်ကို အမြင့် အပြည့် ပေးပြီး၊ အလယ်မှတ်ကို
      အပေါ်ဘက် အစွန်းအထိ တင်ပါမယ်။ [[mark:after-bowl]] ellipse ရဲ့ အောက်တစ်ဝက်ပဲ box ထဲမှာ ကျန်လို့၊ box က ပန်းကန်လို အောက်ခြေ ဝိုင်းဝိုင်း ဖြစ်သွားပါပြီ။ [[mark:explain-ellipse]] ဒီ ရာခိုင်နှုန်း
      နှစ်ခုကို ကြည့်ပါ။ ပထမ တစ်ခုကို အကျယ်ကနေ၊ ဒုတိယကို အမြင့်ကနေ တွက်လို့၊ box အရွယ် ပြောင်းရင်
      ပန်းကန်ပုံလည်း လိုက်ပြောင်းပါတယ်။
    sources:
      - title: "web.dev Learn CSS — circle() and ellipse()"
        url: "https://web.dev/learn/css/paths-shapes-clipping-masking#circle_and_ellipse"
      - title: "MDN — ellipse() (two radii, at <position>)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/basic-shape/ellipse"
    actions:
      - id: type-bowl
        type: editor.type
        at: { mark: type-bowl }
        cadence: fast-explainer
        target:
          { file: styles.css, after: "  clip-path: circle(30% at 65% 35%);\n}\n", occurrence: 1 }
        text: "\n.bowl {\n  clip-path: ellipse(50% 100% at top);\n}\n"
      - id: expect-bowl
        type: expect.preview
        at: { mark: after-bowl }
        timeoutMs: 4000
        target: { by: testId, value: bowl }
        attribute: { name: aria-label, value: "မုန့်ဟင်းခါး ပန်းကန်" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-radii
        type: editor.select
        at: { mark: explain-ellipse }
        target: { file: styles.css, text: "50% 100%", occurrence: 1 }

  - id: inset
    chapter: "Inset နဲ့ ဖြတ်ယူရအောင်"
    narration: >
      [[mark:type-inset]] inset က box ကို ဖြတ်ယူတဲ့ အရိုးရှင်းဆုံး နည်းပါ။ သူ့ တန်ဖိုးတွေက
      ဘေးတိုင်းကနေ အထဲကို ဝင်လာမယ့် အကွာအဝေးတွေ ဖြစ်ပြီး၊ margin နဲ့ အစဉ် တူပါတယ်။ banner အတွက်
      အပေါ်အောက်ကို 10 pixel၊ ဘယ်ညာကို 20 pixel ပေးပါမယ်။ [[mark:after-inset]] banner ကို ဘေး
      လေးဘက်လုံးက ဖြတ်လိုက်ပါပြီ။ [[mark:explain-box]] ဒါပေမဲ့ မျဉ်းပြတ် ဘောင်နဲ့ ဘေးက box ကို
      ကြည့်ပါ၊ ဘာမှ မရွေ့ပါဘူး။ clip path က မြင်ရတဲ့ အပိုင်းကိုပဲ ပြောင်းပါတယ်။ element ရဲ့
      အရွယ်အစားနဲ့ layout ထဲက နေရာက မပြောင်းပါဘူး။ mask မှာလည်း ဒီအတိုင်းပါပဲ။ [[mark:type-round]]
      inset က ထောင့်တွေကိုလည်း ဝိုင်းပေးနိုင်ပါတယ်။ အောက်မှာ အတူတူ ဖြတ်ပြီး၊ round ဆိုတဲ့ စကားလုံးနဲ့
      16 pixel အချင်းဝက် ထည့်ပါမယ်။ [[mark:after-round]] ဖြတ်ထားတဲ့ ထောင့်တွေ ဝိုင်းသွားပါပြီ။
      [[mark:explain-round]] round နောက်က တန်ဖိုးတွေက ပြီးခဲ့တဲ့ lesson က border radius နဲ့ အတူတူ
      အလုပ်လုပ်ပါတယ်။ [[mark:explain-rect]] လေးထောင့် ဖြတ်ယူတဲ့ function အသစ် နှစ်ခုလည်း ရှိပါတယ်။ rect မှာ တန်ဖိုး လေးခုလုံးကို inset လို သူ့ဘေးကနေ မတိုင်းဘဲ၊ အပေါ် အစွန်း ဒါမှမဟုတ် ဘယ် အစွန်းကနေပဲ တိုင်းပါတယ်။ x y w h မှာတော့ စမယ့် အမှတ် ပေးပြီး၊ အကျယ်နဲ့ အမြင့်ကို ပေးပါတယ်။
    sources:
      - title: "web.dev Learn CSS — rect() and inset()"
        url: "https://web.dev/learn/css/paths-shapes-clipping-masking#rect_and_inset"
      - title: "MDN — inset() (round keyword)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/basic-shape/inset"
      - title: "MDN — rect()"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/basic-shape/rect"
      - title: "MDN — xywh()"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/basic-shape/xywh"
      - title: "CSS Masking Module Level 1 — clipping paths do not affect layout"
        url: "https://drafts.csswg.org/css-masking-1/#clipping-paths"
    actions:
      - id: type-inset
        type: editor.type
        at: { mark: type-inset }
        cadence: fast-explainer
        target:
          { file: styles.css, after: "  clip-path: ellipse(50% 100% at top);\n}\n", occurrence: 1 }
        text: "\n.crop-banner {\n  clip-path: inset(10px 20px);\n}\n"
      - id: expect-inset
        type: expect.preview
        at: { mark: after-inset }
        timeoutMs: 4000
        target: { by: testId, value: neighbour }
        textContains: "ဘေးက box"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-round
        type: editor.type
        at: { mark: type-round }
        cadence: fast-explainer
        target: { file: styles.css, after: "  clip-path: inset(10px 20px);\n", occurrence: 1 }
        text: "  clip-path: inset(10px 20px round 16px);\n"
      - id: expect-round
        type: expect.preview
        at: { mark: after-round }
        timeoutMs: 4000
        target: { by: testId, value: crop-banner }
        attribute: { name: aria-label, value: "ဆိုင်ရှေ့ ရှုခင်း" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-round
        type: editor.select
        at: { mark: explain-round }
        target: { file: styles.css, text: "round 16px", occurrence: 1 }

  - id: polygon-points
    chapter: "Polygon နဲ့ ကြိုက်တဲ့ ပုံ"
    narration: >
      [[mark:open-grid]] ဘေးတွေ ဖြောင့်တဲ့ ဘယ် ပုံသဏ္ဌာန်အတွက်မဆို polygon ရှိပါတယ်။ သူက အမှတ်တွေရဲ့
      စာရင်းကို ယူပြီး၊ အမှတ်တိုင်းမှာ x နဲ့ y ပါပါတယ်။ [[mark:draw-corners]] သုည သုည က box ရဲ့ ဘယ်ဘက်
      အပေါ်ထောင့်ပါ။ x က ညာဘက်ကို၊ y က အောက်ကို တိုးသွားပြီး၊ 100 ရာခိုင်နှုန်း 100 ရာခိုင်နှုန်း က
      ညာဘက် အောက်ထောင့်ပါ။ [[mark:draw-points]] ဈေးနှုန်း တံဆိပ်အတွက် ဘယ်ဘက် အပေါ်ထောင့်က စပြီး၊
      အပေါ်အစွန်းအတိုင်း 85 ရာခိုင်နှုန်းထိ သွားပါမယ်။ ပြီးရင် ညာဘက် အစွန်း အလယ်မှာ အချွန် ထွက်အောင်
      သွားပြီး၊ အောက်ဘက် 85 ရာခိုင်နှုန်းကို ပြန်ဝင်ပါမယ်။ နောက်ဆုံးက ဘယ်ဘက် အောက်ထောင့်ပါ။
      [[mark:draw-rules]] အမှတ်တွေကြားမှာ comma ခြားပြီး၊ x နဲ့ y ကြားမှာတော့ နေရာလွတ်ပဲ ခြားပါတယ်။
      ပထမ အမှတ်ကို ပြန်ရေးစရာ မလိုပါဘူး။ browser က နောက်ဆုံး အမှတ်ကို ပထမ အမှတ်နဲ့ ပြန်ဆက်ပေးလို့ပါ။
    sources:
      - title: "web.dev Learn CSS — polygon()"
        url: "https://web.dev/learn/css/paths-shapes-clipping-masking#polygon"
      - title: "MDN — polygon()"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/basic-shape/polygon"
      - title: "CSS Shapes Module Level 1 — polygon()"
        url: "https://drafts.csswg.org/css-shapes-1/#funcdef-basic-shape-polygon"
    actions:
      - id: open-grid
        type: whiteboard.apply
        at: { mark: open-grid }
        open: true
        clear: true
        upsertIds: [b-title, b-box]
      - id: draw-corners
        type: whiteboard.apply
        at: { mark: draw-corners }
        upsertIds: [b-c1, b-x, b-y, b-c3, b-c2, b-c4]
        drawMs: 3200
      - id: draw-points
        type: whiteboard.apply
        at: { mark: draw-points }
        upsertIds: [b-p1, b-n1, b-p2, b-n2, b-p3, b-n3, b-p4, b-n4, b-p5, b-n5]
        drawMs: 5000
      - id: draw-rules
        type: whiteboard.apply
        at: { mark: draw-rules }
        upsertIds: [b-comma, b-close]
        drawMs: 2400

  - id: polygon-code
    narration: >
      [[mark:close-grid]] editor ကို ပြန်သွားရအောင်။ [[mark:type-tag]] ခုနက အမှတ် ငါးခုကို ဈေးနှုန်း
      တံဆိပ်အတွက် rule အသစ်ထဲ ထည့်ပါမယ်။ ဒီနေ့ အထူး အောက်က ဈေးနှုန်းကို ကြည့်ထားပါ။ [[mark:after-tag]]
      တံဆိပ်ရဲ့ အဆုံးက မြှားလို ချွန်သွားပါပြီ။ [[mark:type-hero]] ကြိုဆိုတဲ့ အပိုင်းရဲ့
      အောက်ခြေကိုလည်း ဒီနည်းနဲ့ပဲ အမှတ် လေးခုနဲ့ စောင်းအောင် လုပ်ပါမယ်။ ညာဘက် အောက်ထောင့်ကို အမြင့်ရဲ့
      85 ရာခိုင်နှုန်းဆီ တင်လိုက်တာပါ။ [[mark:after-hero]] page ရဲ့ အပေါ်ဆုံးမှာ ကြိုဆိုတဲ့ အပိုင်းရဲ့
      အောက်ခြေက ဘယ်ဘက်ထက် ညာဘက်မှာ ပိုမြင့်သွားပါပြီ။
    sources:
      - title: "web.dev Learn CSS — polygon()"
        url: "https://web.dev/learn/css/paths-shapes-clipping-masking#polygon"
      - title: "MDN — polygon() (percentages of the reference box)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/basic-shape/polygon"
    actions:
      - id: close-grid
        type: whiteboard.apply
        at: { mark: close-grid }
        open: false
      # line-by-line: every revealed line has balanced parentheses.
      - id: type-tag
        type: editor.type
        at: { mark: type-tag }
        cadence: line-by-line
        target:
          {
            file: styles.css,
            after: "  clip-path: inset(10px 20px round 16px);\n}\n",
            occurrence: 1,
          }
        text: "\n.price-tag {\n  clip-path: polygon(0 0, 85% 0, 100% 50%, 85% 100%, 0 100%);\n}\n"
      - id: expect-tag
        type: expect.preview
        at: { mark: after-tag }
        timeoutMs: 4000
        target: { by: testId, value: price-laphet-yay }
        textContains: "1,500 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-hero
        type: editor.type
        at: { mark: type-hero }
        cadence: line-by-line
        target: { file: styles.css, after: "85% 100%, 0 100%);\n}\n", occurrence: 1 }
        text: "\n.hero {\n  clip-path: polygon(0 0, 100% 0, 100% 85%, 0 100%);\n}\n"
      - id: expect-hero-slant
        type: expect.preview
        at: { mark: after-hero }
        timeoutMs: 4000
        target: { by: testId, value: hero }
        textContains: "ပူပူနွေးနွေး"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: fill-rule
    narration: >
      [[mark:type-star]] polygon ရဲ့ မျဉ်းတွေက အချင်းချင်း ဖြတ်သွားလို့လည်း ရပါတယ်။ ရွှေရောင်
      စတုရန်းအတွက် အမှတ်တစ်ခုကနေ တစ်ခုကို ခုန်ကူးတဲ့ မျဉ်း တစ်ကြောင်းတည်းနဲ့ ငါးချွန် ကြယ် ဆွဲပါမယ်။
      [[mark:after-star]] စတုရန်းက ကြယ် ဖြစ်သွားပါပြီ။ [[mark:explain-nonzero]] ဒီ အမှတ်တွေကို
      ကြည့်ပါ။ မျဉ်းတွေ အလယ်မှာ ဖြတ်နေပေမယ့် အလယ်ကို ဖြည့်ထားပါတယ်။ ဒါက default fill rule ဖြစ်တဲ့ nonzero ကြောင့်ပါ။ သူက မျဉ်းတွေ ပတ်တဲ့ ဘက်ကို ကြည့်ပြီး၊ ဒီ ကြယ်လို တစ်ဘက်တည်း ပတ်ဆွဲထားရင် အလယ်ကိုလည်း အထဲလို့ပဲ တွက်ပါတယ်။ [[mark:type-evenodd]] အမှတ်တွေရဲ့ ရှေ့မှာ evenodd ဆိုတဲ့ စကားလုံး ထည့်ကြည့်ရအောင်။
      [[mark:after-evenodd]] အခု ကြယ်ရဲ့ အလယ်က ဟောင်းလောင်း ဖြစ်သွားပါပြီ။ [[mark:explain-evenodd]] ဒီ
      evenodd ကို ကြည့်ပါ။ သူက နေရာ တစ်ခုကနေ ပုံရဲ့ အပြင်ကို ထွက်တဲ့အခါ မျဉ်း ဘယ်နှကြောင်း ဖြတ်ရလဲ
      ရေတွက်ပါတယ်။ မကိန်း ဆိုရင် အထဲ၊ စုံကိန်း ဆိုရင် အပြင်ပါ။ အလယ်ကနေ ထွက်ရင် မျဉ်း နှစ်ကြောင်း
      ဖြတ်ရလို့ ဟောင်းလောင်း ကျန်ပါတယ်။
    sources:
      - title: "web.dev Learn CSS — polygon() (fill rule)"
        url: "https://web.dev/learn/css/paths-shapes-clipping-masking#polygon"
      - title: "MDN — polygon() (fill-rule nonzero, evenodd)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/basic-shape/polygon#syntax"
      - title: "MDN — fill-rule (nonzero and evenodd)"
        url: "https://developer.mozilla.org/en-US/docs/Web/SVG/Reference/Attribute/fill-rule"
    actions:
      - id: type-star
        type: editor.type
        at: { mark: type-star }
        cadence: line-by-line
        target: { file: styles.css, after: "100% 85%, 0 100%);\n}\n", occurrence: 1 }
        text: "\n.star {\n  clip-path: polygon(50% 0, 79% 90%, 2% 35%, 98% 35%, 21% 90%);\n}\n"
      - id: expect-star
        type: expect.preview
        at: { mark: after-star }
        timeoutMs: 4000
        target: { by: testId, value: star }
        attribute: { name: aria-hidden, value: "true" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-star
        type: editor.select
        at: { mark: explain-nonzero }
        target:
          { file: styles.css, text: "50% 0, 79% 90%, 2% 35%, 98% 35%, 21% 90%", occurrence: 1 }
      # One block insert into the star's polygon: "evenodd, " has no
      # parentheses, and the star rule is complete before and after it.
      - id: type-evenodd
        type: editor.type
        at: { mark: type-evenodd }
        cadence: block
        target: { file: styles.css, after: ".star {\n  clip-path: polygon(", occurrence: 1 }
        text: "evenodd, "
      - id: expect-evenodd
        type: expect.preview
        at: { mark: after-evenodd }
        timeoutMs: 4000
        target: { by: testId, value: card-laphet-yay }
        textContains: "လက်ဖက်ရည်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-evenodd
        type: editor.select
        at: { mark: explain-evenodd }
        target: { file: styles.css, text: "evenodd", occurrence: 1 }

  - id: complex-shapes
    chapter: "Path နဲ့ shape()"
    narration: >
      [[mark:open-complex]] polygon က ဘေးဖြောင့်တဲ့ ပုံ အများစုကို လုပ်ပေးနိုင်ပါတယ်။
      [[mark:draw-trig]] အချွန်တွေ အညီအမျှ ရှိတဲ့ ကြယ်လို ပုံသဏ္ဌာန်မျိုးအတွက်တော့၊ lesson 12 မှာ
      တွေ့ခဲ့တဲ့ cos နဲ့ sin ကို သုံးပြီး အမှတ်တစ်ခုချင်းကို တွက်လို့ ရပါတယ်။ [[mark:draw-path]]
      အကွေးတွေအတွက်တော့ path ရှိပါတယ်။ သူက SVG ပုံတွေမှာ သုံးတဲ့ path data ကို ယူလို့၊ design tool ကနေ
      copy ကူးလာလို့ ရပါတယ်။ ဒါပေမဲ့ သူ့ထဲက ဂဏန်းတိုင်းက pixel ဖြစ်လို့၊ box ကြီးလာ သေးလာလည်း
      ပုံသဏ္ဌာန်က လိုက်မပြောင်းပါဘူး။ [[mark:draw-shape]] ပိုသစ်တဲ့ shape ဆိုတဲ့ function က အဲဒါကို ဖြေရှင်းပေးပါတယ်။ သူက path ကို CSS စကားလုံးတွေ၊ ရာခိုင်နှုန်းနဲ့ rem လို CSS unit တွေနဲ့ ရေးလို့
      box ကို လိုက်နိုင်ပါတယ်။ ဒါပေမဲ့ အသစ် ဖြစ်လို့ browser အဓိက အားလုံးမှာ မကြာသေးခင်ကမှ ရလာတာပါ။
      [[mark:draw-boxes]] ပုံသဏ္ဌာန်ထဲက ရာခိုင်နှုန်းတွေကို default အားဖြင့် border box ကို အခြေခံ
      တွက်ပါတယ်။ ပုံသဏ္ဌာန်ရဲ့ နောက်မှာ content box လို တခြား box တစ်ခုကို ရေးရင်၊ content နေရာကို
      အခြေခံ တွက်ပါတယ်။ [[mark:draw-svg]] clip path က url နဲ့ id ပေးပြီး SVG clip path element
      တစ်ခုကိုလည်း ညွှန်လို့ ရပါတယ်။ အဲဒီ SVG ထဲမှာ စာသား အပါအဝင် ဘာပုံမဆို ထည့်လို့ ရပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Complex shapes: path() and shape()"
        url: "https://web.dev/learn/css/paths-shapes-clipping-masking#complex_shapes"
      - title: "web.dev Learn CSS — A clipping path's reference box"
        url: "https://web.dev/learn/css/paths-shapes-clipping-masking#a_clipping_paths_reference_box"
      - title: "web.dev Learn CSS — Clipping with graphics"
        url: "https://web.dev/learn/css/paths-shapes-clipping-masking#clipping_with_graphics"
      - title: "MDN — path() (SVG path data, pixels)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/basic-shape/path"
      - title: "MDN — shape()"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/basic-shape/shape"
      - title: "MDN — clip-path (geometry boxes, url())"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/clip-path#syntax"
      - title: "MDN — SVG <clipPath>"
        url: "https://developer.mozilla.org/en-US/docs/Web/SVG/Element/clipPath"
      - title: "CSS Shapes Module Level 2 — shape()"
        url: "https://drafts.csswg.org/css-shapes-2/#shape-function"
    actions:
      - id: open-complex
        type: whiteboard.apply
        at: { mark: open-complex }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-trig
        type: whiteboard.apply
        at: { mark: draw-trig }
        upsertIds: [c-trig]
        drawMs: 1600
      - id: draw-path
        type: whiteboard.apply
        at: { mark: draw-path }
        upsertIds: [c-path]
        drawMs: 1600
      - id: draw-shape
        type: whiteboard.apply
        at: { mark: draw-shape }
        upsertIds: [c-shape]
        drawMs: 1600
      - id: draw-boxes
        type: whiteboard.apply
        at: { mark: draw-boxes }
        upsertIds: [c-border, c-border-l, c-padding, c-content, c-content-l]
        drawMs: 3200
      - id: draw-svg
        type: whiteboard.apply
        at: { mark: draw-svg }
        upsertIds: [c-svg]
        drawMs: 1600

  - id: shape-outside
    chapter: "စာကို ပုံသဏ္ဌာန်အတိုင်း စီးစေရအောင်"
    narration: >
      [[mark:close-complex]] အခု ဆိုင်အကြောင်း အပိုင်းပါ။ [[mark:type-teapot]] ကရားကိုလည်း ဓာတ်ပုံမှာ
      ပေးခဲ့တဲ့ circle အတိုင်း ဝိုင်းအောင် လုပ်ကြည့်ရအောင်။ ရိုက်နေတုန်း ကရား ဘေးက စာကြောင်းတွေကို
      သေချာ လိုက်ကြည့်ထားပါ။ [[mark:after-teapot]] ကရားက ဝိုင်းသွားပေမယ့်၊ စာကြောင်းတွေက စတုရန်း
      အစွန်း အဟောင်းမှာပဲ ရပ်နေလို့ ထောင့်တွေမှာ နေရာလွတ် ကျန်နေပါတယ်။ [[mark:explain-float]] clip
      path က box ကို မပြောင်းလို့ပါ။ lesson 13 မှာ တွေ့ခဲ့တဲ့ float က စာကို box ပတ်လည်မှာ စီးစေပြီး၊
      အဲဒီ box က စတုရန်းပဲ ရှိပါသေးတယ်။ [[mark:type-shape]] shape outside က စာကို ဘယ် ပုံသဏ္ဌာန်
      ပတ်လည်မှာ စီးရမလဲ ပြောပေးပြီး၊ float တွေမှာပဲ အလုပ်လုပ်ပါတယ်။ အောက်မှာ circle အတူတူကို shape
      outside အဖြစ် ပေးပါမယ်။ [[mark:after-shape]] ကရား ဘေးက စာကြောင်းတွေကို ကြည့်ပါ။ အခု အကွေးအတိုင်း
      ဝင်လိုက် ထွက်လိုက် ဖြစ်သွားပါပြီ။ [[mark:explain-shape]] ဒီ shape outside ကို ကြည့်ပါ။ သူက ဘာမှ
      မဖြတ်ဘဲ စာ စီးပုံကိုပဲ ပြောင်းလို့၊ မြင်ရတဲ့ ပုံအတွက် clip path ကို ဆက်ထားရပါတယ်။
      [[mark:type-margin]] စာက အကွေးနဲ့ ကပ်နေလို့၊ shape margin နဲ့ ပုံသဏ္ဌာန် ပတ်လည်မှာ 10 pixel
      နေရာလွတ် ထည့်ပါမယ်။ [[mark:after-margin]] အခု ကရားနဲ့ စာကြားမှာ နေရာလွတ် နည်းနည်း ရှိသွားပါပြီ။
      [[mark:explain-threshold]] shape outside က ပုံကိုလည်း ယူနိုင်ပါတယ်။ အဲဒီအခါ pixel ရဲ့ alpha
      ဘယ်လောက် ရှိမှ ပုံသဏ္ဌာန်ထဲ ထည့်တွက်မလဲ ဆိုတာ shape image threshold က သတ်မှတ်ပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Flowing text around floated elements"
        url: "https://web.dev/learn/css/paths-shapes-clipping-masking#flowing_text_around_floated_elements"
      - title: "MDN — shape-outside (floats only)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/shape-outside"
      - title: "MDN — shape-margin"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/shape-margin"
      - title: "MDN — shape-image-threshold"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/shape-image-threshold"
      - title: "CSS Shapes Module Level 1 — shape-outside"
        url: "https://drafts.csswg.org/css-shapes-1/#shape-outside-property"
    actions:
      - id: close-complex
        type: whiteboard.apply
        at: { mark: close-complex }
        open: false
      # Was 2000: the page is 1276 px tall at a 432 px preview and only 1161
      # px at 576, so 360 is reachable in a preview up to about 818 px high at
      # either width; a larger target is clamped and the gate finds no
      # recorded command.
      - id: scroll-about
        type: preview.scroll
        at: { mark: close-complex, offsetMs: 300 }
        timeoutMs: 5000
        top: 360
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-teapot
        type: editor.type
        at: { mark: type-teapot }
        cadence: fast-explainer
        target: { file: styles.css, after: "21% 90%);\n}\n", occurrence: 1 }
        text: "\n.teapot {\n  clip-path: circle(50%);\n}\n"
      - id: expect-teapot
        type: expect.preview
        at: { mark: after-teapot }
        timeoutMs: 4000
        target: { by: testId, value: teapot }
        attribute: { name: aria-label, value: "ကရား" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-shape
        type: editor.type
        at: { mark: type-shape }
        cadence: fast-explainer
        target: { file: styles.css, after: ".teapot {\n  clip-path: circle(50%);\n", occurrence: 1 }
        text: "  shape-outside: circle(50%);\n"
      - id: expect-shape
        type: expect.preview
        at: { mark: after-shape }
        timeoutMs: 4000
        target: { by: testId, value: story }
        textContains: "ချိုဆိမ့်၊ ပေါ့ဆိမ့်၊ ကျဆိမ့်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-shape
        type: editor.select
        at: { mark: explain-shape }
        target: { file: styles.css, text: "shape-outside: circle(50%);", occurrence: 1 }
      - id: type-margin
        type: editor.type
        at: { mark: type-margin }
        cadence: fast-explainer
        target: { file: styles.css, after: "  shape-outside: circle(50%);\n", occurrence: 1 }
        text: "  shape-margin: 10px;\n"
      - id: expect-margin
        type: expect.preview
        at: { mark: after-margin }
        timeoutMs: 4000
        target: { by: testId, value: about }
        textContains: "ဆိုင်အကြောင်း"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: mask-fade
    chapter: "Mask ဆိုတာ ဘာလဲ"
    narration: >
      [[mark:type-fade]] စာ ရှည်လို့ နောက်ဆုံး စာကြောင်းတွေကို mask နဲ့ မှိန်အောင် လုပ်ရအောင်။ mask
      ကတော့ ပုံ ဒါမှမဟုတ် gradient တစ်ခုကို သုံးပြီး၊ element ရဲ့ ဘယ်အပိုင်း ဘယ်လောက် မြင်ရမလဲ ဆိုတာ
      ဆုံးဖြတ်ပါတယ်။ ဒီမှာ ပုံအစား lesson 32 က gradient ကို သုံးပြီး၊ အမည်းကနေ လုံးဝ ဖောက်ထွင်း မြင်ရတဲ့ transparent ကို ကူးပါမယ်။
      [[mark:after-fade]] စာရဲ့ အဆုံးပိုင်း မှိန်ပျောက်သွားပါပြီ။ [[mark:explain-mask]] ဒီ gradient
      ကို ကြည့်ပါ။ mask ရဲ့ အရောင် ပြည့်နေတဲ့ နေရာမှာ စာကို အပြည့် မြင်ရပြီး၊ ဖောက်ထွင်း မြင်ရတဲ့ နေရာမှာတော့ စာ ပျောက်သွားပါတယ်။ ကြားထဲမှာတော့ စာကို မှိန်မှိန်လေး မြင်ရပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Masking"
        url: "https://web.dev/learn/css/paths-shapes-clipping-masking#masking"
      - title: "MDN — mask-image"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/mask-image"
      - title: "CSS Masking Module Level 1 — mask-image"
        url: "https://drafts.csswg.org/css-masking-1/#the-mask-image"
    actions:
      - id: type-fade
        type: editor.type
        at: { mark: type-fade }
        cadence: fast-explainer
        target: { file: styles.css, after: "  shape-margin: 10px;\n}\n", occurrence: 1 }
        text: "\n.story {\n  mask-image: linear-gradient(black 60%, transparent);\n}\n"
      - id: expect-fade
        type: expect.preview
        at: { mark: after-fade }
        timeoutMs: 4000
        target: { by: testId, value: story }
        textContains: "သက်သက်သာသာ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-gradient
        type: editor.select
        at: { mark: explain-mask }
        target: { file: styles.css, text: "linear-gradient(black 60%, transparent)", occurrence: 1 }

  - id: mask-modes
    narration: >
      [[mark:open-masks]] ဘာလို့ အမည်းရောင် သုံးတာလဲ။ [[mark:draw-clip-mask]] clip path က ပြတာ
      ဖျောက်တာပဲ လုပ်လို့ အစွန်း ပြတ်ပါတယ်။ mask ကတော့ ပုံကို ဖတ်လို့၊ pixel ကို တစ်စိတ်တစ်ပိုင်း
      ပြနိုင်ပါတယ်။ [[mark:draw-alpha]] default အားဖြင့် ပုံ ဒါမှမဟုတ် gradient mask က alpha mode နဲ့
      အလုပ်လုပ်ပါတယ်။ အရောင်ကို မကြည့်ဘဲ ဘယ်လောက် ဖောက်ထွင်း မြင်ရလဲ ဆိုတာကိုပဲ ကြည့်လို့၊ အမည်းရော အဖြူပါ element ကို ပြပြီး၊ ဖောက်ထွင်း မြင်ရတဲ့ အပိုင်းကပဲ ဖျောက်ပါတယ်။ ဒါကြောင့် ခုနက gradient မှာ အမည်းအစား ဘယ်အရောင် သုံးသုံး အတူတူပါပဲ။ [[mark:draw-luminance]] luminance mode
      မှာတော့ အလင်းအမှောင်ကို ကြည့်ပါတယ်။ အဖြူက element ကို ပြပြီး၊ အမည်းက ဖျောက်ပါတယ်။ mask mode
      property က ဒီ နှစ်မျိုးကြား ပြောင်းပေးပါတယ်။ [[mark:draw-svg-mask]] SVG mask element ကိုလည်း
      mask အဖြစ် သုံးနိုင်ပါတယ်။ သူက default မှာ luminance ကို သုံးပြီး၊ mask type property နဲ့ alpha
      ပြောင်းလို့ ရပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Alpha versus luminance masking"
        url: "https://web.dev/learn/css/paths-shapes-clipping-masking#alpha_versus_luminance_masking"
      - title: "MDN — mask-mode (match-source, alpha, luminance)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/mask-mode"
      - title: "MDN — mask-type (luminance by default on SVG <mask>)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/mask-type"
    actions:
      - id: open-masks
        type: whiteboard.apply
        at: { mark: open-masks }
        open: true
        clear: true
        upsertIds: [d-title]
      - id: draw-clip-mask
        type: whiteboard.apply
        at: { mark: draw-clip-mask }
        upsertIds: [d-clip, d-clip-l, d-mask, d-mask-l]
        drawMs: 2800
      - id: draw-alpha
        type: whiteboard.apply
        at: { mark: draw-alpha }
        upsertIds: [d-alpha, d-a1, d-a2]
        drawMs: 2400
      - id: draw-luminance
        type: whiteboard.apply
        at: { mark: draw-luminance }
        upsertIds: [d-lum, d-l1, d-l2]
        drawMs: 2400
      - id: draw-svg-mask
        type: whiteboard.apply
        at: { mark: draw-svg-mask }
        upsertIds: [d-svg]
        drawMs: 1600

  - id: mask-composite
    chapter: "Mask အလွှာတွေ ပေါင်းရအောင်"
    narration: >
      [[mark:close-masks]] page ဆီ ပြန်သွားရအောင်။ [[mark:type-coaster]] mask မှာ အလွှာ အများကြီး
      ရှိနိုင်ပြီး၊ comma နဲ့ ခြားရေးပါတယ်။ ခွက်ခံအတွက် mask shorthand ကို အလွှာ နှစ်ခု ပေးပါမယ်။
      ခွက်ခံ တစ်ခုလုံးကို ဖုံးတဲ့ အမည်းရောင် gradient နဲ့၊ အလယ်က အမည်းရောင် စက်ဝိုင်း သေးသေးပါ။
      [[mark:after-coaster]] ဘာမှ မပြောင်းပါဘူး။ default အားဖြင့် mask အလွှာတွေကို ပေါင်းလိုက်တာ
      ဖြစ်ပြီး၊ ပထမ အလွှာကပဲ အကုန် ဖုံးထားပြီးသား ဖြစ်လို့ပါ။ [[mark:type-exclude]] mask composite က
      အလွှာတွေကို ဘယ်လို ပေါင်းမလဲ ဆုံးဖြတ်ပါတယ်။ exclude က အလွှာ တစ်ခုတည်း ဖုံးထားတဲ့ နေရာတွေကိုပဲ
      ချန်ထားပါတယ်။ [[mark:after-exclude]] အလွှာ နှစ်ခုလုံး ဖုံးထားတဲ့ အလယ်က ပေါက်သွားပြီး၊
      အပေါက်ထဲကနေ အစိမ်းရောင် စားပွဲကို မြင်ရပါပြီ။ [[mark:explain-composite]] ပထမ အလွှာထဲက ဒုတိယကို
      နုတ်ပစ်တဲ့ subtract နဲ့လည်း အပေါက် အတူတူ ရပါတယ်။ intersect ကတော့ ထပ်နေတဲ့ နေရာကိုပဲ
      ချန်ထားပါတယ်။ [[mark:explain-shorthand]] ဒီ mask shorthand ကို ကြည့်ပါ။ အလွှာ တစ်ခုစီမှာ mask
      size၊ mask position နဲ့ mask repeat လည်း ရှိပြီး၊ lesson 33 က background property တွေလိုပဲ
      အလုပ်လုပ်ပါတယ်။ default မှာ mask ပုံက ဘယ်ဘက် အပေါ်ထောင့်က စပြီး ထပ်ခါ စီလို့၊ ပုံ သေးရင်
      အကွက်လိုက် ဖြစ်ပါတယ်။ [[mark:explain-reset]] ဒီ mask composite ကို ကြည့်ပါ။ shorthand က မရေးတဲ့
      တန်ဖိုးကို default ပြန်ထားလို့၊ သူ့နောက်မှာ ရေးရပါတယ်။ [[mark:explain-lists]] mask property
      တိုင်းက background တွေလိုပဲ comma စာရင်းကို ယူပြီး၊ အလွှာတွေနဲ့ အစဉ်လိုက် တွဲပါတယ်။ mask clip
      နဲ့ mask origin ကတော့ mask က ဘယ် box ကို ဖုံးမလဲ၊ ဘယ်ကနေ စမလဲ ဆိုတာ ရွေးပြီး၊ နှစ်ခုလုံးရဲ့
      default က border box ပါ။
    sources:
      - title: "web.dev Learn CSS — Additional masking properties"
        url: "https://web.dev/learn/css/paths-shapes-clipping-masking#additional_masking_properties"
      - title: "web.dev Learn CSS — The mask shorthand"
        url: "https://web.dev/learn/css/paths-shapes-clipping-masking#the_mask_shorthand"
      - title: "MDN — mask-composite (add, subtract, intersect, exclude)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/mask-composite"
      - title: "MDN — mask (shorthand; omitted values reset)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/mask"
      - title: "MDN — mask-repeat (initial repeat)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/mask-repeat"
      - title: "MDN — mask-origin (initial border-box)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/mask-origin"
      - title: "MDN — mask-clip (initial border-box)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/mask-clip"
      - title: "CSS Masking Module Level 1 — layering mask images"
        url: "https://drafts.csswg.org/css-masking-1/#the-mask-composite"
    actions:
      - id: close-masks
        type: whiteboard.apply
        at: { mark: close-masks }
        open: false
      # line-by-line: the comma-ended first layer keeps the list invalid until
      # the second layer lands, and every revealed line is balanced.
      - id: type-coaster
        type: editor.type
        at: { mark: type-coaster }
        cadence: line-by-line
        target:
          {
            file: styles.css,
            after: "  mask-image: linear-gradient(black 60%, transparent);\n}\n",
            occurrence: 1,
          }
        text: "\n.coaster {\n  mask:\n    linear-gradient(black 0 0),\n    radial-gradient(circle 30px, black 98%, transparent);\n}\n"
      - id: expect-coaster
        type: expect.preview
        at: { mark: after-coaster }
        timeoutMs: 4000
        target: { by: testId, value: coaster }
        attribute: { name: aria-label, value: "ခွက်ခံ" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-exclude
        type: editor.type
        at: { mark: type-exclude }
        cadence: fast-explainer
        target:
          {
            file: styles.css,
            after: "    radial-gradient(circle 30px, black 98%, transparent);\n",
            occurrence: 1,
          }
        text: "  mask-composite: exclude;\n"
      - id: expect-exclude
        type: expect.preview
        at: { mark: after-exclude }
        timeoutMs: 4000
        target: { by: testId, value: table }
        attribute: { name: class, value: "table" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-shorthand
        type: editor.select
        at: { mark: explain-shorthand }
        target:
          {
            file: styles.css,
            text: "  mask:\n    linear-gradient(black 0 0),\n    radial-gradient(circle 30px, black 98%, transparent);\n",
            occurrence: 1,
          }
      - id: select-composite
        type: editor.select
        at: { mark: explain-reset }
        target: { file: styles.css, text: "mask-composite: exclude;", occurrence: 1 }

  - id: offset-path
    chapter: "Offset path နဲ့ သွားမယ့် လမ်း"
    narration: >
      [[mark:type-path]] ပုံသဏ္ဌာန် သုံးတဲ့ နောက်ဆုံး နေရာက offset path ပါ။ rule အသစ်နဲ့ အစက်လေးကို 80
      pixel ရှိတဲ့ circle ကို လမ်း အဖြစ် ပေးပါမယ်။ [[mark:after-path]] အစက်လေးက မျဉ်းပြတ်
      စက်ဝိုင်းပေါ် ခုန်တက်သွားပါပြီ။ circle ရဲ့ အလယ်က အစက်ကို ထည့်ထားတဲ့ box ရဲ့ အလယ်ပါ။
      [[mark:type-d0]] offset distance က element ဟာ လမ်းပေါ်မှာ ဘယ်လောက် ရောက်နေလဲ ပြောပြီး၊ သုည
      ရာခိုင်နှုန်းက လမ်းရဲ့ အစပါ။ [[mark:type-d25]] နောက်တစ်ကြောင်းက 25 ရာခိုင်နှုန်း၊ လေးပုံ
      တစ်ပုံပါ။ အစက်ကို ကြည့်ပါ။ [[mark:after-d25]] အစက်က လေးပုံ တစ်ပုံ ရွေ့သွားပါပြီ။
      [[mark:type-d50]] 50 ရာခိုင်နှုန်းက တစ်ဝက် ဖြစ်လို့၊ စက်ဝိုင်းရဲ့ တစ်ဖက်ခြမ်းကို ရောက်ပါတယ်။
      [[mark:type-d75]] 75 ရာခိုင်နှုန်းကတော့ လမ်းရဲ့ လေးပုံ သုံးပုံအထိ ပတ်သွားတာ ဖြစ်ပါတယ်။
      [[mark:after-d75]] အစက်လေးက တစ်ဆင့်ချင်း လမ်းကို ပတ်သွားပါပြီ။ [[mark:explain-animate]] offset
      distance ကို သုညကနေ 100 ရာခိုင်နှုန်းအထိ animate လုပ်ရင် အစက်က တစ်ပတ်လုံး ပတ်သွားပါတယ်။ animation ကို lesson 38 နဲ့ 39 မှာ ကြည့်ပါမယ်။
      [[mark:explain-ray]] offset path က ray ကိုလည်း ယူပါတယ်။ ray က အမှတ် တစ်ခုကနေ ကိုယ်ပေးတဲ့ ဒီဂရီ ဘက်ကို ထွက်သွားတဲ့ မျဉ်းဖြောင့်ပါ။ [[mark:explain-morph]] clip path ကိုလည်း animate လုပ်လို့ ရပေမယ့်၊
      function တူတဲ့ ပုံသဏ္ဌာန်တွေကြားမှာပဲ ရပြီး၊ polygon ဆိုရင် အမှတ် အရေအတွက် တူရပါမယ်။ မတူရင်
      ပုံသဏ္ဌာန်က ဖြည်းဖြည်း မပြောင်းဘဲ ခုန်ပြောင်းသွားပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Animating with offset-path"
        url: "https://web.dev/learn/css/paths-shapes-clipping-masking#animating_with_offset-path"
      - title: "web.dev Learn CSS — Animating clip-path"
        url: "https://web.dev/learn/css/paths-shapes-clipping-masking#animating_clip-path"
      - title: "MDN — offset-path"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/offset-path"
      - title: "MDN — offset-distance"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/offset-distance"
      - title: "MDN — ray()"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/ray"
      - title: "CSS Motion Path Module Level 1"
        url: "https://drafts.csswg.org/motion-1/#offset-path-property"
    actions:
      - id: type-path
        type: editor.type
        at: { mark: type-path }
        cadence: fast-explainer
        target: { file: styles.css, after: "  mask-composite: exclude;\n}\n", occurrence: 1 }
        text: "\n.leaf-dot {\n  offset-path: circle(80px);\n}\n"
      - id: expect-path
        type: expect.preview
        at: { mark: after-path }
        timeoutMs: 4000
        target: { by: testId, value: leaf-dot }
        attribute: { name: aria-hidden, value: "true" }
