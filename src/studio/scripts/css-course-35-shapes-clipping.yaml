  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:open-quiz]] မပြီးခင် မေးခွန်း သုံးခု မေးကြည့်ရအောင်။ clip path က box ကို သေးသွားစေသလား။
      [[mark:quiz-1]] မသေးပါဘူး။ မြင်ရတဲ့ အပိုင်းကိုပဲ ပြောင်းပြီး၊ box နဲ့ layout က အတူတူပဲ
      ကျန်ပါတယ်။ [[mark:ask-quiz-2]] path က ရာခိုင်နှုန်း ယူလို့ ရလား။ [[mark:quiz-2]] မရပါဘူး၊ pixel
      ပဲ ရပါတယ်။ ပုံသဏ္ဌာန်က box ကို လိုက်စေချင်ရင် polygon ဒါမှမဟုတ် shape ဆိုတဲ့ function ကို သုံးပါ။
      [[mark:ask-quiz-3]] mask အဖြစ် ဘာ သုံးနိုင်လဲ။ [[mark:quiz-3]] ပုံ၊ gradient ဒါမှမဟုတ် SVG mask
      element ပါ။ circle လို shape function ကိုတော့ mask အဖြစ် သုံးလို့ မရပါဘူး။ [[mark:recap]] ဒါဆို
      ပြန်ချုပ်ရရင်၊ shape function က box ထဲမှာ ပုံသဏ္ဌာန် တစ်ခုကို ဖော်ပြပါတယ်။ clip path က အဲဒီ
      အထဲကိုပဲ ဆွဲပြီး၊ shape outside က စာကို သူ့ ပတ်လည်မှာ စီးစေပါတယ်။ offset path ကတော့ သူ့ကို လမ်း
      ဖြစ်စေပါတယ်။ mask က ပုံကို သုံးလို့ မှိန်အောင်ပါ လုပ်နိုင်ပါတယ်။ [[mark:next-lesson]] clip path နဲ့ mask က box ရဲ့ ဘယ် pixel တွေကို မြင်ရမလဲ ဆုံးဖြတ်တာပါ။ နောက် lesson မှာတော့ ဝါးအောင်၊
      လင်းအောင် လုပ်တဲ့ filter တွေနဲ့ pixel တွေကိုယ်တိုင်ကို ပြောင်းကြည့်ပါမယ်။
    sources:
      - title: "web.dev Learn CSS — Paths, shapes, clipping, and masking: check your understanding"
        url: "https://web.dev/learn/css/paths-shapes-clipping-masking#check_your_understanding"
      - title: "web.dev Learn CSS — Filters (next lesson)"
        url: "https://web.dev/learn/css/filters"
    actions:
      - id: open-quiz
        type: whiteboard.apply
        at: { mark: open-quiz }
        open: true
        clear: true
        upsertIds: [e-title, e-q1]
      - id: draw-quiz-1
        type: whiteboard.apply
        at: { mark: quiz-1 }
        upsertIds: [e-a1]
        drawMs: 1400
      - id: draw-ask-quiz-2
        type: whiteboard.apply
        at: { mark: ask-quiz-2 }
        upsertIds: [e-q2]
        drawMs: 1200
      - id: draw-quiz-2
        type: whiteboard.apply
        at: { mark: quiz-2 }
        upsertIds: [e-a2]
        drawMs: 1200
      - id: draw-ask-quiz-3
        type: whiteboard.apply
        at: { mark: ask-quiz-3 }
        upsertIds: [e-q3]
        drawMs: 1200
      - id: draw-quiz-3
        type: whiteboard.apply
