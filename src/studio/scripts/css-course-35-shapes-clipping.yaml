# CSS course (Burmese), lesson 35 of 43: paths, shapes, clipping and masking.
#
# Narration is Burmese (voice-script.md next to this file is its source;
# DESIGN.md is the span-by-span brief). Every [[mark:…]] sits where its
# action begins, at a sentence end or right after a ၊ pause.
# Everything the learner sees (title, chapters, whiteboard labels, UI strings)
# is Burmese already.
#
# Shape: board (recall lesson 34; clip path cuts a box along a shape; four
# shape functions; three places they are used; masks later) → code tour
# (hero, three photo stand-ins in dashed outlines, today's special with a
# gold square and a price label, the teapot floated beside a long story, a
# coaster on a green table, a leaf dot beside a dashed track) → circle(50%),
# then a smaller circle moved with at → ellipse with two radii at the top edge
# (a bowl) → inset crop (the neighbour and the outline stay put), then round →
# board (polygon points) → an arrow price tag and a slanted hero (line by line)
# → a self-crossing star, then evenodd → board (trig, path, shape, reference
# boxes, SVG clipPath) → the teapot clipped round (text still wraps the
# square), then shape outside, then shape margin → a mask fades the story →
# board (clip vs mask, alpha vs luminance, SVG mask type) → a two-layer mask on
# the coaster, then mask composite exclude (a hole) → offset path on the leaf
# dot, offset distance 0 / 25 / 50 / 75 percent → quiz + recap, hand-off to
# filters (lesson 36).
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set(; no postcss config; no reload.
# An unclosed "(" swallows the rest of the stylesheet, so every keystroke edit
# that contains "(" lands in the LAST rule of the file at that moment; the
# polygon rules and the coaster's two-layer mask are line-by-line (every
# revealed line has balanced parentheses); evenodd is one block insert. Until
# a typed declaration is complete it is invalid and the previous declaration
# in the same rule keeps painting.
#
# Measured in headless Chrome at 432 × 720 (probe/stages.ts, same anchors):
# hero 16–156, round photo 160 × 160 at y 172, bowl 200 × 110, banner 280 × 100
# at y 348 beside a 104 × 100 neighbour, today's special card 502–611 (gold
# square 48 × 48, price label 121 × 33 at y 566), about 623–1035 (teapot
# 180 × 180 floated at y 661), coaster table and orbit 1046–1226, document
# 1276 tall: scroll 0 shows the hero to the card, scroll to the end (556)
# shows the about section, the coaster and the orbit. Typing changes no box
# size (clipping, masks, shape outside and offset path never move a box).
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
