build:
  voiceProfile: pocket-alba-v1
  seed: 33

runtime:
  kind: rust-playground
  defaultMode: fixture
  fixture:
    latencyMs: 600
    result:
      status: success
      stdout: "Movie night\nfour tickets: 48\nadult: 12, baby: 0\n"
      stderr: ""

scenes:
  - id: anatomy
    chapter: What a function is made of
    narration: >
      [[mark:board]] You've already written one function: main, where every
      Rust program starts. Now let's write our own.
      [[mark:draw-name]] A function starts with f n, short for function, then
      its name. In Rust,
      function names use snake case: lowercase words, joined by underscores.
      If you use capital letters instead, the compiler warns you and suggests
      the snake case name. [[mark:draw-params]] Next come the parameters, in
      parentheses. Each one has a name and a type, and you must write the
      type. [[mark:draw-return]] After the arrow comes the return type. That's
      the type of the value it gives back.
      [[mark:draw-body]] Then the body, in curly braces. Its last expression
      has no semicolon, and that's the value the function returns.
      [[mark:draw-why]] So why all these types? The signature is a promise.
      Rust checks every call, and the body, against it. Because every
      signature lists its types, Rust can work out the types inside the body,
      so you rarely need type annotations there. And when something's wrong,
      the error can point at the exact place.
    sources:
      - title: "The Rust Book — Functions"
        url: "https://doc.rust-lang.org/book/ch03-03-how-functions-work.html"
      - title: "The Rust Book — Parameters"
        url: "https://doc.rust-lang.org/book/ch03-03-how-functions-work.html#parameters"
      - title: "The Rust Reference — Functions"
        url: "https://doc.rust-lang.org/reference/items/functions.html"
      - title: "The rustc book — the non_snake_case lint"
        url: "https://doc.rust-lang.org/rustc/lints/listing/warn-by-default.html#non-snake-case"
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { mark: board }
        open: true
        upsertIds: [fn1-title]
      - id: draw-name
        type: whiteboard.apply
        at: { mark: draw-name }
        upsertIds: [fn1-fn, fn1-name, fn1-name-ul, fn1-name-l1, fn1-name-l2]
        drawMs: 1800
      - id: draw-params
        type: whiteboard.apply
        at: { mark: draw-params }
        upsertIds: [fn1-params, fn1-params-ul, fn1-params-l1, fn1-params-l2]
        drawMs: 1800
      - id: draw-return
        type: whiteboard.apply
        at: { mark: draw-return }
        upsertIds: [fn1-ret, fn1-ret-ul, fn1-ret-l, fn1-open]
        drawMs: 1400
      - id: draw-body
        type: whiteboard.apply
        at: { mark: draw-body }
        upsertIds: [fn1-body, fn1-close, fn1-body-circle, fn1-body-l1, fn1-body-l2]
        drawMs: 2200
      - id: draw-why
        type: whiteboard.apply
        at: { mark: draw-why }
        upsertIds: [fn1-why]
        drawMs: 1400

  - id: write-total
    chapter: Writing and calling a function
    narration: >
      Let's build one. [[mark:open-main]] Here's main, printing one line.
      [[mark:type-total]] We'll add total_cost below it. In Rust, a function
      can come before or after the code that calls it.
      [[mark:select-params]] It takes a price and a count, and both are u32.
      [[mark:select-tail]] The body is one expression, price times count, with
      no semicolon. So that's the value total_cost returns, with no return
      keyword. Why does that work? A block in curly braces is an
      expression too, and its value is its last expression. A function's body
      is a block.
    sources:
      - title: "The Rust Book — Functions with Return Values"
        url: "https://doc.rust-lang.org/book/ch03-03-how-functions-work.html#functions-with-return-values"
      - title: "The Rust Book — Statements and Expressions"
        url: "https://doc.rust-lang.org/book/ch03-03-how-functions-work.html#statements-and-expressions"
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: main.rs
      - id: type-total
        type: editor.type
        at: { mark: type-total, offsetMs: -400 }
        target:
          file: main.rs
          after: "    println!(\"Movie night\");\n}\n"
          occurrence: 1
        cadence: line-by-line
        text: "\nfn total_cost(price: u32, count: u32) -> u32 {\n    price * count\n}\n"
      - id: select-params
        type: editor.select
        at: { mark: select-params }
        target:
          file: main.rs
          text: "price: u32, count: u32"
          occurrence: 1
      - id: select-tail
        type: editor.select
        at: { mark: select-tail }
        target:
          file: main.rs
          text: "price * count"
          occurrence: 1

  - id: call-total
    narration: >
      [[mark:type-call]] Let's call it from main, for four tickets at twelve
      each. Rust reads the signature, so it knows twelve and four are
      u32 values. [[mark:select-call]] The call is an expression. It produces
      a value: forty-eight. [[mark:select-let]] The whole let line is a
      statement. It does a job, storing that value in total, but it doesn't
      produce a value itself.
    sources:
      - title: "The Rust Book — Statements and Expressions"
        url: "https://doc.rust-lang.org/book/ch03-03-how-functions-work.html#statements-and-expressions"
    actions:
      - id: type-call
        type: editor.type
        at: { mark: type-call, offsetMs: -400 }
        target:
          file: main.rs
          after: "    println!(\"Movie night\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "    let total = total_cost(12, 4);\n    println!(\"four tickets: {total}\");\n"
      - id: select-call
        type: editor.select
        at: { mark: select-call }
        target:
          file: main.rs
          text: "total_cost(12, 4)"
          occurrence: 1
      - id: select-let
        type: editor.select
        at: { mark: select-let }
        target:
          file: main.rs
          text: "let total = total_cost(12, 4);"
          occurrence: 1

  - id: semicolon
    chapter: Statements and expressions
    narration: >
      [[mark:board-two]] That difference matters most at the end of a
      function. [[mark:draw-expr]] Here, price times count is an expression.
      It gives back a u32. [[mark:draw-stmt]] Add a semicolon, and it becomes
      a statement, which gives back no value. Rust's type for no value is the
      unit type, written as empty parentheses. A function with no arrow, like
      main, returns unit too.
      [[mark:draw-error]] So with that semicolon, total_cost promises a u32
      but returns unit. The compiler stops with error E0308, mismatched types:
      expected u32, found unit. [[mark:draw-help]] And it tells you the fix.
      Remove this semicolon to return this value.
      [[mark:close-board-two]] Our total_cost has no semicolon, so it
      compiles.
    sources:
      - title: "The Rust Book — Statements and Expressions"
        url: "https://doc.rust-lang.org/book/ch03-03-how-functions-work.html#statements-and-expressions"
      - title: "Rust error codes — E0308"
        url: "https://doc.rust-lang.org/error_codes/E0308.html"
      - title: "std — The unit type ()"
        url: "https://doc.rust-lang.org/std/primitive.unit.html"
      - title: "The Rust Reference — Functions"
        url: "https://doc.rust-lang.org/reference/items/functions.html"
    actions:
      - id: open-board-two
        type: whiteboard.apply
        at: { mark: board-two }
        open: true
        clear: true
        upsertIds: [fn2-title]
      - id: draw-expr
        type: whiteboard.apply
        at: { mark: draw-expr }
        upsertIds: [fn2-expr-label, fn2-expr-code, fn2-expr-arrow, fn2-expr-result]
        drawMs: 1800
      - id: draw-stmt
        type: whiteboard.apply
        at: { mark: draw-stmt }
        upsertIds: [fn2-stmt-label, fn2-stmt-code, fn2-semi-circle, fn2-stmt-arrow, fn2-stmt-result]
        drawMs: 2400
      - id: draw-error
        type: whiteboard.apply
        at: { mark: draw-error }
        upsertIds: [fn2-err-1, fn2-err-2]
        drawMs: 1800
      - id: draw-help
        type: whiteboard.apply
        at: { mark: draw-help }
        upsertIds: [fn2-help]
        drawMs: 1400
      - id: close-board-two
        type: whiteboard.apply
        at: { mark: close-board-two }
        open: false

  - id: early-return
    chapter: Leaving early with return
    narration: >
      [[mark:type-ticket]] Sometimes a function knows its answer early. Our
      new ticket_price function gives a ticket's price for an age. The
      if runs its block only when its condition is true. You'll learn if fully
      in the next lesson. [[mark:select-return]] Here, return gives back zero
      and leaves the function immediately. So a ticket for a child under three
      is free, and the rest of the function doesn't run. Its semicolon is fine,
      because return doesn't need to be last.
      [[mark:select-twelve]] Everyone else reaches the end, where twelve is
      the last expression. That's the usual style. Use return to leave early,
      and let the last expression give the normal answer.
      [[mark:type-ticket-calls]] Let's get the price for an adult and a baby,
      and print both.
    sources:
      - title: "The Rust Book — Functions with Return Values"
        url: "https://doc.rust-lang.org/book/ch03-03-how-functions-work.html#functions-with-return-values"
      - title: "The Rust Reference — return expressions"
        url: "https://doc.rust-lang.org/reference/expressions/return-expr.html"
      - title: "The Rust Book — if Expressions"
        url: "https://doc.rust-lang.org/book/ch03-05-control-flow.html#if-expressions"
    actions:
      - id: type-ticket
        type: editor.type
        at: { mark: type-ticket, offsetMs: -400 }
        target:
          file: main.rs
          after: "    price * count\n}\n"
          occurrence: 1
        cadence: line-by-line
        text: "\nfn ticket_price(age: u32) -> u32 {\n    if age < 3 {\n        return 0;\n    }\n    12\n}\n"
      - id: select-return
        type: editor.select
        at: { mark: select-return }
        target:
          file: main.rs
          text: "return 0;"
          occurrence: 1
      - id: select-twelve
        type: editor.select
        at: { mark: select-twelve }
        target:
          file: main.rs
          text: "12"
          occurrence: 2
      - id: type-ticket-calls
        type: editor.type
        at: { mark: type-ticket-calls, offsetMs: -400 }
        target:
          file: main.rs
          after: "    println!(\"four tickets: {total}\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "    let adult = ticket_price(30);\n    let baby = ticket_price(1);\n    println!(\"adult: {adult}, baby: {baby}\");\n"

  - id: run
    narration: >
      [[mark:run]] Let's run it. Movie night, then forty-eight for four
      tickets: price times count. An adult pays twelve, from the last
      expression of ticket_price. And the baby pays zero, from the
      early return.
    sources:
      - title: "Rust by Example — Functions"
        url: "https://doc.rust-lang.org/rust-by-example/fn.html"
    actions:
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "adult: 12, baby: 0"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: "fn ticket_price(age: u32) -> u32 {"

  - id: wrap
    narration: >
      So a function names its inputs with their types, and promises the type
      it returns. The last expression, without a semicolon, is the value it
      gives back, and return leaves early. Next, you'll make decisions and
      repeat work with control flow: if, loop, while, and for.
    sources:
      - title: "The Rust Book — Control Flow"
        url: "https://doc.rust-lang.org/book/ch03-05-control-flow.html"
    actions: []

checks:
  - { type: timing.p95Ms, max: 300 }
