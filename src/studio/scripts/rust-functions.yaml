# Rust from zero, lesson 4: functions. The anatomy of a signature (drawn in:
# snake_case name, typed parameters, return type, the tail expression), then
# total_cost built and called live (statement vs expression pointed at in the
# code), the E0308 "remove this semicolon" error on the board (broken code
# cannot run in an insert-only lesson; message confirmed with rustc 1.98,
# edition 2024), and an early `return` in ticket_price. One run at the end.
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/rust-functions.yaml
