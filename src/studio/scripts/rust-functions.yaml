    pocket-alba-v1
  seed: 33

runtime:
  kind: rust-playground
  defaultMode: fixture
  fixture:
    latencyMs: 600
    result:
      status: success
      stdout: "Movie night

        four tickets: 48

        adult: 12, baby: 0\n"
      stderr: ""

scenes:
  - id: anatomy
    chapter: Function ရဲ့ အစိတ်အပိုင်းတွေ
    narration: >-
      [[mark:board]] ဒီ lesson မှာ function တွေအကြောင်း လေ့လာမှာ ဖြစ်လို့၊ function တစ်ခုမှာ ဘာတွေ
      ပါလဲ ဆိုတာကနေ စကြည့်ရအောင်။ တကယ်တော့ function တစ်ခုကို ကိုယ်တိုင် ရေးဖူးပြီးသားပါ။ အဲဒါက main
      function ပါ၊ Rust program တိုင်းဟာ main ကနေ စတာပါ။ အခုတော့ ကိုယ်ပိုင် function တွေကို
      ရေးကြည့်ရအောင်။ [[mark:draw-name]] function တစ်ခုကို f n နဲ့ စရေးပါတယ်။ f n ဆိုတာ function ရဲ့
      အတိုကောက်ပါ။ သူ့နောက်မှာ function ရဲ့ နာမည် လာပါတယ်။ Rust မှာ function နာမည်တွေကို snake case
      နဲ့ ပေးပါတယ်။ ဆိုလိုတာက စာလုံးသေးတွေချည်း သုံးပြီး၊ စကားလုံး တစ်လုံးနဲ့ တစ်လုံးကြားကို
      underscore နဲ့ ဆက်ပေးတာပါ။ စာလုံးကြီးတွေ သုံးမိရင်တော့ compiler က warning ပေးပြီး၊ snake case
      နာမည်ကို အကြံပြုပေးပါလိမ့်မယ်။ [[mark:draw-params]] နာမည် နောက်မှာ parameter တွေ လာပြီး၊
      ကွင်းထဲမှာ ရေးပါတယ်။ parameter တစ်ခုစီမှာ နာမည် တစ်ခုနဲ့ type တစ်ခု ပါပြီး၊ type ကိုတော့
      မရေးဘဲ ထားလို့ မရပါဘူး၊ ကိုယ်တိုင် ရေးပေးရပါတယ်။ [[mark:draw-return]] ကွင်း ပိတ်ပြီးတဲ့
      နောက်မှာ arrow တစ်ခု ရှိပြီး၊ arrow နောက်မှာ return type လာပါတယ်။ return type ဆိုတာ ဒီ
      function က ပြန်ပေးမယ့် တန်ဖိုးရဲ့ type ပါ။ [[mark:draw-body]] နောက်ဆုံးကတော့ body ပါ။ body ကို
      တွန့်ကွင်းထဲမှာ ရေးပြီး၊ body ရဲ့ နောက်ဆုံး expression မှာ semicolon မပါတာကို သတိထား ကြည့်ပါ။
      အဲဒီ နောက်ဆုံး expression ရဲ့ တန်ဖိုးကပဲ function က ပြန်ပေးတဲ့ တန်ဖိုး ဖြစ်ပါတယ်။
      [[mark:draw-why]] ဒါဆို type တွေကို ဘာကြောင့် ဒီလောက် ရေးနေရတာလဲ။ signature ဆိုတာ ကတိ တစ်ခုပါ။
      ဒီ function ကို ခေါ်တဲ့ နေရာတိုင်းကိုရော၊ function ရဲ့ body ကိုပါ Rust က အဲဒီ ကတိနဲ့
      တိုက်စစ်ပါတယ်။ signature တိုင်းမှာ type တွေ အပြည့်အစုံ ရေးထားတဲ့အတွက်၊ body ထဲက type တွေကို
      Rust က ကိုယ့်အစား တွက်ထုတ်နိုင်ပြီး၊ body ထဲမှာ type annotation ရေးစရာ သိပ် မလိုတော့ပါဘူး။
      ပြီးတော့ တစ်ခုခု မှားနေရင်လည်း error က မှားတဲ့ နေရာ အတိအကျကို ထောက်ပြနိုင်ပါတယ်။
    sources:
      - title: "The Rust Book — Functions"
        url: "https://doc.rust-lang.org/book/ch03-03-how-functions-work.html"
      - title: "The Rust Book — Parameters"
        url: "https://doc.rust-lang.org/book/ch03-03-how-functions-work.html#parameters"
      - title: "The Rust Reference — Functions"
        url: "https://doc.rust-lang.org/reference/items/functions.html"
      - title: "The rustc book — the non_snake_case lint"
        url: "https://doc.rust-lang.org/rustc/lints/listing/warn-by-default.html#non-snake-case"
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { mark: board }
        open: true
        upsertIds: [fn1-title]
      - id: draw-name
        type: whiteboard.apply
        at: { mark: draw-name }
        upsertIds: [fn1-fn, fn1-name, fn1-name-ul, fn1-name-l1, fn1-name-l2]
        drawMs: 1800
      - id: draw-params
        type: whiteboard.apply
        at: { mark: draw-params }
        upsertIds: [fn1-params, fn1-params-ul, fn1-params-l1, fn1-params-l2]
        drawMs: 1800
      - id: draw-return
        type: whiteboard.apply
        at: { mark: draw-return }
        upsertIds: [fn1-ret, fn1-ret-ul, fn1-ret-l, fn1-open]
        drawMs: 1400
      - id: draw-body
        type: whiteboard.apply
        at: { mark: draw-body }
        upsertIds: [fn1-body, fn1-close, fn1-body-circle, fn1-body-l1, fn1-body-l2]
        drawMs: 2200
      - id: draw-why
        type: whiteboard.apply
        at: { mark: draw-why }
        upsertIds: [fn1-why]
        drawMs: 1400

  - id: write-total
    chapter: Function ရေးပြီး ခေါ်ခြင်း
    narration: >-
      ကဲ၊ တကယ် ရေးကြည့်ရအောင်။ [[mark:open-main]] ဒီမှာ main ရှိပါတယ်၊ စာကြောင်း တစ်ကြောင်းပဲ print
      ထုတ်နေပါတယ်။ [[mark:type-total]] သူ့အောက်မှာ total cost ဆိုတဲ့ function ကို ထည့်ပါမယ်။ Rust
      မှာ function တစ်ခုကို သူ့ကို ခေါ်တဲ့ code ရဲ့ အရှေ့မှာ ရေးရေး၊ အနောက်မှာ ရေးရေး ရပါတယ်။
      [[mark:select-params]] ဒီ function က price နဲ့ count ဆိုတဲ့ parameter နှစ်ခု လက်ခံပြီး၊
      နှစ်ခုလုံးက u32 ပါ။ [[mark:select-tail]] body ထဲမှာကတော့ expression တစ်ခုတည်းပဲ ရှိပါတယ်၊
      price နဲ့ count ကို မြှောက်တာပါ၊ semicolon မပါပါဘူး။ ဒါကြောင့် ဒီ တန်ဖိုးကပဲ total cost က
      ပြန်ပေးတဲ့ တန်ဖိုး ဖြစ်သွားပြီး၊ return keyword တောင် ရေးစရာ မလိုပါဘူး။ ဘာကြောင့် ဒီလို
      ရတာလဲဆိုတော့၊ တွန့်ကွင်းထဲက block တစ်ခုဟာ သူ့ဘာသာ expression တစ်ခု ဖြစ်ပြီး၊ block ရဲ့
      တန်ဖိုးဆိုတာ သူ့ထဲက နောက်ဆုံး expression ရဲ့ တန်ဖိုးပဲ ဖြစ်လို့ပါ။ function ရဲ့ body ကလည်း
      block တစ်ခုပါပဲ။
    sources:
      - title: "The Rust Book — Functions with Return Values"
        url: "https://doc.rust-lang.org/book/ch03-03-how-functions-work.html#functions-with-return-values"
      - title: "The Rust Book — Statements and Expressions"
        url: "https://doc.rust-lang.org/book/ch03-03-how-functions-work.html#statements-and-expressions"
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: main.rs
      - id: type-total
        type: editor.type
        at: { mark: type-total, offsetMs: -400 }
        target:
          file: main.rs
          after: "    println!(\"Movie night\");\n}\n"
          occurrence: 1
        cadence: line-by-line
        text: "

          fn total_cost(price: u32, count: u32) -> u32 {

          \    price * count

          }\n"
      - id: select-params
        type: editor.select
        at: { mark: select-params }
        target:
          file: main.rs
          text: "price: u32, count: u32"
          occurrence: 1
      - id: select-tail
        type: editor.select
        at: { mark: select-tail }
        target:
          file: main.rs
          text: "price * count"
          occurrence: 1

  - id: call-total
    narration: >-
      [[mark:type-call]] အခု main ထဲကနေ ဒီ function ကို ခေါ်ကြည့်ရအောင်။ လက်မှတ် တစ်စောင်ကို 12
      နှုန်းနဲ့၊ လေးစောင်အတွက် ဆိုပါစို့။ Rust က signature ကို ဖတ်ထားတဲ့အတွက်၊ 12 နဲ့ 4 ဟာ u32
      တန်ဖိုးတွေ ဖြစ်တယ်ဆိုတာ သူ့ဘာသာ သိပါတယ်။ [[mark:select-call]] function ကို ခေါ်တဲ့ ဒီ အပိုင်းက
      expression တစ်ခုပါ။ သူက တန်ဖိုး တစ်ခု ထုတ်ပေးပါတယ်၊ အဲဒါက 48 ပါ။ [[mark:select-let]] ဒီ let
      စာကြောင်း တစ်ကြောင်းလုံးကတော့ statement ပါ။ သူက အလုပ် တစ်ခု လုပ်ပေးပါတယ်၊ ဆိုလိုတာက ထွက်လာတဲ့
      တန်ဖိုးကို total ထဲ သိမ်းပေးတာပါ၊ ဒါပေမဲ့ သူ့ကိုယ်တိုင်ကတော့ တန်ဖိုး ဘာမှ ထုတ်မပေးပါဘူး။
    sources:
      - title: "The Rust Book — Statements and Expressions"
        url: "https://doc.rust-lang.org/book/ch03-03-how-functions-work.html#statements-and-expressions"
    actions:
      - id: type-call
        type: editor.type
        at: { mark: type-call, offsetMs: -400 }
        target:
          file: main.rs
          after: "    println!(\"Movie night\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "    let total = total_cost(12, 4);

          \    println!(\"four tickets: {total}\");\n"
      - id: select-call
        type: editor.select
        at: { mark: select-call }
        target:
          file: main.rs
          text: "total_cost(12, 4)"
          occurrence: 1
      - id: select-let
        type: editor.select
        at: { mark: select-let }
        target:
          file: main.rs
          text: "let total = total_cost(12, 4);"
          occurrence: 1

  - id: semicolon
    chapter: Statement နဲ့ expression
    narration: >-
      [[mark:board-two]] expression နဲ့ statement ဆိုတဲ့ ဒီ ကွာခြားချက်ဟာ function တစ်ခုရဲ့ အဆုံးမှာ
      အရေးအကြီးဆုံး ဖြစ်ပါတယ်။ [[mark:draw-expr]] ဒီမှာ price နဲ့ count ကို မြှောက်တာက expression
      တစ်ခုပါ၊ u32 တန်ဖိုး တစ်ခု ပြန်ပေးပါတယ်။ [[mark:draw-stmt]] သူ့နောက်မှာ semicolon တစ်လုံး
      ထည့်လိုက်တာနဲ့ statement ဖြစ်သွားပြီး၊ statement က တန်ဖိုး ဘာမှ ပြန်မပေးတော့ပါဘူး။ တန်ဖိုး
      မရှိတာကို Rust မှာ unit type လို့ ခေါ်ပြီး၊ ကွင်းအလွတ်နဲ့ ရေးပါတယ်။ arrow မပါတဲ့ function တွေ၊
      ဥပမာအားဖြင့် main လိုမျိုးကလည်း unit ကိုပဲ ပြန်ပေးနေတာပါ။ [[mark:draw-error]] ဒါဆို ဒီ
      semicolon တစ်လုံးကြောင့် total cost က u32 ပြန်ပေးမယ်လို့ ကတိပေးထားပေမယ့်၊ တကယ်တမ်း unit ပဲ
      ပြန်ပေးနေတဲ့ သဘော ဖြစ်သွားပါတယ်။ ဒါကြောင့် compiler က E0308 error၊ mismatched types နဲ့
      ရပ်သွားပါတယ်။ ဆိုလိုတာက type မကိုက်ဘူး၊ u32 ကို မျှော်လင့်ထားပေမယ့် unit ကို တွေ့တယ် ဆိုတဲ့
      သဘောပါ။ [[mark:draw-help]] ပြီးတော့ help စာကြောင်းမှာ ပြင်နည်းကိုပါ တန်းပြောထားပါတယ်။ ဒီ
      semicolon ကို ဖြုတ်လိုက်ရင် တန်ဖိုးကို ပြန်ပေးနိုင်ပါပြီတဲ့။ [[mark:close-board-two]] ကိုယ့်
      total cost မှာတော့ semicolon မပါတဲ့အတွက် compile လုပ်လို့ ရပါတယ်။
    sources:
      - title: "The Rust Book — Statements and Expressions"
        url: "https://doc.rust-lang.org/book/ch03-03-how-functions-work.html#statements-and-expressions"
      - title: "Rust error codes — E0308"
        url: "https://doc.rust-lang.org/error_codes/E0308.html"
      - title: "std — The unit type ()"
        url: "https://doc.rust-lang.org/std/primitive.unit.html"
      - title: "The Rust Reference — Functions"
        url: "https://doc.rust-lang.org/reference/items/functions.html"
    actions:
      - id: open-board-two
        type: whiteboard.apply
        at: { mark: board-two }
        open: true
        clear: true
        upsertIds: [fn2-title]
      - id: draw-expr
        type: whiteboard.apply
        at: { mark: draw-expr }
        upsertIds: [fn2-expr-label, fn2-expr-code, fn2-expr-arrow, fn2-expr-result]
        drawMs: 1800
      - id: draw-stmt
        type: whiteboard.apply
        at: { mark: draw-stmt }
        upsertIds: [fn2-stmt-label, fn2-stmt-code, fn2-semi-circle, fn2-stmt-arrow, fn2-stmt-result]
        drawMs: 2400
      - id: draw-error
        type: whiteboard.apply
        at: { mark: draw-error }
        upsertIds: [fn2-err-1, fn2-err-2]
        drawMs: 1800
      - id: draw-help
        type: whiteboard.apply
        at: { mark: draw-help }
        upsertIds: [fn2-help]
        drawMs: 1400
      - id: close-board-two
        type: whiteboard.apply
        at: { mark: close-board-two }
        open: false

  - id: early-return
    chapter: return နဲ့ စောစော ထွက်ခြင်း
    narration: >-
      [[mark:type-ticket]] တစ်ခါတစ်လေ function တစ်ခုက သူ့အဖြေကို စောစော သိနေတတ်ပါတယ်။ အခု ထည့်မယ့်
      ticket price ဆိုတဲ့ function က အသက်ကို ကြည့်ပြီး လက်မှတ် ဈေးကို ပြန်ပေးပါတယ်။ သူ့ထဲမှာ if
      တစ်ခု ပါပြီး၊ if ရဲ့ condition က true ဖြစ်မှသာ တွန့်ကွင်းထဲက code ကို run ပါတယ်။ if အကြောင်း
      အသေးစိတ်ကိုတော့ နောက် lesson မှာ လေ့လာရပါမယ်။ [[mark:select-return]] ဒီနေရာမှာ return က 0 ကို
      ပြန်ပေးပြီး၊ function ထဲကနေ ချက်ချင်း ထွက်သွားပါတယ်။ ဒါကြောင့် အသက် 3 နှစ် အောက် ကလေးအတွက်
      လက်မှတ်က အခမဲ့ ဖြစ်ပြီး၊ function ရဲ့ ကျန်တဲ့ အပိုင်းကို run မလုပ်တော့ပါဘူး။ ဒီ return နောက်က
      semicolon ကတော့ ပြဿနာ မရှိပါဘူး၊ ဘာကြောင့်လဲဆိုတော့ return က နောက်ဆုံးမှာ နေစရာ မလိုလို့ပါ။
      [[mark:select-twelve]] ကျန်တဲ့ သူတွေအတွက်ကတော့ function ရဲ့ အဆုံးထိ ရောက်သွားပြီး၊ အဲဒီမှာ 12
      က နောက်ဆုံး expression ဖြစ်ပါတယ်။ ဒါက Rust မှာ ပုံမှန် ရေးလေ့ရှိတဲ့ ပုံစံပါ။ စောစော
      ထွက်ချင်ရင် return ကို သုံးပြီး၊ ပုံမှန် အဖြေကိုတော့ နောက်ဆုံး expression ကနေ
      ပြန်ပေးခိုင်းပါတယ်။ [[mark:type-ticket-calls]] ကဲ၊ လူကြီး တစ်ယောက်နဲ့ ကလေးငယ် တစ်ယောက်အတွက်
      လက်မှတ် ဈေးကို ယူပြီး၊ နှစ်ခုလုံးကို print ထုတ်ကြည့်ရအောင်။
    sources:
      - title: "The Rust Book — Functions with Return Values"
        url: "https://doc.rust-lang.org/book/ch03-03-how-functions-work.html#functions-with-return-values"
      - title: "The Rust Reference — return expressions"
        url: "https://doc.rust-lang.org/reference/expressions/return-expr.html"
      - title: "The Rust Book — if Expressions"
        url: "https://doc.rust-lang.org/book/ch03-05-control-flow.html#if-expressions"
    actions:
      - id: type-ticket
        type: editor.type
        at: { mark: type-ticket, offsetMs: -400 }
        target:
          file: main.rs
          after: "    price * count\n}\n"
          occurrence: 1
        cadence: line-by-line
        text: "

          fn ticket_price(age: u32) -> u32 {

          \    if age < 3 {

          \        return 0;

          \    }

          \    12

          }\n"
      - id: select-return
        type: editor.select
        at: { mark: select-return }
        target:
          file: main.rs
          text: "return 0;"
          occurrence: 1
      - id: select-twelve
        type: editor.select
        at: { mark: select-twelve }
        target:
          file: main.rs
          text: "12"
          occurrence: 2
      - id: type-ticket-calls
        type: editor.type
        at: { mark: type-ticket-calls, offsetMs: -400 }
        target:
          file: main.rs
          after: "    println!(\"four tickets: {total}\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "    let adult = ticket_price(30);

          \    let baby = ticket_price(1);

          \    println!(\"adult: {adult}, baby: {baby}\");\n"

  - id: run
    narration: >-
      [[mark:run]] ကဲ၊ run ကြည့်ရအောင်။ ပထမ စာကြောင်းက Movie night ဖြစ်ပြီး၊ နောက်တစ်ကြောင်းမှာ
      လက်မှတ် လေးစောင်အတွက် 48 ဆိုတာ price နဲ့ count ကို မြှောက်ထားတဲ့ တန်ဖိုးပါ။ လူကြီးက 12
      ပေးရပါတယ်၊ ဒါက ticket price ရဲ့ နောက်ဆုံး expression ကနေ လာတာပါ။ ကလေးငယ်ကတော့ 0 ပါ၊ ဒါကတော့
      စောစော ထွက်သွားတဲ့ return ကနေ လာတာပါ။
    sources:
      - title: "Rust by Example — Functions"
        url: "https://doc.rust-lang.org/rust-by-example/fn.html"
    actions:
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "adult: 12, baby: 0"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: "fn ticket_price(age: u32) -> u32 {"

  - id: wrap
    narration: >-
      ဒါဆို ပြန်ချုပ်ရရင်၊ function တစ်ခုက သူ့ parameter တွေကို နာမည်ရော type ရော သတ်မှတ်ပေးပြီး၊
      ပြန်ပေးမယ့် type ကိုလည်း ကတိပေးထားပါတယ်။ semicolon မပါတဲ့ နောက်ဆုံး expression က function
      ပြန်ပေးတဲ့ တန်ဖိုး ဖြစ်ပြီး၊ return ကတော့ စောစော ထွက်ဖို့ သုံးပါတယ်။ နောက် lesson မှာတော့
      control flow ကို ကြည့်သွားပါမယ်။ if၊ loop၊ while နဲ့ for တွေနဲ့ ဆုံးဖြတ်ချက် ချတာရော၊
      အလုပ်တွေကို ထပ်ခါထပ်ခါ လုပ်တာရော ရေးကြည့်ပါမယ်။
    sources:
      - title: "The Rust Book — Control Flow"
        url: "https://doc.rust-lang.org/book/ch03-05-control-flow.html"
    actions: []

checks:
  - { type: timing.p95Ms, max: 300 }
