# One idea: a Rust function names typed parameters and a return type, and its
# last expression — with no semicolon — is the value returned (statement vs.
# expression). A whiteboard anatomy sketch, then add + double built and run.
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/rust-functions.yaml
schemaVersion: 1

lesson:
  slug: rust-functions
  title: "Rust functions: the last expression returns"
  locale: en-US
  workspace:
    lessonType: rust
    name: Rust Lesson
    entryFilePath: main.rs
    files:
      main.rs: |
        fn main() {
            let sum = add(2, 3);
            println!("2 + 3 = {sum}");
        }
  # Diagram: a function as a machine — inputs -> [add: a + b] -> output.
  whiteboardAssets:
    - id: ft-title
      kind: text
      x: 300
      y: 165
      width: 780
      height: 44
      text: "A function turns inputs into an output"
      strokeColor: "#1e1e1e"
      fontSize: 34
    - id: ft-inlabel
      kind: text
      x: 330
      y: 262
      width: 140
      height: 30
      text: "inputs"
      strokeColor: "#80868b"
      fontSize: 22
    - id: ft-in
      kind: text
      x: 350
      y: 306
      width: 120
      height: 40
      text: "2, 3"
      strokeColor: "#1e1e1e"
      fontSize: 30
    - id: ft-arrow1
      kind: text
      x: 480
      y: 306
      width: 44
      height: 40
      text: "→"
      strokeColor: "#80868b"
      fontSize: 34
    - id: ft-fnlabel
      kind: text
      x: 560
      y: 262
      width: 200
      height: 30
      text: "fn add"
      strokeColor: "#1971c2"
      fontSize: 22
    - id: ft-fnbox
      kind: rectangle
      x: 540
      y: 288
      width: 220
      height: 84
      strokeColor: "#1971c2"
    - id: ft-fnbody
      kind: text
      x: 604
      y: 314
      width: 160
      height: 40
      text: "a + b"
      strokeColor: "#1e1e1e"
      fontSize: 30
    - id: ft-arrow2
      kind: text
      x: 780
      y: 306
      width: 44
      height: 40
      text: "→"
      strokeColor: "#80868b"
      fontSize: 34
    - id: ft-outlabel
      kind: text
      x: 850
      y: 262
      width: 160
      height: 30
      text: "returns"
      strokeColor: "#2f9e44"
      fontSize: 22
    - id: ft-outbox
      kind: rectangle
      x: 840
      y: 288
      width: 150
      height: 84
      strokeColor: "#2f9e44"
    - id: ft-outval
      kind: text
      x: 902
      y: 314
      width: 80
      height: 40
      text: "5"
      strokeColor: "#2f9e44"
      fontSize: 30
    - id: ft-note
      kind: text
      x: 340
      y: 430
      width: 780
      height: 36
      text: "the last expression — a + b, no semicolon — is returned"
      strokeColor: "#1e1e1e"
      fontSize: 26

build:
  voiceProfile: pocket-alba-v1
  seed: 33

runtime:
  kind: rust-playground
  defaultMode: fixture
  fixture:
    latencyMs: 2000
    result:
      status: success
      stdout: "2 + 3 = 5\ndoubled is 10\n"
      stderr: ""

scenes:
  - id: anatomy
    narration: >
      [[mark:board]] A function is a machine. [[mark:show-in]] Inputs go in —
      two and three. [[mark:show-fn]] Inside, add computes a plus b.
      [[mark:show-out]] Out comes the result — five. That last expression, no
      semicolon, is the return value. [[mark:board-close]] Let's build one.
    sources:
      - title: "The Rust Book — Functions"
        url: "https://doc.rust-lang.org/book/ch03-03-how-functions-work.html"
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { mark: board }
        open: true
        upsertIds: [ft-title]
      - id: show-in
        type: whiteboard.apply
        at: { mark: show-in }
        upsertIds: [ft-inlabel, ft-in]
      - id: show-fn
        type: whiteboard.apply
        at: { mark: show-fn }
        upsertIds: [ft-arrow1, ft-fnlabel, ft-fnbox, ft-fnbody]
      - id: show-out
        type: whiteboard.apply
        at: { mark: show-out }
        upsertIds: [ft-arrow2, ft-outlabel, ft-outbox, ft-outval, ft-note]
      - id: close-board
        type: whiteboard.apply
        at: { mark: board-close }
        open: false

  - id: define-add
    narration: >
      [[mark:open]] main calls add — not written yet. [[mark:type-add]] Write
      it. Two parameters, both i32, returns an i32. The body is one expression,
      a plus b, no semicolon. That sum is what add returns.
    sources:
      - title: "The Rust Book — Function Parameters"
        url: "https://doc.rust-lang.org/book/ch03-03-how-functions-work.html#parameters"
    actions:
      - id: open-main
        type: workspace.openFile
        at: { mark: open }
        path: main.rs
      - id: type-add
        type: editor.type
        at: { mark: type-add, offsetMs: -400 }
        target:
          file: main.rs
          after: "    println!(\"2 + 3 = {sum}\");\n}\n"
          occurrence: 1
        cadence: line-by-line
        text: "\nfn add(a: i32, b: i32) -> i32 {\n    a + b\n}\n"

  - id: statement-vs-expression
    narration: >
      [[mark:type-double]] A function with two lines. double computes n times
      two, binds it to result — semicolon, so that's a statement.
      [[mark:type-call]] Then result alone, no semicolon — that's the return
      value. Back in main, call double and print the result.
    sources:
      - title: "The Rust Book — Statements and Expressions"
        url: "https://doc.rust-lang.org/book/ch03-03-how-functions-work.html#statements-and-expressions"
    actions:
      - id: type-double
        type: editor.type
        at: { mark: type-double, offsetMs: -400 }
        target:
          file: main.rs
          after: "    a + b\n}\n"
          occurrence: 1
        cadence: line-by-line
        text: "\nfn double(n: i32) -> i32 {\n    let result = n * 2;\n    result\n}\n"
      - id: type-call
        type: editor.type
        at: { mark: type-call }
        target:
          file: main.rs
          after: "    println!(\"2 + 3 = {sum}\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "    let doubled = double(sum);\n    println!(\"doubled is {doubled}\");\n"

  - id: run
    narration: >
      [[mark:run]] Run it. Two plus three, five. Double five, ten. Both came
      from a function's final expression. The semicolon is the difference
      between a statement and a value.
    sources:
      - title: "Rust Playground"
        url: "https://play.rust-lang.org/"
    actions:
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 800 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "doubled is 10"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: "fn double(n: i32) -> i32 {"

checks:
  - { type: timing.p95Ms, max: 300 }
