  - id: refund
    chapter: Boundary တစ်ခုက တန်မတန်
    narration: >
      [[mark:r-close]] ဒီ ချိန်ကြည့်ချက်ကိုလည်း မှတ်စုထဲ ထည့်ထားပါမယ်။
      [[mark:type-r1]] volatility မတူတာက တကယ် ရှိတဲ့ အားပါ။ ဒါပေမဲ့ transaction ရဲ့ အလေးချိန်ကိုတော့ အလွန်ကြီးတယ်လို့
      ရေးထားပါတယ်။ ငွေနဲ့ ပတ်သက်တဲ့ စာရင်းမို့ပါ။
      [[mark:type-r2]] ပေါင်းဖို့ ဆွဲတဲ့ နောက်ထပ် အား တစ်ခုလည်း ရှိပါသေးတယ်။ refund တစ်ခု လုပ်ဖို့ Refund service က
      Payment ကို လေးခါ လှမ်းခေါ်ရပါတယ်။ ဒီလောက် ခေါ်နေရတာက နှစ်ခုဟာ တစ်ခုတည်း ဖြစ်သင့်တယ် ဆိုတဲ့ လက္ခဏာ တစ်ခုပါ။
      [[mark:type-rd]] ဒါကြောင့် ပြန်ပေါင်းပြီး၊ refund ကို အထဲမှာ module တစ်ခုအဖြစ် ထားပါမယ်။
      [[mark:sel-check]] အောက်ဆုံးက စစ်ချက်ကတော့ ဆုံးဖြတ်ချက် နှစ်ခုလုံးကို ပြန်စစ်ဖို့ပါ။ boundary တစ်ခုက interface
      သေးသေးလေးနဲ့ အလုပ်အများကြီးကို ဖုံးထားနိုင်မှ တန်ပါတယ်။ interface ဆိုတာ အပိုင်း နှစ်ခုကြား သဘောတူထားတဲ့
      ပုံစံပါ။
      [[mark:check-2]] campaign service ကို ကြည့်ရင်၊ ဒီ message ကို ဒီလူတွေဆီ ပို့ပေးပါ ဆိုတဲ့ တောင်းဆိုချက် တစ်ခုတည်းနောက်မှာ အချိန်ဇယား ဆွဲတာ၊ အရှိန်ထိန်းတာတွေကို ဝှက်ထားပါတယ်။ Refund service ကတော့ Payment ရဲ့ အတွင်းပိုင်း data တွေကို သိနေရတာမို့၊ ဖုံးထားနိုင်တာ မရှိသလောက်ပါပဲ။
    sources:
      - {
          title: "Software Architecture: The Hard Parts (Ford, Richards, Sadalage, Dehghani)",
          url: "https://oreil.ly/sa-the-hard-parts",
        }
      - { title: "Learning Domain-Driven Design (Khononov)", url: "https://oreil.ly/lddd" }
