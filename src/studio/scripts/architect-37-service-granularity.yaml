scenes:
  - id: need
    chapter: တောင်းဆိုချက် နှစ်ခု
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ monolith ကို business အကြောင်းပြချက် ရှိမှ၊ ပြန်လှည့်လို့ရတဲ့ အဆင့်လေးတွေနဲ့
      တစ်ပိုင်းချင်း ခွဲထုတ်ပုံကို လေ့လာခဲ့ပါတယ်။
      [[mark:open-doc]] ခွဲထုတ်ပြီးတဲ့နောက် ပေါ်လာတဲ့ မေးခွန်းကတော့ service တစ်ခုက ဘယ်လောက် သေးသင့်လဲ ဆိုတာပါ။ ဒီအပတ်ထဲမှာ ကိုယ့်ဆီကို တောင်းဆိုချက် နှစ်ခု ရောက်လာပါတယ်။
      [[mark:sel-req1]] ပထမ တစ်ခုက Notification team ဆီကပါ။ SMS၊ email နဲ့ push notification သုံးမျိုးလုံးကို
      ပို့ပေးနေတဲ့ service တစ်ခုတည်းကို သုံးခုအဖြစ် ခွဲချင်တယ်လို့ ဆိုပါတယ်။
      [[mark:sel-req2]] ဒုတိယ တစ်ခုက Payment team ဆီကပါ။ သူတို့ကတော့ ပြောင်းပြန်ပါ။ မနှစ်က သီးခြား ခွဲထုတ်ခဲ့တဲ့
      Refund service ကို Payment ထဲ ပြန်ပေါင်းချင်တယ်လို့ ဆိုပါတယ်။
      [[mark:cto]] CTO ဖြစ်တဲ့ အောင်အောင် ကတော့ team တစ်ခုက ခွဲချင်ပြီး နောက်တစ်ခုက ပေါင်းချင်နေတယ်ဆိုတော့၊ service
      တစ်ခုက ဘယ်လောက် သေးရမယ်ဆိုတဲ့ စည်းမျဉ်း ကိုယ်တို့မှာ ရှိသလားလို့ မေးပါတယ်။
    sources:
      - {
          title: "Software Architecture: The Hard Parts (Ford, Richards, Sadalage, Dehghani)",
          url: "https://oreil.ly/sa-the-hard-parts",
        }
    actions:
      - {
          id: open-notebook,
          type: workspace.openFile,
          at: { mark: open-doc },
          path: notebook/37-granularity.md,
        }
      - id: sel-req1
        type: editor.select
        at: { mark: sel-req1 }
        target:
          {
            file: notebook/37-granularity.md,
            text: "- တောင်းဆိုချက် 1: Notification team က SMS, email, push ကို service 3 ခု ခွဲချင်တယ်",
          }
      - id: sel-req2
        type: editor.select
        at: { mark: sel-req2 }
        target:
          {
            file: notebook/37-granularity.md,
            text: "- တောင်းဆိုချက် 2: Payment team က Refund service ကို Payment ထဲ ပြန်ပေါင်းချင်တယ်",
          }

  - id: smaller
    chapter: သေးလေ ကောင်းလေ မဟုတ်ဘူး
    narration: >
      [[mark:s-open]] service တစ်ခု ဘယ်လောက် ကြီးလဲ၊ ဘယ်လောက် သေးလဲ ဆိုတာကို granularity လို့ ခေါ်ပါတယ်။
      service ဆိုတာ သေးလေ ကောင်းလေလို့ ထင်မိတတ်ကြပါတယ်။
      [[mark:s-one]] Notification က အခု အသိပေးစာ အားလုံးကို ပို့ပေးတဲ့ service တစ်ခုတည်းပါ။
      [[mark:s-three]] ဒါကို team တောင်းတဲ့အတိုင်း SMS၊ email၊ push ဆိုပြီး သုံးခု ခွဲလိုက်မယ် ဆိုပါစို့။
      [[mark:s-gain]] ရလာတာက တစ်ခုချင်းစီကို သီးခြား deploy လုပ်နိုင်၊ သီးခြား scale လုပ်နိုင်တာပါ။
      [[mark:s-cost]] ဒါပေမဲ့ boundary အသစ် တစ်ခုတိုင်းမှာ ပေးရတာတွေလည်း ပါလာပါတယ်။ function တစ်ခု ခေါ်ရုံနဲ့
      ပြီးတဲ့ကိစ္စက network ပေါ်ကနေ ခေါ်ရတဲ့ call ဖြစ်သွားပြီး၊ deploy လုပ်စရာ၊ စောင့်ကြည့်စရာ၊ ညဘက်
      တာဝန်တွေကလည်း သုံးဆ ဖြစ်လာပါတယ်။
      [[mark:s-balance]] ဒါကြောင့် သေးတာက သူ့အလိုလို မကောင်းသလို၊ ကြီးတာကလည်း သူ့အလိုလို မကောင်းပါဘူး။ granularity
      ဆိုတာ ခွဲဖို့ တွန်းနေတဲ့ အားတွေနဲ့ ပေါင်းထားဖို့ ဆွဲနေတဲ့ အားတွေကို ချိန်ကြည့်ရတဲ့ ကိစ္စပါ။
    sources:
      - {
          title: "Software Architecture: The Hard Parts (Ford, Richards, Sadalage, Dehghani)",
          url: "https://oreil.ly/sa-the-hard-parts",
        }
    actions:
      - {
          id: draw-s-open,
          type: whiteboard.apply,
          at: { mark: s-open },
          open: true,
          upsertIds: [s-title],
        }
      - {
          id: draw-s-one,
          type: whiteboard.apply,
          at: { mark: s-one },
          upsertIds: [s-one, s-one-l],
          drawMs: 1200,
        }
      - {
          id: draw-s-three,
          type: whiteboard.apply,
          at: { mark: s-three },
          upsertIds: [s-arrow, s-sms, s-sms-l, s-email, s-email-l, s-push, s-push-l],
          drawMs: 2800,
        }
      - {
          id: draw-s-gain,
          type: whiteboard.apply,
          at: { mark: s-gain },
          upsertIds: [s-gain1, s-gain2],
          drawMs: 1400,
        }
      - {
          id: draw-s-cost,
          type: whiteboard.apply,
          at: { mark: s-cost, offsetMs: 2500 },
          upsertIds: [s-cost1, s-cost2],
          drawMs: 2400,
        }

  - id: forces
    chapter: ခွဲစေတဲ့ အားနဲ့ ပေါင်းစေတဲ့ အား
    narration: >
      [[mark:p-open]] service တစ်ခုကို ခွဲဖို့ တွန်းတဲ့ အား ငါးမျိုးကို အရင် ကြည့်ပါမယ်။
      [[mark:p-1]] ပထမက fault tolerance ပါ။ အပိုင်း တစ်ခု ပျက်လည်း ကျန်တာတွေ ဆက်အလုပ်လုပ်နိုင်တာပါ။ တစ်ခုရဲ့ ပြဿနာက ကျန်တာတွေကို ဆွဲချနေရင် ခွဲချင်စရာ ဖြစ်လာပါတယ်။
      [[mark:p-2]] ဒုတိယက scale ပါ။ အပိုင်း တစ်ခုတည်းက load အများကြီး ခံရရင်၊ အဲဒီ တစ်ခုအတွက်နဲ့ service
      တစ်ခုလုံးကို စက်တွေ ထပ်တိုးပေးနေရပါတယ်။
      [[mark:p-3]] တတိယက volatility ပါ။ ဘယ်လောက် မကြာခဏ ပြောင်းလဲ ဆိုတာပါ။ အပိုင်း တစ်ခုက ကျန်တာတွေထက် အများကြီး
      ပိုပြောင်းနေရင်၊ မပြောင်းတဲ့ အပိုင်းတွေပါ အတူတူ deploy လုပ်နေရပါတယ်။
      [[mark:p-4]] စတုတ္ထက cohesion ပါ။ အပိုင်း တစ်ခုထဲက အရာတွေ တစ်ခုနဲ့တစ်ခု ဘယ်လောက် ဆိုင်လဲ ဆိုတာပါ။ မဆိုင်တဲ့
      အလုပ်တွေ service တစ်ခုထဲ ရောနေရင် ခွဲသင့်ပါတယ်။
      [[mark:p-5]] ပဉ္စမက security ပါ။ ဥပမာ wallet ကုမ္ပဏီနဲ့ ချိတ်ဖို့ လျှို့ဝှက် key တွေကို ကိုင်ရတဲ့ code ကို၊
      လူနည်းနည်းပဲ ဝင်ခွင့်ရှိတဲ့ နေရာမှာ သီးသန့် ထားချင်တာမျိုးပါ။
      [[mark:j-open]] တစ်ဖက်မှာတော့ ပေါင်းထားဖို့ ဆွဲတဲ့ အား သုံးမျိုး ရှိပါတယ်။
      [[mark:j-1]] ပထမက မျှသုံးနေရတာပါ။ service နှစ်ခုက code အတူတူ၊ ဒါမှမဟုတ် data အတူတူကို သုံးနေရရင်၊ တစ်ဖက်က
      ပြင်တိုင်း နောက်တစ်ဖက်ပါ လိုက်ပြင်ရပါတယ်။
      [[mark:j-2]] ဒုတိယက transaction ပါ။ အကုန်ဖြစ်၊ ဒါမှမဟုတ် တစ်ခုမှ မဖြစ် ဆိုတဲ့ လုပ်ဆောင်ချက် အစုပါ။ database
      တစ်ခုတည်းထဲမှာဆို database က အာမခံပေးပေမဲ့၊ service နှစ်ခုက data ကို ခွဲပိုင်လိုက်တာနဲ့ အဲဒီ အာမခံချက်
      ပျောက်သွားပါတယ်။
      [[mark:j-3]] တတိယက အပြန်အလှန် ခေါ်နေရတာပါ။ request တစ်ခု ပြီးဖို့ service တစ်ခုက နောက်တစ်ခုကို အကြိမ်ကြိမ်
      လှမ်းခေါ်နေရရင်၊ ခေါ်တိုင်း နှေးသလို တစ်ခု ပျက်ရင် နှစ်ခုလုံး ပျက်တတ်ပါတယ်။
    sources:
      - {
          title: "Software Architecture: The Hard Parts (Ford, Richards, Sadalage, Dehghani)",
          url: "https://oreil.ly/sa-the-hard-parts",
        }
    actions:
      - {
          id: close-smaller,
          type: whiteboard.apply,
          at: { mark: p-open, offsetMs: -1500 },
          open: false,
        }
      - {
          id: show-split,
          type: slide.show,
          at: { mark: p-open, offsetMs: -1000 },
          slideId: split-forces,
        }
      - { id: point-p1, type: slide.point, at: { mark: p-1 }, target: { x: 0.15, y: 0.35 } }
      - { id: point-p2, type: slide.point, at: { mark: p-2 }, target: { x: 0.15, y: 0.47 } }
      - { id: point-p3, type: slide.point, at: { mark: p-3 }, target: { x: 0.15, y: 0.59 } }
      - { id: point-p4, type: slide.point, at: { mark: p-4 }, target: { x: 0.15, y: 0.71 } }
      - { id: point-p5, type: slide.point, at: { mark: p-5 }, target: { x: 0.15, y: 0.83 } }
      - {
          id: show-join,
          type: slide.show,
          at: { mark: j-open, offsetMs: -1200 },
          slideId: join-forces,
        }
      - { id: point-j1, type: slide.point, at: { mark: j-1 }, target: { x: 0.15, y: 0.43 } }
      - { id: point-j2, type: slide.point, at: { mark: j-2 }, target: { x: 0.15, y: 0.59 } }
      - { id: point-j3, type: slide.point, at: { mark: j-3 }, target: { x: 0.15, y: 0.75 } }

  - id: weigh
    chapter: Notification ကို ချိန်ကြည့်ခြင်း
    narration: >
      [[mark:w-open]] ဒီ အားတွေနဲ့ Notification team ရဲ့ တောင်းဆိုချက်ကို ချိန်ကြည့်ရအောင်။ team ကို အရင်ဆုံး
      မေးတာက ဘာ ပြဿနာကြောင့် ခွဲချင်တာလဲ ဆိုတာပါ။
      [[mark:w-fail]] အဖြေက fault tolerance ပါ။ promotion တစ်ခု ကြေညာတိုင်း message သိန်းနဲ့ချီ တစ်ပြိုင်တည်း
      ထွက်ပြီး၊ လက်မှတ် အတည်ပြုတဲ့ SMS တွေက အဲဒီနောက်မှာ မိနစ်နဲ့ချီ တန်းစီ စောင့်နေရပါတယ်။
      [[mark:w-scale]] scale လည်း မတူပါဘူး။ အတည်ပြုစာက လက်မှတ် တစ်စောင် ရောင်းမှ တစ်စောင် ထွက်ပြီး၊ promotion
      ကတော့ တစ်ခါတည်းနဲ့ အများကြီး ထွက်ပါတယ်။
      [[mark:w-new]] team က နောင်မှာ channel အသစ်တွေ လာဦးမယ်လို့လည်း ဆိုပါတယ်။ အမျိုးအစား အသစ်တွေ လာမယ်ဆိုတာလည်း ခွဲစေတဲ့ အားပါ။ ဒါပေမဲ့ သေချာမှ ထည့်တွက်ရပါတယ်။
      [[mark:w-guess]] product manager လှလှ ကို မေးကြည့်တော့ ဒီနှစ်အတွက် channel အသစ် plan မရှိပါဘူး။ မှန်းဆချက်ကိုတော့
      အလေးချိန် မပေးပါဘူး။
      [[mark:w-share]] ပေါင်းထားဖို့ဘက်မှာတော့ မျှသုံးနေရတာ ရှိပါတယ်။ စာသား template တွေနဲ့ ခရီးသည်ရဲ့
      ဖုန်းနံပါတ်လို data ကို message အားလုံးက သုံးနေတာပါ။
      [[mark:w-ask]] ဒီလို အားတွေ တိုက်နေတဲ့အခါ architect က ကိုယ့်သဘောနဲ့ မဆုံးဖြတ်ပါဘူး။ business ကို ဒီနေရာမှာ
      ဘယ်ဟာက ပိုအရေးကြီးလဲ ဆိုတဲ့ မေးခွန်း တစ်ခုတည်း မေးပါတယ်။
      [[mark:w-ask2]] လှလှ ကို မေးခဲ့တာက၊ promotion ပို့နေချိန်မှာတောင် လက်မှတ် SMS စက္ကန့်ပိုင်းအတွင်း ရောက်တာနဲ့၊
      message နဲ့ ပတ်သက်သမျှကို တစ်နေရာတည်းမှာ ပြင်ရတာ၊ ဘယ်ဟာကို ပိုလိုချင်လဲ ဆိုတာပါ။
      [[mark:w-pick]] လှလှ က လက်မှတ် SMS ကို ရွေးပါတယ်။ လက်မှတ် မရသေးတဲ့ ခရီးသည်က ကားပေါ် တက်လို့ မရလို့ပါ။
      [[mark:c-open]] ဒါဆို ဘယ်နေရာက ခွဲမလဲ။ တစ်ခုကို တစ်ခု နှောင့်နေတာက SMS နဲ့ push
      မဟုတ်ပါဘူး။ လက်မှတ် အတည်ပြုစာနဲ့ promotion ပါ။
      [[mark:c-team]] team တောင်းတဲ့အတိုင်း channel အလိုက် သုံးခု ခွဲလိုက်မယ် ဆိုပါစို့။
      [[mark:c-mixed]] SMS service အထဲမှာ အတည်ပြုစာနဲ့ promotion က အရင်အတိုင်း တန်းတူ စီနေဦးမှာပါ။ service
      အရေအတွက်ပဲ တိုးပြီး ပြဿနာက မပျောက်ပါဘူး။
      [[mark:c-cut]] ဒါကြောင့် အလုပ်အမျိုးအစားအလိုက် နှစ်ခုပဲ ခွဲပါမယ်။ လက်မှတ်နဲ့ ပတ်သက်တဲ့ message တွေကို ပို့တဲ့
      service တစ်ခုနဲ့၊ promotion တွေကို ပို့တဲ့ campaign service တစ်ခုပါ။
      [[mark:c-point]] အားကို နာမည်တပ်နိုင်ရင် ခွဲသင့်မသင့်တင်မကဘဲ၊ ဘယ်နေရာက ခွဲရမလဲ ဆိုတာပါ သိရပါတယ်။
