  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ Payment team ရဲ့ တောင်းဆိုချက်ကိုတော့ ကိုယ်တိုင် ချိန်ကြည့်ပါ။
      [[mark:q-g1]] Refund ကို မနှစ်က ခွဲထုတ်ခဲ့တာမှာ အကြောင်းပြချက် ရှိခဲ့ပါတယ်။ ကားလိုင်းတွေရဲ့ လက်မှတ် ဖျက်တဲ့
      စည်းမျဉ်းတွေကြောင့် refund code က ငွေဖြတ်တဲ့ code ထက် သုံးဆလောက် ပိုမကြာခဏ ပြောင်းရလို့ပါ။
      [[mark:q-g2]] ဒါပေမဲ့ refund တစ်ခု လုပ်တိုင်း Refund နဲ့ Payment က ငွေစာရင်း တစ်ခုတည်းကို ပြင်ရပါတယ်။
      ငွေပြန်အမ်းပြီးပြီ ဆိုတဲ့ မှတ်တမ်းနဲ့ မူလ ငွေချေမှုရဲ့ အခြေအနေက အတူတူ ပြောင်းမှ ရပါမယ်။
      [[mark:q-a]] ဒါဆို Refund ကို သီးခြား service အဖြစ် ဆက်ထားမလား။
      [[mark:q-b]] ဒါမှမဟုတ် Payment ထဲ ပြန်ပေါင်းမလား။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ Payment ထဲ ပြန်ပေါင်းတာပါ။
      [[mark:q-why]] ဘာကြောင့်လဲဆိုတော့ ငွေစာရင်းက တစ်ဝက်တစ်ပျက် ဖြစ်ခွင့် မရှိလို့ပါ။ service နှစ်ခု ခွဲထားတော့
      refund မှတ်တမ်း ရေးပြီးချိန်နဲ့ ငွေချေမှုကို ပြင်ချိန်ကြားမှာ တစ်ခုခု ပျက်သွားရင်၊ စာရင်း နှစ်ခုက
      မကိုက်တော့ပါဘူး။ ပြီးခဲ့တဲ့ သုံးလအတွင်း အဲဒီလို refund ၃၇ ခုကို finance ဘက်က လက်နဲ့ လိုက်ညှိခဲ့ရပါတယ်။ ဒီမှာတော့ transaction ဆိုတဲ့ အားက volatility ထက် အများကြီး ပိုလေးပါတယ်။
      [[mark:q-module]] volatility မတူတာကိုတော့ Payment service အထဲမှာ refund ကို သီးခြား module အဖြစ် ထားပြီး
      ဖြေရှင်းပါတယ်။ module ဆိုတာ အတူ ပြောင်းလဲတတ်တဲ့ code အုပ်စုပါ။ deploy က တစ်ခုတည်း ဖြစ်သွားပေမဲ့ code ကတော့ ရောမသွားပါဘူး။
    sources:
      - {
          title: "Software Architecture: The Hard Parts (Ford, Richards, Sadalage, Dehghani)",
          url: "https://oreil.ly/sa-the-hard-parts",
        }
    actions:
      - {
