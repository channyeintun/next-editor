  - id: table
    chapter: ချိန်ကြည့်ချက်ကို ချရေးခြင်း
    narration: >
      [[mark:t-close]] ချိန်ကြည့်ခဲ့တာကို နောက်လူတွေ ပြန်ကြည့်နိုင်အောင် မှတ်စုထဲမှာ ချရေးထားရအောင်။
      [[mark:type-n1]] ခွဲဖို့ တွန်းတဲ့ အား နှစ်ခုကို ဘယ်လို သက်ဆိုင်လဲ၊ ဘယ်လောက် လေးလဲ ဆိုတာနဲ့တကွ ရေးပါတယ်။
      အလေးချိန်ကတော့ အကြမ်းဖျင်း ပေးရုံနဲ့ လုံလောက်ပါတယ်။
      [[mark:type-n2]] channel အသစ် ဆိုတဲ့ အကြောင်းကိုလည်း ချန်မထားပါဘူး။ အလေးချိန် မရှိဘူးလို့ မှတ်ထားမှ၊ plan တကယ်
      ပေါ်လာတဲ့နေ့မှာ ပြန်ချိန်နိုင်မှာပါ။
      [[mark:type-n3]] ပေါင်းဖို့ ဆွဲတဲ့ အားကတော့ တစ်ခုပဲ ရှိပါတယ်။ ခွဲလိုက်ရင် template တွေကို နှစ်နေရာ
      ထားရမှာမို့ အလတ်လို့ ပေးထားပါတယ်။
      [[mark:type-nd]] ဆုံးဖြတ်ချက်မှာ ဘာကို ရွေးလိုက်လဲ ဆိုတာအပြင်၊ ဘယ်သူ့ကို မေးလို့ ဒီအဖြေ ရခဲ့လဲ ဆိုတာကိုပါ
      ထည့်ရေးထားပါတယ်။
    sources:
      - {
          title: "Software Architecture: The Hard Parts (Ford, Richards, Sadalage, Dehghani)",
