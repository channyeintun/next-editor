  - id: action-card
    chapter: Action card
    narration: >
      [[mark:close-b4]] [[mark:b5-s1]] ဒါဆို automation ကို ဘယ်တော့ ကိုယ့်ဘာသာ လုပ်ခွင့် ပေးမလဲ? lesson ၁၀ မှာ Operator A နှေးလို့ backup endpoint ဆီ traffic ကို လက်နဲ့ လွှဲခဲ့ရပါတယ်။ [[mark:b5-s1b]] အခု failover bot ကို လွှဲသင့်ပြီလို့ အကြံပဲ ပေးခိုင်းထားတော့ ည ၄၀ မှာ ၃၈ ခါ မှန်ပြီး ၂ ခါပဲ မှားပါတယ်။
      [[mark:b5-s2]] Padauk ရဲ့ action card က action တစ်ခုချင်းအတွက် အကြံပဲ ပေးမလား၊ အရင် မေးမလား၊ လုပ်ပြီးမှ ပြောမလား၊ လုံးဝ မလုပ်ရဘူးလား ဆိုတဲ့ mode၊ undo လုပ်နည်းနဲ့ ရပ်ရမယ့် အခြေအနေကို ရေးထားတဲ့ ကတ်ပါ။ [[mark:b5-s2b]] backup ဆီ လွှဲတဲ့ action အတွက် လုပ်ပြီးမှ ပြောခွင့်ကို ရက်စွဲကြောင့် မဟုတ်ဘဲ မှန်ခဲ့တဲ့ မှတ်တမ်းကြောင့် ရတာပါ၊ ဒါတောင် Operator A တစ်ခုအတွက်ပဲပါ။
      [[mark:b5-s3]] ပင်မ endpoint ဆီ ပြန်ပြောင်းတာလို တချို့ အဆင့်တွေကိုတော့ တမင် လူ့လက်ထဲ ချန်ထားလို့ အမြဲ အရင် မေးရပါတယ်။ restore လုပ်တာကိုလည်း alert တစ်ခုတည်းနဲ့ ဘယ်တော့မှ မစပါဘူး၊ monitoring မှားတာ တစ်ခုနဲ့ alert အားလုံး တစ်ပြိုင်နက် တက်လာနိုင်လို့ပါ။ bot မှာလည်း ကိုယ်ပိုင် log နဲ့ dashboard ရှိပါတယ်။
    sources:
