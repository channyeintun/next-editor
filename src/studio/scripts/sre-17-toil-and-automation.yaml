  - id: recap
    narration: >
      [[mark:close-p05]] [[mark:open-notes]] toil audit က ချန်ခဲ့တဲ့ သော့ချက်တွေပါ။ [[mark:sel-toil]] toil က လက်နဲ့ ထပ်ခါထပ်ခါ လုပ်ရပြီး service နဲ့အတူ ကြီးလာတဲ့၊ ရေရှည် တန်ဖိုး မကျန်တဲ့ အလုပ်ပါ။ [[mark:sel-toil-target]] toil target က toil ရှိခွင့် အများဆုံးကို SLO လို ထားတဲ့ ပစ်မှတ်ပါ။ [[mark:sel-safe-default]] safe default က input မပါရင် ဘာမှ မလုပ်ဘဲ ငြင်းတာပါ။
      [[mark:sel-ironies]] ironies of automation က automation ကောင်းလေ ခက်တဲ့ case တွေအတွက် လူ့ ကျွမ်းကျင်မှု ဆုံးလေ ဖြစ်တာပါ။ [[mark:sel-action-card]] action card ကတော့ action တစ်ခုချင်းကို automation ဘယ်လောက်အထိ လုပ်ခွင့် ရှိလဲ ရေးထားတာပါ။
      [[mark:sel-question]] တွက်ခြေ ကိုက်လား ကိုယ်တိုင် တွက်ကြည့်ပါ။ [[mark:ask-question]] နေ့တိုင်း မိနစ် ၂၀ ကြာတဲ့ အလုပ်ကို automate လုပ်ဖို့ နာရီ ၈၀ ကုန်မယ်ဆိုရင် ဘယ်တော့ အရင်း ပြန်ကျေမလဲ?
      [[mark:pause-question]] တစ်လကို နာရီ ၁၀ လောက် သက်သာလို့ ထိန်းရတဲ့ အချိန် မထည့်ရင် ၈ လလောက်ပါ။ လစာထုတ်ရက် ညနေ တစ်ခုမှာ test တွေ အားလုံး အစိမ်းရောင်ပေမဲ့ တစ်ယောက်က console ထဲမှာ config ပြင်လိုက်တော့ Operator A ဆီ traffic လုံးဝ မရောက်တော့ပါဘူး။ test တွေက ဘာကို တစ်ခါမှ မကြည့်ခဲ့လဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book, 1st ed: Eliminating Toil",
          url: "https://sre.google/sre-book/eliminating-toil/",
        }
      - {
          title: "SRE book, 1st ed: The Evolution of Automation at Google",
          url: "https://sre.google/sre-book/automation-at-google/",
        }
    actions:
      - { id: close-p05, type: slide.close, at: { mark: close-p05 } }
      - {
          id: open-notes,
          type: workspace.openFile,
          at: { mark: open-notes, offsetMs: 300 },
          path: notes.md,
        }
      - {
          id: sel-toil,
          type: editor.select,
          at: { mark: sel-toil },
          target: { file: notes.md, text: "toil", occurrence: 1 },
        }
      - {
          id: sel-toil-target,
          type: editor.select,
          at: { mark: sel-toil-target },
          target: { file: notes.md, text: "toil target", occurrence: 1 },
        }
      - {
          id: sel-safe-default,
          type: editor.select,
          at: { mark: sel-safe-default },
          target: { file: notes.md, text: "safe default", occurrence: 1 },
        }
      - {
          id: sel-ironies,
          type: editor.select,
          at: { mark: sel-ironies },
          target: { file: notes.md, text: "ironies of automation", occurrence: 1 },
        }
      - {
          id: sel-action-card,
          type: editor.select,
          at: { mark: sel-action-card },
          target: { file: notes.md, text: "action card", occurrence: 1 },
        }
      # The voice script's ⟪select မေးခွန်း⟫ and ⟪pause 3s⟫, the way the Module 1
      # reviewers fixed the pause. sel-question marks where the voice script puts
      # the select, but a select there would drag under the lead-in and the
      # question and leave no pause, and one at pause-question would drag under
      # the answer's first words (the scheduler holds only the dialog after its
      # anchor's). So the question-line select hangs off ask-question, one more
      # mark at an existing sentence end that makes the question its own dialog:
      # it starts about as the question ends, its drag runs in silence, and the
      # answer at pause-question waits for it. The question is 100 characters,
      # so 7400 (400 + 100 x 70) would start the drag as the question ends at
      # 70 ms per char, but anything above ~7270 trips compile-check's 2.5 s
      # inserted-silence warning at 55; 7250 leaves about 2.8 / 1.3 / 0.35 s of
      # quiet before the answer at 55 / 70 / 95 (at 95, and by 0.12 s at 70, the
      # drag starts under the question's last words, as in lessons 7, 10 and 30).
      - id: select-question
        type: editor.select
