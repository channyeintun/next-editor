        # Toil နဲ့ automation

        - toil — လက်နဲ့ ထပ်ခါထပ်ခါ၊ service နဲ့အတူ ကြီး၊ ရေရှည် တန်ဖိုး မကျန်
        - toil target — toil ရှိခွင့် အများဆုံးကို SLO လို ထားတဲ့ ပစ်မှတ် (Padauk: 35%)
        - safe default — input မပါရင် ဘာမှ မလုပ်ဘဲ ငြင်း
        - ironies of automation — automation ကောင်းလေ ခက်တဲ့ case အတွက် လူ့ ကျွမ်းကျင်မှု ဆုံးလေ
        - action card — action တစ်ခုချင်း: အကြံပေး · အရင်မေး · လုပ်ပြီးမှပြော · ဘယ်တော့မှမလုပ်၊ undo၊ ရပ်ရမယ့် အခြေအနေ

        မေးခွန်း: နေ့တိုင်း မိနစ် 20၊ automate လုပ်ဖို့ နာရီ 80။ ဘယ်တော့ အရင်း ပြန်ကျေမလဲ?
