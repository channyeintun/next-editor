  - id: safe-default
    chapter: Input မပါရင် ဘာမှ မလုပ်နဲ့
    narration: >
      [[mark:close-p04c]] [[mark:b4-s1]] automation မှာ အန္တရာယ် အရှိဆုံး မေးခွန်း တစ်ခုက input မပါရင် ဘာလုပ်မလဲ ဆိုတာပါ။ promo SMS tool က user အုပ်စုနဲ့ မြို့ကို ရွေးပြီး voucher ပို့ပါတယ်။ [[mark:b4-s1b]] config ပြောင်းရင်း နှစ်ခုလုံး အလွတ် ဖြစ်သွားတော့ tool က အလွတ်ကို registered user အားလုံးလို့ ယူပြီး မနက် ၂ နာရီမှာ SMS သုံးသန်းလောက် ပို့လိုက်ပါတယ်။
      [[mark:b4-s2]] ပြင်ပြီးတဲ့ tool ကတော့ input အလွတ်ဆိုရင် ဘာမှ မလုပ်ဘဲ ဘာ လိုနေလဲ ပြောတဲ့ error နဲ့ ငြင်းပါတယ်။ ဘာမှ မသတ်မှတ်ထားရင် ဘေးကင်းတဲ့ဘက်ကို ရွေးပေးတဲ့ ဒီ ပုံသေ အပြုအမူကို safe default လို့ ခေါ်ပါတယ်၊ input အလွတ်နဲ့ test လည်း လုပ်ထားရပါမယ်။
      [[mark:b4-s3]] ဒီ tool က user သုံးသန်းဆီ ပို့နိုင်လို့ အကာအကွယ်တွေ လိုပါတယ်။ လက်ခံသူ အရေအတွက် ကန့်သတ်ချက်၊ တစ်မိနစ် ပို့နှုန်းကို ကန့်တဲ့ rate limit၊ မပို့ခင် ဘယ်နှယောက်ဆီ ရောက်မလဲ ပြတဲ့ dry run တွေ ထည့်ပြီး user အားလုံးကို ပို့ချင်ရင် အားလုံးလို့ သီးသန့် ရွေးရပါတယ်။ [[mark:b4-s3b]] tool က မလုပ်ခင် ပိုဆိုးစေမလား အရင် စစ်ပြီး ထူးဆန်းရင် ရပ်ပြီး လူကို မေးပါတယ်။ နားလည်ရ ခက်တဲ့ tool ကလည်း တစ်နေ့ မဟုတ် တစ်နေ့ outage ဖြစ်စေမှာပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book, 1st ed: The Evolution of Automation at Google",
