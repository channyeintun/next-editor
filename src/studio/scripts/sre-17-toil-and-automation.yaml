build:
  # Studio swaps in the Burmese voice chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 2617

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: hook
    chapter: တစ်ပတ်ရဲ့ တစ်ဝက် ပျောက်နေတယ်
    narration: >
      [[mark:show-p01]] Bill Pay နဲ့ on-call ခွဲယူတဲ့ engagement ရေးပြီးနောက် မသီရိရဲ့ Site Reliability Engineering၊ SRE အဖွဲ့မှာ လေးယောက် ရှိလာပါပြီ။ ဒါပေမဲ့ project အသစ် စဖို့ အချိန် မရဘူးလို့ အဖွဲ့ဝင်တွေ ညည်းနေကြတော့ မသီရိက တစ်ပတ်လုံး အချိန် ဘယ်မှာ ကုန်လဲ မှတ်ခိုင်းပါတယ်။ အချိန်ရဲ့ ၅၅ ရာခိုင်နှုန်းက လက်နဲ့ ထပ်ခါထပ်ခါ လုပ်ရတဲ့ toil မှာ ကုန်နေပြီး page ၇၀ ထဲမှာ တကယ် လုပ်စရာ ရှိခဲ့တာ ၁၁ ခုပဲပါ။ ဒါဆို ဘယ်ကနေ စမလဲ?
      [[mark:show-map]] Module ၅ က reliability loop ရဲ့ နောက်ဆုံး အဆင့်၊ တည်ဆောက်တဲ့ အဆင့်ပါ။ incident တွေက ရတဲ့ သင်ခန်းစာကို test၊ capacity၊ data၊ design နဲ့ platform တွေထဲ ထည့်ဆောက်ရမှာမို့ ဆောက်ဖို့ အချိန် ရအောင် toil ကနေ စပါမယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Workbook: Eliminating Toil",
          url: "https://sre.google/workbook/eliminating-toil/",
        }
      - {
          title: "SRE book, 1st ed: Eliminating Toil",
          url: "https://sre.google/sre-book/eliminating-toil/",
        }
    actions:
      # -1750 / -1450, as in Module 1: a pull-back over 1780 ms pushes the first dialog
      # past the 2 s opening handle, which src/studio/plans/index.test.ts rejects.
      - { id: collapse-dock, type: runtime.collapseDock, at: { scene: start, offsetMs: -1750 } }
      - {
          id: show-p01,
          type: slide.show,
          at: { mark: show-p01, offsetMs: -1450 },
          slideId: l17-p01,
        }
      # Module 5 opens: the module map advances in place from the cover.
      - { id: show-map, type: slide.show, at: { mark: show-map }, slideId: m5-map }

  - id: sorting
    chapter: Toil လား၊ engineering လား
    narration: >
      [[mark:close-map]] [[mark:b1-s1]] မသီရိက မှတ်တမ်းထဲက အလုပ်တွေကို နှစ်စု ခွဲကြည့်ပါတယ်။ settlement ပြန် run တာ၊ merchant ကို လက်နဲ့ approve လုပ်တာ၊ ရပ်နေတဲ့ worker ကို restart လုပ်တာတွေက ဒီအပတ် လုပ်ပြီးလည်း နောက်အပတ် ပြန်လုပ်ရမှာပါ။ ဒါတွေက toil ပါ၊ လက်နဲ့ ထပ်ခါထပ်ခါ လုပ်ရပြီး automate လုပ်လို့ ရပေမဲ့ ရေရှည် တန်ဖိုး မကျန်ဘဲ service ကြီးလာတာနဲ့ အမျှ လိုက်များလာတတ်ပါတယ်။
      [[mark:b1-s2]] outage တစ်ခုအပြီး fix နဲ့ test ရေးတာ၊ security policy ရေးတာ၊ တစ်ခါပဲ လုပ်ရတဲ့ migration တွေကတော့ ခက်ပြီး ပျင်းစရာ ကောင်းနိုင်ပေမဲ့ စဉ်းစား ဆုံးဖြတ်ရပြီး system ကို အမြဲတမ်း ပိုကောင်းစေလို့ toil မဟုတ်ဘဲ engineering ပါ။
      [[mark:b1-s3]] toil တိုင်းလည်း မဆိုးပါဘူး။ incident အတွင်း ရပ်နေတဲ့ order တွေကို လက်နဲ့ ပြန်တန်းစီတာလို ယာယီ ဖြစ်ပြီး ကြိုစီစဉ်ထားတဲ့ toil ကို နာရီပိုင်း ရက်ပိုင်းဆို လက်ခံနိုင်ပေမဲ့ အပတ်နဲ့ချီ ကြာလို့ မဖြစ်ပါဘူး။ [[mark:b1-s3b]] သတိထားရမှာက product ထဲ မရှိတဲ့ feature ကို လက်နဲ့ ဖြည့်ပေးနေရတဲ့ toil နဲ့ အဖွဲ့ထက် မြန်မြန် ကြီးလာတဲ့ toil ပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book, 1st ed: Eliminating Toil",
          url: "https://sre.google/sre-book/eliminating-toil/",
        }
      - {
          title: "Workbook: Eliminating Toil",
          url: "https://sre.google/workbook/eliminating-toil/",
        }
    actions:
      - { id: close-map, type: slide.close, at: { mark: close-map, offsetMs: -400 } }
      - {
          id: b1-s1,
          type: whiteboard.apply,
          at: { mark: b1-s1 },
          open: true,
          clear: true,
          upsertIds: [l17-b1-h1],
        }
      - id: b1-s1-draw
        type: whiteboard.apply
        at: { afterAction: b1-s1 }
        upsertIds:
          [
            l17-b1-r1,
            l17-b1-r1-t,
            l17-b1-r2,
            l17-b1-r2-t1,
            l17-b1-r2-t2,
            l17-b1-r3,
            l17-b1-r3-t1,
            l17-b1-r3-t2,
          ]
        drawMs: 2400
      - { id: b1-s2, type: whiteboard.apply, at: { mark: b1-s2 }, upsertIds: [l17-b1-h2] }
      - id: b1-s2-draw
        type: whiteboard.apply
        at: { afterAction: b1-s2 }
        upsertIds:
          [l17-b1-e1, l17-b1-e1-t, l17-b1-e2, l17-b1-e2-t, l17-b1-e3, l17-b1-e3-t1, l17-b1-e3-t2]
        drawMs: 2400
      - {
          id: b1-s3,
          type: whiteboard.apply,
          at: { mark: b1-s3 },
          upsertIds: [l17-b1-ok],
          drawMs: 1200,
        }
      # The warning signs land on the sentence that names them, not ~15 s early.
      - {
          id: b1-s3b,
          type: whiteboard.apply,
          at: { mark: b1-s3b },
          upsertIds: [l17-b1-warn],
          drawMs: 1600,
        }

  - id: toil-loop
    narration: >
      [[mark:close-b1]] [[mark:b2-s1]] ၅၅ ရာခိုင်နှုန်းက ဘာလို့ အန္တရာယ် ရှိလဲ ဆိုတာ စက်ဝိုင်း တစ်ခုနဲ့ ကြည့်ရအောင်။ toil များလာရင် settlement ကို အမြစ်ကနေ ပြင်တာ၊ alert တွေ ရှင်းတာလို တကယ့် ဖြေရှင်းချက်တွေအတွက် အချိန် မကျန်တော့လို့ မပြင်ရသေးတဲ့ ပြဿနာတွေက toil အသစ်တွေ ထပ်မွေးပါတယ်။
      [[mark:b2-s2]] ဒီလို ဆက်ဖြစ်နေတော့ လူတွေ burnout ဖြစ်ပြီး အတွေ့အကြုံ အများဆုံး လူတွေကစပြီး ထွက်သွားတတ်ပါတယ်။ [[mark:b2-s3]] သူတို့ရဲ့ toil က ကျန်တဲ့သူတွေဆီ ရောက်လာတော့ တစ်ယောက်ချင်း toil ပိုများပြီး စက်ဝိုင်းက ပိုမြန်မြန် လည်ပါတယ်။ ဒါကြောင့် ၅၅ ရာခိုင်နှုန်းက စိတ်ဓာတ် ကိစ္စ မဟုတ်ဘဲ feature အသစ်တွေကို နှေးစေတဲ့ business ပြဿနာပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book, 1st ed: Eliminating Toil",
          url: "https://sre.google/sre-book/eliminating-toil/",
        }
    actions:
      # ⟪close board⟫ into the next board: wipe B1 400 ms early, keep the panel open.
      - {
          id: close-b1,
          type: whiteboard.apply,
          at: { mark: close-b1, offsetMs: -400 },
          clear: true,
        }
      - id: b2-s1
        type: whiteboard.apply
        at: { mark: b2-s1 }
        open: true
        clear: true
        upsertIds: [l17-b2-ring, l17-b2-arrow-top, l17-b2-arrow-right]
      - id: b2-s1-draw
        type: whiteboard.apply
        at: { afterAction: b2-s1 }
        upsertIds: [l17-b2-toil, l17-b2-toil-t, l17-b2-notime, l17-b2-notime-t1, l17-b2-notime-t2]
        drawMs: 1600
      - id: b2-s2
        type: whiteboard.apply
        at: { mark: b2-s2 }
        upsertIds: [l17-b2-burnout, l17-b2-burnout-t, l17-b2-leave, l17-b2-leave-t]
        drawMs: 1600
      - id: b2-s3
        type: whiteboard.apply
        at: { mark: b2-s3 }
        upsertIds: [l17-b2-back, l17-b2-more-t1, l17-b2-more-t2]
        drawMs: 1400

  - id: toil-like-slo
    chapter: Toil ကို SLO လို ဆက်ဆံပါ
    narration: >
      [[mark:close-b2]] [[mark:show-p02]] စက်ဝိုင်းကို ဖြတ်ဖို့ Padauk က toil ကို SLO လိုပဲ ဆက်ဆံပါတယ်။ ပထမ အဆင့်က မသီရိရဲ့ တစ်ပတ်စာ မှတ်တမ်းလို အချိန် ဘယ်မှာ ကုန်နေလဲ တိုင်းတဲ့ toil audit ပါ၊ ဒီ အစ ကိန်းဂဏန်း မရှိရင် ပိုကောင်းလာလား သက်သေပြလို့ မရပါဘူး။
      [[mark:show-p02b]] ပြီးတော့ toil target ထားပါတယ်၊ toil ကို သုည ဖြစ်အောင် မဟုတ်ဘဲ ဘယ်လောက်အထိ ရှိခွင့်ရှိလဲ ဆိုတဲ့ ပစ်မှတ်ပါ။ Padauk က ၃၅ ရာခိုင်နှုန်း ထားပြီး သုံးလတစ်ခါ ပြန်တိုင်းတဲ့အခါ ကျလာနေရပါမယ်။ အခု ၅၅ ရာခိုင်နှုန်းက ops အလုပ်ကို တစ်ဝက်မှာ ကန့်ထားတဲ့ lesson ၃ က စည်းကိုတောင် ကျော်နေပါပြီ။
      [[mark:show-p02c]] page တွေကိုလည်း လက်ခံရတဲ့သူ ကိုယ်တိုင် တစ်ခုခု လုပ်နိုင်မှ ပို့ရပါတယ်။ ဥပမာ လုပ်ရမှာက payment အဖွဲ့ကို လှမ်းပြောရုံပဲ ဆိုရင် သူတို့ကိုပဲ တိုက်ရိုက် page ပို့ပြီး လုပ်စရာ မရှိတဲ့ page တွေကိုတော့ ပြင်မလား ဖျက်မလား တစ်ခုချင်း ဆုံးဖြတ်ပါတယ်။
      [[mark:show-p02d]] toil ကို အရေးပေါ် ကိစ္စလို့ ကြေညာတာက ဖိအားပဲ တိုးပြီး လူ မတိုးလို့ အလုပ်မဖြစ်ပါဘူး။ လူ တစ်ယောက်ဆီ ပုံပေးထားရင် သူ burnout ဖြစ်ပြီး ကျန်တဲ့သူတွေ ဒုက္ခကို မမြင်ရတော့သလို လူသစ်ဆီ ပုံပေးတာလည်း onboarding မဟုတ်ပါဘူး။ အဲဒီအစား toil ကြီးတွေကို လူနဲ့ အချိန် ပေးထားတဲ့ project အဖြစ် လုပ်ပြီး ticket တစ်မျိုးလုံး ပျောက်အောင် ပြင်တာကို feature ထုတ်တာလိုပဲ ချီးကျူးပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Workbook: Eliminating Toil",
          url: "https://sre.google/workbook/eliminating-toil/",
        }
      - {
          title: "SRE book, 1st ed: Eliminating Toil",
          url: "https://sre.google/sre-book/eliminating-toil/",
        }
    actions:
      - {
          id: close-b2,
          type: whiteboard.apply,
          at: { mark: close-b2, offsetMs: -400 },
          open: false,
        }
      - { id: show-p02, type: slide.show, at: { mark: show-p02 }, slideId: l17-p02 }
      - { id: show-p02b, type: slide.show, at: { mark: show-p02b }, slideId: l17-p02b }
      - { id: show-p02c, type: slide.show, at: { mark: show-p02c }, slideId: l17-p02c }
      - { id: show-p02d, type: slide.show, at: { mark: show-p02d }, slideId: l17-p02d }

  - id: why-automate
    chapter: ဘာကြောင့် automate လုပ်မလဲ
    narration: >
      [[mark:show-p03]] toil ကို လျှော့တဲ့ နည်း တစ်ခုက automation ပါ၊ လူက လက်နဲ့ လုပ်နေရတဲ့ အလုပ်ကို software က အစား လုပ်ပေးတာပါ။ ပုံမှန်နေ့တွေမှာ နာရီတွေ သက်သာစေရုံ မကဘဲ outage မှာ မိနစ်တွေကို ချွေပေးပြီး ဖိအားကြားမှာလည်း အဆင့်တွေကို အမြဲ တစ်ပုံစံတည်း လုပ်ပေးပါတယ်။
      [[mark:show-p03b]] ဥပမာ ၉၉.၉၉ ရာခိုင်နှုန်း၊ nine လေးလုံး ပစ်မှတ်က တစ်လကို outage လေးမိနစ်လောက်ပဲ ခွင့်ပြုလို့ on-call ကျနေသူ နိုးပြီး login ဝင်ဖို့တောင် မလောက်ပါဘူး။ အလွယ်ဆုံး အစကတော့ incident ကြေညာတာနဲ့ channel နဲ့ incident doc ဖွင့်ပေး၊ role တွေ ခွဲပေး၊ timeline မှတ်ပေးတဲ့ bot သေးသေးလေးပါ၊ ဒါဆို postmortem က တစ်ဝက်လောက် ရေးပြီးသား ဖြစ်နေပါမယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book, 1st ed: The Evolution of Automation at Google",
          url: "https://sre.google/sre-book/automation-at-google/",
        }
    actions:
      - { id: show-p03, type: slide.show, at: { mark: show-p03 }, slideId: l17-p03 }
      - { id: show-p03b, type: slide.show, at: { mark: show-p03b }, slideId: l17-p03b }

  - id: break-even
    chapter: တွက်ခြေ ကိုက်လား
    narration: >
      [[mark:close-p03b]] [[mark:b3-s1]] automate လုပ်တိုင်းလည်း မတန်ပါဘူး။ မနက်တိုင်း operator တွေ ပို့တဲ့ settlement file ကို top-up စာရင်းနဲ့ spreadsheet ထဲမှာ တိုက်စစ်ရတာ မိနစ် ၂၅ ကြာပါတယ်။ [[mark:b3-s1b]] သုံးနှစ်ဆို နာရီ ၄၅၆ လောက် သက်သာပြီး tool ဆောက်တာ ထိန်းတာ ပေါင်း နာရီ ၁၈၈ လောက်ပဲ ကုန်မှာမို့ လုပ်သင့်တာ သေချာနေသလိုပါ။
      [[mark:b3-s2]] တကယ်တော့ operator တွေက file format ကို တစ်နှစ် နှစ်ခါလောက် ပြောင်းလို့ ကုန်ကျစရိတ်က နာရီ ၃၆၈ လောက်ထိ တက်ပြီး အရင်း ပြန်ကျေတာ နောက်ကျသွားပါတယ်။ ဒီ တွက်ချက်မှုထဲမှာ ကန့်သတ်ချက်၊ check နဲ့ ရပ်တဲ့ ခလုတ်လို အကာအကွယ်တွေ ဆောက်ရတာနဲ့ ဝေဝါးတဲ့ signal ကို ယုံပြီး tool က မှားလုပ်မိတာတွေကို ပြန်ရှင်းရတာလည်း မပါသေးပါဘူး။
      [[mark:b3-s3]] system ကို ပိတ်တဲ့နေ့မှာ သက်သာတာလည်း ရပ်သွားပါတယ်။ တကယ် ဆုံးဖြတ်ပေးခဲ့တာကတော့ ကိန်းဂဏန်းထက် top-up ပျောက်ရင် ဆုံးရှုံးမယ့် ငွေနဲ့ မနက်စောစော ထလုပ်ရတဲ့ ဒုက္ခပါ။
      [[mark:close-b3]] [[mark:show-p03c]] Padauk က လက်နဲ့ အရင် လုပ်ရင်း ထူးခြားတဲ့ case တွေကို လေ့လာတယ်၊ ပြီးတော့ script ရေးပြီး ရလဒ်ကို လူက စစ်တယ်၊ နောက်မှ အဖွဲ့အတွက် အလိုအလျောက် run အောင် လုပ်ပါတယ်။ script နဲ့ လူ အဆင့်မှာ အမြဲ ရပ်နေရင် တစ်ပုံစံတည်းလည်း မဖြစ်၊ scale လည်း မရလို့ အရှုပ်ဆုံး နောက်ဆုံးပိုင်းကိုပါ အပြီးထိ လုပ်ရပါတယ်။
      [[mark:show-p03d]] ဒါပေမဲ့ အကောင်းဆုံး အဖြေကတော့ operator တွေနဲ့ settlement API ချိတ်ပြီး မနက် တိုက်စစ်ရတဲ့ အလုပ်ကိုယ်တိုင် ပျောက်သွားအောင် system ကို ပြောင်းလိုက်တာပါ၊ ဒါက SRE အဖွဲ့ရဲ့ တကယ့် အလုပ်ပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Workbook: Eliminating Toil",
          url: "https://sre.google/workbook/eliminating-toil/",
        }
      - {
          title: "SRE book, 1st ed: The Evolution of Automation at Google",
          url: "https://sre.google/sre-book/automation-at-google/",
        }
    actions:
      - { id: close-p03b, type: slide.close, at: { mark: close-p03b, offsetMs: -400 } }
      # The chart frame first (title, axis); then, from "in three years" on, the
      # three years, the hours-saved bars and the build-and-upkeep bars, one
      # after the other as the sentence names them, so no apply adds more than
      # three labels.
      - id: b3-s1
        type: whiteboard.apply
        at: { mark: b3-s1 }
        open: true
        clear: true
        upsertIds: [l17-b3-title, l17-b3-axis]
      - id: b3-s1b
        type: whiteboard.apply
        at: { mark: b3-s1b }
        upsertIds: [l17-b3-y1, l17-b3-y2, l17-b3-y3]
        drawMs: 900
      - id: b3-s1c
        type: whiteboard.apply
        at: { afterAction: b3-s1b }
        upsertIds: [l17-b3-lg-save, l17-b3-s1, l17-b3-s2, l17-b3-s3]
        drawMs: 1500
      - id: b3-s1d
        type: whiteboard.apply
        at: { afterAction: b3-s1c }
        upsertIds: [l17-b3-lg-cost, l17-b3-c1, l17-b3-c2, l17-b3-c3]
        drawMs: 1500
      - id: b3-s2
        type: whiteboard.apply
        at: { mark: b3-s2 }
        upsertIds: [l17-b3-lg-fmt, l17-b3-f1, l17-b3-f2, l17-b3-f3]
        drawMs: 1500
      - {
          id: b3-s3,
          type: whiteboard.apply,
          at: { mark: b3-s3 },
          upsertIds: [l17-b3-retire, l17-b3-retire-t],
          drawMs: 900,
        }
      - {
          id: close-b3,
          type: whiteboard.apply,
          at: { mark: close-b3, offsetMs: -400 },
          open: false,
        }
      - { id: show-p03c, type: slide.show, at: { mark: show-p03c }, slideId: l17-p03c }
      - { id: show-p03d, type: slide.show, at: { mark: show-p03d }, slideId: l17-p03d }

  - id: automation-hurts
    chapter: Automation ရဲ့ အန္တရာယ်
    narration: >
      [[mark:show-p04]] automation ကလည်း ဒီ နည်း သုံးမျိုးနဲ့ ထိခိုက်စေနိုင်ပါတယ်။ Eats မှာ rider တွေကို order ခွဲပေးတဲ့ dispatch service က memory leak ဖြစ်နေလို့ memory ၈၅ ရာခိုင်နှုန်း ရောက်တိုင်း restart လုပ်ပေးတဲ့ watchdog ထည့်ထားပါတယ်၊ တကယ့် fix က အပတ်တွေ ကြာမှာမို့ တစ်ရက် တစ်ခါဆို တန်ပါတယ်။
      [[mark:show-p04b]] ဒါပေမဲ့ သင်္ကြန် promotion မှာ မိနစ် ၄၀ တိုင်း restart ဖြစ်ပြီး ခွဲပေးလက်စ order တွေ ပျောက်ကုန်ပေမဲ့ dashboard က အစိမ်းပဲ ပြနေပါတယ်။ automation က မမျှော်လင့်တာ လုပ်လို့ ဘာဖြစ်နေလဲ ဘယ်သူမှ ချက်ချင်း နားမလည်တာကို automation surprise လို့ ခေါ်ပါတယ်။ watchdog က ပျက်နေတဲ့ design ကိုလည်း ဖုံးထားလို့ deploy တွေထက် restart ပိုခဏခဏ ဖြစ်ရင် leak ပြင်တာကို စာရင်းထိပ်ဆုံး တင်ရပါမယ်။
      [[mark:show-p04c]] ၁၉၈၃ မှာ Lisanne Bainbridge က ပျက်သွားတဲ့ automation ဆီက အလုပ်ကို ဝင်ယူရတာ လက်နဲ့ အစကနေ လုပ်တာထက် ပိုခက်တယ်၊ ရှားတဲ့ အရာကို ကြာကြာ စောင့်ကြည့်ဖို့လည်း လူတွေ မတော်ဘူးလို့ သတိထားမိခဲ့ပါတယ်။ automation ကောင်းလေ ခက်တဲ့ case တွေအတွက် လူ့ ကျွမ်းကျင်မှု ဆုံးလေ ဖြစ်တာကို ironies of automation လို့ ခေါ်ပါတယ်၊ watchdog ရှိလာကတည်းက dispatch ကို လက်နဲ့ ငြိမ်အောင် လုပ်တတ်တဲ့သူ နည်းလာသလိုပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book, 1st ed: The Evolution of Automation at Google",
