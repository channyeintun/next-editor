# SRE from zero, lesson 17: Toil and automation (Burmese concept lesson).
#
# Built from the approved voice script
# docs/sre-course/voice-scripts/sre-17-toil-and-automation.md. Every spoken
# character is that script's "> " lines, unchanged; each ⟪…⟫ marker became a
# [[mark:…]] at the same place. Check it with:
#   bun ~/Documents/sre-course/work/check-narration.ts \
#     docs/sre-course/voice-scripts/sre-17-toil-and-automation.md \
#     src/studio/scripts/sre-17-toil-and-automation.yaml
#
# Nothing runs: deck pages and the whiteboard carry the lesson, and notes.md is
# the recap. The workspace and runtime follow the validated no-code skeleton
# (WebContainer, empty init command, a harmless dev script).
#
# The arc: the toil audit (cover: 55% hand-work, 11 of 70 pages needed action),
# and Module 5 opens on the loop's build station (m5_map). Board B1 sorts the
# audit into toil and engineering; board B2, toil feeding on itself; pages,
# treating toil like an SLO and why to automate; board B3, the morning
# reconciliation's break-even; pages, Padauk's path to removing the task and
# the three ways automation hurts; board B4, the promo SMS tool's empty input
# and its guards; board B5, the failover bot's record and its action card;
# this week; recap on notes.md.
#
# Seven marks add no spoken text and sit at an existing ။:
# - b1-s3b, b3-s1b, b4-s1b, b5-s1b and b5-s2b land a board piece on the
#   sentence that names it instead of 11-15 s early: B1's warning line; B3's
#   three years, then (afterAction) its hours-saved and build-and-upkeep bars;
#   B4's red lane; B5's two record bars; the first action-card row.
# - b4-s3b lands B4's second guard line ("all" picked on purpose, stop and ask
#   a human) where the sentence naming its first item ends, about 18 s after
#   the first line, so each apply adds one labelled line.
# - ask-question makes the recap question its own dialog so the question-line
#   select can hang off it for the ⟪pause 3s⟫, as in lesson 30 (see
#   select-question). sel-question is the voice script's ⟪select မေးခွန်း⟫;
#   it only splits the short lead-in from the question.
# Pacing: at 70 ms/char no page or board step holds longer than ~30 s (the
# cover, l17_p01, from its show to the module map), so the voice script's own
# markers carry it and no pacing page or board step was added.
#
# ⟪close board⟫ straight into the next board (scenes 3 and 9) wipes the open
# board 400 ms early (whiteboard.apply clear) instead of closing the panel, as
# in lesson 16, so the editor does not flash between two boards; the next
# board then draws with open: true, clear: true as usual. A board followed by
# a deck page closes the panel (open: false) 400 ms before the page, and a
# deck page followed by a board closes the page 400 ms before, as in Module 1.
#
# Boards (B1 two columns, B2 P3 ring, B3 P5 bars, B4 P6 lanes, B5 P5 bars over
# two card rows). Colour jobs: #1e1e1e ink (paints white) for titles, axes,
# year labels and the arrows between boxes; blue the thing named (the
# engineering column, build + upkeep, the promo SMS tool, the action-card
# rows); green healthy or done (hours saved, refusing empty input with a clear
# error, 38 right, acts then tells); red failure or toil (the toil column, B2's
# toil, burnout and people leaving and the more-toil-each return, the
# 3-million-SMS lane, 2 wrong, the day the system is retired); orange the
# caveat or limit (temporary planned toil and the warning signs, no time to
# fix, the format changes, B4's guards, asks first always); violet the flow
# (B2's ring and its clockwise arrows). B2's nodes are filled white, which
# paints dark, so the ring does not run through their labels. Titles, axes,
# column headings, B2's ring and B5's "action card" heading are furniture and
# land without drawMs. A label on two or three lines is one text asset per
# line, so each line meets the 0.55 em width rule on its own; every label was
# also measured with the real fallback font against the box it sits in
# (wb-fit.mjs: 0 spills).
# Where the boards differ from the voice script's sketches:
# - B3 carries its numbers on three legend lines (hours saved 152 · 304 · 456,
#   build + upkeep 116 · 152 · 188), not on nine bars, so the board holds
#   eight labels; the orange line starts with "+" because its numbers (176 ·
#   272 · 368) are the new totals, the tops of the stacked blue and orange bars.
# - B4's tool box and first red box set their labels on three lines, not two:
#   as two lines ("user အုပ်စု = (အလွတ်)", "registered user အားလုံး", 21 and
#   23 code points) the tool box, the red box and the 3-million box need
#   343 + 374 + 236 px under the 0.55 rule, more than the 850 px visible area
#   with two arrows; as three lines 236 + 251 + 236 px.
# - B2's return to toil is drawn as a red arrow on the upper-left arc beside
#   the "more toil each" label, so "back to toil" reads clockwise.
#
# Deck pages: deck "Next Editor · SRE 5A · Toil and tests", published; deckUrl
# is its /pub link. Its l17 pages and m5_map are built later from the page
# plan, so until then the Director reports page "l17_p01" missing from the
# published deck. The voice script lights l17_p03d's last chip; the K6 kit has
# no lit state, so the page plan carries that as a note. Scene 7 also cites
# Bainbridge's paper, the curriculum's public source for the 1983 finding it
# names (URL checked 2026-10-21). Page plan:
# ~/Documents/sre-course/work/pages/sre-17-toil-and-automation.json
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/sre-17-toil-and-automation.yaml
#   bun scripts/studio-compile-check.ts src/studio/scripts/sre-17-toil-and-automation.yaml
