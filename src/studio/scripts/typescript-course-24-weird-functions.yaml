  - id: arrow
    chapter: "Arrow function ရဲ့ this"
    narration: >
      [[mark:select-arrow]] အခု ခြောက်နံပါတ် စားပွဲရဲ့ list method ကို ကြည့်ရအောင်။ map ထဲက ဒီ arrow
      function ကလည်း this ကို သုံးထားပေမယ့် error မရှိပါဘူး။ [[mark:type-arrow-query]] arrow function
      ထဲက this ရဲ့ type ကို query comment နဲ့ မေးကြည့်ပါမယ်။ [[mark:read-arrow-query]] Types မှာ နံပါတ်၊
      အော်ဒါ စာရင်းနဲ့ list method ပါတဲ့ object type ပေါ်လာပါတယ်။ ဒါက စားပွဲ ခြောက် object ရဲ့ type ပါ။
      arrow function မှာ ကိုယ်ပိုင် this မရှိတဲ့အတွက်၊ သူ့ကို ရေးထားတဲ့ list method ရဲ့ this ကို
      ယူသုံးတာပါ။ [[mark:read-arrow-output]] Output ထဲက အော်ဒါ နှစ်ခုလုံးရဲ့ ရှေ့မှာ စားပွဲ နံပါတ်
      ခြောက် ပါနေတာလည်း ဒါကြောင့်ပါ။ arrow function မှာ this parameter ရေးခွင့် မရှိတာလည်း ဒီ
      အကြောင်းကြောင့်ပါ။ map ထဲမှာ function keyword နဲ့ ရေးထားရင်တော့ သူ့မှာ ကိုယ်ပိုင် this
      ရှိသွားပြီး၊ list ရဲ့ this ကို မမြင်ရတော့ပါဘူး။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 12: The Weird Parts (arrow functions and this)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/the-weird-parts",
        }
      - {
          title: "TypeScript Handbook: Classes (arrow functions and this parameters)",
          url: "https://www.typescriptlang.org/docs/handbook/2/classes.html#arrow-functions",
        }
      - {
          title: "MDN: Arrow function expressions (no own this)",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Functions/Arrow_functions",
        }
    actions:
      - id: select-arrow
        type: editor.select
        at: { mark: select-arrow }
        target: { file: src/main.ts, text: "(item) => `${this.number}: ${item}`", occurrence: 1 }
      - id: type-arrow-query
        type: editor.type
        at: { mark: type-arrow-query }
        target:
          {
            file: src/main.ts,
            after: "    return this.orders.map((item) => `${this.number}: ${item}`);\n",
            occurrence: 1,
          }
        text: "    //                                  ^?\n"
        cadence: block
      - id: expect-arrow-this
        type: expect.preview
        at: { afterAction: type-arrow-query }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        textContains: "list(): string[];"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-arrow-this-start
        type: expect.preview
        at: { afterAction: expect-arrow-this }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-1 }
        textContains: "this: {"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-arrow-output
        type: expect.preview
        at: { afterAction: expect-arrow-this-start }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-3 }
        textContains: "[ '6: ကော်ဖီ', '6: မုန့်ဟင်းခါး' ]"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: params
    chapter: "Parameter နည်းရင် ရ၊ များရင် မရ"
    narration: >
      [[mark:select-onready-type]] နောက်ထပ် ထူးဆန်းချက်က callback ရဲ့ parameter အရေအတွက်ပါ။ callback
      type က ပစ္စည်း နာမည်နဲ့ စားပွဲ နံပါတ်၊ parameter နှစ်ခု ပေးပါတယ်။ [[mark:select-short-callback]]
      ဒါပေမဲ့ ring ကို ပေးထားတဲ့ ဒီ callback က ပစ္စည်း နာမည် တစ်ခုပဲ ယူထားပြီး၊ error လည်း မရှိပါဘူး။
      JavaScript မှာ argument ပိုပေးရင် function က ပိုတာကို လျစ်လျူရှုလိုက်တဲ့အတွက်၊ မလိုတဲ့ parameter
      ကို မယူတာက ဘေးကင်းလို့ပါ။ forEach ဒါမှမဟုတ် map ထဲမှာ item တစ်ခုတည်း ယူတဲ့ callback ရေးလို့
      ရတာလည်း ဒါကြောင့်ပါ။ အဲဒီ method တွေက item ရယ်၊ index ရယ်၊ array တစ်ခုလုံးရယ်၊ argument သုံးခု
      ပေးပေမယ့် ကိုယ် လိုတာကိုပဲ ယူလို့ ရပါတယ်။ [[mark:type-more-params]] ပြောင်းပြန် ကြည့်ရအောင်။ သကြား
      အဆင့်ပါ လိုချင်လို့ parameter သုံးခု ယူတဲ့ function တစ်ခု ရေးပြီး ring ကို ပေးကြည့်ပါမယ်။
      [[mark:read-more-params]] error ပေါ်လာပါပြီ။ callback type က argument နှစ်ခုပဲ ပေးနိုင်ပြီး၊ ဒီ
      function က သုံးခု လိုနေတယ်လို့ ပြောပါတယ်။ Output မှာ သကြား နေရာ undefined ဖြစ်နေတာ မြင်ရပါတယ်။
      ring က တတိယ argument ကို ဘယ်တော့မှ မပေးမှာ ဖြစ်လို့ TypeScript က လက်မခံတာပါ။
      [[mark:type-comment-ring]] ဒီ ခေါ်တဲ့ line ကို comment လုပ်ပြီး ပိတ်လိုက်ပါမယ်။
    sources:
      - {
          title: "TypeScript Handbook: Type Compatibility (comparing two functions)",
          url: "https://www.typescriptlang.org/docs/handbook/type-compatibility.html#comparing-two-functions",
        }
      - {
          title: "Total TypeScript Essentials, ch. 12: The Weird Parts (function assignability)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/the-weird-parts",
        }
    actions:
      - id: select-onready-type
        type: editor.select
        at: { mark: select-onready-type }
        target: { file: src/main.ts, text: "(item: string, table: number) => void", occurrence: 1 }
      - id: select-short-callback
        type: editor.select
        at: { mark: select-short-callback }
        target:
          { file: src/main.ts, text: 'ring((item) => console.log(item, "အဆင်သင့်"));', occurrence: 1 }
      - id: type-more-params
        type: editor.type
        at: { mark: type-more-params }
        target:
          {
            file: src/main.ts,
            after: "ring((item) => console.log(item, \"အဆင်သင့်\"));\n",
            occurrence: 1,
          }
        text: "\nfunction ringWithSugar(item: string, table: number, sugar: string) {\n  console.log(item, table, sugar);\n}\nring(ringWithSugar);\n"
        cadence: line-by-line
      - id: expect-more-error
        type: expect.preview
        at: { afterAction: type-more-params }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-more-message
        type: expect.preview
        at: { afterAction: expect-more-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Target signature provides too few arguments. Expected 3 or more, but got 2."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-more-undefined
        type: expect.preview
        at: { afterAction: expect-more-message }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-5 }
        textContains: "လက်ဖက်ရည် 5 undefined"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-comment-ring
        type: editor.type
        at: { mark: type-comment-ring }
        target:
          { file: src/main.ts, after: "  console.log(item, table, sugar);\n}\n", occurrence: 1 }
        text: "// "
      - id: expect-ring-off
        type: expect.preview
        at: { afterAction: type-comment-ring }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: unions
    chapter: "Function union ကို ခေါ်ခြင်း"
    narration: >
      [[mark:type-printers]] function တွေရဲ့ နောက်ဆုံး ထူးဆန်းချက်က function union ပါ။ အော်ဒါ တစ်ခုကို
      မီးဖိုချောင်နဲ့ ငွေကိုင် နှစ်နေရာလုံး ပို့ချင်လို့ printer function နှစ်ခုကို array ထဲ ထည့်ပါမယ်။
      ပထမ တစ်ခုက ပစ္စည်း နာမည် ပါတဲ့ object ကို လိုပြီး၊ ဒုတိယ တစ်ခုက စားပွဲ နံပါတ် ပါတဲ့ object ကို
      လိုပါတယ်။ ပြီးတော့ loop ပတ်ပြီး တစ်ခုချင်းကို ကော်ဖီ အော်ဒါနဲ့ ခေါ်ပါမယ်။ [[mark:read-printers]]
      Output မှာ ငွေကိုင်ဆီ ရောက်တဲ့ စားပွဲ နံပါတ်က undefined ဖြစ်နေပြီး၊ Errors မှာလည်း error တစ်ခု
      ပေါ်လာပါတယ်။ loop ထဲမှာ ခေါ်နေတာက နှစ်ခုထဲက ဘယ် function လဲ ဆိုတာ TypeScript မသိနိုင်တဲ့အတွက်၊
      argument က နှစ်ခုလုံးနဲ့ ကိုက်ရပါမယ်။ ဒါကြောင့် parameter type နှစ်ခုကို ပေါင်းထားတဲ့ intersection
      type ကို လိုချင်ပြီး၊ စားပွဲ နံပါတ် ပျောက်နေတယ်လို့ ပြောတာပါ။ [[mark:type-add-table]] စားပွဲ
      နံပါတ်ကို ထည့်ပေးလိုက်ပါမယ်။ [[mark:read-add-table]] error ပျောက်ပြီး၊ ငွေကိုင်ဆီမှာလည်း စားပွဲ
      ငါး ရောက်သွားပါပြီ။ [[mark:type-labels]] ဒါဆို parameter type တွေ လုံးဝ မတူတဲ့ function နှစ်ခု
      ဆိုရင်ရော ဘာ ဖြစ်မလဲ။ ဂဏန်း လိုတဲ့ function နဲ့ စာသား လိုတဲ့ function ကို array ထဲ ထည့်ပြီး
      ဂဏန်းနဲ့ ခေါ်ကြည့်ပါမယ်။ [[mark:read-labels]] ဒီတစ်ခါ argument ကို never နေရာမှာ ထည့်လို့
      မရဘူးလို့ ပြောပါတယ်။ number လည်း ဖြစ် string လည်း ဖြစ်တဲ့ တန်ဖိုး မရှိတဲ့အတွက် intersection က
      never ဖြစ်သွားတာပါ။ Output မှာလည်း ဂဏန်းကို စာသားလို trim လုပ်ဖို့ ကြိုးစားလို့ program
      ရပ်သွားပါတယ်။ ဒီလို union ကို တိုက်ရိုက် မခေါ်ဘဲ၊ narrowing နဲ့ ဘယ် function လဲ ခွဲပြီးမှ
      ခေါ်ရပါမယ်။ [[mark:type-comment-labels]] ဒီ line ကိုလည်း comment လုပ်ပြီး ပိတ်လိုက်ပါမယ်။
    sources:
      - {
          title: "TypeScript 3.3 release notes: improved behavior for calling union types",
          url: "https://www.typescriptlang.org/docs/handbook/release-notes/typescript-3-3.html#improved-behavior-for-calling-union-types",
        }
      - {
          title: "Total TypeScript Essentials, ch. 12: The Weird Parts (unions of functions)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/the-weird-parts",
        }
      - {
          title: "TypeScript Handbook: Object Types (intersection types)",
          url: "https://www.typescriptlang.org/docs/handbook/2/objects.html#intersection-types",
        }
    actions:
      - id: type-printers
        type: editor.type
        at: { mark: type-printers }
        target: { file: src/main.ts, after: "// ring(ringWithSugar);\n", occurrence: 1 }
        text: "\nconst printers = [\n  (order: { item: string }) => console.log(\"မီးဖိုချောင်\", order.item),\n  (order: { table: number }) => console.log(\"ငွေကိုင်\", order.table),\n];\nfor (const print of printers) print({ item: \"ကော်ဖီ\" });\n"
        cadence: line-by-line
      - id: expect-printers-error
        type: expect.preview
        at: { afterAction: type-printers }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-printers-intersection
        type: expect.preview
        at: { afterAction: expect-printers-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "is not assignable to parameter of type '{ item: string; } & { table: number; }'."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-printers-missing
        type: expect.preview
        at: { afterAction: expect-printers-intersection }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Property 'table' is missing in type '{ item: string; }' but required in type '{ table: number; }'."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-cashier-undefined
        type: expect.preview
        at: { afterAction: expect-printers-missing }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-6 }
        textContains: "ငွေကိုင် undefined"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-add-table
        type: editor.type
        at: { mark: type-add-table }
        target: { file: src/main.ts, after: 'print({ item: "ကော်ဖီ"', occurrence: 1 }
        text: ", table: 5"
        cadence: fast-explainer
      - id: expect-table-fixed
        type: expect.preview
        at: { afterAction: type-add-table }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-cashier-five
        type: expect.preview
        at: { afterAction: expect-table-fixed }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-6 }
        textContains: "ငွေကိုင် 5"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-labels
        type: editor.type
        at: { mark: type-labels }
        target:
          { file: src/main.ts, after: "print({ item: \"ကော်ဖီ\", table: 5 });\n", occurrence: 1 }
        text: "\nconst labels = [\n  (price: number) => `${price} ကျပ်`,\n  (name: string) => name.trim(),\n];\nfor (const label of labels) console.log(label(1500));\n"
        cadence: line-by-line
      - id: expect-never-error
        type: expect.preview
        at: { afterAction: type-labels }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-never-message
        type: expect.preview
        at: { afterAction: expect-never-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Argument of type '1500' is not assignable to parameter of type 'never'."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-trim-crash
        type: expect.preview
        at: { afterAction: expect-never-message }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-8 }
        textContains: "Uncaught TypeError: name.trim is not a function"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-comment-labels
        type: editor.type
        at: { mark: type-comment-labels }
        target:
          { file: src/main.ts, after: "  (name: string) => name.trim(),\n];\n", occurrence: 1 }
        text: "// "
      - id: expect-labels-off
        type: expect.preview
        at: { afterAction: type-comment-labels }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: worlds
    chapter: "Type world နဲ့ value world"
    narration: >
      [[mark:board-worlds]] နောက်ဆုံး ထူးဆန်းချက်ကတော့ နာမည်တွေ နေတဲ့ နေရာ နှစ်ခုပါ။
      [[mark:draw-type-world]] type world ဆိုတာ TypeScript စစ်နေတဲ့ အချိန်မှာပဲ ရှိပြီး JavaScript
      ဖြစ်သွားတဲ့အခါ ပျောက်သွားတဲ့ နာမည်တွေပါ။ [[mark:draw-value-world]] value world ကတော့ program run
      တဲ့ အချိန်မှာ တကယ် ရှိနေတဲ့ တန်ဖိုးတွေပါ။ [[mark:draw-both]] နာမည် တချို့ကတော့ နှစ်ဘက်လုံးမှာ
      ရှိပါတယ်။ class ရယ်၊ enum ရယ်၊ နာမည်တူ ပေးထားတဲ့ const နဲ့ type ရယ်ပါ။ [[mark:close-worlds-board]]
      ဒါကို JavaScript output နဲ့ ကြည့်ရအောင်။ [[mark:open-worlds-file]] ဒီ ဖိုင်မှာ type alias တစ်ခုနဲ့
      ဆိုင်နာမည် const တစ်ခု ရှိပါတယ်။ panel ရဲ့ JavaScript output မှာ ဒီ ဖိုင်ကို ပြောင်းထားတဲ့
      JavaScript ကို ပြထားပါတယ်။ အဲဒီမှာ const ပဲ ကျန်ပြီး type alias ပျောက်နေတာ တွေ့ရပါမယ်။ main ဖိုင်က
      import လုပ်ခဲ့တာလည်း ဒီ value world ထဲက ဆိုင်နာမည်ပါ။ [[mark:type-enum-class]] enum တစ်ခုနဲ့ class
      တစ်ခု ထည့်ပါမယ်။ [[mark:read-enum-class]] JavaScript output မှာ enum က object တစ်ခု ဖြစ်လာပြီး
      class လည်း ရှိနေပါတယ်။ ဒါကြောင့် သူတို့က value world မှာလည်း ရှိပါတယ်။ [[mark:select-size-line]]
      class ထဲက ဒီ line ကို ကြည့်ပါ။ Size ကို နှစ်ခါ သုံးထားပါတယ်။ ပထမ တစ်ခါက type annotation နေရာမှာ
      type အနေနဲ့၊ ဒုတိယ တစ်ခါက တန်ဖိုး နေရာမှာ value အနေနဲ့ပါ။ JavaScript output မှာ type အနေနဲ့
      သုံးထားတဲ့ အပိုင်း ပျောက်ပြီး value အပိုင်းပဲ ကျန်ပါတယ်။ [[mark:type-sugar]] နာမည်တူ const နဲ့
      type ကိုလည်း ကိုယ်တိုင် ရေးလို့ ရပါတယ်။ as const object တစ်ခုနဲ့၊ သူ့ value တွေကနေ ထုတ်ထားတဲ့ type
      ကို Sugar ဆိုတဲ့ နာမည် တစ်ခုတည်း ပေးပါမယ်။ [[mark:read-sugar]] JavaScript output မှာ const ပဲ
      ကျန်ပြီး type line မပါပါဘူး။ [[mark:type-first]] အခု သူတို့ကို သုံးကြည့်ရအောင်။
      [[mark:select-first-cup]] type annotation နေရာက Cup နဲ့ Sugar ပျောက်သွားပြီး၊ new နဲ့ ဖန်တီးတဲ့
      Cup နဲ့ Sugar ရဲ့ Extra တန်ဖိုးကတော့ ကျန်နေပါတယ်။ နာမည် တူပေမယ့် TypeScript က ရေးထားတဲ့ နေရာကို
      ကြည့်ပြီး ဘယ် world က နာမည်လဲ ခွဲသိတာပါ။ class ကို type အနေနဲ့ သုံးရင် အဲဒီ class နဲ့ ဖန်တီးထားတဲ့
      object ကို ဆိုလိုပြီး၊ class ကိုယ်တိုင်ကို ဆိုလိုတာ မဟုတ်ပါဘူး။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 12: The Weird Parts (the type and value worlds)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/the-weird-parts",
        }
      - {
          title: "TypeScript Handbook: Declaration Merging (basic concepts: types, values, namespaces)",
          url: "https://www.typescriptlang.org/docs/handbook/declaration-merging.html#basic-concepts",
        }
      - {
          title: "TypeScript Handbook: Enums (enums at runtime)",
          url: "https://www.typescriptlang.org/docs/handbook/enums.html#enums-at-runtime",
        }
    actions:
      - id: board-worlds
        type: whiteboard.apply
        at: { mark: board-worlds }
        open: true
        clear: true
        upsertIds: [w-title]
      - id: draw-type-world
        type: whiteboard.apply
        at: { mark: draw-type-world }
        upsertIds: [w-type-box, w-type-name, w-type-sub, w-type-ex]
        drawMs: 2400
      - id: draw-value-world
        type: whiteboard.apply
        at: { mark: draw-value-world }
        upsertIds: [w-value-box, w-value-name, w-value-sub, w-value-ex]
        drawMs: 2400
      - id: draw-both
        type: whiteboard.apply
        at: { mark: draw-both }
        upsertIds: [w-both-box, w-both-name, w-both-ex]
        drawMs: 2400
      - id: close-board-worlds
        type: whiteboard.apply
        at: { mark: close-worlds-board }
        open: false
      - id: open-worlds
        type: workspace.openFile
        at: { mark: open-worlds-file }
        path: src/worlds.ts
      - id: select-worlds-start
        type: editor.select
        at: { afterAction: open-worlds }
        target:
          {
            file: src/worlds.ts,
            text: "export type TableNumber = number;\nexport const shopName = \"ရွှေလက်ဖက်ရည်ဆိုင်\";",
            occurrence: 1,
          }
      - id: expect-js-start
        type: expect.preview
        at: { afterAction: select-worlds-start }
        timeoutMs: 5000
        target: { by: testId, value: ts-js-1 }
        textContains: 'export const shopName = "ရွှေလက်ဖက်ရည်ဆိုင်";'
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-enum-class
        type: editor.type
        at: { mark: type-enum-class }
        target:
          { file: src/worlds.ts, after: "export const shopName = \"ရွှေလက်ဖက်ရည်ဆိုင်\";\n", occurrence: 1 }
        text: "\nexport enum Size {\n  Small = \"small\",\n  Large = \"large\",\n}\n\nexport class Cup {\n  size: Size = Size.Small;\n}\n"
        cadence: block
      - id: expect-js-enum
        type: expect.preview
        at: { afterAction: type-enum-class }
        timeoutMs: 8000
        target: { by: testId, value: ts-js-1 }
        textContains: 'Size["Small"] = "small";'
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-js-class
        type: expect.preview
        at: { afterAction: expect-js-enum }
        timeoutMs: 5000
        target: { by: testId, value: ts-js-1 }
        textContains: "size = Size.Small;"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: select-size-line
        type: editor.select
        at: { mark: select-size-line }
        target: { file: src/worlds.ts, text: "size: Size = Size.Small;", occurrence: 1 }
      - id: type-sugar
        type: editor.type
        at: { mark: type-sugar }
        target: { file: src/worlds.ts, after: "  size: Size = Size.Small;\n}\n", occurrence: 1 }
        text: "\nexport const Sugar = { Less: \"less\", Normal: \"normal\", Extra: \"extra\" } as const;\nexport type Sugar = (typeof Sugar)[keyof typeof Sugar];\n"
        cadence: block
      - id: expect-js-sugar
        type: expect.preview
        at: { afterAction: type-sugar }
        timeoutMs: 8000
        target: { by: testId, value: ts-js-1 }
        textContains: 'export const Sugar = { Less: "less", Normal: "normal", Extra: "extra" };'
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-first
        type: editor.type
        at: { mark: type-first }
        target:
          {
            file: src/worlds.ts,
            after: "export type Sugar = (typeof Sugar)[keyof typeof Sugar];\n",
            occurrence: 1,
          }
        text: "\nexport const firstCup: Cup = new Cup();\nexport const firstSugar: Sugar = Sugar.Extra;\n"
        cadence: line-by-line
      - id: expect-js-first-cup
        type: expect.preview
        at: { afterAction: type-first }
        timeoutMs: 8000
        target: { by: testId, value: ts-js-1 }
        textContains: "export const firstCup = new Cup();"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-js-first-sugar
        type: expect.preview
        at: { afterAction: expect-js-first-cup }
        timeoutMs: 5000
        target: { by: testId, value: ts-js-1 }
        textContains: "export const firstSugar = Sugar.Extra;"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-worlds-clean
        type: expect.preview
        at: { afterAction: expect-js-first-sugar }
        timeoutMs: 5000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: select-first-cup
        type: editor.select
        at: { mark: select-first-cup }
        target:
          { file: src/worlds.ts, text: "export const firstCup: Cup = new Cup();", occurrence: 1 }

  - id: recap
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ function keyword နဲ့ ရေးတဲ့ function ရဲ့ this က ခေါ်တဲ့
      ပုံပေါ် မူတည်လို့ this parameter နဲ့ type ပေးနိုင်ပြီး၊ arrow function ကတော့ ပတ်လည်က this ကို
      ယူပါတယ်။ callback က ပေးတာထက် parameter နည်းနည်း ယူလို့ ရပေမယ့် ပိုယူလို့ မရပါဘူး။
      [[mark:recap-union]] function union ကို ခေါ်ရင် argument က အားလုံးနဲ့ ကိုက်ရလို့ intersection
      ဖြစ်လာပြီး၊ never အထိ ဖြစ်သွားနိုင်ပါတယ်။ နာမည်တွေကတော့ type world ဒါမှမဟုတ် value world ဒါမှမဟုတ်
      နှစ်ဘက်လုံးမှာ နေပြီး၊ JavaScript ထဲ ရောက်တာက value world ပဲ ဖြစ်ပါတယ်။ နောက် lesson မှာတော့
      module ရယ် script ရယ်၊ type world အတွက်ပဲ ရေးထားတဲ့ declaration file တွေကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 12: The Weird Parts",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/the-weird-parts",
        }
    actions:
      - id: open-main-recap
        type: workspace.openFile
        at: { mark: recap }
        path: src/main.ts
      - id: select-this-recap
        type: editor.select
        at: { afterAction: open-main-recap }
        target: { file: src/main.ts, text: "function summary(this: Table) {", occurrence: 1 }
      - id: expect-file-this
        type: expect.file
        at: { afterAction: select-this-recap }
        path: src/main.ts
        contains: "function summary(this: Table) {"
      - id: expect-file-call
        type: expect.file
        at: { afterAction: expect-file-this }
        path: src/main.ts
        contains: "// console.log(summary());"
      - id: expect-file-ring
        type: expect.file
        at: { afterAction: expect-file-call }
        path: src/main.ts
        contains: "// ring(ringWithSugar);"
      - id: expect-file-print
        type: expect.file
        at: { afterAction: expect-file-ring }
        path: src/main.ts
        contains: 'for (const print of printers) print({ item: "ကော်ဖီ", table: 5 });'
      - id: expect-file-labels
        type: expect.file
        at: { afterAction: expect-file-print }
        path: src/main.ts
        contains: "// for (const label of labels) console.log(label(1500));"
      - id: expect-file-worlds
        type: expect.file
        at: { afterAction: expect-file-labels }
        path: src/worlds.ts
        contains: "export const firstCup: Cup = new Cup();\nexport const firstSugar: Sugar = Sugar.Extra;"
checks:
  - { type: timing.p95Ms, max: 300 }
