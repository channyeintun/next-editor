build:
  # Studio replaces this built-in profile at render time with the Burmese provider chosen in the
  # render console (AthanLab with the user's own key, or VoxCPM2 when that feature is enabled).
  voiceProfile: pocket-alba-v1
  seed: 2402
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "this က ဘယ်သူလဲ"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ object type တွေ open ဖြစ်တာကြောင့် ဖြစ်လာတဲ့
      ထူးဆန်းချက်တွေကို ကြည့်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ ထူးဆန်းတဲ့ အပိုင်း ဒုတိယ ပိုင်းအနေနဲ့ function
      တွေထဲက this ရယ်၊ callback ရဲ့ parameter အရေအတွက်ရယ်၊ function union တွေရယ်၊ နောက်ဆုံးမှာ type
      world နဲ့ value world အကြောင်းကို ကြည့်သွားပါမယ်။ [[mark:draw-this-rule]] this ကနေ စကြည့်ရအောင်။
      function keyword နဲ့ ရေးထားတဲ့ function ထဲက this ကို၊ function ရေးထားတဲ့ နေရာက မဆုံးဖြတ်ဘဲ ခေါ်တဲ့
      ပုံက ဆုံးဖြတ်ပါတယ်။ [[mark:draw-this-method]] object တစ်ခုပေါ်ကနေ အစက်နဲ့ ခေါ်ရင်၊ this က အဲဒီ
      အစက်ရှေ့က object ဖြစ်ပါတယ်။ [[mark:draw-this-alone]] အဲဒီ function ကိုပဲ object မပါဘဲ တစ်ခုတည်း
      ခေါ်လိုက်ရင်တော့၊ module ထဲမှာ this က undefined ဖြစ်သွားပြီး this ပေါ်က property ကို ဖတ်တာနဲ့
      program ရပ်သွားပါမယ်။ [[mark:draw-this-arrow]] arrow function မှာတော့ ကိုယ်ပိုင် this မရှိပါဘူး။
      သူ့ကို ရေးထားတဲ့ နေရာ ပတ်လည်က this ကိုပဲ ယူသုံးပါတယ်။ ဒီ စည်းမျဉ်းတွေကို TypeScript က ဘယ်လို
      စစ်ပေးလဲ ဆိုတာ code နဲ့ ကြည့်ရအောင်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 12: The Weird Parts (this in functions)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/the-weird-parts",
        }
      - {
          title: "MDN: this",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/this",
        }
      - {
          title: "MDN: Arrow function expressions (no own this)",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Functions/Arrow_functions",
        }
    actions:
      - id: open-board-a
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [t-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-this-rule
        type: whiteboard.apply
        at: { mark: draw-this-rule }
        upsertIds: [t-rule]
        drawMs: 1600
      - id: draw-this-method
        type: whiteboard.apply
        at: { mark: draw-this-method }
        upsertIds: [t-method]
        drawMs: 1400
      - id: draw-this-alone
        type: whiteboard.apply
        at: { mark: draw-this-alone }
        upsertIds: [t-alone]
        drawMs: 1400
      - id: draw-this-arrow
        type: whiteboard.apply
        at: { mark: draw-this-arrow }
        upsertIds: [t-arrow, t-arrow-line]
        drawMs: 2000

  - id: starter
    narration: >
      [[mark:close-board]] ဒီနေ့ code ကို ကြည့်ရအောင်။ [[mark:open-main]] ဒါက ဆိုင်ရဲ့ စားပွဲတွေအတွက်
      program ပါ။ ထိပ်ဆုံးမှာ ဆိုင်နာမည်ကို တခြား ဖိုင်ကနေ import လုပ်ပြီး ထုတ်ပြပါတယ်။
      [[mark:select-summary]] ဒီ function က this ရဲ့ စားပွဲ နံပါတ်နဲ့ အော်ဒါ အရေအတွက်ကို စာကြောင်း
      တစ်ကြောင်းအဖြစ် ပြန်ပေးပါတယ်။ [[mark:select-table5]] ငါးနံပါတ် စားပွဲ object က ဒီ function ကို
      property အနေနဲ့ ယူထားပြီး၊ အောက်မှာ အစက်နဲ့ ခေါ်ထားပါတယ်။ [[mark:select-list]] ခြောက်နံပါတ်
      စားပွဲမှာတော့ list ဆိုတဲ့ method ရှိပြီး၊ map ထဲက arrow function နဲ့ အော်ဒါ တစ်ခုချင်းကို စားပွဲ
      နံပါတ်နဲ့ တွဲပေးပါတယ်။ [[mark:select-onready]] ဒါကတော့ မီးဖိုချောင်က အော်ဒါ အဆင်သင့် ဖြစ်တဲ့အခါ
      ခေါ်မယ့် callback ရဲ့ type ပါ။ ပစ္စည်း နာမည်နဲ့ စားပွဲ နံပါတ်ကို ပေးပါတယ်။ [[mark:select-ring]]
      ring function က အဲဒီ callback ကို လက်ဖက်ရည်နဲ့ ငါးနံပါတ် စားပွဲ ဆိုပြီး ခေါ်ပေးပါတယ်။
    sources:
      - {
          title: "MDN: Method definitions",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Functions/Method_definitions",
        }
      - {
          title: "TypeScript Handbook: More on Functions (function type expressions)",
          url: "https://www.typescriptlang.org/docs/handbook/2/functions.html#function-type-expressions",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: src/main.ts
      - id: select-summary
        type: editor.select
        at: { mark: select-summary }
        target:
          {
            file: src/main.ts,
            text: "function summary() {\n  return `စားပွဲ ${this.number} မှာ အော်ဒါ ${this.orders.length} ခု`;",
            occurrence: 1,
          }
      - id: select-table5
        type: editor.select
        at: { mark: select-table5 }
        target:
          {
            file: src/main.ts,
            text: "const table5 = { number: 5, orders: [\"လက်ဖက်ရည်\", \"ပလာတာ\"], summary };\nconsole.log(table5.summary());",
            occurrence: 1,
          }
      - id: select-list
        type: editor.select
        at: { mark: select-list }
        target:
          {
            file: src/main.ts,
            text: "  list() {\n    return this.orders.map((item) => `${this.number}: ${item}`);",
            occurrence: 1,
          }
      - id: select-onready
        type: editor.select
        at: { mark: select-onready }
        target:
          {
            file: src/main.ts,
            text: "type OnReady = (item: string, table: number) => void;",
            occurrence: 1,
          }
      - id: select-ring
        type: editor.select
        at: { mark: select-ring }
        target:
          {
            file: src/main.ts,
            text: "function ring(onReady: OnReady) {\n  onReady(\"လက်ဖက်ရည်\", 5);\n}",
            occurrence: 1,
          }

  - id: this-param
    chapter: "Function ရဲ့ this parameter"
    narration: >
      [[mark:panel-ready]] panel ရဲ့ Output မှာ ဆိုင်နာမည်၊ စားပွဲ ငါးမှာ အော်ဒါ နှစ်ခု၊ စားပွဲ
      ခြောက်ရဲ့ အော်ဒါ စာရင်းနဲ့ လက်ဖက်ရည် အဆင်သင့် ဆိုတဲ့ စာတွေ ထွက်နေပါတယ်။ ဒါပေမဲ့ Errors မှာတော့
      error နှစ်ခု ရှိပါတယ်။ [[mark:read-this-errors]] function ထဲက this နှစ်နေရာမှာ type annotation
      မရှိလို့၊ this က any ဖြစ်နေတယ်လို့ ပြောတာပါ။ ဒီ function ကို ဘယ် object ပေါ်ကနေ ခေါ်မလဲ ဆိုတာ
      TypeScript ကြိုမသိနိုင်လို့ပါ။ [[mark:type-this-param]] ဒါကြောင့် parameter နေရာရဲ့ ရှေ့ဆုံးမှာ
      this ဆိုတဲ့ နာမည်နဲ့ Table type ကို ကြေညာပေးလိုက်ပါမယ်။ [[mark:read-this-fixed]] error နှစ်ခုလုံး
      ပျောက်သွားပါပြီ။ ဒီ this parameter က တကယ့် parameter မဟုတ်ပါဘူး။ ခေါ်တဲ့ အခါ argument အနေနဲ့
      ပေးစရာ မလိုဘဲ၊ this က ဘာ ဖြစ်ရမလဲ ဆိုတာကိုပဲ TypeScript ကို ပြောတာပါ။ [[mark:type-call-alone]]
      ဒါဆို ဒီ function ကို object မပါဘဲ တစ်ခုတည်း ခေါ်ကြည့်ရအောင်။ [[mark:read-call-alone]] ခေါ်တဲ့
      နေရာမှာ error ပေါ်လာပါပြီ။ this က void ဖြစ်နေလို့ Table နဲ့ မကိုက်ဘူးလို့ ပြောပါတယ်။ Output
      မှာလည်း undefined ပေါ်က number ကို ဖတ်လို့ မရဘူး ဆိုတဲ့ အနီရောင် error နဲ့ program ရပ်သွားပါတယ်။
      this parameter ပေးထားရင် ဒီလို အမှားကို ခေါ်တဲ့ နေရာမှာတင် ဖမ်းပေးတာပါ။ [[mark:type-comment-call]]
      ဒီ line ကို comment လုပ်ပြီး ပိတ်လိုက်ပါမယ်။
    sources:
      - {
          title: "TypeScript Handbook: More on Functions (declaring this in a function)",
          url: "https://www.typescriptlang.org/docs/handbook/2/functions.html#declaring-this-in-a-function",
        }
      - {
          title: "TSConfig: noImplicitThis",
          url: "https://www.typescriptlang.org/tsconfig/#noImplicitThis",
