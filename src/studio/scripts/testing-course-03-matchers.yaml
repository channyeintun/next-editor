            if (typeof mod.default === "function") await mod.default(fresh);
          } catch (error) {
            if (mountedVersion === state.version) fresh.replaceChildren(el("div", { style: "padding:8px 14px;color:#b42318;font:13px ui-monospace,monospace" }, `${error?.name ?? "Error"}: ${error?.message ?? error}`));
          }
        }

        // ---------------------------------------------------------------- wiring
        let lastSeq = -1;
        function render(report) {
          if (!report) return;
          const state = report.running ? "running" : report.state;
          status.dataset.state = state;
          status.textContent = { waiting: "starting", running: "running", pass: "PASS", fail: "FAIL" }[state] ?? state;
