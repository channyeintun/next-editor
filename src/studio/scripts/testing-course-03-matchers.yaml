      သူတို့ ကျတဲ့အခါ panel က ပြတဲ့ ပုံစံတွေကို ဖတ်ကြည့်ပါမယ်။ [[mark:draw-anatomy]] test ထဲမှာ
      expect နဲ့ ရေးထားတဲ့ စစ်ချက် တစ်ခုကို assertion လို့ ခေါ်ပါတယ်။ assertion ဆိုတာ တန်ဖိုး တစ်ခု
      မှန်မမှန် စစ်ပြီး၊ မမှန်ရင် error throw လုပ်ပေးတဲ့ စစ်ချက်ပါ။ expect ထဲမှာ code က တကယ်
      ပြန်ပေးလိုက်တဲ့ တန်ဖိုးကို ထည့်ပြီး၊ နောက်က ဆက်ရေးတဲ့ matcher က ဘယ်လို စစ်မလဲ ဆိုတာကို
      ပြောပါတယ်။ ဖြစ်ရမယ့် တန်ဖိုးကိုတော့ matcher ထဲမှာ ထည့်ပေးပါတယ်။ [[mark:draw-q1]] ဘယ် matcher
      ကို ရွေးမလဲ ဆိုတာကတော့ ကိုယ် ဘာကို မေးချင်လဲ ဆိုတဲ့ အပေါ်မှာ မူတည်ပါတယ်။ ဂဏန်း ဒါမှမဟုတ်
      စာသား တစ်ခုက ဖြစ်ရမယ့် တန်ဖိုးနဲ့ အတိအကျ တူလား မေးချင်ရင် to Be ကို သုံးပါတယ်။
      [[mark:draw-q2]] object ဒါမှမဟုတ် array ရဲ့ အထဲက တန်ဖိုးတွေ အကုန် တူလား မေးချင်ရင်တော့
      to Equal ပါ။ [[mark:draw-q3]] စာရင်း တစ်ခုထဲမှာ ဒီ item ပါလား၊ စာသား တစ်ခုထဲမှာ ဒီ အပိုင်း ပါလား
      မေးချင်ရင် to Contain ကို သုံးပါတယ်။ [[mark:draw-q4]] object ရဲ့ field အကုန်လုံးကို မစစ်ဘဲ၊
      ကိုယ် ဂရုစိုက်တဲ့ field တချို့ ပါလား ဆိုတာပဲ စစ်ချင်ရင်တော့ to Match Object ကို သုံးပါတယ်။
    sources:
      - {
          title: "web.dev Learn Testing: Assertion helpers as primitives",
          url: "https://web.dev/learn/testing/assertions/tools#assertion-helpers",
        }
      - { title: "Vitest: Using Matchers", url: "https://vitest.dev/guide/learn/matchers" }
      - { title: "Vitest: expect", url: "https://vitest.dev/api/expect" }
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-anatomy
        type: whiteboard.apply
        at: { mark: draw-anatomy }
        upsertIds: [a-anatomy]
        drawMs: 2000
      - id: draw-q1
        type: whiteboard.apply
        at: { mark: draw-q1 }
        upsertIds: [a-q1, a-arrow-1, a-m1]
        drawMs: 2000
      - id: draw-q2
        type: whiteboard.apply
        at: { mark: draw-q2 }
        upsertIds: [a-q2, a-arrow-2, a-m2]
        drawMs: 2000
      - id: draw-q3
        type: whiteboard.apply
        at: { mark: draw-q3 }
        upsertIds: [a-q3, a-arrow-3, a-m3]
        drawMs: 2000
      - id: draw-q4
        type: whiteboard.apply
        at: { mark: draw-q4 }
        upsertIds: [a-q4, a-arrow-4, a-m4]
        drawMs: 2000

  - id: starter
    narration: >
      [[mark:close-board]] ဆိုင်ရဲ့ code ကို ကြည့်ရအောင်။ ဒါက ဘောင်ချာ ထုတ်ပေးတဲ့ receipt ဖိုင်ပါ။
      [[mark:select-format]] ဒီ function က ငွေ ပမာဏကို ယူပြီး၊ နောက်မှာ ကျပ် ဆိုတဲ့ စာလုံး တွဲထားတဲ့
      စာသားကို ပြန်ပေးပါတယ်။ ဘောင်ချာပေါ်က ဈေးနှုန်း တိုင်းကို ဒီ function နဲ့ ရေးတာပါ။
      [[mark:open-receipt-test]] သူ့ရဲ့ test ဖိုင်ကို ဖွင့်ကြည့်ရအောင်။ [[mark:select-comma]] ဆိုင်ရှင်က
      ဘောင်ချာပေါ်မှာ ဂဏန်းကြီးတွေကို ဖတ်ရ လွယ်အောင်၊ သုံးလုံးခြား ကော်မာ ခံပြီး ပြချင်ပါတယ်။
      ဒါကြောင့် ပထမ test က ၁၅၀၀ ကို ပေးရင် ကော်မာ ပါတဲ့ စာသား ပြန်ရမယ်လို့ to Be နဲ့ စစ်ထားပါတယ်။
      [[mark:select-length]] ဒုတိယ test ကတော့ လက်ဖက်ရည် နှစ်ခွက်နဲ့ ကော်ဖီ တစ်ခွက်ရဲ့ ဘောင်ချာကို line
      တွေ ခွဲပြီး၊ item နှစ်ခုနဲ့ စုစုပေါင်း ဆိုတော့ line သုံးကြောင်း ရှိလား စစ်ထားပါတယ်။ to Have
      Length က array ဒါမှမဟုတ် စာသားရဲ့ အရှည်ကို စစ်တဲ့ matcher ပါ။
    sources:
      - { title: "Vitest: expect, toHaveLength", url: "https://vitest.dev/api/expect#tohavelength" }
      - {
          title: "web.dev Learn Testing: Assertion helpers as primitives",
          url: "https://web.dev/learn/testing/assertions/tools#assertion-helpers",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: select-format
        type: editor.select
        at: { mark: select-format }
        target: { file: src/receipt.js, text: "return `${amount} ကျပ်`;", occurrence: 1 }
      - id: open-receipt-test
        type: workspace.openFile
        at: { mark: open-receipt-test }
        path: src/receipt.test.js
      - id: select-comma
        type: editor.select
        at: { mark: select-comma }
        target:
          {
            file: src/receipt.test.js,
            text: 'expect(formatKyat(1500)).toBe("1,500 ကျပ်");',
            occurrence: 1,
          }
      - id: select-length
        type: editor.select
        at: { mark: select-length }
        target: { file: src/receipt.test.js, text: "expect(lines).toHaveLength(3);", occurrence: 1 }

  - id: panel
    narration: >
      [[mark:ready]] ကဲ၊ Vitest က ဒီ test တွေကို run လိုက်တော့ ဘာ ပြလဲ ကြည့်ရအောင်။ ဒီတစ်ခါ test ဖိုင်
      နှစ်ဖိုင် ရှိလို့၊ panel က ဖိုင် တစ်ဖိုင်ချင်းရဲ့ အောက်မှာ သူ့ test တွေကို စုပြထားပါတယ်။
      [[mark:read-start]] order test ဖိုင်ထဲက လက်ဖက်ရည် ခွက်ကြီး ဈေးကို စစ်တဲ့ test က pass ဖြစ်ပြီး၊
      receipt test ဖိုင်ထဲက ကော်မာ test ကတော့ ကြက်ခြေခတ်နဲ့ ကျနေပါတယ်။ summary မှာလည်း test
      သုံးခုထဲက တစ်ခု fail လို့ ပြနေပါတယ်။
    sources:
      - {
          title: "Vitest: Writing Tests, reading test output",
          url: "https://vitest.dev/guide/learn/writing-tests#reading-test-output",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-start-fail
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 3, delayMs: 1000 }
      - id: expect-start-count
        type: expect.preview
        at: { afterAction: expect-start-fail }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-failed, value: "1" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-test
        type: expect.preview
        at: { afterAction: expect-start-count }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-2 }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-message
        type: expect.preview
        at: { afterAction: expect-start-test }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute:
          {
            name: data-message,
            value: "expected '1500 ကျပ်' to be '1,500 ကျပ်' // Object.is equality",
          }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-quotes
        type: expect.preview
        at: { afterAction: expect-start-message }
        timeoutMs: 5000
        target: { by: testId, value: vt-diff-1 }
        textContains: 'Received: "1500 ကျပ်"'
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: strings
    chapter: "စာသား failure ကို ဖတ်ရအောင်"
    narration: >
      ကျနေတဲ့ test ကို အပိုင်းလိုက် ဖတ်ကြည့်ရအောင်။ [[mark:read-string]] Failed Tests အပိုင်းမှာ ကော်မာ
      ပါတဲ့ ၁၅၀၀ ကျပ် ဖြစ်ရမယ့် နေရာမှာ၊ ကော်မာ မပါတဲ့ ၁၅၀၀ ကျပ် ရနေတယ်လို့ ပြောနေပါတယ်။
      [[mark:read-quotes]] စာသားကို စစ်တဲ့အခါ Vitest က Expected နဲ့ Received ကို အပေါ်အောက် ထားပြီး
      quote ထဲမှာ ပြလို့၊ စာလုံး တစ်လုံးချင်း တိုက်ကြည့်လို့ ရပါတယ်။ ဒီမှာ ကွာနေတာ ကော်မာ
      တစ်ခုတည်းပါ။ စာသား အဆုံးမှာ space တစ်ခု ပိုနေတာမျိုးကိုလည်း quote ထဲမှာမှ မြင်ရပါတယ်။
      [[mark:decide-code]] ဆိုင်ရှင် လိုချင်တာက ကော်မာ ပါတဲ့ ပုံစံ ဖြစ်တဲ့အတွက်၊ ဒီတစ်ခါ မှားနေတာက
      code ပါ။ [[mark:open-receipt-fix]] receipt ဖိုင်ကို ပြန်ဖွင့်ပါမယ်။ [[mark:type-locale]] ငွေ
      ပမာဏရဲ့ နောက်မှာ to Locale String ကို ထည့်ပါမယ်။ JavaScript ဂဏန်းတိုင်းမှာ ပါတဲ့ ဒီ function
      က၊ ဒီမှာ ရွေးထားတဲ့ ပုံစံအတိုင်း သုံးလုံးခြား ကော်မာ ခံထားတဲ့ စာသား ပြောင်းပေးပါတယ်။
      [[mark:read-fixed]] panel ကို ကြည့်ပါ။ ကော်မာ test က အမှန်ခြစ် ဖြစ်သွားပြီး၊ test သုံးခုလုံး pass
      ဖြစ်လို့ အပေါ်ဆုံးမှာ အစိမ်းရောင် PASS ပေါ်လာပါပြီ။
    sources:
      - { title: "Vitest: expect, toBe", url: "https://vitest.dev/api/expect#tobe" }
      - {
          title: "MDN: Number.prototype.toLocaleString()",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Number/toLocaleString",
        }
    actions:
      - id: open-receipt-fix
        type: workspace.openFile
        at: { mark: open-receipt-fix }
        path: src/receipt.js
      - id: type-locale
        type: editor.type
        at: { mark: type-locale }
        target: { file: src/receipt.js, after: "${amount", occurrence: 1 }
        text: '.toLocaleString("en-US")'
      - id: expect-fixed
        type: expect.preview
        at: { afterAction: type-locale }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-fixed-count
        type: expect.preview
        at: { afterAction: expect-fixed }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "3" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-receipt-file
        type: expect.file
        at: { afterAction: expect-fixed-count }
        path: src/receipt.js
        contains: 'return `${amount.toLocaleString("en-US")} ကျပ်`;'

  - id: objects
    chapter: "Object တွေကို ဘယ်လို စစ်မလဲ"
    narration: >
      [[mark:open-order]] အခု object တွေဘက် လှည့်ကြည့်ရအောင်။ ဒါက အော်ဒါ ဖိုင်ပါ။ [[mark:select-new-order]]
      ဒီ function က customer နာမည်ကို ယူပြီး၊ line မရှိသေးတဲ့ အော်ဒါ object အသစ် တစ်ခုကို
      ပြန်ပေးပါတယ်။ [[mark:open-order-test]] ဒါကတော့ order ဖိုင်ရဲ့ test ပါ။ [[mark:select-large-tea]]
      ဒီ test က လက်ဖက်ရည် ခွက်ကြီးကို ၂၀၀၀ ကျပ်လို့ to Be နဲ့ စစ်ထားပြီး၊ ဂဏန်းအတွက် to Be က
      သင့်တော်ပါတယ်။ [[mark:type-object-test]] ဒါဆို အော်ဒါ object ကိုလည်း to Be နဲ့ စစ်တဲ့ test အသစ်
      တစ်ခု ထည့်ကြည့်ရအောင်။ [[mark:select-arrange]] အောင်အောင် အတွက် အော်ဒါ ဖွင့်ပြီး၊
      [[mark:select-tobe-object]] ရလာတဲ့ object က အောင်အောင် ရဲ့ နာမည်နဲ့ line စာရင်း အလွတ် ပါတဲ့ object နဲ့
      တူလား စစ်ထားပါတယ်။ [[mark:read-no-diff]] panel ကို ကြည့်ပါ။ test အသစ်က ကျသွားပါပြီ။ ထူးဆန်းတာက
      Received ဘက်မှာ Expected နဲ့ ထုတ်ကြည့်ရင် စာသား အတူတူပဲလို့ ပြထားပြီး၊ မြင်ရတဲ့ ကွာခြားချက်
      မရှိဘူးလို့လည်း Vitest ကိုယ်တိုင် ပြောနေတာပါ။ [[mark:read-identity]] ဘာကြောင့်လဲဆိုတော့၊ to Be က Object is နဲ့
      စစ်လို့ပါ။ object ဆိုရင် အထဲက တန်ဖိုး တူရုံနဲ့ မရဘဲ၊ memory ထဲက object တစ်ခုတည်း ဖြစ်ရပါတယ်။
      function က object အသစ် တစ်ခု ဆောက်ပေးပြီး၊ test ထဲမှာ ရေးထားတဲ့ object ကလည်း နောက်ထပ်
      object တစ်ခုပါ။ [[mark:read-cups]] လက်ဖက်ရည် နှစ်ခွက်က အရသာ တူတာနဲ့ ခွက် တစ်ခွက်တည်း
      မဖြစ်သွားသလိုပါပဲ။ ဒါကြောင့် Vitest က အထဲက တန်ဖိုးတွေနဲ့ စစ်ချင်ရင် to Strict Equal ကို သုံးဖို့
      အကြံပေးထားပါတယ်။
    sources:
      - {
          title: "Vitest: Using Matchers, common matchers (toBe vs toEqual)",
          url: "https://vitest.dev/guide/learn/matchers#common-matchers",
        }
      - { title: "Vitest: expect, toBe", url: "https://vitest.dev/api/expect#tobe" }
      - {
          title: "web.dev Learn Testing: Assertion helpers (referential and deep equality)",
          url: "https://web.dev/learn/testing/assertions/tools#assertion-helpers",
        }
    actions:
      - id: open-order
        type: workspace.openFile
        at: { mark: open-order }
        path: src/order.js
      - id: select-new-order
        type: editor.select
        at: { mark: select-new-order }
        target: { file: src/order.js, text: "return { customer, lines: [] };", occurrence: 1 }
      - id: open-order-test
        type: workspace.openFile
        at: { mark: open-order-test }
        path: src/order.test.js
      - id: select-large-tea
        type: editor.select
        at: { mark: select-large-tea }
        target:
          {
            file: src/order.test.js,
            text: 'expect(lineTotal({ id: "tea", size: "large" })).toBe(2000);',
            occurrence: 1,
          }
      - id: type-object-test
        type: editor.type
        at: { mark: type-object-test }
        target: { file: src/order.test.js, after: "toBe(2000);\n});\n", occurrence: 1 }
        text: "\ntest(\"starts an empty order for a customer\", () => {\n  const order = newOrder(\"အောင်အောင်\");\n  expect(order).toBe({ customer: \"အောင်အောင်\", lines: [] });\n});\n"
        # One block (pilot note 1): line by line, the newline and the blank line parse and a long
        # test( line can wait past the bridge's 1 s quiet window.
        cadence: block
      - id: expect-identity-fail
        type: expect.preview
        at: { afterAction: type-object-test }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-identity-test
        type: expect.preview
        at: { afterAction: expect-identity-fail }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-2 }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-identity-hint
        type: expect.preview
        at: { afterAction: expect-identity-test }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        textContains: 'If it should pass with deep equality, replace "toBe" with "toStrictEqual"'
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-identity-same
        type: expect.preview
        at: { afterAction: expect-identity-hint }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        textContains: "Received: serializes to the same string"
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-identity-diff
        type: expect.preview
        at: { afterAction: expect-identity-same }
        timeoutMs: 5000
        target: { by: testId, value: vt-diff-1 }
        textContains: "Compared values have no visual difference."
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-arrange
        type: editor.select
        at: { mark: select-arrange }
        target:
          { file: src/order.test.js, text: 'const order = newOrder("အောင်အောင်");', occurrence: 1 }
      - id: select-tobe-object
        type: editor.select
        at: { mark: select-tobe-object }
        target:
          {
            file: src/order.test.js,
            text: 'toBe({ customer: "အောင်အောင်", lines: [] })',
            occurrence: 1,
          }

  - id: not-equal
    narration: >
      [[mark:type-not]] တကယ်ပဲ object နှစ်ခု ဖြစ်နေလား စစ်ကြည့်ရအောင်။ matcher ရဲ့ ရှေ့မှာ not ကို
      ထည့်ရင် စစ်ချက်ကို ပြောင်းပြန် လှန်ပေးပါတယ်။ [[mark:read-not]] test က အမှန်ခြစ် ဖြစ်သွားပါပြီ။
      ဒီ object နှစ်ခုဟာ တကယ်ပဲ တစ်ခုတည်း မဟုတ်ပါဘူး။ ဒါပေမဲ့ ဒီ not line က ဘယ်တော့မှ မကျနိုင်တဲ့
      စစ်ချက် ဖြစ်လို့ တကယ့် test မှာ မထားပါဘူး။ [[mark:type-equal]] ဒါကြောင့် သူ့ကို comment လုပ်ပြီး၊
      အပေါ်မှာ အထဲက တန်ဖိုးတွေ တူလား စစ်တဲ့ to Equal နဲ့ ပြန်ရေးပါမယ်။ ကိုယ့် project မှာတော့ line
      ဟောင်းကို ဖျက်လိုက်ရုံပါပဲ။ [[mark:select-equal]] to Equal က object ရဲ့ field တွေကို တစ်ခုချင်း
      နှိုင်းယှဉ်ပြီး၊ field ထဲမှာ array ဒါမှမဟုတ် object ပါနေရင်လည်း အထဲထိ ဝင်စစ်ပေးပါတယ်။ array
      ဆိုရင်တော့ item တွေရဲ့ အစဉ်ပါ တူမှ ရပါတယ်။ ဒီလို စစ်တာကို deep equality လို့ ခေါ်ပါတယ်။ [[mark:read-equal]] test က pass ဖြစ်နေဆဲပါ။ object
      နှစ်ခုက တစ်ခုတည်း မဟုတ်ပေမဲ့၊ အထဲက တန်ဖိုးတွေကတော့ အကုန် တူနေလို့ပါ။
    sources:
      - { title: "Vitest: expect, not", url: "https://vitest.dev/api/expect#not" }
      - { title: "Vitest: expect, toEqual", url: "https://vitest.dev/api/expect#toequal" }
    actions:
      - id: type-not
        type: editor.type
        at: { mark: type-not }
        target: { file: src/order.test.js, after: "expect(order)", occurrence: 1 }
        text: ".not"
      - id: expect-not-pass
        type: expect.preview
        at: { afterAction: type-not }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-not-count
        type: expect.preview
        at: { afterAction: expect-not-pass }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "4" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: type-equal
        type: editor.type
        at: { mark: type-equal }
        target:
          {
            file: src/order.test.js,
            after: "const order = newOrder(\"အောင်အောင်\");\n  ",
            occurrence: 1,
          }
        text: "expect(order).toEqual({ customer: \"အောင်အောင်\", lines: [] });\n  // "
        # The one-insert line replacement (COURSE-KIT §5): the toEqual line goes above the not line,
        # which becomes a comment, so the test keeps no check that can never fail (audit).
        cadence: block
      # Nothing in the report changes (still 4 passed), so the status is checked at read-equal, long
      # after the block's report has replaced the old one, never right after the write (audit).
      - id: expect-equal-pass
        type: expect.preview
        at: { mark: read-equal }
        timeoutMs: 5000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-equal-file
        type: expect.file
        at: { afterAction: expect-equal-pass }
        path: src/order.test.js
        contains: "  expect(order).toEqual({ customer: \"အောင်အောင်\", lines: [] });\n  // expect(order).not.toBe({ customer: \"အောင်အောင်\", lines: [] });\n"
      - id: select-equal
        type: editor.select
        at: { mark: select-equal }
        target:
          {
            file: src/order.test.js,
            text: 'expect(order).toEqual({ customer: "အောင်အောင်", lines: [] });',
            occurrence: 1,
          }

  - id: strict
    narration: >
      [[mark:board-strict]] ခုနက Vitest က to Strict Equal ကို အကြံပေးခဲ့ပါတယ်။ to Equal နဲ့ ဘာကွာလဲ
      ကြည့်ရအောင်။ [[mark:draw-undefined]] ပထမ ကွာခြားချက်က undefined ဖြစ်နေတဲ့ field ပါ။ to Equal
      က တန်ဖိုး undefined ဖြစ်နေတဲ့ field ကို မရှိတဲ့ field လိုပဲ သဘောထားလို့ pass ဖြစ်ပေမဲ့၊ to Strict
      Equal ကတော့ field တစ်ခု ပိုနေတယ်လို့ ယူဆလို့ fail ဖြစ်ပါတယ်။ [[mark:draw-class]] ဒုတိယက class
      ပါ။ class ကနေ ဆောက်ထားတဲ့ object နဲ့ ရိုးရိုး object က field တွေ တူရင်၊ to Equal က တူတယ်လို့
      ယူဆပေမဲ့ to Strict Equal က object အမျိုးအစားကိုပါ စစ်လို့ ကျပါတယ်။ [[mark:draw-rule]] ဒါကြောင့်
      ပုံမှန်အားဖြင့် to Equal ကို သုံးပြီး၊ undefined field တွေ၊ class တွေကပါ အရေးကြီးမှ to Strict Equal
      ကို သုံးပါ။
    sources:
      - {
          title: "Vitest: expect, toStrictEqual",
          url: "https://vitest.dev/api/expect#tostrictequal",
        }
      - {
          title: "Vitest: Using Matchers, toEqual vs toStrictEqual",
          url: "https://vitest.dev/guide/learn/matchers#common-matchers",
        }
    actions:
      - id: board-strict
        type: whiteboard.apply
        at: { mark: board-strict }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-undefined
        type: whiteboard.apply
        at: { mark: draw-undefined }
        upsertIds: [b-r1-box, b-r1a, b-r1b, b-r1-eq, b-r1-strict]
        drawMs: 3000
      - id: draw-class
        type: whiteboard.apply
        at: { mark: draw-class }
        upsertIds: [b-r2-box, b-r2a, b-r2b, b-r2-eq, b-r2-strict]
        drawMs: 3000
      - id: draw-rule
        type: whiteboard.apply
        at: { mark: draw-rule }
        upsertIds: [b-rule]
        drawMs: 1500

  - id: match-object
    narration: >
      တခါတလေ object ရဲ့ field အကုန်လုံးကို စစ်စရာ မလိုပါဘူး။ ဥပမာ လှလှ ရဲ့ အော်ဒါမှာ customer နာမည်
      မှန်လား ဆိုတာပဲ သိချင်တယ် ဆိုပါစို့။ [[mark:type-name-test]] test အသစ် တစ်ခုမှာ customer နာမည်
      တစ်ခုတည်း ပါတဲ့ object ကို to Equal နဲ့ စစ်ကြည့်ပါမယ်။ line စာရင်းကိုတော့ ထည့်မရေးထားပါဘူး။
      [[mark:read-object-diff]] panel ကို ကြည့်ပါ။ ဒီတစ်ခါ object နှစ်ခုရဲ့ diff ကို ပြပါတယ်။ diff ဆိုတာ
      ဘာကွာနေလဲ ဆိုတာကို line လိုက် ပြတာပါ။ Expected ကို အစိမ်းရောင်နဲ့၊ Received ကို အနီရောင်နဲ့
      ပြထားပြီး၊ object ထဲက အရောင် မပါတဲ့ line တွေက နှစ်ဘက်လုံးမှာ ရှိတဲ့ field တွေပါ။ [[mark:read-red-line]] အနီရောင် line ကတော့ Received မှာပဲ
      ရှိတဲ့ field ပါ။ Expected မှာပဲ ရှိရင်တော့ အစိမ်းရောင်နဲ့ ပြပါမယ်။ ဒီမှာ line စာရင်း ပိုနေလို့၊
      field အကုန် တူမှ pass ဖြစ်တဲ့ to Equal က ကျသွားတာပါ။ [[mark:type-match-object]] field
      တချို့ကိုပဲ စစ်ချင်ရင် to Match Object ကို သုံးပါတယ်။ to Equal line ကို comment အဖြစ် ပိတ်ပြီး၊
      သူ့အပေါ်မှာ to Match Object နဲ့ ပြန်ရေးပါမယ်။ [[mark:read-match]] test က pass ဖြစ်သွားပါပြီ။ to
      Match Object က ကိုယ် ရေးထားတဲ့ field တွေကိုပဲ ကြည့်လို့၊ နောက်ပိုင်း အော်ဒါမှာ field အသစ်တွေ
      ထပ်ထည့်လာရင်လည်း ဒီ test က ပျက်မသွားပါဘူး။
    sources:
      - {
          title: "Vitest: expect, toMatchObject",
          url: "https://vitest.dev/api/expect#tomatchobject",
        }
      - {
          title: "Vitest: Using Matchers, objects",
          url: "https://vitest.dev/guide/learn/matchers#objects",
        }
      - {
          title: "web.dev Learn Testing: Assertion helpers (deep equality)",
          url: "https://web.dev/learn/testing/assertions/tools#assertion-helpers",
        }
    actions:
      - id: close-strict
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: type-name-test
        type: editor.type
        at: { mark: type-name-test }
        target:
          {
            file: src/order.test.js,
            after: "// expect(order).not.toBe({ customer: \"အောင်အောင်\", lines: [] });\n});\n",
            occurrence: 1,
          }
        text: "\ntest(\"keeps the customer's name\", () => {\n  const order = newOrder(\"လှလှ\");\n  expect(order).toEqual({ customer: \"လှလှ\" });\n});\n"
        cadence: block
      - id: expect-diff-fail
        type: expect.preview
        at: { afterAction: type-name-test }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-diff-message
        type: expect.preview
        at: { afterAction: expect-diff-fail }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute:
          {
            name: data-message,
            value: "expected { customer: 'လှလှ', lines: [] } to deeply equal { customer: 'လှလှ' }",
          }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-diff-lines
        type: expect.preview
        at: { afterAction: expect-diff-message }
        timeoutMs: 5000
        target: { by: testId, value: vt-diff-1 }
        textContains: '+   "lines": [],'
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: type-match-object
        type: editor.type
        at: { mark: type-match-object }
        target:
          { file: src/order.test.js, after: "const order = newOrder(\"လှလှ\");\n  ", occurrence: 1 }
        text: "expect(order).toMatchObject({ customer: \"လှလှ\" });\n  // "
        # The one-insert line replacement (COURSE-KIT §5): the new line, a newline, the indent and
        # "// " land in one write, so the old toEqual line becomes a comment and every state parses.
        cadence: block
      - id: expect-match-pass
        type: expect.preview
        at: { afterAction: type-match-object }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-match-count
        type: expect.preview
        at: { afterAction: expect-match-pass }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "5" }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: arrays
    chapter: "Array ထဲမှာ ပါလား"
    narration: >
      [[mark:open-receipt-test-2]] ဘောင်ချာ test ကို ပြန်သွားရအောင်။ [[mark:select-have-length]] ဒီ test
      က line သုံးကြောင်း ရှိတာကိုတော့ စစ်ထားပေမဲ့၊ စုစုပေါင်း line မှာ ဘယ်လောက် ပြလဲ ဆိုတာ
      မစစ်ရသေးပါဘူး။ [[mark:type-contain]] ဒီ line တွေထဲမှာ ၄၈၀၀ ကျပ် ပါလား ဆိုတာကို to Contain နဲ့
      စစ်ကြည့်ရအောင်။ လက်ဖက်ရည် နှစ်ခွက် ၃၀၀၀ ကျပ်နဲ့ ကော်ဖီ ၁၈၀၀ ကျပ် ဆိုတော့ စုစုပေါင်း ၄၈၀၀ ကျပ်
      ဖြစ်ရပါမယ်။ [[mark:read-include]] ကျသွားပါပြီ။ array ထဲမှာ ၄၈၀၀ ကျပ် ဆိုတဲ့ item မပါဘူးလို့
      ပြောနေပြီး၊ array ရဲ့ ပထမ item ကို ပြပြီး ကျန်တဲ့ နှစ်ခုကို အတိုချုံ့ထားပါတယ်။
      [[mark:read-whole-item]] ကျရတဲ့ အကြောင်းက၊ array ပေါ်မှာ သုံးတဲ့ to Contain က item တစ်ခုလုံး
      တူတာကို ရှာလို့ပါ။ စုစုပေါင်း line ထဲမှာ ၄၈၀၀ ကျပ် ပါပေမဲ့၊ line တစ်ကြောင်းလုံးကတော့ ဒါ
      မဟုတ်ပါဘူး။ စာသား တစ်ခုပေါ်မှာ သုံးရင်တော့ အပိုင်းလေး ပါရုံနဲ့ pass ဖြစ်ပါတယ်။
      [[mark:type-whole-line]] ဒါကြောင့် line တစ်ကြောင်းလုံး ဖြစ်အောင် ရှေ့မှာ စုစုပေါင်း ဆိုတဲ့ စာလုံး
      ထည့်ပါမယ်။ [[mark:read-contain]] test ငါးခုလုံး pass ဖြစ်သွားပြီး၊ ဘောင်ချာရဲ့ စုစုပေါင်းကလည်း
      ကော်မာနဲ့ မှန်မှန် ပြနေတာ သေချာသွားပါပြီ။
    sources:
      - { title: "Vitest: expect, toContain", url: "https://vitest.dev/api/expect#tocontain" }
      - {
          title: "Vitest: Using Matchers, arrays and iterables",
          url: "https://vitest.dev/guide/learn/matchers#arrays-and-iterables",
        }
      - { title: "Vitest: expect, toHaveLength", url: "https://vitest.dev/api/expect#tohavelength" }
    actions:
      - id: open-receipt-test-2
        type: workspace.openFile
        at: { mark: open-receipt-test-2 }
        path: src/receipt.test.js
      - id: select-have-length
        type: editor.select
        at: { mark: select-have-length }
        target: { file: src/receipt.test.js, text: "expect(lines).toHaveLength(3);", occurrence: 1 }
      - id: type-contain
        type: editor.type
        at: { mark: type-contain }
        target:
          { file: src/receipt.test.js, after: "expect(lines).toHaveLength(3);\n", occurrence: 1 }
        text: "  expect(lines).toContain(\"4,800 ကျပ်\");\n"
      - id: expect-contain-fail
        type: expect.preview
        at: { afterAction: type-contain }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-contain-message
        type: expect.preview
        at: { afterAction: expect-contain-fail }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute:
          {
            name: data-message,
            value: "expected [ 'လက်ဖက်ရည် x2 3,000 ကျပ်', …(2) ] to include '4,800 ကျပ်'",
          }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-contain-test
        type: expect.preview
        at: { afterAction: expect-contain-message }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-5 }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: type-whole-line
        type: editor.type
        at: { mark: type-whole-line }
        target: { file: src/receipt.test.js, after: 'toContain("', occurrence: 1 }
        text: "စုစုပေါင်း "
      - id: expect-contain-pass
        type: expect.preview
        at: { afterAction: type-whole-line }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-contain-count
        type: expect.preview
        at: { afterAction: expect-contain-pass }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "5" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-receipt-test-file
        type: expect.file
        at: { afterAction: expect-contain-count }
        path: src/receipt.test.js
        contains: 'expect(lines).toContain("စုစုပေါင်း 4,800 ကျပ်");'
      - id: expect-order-test-file
        type: expect.file
        at: { afterAction: expect-receipt-test-file }
        path: src/order.test.js
        contains: "expect(order).toMatchObject({ customer: \"လှလှ\" });\n  // expect(order).toEqual({ customer: \"လှလှ\" });"

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ ဂဏန်းနဲ့ စာသားအတွက် to Be ကို သုံးပြီး၊ object နဲ့ array ရဲ့ အထဲက
      တန်ဖိုးတွေအတွက် to Equal ကို သုံးပါတယ်။ undefined field နဲ့ class ပါ အရေးကြီးရင်တော့ to Strict
      Equal ပါ။ [[mark:recap-read]] item တစ်ခု ပါလား စစ်ဖို့ to Contain ကို၊ field တချို့ကိုပဲ စစ်ဖို့
      to Match Object ကို၊ အရှည် စစ်ဖို့ to Have Length ကို သုံးပါတယ်။ failure ကို ဖတ်တဲ့အခါ စာသားဆိုရင် quote
      ထဲက စာလုံးတွေကို တိုက်ကြည့်ပြီး၊ object ဆိုရင် အရောင် ပါတဲ့ line တွေကို ကြည့်ပါ။ နောက် lesson
      မှာတော့ assertion ရေးတဲ့ နောက်ပုံစံ တစ်မျိုး ဖြစ်တဲ့ assert နဲ့၊ ဒသမ ဂဏန်းတွေ၊ error တွေကို
      ဘယ်လို စစ်ရလဲ ဆိုတာ ကြည့်သွားပါမယ်။
