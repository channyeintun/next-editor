      package.json: |
        {
          "name": "testing-course-tea-shop",
          "private": true,
          "version": "1.0.0",
          "type": "module",
          "scripts": {
            "dev": "vite --host 0.0.0.0 --port 5173 --strictPort",
            "test": "vitest"
          },
          "devDependencies": {
            "vite": "7.3.7",
            "vitest": "5.1.0"
          }
        }
      src/menu.js: |
        export const MENU = {
          tea: { name: "လက်ဖက်ရည်", price: 1500, drink: true },
          coffee: { name: "ကော်ဖီ", price: 1800, drink: true },
          lime: { name: "သံပုရာရည်", price: 1200, drink: true },
          mohinga: { name: "မုန့်ဟင်းခါး", price: 2500, drink: false },
          paratha: { name: "ပလာတာ", price: 1200, drink: false },
        };

        export function priceOf(id) {
          const item = MENU[id];
          if (!item) throw new Error(`${id} is not on the menu`);
          return item.price;
        }
      src/order.js: |
        import { MENU, priceOf } from "./menu.js";

        export const LARGE_EXTRA = 500;
        export const SUGAR_FEE = 100;

        export function newOrder(customer) {
          return { customer, lines: [] };
        }

        export function lineTotal({ id, qty = 1, size = "small", sugar = false }) {
          let price = priceOf(id);
          if (size === "large" && MENU[id].drink) price += LARGE_EXTRA;
          if (sugar) price += SUGAR_FEE;
          return price * qty;
        }

        export function orderTotal(lines) {
          return lines.reduce((sum, line) => sum + lineTotal(line), 0);
        }
      src/order.test.js: |
        import { expect, test } from "vitest";
        import { lineTotal, newOrder } from "./order.js";

        test("charges 2000 for a large tea", () => {
          expect(lineTotal({ id: "tea", size: "large" })).toBe(2000);
        });
      src/receipt.js: |
        import { MENU } from "./menu.js";
        import { lineTotal, orderTotal } from "./order.js";

        export function formatKyat(amount) {
          return `${amount} ကျပ်`;
        }

        export function receipt(lines) {
          const rows = lines.map((line) => `${MENU[line.id].name} x${line.qty ?? 1} ${formatKyat(lineTotal(line))}`);
          return [...rows, `စုစုပေါင်း ${formatKyat(orderTotal(lines))}`].join("\n");
        }
      src/receipt.test.js: |
        import { expect, test } from "vitest";
        import { formatKyat, receipt } from "./receipt.js";

        test("formats 1500 as 1,500 ကျပ်", () => {
          expect(formatKyat(1500)).toBe("1,500 ကျပ်");
        });

        test("prints a line per item and the total", () => {
          const items = [{ id: "tea", qty: 2 }, { id: "coffee" }];
          const lines = receipt(items).split("\n");
          expect(lines).toHaveLength(3);
        });
      vite.config.js: |
        import { defineConfig } from "vite";
        import courseVitestBridge from "./course/vitest-bridge.js";

        // The course panel: the dev server runs the real Vitest and the preview shows its results.
        export default defineConfig({
          plugins: [courseVitestBridge()],
        });
      vitest.config.js: |
        import { defineConfig } from "vitest/config";

        export default defineConfig({
          test: {
          },
        });
