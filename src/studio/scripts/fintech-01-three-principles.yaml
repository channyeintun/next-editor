build:
  voiceProfile:
    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 9501

runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "bank sent: 100.00\nuser:1042 balance: 200.00\n"
      run-2:
        status: success
        exitCode: 0
        output: "bank sent: 100.00\nuser:1042 balance: 200.00\ntotal before transfer: 200.00\ntotal after transfer:  150.00\n"
      run-3:
        status: success
        exitCode: 0
        output: "bank sent: 100.00\nuser:1042 balance: 200.00\ntotal before transfer: 200.00\ntotal after transfer:  150.00\nSTOP: books 150.00 ≠ bank 100.00\n"

scenes:
  - id: intro
    chapter: ငွေ bug က ဘာကွာလဲ
    narration: >-
      မင်္ဂလာပါ ခင်ဗျာ၊ Fintech Engineering course ကို ကြိုဆိုပါတယ်။ ဒီ course က backend နဲ့ distributed system တွေကို ကျွမ်းကျင်ပြီးသား engineer တွေ fintech ထဲ ဝင်ဖို့ လိုတဲ့ ငွေ domain ကို သင်ပေးဖို့ပါ။
      Voytek Pitula ရေးတဲ့ Fintech Engineering Handbook ကို အခြေခံထားပါတယ်။
      [[mark:show-why]] ပုံမှန် app တစ်ခုမှာ row တစ်ကြောင်း မှားရင် အဲဒါ bug တစ်ခုပါ။ [[mark:pt-ticket]]
      ticket ဖွင့်၊ row ကို ပြင်၊ deploy လုပ်ပြီးရင် ပြဿနာ ပြီးသွားပါတယ်။ [[mark:why-2]] ငွေ system မှာတော့
      balance row တစ်ကြောင်း မှားတာဟာ ငွေ ပေါ်လာတာ ဒါမှမဟုတ် ပျောက်သွားတာ ဖြစ်ပါတယ်။
      [[mark:pt-gap]] ဒီ user ရဲ့ balance က ယူရို ၂၀၀ ဖြစ်နေပေမဲ့ bank က တကယ် ပို့ခဲ့တာ ၁၀၀ ပဲ
      ရှိပါတယ်၊ ကျန်တဲ့ ၁၀၀ က ဘယ်ကမှ မလာပါဘူး။ [[mark:why-3]] အဲဒီ ငွေကို user က ထုတ်သွားပြီး
      ဖြစ်နိုင်လို့ row ကို ပြန်ပြင်ရုံနဲ့ မပြီးပါဘူး။ [[mark:pt-aud]] auditor က ဒီ ကိန်းဂဏန်း ဘယ်က
      ရလာလဲ ဆိုတဲ့ သက်သေ တောင်းပါမယ်၊ regulator ကလည်း စစ်ဆေးပါမယ်။ ဆိုလိုတာက ငွေ system မှာ bug တစ်ခုကြောင့် ဆုံးရှုံးရတာက ပြင်ရတဲ့ အချိန် မဟုတ်ဘဲ ငွေနဲ့
      ယုံကြည်မှု ဖြစ်ပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — introduction (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/",
        }
      - {
          title: "Fintech Engineering Handbook — For whom? (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#for-whom",
        }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }
      - { id: show-why, type: slide.show, at: { mark: show-why, offsetMs: -700 }, slideId: why-1 }
      - { id: pt-ticket, type: slide.point, at: { mark: pt-ticket }, target: { x: 0.25, y: 0.753 } }
      - { id: why-2, type: slide.show, at: { mark: why-2 }, slideId: why-2 }
      - { id: pt-gap, type: slide.point, at: { mark: pt-gap }, target: { x: 0.743, y: 0.587 } }
      - { id: why-3, type: slide.show, at: { mark: why-3 }, slideId: why-3 }
      - {
          id: pt-user,
          type: slide.point,
          at: { afterAction: why-3 },
          target: { x: 0.601, y: 0.873 },
        }
      - { id: pt-aud, type: slide.point, at: { mark: pt-aud }, target: { x: 0.733, y: 0.873 } }

  - id: duplicate
    narration: >-
      [[mark:close-why]] ဒီ ယူရို ၁၀၀ ဘယ်က ပေါ်လာလဲ code နဲ့ ကြည့်ရအောင်။ [[mark:sel-handler]] ဒီ
      wallet က user တစ်ယောက်ချင်းရဲ့ balance ကို ဂဏန်း တစ်ခုတည်းနဲ့ သိမ်းပြီး၊ bank က ငွေရောက်ပြီ
      ဆိုတဲ့ message ပို့တိုင်း အဲဒီ ပမာဏကို balance ထဲ ပေါင်းထည့်ပါတယ်။ [[mark:sel-retry]] main ထဲမှာ
      deposit message တစ်ခုတည်းကို နှစ်ခါ handle လုပ်ထားပါတယ်။ bank တွေ ပုံမှန် လုပ်တတ်တာပါ၊ ကိုယ့် reply လမ်းမှာ ပျောက်သွားရင် bank က message ကို
      ထပ်ပို့ပါတယ်။ [[mark:run-1]]
      run လိုက်ရအောင်။ [[mark:pt-sent]] bank က ယူရို ၁၀၀ ပို့ခဲ့ပါတယ်။ [[mark:pt-bal]] ဒါပေမဲ့ user ရဲ့
      balance က ၂၀၀ ဖြစ်နေပါတယ်။ error လည်း မတက်၊ log လည်း မထွက်ဘဲ ယူရို ၁၀၀ ပေါ်လာတာပါ။
      [[mark:dock-1]] ဆိုလိုတာက ငွေကို ထိတဲ့ handler မှာ retry တစ်ခါ ဝင်လာတိုင်း ငွေ ထပ်ပေါ်လာနိုင်ပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Idempotency (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#idempotency",
        }
    actions:
      - { id: close-why, type: slide.close, at: { mark: close-why } }
      - id: sel-handler
        type: editor.select
        at: { mark: sel-handler }
        target:
          {
            file: main.go,
            text: "func handleDeposit(d Deposit) {\n\tbalance[d.User] += d.Amount\n}",
            occurrence: 1,
          }
      - id: sel-retry
        type: editor.select
        at: { mark: sel-retry }
        target:
          {
            file: main.go,
            text: "\thandleDeposit(d)\n\thandleDeposit(d) // our reply was lost, so the bank sent the same message again",
            occurrence: 1,
          }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "user:1042 balance: 200.00",
          timeoutMs: 8000,
        }
      - id: pt-sent
        type: console.point
        at: { mark: pt-sent }
        target: { text: "bank sent:", occurrence: 1 }
      - id: pt-bal
        type: console.point
        at: { mark: pt-bal }
        target: { text: "user:1042 balance:", occurrence: 1 }
      - { id: dock-1, type: runtime.collapseDock, at: { mark: dock-1 } }

  - id: three
    chapter: မူ ၃ ချက်
    narration: >-
      [[mark:show-three]] handbook က ဒီလို အမှားတွေကို ကာကွယ်တဲ့ pattern တိုင်းကို principle သုံးချက်
      အောက်မှာ စုထားပါတယ်။ ပထမ တစ်ချက်က No invented data ပါ၊ ငွေကို မရှိဘဲ မဖန်တီးရဘူး ဆိုတာပါ။
      [[mark:pt-invx]] ခုနကလို message တစ်ခုကို နှစ်ခါ တွက်တာ၊ balance ကို အကြောင်းပြချက် မရှိဘဲ
      တိုက်ရိုက် ပြင်တာတွေက ဒီ principle ကို ချိုးဖောက်ပါတယ်။ [[mark:pt-inv1]] ကာကွယ်ပေးတာက
      idempotency၊ deduplication နဲ့ reconciliation ပါ။ idempotent ဆိုတာ တစ်ခါ လုပ်လုပ် နှစ်ခါ လုပ်လုပ် ရလဒ် အတူတူ ဖြစ်တာပါ။
      reconciliation ဆိုတာ system နှစ်ခုရဲ့ မှတ်တမ်းတွေ ကိုက်မကိုက် တိုက်စစ်တာပါ။ [[mark:three-2]] ဒုတိယက No lost data ပါ၊ ငွေနဲ့ ပတ်သက်ပြီး ဖြစ်ခဲ့သမျှ
      မပျောက်ရဘူး ဆိုတာပါ။ [[mark:pt-lost1]] ဒီ principle ကို ကာကွယ်ပေးတာက precision ကို အပြည့် ထိန်းတာနဲ့၊ message ကို အနည်းဆုံး တစ်ခါ ရောက်အောင် ပို့တဲ့ at-least-once
      delivery ပါ။ ဖြစ်ခဲ့သမျှကို event အဖြစ် သိမ်းတဲ့ event sourcing၊ audit
      trail နဲ့ ပြီးသွားတဲ့ မှတ်တမ်းကို မပြင်ရတဲ့ immutability တို့လည်း ဒီထဲမှာ ပါပါတယ်။ [[mark:three-3]] တတိယက No trust ပါ၊ ဘယ်သူ့ကိုမှ၊ ကိုယ့် component ကိုတောင်
      အလိုလို မယုံရဘူး ဆိုတာပါ။ [[mark:pt-tr1]] provider ကိုလည်း မယုံ၊ ကိုယ့် service တွေကိုလည်း မယုံ၊
      network ကိုလည်း မယုံပါဘူး။ ဒါကြောင့် webhook တွေကို verify လုပ်တယ်၊ source နှစ်ခုကို
      တိုက်စစ်တယ်၊ ယူဆချက် တစ်ခု ပျက်သွားရင် ကျော်မသွားဘဲ ကျယ်ကျယ်လောင်လောင် fail လုပ်ပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Principles (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#principles",
        }
    actions:
      - {
          id: show-three,
          type: slide.show,
          at: { mark: show-three, offsetMs: -700 },
          slideId: three-1,
        }
      - {
          id: pt-inv,
          type: slide.point,
          at: { afterAction: show-three },
          target: { x: 0.2, y: 0.453 },
        }
      - { id: pt-invx, type: slide.point, at: { mark: pt-invx }, target: { x: 0.098, y: 0.52 } }
      - { id: pt-inv1, type: slide.point, at: { mark: pt-inv1 }, target: { x: 0.194, y: 0.631 } }
      - { id: three-2, type: slide.show, at: { mark: three-2 }, slideId: three-2 }
      - {
          id: pt-lost,
          type: slide.point,
          at: { afterAction: three-2 },
          target: { x: 0.5, y: 0.453 },
        }
      - { id: pt-lost1, type: slide.point, at: { mark: pt-lost1 }, target: { x: 0.494, y: 0.631 } }
      - { id: three-3, type: slide.show, at: { mark: three-3 }, slideId: three-3 }
      - {
          id: pt-trust,
          type: slide.point,
          at: { afterAction: three-3 },
          target: { x: 0.8, y: 0.453 },
        }
      - { id: pt-tr1, type: slide.point, at: { mark: pt-tr1 }, target: { x: 0.794, y: 0.631 } }

  - id: crash
    chapter: Write နှစ်ခုကြားက crash
    narration: >-
      [[mark:close-three]] ဒုတိယ principle ကို code နဲ့ ချိုးကြည့်ရအောင်။ [[mark:sel-transfer]]
      transfer က user တစ်ယောက်ဆီက နုတ်တာနဲ့ နောက်တစ်ယောက်ဆီ ပေါင်းတာကို write နှစ်ခု သီးခြား
      လုပ်ပါတယ်။ အဲဒီ နှစ်ခုကြားမှာ process သေသွားတာကို flag တစ်ခုနဲ့ ကိုယ်စားပြုထားပါတယ်၊ deploy
      တစ်ခု၊ memory ကုန်လို့ kill ခံရတာ၊ timeout တစ်ခု ဘာမဆို ဖြစ်နိုင်ပါတယ်။ [[mark:type-transfer]]
      ယူရို ငါးဆယ်ကို user နှစ်ယောက်ကြား transfer လုပ်ပြီး၊ မလုပ်ခင်နဲ့ လုပ်ပြီးနောက် စုစုပေါင်းကို
      ထုတ်ပြပါမယ်။ transfer က ငွေကို နေရာရွှေ့တာပဲ ဖြစ်လို့ စုစုပေါင်း မပြောင်းသင့်ပါဘူး။ run မလုပ်ခင်
      ဘာထွက်မလဲ ခန့်မှန်းကြည့်ပါ။ [[mark:run-2]] run လိုက်ရအောင်။ [[mark:pt-before]] transfer မလုပ်ခင်
      စုစုပေါင်းက ၂၀၀ ပါ။ [[mark:pt-after]] ပြီးတော့ ၁၅၀ ဖြစ်သွားပါတယ်။ user တစ်ယောက်ဆီက ယူရို ငါးဆယ်
      ထွက်သွားပြီး ဘယ်သူ့ဆီမှ မရောက်ပါဘူး။ ဒီ နမူနာကို database transaction တစ်ခုထဲ ထည့်လိုက်ရင်
      ပြေလည်ပါတယ်။ [[mark:dock-2]] ဒါပေမဲ့ ဒုတိယ write က bank ဒါမှမဟုတ် provider ဆီမှာ ဖြစ်နေရင်
      နှစ်ဖက်လုံးကို ဖုံးပေးတဲ့ transaction မရှိပါဘူး။ ဒီ ပြဿနာက course တစ်လျှောက်လုံး ပြန်ပြန်
      ပေါ်လာမှာ ဖြစ်ပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Principles (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#principles",
        }
      - {
          title: "Fintech Engineering Handbook — Full resumability (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#full-resumability",
        }
    actions:
      - { id: close-three, type: slide.close, at: { mark: close-three } }
      - id: sel-transfer
        type: editor.select
        at: { mark: sel-transfer }
        target:
          {
            file: main.go,
            text: "\tbalance[from] -= amount\n\tif crashAfterDebit {\n\t\treturn\n\t}\n\tbalance[to] += amount",
            occurrence: 1,
          }
      - id: type-transfer
        type: editor.type
        at: { mark: type-transfer }
        target:
          {
            file: main.go,
            after: "\tfmt.Println(\"user:1042 balance:\", format(balance[\"user:1042\"], 2))\n",
            occurrence: 1,
          }
        text: "\n\tbefore := total()\n\ttransfer(\"user:1042\", \"user:2077\", 5000, true) // the process dies after the debit\n\tfmt.Println(\"total before transfer:\", format(before, 2))\n\tfmt.Println(\"total after transfer: \", format(total(), 2))\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "total after transfer:  150.00",
          timeoutMs: 8000,
        }
      - id: pt-before
        type: console.point
        at: { mark: pt-before }
        target: { text: "total before transfer:", occurrence: 1 }
      - id: pt-after
        type: console.point
        at: { mark: pt-after }
        target: { text: "total after transfer:", occurrence: 1 }
      - { id: dock-2, type: runtime.collapseDock, at: { mark: dock-2 } }

  - id: check
    narration: >-
      [[mark:type-check]] တတိယ principle အတွက် check တစ်ခု ထည့်ပါမယ်။ ကိုယ့် balance တွေရဲ့ စုစုပေါင်းကို
      bank ရဲ့ statement က ပြတဲ့ ပမာဏနဲ့ တိုက်စစ်ပြီး၊ မကိုက်ရင် ရပ်ခိုင်းတာပါ။ ကိုယ့် code မှန်တယ်လို့
      ယူဆမထားဘဲ ကိုယ် မထိန်းချုပ်တဲ့ source တစ်ခုနဲ့ စစ်တာပါ။ ဒါက reconciliation ရဲ့ အသေးဆုံး ပုံစံပါ။ [[mark:run-3]] run လိုက်ရအောင်။
      [[mark:pt-stop]] ကိုယ့် စာရင်းက ၁၅၀ ပြနေပြီး bank က ၁၀၀ ပဲ ကိုင်ထားလို့ check က ရပ်လိုက်ပါတယ်။
      production မှာဆိုရင် ဒီအချိန်မှာ user တွေဆီ ငွေထုတ်ပေးတာကို ရပ်ပြီး engineer ကို alert ပို့ရမှာပါ။
      [[mark:dock-3]] ကွာတဲ့ ငါးဆယ်ကို သတိထားကြည့်ပါ။ ပေါ်လာတဲ့ တစ်ရာထဲက ပျောက်သွားတဲ့ ငါးဆယ်ကို
      နုတ်ထားတဲ့ အသားတင်ပဲ ဖြစ်ပြီး၊ အမှား နှစ်ခုလုံးကို တစ်ခုချင်း မပြပါဘူး။
    sources:
      - {
          title: "Fintech Engineering Handbook — Principles (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#principles",
        }
      - {
          title: "Fintech Engineering Handbook — Reconciliation (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#reconciliation",
        }
    actions:
      - id: type-check
        type: editor.type
        at: { mark: type-check }
        target:
          {
            file: main.go,
            after: "\tfmt.Println(\"total after transfer: \", format(total(), 2))\n",
            occurrence: 1,
          }
        text: "\n\tbank := int64(10000) // the bank's own statement: what it really holds for us\n\tif total() != bank {\n\t\tfmt.Println(\"STOP: books\", format(total(), 2), \"≠ bank\", format(bank, 2))\n\t} else {\n\t\tfmt.Println(\"check ok: books match the bank\")\n\t}\n"
        cadence: line-by-line
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "STOP: books",
          timeoutMs: 8000,
        }
      - id: pt-stop
        type: console.point
        at: { mark: pt-stop }
        target: { text: "STOP: books", occurrence: 1 }
      - {
          id: expect-file-check,
          type: expect.file,
          at: { afterAction: run-3 },
          path: main.go,
          contains: "if total() != bank {",
        }
      - { id: dock-3, type: runtime.collapseDock, at: { mark: dock-3 } }

  - id: tension
    chapter: Retry နဲ့ duplicate
    narration: >-
      [[mark:show-retry]] ဒီနေရာမှာ စိတ်ဝင်စားစရာ ဖြစ်လာပါတယ်၊ principle တွေက တစ်ခုနဲ့ တစ်ခု
      ဆန့်ကျင်ဘက်ကို ဆွဲနေပါတယ်။ [[mark:pt-m1]] bank က deposit message ပို့ပြီး ကိုယ်က balance ထဲ
      ထည့်ပါတယ်။ [[mark:retry-2]] ကိုယ့် reply က လမ်းမှာ ပျောက်သွားရင် bank ဘက်က ငွေ ရောက်မရောက်
      မသိနိုင်တော့ပါဘူး။ [[mark:retry-3]] No lost data ကို ထိန်းဖို့ bank က ထပ်ပို့ပါတယ်၊ ဒါက မှန်တဲ့
      အလုပ်ပါ။ [[mark:pt-m5]] ပြဿနာက ကိုယ့်ဘက်မှာပါ၊ ထပ်ရောက်လာတဲ့ message ကို ထပ်တွက်လိုက်လို့ No
      invented data ကို ချိုးလိုက်တာ ဖြစ်ပါတယ်။ [[mark:retry-4]] network က message တစ်ခုကို တစ်ခါတည်း
      အတိအကျ ရောက်ဖို့ အာမခံ မပေးနိုင်ပါဘူး။ ဒါကြောင့် ပို့တဲ့ဘက်က ရောက်တဲ့အထိ ထပ်ပို့ပြီး၊
      လက်ခံတဲ့ဘက်က message id ကို မှတ်ထားလို့ ထပ်လာရင် ကျော်နိုင်ပါတယ်။ [[mark:pt-rule]] နှစ်ဖက် ပေါင်းမှ
      တစ်ခါတည်း ဖြစ်သလို ရလဒ် ရပါတယ်။ ဒီ course ထဲက pattern တော်တော်များများက ဒီ ဆွဲအား
      နှစ်ခုကြားမှာ နေပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Principles (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#principles",
        }
