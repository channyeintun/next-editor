  - id: map
    chapter: Course ရဲ့ မြေပုံ
    narration: >-
      [[mark:show-map]] course ကို အပိုင်း ကိုးပိုင်း ခွဲထားပါတယ်။ ဒီ lesson က ပထမ အပိုင်းပါ။
      [[mark:pt-p2]] ဒုတိယ အပိုင်းက ငွေပမာဏကို ဘယ်လို ကိုယ်စားပြုမလဲ ဆိုတာပါ။ [[mark:pt-p3]] တတိယက
      ledger ပါ၊ ledger ဆိုတာ ငွေ အရွေ့အပြောင်းတိုင်းကို မှတ်ထားတဲ့ စာရင်းပါ။ [[mark:pt-p4]] စတုတ္ထက
      ငွေကို ရွှေ့တဲ့ flow တွေကို ခုနကလို crash နဲ့ retry ကြားမှာ ဘယ်လို မှန်အောင် run မလဲ
      ဆိုတာပါ။ [[mark:map-2]] ပြီးရင် provider နဲ့ bank လို ကိုယ် မထိန်းနိုင်တဲ့ အပြင်ဘက်၊ ဘယ်သူ
      ဘာလုပ်ခွင့် ရှိလဲ ဆိုတဲ့ control တွေ၊ ငွေ system ကို test လုပ်နည်းတွေ လာပါမယ်။ [[mark:map-3]]
      နောက်ဆုံး နှစ်ပိုင်းက card၊ bank rail၊ trading၊ crypto လို domain ဝေါဟာရတွေနဲ့၊ pattern အားလုံးကို
      ပေါင်းသုံးတဲ့ end to end flow သုံးခု ဖြစ်ပြီး၊ system design interview lesson တစ်ခုနဲ့ ပြီးပါမယ်။
      [[mark:pt-each]] lesson တိုင်းမှာ run လို့ရတဲ့ Go code နဲ့ အဲဒီ ခေါင်းစဉ်အကြောင်း interview မှာ
      မေးလေ့ရှိတဲ့ မေးခွန်း တစ်ခု ပါပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — table of contents (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/",
        }
    actions:
      - { id: show-map, type: slide.show, at: { mark: show-map, offsetMs: -700 }, slideId: map-1 }
      - {
          id: pt-p1,
          type: slide.point,
          at: { afterAction: show-map },
          target: { x: 0.2, y: 0.414 },
        }
      - { id: pt-p2, type: slide.point, at: { mark: pt-p2 }, target: { x: 0.5, y: 0.414 } }
      - { id: pt-p3, type: slide.point, at: { mark: pt-p3 }, target: { x: 0.8, y: 0.414 } }
      - { id: pt-p4, type: slide.point, at: { mark: pt-p4 }, target: { x: 0.2, y: 0.626 } }
      - { id: map-2, type: slide.show, at: { mark: map-2 }, slideId: map-2 }
      - { id: pt-p5, type: slide.point, at: { afterAction: map-2 }, target: { x: 0.5, y: 0.626 } }
      - { id: map-3, type: slide.show, at: { mark: map-3 }, slideId: map-3 }
      - { id: pt-p8, type: slide.point, at: { afterAction: map-3 }, target: { x: 0.5, y: 0.837 } }
      - { id: pt-each, type: slide.point, at: { mark: pt-each }, target: { x: 0.494, y: 0.942 } }

  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] Fintech interview တွေမှာ ငွေကိုင်တဲ့ system က ပုံမှန် backend နဲ့ ဘာကွာလဲ လို့
      မေးလေ့ရှိပါတယ်။ ပိုပြီး သတိထားရတယ် လို့ပဲ ဖြေရင် မလုံလောက်ပါဘူး။ principle သုံးချက်နဲ့ ဖြေပါ။
      [[mark:iv-a]] ပထမ၊ message တိုင်း ထပ်ရောက်နိုင်ပြီး duplicate ဆိုတာ ငွေ ဖန်တီးလိုက်တာပဲ ဖြစ်လို့၊
      ငွေကို ထိတဲ့ handler တိုင်း idempotent ဖြစ်ရပါမယ်။ [[mark:iv-b]] ဒုတိယ၊ ဖြစ်ခဲ့သမျှကို မှတ်ထားပြီး
      row ကို ပြင်မရေးပါဘူး၊ write နှစ်ခုကြားမှာ crash ဖြစ်လည်း ငွေ မပျောက်အောင် design လုပ်ရပါမယ်။
      [[mark:iv-c]] တတိယ၊ ကိုယ့် စာရင်းကို bank လို အပြင်က source နဲ့ အမြဲ တိုက်စစ်ပြီး၊ မကိုက်ရင်
      ဆက်မသွားဘဲ ရပ်ရပါမယ်။ [[mark:iv-d]] ပြီးရင် ကိုယ့် design ဆုံးဖြတ်ချက် တစ်ခုချင်းကို ဘယ်
      principle ကို ကာကွယ်လဲ ဆိုတာနဲ့ ချိတ်ပြောပါ။ retry ဘာလို့ ထည့်လဲ၊ amount ကို ဘာ type နဲ့
      သိမ်းလဲ၊ provider ရဲ့ response ကို ဘာလို့ စစ်လဲ ဆိုတာကို principle တွေနဲ့ ရှင်းပြနိုင်မှ domain ကို
      နားလည်တဲ့ အဖြေ ဖြစ်ပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Principles (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#principles",
        }
    actions:
      - { id: show-iv, type: slide.show, at: { mark: show-iv, offsetMs: -700 }, slideId: iv-1 }
      - {
          id: pt-iv-q,
          type: slide.point,
          at: { afterAction: show-iv },
          target: { x: 0.125, y: 0.184 },
        }
      - { id: iv-a, type: slide.show, at: { mark: iv-a }, slideId: iv-2 }
      - {
          id: pt-iv-a,
          type: slide.point,
          at: { afterAction: iv-a },
          target: { x: 0.138, y: 0.359 },
        }
      - { id: iv-b, type: slide.show, at: { mark: iv-b }, slideId: iv-3 }
      - {
          id: pt-iv-b,
          type: slide.point,
          at: { afterAction: iv-b },
          target: { x: 0.138, y: 0.506 },
        }
      - { id: iv-c, type: slide.show, at: { mark: iv-c }, slideId: iv-4 }
      - {
          id: pt-iv-c,
          type: slide.point,
          at: { afterAction: iv-c },
          target: { x: 0.138, y: 0.652 },
        }
      - { id: iv-d, type: slide.show, at: { mark: iv-d }, slideId: iv-5 }
      - {
          id: pt-iv-d,
          type: slide.point,
          at: { afterAction: iv-d },
          target: { x: 0.138, y: 0.799 },
        }

  - id: try-it
    chapter: ကိုယ်တိုင် စမ်းကြည့်ပါ
    narration: >-
      [[mark:close-iv]] ကိုယ်တိုင် စမ်းကြည့်ဖို့ တစ်ခု ရှိပါတယ်။ [[mark:sel-try]] transfer လုပ်တဲ့
      ပမာဏကို ယူရို ငါးဆယ်ကနေ တစ်ရာ ပြောင်းပြီး run ကြည့်ပါ။ check က စာရင်းနဲ့ bank ကိုက်တယ်လို့
      ပြပါလိမ့်မယ်၊ ဒါပေမဲ့ user နှစ်ယောက်လုံးရဲ့ balance က မှားနေတုန်းပါ။ ပေါ်လာတဲ့ ငွေနဲ့ ပျောက်သွားတဲ့
      ငွေ တူသွားလို့ အချင်းချင်း ကြေသွားတာပါ။ [[mark:try-why]] စုစုပေါင်း check တစ်ခုက တစ်ခုခု
      မှားနေတယ် ဆိုတာကို ပြနိုင်ပေမဲ့ ဘာမှားလဲ ဆိုတာ မပြနိုင်ပါဘူး။ ဒါကြောင့် နောက်ပိုင်းမှာ
      transaction တစ်ခုချင်း၊ account တစ်ခုချင်း အဆင့်ထိ စစ်တဲ့ နည်းတွေ လိုလာပါတယ်။ [[mark:recap]]
      ပြန်ချုပ်ရရင်၊ ငွေ system တစ်ခုမှာ ငွေ မဖန်တီးရ၊ မပျောက်ရ၊ ဘာကိုမှ အလိုလို မယုံရ ဆိုတဲ့ မူ
      သုံးချက်ကို ထိန်းရပါတယ်။ နောက် lesson မှာတော့ အခြေခံအကျဆုံး မေးခွန်းကနေ စပါမယ်၊ ငွေပမာဏကို
      ဘယ် type နဲ့ ကိုယ်စားပြုမလဲ၊ float ဘာလို့ မသုံးရလဲ ဆိုတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Principles (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#principles",
        }
    actions:
      - { id: close-iv, type: slide.close, at: { mark: close-iv } }
      - id: sel-try
        type: editor.select
        at: { mark: sel-try }
        target: { file: main.go, text: "5000, true", occurrence: 1 }

checks:
  - { type: timing.p95Ms, max: 300 }
