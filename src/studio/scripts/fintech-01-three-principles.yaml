# Fintech Engineering, lesson 01: the three principles of money software (Burmese).
#
# Source: Fintech Engineering Handbook, introduction, "For whom?" and "Principles"
# (CC BY 4.0, Voytek Pitula).
# Start state: main.go is a naive wallet (one balance number per user) that handles the same
# deposit message twice, as a bank retry delivers it.
# Edits, all insert-only:
#   1. a transfer that dies after the debit, totals before and after -> run-2 prints 200.00 / 150.00
#   2. a check of the books against the bank's own figure             -> run-3 prints STOP
# Runs: run-1 user:1042 balance 200.00 (invented), run-2 total drops (lost), run-3 the check (trust).
# Figures: why (ordinary bug vs money bug), three (the principles and their tools), retry (the bank
# is right to retry; the duplicate is ours), map (the nine parts), iv (the interview answer).
# Built by ~/Documents/fintech-course-work/tools/build-lesson.ts; fixtures by sim-go.ts --write.
schemaVersion: 1

lesson:
  slug: fintech-01-three-principles
  title: "Fintech Engineering 01: ငွေကိုင်တဲ့ software ရဲ့ မူ ၃ ချက်"
  locale: my-MM
  workspace:
    lessonType: go
    name: Fintech Engineering
    entryFilePath: main.go
    # One file: an open explorer would be a list of one beside the code.
    sidebarStartsCollapsed: true
    files:
      main.go: |
        package main

        import "fmt"

        // A naive wallet: one balance per user, in cents, changed in place.
        var balance = map[string]int64{}

        // Deposit is the bank's message: money for a user has arrived.
        type Deposit struct {
        	ID     string
        	User   string
        	Amount int64
        }

        func handleDeposit(d Deposit) {
        	balance[d.User] += d.Amount
        }

        // transfer is two separate writes. crashAfterDebit stands for the
        // process dying between them: a deploy, an out-of-memory kill, a timeout.
        func transfer(from, to string, amount int64, crashAfterDebit bool) {
        	balance[from] -= amount
        	if crashAfterDebit {
        		return
        	}
        	balance[to] += amount
        }

        func total() int64 {
        	return balance["user:1042"] + balance["user:2077"]
        }

        // format prints minor units with exp decimal places: format(1234, 2) is "12.34".
        func format(minor int64, exp int) string {
        	sign := ""
        	if minor < 0 {
        		sign, minor = "-", -minor
        	}
        	digits := fmt.Sprintf("%0*d", exp+1, minor)
        	if exp == 0 {
        		return sign + digits
        	}
        	return sign + digits[:len(digits)-exp] + "." + digits[len(digits)-exp:]
        }

        func main() {
        	d := Deposit{ID: "dep-1", User: "user:1042", Amount: 10000}
        	handleDeposit(d)
        	handleDeposit(d) // our reply was lost, so the bank sent the same message again
        	fmt.Println("bank sent:", format(d.Amount, 2))
        	fmt.Println("user:1042 balance:", format(balance["user:1042"], 2))
        }
