build:
  # Studio replaces this built-in profile at render time with the Burmese provider chosen in the
  # render console (AthanLab with the user's own key, or VoxCPM2 when that feature is enabled).
  voiceProfile: pocket-alba-v1
  seed: 3106
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "တန်ဖိုး အများကြီးရဲ့ type"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ အော်ဒါ တစ်ခုရဲ့ ပုံစံကို object type နဲ့ ရေးပြီး၊ type
      alias နဲ့ Order ဆိုတဲ့ နာမည် ပေးခဲ့ပါတယ်။ ဒါပေမဲ့ ဆိုင်မှာ တစ်နေ့ကို အော်ဒါ တစ်ခုတည်း ရှိတာ
      မဟုတ်ပါဘူး။ ဒီ lesson မှာတော့ တန်ဖိုး အများကြီးကို စုထားတဲ့ အခါ type ဘယ်လို ပေးမလဲ ဆိုတာ
      ကြည့်သွားပါမယ်။ [[mark:draw-array]] ပထမ တစ်ခုက array ပါ။ array ဆိုတာ တန်ဖိုးတွေကို အစဉ်လိုက်
      စီထားတဲ့ စာရင်း ဖြစ်ပြီး၊ array type က အထဲက တန်ဖိုး တိုင်းဟာ type တစ်မျိုးတည်း ဖြစ်ရမယ်လို့
      ပြောပါတယ်။ ဥပမာ အော်ဒါတွေရဲ့ array ဆိုရင် တစ်ခုချင်းစီက Order ဖြစ်ရပြီး၊ ဘယ်နှစ်ခု ပါပါ
      ရပါတယ်။ [[mark:draw-tuple]] ဒုတိယက tuple ပါ။ tuple ဆိုတာ အရေအတွက် သတ်မှတ်ထားပြီး နေရာ
      တစ်ခုချင်းစီမှာ type သီးသန့် ရှိတဲ့ array ပါ။ ဥပမာ ပထမ နေရာမှာ string ထား၊ ဒုတိယ နေရာမှာ
      number ထား ဆိုပြီး နေရာလိုက် သတ်မှတ်တာပါ။ [[mark:draw-argument]] တတိယကတော့ type argument ပါ။
      Set လို၊ Map လို တန်ဖိုးတွေ ထည့်သိမ်းတဲ့ container တစ်ခုကို ဆောက်တဲ့ အခါ၊ နာမည်ရဲ့ နောက်မှာ
      type တစ်ခု ထည့်ပေးပြီး အထဲမှာ ဘာ ထည့်မလဲ ဆိုတာ ကြိုပြောလို့ ရပါတယ်။ အဲဒီလို ပေးလိုက်တဲ့ type
      ကို type argument လို့ ခေါ်ပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 4: Essential Types and Annotations (arrays and tuples, passing types to functions)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/essential-types-and-annotations",
        }
      - {
          title: "TypeScript Handbook: Everyday Types (arrays)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#arrays",
        }
      - {
          title: "TypeScript Handbook: Object Types (tuple types)",
          url: "https://www.typescriptlang.org/docs/handbook/2/objects.html#tuple-types",
        }
    actions:
      - id: open-board-a
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-array
        type: whiteboard.apply
        at: { mark: draw-array }
        upsertIds: [r1-label, r1-box1, r1-t1, r1-box2, r1-t2, r1-box3, r1-t3, r1-more, r1-desc]
        drawMs: 3600
      - id: draw-tuple
        type: whiteboard.apply
        at: { mark: draw-tuple }
        upsertIds: [r2-label, r2-box1, r2-t1, r2-box2, r2-t2, r2-desc]
        drawMs: 3000
      - id: draw-argument
        type: whiteboard.apply
        at: { mark: draw-argument }
        upsertIds: [r3-label, r3-code, r3-desc]
        drawMs: 2400

  - id: starter
    narration: >
      [[mark:close-board]] ဒီနေ့ code ကို ကြည့်ရအောင်။ [[mark:select-import]] ပြီးခဲ့တဲ့ lesson က Order type ကို သူ့ ဖိုင်
      သီးသန့်ထဲ ရွှေ့ထားပြီး၊ main ဖိုင်က import type နဲ့ ယူသုံးထားပါတယ်။ [[mark:select-orders]] ဒီ array ထဲမှာ ဒီနေ့
      အော်ဒါ သုံးခု ရှိပြီး၊ ကော်ဖီ အော်ဒါမှာ ခွက် အရေအတွက်ကို ရေးဖို့ ကျန်ခဲ့ပါတယ်။
      [[mark:select-loop]] အောက်က loop က အော်ဒါ တစ်ခုချင်းစီရဲ့ ခွက် အရေအတွက်ကို ပေါင်းပြီး၊ ဒီနေ့
      ခွက် စုစုပေါင်းကို တွက်ပါတယ်။ [[mark:select-best]] ဒီ array ကတော့ ဒီနေ့ အရောင်းရဆုံး
      ပစ္စည်းနဲ့ ရောင်းရတဲ့ ခွက် အရေအတွက်ကို တွဲထားပြီး၊ အောက်က line မှာ ခွက် အရေအတွက်ကို ၁၅၀၀
      ကျပ်နဲ့ မြှောက်ပြီး ရောင်းရငွေကို ထုတ်ပြပါတယ်။ [[mark:select-tables]] Set ကတော့ ထပ်နေတဲ့
      တန်ဖိုးကို တစ်ခါပဲ သိမ်းတဲ့ container ပါ။ ဒီမှာ အော်ဒါ ဝင်လာတဲ့ စားပွဲ နံပါတ်တွေကို သိမ်းပြီး၊
      ဒုတိယ တစ်ခုကတော့ QR menu ကနေ စာသား အနေနဲ့ ဝင်လာတာပါ။ [[mark:select-json]] နောက်ဆုံး
      အပိုင်းကတော့ ဖုန်း app က စာသား အနေနဲ့ သိမ်းထားတဲ့ အော်ဒါကို object ပြန်ပြောင်းပြီး၊ customer က
      တစ်ခွက် ထပ်မှာလို့ ခွက် အရေအတွက်ကို တစ် ပေါင်းပါတယ်။
    sources:
      - {
          title: "MDN: Set",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Set",
        }
      - {
          title: "MDN: JSON.parse()",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/JSON/parse",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: select-import
        type: editor.select
        at: { mark: select-import }
        target: { file: src/main.ts, text: 'import type { Order } from "./order";', occurrence: 1 }
      - id: select-orders
        type: editor.select
        at: { mark: select-orders }
        target:
          {
            file: src/main.ts,
            text: "  { item: \"လက်ဖက်ရည်\", cups: 2, table: 5 },\n  { item: \"ကော်ဖီ\", table: 3 },\n  { item: \"သံပုရာရည်\", cups: 1 },",
            occurrence: 1,
          }
      - id: select-loop
        type: editor.select
        at: { mark: select-loop }
        target:
          {
            file: src/main.ts,
            text: "for (const order of orders) totalCups += order.cups;",
            occurrence: 1,
          }
      - id: select-best
        type: editor.select
        at: { mark: select-best }
        target:
          {
            file: src/main.ts,
            text: "const best = [\"လက်ဖက်ရည်\", 12];\nconsole.log(best[0], best[1] * 1500, \"ကျပ်\");",
            occurrence: 1,
          }
      - id: select-tables
        type: editor.select
        at: { mark: select-tables }
        target:
          {
            file: src/main.ts,
            text: "tables.add(5);\ntables.add(\"5\"); // QR menu",
            occurrence: 1,
          }
      - id: select-json
        type: editor.select
        at: { mark: select-json }
        target:
          {
            file: src/main.ts,
            text: "const fromPhone = JSON.parse(saved);\nconsole.log(fromPhone.item, fromPhone.cups + 1, \"ခွက်\");",
            occurrence: 1,
          }

  - id: panel
    narration: >
      [[mark:panel-ready]] ညာဘက်က panel ရဲ့ Output ကို အရင် ကြည့်ရအောင်။ ခွက် စုစုပေါင်းက ဂဏန်း မဟုတ်ဘူး
      ဆိုတဲ့ NaN ဖြစ်နေပါတယ်။ [[mark:read-set]] စားပွဲ Set ထဲမှာ ဂဏန်း ၅ နဲ့ စာသား ၅ နှစ်ခုလုံး
      ပါနေလို့ စားပွဲ တစ်ခုတည်းကို နှစ်ခါ မှတ်ထားပြီး၊ ဖုန်းက အော်ဒါကလည်း သုံးခွက် ဖြစ်ရမယ့် အစား ၂၁
      ခွက် ဖြစ်နေပါတယ်။ [[mark:read-errors]] Errors မှာတော့ error နှစ်ခုပဲ ရှိပါတယ်။ ပထမ တစ်ခုက loop
      ထဲက ခွက် အရေအတွက်ဟာ undefined ဖြစ်နိုင်တယ်လို့ ပြောပြီး၊ ဒုတိယ တစ်ခုက အရောင်းရဆုံး ပစ္စည်းရဲ့ ခွက်
      အရေအတွက်ကို မြှောက်တဲ့ နေရာမှာ ဂဏန်း ဖြစ်မှန်း မသေချာတဲ့ တန်ဖိုးကို မြှောက်လို့ မရဘူးလို့ ပြောပါတယ်။
      ကျန်တဲ့ ပြဿနာ နှစ်ခုကိုတော့ TypeScript က ဘာမှ မပြောနိုင်သေးပါဘူး။
    sources:
      - {
          title: "MDN: NaN",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/NaN",
