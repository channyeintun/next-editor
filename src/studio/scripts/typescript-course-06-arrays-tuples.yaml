  - id: arrays
    chapter: "Array type"
    narration: >
      [[mark:type-query-orders]] အော်ဒါ array ကို TypeScript က ဘယ်လို မြင်လဲ၊ query comment နဲ့
      မေးကြည့်ရအောင်။ [[mark:read-query-orders]] Types မှာ ရှည်လျားတဲ့ type တစ်ခု ပေါ်လာပါပြီ။
      အဆုံးက square bracket နှစ်ခုက array ကို ပြပြီး၊ အထဲမှာတော့ object ပုံစံ သုံးမျိုး ပါပါတယ်။
      TypeScript က အော်ဒါ သုံးခုကို ကြည့်ပြီး ပုံစံ မတူတာ သုံးမျိုး ရှိတယ်လို့ infer လုပ်ထားလို့၊
      ခွက် အရေအတွက် မပါတဲ့ ကော်ဖီ အော်ဒါကိုလည်း လက်ခံထားပြီး loop ထဲရောက်မှ error ပြနေတာပါ။
      [[mark:type-array]] ဒါကြောင့် ဒီ array က အော်ဒါတွေရဲ့ array ဖြစ်တယ်လို့ ကိုယ်တိုင်
      ကြေညာပေးပါမယ်။ ဒီမှာတော့ Array ဆိုတဲ့ နာမည်ရဲ့ နောက်မှာ Order ကို type argument အနေနဲ့ ပေးတဲ့
      ရေးနည်းကို သုံးပါမယ်။ [[mark:read-array]] Types မှာ Order ရဲ့ နောက်မှာ square bracket နှစ်ခု
      ပါတဲ့ ပုံစံကို ပြနေပါပြီ။ ကိုယ် ရေးတဲ့ ပုံစံနဲ့ မတူပေမယ့်၊ ဒီ နှစ်မျိုးက type တစ်ခုတည်းကို
      ရေးနည်း နှစ်မျိုးပဲ ဖြစ်ပြီး၊ TypeScript က အတိုကောက် ပုံစံနဲ့ ပြတာပါ။ လက်တွေ့မှာလည်း အတိုကောက်
      ပုံစံကို ပိုသုံးကြပါတယ်။ [[mark:select-coffee]] Errors မှာလည်း loop ထဲက error ပျောက်သွားပြီး၊
      ကော်ဖီ အော်ဒါမှာ ခွက် အရေအတွက် မပါဘူး၊ ဒါပေမဲ့ Order type က လိုအပ်တယ် ဆိုတဲ့ error
      ပေါ်လာပါပြီ။ array ရဲ့ type ကို ကြေညာလိုက်တော့ အထဲက တန်ဖိုး တစ်ခုချင်းစီကို စစ်ပြီး၊ အမှား
      စဖြစ်တဲ့ နေရာကို တန်းပြပေးတာပါ။ [[mark:type-cups]] ကော်ဖီ အော်ဒါမှာ ခွက် အရေအတွက်ကို
      ထည့်ပေးလိုက်ပါမယ်။ [[mark:read-cups]] error ပျောက်သွားပြီး၊ Output မှာ ခွက် စုစုပေါင်းက ၄ ခွက်
      ဖြစ်သွားပါပြီ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 4: Essential Types and Annotations (arrays, arrays of objects)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/essential-types-and-annotations",
        }
      - {
          title: "TypeScript Handbook: Everyday Types (arrays: number[] and Array<number>)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#arrays",
        }
      - {
          title: "TypeScript Handbook: Object Types (the Array type)",
          url: "https://www.typescriptlang.org/docs/handbook/2/objects.html#the-array-type",
        }
    actions:
      - id: type-query-orders
        type: editor.type
        at: { mark: type-query-orders }
        target:
          {
            file: src/main.ts,
            after: "for (const order of orders) totalCups += order.cups;\n",
            occurrence: 1,
          }
        text: "//                  ^?\n"
        cadence: fast-explainer
      - id: expect-orders-inferred
        type: expect.preview
        at: { afterAction: type-query-orders }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        textContains: "const orders: ({"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-array
        type: editor.type
        at: { mark: type-array }
        target: { file: src/main.ts, after: "const orders", occurrence: 1 }
        text: ": Array<Order>"
      - id: expect-array-type
        type: expect.preview
        at: { afterAction: type-array }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        attribute: { name: data-type, value: "const orders: Order[]" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-array-errors
        type: expect.preview
        at: { afterAction: expect-array-type }
        timeoutMs: 5000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-array-missing
        type: expect.preview
        at: { afterAction: expect-array-errors }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Property 'cups' is missing in type '{ item: string; table: number; }' but required in type 'Order'."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: select-coffee
        type: editor.select
        at: { mark: select-coffee }
        target: { file: src/main.ts, text: '{ item: "ကော်ဖီ", table: 3 }', occurrence: 1 }
      - id: type-cups
        type: editor.type
        at: { mark: type-cups }
        target: { file: src/main.ts, after: '  { item: "ကော်ဖီ", ', occurrence: 1 }
        text: "cups: 1, "
      - id: expect-cups-one-error
        type: expect.preview
        at: { afterAction: type-cups }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-cups-total
        type: expect.preview
        at: { afterAction: expect-cups-one-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-1 }
        textContains: "ခွက် စုစုပေါင်း 4"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: tuples
    chapter: "Tuple"
    narration: >
      [[mark:type-query-best]] အခု အရောင်းရဆုံး ပစ္စည်းကို မှတ်ထားတဲ့ array ရဲ့ type ကို မေးကြည့်ရအောင်။
      [[mark:read-query-best]] string ဒါမှမဟုတ် number တွေရဲ့ array လို့ ပြနေပါတယ်။ ဆိုလိုတာက ဘယ်
      နေရာမှာ မဆို string ဖြစ်နိုင်သလို number လည်း ဖြစ်နိုင်တယ် ဆိုတာပါ။ ဒါကြောင့် ဒုတိယ နေရာက
      ဂဏန်း ဖြစ်မယ်လို့ မသေချာလို့ မြှောက်တဲ့ နေရာမှာ error ပြနေတာပါ။ Output မှာ ရောင်းရငွေက
      မှန်နေတာကိုလည်း သတိထား ကြည့်ပါ။ run တဲ့ အချိန်မှာ တကယ့် တန်ဖိုးက ဂဏန်း ဖြစ်နေပေမယ့်၊
      TypeScript က ဒီ array ရဲ့ ပုံစံကို မသိလို့ပါ။ [[mark:type-tuple]] ဒါကြောင့် ပထမ နေရာက string
      ဖြစ်ပြီး ဒုတိယ နေရာက number ဖြစ်တဲ့ tuple type ကို ထည့်ပေးပါမယ်။ [[mark:read-tuple]] error
      ပျောက်သွားပြီး၊ Types မှာ square bracket ထဲမှာ string နဲ့ number ကို အစဉ်လိုက် ပြနေပါပြီ။
      tuple က နေရာ တစ်ခုချင်းစီရဲ့ type ကို မှတ်ထားလို့ ဒုတိယ နေရာက number ဆိုတာ သိသွားပြီး၊
      အရေအတွက်လည်း ပုံသေ ဖြစ်လို့ တန်ဖိုး သုံးခု ထည့်ရင် error ပြပါလိမ့်မယ်။ [[mark:type-labels]]
      နေရာ တစ်ခုချင်းစီကို နာမည်လည်း ပေးလို့ ရပါတယ်။ ပထမ နေရာကို ပစ္စည်းနာမည်၊ ဒုတိယ နေရာကို ခွက်
      အရေအတွက် ဆိုပြီး နာမည် ပေးပါမယ်။ [[mark:read-labels]] Types မှာ နာမည်တွေ ပါလာပါပြီ။ ဒီ
      နာမည်တွေက type ကို မပြောင်းပါဘူး၊ code ဖတ်တဲ့သူ နားလည်လွယ်အောင် ထည့်တာပါ။ [[mark:type-quick]]
      နေရာ တစ်ခုကို optional လည်း လုပ်လို့ ရပါတယ်။ ကောင်တာက အမြန် အော်ဒါအတွက် tuple အသစ် တစ်ခု
      ရေးပါမယ်။ ခွက် အရေအတွက်ရဲ့ နာမည်နောက်မှာ question mark ပါလို့၊ ပစ္စည်းနာမည် တစ်ခုတည်းနဲ့လည်း
      ရေးလို့ ရပါတယ်။ [[mark:read-quick]] Types မှာ ဒုတိယ နေရာကို number ဒါမှမဟုတ် undefined လို့
      ပြနေပါတယ်။ ပြီးခဲ့တဲ့ lesson က optional property လိုပဲ၊ မပါဘဲ နေနိုင်တဲ့ နေရာ ဖြစ်လို့ undefined
      ပါလာတာပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 4: Essential Types and Annotations (tuples, named tuples, optional members)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/essential-types-and-annotations",
        }
      - {
          title: "TypeScript Handbook: Object Types (tuple types, optional tuple elements)",
          url: "https://www.typescriptlang.org/docs/handbook/2/objects.html#tuple-types",
        }
      - {
          title: "TypeScript 4.0 release notes: labeled tuple elements",
          url: "https://www.typescriptlang.org/docs/handbook/release-notes/typescript-4-0.html#labeled-tuple-elements",
        }
    actions:
      - id: type-query-best
        type: editor.type
        at: { mark: type-query-best }
        target: { file: src/main.ts, after: "const best = [\"လက်ဖက်ရည်\", 12];\n", occurrence: 1 }
        text: "//    ^?\n"
      - id: expect-best-array
        type: expect.preview
        at: { afterAction: type-query-best }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-2 }
        attribute: { name: data-type, value: "const best: (string | number)[]" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-tuple
        type: editor.type
        at: { mark: type-tuple }
        target: { file: src/main.ts, after: "const best", occurrence: 1 }
        text: ": [string, number]"
      - id: expect-tuple-clean
        type: expect.preview
        at: { afterAction: type-tuple }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-tuple-type
        type: expect.preview
        at: { afterAction: expect-tuple-clean }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-2 }
        attribute: { name: data-type, value: "const best: [string, number]" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-label-item
        type: editor.type
        at: { mark: type-labels }
        target: { file: src/main.ts, after: "const best: [", occurrence: 1 }
        text: "item: "
        cadence: fast-explainer
      - id: type-label-cups
        type: editor.type
        at: { afterAction: type-label-item }
        target: { file: src/main.ts, after: "const best: [item: string, ", occurrence: 1 }
        text: "cups: "
        cadence: fast-explainer
      - id: expect-labels
        type: expect.preview
        at: { afterAction: type-label-cups }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-2 }
        attribute: { name: data-type, value: "const best: [item: string, cups: number]" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-quick
        type: editor.type
        at: { mark: type-quick }
        target:
          {
            file: src/main.ts,
            after: "console.log(best[0], best[1] * 1500, \"ကျပ်\");\n",
            occurrence: 1,
          }
        text: "const quick: [item: string, cups?: number] = [\"သံပုရာရည်\"];\n//    ^?\n"
        cadence: line-by-line
      - id: expect-quick
        type: expect.preview
        at: { afterAction: type-quick }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-3 }
        attribute:
          { name: data-type, value: "const quick: [item: string, cups?: number | undefined]" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-quick-clean
        type: expect.preview
        at: { afterAction: expect-quick }
        timeoutMs: 5000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: type-arguments
    chapter: "Set၊ Map နဲ့ type argument"
    narration: >
      [[mark:type-query-tables]] အခု စားပွဲ နံပါတ်တွေကို သိမ်းတဲ့ Set ကို query comment နဲ့
      မေးကြည့်ရအောင်။ [[mark:read-query-tables]] unknown တွေရဲ့ Set လို့ ပြနေပါတယ်။ unknown ဆိုတာ ဘာ
      type မှန်း မသိဘူး ဆိုတဲ့ အဓိပ္ပာယ်ပါ။ Set ကို ဆောက်တဲ့ အခါ ဘာ ထည့်မလဲ မပြောခဲ့လို့၊ စာသား
      ဖြစ်နေတဲ့ စားပွဲ နံပါတ်ကိုလည်း TypeScript က လက်ခံလိုက်တာပါ။ [[mark:type-set-argument]] Set ရဲ့
      နာမည်နောက်မှာ number ကို type argument အနေနဲ့ ပေးလိုက်ပါမယ်။ [[mark:read-set-argument]] Types
      မှာ number တွေရဲ့ Set ဖြစ်သွားပြီး၊ Errors မှာတော့ QR menu က စာသားကို number ရှိရမယ့် နေရာမှာ
      ထည့်လို့ မရဘူး ဆိုတဲ့ error ပေါ်လာပါပြီ။ [[mark:type-number]] ဒါကြောင့် စာသားကို ဂဏန်း
      ပြောင်းပေးတဲ့ Number function နဲ့ ပတ်ပေးပါမယ်။ [[mark:read-number]] error ပျောက်သွားပြီး၊
      Output မှာ စားပွဲ Set ထဲမှာ ၅ တစ်ခုတည်း ကျန်ပါတော့တယ်။ [[mark:type-map]] Map ကတော့ key နဲ့
      value ကို တွဲသိမ်းတဲ့ container ပါ။ စားပွဲ နံပါတ်ကနေ customer နာမည်ကို ရှာလို့ ရအောင် Map
      တစ်ခု ဆောက်ပါမယ်။ ဒီတစ်ခါ type argument နှစ်ခု ပေးရပြီး၊ ပထမ တစ်ခုက key ဖြစ်တဲ့ စားပွဲ
      နံပါတ်အတွက်၊ ဒုတိယ တစ်ခုက value ဖြစ်တဲ့ customer နာမည်အတွက်ပါ။ [[mark:read-map]] Output မှာ
      စားပွဲ ၅ ကနေ လှလှ ကို ညွှန်ထားတဲ့ Map ပေါ်လာပါပြီ။ ဒီ Map ထဲကို စာသား key ဒါမှမဟုတ် ဂဏန်း
      value ထည့်ရင်တော့ TypeScript က error ပြပါလိမ့်မယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 4: Essential Types and Annotations (passing types to Set and Map)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/essential-types-and-annotations",
        }
      - {
          title: "TypeScript Handbook: Generics (type arguments)",
          url: "https://www.typescriptlang.org/docs/handbook/2/generics.html",
        }
      - {
          title: "MDN: Map",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Map",
        }
      - {
          title: "MDN: Number() constructor (conversion)",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Number/Number",
        }
    actions:
      - id: type-query-tables
        type: editor.type
        at: { mark: type-query-tables }
        target: { file: src/main.ts, after: "const tables = new Set();\n", occurrence: 1 }
        text: "//    ^?\n"
      - id: expect-set-unknown
        type: expect.preview
        at: { afterAction: type-query-tables }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-4 }
        attribute: { name: data-type, value: "const tables: Set<unknown>" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-set-argument
        type: editor.type
        at: { mark: type-set-argument }
        target: { file: src/main.ts, after: "const tables = new Set", occurrence: 1 }
        text: "<number>"
      - id: expect-set-number
        type: expect.preview
        at: { afterAction: type-set-argument }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-4 }
        attribute: { name: data-type, value: "const tables: Set<number>" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-set-error
        type: expect.preview
        at: { afterAction: expect-set-number }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Argument of type 'string' is not assignable to parameter of type 'number'."
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-number-open
        type: editor.type
        at: { mark: type-number }
        target: { file: src/main.ts, after: "tables.add(", occurrence: 2 }
        text: "Number("
        cadence: fast-explainer
      - id: type-number-close
        type: editor.type
        at: { afterAction: type-number-open }
        target: { file: src/main.ts, after: 'tables.add(Number("5"', occurrence: 1 }
        text: ")"
        cadence: fast-explainer
      - id: expect-number-clean
        type: expect.preview
        at: { afterAction: type-number-close }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-number-set
        type: expect.preview
        at: { afterAction: expect-number-clean }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-3 }
        textContains: "Set(1) { 5 }"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-map
        type: editor.type
        at: { mark: type-map }
        target: { file: src/main.ts, after: "console.log(\"စားပွဲ\", tables);\n", occurrence: 1 }
        text: "const seats = new Map<number, string>();\nseats.set(5, \"လှလှ\");\nconsole.log(seats);\n"
        cadence: line-by-line
      - id: expect-map-output
        type: expect.preview
        at: { afterAction: type-map }
        timeoutMs: 8000
        target: { by: testId, value: ts-out-4 }
        textContains: "Map(1) { 5 => 'လှလှ' }"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-map-clean
        type: expect.preview
        at: { afterAction: expect-map-output }
        timeoutMs: 5000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: json
    chapter: "JSON parse နဲ့ any"
    narration: >
      [[mark:type-query-cups]] နောက်ဆုံး ပြဿနာ ဖြစ်တဲ့ ဖုန်းက အော်ဒါကို ကြည့်ရအောင်။ ခွက်
      အရေအတွက်ကို query comment နဲ့ မေးကြည့်ပါမယ်။ [[mark:read-query-cups]] any လို့ ပြနေပါတယ်။ JSON
      parse က စာသားကနေ ဘာ ထွက်လာမလဲ ကြိုမသိနိုင်လို့ any ကို ပြန်ပေးတာ ဖြစ်ပြီး၊ any ဖြစ်နေတော့
      TypeScript က ဘာမှ စစ်မပေးပါဘူး။ [[mark:type-parse-argument]] Set မှာလိုပဲ type argument
      ပေးကြည့်ရအောင်။ [[mark:read-parse-argument]] ဒီ function က type argument လုံးဝ မယူဘူး ဆိုတဲ့
      error ပေါ်လာပါပြီ။ function တိုင်းက type argument လက်ခံတာ မဟုတ်ပါဘူး။ ဘယ် function က လက်ခံလဲ
      ဆိုတာကို VS Code မှာ function နာမည်ပေါ် mouse တင်ကြည့်ပြီး သိနိုင်ပါတယ်။ လက်ခံတဲ့ function ဆိုရင်
      နာမည်ရဲ့ နောက်မှာ angle bracket ပါနေတာကို တွေ့ရပါမယ်။ [[mark:type-parse-fix]]
      ဒါကြောင့် variable ကိုပဲ Order type လို့ annotation ထည့်တဲ့ line အသစ် ရေးပြီး၊ ခုနက line ကို
      comment လုပ်ပြီး ပိတ်ထားပါမယ်။ [[mark:read-parse-fix]] error ပျောက်သွားပြီး၊ Types မှာ ခွက်
      အရေအတွက်ကို number လို့ ပြနေပါပြီ။ [[mark:read-faith]] ဒါပေမဲ့ Output ကို ကြည့်ပါ။ ၂၁ ဆိုတဲ့
      အဖြေ မှားက ဒီ အတိုင်း ရှိနေပါသေးတယ်။ ဖုန်းထဲက data မှာ ခွက် အရေအတွက်ကို စာသား အနေနဲ့
      သိမ်းထားလို့၊ တစ် ပေါင်းလိုက်တော့ စာသား ဆက်သွားတာပါ။ [[mark:explain-faith]] annotation က ဒီ
      object ဟာ Order ဖြစ်တယ်လို့ TypeScript ကို ကတိပေးလိုက်တာ ဖြစ်ပြီး၊ run တဲ့ အချိန်မှာ data ကို
      တကယ် စစ်ပေးတာ မဟုတ်ပါဘူး။ ဒါကြောင့် အပြင်ကနေ ဝင်လာတဲ့ data ကို annotation ပေးတဲ့ အခါ
      သတိထားရပါမယ်။ data ကို တကယ် စစ်ပေးတဲ့ နည်းကိုတော့ နောက်ပိုင်း Zod lesson မှာ ကြည့်ပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 4: Essential Types and Annotations (not all functions can receive types)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/essential-types-and-annotations",
        }
      - {
          title: "MDN: JSON.parse()",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/JSON/parse",
        }
      - {
          title: "TypeScript Handbook: Everyday Types (any)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#any",
        }
    actions:
      - id: type-query-cups
        type: editor.type
        at: { mark: type-query-cups }
        target:
          {
            file: src/main.ts,
            after: "console.log(fromPhone.item, fromPhone.cups + 1, \"ခွက်\");\n",
            occurrence: 1,
          }
        text: "//                                    ^?\n"
        cadence: block
      - id: expect-cups-any
        type: expect.preview
        at: { afterAction: type-query-cups }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-5 }
        attribute: { name: data-type, value: "any" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-parse-argument
        type: editor.type
        at: { mark: type-parse-argument }
        target: { file: src/main.ts, after: "JSON.parse", occurrence: 1 }
        text: "<Order>"
      - id: expect-parse-error-count
        type: expect.preview
        at: { afterAction: type-parse-argument }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-parse-error
        type: expect.preview
        at: { afterAction: expect-parse-error-count }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Expected 0 type arguments, but got 1."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-parse-fix
        type: editor.type
        at: { mark: type-parse-fix }
        target:
          {
            file: src/main.ts,
            after: "const saved = '{ \"item\": \"ကော်ဖီ\", \"cups\": \"2\" }';\n",
            occurrence: 1,
          }
        text: "const fromPhone: Order = JSON.parse(saved);\n// "
        cadence: block
      - id: expect-parse-clean
        type: expect.preview
        at: { afterAction: type-parse-fix }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-cups-number
        type: expect.preview
        at: { afterAction: expect-parse-clean }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-5 }
        attribute: { name: data-type, value: "(property) cups: number" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-still-21
        type: expect.preview
        at: { mark: read-faith }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-5 }
        textContains: "ကော်ဖီ 21 ခွက်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: recap
    narration: >
      [[mark:recap-array]] ဒါဆို ပြန်ချုပ်ရရင်၊ array type က အထဲက တန်ဖိုး တိုင်း type တူရမယ်လို့
      ပြောပြီး၊ ရေးနည်း နှစ်မျိုး ရှိပေမယ့် type တစ်ခုတည်းပါ။ အော်ဒါတွေရဲ့ array လို့ ကြေညာထားရင်
      အထဲက အော်ဒါ တိုင်းကို စစ်ပေးပါတယ်။ [[mark:recap-tuple]] tuple ကတော့ နေရာ တစ်ခုချင်းစီရဲ့ type
      နဲ့ အရေအတွက်ကို မှတ်ထားပြီး၊ နေရာတွေကို နာမည် ပေးတာ၊ optional လုပ်တာလည်း ရပါတယ်။
      [[mark:recap-arguments]] Set နဲ့ Map လို container တွေကို type argument နဲ့ ဘာ ထည့်မလဲ
      ပြောလို့ ရပေမယ့်၊ JSON parse လို type argument မယူတဲ့ function တွေလည်း ရှိပါတယ်။ အဲဒီ ရလဒ်ကို
      annotation ပေးရင် TypeScript က ယုံလိုက်ရုံ ဖြစ်လို့၊ data မှန်ဖို့က ကိုယ့် တာဝန်ပါ။ နောက်
      lesson မှာတော့ function တွေရဲ့ parameter တွေနဲ့ ပြန်ပေးတဲ့ တန်ဖိုးတွေကို type ပေးတဲ့ နည်းကို
      အသေးစိတ် ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 4: Essential Types and Annotations",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/essential-types-and-annotations",
        }
      - {
          title: "TypeScript Handbook: Object Types",
          url: "https://www.typescriptlang.org/docs/handbook/2/objects.html",
        }
    actions:
      - id: select-array-recap
        type: editor.select
        at: { mark: recap-array }
        target: { file: src/main.ts, text: "Array<Order>", occurrence: 1 }
      - id: select-tuple-recap
        type: editor.select
        at: { mark: recap-tuple }
        target: { file: src/main.ts, text: "[item: string, cups: number]", occurrence: 1 }
      - id: select-arguments-recap
        type: editor.select
        at: { mark: recap-arguments }
        target: { file: src/main.ts, text: "new Map<number, string>()", occurrence: 1 }
      - id: expect-file-orders
        type: expect.file
        at: { afterAction: select-array-recap }
        path: src/main.ts
        contains: "const orders: Array<Order> = [\n  { item: \"လက်ဖက်ရည်\", cups: 2, table: 5 },\n  { item: \"ကော်ဖီ\", cups: 1, table: 3 },"
      - id: expect-file-tuples
        type: expect.file
        at: { afterAction: expect-file-orders }
        path: src/main.ts
        contains: "const best: [item: string, cups: number] = [\"လက်ဖက်ရည်\", 12];\n//    ^?\nconsole.log(best[0], best[1] * 1500, \"ကျပ်\");\nconst quick: [item: string, cups?: number] = [\"သံပုရာရည်\"];"
      - id: expect-file-set
        type: expect.file
        at: { afterAction: expect-file-tuples }
        path: src/main.ts
        contains: "const tables = new Set<number>();\n//    ^?\ntables.add(5);\ntables.add(Number(\"5\")); // QR menu"
      - id: expect-file-json
        type: expect.file
        at: { afterAction: expect-file-set }
        path: src/main.ts
        contains: "const fromPhone: Order = JSON.parse(saved);\n// const fromPhone = JSON.parse<Order>(saved);"
checks:
  - { type: timing.p95Ms, max: 300 }
