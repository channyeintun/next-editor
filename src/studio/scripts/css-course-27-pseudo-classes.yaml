# CSS course (Burmese), lesson 27 of 43: pseudo-classes.
#
# Narration is Burmese, generated from voice-script.md next to this file
# (DESIGN.md is the span-by-span brief). Every [[mark:…]] sits where its action
# begins, at a sentence end; each span carries one piece of meaning.
# Everything the learner sees (title, chapters, whiteboard labels, UI strings)
# is already Burmese.
#
# Shape: board (recall lesson 26; a pseudo-class picks by state; "a class the
# browser adds and removes"; the families) → code tour (phone required +
# pattern, cups 1-10, disabled order button, progress with no value) → hover
# on the menu cards + a click on the coffee card (replay shows the hover style
# on the last clicked element) → board (active, link, visited and its colour-
# only privacy rule) → board (LVHA, same specificity, last wins; target) →
# phone invalid on page load → valid after typing a number → board (invalid vs
# user-invalid timeline) → cups out of range at 12 → required star with
# :has() + ::after → not colour alone → placeholder-shown on the empty name
# field, gone after typing → the extra-milk row lights up when checked →
# disabled button fades; enabled and fieldset → indeterminate progress → a
# plain selector list with one unknown pseudo-class does nothing, the same
# list inside :is() works (forgiving); :where → img:not([alt]) without a line
# style draws nothing, then "solid" → zebra snacks, hiding palata breaks it,
# "of :not([hidden])" fixes it → board (functional vs plain, names that don't
# exist, more to look up) + recap, hand-off to focus (lesson 28).
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set(; no postcss config; no reload.
# Keystroke-typed values have no misleading prefix: named colours, 50% for
# opacity (5 and 50 clamp to 1, so the button never flashes invisible),
# lengths invalid until their unit lands. Two inserts land inside the last
# rule of the file ("solid " and " of :not([hidden])"): while the second one
# is half typed the zebra rule is invalid and the stripes vanish for a
# moment; nothing follows that rule, so nothing else is affected.
#
# Measured in headless Chrome at 432 × 720 (probe/stages.ts, same anchors):
# document 2017 tall; drinks 0-496, form at 512 (phone 658, button 830,
# progress 919), gallery at 960 (logo 1235), snacks at 1324 (656 tall, max
# scroll 1297). Phone border beige → crimson (invalid at load) → beige after
# the number → seagreen; cups crimson at 12; only the phone label gets " *";
# name field lemonchiffon until a name is typed; extra row lightgreen after
# the click (milk-status "checked"); button opacity 0.5; progress dashed
# outline; the plain list changes nothing, :is() turns names and prices
# chocolate; the logo outline is none until "solid"; snacks stripes -W-W-,
# then -H-W- after the click (two white cards in a row), then -HW-W.
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
