    chapter: "ပထမ စာပိုဒ်ကိုပဲ ဘယ်လို ရွေးမလဲ"
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ element တိုင်းဟာ box တစ်ခု ဖြစ်တယ် ဆိုတာ မြင်ခဲ့ပြီး၊ box တွေကို padding၊
      border နဲ့ margin ပေးခဲ့ပါတယ်။ rule တိုင်းမှာ box တွေကို အရင် ရွေးခဲ့ရပါတယ်။ ဒီ lesson မှာတော့
      အဲဒီလို ရွေးတဲ့ နည်းတွေကို ကြည့်သွားပါမယ်။ [[mark:start-server]] ဒီလို ပြောနေတုန်းမှာပဲ၊ board
      နောက်က editor ထဲမှာ dev server ကို စနေပါပြီ။ ဒါမှ page လိုတဲ့အခါ အသင့် ဖြစ်နေမှာပါ။
      [[mark:draw-rule]] lesson 1 က rule ရဲ့ အပိုင်း နှစ်ပိုင်းကို ပြန်ကြည့်ရအောင်။ ရှေ့ဆုံးက selector က
      element တွေကို ရွေးပြီး၊ curly brace ထဲက declaration တွေကတော့ အဲဒီ element တွေ ဘယ်လို ပေါ်ရမလဲ ဆိုတာ
      ပြောပါတယ်။ [[mark:draw-about]] ပုစ္ဆာလေး တစ်ခု စဉ်းစားကြည့်ရအောင်။ ဆိုင်အကြောင်း အပိုင်းမှာ
      ခေါင်းစဉ် တစ်ခုနဲ့ စာပိုဒ် နှစ်ပိုဒ် ပါပါတယ်။ [[mark:draw-both]] စာပိုဒ် element နာမည် တစ်ခုတည်းနဲ့
      ရွေးရင်၊ ဒီ နှစ်ပိုဒ်လုံး ပါသွားရုံ မကဘဲ page ထဲက တခြား စာပိုဒ်တွေပါ ပါသွားပါတယ်။
      [[mark:draw-first]] ဒါပေမဲ့ ကိုယ်က ပထမ စာပိုဒ်ကိုပဲ စာလုံးထူ ဖြစ်စေချင်တာပါ။ [[mark:draw-question]]
      ဒါကြောင့် ကိုယ် လိုချင်တဲ့ element တွေကိုပဲ တိတိကျကျ ရွေးပြီး၊ ကျန်တာတွေကို မထိတဲ့ နည်း လိုပါတယ်။
      အဲဒါက selector တွေရဲ့ အလုပ် ဖြစ်ပြီး၊ ဒီ lesson နဲ့ နောက် lesson က သူတို့ အကြောင်းပါ။
    sources:
      - title: "web.dev Learn CSS — Selectors"
        url: "https://web.dev/learn/css/selectors"
      - title: "web.dev Learn CSS — Selectors: the parts of a CSS rule"
        url: "https://web.dev/learn/css/selectors#the_parts_of_a_css_rule"
      - title: "MDN — CSS syntax"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_syntax/Syntax"
    actions:
      - id: open-job-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      # Runs in the background (boot + pnpm install + spawn); waitForReady sits
      # on the preview mark in the next scene, well over 40 s of narration
      # later.
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 45000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-rule
        type: whiteboard.apply
        at: { mark: draw-rule }
        upsertIds: [a-sel, a-decl, a-sel-label, a-decl-label]
        drawMs: 2400
      - id: draw-about
        type: whiteboard.apply
        at: { mark: draw-about }
        upsertIds: [a-about-frame, a-about-h, a-p1, a-p1-label, a-p2, a-p2-label]
        drawMs: 2800
      - id: draw-both
        type: whiteboard.apply
        at: { mark: draw-both }
        upsertIds: [a-both-label, a-both-c1, a-both-c2]
        drawMs: 1800
      - id: draw-first
        type: whiteboard.apply
        at: { mark: draw-first }
        upsertIds: [a-first-label, a-first-check]
        drawMs: 1400
      - id: draw-question
        type: whiteboard.apply
        at: { mark: draw-question }
        upsertIds: [a-question]
        drawMs: 900

  - id: code-tour
    narration: >
      [[mark:close-job-board]] project ကို ကြည့်ရအောင်။ [[mark:open-index]] ဒါက page ရဲ့ HTML ဖိုင်ပါ။
      ခါတိုင်းလို header၊ သောက်စရာ menu၊ ဆိုင်အကြောင်း အပိုင်းနဲ့ footer ပါတဲ့ လက်ဖက်ရည်ဆိုင် page ပါ။
      [[mark:select-pdf]] header မှာ link အသစ် တစ်ခု ပါလာပါတယ်။ menu ကို PDF ဖိုင်နဲ့ ကြည့်လို့ ရတဲ့ link
      ပါ။ နောက်မှ သူ့ လိပ်စာနဲ့ ရွေးကြည့်ပါမယ်။ [[mark:select-about]] ဆိုင်အကြောင်း အပိုင်းမှာလည်း စာပိုဒ်
      နောက်တစ်ပိုဒ် ပါလာလို့၊ board ပေါ်ကလိုပဲ ခေါင်းစဉ် တစ်ခုနဲ့ စာပိုဒ် နှစ်ပိုဒ် ဖြစ်နေပါပြီ။
      [[mark:open-styles]] ကိုယ့် CSS ဖိုင်ကတော့ အလွတ် ပြန်ဖြစ်နေပါတယ်။ ဆိုင်ရဲ့ အရောင်တွေ၊ card
      ဘောင်တွေနဲ့ ပြီးခဲ့တဲ့ lesson က border box rule ကို base ဖိုင်ကနေ ယူထားလို့၊ ဒီ lesson မှာ ရိုက်မယ့်
      rule တိုင်းက element ရွေးတဲ့ အကြောင်းချည်းပါ။ [[mark:preview-opens]] dev server အသင့် ဖြစ်သွားလို့၊
      ညာဘက်မှာ preview ပွင့်လာပါပြီ။ card တွေမှာ base ဖိုင်က ပေးထားတဲ့ အဖြူရောင် နောက်ခံနဲ့ ဘောင်
      ပါးပါးလေး ရှိပြီး၊ အဲဒါတွေကို selector တွေနဲ့ ပြောင်းကြည့်သွားပါမယ်။
    sources:
      - title: "web.dev Learn CSS — Selectors"
        url: "https://web.dev/learn/css/selectors"
      - title: "MDN — <a>: the Anchor element (href)"
        url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Element/a"
    actions:
      - id: close-job-board
        type: whiteboard.apply
        at: { mark: close-job-board }
        open: false
      - id: open-index
        type: workspace.openFile
        at: { mark: open-index }
        path: index.html
      - id: select-pdf
        type: editor.select
        at: { mark: select-pdf }
        target:
          {
            file: index.html,
            text: '<a class="nav-link" href="/menu.pdf" data-testid="nav-pdf">PDF မီနူး</a>',
            occurrence: 1,
          }
      - id: select-about
        type: editor.select
        at: { mark: select-about }
        target: { file: index.html, text: "<p>ဧည့်သည်တိုင်းကို မိသားစုလို ကြိုဆိုပါတယ်။</p>", occurrence: 1 }
      - id: open-styles
        type: workspace.openFile
        at: { mark: open-styles }
        path: styles.css
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { mark: preview-opens }
        timeoutMs: 20000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-dev-server }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-header
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: shop-name }
        textContains: "ရွှေလက်ဖက်ရည်ဆိုင်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-pdf-link
        type: expect.preview
        at: { afterAction: expect-header }
        timeoutMs: 5000
        target: { by: testId, value: nav-pdf }
        attribute: { name: href, value: "/menu.pdf" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: collapse-runner-dock
        type: runtime.collapseDock
        at: { afterAction: expect-pdf-link }

  - id: first-paragraph-live
    narration: >
      [[mark:scroll-about]] preview ကို ဆိုင်အကြောင်း အပိုင်းအထိ ဆင်းပြီး၊ board ပေါ်က ပုစ္ဆာကို
      ဖြေကြည့်ရအောင်။ [[mark:type-first]] စာသားကို စာလုံးထူ ဖြစ်စေတဲ့ rule တစ်ခု ရေးပါမယ်။ ရှေ့က selector
      က နည်းနည်း ရှည်ပေမဲ့၊ ဘာကို ရွေးလဲ ဆိုတာ ခဏနေ ရှင်းပြပါမယ်။ [[mark:after-first]] preview ကို
      ကြည့်ပါ။ ပထမ စာပိုဒ်ပဲ စာလုံးထူ ဖြစ်သွားပြီး၊ ဒုတိယ စာပိုဒ်ကတော့ အရင်အတိုင်း ကျန်နေပါတယ်။
      [[mark:select-first]] ဒီ selector ကို ကြည့်ပါ။ ဆိုင်အကြောင်း အပိုင်းထဲက စာပိုဒ်တွေထဲမှာ ပထမဆုံး
      တစ်ပိုဒ်ကို ရွေးပါ လို့ ပြောထားတာပါ။ [[mark:pieces]] ဒါက အပိုင်း သေးသေးလေးတွေကို ပေါင်းရေးထားတာပါ။
      class နာမည် တစ်ခု၊ element နာမည် တစ်ခုနဲ့ နေရာကို ပြောတဲ့ အပိုင်း တစ်ခု ပါပါတယ်။ ဒီ lesson မှာ
      အပိုင်းလေးတွေကို တစ်ခုစီ လေ့လာပြီး၊ နောက် lesson မှာ ဘယ်လို တွဲရေးလဲ၊ နေရာနဲ့ ဘယ်လို ရွေးလဲ ဆိုတာ
      ကြည့်ပါမယ်။ [[mark:scroll-menu]] menu ဆီ ပြန်တက်ကြည့်ရအောင်။
    sources:
      - title: "web.dev Learn CSS — Selectors (the first-paragraph example)"
        url: "https://web.dev/learn/css/selectors"
      - title: "MDN — :first-of-type"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/:first-of-type"
    actions:
      # The page is 1214 px tall, so a taller preview can scroll less (800 px:
      # 414). A target past that range is clamped and the recording no longer
      # holds the authored position, so this and scroll-footer stay at or
      # below 230, the position scroll-cards already reaches.
      - id: scroll-about
        type: preview.scroll
        at: { mark: scroll-about }
        timeoutMs: 4000
        top: 220
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-first
        type: editor.type
        at: { mark: type-first }
        cadence: fast-explainer
        target: { file: styles.css, after: "", occurrence: 1 }
        text: ".about p:first-of-type {\n  font-weight: bold;\n}\n"
      - id: expect-about
        type: expect.preview
        at: { mark: after-first }
        timeoutMs: 4000
        target: { by: testId, value: about }
        textContains: "ဧည့်သည်တိုင်းကို မိသားစုလို ကြိုဆိုပါတယ်။"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-first
        type: editor.select
        at: { mark: select-first }
        target: { file: styles.css, text: ".about p:first-of-type", occurrence: 1 }
      # The three pieces, each highlighted as its words are spoken: the class
      # name, the element name, then the part that says the position.
      - id: select-piece-class
        type: editor.select
        at: { mark: pieces, offsetMs: 2900 }
        target: { file: styles.css, text: ".about", occurrence: 1 }
      - id: select-piece-type
        type: editor.select
        at: { mark: pieces, offsetMs: 4250 }
        target: { file: styles.css, text: "p", occurrence: 1 }
      - id: select-piece-position
        type: editor.select
        at: { mark: pieces, offsetMs: 5850 }
        target: { file: styles.css, text: ":first-of-type", occurrence: 1 }
      - id: scroll-menu
        type: preview.scroll
        at: { mark: scroll-menu }
        timeoutMs: 4000
        top: 0
        retry: { maxAttempts: 2, delayMs: 250 }

  - id: simple-map
    chapter: "Simple selector တွေ"
    narration: >
      [[mark:open-map]] simple selector တွေကနေ စကြည့်ရအောင်။ သူတို့က element ကို အချက် တစ်ချက်တည်း
      ကြည့်ပြီး ရွေးတဲ့ selector တွေပါ။ [[mark:draw-type]] element ရဲ့ နာမည်နဲ့ ရွေးတာကို type selector
      လို့ ခေါ်ပါတယ်။ ဥပမာ စာပိုဒ် element ရဲ့ နာမည်ကို ရေးရင်၊ စာပိုဒ် အားလုံးကို ရွေးပါတယ်။
      [[mark:draw-class]] class selector က class တူတဲ့ element တွေကို ရွေးပြီး၊ element အမျိုးအစား မတူလည်း
      ရပါတယ်။ [[mark:draw-id]] ID selector က page ထဲမှာ တစ်ခုတည်းသာ ရှိရမယ့် ID နဲ့ element ကို ရွေးပါတယ်။
      [[mark:draw-attr]] attribute selector က element မှာ HTML attribute တစ်ခု ရှိလား၊ သူ့ တန်ဖိုး ဘာလဲ
      ဆိုတာ ကြည့်ပြီး ရွေးပါတယ်။ [[mark:draw-all]] universal selector ကတော့ page ထဲက element အားလုံးကို
      ရွေးပါတယ်။ [[mark:marks-note]] element နာမည်မှာ သင်္ကေတ မပါပေမယ့်၊ ကျန်တဲ့ selector တွေမှာ
      ကိုယ်ပိုင် သင်္ကေတ ရှိလို့၊ ဘယ် selector အမျိုးအစားလဲ ဆိုတာ browser က သိပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Selectors: simple selectors"
        url: "https://web.dev/learn/css/selectors#simple_selectors"
      - title: "MDN — CSS selectors"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_selectors"
      - title: "Selectors Level 4 — simple selectors"
        url: "https://www.w3.org/TR/selectors-4/#simple"
    actions:
      - id: open-map
        type: whiteboard.apply
        at: { mark: open-map }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-type
        type: whiteboard.apply
        at: { mark: draw-type }
        upsertIds: [b-type-code, b-type-desc]
        drawMs: 1400
      - id: draw-class
        type: whiteboard.apply
        at: { mark: draw-class }
        upsertIds: [b-class-code, b-class-desc]
        drawMs: 1400
      - id: draw-id
        type: whiteboard.apply
        at: { mark: draw-id }
        upsertIds: [b-id-code, b-id-desc]
        drawMs: 1400
      - id: draw-attr
        type: whiteboard.apply
        at: { mark: draw-attr }
        upsertIds: [b-attr-code, b-attr-desc]
        drawMs: 1400
      - id: draw-all
        type: whiteboard.apply
        at: { mark: draw-all }
        upsertIds: [b-all-code, b-all-desc]
        drawMs: 1200

  - id: type-selector
    chapter: "Type၊ class နဲ့ ID selector"
    narration: >
      [[mark:close-map]] type selector နဲ့ စပြီး editor ထဲမှာ စမ်းကြည့်ရအောင်။ [[mark:type-p]] ဒီ rule က
      page ထဲက စာပိုဒ် element အားလုံးကို ရွေးပြီး၊ သူတို့ထဲက စာသားကို အညိုရောင် ပေးပါတယ်။
      [[mark:after-p]] card တွေကို ကြည့်ပါ။ သောက်စရာ အကြောင်း စာသားတွေ အကုန် တစ်ပြိုင်နက် အညိုရောင်
      ဖြစ်သွားပါပြီ။ header ထဲက English စာကြောင်းလည်း စာပိုဒ်ပါ၊ ဒါပေမဲ့ base ဖိုင်က class rule က သူ့ကို
      အရောင် ပေးထားလို့ မပြောင်းပါဘူး။ [[mark:broad-note]] ဒါက type selector ရဲ့ အားသာချက်လည်း ဖြစ်သလို၊
      သတိထားစရာလည်း ဖြစ်ပါတယ်။ page တစ်ခုလုံးက အဲဒီ element တိုင်းကို ထိလို့ပါ။ ဒါကြောင့် အခြေခံ style
      တွေအတွက် သင့်တော်ပြီး၊ သီးသန့် ပုံစံ လိုတဲ့ element တွေအတွက်တော့ class က ပိုသင့်တော်ပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Selectors: type selector"
        url: "https://web.dev/learn/css/selectors#type_selector"
      - title: "MDN — Type selectors"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/Type_selectors"
    actions:
      - id: close-map
        type: whiteboard.apply
        at: { mark: close-map }
        open: false
      - id: type-p
        type: editor.type
        at: { mark: type-p }
        cadence: fast-explainer
        target:
          {
            file: styles.css,
            after: ".about p:first-of-type {\n  font-weight: bold;\n}\n",
            occurrence: 1,
          }
        text: "\np {\n  color: saddlebrown;\n}\n"
      - id: expect-desc
        type: expect.preview
        at: { mark: after-p }
        timeoutMs: 4000
        target: { by: testId, value: card-coffee }
        textContains: "နို့ဆီနဲ့ ကော်ဖီ"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: class-selector
    narration: >
      [[mark:open-index-class]] အခု class selector ကို ကြည့်ရအောင်။ HTML ထဲက ပထမ card ကို ကြည့်ပါ။
      [[mark:select-class]] သူ့ class attribute ထဲမှာ menu card နဲ့ featured ဆိုတဲ့ နာမည် နှစ်ခုကို space
      နဲ့ ခြားပြီး ရေးထားပါတယ်။ element တစ်ခုမှာ class နာမည် လိုသလောက် ပေးလို့ ရပါတယ်။ [[mark:select-id]]
      ဒီ card မှာ today special ဆိုတဲ့ ID လည်း ရှိပါတယ်။ ID ဆိုတာ page တစ်ခုလုံးမှာ element တစ်ခုတည်းပဲ
      သုံးရမယ့် နာမည်ပါ။ [[mark:open-styles-class]] CSS ဖိုင်ကို ပြန်သွားပြီး၊ featured card ကို သူ့ class
      နဲ့ ရွေးကြည့်ရအောင်။ [[mark:type-featured]] ရှေ့က အစက်လေးက ဒါ class နာမည် ဖြစ်တယ် ဆိုတာ ပြပါတယ်။ ဒီ
      rule က အဲဒီ class ပါတဲ့ element တိုင်းကို ပိုထူတဲ့ ရွှေရောင် ဘောင် ပေးပါတယ်။ [[mark:after-featured]]
      ပထမ card မှာပဲ ရွှေရောင် ဘောင် ပေါ်လာပါပြီ။ သူ့ class attribute မှာ နာမည် နှစ်ခု ရှိပေမယ့် ပြဿနာ
      မရှိပါဘူး။ အဲဒီ နာမည်တွေထဲမှာ featured ပါနေရင် class selector က ကိုက်ပါတယ်။ [[mark:digit-rule]]
      နာမည်တွေမှာ စည်းမျဉ်း တစ်ခု ရှိပါတယ်။ HTML မှာ class ဒါမှမဟုတ် ID ကို ဂဏန်းနဲ့ စလို့ ရပေမယ့်၊ CSS
      selector ထဲမှာတော့ ဒီအတိုင်း ရေးလို့ မရပါဘူး။ escape လုပ်မှ ရပြီး၊ မလုပ်ရင် browser က selector ကို
      နားမလည်ပါဘူး။ ဒါကြောင့် class နဲ့ ID နာမည်တွေကို အက္ခရာနဲ့ပဲ စပေးတာ အလွယ်ဆုံးပါ။
    sources:
      - title: "web.dev Learn CSS — Selectors: class selector"
        url: "https://web.dev/learn/css/selectors#class_selector"
      - title: "MDN — Class selectors"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/Class_selectors"
      - title: "MDN — CSS identifiers (<ident>)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/ident"
      - title: "CSS 2.1 — characters and case (identifiers cannot start with a digit)"
        url: "https://www.w3.org/TR/CSS21/syndata.html#characters"
    actions:
      - id: open-index-class
        type: workspace.openFile
        at: { mark: open-index-class }
        path: index.html
      - id: select-class
        type: editor.select
        at: { mark: select-class }
        target: { file: index.html, text: 'class="menu-card featured"', occurrence: 1 }
      - id: select-id
        type: editor.select
        at: { mark: select-id }
        target: { file: index.html, text: 'id="today-special"', occurrence: 1 }
      - id: expect-class-attr
        type: expect.preview
        at: { afterAction: select-class }
        timeoutMs: 4000
        target: { by: testId, value: card-laphet-yay }
        attribute: { name: class, value: "menu-card featured" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: open-styles-class
        type: workspace.openFile
        at: { mark: open-styles-class }
        path: styles.css
      - id: type-featured
        type: editor.type
        at: { mark: type-featured }
        cadence: fast-explainer
        target: { file: styles.css, after: "  color: saddlebrown;\n}\n", occurrence: 1 }
        text: "\n.featured {\n  border: 2px solid gold;\n}\n"
      - id: expect-featured
        type: expect.preview
        at: { mark: after-featured }
        timeoutMs: 4000
        target: { by: testId, value: card-laphet-yay }
        textContains: "လက်ဖက်ရည်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: id-selector
    narration: >
      [[mark:type-special]] အခု ID selector ကို စမ်းပါမယ်။ ရှေ့က hash က ဒါ ID နာမည် ဖြစ်တယ် ဆိုတာ ပြပါတယ်။
      လက်ဖက်ရည် card ကို အဝါဖျော့ရောင် နောက်ခံ ပေးပါမယ်။ [[mark:after-special]] ပထမ card မှာ အဝါဖျော့ရောင်
      နောက်ခံ ရသွားပါပြီ။ [[mark:type-all-cards]] နောက်တစ်ခုက menu card တိုင်းအတွက် class rule ပါ။
      ခရမ်းဖျော့ရောင် နောက်ခံ ပေးပါမယ်။ ID rule ရဲ့ နောက်မှာ ရေးထားလို့၊ ဒီ rule က နိုင်မယ်လို့ ထင်စရာ
      ရှိပါတယ်။ [[mark:after-all-cards]] preview ကို ကြည့်ပါ။ ကျန်တဲ့ card သုံးခုက ခရမ်းဖျော့ရောင်
      ဖြစ်သွားပေမယ့်၊ ပထမ card ကတော့ အဝါဖျော့ရောင် အတိုင်း ကျန်နေပါတယ်။ [[mark:id-weight]] နောက်ခံ ပေးတဲ့
      ဒီ rule နှစ်ခုကို ကြည့်ပါ။ rule တွေ ပြိုင်တဲ့အခါ browser က ရေးထားတဲ့ အစဉ်ကို မကြည့်ခင် selector ရဲ့
      အလေးချိန်ကို အရင် နှိုင်းယှဉ်ပါတယ်။ ID က class ဘယ်နှခုထက်မဆို ပိုလေးပြီး၊ class နဲ့ attribute က
      element နာမည်ထက် ပိုလေးပါတယ်။ [[mark:avoid-id]] ID က ဒီလောက် လေးလို့၊ ID နဲ့ ပေးထားတဲ့ style ကို
      နောက်မှ တခြား rule နဲ့ ပြောင်းဖို့ ခက်ပါတယ်။ ပြီးတော့ ID က element တစ်ခုတည်းအတွက် ဖြစ်လို့ style ကို
      ပြန်သုံးလို့ မရပါဘူး။ ဒါကြောင့် developer အများစုက style ကို class နဲ့ ပေးပြီး၊ ID ကိုတော့ page ထဲက
      အပိုင်း တစ်ခုဆီ ခုန်သွားဖို့၊ ဒါမှမဟုတ် label ကို form အကွက်နဲ့ ချိတ်ဖို့လို နေရာတွေမှာ သုံးကြပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Selectors: ID selector"
        url: "https://web.dev/learn/css/selectors#id_selector"
      - title: "MDN — ID selectors"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/ID_selectors"
      - title: "MDN — Specificity"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/Specificity"
      - title: "web.dev Learn CSS — Specificity"
        url: "https://web.dev/learn/css/specificity"
    actions:
      - id: type-special
        type: editor.type
        at: { mark: type-special }
        cadence: fast-explainer
        target: { file: styles.css, after: "  border: 2px solid gold;\n}\n", occurrence: 1 }
        text: "\n#today-special {\n  background: wheat;\n}\n"
      - id: type-all-cards
        type: editor.type
        at: { mark: type-all-cards }
        cadence: fast-explainer
        target: { file: styles.css, after: "  background: wheat;\n}\n", occurrence: 1 }
        text: "\n.menu-card {\n  background: lavender;\n}\n"
      - id: expect-id-attr
        type: expect.preview
        at: { mark: after-all-cards }
        timeoutMs: 4000
        target: { by: testId, value: card-laphet-yay }
        attribute: { name: id, value: "today-special" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-two-backgrounds
        type: editor.select
        at: { mark: id-weight }
        target:
          {
            file: styles.css,
            text: "#today-special {\n  background: wheat;\n}\n\n.menu-card {\n  background: lavender;\n}\n",
            occurrence: 1,
          }

  - id: attribute-selector
    chapter: "Attribute selector တွေ"
    narration: >
      [[mark:open-index-attr]] နောက်တစ်ခုက attribute selector တွေပါ။ HTML ထဲမှာ သောက်စရာ card တိုင်းမှာ
      ပူလား အေးလား ဆိုတာ ပြတဲ့ data attribute တစ်ခု ပါပါတယ်။ [[mark:select-hot]] ဒါက hot လို့ မှတ်ထားတဲ့
      ကော်ဖီ card ပါ။ [[mark:select-iced]] ဒါက iced လို့ မှတ်ထားတဲ့ သံပုရာရည် card ပါ။ data နဲ့ စတဲ့
      attribute တွေမှာ ကိုယ့် အချက်အလက်ကို ကြိုက်သလို ထည့်လို့ ရပြီး၊ selector တွေကလည်း သူတို့ကို ဖတ်လို့
      ရပါတယ်။ [[mark:open-styles-attr]] CSS ဖိုင်ကို ပြန်ဖွင့်ပါမယ်။ [[mark:type-presence]] attribute
      နာမည်ကို လေးထောင့်ကွင်းထဲ ထည့်ရေးရင်၊ တန်ဖိုး ဘာပဲ ဖြစ်ဖြစ် အဲဒီ attribute ရှိတဲ့ element တိုင်းကို
      ရွေးပါတယ်။ card တိုင်းရဲ့ ဘယ်ဘက်မှာ မီးခိုးရောင် အစင်း ထူထူ တစ်ခု ရပါမယ်။ [[mark:after-presence]]
      card လေးခုလုံးမှာ attribute ရှိလို့၊ လေးခုလုံး အစင်း ရသွားပါပြီ။ [[mark:type-hot]] အခု တန်ဖိုးပါ
      ထည့်ကြည့်ရအောင်။ ဒီ rule က တန်ဖိုး အတိအကျ hot ဖြစ်တဲ့ element တွေကိုပဲ ရွေးပြီး၊ သူတို့ရဲ့ အစင်းကို
      အနီရောင် ပြောင်းပါတယ်။ [[mark:type-iced]] နောက်ထပ် rule တစ်ခုက တန်ဖိုး iced အတွက်ပါ။ အစင်းကို
      အပြာရောင် ပြောင်းပေးပါမယ်။ အရောင် နာမည် ရိုက်ပြီးသွားတဲ့အခါ iced card တွေကို ကြည့်ထားပါ။
      [[mark:after-values]] အခု ပူတဲ့ သောက်စရာတွေမှာ အနီရောင်၊ အေးတဲ့ သောက်စရာတွေမှာ အပြာရောင် အစင်း
      ရှိသွားပါပြီ။ တန်ဖိုးက အတိအကျ တူမှ ကိုက်ပါတယ်။ ဒီလို စကားလုံး တစ်လုံးတည်း တန်ဖိုးဆိုရင် quote တွေ
      မထည့်လည်း ရပေမယ့်၊ ထည့်ရေးတာက အကျင့်ကောင်း တစ်ခုပါ။
    sources:
      - title: "web.dev Learn CSS — Selectors: attribute selector"
        url: "https://web.dev/learn/css/selectors#attribute_selector"
      - title: "MDN — Attribute selectors"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/Attribute_selectors"
      - title: "MDN — Using data attributes"
        url: "https://developer.mozilla.org/en-US/docs/Learn_web_development/Howto/Solve_HTML_problems/Use_data_attributes"
    actions:
      - id: open-index-attr
        type: workspace.openFile
        at: { mark: open-index-attr }
        path: index.html
      - id: select-hot
        type: editor.select
        at: { mark: select-hot }
        target: { file: index.html, text: 'data-temp="hot"', occurrence: 2 }
      - id: select-iced
        type: editor.select
        at: { mark: select-iced }
        target: { file: index.html, text: 'data-temp="iced"', occurrence: 1 }
      - id: expect-hot-attr
        type: expect.preview
        at: { afterAction: select-iced }
        timeoutMs: 4000
        target: { by: testId, value: card-coffee }
        attribute: { name: data-temp, value: "hot" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: open-styles-attr
        type: workspace.openFile
        at: { mark: open-styles-attr }
        path: styles.css
      - id: scroll-cards
        type: preview.scroll
        at: { mark: open-styles-attr, offsetMs: 700 }
        timeoutMs: 4000
        top: 230
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-presence
        type: editor.type
        at: { mark: type-presence }
        cadence: fast-explainer
        target: { file: styles.css, after: "  background: lavender;\n}\n", occurrence: 1 }
        text: "\n[data-temp] {\n  border-left: 6px solid gray;\n}\n"
      - id: type-hot
        type: editor.type
        at: { mark: type-hot }
        cadence: fast-explainer
        target: { file: styles.css, after: "  border-left: 6px solid gray;\n}\n", occurrence: 1 }
        text: "\n[data-temp=\"hot\"] {\n  border-left-color: firebrick;\n}\n"
      - id: type-iced
        type: editor.type
        at: { mark: type-iced }
        cadence: fast-explainer
        target: { file: styles.css, after: "  border-left-color: firebrick;\n}\n", occurrence: 1 }
        text: "\n[data-temp=\"iced\"] {\n  border-left-color: steelblue;\n}\n"
      - id: expect-iced-attr
        type: expect.preview
        at: { mark: after-values }
        timeoutMs: 4000
        target: { by: testId, value: card-lime-juice }
        attribute: { name: data-temp, value: "iced" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: substring-selectors
    narration: >
      [[mark:open-index-links]] attribute selector က တန်ဖိုးရဲ့ တစ်စိတ်တစ်ပိုင်းနဲ့လည်း ကိုက်ကြည့်လို့
      ရပြီး၊ link လိပ်စာတွေအတွက် အသုံးဝင်ပါတယ်။ link သုံးခုကို ကြည့်ရအောင်။ [[mark:select-pdf-href]] PDF
      မီနူး link ရဲ့ လိပ်စာက PDF နဲ့ ဆုံးပါတယ်။ [[mark:select-tel-href]] footer ထဲက ဖုန်း link ရဲ့ လိပ်စာက
      tel နဲ့ colon နဲ့ စပါတယ်။ ဒါက ဖုန်းနဲ့ နှိပ်လိုက်ရင် အဲဒီ နံပါတ်ကို ခေါ်ပေးဖို့ ပြောထားတာပါ။
      [[mark:select-fb-href]] Facebook link ရဲ့ လိပ်စာထဲမှာတော့ facebook ဆိုတဲ့ စကားလုံး ပါပါတယ်။
      [[mark:open-styles-links]] CSS ဖိုင်ကို ပြန်သွားပြီး၊ page ရဲ့ ထိပ်ကို ပြန်တက်ပါမယ်။
      [[mark:type-pdf]] ပထမ rule က လိပ်စာ PDF နဲ့ ဆုံးတဲ့ link တွေ အားလုံးကို ရွေးပြီး၊ သူတို့ရဲ့ စာသားကို
      ရွှေရောင် ပြောင်းပေးပါတယ်။ [[mark:after-pdf]] header ထဲက PDF link က ရွှေရောင် ဖြစ်သွားပါပြီ။ ရှေ့က
      element နာမည်က ဒီ rule ကို link တွေမှာပဲ ကန့်သတ်ပါတယ်။ ဒီလို selector နှစ်ခု ကပ်ရေးရင် element
      တစ်ခုတည်းက နှစ်ခုလုံးနဲ့ ကိုက်မှ ရွေးပါတယ်။ အဲဒါကို compound selector လို့ ခေါ်ပြီး နောက် lesson မှာ
      ကြည့်ပါမယ်။ [[mark:scroll-footer]] footer အထိ ဆင်းကြည့်ရအောင်။ [[mark:type-tel]] ဒုတိယ rule ကတော့
      လိပ်စာ tel နဲ့ စတဲ့ link တွေကို ရွေးပြီး၊ footer ထဲက ဖုန်းနံပါတ်ကို စာလုံးထူ ဖြစ်အောင် လုပ်ပေးပါတယ်။
      [[mark:type-fb]] တတိယ rule ကတော့ လိပ်စာထဲ ဘယ်နေရာမှာ ဖြစ်ဖြစ် facebook ဆိုတဲ့ စကားလုံး ပါတဲ့ link
      တွေကို ရွေးပြီး၊ အပြာဖျော့ရောင် ပေးပါတယ်။ [[mark:after-links]] ဖုန်းနံပါတ်က စာလုံးထူ ဖြစ်သွားပြီး၊
      Facebook link က အပြာဖျော့ရောင် ဖြစ်သွားပါပြီ။ ဆိုတော့ တန်ဖိုးရဲ့ အစ၊ အဆုံး ဒါမှမဟုတ် အထဲက
      ဘယ်နေရာမှာမဆို ကိုက်ကြည့်လို့ ရပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Selectors: attribute selector"
        url: "https://web.dev/learn/css/selectors#attribute_selector"
      - title: "MDN — Attribute selectors (^=, $=, *=)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/Attribute_selectors"
      - title: "Selectors Level 4 — substring matching attribute selectors"
        url: "https://www.w3.org/TR/selectors-4/#attribute-substrings"
    actions:
      - id: open-index-links
        type: workspace.openFile
        at: { mark: open-index-links }
        path: index.html
      - id: select-pdf-href
        type: editor.select
        at: { mark: select-pdf-href }
        target: { file: index.html, text: 'href="/menu.pdf"', occurrence: 1 }
      - id: select-tel-href
        type: editor.select
        at: { mark: select-tel-href }
        target: { file: index.html, text: 'href="tel:+959123456789"', occurrence: 1 }
      - id: select-fb-href
        type: editor.select
        at: { mark: select-fb-href }
        target: { file: index.html, text: 'href="https://facebook.com/"', occurrence: 1 }
      - id: open-styles-links
        type: workspace.openFile
        at: { mark: open-styles-links }
        path: styles.css
      - id: scroll-top
        type: preview.scroll
        at: { mark: open-styles-links, offsetMs: 700 }
        timeoutMs: 4000
        top: 0
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-pdf
        type: editor.type
        at: { mark: type-pdf }
        cadence: fast-explainer
        target: { file: styles.css, after: "  border-left-color: steelblue;\n}\n", occurrence: 1 }
        text: "\na[href$=\".pdf\"] {\n  color: gold;\n}\n"
      - id: expect-pdf-text
        type: expect.preview
        at: { mark: after-pdf }
        timeoutMs: 4000
        target: { by: testId, value: nav-pdf }
        textContains: "PDF မီနူး"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: scroll-footer
        type: preview.scroll
        at: { mark: scroll-footer }
        timeoutMs: 4000
        top: 230
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-tel
        type: editor.type
        at: { mark: type-tel }
        cadence: fast-explainer
        target: { file: styles.css, after: "  color: gold;\n}\n", occurrence: 1 }
        text: "\na[href^=\"tel:\"] {\n  font-weight: bold;\n}\n"
      - id: type-fb
        type: editor.type
        at: { mark: type-fb }
        cadence: fast-explainer
        target:
          {
            file: styles.css,
            after: "a[href^=\"tel:\"] {\n  font-weight: bold;\n}\n",
            occurrence: 1,
          }
        text: "\na[href*=\"facebook\"] {\n  color: skyblue;\n}\n"
      - id: expect-phone-href
        type: expect.preview
        at: { mark: after-links }
        timeoutMs: 4000
        target: { by: testId, value: phone-link }
        attribute: { name: href, value: "tel:+959123456789" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-facebook-href
        type: expect.preview
        at: { afterAction: expect-phone-href }
        timeoutMs: 4000
        target: { by: testId, value: facebook-link }
        attribute: { name: href, value: "https://facebook.com/" }
        retry: { maxAttempts: 3, delayMs: 300 }
      # The closing sentence names start, end and anywhere inside; each word
      # highlights the operator and value that mean it.
      - id: select-op-start
        type: editor.select
        at: { mark: after-links, offsetMs: 6200 }
        target: { file: styles.css, text: '^="tel:"', occurrence: 1 }
      - id: select-op-end
        type: editor.select
        at: { mark: after-links, offsetMs: 7000 }
        target: { file: styles.css, text: '$=".pdf"', occurrence: 1 }
      - id: select-op-contains
        type: editor.select
        at: { mark: after-links, offsetMs: 8100 }
        target: { file: styles.css, text: '*="facebook"', occurrence: 1 }

  - id: case-flag
    narration: >
      [[mark:scroll-cards-again]] menu ဆီ ပြန်တက်ပါမယ်။ HTML မှာ data attribute လို attribute အများစုရဲ့
      တန်ဖိုးကို နှိုင်းယှဉ်တဲ့အခါ၊ စာလုံးကြီး စာလုံးသေး ကွာတာလည်း အရေးပါပါတယ်။ [[mark:type-upper]] ဒီ
      rule ကတော့ iced ကို စာလုံးကြီးတွေနဲ့ ရေးထားတဲ့ တန်ဖိုးကို ရှာပါတယ်။ ကိုက်တဲ့ card တွေကို အပြာရောင်
      မျဉ်းပြတ် outline ပေးထားလို့၊ ဘယ် card တွေကို ရွေးလဲ ဆိုတာ မြင်ရပါမယ်။ [[mark:after-upper]] card
      တွေမှာ ဘာမှ မပြောင်းပါဘူး။ HTML ထဲမှာ တန်ဖိုးကို စာလုံးသေးနဲ့ ရေးထားလို့၊ selector နဲ့ မကိုက်တာပါ။
      [[mark:type-flag]] အခု ပိတ်တဲ့ လေးထောင့်ကွင်းရဲ့ ရှေ့မှာ i ဆိုတဲ့ စာလုံး တစ်လုံး ထည့်ပါမယ်။
      [[mark:after-flag]] iced card နှစ်ခုလုံးမှာ အပြာရောင် မျဉ်းပြတ် outline ပေါ်လာပါပြီ။ selector ထဲက i
      flag က တန်ဖိုးကို နှိုင်းယှဉ်တဲ့အခါ စာလုံးကြီး စာလုံးသေး မခွဲဘဲ ကြည့်ခိုင်းတာပါ။ [[mark:s-flag]] s
      flag လည်း ရှိပြီး၊ စာလုံးကြီး စာလုံးသေး အတိအကျ တူမှ ကိုက်ခိုင်းပါတယ်။ ဒါပေမဲ့ Chrome နဲ့ Edge က
      သူ့ကို နားမလည်လို့ rule တစ်ခုလုံးကို ပစ်လိုက်ပါတယ်။ data attribute တွေမှာတော့ မူလကတည်းက စာလုံးကြီး
      စာလုံးသေး ခွဲပြီးသားမို့ s flag မလိုပါဘူး။
    sources:
      - title: "web.dev Learn CSS — Selectors: attribute selector (case sensitivity)"
        url: "https://web.dev/learn/css/selectors#attribute_selector"
      - title: "MDN — Attribute selectors (the i and s flags, browser support)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/Attribute_selectors"
      - title: "HTML Standard — case-sensitivity of selectors"
        url: "https://html.spec.whatwg.org/multipage/semantics-other.html#case-sensitivity-of-selectors"
    actions:
      - id: scroll-cards-again
        type: preview.scroll
        at: { mark: scroll-cards-again }
        timeoutMs: 4000
        top: 230
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-upper
        type: editor.type
        at: { mark: type-upper }
        cadence: fast-explainer
        target: { file: styles.css, after: "  color: skyblue;\n}\n", occurrence: 1 }
        text: "\n[data-temp=\"ICED\"] {\n  outline: 2px dashed steelblue;\n}\n"
      - id: expect-lowercase
        type: expect.preview
        at: { mark: after-upper }
        timeoutMs: 4000
        target: { by: testId, value: card-falooda }
        attribute: { name: data-temp, value: "iced" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-flag
        type: editor.type
        at: { mark: type-flag }
        cadence: natural
        target: { file: styles.css, after: '[data-temp="ICED"', occurrence: 1 }
        text: " i"
      - id: select-flag
        type: editor.select
        at: { mark: after-flag }
        target: { file: styles.css, text: '[data-temp="ICED" i]', occurrence: 1 }

  - id: selector-list
    chapter: "Selector list နဲ့ universal selector"
    narration: >
      [[mark:type-list]] တစ်ခါတလေ element အမျိုးမျိုးကို style တူတူ ပေးဖို့ လိုပါတယ်။ အဲဒီအခါ rule သုံးခု
      ရေးမယ့်အစား၊ selector list နဲ့ rule တစ်ခုတည်း ရေးလို့ ရပါတယ်။ selector တွေကို comma နဲ့
      ခွဲရေးထားပြီး၊ အဲဒီထဲက တစ်ခုခုနဲ့ ကိုက်တဲ့ element မှန်သမျှကို rule က style ပေးပါတယ်။
      [[mark:after-list]] အပိုင်း ခေါင်းစဉ်၊ သောက်စရာ နာမည်တွေနဲ့ ဈေးနှုန်းတွေ အကုန် အစိမ်းရင့်ရောင်
      ဖြစ်သွားပါပြီ။ [[mark:select-list]] ဒီ list ကို ကြည့်ပါ။ selector တစ်ခုစီက သီးသန့် ကိုက်တာ ဖြစ်လို့၊
      element တစ်ခုက selector အားလုံးနဲ့ ကိုက်စရာ မလိုပါဘူး။ [[mark:type-name]] အခု သောက်စရာ
      နာမည်တွေအတွက်ပဲ rule သီးသန့် တစ်ခု ရေးပါမယ်။ အလုပ်လုပ်တာ မြင်ရအောင် နာမည်တိုင်းကို အောက်မျဉ်း
      တားပေးပါမယ်။ [[mark:after-name]] နာမည်တွေမှာ အောက်မျဉ်း ပေါ်လာပါပြီ။ [[mark:type-bad]] ဒီ rule မှာ
      ဒုတိယ selector တစ်ခု ထည့်ပါမယ်။ ဂဏန်းနဲ့ စတဲ့ class နာမည်ကို တမင် ထည့်တာပါ။ [[mark:after-bad]]
      နာမည်တွေရဲ့ အောက်မျဉ်းတွေ အကုန် ပျောက်သွားပါပြီ။ ပထမ selector ကို ဘာမှ မပြင်ခဲ့ပေမယ့်၊ ဂဏန်းနဲ့ စတဲ့
      ဒီ selector ကို browser က နားမလည်လို့ list တစ်ခုလုံး မှားသွားပြီး၊ rule တစ်ခုလုံးကို ပစ်လိုက်တာပါ။
      [[mark:list-tip]] ဒါကြောင့် list တစ်ခု အလုပ် မလုပ်တော့ရင်၊ သူ့ထဲက selector တစ်ခုချင်းစီကို
      စစ်ကြည့်ပါ။ နားမလည်တဲ့ selector တွေကို ကျော်သွားပေးတဲ့ list ရေးနည်း တစ်မျိုးကိုတော့ course ရဲ့
      နောက်ပိုင်းမှာ ကြည့်ပါမယ်။
    sources:
      - title: "web.dev Learn CSS — Selectors: grouping selectors"
        url: "https://web.dev/learn/css/selectors#grouping_selectors"
      - title: "MDN — Selector list (invalid selector lists)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/Selector_list"
      - title: "Selectors Level 4 — selector lists"
        url: "https://www.w3.org/TR/selectors-4/#grouping"
    actions:
      - id: type-list
        type: editor.type
        at: { mark: type-list }
        cadence: fast-explainer
        target: { file: styles.css, after: "  outline: 2px dashed steelblue;\n}\n", occurrence: 1 }
        text: "\nh2, h3, .price {\n  color: darkgreen;\n}\n"
      - id: expect-price
        type: expect.preview
        at: { mark: after-list }
        timeoutMs: 4000
        target: { by: testId, value: price-laphet-yay }
        textContains: "1,500 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-list
        type: editor.select
        at: { mark: select-list }
        target: { file: styles.css, text: "h2, h3, .price", occurrence: 1 }
      - id: type-name
        type: editor.type
        at: { mark: type-name }
        cadence: fast-explainer
        target: { file: styles.css, after: "  color: darkgreen;\n}\n", occurrence: 1 }
        text: "\n.name {\n  text-decoration: underline;\n}\n"
      - id: type-bad
        type: editor.type
        at: { mark: type-bad }
        cadence: block
        target: { file: styles.css, after: "\n.name", occurrence: 1 }
        text: ", .2for1"
      - id: select-bad
        type: editor.select
        at: { mark: after-bad }
        target: { file: styles.css, text: ".2for1", occurrence: 1 }

  - id: universal-selector
    narration: >
      [[mark:scroll-top-universal]] နောက်ဆုံးအနေနဲ့ universal selector ကို ကြည့်ပါမယ်။ page ရဲ့ ထိပ်ကို
      ပြန်တက်ရအောင်။ [[mark:type-star]] ဒီ rule က page ထဲက element တိုင်းကို ရွေးပြီး၊ တစ်ခုစီရဲ့
      ပတ်လည်မှာ အနီရောင် မျဉ်းပြတ် outline ပါးပါး ဆွဲပေးပါတယ်။ [[mark:after-star]] box တွေ အကုန်
      တစ်ပြိုင်နက် ပေါ်လာပါပြီ။ header၊ logo၊ link တစ်ခုချင်းစီ၊ card တိုင်းနဲ့ card ထဲက အရာတွေ အားလုံးမှာ
      မျဉ်း ပတ်ထားပါတယ်။ ပြီးခဲ့တဲ့ lesson မှာ အရာတိုင်း box ပါလို့ ပြောခဲ့တာကို ဒီမှာ မြင်ရပါပြီ။ outline
      က နေရာ မယူလို့ ဘာမှ မရွေ့သွားပါဘူး။ [[mark:star-weight]] iced card တွေကို ကြည့်ပါ။ အပြာရောင် outline
      က ကျန်နေပါတယ်။ universal rule က နောက်မှ ရေးထားပေမယ့်၊ attribute selector က ပိုလေးလို့ပါ။
      [[mark:star-pseudo]] နောက်တစ်ချက်က၊ universal selector က pseudo-element တွေကို မရွေးပါဘူး။
      pseudo-element ဆိုတာ CSS နဲ့ element ထဲမှာ ထည့်လို့ ရတဲ့ box အပိုတွေပါ။ ဒါကြောင့် ပြီးခဲ့တဲ့ lesson
      က border box rule မှာ သူတို့ကို သီးသန့် ရေးခဲ့ရတာပါ။
    sources:
      - title: "web.dev Learn CSS — Selectors: universal selector"
        url: "https://web.dev/learn/css/selectors#universal_selector"
      - title: "MDN — Universal selectors"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/Universal_selectors"
      - title: "MDN — outline"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/outline"
    actions:
      - id: scroll-top-universal
        type: preview.scroll
        at: { mark: scroll-top-universal }
        timeoutMs: 4000
        top: 0
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-star
        type: editor.type
        at: { mark: type-star }
        cadence: fast-explainer
        target: { file: styles.css, after: "  text-decoration: underline;\n}\n", occurrence: 1 }
        text: "\n* {\n  outline: 1px dashed tomato;\n}\n"
      - id: expect-menu
        type: expect.preview
        at: { mark: after-star }
        timeoutMs: 4000
        target: { by: testId, value: menu-drinks }
        textContains: "ဖာလူဒါ"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:open-recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ simple selector တစ်ခုစီက အချက် တစ်ချက်တည်းနဲ့ ရွေးပါတယ်။
      element နာမည်၊ class၊ ID၊ attribute ဒါမှမဟုတ် တန်ဖိုးနဲ့ ရွေးနိုင်သလို၊ element အားလုံးကိုလည်း
      တစ်ခါတည်း ရွေးနိုင်ပါတယ်။ [[mark:draw-weights]] ညာဘက်က အကွက်လေးတွေက သူတို့ရဲ့ အလေးချိန်ကို ပြပါတယ်။
      ID က အလေးဆုံး ဖြစ်ပြီး၊ universal selector မှာတော့ အလေးချိန် လုံးဝ မရှိပါဘူး။ [[mark:draw-note]]
      lesson 6 မှာ ဒီ အလေးချိန်တွေကို သေချာ တွက်ပါမယ်။ [[mark:quiz]] ကိုယ့်ဘာသာ စစ်ကြည့်ချင်ရင် pause
      လုပ်ပြီး၊ board ပေါ်က selector တစ်ခုစီက ဘာကို ရွေးလဲ ဆိုတာ ဘေးက စာကို မဖတ်ခင် ပြောကြည့်ပါ။
      [[mark:next-lesson]] နောက် lesson မှာတော့ simple selector တွေကို တွဲရေးပြီး၊ element တွေကို page
      ထဲမှာ ဘယ်နေရာ ရှိလဲ ဆိုတာနဲ့ ရွေးကြည့်ပါမယ်။ lesson အစက ပထမ စာပိုဒ်ကို ရွေးတဲ့ selector ကိုလည်း
      အဲဒီမှာ အသေးစိတ် ရှင်းပြပါမယ်။
    sources:
      - title: "web.dev Learn CSS — Selectors: check your understanding"
        url: "https://web.dev/learn/css/selectors#check_your_understanding"
      - title: "web.dev Learn CSS — Specificity"
        url: "https://web.dev/learn/css/specificity"
      - title: "web.dev Learn CSS — Selectors: complex selectors"
        url: "https://web.dev/learn/css/selectors#complex_selectors"
    actions:
      - id: open-recap
        type: whiteboard.apply
        at: { mark: open-recap }
        open: true
        upsertIds: [b-title]
      - id: draw-weights
        type: whiteboard.apply
        at: { mark: draw-weights }
        upsertIds: [c-weight-title, c-bar-id, c-bar-class, c-bar-attr, c-bar-type, c-bar-all]
        drawMs: 3600
      - id: draw-note
        type: whiteboard.apply
        at: { mark: draw-note }
        upsertIds: [c-note]
        drawMs: 1000
      - id: expect-css-start
        type: expect.file
        at: { afterAction: draw-weights }
        path: styles.css
        contains: ".about p:first-of-type {\n  font-weight: bold;\n}\n\np {\n  color: saddlebrown;\n}\n\n.featured {\n  border: 2px solid gold;\n}\n\n#today-special {\n  background: wheat;\n}\n\n.menu-card {\n  background: lavender;\n}\n"
      - id: expect-css-attributes
        type: expect.file
        at: { afterAction: expect-css-start }
        path: styles.css
        contains: "[data-temp] {\n  border-left: 6px solid gray;\n}\n\n[data-temp=\"hot\"] {\n  border-left-color: firebrick;\n}\n\n[data-temp=\"iced\"] {\n  border-left-color: steelblue;\n}\n\na[href$=\".pdf\"] {\n  color: gold;\n}\n\na[href^=\"tel:\"] {\n  font-weight: bold;\n}\n\na[href*=\"facebook\"] {\n  color: skyblue;\n}\n"
      - id: expect-css-end
        type: expect.file
        at: { afterAction: expect-css-attributes }
        path: styles.css
        contains: "[data-temp=\"ICED\" i] {\n  outline: 2px dashed steelblue;\n}\n\nh2, h3, .price {\n  color: darkgreen;\n}\n\n.name, .2for1 {\n  text-decoration: underline;\n}\n\n* {\n  outline: 1px dashed tomato;\n}\n"

checks:
  - { type: timing.p95Ms, max: 300 }
