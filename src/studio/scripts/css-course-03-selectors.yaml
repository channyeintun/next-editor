# CSS course (Burmese), lesson 3 of 43: simple selectors.
#
# Narration below is Burmese (its source is voice-script.md next to this
# file; DESIGN.md is the span-by-span brief). Every [[mark:…]] sits where its
# action begins, at a sentence end; each span carries one piece of meaning.
# Everything the learner sees (title, chapters, whiteboard labels, UI strings)
# is Burmese.
#
# Shape: board (recall lesson 2; the "only the first paragraph" job; rule
# anatomy) → code tour (index.html: the new PDF link, the two about
# paragraphs; empty styles.css) → the job solved live with one selector that
# lesson 4 explains → board (the simple selectors) → type selector →
# class selector (token match, names can't start with a digit) → ID selector,
# then a later class rule that loses to it (weights preview) → attribute
# presence and exact value (hot/iced stripes) → substring operators on the
# PDF, phone and Facebook links → case flag i (s explained only) → selector
# list, then one invalid selector drops a whole rule → universal selector
# outlines every box → recap on the map board with weights, hand-off to
# lesson 4 (combinators and position).
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set(; no postcss config. Every typed
# state is plain CSS that hot-swaps with no reload, so no interaction is ever
# lost and index.html is never edited. Colour values are keywords with no
# valid shorter prefix. The only scripted interaction is preview.scroll.
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
