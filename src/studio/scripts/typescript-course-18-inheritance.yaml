    narration: >
      [[mark:open-delivery-6]] delivery ပို့တဲ့ ဝန်ထမ်းရဲ့ app က ပို့ရမယ့် အရာတိုင်းမှာ လိပ်စာနဲ့ ရောက်ဖို့
      ကြာမယ့် မိနစ် ပါရမယ် ဆိုပါစို့။ [[mark:type-interface]] အဲဒီ ပုံစံကို interface တစ်ခုနဲ့ ရေးပါမယ်။
      [[mark:type-implements]] ပြီးတော့ delivery class က ဒီ interface ကို လိုက်နာမယ်လို့ implements နဲ့
      ကတိပေးလိုက်ပါမယ်။ [[mark:read-implements]] error ပေါ်လာပါပြီ။ class က interface ကို မှန်မှန်
      မလိုက်နာဘူး၊ မိနစ် property မပါဘူးလို့ ပြောနေတာပါ။ implements ပါရင် class ကို ရေးတဲ့
