  - id: abstract
    chapter: "abstract class"
    narration: >
      [[mark:open-order-4]] ဆိုင်က အော်ဒါ တိုင်းဟာ ဆိုင်ထဲ အော်ဒါ ဒါမှမဟုတ်
      delivery အော်ဒါ ဖြစ်ရမှာ ဖြစ်လို့၊ ဘယ်အမျိုးအစားမှ မဟုတ်တဲ့ အော်ဒါ သက်သက်ကို မဆောက်စေချင်ပါဘူး။
      [[mark:type-abstract]] ဒါကြောင့် class ရဲ့ ရှေ့မှာ abstract လို့ ထည့်ပါမယ်။ abstract class ဆိုတာ new နဲ့
      တိုက်ရိုက် ဆောက်လို့ မရဘဲ၊ subclass တွေရဲ့ အခြေခံ အဖြစ်ပဲ သုံးတဲ့ class ပါ။ [[mark:read-abstract]] main
      ဖိုင်မှာ abstract class ကို ဆောက်လို့ မရဘူး ဆိုတဲ့ error ပေါ်လာပါပြီ။ Output ကတော့ အရင်အတိုင်း
      ထွက်နေပါတယ်၊ abstract ကလည်း TypeScript ရဲ့ စစ်ဆေးချက် ဖြစ်လို့ပါ။ [[mark:type-table-order]] ဒါဆို
      ဆိုင်ထဲ အော်ဒါအတွက် subclass တစ်ခု ရေးပါမယ်။ ထပ်ထည့်စရာ မရှိသေးလို့ class ရဲ့ အထဲက အလွတ်ပါ။
      [[mark:open-main-5]] main ဖိုင်မှာ ဒီ class ကို import လုပ်ပြီး လက်ဖက်ရည် အော်ဒါကို သူနဲ့ ဆောက်ပါမယ်။
      [[mark:read-table-order]] error ပျောက်သွားပြီး ဘောင်ချာ နှစ်ခုလုံး အရင်အတိုင်း ထွက်ပါတယ်။ abstract class
      ကို type အဖြစ်တော့ ဘောင်ချာ function မှာလို ဆက်သုံးလို့ ရပါတယ်။
