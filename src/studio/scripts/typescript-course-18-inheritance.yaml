  - id: recap
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ extends နဲ့ base class ရဲ့ property နဲ့ method တွေကို အမွေယူပြီး၊
      subclass ရဲ့ constructor မှာ super ကို အရင် ခေါ်ရပါတယ်။ protected က subclass တွေကို သုံးခွင့် ပေးပြီး
      အပြင်ကိုတော့ ပိတ်ထားပါတယ်။ [[mark:recap-override]] override keyword က base class ရဲ့ method ကို
      ပြန်ရေးမှန်း ပြပြီး၊ base method နာမည် ပြောင်းသွားရင် error နဲ့ သတိပေးပါတယ်။ no implicit override က အဲဒီ
      keyword ကို မဖြစ်မနေ ရေးခိုင်းပါတယ်။ implements က class တစ်ခု interface နဲ့ ကိုက်မကိုက် စစ်ပြီး၊
      abstract class ကတော့ တိုက်ရိုက် မဆောက်ရဘဲ subclass တွေ ရေးပေးရမယ့် method တွေကို သတ်မှတ်ပါတယ်။ နောက်
      lesson မှာတော့ JavaScript မှာ မရှိဘဲ TypeScript မှာပဲ ရှိတဲ့ feature တွေကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 8: Classes",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/classes",
        }
      - {
          title: "TypeScript Handbook: Classes",
