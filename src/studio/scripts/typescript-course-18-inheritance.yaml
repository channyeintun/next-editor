      ဖတ်ရပါမယ်။ ပြီးခဲ့တဲ့ lesson မှာ တွေ့ခဲ့တဲ့ private ကို သုံးရင်တော့ subclass ကပါ သုံးလို့ မရတော့ပါဘူး။
      [[mark:type-protected]] ဒါကြောင့် ဈေးနှုန်းရဲ့ ရှေ့မှာ protected လို့ ထည့်ပါမယ်။ protected ဆိုတာ class
