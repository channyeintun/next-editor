scenes:
  - id: recall
    chapter: "Inheritance ဆိုတာ"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ class တစ်ခုကို ရေးပြီး new နဲ့ object တွေ ဆောက်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ class တစ်ခုက နောက် class တစ်ခုဆီက
      အမွေဆက်ခံတဲ့ inheritance ကို ကြည့်သွားပါမယ်။ [[mark:draw-base]] ဆိုင်မှာ ဆိုင်ထဲ ထိုင်သောက်တဲ့
      အော်ဒါရော၊ အိမ်အထိ ပို့ပေးရတဲ့ delivery အော်ဒါရော ရှိပါတယ်။ အော်ဒါ တိုင်းမှာ ပစ္စည်း၊ ဈေးနှုန်း ပါပြီး၊
      ကျသင့်ငွေ တွက်တာ၊ ဘောင်ချာ ထုတ်တာ လုပ်ရပါတယ်။ [[mark:draw-sub]] delivery အော်ဒါမှာတော့ ပို့ရမယ့် လိပ်စာ
      ထပ်ပါပြီး၊ ကျသင့်ငွေမှာလည်း ပို့ခ ပေါင်းရပါတယ်။ ကျန်တာ အားလုံးကတော့ သာမန် အော်ဒါနဲ့ အတူတူပါပဲ။
      [[mark:draw-extends]] ဒီလို အခြေအနေမှာ code ကို ကူးမရေးဘဲ၊ delivery class က အော်ဒါ class ကို extends
      လုပ်ပြီး အမွေဆက်ခံလို့ ရပါတယ်။ ဆိုလိုတာက မူလ class ရဲ့ property နဲ့ method တွေ အကုန် ပါလာပြီး၊ ကိုယ်
      လိုတာကိုပဲ ထပ်ထည့်တာ၊ ပြောင်းတာ လုပ်ရတာပါ။ မူလ class ကို base class လို့ ခေါ်ပြီး၊ အမွေဆက်ခံတဲ့ class
      ကို subclass လို့ ခေါ်ပါတယ်။ [[mark:draw-is-a]] delivery အော်ဒါဟာ အော်ဒါ တစ်မျိုး ဖြစ်တဲ့အတွက်၊ အော်ဒါ
      လိုတဲ့ နေရာမှာလည်း သုံးလို့ ရပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 8: Classes (class inheritance)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/classes",
        }
      - {
          title: "TypeScript Handbook: Classes (extends clauses)",
          url: "https://www.typescriptlang.org/docs/handbook/2/classes.html#extends-clauses",
        }
      - {
          title: "MDN: extends",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Classes/extends",
        }
    actions:
      - id: open-board-a
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-base
        type: whiteboard.apply
        at: { mark: draw-base }
        upsertIds: [a-base-box, a-base-name, a-base-props, a-base-total, a-base-receipt]
        drawMs: 3000
      - id: draw-sub
        type: whiteboard.apply
        at: { mark: draw-sub }
        upsertIds: [a-sub-box, a-sub-name, a-sub-add, a-sub-change]
        drawMs: 2800
      - id: draw-extends
        type: whiteboard.apply
        at: { mark: draw-extends }
        upsertIds: [a-extends, a-arrow, a-sub-same]
        drawMs: 2400
      - id: draw-is-a
        type: whiteboard.apply
        at: { mark: draw-is-a }
        upsertIds: [a-is-a]
        drawMs: 1500

  - id: starter
    narration: >
      [[mark:close-board]] ဒါဆို ဆိုင်ရဲ့ code ထဲမှာ ကြည့်ရအောင်။ [[mark:open-order]] ဒါက အော်ဒါ class ပါ။ ပစ္စည်းနဲ့
      ဈေးနှုန်းကို constructor ကနေ ယူပြီး property နှစ်ခုထဲမှာ သိမ်းပါတယ်။ [[mark:select-total]] ကျသင့်ငွေ
      တွက်တဲ့ method ကတော့ အခုအတိုင်း ဈေးနှုန်းကိုပဲ ပြန်ပေးပါတယ်။ [[mark:select-receipt]] ဘောင်ချာ method
      ကတော့ ကျသင့်ငွေကို ကိုယ်တိုင် မတွက်ဘဲ၊ this ကနေ အဲဒီ method ကို ခေါ်ပြီး ယူပါတယ်။ ဒီ အချက်ကို မှတ်ထားပါ၊ နောက်မှ
      အရေးပါလာပါမယ်။ [[mark:open-delivery]] delivery အော်ဒါကိုတော့ ဒီ ဖိုင်မှာ ရေးသွားမှာ ဖြစ်ပြီး၊ အခု
      import တစ်ကြောင်းပဲ ရှိပါသေးတယ်။ [[mark:open-main]] main ဖိုင်မှာတော့
      ဘောင်ချာ ထုတ်တဲ့ function က Order type ရှိတဲ့ parameter ကို လက်ခံပါတယ်။ [[mark:select-new]] အောက်မှာ
      လက်ဖက်ရည် အော်ဒါ တစ်ခု ဆောက်ပြီး အဲဒီ function ထဲ ထည့်ပါတယ်။
    sources:
      - {
          title: "TypeScript Handbook: Classes (methods, this)",
          url: "https://www.typescriptlang.org/docs/handbook/2/classes.html#methods",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: open-order
        type: workspace.openFile
        at: { mark: open-order }
        path: src/order.ts
      - id: select-total
        type: editor.select
        at: { mark: select-total }
        target:
          { file: src/order.ts, text: "  total() {\n    return this.price;\n  }", occurrence: 1 }
      - id: select-receipt
        type: editor.select
        at: { mark: select-receipt }
        target: { file: src/order.ts, text: "this.total()", occurrence: 1 }
      - id: open-delivery
        type: workspace.openFile
        at: { mark: open-delivery }
        path: src/delivery.ts
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: src/main.ts
      - id: select-log
        type: editor.select
        at: { afterAction: open-main }
        target: { file: src/main.ts, text: "function printReceipt(order: Order)", occurrence: 1 }
      - id: select-new
        type: editor.select
        at: { mark: select-new }
        target: { file: src/main.ts, text: 'new Order("လက်ဖက်ရည်", 1500)', occurrence: 1 }

  - id: panel
    narration: >
      [[mark:panel-ready]] ညာဘက် panel ရဲ့ Output မှာ လက်ဖက်ရည် ၁၅၀၀ ကျပ် ဆိုတဲ့ ဘောင်ချာ ပေါ်နေပြီး၊ Errors
      မှာ error မရှိပါဘူး။ အခု delivery အော်ဒါကို ရေးကြည့်ရအောင်။
    sources:
      - {
          title: "TypeScript Handbook: Classes",
          url: "https://www.typescriptlang.org/docs/handbook/2/classes.html",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-clean
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-start-output
        type: expect.preview
        at: { afterAction: expect-clean }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-1 }
        textContains: "လက်ဖက်ရည် 1500 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: extends
    chapter: "extends နဲ့ super"
    narration: >
      [[mark:open-delivery-2]] delivery ဖိုင်ကို ဖွင့်ပါမယ်။ [[mark:type-class]] အော်ဒါ class ကို extends
      လုပ်တဲ့ class တစ်ခု ရေးပြီး လိပ်စာ property ကို ထပ်ထည့်ပါမယ်။ constructor က ပစ္စည်း၊ ဈေးနှုန်းနဲ့
      လိပ်စာကို လက်ခံပေမယ့်၊ ထဲမှာတော့ လိပ်စာကိုပဲ သိမ်းထားပါတယ်။ [[mark:read-super-errors]] Errors မှာ error
      နှစ်ခု ပေါ်လာပါပြီ။ ပထမ error က subclass ရဲ့ constructor မှာ super ကို ခေါ်ရမယ်လို့ ပြောပြီး၊ ဒုတိယက
      this ကို မသုံးခင် super ကို အရင် ခေါ်ရမယ်လို့ ပြောပါတယ်။ super ကို ခေါ်တာဟာ base class ရဲ့ constructor ကို ခေါ်တာပါ။
      ပစ္စည်းနဲ့ ဈေးနှုန်းကို base class က သိမ်းပေးရမှာ ဖြစ်လို့၊ subclass က သူ့ကို အရင်ဆုံး ခေါ်ပေးရပါတယ်။
      [[mark:type-super]] ဒါကြောင့် constructor ရဲ့ ပထမ line မှာ ပစ္စည်းနဲ့ ဈေးနှုန်းကို super ဆီ
      ပို့ပေးပါမယ်။ [[mark:read-super-fixed]] error နှစ်ခုလုံး ပျောက်သွားပါပြီ။ [[mark:open-main-2]] main
      ဖိုင်မှာ delivery class ကို import လုပ်ပါမယ်။ [[mark:type-delivery]] ပြီးတော့ ကော်ဖီ တစ်ခွက်ကို
      အင်းလျားလမ်းကို ပို့ဖို့ အော်ဒါ ဆောက်ပြီး၊ ဘောင်ချာ function ထဲ ထည့်ပါမယ်။ [[mark:read-inherited]] Output
      မှာ ကော်ဖီ ၁၈၀၀ ကျပ် ဆိုတဲ့ ဘောင်ချာ ပေါ်လာပြီး error လည်း မရှိပါဘူး။ delivery class ထဲမှာ ဘောင်ချာ
      method ကို မရေးထားပေမယ့် base class ဆီက အမွေရလာပြီး၊ delivery အော်ဒါဟာ အော်ဒါ တစ်မျိုး ဖြစ်လို့ Order
      ကို လက်ခံတဲ့ function ထဲလည်း ထည့်လို့ ရတာပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 8: Classes (extending a class, super)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/classes",
        }
      - {
          title: "MDN: super",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/super",
