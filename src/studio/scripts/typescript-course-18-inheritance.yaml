  - id: no-implicit-override
    narration: >
      [[mark:open-config]] TypeScript မှာ override လုပ်တဲ့ method တွေကို override keyword နဲ့ မဖြစ်မနေ
      ရေးခိုင်းတဲ့ setting တစ်ခု ရှိပါတယ်။ [[mark:type-config]] tsconfig မှာ no implicit override ကို
      ဖွင့်လိုက်ပါမယ်။ [[mark:read-4114]] Errors မှာ error တစ်ခု ပေါ်လာပါပြီ။ ဒီ method က base class ရဲ့
      method ကို override လုပ်နေလို့ override keyword ပါရမယ်လို့ ပြောနေတာပါ။ [[mark:type-override]] ဒါကြောင့်
      delivery ဖိုင်က method ရဲ့ ရှေ့မှာ override keyword ထည့်ပါမယ်။ [[mark:read-override-ok]] error
      ပျောက်သွားပါပြီ။ ဒီ method က base class ဆီက method ကို တမင် ပြန်ရေးထားတာ ဆိုတာ ဖတ်တဲ့သူရော TypeScript ပါ
      သိသွားပါပြီ။
