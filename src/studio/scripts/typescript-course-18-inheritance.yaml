  - id: abstract-method
    narration: >
      [[mark:open-order-5]] abstract class ထဲမှာ abstract method လည်း ရေးလို့ ရပါတယ်။
      [[mark:type-abstract-method]] ဘောင်ချာမှာ အော်ဒါ ဘယ်ကို သွားမလဲ ပြချင်လို့၊ နေရာကို စာသားနဲ့ ပြန်ပေးမယ့်
      abstract method တစ်ခု ထည့်ပါမယ်။ abstract method မှာ code မပါဘဲ နာမည်နဲ့ type ပဲ ပါပါတယ်။
      [[mark:read-2515]] Errors မှာ error နှစ်ခု ပေါ်လာပါပြီ။ ဆိုင်ထဲ အော်ဒါရော delivery အော်ဒါရော ဒီ abstract
      method ကို မရေးရသေးဘူးလို့ ပြောနေတာပါ။ abstract method ပါရင် subclass တိုင်းက ကိုယ်ပိုင် version ကို
      မဖြစ်မနေ ရေးပေးရပါတယ်။ [[mark:type-table-label]] ဆိုင်ထဲ အော်ဒါက ဆိုင်ထဲမှာ ဆိုတဲ့ စာကို ပြန်ပေးပါမယ်။
      [[mark:open-delivery-7]] delivery အော်ဒါကတော့ လိပ်စာကို ပြန်ပေးပါမယ်။ abstract method ကို ရေးတဲ့အခါ
      override keyword ကို TypeScript က မတောင်းလို့ ဒီမှာ မထည့်ထားပါဘူး။ [[mark:open-order-6]] နောက်ဆုံး
      ဘောင်ချာ method ထဲမှာ ဒီ method ကို ခေါ်ပါမယ်။ [[mark:read-labels]] error မရှိတော့ဘဲ၊ Output မှာ
      လက်ဖက်ရည်က ဆိုင်ထဲမှာ၊ ကော်ဖီက အင်းလျားလမ်း ဆိုပြီး ဘောင်ချာ နှစ်ခု ထွက်လာပါပြီ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 8: Classes (abstract methods)",
