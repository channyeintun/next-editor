      နာမည်ရော၊ ဘောင်ချာထဲက ခေါ်တဲ့ နေရာရော ပြောင်းလိုက်ပါမယ်။ [[mark:read-rename]] Output မှာ ကော်ဖီက ၁၈၀၀
