# CSS course (Burmese), lesson 13 of 43: layout methods and normal flow.
#
# Narration is Burmese (voice-script.md next to this file is the same text
# with marks; DESIGN.md is the span-by-span brief). Every [[mark:…]] sits
# where its action begins, at a sentence end; each span carries one piece of
# meaning. Everything the learner sees (title, chapters, whiteboard labels,
# UI strings) is Burmese.
#
# Shape: board (recall lesson 12; layout history: tables, CSS separates the
# look, CSS Zen Garden, flexbox and grid; choosing a method) → board (flow
# layout: block direction, inline direction, writing mode, display's
# starting value) → code tour (index.html: prices + badge, the special tag in
# a paragraph, the nav list, the cup in the about box, the short copy, the
# townships; empty styles.css) → .price width/height/background (no size
# change: inline), display block (own line, sized), inline-block (back in the
# line, sized) → .tag padding, margin + gold (overlaps the lines, pushes nothing),
# inline-block (lines open up) → board (display's outer and inner jobs, the
# two-value syntax, quiz: scrolling is overflow's job) → .nav ul flex + gap
# (the links in a row; only the direct children change) → board (flexbox one
# direction, grid two) → .about-img float left (the story wraps the cup) →
# the short copy collapses and the cup pushes the next heading aside; clear
# on that heading, then flow-root on the about boxes → multicol on the
# townships: count 2 + gap, a rule, column width (no change: the count is a
# maximum), count auto (three columns) → board (multicol flows one stream;
# grid and flex cells are separate boxes) → recap, hand-off to position
# (lesson 14).
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set(; no postcss config; no reload.
# Mid-typing prefixes: every keystroke-typed value has no misleading valid
# prefix ("width: 12", "padding: 1", "column-width: 6r" are invalid and
# ignored; "display: flow" equals block, which the short box already is).
# Two lines land whole (line-by-line): the price's "display: inline-block"
# (a keystroke "display: inline" would flash the price back to inline, then
# "inline-" would fall back to block) and the column rule ("1px solid" is a
# valid currentColor rule before "tan" lands).
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
