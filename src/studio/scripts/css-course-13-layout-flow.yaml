      # base.css: sections A, B, B2 and C of the course kit. Section E pins the
      # about boxes (white, bordered, paragraphs without margin, so the short
      # copy is one line tall and its floated cup clearly hangs out) and the
      # townships list's indent (20px on each item, not on the list, so a
      # bullet never hangs in the column gap; three 6rem columns fit at 432 px).
      # Nothing in base sets display, float, clear or columns on the demo
      # elements.
      base.css: |
        /*
          base.css: pinned, never typed during a lesson.
          The shop's palette and the page furniture, so the CSS a lesson types can
          focus on one idea. Lesson 13 keeps sections A, B, B2 and C, and pins the
          about boxes and the townships list in section E (no display, float, clear
          or column rule here: the lesson types those).
        */

        /* == A. palette == */
        :root {
          color-scheme: light;
          --tea-dark: #3b2314;
          --tea: #8b5a2b;
          --tea-light: #c9a27e;
          --cream: #fff8ec;
          --paper: #fdf3e1;
          --leaf: #2f6b3a;
          --gold: #c9a227;
          --chili: #b23a2b;
          --ink: #2b1d14;
          --muted: #6b5a4c;
          --line: #e6d5bf;
          --radius: 12px;
        }

        /* == B. page == */
        body {
          margin: 0;
          font-family: "Noto Sans Myanmar", "Myanmar Sangam MN", "Myanmar MN", "Myanmar Text", "Padauk",
            system-ui, sans-serif;
          font-size: 16px;
          line-height: 1.8;
          color: var(--ink);
          background: var(--paper);
        }

        .page {
          padding: 0 16px 24px;
        }

        h1,
        h2,
        h3 {
          margin: 0 0 8px;
          line-height: 1.5;
        }

        h1 {
          font-size: 24px;
        }

        h2 {
          font-size: 20px;
        }

        h3 {
          font-size: 17px;
        }

        a {
          color: var(--tea);
        }

        /* Status lines that only expect.preview reads (kit.js data-report, data-say). */
        .visually-hidden {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip-path: inset(50%);
          white-space: nowrap;
        }

        /* == B2. reset (lesson 2 teaches it; every later lesson keeps it) == */
        *,
        *::before,
        *::after {
          box-sizing: border-box;
        }

        /* == C. furniture == */
        .site-header {
          padding: 16px;
          background: var(--tea-dark);
          color: var(--cream);
        }

        .site-header a {
          color: var(--cream);
        }

        .logo {
          display: block;
        }

        .tagline {
          margin: 0;
          color: var(--tea-light);
          font-size: 14px;
        }

        .nav ul {
          margin: 8px 0 0;
          padding: 0;
          list-style: none;
        }

        .hero {
          margin: 16px 0;
          padding: 16px;
          background: var(--cream);
          border-radius: var(--radius);
        }

        .menu {
          margin: 0;
          padding: 0;
          list-style: none;
        }

        .menu-card {
          margin: 0 0 12px;
          padding: 12px 16px;
          background: #fff;
          border: 1px solid var(--line);
          border-radius: var(--radius);
        }

        .menu-card .name,
        .menu-card .desc {
          margin: 0;
        }

        .menu-card .desc {
          color: var(--muted);
          font-size: 14px;
        }

        .price {
          font-weight: 700;
          color: var(--tea);
        }

        .badge {
          padding: 0 8px;
          border-radius: 999px;
          background: var(--leaf);
          color: #fff;
          font-size: 13px;
        }

        .sold-out {
          opacity: 0.6;
        }

        .order-link,
        .order-btn {
          display: inline-block;
          padding: 6px 16px;
          border: 0;
          border-radius: 999px;
          background: var(--tea);
          color: #fff;
          font: inherit;
          text-decoration: none;
        }

        .order-form label {
          display: block;
          margin-top: 8px;
        }

        .order-form input[type="text"],
        .order-form input[type="tel"],
        .order-form input[type="number"] {
          box-sizing: border-box;
          width: 100%;
          padding: 6px 10px;
          border: 1px solid var(--line);
          border-radius: 8px;
          background: #fff;
          font: inherit;
        }

        .order-btn {
          margin-top: 12px;
        }

        .gallery figure {
          margin: 0 0 12px;
        }

        .gallery img {
          display: block;
          max-width: 100%;
          height: auto;
          border-radius: var(--radius);
        }

        figcaption {
          color: var(--muted);
          font-size: 14px;
        }

        .hours-list {
          margin: 0;
          padding-left: 20px;
        }

        .site-footer {
          margin-top: 24px;
          padding: 16px;
          background: var(--tea-dark);
          color: var(--cream);
          font-size: 14px;
        }

        .site-footer a {
          color: var(--cream);
        }

        /* == E. lesson rules == */
        /* Lesson 13: the about boxes are bordered white boxes, so a float that
           hangs out of one is easy to see. */
        .about {
          margin: 16px 0;
          padding: 12px;
          background: #fff;
          border: 1px solid var(--line);
          border-radius: var(--radius);
        }

        .about p {
          margin: 0;
        }

        /* Lesson 13: the townships list keeps its bullets; the indent sits on
           the items, so in columns each bullet stays inside its own column. */
        .townships {
          margin: 0;
          padding-left: 0;
        }

        .townships li {
          margin-left: 20px;
        }
