  title: "Go course 32: Mutex နဲ့ တန်ဖိုးတစ်ခုကို မျှသုံးတာ"
  locale: my-MM
  workspace:
    lessonType: go
    name: Go Course
    entryFilePath: main.go
    # One file: an open explorer would be a list of one beside the code.
    sidebarStartsCollapsed: true
    files:
      main.go: |
        package main

        import (
        	"fmt"
        	"sync"
        	"time"
        )

        var total int

        func main() {
        	start := time.Now()
        	var wg sync.WaitGroup
        	wg.Go(func() { addCash(6000, 100*time.Millisecond) })
        	wg.Go(func() { addCash(4500, 200*time.Millisecond) })
        	wg.Wait()
        	fmt.Println(total, "ကျပ်")
        	fmt.Println(time.Since(start).Round(100*time.Millisecond), "ကြာ")
        }
