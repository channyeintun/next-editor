# Go course, lesson 32: sharing one value with a mutex (Burmese).
#
# Start state: main.go holds the imports (fmt, sync, time), the day's total and a main that sends
# two riders out at once with wg.Go; the function they call is not written yet.
# Edits, all insert-only:
#   1. addCash (read the total, count for a while, write the new total) -> run-1: 4500 ကျပ်, 200ms
#      (a lost update: always the same wrong answer, because the counting times differ);
#   2. `var mu sync.Mutex` under the total, `mu.Lock()` + `defer mu.Unlock()` at the top of
#      addCash -> run-2: 10500 ကျပ်, 300ms (right, and one rider waits for the key).
# Boards: (L) the lost update on a time line; (K) one key to the cash box; (B) keep the mutex
# beside its data, never copy it (the vet line, board only); (C) channel or mutex, and the race
# detector; (Q) the quiz.
# Fixtures: bun ~/Documents/go-course-work/tools/sim-go.ts <this yaml> --write
schemaVersion: 1

lesson:
