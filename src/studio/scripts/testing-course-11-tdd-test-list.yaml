              onInit(instance) {
                mine = instance;
                current = instance;
                // Vitest's own file watcher is closed: only this bridge decides when to rerun.
                void instance.vite?.watcher?.close();
              },
              onTestRunStart() {
                if (!live()) return;
                runStarted = true;
                setRunning(true);
              },
              onCoverage(map) {
                if (live()) coverage = summarizeCoverage(map, rel);
              },
              async onTestRunEnd(_modules, unhandledErrors) {
                if (!live()) return;
                const report = buildReport(current, unhandledErrors, { seq: seq + 1, root, rel, inProject });
                report.coverage = current?.config?.coverage?.enabled ? coverage : null;
                report.app = await appState();
                report.lint = wantsLint ? await lintNow() : null;
                if (!live()) return;
                seq += 1;
                report.seq = seq;
                latest = report;
                const t = latest.summary.tests;
                process.stdout.write(
                  `[course] vitest run ${seq}: ${latest.state === "pass" ? "PASS" : "FAIL"} · Tests ${t.failed} failed | ${t.passed} passed | ${t.skipped + t.todo} skipped (${t.total})\n`,
                );
                running = pending.size > 0;
                broadcast();
              },
            };
          };

          // Vitest's own terminal output (and its Vite server's log) goes here, not to the dev terminal:
          // the studio's verify step reads that terminal, and the panel already shows every result.
          const remember = (text) => {
            for (const line of String(text).split(/\r?\n/)) {
              const clean = stripAnsi(line).trimEnd();
              if (clean) vitestLog.push(clean);
            }
            if (vitestLog.length > 200) vitestLog.splice(0, vitestLog.length - 200);
          };
          const sink = new Writable({
            write(chunk, _encoding, done) {
              remember(chunk);
              done();
            },
          });
