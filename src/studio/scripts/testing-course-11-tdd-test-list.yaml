  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ TDD မှာ code မရေးခင် လိုချင်တဲ့ အလုပ်လုပ်ပုံတွေကို test list အနေနဲ့ အရင်
      ရေးပြီး၊ Vitest မှာ test todo တွေနဲ့ ထားလို့ ရပါတယ်။ item တစ်ခုချင်းကို test ပြောင်း၊ ကျတဲ့
      အကြောင်းကို စစ်၊ pass အောင် အနည်းဆုံး ပြင်ပြီး၊ green ဖြစ်မှ refactor လုပ်ပါတယ်။ အကြံသစ်
      ရလာရင်တော့ စာရင်းထဲ ထည့်ပါတယ်။ [[mark:recap-spec]] ဒီ စာရင်းဟာ code ဘာလုပ်ရမလဲ ဆိုတဲ့
      လိုအပ်ချက်၊ spec ပါ။ ၂၀၂၅ ခုနှစ်မှာ TDD ကို စတင်ခဲ့သူ ကိုယ်တိုင် AI agent နဲ့ program
      ရေးတဲ့အခါ၊ test စာရင်းကို ဖိုင် တစ်ခုထဲမှာ ထားပြီး agent ကို နောက် test တစ်ခုကိုပဲ pass
      ဖြစ်ရုံ code နဲ့ လုပ်ခိုင်းခဲ့ပါတယ်။ AI assistant နဲ့ TDD lesson မှာ ဒီ နည်းကို
      ပြန်ကြည့်ပါမယ်။ [[mark:recap-next]] ကျန်တဲ့ todo သုံးခုကိုတော့ lesson ကို pause လုပ်ပြီး
      ဆက်ရေးကြည့်ပါ။ နောက် lesson မှာတော့ bug report ရောက်လာတဲ့အခါ၊ bug ကို ပြန်ဖြစ်စေတဲ့ test ကို
      အရင် ရေးပြီးမှ ပြင်တဲ့ နည်းကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "Kent Beck: Canon TDD (facts C04)",
          url: "https://tidyfirst.substack.com/p/canon-tdd",
        }
      - {
          title: "Kent Beck: Augmented Coding, Beyond the Vibes, June 2025 (facts D04)",
