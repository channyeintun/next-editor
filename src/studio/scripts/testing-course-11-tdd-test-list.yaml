              n ? `✖ ${n} problem${n === 1 ? "" : "s"} (${lint.errors} error${lint.errors === 1 ? "" : "s"}, ${lint.warnings} warning${lint.warnings === 1 ? "" : "s"})` : lint ? "✓ no problems" : "…",
