                  if (now) files.set(path, now);
                }
              }
            };
            walk("src");
            for (const path of CONFIG_FILES) {
              const now = stamp(path);
              if (now) files.set(path, now);
            }
            return files;
          };
          const handled = new Map([...onDisk()].map(([path, now]) => [path, now.sig]));
          const reported = new Map();
