        }
      - {
          title: "web.dev Learn Testing: TDD for bug fixes (next lesson)",
          url: "https://web.dev/learn/testing/get-started/what-to-test#tdd",
        }
    actions:
      - id: close-mistakes
        type: whiteboard.apply
        at: { scene: start }
        open: false
checks:
  - { type: timing.p95Ms, max: 300 }
