      package.json: |
        {
          "name": "testing-course-tea-shop",
          "private": true,
          "version": "1.0.0",
          "type": "module",
          "scripts": {
            "dev": "vite --host 0.0.0.0 --port 5173 --strictPort",
            "test": "vitest"
          },
          "devDependencies": {
            "vite": "7.3.7",
            "vitest": "5.1.0"
          }
        }
      src/card.js: |
        // The loyalty card: it collects stamps and knows when a free tea is due.
      src/card.test.js: |
        import { expect, test } from "vitest";
        import { createCard } from "./card.js";

        test.todo("starts with no stamps");
        test.todo("adds the stamps from an order");
        test.todo("has a free tea due at 10 stamps");
        test.todo("keeps the extra stamps after a free tea");
        test.todo("refuses a free tea below 10 stamps");
      src/loyalty.js: |
        import { MENU } from "./menu.js";

        // A free tea is due when a card holds this many stamps.
        export const FREE_TEA_AT = 10;

        // One stamp per drink cup; food earns none.
        export function stampsFor(lines) {
          return lines
            .filter((line) => MENU[line.id].drink)
            .reduce((sum, line) => sum + (line.qty ?? 1), 0);
        }
      src/menu.js: |
        export const MENU = {
          tea: { name: "လက်ဖက်ရည်", price: 1500, drink: true },
          coffee: { name: "ကော်ဖီ", price: 1800, drink: true },
          lime: { name: "သံပုရာရည်", price: 1200, drink: true },
          mohinga: { name: "မုန့်ဟင်းခါး", price: 2500, drink: false },
          paratha: { name: "ပလာတာ", price: 1200, drink: false },
        };

        export function priceOf(id) {
          const item = MENU[id];
          if (!item) throw new Error(`${id} is not on the menu`);
          return item.price;
        }
      vite.config.js: |
        import { defineConfig } from "vite";
        import courseVitestBridge from "./course/vitest-bridge.js";

        // The course panel: the dev server runs the real Vitest and the preview shows its results.
        export default defineConfig({
          plugins: [courseVitestBridge()],
        });
      vitest.config.js: |
        import { defineConfig } from "vitest/config";

        export default defineConfig({
          test: {
          },
        });
