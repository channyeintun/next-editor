      နည်းနဲ့ ရေးကြည့်ပါမယ်။ သောက်စရာ တစ်ခွက် ဝယ်တိုင်း stamp တစ်ခု ရပြီး၊ ဆယ်ခု ပြည့်ရင် လက်ဖက်ရည်
      တစ်ခွက် အလကား ရတဲ့ card ပါ။ [[mark:list-first]] TDD မှာ code မရေးခင်၊ card က ဘာတွေ လုပ်ပေးရမလဲ
      ဆိုတာကို အရင် စာရင်း ချပါတယ်။ ဒါကို test list လို့ ခေါ်ပြီး၊ ရေးရမယ့် test တွေကို အရင်
      စာရင်းလုပ်ထားတာ ဖြစ်ပါတယ်။ [[mark:draw-list]] ဒီ card အတွက်ဆိုရင်၊ card အသစ်မှာ stamp
      မရှိသေးရဘူး၊ အော်ဒါက ရတဲ့ stamp တွေကို ပေါင်းထည့်ရမယ်၊ ဆယ်ခု ပြည့်ရင် လက်ဖက်ရည် အလကား ရရမယ်
      ဆိုတာတွေ ပါပါတယ်။ [[mark:draw-list-2]] အလကား ယူပြီးရင် ပိုနေတဲ့ stamp တွေ ကျန်ရမယ်၊ ဆယ်ခု
      မပြည့်ရင် အလကား မပေးရဘူး ဆိုတာတွေလည်း ပါပါတယ်။ [[mark:draw-design]] အောက်ဆုံးက line ကိုတော့
      သတိထား ကြည့်ပါ။ stamp တွေကို array ထဲမှာ သိမ်းမယ် ဆိုတာက card ဘာလုပ်ရမလဲ မဟုတ်ဘဲ၊ code ကို
      ဘယ်လို ရေးမလဲ ဆိုတဲ့ design ပါ။ [[mark:strike-design]] ဒါမျိုးကို test list ထဲ မထည့်ဘဲ၊ test
      တစ်ခုချင်းကို pass အောင် လုပ်တဲ့ အချိန်ကျမှ ဆုံးဖြတ်ပါတယ်။ [[mark:steps]] စာရင်း ရပြီဆိုရင်
      item တစ်ခုကိုပဲ test အဖြစ် ပြောင်း၊ အဲဒီ test နဲ့ အရင် test တွေ pass အောင် ပြင်၊ လိုရင်
      refactor လုပ်ပြီး၊ စာရင်း ကုန်တဲ့ အထိ ထပ်လုပ်ပါတယ်။ ရလာတဲ့ အကြံသစ်တွေကိုလည်း စာရင်းထဲ
      ထည့်ပါတယ်။
    sources:
      - {
          title: "Kent Beck: Canon TDD, the test list and its steps (facts C04)",
          url: "https://tidyfirst.substack.com/p/canon-tdd",
        }
      - {
          title: "Martin Fowler: Test Driven Development, the list of test cases first (facts C01)",
          url: "https://martinfowler.com/bliki/TestDrivenDevelopment.html",
        }
      - {
          title: "web.dev Learn Testing: An aside on test-driven development",
          url: "https://web.dev/learn/testing/get-started/what-to-test#tdd",
        }
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 300000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-box
        type: whiteboard.apply
        at: { mark: list-first }
        upsertIds: [a-box]
        drawMs: 1200
      - id: draw-list
        type: whiteboard.apply
        at: { mark: draw-list }
        upsertIds: [a-item-1, a-item-2, a-item-3]
        drawMs: 4500
      - id: draw-list-2
        type: whiteboard.apply
        at: { mark: draw-list-2 }
        upsertIds: [a-item-4, a-item-5]
        drawMs: 3500
      - id: draw-design
        type: whiteboard.apply
        at: { mark: draw-design }
        upsertIds: [a-design]
        drawMs: 1500
      - id: strike-design
        type: whiteboard.apply
        at: { mark: strike-design }
        upsertIds: [a-strike, a-design-note]
        drawMs: 2500

  - id: starter
    narration: >
      ဒီ စာရင်းကို test ဖိုင်ထဲမှာ ကြည့်ရအောင်။ [[mark:select-todos]] board ပေါ်က စာရင်းကိုပဲ၊ watch
      mode lesson မှာ တွေ့ခဲ့တဲ့ test todo ငါးကြောင်း အနေနဲ့ ရေးထားပါတယ်။ todo တစ်ကြောင်းက စာရင်းထဲက
      item တစ်ခုဖြစ်ပြီး၊ Vitest က သူတို့ကို မ run ဘဲ ရေးစရာ ကျန်သေးတဲ့ test အဖြစ်ပဲ မှတ်ပြပေးပါတယ်။
      [[mark:select-import]] ထိပ်ဆုံးမှာ card ဆောက်ပေးမယ့် function ကို import လုပ်ထားပေမဲ့၊ card
      ဖိုင်ထဲမှာ အဲဒီ function ကို မရေးရသေးပါဘူး။ [[mark:open-loyalty]] ပြီးခဲ့တဲ့ lesson က loyalty
      ဖိုင်ကိုလည်း ကြည့်ပါ။ [[mark:select-stampsfor]] ဒီ function က အော်ဒါ တစ်ခုမှာ stamp ဘယ်နှခု
      ရလဲ တွက်ပေးပြီး၊ သောက်စရာ တစ်ခွက်ကို stamp တစ်ခု ပေးပါတယ်။ [[mark:select-free]]
      သူ့အပေါ်မှာတော့ အလကား လက်ဖက်ရည် ရဖို့ လိုတဲ့ stamp ဆယ်ခုကို နာမည် တစ်ခုနဲ့ ထည့်ထားပါတယ်။
    sources:
      - { title: "Vitest: test.todo", url: "https://vitest.dev/api/test#test-todo" }
      - {
          title: "Vitest: Writing Tests, skipping and focusing tests (todo)",
          url: "https://vitest.dev/guide/learn/writing-tests#skipping-and-focusing-tests",
        }
    actions:
      - id: close-list
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: select-todos
        type: editor.select
        at: { mark: select-todos }
        target:
          {
            file: src/card.test.js,
            text: "test.todo(\"starts with no stamps\");\ntest.todo(\"adds the stamps from an order\");\ntest.todo(\"has a free tea due at 10 stamps\");\ntest.todo(\"keeps the extra stamps after a free tea\");\ntest.todo(\"refuses a free tea below 10 stamps\");",
            occurrence: 1,
          }
      - id: select-import
        type: editor.select
        at: { mark: select-import }
        target:
          { file: src/card.test.js, text: 'import { createCard } from "./card.js";', occurrence: 1 }
      - id: open-loyalty
        type: workspace.openFile
        at: { mark: open-loyalty }
        path: src/loyalty.js
      - id: select-stampsfor
        type: editor.select
        at: { mark: select-stampsfor }
        target:
          {
            file: src/loyalty.js,
            text: "  return lines\n    .filter((line) => MENU[line.id].drink)\n    .reduce((sum, line) => sum + (line.qty ?? 1), 0);",
            occurrence: 1,
          }
      - id: select-free
        type: editor.select
        at: { mark: select-free }
        target: { file: src/loyalty.js, text: "export const FREE_TEA_AT = 10;", occurrence: 1 }

  - id: panel
    narration: >
      [[mark:ready]] panel ကို ကြည့်ရအောင်။ ဒါကလည်း code ပြောင်းတိုင်း watch mode နဲ့ ပြန် run နေတဲ့
      တကယ့် Vitest ရဲ့ ရလဒ်ပါ။ [[mark:read-todo]] todo ငါးခုကို လေးထောင့် အကွက်လေးတွေနဲ့ ပြထားပြီး၊
      summary မှာလည်း Tests မှာ ၅ ခု todo လို့ ပြနေပါတယ်။ ကျနေတဲ့ test မရှိလို့ အပေါ်က PASS ကလည်း
      အစိမ်းရောင်ပါ။ ဒါကြောင့် ရေးစရာ ကျန်သေးလား ဆိုတာကို အရောင်ကနေ မသိရဘဲ၊ summary ကို ဖတ်မှ
      သိရပါတယ်။
    sources:
      - {
          title: "Vitest: test.todo, an entry in the report",
          url: "https://vitest.dev/api/test#test-todo",
        }
      - {
          title: "Vitest: Writing Tests, reading test output",
          url: "https://vitest.dev/guide/learn/writing-tests#reading-test-output",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-start-pass
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1000 }
      - id: expect-start-todo
        type: expect.preview
        at: { afterAction: expect-start-pass }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-todo, value: "5" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-file
        type: expect.preview
        at: { afterAction: expect-start-todo }
        timeoutMs: 5000
        target: { by: testId, value: vt-file-1 }
        textContains: "(5 tests | 5 todo)"
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: one-item
    chapter: "Item တစ်ခုကို test အဖြစ် ပြောင်းရအောင်"
    narration: >
      [[mark:open-test-1]] ကဲ၊ ပထမ item ကို test အဖြစ် ပြောင်းရေးကြည့်ရအောင်။ [[mark:type-first]]
      သူ့ todo line ရဲ့ အောက်မှာ test တစ်ခု ထည့်ပါမယ်။ todo line ကိုတော့ test pass ဖြစ်တဲ့ အထိ
      ထားပါမယ်။ [[mark:select-first]] card အသစ်ကို stamp ဘယ်နှခု ရှိလဲ မေးရင်၊ သုည ဖြစ်ရမယ်လို့
      စစ်ထားပါတယ်။ [[mark:read-first-red]] test ကျသွားပြီး၊ card ဆောက်ပေးမယ့် function က function
      မဟုတ်ဘူး ဆိုတဲ့ TypeError ပြနေပါတယ်။ ပြီးခဲ့တဲ့ lesson မှာ ဘာမှ မပြောပြနိုင်ဘူးလို့ ပြောခဲ့တဲ့
      red မျိုးပါ။ [[mark:open-card-1]] ဒါပေမဲ့ ဒီ item က တောင်းတာ နည်းနည်းလေးပါ။
      [[mark:type-create]] card ဖိုင်ထဲမှာ stamp အရေအတွက်ကို variable တစ်ခုထဲ သိမ်းပြီး၊ အဲဒါကို
      ပြန်ပေးတဲ့ method ပါတဲ့ card ကို ဆောက်ပါမယ်။ [[mark:select-count]] card အသစ်မှာ အရေအတွက်က
      သုညကနေ စပါတယ်။ code က ဒီလောက် ရှင်းနေရင် function အလွတ် အဆင့်ကို ကျော်ပြီး မှန်တဲ့ code ကို
      တန်းရေးလို့ ရပါတယ်။ ပြီးခဲ့တဲ့ lesson က Obvious Implementation ပါ။ [[mark:read-first-green]]
      test pass ဖြစ်သွားပြီး၊ summary မှာ ၁ ခု pass နဲ့ ၅ ခု todo လို့ ပြနေပါတယ်။
      [[mark:open-test-tick]] item ပြီးပြီ ဆိုတော့ စာရင်းထဲမှာ ခြစ်ပါမယ်။ [[mark:tick-first]] todo
      line ကို comment လုပ်ပြီး ပိတ်လိုက်ရင် Vitest က အဲဒီ line ကို မမြင်တော့ပါဘူး။
      [[mark:read-tick-first]] summary မှာ todo လေးခုပဲ ကျန်ပါတော့တယ်။
    sources:
      - {
          title: "Kent Beck: Canon TDD, one item into a concrete test (facts C04)",
          url: "https://tidyfirst.substack.com/p/canon-tdd",
        }
      - {
          title: "Kent Beck: Test-Driven Development by Example, sample chapter, Obvious Implementation (facts C03)",
          url: "https://www.informit.com/content/images/9780321146533/samplepages/0321146530.pdf",
        }
      - {
          title: "Vitest: Common errors and a missing export (facts A33)",
          url: "https://vitest.dev/guide/common-errors",
        }
    actions:
      - id: open-test-1
        type: workspace.openFile
        at: { mark: open-test-1 }
        path: src/card.test.js
      - id: type-first
        type: editor.type
        at: { mark: type-first }
        target:
          {
            file: src/card.test.js,
            after: "test.todo(\"starts with no stamps\");\n",
            occurrence: 1,
          }
        text: "test(\"starts with no stamps\", () => {\n  expect(createCard().stamps()).toBe(0);\n});\n\n"
        # One block, then a select: line by line, the Enter-first newline leaves the file parseable and
        # the next line's pause can pass the bridge's 1 s quiet window (pilot note 1).
        cadence: block
      - id: expect-first-red
        type: expect.preview
        at: { afterAction: type-first }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-first-message
        type: expect.preview
        at: { afterAction: expect-first-red }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-message, value: "createCard is not a function" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-first-type
        type: expect.preview
        at: { afterAction: expect-first-message }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-name, value: TypeError }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-first
        type: editor.select
        at: { mark: select-first }
        target:
          { file: src/card.test.js, text: "expect(createCard().stamps()).toBe(0);", occurrence: 1 }
      - id: open-card-1
        type: workspace.openFile
        at: { mark: open-card-1 }
        path: src/card.js
      - id: type-create
        type: editor.type
        at: { mark: type-create }
        target: { file: src/card.js, after: "when a free tea is due.\n", occurrence: 1 }
        text: "\nexport function createCard() {\n  let count = 0;\n  return {\n    stamps() {\n      return count;\n    },\n  };\n}\n"
        cadence: block
      - id: expect-first-green
        type: expect.preview
        at: { afterAction: type-create }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-first-passed
        type: expect.preview
        at: { afterAction: expect-first-green }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "1" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-first-todo
        # The narration reads "1 passed and 5 todo" off this report.
        type: expect.preview
        at: { afterAction: expect-first-passed }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-todo, value: "5" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-count
        type: editor.select
        at: { mark: select-count }
        target: { file: src/card.js, text: "let count = 0;", occurrence: 1 }
      - id: open-test-tick
        type: workspace.openFile
        at: { mark: open-test-tick }
        path: src/card.test.js
      - id: tick-first
        type: editor.type
        at: { mark: tick-first }
        target:
          {
            file: src/card.test.js,
            after: "import { createCard } from \"./card.js\";\n\n",
            occurrence: 1,
          }
        text: "// "
      - id: expect-tick-first
        type: expect.preview
        at: { afterAction: tick-first }
        timeoutMs: 8000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-todo, value: "4" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-tick-first-total
        type: expect.preview
        at: { afterAction: expect-tick-first }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-total, value: "5" }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: second-item
    narration: >
      [[mark:type-second]] ဒုတိယ item အတွက်လည်း သူ့ todo line ရဲ့ အောက်မှာ test တစ်ခု ထည့်ပါမယ်။
      card ထဲကို အော်ဒါ ထည့်ရင် stamp တိုးလာလား စစ်တဲ့ test ပါ။ [[mark:select-order]] လက်ဖက်ရည်
      သုံးခွက်နဲ့ မုန့်ဟင်းခါး တစ်ပွဲ ပါတဲ့ အော်ဒါကို ထည့်ပြီး၊ [[mark:select-three]] stamp သုံးခု
      ရှိရမယ်လို့ စစ်ပါတယ်။ ဒီ သုံး ကို code ကနေ မယူဘဲ၊ စားစရာက stamp မရဘူး ဆိုတဲ့ ဆိုင်ရဲ့
      စည်းကမ်းနဲ့ တွက်ထားတာပါ။ [[mark:read-second-red]] panel ကတော့ card ရဲ့ add က function
      မဟုတ်ဘူးလို့ ပြောနေပါတယ်။ ဒါလည်း method မရှိလို့ ကျတဲ့ red ဖြစ်လို့၊ ဒီတစ်ခါတော့ ပြီးခဲ့တဲ့
      lesson ကလိုပဲ method အလွတ်ကို အရင် ထည့်ပါမယ်။ [[mark:open-card-2]] card ဖိုင်ကို
      ပြန်ဖွင့်ပြီး၊ [[mark:type-stub-add]] stamp ပြန်ပေးတဲ့ method ရဲ့ အောက်မှာ add အလွတ်ကို
      ထည့်ပါမယ်။ [[mark:read-right-red]] အခုမှ ၃ ဖြစ်ရမယ့် နေရာမှာ သုည ရနေတယ်လို့ ပြောပါပြီ။
      Expected ဖြစ်တဲ့ ၃ ကို အစိမ်းရောင်နဲ့၊ Received ဖြစ်တဲ့ သုည ကို အနီရောင်နဲ့ ပြထားပါတယ်။ stamp
      မတွက်သေးလို့ ကျတာ ဖြစ်လို့ ဒါမှ မှန်ကန်တဲ့ red ပါ။ [[mark:type-import]] loyalty ဖိုင်က stamp
      တွက်တဲ့ function ကို import လုပ်ပြီး၊ add ထဲမှာ အော်ဒါရဲ့ stamp တွေကို card ရဲ့ အရေအတွက်ထဲ
      ပေါင်းထည့်ပါမယ်။ stamp စည်းကမ်းကို ဒီမှာ ထပ်မရေးဘဲ ပြန်သုံးတာပါ။ [[mark:read-second-green]]
      test နှစ်ခုလုံး pass ဖြစ်သွားပါပြီ။ အရင် test ကလည်း pass နေဆဲ ဆိုတာကို panel က တစ်ခါတည်း
      ပြပေးပါတယ်။ [[mark:tick-second]] test ဖိုင်မှာ ဒီ item ကိုလည်း ခြစ်လိုက်ပါမယ်။
      [[mark:read-tick-second]] summary မှာ todo သုံးခုပဲ ကျန်ပါပြီ။ ခြေလှမ်း တိုင်းမှာ panel က
      ဖြေပေးနေတာကို သတိထား ကြည့်ပါ။
    sources:
      - {
          title: "Kent Beck: Canon TDD, make it and every earlier test pass (facts C04)",
          url: "https://tidyfirst.substack.com/p/canon-tdd",
        }
      - { title: "Vitest: expect, toBe", url: "https://vitest.dev/api/expect#tobe" }
    actions:
      - id: type-second
        type: editor.type
        at: { mark: type-second }
        target:
          {
            file: src/card.test.js,
            after: "test.todo(\"adds the stamps from an order\");\n",
            occurrence: 1,
          }
        text: "test(\"adds the stamps from an order\", () => {\n  const card = createCard();\n  card.add([\n    { id: \"tea\", qty: 3 },\n    { id: \"mohinga\" },\n  ]);\n  expect(card.stamps()).toBe(3);\n});\n\n"
        cadence: block
      - id: expect-second-red
        type: expect.preview
        at: { afterAction: type-second }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-second-message
        type: expect.preview
        at: { afterAction: expect-second-red }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-message, value: "card.add is not a function" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-order
        type: editor.select
        at: { mark: select-order }
        target:
          {
            file: src/card.test.js,
            text: "card.add([\n    { id: \"tea\", qty: 3 },\n    { id: \"mohinga\" },\n  ]);",
            occurrence: 1,
          }
      - id: select-three
        type: editor.select
        at: { mark: select-three }
        target: { file: src/card.test.js, text: "expect(card.stamps()).toBe(3);", occurrence: 1 }
      - id: open-card-2
        type: workspace.openFile
        at: { mark: open-card-2 }
        path: src/card.js
      - id: type-stub-add
        type: editor.type
        at: { mark: type-stub-add }
        target:
          {
            file: src/card.js,
            after: "    stamps() {\n      return count;\n    },\n",
            occurrence: 1,
          }
        text: "    add(lines) {\n    },\n"
        cadence: block
      - id: expect-right-red
        type: expect.preview
        at: { afterAction: type-stub-add }
        timeoutMs: 8000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-message, value: "expected +0 to be 3 // Object.is equality" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-right-diff
        type: expect.preview
        at: { afterAction: expect-right-red }
        timeoutMs: 5000
        target: { by: testId, value: vt-diff-1 }
        textContains: "- 3"
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: type-import
        type: editor.type
        at: { mark: type-import }
        target: { file: src/card.js, after: "when a free tea is due.\n", occurrence: 1 }
        text: "import { stampsFor } from \"./loyalty.js\";\n"
        cadence: block
      - id: type-add-body
        type: editor.type
        at: { afterAction: type-import }
        target: { file: src/card.js, after: "    add(lines) {\n", occurrence: 1 }
        text: "      count += stampsFor(lines);\n"
      - id: expect-second-green
        type: expect.preview
        at: { afterAction: type-add-body }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-second-passed
        type: expect.preview
        at: { afterAction: expect-second-green }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "2" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: open-test-tick-2
        type: workspace.openFile
        at: { mark: tick-second }
        path: src/card.test.js
      - id: tick-second
        type: editor.type
        at: { afterAction: open-test-tick-2 }
        target:
          {
            file: src/card.test.js,
            after: "  expect(createCard().stamps()).toBe(0);\n});\n\n",
            occurrence: 1,
          }
        text: "// "
      - id: expect-tick-second
        type: expect.preview
        at: { afterAction: tick-second }
        timeoutMs: 8000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-todo, value: "3" }
        retry: { maxAttempts: 3, delayMs: 1200 }

  - id: third-item
    narration: >
      [[mark:type-third]] တတိယ item ကတော့ stamp ဆယ်ခု ပြည့်ရင် လက်ဖက်ရည် အလကား ရရမယ် ဆိုတာပါ။ ဒီ
      test ကိုလည်း သူ့ todo line ရဲ့ အောက်မှာ ထည့်ပါမယ်။ [[mark:select-ten-teas]] လက်ဖက်ရည် ဆယ်ခွက်
      ပါတဲ့ အော်ဒါ ထည့်ပြီးရင်၊ အလကား ပေးရမယ့် အချိန် ရောက်ပြီလို့ card က ဖြေရမယ်လို့ စစ်ပါတယ်။
      [[mark:read-third-red]] panel ကလည်း ခုနကလိုပဲ method မရှိသေးလို့ ကျနေပါတယ်။
      [[mark:open-card-3]] ဒါကြောင့် card ဖိုင်မှာ method အလွတ်ကို အရင် ထည့်ပါမယ်။
      [[mark:read-third-right]] true ဖြစ်ရမယ့် နေရာမှာ undefined ရနေတယ်လို့ ပြောပါပြီ။ ဒါက
      မှန်ကန်တဲ့ red ပါ။ [[mark:type-ten]] ဒါဆို stamp အရေအတွက်က ဆယ် ဒါမှမဟုတ် ဆယ်ထက် များရင် true
      ပြန်ပေးပါမယ်။ stamp ဆယ်ခု အတိအကျ ရှိရင်လည်း အလကား ရရမယ် ဆိုတာ မမေ့ပါနဲ့။
      [[mark:read-third-green]] test သုံးခုလုံး pass ဖြစ်သွားပါပြီ။ ခြေလှမ်း တိုင်းကို panel က
      တစ်စက္ကန့် နှစ်စက္ကန့်အတွင်း ဖြေပေးလို့၊ စိတ်ချလက်ချ ရှေ့ဆက်နိုင်ပါတယ်။
    sources:
      - {
          title: "Kent Beck: Canon TDD (facts C04)",
          url: "https://tidyfirst.substack.com/p/canon-tdd",
        }
      - { title: "Vitest: expect, toBe", url: "https://vitest.dev/api/expect#tobe" }
    actions:
      - id: type-third
        type: editor.type
        at: { mark: type-third }
        target:
          {
            file: src/card.test.js,
            after: "test.todo(\"has a free tea due at 10 stamps\");\n",
            occurrence: 1,
          }
        text: "test(\"has a free tea due at 10 stamps\", () => {\n  const card = createCard();\n  card.add([{ id: \"tea\", qty: 10 }]);\n  expect(card.freeTeaDue()).toBe(true);\n});\n\n"
        cadence: block
      - id: expect-third-red
        type: expect.preview
        at: { afterAction: type-third }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-third-message
        type: expect.preview
        at: { afterAction: expect-third-red }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-message, value: "card.freeTeaDue is not a function" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-ten-teas
        type: editor.select
        at: { mark: select-ten-teas }
        target:
          {
            file: src/card.test.js,
            text: "card.add([{ id: \"tea\", qty: 10 }]);\n  expect(card.freeTeaDue()).toBe(true);",
            occurrence: 1,
          }
      - id: open-card-3
        type: workspace.openFile
        at: { mark: open-card-3 }
        path: src/card.js
      - id: type-stub-free
        type: editor.type
        at: { afterAction: open-card-3 }
        target:
          { file: src/card.js, after: "      count += stampsFor(lines);\n    },\n", occurrence: 1 }
        text: "    freeTeaDue() {\n    },\n"
        cadence: block
      - id: expect-third-right
        type: expect.preview
        at: { afterAction: type-stub-free }
        timeoutMs: 8000
        target: { by: testId, value: vt-error-1 }
        attribute:
          { name: data-message, value: "expected undefined to be true // Object.is equality" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: type-ten
        type: editor.type
        at: { mark: type-ten }
        target: { file: src/card.js, after: "    freeTeaDue() {\n", occurrence: 1 }
        text: "      return count >= 10;\n"
      - id: expect-third-green
        type: expect.preview
        at: { afterAction: type-ten }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-third-passed
        type: expect.preview
        at: { afterAction: expect-third-green }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "3" }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: refactor
    chapter: "Green ဖြစ်မှ refactor"
    narration: >
      [[mark:select-ten]] ဒါပေမဲ့ ဒီ ဆယ် ကို ကြည့်ပါ။ ဒီ စည်းကမ်းကို loyalty ဖိုင်မှာ နာမည်နဲ့
      သိမ်းထားပြီးသား ဖြစ်လို့၊ ဒီအတိုင်း ထားရင် စည်းကမ်း ပြောင်းတဲ့အခါ နှစ်နေရာမှာ ပြင်ရပါမယ်။ pass
      အောင် လုပ်တုန်းက အမြန်ဆုံး လမ်းကို ရွေးခဲ့ပြီး၊ green ဖြစ်မှ သီးသန့် အဆင့် တစ်ခု အနေနဲ့
      ရှင်းပါမယ်။ [[mark:type-refactor]] import ထဲမှာ အဲဒီ နာမည်ကို ထည့်ပြီး၊ ဆယ် နေရာမှာ နာမည်ကို
      သုံးတဲ့ line အသစ် ရေးပါမယ်။ အဟောင်းကိုတော့ comment လုပ်ထားပါမယ်။ [[mark:read-refactor]] panel
      က PASS အတိုင်းပါပဲ။ အလုပ်လုပ်ပုံ မပြောင်းဘဲ code ကိုပဲ သန့်အောင် ပြင်တာကို test သုံးခုက
      သက်သေပြနေတာပါ။ ကိုယ့် project မှာဆိုရင် comment line ကို ဖျက်လိုက်ပါ။ [[mark:tick-third]] ဒီ
      item လည်း ပြီးပြီ ဆိုတော့ test ဖိုင်မှာ ခြစ်လိုက်ပါမယ်။ [[mark:read-tick-third]] summary မှာ test သုံးခု pass
      ဖြစ်ပြီး၊ todo နှစ်ခုပဲ ကျန်ပါတော့တယ်။
    sources:
      - {
          title: "Martin Fowler: Test Driven Development, refactoring as its own step (facts C01)",
          url: "https://martinfowler.com/bliki/TestDrivenDevelopment.html",
        }
      - {
          title: "Kent Beck: Canon TDD, optionally refactor (facts C04)",
          url: "https://tidyfirst.substack.com/p/canon-tdd",
        }
    actions:
      - id: select-ten
        type: editor.select
        at: { mark: select-ten }
        target: { file: src/card.js, text: "return count >= 10;", occurrence: 1 }
      - id: type-refactor-import
        type: editor.type
        at: { mark: type-refactor }
        target: { file: src/card.js, after: "import { ", occurrence: 1 }
        text: "FREE_TEA_AT, "
      - id: type-refactor-line
        type: editor.type
        at: { afterAction: type-refactor-import }
        target: { file: src/card.js, after: "    freeTeaDue() {\n      ", occurrence: 1 }
        # One insert at the old line's first character: the new line, then the old one as a comment
        # (COURSE-KIT §5, review check f) — every state parses and stays green.
        text: "return count >= FREE_TEA_AT;\n      // "
        cadence: block
      - id: open-test-tick-3
        type: workspace.openFile
        at: { mark: tick-third }
        path: src/card.test.js
      - id: tick-third
        type: editor.type
        at: { afterAction: open-test-tick-3 }
        target:
          {
            file: src/card.test.js,
            after: "  expect(card.stamps()).toBe(3);\n});\n\n",
            occurrence: 1,
          }
        text: "// "
      - id: expect-tick-third
        type: expect.preview
        at: { afterAction: tick-third }
        timeoutMs: 8000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-todo, value: "2" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-refactor-passed
        type: expect.preview
        at: { afterAction: expect-tick-third }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "3" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-refactor-pass
        type: expect.preview
        at: { afterAction: expect-refactor-passed }
        timeoutMs: 5000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-card-file
        type: expect.file
        at: { afterAction: expect-refactor-pass }
        path: src/card.js
        contains: "      count += stampsFor(lines);\n    },\n    freeTeaDue() {\n      return count >= FREE_TEA_AT;\n"

  - id: new-idea
    narration: >
      ဒီလို အလုပ်လုပ်နေတုန်း အကြံသစ် တစ်ခု ပေါ်လာတယ် ဆိုပါစို့။ အလကား ရတဲ့ လက်ဖက်ရည် အတွက်ပါ stamp
      ပေးမိရင် မဖြစ်ပါဘူး။ ဒါကို အခု လိုက်မလုပ်ဘဲ၊ [[mark:type-new-todo]] စာရင်းရဲ့ အောက်ဆုံးမှာ
      todo အသစ် အနေနဲ့ ထည့်ထားပါမယ်။ လက်ရှိ item မပြီးခင် တခြား ကိစ္စကို လိုက်လုပ်ရင် ခြေလှမ်းတွေ
      ကြီးလာလို့ပါ။ [[mark:read-new-todo]] summary မှာ todo သုံးခု ဖြစ်သွားပါပြီ။
      [[mark:board-ticks]] board ပေါ်က စာရင်းမှာလည်း ပြီးတဲ့ item သုံးခုကို ခြစ်ပြီး အကြံသစ်ကို
      ထည့်လိုက်ပါမယ်။ test list က ပုံသေ စာရင်း မဟုတ်ဘဲ၊ အလုပ်လုပ်ရင်း ခြစ်လိုက်၊ ထည့်လိုက် လုပ်ရတဲ့
      စာရင်းပါ။
    sources:
      - {
          title: "Kent Beck: Canon TDD, add new ideas to the list (facts C04)",
          url: "https://tidyfirst.substack.com/p/canon-tdd",
        }
      - { title: "Vitest: test.todo", url: "https://vitest.dev/api/test#test-todo" }
    actions:
      - id: type-new-todo
        type: editor.type
        at: { mark: type-new-todo }
        target:
          {
            file: src/card.test.js,
            after: "test.todo(\"refuses a free tea below 10 stamps\");\n",
            occurrence: 1,
          }
        text: "test.todo(\"gives no stamp for a free tea\");\n"
        cadence: fast-explainer
      - id: expect-new-todo
        type: expect.preview
        at: { afterAction: type-new-todo }
        timeoutMs: 8000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-todo, value: "3" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-new-todo-name
        type: expect.preview
        at: { afterAction: expect-new-todo }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-6 }
        attribute: { name: data-name, value: "gives no stamp for a free tea" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-test-file
        type: expect.file
        at: { afterAction: expect-new-todo-name }
        path: src/card.test.js
        contains: "// test.todo(\"has a free tea due at 10 stamps\");\ntest(\"has a free tea due at 10 stamps\", () => {"
      - id: expect-new-todo-file
        type: expect.file
        at: { afterAction: expect-test-file }
        path: src/card.test.js
        contains: "test.todo(\"refuses a free tea below 10 stamps\");\ntest.todo(\"gives no stamp for a free tea\");"
      - id: board-ticks
        type: whiteboard.apply
        at: { mark: board-ticks }
        open: true
        upsertIds: [a-check-1, a-check-2, a-check-3, a-item-6]
        drawMs: 3500

  - id: mistakes
    chapter: "ရှောင်ရမယ့် အမှားတွေ"
    narration: >
      [[mark:board-mistakes]] TDD ကို စတင်ခဲ့သူ ကိုယ်တိုင်က လူတွေ မကြာခဏ မှားတတ်တဲ့ အချက်တွေကို
      စာရင်း လုပ်ထားပါတယ်။ ငါးခုကို ဆိုင်ရဲ့ ဥပမာနဲ့ ကြည့်ရအောင်။ [[mark:m1]] ပထမက ခုနက မြင်ခဲ့သလို
      test list ထဲမှာ design ရေးတာပါ။ [[mark:m2]] ဒုတိယက item အားလုံးကို test အဖြစ် တစ်ခါတည်း
      ပြောင်းရေးတာပါ။ ပထမ test ကို pass အောင် လုပ်ရင်း design ပြောင်းသွားရင်၊ ကြိုရေးထားတဲ့ test
      တွေကိုပါ ပြန်ပြင်ရပါလိမ့်မယ်။ [[mark:m3]]
      တတိယက code ထုတ်ပေးတဲ့ အဖြေကို Expected ထဲ ကူးထည့်တာပါ။ code က stamp နှစ်ခု ပြန်ပေးလို့ test
      ထဲက သုံး ကို နှစ် လို့ ပြင်လိုက်ရင်၊ test က code ကို ပြန်ကူးထားတာပဲ ဖြစ်သွားလို့ ဘာကိုမှ
      မစစ်တော့ပါဘူး။ [[mark:box-copy]] ဒီ အမှားကို AI assistant တွေနဲ့ အလုပ်လုပ်တဲ့ နောက်ပိုင်း
      lesson တွေမှာ ပြန်တွေ့ရပါမယ်။ [[mark:m4]] စတုတ္ထက pass ဖြစ်အောင် expect ကို ဖျက်ပစ်တာပါ။ ဘာမှ
      မစစ်တဲ့ test လည်း အမှန်ခြစ် ပြမှာမို့ panel က သတိမပေးနိုင်ပါဘူး။ [[mark:m5]] နောက်ဆုံးက pass
      အောင် လုပ်ရင်း refactor ကိုပါ ရောလုပ်တာပါ။ ဆယ် ကို နာမည်နဲ့ အစားထိုးတာကို green ဖြစ်မှ သီးသန့်
      လုပ်ခဲ့လို့၊ တစ်ခုခု ကျရင် ဘယ် ပြောင်းလဲမှုကြောင့်လဲ ချက်ချင်း သိနိုင်ပါတယ်။
    sources:
      - {
          title: "Kent Beck: Canon TDD, the named mistakes (facts C04)",
          url: "https://tidyfirst.substack.com/p/canon-tdd",
        }
      - {
          title: "Martin Fowler: Test Driven Development (facts C01)",
          url: "https://martinfowler.com/bliki/TestDrivenDevelopment.html",
        }
    actions:
