      # base.css: kit sections A, B, B2, C and D; section E pins the demos'
      # look and positions (the absolutely positioned cups and dropdowns, the
      # positioned .leaf-card and .trap wrappers, and copy B's positioned bar
      # and raised banner). No other z-index, opacity or isolation anywhere.
      base.css: |
        /*
          base.css: pinned, never typed during a lesson.
          The shop's palette and the page "furniture", so the CSS a lesson types can
          focus on one idea. Each lesson keeps only the sections it needs and drops
          any declaration that its own demo types or relies on being absent
          (COURSE-KIT.md, "Deriving a lesson workspace"). B2 travels with B (every
          lesson that keeps B keeps B2, except lesson 2, which types the reset).
          Section E holds the few lesson-specific rules a start state pins.
          Lesson 23 keeps A, B, B2, C and D; section E gives the overlap demos their
          look and positions. No z-index, opacity or isolation is pinned anywhere
          except the second dropdown copy's banner (the opacity trap needs it).
          Keep it free of the url, image-set and @-import functions (they switch on
          Vite's postcss step); images come from <img> or the pinned images.css.
        */

        /* == A. palette == */
        :root {
          color-scheme: light;
          --tea-dark: #3b2314;
          --tea: #8b5a2b;
          --tea-light: #c9a27e;
          --cream: #fff8ec;
          --paper: #fdf3e1;
          --leaf: #2f6b3a;
          --gold: #c9a227;
          --chili: #b23a2b;
          --ink: #2b1d14;
          --muted: #6b5a4c;
          --line: #e6d5bf;
          --radius: 12px;
        }

        /* == B. page == */
        body {
          margin: 0;
          font-family: "Noto Sans Myanmar", "Myanmar Sangam MN", "Myanmar MN", "Myanmar Text", "Padauk",
            system-ui, sans-serif;
          font-size: 16px;
          line-height: 1.8;
          color: var(--ink);
          background: var(--paper);
        }

        .page {
          padding: 0 16px 24px;
        }

        h1,
        h2,
        h3 {
          margin: 0 0 8px;
          line-height: 1.5;
        }

        h1 {
          font-size: 24px;
        }

        h2 {
          font-size: 20px;
        }

        h3 {
          font-size: 17px;
        }

        a {
          color: var(--tea);
        }

        /* Status lines that only expect.preview reads (kit.js data-report, data-say). */
        .visually-hidden {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip-path: inset(50%);
          white-space: nowrap;
        }

        /* == B2. reset (lesson 2 teaches it; every later lesson keeps it) == */
        *,
        *::before,
        *::after {
          box-sizing: border-box;
        }

        /* == C. furniture == */
        .site-header {
          padding: 16px;
          background: var(--tea-dark);
          color: var(--cream);
        }

        .site-header a {
          color: var(--cream);
        }

        .logo {
          display: block;
        }

        .tagline {
          margin: 0;
          color: var(--tea-light);
          font-size: 14px;
        }

        .nav ul {
          margin: 8px 0 0;
          padding: 0;
          list-style: none;
        }

        .hero {
          margin: 16px 0;
          padding: 16px;
          background: var(--cream);
          border-radius: var(--radius);
        }

        .menu {
          margin: 0;
          padding: 0;
          list-style: none;
        }

        .menu-card {
          margin: 0 0 12px;
          padding: 12px 16px;
          background: #fff;
          border: 1px solid var(--line);
          border-radius: var(--radius);
        }

        .menu-card .name,
        .menu-card .desc {
          margin: 0;
        }

        .menu-card .desc {
          color: var(--muted);
          font-size: 14px;
        }

        .price {
          font-weight: 700;
          color: var(--tea);
        }

        .badge {
          padding: 0 8px;
          border-radius: 999px;
          background: var(--leaf);
          color: #fff;
          font-size: 13px;
        }

        .sold-out {
          opacity: 0.6;
        }

        .order-link,
        .order-btn {
          display: inline-block;
          padding: 6px 16px;
          border: 0;
          border-radius: 999px;
          background: var(--tea);
          color: #fff;
          font: inherit;
          text-decoration: none;
        }

        .order-form label {
          display: block;
          margin-top: 8px;
        }

        .order-form input[type="text"],
        .order-form input[type="tel"],
        .order-form input[type="number"] {
          box-sizing: border-box;
          width: 100%;
          padding: 6px 10px;
          border: 1px solid var(--line);
          border-radius: 8px;
          background: #fff;
          font: inherit;
        }

        .order-btn {
          margin-top: 12px;
        }

        .gallery figure {
          margin: 0 0 12px;
        }

        .gallery img {
          display: block;
          max-width: 100%;
          height: auto;
          border-radius: var(--radius);
        }

        figcaption {
          color: var(--muted);
          font-size: 14px;
        }

        .hours-list {
          margin: 0;
          padding-left: 20px;
        }

        .site-footer {
          margin-top: 24px;
          padding: 16px;
          background: var(--tea-dark);
          color: var(--cream);
          font-size: 14px;
        }

        .site-footer a {
          color: var(--cream);
        }

        /* == D. helpers == */
        /* .demo shows a box's edges without changing layout (outline takes no space). */
        .demo {
          outline: 1px dashed var(--muted);
        }

        /* .stage is a fixed playground for overlap and position demos. */
        .stage {
          position: relative;
          min-height: 160px;
          margin: 16px 0;
          padding: 12px;
          background: #fff;
          border: 1px solid var(--line);
          border-radius: var(--radius);
        }

        /* == E. lesson rules == */
        /* Lesson 23: the overlap demos. Every z-index the lesson talks about is typed,
           except the second copy's banner below. */

        /* Two round cups, both absolutely positioned inside the stage; they overlap. */
        .cup {
          position: absolute;
          top: 16px;
          width: 120px;
          height: 120px;
          display: grid;
          place-items: center;
          border: 3px solid #fff;
          border-radius: 50%;
          color: #fff;
          font-weight: 700;
        }

        .cup-a {
          left: 40px;
          background: var(--tea);
        }

        .cup-b {
          left: 130px;
          background: var(--tea-dark);
        }

        /* A static strip across the cups (it stays in normal flow). */
        .cups-stage .note {
          width: 300px;
          margin: 50px 0 0 4px;
          padding: 4px 16px;
          background: var(--gold);
          color: var(--ink);
          font-weight: 700;
          text-align: center;
        }

        /* Three small cards in a flex row; negative margins make them overlap. */
        .overlap-row {
          display: flex;
          margin: 16px 0;
          padding: 0;
          list-style: none;
        }

        .mini-card {
          width: 140px;
          height: 88px;
          padding: 10px 12px;
          background: #fff;
          border: 2px solid var(--line);
          border-radius: var(--radius);
          box-shadow: 0 2px 8px rgb(0 0 0 / 0.15);
        }

        .mini-card + .mini-card {
          margin-inline-start: -40px;
        }

        .overlap-row .featured {
          background: var(--cream);
          border-color: var(--gold);
        }

        /* A white card with a green leaf; the card is the leaf's containing block. */
        .leaf-card {
          position: relative;
          margin: 16px 0;
          padding: 16px 20px;
          background: #fff;
          border: 1px solid var(--line);
          border-radius: var(--radius);
        }

        .leaf {
          display: block;
          top: 6px;
          left: 6px;
          width: 48px;
          height: 48px;
          border-radius: 0 70% 0 70%;
          background: #8fd19e;
        }

        .leaf-card h3 {
          font-size: 20px;
        }

        .leaf-card p {
          margin: 0;
          color: var(--muted);
        }

        /* Two copies of a menu bar with a dropdown that hangs over a banner. The
           dropdown is measured from .trap, so it sits in the same place whether or
           not its bar is positioned. */
        .trap-label {
          margin-top: 16px;
          color: var(--muted);
          font-size: 15px;
        }

        .trap {
          position: relative;
        }

        .bar {
          padding: 8px 16px;
          background: var(--tea-dark);
          color: var(--cream);
          border-radius: var(--radius);
        }

        .dropdown {
          position: absolute;
          top: 44px;
          left: 16px;
          width: 150px;
          margin: 0;
          padding: 4px 0;
          list-style: none;
          background: #fff;
          color: var(--ink);
          border: 1px solid var(--line);
          border-radius: 8px;
          box-shadow: 0 4px 12px rgb(0 0 0 / 0.25);
        }

        .dropdown li {
          padding: 2px 12px;
        }

        .banner {
          min-height: 120px;
          margin: 8px 0 0;
          padding: 16px;
          background: var(--chili);
          color: #fff;
          font-weight: 700;
          text-align: right;
          border-radius: var(--radius);
        }

        /* Copy B is ready for the opacity trap: a positioned bar with no z-index,
           and a raised banner. */
        .trap-b .bar {
          position: relative;
        }

        .trap-b .banner {
          position: relative;
          z-index: 2;
        }
      styles.css: ""

