# CSS course (Burmese), lesson 23 of 43: z-index and stacking contexts.
#
# Narration is an ENGLISH DRAFT for the Burmese writer (DESIGN.md next to this
# file is the span-by-span brief). Every [[mark:…]] sits where its action
# begins, at a sentence end; each span carries one piece of meaning.
# Everything the learner sees (title, chapters, whiteboard labels, UI strings)
# is Burmese already.
#
# Shape: board (recall lesson 22's negative margin; X, Y and the Z axis as
# stacked sheets; z-index orders, never moves) → code tour (cups stage with a
# gold strip, an overlapping flex row, a leaf card, two dropdown-trap copies;
# empty styles.css) → preview: coffee covers tea (later in the HTML on top)
# → .cup-a z-index 1 (tea in front; integers, auto) → the strip is under the
# cups although later (positioned paints over ordinary) → .note z-index 5
# (nothing) → position: relative (in front) → flex row: .featured z-index 1
# with no position lifts (flex/grid exception) → leaf: absolute (covers the
# heading) → z-index -1 (vanishes behind the card's background) → .leaf-card
# isolation: isolate (between background and text; the context is the floor)
# → board (contexts as folders; html root; 1.999 vs 2.2) → trap A: bar
# relative z 1 (no change) → banner relative z 2 (dropdown hidden) →
# .dropdown z 999 (still hidden) → bar z 3 (back on top) → trap B: no folder,
# 999 on top → bar opacity 0.97 (hidden again) → board (what creates a
# context; auto vs 0; compositor layers) → board (painting order) → board
# (top layer; z-index tokens) → board (pointer-events: none; keyboard; inert)
# → recap, quiz, hand-off to overflow (lesson 24).
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set(; no postcss config; no reload.
# Rules are appended at the END of styles.css; the strip's position and the
# bar's z-index 3 are later declarations inserted inside their rules.
# Keystroke-typed values have no misleading valid prefix: "z-index: 1/2/3/5"
# are single digits, "-1" passes only through "-" (invalid), "999" passes
# through 9 and 99 (copy A stays hidden either way; copy B's dropdown comes
# in front at the first "9" — the page is only ~860 px tall, so copy B is in
# view during trap-a and after-999 says so), "relative", "absolute" and
# "isolate" are invalid until complete.
# The opacity rule is line-by-line: a keystroke "0.97" would pass through
# "0" (opacity 0, the whole bar would flash away).
#
# Measured in headless Chrome at 432 × 720 (probe/stages.ts, hit tests with
# elementFromPoint at each overlap): start → coffee over tea, cups over the
# strip, third card over the featured one, dropdown A over its banner,
# dropdown B under its banner; cup-a z 1 → tea on top; note z 5 → no change;
# + position relative → strip on top; featured z 1 → featured on top; leaf
# absolute → over the heading; leaf z -1 → hidden; isolate → between the
# card's background and the heading text; bar A z 1 → no change; banner A
# z 2 → dropdown A hidden; dropdown z 999 → A still hidden, B on top; bar A
# z 3 → A on top; bar B opacity 0.97 → B hidden.
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
