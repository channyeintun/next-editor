scenes:
  - id: recall
    chapter: Range နဲ့ iterator
    narration: >-
      ပြီးခဲ့တဲ့ lesson မှာ type parameter ပါတဲ့ generic function တွေနဲ့ ပို့ခရော ကီလိုကိုပါ function
      တစ်ခုတည်းနဲ့ ပေါင်းခဲ့ပါတယ်။ ဒီနေ့မှာတော့ range loop ကို ပြန်ကြည့်ပါမယ်။ အခုထိ range ကို slice၊
      map၊ string နဲ့ ဂဏန်း တစ်ခုပေါ်မှာ သုံးခဲ့ပါတယ်။ Go မှာ range က function တစ်မျိုးကိုလည်း
      လက်ခံပါတယ်။ အဲဒီ function ကို iterator လို့ ခေါ်ပြီး၊ တန်ဖိုးတွေကို တစ်ခုချင်း ထုတ်ပေးတဲ့ function
      ဖြစ်ပါတယ်။ [[mark:board-route]] ဥပမာ ကားဂိတ်မှာ ကားလမ်းကြောင်း တစ်ခုကို မြို့နာမည်တွေ
      ပုဒ်ကလေးနဲ့ ခြားပြီး စာကြောင်း တစ်ကြောင်းတည်း ရေးထားတယ် ဆိုပါစို့။ [[mark:draw-split]] strings
      package ထဲက Split က အဲဒီ စာကြောင်းကို တစ်ခါတည်း အကုန်ခွဲပြီး slice အပြည့် တစ်ခုကို လုပ်ပေးပါတယ်။
      [[mark:draw-seq]] SplitSeq ကတော့ slice မလုပ်ပါဘူး။ loop ရဲ့ အခေါက်တိုင်းမှာ မြို့ တစ်မြို့စီကို
      ခွဲပြီး လွှဲပေးတဲ့ iterator ကို ပြန်ပေးတာပါ။
    sources:
      - {
          title: "The Go Blog — Range Over Function Types",
          url: "https://go.dev/blog/range-functions",
        }
      - { title: "strings package — SplitSeq", url: "https://pkg.go.dev/strings#SplitSeq" }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }
      - {
          id: board-route,
          type: whiteboard.apply,
          at: { mark: board-route },
          open: true,
          clear: true,
          upsertIds: [r-title, r-route-box, r-route],
        }
      - {
          id: draw-split,
          type: whiteboard.apply,
          at: { mark: draw-split },
          upsertIds: [r-split, r-split-n],
          drawMs: 1500,
        }
      - {
          id: draw-seq,
          type: whiteboard.apply,
          at: { mark: draw-seq },
          upsertIds: [r-seq-box, r-seq, r-seq-n, r-seq-r],
          drawMs: 2600,
        }

  - id: route
    narration: >-
      [[mark:close-route]] ဒါဆို ရေးကြည့်ရအောင်။ [[mark:type-strings]] အရင်ဆုံး import ထဲမှာ strings
      package ကို ထည့်ပါမယ်။ [[mark:type-loop]] main ထဲက range loop က SplitSeq ပေးတဲ့ မြို့ တစ်မြို့ချင်းကို
      ယူပြီး၊ နောက်မှာ space တစ်ခု ခံပြီး တစ်ကြောင်းတည်းမှာ print ထုတ်ပါတယ်။ slice ကို လျှောက်တုန်းကလို
      index မပါဘဲ၊ city ဆိုတဲ့ variable တစ်ခုတည်းထဲကို အခေါက်တိုင်း မြို့နာမည် string တစ်ခု ဝင်လာပါတယ်။ loop ပြီးတော့ စာကြောင်းကို
      အဆုံးသတ်ဖို့ line အသစ် တစ်ခု ထုတ်ပါတယ်။ [[mark:sel-sep]] ခွဲမယ့် နေရာကို ပြောတဲ့ ဒီ စာက ပုဒ်ကလေးပါ။
      byte သုံးခု ပါတဲ့ မြန်မာ သင်္ကေတ ဖြစ်ပေမဲ့၊ ခွဲမယ့် နေရာကို string အဖြစ် ပေးရလို့ ပြဿနာ မရှိပါဘူး။ [[mark:run-1]] ကဲ၊
      run လိုက်ရအောင်။
    sources:
      - { title: "strings package — SplitSeq", url: "https://pkg.go.dev/strings#SplitSeq" }
    actions:
      - {
          id: close-route,
          type: whiteboard.apply,
          at: { mark: close-route },
          open: false,
          upsertIds: [],
        }
      - id: type-strings
        type: editor.type
        at: { mark: type-strings }
        target: { file: main.go, after: "\t\"fmt\"\n", occurrence: 1 }
        text: "\t\"strings\"\n"
      - id: type-loop
        type: editor.type
        at: { mark: type-loop }
        target: { file: main.go, after: "func main() {\n", occurrence: 1 }
        text: "\tfor city := range strings.SplitSeq(\"ရန်ကုန်၊ပဲခူး၊မန္တလေး\", \"၊\") {\n\t\tfmt.Print(city, \" \")\n\t}\n\tfmt.Println()\n"
        cadence: line-by-line
      - id: sel-sep
        type: editor.select
        at: { mark: sel-sep }
        target: { file: main.go, text: '"၊"', occurrence: 1 }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "ရန်ကုန် ပဲခူး မန္တလေး",
          timeoutMs: 8000,
        }
      - {
          id: expect-file-seq,
          type: expect.file,
          at: { afterAction: run-1 },
          path: main.go,
          contains: "for city := range strings.SplitSeq(",
        }

  - id: ready-made
    narration: >-
      [[mark:point-route]] output မှာ ရန်ကုန်၊ ပဲခူး၊ မန္တလေး ဆိုပြီး မြို့ သုံးမြို့ကို space ခြားပြီး
      တွေ့ရပါတယ်။ slice ကို လျှောက်တဲ့ range loop လိုပဲ ရေးထားပေမဲ့၊ ဒီမှာ range လုပ်နေတာက slice မဟုတ်ဘဲ
      SplitSeq က ပြန်ပေးတဲ့ iterator ပါ။ [[mark:board-ready]] standard library မှာ ဒီလို iterator
      ပြန်ပေးတဲ့ function တွေ အများကြီး ရှိပါတယ်။ [[mark:draw-ready]] strings package မှာ စာကြောင်းတွေကို
      တစ်ကြောင်းချင်း ပေးတဲ့ Lines ရှိပြီး၊ slices package မှာ slice ထဲက တန်ဖိုးတွေကို တစ်ခုချင်း ပေးတဲ့
      Values ရှိပါတယ်။ [[mark:draw-recipe]] lesson ဆယ့်သုံးမှာ map ကို အစဉ်လိုက် ထုတ်ဖို့ သုံးခဲ့တဲ့ နည်းကိုလည်း
      အခု နားလည်လို့ ရပါပြီ။ maps package ရဲ့ Keys က map ထဲက key တွေကို တစ်ခုချင်း ထုတ်ပေးတဲ့ iterator ပါ။
      slices package ရဲ့ Sorted က အဲဒီ key တွေကို slice တစ်ခုထဲ စုပြီး sort လုပ်ပေးပါတယ်။ sort မလိုဘဲ
      စုရုံပဲ လိုရင်တော့ Collect ကို သုံးပါတယ်။
    sources:
