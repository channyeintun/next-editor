  - id: recap
    chapter: ပြန်ချုပ်ရရင်
    narration: >-
      [[mark:close-quiz]] ဒါဆို ပြန်ချုပ်ရရင်၊ range loop က slice နဲ့ map တင် မကဘဲ iterator function
      တွေကိုလည်း လျှောက်လို့ ရပါတယ်။ [[mark:recap-seq]] standard library ရဲ့ iterator တွေက တန်ဖိုးတွေကို
      slice မလုပ်ဘဲ တစ်ခုချင်း ပေးပြီး၊ slice လိုရင်တော့ Collect ဒါမှမဟုတ် Sorted နဲ့ စုလို့ ရပါတယ်။
      [[mark:recap-own]] ကိုယ်ပိုင် iterator ကတော့ yield ကို ခေါ်ပြီး
      တန်ဖိုး တစ်ခုချင်း လွှဲပေးပါတယ်။ [[mark:recap-stop]] yield က false ပြန်ပေးရင် loop က ရပ်ချင်ပြီ
      ဆိုတဲ့ အဓိပ္ပာယ် ဖြစ်လို့ iterator က ချက်ချင်း ရပ်ရပါမယ်။ နောက် lesson မှာတော့ course ရဲ့ အပိုင်း အသစ်ကို စပြီး၊
      ညကား ထွက်ချိန်နဲ့ ရောက်ချိန်ကို မြန်မာစံတော်ချိန်နဲ့ တွက်တဲ့ အချိန် အကြောင်းကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "The Go Blog — Range Over Function Types",
          url: "https://go.dev/blog/range-functions",
        }
    actions:
      - {
          id: close-quiz,
          type: whiteboard.apply,
          at: { mark: close-quiz },
          open: false,
          upsertIds: [],
        }
      - id: recap-seq
        type: editor.select
        at: { mark: recap-seq }
        target: { file: main.go, text: "strings.SplitSeq", occurrence: 1 }
      - id: recap-own
        type: editor.select
        at: { mark: recap-own }
        target: { file: main.go, text: "func(yield func(Parcel) bool)", occurrence: 1 }
      - id: recap-stop
        type: editor.select
        at: { mark: recap-stop }
        target: { file: main.go, text: "if !yield(p) {", occurrence: 1 }

checks:
