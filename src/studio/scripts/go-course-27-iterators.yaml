  - id: stop
    chapter: break နဲ့ yield
    narration: >-
      [[mark:board-break]] ခုနက run မှာ iterator က ပါဆယ် စာရင်း အဆုံးထိ ရောက်သွားတော့ သူ့ဘာသာ
      return လုပ်ပြီး၊ range loop လည်း အဲဒီမှာ ပြီးသွားပါတယ်။ ဒါဆို loop က အလယ်မှာ break နဲ့
      ထွက်သွားရင် ဘာဖြစ်မလဲ။ [[mark:draw-hand]]
      ကောင်တာက ဝန်ထမ်းက rider လှလှ ကို ပါဆယ်တွေ တစ်ခုချင်း လှမ်းပေးတယ် ဆိုပါစို့။ တစ်ခု ပေးပြီးတိုင်း
      လှလှ ကို မော့ကြည့်ပြီး နောက်တစ်ခု ယူဦးမလား မေးပါတယ်။ [[mark:draw-yes]] ယူမယ် ဆိုရင် နောက်တစ်ခု
      ဆက်ပေးပါတယ်။ yield ကလည်း ဒီလိုပါပဲ၊ loop က ဆက်လိုချင်သေးရင် yield က true ကို ပြန်ပေးပါတယ်။ [[mark:draw-no]]
      လှလှ က ခေါင်းခါလိုက်ရင်တော့ ဝန်ထမ်းက ပါဆယ် ဆက်မပေးတော့ပါဘူး။ loop က break နဲ့ ထွက်သွားရင် yield
      က false ကို ပြန်ပေးပြီး၊ iterator က ချက်ချင်း ရပ်ရပါမယ်။
    sources:
      - {
          title: "The Go Blog — Range Over Function Types",
          url: "https://go.dev/blog/range-functions",
        }
    actions:
      - { id: collapse-2, type: runtime.collapseDock, at: { mark: board-break } }
      - {
          id: board-break,
          type: whiteboard.apply,
          at: { afterAction: collapse-2 },
          open: true,
          clear: true,
          upsertIds: [b-title],
        }
      - {
          id: draw-hand,
          type: whiteboard.apply,
          at: { mark: draw-hand },
          upsertIds: [b-clerk-box, b-clerk, b-clerk-n, b-arrow, b-rider-box, b-rider, b-rider-n],
          drawMs: 3000,
        }
      - {
          id: draw-yes,
          type: whiteboard.apply,
          at: { mark: draw-yes },
          upsertIds: [b-yes-box, b-yes],
          drawMs: 1400,
        }
      - {
          id: draw-no,
          type: whiteboard.apply,
          at: { mark: draw-no },
          upsertIds: [b-no-box, b-no],
          drawMs: 1400,
        }

  - id: trace
    narration: >-
      [[mark:close-break]] code ထဲမှာ ပြန်ကြည့်ရအောင်။ [[mark:sel-not-yield]] iterator ထဲက ဒီ line က
      yield ကို ခေါ်ပြီး အဖြေကို စစ်ပါတယ်။ false ရရင် return နဲ့ ချက်ချင်း ထွက်သွားပါတယ်။ [[mark:type-trace]]
      ဒါကို မြင်ရအောင် yield ကို မခေါ်ခင် ပါဆယ် code ကို print ထုတ်တဲ့ line တစ်ကြောင်း iterator ထဲမှာ
      ထည့်ပါမယ်။ [[mark:type-break]] main ရဲ့ loop ထဲမှာတော့ ငါးကီလိုထက် လေးတဲ့ ပါဆယ် တွေ့တာနဲ့ break နဲ့
      ထွက်ပါမယ်။ [[mark:run-3]] ကဲ၊ run လိုက်ရအောင်။
    sources:
      - {
          title: "The Go Programming Language Specification — Break statements",
          url: "https://go.dev/ref/spec#Break_statements",
        }
      - { title: "iter package", url: "https://pkg.go.dev/iter" }
    actions:
      - {
          id: close-break,
          type: whiteboard.apply,
          at: { mark: close-break },
          open: false,
          upsertIds: [],
        }
      - id: sel-not-yield
        type: editor.select
        at: { mark: sel-not-yield }
        target: { file: main.go, text: "if !yield(p) {", occurrence: 1 }
      - id: type-trace
        type: editor.type
        at: { mark: type-trace }
        target: { file: main.go, after: "\t\t\tif p.WeightKg > kg {\n", occurrence: 1 }
