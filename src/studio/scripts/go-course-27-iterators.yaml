        cadence: line-by-line
      - id: type-break
        type: editor.type
        at: { mark: type-break }
        target: { file: main.go, after: "\t\tfmt.Println(p.Code)\n", occurrence: 1 }
        text: "\t\tif p.WeightKg > 5 {\n\t\t\tbreak\n\t\t}\n"
        cadence: line-by-line
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "yield NPT-0001",
          timeoutMs: 8000,
        }
      - {
          id: expect-file-break,
          type: expect.file,
          at: { afterAction: run-3 },
          path: main.go,
          contains: "\t\tif p.WeightKg > 5 {\n\t\t\tbreak\n\t\t}\n",
        }

