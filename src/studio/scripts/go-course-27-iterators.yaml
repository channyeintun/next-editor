# Go course, lesson 27: iterators (Burmese).
#
# Start state: main.go with `package main`, `import (\n\t"fmt"\n)` (strings and iter arrive as
# single inserted lines in sorted position) and an empty `func main`; parcel.go pinned (the
# canonical Parcel and cityNames, COURSE-KIT §3.4).
# Edits, all insert-only:
#   1. "strings" and a range loop over strings.SplitSeq on a bus route split at the Burmese
#      comma -> run-1: ရန်ကုန် ပဲခူး မန္တလေး (one line);
#   2. "iter", the canonical heavierThan iterator without its print line, three parcels
#      (2.5, 6, 8 kg) and a range over heavierThan(parcels, 2) -> run-2 adds MDY-0001 /
#      NPT-0001 / YGN-0001;
#   3. a `fmt.Println("yield", p.Code)` inside the iterator and a `break` after the first parcel
#      over 5 kg -> run-3: yield MDY-0001 / MDY-0001 / yield NPT-0001 / NPT-0001 (the third
#      parcel is never yielded).
# Boards: (R) Split builds the whole slice, SplitSeq hands one city a round; (I) ready-made
# iterators and lesson 13's slices.Sorted(maps.Keys(m)) explained; (B) the counter clerk hands
# parcels to rider လှလှ one at a time: yield true = one more, break = false, stop; (Q) quiz.
# Fixtures: bun ~/Documents/go-course-work/tools/sim-go.ts <this yaml> --write
