      ပေးတာ မဟုတ်ဘဲ၊ တစ်ခု ပေးလိုက်၊ loop က အလုပ်လုပ်လိုက်၊ ပြီးမှ နောက်တစ်ခု ရှာလိုက် ဆိုပြီး
