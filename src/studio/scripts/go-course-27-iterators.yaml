    narration: >-
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ board ပေါ်က iterator က yield ပြန်ပေးတဲ့ အဖြေကို မစစ်ဘဲ
      ပါဆယ်တိုင်းအတွက် yield ကို ခေါ်ပါတယ်။ [[mark:quiz-line]] loop က ပထမ ပါဆယ်ပြီးတာနဲ့ break လုပ်ရင်
      ဘာဖြစ်မလဲ။ loop က ဆက်သွားမလား၊ ဒါမှမဟုတ် panic ဖြစ်ပြီး program ရပ်သွားမလား။ lesson ကို pause
      လုပ်ပြီး စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] အဖြေကတော့ ခ၊ panic ဖြစ်ပြီး ရပ်သွားတာပါ။
      ဘာကြောင့်လဲဆိုတော့ loop က break နဲ့ ထွက်ပြီးသားမှာ yield ကို ထပ်ခေါ်ရင်၊ Go က ဒါကို bug လို့
      သတ်မှတ်ပြီး run နေတုန်း ရပ်လိုက်လို့ပါ။ ဒါကြောင့် yield က false ပြန်ပေးရင် အမြဲ return လုပ်ရပါမယ်။
