  - id: own
    chapter: ကိုယ်ပိုင် iterator
    narration: >-
      [[mark:close-ready]] ဒါဆို ကိုယ်ပိုင် iterator တစ်ခုကို ရေးကြည့်ရအောင်။ ပါဆယ် စာရင်းထဲက သတ်မှတ်ထားတဲ့
      ကီလိုထက် လေးတဲ့ ပါဆယ်တွေကို တစ်ခုချင်း ပေးမယ့် iterator ပါ။ slice အသစ် တစ်ခု ပြန်ပေးတဲ့
      function လည်း ရေးလို့ ရပေမဲ့၊ iterator ဆိုရင် loop က တောင်းမှ တစ်ခုချင်း ရှာပေးလို့ စာရင်း အပြည့်ကို
      ကြိုမလုပ်ရပါဘူး။ ခေါ်သုံးတဲ့သူ ဘက်ကလည်း ပါဆယ်တွေကို ဘယ်လို ရှာလဲ ဆိုတာ သိစရာ မလိုဘဲ range နဲ့
      လျှောက်ရုံပါပဲ။ [[mark:type-iter]] import ထဲမှာ iter
      package ကို ထည့်ပါမယ်။ [[mark:type-heavier]] ပြီးတော့ import ရဲ့ အောက်မှာ function ကို ရေးပါမယ်။ ဒီ
      function က ပါဆယ် slice နဲ့ ကီလို ကို ယူပြီး၊ iter package ရဲ့ Seq ကို ပြန်ပေးပါတယ်။ Seq က ပြီးခဲ့တဲ့
      lesson က generics နဲ့ ရေးထားတဲ့ type ပါ။ လေးထောင့်ကွင်းထဲက Parcel က T နေရာလွတ်ကို ဖြည့်ပေးပြီး၊ ဒီ
      iterator က Parcel တွေကို ပေးမယ်လို့ ပြောတာပါ။
      [[mark:sel-yield]] ပြန်ပေးတဲ့ အရာက function တစ်ခုပါ။ သူက yield ဆိုတဲ့ function ကို parameter အဖြစ်
      လက်ခံပါတယ်။ yield ဆိုတာ range loop ဆီကို တန်ဖိုး တစ်ခု လွှဲပေးတဲ့ function ပါ။ [[mark:sel-check]]
      အထဲမှာတော့ loop က ပါဆယ် တစ်ခုချင်းကို စစ်ပြီး၊ လေးတဲ့ ပါဆယ် တွေ့တိုင်း yield ကို ခေါ်ပြီး loop ဆီ
      လွှဲပေးပါတယ်။ yield က true ဒါမှမဟုတ် false ပြန်ပေးတာကိုတော့ နောက်မှ ကြည့်ပါမယ်။
    sources:
      - { title: "iter package", url: "https://pkg.go.dev/iter" }
      - {
          title: "The Go Blog — Range Over Function Types",
          url: "https://go.dev/blog/range-functions",
        }
    actions:
      - {
          id: close-ready,
          type: whiteboard.apply,
          at: { mark: close-ready },
          open: false,
          upsertIds: [],
        }
      - id: type-iter
        type: editor.type
        at: { mark: type-iter }
        target: { file: main.go, after: "\t\"fmt\"\n", occurrence: 1 }
        text: "\t\"iter\"\n"
      - id: type-heavier
        type: editor.type
        at: { mark: type-heavier }
        target: { file: main.go, after: "\t\"strings\"\n)\n", occurrence: 1 }
        text: "\n// heavierThan yields the parcels heavier than kg, one at a time.\nfunc heavierThan(parcels []Parcel, kg float64) iter.Seq[Parcel] {\n\treturn func(yield func(Parcel) bool) {\n\t\tfor _, p := range parcels {\n\t\t\tif p.WeightKg > kg {\n\t\t\t\tif !yield(p) {\n\t\t\t\t\treturn\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t}\n}\n"
        cadence: line-by-line
      - id: sel-yield
        type: editor.select
        at: { mark: sel-yield }
        target: { file: main.go, text: "func(yield func(Parcel) bool)", occurrence: 1 }
      - id: sel-check
        type: editor.select
        at: { mark: sel-check }
        target: { file: main.go, text: "if p.WeightKg > kg {", occurrence: 1 }

  - id: use
    narration: >-
      [[mark:type-use]] main ထဲမှာ နှစ်ကီလိုခွဲ၊ ခြောက်ကီလို၊ ရှစ်ကီလို ရှိတဲ့ ပါဆယ် သုံးခုကို ထည့်ပါမယ်။
      ပြီးတော့ နှစ်ကီလိုထက် လေးတဲ့ ပါဆယ်တွေကို range နဲ့ လျှောက်ပြီး ပါဆယ် code ကို print ထုတ်ပါမယ်။ slice
      ကို လျှောက်တာနဲ့ ရေးပုံ အတူတူပါပဲ၊ ကွာတာက range ရဲ့ နောက်မှာ ကိုယ်ပိုင် function ကို ခေါ်ထားတာပါ။
      [[mark:run-2]] ကဲ၊ run လိုက်ရအောင်။
    sources:
      - {
          title: "The Go Programming Language Specification — For statements with range clause",
          url: "https://go.dev/ref/spec#For_range",
        }
    actions:
      - id: type-use
        type: editor.type
        at: { mark: type-use }
        target: { file: main.go, after: "\tfmt.Println()\n", occurrence: 1 }
        text: "\tparcels := []Parcel{\n\t\t{Code: \"MDY-0001\", To: \"MDY\", WeightKg: 2.5},\n\t\t{Code: \"NPT-0001\", To: \"NPT\", WeightKg: 6},\n\t\t{Code: \"YGN-0001\", To: \"YGN\", WeightKg: 8},\n\t}\n\tfor p := range heavierThan(parcels, 2) {\n\t\tfmt.Println(p.Code)\n\t}\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "YGN-0001",
          timeoutMs: 8000,
        }
      - {
          id: expect-file-iter,
          type: expect.file,
          at: { afterAction: run-2 },
          path: main.go,
          contains: "func heavierThan(parcels []Parcel, kg float64) iter.Seq[Parcel] {",
        }

