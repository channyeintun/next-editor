      [[mark:point-y1]] ပထမဆုံး iterator က မန္တလေး ပါဆယ်ကို yield လုပ်မယ်လို့ ပြောပါတယ်။ [[mark:point-l1]]
      loop က အဲဒီ ပါဆယ်ကို print ထုတ်ပါတယ်။ နှစ်ကီလိုခွဲပဲ ရှိလို့ loop က မထွက်သေးဘဲ၊ yield က true ကို ပြန်ပေးပါတယ်။
      [[mark:point-y2]] နောက် iterator က နေပြည်တော် ပါဆယ်ကို လွှဲပေးပြီး၊ [[mark:point-l2]] loop က print
      ထုတ်ပါတယ်။ ဒီ ပါဆယ်က ခြောက်ကီလို ဖြစ်လို့ loop က break နဲ့ ထွက်သွားပါတယ်။ အဲဒီအချိန်မှာ yield က
      false ပြန်ပေးလို့ iterator က return လုပ်လိုက်ပါတယ်။ ဒါကြောင့် ရန်ကုန် ပါဆယ်ကို yield လုပ်တဲ့
      စာကြောင်း မပါတော့ပါဘူး။ တတိယ ပါဆယ်ကို လုံးဝ မလွှဲပေးခဲ့တာပါ။ [[mark:trace-order]] output မှာ yield စာကြောင်းနဲ့ loop
