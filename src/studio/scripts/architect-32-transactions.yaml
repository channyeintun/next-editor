        </style>
        <div class="stage">
          <div class="title">Isolation level ကို စာချုပ်လို ဖတ်ပါ</div>
          <div class="row" style="top: 34vh"><span class="num">1</span><span class="term wide red">Read committed</span>commit မလုပ်ရသေးတာကို မမြင်ရအောင်ပဲ ကာ</div>
          <div class="row" style="top: 50vh"><span class="num">2</span><span class="term wide orange">Snapshot isolation</span>အချိန်တစ်ခုရဲ့ ပုံကို မြင်ရ၊ write skew မကာ</div>
