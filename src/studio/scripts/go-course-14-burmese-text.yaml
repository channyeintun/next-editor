# Go course, lesson 14: Burmese text, bytes and runes (Burmese).
#
# Start state: main.go with `package main`, an import block holding only "fmt" (the block takes
# "unicode/utf8" later as one inserted line) and an empty `func main`.
# Edits, all insert-only:
#   1. s := "မြန်မာ" and a Println of len("Go") and len(s) -> run-1: 2 18;
#   2. the rune count in that Println, the "unicode/utf8" import line, and a range loop over "မြန်"
#      printed on one line -> run-2: 2 18 6 / 0:'မ' 3:'ြ' 6:'န' 9:'်';
#   3. s[0] with len([]rune(s)), then the first two runes as a string -> run-3 adds 225 6 / မြ.
# Boards: (B) text is stored as bytes: Unicode numbers every character, UTF-8 stores the number
# (one byte for G, three for မ, 6 x 3 = 18); (L) three levels: what you see -> runes -> bytes for
# the syllable မြန်; (C) never cut Burmese text by bytes, and even runes can cut a syllable;
# (Q) the quiz (len of ကား).
# Fixtures: bun ~/Documents/go-course-work/tools/sim-go.ts <this yaml> --write
schemaVersion: 1

