  - id: trade-offs
    chapter: Go ရဲ့ အားနည်းချက်တွေ
    narration: >-
      [[mark:board-trade]] ကောင်းတာချည်း ပြောရင် မမျှတပါဘူး၊ အားနည်းချက်တွေကိုလည်း ရိုးရိုးသားသား
      ကြည့်ရအောင်။ [[mark:draw-notfor]] ပထမ တစ်ခုက Go ဟာ နေရာတိုင်းအတွက် အကောင်းဆုံး မဟုတ်တာပါ။
      ဖုန်းထဲက program တွေ၊ web page မှာ ကိုယ် မြင်ရ၊ နှိပ်ရတဲ့ မျက်နှာစာ၊ data science နဲ့ AI လို
      အလုပ်တွေမှာတော့ တခြား ဘာသာစကားတွေကို ပိုသုံးကြပါတယ်။ [[mark:draw-err]] ဒုတိယ တစ်ခုက error
      ကိုင်တွယ်ပုံပါ။ Go မှာ function တစ်ခု အလုပ် မပြီးမြောက်ရင် အကြောင်းပြချက်ကို error ဆိုတဲ့
      တန်ဖိုး အဖြစ် ပြန်ပေးပြီး၊ ခေါ်တဲ့ဘက်က board ပေါ်ကလို ကိုယ်တိုင် စစ်ရပါတယ်။
      [[mark:draw-err-long]] ဒီလို စစ်တာ အကြိမ်ကြိမ် ပါလာလို့ ရှည်တယ်လို့ ခံစားရနိုင်ပြီး၊ Go အဖွဲ့ရဲ့
      နှစ်စဉ် survey တွေမှာ user တွေ အများဆုံး ညည်းတဲ့ အချက်လည်း ဖြစ်ပါတယ်။ ဒါပေမဲ့ ဘယ်နေရာမှာ
      မှားနိုင်လဲ ဆိုတာ code ထဲမှာ မြင်သာနေတာကတော့ Go က တမင် ရွေးခဲ့တာပါ။ [[mark:draw-few]] တတိယ
      တစ်ခုကတော့ feature နည်းတာပါ။ ဥပမာ တန်ဖိုး အမျိုးအစား မျိုးစုံအတွက် function တစ်ခုတည်း
      ရေးလို့ရတဲ့ generics ကို Go version တစ် ထွက်ပြီး ဆယ်နှစ်နီးပါး ကြာမှ ထည့်ခဲ့ပါတယ်။ feature တစ်ခု
      ထည့်တိုင်း ဘာသာစကားက ပိုရှုပ်လာလို့ သေသေချာချာ စဉ်းစားပြီးမှ ထည့်တာပါ။
    sources:
