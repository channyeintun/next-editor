    narration: >-
      [[mark:board-first]] ဒါဆို programming ကို အခုမှ စလေ့လာမယ့် သူအတွက် Go က ဘာကြောင့် ကောင်းလဲ။
      [[mark:draw-f1]] ပထမက ခုနက ပြောခဲ့သလို ဘာသာစကား သေးပြီး ရေးပုံ တစ်မျိုးတည်း ဖြစ်တာပါ။
      [[mark:draw-f2]] ဒုတိယက compiler ဆိုတဲ့ Go ရဲ့ စစ်ဆေးသူက run မလုပ်ခင်ကတည်းက code တစ်ခုလုံးကို
      စစ်ပေးတာပါ၊ နာမည်ပေးပြီး မသုံးဘဲ ထားခဲ့တဲ့ variable တစ်ခု ရှိရင်တောင် bug ဖြစ်နိုင်လို့
      လက်မခံပါဘူး။ [[mark:draw-f3]] တတိယက error message တွေက ဘယ်ဖိုင်၊ ဘယ် line မှာလဲ ဆိုတာ ပြပေးတာပါ၊
