  - id: course-map
    chapter: Course ရဲ့ လမ်းကြောင်း
    narration: >-
      [[mark:board-map]] နောက်ဆုံးအနေနဲ့ course ရဲ့ လမ်းကြောင်းကို ကြည့်ရအောင်။ ဒီ lesson က course ရဲ့ ပထမဆုံး lesson ပါ၊ နောက်မှာ အပိုင်း ခုနစ်ပိုင်း ရှိပါတယ်။ [[mark:draw-m1]] ပထမ အပိုင်း သုံးပိုင်းမှာ
      program ရေးတာ၊ ဆုံးဖြတ်တာ၊ loop၊ function၊ slice၊ map တွေနဲ့ မြန်မာစာကို မှန်မှန်ကန်ကန်
      ကိုင်တွယ်ပုံကို လေ့လာပါမယ်။ [[mark:draw-m4]] စတုတ္ထ အပိုင်းကစပြီး ရန်ကုန်က ပါဆယ်ပို့ ဝန်ဆောင်မှု
      တစ်ခုအတွက် program တစ်ခုကို တဖြည်းဖြည်း တည်ဆောက်ပြီး၊ ကိုယ်ပိုင် type၊ error၊ အချိန်နဲ့
      goroutine တွေကို အဲဒီ program နဲ့ပဲ လေ့လာပါမယ်။ နောက်ဆုံး အပိုင်းမှာတော့ ဖိုင် အများကြီး ပါတဲ့
      program တစ်ခုကို ပြီးအောင် ရေးပြီး၊ ကိုယ့် ကွန်ပျူတာပေါ်မှာ Go သုံးပုံနဲ့ အဆုံးသတ်ပါမယ်။
      [[mark:draw-how]] lesson တိုင်းမှာ ကြည့်ရုံ မဟုတ်ဘဲ pause လုပ်ပြီး code ကို ကိုယ်တိုင်
      ပြင်ရေးကြည့်ပါ၊ ပြီးရင် run ပြီး ဘာပြောင်းသွားလဲ ကြည့်ပါ။
    sources:
      - {
          title: "Tutorial: Get started with Go",
          url: "https://go.dev/doc/tutorial/getting-started",
        }
    actions:
      - {
          id: board-map,
          type: whiteboard.apply,
          at: { mark: board-map, offsetMs: -300 },
          open: true,
          clear: true,
          upsertIds: [m-title, m-0, m-today],
        }
      - {
          id: draw-m1,
          type: whiteboard.apply,
          at: { mark: draw-m1 },
          upsertIds: [m-1, m-2, m-3],
          drawMs: 2400,
        }
      - {
          id: draw-m4,
          type: whiteboard.apply,
          at: { mark: draw-m4 },
          upsertIds: [m-parcel, m-4, m-5, m-6, m-7],
          drawMs: 3000,
        }
      - {
          id: draw-how,
          type: whiteboard.apply,
          at: { mark: draw-how },
          upsertIds: [m-how, m-how1, m-how-a1, m-how2, m-how-a2, m-how3],
          drawMs: 2400,
        }

  - id: recap
    chapter: ပြန်ချုပ်ရရင်
    narration: >-
      [[mark:close-map]] ဒါဆို ပြန်ချုပ်ရရင်၊ Go ကို program ကြီးတွေ၊ programmer အများကြီးနဲ့
      ကွန်ပျူတာ အများကြီးအတွက် ရှင်းပြီး မြန်တဲ့ ဘာသာစကား ဖြစ်အောင် ဖန်တီးခဲ့တာပါ။ [[mark:recap-go]]
      ဘာသာစကား သေးတာ၊ ရေးပုံ တစ်မျိုးတည်း ဖြစ်တာ၊ ဒီ line လို တစ်ပြိုင်နက် လုပ်တာကို ဘာသာစကား
      ထဲမှာကိုက ထည့်ထားတာက သူ့ရဲ့ အဓိက ရွေးချယ်မှုတွေပါ။ နောက် lesson မှာတော့ ပထမဆုံး Go program ကို
      ကိုယ်တိုင် ရေးပြီး၊ compile နဲ့ run ကို လေ့လာသွားပါမယ်။
    sources:
      - { title: "Go FAQ", url: "https://go.dev/doc/faq" }
    actions:
      - {
          id: close-map,
          type: whiteboard.apply,
          at: { mark: close-map },
          open: false,
          upsertIds: [],
        }
      - id: recap-go
        type: editor.select
        at: { mark: recap-go }
        target: { file: main.go, text: "wg.Go(func() { deliver(r) })", occurrence: 1 }

checks:
  - { type: timing.p95Ms, max: 300 }
