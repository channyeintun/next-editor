  - id: uses
    chapter: Go ကို ဘယ်မှာ သုံးလဲ
    narration: >-
      [[mark:board-uses]] ဒါဆို ဒီနေ့ Go ကို ဘယ်မှာ သုံးနေကြလဲ။ [[mark:draw-areas]] အဓိက နယ်ပယ် လေးခု
      ရှိပါတယ်။ cloud နဲ့ network service တွေ၊ စာ ရိုက်ပြီး ခိုင်းရတဲ့ command line tool တွေ၊ web ရဲ့
      နောက်ကွယ်က backend တွေ၊ ပြီးတော့ system တွေ ရပ်မသွားအောင် ထိန်းတဲ့ DevOps နဲ့ SRE အလုပ်တွေပါ။
      [[mark:draw-projects]] cloud ပေါ်မှာ program တွေ run ဖို့ အများကြီး သုံးကြတဲ့ Docker နဲ့
      Kubernetes ကိုလည်း Go နဲ့ ရေးထားပါတယ်။ [[mark:draw-companies]] Google ကိုယ်တိုင် Go ကို
      အများကြီး သုံးပြီး၊ Cloudflare၊ Dropbox၊ Netflix၊ PayPal၊ Uber လို ကုမ္ပဏီတွေကလည်း Go ကို ဘယ်လို
      သုံးလဲ ဆိုတဲ့ case study တွေကို ထုတ်ပြထားပါတယ်။ ဒါကြောင့် Go တတ်ရင် backend၊ cloud၊ DevOps လို
