# Go course, lesson 01: why Go? (Burmese; the course's first lesson, mostly whiteboard).
#
# Start state: a finished two-file program is pinned (main.go sends three riders out at once with
# a wait group; delivery.go holds the riders and deliver). Nothing is typed: the lesson shows the
# program at the start, explains why Go exists on boards, then runs it once as a taste and says
# lesson 29 will explain every line.
# Boards: (H) where Go came from: 2007, 2009, 2012, today, the three designers' names, the three
# problems; (C) what Go chose; (U) where Go is used; (T) honest trade-offs; (F) why Go is a good
# first language; (Q) the quiz (a fourth rider); (M) the course map, 00 + seven modules.
# Run: run-1 = the pinned program (four lines; finish order = ride times; 300ms in all).
# Fixtures: bun ~/Documents/go-course-work/tools/sim-go.ts <this yaml> --write
schemaVersion: 1

lesson:
  slug: go-course-01-why-go
  title: "Go course 01: ဘာကြောင့် Go လဲ"
  locale: my-MM
  workspace:
    lessonType: go
    name: Go Course
    entryFilePath: main.go
    # Two files: the explorer shows the learner the program has two parts.
    sidebarStartsCollapsed: false
    files:
      main.go: |
        package main

        import (
        	"fmt"
        	"sync"
        	"time"
        )

        func main() {
        	start := time.Now()
        	var wg sync.WaitGroup
        	for _, r := range riders {
        		wg.Go(func() { deliver(r) })
        	}
        	wg.Wait()
        	fmt.Println(time.Since(start).Round(100*time.Millisecond), "မှာ အားလုံး ပြီးပြီ")
        }
      delivery.go: |
        package main

        import (
        	"fmt"
        	"time"
        )

        // rider is one motorbike rider in Yangon and how long the ride takes.
        type rider struct {
        	name string
        	ride time.Duration
        }

        // riders are the three riders who go out together.
        var riders = []rider{
        	{"လှလှ", 300 * time.Millisecond},
        	{"အောင်အောင်", 100 * time.Millisecond},
        	{"မောင်မောင်", 200 * time.Millisecond},
        }

        // deliver rides for r.ride, then says the parcel arrived.
        func deliver(r rider) {
        	time.Sleep(r.ride)
        	fmt.Println(r.ride, r.name, "ပါဆယ် ပို့ပြီး")
        }
