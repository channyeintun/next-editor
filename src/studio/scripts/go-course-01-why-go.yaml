build:
  voiceProfile:
    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 7101

runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    result:
      status: success
      exitCode: 0
      output: "100ms အောင်အောင် ပါဆယ် ပို့ပြီး\n200ms မောင်မောင် ပါဆယ် ပို့ပြီး\n300ms လှလှ ပါဆယ် ပို့ပြီး\n300ms မှာ အားလုံး ပြီးပြီ\n"

scenes:
  - id: welcome
    chapter: Go course ကို ကြိုဆိုပါတယ်
    narration: >-
      မင်္ဂလာပါ ခင်ဗျာ။ Go course ကို ကြိုဆိုပါတယ်။ ဒီ course ကို programming တစ်ခါမှ မရေးဖူးသေးတဲ့
      သူတွေအတွက် မြန်မာလို ပြင်ဆင်ထားတာပါ။ စာ တစ်ကြောင်း ထုတ်ပြတဲ့ program လေးကနေ စပြီး၊ အလုပ်
      အများကြီးကို တစ်ပြိုင်နက် လုပ်တဲ့ program တွေအထိ တစ်ဆင့်ချင်း သွားကြပါမယ်၊ ဥပမာ တွေကိုလည်း
      ကိုယ်တို့ နေ့စဉ် ဘဝထဲက ယူထားပါတယ်။ [[mark:why-first]] ဒါပေမဲ့ code မရေးခင်မှာ မေးခွန်း တစ်ခုကို
      အရင် ဖြေကြည့်ချင်ပါတယ်၊ ဘာကြောင့် Go ကို လေ့လာသင့်တာလဲ ဆိုတဲ့ မေးခွန်းပါ။ programming ဘာသာစကား
      တစ်ခုကို တတ်ဖို့ လပေါင်းများစွာ အချိန်ပေးရမှာ ဖြစ်လို့၊ သူ့ကို ဘာကြောင့် ဖန်တီးခဲ့လဲ၊ ဘာမှာ
      အသုံးဝင်ပြီး ဘာမှာ အားနည်းလဲ ဆိုတာ အရင် သိထားသင့်ပါတယ်။ [[mark:hook]] screen ပေါ်က program ကို
      အခု ဖတ်လို့ မရသေးတာ ပုံမှန်ပါပဲ။ lesson အဆုံးနားမှာ ဒီ program ကို run ကြည့်ပြီး၊ Go ရဲ့
      အားသာချက် တစ်ခုကို ကိုယ်တိုင် မြင်ရပါမယ်။
    sources:
      - { title: "Go FAQ — What is the purpose of the project?", url: "https://go.dev/doc/faq" }
      - { title: "sync package — WaitGroup.Go", url: "https://pkg.go.dev/sync#WaitGroup.Go" }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }

  - id: history
    chapter: Go ဘယ်က လာလဲ
    narration: >-
      [[mark:board-history]] အရင်ဆုံး Go ဘယ်က လာလဲ ဆိုတာ ကြည့်ရအောင်။ [[mark:draw-2007]] Go ကို
      ၂၀၀၇ ခုနှစ်မှာ Google က engineer သုံးယောက် စပြီး ဒီဇိုင်းဆွဲခဲ့တာပါ။ [[mark:draw-names]] သူတို့
      သုံးယောက်ရဲ့ နာမည်ကို board ပေါ်မှာ ရေးထားပေးပါတယ်။ [[mark:draw-2009]] ၂၀၀၉ ခုနှစ်၊ နိုဝင်ဘာလမှာတော့
      Go ကို open source အဖြစ် လူတိုင်းအတွက် ဖွင့်ပေးခဲ့ပါတယ်။ open source ဆိုတာ code ကို ဘယ်သူမဆို
      ကြည့်လို့၊ သုံးလို့ ရအောင် ဖွင့်ထားတာကို ပြောတာပါ။ [[mark:draw-2012]] ၂၀၁၂ ခုနှစ်မှာ Go version
      တစ် ထွက်လာပြီး၊ [[mark:draw-today]] အဲဒီကတည်းက ဒီနေ့အထိ version အသစ်တွေ ပုံမှန် ထွက်နေပါတယ်။
    sources:
      - { title: "Go FAQ — What is the history of the project?", url: "https://go.dev/doc/faq" }
      - { title: "Release History", url: "https://go.dev/doc/devel/release" }
    actions:
      - {
          id: board-history,
          type: whiteboard.apply,
          at: { mark: board-history, offsetMs: -300 },
          open: true,
          clear: true,
          upsertIds: [h-title],
        }
      - {
          id: draw-2007,
          type: whiteboard.apply,
          at: { mark: draw-2007 },
          upsertIds: [h-b1, h-y1, h-l1],
          drawMs: 1500,
        }
      - {
          id: draw-names,
          type: whiteboard.apply,
          at: { mark: draw-names },
          upsertIds: [h-names],
          drawMs: 1500,
        }
      - {
          id: draw-2009,
          type: whiteboard.apply,
          at: { mark: draw-2009 },
          upsertIds: [h-b2, h-y2, h-l2],
          drawMs: 1500,
        }
      - {
          id: draw-2012,
          type: whiteboard.apply,
          at: { mark: draw-2012 },
          upsertIds: [h-b3, h-y3, h-l3],
          drawMs: 1200,
        }
      - {
          id: draw-today,
          type: whiteboard.apply,
          at: { mark: draw-today },
          upsertIds: [h-b4, h-y4, h-l4, h-arrow],
          drawMs: 1800,
        }

  - id: problems
    narration: >-
      [[mark:draw-problems]] ဒါဆို ဘာကြောင့် ဘာသာစကား အသစ် လိုခဲ့တာလဲ။ အဲဒီတုန်းက Google မှာ ပြဿနာ
      သုံးခု ရှိနေလို့ပါ။ [[mark:draw-p1]] ပထမ တစ်ခုက program တွေ အရမ်း ကြီးလာတာပါ။ code line
      သန်းပေါင်း ဆယ်ချီ ရှိပြီး၊ programmer ရာနဲ့ချီ၊ ထောင်နဲ့ချီက နေ့တိုင်း ပြင်နေကြပါတယ်။
      ကိုယ်ရေးတဲ့ code ကို ကွန်ပျူတာ run လို့ရတဲ့ program အဖြစ် ပြောင်းတာကို compile လုပ်တယ်လို့
      ခေါ်ပါတယ်။ ၂၀၀၇ ခုနှစ်က program ကြီး တစ်ခုကို အဲဒီလို ပြောင်းဖို့ မိနစ် ၄၅ လောက် ကြာခဲ့ပါတယ်။
      ပြောလေ့ရှိတဲ့ ဇာတ်လမ်းအရ Go ကို စဉ်းစားမိတာကိုက အဲဒီလို compile တစ်ခု ပြီးတာကို မျှော်နေတုန်းမှာ
      ဖြစ်တယ်လို့ ဆိုပါတယ်။ [[mark:draw-p2]] ဒုတိယ တစ်ခုက ကွန်ပျူတာတွေ ပြောင်းလာတာပါ။ CPU တစ်ခုထဲမှာ
      အလုပ်ကို တစ်ပြိုင်နက် လုပ်နိုင်တဲ့ core တွေ အများကြီး ပါလာပြီး၊ program တွေကလည်း network နဲ့
      ချိတ်ထားတဲ့ ကွန်ပျူတာ အများကြီးပေါ်မှာ run ရပါတယ်။ [[mark:draw-p3]] တတိယ တစ်ခုကတော့ ဘာသာစကားတွေ
      ရှုပ်ထွေးလာတာပါ။ compile မြန်တာ၊ run မြန်တာ၊ ရေးရ လွယ်ကူတာ ဆိုတဲ့ သုံးခုကို ဘာသာစကား
      တစ်ခုတည်းမှာ အတူ မရနိုင်ခဲ့လို့၊ Go က အဲဒီ သုံးခုလုံးကို ရအောင် ကြိုးစားခဲ့တာပါ။
    sources:
      - {
          title: "Go at Google: Language Design in the Service of Software Engineering",
          url: "https://go.dev/talks/2012/splash.article",
        }
      - { title: "Go FAQ — Why did you create a new language?", url: "https://go.dev/doc/faq" }
    actions:
      - {
          id: draw-problems,
          type: whiteboard.apply,
          at: { mark: draw-problems },
          upsertIds: [h-p1, h-p2, h-p3],
          drawMs: 1500,
        }
      - {
          id: draw-p1,
          type: whiteboard.apply,
          at: { mark: draw-p1 },
          upsertIds: [h-p1a, h-p1b, h-p1c],
          drawMs: 2400,
        }
      - {
          id: draw-p2,
          type: whiteboard.apply,
          at: { mark: draw-p2 },
          upsertIds: [h-p2a, h-p2b, h-p2c],
          drawMs: 2400,
        }
      - {
          id: draw-p3,
          type: whiteboard.apply,
          at: { mark: draw-p3 },
          upsertIds: [h-p3a, h-p3b],
          drawMs: 2400,
        }

  - id: choices
    chapter: Go ရွေးခဲ့တဲ့ လမ်း
    narration: >-
      [[mark:board-choices]] ဒီ ပြဿနာတွေအတွက် Go က ဘာတွေ ရွေးခဲ့လဲ ကြည့်ရအောင်။ [[mark:draw-small]]
      ပထမ တစ်ခုက ဘာသာစကားကို သေးသေးလေး ထားတာပါ။ ဘာသာစကားက သီးသန့် သုံးထားတဲ့ keyword လို့ ခေါ်တဲ့
      စကားလုံး ၂၅ လုံးပဲ ရှိလို့၊ မှတ်ရမယ့် စည်းမျဉ်း နည်းပြီး တခြားသူ ရေးတဲ့ code ကိုလည်း ဖတ်ရတာ
      ရှင်းပါတယ်။ [[mark:draw-fmt]] ဒုတိယ တစ်ခုက gofmt ဆိုတဲ့ tool ပါ၊ code ကို ပုံစံ တစ်မျိုးတည်း
      ညှိပေးလို့ ဘယ်သူ ရေးရေး Go code တွေက တူတူပဲ မြင်ရပါတယ်။ [[mark:draw-fast]] တတိယ တစ်ခုက compile
      မြန်တာပါ၊ program ကြီးကြီးကိုတောင် စက္ကန့် အနည်းငယ်အတွင်း compile လုပ်နိုင်ဖို့ ရည်ရွယ်ထားပါတယ်။
      [[mark:draw-bin]] ပြီးတော့ compile လုပ်ပြီးရင် run ဖို့ လိုတာတွေ ပါပြီးသား ဖိုင် တစ်ခုတည်း
      ရလို့၊ အဲဒီ ဖိုင်ကို တခြား ကွန်ပျူတာဆီ ယူသွားပြီး run ရတာ လွယ်ကူပါတယ်။
    sources:
      - {
          title: "The Go Programming Language Specification — Keywords",
          url: "https://go.dev/ref/spec#Keywords",
        }
      - { title: "Go FAQ — style guide, build speed, binary size", url: "https://go.dev/doc/faq" }
    actions:
      - {
          id: board-choices,
          type: whiteboard.apply,
          at: { mark: board-choices, offsetMs: -300 },
          clear: true,
          upsertIds: [c-title, c-left, c-right],
        }
      - {
          id: draw-small,
          type: whiteboard.apply,
          at: { mark: draw-small },
          upsertIds: [c-small],
          drawMs: 1200,
        }
      - {
          id: draw-fmt,
          type: whiteboard.apply,
          at: { mark: draw-fmt },
          upsertIds: [c-fmt],
          drawMs: 1200,
        }
      - {
          id: draw-fast,
          type: whiteboard.apply,
          at: { mark: draw-fast },
          upsertIds: [c-fast],
          drawMs: 1000,
        }
      - {
          id: draw-bin,
          type: whiteboard.apply,
          at: { mark: draw-bin },
          upsertIds: [c-bin],
          drawMs: 1200,
        }

  - id: built-in
    narration: >-
      [[mark:draw-conc]] ညာဘက်ကတော့ Go ထဲမှာ ပါပြီးသား အရာတွေပါ။ အရေးအကြီးဆုံးက အလုပ် အများကြီးကို
      တစ်ပြိုင်နက် လုပ်တာကို ဘာသာစကား ထဲမှာကိုက ထည့်ထားတာပါ။ တစ်ပြိုင်နက် run နေတဲ့ function ကို
      goroutine လို့ ခေါ်ပြီး၊ goroutine တွေကြား တန်ဖိုး လွှဲပေးတဲ့ လမ်းကို channel လို့ ခေါ်ပါတယ်။
      [[mark:draw-std]] Go နဲ့ အတူ ပါလာတဲ့ အသင့်သုံး code အစုတွေကို standard library လို့ ခေါ်ပြီး၊
      စာသား၊ အချိန်၊ network လို အလုပ်တွေအတွက် လိုတာ အများကြီး ပါပြီးသားပါ။ [[mark:draw-gc]] program
      သုံးပြီးသွားတဲ့ memory ဆိုတဲ့ မှတ်ဉာဏ် နေရာတွေကိုလည်း Go က အလိုအလျောက် ပြန်ရှင်းပေးပါတယ်။
      [[mark:draw-go1]] နောက်ဆုံးက Go version တစ်ရဲ့ ကတိပါ။ အဲဒီ စည်းမျဉ်းအတိုင်း ရေးထားတဲ့ program
      တွေကို version အသစ်တွေမှာလည်း မပြင်ဘဲ ဆက် compile လုပ်လို့၊ ဆက် run လို့ ရအောင် ရည်ရွယ်ထားပါတယ်။
    sources:
