  - id: taste
    chapter: Go ကို မြည်းကြည့်ရအောင်
    narration: >-
      [[mark:close-first]] ဒါဆို lesson အစက program ကို ပြန်ကြည့်ရအောင်။ ဒီ program မှာ ဖိုင် နှစ်ခု
      ပါပါတယ်။ [[mark:open-delivery]] delivery ဖိုင်ထဲမှာ ရန်ကုန်မြို့ထဲ ပါဆယ် ပို့တဲ့ rider သုံးယောက်
      ရှိပါတယ်။ rider လှလှ က မီလီစက္ကန့် ၃၀၀၊ rider အောင်အောင် က ၁၀၀၊ rider မောင်မောင် က ၂၀၀ ကြာပြီး၊
      မီလီစက္ကန့် ၁၀၀ က ခရီး တိုတို တစ်ခုကို ကိုယ်စားပြုပါတယ်။ [[mark:open-main]] main ဖိုင်ကတော့
      rider တွေကို ထွက်ခိုင်းပြီး၊ အားလုံး ပို့ပြီးမှ ကြာချိန်ကို ထုတ်ပြပါတယ်။ [[mark:sel-go]] အဓိကက
      ဒီ line ပါ၊ rider တစ်ယောက်စီကို goroutine တစ်ခုစီနဲ့ တစ်ပြိုင်နက် ထွက်ခိုင်းတာပါ။ line
      တစ်ကြောင်းချင်းကို ဒီနေ့ မရှင်းတော့ပါဘူး၊ lesson ၂၉ ရောက်တဲ့အခါ ဒီ program ထဲက line တိုင်းကို
      နားလည်သွားမှာပါ။ [[mark:run-1]] ကဲ၊ run လိုက်ရအောင်။
    sources:
      - { title: "sync package — WaitGroup.Go", url: "https://pkg.go.dev/sync#WaitGroup.Go" }
      - {
          title: "The Go Programming Language Specification — Go statements",
          url: "https://go.dev/ref/spec#Go_statements",
        }
    actions:
      - {
          id: close-first,
          type: whiteboard.apply,
          at: { mark: close-first },
          open: false,
          upsertIds: [],
        }
      - {
          id: open-delivery,
          type: workspace.openFile,
          at: { mark: open-delivery },
          path: delivery.go,
        }
      - { id: open-main-2, type: workspace.openFile, at: { mark: open-main }, path: main.go }
      - id: sel-go
        type: editor.select
        at: { mark: sel-go }
        target: { file: main.go, text: "wg.Go(func() { deliver(r) })", occurrence: 1 }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "300ms မှာ အားလုံး ပြီးပြီ",
          timeoutMs: 8000,
        }
      - {
          id: expect-file-go,
          type: expect.file,
          at: { afterAction: run-1 },
          path: main.go,
          contains: "wg.Go(func() { deliver(r) })",
        }

  - id: read-run
    narration: >-
      [[mark:point-first]] ပထမ စာကြောင်းမှာ အောင်အောင် အရင် ရောက်ပါတယ်၊ စာရင်းထဲမှာ ဒုတိယ ဖြစ်ပေမဲ့
      သူ့ ခရီးက အတိုဆုံးမို့ပါ။ [[mark:point-hla]] လှလှ ကတော့ မီလီစက္ကန့် ၃၀၀ မှာ နောက်ဆုံးမှ
      ရောက်ပါတယ်။ [[mark:point-total]] အရေးကြီးတာက နောက်ဆုံး စာကြောင်းပါ။ အားလုံး ပြီးဖို့ မီလီစက္ကန့်
      ၃၀၀ ပဲ ကြာပါတယ်။ rider တစ်ယောက်တည်းက တစ်ခုပြီးမှ တစ်ခု ပို့ရင် ကြာချိန်တွေ ပေါင်းပြီး
      မီလီစက္ကန့် ၆၀၀ ကြာမှာပါ။ တစ်ပြိုင်နက် သွားတော့ အကြာဆုံး တစ်ယောက်စာပဲ ကြာတာပါ၊ ဒါဟာ ခုနက
      ပြောခဲ့တဲ့ Go ရဲ့ အားသာချက်ပါ။
    sources:
      - { title: "sync package — WaitGroup", url: "https://pkg.go.dev/sync#WaitGroup" }
    actions:
      - {
          id: point-first,
          type: console.point,
          at: { mark: point-first },
          target: { text: "100ms အောင်အောင်" },
        }
      - {
          id: point-hla,
          type: console.point,
          at: { mark: point-hla },
          target: { text: "300ms လှလှ" },
        }
      - {
          id: point-total,
          type: console.point,
          at: { mark: point-total },
          target: { text: "မှာ အားလုံး ပြီးပြီ" },
        }

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >-
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ [[mark:quiz-new]] rider စာရင်းထဲကို rider အသစ် တစ်ယောက်
      ထပ်ထည့်တယ် ဆိုပါစို့၊ သူ့ ခရီးက မီလီစက္ကန့် ၄၀၀ ကြာပါတယ်။ program ကို ထပ် run ရင် အားလုံး
      ပြီးဖို့ ဘယ်လောက် ကြာမလဲ။ board ပေါ်က အဖြေ နှစ်ခုထဲက ဘယ်ဟာလဲ။ lesson ကို pause လုပ်ပြီး
      စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] အဖြေကတော့ က၊ မီလီစက္ကန့် ၄၀၀ ပါ။ ဘာကြောင့်လဲဆိုတော့ rider
      လေးယောက်လုံး တစ်ပြိုင်နက် ထွက်ကြတာ ဖြစ်လို့၊ ကြာချိန်တွေ ပေါင်းတာ မဟုတ်ဘဲ အကြာဆုံး တစ်ယောက်ရဲ့
      ကြာချိန်ပဲ ကြာလို့ပါ။
    sources:
      - { title: "sync package — WaitGroup.Wait", url: "https://pkg.go.dev/sync#WaitGroup.Wait" }
