        </style>
        <div class="stage">
          <div class="title">Architect ခရီးလမ်း အဆင့် သုံးဆင့်</div>
          <div class="row" style="top: 34vh"><span class="num">1</span><span class="term blue">စတင်သူ</span>Lesson 01–11 · trade-off နဲ့ code ရဲ့ ဖွဲ့စည်းပုံ</div>
          <div class="row" style="top: 50vh"><span class="num">2</span><span class="term orange">လုပ်ကိုင်သူ</span>Lesson 12–44 · quality, style, domain, data</div>
