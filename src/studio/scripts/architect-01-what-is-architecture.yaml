  - id: no-bug
    chapter: Bug က ဘယ်မှာလဲ
    narration: >
      [[mark:n-open]] နောက်တစ်နေ့မှာ team တစ်ခုလုံး ထိုင်ပြီး bug ကို လိုက်ရှာကြပါတယ်။ ဒါပေမဲ့ ထူးဆန်းတာက
      မှားနေတဲ့ code တစ်ကြောင်းကိုမှ ရှာမတွေ့ခဲ့ပါဘူး။
      [[mark:n-app]] app ဘက်က code က ထိုင်ခုံ လွတ်မလွတ် အရင် စစ်ပြီးမှ ရောင်းပါတယ်။
      [[mark:n-counter]] ကောင်တာဘက်က code ကလည်း အဲဒီအတိုင်းပဲ စစ်ပြီးမှ ရောင်းပါတယ်။
      [[mark:n-ok]] တစ်ခုချင်းစီ ခွဲကြည့်ရင် နှစ်ခုလုံး မှန်နေပါတယ်။ ဒါပေမဲ့ မနက် ၉ နာရီ ကျော်ကျော်မှာ app ထဲက
      ခရီးသည် တစ်ယောက်နဲ့ ကောင်တာက ဝန်ထမ်း တစ်ယောက်က ထိုင်ခုံ တစ်ခုံတည်းကို တစ်စက္ကန့်အတွင်းမှာ
      စစ်ကြည့်မိကြတယ် ဆိုပါစို့။ နှစ်ယောက်လုံးက ခုံ လွတ်နေတယ်လို့ မြင်ရပြီး၊ နှစ်ယောက်လုံးလည်း
      ရောင်းလိုက်ကြပါတယ်။
      [[mark:n-q1]] ဒါဆို နှစ်ဖက်လုံးက ထိုင်ခုံ တစ်ခုံတည်းကို တစ်ချိန်တည်းမှာ ရောင်းရင် ဘာဖြစ်ရမလဲ။
      [[mark:n-q2]] ဝင်သုံးသူ ၁၅ ဆ တက်လာတဲ့ နေ့မျိုးမှာ system က ဘယ်လို ဆက်အလုပ်လုပ်ရမလဲ။ ဒီ မေးခွန်း နှစ်ခုကို
      ဘယ်သူမှ မမေးခဲ့သလို၊ အဖြေကိုလည်း ဘယ်သူမှ မဆုံးဖြတ်ခဲ့ပါဘူး။
      [[mark:n-point]] ဒီလို မေးခွန်းတွေက code တစ်ကြောင်းချင်းစီရဲ့ ကိစ္စ မဟုတ်ဘဲ၊ system တစ်ခုလုံးရဲ့
      ကိစ္စပါ။ အဲဒီလို system တစ်ခုလုံးနဲ့ ဆိုင်တဲ့ ဆုံးဖြတ်ချက်တွေကို architecture လို့ ခေါ်တာပါ။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - {
          id: draw-n-open,
          type: whiteboard.apply,
          at: { mark: n-open },
          clear: true,
          upsertIds: [n-title],
        }
      - {
          id: draw-n-app,
          type: whiteboard.apply,
          at: { mark: n-app },
          upsertIds: [n-app, n-app-l, n-arrow1, n-table, n-table-l],
          drawMs: 2000,
        }
      - {
          id: draw-n-counter,
          type: whiteboard.apply,
          at: { mark: n-counter },
          upsertIds: [n-counter, n-counter-l, n-arrow2],
          drawMs: 1500,
        }
      - {
          id: draw-n-ok,
          type: whiteboard.apply,
          at: { mark: n-ok },
          upsertIds: [n-ok1, n-ok2],
          drawMs: 800,
        }
      - {
          id: draw-n-q1,
          type: whiteboard.apply,
          at: { mark: n-q1 },
          upsertIds: [n-q1],
          drawMs: 700,
        }
      - {
          id: draw-n-q2,
          type: whiteboard.apply,
          at: { mark: n-q2 },
          upsertIds: [n-q2],
          drawMs: 700,
        }
      - {
          id: draw-n-conc,
          type: whiteboard.apply,
          at: { mark: n-point },
          upsertIds: [n-conc],
          drawMs: 1000,
        }

  - id: four-parts
    chapter: Architecture ရဲ့ အပိုင်း လေးခု
    narration: >
      [[mark:f-open]] architecture လို့ ပြောလိုက်ရင် လူအများစုက box တွေနဲ့ မြားတွေ ဆွဲထားတဲ့ ပုံတစ်ပုံကို၊
      ဒါမှမဟုတ် သုံးထားတဲ့ framework ကို မြင်ယောင်ကြပါတယ်။ တကယ်တော့ architecture ဆိုတာ system တစ်ခုလုံးရဲ့
      ပုံစံကို သတ်မှတ်ပေးပြီး၊ နောက်မှ ပြန်ပြောင်းဖို့ ခက်တဲ့ ဆုံးဖြတ်ချက်တွေ အစုအဝေးပါ။ ပုံဆိုတာက အဲဒီ
      ဆုံးဖြတ်ချက်တွေကို ပြတဲ့ နည်းလမ်း တစ်ခုပဲ ဖြစ်ပါတယ်။ system တစ်ခုရဲ့ architecture ကို အပိုင်း လေးခုနဲ့
      ခွဲကြည့်လို့ ရပါတယ်။
      [[mark:f-char]] ပထမ အပိုင်းက architecture characteristic ပါ။ system က ဘာလုပ်ပေးလဲ မဟုတ်ဘဲ၊ ဘယ်လောက်
      ကောင်းကောင်း လုပ်ပေးနိုင်ရမလဲ ဆိုတဲ့ အရည်အသွေးတွေကို ဆိုလိုပါတယ်။ ခရီးဖော် အတွက်ဆိုရင် လူတွေ ရုတ်တရက်
      အများကြီး ဝင်လာလည်း ခံနိုင်ရမယ်၊ ထိုင်ခုံ တစ်ခုံကို ဘယ်တော့မှ နှစ်ခါ မရောင်းမိရဘူး ဆိုတာမျိုးပါ။
      [[mark:f-comp]] ဒုတိယ အပိုင်းက component ပါ။ system ရဲ့ လုပ်ငန်း တစ်ခုစီကို တာဝန်ယူတဲ့
      အစိတ်အပိုင်းတွေ ဖြစ်ပြီး၊ ခရီးစဉ် ရှာတဲ့အပိုင်း၊ ထိုင်ခုံ ရောင်းတဲ့အပိုင်း၊ ငွေချေတဲ့အပိုင်း ဆိုပြီး
      ခွဲထားတာကို ပြောတာပါ။
      [[mark:f-style]] တတိယ အပိုင်းက architecture style ပါ။ အဲဒီ component တွေ အားလုံးကို ဘယ်လို ပုံစံနဲ့
      ဖွဲ့စည်းထားလဲ ဆိုတာပါ။ အားလုံးကို app တစ်ခုတည်းအဖြစ် အတူတူ deploy လုပ်တာလား၊ သီးခြား service
      တွေအဖြစ် ခွဲထုတ်ထားတာလား ဆိုတာမျိုးပါ။
      [[mark:f-dec]] စတုတ္ထ အပိုင်းက decision ပါ။ ဘယ်အရာကို ခွင့်ပြုပြီး ဘယ်အရာကို ခွင့်မပြုဘူး ဆိုတဲ့
      စည်းကမ်းတွေပါ။ ဥပမာ ထိုင်ခုံ data ကို ဘယ် component တွေက ပြင်ခွင့်ရှိလဲ ဆိုတာ decision တစ်ခုပါ။
      [[mark:f-all]] ဒီ လေးခုလုံးကို ပြောပြနိုင်မှ system တစ်ခုရဲ့ architecture ကို သိတယ်လို့ ဆိုနိုင်ပါတယ်။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - {
          id: draw-f-open,
          type: whiteboard.apply,
          at: { mark: f-open },
          clear: true,
          upsertIds: [f-sys, f-sys-l],
          drawMs: 1200,
        }
      - {
          id: draw-f-char,
          type: whiteboard.apply,
          at: { mark: f-char },
          upsertIds: [f-c1, f-c1-t, f-c1-s],
          drawMs: 1500,
        }
      - {
          id: draw-f-comp,
          type: whiteboard.apply,
          at: { mark: f-comp },
          upsertIds: [f-c2, f-c2-t, f-c2-s],
          drawMs: 1500,
        }
      - {
          id: draw-f-style,
          type: whiteboard.apply,
          at: { mark: f-style },
          upsertIds: [f-c3, f-c3-t, f-c3-s],
          drawMs: 1500,
        }
      - {
          id: draw-f-dec,
          type: whiteboard.apply,
          at: { mark: f-dec },
          upsertIds: [f-c4, f-c4-t, f-c4-s],
          drawMs: 1500,
        }
      - { id: point-f-sys, type: whiteboard.point, at: { mark: f-all }, target: { assetId: f-sys } }

  - id: accidental
    chapter: မဆုံးဖြတ်ခဲ့တာလည်း ဆုံးဖြတ်ချက်ပဲ
    narration: >
      [[mark:a-close]] ခရီးဖော် မှာ architect လည်း မရှိခဲ့သလို၊ architecture ကို ထိုင်ပြီး စဉ်းစားခဲ့တာလည်း
      မရှိပါဘူး။ ဒါပေမဲ့ architecture ကတော့ ရှိနေပါတယ်။ ဘာကြောင့်လဲဆိုတော့ မဆုံးဖြတ်ဘဲ ထားခဲ့တာ ကိုယ်တိုင်ကလည်း
      ဆုံးဖြတ်ချက် တစ်ခု ဖြစ်နေလို့ပါ။ အခု ရှိနေတဲ့ အတိုင်းကို အပိုင်း လေးခုနဲ့ ရိုးရိုးသားသား
      ချရေးကြည့်ရအောင်။
      [[mark:type-char]] characteristic တွေကို ဘယ်သူမှ မရွေးခဲ့ပါဘူး။ ရွေးမထားတော့ system ရဲ့ တကယ့်
      အရည်အသွေးကို သင်္ကြန်နေ့က ဖြစ်ရပ်က ပြသွားတာပါပဲ။
      [[mark:type-comp]] component တွေကတော့ နာမည်အားဖြင့် ငါးခုလောက် ရှိပါတယ်။ ဒါပေမဲ့ code ထဲမှာ
      တစ်ခုနဲ့တစ်ခု ရောနေတော့၊ ဘယ်အပိုင်းက ဘယ်မှာ စပြီး ဘယ်မှာ ဆုံးလဲ ဆိုတာ ပြောရ ခက်ပါတယ်။
      [[mark:type-style]] style ကတော့ monolith ပါ။ monolith ဆိုတာ အရာအားလုံးကို app တစ်ခုတည်းအဖြစ် အတူတူ
      deploy လုပ်ရတဲ့ ပုံစံပါ။ ဒါက မကောင်းဘူးလို့ ဆိုလိုတာ မဟုတ်ပါဘူး။ developer ခြောက်ယောက်ပဲ ရှိတဲ့
      ကုမ္ပဏီအတွက် သင့်တော်တဲ့ ရွေးချယ်မှု ဖြစ်ချင်လည်း ဖြစ်နိုင်ပါတယ်။ ပြဿနာက ဒါကို တမင် ရွေးခဲ့တာ
      မဟုတ်တာပါ။
      [[mark:type-dec]] decision အနေနဲ့ကတော့ app ရော ကောင်တာရော ထိုင်ခုံ table တစ်ခုတည်းကို တိုက်ရိုက်
      ရေးနေကြပါတယ်။ ထိုင်ခုံ နှစ်ခါ ရောင်းမိတာရဲ့ အရင်းအမြစ်က ဒီ decision ပါပဲ။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - { id: close-four, type: whiteboard.apply, at: { mark: a-close }, open: false }
      - {
          id: open-notebook,
          type: workspace.openFile,
          at: { afterAction: close-four },
          path: notebook/01-architecture.md,
        }
      - id: type-char
        type: editor.type
        at: { mark: type-char }
        cadence: line-by-line
        target: { file: notebook/01-architecture.md, after: "# ခရီးဖော် ရဲ့ architecture (အခု)\n\n" }
        text: "## Characteristics\n- ဘယ်သူမှ မရွေးခဲ့ဘူး။ သင်္ကြန်နေ့မှာ app နှေးပြီး ထိုင်ခုံ 312 ခုံ နှစ်ခါ ရောင်းမိတယ်\n\n"
      - id: type-comp
        type: editor.type
        at: { mark: type-comp }
        cadence: line-by-line
        target: { file: notebook/01-architecture.md, after: "နှစ်ခါ ရောင်းမိတယ်\n\n" }
        text: "## Components\n- Search, Booking, Payment, Operator, Report (code ထဲမှာ ရောနေတယ်)\n\n"
      - id: type-style
        type: editor.type
        at: { mark: type-style }
        cadence: line-by-line
        target: { file: notebook/01-architecture.md, after: "(code ထဲမှာ ရောနေတယ်)\n\n" }
        text: "## Style\n- Monolith: app တစ်ခု၊ database တစ်ခု၊ server တစ်လုံး\n\n"
      - id: type-dec
        type: editor.type
        at: { mark: type-dec }
        cadence: line-by-line
        target: { file: notebook/01-architecture.md, after: "server တစ်လုံး\n\n" }
        text: "## Decisions\n- app ရော ကောင်တာရော ထိုင်ခုံ table တစ်ခုတည်းကို တိုက်ရိုက် ရေးတယ်\n- ဘာကြောင့်လဲ ဆိုတာ ဘယ်သူမှ မမှတ်မိတော့ဘူး\n"

  - id: why
    chapter: ဘာကြောင့် ဆိုတာ code ထဲမှာ မရှိဘူး
    narration: >
      [[mark:sel-why]] နောက်ဆုံး စာကြောင်းကို သတိထားကြည့်ပါ။ ဘာကြောင့် ဒီလို လုပ်ခဲ့လဲ ဆိုတာကို ဘယ်သူမှ
      မမှတ်မိတော့ပါဘူး။ code ကို ဖတ်ရင် system က ဘယ်လို အလုပ်လုပ်လဲ ဆိုတာ သိနိုင်ပါတယ်။ ဒါပေမဲ့ ဘာကြောင့်
      ဒီလို ဆောက်ခဲ့လဲ ဆိုတာကတော့ code ထဲမှာ မရှိဘဲ၊ ဆုံးဖြတ်ခဲ့တဲ့ လူတွေရဲ့ ခေါင်းထဲမှာပဲ ရှိတာပါ။
      အဲဒီလူတွေ ထွက်သွားတဲ့နေ့မှာ အကြောင်းပြချက်ပါ ပျောက်သွားပါတယ်။
      [[mark:why-2]] အကြောင်းပြချက် မသိတော့တဲ့ ဆုံးဖြတ်ချက်ကို ပြင်ဖို့ ဘယ်သူမှ မရဲတော့ပါဘူး။ ပြင်လိုက်ရင်
      ဘာတွေ ပျက်သွားမလဲ မသိလို့ပါ။ ဒါကြောင့် architect ရဲ့ အလုပ်မှာ ပုံဆွဲတာထက် ပိုအရေးကြီးတာက၊ system
      တစ်ခုလုံးကို ထိခိုက်မယ့် ဆုံးဖြတ်ချက်တွေကို သတိရှိရှိ ချမှတ်ပြီး၊ ဘာကြောင့်လဲ ဆိုတာပါ
      မှတ်တမ်းတင်ထားတာ ဖြစ်ပါတယ်။
      [[mark:cto]] သင်္ကြန် ဖြစ်ရပ် ပြီးတဲ့နောက် CTO ဖြစ်တဲ့ အောင်အောင် က ကိုယ့်ကို တာဝန် တစ်ခု
      ပေးလိုက်ပါတယ်။ အခုကစပြီး ခရီးဖော် ရဲ့ architecture ကို ကြည့်ပေးဖို့ပါ။ ဒီ course တစ်လျှောက်လုံးမှာ
      ကိုယ်တို့က အဲဒီ တာဝန်ကို အတူတူ ထမ်းဆောင်သွားကြမှာ ဖြစ်ပါတယ်။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
      - {
          title: "The Software Architect Elevator (Hohpe)",
          url: "https://oreil.ly/Software_Architect_Elevator",
        }
    actions:
      - id: sel-why
        type: editor.select
        at: { mark: sel-why }
        target: { file: notebook/01-architecture.md, text: "- ဘာကြောင့်လဲ ဆိုတာ ဘယ်သူမှ မမှတ်မိတော့ဘူး" }
      - id: expect-decisions
        type: expect.file
        at: { afterAction: sel-why }
        path: notebook/01-architecture.md
        contains: "## Decisions\n- app ရော ကောင်တာရော ထိုင်ခုံ table တစ်ခုတည်းကို တိုက်ရိုက် ရေးတယ်\n"

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ ဒီ နှစ်ခုထဲက ဘယ်ဟာက architecture decision ဖြစ်မလဲ။
      [[mark:q-a]] ပထမ တစ်ခုက ခရီးစဉ် ရှာတဲ့ စာမျက်နှာမှာ ရလဒ်တွေကို တစ်ခါပြရင် ၂၀ စီ ပြမယ် ဆိုတာပါ။
      [[mark:q-b]] ဒုတိယ တစ်ခုကတော့ ငွေချေတဲ့ wallet ကုမ္ပဏီရဲ့ API ကို code ထဲက လိုအပ်တဲ့ နေရာတိုင်းကနေ
      တိုက်ရိုက် ခေါ်သုံးမယ် ဆိုတာပါ။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ တစ်ခုပါ။ ဘာကြောင့်လဲဆိုတော့ တစ်ခါပြတဲ့ အရေအတွက်ကို နောက်နေ့
      ပြန်ပြောင်းချင်ရင် တစ်နေရာတည်းမှာ ပြင်လိုက်ရုံပါပဲ။ wallet API ကို နေရာတိုင်းကနေ တိုက်ရိုက်
      ခေါ်ထားရင်တော့ system တစ်ခုလုံးက အဲဒီ ကုမ္ပဏီ တစ်ခုတည်းကို မှီခိုသွားပါတယ်။ နောက်တစ်နေ့ wallet အသစ်
      တစ်ခု ထပ်ထည့်ချင်ရင် နေရာပေါင်းများစွာမှာ လိုက်ပြင်ရပါလိမ့်မယ်။
      [[mark:q-test]] ဒါကြောင့် ဆုံးဖြတ်ချက် တစ်ခုက architecture နဲ့ ဆိုင်မဆိုင် သိချင်ရင် မေးခွန်း နှစ်ခု
      မေးကြည့်ပါ။ system ရဲ့ အပိုင်း ဘယ်နှခုကို ထိခိုက်မလဲ၊ နောက်မှ ပြန်ပြောင်းရင် ဘယ်လောက် ကုန်ကျမလဲ
      ဆိုတာပါ။ နှစ်ခုလုံးရဲ့ အဖြေက များနေရင်တော့ အဲဒါ architecture decision ပါပဲ။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
      - {
          title: "The Software Architect Elevator (Hohpe)",
          url: "https://oreil.ly/Software_Architect_Elevator",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-test,
          type: whiteboard.apply,
          at: { mark: q-test, offsetMs: 2500 },
          upsertIds: [q-t1, q-t2],
          drawMs: 1600,
        }

  - id: your-turn
    chapter: ကိုယ့် system အတွက်
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ဒီ ခေါင်းစဉ် လေးခုအောက်မှာ ကိုယ့် project
      အတွက် တစ်ကြောင်းစီ ရေးကြည့်ပါ။ ခရီးဖော် အတွက် ရေးထားတာတွေကို ဖျက်ပြီး ကိုယ့် system ရဲ့ အခြေအနေနဲ့
      အစားထိုးလိုက်ရုံပါပဲ။
      [[mark:turn-2]] တချို့ ခေါင်းစဉ်အောက်မှာ ဘာရေးရမလဲ မသိတာမျိုး ကြုံရနိုင်ပါတယ်။ အဲဒါလည်း အဖြေ
      တစ်ခုပါပဲ။ မသိသေးဘူး၊ ဘယ်သူမှ မဆုံးဖြတ်ရသေးဘူး လို့ပဲ ရေးထားလိုက်ပါ။ architect အမြင်နဲ့
      စကြည့်တဲ့အခါ ပထမဆုံး တွေ့ရတာက အဲဒီလို ကွက်လပ်တွေပါပဲ။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: turn }, open: false }
      - id: sel-headings
        type: editor.select
        at: { mark: turn, offsetMs: 2200 }
        target:
          file: notebook/01-architecture.md
          text: "## Characteristics\n- ဘယ်သူမှ မရွေးခဲ့ဘူး။ သင်္ကြန်နေ့မှာ app နှေးပြီး ထိုင်ခုံ 312 ခုံ နှစ်ခါ ရောင်းမိတယ်\n\n## Components\n- Search, Booking, Payment, Operator, Report (code ထဲမှာ ရောနေတယ်)\n\n## Style\n- Monolith: app တစ်ခု၊ database တစ်ခု၊ server တစ်လုံး\n\n## Decisions"

  - id: course-map
    chapter: ဒီ course ရဲ့ ခရီးစဉ်
    narration: >
      [[mark:m-open]] ဒီ course မှာ ကိုယ်တို့ ဘယ်လို ခရီးဆက်ကြမလဲ ဆိုတာ ကြည့်ရအောင်။ architect
      တစ်ယောက်ရဲ့ ခရီးလမ်းကို အဆင့် သုံးဆင့် ခွဲကြည့်လို့ ရပါတယ်။
      [[mark:m-1]] ပထမ အဆင့်က စတင်သူ အဆင့်ပါ။ developer အမြင်ကနေ architect အမြင်ဆီ ကူးပြောင်းတဲ့ အဆင့်
      ဖြစ်ပြီး၊ trade off တွေကို ချိန်ဆတတ်ဖို့နဲ့ code ရဲ့ ဖွဲ့စည်းပုံကို အကဲဖြတ်တတ်ဖို့ လေ့လာရပါမယ်။ trade
      off ဆိုတာ တစ်ခု ရဖို့ နောက်တစ်ခုကို လျှော့ပေးရတာပါ။
      [[mark:m-2]] ဒုတိယ အဆင့်က လက်တွေ့ လုပ်ကိုင်သူ အဆင့်ပါ။ system အတွက် လိုအပ်တဲ့ အရည်အသွေးတွေကို
      ရှာဖွေတာ၊ style ရွေးတာ၊ business ကို နားလည်အောင် လုပ်တာ၊ data နဲ့ distributed system တွေအတွက်
      ဆုံးဖြတ်ချက် ချတာတွေ ပါဝင်ပါတယ်။
      [[mark:m-3]] တတိယ အဆင့်က ဦးဆောင်သူ အဆင့်ပါ။ ဒီအဆင့် ရောက်ရင် ကိုယ်တစ်ယောက်တည်း ဆုံးဖြတ်လို့
      မနိုင်တော့ပါဘူး။ team အများကြီးက ကောင်းကောင်း ဆုံးဖြတ်နိုင်အောင် ကူညီပေးတာနဲ့၊ အဖွဲ့အစည်းရဲ့ ထိပ်ပိုင်းနဲ့
      ဆက်သွယ်တာတွေက အဓိက အလုပ် ဖြစ်လာပါတယ်။
      [[mark:m-grow]] ခရီးဖော် ကလည်း lesson တွေနဲ့အတူ ကြီးထွားလာမှာပါ။ developer ခြောက်ယောက်ကနေ ၉၀ အထိ
      တိုးလာမှာ ဖြစ်ပြီး၊ ကိုယ့် တာဝန်ကလည်း senior developer ကနေ chief architect အထိ ပြောင်းသွားပါလိမ့်မယ်။
      lesson တိုင်းမှာ architect တစ်ယောက် တကယ် ရေးရတဲ့ စာရွက်စာတမ်း တစ်ခုကိုလည်း ဒီနေ့လိုပဲ ကိုယ်တိုင်
      ရေးကြည့်သွားမှာပါ။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
      - {
          title: "The Software Architect Elevator (Hohpe)",
          url: "https://oreil.ly/Software_Architect_Elevator",
        }
    actions:
      - {
          id: show-stages,
          type: slide.show,
          at: { mark: m-open, offsetMs: -1200 },
          slideId: three-stages,
        }
      - { id: point-stage-1, type: slide.point, at: { mark: m-1 }, target: { x: 0.15, y: 0.43 } }
      - { id: point-stage-2, type: slide.point, at: { mark: m-2 }, target: { x: 0.15, y: 0.59 } }
      - { id: point-stage-3, type: slide.point, at: { mark: m-3 }, target: { x: 0.15, y: 0.75 } }

  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ architecture ဆိုတာ ပုံတစ်ပုံလည်း မဟုတ်၊ framework လည်း မဟုတ်ဘဲ၊
      system တစ်ခုလုံးရဲ့ ပုံစံကို သတ်မှတ်ပြီး နောက်မှ ပြောင်းဖို့ ခက်တဲ့ ဆုံးဖြတ်ချက်တွေပါ။ characteristic၊
      component၊ style နဲ့ decision ဆိုတဲ့ အပိုင်း လေးခုနဲ့ ဖော်ပြလို့ ရပါတယ်။ ဘယ်သူမှ မဆုံးဖြတ်ခဲ့ရင်လည်း
      architecture က ရှိနေတာမို့၊ သတိရှိရှိ ဆုံးဖြတ်ပြီး ဘာကြောင့်လဲ ဆိုတာကို မှတ်ထားဖို့ လိုပါတယ်။
      [[mark:next]] နောက် lesson မှာတော့ architect တစ်ယောက်က နေ့စဉ် ဘာတွေ လုပ်ရလဲ၊ အောင်အောင် ပေးလိုက်တဲ့
      တာဝန်က တကယ်တော့ ဘာကို ဆိုလိုတာလဲ ဆိုတာကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - { id: close-stages, type: slide.close, at: { mark: recap } }

checks:
  - { type: timing.p95Ms, max: 300 }
