build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 8101

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: welcome
    chapter: သင်္ကြန် မနက်က ဖြစ်ရပ်
    narration: >
      မင်္ဂလာပါ ခင်ဗျာ။ Architect Path course ကို ကြိုဆိုပါတယ်။ ဒီ course က developer တစ်ယောက်ကနေ
      software architect ဖြစ်လာချင်သူတွေနဲ့၊ architect အဖြစ် ဆက်ပြီး တိုးတက်ချင်သူတွေအတွက် ရည်ရွယ်ပါတယ်။
      architecture လောကမှာ လူသိများတဲ့ စာအုပ် ဆယ်အုပ်ထဲက အတွေးအခေါ်တွေကို အခြေခံထားပြီး၊ ကုမ္ပဏီ တစ်ခုရဲ့
      ဇာတ်လမ်းနဲ့ တွဲပြီး လေ့လာသွားမှာပါ။
      [[mark:company]] အဲဒီ ကုမ္ပဏီရဲ့ နာမည်က ခရီးဖော် ပါ။ ခရီးဖော် ဆိုတာ ဒီ course အတွက် စိတ်ကူးနဲ့
      တည်ဆောက်ထားတဲ့ ကုမ္ပဏီပါ။
      [[mark:sel-users]] ခရီးဖော် က အဝေးပြေးကား လက်မှတ်တွေကို app ကနေ ဝယ်လို့ရအောင် လုပ်ပေးပါတယ်။
      ခရီးသည်တွေက app ထဲမှာ ခရီးစဉ် ရှာပြီး ထိုင်ခုံ ရွေးဝယ်သလို၊ ကားဂိတ်က ကောင်တာ ဝန်ထမ်းတွေကလည်း အဲဒီ
      ထိုင်ခုံတွေကိုပဲ ကောင်တာကနေ ရောင်းပေးပါတယ်။
      [[mark:sel-now]] ကုမ္ပဏီ သက်တမ်းက နှစ်နှစ် ရှိပါပြီ။ ကိုယ်ကတော့ အဲဒီက developer ခြောက်ယောက်ထဲက
      senior developer တစ်ယောက်ပါ။ system ကလည်း app တစ်ခု၊ database တစ်ခု၊ server တစ်လုံးနဲ့ပဲ
      အလုပ်လုပ်နေတာပါ။
      [[mark:t-open]] ဒီနှစ် သင်္ကြန် လက်မှတ်တွေ ဖွင့်ရောင်းတဲ့ မနက်မှာ ပြဿနာကြီး တစ်ခု ဖြစ်ခဲ့ပါတယ်။
      [[mark:t-9]] မနက် ၉ နာရီ ထိုးတာနဲ့ လက်မှတ် ဝယ်မယ့်သူတွေ တစ်ပြိုင်တည်း ဝင်လာကြပြီး၊ ဝင်သုံးသူ အရေအတွက်က
      ပုံမှန်နေ့ရဲ့ ၁၅ ဆ ဖြစ်သွားပါတယ်။
      [[mark:t-slow]] app ကလည်း နှစ်နာရီလောက် နှေးကွေးနေခဲ့ပါတယ်။
      [[mark:t-double]] အဆိုးဆုံးကတော့ ထိုင်ခုံ ၃၁၂ ခုံကို နှစ်ခါ ရောင်းမိတာပါ။ app ကနေ တစ်ယောက်
      ဝယ်ထားပြီးသား ခုံကို ကောင်တာကလည်း နောက်တစ်ယောက်ကို ရောင်းလိုက်မိတာပါ။ ခရီးသည်တွေကို ငွေပြန်အမ်းရပြီး၊
      ကားလိုင်း ပိုင်ရှင်တွေလည်း အတော် စိတ်ဆိုးကြပါတယ်။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - { id: open-readme, type: workspace.openFile, at: { mark: company }, path: README.md }
      - id: sel-users
        type: editor.select
        at: { mark: sel-users }
        target:
          file: README.md
          text: "- ခရီးသည်: ခရီးစဉ် ရှာတယ်၊ ထိုင်ခုံ ရွေးတယ်၊ wallet နဲ့ ငွေချေတယ်၊ လက်မှတ် ရတယ်\n- ကားလိုင်း: ခရီးစဉ်နဲ့ ဈေးနှုန်း တင်တယ်၊ ရောင်းအား ကြည့်တယ်\n- ကောင်တာ ဝန်ထမ်း: ကားဂိတ်မှာ ထိုင်ခုံ အတူတူကိုပဲ ရောင်းတယ်"
      - id: sel-now
        type: editor.select
