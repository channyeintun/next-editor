  - id: exceptions
    chapter: "Exception တွေက ပုံမှန်ပါ"
    narration: >
      [[mark:show-p05]] platform ဘယ်လောက်ပဲ ကောင်းကောင်း မထည့်ထားမိတဲ့ လိုအပ်ချက်တွေ ရှိတတ်ပါတယ်။ ဥပမာ fraud အဖွဲ့က ငွေလွှဲတိုင်းကို စစ်ဖို့ GPU ပေါ်က Python model server လိုပါတယ်။ ဒါကြောင့် platform ကနေ ခွဲထွက်ခွင့်၊ exception တွေကို ထိခိုက်မှုအလိုက် ခွဲပါတယ်။
      [[mark:p05-split]] memory limit တိုးတာလို သေးတဲ့ ကိစ္စက ticket မတင်ဘဲ ကိုယ်တိုင် လုပ်လို့ရတဲ့ self-service ဖြစ်ပြီး log ကျန်ပါတယ်။ runtime အသစ်လို ကြီးတဲ့ ကိစ္စကိုတော့ ပျက်ရင် ညဘက် ထပြင်ရမယ့် မသီရိနဲ့ ကုန်ကျစရိတ် ပေးရမယ့် ကိုနေလင်းက review လုပ်ပါတယ်။
      [[mark:show-p05b]] exception မပေးဘဲ အတင်း သုံးခိုင်းရင် လူတွေက မမြင်ရတဲ့ နေရာမှာ workaround တွေ ဆောက်ကုန်ပါတယ်။ ရွေးစရာ များလွန်းတာက tech debt တစ်မျိုး ဖြစ်သလို တင်းကျပ်လွန်းတာကလည်း debt နောက်တစ်မျိုးပါ။ ဒါကြောင့် exception တိုင်းကို owner နဲ့အတူ စာရင်း တစ်ခုတည်းမှာ ထားပါတယ်၊ အဖွဲ့ သုံးဖွဲ့က model server မျိုး တောင်းထားတာ မြင်ရတော့ platform အဖွဲ့က အဲဒါကို နောက် golden path အဖြစ် ဆောက်ပေးပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "CNCF Platforms White Paper",
          url: "https://tag-app-delivery.cncf.io/whitepapers/platforms/",
        }
      - {
          title: "DORA capability: Platform engineering",
          url: "https://dora.dev/capabilities/platform-engineering/",
        }
    actions:
      - { id: show-p05, type: slide.show, at: { mark: show-p05 }, slideId: l25-p05 }
      - { id: show-p05b, type: slide.show, at: { mark: show-p05b }, slideId: l25-p05b }

  - id: old-systems
    chapter: "System ဟောင်းတွေအတွက် စည်းမျဉ်း အသစ်"
    narration: >
      [[mark:close-p05b]] [[mark:b4-s1]] lesson ၂၂ က restore drill ၇ နာရီ ကြာခဲ့လို့ Padauk က ငွေ database တိုင်းမှာ ရက် ၉၀ အတွင်း အောင်မြင်တဲ့ restore test ရှိရမယ် ဆိုတဲ့ စည်းမျဉ်းကို owner မသီရိ၊ အကြောင်းပြချက်နဲ့ နှစ်စဉ် ပြန်သုံးသပ်မယ့် ရက်နဲ့အတူ ရေးပါတယ်။ [[mark:b4-s1b]] service အသစ်တွေကတော့ restore test မပါရင် merge လုပ်လို့ မရပါဘူး။
      [[mark:b4-s2]] service ဟောင်း ၃၅ ခုကိုတော့ ချက်ချင်း block မလုပ်ဘဲ owner နဲ့ ကုန်ဆုံးရက် ပါတဲ့ ယာယီ ခွင့်ပြုချက်၊ exemption ကို ပေးပါတယ်။ ကုန်ဆုံးရက်က risk ပေါ် မူတည်ပြီး ledger က သတ်မှတ်ရက်အထိ၊ merchant service တွေက နောက် အပြောင်းအလဲကြီးအထိ ရပါတယ်။ ပိတ်တော့မယ့် SMS gateway ဟောင်းကိုတော့ ခေါင်းဆောင်တွေက risk ကို လက်ခံကြောင်း သုံးလ တစ်ခါ ပြန်လက်မှတ်ထိုးပါတယ်။
      [[mark:b4-s3]] ညတိုင်း run တဲ့ check က အဖွဲ့ scorecard တွေနဲ့ exception စာရင်းကို update လုပ်ပြီး ပြင်စရာကို ticket၊ အသင့်ရေးထားတဲ့ pull request ဒါမှမဟုတ် ဘေးကင်းရင် အလိုအလျောက် ပြင်တာနဲ့ ဖြေရှင်းပါတယ်။ [[mark:b4-s3b]] ခေါင်းဆောင် report မှာ ငွေ database ခြောက်ခုကို restore တစ်ခါမှ မစမ်းဖူးတာ မြင်ရတော့ ကိုနေလင်းက restore sprint ကို ခွင့်ပြုပါတယ်၊ ခေါင်းဆောင်တွေက ကုန်ကျစရိတ်ထက် မသိရတဲ့ risk ကို ပိုကြောက်လို့ပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "DORA capability: Platform engineering",
          url: "https://dora.dev/capabilities/platform-engineering/",
        }
      - {
          title: "CNCF Platform Engineering Maturity Model",
          url: "https://tag-app-delivery.cncf.io/whitepapers/platform-eng-maturity-model/",
        }
    actions:
      - { id: close-p05b, type: slide.close, at: { mark: close-p05b, offsetMs: -400 } }
      - id: b4-s1
        type: whiteboard.apply
        at: { mark: b4-s1 }
        open: true
        clear: true
        upsertIds: [l25-b4-title]
      - id: b4-s1-draw
        type: whiteboard.apply
        at: { afterAction: b4-s1 }
        upsertIds: [l25-b4-new, l25-b4-new-t]
        drawMs: 1400
      - id: b4-s1b
        type: whiteboard.apply
        at: { mark: b4-s1b }
        upsertIds: [l25-b4-a1, l25-b4-block, l25-b4-block-t1, l25-b4-block-t2]
        drawMs: 1800
      - id: b4-s2
        type: whiteboard.apply
        at: { mark: b4-s2 }
