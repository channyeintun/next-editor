  - id: recap
    narration: >
      [[mark:close-p06]] [[mark:open-notes]] Module ၅ ရဲ့ နောက်ဆုံး notes ပါ။ [[mark:sel-golden-path]] golden path က လိုက်သွားရုံနဲ့ reliability ပါလာတဲ့ standard လမ်းပါ၊ [[mark:sel-escape-hatch]] escape hatch က default နဲ့ မကိုက်ရင် ခွင့်ပြုချက်နဲ့ ထွက်တဲ့ လမ်းပါ။ [[mark:sel-break-glass]] break-glass က အရေးပေါ်မှာ check ကို ကျော်ပေမဲ့ log ကျန်ပြီး နောက်မှ review လုပ်ရတဲ့ လမ်းပါ။
      [[mark:sel-shift-down]] shift down က reliability အလုပ်ကို platform ထဲမှာ တစ်ခါတည်း ဆောက်ပေးတာ ဖြစ်ပြီး၊ [[mark:sel-right-sized]] လိုသလောက် တင်းကျပ်မှုက စစ်ဆေးမှုကို အမှားရဲ့ ထိခိုက်မှုနဲ့ ကိုက်အောင် ချိန်ညှိတာပါ။ [[mark:sel-exemption]] exemption ကတော့ owner၊ အကြောင်းပြချက်နဲ့ ကုန်ဆုံးရက် ပါတဲ့ ယာယီ ခွင့်ပြုချက်ပါ။ [[mark:ask-question]] စည်းမျဉ်း တစ်ခုက wiki ပေါ်မှာပဲ ရှိနေတယ် ဆိုရင် အဲဒါကို golden path ထဲ ထည့်ဆောက်ဖို့ နည်း တစ်ခု ပြောကြည့်ပါ။
      [[mark:pause-question]] စည်းမျဉ်းနဲ့ ကိုက်ပြီးသား default တစ်ခု၊ template ထဲက check တစ်ခု ဒါမှမဟုတ် merge ကို block လုပ်တာ ဘယ်ဟာမဆို ရပါတယ်။ Module ၆ ရောက်တော့ coding agent တွေ ပါလာပြီး merge တွေက တစ်ရက်ကို ၁၅ ကနေ ၁၂၀ အထိ ခုန်တက်သွားပါတယ်။ SRE အလုပ်မှာ ဘာတွေ ပြောင်းသွားမလဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "CNCF Platforms White Paper",
          url: "https://tag-app-delivery.cncf.io/whitepapers/platforms/",
        }
      - {
          title: "DORA capability: Platform engineering",
          url: "https://dora.dev/capabilities/platform-engineering/",
        }
    actions:
      - { id: close-p06, type: slide.close, at: { mark: close-p06 } }
      - {
          id: open-notes,
          type: workspace.openFile,
          at: { mark: open-notes, offsetMs: 300 },
          path: notes.md,
        }
      - {
          id: sel-golden-path,
          type: editor.select,
          at: { mark: sel-golden-path },
          target: { file: notes.md, text: "golden path", occurrence: 1 },
        }
      - {
          id: sel-escape-hatch,
          type: editor.select,
          at: { mark: sel-escape-hatch },
          target: { file: notes.md, text: "escape hatch", occurrence: 1 },
        }
      - {
          id: sel-break-glass,
          type: editor.select,
          at: { mark: sel-break-glass },
          target: { file: notes.md, text: break-glass, occurrence: 1 },
        }
      - {
          id: sel-shift-down,
          type: editor.select,
          at: { mark: sel-shift-down },
          target: { file: notes.md, text: "shift down", occurrence: 1 },
        }
      - {
          id: sel-right-sized,
          type: editor.select,
          at: { mark: sel-right-sized },
          target: { file: notes.md, text: "လိုသလောက် တင်းကျပ်မှု", occurrence: 1 },
        }
      - {
          id: sel-exemption,
          type: editor.select,
          at: { mark: sel-exemption },
          target: { file: notes.md, text: exemption, occurrence: 1 },
        }
      # The voice script's ⟪select မေးခွန်း⟫ and ⟪pause 3s⟫, as in lessons 5, 16 and 22. ask-question
      # (the ⟪select မေးခွန်း⟫ marker) starts the question's own dialog, so the question-line
      # select hangs off it with an offset: it starts as the question nears its end, its drag
      # runs in silence, and the answer at pause-question waits for it (the scheduler holds only
      # the dialog after the select's anchor). The question is 108 characters, so 7500 (about
      # 400 + 108 x 70 - 460) leaves about 2.6 / 1.0 / 0.35 s of quiet before the answer at
      # 55 / 70 / 95 ms per char; an offset above ~7600 trips compile-check's 2.5 s
      # inserted-silence warning at 55.
      - id: select-question
        type: editor.select
        at: { mark: ask-question, offsetMs: 7500 }
        target:
          file: notes.md
          text: "မေးခွန်း: wiki ပေါ်မှာပဲ ရှိတဲ့ စည်းမျဉ်းကို golden path ထဲ ထည့်ဆောက်ဖို့ နည်း တစ်ခု ပြောပါ။"
          occurrence: 1

checks:
  # 500, not 300: google-svg deck pages stall the main thread at show/close.
  - { type: timing.p95Ms, max: 500 }
