  - id: template-no
    chapter: "Template က ငြင်းတဲ့နေ့"
    narration: >
      [[mark:show-p03]] ဒါပေမဲ့ တစ်နေ့မှာ Top-up developer တစ်ယောက်က မြန်မြန် ထုတ်ချင်လို့ canary အဆင့်ကို ဖြုတ်ပြီး rollback plan လည်း မရေးခဲ့ပါဘူး။ rollback plan မပါလို့ editor ထဲမှာတင် warning ပေါ်လာပြီး canary မပါလို့ merge လုပ်တော့ block ခံရပါတယ်။ incident မှာ အမြန် ပြင်ရရင်တော့ check တွေကို ကျော်ခွင့်ပေးတဲ့ break-glass လမ်း ရှိပေမဲ့ သုံးတိုင်း log ကျန်ပြီး နောက်နေ့ review လုပ်ရပါတယ်။
      [[mark:show-p03b]] check တိုင်းက linter လိုပဲ ဘယ် စည်းမျဉ်းကို ချိုးမိလဲ ပြောပြီး ပြင်နည်းကိုပါ အကြံပေးပါတယ်။ check အများစုက warning ပဲ ပေးပြီး ခြွင်းချက် မရှိနိုင်တဲ့ စည်းမျဉ်းကျမှ block လုပ်ပါတယ်။ အကောင်းဆုံးကတော့ default အတိုင်း ထားရုံနဲ့ စည်းမျဉ်းနဲ့ ကိုက်ပြီးသား ဖြစ်နေတာပါ။
      [[mark:show-p03c]] ရေးရခက်တဲ့ reliability code ကိုလည်း platform ထဲမှာ တစ်ခါတည်း ရေးထားပါတယ်။ gateway ခေါ်တဲ့ service တွေက retry code ကို ကိုယ်တိုင် မရေးဘဲ timeout၊ backoff with jitter၊ retry budget နဲ့ circuit breaker ပါတဲ့ shared gateway client ကို သုံးလို့ client ပြင်တိုင်း redeploy လုပ်ရုံနဲ့ အကုန် ရပါတယ်။ ဒါပေမဲ့ bug ပါရင်လည်း နေရာတိုင်း ရောက်မှာမို့ platform အဖွဲ့က ကိုယ့် ပြောင်းလဲမှုကို service တစ်ခု၊ zone တစ်ခုမှာ အရင် canary လုပ်ပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
