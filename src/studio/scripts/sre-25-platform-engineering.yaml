  - id: shift-down
    chapter: "Shift left နဲ့ shift down"
    narration: >
      [[mark:close-p03c]] [[mark:b3-s1]] အရင်က Padauk က reliability ကို design အဆင့်ကတည်းက စောစော စဉ်းစားဖို့ အဖွဲ့တိုင်းကို တောင်းခဲ့ပါတယ်၊ ဒါကို shift left လို့ ခေါ်ပါတယ်။ [[mark:b3-s1b]] ဒါပေမဲ့ ဒါတစ်ခုတည်းဆိုရင် အဖွဲ့တိုင်းက retry၊ rollout၊ SLO အကုန် ကျွမ်းကျင်ရမယ်၊ မဟုတ်ရင် Site Reliability Engineering၊ SRE အဖွဲ့ဆီမှာ တန်းစီ စောင့်ရပါမယ်။ engineer ၆၀ လောက်ကို SRE လေး ငါး ယောက်နဲ့ လိုက်မမီပါဘူး။
      [[mark:b3-s2]] shift down ကတော့ အဲဒီ အလုပ်တွေကို shared gateway client လိုပဲ ကျွမ်းကျင်သူတွေက platform ထဲမှာ တစ်ခါ ဆောက်ပေးလို့ အဖွဲ့တိုင်းက အဲဒီပေါ်မှာ ရပ်ရုံပါပဲ။ ကိုယ်ပိုင် SRE မရှိတဲ့ service သေးသေးတွေတောင် reliability အခြေခံကို အလိုလို ရလာပါတယ်။
      [[mark:b3-s3]] ဒါဆို shift left ကို ရပ်ရမလား ဆိုတော့ မဟုတ်ပါဘူး။ စောစော စဉ်းစားတာကို ဆက်လုပ်ပြီး အဲဒီ အလုပ်ကို platform မှာ မျှသုံးတာမို့ နှစ်ခုလုံး တွဲသုံးရပါတယ်။
    sources:
