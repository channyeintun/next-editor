  - id: golden-path
    chapter: "Desire path ကနေ golden path ဆီ"
    narration: >
      [[mark:close-p02b]] [[mark:b2-s1]] platform အဖွဲ့က ဘာကိုမှ မပိတ်ပင်ခင် engineer တွေ တကယ် ဘာသုံးနေလဲ အရင် ကြည့်ပါတယ်။ Viber group ထဲမှာ လူတိုင်း ကူးသုံးနေတဲ့ bash script တစ်ခု ရှိပြီး server တစ်လုံးမှာ အရင် deploy လုပ်ပြီး ငါးမိနစ် စောင့်ကြည့်တဲ့ ဉာဏ်ကောင်းတဲ့ နည်းလေး ပါပါတယ်။ လူတွေ တကယ် လျှောက်နေတဲ့ တရားဝင် မဟုတ်တဲ့ ဒီလမ်းကို desire path လို့ ခေါ်ပါတယ်။
      [[mark:b2-s2]] အဲဒီ နည်းလေးကို template အသစ်ထဲ ထည့်ပြီး template က ဘယ်အဖွဲ့ ပိုင်လဲ ဆိုတာလို မေးခွန်း လေးခုပဲ မေးပါတယ်။ [[mark:b2-s2b]] ထွက်လာတဲ့ service မှာ traffic နည်းနည်းကို version အသစ်ဆီ အရင်ပို့တဲ့ canary၊ အလိုအလျောက် rollback နဲ့ service level objective၊ SLO ကို ပြတဲ့ dashboard ပါပြီးသားပါ။ လိုက်သွားရုံနဲ့ reliability ပါလာတဲ့ ဒီ standard လမ်းက golden path ပါ။
      [[mark:b2-s3]] repository အသစ်ကနေ ပထမ deploy အထိ သုံးပတ် ကြာရာက တစ်ရက်ပဲ ကြာတော့ပါတယ်။ [[mark:b2-s3b]] config က အဖွဲ့ရဲ့ repository ထဲမှာ ရှိလို့ incident ဖြစ်ရင် ဖွင့်ဖတ်လို့ရပြီး ထူးခြားတဲ့ လိုအပ်ချက်အတွက် ခွင့်ပြုချက်နဲ့ ထွက်လို့ရတဲ့ escape hatch လည်း ရှိပါတယ်။ ဒါကြောင့် အဖွဲ့တွေက အပြစ်ပေးမှာ ကြောက်လို့ မဟုတ်ဘဲ အလွယ်ဆုံးမို့ ကိုယ့်ဆန္ဒနဲ့ ပြောင်းလာကြပါတယ်။
      [[mark:close-b2]] [[mark:show-p02c]] platform က လိုအပ်ချက်တင် မကဘဲ ထိန်းပေးတဲ့ ဖြေရှင်းနည်း အနည်းငယ်ကိုပါ ပေးပြီး ရွေးစရာကို နည်း သုံးမျိုးနဲ့ ကန့်သတ်ပါတယ်။ အကြောင်းပြချက် မရှိရင် Postgres ကိုပဲ သုံးတာက strong default၊ Postgres ဒါမှမဟုတ် Postgres နဲ့ Redis cache ထဲက ရွေးတာက menu သေးသေးလေး ဖြစ်ပြီး SSH နဲ့ deploy လုပ်တာကိုတော့ ဖယ်လိုက်ပါတယ်။ ဒီတော့ အဖွဲ့တွေက dashboard tool ကို မငြင်းခုံတော့ဘဲ ဘယ် SLO က user နဲ့ ကိုက်လဲ ဆွေးနွေးလာကြပါတယ်။
    sources:
