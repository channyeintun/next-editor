  - id: platform-exists
    chapter: "Platform က ရှိပြီးသားပါ"
    narration: >
      [[mark:close-b1]] [[mark:show-p02]] deploy၊ run၊ monitoring နဲ့ data သိမ်းတာအတွက် မျှသုံးတဲ့ ဒီ အလွှာက platform ပါ။ tool တွေတင် မကဘဲ သုံးကြပုံ အလေ့အထတွေပါ ပါလို့ tool ဝယ်ရုံနဲ့ platform မရပါဘူး။ ကုမ္ပဏီတိုင်းမှာ platform ရှိပြီးသားပါ၊ design လုပ်ထားလား၊ မတော်တဆ ဖြစ်လာတာလား ဆိုတာပဲ ကွာပါတယ်။
      [[mark:show-p02b]] Padauk ရဲ့ script တွေ၊ Viber group နဲ့ wiki ကလည်း အဖွဲ့ချင်း ကိုယ့်အတွက် ဆုံးဖြတ်ချက်တွေ စုလာရင်း မတော်တဆ ဖြစ်လာတဲ့ platform ပါပဲ။ ဒါကြောင့် ကိုနေလင်းက engineer တွေကို user အဖြစ် သဘောထားပြီး platform ကို product တစ်ခုလို ဆောက်ဖို့ မသီရိရဲ့ အဖွဲ့ကို တာဝန်ပေးပါတယ်၊ ဒါကို platform engineering လို့ ခေါ်ပါတယ်။
