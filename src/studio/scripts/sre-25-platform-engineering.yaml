      notes.md: |
        # မှန်တဲ့နည်းကို လွယ်တဲ့နည်း ဖြစ်အောင်

        - golden path — လိုက်သွားရုံနဲ့ reliability ပါလာတဲ့ standard လမ်း
        - escape hatch — default နဲ့ မကိုက်ရင် ခွင့်ပြုချက်နဲ့ ထွက်တဲ့ လမ်း
        - break-glass — အရေးပေါ်မှာ ကျော်၊ log ကျန်၊ နောက်မှ review
        - shift down — ကျွမ်းကျင်သူက platform ထဲမှာ တစ်ခါ ဆောက်၊ အားလုံး ရ
        - လိုသလောက် တင်းကျပ်မှု — အမှားရဲ့ ထိခိုက်မှုနဲ့ ကိုက်တဲ့ စစ်ဆေးမှု: Playground · Light · Standard · Strict
        - exemption — owner၊ အကြောင်းပြချက်၊ ကုန်ဆုံးရက် ပါတဲ့ ယာယီ ခွင့်ပြုချက်

        မေးခွန်း: wiki ပေါ်မှာပဲ ရှိတဲ့ စည်းမျဉ်းကို golden path ထဲ ထည့်ဆောက်ဖို့ နည်း တစ်ခု ပြောပါ။
