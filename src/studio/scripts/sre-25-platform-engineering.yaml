  - id: this-week
    narration: >
      [[mark:close-b4]] [[mark:show-p06]] ကိုယ့်ကုမ္ပဏီရဲ့ မတော်တဆ platform ကို ဒီအပတ် ဒီလို စပြင်ကြည့်ပါ။ လူတိုင်း ကူးသုံးနေတဲ့ script ကို ရှာပြီး ဘာကြောင့် သုံးကြလဲ မေးကြည့်ပါ။ wiki ပေါ်မှာပဲ ရှိတဲ့ စည်းမျဉ်း တစ်ခုကို pipeline ထဲက check တစ်ခု ဖြစ်အောင် ပြောင်းပါ။ ပြီးတော့ ကိုယ့် exception တွေကို စာရင်း တစ်ခုတည်းမှာ စုရေးပါ။
