# SRE from zero, lesson 25: Platform engineering (Burmese concept lesson).
#
# Built from the approved voice script
# docs/sre-course/voice-scripts/sre-25-platform-engineering.md. Every spoken
# character is that script's "> " lines, unchanged; each ⟪…⟫ marker became a
# [[mark:…]] at the same place. Check it with:
#   bun ~/Documents/sre-course/work/check-narration.ts \
#     docs/sre-course/voice-scripts/sre-25-platform-engineering.md \
#     src/studio/scripts/sre-25-platform-engineering.yaml
#
# Nothing runs: deck pages and the whiteboard carry the lesson, and notes.md is
# the recap. The workspace and runtime follow the validated no-code skeleton
# (WebContainer, empty init command, a harmless dev script).
#
# Nine marks add no spoken text and sit at an existing ။:
# - hook-split and p05-split split the hook's narration and l25_p05's narration
#   at their paragraph breaks (one 483- or 468-character dialog would pass the
#   450-character limit; no action uses them).
# - b1-s1b lands B1's freeze rule, bus and Wallet's check on the sentence that
#   names the rule, after the three scripts of the sentence before; the two red
#   ✗ then land with the words "ကျန်တဲ့ နှစ်ဖွဲ့က" (b1-s1c hangs off b1-s1b with
#   an offset, as lesson 16 does for its select), so the check and the crosses
#   do not all arrive together.
# - b1-s3b adds the last two services of the shared platform (Eats, rider) on the
#   sentence that says new teams inherit the rule on day one, so no step adds
#   more than three labelled boxes.
# - b2-s2b lands B2's green "service with canary, auto-rollback, SLO dashboard" on
#   the sentence that says what comes out of the template (the template and its
#   arrow land with the sentence before), and b2-s3b lands the escape hatch on
#   the sentence that names it, after "3 weeks → 1 day" lands with the first.
# - b3-s1b lands the red "retry · rollout · SLO" label and the SRE queue box on
#   the sentence that says teams must master everything or wait in line.
# - b4-s1b lands the red "block" box on the sentence about new services, and
#   b4-s3b lands the violet "6 databases never restored" label on the sentence
#   that says the leader report shows it.
# b3-s2b is not a mark: the three teams standing on the slab are an apply
# chained after the slab (afterAction), so the slab lands first. Likewise
# b4-s1-draw is chained after b4-s1, which opens and clears the board with B4's
# title alone and no drawMs (furniture, as lesson 5 does for its board titles);
# the first box is then drawn in.
# ask-question is the voice script's ⟪select မေးခွန်း⟫, which already starts the
# question's own dialog, so the question-line select hangs off it for the
# ⟪pause 3s⟫ (see select-question), as in lessons 5 and 16.
#
# Pacing (70 ms per character): the longest a page or board stays up is the
# cover l25_p01 at about 36 s (the hook's 483 characters, which include the
# 2 s opening handle), then l25_p05 at about 34 s and l25_p03c at about 30 s;
# every other page or board step changes within 30 s. The voice script already
# carries the continuation pages (l25_p02b, l25_p02c, l25_p03b, …), so no pacing
# page or step beyond the marks above was added.
#
# A board followed by a deck page closes the panel (open: false) 400 ms before
# the page, and a deck page followed by a board closes the page 400 ms before,
# as in Module 1; pages that follow each other advance in place. Every board
# opens with open + clear. B1's last step is a second wipe (clear) inside the
# open board: the "shared deploy platform" diagram redraws the same comb, so the
# four services keep their places and get their checks.
#
# Boards (B1 P2 comb, B2 P1 flow, B3 P6 lanes, B4 two P6 lanes merging). Colour
# jobs: #1e1e1e ink (paints white) for buses, arrows and B4's title; blue the thing
# named (the freeze rule, the rider service, the shared platform, the template,
# the teams, old and new services); green healthy or done (Wallet's script and
# every check, the golden-path service, the platform slab, the scorecard); red
# failure (Top-up's and Eats's scripts, the ✗, the load each team carries, the
# block on new services); orange the caveat or limit (the Viber script, the
# escape hatch, the SRE queue, the exemption); violet the result (3 weeks to 1
# day, "both", the 6 databases and the restore sprint). A label on two lines is
# one text asset per line, so each line meets the 0.55 em width rule on its own;
# every label was also measured in Chrome with Excalidraw's Virgil font
# (wb-fit.mjs) and stays inside its box and inside x 1100.
# B1 and B2 run left to right. B3 keeps the voice script's two lanes (teams in
# a row on top and on the slab below). B4 runs as two top-to-bottom lanes side
# by side, because the arrow-down of each lane has to reach the scorecard
# under both without crossing the other lane. B1's "?" for the rider service and
# the ✗ marks are small text assets (the board has no cross stroke).
#
# Deck pages: deck "Next Editor · SRE 5C · Design and platforms", published; the
# /pub URL below is final. Its l25 pages are built later from the page plan, so
# until then the Director reports page "l25_p01" missing from the published deck
# (with the deck URL swapped for an unreachable one it validates). The voice
# script asks for l25_p05b as an ordinary compare (left gray, right teal). The
# voice script's cover title is 36 code points, over the kit's 34, so the cover
# page drops the particle ကို (33; the page plan notes it); the lesson title
# here is unchanged. Page plan:
# ~/Documents/sre-course/work/pages/sre-25-platform-engineering.json
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/sre-25-platform-engineering.yaml
#   bun scripts/studio-compile-check.ts src/studio/scripts/sre-25-platform-engineering.yaml
