build:
  # Studio swaps in the Burmese voice chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 2625

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: hook
    chapter: "Freeze အတွင်း ထွက်သွားတဲ့ deploy"
    narration: >
      [[mark:show-p01]] သင်္ကြန် ညနဲ့ login ပိတ်တဲ့ မနက်က သင်ခန်းစာတွေကြောင့် priority label၊ error budget နဲ့ ပြက္ခဒိန်ကို ကြည့်တဲ့ ပြောင်းလဲမှု စည်းကမ်းနဲ့ အရေးပေါ် အိတ်တွေက Padauk ရဲ့ ပုံမှန် ဖြစ်လာပါတယ်။
      [[mark:hook-split]] ဒါပေမဲ့ နောက်တစ်နှစ်မှာ rollout တွေ ရပ်ထားရမယ့် သင်္ကြန် change freeze အတွင်း Top-up deploy တစ်ခု ထွက်သွားပြီး Wallet က သင်ခန်းစာ ယူပြီးသား outage မျိုး ထပ်ဖြစ်ပါတယ်။ wiki ပေါ်မှာပဲ ရှိတဲ့ freeze စည်းကမ်းက Wallet ရဲ့ script ထဲကိုပဲ ရောက်ခဲ့လို့ပါ။ မှန်တဲ့နည်းကို လွယ်တဲ့နည်း ဖြစ်အောင် ဘယ်လို လုပ်မလဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "CNCF Platforms White Paper",
          url: "https://tag-app-delivery.cncf.io/whitepapers/platforms/",
        }
      - {
          title: "DORA capability: Platform engineering",
          url: "https://dora.dev/capabilities/platform-engineering/",
        }
    actions:
      - { id: collapse-dock, type: runtime.collapseDock, at: { scene: start, offsetMs: -1750 } }
      - {
          id: show-p01,
          type: slide.show,
          at: { mark: show-p01, offsetMs: -1450 },
          slideId: l25-p01,
        }

  - id: one-rule
    chapter: "စည်းကမ်း တစ်ခု၊ script အများကြီး"
    narration: >
      [[mark:close-p01]] [[mark:b1-s1]] Wallet၊ Top-up နဲ့ Eats အဖွဲ့တွေမှာ ကိုယ်ပိုင် deploy script တစ်ခုစီ ရှိပါတယ်။ [[mark:b1-s1b]] freeze စည်းကမ်း ထွက်လာတော့ Wallet က ပြက္ခဒိန် စစ်တဲ့ check ကို ကိုယ့် script ထဲ ထည့်ခဲ့ပေမဲ့ ကျန်တဲ့ နှစ်ဖွဲ့က wiki ကို ဖတ်ပြီး မှတ်ထားရုံပဲ ရှိလို့ Top-up က မေ့သွားတာပါ။
      [[mark:b1-s2]] ပိတ်ရက်မှာ ရေးခဲ့တဲ့ rider service အသစ်ရဲ့ pipeline ကတော့ စည်းမျဉ်း တစ်ခုမှ မသိပါဘူး။ ကုမ္ပဏီ ကြီးလာလေ tool တွေ များလာလေ ဖြစ်ပြီး စာပေါ်က စည်းမျဉ်းက နောက်ကျမှ ရောက်သလို tool အသစ်တွေကလည်း သင်ခန်းစာ ဟောင်းတွေကို မသိပါဘူး။ ဒါကြောင့် outage အများစုက သင်ပြီးသား ပုံစံကိုပဲ ပြန်ထပ်တာပါ။
      [[mark:b1-s3]] ဒီတော့ Padauk က deploy နဲ့ config ပြောင်းတာလို အန္တရာယ်ရှိတဲ့ ပြောင်းလဲမှု တစ်မျိုးစီအတွက် အဖွဲ့တိုင်း မဖြစ်မနေ သုံးရမယ့် shared platform တစ်ခုစီ ရွေးပါတယ်။ [[mark:b1-s3b]] စည်းမျဉ်းက နေရာ တစ်ခုတည်းမှာ ရှိလို့ အဖွဲ့ အသစ်တွေလည်း ပထမနေ့ကတည်းက အလိုလို ရပါတယ်။ ပြောင်းရွှေ့ရတာ အလုပ်ပိုလို့ ဘယ်သူမှ မကြိုက်ပေမဲ့ ကိုနေလင်းက ကိုယ်တိုင် ထောက်ခံပြီး အကြောင်းရင်းကို ရှင်းပြပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "CNCF Platforms White Paper",
          url: "https://tag-app-delivery.cncf.io/whitepapers/platforms/",
        }
      - {
          title: "DORA capability: Platform engineering",
          url: "https://dora.dev/capabilities/platform-engineering/",
        }
    actions:
      - { id: close-p01, type: slide.close, at: { mark: close-p01, offsetMs: -400 } }
      - id: b1-s1
        type: whiteboard.apply
        at: { mark: b1-s1 }
        open: true
        clear: true
        upsertIds: [l25-b1-w, l25-b1-w-t, l25-b1-t, l25-b1-t-t, l25-b1-e, l25-b1-e-t]
        drawMs: 2000
      - id: b1-s1b
        type: whiteboard.apply
        at: { mark: b1-s1b }
        upsertIds:
          [
            l25-b1-rule,
            l25-b1-rule-t1,
            l25-b1-rule-t2,
            l25-b1-a0,
            l25-b1-bus,
            l25-b1-a-w,
            l25-b1-a-t,
            l25-b1-a-e,
            l25-b1-ok,
          ]
        drawMs: 2600
      - id: b1-s1c
        type: whiteboard.apply
        at: { mark: b1-s1b, offsetMs: 6440 }
        upsertIds: [l25-b1-no-t, l25-b1-no-e]
        drawMs: 900
      - id: b1-s2
        type: whiteboard.apply
