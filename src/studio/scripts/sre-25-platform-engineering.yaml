  - id: right-sized
    chapter: "လိုသလောက် တင်းကျပ်မှု"
    narration: >
      [[mark:close-b3]] [[mark:show-p04]] platform က service တိုင်းကို တစ်ပုံစံတည်း မစစ်ပါဘူး။ hackathon app တွေက Playground မှာ ကြိုက်တဲ့အချိန် deploy လုပ်နိုင်ပေမဲ့ customer data ကို မထိရပါဘူး။ Eats ရဲ့ menu service လိုဟာတွေက Light မှာ warning ပဲ ရပြီး service အများစုက Standard မှာ canary နဲ့ SLO check ကို ဖြတ်ရပါတယ်။ ledger နဲ့ ငွေ ရွှေ့တဲ့ system တွေကတော့ Strict မှာ လူ နှစ်ယောက် review လုပ်မှ ပြောင်းရပါတယ်။
      [[mark:show-p04b]] စစ်ဆေးမှုကို အမှားရဲ့ ထိခိုက်မှုနဲ့ ကိုက်အောင် ချိန်ညှိတာကို လိုသလောက် တင်းကျပ်မှုလို့ ခေါ်ပါမယ်။ ဒါက တက်ရမယ့် လှေကား မဟုတ်ပါဘူး။ hackathon ကို Strict နဲ့ ထိန်းရင် စမ်းသပ်မှု ရပ်သွားပြီး ledger ကို Playground မှာ ထားရင် အန္တရာယ် ကြီးပါတယ်။ ဒါကြောင့် ကုမ္ပဏီ တစ်ခုထဲမှာ လေးဆင့်လုံး တစ်ပြိုင်နက် ရှိနေတာ ပုံမှန်ပါ။
    sources:
