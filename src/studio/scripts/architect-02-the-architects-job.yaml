        at: { mark: turn, offsetMs: 2200 }
        target:
          file: notebook/02-decisions-this-week.md
          text: "| လက်မှတ် PDF ထုတ်တဲ့ function ကို နှစ်ခု ခွဲမလား | design | file တစ်ခုထဲမှာပဲ ပြီးတယ် |\n| ခရီးစဉ် စာရင်းကို ထွက်ချိန်အလိုက် စီမလား | design | Search ထဲမှာပဲ ပြီးတယ်၊ ပြန်ပြောင်းရ လွယ်တယ် |\n| SMS ကို နောက်ကွယ်ကနေ ပို့မလား | အလယ် |"

  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ architecture ကို ကြည့်ပေးတယ် ဆိုတာ အရာရာကို ကိုယ်တိုင်
      ဆုံးဖြတ်တာလည်း မဟုတ်၊ code ကို စွန့်လိုက်တာလည်း မဟုတ်ပါဘူး။ ဆုံးဖြတ်တာ၊ စောင့်ကြည့်တာနဲ့
      ချိတ်ဆက်တာ ဆိုတဲ့ အလုပ် သုံးမျိုးပါ။
      [[mark:recap-2]] ဘယ်ဆုံးဖြတ်ချက်က ကိုယ့်တာဝန်လဲ ဆိုတာကိုတော့ ဘယ်နှယောက်ကို ထိမလဲ၊ ပြန်ပြောင်းရ
      ဘယ်လောက် ကုန်မလဲ၊ trade off ဘယ်လောက် ကြီးလဲ ဆိုတဲ့ မေးခွန်း သုံးခုနဲ့ ခွဲကြည့်နိုင်ပါတယ်။
      [[mark:next]] နောက် lesson မှာတော့ ထိုင်ခုံတွေကို နှစ်ခါ မရောင်းမိအောင် ကာမယ့် နည်းလမ်း နှစ်ခုကို
      ယှဉ်ကြည့်ရင်း၊ ဆုံးဖြတ်ချက်တိုင်းမှာ ပါလာတဲ့ trade off ကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions: []

