  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ ဒီ နှစ်ခုထဲက ဘယ်ဟာက architect တာဝန်ယူရမယ့် ဆုံးဖြတ်ချက်
      ဖြစ်မလဲ။
      [[mark:q-a]] ပထမ တစ်ခုက ကားလိုင်းတွေ သုံးတဲ့ operator screen ကို ဆောက်ဖို့ ဘယ် UI library ကို သုံးမလဲ
      ဆိုတာပါ။
      [[mark:q-b]] ဒုတိယ တစ်ခုကတော့ ကားဂိတ်မှာ internet ပြတ်သွားလည်း ကောင်တာ ဝန်ထမ်းက လက်မှတ် ဆက်ရောင်းလို့
      ရရမယ် ဆိုတာပါ။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ တစ်ခုပါ။ ဘာကြောင့်လဲဆိုတော့ internet မရှိဘဲ ရောင်းလို့ရရမယ်
      ဆိုတာနဲ့ ထိုင်ခုံ data ကို ဘယ်မှာ ထားမလဲ၊ ကောင်တာနဲ့ app ကြား ဘယ်လို ပြန်ညှိမလဲ ဆိုတာတွေ အကုန်
      ပြောင်းသွားလို့ပါ။
      [[mark:q-r]] ဒါက system ရဲ့ ဖွဲ့စည်းပုံကို ပြောင်းစေတဲ့ အရည်အသွေးမျိုးပါ။ ကိုယ်က တာဝန်မယူရင်
      ဘယ်သူမှ ယူမှာ မဟုတ်ပါဘူး။ UI library ကိုတော့ နေ့တိုင်း သုံးရမယ့် developer တွေက အသိဆုံးပါ။
      ကိုယ့်ဘက်က လမ်းညွှန်ချက် ပေးထားနိုင်ပေမဲ့၊ ဘယ်ဟာလဲ ဆိုတာကိုတော့ team က ရွေးပါတယ်။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-reason,
          type: whiteboard.apply,
          at: { mark: q-r },
          upsertIds: [q-r],
          drawMs: 1000,
        }

  - id: your-turn
    chapter: ကိုယ့် system အတွက်
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ဒီ table ထဲမှာ ကိုယ့် project အတွက်
      ပြီးခဲ့တဲ့ တစ်လအတွင်း ချခဲ့တဲ့ ဆုံးဖြတ်ချက် သုံးခုကို ရေးကြည့်ပါ။ တစ်ခုစီအတွက် မေးခွန်း သုံးခုကို
      မေးပြီး design လား၊ architecture လား၊ အလယ်မှာလား ဆိုတာ ဖြည့်ပါ။
      [[mark:turn-2]] architecture ဘက် ရောက်နေတဲ့ ဆုံးဖြတ်ချက်ကို ဘယ်သူမှ သတိမထားမိဘဲ ချခဲ့တာမျိုး တွေ့ရင်၊
      အဲဒါက ကိုယ် ပထမဆုံး ပြန်ကြည့်ရမယ့် နေရာပါပဲ။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
