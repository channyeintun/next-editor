  - id: table
    chapter: ဒီအပတ် ဆုံးဖြတ်စရာ ငါးခု
    narration: >
      [[mark:t-close]] ဒီ မျဉ်းကို ခရီးဖော် မှာ ဒီအပတ် ပေါ်လာတဲ့ ဆုံးဖြတ်စရာ ငါးခုနဲ့ စမ်းကြည့်ရအောင်။
      [[mark:type-r1]] ပထမ တစ်ခုက လက်မှတ် PDF ထုတ်တဲ့ function ကြီးကို နှစ်ခု ခွဲမလား ဆိုတာပါ။ file
      တစ်ခုထဲမှာပဲ ပြီးတာမို့ design ပါ။ ရေးတဲ့သူ ဆုံးဖြတ်လိုက်ရုံပါပဲ။
      [[mark:type-r2]] ဒုတိယက ခရီးစဉ် စာရင်းကို ထွက်ချိန်အလိုက် စီပြမလား ဆိုတာပါ။ ရှာတဲ့အပိုင်း
      တစ်ခုတည်းနဲ့ပဲ ဆိုင်ပြီး၊ မကြိုက်ရင် နောက်နေ့ ပြန်ပြောင်းလို့ ရတာမို့ ဒါလည်း design ပါပဲ။
      [[mark:type-r3]] တတိယကတော့ SMS ကို နောက်ကွယ်ကနေ ပို့မလား ဆိုတာပါ။ ပြင်ရတဲ့ code က နည်းပေမဲ့၊ SMS
      gateway နှေးနေတဲ့အခါ ခရီးသည် ဘာကို မြင်ရမလဲ ဆိုတာကို ပြောင်းစေတာမို့ အလယ်မှာ ထားပါမယ်။
      [[mark:type-r4]] စတုတ္ထက wallet API ကို ခေါ်တဲ့ code တွေကို နေရာ တစ်ခုတည်းမှာ စုမလား ဆိုတာပါ။ code
      နေရာ အများကြီးကို ထိပြီး၊ wallet အသစ် ထည့်ရတာ လွယ်မလွယ်ကိုပါ သတ်မှတ်မှာမို့ architecture ဘက်မှာ
      ရှိပါတယ်။
      [[mark:type-r5]] နောက်ဆုံး တစ်ခုက ထိုင်ခုံတွေကို နှစ်ခါ မရောင်းမိအောင် ဘယ်လို ကာမလဲ ဆိုတာပါ။ app
      ရော ကောင်တာရော ထိမယ်၊ တစ်ခါ ရွေးပြီးရင် ပြန်ပြောင်းဖို့လည်း ခက်ပါတယ်။ မေးခွန်း သုံးခုလုံးမှာ အဖြေက
      ကြီးနေတာမို့ ဒါက ကိုယ် တာဝန်ယူရမယ့် ဆုံးဖြတ်ချက်ပါ။
      [[mark:t-why]] ဒီလို ချရေးကြည့်လိုက်တော့ တနင်္လာနေ့ မနက်က မေးခွန်းရဲ့ အဖြေ ပေါ်လာပါတယ်။ ငါးခုထဲက
      ကိုယ် တာဝန်ယူရမှာက ဒီ နှစ်ခုပါ။ ကျန်တာတွေကိုတော့ team ကို ယုံကြည်ပြီး လွှတ်ထားရမှာပါ။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
      - {
          title: "Facilitating Software Architecture (Harmel-Law)",
          url: "https://oreil.ly/FacilitatingSoftwareArch",
        }
