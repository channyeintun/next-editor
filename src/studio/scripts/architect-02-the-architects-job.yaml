  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: monday
    chapter: တနင်္လာနေ့ မနက်
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ architecture ဆိုတာ system တစ်ခုလုံးရဲ့ ပုံစံကို သတ်မှတ်ပြီး နောက်မှ
      ပြောင်းဖို့ ခက်တဲ့ ဆုံးဖြတ်ချက်တွေ ဖြစ်တယ် ဆိုတာ လေ့လာခဲ့ပါတယ်။
      [[mark:m-open]] CTO ဖြစ်တဲ့ အောင်အောင် ကလည်း ခရီးဖော် ရဲ့ architecture ကို ကြည့်ပေးဖို့ ကိုယ့်ကို
      တာဝန်ပေးခဲ့ပါတယ်။ ဒါပေမဲ့ တနင်္လာနေ့ မနက် ရုံးရောက်တော့ ကိုယ့်စားပွဲလည်း၊ လုပ်စရာ ticket တွေလည်း
      အရင်အတိုင်းပါပဲ။ ဒီနေ့ကစပြီး ဘာကို ပြောင်းလုပ်ရမှာလဲ ဆိုတာ ကိုယ်လည်း မသေချာပါဘူး။
      [[mark:m-g1]] team ထဲက developer မောင်မောင် ကတော့ အခုကစပြီး code ပြင်တိုင်း ကိုယ့်ဆီက ခွင့်ပြုချက်
      ယူရတော့မှာလား လို့ မေးပါတယ်။ သူ့အမြင်မှာ architect ဆိုတာ အရာရာကို ဆုံးဖြတ်ပေးရမယ့် အတော်ဆုံး
      developer ပါ။
      [[mark:m-g2]] တချို့ကလည်း architect ဖြစ်သွားရင် code မရေးတော့ဘဲ၊ အစည်းအဝေးတွေ ထိုင်ပြီး
      အလုပ်ခွဲပေးတဲ့ manager လို ဖြစ်သွားမယ်လို့ ထင်ကြပါတယ်။
      [[mark:m-no]] နှစ်ခုလုံးက ပြည့်စုံတဲ့ အဖြေ မဟုတ်ပါဘူး။ အရာရာကို ကိုယ်တစ်ယောက်တည်း ဆုံးဖြတ်ရင် team
      တစ်ခုလုံးက ကိုယ့်ကို စောင့်နေရမှာပါ။ code နဲ့ ကင်းကွာသွားရင်လည်း ကိုယ့် ဆုံးဖြတ်ချက်တွေက
      လက်တွေ့နဲ့ ဝေးသွားပါလိမ့်မယ်။ architect ဆိုတာ system တစ်ခုလုံးကို ထိမယ့် ဆုံးဖြတ်ချက်တွေအတွက်
      တာဝန်ယူရတဲ့သူပါ။ အဲဒီ တာဝန်အတွက် အရာ သုံးခု လိုပါတယ်။
      [[mark:m-skill]] ပထမက skill ပါ။ အများကြီး သိနေရုံ မဟုတ်ဘဲ၊ ဘယ်နေရာမှာ ဘယ်အရာကို သုံးရမလဲ ရွေးတတ်တာကို ဆိုလိုပါတယ်။
      [[mark:m-impact]] ဒုတိယက impact ပါ။ ကိုယ် သိတာတွေကြောင့် business အတွက် တကယ် အကျိုးရှိသွားတာပါ။
      ခရီးဖော် အတွက်ဆိုရင် နောက်နှစ် သင်္ကြန်မှာ ထိုင်ခုံတွေကို နှစ်ခါ မရောင်းမိတော့တာမျိုးပါ။
      [[mark:m-lead]] တတိယက leadership ပါ။ ကိုယ် မရှိတဲ့ အချိန်မှာလည်း team က ကောင်းကောင်း ဆုံးဖြတ်နိုင်အောင်
      တခြားသူတွေကို လက်တွဲ ခေါ်ပေးတာပါ။
      [[mark:m-all]] ဒီ သုံးခုထဲက တစ်ခု လိုနေရင် မပြည့်စုံပါဘူး။ သိရုံနဲ့ အကျိုး မထွက်ရင် စာတွေ့ပဲ
      ဖြစ်နေမှာပါ။
    sources:
      - {
          title: "The Software Architect Elevator (Hohpe)",
          url: "https://oreil.ly/Software_Architect_Elevator",
        }
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - {
          id: draw-m-open,
          type: whiteboard.apply,
          at: { mark: m-open },
          open: true,
          upsertIds: [m-title],
        }
      - {
          id: draw-m-g1,
          type: whiteboard.apply,
          at: { mark: m-g1 },
          upsertIds: [m-g1],
          drawMs: 900,
        }
      - {
          id: draw-m-g2,
          type: whiteboard.apply,
          at: { mark: m-g2 },
          upsertIds: [m-g2],
          drawMs: 900,
        }
      - {
          id: draw-m-no,
          type: whiteboard.apply,
          at: { mark: m-no },
          upsertIds: [m-g1-x, m-g2-x],
          drawMs: 1000,
        }
      - {
          id: draw-m-skill,
          type: whiteboard.apply,
          at: { mark: m-skill },
          upsertIds: [m-skill, m-skill-l],
          drawMs: 1000,
        }
      - {
          id: draw-m-impact,
          type: whiteboard.apply,
          at: { mark: m-impact },
          upsertIds: [m-impact, m-impact-l],
          drawMs: 1000,
        }
      - {
          id: draw-m-lead,
          type: whiteboard.apply,
          at: { mark: m-lead },
          upsertIds: [m-lead, m-lead-l],
          drawMs: 1000,
        }
      - {
