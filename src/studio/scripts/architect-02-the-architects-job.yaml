          at: { mark: m-all },
          upsertIds: [m-all],
          drawMs: 900,
        }

  - id: three-kinds
    chapter: အလုပ် သုံးမျိုး
    narration: >
      [[mark:k-open]] ဒါဆို တစ်ပတ်တာအတွင်း architect တစ်ယောက် တကယ် လုပ်ရတဲ့ အလုပ်တွေကို သုံးမျိုး
      ခွဲကြည့်ရအောင်။
      [[mark:k-1]] ပထမ အမျိုးအစားက ဆုံးဖြတ်တာပါ။ system တစ်ခုလုံးကို ထိခိုက်မယ့် ဆုံးဖြတ်ချက်တွေကို
      ချမှတ်ပြီး၊ ဘာကြောင့်လဲ ဆိုတာပါ ရှင်းပြရပါတယ်။ အသေးစိတ်အထိ အမိန့်ပေးတာ မဟုတ်ဘဲ လမ်းညွှန်ပေးတာပါ။
      ဥပမာ wallet ကုမ္ပဏီရဲ့ API ကို ခေါ်တဲ့ code အားလုံးက နေရာ တစ်ခုတည်းကို ဖြတ်ရမယ် လို့ ကိုယ်က
      လမ်းညွှန်ပေးပါတယ်။ အဲဒီ နေရာထဲမှာ ဘယ်လို ရေးမလဲ ဆိုတာကတော့ ရေးမယ့် developer တွေရဲ့
      ဆုံးဖြတ်ချက်ပါ။
      [[mark:k-2]] ဒုတိယ အမျိုးအစားက စောင့်ကြည့်တာပါ။ ဆုံးဖြတ်လိုက်ရုံနဲ့ အလုပ် မပြီးသေးပါဘူး။ deadline
      နီးလာတဲ့အခါ တစ်ယောက်ယောက်က wallet API ကို အရင်လိုပဲ တိုက်ရိုက် ခေါ်လိုက်မိတာမျိုး ဖြစ်တတ်လို့၊
      သဘောတူထားတဲ့အတိုင်း တကယ် ဖြစ်နေရဲ့လား ဆိုတာ ပုံမှန် ကြည့်ရပါတယ်။
      [[mark:k-2b]] ဒါ့အပြင် system က အခု အခြေအနေနဲ့ ကိုက်သေးရဲ့လား၊ အပြင်မှာ ပေါ်လာနေတဲ့ technology
      တွေထဲက ဘာက အသုံးဝင်နိုင်လဲ ဆိုတာလည်း ကြည့်ရပါတယ်။ ကားလိုင်း ၄၀ အတွက် အဆင်ပြေခဲ့တဲ့ ပုံစံက
      ကားလိုင်းတွေ တိုးလာတဲ့အခါ အဆင်ပြေချင်မှ ပြေမှာပါ။
      [[mark:k-3]] တတိယ အမျိုးအစားက ချိတ်ဆက်တာပါ။ ခရီးဖော် က ရောင်းရငွေရဲ့ ၅ ရာခိုင်နှုန်းကို ယူပြီး၊
      ကျန်တာကို ကားလိုင်းတွေဆီ တနင်္လာနေ့တိုင်း ရှင်းပေးရတယ် ဆိုတာမျိုး business ကို နားလည်ထားမှ မှန်တဲ့
      ဆုံးဖြတ်ချက် ချနိုင်ပါတယ်။ ပြီးတော့ business ဘက်က လူတွေနဲ့ code ရေးတဲ့ လူတွေကြားမှာ တစ်ဖက်ရဲ့
      စကားကို နောက်တစ်ဖက် နားလည်အောင် သယ်ပေးရပါတယ်။ ဒီအလုပ်ကို ပုံနဲ့ ကြည့်ရအောင်။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
      - {
          title: "The Software Architect Elevator (Hohpe)",
          url: "https://oreil.ly/Software_Architect_Elevator",
        }
    actions:
      - {
          id: close-monday,
          type: whiteboard.apply,
          at: { mark: k-open, offsetMs: -1200 },
          open: false,
        }
      - {
          id: show-kinds,
          type: slide.show,
          at: { afterAction: close-monday },
          slideId: three-kinds,
        }
      - { id: point-kind-1, type: slide.point, at: { mark: k-1 }, target: { x: 0.15, y: 0.43 } }
      - { id: point-kind-2, type: slide.point, at: { mark: k-2 }, target: { x: 0.15, y: 0.59 } }
      - { id: point-kind-3, type: slide.point, at: { mark: k-3 }, target: { x: 0.15, y: 0.75 } }

  - id: elevator
    chapter: အထပ်တွေကြား ချိတ်ဆက်ခြင်း
    narration: >
      [[mark:e-open]] ကုမ္ပဏီ တစ်ခုကို အထပ်တွေ ပါတဲ့ အဆောက်အအုံ တစ်လုံးလို မြင်ကြည့်ပါ။
      [[mark:e-top]] အပေါ်ဆုံးထပ်မှာ အောင်အောင် တို့လို business ကို ဦးဆောင်တဲ့သူတွေ ရှိပါတယ်။ သူတို့
      စဉ်းစားတာက ကုန်ကျစရိတ်၊ အချိန်နဲ့ ကုမ္ပဏီ ကြီးထွားဖို့ပါ။
      [[mark:e-mid]] အလယ်ထပ်မှာ product manager လှလှ ရှိပါတယ်။ ခရီးသည်တွေနဲ့ ကားလိုင်းတွေ ဘာလိုချင်လဲ
      ဆိုတာကို သူက ယူလာပေးပါတယ်။
      [[mark:e-bottom]] အောက်ဆုံးထပ်ကတော့ စက်ခန်းပါ။ system ကို တကယ် တည်ဆောက်နေတဲ့ developer team ရှိတဲ့
      နေရာပါ။
      [[mark:e-gap]] အထပ်တွေက ကိစ္စ တစ်ခုတည်းအကြောင်း ပြောနေတာတောင် သုံးတဲ့ စကားက မတူပါဘူး။ အပေါ်ထပ်က
      သင်္ကြန်မှာ ဒီလို ထပ်မဖြစ်စေနဲ့ လို့ပဲ ပြောပါတယ်။ စက်ခန်းကတော့ database connection တွေ
      ပြည့်သွားတဲ့အကြောင်း ပြောနေပါတယ်။ ကြားမှာ ဘာသာပြန်ပေးမယ့်သူ မရှိရင် နှစ်ဖက်လုံးက တစ်ဖက်ကို
      နားမလည်ဘဲ ကျန်နေမှာပါ။
      [[mark:e-car]] architect က အဲဒီ အထပ်တွေကြားမှာ ဓာတ်လှေကားနဲ့ အတက်အဆင်း လုပ်နေတဲ့သူပါ။
      [[mark:e-down]] အောက်ကို ဆင်းတဲ့အခါ business ရဲ့ ဦးတည်ချက်ကို စက်ခန်းက နားလည်တဲ့ ဆုံးဖြတ်ချက်အဖြစ်
      ပြောင်းပေးပါတယ်။ သင်္ကြန်မှာ ထပ်မဖြစ်စေနဲ့ ဆိုတာကို ထိုင်ခုံ တစ်ခုံကို နှစ်ခါ မရောင်းရဘူး၊
      ဝင်သုံးသူ ၁၅ ဆ တက်လာလည်း ခံနိုင်ရမယ် ဆိုပြီး ပြောပြတာပါ။
      [[mark:e-up]] အပေါ်ကို တက်တဲ့အခါမှာတော့ စက်ခန်းက အခက်အခဲကို business စကားနဲ့ ယူသွားပါတယ်။ database
      က ဒီထက် မခံနိုင်တော့ဘူး ဆိုတာကို နောက်တစ်ခါ လက်မှတ် ဖွင့်ရောင်းတဲ့နေ့မှာ ရောင်းအား
      ဆုံးရှုံးနိုင်တယ် ဆိုပြီး ပြောပြတာပါ။
      [[mark:e-trap]] ဒီနေရာမှာ ကျတတ်တဲ့ ထောင်ချောက်က အပေါ်ထပ်မှာပဲ နေပြီး အောက်ကို ပြန်မဆင်းတော့တာပါ။
      ဘယ်သူမဆို ကျနိုင်တာမို့၊ ကိုယ့် ဆုံးဖြတ်ချက်တွေ code ထဲမှာ တကယ် ဘယ်လို ဖြစ်သွားလဲ သိအောင် code ကို
      ဆက်ရေး၊ ဆက်ဖတ်နေဖို့ လိုပါတယ်။
    sources:
      - {
          title: "The Software Architect Elevator (Hohpe)",
          url: "https://oreil.ly/Software_Architect_Elevator",
        }
    actions:
      - { id: close-kinds, type: slide.close, at: { mark: e-open, offsetMs: -1200 } }
      - {
          id: draw-e-open,
          type: whiteboard.apply,
          at: { afterAction: close-kinds },
          open: true,
          clear: true,
          upsertIds: [e-title],
        }
      - {
          id: draw-e-top,
          type: whiteboard.apply,
          at: { mark: e-top },
          upsertIds: [e-f1, e-f1-l],
          drawMs: 1200,
        }
      - {
          id: draw-e-mid,
          type: whiteboard.apply,
          at: { mark: e-mid },
          upsertIds: [e-f2, e-f2-l],
          drawMs: 1200,
        }
      - {
          id: draw-e-bottom,
          type: whiteboard.apply,
          at: { mark: e-bottom },
          upsertIds: [e-f3, e-f3-l],
          drawMs: 1200,
        }
      - {
          id: draw-e-car,
          type: whiteboard.apply,
          at: { mark: e-car },
          upsertIds: [e-shaft, e-car, e-car-l],
          drawMs: 1500,
        }
      - {
          id: draw-e-down,
          type: whiteboard.apply,
          at: { mark: e-down },
          upsertIds: [e-down, e-down-l],
          drawMs: 1500,
        }
      - {
          id: draw-e-up,
          type: whiteboard.apply,
          at: { mark: e-up },
          upsertIds: [e-up, e-up-l],
          drawMs: 1500,
        }
      - {
          id: point-e-car,
          type: whiteboard.point,
          at: { mark: e-trap },
          target: { assetId: e-car },
        }

  - id: spectrum
    chapter: Design လား၊ architecture လား
    narration: >
      [[mark:s-open]] ဒါဆို ဘယ်ဆုံးဖြတ်ချက်တွေက ကိုယ့်တာဝန်လဲ။ code တစ်နေရာထဲမှာ ဘယ်လို ရေးမလဲ ဆိုတဲ့
      ဆုံးဖြတ်ချက်မျိုးကို design လို့ ခေါ်ကြပါတယ်။ ဒါပေမဲ့ design နဲ့ architecture က သီးခြား အုပ်စု
      နှစ်ခု မဟုတ်ဘဲ၊ မျဉ်းတစ်ကြောင်းရဲ့ အစွန်း နှစ်ဖက်ပါ။ ဆုံးဖြတ်ချက်တွေက အဲဒီ မျဉ်းပေါ်မှာ နေရာ
      အမျိုးမျိုး ကျနေတာပါ။
      [[mark:s-q1]] ဆုံးဖြတ်ချက် တစ်ခုက မျဉ်းရဲ့ ဘယ်နေရာမှာ ရှိလဲ သိဖို့ မေးခွန်း သုံးခု မေးကြည့်ပါ။
      ပထမက ဒီ ဆုံးဖြတ်ချက်က ဘယ်လောက် ကြာကြာ၊ လူ ဘယ်နှယောက်ရဲ့ အလုပ်ကို ထိမလဲ ဆိုတာပါ။
      [[mark:s-q2]] ဒုတိယက နောက်မှ ပြန်ပြောင်းချင်ရင် ဘယ်လောက် ကုန်ကျမလဲ ဆိုတာပါ။
      [[mark:s-q3]] တတိယက trade off ဘယ်လောက် ကြီးလဲ ဆိုတာပါ။ trade off ဆိုတာ တစ်ခု ရဖို့ နောက်တစ်ခုကို
      လျှော့ပေးရတာပါ။ ရတာနဲ့ ပေးရတာ နှစ်ခုလုံး ကြီးလေ architecture ဘက်ကို ပိုရောက်လေပါပဲ။
      [[mark:s-m1]] function တစ်ခုကို နှစ်ခု ခွဲရေးတာမျိုးက design ဘက်စွန်းမှာ ရှိပါတယ်။ file
      တစ်ခုထဲမှာပဲ ပြီးပြီး နောက်နေ့ ပြန်ပြင်လို့ ရတာမို့၊ ရေးတဲ့ developer ကိုယ်တိုင် ဆုံးဖြတ်ပါတယ်။
      [[mark:s-m3]] wallet API ကို system တစ်ခုလုံးက ဘယ်လို ခေါ်မလဲ ဆိုတာကတော့ architecture ဘက်စွန်းမှာပါ။
      ဒါမျိုးကို ကိုယ်က တာဝန်ယူရပါတယ်။
      [[mark:s-m2]] အလယ်မှာ ကျတဲ့ ဆုံးဖြတ်ချက်တွေလည်း အများကြီး ရှိပါတယ်။ လက်မှတ် ဝယ်ပြီးတဲ့အခါ ပို့တဲ့
      SMS ကို နောက်ကွယ်ကနေ ပို့မလား ဆိုတာမျိုးပါ။ အဲဒါမျိုးကိုတော့ team နဲ့ အတူ ဆုံးဖြတ်တာ
      ပိုသင့်တော်ပါတယ်။
    sources:
      - {
