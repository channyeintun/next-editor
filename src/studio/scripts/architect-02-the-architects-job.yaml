          <div class="row" style="top: 34vh"><span class="num">1</span><span class="term blue">ဆုံးဖြတ်</span>system တစ်ခုလုံးကို ထိမယ့် ဆုံးဖြတ်ချက်ကို လမ်းညွှန်</div>
