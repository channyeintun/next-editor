build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 5105
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "Predictive model ကို train လုပ်ရအောင်"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ ရွှေ member data ကို သန့်ရှင်းအောင် လုပ်ပြီး training၊ validation၊
      test ဆိုပြီး သုံးပိုင်း ခွဲခဲ့ပါတယ်။ ဒီ lesson မှာတော့ အဲဒီ data နဲ့ model ကို train လုပ်ပြီး ဘယ်လောက်
      မှန်လဲ စစ်ပါမယ်။ [[mark:draw-mini]] blueprint မှာ ဒီနေ့ လုပ်မှာက Solution ထဲက intelligence အလွှာပါ။
      [[mark:draw-today]] predictive AI loop ရဲ့ train၊ evaluate၊ deploy အဆင့်တွေကို ဆက်သွားပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Predictive AI: Turn data into insights",
          url: "https://web.dev/learn/ai/predictive",
        }
      - {
          title: "web.dev Learn AI: Introduction to AI on the web (the blueprint)",
          url: "https://web.dev/learn/ai/introduction",
        }
      - {
          title: "web.dev Learn AI: Welcome to Learn AI! (course credit: written by Dr. Janna Lipenkova with editorial guidance from Alexandra Klepper; text CC BY 4.0, code Apache 2.0; adapted into Burmese with the course's own tea-shop examples)",
          url: "https://web.dev/learn/ai/welcome",
        }
      - {
          title: "Creative Commons: Attribution 4.0 International (CC BY 4.0), the licence of the web.dev Learn AI text adapted here",
          url: "https://creativecommons.org/licenses/by/4.0/",
        }
    actions:
      - {
          id: open-board-a,
          type: whiteboard.apply,
          at: { scene: start, offsetMs: -450 },
          open: true,
          clear: true,
          upsertIds: [a-title],
        }
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - {
          id: draw-mini,
          type: whiteboard.apply,
          at: { mark: draw-mini },
          upsertIds:
            [
              a-opp,
              a-opp-t,
              a-arrow-1,
              a-data,
              a-data-t,
              a-intel,
              a-intel-t,
              a-ux,
              a-ux-t,
              a-arrow-2,
              a-gov,
              a-gov-t,
            ],
          drawMs: 2400,
        }
      - {
          id: draw-today,
          type: whiteboard.apply,
          at: { mark: draw-today },
          upsertIds: [a-today],
          drawMs: 1000,
        }

  - id: why-train
    narration: >
      [[mark:draw-why]] generative AI မှာ ကြို train ပြီးသား model ကြီးတွေကို ယူသုံးလေ့ ရှိပေမယ့်၊ predictive
      AI မှာတော့ model ကို ကိုယ်တိုင် train လုပ်တာ များပါတယ်။ member တွေ ဆက်လာမလား ဆိုတဲ့ မေးခွန်းက ကိုယ့်
      ဆိုင်၊ ကိုယ့် customer နဲ့ပဲ သက်ဆိုင်လို့ပါ။ train လုပ်တယ် ဆိုတာ data ကို ပြပြီး model ထဲက ဂဏန်းတွေကို
      အဖြေ မှန်လာအောင် ညှိတာပါ။ [[mark:draw-tools]] scikit-learn၊ AutoML၊ TensorFlow.js လို tool တွေက သင်္ချာ
      အသေးစိတ် မသိဘဲ train လုပ်နိုင်အောင် ကူညီပြီး၊ Transformers.js ကတော့ ကြို train ပြီးသား model တွေ run
      ဖို့ပါ။ [[mark:draw-algo]] label ပါတဲ့ data ကနေ သင်ယူတာမို့ supervised learning ဖြစ်ပြီး၊ member ကို
      အုပ်စု နှစ်ခု ခွဲတာမို့ classification ပါ။ ဖြစ်နိုင်ခြေ ထုတ်ပေးတဲ့ logistic regression ဒါမှမဟုတ် neural
      network ကို သုံးနိုင်ပြီး၊ တစ်မျိုးထက် ပိုစမ်းကြည့်ရပါတယ်။ [[mark:draw-here]] ဒီမှာ သုံးမှာက ဒီ lesson
      အတွက် ရေးထားတဲ့ logistic regression model သေးသေးလေး ဖြစ်ပြီး၊ ဒီ page ထဲမှာပဲ train လုပ်တာပါ။
    sources:
      - {
          title: "web.dev Learn AI: Predictive AI: Turn data into insights (train the model)",
          url: "https://web.dev/learn/ai/predictive",
        }
    actions:
      - {
          id: draw-why,
          type: whiteboard.apply,
          at: { mark: draw-why },
          clear: true,
          upsertIds: [b-title, b-why],
          drawMs: 1200,
        }
      - {
          id: draw-tools,
          type: whiteboard.apply,
          at: { mark: draw-tools },
          upsertIds: [b-tools, b-not],
          drawMs: 1400,
        }
      - {
          id: draw-algo,
          type: whiteboard.apply,
          at: { mark: draw-algo },
          upsertIds: [b-algo, b-algo2, b-try],
          drawMs: 1600,
        }
      - {
          id: draw-here,
          type: whiteboard.apply,
          at: { mark: draw-here },
          upsertIds: [b-here],
          drawMs: 1000,
        }

  - id: train
    narration: >
      [[mark:close-why]] ဒါဆို code ထဲမှာ train လုပ်ကြည့်ရအောင်။ [[mark:panel-ready]] ညာဘက် AI panel မှာ model
      မရှိသေးလို့ card တစ်ခုမှ မရှိသေးပါဘူး။ [[mark:sel-steps]] program ရဲ့ အပေါ်ပိုင်းက ပြီးခဲ့တဲ့ lesson မှာ
      ရေးခဲ့တဲ့ အဆင့်တွေပါ။ member data ကတော့ lesson အတွက် ပြင်ဆင်ထားတဲ့ နမူနာ data ပါ။ [[mark:sel-columns]] ဒီ
      စာကြောင်းက model ကို ပေးမယ့် input feature နှစ်ခုပါ၊ နောက်ဆုံး လာခဲ့တာ ဘယ်နှရက် ရှိပြီလဲ နဲ့
      တိုင်ကြားတဲ့ အကြိမ်ပါ။ [[mark:type-train]] training set နဲ့ train လုပ်ပြီး ရလဒ်ကို panel မှာ
      ပြခိုင်းပါမယ်။ [[mark:read-weights]] Weights card မှာ model weights တွေ ပေါ်လာပါပြီ။ train လုပ်ရင်း
      ညှိယူထားတဲ့ ဂဏန်းတွေ ဖြစ်ပြီး ဘယ် အချက်က ဘယ်လောက် အရေးပါလဲ ဆုံးဖြတ်ပေးပါတယ်။ column တွေကို အတိုင်းအတာ
      တူအောင် ညှိပြီးမှ train လုပ်ထားလို့ အပေါင်း အနှုတ်နဲ့ အရွယ်အစားကိုပဲ နှိုင်းယှဉ်ရပါတယ်။ နှစ်ခုလုံး
      အပေါင်းမို့ ရက် ကြာလေ၊ တိုင်ကြားတာ များလေ ဖြစ်နိုင်ခြေ မြင့်လေပါ။ [[mark:read-member]] Member card ကတော့
      ပြီးခဲ့တဲ့ lesson က တိုင်ကြားတာ ၄ ခါ ရှိပေမယ့် ဆက်လာနေတဲ့ member ပါ။ model က သူ မလာတော့မယ့်
      ဖြစ်နိုင်ခြေကို ၆၀ ရာခိုင်နှုန်းလောက်လို့ ပြနေပြီး၊ ဒီလိုပဲ member တစ်ယောက်ချင်းစီကို ဖြစ်နိုင်ခြေ
      ထုတ်ပေးပါတယ်။ [[mark:sel-hyper]] ဒီ ဂဏန်း နှစ်ခုက hyperparameter တွေပါ၊ train မလုပ်ခင် ကိုယ်က
      ကြိုသတ်မှတ်ပေးရတဲ့ setting ဖြစ်ပြီး data ကို ဘယ်နှခါ ပြန်ပြမလဲ နဲ့ တစ်ခါ ညှိတိုင်း ဘယ်လောက် ရွှေ့မလဲ
      ဆိုတာပါ။ တကယ့် project မှာ ဒီ setting တွေကို ပြောင်းရင်း ထပ်ခါ train လုပ်ပြီး၊ validation set နဲ့
      အကောင်းဆုံးကို ရွေးပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Predictive AI: Turn data into insights (train the model)",
          url: "https://web.dev/learn/ai/predictive",
        }
      - {
          title: "Google Machine Learning Glossary: hyperparameter",
          url: "https://developers.google.com/machine-learning/glossary#hyperparameter",
        }
    actions:
      - { id: close-why, type: whiteboard.apply, at: { mark: close-why }, open: false }
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-done
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: ai-status }
        attribute: { name: data-state, value: "done" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-no-cards
        type: expect.preview
        at: { afterAction: expect-done }
        timeoutMs: 5000
        target: { by: testId, value: ai-cards }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - { id: open-main, type: workspace.openFile, at: { mark: sel-steps }, path: src/main.js }
      - id: sel-steps
        type: editor.select
        at: { afterAction: open-main }
        target:
          {
            file: src/main.js,
            text: "// Lesson 04's steps: ရွှေ members (sample data written for the course), cleaned and split 70 / 10 / 20.\nlet rows = data.rows;\nrows = dropDuplicates(rows);\nrows = normalize(rows, \"township\", TOWNSHIP_SPELLINGS);\nrows = fillMissing(rows, \"township\", \"မသိ\");\nrows = toNumber(rows, \"avg_order_kyat\");\nrows = dropColumn(rows, \"phone\");\nrows = encode(rows, \"member_type\", { card: 0, app: 1 });\nconst sets = split(rows, { seed: 5104 });",
            occurrence: 1,
          }
      - id: sel-columns
        type: editor.select
        at: { mark: sel-columns }
        target:
          {
            file: src/main.js,
            text: 'let columns = ["days_since_last", "complaints_90d"];',
            occurrence: 1,
          }
      - id: type-train
        type: editor.type
        at: { mark: type-train }
        target:
          {
            file: src/main.js,
            after: "// Train the model on the training set, then check it:\n",
            occurrence: 1,
          }
        text: "const model = trainLogistic(sets.train, {\n  columns, label: \"stopped\", epochs: 400, rate: 0.5,\n});\nshowModel(model, rows);\n"
        cadence: block
      - id: expect-two-cards
        type: expect.preview
        at: { afterAction: type-train }
        timeoutMs: 8000
        target: { by: testId, value: ai-cards }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-weights-2
        type: expect.preview
        at: { afterAction: expect-two-cards }
        timeoutMs: 5000
        target: { by: testId, value: ai-weights }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-weight-complaints
        type: expect.preview
        at: { afterAction: expect-weights-2 }
        timeoutMs: 5000
        target: { by: testId, value: ai-weights-2 }
