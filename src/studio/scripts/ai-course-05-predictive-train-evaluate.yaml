# AI course, lesson 05: training and evaluating a predictive model (Burmese, hands-on, M1).
#
# Start state (ws/): data/members.json + data/members-after.json (COURSE-KIT §4.3, sample data, from
# datasets/ unchanged); src/prepare.js, src/ml.js, src/ui.js (pinned from base/, as in lesson 04);
# src/features.js (pinned: perVisit adds complaints_per_visit = complaints ÷ visits); src/report.js
# (pinned) draws the panel. src/main.js holds lesson 04's final steps block (its `showSplit` call
# left out: this lesson's panel shows the model), `let columns = ["days_since_last",
# "complaints_90d"];` and an empty "train" section. The panel starts with no cards.
#
# Edits, all insert-only:
#   1. train (block)           Weights card (2 tiles, badge "ဒီ page ထဲမှာ train ထားတဲ့ model"),
#                              Member M0023 scores: stops 59.8% (top)
#   2. showTest                threshold buttons 0.1 / 0.2 / 0.5 in #app; Test set card at 0.5:
#                              flagged 9, caught 7, stopped 12, precision 0.7778, recall 0.5833, f1 0.6667
#   3. showMistakes            All 158 members · looked back: flagged 35, false alarms 10, regulars 8
#   4. perVisit + columns      (two one-line inserts back to back) Weights 3 tiles, M0023 keeps coming
#                              73.1% (stops 26.9%), mistakes 30 / 2 / 0, test 10 / 9 / 12, 0.9 / 0.75 / 0.8182
#   5. clicks                  threshold 0.2 → 12 / 10 / 12, 0.8333 / 0.8333 / 0.8333;
#                              threshold 0.1 → 17 / 12 / 12, 0.7059 / 1 / 0.8276
#   6. showAfter               After delivery app · threshold 0.5: 24 / 22 / 52, 0.9167 / 0.4231 / 0.5789
# M1: the small logistic regression in the pinned ml.js, trained in the page; measured with
# tools/sim.ts and verify.
#
# Boards: (A) the mini blueprint with Intelligence highlighted; (B) why predictive models are
# self-trained, tools, the algorithm; (C) the 2×2 of warnings, precision and recall as fractions,
# F1 and the threshold line; (E) after deploy: MLOps and the common pitfalls; (Z) the quiz.
#
# Build: bun ~/Documents/ai-course-work/tools/build-lesson.ts template.yaml ws ai-course-05-predictive-train-evaluate.yaml
