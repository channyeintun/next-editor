        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-member-stops
        type: expect.preview
        at: { mark: read-member }
        timeoutMs: 5000
        target: { by: testId, value: ai-member }
        attribute: { name: data-top, value: "stops" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: sel-hyper
        type: editor.select
        at: { mark: sel-hyper }
        target: { file: src/main.js, text: "epochs: 400, rate: 0.5", occurrence: 1 }

  - id: evaluate
    chapter: "Model ကို evaluate လုပ်ရအောင်"
    narration: >
      [[mark:draw-matrix]] model ကောင်းမကောင်း သိဖို့ train တုန်းက မပြခဲ့တဲ့ test set နဲ့ စစ်ရပါမယ်။ test set
      ရဲ့ label တွေက ground truth ပါ၊ model ရဲ့ အဖြေကို တိုက်စစ်ဖို့ သုံးတဲ့ မှန်ကန်တဲ့ အဖြေပါ။
      [[mark:draw-cells]] သတိပေးပြီး member မလာတော့ရင်၊ ဒါမှမဟုတ် မသတိပေးဘဲ ဆက်လာရင် မှန်ပါတယ်။
      [[mark:draw-fp]] သတိပေးပေမယ့် ဆက်လာတာက false positive ပါ၊ မဖြစ်တာကို ဖြစ်မယ်လို့ မှားသတိပေးတာမို့
      ကောင်တာက လှလှ တိုက်မယ့် လက်ဖက်ရည် တစ်ခွက် ပိုကုန်ရုံပါ။ [[mark:draw-fn]] မသတိပေးဘဲ မလာတော့တာက false negative ပါ၊ ဖြစ်တာကို model
      က လွတ်သွားလို့ member တစ်ယောက် ဆုံးတာပါ။ [[mark:draw-pr]] precision က သတိပေးတဲ့ ထဲက ဘယ်လောက် တကယ်
      မှန်လဲ၊ recall က တကယ် မလာတော့တဲ့ ထဲက ဘယ်လောက် မိလဲ ဆိုတာပါ။ F one score က နှစ်ခုကို ညှိပေါင်းထားတဲ့
      ဂဏန်း တစ်ခုတည်းပါ။ [[mark:draw-th]] ဖြစ်နိုင်ခြေ ဘယ်လောက် ရောက်ရင် သတိပေးမလဲ ဆိုတဲ့ မျဉ်းကို threshold
      လို့ ခေါ်ပြီး၊ အခု ၅၀ ရာခိုင်နှုန်း ထားပါမယ်။ [[mark:close-matrix]] code ထဲမှာ စစ်ကြည့်ရအောင်။
      [[mark:type-test]] test set ကို စစ်ပြီး panel မှာ ပြခိုင်းတဲ့ စာကြောင်း ထည့်ပါမယ်။ [[mark:read-test]]
      Test set card မှာ model က ၉ ယောက်ကို သတိပေးပြီး ၇ ယောက်က တကယ် မလာတော့လို့ precision က ၇၈ ရာခိုင်နှုန်း
      ပါ။ မလာတော့တဲ့ ၁၂ ယောက်ထဲက ၇ ယောက်ပဲ မိလို့ recall က ၅၈၊ F one က ၆၇ ရာခိုင်နှုန်း ပါ။
      [[mark:think-cost]] လှလှ ဘက်က ကြည့်ရင် လက်ဖက်ရည် တစ်ခွက်က ဈေး မကြီးပေမယ့် member တစ်ယောက်
      ဆုံးတာက ပိုနစ်နာလို့၊ ဒီဆိုင်က recall ကို ပိုဦးစားပေးပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Predictive AI: Turn data into insights (evaluate the model)",
          url: "https://web.dev/learn/ai/predictive",
        }
    actions:
      - {
          id: draw-matrix,
          type: whiteboard.apply,
          at: { mark: draw-matrix },
          open: true,
          clear: true,
          upsertIds: [c-title, c-h1, c-h2],
          drawMs: 1200,
        }
      - {
          id: draw-cells,
          type: whiteboard.apply,
          at: { mark: draw-cells },
          upsertIds: [c-r1, c-r2, c-tp, c-tp-t, c-tn, c-tn-t],
          drawMs: 1800,
        }
      - {
          id: draw-fp,
          type: whiteboard.apply,
          at: { mark: draw-fp },
          upsertIds: [c-fp, c-fp-t, c-fp-n],
          drawMs: 1400,
        }
      - {
          id: draw-fn,
          type: whiteboard.apply,
          at: { mark: draw-fn },
          upsertIds: [c-fn, c-fn-t, c-fn-n],
          drawMs: 1400,
        }
      - {
          id: draw-pr,
          type: whiteboard.apply,
          at: { mark: draw-pr },
          upsertIds: [c-prec, c-rec, c-f1],
          drawMs: 2000,
        }
      - {
          id: draw-th,
          type: whiteboard.apply,
          at: { mark: draw-th },
          upsertIds: [c-th],
          drawMs: 1000,
        }
      - { id: close-matrix, type: whiteboard.apply, at: { mark: close-matrix }, open: false }
      - id: type-test
        type: editor.type
        at: { mark: type-test }
        target: { file: src/main.js, after: "showModel(model, rows);\n", occurrence: 1 }
        text: "showTest(model, sets.test);\n"
        cadence: line-by-line
      - id: expect-test-flagged
        type: expect.preview
        at: { afterAction: type-test }
        timeoutMs: 8000
        target: { by: testId, value: ai-test-1 }
        attribute: { name: data-value, value: "9" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-test-caught
        type: expect.preview
        at: { afterAction: expect-test-flagged }
        timeoutMs: 5000
        target: { by: testId, value: ai-test-2 }
        attribute: { name: data-value, value: "7" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-test-stopped
        type: expect.preview
        at: { afterAction: expect-test-caught }
        timeoutMs: 5000
        target: { by: testId, value: ai-test-3 }
        attribute: { name: data-value, value: "12" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-test-precision
        type: expect.preview
        at: { afterAction: expect-test-stopped }
        timeoutMs: 5000
        target: { by: testId, value: ai-test-4 }
        attribute: { name: data-value, value: "0.7778" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-test-recall
        type: expect.preview
        at: { afterAction: expect-test-precision }
        timeoutMs: 5000
        target: { by: testId, value: ai-test-5 }
        attribute: { name: data-value, value: "0.5833" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-test-f1
        type: expect.preview
        at: { afterAction: expect-test-recall }
        timeoutMs: 5000
        target: { by: testId, value: ai-test-6 }
        attribute: { name: data-value, value: "0.6667" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-threshold-half
        type: expect.preview
        at: { afterAction: expect-test-f1 }
        timeoutMs: 5000
        target: { by: testId, value: threshold-3 }
        attribute: { name: aria-pressed, value: "true" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: deploy
    chapter: "Deploy ပြီးနောက် အမှားကနေ သင်ရအောင်"
    narration: >
      စစ်ပြီးရင် model ကို deploy လုပ်ပါတယ်။ ဥပမာ ဆိုင်ရဲ့ dashboard က API ကနေ ဒါမှမဟုတ် browser ထဲက model
      သေးသေးလေးနဲ့ မနက်တိုင်း member တွေကို အမှတ်ပေးပြီး လှလှ ကို သတိပေး စာရင်း ပြနိုင်ပါတယ်။
      [[mark:type-mistakes]] ပြီးခဲ့တဲ့ လက member ၁၅၈ ယောက်လုံးကို အမှတ်ပေးပြီး တကယ် ဖြစ်ခဲ့တာနဲ့
      ပြန်တိုက်ကြည့်ရအောင်၊ တစ်လမှာ အနည်းဆုံး ၁၅ ခါ လာတဲ့သူကို လာနေကျ customer လို့ ယူပါမယ်။
      [[mark:read-mistakes]] သတိပေးခံရတဲ့ ၃၅ ယောက်ထဲက ၁၀ ယောက်က ဆက်လာခဲ့ပြီး၊ အဲဒီထဲမှာ လာနေကျ customer ၈
      ယောက် ပါပါတယ်။ Member card ထဲက member လည်း အဲဒီ ၈ ယောက်ထဲမှာ ပါပါတယ်။ [[mark:read-pattern]] သူတို့က ခဏခဏ လာလို့
      တိုင်ကြားတာလည်း များနေတာပါ။ model က တိုင်ကြားတဲ့ အကြိမ်ကို အားကိုးလွန်းလို့ သူတို့ကို ထွက်သွားမယ့်သူလို့
      မှားခန့်မှန်းနေတာပါ။
    sources:
      - {
          title: "web.dev Learn AI: Predictive AI: Turn data into insights (deploy and maintain the model)",
          url: "https://web.dev/learn/ai/predictive",
        }
    actions:
      - id: type-mistakes
        type: editor.type
        at: { mark: type-mistakes }
        target: { file: src/main.js, after: "showTest(model, sets.test);\n", occurrence: 1 }
        text: "showMistakes(model, rows, { regularVisits: 15 });\n"
        cadence: line-by-line
      - id: expect-mistakes-flagged
        type: expect.preview
        at: { afterAction: type-mistakes }
        timeoutMs: 8000
        target: { by: testId, value: ai-mistakes-1 }
        attribute: { name: data-value, value: "35" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-mistakes-false
        type: expect.preview
        at: { afterAction: expect-mistakes-flagged }
        timeoutMs: 5000
        target: { by: testId, value: ai-mistakes-2 }
        attribute: { name: data-value, value: "10" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-mistakes-regulars
        type: expect.preview
        at: { afterAction: expect-mistakes-false }
        timeoutMs: 5000
        target: { by: testId, value: ai-mistakes-3 }
        attribute: { name: data-value, value: "8" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: fix
    narration: >
      production ထဲက model ကို စောင့်ကြည့်တာ၊ ပြန် train လုပ်တာ၊ version ထိန်းတာတွေကို ML ops လို့ ခေါ်ပါတယ်။
      အဲဒီက သင်ခန်းစာ တစ်ခုက အမှားတွေထဲက ပုံစံကို ရှာပြီး data ကို ပိုကောင်းအောင် လုပ်တာပါ။
      hyperparameter ညှိတာလိုပဲ data ကောင်းလာတာကလည်း model ကို တိုးတက်စေပါတယ်။ [[mark:type-ratio]] ဒါကြောင့် တိုင်ကြားတဲ့ အကြိမ်ကို လာတဲ့
      အကြိမ်နဲ့ စားထားတဲ့ column အသစ် ထည့်ပြီး၊ model ကို လာတဲ့ အကြိမ်၊ ရက်နဲ့ ဒီ column တို့နဲ့ train
      လုပ်ခိုင်းပါမယ်။ [[mark:read-fix]] မှားသတိပေးခံရတဲ့ လာနေကျ customer က ၈ ယောက်ကနေ သုည ဖြစ်သွားပြီး၊
      Member card ရဲ့ ဖြစ်နိုင်ခြေလည်း ၂၇ ရာခိုင်နှုန်းလောက်ပဲ ကျန်ပါတော့တယ်။ [[mark:read-fix-weights]] column
      အသစ်က weight အကြီးဆုံး ဖြစ်လာပြီး လာတဲ့ အကြိမ်ရဲ့ weight က အနှုတ်ပါ။ ရက်ရဲ့ weight လည်း အနှုတ်
      ဖြစ်သွားပေမယ့်၊ column တွေ ဆက်စပ်နေရင် weight တစ်ခုချင်းကို သီးသန့် မဖတ်ဘဲ model တစ်ခုလုံးကို test set
      နဲ့ စစ်ရပါတယ်။ [[mark:read-fix-test]] Test set မှာလည်း precision ၉၀၊ recall ၇၅ ရာခိုင်နှုန်း ဆိုပြီး
      နှစ်ခုလုံး တက်လာပါပြီ။
    sources:
      - {
          title: "web.dev Learn AI: Predictive AI: Turn data into insights (deploy and maintain: learn from mistakes)",
          url: "https://web.dev/learn/ai/predictive",
        }
    actions:
      - id: type-ratio
        type: editor.type
        at: { mark: type-ratio }
        target:
          {
            file: src/main.js,
            after: "rows = encode(rows, \"member_type\", { card: 0, app: 1 });\n",
            occurrence: 1,
          }
        text: "rows = perVisit(rows, \"complaints_90d\");\n"
        cadence: line-by-line
      - id: type-columns
        type: editor.type
        at: { afterAction: type-ratio }
        target:
          {
            file: src/main.js,
            after: "let columns = [\"days_since_last\", \"complaints_90d\"];\n",
            occurrence: 1,
          }
        text: "columns = [\"visits_30d\", \"days_since_last\", \"complaints_per_visit\"];\n"
        cadence: line-by-line
      - id: expect-regulars-0
        type: expect.preview
        at: { afterAction: type-columns }
        timeoutMs: 8000
        target: { by: testId, value: ai-mistakes-3 }
        attribute: { name: data-value, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-false-2
        type: expect.preview
        at: { afterAction: expect-regulars-0 }
        timeoutMs: 5000
        target: { by: testId, value: ai-mistakes-2 }
        attribute: { name: data-value, value: "2" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-member-stays
        type: expect.preview
        at: { afterAction: expect-false-2 }
        timeoutMs: 5000
        target: { by: testId, value: ai-member }
        attribute: { name: data-top, value: "keeps coming" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-weights-3
        type: expect.preview
        at: { mark: read-fix-weights }
        timeoutMs: 5000
        target: { by: testId, value: ai-weights-3 }
        attribute: { name: data-name, value: "complaints_per_visit" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-fix-precision
        type: expect.preview
        at: { mark: read-fix-test }
        timeoutMs: 5000
        target: { by: testId, value: ai-test-4 }
        attribute: { name: data-value, value: "0.9" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-fix-recall
        type: expect.preview
        at: { afterAction: expect-fix-precision }
        timeoutMs: 5000
        target: { by: testId, value: ai-test-5 }
        attribute: { name: data-value, value: "0.75" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: threshold
    narration: >
      panel အပေါ်က ခလုတ်တွေနဲ့ threshold ကို ပြောင်းကြည့်ရအောင်၊ အခု ၅၀ ရာခိုင်နှုန်းမှာ ရှိပါတယ်။ [[mark:click-2]] ၂၀ ရာခိုင်နှုန်းကို နှိပ်ကြည့်ပါမယ်။ [[mark:read-2]]
      သတိပေးတာ ၁၂ ယောက် ဖြစ်လာပြီး ၁၀ ယောက် မိလို့ recall က ၈၃ ရာခိုင်နှုန်း တက်လာပေမယ့်၊ မှားသတိပေးတာ
      တစ်ယောက် တိုးလို့ precision က ၈၃ ရာခိုင်နှုန်း ကျသွားပါတယ်။ [[mark:click-1]] ၁၀ ရာခိုင်နှုန်းဆိုရင်တော့
      ၁၂ ယောက်လုံး မိလို့ recall ၁၀၀ ရာခိုင်နှုန်း ဖြစ်ပေမယ့်၊ ၁၇ ယောက်ကို သတိပေးရလို့ precision က ၇၁
      ရာခိုင်နှုန်းပဲ ကျန်ပါတယ်။ threshold ကို ချလေ ပိုမိလေ၊ ပိုမှားလေပါ။ ဘယ်နေရာ ရွေးမလဲ ဆိုတာ ဆိုင်ရဲ့ ဆုံးဖြတ်ချက်ပါ။
      လက်ဖက်ရည် တစ်ခွက်က ဈေးသက်သာလို့ ဒီဆိုင်အတွက် နိမ့်တဲ့ မျဉ်းက ပိုသင့်တော်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Predictive AI: Turn data into insights (evaluate the model: the trade-off)",
          url: "https://web.dev/learn/ai/predictive",
        }
    actions:
      - id: click-2
        type: preview.click
        at: { mark: click-2 }
        target: { by: testId, value: threshold-2 }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-t2-recall
        type: expect.preview
        at: { afterAction: click-2 }
        timeoutMs: 5000
        target: { by: testId, value: ai-test-5 }
        attribute: { name: data-value, value: "0.8333" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-t2-flagged
        type: expect.preview
        at: { afterAction: expect-t2-recall }
        timeoutMs: 5000
        target: { by: testId, value: ai-test-1 }
        attribute: { name: data-value, value: "12" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-t2-precision
        type: expect.preview
        at: { afterAction: expect-t2-flagged }
        timeoutMs: 5000
        target: { by: testId, value: ai-test-4 }
        attribute: { name: data-value, value: "0.8333" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-t2-pressed
        type: expect.preview
        at: { afterAction: expect-t2-precision }
        timeoutMs: 5000
        target: { by: testId, value: threshold-2 }
        attribute: { name: aria-pressed, value: "true" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: click-1
        type: preview.click
        at: { mark: click-1 }
        target: { by: testId, value: threshold-1 }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-t1-recall
        type: expect.preview
        at: { afterAction: click-1 }
        timeoutMs: 5000
        target: { by: testId, value: ai-test-5 }
        attribute: { name: data-value, value: "1" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-t1-flagged
        type: expect.preview
        at: { afterAction: expect-t1-recall }
        timeoutMs: 5000
        target: { by: testId, value: ai-test-1 }
        attribute: { name: data-value, value: "17" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-t1-precision
        type: expect.preview
        at: { afterAction: expect-t1-flagged }
        timeoutMs: 5000
        target: { by: testId, value: ai-test-4 }
        attribute: { name: data-value, value: "0.7059" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: drift
    chapter: "Data drift ကို ကြည့်ရအောင်"
    narration: >
      ဆိုင်က delivery app နဲ့ ချိတ်ပြီး သုံးလ ကြာတော့ ထုတ်ထားတဲ့ member စာရင်းကို ဒီ model နဲ့ပဲ
      စစ်ကြည့်ရအောင်။ [[mark:type-after]] အဲဒီ စာရင်းမှာလည်း column
      အသစ်ကို အရင် ထည့်ပြီးမှ model ကို ပေးပါမယ်။ [[mark:read-after]] အောက်ဆုံးက card မှာ မလာတော့တဲ့ ၅၂
      ယောက်ထဲက ၂၂ ယောက်ကိုပဲ မိလို့၊ test set မှာ ၇၅ ရာခိုင်နှုန်း ရှိခဲ့တဲ့ recall က ၄၂ ရာခိုင်နှုန်းအထိ
      ကျသွားပါတယ်။ [[mark:read-drift]] ဒါက data drift ပါ၊ delivery app ကြောင့် member တွေရဲ့ ပုံစံ ပြောင်းသွားပြီး
      train တုန်းက data နဲ့ မတူတော့လို့ မှန်ကန်မှု ကျလာတာပါ။
    sources:
      - {
          title: "web.dev Learn AI: Predictive AI: Turn data into insights (monitor for data drift)",
          url: "https://web.dev/learn/ai/predictive",
        }
      - {
          title: "web.dev Learn AI: Glossary and concepts (data drift)",
          url: "https://web.dev/learn/ai/glossary",
        }
    actions:
      - id: type-after
        type: editor.type
        at: { mark: type-after }
        target:
          {
            file: src/main.js,
            after: "showMistakes(model, rows, { regularVisits: 15 });\n",
            occurrence: 1,
          }
        text: "showAfter(model, perVisit(after.rows, \"complaints_90d\"));\n"
        cadence: line-by-line
      - id: expect-after-card
        type: expect.preview
        at: { afterAction: type-after }
        timeoutMs: 8000
        target: { by: testId, value: ai-cards }
        attribute: { name: data-count, value: "5" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: scroll-after
        type: preview.scroll
        at: { mark: read-after }
        top: 5000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-after-flagged
        type: expect.preview
        at: { afterAction: scroll-after }
        timeoutMs: 5000
        target: { by: testId, value: ai-after-1 }
        attribute: { name: data-value, value: "24" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-after-caught
        type: expect.preview
        at: { afterAction: expect-after-flagged }
        timeoutMs: 5000
        target: { by: testId, value: ai-after-2 }
        attribute: { name: data-value, value: "22" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-after-stopped
        type: expect.preview
        at: { afterAction: expect-after-caught }
        timeoutMs: 5000
        target: { by: testId, value: ai-after-3 }
        attribute: { name: data-value, value: "52" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-after-recall
        type: expect.preview
        at: { afterAction: expect-after-stopped }
        timeoutMs: 5000
        target: { by: testId, value: ai-after-5 }
        attribute: { name: data-value, value: "0.4231" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-test-back
        type: expect.preview
        at: { afterAction: expect-after-recall }
        timeoutMs: 5000
        target: { by: testId, value: ai-test-5 }
        attribute: { name: data-value, value: "0.75" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: maintain
    narration: >
      [[mark:draw-ops]] ဒါကြောင့် deploy လုပ်ပြီးတာနဲ့ အလုပ် မပြီးသေးပါဘူး။ မှန်ကန်မှုကို အမြဲ စောင့်ကြည့်ပြီး
      ကျလာရင် retrain လုပ်ရသလို၊ ခုနကလို အမှားတွေကနေ column ကောင်း ထည့်ရပါမယ်။ member
      ဈေးနှုန်း အသစ် လို ပြောင်းလဲမှုတွေ အတွက်လည်း ပုံမှန် retrain လုပ်ရပါတယ်။ [[mark:draw-pitfalls]] data
      ညံ့ရင် ခန့်မှန်းချက်လည်း ညံ့လို့ train မလုပ်ခင် data ကို အရင် ကြည့်ရပါမယ်။ overfitting ဆိုတာ train data
      ကို အလွတ်ကျက်ထားသလို ဖြစ်ပြီး data အသစ်မှာ မမှန်တော့တာပါ။ cross validation၊ regularization၊ holdout
      လို နည်းတွေက ML ကျွမ်းကျင်သူ သုံးတဲ့ ကာကွယ်နည်းတွေပါ။ [[mark:draw-metric]] accuracy ဆိုတာ အဖြေ
      အားလုံးထဲက မှန်တဲ့ အချိုးပါ။ ငွေ နှစ်ခါ ဖြတ်မိတာကို ဖမ်းတဲ့ model မှာ တစ်ခါ လွတ်တာက မှားသတိပေးတာထက်
      အများကြီး ပိုဆိုးပေမယ့်၊ နှစ်ခါ ဖြတ်တာက ရှားလို့ accuracy က ဒီ အမှားကို ဖုံးထားနိုင်ပါတယ်။
      [[mark:draw-observe]] ပြီးတော့ တဖြည်းဖြည်း launch လုပ်ပြီး observability ရှိအောင် လုပ်ရပါမယ်။ model
      version ကို မှတ်ပြီး metric တွေကို log လုပ်ထားလို့ system ထဲမှာ ဘာဖြစ်နေလဲ အမြဲ မြင်နေရတာပါ၊ ဒါမှ
      customer မသိခင် ပြဿနာကို ဖမ်းနိုင်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Predictive AI: Turn data into insights (deploy and maintain, common pitfalls and mitigations)",
          url: "https://web.dev/learn/ai/predictive",
        }
      - { title: "MLflow", url: "https://mlflow.org/" }
      - { title: "Weights & Biases", url: "https://wandb.ai/site/" }
    actions:
      - {
          id: draw-ops,
          type: whiteboard.apply,
          at: { mark: draw-ops },
          open: true,
          clear: true,
          upsertIds: [e-title, e-drift, e-learn],
          drawMs: 1600,
        }
      - {
          id: draw-pitfalls,
          type: whiteboard.apply,
          at: { mark: draw-pitfalls },
          upsertIds: [e-data, e-over, e-over2],
          drawMs: 1800,
        }
      - {
          id: draw-metric,
          type: whiteboard.apply,
          at: { mark: draw-metric },
          upsertIds: [e-metric],
          drawMs: 900,
        }
      - {
          id: draw-observe,
          type: whiteboard.apply,
          at: { mark: draw-observe },
          upsertIds: [e-obs, e-tools],
          drawMs: 1400,
        }

  - id: quiz
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ သင်္ကြန် ပြီးတဲ့နောက် member model ရဲ့ recall ရုတ်တရက် ကျသွားရင်
      ဘာဖြစ်နေတာလဲ၊ ဘာလုပ်ရမလဲ။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] အဖြေကတော့ data
      drift ပါ၊ data အသစ်နဲ့ retrain လုပ်ပြီး ဆက်စောင့်ကြည့်ရပါမယ်။ ဘာကြောင့်လဲဆိုတော့ ပွဲတော် ရာသီမှာ
      customer တွေ လာတဲ့ ပုံစံ ပြောင်းသွားပြီး၊ train တုန်းက data က အခု လက်တွေ့နဲ့ မတူတော့လို့ပါ။
    sources:
      - {
          title: "web.dev Learn AI: Predictive AI: Turn data into insights (Check your understanding)",
          url: "https://web.dev/learn/ai/predictive",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          clear: true,
          upsertIds: [z-title, z-q1, z-q2],
          drawMs: 1500,
        }
      - {
          id: draw-quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [z-a, z-a2, z-a-note],
          drawMs: 1800,
        }

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ predictive model ကို ကိုယ့် data နဲ့ train လုပ်ပြီး member
      တစ်ယောက်ချင်းစီအတွက် ဖြစ်နိုင်ခြေ ထုတ်ယူပါတယ်။ [[mark:sel-final-test]] test set နဲ့ precision၊ recall၊ F one ကို
      စစ်ပြီး threshold ကို ဆိုင်ရဲ့ ဦးစားပေးချက်နဲ့ ရွေးပါတယ်။ [[mark:sel-final-fix]] deploy လုပ်ပြီးရင်
      အမှားတွေကနေ column ကောင်း ထည့်တာ၊ [[mark:sel-final-after]] drift ကို စောင့်ကြည့်ပြီး retrain လုပ်တာတွေ
      ဆက်လုပ်ရပါမယ်။ နောက် lesson မှာတော့ ခန့်မှန်းတဲ့ နည်းကိုပဲ အများကြီး ပိုကြီးတဲ့ အတိုင်းအတာနဲ့ သုံးတဲ့
      generative AI နဲ့ token ကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Predictive AI: Turn data into insights (your takeaways)",
          url: "https://web.dev/learn/ai/predictive",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: recap }, open: false }
      - id: sel-final-test
        type: editor.select
        at: { mark: sel-final-test }
        target: { file: src/main.js, text: "showTest(model, sets.test);", occurrence: 1 }
      - id: sel-final-fix
        type: editor.select
        at: { mark: sel-final-fix }
        target:
          {
            file: src/main.js,
            text: 'columns = ["visits_30d", "days_since_last", "complaints_per_visit"];',
            occurrence: 1,
          }
      - id: sel-final-after
        type: editor.select
        at: { mark: sel-final-after }
        target:
          {
            file: src/main.js,
            text: 'showAfter(model, perVisit(after.rows, "complaints_90d"));',
            occurrence: 1,
          }
      - {
          id: expect-final-code,
          type: expect.file,
          at: { afterAction: sel-final-after },
          path: src/main.js,
          contains: "columns = [\"visits_30d\", \"days_since_last\", \"complaints_per_visit\"];\n\n// Train the model on the training set, then check it:\nconst model = trainLogistic(sets.train, {\n  columns, label: \"stopped\", epochs: 400, rate: 0.5,\n});\nshowModel(model, rows);\nshowTest(model, sets.test);\nshowMistakes(model, rows, { regularVisits: 15 });\nshowAfter(model, perVisit(after.rows, \"complaints_90d\"));\n",
        }
checks:
  - { type: timing.p95Ms, max: 300 }
