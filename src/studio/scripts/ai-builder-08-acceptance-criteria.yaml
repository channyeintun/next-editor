# AI Builder, lesson 08: acceptance criteria and the definition of done (Burmese, docs kind).
#
# Start state (ws/): base-docs (package.json with a no-op dev script, notes.md),
# docs/requirements.md complete (COURSE-KIT §4.2, as L07 leaves it) and docs/spec.md pinned with its
# title line only (`# Spec · ကြိုမှာ app (v1)` + a blank line). Nothing runs. The lesson types
# `## Acceptance criteria` (AC-1…AC-5) and `## Definition of done` exactly as COURSE-KIT §4.3, leaving
# the title line and its blank line where L09 inserts Goal…Out of scope.
#
# Boards: (A) who checks "done" (violet agent claim → orange question), then one criterion's anatomy
# (Given / When / Then with AC-4's example), the one-behaviour rule, and later the contract row
# (violet: the agent builds to it; green: we check by it); (V) vague → checkable, three pairs (red →
# green) and an orange rule; (Z) the quiz.
#
# Build: bun ~/Documents/ai-builder-course-work/tools/build-lesson.ts template.yaml ws ai-builder-08-acceptance-criteria.yaml
schemaVersion: 1
lesson:
  slug: ai-builder-08-acceptance-criteria
  title: "AI Builder 08: Acceptance criteria နဲ့ ပြီးတယ် ဆိုတာ ဘာလဲ"
  locale: my-MM
  workspace:
    lessonType: javascript
    name: AI Builder
    entryFilePath: docs/requirements.md
    sidebarStartsCollapsed: true
    files:
      docs/requirements.md: |
        # Requirements · ကြိုမှာ app

        ## User stories
        - Customer အနေနဲ့ ဆိုင်မရောက်ခင် ဖုန်းကနေ ကြိုမှာချင်တယ်၊ ဒါမှ တန်းမစီရဘဲ ယူသွားလို့ရမယ်။
        - Customer အနေနဲ့ လာယူမယ့် အချိန်ကို ရွေးချင်တယ်၊ ဒါမှ ရောက်တဲ့အချိန် အသင့်ဖြစ်နေမယ်။
        - ကောင်တာက လှလှ အနေနဲ့ ဝင်လာတဲ့ အော်ဒါတွေကို လာယူချိန်အလိုက် မြင်ချင်တယ်၊ ဒါမှ အချိန်မီ ပြင်ထားနိုင်မယ်။
        - ဆိုင်ပိုင်ရှင် မြမြ အနေနဲ့ တစ်မနက် ကြိုမှာတဲ့ အော်ဒါ အရေအတွက်ကို သိချင်တယ်၊ ဒါမှ app က အလုပ်ဖြစ်မဖြစ် သိမယ်။

        ## Non-functional
        - ဈေးပေါတဲ့ Android ဖုန်း၊ နှေးတဲ့ mobile data မှာ 3 စက္ကန့်အတွင်း ပွင့်ရမယ်။
        - မြန်မာစာ မှန်မှန် ပေါ်ရမယ်။ မြန်မာဂဏန်းနဲ့ ရိုက်ရင်လည်း လက်ခံရမယ်။
        - customer ရဲ့ ဖုန်းနံပါတ်ကို ဆိုင်ကလွဲရင် ဘယ်သူမှ မမြင်ရဘူး။
        - စာလုံး ကြီးကြီးနဲ့ ဖတ်တဲ့သူလည်း သုံးလို့ရရမယ်။
        - run ဖို့ တစ်လ 30,000 ကျပ်ထက် မကုန်ရဘူး။

        ## Constraints
        - app ကို ကိုယ်တစ်ယောက်တည်း AI agent နဲ့ တည်ဆောက်မယ်။
        - ငွေကို ကောင်တာမှာပဲ ချေမယ်။
        - ဆိုင်ဖွင့်ချိန် — တနင်္လာ–သောကြာ 6:00–20:00၊ စနေ–တနင်္ဂနွေ 7:00–21:00

        ## Scope (v1)
        Must
        - လာယူမယ့် အချိန်နဲ့ ကြိုမှာလို့ရတာ
        - အော်ဒါနံပါတ်
        - ကောင်တာမှာ အော်ဒါစာရင်း မြင်ရတာ
        Should
        - အော်ဒါ အသင့်ဖြစ်ရင် SMS ပို့တာ
        Won't (for now)
        - delivery
        - online ငွေပေးချေမှု
        - customer account နဲ့ login

        ## Edge cases
        - အရေအတွက် 0 ဒါမှမဟုတ် အနုတ် → လက်မခံ၊ 1 ကနေ 20 အထိ
        - ဆိုင်ပိတ်ချိန် လာယူချိန် → လက်မခံ၊ ဖွင့်ချိန်ကို ပြ
        - ဖုန်းနံပါတ် မပါ → လက်မခံ
        - မှာမယ် ကို နှစ်ခါ နှိပ် → အော်ဒါ တစ်ခုပဲ

        ## Assumptions
        - customer တွေ မှာပြီး 2 နာရီအတွင်း လာယူမယ်။
        - တစ်မနက် ကြိုမှာတဲ့ အော်ဒါ 50 ထက် မများဘူး။

        ## Questions for မြမြ
        - လာမယူတဲ့ အော်ဒါကို ဘယ်လောက်ကြာရင် ပယ်မလဲ။
        - ပိတ်ခါနီး ဘယ်နှမိနစ်အထိ ကြိုမှာခွင့်ပေးမလဲ။
