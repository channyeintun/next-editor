# Go course, lesson 28: time and Myanmar Time (Burmese).
#
# Start state: main.go with `package main`, an import block holding only "fmt" and an empty
# `func main`; clock.go holding only `package main`.
# Edits, all insert-only:
#   1. clock.go: `import "time"` and `mmt` (time.FixedZone, UTC+06:30), then `at(hour, minute)`
#      (COURSE-KIT §3.8, exact);
#   2. main.go: `leave := at(20, 0)`, print it, print it in UTC -> run-1:
#      2026-04-17 20:00:00 +0630 MMT / 2026-04-17 13:30:00 +0000 UTC;
#   3. "time" into the import block, `arrive := leave.Add(9 * time.Hour)`, Format + Sub -> run-2
#      adds 2026-04-18 05:00 9h0m0s;
#   4. Weekday twice and Before -> run-3 adds Friday Saturday true.
# Boards: (Z) one instant, two clocks (UTC and MMT), no daylight saving; (L) Go's reference time
# and the layout; (Q) quiz: a layout written as "20:00" prints 170:00.
# Fixtures: bun ~/Documents/go-course-work/tools/sim-go.ts <this yaml> --write
schemaVersion: 1

