  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: need
    chapter: CTO ရဲ့ တောင်းဆိုချက်
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ skill တွေကို project၊ plugin နဲ့ managed settings ဆိုတဲ့ အဝိုင်း သုံးခုနဲ့ မျှဝေပုံနဲ့၊ skill
      အလုပ်မလုပ်ရင် ပထမဆုံး စစ်ရမယ့် အရာတွေကို လေ့လာခဲ့ပါတယ်။ ဒီ lesson ကနေ စပြီး နည်းပညာကနေ ခဏ ထွက်ပြီး၊ အလုပ်
      တစ်ခုလုံးကို ဘယ်လို ပို့ဆောင်မလဲ ဆိုတဲ့ အပိုင်းကို ကြည့်ပါမယ်။
      [[mark:sel-billing]] trial မှာ Billing developer နှစ်ယောက်က Claude Code နဲ့ ၃ ရက်အတွင်း report job ၁၄၀ ထဲက ၁၂ ခုကို
      ရွှေ့ခဲ့ပြီး၊ ရွှေ့ပြီးတဲ့ job တိုင်းက job အဟောင်းရဲ့ output နဲ့ တိုက်စစ်တာ အောင်ခဲ့ပါတယ်။ Claude Code ဆိုတာ
      terminal ထဲကနေ code ကို ဖတ်၊ ပြင်၊ command run ပေးတဲ့ coding agent ပါ။
      [[mark:cto]] အဲဒီ ရလဒ်ကို မြင်တော့ CTO ဖြစ်တဲ့ အောင်အောင် က developer တွေအတွက် ရက် ၃၀ activation တစ်ခုကို
      တောင်းဆိုလာပါတယ်။ activation ဆိုတာ သုံးစွဲမှုကို တကယ် စတင်နိုင်အောင် ပြင်ဆင်တဲ့ အဆင့်ပါ။ သူ လိုချင်တာက ရက် ၃၀
      ပြည့်ရင် ဒါရိုက်တာ အဖွဲ့က ဖတ်ပြီး ဆုံးဖြတ်နိုင်မယ့် ရလဒ် တစ်ခုပါ။ ဒါကြောင့် ကိုယ်တို့က စာမျက်နှာ လေးမျက်နှာပါတဲ့
      Delivery Plan Pack ကို ပြင်ပါမယ်။ ဒီ lesson က အဲဒီ ပထမ စာမျက်နှာပါ။
      [[mark:ideas]] developer တွေကို Claude Code နဲ့ ဘာလုပ်ချင်လဲ မေးတော့ idea ၁၁ ခု ရောက်လာပါတယ်။ ဒါပေမဲ့ ရက် ၃၀ ထဲမှာ
      FDE တစ်ယောက်က သေသေချာချာ ကူညီပြီး ဂဏန်းနဲ့ ပြနိုင်တာ use case တစ်ခု နှစ်ခုပဲ ရှိပါတယ်။ use case ဆိုတာ AI နဲ့
      ဖြေရှင်းမယ့် အလုပ် တစ်မျိုးပါ။ ဒီ lesson ရဲ့ မေးခွန်းက ၁၁ ခုထဲက ဘယ်ဟာကို ရွေးမလဲ ဆိုတာပါ။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline, Delivery Methodology)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
    actions:
      - { id: open-readme, type: workspace.openFile, at: { scene: start }, path: README.md }
      - id: sel-billing
        type: editor.select
        at: { mark: sel-billing }
        target:
          file: README.md
          text: "- Billing team နဲ့ Claude Code"
      - id: sel-teams
        type: editor.select
        at: { mark: ideas }
        target:
          file: README.md
          text: "- developer team 4 ခု: Customer App, Billing, Network Tools, Internal Tools"

  - id: two-gains
    chapter: Marginal gain နဲ့ structural gain
    narration: >
      [[mark:g-open]] idea တွေကို မစစ်ခင် ပြောင်းလဲမှု နှစ်မျိုးကို ခွဲကြည့်ရအောင်။ Claude Forward Deployed Engineer learning
      path က ဒီ နှစ်မျိုးကို marginal gain နဲ့ structural gain လို့ ခေါ်ပါတယ်။
      [[mark:g-m]] marginal gain ဆိုတာ အလုပ် အတူတူကို နည်းနည်း ပိုမြန်သွားရုံပါ။ ဥပမာအားဖြင့် PR review တစ်ခုမှာ Claude က
      comment တွေကို ကြိုရေးပေးလို့ reviewer က နည်းနည်း ပိုမြန်မြန် ပြီးတယ် ဆိုပါစို့။ PR တစ်ခု၊ reviewer တစ်ယောက်၊
      review တစ်ကြိမ် ဆိုတဲ့ အလုပ်ပုံစံက မပြောင်းပါဘူး။
      [[mark:g-m-why]] ဒီ ပြောင်းလဲမှုက တကယ် ရှိပါတယ်။ ဒါပေမဲ့ ရက် ၃၀ အတွင်း ဒါရိုက်တာ အဖွဲ့ကို ပြဖို့ ခက်ပါတယ်။ PR တစ်ခုနဲ့
      တစ်ခု အရွယ်မတူ၊ reviewer တစ်ယောက်နဲ့ တစ်ယောက် မတူတော့ နည်းနည်း ပိုမြန်တာကို ဂဏန်းနဲ့ သေချာ ခွဲပြဖို့ အချိန်ပိုလိုလို့ပါ။
      [[mark:g-s]] structural gain ကတော့ အလုပ်လုပ်ပုံကိုယ်တိုင် ပြောင်းသွားတာပါ။ Billing ရဲ့ report migration ကို ကြည့်ပါ။ job
      ၁၄၀ ကို လက်နဲ့ ရွှေ့ရင် developer ငါးယောက် ရှစ်ပတ် ကြာမယ်လို့ ခန့်မှန်းထားပါတယ်။ developer တစ်ယောက် တစ်ပတ် လုပ်တာကို
      developer week တစ်ခုလို့ ရေတွက်ရင် ၄၀ ပါ။
      [[mark:g-s2]] Claude Code နဲ့ဆိုရင် developer နှစ်ယောက်က သုံးပတ်အတွင်း ပြီးဖို့ ရည်မှန်းပါတယ်။ developer week ခြောက်ခုပါ။
      ဒါက ရလဒ် မဟုတ်သေးဘဲ ခန့်မှန်းချက်နဲ့ target ပါ။ ပြောင်းသွားတာက အရေအတွက်ပဲ မဟုတ်ပါဘူး။ developer တွေက job တစ်ခုချင်း
      ကိုယ်တိုင် ပြန်ရေးမယ့်အစား Claude Code ရေးတာကို စစ်ပြီး approve လုပ်တဲ့သူ ဖြစ်သွားပါတယ်။
      [[mark:g-b]] ဒါကြောင့် ဒီလို ပြောင်းလဲမှုကို ရက် ၃၀ မတိုင်ခင် တိုင်းလို့ ရပြီး၊ ဒါရိုက်တာ အဖွဲ့ ရှေ့မှာလည်း ခုခံပြောနိုင်ပါတယ်။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (structural gain vs marginal gain)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
    actions:
      - {
          id: draw-g-open,
          type: whiteboard.apply,
          at: { mark: g-open },
          open: true,
          clear: true,
          upsertIds: [g-title],
        }
      - {
          id: draw-g-m,
          type: whiteboard.apply,
          at: { mark: g-m },
          upsertIds: [g-m, g-m-l, g-m-1, g-m-a, g-m-2],
          drawMs: 2000,
        }
      - {
          id: draw-g-m-why,
          type: whiteboard.apply,
          at: { mark: g-m-why },
          upsertIds: [g-m-b],
          drawMs: 900,
        }
      - {
          id: draw-g-s,
          type: whiteboard.apply,
          at: { mark: g-s },
          upsertIds: [g-s, g-s-l, g-s-1],
          drawMs: 1500,
        }
      - {
          id: draw-g-s2,
          type: whiteboard.apply,
          at: { mark: g-s2 },
          upsertIds: [g-s-a, g-s-2, g-note],
          drawMs: 1500,
