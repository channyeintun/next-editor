      - { id: draw-g-b, type: whiteboard.apply, at: { mark: g-b }, upsertIds: [g-s-b], drawMs: 900 }

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ Network Tools team ကလည်း idea နှစ်ခု တင်လာပါတယ်။ ဘယ်ဟာက structural gain
      ဖြစ်မလဲ။
      [[mark:q-a]] ပထမ idea က NMS alert တစ်ခု ဝင်တိုင်း developer ရေးရတဲ့ မှတ်စုကို Claude ကူရေးပေးလို့ မိနစ် အနည်းငယ်
      ပိုမြန်လာမယ် ဆိုတာပါ။
      [[mark:q-b]] ဒုတိယ idea က လစဉ် outage report ကို developer က ကိုယ်တိုင် ရေးစရာ မလိုတော့ဘဲ၊ skill တစ်ခုက ရေးထားတာကို
      developer က စစ်ပြီး ပြင်ရုံပဲ ဖြစ်လာမယ် ဆိုတာပါ။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ idea ပါ။ ဘာကြောင့်လဲဆိုတော့ developer လုပ်ရတဲ့ အလုပ်ကိုယ်တိုင် ရေးတဲ့ အလုပ်ကနေ
      စစ်တဲ့ အလုပ် ဖြစ်သွားလို့ပါ။ ပထမ idea မှာတော့ alert တစ်ခု၊ မှတ်စု တစ်ခု၊ developer တစ်ယောက် ဆိုတဲ့ ပုံစံ အတူတူပဲ ပိုမြန်လာတာပါ။
      ပထမ idea လည်း အသုံးဝင်ပါတယ်။ ဒါပေမဲ့ ရက် ၃၀ ရဲ့ headline ရလဒ်အတွက် မဟုတ်ပါဘူး။
      [[mark:q-rule]] ဒါကြောင့် idea တစ်ခုကို ကြားရင် ဘယ်သူ ဘာလုပ်ရလဲ ဆိုတာ ပြောင်းသွားလား အရင် မေးပါ။ မြန်လာရုံပဲ ဆိုရင်တော့
      marginal gain ပါ။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (structural gain vs marginal gain)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: q-rule },
          upsertIds: [q-t1, q-t2],
          drawMs: 1600,
        }

  - id: criteria
    chapter: စံ လေးခု
    narration: >
      [[mark:c-open]] structural gain ဖြစ်နိုင်တဲ့ idea ကို တွေ့ပြီဆိုရင်တောင် ရက် ၃၀ အတွက် သင့်တော်လား ဆိုတာ ထပ်စစ်ရပါသေးတယ်။
      learning path က စံ လေးခုကို ပေးထားပြီး၊ ကိုယ်တို့ နေခြည် အတွက် ကိုယ့်စကားနဲ့ ဒီလို အဓိပ္ပာယ်ဖွင့်ပါတယ်။
      [[mark:c-1]] ပထမ စံက volume ပါ။ ရက် ၃၀ အတွင်း တစ်ပတ်ချင်း ရေတွက်ပြလို့ ရလောက်အောင် အလုပ် ယူနစ် များလား ဆိုတာပါ။ report
      job ၁၄၀ ဆိုတာ တစ်ပတ်ချင်း ဘယ်နှခု ပြီးလဲ ပြလို့ ရပါတယ်။
      [[mark:c-2]] ဒုတိယ စံက complexity ပါ။ လက်နဲ့ဆိုရင် အချိန် အများကြီး ကြာလောက်အောင် ခက်ပေမဲ့၊ နယ်နိမိတ် ရှင်းရှင်း ရှိရပါမယ်။
      job တစ်ခုစီက ပုံစံ ဆင်တူပြီး၊ ဘာကို မထိရဘူးလဲ ဆိုတာ trial ကတည်းက သိပြီးသားပါ။
      [[mark:c-3]] တတိယ စံက measurability ပါ။ ရက် ၃၀ မတိုင်ခင် ဂဏန်းနဲ့ ပြနိုင်လား ဆိုတာပါ။ job တစ်ခုစီကို output တိုက်စစ်တာ
      အောင်မှ ပြီးတယ်လို့ ရေတွက်တာမို့ အရေအတွက်ကို ဘယ်သူ ရေရေ အတူတူ ရပါတယ်။
      [[mark:c-4]] စတုတ္ထ စံက developer readiness ပါ။ လုပ်မယ့် developer တွေ ကိုယ်တိုင် အဆင်သင့် ဖြစ်လား ဆိုတာပါ။ trial မှာ ပါခဲ့တဲ့
      နှစ်ယောက်က လုပ်ပုံကို သိပြီးသားပါ။ Billing team lead မောင်မောင် ကတော့ သံသယ ရှိနေဆဲပါ။ ဒါပေမဲ့ Claude Code ရဲ့
      champion kit က သံသယ ရှိတဲ့သူကို သူကိုယ်တိုင် ရှောင်နေတဲ့ အလုပ်ဆီ ညွှန်ပြဖို့ အကြံပေးပါတယ်။ library အဟောင်းပေါ်က report
      job တွေက Billing မှာ ဘယ်သူမှ မလုပ်ချင်တဲ့ အလုပ်ပါ။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (the four qualification criteria)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
      - {
          title: "Claude Code Docs: Champion kit",
          url: "https://code.claude.com/docs/en/champion-kit",
        }
    actions:
      - {
          id: close-quiz,
          type: whiteboard.apply,
          at: { mark: c-open, offsetMs: -1400 },
          open: false,
        }
      - {
          id: show-criteria,
          type: slide.show,
          at: { mark: c-open, offsetMs: -700 },
          slideId: criteria,
        }
      - { id: point-c-1, type: slide.point, at: { mark: c-1 }, target: { x: 0.15, y: 0.39 } }
      - { id: point-c-2, type: slide.point, at: { mark: c-2 }, target: { x: 0.15, y: 0.53 } }
      - { id: point-c-3, type: slide.point, at: { mark: c-3 }, target: { x: 0.15, y: 0.67 } }
      - { id: point-c-4, type: slide.point, at: { mark: c-4 }, target: { x: 0.15, y: 0.81 } }

  - id: score
    chapter: Idea တွေကို အမှတ်ပေးခြင်း
    narration: >
      [[mark:d-open]] ဒါဆို idea တွေကို ဒီ စံ လေးခုနဲ့ စာမျက်နှာပေါ်မှာ အမှတ်ပေးကြည့်ရအောင်။ ပြည့်ရင် အမှန်ခြစ်၊ တစ်ဝက်ဆိုရင်
      လှိုင်းတွန့်၊ မပြည့်ရင် ကြက်ခြေခတ်ပါ။ idea နှစ်ခုကို team နဲ့ အတူ အမှတ်ပေးပြီးသားပါ။
      [[mark:sel-tests]] invoice code အတွက် unit test ရေးတာက အသုံးဝင်ပေမဲ့ coverage ဂဏန်းကလွဲလို့ ရက် ၃၀ မှာ ပြစရာ နည်းပြီး၊
      အလုပ်ပုံစံလည်း မပြောင်းလို့ marginal လို့ မှတ်ထားပါတယ်။
      [[mark:sel-wish]] Customer App ကို framework အသစ်နဲ့ ပြန်ရေးမယ် ဆိုတဲ့ idea ကတော့ စံ လေးခုလုံးမှာ မပြည့်ပါဘူး။ အလုပ်က
      တစ်ခုတည်း၊ နယ်နိမိတ် မရှိ၊ ရက် ၃၀ မှာ ဘာမှ ရေတွက်စရာ မရှိပါဘူး။ ဒီလို idea မျိုးကို wishlist လို့ ခေါ်ပါတယ်။ wishlist ထဲက
      idea တစ်ခုဟာ စံ လေးခုထဲက အနည်းဆုံး တစ်ခုမှာ ကျတတ်ပါတယ်။
      [[mark:type-migration]] အခု report migration ကို ထည့်ပါမယ်။ စံ တစ်ခုစီကို ရှင်းတုန်းက ဒီ job တွေနဲ့ပဲ
      စစ်ကြည့်ခဲ့ပြီး၊ လေးခုလုံး ပြည့်တာကို တွေ့ခဲ့ပါပြီ။ developer ရဲ့ အလုပ်ကလည်း ကိုယ်တိုင် ရေးတာကနေ စစ်တာ ဖြစ်သွားလို့
      structural လို့ မှတ်ပါတယ်။
      [[mark:type-review]] PR review ကို ပိုမြန်အောင် လုပ်မယ် ဆိုတဲ့ idea ကိုလည်း ထည့်ပါမယ်။ PR တွေ များပြီး developer တွေလည်း
      အဆင်သင့် ဖြစ်ပါတယ်။ ဒါပေမဲ့ နည်းနည်း ပိုမြန်တာကို ရက် ၃၀ နဲ့ ခွဲပြဖို့ ခက်လို့ measurability မှာ ကျပါတယ်။ marginal ပါ။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (use case qualification)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
    actions:
      - { id: close-criteria, type: slide.close, at: { mark: d-open, offsetMs: -900 } }
      - {
          id: open-doc,
          type: workspace.openFile,
          at: { afterAction: close-criteria },
          path: notebook/46-use-case-qualification.md,
        }
      - id: sel-tests
        type: editor.select
        at: { mark: sel-tests }
        target:
          file: notebook/46-use-case-qualification.md
          text: "| invoice code အတွက် unit test | ~ | ✓ | ~ coverage ပဲ | ✓ | marginal |"
      - id: sel-wish
        type: editor.select
        at: { mark: sel-wish }
        target:
          file: notebook/46-use-case-qualification.md
          text: "| Customer App ကို framework အသစ်နဲ့ ပြန်ရေး | ✗ 1 ခု | ✗ နယ်နိမိတ် မရှိ | ✗ | ✗ team မစရသေး | wishlist |"
      - id: type-migration
        type: editor.type
        at: { mark: type-migration }
        cadence: line-by-line
        target:
          { file: notebook/46-use-case-qualification.md, after: "| ✗ team မစရသေး | wishlist |\n" }
        text: "| report job 140 ခု ရွှေ့ | ✓ 140 | ✓ လက်နဲ့ 40 developer-weeks | ✓ output တိုက်စစ် | ✓ trial dev 2 | structural |\n"
      - id: expect-migration
        type: expect.file
        at: { afterAction: type-migration }
        path: notebook/46-use-case-qualification.md
        contains: "| report job 140 ခု ရွှေ့ | ✓ 140 | ✓ လက်နဲ့ 40 developer-weeks | ✓ output တိုက်စစ် | ✓ trial dev 2 | structural |\n"
      - id: type-review
        type: editor.type
        at: { mark: type-review }
        cadence: line-by-line
        target:
          { file: notebook/46-use-case-qualification.md, after: "| ✓ trial dev 2 | structural |\n" }
        text: "| PR review ပိုမြန် | ✓ | ~ | ✗ ရက် 30 နဲ့ ခွဲပြဖို့ ခက် | ✓ | marginal |\n"

  - id: saying-no
    chapter: ရွေးတာ ဆိုတာ ငြင်းတာ
    narration: >
      [[mark:type-choice]] စာမျက်နှာရဲ့ အောက်ဆုံးမှာ ရွေးချယ်ချက်ကို ရေးပါမယ်။ ရက် ၃၀ မှာ report migration တစ်ခုတည်းကို headline
      use case အဖြစ် ယူပါမယ်။ ခန့်မှန်းချက်နဲ့ target ကိုလည်း ဂဏန်းနဲ့ တွဲရေးထားပါတယ်။ ဒါတွေက ရလဒ် မဟုတ်သေးဘဲ၊ ရက် ၃၀
      ပြည့်တဲ့နေ့မှာ ယှဉ်ကြည့်မယ့် ဂဏန်းတွေပါ။
      [[mark:sel-rest]] ရွေးတယ် ဆိုတာ တကယ်တော့ ငြင်းတာပါ။ ကျန်တဲ့ idea ဆယ်ခုက မကောင်းလို့ မဟုတ်ပါဘူး။ use case များလာရင်
      FDE ရဲ့ အကူအညီ ခွဲသွားပြီး၊ ရက် ၃၀ ပြည့်တဲ့နေ့မှာ ဘယ် ရလဒ်က ဘယ် use case ကြောင့်လဲ ခွဲပြောဖို့ ခက်လို့ပါ။ ဒါကြောင့်
      ကျန်တဲ့ idea တွေကို ဖျက်မပစ်ဘဲ ဘာကြောင့် စောင့်ရလဲ ဆိုတာနဲ့ အတူ စာမျက်နှာပေါ်မှာ ထားခဲ့ပါတယ်။
      [[mark:sel-why]] idea တင်ခဲ့တဲ့ developer တွေကို ပြန်ပြောတဲ့အခါမှာလည်း ဒီ ဇယားက အထောက်အကူ ဖြစ်ပါတယ်။ ကိုယ့် idea က ဘယ် စံမှာ
      ကျလဲ မြင်ရတော့၊ ငြင်းတာက လူကို ငြင်းတာ မဟုတ်ဘဲ အချိန်ကို ရွေးတာ ဖြစ်ကြောင်း နားလည်ပါတယ်။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (Delivery Plan Pack)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
    actions:
      - id: type-choice
        type: editor.type
        at: { mark: type-choice }
        cadence: line-by-line
        target:
