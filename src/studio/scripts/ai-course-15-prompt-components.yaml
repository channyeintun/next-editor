      src/assemble.js: |
        // Prompt assembly: plain code that turns the parts into the messages the model gets (no model here).
        import { panel } from "ai-panel";

        const NAMES = { context: "Context", instruction: "Instruction", input: "Input variables", format: "Output format", examples: "Examples", constraints: "Constraints" };
        const section = ([part, text]) => `### ${NAMES[part] ?? part}\n${text}`;

        // Every part, in the order it is written, as one user message.
        export const oneMessage = (prompt) => [{ role: "user", content: Object.entries(prompt).map(section).join("\n\n") }];

        // The stable parts as the system message; only the item of the moment as the user message.
        export const systemAndUser = ({ input, ...stable }) => [
          { role: "system", content: Object.entries(stable).map(section).join("\n\n") },
          { role: "user", content: input },
        ];

        // The Prompt parts card (which message each part goes in) and the recorded token counts.
        export function showParts(prompt, messages, tokens) {
          const sentIn = (part) => (messages.length > 1 && part !== "input" ? "system" : "user");
          panel.metrics("Tokens", { prompt: tokens?.promptTokens ?? "—", answer: tokens?.outputTokens ?? "—" }, { id: "tokens" });
          panel.table("Prompt parts", Object.keys(prompt).map((part) => ({ part, "sent in": sentIn(part) })), { id: "parts", badge: "rules · AI မပါ" });
        }
      src/llm.js: |
        // The lesson's stand-in for a model API.
        // A real model is slow and can answer differently from run to run, so this lesson uses answers
        // recorded ahead of time from a real model: data/responses.json (how: data/PROVENANCE.md).
        // generate() returns the recorded answer for exactly these messages, and shows it in the panel.
        import recorded from "../data/responses.json";
        import { panel } from "ai-panel";

        export const model = recorded.provenance;

        const find = (messages) => {
          const key = JSON.stringify(messages.map(({ role, content }) => ({ role, content })));
          return recorded.responses.find((r) => JSON.stringify(r.messages) === key);
        };

        export async function generate(messages, { show = true } = {}) {
          const hit = find(messages);
          if (!hit) {
            const error = new Error("No recorded answer for these exact messages yet.");
            error.name = "CourseNotice";
            throw error;
          }
          if (show) panel.output("Model answer", hit.output, { id: "answer", badge: `recorded · ${model.label} · greedy` });
          return hit.output;
        }

        // The token counts the model's own tokenizer gave when the answer was recorded (the prompt includes
        // the chat template's own tokens): { promptTokens, outputTokens }, or null when not recorded.
        export function tokensFor(messages) {
          const hit = find(messages);
          return hit ? { promptTokens: hit.promptTokens, outputTokens: hit.outputTokens } : null;
        }
      src/main.js: |
        import helper from "../data/helper.json";
        import { generate, tokensFor } from "./llm.js";
        import { helperPrompt } from "./prompt.js";
        import { oneMessage, systemAndUser, showParts } from "./assemble.js";
        import { helperPage } from "./page.js";

        // The new item လှလှ wants descriptions for.
        const item = helper.newItems[0];

        // How the parts go to the model: for now, all of them in one message.
        let toMessages = oneMessage;

        async function show(item) {
          const prompt = helperPrompt(item);
          const messages = toMessages(prompt);
          await generate(messages);
          showParts(prompt, messages, tokensFor(messages));
        }

        await show(item);
      src/page.js: |
        // The staff's page for the helper: pick an item and a style, then press one button.
        // The task, the format and the rules stay in the system prompt; only these choices change.
        import { button, choices } from "./ui.js";

        const MENU = ["n01", "n03"];
        const STYLES = { ဖော်ဖော်ရွေရွေ: "friendly", "emoji နဲ့": "friendly, with one emoji" };

        export function helperPage(items, show) {
          const menu = MENU.map((id) => items.find((i) => i.id === id));
          let item = menu[0];
          let style = "friendly";
          choices("item", menu.map((i) => i.name), (name, i) => (item = menu[i]), { label: "menu", selected: item.name });
          choices("style", Object.keys(STYLES), (label) => (style = STYLES[label]), { label: "style", selected: "ဖော်ဖော်ရွေရွေ" });
          button("ဖော်ပြချက်တွေ ကြည့်မယ်", "show-descriptions", () => show({ ...item, style }));
        }
      src/prompt-api.js: |
        // The same helper with Chrome's built-in Prompt API (adapted from web.dev's example, Apache 2.0).
        // Not run in this lesson: built-in AI never runs inside this preview (lesson 13), and today the
        // Prompt API writes English, Japanese, Spanish, German and French, not Burmese.
        export async function createHelper(systemPrompt) {
          // Once, when the page opens: the system prompt sets the behaviour for the whole session.
          const session = await LanguageModel.create({
            initialPrompts: [{ role: "system", content: systemPrompt }],
          });
          // Each press of ဖော်ပြချက်တွေ ကြည့်မယ် sends only the item, to a fresh clone of the session:
          // it keeps the system prompt, and the items asked for earlier don't mix into this answer.
          return async (itemText) => {
            const fresh = await session.clone();
            const answer = await fresh.prompt(itemText);
            fresh.destroy();
            return answer;
          };
        }
      src/prompt.js: |
        // The description helper's prompt: the contract between the shop's page and the model.
        // One line per part, so each part can be versioned, tested and improved on its own.
        export const helperPrompt = (item) => ({
          instruction: "Write three short descriptions of this menu item for the shop's website, in Burmese.",
          format: 'Return only JSON in this shape: {"descriptions": ["…", "…", "…"]}',
        });
      src/ui.js: |
        // Page controls for the lesson program: a row of buttons or choices in #app, above the AI panel.
        // Plain DOM, so the studio records every click and replay shows it exactly. Each control gets a
        // data-testid for preview.click. #app starts empty on every run, so controls are drawn by the
        // program each time. A handler that throws prints to the panel's Console (never the page).
        //
        //   import { row, button, choices } from "./ui.js";
        //   choices("threshold", [0.5, 0.7, 0.9], (t) => show(t), { selected: 0.5 });
        //     → buttons with test ids threshold-1, threshold-2, threshold-3 (1-based, in order)
        //   button("ဖော်ပြချက်တွေ ကြည့်မယ်", "show-descriptions", () => …);
        const STYLE_ID = "ui-style";
        const STYLE = `
        #app .ui-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px 0;
          font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans Myanmar", "Myanmar Sangam MN", "Myanmar Text", sans-serif; color: #d9dce2; }
        #app .ui-label { color: #adb5bd; font-size: 13px; }
        #app .ui-btn { font: inherit; color: #f1f3f5; background: #2d323c; border: 1px solid #3a404b; border-radius: 6px; padding: 3px 12px; cursor: pointer; }
        #app .ui-btn[aria-pressed="true"] { background: #7048e8; border-color: #7048e8; color: #fff; font-weight: 600; }
        `;

        function ensureStyle() {
          if (document.getElementById(STYLE_ID)) return;
          const style = document.createElement("style");
          style.id = STYLE_ID;
          style.textContent = STYLE;
          document.head.append(style);
        }

        const safe = (fn) => (...args) => {
          try {
            const result = fn(...args);
            if (result && typeof result.catch === "function") result.catch((error) => console.error(error));
          } catch (error) {
            console.error(error);
          }
        };

        /** A new row in #app, optionally with a short label in front. Returns the row element. */
        export function row(label = "") {
          ensureStyle();
          const el = document.createElement("div");
          el.className = "ui-row";
          if (label) {
            const span = document.createElement("span");
            span.className = "ui-label";
            span.textContent = label;
            el.append(span);
          }
          document.getElementById("app").append(el);
          return el;
        }

        /** One button. `testid` is used as is. */
        export function button(label, testid, onClick, parent = row()) {
          const el = document.createElement("button");
          el.type = "button";
          el.className = "ui-btn";
          el.textContent = String(label);
          el.dataset.testid = testid;
          el.addEventListener("click", safe(onClick));
          parent.append(el);
          return el;
        }

        /** A row of choices; the picked one is shown pressed. Test ids are `<name>-1`, `<name>-2`, … */
        export function choices(name, options, onPick, { label = name, selected } = {}) {
          const parent = row(label);
          const buttons = options.map((option, i) =>
            button(option, `${name}-${i + 1}`, () => {
              for (const b of buttons) b.setAttribute("aria-pressed", String(b === buttons[i]));
              onPick(option, i);
            }, parent),
          );
          for (const [i, b] of buttons.entries()) b.setAttribute("aria-pressed", String(options[i] === selected));
          return buttons;
        }
      vite.config.js: |
        import { defineConfig } from "vite";
        import courseRunner from "./course/runner.js";

        export default defineConfig({
          plugins: [courseRunner()],
        });
