        x: 300,
        y: 390,
        width: 700,
        height: 50,
        text: "role · အဖြေ ပုံစံ · ကန့်သတ်ချက်",
        strokeColor: "#2f9e44",
        fontSize: 36,
      }
    - {
        id: z-a-note,
        kind: text,
        x: 300,
        y: 465,
        width: 700,
        height: 40,
        text: "ရွေးထားတဲ့ item → user prompt",
        strokeColor: "#6741d9",
        fontSize: 28,
      }
build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 5115
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "Prompt ဆိုတာ ဘာလဲ"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ Transformers.js လို library နဲ့ model ကို browser ထဲမှာ run ပြီး၊
      အောက်က runtime တွေကိုပါ ကြည့်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ model ကို ဘာလုပ်ရမလဲ ပြောပေးတဲ့ prompt ကို
      ကြည့်ပါမယ်။ [[mark:draw-mini]] blueprint မှာဆိုရင် intelligence အလွှာထဲက model ကို ခိုင်းတဲ့ အပိုင်းပါ။
      [[mark:draw-today]] ကောင်တာက လှလှ ဟာ menu အသစ် ထွက်တိုင်း helper နဲ့ ဖော်ပြချက် မူကြမ်းတွေ
      ရေးပါတယ်။ helper ရဲ့ အဖြေ ကောင်းမကောင်းက prompt ပေါ်မှာ အများကြီး မူတည်ပါတယ်။
      user မျှော်လင့်တဲ့ အဖြေ ထွက်လာအောင် prompt ကို ရေးတာ၊ ပြန်ပြင်တာကို prompt engineering လို့ ခေါ်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Prompt engineering",
          url: "https://web.dev/learn/ai/prompt-engineering",
        }
      - {
          title: "web.dev Learn AI: Introduction to AI on the web (the blueprint)",
          url: "https://web.dev/learn/ai/introduction",
        }
      - {
          title: "web.dev Learn AI: Welcome to Learn AI! (course credit: written by Dr. Janna Lipenkova with editorial guidance from Alexandra Klepper; text CC BY 4.0, code Apache 2.0; adapted into Burmese with the course's own tea-shop examples)",
          url: "https://web.dev/learn/ai/welcome",
        }
      - {
          title: "Creative Commons: Attribution 4.0 International (CC BY 4.0), the licence of the web.dev Learn AI text adapted here",
          url: "https://creativecommons.org/licenses/by/4.0/",
        }
    actions:
      - {
          id: open-board-a,
          type: whiteboard.apply,
          at: { scene: start, offsetMs: -450 },
          open: true,
          clear: true,
          upsertIds: [a-title],
        }
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - {
          id: draw-mini,
          type: whiteboard.apply,
          at: { mark: draw-mini },
          upsertIds:
            [
              a-opp,
              a-opp-t,
              a-arrow-1,
              a-data,
              a-data-t,
              a-intel,
              a-intel-t,
              a-ux,
              a-ux-t,
              a-arrow-2,
              a-gov,
              a-gov-t,
            ],
          drawMs: 2400,
        }
      - {
          id: draw-today,
          type: whiteboard.apply,
          at: { mark: draw-today },
          upsertIds: [a-today],
          drawMs: 1000,
        }

  - id: contract
    narration: >
      [[mark:draw-contract]] prompt ကို ဆိုင်ရဲ့ page နဲ့ model ကြားက စာချုပ် တစ်ခုလို့ မြင်ကြည့်ပါ။
      [[mark:draw-c1]] ကောင်းတဲ့ prompt က အဖြေကို ဘယ်လို ရေးရမလဲ ဆိုတာ ရှင်းရှင်း ပြောပါတယ်။ [[mark:draw-c2]]
      အပိုင်းလိုက် ခွဲရေးထားလို့ အပိုင်း တစ်ခုချင်းကို version ထိန်း၊ test လုပ်ပြီး ပြင်လို့ ရပါတယ်။
      [[mark:draw-c3]] ပြီးတော့ ကိုယ်နဲ့ လှလှ လို team တစ်ခုလုံး အတူ ဖတ်ပြီး ပြင်တဲ့ စာလည်း ဖြစ်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Prompt engineering",
          url: "https://web.dev/learn/ai/prompt-engineering",
        }
    actions:
      - {
          id: draw-contract,
          type: whiteboard.apply,
          at: { mark: draw-contract },
          clear: true,
          upsertIds:
            [b-title, b-page, b-page-t, b-a1, b-prompt, b-prompt-t, b-a2, b-model, b-model-t],
          drawMs: 2200,
        }
      - {
          id: draw-c1,
          type: whiteboard.apply,
          at: { mark: draw-c1 },
          upsertIds: [b-c1],
          drawMs: 900,
        }
      - {
          id: draw-c2,
          type: whiteboard.apply,
          at: { mark: draw-c2 },
          upsertIds: [b-c2],
          drawMs: 900,
        }
      - {
          id: draw-c3,
          type: whiteboard.apply,
          at: { mark: draw-c3 },
          upsertIds: [b-c3],
          drawMs: 900,
        }

  - id: components
    chapter: "Prompt ရဲ့ အစိတ်အပိုင်း ခြောက်ခု"
    narration: >
      [[mark:draw-parts]] prompt မှာ အစိတ်အပိုင်း ခြောက်ခု ရှိနိုင်ပါတယ်။ [[mark:draw-p1]] context က model ရဲ့
      role နဲ့ နယ်ပယ် ဖြစ်ပြီး၊ instruction က လုပ်ရမယ့် အလုပ်ပါ။ [[mark:draw-p2]] input variable ကတော့ item
      နာမည်၊ လှလှ ရဲ့ မှတ်ချက် လို app က request တိုင်းမှာ ထည့်ပေးတဲ့ အချက်တွေ ဖြစ်ပြီး၊ output format က အဖြေ
      ပုံစံပါ။ [[mark:draw-p3]] example က တခြား input တစ်ခုအတွက် အဖြေ နမူနာပါ။ constraint ကတော့ အဖြေကို
      တစ်သမတ်တည်း ဖြစ်အောင်၊ ဘေးကင်းအောင်၊ ဆိုင်ရဲ့ လေသံနဲ့ ကိုက်အောင် ထိန်းတဲ့ ကန့်သတ်ချက်ပါ။
      [[mark:draw-start]] ခြောက်ခုလုံး အမြဲ မလိုပါဘူး။ instruction နဲ့ output format နဲ့ စပြီး၊ အဖြေကို
      ကြည့်ရင်း လိုတဲ့ အပိုင်းကို တစ်ခုချင်း ထပ်ထည့်ပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Prompt engineering (prompt components)",
          url: "https://web.dev/learn/ai/prompt-engineering",
        }
    actions:
      - {
          id: draw-parts,
          type: whiteboard.apply,
          at: { mark: draw-parts },
          clear: true,
          upsertIds: [c-title],
        }
      - {
          id: draw-p1,
          type: whiteboard.apply,
          at: { mark: draw-p1 },
          upsertIds: [c-r1, c-n1, c-g1, c-r2, c-n2, c-g2],
          drawMs: 1800,
        }
      - {
          id: draw-p2,
          type: whiteboard.apply,
          at: { mark: draw-p2 },
          upsertIds: [c-r3, c-n3, c-g3, c-r4, c-n4, c-g4],
          drawMs: 1800,
        }
      - {
          id: draw-p3,
          type: whiteboard.apply,
          at: { mark: draw-p3 },
          upsertIds: [c-r5, c-n5, c-g5, c-r6, c-n6, c-g6],
          drawMs: 1800,
        }
      - {
          id: draw-start,
          type: whiteboard.apply,
          at: { mark: draw-start },
          upsertIds: [c-start],
          drawMs: 1000,
        }

  - id: start
    chapter: "Instruction နဲ့ output format က စရအောင်"
    narration: >
      [[mark:close-parts]] helper ရဲ့ prompt ကို ကြည့်ရအောင်။ [[mark:open-prompt]] prompt ဖိုင်မှာ အပိုင်း
      တစ်ခုကို စာကြောင်း တစ်ကြောင်းစီ ရေးထားပါတယ်။ [[mark:sel-instruction]] instruction က menu item တစ်ခုအတွက်
      website မှာ တင်မယ့် ဖော်ပြချက် တိုတို သုံးခုကို မြန်မာလို ရေးခိုင်းထားပြီး၊ [[mark:sel-format]] output
      format က အဲဒီ သုံးခုကို JSON နဲ့ပဲ ပြန်ပေးခိုင်းပါတယ်။ [[mark:panel-ready]] ညာဘက် AI panel ရဲ့
      အပေါ်ဆုံးက Model answer ကို ကြည့်ပါ။ ဒါက ဒီ prompt နဲ့ ကြိုပြီး run ထားတုန်းက တကယ် ထွက်လာခဲ့တဲ့ အဖြေပါ။
      laptop ပေါ်က open model သေးသေးလေး တစ်ခုရဲ့ အဖြေကို ကြိုမှတ်ထားလို့ ကြည့်တဲ့သူတိုင်း ဒီ အဖြေကိုပဲ
      မြင်ရပြီး၊ badge ကလည်း အဲဒါကို ပြနေပါတယ်။ [[mark:read-ask]] model က ဖော်ပြချက် မရေးဘဲ၊ ဘယ် item
      အတွက်လဲလို့ အင်္ဂလိပ်လို ပြန်မေးနေပါတယ်။ prompt ထဲမှာ item မပါသေးလို့ပါ။ [[mark:read-parts]] အဖြေနဲ့အတူ မှတ်ထားတဲ့ Tokens card မှာ prompt က token ၅၄ ခု၊ အဖြေက ၁၄ ခု ရှိပါတယ်။ Prompt parts ဇယားကတော့ အပိုင်း နှစ်ခုကို ပြထားပြီး၊
      model မပါတဲ့ code နဲ့ ဆွဲထားလို့ badge က AI မပါဘူးလို့ ပြနေပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Prompt engineering (prompt components)",
          url: "https://web.dev/learn/ai/prompt-engineering",
        }
    actions:
      - { id: close-parts, type: whiteboard.apply, at: { mark: close-parts }, open: false }
      - {
          id: open-prompt,
          type: workspace.openFile,
          at: { mark: open-prompt },
          path: src/prompt.js,
        }
      - id: sel-instruction
        type: editor.select
        at: { mark: sel-instruction }
        target:
          {
            file: src/prompt.js,
            text: 'instruction: "Write three short descriptions of this menu item for the shop''s website, in Burmese."',
            occurrence: 1,
          }
      - id: sel-format
        type: editor.select
        at: { mark: sel-format }
        target:
          {
            file: src/prompt.js,
            text: 'format: ''Return only JSON in this shape: {"descriptions": ["…", "…", "…"]}''',
            occurrence: 1,
          }
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-done
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: ai-status }
        attribute: { name: data-state, value: "done" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-three-cards
        type: expect.preview
        at: { afterAction: expect-done }
        timeoutMs: 5000
        target: { by: testId, value: ai-cards }
        attribute: { name: data-count, value: "3" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-badge
        type: expect.preview
        at: { afterAction: expect-three-cards }
        timeoutMs: 5000
        target: { by: testId, value: ai-answer-badge }
        textContains: "recorded · Gemma 4 E2B · greedy"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-asks
        type: expect.preview
        at: { mark: read-ask }
        timeoutMs: 5000
        target: { by: testId, value: ai-answer }
        textContains: "Please provide the menu item"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-prompt-54
        type: expect.preview
        at: { mark: read-parts }
        timeoutMs: 5000
        target: { by: testId, value: ai-tokens-1 }
        attribute: { name: data-value, value: "54" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-answer-14
        type: expect.preview
        at: { afterAction: expect-prompt-54 }
        timeoutMs: 5000
        target: { by: testId, value: ai-tokens-2 }
        attribute: { name: data-value, value: "14" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-two-parts
        type: expect.preview
        at: { afterAction: expect-answer-14 }
        timeoutMs: 5000
        target: { by: testId, value: ai-parts }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-parts-badge
        type: expect.preview
        at: { afterAction: expect-two-parts }
        timeoutMs: 5000
        target: { by: testId, value: ai-parts-badge }
        textContains: "rules · AI မပါ"
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: input
    narration: >
      [[mark:type-input]] ဒါကြောင့် instruction ရဲ့ အောက်မှာ input variable တွေ ထည့်ပါမယ်။ item နာမည်၊ မှတ်ချက်နဲ့ style ကို app က data ထဲကနေ ဖြည့်ပေးမှာပါ။ [[mark:read-input]] ဒီ item တွေက
      lesson အတွက် ပြင်ဆင်ထားတဲ့ နမူနာ data ပါ။ ဒီတစ်ခါ အဖြေမှာ ထန်းလျက် ကော်ဖီ ရဲ့ ဖော်ပြချက် သုံးခု
      ပါလာပြီး၊ မှတ်ချက်ထဲက နို့ဆီ မပါတာကိုလည်း သုံးထားပါတယ်။ ဒါပေမဲ့ တချို့ ဖော်ပြချက်က စာကြောင်း
      နှစ်ကြောင်း ရှည်ပြီး၊ အဖြေက token ၁၄၂ ခု ရှိပါတယ်။ JSON ကိုလည်း markdown code fence ထဲ ထုပ်ထားလို့ program က တိုက်ရိုက် ဖတ်လို့ မရပါဘူး။
    sources:
      - {
          title: "web.dev Learn AI: Prompt engineering (prompt components: input variables)",
          url: "https://web.dev/learn/ai/prompt-engineering",
        }
    actions:
      - id: type-input
        type: editor.type
        at: { mark: type-input }
        target:
          { file: src/prompt.js, after: "for the shop's website, in Burmese.\",\n", occurrence: 1 }
        text: "  input: `Item: ${item.name}\\nStaff notes: ${item.notes}\\nStyle: ${item.style}`,\n"
        cadence: block
      - id: expect-input-answer
        type: expect.preview
        at: { afterAction: type-input }
        timeoutMs: 8000
        target: { by: testId, value: ai-answer }
        textContains: "ထန်းလျက်ရဲ့ အရသာကို ခံစားလိုက်ပါ။"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-input-tokens
        type: expect.preview
        at: { afterAction: expect-input-answer }
        timeoutMs: 5000
        target: { by: testId, value: ai-tokens-2 }
        attribute: { name: data-value, value: "142" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-three-parts
        type: expect.preview
        at: { afterAction: expect-input-tokens }
        timeoutMs: 5000
        target: { by: testId, value: ai-parts }
        attribute: { name: data-count, value: "3" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: context
    narration: >
      [[mark:type-context]] အပေါ်ဆုံးမှာ context ကို ထည့်ပါမယ်။ model ကို ရန်ကုန်က ကိုယ်တို့ ဆိုင်ရဲ့ menu ရေးတဲ့ helper အဖြစ် role ပေးတာပါ။
      [[mark:read-context]] အဖြေမှာ ဆိုင်နာမည်ကိုပါ ထည့်ပြီး၊ လာစမ်းကြည့်ဖို့ ဖိတ်ခေါ်တဲ့ ကြော်ငြာ လေသံ
      ဖြစ်လာပါတယ်။ ဒါပေမဲ့ မှတ်ချက်ထဲမှာ မပါတဲ့ သဘာဝ ထန်းလျက် ဆိုတဲ့ စကားလည်း ပါလာပြီး၊ အဖြေက ပိုရှည်လာလို့
      token ၂၁၃ ခု ဖြစ်သွားပါတယ်။ role ကို ပြောရုံနဲ့ အရှည်ကို မထိန်းနိုင်ပါဘူး။
    sources:
      - {
          title: "web.dev Learn AI: Prompt engineering (prompt components: context)",
          url: "https://web.dev/learn/ai/prompt-engineering",
        }
    actions:
      - id: type-context
        type: editor.type
        at: { mark: type-context }
        target:
          {
            file: src/prompt.js,
            after: "export const helperPrompt = (item) => ({\n",
            occurrence: 1,
          }
        text: "  context: \"You are the menu-writing helper of Shwe Tea House, a tea shop in Yangon. The counter staff use you to describe new items.\",\n"
        cadence: block
      - id: expect-context-answer
        type: expect.preview
        at: { afterAction: type-context }
        timeoutMs: 8000
        target: { by: testId, value: ai-answer }
        textContains: "Shwe Tea House ရဲ့ ထန်းလျက် ကော်ဖီလေးကို"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-context-tokens
        type: expect.preview
        at: { afterAction: expect-context-answer }
        timeoutMs: 5000
