  - id: examples
    narration: >
      [[mark:type-examples]] ဒါကြောင့် example တစ်ခု ထည့်ပါမယ်။ လက်ဖက်ရည် ရဲ့ မှတ်ချက်ကို input အဖြစ်၊ ကိုယ်
      လိုချင်တဲ့ ဖော်ပြချက် တိုတို သုံးခုကို အဖြေ အဖြစ် ပြထားတာပါ။ [[mark:read-examples]] ဖော်ပြချက် တစ်ခုစီက
      စာကြောင်း တစ်ကြောင်းစီ ဖြစ်သွားပြီး၊ အဖြေက token ၁၁၉ ခု အထိ ကျသွားပါတယ်။ ဒါပေမဲ့ example ကြောင့် prompt
      က token ၂၅၆ ခု ဖြစ်လာပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Prompt engineering (prompt components: examples)",
          url: "https://web.dev/learn/ai/prompt-engineering",
        }
    actions:
      - id: type-examples
        type: editor.type
        at: { mark: type-examples }
        target:
          {
            file: src/prompt.js,
            after: "{\"descriptions\": [\"…\", \"…\", \"…\"]}',\n",
            occurrence: 1,
          }
        text: "  examples: `Item: လက်ဖက်ရည်\nStaff notes: လက်ဖက်ခြောက် ပြင်းပြင်း၊ နို့ဆီနဲ့၊ ပူပူ\nStyle: friendly\n{\"descriptions\": [\"လက်ဖက်ခြောက် ပြင်းပြင်းနဲ့ ဖျော်ထားတဲ့ လက်ဖက်ရည် ပူပူလေး\", \"နို့ဆီ ချိုချိုနဲ့ မနက်တိုင်း သောက်ချင်စရာ\", \"ရနံ့ မွှေးမွှေး၊ အရသာ ပြည့်ပြည့်နဲ့ လက်ဖက်ရည် တစ်ခွက်\"]}`,\n"
        cadence: block
      - id: expect-examples-answer
        type: expect.preview
        at: { afterAction: type-examples }
        timeoutMs: 8000
        target: { by: testId, value: ai-answer }
        textContains: "ထန်းလျက်ရဲ့ ချိုမြိန်တဲ့ အရသာနဲ့ ဖျော်ထားတဲ့ ကော်ဖီလေးပါ။"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-examples-tokens
        type: expect.preview
        at: { afterAction: expect-examples-answer }
        timeoutMs: 5000
        target: { by: testId, value: ai-tokens-2 }
        attribute: { name: data-value, value: "119" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-examples-prompt
        type: expect.preview
        at: { afterAction: expect-examples-tokens }
        timeoutMs: 5000
        target: { by: testId, value: ai-tokens-1 }
        attribute: { name: data-value, value: "256" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: constraints
    narration: >
      [[mark:type-constraints]] နောက်ဆုံး constraint တွေ ထည့်ပါမယ်။ စာလုံး ၆၀ အောက်၊ မှတ်ချက်ထဲက အချက်တွေပဲ၊ ဈေးနှုန်းနဲ့ အခမဲ့၊ အကောင်းဆုံး လို မစစ်နိုင်တဲ့ စကား မပါဖို့၊ style မတောင်းရင် emoji မပါဖို့နဲ့ code fence မပါဖို့ ကန့်သတ်ထားပါတယ်။ [[mark:read-constraints]] အဖြေက code fence မပါတဲ့ JSON ဖြစ်သွားပြီး၊ ဖော်ပြချက်
      သုံးခုလုံး တိုတိုလေးတွေ ဖြစ်လာပါပြီ။ [[mark:read-size]] ဒါပေမဲ့ Tokens card မှာ prompt က token ၅၄ ခုကနေ
      ၃၁၀ ခု ဖြစ်လာတာကို ကြည့်ပါ။ ဒီ token တွေကို request တိုင်း ပို့ရလို့ prompt ရှည်လေ ကြာလေ ဖြစ်ပြီး၊
      server ပေါ်က model ဆိုရင် ငွေလည်း ပိုကုန်ပါတယ်။ example နဲ့ အသေးစိတ်တွေ များလွန်းရင် model ကိုလည်း
      ရှုပ်စေနိုင်ပါတယ်။ ဒါကြောင့် prompt ထဲက စာကြောင်း တိုင်းမှာ ရှင်းလင်းတဲ့ ရည်ရွယ်ချက် ရှိရပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Prompt engineering (prompt components: constraints, don't over-inflate)",
          url: "https://web.dev/learn/ai/prompt-engineering",
        }
    actions:
      - id: type-constraints
        type: editor.type
        at: { mark: type-constraints }
        target: { file: src/prompt.js, after: "လက်ဖက်ရည် တစ်ခွက်\"]}`,\n", occurrence: 1 }
        text: "  constraints: \"Each description under 60 characters. Use only facts from the notes: no prices, no discounts or free offers, no claims like best. No emoji unless the style asks. A warm, natural tone. The JSON alone, without code fences.\",\n"
        cadence: block
      - id: expect-constraints-answer
        type: expect.preview
        at: { afterAction: type-constraints }
        timeoutMs: 8000
        target: { by: testId, value: ai-answer }
        textContains: "အရသာကောင်းပြီး သာယာတဲ့ ထန်းလျက်ကော်ဖီ"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-constraints-tokens
        type: expect.preview
        at: { afterAction: expect-constraints-answer }
        timeoutMs: 5000
        target: { by: testId, value: ai-tokens-2 }
        attribute: { name: data-value, value: "56" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-six-parts
        type: expect.preview
        at: { afterAction: expect-constraints-tokens }
        timeoutMs: 5000
        target: { by: testId, value: ai-parts }
        attribute: { name: data-count, value: "6" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-prompt-310
        type: expect.preview
        at: { mark: read-size }
        timeoutMs: 5000
        target: { by: testId, value: ai-tokens-1 }
        attribute: { name: data-value, value: "310" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: system-user
    chapter: "System prompt နဲ့ user prompt"
    narration: >
      [[mark:draw-sys]] ဒီ အပိုင်းတွေထဲမှာ request တိုင်း မပြောင်းတာနဲ့ ပြောင်းတာ ရှိပါတယ်။
      system prompt ဆိုတာ developer ရေးထားတဲ့၊ request တိုင်းမှာ မပြောင်းဘဲ ပါနေတဲ့ စည်းကမ်းတွေပါ။ role၊ အဖြေ ပုံစံ၊ example နဲ့ ဘေးကင်းရေး စည်းကမ်းတွေ ဒီမှာ ပါပါတယ်။ [[mark:draw-user]] user
      prompt ကတော့ user ရဲ့ အခု လက်ရှိ တောင်းဆိုချက်ပါ။ [[mark:draw-roles]] model API အများစုက role ပါတဲ့
      message စာရင်းကို လက်ခံလို့ ဒီ နှစ်ခုကို ခွဲပို့လို့ ရပါတယ်။ [[mark:close-sys]] code မှာ ခွဲကြည့်ရအောင်။
      [[mark:open-main]] main ဖိုင်မှာ အခုထိ အပိုင်း အားလုံးကို message တစ်ခုတည်းနဲ့ ပို့နေပါတယ်။
      [[mark:type-split]] အဲဒါကို system နဲ့ user ခွဲပို့တဲ့ function နဲ့ အစားထိုးတဲ့ စာကြောင်းကို အောက်မှာ
      ထည့်ပါမယ်။ [[mark:read-split]] Prompt parts ဇယားမှာ input တစ်ခုပဲ user ဘက်မှာ ကျန်ပြီး၊ ကျန်တဲ့ ငါးခုက
      system ဘက် ရောက်သွားပါပြီ။ အဖြေလည်း တိုတိုလေး သုံးခုပဲ ဖြစ်ပြီး prompt က token ၃၁၀ ခု အတိုင်းပါပဲ။
    sources:
      - {
          title: "web.dev Learn AI: Prompt engineering (system versus user prompts)",
          url: "https://web.dev/learn/ai/prompt-engineering",
        }
    actions:
      - {
          id: draw-sys,
          type: whiteboard.apply,
          at: { mark: draw-sys },
          open: true,
          clear: true,
          upsertIds: [d-title, d-sys, d-sys-t, d-sys-1, d-sys-2, d-sys-3, d-sys-4],
          drawMs: 2400,
        }
      - {
          id: draw-user,
          type: whiteboard.apply,
          at: { mark: draw-user },
          upsertIds: [d-user, d-user-t, d-user-1, d-user-2],
          drawMs: 1600,
        }
      - {
          id: draw-roles,
          type: whiteboard.apply,
          at: { mark: draw-roles },
          upsertIds: [d-roles],
          drawMs: 1000,
        }
      - { id: close-sys, type: whiteboard.apply, at: { mark: close-sys }, open: false }
      - { id: open-main, type: workspace.openFile, at: { mark: open-main }, path: src/main.js }
      - id: sel-one
        type: editor.select
        at: { afterAction: open-main }
        target: { file: src/main.js, text: "let toMessages = oneMessage;", occurrence: 1 }
      - id: type-split
        type: editor.type
        at: { mark: type-split }
        target: { file: src/main.js, after: "let toMessages = oneMessage;\n", occurrence: 1 }
        text: "toMessages = systemAndUser;\n"
        cadence: line-by-line
      - id: expect-split-answer
        type: expect.preview
        at: { afterAction: type-split }
        timeoutMs: 8000
        target: { by: testId, value: ai-answer }
        textContains: "နို့ဆီမပါတဲ့ အရသာကောင်းလေး"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-split-context
        type: expect.preview
        at: { afterAction: expect-split-answer }
        timeoutMs: 5000
        target: { by: testId, value: ai-parts-1 }
        textContains: "contextsystem"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-split-input
        type: expect.preview
        at: { afterAction: expect-split-context }
        timeoutMs: 5000
        target: { by: testId, value: ai-parts-3 }
        textContains: "inputuser"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-split-prompt
        type: expect.preview
        at: { afterAction: expect-split-input }
        timeoutMs: 5000
        target: { by: testId, value: ai-tokens-1 }
        attribute: { name: data-value, value: "310" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: constrained
    chapter: "ခလုတ် တစ်ခုနဲ့ ပုံသေ အလုပ်"
    narration: >
      [[mark:type-page]] helper ရဲ့ အလုပ်က ပုံသေ ဖြစ်တဲ့အတွက် prompt အများစုကို system prompt ထဲမှာ
      ကြိုထားလို့ ရပါတယ်။ ဒါကြောင့် ဝန်ထမ်းတွေ သုံးမယ့် page လေး ထည့်ပါမယ်။ [[mark:read-page]] panel ရဲ့
      အပေါ်မှာ item ရွေးတဲ့ ခလုတ်၊ style ခလုတ်နဲ့ ဖော်ပြချက်တွေ ကြည့်မယ် ခလုတ် ပေါ်လာပါပြီ။ ခလုတ်မှာ ဖန်တီးမယ်
      မဟုတ်ဘဲ ကြည့်မယ် လို့ ရေးထားတဲ့ အကြောင်းကို နောက်ပိုင်း U X lesson မှာ ပြောပါမယ်။ [[mark:click-item]] အုန်းနို့ခေါက်ဆွဲ ကို ရွေးပြီး၊
      [[mark:click-show]] ခလုတ်ကို နှိပ်ကြည့်ရအောင်။ [[mark:read-show]] သောကြာနေ့မှာ ရနိုင်တာ၊ ကြက်သားနဲ့
      ဟင်းရည် ပျစ်ပျစ် ဆိုတာတွေ ပါတဲ့ ဖော်ပြချက် သုံးခု ပေါ်လာပါပြီ။ system prompt က မပြောင်းဘဲ user prompt
      ထဲက item ပဲ ပြောင်းသွားတာပါ။ [[mark:open-api]] Chrome ရဲ့ built in AI ထဲက Prompt API နဲ့ ရေးရင်လည်း
      ပုံစံ အတူတူပါပဲ။ [[mark:sel-initial]] session ကို ဆောက်တုန်းက system prompt ကို တစ်ခါပဲ ပေးပြီး၊
      [[mark:sel-prompt]] ခလုတ် နှိပ်တိုင်း session ကို clone လုပ်ပြီး item ရဲ့ စာကိုပဲ ပို့လို့၊ အရင် နှိပ်ခဲ့တဲ့ item တွေ မရောပါဘူး။ ဒါပေမဲ့ ဒီ ဖိုင်ကို ဒီ lesson မှာ run
      မှာ မဟုတ်ပါဘူး။ built in AI က ဒီ preview ထဲမှာ အလုပ် မလုပ်သလို၊ Prompt API က မြန်မာစာကိုလည်း
      အခုအချိန်မှာ support မလုပ်သေးလို့ပါ။
    sources:
      - {
          title: "web.dev Learn AI: Prompt engineering (constrained use cases)",
          url: "https://web.dev/learn/ai/prompt-engineering",
        }
      - {
          title: "Chrome for Developers: The Prompt API",
          url: "https://developer.chrome.com/docs/ai/prompt-api",
        }
      - {
          title: "Apache License 2.0, the licence of web.dev Learn AI's code (its Prompt API example is adapted in src/prompt-api.js)",
          url: "https://www.apache.org/licenses/LICENSE-2.0",
        }
    actions:
      - id: type-page
        type: editor.type
        at: { mark: type-page }
        target: { file: src/main.js, after: "await show(item);\n", occurrence: 1 }
        text: "helperPage(helper.newItems, show);\n"
        cadence: line-by-line
      - id: expect-page-item
        type: expect.preview
        at: { afterAction: type-page }
        timeoutMs: 8000
        target: { by: testId, value: item-1 }
        attribute: { name: aria-pressed, value: "true" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-page-button
        type: expect.preview
        at: { afterAction: expect-page-item }
        timeoutMs: 5000
        target: { by: testId, value: show-descriptions }
        textContains: "ဖော်ပြချက်တွေ ကြည့်မယ်"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: click-item
        type: preview.click
        at: { mark: click-item }
        timeoutMs: 5000
        target: { by: testId, value: item-2 }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-item-pressed
        type: expect.preview
        at: { afterAction: click-item }
        timeoutMs: 5000
        target: { by: testId, value: item-2 }
        attribute: { name: aria-pressed, value: "true" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: click-show
        type: preview.click
        at: { mark: click-show }
        timeoutMs: 5000
        target: { by: testId, value: show-descriptions }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-show-answer
        type: expect.preview
        at: { afterAction: click-show }
        timeoutMs: 5000
        target: { by: testId, value: ai-answer }
        textContains: "အရသာရှိတဲ့ အုန်းနို့ခေါက်ဆွဲ"
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-show-system
        type: expect.preview
        at: { afterAction: expect-show-answer }
        timeoutMs: 5000
        target: { by: testId, value: ai-parts-1 }
        textContains: "contextsystem"
        retry: { maxAttempts: 2, delayMs: 300 }
      - { id: open-api, type: workspace.openFile, at: { mark: open-api }, path: src/prompt-api.js }
      - id: sel-initial
        type: editor.select
        at: { mark: sel-initial }
        target:
          {
            file: src/prompt-api.js,
            text: 'initialPrompts: [{ role: "system", content: systemPrompt }],',
            occurrence: 1,
          }
      - id: sel-prompt
        type: editor.select
        at: { mark: sel-prompt }
        target:
          {
            file: src/prompt-api.js,
            text: "const fresh = await session.clone();\n    const answer = await fresh.prompt(itemText);",
            occurrence: 1,
          }

  - id: style
    narration: >
      ဝန်ထမ်းတွေက ပိုထိန်းချင်လာရင် prompt ရဲ့ အပိုင်း တချို့ကို page ပေါ်က ခလုတ်နဲ့ ရွေးခွင့် ပေးပြီး
      user prompt ထဲ ထည့်ပေးလို့ ရပါတယ်။ style ခလုတ်က အဲဒီလို ပေးထားတာပါ။ [[mark:click-style]] emoji နဲ့ ဆိုတဲ့ style ကို ရွေးပြီး၊
      [[mark:click-show-2]] ခလုတ်ကို ထပ်နှိပ်ကြည့်ရအောင်။ [[mark:read-style]] တတိယ ဖော်ပြချက်ရဲ့ နောက်ဆုံးမှာ
      emoji တစ်ခု ပါလာပါပြီ။ system prompt က style မတောင်းရင် emoji မထည့်နဲ့ လို့ ပြောထားပြီး၊ ဝန်ထမ်း ရွေးတဲ့
      style က တောင်းလိုက်လို့ပါ။ ဒါပေမဲ့ ခလုတ်တွေ များလာရင် page ရှုပ်လာလို့၊ user ကိုယ်တိုင် စာရိုက်ပြီး
      ခိုင်းတဲ့ ပိုပွင့်တဲ့ design ကို ပြောင်းဖို့ စဉ်းစားရပါတယ်။ ဒါကို course ရဲ့ နောက်ဆုံး lesson မှာ
      ကြည့်ပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Prompt engineering (constrained use cases: moving parts into the UI)",
          url: "https://web.dev/learn/ai/prompt-engineering",
        }
    actions:
      - id: click-style
        type: preview.click
        at: { mark: click-style }
        timeoutMs: 5000
        target: { by: testId, value: style-2 }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-style-pressed
        type: expect.preview
        at: { afterAction: click-style }
        timeoutMs: 5000
        target: { by: testId, value: style-2 }
        attribute: { name: aria-pressed, value: "true" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: click-show-2
        type: preview.click
        at: { mark: click-show-2 }
        timeoutMs: 5000
        target: { by: testId, value: show-descriptions }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-style-answer
        type: expect.preview
        at: { afterAction: click-show-2 }
        timeoutMs: 5000
        target: { by: testId, value: ai-answer }
        textContains: "အရသာရှိပြီး စားလို့ကောင်းတယ် 😋"
        retry: { maxAttempts: 3, delayMs: 500 }

  - id: flexible
    chapter: "Flexible task တွေ"
    narration: >
      [[mark:draw-flex]] prompt ရဲ့ ဘယ်အပိုင်းကို user လက်ထဲ ပေးမလဲ ဆိုတာ U X ဘယ်လောက် ပွင့်လဲ၊ model ဘယ်လောက် စွမ်းလဲ
      ဆိုတာပေါ် မူတည်ပါတယ်။ [[mark:draw-btn]] ခလုတ် တစ်ခုနဲ့ ပုံသေ အလုပ်မှာ system prompt က အလုပ် အများစုကို လုပ်ပေးလို့ model သေးသေးနဲ့လည်း ရပါတယ်။ [[mark:draw-chat]] user က အကြံ တောင်းတာ၊ ပြန်ရေးခိုင်းတာ စတာတွေကို
      ကိုယ်တိုင် ရေးခိုင်းတဲ့ flexible task မှာတော့ user prompt က အလုပ် ပိုလုပ်ရလို့ ပိုစွမ်းတဲ့ model
      လိုပြီး၊ များသောအားဖြင့် server ပေါ်က model ကို သုံးရပါတယ်။ [[mark:draw-warn]] လက်တွေ့မှာ chatbot ကို
      စောစော ထည့်ရင် မအောင်မြင်တာ များပါတယ်။ [[mark:draw-watch]] ဒါကြောင့် user တွေ တကယ် ဘာလုပ်လဲ
      စောင့်ကြည့်ပါ။ ပိုပွင့်တိုင်း ပိုအကျိုးရှိတာ မဟုတ်ဘဲ၊ user မှာ prompt ရှည်ရှည် ရေးဖို့ အချိန်နဲ့
      ကျွမ်းကျင်မှုလည်း လိုပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Prompt engineering (flexible tasks rely on detailed user prompts)",
          url: "https://web.dev/learn/ai/prompt-engineering",
        }
    actions:
      - {
          id: draw-flex,
          type: whiteboard.apply,
          at: { mark: draw-flex },
          open: true,
          clear: true,
          upsertIds: [e-title],
        }
      - {
          id: draw-btn,
          type: whiteboard.apply,
          at: { mark: draw-btn },
          upsertIds: [e-btn, e-btn-t, e-btn-1, e-btn-2],
          drawMs: 1600,
        }
      - {
          id: draw-chat,
          type: whiteboard.apply,
          at: { mark: draw-chat },
          upsertIds: [e-arrow, e-chat, e-chat-t, e-chat-1, e-chat-2],
          drawMs: 1800,
        }
      - {
          id: draw-warn,
          type: whiteboard.apply,
          at: { mark: draw-warn },
          upsertIds: [e-warn],
          drawMs: 1000,
        }
      - {
          id: draw-watch,
          type: whiteboard.apply,
          at: { mark: draw-watch },
          upsertIds: [e-watch],
          drawMs: 1000,
        }

  - id: quiz
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ helper ရဲ့ system prompt ထဲမှာ ဘာတွေ ထည့်သင့်လဲ။ lesson ကို pause
      လုပ်ပြီး စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] အဖြေကတော့ model ရဲ့ role၊ အဖြေ ပုံစံ၊ စာလုံး အရေအတွက်
      ကန့်သတ်ချက် လို မပြောင်းတဲ့ စည်းကမ်းတွေပါ။ ဘာကြောင့်လဲဆိုတော့ system prompt က request တိုင်းမှာ တူနေတဲ့
      developer ရဲ့ အခြေခံ ဖြစ်လို့ပါ။ ဝန်ထမ်း ရွေးတဲ့ item လို အခု တောင်းတာကတော့ user prompt ထဲ ရောက်ရပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Prompt engineering (Check your understanding)",
          url: "https://web.dev/learn/ai/prompt-engineering",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [z-title, z-q1, z-q2],
          drawMs: 1500,
        }
      - {
          id: draw-quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [z-a, z-a-note],
          drawMs: 1800,
        }

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ prompt က page နဲ့ model ကြားက စာချုပ်ပါ။ [[mark:sel-parts]] instruction နဲ့ output format က စပြီး၊ အဖြေကို ကြည့်ရင်း လိုတဲ့ အပိုင်းကိုပဲ ထပ်ထည့်ပါ။ [[mark:sel-split]] မပြောင်းတဲ့
      စည်းကမ်းတွေကို system prompt မှာ ထားပြီး၊ အခု တောင်းတာကိုပဲ user prompt နဲ့ ပို့ပါ။ [[mark:sel-page]]
      ခလုတ် တစ်ခုနဲ့ ပုံသေ အလုပ်ဆိုရင် system prompt က အလုပ် အများစုကို လုပ်ပေးပါတယ်။ နောက် lesson မှာတော့
      zero shot၊ few shot၊ chain of thought လို prompting နည်းလမ်းတွေကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Prompt engineering",
          url: "https://web.dev/learn/ai/prompt-engineering",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: recap }, open: false }
      - {
          id: open-prompt-recap,
          type: workspace.openFile,
          at: { mark: sel-parts },
          path: src/prompt.js,
        }
      - id: sel-parts
        type: editor.select
        at: { afterAction: open-prompt-recap }
        target:
          { file: src/prompt.js, text: "export const helperPrompt = (item) => ({", occurrence: 1 }
      - {
          id: open-main-recap,
          type: workspace.openFile,
          at: { mark: sel-split },
          path: src/main.js,
        }
      - id: sel-split
        type: editor.select
        at: { afterAction: open-main-recap }
        target: { file: src/main.js, text: "toMessages = systemAndUser;", occurrence: 1 }
      - id: sel-page
        type: editor.select
        at: { mark: sel-page }
        target: { file: src/main.js, text: "helperPage(helper.newItems, show);", occurrence: 1 }
      - {
          id: expect-final-prompt,
          type: expect.file,
          at: { afterAction: sel-page },
          path: src/prompt.js,
          contains: '  constraints: "Each description under 60 characters.',
        }
      - {
          id: expect-final-main,
          type: expect.file,
          at: { afterAction: expect-final-prompt },
          path: src/main.js,
          contains: "let toMessages = oneMessage;\ntoMessages = systemAndUser;\n",
        }
checks:
  - { type: timing.p95Ms, max: 300 }
