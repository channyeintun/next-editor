# CSS course (Burmese), lesson 26 of 43: pseudo-elements.
#
# Narration is Burmese (voice-script.md next to this file is its source;
# DESIGN.md is the span-by-span brief). Every [[mark:…]] sits where its action
# begins, at a sentence end; each span carries one piece of meaning.
# Everything the learner sees (title, chapters, whiteboard labels, UI strings)
# is Burmese.
#
# Shape: board (recall lesson 25; what a pseudo-element is: parts the browser
# makes) → board (one colon vs two, the four legacy spellings, last in the
# selector) → code tour (prices hold only the number, the English quote, the
# hours list) → ::before star on today's special → ::after " ကျပ်" on every
# price; the HTML still holds only the number → board (before/after are the
# first/last child INSIDE the box; no content, no box; inline) → content values
# (empty string, counter, url, attr) → attr() rule for the one price with a
# data-unit attribute (wins by specificity) → alt text "★ " / "" (no visible
# change; old browsers skip the line) → h2::after bar typed WITHOUT content
# (nothing appears) → content: "" added (the bar appears) → replaced elements
# → drop cap built in four visible steps on the English quote → board
# (Burmese clusters) → ::first-line bold; max-width makes the bold part
# shorter → board (allowed properties, block containers only) → ::marker on
# the hours bullets → board (marker box, UA defaults, allowed properties) →
# summary::marker + / − and a click that opens the question → ::placeholder
# + the real label → ::selection (code only; try it live) → quiz board +
# recap, hand-off to pseudo-classes (lesson 27).
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set(; no postcss config; no reload.
# Unit-less lengths are invalid until the unit lands ("2.6" → "2.6em",
# "260" → "260px"), so no half-typed width flashes. Two inserts land inside an
# existing rule and pass through an unclosed string for a moment (the alt
# text and content: ""): the browser drops that declaration (and the one after
# it) until the quote closes — a sub-second flicker, never narrated.
#
# Measured in headless Chrome at 432 × 720 (probe/stages.ts, same anchors):
# document 1252 tall at start; the bars add 7 px per heading (about at 519,
# quote at 572, hours at 719 → 748 after max-width, form at 944 after the
# question opens; document 1349, max scroll 629). Drop cap: font-size makes the
# first line tall (quote 104 tall); float wraps the text but the letter hangs
# into the Burmese paragraph; line-height 1 closes it (quote 58). The bold
# first line runs past the first full stop at 400 px and stops mid-sentence at
# 260 px. Clicking the summary opens the details (open="") and focuses it.
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
