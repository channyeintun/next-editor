# CSS course (Burmese), lesson 1 of 43: CSS basics.
#
# Narration is Burmese, applied from voice-script.md next to this file (the
# span-by-span brief is DESIGN.md): every [[mark:…]] sits where its action
# begins, after ။ or a ၊ pause, and each span carries one piece of meaning tied
# to what is on screen. Everything the learner sees (title, chapters,
# whiteboard labels, the tea-shop UI) is Burmese too.
#
# Shape: two boards (what CSS is next to HTML and JavaScript, with the tea-shop
# page drawn as boxes; the course map) while the dev server installs, a code
# tour (index.html, the stylesheet link, the empty styles.css), the unstyled
# page in the preview (user agent stylesheet), a board on default display
# values, then rules typed live into styles.css: the body background and text
# colour, a rule-anatomy board, the Myanmar font stack, a commented heading
# rule, a deliberately misspelled declaration that the browser skips, a code
# tour of the three ways to add CSS (pinned <style> element and style
# attribute), link and heading backgrounds that make inline and block boxes
# visible, a DevTools board and the recap.
#
# Live-preview safety (PLATFORM.md): styles.css is the only typed file and
# never contains url(, @import or image-set(; every value typed keystroke by
# keystroke is a colour keyword with no valid shorter prefix (oldlace,
# saddlebrown, firebrick, darkgreen, khaki), so no intermediate colour flashes.
# The comment is typed at the end of the file, so its unfinished state hides
# nothing. index.html is never edited (the <style> element and the style
# attribute are pinned and only selected), so the preview never reloads.
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
