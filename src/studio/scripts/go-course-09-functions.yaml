# Go course, lesson 09: functions (Burmese).
#
# Start state: main.go with `package main`, `import "fmt"` and an empty `func main`.
# Edits, all insert-only:
#   1. taxiFare (its comment, the signature and only the short-ride `if ... return 1500`) above
#      main, and `fmt.Println(taxiFare(2))` in main -> run-1: compile error
#      `./main.go:11:1: missing return` (the function's closing brace);
#   2. the long-ride `return 1500 + (km-2)*700`, then `, taxiFare(8)` into the call -> run-2:
#      1500 5700;
#   3. withTax and formatKyat (COURSE-KIT 3.1) and the chained call in main -> run-3 adds
#      5985 ကျပ်.
# Boards: (F) main hands 8 to taxiFare and gets 5700 back; (P) the two paths, one without a
# return; (C) the chain of three calls, innermost first; (Q) quiz: a result nobody keeps.
# Fixtures: bun ~/Documents/go-course-work/tools/sim-go.ts <this yaml> --write
schemaVersion: 1

lesson:
  slug: go-course-09-functions
  title: "Go course 09: Function ဆိုတာ"
  locale: my-MM
  workspace:
    lessonType: go
