      ပါဆယ်ပါ။ ရန်ကုန် ပါဆယ်က ကီလို ဝက်ပဲ ရှိလို့ အပေါ့ဆုံး ဖြစ်ပြီး၊ မန္တလေး ပါဆယ်က နှစ်ကီလိုခွဲ ရှိလို့
