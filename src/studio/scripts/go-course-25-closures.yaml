  - id: sort
    chapter: Function ကို ပေးပို့တာ
    narration: >-
      [[mark:close-bags]] နောက်တစ်ခု၊ function ကို တခြား function ဆီ ပေးတာကို ကြည့်ရအောင်။ [[mark:open-parcel]]
      parcel ဖိုင်ထဲမှာ ပါဆယ် တစ်ခုရဲ့ struct ရှိပါတယ်။ [[mark:sel-weight]] ဒီနေ့ လိုချင်တာက ပါဆယ်တွေကို
      ဒီ အလေးချိန် field နဲ့ ပေါ့တာကနေ လေးတာ အစဉ်လိုက် စီဖို့ပါ။ [[mark:open-main-2]] main ဖိုင်ကို
      ပြန်သွားပြီး၊ [[mark:type-parcels]] ပါဆယ် သုံးခု ပါတဲ့ slice တစ်ခု ထည့်ပါမယ်။ ဂဏန်း slice ဆိုရင်
      ဘယ်ဟာ ငယ်လဲ Go က သိပါတယ်။ ဒါပေမဲ့ ပါဆယ် နှစ်ခုမှာ ဘယ်ဟာက အရင် လာရမလဲ ဆိုတာ Go မသိပါဘူး၊ code
      နဲ့ စီမလား၊ မြို့နဲ့ စီမလား၊ အလေးချိန်နဲ့ စီမလား။ [[mark:type-sort]] ဒါကြောင့် slices package ထဲက
      SortFunc ကို slice နဲ့ အတူ နှိုင်းယှဉ်ပေးမယ့် function တစ်ခုကိုပါ ပေးပါတယ်။ [[mark:sel-compare]] ဒီ
      function က ပါဆယ် နှစ်ခုကို ယူပြီး၊ ပထမ ပါဆယ်က အရင် လာရမယ်ဆိုရင် အနှုတ် ကိန်း၊ တူရင် သုည၊ နောက်မှ
      လာရမယ်ဆိုရင် အပေါင်း ကိန်း ပြန်ပေးရပါတယ်။ cmp package ထဲက Compare က ဂဏန်း နှစ်ခုအတွက် ဒါကို
      အတိအကျ လုပ်ပေးပါတယ်။ [[mark:type-imports]] package နှစ်ခု သုံးမှာ ဖြစ်လို့ import ထဲမှာ ထည့်ပါမယ်။
      ဒါဆို program က ပါဆယ်တွေကို အလေးချိန်နဲ့ စီပြီး၊ အပေါ့ဆုံးနဲ့ အလေးဆုံး ပါဆယ်ရဲ့ code ကို ထုတ်ပြပါမယ်။
      [[mark:run-2]] ကဲ၊ run လိုက်ရအောင်။
    sources:
      - { title: "slices package — SortFunc", url: "https://pkg.go.dev/slices#SortFunc" }
      - { title: "cmp package — Compare", url: "https://pkg.go.dev/cmp#Compare" }
    actions:
      - {
          id: close-bags,
          type: whiteboard.apply,
          at: { mark: close-bags },
          open: false,
          upsertIds: [],
        }
      - { id: open-parcel, type: workspace.openFile, at: { mark: open-parcel }, path: parcel.go }
      - id: sel-weight
        type: editor.select
        at: { mark: sel-weight }
        target: { file: parcel.go, text: "WeightKg float64", occurrence: 1 }
      - { id: open-main-2, type: workspace.openFile, at: { mark: open-main-2 }, path: main.go }
      - id: type-parcels
        type: editor.type
        at: { mark: type-parcels }
        target: { file: main.go, after: "nextNPT(), nextMDY())\n", occurrence: 1 }
        text: "\n\tparcels := []Parcel{\n\t\t{Code: \"MDY-0001\", To: \"MDY\", WeightKg: 2.5},\n\t\t{Code: \"NPT-0001\", To: \"NPT\", WeightKg: 1},\n\t\t{Code: \"YGN-0001\", To: \"YGN\", WeightKg: 0.5},\n\t}\n"
        cadence: line-by-line
      - id: type-sort
        type: editor.type
        at: { mark: type-sort }
        target: { file: main.go, after: "WeightKg: 0.5},\n\t}\n", occurrence: 1 }
        text: "\tslices.SortFunc(parcels, func(a, b Parcel) int {\n\t\treturn cmp.Compare(a.WeightKg, b.WeightKg)\n\t})\n\tfmt.Println(parcels[0].Code, parcels[2].Code)\n"
        cadence: line-by-line
      - id: sel-compare
        type: editor.select
        at: { mark: sel-compare }
        target:
          {
            file: main.go,
            text: "func(a, b Parcel) int {\n\t\treturn cmp.Compare(a.WeightKg, b.WeightKg)\n\t}",
            occurrence: 1,
          }
      - id: type-imports
        type: editor.type
        at: { mark: type-imports }
        target: { file: main.go, after: "import (\n", occurrence: 1 }
        text: "\t\"cmp\"\n"
      - id: type-imports-2
        type: editor.type
        at: { afterAction: type-imports }
        target: { file: main.go, after: "\t\"fmt\"\n", occurrence: 1 }
        text: "\t\"slices\"\n"
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "YGN-0001 MDY-0001",
          timeoutMs: 8000,
        }
      - {
          id: expect-file-sort,
          type: expect.file,
          at: { afterAction: run-2 },
          path: main.go,
          contains: "\t\treturn cmp.Compare(a.WeightKg, b.WeightKg)\n",
        }

  - id: read-2
