  - id: recap
    chapter: ပြန်ချုပ်ရရင်
    narration: >-
      [[mark:close-quiz]] ဒါဆို ပြန်ချုပ်ရရင်၊ [[mark:recap-maker]] Go မှာ function က တန်ဖိုး တစ်ခုပါ၊ function
      တစ်ခုက function အသစ်ကို ပြန်ပေးနိုင်ပြီး၊ ရလာတဲ့ function ကို variable ထဲ ထည့်ထားလို့ ရပါတယ်။ သူ့
      ပတ်ဝန်းကျင်က variable တွေကို မှတ်ထားတဲ့ function ကို closure လို့ ခေါ်ပြီး၊ closure တစ်ခုစီမှာ ကိုယ်ပိုင်
      အိတ် ရှိပါတယ်။ [[mark:recap-sort]] function ကို တခြား function ဆီ ပေးလို့လည်း ရလို့၊ SortFunc ကို
      ပါဆယ် နှစ်ခု နှိုင်းယှဉ်တဲ့ နည်းကို ပေးပြီး စီခိုင်းခဲ့ပါတယ်။ [[mark:recap-loop]] loop ထဲမှာ ဖန်တီးတဲ့ closure
      တွေကလည်း ကိုယ့် အခေါက်ရဲ့ variable ကို တစ်ခုစီ မှတ်ထားပါတယ်။ နောက် lesson မှာတော့ ကျပ်ငွေ အတွက်ရော၊
      ကီလို အတွက်ပါ function တစ်ခုတည်းနဲ့ အလုပ်လုပ်လို့ ရတဲ့ generics ကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "The Go Programming Language Specification — Function literals",
          url: "https://go.dev/ref/spec#Function_literals",
        }
    actions:
      - {
          id: close-quiz,
          type: whiteboard.apply,
          at: { mark: close-quiz },
          open: false,
          upsertIds: [],
        }
      - id: recap-maker
        type: editor.select
        at: { mark: recap-maker }
        target:
          {
            file: main.go,
            text: "\treturn func() string {\n\t\tn++\n\t\treturn fmt.Sprintf(\"%s-%04d\", city, n)\n\t}\n",
            occurrence: 1,
          }
      - id: recap-sort
        type: editor.select
        at: { mark: recap-sort }
        target:
          { file: main.go, text: "slices.SortFunc(parcels, func(a, b Parcel) int {", occurrence: 1 }
      - id: recap-loop
        type: editor.select
        at: { mark: recap-loop }
        target:
          {
            file: main.go,
            text: 'later = append(later, func() { fmt.Print(i, " ") })',
            occurrence: 1,
          }

checks:
  - { type: timing.p95Ms, max: 300 }
