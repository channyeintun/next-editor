# Go course, lesson 25: closures — functions as values (Burmese).
#
# Start state: parcel.go pinned with the canonical Parcel and cityNames (COURSE-KIT §3.4); main.go
# with `package main`, an import block holding only "fmt" ("cmp" and "slices" arrive as single
# inserted lines in sorted position at run-2) and an empty `func main`.
# Edits, all insert-only (canonical final state: probe 24-closures):
#   1. codeMaker (the outer function with its counter, then the returned closure), two makers and
#      one Println calling them -> run-1: MDY-0001 MDY-0002 NPT-0001 MDY-0003;
#   2. three parcels, slices.SortFunc with a cmp.Compare function by weight, a Println of the
#      first and last codes (+ "cmp", "slices") -> run-2 adds YGN-0001 MDY-0001;
#   3. a slice of functions built in a loop (each prints its round's i), then a loop calling them
#      -> run-3 adds 0 1 2.
# Boards: (B) each function carries a small bag of the variables it captured: nextMDY and nextNPT
# with their own counters; after run-3 three small bags, one i per round; (Q) the quiz (a second
# variable holding the same function shares its counter; probe `quiz`).
# Fixtures: bun ~/Documents/go-course-work/tools/sim-go.ts <this yaml> --write
schemaVersion: 1

