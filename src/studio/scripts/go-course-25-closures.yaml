scenes:
  - id: recall
    chapter: Function ကို တန်ဖိုး တစ်ခုလို
    narration: >-
      ပြီးခဲ့တဲ့ lesson မှာ ပါဆယ် တစ်ခုစီရဲ့ အလုပ်ကို function တစ်ခုအဖြစ် ထုပ်ပြီး၊ panic ကို ဖမ်းပေးတဲ့
      function ဆီ ပေးလိုက်ခဲ့ပါတယ်။ ဆိုလိုတာက Go မှာ function ဆိုတာလည်း ဂဏန်း၊ စာသား တွေလိုပဲ တန်ဖိုး
      တစ်ခု ဖြစ်ပါတယ်။ variable ထဲ ထည့်ထားလို့ ရတယ်၊ တခြား function ဆီ ပေးလို့ ရတယ်၊ function တစ်ခုက
      ပြန်ပေးလို့လည်း ရပါတယ်။ ဒီနေ့ အဲဒီ သုံးမျိုးလုံးကို ပါဆယ် ဝန်ဆောင်မှုထဲမှာ သုံးကြည့်ပြီး၊ သူ့ပတ်ဝန်းကျင်က
      variable တွေကို မှတ်ထားတဲ့ closure ကို လေ့လာပါမယ်။ [[mark:problem]] ပါဆယ် တစ်ခု လက်ခံတိုင်း
      tracking code တစ်ခု ပေးရပါတယ်။ code မှာ မြို့ code၊ dash၊ ပြီးတော့ အဲဒီ မြို့အတွက် နံပါတ် စဉ်
      ပါပါတယ်။ မန္တလေး ပါဆယ်တွေက တစ်၊ နှစ်၊ သုံး ဆိုပြီး သူ့ဘာသာ ရေတွက်ရပြီး၊ နေပြည်တော် ပါဆယ်တွေကလည်း
      တစ်ကနေ သီးခြား စရပါတယ်။ အခုထိ ဒီ code တွေကို ကိုယ်တိုင် လက်နဲ့ ရေးခဲ့ပါတယ်၊ ဒီနေ့ program ကို
      ထုတ်ပေးခိုင်းကြည့်ပါမယ်။
    sources:
      - {
          title: "The Go Programming Language Specification — Function types",
          url: "https://go.dev/ref/spec#Function_types",
        }
      - {
          title: "The Go Programming Language Specification — Function literals",
          url: "https://go.dev/ref/spec#Function_literals",
        }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }

  - id: maker
    chapter: Function ကို ပြန်ပေးတဲ့ function
    narration: >-
      [[mark:type-maker]] code ထုတ်ပေးမယ့် function ကို ရေးပါမယ်။ ဒီ function က မြို့ code တစ်ခုကို
      ယူပါတယ်။ [[mark:sel-result]] ပြန်ပေးမယ့် type ကို ကြည့်ပါ။ ဒါက စာသား မဟုတ်ပါဘူး၊ စာသား တစ်ခုကို
      ပြန်ပေးတဲ့ function တစ်ခုပါ။ ဆိုလိုတာက ဒီ function ကို ခေါ်လိုက်ရင် code တစ်ခု မရဘဲ၊ code တွေကို
      ထုတ်ပေးမယ့် function အသစ် တစ်ခုကို ရမှာပါ။ အထဲမှာ ရေတွက်ဖို့ n ဆိုတဲ့ variable ကို သုညနဲ့ စထားပါတယ်။
      [[mark:type-inner]] ပြီးတော့ ပြန်ပေးမယ့် function ကို အထဲမှာပဲ နာမည်မပါဘဲ တိုက်ရိုက် ရေးပါမယ်။ သူ့ကို
      ခေါ်တိုင်း n ကို တစ် တိုးပြီး၊ မြို့ code၊ dash နဲ့ နံပါတ်ကို ပေါင်းထားတဲ့ စာသားကို ပြန်ပေးပါတယ်။
      [[mark:sel-format]] format ထဲက ဒုတိယ နေရာလွတ်က နံပါတ်ကို ဂဏန်း လေးလုံး ပြည့်အောင် ရှေ့က
      သုညတွေနဲ့ ဖြည့်ပေးပါတယ်။ [[mark:sel-n]] အရေးကြီးတာကတော့ ဒီ n ပါ။ n က အထဲက function ရဲ့ variable
      မဟုတ်ပါဘူး၊ အပြင်က function ရဲ့ variable ပါ။ ဒါပေမဲ့ အထဲက function က သူ့ကို သုံးနေပါတယ်။ ဒီလို
      သူ့ပတ်ဝန်းကျင်က variable တွေကို မှတ်ထားပြီး သုံးတဲ့ function ကို closure လို့ ခေါ်ပါတယ်။
    sources:
      - {
          title: "The Go Programming Language Specification — Function literals",
          url: "https://go.dev/ref/spec#Function_literals",
        }
      - { title: "fmt package", url: "https://pkg.go.dev/fmt" }
    actions:
      - id: type-maker
        type: editor.type
        at: { mark: type-maker }
        target: { file: main.go, after: "\t\"fmt\"\n)\n", occurrence: 1 }
        text: "\n// codeMaker returns a function that hands out the next tracking code for one city.\nfunc codeMaker(city string) func() string {\n\tn := 0\n}\n"
        cadence: line-by-line
      - id: sel-result
        type: editor.select
        at: { mark: sel-result }
        target: { file: main.go, text: "func() string {", occurrence: 1 }
      - id: type-inner
        type: editor.type
        at: { mark: type-inner }
        target: { file: main.go, after: "\tn := 0\n", occurrence: 1 }
        text: "\treturn func() string {\n\t\tn++\n\t\treturn fmt.Sprintf(\"%s-%04d\", city, n)\n\t}\n"
        cadence: line-by-line
      - id: sel-format
        type: editor.select
        at: { mark: sel-format }
        target: { file: main.go, text: '"%s-%04d"', occurrence: 1 }
      - id: sel-n
        type: editor.select
        at: { mark: sel-n }
        target: { file: main.go, text: "n++", occurrence: 1 }

  - id: use
    narration: >-
      [[mark:type-makers]] အခု main ထဲမှာ မန္တလေး အတွက် တစ်ခု၊ နေပြည်တော် အတွက် တစ်ခု ဆိုပြီး code
      ထုတ်ပေးမယ့် function နှစ်ခုကို တောင်းပါမယ်။ ရလာတဲ့ function တွေကို variable နှစ်ခုထဲမှာ
      ထည့်ထားပါတယ်။ ဒါက function ကို variable ထဲ ထည့်ထားတာပါ။ [[mark:type-print]] ပြီးတော့ မန္တလေး
      function ကို နှစ်ခါ၊ နေပြည်တော် function ကို တစ်ခါ၊ နောက်ဆုံး မန္တလေး function ကို နောက်တစ်ခါ ခေါ်ပြီး
      code လေးခုကို တစ်ကြောင်းတည်းမှာ ထုတ်ပြပါမယ်။ ဂဏန်းတွေ ဘယ်လို ထွက်လာမလဲ ခန့်မှန်းကြည့်ပါ။
      [[mark:run-1]] ကဲ၊ run လိုက်ရအောင်။
    sources:
      - {
          title: "The Go Programming Language Specification — Function literals",
          url: "https://go.dev/ref/spec#Function_literals",
        }
      - {
          title: "The Go Programming Language Specification — Calls",
          url: "https://go.dev/ref/spec#Calls",
        }
    actions:
      - id: type-makers
        type: editor.type
        at: { mark: type-makers }
        target: { file: main.go, after: "func main() {\n", occurrence: 1 }
        text: "\tnextMDY := codeMaker(\"MDY\")\n\tnextNPT := codeMaker(\"NPT\")\n"
        cadence: line-by-line
      - id: type-print
        type: editor.type
        at: { mark: type-print }
        target: { file: main.go, after: "\tnextNPT := codeMaker(\"NPT\")\n", occurrence: 1 }
        text: "\tfmt.Println(nextMDY(), nextMDY(), nextNPT(), nextMDY())\n"
        cadence: line-by-line
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "MDY-0001 MDY-0002 NPT-0001 MDY-0003",
          timeoutMs: 8000,
        }
      - {
          id: expect-file-maker,
          type: expect.file,
          at: { afterAction: run-1 },
          path: main.go,
          contains: "\t\tn++\n\t\treturn fmt.Sprintf(\"%s-%04d\", city, n)\n",
        }

  - id: read-1
    narration: >-
      [[mark:point-codes]] output မှာ မန္တလေး ပါဆယ် နံပါတ် တစ်၊ နံပါတ် နှစ်၊ ပြီးတော့ နေပြည်တော် ပါဆယ်
      နံပါတ် တစ်၊ နောက်ဆုံး မန္တလေး ပါဆယ် နံပါတ် သုံး ထွက်လာပါတယ်။ နံပါတ်တွေ ရှေ့မှာ သုညတွေ ဖြည့်ထားလို့
      ဂဏန်း လေးလုံး အမြဲ ပြည့်နေပါတယ်။ [[mark:remember-n]] သတိထားရမှာက code ထုတ်ပေးတဲ့ function က main ရဲ့ ပထမ line မှာတင် ပြီးသွားခဲ့ပါပြီ၊
      ဒါပေမဲ့ n ပျောက်မသွားပါဘူး။ မန္တလေး function ကို ခေါ်တိုင်း သူ့ n က တစ်၊ နှစ်၊ သုံး ဆိုပြီး ဆက်တိုးပါတယ်။
      နေပြည်တော် function ကတော့ တစ်ကနေ သီးခြား စပါတယ်၊ သူ့မှာ ကိုယ်ပိုင် n တစ်ခု ရှိနေလို့ပါ။
    sources:
      - {
          title: "The Go Programming Language Specification — Function literals",
