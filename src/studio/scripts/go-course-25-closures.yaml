      တွေ ထည့်ထားတဲ့ အိတ်လေး တစ်လုံး လွယ်ထားတဲ့ function လို့ မြင်ကြည့်ပါ။ မန္တလေး function ရဲ့ အိတ်ထဲမှာ
      မြို့ code နဲ့ n ရှိပြီး၊ n က အခု သုံး ဖြစ်နေပါပြီ။ [[mark:draw-f2]] နေပြည်တော် function မှာတော့ သူ့
      ကိုယ်ပိုင် အိတ် တစ်လုံး ရှိပြီး၊ အထဲက n က တစ် ပဲ ရှိပါသေးတယ်။ [[mark:draw-note]] ဘာကြောင့် အိတ်
      နှစ်လုံး ဖြစ်ရလဲဆိုတော့၊ code ထုတ်ပေးတဲ့ function ကို ခေါ်တိုင်း n အသစ် တစ်ခု ဖန်တီးပြီး အိတ် အသစ်
      တစ်လုံးနဲ့ ပြန်ပေးလို့ပါ။ ဒါကြောင့် function တစ်ခုကို ခေါ်ရင် သူ့ အိတ်ထဲက n ပဲ ပြောင်းပြီး၊ တခြား
