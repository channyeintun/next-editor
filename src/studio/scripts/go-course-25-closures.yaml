  - id: later
    chapter: Loop ထဲက closure
    narration: >-
      [[mark:collapse-2]] နောက်ဆုံး function တွေကို slice ထဲမှာ စုထားပြီး နောက်မှ run တာကို ကြည့်ရအောင်။
      ပြီးခဲ့တဲ့ lesson က defer လိုပါပဲ၊ ဒါပေမဲ့ ဒီ တစ်ခါ ဘယ်အချိန် run မလဲ ဆိုတာ ကိုယ်တိုင် ဆုံးဖြတ်တာပါ။
      [[mark:type-later]] loop က သုံးခေါက် run ပြီး၊ အခေါက်တိုင်းမှာ အဲဒီ အခေါက်ရဲ့ i ကို ထုတ်ပြမယ့်
      function တစ်ခုကို slice ထဲ ထည့်ပါတယ်။ ဒီ အချိန်မှာ ဘာမှ မထုတ်ပြသေးပါဘူး၊ function တွေကို
      စုထားရုံပါ။ [[mark:type-call-later]] loop ပြီးမှ slice ထဲက function တွေကို တစ်ခုချင်း ခေါ်ပြီး၊
      နောက်ဆုံးမှာ line အသစ် တစ်ကြောင်း ဆင်းပေးပါတယ်။ [[mark:sel-closure]] ဒီ function တွေက i ကို
      မှတ်ထားတဲ့ closure တွေပါ။ ခေါ်တဲ့ အချိန်မှာ loop ပြီးသွားပြီ ဖြစ်လို့၊ သုည၊ တစ်၊ နှစ် ထွက်မလား၊ ဒါမှမဟုတ်
      ဂဏန်း တစ်ခုတည်းကိုပဲ သုံးခါ ထွက်မလား။ [[mark:run-3]] ကဲ၊ run လိုက်ရအောင်။
    sources:
      - {
          title: "The Go Programming Language Specification — For statements with range clause",
          url: "https://go.dev/ref/spec#For_range",
        }
      - { title: "Fixing For Loops in Go 1.22", url: "https://go.dev/blog/loopvar-preview" }
    actions:
      - { id: collapse-2, type: runtime.collapseDock, at: { mark: collapse-2 } }
      - id: type-later
        type: editor.type
        at: { mark: type-later }
        target: { file: main.go, after: "parcels[2].Code)\n", occurrence: 1 }
        text: "\n\tvar later []func()\n\tfor i := range 3 {\n\t\tlater = append(later, func() { fmt.Print(i, \" \") })\n\t}\n"
        cadence: line-by-line
      - id: type-call-later
        type: editor.type
        at: { mark: type-call-later }
        target: { file: main.go, after: "fmt.Print(i, \" \") })\n\t}\n", occurrence: 1 }
        text: "\tfor _, f := range later {\n\t\tf()\n\t}\n\tfmt.Println()\n"
        cadence: line-by-line
      - id: sel-closure
        type: editor.select
        at: { mark: sel-closure }
        target: { file: main.go, text: 'func() { fmt.Print(i, " ") }', occurrence: 1 }
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "0 1 2",
          timeoutMs: 8000,
        }
      - {
          id: expect-file-later,
          type: expect.file,
          at: { afterAction: run-3 },
          path: main.go,
          contains: "\t\tlater = append(later, func() { fmt.Print(i, \" \") })\n",
        }

