    chapter: ကိုယ်တိုင် စမ်းကြည့်ပါ
    narration: >-
      [[mark:close-iv]] ကိုယ်တိုင် စမ်းကြည့်ဖို့ တစ်ခု ရှိပါတယ်။ [[mark:sel-try]] ဒီ line က ဂဏန်း
      နှစ်လုံးကို လေးပုံတစ်ပုံ နဲ့ နှစ်ပုံတစ်ပုံ၊ ဆိုလိုတာက သုည ဒသမ နှစ်ငါး နဲ့ သုည ဒသမ ငါး လို့
      ပြောင်းပါ။ အောက်က စစ်တဲ့ တန်ဖိုးကိုလည်း သုည ဒသမ ခုနစ်ငါး လို့ ပြောင်းပြီး run ကြည့်ပါ။ ဒီတစ်ခါ
      true ထွက်ပါလိမ့်မယ်၊ ဘာကြောင့်လဲဆိုတော့ အဲဒီ ဂဏန်းတွေက နှစ်ရဲ့ ထပ်ကိန်း အပိုင်းတွေ ဖြစ်လို့ပါ။
      [[mark:try-why]] float bug တွေ test မှာ မပေါ်ဘဲ production ရောက်မှ ပေါ်တတ်တာ ဒါကြောင့်ပါ၊ test ထဲက ဂဏန်းတွေက
      မတော်တဆ အတိအကျ ဖြစ်နေတတ်လို့ပါ။ [[mark:recap]] ပြန်ချုပ်ရရင်၊ float က ငွေပမာဏကို ခန့်မှန်းခြေနဲ့ပဲ သိမ်းနိုင်ပြီး၊
      ငွေ system မှာ ခန့်မှန်းခြေ ဆိုတာ မရှိပါဘူး။ နောက် lesson မှာတော့ minor unit ကို အသေးစိတ်
      ကြည့်ပါမယ်။ currency တိုင်းမှာ ဒသမ နှစ်လုံး မဟုတ်တာနဲ့၊ crypto ပမာဏတွေက ၆၄ bit ကိန်းပြည့်ထဲတောင်
      မဆံ့တာကို တွေ့ရပါမယ်။
