  - id: fix
    chapter: ကိန်းပြည့်နဲ့ ပြန်တွက်ကြည့်
    narration: >-
      [[mark:close-options]] ခုနက loop ကို ကိန်းပြည့်နဲ့ ပြန်ရေးကြည့်ရအောင်။ [[mark:type-cents]]
      ဒီတစ်ခါ စုစုပေါင်းကို ဆင့်နဲ့ ရေတွက်တဲ့ ကိန်းပြည့် variable ထဲ ထားပြီး၊ အခေါက်တိုင်းမှာ ဆယ်ဆင့်
      ပေါင်းပါတယ်။ တွက်တဲ့ အရေအတွက်က အရင်အတိုင်း တစ်သန်းပါပဲ။ [[mark:run-4]] run လိုက်ရအောင်။
      [[mark:pt-cents]] ဆင့် တစ်ကုဋေ အတိအကျ ထွက်ပါတယ်၊ ဒေါ်လာနဲ့ဆို တစ်သိန်းပါ။ အပေါ်က float နဲ့
      တွက်ထားတဲ့ စုစုပေါင်းနဲ့ ယှဉ်ကြည့်ပါ။ ကိန်းပြည့်မှာ ပေါင်းတာ၊ နုတ်တာ၊ ညီသလား စစ်တာ အားလုံး
      အတိအကျ ဖြစ်ပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Precision handling (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#precision-handling",
        }
    actions:
      - { id: close-options, type: slide.close, at: { mark: close-options } }
      - id: type-cents
        type: editor.type
        at: { mark: type-cents }
        target: { file: main.go, after: "\tfmt.Println(wei+1 == wei)\n", occurrence: 1 }
        text: "\n\tvar cents int64\n\tfor i := 0; i < 1000000; i++ {\n\t\tcents += 10\n\t}\n\tfmt.Println(cents)\n"
        cadence: line-by-line
      - { id: run-4, type: runtime.run, at: { mark: run-4, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-4,
          type: expect.output,
          at: { afterAction: run-4 },
          contains: "10000000",
          timeoutMs: 8000,
        }
      - id: pt-cents
        type: console.point
        at: { mark: pt-cents }
        target: { text: "10000000", occurrence: 1 }
      - {
          id: expect-file-cents,
          type: expect.file,
          at: { afterAction: run-4 },
          path: main.go,
          contains: "cents += 10",
        }

  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] Fintech interview တွေမှာ ငွေအတွက် float ဘာလို့ မသုံးတာလဲ ဆိုတာ မေးလေ့ရှိပါတယ်။
      rounding error ရှိလို့ပါ လို့ပဲ ဖြေရင် မလုံလောက်ပါဘူး။ အချက် သုံးချက်နဲ့ ဖြေပါ။ [[mark:iv-a]] ပထမ၊
      decimal အပိုင်းကိန်း အများစုကို binary နဲ့ အတိအကျ မရေးနိုင်လို့ အမှားက တွက်ချက်မှု မစခင်၊ တန်ဖိုး
      ထည့်လိုက်ကတည်းက ပါနေတာပါ။ [[mark:iv-b]] ဒုတိယ၊ အဲဒီ အမှားတွေက စုလာပြီး ညီသလား စစ်တာတွေ
      မှားလာတော့ ledger နဲ့ report မကိုက်တော့ပါဘူး။ [[mark:iv-c]] တတိယ၊ precision က ဂဏန်း ၁၆
      လုံးလောက်ပဲ ရှိလို့ ပမာဏ ကြီးလာရင် အသေးဆုံး unit တွေက အသိမပေးဘဲ ပျောက်ပါတယ်။ [[mark:iv-d]]
      ပြီးရင် ကိုယ် ဘာသုံးမလဲ ဆိုတာ ဆက်ပြောပါ။ သိမ်းတာကို minor unit ကိန်းပြည့်နဲ့၊ ကြားထဲက
      တွက်ချက်မှုကို decimal နဲ့ လုပ်ပြီး၊ rounding ကို သတ်မှတ်ထားတဲ့ နေရာမှာပဲ လုပ်မယ် ဆိုတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Precision handling (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#precision-handling",
        }
    actions:
      - { id: show-iv, type: slide.show, at: { mark: show-iv, offsetMs: -700 }, slideId: iv-1 }
      - {
          id: pt-iv-q,
          type: slide.point,
          at: { afterAction: show-iv },
          target: { x: 0.125, y: 0.184 },
        }
      - { id: iv-a, type: slide.show, at: { mark: iv-a }, slideId: iv-2 }
      - {
