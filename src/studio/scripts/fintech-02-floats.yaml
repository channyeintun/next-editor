build:
  voiceProfile:
    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 9502

runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "0.30000000000000004\nfalse\n"
      run-2:
        status: success
        exitCode: 0
        output: "0.30000000000000004\nfalse\n100000.00000133288\n"
      run-3:
        status: success
        exitCode: 0
        output: "0.30000000000000004\nfalse\n100000.00000133288\ntrue\n"
      run-4:
        status: success
        exitCode: 0
        output: "0.30000000000000004\nfalse\n100000.00000133288\ntrue\n10000000\n"

scenes:
  - id: hook
    chapter: Float နှစ်ခု ပေါင်းကြည့်ရအောင်
    narration: >-
      ငွေကိုင်တဲ့ system တစ်ခုမှာ ပထမဆုံး ဆုံးဖြတ်ရတာက ငွေပမာဏကို ဘယ် type နဲ့ ကိုယ်စားပြုမလဲ
      ဆိုတာပါ။ ဒီနေရာမှာ မှားရင် အပေါ်က layer တိုင်းမှာ အဲဒီ အမှား ပါသွားပါတယ်။ [[mark:sel-vars]] ဒီ
      program မှာ သုည ဒသမ တစ် နဲ့ သုည ဒသမ နှစ် ကို float variable နှစ်ခုထဲ ထည့်ထားပါတယ်။
      [[mark:sel-sum]] အောက်က ပထမ line က နှစ်ခု ပေါင်းလဒ်ကို ထုတ်ပြပြီး၊ ဒုတိယ line က အဲဒီ
      ပေါင်းလဒ်ဟာ သုည ဒသမ သုံး နဲ့ ညီသလား ဆိုတာ စစ်တာပါ။ run မလုပ်ခင် ဘာထွက်မလဲ ခန့်မှန်းကြည့်ပါ။
      [[mark:run-1]] run လိုက်ရအောင်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Precision handling (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#precision-handling",
        }
      - {
          title: "The Go Programming Language Specification — Numeric types",
          url: "https://go.dev/ref/spec#Numeric_types",
        }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }
      - id: sel-vars
        type: editor.select
        at: { mark: sel-vars }
        target: { file: main.go, text: "a, b := 0.1, 0.2", occurrence: 1 }
      - id: sel-sum
        type: editor.select
        at: { mark: sel-sum }
        target:
          { file: main.go, text: "fmt.Println(a + b)\n\tfmt.Println(a+b == 0.3)", occurrence: 1 }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "0.30000000000000004",
          timeoutMs: 8000,
        }

  - id: read-sum
    narration: >-
      [[mark:pt-sum]] ပေါင်းလဒ်က သုည ဒသမ သုံး အတိအကျ မဟုတ်ပါဘူး။ ဒသမ နောက်က ၁၇ လုံးမြောက်မှာ
      လေး တစ်လုံး ပိုနေပါတယ်။ [[mark:pt-false]] ဒါကြောင့် ညီသလား စစ်တဲ့ line က false ပြန်ပေးပါတယ်။ ဒါ
      Go ရဲ့ bug မဟုတ်ပါဘူး။ [[mark:dock-1]] Java၊ Python၊ JavaScript အားလုံးမှာလည်း ဒီအတိုင်းပဲ
      ထွက်ပါတယ်၊ ဘာကြောင့်လဲဆိုတော့ အားလုံးက floating point အတွက် standard တစ်ခုတည်းကို
      သုံးထားကြလို့ပါ။
    sources:
      - {
          title: "What Every Computer Scientist Should Know About Floating-Point Arithmetic (Goldberg)",
          url: "https://docs.oracle.com/cd/E19957-01/806-3568/ncg_goldberg.html",
        }
    actions:
      - id: pt-sum
        type: console.point
        at: { mark: pt-sum }
        target: { text: "0.30000000000000004", occurrence: 1 }
      - id: pt-false
        type: console.point
        at: { mark: pt-false }
        target: { text: "false", occurrence: 1 }
      - { id: dock-1, type: runtime.collapseDock, at: { mark: dock-1 } }

  - id: why
    chapter: Binary မှာ 0.1 မရှိဘူး
    narration: >-
      [[mark:show-why]] အကြောင်းရင်းက ဂဏန်းကို ဘယ်စနစ်နဲ့ ရေးလဲ ဆိုတာပါ။ [[mark:pt-third]] decimal
      စနစ်မှာ သုံးပုံတစ်ပုံကို ဒသမနဲ့ ရေးရင် သုံးတွေ အဆုံးမရှိ ဆက်သွားပြီး ဘယ်တော့မှ အတိအကျ
      မရေးနိုင်ပါဘူး။ [[mark:why-2]] float ကတော့ ဂဏန်းတွေကို binary နဲ့ သိမ်းပါတယ်။ binary မှာ အတိအကျ
      ရေးနိုင်တာက နှစ်ပုံတစ်ပုံ၊ လေးပုံတစ်ပုံ၊ ရှစ်ပုံတစ်ပုံ စတဲ့ နှစ်ရဲ့ ထပ်ကိန်း အပိုင်းတွေကို
      ပေါင်းထားတဲ့ ဂဏန်းတွေပဲ ရှိပါတယ်။ [[mark:pt-tenth]] ဆယ်ပုံတစ်ပုံက အဲဒီထဲ မပါလို့ binary နဲ့ ရေးရင်
      digit တွေ အဆုံးမရှိ ထပ်နေပါတယ်။ [[mark:why-3]] float တစ်ခုမှာ bit ၆၄ လုံးပဲ ရှိတော့ အဲဒီ
      အဆုံးမရှိတဲ့ ဂဏန်းကို တစ်နေရာမှာ ဖြတ်ပြီး အနီးဆုံး တန်ဖိုးကို သိမ်းရပါတယ်။ [[mark:pt-stored]]
      ဆိုလိုတာက code ထဲမှာ သုည ဒသမ တစ် လို့ ရေးလိုက်တဲ့ အချိန်ကတည်းက တကယ် သိမ်းထားတာက အဲဒါထက်
      နည်းနည်းလေး ပိုကြီးတဲ့ တန်ဖိုး ဖြစ်နေပါပြီ။ ဘာမှ မတွက်ရသေးခင်ကတည်းက အမှားက ပါနေတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Precision handling (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#precision-handling",
        }
      - {
          title: "What Every Computer Scientist Should Know About Floating-Point Arithmetic (Goldberg)",
          url: "https://docs.oracle.com/cd/E19957-01/806-3568/ncg_goldberg.html",
        }
    actions:
      - { id: show-why, type: slide.show, at: { mark: show-why, offsetMs: -700 }, slideId: why-1 }
      - { id: pt-third, type: slide.point, at: { mark: pt-third }, target: { x: 0.1, y: 0.384 } }
