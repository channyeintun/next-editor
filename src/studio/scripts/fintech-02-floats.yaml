  - id: accumulate
    chapter: အမှားက စုလာတယ်
    narration: >-
      [[mark:close-why]] တစ်ခါ မှားတာက သေးသေးလေးပါ။ ဒါပေမဲ့ ငွေ system က တစ်ခါပဲ တွက်တာ မဟုတ်ပါဘူး။
      [[mark:type-loop]] ဒီ loop က သုည ဒသမ တစ် ကို အကြိမ် တစ်သန်း ပေါင်းတာပါ။ ဆယ်ဆင့်တန် payment
      တစ်သန်းကို စုစုပေါင်းတာလို့ မြင်ကြည့်ပါ။ မှန်ရင် စုစုပေါင်းက တစ်သိန်း အတိအကျ ဖြစ်ရပါမယ်။
      [[mark:run-2]] run လိုက်ရအောင်။ [[mark:pt-total]] တစ်သိန်း အတိအကျ မဟုတ်ဘဲ ဒသမ နောက်မှာ အပိုတွေ
      ပါလာပါတယ်။ ပေါင်းတိုင်း ဖြစ်တဲ့ အမှား သေးသေးလေးတွေက မကြေဘဲ စုလာတာပါ။ တကယ့် system မှာဆိုရင်
      ဒါက ledger ရဲ့ စုစုပေါင်းနဲ့ report ရဲ့ စုစုပေါင်း မကိုက်တာ၊ ညီသလား စစ်တဲ့ check တွေ အကြောင်းမဲ့
      fail တာ အနေနဲ့ ပေါ်လာပါတယ်။ [[mark:dock-2]] အဆိုးဆုံးက ငွေ ဘယ်နေရာမှာ ပျောက်သွားလဲ ဆိုတာကို
      ပြန်ရှာလို့ မရတော့တာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Precision handling (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#precision-handling",
        }
    actions:
      - { id: close-why, type: slide.close, at: { mark: close-why } }
      - id: type-loop
        type: editor.type
        at: { mark: type-loop }
        target: { file: main.go, after: "\tfmt.Println(a+b == 0.3)\n", occurrence: 1 }
        text: "\n\ttotal := 0.0\n\tfor i := 0; i < 1000000; i++ {\n\t\ttotal += 0.1\n\t}\n\tfmt.Println(total)\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "100000.00000133288",
          timeoutMs: 8000,
        }
      - id: pt-total
        type: console.point
        at: { mark: pt-total }
        target: { text: "100000.00000133288", occurrence: 1 }
      - { id: dock-2, type: runtime.collapseDock, at: { mark: dock-2 } }

  - id: magnitude
    chapter: ပမာဏ ကြီးရင် အသေးတွေ ပျောက်တယ်
    narration: >-
      [[mark:show-limit]] ဒုတိယ ပြဿနာက ပမာဏ ကြီးလာတဲ့အခါ ဖြစ်ပါတယ်။ float တစ်ခုမှာ ဂဏန်းအတွက်
      သုံးလို့ရတဲ့ bit က ၅၃ လုံးပဲ ရှိပါတယ်။ [[mark:pt-max]] ဒါကြောင့် ကိန်းပြည့်တိုင်းကို တစ်လုံးမကျန်
      အတိအကျ မှတ်နိုင်တာက နှစ်ရဲ့ ၅၃ ထပ်အထိပဲ ဖြစ်ပြီး၊ decimal နဲ့ဆို ဂဏန်း ၁၆ လုံးလောက်ပါ။
      [[mark:limit-2]] ဒီ အကန့်အသတ်ကို တကယ့် system တွေမှာ မြန်မြန် ရောက်ပါတယ်။ [[mark:pt-wei]] Ethereum
      မှာ ether တစ်ခုကို အသေးဆုံး unit ဖြစ်တဲ့ wei နဲ့ ရေတွက်ရင် တစ် နောက်မှာ သုည ၁၈ လုံး ပါပါတယ်။
      [[mark:pt-gt]] ဆိုလိုတာက ether တစ်ခုတည်းမှာတောင် float က wei တစ်ခုချင်းကို မခွဲနိုင်တော့ပါဘူး။
      [[mark:close-limit]] code နဲ့ စမ်းကြည့်ရအောင်။ [[mark:type-wei]] ether တစ်ခုစာ wei ကို float ထဲ
      ထည့်ပြီး၊ wei တစ်ခု ထပ်ပေါင်းလိုက်ရင် တန်ဖိုး ပြောင်းသွားသလား ဆိုတာ စစ်ပါမယ်။ ပြောင်းရင် false၊
      မပြောင်းရင် true ထွက်ပါမယ်။ [[mark:run-3]] run လိုက်ရအောင်။ [[mark:pt-true]] true လို့ ထွက်ပါတယ်။
      တစ်ခု ပေါင်းပြီးတာတောင် အရင် တန်ဖိုးနဲ့ အတူတူပဲ ဖြစ်နေတာပါ။ ပေါင်းလိုက်တဲ့ wei က error မတက်ဘဲ
      တိတ်တိတ်လေး ပျောက်သွားပါတယ်။ [[mark:dock-3]] ငွေ system မှာ data ပျောက်တာထက် ပိုဆိုးတာက
      ပျောက်မှန်း မသိတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Precision handling (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#precision-handling",
        }
      - {
          title: "ethereum.org — Intro to ether: denominations of ether",
          url: "https://ethereum.org/en/developers/docs/intro-to-ether/#denominations",
        }
      - {
          title: "MDN — Number.MAX_SAFE_INTEGER",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Number/MAX_SAFE_INTEGER",
        }
    actions:
      - {
          id: show-limit,
          type: slide.show,
          at: { mark: show-limit, offsetMs: -700 },
          slideId: limit-1,
        }
      - { id: pt-max, type: slide.point, at: { mark: pt-max }, target: { x: 0.1, y: 0.453 } }
      - { id: limit-2, type: slide.show, at: { mark: limit-2 }, slideId: limit-2 }
      - { id: pt-wei, type: slide.point, at: { mark: pt-wei }, target: { x: 0.1, y: 0.72 } }
      - { id: pt-gt, type: slide.point, at: { mark: pt-gt }, target: { x: 0.295, y: 0.887 } }
      - { id: close-limit, type: slide.close, at: { mark: close-limit } }
      - id: type-wei
        type: editor.type
        at: { mark: type-wei }
