  - id: options
    chapter: ဒါဆို ဘာနဲ့ ကိုယ်စားပြုမလဲ
    narration: >-
      [[mark:show-options]] ဒါဆို ဘာသုံးမလဲ။ ရွေးစရာ လေးမျိုး ရှိပါတယ်။ ပထမတစ်ခုက float ပါ။ အမြန်ဆုံးနဲ့
      memory အသက်သာဆုံး ဖြစ်ပေမဲ့ ခုနက မြင်ခဲ့တဲ့အတိုင်း ငွေအတွက် မသုံးသင့်ပါဘူး။ [[mark:opt-2]]
      ဒုတိယက arbitrary precision decimal ပါ။ Java ရဲ့ BigDecimal လို type မျိုးဖြစ်ပြီး၊ ဒသမ ဘယ်နှလုံး
      ထားမလဲ၊ ဘယ်နေရာမှာ ဘယ်လို round လုပ်မလဲ ဆိုတာကို ကိုယ်တိုင် ထိန်းနိုင်ပါတယ်။ FX နဲ့ pricing လို
      အဆင့်ဆင့် တွက်ရတဲ့ နေရာတွေနဲ့ ကိုက်ပါတယ်။ [[mark:opt-3]] တတိယက minor unit ပါ။ ပမာဏကို currency
      ရဲ့ အသေးဆုံး unit နဲ့ ကိန်းပြည့်အဖြစ် သိမ်းတာပါ။ ဥပမာ ဆယ့်နှစ်ယူရို ၃၄ ဆင့်ကို ၁၂၃၄ လို့
      သိမ်းပါတယ်။ မြန်ပြီး အတိအကျ ဖြစ်လို့ ledger နဲ့ API တွေမှာ အသုံးအများဆုံးပါ။ [[mark:opt-4]]
      စတုတ္ထက rational number ပါ။ ပိုင်းဝေနဲ့ ပိုင်းခြေကို သီးသန့် သိမ်းထားလို့ precision လုံးဝ
      မပျောက်ပါဘူး။ ဒါပေမဲ့ အနှေးဆုံး ဖြစ်ပြီး၊ တခြား format ကို ပြောင်းတဲ့အခါ round လုပ်ရတာကတော့
      မလွတ်ပါဘူး။ [[mark:opt-5]] သတိထားရမှာက ဒီလေးမျိုးထဲက တစ်ခုတည်းကို ရွေးရတာ မဟုတ်ပါဘူး။ ဘယ်လို
      သိမ်းမလဲ ဆိုတာနဲ့ ဘယ်လို တွက်မလဲ ဆိုတာက သီးခြား ဆုံးဖြတ်ချက် နှစ်ခုပါ။ system အများစုက
      ကိန်းပြည့်နဲ့ သိမ်းပြီး၊ ကြားထဲက တွက်ချက်မှုတွေကို decimal နဲ့ လုပ်ကြပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Precision handling (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#precision-handling",
        }
