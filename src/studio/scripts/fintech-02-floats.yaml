# Fintech Engineering, lesson 02: why floats cannot hold money (Burmese).
#
# Source: Fintech Engineering Handbook, "Precision handling" (CC BY 4.0, Voytek Pitula).
# Start state: main.go adds 0.1 and 0.2 held in float64 variables and compares the sum with 0.3.
# Edits, all insert-only:
#   1. a loop that adds 0.1 a million times           -> run-2 prints 100000.00000133288
#   2. 1e18 wei in a float64, plus one wei            -> run-3 prints true (the wei is lost)
#   3. the same loop with an int64 counted in cents   -> run-4 prints 10000000
# Figures: why (0.1 has no finite binary form), limit (53 bits), options (four representations),
# iv (the interview answer).
# Built by ~/Documents/fintech-course-work/tools/build-lesson.ts; fixtures by sim-go.ts --write.
schemaVersion: 1

lesson:
  slug: fintech-02-floats
  title: "Fintech Engineering 02: Float နဲ့ ငွေ မတွက်ရတဲ့ အကြောင်း"
  locale: my-MM
  workspace:
    lessonType: go
    name: Fintech Engineering
    entryFilePath: main.go
    # One file: an open explorer would be a list of one beside the code.
    sidebarStartsCollapsed: true
    files:
      main.go: |
        package main

        import "fmt"

        func main() {
        	a, b := 0.1, 0.2
        	fmt.Println(a + b)
        	fmt.Println(a+b == 0.3)
        }
