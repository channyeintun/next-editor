scenes:
  - id: same-paste
    chapter: chat တိုင်းမှာ ကူးထည့်ရတာ
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ နေခြည် ရဲ့ အလုပ် တစ်ခုချင်းကို Claude app၊ Claude Code ဒါမှမဟုတ် API ဆိုတဲ့ entry
      point တွေထဲက ဘယ်နေရာမှာ ထားမလဲ ရွေးခဲ့ပါတယ်။ entry point ဆိုတာ Claude ကို ဘယ်နေရာကနေ သုံးမလဲ
      ဆိုတာပါ။ ဒီတစ်ခါတော့ app ထဲမှာ ထားခဲ့တဲ့ အလုပ် တစ်ခုကို ပိုနီးနီးကပ်ကပ် ကြည့်ပါမယ်။
      [[mark:need]] support manager လှလှ ရဲ့ team မှာ support lead တွေက ခက်တဲ့ connection ticket တွေအတွက်
      Claude app နဲ့ အဖြေ ရေးကြပါတယ်။ ဒါပေမဲ့ chat အသစ် ဖွင့်တိုင်း နေခြည် ရဲ့ tone guide နဲ့ ပြဿနာဖြေရှင်းနည်း
      မှတ်စုတွေကို အစကနေ ပြန်ကူးထည့်ရပါတယ်။ တစ်ယောက်က မှတ်စု အသစ်ကို ထည့်ပြီး နောက်တစ်ယောက်က
      အဟောင်းကို ထည့်မိတာမျိုးလည်း ဖြစ်နေပါတယ်။
      [[mark:need-kb]] Knowledge base ထဲက article ၃၄၀ ရဲ့ သုံးပုံတစ်ပုံလောက်က
      ခေတ်နောက်ကျနေတာမို့၊ ဘယ်မှတ်စုကို ကူးထည့်လိုက်လဲ ဆိုတာပေါ်မှာ customer ရမယ့် အကြံ ပြောင်းသွားနိုင်ပါတယ်။
      [[mark:need-2]] ဒါက prompt ကို ပိုကောင်းအောင် ရေးရုံနဲ့ ပြေလည်မယ့် ပြဿနာ မဟုတ်ပါဘူး။ prompt ဆိုတာ model
      ကို ပေးလိုက်တဲ့ စာ၊ model ဆိုတာ အဲဒီ စာကို ဆက်ရေးပေးတဲ့ program ပါ။ ထပ်ခါထပ်ခါ လုပ်ရတဲ့ အလုပ်အတွက်
      app ထဲမှာ capability feature တွေ ရှိပါတယ်။ prompt မရေးခင် ဆုံးဖြတ်ရမယ့် လေးခုထဲက ဒုတိယ တစ်ခုက
      ဒီ feature တွေကို ရွေးတာ ဖြစ်ပါတယ်။
    sources:
      - {
          title: "What are projects?",
          url: "https://support.claude.com/en/articles/9517075-what-are-projects",
        }
      - { title: "Claude plans and pricing", url: "https://claude.com/pricing" }
    actions:
      - {
          id: open-features,
          type: workspace.openFile,
          at: { scene: start },
          path: notebook/13-features.md,
        }
      - id: sel-title
        type: editor.select
        at: { mark: need-2 }
        target:
          file: notebook/13-features.md
          text: "# ထပ်ခါထပ်ခါ လုပ်တဲ့ အလုပ်နဲ့ feature"

  - id: five-features
    chapter: Feature ငါးမျိုး
    narration: >
      [[mark:f-open]] Claude app ထဲက feature တွေကို လုပ်ပေးတဲ့ အလုပ်အလိုက် ငါးမျိုး ခွဲကြည့်လို့ ရပါတယ်။
      နာမည်တွေက ဒီ lesson ကို ရေးတဲ့ အချိန်မှာ ရှိတဲ့အတိုင်းပါ။ မကြာခဏ ပြောင်းတတ်တာမို့ Claude ရဲ့ pricing
      စာမျက်နှာမှာ ပြန်စစ်ပါ။
      [[mark:f-project]] ပထမ တစ်ခုက Project ပါ။ Project ဆိုတာ အလုပ် တစ်ခုအတွက် စာရွက်စာတမ်းနဲ့ ညွှန်ကြားချက်တွေ
      စုထားတဲ့ နေရာပါ။ project knowledge ထဲကို document၊ စာသား၊ code တွေ တင်ထားရင်၊ အဲဒီ project ထဲက
      chat တိုင်းမှာ Claude က သုံးပါတယ်။ project instructions ကလည်း chat တိုင်းမှာ သက်ရောက်ပါတယ်။ project ကို
      ကြည့်ခွင့်၊ ပြင်ခွင့် ပေးပြီး share လုပ်တာကတော့ Team နဲ့ Enterprise plan မှာပဲ ရပါတယ်။
      [[mark:f-artifact]] ဒုတိယ တစ်ခုက Artifact ပါ။ document၊ slide၊ dashboard လို ဆက်ပြင်ပြီး ပြန်သုံးမယ့်
      ရလဒ်ကို chat ဘေးမှာ သီးခြား ဖွင့်ပေးပြီး၊ ဆက်ပြင်တာ၊ share လုပ်တာ လုပ်လို့ရပါတယ်။ အကြောင်းအရာ ရှည်ပြီး
      သီးခြား ရပ်တည်နိုင်တဲ့အခါ Claude က artifact အဖြစ် ဖန်တီးတတ်ပါတယ်။ ဒါပေမဲ့ Create and edit files ဆိုတဲ့
      setting ဖွင့်ထားမှ အလုပ်လုပ်ပါတယ်။
      [[mark:f-search]] တတိယ တစ်ခုက အချက်အလက် ရှာတာပါ။ web search က တစ်ခါ နှစ်ခါ ရှာရုံနဲ့ ဖြေနိုင်တဲ့
      မေးခွန်းအတွက်ပါ။ Research ကတော့ မိနစ်အနည်းငယ် ကြာအောင် ရင်းမြစ် အများကြီးကို လိုက်ရှာပြီး၊ ကိုးကားချက်
      ပါတဲ့ report တစ်စောင် ပြန်ပေးပါတယ်။ Team နဲ့ Enterprise မှာဆိုရင် web search ကို owner က အရင် ဖွင့်ပေးရပါတယ်။
      [[mark:f-connector]] စတုတ္ထ တစ်ခုက connector ပါ။ connector ဆိုတာ Claude ကို တခြား tool၊ data တွေနဲ့
      ချိတ်ပေးတဲ့ အဆက်ပါ။ ချိတ်ထားတဲ့ app ထဲက data ကို ဖတ်ရုံသာမက အဲဒီထဲမှာ လုပ်ဆောင်ချက်တွေပါ လုပ်ပေးနိုင်ပါတယ်။
      Claude က အဲဒီ service ထဲမှာ သုံးနေတဲ့ လူရဲ့ ခွင့်ပြုချက်အတိုင်းပဲ မြင်ရပါတယ်။
      [[mark:f-skill]] ပဉ္စမ တစ်ခုက skill ပါ။ skill ဆိုတာ အလုပ် တစ်မျိုးကို ဘယ်လို လုပ်ရမလဲ ရေးထားပြီး၊ လိုတဲ့
      အချိန်ကျမှ Claude ဖတ်သုံးတဲ့ လမ်းညွှန်ပါ။ project knowledge က chat တိုင်းမှာ အမြဲ ပါနေတဲ့ နောက်ခံ
      အချက်အလက်ပါ။ skill ကတော့ ဆီလျော်တဲ့ အလုပ် ရောက်လာမှ ဖွင့်ဖတ်တဲ့ လုပ်ထုံးလုပ်နည်းပါ။ Excel၊ Word၊ PDF လို file တွေအတွက်
      Anthropic ရဲ့ skill တွေ ပါပြီးသားဖြစ်ပြီး၊ ကိုယ်ပိုင် skill တွေကိုလည်း ထည့်လို့ရပါတယ်။ skill တွေ အလုပ်လုပ်ဖို့ code
      execution ကို ဖွင့်ထားရပါတယ်။
    sources:
