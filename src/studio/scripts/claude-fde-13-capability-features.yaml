  - id: one-job
    chapter: အလုပ်ကနေ စရွေးခြင်း
    narration: >
      [[mark:b-open]] feature ကို အသစ်ဆုံးမို့ ရွေးတာမျိုး မလုပ်ဘဲ၊ အလုပ်ကနေ စပြီး ရွေးရပါတယ်။ support lead တွေရဲ့
      ticket အဖြေ ရေးတဲ့ အလုပ် တစ်ခုတည်းကို ယူပြီး လိုတဲ့ feature တွေနဲ့ တွဲကြည့်ရအောင်။
      [[mark:b-project]] chat တိုင်းမှာ ကူးထည့်နေရတဲ့ tone guide နဲ့ ပြဿနာဖြေရှင်းနည်း မှတ်စုတွေက project
      knowledge ထဲ ရောက်သွားပါမယ်။ ဘယ်လို လေသံနဲ့ ရေးရမလဲ ဆိုတာကိုလည်း project instructions မှာ တစ်ခါပဲ
      ရေးထားပါမယ်။ မှတ်စု အသစ် ထွက်လာရင် project ထဲမှာ တစ်နေရာတည်း ပြင်လိုက်ရုံပါပဲ။
      [[mark:b-skill]] လိုင်းကျနေတဲ့ မြို့နယ်က customer ကို ဘယ်လို အဆင့်လိုက် ဖြေရမလဲ ဆိုတာကတော့ skill
      ဖြစ်သင့်ပါတယ်။ ticket တိုင်းမှာ မလိုဘဲ၊ လိုင်းကျမှု ticket ရောက်လာမှ ဖတ်ရမယ့် လုပ်ထုံးလုပ်နည်းမို့ပါ။ ကိုယ်ပိုင်
      skill ကို ZIP file အနေနဲ့ upload လုပ်ပြီး တင်ရပါတယ်။
      [[mark:b-conn]] Knowledge base ကို connector နဲ့ ချိတ်နိုင်ရင်တော့ article တွေကို ကူးထည့်စရာ မလိုတော့ပါဘူး။
      ဒါပေမဲ့ ကတိမပေးခင် စစ်ရမယ့် အချက် ရှိပါတယ်။ ကိုယ်တိုင် ဆောက်တဲ့ custom connector ကို Anthropic ရဲ့ cloud
      ကနေ ခေါ်တာမို့၊ အဲဒီ server ကို public internet ကနေ ရောက်လို့ ရရပါမယ်။ Knowledge base က ရုံးတွင်း network
      ထဲမှာပဲ ရှိနေတယ်ဆိုရင် ဒီအတိုင်း ချိတ်လို့ မရပါဘူး။
      [[mark:b-perm]] နောက်တစ်ချက်က ခွင့်ပြုချက်ပါ။ connector က သုံးတဲ့ လူရဲ့
      ခွင့်ပြုချက်အတိုင်း မြင်တာမို့၊ support lead တစ်ယောက် ဖွင့်ခွင့်မရှိတဲ့ article ကို Claude ကလည်း မမြင်ရပါဘူး။
      [[mark:b-not]] Research ကိုတော့ ဒီအလုပ်အတွက် မရွေးပါဘူး။ ကောင်းတဲ့ feature ဖြစ်ပေမဲ့ ticket တစ်ခုရဲ့ အဖြေက
      ရင်းမြစ် အများကြီးကို မိနစ်ချီ လိုက်ရှာရမယ့် အလုပ် မဟုတ်လို့ပါ။
      [[mark:b-back]] ဆိုလိုတာက ticket အဖြေ ဆိုတဲ့ အလုပ်ကနေ စခဲ့လို့ feature သုံးခုပဲ ကျန်ပါတယ်။ feature စာရင်းကနေ
      စခဲ့ရင်တော့ ငါးခုလုံး ထည့်ချင်စိတ် ပေါ်လာပြီး၊ ဘယ်ဟာကိုမှ သေသေချာချာ မပြင်ဆင်ဖြစ်တာမျိုး ဖြစ်တတ်ပါတယ်။
    sources:
      - {
          title: "Use connectors to extend Claude's capabilities",
          url: "https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities",
        }
      - {
          title: "What are skills?",
          url: "https://support.claude.com/en/articles/12512176-what-are-skills",
        }
      - {
          title: "Use skills in Claude",
          url: "https://support.claude.com/en/articles/12512180-use-skills-in-claude",
        }
    actions:
      - { id: close-features, type: slide.close, at: { mark: b-open } }
      - {
          id: draw-job,
          type: whiteboard.apply,
          at: { afterAction: close-features },
          open: true,
          clear: true,
          upsertIds: [j-box, j-l, j-brace],
          drawMs: 1200,
        }
      - {
          id: draw-project,
          type: whiteboard.apply,
          at: { mark: b-project },
          upsertIds: [f1-box, f1-l, f1-d],
          drawMs: 1500,
        }
      - {
          id: draw-skill,
          type: whiteboard.apply,
          at: { mark: b-skill },
          upsertIds: [f2-box, f2-l, f2-d],
          drawMs: 1500,
        }
      - {
          id: draw-conn,
          type: whiteboard.apply,
          at: { mark: b-conn },
          upsertIds: [f3-box, f3-l, f3-d],
          drawMs: 1500,
        }
      - {
          id: draw-not,
          type: whiteboard.apply,
          at: { mark: b-not },
          upsertIds: [f-not],
          drawMs: 900,
        }
      - { id: point-job, type: whiteboard.point, at: { mark: b-back }, target: { assetId: j-box } }

  - id: the-table
    chapter: Feature table
    narration: >
      [[mark:t-close]] ဒီ ရွေးပုံကို support ရဲ့ ထပ်ခါထပ်ခါ လုပ်တဲ့ အလုပ် သုံးခုအတွက် table နဲ့ ချရေးကြည့်ရအောင်။
      တတိယ column က feature တစ်ခုချင်းအတွက် တစ်ခါပဲ ပြင်ဆင်ရမယ့် အရာပါ။ ဒါကို မရေးထားရင် feature က
      ရှိပေမဲ့ ဘယ်သူမှ ဖွင့်မထားတာ၊ ဘယ်သူ ထိန်းမလဲ မသိတာမျိုး ဖြစ်တတ်ပါတယ်။ ဥပမာ project ထဲက မှတ်စုကို ဘယ်သူ
      update လုပ်မလဲ ဆိုတာ မသတ်မှတ်ရင်၊ ခဏကြာတော့ chat ထဲ ကူးထည့်ခဲ့တုန်းက ပြဿနာ ပြန်ရောက်လာပါတယ်။
      [[mark:type-1]] ပထမ အလုပ်က board ပေါ်မှာ ကြည့်ခဲ့တဲ့ ticket အဖြေ ရေးတာပါ။ project ကို တစ်ခါ ဆောက်ပြီး
      မှတ်စုတွေ တင်၊ instructions ရေး၊ skill ကို upload လုပ်ထားရင်၊ နောက်ပိုင်း chat တိုင်းက အဲဒီ ပြင်ဆင်မှုကို
      ပြန်သုံးပါတယ်။
      [[mark:type-2]] ဒုတိယ အလုပ်က လှလှ ကို အပတ်တိုင်း ပို့ရတဲ့ လိုင်းကျမှု အကျဉ်းချုပ်ပါ။ ရလဒ်က ဆက်ပြင်ပြီး
      ပြရမယ့် document မို့ artifact ပါ။ report ပုံစံကို project knowledge ထဲ တင်ထားပြီး၊ artifact အတွက် လိုတဲ့
      setting ကိုလည်း ဖွင့်ထားရပါမယ်။
      [[mark:type-3]] တတိယ အလုပ်က customer တွေ အသစ် ဝယ်လာတဲ့ router model တွေအတွက် ဖြေရှင်းနည်း မှတ်စု
      ရေးတာပါ။ ထုတ်လုပ်သူရဲ့ အချက်အလက်ကို ရှာရမှာမို့ web search လိုပါတယ်။ Team plan ပေါ်မှာဆိုရင် owner က
      web search ကို အရင် ဖွင့်ပေးမှ သုံးလို့ရပါတယ်။
      [[mark:type-share]] နောက်ဆုံး မှတ်စု တစ်ကြောင်းက project ကို support lead အားလုံး အတူ ပြင်နိုင်အောင် share
      လုပ်ဖို့ပါ။ ဒါက Team ဒါမှမဟုတ် Enterprise plan မှာပဲ ရတာမို့ plan ဆုံးဖြတ်ချက်နဲ့ ချိတ်နေပါတယ်။
    sources:
      - {
          title: "How can I create and manage projects?",
          url: "https://support.claude.com/en/articles/9519177-how-can-i-create-and-manage-projects",
        }
      - {
          title: "Enable and use web search",
          url: "https://support.claude.com/en/articles/10684626-enable-and-use-web-search",
        }
      - {
          title: "What are artifacts and how do I use them?",
          url: "https://support.claude.com/en/articles/17153992-what-are-artifacts-and-how-do-i-use-them",
        }
    actions:
      - { id: close-job, type: whiteboard.apply, at: { mark: t-close }, open: false }
      - {
          id: open-features-2,
          type: workspace.openFile,
          at: { afterAction: close-job },
          path: notebook/13-features.md,
        }
      - id: type-1
        type: editor.type
        at: { mark: type-1 }
        cadence: line-by-line
        target: { file: notebook/13-features.md, after: "|---|---|---|\n" }
        text: "| connection ticket အဖြေ | Project · Skill | tone guide၊ notes တင်၊ instructions ရေး၊ skill ZIP တင် |\n"
      - id: type-2
        type: editor.type
        at: { mark: type-2 }
        cadence: line-by-line
        target: { file: notebook/13-features.md, after: "skill ZIP တင် |\n" }
        text: "| အပတ်စဉ် လိုင်းကျမှု အကျဉ်းချုပ် | Project · Artifact | report ပုံစံ တင်၊ Create and edit files ဖွင့် |\n"
      - id: type-3
        type: editor.type
        at: { mark: type-3 }
        cadence: line-by-line
        target: { file: notebook/13-features.md, after: "Create and edit files ဖွင့် |\n" }
        text: "| router model အသစ် မှတ်စု | Project · Web search | Team plan မှာ owner က web search ဖွင့် |\n"
      - id: type-share
        type: editor.type
        at: { mark: type-share }
        cadence: line-by-line
        target: { file: notebook/13-features.md, after: "owner က web search ဖွင့် |\n" }
        text: "\nproject ကို support lead အားလုံးနဲ့ share (Can edit): Team ဒါမှမဟုတ် Enterprise plan မှာပဲ\n"
      - id: expect-row-1
        type: expect.file
        at: { afterAction: type-share }
        path: notebook/13-features.md
        contains: "| connection ticket အဖြေ | Project · Skill | tone guide၊ notes တင်၊ instructions ရေး၊ skill ZIP တင် |\n"

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ Network Tools team က Claude app ကို Free plan နဲ့ စမ်းကြည့်နေတယ်
      ဆိုပါစို့။ သူတို့ သုံးချင်တဲ့ feature နှစ်ခု ရှိပါတယ်။ Free plan မှာ လုံးဝ မရတာ ဘယ်ဟာလဲ။
      [[mark:q-a]] ပထမ တစ်ခုက ကိုယ်တိုင် ဆောက်ထားတဲ့ server ကို Claude နဲ့ ချိတ်ပေးတဲ့ custom connector ပါ။
      [[mark:q-b]] ဒုတိယ တစ်ခုက ရင်းမြစ် အများကြီးကို ရှာပြီး report ပြန်ပေးတဲ့ Research ပါ။ lesson ကို pause
      လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ Research ပါ။ ဒီ lesson ကို ရေးတဲ့ အချိန်မှာ Research က Pro၊ Max၊ Ultra၊
      Team နဲ့ Enterprise လို paid plan တွေမှာပဲ ပါပါတယ်။ custom connector ကတော့ Free အပါအဝင် plan တိုင်းမှာ
      ရပါတယ်။ ကွာတာက Free မှာ တစ်ခုပဲ ချိတ်ခွင့် ရှိတာပါ။ ရှာဖွေတဲ့ feature မို့ plan တိုင်းမှာ ပါမယ်လို့
      ထင်မိတတ်ပေမဲ့၊ ရှာတာက web search၊ Research က သီးခြား feature ပါ။
      [[mark:q-rule]] ဒါကြောင့် feature တစ်ခုကို team ကို ကတိမပေးခင် နှစ်ခု စစ်ပါ။ ကိုယ့် plan မှာ ပါလား၊ ပြီးတော့
      အဲဒီ feature က လိုတဲ့ data ဆီ တကယ် ရောက်နိုင်လား ဆိုတာပါ။
    sources:
      - {
          title: "Use Research on Claude",
          url: "https://support.claude.com/en/articles/11088861-use-research-on-claude",
        }
      - {
          title: "Use connectors to extend Claude's capabilities",
          url: "https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: q-rule },
          upsertIds: [q-t1, q-t2],
          drawMs: 1200,
        }

  - id: your-turn
    chapter: ကိုယ့် team အတွက်
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ကိုယ့် team မှာ အပတ်တိုင်း ထပ်ခါထပ်ခါ လုပ်နေရတဲ့
      အလုပ် တစ်ခုကို ရွေးပြီး ဒီ table မှာ row တစ်ခု ထပ်ရေးကြည့်ပါ။ ဘယ် feature လိုလဲ ဆိုတာထက်၊ chat တိုင်းမှာ
      ဘာကို ထပ်ခါထပ်ခါ ကူးထည့်နေရလဲ ဆိုတာကနေ စပါ။
