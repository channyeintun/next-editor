      pricing စာမျက်နှာနဲ့ တိုက်စစ်ပြီး အမှတ်အသား လုပ်ထားပါ။ မသေချာတဲ့ ကွက်က ရှိရင် အဲဒါကို team ကို မပြောခင်
      ဖြေရှင်းရမယ့် မေးခွန်း အဖြစ် ရေးထားပါ။
