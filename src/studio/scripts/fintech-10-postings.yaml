        <rect x="610" y="520" width="380" height="130" rx="18" fill="#121824" stroke="#68d391" stroke-width="2.5"/><text x="800" y="573.9" font-size="26" text-anchor="middle" fill="#e9edf5" font-weight="600" class="mono">asset:psp-receivable</text><text x="800" y="612.7" font-size="24" text-anchor="middle" fill="#8a94a8">0.00 — settled</text>
