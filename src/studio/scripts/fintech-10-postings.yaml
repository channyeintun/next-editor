# Fintech Engineering, lesson 10: one transaction, many postings (Burmese).
#
# Source: Fintech Engineering Handbook, "Double-entry bookkeeping" (one transaction many
# movements; posted entries are immutable), "Flow 2: A card deposit" (the clearing account, the
# fee as an expense), "Audits and audit trails" (commingling), Appendix A "Accounting & ledgers"
# and "Payments, rails & cards" (posting, suspense / clearing, omnibus, commingling, accrual vs
# cash) (CC BY 4.0, Voytek Pitula).
# Start state: ledger.go is kit/go/ledger.go unchanged; main.go posts a 100.00 card deposit as one
# Tx of three lines (Cr liability:user:1042, Dr expense:processing-fee, Dr asset:psp-receivable)
# and prints four balances.
# Edits, all insert-only:
#   1. a second deposit with the fee line missing             -> run-2 prints the rejection
#   2. the PSP settlement: Dr asset:bank / Cr psp-receivable   -> run-3: bank 97.10, receivable 0
# Figures: fan (one event, three lines, one transaction), transit (where the money is between
# capture and settlement), pool (omnibus vs commingling, FTX), iv (the interview answer).
# Built by ~/Documents/fintech-course-work/tools/build-lesson.ts; fixtures by sim-go.ts --write.
