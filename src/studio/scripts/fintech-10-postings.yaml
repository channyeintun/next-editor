  - id: settle
    narration: >-
      [[mark:close-transit]] settlement ကို code ထဲ ထည့်ကြည့်ရအောင်။ [[mark:open-main2]] ဘဏ် account ကို
      debit လုပ်ပြီး receivable ကို credit လုပ်တဲ့ transaction ပါ။ [[mark:type-stl]] asset နှစ်ခုကြား ရွှေ့တာ
      ဖြစ်လို့ user ရဲ့ balance နဲ့ fee ကို မထိပါဘူး။ user ဘက်ကနေ ကြည့်ရင် ဘာမှ မဖြစ်သလိုပါပဲ၊
      ပြောင်းသွားတာက platform ရဲ့ ငွေ ရှိတဲ့ နေရာပါ။ [[mark:why-stl]] ဒီ ငွေ ၉၇ ယူရို ၁၀ ဆင့်က PSP ရဲ့
      settlement report ထဲက ဂဏန်းနဲ့ ကိုက်ရပါမယ်။ [[mark:run-3]] run လိုက်ရအောင်။ [[mark:pt-bank97]] ဘဏ်ထဲမှာ
      ၉၇ ယူရို ၁၀ ဆင့် ရောက်လာပြီး၊ [[mark:pt-rec0]] receivable က သုည ပြန်ဖြစ်ပါတယ်။ [[mark:pt-user3]] user
      ရဲ့ balance ကတော့ ၁၀၀ ပါပဲ။ [[mark:dock-3]] သတိထားကြည့်ရင် settlement က receivable ကို ပြင်လိုက်တာ
      မဟုတ်ပါဘူး၊ transaction အသစ်တစ်ခုနဲ့ ချေလိုက်တာပါ။ post လုပ်ပြီးသား transaction ကို ledger မှာ
      ဘယ်တော့မှ မပြင်ပါဘူး၊ immutable ပါ။ [[mark:corrections]] အမှားတစ်ခု ပြင်ရမယ် ဆိုရင်တောင် မူလ
      transaction ကို ထိန်းထားပြီး ပြန်ချေတဲ့ transaction အသစ်ကို post လုပ်ပါတယ်။ ဒါကို နောက်ပိုင်း lesson
      တစ်ခုမှာ အသေးစိတ် ကြည့်ပါမယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Double-entry bookkeeping (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#double-entry-bookkeeping",
        }
      - {
          title: "Fintech Engineering Handbook — Flow 2: A card deposit (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#flow-2-a-card-deposit",
        }
    actions:
      - { id: close-transit, type: slide.close, at: { mark: close-transit } }
      - { id: open-main2, type: workspace.openFile, at: { mark: open-main2 }, path: main.go }
      - id: type-stl
        type: editor.type
        at: { mark: type-stl }
        target:
          {
            file: main.go,
            after: "\t\t{Account: \"asset:psp-receivable\", Debit: 9710},\n\t}})\n",
            occurrence: 2,
          }
        text: "\tpost(&l, Tx{ID: \"stl-1\", Memo: \"PSP settlement\", Lines: []Line{\n\t\t{Account: \"asset:bank\", Debit: 9710},\n\t\t{Account: \"asset:psp-receivable\", Credit: 9710},\n\t}})\n"
        cadence: line-by-line
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "asset:bank                  97.10",
          timeoutMs: 8000,
        }
      - id: pt-bank97
        type: console.point
        at: { mark: pt-bank97 }
        target: { text: "asset:bank", occurrence: 1 }
      - id: pt-rec0
        type: console.point
        at: { mark: pt-rec0 }
        target: { text: "asset:psp-receivable", occurrence: 1 }
      - id: pt-user3
        type: console.point
        at: { mark: pt-user3 }
        target: { text: "liability:user:1042", occurrence: 1 }
      - {
          id: expect-file-stl,
          type: expect.file,
          at: { afterAction: run-3 },
          path: main.go,
          contains: '{Account: "asset:bank", Debit: 9710},',
        }
      - { id: dock-3, type: runtime.collapseDock, at: { mark: dock-3 } }

  - id: pool
    chapter: Omnibus နဲ့ commingling
    narration: >-
      [[mark:show-pool]] ဘဏ်ဘက်မှာတော့ user တစ်ယောက်ချင်းအတွက် ဘဏ် account သီးသန့် မဖွင့်ပါဘူး။
      [[mark:pt-rows]] ledger ထဲမှာ user တစ်ယောက်ချင်းရဲ့ liability account ရှိပြီး၊ [[mark:pt-omni]] ငွေ
      ကိုယ်တိုင်ကတော့ ဘဏ် account တစ်ခုထဲမှာ အတူတူ ရှိပါတယ်။ ဒါကို omnibus account လို့ ခေါ်ပါတယ်။
      ငွေကို စုထားပေမဲ့ ဘယ်သူ့ ငွေ ဘယ်လောက်လဲ ဆိုတာ ledger က အတိအကျ ခွဲမှတ်ထားလို့ ဒါက တရားဝင်တဲ့
      pooling ပါ။ [[mark:pool-2]] ကုမ္ပဏီ ကိုယ်ပိုင် ငွေ၊ ဆိုလိုတာက revenue တွေ၊ စရိတ် ပေးဖို့ ငွေတွေကတော့
      သီးခြား ထားရပါတယ်။ [[mark:pool-3]] user ငွေနဲ့ ကုမ္ပဏီ ငွေကို ရောလိုက်တာ၊ user ငွေကို ကုမ္ပဏီ
      စရိတ်အတွက် သုံးလိုက်တာကို commingling လို့ ခေါ်ပါတယ်။ regulator ဘက်ကနေ ကြည့်ရင် ပြင်းထန်တဲ့
      သတိပေးချက် တစ်ခုဖြစ်ပြီး audit မှာ စစ်တဲ့ အချက်ပါ။ [[mark:pool-4]] ဒီ ခွဲခြားမှု ပျက်သွားရင် ဘာဖြစ်နိုင်လဲ
      ဆိုတာနဲ့ ဆက်စပ်တဲ့ တကယ့် ဥပမာ တစ်ခုက FTX ပါ။ ၂၀၂၂ ခုနှစ် နိုဝင်ဘာ ၁၁ ရက်နေ့မှာ FTX နဲ့ သူ့
      affiliate တွေ Chapter ၁၁ bankruptcy အတွက် လျှောက်ထားခဲ့ပါတယ်။ [[mark:pt-case]] ဒီဇင်ဘာမှာ US SEC က founder ကို တရားစွဲပြီး၊ FTX ရဲ့
      customer ငွေတွေကို ဆက်စပ်နေတဲ့ trading ကုမ္ပဏီ တစ်ခုဆီ ထုတ်ဖော်မပြောဘဲ လွှဲသုံးခဲ့တယ်လို့ စွပ်စွဲခဲ့ပါတယ်။
      ၂၀၂၃ ခုနှစ်မှာတော့ federal jury က founder ကို စွဲချက် ခုနစ်ခုလုံးနဲ့ အပြစ်ရှိတယ်လို့ ဆုံးဖြတ်ခဲ့ပါတယ်။ [[mark:rule]]
      engineer ဘက်ကနေ ရတဲ့ သင်ခန်းစာက user liability စုစုပေါင်းကို user ငွေ ရှိရမယ့် asset နဲ့ ပုံမှန်
      တိုက်စစ်ဖို့ပါ၊ ဒီလို ကွာဟချက်ကို အစောဆုံး ပြပေးတဲ့ check က အဲဒါပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Audits and audit trails (Voytek Pitula, CC BY 4.0)",
