  - id: try-it
    chapter: ကိုယ်တိုင် စမ်းကြည့်ပါ
    narration: >-
      [[mark:close-iv]] ကိုယ်တိုင် စမ်းကြည့်ဖို့ တစ်ခု ရှိပါတယ်။ [[mark:sel-try]] reject ခံရတဲ့ ဒုတိယ deposit ထဲကို
      မေ့ကျန်ခဲ့တဲ့ fee line ကို ထည့်ပါ၊ processing fee expense ကို ၂၉၀ ဆင့် debit လုပ်တဲ့ line ပါ။ run
      လိုက်ရင် reject မဖြစ်တော့ဘဲ user ရဲ့ balance က ၂၀၀၊ fee expense က ငါးယူရို ရှစ်ဆယ်ဆင့် ဖြစ်လာပါမယ်။
      [[mark:try-why]] receivable မှာ ၉၇ ယူရို ၁၀ ဆင့် ပြန်ရှိနေတာကိုလည်း သတိထားပါ၊ ဒုတိယ deposit ရဲ့ ငွေအတွက်
      settlement မရောက်သေးလို့ပါ။ [[mark:recap]] ပြန်ချုပ်ရရင်၊ business event တစ်ခုကို debit နဲ့ credit ညီတဲ့
      line အများနဲ့ transaction တစ်ခုအဖြစ် တစ်ခါတည်း post လုပ်ပြီး၊ ငွေ တကယ် မရောက်သေးရင် ဘဏ် account
      မဟုတ်ဘဲ receivable မှာ ထားပါတယ်။ နောက် lesson မှာတော့ ဒီ deposit တစ်ခုမှာပဲ အချိန် သုံးမျိုး ရှိတာကို
      ကြည့်ပါမယ်။ ဖြစ်တဲ့ အချိန်၊ ledger မှာ မှတ်တဲ့ အချိန်နဲ့ ငွေ တကယ် ရွေ့တဲ့ အချိန်ပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Double-entry bookkeeping (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#double-entry-bookkeeping",
        }
    actions:
