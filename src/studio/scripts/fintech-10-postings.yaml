  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] Fintech interview တွေမှာ fee ပါတဲ့ card deposit တစ်ခုကို ledger မှာ ဘယ်လို မှတ်မလဲ
      လို့ မေးတတ်ပါတယ်။ user ရဲ့ balance ကို ၁၀၀ တိုးမယ် လို့ပဲ ဖြေရင် မလုံလောက်ပါဘူး။ [[mark:iv-a]]
      ပထမ၊ transaction တစ်ခုထဲမှာ line သုံးကြောင်းနဲ့ post လုပ်မယ်။ user ရဲ့ liability ကို ၁၀၀ credit၊ fee
      ကို expense အဖြစ် debit၊ ကျန်တာကို PSP receivable အဖြစ် debit လုပ်ပြီး ဘက် နှစ်ဖက် ညီရမယ်။
      [[mark:iv-b]] ဒုတိယ၊ ငွေ ဘဏ်ကို မရောက်သေးလို့ ဘဏ် account ကို မထိဘဲ receivable မှာ ထားမယ်။
      settlement ရောက်မှ ဘဏ်ကို debit၊ receivable ကို credit လုပ်မယ်။ [[mark:iv-c]] တတိယ၊ line
      အားလုံးကို database transaction တစ်ခုထဲမှာ ရေးပြီး မညီရင် တစ်ခုလုံး reject လုပ်မယ်။ post
      လုပ်ပြီးသားကို မပြင်ဘဲ ပြန်ချေတဲ့ entry နဲ့ပဲ ပြင်မယ်။ [[mark:iv-d]] ပြီးရင် ဘယ်လို စစ်မလဲ
      ဆက်ပြောပါ။ receivable ကို PSP ရဲ့ settlement batch နဲ့ reconcile လုပ်မယ်၊ သတ်မှတ်ထားတဲ့ ရက်
      ကျော်တာတောင် ကျန်နေတဲ့ receivable က ရောက်မလာတဲ့ ငွေ ဖြစ်လို့ alert ပေးမယ်။
    sources:
