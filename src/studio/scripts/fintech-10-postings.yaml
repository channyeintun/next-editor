build:
  voiceProfile:
    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 9510

runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "asset:bank                   0.00\nasset:psp-receivable        97.10\nexpense:processing-fee       2.90\nliability:user:1042        100.00\n"
      run-2:
        status: success
        exitCode: 0
        output: "rejected: tx dep-2 is not balanced: debit 97.10, credit 100.00\nasset:bank                   0.00\nasset:psp-receivable        97.10\nexpense:processing-fee       2.90\nliability:user:1042        100.00\n"
      run-3:
        status: success
        exitCode: 0
        output: "rejected: tx dep-2 is not balanced: debit 97.10, credit 100.00\nasset:bank                  97.10\nasset:psp-receivable         0.00\nexpense:processing-fee       2.90\nliability:user:1042        100.00\n"

scenes:
  - id: hook
    chapter: Event တစ်ခု၊ line အများ
    narration: >-
      user တစ်ယောက်က card နဲ့ ယူရို ၁၀၀ သွင်းတယ် ဆိုပါစို့။ [[mark:show-fan]] card payment ကို
      ကိုယ့်ကိုယ်စား လက်ခံပေးတဲ့ PSP က processing fee နှစ်ယူရို ကိုးဆယ်ဆင့် ဖြတ်ပြီး၊ ကျန်တဲ့ ၉၇ ယူရို
      ၁၀ ဆင့်ကို ရက်အနည်းငယ် နောက်မှ ပေးပါမယ်။ [[mark:pt-l1]] user ဘက်ကနေ ကြည့်ရင် ယူရို ၁၀၀
      သွင်းထားတာ ဖြစ်လို့ user ရဲ့ liability account ကို ၁၀၀ အပြည့် credit လုပ်ပါတယ်။ [[mark:fan-2]]
      platform ဘက်မှာတော့ ငွေက နှစ်နေရာ ကွဲသွားပါတယ်။ fee က PSP ကို ပေးရတဲ့ စရိတ် ဖြစ်လို့ expense
      ကို debit လုပ်ပြီး၊ [[mark:pt-l3]] ကျန်တဲ့ ၉၇ ယူရို ၁၀ ဆင့်က PSP က ကိုယ့်ကို ပေးစရာ ရှိတဲ့ ငွေ
      ဖြစ်လို့ receivable ကို debit လုပ်ပါတယ်။ receivable ဆိုတာ တခြားသူက ကိုယ့်ကို ပေးစရာ ရှိတဲ့
      asset ပါ။ [[mark:fan-3]] business event တစ်ခုက line သုံးကြောင်း ဖြစ်သွားပြီး၊ အဲဒီ သုံးကြောင်းကို
      transaction တစ်ခုတည်းအနေနဲ့ post လုပ်ပါတယ်။ posting ဆိုတာ entry တွေကို ledger ထဲမှာ တကယ်
      မှတ်လိုက်တာပါ။ [[mark:pt-sum]] debit နှစ်ကြောင်း ပေါင်းရင် ၁၀၀၊ credit က ၁၀၀ ဆိုတော့ ညီပါတယ်။
      [[mark:who-pays]] ဒီမှာ fee ကို platform က ခံလိုက်လို့ expense ဖြစ်တာပါ။ user ဆီက ဖြတ်မယ်
      ဆိုရင်တော့ user ကို credit လုပ်တဲ့ ပမာဏ လျော့သွားပါမယ်။ ဘယ်သူ ခံမလဲ ဆိုတာ business
      ဆုံးဖြတ်ချက်ပါ၊ ledger က အဲဒီ ဆုံးဖြတ်ချက်ကို line တွေအဖြစ် ရေးပေးတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Double-entry bookkeeping (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#double-entry-bookkeeping",
        }
      - {
          title: "Fintech Engineering Handbook — Flow 2: A card deposit (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#flow-2-a-card-deposit",
        }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }
      - { id: show-fan, type: slide.show, at: { mark: show-fan, offsetMs: -700 }, slideId: fan-1 }
      - {
          id: pt-ev,
          type: slide.point,
          at: { afterAction: show-fan },
          target: { x: 0.175, y: 0.653 },
        }
      - { id: pt-l1, type: slide.point, at: { mark: pt-l1 }, target: { x: 0.675, y: 0.442 } }
      - { id: fan-2, type: slide.show, at: { mark: fan-2 }, slideId: fan-2 }
      - { id: pt-l2, type: slide.point, at: { afterAction: fan-2 }, target: { x: 0.675, y: 0.62 } }
      - { id: pt-l3, type: slide.point, at: { mark: pt-l3 }, target: { x: 0.675, y: 0.798 } }
      - { id: fan-3, type: slide.show, at: { mark: fan-3 }, slideId: fan-3 }
      - { id: pt-tx, type: slide.point, at: { afterAction: fan-3 }, target: { x: 0.413, y: 0.292 } }
      - { id: pt-sum, type: slide.point, at: { mark: pt-sum }, target: { x: 0.669, y: 0.889 } }
      - { id: pt-who, type: slide.point, at: { mark: who-pays }, target: { x: 0.675, y: 0.62 } }

  - id: code
    narration: >-
      [[mark:close-fan]] code မှာ ဒီ transaction ကို ကြည့်ရအောင်။ [[mark:sel-lines]] line သုံးကြောင်းလုံး
      Tx တစ်ခုထဲမှာ ရှိပြီး Post ကို တစ်ခါပဲ ခေါ်ပါတယ်။ [[mark:sel-accts]] အောက်မှာ account လေးခုရဲ့
      balance ကို ထုတ်ပြပါတယ်၊ ဘဏ် account လည်း ပါပါတယ်။ [[mark:run-1]] run လိုက်ရအောင်။
      [[mark:pt-bank0]] ဘဏ်ထဲမှာ သုည ပါ၊ ငွေ မရောက်သေးလို့ပါ။ [[mark:pt-rec]] PSP ဆီမှာ ရှိနေတဲ့ ၉၇ ယူရို
      ၁၀ ဆင့်က receivable ထဲမှာ ရှိပြီး၊ [[mark:pt-user]] user ကိုတော့ ၁၀၀ အပြည့် ပေးစရာ ရှိနေပါပြီ။
      [[mark:dock-1]] user ရဲ့ balance က အခုကတည်းက မှန်ပေမဲ့၊ platform ရဲ့ ဘဏ်ထဲမှာ ငွေ မရှိသေးတာကို
      ledger က ဖုံးမထားပါဘူး။
    sources:
      - {
          title: "Fintech Engineering Handbook — Flow 2: A card deposit (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#flow-2-a-card-deposit",
        }
    actions:
      - { id: close-fan, type: slide.close, at: { mark: close-fan } }
      - id: sel-lines
        type: editor.select
        at: { mark: sel-lines }
        target:
          {
            file: main.go,
            text: "{Account: \"liability:user:1042\", Credit: 10000},\n\t\t{Account: \"expense:processing-fee\", Debit: 290},\n\t\t{Account: \"asset:psp-receivable\", Debit: 9710},",
            occurrence: 1,
          }
      - id: sel-accts
        type: editor.select
        at: { mark: sel-accts }
        target:
          {
            file: main.go,
            text: "accounts := []string{\"asset:bank\", \"asset:psp-receivable\",\n\t\t\"expense:processing-fee\", \"liability:user:1042\"}",
            occurrence: 1,
          }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "asset:psp-receivable        97.10",
          timeoutMs: 8000,
        }
      - id: pt-bank0
        type: console.point
        at: { mark: pt-bank0 }
        target: { text: "asset:bank", occurrence: 1 }
      - id: pt-rec
        type: console.point
        at: { mark: pt-rec }
        target: { text: "asset:psp-receivable", occurrence: 1 }
      - id: pt-user
        type: console.point
        at: { mark: pt-user }
        target: { text: "liability:user:1042", occurrence: 1 }
      - { id: dock-1, type: runtime.collapseDock, at: { mark: dock-1 } }

  - id: atomic
    chapter: တစ်ခုလုံး ဒါမှမဟုတ် ဘာမှ မဟုတ်
    narration: >-
      [[mark:type-bad]] နောက်ထပ် deposit တစ်ခုမှာ code က fee line ကို မေ့သွားတယ် ဆိုပါစို့။ user ကို ၁၀၀
      credit လုပ်ပြီး receivable ကို ၉၇ ယူရို ၁၀ ဆင့်ပဲ debit လုပ်ထားလို့ ဘက် နှစ်ဖက် မညီပါဘူး။
      [[mark:ask-bad]] Post က ညီတဲ့ line တွေကိုတော့ ထည့်ပြီး ကျန်တာကို ပယ်မလား၊ transaction တစ်ခုလုံးကို
      ပယ်မလား၊ run မလုပ်ခင် ခန့်မှန်းကြည့်ပါ။ [[mark:run-2]] run လိုက်ရအောင်။ [[mark:pt-rej]] transaction
      တစ်ခုလုံးကို reject လုပ်လိုက်ပြီး၊ debit နဲ့ credit ပမာဏ နှစ်ခုကိုပါ error ထဲမှာ ပြထားပါတယ်။
      [[mark:pt-rec2]] receivable က ၉၇ ယူရို ၁၀ ဆင့်ပဲ ရှိပါသေးတယ်၊ ဆိုလိုတာက ဒုတိယ transaction ရဲ့ line
      တစ်ကြောင်းမှ ledger ထဲ မရောက်ပါဘူး။ [[mark:open-ledger]] Post ထဲမှာ ဘယ်လို စစ်လဲ ကြည့်ရအောင်။
      [[mark:sel-post]] line အားလုံးရဲ့ debit နဲ့ credit ကို အရင် ပေါင်းပြီး၊ ညီမှ transaction ကို တစ်ခါတည်း
      ထည့်ပါတယ်။ [[mark:db-tx]] တကယ့် database မှာဆိုရင် line တွေကို database transaction တစ်ခုထဲမှာ
      ရေးပြီး commit မလုပ်ခင် ညီသလား စစ်ရပါတယ်။ line တစ်ကြောင်းချင်းကို သီးခြား commit တွေနဲ့
      ရေးရင် ကြားထဲမှာ crash ဖြစ်တဲ့အခါ credit ပဲ ရောက်ပြီး debit မရောက်တဲ့ books ကျန်ခဲ့ပါမယ်။
      [[mark:principles]] အဲဒါက ငွေကို မရှိဘဲ မဖန်တီးရဘူး ဆိုတဲ့ No invented data နဲ့၊ ငွေနဲ့ ပတ်သက်ပြီး
      ဖြစ်ခဲ့သမျှ မပျောက်ရဘူး ဆိုတဲ့ No lost data မူ နှစ်ခုလုံးကို ချိုးဖောက်တာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Double-entry bookkeeping (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#double-entry-bookkeeping",
        }
      - {
          title: "Fintech Engineering Handbook — Principles (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#principles",
        }
    actions:
      - id: type-bad
        type: editor.type
        at: { mark: type-bad }
        target:
          {
            file: main.go,
            after: "\t\t{Account: \"asset:psp-receivable\", Debit: 9710},\n\t}})\n",
            occurrence: 1,
          }
        text: "\tpost(&l, Tx{ID: \"dep-2\", Memo: \"card deposit\", Lines: []Line{\n\t\t{Account: \"liability:user:1042\", Credit: 10000},\n\t\t{Account: \"asset:psp-receivable\", Debit: 9710},\n\t}})\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "rejected: tx dep-2",
          timeoutMs: 8000,
        }
      - id: pt-rej
        type: console.point
        at: { mark: pt-rej }
        target: { text: "rejected", occurrence: 1 }
      - id: pt-rec2
        type: console.point
        at: { mark: pt-rec2 }
        target: { text: "asset:psp-receivable", occurrence: 1 }
      - { id: open-ledger, type: workspace.openFile, at: { mark: open-ledger }, path: ledger.go }
      - id: sel-post
        type: editor.select
        at: { mark: sel-post }
        target:
          {
            file: ledger.go,
            text: "if debit != credit {\n\t\treturn fmt.Errorf(\"tx %s is not balanced: debit %s, credit %s\", tx.ID, cents(debit), cents(credit))\n\t}\n\tl.txs = append(l.txs, tx)",
            occurrence: 1,
          }

  - id: transit
    chapter: PSP ဆီမှာ ရှိနေတဲ့ ငွေ
    narration: >-
      [[mark:show-transit]] receivable ကို ဘာလို့ သုံးရလဲ ဆိုတာ ငွေ တကယ် ဘယ်မှာ ရှိလဲ ဆိုတာနဲ့
      ကြည့်ရအောင်။ [[mark:pt-cap]] PSP က user ရဲ့ card payment ကို capture လုပ်လိုက်ပါပြီ၊ ဆိုလိုတာက card ကနေ ငွေကို တကယ် ဆွဲယူလိုက်တာပါ။ ဒါပေမဲ့ ငွေက
      PSP ဆီမှာ ရှိနေပါသေးတယ်။ [[mark:transit-2]] ledger မှာ user ကို ပေးစရာက ချက်ချင်း ပေါ်ပြီး၊ ငွေ
      ကိုယ်တိုင်ကတော့ receivable ထဲမှာ in transit အနေနဲ့ ရှိနေပါတယ်။ ငွေ လမ်းခရီးမှာ ရှိနေတုန်း ခဏ
      ထားတဲ့ ဒီလို account ကို clearing account ဒါမှမဟုတ် suspense account လို့ ခေါ်ပါတယ်။
      [[mark:transit-3]] ရက်အနည်းငယ် နောက်မှာ PSP က settlement လုပ်ပြီး ငွေ ကိုယ့်ဘဏ်ကို ရောက်လာပါတယ်။
      အဲဒီအခါ receivable က သုည ပြန်ဖြစ်ပြီး ဘဏ်ထဲမှာ ငွေ တကယ် ရှိလာပါတယ်။ [[mark:transit-4]] capture
      လုပ်တဲ့ အချိန်မှာပဲ ဘဏ် account ကို တန်း debit လုပ်လိုက်ရင် ဘာဖြစ်မလဲ။ ledger ရဲ့ ဘဏ် balance က
      settlement မရောက်မချင်း ဘဏ်ရဲ့ statement နဲ့ မကိုက်တော့ပါဘူး။ [[mark:worse]] ပိုဆိုးတာက PSP က
      ငွေ လုံးဝ မပေးလိုက်တဲ့ deposit တစ်ခုကို ledger ထဲမှာ ရှာလို့ မရတော့တာပါ။ receivable သုံးထားရင်တော့
      ရက်ကြာလာတာတောင် သုည မပြန်ဖြစ်တဲ့ receivable က အဲဒီ ငွေကို ပြပေးပါတယ်။ PSP ရဲ့ settlement ကို ဒီ
      account နဲ့ reconcile လုပ်တာ၊ ဆိုလိုတာက မှတ်တမ်း နှစ်ခု ကိုက်မကိုက် တိုက်စစ်တာကို နောက်ပိုင်းမှာ
      ကြည့်ပါမယ်။ [[mark:accrual]] fee expense ကိုလည်း PSP က တကယ် ဖြတ်တဲ့ settlement ကို မစောင့်ဘဲ
      ဖြစ်တဲ့ အချိန်မှာ မှတ်ပါတယ်။ ဒါကို accrual basis လို့ ခေါ်ပြီး၊ ငွေ တကယ် ရွေ့မှ မှတ်တာကို cash basis
      လို့ ခေါ်ပါတယ်။
    sources:
