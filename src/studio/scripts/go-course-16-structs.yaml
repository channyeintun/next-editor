# Go course, lesson 16: structs (Burmese). Module 4 starts: the parcel service.
#
# Start state: main.go with `package main`, `import "fmt"` and an empty `func main`.
# Edits, all insert-only:
#   1. the Parcel struct type (Code, To, WeightKg, Fee) under the import;
#   2. one parcel literal with field names, printed with Println and with %+v -> run-1:
#      {MDY-0001 MDY 2.5 6000} / {Code:MDY-0001 To:MDY WeightKg:2.5 Fee:6000};
#   3. a []Parcel of two parcels and a fee total in a loop -> run-2 adds 2 10500;
#   4. Parcel{} printed with %+v -> run-3 adds {Code: To: WeightKg:0 Fee:0}.
# Boards: (S) a struct type is the empty label form, a value is a filled-in label; a Myanmar name
# is one field; (Q) quiz (field order in a keyed literal).
# Fixtures: bun ~/Documents/go-course-work/tools/sim-go.ts <this yaml> --write
schemaVersion: 1

lesson:
  slug: go-course-16-structs
  title: "Go course 16: Struct နဲ့ ကိုယ်ပိုင် type"
  locale: my-MM
  workspace:
    lessonType: go
    name: Go Course
    entryFilePath: main.go
    # One file: an open explorer would be a list of one beside the code.
    sidebarStartsCollapsed: true
