          at: { afterAction: collapse-1 },
          open: true,
          clear: true,
          upsertIds: [n-title],
        }
      - {
          id: draw-both,
          type: whiteboard.apply,
          at: { mark: draw-both },
          upsertIds: [n-box, n-field, n-method],
          drawMs: 1800,
        }
      - {
          id: draw-err,
          type: whiteboard.apply,
          at: { mark: draw-err },
          upsertIds: [n-err],
          drawMs: 1500,
        }
      - {
          id: draw-name-rule,
          type: whiteboard.apply,
          at: { mark: draw-name-rule },
          upsertIds: [n-rule],
          drawMs: 1400,
        }
      - {
