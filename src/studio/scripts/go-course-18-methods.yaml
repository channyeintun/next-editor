  - id: bag
    chapter: Rider ရဲ့ ငွေအိတ်
    narration: >-
      [[mark:close-name]] အခု ပို့ခ ကောက်တဲ့ ဘက်ကို ကြည့်ရအောင်။ rider လှလှ က ပို့သူတွေ အိမ်ကနေ ပါဆယ် လာယူတိုင်း ပို့ခကို ကောက်ပြီး၊
      ငွေအိတ် တစ်ခုထဲ ထည့်ထားပါတယ်။ [[mark:type-bag]] အဲဒီ ငွေအိတ်အတွက် CashBag ဆိုတဲ့ struct ကို ရေးပါမယ်။ အထဲမှာ
      စုစုပေါင်း ငွေကို မှတ်ထားမယ့် total ဆိုတဲ့ field တစ်ခုပဲ ပါပါတယ်။ အောက်က Add method ကတော့ ပေးလိုက်တဲ့
      ပမာဏကို total ထဲ ပေါင်းထည့်ပေးပါတယ်။ [[mark:sel-bag-recv]] သူ့ receiver ကလည်း Fee မှာလိုပဲ CashBag
      တန်ဖိုး တစ်ခုပါ။ ဒီ method ကို ခေါ်လိုက်တိုင်း အိတ်ထဲကို ငွေ ဝင်လာမယ်လို့ ထင်ရပါတယ်။
    sources:
      - {
          title: "The Go Programming Language Specification — Method declarations",
          url: "https://go.dev/ref/spec#Method_declarations",
        }
    actions:
      - {
          id: close-name,
          type: whiteboard.apply,
          at: { mark: close-name },
          open: false,
          upsertIds: [],
        }
      - id: type-bag
        type: editor.type
        at: { mark: type-bag }
        target: { file: main.go, after: "int(p.WeightKg)*500\n}\n", occurrence: 1 }
        text: "\n// CashBag is the cash a rider has collected today.\ntype CashBag struct {\n\ttotal int\n}\n\nfunc (b CashBag) Add(amount int) {\n\tb.total += amount\n}\n"
        cadence: line-by-line
      - id: sel-bag-recv
        type: editor.select
        at: { mark: sel-bag-recv }
        target: { file: main.go, text: "(b CashBag)", occurrence: 1 }

  - id: use-bag
    narration: >-
      [[mark:type-b]] main ထဲမှာ နေပြည်တော်ကို ပို့မယ့် တစ်ကီလို ပါဆယ် တစ်ခု ထပ်ထည့်ပါမယ်။ [[mark:type-use]] ပြီးတော့
      ငွေအိတ် အသစ် တစ်ခု လုပ်ပြီး ပါဆယ် နှစ်ခုရဲ့ ပို့ခကို တစ်ခုပြီးတစ်ခု ထည့်ပါမယ်။ ငွေအိတ်ကို var နဲ့ ကြေညာထားလို့
      total က zero value ဖြစ်တဲ့ သုညနဲ့ စပါတယ်။ ၆၀၀၀ နဲ့ ၄၅၀၀ ထည့်လိုက်ရင် အိတ်ထဲမှာ ၁၀၅၀၀ ရှိရပါမယ်။
      [[mark:run-2]] ကဲ၊ run ကြည့်ရအောင်။
    sources:
      - {
          title: "The Go Programming Language Specification — The zero value",
          url: "https://go.dev/ref/spec#The_zero_value",
        }
    actions:
      - id: type-b
        type: editor.type
        at: { mark: type-b }
        target: { file: main.go, after: "WeightKg: 2.5}\n", occurrence: 1 }
        text: "\tb := Parcel{Code: \"NPT-0001\", To: \"NPT\", WeightKg: 1}\n"
        cadence: line-by-line
      - id: type-use
        type: editor.type
        at: { mark: type-use }
        target: { file: main.go, after: "a.Fee())\n", occurrence: 1 }
        text: "\tvar bag CashBag\n\tbag.Add(a.Fee())\n\tbag.Add(b.Fee())\n\tfmt.Println(bag.total)\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "MDY-0001 6000",
          timeoutMs: 8000,
        }

  - id: read-2
    chapter: ငွေတွေ ဘယ်ရောက်သွားလဲ
    narration: >-
      [[mark:point-zero]] ဒုတိယ စာကြောင်းကို ကြည့်ပါ၊ ၁၀၅၀၀ မဟုတ်ဘဲ သုည ထွက်လာပါတယ်။ compiler ကလည်း ဘာမှ မပြောသလို program ကလည်း ရပ်မသွားပါဘူး။ program က ကောင်းကောင်း run သွားပေမဲ့ ငွေ နှစ်ခါ ထည့်ထားတာ အိတ်ထဲ မရောက်ပါဘူး။
      ဒါက code ထဲမှာ ကိုယ်တို့ ရေးမှားထားတဲ့ bug ပါ။ ဘာကြောင့်လဲ ဆိုတာ board နဲ့ ကြည့်ရအောင်။
    sources:
      - {
          title: "Go FAQ — Should I define methods on values or pointers?",
          url: "https://go.dev/doc/faq#methods_on_values_or_pointers",
        }
    actions:
      - {
          id: point-zero,
          type: console.point,
          at: { mark: point-zero },
          target: { text: "0", occurrence: 2 },
        }

  - id: receivers
    chapter: Value receiver နဲ့ pointer receiver
    narration: >-
      [[mark:board-recv]] lesson ဆယ့်ခုနစ်မှာ function ကို struct ပေးလိုက်ရင် မိတ္တူ ရတယ် ဆိုတာ မှတ်မိမှာပါ။
      receiver ကလည်း argument တစ်ခုလိုပါပဲ။ [[mark:draw-real]] main ထဲမှာ ငွေအိတ် အစစ် ရှိပြီး သူ့ total က
      သုညပါ။ [[mark:draw-copy]] ငွေထည့်တဲ့ method ကို ခေါ်လိုက်တဲ့အခါ receiver က CashBag တန်ဖိုး ဖြစ်လို့၊ Go က
      ငွေအိတ်ရဲ့ မိတ္တူ တစ်ခုကို method ဆီ ပေးပါတယ်။ method က ၆၀၀၀ ကို အဲဒီ မိတ္တူထဲကိုပဲ ထည့်ပါတယ်။
      [[mark:draw-lost]] method ပြီးသွားတာနဲ့ မိတ္တူလည်း ပျောက်သွားပြီး၊ ငွေအိတ် အစစ်ကတော့ သုညအတိုင်း
      ကျန်ခဲ့ပါတယ်။ ဒါကို value receiver လို့ ခေါ်ပါတယ်၊ ပို့ခ တွက်တာလို ဖတ်ရုံ ဖတ်တဲ့ အလုပ်အတွက်တော့
      အဆင်ပြေပါတယ်။ [[mark:draw-ptr]] ငွေအိတ် အစစ်ကို ပြင်ချင်ရင်တော့ receiver ကို CashBag ရဲ့ pointer ဖြစ်အောင်
      ပြောင်းရပါမယ်။ အဲဒါကို pointer receiver လို့ ခေါ်ပြီး၊ method က အိတ် အစစ် ရှိတဲ့ နေရာကို တန်း
      ရောက်သွားတာပါ။ [[mark:draw-rule]] ဆိုလိုတာက ဖတ်ရုံဆိုရင် value receiver၊ ပြောင်းမယ်ဆိုရင် pointer receiver ပါ။
    sources:
      - {
          title: "Go FAQ — Should I define methods on values or pointers?",
          url: "https://go.dev/doc/faq#methods_on_values_or_pointers",
        }
      - {
          title: "The Go Programming Language Specification — Method sets",
          url: "https://go.dev/ref/spec#Method_sets",
        }
    actions:
      - { id: collapse-2, type: runtime.collapseDock, at: { mark: board-recv } }
      - {
          id: board-recv,
          type: whiteboard.apply,
          at: { afterAction: collapse-2 },
          open: true,
          clear: true,
          upsertIds: [r-title],
        }
      - {
          id: draw-real,
          type: whiteboard.apply,
          at: { mark: draw-real },
          upsertIds: [r-real-box, r-real],
          drawMs: 1200,
        }
      - {
          id: draw-copy,
          type: whiteboard.apply,
          at: { mark: draw-copy },
          upsertIds: [r-copy-arrow, r-copy-box, r-copy],
          drawMs: 2000,
        }
      - {
          id: draw-lost,
          type: whiteboard.apply,
          at: { mark: draw-lost },
          upsertIds: [r-lost],
          drawMs: 1200,
        }
      - {
          id: draw-ptr,
          type: whiteboard.apply,
          at: { mark: draw-ptr },
          upsertIds: [r-ptr-arrow, r-ptr-box, r-ptr],
          drawMs: 2000,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: draw-rule },
          upsertIds: [r-rule],
          drawMs: 1400,
        }

  - id: fix
    narration: >-
      [[mark:close-recv]] ဒါဆို receiver ကို ပြင်ရအောင်။ [[mark:type-star]] receiver ရဲ့ type ရှေ့မှာ pointer
      သင်္ကေတ တစ်လုံး ထည့်လိုက်ပါမယ်။ code မှာ ပြင်ရတာ ဒီ စာလုံး တစ်လုံးပါပဲ။ [[mark:sel-call]] main ထဲက
      ငွေထည့်တဲ့ line ကို ကြည့်ပါ။ lesson ဆယ့်ခုနစ်မှာလို ငွေအိတ်ရဲ့ address ကို ကိုယ်တိုင် ယူပေးစရာ မလိုပါဘူး။
      method က pointer receiver ဖြစ်ပြီး ငွေအိတ်က variable တစ်ခု ဖြစ်နေတဲ့အတွက်၊ Go က address ကို ကိုယ့်အစား
      ယူပေးပါတယ်။ [[mark:run-3]] ကဲ၊ ထပ်ပြီး run ကြည့်ရအောင်။
    sources:
      - {
          title: "The Go Programming Language Specification — Calls",
          url: "https://go.dev/ref/spec#Calls",
        }
      - {
          title: "Effective Go — Pointers vs. Values",
          url: "https://go.dev/doc/effective_go#pointers_vs_values",
        }
    actions:
      - {
          id: close-recv,
          type: whiteboard.apply,
          at: { mark: close-recv },
          open: false,
          upsertIds: [],
        }
      - id: type-star
        type: editor.type
        at: { mark: type-star }
        target: { file: main.go, after: "func (b ", occurrence: 1 }
        text: "*"
      - id: sel-call
        type: editor.select
        at: { mark: sel-call }
        target: { file: main.go, text: "bag.Add(a.Fee())", occurrence: 1 }
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "10500",
          timeoutMs: 8000,
        }
      - {
          id: expect-file-star,
          type: expect.file,
          at: { afterAction: run-3 },
          path: main.go,
          contains: "func (b *CashBag) Add(amount int) {",
        }

  - id: read-3
    chapter: ဘယ် receiver ကို ရွေးမလဲ
    narration: >-
      [[mark:point-total]] ဒီ တစ်ခါတော့ ဒုတိယ စာကြောင်းမှာ ၁၀၅၀၀ ထွက်လာပါပြီ။ ၆၀၀၀ နဲ့ ၄၅၀၀ ကို အိတ် အစစ်ထဲ
      တကယ် ထည့်လိုက်တာပါ။ [[mark:rule-fee]] ဒါဆို ဘယ်အချိန်မှာ ဘယ် receiver ကို ရွေးမလဲ။ ပို့ခ တွက်တဲ့ method လို
      တန်ဖိုးကို ဖတ်ရုံပဲ ဖတ်ရင် value receiver နဲ့ လုံလောက်ပါတယ်။ [[mark:rule-add]] ငွေထည့်တဲ့ method လို
      တန်ဖိုးကို ပြောင်းရမယ် ဆိုရင်တော့ pointer receiver ကို သုံးပါ။ ပြီးတော့ type တစ်ခုမှာ ပြောင်းတဲ့ method
      တစ်ခု ရှိတာနဲ့၊ အဲဒီ type ရဲ့ method အားလုံးကို pointer receiver ပေးထားတာ ကောင်းပါတယ်။ ဒါမှ type
      တစ်ခုရဲ့ method တွေ အားလုံး တစ်ပုံစံတည်း ဖြစ်နေမှာပါ။
    sources:
      - {
          title: "Go FAQ — Should I define methods on values or pointers?",
          url: "https://go.dev/doc/faq#methods_on_values_or_pointers",
        }
    actions:
      - {
          id: point-total,
          type: console.point,
          at: { mark: point-total },
          target: { text: "10500" },
        }
      - id: rule-fee
        type: editor.select
        at: { mark: rule-fee }
        target: { file: main.go, text: "func (p Parcel) Fee() int {", occurrence: 1 }
      - id: rule-add
        type: editor.select
        at: { mark: rule-add }
        target: { file: main.go, text: "func (b *CashBag) Add(amount int) {", occurrence: 1 }

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >-
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ board ပေါ်မှာ မန္တလေး ပါဆယ် တစ်ခု ရှိပြီး၊ အဲဒီ ပါဆယ်ရဲ့ pointer ကို
      variable တစ်ခုထဲ ထည့်ထားပါတယ်။ [[mark:quiz-line]] Fee method က value receiver ပါ၊ ဒါပေမဲ့ ဒီမှာ ပါဆယ်ကနေ
      မဟုတ်ဘဲ pointer ကနေ ခေါ်ထားပါတယ်။ compile error ပေါ်မလား၊ ၆၀၀၀ ထွက်မလား။ lesson ကို pause လုပ်ပြီး
      စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] အဖြေကတော့ ခ၊ ၆၀၀၀ ပါ။ ဘာကြောင့်လဲဆိုတော့ lesson ဆယ့်ခုနစ်မှာ pointer
      ကနေ field ကို ဖတ်တဲ့အခါ Go က pointer နောက်ကို လိုက်သွားပေးသလိုပဲ၊ ဒီမှာလည်း ပါဆယ် အစစ်ဆီ လိုက်သွားပြီး
      အဲဒီ ပါဆယ်ရဲ့ မိတ္တူကို method ဆီ ပေးလို့ပါ။ ဖတ်ရုံ ဖတ်တဲ့ method ဖြစ်လို့ မိတ္တူနဲ့ တွက်လည်း အဖြေ
      အတူတူပါပဲ။
    sources:
      - {
          title: "The Go Programming Language Specification — Method sets",
          url: "https://go.dev/ref/spec#Method_sets",
        }
      - {
          title: "Effective Go — Pointers vs. Values",
          url: "https://go.dev/doc/effective_go#pointers_vs_values",
        }
    actions:
      - {
          id: quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [q-title, q-code, q-l1, q-l2, q-l3, q-a, q-b],
        }
      - {
          id: quiz-line,
          type: whiteboard.apply,
          at: { mark: quiz-line },
          upsertIds: [q-mark],
          drawMs: 900,
        }
      - {
          id: quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-check],
          drawMs: 700,
        }

  - id: recap
    chapter: ပြန်ချုပ်ရရင်
    narration: >-
      [[mark:close-quiz]] ဒါဆို ပြန်ချုပ်ရရင်၊ method ဆိုတာ type တစ်ခုနဲ့ တွဲထားတဲ့ function ဖြစ်ပြီး၊ variable ရဲ့
      နောက်မှာ နာမည်ကို တွဲပြီး ခေါ်ပါတယ်။ [[mark:recap-fee]] ပို့ခ တွက်တဲ့ method လို ဖတ်ရုံ ဖတ်တဲ့ method က
      value receiver နဲ့ မိတ္တူကို ယူပါတယ်။ [[mark:recap-add]] ငွေထည့်တဲ့ method လို တန်ဖိုး ပြောင်းရမယ့် method
      ကတော့ pointer receiver နဲ့ အစစ်ကို ပြင်ပါတယ်၊ ခေါ်တဲ့အခါ address ကို Go က ယူပေးပါတယ်။ ဒီနေ့ program က
      ဖိုင် တစ်ခုတည်းမှာ အတော် ရှည်လာပါပြီ။ နောက် lesson မှာတော့ program တစ်ခုကို ဖိုင် အများကြီးနဲ့
      ခွဲရေးတာကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "The Go Programming Language Specification — Method declarations",
          url: "https://go.dev/ref/spec#Method_declarations",
        }
    actions:
      - {
          id: close-quiz,
          type: whiteboard.apply,
          at: { mark: close-quiz },
          open: false,
          upsertIds: [],
        }
      - id: recap-fee
        type: editor.select
        at: { mark: recap-fee }
        target:
          {
            file: main.go,
            text: "func (p Parcel) Fee() int {\n\treturn baseFees[p.To] + int(p.WeightKg)*500\n}",
            occurrence: 1,
          }
      - id: recap-add
        type: editor.select
        at: { mark: recap-add }
        target:
          {
            file: main.go,
            text: "func (b *CashBag) Add(amount int) {\n\tb.total += amount\n}",
            occurrence: 1,
          }

checks:
  - { type: timing.p95Ms, max: 300 }
