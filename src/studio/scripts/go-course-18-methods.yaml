# Go course, lesson 18: methods (Burmese).
#
# Start state: main.go with `package main`, `import "fmt"`, the lesson-17 Parcel (Code, To,
# WeightKg: the fee is no longer a field), baseFees for three cities and a main holding one parcel.
# Edits, all insert-only (final program = probe 17-methods):
#   1. the Fee method under baseFees, and a Println of the parcel's code and fee in main
#      -> run-1: MDY-0001 6000;
#   2. CashBag with a value-receiver Add, a second parcel, a bag that takes both fees
#      -> run-2: the bag still holds 0 (a bug, no error);
#   3. `*` in Add's receiver -> run-3: 10500.
# Boards: (M) a function beside the label vs a method stamped on it; (N) a field and a method
# cannot share a name (said, not run); (R) a value receiver works on a photocopy of the bag, a
# pointer receiver walks to the real one; (Q) quiz: a value method called through a pointer.
# Fixtures: bun ~/Documents/go-course-work/tools/sim-go.ts <this yaml> --write
schemaVersion: 1

lesson:
  slug: go-course-18-methods
  title: "Go course 18: Method ဆိုတာ"
  locale: my-MM
  workspace:
    lessonType: go
    name: Go Course
    entryFilePath: main.go
    # One file: an open explorer would be a list of one beside the code.
    sidebarStartsCollapsed: true
    files:
      main.go: |
        package main

        import "fmt"

        // Parcel is one parcel handed in at the counter.
        type Parcel struct {
        	Code     string
        	To       string
        	WeightKg float64
        }

        // baseFees is the fee to each city before weight, in kyats.
        var baseFees = map[string]int{"YGN": 2000, "NPT": 4000, "MDY": 5000}

        func main() {
        	a := Parcel{Code: "MDY-0001", To: "MDY", WeightKg: 2.5}
        }
