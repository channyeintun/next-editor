scenes:
  - id: recall
    chapter: Method ဆိုတာ
    narration: >-
      ပြီးခဲ့တဲ့ lesson မှာ pointer ကို လေ့လာခဲ့ပါတယ်။ function က ပါဆယ်ရဲ့ မိတ္တူကို မယူဘဲ စင်နံပါတ်ကို
      ယူရင်၊ ပါဆယ် အစစ်ကို ပြင်လို့ ရတယ် ဆိုတာ တွေ့ခဲ့ပါတယ်။ ဒီနေ့ lesson မှာတော့ type တစ်ခုနဲ့ တွဲထားတဲ့
      function ဖြစ်တဲ့ method ကို လေ့လာပါမယ်။ [[mark:sel-struct]] main ဖိုင်ထဲက Parcel struct ကို ကြည့်ပါ။
      ပါဆယ် code၊ ပို့မယ့် မြို့နဲ့ အလေးချိန် ဆိုတဲ့ field သုံးခု ရှိပါတယ်။ lesson ဆယ့်ခြောက်မှာတော့ ပို့ခကိုလည်း
      field တစ်ခု အနေနဲ့ label ပေါ်မှာ လက်နဲ့ ရေးထားခဲ့ပါတယ်။ ဒီနေ့တော့ ပို့ခကို မြို့နဲ့ အလေးချိန်ကနေ program
      က ကိုယ်တိုင် တွက်ပေးအောင် လုပ်ပါမယ်။ [[mark:sel-fees]] ဒီ map က မြို့ code တစ်ခုစီအတွက် အခြေခံ ပို့ခကို ကျပ်နဲ့
      မှတ်ထားတာပါ။ ဒီ lesson အတွက် စည်းကမ်းက၊ အခြေခံ ပို့ခပေါ်မှာ ကီလို အပြည့် တစ်ကီလိုတိုင်းအတွက် ၅၀၀ ကျပ်
      ပေါင်းတာပါ။ ဒီ ပို့ခတွေကလည်း lesson အတွက် ဥပမာ ထားတာပါ၊ တကယ့် ဈေးနှုန်း မဟုတ်ပါဘူး။
    sources:
      - {
          title: "The Go Programming Language Specification — Method declarations",
          url: "https://go.dev/ref/spec#Method_declarations",
        }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }
      - id: sel-struct
        type: editor.select
        at: { mark: sel-struct }
        target:
          {
            file: main.go,
            text: "type Parcel struct {\n\tCode     string\n\tTo       string\n\tWeightKg float64\n}",
            occurrence: 1,
          }
      - id: sel-fees
        type: editor.select
        at: { mark: sel-fees }
        target:
          {
            file: main.go,
            text: 'var baseFees = map[string]int{"YGN": 2000, "NPT": 4000, "MDY": 5000}',
            occurrence: 1,
          }

  - id: board-m
    narration: >-
      [[mark:board-method]] ဒီ တွက်နည်းကို ရေးဖို့ လမ်း နှစ်လမ်း ရှိပါတယ်။ [[mark:draw-fn]] ပထမ လမ်းက lesson
      ကိုးမှာ ရေးခဲ့သလို သာမန် function တစ်ခုပါ။ အဲဒီ function က label ရဲ့ ဘေးမှာ ရပ်နေတဲ့ စက် တစ်လုံးလိုပါပဲ၊
      ပါဆယ်ကို argument အနေနဲ့ ထည့်ပေးမှ တွက်ပေးပါတယ်။ [[mark:draw-method]] ဒုတိယ လမ်းကတော့ method ပါ။
      method ဆိုတာ type တစ်ခုနဲ့ တွဲထားတဲ့ function ပါ။ label ပေါ်မှာ တံဆိပ် တစ်ခု ကပ်ထားသလိုပါပဲ၊ ပါဆယ်
      တိုင်းမှာ ပို့ခ တွက်တဲ့ တံဆိပ် ပါလာပါတယ်။ ခေါ်တဲ့အခါမှာလည်း ပါဆယ် variable ရဲ့ နောက်မှာ method နာမည်ကို
      တွဲပြီး ခေါ်ပါတယ်။ [[mark:draw-recv]] method က ဘယ် type နဲ့ တွဲထားလဲ ဆိုတာကို receiver လို့ ခေါ်ပါတယ်။
      ဒီမှာ receiver က Parcel ပါ။ အလုပ်ကတော့ function နဲ့ အတူတူပါပဲ၊ ဒါပေမဲ့ method က ပါဆယ်နဲ့ ဆိုင်တဲ့
      အလုပ်ကို ပါဆယ်နဲ့ အတူ စုထားပေးပါတယ်။
    sources:
      - {
          title: "The Go Programming Language Specification — Method declarations",
          url: "https://go.dev/ref/spec#Method_declarations",
        }
      - {
          title: "The Go Programming Language Specification — Calls",
          url: "https://go.dev/ref/spec#Calls",
        }
    actions:
      - {
          id: board-method,
          type: whiteboard.apply,
          at: { mark: board-method, offsetMs: -300 },
          open: true,
          clear: true,
          upsertIds: [m-title],
        }
      - {
          id: draw-fn,
          type: whiteboard.apply,
          at: { mark: draw-fn },
          upsertIds: [m-fn-name, m-fn-box, m-fn, m-fn-note],
          drawMs: 1800,
        }
      - {
          id: draw-method,
          type: whiteboard.apply,
          at: { mark: draw-method },
          upsertIds: [m-me-name, m-label-box, m-label, m-stamp, m-stamp-text, m-me-note],
          drawMs: 2800,
        }
      - {
          id: draw-recv,
          type: whiteboard.apply,
          at: { mark: draw-recv },
          upsertIds: [m-recv],
          drawMs: 1400,
        }

  - id: write
    chapter: Method ရေးကြည့်ရအောင်
    narration: >-
      [[mark:close-method]] ဒါဆို ပို့ခ တွက်တဲ့ Fee method ကို ရေးကြည့်ရအောင်။ [[mark:type-fee]] map ရဲ့ အောက်မှာ
      comment တစ်ကြောင်းနဲ့ method ကို ရေးပါမယ်။ function ရေးတာနဲ့ အတူတူပါပဲ၊ ကွာတာ တစ်ခုက func ဆိုတဲ့
      keyword နဲ့ method နာမည်ကြားမှာ ကွင်း တစ်စုံ ထပ်ပါလာတာပါ။ [[mark:sel-recv]] ဒီ ကွင်းထဲက အပိုင်းက receiver
      ပါ။ ဒီ method က Parcel အတွက် ဖြစ်ပြီး၊ ခေါ်လိုက်တဲ့ ပါဆယ်ကို method ထဲမှာ p ဆိုတဲ့ နာမည်နဲ့ သုံးလို့ ရတယ်လို့
      ပြောတာပါ။ [[mark:sel-return]] return line က map ထဲကနေ မြို့ရဲ့ အခြေခံ ပို့ခကို ယူပြီး၊ ကီလို အပြည့်
      အရေအတွက်ကို ၅၀၀ နဲ့ မြှောက်ထားတာ ပေါင်းပါတယ်။ အလေးချိန်ကို int ပြောင်းတဲ့အခါ ဒသမ နောက်က အပိုင်း
      ပြတ်ကျလို့၊ နှစ်ကီလိုခွဲက နှစ် ဖြစ်သွားပါတယ်။ [[mark:type-print]] main ထဲမှာတော့ မန္တလေးကို ပို့မယ့်
      ပါဆယ်ရဲ့ code နဲ့ ပို့ခကို print ထုတ်ပါမယ်။ [[mark:run-1]] ကဲ၊ run လိုက်ရအောင်။
    sources:
      - {
          title: "The Go Programming Language Specification — Method declarations",
          url: "https://go.dev/ref/spec#Method_declarations",
        }
      - {
          title: "The Go Programming Language Specification — Calls",
          url: "https://go.dev/ref/spec#Calls",
        }
    actions:
      - {
          id: close-method,
          type: whiteboard.apply,
          at: { mark: close-method },
          open: false,
          upsertIds: [],
        }
      - id: type-fee
        type: editor.type
        at: { mark: type-fee }
        target: { file: main.go, after: "\"MDY\": 5000}\n", occurrence: 1 }
        text: "\n// Fee is the city's base fee plus 500 kyats for every whole kilogram.\nfunc (p Parcel) Fee() int {\n\treturn baseFees[p.To] + int(p.WeightKg)*500\n}\n"
        cadence: line-by-line
      - id: sel-recv
        type: editor.select
        at: { mark: sel-recv }
        target: { file: main.go, text: "(p Parcel)", occurrence: 1 }
      - id: sel-return
        type: editor.select
        at: { mark: sel-return }
        target:
          { file: main.go, text: "return baseFees[p.To] + int(p.WeightKg)*500", occurrence: 1 }
      - id: type-print
        type: editor.type
        at: { mark: type-print }
        target: { file: main.go, after: "WeightKg: 2.5}\n", occurrence: 1 }
        text: "\tfmt.Println(a.Code, a.Fee())\n"
        cadence: line-by-line
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "MDY-0001 6000",
          timeoutMs: 8000,
        }
      - {
          id: expect-file-fee,
          type: expect.file,
          at: { afterAction: run-1 },
          path: main.go,
          contains: "func (p Parcel) Fee() int {\n\treturn baseFees[p.To] + int(p.WeightKg)*500\n}\n",
        }

  - id: read-1
    narration: >-
      [[mark:point-fee]] output မှာ မန္တလေး ပါဆယ်ရဲ့ code နဲ့ ၆၀၀၀ ထွက်လာပါတယ်။ မန္တလေးရဲ့ အခြေခံ ပို့ခ ၅၀၀၀
      ပေါ်မှာ နှစ်ကီလို အတွက် ၁၀၀၀ ပေါင်းလို့ ၆၀၀၀ ရတာပါ။ ပို့ခကို label ပေါ်မှာ ကိုယ်တိုင် ရေးမထားဘဲ ပါဆယ်ရဲ့
      အချက်အလက်ကနေ method က တွက်ပေးတာ ဖြစ်လို့၊ အလေးချိန် ပြောင်းရင် ပို့ခလည်း လိုက်ပြောင်းမှာပါ။
    sources:
      - {
          title: "The Go Programming Language Specification — Conversions",
          url: "https://go.dev/ref/spec#Conversions",
        }
    actions:
      - {
          id: point-fee,
          type: console.point,
          at: { mark: point-fee },
          target: { text: "MDY-0001 6000" },
        }

  - id: same-name
    narration: >-
      [[mark:board-name]] ဒီနေရာမှာ မေးစရာ တစ်ခု ရှိပါတယ်။ lesson ဆယ့်ခြောက်က ပို့ခ field ကို ဘာကြောင့် ဖြုတ်ထားရတာလဲ။
      [[mark:draw-both]] field ရော method ရော နာမည် တူတူ ထားလိုက်ရင်၊ ပါဆယ် တစ်ခုရဲ့ ပို့ခကို ခေါ်တဲ့အခါ ရေးထားတဲ့
      field ကို ပြောတာလား၊ တွက်ပေးမယ့် method ကို ပြောတာလား ဆိုတာ မသိနိုင်တော့ပါဘူး။ [[mark:draw-err]] ဒါကြောင့်
      compiler က အဲဒီလို code ကို လက်မခံဘဲ compile error ပြပါတယ်။ Fee ဆိုတဲ့ field နဲ့ method ကို နာမည်တူ
      ထားလို့ မရပါဘူး လို့ ပြောတာပါ။ [[mark:draw-name-rule]] ဆိုလိုတာက struct တစ်ခုမှာ နာမည် တစ်ခုကို field
      အတွက် ဒါမှမဟုတ် method အတွက်၊ တစ်နေရာတည်းမှာပဲ သုံးလို့ ရပါတယ်။ [[mark:draw-ok]] ဒီ course မှာတော့
      ပို့ခကို အမြဲ method နဲ့ပဲ တွက်သွားပါမယ်။
    sources:
      - {
          title: "The Go Programming Language Specification — Method declarations",
          url: "https://go.dev/ref/spec#Method_declarations",
        }
    actions:
      - { id: collapse-1, type: runtime.collapseDock, at: { mark: board-name } }
      - {
          id: board-name,
