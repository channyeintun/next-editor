build:
  voiceProfile:
    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 9503

runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "12.34 USD → 1234 → 12.34\n1234 JPY → 1234 → 1234\n1.234 BHD → 1234 → 1.234\n12.345 USD → error: \"12.345\" has more than 2 decimal places\n"
      run-2:
        status: success
        exitCode: 0
        output: "12.34 USD → 1234 → 12.34\n1234 JPY → 1234 → 1234\n1.234 BHD → 1234 → 1.234\n12.345 USD → error: \"12.345\" has more than 2 decimal places\n21000000 BTC → 2100000000000000 → 21000000.00000000\n10 ETH → -8446744073709551616 → -8.446744073709551616\n"
      run-3:
        status: success
        exitCode: 0
        output: "12.34 USD → 1234 → 12.34\n1234 JPY → 1234 → 1234\n1.234 BHD → 1234 → 1.234\n12.345 USD → error: \"12.345\" has more than 2 decimal places\n21000000 BTC → 2100000000000000 → 21000000.00000000\n10 ETH → -8446744073709551616 → -8.446744073709551616\n10 ETH → big.Int 10000000000000000000\n"

scenes:
  - id: hook
    chapter: ငွေကို ကိန်းပြည့်နဲ့ ရေတွက်ခြင်း
    narration: >-
      ledger နဲ့ API အများစုက ငွေပမာဏကို float မဟုတ်ဘဲ minor unit ကိန်းပြည့်နဲ့ သိမ်းကြပါတယ်။ ဒါပေမဲ့ ကိန်းပြည့်ထဲ ထည့်လိုက်ရုံနဲ့ မပြီးပါဘူး။ [[mark:show-unit]] ယူရို
      ၁၂ ဒသမ သုံးလေး ကို ဆင့် ၁၂၃၄ လို့ သိမ်းပါတယ်။ [[mark:pt-n]] ဒီ ကိန်းပြည့်က currency ရဲ့ အသေးဆုံး
      unit ဖြစ်တဲ့ minor unit ကို ဘယ်နှခု ရှိလဲ ရေတွက်ထားတာပါ။
      [[mark:unit-2]] ဒသမ အမှတ်ကိုတော့ ဂဏန်းထဲမှာ မသိမ်းပါဘူး။ ဒသမ ဘယ်နှလုံး ရှိလဲ ဆိုတာ currency
      ကနေ ယူရပြီး၊ fiat currency တွေအတွက်ဆိုရင် ISO ရဲ့ currency စံက သတ်မှတ်ထားပါတယ်။
      [[mark:pt-point]] ဆိုလိုတာက ကိန်းပြည့် တစ်ခုတည်းကို ကြည့်ပြီး ပမာဏ ဘယ်လောက်လဲ ပြောလို့
      မရပါဘူး။
    sources:
      - {
          title: "Fintech Engineering Handbook — Precision handling (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#precision-handling",
        }
      - {
          title: "SIX (ISO 4217 Maintenance Agency) — List One",
          url: "https://www.six-group.com/dam/download/financial-information/data-center/iso-currrency/lists/list-one.xml",
        }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }
      - {
          id: show-unit,
          type: slide.show,
          at: { mark: show-unit, offsetMs: -700 },
          slideId: unit-1,
        }
      - { id: pt-n, type: slide.point, at: { mark: pt-n }, target: { x: 0.804, y: 0.48 } }
      - { id: unit-2, type: slide.show, at: { mark: unit-2 }, slideId: unit-2 }
      - {
          id: pt-tbl,
          type: slide.point,
          at: { afterAction: unit-2 },
          target: { x: 0.263, y: 0.842 },
        }
      - { id: pt-point, type: slide.point, at: { mark: pt-point }, target: { x: 0.704, y: 0.781 } }

  - id: parse
    narration: >-
      [[mark:close-unit]] code နဲ့ စစ်ကြည့်ရအောင်။ [[mark:sel-table]] ဒီ table က system လက်ခံတဲ့ asset
      တစ်ခုချင်းရဲ့ ဒသမ အရေအတွက်ပါ။ [[mark:sel-show]] show က string ပမာဏ တစ်ခုကို currency နဲ့
      တွဲပြီး ကိန်းပြည့် ပြောင်းပါတယ်၊ ပြီးရင် အဲဒီ ကိန်းပြည့်ကို ပြသတဲ့ ပုံစံ ပြန်ပြောင်းပါတယ်။ table
      ထဲ မရှိတဲ့ currency ကိုတော့ လက်မခံပါဘူး။ [[mark:type-three]] ယန်း ၁၂၃၄၊ BHD တစ် ဒသမ
      နှစ်သုံးလေး၊ ပြီးတော့ ဒေါ်လာ ၁၂ ဒသမ သုံးလေးငါး တို့ကို ထပ်ထည့်ပါမယ်။ နောက်ဆုံး တစ်ခုမှာ
      ဆင့်ထက် သေးတဲ့ အပိုင်း ပါနေပါတယ်။ [[mark:run-1]] run လိုက်ရအောင်။ [[mark:pt-jpy]] ယန်းမှာ ဒသမ မရှိလို့ ယန်း ၁၂၃၄ က ၁၂၃၄ ပဲ ဖြစ်ပြီး၊ ဒေါ်လာ ၁၂ ဒသမ သုံးလေး နဲ့
      ကိန်းပြည့် အတူတူပါ။
      [[mark:pt-bhd]] BHD မှာ ဒသမ သုံးလုံး ရှိလို့ တစ် ဒသမ နှစ်သုံးလေး ကလည်း ၁၂၃၄ ပဲ ထွက်ပါတယ်။
      ကိန်းပြည့် တစ်ခုတည်းက ပမာဏ သုံးမျိုးကို ကိုယ်စားပြုနေတာပါ၊ ဒါကြောင့် amount column ဘေးမှာ
      currency column အမြဲ ပါရပါမယ်။ [[mark:pt-err]] ဒေါ်လာ ၁၂ ဒသမ သုံးလေးငါး ကိုတော့ parser က
      error နဲ့ ငြင်းပါတယ်။ ဆင့်အောက်က အပိုင်းကို တိတ်တိတ်လေး ဖြတ်ပစ်မယ့်အစား၊ ဘယ်လို round
      လုပ်မလဲ ဆိုတာကို ခေါ်တဲ့ဘက်က ဆုံးဖြတ်ခိုင်းတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Precision handling (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#precision-handling",
        }
      - {
          title: "SIX (ISO 4217 Maintenance Agency) — List One",
          url: "https://www.six-group.com/dam/download/financial-information/data-center/iso-currrency/lists/list-one.xml",
        }
    actions:
      - { id: close-unit, type: slide.close, at: { mark: close-unit } }
      - id: sel-table
        type: editor.select
        at: { mark: sel-table }
        target:
          {
            file: main.go,
            text: "\t\"USD\": 2, \"EUR\": 2, \"JPY\": 0, \"BHD\": 3,\n\t\"BTC\": 8, \"USDC\": 6, \"ETH\": 18,",
            occurrence: 1,
          }
      - id: sel-show
        type: editor.select
        at: { mark: sel-show }
        target: { file: main.go, text: "func show(s, cur string) {", occurrence: 1 }
      - id: type-three
        type: editor.type
        at: { mark: type-three }
        target: { file: main.go, after: "\tshow(\"12.34\", \"USD\")\n", occurrence: 1 }
        text: "\tshow(\"1234\", \"JPY\")\n\tshow(\"1.234\", \"BHD\")\n\tshow(\"12.345\", \"USD\")\n"
        cadence: line-by-line
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "1.234 BHD → 1234",
          timeoutMs: 8000,
        }
      - id: pt-jpy
        type: console.point
        at: { mark: pt-jpy }
        target: { text: "1234 JPY", occurrence: 1 }
      - id: pt-bhd
        type: console.point
        at: { mark: pt-bhd }
        target: { text: "1.234 BHD", occurrence: 1 }
      - id: pt-err
        type: console.point
        at: { mark: pt-err }
        target: { text: "12.345 USD", occurrence: 1 }

  - id: parser
    narration: >-
      [[mark:open-cur]] parser ကို ကြည့်ရအောင်။ [[mark:sel-parse]] string ကို ဒသမ အမှတ်မှာ နှစ်ပိုင်း
      ခွဲပြီး၊ နောက်ပိုင်းက currency ရဲ့ ဒသမ အရေအတွက်ထက် ရှည်ရင် ငြင်းပါတယ်။ တိုရင် သုည ဖြည့်ပြီး
      digit တစ်လုံးချင်းကို ကိန်းပြည့်ထဲ ပေါင်းထည့်ပါတယ်။ [[mark:sel-loop]] ဒီ အဆင့်တွေထဲမှာ float
      တစ်ခါမှ မပါပါဘူး။ string ကို float အဖြစ် အရင် parse လုပ်ပြီးမှ တစ်ရာနဲ့ မြှောက်ရင် အရင် lesson က
      ပြဿနာတွေ အကုန် ပြန်ရောက်လာပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Precision handling (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#precision-handling",
        }
      - { title: "Go standard library — strings.Cut", url: "https://pkg.go.dev/strings#Cut" }
    actions:
      - { id: open-cur, type: workspace.openFile, at: { mark: open-cur }, path: currency.go }
      - id: sel-parse
        type: editor.select
        at: { mark: sel-parse }
        target:
          {
            file: currency.go,
            text: "\twhole, frac, _ := strings.Cut(s, \".\")\n\tif len(frac) > exp {",
            occurrence: 1,
          }
      - id: sel-loop
        type: editor.select
        at: { mark: sel-loop }
        target: { file: currency.go, text: "\t\tn = n*10 + int64(c-'0')", occurrence: 1 }

  - id: iso
    chapter: ဒသမ ဘယ်နှလုံးလဲ
    narration: >-
      [[mark:show-iso]] ဒေါ်လာ၊ ယူရို၊ ကျပ်ငွေ တို့မှာ ဒသမ နှစ်လုံး ရှိလို့ နှစ်လုံးကို default လို့
      ထင်မိတတ်ပါတယ်။ [[mark:iso-2]] ယန်း၊ ကိုရီးယား ဝမ်၊ ဗီယက်နမ် ဒေါင် တို့မှာတော့ ဒသမ မရှိပါဘူး။
      [[mark:pt-bug]] code ထဲမှာ ဒသမ နှစ်လုံးလို့ hard-code လုပ်ထားရင် ယန်း ၁၂၃၄ ကို ယန်း ၁၂၃၄၀၀ လို့
      parse လုပ်ပြီး၊ အဆ တစ်ရာ ပိုကောက်ပါလိမ့်မယ်။ [[mark:iso-3]] BHD၊ KWD၊ OMR တို့မှာ ဒသမ
      သုံးလုံး ရှိပါတယ်။ ဒီ table ကို code ထဲ ပြန့်ကျဲ မထားဘဲ နေရာ တစ်ခုတည်းမှာ ထိန်းထားရတာ
      ဒါကြောင့်ပါ။ [[mark:iso-4]] crypto မှာလည်း အသေးဆုံး unit နဲ့ ရေတွက်တဲ့ နည်း အတူတူပါပဲ၊
      ဒါပေမဲ့ ဒသမ အရေအတွက်ကို ISO က မသတ်မှတ်ပါဘူး။ bitcoin က satoshi နဲ့ ဒသမ ရှစ်လုံး၊ ether
      က wei နဲ့ ဒသမ ဆယ့်ရှစ်လုံး၊ USDC က ခြောက်လုံး ရှိပြီး၊ asset ကိုယ်တိုင်က သတ်မှတ်ပါတယ်။
      [[mark:pt-read]] Ethereum ရဲ့ token စံမှာ decimals ဆိုတာ မဖြစ်မနေ ပါရမယ့် function တောင်
      မဟုတ်ပါဘူး။ ဒါကြောင့် token တစ်ခုချင်းရဲ့ decimals ကို ကိုယ့်ဘာသာ ယူဆမထားဘဲ contract ကနေ
      ဖတ်ရပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Precision handling (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#precision-handling",
        }
      - {
          title: "SIX (ISO 4217 Maintenance Agency) — List One",
          url: "https://www.six-group.com/dam/download/financial-information/data-center/iso-currrency/lists/list-one.xml",
        }
      - { title: "EIP-20: Token Standard", url: "https://eips.ethereum.org/EIPS/eip-20" }
    actions:
      - { id: show-iso, type: slide.show, at: { mark: show-iso, offsetMs: -700 }, slideId: iso-1 }
      - {
          id: pt-r1,
          type: slide.point,
          at: { afterAction: show-iso },
          target: { x: 0.134, y: 0.356 },
        }
      - { id: iso-2, type: slide.show, at: { mark: iso-2 }, slideId: iso-2 }
      - { id: pt-r2, type: slide.point, at: { afterAction: iso-2 }, target: { x: 0.134, y: 0.438 } }
      - { id: pt-bug, type: slide.point, at: { mark: pt-bug }, target: { x: 0.819, y: 0.536 } }
      - { id: iso-3, type: slide.show, at: { mark: iso-3 }, slideId: iso-3 }
      - { id: pt-r3, type: slide.point, at: { afterAction: iso-3 }, target: { x: 0.134, y: 0.52 } }
      - { id: iso-4, type: slide.show, at: { mark: iso-4 }, slideId: iso-4 }
      - { id: pt-r4, type: slide.point, at: { afterAction: iso-4 }, target: { x: 0.134, y: 0.602 } }
      - { id: pt-read, type: slide.point, at: { mark: pt-read }, target: { x: 0.819, y: 0.853 } }

  - id: overflow
    chapter: ကိန်းပြည့်လည်း ပြည့်တတ်တယ်
    narration: >-
      [[mark:close-iso]] table ထဲမှာ bitcoin နဲ့ ether ပါပြီးသား ဖြစ်လို့ crypto ကို စမ်းကြည့်ရအောင်။
      [[mark:open-main2]] bitcoin protocol ခွင့်ပြုတဲ့ အများဆုံး ပမာဏ ဖြစ်တဲ့ နှစ်ဆယ့်တစ်သန်းနဲ့ ether
      ဆယ်ခုကို ခုနက parser နဲ့ပဲ ပြောင်းပါမယ်။ [[mark:type-crypto]] fiat အတွက် မှန်ခဲ့တဲ့ code ပဲ
      ဖြစ်ပါတယ်။ ether ဆယ်ခုအတွက် ဘာထွက်မလဲ run မလုပ်ခင် ခန့်မှန်းကြည့်ပါ။ error တက်မလား၊
      အမှန် ထွက်မလား။ [[mark:run-2]] run လိုက်ရအောင်။ [[mark:pt-btc]] bitcoin က satoshi နဲ့
      ပြောင်းလည်း မှန်ပါတယ်။ [[mark:pt-eth]] ether ဆယ်ခုကတော့ အနုတ် ဂဏန်း ဖြစ်သွားပြီး၊ ပြန်ပြတော့
      ether အနုတ် ရှစ် ဒသမ လေးလေး ဖြစ်နေပါတယ်။ error မတက်၊ panic မဖြစ်ဘဲ ၆၄ bit ကိန်းပြည့်က
      ပြည့်သွားပြီး အနုတ်ဘက် ပတ်သွားတာပါ။ [[mark:dock-2]] fiat မှာ မှန်ကန်တဲ့ parser တစ်ခုက crypto
      မှာ တိတ်တိတ်လေး မှားနေတာ ဖြစ်ပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Precision handling (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#precision-handling",
        }
      - {
          title: "Bitcoin Core — src/consensus/amount.h (COIN, MAX_MONEY)",
          url: "https://raw.githubusercontent.com/bitcoin/bitcoin/master/src/consensus/amount.h",
        }
      - {
          title: "The Go Programming Language Specification — Integer overflow",
          url: "https://go.dev/ref/spec#Integer_overflow",
        }
    actions:
      - { id: close-iso, type: slide.close, at: { mark: close-iso } }
      - { id: open-main2, type: workspace.openFile, at: { mark: open-main2 }, path: main.go }
      - id: type-crypto
        type: editor.type
        at: { mark: type-crypto }
        target: { file: main.go, after: "\tshow(\"12.345\", \"USD\")\n", occurrence: 1 }
        text: "\n\tshow(\"21000000\", \"BTC\")\n\tshow(\"10\", \"ETH\")\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "10 ETH → -8446744073709551616",
          timeoutMs: 8000,
        }
      - id: pt-btc
        type: console.point
        at: { mark: pt-btc }
        target: { text: "21000000 BTC", occurrence: 1 }
      - id: pt-eth
        type: console.point
        at: { mark: pt-eth }
        target: { text: "10 ETH →", occurrence: 1 }
      - { id: dock-2, type: runtime.collapseDock, at: { mark: dock-2 } }

  - id: width
    narration: >-
      [[mark:show-width]] အကြောင်းရင်းက အရွယ်အစားပါ။ ၆၄ bit ကိန်းပြည့်ရဲ့ အများဆုံး တန်ဖိုးမှာ ဂဏန်း
      ဆယ့်ကိုးလုံး ရှိပါတယ်။ [[mark:width-2]] bitcoin အားလုံးကို satoshi နဲ့ ရေတွက်ရင် ဂဏန်း
      ဆယ့်ခြောက်လုံးပဲ ရှိလို့ အလွယ်တကူ ဆံ့ပါတယ်။ float အတိအကျ မှတ်နိုင်တဲ့ နှစ်ရဲ့ ၅၃ ထပ်အောက်မှာတောင်
      ရှိပါတယ်။ [[mark:width-3]] ether ကတော့ တစ်ခုတည်းမှာတင် wei နဲ့ဆို သုည ဆယ့်ရှစ်လုံး ပါလို့၊ ၆၄ bit
      ကိန်းပြည့်ထဲ ether ကိုး ဒသမ နှစ်နှစ် လောက်ပဲ ဆံ့ပါတယ်။ [[mark:pt-eths]] crypto ပမာဏအတွက်
      အရွယ်အစား ကန့်သတ်ချက် မရှိတဲ့ ကိန်းပြည့် လိုတာ ဒါကြောင့်ပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Precision handling (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#precision-handling",
