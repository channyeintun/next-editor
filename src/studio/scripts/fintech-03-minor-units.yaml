      currency.go: |
        package main

        import (
        	"fmt"
        	"math/big"
        	"strings"
        )

        // parseMinor reads a decimal string such as "12.34" into minor units without using a float.
        func parseMinor(s string, exp int) (int64, error) {
        	whole, frac, _ := strings.Cut(s, ".")
        	if len(frac) > exp {
        		return 0, fmt.Errorf("%q has more than %d decimal places", s, exp)
        	}
        	frac += strings.Repeat("0", exp-len(frac))
        	var n int64
        	for _, c := range whole + frac {
        		if c < '0' || c > '9' {
        			return 0, fmt.Errorf("%q is not a decimal number", s)
        		}
        		n = n*10 + int64(c-'0')
        	}
        	return n, nil
        }

        // parseBig is parseMinor with an integer of any width.
        func parseBig(s string, exp int) (*big.Int, error) {
        	whole, frac, _ := strings.Cut(s, ".")
        	if len(frac) > exp {
        		return nil, fmt.Errorf("%q has more than %d decimal places", s, exp)
        	}
        	n, ok := new(big.Int).SetString(whole+frac+strings.Repeat("0", exp-len(frac)), 10)
        	if !ok {
        		return nil, fmt.Errorf("%q is not a decimal number", s)
        	}
        	return n, nil
        }

        // format prints minor units with exp decimal places: format(1234, 2) is "12.34".
        func format(minor int64, exp int) string {
        	sign := ""
        	if minor < 0 {
        		sign, minor = "-", -minor
        	}
        	digits := fmt.Sprintf("%0*d", exp+1, minor)
        	if exp == 0 {
        		return sign + digits
        	}
        	return sign + digits[:len(digits)-exp] + "." + digits[len(digits)-exp:]
        }
      main.go: |
        package main

        import "fmt"

        // exponent is the number of decimal places of every asset this system accepts.
        // Fiat: the minor units of ISO 4217. Crypto: whatever the token itself defines.
        var exponent = map[string]int{
        	"USD": 2, "EUR": 2, "JPY": 0, "BHD": 3,
        	"BTC": 8, "USDC": 6, "ETH": 18,
        }

        // show parses s as an amount of cur, prints the integer it is stored as,
        // then formats that integer back for display.
        func show(s, cur string) {
        	exp, ok := exponent[cur]
        	if !ok {
        		fmt.Println(s, cur, "→ error: unknown currency")
        		return
        	}
        	n, err := parseMinor(s, exp)
        	if err != nil {
        		fmt.Println(s, cur, "→ error:", err)
        		return
        	}
        	fmt.Println(s, cur, "→", n, "→", format(n, exp))
        }

        func main() {
        	show("12.34", "USD")
        }
