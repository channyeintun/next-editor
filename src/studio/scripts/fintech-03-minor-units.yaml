      - { title: "EIP-20: Token Standard", url: "https://eips.ethereum.org/EIPS/eip-20" }
      - {
          title: "Bitcoin Core — src/consensus/amount.h (COIN, MAX_MONEY)",
          url: "https://raw.githubusercontent.com/bitcoin/bitcoin/master/src/consensus/amount.h",
        }
    actions:
      - {
          id: show-width,
          type: slide.show,
          at: { mark: show-width, offsetMs: -700 },
          slideId: width-1,
        }
      - {
          id: pt-max,
          type: slide.point,
          at: { afterAction: show-width },
          target: { x: 0.411, y: 0.38 },
        }
      - { id: width-2, type: slide.show, at: { mark: width-2 }, slideId: width-2 }
      - {
          id: pt-wbtc,
          type: slide.point,
          at: { afterAction: width-2 },
          target: { x: 0.501, y: 0.569 },
        }
      - { id: width-3, type: slide.show, at: { mark: width-3 }, slideId: width-3 }
      - {
          id: pt-weth,
          type: slide.point,
          at: { afterAction: width-3 },
          target: { x: 0.388, y: 0.758 },
        }
      - { id: pt-eths, type: slide.point, at: { mark: pt-eths }, target: { x: 0.313, y: 0.853 } }

  - id: bigint
    narration: >-
      [[mark:close-width]] Go မှာ ဒီအတွက် big package ရှိပါတယ်။ [[mark:type-big]] logic အတူတူပဲ၊
      ကိန်းပြည့် type ကိုပဲ big integer ပြောင်းထားတဲ့ parser နဲ့ ether ဆယ်ခုကို ထပ်ပြောင်းပါမယ်။ ဒီ
      parser ကလည်း string ကနေ တိုက်ရိုက် ပြောင်းတာ ဖြစ်လို့ float ဘယ်နေရာမှာမှ မပါပါဘူး။
      [[mark:run-3]] run လိုက်ရအောင်။ [[mark:pt-big]] ဒီတစ်ခါ တစ် နောက်မှာ သုည ဆယ့်ကိုးလုံး ပါတဲ့
      အတိအကျ တန်ဖိုး ထွက်ပါတယ်။ big integer က memory ပိုသုံးပြီး ပိုနှေးပါတယ်။ ဒါကြောင့် fiat ကို ၆၄ bit နဲ့ပဲ ထားပြီး၊
      ဒီလောက် ကြီးတဲ့ crypto ပမာဏအတွက်ပဲ width အကန့်အသတ် မရှိတဲ့ type ကို သုံးတာ သဘာဝကျပါတယ်။
      [[mark:dock-3]] ဒသမ မှားတာရော overflow ရော ငွေပမာဏကို အသိမပေးဘဲ ပြောင်းပစ်လို့ No lost
      data ကို ချိုးပါတယ်။ အရင် lesson မှာ ပြောခဲ့သလို ဒါက သိမ်းတဲ့ ပုံစံအတွက် ဆုံးဖြတ်ချက်ပဲ ဖြစ်ပြီး၊ တွက်တဲ့အခါ သုံးမယ့် type က
      သီးခြား ဆုံးဖြတ်ချက်ပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Precision handling (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#precision-handling",
        }
      - { title: "Go standard library — math/big", url: "https://pkg.go.dev/math/big" }
    actions:
      - { id: close-width, type: slide.close, at: { mark: close-width } }
      - id: type-big
        type: editor.type
        at: { mark: type-big }
        target: { file: main.go, after: "\tshow(\"10\", \"ETH\")\n", occurrence: 1 }
        text: "\n\tif wei, err := parseBig(\"10\", exponent[\"ETH\"]); err == nil {\n\t\tfmt.Println(\"10 ETH → big.Int\", wei)\n\t}\n"
        cadence: line-by-line
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "10 ETH → big.Int 10000000000000000000",
          timeoutMs: 8000,
        }
      - id: pt-big
        type: console.point
        at: { mark: pt-big }
        target: { text: "big.Int", occurrence: 1 }
      - {
          id: expect-file-big,
          type: expect.file,
          at: { afterAction: run-3 },
          path: main.go,
          contains: 'parseBig("10", exponent["ETH"])',
        }
      - { id: dock-3, type: runtime.collapseDock, at: { mark: dock-3 } }

  - id: gap
    chapter: ISO နဲ့ provider ကွာတဲ့ နေရာ
    narration: >-
      [[mark:show-gap]] ဒီနေရာမှာ စိတ်ဝင်စားစရာ ဖြစ်လာပါတယ်။ exponent ကို ISO ကနေ ယူရုံနဲ့ မပြီးပါဘူး၊
      provider API တစ်ခုချင်းမှာ ကိုယ်ပိုင် စည်းမျဉ်း ရှိပါတယ်။ [[mark:pt-usd]] Stripe ရဲ့ amount က
      currency ရဲ့ အသေးဆုံး unit နဲ့ ရေတွက်တဲ့ ကိန်းပြည့်ပါ၊ ဒေါ်လာ ငါးဆိုရင် ငါးရာ ပို့ရပါတယ်။
      [[mark:gap-2]] ယန်းက ဒသမ မရှိတဲ့ currency ဖြစ်လို့ ယန်း ငါးဆိုရင် ငါးပဲ ပို့ပါတယ်။ ဒီအထိ ISO နဲ့
      ကိုက်ပါတယ်။ [[mark:gap-3]] ဒါပေမဲ့ ISK နဲ့ UGX ကို ISO က ဒသမ မရှိဘူးလို့ သတ်မှတ်ထားပေမဲ့၊ Stripe
      က backward compatibility အတွက် သုည နှစ်လုံးနဲ့ ဆုံးတဲ့ ဒသမ နှစ်လုံး တန်ဖိုး ပို့ခိုင်းပါတယ်။
      [[mark:pt-isk]] ISK ငါးဆိုရင် ငါးရာ ပို့ရတာပါ။ ISO table တစ်ခုတည်းကို ကြည့်ပြီး ပို့ရင် Stripe
      မျှော်လင့်တဲ့ ပမာဏနဲ့ အဆ တစ်ရာ ကွာသွားပါမယ်။ [[mark:gap-4]] ဒါကြောင့် ledger ထဲမှာ ISO exponent
      နဲ့ ပုံစံ တစ်မျိုးတည်း သိမ်းပြီး၊ provider ဆီ ပို့တဲ့ boundary မှာ provider တစ်ခုချင်းရဲ့ စည်းမျဉ်းနဲ့
      ပြောင်းရပါတယ်။ [[mark:pt-arrow]] အဲဒီ ပြောင်းတဲ့ code ကို provider တစ်ခုစီ၊ currency တစ်ခုစီအတွက်
      test လုပ်ထားရပါမယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Currency handling (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#currency-handling",
        }
      - { title: "Stripe — Supported currencies", url: "https://docs.stripe.com/currencies" }
      - {
