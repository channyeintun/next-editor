  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] Fintech interview တွေမှာ amount ကို database မှာ ဘယ်လို သိမ်းမလဲ လို့
      မေးလေ့ရှိပါတယ်။ ကိန်းပြည့်နဲ့ သိမ်းမယ် လို့ပဲ ဖြေရင် မလုံလောက်ပါဘူး။ [[mark:iv-a]] ပထမ၊ minor
      unit ကိန်းပြည့်နဲ့ သိမ်းပြီး ဘေးမှာ currency column အမြဲ ထားမယ်၊ ပေါင်းတာနဲ့ ညီသလား စစ်တာ
      အတိအကျ ဖြစ်အောင်ပါ။ [[mark:iv-b]] ဒုတိယ၊ ဒသမ အရေအတွက်ကို currency ကနေ ယူမယ်၊ fiat ဆိုရင် ISO
      ကနေ၊ crypto ဆိုရင် token ကိုယ်တိုင်ကနေ ယူပြီး၊ provider ဆီ ပို့တဲ့အခါ boundary မှာ ပြောင်းမယ်။
      [[mark:iv-c]] တတိယ၊ width ကို asset ကြည့်ပြီး ရွေးမယ်၊ fiat အတွက် ၆၄ bit လုံလောက်ပေမဲ့ wei
      အတွက် မလုံလောက်ပါဘူး။ [[mark:iv-d]] ပြီးရင် ကိုယ် ဘယ်လို လုပ်မလဲ ပြောပါ။ string ကနေ
      ကိန်းပြည့်ကို float မပါဘဲ တိုက်ရိုက် parse လုပ်မယ်၊ ဒသမ အပိုနဲ့ overflow ကို round မလုပ်ဘဲ error
      ပေးမယ် ဆိုတာပါ။
    sources:
