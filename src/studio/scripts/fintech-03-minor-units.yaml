    chapter: ကိုယ်တိုင် စမ်းကြည့်ပါ
    narration: >-
      [[mark:close-iv]] ကိုယ်တိုင် စမ်းကြည့်ဖို့ တစ်ခု ရှိပါတယ်။ main ထဲမှာ KWD သုည ဒသမ ငါး ကို
      show နဲ့ အရင် ခေါ်ကြည့်ပါ။ table ထဲ မရှိလို့ unknown currency error ရပါမယ်။ [[mark:sel-try]]
      ပြီးရင် ဒီ table ထဲကို KWD ကို ဒသမ သုံးလုံးနဲ့ ထည့်ပြီး ထပ် run ပါ၊ ငါးရာ ထွက်ပါလိမ့်မယ်။ မသိတဲ့ currency
      ကို default တန်ဖိုး တစ်ခုနဲ့ ဆက်မတွက်ဘဲ ငြင်းတာက ဒီ lesson ရဲ့ အမှားမျိုးကို ကာကွယ်ပါတယ်။
      [[mark:recap]] ပြန်ချုပ်ရရင်၊ ငွေပမာဏဆိုတာ minor unit ကို ရေတွက်ထားတဲ့ ကိန်းပြည့်ပါ။ ဒသမ
      အရေအတွက်ကို currency ကနေ ယူပြီး၊ ကိန်းပြည့်ရဲ့ width ကို asset ကြည့်ပြီး ရွေးရပါတယ်။ နောက်
      lesson မှာတော့ ဒီလို ဂရုစိုက်ပြီး သိမ်းထားတဲ့ ပမာဏ JSON ထဲ ရောက်တဲ့အခါ ဘာဖြစ်သွားလဲ ကြည့်ပါမယ်။
