# Fintech Engineering, lesson 03: minor units, ISO 4217 and big integers (Burmese).
#
# Source: Fintech Engineering Handbook, "Precision handling" (minor units, crypto units),
# "Currency handling" (metadata) and Appendix A "Minor units" (CC BY 4.0, Voytek Pitula).
# Start state: main.go holds the exponent table and show(), which parses one USD amount;
# currency.go holds the kit's parseMinor and format, plus parseBig.
# Edits, all insert-only, in main.go:
#   1. JPY, BHD and a USD amount with three decimals   -> run-1: 1234 three times, one error
#   2. 21,000,000 BTC and 10 ETH through parseMinor    -> run-2: 10 ETH wraps to a negative number
#   3. 10 ETH through parseBig                          -> run-3: 10000000000000000000
# Figures: unit (12.34 EUR -> 1234), iso (decimals per asset), width (int64 as a ruler),
# gap (ISO decimals vs Stripe's amounts), iv (the interview answer).
# Built by ~/Documents/fintech-course-work/tools/build-lesson.ts; fixtures by sim-go.ts --write.
