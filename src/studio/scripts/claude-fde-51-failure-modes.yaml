scenes:
  - id: need
    chapter: ဒုတိယ ပတ်ကို ကြိုမြင်ကြည့်ခြင်း
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ champion ကို ရွေးပြီး၊ ကိုယ် ထွက်သွားလည်း deployment ဆက်ရှင်နေအောင် CLAUDE.md နဲ့ document
      တွေကို ထိန်းဖို့၊ handover ကို ရက်စွဲနဲ့ checklist ပါတဲ့ အလုပ်အဖြစ် ဆွဲဖို့ လေ့လာခဲ့ပါတယ်။
      [[mark:imagine]] ပထမ နေ့ မစခင် လေ့ကျင့်ခန်း တစ်ခု လုပ်ကြည့်ရအောင်။ ဒုတိယ ပတ် ရောက်နေပြီလို့ မြင်ယောင်ကြည့်ပါ။
      developer တွေက Claude Code ကို နေ့တိုင်း သုံးနေကြပြီး၊ session အရေအတွက်လည်း များပါတယ်။ channel ထဲမှာလည်း
      စကားတွေ စည်နေပါတယ်။ Claude Code ဆိုတာ terminal ထဲကနေ code ကို ဖတ်၊ ပြင်၊ command run ပေးတဲ့ coding agent ပါ။
      [[mark:nothing]] ဒါပေမဲ့ CTO ဖြစ်တဲ့ အောင်အောင် က သောကြာနေ့ ဂဏန်း ကြည့်တဲ့အခါ၊ output တိုက်စစ်ပြီးသား job
      အရေအတွက်က ထင်ထားသလောက် မတက်ပါဘူး။ သုံးတာ များပေမဲ့ တိုင်းလို့ရတဲ့ ရလဒ်က မပြောင်းသေးပါဘူး။ ဘာကြောင့်
      ဖြစ်နိုင်လဲ ဆိုတာကို အခုကတည်းက စဉ်းစားထားရင်၊ တကယ် မဖြစ်ခင် ကာကွယ်လို့ ရပါတယ်။
      [[mark:fm]] အဲဒီလို ပျက်တတ်တဲ့ ပုံစံကို failure mode လို့ ခေါ်ပါတယ်။ Anthropic ရဲ့ FDE learning path ဖော်ပြချက်က
      နည်းပညာ တပ်ဆင်တာက ပိုလွယ်တဲ့ အပိုင်းလို့ ဆိုပြီး၊ အဖြစ်များတဲ့ failure mode တွေကို ကြိုတင် ကာကွယ်ဖို့ကို သီးသန့်
      ခေါင်းစဉ် တစ်ခုအဖြစ် ထားပါတယ်။ ဒီနေ့ Delivery Plan Pack ရဲ့ နောက်ဆက်တွဲအဖြစ် risk register ကို ရေးပါမယ်။ risk register ဆိုတာ ဖြစ်လာနိုင်တဲ့ ပြဿနာ တစ်ခုချင်းစီနဲ့ အဲဒါအတွက် ဘာလုပ်မလဲ ဆိုတာကို ရေးထားတဲ့ စာရင်းပါ။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
    actions:
      - {
          id: open-risk,
          type: workspace.openFile,
          at: { scene: start },
          path: notebook/51-risk-register.md,
        }
      - id: sel-intro
        type: editor.select
        at: { mark: fm }
        target:
          file: notebook/51-risk-register.md
          text: "ရက် 30 activation ပျက်တတ်တဲ့ ပုံစံ၊ အစောဆုံး မြင်ရမယ့် လက္ခဏာ၊ အခုပဲ လုပ်မယ့်အရာ"

  - id: timeline
    chapter: ဘယ်အချိန်မှာ စပေါ်လဲ
    narration: >
      [[mark:f-title]] failure mode တွေက ရက် ၃၀ ရဲ့ အချိန် တစ်ခုခုမှာ စပေါ်ပါတယ်။ ဘယ်မှာ စပေါ်လဲ သိထားရင်၊ ဘယ်အချိန်
      ဘာကို စောင့်ကြည့်ရမလဲ သိပါတယ်။
      [[mark:f-line]] အချိန်ကို အပိုင်း လေးပိုင်း ခွဲကြည့်ပါမယ်။ ပထမ နေ့ မတိုင်ခင်၊ ပထမ နေ့၊ ပထမ နှစ်ပတ်နဲ့ နောက်ဆုံး
      နှစ်ပတ်ပါ။
      [[mark:f-before]] အများဆုံးက ပထမ နေ့ မတိုင်ခင်မှာ စပါတယ်။ ဘယ်သူမှ ငြင်းလို့ မရတဲ့ ဂဏန်း မပါဘဲ စိတ်ဝင်စားစရာ
      ကောင်းတာကို ရွေးမိတဲ့ wishlist use case၊ ပြီးတော့ မစခင်က ဂဏန်း မယူထားတဲ့ baseline မရှိတာပါ။ နှစ်ခုလုံးကို
      ကိုယ်တို့ ပြီးခဲ့တဲ့ lesson တွေမှာ ကာကွယ်ခဲ့ပြီးပါပြီ။
      [[mark:f-sec]] နောက်တစ်ခုက security ကို နောက်ဆုံးမှ မေးတာပါ။ ဒုတိယ ပတ်ရောက်မှ security တာဝန်ခံက customer data
      ဘယ်ကို ရောက်လဲ မေးလာရင်၊ အဖြေ မရမချင်း အလုပ် တစ်ခုလုံး ရပ်သွားနိုင်ပါတယ်။ အစောဆုံး လက္ခဏာက ပထမ နေ့ နီးလာပြီး
      security review အတွက် ရက်ချိန်း မရှိသေးတာပါ။
      [[mark:f-day1]] ပထမ နေ့မှာ စပေါ်တာက license ပေးပြီး ဘယ်သူမှ မသင်ပေးတာပါ။
      [[mark:f-setup]] Anthropic ရဲ့ administrator guide နဲ့
      Claude Code docs မှာ ပထမ နေ့ကို ပျက်စေနိုင်တဲ့ setup ပြဿနာတွေ ပါပါတယ်။ seat အမျိုးအစား တချို့မှာ Claude Code
      မပါတာ၊ API access ကနေ လာတဲ့သူတွေ SSO နဲ့ ပြန် login ဝင်ရတာ၊ developer ရဲ့ shell ထဲက environment variable
      တချို့ကြောင့် managed settings ကို ဘာ သတိပေးချက်မှ မပြဘဲ ကျော်သွားတာမျိုးတွေပါ။ managed settings ဆိုတာ admin က developer
      တိုင်းရဲ့ Claude Code ပေါ် တွန်းထည့်ထားတဲ့ setting တွေပါ။
      [[mark:f-habit]] login ဝင်ပြီးရင်လည်း ပြဿနာ ရှိပါသေးတယ်။ Anthropic ရဲ့ scaling guide အရ၊ မသင်ရသေးတဲ့သူတွေက
      အလုပ်ကြီး တစ်ခုလုံးကို တစ်ခါတည်း ခိုင်းတတ်ပြီး၊ ဘာကြောင့် မရလဲ ဆိုတာကို error အပြည့်အစုံ မပေးဘဲ မရဘူးလို့ပဲ
      ပြောတတ်ကြပါတယ်။ အလုပ်ကို အပိုင်းသေးသေး ခွဲပြီး အဆင့်တိုင်းမှာ စစ်ဖို့ကို သင်ပေးရပါမယ်။ champion kit ကလည်း တစ်ခါ စမ်းကြည့်တော့ AI က လုပ်ကြံ ရေးတယ်လို့ ပြောတဲ့သူတွေရဲ့ ပြဿနာက များသောအားဖြင့် context မလုံလောက်တာလို့ ဆိုပါတယ်။
      [[mark:f-budget]] ငွေကြေး ဘက်မှာလည်း ပထမ နေ့ ပြဿနာ တစ်ခု ရှိနိုင်ပါတယ်။ Claude Enterprise ရဲ့ သုံးစွဲမှု လမ်းညွှန်က အဖွဲ့အစည်း တစ်ခုလုံးအတွက် သုံးစွဲမှု ကန့်သတ်ချက် တစ်ခုတည်း ထားရင်၊ အဲဒါ ပြည့်သွားတဲ့နေ့မှာ လူတိုင်း တစ်ပြိုင်နက် ရပ်သွားတယ်လို့ သတိပေးပါတယ်။ group အလိုက်နဲ့ လူတစ်ယောက်ချင်း ကန့်သတ်ချက်နဲ့ စဖို့ပါ။
      [[mark:f-act]] ပထမ နှစ်ပတ်မှာ စပေါ်တာက activity ကိုပဲ ရေတွက်တာပါ။ session များတာ၊ channel စည်တာကို တိုးတက်မှုလို့
      ထင်မိတာပါ။ champion kit ကလည်း တစ်ခါ စမ်းကြည့်တာထက် ထပ်ခါထပ်ခါ ပြန်သုံးတာကို စောင့်ကြည့်ဖို့ ပြောထားပါတယ်။
      [[mark:f-champ]] နောက်ဆုံး နှစ်ပတ်မှာ စပေါ်တာက champion မရှိတာပါ။ စိတ်အားထက်သန်တဲ့သူ တစ်ယောက်ဆီကိုပဲ မေးခွန်းတိုင်း
      ရောက်နေရင်၊ အဲဒီလူ မအားတဲ့ ပတ်မှာ အားလုံး ရပ်သွားပါတယ်။ ဒါကို ပြီးခဲ့တဲ့ lesson က champion plan နဲ့ ကာကွယ်ထားပါတယ်။ လက္ခဏာက channel ထဲက မေးခွန်းတွေကို လူ တစ်ယောက်တည်းပဲ ဖြေနေတာပါ။
    sources:
      - {
          title: "Claude Enterprise Administrator Guide (Claude Academy)",
          url: "https://academy.claude.com/tutorials/claude-enterprise-administrator-guide",
