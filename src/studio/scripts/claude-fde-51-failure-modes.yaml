  - id: early
    chapter: လက္ခဏာနဲ့ အစောဆုံး လုပ်ရမယ့်အရာ
    narration: >
      [[mark:e-rule]] ဒီ failure တွေမှာ တူတဲ့ အချက် တစ်ခု ရှိပါတယ်။ ပျက်သွားတဲ့နေ့ ရုတ်တရက် ပေါ်လာတာ မဟုတ်ဘဲ၊
      အစောပိုင်းကတည်းက လက္ခဏာ တစ်ခု ပြနေတတ်ပါတယ်။ ပြီးတော့ အဲဒီ လက္ခဏာကို မြင်တဲ့အချိန်မှာ လုပ်ရမယ့်အရာက များသောအားဖြင့်
      သေးသေးလေးပါ။ စောင့်လေ ပြင်ရတာ ကြီးလေ ဖြစ်ပါတယ်။
      [[mark:e-point]] ဥပမာ security review ရက်ချိန်း မရှိတာကို ပထမ နေ့ မတိုင်ခင် မြင်ရင် အစည်းအဝေး တစ်ခု စီစဉ်ရုံပါပဲ။
      ဒုတိယ ပတ်ရောက်မှ မြင်ရင်တော့ developer ရှစ်ယောက်ရဲ့ အလုပ် ရပ်သွားနိုင်ပါတယ်။
      [[mark:e-base]] baseline လည်း အတူတူပါ။ ပထမ နေ့ မတိုင်ခင်ဆိုရင် job သုံးခုကို လက်နဲ့ ရွှေ့ကြည့်ရုံပါ။ ပထမ နေ့ ကျော်သွားရင်တော့ ဘယ်လောက် ကြိုးစားကြိုးစား အဲဒီ ဂဏန်းကို ပြန်ယူလို့ မရတော့ပါဘူး။
      [[mark:e-sign]] ဒါကြောင့် ဒီ စာရင်းကို ပြဿနာ ဖြစ်ပြီးမှ မဖတ်ဘဲ၊ အစမှာ ကြိုပြောထားရပါတယ်။ sponsor ဖြစ်တဲ့ CTO ကို
      ပထမ နေ့ မတိုင်ခင် ပြပြီး လက်မှတ် ထိုးခိုင်းပါမယ်။ sponsor ဆိုတာ engagement ကို ရန်ပုံငွေနဲ့ ဆုံးဖြတ်ချက်ဘက်က
      ကျောထောက်နောက်ခံ ပေးတဲ့သူပါ။ လက်မှတ် ထိုးထားတဲ့ စာရင်းထဲက လက္ခဏာ ပေါ်လာရင်၊ ဘယ်သူ့ကိုမှ အပြစ်တင်စရာ မလိုဘဲ
      သဘောတူထားတဲ့ အတိုင်း လုပ်ရုံပါပဲ။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
    actions:
      - {
          id: draw-f-rule,
          type: whiteboard.apply,
          at: { mark: e-rule },
          upsertIds: [f-rule],
          drawMs: 900,
        }
      - { id: point-f-r3, type: whiteboard.point, at: { mark: e-point }, target: { assetId: f-r3 } }
      - { id: point-f-r2, type: whiteboard.point, at: { mark: e-base }, target: { assetId: f-r2 } }

  - id: register
    chapter: Risk register
    narration: >
      [[mark:k-close]] ဒါကို risk register အဖြစ် ချရေးကြည့်ရအောင်။ wishlist နဲ့ champion နှစ်ကြောင်းကတော့ ပြီးခဲ့တဲ့
      lesson တွေကနေ ရေးထားပြီးသားပါ။
      [[mark:type-base]] ပထမ တစ်ကြောင်းက baseline ပါ။ အစောဆုံး လက္ခဏာက ပထမ နေ့ ရောက်လာပြီး လက်နဲ့ ရွှေ့ပြီး တိုင်းရမယ့် job
      သုံးခု မပြီးသေးတာပါ။ အဲဒီလိုဆိုရင် ပထမ နေ့ကို ရွှေ့ပြီး baseline ကို အရင် ယူပါမယ်။ ရက် နှစ်ရက် နောက်ကျတာက
      ယှဉ်စရာ မရှိတဲ့ ရလဒ်ထက် အများကြီး သက်သာပါတယ်။
      [[mark:type-lic]] ဒုတိယ တစ်ကြောင်းက license နဲ့ သင်တန်းပါ။ ပထမ နေ့ မတိုင်ခင် ရှစ်ယောက်လုံး login ဝင်ကြည့်ပြီး၊ status
      command ထဲမှာ Enterprise managed settings ပေါ်လား စစ်ပါမယ်။ cohort ထဲက တစ်ယောက်ချင်းစီနဲ့ တွဲလုပ်တာ တစ်ကြိမ်လည်း
      လုပ်ပါမယ်။
      [[mark:type-sec]] တတိယ တစ်ကြောင်းက security ပါ။ ဒီအပတ်ထဲမှာပဲ security တာဝန်ခံနဲ့ ထိုင်ပြီး၊ ဘယ် data ကို prompt
      ထဲ ထည့်ခွင့် ရှိလဲ သဘောတူပါမယ်။ customer data က prompt ထဲ ရောက်သွားတာကို pilot ရပ်ရမယ့် အခြေအနေအဖြစ် pilot design မှာ ရေးထားခဲ့တော့၊ အဲဒီ စည်းကမ်းကို မစခင် ရှင်းထားဖို့ ပိုအရေးကြီးပါတယ်။
      [[mark:type-act]] စတုတ္ထ တစ်ကြောင်းက activity ကိုပဲ ရေတွက်တာပါ။ session တွေ များပြီး စစ်ပြီးသား job မတက်တာက လက္ခဏာပါ။
      အဲဒီအတွက် သောကြာနေ့တိုင်း CTO ကို စစ်ပြီးသား job အရေအတွက်ကိုပဲ ပြပါမယ်။ session အရေအတွက်ကို ဘေးက မှတ်စု အဖြစ်ပဲ ထားပါမယ်။
      [[mark:type-sponsor]] အောက်ဆုံးမှာ sponsor ရဲ့ တာဝန်ကို ရေးပါတယ်။ ပထမ နေ့ မတိုင်ခင် လက်မှတ် ထိုးဖို့နဲ့၊ သောကြာနေ့တိုင်း
      ဆယ့်ငါးမိနစ် ဒီ register ကို ပြန်ကြည့်ဖို့ပါ။
    sources:
      - {
          title: "Claude Code docs: admin setup",
          url: "https://code.claude.com/docs/en/admin-setup",
        }
      - {
          title: "Claude Code docs: champion kit",
          url: "https://code.claude.com/docs/en/champion-kit",
        }
    actions:
      - { id: close-timeline, type: whiteboard.apply, at: { mark: k-close }, open: false }
      - id: type-base
        type: editor.type
        at: { mark: type-base }
        cadence: line-by-line
        target: { file: notebook/51-risk-register.md, after: "|---|---|---|---|\n" }
        text: "| baseline မရှိ | Day 1 ရောက်ပြီ၊ လက်နဲ့ job 3 ခု မတိုင်းရသေး | Day 1 ကို ရွှေ့၊ baseline အရင် ယူ | ကိုယ် |\n"
      - id: type-lic
        type: editor.type
        at: { mark: type-lic }
        cadence: line-by-line
        target: { file: notebook/51-risk-register.md, after: "baseline အရင် ယူ | ကိုယ် |\n" }
        text: "| license ပေး၊ မသင် | Day 1 မှာ login မရ၊ seat မှာ Claude Code မပါ | 8 ယောက်လုံး login + /status စစ်၊ တွဲလုပ် 1 ကြိမ် | admin + ကိုယ် |\n"
      - id: type-sec
        type: editor.type
        at: { mark: type-sec }
        cadence: line-by-line
        target: { file: notebook/51-risk-register.md, after: "တွဲလုပ် 1 ကြိမ် | admin + ကိုယ် |\n" }
        text: "| security နောက်ဆုံးမှ | Day 1 နီးပြီ၊ security review ရက် မရှိ | ဒီအပတ် prompt ထဲ ထည့်ခွင့်ရှိတဲ့ data သဘောတူ | security တာဝန်ခံ |\n"
      - id: type-act
        type: editor.type
        at: { mark: type-act }
        cadence: line-by-line
        target: { file: notebook/51-risk-register.md, after: "data သဘောတူ | security တာဝန်ခံ |\n" }
        text: "| activity ကိုပဲ ရေတွက် | session များ၊ စစ်ပြီးသား job မတက် | သောကြာတိုင်း စစ်ပြီးသား job ကိုပဲ ပြ | ကိုယ် |\n"
      - id: type-sponsor
        type: editor.type
        at: { mark: type-sponsor }
        cadence: line-by-line
        target: { file: notebook/51-risk-register.md, after: "## Sponsor\n" }
        text: "- CTO အောင်အောင်: Day 1 မတိုင်ခင် ဖတ်ပြီး လက်မှတ်ထိုး၊ သောကြာတိုင်း 15 မိနစ် ပြန်ကြည့်\n"
      - id: expect-act
        type: expect.file
        at: { afterAction: type-sponsor }
        path: notebook/51-risk-register.md
        contains: "| activity ကိုပဲ ရေတွက် | session များ၊ စစ်ပြီးသား job မတက် | သောကြာတိုင်း စစ်ပြီးသား job ကိုပဲ ပြ | ကိုယ် |\n"

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ ဒုတိယ ပတ်မှာ report job ရွှေ့တာ ရည်မှန်းချက်ထက် နည်းနည်း နောက်ကျနေတယ် ဆိုပါစို့။
      job ရွှေ့နေတဲ့ developer နှစ်ယောက်က အခက်ဆုံး job တွေကို ကိုယ့်ကို ရွှေ့ပေးဖို့ တောင်းဆိုလာပါတယ်။ ဘာလုပ်သင့်လဲ။
      [[mark:q-a]] ပထမ တစ်ခုက ကိုယ်တိုင် ရွှေ့ပေးလိုက်တာပါ။ ရက် ၃၀ ပြည့်တဲ့နေ့မှာ ဂဏန်းက ပိုကောင်းနေပါလိမ့်မယ်။
      [[mark:q-b]] ဒုတိယ တစ်ခုက ခက်တဲ့ job တစ်ခုကို သူတို့နဲ့ တွဲလုပ်ပြပြီး၊ ကျန်တာကို သူတို့ကိုယ်တိုင် ရွှေ့ခိုင်းတာပါ။
      lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ တစ်ခုပါ။ ဘာကြောင့်လဲဆိုတော့ ဒါရိုက်တာ အဖွဲ့ ဖတ်မယ့် ဂဏန်းက developer နှစ်ယောက်
      Claude Code နဲ့ ဘာလုပ်နိုင်လဲ ဆိုတာကို ပြရမှာပါ။ ကိုယ် ရွှေ့ပေးလိုက်တဲ့ job တွေက ဂဏန်းကို လှအောင် လုပ်ပေမဲ့၊ ကိုယ်
      ထွက်သွားတဲ့နေ့မှာ ပျောက်သွားမယ့် စွမ်းရည်ပါ။ ဒါကလည်း failure mode တစ်ခုပါ။ FDE ကိုယ်တိုင် အလုပ်ကို ယူလုပ်မိတာပါ။
      [[mark:q-rule]] ဒါကြောင့် ကူညီတိုင်း မေးကြည့်ပါ။ ဒီ ဂဏန်းက team ရဲ့ ဂဏန်း ဟုတ်ရဲ့လား၊ ကိုယ် မရှိတော့ရင်လည်း ဒီလို
      ဆက်လုပ်နိုင်မလား ဆိုတာပါ။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
      - {
          title: "Claude Code docs: champion kit",
          url: "https://code.claude.com/docs/en/champion-kit",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: q-rule, offsetMs: 2500 },
          upsertIds: [q-t1, q-t2],
          drawMs: 1600,
        }

  - id: your-turn
    chapter: ကိုယ့် အဖွဲ့အစည်းမှာ
    narration: >
      [[mark:turn]] အဲဒီ failure ကိုလည်း register ထဲ နောက်ဆုံး တစ်ကြောင်းအဖြစ် ထည့်ပါမယ်။ အစောဆုံး လက္ခဏာက ခက်တဲ့ job
      တွေ ကိုယ့်ဆီ ရောက်လာတာ ဖြစ်ပြီး၊ လုပ်ရမှာက တွဲလုပ်ပြပြီး ပြန်ပေးတာပါ။
      [[mark:turn-2]] အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ကိုယ့် အဖွဲ့အစည်းမှာ ဖြစ်နိုင်ခြေ အများဆုံး failure နှစ်ခုကို
      ဒီ table ထဲက ရွေးကြည့်ပါ။ တစ်ခုချင်းစီအတွက် ကိုယ့်ဆီမှာ ဘယ်လို လက္ခဏာနဲ့ စပေါ်မလဲ၊ ဒီအပတ်ထဲ ဘာလုပ်လို့ ရမလဲ ဆိုတာကို
      ကိုယ့်စကားနဲ့ ပြန်ရေးပါ။ တာဝန်ခံ ကော်လံမှာ နာမည် အမှန်ကို ရေးနိုင်ရင် ပိုကောင်းပါတယ်။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: turn }, open: false }
      - id: type-fde
        type: editor.type
        at: { mark: turn, offsetMs: 1200 }
        cadence: line-by-line
        target: { file: notebook/51-risk-register.md, after: "စစ်ပြီးသား job ကိုပဲ ပြ | ကိုယ် |\n" }
        text: "| FDE ကိုယ်တိုင် အလုပ်ယူ | ခက်တဲ့ job တွေ ကိုယ့်ဆီ ရောက်လာ | တွဲလုပ်ပြပြီး ပြန်ပေး၊ ကိုယ် မရွှေ့ | ကိုယ် |\n"
      - id: sel-table
        type: editor.select
        at: { mark: turn-2 }
        target:
          file: notebook/51-risk-register.md
          text: "| Failure | အစောဆုံး လက္ခဏာ | အခု လုပ်မယ့်အရာ | တာဝန်ခံ |"

  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ engagement တစ်ခု ပျက်တာက နည်းပညာကြောင့် ထက် လူနဲ့ အစီအစဉ်ကြောင့် များပါတယ်။
      failure mode တစ်ခုချင်းစီမှာ အစောဆုံး လက္ခဏာ တစ်ခုနဲ့ စောစော လုပ်ရင် သေးသေးလေးပဲ ကုန်တဲ့ အလုပ် တစ်ခု ရှိပါတယ်။
      [[mark:recap-2]] အဲဒါတွေကို အစမှာ စာရင်း တစ်ခုအဖြစ် ချရေးပြီး sponsor ကို လက်မှတ် ထိုးခိုင်းထားရင်၊ လက္ခဏာ ပေါ်လာတဲ့
      နေ့မှာ ငြင်းခုံစရာ မလိုဘဲ လုပ်ရမှာကို လုပ်ရုံပါပဲ။
      [[mark:next]] နောက် lesson မှာတော့ Delivery Plan Pack တစ်ခုလုံးကို calendar တစ်ခုတည်းပေါ် တင်ပြီး၊ kick off မတိုင်ခင်ကနေ
      handover အထိ ရက် ၃၀ activation ကို အပတ်လိုက် ချရေးတာကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
    actions:
      - id: sel-fde
        type: editor.select
        at: { mark: recap }
        target:
          file: notebook/51-risk-register.md
          text: "| FDE ကိုယ်တိုင် အလုပ်ယူ |"
      - id: sel-sponsor
        type: editor.select
        at: { mark: recap-2 }
        target:
          file: notebook/51-risk-register.md
          text: "- CTO အောင်အောင်: Day 1 မတိုင်ခင် ဖတ်ပြီး လက်မှတ်ထိုး"

checks:
  - { type: timing.p95Ms, max: 300 }
