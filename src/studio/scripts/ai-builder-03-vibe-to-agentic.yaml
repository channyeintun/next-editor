      ပါပါတယ်။ ပြောင်းသွားတာက AI ပတ်လည်က စာတမ်း၊ rule နဲ့ စစ်ဆေးမှုတွေပါ။ ဘယ်နေရာကို ရွေးမလဲ ဆိုတာကိုတော့ risk နဲ့
