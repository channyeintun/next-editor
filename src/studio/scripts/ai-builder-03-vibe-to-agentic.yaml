build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 6103
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}
scenes:
  - id: recall
    chapter: Vibe coding ဆိုတာ ဘာလဲ
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ agent တစ်ခုက ပန်းတိုင် တစ်ခုအတွက် loop ပတ်ပြီး အလုပ်လုပ်တယ် ဆိုတာနဲ့၊ ထွက်လာတဲ့ အဖြေက
      သေချာသလို ပုံပေါ်ပေမယ့် မှားနိုင်တယ် ဆိုတာကို မြင်ခဲ့ပါတယ်။ ဒါဆို agent ကို ခိုင်းတဲ့ အလုပ်တိုင်းမှာ
      စစ်ဆေးမှုတွေ အများကြီး ထားရမလား။ [[mark:r-tasks]] ကိုယ့်ရှေ့မှာ agent နဲ့ လုပ်စရာ အလုပ် လေးခု ရှိပါတယ်။
      ဆိုင်ရဲ့ မွေးနေ့ပွဲအတွက် poster ထုတ်ပေးမယ့် page၊ မနေ့က အော်ဒါတွေကို ရေတွက်ပေးမယ့် script၊ တကယ့် customer
      တွေ မှာမယ့် ကြိုမှာ app၊ နောက်ပိုင်း တစ်နေ့ ထည့်ချင်တဲ့ online ငွေချေတဲ့ အဆင့် ဆိုပြီး ဖြစ်ပါတယ်။ script
      ဆိုတာ အလုပ် တစ်ခုတည်းကို လုပ်ပေးတဲ့ program သေးသေးလေးပါ။ [[mark:open-notes]] ဒီ လေးခုကို ပုံစံ
      တစ်မျိုးတည်းနဲ့ ဆောက်သင့်လား ဆိုတာကို ဒီနေ့ ဆုံးဖြတ်ပြီး၊ ဆုံးဖြတ်ချက်ကို editor ထဲက notes ဖိုင်မှာ
      ရေးသွားပါမယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The vibe coding to agentic engineering spectrum",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - { id: open-notes, type: workspace.openFile, at: { mark: open-notes }, path: notes.md }

  - id: vibe
    narration: >
      [[mark:v-axis]] ဒီ မျဉ်းကို ကြည့်ပါ။ AI နဲ့ software ဆောက်တဲ့ ပုံစံတွေကို ဘယ်ကနေ ညာကို စီထားတာပါ။ ဘယ်ဘက်မှာ
      vibe coding ရှိပါတယ်။ ၂၀၂၅ အစောပိုင်းမှာ ပေါ်လာပြီး လူသိများသွားတဲ့ စကားလုံးပါ။ [[mark:v-say]] vibe coding
      မှာ လိုချင်တာကို chat ထဲမှာ ပြောပြီး ထွက်လာတာကို လက်ခံပါတယ်။ error ဆိုတဲ့ အမှားပြစာ တက်ရင်၊ အဲဒီ စာကို AI ဆီ
      ပြန်ကူးထည့်ပြီး ပြင်ခိုင်းပါတယ်။ [[mark:v-check]] စစ်တာကတော့ run ကြည့်ရုံပါ။ run ကြည့်တယ် ဆိုတာ program ကို
      တကယ် ဖွင့်ပြီး အလုပ်လုပ်ကြည့်တာပါ။ အလုပ်လုပ်သလို ပုံပေါ်ရင် ရပြီလို့ ယူဆပါတယ်။ [[mark:v-read]] ထွက်လာတဲ့
      code ကိုလည်း ဘယ်သူမှ မဖတ်ပါဘူး။ ဆိုလိုတာက ပြော၊ လက်ခံ၊ code မဖတ်ဘဲ ဆက်သွားတဲ့ ပုံစံပါ။ ဒါက မကောင်းဘူးလို့
      ပြောတာ မဟုတ်ပါဘူး။ တစ်ညတည်း သုံးပြီး ပစ်မယ့် အရာ၊ ကိုယ်တစ်ယောက်တည်း သုံးမယ့် အရာ၊ မှားရင်လည်း ဘယ်သူမှ
      မနစ်နာတဲ့ အရာအတွက်ဆိုရင် vibe coding က အမြန်ဆုံး နည်းပါ။
    sources:
      - {
          title: "The New SDLC (Burmese edition): From syntax to intent (vibe coding)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - { title: "Wikipedia: Vibe coding", url: "https://en.wikipedia.org/wiki/Vibe_coding" }
      - {
          title: "Simon Willison: Not all AI-assisted programming is vibe coding (but vibe coding rocks)",
          url: "https://simonwillison.net/2025/Mar/19/vibe-coding/",
        }
    actions:
      - {
          id: open-board-s,
          type: whiteboard.apply,
          at: { mark: v-axis },
          open: true,
          clear: true,
          upsertIds: [s-axis, s-m1],
          drawMs: 1200,
        }
      - {
          id: draw-v-say,
          type: whiteboard.apply,
          at: { mark: v-say },
          upsertIds: [s-h1, s-v1],
          drawMs: 900,
        }
      - {
          id: draw-v-check,
          type: whiteboard.apply,
          at: { mark: v-check },
          upsertIds: [s-h2, s-v2],
          drawMs: 900,
        }
      - {
          id: draw-v-read,
          type: whiteboard.apply,
          at: { mark: v-read },
          upsertIds: [s-h3, s-v3],
          drawMs: 900,
        }

  - id: agentic
    chapter: Agentic engineering ဆိုတာ
    narration: >
      [[mark:a-m3]] မျဉ်းရဲ့ ညာဘက်အစွန်မှာတော့ agentic engineering ရှိပါတယ်။ AI ကို spec၊ test၊ rule၊ လူ့ review
      တွေ ကြားထဲမှာ ထားပြီး သုံးတဲ့ ပုံစံပါ။ [[mark:a-say]] ဒီမှာ ဘာလိုချင်လဲ ဆိုတာကို chat ထဲမှာ ပြောရုံ မဟုတ်ဘဲ၊
      spec လို့ ခေါ်တဲ့ စာတမ်း တစ်ခုထဲမှာ ကြိုရေးထားပါတယ်။ agent ဖတ်ရမယ့် rule file လည်း ရှိပါတယ်။
      [[mark:a-check]] ထွက်လာတာကို test တွေနဲ့ စစ်ပါတယ်။ test ဆိုတာ ဒါလုပ်ရင် ဒါဖြစ်ရမယ် ဆိုတာကို တစ်ခုချင်း
      စစ်တဲ့ အဆင့်တွေပါ။ [[mark:a-read]] ပြောင်းလဲမှု တိုင်းကိုလည်း လူ တစ်ယောက်က review လုပ်ပြီးမှ လက်ခံပါတယ်။
      review ဆိုတာ ပြောင်းလဲမှုကို မထည့်ခင် နောက်ထပ် လူ တစ်ယောက်က ပြန်စစ်တာပါ။ [[mark:a-m2]] ဒီ နှစ်ဖက်ကြားမှာ
      structured လို့ ခေါ်နိုင်တဲ့ အလယ်ပိုင်း ရှိပါတယ်။ ဥပမာနဲ့ rule တွေကို ထည့်ပြောတာ၊ လက်နဲ့ စမ်းကြည့်တာ၊ အဓိက
      အပိုင်းတွေကို ဖတ်တာ မျိုးပါ။ လက်တွေ့ အလုပ် အများစုက ဒီ ကြားထဲမှာ ရှိပါတယ်။ [[mark:a-key]] သတိထားရမှာက မျဉ်း
      တစ်လျှောက်လုံးမှာ AI ကို သုံးနေတာပါပဲ။ ကွာတာက AI သုံးလား မသုံးလား မဟုတ်ဘဲ၊ AI ထုတ်ပေးတာရဲ့ ပတ်လည်မှာ
      structure နဲ့ စစ်ဆေးမှု ဘယ်လောက် ရှိလဲ ဆိုတာပါ။ structure ဆိုတာ ကြိုရေးထားတဲ့ စာတမ်း၊ rule နဲ့ စစ်တဲ့
      အဆင့်တွေကို ပြောတာပါ။
