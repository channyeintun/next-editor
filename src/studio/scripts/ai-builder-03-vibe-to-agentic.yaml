# AI Builder, lesson 03: from vibe coding to agentic engineering (Burmese, docs kind).
#
# Start state (ws/): base-docs (package.json with a no-op dev script, notes.md = "# Notes\n"). No
# binder document exists before L04. Nothing runs. The lesson types the shop's prototype / production
# rule (heading + 3 lines) into notes.md.
#
# Boards: (S) a horizontal spectrum (arrow right) with three violet marks (vibe coding · structured ·
# agentic) and three rows drawn as each is named (how intent is given, how it is checked, who reads),
# then the risk row (green low / red high) and the orange key line; (T) the same axis with the four
# tea-shop tasks placed by risk (green, green, orange, red) and the red drift arrow (a prototype that
# quietly becomes production); (Z) the two-option quiz.
#
# Build: bun ~/Documents/ai-builder-course-work/tools/build-lesson.ts template.yaml ws ai-builder-03-vibe-to-agentic.yaml
