  - id: choose
    chapter: Risk ပေါ်မူတည်ပြီး ရွေးရအောင်
    narration: >
      [[mark:c-risk]] ဒါဆို အလုပ် တစ်ခုကို မျဉ်းရဲ့ ဘယ်နေရာမှာ ထားမလဲ။ မေးခွန်း နှစ်ခု မေးကြည့်ရပါမယ်။ ပထမ
      မေးခွန်းက risk ပါ။ risk ဆိုတာ မှားသွားရင် ဘယ်လောက် နစ်နာမလဲ ဆိုတာပါ။ ဘယ်သူ နစ်နာမလဲ၊ ငွေ ဆုံးမလား၊ customer
      ရဲ့ ဖုန်းနံပါတ်လို data ပေါက်ကြားမလား ဆိုတာတွေ ပါပါတယ်။ [[mark:c-life]] ဒုတိယ မေးခွန်းက ဘယ်လောက် ကြာကြာ
      သုံးမလဲ ဆိုတာပါ။ တစ်ညတည်း သုံးပြီး ပစ်မယ့် အရာနဲ့၊ နေ့တိုင်း နှစ်ပေါင်းများစွာ ပြင်ရင်း သုံးနေမယ့် အရာ
      မတူပါဘူး။ ကြာကြာ သုံးလေ၊ နောက်ပိုင်း ပြင်ရ ထိန်းရ လွယ်အောင် စနစ်တကျ ဆောက်ထားဖို့ လိုလေပါပဲ။ [[mark:c-ends]]
      ဒါကြောင့် risk နည်းပြီး ခဏပဲ သုံးမယ့် အလုပ်ကို ဘယ်ဘက်မှာ၊ risk များပြီး ကြာကြာ သုံးမယ့် အလုပ်ကို ညာဘက်မှာ
      ထားပါမယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The vibe coding to agentic engineering spectrum",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "The New SDLC (Burmese edition): Conclusion (structure scales)",
