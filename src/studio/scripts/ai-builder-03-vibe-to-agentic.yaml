          at: { mark: c-risk },
          upsertIds: [s-r1, s-r3],
          drawMs: 900,
        }
      - {
          id: draw-c-life,
          type: whiteboard.apply,
          at: { mark: c-life },
          upsertIds: [s-l1, s-l3],
          drawMs: 900,
        }

  - id: tasks
    narration: >
      [[mark:t-open]] ခုနက ဆိုင်ရဲ့ အလုပ် လေးခုကို ဒီ မျဉ်းပေါ်မှာ နေရာချကြည့်ရအောင်။ [[mark:t-poster]] မွေးနေ့ပွဲ
      poster page က တစ်ညတည်း သုံးမှာ ဖြစ်ပြီး customer data လည်း မပါပါဘူး။ မှားရင် poster ကို ပြန်ထုတ်ရုံပါပဲ။
      ဒါကြောင့် vibe coding နဲ့ လုပ်လို့ ရပါတယ်။ [[mark:t-count]] ကိုယ်ပဲ သုံးမယ့် အော်ဒါ ရေတွက်တဲ့ script ကတော့
      ကောင်တာက လှလှ မှတ်ထားတဲ့ အော်ဒါ စာရင်းကို ဖတ်ရုံပဲ ဖတ်ပြီး ဘာမှ မပြင်ပါဘူး။ ဒါပေမဲ့ ရလာတဲ့ ကိန်းဂဏန်းကို
      ကြည့်ပြီး ဆုံးဖြတ်ချက် ချမှာမို့၊ ပထမ တစ်ခါမှာ လက်နဲ့ ရေတွက်ထားတာနဲ့ ကိုက်လား တိုက်စစ်ရပါမယ်။ ဒါကြောင့် vibe
      coding နဲ့ structured ကြားမှာ ထားပါမယ်။ [[mark:t-app]] ကြိုမှာ app ကတော့ တကယ့် customer တွေရဲ့ နာမည်နဲ့
      ဖုန်းနံပါတ်ကို လက်ခံပြီး၊ နေ့တိုင်း နှစ်ပေါင်းများစွာ သုံးမှာပါ။ မှားရင် member အောင်အောင် လို customer တွေ
      မနက်ခင်း လက်ဖက်ရည် မရဘဲ ပြန်သွားရနိုင်လို့ ညာဘက်မှာ ထားရပါမယ်။ [[mark:t-pay]] ငွေချေတဲ့ အဆင့်က risk
      အများဆုံးပါ။ ငွေ မှားရင် customer ရော ဆိုင်ပါ တိုက်ရိုက် နစ်နာလို့၊ ညာဘက် အစွန်ဆုံးမှာ ထားပြီး စစ်ဆေးမှု
      အများဆုံး လိုပါတယ်။
    sources:
