  - id: danger
    chapter: Prototype က production ဖြစ်သွားရင်
    narration: >
      [[mark:d-proto]] ဒီ မျဉ်းပေါ်မှာ အန္တရာယ် အများဆုံးက ဘယ်ဘက်မှာ ဆောက်ခဲ့တဲ့ အရာ တစ်ခုက ညာဘက်ကို မသိမသာ
      ရွေ့သွားတာပါ။ စမ်းဖို့ ဆောက်ထားတဲ့ အကြမ်းကို prototype လို့ ခေါ်ပြီး၊ တကယ့် customer တွေ သုံးနေတဲ့ ဟာကို
      production လို့ ခေါ်ပါတယ်။ [[mark:d-story]] ဥပမာ ကြိုမှာ app ကို မဆောက်ခင် ပုံစံ ကြည့်ဖို့၊ ညတစ်ည vibe
      coding နဲ့ form လေး တစ်ခု ဆောက်ထားတယ် ဆိုပါစို့။ ဆိုင်ပိုင်ရှင် မြမြ က သဘောကျလို့ ဆိုင်ရဲ့ page မှာ link
      တင်လိုက်ပါတယ်။ နောက်နေ့ မနက်ကစပြီး တကယ့် customer တွေက နာမည်နဲ့ ဖုန်းနံပါတ် ထည့်ပြီး မှာလာကြပါတယ်။
      [[mark:d-drift]] ဒါပေမဲ့ အဲဒီ form ရဲ့ code ကို ဘယ်သူမှ မဖတ်ရသေးသလို၊ ဖုန်းနံပါတ်တွေ ဘယ်ရောက်သွားလဲ၊
      အရေအတွက် သုည ထည့်ရင် ဘာဖြစ်လဲ ဆိုတာကိုလည်း ဘယ်သူမှ မစစ်ရသေးပါဘူး။ ဘယ်သူမှ မဆုံးဖြတ်ဘဲ prototype က production
      ဖြစ်သွားတာပါ။ ဒါကြောင့် prototype ဆိုတာ စမ်းပြီးရင် ပစ်မယ့် အရာ ဖြစ်တယ် ဆိုတာကို အစကတည်းက ရှင်းထားရပါမယ်။
    sources:
      - {
          title: "GOV.UK Service Manual: How the alpha phase works",
          url: "https://www.gov.uk/service-manual/agile-delivery/how-the-alpha-phase-works",
        }
      - {
          title: "Simon Willison: Not all AI-assisted programming is vibe coding (but vibe coding rocks)",
          url: "https://simonwillison.net/2025/Mar/19/vibe-coding/",
        }
      - {
          title: "The New SDLC (Burmese edition): Conclusion (structure scales)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: draw-d-proto,
          type: whiteboard.apply,
          at: { mark: d-proto },
          upsertIds: [t-drift],
          drawMs: 1200,
        }
      - {
          id: draw-d-drift,
          type: whiteboard.apply,
          at: { mark: d-drift },
          upsertIds: [t-drift-l],
          drawMs: 1200,
        }

  - id: rule
    narration: >
      [[mark:close-t]] အဲဒီအတွက် prototype နဲ့ production ကြားမှာ စည်း တစ်ခုကို တမင် ဆွဲထားဖို့၊ ဆိုင်ရဲ့ rule
      တစ်ခုကို notes ထဲမှာ ရေးထားရအောင်။ [[mark:type-rule]] prototype မှာ ဘာလုပ်ခွင့် ရှိလဲ၊ production ဖြစ်ဖို့
      ဘာတွေ ပါရမလဲ၊ စည်းကို ကျော်ချင်ရင် ဘယ်လို ကျော်မလဲ ဆိုတာကို တစ်ကြောင်းစီ ဆုံးဖြတ်ထားတာပါ။ [[mark:sel-proto]]
      ပထမ စာကြောင်းက customer တွေရဲ့ နာမည်နဲ့ ဖုန်းနံပါတ်ကို ကာကွယ်ပေးတဲ့ စာကြောင်းပါ။ ဒီ rule ရှိရင် ခုနက form
      လို ဖြစ်ရပ်မှာ link မတင်ခင်ကတည်းက ရပ်ပြီး စဉ်းစားဖို့ အကြောင်း ရှိလာပါတယ်။ [[mark:sel-cross]] တတိယ
      စာကြောင်းကတော့ စည်းကို ကျော်တဲ့ ဆုံးဖြတ်ချက်ကို ဘယ်သူနဲ့ ချမလဲ၊ ကျော်ရင် ဘာတွေ ထပ်လုပ်ရမလဲ ဆိုတာကို
      ကြိုသတ်မှတ်ထားတာပါ။ စည်းကို ကျော်တာ မမှားပါဘူး။ မသိဘဲ ကျော်မိတာကသာ ပြဿနာပါ။
    sources:
      - {
          title: "GOV.UK Service Manual: How the alpha phase works",
          url: "https://www.gov.uk/service-manual/agile-delivery/how-the-alpha-phase-works",
        }
      - {
          title: "The New SDLC (Burmese edition): The vibe coding to agentic engineering spectrum",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - { id: close-t, type: whiteboard.apply, at: { mark: close-t }, open: false }
      - id: type-rule
        type: editor.type
        at: { mark: type-rule }
        target: { file: notes.md, after: "# Notes\n", occurrence: 1 }
        text: "\n## Lesson 03 · Prototype နဲ့ production\n- prototype — စမ်းဖို့ပဲ။ တကယ့် customer data မထည့်ဘူး။\n- production — customer data ဒါမှမဟုတ် ငွေချေတာ ပါရင် spec၊ test၊ လူ့ review ပါမှ တင်မယ်။\n- prototype ကို တကယ် သုံးချင်ရင် — မြမြ နဲ့ တိုင်ပင်ပြီး risk နဲ့ ကိုက်တဲ့ စစ်ဆေးမှု ထည့်မယ်။\n"
        cadence: line-by-line
      - {
          id: expect-rule,
          type: expect.file,
          at: { afterAction: type-rule },
          path: notes.md,
          contains: "- prototype — စမ်းဖို့ပဲ။ တကယ့် customer data မထည့်ဘူး။",
        }
      - {
          id: sel-proto,
          type: editor.select,
          at: { mark: sel-proto },
          target:
            {
              file: notes.md,
              text: "- prototype — စမ်းဖို့ပဲ။ တကယ့် customer data မထည့်ဘူး။",
              occurrence: 1,
            },
        }
      - {
          id: sel-cross,
          type: editor.select,
          at: { mark: sel-cross },
          target:
            {
              file: notes.md,
              text: "- prototype ကို တကယ် သုံးချင်ရင် — မြမြ နဲ့ တိုင်ပင်ပြီး risk နဲ့ ကိုက်တဲ့ စစ်ဆေးမှု ထည့်မယ်။",
              occurrence: 1,
            },
        }

  - id: quiz
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ ဒီနေ့ ဆိုင်မှာ ရနိုင်တဲ့ menu နဲ့ ဈေးနှုန်းကို ပြတဲ့ page တစ်ခု
      ဆောက်မယ် ဆိုပါစို့။ customer data လုံးဝ မပါပါဘူး။ ဘယ်လို ဆောက်မလဲ။ ပထမ အဖြေက data မပါလို့ vibe coding နဲ့
      ဆောက်ပြီး ချက်ချင်း တင်မယ် ဆိုတာပါ။ ဒုတိယ အဖြေက vibe coding နဲ့ မြန်မြန် ဆောက်ပေမယ့်၊ မတင်ခင်
      ဈေးနှုန်းတွေကို စစ်မယ် ဆိုတာပါ။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] အဖြေကတော့
      ဒုတိယ အဖြေ ပါ။ မျဉ်းပေါ်မှာဆိုရင် ဘယ်ဘက်နား၊ ဒါပေမဲ့ အစွန်ဆုံး မဟုတ်တဲ့ နေရာပါ။ ဘာကြောင့်လဲဆိုတော့ customer
      data မပါလို့ risk နည်းပေမယ့်၊ customer အားလုံး မြင်ရမယ့် page ဖြစ်လို့ပါ။ ဈေးနှုန်း တစ်ခု မှားနေရင်
      ကောင်တာမှာ အငြင်းပွားရနိုင်တာမို့၊ code မဖတ်ရင်တောင် ဈေးနှုန်း တစ်ခုချင်းကို ဆိုင်ရဲ့ menu နဲ့
      တိုက်စစ်ရပါမယ်။
