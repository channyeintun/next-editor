# Go course, lesson 05: text and Printf (Burmese).
#
# Start state: main.go with `package main`, `import "fmt"` and a main holding the market item
# (`item := "ကြက်ဥ"`) and its price (`price := 3500`) from lesson 04's market trip.
# Edits, all insert-only:
#   1. a Println of price, "ကျပ်" and item, then a Println of item + "ဆယ်လုံး" -> run-1:
#      3500 ကျပ် ကြက်ဥ / ကြက်ဥဆယ်လုံး;
#   2. `fmt.Printf("%d ကျပ် - %s\n", item)` (the price left out) -> run-2: vet
#      `main.go:10:14: fmt.Printf format %d has arg item of wrong type string`, and the program still
#      prints `%!d(string=ကြက်ဥ) ကျပ် - %!s(MISSING)`;
#   3. `price, ` before item, a Sprintf line joined with " ဆယ်လုံး", and a %v %q Printf -> run-3:
#      3500 ကျပ် - ကြက်ဥ / 3500 ကျပ် - ကြက်ဥ ဆယ်လုံး / 3500 "ကြက်ဥ".
# Boards: (P) a Printf format is a form with blanks that the arguments fill left to right;
# (W) what vet saw: the word in the number blank, nothing for the text blank; (Q) quiz: + on a number.
# Fixtures: bun ~/Documents/go-course-work/tools/sim-go.ts <this yaml> --write
schemaVersion: 1

