    chapter: ပြောင်းပြီး ပြန်ပြောင်းရင်
    narration: >-
      user တစ်ယောက်က ယူရို တစ်ထောင်ကို ဒေါ်လာ ပြောင်းပြီး ချက်ချင်း ယူရို ပြန်ပြောင်းရင် ယူရို
      တစ်ထောင် ပြန်မရပါဘူး။ ဘယ်လောက် လျော့လဲ၊ လျော့တဲ့ ငွေ ဘယ်ရောက်သွားလဲ ဆိုတာက FX ရဲ့
      အခြေခံပါ။ [[mark:sel-quote]] ဒီ quote က user ကို ပြတဲ့ ယူရို တစ်ခုရဲ့ ဈေးကို ဒေါ်လာနဲ့
      ပြတာပါ။ ဈေး တစ်ခု မဟုတ်ဘဲ နှစ်ခု ပါပါတယ်။ bid ဆိုတာ quote ပေးတဲ့ ဘက်က ယူရိုကို ဝယ်တဲ့ ဈေး၊ ask
      ဆိုတာ ရောင်းတဲ့ ဈေးပါ။ rate တွေကို သန်းပုံတစ်ပုံ unit နဲ့ ကိန်းပြည့်အဖြစ် ထားလို့ float
      မပါပါဘူး။ [[mark:sel-legs]] ပထမ line က ယူရို တစ်ထောင်ကို bid ဈေးနဲ့ ရောင်းပြီး ဒေါ်လာ ယူတာ၊
      ဒုတိယ line က ရလာတဲ့ ဒေါ်လာနဲ့ ask ဈေးမှာ ယူရို ပြန်ဝယ်တာပါ။ ယူရို ဘယ်လောက် ပြန်ရမလဲ၊ run
      မလုပ်ခင် ခန့်မှန်းကြည့်ပါ။ [[mark:run-1]] run လိုက်ရအောင်။
    sources:
      - {
          title: "Fintech Engineering Handbook — FX Rates (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#fx-rates",
        }
      - {
          title: "Fintech Engineering Handbook — Appendix A, Money & FX (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#money--fx",
        }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }
      - id: sel-quote
        type: editor.select
        at: { mark: sel-quote }
        target:
          {
            file: main.go,
            text: 'q := Quote{Bid: 1098900, Ask: 1101100, Source: "quote-7",',
            occurrence: 1,
          }
      - id: sel-legs
        type: editor.select
        at: { mark: sel-legs }
        target:
          {
            file: main.go,
            text: "usd := Money{eur.Amount * q.Bid / scale, \"USD\"}  // the user sells EUR: gets the bid\n\tback := Money{usd.Amount * scale / q.Ask, \"EUR\"}",
            occurrence: 1,
          }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "1098.90 USD -> 998.00 EUR",
          timeoutMs: 8000,
        }

  - id: read-1
    narration: >-
      [[mark:pt-sell]] ယူရို တစ်ထောင်က ဒေါ်လာ တစ်ထောင့် ကိုးဆယ့်ရှစ် ဒသမ ကိုး ဖြစ်ပါတယ်။ [[mark:pt-buy]]
      အဲဒီ ဒေါ်လာနဲ့ ပြန်ဝယ်တော့ ယူရို ကိုးရာ ကိုးဆယ့်ရှစ်ပဲ ပြန်ရပြီး ယူရို နှစ်ခု လျော့သွားပါတယ်။
      [[mark:dock-1]] ဈေးက တစ်စက္ကန့်မှ မပြောင်းဘဲ ဒီလောက် ကွာတာပါ။ ဘာကြောင့်လဲ ဆိုတာ quote ရဲ့
      ပုံစံကနေ စကြည့်ရအောင်။
    sources:
      - {
          title: "Fintech Engineering Handbook — FX Rates (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#fx-rates",
        }
    actions:
      - id: pt-sell
        type: console.point
        at: { mark: pt-sell }
        target: { text: "sell at bid:", occurrence: 1 }
      - id: pt-buy
        type: console.point
        at: { mark: pt-buy }
        target: { text: "buy at ask:", occurrence: 1 }
      - { id: dock-1, type: runtime.collapseDock, at: { mark: dock-1 } }

  - id: quote
    chapter: Bid၊ ask နဲ့ spread
    narration: >-
      [[mark:show-quote]] FX rate ဆိုတာ currency တစ်ခုကို နောက်တစ်ခုနဲ့ ပြတဲ့ ဈေးပါ။ ဒီ pair မှာ ယူရို
      တစ်ခုရဲ့ ဈေးကို ဒေါ်လာနဲ့ ပြပါတယ်။ [[mark:pt-ask]] ယူရို ဝယ်ချင်ရင် ask ဈေးကို ပေးရပြီး၊
      [[mark:pt-bid]] ရောင်းချင်ရင် bid ဈေးပဲ ရပါတယ်။ [[mark:quote-2]] နှစ်ခုကြားက ကွာဟချက်ကို spread
      လို့ ခေါ်ပါတယ်။ [[mark:pt-bp]] fee နဲ့ rate တွေကို basis point နဲ့ ပြောလေ့ရှိပြီး၊ basis point
      တစ်ခုဆိုတာ ရာခိုင်နှုန်းရဲ့ ရာပုံတစ်ပုံပါ။ ဒီ quote ရဲ့ spread က basis point နှစ်ဆယ်ပါ။
      [[mark:quote-3]] bid နဲ့ ask ရဲ့ အလယ်က mid-market rate ပါ။ reference အဖြစ် သုံးပေမဲ့ ဒီဈေးနဲ့
      ဘယ်သူမှ trade မလုပ်ကြပါဘူး။ [[mark:pt-dir]] bid နဲ့ ask မတူလို့ rate မှာ direction ရှိပါတယ်။ ဒေါ်လာကနေ
      ယူရို ပြောင်းတဲ့ ဈေးကို ယူရိုကနေ ဒေါ်လာ ဈေးကို ပြောင်းပြန်လှန်ပြီး ယူလို့ မရပါဘူး၊ ဝယ်တာနဲ့
      ရောင်းတာက order နှစ်ခု၊ ဈေး နှစ်ခု ဖြစ်လို့ပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — FX Rates (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#fx-rates",
        }
      - {
          title: "Fintech Engineering Handbook — Appendix A, Money & FX (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#money--fx",
        }
    actions:
      - {
          id: show-quote,
          type: slide.show,
          at: { mark: show-quote, offsetMs: -700 },
          slideId: quote-1,
        }
      - {
          id: pt-pair,
          type: slide.point,
          at: { afterAction: show-quote },
          target: { x: 0.1, y: 0.297 },
        }
      - { id: pt-ask, type: slide.point, at: { mark: pt-ask }, target: { x: 0.238, y: 0.498 } }
      - { id: pt-bid, type: slide.point, at: { mark: pt-bid }, target: { x: 0.238, y: 0.853 } }
      - { id: quote-2, type: slide.show, at: { mark: quote-2 }, slideId: quote-2 }
      - { id: pt-bp, type: slide.point, at: { mark: pt-bp }, target: { x: 0.747, y: 0.587 } }
      - { id: quote-3, type: slide.show, at: { mark: quote-3 }, slideId: quote-3 }
      - {
          id: pt-midcard,
          type: slide.point,
          at: { afterAction: quote-3 },
          target: { x: 0.238, y: 0.664 },
        }
      - { id: pt-dir, type: slide.point, at: { mark: pt-dir }, target: { x: 0.373, y: 0.956 } }

  - id: round
    chapter: Spread က revenue
    narration: >-
      [[mark:show-round]] ခုနက run ကို ပြန်ကြည့်ရအောင်။ ယူရို တစ်ထောင်ကို bid နဲ့ ရောင်းပါတယ်။
      [[mark:round-2]] ပြီးတော့ ask နဲ့ ပြန်ဝယ်တော့ ယူရို နှစ်ခု လျော့သွားပါတယ်။ [[mark:pt-gap]] အဲဒီ
      ယူရို နှစ်ခုက ပျောက်သွားတာ မဟုတ်ပါဘူး၊ quote ပေးတဲ့ ဘက်က ရသွားတာပါ။ [[mark:round-3]] ကိုယ့်
      platform က user ကို quote ပေးတဲ့ ဘက် ဖြစ်ရင် spread က platform ရဲ့ revenue ပါ။ ဒါကို rate ထဲ
      ဝှက်ထားပြီး ledger မှာ မှတ်မထားရင် user ရဲ့ ငွေ ဘယ်ရောက်သွားလဲ ဆိုတာ ဘယ်သူမှ ပြန်မပြောနိုင်တော့ပါဘူး။
      ဒါက No lost data ကို ချိုးဖောက်တာပါ၊ ငွေနဲ့ ပတ်သက်ပြီး ဖြစ်ခဲ့သမျှ မပျောက်ရဘူး ဆိုတဲ့ မူပါ။
      [[mark:pt-hide]] spread ကို revenue account တစ်ခုထဲ သီးသန့် post လုပ်မှ ဒီငွေ ဘယ်ကလာလဲ ဆိုတာကို
      audit မှာ ဖြေနိုင်ပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — FX Rates (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#fx-rates",
        }
      - {
          title: "Fintech Engineering Handbook — Principles (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#principles",
        }
    actions:
      - { id: show-round, type: slide.show, at: { mark: show-round }, slideId: round-1 }
      - {
          id: pt-u,
          type: slide.point,
          at: { afterAction: show-round },
          target: { x: 0.5, y: 0.509 },
        }
      - { id: round-2, type: slide.show, at: { mark: round-2 }, slideId: round-2 }
      - {
          id: pt-e2,
          type: slide.point,
          at: { afterAction: round-2 },
          target: { x: 0.819, y: 0.509 },
        }
      - { id: pt-gap, type: slide.point, at: { mark: pt-gap }, target: { x: 0.738, y: 0.7 } }
      - { id: round-3, type: slide.show, at: { mark: round-3 }, slideId: round-3 }
      - {
          id: pt-revcard,
          type: slide.point,
          at: { afterAction: round-3 },
          target: { x: 0.256, y: 0.753 },
        }
      - { id: pt-hide, type: slide.point, at: { mark: pt-hide }, target: { x: 0.321, y: 0.878 } }

  - id: mid-code
    chapter: Mid rate နဲ့ တကယ့် ဈေး
    narration: >-
      [[mark:close-round]] mid rate နဲ့ တကယ့် ဈေးကို code မှာ ယှဉ်ကြည့်ရအောင်။ [[mark:type-mid]] mid ကို
      bid နဲ့ ask ရဲ့ ပျမ်းမျှနဲ့ တွက်ပြီး၊ spread ကို basis point နဲ့ တွက်ပါတယ်။ ပြီးတော့ user ဆီမှာ
      ရှိတဲ့ ဒေါ်လာတွေက mid rate နဲ့ ယူရို ဘယ်လောက် တန်လဲ ဆိုတာ ပြပါမယ်။ [[mark:run-2]] run
      လိုက်ရအောင်။ [[mark:pt-mid]] mid rate နဲ့ဆိုရင် ယူရို ကိုးရာ ကိုးဆယ့်ကိုး တန်ပါတယ်။ ဒါပေမဲ့ တကယ်
      ပြန်ရောင်းရင် ကိုးရာ ကိုးဆယ့်ရှစ်ပဲ ရပါတယ်။ [[mark:dock-2]] ဆိုလိုတာက holding တစ်ခုရဲ့ တန်ဖိုးကို
      ပြတာနဲ့ အဲဒါကို ရောင်းရင် ရမယ့် ငွေက မတူပါဘူး။ user ကို balance ပြတဲ့ နေရာမှာ ဘယ် ဂဏန်းကို
      ပြနေလဲ ဆိုတာ ထင်ရှားရပါမယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Appendix A, Money & FX (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#money--fx",
        }
    actions:
      - { id: close-round, type: slide.close, at: { mark: close-round } }
      - id: type-mid
        type: editor.type
        at: { mark: type-mid }
        target:
          {
            file: main.go,
            after: "\tfmt.Println(\"buy at ask: \", usd, \"->\", back)\n",
            occurrence: 1,
          }
        text: "\n\tmid := (q.Bid + q.Ask) / 2\n\tspreadBP := (q.Ask - q.Bid) * 10000 / mid\n\tatMid := Money{usd.Amount * scale / mid, \"EUR\"}\n\tfmt.Println(\"mid\", rate(mid), \"spread\", spreadBP, \"bp:\", usd, \"is worth\", atMid)\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "is worth 999.00 EUR",
          timeoutMs: 8000,
        }
      - id: pt-mid
        type: console.point
        at: { mark: pt-mid }
        target: { text: "is worth", occurrence: 1 }
      - { id: dock-2, type: runtime.collapseDock, at: { mark: dock-2 } }

  - id: kinds
    chapter: Rate နှစ်မျိုး၊ အချိန် နှစ်မျိုး
    narration: >-
      [[mark:show-kinds]] ဒါကြောင့် rate နှစ်မျိုးကို ခွဲထားရပါတယ်။ transactional rate ဆိုတာ conversion
      တစ်ခု တကယ် ဖြစ်ခဲ့တဲ့ ဈေးပါ။ အဲဒါကို သီးသန့် မသိမ်းပါဘူး၊ ပေးလိုက်တဲ့ amount နဲ့ ရလိုက်တဲ့ amount
      ကနေ အမြဲ ပြန်တွက်လို့ ရလို့ပါ။ [[mark:kinds-2]] reference rate ဆိုတာ mid-market rate ဒါမှမဟုတ်
      central bank rate လိုမျိုး holdings ရဲ့ တန်ဖိုး၊ tax နဲ့ report အတွက် သုံးတဲ့ rate ပါ။ [[mark:pt-ecb]]
      ဥပမာ ECB က ယူရို reference rate တွေကို ပုံမှန်အားဖြင့် အလုပ်လုပ်ရက်တိုင်း CET ညနေ လေးနာရီလောက်မှာ
      ထုတ်ပြန်ပါတယ်။ ECB ကိုယ်တိုင်က အဲဒါတွေကို information အတွက်ပဲ ထုတ်တာ ဖြစ်ပြီး transaction
      တွေမှာ သုံးဖို့ လုံးဝ အားမပေးဘူးလို့ ရေးထားပါတယ်။ [[mark:kinds-3]] rate ရဲ့ အချိန်ကလည်း
      အရေးကြီးပါတယ်။ [[mark:pt-vd]] tax နဲ့ တန်ဖိုး ပြောင်းလဲမှုကို တွက်ရင် value date ရဲ့ rate ကို
      သုံးပါတယ်။ value date ဆိုတာ ငွေ လှုပ်ရှားမှုက တန်ဖိုးအရ သက်ရောက်တဲ့ နေ့ပါ။ [[mark:pt-now]]
      holdings ရဲ့ လက်ရှိ တန်ဖိုးကို ပြရင်တော့ အခုချိန် rate ကို သုံးပါတယ်။ [[mark:kinds-4]] နောက်ဆုံး
      အချက်က canonical rate ဆိုတာ မရှိတာပါ။ rate တွေက market ကနေ လာပြီး venue တစ်ခုနဲ့ တစ်ခု၊
      တွက်နည်း တစ်ခုနဲ့ တစ်ခု ကွာပါတယ်။ ဒါကြောင့် rate တစ်ခု သုံးတိုင်း ဘယ်ကလာလဲ၊ ဘယ်အချိန်ကလဲ
      ဆိုတာကို data ထဲ တွဲသိမ်းရပါတယ်။ ဒါက No trust ပါ၊ ဘယ်သူ့ကိုမှ၊ ကိုယ့် component ကိုတောင်
      အလိုလို မယုံရဘူး ဆိုတဲ့ မူပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — FX Rates (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#fx-rates",
        }
      - {
          title: "ECB — Euro foreign exchange reference rates",
          url: "https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/index.en.html",
        }
    actions:
      - {
          id: show-kinds,
          type: slide.show,
          at: { mark: show-kinds, offsetMs: -700 },
          slideId: kinds-1,
        }
      - {
          id: pt-tx,
          type: slide.point,
          at: { afterAction: show-kinds },
          target: { x: 0.269, y: 0.442 },
        }
      - { id: kinds-2, type: slide.show, at: { mark: kinds-2 }, slideId: kinds-2 }
      - {
          id: pt-ref,
          type: slide.point,
          at: { afterAction: kinds-2 },
          target: { x: 0.731, y: 0.442 },
        }
      - { id: pt-ecb, type: slide.point, at: { mark: pt-ecb }, target: { x: 0.721, y: 0.529 } }
