  - id: record
    chapter: Conversion တစ်ခုမှာ ဘာသိမ်းမလဲ
    narration: >-
      [[mark:close-kinds]] code မှာ ဘာကို သိမ်းမလဲ ကြည့်ရအောင်။ [[mark:open-fx]] fx ဖိုင်ထဲမှာ conversion
      record ရှိပါတယ်။ [[mark:sel-conv]] amount နှစ်ခု၊ quote ရဲ့ source နဲ့ အချိန် ပါပြီး၊ rate field
      တမင် မပါပါဘူး။ [[mark:open-main2]] main ဖိုင်မှာ record တစ်ခု ဆောက်ကြည့်ရအောင်။ [[mark:type-record]]
      record ထဲက amount နှစ်ခုကနေ implied rate ကို ပြန်တွက်ပြီး၊ mid rate နဲ့ ယှဉ်ပြီး quote ပေးတဲ့ ဘက် ရတဲ့
      spread revenue ကို တွက်ပါတယ်။ implied rate ဆိုတာ amount နှစ်ခုကနေ ပြန်ထွက်လာတဲ့ transactional
      rate ပါ။ [[mark:run-3]] run လိုက်ရအောင်။ [[mark:pt-stored]] implied rate က quote ရဲ့ bid နဲ့
      ညီပါတယ်။ rounding ကြောင့် နောက်ဆုံး digit ကွာတာမျိုး ဖြစ်နိုင်ပေမဲ့ အတည်ယူရမှာက amount နှစ်ခုပါ။
      rate ကို သီးသန့် သိမ်းထားရင် amount နဲ့ မကိုက်တဲ့ နေ့တစ်နေ့ ရောက်လာပြီး ဘယ်ဟာ မှန်လဲ ဆိုတာ
      ငြင်းရပါလိမ့်မယ်။ [[mark:pt-rev]] spread revenue က ဒေါ်လာ တစ် ဒသမ တစ်ပါ၊ mid rate နဲ့ ပေးခဲ့ရင်
      user ရမယ့် ငွေနဲ့ တကယ် ပေးလိုက်တဲ့ ငွေရဲ့ ကွာခြားချက်ပါ။ ဒါက ပြောင်းတဲ့ တစ်ကြိမ်စာပဲ ဖြစ်ပြီး၊ user က ပြန်ပြောင်းရင် quote ပေးတဲ့ ဘက်က ကျန်တဲ့ တစ်ဝက်ကို ထပ်ရပါတယ်။ [[mark:dock-3]] ဒီပမာဏကို revenue account
      ထဲ post လုပ်ဖို့က ledger ရဲ့ အလုပ်ပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — FX Rates (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#fx-rates",
        }
    actions:
      - { id: close-kinds, type: slide.close, at: { mark: close-kinds } }
      - { id: open-fx, type: workspace.openFile, at: { mark: open-fx }, path: fx.go }
      - id: sel-conv
        type: editor.select
        at: { mark: sel-conv }
        target:
          {
            file: fx.go,
            text: "\tFrom, To Money\n\tSource   string\n\tAt       time.Time\n}\n",
            occurrence: 1,
          }
      - { id: open-main2, type: workspace.openFile, at: { mark: open-main2 }, path: main.go }
      - id: type-record
        type: editor.type
        at: { mark: type-record }
        target: { file: main.go, after: "\"is worth\", atMid)\n", occurrence: 1 }
        text: "\n\tc := Conversion{From: eur, To: usd, Source: q.Source, At: q.At}\n\timplied := c.To.Amount * scale / c.From.Amount\n\tfmt.Println(\"stored:\", c.From, \"->\", c.To, \"from\", c.Source, \"implied\", rate(implied))\n\tfmt.Println(\"spread revenue:\", Money{eur.Amount*mid/scale - usd.Amount, \"USD\"})\n"
        cadence: line-by-line
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "spread revenue: 1.10 USD",
          timeoutMs: 8000,
        }
      - id: pt-stored
        type: console.point
        at: { mark: pt-stored }
        target: { text: "stored:", occurrence: 1 }
      - id: pt-rev
        type: console.point
        at: { mark: pt-rev }
        target: { text: "spread revenue:", occurrence: 1 }
      - { id: dock-3, type: runtime.collapseDock, at: { mark: dock-3 } }
      - {
          id: expect-file-implied,
          type: expect.file,
          at: { afterAction: run-3 },
          path: main.go,
          contains: "implied := c.To.Amount * scale / c.From.Amount",
        }

  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] Fintech interview တွေမှာ user က ယူရိုကနေ ဒေါ်လာ ပြောင်းရင် ဘာတွေ သိမ်းထားမလဲ လို့
      မေးတတ်ပါတယ်။ rate ကို သိမ်းမယ် လို့ပဲ ဖြေရင် လိုနေပါတယ်။ [[mark:iv-a]] ပထမ၊ ပေးလိုက်တဲ့ amount နဲ့
      ရလိုက်တဲ့ amount ကို currency နဲ့ တကွ သိမ်းပါ။ transactional rate က အဲဒီ နှစ်ခုကနေ ထွက်လာလို့
      သီးသန့် မလိုပါဘူး။ [[mark:iv-b]] ဒုတိယ၊ quote ဘယ်ကလာလဲ၊ ဘယ် side လဲ၊ ဘယ်အချိန်ကလဲ ဆိုတာ သိမ်းပါ၊
      canonical rate မရှိလို့ပါ။ [[mark:iv-c]] တတိယ၊ spread ကို revenue အဖြစ် book လုပ်ပြီး၊ rounding
      direction ကို တမင် ရွေးပါ။ reference rate ကိုတော့ valuation နဲ့ report အတွက်ပဲ သုံးပါ။
      [[mark:iv-d]] ပြီးရင် ကိုယ် ဘာလုပ်မလဲ ဆိုတာ ဆက်ပြောပါ။ ပြင်လို့ မရတဲ့ conversion record တစ်ခုနဲ့
      ledger posting တွေကို တစ်ပြိုင်တည်း ရေးပြီး၊ audit မှာ ဘယ်ဈေး၊ ဘယ်ကနေ၊ ဘယ်အချိန် ဆိုတာ
      ဖြေနိုင်အောင် လုပ်မယ် ဆိုတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — FX Rates (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#fx-rates",
        }
    actions:
      - { id: show-iv, type: slide.show, at: { mark: show-iv, offsetMs: -700 }, slideId: iv-1 }
      - {
          id: pt-iv-q,
          type: slide.point,
          at: { afterAction: show-iv },
          target: { x: 0.125, y: 0.184 },
        }
      - { id: iv-a, type: slide.show, at: { mark: iv-a }, slideId: iv-2 }
