lesson:
  slug: fintech-07-fx-rates
  title: "Fintech Engineering 07: FX rate ကို နားလည်ခြင်း"
  locale: my-MM
  workspace:
    lessonType: go
    name: Fintech Engineering
    entryFilePath: main.go
    files:
      fx.go: |
        package main

        import (
        	"fmt"
        	"time"
        )

        // exponent is the controlled currency set and each currency's decimal places (ISO 4217).
        var exponent = map[string]int{"EUR": 2, "USD": 2, "JPY": 0}

        // Money is an amount counted in the currency's minor units, with its currency.
        type Money struct {
        	Amount   int64
        	Currency string
        }

        // String prints 1234 EUR as "12.34 EUR".
        func (m Money) String() string {
        	return format(m.Amount, exponent[m.Currency]) + " " + m.Currency
        }

        // format prints minor units with exp decimal places: format(1234, 2) is "12.34".
        func format(minor int64, exp int) string {
        	digits := fmt.Sprintf("%0*d", exp+1, minor)
        	if exp == 0 {
        		return digits
        	}
        	return digits[:len(digits)-exp] + "." + digits[len(digits)-exp:]
        }

        // scale: a rate is an integer of millionths, so 1.098900 is 1098900. No floats.
        const scale = 1_000_000

        // rate prints 1098900 as "1.098900".
        func rate(r int64) string { return format(r, 6) }

        // Quote is a price for EUR/USD: how many USD one EUR costs.
        // Whoever quotes it buys EUR at Bid and sells EUR at Ask.
        type Quote struct {
        	Bid, Ask int64
        	Source   string
        	At       time.Time
        }

        // Conversion is what we store for a real conversion: both amounts, where the price came
        // from and when. There is no rate field: the rate falls out of the two amounts.
        type Conversion struct {
        	From, To Money
        	Source   string
        	At       time.Time
        }
      main.go: |
        package main

        import (
        	"fmt"
        	"time"
        )

        func main() {
        	q := Quote{Bid: 1098900, Ask: 1101100, Source: "quote-7",
        		At: time.Date(2026, 11, 27, 9, 30, 0, 0, time.UTC)}
        	eur := Money{100000, "EUR"} // 1000.00 EUR

        	usd := Money{eur.Amount * q.Bid / scale, "USD"}  // the user sells EUR: gets the bid
        	back := Money{usd.Amount * scale / q.Ask, "EUR"} // buys EUR back: pays the ask
        	fmt.Println("sell at bid:", eur, "->", usd)
        	fmt.Println("buy at ask: ", usd, "->", back)
        }
