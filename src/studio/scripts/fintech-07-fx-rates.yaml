# Fintech Engineering, lesson 07: FX rates (Burmese).
#
# Source: Fintech Engineering Handbook, "FX Rates" and Appendix A "Money & FX" (CC BY 4.0,
# Voytek Pitula).
# Start state: main.go holds one EUR/USD quote (bid 1.098900, ask 1.101100, rates as integers of
# millionths) and converts 1000.00 EUR to USD at the bid and back at the ask; fx.go pins Money,
# format, scale, rate(), Quote and Conversion (a stored conversion with no rate field).
# Edits, all insert-only:
#   1. mid, the spread in basis points, the USD valued at mid  -> run-2 prints 999.00 EUR at mid
#   2. a Conversion record, its implied rate, the spread revenue -> run-3 prints 1.098900, 1.10 USD
# Figures: quote (bid, ask, mid, spread in bp, direction), round (EUR -> USD -> EUR loses the
# spread; book it as revenue), kinds (transactional vs reference rate; which time), iv.
# Built by ~/Documents/fintech-course-work/tools/build-lesson.ts; fixtures by sim-go.ts --write.
