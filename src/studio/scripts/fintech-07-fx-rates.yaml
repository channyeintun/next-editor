  - id: try-it
    chapter: ကိုယ်တိုင် စမ်းကြည့်ပါ
    narration: >-
      [[mark:close-iv]] ကိုယ်တိုင် စမ်းကြည့်ဖို့ တစ်ခု ရှိပါတယ်။ [[mark:sel-try]] ဒီ quote ရဲ့ spread ကို
      ကျယ်ကြည့်ပါ။ bid ကို တစ် ဒသမ သုည ရှစ်ကိုး၊ ask ကို တစ် ဒသမ တစ်တစ်တစ် လို့ ပြောင်းပြီး run ကြည့်ပါ။
      spread က basis point နှစ်ရာ ဖြစ်သွားပြီး၊ ပြန်ပြောင်းတော့ ယူရို ကိုးရာ ရှစ်ဆယ်လောက်ပဲ ကျန်ပါမယ်။
      spread revenue ကလည်း ဒေါ်လာ ဆယ့်တစ် ဖြစ်သွားပါလိမ့်မယ်။ [[mark:recap]] ပြန်ချုပ်ရရင်၊ FX rate မှာ
      direction ရှိပြီး ဝယ်ဈေးနဲ့ ရောင်းဈေး မတူပါဘူး။ တကယ့် conversion အတွက် amount နှစ်ခုကို သိမ်းပြီး၊
      spread ကို revenue အဖြစ် မှတ်ပြီး၊ rate တိုင်းရဲ့ source နဲ့ အချိန်ကို တွဲထားရပါတယ်။ နောက် lesson
      ကနေ ledger ကို စပါမယ်။ balance column တစ်ခုကို update လုပ်ရုံနဲ့ ဘာကြောင့် မလုံလောက်လဲ၊ ငွေ ရွေ့တိုင်း
      ဘယ်ကနေ ဘယ်ကို ဆိုတာ ဘယ်လို မှတ်မလဲ ဆိုတာ ကြည့်ပါမယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — FX Rates (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#fx-rates",
        }
    actions:
      - { id: close-iv, type: slide.close, at: { mark: close-iv } }
      - id: sel-try
        type: editor.select
        at: { mark: sel-try }
        target: { file: main.go, text: "Bid: 1098900, Ask: 1101100", occurrence: 1 }

checks:
  - { type: timing.p95Ms, max: 300 }
