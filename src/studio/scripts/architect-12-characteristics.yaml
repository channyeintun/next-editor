build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 8112

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: need
    chapter: Feature တွေပဲ ပါတဲ့ requirement
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ system ရဲ့ လုပ်ငန်း တစ်ခုစီကို တာဝန်ယူတဲ့ component တွေကို ဘယ်လို ရှာဖွေရမလဲ ဆိုတာ
      လေ့လာခဲ့ပါတယ်။
      [[mark:year]] အဲဒီနောက် တစ်နှစ် ကြာသွားပါပြီ။
      [[mark:team]] ခရီးဖော် မှာ developer က ၁၈ ယောက် ဖြစ်လာပြီး၊ Booking၊ Operator နဲ့ Payment ဆိုပြီး team
      သုံးခု ခွဲထားပါတယ်။ ကိုယ်ကလည်း ခရီးဖော် ရဲ့ ပထမဆုံး architect ဖြစ်လာပါပြီ။
      [[mark:req]] ဒီနှစ်အတွက် လုပ်ရမယ့် အလုပ်တွေကို product manager လှလှ က requirement စာရွက် တစ်ခုနဲ့
      ရေးပေးထားပါတယ်။
      [[mark:sel-req]] ဒီထဲမှာ ပါတာတွေက ခရီးသည်နဲ့ ကားလိုင်းတွေ ဘာတွေ လုပ်နိုင်ရမလဲ ဆိုတဲ့ feature
      တွေချည်းပါပဲ။ ဘယ်လောက် မြန်ရမလဲ၊ ဘယ်အချိန်ထိ သုံးလို့ရနေရမလဲ၊ ဘယ်လောက် လုံခြုံရမလဲ ဆိုတာတော့
      တစ်ကြောင်းမှ မပါပါဘူး။ ဒါက လှလှ ရဲ့ အမှား မဟုတ်ပါဘူး။ requirement စာရွက် အများစုက ဒီလိုပဲ feature
      တွေကိုပဲ ရေးလေ့ရှိပါတယ်။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - { id: open-readme, type: workspace.openFile, at: { mark: year }, path: README.md }
      - id: sel-team
        type: editor.select
        at: { mark: team }
        target:
          { file: README.md, text: "- developer 18 ယောက်၊ team 3 ခု: Booking, Operator, Payment" }
      - {
          id: open-notebook,
          type: workspace.openFile,
          at: { mark: req },
          path: notebook/12-candidates.md,
        }
      - id: sel-req
        type: editor.select
        at: { mark: sel-req }
        target:
          file: notebook/12-candidates.md
          text: "- ခရီးသည်က အသွားအပြန် လက်မှတ်ကို တစ်ခါတည်း ဝယ်နိုင်ရမယ်\n- ခရီးသည်က ဝယ်ပြီးသား ထိုင်ခုံကို ပြောင်းနိုင်ရမယ်\n- ကားလိုင်းက promotion ဈေး သတ်မှတ်နိုင်ရမယ်"

  - id: incident
    chapter: ဘာလုပ်လဲ မဟုတ်၊ ဘယ်လောက် ကောင်းကောင်းလဲ
    narration: >
      [[mark:i-open]] ဒီနေရာမှာ အရင်နှစ်က သင်္ကြန် လက်မှတ် ဖွင့်ရောင်းတဲ့ မနက်ကို ပြန်သတိရကြည့်ရအောင်။
      [[mark:i-feat]] အဲဒီ မနက်က ခရီးစဉ် ရှာတာ၊ ထိုင်ခုံ ရွေးတာ၊ ငွေချေတာ ဆိုတဲ့ feature တွေ အားလုံးက
      ရေးထားတဲ့အတိုင်း အလုပ်လုပ်နေခဲ့ပါတယ်။ ပျောက်နေတဲ့ feature ဆိုတာ တစ်ခုမှ မရှိပါဘူး။
      [[mark:i-fail]] ဒါပေမဲ့ ဝင်သုံးသူက ပုံမှန်နေ့ရဲ့ ၁၅ ဆ ဖြစ်သွားတော့ app က နှစ်နာရီလောက် နှေးနေခဲ့ပြီး၊
      ထိုင်ခုံ ၃၁၂ ခုံကိုလည်း app ကနေ တစ်ခါ၊ ကောင်တာကနေ တစ်ခါ နှစ်ခါ ရောင်းမိခဲ့ပါတယ်။
      [[mark:i-gap]] ဆိုလိုတာက ပျက်ခဲ့တာက system က ဘာလုပ်ပေးလဲ ဆိုတဲ့ အပိုင်း မဟုတ်ပါဘူး။ လူတွေ အများကြီး
      ဝင်လာတဲ့အချိန်မှာ ဘယ်လောက် ကောင်းကောင်း လုပ်ပေးနိုင်လဲ ဆိုတဲ့ အပိုင်းပါ။ အဲဒီအပိုင်းကိုတော့ ဘယ်
      requirement ထဲမှာမှ မရေးခဲ့ကြပါဘူး။
      [[mark:i-name]] system က ဘာလုပ်လဲ မဟုတ်ဘဲ၊ ဘယ်လောက် ကောင်းကောင်း လုပ်နိုင်ရမလဲ ဆိုတဲ့ ဒီလို
      အရည်အသွေးတွေကို architecture characteristic လို့ ခေါ်ပါတယ်။ architect ရဲ့ အလုပ်က ဒီ အရည်အသွေးတွေကို
      ရှာဖော်ပြီး၊ system ရဲ့ ဖွဲ့စည်းပုံက အဲဒါတွေကို ထောက်ပံ့နိုင်အောင် လုပ်ပေးတာပါ။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - {
          id: draw-i-open,
          type: whiteboard.apply,
          at: { mark: i-open },
          open: true,
          clear: true,
          upsertIds: [i-title],
        }
      - {
          id: draw-i-feat,
          type: whiteboard.apply,
          at: { mark: i-feat },
          upsertIds: [i-f1, i-c1, i-f2, i-c2, i-f3, i-c3],
          drawMs: 2400,
        }
      - {
          id: draw-i-fail,
          type: whiteboard.apply,
          at: { mark: i-fail },
          upsertIds: [i-r1, i-r1-l, i-r2, i-r2-l],
          drawMs: 2000,
        }
      - {
          id: draw-i-name,
          type: whiteboard.apply,
          at: { mark: i-name },
          upsertIds: [i-char, i-char-t, i-char-s],
          drawMs: 1500,
        }

  - id: three-tests
    chapter: Characteristic ဖြစ်ဖို့ အချက် သုံးချက်
    narration: >
      [[mark:close-i]] ဒါပေမဲ့ ကောင်းစေချင်တဲ့ အရာတိုင်းကို architecture characteristic လို့ ခေါ်လို့ မရပါဘူး။
      [[mark:s-open]] characteristic တစ်ခုလို့ သတ်မှတ်ဖို့ အချက် သုံးချက်နဲ့ ကိုက်ညီရပါတယ်။
      [[mark:q-1]] ပထမ အချက်က feature မဟုတ်ရပါဘူး။ ကားလိုင်းက promotion ဈေး သတ်မှတ်နိုင်ရမယ် ဆိုတာက system
      ဘာလုပ်ပေးရမလဲ ဆိုတဲ့ feature ပါ။ characteristic ကတော့ feature တစ်ခုတည်းနဲ့ပဲ ဆိုင်တာ မဟုတ်ဘဲ၊ feature
      တွေ အားလုံးက ဘယ်လောက် ကောင်းကောင်း အလုပ်လုပ်ရမလဲ ဆိုတာကို ပြောတာပါ။
      [[mark:q-2]] ဒုတိယ အချက်က အဲဒါကို ရဖို့ system ရဲ့ structure ကို ထိရပါမယ်။ structure ဆိုတာ system ကို
      ဘယ်လို အပိုင်းတွေ ခွဲပြီး ဘယ်လို ဆက်ထားလဲ ဆိုတာပါ။ ဥပမာ ခလုတ်တွေကို ပိုကြီးကြီး ပြချင်တာမျိုးက code
      တစ်နေရာမှာ ပြင်လိုက်ရုံနဲ့ ရပါတယ်။ ထိုင်ခုံ နှစ်ခါ မရောင်းမိဖို့ကတော့ တစ်နေရာ ပြင်ရုံနဲ့ မရပါဘူး။ app ရော
      ကောင်တာရော ထိုင်ခုံ data ကို ဘယ်လမ်းကြောင်းကနေ ရေးခွင့်ပေးမလဲ ဆိုတဲ့ အထိ ပြန်စဉ်းစားရပါတယ်။
      [[mark:q-3]] တတိယ အချက်က business အောင်မြင်ဖို့ တကယ် လိုအပ်ရပါမယ်။ ခရီးဖော် အတွက် ထိုင်ခုံ မမှားတာက
      မရှိမဖြစ်ပါ။ တစ်ဖက်မှာတော့ app ကို ဘာသာစကား ၂၀ နဲ့ သုံးလို့ရတာမျိုးက ရှိရင် ကောင်းပေမဲ့၊ အခု ခရီးဖော် ရဲ့
      အောင်မြင်မှုကို ဆုံးဖြတ်ပေးတာ မဟုတ်ပါဘူး။
      [[mark:q-all]] ဒီ သုံးချက်လုံးနဲ့ ကိုက်ညီမှ architecture characteristic အဖြစ် ထည့်စဉ်းစားရမှာပါ။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - { id: close-i, type: whiteboard.apply, at: { mark: close-i }, open: false }
      - {
          id: show-tests,
          type: slide.show,
          at: { mark: s-open, offsetMs: -1200 },
          slideId: three-tests,
        }
      - { id: point-test-1, type: slide.point, at: { mark: q-1 }, target: { x: 0.15, y: 0.43 } }
      - { id: point-test-2, type: slide.point, at: { mark: q-2 }, target: { x: 0.15, y: 0.59 } }
      - { id: point-test-3, type: slide.point, at: { mark: q-3 }, target: { x: 0.15, y: 0.75 } }

  - id: families
    chapter: Characteristic အုပ်စု သုံးစု
    narration: >
      [[mark:fam-open]] characteristic တွေက အများကြီး ရှိပါတယ်။ အားလုံးကို အလွတ်ကျက်စရာ မလိုဘဲ၊ အုပ်စု သုံးစု
      ခွဲပြီး မှတ်ထားရင် ရပါတယ်။
      [[mark:fam-1]] ပထမ အုပ်စုက operational ပါ။ system က run နေတဲ့အချိန်မှာ ဘယ်လို ပြုမူလဲ ဆိုတာနဲ့
      ဆိုင်ပါတယ်။ သုံးချင်တဲ့အချိန် သုံးလို့ရနေတာကို availability၊ တုံ့ပြန်တာ ဘယ်လောက် မြန်လဲ ဆိုတာကို
      performance လို့ ခေါ်ပါတယ်။ user တဖြည်းဖြည်း များလာလည်း ခံနိုင်တာက scalability ပါ။ သင်္ကြန်မနက်လို
      ရုတ်တရက် တက်လာတဲ့ load ကို ချက်ချင်း လိုက်နိုင်တာကတော့ elasticity ပါ။
      [[mark:fam-2]] ဒုတိယ အုပ်စုက structural ပါ။ code ရဲ့ ဖွဲ့စည်းပုံနဲ့ ဆိုင်ပြီး developer တွေက နေ့တိုင်း
      ခံစားရတာတွေပါ။ နောက်လူတွေ ဆက်ပြင်ရတာ ဘယ်လောက် လွယ်လဲ ဆိုတဲ့ maintainability၊ ပြောင်းလဲမှုကို
      production ဆီ ဘယ်လောက် မြန်မြန် ပို့နိုင်လဲ ဆိုတဲ့ deployability နဲ့၊ မှန်မမှန် စစ်ရတာ ဘယ်လောက် လွယ်လဲ
      ဆိုတဲ့ testability တို့ ပါဝင်ပါတယ်။
      [[mark:fam-3]] တတိယ အုပ်စုက cross cutting ပါ။ အပိုင်း တစ်ခုတည်းနဲ့ မဆိုင်ဘဲ system တစ်ခုလုံးကို ဖြတ်ပြီး
      သက်ရောက်တာတွေပါ။ security၊ ခရီးသည်ရဲ့ ကိုယ်ရေးအချက်အလက်ကို ကာကွယ်တဲ့ privacy၊ မျက်စိ
      အားနည်းသူတွေလို မသန်စွမ်းသူတွေပါ သုံးနိုင်အောင် လုပ်ပေးတဲ့ accessibility နဲ့၊ ဥပဒေက သတ်မှတ်ထားတဲ့ အချက်တွေ ဒီထဲမှာ
      ပါဝင်ပါတယ်။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - {
          id: show-families,
          type: slide.show,
          at: { mark: fam-open, offsetMs: -1200 },
          slideId: three-families,
        }
      - { id: point-fam-1, type: slide.point, at: { mark: fam-1 }, target: { x: 0.15, y: 0.43 } }
      - { id: point-fam-2, type: slide.point, at: { mark: fam-2 }, target: { x: 0.15, y: 0.59 } }
      - { id: point-fam-3, type: slide.point, at: { mark: fam-3 }, target: { x: 0.15, y: 0.75 } }

  - id: candidates
    chapter: ခရီးဖော် အတွက် candidate စာရင်း
    narration: >
      [[mark:close-fam]] ဒါဆို ခရီးဖော် အတွက် ဘယ် characteristic တွေ လိုနိုင်မလဲ ဆိုတာ စာရင်း
      ပြုစုကြည့်ရအောင်။ အရေးကြီးတာက characteristic တစ်ခုချင်းစီကို business ထဲက ဘယ်စကား၊ ဘယ်အဖြစ်အပျက်က
      ဆိုလိုနေတာလဲ ဆိုတာနဲ့ တွဲရေးဖို့ပါ။
      [[mark:type-1]] ပထမ တစ်ခုက elasticity ပါ။ သင်္ကြန် လက်မှတ် ဖွင့်တဲ့ မနက်မှာ လူတွေ တစ်ပြိုင်တည်း
      ဝင်လာတာက ဒီ အရည်အသွေးကို တောင်းဆိုနေတာပါ။
      [[mark:type-2]] ဒုတိယက data integrity ပါ။ data က အမြဲ မှန်ကန်နေရမယ် ဆိုတဲ့ အရည်အသွေးပါ။ ခရီးဖော်
      အတွက်ဆိုရင် ထိုင်ခုံ တစ်ခုံကို လူ တစ်ယောက်ပဲ ပိုင်ရမယ် ဆိုတာပါ။
      [[mark:type-3]] တတိယက ကောင်တာအတွက် availability ပါ။ ကားဂိတ်မှာ internet က မကြာခဏ အားနည်းပေမဲ့၊
      ကောင်တာ ဝန်ထမ်းကတော့ ရှေ့မှာ ရပ်နေတဲ့ ခရီးသည်ကို လက်မှတ် ရောင်းပေးနိုင်ရပါမယ်။
      [[mark:type-4]] စတုတ္ထက deployability ပါ။ team သုံးခုလုံးက app တစ်ခုတည်းကို အတူ release လုပ်ရတော့
      တစ်ပတ်မှာ တစ်ခါပဲ ထွက်နိုင်ပြီး၊ team တစ်ခုရဲ့ bug က ကျန်တဲ့ team တွေရဲ့ release ကိုပါ တားနေပါတယ်။
      [[mark:type-5]] ပဉ္စမက security ပါ။ ဒါကတော့ wallet ကုမ္ပဏီနဲ့ ချုပ်ထားတဲ့ စာချုပ်ထဲမှာ ငွေချေမှု data ကို
      လုံခြုံအောင် ထားရမယ်လို့ ရေးထားပြီးသားပါ။
      [[mark:sel-written]] ဒီ ငါးခုထဲမှာ စာနဲ့ ရေးထားတာက ဒီ တစ်ခုပဲ ရှိပါတယ်။ ကျန်တဲ့ လေးခုကိုတော့ ဘယ်သူမှ
      မရေးခဲ့ပါဘူး။ ထိုင်ခုံကို နှစ်ခါ မရောင်းပါနဲ့လို့ ဘယ်ကားလိုင်းကမှ ရေးမပေးပါဘူး။ ရေးစရာ မလိုအောင်
      သိသာတယ်လို့ ထင်ထားကြလို့ပါ။ ဒါပေမဲ့ တကယ် ဖြစ်လာတဲ့နေ့မှာတော့ အားလုံးက စိတ်ဆိုးကြပါတယ်။
      [[mark:type-count]] ဒါကြောင့် characteristic အများစုကို requirement ထဲမှာ ရှာလို့ မတွေ့နိုင်ပါဘူး။ business
      ကို နားလည်အောင် လုပ်ပြီး၊ ဆိုလိုရင်းကို ကိုယ်တိုင် ဖော်ထုတ်ယူရတာပါ။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - { id: close-families, type: slide.close, at: { mark: close-fam } }
      - id: type-1
        type: editor.type
        at: { mark: type-1 }
        cadence: line-by-line
        target: { file: notebook/12-candidates.md, after: "| ရေးထားလား |\n|---|---|---|\n" }
        text: "| elasticity | သင်္ကြန် လက်မှတ် ဖွင့်တဲ့ မနက် လူ 15 ဆ ဝင်လာတယ် | မရေး |\n"
      - id: type-2
        type: editor.type
        at: { mark: type-2 }
        cadence: line-by-line
        target: { file: notebook/12-candidates.md, after: "လူ 15 ဆ ဝင်လာတယ် | မရေး |\n" }
        text: "| data integrity | ထိုင်ခုံ တစ်ခုံကို နှစ်ခါ မရောင်းရဘူး | မရေး |\n"
      - id: type-3
        type: editor.type
        at: { mark: type-3 }
        cadence: line-by-line
        target: { file: notebook/12-candidates.md, after: "နှစ်ခါ မရောင်းရဘူး | မရေး |\n" }
        text: "| availability | ကောင်တာက internet မကောင်းလည်း ရောင်းရမယ် | မရေး |\n"
      - id: type-4
        type: editor.type
        at: { mark: type-4 }
        cadence: line-by-line
        target: { file: notebook/12-candidates.md, after: "မကောင်းလည်း ရောင်းရမယ် | မရေး |\n" }
        text: "| deployability | team 3 ခု၊ release က တစ်ပတ် တစ်ခါပဲ | မရေး |\n"
      - id: type-5
        type: editor.type
        at: { mark: type-5 }
        cadence: line-by-line
        target: { file: notebook/12-candidates.md, after: "တစ်ပတ် တစ်ခါပဲ | မရေး |\n" }
        text: "| security | wallet ကုမ္ပဏီနဲ့ စာချုပ်: ငွေချေမှု data လုံခြုံရမယ် | ရေးထား |\n"
      - id: sel-written
        type: editor.select
        at: { mark: sel-written }
        target: { file: notebook/12-candidates.md, text: "| ရေးထား |" }
      - id: type-count
        type: editor.type
        at: { mark: type-count }
        cadence: line-by-line
        target: { file: notebook/12-candidates.md, after: "data လုံခြုံရမယ် | ရေးထား |\n" }
        text: "\nရေးထားတာ 1 ခု၊ မရေးဘဲ ဆိုလိုနေတာ 4 ခု\n"
      - id: expect-row
