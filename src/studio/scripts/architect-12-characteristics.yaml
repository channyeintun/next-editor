  - id: tension
    chapter: တစ်ခု တိုးရင် တစ်ခု လျော့တယ်
    narration: >
      [[mark:t-open]] ဒါဆို ဒီ ငါးခုလုံးကို အပြည့်အဝ ရအောင် လုပ်လိုက်ရင် မပြီးဘူးလားလို့ မေးစရာ ရှိပါတယ်။
      အဲဒီလို လုပ်လို့ မရပါဘူး။ ဘာကြောင့်လဲ ဆိုတာ ကောင်တာရဲ့ အခြေအနေနဲ့ ကြည့်ရအောင်။
      [[mark:t-two]] ကောင်တာမှာ characteristic နှစ်ခု လိုပါတယ်။ internet မကောင်းလည်း ရောင်းလို့ရရမယ် ဆိုတဲ့
      availability နဲ့၊ ထိုင်ခုံ နှစ်ခါ မရောင်းမိရဘူး ဆိုတဲ့ data integrity ပါ။
      [[mark:t-left]] availability ကို အပြည့် ပေးချင်ရင် internet ပြတ်နေတဲ့အချိန်မှာလည်း ကောင်တာက
      ဆက်ရောင်းနိုင်ရပါမယ်။ ဒါပေမဲ့ အဲဒီအချိန်မှာ app ဘက်က ဘယ်ခုံတွေ ရောင်းပြီးပြီလဲ ဆိုတာကို ကောင်တာက
      မသိနိုင်တော့၊ ခုံ တစ်ခုံကို နှစ်ခါ ရောင်းမိနိုင်ပါတယ်။
      [[mark:t-right]] data integrity ကို အပြည့် ပေးချင်ရင်တော့ ကောင်တာက ရောင်းတိုင်း ဗဟိုက ထိုင်ခုံ စာရင်းကို
      အရင် စစ်ရပါမယ်။ ဒီလိုဆိုရင် internet ပြတ်တာနဲ့ ကောင်တာက ဘာမှ ရောင်းလို့ မရတော့ပါဘူး။
      [[mark:t-pull]] တစ်ခုကို တိုးလိုက်ရင် နောက်တစ်ခုက လျော့သွားတာပါ။ နှစ်ခုလုံးကို တစ်ပြိုင်တည်း အပြည့်
      ရဖို့ဆိုတာ မဖြစ်နိုင်ပါဘူး။
      [[mark:t-cost]] တစ်ခုနဲ့တစ်ခု ဆန့်ကျင်မနေတဲ့ characteristic တွေမှာလည်း အခမဲ့ ရတာ တစ်ခုမှ မရှိပါဘူး။ တစ်ခုကို
      ထောက်ပံ့တိုင်း design ဆွဲရတဲ့ အချိန်၊ ဆောက်ရတဲ့ အချိန်နဲ့ ထိန်းသိမ်းရတဲ့ ကုန်ကျစရိတ်တွေ ပါလာပါတယ်။
      [[mark:t-few]] ဒါကြောင့် မေးရမယ့် မေးခွန်းက characteristic ဘယ်နှခုကို ထောက်ပံ့နိုင်မလဲ ဆိုတာ
      မဟုတ်ပါဘူး။ ဒီ system အတွက် တကယ် အရေးကြီးတဲ့ အနည်းငယ်က ဘယ်ဟာတွေလဲ ဆိုတာပါ။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - {
          id: draw-t-open,
          type: whiteboard.apply,
          at: { mark: t-open },
          open: true,
          clear: true,
          upsertIds: [p-title],
        }
      - {
          id: draw-t-two,
          type: whiteboard.apply,
          at: { mark: t-two },
          upsertIds: [p-av, p-av-t, p-av-s, p-di, p-di-t, p-di-s],
          drawMs: 2400,
        }
      - {
          id: draw-t-left,
          type: whiteboard.apply,
          at: { mark: t-left },
          upsertIds: [p-q, p-q-l, p-av-cost],
          drawMs: 1500,
        }
      - {
          id: draw-t-right,
          type: whiteboard.apply,
          at: { mark: t-right },
          upsertIds: [p-di-cost],
          drawMs: 800,
        }
      - {
          id: draw-t-pull,
          type: whiteboard.apply,
          at: { mark: t-pull },
          upsertIds: [p-pull-l, p-pull-r],
          drawMs: 1000,
        }
      - {
          id: draw-t-few,
          type: whiteboard.apply,
          at: { mark: t-few },
          upsertIds: [p-few],
          drawMs: 1200,
        }

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ ဒီ စာကြောင်း နှစ်ကြောင်းထဲက ဘယ်ဟာက architecture characteristic ကို
      ပြောနေတာလဲ။
      [[mark:q-a]] ပထမ စာကြောင်းက ခရီးသည်က wallet နဲ့ ငွေချေနိုင်ရမယ် ဆိုတာပါ။
      [[mark:q-b]] ဒုတိယ စာကြောင်းကတော့ ငွေချေနေတုန်း wallet ကုမ္ပဏီဘက်က ခဏ ကျသွားရင်တောင် ခရီးသည်ရဲ့ ငွေ မပျောက်ရဘူး ဆိုတာပါ။ lesson ကို
      pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ စာကြောင်းပါ။
      [[mark:q-why]] ဘာကြောင့်လဲဆိုတော့ ပထမ စာကြောင်းက system ဘာလုပ်ပေးရမလဲ ဆိုတဲ့ feature ကို ပြောတာပါ။
      ဒုတိယ စာကြောင်းကတော့ အဲဒီ feature က ဘယ်လို အခြေအနေမှာ ဘယ်လောက် ကောင်းကောင်း အလုပ်လုပ်ရမလဲ ဆိုတာကို
      ပြောတာပါ။
      [[mark:q-more]] ပြီးတော့ ဒါကို ရဖို့ code တစ်နေရာ ပြင်ရုံနဲ့ မရပါဘူး။ ငွေချေတာ တစ်ဝက်မှာ ရပ်သွားရင် ဘယ်အပိုင်းက
      မှတ်ထားမလဲ၊ ဘယ်အပိုင်းက နောက်မှ ပြန်စစ်မလဲ ဆိုတဲ့ structure ကို ထိပါတယ်။ မရခဲ့ရင်လည်း ခရီးသည်တွေရဲ့
      ယုံကြည်မှု ပျောက်သွားမှာမို့ business ကို တိုက်ရိုက် ထိခိုက်ပါတယ်။ အချက်
      သုံးချက်လုံးနဲ့ ကိုက်ညီတာကြောင့် ဒါက characteristic တစ်ခုပါ။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          clear: true,
          upsertIds: [z-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [z-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [z-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [z-b-line, z-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-why,
          type: whiteboard.apply,
          at: { mark: q-why },
          upsertIds: [z-why],
          drawMs: 1200,
        }

  - id: your-turn
    chapter: ကိုယ့် system အတွက်
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ ကိုယ့် project မှာလည်း ဘယ်သူမှ မရေးထားပေမဲ့ လူတိုင်းက မျှော်လင့်ထားတဲ့
      characteristic တွေ ရှိနေမှာပါ။ lesson ကို pause လုပ်ပြီး ဒီ table ထဲမှာ ကိုယ့် system ရဲ့ မရေးထားတဲ့
      characteristic နှစ်ခုကို၊ ဘယ်စကား ဒါမှမဟုတ် ဘယ်အဖြစ်အပျက်က ဆိုလိုနေလဲ ဆိုတာနဲ့ တွဲပြီး ရေးကြည့်ပါ။
      [[mark:turn-2]] ရှာရ ခက်နေရင် နောက်ဆုံး ဖြစ်ခဲ့တဲ့ ပြဿနာကြီး တစ်ခုကို ပြန်စဉ်းစားကြည့်ပါ။ feature က
      မှန်နေရက်နဲ့ လူတွေ စိတ်ဆိုးခဲ့ရတယ်ဆိုရင်၊ အဲဒီနေရာမှာ မရေးထားတဲ့ characteristic တစ်ခု ရှိနေတတ်ပါတယ်။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: turn }, open: false }
      - id: sel-rows
        type: editor.select
        at: { mark: turn, offsetMs: 2200 }
        target:
          file: notebook/12-candidates.md
          text: "| elasticity | သင်္ကြန် လက်မှတ် ဖွင့်တဲ့ မနက် လူ 15 ဆ ဝင်လာတယ် | မရေး |\n| data integrity | ထိုင်ခုံ တစ်ခုံကို နှစ်ခါ မရောင်းရဘူး | မရေး |"

  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ requirement ထဲမှာ feature တွေပဲ ပါတတ်ပေမဲ့၊ system ကို အောင်မြင်စေတာ၊
      ကျရှုံးစေတာကတော့ ဘယ်လောက် ကောင်းကောင်း လုပ်နိုင်လဲ ဆိုတဲ့ architecture characteristic တွေပါ။ feature
      မဟုတ်ဘဲ structure ကို ထိပြီး၊ business အောင်မြင်ဖို့ လိုအပ်တဲ့ အရည်အသွေးတွေပါ။ အများစုကို ဘယ်သူမှ
      ရေးမထားတတ်ပါဘူး။ တစ်ခုကို တိုးရင် နောက်တစ်ခု လျော့တတ်တာမို့၊ အကုန်လုံးကို မလိုက်ဘဲ အရေးကြီးတဲ့
      အနည်းငယ်ကို ရွေးရပါတယ်။
      [[mark:next]] နောက် lesson မှာတော့ business ဘက်က ပြောတဲ့ စကားတွေကနေ characteristic တွေကို ဘယ်လို
      ဘာသာပြန်ယူမလဲ၊ အရေးကြီးဆုံး သုံးခုကို ဘယ်လို ရွေးမလဲ ဆိုတာကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - id: sel-count
        type: editor.select
        at: { mark: recap }
        target: { file: notebook/12-candidates.md, text: "ရေးထားတာ 1 ခု၊ မရေးဘဲ ဆိုလိုနေတာ 4 ခု" }

