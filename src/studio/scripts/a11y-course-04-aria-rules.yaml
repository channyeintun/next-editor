# Accessibility course, lesson 4: when (and when not) to use ARIA.
#
# Continues lesson 3. A board on where ARIA came from (ARIA 1.0 and HTML5,
# both W3C Recommendations in 2014; ARIA 1.2 in 2023), a board with the five
# rules of ARIA use and the WebAIM Million 2026 finding for rule 1, then the tea
# shop page with realistic ARIA misuse: an icon-only button with no name, an
# order "button" made of a span with role="button" but no focus, and a labelled
# dashed "don't" box (a heading given role="tab", and aria-hidden around a
# focusable link) kept on the page for comparison. Fixes are insert-only:
# tabindex="0" on the span (rule 3, explicitly "only if you truly cannot use a
# button"), aria-label on the icon button (rule 5). Rules 2 and 4 are shown
# with the panel rows and tab badges on the don't box. A last board covers
# ARIA in HTML (don't override, don't repeat, side effects) and complexity.
#
# Built from template.yaml + ws/ (pinned byte-exact) with:
#   bun ~/Documents/a11y-course-work/probe/build.ts template.yaml ws a11y-course-04-aria-rules.yaml
# Validate with (from the repo root):
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   ~/Documents/a11y-course-work/tools/verify.sh <this file>
schemaVersion: 1

lesson:
  slug: a11y-course-04-aria-rules
  title: "Accessibility course 4: ARIA ကို ဘယ်အချိန် သုံးမလဲ"
  locale: my-MM
  workspace:
    lessonType: javascript
    name: Accessibility course
    entryFilePath: index.html
    files:
      base.css: |
        /*
          base.css: pinned, never typed during a lesson.
          The shop's palette and page furniture, in its accessible form: every text
          colour passes WCAG AA, form fields have 3:1 borders, nothing hides focus.
          A lesson keeps the sections it needs and drops any declaration its own demo
          types or relies on being absent (COURSE-KIT.md, "Deriving a lesson
          workspace"). Section E holds the few rules a start state pins on purpose,
          including deliberately broken ones (a pale colour, a removed outline).
          Keep it free of the url, image-set and @-import functions (they switch on
          Vite's postcss step); images come from <img>.
        */

        /* == A. palette == */
        :root {
          color-scheme: light;
          --tea-dark: #3b2314;
          --tea: #8b5a2b;
          --tea-light: #c9a27e;
          --cream: #fff8ec;
          --paper: #fdf3e1;
          --leaf: #2f6b3a;
          --gold: #c9a227;
          --chili: #b23a2b;
          --ink: #2b1d14;
          --muted: #6b5a4c;
          --line: #e6d5bf;
          --field: #8a7866;
          --radius: 12px;
        }

        /* == B. page == */
        body {
          margin: 0;
          font-family: "Noto Sans Myanmar", "Myanmar Sangam MN", "Myanmar MN", "Myanmar Text", "Padauk",
            system-ui, sans-serif;
          font-size: 16px;
          line-height: 1.8;
          color: var(--ink);
          background: var(--paper);
        }

        .page {
          padding: 0 16px 24px;
        }

        h1,
        h2,
        h3 {
          margin: 0 0 8px;
          line-height: 1.5;
        }

        h1 {
          font-size: 22px;
        }

        h2 {
          font-size: 20px;
        }

        h3 {
          font-size: 17px;
        }

        a {
          color: var(--tea);
        }

        /* A class that sets display must never un-hide a [hidden] element. */
        [hidden] {
          display: none !important;
        }

        /* Text for screen readers only (the forms and images lessons use it). */
        .visually-hidden {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip-path: inset(50%);
          white-space: nowrap;
        }

        /* == B2. reset == */
        *,
        *::before,
        *::after {
          box-sizing: border-box;
        }

        /* == C. furniture == */
        .skip-link {
          position: absolute;
          top: -48px;
          left: 8px;
          padding: 4px 12px;
          background: var(--cream);
          color: var(--tea-dark);
        }

        .skip-link:focus {
          top: 8px;
        }

        .site-header {
          padding: 12px 16px;
          background: var(--tea-dark);
          color: var(--cream);
        }

        .site-header a {
          color: var(--cream);
        }

        .brand {
          display: flex;
          align-items: center;
          gap: 8px;
        }

        .logo {
          display: block;
        }

        .shop-name {
          margin: 0;
          flex: 1;
        }

        .call-link {
          display: inline-flex;
          padding: 8px;
          border-radius: 999px;
          background: var(--tea);
        }

        .call-link img {
          display: block;
        }

        .tagline {
          margin: 0;
          color: var(--tea-light);
          font-size: 14px;
        }

        .nav ul {
          display: flex;
          gap: 16px;
          margin: 4px 0 0;
          padding: 0;
          list-style: none;
        }

        .hero {
          margin: 16px 0;
          padding: 16px;
          background: var(--cream);
          border-radius: var(--radius);
        }

        .divider {
          display: block;
          max-width: 100%;
          height: auto;
          margin: 0 auto 16px;
        }

        .menu {
          margin: 0;
          padding: 0;
          list-style: none;
        }

        .menu-card {
          margin: 0 0 12px;
          padding: 12px 16px;
          background: #fff;
          border: 1px solid var(--line);
          border-radius: var(--radius);
        }

        .menu-card .name,
        .menu-card .desc {
          margin: 0;
        }

        .menu-card .desc {
          color: var(--muted);
          font-size: 14px;
        }

        .price {
          font-weight: 700;
          color: var(--tea);
        }

        .status {
          margin-left: 8px;
          color: var(--chili);
          font-size: 14px;
        }

        .sold-out .name {
          text-decoration: line-through;
        }

        .order-link,
        .order-btn,
        .confirm-btn,
        .disclosure,
        .fav,
        .confirm button {
          display: inline-block;
          padding: 6px 16px;
          border: 0;
          border-radius: 999px;
          background: var(--tea);
          color: #fff;
          font: inherit;
          text-decoration: none;
        }

        .fav {
          margin-left: 8px;
          padding: 0 12px;
          font-size: 14px;
        }

        .fav[aria-pressed="true"] {
          background: var(--leaf);
        }

        .tea-options {
          margin: 16px 0;
        }

        .chips {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
          margin: 12px 0 0;
          padding: 0;
          list-style: none;
        }

        .chips li {
          padding: 2px 12px;
          border: 1px solid var(--field);
          border-radius: 999px;
          background: #fff;
        }

        .gallery figure {
          margin: 0 0 12px;
        }

        .gallery img {
          display: block;
          max-width: 100%;
          height: auto;
          border-radius: var(--radius);
        }

        figcaption {
          color: var(--muted);
          font-size: 14px;
        }

        .quote {
          margin: 16px 0;
          padding: 8px 16px;
          border-left: 4px solid var(--tea);
          background: var(--cream);
          font-style: italic;
        }

        .quote p {
          margin: 0;
        }

        .hours-table {
          width: 100%;
          border-collapse: collapse;
          background: #fff;
        }

        .hours-table caption {
          text-align: start;
          color: var(--muted);
          font-size: 14px;
        }

        .hours-table th,
        .hours-table td {
          padding: 4px 8px;
          border: 1px solid var(--line);
          text-align: start;
        }

        .hours-table thead th {
          background: var(--cream);
        }

        .location {
          margin: 16px 0;
        }

        .map {
          position: relative;
          height: 120px;
          border: 1px solid var(--field);
          border-radius: var(--radius);
          background:
            linear-gradient(90deg, transparent 46%, #fff 46%, #fff 54%, transparent 54%),
            linear-gradient(0deg, transparent 40%, #fff 40%, #fff 50%, transparent 50%),
            #d9e8c9;
        }

        .map-pin {
          position: absolute;
          top: 34px;
          left: 56%;
          width: 18px;
          height: 18px;
          border: 3px solid #fff;
          border-radius: 50%;
          background: var(--chili);
        }

        .address {
          margin: 4px 0 0;
        }

        .order-form {
          margin: 16px 0;
        }

        .order-form label {
          display: block;
          margin-top: 8px;
        }

        .order-form input[type="text"],
        .order-form input[type="tel"],
        .order-form input[type="number"] {
          width: 100%;
          padding: 6px 10px;
          border: 1px solid var(--field);
          border-radius: 8px;
          background: #fff;
          font: inherit;
        }

        .hint {
          margin: 2px 0 0;
          color: var(--muted);
          font-size: 14px;
        }

        .sugar {
          margin: 12px 0 0;
          padding: 4px 12px 8px;
          border: 1px solid var(--field);
          border-radius: 8px;
        }

        .sugar label {
          display: inline-block;
          margin: 0 12px 0 0;
        }

        .order-btn {
          margin-top: 12px;
        }

        .error {
          margin: 2px 0 0;
          color: var(--chili);
          font-size: 14px;
        }

        .alert {
          margin: 8px 0 0;
          padding: 8px 12px;
          border-radius: 8px;
          background: #fde8e4;
          color: var(--chili);
        }

        .order-status {
          min-height: 1.8em;
          margin: 8px 0 0;
          color: var(--leaf);
          font-weight: 700;
        }

        .confirm {
          margin: 16px auto auto;
          max-width: 320px;
          padding: 16px;
          border: 0;
          border-radius: var(--radius);
          background: var(--cream);
          color: var(--ink);
        }

        .confirm::backdrop {
          background: rgb(0 0 0 / 0.25);
        }

        .confirm form {
          display: flex;
          gap: 8px;
        }

        .site-footer {
          margin-top: 24px;
          padding: 16px;
          background: var(--tea-dark);
          color: var(--cream);
          font-size: 14px;
        }

        .site-footer p {
          margin: 0;
        }

        .site-footer a {
          color: var(--cream);
        }

        /* == D. helpers == */
        /* .demo shows a box's edges without changing layout (outline takes no space). */
        .demo {
          outline: 1px dashed var(--muted);
        }

        /* Lesson 4: the order line and the labelled "don't" box (examples of ARIA
           misuse kept on the page for comparison; never typed). */
        .order-box {
          margin: 12px 0;
        }

        .dont {
          margin: 16px 0 0;
          padding: 8px 12px;
        }

        .dont-label {
          margin: 0;
          color: var(--chili);
          font-size: 14px;
        }

        /* == E. lesson rules == */
        /* Empty in the kit. A start state may pin a few rules here (a pale colour for
           the contrast lesson, outline: none for the focus lesson); each is listed in
           the lesson's start state and never shown. */
      index.html: |
        <!doctype html>
        <html lang="my">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <link rel="icon" href="data:," />
            <title>ရွှေလက်ဖက်ရည်ဆိုင်</title>
            <link rel="stylesheet" href="/base.css" />
            <link rel="stylesheet" href="/styles.css" />
          </head>
          <body>
            <header class="site-header" data-testid="site-header">
              <div class="brand">
                <img class="logo" src="/cup.svg" alt="" width="40" height="40" data-testid="logo" />
                <h1 class="shop-name" data-testid="shop-name">ရွှေလက်ဖက်ရည်ဆိုင်</h1>
              </div>
            </header>

            <main class="page" id="main" data-testid="main">
              <section class="menu-section" id="drinks" data-testid="drinks">
                <h2 data-testid="drinks-title">သောက်စရာ</h2>
                <ul class="menu" data-testid="menu-drinks">
                  <li class="menu-card featured" data-testid="card-laphet-yay">
                    <h3 class="name">လက်ဖက်ရည်</h3>
                    <span class="price" data-testid="price-laphet-yay">1,500 ကျပ်</span>
                    <button type="button" class="fav" data-testid="icon-btn"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 14 2 8a3 3 0 0 1 6-4 3 3 0 0 1 6 4z" fill="#fff"/></svg></button>
                  </li>
                </ul>
              </section>

              <section class="order-box" id="order" data-testid="order-box">
                <span class="order-btn" role="button" data-say="မှာပြီးပါပြီ" data-target="#order-status" data-testid="order-span">မှာမယ်</span>
                <p class="order-status" id="order-status" role="status" data-testid="order-status"></p>
              </section>

              <div class="demo dont" data-testid="dont-box">
                <p class="dont-label">✗ ဒီလို မလုပ်ပါနဲ့</p>
                <h2 role="tab" data-testid="dont-heading">စားစရာ</h2>
                <div aria-hidden="true" data-testid="dont-hidden">
                  <a href="#order" data-testid="dont-link">မှာယူရန်</a>
                </div>
              </div>
            </main>

            <script type="module" src="/kit.js"></script>
