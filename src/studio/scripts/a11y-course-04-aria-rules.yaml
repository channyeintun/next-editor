build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 2604

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  - id: intro
    chapter: "ARIA ဘယ်က လာလဲ"
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ div ခလုတ်ကို တကယ့် button element နဲ့ အစားထိုးပြီး၊ accessibility
      tree ထဲမှာ role၊ name၊ state ပေါ်လာတာကို မြင်ခဲ့ပါတယ်။ ARIA ဆိုတာ tree မှာ ပြတာကိုပဲ
      ပြောင်းပေးတဲ့ attribute တွေ ဖြစ်တယ် ဆိုတာလည်း ပြောခဲ့ပါတယ်။ [[mark:start-server]] ဒီ
      lesson မှာတော့ ARIA ကို ဘယ်အချိန် သုံးရမလဲ၊ ဘယ်အချိန် မသုံးရဘူးလဲ ဆိုတာကို ကြည့်ပါမယ်။
      [[mark:draw-aria]] ARIA ကို W3C ထဲက web accessibility အတွက် အလုပ်လုပ်တဲ့ WAI အဖွဲ့က
      ရေးခဲ့တာ ဖြစ်ပြီး၊ ပထမ version ကို ၂၀၁၄ ခုနှစ်မှာ စံနှုန်း အဖြစ် ထုတ်ခဲ့ပါတယ်။
      အဲဒီတုန်းက HTML မှာ ပြောင်းလဲနေတဲ့ content တွေ၊ ကိုယ်တိုင် ဆောက်ထားတဲ့ control တွေကို
      assistive technology ဆီ ပြောပြဖို့ နည်းလမ်း မရှိသေးလို့ ARIA ကို ဖန်တီးခဲ့တာပါ။
      [[mark:draw-html5]] အဲဒီနှစ်မှာပဲ HTML ရဲ့ version အသစ်လည်း စံနှုန်း ဖြစ်လာပါတယ်။ header၊ nav၊ main
      လို element တွေ၊ hidden၊ required လို attribute တွေ ပါလာတဲ့အတွက်၊ အရင်က ARIA နဲ့
      လုပ်ရတဲ့ အလုပ် အများကြီးကို HTML ကိုယ်တိုင် လုပ်ပေးနိုင်လာပါတယ်။ [[mark:draw-today]]
      ဒါပေမဲ့ HTML မှာ မရှိသေးတဲ့ role၊ state၊ property တွေ ရှိနေသေးလို့ ARIA က အသုံးဝင်နေဆဲပါ။
      အခု နောက်ဆုံး စံနှုန်းကတော့ ၂၀၂၃ မှာ ထွက်ခဲ့တဲ့ ARIA ၁.၂ ပါ။
    sources:
      - title: "web.dev Learn Accessibility — ARIA and HTML: introduction and when to use ARIA"
        url: "https://web.dev/learn/accessibility/aria-html"
      - title: "W3C — WAI-ARIA 1.0 (W3C Recommendation, 20 March 2014)"
        url: "https://www.w3.org/TR/wai-aria-1.0/"
      - title: "W3C WAI — WAI-ARIA overview (ARIA 1.2 Recommendation, 6 June 2023)"
        url: "https://www.w3.org/WAI/standards-guidelines/aria/"
      - title: "W3C — HTML5 (W3C Recommendation, 28 October 2014)"
        url: "https://www.w3.org/TR/2014/REC-html5-20141028/"
    actions:
      - id: open-history-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      # Runs in the background (boot + pnpm install + spawn); waitForReady sits
      # on the preview mark in the code tour, two boards of narration later.
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-aria
        type: whiteboard.apply
        at: { mark: draw-aria }
        upsertIds: [a-aria]
        drawMs: 1400
      - id: draw-html5
        type: whiteboard.apply
        at: { mark: draw-html5 }
        upsertIds: [a-html5, a-html5b]
        drawMs: 1800
      - id: draw-today
        type: whiteboard.apply
        at: { mark: draw-today }
        upsertIds: [a-today]
        drawMs: 1400

  - id: rules
    chapter: "စည်းကမ်း ငါးချက်"
    narration: >
      [[mark:draw-rules]] ARIA ကို မှန်မှန်ကန်ကန် သုံးနိုင်ဖို့ W3C က စည်းကမ်း ငါးချက်
      ထုတ်ထားပါတယ်။ native HTML ကို အရင် သုံးဖို့၊ မလိုတဲ့ role မထည့်ဖို့၊ keyboard နဲ့
      သုံးလို့ ရအောင် လုပ်ဖို့၊ focus ရတဲ့ element ကို မဖျောက်ဖို့နဲ့၊ interactive element
      တိုင်းမှာ name ရှိဖို့ပါ။ [[mark:circle-rule-one]] အရေးအကြီးဆုံးက ပထမ စည်းကမ်းပါ။
      ကိုယ်လိုချင်တဲ့ role နဲ့ အလုပ်လုပ်ပုံ ပါပြီးသား HTML element ရှိရင်၊ ARIA မသုံးဘဲ အဲဒီ
      element ကိုပဲ သုံးပါ။ ARIA ထည့်လိုက်ရုံနဲ့ page က ပိုပြီး accessible ဖြစ်မလာပါဘူး။
      [[mark:draw-webaim]] ဥပမာအားဖြင့်၊ home page တစ်သန်းကို နှစ်စဉ် စစ်တဲ့ WebAIM Million ရဲ့
      ၂၀၂၆ report မှာ၊ ARIA ပါတဲ့ page တွေမှာ စက်နဲ့ စစ်လို့ တွေ့တဲ့ error ပျမ်းမျှ ၅၉ ခုကျော်
      ရှိပြီး၊ ARIA မပါတဲ့ page တွေမှာတော့ ၄၂ ခုပဲ ရှိပါတယ်။ ARIA က error ကို တိုက်ရိုက်
      ဖြစ်စေတယ်လို့ မဆိုလိုပေမယ့်၊ ARIA များလေ ပိုကောင်းလေ မဟုတ်ဘူး ဆိုတာတော့ ပြနေပါတယ်။
      ဒါကြောင့် ARIA ကို HTML နဲ့ မရတဲ့ အခါမျိုးမှာပဲ သုံးပါ။
    sources:
      - title: "web.dev Learn Accessibility — ARIA and HTML: the five rules"
        url: "https://web.dev/learn/accessibility/aria-html#when_to_use_aria"
      - title: "W3C — Using ARIA (the five rules of ARIA use)"
        url: "https://www.w3.org/TR/using-aria/"
      - title: "WebAIM — The WebAIM Million, 2026 report (ARIA and detected errors)"
        url: "https://webaim.org/projects/million/"
    actions:
      - id: draw-rules
        type: whiteboard.apply
        at: { mark: draw-rules }
        clear: true
        upsertIds: [b-title, b-r1, b-r2, b-r3, b-r4, b-r5]
        drawMs: 3200
      - id: circle-rule-one
        type: whiteboard.apply
        at: { mark: circle-rule-one }
        upsertIds: [b-circle]
        drawMs: 1000
      - id: draw-webaim
        type: whiteboard.apply
        at: { mark: draw-webaim }
        upsertIds: [b-web-box, b-web1, b-web2]
        drawMs: 2000

  - id: code-tour
    narration: >
      [[mark:close-rules]] ကဲ၊ ဒီ စည်းကမ်းတွေကို ဆိုင်ရဲ့ page ပေါ်မှာ လက်တွေ့ ကြည့်ရအောင်။
      [[mark:open-index]] ဒါက page ရဲ့ HTML ဖိုင်ပါ။ [[mark:select-icon]] လက်ဖက်ရည် card ထဲမှာ
      နှလုံးပုံ icon လေးပဲ ပါတဲ့ ကြိုက်တယ် ခလုတ် ရှိပါတယ်။ ခလုတ်ပေါ်မှာ စာသား မပါပါဘူး။
      [[mark:select-span]] အော်ဒါ အပိုင်းမှာတော့ မှာမယ် ခလုတ်ကို span နဲ့ ရေးထားပြီး၊ button
      role ကို ARIA နဲ့ ပေးထားပါတယ်။ [[mark:select-dont]] အောက်ဆုံးက မျဉ်းပြတ် ဘောင်ထဲမှာတော့
      ARIA ကို မှားသုံးတဲ့ ဥပမာ နှစ်ခုကို ယှဉ်ကြည့်လို့ ရအောင် ထည့်ထားပါတယ်။ ဆိုင်ရဲ့ တကယ့်
      အကြောင်းအရာ မဟုတ်ဘဲ၊ ဒီလို မလုပ်ရဘူး ဆိုတာကို ပြဖို့ပါ။ [[mark:preview-shows]] ညာဘက်မှာ
      ဆိုင်ရဲ့ page ကို မြင်ရပါပြီ။ accessibility panel ရဲ့ အပေါ်ဆုံးမှာ warning သုံးခု
      ရှိနေပါတယ်။ တစ်ခုချင်း ကြည့်သွားပါမယ်။
    sources:
      - title: "web.dev Learn Accessibility — ARIA and HTML"
        url: "https://web.dev/learn/accessibility/aria-html"
      - title: "W3C — Using ARIA"
        url: "https://www.w3.org/TR/using-aria/"
    actions:
      - id: close-rules
        type: whiteboard.apply
        at: { mark: close-rules }
        open: false
      - id: open-index
        type: workspace.openFile
        at: { mark: open-index }
        path: index.html
      - id: select-icon
        type: editor.select
        at: { mark: select-icon }
        target: { file: index.html, text: '<button type="button" class="fav"', occurrence: 1 }
      - id: select-span
        type: editor.select
        at: { mark: select-span }
        target: { file: index.html, text: '<span class="order-btn" role="button"', occurrence: 1 }
      - id: select-dont
        type: editor.select
        at: { mark: select-dont }
        target: { file: index.html, text: '<div class="demo dont"', occurrence: 1 }
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { mark: preview-shows }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-dev-server }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-three-warnings
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: a11y-summary }
        attribute: { name: data-warnings, value: "3" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: collapse-runner-dock
        type: runtime.collapseDock
        at: { afterAction: expect-three-warnings }

  - id: rule-two
    chapter: "စည်းကမ်း 2: မလိုတဲ့ role မထည့်ပါနဲ့"
    narration: >
      [[mark:select-tab-role]] ဒုတိယ စည်းကမ်းကနေ စကြည့်ရအောင်။ ဘောင်ထဲက စားစရာ ခေါင်းစဉ်ကို
      ကြည့်ပါ။ heading element ပေါ်မှာ tab role ကို ပေးထားပါတယ်။ [[mark:scroll-dont]] panel ထဲက
      သူ့ row ကို ကြည့်ရင်၊ role က heading မဟုတ်တော့ဘဲ tab ဖြစ်သွားပြီး၊ focus မရတဲ့ control
      လို့ warning ပြနေပါတယ်။ အပေါ်က သောက်စရာ ခေါင်းစဉ်ကတော့ heading level နှစ် အဖြစ်
      မှန်မှန်ကန်ကန် ပေါ်နေပါတယ်။ [[mark:why-heading]] screen reader သုံးတဲ့သူတွေက page ကို heading တွေနဲ့
      ခုန်ကြည့်လေ့ ရှိပါတယ်။ tab role ပေးလိုက်တော့ စားစရာ ခေါင်းစဉ်က အဲဒီ စာရင်းထဲက
      ပျောက်သွားပြီး၊ tab တွေ မရှိတဲ့ page မှာ tab တစ်ခု ရှိတယ်လို့ လမ်းလွဲစေပါတယ်။ ARIA
      role က element ရဲ့ မူလ role ကို အစားထိုးလိုက်တာ ဖြစ်လို့ပါ။ [[mark:read-list]]
      နောက်တစ်မျိုးက ရှိပြီးသား role ကို ထပ်ပေးတာပါ။ ဥပမာ ul element က panel မှာ မြင်ရတဲ့
      အတိုင်း list role ကို အလိုလို ရပြီးသားပါ။ အဲဒီ ul ပေါ်မှာ list role ကို ထပ်ရေးရင် tree
      ထဲမှာ ဘာမှ မပြောင်းဘဲ၊ code ပဲ ရှုပ်သွားပါတယ်။
    sources:
      - title: "web.dev Learn Accessibility — ARIA and HTML: Rule 2"
        url: "https://web.dev/learn/accessibility/aria-html#rule_2_dont_add_unnecessary_aria_to_html"
      - title: "W3C — Using ARIA: second rule"
        url: "https://www.w3.org/TR/using-aria/#second"
      - title: "W3C — ARIA in HTML (h1–h6 and ul allowed roles)"
        url: "https://www.w3.org/TR/html-aria/"
    actions:
      - id: select-tab-role
        type: editor.select
        at: { mark: select-tab-role }
        target: { file: index.html, text: 'role="tab"', occurrence: 1 }
      - id: scroll-dont
        type: preview.scroll
        at: { mark: scroll-dont }
        timeoutMs: 5000
        top: 5000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-tab-row
        type: expect.preview
        at: { afterAction: scroll-dont }
        timeoutMs: 5000
        target: { by: testId, value: a11y-dont-heading }
        textContains: 'tab "စားစရာ" ⚠ not focusable'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-real-heading
        type: expect.preview
        at: { afterAction: expect-tab-row }
        timeoutMs: 5000
        target: { by: testId, value: a11y-drinks-title }
        textContains: 'heading level 2 "သောက်စရာ"'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-list-row
        type: expect.preview
        at: { mark: read-list }
        timeoutMs: 5000
        target: { by: testId, value: a11y-menu-drinks }
        textContains: "list 1 item"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: rule-three
    chapter: "စည်းကမ်း 3: keyboard နဲ့ သုံးလို့ ရရမယ်"
    narration: >
      [[mark:select-span-role]] တတိယ စည်းကမ်းအတွက် span နဲ့ ရေးထားတဲ့ မှာမယ် ခလုတ်ကို
      ကြည့်ရအောင်။ button role ပေးထားလို့ panel မှာ button row ပေါ်နေပေမယ့်၊ focus မရဘူး
      ဆိုတဲ့ warning ပါနေပြီး page ပေါ်မှာလည်း tab badge မရှိပါဘူး။ role က tree ထဲမှာ
      ပြတာကိုပဲ ပြောင်းပြီး၊ keyboard အလုပ်လုပ်ပုံကို မပေးလို့ပါ။ ပထမ စည်းကမ်းအရ အကောင်းဆုံးကတော့
      ပြီးခဲ့တဲ့ lesson ကလို button element ကို သုံးတာပါ။ ဒါပေမဲ့ element ကို ပြောင်းလို့
      တကယ် မရတဲ့ အခါမျိုး ရှိနိုင်ပါတယ်။ [[mark:type-tabindex]] အဲဒီလို အခါမျိုးမှာ အနည်းဆုံး
      tab index သုည ကို ထည့်ပေးရပါမယ်။ tab index သုည က element ကို page ထဲက အစဉ်အတိုင်း Tab
      order ထဲ ထည့်ပေးပါတယ်။ [[mark:after-tabindex]] panel ထဲမှာ warning ပျောက်သွားပြီး၊ မှာမယ်
      ခလုတ်မှာ နံပါတ် နှစ် badge ပေါ်လာပါပြီ။ [[mark:tab-one]] Tab key ကို နှိပ်ကြည့်ရအောင်။
      ပထမဆုံး ကြိုက်တယ် icon ခလုတ်ကို ရောက်ပါတယ်။ [[mark:tab-two]] နောက်တစ်ချက် နှိပ်ပါမယ်။
      [[mark:after-tab-two]] focus က span ခလုတ်ဆီ ရောက်လာပါပြီ။ ဒါပေမဲ့ ဒါတင် မလုံလောက်သေးပါဘူး။
      တကယ့် button ဆိုရင် Enter နဲ့ Space ကို browser က handle လုပ်ပေးပေမယ့်၊ span အတွက်တော့
      JavaScript နဲ့ ကိုယ်တိုင် ရေးပေးရပါမယ်။ tab index ကိုလည်း သုည ထက် ကြီးတဲ့ ဂဏန်း
      ဘယ်တော့မှ မပေးပါနဲ့။ အဲဒီ element က page ထဲက အစဉ်ကို ကျော်ပြီး ရှေ့ဆုံးကို
      ခုန်သွားလို့၊ keyboard သုံးတဲ့သူကို ရှုပ်ထွေးစေပါတယ်။
    sources:
      - title: "web.dev Learn Accessibility — ARIA and HTML: Rule 3"
        url: "https://web.dev/learn/accessibility/aria-html#rule_3_always_support_keyboard_navigation"
      - title: "W3C — Using ARIA: third rule"
        url: "https://www.w3.org/TR/using-aria/#3rdrule"
      - title: "MDN — tabindex"
        url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Global_attributes/tabindex"
    actions:
      - id: select-span-role
        type: editor.select
        at: { mark: select-span-role }
        target: { file: index.html, text: 'role="button"', occurrence: 1 }
      - id: expect-span-not-focusable
        type: expect.preview
        at: { afterAction: select-span-role }
        timeoutMs: 5000
        target: { by: testId, value: a11y-order-span }
        textContains: 'button "မှာမယ်" ⚠ not focusable'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-tabindex
        type: editor.type
        at: { mark: type-tabindex }
        cadence: block
        target: { file: index.html, after: 'role="button"', occurrence: 1 }
        text: ' tabindex="0"'
      - id: expect-span-tab-two
        type: expect.preview
        at: { mark: after-tabindex }
        timeoutMs: 5000
        target: { by: testId, value: tab-order-span }
        attribute: { name: data-order, value: "2" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-two-warnings
        type: expect.preview
        at: { afterAction: expect-span-tab-two }
        timeoutMs: 5000
        target: { by: testId, value: a11y-summary }
        attribute: { name: data-warnings, value: "2" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: tab-one
        type: preview.click
        at: { mark: tab-one }
        timeoutMs: 5000
        target: { by: testId, value: a11y-tab-next }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-icon-focused
        type: expect.preview
        at: { afterAction: tab-one }
        timeoutMs: 5000
        target: { by: testId, value: a11y-icon-btn }
        attribute: { name: data-states, value: "focused" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: tab-two
        type: preview.click
        at: { mark: tab-two }
        timeoutMs: 5000
        target: { by: testId, value: a11y-tab-next }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-span-focused
        type: expect.preview
        at: { mark: after-tab-two }
        timeoutMs: 5000
        target: { by: testId, value: tab-order-span }
        textContains: '2 button "မှာမယ်" focused'
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: rule-four
    chapter: "စည်းကမ်း 4: focus ရတဲ့ element ကို မဖျောက်ပါနဲ့"
    narration: >
      [[mark:tab-three]] Tab ကို နောက်တစ်ချက် ထပ်နှိပ်ကြည့်ပါမယ်။ [[mark:after-tab-three]] focus
      က ဘောင်ထဲက မှာယူရန် link ကို ရောက်သွားပြီး၊ page ပေါ်မှာ နံပါတ် သုံး badge ကို
      အနီရောင်နဲ့ မြင်ရပါတယ်။ ဒါပေမဲ့ accessibility tree ထဲမှာ ဒီ link ရဲ့ row လုံးဝ မရှိပါဘူး။
      [[mark:select-hidden]] ဘာကြောင့်လဲဆိုတော့၊ link ကို ပတ်ထားတဲ့ div ပေါ်မှာ aria hidden ကို
      true ပေးထားလို့ပါ။ aria hidden က သူ့ အထဲက အရာအားလုံးကို assistive technology ဆီကနေ
      ဖျောက်ထားပေမယ့်၊ keyboard focus ကတော့ ဆက်ရောက်နေပါတယ်။ ဆိုလိုတာက screen reader သုံးတဲ့သူ
      Tab နှိပ်လိုက်တဲ့အခါ focus က တစ်နေရာကို ရောက်သွားပေမယ့်၊ screen reader က ဘာမှ
      ဖတ်မပြတာ၊ ဒါမှမဟုတ် ရှုပ်ထွေးအောင် ဖတ်ပြတာမျိုး ဖြစ်နိုင်ပါတယ်။ [[mark:hidden-rule]] Tab order စာရင်းမှာလည်း ဒီ link ကို aria hidden warning နဲ့
      ပြထားပါတယ်။ presentation role ကလည်း ဒီလိုပဲ ပြဿနာ ဖြစ်စေနိုင်ပါတယ်။ ဒါကြောင့် focus
      ရတဲ့ element ကို aria hidden နဲ့ ဘယ်တော့မှ မဖျောက်ပါနဲ့။ ကိုယ့် code မှာဆိုရင် aria hidden
      ကို ဖြုတ်ပစ်ရမှာပါ။
    sources:
      - title: "web.dev Learn Accessibility — ARIA and HTML: Rule 4"
        url: "https://web.dev/learn/accessibility/aria-html#rule_4_dont_hide_focusable_elements"
      - title: "W3C — Using ARIA: fourth rule"
        url: "https://www.w3.org/TR/using-aria/#4thrule"
      - title: "MDN — aria-hidden"
        url: "https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Attributes/aria-hidden"
    actions:
      - id: tab-three
        type: preview.click
        at: { mark: tab-three }
        timeoutMs: 5000
        target: { by: testId, value: a11y-tab-next }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-hidden-link-focused
        type: expect.preview
        at: { mark: after-tab-three }
        timeoutMs: 5000
        target: { by: testId, value: tab-dont-link }
        textContains: '3 link "မှာယူရန်" ⚠ aria-hidden focused'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-hidden
        type: editor.select
        at: { mark: select-hidden }
        target: { file: index.html, text: 'aria-hidden="true"', occurrence: 1 }

  - id: rule-five
    chapter: "စည်းကမ်း 5: interactive element တိုင်း name ရှိရမယ်"
    narration: >
      [[mark:select-icon-again]] နောက်ဆုံး စည်းကမ်းအတွက် icon ခလုတ်ကို ပြန်ကြည့်ရအောင်။ panel
      မှာ role က button ဖြစ်ပေမယ့် name မရှိဘူး ဆိုတဲ့ warning ပါနေပါတယ်။ screen reader က
      button လို့ပဲ ဖတ်ပြမှာ ဖြစ်လို့၊ ဒီ ခလုတ်က ဘာလုပ်တာလဲ ဆိုတာ သုံးတဲ့သူ မသိနိုင်ပါဘူး။ [[mark:name-sources]] ခလုတ်တို့ link တို့လို interactive element တိုင်းမှာ name ရှိရပါမယ်။ name ကို element
      ထဲက စာသား၊ ပုံရဲ့ alt text၊ form field ရဲ့ label စတာတွေကနေ ရနိုင်ပါတယ်။ ဒီ ခလုတ်မှာ
      မြင်ရတဲ့ စာသား မရှိလို့ aria label နဲ့ name ပေးပါမယ်။ [[mark:type-label]] ကြိုက်တယ် ဆိုတဲ့
      aria label ကို ခလုတ်ပေါ်မှာ ထည့်လိုက်ပါမယ်။ [[mark:after-label]] panel ထဲမှာ role က
      button၊ name က ကြိုက်တယ် ဆိုပြီး ပေါ်လာပြီး၊ warning ကလည်း တစ်ခုပဲ ကျန်ပါတော့တယ်။
      ကျန်နေတဲ့ တစ်ခုကတော့ ဘောင်ထဲက မလုပ်ရဘူး ဥပမာပါ။ page ပေါ်မှာ မြင်ရတဲ့ စာသား
      ရှိပြီးသားဆိုရင်တော့၊ aria label အစား အဲဒီ စာသားကို aria labelledby နဲ့ ညွှန်ပေးတာ
      ပိုကောင်းပါတယ်။ ဒါမှ မျက်စိနဲ့ မြင်ရတာနဲ့ screen reader က ဖတ်ပြတာ တူနေမှာပါ။
    sources:
      - title: "web.dev Learn Accessibility — ARIA and HTML: Rule 5"
        url: "https://web.dev/learn/accessibility/aria-html#rule_5_use_accessible_names_for_interactive_elements"
      - title: "W3C — Using ARIA: fifth rule"
        url: "https://www.w3.org/TR/using-aria/#fifthrule"
      - title: "MDN — aria-label"
        url: "https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Attributes/aria-label"
      - title: "MDN — aria-labelledby"
        url: "https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Attributes/aria-labelledby"
    actions:
      - id: select-icon-again
        type: editor.select
        at: { mark: select-icon-again }
        target: { file: index.html, text: '<button type="button" class="fav"', occurrence: 1 }
      - id: expect-icon-no-name
        type: expect.preview
        at: { afterAction: select-icon-again }
        timeoutMs: 5000
        target: { by: testId, value: a11y-icon-btn }
        textContains: "button ⚠ no name"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-label
        type: editor.type
        at: { mark: type-label }
        cadence: block
        target: { file: index.html, after: '<button type="button" class="fav"', occurrence: 1 }
        text: ' aria-label="ကြိုက်တယ်"'
      - id: expect-icon-named
        type: expect.preview
        at: { mark: after-label }
        timeoutMs: 5000
        target: { by: testId, value: a11y-icon-btn }
        textContains: 'button "ကြိုက်တယ်"'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-one-warning
        type: expect.preview
        at: { afterAction: expect-icon-named }
        timeoutMs: 5000
        target: { by: testId, value: a11y-summary }
        attribute: { name: data-warnings, value: "1" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: aria-in-html
    chapter: "ARIA in HTML"
    narration: >
      [[mark:draw-html-aria]] HTML element တွေပေါ်မှာ ARIA ကို ဘယ်လို သုံးရမလဲ ဆိုတာအတွက်
      W3C မှာ ARIA in HTML ဆိုတဲ့ စံ ရှိပါတယ်။ အဓိက အချက် သုံးခုကို မှတ်ထားပါ။
      [[mark:draw-override]] ပထမက element ရဲ့ မူလ role ကို မဖျက်ပါနဲ့။ ဥပမာ link ပေါ်မှာ heading
      role ပေးတာကို ဒီ စံက ခွင့်မပြုပါဘူး။ [[mark:draw-redundant]] ဒုတိယက ရှိပြီးသား role ကို
      ထပ်မပေးပါနဲ့။ ခြွင်းချက် တချို့ ရှိပေမယ့်၊ ပုံမှန်အားဖြင့်တော့ မလိုတဲ့ code ပါပဲ။
      [[mark:draw-side]] တတိယက မမျှော်လင့်တဲ့ အကျိုးဆက်ကို သတိထားဖို့ပါ။ ဥပမာ details ထဲက
      summary ပေါ်မှာ role ပေးတာကိုလည်း ဒီ စံက ခွင့်မပြုပါဘူး။ browser က summary ကို
      ဖွင့်လိုက် ပိတ်လိုက် လုပ်လို့ရတဲ့ ခလုတ်အဖြစ် ပေးထားပြီးသား ဖြစ်ပြီး၊ ARIA role က အဲဒီ
      အဓိပ္ပာယ်ကို ပြောင်းသွားစေနိုင်လို့ပါ။
    sources:
      - title: "web.dev Learn Accessibility — ARIA and HTML: ARIA in HTML"
        url: "https://web.dev/learn/accessibility/aria-html#aria_in_html"
      - title: "W3C — ARIA in HTML (allowed roles per element; redundant roles not recommended)"
        url: "https://www.w3.org/TR/html-aria/"
    actions:
      - id: draw-html-aria
        type: whiteboard.apply
        at: { mark: draw-html-aria }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-override
        type: whiteboard.apply
        at: { mark: draw-override }
        upsertIds: [c-override]
        drawMs: 1400
      - id: draw-redundant
        type: whiteboard.apply
        at: { mark: draw-redundant }
        upsertIds: [c-redundant]
        drawMs: 1400
      - id: draw-side
        type: whiteboard.apply
        at: { mark: draw-side }
        upsertIds: [c-side]
        drawMs: 1400

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:draw-complex]] ARIA က အစွမ်း ထက်ပေမယ့် ရှုပ်ထွေးပါတယ်။ ကိုယ်တိုင် ဆောက်တဲ့
      component တစ်ခုအတွက် keyboard၊ touch screen၊ browser နဲ့ screen reader တစ်ခုချင်းရဲ့
      support၊ ဘာသာပြန်တာ၊ code အဟောင်းနဲ့ user ရဲ့ setting တွေအထိ စဉ်းစားရပါတယ်။
      [[mark:draw-spectrum]] ဒါပေမဲ့ accessibility ဆိုတာ လုံးဝ မှန်တာနဲ့ လုံးဝ မှားတာ နှစ်မျိုးတည်း
      မဟုတ်ဘဲ အဆင့်လိုက် ရှိတာ ဖြစ်လို့၊ ဆက်လေ့လာ၊ ဆက်စမ်းသပ်သွားဖို့ အရေးကြီးပါတယ်။
      [[mark:close-board]] ဒါဆို ပြန်ချုပ်ရရင်၊ ARIA ကို HTML နဲ့ မရတဲ့ အခါမှပဲ သုံးပါ။ မလိုတဲ့
      role ဒါမှမဟုတ် လမ်းလွဲစေတဲ့ role မပေးပါနဲ့။ ARIA နဲ့ ဆောက်တဲ့ control ကို tab index သုည
      နဲ့ keyboard ရောက်အောင် လုပ်ပြီး၊ သုည ထက် ကြီးတဲ့ ဂဏန်း မပေးပါနဲ့။ focus ရတဲ့ element ကို
      aria hidden နဲ့ မဖျောက်ပါနဲ့။ [[mark:select-final]] interactive element တိုင်းမှာလည်း name
      ရှိပါစေ။ နောက် lesson မှာတော့ page ရဲ့ ဖွဲ့စည်းပုံ ဖြစ်တဲ့ landmark နဲ့ heading တွေကို
      ကြည့်သွားပါမယ်။
    sources:
      - title: "web.dev Learn Accessibility — ARIA and HTML: complexities of ARIA"
        url: "https://web.dev/learn/accessibility/aria-html#complexities_of_aria"
      - title: "W3C — Using ARIA"
        url: "https://www.w3.org/TR/using-aria/"
    actions:
      - id: draw-complex
        type: whiteboard.apply
        at: { mark: draw-complex }
        upsertIds: [c-complex]
        drawMs: 1600
      - id: draw-spectrum
        type: whiteboard.apply
        at: { mark: draw-spectrum }
        upsertIds: [c-spectrum]
        drawMs: 1400
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: select-final
        type: editor.select
        at: { mark: select-final }
        target: { file: index.html, text: 'aria-label="ကြိုက်တယ်"', occurrence: 1 }
      - id: expect-label-in-file
        type: expect.file
        at: { afterAction: select-final }
        path: index.html
        contains: '<button type="button" class="fav" aria-label="ကြိုက်တယ်" data-testid="icon-btn">'
      - id: expect-tabindex-in-file
        type: expect.file
        at: { afterAction: expect-label-in-file }
        path: index.html
        contains: 'role="button" tabindex="0"'

checks:
  - { type: timing.p95Ms, max: 300 }
