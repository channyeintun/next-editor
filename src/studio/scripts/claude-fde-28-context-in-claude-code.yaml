      context window ပြည့်လာပြီး၊ chat ထဲက စည်းကမ်းက compaction နောက်မှာ အကျဉ်းချုပ်ပဲ ကျန်ခဲ့လို့ပါ။ context command
      နဲ့ ဘာတွေ ပြည့်နေလဲ ကြည့်ပါ။
      [[mark:recap-2]] အလုပ် တူတူ ဆက်ရင် ထိန်းထားရမယ့်အရာကို ပြောပြီး compact လုပ်ပါ။ အလုပ် ပြောင်းရင် clear လုပ်ပါ။
