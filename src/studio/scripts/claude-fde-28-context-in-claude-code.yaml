        target: { file: notebook/28-context-habits.md, after: "နေရာပဲ လို |\n" }
        text: "| အလုပ် ပြီးပြီ၊ နောက်အလုပ် မဆိုင် | /clear | context အဟောင်းက နေရာယူပြီး ရှုပ်စေ |\n"
      - id: type-r3
        type: editor.type
        at: { mark: type-r3 }
        cadence: line-by-line
        target: { file: notebook/28-context-habits.md, after: "နေရာယူပြီး ရှုပ်စေ |\n" }
        text: "| 2 ခါ ပြင်ခိုင်းလည်း အမှား ထပ် | /clear + ပိုရှင်းတဲ့ prompt | မှားခဲ့တာတွေ context ထဲ ကျန် |\n"
      - id: type-r4
        type: editor.type
