        target: { file: notebook/28-context-habits.md, after: "သိမ်းထားပြီးသား |\n" }
        text: "| session တိုင်း ကျန်ရမယ့် စည်းကမ်း | CLAUDE.md ထဲ ရေး | compact ပြီးလည်း disk ကနေ ပြန်ဖတ် |\n"
      - id: expect-r2
        type: expect.file
        at: { afterAction: type-r5 }
        path: notebook/28-context-habits.md
        contains: "| အလုပ် ပြီးပြီ၊ နောက်အလုပ် မဆိုင် | /clear | context အဟောင်းက နေရာယူပြီး ရှုပ်စေ |\n"

  - id: your-turn
    chapter: ကိုယ့် team အတွက်
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ဒီ table ရဲ့ အောက်မှာ ကိုယ့် team အတွက် session အသစ်
      ဘယ်အချိန် စမလဲ ဆိုတဲ့ စည်းကမ်း တစ်ကြောင်း ထပ်ရေးကြည့်ပါ။
      [[mark:turn-2]] ဥပမာ pull request တစ်ခု ပြီးတိုင်း clear လုပ်မယ်၊ ဒါမှမဟုတ် စည်းကမ်း အသစ် တစ်ခုကို chat ထဲမှာ
      နှစ်ခါ ပြောရရင် CLAUDE.md ထဲ ရွှေ့ရေးမယ် ဆိုတာမျိုးပါ။ ကိုယ့် team ရဲ့ အလုပ်လုပ်ပုံနဲ့ ကိုက်တဲ့ စည်းကမ်း ဖြစ်ဖို့က
      အရေးကြီးပါတယ်။
    sources:
