      - {
          id: open-notebook,
          type: workspace.openFile,
          at: { afterAction: close-quiz },
          path: notebook/28-context-habits.md,
        }
      - id: type-r1
        type: editor.type
        at: { mark: type-r1 }
        cadence: line-by-line
        target: { file: notebook/28-context-habits.md, after: "|---|---|---|\n" }
        text: "| အလုပ် တူတူ၊ session ရှည်လာ | /compact + ထိန်းထားရမယ့်အရာ | အလုပ် ဆက်ရမယ်၊ နေရာပဲ လို |\n"
      - id: type-r2
        type: editor.type
