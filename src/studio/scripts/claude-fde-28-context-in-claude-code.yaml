build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 9328

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: need
    chapter: နှစ်နာရီ ကြာတော့
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ အလုပ် တစ်ခုကို explore၊ plan၊ code၊ commit ဆိုတဲ့ အဆင့် လေးဆင့်နဲ့ ခိုင်းပုံနဲ့၊ Claude
      ကိုယ်တိုင် run လို့ရတဲ့ check ပေးပုံကို လေ့လာခဲ့ပါတယ်။
      [[mark:sel-billing]] late fee bug ပြီးတော့ Billing team က နောက်အလုပ် တစ်ခုကို Claude Code နဲ့ စပါတယ်။ လစဉ် ဝင်ငွေ
      report ထဲမှာ late fee ကို သီးခြား line တစ်ခုအဖြစ် ပြဖို့ပါ။ Claude Code ဆိုတာ terminal ထဲကနေ code ကို ဖတ်၊
      ပြင်ပြီး command တွေ run ပေးတဲ့ coding agent ပါ။
      [[mark:story]] session အစမှာ developer က chat ထဲကနေ စည်းကမ်း တစ်ခု ပြောထားပါတယ်။ report code ကိုပဲ ပြင်ရမယ်၊
      invoice တွက်တဲ့ code ကို မထိရဘူး ဆိုတာပါ။ Claude ကလည်း ပထမ တစ်နာရီလောက်မှာ အဲဒီအတိုင်း လိုက်နာပါတယ်။
      [[mark:story-2]] ဒါပေမဲ့ နှစ်နာရီလောက် ကြာလာတော့ file တွေ အများကြီး ဖတ်ပြီး၊ test ကို ထပ်ခါထပ်ခါ run ထားပါပြီ။
      အဲဒီအချိန်မှာ Claude က invoice တွက်တဲ့ code ကို ပြင်ဖို့ အကြံပြုလာပါတယ်။ Billing team lead မောင်မောင် က
      Claude က သဘောတူထားတာတွေကို မေ့သွားတာလားလို့ မေးပါတယ်။
      [[mark:story-3]] အဖြေကို နားလည်ဖို့ session တစ်ခုရဲ့ context window ထဲမှာ ဘာတွေ ရှိလဲ ဆိုတာ အရင် ကြည့်ရပါမယ်။
      context window ဆိုတာ request တစ်ခုမှာ model မြင်နိုင်တဲ့ စာ အားလုံးအတွက် နေရာပါ။ နေရာက ကန့်သတ်ထားတော့ ပြည့်လာရင်
      တစ်ခုခု လုပ်ရပါတယ်။
    sources:
      - {
          title: "Claude Code Docs: How Claude Code works",
          url: "https://code.claude.com/docs/en/how-claude-code-works",
        }
    actions:
      - { id: open-readme, type: workspace.openFile, at: { mark: sel-billing }, path: README.md }
      - id: sel-billing
        type: editor.select
        at: { afterAction: open-readme }
        target:
          file: README.md
          text: "- Billing team နဲ့ Claude Code"
      - id: sel-billing-sys
        type: editor.select
        at: { mark: story }
        target:
          file: README.md
          text: "- Billing: plan၊ invoice၊ ငွေပေးချေမှု (သက်တမ်း 9 နှစ်ရှိ codebase)"

  - id: window
    chapter: Context window ထဲမှာ ဘာတွေ ရှိလဲ
    narration: >
      [[mark:w-open]] Claude Code ရဲ့ session တစ်ခုကို context window တစ်ခုလို့ မြင်ကြည့်ပါ။
      [[mark:w-before]] ကိုယ်က ဘာမှ မရိုက်ရသေးခင်ကတည်းက အထဲမှာ တချို့ အရာတွေ ရှိနေပါပြီ။ Claude Code ရဲ့ system
      prompt နဲ့ tool တွေ၊ project ရဲ့ CLAUDE.md နဲ့ skill တွေရဲ့ ဖော်ပြချက်တွေပါ။ CLAUDE.md ဆိုတာ project အကြောင်း
      Claude Code အမြဲ သိထားရမယ့် အချက်တွေ ရေးထားတဲ့ file ပါ။
      [[mark:w-chat]] အလုပ် စလုပ်တော့ ကိုယ့် prompt တွေနဲ့ Claude ရဲ့ အဖြေတွေ ဝင်လာပါတယ်။
      [[mark:w-files]] Claude က ဖတ်လိုက်တဲ့ file တိုင်းရဲ့ အကြောင်းအရာလည်း ဒီထဲကို ဝင်ပါတယ်။
      [[mark:w-output]] ပြီးတော့ command output ပါ။ test တစ်ခါ run တိုင်း ထွက်လာတဲ့ စာကြောင်းတွေ အကုန် ဝင်လာတာမို့၊
      Billing လို test များတဲ့ codebase မှာ နေရာ အကုန်ဆုံး အပိုင်း ဖြစ်တတ်ပါတယ်။
      [[mark:w-grow]] ဆိုလိုတာက session ကြာလေ၊ prompt၊ file နဲ့ command output ဆိုတဲ့ သုံးခုက များလာလေ ဖြစ်ပါတယ်။ စောစောက ပြောခဲ့တဲ့ စည်းကမ်းက
      အဲဒီ စာတွေ အများကြီးရဲ့ အစမှာ မြုပ်နေပါတယ်။
    sources:
