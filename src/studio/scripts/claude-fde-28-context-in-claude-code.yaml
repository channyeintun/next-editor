  - id: context-view
    chapter: Context command
    narration: >
      [[mark:x-open]] ဒီ window ထဲမှာ အခု ဘာတွေ ရှိလဲ ဆိုတာကို context command နဲ့ ကြည့်လို့ ရပါတယ်။ ဒီ screen မှာ
      Billing project ထဲက session တစ်ခုရဲ့ context command ကို ဒီလို မြင်ရပါတယ်။
      [[mark:x-grid]] အကွက်လေးတွေ စီထားတဲ့ ဇယားက window တစ်ခုလုံးကို ကိုယ်စားပြုပြီး၊ သုံးပြီးသား နေရာကို အရောင်နဲ့ ပြပါတယ်။
      [[mark:x-cat]] အမျိုးအစား စာရင်းမှာတော့ ဘယ်အမျိုးအစားက ဘယ်လောက် နေရာယူထားလဲ ခန့်မှန်းပြပါတယ်။ ကိုယ် ဘာမှ
      မရိုက်ရသေးခင် ဝင်နေတဲ့ အပိုင်းတွေနဲ့ စကားဝိုင်းက ယူထားတဲ့ အပိုင်းကို ခွဲကြည့်လို့ ရပါတယ်။ ဒီ screen ပေါ်က ဂဏန်းတွေကိုတော့ တကယ့် တိုင်းတာချက်
      အဖြစ် မယူပါနဲ့။ ဒီ screen အတွက် စမ်းသပ် ပြင်ဆင်ထားတဲ့ session ဖြစ်လို့ပါ။
      [[mark:x-free]] နေရာလွတ် ဘယ်လောက် ကျန်သေးလဲ ဆိုတာလည်း ပြပါတယ်။
      [[mark:x-buffer]] autocompact buffer ဆိုတဲ့ အတန်းကတော့ automatic compaction အတွက် ချန်ထားတဲ့ နေရာပါ။ window ပြည့်ခါနီးရင် Claude
      Code က စကားဝိုင်းကို ကိုယ်တိုင် အကျဉ်းချုပ်ပေးပါတယ်။ ဒါကို compaction လို့ ခေါ်ပြီး၊ စကားဝိုင်း အဟောင်းကို
      အကျဉ်းချုပ်လိုက်လို့ နေရာ ပြန်ရလာတာပါ။
      [[mark:x-memory]] memory file တွေ ဆိုတဲ့ အပိုင်းမှာ ဒီ session မှာ ဘယ် CLAUDE.md တွေ load ဖြစ်ထားလဲ ပြပါတယ်။
      session ရှည်ရှည် တစ်ခု မစခင် ဒီ command ကို တစ်ချက် ကြည့်တာက ကောင်းတဲ့ အကျင့်ပါ။
    sources:
      - {
          title: "Claude Code Docs: Commands (context)",
          url: "https://code.claude.com/docs/en/commands",
        }
      - {
          title: "Claude Code Docs: Context window",
          url: "https://code.claude.com/docs/en/context-window",
        }
    actions:
      - {
          id: close-window,
          type: whiteboard.apply,
          at: { mark: x-open, offsetMs: -1400 },
          open: false,
        }
      - {
          id: show-context,
          type: slide.show,
          at: { mark: x-open, offsetMs: -700 },
          slideId: context-screen,
        }
      - {
          id: point-x-title,
          type: slide.point,
          at: { mark: x-open, offsetMs: 2500 },
          target: { x: 0.274, y: 0.217 },
        }
      - {
          id: point-x-grid,
          type: slide.point,
          at: { mark: x-grid },
          target: { x: 0.300, y: 0.305 },
        }
      - { id: point-x-cat, type: slide.point, at: { mark: x-cat }, target: { x: 0.529, y: 0.348 } }
      - {
          id: point-x-free,
          type: slide.point,
          at: { mark: x-free },
          target: { x: 0.523, y: 0.478 },
        }
      - {
          id: point-x-buffer,
          type: slide.point,
          at: { mark: x-buffer },
          target: { x: 0.529, y: 0.500 },
        }
      - {
          id: point-x-memory,
          type: slide.point,
          at: { mark: x-memory },
          target: { x: 0.274, y: 0.718 },
        }

  - id: compaction
    chapter: Compaction ပြီးရင် ဘာကျန်လဲ
    narration: >
      [[mark:m-open]] automatic compaction ကို စောင့်နေစရာ မလိုပါဘူး။ compact command ကို ကိုယ်တိုင် run လို့ ရပြီး၊
      အကျဉ်းချုပ်တဲ့အခါ ဘာကို ထိန်းထားရမလဲ ဆိုတဲ့ ညွှန်ကြားချက်ကိုပါ တွဲပေးလို့ ရပါတယ်။
      [[mark:m-cmd]] ဒီ screen မှာ late fee နဲ့ ဆိုင်တဲ့ စည်းကမ်းတွေကိုပဲ ထိန်းထားဖို့ ပြောပြီး compact လုပ်ထားတာကို ဒီလို
      မြင်ရပါတယ်။
      [[mark:m-done]] compact ပြီးသွားကြောင်း ပြပြီး၊ အကျဉ်းချုပ် အပြည့်အစုံကို ဖွင့်ကြည့်လို့ ရပါတယ်။
      [[mark:m-files]] ပြီးတော့ မကြာခင်က ဖတ်ထားတဲ့ file တွေကို context အသစ်ထဲ ပြန်ဖတ်ထည့်တာ တွေ့ရပါတယ်။
      [[mark:m-board]] compaction ပြီးရင် ဘာ ကျန်လဲ ဆိုတာ ဒီ lesson ရဲ့ အဓိက အချက်ပါ။
      [[mark:m-disk]] တချို့ အရာတွေကို Claude Code က disk ပေါ်ကနေ ပြန်ဖတ်ထည့်ပါတယ်။ project ရဲ့ CLAUDE.md၊ plan mode
      မှာ ရေးထားတဲ့ plan၊ git status နဲ့ မကြာခင်က ဖတ်ခဲ့တဲ့ file အချို့ ပါပါတယ်။ ဒါတွေက compaction ကြောင့် မပျောက်ပါဘူး။
      [[mark:m-summary]] တစ်ဖက်မှာတော့ chat ထဲကနေ ပြောခဲ့တဲ့ ညွှန်ကြားချက်တွေနဲ့ အစောပိုင်း ဆွေးနွေးချက်တွေက
      အကျဉ်းချုပ် ထဲမှာပဲ ကျန်ပါတယ်။ အကျဉ်းချုပ်ထဲမှာ အသေးစိတ်တွေ လျော့သွားနိုင်ပါတယ်။
      [[mark:m-story]] report code ကိုပဲ ပြင်ရမယ် ဆိုတဲ့ စည်းကမ်းကို developer က chat ထဲမှာ ပြောခဲ့တာပါ။ ဒါကြောင့် နှစ်နာရီ
      ကြာလို့ compaction ဖြစ်တဲ့အခါ အဲဒီ စည်းကမ်းက အကျဉ်းချုပ်ထဲက စာကြောင်း တစ်ကြောင်းလောက်ပဲ ကျန်ခဲ့တာပါ။ session
      တိုင်း ကျန်ရမယ့် စည်းကမ်းဆိုရင် chat ထဲမှာ မပြောဘဲ CLAUDE.md ထဲမှာ ရေးရပါမယ်။
    sources:
      - {
          title: "Claude Code Docs: Context window (what survives compaction)",
          url: "https://code.claude.com/docs/en/context-window",
        }
      - {
          title: "Claude Code Docs: Commands (compact)",
          url: "https://code.claude.com/docs/en/commands",
        }
    actions:
      - {
          id: show-compact,
          type: slide.show,
          at: { mark: m-open, offsetMs: -1200 },
          slideId: compact-screen,
        }
      - { id: point-m-cmd, type: slide.point, at: { mark: m-cmd }, target: { x: 0.163, y: 0.591 } }
      - {
          id: point-m-done,
          type: slide.point,
          at: { mark: m-done },
          target: { x: 0.175, y: 0.621 },
        }
      - {
          id: point-m-files,
          type: slide.point,
          at: { mark: m-files },
          target: { x: 0.187, y: 0.651 },
        }
      - { id: close-compact, type: slide.close, at: { mark: m-board, offsetMs: -900 } }
      - {
          id: draw-m-board,
          type: whiteboard.apply,
          at: { mark: m-board },
          open: true,
          clear: true,
          upsertIds: [c-title],
        }
      - {
          id: draw-m-disk,
          type: whiteboard.apply,
          at: { mark: m-disk },
          upsertIds: [c-lrect, c-lh, c-l1, c-l2, c-l3, c-l4],
          drawMs: 2400,
        }
      - {
          id: draw-m-summary,
          type: whiteboard.apply,
          at: { mark: m-summary },
          upsertIds: [c-rrect, c-rh, c-r1, c-r2],
          drawMs: 1800,
        }
      - {
          id: draw-m-story,
          type: whiteboard.apply,
          at: { mark: m-story },
          upsertIds: [c-circle],
          drawMs: 700,
        }

  - id: three-tools
    chapter: compact၊ clear၊ resume
    narration: >
      [[mark:t-open]] ဒါဆို context နေရာ လိုလာတဲ့အခါ ရွေးစရာ သုံးခု ရှိပါတယ်။
      [[mark:t-compact]] ပထမ တစ်ခုက compact ပါ။ ဘာကို ထိန်းထားရမလဲ ပြောပြီး
      အကျဉ်းချုပ်ခိုင်းတာပါ။ compaction ဆိုတာ စကားဝိုင်း အဟောင်းကို အကျဉ်းချုပ်ပြီး context ထဲ နေရာ ပြန်ယူတာ ဖြစ်ပါတယ်။
      [[mark:t-clear]] ဒုတိယ တစ်ခုက clear ပါ။ clear command က context အလွတ်နဲ့ စကားဝိုင်း အသစ်ကို စပေးပါတယ်။ စကားဝိုင်း
      အဟောင်းက ပျောက်မသွားပါဘူး။ နောက်မှ resume command နဲ့ ပြန်ခေါ်လို့ ရပါတယ်။
      [[mark:t-resume]] တတိယ တစ်ခုက resume ပါ။ session တွေကို Claude Code က သိမ်းထားတော့၊ မနက်ဖြန်ကျမှ ဆက်လုပ်ချင်ရင်
      ဒီနေရာက ပြန်ဆက်လို့ ရပါတယ်။ session ကို rename command နဲ့ နာမည်ပေးထားရင် နာမည်နဲ့ ပြန်ရှာလို့ ရပါတယ်။
      Claude Code ကို ဖွင့်တဲ့အခါ နောက်ဆုံး session ကို ဆက်ဖို့ continue option နဲ့လည်း ဖွင့်လို့ ရပါတယ်။
    sources:
      - {
          title: "Claude Code Docs: Commands (clear, compact)",
          url: "https://code.claude.com/docs/en/commands",
        }
      - {
          title: "Claude Code Docs: Sessions (resume, continue)",
          url: "https://code.claude.com/docs/en/sessions",
        }
    actions:
      - {
          id: draw-t-open,
          type: whiteboard.apply,
          at: { mark: t-open },
          clear: true,
          upsertIds: [t-title],
        }
      - {
          id: draw-t-compact,
          type: whiteboard.apply,
          at: { mark: t-compact },
          upsertIds: [t-b1, t-l1, t-d1],
          drawMs: 1200,
        }
      - {
          id: draw-t-clear,
          type: whiteboard.apply,
          at: { mark: t-clear },
          upsertIds: [t-b2, t-l2, t-d2],
          drawMs: 1200,
        }
      - {
          id: draw-t-resume,
          type: whiteboard.apply,
          at: { mark: t-resume },
          upsertIds: [t-b3, t-l3, t-d3],
          drawMs: 1200,
        }

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ report ထဲက late fee line ပြီးသွားပြီ၊ test တွေလည်း pass ပြီ ဆိုပါစို့။ နောက်
      အလုပ်က customer app မှာ ပြမယ့် invoice PDF ရဲ့ ဖောင့် ပြဿနာပါ။ အခု session ကို ဘာလုပ်မလဲ။
      [[mark:q-a]] ပထမ အဖြေက compact လုပ်ပြီး ဒီ session ထဲမှာပဲ ဆက်လုပ်တာပါ။
      [[mark:q-b]] ဒုတိယ အဖြေက clear လုပ်ပြီး context အလွတ်နဲ့ အသစ်က စတာပါ။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ တစ်ခုပါ။ ဘာကြောင့်လဲဆိုတော့ compact လုပ်ရင်လည်း late fee report အကြောင်း
      အကျဉ်းချုပ်နဲ့ ဖတ်ထားတဲ့ file တချို့က context ထဲမှာ ကျန်နေမှာမို့ပါ။ PDF အလုပ်အတွက် အဲဒါတွေက အသုံးမဝင်ဘဲ နေရာ
      ယူရုံပဲ ရှိပါတယ်။ အလုပ်အသစ်နဲ့ မဆိုင်တဲ့ အကြောင်းအရာက Claude ကို ရှုပ်စေနိုင်ပါတယ်။ report အလုပ်ကို ပြန်လိုရင်တော့
      resume နဲ့ ပြန်ခေါ်လို့ ရပါတယ်။
      [[mark:q-rule]] ဒါကြောင့် အလုပ် တစ်ခုတည်းကို ဆက်လုပ်နေတုန်းမှာ နေရာ လိုလာရင် compact လုပ်ပါ။ အလုပ် ပြောင်းတဲ့အခါမှာတော့
      clear လုပ်ပါ။
    sources:
      - {
          title: "Claude Code Docs: Commands (clear, compact)",
          url: "https://code.claude.com/docs/en/commands",
        }
      - {
          title: "Claude Code Docs: Best practices",
          url: "https://code.claude.com/docs/en/best-practices",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: q-rule },
          upsertIds: [q-t1, q-t2],
          drawMs: 1600,
        }

  - id: habits
    chapter: Context အကျင့်
    narration: >
      [[mark:h-open]] ဒီ ရွေးချယ်မှုတွေကို Billing team အတွက် table တစ်ခုနဲ့ ချရေးကြည့်ရအောင်။ ဖြစ်နေတဲ့ အခြေအနေ၊
      လုပ်မယ့်အရာ၊ ဘာကြောင့်လဲ ဆိုတဲ့ column သုံးခု ပါပါတယ်။
      [[mark:type-r1]] ပထမ အတန်းက အလုပ် တူတူကို ဆက်လုပ်နေတုန်း session ရှည်လာတာပါ။ compact လုပ်ပြီး ဘာကို ထိန်းထားရမလဲ
      ပြောပါတယ်။ ဥပမာ late fee report အတွက်ဆိုရင် report code ကိုပဲ ပြင်ရမယ် ဆိုတာမျိုးပါ။
      [[mark:type-r2]] ဒုတိယ အတန်းက မေးခွန်းမှာ တွေ့ခဲ့တဲ့ အခြေအနေပါ။ အလုပ် ပြီးလို့ နောက်အလုပ်က မဆိုင်ရင် clear
      လုပ်ပါတယ်။
      [[mark:type-r3]] တတိယ အတန်းက Claude ကို နှစ်ခါ ပြင်ခိုင်းပြီးတာတောင် အမှား တစ်ခုတည်း ထပ်ဖြစ်နေတာပါ။ အဲဒီလို
      အခြေအနေမှာ ဆက်ပြင်ခိုင်းမယ့်အစား clear လုပ်ပြီး ပိုရှင်းတဲ့ prompt နဲ့ ပြန်စဖို့ Claude Code ရဲ့ docs က
      အကြံပေးပါတယ်။ မှားခဲ့တဲ့ ကြိုးစားမှုတွေ context ထဲမှာ ကျန်နေလို့ပါ။
      [[mark:type-r4]] စတုတ္ထ အတန်းက မနက်ဖြန်မှ ဆက်လုပ်မယ့် အလုပ်ပါ။ session ကို နာမည်ပေးထားပြီး resume နဲ့ ပြန်ဆက်ပါတယ်။
      [[mark:type-r5]] နောက်ဆုံး အတန်းက session တိုင်းမှာ မပျောက်ရမယ့် စည်းကမ်းပါ။ chat ထဲမှာ မပြောဘဲ CLAUDE.md ထဲ
      ရေးပါတယ်။ compaction ပြီးရင်လည်း disk ကနေ ပြန်ဖတ်ထည့်တာမို့ပါ။
    sources:
      - {
          title: "Claude Code Docs: Best practices",
          url: "https://code.claude.com/docs/en/best-practices",
        }
      - { title: "Claude Code Docs: Sessions", url: "https://code.claude.com/docs/en/sessions" }
    actions:
