  - id: table
    narration: >-
      [[mark:show-table]] နည်း သုံးမျိုးကို ယှဉ်ကြည့်ရအောင်။ [[mark:pt-r1]] construction က မှားတဲ့ data
      မဖြစ်ခင်ကတည်းက တားပေမဲ့ object တစ်ခုစာပဲ မြင်ပါတယ်။ [[mark:table-2]] runtime check က ဖြစ်တဲ့
      အချိန်မှာပဲ ဖမ်းပေမဲ့ သူ့ code လမ်းကြောင်းကိုပဲ မြင်ပါတယ်။ ဒါကြောင့် ledger ကို ရေးတဲ့ လမ်းကြောင်း
      တစ်ခုတည်းပဲ ထားဖို့ လိုပါတယ်။ [[mark:table-3]] post-factum က သိမ်းထားသမျှကို မြင်ပြီး၊ ship
      ပြီးသား bug ကို ဖမ်းနိုင်တဲ့ နည်း တစ်ခုတည်းပါ၊ ဒါပေမဲ့ နောက်ကျပါတယ်။ [[mark:table-4]]
      ဒါကြောင့် တကယ့် system တွေက သုံးမျိုးလုံးကို တွဲသုံးကြပါတယ်။ invariant ကို ယူဆထားလို့ မရဘဲ
      စစ်ရပြီး၊ ကိုယ့် code ထုတ်ပေးတဲ့ data ကိုတောင် ပြန်စစ်ရတာ No trust မူပါပဲ။ [[mark:pbt]] runtime
      check ကို property-based test ထဲမှာလည်း သုံးနိုင်ပြီး၊ အဲဒါကို testing အပိုင်းမှာ ကြည့်ပါမယ်။
    sources:
