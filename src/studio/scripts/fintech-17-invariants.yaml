      ledger.go: |
        package main

        import "fmt"

        // Line is one row of a transaction: an amount on the debit or the credit side of one account.
        type Line struct {
        	Account string
        	Debit   int64
        	Credit  int64
        }

        // Tx is one business event. All of its lines are posted together, or none of them.
        type Tx struct {
        	ID    string
        	Memo  string
        	Lines []Line
        }

        // Ledger is an append-only list of posted transactions. Balances are derived from it.
        type Ledger struct {
        	txs []Tx
        }

        // Post appends a transaction only if its debits equal its credits.
        func (l *Ledger) Post(tx Tx) error {
        	var debit, credit int64
        	for _, line := range tx.Lines {
        		debit += line.Debit
        		credit += line.Credit
        	}
        	if debit != credit {
        		return fmt.Errorf("tx %s is not balanced: debit %s, credit %s", tx.ID, cents(debit), cents(credit))
        	}
        	l.txs = append(l.txs, tx)
        	return nil
        }

        // cents prints minor units as an amount with two decimals: cents(1234) is "12.34".
        func cents(n int64) string {
        	sign := ""
        	if n < 0 {
        		sign, n = "-", -n
        	}
        	return fmt.Sprintf("%s%d.%02d", sign, n/100, n%100)
        }
      main.go: |
        package main

        import "fmt"

        // Amount is a positive amount in minor units, and NewAmount is the only way to make one.
        // (In a real codebase Amount lives in its own package, so no other code can set cents.)
        type Amount struct{ cents int64 }

        func NewAmount(c int64) (Amount, error) {
        	if c <= 0 {
        		return Amount{}, fmt.Errorf("amount must be positive, got %s", cents(c))
        	}
        	return Amount{c}, nil
        }

        // transfer builds a two-line transaction from one Amount, so it cannot be unbalanced.
        func transfer(id, debit, credit string, a Amount) Tx {
        	return Tx{ID: id, Lines: []Line{{Account: debit, Debit: a.cents}, {Account: credit, Credit: a.cents}}}
        }

        // show prints one labelled result: ok, or why it was rejected.
        func show(label string, err error) {
        	if err != nil {
        		fmt.Println(label+": rejected —", err)
        		return
        	}
        	fmt.Println(label + ": ok")
        }

        func main() {
        	l := &Ledger{}
        	_, err := NewAmount(-500)
        	show("construct -5.00", err)
        	a, _ := NewAmount(10000)
        	show("post t1", l.Post(transfer("t1", "asset:bank", "liability:user:1042", a)))
        }
      nightly.go: |
        package main

        import "fmt"

        // nightlyCheck is a separate job. It reads what was stored, not what Post was asked to do,
        // and it does not call Post's code: a check that shares the code it checks shares its bugs.
        func nightlyCheck(l *Ledger) string {
        	for _, tx := range l.txs {
        		var debit, credit int64
        		for _, line := range tx.Lines {
        			debit += line.Debit
        			credit += line.Credit
        		}
        		if debit != credit {
        			return fmt.Sprintf("tx %s is not balanced: debit %s, credit %s", tx.ID, cents(debit), cents(credit))
        		}
        	}
        	return "ok"
        }
