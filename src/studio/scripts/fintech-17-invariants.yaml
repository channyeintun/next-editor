  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] Fintech interview တွေမှာ invariant ဆိုတာ ဘာလဲ၊ books အမြဲ balance ဖြစ်နေတယ်
      ဆိုတာ ဘယ်လို အာမခံမလဲ လို့ မေးလေ့ရှိပါတယ်။ Post ထဲမှာ စစ်ထားပါတယ် လို့ပဲ ဖြေရင် တစ်ဝက်ပဲ
      ရှိပါသေးတယ်။ အချက် သုံးချက်နဲ့ ဖြေပါ။ [[mark:iv-a]] ပထမ၊ construction နဲ့ မှားတဲ့ transaction ကို
      ဆောက်လို့ မရအောင် type၊ constructor၊ database constraint တွေနဲ့ ကာပါ။ [[mark:iv-b]] ဒုတိယ၊ ledger ကို ရေးတဲ့ လမ်းကြောင်း
      တစ်ခုတည်းမှာ runtime check ထားပြီး၊ မညီရင် transaction တစ်ခုလုံးကို ငြင်းပါ။ log ရေးပြီး
      ဆက်မသွားပါနဲ့။ [[mark:iv-c]] တတိယ၊ သိမ်းထားတဲ့ data ကို သီးခြား job တစ်ခုနဲ့ ညတိုင်း ပြန်စစ်ပြီး၊
      ဘဏ်နဲ့လည်း reconcile လုပ်ပါ။ လမ်းကြောင်းကို ကျော်တဲ့ write တွေနဲ့ ship ပြီးသား bug တွေကို ဖမ်းတာ
      ဒီတစ်ခုပဲ ရှိပါတယ်။ [[mark:iv-d]] ပြီးရင် ကိုယ် ဘာလုပ်မလဲ ဆက်ပြောပါ။ nightly check က တစ်ခုခု
      တွေ့ရင် data ကို တိုက်ရိုက် မပြင်ဘဲ alert ပေးပြီး စစ်ဆေးမယ်၊ ပြင်ရင်လည်း original နဲ့ link ပါတဲ့
      reversal ဒါမှမဟုတ် correction နဲ့ပဲ ပြင်မယ် ဆိုတာပါ။
    sources:
      - {
