build:
  voiceProfile:
    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 9517

runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "construct -5.00: rejected — amount must be positive, got -5.00\npost t1: ok\n"
      run-2:
        status: success
        exitCode: 0
        output: "construct -5.00: rejected — amount must be positive, got -5.00\npost t1: ok\npost t2: rejected — tx t2 is not balanced: debit 100.00, credit 102.90\n"
      run-3:
        status: success
        exitCode: 0
        output: "construct -5.00: rejected — amount must be positive, got -5.00\npost t1: ok\npost t2: rejected — tx t2 is not balanced: debit 100.00, credit 102.90\nnightly: tx t3 is not balanced: debit 50.00, credit 0.00\n"

scenes:
  - id: hook
    chapter: Invariant ဆိုတာ ဘာလဲ
    narration: >-
      ledger က ငွေ ဘယ်လို ရွေ့ခဲ့လဲ ဆိုတာကို မှတ်ပေးပါတယ်။ အခုကစပြီး ငွေကို တကယ် ရွှေ့တဲ့ flow
      တွေဘက် ကူးပါမယ်။ flow တစ်ခုက write တစ်ခါတည်း မဟုတ်ပါဘူး၊ အဆင့်တွေ၊ တပြိုင်နက် ဝင်လာတဲ့
      request တွေ၊ ကြားထဲမှာ ပျက်သွားတာတွေကို ဖြတ်သွားရပြီး၊ အဲဒီ တစ်လျှောက်လုံးမှာ invariant တွေ
      မပျက်ရပါဘူး။ [[mark:define]] invariant ဆိုတာ ဘယ်အချိန်မှာမဆို မှန်နေရမယ့် အခြေအနေ ဖြစ်ကြောင်း immutability မှာ တွေ့ခဲ့ပါပြီ။ accounting
      equation က တစ်ခု၊ post လုပ်ထားတဲ့ transaction တိုင်း balance ဖြစ်ရမယ် ဆိုတာက တစ်ခုပါ။ business
      က သတ်မှတ်တဲ့ limit တွေကလည်း invariant တွေပါပဲ။ မေးစရာက အဲဒါတွေကို ဘယ်နေရာမှာ စစ်မလဲ
      ဆိုတာပါ။ [[mark:sel-amount]] ပထမ နေရာက type ပါ။ Amount တစ်ခု ရနိုင်တဲ့ နည်းက ဒီ constructor
      တစ်ခုတည်းပဲ ရှိပြီး၊ သူက သုည နဲ့ အနုတ် ပမာဏကို လက်မခံပါဘူး။ [[mark:sel-transfer]] transfer
      ကတော့ Amount တစ်ခုတည်းကနေ line နှစ်ကြောင်းကို ဆောက်ပေးလို့ debit နဲ့ credit မညီတဲ့
      transaction ကို ဆောက်လို့ကို မရပါဘူး။ [[mark:sel-main]] main ထဲမှာ အနုတ် ငါးယူရိုနဲ့ Amount
      တစ်ခု ဆောက်ကြည့်ပြီး၊ ယူရို ၁၀၀ deposit ကို post လုပ်ပါတယ်။ [[mark:run-1]] run လိုက်ရအောင်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Invariants (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#invariants",
        }
      - {
          title: "Fintech Engineering Handbook — Executing money flows (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#executing-money-flows",
        }
    actions:
      - { id: open-main-1, type: workspace.openFile, at: { scene: start }, path: main.go }
      - id: sel-amount
        type: editor.select
        at: { mark: sel-amount }
        target: { file: main.go, text: "func NewAmount(c int64) (Amount, error) {", occurrence: 1 }
      - id: sel-transfer
        type: editor.select
        at: { mark: sel-transfer }
        target:
          {
            file: main.go,
            text: "func transfer(id, debit, credit string, a Amount) Tx {",
            occurrence: 1,
          }
      - id: sel-main
        type: editor.select
        at: { mark: sel-main }
        target:
          {
            file: main.go,
            text: "\t_, err := NewAmount(-500)\n\tshow(\"construct -5.00\", err)",
            occurrence: 1,
          }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "construct -5.00: rejected",
          timeoutMs: 8000,
        }

  - id: read-1
    narration: >-
      [[mark:pt-construct]] အနုတ် ပမာဏကို constructor က ငြင်းလိုက်ပါတယ်။ မှားတဲ့ Amount က program ထဲမှာ
      တစ်ခါမှ မရှိခဲ့ပါဘူး၊ ဒါကြောင့် ဒီနောက်က code ဘယ်နေရာမှာမှ ပမာဏ အပေါင်း ဟုတ်မဟုတ် ပြန်စစ်စရာ
      မလိုတော့ပါဘူး။ [[mark:pt-t1]] deposit ကတော့ ပုံမှန်အတိုင်း post ဖြစ်သွားပါတယ်။ [[mark:dock-1]] ဒါကို
      by construction လို့ ခေါ်ပါတယ်၊ မှားတဲ့ state ကို ကိုယ်စားပြုလို့ကို မရအောင် လုပ်ထားတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Invariants (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#invariants",
        }
    actions:
      - id: pt-construct
        type: console.point
        at: { mark: pt-construct }
        target: { text: "construct -5.00: rejected", occurrence: 1 }
      - id: pt-t1
        type: console.point
        at: { mark: pt-t1 }
        target: { text: "post t1: ok", occurrence: 1 }
      - { id: dock-1, type: runtime.collapseDock, at: { mark: dock-1 } }

  - id: nets
    chapter: စစ်လို့ရတဲ့ အချိန် သုံးခု
    narration: >-
      [[mark:show-nets]] transaction တစ်ခုကို စစ်လို့ရတဲ့ အချိန် သုံးခု ရှိပါတယ်။ code က ဆောက်တဲ့
      အချိန်၊ Post က လက်ခံတဲ့ အချိန်၊ ပြီးတော့ ledger ထဲမှာ သိမ်းပြီးသွားတဲ့ အချိန်ပါ။ [[mark:nets-2]]
      ပထမ အချိန်မှာ စစ်တာက by construction ပါ။ မှားတဲ့ object က ဘယ်တော့မှ မရှိလာလို့ အင်အား
      အကြီးဆုံးပါ။ [[mark:nets-3]] ဒုတိယက runtime check ပါ။ logic run နေတဲ့ နေရာမှာ assertion
      ထားတာမို့ invariant ပျက်တဲ့ အချိန်မှာပဲ ဖမ်းမိပြီး၊ ငွေ မရွေ့ခင် ရပ်လိုက်နိုင်ပါတယ်။
      [[mark:nets-4]] တတိယက post-factum ပါ။ သိမ်းပြီးသား data ကို နောက်မှ ပြန်ဖတ်ပြီး ချိုးဖောက်ထားတာ
      ရှိမရှိ ရှာတာပါ။ ညတိုင်း run တဲ့ check တွေနဲ့ reconciliation job တွေ ဒီထဲမှာ ပါပါတယ်။
      reconciliation ဆိုတာ system နှစ်ခုရဲ့ မှတ်တမ်းတွေ ကိုက်မကိုက် တိုက်စစ်တာပါ။ [[mark:pt-n3]] code
      ကို ကျော်ပြီး တိုက်ရိုက် ရေးသွားတဲ့ data ကို မြင်နိုင်တာ ဒီနည်း တစ်ခုတည်းပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Invariants (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#invariants",
        }
      - {
          title: "Fintech Engineering Handbook — Reconciliation (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#reconciliation",
        }
    actions:
      - {
          id: show-nets,
          type: slide.show,
          at: { mark: show-nets, offsetMs: -700 },
          slideId: nets-1,
        }
      - {
          id: pt-nets-1,
          type: slide.point,
          at: { afterAction: show-nets },
          target: { x: 0.175, y: 0.431 },
        }
      - { id: nets-2, type: slide.show, at: { mark: nets-2 }, slideId: nets-2 }
      - {
          id: pt-nets-2,
          type: slide.point,
          at: { afterAction: nets-2 },
          target: { x: 0.175, y: 0.664 },
        }
      - { id: nets-3, type: slide.show, at: { mark: nets-3 }, slideId: nets-3 }
      - {
          id: pt-nets-3,
          type: slide.point,
          at: { afterAction: nets-3 },
          target: { x: 0.5, y: 0.664 },
        }
      - { id: nets-4, type: slide.show, at: { mark: nets-4 }, slideId: nets-4 }
      - {
          id: pt-nets-4,
          type: slide.point,
          at: { afterAction: nets-4 },
          target: { x: 0.825, y: 0.664 },
        }
      - { id: pt-n3, type: slide.point, at: { mark: pt-n3 }, target: { x: 0.5, y: 0.942 } }

  - id: runtime
    narration: >-
      [[mark:close-nets]] construction က အကုန်လုံးကို မကာနိုင်ပါဘူး။ fee ပါတဲ့ payout လို line
      သုံးကြောင်း transaction ကို transfer နဲ့ ဆောက်လို့ မရတော့ code က line တွေကို ကိုယ်တိုင်
      စီရပါတယ်။ [[mark:type-t2]] ဒီ payout က user ဆီက ယူရို ၁၀၀ ကို debit လုပ်ပြီး၊ fee နှစ် ဒသမ ကိုး ကို
      revenue ထဲ credit လုပ်ပါတယ်။ ဒါပေမဲ့ bank ဘက် line မှာ fee ကို နုတ်ဖို့ ကျန်ခဲ့လို့ bank ကနေ
      ယူရို ၁၀၀ အပြည့် ထွက်သွားမယ့် ပုံ ဖြစ်နေပါတယ်။ [[mark:run-2]] run လိုက်ရအောင်။ [[mark:pt-t2]] Post က transaction တစ်ခုလုံးကို
      ငြင်းလိုက်ပါတယ်။ debit က ယူရို ၁၀၀ ဖြစ်ပြီး credit က ၁၀၂ ဒသမ ကိုး ဖြစ်နေတော့၊ ကွာနေတဲ့ နှစ် ဒသမ ကိုး
      က ဘယ်ကမှ မလာတဲ့ ငွေပါ။ [[mark:open-ledger]] ဒီ စစ်တဲ့ code က ledger ရဲ့ Post ထဲမှာ ရှိပါတယ်။
      [[mark:sel-check]] debit နဲ့ credit မညီတာနဲ့ error ပြန်ပြီး line တစ်ကြောင်းမှ မသိမ်းပါဘူး၊ log
      ရေးပြီး ဆက်သွားတာ မဟုတ်ပါဘူး။ ယူဆချက် ပျက်ရင် ကျယ်ကျယ်လောင်လောင် fail ဖြစ်ရမယ်
      ဆိုတာက No trust မူပါ၊ ဆိုလိုတာက ဘယ်သူ့ကိုမှ၊ ကိုယ့် component ကိုတောင် အလိုလို မယုံရဘူး
      ဆိုတာပါ။ [[mark:path]] ဒါပေမဲ့ runtime check က သူ ရှိတဲ့ code လမ်းကြောင်းကို ဖြတ်တဲ့ write တွေကိုပဲ
      မြင်ပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Invariants (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#invariants",
        }
      - {
          title: "Fintech Engineering Handbook — Principles (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#principles",
        }
    actions:
      - { id: close-nets, type: slide.close, at: { mark: close-nets } }
      - id: type-t2
        type: editor.type
        at: { mark: type-t2 }
        target:
          {
            file: main.go,
            after: "\tshow(\"post t1\", l.Post(transfer(\"t1\", \"asset:bank\", \"liability:user:1042\", a)))\n",
            occurrence: 1,
          }
        text: "\n\tshow(\"post t2\", l.Post(Tx{ID: \"t2\", Memo: \"payout with a fee\", Lines: []Line{\n\t\t{Account: \"liability:user:1042\", Debit: 10000},\n\t\t{Account: \"asset:bank\", Credit: 10000},\n\t\t{Account: \"revenue:fees\", Credit: 290},\n\t}}))\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "post t2: rejected",
          timeoutMs: 8000,
        }
      - id: pt-t2
        type: console.point
        at: { mark: pt-t2 }
        target: { text: "post t2: rejected", occurrence: 1 }
      - { id: open-ledger, type: workspace.openFile, at: { mark: open-ledger }, path: ledger.go }
      - id: sel-check
        type: editor.select
        at: { mark: sel-check }
        target: { file: ledger.go, text: "\tif debit != credit {", occurrence: 1 }

  - id: bypass
    chapter: Code ကို ကျော်ပြီး ရေးရင်
    narration: >-
      [[mark:open-main-2]] Post ကို မဖြတ်ဘဲ ရေးရင် ဘာဖြစ်မလဲ။ backfill script တစ်ခု၊ migration တစ်ခု၊
      production database မှာ လက်နဲ့ run လိုက်တဲ့ SQL တစ်ကြောင်း စတာတွေက application code ကို
      မဖြတ်ပါဘူး။ [[mark:type-t3]] ဒီ line တွေက ledger ရဲ့ storage ထဲကို တိုက်ရိုက် append လုပ်ပြီး၊
      bank account ကို ယူရို ငါးဆယ် debit လုပ်တဲ့ line တစ်ကြောင်းတည်း ထည့်ပါတယ်။ credit ဘက်မှာ ဘာမှ
      မရှိပါဘူး။ နောက်ဆုံး line က nightly check ရဲ့ ရလဒ်ကို ထုတ်ပြပါတယ်။ [[mark:open-nightly]] nightly
      check က သီးခြား job တစ်ခုပါ။ [[mark:sel-nightly]] Post ကို ဘာ ခိုင်းခဲ့လဲ ဆိုတာ မကြည့်ဘဲ
      သိမ်းထားပြီးသား transaction တိုင်းကို ပြန်ပေါင်းပါတယ်။ ဒီ write အတွက် runtime check က ဘာပြောမလဲ၊
      nightly check က ဘာပြောမလဲ၊ run မလုပ်ခင် ခန့်မှန်းကြည့်ပါ။ [[mark:run-3]] run လိုက်ရအောင်။
      [[mark:pt-nightly]] runtime check က ဘာမှ မပြောပါဘူး၊ ဘာကြောင့်လဲဆိုတော့ ဒီ write က သူ့ဆီကို
      မရောက်ခဲ့လို့ပါ။ nightly check ကတော့ backfill transaction မှာ debit ယူရို ငါးဆယ် ရှိပြီး credit
      သုည ဖြစ်နေတာကို တွေ့ပါတယ်။ [[mark:dock-3]] သတိထားရမှာက အချိန်ပါ။ ဒီ check က ညမှ run တော့
      မှားနေတဲ့ balance က နာရီ အတော်ကြာ ရှိနေခဲ့ပြီး၊ အဲဒီ balance ကို ကြည့်ပြီး ငွေ ထုတ်ခွင့် ပြုခဲ့ရင်
      ငွေက ထွက်သွားပြီးသား ဖြစ်နေပါပြီ။ [[mark:independent]] nightly check က Post ရဲ့ code ကို ပြန်မသုံးဘဲ
      သီးခြား ရေးထားတာလည်း အကြောင်းရှိပါတယ်၊ စစ်ခံရတဲ့ code ကို မှီနေရင် bug တစ်ခုတည်းက နှစ်နေရာလုံးမှာ
      ပါသွားလို့ပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Invariants (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#invariants",
        }
    actions:
      - { id: open-main-2, type: workspace.openFile, at: { mark: open-main-2 }, path: main.go }
      - id: type-t3
        type: editor.type
        at: { mark: type-t3 }
        target:
          {
            file: main.go,
            after: "\t\t{Account: \"revenue:fees\", Credit: 290},\n\t}}))\n",
            occurrence: 1,
          }
        text: "\n\tl.txs = append(l.txs, Tx{ID: \"t3\", Memo: \"backfill script\", Lines: []Line{\n\t\t{Account: \"asset:bank\", Debit: 5000},\n\t}})\n\tfmt.Println(\"nightly:\", nightlyCheck(l))\n"
        cadence: line-by-line
      - { id: open-nightly, type: workspace.openFile, at: { mark: open-nightly }, path: nightly.go }
      - id: sel-nightly
        type: editor.select
        at: { mark: sel-nightly }
        target: { file: nightly.go, text: "\tfor _, tx := range l.txs {", occurrence: 1 }
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "nightly: tx t3 is not balanced",
          timeoutMs: 8000,
        }
      - {
          id: expect-file-nightly,
          type: expect.file,
          at: { afterAction: run-3 },
          path: main.go,
          contains: 'fmt.Println("nightly:", nightlyCheck(l))',
        }
      - id: pt-nightly
        type: console.point
        at: { mark: pt-nightly }
        target: { text: "nightly: tx t3 is not balanced", occurrence: 1 }
      - { id: dock-3, type: runtime.collapseDock, at: { mark: dock-3 } }

  - id: scope
    chapter: ဘယ် invariant ကို ဘယ်မှာ စစ်မလဲ
    narration: >-
      [[mark:show-scope]] ဒါဆို construction တစ်ခုတည်းနဲ့ ဘာလို့ မလုံလောက်တာလဲ။ invariant တိုင်းမှာ သူ
      ကြည့်ရမယ့် နယ်ပယ် ရှိလို့ပါ။ [[mark:pt-v1]] ပမာဏ အပေါင်း ဖြစ်ရမယ် ဆိုတာက တန်ဖိုး တစ်ခုတည်းကို
      ကြည့်ရုံနဲ့ ရလို့ type နဲ့ အပြည့် ကာနိုင်ပါတယ်။ [[mark:scope-2]] transaction balance ဖြစ်ရမယ်
      ဆိုတာကတော့ line အများကြီးကို ပေါင်းကြည့်ရလို့၊ transfer လို constructor နဲ့ တစ်စိတ်တစ်ပိုင်းပဲ
      ကာနိုင်ပြီး Post ထဲက check လိုသေးပါတယ်။ database ဘက်မှာလည်း row တစ်ကြောင်းချင်းကို စစ်တဲ့ constraint က row အများကြီး ပေါင်းမှ
      သိရတဲ့ စည်းမျဉ်းကို မစစ်နိုင်ပါဘူး။ [[mark:scope-3]] account balance အနုတ် မဖြစ်ရဘူး ဆိုတာက
      transaction တစ်ခုထက် ပိုကျယ်ပါတယ်။ account ရဲ့ transaction အားလုံးပေါ် မူတည်လို့ object တစ်ခုကို
      ကြည့်ရုံနဲ့ မသိနိုင်ပါဘူး၊ ငွေ ထုတ်ခွင့် ပြုတဲ့ authorization အချိန်မှာ runtime check နဲ့ စစ်ရပါတယ်။ [[mark:scope-4]] အကျယ်ဆုံးကတော့ ကိုယ့် ledger ထဲက bank account နဲ့ ဘဏ်ရဲ့
      statement ကိုက်ရမယ် ဆိုတာပါ။ system နှစ်ခုကို ဖြတ်တဲ့ invariant မို့ ကိုယ့် code ထဲမှာ ဘယ်လိုမှ
      စစ်လို့ မရဘဲ၊ post-factum reconciliation နဲ့ပဲ စစ်နိုင်ပါတယ်။ [[mark:pt-w4]] နယ်ပယ် ကျယ်လာလေ၊
      စစ်နိုင်တဲ့ အချိန် နောက်ကျလာလေ ဖြစ်ပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Invariants (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#invariants",
        }
      - {
          title: "Fintech Engineering Handbook — Handling overdrafts (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#handling-overdrafts",
        }
      - {
          title: "Fintech Engineering Handbook — Reconciliation (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#reconciliation",
        }
    actions:
