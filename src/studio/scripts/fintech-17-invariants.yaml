# Fintech Engineering, lesson 17: invariants and three ways to enforce them (Burmese).
#
# Source: Fintech Engineering Handbook, "Invariants" (CC BY 4.0, Voytek Pitula).
# Start state: main.go has Amount (a positive amount, one constructor) and transfer (a two-line,
# always balanced Tx); main tries a -5.00 Amount and posts a 100.00 deposit. ledger.go is the
# course ledger (Post rejects an unbalanced Tx); nightly.go is a separate scan of what is stored.
# Edits, all insert-only, in main.go:
#   1. a three-line payout whose bank leg forgot the fee     -> run-2: Post rejects t2
#   2. a backfill that appends straight to the store + scan  -> run-3: the nightly check finds t3
# Figures: nets (three moments, what each catches), scope (wider invariant, later check),
# table (what each sees and misses), iv (the interview answer).
# Built by ~/Documents/fintech-course-work/tools/build-lesson.ts; fixtures by sim-go.ts --write.
