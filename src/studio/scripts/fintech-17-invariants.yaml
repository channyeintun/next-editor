  - id: try-it
    chapter: ကိုယ်တိုင် စမ်းကြည့်ပါ
    narration: >-
      [[mark:close-iv]] ကိုယ်တိုင် စမ်းကြည့်ဖို့ တစ်ခု ရှိပါတယ်။ [[mark:open-main-3]] backfill transaction
      ကို ပြန်ကြည့်ပါ။ [[mark:sel-try]] ဒီ line အောက်ကို line တစ်ကြောင်း ထပ်ထည့်ပြီး၊ user ရဲ့ liability account ကို ယူရို ငါးဆယ်
      credit လုပ်ပါ။ run ကြည့်ရင် nightly check က ok လို့ ပြပါလိမ့်မယ်။ [[mark:try-why]] nightly check က ok
      ပြပေမဲ့ ဘဏ်ထဲကို တကယ် မရောက်ခဲ့တဲ့ ယူရို ငါးဆယ်ကို user က ထုတ်ယူလို့ ရသွားပါပြီ။ balance
      ဖြစ်တာနဲ့ မှန်တာ မတူပါဘူး၊ ဒီအမှားကို ledger အပြင်က ဘဏ် statement နဲ့ တိုက်စစ်တဲ့ reconciliation ကပဲ မြင်ပါတယ်။
      [[mark:recap]] ပြန်ချုပ်ရရင်၊ invariant တစ်ခုကို မဖြစ်ခင်၊ ဖြစ်နေတုန်း၊ သိမ်းပြီးမှ ဆိုတဲ့ အချိန်
      သုံးခုမှာ စစ်နိုင်ပြီး၊ တစ်ခုစီက ကျန်တဲ့ နှစ်ခု လွတ်သွားတာကို ဖမ်းပါတယ်။ နောက်ပိုင်း lesson တွေက
      တပြိုင်နက် ဝင်လာတဲ့ request တွေ၊ ကြားထဲမှာ ပျက်တာတွေကြားမှာ invariant ကို ဘယ်လို ထိန်းမလဲ
      ဆိုတာပါ။
      နောက် lesson မှာ request နှစ်ခုက balance တစ်ခုတည်းကို တပြိုင်နက် စစ်ပြီး နှစ်ခုလုံး ငွေထုတ်သွားတာကို
      ဘယ်လို ကာကွယ်မလဲ ကြည့်ပါမယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Reconciliation (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#reconciliation",
        }
      - {
          title: "Fintech Engineering Handbook — Funds reservation (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#funds-reservation",
        }
    actions:
      - { id: close-iv, type: slide.close, at: { mark: close-iv } }
      - { id: open-main-3, type: workspace.openFile, at: { mark: open-main-3 }, path: main.go }
      - id: sel-try
        type: editor.select
        at: { mark: sel-try }
        target:
          { file: main.go, text: "\t\t{Account: \"asset:bank\", Debit: 5000},", occurrence: 1 }

checks:
  - { type: timing.p95Ms, max: 300 }
