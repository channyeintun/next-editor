# CSS course (Burmese), lesson 37 of 43: blend modes.
#
# Narration is Burmese (voice-script.md next to this file; DESIGN.md is the
# span-by-span brief). Every [[mark:…]] sits where its action
# begins, at a sentence end; each span carries one piece of meaning.
# Everything the learner sees (title, chapters, whiteboard labels, UI strings)
# is Burmese already.
#
# Shape: board (recall lesson 36; the goal: a black-and-white photo + a gold
# layer + a dark blue layer = a duotone) → board (backdrop and source; the
# overlap is where the blend mode decides; channels 0–100 %; multiply
# 80 % × 50 % = 40 %; screen 80 %, 50 % → 90 %) → code tour (cream header with
# an inline SVG logo on an exact white square, the split banner with a white
# heading, a grey photo with an empty layer, a plain banner, the striped stage
# with a card and an overhanging circle, a second photo) → the logo: multiply
# (white square gone), screen (square back, black stem gone), multiply again
# → board (12 separable modes in four groups) → the split banner's heading:
# difference (light over dark, dark over light); exclusion explained → the
# empty layer: teal (normal covers the photo), then color (a teal tint that
# keeps the photo's light and shadow) → board (non-separable: which of hue /
# saturation / luminosity comes from the source) → the plain banner: tan +
# leaf tile + teal→orange gradient (line by line), background-blend-mode
# multiply → screen → overlay → the circle: multiply (stripes show through
# its outer half), the card: isolation: isolate (only the card is mixed in);
# stacking contexts → the duotone: grayscale photo, positioned figure,
# ::before/::after layers (z-index 1 over the filtered photo), gold multiply,
# navy screen → quiz + recap, hand-off to transitions (lesson 38).
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set(; no postcss config; no reload, no
# HTML edit, no click, no kit.js. The leaf tile comes from the pinned
# images.css (a data: URI in a custom property, read with var()). Every
# keystroke edit is paren-free keywords; the two edits with "(" (the banner's
# layers and the duotone's grayscale filter) are line-by-line, so every
# revealed line is balanced. Until a typed declaration is complete it is
# invalid and the previous one keeps painting.
#
# Measured in headless Chrome at 432 × 720 (probe/stages.ts, same anchors as
# this file, screenshots in probe/): header 0–144 (logo 64 × 64 at 16,16),
# split banner 160–266 (heading 44 px), tint photo 282–532 (400 × 250),
# pattern banner 548–668, striped stage 684–846 (card 224 × 136, circle
# 96 px hanging 48 px off the card's right edge), duotone photo 862–1112;
# document 1152 tall, so a scroll to 2000 clamps to 432 and shows the pattern
# banner, the stage and the duotone photo together.
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
schemaVersion: 1

