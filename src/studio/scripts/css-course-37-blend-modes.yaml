build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 4137

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  - id: blend-intro
    chapter: "Blend mode ဆိုတာ ဘာလဲ"
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ filter နဲ့ ဓာတ်ပုံကို မီးခိုးရောင် ဖြစ်အောင်၊ ဝါးအောင်၊
      ဓာတ်ပုံဟောင်းလို ဖြစ်အောင် ပြောင်းခဲ့ပါတယ်။ ဒီ lesson မှာတော့ element ရဲ့
      အရောင်တွေကို သူ့ နောက်က အလွှာတွေနဲ့ ရောပေးတဲ့ blend mode ကို ကြည့်ပါမယ်။
      [[mark:start-server]] ဒီလို ပြောနေတုန်းမှာပဲ၊ board နောက်မှာ dev server ကို
      စ နေပါပြီ။ [[mark:draw-goal-photo]] ဒီနေ့ လုပ်မယ့် ပုံကို အရင် ကြည့်ရအောင်။ အဖြူအမည်း
      ဓာတ်ပုံ တစ်ပုံကနေ စပါမယ်။ [[mark:draw-goal-layers]] သူ့အပေါ်မှာ ရွှေရောင် အလွှာနဲ့
      အပြာရင့် အလွှာ ထပ်တင်ပါမယ်။ [[mark:draw-goal-result]] ရလာတာက duotone ပါ။ အရောင်
      နှစ်ရောင်တည်းနဲ့ ပြတဲ့ ဓာတ်ပုံပါ။ [[mark:draw-goal-rule]] အမှောင်ပိုင်းတွေက အပြာ၊
      အလင်းပိုင်းတွေက ရွှေရောင် ဖြစ်သွားပါတယ်။ [[mark:draw-goal-recipe]] ဒါကို lesson
      အဆုံးမှာ သုံးမျိုး ပေါင်းပြီး လုပ်ပါမယ်။ ပြီးခဲ့တဲ့ lesson က filter၊ lesson 26 က
      pseudo-element နဲ့ ဒီနေ့ သင်မယ့် blend mode ပါ။
    sources:
      - title: "web.dev Learn CSS — Blend modes (duotone)"
        url: "https://web.dev/learn/css/blend-modes"
      - title: "MDN — mix-blend-mode"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/mix-blend-mode"
    actions:
      - id: open-goal-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      # Runs in the background (boot + pnpm install + spawn); waitForReady sits
      # on the preview mark in the code tour, well over 40 s of narration later.
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 45000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-goal-photo
        type: whiteboard.apply
        at: { mark: draw-goal-photo }
        upsertIds: [a-photo, a-photo-l]
        drawMs: 1200
      - id: draw-goal-layers
        type: whiteboard.apply
        at: { mark: draw-goal-layers }
        upsertIds: [a-plus-1, a-gold, a-gold-l, a-plus-2, a-blue, a-blue-l]
        drawMs: 2400
      - id: draw-goal-result
        type: whiteboard.apply
        at: { mark: draw-goal-result }
        upsertIds: [a-arrow, a-result, a-result-dark, a-result-l]
        drawMs: 1800
      - id: draw-goal-rule
        type: whiteboard.apply
        at: { mark: draw-goal-rule }
        upsertIds: [a-dark, a-light]
        drawMs: 2000
      - id: draw-goal-recipe
        type: whiteboard.apply
        at: { mark: draw-goal-recipe }
        upsertIds: [a-recipe]
        drawMs: 1600

  - id: source-backdrop
    narration: >
      [[mark:open-layers]] ဒါဆို အရောင် ရောတယ် ဆိုတာ ဘာလဲ။ [[mark:draw-backdrop]] backdrop
      ဆိုတာ element ရဲ့ နောက်မှာ ဆွဲပြီးသား အရာ အားလုံးပါ။ [[mark:draw-source]] source က
      အပေါ်က element ကိုယ်တိုင်ပါ။ [[mark:circle-overlap]] blend mode ဆိုတာ အလွှာ နှစ်ခု
      ထပ်နေတဲ့အခါ အပေါ်က အရောင်နဲ့ အောက်က အရောင်ကို ဘယ်လို ရောမလဲ ဆိုတာပါ။ default ဖြစ်တဲ့
      normal mode မှာတော့ source က backdrop ကို ဖုံးလိုက်ပါတယ်။ အခုထိ မြင်ခဲ့တာ အဲဒါပါ။
      [[mark:draw-channels]] blend mode အများစုက အနီ၊ အစိမ်း၊ အပြာ channel တစ်ခုစီကို
      သီးသန့် တွက်ပါတယ်။ တစ်ခုစီမှာ 0 ကနေ 100 ရာခိုင်နှုန်းအထိ ပမာဏ ရှိပါတယ်။
      [[mark:draw-multiply]] multiply mode က ပမာဏ နှစ်ခုကို မြှောက်ပါတယ်။ 80
      ရာခိုင်နှုန်းကို တစ်ဝက်နဲ့ မြှောက်တော့ 40 ရာခိုင်နှုန်း ရပါတယ်။ 100 ထက် မကျော်တဲ့
      ပမာဏနဲ့ မြှောက်လို့၊ ရလဒ်က ဘယ်အလွှာထက်မှ ပိုမလင်းပါဘူး။ အဖြူနဲ့ မြှောက်ရင်တော့
      backdrop ဒီအတိုင်း ကျန်ပါတယ်။ [[mark:draw-screen]] screen mode က ပြောင်းပြန်ပါ။
      အဖြူနဲ့ ဘယ်လောက် ကွာလဲ ဆိုတာကို မြှောက်ပါတယ်။ 80 က အဖြူနဲ့ 20 ကွာပြီး၊ 50 က 50
      ကွာပါတယ်။ ကွာတာ နှစ်ခုကို မြှောက်တော့ 10 ပဲ ကွာလို့ 90 ရာခိုင်နှုန်း ရပါတယ်။
      ဒါကြောင့် ပိုလင်းဖို့ပဲ ရှိပြီး၊ အမည်းနဲ့ဆိုရင် backdrop ကို မပြောင်းပါဘူး။
    sources:
      - title: "web.dev Learn CSS — Blend modes: what is a blend mode?"
        url: "https://web.dev/learn/css/blend-modes#what_is_a_blend_mode"
      - title: "Compositing and Blending Level 1 — blending (source, backdrop, formulas)"
        url: "https://drafts.fxtf.org/compositing-1/#blending"
      - title: "MDN — <blend-mode> (normal, multiply, screen)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/blend-mode"
    actions:
      - id: open-layers-board
        type: whiteboard.apply
        at: { mark: open-layers }
        clear: true
        upsertIds: [b-title]
      - id: draw-backdrop
        type: whiteboard.apply
        at: { mark: draw-backdrop }
        upsertIds: [b-backdrop, b-backdrop-l]
        drawMs: 1600
      - id: draw-source
        type: whiteboard.apply
        at: { mark: draw-source }
        upsertIds: [b-source, b-source-l]
        drawMs: 1400
      - id: circle-overlap
        type: whiteboard.apply
        at: { mark: circle-overlap }
        upsertIds: [b-overlap, b-overlap-l]
        drawMs: 1600
      - id: draw-channels
        type: whiteboard.apply
        at: { mark: draw-channels }
        upsertIds: [b-rgb]
        drawMs: 1400
      - id: draw-multiply
        type: whiteboard.apply
        at: { mark: draw-multiply }
        upsertIds: [b-multiply]
        drawMs: 1800
      - id: draw-screen
        type: whiteboard.apply
        at: { mark: draw-screen }
        upsertIds: [b-screen]
        drawMs: 1800

  - id: code-tour
    narration: >
      [[mark:close-layers]] page ကို ကြည့်ရအောင်။ [[mark:open-index]] ဒါက HTML ဖိုင်ပါ။
      [[mark:select-logo]] header ထဲက logo က SVG ပုံ တစ်ခုပါ။ ဒီ အဖြူရောင် စတုရန်းပေါ်မှာ
      အရွက် တစ်ရွက်နဲ့ အမည်းရောင် အညှာ ရှိပါတယ်။ [[mark:select-split]] သူ့အောက်မှာ
      ဘယ်တစ်ခြမ်း မှောင်ပြီး ညာတစ်ခြမ်း လင်းနေတဲ့ banner ရှိပြီး၊ အဖြူရောင် ခေါင်းစဉ်
      အကြီးကြီး ပါပါတယ်။ [[mark:select-tint]] ပြီးတော့ ဓာတ်ပုံ တစ်ပုံနဲ့ သူ့ကို အတိအကျ
      ဖုံးထားတဲ့ အလွှာ အလွတ် ရှိပါတယ်။ [[mark:select-pattern]] နောက်ခံ မရှိသေးတဲ့ banner
      လည်း ရှိပါတယ်။ [[mark:select-iso]] အစင်းကြောင်း box ထဲမှာ အပြာဖျော့ရောင် card နဲ့၊
      card အစွန်းက ထွက်နေတဲ့ လိမ္မော်ရောင် စက်ဝိုင်း ရှိပါတယ်။ [[mark:select-duo]]
      နောက်ဆုံးက duotone အတွက် ဒုတိယ ဓာတ်ပုံပါ။ [[mark:open-styles]] CSS ဖိုင်က အလွတ်ပါ။
      ပထမ ဓာတ်ပုံကိုတော့ base CSS ဖိုင်ထဲမှာ grayscale filter နဲ့ မီးခိုးရောင်
      လုပ်ထားပြီးသားပါ။ [[mark:preview-opens]] preview ပွင့်လာပါပြီ။ header ကို ကြည့်ပါ၊
      အရွက် နောက်က အဖြူရောင် စတုရန်းက နို့နှစ်ရောင်ပေါ်မှာ ထင်ထင်ရှားရှား ပေါ်နေပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Blend modes"
        url: "https://web.dev/learn/css/blend-modes"
      - title: "MDN — filter: grayscale()"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/filter-function/grayscale"
    actions:
      - id: close-layers-board
        type: whiteboard.apply
        at: { mark: close-layers }
        open: false
      - id: open-index
        type: workspace.openFile
        at: { mark: open-index }
        path: index.html
      - id: select-logo
        type: editor.select
        at: { mark: select-logo }
        target:
          { file: index.html, text: '<rect width="64" height="64" fill="#fff" />', occurrence: 1 }
      - id: select-split
        type: editor.select
        at: { mark: select-split }
        target:
          {
            file: index.html,
            text: '<section class="split-banner" data-testid="split-banner">',
            occurrence: 1,
          }
      - id: select-tint
        type: editor.select
        at: { mark: select-tint }
        target:
          {
            file: index.html,
            text: '<div class="overlay" data-testid="tint-overlay"></div>',
            occurrence: 1,
          }
      - id: select-pattern
        type: editor.select
        at: { mark: select-pattern }
        target:
          {
            file: index.html,
            text: '<section class="pattern-banner" data-testid="pattern-banner">',
            occurrence: 1,
          }
      - id: select-iso
        type: editor.select
        at: { mark: select-iso }
        target:
          {
            file: index.html,
            text: '<span class="circle" data-testid="iso-circle"></span>',
            occurrence: 1,
          }
      - id: select-duo
        type: editor.select
        at: { mark: select-duo }
        target: { file: index.html, text: '<figure class="duo" data-testid="duo">', occurrence: 1 }
      - id: open-styles
        type: workspace.openFile
        at: { mark: open-styles }
        path: styles.css
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { mark: preview-opens }
        timeoutMs: 20000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-dev-server }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-shop-name
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: shop-name }
        textContains: "ရွှေလက်ဖက်ရည်ဆိုင်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-logo
        type: expect.preview
        at: { afterAction: expect-shop-name }
        timeoutMs: 5000
        target: { by: testId, value: logo }
        attribute: { name: class, value: logo }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: collapse-runner-dock
        type: runtime.collapseDock
        at: { afterAction: expect-logo }

  - id: multiply
    chapter: "Logo ကို header နဲ့ ရောကြည့်ရအောင်"
    narration: >
      [[mark:type-multiply]] logo ကို နောက်က header နဲ့ ရောကြည့်ရအောင်။ အဖြူရောင် စတုရန်းကို လိုက်ကြည့်ပါ။ logo အတွက် rule
      အသစ်မှာ mix blend mode ကို multiply ပေးပါမယ်။ [[mark:after-multiply]] စတုရန်း ပျောက်သွားလို့ အရွက်ကို
      နို့နှစ်ရောင်ပေါ်မှာ တိုက်ရိုက် မြင်ရပါပြီ။ [[mark:explain-multiply]] ဒီ multiply
      ကို ကြည့်ပါ။ အဖြူက 100 ရာခိုင်နှုန်း ဖြစ်လို့၊ နို့နှစ်ရောင်ကို အဖြူနဲ့ မြှောက်တော့
      ဒီအတိုင်း ကျန်ပါတယ်။ အရွက်နဲ့ အမည်းရောင် အညှာကတော့ ပိုမှောင်ဖို့ပဲ ရှိပေမယ့်၊
      မူလကတည်းက မှောင်နေလို့ သိပ် မပြောင်းပါဘူး။ [[mark:explain-mix]] mix blend mode က element တစ်ခုလုံးကို သူ့ နောက်က အရာနဲ့ ရောပါတယ်။ content၊ နောက်ခံ၊ border နဲ့ child တွေကို တစ်စုတည်း ပေါင်းပြီးမှ ရောလို့၊ ဒီ property က child တွေဆီ inherit မဖြစ်ပါဘူး။ initial value က normal ပါ။
    sources:
      - title: "web.dev Learn CSS — Blend modes: multiply"
        url: "https://web.dev/learn/css/blend-modes#multiply"
      - title: "MDN — mix-blend-mode (initial normal, not inherited)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/mix-blend-mode"
      - title: "Compositing and Blending Level 1 — mix-blend-mode"
        url: "https://drafts.fxtf.org/compositing-1/#mix-blend-mode"
    actions:
      - id: type-multiply
        type: editor.type
        at: { mark: type-multiply }
        cadence: fast-explainer
        target: { file: styles.css, after: "", occurrence: 1 }
        text: ".logo {\n  mix-blend-mode: multiply;\n}\n"
      - id: expect-multiply
        type: expect.preview
        at: { mark: after-multiply }
        timeoutMs: 4000
        target: { by: testId, value: logo }
        attribute: { name: class, value: logo }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-multiply
        type: editor.select
        at: { mark: explain-multiply }
        target: { file: styles.css, text: "mix-blend-mode: multiply;", occurrence: 1 }

  - id: screen
    narration: >
      [[mark:type-screen]] အခု ပြောင်းပြန် စမ်းကြည့်ရအောင်။ အောက်မှာ screen mode ကို
      ရေးပါမယ်။ နောက်မှ ရေးတဲ့ declaration က နိုင်ပါတယ်။ [[mark:after-screen]] အဖြူရောင်
      စတုရန်း ပြန်ပေါ်လာပါပြီ။ အဖြူထက် ပိုလင်းတာ မရှိလို့ပါ။ ဒါပေမဲ့ အမည်းရောင် အညှာ
      ပျောက်သွားပြီး၊ အရွက်လည်း ဖျော့သွားပါတယ်။ [[mark:explain-screen]] ဒီ screen mode ကို
      ကြည့်ပါ။ အမည်းက အလင်း ဘာမှ မထည့်လို့ ပျောက်သွားပြီး၊ ကျန်တဲ့ အရောင်တွေ အားလုံး
      ပိုလင်းလာပါတယ်။ projector နှစ်လုံးကို နေရာ တစ်ခုတည်းပေါ် ထိုးထားသလိုပါ။
      [[mark:type-remultiply]] နို့နှစ်ရောင် header ပေါ်က logo အတွက်တော့ multiply က
      ပိုသင့်တော်ပါတယ်။ ဒါကြောင့် အောက်ဆုံးမှာ ပြန်ထည့်ပါမယ်။ [[mark:after-remultiply]]
      အဖြူရောင် စတုရန်း ထပ်ပျောက်သွားပါပြီ။
    sources:
      - title: "web.dev Learn CSS — Blend modes: screen"
        url: "https://web.dev/learn/css/blend-modes#screen"
      - title: "MDN — <blend-mode>: screen"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/blend-mode#screen"
    actions:
      - id: type-screen
        type: editor.type
        at: { mark: type-screen }
        cadence: fast-explainer
        target: { file: styles.css, after: "  mix-blend-mode: multiply;\n", occurrence: 1 }
        text: "  mix-blend-mode: screen;\n"
      - id: expect-screen
        type: expect.preview
        at: { mark: after-screen }
        timeoutMs: 4000
        target: { by: testId, value: site-header }
        textContains: "ရွှေလက်ဖက်ရည်ဆိုင်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-screen
        type: editor.select
        at: { mark: explain-screen }
        target: { file: styles.css, text: "mix-blend-mode: screen;", occurrence: 1 }
      - id: type-remultiply
        type: editor.type
        at: { mark: type-remultiply }
        cadence: fast-explainer
        target: { file: styles.css, after: "  mix-blend-mode: screen;\n", occurrence: 1 }
        text: "  mix-blend-mode: multiply;\n"
      - id: expect-remultiply
        type: expect.preview
        at: { mark: after-remultiply }
        timeoutMs: 4000
        target: { by: testId, value: logo }
        attribute: { name: class, value: logo }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: separable-groups
    chapter: "Separable mode တွေ"
    narration: >
      [[mark:open-groups]] multiply နဲ့ screen mode က separable mode တွေထဲက နှစ်ခုပါ။
      separable ဆိုတာ channel တစ်ခုစီကို တွက်နည်း တစ်ခုတည်းနဲ့ သီးခြားစီ တွက်တာပါ။ normal
      ကလွဲရင် ဒီလို mode ဆယ့်တစ်ခု ရှိပြီး၊ အုပ်စု လေးခု ခွဲလို့ ရပါတယ်။
      [[mark:draw-darken]] ပိုမှောင်စေတဲ့ အုပ်စုမှာ multiply ပါပါတယ်။ darken က channel
      တစ်ခုစီမှာ ပိုမှောင်တဲ့ တန်ဖိုးကို ယူပြီး၊ color burn ကတော့ backdrop ကို multiply
      ထက် ပိုပြင်းပြင်း မှောင်စေလို့ contrast ပိုများပါတယ်။ သုံးခုလုံးမှာ source က
      အဖြူဆိုရင် ဘာမှ မပြောင်းပါဘူး။ [[mark:draw-lighten]] ပိုလင်းစေတဲ့ အုပ်စုကတော့
      အဲဒီရဲ့ ပြောင်းပြန်ပါ။ screen mode ပါပြီး၊ lighten က channel တစ်ခုစီမှာ ပိုလင်းတဲ့
      တန်ဖိုးကို ယူပါတယ်။ color dodge ကတော့ backdrop ကို အရမ်း လင်းစေလို့ အလင်းပိုင်းတွေ
      အဖြူ ဖြစ်သွားနိုင်ပါတယ်။ ဒီမှာတော့ source က အမည်းဆိုရင် ဘာမှ မပြောင်းပါဘူး။
      [[mark:explain-per-channel]] darken နဲ့ lighten က channel တစ်ခုချင်းစီ ရွေးလို့၊
      ရလဒ်က အလွှာ နှစ်ခုလုံးမှာ မရှိတဲ့ အရောင် ဖြစ်နိုင်ပါတယ်။ [[mark:draw-contrast]]
      contrast အုပ်စုကတော့ multiply ရော screen mode ပါ သုံးပါတယ်။ overlay က backdrop
      မှောင်တဲ့ နေရာမှာ multiply လုပ်ပြီး၊ လင်းတဲ့ နေရာမှာ screen mode လုပ်လို့ contrast
      တက်ပါတယ်။ hard light ကလည်း ဒီလိုပဲ ရွေးပေမယ့်၊ backdrop အစား source ကို ကြည့်ပြီး
      ရွေးပါတယ်။ soft light ကတော့ အဲဒီ သဘောကို ပိုပျော့အောင် လုပ်ထားလို့၊ အလင်း ပျော့ပျော့
      ထိုးထားသလိုပါ။ [[mark:draw-invert]] နောက်ဆုံး အုပ်စုက အရောင်ကို ပြောင်းပြန်
      လှန်နိုင်တဲ့ difference နဲ့ exclusion ပါ။ difference ကို preview ထဲမှာ
      စမ်းကြည့်ရအောင်။
    sources:
      - title: "web.dev Learn CSS — Blend modes: separable blend modes"
        url: "https://web.dev/learn/css/blend-modes#separable_blend_modes"
      - title: "MDN — <blend-mode> (all values)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/blend-mode"
      - title: "Compositing and Blending Level 1 — separable blend modes"
        url: "https://drafts.fxtf.org/compositing-1/#blendingseparable"
    actions:
      - id: open-groups-board
        type: whiteboard.apply
        at: { mark: open-groups }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-darken
        type: whiteboard.apply
        at: { mark: draw-darken }
        upsertIds: [c-dark-box, c-dark-h, c-dark-1, c-dark-2, c-dark-3]
        drawMs: 2400
      - id: draw-lighten
        type: whiteboard.apply
        at: { mark: draw-lighten }
        upsertIds: [c-light-box, c-light-h, c-light-1, c-light-2, c-light-3]
        drawMs: 2400
      - id: draw-contrast
        type: whiteboard.apply
        at: { mark: draw-contrast }
        upsertIds: [c-contrast-box, c-contrast-h, c-contrast-1, c-contrast-2, c-contrast-3]
        drawMs: 2400
      - id: draw-invert
        type: whiteboard.apply
        at: { mark: draw-invert }
        upsertIds: [c-invert-box, c-invert-h, c-invert-1, c-invert-2]
        drawMs: 2000

  - id: difference
    narration: >
      [[mark:close-groups]] editor ထဲ ပြန်သွားရအောင်။ [[mark:type-difference]] banner ထဲက
      ခေါင်းစဉ်က အဖြူရောင် ဖြစ်လို့၊ လင်းတဲ့ တစ်ခြမ်းပေါ်မှာ မမြင်သလောက် ဖြစ်နေပါတယ်။ rule
      အသစ် တစ်ခုနဲ့ ခေါင်းစဉ်ကို difference mode ပေးပါမယ်။ [[mark:after-difference]] အခု
      ခေါင်းစဉ်က မှောင်တဲ့ တစ်ခြမ်းပေါ်မှာ လင်းပြီး၊ လင်းတဲ့ တစ်ခြမ်းပေါ်မှာ မှောင်နေလို့
      စာလုံးတိုင်း ဖတ်လို့ ရပါပြီ။ [[mark:explain-difference]] ဒီ difference ကို ကြည့်ပါ။
      channel တစ်ခုစီမှာ လင်းတဲ့ တန်ဖိုးထဲက မှောင်တဲ့ တန်ဖိုးကို နှုတ်ပါတယ်။ ဒါကြောင့်
      source က အဖြူဆိုရင် နောက်က အရောင်ကို ပြောင်းပြန် လှန်ပြီး၊ အမည်းဆိုရင် ဘာမှ
      မပြောင်းပါဘူး။ အရောင် တူတူ နှစ်ခုဆိုရင်တော့ အမည်း ရပါတယ်။ [[mark:explain-exclusion]]
      exclusion ကလည်း ဒီလိုပဲ အလုပ်လုပ်ပေမယ့် contrast နည်းလို့၊ ရလဒ်က ပိုမှိုင်းပြီး
      မီးခိုးရောင် သန်းပါတယ်။ ဒီ အဖြူရောင် ခေါင်းစဉ်မှာတော့ နှစ်ခုလုံးက ရလဒ် အတိအကျ
      တူပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Blend modes: difference"
        url: "https://web.dev/learn/css/blend-modes#difference"
      - title: "web.dev Learn CSS — Blend modes: exclusion"
        url: "https://web.dev/learn/css/blend-modes#exclusion"
      - title: "Compositing and Blending Level 1 — difference and exclusion formulas"
        url: "https://drafts.fxtf.org/compositing-1/#blenddifference"
    actions:
      - id: close-groups-board
        type: whiteboard.apply
        at: { mark: close-groups }
        open: false
      - id: type-difference
        type: editor.type
        at: { mark: type-difference }
        cadence: fast-explainer
        target: { file: styles.css, after: "  mix-blend-mode: multiply;\n}\n", occurrence: 1 }
        text: "\n.split-banner h2 {\n  mix-blend-mode: difference;\n}\n"
      - id: expect-difference
        type: expect.preview
        at: { mark: after-difference }
        timeoutMs: 4000
        target: { by: testId, value: split-heading }
        textContains: "လက်ဖက်ရည်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-difference
        type: editor.select
        at: { mark: explain-difference }
        target: { file: styles.css, text: "mix-blend-mode: difference;", occurrence: 1 }

  - id: color-tint
    chapter: "Non-separable mode တွေ"
    narration: >
      [[mark:type-teal]] အခု မီးခိုးရောင် ဓာတ်ပုံဆီ သွားရအောင်။ ဓာတ်ပုံကို လိုက်ကြည့်ပါ။ ပထမဆုံး သူ့အပေါ်က အလွှာ အလွတ်ကို အစိမ်းပြာရောင် နောက်ခံ ပေးပါမယ်။
      [[mark:after-teal]] normal mode ဖြစ်လို့ အစိမ်းပြာရောင်က ဓာတ်ပုံ တစ်ပုံလုံးကို
      ဖုံးထားပါတယ်။ [[mark:type-color]] အခု အောက်မှာ အလွှာကို color ဆိုတဲ့ blend mode
      ပေးကြည့်ပါမယ်။ [[mark:after-color]] ဓာတ်ပုံ ပြန်ပေါ်လာပြီး အစိမ်းပြာရောင်
      သန်းသွားပါပြီ။ အလင်းနဲ့ အမှောင်တွေလည်း မပျောက်ပါဘူး။ [[mark:explain-color]] ဒီ color
      mode ကို ကြည့်ပါ။ သူက hue နဲ့ saturation ကို အစိမ်းပြာရောင် အလွှာကနေ ယူပြီး၊
      အလင်းအမှောင်ကိုတော့ နောက်က ဓာတ်ပုံကနေ ယူပါတယ်။ ဒါကြောင့် ပြတင်းပေါက်နဲ့ ခွက်တွေက
      လင်းနေဆဲ ဖြစ်ပြီး၊ ကြမ်းပြင်က မှောင်နေဆဲပါ။
    sources:
      - title: "web.dev Learn CSS — Blend modes: color"
        url: "https://web.dev/learn/css/blend-modes#color"
      - title: "MDN — <blend-mode>: color"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/blend-mode#color"
    actions:
      - id: type-teal
        type: editor.type
        at: { mark: type-teal }
        cadence: fast-explainer
        target: { file: styles.css, after: "  mix-blend-mode: difference;\n}\n", occurrence: 1 }
        text: "\n.tint .overlay {\n  background: teal;\n}\n"
      - id: expect-teal
        type: expect.preview
        at: { mark: after-teal }
        timeoutMs: 4000
        target: { by: testId, value: tint-overlay }
        attribute: { name: class, value: overlay }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-color
        type: editor.type
        at: { mark: type-color }
        cadence: fast-explainer
        target: { file: styles.css, after: "  background: teal;\n", occurrence: 1 }
        text: "  mix-blend-mode: color;\n"
      - id: expect-color
        type: expect.preview
        at: { mark: after-color }
        timeoutMs: 4000
        target: { by: testId, value: tint-photo }
        attribute: { name: alt, value: "ဆိုင်အတွင်းပိုင်း" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-color
        type: editor.select
        at: { mark: explain-color }
        target: { file: styles.css, text: "mix-blend-mode: color;", occurrence: 1 }

  - id: non-separable
    narration: >
      [[mark:open-hsl]] color mode က non-separable mode လေးခုထဲက တစ်ခုပါ။ non-separable
      ဆိုတာ အနီ၊ အစိမ်း၊ အပြာ ခွဲမတွက်ဘဲ၊ အရောင်ကို hue၊ saturation နဲ့ ဘယ်လောက် လင်းလဲ
      ဆိုတဲ့ luminosity ဆိုပြီး ခွဲကြည့်တာပါ။ lesson 9 မှာ တွေ့ခဲ့တဲ့ HSL နဲ့ ဆင်ပါတယ်။
      [[mark:draw-legend]] ဇယားထဲမှာ လိမ္မော်ရောင် အကွက်က source ကနေ ယူတဲ့ တန်ဖိုး၊
      အပြာရောင် အကွက်က backdrop ကနေ ယူတဲ့ တန်ဖိုးပါ။ [[mark:draw-hue]] hue mode က source
      ရဲ့ hue ကိုပဲ ယူပါတယ်။ [[mark:draw-saturation]] saturation mode က source ရဲ့
      saturation ကိုပဲ ယူလို့၊ မီးခိုးရောင် source က backdrop ကို အရောင် ပျောက်စေပါတယ်။
      [[mark:draw-color]] color mode က hue နဲ့ saturation နှစ်ခုလုံးကို ယူပါတယ်။ ခုနက
      စမ်းခဲ့တာ ဒါပါ။ [[mark:draw-luminosity]] luminosity mode ကတော့ color ရဲ့
      ပြောင်းပြန်ပါ။ source ရဲ့ luminosity ကို ယူပြီး၊ backdrop ရဲ့ hue နဲ့ saturation ကို
      ထားပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Blend modes: non-separable blend modes"
        url: "https://web.dev/learn/css/blend-modes#non-separable_blend_modes"
      - title: "Compositing and Blending Level 1 — non-separable blend modes"
        url: "https://drafts.fxtf.org/compositing-1/#blendingnonseparable"
      - title: "MDN — <blend-mode>: hue, saturation, color, luminosity"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/blend-mode"
    actions:
      - id: open-hsl-board
        type: whiteboard.apply
        at: { mark: open-hsl }
        open: true
        clear: true
        upsertIds: [d-title, d-col-hue, d-col-sat, d-col-lum]
      - id: draw-legend
        type: whiteboard.apply
        at: { mark: draw-legend }
        upsertIds: [d-leg-s, d-leg-s-l, d-leg-b, d-leg-b-l]
        drawMs: 1600
      - id: draw-hue
        type: whiteboard.apply
        at: { mark: draw-hue }
        upsertIds: [d-row-hue, d-hue-1, d-hue-2, d-hue-3]
        drawMs: 1200
      - id: draw-saturation
        type: whiteboard.apply
        at: { mark: draw-saturation }
        upsertIds: [d-row-sat, d-sat-1, d-sat-2, d-sat-3]
        drawMs: 1200
      - id: draw-color
        type: whiteboard.apply
        at: { mark: draw-color }
        upsertIds: [d-row-color, d-color-1, d-color-2, d-color-3]
        drawMs: 1200
      - id: draw-luminosity
        type: whiteboard.apply
        at: { mark: draw-luminosity }
        upsertIds: [d-row-lum, d-lum-1, d-lum-2, d-lum-3]
        drawMs: 1200

  - id: background-blend
    chapter: "Background blend mode"
    narration: >
      [[mark:close-hsl]] editor ထဲ ပြန်သွားရအောင်။ [[mark:scroll-end]] နောက်ခံ မရှိတဲ့
      banner ဆီ ဆင်းသွားရအောင်။ [[mark:type-pattern]] rule အသစ်နဲ့ သူ့ကို lesson 33 လို
      နောက်ခံ အလွှာတွေ ပေးပါမယ်။ အောက်ဆုံးမှာ အညိုဖျော့ရောင်၊ သူ့အပေါ်မှာ images CSS
      ဖိုင်ထဲက လက်ဖက်ရွက် ပုံ၊ အပေါ်ဆုံးမှာ အစိမ်းပြာကနေ လိမ္မော်ရောင် ကူးတဲ့ gradient ပါ။
      [[mark:after-pattern]] အပေါ်ဆုံး အလွှာက ကျန်တာတွေကို ဖုံးထားလို့ gradient ကိုပဲ
      မြင်ရပါတယ်။ [[mark:type-bg-multiply]] အခု သူ့အောက်မှာ background blend mode ကို
      multiply နဲ့ ထည့်ကြည့်ရအောင်။ [[mark:after-bg-multiply]] gradient က
      ပိုမှောင်သွားပြီး၊ လက်ဖက်ရွက်တွေ ဖောက်ပေါ်လာပါပြီ။ အဖြူရောင် စာသားကတော့
      မပြောင်းပါဘူး။ [[mark:explain-bg]] ဒီ background blend mode ကို ကြည့်ပါ။ သူက element
      ကိုယ်တိုင်ရဲ့ နောက်ခံ အလွှာတွေကို အချင်းချင်း ရောပေးတာပါ။ နောက်ခံ အရောင်လည်း
      ပါပါတယ်။ element ရဲ့ နောက်က ဘာနဲ့မှ မရောပါဘူး။ အဲဒါက mix blend mode ရဲ့ အလုပ်ပါ။
      [[mark:explain-bg-list]] အလွှာ အများကြီး ရှိရင်၊ comma ခြားထားတဲ့ စာရင်းနဲ့ အလွှာ
      တစ်ခုစီကို mode ကိုယ်စီ ပေးလို့ ရပါတယ်။ [[mark:type-bg-screen]] အခု အောက်မှာ screen
      mode ကို ထပ်ထည့်ပါမယ်။ banner ကို ဆက်ပြီး လိုက်ကြည့်ပါ။ [[mark:after-bg-screen]]
      အကုန် ဖျော့သွားလို့ အဖြူရောင် စာသားကို ဖတ်ရ ခက်သွားပါပြီ။ [[mark:type-bg-overlay]]
      နောက်ဆုံးအနေနဲ့ contrast အုပ်စုထဲက overlay mode ကို အောက်မှာ ထည့်ကြည့်ပါမယ်။
      [[mark:after-bg-overlay]] overlay က အောက်က အလွှာတွေရဲ့ အလင်းနဲ့ အမှောင်ကို
      ထိန်းထားပါတယ်။ အညိုဖျော့ရောင်က လင်းနေလို့ gradient တစ်ခုလုံး လင်းလာပြီး၊ လက်ဖက်ရွက်တွေက နောက်ခံထက် နည်းနည်းပဲ မှောင်လို့ ဖျော့ဖျော့ ပေါ်ပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Blend modes: browser compatibility (background-blend-mode)"
        url: "https://web.dev/learn/css/blend-modes#browser_compatibility"
      - title: "web.dev Learn CSS — Backgrounds"
        url: "https://web.dev/learn/css/backgrounds"
      - title: "MDN — background-blend-mode (own layers only; one value per layer)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/background-blend-mode"
      - title: "MDN — Using multiple backgrounds"
        url: "https://developer.mozilla.org/docs/Web/CSS/CSS_backgrounds_and_borders/Using_multiple_backgrounds"
    actions:
      - id: close-hsl-board
        type: whiteboard.apply
        at: { mark: close-hsl }
        open: false
      - id: scroll-end
        type: preview.scroll
        at: { mark: scroll-end }
        timeoutMs: 5000
        top: 2000
        retry: { maxAttempts: 2, delayMs: 250 }
      # line-by-line: every revealed line has balanced parentheses.
      - id: type-pattern
        type: editor.type
        at: { mark: type-pattern }
        cadence: line-by-line
        target: { file: styles.css, after: "  mix-blend-mode: color;\n}\n", occurrence: 1 }
        text: "\n.pattern-banner {\n  background-color: tan;\n  background-image: linear-gradient(teal, orange), var(--leaf-tile);\n}\n"
      - id: expect-pattern
        type: expect.preview
        at: { mark: after-pattern }
        timeoutMs: 4000
        target: { by: testId, value: pattern-banner }
        textContains: "ယနေ့အထူး"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-bg-multiply
        type: editor.type
        at: { mark: type-bg-multiply }
        cadence: fast-explainer
        target: { file: styles.css, after: "var(--leaf-tile);\n", occurrence: 1 }
        text: "  background-blend-mode: multiply;\n"
      - id: expect-bg-multiply
        type: expect.preview
        at: { mark: after-bg-multiply }
        timeoutMs: 4000
        target: { by: testId, value: pattern-banner }
        textContains: "ယနေ့အထူး"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-bg
        type: editor.select
        at: { mark: explain-bg }
        target: { file: styles.css, text: "background-blend-mode: multiply;", occurrence: 1 }
      - id: type-bg-screen
        type: editor.type
        at: { mark: type-bg-screen }
        cadence: fast-explainer
        target: { file: styles.css, after: "  background-blend-mode: multiply;\n", occurrence: 1 }
        text: "  background-blend-mode: screen;\n"
      - id: type-bg-overlay
        type: editor.type
        at: { mark: type-bg-overlay }
        cadence: fast-explainer
        target: { file: styles.css, after: "  background-blend-mode: screen;\n", occurrence: 1 }
        text: "  background-blend-mode: overlay;\n"
      - id: expect-bg-overlay
        type: expect.preview
        at: { mark: after-bg-overlay }
        timeoutMs: 4000
        target: { by: testId, value: pattern-banner }
        textContains: "ယနေ့အထူး"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: isolation
    chapter: "Isolation"
    narration: >
      [[mark:type-circle]] banner အောက်မှာ အစင်းကြောင်း box ရှိပါတယ်။ လိမ္မော်ရောင်
      စက်ဝိုင်းရဲ့ mix blend mode ကို multiply ပေးပါမယ်။ သူ့ ညာဘက် တစ်ခြမ်းကို
      လိုက်ကြည့်ပါ။ [[mark:after-circle]] card ပေါ်မှာတော့ စက်ဝိုင်းက အပြာနဲ့ ရောပြီး
      သံလွင်ရောင် ဖြစ်သွားပါတယ်။ card အပြင်ကို ထွက်နေတဲ့ တစ်ခြမ်းကတော့ အစင်းကြောင်းတွေနဲ့
      ရောလို့၊ သူ့ထဲမှာ အစင်းတွေကို ဖောက်မြင်ရပါတယ်။ [[mark:type-isolate]] စက်ဝိုင်းကို
      အစင်းတွေနဲ့ မရောစေဘဲ၊ သူ့ card နဲ့ပဲ ရောစေချင်ရင် ဘယ်လို လုပ်မလဲ။ card အတွက် rule
      အသစ်မှာ isolation property ကို ထည့်ပါမယ်။ [[mark:after-isolate]] စက်ဝိုင်းထဲက
      အစင်းတွေ ပျောက်သွားပါပြီ။ card ပေါ်က တစ်ခြမ်းက ရောနေဆဲ ဖြစ်ပေမယ့်၊ အပြင်ဘက်
      တစ်ခြမ်းကတော့ လိမ္မော်ရောင် သက်သက် ပြန်ဖြစ်သွားပါတယ်။ [[mark:explain-isolate]] ဒီ
      isolation ကို ကြည့်ပါ။ သူက card ကို stacking context အသစ် ဖြစ်စေလို့၊ blend mode က card အပြင်ကို မရောက်ပါဘူး။ lesson 23 က ပုံနဲ့ ပြောရရင်၊ card က ကိုယ်ပိုင် folder
      ဖြစ်သွားတာပါ။ blend mode က folder တစ်ခုတည်းထဲက အရာတွေနဲ့ပဲ ရောလို့၊ စက်ဝိုင်းက
      အစင်းတွေကို မမြင်တော့ပါဘူး။ [[mark:explain-not-off]] isolation က ရောတာကို ပိတ်တာ
      မဟုတ်ပါဘူး။ card ထဲမှာပဲ ရောအောင် ထိန်းထားတာပါ။ [[mark:explain-contexts]] stacking
      context ဖြစ်စေတဲ့ ဘယ်အရာမဆို ဒီလိုပဲ လုပ်ပါတယ်။ opacity 1 ထက် နည်းတာ၊ transform
      ဒါမှမဟုတ် filter ပါတာ၊ position ပေးထားတဲ့ box မှာ z-index ပါတာ၊ normal မဟုတ်တဲ့
      blend mode ကိုယ်တိုင် စတာတွေပါ။ ဒါကြောင့် blend mode က page နဲ့ မရောဘူး ဆိုရင်၊
      parent တွေမှာ ဒီထဲက တစ်ခုခု ရှိနေလား စစ်ကြည့်ပါ။
    sources:
      - title: "web.dev Learn CSS — Blend modes: the isolation property"
        url: "https://web.dev/learn/css/blend-modes#the_isolation_property"
      - title: "MDN — isolation"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/isolation"
      - title: "web.dev Learn CSS — Z-index and stacking contexts"
        url: "https://web.dev/learn/css/z-index"
      - title: "MDN — Stacking context (what creates one)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_positioned_layout/Stacking_context"
    actions:
      - id: type-circle
        type: editor.type
        at: { mark: type-circle }
        cadence: fast-explainer
        target: { file: styles.css, after: "  background-blend-mode: overlay;\n}\n", occurrence: 1 }
        text: "\n.iso .circle {\n  mix-blend-mode: multiply;\n}\n"
      - id: expect-circle
        type: expect.preview
        at: { mark: after-circle }
        timeoutMs: 4000
        target: { by: testId, value: iso-circle }
        attribute: { name: class, value: circle }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-isolate
        type: editor.type
        at: { mark: type-isolate }
        cadence: fast-explainer
        target:
          {
            file: styles.css,
            after: "\n.iso .circle {\n  mix-blend-mode: multiply;\n}\n",
            occurrence: 1,
          }
        text: "\n.iso .card {\n  isolation: isolate;\n}\n"
      - id: expect-isolate
        type: expect.preview
        at: { mark: after-isolate }
        timeoutMs: 4000
        target: { by: testId, value: iso-card }
        attribute: { name: class, value: card }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-isolate
        type: editor.select
        at: { mark: explain-isolate }
        target: { file: styles.css, text: "isolation: isolate;", occurrence: 1 }

  - id: duotone
    chapter: "Duotone ပုံ လုပ်ကြည့်ရအောင်"
    narration: >
      [[mark:type-duo-base]] နောက်ဆုံးအနေနဲ့ lesson အစက duotone ကို လုပ်ကြည့်ရအောင်။ rule
      သုံးခုကို တစ်ကြောင်းချင်း ထည့်ပါမယ်။ ပြီးခဲ့တဲ့ lesson က grayscale filter ကို
      ဓာတ်ပုံမှာ ပေးပြီး၊ အလွှာတွေ သူ့ပေါ် တင်နိုင်အောင် figure ကို position ပေးပါမယ်။
      before နဲ့ after pseudo-element တွေမှာ content ကို အလွတ် ပေးပြီး၊ figure ကို
      အစွန်းအထိ ဖုံးအောင် လုပ်ပါမယ်။ lesson 26 အတိုင်း content မပေးရင် box မရှိလို့ပါ။
      [[mark:after-duo-base]] ဓာတ်ပုံ မီးခိုးရောင် ဖြစ်သွားပါပြီ။ အလွှာ နှစ်ခုက နောက်ခံ
      မရှိသေးလို့ မမြင်ရပါဘူး။ [[mark:explain-z]] ဒီ z-index ကို ကြည့်ပါ။ filter က
      ဓာတ်ပုံကို stacking context ဖြစ်စေပါတယ်။ lesson 23 မှာ တွေ့ခဲ့သလို၊ stacking context
      တွေကို position ပေးထားတဲ့ box တွေနဲ့ အတူ HTML အစဉ်အတိုင်း ဆွဲပါတယ်။ before အလွှာက
      အစဉ်မှာ ဓာတ်ပုံထက် အရင် ရောက်လို့၊ ဒီအတိုင်းဆိုရင် ဓာတ်ပုံက သူ့ကို ဖုံးသွားမှာပါ။
      z-index 1 ပေးထားလို့ အလွှာ နှစ်ခုလုံး ဓာတ်ပုံရဲ့ အပေါ်မှာ ရှိနေတာပါ။
      [[mark:type-duo-gold]] အခု အောက်က အလွှာ ဖြစ်တဲ့ before ကို ရွှေရောင် နောက်ခံနဲ့
      multiply ပေးပါမယ်။ [[mark:after-duo-gold]] အလင်းပိုင်းတွေ ရွှေရောင် ဖြစ်သွားပြီး၊
      အမှောင်ပိုင်းတွေက မှောင်နေဆဲပါ။ [[mark:type-duo-blue]] ပြီးတော့ အပေါ်က after
      အလွှာကို အပြာရင့် နောက်ခံနဲ့ screen mode ပေးပါမယ်။ [[mark:after-duo-blue]] အခု
      အမှောင်ပိုင်းတွေ အပြာ ဖြစ်ပြီး၊ အလင်းပိုင်းတွေက ရွှေရောင် ဖျော့ဖျော့ ဖြစ်သွားပါပြီ။
      အလွှာ အစဉ်က အရေးကြီးပါတယ်။ multiply ကို နောက်ဆုံးမှ ထားရင်၊ အပြာ ဖြစ်နေတဲ့
      အမှောင်ပိုင်းတွေ ပြန်မည်းသွားပါလိမ့်မယ်။ ဒါက filter တစ်ခု၊ pseudo-element နှစ်ခု၊
      blend mode နှစ်ခုနဲ့ လုပ်ထားတဲ့ duotone ဖြစ်ပြီး၊ HTML မှာတော့ ပုံ တစ်ပုံပဲ
      ရှိပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Blend modes (duotone with pseudo-elements)"
        url: "https://web.dev/learn/css/blend-modes"
      - title: "web.dev Learn CSS — Filters"
        url: "https://web.dev/learn/css/filters"
      - title: "web.dev Learn CSS — Pseudo-elements: ::before and ::after"
        url: "https://web.dev/learn/css/pseudo-elements#before_and_after"
      - title: "MDN — Stacking context (filter creates one; painting order)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_positioned_layout/Stacking_context"
    actions:
      - id: type-duo-base
        type: editor.type
        at: { mark: type-duo-base }
        cadence: line-by-line
        target: { file: styles.css, after: "  isolation: isolate;\n}\n", occurrence: 1 }
        text: "\n.duo img {\n  filter: grayscale(1);\n}\n\n.duo {\n  position: relative;\n}\n\n.duo::before,\n.duo::after {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  z-index: 1;\n}\n"
      - id: expect-duo-base
        type: expect.preview
        at: { mark: after-duo-base }
        timeoutMs: 4000
        target: { by: testId, value: duo-photo }
        attribute: { name: alt, value: "ဆိုင်အတွင်းပိုင်း" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-z
        type: editor.select
        at: { mark: explain-z }
        target: { file: styles.css, text: "z-index: 1;", occurrence: 1 }
      - id: type-duo-gold
        type: editor.type
        at: { mark: type-duo-gold }
        cadence: line-by-line
        target: { file: styles.css, after: "  z-index: 1;\n}\n", occurrence: 1 }
        text: "\n.duo::before {\n  background: gold;\n  mix-blend-mode: multiply;\n}\n"
      - id: expect-duo-gold
        type: expect.preview
        at: { mark: after-duo-gold }
        timeoutMs: 4000
        target: { by: testId, value: duo }
        attribute: { name: class, value: duo }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-duo-blue
        type: editor.type
        at: { mark: type-duo-blue }
        cadence: line-by-line
        target:
          {
            file: styles.css,
            after: "  background: gold;\n  mix-blend-mode: multiply;\n}\n",
            occurrence: 1,
          }
        text: "\n.duo::after {\n  background: navy;\n  mix-blend-mode: screen;\n}\n"
      - id: expect-duo-blue
        type: expect.preview
        at: { mark: after-duo-blue }
        timeoutMs: 4000
        target: { by: testId, value: duo-photo }
        attribute: { name: alt, value: "ဆိုင်အတွင်းပိုင်း" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:open-quiz]] မပြီးခင် မေးခွန်း နှစ်ခု မေးကြည့်ရအောင်။ ဒီထဲက ဘယ်ဟာတွေက blend
      mode လဲ။ [[mark:quiz-1]] difference၊ lighten၊ multiply နဲ့ overlay က blend mode
      တွေပါ။ brighten နဲ့ dullen ဆိုတဲ့ mode မရှိပါဘူး။ [[mark:ask-quiz-2]] channel
      တစ်ခုစီကို သီးခြားစီ တွက်တဲ့ mode တွေကို ဘယ်လို ခေါ်လဲ။ [[mark:quiz-2]] multiply၊
      screen mode လို separable mode တွေပါ။ [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ blend mode
      က source ကို backdrop နဲ့ ဘယ်လို ရောမလဲ ဆိုတာ ဆုံးဖြတ်ပါတယ်။ mix blend mode က
      element တစ်ခုလုံးကို သူ့ နောက်က အရာနဲ့ ရောပြီး၊ background blend mode ကတော့ element
      ကိုယ်ပိုင် နောက်ခံ အလွှာတွေကိုပဲ ရောပါတယ်။ isolation က ရောတာကို stacking context
      တစ်ခုထဲမှာပဲ ထိန်းထားပါတယ်။ ဒီ property တွေကို browser အဓိက အားလုံးမှာ သုံးလို့ ရတာ
      နှစ်တွေ ကြာနေပါပြီ။ [[mark:next-lesson]] ဒါနဲ့ course ရဲ့ အလှဆင်တဲ့ အပိုင်း
      ပြီးပါပြီ။ နောက် lesson မှာတော့ page ပေါ်က အရာတွေ လှုပ်ရှားလာအောင် လုပ်ပါမယ်။
      တန်ဖိုး တစ်ခု ပြောင်းတဲ့အခါ ချက်ချင်း မခုန်ဘဲ ဖြည်းဖြည်း ပြောင်းစေတဲ့ transition ကို
      ကြည့်သွားပါမယ်။
    sources:
      - title: "web.dev Learn CSS — Blend modes: check your understanding"
        url: "https://web.dev/learn/css/blend-modes#check_your_understanding"
      - title: "webstatus.dev — mix-blend-mode (Baseline widely available)"
        url: "https://webstatus.dev/features/mix-blend-mode"
      - title: "MDN — background-blend-mode (browser compatibility)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/background-blend-mode#browser_compatibility"
      - title: "web.dev Learn CSS — Transitions (next lesson)"
        url: "https://web.dev/learn/css/transitions"
    actions:
      - id: open-quiz
        type: whiteboard.apply
        at: { mark: open-quiz }
        open: true
        clear: true
        upsertIds: [e-title, e-q1, e-real, e-fake]
      - id: draw-quiz-1
        type: whiteboard.apply
        at: { mark: quiz-1 }
        upsertIds: [e-check, e-strike]
        drawMs: 1600
      - id: draw-ask-quiz-2
        type: whiteboard.apply
        at: { mark: ask-quiz-2 }
        upsertIds: [e-q2]
        drawMs: 1400
      - id: draw-quiz-2
        type: whiteboard.apply
        at: { mark: quiz-2 }
        upsertIds: [e-a2]
        drawMs: 1400
      - id: expect-final-css
        type: expect.file
        at: { mark: recap }
        path: styles.css
        contains: ".logo {\n  mix-blend-mode: multiply;\n  mix-blend-mode: screen;\n  mix-blend-mode: multiply;\n}\n\n.split-banner h2 {\n  mix-blend-mode: difference;\n}\n\n.tint .overlay {\n  background: teal;\n  mix-blend-mode: color;\n}\n\n.pattern-banner {\n  background-color: tan;\n  background-image: linear-gradient(teal, orange), var(--leaf-tile);\n  background-blend-mode: multiply;\n  background-blend-mode: screen;\n  background-blend-mode: overlay;\n}\n\n"
      - id: expect-final-css-2
        type: expect.file
        at: { afterAction: expect-final-css }
        path: styles.css
        contains: ".iso .circle {\n  mix-blend-mode: multiply;\n}\n\n.iso .card {\n  isolation: isolate;\n}\n\n.duo img {\n  filter: grayscale(1);\n}\n\n.duo {\n  position: relative;\n}\n\n.duo::before,\n.duo::after {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  z-index: 1;\n}\n\n.duo::before {\n  background: gold;\n  mix-blend-mode: multiply;\n}\n\n.duo::after {\n  background: navy;\n  mix-blend-mode: screen;\n}\n"

checks:
  - { type: timing.p95Ms, max: 300 }
