      # base.css: kit sections A, B, B2, C and D; the header is cream with ink
      # text. Section E pins the lesson blocks (the split banner's hard-stop
      # gradient and white heading, the pre-greyed tint photo and its empty
      # absolutely positioned layer, the plain pattern banner, the striped
      # stage with its card and overhanging circle, the duotone figure).
      base.css: |
        /*
          base.css: pinned, never typed during a lesson.
          The shop's palette and the page "furniture", so the CSS a lesson types can
          focus on one idea. Each lesson keeps only the sections it needs and drops
          any declaration that its own demo types or relies on being absent
          (COURSE-KIT.md, "Deriving a lesson workspace"). B2 travels with B (every
          lesson that keeps B keeps B2, except lesson 2, which types the reset).
          Section E holds the few lesson-specific rules a start state pins.
          Lesson 37 keeps A, B, B2, C and D; the header is cream instead of dark (the
          logo blends with it). Section E pins the lesson blocks: the split banner, the
          grey photo and its empty layer, the plain pattern banner, the striped stage
          with its card and circle, and the duotone figure. No blend mode, isolation
          or filter on anything the lesson types (only the first photo is pre-greyed).
          Keep it free of the url, image-set and @-import functions (they switch on
          Vite's postcss step); images come from <img> or the pinned images.css.
        */

        /* == A. palette == */
        :root {
          color-scheme: light;
          --tea-dark: #3b2314;
          --tea: #8b5a2b;
          --tea-light: #c9a27e;
          --cream: #fff8ec;
          --paper: #fdf3e1;
          --leaf: #2f6b3a;
          --gold: #c9a227;
          --chili: #b23a2b;
          --ink: #2b1d14;
          --muted: #6b5a4c;
          --line: #e6d5bf;
          --radius: 12px;
        }

        /* == B. page == */
        body {
          margin: 0;
          font-family: "Noto Sans Myanmar", "Myanmar Sangam MN", "Myanmar MN", "Myanmar Text", "Padauk",
            system-ui, sans-serif;
          font-size: 16px;
          line-height: 1.8;
          color: var(--ink);
          background: var(--paper);
        }

        .page {
          padding: 0 16px 24px;
        }

        h1,
        h2,
        h3 {
          margin: 0 0 8px;
          line-height: 1.5;
        }

        h1 {
          font-size: 24px;
        }

        h2 {
          font-size: 20px;
        }

        h3 {
          font-size: 17px;
        }

        a {
          color: var(--tea);
        }

        /* Status lines that only expect.preview reads (kit.js data-report, data-say). */
        .visually-hidden {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip-path: inset(50%);
          white-space: nowrap;
        }

        /* == B2. reset (lesson 2 teaches it; every later lesson keeps it) == */
        *,
        *::before,
        *::after {
          box-sizing: border-box;
        }

        /* == C. furniture == */
        .site-header {
          padding: 16px;
          background: #f0dcb8;
          color: var(--ink);
        }

        .site-header a {
          color: var(--ink);
        }

        .logo {
          display: block;
        }

        .tagline {
          margin: 0;
          color: var(--tea-light);
          font-size: 14px;
        }

        .nav ul {
          margin: 8px 0 0;
          padding: 0;
          list-style: none;
        }

        .hero {
          margin: 16px 0;
          padding: 16px;
          background: var(--cream);
          border-radius: var(--radius);
        }

        .menu {
          margin: 0;
          padding: 0;
          list-style: none;
        }

        .menu-card {
          margin: 0 0 12px;
          padding: 12px 16px;
          background: #fff;
          border: 1px solid var(--line);
          border-radius: var(--radius);
        }

        .menu-card .name,
        .menu-card .desc {
          margin: 0;
        }

        .menu-card .desc {
          color: var(--muted);
          font-size: 14px;
        }

        .price {
          font-weight: 700;
          color: var(--tea);
        }

        .badge {
          padding: 0 8px;
          border-radius: 999px;
          background: var(--leaf);
          color: #fff;
          font-size: 13px;
        }

        .sold-out {
          opacity: 0.6;
        }

        .order-link,
        .order-btn {
          display: inline-block;
          padding: 6px 16px;
          border: 0;
          border-radius: 999px;
          background: var(--tea);
          color: #fff;
          font: inherit;
          text-decoration: none;
        }

        .order-form label {
          display: block;
          margin-top: 8px;
        }

        .order-form input[type="text"],
        .order-form input[type="tel"],
        .order-form input[type="number"] {
          box-sizing: border-box;
          width: 100%;
          padding: 6px 10px;
          border: 1px solid var(--line);
          border-radius: 8px;
          background: #fff;
          font: inherit;
        }

        .order-btn {
          margin-top: 12px;
        }

        .gallery figure {
          margin: 0 0 12px;
        }

        .gallery img {
          display: block;
          max-width: 100%;
          height: auto;
          border-radius: var(--radius);
        }

        figcaption {
          color: var(--muted);
          font-size: 14px;
        }

        .hours-list {
          margin: 0;
          padding-left: 20px;
        }

        .site-footer {
          margin-top: 24px;
          padding: 16px;
          background: var(--tea-dark);
          color: var(--cream);
          font-size: 14px;
        }

        .site-footer a {
          color: var(--cream);
        }

        /* == D. helpers == */
        /* .demo shows a box's edges without changing layout (outline takes no space). */
        .demo {
          outline: 1px dashed var(--muted);
        }

        /* .stage is a fixed playground for overlap and position demos. */
        .stage {
          position: relative;
          min-height: 160px;
          margin: 16px 0;
          padding: 12px;
          background: #fff;
          border: 1px solid var(--line);
          border-radius: var(--radius);
        }

        /* == E. lesson rules == */
        /* Lesson 37: the blocks the blend modes are typed onto. */
        .logo {
          width: 64px;
          margin-bottom: 4px;
        }

        .logo svg {
          display: block;
        }

        .split-banner {
          margin: 16px 0;
          padding: 20px 16px;
          border-radius: var(--radius);
          background: linear-gradient(90deg, var(--tea-dark) 50%, var(--cream) 50%);
          text-align: center;
        }

        .split-banner h2 {
          margin: 0;
          color: #fff;
          font-size: 44px;
        }

        .tint,
        .duo {
          margin: 16px 0;
        }

        .tint {
          position: relative;
        }

        .tint img,
        .duo img {
          display: block;
          width: 100%;
          height: auto;
        }

        .tint img {
          filter: grayscale(1);
        }

        .tint .overlay {
          position: absolute;
          inset: 0;
        }

        .pattern-banner {
          margin: 16px 0;
          padding: 16px;
          min-height: 120px;
          border: 1px solid var(--line);
          border-radius: var(--radius);
          color: #fff;
          font-size: 24px;
          font-weight: 700;
        }

        .pattern-banner p {
          margin: 0;
        }

        .iso {
          background: repeating-linear-gradient(45deg, var(--tea-light) 0 12px, var(--cream) 12px 24px);
        }

        .iso .card {
          position: relative;
          width: 60%;
          height: 136px;
          border-radius: var(--radius);
          background: #9fd3e6;
        }

        .iso .circle {
          position: absolute;
          top: 20px;
          right: -48px;
          width: 96px;
          height: 96px;
          border-radius: 50%;
          background: #f59e0b;
        }
      # images.css: pinned, never typed; only the leaf tile (48 × 48, as in
      # lesson 33).
      images.css: |
        /*
          images.css: pinned, never typed, linked only by lessons that need background
          or mask images (33 backgrounds, 37 blend modes, optionally 35 masks).
          Images are data: URIs inside custom properties, so a lesson's styles.css can
          write background-image: var(--leaf-tile) and never contains url( itself:
          url( in a typed file makes Vite run postcss on every keystroke, which shows
          its error overlay on half-typed states (PLATFORM.md section 2).
          Lesson 37 keeps only the leaf tile, drawn at 48 x 48 as in lesson 33.
