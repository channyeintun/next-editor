  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ context တွေ ဘယ်လို ချိတ်ဆက်မလဲ ဆိုတာက team တွေကြားက ဆက်ဆံရေးပေါ်မှာ မူတည်ပါတယ်။
      လက်တွဲနိုင်တဲ့ team တွေက အတူ ညှိကြပြီး၊ တစ်ဖက်က အားကောင်းနေရင်တော့ downstream က လက်ခံမလား၊ ဘာသာပြန်မလား
      ရွေးရပါတယ်။ upstream ဘက်ကလည်း တည်ငြိမ်တဲ့ public interface ထုတ်ပေးနိုင်ပါတယ်။ ဒါတွေကို context map ပေါ်
      တင်ကြည့်ရင် ဘယ်သူက ဘယ်သူ့ကို လိုက်ညှိနေရလဲ ဆိုတာ မြင်ရပါတယ်။
      [[mark:next]] context တွေကြားက ဆက်ဆံရေးကို သိပြီဆိုတော့၊ context တစ်ခုရဲ့ အတွင်းဘက်ကို ကြည့်ဖို့
      ကျန်ပါတယ်။ နောက် lesson မှာတော့ business logic ကို အဲဒီ အပိုင်းရဲ့ ရှုပ်ထွေးမှုနဲ့ လိုက်အောင် ဘယ်လို
      တည်ဆောက်မလဲ ဆိုတာကို လေ့လာသွားပါမယ်။
    sources:
