scenes:
  - id: need
    chapter: ဘယ်သူက ဘယ်သူ့ကို လိုက်ညှိမလဲ
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ စကားလုံး တစ်လုံးက အဓိပ္ပာယ် တစ်ခုတည်း ရှိတဲ့ နယ်နိမိတ်၊ bounded context ကို လေ့လာပြီး၊
      ခရီးဖော် မှာ Booking၊ Payment နဲ့ Operator ဆိုတဲ့ context သုံးခု ခွဲခဲ့ပါတယ်။ ခွဲလိုက်တာနဲ့တော့
      မပြီးသေးပါဘူး။ context တွေက တစ်ခုနဲ့တစ်ခု ဆက်သွယ်ရပါသေးတယ်။
      [[mark:n-op]] ဒီလထဲမှာ Operator team က ကားလိုင်းတွေ ပွဲတော်ရက်မှာ ကား အပို ထည့်နိုင်အောင် လုပ်ပေးရင်း၊
      ခရီးစဉ် data ရဲ့ ပုံစံကို ပြောင်းလိုက်ပါတယ်။ အဲဒီ data ကို တိုက်ရိုက် ဖတ်နေတဲ့ Booking ရဲ့ ခရီးစဉ် ရှာတဲ့ အပိုင်းက ပျက်သွားပါတယ်။
      ဒီ သုံးလအတွင်း တတိယ အကြိမ်ပါ။
      [[mark:n-who]] Booking team lead မောင်မောင် က Operator team ကို မပြောင်းဖို့ တောင်းပေမဲ့၊ Operator team
      မှာလည်း ကားလိုင်းတွေအတွက် ပြောင်းရမယ့် အကြောင်း ရှိပါတယ်။
      [[mark:n-wallet]] တစ်ချိန်တည်းမှာ wallet ကုမ္ပဏီကလည်း payment API ကို နှစ်ပတ်အတွင်း ပြောင်းမယ်လို့
      အကြောင်းကြားလာပါတယ်။ သူတို့ကတော့ ခရီးဖော် ကို မမေးဘဲ၊ ပြောင်းချင်တဲ့အချိန် ပြောင်းတာပါ။
      [[mark:n-idea]] ကိစ္စ နှစ်ခုလုံးမှာ မေးခွန်းက အတူတူပါပဲ။ ဘယ်သူက ဘယ်သူ့ကို လိုက်ညှိရမလဲ ဆိုတာပါ။ အဖြေက
      နည်းပညာထက် team တွေကြားက ဆက်ဆံရေးပေါ်မှာ ပိုမူတည်ပါတယ်။ အဲဒီ ဆက်ဆံရေးတွေကို ပုံဆွဲပြတာကို context map
      လို့ ခေါ်ပါတယ်။
    sources:
      - { title: "Learning Domain-Driven Design (Khononov)", url: "https://oreil.ly/lddd" }
    actions:
      - {
          id: draw-n-op,
          type: whiteboard.apply,
          at: { mark: n-op },
          open: true,
          upsertIds: [a-op, a-op-l, a-arrow, a-book, a-book-l],
          drawMs: 2400,
        }
      - {
          id: point-n-who,
          type: whiteboard.point,
          at: { mark: n-who },
          target: { assetId: a-book },
        }
      - {
          id: draw-n-idea,
          type: whiteboard.apply,
          at: { mark: n-idea },
          upsertIds: [a-title],
          drawMs: 800,
        }

  - id: inside
    chapter: Team တွေ လက်တွဲနိုင်တဲ့အခါ
    narration: >
      [[mark:i-updown]] ပုံထဲက မြားက ဘယ်သူက ဘယ်သူ့ကို မှီခိုနေလဲ ဆိုတာကို ပြပါတယ်။ မှီခိုခံရတဲ့ဘက်ကို
      upstream၊ မှီခိုနေတဲ့ဘက်ကို downstream လို့ ခေါ်ပါတယ်။ upstream ပြောင်းရင် downstream က ထိခိုက်တာမို့၊ ပုံမှန်အားဖြင့် upstream
      ဘက်က အားပိုကောင်းပါတယ်။ team တစ်ခုတည်းကပဲ ဆက်ဆံရေး တစ်ခုမှာ upstream ဖြစ်ပြီး၊ နောက်တစ်ခုမှာ downstream
      ဖြစ်နိုင်ပါတယ်။
      [[mark:i-ohs]] Operator နဲ့ Booking က ကုမ္ပဏီ တစ်ခုတည်းက team တွေမို့ ညှိလို့ ရပါတယ်။ ညှိလိုက်တဲ့ ပုံစံက
      Operator က Booking အတွက် တည်ငြိမ်တဲ့ public interface တစ်ခု ထုတ်ပေးမယ် ဆိုတာပါ။ အတွင်းက data ပုံစံကို
      ကြိုက်သလို ပြောင်းလို့ ရပေမဲ့၊ အပြင်ကို ထုတ်ပေးထားတဲ့ ပုံစံကိုတော့ သဘောတူညီချက် မရှိဘဲ မပြောင်းရပါဘူး။
      [[mark:i-ohs-name]] ဒီ pattern ကို open host service လို့ ခေါ်ပါတယ်။ ခရီးစဉ် data ကို သုံးတာက Booking
      တစ်ခုတည်း မဟုတ်ဘဲ၊ report တွေနဲ့ ကောင်တာ screen ကလည်း သုံးပါတယ်။ သုံးတဲ့သူတိုင်းက အပြောင်းအလဲကို
      တစ်ယောက်စီ လိုက်ကာနေရမယ့်အစား၊ ပေးတဲ့ဘက် တစ်နေရာတည်းက တည်ငြိမ်အောင် ထုတ်ပေးတာက ပိုသက်သာပါတယ်။
      ဈေးကတော့ Operator ဘက်မှာ အတွင်းပုံစံနဲ့ အပြင်ပုံစံ နှစ်ခုကို ထိန်းရတာပါ။
      [[mark:i-partner]] Booking နဲ့ Payment ကြားမှာတော့ အထက်အောက် မရှိပါဘူး။ ထိုင်ခုံကို ဆယ်မိနစ် hold
      လုပ်ထားတုန်း ငွေချေရတာမို့၊ တစ်ဖက်က ပြောင်းရင် နောက်တစ်ဖက်ပါ လိုက်ပြောင်းရပါတယ်။ ဒါကြောင့် team
      နှစ်ခုက အပြောင်းအလဲတွေကို အတူ စီစဉ်ပြီး အတူ ထုတ်ကြပါတယ်။
      [[mark:i-partner-name]] ဒါကို partnership လို့ ခေါ်ပါတယ်။ မကြာခဏ စကားပြောနိုင်တဲ့ team တွေကြားမှာပဲ
      အလုပ်ဖြစ်ပါတယ်။ team တွေ များလာပြီး ဝေးသွားတဲ့နေ့မှာတော့ ဒီပုံစံက မခံနိုင်တော့ဘဲ၊ တစ်ဖက်က upstream
      ဖြစ်လာတတ်ပါတယ်။
      [[mark:i-kernel]] လက်တွဲတဲ့ team တွေအတွက် နောက်တစ်နည်းက model သေးသေး တစ်ခုကို နှစ်ဖက်လုံးက မျှသုံးတဲ့
      shared kernel ပါ။ ဥပမာ ငွေပမာဏကို ဘယ်လို ကိုယ်စားပြုမလဲ ဆိုတာကို code တစ်ခုတည်းနဲ့ အတူ သုံးတာမျိုးပါ။
      ကူးရေးစရာ မလိုတော့ပေမဲ့၊ အဲဒီ code ကို ပြင်တိုင်း နှစ်ဖက်လုံး သဘောတူရတာမို့ ဈေးကြီးပါတယ်။ ဒါကြောင့်
      မျှသုံးတဲ့ အပိုင်းကို တတ်နိုင်သမျှ သေးအောင် ထားရပါတယ်။
    sources:
      - { title: "Learning Domain-Driven Design (Khononov)", url: "https://oreil.ly/lddd" }
    actions:
      - {
          id: draw-i-updown,
          type: whiteboard.apply,
          at: { mark: i-updown },
          upsertIds: [a-up, a-down],
          drawMs: 1200,
        }
      - { id: point-i-ohs, type: whiteboard.point, at: { mark: i-ohs }, target: { assetId: a-op } }
      - {
          id: draw-i-ohs,
          type: whiteboard.apply,
          at: { mark: i-ohs-name },
          upsertIds: [a-ohs],
          drawMs: 1200,
        }
      - {
          id: draw-i-partner,
          type: whiteboard.apply,
          at: { mark: i-partner },
          upsertIds: [a-pay, a-pay-l, a-pd, a-pu],
          drawMs: 2000,
        }
      - {
          id: draw-i-partner-l,
          type: whiteboard.apply,
          at: { mark: i-partner-name },
          upsertIds: [a-partner],
          drawMs: 1000,
        }
      - {
          id: point-i-kernel,
          type: whiteboard.point,
          at: { mark: i-kernel },
          target: { assetId: a-partner },
        }

  - id: outside
    chapter: တစ်ဖက်က အားပိုကောင်းတဲ့အခါ
    narration: >
      [[mark:o-open]] အပြင်က ကုမ္ပဏီတွေနဲ့ကျတော့ အခြေအနေ မတူတော့ပါဘူး။ သူတို့က upstream ဖြစ်ပြီး၊ ခရီးဖော်
      အတွက် သူတို့ဘက်က ဘာမှ ပြောင်းပေးမှာ မဟုတ်ပါဘူး။ downstream ဖြစ်တဲ့ ကိုယ့်ဘက်မှာ ရွေးစရာ နှစ်ခုပဲ
      ရှိပါတယ်။ သူ့ model၊ ဆိုလိုတာက သူ့ စကားလုံးတွေနဲ့ data ပုံစံကို ရှိတဲ့အတိုင်း လက်ခံမလား၊ ကိုယ့်ဘက်မှာ
      ဘာသာပြန်တဲ့ အလွှာ တစ်ခု ခံမလား ဆိုတာပါ။
      [[mark:o-sms]] SMS gateway အတွက်တော့ လက်ခံလိုက်တာက သင့်တော်ပါတယ်။ ဖုန်းနံပါတ်နဲ့ စာသား
      ပို့ပေးလိုက်တာလောက်ပဲမို့၊ သူ့ပုံစံအတိုင်း သုံးလိုက်လည်း ကိုယ့် code ထဲမှာ ထိခိုက်စရာ မရှိပါဘူး။
      [[mark:o-conf]] ဒီလို upstream ရဲ့ model ကို ရှိတဲ့အတိုင်း လက်ခံတာကို conformist လို့ ခေါ်ပါတယ်။ ဒါက
      လက်လျှော့တာ မဟုတ်ပါဘူး။ လူတိုင်း သုံးနေတဲ့ ပုံစံ တစ်ခုကို လိုက်သုံးတာက၊ ကိုယ်တိုင် အသစ် တီထွင်တာထက်
      ကောင်းတဲ့အခါ များပါတယ်။
      [[mark:o-wallet]] wallet ကုမ္ပဏီနဲ့ Payment ကြားကတော့ ပိုလေးနက်ပါတယ်။ ဘာသာပြန်တဲ့ အလွှာ တစ်ခု ဆောက်ရင်
      ရေးရ၊ ထိန်းရတဲ့ code ပိုများလာပါတယ်။ မဆောက်ရင်တော့ သူ့ စကားလုံးတွေနဲ့ သူ့ data ပုံစံက ကိုယ့် code ထဲ
      ရောက်လာပါမယ်။
      [[mark:o-q]] ဒီ မြားပေါ်မှာ ဘာရေးမလဲ ဆိုတာကိုတော့ ခဏနေမှ ဆုံးဖြတ်ပါမယ်။
    sources:
      - { title: "Learning Domain-Driven Design (Khononov)", url: "https://oreil.ly/lddd" }
    actions:
      - {
          id: draw-o-open,
          type: whiteboard.apply,
          at: { mark: o-open },
          clear: true,
          upsertIds: [b-title, b-sms, b-sms-l, b-wal, b-wal-l],
          drawMs: 2400,
        }
      - {
          id: draw-o-sms,
          type: whiteboard.apply,
          at: { mark: o-sms },
          upsertIds: [b-a1, b-book, b-book-l],
          drawMs: 1500,
        }
      - {
          id: draw-o-conf,
          type: whiteboard.apply,
          at: { mark: o-conf },
          upsertIds: [b-conf],
          drawMs: 1000,
        }
      - {
          id: draw-o-wallet,
          type: whiteboard.apply,
          at: { mark: o-wallet },
          upsertIds: [b-a2, b-pay, b-pay-l],
          drawMs: 1500,
        }
      - { id: draw-o-q, type: whiteboard.apply, at: { mark: o-q }, upsertIds: [b-q], drawMs: 600 }

  - id: table
    chapter: Map ကို table နဲ့ မှတ်ခြင်း
    narration: >
      [[mark:d-close]] ဆုံးဖြတ်ပြီးသား ဆက်ဆံရေးတွေကို table နဲ့ ချရေးထားပါမယ်။ ပုံက မြင်ရ လွယ်ပေမဲ့၊ ဘာကြောင့်
      ဆိုတာကိုတော့ table က ပိုကောင်းကောင်း မှတ်ပေးနိုင်ပါတယ်။
      [[mark:d-rows]] ပထမ သုံးကြောင်းက ခုနက ဆွဲခဲ့တဲ့ ဆက်ဆံရေး သုံးခုပါ။ နောက်ဆုံး column က အရေးအကြီးဆုံးပါ။
      pattern နာမည်ထက်၊ ဘာကြောင့် ဒီ pattern ကို ရွေးလဲ ဆိုတာကို နောက်လူတွေ သိဖို့ လိုလို့ပါ။
      [[mark:d-separate]] နောက်ထပ် ရွေးစရာ တစ်ခု ကျန်ပါသေးတယ်။ လုံးဝ မချိတ်ဆက်ဘဲ တစ်ဖက်စီ ကိုယ်တိုင်
      ထားတာပါ။ ဥပမာ ပွဲတော်ရက် စာရင်းကို Operator က ကားထွက်ချိန်အတွက် လိုပြီး၊ Payment ကလည်း ကားလိုင်းတွေကို
      ငွေရှင်းပေးမယ့် ရက်အတွက် လိုပါတယ်။ ဒီလောက် သေးတဲ့ ကိစ္စအတွက် team နှစ်ခု ချိတ်ဆက်ပြီး ညှိနေတာထက်၊
      တစ်ဖက်စီ စာရင်း တစ်ခုစီ ထားလိုက်တာက ပိုသက်သာပါတယ်။ စာရင်း နှစ်ခု တစ်ခါတလေ ကွာသွားနိုင်တာကိုတော့
      လက်ခံရပါမယ်။ ဒါကို separate ways လို့ ခေါ်ပါတယ်။
      [[mark:d-never]] ဒါပေမဲ့ ခရီးဖော် ကို ပြိုင်ဘက်နဲ့ ကွာစေတဲ့ အပိုင်း၊ core အတွက်တော့ ဒီနည်းကို ဘယ်တော့မှ
      မသုံးရပါဘူး။ ထိုင်ခုံ လွတ်မလွတ်ကို နှစ်နေရာက တစ်ဖက်စီ ကိုယ်တိုင် တွက်နေရင် ဘာဖြစ်မလဲ ဆိုတာ သင်္ကြန်တုန်းက
      မြင်ခဲ့ပြီးပါပြီ။
      [[mark:d-org]] ဒီ map က နည်းပညာ ပုံတစ်ပုံထက် ပိုပါတယ်။ ဘယ်သူက အားကောင်းလဲ၊ ဘယ် team တွေ
      စကားပြောနေကြလဲ ဆိုတာကို ပြတာမို့၊ အဖွဲ့အစည်းထဲက ပြဿနာတွေပါ ပေါ်လာပါတယ်။ ခရီးဖော် မှာဆိုရင် Operator နဲ့
      Booking ကြားမှာ ဒီလအထိ သဘောတူထားတဲ့ pattern တစ်ခုမှ မရှိခဲ့တာကို၊ map ဆွဲကြည့်မှ သိလိုက်ရတာပါ။
      [[mark:d-own]] map ကို architect တစ်ယောက်တည်း ထိန်းထားဖို့လည်း မဟုတ်ပါဘူး။ team တစ်ခုစီက ကိုယ်နဲ့ ဆိုင်တဲ့
      အတန်းကို ကိုယ်တိုင် ပြင်ပြီး၊ အားလုံး မြင်ရတဲ့ နေရာမှာ ထားရပါတယ်။ ဆက်ဆံရေး ပြောင်းသွားတဲ့နေ့မှာ pattern
      ကိုလည်း ပြန်ရွေးရမှာမို့ပါ။
    sources:
      - { title: "Learning Domain-Driven Design (Khononov)", url: "https://oreil.ly/lddd" }
    actions:
      - { id: close-outside, type: whiteboard.apply, at: { mark: d-close }, open: false }
      - {
          id: open-notebook,
          type: workspace.openFile,
          at: { afterAction: close-outside },
          path: notebook/25-context-map.md,
        }
      - id: type-rows
        type: editor.type
        at: { mark: d-rows }
        cadence: line-by-line
        target: { file: notebook/25-context-map.md, after: "|---|---|---|---|\n" }
        text: "| Operator | Booking | open-host service | အတွင်းပိုင်း ပြောင်းလည်း Booking မပျက်အောင် |\n| Booking | Payment | partnership | အထက်အောက် မရှိ၊ အတူ စီစဉ်ပြီး အတူ ထုတ် |\n| SMS gateway | Booking | conformist | ရိုးတဲ့ အပိုင်းမို့ သူ့ပုံစံအတိုင်း လက်ခံ |\n"
      - id: type-separate
        type: editor.type
        at: { mark: d-separate }
        cadence: line-by-line
        target: { file: notebook/25-context-map.md, after: "| ရိုးတဲ့ အပိုင်းမို့ သူ့ပုံစံအတိုင်း လက်ခံ |\n" }
        text: "| — | Operator, Payment | separate ways | ပွဲတော်ရက် စာရင်းကို တစ်ဖက်စီ ကိုယ်တိုင် ထား |\n"
      - id: sel-separate
        type: editor.select
        at: { mark: d-never }
        target: { file: notebook/25-context-map.md, text: "separate ways" }
      - id: sel-op-row
        type: editor.select
        at: { mark: d-org }
        target:
          { file: notebook/25-context-map.md, text: "| Operator | Booking | open-host service |" }
      - id: expect-ohs
        type: expect.file
        at: { afterAction: sel-op-row }
        path: notebook/25-context-map.md
        contains: "| Operator | Booking | open-host service | အတွင်းပိုင်း ပြောင်းလည်း Booking မပျက်အောင် |\n"
      - id: sel-partner-row
        type: editor.select
        at: { mark: d-own }
        target: { file: notebook/25-context-map.md, text: "| Booking | Payment | partnership |" }

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ wallet ကုမ္ပဏီက ခရီးဖော် အတွက် သူ့ API ကို ဘယ်တော့မှ ပြောင်းပေးမှာ
      မဟုတ်ပါဘူး။ Payment context က အဲဒီ API နဲ့ ဘယ်လို ဆက်ဆံသင့်လဲ။
      [[mark:quiz-a]] ပထမ ရွေးစရာက wallet ရဲ့ စကားလုံးတွေနဲ့ data ပုံစံကို Payment ရဲ့ code တစ်ခုလုံးမှာ
      ရှိတဲ့အတိုင်း သုံးတာပါ။
      [[mark:quiz-b]] ဒုတိယက Payment ရဲ့ အစွန်မှာ ဘာသာပြန်တဲ့ အလွှာ တစ်ခု ထားပြီး၊ အတွင်းမှာတော့ ကိုယ့် model
      ကိုပဲ သုံးတာပါ။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ တစ်ခုပါ။ ဘာကြောင့်လဲဆိုတော့ ငွေနဲ့ ပတ်သက်တဲ့ Payment က ပြင်ပ
      ကုမ္ပဏီ တစ်ခုရဲ့ ပုံစံအတိုင်း လိုက်ကွေးနေဖို့ အရေးကြီးလွန်းလို့ပါ။ wallet က API ကို ပြောင်းတိုင်း ဘာသာပြန်တဲ့
      အလွှာ တစ်နေရာတည်းမှာပဲ ပြင်ရပါမယ်။ နောက်တစ်နေ့ wallet အသစ် တစ်ခု ထပ်ထည့်ရင်လည်း အလွှာ တစ်ခုပဲ
      ထပ်ရေးရမှာပါ။
      [[mark:quiz-acl]] ဒီလို တခြားသူ့ model ကို ကိုယ့် model ဆီ ဘာသာပြန်ပေးတဲ့ အလွှာကို anticorruption layer
      လို့ ခေါ်ပါတယ်။ upstream က ရှုပ်ထွေးတဲ့အခါ၊ မကြာခဏ ပြောင်းတဲ့အခါ၊ ဒါမှမဟုတ် ကိုယ့်ဘက်က အရေးကြီးတဲ့
      အပိုင်း ဖြစ်တဲ့အခါ ဒီ အလွှာက တန်ပါတယ်။
    sources:
      - { title: "Learning Domain-Driven Design (Khononov)", url: "https://oreil.ly/lddd" }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [z-title],
          drawMs: 900,
        }
      - {
          id: draw-quiz-a,
          type: whiteboard.apply,
          at: { mark: quiz-a },
          upsertIds: [z-a],
          drawMs: 900,
        }
      - {
          id: draw-quiz-b,
          type: whiteboard.apply,
          at: { mark: quiz-b },
          upsertIds: [z-b],
          drawMs: 900,
        }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [z-b-line, z-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-reason,
          type: whiteboard.apply,
          at: { mark: quiz-acl },
          upsertIds: [z-reason],
          drawMs: 1400,
        }

  - id: your-turn
    chapter: ကိုယ့် team ရဲ့ ချိတ်ဆက်မှု
    narration: >
      [[mark:t-close]] ဒီ ဆုံးဖြတ်ချက်ကိုလည်း map ထဲ ဖြည့်လိုက်ပါမယ်။
      [[mark:type-wallet]] wallet ကုမ္ပဏီ ဘယ်လိုပဲ ပြောင်းပြောင်း၊ Payment ရဲ့ အတွင်းပိုင်းကို မထိစေဖို့ပါ။
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ဒီ table ထဲမှာ ကိုယ့် team ရဲ့ ချိတ်ဆက်မှု
      တစ်ခုအတွက် အတန်း တစ်တန်း ထပ်ရေးကြည့်ပါ။ တခြား team တစ်ခု၊ ဒါမှမဟုတ် အပြင်က service တစ်ခုနဲ့ ချိတ်ထားတာ
      တစ်ခုကို ရွေးပါ။ ဘယ်ဘက်က upstream လဲ၊ ဘယ်သူ့ဘက်က အားပိုကောင်းလဲ၊ အခု ဘယ် pattern နဲ့ အနီးစပ်ဆုံးလဲ
      ဆိုတာကို ဖြေရမှာပါ။
      [[mark:turn-2]] pattern ကို ရွေးမထားခဲ့ဘူးဆိုရင်လည်း အဲဒါကို ရိုးရိုးသားသား ရေးထားပါ။ မရွေးထားတဲ့
      ဆက်ဆံရေးက အများအားဖြင့် conformist ဖြစ်နေတတ်ပါတယ်။
    sources:
      - { title: "Learning Domain-Driven Design (Khononov)", url: "https://oreil.ly/lddd" }
    actions:
