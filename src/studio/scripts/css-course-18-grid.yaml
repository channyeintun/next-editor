build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 4118

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  - id: grid-intro
    chapter: "Grid ဆိုတာ ဘာလဲ"
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ flex item တွေကို align လုပ်ခဲ့ပါတယ်။ ဒါပေမဲ့ flexbox က item တွေကို တန်း
      တစ်တန်းချင်း သီးသန့် စီလို့၊ တန်း မတူတဲ့ item တွေက အပေါ်အောက် column လိုက် မညီကြပါဘူး။
      [[mark:start-server]] ဒီလို ပြောနေတုန်းမှာပဲ၊ board နောက်မှာ dev server ကို စနေပါပြီ။
      [[mark:draw-grid-box]] ဒီ lesson ကနေ စမယ့် grid ကတော့ row နဲ့ column နှစ်ဘက်လုံးကို တစ်ပြိုင်နက် စီမံတဲ့
      layout နည်းပါ။ [[mark:draw-two-dir]] ဆိုလိုတာက၊ item တိုင်းက ဘေးက item တွေနဲ့ row တစ်တန်းတည်း
      ညီနေသလို၊ အပေါ်အောက်က item တွေနဲ့လည်း column တစ်ခုတည်း ညီနေပါတယ်။ ဒါကြောင့် column တွေက အပေါ်ကနေ
      အောက်အထိ တည့်တည့် ဆက်နေပါတယ်။ [[mark:draw-container]] display ကို grid ပေးလိုက်တဲ့ element က
      grid container ဖြစ်သွားပါတယ်။ row နဲ့ column တွေကို container က ဆုံးဖြတ်ပြီး၊ item တွေက အဲဒီ
      အကွက်တွေထဲ ဝင်ပါတယ်။ [[mark:draw-items]] container ရဲ့ တိုက်ရိုက် child တွေပဲ grid item
      ဖြစ်ပါတယ်။ item တစ်ခုရဲ့ အထဲက element တွေကတော့ grid item မဟုတ်ဘဲ၊ သူတို့ item ထဲမှာပဲ flow layout အတိုင်း စီပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Grid"
        url: "https://web.dev/learn/css/grid"
      - title: "web.dev Learn CSS — Layout: grid"
        url: "https://web.dev/learn/css/layout#grid"
      - title: "MDN — Basic concepts of grid layout"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_grid_layout/Basic_concepts_of_grid_layout"
      - title: "CSS Grid Layout Module Level 2 — grid containers and grid items"
        url: "https://drafts.csswg.org/css-grid/#grid-items"
    actions:
      - id: open-intro-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      # Runs in the background (boot + pnpm install + spawn); waitForReady sits
      # on the preview mark in the code tour, well over 40 s of narration later.
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 45000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-grid-box
        type: whiteboard.apply
        at: { mark: draw-grid-box }
        upsertIds: [a-box, a-i1, a-i2, a-i3, a-i4, a-i5, a-i6]
        drawMs: 2800
      - id: draw-two-dir
        type: whiteboard.apply
        at: { mark: draw-two-dir }
        upsertIds: [a-arrow-row, a-arrow-col, a-two-dir]
        drawMs: 2600
      - id: draw-container
        type: whiteboard.apply
        at: { mark: draw-container }
        upsertIds: [a-cont-l, a-cont-note]
        drawMs: 1800
      - id: draw-items
        type: whiteboard.apply
        at: { mark: draw-items }
        upsertIds: [a-item-l, a-item-note]
        drawMs: 1800

  - id: grid-terms
    narration: >
      [[mark:open-terms]] grid ရဲ့ အစိတ်အပိုင်း တစ်ခုစီမှာ ကိုယ်ပိုင် နာမည် ရှိပါတယ်။ grid property
      တွေက အဲဒီ နာမည်တွေကို သုံးလို့ အရင် သိထားရအောင်။ [[mark:draw-cells]] ဒါက column သုံးခု၊ row
      နှစ်ခု ပါတဲ့ grid ပါ။ [[mark:draw-lines]] သူ့ကို ပိုင်းခြားထားတဲ့ မျဉ်းတွေကို grid line လို့
      ခေါ်ပါတယ်။ line တွေကို 0 ကနေ မဟုတ်ဘဲ 1 ကနေ စပြီး၊ စာ စရေးတဲ့ ဘက်ကနေ နံပါတ် တပ်ပါတယ်။ column
      သုံးခုမှာ column line လေးကြောင်း၊ row နှစ်ခုမှာ row line သုံးကြောင်း ရှိပါတယ်။
      [[mark:draw-track]] ဘေးချင်း ကပ်နေတဲ့ line နှစ်ကြောင်းကြားက နေရာကို track လို့ ခေါ်ပါတယ်။ column
      တစ်ခုရော row တစ်ခုပါ track ပါပဲ။ [[mark:draw-cell]] row တစ်ခုနဲ့ column တစ်ခု ဆုံတဲ့ အကွက်ကို
      cell လို့ ခေါ်ပါတယ်။ grid ရဲ့ အသေးဆုံး အပိုင်းပါ။ [[mark:draw-area]] cell တစ်ကွက် ဒါမှမဟုတ် ဘေးချင်းကပ် cell တွေ ပေါင်းထားတဲ့ လေးထောင့် နေရာကို area လို့ ခေါ်ပါတယ်။ item တစ်ခုက track နှစ်ခု သုံးခုစာ နေရာယူပြီး area တစ်ခုကို ဖုံးနိုင်ပါတယ်။ အဲဒါကို lesson 19 မှာ လုပ်ကြည့်ပါမယ်။ [[mark:draw-gap]] နောက်ဆုံး၊
      track တွေကြားက နေရာလွတ်က gap ပါ။ ကြားထဲမှာပဲ ရှိပြီး grid ရဲ့ အပြင်ဘက် အစွန်းတွေမှာ မရှိပါဘူး။
      gap ထဲကိုလည်း item ထည့်လို့ မရပါဘူး။
    sources:
      - title: "web.dev Learn CSS — Grid: grid terminology"
        url: "https://web.dev/learn/css/grid#grid_terminology"
      - title: "MDN — Grid lines"
        url: "https://developer.mozilla.org/en-US/docs/Glossary/Grid_Lines"
      - title: "MDN — Grid tracks"
        url: "https://developer.mozilla.org/en-US/docs/Glossary/Grid_Tracks"
      - title: "MDN — Grid cell"
        url: "https://developer.mozilla.org/en-US/docs/Glossary/Grid_Cell"
      - title: "MDN — Grid areas"
        url: "https://developer.mozilla.org/en-US/docs/Glossary/Grid_Areas"
      - title: "MDN — Gutters"
        url: "https://developer.mozilla.org/en-US/docs/Glossary/Gutters"
    actions:
      - id: open-terms-board
        type: whiteboard.apply
        at: { mark: open-terms }
        clear: true
        upsertIds: [b-title]
      - id: draw-cells
        type: whiteboard.apply
        at: { mark: draw-cells }
        upsertIds: [b-c11, b-c12, b-c13, b-c21, b-c22, b-c23]
        drawMs: 1800
      - id: draw-lines
        type: whiteboard.apply
        at: { mark: draw-lines }
        upsertIds: [b-col1, b-col2, b-col3, b-col4, b-row1, b-row2, b-row3, b-lines-l, b-count]
        drawMs: 4000
      - id: draw-track
        type: whiteboard.apply
        at: { mark: draw-track }
        upsertIds: [b-track, b-track-l]
        drawMs: 1600
      - id: draw-cell
        type: whiteboard.apply
        at: { mark: draw-cell }
        upsertIds: [b-cell, b-cell-l]
        drawMs: 1400
      - id: draw-area
        type: whiteboard.apply
        at: { mark: draw-area }
        upsertIds: [b-area, b-area-l]
        drawMs: 1600
      - id: draw-gap
        type: whiteboard.apply
        at: { mark: draw-gap }
        upsertIds: [b-gap, b-gap-l, b-gap-note]
        drawMs: 2200

  - id: code-tour
    narration: >
      [[mark:close-terms]] project ကို ကြည့်ရအောင်။ [[mark:open-index]] ဒါက HTML ဖိုင်ပါ။ အပိုင်း သုံးပိုင်း ပါပါတယ်။
      [[mark:select-drinks]] ပထမက သောက်စရာ လေးမျိုး ပါတဲ့ list ပါ။ [[mark:select-snacks]] ဒုတိယက
      စားစရာ list ပါ။ သူ့ ပထမ card ရဲ့ နာမည်က space ရော hyphen ပါ မပါတဲ့ အင်္ဂလိပ် စကားလုံး အရှည်ကြီး
      တစ်လုံးပါ။ [[mark:select-prices]] နောက်ဆုံးက ဈေးနှုန်း စာရင်း သေးသေးလေးပါ။ နာမည်နဲ့ ဈေးနှုန်း
      တစ်ခုစီက သီးသန့် inline element တွေပါ။ [[mark:open-styles]] ကိုယ့် CSS ဖိုင်က အလွတ်ပါ။ base
      ဖိုင်ကလည်း card တွေကြားမှာ နေရာလွတ် မထားပါဘူး။ [[mark:preview-opens]] preview ပွင့်လာပါပြီ။ card
      တွေက flow layout အတိုင်း အပေါ်အောက် ဆင့်နေပြီး၊ တစ်ခုနဲ့ တစ်ခု ကပ်နေကြပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Grid"
        url: "https://web.dev/learn/css/grid"
      - title: "MDN — Introduction to CSS layout"
        url: "https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/CSS_layout/Introduction"
    actions:
      - id: close-terms-board
        type: whiteboard.apply
        at: { mark: close-terms }
        open: false
      - id: open-index
        type: workspace.openFile
        at: { mark: open-index }
        path: index.html
      - id: select-drinks
        type: editor.select
        at: { mark: select-drinks }
        target:
          { file: index.html, text: '<ul class="menu" data-testid="menu-drinks">', occurrence: 1 }
      - id: select-snacks
        type: editor.select
        at: { mark: select-snacks }
        target:
          {
            file: index.html,
            text: '<h3 class="name" lang="en">PyinmanaExpressSpecialMilkTea</h3>',
            occurrence: 1,
          }
      - id: select-prices
        type: editor.select
        at: { mark: select-prices }
        target:
          {
            file: index.html,
            text: '<div class="price-list" data-testid="price-list">',
            occurrence: 1,
          }
      - id: open-styles
        type: workspace.openFile
        at: { mark: open-styles }
        path: styles.css
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { mark: preview-opens }
        timeoutMs: 20000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-dev-server }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-drinks
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: menu-drinks }
        textContains: "ဖာလူဒါ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-price-list
        type: expect.preview
        at: { afterAction: expect-drinks }
        timeoutMs: 5000
        target: { by: testId, value: price-list }
        textContains: "Fresh lime juice with ice"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: collapse-runner-dock
        type: runtime.collapseDock
        at: { afterAction: expect-price-list }

  - id: display-grid
    chapter: "Card တွေကို grid နဲ့ စီကြည့်ရအောင်"
    narration: >
      [[mark:type-drinks-grid]] သောက်စရာတွေကနေ စရအောင်။ card တွေကို မဟုတ်ဘဲ သူတို့ကို စုထားတဲ့ list
      ကိုယ်တိုင်ကို ရွေးပြီး၊ display ကို grid ပေးပါမယ်။ [[mark:after-drinks-grid]] preview ကို
      ကြည့်ပါ၊ ဘာမှ သိပ် မပြောင်းပါဘူး။ [[mark:select-display-grid]] ဒီ display declaration ကို
      ကြည့်ပါ။ list က grid container ဖြစ်သွားပြီး၊ card လေးခုက သူ့ item တွေ ဖြစ်သွားပါပြီ။ ဒါပေမဲ့
      column ဘယ်နှစ်ခု လိုချင်လဲ မပြောရသေးလို့၊ column တစ်ခုတည်း ရှိပြီး card တစ်ခုစီက row တစ်ခုစီ
      ရပါတယ်။ [[mark:explain-auto]] အရွယ်အစား မပေးထားတဲ့ track က auto ဖြစ်ပါတယ်။ auto track က content
      ဆံ့သလောက် ကြီးပြီး၊ နေရာ ပိုနေရင် ဆန့်ပြီး ဖြည့်ပါတယ်။ ဒါကြောင့် column တစ်ခုတည်းက list ရဲ့
      အကျယ် အပြည့်ကို ယူပြီး၊ row တစ်ခုစီက သူ့ card လောက်ပဲ မြင့်ပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Grid (display: grid)"
        url: "https://web.dev/learn/css/grid"
      - title: "MDN — display"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/display"
      - title: "MDN — grid-template-columns (initial value none; auto tracks)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/grid-template-columns"
    actions:
      - id: type-drinks-grid
        type: editor.type
        at: { mark: type-drinks-grid }
        cadence: fast-explainer
        target: { file: styles.css, after: "", occurrence: 1 }
        text: ".drinks .menu {\n  display: grid;\n}\n"
      - id: expect-drinks-grid
        type: expect.preview
        at: { mark: after-drinks-grid }
        timeoutMs: 4000
        target: { by: testId, value: menu-drinks }
        textContains: "ကော်ဖီ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-display-grid
        type: editor.select
        at: { mark: select-display-grid }
        target: { file: styles.css, text: "display: grid;", occurrence: 1 }

  - id: columns-gap
    narration: >
      [[mark:type-columns]] column နှစ်ခု တောင်းကြည့်ရအောင်။ grid template columns မှာ track
      တစ်ခုစီရဲ့ အရွယ်အစားကို တန်းစီ ရေးပြီး၊ တန်ဖိုး တစ်ခုက column တစ်ခုပါ။ ဒီမှာ နှစ်ခုလုံးကို 1 fr
      စီ ပေးပါမယ်။ [[mark:after-columns]] ကြည့်ပါ၊ card တွေ column နှစ်ခု ခွဲသွားပြီး၊ row တစ်ခုမှာ
      card နှစ်ခုစီ ရှိပါတယ်။ [[mark:select-columns]] ဒီ declaration ထဲက fr ဆိုတာ ကျန်နေတဲ့
      နေရာလွတ်ကို အပုံလိုက် ခွဲဝေပေးတဲ့ unit ပါ။ column နှစ်ခုက တစ်ပုံစီ ရလို့ အကျယ် ညီသွားပါတယ်။
      [[mark:look-row-height]] ပထမ row ကို ကြည့်ပါ။ ကော်ဖီ card မှာ စာ နည်းပေမယ့် ဘေးက လက်ဖက်ရည် card
      နဲ့ အမြင့် တူနေပါတယ်။ card နှစ်ခုလုံး row track တစ်ခုတည်းထဲမှာ ရှိလို့ပါ။ [[mark:type-gap]] card
      တွေ ကပ်နေတုန်းမို့ gap ထည့်ပါမယ်။ [[mark:after-gap]] အခု column တွေကြားမှာရော row တွေကြားမှာပါ
      နေရာလွတ် ပေါ်လာပေမယ့်၊ grid ရဲ့ အပြင်ဘက် အစွန်းတွေမှာတော့ မရှိပါဘူး။ တန်ဖိုး တစ်ခုတည်း ပေးရင်
      flexbox မှာလိုပဲ နှစ်ဘက်လုံးအတွက် သုံးပါတယ်။ [[mark:type-rows]] row တွေအတွက်တော့ grid template
      rows ဆိုတဲ့ သီးသန့် property ရှိပါတယ်။ ပထမ row ကို auto ထားပြီး၊ ဒုတိယ row ကို 160 pixel အမြင့်
      ပေးပါမယ်။ [[mark:after-rows]] ဒုတိယ row က ပိုမြင့်သွားပြီး၊ သူ့ထဲက card နှစ်ခုလုံး row
      ပြည့်အောင် ဆန့်သွားပါပြီ။ ပထမ row ကတော့ content လောက်ပဲ မြင့်နေတုန်းပါ။
    sources:
      - title: "web.dev Learn CSS — Grid: rows and columns"
        url: "https://web.dev/learn/css/grid#rows_and_columns"
      - title: "MDN — grid-template-columns"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/grid-template-columns"
      - title: "MDN — grid-template-rows"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/grid-template-rows"
      - title: "MDN — gap"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/gap"
    actions:
      - id: type-columns
        type: editor.type
        at: { mark: type-columns }
        cadence: fast-explainer
        target: { file: styles.css, after: "  display: grid;\n", occurrence: 1 }
        text: "  grid-template-columns: 1fr 1fr;\n"
      - id: expect-columns
        type: expect.preview
        at: { mark: after-columns }
        timeoutMs: 4000
        target: { by: testId, value: card-coffee }
        textContains: "ကော်ဖီ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-columns
        type: editor.select
        at: { mark: select-columns }
        target: { file: styles.css, text: "grid-template-columns: 1fr 1fr;", occurrence: 1 }
      - id: type-gap
        type: editor.type
        at: { mark: type-gap }
        cadence: natural
        target: { file: styles.css, after: "  grid-template-columns: 1fr 1fr;\n", occurrence: 1 }
        text: "  gap: 12px;\n"
      - id: expect-gap
        type: expect.preview
        at: { mark: after-gap }
        timeoutMs: 4000
        target: { by: testId, value: card-lime-juice }
        textContains: "သံပုရာရည်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-rows
        type: editor.type
        at: { mark: type-rows }
        cadence: fast-explainer
        target: { file: styles.css, after: "  gap: 12px;\n", occurrence: 1 }
        text: "  grid-template-rows: auto 160px;\n"
      - id: expect-rows
        type: expect.preview
        at: { mark: after-rows }
        timeoutMs: 4000
        target: { by: testId, value: card-falooda }
        textContains: "ဖာလူဒါ"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: fr-board
    chapter: "နေရာကို fr က ဘယ်လို ခွဲလဲ"
    narration: >
      [[mark:open-fr-board]] ဒါဆို browser က fr ကို ဘယ်လို တွက်လဲ။ [[mark:draw-fr-even]] ကိုယ့် list က
      400 pixel လောက် ကျယ်ပါတယ်။ browser က အရင်ဆုံး 12 pixel ရှိတဲ့ gap ကို နုတ်ပါတယ်။ ကျန်တာက
      နေရာလွတ် ဖြစ်ပြီး၊ column နှစ်ခုက အပုံ ညီညီ တစ်ပုံစီ၊ 194 pixel လောက်စီ ရပါတယ်။
      [[mark:draw-fr-fixed]] အခု ပထမ column ကို 120 pixel ပုံသေ ပေးတယ် ဆိုပါစို့။ browser က ပုံသေ
      column နဲ့ gap ကို အရင် နုတ်ပါတယ်။ ကျန်တဲ့ 268 pixel က နေရာလွတ် ဖြစ်ပြီး၊ 1 fr column က အဲဒါ
      အကုန်လုံးကို ရပါတယ်။ [[mark:draw-fr-rule]] ဒါကြောင့် fr က အကျယ် တစ်ခုလုံးရဲ့ အပုံ မဟုတ်ဘဲ၊
      ကျန်နေတဲ့ နေရာရဲ့ အပုံပါ။ lesson 16 က grow နဲ့ ဆင်ပေမယ့်၊ grow ကို item တစ်ခုချင်းမှာ ပေးပြီး fr
      ကိုတော့ container မှာ ပေးပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Grid: the fr unit"
        url: "https://web.dev/learn/css/grid#the_fr_unit"
      - title: "MDN — flex value (the fr unit)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/flex_value"
      - title: "CSS Grid Layout Module Level 2 — flexible lengths: the fr unit"
        url: "https://drafts.csswg.org/css-grid/#fr-unit"
    actions:
      - id: open-fr-board
        type: whiteboard.apply
        at: { mark: open-fr-board }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-fr-even
        type: whiteboard.apply
        at: { mark: draw-fr-even }
        upsertIds: [c-even-k, c-even-a, c-even-gap, c-even-b, c-even-la, c-even-lb, c-even-sum]
        drawMs: 3600
      - id: draw-fr-fixed
        type: whiteboard.apply
        at: { mark: draw-fr-fixed }
        upsertIds:
          [c-fixed-k, c-fixed-a, c-fixed-gap, c-fixed-b, c-fixed-la, c-fixed-lb, c-fixed-sum]
        drawMs: 3600
      - id: draw-fr-rule
        type: whiteboard.apply
        at: { mark: draw-fr-rule }
        upsertIds: [c-rule]
        drawMs: 1800

  - id: fixed-fr
    narration: >
      [[mark:close-fr-board]] editor ထဲ ပြန်ပြီး စမ်းကြည့်ရအောင်။ [[mark:type-fixed-fr]] column
      declaration နောက်တစ်ခု ထပ်ရေးပါမယ်။ ပထမ column က 120 pixel ပုံသေ၊ ဒုတိယက 1 fr ပါ။ နောက်မှ ရေးတဲ့ declaration က နိုင်ပါတယ်။ [[mark:after-fixed-fr]] ဘယ်ဘက် column က 120 pixel နဲ့ ကျဉ်းသွားပြီး၊ ညာဘက်
      column က ကျန်တဲ့ နေရာ အကုန်ကို ယူပါတယ်။ [[mark:select-fixed-fr]] ဒီ declaration ကို ကြည့်ပါ။
      ပုံသေ track နဲ့ fr track ကို ရောသုံးထားတာပါ။ pixel ဒါမှမဟုတ် ရာခိုင်နှုန်း track တွေက နေရာ အရင်
      ယူပြီး၊ ကျန်တာကို fr က ခွဲပါတယ်။ ဥပမာ icon အတွက် ပုံသေ column နဲ့ စာသားအတွက် ကျန်တဲ့ နေရာ အကုန်
      ယူတဲ့ column ကို တွဲသုံးတာမျိုးပါ။
    sources:
      - title: "web.dev Learn CSS — Grid: the fr unit"
        url: "https://web.dev/learn/css/grid#the_fr_unit"
      - title: "MDN — grid-template-columns (length, percentage and flex values)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/grid-template-columns#values"
    actions:
      - id: close-fr-board
        type: whiteboard.apply
        at: { mark: close-fr-board }
        open: false
      # line-by-line: typed keystroke by keystroke, "120px" alone is a valid
      # one-column grid and would flash the cards into one narrow column.
      - id: type-fixed-fr
        type: editor.type
        at: { mark: type-fixed-fr }
        cadence: line-by-line
        target: { file: styles.css, after: "  grid-template-columns: 1fr 1fr;\n", occurrence: 1 }
        text: "  grid-template-columns: 120px 1fr;\n"
      - id: expect-fixed-fr
        type: expect.preview
        at: { mark: after-fixed-fr }
        timeoutMs: 4000
        target: { by: testId, value: card-laphet-yay }
        textContains: "လက်ဖက်ရည်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-fixed-fr
        type: editor.select
        at: { mark: select-fixed-fr }
        target: { file: styles.css, text: "grid-template-columns: 120px 1fr;", occurrence: 1 }

  - id: fr-trap
    chapter: "1fr column တွေ ဘာလို့ မညီရတာလဲ"
    narration: >
      [[mark:scroll-snacks]] အခု စားစရာ list ပါ။ [[mark:type-snacks]] ဒီ list ကိုလည်း grid container
      လုပ်ပြီး၊ 1 fr စီ ရတဲ့ column နှစ်ခုနဲ့ gap အတူတူကို ပေးပါမယ်။ [[mark:after-snacks]] ဒါပေမဲ့
      ကြည့်ပါ၊ column နှစ်ခု မညီပါဘူး။ စကားလုံး ရှည်ကြီး ပါတဲ့ card က ဘယ်ဘက် column မှာ ရှိပြီး၊ အဲဒီ column က အများကြီး ပိုကျယ်နေပါတယ်။ [[mark:explain-trap]] ဘာကြောင့်လဲဆိုတော့၊ 1 fr track က တစ်ပုံအထိ
      ကြီးလို့ ရပေမယ့်၊ သူ့ အငယ်ဆုံး အရွယ်အစားက auto ပါ။ grid item အတွက် auto အငယ်ဆုံးဆိုတာ lesson 2 က
      min-content နဲ့ အတူတူပါ။ ဆိုလိုတာက၊ track က သူ့ထဲက အရှည်ဆုံး စကားလုံးထက် မကျဉ်းနိုင်ပါဘူး။ ဒီ
      စကားလုံးမှာ space မပါလို့ browser က မချိုးနိုင်တဲ့အတွက်၊ column တစ်ခုလုံးက အနည်းဆုံး အဲဒီ
      စကားလုံးလောက် ကျယ်နေရပါတယ်။ [[mark:type-minmax]] ဒါကြောင့် အငယ်ဆုံးကို ကိုယ်တိုင် ပေးပါမယ်။
      column declaration နောက်တစ်ခု ထည့်ပြီး၊ minmax နဲ့ အငယ်ဆုံးကို သုည၊ အကြီးဆုံးကို 1 fr ပေးပြီး
      repeat နဲ့ နှစ်ခါ ထပ်ပါမယ်။ [[mark:after-minmax]] အခု column နှစ်ခု အတိအကျ ညီသွားပါပြီ။ ဒါပေမဲ့
      စကားလုံး ရှည်က သူ့ card ထဲ မဆံ့တော့လို့၊ card ကနေ လျှံထွက်ပြီး ဘေးက card ရဲ့ နောက်ကွယ်ကို
      ဝင်သွားပါတယ်။ lesson 16 မှာလို စကားလုံး ရှည်ကို
      ချိုးခွင့် ပေးလိုက်ရင်တော့၊ card ထဲမှာပဲ စာကြောင်း အသစ် ဆင်းသွားပါလိမ့်မယ်။
    sources:
      - title: "web.dev Learn CSS — Grid: the fr unit (1fr and its minimum)"
        url: "https://web.dev/learn/css/grid#the_fr_unit"
      - title: "CSS Grid Layout Module Level 2 — the fr unit implies an automatic minimum"
        url: "https://drafts.csswg.org/css-grid/#valdef-grid-template-columns-flex"
      - title: "CSS Grid Layout Module Level 2 — automatic minimum size of grid items"
        url: "https://drafts.csswg.org/css-grid/#min-size-auto"
      - title: "MDN — min-content"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/min-content"
    actions:
      - id: scroll-snacks
        type: preview.scroll
        at: { mark: scroll-snacks }
        timeoutMs: 5000
        top: 410
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-snacks
        type: editor.type
        at: { mark: type-snacks }
        cadence: line-by-line
        target: { file: styles.css, after: "  grid-template-rows: auto 160px;\n}\n", occurrence: 1 }
        text: "\n.snacks .menu {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 12px;\n}\n"
      - id: expect-snacks
        type: expect.preview
        at: { mark: after-snacks }
        timeoutMs: 4000
        target: { by: testId, value: card-long-name }
        textContains: "PyinmanaExpressSpecialMilkTea"
        retry: { maxAttempts: 3, delayMs: 300 }
      # Typed at the END of the rule: until the last ")" lands, the open
      # parenthesis swallows only the closing brace, so the declaration stays
      # invalid and the 1fr 1fr columns hold; nothing else is lost.
      - id: type-minmax
        type: editor.type
        at: { mark: type-minmax }
        cadence: fast-explainer
        target:
          {
            file: styles.css,
            after: ".snacks .menu {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 12px;\n",
            occurrence: 1,
          }
        text: "  grid-template-columns: repeat(2, minmax(0, 1fr));\n"
      - id: expect-minmax
        type: expect.preview
        at: { mark: after-minmax }
        timeoutMs: 4000
        target: { by: testId, value: menu-snacks }
        textContains: "ရှမ်းခေါက်ဆွဲ"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: minmax-repeat
    narration: >
      [[mark:select-minmax]] lesson 12 မှာ ကြိုပြောခဲ့တဲ့ minmax ကို အရင် ကြည့်ရအောင်။ ဒီ minmax က track တစ်ခုကို အကန့်အသတ်
      နှစ်ခု ပေးပါတယ်။ အငယ်ဆုံး အရွယ်အစားနဲ့ အကြီးဆုံး အရွယ်အစားပါ။ ဒီမှာ အငယ်ဆုံးက သုည ဖြစ်လို့
      စကားလုံး ရှည်က column ကို ကျယ်အောင် မတွန်းနိုင်တော့ပါဘူး။ အကြီးဆုံးကတော့ 1 fr ဖြစ်လို့ တစ်ပုံစီ
      ရပါတယ်။ [[mark:select-repeat]] သူ့ အပြင်က repeat ကတော့ track တစ်ခုကို အကြိမ်ကြိမ်
      ထပ်ရေးပေးပါတယ်။ ဘယ်နှစ်ကြိမ်လဲ ဆိုတာ အရင် ရေးပြီး၊ နောက်မှ track ကို ရေးပါတယ်။ ဒါကြောင့် ဒီ
      တန်ဖိုးက minmax track နှစ်ခုကို ဘေးချင်း ရေးတာနဲ့ အတူတူပါ။
    sources:
      - title: "MDN — minmax()"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/minmax"
      - title: "MDN — repeat()"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/repeat"
      - title: "web.dev Learn CSS — Grid"
        url: "https://web.dev/learn/css/grid"
    actions:
      - id: select-minmax
        type: editor.select
        at: { mark: select-minmax }
        target: { file: styles.css, text: "minmax(0, 1fr)", occurrence: 1 }
      - id: select-repeat
        type: editor.select
        at: { mark: select-repeat }
        target: { file: styles.css, text: "repeat(2, minmax(0, 1fr))", occurrence: 1 }

  - id: minmax-board
    narration: >
      [[mark:open-minmax-board]] ကွာခြားချက်ကို board ပေါ်မှာ ကြည့်ရအောင်။ [[mark:draw-auto-min]] 1 fr
      သက်သက် ရေးတာက အငယ်ဆုံး auto ပါတဲ့ minmax နဲ့ အတူတူပါ။ ဒါကြောင့် စကားလုံး ရှည်က သူ့ column ကို
      တခြား column တွေထက် ကျယ်အောင် တွန်းနိုင်ပါတယ်။ [[mark:draw-zero-min]] အငယ်ဆုံးကို သုည
      ပေးလိုက်ရင်တော့ column တွေ ညီနေပြီး၊ အဲဒီအစား content က လျှံထွက်နိုင်ပါတယ်။ [[mark:draw-fr-max]]
      fr ကို minmax ရဲ့ အကြီးဆုံး ဘက်မှာပဲ ထားလို့ ရပြီး၊ အငယ်ဆုံး ဘက်မှာ မရပါဘူး။
      [[mark:draw-repeat]] 1 fr ကို သုံးခါ repeat လုပ်ရင် 1 fr column သုံးခု ရပါတယ်။
      [[mark:draw-repeat-pattern]] repeat က track အုပ်စုကိုလည်း ထပ်ပေးနိုင်ပါတယ်။ 1 fr နဲ့ 2 fr ကို
      နှစ်ခါ repeat လုပ်ရင်၊ ကျဉ်း ကျယ် အလှည့်ကျ column လေးခု ရပါတယ်။
    sources:
      - title: "MDN — minmax() (a flex value is only allowed as the maximum)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/minmax"
      - title: "MDN — repeat()"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/repeat"
      - title: "web.dev Learn CSS — Layout: grid (repeat and minmax)"
        url: "https://web.dev/learn/css/layout#grid"
    actions:
      - id: open-minmax-board
        type: whiteboard.apply
        at: { mark: open-minmax-board }
        open: true
        clear: true
        upsertIds: [d-title]
      - id: draw-auto-min
        type: whiteboard.apply
        at: { mark: draw-auto-min }
        upsertIds: [d-auto-k, d-auto-a, d-auto-b, d-auto-word, d-auto-bad]
        drawMs: 3000
      - id: draw-zero-min
        type: whiteboard.apply
        at: { mark: draw-zero-min }
        upsertIds: [d-zero-k, d-zero-a, d-zero-b, d-zero-ok]
        drawMs: 2600
      - id: draw-fr-max
        type: whiteboard.apply
        at: { mark: draw-fr-max }
        upsertIds: [d-fr-max]
        drawMs: 1400
      - id: draw-repeat
        type: whiteboard.apply
        at: { mark: draw-repeat }
        upsertIds: [d-repeat]
        drawMs: 1600
      - id: draw-repeat-pattern
        type: whiteboard.apply
        at: { mark: draw-repeat-pattern }
        upsertIds: [d-repeat2]
        drawMs: 1800

  - id: max-content
    chapter: "Content အလိုက် track အရွယ်အစား"
    narration: >
      [[mark:close-minmax-board]] နောက်ဆုံး ဈေးနှုန်း စာရင်းပါ။ [[mark:scroll-prices]] ဒီ စာရင်းက အခုထိ စာပိုဒ် တစ်ပိုဒ်လို ဆက်တိုက် စီးနေတုန်းပါ။ track တွေကို
      သူတို့ထဲက content ကနေလည်း အရွယ်အစား ယူခိုင်းလို့ ရပါတယ်။ [[mark:type-prices]] စာရင်းကို column
      နှစ်ခု ပါတဲ့ grid လုပ်ပါမယ်။ ပထမ column ကို max-content၊ ဒုတိယကို 1 fr ပေးပြီး၊ ဒီတစ်ခါ gap ကို
      တန်ဖိုး နှစ်ခု ပေးပါမယ်။ [[mark:after-prices]] နာမည်တိုင်းက သူ့ ဈေးနှုန်းရဲ့ ဘေးကို
      ရောက်သွားပြီး၊ နာမည် column က အရှည်ဆုံး နာမည် တစ်ကြောင်းတည်း ဆံ့သလောက် အတိအကျ ကျယ်ပါတယ်။ နာမည် column က သူ့ နေရာ အရင် ယူပြီး၊ ကျန်တာ အကုန်ကို 1 fr ဖြစ်တဲ့ ဈေးနှုန်း column က ရပါတယ်။
      [[mark:select-max]] ဒီ max-content ကို ကြည့်ပါ။ max-content ဆိုတာ စာကြောင်း လုံးဝ မချိုးဘဲ
      content ဆံ့တဲ့ အကျယ်ပါ။ တိုတဲ့ label တွေအတွက် ကောင်းပေမယ့်၊ နာမည် အရမ်း ရှည်ရင် column က အရမ်း
      ကျယ်သွားပြီး container အပြင်ကိုတောင် လျှံထွက်နိုင်ပါတယ်။ [[mark:select-gap-two]] ဒီ gap ကို
      ကြည့်ပါ။ တန်ဖိုး နှစ်ခု ပေးရင်၊ ပထမက row တွေကြား၊ ဒုတိယက column တွေကြားက နေရာပါ။ row gap နဲ့ column gap ဆိုတဲ့ property တွေနဲ့ သီးသန့်လည်း ပေးလို့ ရပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Grid (intrinsic sizing keywords)"
        url: "https://web.dev/learn/css/grid"
      - title: "MDN — max-content"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/max-content"
      - title: "MDN — gap (row-gap and column-gap)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/gap"
    actions:
      - id: close-minmax-board
        type: whiteboard.apply
        at: { mark: close-minmax-board }
        open: false
      - id: scroll-prices
        type: preview.scroll
        at: { mark: scroll-prices }
        timeoutMs: 5000
        top: 840
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-prices
        type: editor.type
        at: { mark: type-prices }
        cadence: line-by-line
        target:
          {
            file: styles.css,
            after: "  grid-template-columns: repeat(2, minmax(0, 1fr));\n}\n",
            occurrence: 1,
          }
        text: "\n.price-list {\n  display: grid;\n  grid-template-columns: max-content 1fr;\n  gap: 8px 16px;\n}\n"
      - id: expect-prices
        type: expect.preview
        at: { mark: after-prices }
        timeoutMs: 4000
        target: { by: testId, value: item-lime }
        textContains: "Fresh lime juice with ice"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-max
        type: editor.select
        at: { mark: select-max }
        target: { file: styles.css, text: "grid-template-columns: max-content 1fr;", occurrence: 1 }
      - id: select-gap-two
        type: editor.select
        at: { mark: select-gap-two }
        target: { file: styles.css, text: "gap: 8px 16px;", occurrence: 1 }

  - id: min-fit
    narration: >
      [[mark:type-min]] min-content နဲ့ လဲကြည့်ရအောင်။ [[mark:after-min]] နာမည် column က ရနိုင်သမျှ
      ကျဉ်းသွားပါပြီ။ နာမည် ရှည်က space တိုင်းမှာ ချိုးသွားလို့၊ စကားလုံး တစ်လုံးချင်း အပေါ်အောက်
      ဆင့်နေပါတယ်။ [[mark:explain-min]] min-content ဆိုတာ content မလျှံဘဲ ရနိုင်တဲ့ အကျဉ်းဆုံး
      အကျယ်ပါ။ lesson 2 မှာ မြင်ခဲ့သလို အရှည်ဆုံး စကားလုံးလောက်ပါ။ ဒီ နာမည်တွေကို အင်္ဂလိပ်လို တမင် ရေးထားတာပါ။ မြန်မာစာမှာ စကားလုံးတွေကြား space မခြားလို့၊ ဘယ်နေရာမှာ ချိုးမလဲ
      ဆိုတာ browser နဲ့ font ပေါ် မူတည်လို့ပါ။ [[mark:type-fit]] တတိယ ရွေးစရာက ဒီ နှစ်ခုရဲ့ ကြားမှာ
      ရှိပါတယ်။ fit-content ကို အများဆုံး 120 pixel ပေးပါမယ်။ [[mark:after-fit]] နာမည် တိုတွေက
      တစ်ကြောင်းတည်း ရှိနေပြီး၊ နာမည် ရှည်ကပဲ စာကြောင်း ခွဲပြီး အောက်ကို ဆင်းသွားပါတယ်။ column က 120 pixel ရောက်တာနဲ့
      ဆက်မကျယ်တော့လို့ပါ။ [[mark:select-fit]] ဒီ fit-content ကို ကြည့်ပါ။ သူက အကန့်အသတ် မရောက်မချင်း
      max-content လို အလုပ်လုပ်ပြီး၊ ရောက်ပြီးရင်တော့ စာကြောင်းကို ချိုးပါတယ်။ စာ တိုရင် စာနဲ့ အံကိုက်
      ကျဉ်းနေပြီး၊ သတ်မှတ်ထားတာထက် မကျယ်စေချင်တဲ့ label column မျိုးအတွက် သင့်တော်ပါတယ်။
    sources:
      - title: "MDN — min-content"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/min-content"
      - title: "MDN — fit-content()"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/fit-content_function"
      - title: "CSS Grid Layout Module Level 2 — track sizing (min-content, max-content, fit-content())"
        url: "https://drafts.csswg.org/css-grid/#track-sizing"
    actions:
      - id: type-min
        type: editor.type
        at: { mark: type-min }
        cadence: line-by-line
        target:
          { file: styles.css, after: "  grid-template-columns: max-content 1fr;\n", occurrence: 1 }
        text: "  grid-template-columns: min-content 1fr;\n"
      # The long name grows to five lines; keep the whole list in view.
      - id: scroll-prices-again
        type: preview.scroll
        at: { mark: after-min }
        timeoutMs: 5000
        top: 840
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-min
        type: expect.preview
        at: { afterAction: scroll-prices-again }
        timeoutMs: 4000
        target: { by: testId, value: item-lime }
        textContains: "Fresh lime juice with ice"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-fit
        type: editor.type
        at: { mark: type-fit }
        cadence: line-by-line
        target:
          { file: styles.css, after: "  grid-template-columns: min-content 1fr;\n", occurrence: 1 }
        text: "  grid-template-columns: fit-content(120px) 1fr;\n"
      - id: expect-fit
        type: expect.preview
        at: { mark: after-fit }
        timeoutMs: 4000
        target: { by: testId, value: price-list }
        textContains: "1,200 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-fit
        type: editor.select
        at: { mark: select-fit }
        target: { file: styles.css, text: "fit-content(120px)", occurrence: 1 }

  - id: twelve-columns
    chapter: "12 column grid နဲ့ DevTools"
    narration: >
      [[mark:open-twelve]] website တွေမှာ မကြာခဏ တွေ့ရတဲ့ layout တစ်ခုက 12 column grid ပါ။
      [[mark:draw-twelve-code]] declaration သုံးခုတည်းနဲ့ ရေးလို့ ရပါတယ်။ grid container လုပ်တာ၊
      repeat နဲ့ column 12 ခု ပေးတာ၊ gap ထည့်တာပါ။ ခုနက မြင်ခဲ့သလို column တွေ တကယ် ညီအောင်၊ minmax နဲ့ အငယ်ဆုံး သုည ပေးထားပါတယ်။ [[mark:draw-twelve-cols]] 12 ကို နှစ်ပုံ၊
      သုံးပုံ၊ လေးပုံ၊ ခြောက်ပုံ ညီညီ ပိုင်းလို့ ရလို့ လူကြိုက်များပါတယ်။ ဥပမာ အပိုင်း တစ်ပိုင်းက
      တစ်ဝက်အတွက် column ခြောက်ခု၊ သုံးပုံ တစ်ပုံအတွက် လေးခု ယူပါတယ်။ [[mark:draw-twelve-lines]]
      column 12 ခုမှာ line 13 ကြောင်း ရှိပါတယ်။ နောက် lesson မှာ ဒီ line နံပါတ်တွေကို သုံးပြီး item
      တွေကို နေရာချပါမယ်။ [[mark:draw-too-narrow]] ကိုယ့် preview က ဖုန်း screen လောက်ပဲ ကျယ်လို့၊
      column 12 ခု ခွဲရင် တစ်ခုက 20 pixel တောင် မပြည့်ပါဘူး။
      [[mark:draw-devtools]] ကိုယ့် computer ပေါ်မှာတော့ browser ရဲ့ DevTools က grid line တွေကို
      ဆွဲပြပေးနိုင်ပါတယ်။ Chrome ဒါမှမဟုတ် Firefox ရဲ့ element စာရင်းထဲမှာ grid container ဘေးက grid
      badge လေးကို နှိပ်လိုက်ရင်၊ line နံပါတ်တွေက page ပေါ်မှာ ပေါ်လာပါမယ်။
    sources:
      - title: "web.dev Learn CSS — Layout: grid (a 12-column grid in three declarations)"
        url: "https://web.dev/learn/css/layout#grid"
      - title: "Chrome DevTools — Inspect CSS grid"
        url: "https://developer.chrome.com/docs/devtools/css/grid"
      - title: "Firefox DevTools — Examine grid layouts"
        url: "https://firefox-source-docs.mozilla.org/devtools-user/page_inspector/how_to/examine_grid_layouts/"
    actions:
      - id: open-twelve
        type: whiteboard.apply
        at: { mark: open-twelve }
        open: true
        clear: true
        upsertIds: [e-title]
      - id: draw-twelve-code
        type: whiteboard.apply
        at: { mark: draw-twelve-code }
        upsertIds: [e-code1, e-code2, e-code3]
        drawMs: 2400
      - id: draw-twelve-cols
        type: whiteboard.apply
        at: { mark: draw-twelve-cols }
        upsertIds:
          [
            e-col1,
            e-col2,
            e-col3,
            e-col4,
            e-col5,
            e-col6,
            e-col7,
            e-col8,
            e-col9,
            e-col10,
            e-col11,
            e-col12,
          ]
        drawMs: 3000
      - id: draw-twelve-lines
        type: whiteboard.apply
        at: { mark: draw-twelve-lines }
        upsertIds:
          [
            e-line1,
            e-line2,
            e-line3,
            e-line4,
            e-line5,
            e-line6,
            e-line7,
            e-line8,
            e-line9,
            e-line10,
            e-line11,
            e-line12,
            e-line13,
          ]
        drawMs: 3000
      - id: draw-too-narrow
        type: whiteboard.apply
        at: { mark: draw-too-narrow }
        upsertIds: [e-narrow]
        drawMs: 1600
      - id: draw-devtools
        type: whiteboard.apply
        at: { mark: draw-devtools }
        upsertIds: [e-devtools]
        drawMs: 1600

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:open-quiz]] မပြီးခင် မေးခွန်း တစ်ခု မေးကြည့်ရအောင်။ grid တစ်ခုမှာ column ငါးခု ရှိရင်၊
      column line ဘယ်နှစ်ကြောင်း ရှိမလဲ။ ခဏ စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] အဖြေက ခြောက်ကြောင်းပါ။
      line တွေကို 1 ကနေ စ ရေတွက်ပြီး၊ line က track ထက် အမြဲ တစ်ကြောင်း ပိုပါတယ်။ [[mark:recap]] ဒါဆို
      ပြန်ချုပ်ရရင်၊ grid container ရဲ့ တိုက်ရိုက် child တွေပဲ item ဖြစ်ပါတယ်။ grid template columns
      နဲ့ rows က track တွေကို သတ်မှတ်ပြီး၊ gap က track တွေကြားမှာပဲ ရှိပါတယ်။ တခြား track တွေနဲ့ gap ယူပြီး ကျန်တဲ့ နေရာကို fr က ခွဲပါတယ်။ 1 fr ရဲ့ အငယ်ဆုံးက auto ဖြစ်လို့၊ column တကယ် ညီစေချင်ရင်
      အငယ်ဆုံး သုည ပါတဲ့ minmax ကို သုံးပါ။ repeat က track ကို ထပ်ရေးပေးပြီး၊ max-content၊ min-content
      နဲ့ fit-content က track ကို content ကနေ အရွယ်အစား ယူစေပါတယ်။ [[mark:next-lesson]] အခုထိ item
      တိုင်းကို browser က နောက် အကွက်လွတ်ထဲကို သူ့ဘာသာ ထည့်ပေးခဲ့ပါတယ်။ နောက် lesson မှာတော့ line
      နံပါတ်တွေနဲ့ item တွေကို ကိုယ်တိုင် နေရာချတာ၊ track နှစ်ခု သုံးခုစာ နေရာယူခိုင်းတာနဲ့၊ column
      အရေအတွက်ကို ရှိတဲ့ နေရာအလိုက် ပြောင်းစေတာကို ကြည့်သွားပါမယ်။
    sources:
      - title: "web.dev Learn CSS — Grid: check your understanding"
        url: "https://web.dev/learn/css/grid#check_your_understanding"
      - title: "MDN — Basic concepts of grid layout"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_grid_layout/Basic_concepts_of_grid_layout"
      - title: "web.dev Learn CSS — Grid: placing items (next lesson)"
        url: "https://web.dev/learn/css/grid#placing_items"
    actions:
      - id: open-quiz
        type: whiteboard.apply
        at: { mark: open-quiz }
        open: true
        clear: true
        upsertIds: [f-title, f-q]
      - id: draw-quiz-answer
        type: whiteboard.apply
        at: { mark: quiz-answer }
        upsertIds: [f-a, f-a-check, f-rule]
        drawMs: 2000
      - id: expect-final-css
        type: expect.file
        at: { mark: recap }
        path: styles.css
        contains: ".drinks .menu {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  grid-template-columns: 120px 1fr;\n  gap: 12px;\n  grid-template-rows: auto 160px;\n}\n\n.snacks .menu {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 12px;\n  grid-template-columns: repeat(2, minmax(0, 1fr));\n}\n"
      - id: expect-final-css-2
        type: expect.file
        at: { afterAction: expect-final-css }
        path: styles.css
        contains: "\n.price-list {\n  display: grid;\n  grid-template-columns: max-content 1fr;\n  grid-template-columns: min-content 1fr;\n  grid-template-columns: fit-content(120px) 1fr;\n  gap: 8px 16px;\n}\n"

checks:
  - { type: timing.p95Ms, max: 300 }
