# CSS course (Burmese), lesson 18 of 43: grid part 1, tracks and fr.
#
# Narration is an ENGLISH DRAFT for the Burmese writer (DESIGN.md next to this
# file is the span-by-span brief). Every [[mark:…]] sits where its action
# begins, at a sentence end; each span carries one piece of meaning.
# Everything the learner sees (title, chapters, whiteboard labels, UI strings)
# is Burmese already.
#
# Shape: board (recall lesson 17: flexbox lays out one line at a time; grid =
# two directions, container, direct children are items) → board (lines
# numbered from 1, N + 1 lines, track, cell, area, gap) → code tour (drinks,
# snacks with one unbroken English name, an English price list; empty
# styles.css) → drinks list display: grid (almost nothing changes: one auto
# column) → 1fr 1fr (two columns, a row track lines cards up) → gap → rows
# auto 160px → board (fr shares the space left after the gap and fixed
# tracks: 400 − 12, 400 − 120 − 12) → 120px 1fr → snacks 1fr 1fr (the long
# word widens its column: 1fr = minmax(auto, 1fr)) → repeat(2, minmax(0, 1fr))
# (equal; the word overflows) → minmax and repeat read on the typed line →
# board (auto vs 0 minimum, repeat(3, 1fr), repeat(2, 1fr 2fr)) → price list
# max-content 1fr with a two-value gap → min-content 1fr → fit-content(120px)
# 1fr → board (the 12-column grid, 13 lines; DevTools grid overlay) → quiz
# (3 columns → 4 lines) and recap, hand-off to placement (lesson 19).
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set(; no postcss config; no reload.
# Rules are appended at the END of styles.css; later declarations are
# inserted inside an existing rule. Keystroke-typed values have no misleading
# valid prefix: "display: g…" and "gap: 12…" are invalid until complete,
# "1fr 1fr" passes only through "1fr" (one column, which looks the same as
# none), "auto 160px" passes only through "auto" (no change), and the
# repeat(2, minmax(0, 1fr)) line is typed at the END of its rule, so its
# unclosed parenthesis swallows only the rule's closing brace and the
# declaration stays invalid until the last ")". "120px 1fr", the three
# intrinsic column lists and the whole snacks and price-list rules are
# line-by-line ("120px", "max-content", "min-content" and "fit-content(120px)"
# alone are valid one-column grids and would flash a different layout).
#
# Measured in headless Chrome at 432 × 720 (probe/stages.ts): drink cards
# 400 wide stacked → display grid unchanged → 1fr 1fr 200/200 (row 1 both
# 131 tall) → gap 194/194 → rows: row 2 160 tall → 120px 1fr 120/268;
# snacks 1fr 1fr 273/115 (the long word's column) → repeat(2, minmax(0, 1fr))
# 194/194, the word's scrollWidth 239 in a 160 content box (runs under the
# next card); price names max-content 172 → min-content 53 (the long name on
# five lines) → fit-content(120px) 120 (the long name on two lines).
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
