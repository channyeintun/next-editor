      package.json: |
        {
          "name": "testing-course-tea-shop",
          "private": true,
          "version": "1.0.0",
          "type": "module",
          "scripts": {
            "dev": "vite --host 0.0.0.0 --port 5173 --strictPort",
            "test": "vitest"
          },
          "devDependencies": {
            "vite": "7.3.7",
            "vitest": "5.1.0"
          }
        }
      src/menu.js: |
        export const MENU = {
          tea: { name: "လက်ဖက်ရည်", price: 1500, drink: true },
          coffee: { name: "ကော်ဖီ", price: 1800, drink: true },
          lime: { name: "သံပုရာရည်", price: 1200, drink: true },
          mohinga: { name: "မုန့်ဟင်းခါး", price: 2500, drink: false },
          paratha: { name: "ပလာတာ", price: 1200, drink: false },
        };

        export function priceOf(id) {
          const item = MENU[id];
          if (!item) throw new Error(`${id} is not on the menu`);
          return item.price;
        }
      src/order-mocked.test.js: |
        import { expect, test, vi } from "vitest";
        import { orderTotal } from "./order.js";

        vi.mock("./order.js", () => ({ orderTotal: () => 3300 }));

        test("charges for tea and coffee", () => {
          const lines = [{ id: "tea" }, { id: "coffee" }];
          expect(orderTotal(lines)).toBe(3300);
        });

        test("charges for two teas", () => {
          const lines = [{ id: "tea", qty: 2 }];
          expect(orderTotal(lines)).toBe(3300);
        });
      src/order.js: |
        import { MENU, priceOf } from "./menu.js";

        export const LARGE_EXTRA = 500;
        export const SUGAR_FEE = 100;

        export function lineTotal({ id, qty = 1, size = "small", sugar = false }) {
          let price = priceOf(id);
          if (size === "large" && MENU[id].drink) price += LARGE_EXTRA;
          if (sugar) price += SUGAR_FEE;
          return price * qty;
        }

        export function orderTotal(lines) {
          return lines.reduce((sum, line) => sum + lineTotal(line));
        }
      src/order.test.js: |
        import { expect, test } from "vitest";
        import { orderTotal } from "./order.js";

        test("adds a two-line order", () => {
          const lines = [{ id: "tea" }, { id: "coffee" }];
          const total = orderTotal(lines);
        });

        test("knows the total", () => {
          const lines = [{ id: "tea" }, { id: "mohinga" }];
          const total = orderTotal(lines);
          expect(total).toBeDefined();
        });
      src/prize.js: |
        // About one customer in 20 wins a free cup.
        export const WIN_CHANCE = 0.05;

        export function winsFreeCup() {
          return Math.random() < WIN_CHANCE;
        }
      src/prize.test.js: |
        import { afterEach, expect, test, vi } from "vitest";
        import { winsFreeCup } from "./prize.js";

        afterEach(() => {
          vi.restoreAllMocks();
        });

        test.skip("gives no free cup on a losing draw", () => { // flaky
          expect(winsFreeCup()).toBe(false);
        });
      vite.config.js: |
        import { defineConfig } from "vite";
        import courseVitestBridge from "./course/vitest-bridge.js";

        // The course panel: the dev server runs the real Vitest and the preview shows its results.
        export default defineConfig({
          plugins: [courseVitestBridge()],
        });
