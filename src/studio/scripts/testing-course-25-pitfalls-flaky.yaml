  - id: flaky
    chapter: "Flaky test တွေ ဘာကြောင့် ဖြစ်လဲ"
    narration: >
      [[mark:board-flaky]] flaky test ကို fake timers lesson မှာ နာရီနဲ့ တွေ့ခဲ့ပြီးပါပြီ။ ဒီတစ်ခါ
      ဘာကြောင့် ဖြစ်တတ်လဲ ကြည့်ရအောင်။ [[mark:draw-causes]] အကြောင်းရင်းက
      များသောအားဖြင့် test က မထိန်းထားတဲ့ အချိန်၊ random ဂဏန်း၊ network ချိတ်ဆက်မှု၊ test တွေ မျှသုံးနေတဲ့ state နဲ့
      run တဲ့ အစဉ် စတာတွေပါ။ [[mark:draw-google]] Google က သူ့ test တွေကို ၂၀၁၆ ခုနှစ်မှာ တိုင်းကြည့်တော့၊
      test run အားလုံးရဲ့ ၁ ဒသမ ၅ ရာခိုင်နှုန်းလောက်က flaky ရလဒ် ဖြစ်ပြီး၊ test တွေရဲ့ ၁၆ ရာခိုင်နှုန်း နီးပါးမှာ
      flaky ဖြစ်တာ တစ်ခါခါ ရှိခဲ့ပါတယ်။ [[mark:draw-fatigue]] ခဏခဏ အလကား ကျနေရင် လူတွေက အနီရောင်ကို
      မယုံတော့ဘဲ ကျော်ကြည့်လာပါတယ်။ ဒါကို alarm fatigue လို့ ခေါ်ပြီး၊ တကယ့် bug ကြောင့် ကျတဲ့အခါမှာလည်း
      လွတ်သွားတတ်ပါတယ်။ [[mark:draw-repeats]] Vitest ၅ မှာ ပါလာတဲ့ repeats option နဲ့ test ကို အကြိမ်များစွာ
      ထပ် run ပြီး flaky test ကို ဖမ်းလို့ ရပါတယ်။
    sources:
      - {
          title: "web.dev Learn Testing: Where tests run, CI and flaky tests",
          url: "https://web.dev/learn/testing/get-started/where-tests-run#run_tests_as_part_of_continuous_integration",
        }
      - {
          title: "web.dev Learn Testing: An interlude on rolling back, alarm fatigue",
          url: "https://web.dev/learn/testing/get-started/where-tests-run#an_interlude_on_rolling_back",
        }
      - {
          title: "John Micco, Flaky Tests at Google and How We Mitigate Them, 2016 (facts C16)",
          url: "https://testing.googleblog.com/2016/05/flaky-tests-at-google-and-how-we.html",
        }
      - {
          title: "Vitest 5 announcement, the repeats option",
          url: "https://vitest.dev/blog/vitest-5",
        }
    actions:
      - id: board-flaky
        type: whiteboard.apply
        at: { mark: board-flaky }
        clear: true
        upsertIds: [b-title, b-def]
        drawMs: 1500
      - id: draw-causes
        type: whiteboard.apply
        at: { mark: draw-causes }
        upsertIds: [b-causes-box, b-causes]
        drawMs: 2500
      - id: draw-google
        type: whiteboard.apply
        at: { mark: draw-google }
        upsertIds: [b-google-1, b-google-2]
        drawMs: 3000
      - id: draw-fatigue
        type: whiteboard.apply
        at: { mark: draw-fatigue }
        upsertIds: [b-fatigue]
        drawMs: 2000
      - id: draw-repeats
        type: whiteboard.apply
        at: { mark: draw-repeats }
        upsertIds: [b-repeats]
        drawMs: 1500

  - id: flaky-fix
    narration: >
      skip လုပ်ထားတဲ့ test ကို ကြည့်ရအောင်။ [[mark:open-prize]] ဆိုင်က customer အယောက် ၂၀ မှာ တစ်ယောက်လောက်ကို
      လက်ဖက်ရည် အလကား ပေးတဲ့ ကံစမ်းမဲ ရှိတယ် ဆိုပါစို့။ [[mark:select-random]] ဒီ function က random ဂဏန်း
      တစ်ခု ယူပြီး၊ ၅ ရာခိုင်နှုန်း အောက် ကျရင် ကံထူးတယ်လို့ ပြန်ပေးပါတယ်။ [[mark:open-prize-test]] test
      ဖိုင်ကို ဖွင့်ကြည့်ရအောင်။ [[mark:select-skip]] ဒီ test က ကံမထူးရင် လက်ဖက်ရည် အလကား မပေးရဘူး ဆိုတာကို
      စစ်ချင်ပေမဲ့၊ ကံမထူးအောင် ဘာမှ စီစဉ်မထားဘဲ ကံကိုပဲ ယုံထားပါတယ်။ ဒါကြောင့် အကြိမ် ၂၀ မှာ တစ်ခါလောက်
      ကျပြီး၊ အဖွဲ့က flaky လို့ မှတ်ပြီး skip လုပ်ထားခဲ့တာပါ။ အကြောင်းပြချက်နဲ့ ခဏ skip ထားတာက
      ရပေမဲ့၊ skip ထားတဲ့ test က ဘာမှ မစစ်လို့ အကြောင်းရင်းကို မြန်မြန် ပြင်ရပါမယ်။ [[mark:type-spy]] အကြောင်းရင်းက random ပါ။ ဒါကြောင့် spy On နဲ့ Math ရဲ့ random ကို ယာယီ
      အစားထိုးပြီး ကံမထူးတဲ့ ဂဏန်းကို ပြန်ပေးခိုင်းပါမယ်။ test က ကိုယ်တိုင် ကံမထူးအောင် စီစဉ်လိုက်တာပါ။
      [[mark:type-unskip]] ပြီးရင် skip မပါတဲ့ line အသစ်ကို ရေးပြီး အဟောင်းကို comment လုပ်ထားပါမယ်။ ကိုယ့်
      project မှာဆိုရင်တော့ skip နဲ့ မှတ်ချက်ကို ဖျက်လိုက်ရုံပါပဲ။ [[mark:read-unskip]] panel ကို ကြည့်ပါ။ ခုနက skip လုပ်ထားတဲ့ test က အမှန်ခြစ် ဖြစ်ပြီး၊ summary မှာ
      ၅ ခုလုံး pass လို့ ပြနေပါတယ်။ random ကို test က ထိန်းထားလို့ ဘယ်နှစ်ခါ run run အမြဲ pass ဖြစ်မှာပါ။ after
      Each ကလည်း test တိုင်း ပြီးရင် spy ကို restore လုပ်ပေးလို့၊ နောက် test တွေမှာ Math ရဲ့ random က ပုံမှန်
      ပြန်ဖြစ်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn Testing: Where tests run, the Math.random example",
          url: "https://web.dev/learn/testing/get-started/where-tests-run#run_tests_as_part_of_continuous_integration",
        }
      - { title: "Vitest: vi.spyOn", url: "https://vitest.dev/api/vi#vi-spyon" }
      - { title: "Vitest: mockReturnValue", url: "https://vitest.dev/api/mock#mockreturnvalue" }
      - { title: "Vitest: vi.restoreAllMocks", url: "https://vitest.dev/api/vi#vi-restoreallmocks" }
      - { title: "Vitest: test.skip", url: "https://vitest.dev/api/test#test-skip" }
    actions:
      - id: close-flaky
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-prize
        type: workspace.openFile
        at: { mark: open-prize }
        path: src/prize.js
      - id: select-random
        type: editor.select
        at: { mark: select-random }
        target: { file: src/prize.js, text: "return Math.random() < WIN_CHANCE;", occurrence: 1 }
      - id: open-prize-test
        type: workspace.openFile
        at: { mark: open-prize-test }
        path: src/prize.test.js
      - id: select-skip
        type: editor.select
        at: { mark: select-skip }
        target:
          {
            file: src/prize.test.js,
            text: 'test.skip("gives no free cup on a losing draw", () => { // flaky',
            occurrence: 1,
          }
      - id: type-spy
        type: editor.type
        at: { mark: type-spy }
        target:
          {
            file: src/prize.test.js,
            after: "test.skip(\"gives no free cup on a losing draw\", () => { // flaky\n",
            occurrence: 1,
          }
        text: "  vi.spyOn(Math, \"random\").mockReturnValue(0.5);\n"
      - id: type-unskip
        type: editor.type
        at: { mark: type-unskip }
        target:
          { file: src/prize.test.js, after: "  vi.restoreAllMocks();\n});\n\n", occurrence: 1 }
        text: "test(\"gives no free cup on a losing draw\", () => {\n// "
        cadence: block
      - id: expect-unskip
        type: expect.preview
        at: { afterAction: type-unskip }
        timeoutMs: 8000
