  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ အမှန်ခြစ်ဟာ assertion က တကယ် စစ်ထားမှပဲ အဓိပ္ပာယ် ရှိပါတယ်။ assertion မပါတဲ့
      test တွေ၊ to Be Defined လို အားနည်းတဲ့ assertion ပဲ ပါတဲ့ test တွေ၊ စစ်ရမယ့် module ကိုယ်တိုင်ကို mock
      လုပ်ထားတဲ့ test တွေက code မှားနေလည်း pass ဖြစ်ပါတယ်။ [[mark:recap-debug]] test ကျရင် message နဲ့ code
      frame ကို အရင် ဖတ်ပြီး console log နဲ့ တန်ဖိုးတွေကို ထုတ်ကြည့်ပါ။ flaky test ကိုလည်း skip လုပ်ပြီး
      မထားဘဲ၊ test က မထိန်းထားတဲ့ အရာကို ထိန်းပြီး ပြင်ပါ။ နောက် lesson မှာတော့ after Each နဲ့ ကိုယ်တိုင်
      လုပ်ခဲ့ရတဲ့ restore လို ပြင်ဆင်ချက်တွေကို project တစ်ခုလုံးအတွက် တစ်နေရာတည်းမှာ သတ်မှတ်ပေးတဲ့ Vitest
      config ဖိုင်ကို ကြည့်သွားပါမယ်။
