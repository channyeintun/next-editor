    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ coverage က run သွားတဲ့ code ကို ပြပေမဲ့၊ test က အဲဒီ code ကို
      တကယ် စစ်ခဲ့လား ဆိုတာကိုတော့ မပြဘူး ဆိုတာ မြင်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ code မှားနေရက်နဲ့ pass
      ဖြစ်နေတဲ့ test တွေ၊ code မပြောင်းဘဲ တစ်ခါ pass တစ်ခါ fail ဖြစ်တတ်တဲ့ flaky test တွေနဲ့ test ကျရင်
      debug လုပ်နည်းကို ကြည့်ပါမယ်။ [[mark:draw-trap-1]] code ဘယ်လောက်ပဲ မှားမှား ဘယ်တော့မှ မကျတဲ့ test
      တွေ ရှိပါတယ်။ ပထမ တစ်မျိုးက assertion မပါတဲ့ test ပါ။ function ကို ခေါ်ပေမဲ့ ရလာတဲ့ အဖြေကို
      မစစ်လို့၊ error မတက်သရွေ့ အမြဲ pass ဖြစ်နေပါတယ်။ [[mark:draw-trap-2]] ဒုတိယ တစ်မျိုးက အားနည်းတဲ့
      assertion ပါ။ to Be Defined က undefined မဟုတ်ရင် pass ဖြစ်လို့၊ ဂဏန်း မှားနေလည်း၊ စာသား
      ဖြစ်နေလည်း pass ပါပဲ။ [[mark:draw-trap-3]] တတိယ တစ်မျိုးကတော့ စစ်ချင်တဲ့ module ကိုယ်တိုင်ကို mock
      လုပ်ထားတာပါ။ test က ကိုယ့် code ကို မစစ်ဘဲ အတုကိုပဲ စစ်နေတာ ဖြစ်ပါတယ်။ [[mark:draw-trap-note]]
      ဒါကြောင့် PASS ကို မြင်ရုံနဲ့ code မှန်တယ်လို့ ယုံလို့ မရပါဘူး။
    sources:
      - {
          title: "web.dev Learn Testing: Welcome, coming soon: avoid common test pitfalls",
          url: "https://web.dev/learn/testing/welcome",
        }
      - {
          title: "Vitest: Writing Tests with AI, do the tests assert something meaningful (facts D17)",
          url: "https://vitest.dev/guide/learn/writing-tests-with-ai#do-the-tests-actually-assert-something-meaningful",
        }
      - {
          title: "Gerard Meszaros: Test Double, never replace the part you verify (facts C07)",
          url: "http://xunitpatterns.com/Test%20Double.html",
        }
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-trap-1
        type: whiteboard.apply
        at: { mark: draw-trap-1 }
        upsertIds: [a-box-1, a-test-1, a-arrow-1, a-cons-1]
        drawMs: 3000
      - id: draw-trap-2
        type: whiteboard.apply
        at: { mark: draw-trap-2 }
        upsertIds: [a-box-2, a-test-2, a-arrow-2, a-cons-2]
        drawMs: 3000
      - id: draw-trap-3
        type: whiteboard.apply
        at: { mark: draw-trap-3 }
        upsertIds: [a-box-3, a-test-3, a-arrow-3, a-cons-3]
        drawMs: 3000
      - id: draw-trap-note
        type: whiteboard.apply
        at: { mark: draw-trap-note }
        upsertIds: [a-note]
        drawMs: 1500

  - id: starter
    narration: >
      ဆိုင်ရဲ့ code မှာ ဒီ ပုံစံတွေ ရှိမရှိ ကြည့်ရအောင်။ ဒါက အော်ဒါရဲ့ စုစုပေါင်းကို တွက်တဲ့ function အတွက်
      test ဖိုင်ပါ။ အဲဒီ function ထဲမှာ JavaScript ရေးတဲ့သူ အများစု တစ်ခါလောက်တော့ မှားဖူးကြတဲ့ bug တစ်ခု
      ရှိနေပါတယ်။ [[mark:select-no-assert]] ပထမ test က လက်ဖက်ရည်နဲ့ ကော်ဖီ ပါတဲ့ အော်ဒါကို
      တွက်ခိုင်းပေမဲ့၊ ရလာတဲ့ အဖြေကို ဘယ်နေရာမှာမှ မစစ်ထားပါဘူး။ [[mark:select-defined]] ဒုတိယ test
      ကတော့ လက်ဖက်ရည်နဲ့ မုန့်ဟင်းခါး ပါတဲ့ အော်ဒါကို to Be Defined နဲ့ပဲ စစ်ထားပါတယ်။
      [[mark:open-mocked]] နောက် test ဖိုင် တစ်ဖိုင်ကိုလည်း ကြည့်ရအောင်။ ဒီ ဖိုင်ကို အချိန် မမီလို့
      အလျင်စလို ရေးခဲ့တယ် ဆိုပါစို့။ [[mark:select-mock]] ဒီ line က order module တစ်ခုလုံးကို mock
      လုပ်ပြီး၊ စုစုပေါင်း တွက်တဲ့ function ကို ဘာ အော်ဒါ ပေးပေး ၃၃၀၀ ပြန်ပေးတဲ့ အတုနဲ့ အစားထိုးထားပါတယ်။
      [[mark:select-two-teas]] ဒုတိယ test က လက်ဖက်ရည် နှစ်ခွက်ကို ၃၃၀၀ ကျပ်လို့ စစ်ထားပါတယ်။ ဆိုင်ရဲ့
      menu အရ ၃၀၀၀ ကျပ် ဖြစ်ရမှာမို့ test ကိုယ်တိုင် မှားနေပေမဲ့၊ အတုက အမြဲ ၃၃၀၀ ပြန်ပေးလို့ pass
      ဖြစ်နေမှာပါ။
    sources:
      - {
          title: "Vitest: Writing Tests with AI, testing behavior or implementation (facts D17)",
          url: "https://vitest.dev/guide/learn/writing-tests-with-ai#are-they-testing-behavior-or-implementation",
        }
      - { title: "Vitest: vi.mock", url: "https://vitest.dev/api/vi#vi-mock" }
      - { title: "Vitest: expect, toBeDefined", url: "https://vitest.dev/api/expect#tobedefined" }
    actions:
      - id: close-traps
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: select-no-assert
        type: editor.select
        at: { mark: select-no-assert }
        target: { file: src/order.test.js, text: "const total = orderTotal(lines);", occurrence: 1 }
      - id: select-defined
        type: editor.select
        at: { mark: select-defined }
        target: { file: src/order.test.js, text: "expect(total).toBeDefined();", occurrence: 1 }
      - id: open-mocked
        type: workspace.openFile
        at: { mark: open-mocked }
        path: src/order-mocked.test.js
      - id: select-mock
        type: editor.select
        at: { mark: select-mock }
        target:
          {
            file: src/order-mocked.test.js,
            text: 'vi.mock("./order.js", () => ({ orderTotal: () => 3300 }));',
            occurrence: 1,
          }
      - id: select-two-teas
        type: editor.select
        at: { mark: select-two-teas }
        target:
          {
            file: src/order-mocked.test.js,
            text: "const lines = [{ id: \"tea\", qty: 2 }];\n  expect(orderTotal(lines)).toBe(3300);",
            occurrence: 1,
          }

  - id: panel
    narration: >
      [[mark:ready]] Vitest က ဒီ ဖိုင်တွေကို run လိုက်တော့ ဘာ ပြလဲ ကြည့်ရအောင်။ ညာဘက်က panel ကလည်း code
      ပြောင်းတိုင်း သူ့ဘာသာ ပြန် run တဲ့ တကယ့် Vitest ရဲ့ ရလဒ်ပါ။ [[mark:read-green]] အပေါ်မှာ
      အစိမ်းရောင် PASS ပြနေပြီး၊ summary မှာလည်း ၄ ခု pass နဲ့ ၁ ခု skipped လို့ ပြနေပါတယ်။ skip
      လုပ်ထားတဲ့ test ကို နောက်မှ ကြည့်ပါမယ်။ bug ရှိနေရက်နဲ့ test လေးခုလုံး pass ဖြစ်နေတာပါ။
    sources:
      - {
          title: "Vitest: Writing Tests, reading test output",
          url: "https://vitest.dev/guide/learn/writing-tests#reading-test-output",
        }
      - {
          title: "Real Vitest 5.1.0 output: tests that assert nothing still pass (facts A33, capture 29)",
          url: "https://vitest.dev/api/expect#tobedefined",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-start-pass
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1000 }
      - id: expect-start-passed
        type: expect.preview
        at: { afterAction: expect-start-pass }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "4" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-skipped
        type: expect.preview
        at: { afterAction: expect-start-passed }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-skipped, value: "1" }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: weak
    chapter: "Assertion ကို တကယ် စစ်ခိုင်းရအောင်"
    narration: >
      ဒီ test တွေကို ကိုယ်တိုင် တွက်ထားတဲ့ အဖြေနဲ့ တကယ် စစ်ခိုင်းကြည့်ရအောင်။ [[mark:open-test-2]] order
      test ဖိုင်ကို ပြန်ဖွင့်ပါမယ်။ [[mark:type-assert-1]] ပထမ test မှာ စုစုပေါင်းဟာ ၃၃၀၀ ကျပ် ဖြစ်ရမယ်လို့
      စစ်တဲ့ line ထည့်ပါမယ်။ လက်ဖက်ရည် ၁၅၀၀ နဲ့ ကော်ဖီ ၁၈၀၀ ကို menu ကနေ ပေါင်းထားတာပါ။
      [[mark:read-red-1]] panel ကို ကြည့်ပါ။ Vitest က ပြန် run လိုက်တော့ ပြင်လိုက်တဲ့ test ရှေ့မှာ
      ကြက်ခြေခတ် ပေါ်လာပြီး၊ အပေါ်ကလည်း အနီရောင် FAIL ဖြစ်သွားပါပြီ။ အလယ်က Failed Tests အပိုင်းမှာ
      အစိမ်းရောင် Expected က ၃၃၀၀ ဖြစ်ပြီး၊ အနီရောင် Received ကတော့ object Object ဆိုတဲ့ စာနောက်မှာ ၁၈၀၀
      ကပ်နေတဲ့ စာသား ဖြစ်နေပါတယ်။ bug က အစကတည်းက ရှိနေပေမဲ့ test က မစစ်လို့ မသိခဲ့တာပါ။
      [[mark:type-assert-2]] ဒုတိယ test မှာလည်း to Be Defined ရဲ့ အောက်မှာ၊ လက်ဖက်ရည် ၁၅၀၀ နဲ့
      မုန့်ဟင်းခါး ၂၅၀၀ ပေါင်းတဲ့ ၄၀၀၀ ကျပ်ကို စစ်တဲ့ line ထည့်ပါမယ်။ [[mark:read-red-2]] Vitest က ပြန် run
      လိုက်တော့ ဒီ test လည်း ကျသွားပါပြီ။ ဒုတိယ FAIL အပိုင်းမှာ object Object နဲ့ ၂၅၀၀ ကို ဆက်ထားတဲ့ စာသား
      ရနေပြီး၊ to Be Defined ကတော့ အခုလည်း အောင်သွားပါတယ်။ to Be Defined တစ်ခုတည်းနဲ့ဆိုရင် ဒီ bug ကို ဘယ်တော့မှ ဖမ်းမိမှာ မဟုတ်ပါဘူး။
    sources:
      - { title: "Vitest: expect, toBe", url: "https://vitest.dev/api/expect#tobe" }
      - {
          title: "Vitest: Writing Tests with AI, a weak assertion passes for almost anything (facts D17)",
          url: "https://vitest.dev/guide/learn/writing-tests-with-ai#do-the-tests-actually-assert-something-meaningful",
        }
      - {
          title: "MDN: Array.prototype.reduce, initialValue",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/reduce",
        }
    actions:
      - id: open-test-2
        type: workspace.openFile
        at: { mark: open-test-2 }
        path: src/order.test.js
      - id: type-assert-1
        type: editor.type
        at: { mark: type-assert-1 }
        target:
          { file: src/order.test.js, after: "  const total = orderTotal(lines);\n", occurrence: 1 }
        text: "  expect(total).toBe(3300);\n"
      - id: expect-red-1
        type: expect.preview
        at: { afterAction: type-assert-1 }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-red-1-count
        type: expect.preview
        at: { afterAction: expect-red-1 }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-failed, value: "1" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-red-1-message
        type: expect.preview
        at: { afterAction: expect-red-1-count }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute:
          {
            name: data-message,
            value: "expected '[object Object]1800' to be 3300 // Object.is equality",
          }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-red-1-test
        type: expect.preview
        at: { afterAction: expect-red-1-message }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-3 }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: type-assert-2
        type: editor.type
        at: { mark: type-assert-2 }
        target:
          { file: src/order.test.js, after: "  expect(total).toBeDefined();\n", occurrence: 1 }
        text: "  expect(total).toBe(4000);\n"
      - id: expect-red-2
        type: expect.preview
        at: { afterAction: type-assert-2 }
        timeoutMs: 8000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-failed, value: "2" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-red-2-message
        type: expect.preview
        at: { afterAction: expect-red-2 }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-2 }
        attribute:
          {
            name: data-message,
            value: "expected '[object Object]2500' to be 4000 // Object.is equality",
          }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-red-2-test
        type: expect.preview
        at: { afterAction: expect-red-2-message }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-4 }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: debugging
    chapter: "Test ကျရင် ဘယ်လို debug လုပ်မလဲ"
    narration: >
      ကဲ၊ bug ကို ရှာကြည့်ရအောင်။ test ကျရင် message နဲ့ code frame ကို အရင် ဖတ်ပါ။ [[mark:select-frame]]
      code frame က ဒီ line ကို ညွှန်ပြနေပါတယ်။ ၃၃၀၀ က menu ကနေ ကိုယ်တိုင်
      တွက်ထားတဲ့ အဖြေ ဖြစ်လို့ မှားနေတာက function ပြန်ပေးတဲ့ စုစုပေါင်းပါ။ ဒါပေမဲ့ ဘာကြောင့် စာသား ဖြစ်နေလဲ
      ဆိုတာ မသိရသေးပါဘူး။
      [[mark:type-log]] ဒီလို အချိန်မှာ test ထဲမှာ
      console log ထည့်ပြီး တန်ဖိုးကို ထုတ်ကြည့်တာက အမြန်ဆုံး နည်းပါ။ စုစုပေါင်းရဲ့ type နဲ့ တန်ဖိုးကို
      ထုတ်ကြည့်ပါမယ်။ [[mark:read-log]] test စာရင်းရဲ့ အောက်မှာ console အပိုင်း ပေါ်လာပါပြီ။ stdout
      ခေါင်းစဉ်မှာ ဘယ် test က ထုတ်တာလဲ ပြပြီး၊ သူ့အောက်မှာ string နဲ့ object Object ၁၈၀၀ လို့ ပြနေပါတယ်။
      စုစုပေါင်းက ဂဏန်း မဟုတ်ဘဲ string ပါ။ JavaScript က object ကို စာသား ပြောင်းရင် object Object
      ဖြစ်လို့၊ ပေါင်းတဲ့ နေရာမှာ object တစ်ခု ရောပါလာတာပါ။ [[mark:open-order]] စုစုပေါင်း တွက်တဲ့ code ကို
      ကြည့်ရအောင်။ [[mark:select-reduce]] reduce က line တစ်ကြောင်းချင်းရဲ့ ဈေးကို ပေါင်းလာတဲ့ တန်ဖိုးထဲ
      ထပ်ပေါင်းသွားပါတယ်။ ဒါပေမဲ့ စမယ့် တန်ဖိုး မပေးထားလို့၊ reduce က ပထမ line ကိုယ်တိုင်ကို စမယ့် တန်ဖိုး
      အဖြစ် ယူသုံးပါတယ်။ ဒါကြောင့် လက်ဖက်ရည် line ဆိုတဲ့ object နဲ့ ကော်ဖီ ဈေး ၁၈၀၀ ကို ပေါင်းမိပြီး စာသား
      ဖြစ်သွားတာပါ။ [[mark:type-zero]] reduce ရဲ့ နောက်ဆုံးမှာ စမယ့် တန်ဖိုး သုည ကို ထည့်ပါမယ်။
      [[mark:read-fixed]] Vitest က ပြန် run လိုက်တော့ test နှစ်ခုလုံး pass ဖြစ်ပြီး အစိမ်းရောင် PASS
      ပြန်ဖြစ်သွားပါပြီ။ console မှာလည်း number နဲ့ ၃၃၀၀ လို့ ပြောင်းသွားပါပြီ။ ကိုယ့် project မှာဆိုရင်တော့
      bug တွေ့ပြီးရင် console log ကို ပြန်ဖျက်ပါ။ [[mark:open-mocked-2]] mock လုပ်ထားတဲ့ ဖိုင်ကတော့ code
      မှားနေတုန်းကလည်း pass ဖြစ်ပြီး၊ ပြင်ပြီးတော့လည်း pass ဖြစ်နေပါတယ်။ [[mark:select-mock-2]] ဒီ line ကြောင့် order module
      အစစ်ကို တစ်ခါမှ မ run ခဲ့လို့ပါ။ test double က dependency ရဲ့ နေရာမှာ အစားထိုးဖို့ ဖြစ်ပြီး၊ ကိုယ်
      စစ်နေတဲ့ code ကိုယ်တိုင်ကို အစားမထိုးရပါဘူး။ Vitest ရဲ့ AI နဲ့ test ရေးတဲ့ guide ကလည်း AI က mock ကို
      လိုတာထက် ပိုသုံးတတ်တယ်လို့ သတိပေးထားပါတယ်။
    sources:
      - {
          title: "Vitest: Debugging Failing Tests, reading the error and console logging",
          url: "https://vitest.dev/guide/learn/debugging-tests",
        }
      - {
          title: "MDN: Array.prototype.reduce, initialValue",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/reduce",
        }
      - {
          title: "Gerard Meszaros: Test Double (facts C07)",
          url: "http://xunitpatterns.com/Test%20Double.html",
        }
      - {
          title: "Vitest: Writing Tests with AI, AI tends to over-mock (facts D17)",
          url: "https://vitest.dev/guide/learn/writing-tests-with-ai#are-they-testing-behavior-or-implementation",
        }
    actions:
      - id: select-frame
        type: editor.select
        at: { mark: select-frame }
        target: { file: src/order.test.js, text: "toBe(3300)", occurrence: 1 }
      - id: type-log
        type: editor.type
        at: { mark: type-log }
        target:
          { file: src/order.test.js, after: "  const total = orderTotal(lines);\n", occurrence: 1 }
        text: "  console.log(typeof total, total);\n"
      - id: expect-log
        type: expect.preview
        at: { afterAction: type-log }
        timeoutMs: 8000
        target: { by: testId, value: vt-console }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-log-content
        type: expect.preview
        at: { afterAction: expect-log }
        timeoutMs: 5000
        target: { by: testId, value: vt-log-1 }
        attribute: { name: data-content, value: "string [object Object]1800" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: open-order
        type: workspace.openFile
        at: { mark: open-order }
        path: src/order.js
      - id: select-reduce
        type: editor.select
        at: { mark: select-reduce }
        target:
          {
            file: src/order.js,
            text: "lines.reduce((sum, line) => sum + lineTotal(line))",
            occurrence: 1,
          }
      - id: type-zero
        type: editor.type
        at: { mark: type-zero }
        target: { file: src/order.js, after: "sum + lineTotal(line)", occurrence: 1 }
        text: ", 0"
      - id: expect-fixed
        type: expect.preview
        at: { afterAction: type-zero }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-fixed-count
        type: expect.preview
        at: { afterAction: expect-fixed }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "4" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-fixed-log
        type: expect.preview
        at: { afterAction: expect-fixed-count }
        timeoutMs: 5000
        target: { by: testId, value: vt-log-1 }
        attribute: { name: data-content, value: "number 3300" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: open-mocked-2
        type: workspace.openFile
        at: { mark: open-mocked-2 }
        path: src/order-mocked.test.js
      - id: select-mock-2
        type: editor.select
        at: { mark: select-mock-2 }
        target:
          {
            file: src/order-mocked.test.js,
            text: 'vi.mock("./order.js", () => ({ orderTotal: () => 3300 }));',
            occurrence: 1,
          }

  - id: tools
    narration: >
      [[mark:board-tools]] ဒီ lesson မှာတော့ console log နဲ့ ရှာခဲ့ပေမဲ့၊ ကိုယ့် ကွန်ပျူတာမှာ ဆိုရင် တခြား
      tool တွေလည်း ရှိပါတယ်။ [[mark:draw-isolate]] ကျနေတဲ့ test ကို only နဲ့ ဒါမှမဟုတ် terminal မှာ t
      option နဲ့ တစ်ခုတည်း ခွဲ run ကြည့်ပါ။ တစ်ခုတည်း run ရင် pass ဖြစ်ပြီး အားလုံးနဲ့ run မှ ကျရင်၊ test
      တွေကြားမှာ state မျှသုံးနေတာ ဖြစ်နိုင်ပါတယ်။ [[mark:draw-verbose]] verbose reporter က test တိုင်းကို
      တစ်ကြောင်းစီ ပြပေးပါတယ်။ [[mark:draw-editor]] VS Code ရဲ့ Vitest extension မှာ test တစ်ခုချင်းကို
      ခလုတ်နဲ့ run နိုင်ပြီး breakpoint လည်း ထားနိုင်ပါတယ်။ [[mark:draw-ui]] UI option ကတော့ test တွေကို
      browser ထဲက dashboard နဲ့ ပြပေးပါတယ်။ [[mark:draw-debugger]] inspect brk option နဲ့ဆိုရင် debugger
      ကို ချိတ်ပြီး test ကို ရပ်ထားရင်း တန်ဖိုးတွေကို စစ်နိုင်ပါတယ်။ no file parallelism option နဲ့ တွဲသုံးရပြီး၊
      မတွဲရင် Vitest က error ပြပါတယ်။ [[mark:draw-tools-note]] ဒါတွေကို ဒီ lesson မှာ မပြနိုင်ပေမဲ့ ကိုယ့် ကွန်ပျူတာမှာ
      စမ်းကြည့်ပါ။
    sources:
      - {
          title: "Vitest: Debugging Failing Tests, isolating the problem and debugging tools",
          url: "https://vitest.dev/guide/learn/debugging-tests#isolating-the-problem",
        }
      - { title: "Vitest: IDE Integrations, VS Code", url: "https://vitest.dev/guide/ide" }
      - { title: "Vitest: Vitest UI", url: "https://vitest.dev/guide/ui" }
      - { title: "Vitest: Reporters, verbose", url: "https://vitest.dev/guide/reporters" }
      - { title: "Vitest: Debugging", url: "https://vitest.dev/guide/debugging" }
    actions:
      - id: board-tools
        type: whiteboard.apply
        at: { mark: board-tools }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-isolate
        type: whiteboard.apply
        at: { mark: draw-isolate }
        upsertIds: [c-isolate-cmd, c-isolate]
        drawMs: 2000
      - id: draw-verbose
        type: whiteboard.apply
        at: { mark: draw-verbose }
        upsertIds: [c-verbose-cmd, c-verbose]
        drawMs: 2000
      - id: draw-editor
        type: whiteboard.apply
        at: { mark: draw-editor }
        upsertIds: [c-editor-cmd, c-editor]
