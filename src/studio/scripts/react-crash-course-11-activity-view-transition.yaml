      ပြီးတော့ ခေါင်းစဉ် အောက်မှာ ထည့်ပါတယ်။ [[mark:click-open-dish]] panel ကို
      ဖွင့်ရအောင်။ [[mark:after-open-dish]] ပထမ ဟင်းလျာ မုန့်ဟင်းခါး ပေါ်လာပြီး၊
      အပေါ်ဆုံး စာကြောင်းက enter animation 1 ကြိမ်လို့ ပြပါတယ်။ type ကတော့
      မရှိသေးပါဘူး၊ အဲဒါကို နောက်တစ်ပိုင်းမှာ ကြည့်ပါမယ်။
    sources:
