      src/App.jsx: |
        import { useState } from "react";
        import { Header } from "./Header.jsx";

        export default function App() {
          const [tab, setTab] = useState("menu");

          return (
            <main className="page">
              <Header />
              <nav className="tabs">
                <button
                  className={tab === "menu" ? "" : "secondary"}
                  data-testid="tab-menu"
                  onClick={() => setTab("menu")}
                >
                  မီနူး
                </button>
                <button
                  className={tab === "order" ? "" : "secondary"}
                  data-testid="tab-order"
                  onClick={() => setTab("order")}
                >
                  မှာမယ်
                </button>
                <button
                  className={tab === "reviews" ? "" : "secondary"}
                  data-testid="tab-reviews"
                  onClick={() => setTab("reviews")}
                >
                  သုံးသပ်ချက်
                </button>
              </nav>
            </main>
          );
        }
      src/MenuTab.jsx: |
        import { menu } from "./menu.js";

        export default function MenuTab() {
          return (
            <section className="card" data-testid="menu-tab">
              <h2>ဒီနေ့ မီနူး</h2>
              <ul className="list">
                {menu.map((dish) => (
                  <li key={dish.id}>
                    <span>{dish.name}</span>
                    <span className="muted">{dish.price.toLocaleString("en-US") + " ကျပ်"}</span>
                  </li>
                ))}
              </ul>
            </section>
          );
        }
      src/OrderTab.jsx: |
        import { useEffect, useRef, useState } from "react";

        export default function OrderTab() {
          const [note, setNote] = useState("");
          const [seconds, setSeconds] = useState(0);
          const timerRef = useRef(null);

          useEffect(() => {
            const label = timerRef.current;
            label.dataset.timer = "on";
            const id = setInterval(() => {
              setSeconds((s) => s + 1);
            }, 1000);
            return () => {
              clearInterval(id);
              label.dataset.timer = "off";
            };
          }, []);

          return (
            <section className="card" data-testid="order-tab">
              <h2>မှာမယ်</h2>
              <p ref={timerRef} data-testid="order-timer">စောင့်ချိန် – {seconds} စက္ကန့်</p>
              <textarea
                data-testid="order-note"
                placeholder="မီးဖိုချောင်အတွက် မှတ်ချက်"
                value={note}
                onChange={(e) => setNote(e.target.value)}
              />
            </section>
          );
        }
      src/ReviewsTab.jsx: |
        import { use } from "react";

        let reviewsPromise = null;

        function fetchReviews() {
          if (reviewsPromise === null) {
            reviewsPromise = new Promise((resolve) => {
              setTimeout(() => {
                resolve([
                  { id: "r1", text: "မုန့်ဟင်းခါး အရသာ ကောင်းပါတယ်" },
                  { id: "r2", text: "လက်ဖက်သုပ် မွှေးပြီး စပ်ပါတယ်" },
                  { id: "r3", text: "ဆိုင်က သန့်ရှင်းပါတယ်" },
                ]);
              }, 1500);
            });
          }
          return reviewsPromise;
        }

        export default function ReviewsTab() {
          const reviews = use(fetchReviews());

          return (
            <section className="card" data-testid="reviews-tab">
              <h2>သုံးသပ်ချက်များ</h2>
              <ul className="list">
                {reviews.map((review) => (
                  <li key={review.id}>{review.text}</li>
                ))}
              </ul>
            </section>
          );
        }
      src/vtCount.js: |
        let enters = 0;

        export function countEnter(types) {
          enters += 1;
          const type = types.length > 0 ? types.join(", ") : "type မရှိ";
          document.getElementById("vt-count").textContent =
            "View Transition – " + enters + " ကြိမ် · " + type;
        }
      src/DishPanel.jsx: ""

