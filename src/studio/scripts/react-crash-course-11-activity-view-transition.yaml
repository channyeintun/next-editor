  # ------------------------------------------------------------------ 11
  - id: wrap-up
    chapter: "အနှစ်ချုပ်"
    narration: >
      [[mark:board-more]] ViewTransition သုံးနည်း နှစ်ခု ကျန်ပါသေးတယ်။
      [[mark:draw-share]] ViewTransition နှစ်ခုကို name တူ ပေးထားရင်၊ ပုံသေးလေးက
      ပုံကြီး ဖြစ်လာသလို share animation ဖြစ်ပါတယ်။ [[mark:draw-suspense]]
      Suspense boundary တစ်ခုကို ဝိုင်းထားရင်လည်း၊ fallback ကနေ content အစစ်ကို
      ပြောင်းသွားတာကို animate လုပ်ပေးပါတယ်။ [[mark:draw-recap]] ဒါဆို
      ပြန်ချုပ်ရရင်၊ Activity က UI ကို ဖျောက်ထားတုန်း state ကို မှတ်ထားပြီး
      Effect တွေကို ရပ်ထားပါတယ်။ content ကိုလည်း ကြို render လုပ်ပြီး data ကို
      ယူထားပေးပါတယ်။ ViewTransition က Transition ထဲက ပြောင်းလဲမှုတွေကို animate
      လုပ်ပြီး၊ addTransitionType က ဘာကြောင့် ပြောင်းရတာလဲ ဆိုတာ ပြောပေးပါတယ်။
      [[mark:next-lesson]] နောက် lesson နှစ်ခုမှာတော့ server ပေါ်မှာ run တဲ့
      Server Component အစစ်တွေကို ရေးပြီး run ကြည့်ပါမယ်။
    sources:
      - title: "React — <ViewTransition>: Animating a shared element"
        url: "https://react.dev/reference/react/ViewTransition#animating-a-shared-element"
      - title: "React — <ViewTransition>: Animating from Suspense content"
        url: "https://react.dev/reference/react/ViewTransition#animating-from-suspense-content"
      - title: "React — <Activity>"
        url: "https://react.dev/reference/react/Activity"
      - title: "React — Server Components"
        url: "https://react.dev/reference/rsc/server-components"
    actions:
      - id: board-more
        type: whiteboard.apply
        at: { mark: board-more }
        clear: true
        upsertIds: [b5-title]
      - id: draw-share
        type: whiteboard.apply
        at: { mark: draw-share }
        upsertIds: [b5-share]
        drawMs: 1200
      - id: draw-suspense
        type: whiteboard.apply
        at: { mark: draw-suspense }
        upsertIds: [b5-suspense]
        drawMs: 1200
      - id: draw-recap
        type: whiteboard.apply
        at: { mark: draw-recap }
        upsertIds: [b5-divider, b5-recap-activity, b5-recap-vt, b5-recap-type]
        drawMs: 2400
      - id: draw-next
        type: whiteboard.apply
        at: { mark: next-lesson }
        upsertIds: [b5-next, b5-next-underline]
        drawMs: 1200
      - id: expect-app-activity-file
        type: expect.file
        at: { afterAction: draw-next }
        path: src/App.jsx
        contains: "      <Activity mode={tab === \"menu\" ? \"visible\" : \"hidden\"}>\n        <MenuTab />\n      </Activity>\n      <Activity mode={tab === \"order\" ? \"visible\" : \"hidden\"}>\n        <OrderTab />\n      </Activity>\n"
      - id: expect-app-suspense-file
        type: expect.file
        at: { afterAction: expect-app-activity-file }
        path: src/App.jsx
        contains: "      <Suspense fallback={<p className=\"muted\">ခဏစောင့်ပါ…</p>}>\n        <Activity mode={tab === \"reviews\" ? \"visible\" : \"hidden\"}>\n          <ReviewsTab />\n        </Activity>\n      </Suspense>\n"
      - id: expect-app-imports-file
        type: expect.file
        at: { afterAction: expect-app-suspense-file }
        path: src/App.jsx
        contains: "import { Activity, Suspense, useState } from \"react\";\n"
      - id: expect-dp-go-file
        type: expect.file
        at: { afterAction: expect-app-imports-file }
        path: src/DishPanel.jsx
        contains: "    startTransition(() => {\n      addTransitionType(dir);\n      setIndex((index + step + menu.length) % menu.length);\n    });\n"
      - id: expect-dp-vt-file
        type: expect.file
        at: { afterAction: expect-dp-go-file }
        path: src/DishPanel.jsx
        contains: "        <ViewTransition\n          key={dish.id}\n          enter={{ next: \"slide-left\", previous: \"slide-right\", default: \"auto\" }}\n          exit={{ next: \"slide-out-left\", previous: \"slide-out-right\", default: \"auto\" }}\n          onEnter={(instance, types) => countEnter(types)}\n        >\n"
      - id: expect-dp-import-file
        type: expect.file
        at: { afterAction: expect-dp-vt-file }
        path: src/DishPanel.jsx
        contains: "import { ViewTransition, startTransition, addTransitionType, useState } from \"react\";\n"

checks:
