        .tabs {
          display: flex;
          gap: 8px;
          flex-wrap: wrap;
        }

        .card > button {
          justify-self: start;
        }

        .dish {
          display: grid;
          padding: 8px 14px;
          border-radius: 10px;
          background: var(--accent-soft);
        }

        ::view-transition-new(.slide-left) {
          animation: 300ms ease-out both from-right;
        }

        ::view-transition-old(.slide-out-left) {
          animation: 300ms ease-in both to-left;
        }

        ::view-transition-new(.slide-right) {
          animation: 300ms ease-out both from-left;
        }

        ::view-transition-old(.slide-out-right) {
          animation: 300ms ease-in both to-right;
        }

        @keyframes from-right {
          from {
            transform: translateX(60px);
            opacity: 0;
          }
        }

        @keyframes from-left {
          from {
            transform: translateX(-60px);
            opacity: 0;
          }
        }

        @keyframes to-left {
          to {
            transform: translateX(-60px);
            opacity: 0;
          }
        }

        @keyframes to-right {
          to {
            transform: translateX(60px);
            opacity: 0;
          }
        }

        @media (prefers-reduced-motion: reduce) {
          ::view-transition-group(*),
          ::view-transition-old(*),
          ::view-transition-new(*) {
            animation: none;
          }
        }
