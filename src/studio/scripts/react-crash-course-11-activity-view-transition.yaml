        at: { mark: draw-row-visible }
        upsertIds: [b2-r1-box, b2-r1-mode, b2-r1-arrow, b2-r1-text]
        drawMs: 1800
      - id: draw-row-hidden
        type: whiteboard.apply
        at: { mark: draw-row-hidden }
        upsertIds: [b2-r2-box, b2-r2-mode, b2-r2-arrow, b2-r2-text]
        drawMs: 1800
      - id: draw-row-back
        type: whiteboard.apply
        at: { mark: draw-row-back }
        upsertIds: [b2-r3-box, b2-r3-mode, b2-r3-arrow, b2-r3-text]
        drawMs: 1800
      - id: draw-initial
