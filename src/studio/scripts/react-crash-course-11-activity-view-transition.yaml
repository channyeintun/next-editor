  # ------------------------------------------------------------------ 9
  - id: transition-types
    chapter: "Transition type နဲ့ animation ရွေးရအောင်"
    narration: >
      [[mark:open-dp-types]] ဟင်းလျာတွေကို အရင်တစ်ခု၊ နောက်တစ်ခု ခလုတ်တွေနဲ့
      တစ်ခုချင်း လှန်ကြည့်ရအောင်။ [[mark:wire-att-import]] addTransitionType ကို
      ယူပါတယ်။ [[mark:wire-go]] go function က startTransition ထဲမှာ ဟင်းလျာ
      နံပါတ်ကို တစ်ဆင့် တိုး ဒါမှမဟုတ် လျှော့ပြီး၊ အစွန်း ရောက်ရင်
      တစ်ဖက်စွန်းကို ပြန်ပတ်ပါတယ်။ [[mark:select-att]] addTransitionType ကို
      next ဒါမှမဟုတ် previous နဲ့၊ startTransition ထဲမှာပဲ ခေါ်ရတာကို ကြည့်ပါ။
      Transition ကို type တပ်ပေးလိုက်တော့၊ ဘာကြောင့် ပြောင်းတာလဲ ဆိုတာကို
      ViewTransition က သိသွားပါတယ်။ [[mark:wire-step-buttons]] အရင်တစ်ခု ခလုတ်က
      go ကို previous နဲ့၊ နောက်တစ်ခု ခလုတ်က next နဲ့ ခေါ်ပါတယ်။
      [[mark:open-styles]] CSS ဖိုင်ထဲမှာ animation တွေ ရေးပြီးသားပါ။
      [[mark:select-css]] ဒီ CSS rule က ပုံ အသစ်ကို ညာဘက်ကနေ လျှောဝင်လာအောင်
      လုပ်ပေးပါတယ်။ [[mark:open-dp-maps]] panel ဆီ ပြန်ရအောင်။
      [[mark:wire-maps]] enter နဲ့ exit အတွက် object နှစ်ခုက transition type
      အလိုက် CSS class ကို ရွေးပေးပါတယ်။ next ဆိုရင် အသစ်က ညာဘက်ကနေ ဝင်လာပြီး၊
      previous ဆိုရင် ဘယ်ဘက်ကနေ ဝင်လာပါတယ်။ [[mark:select-default]] default
      ကတော့ panel ဖွင့်တာလို type မပါတဲ့ Transition တွေအတွက်ပါ။ auto ဆိုတာ
      အဟောင်းက မှိန်ပြီး ပျောက်သွားရင်း အသစ်က ပေါ်လာတဲ့ browser ရဲ့ ပုံမှန်
      cross-fade ပါ။
    sources:
      - title: "React — addTransitionType"
        url: "https://react.dev/reference/react/addTransitionType"
      - title: "React — <ViewTransition>: View Transition Class"
        url: "https://react.dev/reference/react/ViewTransition#view-transition-class"
      - title: "React — <ViewTransition>: Styling View Transitions"
        url: "https://react.dev/reference/react/ViewTransition#styling-view-transitions"
      - title: "MDN — ::view-transition-new()"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/::view-transition-new"
    actions:
      - id: open-dp-types
        type: workspace.openFile
        at: { mark: open-dp-types }
        path: src/DishPanel.jsx
      - id: wire-att-import
        type: editor.type
        at: { mark: wire-att-import }
        cadence: block
        target:
          {
            file: src/DishPanel.jsx,
            after: "import { ViewTransition, startTransition",
            occurrence: 1,
          }
        text: ", addTransitionType"
      - id: wire-go
        type: editor.type
        at: { mark: wire-go }
        cadence: block
        target:
          { file: src/DishPanel.jsx, after: "      setOpen(!open);\n    });\n  }\n", occurrence: 1 }
        text: "\n  function go(dir) {\n    const step = dir === \"next\" ? 1 : -1;\n    startTransition(() => {\n      addTransitionType(dir);\n      setIndex((index + step + menu.length) % menu.length);\n    });\n  }\n"
      - id: select-att
        type: editor.select
        at: { mark: select-att }
        target: { file: src/DishPanel.jsx, text: "addTransitionType(dir);", occurrence: 1 }
      - id: wire-step-buttons
        type: editor.type
        at: { mark: wire-step-buttons }
        cadence: block
        target:
          { file: src/DishPanel.jsx, after: "        </ViewTransition>\n      )}\n", occurrence: 1 }
        text: "      {open && (\n        <div className=\"row\">\n          <button className=\"secondary\" data-testid=\"dish-prev\" onClick={() => go(\"previous\")}>\n            အရင်တစ်ခု\n          </button>\n          <button className=\"secondary\" data-testid=\"dish-next\" onClick={() => go(\"next\")}>\n            နောက်တစ်ခု\n          </button>\n        </div>\n      )}\n"
      - id: open-styles
        type: workspace.openFile
        at: { mark: open-styles }
        path: src/styles.css
      - id: select-css
        type: editor.select
        at: { mark: select-css }
        target:
          {
            file: src/styles.css,
            text: "::view-transition-new(.slide-left) {\n  animation: 300ms ease-out both from-right;\n}\n",
            occurrence: 1,
          }
      - id: open-dp-maps
        type: workspace.openFile
        at: { mark: open-dp-maps }
        path: src/DishPanel.jsx
      - id: wire-maps
        type: editor.type
        at: { mark: wire-maps }
        cadence: block
        target: { file: src/DishPanel.jsx, after: "          key={dish.id}\n", occurrence: 1 }
        text: "          enter={{ next: \"slide-left\", previous: \"slide-right\", default: \"auto\" }}\n          exit={{ next: \"slide-out-left\", previous: \"slide-out-right\", default: \"auto\" }}\n"
      - id: select-default
        type: editor.select
        at: { mark: select-default }
        target: { file: src/DishPanel.jsx, text: 'default: "auto"', occurrence: 1 }

