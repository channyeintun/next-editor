# React crash course, lesson 11 — Activity and View Transitions (Burmese, my-MM).
#
# Story: three tabs (menu / order / reviews) live inside <Activity>. The order
# tab's typed note survives a tab switch (state and DOM kept, the hidden tab is
# only `display: none`); its waiting timer, an Effect interval, does not run
# while the tab is hidden (it starts from 0 on the first reveal and resumes
# from its saved number after a round trip; the Effect marks the timer line
# data-timer="on" and its cleanup "off", so the pause is asserted, not only
# narrated); the reviews tab reads
# use(promise) and is pre-rendered while hidden, so it opens with no fallback.
# Then a dish panel opens inside startTransition with <ViewTransition>
# (React 19.3), steps next/previous with addTransitionType, and picks
# slide classes from enter/exit maps keyed by transition type. Because studio
# playback replays the DOM (rrweb), not the browser's animation, a pinned
# helper (src/vtCount.js) writes every onEnter into a line outside React
# (#vt-count in index.html), so each transition is visible and asserted.
#
# Insert-only plan: App.jsx is live from the start, so it only takes `block`
# inserts (the import before the usage). MenuTab, OrderTab, ReviewsTab and
# vtCount.js are pinned (code tour only); DishPanel.jsx is pinned EMPTY and
# typed while nothing imports it, then wired with two blocks; after that,
# every DishPanel edit is a `block`. Every JS edit reloads the preview, so all
# clicks of a demo come after its last edit, and the panel is reopened after
# the addTransitionType edits.
#
# The dev server starts during the first board and is first needed when the
# preview opens, about 80 s of narration later.
#
# Narration is Burmese (voice-script.md next to this file is the source; the
# English meaning-reference is tools/narration-en.txt, the brief is DESIGN.md);
# every visible string (title, chapters, board labels, UI) is Burmese too.
