        at: { mark: draw-initial }
        upsertIds: [b2-initial]
        drawMs: 1000

  # ------------------------------------------------------------------ 5
  - id: reviews-prerender
    chapter: "Hidden tab ကို ကြို render လုပ်ထားရအောင်"
    narration: >
      [[mark:close-board-2]] hidden Activity နဲ့ဆိုရင် content ကို မပြခင်ကတည်းက
      ကြိုပြင်ထားလို့လည်း ရပါတယ်။ [[mark:open-reviews]] ဒါက သုံးသပ်ချက် tab ပါ။
      [[mark:select-fetch]] promise ကို သိမ်းထားမယ့် ဒီ variable ကို ကြည့်ပါ။
      ပထမ render မှာ တစ်စက္ကန့်ခွဲ ကြာမှ data ရမယ့် promise ကို ဒီထဲ
      သိမ်းထားလို့၊ render တိုင်း promise အတူတူကိုပဲ ဖတ်ပါတယ်။
      [[mark:select-use]] component က အဲဒါကို use နဲ့ ဖတ်ပြီး၊ promise
      မပြီးမချင်း စောင့်နေပါတယ်။ [[mark:open-app-reviews]] App ထဲ ထည့်ရအောင်။
      [[mark:wire-suspense-import]] Suspense လည်း ယူပါတယ်။
      [[mark:wire-reviews-import]] ပြီးတော့ ReviewsTab ကိုပါ။
      [[mark:wire-reviews-jsx]] သူ့ကိုယ်ပိုင် Activity ထဲ ထည့်ပြီး၊ fallback
      ပါတဲ့ Suspense နဲ့ ဝိုင်းထားပါတယ်။ [[mark:explain-prerender]] page
      ပြန်ပွင့်လာပြီး၊ သုံးသပ်ချက် tab က hidden ဖြစ်နေပါတယ်။ ဒါပေမဲ့ React က
      hidden content ကိုလည်း နောက်ကွယ်မှာ render လုပ်ထားလို့၊ data တောင်းတာ
      စပြီးသွားပါပြီ။ [[mark:click-reviews]] သုံးသပ်ချက် tab ကို ဖွင့်ရအောင်။
      [[mark:after-reviews]] သုံးသပ်ချက်တွေ ချက်ချင်း ပေါ်လာပါတယ်။
      ဖျောက်ထားတုန်း data က အသင့် ဖြစ်နေပြီးသားမို့ပါ။ [[mark:urgent-note]] data
      မရောက်ခင် tab ပြောင်းမိရင်တော့ fallback ပေါ်လာပါမယ်။ startTransition နဲ့
      ပြောင်းရင်တော့ data ရောက်တဲ့အထိ tab အဟောင်းကို ဆက်ပြထားပါမယ်။
    sources:
      - title: "React — <Activity>: Pre-rendering content that’s likely to become visible"
        url: "https://react.dev/reference/react/Activity#pre-rendering-content-thats-likely-to-become-visible"
      - title: "React — use"
        url: "https://react.dev/reference/react/use"
      - title: "React — <Suspense>"
        url: "https://react.dev/reference/react/Suspense"
      - title: "React — startTransition"
        url: "https://react.dev/reference/react/startTransition"
    actions:
      - id: close-board-2
        type: whiteboard.apply
        at: { mark: close-board-2 }
        open: false
      - id: open-reviews
        type: workspace.openFile
        at: { mark: open-reviews }
        path: src/ReviewsTab.jsx
      - id: select-fetch
        type: editor.select
        at: { mark: select-fetch }
        target: { file: src/ReviewsTab.jsx, text: "let reviewsPromise = null;", occurrence: 1 }
      - id: select-use
        type: editor.select
        at: { mark: select-use }
        target: { file: src/ReviewsTab.jsx, text: "use(fetchReviews())", occurrence: 1 }
      - id: open-app-reviews
        type: workspace.openFile
        at: { mark: open-app-reviews }
        path: src/App.jsx
      - id: wire-suspense-import
        type: editor.type
        at: { mark: wire-suspense-import }
        cadence: block
        target: { file: src/App.jsx, after: "import { Activity, ", occurrence: 1 }
        text: "Suspense, "
      - id: wire-reviews-import
        type: editor.type
        at: { mark: wire-reviews-import }
        cadence: block
        target:
          { file: src/App.jsx, after: "import OrderTab from \"./OrderTab.jsx\";\n", occurrence: 1 }
        text: "import ReviewsTab from \"./ReviewsTab.jsx\";\n"
      - id: wire-reviews-jsx
        type: editor.type
        at: { mark: wire-reviews-jsx }
        cadence: block
        target:
          { file: src/App.jsx, after: "        <OrderTab />\n      </Activity>\n", occurrence: 1 }
        text: "      <Suspense fallback={<p className=\"muted\">ခဏစောင့်ပါ…</p>}>\n        <Activity mode={tab === \"reviews\" ? \"visible\" : \"hidden\"}>\n          <ReviewsTab />\n        </Activity>\n      </Suspense>\n"
      - id: expect-reviews-prerendered
        type: expect.preview
        at: { mark: click-reviews, offsetMs: -700 }
        timeoutMs: 5000
        target: { by: testId, value: reviews-tab }
        attribute: { name: style, value: "display: none !important;" }
        retry: { maxAttempts: 3, delayMs: 1000 }
      - id: click-reviews
        type: preview.click
        at: { mark: click-reviews }
        timeoutMs: 5000
        target: { by: testId, value: tab-reviews }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-reviews-shown
        type: expect.preview
        at: { afterAction: click-reviews }
        timeoutMs: 5000
        target: { by: testId, value: reviews-tab }
        textContains: "မုန့်ဟင်းခါး အရသာ ကောင်းပါတယ်"
        attribute: { name: style, value: "" }
        retry: { maxAttempts: 2, delayMs: 200 }

  # ------------------------------------------------------------------ 6
  - id: vt-idea
    chapter: "ViewTransition ဆိုတာ ဘာလဲ"
    narration: >
      အခု ဒုတိယ component ဖြစ်တဲ့ ViewTransition ပါ။ [[mark:draw-snapshots]]
      page ရဲ့ အပိုင်း တစ်ခု ပြောင်းတဲ့အခါ၊ browser က အဟောင်းနဲ့ အသစ်ကို ပုံ
      နှစ်ပုံလို ရိုက်ပြီး၊ ကြားထဲမှာ animation ထည့်ပေးနိုင်ပါတယ်။
      ViewTransition ကို သုံးရင် React က အဲဒါကို စပေးပါတယ်။
      [[mark:draw-transition-only]] React က startTransition လို Transition ထဲက
      update တွေကိုပဲ animate လုပ်ပါတယ်။ urgent update ကတော့ animation မပါဘဲ
      ချက်ချင်း ပြောင်းပါတယ်။ [[mark:draw-triggers]] animation ဖြစ်တဲ့ အခြေအနေ
      လေးမျိုး ရှိပါတယ်။ ပေါ်လာတဲ့ enter၊ ပျောက်သွားတဲ့ exit၊ အထဲက content
      ဒါမှမဟုတ် နေရာ၊ အရွယ်အစား ပြောင်းတဲ့ update နဲ့၊ name တူတဲ့ element တစ်ခုက
      တစ်နေရာမှာ ပျောက်ပြီး နောက်တစ်နေရာမှာ ပေါ်လာတဲ့ share ပါ။
      [[mark:honest-note]] ဒီ lesson က page ထဲက ပြောင်းလဲမှုတွေကိုပဲ
      ပြန်ပြတာမို့ animation ကို မမြင်ရပါဘူး၊ ကိုယ့် browser မှာ run ကြည့်မှ
      မြင်ရပါမယ်။ ဒီမှာတော့ enter animation ဖြစ်တိုင်း အပေါ်ဆုံး စာကြောင်းက
      ရေတွက်ပြပါမယ်။
    sources:
      - title: "React — <ViewTransition>"
        url: "https://react.dev/reference/react/ViewTransition"
      - title: "React — <ViewTransition>: Animation triggers"
        url: "https://react.dev/reference/react/ViewTransition#animation-triggers"
      - title: "MDN — View Transition API"
        url: "https://developer.mozilla.org/en-US/docs/Web/API/View_Transition_API"
      - title: "React 19.3"
        url: "https://react.dev/blog/2026/09/09/react-19-3"
    actions:
      - id: board-vt
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [b3-title]
      - id: draw-snapshots
        type: whiteboard.apply
        at: { mark: draw-snapshots }
        upsertIds: [b3-old-box, b3-old-text, b3-arrow, b3-new-box, b3-new-text, b3-caption]
        drawMs: 3000
      - id: draw-transition-only
        type: whiteboard.apply
        at: { mark: draw-transition-only }
        upsertIds: [b3-only, b3-only-underline, b3-only-list]
        drawMs: 2000
      - id: draw-triggers
        type: whiteboard.apply
        at: { mark: draw-triggers }
        upsertIds: [b3-triggers]
        drawMs: 1400

  # ------------------------------------------------------------------ 7
  - id: dishpanel-code
    chapter: "ViewTransition ရေးကြည့်ရအောင်"
    narration: >
      [[mark:close-board-3]] ဟင်းလျာကို တစ်ခါ တစ်ခုပဲ ပြမယ့် panel လေး
      ရေးကြည့်ရအောင်။ [[mark:open-vtcount]] ဒီ helper ကတော့ ရေးပြီးသားပါ။
      [[mark:select-vtcount]] စာသား ရေးထည့်တဲ့ ဒီ စာကြောင်းကို ကြည့်ပါ။ enter
      animation အကြိမ်ရေနဲ့၊ နောက်မှ ကြည့်မယ့် transition type ကို၊ React
      အပြင်ဘက်က အပေါ်ဆုံး စာကြောင်းထဲ ရေးပေးတာပါ။ [[mark:open-dishpanel]]
      DishPanel ဖိုင်က အခု အလွတ်ပါ၊ ဘယ်ဖိုင်ကမှ import မလုပ်ထားသေးပါဘူး။
      [[mark:type-dp-top]] panel က state နှစ်ခု မှတ်ထားပါတယ်။ panel ပွင့်နေလား
      ဆိုတာနဲ့၊ ပြမယ့် ဟင်းလျာရဲ့ မီနူးထဲက နေရာ နံပါတ်ပါ။ ဟင်းလျာကိုတော့ အဲဒီ
      နံပါတ်နဲ့ ယူပါတယ်။ [[mark:type-dp-toggle]] နောက်တစ်ခုက panel ကို
      ဖွင့်လိုက် ပိတ်လိုက် လုပ်ပေးမယ့် toggle function ပါ။
      [[mark:select-start-transition]] state ကို startTransition ထဲမှာ
      ပြောင်းတာကို ကြည့်ပါ၊ ဒါ မပါရင် animation မဖြစ်ပါဘူး။ pending ကို ပြစရာ
      မလိုလို့ useTransition မသုံးထားပါဘူး။ [[mark:type-dp-jsx]] JSX ထဲမှာ panel
      ကို ဖွင့်ပိတ်လုပ်မယ့် ခလုတ် ပါပြီး၊ သူ့အောက်မှာ panel ပွင့်နေတုန်းပဲ
      ပေါ်မယ့် အပိုင်း လာပါမယ်။ [[mark:type-dp-vt]] အဲဒါကို ViewTransition နဲ့
      ဝိုင်းပါတယ်။ HTML element တစ်ခုခုက အပြင်ကနေ ဝိုင်းထားရင် enter animation
      မဖြစ်လို့၊ condition ထဲမှာ ပထမဆုံး ထားရပါတယ်။ [[mark:type-dp-vt-rest]]
      သူ့မှာ ဟင်းလျာရဲ့ id ကို key အဖြစ် ပေးပြီး၊ onEnter handler လည်း
      ပေးထားပါတယ်။ အထဲမှာ ဟင်းလျာရဲ့ နာမည်နဲ့ ဈေးနှုန်းကို ကျပ်နဲ့ ပြပါတယ်။
      ပြီးတော့ tag အကုန် ပြန်ပိတ်လိုက်ပါတယ်။ [[mark:select-key]] ဒီ key ကြောင့်
      ဟင်းလျာ ပြောင်းတိုင်း React က card အဟောင်းကို ဖယ်ပြီး အသစ် ထည့်လို့၊
      အဟောင်းက exit၊ အသစ်က enter ဖြစ်ပါတယ်။ key မပါရင်တော့ card တစ်ခုတည်းရဲ့
      content ပဲ ပြောင်းတဲ့ update ဖြစ်ပါမယ်။ [[mark:select-onenter]] onEnter က
      enter animation စတဲ့အခါ run ပြီး၊ transition type တွေကို counter ဆီ
      ပို့ပါတယ်။ ကျန်တဲ့ အခြေအနေတွေအတွက် onExit၊ onUpdate နဲ့ onShare ရှိပါတယ်။
    sources:
      - title: "React — <ViewTransition>"
        url: "https://react.dev/reference/react/ViewTransition"
      - title: "React — <ViewTransition>: Events"
        url: "https://react.dev/reference/react/ViewTransition#view-transition-event"
      - title: "React — startTransition"
        url: "https://react.dev/reference/react/startTransition"
    actions:
      - id: close-board-3
        type: whiteboard.apply
        at: { mark: close-board-3 }
        open: false
      - id: open-vtcount
        type: workspace.openFile
        at: { mark: open-vtcount }
        path: src/vtCount.js
      - id: select-vtcount
        type: editor.select
        at: { mark: select-vtcount }
        target:
          {
            file: src/vtCount.js,
            text: 'document.getElementById("vt-count").textContent',
            occurrence: 1,
          }
      - id: open-dishpanel
        type: workspace.openFile
        at: { mark: open-dishpanel }
        path: src/DishPanel.jsx
      - id: type-dp-top
        type: editor.type
        at: { mark: type-dp-top }
        cadence: line-by-line
        target: { file: src/DishPanel.jsx, after: "", occurrence: 1 }
        text: "import { ViewTransition, startTransition, useState } from \"react\";\nimport { menu } from \"./menu.js\";\nimport { countEnter } from \"./vtCount.js\";\n\nexport default function DishPanel() {\n  const [open, setOpen] = useState(false);\n  const [index, setIndex] = useState(0);\n  const dish = menu[index];\n"
      - id: type-dp-toggle
        type: editor.type
        at: { mark: type-dp-toggle }
        cadence: line-by-line
        target: { file: src/DishPanel.jsx, after: "  const dish = menu[index];\n", occurrence: 1 }
        text: "\n  function toggle() {\n    startTransition(() => {\n      setOpen(!open);\n    });\n  }\n"
      - id: select-start-transition
        type: editor.select
        at: { mark: select-start-transition }
        target:
          {
