      ထပ်ဖွင့်ရအောင်။ [[mark:after-open-2]] အရေအတွက်က 1 ကနေ ပြန်စပြီး၊ type
      မရှိပါဘူး။ [[mark:click-next-1]] နောက်တစ်ခုကို နှိပ်ရအောင်။
      [[mark:after-next-1]] ရှမ်းခေါက်ဆွဲ ပေါ်လာပြီး၊ type က next ပါ။
      [[mark:click-next-2]] ထပ်နှိပ်ရအောင်။ [[mark:after-next-2]] enter
      animation 3 ကြိမ် ဖြစ်သွားပါပြီ၊ ဒီတစ်ခါလည်း type က next ပါ။
      [[mark:click-prev]] အရင်တစ်ခုကို နှိပ်ရအောင်။ [[mark:after-prev]]
      ရှမ်းခေါက်ဆွဲ ပြန်ပေါ်လာပြီး၊ type က previous ပါ။ [[mark:board-types]]
      ဒါဆို type က ဘာ ပြောင်းလိုက်တာလဲ။ [[mark:draw-types]] next ရော previous
      ရော ပြောင်းတာက ဟင်းလျာ နံပါတ် state တစ်ခုတည်းပါ။ ရှေ့သွားလား နောက်ပြန်လား
      ဆိုတာကို type ကပဲ ခွဲပေးလို့၊ တစ်ခုစီမှာ ကိုယ်ပိုင် animation
      ရှိနိုင်ပါတယ်။ [[mark:draw-key]] key ကြောင့် exit ရော enter ရော ဖြစ်ပါတယ်။
      [[mark:draw-default]] default ကို none ထားမိရင်တော့ panel ဖွင့်တာလို type
      မပါတဲ့ Transition တွေမှာ animation မဖြစ်တော့ပါဘူး။ ဒါကြောင့် ဒီမှာ default
      ကို auto ထားခဲ့တာပါ။
    sources:
