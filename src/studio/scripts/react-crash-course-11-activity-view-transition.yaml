build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 11211

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  # ------------------------------------------------------------------ 1
  - id: activity-idea
    chapter: "Activity ဆိုတာ ဘာလဲ"
    narration: >
      ဒီ lesson မှာ component အသစ် နှစ်ခုကို လေ့လာပါမယ်။ Activity ဆိုတာ UI
      အပိုင်းကို ဖျက်မပစ်ဘဲ ဖျောက်ထားပြီး၊ state ကို မှတ်ထားပေးတဲ့ component ပါ။
      ViewTransition ကတော့ UI ပြောင်းတဲ့အခါ animation လေး ထည့်ပေးတဲ့ component
      ပါ။ [[mark:start-server]] ရှင်းပြနေတုန်း dev server ကို နောက်ကွယ်မှာ စ run
      ထားလိုက်ရအောင်။ [[mark:draw-conditional]] tab တွေထဲက တစ်ခုကိုပဲ ပြချင်ရင်၊
      condition နဲ့ ရေးလေ့ ရှိပါတယ်။ ဒါပေမဲ့ tab ပြောင်းတာနဲ့ React က အဲဒီ
      component ကို ဖျက်ပစ်လို့၊ ရေးလက်စ မှတ်ချက်လို state တွေ ပျောက်သွားပါတယ်။
      [[mark:draw-activity]] Activity ကို hidden mode နဲ့ သုံးရင်တော့၊ React က
      content ကို CSS နဲ့ ဖျောက်ထားရုံပါပဲ။ state ရော DOM ပါ ကျန်နေပါတယ်။
      [[mark:draw-effects]] ဒါပေမဲ့ ဖျောက်ထားတုန်း React က Effect တွေရဲ့ cleanup
      ကို run လိုက်လို့၊ timer လို အရာတွေ ရပ်နေပါတယ်။ [[mark:draw-versions]]
      နှစ်ခုလုံးကို React team က 2025 ဧပြီလမှာ စပြီး မိတ်ဆက်ခဲ့ပါတယ်။ Activity က
      React 19.2 မှာ၊ ViewTransition က React 19.3 မှာ stable ဖြစ်လာခဲ့ပါတယ်။
    sources:
      - title: "React — <Activity>"
        url: "https://react.dev/reference/react/Activity"
      - title: "React Labs: View Transitions, Activity, and more (April 2025)"
        url: "https://react.dev/blog/2025/04/23/react-labs-view-transitions-activity-and-more"
      - title: "React 19.2"
        url: "https://react.dev/blog/2025/10/01/react-19-2"
      - title: "React 19.3"
        url: "https://react.dev/blog/2026/09/09/react-19-3"
      - title: "Vite — Getting Started"
        url: "https://vite.dev/guide/"
    actions:
      - id: open-board-1
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [b1-title]
      - id: start-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 45000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-conditional
        type: whiteboard.apply
        at: { mark: draw-conditional }
        upsertIds: [b1-cond-box, b1-cond-code, b1-cond-l1, b1-cond-l2, b1-cond-l3]
        drawMs: 2600
      - id: draw-activity
        type: whiteboard.apply
        at: { mark: draw-activity }
        upsertIds: [b1-act-box, b1-act-code, b1-act-l1, b1-act-l2]
        drawMs: 2200
      - id: draw-effects
        type: whiteboard.apply
        at: { mark: draw-effects }
        upsertIds: [b1-act-l3, b1-act-underline]
        drawMs: 1400
      - id: draw-versions
        type: whiteboard.apply
        at: { mark: draw-versions }
        upsertIds: [b1-versions]
        drawMs: 1200

  # ------------------------------------------------------------------ 2
  - id: tabs-code
    narration: >
      [[mark:close-board-1]] editor ထဲ ပြန်သွားရအောင်။ App မှာ tab ခလုတ်
      သုံးခုပဲ ရှိပြီး၊ tab content တွေကို မပြရသေးပါဘူး။
      [[mark:select-tab-state]] ရွေးထားတဲ့ tab ကို ဒီ state ထဲမှာ မှတ်ထားပြီး၊
      ခလုတ်တွေက အဲဒါကို ပြောင်းပေးပါတယ်။ [[mark:open-order-tab]] မှာမယ် ခလုတ်နဲ့
      ဖွင့်မယ့် order tab ကတော့ ရေးပြီးသားပါ။ [[mark:select-note-state]] သူက
      ဧည့်သည်ရဲ့ မှတ်ချက်ကို state ထဲမှာ သိမ်းထားပါတယ်။
      [[mark:select-timer-effect]] ပြီးတော့ Effect က စက္ကန့်တိုင်း
      စောင့်ချိန်ကို တိုးပေးမယ့် timer ကို စပြီး၊ cleanup က အဲဒီ timer ကို
      ရပ်ပေးပါတယ်။ timer run နေလား ဆိုတာကိုလည်း စစ်ကြည့်နိုင်အောင် element
      ပေါ်မှာ မှတ်ထားပါတယ်။ [[mark:open-app-activity]] App ဆီ ပြန်ရအောင်။
      [[mark:wire-activity-import]] Activity ကို ယူပါတယ်။
      [[mark:wire-tab-imports]] ပြီးတော့ tab နှစ်ခုကိုပါ။
      [[mark:wire-activity-jsx]] tab တစ်ခုစီကို သူ့ကိုယ်ပိုင် Activity ထဲ
      ထည့်ပါတယ်။ [[mark:select-mode]] ဒီ mode ကို ကြည့်ပါ။ order tab ကို
      ရွေးထားရင် visible၊ မရွေးထားရင် hidden ဖြစ်ပါတယ်။ tab နှစ်ခုလုံး page
      ထဲမှာ အမြဲ ရှိနေပါတယ်။
    sources:
      - title: "React — <Activity>: Restoring the state of hidden components"
        url: "https://react.dev/reference/react/Activity#restoring-the-state-of-hidden-components"
      - title: "React — useEffect"
        url: "https://react.dev/reference/react/useEffect"
      - title: "MDN — setInterval()"
        url: "https://developer.mozilla.org/en-US/docs/Web/API/Window/setInterval"
      - title: "MDN — HTMLElement.dataset"
        url: "https://developer.mozilla.org/en-US/docs/Web/API/HTMLElement/dataset"
    actions:
      - id: close-board-1
        type: whiteboard.apply
        at: { mark: close-board-1 }
        open: false
      - id: collapse-dock-early
        type: runtime.collapseDock
        at: { afterAction: close-board-1 }
      - id: open-app-tour
        type: workspace.openFile
        at: { mark: close-board-1, offsetMs: 400 }
        path: src/App.jsx
      - id: select-tab-state
        type: editor.select
        at: { mark: select-tab-state }
        target:
          { file: src/App.jsx, text: 'const [tab, setTab] = useState("menu");', occurrence: 1 }
      - id: open-order-tab
        type: workspace.openFile
        at: { mark: open-order-tab }
        path: src/OrderTab.jsx
      - id: select-note-state
        type: editor.select
        at: { mark: select-note-state }
        target:
          { file: src/OrderTab.jsx, text: 'const [note, setNote] = useState("");', occurrence: 1 }
      - id: select-timer-effect
        type: editor.select
        at: { mark: select-timer-effect }
        target:
          {
            file: src/OrderTab.jsx,
            text: "  useEffect(() => {\n    const label = timerRef.current;\n    label.dataset.timer = \"on\";\n    const id = setInterval(() => {\n      setSeconds((s) => s + 1);\n    }, 1000);\n    return () => {\n      clearInterval(id);\n      label.dataset.timer = \"off\";\n    };\n  }, []);\n",
            occurrence: 1,
          }
      - id: open-app-activity
        type: workspace.openFile
        at: { mark: open-app-activity }
        path: src/App.jsx
      - id: wire-activity-import
        type: editor.type
        at: { mark: wire-activity-import }
        cadence: block
        target: { file: src/App.jsx, after: "import { ", occurrence: 1 }
        text: "Activity, "
      - id: wire-tab-imports
        type: editor.type
        at: { mark: wire-tab-imports }
        cadence: block
        target:
          { file: src/App.jsx, after: "import { Header } from \"./Header.jsx\";\n", occurrence: 1 }
        text: "import MenuTab from \"./MenuTab.jsx\";\nimport OrderTab from \"./OrderTab.jsx\";\n"
      - id: wire-activity-jsx
        type: editor.type
        at: { mark: wire-activity-jsx }
        cadence: block
        target: { file: src/App.jsx, after: "      </nav>\n", occurrence: 1 }
        text: "      <Activity mode={tab === \"menu\" ? \"visible\" : \"hidden\"}>\n        <MenuTab />\n      </Activity>\n      <Activity mode={tab === \"order\" ? \"visible\" : \"hidden\"}>\n        <OrderTab />\n      </Activity>\n"
      - id: select-mode
        type: editor.select
        at: { mark: select-mode }
        target:
          {
            file: src/App.jsx,
            text: 'mode={tab === "order" ? "visible" : "hidden"}',
            occurrence: 1,
          }

  # ------------------------------------------------------------------ 3
  - id: activity-state
    narration: >
      [[mark:preview-opens]] dev server အသင့် ဖြစ်နေပြီမို့ preview
      ဖွင့်လိုက်ရအောင်။ [[mark:click-order]] မှာမယ် tab ကို ဖွင့်ရအောင်။
      [[mark:after-order]] timer က 0 ကနေ စပါတယ်။ ဘာကြောင့် 0 ကနေ စလဲ ဆိုတာ ခဏနေ
      ကြည့်ပါမယ်။ [[mark:type-note]] မီးဖိုချောင်အတွက် မှတ်ချက် ရေးကြည့်ရအောင်။
      timer ရဲ့ နံပါတ်ကိုလည်း မှတ်ထားပါ။ [[mark:click-menu]] ကဲ၊ မီနူး tab ကို
      ပြန်သွားရအောင်။ [[mark:after-menu]] မှာမယ် tab က screen ပေါ်က
      ပျောက်သွားပေမယ့်၊ page ထဲမှာတော့ ရှိနေတုန်းပါ။ [[mark:click-order-again]]
      မှာမယ် tab ကို ပြန်ဖွင့်ရအောင်။ [[mark:after-return]] React က state ကို
      မဖျက်ခဲ့လို့၊ မှတ်ချက်က ရှိနေတုန်းပါ။
    sources:
      - title: "React — <Activity>: Restoring the state of hidden components"
        url: "https://react.dev/reference/react/Activity#restoring-the-state-of-hidden-components"
      - title: "React — <Activity>: Restoring the DOM of hidden components"
        url: "https://react.dev/reference/react/Activity#restoring-the-dom-of-hidden-components"
      - title: "MDN — display"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/display"
    actions:
      - id: wait-for-server
        type: runtime.waitForReady
        at: { mark: preview-opens }
        timeoutMs: 20000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-server }
        timeoutMs: 15000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-menu-tab
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: menu-tab }
        textContains: "မုန့်ဟင်းခါး"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: collapse-dock
        type: runtime.collapseDock
        at: { afterAction: expect-menu-tab }
      - id: click-order
        type: preview.click
        at: { mark: click-order }
        timeoutMs: 5000
        target: { by: testId, value: tab-order }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-timer-zero
        type: expect.preview
        at: { afterAction: click-order }
        timeoutMs: 5000
        target: { by: testId, value: order-timer }
        textContains: "– 0 စက္ကန့်"
        retry: { maxAttempts: 3, delayMs: 150 }
      - id: expect-order-shown
        type: expect.preview
        at: { mark: after-order }
        timeoutMs: 5000
        target: { by: testId, value: order-tab }
        attribute: { name: style, value: "" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-note
        type: preview.input
        at: { mark: type-note }
        timeoutMs: 5000
        target: { by: testId, value: order-note }
        value: "ငရုတ်သီး နည်းနည်းပဲ"
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-note
        type: expect.preview
        at: { afterAction: type-note }
        timeoutMs: 5000
        target: { by: testId, value: order-note }
        value: "ငရုတ်သီး နည်းနည်းပဲ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: click-menu
        type: preview.click
        at: { mark: click-menu }
        timeoutMs: 5000
        target: { by: testId, value: tab-menu }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-order-hidden
        type: expect.preview
        at: { mark: after-menu }
        timeoutMs: 5000
        target: { by: testId, value: order-tab }
        attribute: { name: style, value: "display: none !important;" }
