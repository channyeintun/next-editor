  # ------------------------------------------------------------------ 4
  - id: activity-effects
    narration: >
      [[mark:watch-timer]] timer ကလည်း ခုနက နံပါတ်ကနေ ဆက်ရေနေပါတယ်။
      ဖျောက်ထားတုန်းက မရေတွက်ခဲ့ပါဘူး။ [[mark:board-effects]] ဘာကြောင့်လဲ။
      [[mark:draw-row-visible]] tab ပေါ်နေတုန်း Effect ထဲက timer က စက္ကန့်တွေကို
      တိုးပါတယ်။ [[mark:draw-row-hidden]] hidden ဖြစ်သွားတော့ React က cleanup
      ကို run လိုက်လို့ timer ရပ်သွားပါတယ်။ ဒါပေမဲ့ state ကတော့ ကျန်နေပါတယ်။
      [[mark:draw-row-back]] ပြန်ပေါ်လာတော့ Effect ပြန် run ပြီး ဆက်ရေပါတယ်။
      [[mark:draw-initial]] အစကတည်းက hidden ဖြစ်နေတဲ့ tab ဆိုရင်တော့၊ ပြလိုက်မှ
      Effect က ပထမဆုံး run ပါတယ်။ ဒါကြောင့် timer က 0 ကနေ စခဲ့တာပါ။
    sources:
      - title: "React — <Activity>: My hidden components have Effects that aren’t running"
        url: "https://react.dev/reference/react/Activity#my-hidden-components-have-effects-that-arent-running"
      - title: "React — Synchronizing with Effects: How to handle the Effect firing twice"
        url: "https://react.dev/learn/synchronizing-with-effects#how-to-handle-the-effect-firing-twice-in-development"
    actions:
      - id: expect-timer-running
        type: expect.preview
        at: { mark: watch-timer }
        timeoutMs: 5000
        target: { by: testId, value: order-timer }
