# CSS course (Burmese), lesson 6 of 43: specificity.
#
# Narration is Burmese (voice-script.md next to this file is its source, and
# DESIGN.md is the span-by-span brief). Every [[mark:…]] sits where its
# action begins, at a sentence end; each span carries one piece of meaning.
# Everything the learner sees (title, chapters, whiteboard labels, UI strings)
# is Burmese too.
#
# Shape: board (recall lesson 5's cascade steps, circle specificity, the open
# question: why did the class beat a later button rule?) → code tour (header
# ID, nav classes, card order buttons, the teal inline-styled call button) →
# the class-vs-type hook live → board (the ID | class | element scoreboard,
# what each column counts, compare from the left, 1,0,0 > 0,11,0) → card
# titles: a gold rule loses a tie to a later brown rule, then wins after a
# second class is added → board (the tie and the sum) → header links: an ID
# rule beats a later two-class rule → board (1,0,1 vs 0,2,0, the :where plan)
# → :where() wraps the ID live, the active link turns gold (a small board
# shows the [id=…] alternative) → :is() with an ID in its list beats a later
# plain rule → board (is/not/has = strongest argument, where = 0, nth-child of
# S) → :not() turns the normal cards black and white and a later plain card
# rule cannot undo it → the inline style and !important →
# board (habits: single classes, :where, layers; avoid IDs, !important and
# doubled classes; DOM distance never counts; tools) → recap, hand-off to
# inheritance (lesson 7).
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set(; no postcss config; no index.html
# edit, no click. Colour keywords have no valid prefix (sienna, gray,
# darkgoldenrod, saddlebrown, white, gold, green, red), the filter goes from
# none straight to grayscale(1) when its "(" lands at the end of the file
# (measured) and "none" has no valid prefix, and every rule with an opening
# bracket is appended at the end of the file except the :where( wrap: its
# opening part is one block insert (all three links show their plain base
# colour while the narration says so) and its ")" follows at its own mark.
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
