      # base.css: sections A, B, B2 and the part of C this page uses, minus
      # every declaration the lesson fights over: no background or text colour
      # on .order-btn (typed), no .site-header a colour (the links start in
      # the plain base link colour so the ID rule has a job), and no colour
      # on .menu-card .desc (so the :is demo competes only with typed rules).
      base.css: |
        /*
          base.css: pinned, never typed during a lesson.
          The shop's palette and the page furniture. Lesson 6 keeps sections A,
          B, B2 and the header, menu, card and button furniture of section C,
          without the button colours, the header link colour and the card
          description colour (the lesson's own rules set those).
        */

        /* == A. palette == */
        :root {
          color-scheme: light;
          --tea-dark: #3b2314;
          --tea: #8b5a2b;
          --tea-light: #c9a27e;
          --cream: #fff8ec;
          --paper: #fdf3e1;
          --leaf: #2f6b3a;
          --gold: #c9a227;
          --chili: #b23a2b;
          --ink: #2b1d14;
          --muted: #6b5a4c;
          --line: #e6d5bf;
          --radius: 12px;
        }

        /* == B. page == */
        body {
          margin: 0;
          font-family: "Noto Sans Myanmar", "Myanmar Sangam MN", "Myanmar MN", "Myanmar Text", "Padauk",
            system-ui, sans-serif;
          font-size: 16px;
          line-height: 1.8;
          color: var(--ink);
          background: var(--paper);
        }

        .page {
          padding: 0 16px 24px;
        }

        h1,
        h2,
        h3 {
          margin: 0 0 8px;
          line-height: 1.5;
        }

        h1 {
          font-size: 24px;
        }

        h2 {
          font-size: 20px;
        }

        h3 {
          font-size: 17px;
        }

        a {
          color: var(--tea);
        }

        .visually-hidden {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip-path: inset(50%);
          white-space: nowrap;
        }

        /* == B2. reset == */
        *,
        *::before,
        *::after {
          box-sizing: border-box;
        }

        /* == C. furniture (header, menu, cards, buttons) == */
        .site-header {
          padding: 16px;
          background: var(--tea-dark);
          color: var(--cream);
        }

        .logo {
          display: block;
        }

        .tagline {
          margin: 0;
          color: var(--tea-light);
          font-size: 14px;
        }

        .nav ul {
          margin: 8px 0 0;
          padding: 0;
          list-style: none;
        }

        .menu-section {
          margin-top: 16px;
        }

        .menu {
          margin: 0;
          padding: 0;
          list-style: none;
        }

        .menu-card {
          margin: 0 0 12px;
          padding: 12px 16px;
          background: #fff;
          border: 1px solid var(--line);
          border-radius: var(--radius);
        }

        .menu-card .name,
        .menu-card .desc {
          margin: 0;
        }

        .menu-card .desc {
          font-size: 14px;
        }

        .price {
          font-weight: 700;
          color: var(--tea);
        }

        .badge {
          padding: 0 8px;
          border-radius: 999px;
          background: var(--leaf);
          color: #fff;
          font-size: 13px;
        }

        .order-btn {
          display: inline-block;
          margin-left: 8px;
          padding: 6px 16px;
          border: 0;
          border-radius: 999px;
          font: inherit;
        }

        /* == E. lesson rules == */
        /* Lesson 6: none. */
