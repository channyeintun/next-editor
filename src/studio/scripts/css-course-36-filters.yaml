# CSS course (Burmese), lesson 36 of 43: filters.
#
# Narration is an ENGLISH DRAFT for the Burmese writer (DESIGN.md next to this
# file is the span-by-span brief). Every [[mark:…]] sits where its action
# begins, at a sentence end; each span carries one piece of meaning.
# Everything the learner sees (title, chapters, whiteboard labels, UI strings)
# is Burmese already.
#
# Shape: board (recall lesson 35; the frosted "today's special" card is the
# goal; filter vs backdrop filter) → code tour (photo with the promo card on
# it, three thumbnails, a teal badge, a small night card, four SVG cups) →
# photo: grayscale 1, 0.5, sepia, none → thumbnails: brightness, contrast,
# saturate → board (colour wheel) → badge: hue-rotate 90 then 180 → night
# card: invert (not a dark mode) → cups 1 and 2: drop-shadow + hue-rotate in
# both orders → board (left-to-right pipeline, invalid function drops all,
# opacity()) → cups 3 and 4: box-shadow vs drop-shadow (no spread / inset,
# chained drop shadows) → board (SVG filter through url(#id), explained only)
# → the whole figure blurs (text too), stacking context / containing block,
# then none → promo: backdrop-filter alone shows nothing (opaque background),
# then a 35 % white background makes frosted glass; support + readable
# fallback → quiz + recap, hand-off to blend modes (lesson 37).
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set(; no postcss config; no reload,
# no HTML edit, no clicks. A keystroke-typed function has an unclosed "(" until
# its ")", and an unclosed function swallows the rest of the stylesheet, so
# every keystroke edit that contains "(" lands in the LAST rule of the file;
# the two edits into earlier rules (filter: none on the photo image, and on the
# figure) contain no parentheses.
#
# Measured in headless Chrome at 432 × 720 (probe/stages.ts, same anchors):
# h2 16–46, photo 400 × 250 at y 54 (promo card 210 × 67 at 28,146 over the
# photo's cups and table), caption 304, thumbnails 341 (three 120 × 75),
# badge 432, night card 485 (400 × 80), cups 585 (four 64 × 64 boxes); the
# whole page fits in 720 px, document 720 tall at every stage. Screenshots in
# probe/.
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
