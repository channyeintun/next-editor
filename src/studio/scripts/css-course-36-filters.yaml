build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 4136

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  - id: filters-intro
    chapter: "Filter ဆိုတာ ဘာလဲ"
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ clip path နဲ့ box တွေကို ပုံသဏ္ဌာန် ဖြတ်ခဲ့ပြီး၊ mask နဲ့
      ဖြည်းဖြည်း မှိန်သွားအောင် လုပ်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ filter နဲ့ pixel
      တွေကိုယ်တိုင်ကို ပြောင်းပါမယ်။ ဓာတ်ပုံ ပြင်တဲ့ app တွေထဲက effect တွေလိုပါပဲ။ ဒါပေမဲ့
      browser က page ပေါ်မှာ တိုက်ရိုက် လုပ်ပေးတာ ဖြစ်လို့၊ ပုံ ဖိုင်ကတော့ ဘာမှ မပြောင်းပါဘူး။
      [[mark:start-server]] ဒီလို ပြောနေတုန်းမှာပဲ၊ board နောက်မှာ dev server ကို စ နေပါပြီ။
      [[mark:draw-goal]] ဒီနေ့ ရည်မှန်းချက်ကို ကြည့်ရအောင်။ ဆိုင်ရဲ့ ဓာတ်ပုံပေါ်မှာ ယနေ့ အထူး
      လို့ ရေးထားတဲ့ card သေးသေး တစ်ခု ရှိပါတယ်။ [[mark:draw-glass]] အဲဒီ card ကို မှန်ဝါးလို
      ဖြစ်စေချင်ပါတယ်။ card နောက်က ဓာတ်ပုံက ဝါးနေပေမယ့်၊ card ပေါ်က စာသားကတော့ ပြတ်ပြတ်သားသား
      ကျန်နေရပါမယ်။ [[mark:draw-filter]] property နှစ်ခု သုံးပါမယ်။ filter က element ကို
      ဝါးအောင်၊ အဖြူအမည်း ဖြစ်အောင် လုပ်ပေးပြီး၊ သူ့ထဲက စာသား အပါအဝင် element တစ်ခုလုံးကို
      ပြောင်းပါတယ်။ [[mark:draw-backdrop]] backdrop filter ကတော့ element ကိုယ်တိုင် မဟုတ်ဘဲ၊
      သူ့ နောက်က အရာကိုပဲ ပြောင်းပါတယ်။ [[mark:draw-functions]] property နှစ်ခုလုံးက blur၊
      grayscale၊ brightness လို filter function တွေကို တူတူ ယူပါတယ်။ ဆိုင်ရဲ့ page ပေါ်မှာ
      တစ်ခုချင်း စမ်းကြည့်ပြီး၊ နောက်ဆုံးမှာ မှန်ဝါး card ကို လုပ်ကြည့်ရအောင်။
    sources:
      - title: "web.dev Learn CSS — Filters"
        url: "https://web.dev/learn/css/filters"
      - title: "web.dev Learn CSS — Shadows (filter: drop-shadow)"
        url: "https://web.dev/learn/css/shadows#drop_shadow"
      - title: "MDN — filter"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/filter"
      - title: "MDN — backdrop-filter"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/backdrop-filter"
    actions:
      - id: open-goal-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      # Runs in the background (boot + pnpm install + spawn); waitForReady sits
      # on the preview mark in the code tour, well over 40 s of narration later.
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 45000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-goal
        type: whiteboard.apply
        at: { mark: draw-goal }
        upsertIds: [a-photo, a-photo-l, a-card, a-card-l]
        drawMs: 2400
      - id: draw-glass
        type: whiteboard.apply
        at: { mark: draw-glass }
        upsertIds: [a-behind, a-sharp]
        drawMs: 1800
      - id: draw-filter
        type: whiteboard.apply
        at: { mark: draw-filter }
        upsertIds: [a-filter]
        drawMs: 1400
      - id: draw-backdrop
        type: whiteboard.apply
        at: { mark: draw-backdrop }
        upsertIds: [a-backdrop]
        drawMs: 1400
      - id: draw-functions
        type: whiteboard.apply
        at: { mark: draw-functions }
        upsertIds: [a-funcs]
        drawMs: 1400

  - id: code-tour
    narration: >
      [[mark:close-goal-board]] page ကို ကြည့်ရအောင်။ [[mark:open-index]] ဒါက HTML ဖိုင်ပါ။
      [[mark:select-photo]] အပေါ်ဆုံးမှာ ဆိုင်ရဲ့ ဓာတ်ပုံ ရှိပြီး၊ figure ထဲမှာ ပုံ
      ထည့်ထားပါတယ်။ [[mark:select-promo]] ယနေ့ အထူး card ကတော့ ဓာတ်ပုံရဲ့ အပေါ်မှာ တင်ထားတဲ့
      စာပိုဒ် တစ်ခုပါ။ အခုတော့ သူ့ နောက်ခံက ဖောက်မမြင်ရတဲ့ နို့နှစ်ရောင် ဖြစ်နေပါသေးတယ်။
      [[mark:select-thumbs]] ဓာတ်ပုံ အောက်မှာ အဲဒီ ပုံကိုပဲ သေးသေးလေး သုံးပုံ ထပ်ထည့်ထားပါတယ်။
      [[mark:select-badge]] အစိမ်းပြာရောင် badge လည်း ရှိပါတယ်။ [[mark:select-night]] ပြီးတော့
      ပုံ၊ နာမည်နဲ့ ဈေးနှုန်း ပါတဲ့ card သေးသေး တစ်ခုပါ။ [[mark:select-cups]] အောက်ဆုံးမှာ SVG
      နဲ့ ဆွဲထားတဲ့ လက်ဖက်ရည် ခွက် လေးခု ရှိပါတယ်။ ခွက် တစ်ခုစီက စတုရန်း box တစ်ခုထဲမှာ
      ရှိပြီး၊ ခွက်ရဲ့ ပတ်လည်မှာ box က ဖောက်ထွင်း မြင်ရပါတယ်။ [[mark:open-styles]] CSS
      ဖိုင်ကတော့ အလွတ်ပါ။ [[mark:preview-opens]] preview ပွင့်လာပါပြီ။ filter ဘာမှ
      မပေးရသေးလို့၊ ပုံတိုင်းက သူ့ မူလ အရောင်အတိုင်း ပေါ်နေပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Filters"
        url: "https://web.dev/learn/css/filters"
      - title: "MDN — filter (initial value none)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/filter"
    actions:
      - id: close-goal-board
        type: whiteboard.apply
        at: { mark: close-goal-board }
        open: false
      - id: open-index
        type: workspace.openFile
        at: { mark: open-index }
        path: index.html
      - id: select-photo
        type: editor.select
        at: { mark: select-photo }
        target: { file: index.html, text: '<figure class="photo">', occurrence: 1 }
      - id: select-promo
        type: editor.select
        at: { mark: select-promo }
        target: { file: index.html, text: '<p class="promo" data-testid="promo">', occurrence: 1 }
      - id: select-thumbs
        type: editor.select
        at: { mark: select-thumbs }
        target:
          { file: index.html, text: '<div class="thumbs" data-testid="thumbs">', occurrence: 1 }
      - id: select-badge
        type: editor.select
        at: { mark: select-badge }
        target:
          {
            file: index.html,
            text: '<span class="badge" data-testid="entry-badge">',
            occurrence: 1,
          }
      - id: select-night
        type: editor.select
        at: { mark: select-night }
        target:
          {
            file: index.html,
            text: '<div class="menu-card night" data-testid="night">',
            occurrence: 1,
          }
      - id: select-cups
        type: editor.select
        at: { mark: select-cups }
        target: { file: index.html, text: '<div class="cups" data-testid="cups">', occurrence: 1 }
      - id: open-styles
        type: workspace.openFile
        at: { mark: open-styles }
        path: styles.css
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { mark: preview-opens }
        timeoutMs: 20000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-dev-server }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-photo
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: photo-teahouse }
        attribute: { name: alt, value: "ဆိုင်အတွင်းပိုင်း" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-promo
        type: expect.preview
        at: { afterAction: expect-photo }
        timeoutMs: 5000
        target: { by: testId, value: promo }
        textContains: "ယနေ့ အထူး"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-cups
        type: expect.preview
        at: { afterAction: expect-promo }
        timeoutMs: 5000
        target: { by: testId, value: cup-d }
        attribute: { name: class, value: "cup-d" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: collapse-runner-dock
        type: runtime.collapseDock
        at: { afterAction: expect-cups }

  - id: grayscale
    chapter: "ပုံကို အဖြူအမည်း လုပ်ရအောင်"
    narration: >
      [[mark:type-gray]] ဓာတ်ပုံကနေ စကြည့်ရအောင်။ filter property က filter function တွေကို
      စာရင်းလိုက် ယူပါတယ်။ ပုံကို grayscale function တစ်ခုတည်း ပေးပြီး၊ ပမာဏကို 1 ထားပါမယ်။
      ဓာတ်ပုံကို လိုက်ကြည့်ပါ။ [[mark:after-gray]] ဓာတ်ပုံက မီးခိုးရောင် ဖြစ်သွားပါပြီ။
      အရောင်တွေ ပျောက်သွားပေမယ့်၊ အလင်းနဲ့ အမှောင်တော့ ကျန်နေပါသေးတယ်။
      [[mark:select-gray-one]] ဒီ 1 ကို ကြည့်ပါ။ filter function အများစုက ပမာဏကို ဂဏန်း
      ဒါမှမဟုတ် ရာခိုင်နှုန်းနဲ့ ယူပြီး၊ 1 နဲ့ 100 ရာခိုင်နှုန်းက အတူတူပါပဲ။ grayscale မှာ 0
      ဆိုရင် ဘာမှ မပြောင်းဘဲ၊ 1 ဆိုရင် အပြည့် ဖြစ်ပါတယ်။ 1 ထက် များရင်လည်း 1 လို့ပဲ ယူပြီး၊
      ပမာဏ လုံးဝ မရေးရင်လည်း အပြည့် ရပါတယ်။ [[mark:type-half]] သူ့အောက်မှာ ပမာဏ တစ်ဝက်နဲ့
      ဒုတိယ declaration တစ်ခု ထပ်ထည့်ကြည့်ရအောင်။ [[mark:after-half]] နောက်မှ ရေးတဲ့
      declaration က နိုင်လို့၊ ဓာတ်ပုံက တစ်ဝက်ပဲ မီးခိုးရောင် ဖြစ်တော့ပါတယ်။ အရောင်တွေ
      ရှိနေပေမယ့် ဖျော့နေပါတယ်။ [[mark:type-sepia]] နောက်တစ်ခုက အညိုရောင် နွေးနွေး ပေးတဲ့
      sepia function ပါ။ [[mark:after-sepia]] အခု နှစ်ပေါင်းများစွာက ရန်ကုန် ဓာတ်ပုံဟောင်း
      တစ်ပုံလို ဖြစ်သွားပါပြီ။ [[mark:type-none]] filter ရဲ့ initial value က none ပါ။ အဲဒါကို
      နောက်ဆုံးမှာ ရေးကြည့်ရအောင်။ [[mark:after-none]] none က filter အားလုံးကို ပိတ်ပေးလို့၊
      ဓာတ်ပုံရဲ့ အရောင်တွေ ပြန်ရောက်လာပါပြီ။
    sources:
      - title: "web.dev Learn CSS — Filters: the filter property"
        url: "https://web.dev/learn/css/filters#the_filter_property"
      - title: "web.dev Learn CSS — Filters: grayscale"
        url: "https://web.dev/learn/css/filters#grayscale"
      - title: "web.dev Learn CSS — Filters: sepia"
        url: "https://web.dev/learn/css/filters#sepia"
      - title: "MDN — grayscale() (0 to 1 or a percentage; values over 100% are clamped; default 1)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/filter-function/grayscale"
      - title: "MDN — sepia()"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/filter-function/sepia"
      - title: "Filter Effects Module Level 1 — filter functions"
        url: "https://drafts.fxtf.org/filter-effects-1/#filter-functions"
    actions:
      - id: type-gray
        type: editor.type
        at: { mark: type-gray }
        cadence: fast-explainer
        target: { file: styles.css, after: "", occurrence: 1 }
        text: ".photo img {\n  filter: grayscale(1);\n}\n"
      - id: expect-gray
        type: expect.preview
        at: { mark: after-gray }
        timeoutMs: 4000
        target: { by: testId, value: photo-teahouse }
        attribute: { name: alt, value: "ဆိုင်အတွင်းပိုင်း" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-gray-one
        type: editor.select
        at: { mark: select-gray-one }
        target: { file: styles.css, text: "grayscale(1)", occurrence: 1 }
      - id: type-half
        type: editor.type
        at: { mark: type-half }
        cadence: fast-explainer
        target: { file: styles.css, after: "  filter: grayscale(1);\n", occurrence: 1 }
        text: "  filter: grayscale(0.5);\n"
      - id: expect-half
        type: expect.preview
        at: { mark: after-half }
        timeoutMs: 4000
        target: { by: testId, value: gallery }
        textContains: "ဆိုင်အတွင်း"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-sepia
        type: editor.type
        at: { mark: type-sepia }
        cadence: fast-explainer
        target: { file: styles.css, after: "  filter: grayscale(0.5);\n", occurrence: 1 }
        text: "  filter: sepia(1);\n"
      - id: expect-sepia
        type: expect.preview
        at: { mark: after-sepia }
        timeoutMs: 4000
        target: { by: testId, value: photo-teahouse }
        attribute: { name: src, value: "/teahouse.svg" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-none
        type: editor.type
        at: { mark: type-none }
        cadence: fast-explainer
        target: { file: styles.css, after: "  filter: sepia(1);\n", occurrence: 1 }
        text: "  filter: none;\n"
      - id: expect-none
        type: expect.preview
        at: { mark: after-none }
        timeoutMs: 4000
        target: { by: testId, value: promo }
        textContains: "1,500 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: tones
    chapter: "Brightness၊ contrast နဲ့ saturate"
    narration: >
      [[mark:type-bright]] ပုံသေးသေးတွေနဲ့ function နောက်ထပ် သုံးခုကို ကြည့်ပါမယ်။ ပထမ ပုံကို
      lesson 4 မှာ တွေ့ခဲ့တဲ့ nth-child နဲ့ ရွေးပြီး၊ brightness ကို 0.6 ပေးပါမယ်။
      [[mark:after-bright]] ပုံက ပိုမှောင်သွားပါပြီ။ brightness မှာ 1 ဆိုရင် ပုံက မူလအတိုင်း
      ရှိပြီး၊ 0 ဆိုရင် အမည်းရောင် လုံးလုံး ဖြစ်ပါတယ်။ 1 ထက် များရင်တော့ ပိုလင်းလာပါတယ်။
      [[mark:type-contrast]] ဒုတိယ ပုံကိုတော့ contrast 1.6 ပေးပါမယ်။ contrast က ပုံထဲက လင်းတဲ့
      အပိုင်းနဲ့ မှောင်တဲ့ အပိုင်း ဘယ်လောက် ကွာမလဲ ဆိုတာ ဆုံးဖြတ်ပါတယ်။
      [[mark:after-contrast]] လင်းတဲ့ နေရာတွေ ပိုလင်းပြီး မှောင်တဲ့ နေရာတွေ ပိုမှောင်လာလို့၊
      အစွန်းတွေ ပိုပြတ်သားလာပါတယ်။ 1 ထက် နည်းရင်တော့ contrast လျော့သွားပြီး၊ 0 မှာ
      ပုံတစ်ပုံလုံး မီးခိုးရောင် တစ်ရောင်တည်း ဖြစ်သွားပါတယ်။ [[mark:type-saturate]] တတိယ
      ပုံကိုတော့ saturate 2 ပေးပါမယ်။ saturate က အရောင် ဘယ်လောက် ရင့်မလဲ ဆိုတာ ဆုံးဖြတ်ပြီး၊ 0
      ဆိုရင် grayscale လိုပဲ အရောင် အားလုံး ပျောက်သွားပါတယ်။ [[mark:after-saturate]] အရောင်တွေ
      နှစ်ဆ ရင့်သွားလို့၊ အညိုရောင် ကြမ်းပြင်က လိမ္မော်ရောင် တောက်တောက် ဖြစ်သွားပါပြီ။
      brightness၊ contrast နဲ့ saturate မှာ အမြင့်ဆုံး ကန့်သတ်ချက် မရှိပေမယ့်၊ grayscale နဲ့
      sepia ကတော့ 1 မှာ ရပ်ပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Filters: brightness"
        url: "https://web.dev/learn/css/filters#brightness"
      - title: "web.dev Learn CSS — Filters: contrast"
        url: "https://web.dev/learn/css/filters#contrast"
      - title: "web.dev Learn CSS — Filters: saturate"
        url: "https://web.dev/learn/css/filters#saturate"
      - title: "MDN — brightness() (0 is black, 1 unchanged, no upper limit)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/filter-function/brightness"
      - title: "MDN — contrast() (0 is grey, below 1 less, above 1 more)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/filter-function/contrast"
      - title: "MDN — saturate() (0 is fully desaturated, values over 1 over-saturate)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/filter-function/saturate"
    actions:
      - id: type-bright
        type: editor.type
        at: { mark: type-bright }
        cadence: fast-explainer
        target: { file: styles.css, after: "  filter: none;\n}\n", occurrence: 1 }
        text: "\n.thumbs img:nth-child(1) {\n  filter: brightness(0.6);\n}\n"
      - id: expect-bright
        type: expect.preview
        at: { mark: after-bright }
        timeoutMs: 4000
        target: { by: testId, value: thumb-1 }
        attribute: { name: src, value: "/teahouse.svg" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-contrast
        type: editor.type
        at: { mark: type-contrast }
        cadence: fast-explainer
        target: { file: styles.css, after: "  filter: brightness(0.6);\n}\n", occurrence: 1 }
        text: "\n.thumbs img:nth-child(2) {\n  filter: contrast(1.6);\n}\n"
      - id: expect-contrast
        type: expect.preview
        at: { mark: after-contrast }
        timeoutMs: 4000
        target: { by: testId, value: thumb-2 }
        attribute: { name: src, value: "/teahouse.svg" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-saturate
        type: editor.type
        at: { mark: type-saturate }
        cadence: fast-explainer
        target: { file: styles.css, after: "  filter: contrast(1.6);\n}\n", occurrence: 1 }
        text: "\n.thumbs img:nth-child(3) {\n  filter: saturate(2);\n}\n"
      - id: expect-saturate
        type: expect.preview
        at: { mark: after-saturate }
        timeoutMs: 4000
        target: { by: testId, value: thumb-3 }
        attribute: { name: src, value: "/teahouse.svg" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: hue-wheel
    chapter: "အရောင်ဝိုင်းကို လှည့်ရအောင်"
    narration: >
      [[mark:open-wheel]] နောက် function က lesson 9 မှာ တွေ့ခဲ့တဲ့ hue နဲ့ အလုပ်လုပ်ပါတယ်။ hue
      က အရောင်ဝိုင်းပေါ်က နေရာကို ဒီဂရီနဲ့ ပြတာပါ။ [[mark:draw-wheel]] 0 ဒီဂရီက အနီ၊ 120 က
      အစိမ်း၊ 240 က အပြာ ဖြစ်ပါတယ်။ [[mark:draw-teal]] ကိုယ့် badge ကတော့ 180 ဒီဂရီ နားက
      အစိမ်းပြာရောင်ပါ။ [[mark:draw-turn]] hue rotate function က element ရဲ့ အရောင်တိုင်းကို
      ဒီ ဝိုင်းပေါ်မှာ ကိုယ်ပေးတဲ့ ထောင့်အတိုင်း လှည့်ပေးပါတယ်။ ဥပမာ 90 ဒီဂရီ ဆိုရင် လေးပုံ
      တစ်ပုံ လှည့်တာပါ။ [[mark:draw-full]] 360 ဒီဂရီ တစ်ပတ်ပြည့် လှည့်ရင်တော့ အရောင်တိုင်း မူလ
      နေရာကို ပြန်ရောက်ပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Filters: hue-rotate"
        url: "https://web.dev/learn/css/filters#hue-rotate"
      - title: "web.dev Learn CSS — Color (hue in HSL)"
        url: "https://web.dev/learn/css/color#hsl"
      - title: "MDN — hue-rotate()"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/filter-function/hue-rotate"
    actions:
      - id: open-wheel
        type: whiteboard.apply
        at: { mark: open-wheel }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-wheel
        type: whiteboard.apply
        at: { mark: draw-wheel }
        upsertIds: [b-wheel, b-red, b-l-red, b-green, b-l-green, b-blue, b-l-blue]
        drawMs: 3200
      - id: draw-teal
        type: whiteboard.apply
        at: { mark: draw-teal }
        upsertIds: [b-teal, b-l-teal]
        drawMs: 1400
      - id: draw-turn
        type: whiteboard.apply
        at: { mark: draw-turn }
        upsertIds: [b-violet, b-l-turn]
        drawMs: 1400
      - id: draw-full
        type: whiteboard.apply
        at: { mark: draw-full }
        upsertIds: [b-l-full]
        drawMs: 1200

  - id: hue-rotate
    narration: >
      [[mark:close-wheel]] badge မှာ စမ်းကြည့်ရအောင်။ [[mark:type-hue90]] badge အတွက် rule
      အသစ်နဲ့ သူ့ အရောင်အားလုံးကို 90 ဒီဂရီ၊ အရောင်ဝိုင်းရဲ့ လေးပုံ တစ်ပုံ လှည့်ကြည့်ရအောင်။
      [[mark:after-hue90]] badge က ခရမ်းရောင် ဖြစ်သွားပါပြီ။ [[mark:type-hue180]] အောက်မှာ
      တစ်ဝက် လှည့်တဲ့ 180 ဒီဂရီကို စမ်းကြည့်ရအောင်။ [[mark:after-hue180]] အခု ပန်းနီရောင်ပါ။
      ဝိုင်းပေါ်မှာ အစိမ်းပြာရောင်ရဲ့ တစ်ဖက်ခြမ်းက အရောင် ဖြစ်ပါတယ်။ [[mark:select-deg]] ဒီ
      ထောင့်ကို ကြည့်ပါ။ ဒီဂရီ ဒါမှမဟုတ် turn လို unit နဲ့ ရေးရပြီး၊ အနုတ် ပေးရင်
      ပြောင်းပြန်ဘက်ကို လှည့်ပါတယ်။ အဖြူနဲ့ မီးခိုးရောင်မှာ လှည့်စရာ hue မရှိလို့၊ အဖြူရောင်
      စာသားကတော့ အဖြူအတိုင်း ကျန်ပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Filters: hue-rotate"
        url: "https://web.dev/learn/css/filters#hue-rotate"
      - title: "MDN — hue-rotate() (an angle; 360deg is a full turn; negative values allowed)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/filter-function/hue-rotate"
    actions:
      - id: close-wheel
        type: whiteboard.apply
        at: { mark: close-wheel }
        open: false
      - id: type-hue90
        type: editor.type
        at: { mark: type-hue90 }
        cadence: fast-explainer
        target: { file: styles.css, after: "  filter: saturate(2);\n}\n", occurrence: 1 }
        text: "\n.badge {\n  filter: hue-rotate(90deg);\n}\n"
      - id: expect-hue90
        type: expect.preview
        at: { mark: after-hue90 }
        timeoutMs: 4000
        target: { by: testId, value: entry-badge }
        textContains: "ဝင်ရောက်ရန်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-hue180
        type: editor.type
        at: { mark: type-hue180 }
        cadence: fast-explainer
        target: { file: styles.css, after: "  filter: hue-rotate(90deg);\n", occurrence: 1 }
        text: "  filter: hue-rotate(180deg);\n"
      - id: expect-hue180
        type: expect.preview
        at: { mark: after-hue180 }
        timeoutMs: 4000
        target: { by: testId, value: entry-badge }
        attribute: { name: class, value: "badge" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-deg
        type: editor.select
        at: { mark: select-deg }
        target: { file: styles.css, text: "180deg", occurrence: 1 }

  - id: invert
    chapter: "Invert နဲ့ dark mode"
    narration: >
      card သေးသေးဆီ ဆင်းသွားရအောင်။ [[mark:type-invert]] ဒီ card အတွက်
      ညဘက် ပုံစံ တစ်ခု အမြန် လိုချင်တယ် ဆိုပါစို့။ invert function ကို 1 နဲ့ စမ်းကြည့်ရအောင်။
      [[mark:after-invert]] အဖြူရောင် card က အမည်းရောင် ဖြစ်ပြီး၊ အရောင်ရင့် စာလုံးတွေက
      လင်းသွားလို့ ပထမတော့ dark mode လို ထင်ရပါတယ်။ ဒါပေမဲ့ ပုံကို ကြည့်ပါ။ ဓာတ်ပုံ ဖလင်လို
      ပြောင်းပြန် ဖြစ်နေပြီး၊ အညိုရောင် ဈေးနှုန်းကလည်း အပြာဖျော့ရောင် ဖြစ်သွားပါတယ်။
      [[mark:explain-invert]] ဒါကြောင့် invert က dark mode မဟုတ်ပါဘူး။ သူက ဓာတ်ပုံတွေ၊
      ဆိုင်ရဲ့ အရောင်တွေ အပါအဝင် အရောင်တိုင်းကို ပြောင်းပြန် လှန်တာပါ။ တကယ့် dark mode မှာတော့
      lesson 11 မှာ တွေ့ခဲ့တဲ့ custom property တွေနဲ့ အရောင်အသစ်တွေ ရွေးပေးရပါတယ်။ invert
      ကလည်း grayscale လို 1 မှာ ရပ်ပြီး၊ 0.5 မှာ အရောင်တိုင်း အလယ်အလတ် မီးခိုးရောင်
      တစ်ရောင်တည်း ဖြစ်သွားပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Filters: invert"
        url: "https://web.dev/learn/css/filters#invert"
      - title: "MDN — invert() (0 to 1, clamped; default 1)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/filter-function/invert"
    actions:
      # The scroll for this step is gone: the page is only 673 px tall, so in
      # a preview this tall there is nothing to scroll and no scroll event to
      # record.
      - id: type-invert
        type: editor.type
        at: { mark: type-invert }
        cadence: fast-explainer
        target: { file: styles.css, after: "  filter: hue-rotate(180deg);\n}\n", occurrence: 1 }
        text: "\n.night {\n  filter: invert(1);\n}\n"
      - id: expect-invert
        type: expect.preview
        at: { mark: after-invert }
        timeoutMs: 4000
        target: { by: testId, value: night }
        textContains: "1,500 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: chaining
    chapter: "Function တွေရဲ့ အစဉ်"
    narration: >
      [[mark:type-cup-a]] အခု ခွက်တွေဆီ သွားရအောင်။ filter တစ်ခုထဲမှာ function အများကြီးကို
      space နဲ့ ခြားပြီး ရေးလို့ ရပါတယ်။ ပထမ ခွက်မှာ အစွန်း ပြတ်ပြတ် အနီရောင် drop shadow
      တစ်ခု ရေးပြီး၊ သူ့နောက်မှာ 120 ဒီဂရီ hue rotate ထည့်ပါမယ်။ အရိပ်ကို လိုက်ကြည့်ပါ။
      [[mark:after-cup-a]] ခွက်က အစိမ်းရောင် ဖြစ်သွားပြီး၊ အရိပ်ကလည်း အနီ မဟုတ်တော့ဘဲ
      အစိမ်းရောင် ဖြစ်သွားပါပြီ။ [[mark:type-cup-b]] ဒုတိယ ခွက်ကိုတော့ function နှစ်ခု တူတူကို
      ပြောင်းပြန် အစဉ်နဲ့ ပေးပါမယ်။ [[mark:after-cup-b]] ဒီ ခွက်လည်း အစိမ်းရောင်
      ဖြစ်သွားပေမယ့်၊ အရိပ်ကတော့ အနီရောင်အတိုင်း ကျန်ပါတယ်။ [[mark:open-pipeline]] ဘာကြောင့်
      ကွာသွားတာလဲ။ function တွေက ဘယ်ကနေ ညာကို အစဉ်လိုက် အလုပ်လုပ်ပြီး၊ တစ်ခုစီက သူ့ရှေ့က
      function ထုတ်ပေးခဲ့တဲ့ ပုံပေါ်မှာ ဆက်လုပ်လို့ပါ။ [[mark:draw-row-a]] ပထမ ခွက်မှာ
      အရိပ်ကို အရင် ထည့်ပါတယ်။ ပြီးမှ အရိပ် အပါအဝင် ပုံတစ်ခုလုံးကို အရောင်ဝိုင်းပေါ်မှာ
      လှည့်လိုက်တာပါ။ [[mark:draw-row-b]] ဒုတိယ ခွက်မှာတော့ ခွက်ကိုပဲ အရင် လှည့်ပြီး၊ အနီရောင်
      အရိပ်ကို နောက်မှ ထည့်လို့ သူ့ အရောင်ကို ဘာကမှ မပြောင်းပါဘူး။ [[mark:draw-invalid]]
      စာရင်းထဲမှာ function တစ်ခုတည်း မှားနေရင်တောင်၊ ဥပမာ မရှိတဲ့ နာမည် တစ်ခု ပါနေရင်တောင်၊
      browser က declaration တစ်ခုလုံးကို ပစ်လိုက်ပါတယ်။ ဒါကြောင့် ကျန်တဲ့ function တွေလည်း
      အလုပ်မလုပ်တော့ပါဘူး။ [[mark:draw-opacity]] opacity function လည်း ရှိပါတယ်။ သူက opacity
      property လိုပဲ 0 မှာ မမြင်ရဘဲ၊ 1 မှာ အပြည့် မြင်ရပါတယ်။ ကွာတာက သူက ဒီ စာရင်းထဲက အဆင့်
      တစ်ဆင့် ဖြစ်လို့၊ တခြား function တွေနဲ့ အစဉ်လိုက် အလုပ်လုပ်တာပါ။
    sources:
      - title: "web.dev Learn CSS — Filters: the filter property (several functions)"
        url: "https://web.dev/learn/css/filters#the_filter_property"
      - title: "web.dev Learn CSS — Filters: opacity"
        url: "https://web.dev/learn/css/filters#opacity"
      - title: "MDN — filter (functions apply in order; an invalid function drops the declaration)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/filter"
      - title: "MDN — opacity() filter function"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/filter-function/opacity"
      - title: "Filter Effects Module Level 1 — the filter property (a filter function list)"
        url: "https://drafts.fxtf.org/filter-effects-1/#FilterProperty"
    actions:
      - id: type-cup-a
        type: editor.type
        at: { mark: type-cup-a }
        cadence: fast-explainer
        target: { file: styles.css, after: "  filter: invert(1);\n}\n", occurrence: 1 }
        text: "\n.cup-a {\n  filter: drop-shadow(4px 4px 0 #b23a2b) hue-rotate(120deg);\n}\n"
      - id: expect-cup-a
        type: expect.preview
        at: { mark: after-cup-a }
        timeoutMs: 4000
        target: { by: testId, value: cup-a }
        attribute: { name: class, value: "cup-a" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-cup-b
        type: editor.type
        at: { mark: type-cup-b }
        cadence: line-by-line
        target: { file: styles.css, after: "hue-rotate(120deg);\n}\n", occurrence: 1 }
        text: "\n.cup-b {\n  filter: hue-rotate(120deg) drop-shadow(4px 4px 0 #b23a2b);\n}\n"
      - id: expect-cup-b
        type: expect.preview
        at: { mark: after-cup-b }
        timeoutMs: 4000
        target: { by: testId, value: cup-b }
        attribute: { name: class, value: "cup-b" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: open-pipeline
        type: whiteboard.apply
        at: { mark: open-pipeline }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-row-a
        type: whiteboard.apply
        at: { mark: draw-row-a }
        upsertIds: [c-a-in, c-a-in-l, c-a-ar1, c-a-f1, c-a-f1-l, c-a-ar2, c-a-f2, c-a-f2-l, c-a-out]
        drawMs: 3200
      - id: draw-row-b
        type: whiteboard.apply
        at: { mark: draw-row-b }
        upsertIds: [c-b-in, c-b-in-l, c-b-ar1, c-b-f1, c-b-f1-l, c-b-ar2, c-b-f2, c-b-f2-l, c-b-out]
        drawMs: 3200
      - id: draw-invalid
        type: whiteboard.apply
        at: { mark: draw-invalid }
        upsertIds: [c-invalid]
        drawMs: 1600
      - id: draw-opacity
        type: whiteboard.apply
        at: { mark: draw-opacity }
        upsertIds: [c-opacity]
        drawMs: 1600

  - id: drop-shadow
    chapter: "Drop shadow နဲ့ box shadow"
    narration: >
      [[mark:close-pipeline]] lesson 34 မှာ drop shadow က မြင်ရတဲ့ ပုံသဏ္ဌာန်ကို လိုက်တယ်လို့
      ပြောခဲ့ပါတယ်။ နောက်ဆုံး ခွက် နှစ်ခုမှာ ဖောက်ထွင်း မြင်ရတဲ့ အရိပ် ပျော့ပျော့ တူတူကို
      ပေးပြီး၊ box shadow နဲ့ နှိုင်းယှဉ်ကြည့်ရအောင်။ [[mark:type-cup-c]] တတိယ ခွက်ကို box
      shadow ပေးပါမယ်။ [[mark:after-cup-c]] အရိပ်က လေးထောင့် ဖြစ်နေပါတယ်။ box ထဲမှာ ဘာမှ
      မရှိတဲ့ နေရာမှာတောင် SVG ပတ်လည်က box ကို လိုက်လို့ပါ။ [[mark:type-cup-d]] လေးခုမြောက်
      ခွက်ကိုတော့ တန်ဖိုး တူတူကို drop shadow function နဲ့ ပေးပါမယ်။ [[mark:after-cup-d]] ဒီ
      အရိပ်ကတော့ လေးထောင့် မဟုတ်ဘဲ၊ ခွက်၊ လက်ကိုင်နဲ့ ပန်းကန်ပြားရဲ့ ပုံသဏ္ဌာန်အတိုင်း ကပ်ပြီး
      ကျပါတယ်။ drop shadow ကို တကယ် ဆွဲထားတဲ့ pixel တွေကနေ ထုတ်လို့၊ ဖောက်ထွင်း မြင်ရတဲ့ pixel
      တွေမှာ အရိပ် မကျပါဘူး။ [[mark:select-drop]] ဒီ drop shadow ထဲက တန်ဖိုးတွေကို ကြည့်ပါ။ x
      နဲ့ y offset၊ မပေးလည်း ရတဲ့ blur နဲ့ အရောင် ပါပါတယ်။ box shadow နဲ့ မတူတာက spread နဲ့
      inset မရှိဘဲ၊ function တစ်ခုက အရိပ် တစ်ခုပဲ ဆွဲပါတယ်။ [[mark:explain-multi]] အရိပ်
      ပိုလိုချင်ရင် drop shadow function တွေကို box shadow မှာလို comma နဲ့ မဟုတ်ဘဲ space နဲ့
      ခြားပြီး ထပ်ရေးပါ။ တစ်ခုစီက ရှေ့က ရလဒ်ပေါ်မှာ အလုပ်လုပ်လို့၊ ဒုတိယ အရိပ်က ခွက်ကနေရော ပထမ
      အရိပ်ကနေပါ ကျပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Filters: drop-shadow"
        url: "https://web.dev/learn/css/filters#drop-shadow"
      - title: "web.dev Learn CSS — Shadows: drop shadow"
        url: "https://web.dev/learn/css/shadows#drop_shadow"
      - title: "MDN — drop-shadow() (follows the alpha mask; no spread or inset)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/filter-function/drop-shadow"
      - title: "MDN — box-shadow"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/box-shadow"
    actions:
      - id: close-pipeline
        type: whiteboard.apply
        at: { mark: close-pipeline }
        open: false
      - id: type-cup-c
        type: editor.type
        at: { mark: type-cup-c }
        cadence: line-by-line
        target: { file: styles.css, after: "drop-shadow(4px 4px 0 #b23a2b);\n}\n", occurrence: 1 }
        text: "\n.cup-c {\n  box-shadow: 4px 6px 6px rgb(0 0 0 / 35%);\n}\n"
      - id: expect-cup-c
        type: expect.preview
        at: { mark: after-cup-c }
        timeoutMs: 4000
        target: { by: testId, value: cup-c }
        attribute: { name: class, value: "cup-c" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-cup-d
        type: editor.type
        at: { mark: type-cup-d }
        cadence: line-by-line
        target:
          {
            file: styles.css,
            after: "  box-shadow: 4px 6px 6px rgb(0 0 0 / 35%);\n}\n",
            occurrence: 1,
          }
        text: "\n.cup-d {\n  filter: drop-shadow(4px 6px 6px rgb(0 0 0 / 35%));\n}\n"
      - id: expect-cup-d
        type: expect.preview
        at: { mark: after-cup-d }
        timeoutMs: 4000
        target: { by: testId, value: cup-d }
        attribute: { name: class, value: "cup-d" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-drop
        type: editor.select
        at: { mark: select-drop }
        target:
          { file: styles.css, text: "drop-shadow(4px 6px 6px rgb(0 0 0 / 35%))", occurrence: 1 }

  - id: svg-filters
    chapter: "SVG filter"
    narration: >
      [[mark:open-svg]] filter function တွေ အပြင်၊ filter property က SVG filter ကိုလည်း
      သုံးလို့ ရပါတယ်။ [[mark:draw-svg-box]] ကိုယ့် HTML page ထဲမှာ id ပါတဲ့ SVG filter
      element တစ်ခု ထည့်ထားရပါတယ်။ [[mark:draw-svg-prims]] အဲဒီ ထဲမှာ effect ကို အဆင့်
      သေးသေးတွေနဲ့ တည်ဆောက်ပါတယ်။ အရောင် ပြောင်းတဲ့ အဆင့် တစ်ခုက ဓာတ်ပုံကို အရောင်
      နှစ်ရောင်တည်း ဖြစ်တဲ့ duotone ပြောင်းပေးနိုင်ပြီး၊ နောက် အဆင့် တစ်ခုက အစက်အပြောက်
      ကြမ်းကြမ်း ထည့်ပေးနိုင်ပါတယ်။ CSS function တွေထက် အများကြီး ပိုလုပ်နိုင်ပါတယ်။
      [[mark:draw-svg-url]] CSS ထဲကနေ url နဲ့ သူ့ id ကို ညွှန်ပြီး သုံးပါတယ်။
      [[mark:draw-svg-rules]] SVG ကို filter သုံးမယ့် page ထဲမှာပဲ ထားပါ။ ဖိုင် သပ်သပ်ထဲက
      filter ကို browser တိုင်းက မသုံးနိုင်လို့ပါ။ browser က filter ကို ရှာမတွေ့ရင်လည်း filter
      မသက်ရောက်ပါဘူး။ ဒီနေ့ board ပေါ်မှာပဲ ပုံကြမ်း ဆွဲပြတာ ဖြစ်လို့၊ ကိုယ့် editor ထဲမှာ
      စမ်းကြည့်ပါ။
    sources:
      - title: "web.dev Learn CSS — Filters: url"
        url: "https://web.dev/learn/css/filters#url"
      - title: "MDN — filter (url() to an SVG filter element)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/filter#url"
      - title: "MDN — SVG <filter> element"
        url: "https://developer.mozilla.org/en-US/docs/Web/SVG/Element/filter"
      - title: "Filter Effects Module Level 1 — the filter property (a missing reference disables the filter)"
        url: "https://drafts.fxtf.org/filter-effects-1/#FilterProperty"
    actions:
      - id: open-svg
        type: whiteboard.apply
        at: { mark: open-svg }
        open: true
        clear: true
        upsertIds: [d-title]
      - id: draw-svg-box
        type: whiteboard.apply
        at: { mark: draw-svg-box }
        upsertIds: [d-svg, d-svg-l, d-filter]
        drawMs: 2000
      - id: draw-svg-prims
        type: whiteboard.apply
        at: { mark: draw-svg-prims }
        upsertIds: [d-prims, d-uses]
        drawMs: 2000
      - id: draw-svg-url
        type: whiteboard.apply
        at: { mark: draw-svg-url }
        upsertIds: [d-css, d-arrow]
        drawMs: 1600
      - id: draw-svg-rules
        type: whiteboard.apply
        at: { mark: draw-svg-rules }
        upsertIds: [d-same, d-missing]
        drawMs: 2000

  - id: blur
    chapter: "ပုံကို ဝါးရအောင်"
    narration: >
      [[mark:close-svg]] နောက်ဆုံး function ဖြစ်တဲ့ blur အတွက် ဓာတ်ပုံဆီ ပြန်သွားရအောင်။
      [[mark:scroll-photo]] ဒီတစ်ခါ filter ကို ဓာတ်ပုံ၊ card နဲ့ ပုံ အောက်က စာတန်း ပါတဲ့
      figure တစ်ခုလုံးမှာ ပေးပါမယ်။ [[mark:type-blur]] rule အသစ်နဲ့ figure ကို 4 pixel blur
      ပေးပါမယ်။ card ပေါ်က စာသားကို လိုက်ကြည့်ပါ။ [[mark:after-blur]] အားလုံး ဝါးသွားပါပြီ။
      card ပေါ်က စာသားနဲ့ ပုံ အောက်က စာတန်းတောင် ဝါးနေပါတယ်။ filter က element နဲ့ သူ့ထဲက
      အရာအားလုံးကို သက်ရောက်ပြီး၊ child တစ်ခုက သူ့အတွက် သီးသန့် ပိတ်လို့ မရပါဘူး။
      [[mark:select-blur-len]] ဒီ 4 pixel ကို ကြည့်ပါ။ blur ကို pixel လို unit ပါတဲ့ အရှည်နဲ့
      ပေးရပြီး၊ အဲဒါက ဝါးတဲ့ အချင်းဝက်ပါ။ ရာခိုင်နှုန်းနဲ့ အနုတ် တန်ဖိုးတော့ ပေးလို့ မရပါဘူး။
      အချင်းဝက် ကြီးလေ browser က ဆွဲရတာ ပိုပင်ပန်းလေ ဖြစ်ပြီး၊ ဝါးတာက element ရဲ့ အစွန်းကို
      နည်းနည်း ကျော်ထွက်ပါတယ်။ [[mark:explain-stacking]] none မဟုတ်တဲ့ filter တိုင်းက element
      ကို lesson 23 မှာ တွေ့ခဲ့တဲ့ stacking context အသစ် ဖြစ်စေပါတယ်။ lesson 14 မှာ
      ပြောခဲ့သလို fixed child တွေရဲ့ containing block လည်း ဖြစ်သွားပါတယ်။
      [[mark:type-blur-off]] စာသား ဝါးနေတာကို မလိုချင်လို့၊ ဒီ filter ကို none နဲ့
      ပြန်ပိတ်ကြည့်ရအောင်။ [[mark:after-blur-off]] အားလုံး ပြန်ပြတ်သားသွားပါပြီ။
    sources:
      - title: "web.dev Learn CSS — Filters: blur"
        url: "https://web.dev/learn/css/filters#blur"
      - title: "MDN — blur() (a length; no percentages)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/filter-function/blur"
      - title: "MDN — filter (creates a stacking context and a containing block)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/filter"
      - title: "Filter Effects Module Level 1 — stacking context and containing block"
        url: "https://drafts.fxtf.org/filter-effects-1/#FilterProperty"
    actions:
      - id: close-svg
        type: whiteboard.apply
        at: { mark: close-svg }
        open: false
      # The scroll for this step is gone: the page is only 673 px tall, so in
      # a preview this tall there is nothing to scroll and no scroll event to
      # record.
      - id: type-blur
        type: editor.type
        at: { mark: type-blur }
        cadence: fast-explainer
        target:
          {
            file: styles.css,
            after: "  filter: drop-shadow(4px 6px 6px rgb(0 0 0 / 35%));\n}\n",
            occurrence: 1,
          }
        text: "\n.photo {\n  filter: blur(4px);\n}\n"
      - id: expect-blur
        type: expect.preview
        at: { mark: after-blur }
        timeoutMs: 4000
        target: { by: testId, value: promo }
        textContains: "ယနေ့ အထူး"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-blur-len
        type: editor.select
        at: { mark: select-blur-len }
        target: { file: styles.css, text: "blur(4px)", occurrence: 1 }
      - id: type-blur-off
        type: editor.type
        at: { mark: type-blur-off }
        cadence: fast-explainer
        target: { file: styles.css, after: "  filter: blur(4px);\n", occurrence: 1 }
        text: "  filter: none;\n"
      - id: expect-blur-off
        type: expect.preview
        at: { mark: after-blur-off }
        timeoutMs: 4000
        target: { by: testId, value: gallery }
        textContains: "ဆိုင်အတွင်း"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: backdrop
    chapter: "မှန်ဝါး card"
    narration: >
      [[mark:type-backdrop]] အခု ရည်မှန်းချက်ဆီ ရောက်ပါပြီ။ backdrop filter က function တွေ
      တူတူ ယူပေမယ့်၊ element ရဲ့ border အတွင်းမှာ သူ့ နောက်က ဆွဲထားတဲ့ အရာကိုပဲ filter
      လုပ်ပါတယ်။ card ကို 8 pixel blur ပေးကြည့်ရအောင်။ [[mark:after-backdrop]] ဘာမှ
      မပြောင်းပါဘူး။ card ရဲ့ နောက်ခံက ဖောက်မမြင်ရတဲ့ နို့နှစ်ရောင် ဖြစ်နေတော့၊ နောက်က အရာကို
      မမြင်ရပါဘူး။ [[mark:type-glass]] lesson 9 မှာ တွေ့ခဲ့တဲ့ rgb နဲ့ alpha ကို သုံးပြီး၊
      နောက်ခံကို 35 ရာခိုင်နှုန်းပဲ မြင်ရတဲ့ အဖြူရောင် ပေးပါမယ်။ card ကို လိုက်ကြည့်ပါ။
      [[mark:after-glass]] အခု မှန်ဝါး ဖြစ်သွားပါပြီ။ card နောက်က လက်ဖက်ရည် ခွက်တွေနဲ့ စားပွဲက
      ဝါးနေပြီး၊ အပေါ်က စာသားကတော့ ပြတ်ပြတ်သားသား ကျန်ပါတယ်။ ဝါးတာကလည်း card ရဲ့
      ထောင့်ဝိုင်းတွေအတိုင်း လိုက်ပါတယ်။ [[mark:explain-support]] backdrop filter ကို 2024
      ခုနှစ်ကစပြီး browser အဓိက အားလုံးမှာ သုံးလို့ ရနေပါပြီ။ အရင်က Safari က webkit prefix
      ပါမှ နားလည်ခဲ့လို့၊ prefix မပါတဲ့ ဒီ code က iPhone အဟောင်းတွေမှာ ဝါးတာ မပေါ်ပါဘူး။
      ဒါကြောင့် ဖောက်ထွင်း မြင်ရတဲ့ အဖြူရောင် နောက်ခံကို ထားခဲ့တာပါ။ blur အလုပ်မလုပ်ရင်တောင်
      ဓာတ်ပုံပေါ်က စာသားကို ဖတ်လို့ ရနေမှာပါ။
    sources:
      - title: "web.dev Learn CSS — Filters: backdrop filter"
        url: "https://web.dev/learn/css/filters#backdrop_filter"
      - title: "MDN — backdrop-filter (needs a transparent or semi-transparent background)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/backdrop-filter"
      - title: "Filter Effects Module Level 2 — backdrop-filter"
        url: "https://drafts.fxtf.org/filter-effects-2/#BackdropFilterProperty"
      - title: "webstatus.dev — backdrop-filter (Baseline 2024)"
        url: "https://webstatus.dev/features/backdrop-filter"
    actions:
      - id: type-backdrop
        type: editor.type
        at: { mark: type-backdrop }
        cadence: fast-explainer
        target:
          { file: styles.css, after: "  filter: blur(4px);\n  filter: none;\n}\n", occurrence: 1 }
        text: "\n.promo {\n  backdrop-filter: blur(8px);\n}\n"
      - id: expect-backdrop
        type: expect.preview
        at: { mark: after-backdrop }
        timeoutMs: 4000
        target: { by: testId, value: promo }
        textContains: "လက်ဖက်ရည်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-glass
        type: editor.type
        at: { mark: type-glass }
        cadence: fast-explainer
        target: { file: styles.css, after: "  backdrop-filter: blur(8px);\n", occurrence: 1 }
        text: "  background: rgb(255 255 255 / 35%);\n"
      - id: expect-glass
        type: expect.preview
        at: { mark: after-glass }
        timeoutMs: 4000
        target: { by: testId, value: promo }
        textContains: "1,500 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:open-quiz]] မပြီးခင် မေးခွန်း တစ်ခု မေးကြည့်ရအောင်။ ဒီထဲက ဘယ်ဟာတွေက filter
      function တွေလဲ။ [[mark:quiz-answer]] grayscale၊ invert၊ blur နဲ့ brightness တို့
      ဖြစ်ပါတယ်။ flip ဆိုတဲ့ function မရှိပါဘူး။ multiply ကတော့ filter မဟုတ်ဘဲ blend mode
      တစ်ခုပါ။ [[mark:quiz-url]] url နဲ့ဆိုရင် CSS က SVG filter ကိုလည်း သုံးနိုင်ပါတယ်။
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ filter က element နဲ့ သူ့ထဲက အရာအားလုံးကို
      ပြောင်းပြီး၊ function တွေက ဘယ်ကနေ ညာကို အစဉ်လိုက် အလုပ်လုပ်ပါတယ်။ အများစုက ပမာဏကို ဂဏန်း
      ဒါမှမဟုတ် ရာခိုင်နှုန်းနဲ့ ယူပြီး၊ blur က အရှည်၊ hue rotate က ထောင့်ကို ယူပါတယ်။ drop
      shadow က ဆွဲထားတဲ့ ပုံသဏ္ဌာန်ကို လိုက်ပြီး၊ backdrop filter ကတော့ ဖောက်ထွင်း မြင်ရတဲ့
      element ရဲ့ နောက်က အရာကိုပဲ ပြောင်းပါတယ်။ [[mark:next-lesson]] နောက် lesson မှာတော့
      element ရဲ့ အရောင်တွေကို သူ့ နောက်က အလွှာတွေနဲ့ ရောပေးတဲ့ blend mode ကို၊ ဒီနေ့
      လုပ်ခဲ့သလို မီးခိုးရောင် ဓာတ်ပုံ တစ်ပုံကနေ စပြီး ကြည့်သွားပါမယ်။
    sources:
      - title: "web.dev Learn CSS — Filters: check your understanding"
        url: "https://web.dev/learn/css/filters#check_your_understanding"
      - title: "web.dev Learn CSS — Blend modes (next lesson)"
        url: "https://web.dev/learn/css/blend-modes"
    actions:
      - id: open-quiz
        type: whiteboard.apply
        at: { mark: open-quiz }
        open: true
        clear: true
        upsertIds: [e-title, e-q1, e-q2]
      - id: draw-quiz-answer
        type: whiteboard.apply
        at: { mark: quiz-answer }
        upsertIds: [e-yes, e-no, e-no2]
        drawMs: 2000
      - id: draw-quiz-url
        type: whiteboard.apply
        at: { mark: quiz-url }
        upsertIds: [e-url]
        drawMs: 1200
      - id: expect-final-css
        type: expect.file
        at: { mark: recap }
        path: styles.css
        contains: ".photo img {\n  filter: grayscale(1);\n  filter: grayscale(0.5);\n  filter: sepia(1);\n  filter: none;\n}\n\n.thumbs img:nth-child(1) {\n  filter: brightness(0.6);\n}\n\n.thumbs img:nth-child(2) {\n  filter: contrast(1.6);\n}\n\n.thumbs img:nth-child(3) {\n  filter: saturate(2);\n}\n\n.badge {\n  filter: hue-rotate(90deg);\n  filter: hue-rotate(180deg);\n}\n\n.night {\n  filter: invert(1);\n}\n\n.cup-a {\n  filter: drop-shadow(4px 4px 0 #b23a2b) hue-rotate(120deg);\n}\n\n.cup-b {\n  filter: hue-rotate(120deg) drop-shadow(4px 4px 0 #b23a2b);\n}\n\n.cup-c {\n  box-shadow: 4px 6px 6px rgb(0 0 0 / 35%);\n}\n\n.cup-d {\n  filter: drop-shadow(4px 6px 6px rgb(0 0 0 / 35%));\n}\n\n.photo {\n  filter: blur(4px);\n  filter: none;\n}\n\n.promo {\n  backdrop-filter: blur(8px);\n  background: rgb(255 255 255 / 35%);\n}\n"

checks:
  - { type: timing.p95Ms, max: 300 }
