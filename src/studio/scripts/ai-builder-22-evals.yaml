# AI Builder, lesson 22: evals for AI features (Burmese, docs kind).
#
# Start state (ws/): base-docs (package.json with a no-op dev script, notes.md = "# Notes\n") and
# docs/evals.md pinned with only its title line. Nothing runs and no model runs: the AI feature (a
# customer's free-text note → order options) is described, and the lesson types how it will be
# checked (COURSE-KIT §4.14): Feature · Examples (six notes, typed in two actions) · Rubric · Pass bar.
#
# Boards: (F) the feature flowing down: a note (white) → the model (violet) → the options a good
# answer should give (blue), and why it sits at the careful end (orange); (E) test vs eval in two
# columns; (J) who scores: a person (green) or a judge model (violet) checked by a person (orange);
# (L) the eval loop top to bottom ↻, with new notes from real use (green); (Z) the quiz.
#
# Build: bun ~/Documents/ai-builder-course-work/tools/build-lesson.ts template.yaml ws ai-builder-22-evals.yaml
schemaVersion: 1
lesson:
  slug: ai-builder-22-evals
  title: "AI Builder 22: AI feature တွေအတွက် eval"
  locale: my-MM
  workspace:
    lessonType: javascript
    name: AI Builder
    entryFilePath: docs/evals.md
    sidebarStartsCollapsed: true
    files:
      docs/evals.md: |+
        # Evals · မှတ်ချက်ကနေ order option

      notes.md: |
        # Notes
      package.json: |
        {
          "name": "ai-builder-lesson",
          "private": true,
          "version": "1.0.0",
          "scripts": {
            "dev": "echo concept lesson: nothing to run"
          }
        }
