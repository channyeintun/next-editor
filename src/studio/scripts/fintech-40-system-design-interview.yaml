      ledger.go: |
        package main

        import (
        	"fmt"
        	"strings"
        )

        // Line is one row of a transaction: an amount on the debit or the credit side of one account.
        type Line struct {
        	Account string
        	Debit   int64
        	Credit  int64
        }

        // Tx is one business event. All of its lines are posted together, or none of them.
        type Tx struct {
        	ID    string
        	Memo  string
        	Lines []Line
        }

        // Ledger is an append-only list of posted transactions. Balances are derived from it.
        type Ledger struct {
        	txs []Tx
        }

        // Post appends a transaction only if its debits equal its credits.
        func (l *Ledger) Post(tx Tx) error {
        	var debit, credit int64
        	for _, line := range tx.Lines {
        		debit += line.Debit
        		credit += line.Credit
        	}
        	if debit != credit {
        		return fmt.Errorf("tx %s is not balanced: debit %s, credit %s", tx.ID, cents(debit), cents(credit))
        	}
        	l.txs = append(l.txs, tx)
        	return nil
        }

        // kindOf reads the account type from the name: "asset:bank" is an asset.
        func kindOf(account string) string {
        	kind, _, _ := strings.Cut(account, ":")
        	return kind
        }

        // Balance derives an account's balance on the side where that kind of account grows:
        // assets and expenses grow with debits; liabilities, equity and revenue grow with credits.
        func (l *Ledger) Balance(account string) int64 {
        	var debit, credit int64
        	for _, tx := range l.txs {
        		for _, line := range tx.Lines {
        			if line.Account == account {
        				debit += line.Debit
        				credit += line.Credit
        			}
        		}
        	}
        	if kind := kindOf(account); kind == "asset" || kind == "expense" {
        		return debit - credit
        	}
        	return credit - debit
        }

        // cents prints minor units as an amount with two decimals: cents(1234) is "12.34".
        func cents(n int64) string {
        	sign := ""
        	if n < 0 {
        		sign, n = "-", -n
        	}
        	return fmt.Sprintf("%s%d.%02d", sign, n/100, n%100)
        }
      main.go: |
        package main

        import (
        	"fmt"
        	"strings"
        )

        func main() {
        	w := newWallet()
        	req := Request{Key: "k-7f3a", From: "liability:user:1042", To: "liability:user:2077", Amount: 40_00}
        	first, steps := w.Transfer(req)
        	fmt.Println("first:", strings.Join(steps, " -> "), "=>", first.Status, first.TxID)

        	fmt.Printf("balances: 1042 %s, 2077 %s\n",
        		cents(w.ledger.Balance("liability:user:1042")), cents(w.ledger.Balance("liability:user:2077")))
        }
      wallet.go: |
        package main

        import "fmt"

        // Request is one call to the transfer API. The client picks the key and reuses it on a retry.
        type Request struct {
        	Key      string
        	From, To string
        	Amount   int64
        }

        type Response struct {
        	Status int
        	TxID   string
        }

        type Event struct{ ID, Type, TxID string }

        // Wallet is the course's pieces in one place: a ledger, a key store and an outbox.
        // In production the key, the posting and the outbox row commit in one database transaction.
        type Wallet struct {
        	ledger Ledger
        	keys   map[string]Response // idempotency key -> the response sent the first time
        	outbox []Event
        	users  []string
        }

        func newWallet() *Wallet {
        	w := &Wallet{keys: map[string]Response{}, users: []string{"liability:user:1042", "liability:user:2077"}}
        	w.ledger.Post(Tx{ID: "tx-1", Memo: "deposit", Lines: []Line{
        		{Account: "asset:bank", Debit: 100_00},
        		{Account: "liability:user:1042", Credit: 100_00},
        	}})
        	return w
        }

        // Transfer moves money between two users once per key, and says what it did.
        func (w *Wallet) Transfer(r Request) (Response, []string) {
        	if res, ok := w.keys[r.Key]; ok {
        		return res, []string{"key seen", "replay"}
        	}
        	if w.ledger.Balance(r.From) < r.Amount {
        		w.keys[r.Key] = Response{Status: 409}
        		return w.keys[r.Key], []string{"new key", "insufficient funds"}
        	}
        	tx := Tx{ID: fmt.Sprintf("tx-%d", len(w.ledger.txs)+1), Memo: "transfer " + r.Key, Lines: []Line{
        		{Account: r.From, Debit: r.Amount},
        		{Account: r.To, Credit: r.Amount},
        	}}
        	if err := w.ledger.Post(tx); err != nil {
        		return Response{Status: 500}, []string{err.Error()}
        	}
        	evt := Event{fmt.Sprintf("evt-%d", len(w.outbox)+1), "transfer.completed", tx.ID}
        	w.outbox = append(w.outbox, evt)
        	w.keys[r.Key] = Response{200, tx.ID}
        	return w.keys[r.Key], []string{"new key", "balance checked", "posted " + tx.ID, "outbox " + evt.ID}
        }

        // total is what the ledger says the platform owes its users.
        func (w *Wallet) total() int64 {
        	var sum int64
        	for _, u := range w.users {
        		sum += w.ledger.Balance(u)
        	}
        	return sum
        }
