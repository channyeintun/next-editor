  - id: code
    chapter: Wallet transfer ကို code နဲ့
    narration: >-
      [[mark:close-moves]] ခြေလှမ်းတွေကို wallet transfer တစ်ခုပေါ်မှာ စမ်းကြည့်ရအောင်။ [[mark:open-wallet]] ဒီ
      program ကို course ထဲက အပိုင်းတွေနဲ့ ဆောက်ထားပါတယ်။ [[mark:sel-key]] request တိုင်းမှာ client ရွေးတဲ့
      idempotency key ပါပြီး၊ ပထမဆုံး key store ကို ကြည့်ပါတယ်။ [[mark:sel-check]] key အသစ်ဆိုရင် balance ကို
      စစ်ပြီး၊ မလောက်ရင် ငြင်းတဲ့ response ကိုပါ key နဲ့ သိမ်းပါတယ်။ [[mark:sel-post]] လောက်ရင် debit တစ်ကြောင်း၊
      credit တစ်ကြောင်းပါတဲ့ transaction ကို post လုပ်ပြီး outbox ထဲ event တစ်ခု ထည့်ပါတယ်။ production မှာ
      key၊ posting နဲ့ outbox row သုံးခုလုံး database transaction တစ်ခုတည်းနဲ့ commit ဖြစ်ရပါမယ်။ [[mark:run-1]]
      run လိုက်ရအောင်။ [[mark:pt-first]] ပထမ request က key အသစ်ဖြစ်လို့ balance စစ်၊ post လုပ်၊ outbox ထဲ
      ထည့်ပြီး transaction နံပါတ် နှစ်ကို ပြန်ပေးပါတယ်။ [[mark:pt-bal]] user ၁၀၄၂ မှာ ယူရို ခြောက်ဆယ်၊ ၂၀၇၇ မှာ
      လေးဆယ် ဖြစ်သွားပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Idempotency (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#idempotency",
        }
      - {
          title: "Fintech Engineering Handbook — Notifying reliably (Outbox and CDC) (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#notifying-reliably-outbox-and-cdc",
        }
    actions:
      - { id: close-moves, type: slide.close, at: { mark: close-moves } }
      - { id: open-wallet, type: workspace.openFile, at: { mark: open-wallet }, path: wallet.go }
      - id: sel-key
        type: editor.select
        at: { mark: sel-key }
        target: { file: wallet.go, text: "if res, ok := w.keys[r.Key]; ok {", occurrence: 1 }
      - id: sel-check
        type: editor.select
        at: { mark: sel-check }
        target: { file: wallet.go, text: "if w.ledger.Balance(r.From) < r.Amount {", occurrence: 1 }
      - id: sel-post
        type: editor.select
        at: { mark: sel-post }
        target: { file: wallet.go, text: "w.outbox = append(w.outbox, evt)", occurrence: 1 }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "outbox evt-1 => 200 tx-2",
          timeoutMs: 8000,
        }
      - id: pt-first
        type: console.point
        at: { mark: pt-first }
        target: { text: "first: new key", occurrence: 1 }
      - id: pt-bal
        type: console.point
        at: { mark: pt-bal }
        target: { text: "balances: 1042 60.00", occurrence: 1 }

  - id: retry
    narration: >-
      [[mark:dock-1]] ဒီ response က client ဆီ မရောက်ခဲ့ဘူး ဆိုပါစို့။ [[mark:open-main]] client က timeout ဖြစ်တာပဲ
      သိလို့ key တူတူနဲ့ request ကို ထပ်ပို့ပါတယ်။ [[mark:type-retry]] ဒုတိယ response က ပထမ response နဲ့ တူမတူကိုပါ စစ်ပါမယ်။ balance တွေ ဘယ်လောက်
      ဖြစ်မလဲ ခန့်မှန်းကြည့်ပါ။ [[mark:run-2]] run လိုက်ရအောင်။ [[mark:pt-retry]] retry က key ကို တွေ့လို့
      ဘာမှ ထပ်မလုပ်ဘဲ ပထမ response ကိုပဲ ပြန်ပေးပါတယ်။ [[mark:pt-same]] response နှစ်ခု အတူတူပါပဲ။
      [[mark:pt-bal2]] balance တွေလည်း မပြောင်းပါဘူး၊ request နှစ်ခု ရောက်ပေမဲ့ ငွေက တစ်ခါပဲ ရွှေ့ပါတယ်။
      [[mark:dock-2]] ဒါက No invented data ကို code နဲ့ ထိန်းတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Idempotency (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#idempotency",
        }
    actions:
      - { id: dock-1, type: runtime.collapseDock, at: { mark: dock-1 } }
      - { id: open-main, type: workspace.openFile, at: { mark: open-main }, path: main.go }
      - id: type-retry
        type: editor.type
        at: { mark: type-retry }
        target: { file: main.go, after: "first.Status, first.TxID)\n", occurrence: 1 }
        text: "\n\tagain, steps := w.Transfer(req)\n\tfmt.Println(\"retry:\", strings.Join(steps, \" -> \"), \"=>\", again.Status, again.TxID)\n\tfmt.Println(\"same response:\", again == first)\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "same response: true",
          timeoutMs: 8000,
        }
      - id: pt-retry
        type: console.point
        at: { mark: pt-retry }
        target: { text: "retry: key seen -> replay", occurrence: 1 }
      - id: pt-same
        type: console.point
        at: { mark: pt-same }
        target: { text: "same response: true", occurrence: 1 }
      - id: pt-bal2
        type: console.point
        at: { mark: pt-bal2 }
        target: { text: "balances: 1042 60.00", occurrence: 1 }
      - { id: dock-2, type: runtime.collapseDock, at: { mark: dock-2 } }

  - id: books
    narration: >-
      [[mark:type-books]] ဒီတစ်ခါ key အသစ်နဲ့ ယူရို ခုနစ်ဆယ် ထပ်လွှဲခိုင်းပါမယ်၊ ပြီးရင် ခြေလှမ်း ခြောက်က invariant တစ်ခုကို ထည့်ပါမယ်။ ဒီ wallet မှာ ledger အရ user တွေကို ပေးစရာ ရှိတဲ့ စုစုပေါင်းက ဘဏ်ထဲက ငွေနဲ့ ညီရပါမယ်။ outbox ထဲက event တွေကိုလည်း ထုတ်ကြည့်ပါမယ်။ [[mark:run-3]] run
      လိုက်ရအောင်။ [[mark:pt-short]] key အသစ် ဖြစ်ပေမဲ့ ကျန်တဲ့ balance က ခြောက်ဆယ်ပဲ ရှိလို့ ငြင်းပါတယ်၊ key က duplicate ကို ကာကွယ်ပြီး balance check က overdraft ကို ကာကွယ်တာပါ။ [[mark:pt-inv]] ဘဏ်ထဲက ယူရို တစ်ရာက user တွေကို ပေးစရာ တစ်ရာနဲ့ ညီပါတယ်။ [[mark:pt-out]]
      outbox မှာ event တစ်ခုပဲ ရှိပါတယ်၊ retry က event အသစ် မထုတ်လို့ပါ။ [[mark:dock-3]] consumer ဘက်မှာတော့
      relay က event ကို တစ်ခါထက် ပိုပို့နိုင်လို့ event id နဲ့ dedupe လုပ်ရပါမယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Invariants (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#invariants",
        }
      - {
          title: "Fintech Engineering Handbook — Notifying reliably (Outbox and CDC) (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#notifying-reliably-outbox-and-cdc",
        }
    actions:
      - id: type-books
        type: editor.type
        at: { mark: type-books }
        target:
          {
            file: main.go,
            after: "cents(w.ledger.Balance(\"liability:user:2077\")))\n",
            occurrence: 1,
          }
        text: "\n\tshort, _ := w.Transfer(Request{Key: \"k-9b21\", From: req.From, To: req.To, Amount: 70_00})\n\tfmt.Println(\"new key, 70.00 more:\", short.Status)\n\tfmt.Println(\"bank\", cents(w.ledger.Balance(\"asset:bank\")), \"= owed to users\", cents(w.total()))\n\tfmt.Println(\"outbox:\", w.outbox)\n"
        cadence: line-by-line
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "bank 100.00 = owed to users 100.00",
          timeoutMs: 8000,
        }
      - id: pt-short
        type: console.point
        at: { mark: pt-short }
        target: { text: "new key, 70.00 more: 409", occurrence: 1 }
      - id: pt-inv
        type: console.point
        at: { mark: pt-inv }
        target: { text: "bank 100.00 = owed to users 100.00", occurrence: 1 }
      - id: pt-out
        type: console.point
        at: { mark: pt-out }
        target: { text: "outbox: [{evt-1", occurrence: 1 }
      - { id: dock-3, type: runtime.collapseDock, at: { mark: dock-3 } }
      - {
          id: expect-file-retry,
          type: expect.file,
          at: { afterAction: run-3 },
          path: main.go,
          contains: 'fmt.Println("same response:", again == first)',
        }

  - id: arch
    chapter: Architecture နဲ့ it depends
    narration: >-
      [[mark:show-wallet]] interview မှာ ဆွဲပြရမယ့် architecture က ဒီလောက်ပါပဲ။ [[mark:pt-api]] client က key
      တစ်ခုနဲ့ API ကို ခေါ်ပါတယ်။ [[mark:wallet-2]] key store၊ ledger နဲ့ outbox က database transaction
      တစ်ခုထဲမှာ ရှိပါတယ်။ ဒီ boundary က design ရဲ့ အချက်အချာပါ၊ တစ်ခုခု အပြင် system ထဲ ရောက်သွားတာနဲ့ commit
      တစ်ခုတည်း မဖြစ်နိုင်တော့လို့ပါ။ [[mark:wallet-3]] event ကို relay က consumer တွေဆီ အနည်းဆုံး တစ်ခါ
      ပို့ပါတယ်။ [[mark:wallet-4]] ledger ကိုလည်း ဘဏ်ရဲ့ statement နဲ့ နေ့တိုင်း reconcile လုပ်ပါတယ်။
      [[mark:pt-dep]] handbook ရဲ့ author ကိုယ်တိုင်က စာအုပ်ရဲ့ အများစုကို it depends နဲ့ စသင့်တယ်လို့ ရေးထားပြီး၊ အဲဒီအစား safe
      default နဲ့ ဆုံးဖြတ်ဖို့ context ကို ပေးထားပါတယ်။ interview မှာလည်း အရေးကြီးတာက ဘာပေါ် မူတည်လဲ ဆိုတာပါ။ wallet နှစ်ခုကြား ငွေလွှဲတာက ကိုယ့် database
      ထဲမှာပဲ ဖြစ်လို့ balance စစ်တာနဲ့ post လုပ်တာကို တစ်ခါတည်း လုပ်နိုင်ပြီး reservation မလိုပါဘူး။ [[mark:wallet-5]] payout ဆိုရင်တော့ bank ဒါမှမဟုတ် chain ကို ခေါ်ရတဲ့ အဆင့် ကြားထဲ ရောက်လာလို့ reservation၊ resumability နဲ့
      reconciliation အပြည့် လိုလာပါတယ်။ အဲဒီ ကွာခြားချက်ကို ကိုယ်တိုင် ပြောနိုင်တာက senior အဖြေရဲ့ အမှတ်အသားပါ။
    sources:
