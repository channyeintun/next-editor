  - id: moves-b
    narration: >-
      [[mark:moves-4]] စတုတ္ထက အပြင်လောကပါ။ provider API ကို မယုံဘဲ သုံးတာ၊ webhook ကို fact မဟုတ်ဘဲ hint
      အဖြစ် ယူတာ၊ outbox နဲ့ event ထုတ်တာ၊ reconciliation နဲ့ တိုက်စစ်တာပါ၊ lesson ၂၃ ကနေ ၂၆ အထိပါ။ [[mark:moves-5]] ပဉ္စမက control နဲ့
      သက်သေပါ။ audit trail၊ immutability၊ four-eyes နဲ့ access control တို့ဖြစ်ပြီး၊ ဘယ်သူ ဘာကို ဘာကြောင့်
      လုပ်ခဲ့လဲ ဆိုတာကို နောက်မှ ပြနိုင်ဖို့ပါ။ [[mark:moves-6]] ဆဋ္ဌမက ဘာက ပျက်နိုင်လဲ၊ ဘယ်လို စစ်မလဲ ဆိုတာပါ။
      invariant တွေ၊ property-based test နဲ့ crash injection ပါ။ [[mark:pt-p]] ခြေလှမ်း တစ်ခုချင်းက principle
      သုံးချက်ထဲက တစ်ခုခုကို ကာကွယ်ပါတယ်၊ ဒါကြောင့် ဘယ်ခြေလှမ်းကိုမှ ကျော်လို့ မရပါဘူး။ lesson ၃၇ ကနေ ၃၉ အထိ flow သုံးခုက ဒီ ခြေလှမ်းတွေကို withdrawal၊ card deposit နဲ့ conversion ပေါ်မှာ တစ်ခါစီ သုံးပြခဲ့တာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Principles (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#principles",
        }
      - {
