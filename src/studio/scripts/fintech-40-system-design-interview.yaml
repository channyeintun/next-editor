build:
  voiceProfile:
    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 9540

runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "first: new key -> balance checked -> posted tx-2 -> outbox evt-1 => 200 tx-2\nbalances: 1042 60.00, 2077 40.00\n"
      run-2:
        status: success
        exitCode: 0
        output: "first: new key -> balance checked -> posted tx-2 -> outbox evt-1 => 200 tx-2\nretry: key seen -> replay => 200 tx-2\nsame response: true\nbalances: 1042 60.00, 2077 40.00\n"
      run-3:
        status: success
        exitCode: 0
        output: "first: new key -> balance checked -> posted tx-2 -> outbox evt-1 => 200 tx-2\nretry: key seen -> replay => 200 tx-2\nsame response: true\nbalances: 1042 60.00, 2077 40.00\nnew key, 70.00 more: 409\nbank 100.00 = owed to users 100.00\noutbox: [{evt-1 transfer.completed tx-2}]\n"

scenes:
  - id: hook
    chapter: ခြေလှမ်း ခြောက်ခု
    narration: >-
      [[mark:show-moves]] fintech system design interview မှာ user နှစ်ယောက်ကြား ငွေလွှဲတဲ့ wallet transfer API
      တစ်ခု ဒီဇိုင်းဆွဲပါ လို့ မေးလေ့ရှိပါတယ်။ ပုံမှန် backend အဖြေက endpoint တစ်ခု၊ balance column တစ်ခု၊
      update နှစ်ကြောင်းပါ။ အဲဒီ အဖြေက retry လာရင် ငွေ ထပ်ပေါ်တာ၊ crash ဖြစ်ရင် ပျောက်တာ၊ auditor မေးရင်
      ဖြေစရာ မရှိတာကို တစ်ခုမှ မဖြေပါဘူး။ ဒါကြောင့် design မေးခွန်းတိုင်းကို ခြေလှမ်း ခြောက်ခုနဲ့ ဖြေပါ။
      [[mark:pt-m1]] ပထမက ငွေနဲ့ ပတ်သက်တဲ့ fact တွေကို အရင် မေးတာပါ။ currency ဘယ်နှခုလဲ၊ user ငွေကို ဘယ်သူ
      ကိုင်ထားလဲ၊ ဘယ် rail ပေါ်က သွားလဲ၊ ဘာတွေက regulated ဖြစ်လဲ ဆိုတာပါ၊ domain lesson တွေမှာ ကြည့်ခဲ့တာတွေပါ။ [[mark:moves-2]] ဒုတိယက data
      model ပါ။ float မဟုတ်တဲ့ Money type၊ double-entry ledger နဲ့ value၊ booking၊ settlement ဆိုတဲ့ အချိန်
      သုံးမျိုးပါ၊ lesson ၂ ကနေ ၁၁ အထိ ကြည့်ခဲ့တာတွေပါ။ [[mark:moves-3]] တတိယက flow ကို state machine
      အဖြစ် ဆွဲတာပါ။ invariant၊ reservation၊ idempotency key နဲ့ crash ဖြစ်လည်း ဆက်သွားနိုင်တဲ့ resumability ပါ၊ lesson ၁၇ ကနေ ၂၂ အထိပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Principles (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#principles",
        }
      - {
          title: "Fintech Engineering Handbook — Double-entry bookkeeping (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#double-entry-bookkeeping",
        }
    actions:
      - {
          id: show-moves,
          type: slide.show,
          at: { mark: show-moves, offsetMs: -700 },
          slideId: moves-1,
        }
      - {
