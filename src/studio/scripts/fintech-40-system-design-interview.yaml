        }
      - { id: pt-aml, type: slide.point, at: { mark: pt-aml }, target: { x: 0.131, y: 0.839 } }

  - id: close
    chapter: ကိုယ်တိုင် စမ်းကြည့်ပါ
    narration: >-
      [[mark:close-read]] ကိုယ်တိုင် စမ်းကြည့်ဖို့ နှစ်ခု ရှိပါတယ်။ [[mark:sel-try]] transfer ပမာဏကို ယူရို
      တစ်ရာ့နှစ်ဆယ် လို့ ပြောင်းပြီး run ကြည့်ပါ။ balance မလောက်လို့ ပထမ request က ငြင်းခံရပြီး၊ retry ကလည်း အဲဒီ ငြင်းတဲ့ response ကိုပဲ ပြန်ရပါမယ်။ key အသစ်နဲ့ ခုနစ်ဆယ်ကတော့ လောက်လို့ ရသွားပြီး outbox မှာ event တစ်ခုပဲ ရှိပါမယ်။ ပြီးရင် payout API တစ်ခုကို
      ခြေလှမ်း ခြောက်ခုနဲ့ စာရွက်ပေါ်မှာ ဒီဇိုင်းဆွဲကြည့်ပါ၊ bank ကို ခေါ်ရတဲ့ အဆင့် ပါလာတာနဲ့ ဘယ်ခြေလှမ်းတွေ
      ပြောင်းသွားလဲ ဆိုတာ သတိထားကြည့်ပါ။ [[mark:recap]] ပြန်ချုပ်ရရင်၊ fintech design မေးခွန်းတိုင်းကို ခြေလှမ်း
      ခြောက်ခုနဲ့ ဖြေပြီး၊ ဆုံးဖြတ်ချက် တိုင်းကို ငွေ မပေါ်၊ မပျောက်၊ ဘာကိုမှ အလိုလို မယုံ ဆိုတဲ့ principle
      သုံးချက်နဲ့ ချိတ်ပါ။ [[mark:thanks]] ဒီ course က Voytek Pitula ရေးတဲ့ Fintech Engineering Handbook ကို အခြေခံထားပြီး၊ handbook က Creative Commons Attribution လေး ဒသမ သုည
      license နဲ့ ထုတ်ထားတာပါ။ handbook ကို payment၊ accounting၊ controlling
      နဲ့ treasury ဘက်က fiat ရော crypto ရော အတွေ့အကြုံကနေ ရေးထားပြီး၊ ဆက်ပြီး update လုပ်နေတဲ့ document
      ပါ၊ feedback ကို GitHub Issues မှာ ပေးနိုင်ပါတယ်။ [[mark:advice]] handbook ကိုယ်တိုင် ပြောထားသလို ဒီထဲက ဘာမှ legal၊
      compliance ဒါမှမဟုတ် financial advice မဟုတ်ပါဘူး။ course ကို အဆုံးထိ လိုက်ခဲ့တဲ့အတွက် ကျေးဇူးတင်ပါတယ်
      ခင်ဗျာ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Appendix C: About this handbook (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/",
        }
      - {
          title: "Creative Commons — Attribution 4.0 International (CC BY 4.0)",
          url: "https://creativecommons.org/licenses/by/4.0/",
        }
    actions:
      - { id: close-read, type: slide.close, at: { mark: close-read } }
      - id: sel-try
        type: editor.select
        at: { mark: sel-try }
        target: { file: main.go, text: "Amount: 40_00}", occurrence: 1 }

checks:
