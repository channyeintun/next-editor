  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] ဒီ မေးခွန်းမှာ interviewer တွေ နားထောင်တာက box တွေထက် အချက် သုံးချက် ဖြစ်တတ်ပါတယ်။
      [[mark:iv-a]] ပထမ၊ principle သုံးချက်ကို ကိုယ့်စကားနဲ့ ပြောပြီး ဆုံးဖြတ်ချက် တစ်ခုချင်းကို ချိတ်ပြတာပါ။ key
      store က ငွေ မပေါ်အောင်၊ outbox က event မပျောက်အောင်၊ reconciliation က ဘာကိုမှ အလိုလို မယုံလို့ ဆိုတာမျိုးပါ။
      [[mark:iv-b]] ဒုတိယ၊ trade-off ကို နာမည်တပ်ပြောတာပါ၊ strong consistency နဲ့ latency၊ reservation ရဲ့
      ရှုပ်ထွေးမှုနဲ့ ဘေးကင်းမှု စတာတွေပါ။ [[mark:iv-c]] တတိယ၊ it depends လို့ ပြောရင် ဘာပေါ် မူတည်လဲ ဆိုတာ
      ဆက်ပြောတာပါ။ [[mark:iv-d]] ပြီးရင် ခြေလှမ်း ခြောက်ခုကို အစဉ်လိုက် သွားပါ။ money fact တွေကို အရင် မေးပြီးမှ box
      ဆွဲပြီး၊ failure mode တွေအတွက် အချိန် ချန်ထားပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Principles (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#principles",
        }
    actions:
      - { id: show-iv, type: slide.show, at: { mark: show-iv, offsetMs: -700 }, slideId: iv-1 }
      - {
          id: pt-iv-q,
          type: slide.point,
