  - id: read
    chapter: နောက် ဘာဖတ်မလဲ
    narration: >-
      [[mark:show-read]] handbook က ဆက်ဖတ်ဖို့ စာရင်းကို layer အလိုက် ပေးထားပါတယ်၊ ကိုယ် လိုနေတဲ့ အပိုင်းကို
      ရွေးဖတ်နိုင်အောင်ပါ။ [[mark:pt-acc]] accounting အတွက် Accounting for Computer Scientists က double-entry
      ကို graph နဲ့ data model အဖြစ် engineer တွေအတွက် ရှင်းထားတဲ့ essay ပါ။ The Accounting Game၊ Basic Accounting Fresh from the Lemonade Stand က lemonade stand ဥပမာ တစ်ခုနဲ့ finance နောက်ခံ မလိုဘဲ အခြေခံကနေ သင်ပေးပါတယ်။ Modern Treasury ရဲ့ How to Scale a Ledger က production ledger
      ဆောက်ပုံကို software engineering ဘက်ကနေ ပြပါတယ်။ [[mark:pt-pay]] payment အတွက် Payments Systems in the US က US ကို ဗဟိုပြုပြီး ဘဏ်တွေကြား ငွေရွှေ့ပုံကို card၊ ACH၊ wire နဲ့ check အထိ reference ပုံစံနဲ့ ပြပါတယ်။ The Anatomy of the Swipe က card ကို tap လုပ်တာကနေ ငွေ ရောက်တဲ့အထိ ရှင်းပါတယ်။ [[mark:pt-mkt]] Trading and Exchanges၊ Market Microstructure for Practitioners က order book၊ maker၊ taker နဲ့ spread တွေ ဘယ်က လာလဲ ဆိုတာကို အသေးစိတ် ပြပါတယ်။ [[mark:pt-cry]] Mastering Bitcoin
      နဲ့ Mastering Ethereum က UTXO နဲ့ account model နှစ်ခုအတွက် developer အဆင့် reference တွေပါ။
      [[mark:read-2]] Designing Data-Intensive Applications က idempotency၊ log၊ consistency နဲ့ ဒီ course ထဲက
      failure mode တွေကို system ဘက်ကနေ ကြည့်ပါတယ်။ [[mark:pt-aml]] KYC နဲ့ AML အတွက်တော့ Anti-Money
      Laundering in a Nutshell က တိုတိုနဲ့ မိတ်ဆက်ပေးပြီး၊ Mastering Anti-Money Laundering and Counter-Terrorist
      Financing က ပိုလေးတဲ့ practitioner guide ပါ။ ဒီ နှစ်အုပ်က compliance professional တွေအတွက် ရေးထားလို့
      domain ကိုယ်တိုင် လိုမှ ဖတ်ပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Resources (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#resources",
        }
    actions:
      - {
          id: show-read,
          type: slide.show,
          at: { mark: show-read, offsetMs: -700 },
          slideId: read-1,
        }
      - { id: pt-acc, type: slide.point, at: { mark: pt-acc }, target: { x: 0.131, y: 0.341 } }
      - { id: pt-pay, type: slide.point, at: { mark: pt-pay }, target: { x: 0.131, y: 0.528 } }
      - { id: pt-mkt, type: slide.point, at: { mark: pt-mkt }, target: { x: 0.131, y: 0.652 } }
      - { id: pt-cry, type: slide.point, at: { mark: pt-cry }, target: { x: 0.131, y: 0.714 } }
      - { id: read-2, type: slide.show, at: { mark: read-2 }, slideId: read-2 }
      - {
          id: pt-ddia,
          type: slide.point,
          at: { afterAction: read-2 },
