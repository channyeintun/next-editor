  environment: {}

scenes:
  - id: need
    chapter: Promo code တစ်ခုရဲ့ ခရီး
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ system ကို network ပေါ်က service တွေအဖြစ် ခွဲလိုက်ရင် ဘာတွေ ရပြီး ဘာတွေ
      ပေးဆပ်ရလဲ ဆိုတာ ကြည့်ပြီး၊ ခိုင်လုံတဲ့ အကြောင်းပြချက် မရှိသေးသရွေ့ app တစ်ခုတည်းနဲ့ပဲ ဆက်သွားမယ်လို့
      ဆုံးဖြတ်ခဲ့ပါတယ်။
      [[mark:readme]] ဒါဆို အဲဒီ app တစ်ခုတည်းရဲ့ အထဲကိုကော ဘယ်လို ပုံစံနဲ့ ဖွဲ့စည်းထားသင့်လဲ။ ဒီ မေးခွန်းက
      အလုပ် တစ်ခုကနေ ပေါ်လာတာပါ။ product manager လှလှ က ခရီးသည်တွေ လက်မှတ် ဝယ်တဲ့အခါ
      promo code ထည့်ပြီး ဈေးလျှော့ရအောင် လုပ်ပေးဖို့ တောင်းဆိုခဲ့ပါတယ်။ ကြားရတာတော့ အလုပ်သေးသေး
      တစ်ခုပါပဲ။ Booking team lead မောင်မောင် ကလည်း နှစ်ရက်လောက်နဲ့ ပြီးမယ်လို့ ခန့်မှန်းခဲ့ပါတယ်။
      [[mark:l-open]] ခရီးဖော် ရဲ့ code ကို အစကတည်းက အလွှာ သုံးလွှာ ခွဲပြီး ရေးလာခဲ့ကြပါတယ်။
      [[mark:l-pres]] အပေါ်ဆုံး အလွှာက presentation ပါ။ ခရီးသည်နဲ့ ကောင်တာ ဝန်ထမ်းတွေ မြင်ရတဲ့ screen တွေ၊
      API တွေ ရှိတဲ့ နေရာပါ။
      [[mark:l-biz]] အလယ်က business အလွှာမှာတော့ ဈေး ဘယ်လို တွက်မလဲ၊ ထိုင်ခုံကို ဘယ်လောက်ကြာ ကြိုယူထားပေးမလဲ
      ဆိုတဲ့ စည်းမျဉ်းတွေ ရှိပါတယ်။
      [[mark:l-data]] အောက်ဆုံးက data access အလွှာကတော့ database ထဲက data ကို ဖတ်တာ၊ ရေးတာတွေကို
      တာဝန်ယူပါတယ်။
      [[mark:l-c1]] promo code ကို ထည့်ဖို့ Booking team က ဘာတွေ ပြင်ရလဲ ကြည့်ရအောင်။ presentation အလွှာမှာ code
      ရိုက်ထည့်ဖို့ အကွက် အသစ် တစ်ခု ထည့်ရပါတယ်။
      [[mark:l-c2]] business အလွှာမှာ ဈေး တွက်နည်းကို ပြင်ရပါတယ်။
      [[mark:l-c3]] data access အလွှာမှာ query အသစ် ရေးရပြီး၊ database မှာလည်း column အသစ် တစ်ခု ထည့်ရပါတယ်။
      [[mark:l-cut]] အလုပ်သေးသေး တစ်ခုက အပေါ်ဆုံးကနေ အောက်ဆုံးအထိ အလွှာတိုင်းကို ဖြတ်သွားတာပါ။ အဲဒီ
      အလွှာတွေထဲက file တွေကို Operator team နဲ့ Payment team ကလည်း အဲဒီအပတ်ထဲမှာပဲ ပြင်နေကြတော့၊ code တွေ
      တိုက်မိပြီး နှစ်ရက်လို့ မှန်းထားတဲ့ အလုပ်က တစ်ပတ်ကျော် ကြာသွားခဲ့ပါတယ်။
    sources:
