# Go course, lesson 17: pointers (Burmese).
#
# Start state: main.go with the lesson-16 Parcel (Code, To, WeightKg, Delivered), and a main that
# makes one parcel and prints its code and Delivered.
# Edits, all insert-only:
#   1. markDelivered(p Parcel) and its call before the Println -> run-1: MDY-0001 false (a copy);
#   2. markDeliveredPtr(p *Parcel), a call with &p and a second Println -> run-2 adds
#      MDY-0001 true;
#   3. codText(cod *int) (nil = already paid), cod := new(15000) and two Printlns -> run-3 adds
#      15000 ကျပ် ကောက်ရန် / ငွေချေပြီး.
# Boards: (C) a photocopy of the label (by value) vs the shelf number (pointer); (N) nil = a blank
# shelf number, the nil-pointer panic's first line (board only); (Q) quiz (b := &a).
# Fixtures: bun ~/Documents/go-course-work/tools/sim-go.ts <this yaml> --write
schemaVersion: 1

lesson:
  slug: go-course-17-pointers
  title: "Go course 17: Pointer ဆိုတာ"
  locale: my-MM
  workspace:
    lessonType: go
    name: Go Course
    entryFilePath: main.go
    # One file: an open explorer would be a list of one beside the code.
    sidebarStartsCollapsed: true
    files:
      main.go: |
        package main

        import "fmt"

        // Parcel is one parcel handed in at the counter.
        type Parcel struct {
        	Code      string
        	To        string
        	WeightKg  float64
        	Delivered bool
        }

        func main() {
        	p := Parcel{Code: "MDY-0001", To: "MDY", WeightKg: 2.5}
        	fmt.Println(p.Code, p.Delivered)
        }
