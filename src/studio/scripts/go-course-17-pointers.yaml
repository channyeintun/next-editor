build:
  voiceProfile:
    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 7117

runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "MDY-0001 false\n"
      run-2:
        status: success
        exitCode: 0
        output: "MDY-0001 false\nMDY-0001 true\n"
      run-3:
        status: success
        exitCode: 0
        output: "MDY-0001 false\nMDY-0001 true\n15000 ကျပ် ကောက်ရန်\nငွေချေပြီး\n"

scenes:
  - id: recall
    chapter: Function က မိတ္တူကို ရတယ်
    narration: >-
      ပြီးခဲ့တဲ့ lesson မှာ ပါဆယ် တစ်ထုပ်ရဲ့ အချက်တွေကို Parcel ဆိုတဲ့ struct ထဲမှာ စုပြီး၊ ပါဆယ်တွေကို slice ထဲမှာ
      စီထားခဲ့ပါတယ်။ ဒီ lesson မှာတော့ rider က ပါဆယ်ကို လက်ခံသူဆီ ရောက်အောင် ပို့ပြီးတဲ့အခါ၊ ပို့ပြီးကြောင်း မှတ်ပေးတဲ့
      function တစ်ခု ရေးကြည့်ပါမယ်။ [[mark:sel-delivered]] main ဖိုင်က Parcel ကို ကြည့်ပါ။ ဒီနေ့ ပို့ခ field မလိုလို့ ချန်ထားပြီး၊ ပို့ပြီးပြီလား ဆိုတာ မှတ်ထားမယ့် bool field တစ်ခု ထည့်ထားပါတယ်။ main ထဲက ပါဆယ်မှာ
      အဲဒီ field ကို မဖြည့်ထားလို့ zero value ဖြစ်တဲ့ false နဲ့ စပါတယ်။ [[mark:type-mark]] Parcel type ရဲ့ အောက်မှာ
      ပါဆယ် တစ်ထုပ်ကို ယူပြီး၊ ပို့ပြီးကြောင်း field ကို true ပြောင်းပေးတဲ့ function တစ်ခု ရေးပါမယ်။
      [[mark:type-call]] ပြီးတော့ main ထဲမှာ print မထုတ်ခင် အဲဒီ function ကို ခေါ်ပါမယ်။ ဒါဆို print ထုတ်တဲ့အခါ true
      ထွက်လာမယ်လို့ ထင်ရပါတယ်။ [[mark:run-1]] ကဲ၊ run လိုက်ရအောင်။
    sources:
      - {
          title: "The Go Programming Language Specification — Calls",
          url: "https://go.dev/ref/spec#Calls",
        }
      - {
          title: "The Go Programming Language Specification — The zero value",
          url: "https://go.dev/ref/spec#The_zero_value",
        }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }
      - id: sel-delivered
        type: editor.select
        at: { mark: sel-delivered }
        target: { file: main.go, text: "Delivered bool", occurrence: 1 }
      - id: type-mark
        type: editor.type
        at: { mark: type-mark }
        target: { file: main.go, after: "\tDelivered bool\n}\n", occurrence: 1 }
        text: "\nfunc markDelivered(p Parcel) {\n\tp.Delivered = true\n}\n"
        cadence: line-by-line
      - id: type-call
        type: editor.type
        at: { mark: type-call }
        target: { file: main.go, after: "WeightKg: 2.5}\n", occurrence: 1 }
        text: "\tmarkDelivered(p)\n"
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "MDY-0001 false",
          timeoutMs: 8000,
        }

  - id: copy
    narration: >-
      [[mark:point-false]] output မှာ ပါဆယ် code နဲ့ false ပဲ ထွက်လာပါတယ်။ compile error လည်း မရှိ၊ panic လည်း
      မဖြစ်ဘဲ program က ပုံမှန် ပြီးသွားပေမဲ့၊ ကိုယ် မျှော်လင့်ထားတဲ့ true မဟုတ်ပါဘူး။ ဒါက ဘာ error မှ မပြတဲ့ bug
      မျိုးပါ။ ဘာကြောင့် ဖြစ်တာလဲ ကြည့်ရအောင်။ [[mark:board-copy]] Go မှာ function ကို ခေါ်တဲ့အခါ၊ ထည့်ပေးလိုက်တဲ့
      argument တွေကို မိတ္တူ ကူးပြီးမှ function ဆီ ပေးပါတယ်။ [[mark:draw-copy]] ဆိုလိုတာက main ထဲက ပါဆယ်ကို
      function ဆီ ပို့လိုက်တဲ့အခါ၊ label အစစ်ကို မပေးဘဲ မိတ္တူ စာရွက် တစ်ရွက်ကို ပေးလိုက်တာပါ။ function က အဲဒီ
      မိတ္တူပေါ်မှာ true လို့ ရေးလိုက်ပေမဲ့၊ function ပြီးသွားတာနဲ့ မိတ္တူလည်း ပျောက်သွားပါတယ်။ [[mark:draw-copy-note]]
      main ထဲက မူရင်း ပါဆယ်ကိုတော့ ဘယ်သူမှ မထိခဲ့လို့ false အတိုင်း ကျန်နေတာပါ။ int တို့ string တို့ကို ပေးတဲ့အခါ
      မိတ္တူ ကူးပေးသလိုပဲ၊ struct ကို ပေးတဲ့အခါလည်း field တွေ အားလုံးကို မိတ္တူ ကူးပေးပါတယ်။
    sources:
      - {
          title: "Go FAQ — When are function parameters passed by value?",
          url: "https://go.dev/doc/faq#pass_by_value",
        }
      - {
          title: "The Go Programming Language Specification — Calls",
          url: "https://go.dev/ref/spec#Calls",
        }
    actions:
      - {
          id: point-false,
          type: console.point,
          at: { mark: point-false },
          target: { text: "MDY-0001 false" },
        }
      - { id: collapse-1, type: runtime.collapseDock, at: { mark: board-copy } }
      - {
          id: board-copy,
          type: whiteboard.apply,
          at: { afterAction: collapse-1 },
          open: true,
          clear: true,
          upsertIds: [c-title],
        }
      - {
          id: draw-copy,
          type: whiteboard.apply,
          at: { mark: draw-copy },
          upsertIds: [c-orig, c-orig-t, c-arrow1, c-copy, c-copy-t],
          drawMs: 2400,
        }
      - {
          id: draw-copy-note,
          type: whiteboard.apply,
          at: { mark: draw-copy-note },
          upsertIds: [c-copy-note, c-copy-line],
          drawMs: 1400,
        }

  - id: shelf
    chapter: Pointer ဆိုတာ
    narration: >-
      [[mark:draw-shelf]] ဒါဆို function က ပါဆယ် အစစ်ကို ပြင်ချင်ရင် ဘာလုပ်ရမလဲ။ ပါဆယ် ရုံးမှာ ပါဆယ်တိုင်းကို စင်ပေါ်မှာ
      တင်ထားပြီး၊ စင် တစ်ခုစီမှာ နံပါတ် ရှိတယ် ဆိုပါစို့။ rider ကို ပါဆယ် မိတ္တူ မပေးဘဲ စင် နံပါတ်ကို ပေးလိုက်ရင်၊ သူက
      အဲဒီ စင်ကို သွားပြီး ပါဆယ် အစစ်ကို ကိုင်နိုင်ပါတယ်။ [[mark:shelf-name]] Go မှာလည်း ဒီ စင် နံပါတ်လိုပဲ၊ တန်ဖိုး တစ်ခု ရှိနေတဲ့ နေရာကို address လို့ ခေါ်ပြီး၊ အဲဒီ address ကို ကိုင်ထားတဲ့ တန်ဖိုးကို pointer လို့ ခေါ်ပါတယ်။ ဆိုလိုတာက pointer ဆိုတာ တန်ဖိုး ရှိနေတဲ့ နေရာကို ညွှန်ပြတာပါ။
      [[mark:draw-shelf-note]] board ပေါ်မှာ ပြထားတဲ့ အတိုင်း၊ variable နာမည်ရဲ့ ရှေ့မှာ address ယူတဲ့ သင်္ကေတ ထည့်ရင်
      အဲဒီ variable ရဲ့ address ကို ရပါတယ်။ type နာမည်ရဲ့ ရှေ့မှာ pointer သင်္ကေတ ထည့်ရင်တော့၊ Parcel ကိုယ်တိုင်
      မဟုတ်ဘဲ Parcel ရဲ့ pointer ဆိုတဲ့ type ဖြစ်သွားပါတယ်။
    sources:
      - {
          title: "The Go Programming Language Specification — Pointer types",
          url: "https://go.dev/ref/spec#Pointer_types",
        }
      - {
          title: "The Go Programming Language Specification — Address operators",
          url: "https://go.dev/ref/spec#Address_operators",
        }
    actions:
      - {
          id: draw-shelf,
          type: whiteboard.apply,
          at: { mark: draw-shelf },
          upsertIds: [c-addr, c-addr-t, c-arrow2, c-real, c-real-t],
          drawMs: 2600,
        }
      - {
          id: draw-shelf-note,
          type: whiteboard.apply,
          at: { mark: draw-shelf-note },
          upsertIds: [c-ptr-note],
          drawMs: 1200,
        }

  - id: pointer-func
    narration: >-
      [[mark:close-copy]] ကဲ၊ code နဲ့ ရေးကြည့်ရအောင်။ [[mark:type-ptr]] ပထမ function ကို နှိုင်းယှဉ်ကြည့်ဖို့ ထားခဲ့ပြီး၊ သူ့
      အောက်မှာ pointer ကို ယူတဲ့ function အသစ် တစ်ခု ရေးပါမယ်။ [[mark:sel-ptr-param]] ဒီ parameter ကို ကြည့်ပါ။
      type က Parcel မဟုတ်တော့ဘဲ Parcel ရဲ့ pointer ပါ။ ဒါကြောင့် ဒီ function ကို ခေါ်တဲ့အခါ မိတ္တူ မရတော့ဘဲ ပါဆယ်
      ရှိနေတဲ့ နေရာကို ရပါတယ်။ အထဲက line ကတော့ ပထမ function နဲ့ အတူတူပါပဲ။ p က pointer ဖြစ်ပေမဲ့ field နာမည်ကို
      တိုက်ရိုက် ရေးလို့ ရတာက၊ Go က pointer ကို လိုက်သွားပြီး ပါဆယ် အစစ်ရဲ့ field ကို ပြင်ပေးလို့ပါ။
      [[mark:type-ptr-call]] main ထဲမှာတော့ function အသစ်ကို ပါဆယ်ရဲ့ address နဲ့ ခေါ်ပြီး၊ နောက်တစ်ခါ print ထုတ်ပါမယ်။
      [[mark:sel-addr]] ဒီ argument ကို ကြည့်ပါ။ p ရဲ့ ရှေ့က သင်္ကေတက ပါဆယ် အစစ် ရှိနေတဲ့ address ကို ယူပေးတာပါ။
      rider ကို စင် နံပါတ် ပေးလိုက်တာနဲ့ အတူတူပါပဲ။ [[mark:run-2]] ကဲ၊ run လိုက်ရအောင်။
    sources:
      - {
          title: "The Go Programming Language Specification — Selectors",
          url: "https://go.dev/ref/spec#Selectors",
        }
      - {
          title: "The Go Programming Language Specification — Address operators",
          url: "https://go.dev/ref/spec#Address_operators",
        }
    actions:
      - {
          id: close-copy,
          type: whiteboard.apply,
          at: { mark: close-copy },
          open: false,
          upsertIds: [],
        }
      - id: type-ptr
        type: editor.type
        at: { mark: type-ptr }
        target: { file: main.go, after: "\tp.Delivered = true\n}\n", occurrence: 1 }
        text: "\nfunc markDeliveredPtr(p *Parcel) {\n\tp.Delivered = true\n}\n"
        cadence: line-by-line
      - id: sel-ptr-param
        type: editor.select
        at: { mark: sel-ptr-param }
        target: { file: main.go, text: "p *Parcel", occurrence: 1 }
      - id: type-ptr-call
        type: editor.type
        at: { mark: type-ptr-call }
        target: { file: main.go, after: "\tfmt.Println(p.Code, p.Delivered)\n", occurrence: 1 }
        text: "\tmarkDeliveredPtr(&p)\n\tfmt.Println(p.Code, p.Delivered)\n"
        cadence: line-by-line
      - id: sel-addr
        type: editor.select
        at: { mark: sel-addr }
        target: { file: main.go, text: "&p", occurrence: 1 }
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "MDY-0001 true",
          timeoutMs: 8000,
        }
      - {
          id: expect-file-ptr,
          type: expect.file,
          at: { afterAction: run-2 },
          path: main.go,
          contains: "func markDeliveredPtr(p *Parcel) {\n\tp.Delivered = true\n}\n",
        }

  - id: read-2
    narration: >-
      [[mark:point-true]] ဒုတိယ စာကြောင်းမှာတော့ true ဖြစ်သွားပါပြီ။ ပထမ စာကြောင်းက မိတ္တူကို ပြင်ခဲ့လို့ false ဖြစ်ပြီး၊
      ဒုတိယ စာကြောင်းကတော့ address ကနေ ပါဆယ် အစစ်ကို ပြင်ခဲ့လို့ true ဖြစ်တာပါ။ function နှစ်ခုရဲ့ အထဲက code က
      အတူတူ ဖြစ်ပေမဲ့၊ မိတ္တူကို ယူသလား၊ address ကို ယူသလား ဆိုတဲ့ တစ်ချက်တည်းကြောင့် ရလဒ် ပြောင်းသွားတာပါ။ တကယ့် program မှာဆိုရင် pointer ယူတဲ့ function တစ်ခုတည်းကိုပဲ ထားမှာပါ၊ ဒီမှာတော့ နှိုင်းယှဉ်ကြည့်ဖို့ နှစ်ခုလုံး ထားခဲ့တာပါ။
    sources:
      - {
          title: "Go FAQ — When are function parameters passed by value?",
          url: "https://go.dev/doc/faq#pass_by_value",
        }
    actions:
      - {
          id: point-true,
          type: console.point,
          at: { mark: point-true },
          target: { text: "MDY-0001 true" },
        }

  - id: cod
    chapter: nil နဲ့ new
    narration: >-
      [[mark:collapse-2]] pointer ကို နောက်ထပ် အသုံးဝင်တဲ့ နေရာ တစ်ခုမှာလည်း သုံးပါတယ်။ ပါဆယ် တချို့က အိမ်ရောက်ငွေချေ
      ဖြစ်ပါတယ်။ ဆိုလိုတာက လက်ခံသူက ပစ္စည်းဖိုးကို rider ဆီမှာ ပေးရတာပါ။ တချို့ ပါဆယ်ကတော့ ပို့သူက ကြိုပေးပြီးသား
      ဖြစ်လို့ ကောက်စရာ မရှိပါဘူး။ ကောက်ရမယ့် ငွေ ရှိလား မရှိလား ဆိုတာနဲ့၊ ရှိရင် ဘယ်လောက်လဲ ဆိုတာ နှစ်ခုလုံးကို pointer
      တစ်ခုတည်းနဲ့ ပြောလို့ ရပါတယ်။ [[mark:why-pointer]] int တစ်ခုတည်းကိုပဲ သုံးရင် zero value က သုည ဖြစ်လို့၊ ငွေ
      ကောက်စရာ မရှိတာနဲ့ ငွေပမာဏ ထည့်ဖို့ မေ့ကျန်ခဲ့တာကို ခွဲပြောလို့ မရပါဘူး။ pointer ဆိုရင်တော့ nil က ကောက်စရာ
      မရှိဘူး ဆိုတာကို ရှင်းရှင်း ပြောပေးနိုင်ပါတယ်။ [[mark:type-cod]] ကောက်ရမယ့် ငွေရဲ့ pointer ကို ယူပြီး၊ rider ကို ဘာ ကောက်ရမလဲ
      ပြောပေးတဲ့ function တစ်ခု ရေးပါမယ်။ [[mark:sel-nil]] ဒီ condition ကို ကြည့်ပါ။ nil ဆိုတာ pointer က ဘာကိုမှ
      မညွှန်ရသေးတဲ့ အခြေအနေပါ၊ စင် နံပါတ် ကွက်လပ်ကို မဖြည့်ထားသလိုပါပဲ။ ဒီ program မှာတော့ nil ကို ငွေချေပြီးသား
      လို့ အဓိပ္ပာယ် ယူထားပါတယ်။ [[mark:sel-deref]] nil မဟုတ်ရင်တော့ ဒီ အပိုင်းက pointer ကို လိုက်သွားပြီး၊ အဲဒီ နေရာမှာ
      ရှိတဲ့ ငွေပမာဏကို ဖတ်ပါတယ်။ ရှေ့က သင်္ကေတက pointer ညွှန်ထားတဲ့ နေရာက တန်ဖိုးကို ယူပါ လို့ ပြောတာပါ။
    sources:
      - {
          title: "The Go Programming Language Specification — Address operators",
          url: "https://go.dev/ref/spec#Address_operators",
        }
      - {
          title: "The Go Programming Language Specification — Pointer types",
          url: "https://go.dev/ref/spec#Pointer_types",
        }
    actions:
      - { id: collapse-2, type: runtime.collapseDock, at: { mark: collapse-2 } }
      - id: type-cod
        type: editor.type
        at: { mark: type-cod }
        target:
          {
            file: main.go,
            after: "func markDeliveredPtr(p *Parcel) {\n\tp.Delivered = true\n}\n",
            occurrence: 1,
          }
        text: "\n// codText says what the rider collects: nil means the sender already paid.\nfunc codText(cod *int) string {\n\tif cod == nil {\n\t\treturn \"ငွေချေပြီး\"\n\t}\n\treturn fmt.Sprint(*cod, \" ကျပ် ကောက်ရန်\")\n}\n"
        cadence: line-by-line
      - id: sel-nil
        type: editor.select
        at: { mark: sel-nil }
        target: { file: main.go, text: "if cod == nil {", occurrence: 1 }
      - id: sel-deref
        type: editor.select
        at: { mark: sel-deref }
        target: { file: main.go, text: "*cod", occurrence: 1 }

  - id: new-value
    narration: >-
      [[mark:type-new]] main ထဲမှာ ကောက်ရမယ့် ငွေ ၁၅၀၀၀ ကျပ် အတွက် pointer တစ်ခု လုပ်ပြီး၊ ငွေ ကောက်ရမယ့် ပါဆယ်နဲ့
      ငွေချေပြီးသား ပါဆယ် နှစ်မျိုးလုံးကို print ထုတ်ပါမယ်။ [[mark:sel-new]] ဒီ အပိုင်းကို ကြည့်ပါ။ new က တန်ဖိုး ၁၅၀၀၀
      ပါတဲ့ int အသစ် တစ်ခုကို လုပ်ပြီး၊ အဲဒီ int ရှိနေတဲ့ နေရာရဲ့ address ကို ပြန်ပေးပါတယ်။ Go ရဲ့ နောက်ပိုင်း version
      တွေမှာ new ထဲကို ဒီလို တန်ဖိုး တိုက်ရိုက် ထည့်ပေးလို့ ရလာတာပါ။ [[mark:before-new]] အရင်ကဆိုရင် ငွေပမာဏ အတွက်
      variable တစ်ခု အရင် ကြေညာပြီး၊ နောက် line မှာ အဲဒီ variable ရဲ့ address ကို ယူရပါတယ်။ new က အဲဒီ line နှစ်ကြောင်းကို
      တစ်ကြောင်းတည်း ဖြစ်သွားစေတာပါ။ function ကို ဒုတိယ အကြိမ် ခေါ်တဲ့ နေရာမှာတော့ ဘာကိုမှ မညွှန်တဲ့ nil ကို
      တိုက်ရိုက် ပေးထားပါတယ်။ [[mark:run-3]] ကဲ၊ run လိုက်ရအောင်။
    sources:
      - {
          title: "The Go Programming Language Specification — Allocation",
          url: "https://go.dev/ref/spec#Allocation",
        }
      - { title: "Go 1.26 Release Notes", url: "https://go.dev/doc/go1.26" }
    actions:
      - id: type-new
        type: editor.type
        at: { mark: type-new }
        target:
          {
            file: main.go,
            after: "\tmarkDeliveredPtr(&p)\n\tfmt.Println(p.Code, p.Delivered)\n",
            occurrence: 1,
          }
        text: "\tcod := new(15000)\n\tfmt.Println(codText(cod))\n\tfmt.Println(codText(nil))\n"
        cadence: line-by-line
      - id: sel-new
        type: editor.select
        at: { mark: sel-new }
        target: { file: main.go, text: "new(15000)", occurrence: 1 }
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "15000 ကျပ် ကောက်ရန်",
          timeoutMs: 8000,
        }
      - {
          id: expect-file-new,
          type: expect.file,
          at: { afterAction: run-3 },
          path: main.go,
          contains: "\tcod := new(15000)\n",
        }

  - id: read-3
    narration: >-
      [[mark:point-cod]] တတိယ စာကြောင်းမှာ rider က ၁၅၀၀၀ ကျပ် ကောက်ရမယ်လို့ ထွက်လာပါတယ်။ function က pointer ကို
      လိုက်သွားပြီး၊ အဲဒီ နေရာက တန်ဖိုးကို ဖတ်ခဲ့လို့ပါ။ [[mark:point-paid]] နောက်ဆုံး စာကြောင်းမှာတော့ ငွေချေပြီး လို့
      ထွက်ပါတယ်။ pointer က nil ဖြစ်နေလို့ function က pointer ကို လိုက်မသွားဘဲ၊ condition ထဲကနေ စောစော ပြန်ထွက်သွားတာပါ။
      ဒီလိုနဲ့ pointer တစ်ခုတည်းက ကောက်ရမယ့် ငွေ ရှိမရှိ ဆိုတာရော၊ ဘယ်လောက်လဲ ဆိုတာရော နှစ်ခုလုံးကို ပြောပေးနိုင်တာ
      မြင်ရပါပြီ။
    sources:
      - {
          title: "The Go Programming Language Specification — Address operators",
          url: "https://go.dev/ref/spec#Address_operators",
        }
    actions:
      - {
          id: point-cod,
          type: console.point,
          at: { mark: point-cod },
          target: { text: "15000 ကျပ် ကောက်ရန်" },
        }
      - {
          id: point-paid,
          type: console.point,
          at: { mark: point-paid },
          target: { text: "ငွေချေပြီး" },
        }

  - id: nil-panic
    narration: >-
      [[mark:board-nil]] ဒီ condition က ဘာကြောင့် အရေးကြီးလဲ ဆိုတော့၊ nil pointer ကို လိုက်သွားဖို့ ကြိုးစားရင် program
      ရပ်သွားလို့ပါ။ [[mark:draw-nil]] စင် နံပါတ် အလွတ် ရေးထားတဲ့ စာရွက်ကို ကိုင်ပြီး စင်ကို သွားရှာသလိုပါပဲ၊ သွားစရာ
      နေရာ မရှိပါဘူး။ [[mark:draw-panic]] condition မပါဘဲ nil ကနေ တန်ဖိုး ဖတ်ရင်၊ compile ကတော့ လက်ခံပေမဲ့ run
      နေတုန်းမှာ panic ဖြစ်ပြီး board ပေါ်က စာကြောင်း ထွက်လာပါမယ်။ nil pointer ကနေ တန်ဖိုး ဖတ်ဖို့ ကြိုးစားလို့ program
      ရပ်သွားတာပါ။ [[mark:draw-guard]] ဒါကြောင့် nil ဖြစ်နိုင်တဲ့ pointer ကို မသုံးခင် nil လား ဆိုတာ အရင် စစ်ပါ။ ကိုယ့်
      function ထဲက condition က အဲဒီ အလုပ်ကို လုပ်ပေးနေလို့ ခုနက nil ကို ပေးတဲ့အခါမှာ program မရပ်သွားတာပါ။
    sources:
      - {
          title: "The Go Programming Language Specification — Address operators",
          url: "https://go.dev/ref/spec#Address_operators",
        }
      - {
          title: "The Go Programming Language Specification — Selectors",
          url: "https://go.dev/ref/spec#Selectors",
        }
    actions:
      - { id: collapse-3, type: runtime.collapseDock, at: { mark: board-nil } }
      - {
          id: board-nil,
          type: whiteboard.apply,
          at: { afterAction: collapse-3 },
          open: true,
          clear: true,
          upsertIds: [n-title],
        }
      - {
          id: draw-nil,
          type: whiteboard.apply,
          at: { mark: draw-nil },
          upsertIds: [n-box, n-t],
          drawMs: 1600,
        }
      - {
          id: draw-panic,
          type: whiteboard.apply,
          at: { mark: draw-panic },
          upsertIds: [n-err, n-e1, n-e2],
          drawMs: 2400,
        }
      - {
          id: draw-guard,
          type: whiteboard.apply,
          at: { mark: draw-guard },
          upsertIds: [n-guard-box, n-guard, n-guard-t],
          drawMs: 2000,
        }

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >-
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ board ပေါ်က code မှာ ပါဆယ် တစ်ထုပ်ကို a ထဲမှာ ထည့်ထားပါတယ်။
      [[mark:quiz-line]] ပြီးတော့ b ထဲမှာ a ရဲ့ address ကို ထည့်ပြီး၊ b ကနေ ပို့ပြီးကြောင်း field ကို true ပြောင်းပါတယ်။
      နောက်ဆုံးမှာ a ရဲ့ field ကို print ထုတ်ရင် က လား ခ လား၊ ဘာ ထွက်မလဲ။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ခ၊ true ပါ။ ဘာကြောင့်လဲဆိုတော့ b က a ရဲ့ မိတ္တူ မဟုတ်ဘဲ a ရှိနေတဲ့ နေရာကို ညွှန်တဲ့
      pointer ဖြစ်လို့ပါ။ ဒါကြောင့် b ကနေ ပြင်တာက a ကို ပြင်တာနဲ့ အတူတူပါပဲ။ address ယူတဲ့ သင်္ကေတ မပါဘဲ a ကို b ထဲ
      ထည့်ခဲ့ရင်တော့ b က မိတ္တူ ဖြစ်သွားပြီး false ထွက်ပါမယ်။
    sources:
      - {
          title: "The Go Programming Language Specification — Address operators",
          url: "https://go.dev/ref/spec#Address_operators",
        }
    actions:
      - {
          id: quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [q-title, q-code, q-l1, q-l2, q-l3, q-l4, q-a, q-b],
        }
      - {
          id: quiz-line,
          type: whiteboard.apply,
          at: { mark: quiz-line },
          upsertIds: [q-mark],
          drawMs: 900,
        }
      - {
          id: quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-check],
          drawMs: 700,
        }

  - id: recap
    chapter: ပြန်ချုပ်ရရင်
    narration: >-
      [[mark:close-quiz]] ဒါဆို ပြန်ချုပ်ရရင်၊ function ကို ပေးလိုက်တဲ့ တန်ဖိုးက အမြဲ မိတ္တူ ဖြစ်ပါတယ်။ [[mark:recap-param]]
      pointer ကို ယူတဲ့ function ကတော့ address ကနေတစ်ဆင့် တန်ဖိုး အစစ်ကို ပြင်နိုင်ပါတယ်။ [[mark:recap-addr]] address ကို
      ဒီ သင်္ကေတနဲ့ ယူပြီး၊ ပါဆယ်ရဲ့ စင် နံပါတ်ကို ပေးလိုက်သလိုပါပဲ။ [[mark:recap-nil]] nil က ဘာကိုမှ မညွှန်တဲ့ pointer
      ဖြစ်လို့ မသုံးခင် စစ်ရပြီး၊ new ကတော့ တန်ဖိုး အသစ် တစ်ခု လုပ်ပြီး သူ့ address ကို တစ်ခါတည်း ပြန်ပေးပါတယ်။ နောက် lesson မှာတော့
      type တစ်ခုနဲ့ တွဲထားတဲ့ function ဖြစ်တဲ့ method နဲ့၊ method က မိတ္တူကို ယူမလား pointer ကို ယူမလား ဆိုတဲ့ ရွေးချယ်မှုကို
      လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "Go FAQ — When are function parameters passed by value?",
          url: "https://go.dev/doc/faq#pass_by_value",
        }
    actions:
      - {
          id: close-quiz,
          type: whiteboard.apply,
          at: { mark: close-quiz },
          open: false,
          upsertIds: [],
        }
      - id: recap-param
        type: editor.select
        at: { mark: recap-param }
        target: { file: main.go, text: "p *Parcel", occurrence: 1 }
      - id: recap-addr
        type: editor.select
        at: { mark: recap-addr }
        target: { file: main.go, text: "markDeliveredPtr(&p)", occurrence: 1 }
      - id: recap-nil
        type: editor.select
        at: { mark: recap-nil }
        target: { file: main.go, text: "if cod == nil {", occurrence: 1 }

checks:
  - { type: timing.p95Ms, max: 300 }
