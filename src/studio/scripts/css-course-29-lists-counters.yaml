      # base.css: kit sections A, B and B2 only (no furniture, so every list
      # keeps the browser's own markers, margins and padding); section E only
      # spaces the sections and colours the footer.
      base.css: |
        /*
          base.css: pinned, never typed during a lesson.
          The shop's palette and the page "furniture", so the CSS a lesson types can
          focus on one idea. Each lesson keeps only the sections it needs and drops
          any declaration that its own demo types or relies on being absent
          (COURSE-KIT.md, "Deriving a lesson workspace"). B2 travels with B (every
          lesson that keeps B keeps B2, except lesson 2, which types the reset).
          Section E holds the few lesson-specific rules a start state pins.
          Lesson 29 keeps A, B and B2 only: no furniture, so every list keeps the
          browser's own bullets, numbers, margins and padding. Section E only spaces
          the sections and colours the footer. No list-style, counter or display rule.
          Keep it free of the url, image-set and @-import functions (they switch on
          Vite's postcss step); images come from <img> or the pinned images.css.
        */

        /* == A. palette == */
        :root {
          color-scheme: light;
          --tea-dark: #3b2314;
          --tea: #8b5a2b;
          --tea-light: #c9a27e;
          --cream: #fff8ec;
          --paper: #fdf3e1;
          --leaf: #2f6b3a;
          --gold: #c9a227;
          --chili: #b23a2b;
          --ink: #2b1d14;
          --muted: #6b5a4c;
          --line: #e6d5bf;
          --radius: 12px;
        }

        /* == B. page == */
        body {
          margin: 0;
          font-family: "Noto Sans Myanmar", "Myanmar Sangam MN", "Myanmar MN", "Myanmar Text", "Padauk",
            system-ui, sans-serif;
          font-size: 16px;
          line-height: 1.8;
          color: var(--ink);
          background: var(--paper);
        }

        .page {
          padding: 0 16px 24px;
        }

        h1,
        h2,
        h3 {
          margin: 0 0 8px;
          line-height: 1.5;
        }

        h1 {
          font-size: 24px;
        }

        h2 {
          font-size: 20px;
        }

        h3 {
          font-size: 17px;
        }

        a {
          color: var(--tea);
        }

        /* Status lines that only expect.preview reads (kit.js data-report, data-say). */
        .visually-hidden {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip-path: inset(50%);
          white-space: nowrap;
        }

        /* == B2. reset (lesson 2 teaches it; every later lesson keeps it) == */
        *,
        *::before,
        *::after {
          box-sizing: border-box;
        }

        /* == E. lesson rules == */
        /* Lesson 29: space between the sections and the footer's colours. Every
           list-style, counter, margin and display rule for a list is typed. */
        .page > section + section {
          margin-top: 16px;
        }

        .site-footer {
          padding: 8px 16px 16px;
          background: var(--tea-dark);
          color: var(--cream);
          font-size: 14px;
        }

        .site-footer a {
          color: var(--cream);
        }

        .site-footer p {
          margin: 0;
        }
      styles.css: ""

