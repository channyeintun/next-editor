# CSS course (Burmese), lesson 29 of 43: lists and counters.
#
# Narration is Burmese (voice-script.md next to this file is its source;
# DESIGN.md is the span-by-span brief). Every [[mark:…]]
# sits where its action begins, at a sentence end; each span carries one
# piece of meaning. Everything the learner sees (title, chapters, whiteboard
# labels, UI strings) is already Burmese.
#
# Shape: board (recall lesson 28; ul / ol + start, reversed, value / dl; the
# number is information) → board (display: list-item makes a block box + a
# marker box; outside in the list's padding, inside on the first line) → code
# tour → list-style-type myanmar on the steps (set on the list, inherited) →
# ready-made counter styles (sentence) → a "🍵 " string on the drinks →
# square, lower-roman (later declarations win; a style, not meaning) →
# position inside / outside on the long step (+ right-aligned markers) →
# list-style-image explained (no url typed) → list-style shorthand → footer
# reset row (list-style none + padding 0 + flex; role="list" explained) → dl
# styled → a heading made a list item with a string marker (a11y warning) →
# board (what a counter is: reset / increment / counter(), set, display none,
# the built-in list-item counter) → the steps renumbered with a custom counter
# in ::before → nested categories with counters(list-item, ".") on ::marker →
# board (several counters, automatic footnotes) → the reversed top-five list
# (HTML attribute) → board (reversed math: items + 1, step −1; reversed() is
# Firefox-only) → @counter-style tea (unknown name falls back to decimal first)
# → quiz board + recap, hand-off to lesson 30 (fonts).
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set(; no postcss config; no reload, no
# HTML edit, no kit.js. Keystroke typing is used only where every half-typed
# state is harmless: a partly typed keyword in list-style-type is a custom
# counter-style name the browser doesn't know, which falls back to decimal
# numbers, so edits that would flash numbers over bullets or Myanmar digits
# (square, lower-roman, the shorthand, the footer reset, the heading, the
# counter reset, the counters() line) are revealed line by line instead.
#
# Measured in headless Chrome at 432 × 720 (probe/stages.ts, same anchors):
# document 1247 tall at start (steps 46, drinks 206, prices 383, cats 618, top
# 864, footer 1094). The long step wraps to two lines at both positions. The
# footer row makes the document 1197 tall; the dl spacing adds 16 (1213).
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
