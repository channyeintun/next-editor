# Rust from zero, lesson 9: structs.
#
# The arc: a whiteboard shows WHY a struct exists (a tuple (30, 50) can't say
# which number is the width; a struct names every field) and how Rust splits
# a "class" in two: the struct holds the data, an impl block holds the
# methods. The editor then builds a Rectangle: the definition, one instance
# (every field needs a value), field access with a dot, an area method that
# borrows through &self (and the dot call that borrows for you), and an
# associated function `new` with the field init shorthand, called with ::.
# A second board shows what happens when you print the whole struct: the two
# E0277 errors for {} (Display) and {:?} (Debug), and the compiler's help line
# that names the fix. The editor adds #[derive(Debug)] and prints with {:?}.
# One run at the end, then a short recap and a pointer to enums.
#
# Every compiler message on the board or in the narration was confirmed with
# rustc 1.98 (edition 2024) on the broken variants of the final program:
#   println!("{square}");   (no Display)
#     error[E0277]: `Rectangle` doesn't implement `std::fmt::Display`
#   println!("{square:?}"); (without #[derive(Debug)])
#     error[E0277]: `Rectangle` doesn't implement `Debug`
#     help: consider annotating `Rectangle` with `#[derive(Debug)]`
#   Rectangle { width: 30 } (a field left out)
#     error[E0063]: missing field `height` in initializer of `Rectangle`
#   println!("width {rect.width}");
#     error: invalid format string: field access isn't supported
# The final program is rustfmt-clean, compiles with no warnings, and its
# output is the fixture byte for byte.
#
# Board colours: blue = the thing being named (the struct, the impl block,
# which format a placeholder asks for), green = what works (named fields, the
# compiler's fix), orange = the caveat (the tuple can't say which number is
# which), red = the error, violet = the result a method gives back. #1e1e1e
# paints white on the dark board.
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/rust-structs.yaml
