# One idea: a struct groups related data under named, typed fields, and an
# impl block gives it methods that borrow the instance through &self. A
# whiteboard sketch, then an area method built on a Rectangle and run.
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/rust-structs.yaml
schemaVersion: 1

lesson:
  slug: rust-structs
  title: "Rust structs: data plus behavior"
  locale: en-US
  workspace:
    lessonType: rust
    name: Rust Lesson
    entryFilePath: main.rs
    files:
      main.rs: |
        struct Rectangle {
            width: u32,
            height: u32,
        }

        fn main() {
            let rect = Rectangle { width: 4, height: 5 };
            println!("width {}, height {}", rect.width, rect.height);
        }
  whiteboardAssets:
    - id: st-title
      kind: text
      x: 300
      y: 165
      width: 780
      height: 44
      text: "A struct groups fields; impl adds methods"
      strokeColor: "#1e1e1e"
      fontSize: 34
    - id: st-structbox
      kind: rectangle
      x: 340
      y: 268
      width: 320
      height: 156
      strokeColor: "#1971c2"
    - id: st-structlabel
      kind: text
      x: 362
      y: 282
      width: 280
      height: 32
      text: "Rectangle"
      strokeColor: "#1971c2"
      fontSize: 26
    - id: st-field0
      kind: text
      x: 366
      y: 330
      width: 280
      height: 34
      text: "width:  4"
      strokeColor: "#1e1e1e"
      fontSize: 26
    - id: st-field1
      kind: text
      x: 366
      y: 378
      width: 280
      height: 34
      text: "height: 5"
      strokeColor: "#1e1e1e"
      fontSize: 26
    - id: st-implbox
      kind: rectangle
      x: 710
      y: 268
      width: 350
      height: 156
      strokeColor: "#f08c00"
    - id: st-impllabel
      kind: text
      x: 732
      y: 282
      width: 320
      height: 32
      text: "impl Rectangle"
      strokeColor: "#f08c00"
      fontSize: 24
    - id: st-method
      kind: text
      x: 736
      y: 330
      width: 320
      height: 34
      text: "fn area(&self)"
      strokeColor: "#1e1e1e"
      fontSize: 24
    - id: st-methodbody
      kind: text
      x: 736
      y: 374
      width: 320
      height: 34
      text: "→ width × height"
      strokeColor: "#1e1e1e"
      fontSize: 22
    - id: st-note
      kind: text
      x: 340
      y: 452
      width: 760
      height: 36
      text: "area(&self) borrows the rectangle → 4 × 5 = 20"
      strokeColor: "#1e1e1e"
      fontSize: 26

build:
  voiceProfile: pocket-alba-v1
  seed: 36

runtime:
  kind: rust-playground
  defaultMode: fixture
  fixture:
    latencyMs: 600
    result:
      status: success
      stdout: "width 4, height 5\narea 20\n"
      stderr: ""

scenes:
  - id: anatomy
    narration: >
      [[mark:board]] A struct groups related data under one name.
      [[mark:show-struct]] Rectangle holds two fields — a width and a height,
      here four and five. [[mark:show-impl]] An impl block adds methods. area
      takes a reference to self, and multiplies width by height.
      [[mark:show-note]] So area reads the rectangle without owning it, and
      returns twenty. [[mark:board-close]] Let's write it.
    sources:
      - title: "The Rust Book — Defining and Instantiating Structs"
        url: "https://doc.rust-lang.org/book/ch05-01-defining-structs.html"
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { mark: board }
        open: true
        upsertIds: [st-title]
      - id: show-struct
        type: whiteboard.apply
        at: { mark: show-struct }
        upsertIds: [st-structbox, st-structlabel, st-field0, st-field1]
      - id: show-impl
        type: whiteboard.apply
        at: { mark: show-impl }
        upsertIds: [st-implbox, st-impllabel, st-method, st-methodbody]
      - id: show-note
        type: whiteboard.apply
        at: { mark: show-note }
        upsertIds: [st-note]
      - id: close-board
        type: whiteboard.apply
        at: { mark: board-close }
        open: false

  - id: fields
    narration: >
      [[mark:open]] Here's the struct, and one Rectangle, four by five. We read
      its fields with a dot: rect.width and rect.height. Fields are just named
      pieces of the value.
    sources:
      - title: "The Rust Book — Using Structs"
        url: "https://doc.rust-lang.org/book/ch05-02-example-structs.html"
    actions:
      - id: open-main
        type: workspace.openFile
        at: { mark: open }
        path: main.rs

  - id: methods
    narration: >
      [[mark:type-impl]] Now the behavior. Inside impl Rectangle, area borrows
      self and multiplies width by height. Because it takes &self, it can read
      the rectangle without taking ownership. [[mark:type-call]] Then we call
      it with rect.area().
    sources:
      - title: "The Rust Book — Method Syntax"
        url: "https://doc.rust-lang.org/book/ch05-03-method-syntax.html"
    actions:
      - id: type-impl
        type: editor.type
        at: { mark: type-impl, offsetMs: -400 }
        target:
          file: main.rs
          after: "    height: u32,\n}\n"
          occurrence: 1
        cadence: line-by-line
        text: "\nimpl Rectangle {\n    fn area(&self) -> u32 {\n        self.width * self.height\n    }\n}\n"
      - id: type-call
        type: editor.type
        at: { mark: type-call }
        target:
          file: main.rs
          after: "    println!(\"width {}, height {}\", rect.width, rect.height);\n"
          occurrence: 1
        cadence: line-by-line
        text: "    println!(\"area {}\", rect.area());\n"

  - id: run
    narration: >
      [[mark:run]] Let's run it. The fields print four and five, and area
      returns twenty. A struct bundles data; impl gives it behavior — together
      they're how you model things in Rust.
    sources:
      - title: "Rust Playground"
        url: "https://play.rust-lang.org/"
    actions:
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "area 20"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: "fn area(&self) -> u32 {"

checks:
  - { type: timing.p95Ms, max: 300 }
