build:
  voiceProfile: pocket-alba-v1
  seed: 36

runtime:
  kind: rust-playground
  defaultMode: fixture
  fixture:
    latencyMs: 600
    result:
      status: success
      stdout: "width 30, height 50\narea 1500\nsquare area 400\nRectangle { width: 20, height: 20 }\n"
      stderr: ""

scenes:
  - id: why-structs
    chapter: Why structs
    narration: >
      [[mark:open-board]] A rectangle has two parts: a width and a height.
      [[mark:draw-tuple]] You could keep the two numbers in a tuple: thirty
      and fifty. But which one is the width? The tuple doesn't say.
      [[mark:draw-struct]] A struct fixes that. It's your own type, and each
      field has a name and a type, so the code says what every value means.
      [[mark:draw-impl]] Then an impl block gives the struct its behavior:
      functions that work on it, called methods. Here, area multiplies the two
      fields. If you know classes, it's a bit like a class split in two. The data goes in the struct, and the methods go in
      impl.
    sources:
      - title: "The Rust Book — Defining and Instantiating Structs"
        url: "https://doc.rust-lang.org/book/ch05-01-defining-structs.html"
      - title: "The Rust Book — Refactoring with Tuples"
        url: "https://doc.rust-lang.org/book/ch05-02-example-structs.html#refactoring-with-tuples"
      - title: "The Rust Book — Method Syntax"
        url: "https://doc.rust-lang.org/book/ch05-03-method-syntax.html"
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { mark: open-board }
        open: true
        upsertIds: [b1-title]
      - id: draw-tuple
        type: whiteboard.apply
        at: { mark: draw-tuple }
        upsertIds: [b1-tuple-box, b1-tuple-t, b1-tuple-q]
        drawMs: 1800
      - id: draw-struct
        type: whiteboard.apply
        at: { mark: draw-struct }
        upsertIds: [b1-arrow, b1-struct-box, b1-struct-name, b1-field-w, b1-field-h, b1-check]
        drawMs: 3200
      - id: draw-impl
        type: whiteboard.apply
        at: { mark: draw-impl }
        upsertIds:
          [
            b1-arrow-down,
            b1-impl-box,
            b1-impl-name,
            b1-impl-area,
            b1-impl-result,
            b1-methods,
            b1-methods-arrow,
          ]
        drawMs: 3400

  - id: define
    chapter: Defining a struct
    narration: >
      Let's build it. [[mark:open-main]] Our main is empty for now.
      [[mark:type-struct]] The struct goes outside main, at the top of the
      file. [[mark:select-field]] Each field is a name, a colon, and a type.
      Both are u32, an unsigned integer. On its own, the struct is only a
      description. It doesn't hold any values yet.
    sources:
      - title: "The Rust Book — Defining and Instantiating Structs"
        url: "https://doc.rust-lang.org/book/ch05-01-defining-structs.html"
      - title: "The Rust Reference — Structs"
        url: "https://doc.rust-lang.org/reference/items/structs.html"
    actions:
      - id: close-board1
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: main.rs
      - id: type-struct
        type: editor.type
        at: { mark: type-struct, offsetMs: -200 }
        target:
          file: main.rs
          after: ""
          occurrence: 1
        cadence: line-by-line
        text: "struct Rectangle {\n    width: u32,\n    height: u32,\n}\n\n"
      - id: select-field
        type: editor.select
        at: { mark: select-field }
        target:
          file: main.rs
          text: "width: u32"
          occurrence: 1

  - id: instance
    narration: >
      [[mark:type-instance]] Now let's make an instance: one real rectangle.
      We write the struct's name, then each field and its value, inside curly
      braces. [[mark:select-instance]] Every field needs a value. Leave one
      out, and the compiler stops with a missing field error.
      [[mark:type-print-fields]] To read a field, we use a dot: rect dot
      width. Inline names in braces only work for plain variables, not for
      fields, so here we use empty braces.
    sources:
      - title: "The Rust Book — Defining and Instantiating Structs"
        url: "https://doc.rust-lang.org/book/ch05-01-defining-structs.html"
      - title: "Rust error codes — E0063"
        url: "https://doc.rust-lang.org/error_codes/E0063.html"
      - title: "std::fmt — Formatting"
        url: "https://doc.rust-lang.org/std/fmt/index.html"
    actions:
      - id: type-instance
        type: editor.type
        at: { mark: type-instance, offsetMs: -200 }
        target:
          file: main.rs
          after: "fn main() {\n"
          occurrence: 1
        cadence: line-by-line
        text: "    let rect = Rectangle {\n        width: 30,\n        height: 50,\n    };\n"
      - id: select-instance
        type: editor.select
        at: { mark: select-instance }
        target:
          file: main.rs
          text: "width: 30,\n        height: 50,"
          occurrence: 1
      - id: type-print-fields
        type: editor.type
        at: { mark: type-print-fields, offsetMs: -200 }
        target:
          file: main.rs
          after: "        height: 50,\n    };\n"
          occurrence: 1
        cadence: line-by-line
        text: "    println!(\"width {}, height {}\", rect.width, rect.height);\n"

  - id: methods
    chapter: Methods with impl
    narration: >
      [[mark:type-impl]] Let's add the impl block, with one method: area. The
      multiplication has no semicolon, so it's the value area returns.
      [[mark:select-self]] Its first parameter is self, the rectangle you call
      it on. The ampersand means area only borrows it. It reads the fields
      without taking ownership, so you can still use rect after the call.
      [[mark:type-call-area]] Let's call it on rect, with a dot.
      [[mark:select-call]] There's no ampersand in the call. When you call a
      method, Rust borrows rect for you.
    sources:
      - title: "The Rust Book — Method Syntax"
        url: "https://doc.rust-lang.org/book/ch05-03-method-syntax.html"
      - title: "The Rust Reference — Implementations"
        url: "https://doc.rust-lang.org/reference/items/implementations.html"
      - title: "Rust by Example — Associated functions & Methods"
        url: "https://doc.rust-lang.org/rust-by-example/fn/methods.html"
    actions:
      - id: type-impl
        type: editor.type
        at: { mark: type-impl, offsetMs: -200 }
        target:
          file: main.rs
          after: "    height: u32,\n}\n"
          occurrence: 1
        cadence: line-by-line
        text: "\nimpl Rectangle {\n    fn area(&self) -> u32 {\n        self.width * self.height\n    }\n}\n"
      - id: select-self
        type: editor.select
        at: { mark: select-self }
        target:
          file: main.rs
          text: "&self"
          occurrence: 1
      - id: type-call-area
        type: editor.type
        at: { mark: type-call-area, offsetMs: -200 }
        target:
          file: main.rs
          after: "rect.width, rect.height);\n"
          occurrence: 1
        cadence: line-by-line
        text: "    println!(\"area {}\", rect.area());\n"
      - id: select-call
        type: editor.select
        at: { mark: select-call }
        target:
          file: main.rs
          text: "rect.area()"
          occurrence: 1

  - id: associated-new
    narration: >
      [[mark:type-new]] Rust has no special constructor. Instead, a type
      usually gets an ordinary function called new. [[mark:select-new]] Every
      function in impl is an associated function. new has no self, so it isn't
      a method. It belongs to the type, not to one rectangle.
      [[mark:select-shorthand]] The
      parameters have the same names as the fields, so you write width once,
      instead of width colon width. That's the field init shorthand.
      [[mark:type-square]] To call new, we write the type name, two colons,
      and new. You've already used one of these: String::from.
    sources:
      - title: "The Rust Book — Associated Functions"
        url: "https://doc.rust-lang.org/book/ch05-03-method-syntax.html#associated-functions"
      - title: "The Rust Book — Using the Field Init Shorthand"
        url: "https://doc.rust-lang.org/book/ch05-01-defining-structs.html#using-the-field-init-shorthand"
    actions:
      - id: type-new
        type: editor.type
        at: { mark: type-new, offsetMs: -200 }
        target:
          file: main.rs
          after: "impl Rectangle {\n"
          occurrence: 1
        cadence: line-by-line
        text: "    fn new(width: u32, height: u32) -> Rectangle {\n        Rectangle { width, height }\n    }\n\n"
      - id: select-new
        type: editor.select
        at: { mark: select-new }
        target:
          file: main.rs
          text: "new(width: u32, height: u32)"
          occurrence: 1
      - id: select-shorthand
        type: editor.select
        at: { mark: select-shorthand }
        target:
          file: main.rs
          text: "Rectangle { width, height }"
          occurrence: 1
      - id: type-square
        type: editor.type
        at: { mark: type-square, offsetMs: -200 }
        target:
          file: main.rs
          after: "    println!(\"area {}\", rect.area());\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n    let square = Rectangle::new(20, 20);\n    println!(\"square area {}\", square.area());\n"

  - id: print-errors
    chapter: Printing a struct
    narration: >
      [[mark:open-errors]] What about printing the whole rectangle?
      [[mark:draw-display]] Plain braces ask for Display, the format for your
      users. Rust doesn't guess how your type should look, so this fails with
      error E0277: Rectangle doesn't implement Display. [[mark:draw-debug]] Add
      a colon and a question mark, and you ask for Debug, a format for
      developers. That's E0277 too: Rectangle doesn't implement Debug.
      [[mark:draw-help]] But read the help line. The compiler names the fix:
      add derive Debug to the struct.
    sources:
      - title: "Rust error codes — E0277"
        url: "https://doc.rust-lang.org/error_codes/E0277.html"
      - title: "The Rust Book — Adding Useful Functionality with Derived Traits"
        url: "https://doc.rust-lang.org/book/ch05-02-example-structs.html#adding-useful-functionality-with-derived-traits"
      - title: "std::fmt::Display"
        url: "https://doc.rust-lang.org/std/fmt/trait.Display.html"
      - title: "std::fmt::Debug"
        url: "https://doc.rust-lang.org/std/fmt/trait.Debug.html"
    actions:
      - id: open-errors
        type: whiteboard.apply
        at: { mark: open-errors }
        open: true
        clear: true
        upsertIds: [b2-title]
      - id: draw-display
        type: whiteboard.apply
        at: { mark: draw-display }
        upsertIds: [b2-bad1, b2-bad1-line, b2-label1, b2-err1a, b2-err1b]
        drawMs: 3000
      - id: draw-debug
        type: whiteboard.apply
        at: { mark: draw-debug }
        upsertIds: [b2-bad2, b2-bad2-line, b2-label2, b2-err2a, b2-err2b]
        drawMs: 3000
      - id: draw-help
        type: whiteboard.apply
        at: { mark: draw-help }
        upsertIds: [b2-help-a, b2-help-b, b2-check]
        drawMs: 2200

  - id: derive-debug
    narration: >
      Let's take the compiler's advice. [[mark:type-derive]] It goes on the
      line above the struct. [[mark:select-derive]] This is an attribute: an
      instruction to the compiler about the item below it. derive asks the
      compiler to write the Debug code for you. [[mark:type-debug-print]] Now
      we can print square, with a colon and a question mark inside the braces.
    sources:
      - title: "The Rust Reference — Derive"
        url: "https://doc.rust-lang.org/reference/attributes/derive.html"
      - title: "Rust by Example — Debug"
        url: "https://doc.rust-lang.org/rust-by-example/hello/print/print_debug.html"
    actions:
      - id: close-board2
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: type-derive
        type: editor.type
        at: { mark: type-derive, offsetMs: -200 }
        target:
          file: main.rs
          after: ""
          occurrence: 1
        cadence: fast-explainer
        text: "#[derive(Debug)]\n"
      - id: select-derive
        type: editor.select
        at: { mark: select-derive }
        target:
          file: main.rs
          text: "#[derive(Debug)]"
          occurrence: 1
      - id: type-debug-print
        type: editor.type
        at: { mark: type-debug-print, offsetMs: -200 }
        target:
          file: main.rs
          after: "    println!(\"square area {}\", square.area());\n"
          occurrence: 1
        cadence: fast-explainer
        text: "    println!(\"{square:?}\");\n"

  - id: run
    narration: >
      [[mark:run]] Let's run it. [[mark:read-output]] The fields print thirty
      and fifty, and area gives fifteen hundred. The square from new has an
      area of four hundred. And the last line is the Debug format: the
      struct's name, then every field with its value.
    sources:
      - title: "Rust by Example — Structures"
        url: "https://doc.rust-lang.org/rust-by-example/custom_types/structs.html"
      - title: "Rust by Example — Debug"
        url: "https://doc.rust-lang.org/rust-by-example/hello/print/print_debug.html"
    actions:
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "Rectangle { width: 20, height: 20 }"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: "fn area(&self) -> u32 {"

  - id: wrap
    narration: >
      So, a struct groups named fields into one type. An impl block gives it
      methods like area and associated functions like new, and derive Debug
      lets you print it. Next, we'll look at enums: a type whose value is one of a fixed set of
      variants.
    sources:
      - title: "The Rust Book — Using Structs to Structure Related Data"
        url: "https://doc.rust-lang.org/book/ch05-00-structs.html"
      - title: "The Rust Book — Defining an Enum"
        url: "https://doc.rust-lang.org/book/ch06-01-defining-an-enum.html"
    actions: []

checks:
  - { type: timing.p95Ms, max: 300 }
