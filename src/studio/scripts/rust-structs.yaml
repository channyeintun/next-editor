runtime:
  kind: rust-playground
  defaultMode: fixture
  fixture:
    latencyMs: 600
    result:
      status: success
      stdout: "width 30, height 50

        area 1500

        square area 400

        Rectangle { width: 20, height: 20 }\n"
      stderr: ""

scenes:
  - id: why-structs
    chapter: Struct ဘာကြောင့် လိုလဲ
    narration: >-
      [[mark:open-board]] ဒီ lesson မှာ struct တွေအကြောင်း လေ့လာမှာ ဖြစ်လို့၊ struct ဆိုတာ ဘာကြောင့်
      လိုလဲ ဆိုတာကနေ စကြည့်ရအောင်။ လေးထောင့်ပုံ တစ်ခုကို စဉ်းစားကြည့်ပါ။ လေးထောင့်ပုံ တစ်ခုမှာ
      အတိုင်းအတာ နှစ်ခု ရှိပါတယ်၊ အကျယ် ဖြစ်တဲ့ width နဲ့ အမြင့် ဖြစ်တဲ့ height ပါ။
      [[mark:draw-tuple]] ဒီ ကိန်းဂဏန်း နှစ်ခုကို tuple တစ်ခုထဲမှာ 30 နဲ့ 50 ဆိုပြီး ထည့်ထားလို့
      ရပါတယ်။ ဒါပေမဲ့ ဒီ နှစ်ခုထဲက ဘယ်ဟာက width လဲ။ tuple က အဲဒါကို မပြောပေးပါဘူး။ ကိန်းဂဏန်း
      နှစ်ခုပဲ ရှိပြီး၊ ဘယ်ဟာက ဘာကို ဆိုလိုလဲ ဆိုတာ ဘယ်နေရာမှာမှ မရေးထားပါဘူး။ [[mark:draw-struct]]
      struct က အဲဒီ ပြဿနာကို ဖြေရှင်းပေးပါတယ်။ struct ဆိုတာ ကိုယ်တိုင် သတ်မှတ်ထားတဲ့ ကိုယ်ပိုင် type
      တစ်ခု ဖြစ်ပြီး၊ သူ့ထဲက field တစ်ခုစီမှာ နာမည် တစ်ခုနဲ့ type တစ်ခု ရှိပါတယ်။ ဒါကြောင့် 30 က
      width ဖြစ်ပြီး 50 က height ဖြစ်တယ် ဆိုတာ code ကိုယ်တိုင်က ပြောပြနေပါတယ်။ တန်ဖိုး တစ်ခုစီက
      ဘာကို ဆိုလိုလဲ ဆိုတာ ရှင်းရှင်းလင်းလင်း မြင်ရပါတယ်။ [[mark:draw-impl]] ပြီးတော့ impl block
      ကတော့ ဒီ struct ကို လုပ်ဆောင်ချက်တွေ ပေးပါတယ်။ ဆိုလိုတာက struct ပေါ်မှာ အလုပ်လုပ်တဲ့ function
      တွေ ဖြစ်ပြီး၊ အဲဒီ function တွေကို method လို့ ခေါ်ပါတယ်။ ဒီမှာ area ဆိုတဲ့ method က field
      နှစ်ခုကို မြှောက်ပြီး 1500 ကို ပြန်ပေးပါတယ်။ class တွေအကြောင်း သိပြီးသားဆိုရင်၊ ဒါက class
      တစ်ခုကို နှစ်ပိုင်း ခွဲထားသလိုမျိုးပါ။ data က struct ထဲမှာ ရှိပြီး၊ method တွေကတော့ impl ထဲမှာ
      ရှိပါတယ်။
    sources:
      - title: "The Rust Book — Defining and Instantiating Structs"
        url: "https://doc.rust-lang.org/book/ch05-01-defining-structs.html"
      - title: "The Rust Book — Refactoring with Tuples"
        url: "https://doc.rust-lang.org/book/ch05-02-example-structs.html#refactoring-with-tuples"
      - title: "The Rust Book — Method Syntax"
        url: "https://doc.rust-lang.org/book/ch05-03-method-syntax.html"
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { mark: open-board }
        open: true
        upsertIds: [b1-title]
      - id: draw-tuple
        type: whiteboard.apply
        at: { mark: draw-tuple }
        upsertIds: [b1-tuple-box, b1-tuple-t, b1-tuple-q]
        drawMs: 1800
      - id: draw-struct
        type: whiteboard.apply
        at: { mark: draw-struct }
        upsertIds: [b1-arrow, b1-struct-box, b1-struct-name, b1-field-w, b1-field-h, b1-check]
        drawMs: 3200
      - id: draw-impl
        type: whiteboard.apply
        at: { mark: draw-impl }
        upsertIds:
          [
            b1-arrow-down,
            b1-impl-box,
            b1-impl-name,
            b1-impl-area,
            b1-impl-result,
            b1-methods,
            b1-methods-arrow,
          ]
        drawMs: 3400

  - id: define
    chapter: Struct တစ်ခု သတ်မှတ်ခြင်း
    narration: >-
      ကဲ၊ editor ထဲမှာ တကယ် ရေးကြည့်ရအောင်။ [[mark:open-main]] ဒီမှာ main function ရှိပါတယ်၊ အခုတော့
      အလွတ်ပဲ ရှိပါသေးတယ်။ [[mark:type-struct]] struct ကို main ရဲ့ အပြင်ဘက်၊ ဖိုင်ရဲ့ အပေါ်ဆုံးမှာ
      ရေးပါတယ်။ struct keyword နောက်မှာ Rectangle ဆိုတဲ့ နာမည် လာပြီး၊ တွန့်ကွင်းထဲမှာ field တွေ
      လာပါတယ်။ [[mark:select-field]] field တစ်ခုစီက နာမည် တစ်ခု၊ colon တစ်ခု၊ ပြီးတော့ type တစ်ခုပါ။
      ဒီမှာ width ရော height ရော နှစ်ခုလုံးက u32 ဖြစ်ပြီး၊ u32 ဆိုတာ အနုတ်ကိန်း မပါတဲ့ unsigned
      integer ပါ။ ဒီအဆင့်မှာတော့ struct က ပုံစံ တစ်ခုကို ဖော်ပြထားရုံပဲ ရှိပါသေးတယ်။ သူ့ထဲမှာ
      တန်ဖိုး ဘာမှ မရှိသေးပါဘူး။
    sources:
      - title: "The Rust Book — Defining and Instantiating Structs"
        url: "https://doc.rust-lang.org/book/ch05-01-defining-structs.html"
      - title: "The Rust Reference — Structs"
        url: "https://doc.rust-lang.org/reference/items/structs.html"
    actions:
      - id: close-board1
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: main.rs
      - id: type-struct
        type: editor.type
        at: { mark: type-struct, offsetMs: -200 }
        target:
          file: main.rs
          after: ""
          occurrence: 1
        cadence: line-by-line
        text: "struct Rectangle {

          \    width: u32,

          \    height: u32,

          }

          \n"
      - id: select-field
        type: editor.select
        at: { mark: select-field }
        target:
          file: main.rs
          text: "width: u32"
          occurrence: 1

  - id: instance
    narration: >-
      [[mark:type-instance]] အခု instance တစ်ခု လုပ်ကြည့်ရအောင်။ instance ဆိုတာ ဒီ struct ကနေ တကယ်
      ဖန်တီးလိုက်တဲ့ လေးထောင့်ပုံ တစ်ခုပါ။ ရေးပုံကတော့ struct ရဲ့ နာမည်ကို အရင် ရေးပြီး၊
      တွန့်ကွင်းထဲမှာ field တစ်ခုစီကို သူ့ တန်ဖိုးနဲ့ တွဲပြီး ရေးပါတယ်။ ဒီမှာ rect ဆိုတဲ့ နာမည်နဲ့
      width ကို 30၊ height ကို 50 ထားလိုက်ပါတယ်။ [[mark:select-instance]] field တိုင်းမှာ တန်ဖိုး
      ရှိရပါမယ်။ field တစ်ခု ချန်ထားမိရင်၊ compiler က missing field error နဲ့ ရပ်သွားပါလိမ့်မယ်။
      [[mark:type-print-fields]] field တစ်ခုကို ဖတ်ဖို့ dot ကို သုံးပါတယ်၊ rect dot width ဆိုပြီး
      ရေးပါတယ်။ ဒီနေရာမှာ သတိထားရမှာ တစ်ခုက၊ format string ရဲ့ တွန့်ကွင်းထဲမှာ နာမည်ကို တန်းရေးတဲ့
      နည်းက ရိုးရိုး variable တွေအတွက်ပဲ အလုပ်လုပ်ပြီး၊ field တွေအတွက် အလုပ် မလုပ်ပါဘူး။ ဒါကြောင့်
      ဒီမှာ တွန့်ကွင်း အလွတ်ကို သုံးပြီး၊ rect ရဲ့ width နဲ့ height ကို argument အနေနဲ့ နောက်မှာ
      ထည့်ပေးလိုက်တာပါ။
    sources:
      - title: "The Rust Book — Defining and Instantiating Structs"
        url: "https://doc.rust-lang.org/book/ch05-01-defining-structs.html"
      - title: "Rust error codes — E0063"
        url: "https://doc.rust-lang.org/error_codes/E0063.html"
      - title: "std::fmt — Formatting"
        url: "https://doc.rust-lang.org/std/fmt/index.html"
    actions:
      - id: type-instance
        type: editor.type
        at: { mark: type-instance, offsetMs: -200 }
        target:
          file: main.rs
          after: "fn main() {\n"
          occurrence: 1
        cadence: line-by-line
        text: "    let rect = Rectangle {

          \        width: 30,

          \        height: 50,

          \    };\n"
      - id: select-instance
        type: editor.select
        at: { mark: select-instance }
        target:
          file: main.rs
          text: "width: 30,\n        height: 50,"
          occurrence: 1
      - id: type-print-fields
        type: editor.type
        at: { mark: type-print-fields, offsetMs: -200 }
        target:
          file: main.rs
          after: "        height: 50,\n    };\n"
          occurrence: 1
        cadence: line-by-line
        text: "    println!(\"width {}, height {}\", rect.width, rect.height);\n"

  - id: methods
    chapter: impl နဲ့ method တွေ
    narration: >-
      [[mark:type-impl]] အခု impl block ကို ထည့်ကြည့်ရအောင်။ သူ့ထဲမှာ area ဆိုတဲ့ method တစ်ခုတည်း
      ထည့်ပါမယ်။ area ရဲ့ body ထဲမှာ width နဲ့ height ကို မြှောက်တဲ့ expression တစ်ခုပဲ ရှိပြီး၊
      semicolon မပါပါဘူး။ ဒါကြောင့် အဲဒီ မြှောက်ရလဒ်ကပဲ area က ပြန်ပေးတဲ့ တန်ဖိုး ဖြစ်ပါတယ်။
      [[mark:select-self]] area ရဲ့ ပထမ parameter က self ပါ။ self ဆိုတာ ဒီ method ကို ဘယ်
      လေးထောင့်ပုံပေါ်မှာ ခေါ်လဲ၊ အဲဒီ လေးထောင့်ပုံ ကိုယ်တိုင်ပါ။ self ရှေ့က ampersand ကတော့ area က
      အဲဒီ လေးထောင့်ပုံကို borrow လုပ်ရုံပဲ လုပ်တယ်လို့ ပြောတာပါ။ borrow ဆိုတာ ငှားသုံးတာပါ။
      ဆိုလိုတာက ownership ကို မယူဘဲ field တွေကို ဖတ်ရုံပဲ ဖတ်တာ ဖြစ်လို့၊ ခေါ်ပြီးတဲ့ နောက်မှာလည်း
      rect ကို ဆက်သုံးလို့ ရပါတယ်။ [[mark:type-call-area]] ဒါဆို rect ပေါ်မှာ area ကို dot နဲ့
      ခေါ်ကြည့်ရအောင်။ [[mark:select-call]] ခေါ်တဲ့ နေရာမှာ ampersand မပါတာကို သတိထား ကြည့်ပါ။
      method တစ်ခုကို ခေါ်တဲ့အခါ၊ Rust က rect ကို ကိုယ့်အစား borrow လုပ်ပေးလိုက်တာပါ။
    sources:
      - title: "The Rust Book — Method Syntax"
        url: "https://doc.rust-lang.org/book/ch05-03-method-syntax.html"
      - title: "The Rust Reference — Implementations"
        url: "https://doc.rust-lang.org/reference/items/implementations.html"
      - title: "Rust by Example — Associated functions & Methods"
        url: "https://doc.rust-lang.org/rust-by-example/fn/methods.html"
    actions:
      - id: type-impl
        type: editor.type
        at: { mark: type-impl, offsetMs: -200 }
        target:
          file: main.rs
          after: "    height: u32,\n}\n"
          occurrence: 1
        cadence: line-by-line
        text: "

          impl Rectangle {

          \    fn area(&self) -> u32 {

          \        self.width * self.height

          \    }

          }\n"
      - id: select-self
        type: editor.select
        at: { mark: select-self }
        target:
          file: main.rs
          text: "&self"
          occurrence: 1
      - id: type-call-area
        type: editor.type
        at: { mark: type-call-area, offsetMs: -200 }
        target:
          file: main.rs
          after: "rect.width, rect.height);\n"
          occurrence: 1
        cadence: line-by-line
        text: "    println!(\"area {}\", rect.area());\n"
      - id: select-call
        type: editor.select
        at: { mark: select-call }
        target:
          file: main.rs
          text: "rect.area()"
          occurrence: 1

  - id: associated-new
    narration: >-
      [[mark:type-new]] Rust မှာ constructor အတွက် အထူး syntax မရှိပါဘူး။ အဲဒီအစား type တစ်ခုမှာ new
      ဆိုတဲ့ ရိုးရိုး function တစ်ခု ထားလေ့ ရှိပါတယ်။ ဒီ new က width နဲ့ height ကို လက်ခံပြီး၊
      Rectangle တစ်ခု ပြန်ပေးပါတယ်။ [[mark:select-new]] impl ထဲက function တိုင်းကို associated
      function လို့ ခေါ်ပါတယ်။ new မှာ self မပါတဲ့အတွက်၊ သူက method တော့ မဟုတ်ပါဘူး။ သူက
      လေးထောင့်ပုံ တစ်ခုချင်းနဲ့ ဆိုင်တာ မဟုတ်ဘဲ၊ Rectangle ဆိုတဲ့ type နဲ့ ဆိုင်တာပါ။
      [[mark:select-shorthand]] ဒီနေရာမှာ parameter တွေရဲ့ နာမည်က field တွေရဲ့ နာမည်နဲ့ အတူတူပဲ
      ဖြစ်တဲ့အတွက်၊ width colon width လို့ ရေးစရာ မလိုဘဲ width လို့ တစ်ခါပဲ ရေးလို့ ရပါတယ်။ ဒါကို
      field init shorthand လို့ ခေါ်ပါတယ်။ [[mark:type-square]] new ကို ခေါ်ဖို့ကတော့ type နာမည်၊
      colon နှစ်ခု၊ ပြီးတော့ new လို့ ရေးပါတယ်။ ဒီ ပုံစံကို အရင် lesson တွေမှာ သုံးဖူးပြီးသားပါ၊
      String ရဲ့ from ဆိုတာပါ။ ဒီမှာ 20 နဲ့ 20 ဆိုတဲ့ စတုရန်း တစ်ခု လုပ်ပြီး၊ သူ့ area ကိုပါ print
      ထုတ်လိုက်ပါမယ်။
    sources:
      - title: "The Rust Book — Associated Functions"
        url: "https://doc.rust-lang.org/book/ch05-03-method-syntax.html#associated-functions"
      - title: "The Rust Book — Using the Field Init Shorthand"
        url: "https://doc.rust-lang.org/book/ch05-01-defining-structs.html#using-the-field-init-shorthand"
    actions:
      - id: type-new
        type: editor.type
        at: { mark: type-new, offsetMs: -200 }
        target:
          file: main.rs
          after: "impl Rectangle {\n"
          occurrence: 1
        cadence: line-by-line
        text: "    fn new(width: u32, height: u32) -> Rectangle {

          \        Rectangle { width, height }

          \    }

          \n"
      - id: select-new
        type: editor.select
        at: { mark: select-new }
        target:
          file: main.rs
          text: "new(width: u32, height: u32)"
          occurrence: 1
      - id: select-shorthand
        type: editor.select
        at: { mark: select-shorthand }
        target:
          file: main.rs
          text: "Rectangle { width, height }"
          occurrence: 1
      - id: type-square
        type: editor.type
        at: { mark: type-square, offsetMs: -200 }
        target:
          file: main.rs
          after: "    println!(\"area {}\", rect.area());\n"
          occurrence: 1
        cadence: line-by-line
        text: "

          \    let square = Rectangle::new(20, 20);

          \    println!(\"square area {}\", square.area());\n"

  - id: print-errors
    chapter: Struct ကို print ထုတ်ခြင်း
    narration: >-
      [[mark:open-errors]] ဒါဆို လေးထောင့်ပုံ တစ်ခုလုံးကို print ထုတ်ချင်ရင်ရော။
      [[mark:draw-display]] တွန့်ကွင်း အလွတ်နဲ့ print ထုတ်ရင် Display format ကို တောင်းတာပါ။ Display
      ဆိုတာ program ကို သုံးမယ့် သူတွေအတွက် ပြတဲ့ ပုံစံပါ။ ကိုယ်ပိုင် type တစ်ခုကို ဘယ်လို ပုံစံနဲ့
      ပြရမလဲ ဆိုတာကို Rust က ကိုယ့်အစား ခန့်မှန်းမပေးပါဘူး။ ဒါကြောင့် compiler က E0277 error နဲ့
      ရပ်သွားပါတယ်၊ Rectangle က Display ကို implement မလုပ်ထားဘူးတဲ့။ [[mark:draw-debug]]
      တွန့်ကွင်းထဲမှာ colon နဲ့ question mark ထည့်လိုက်ရင်တော့ Debug format ကို တောင်းတာပါ။ Debug
      ကတော့ developer တွေအတွက် ပုံစံပါ။ ဒါလည်း E0277 error ပါပဲ၊ Rectangle က Debug ကိုလည်း implement
      မလုပ်ထားဘူးတဲ့။ [[mark:draw-help]] ဒါပေမဲ့ help စာကြောင်းကို ဖတ်ကြည့်ပါ။ compiler က
      ပြင်နည်းကို တိတိကျကျ ပြောထားပါတယ်။ struct အပေါ်မှာ derive Debug ထည့်လိုက်ပါတဲ့။
    sources:
      - title: "Rust error codes — E0277"
        url: "https://doc.rust-lang.org/error_codes/E0277.html"
      - title: "The Rust Book — Adding Useful Functionality with Derived Traits"
        url:
          "https://doc.rust-lang.org/book/ch05-02-example-structs.html#adding-useful-functionality-with-\
          derived-traits"
      - title: "std::fmt::Display"
        url: "https://doc.rust-lang.org/std/fmt/trait.Display.html"
      - title: "std::fmt::Debug"
        url: "https://doc.rust-lang.org/std/fmt/trait.Debug.html"
    actions:
      - id: open-errors
        type: whiteboard.apply
        at: { mark: open-errors }
        open: true
        clear: true
        upsertIds: [b2-title]
      - id: draw-display
        type: whiteboard.apply
        at: { mark: draw-display }
        upsertIds: [b2-bad1, b2-bad1-line, b2-label1, b2-err1a, b2-err1b]
        drawMs: 3000
      - id: draw-debug
        type: whiteboard.apply
        at: { mark: draw-debug }
        upsertIds: [b2-bad2, b2-bad2-line, b2-label2, b2-err2a, b2-err2b]
        drawMs: 3000
      - id: draw-help
        type: whiteboard.apply
        at: { mark: draw-help }
        upsertIds: [b2-help-a, b2-help-b, b2-check]
        drawMs: 2200

  - id: derive-debug
    narration: >-
      ဒါဆို compiler ရဲ့ အကြံအတိုင်း လုပ်ကြည့်ရအောင်။ [[mark:type-derive]] derive Debug ကို struct
      ရဲ့ အပေါ် စာကြောင်းမှာ ထည့်ပါတယ်။ [[mark:select-derive]] ဒီလို စာကြောင်းမျိုးကို attribute
      လို့ ခေါ်ပါတယ်။ attribute ဆိုတာ သူ့အောက်က code အကြောင်း compiler ကို ပြောတဲ့ ညွှန်ကြားချက်
      တစ်ခုပါ။ ဒီ derive ကတော့ Debug အတွက် လိုအပ်တဲ့ code ကို ကိုယ့်အစား ရေးပေးဖို့ compiler ကို
      ခိုင်းလိုက်တာပါ။ [[mark:type-debug-print]] အခုတော့ square ကို print ထုတ်လို့ ရပါပြီ။
      တွန့်ကွင်းထဲမှာ square နောက်က colon နဲ့ question mark ထည့်ပြီး ရေးလိုက်ပါမယ်။
    sources:
      - title: "The Rust Reference — Derive"
        url: "https://doc.rust-lang.org/reference/attributes/derive.html"
      - title: "Rust by Example — Debug"
        url: "https://doc.rust-lang.org/rust-by-example/hello/print/print_debug.html"
    actions:
      - id: close-board2
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: type-derive
        type: editor.type
        at: { mark: type-derive, offsetMs: -200 }
        target:
          file: main.rs
          after: ""
          occurrence: 1
        cadence: fast-explainer
        text: "#[derive(Debug)]\n"
      - id: select-derive
        type: editor.select
        at: { mark: select-derive }
        target:
          file: main.rs
          text: "#[derive(Debug)]"
          occurrence: 1
      - id: type-debug-print
        type: editor.type
        at: { mark: type-debug-print, offsetMs: -200 }
        target:
          file: main.rs
          after: "    println!(\"square area {}\", square.area());\n"
          occurrence: 1
        cadence: fast-explainer
        text: "    println!(\"{square:?}\");\n"

  - id: run
    narration: >-
      [[mark:run]] ကဲ၊ run ကြည့်ရအောင်။ [[mark:read-output]] ပထမ စာကြောင်းမှာ field နှစ်ခုက 30 နဲ့
      50 ဆိုပြီး ထွက်လာပြီး၊ area ကတော့ 1500 ပေးပါတယ်။ new နဲ့ လုပ်ထားတဲ့ စတုရန်းရဲ့ area က 400 ပါ။
      နောက်ဆုံး စာကြောင်းကတော့ Debug format ပါ။ struct ရဲ့ နာမည်ကို အရင် ပြပြီး၊ နောက်မှာ field
      တစ်ခုစီကို သူ့ တန်ဖိုးနဲ့ တွဲပြီး ပြထားပါတယ်။
    sources:
      - title: "Rust by Example — Structures"
        url: "https://doc.rust-lang.org/rust-by-example/custom_types/structs.html"
      - title: "Rust by Example — Debug"
        url: "https://doc.rust-lang.org/rust-by-example/hello/print/print_debug.html"
    actions:
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "Rectangle { width: 20, height: 20 }"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: "fn area(&self) -> u32 {"

  - id: wrap
    narration: >-
      ဒါဆို ပြန်ချုပ်ရရင်၊ struct ဆိုတာ နာမည် ပါတဲ့ field တွေကို type တစ်ခုတည်းအဖြစ် စုစည်းထားတာပါ။
      impl block ကတော့ အဲဒီ struct ကို area လို method တွေနဲ့ new လို associated function တွေ
      ပေးပြီး၊ derive Debug ကတော့ struct ကို print ထုတ်လို့ ရအောင် လုပ်ပေးပါတယ်။ နောက် lesson
      မှာတော့ Enum နဲ့ Option ကို ကြည့်သွားပါမယ်။ enum ဆိုတာ ကြိုတင် သတ်မှတ်ထားတဲ့ variant တွေထဲက
      တစ်ခုပဲ ဖြစ်နိုင်တဲ့ type တစ်ခုပါ။
    sources:
      - title: "The Rust Book — Using Structs to Structure Related Data"
        url: "https://doc.rust-lang.org/book/ch05-00-structs.html"
      - title: "The Rust Book — Defining an Enum"
        url: "https://doc.rust-lang.org/book/ch06-01-defining-an-enum.html"
    actions: []

checks:
  - { type: timing.p95Ms, max: 300 }
