      reply-assistant/src/first-call.ts: |
        // Reply assistant: the first Messages API call, for one ticket.
        import Anthropic from "@anthropic-ai/sdk";

        const client = new Anthropic(); // reads ANTHROPIC_API_KEY or an `ant auth login` profile

        const ticket = "လှိုင်မြို့နယ်မှာ မနေ့ညကစပြီး internet မရပါဘူး။ router မီး အနီရောင် ပြနေတယ်။";

        const message = await client.messages.create({
        });
