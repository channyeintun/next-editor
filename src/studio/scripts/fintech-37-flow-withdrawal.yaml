      books.go: |
        package main

        import "fmt"

        // Service is one store: ledger, idempotency keys, holds, the audit trail and the chain.
        type Service struct {
        	ledger     Ledger
        	chain      *Chain
        	keys       map[string]*Withdrawal // scoped to user and operation
        	holds      map[string]int64       // open reservations per user
        	trail      []string
        	crashAfter string // test hook: the process dies right after this step
        }

        // available is the balance minus the open reservations: what a new request may use.
        func (s *Service) available(account string) int64 {
        	return s.ledger.Balance(account) - s.holds[account]
        }

        // release closes a withdrawal's reservation and returns what it held.
        func (s *Service) release(w *Withdrawal) int64 {
        	held := w.Held
        	s.holds[w.User] -= held
        	w.Held = 0
        	return held
        }

        // post books the final movement with the real fee, then settles the reservation.
        func (s *Service) post(w *Withdrawal) {
        	fee := s.chain.Find(w.Hash).Fee
        	charge := w.Amount + fee + w.SvcFee
        	must(s.ledger.Post(Tx{ID: w.ID, Memo: "withdrawal " + w.Hash, Lines: []Line{
        		{Account: w.User, Debit: charge},
        		{Account: "expense:network-fee", Debit: fee},
        		{Account: "asset:chain", Credit: w.Amount + fee},
        		{Account: "revenue:fees", Credit: fee + w.SvcFee},
        	}}))
        	held := s.release(w)
        	if charge <= held {
        		fmt.Printf("%s final, posted, released %s\n", w.ID, eth(held-charge))
        		return
        	}
        	fmt.Printf("%s final, posted %s over the hold: fee %s, estimate %s\n", w.ID,
        		eth(charge-held), eth(fee), eth(w.EstFee))
        	if b := s.ledger.Balance(w.User); b < 0 {
        		s.trail = append(s.trail, w.ID+" overdraft "+eth(b))
        		fmt.Printf("%s overdraft: user %s ETH, recover from the next deposit\n", w.ID, eth(b))
        	}
        }

        func must(err error) {
        	if err != nil {
        		panic(err)
        	}
        }
      chain.go: |
        package main

        // ETH amounts are int64 wei.
        const (
        	gwei       int64 = 1_000_000_000
        	ether            = 1_000_000_000 * gwei
        	milli            = ether / 1000 // 0.001 ETH
        	finalAfter       = 64           // blocks: stands in for finality (two epochs of 32 slots is the floor)
        )

        // Chain is a fake Ethereum node holding our hot wallet. A send cannot be taken back.
        type Chain struct {
        	Wallet  int64               // what our wallet really holds on chain
        	NextFee int64               // the network fee the next send will really cost
        	sent    map[string]*ChainTx // by transaction hash
        	height  int
        }

        // ChainTx is a transaction the network accepted.
        type ChainTx struct {
        	Hash, To    string
        	Amount, Fee int64
        	Block       int
        }

        func newChain(wallet, fee int64) *Chain {
        	return &Chain{Wallet: wallet, NextFee: fee, sent: map[string]*ChainTx{}}
        }

        // Broadcast sends a signed transaction: the amount and the fee leave the wallet.
        func (c *Chain) Broadcast(hash, to string, amount int64) {
        	c.height++
        	c.sent[hash] = &ChainTx{hash, to, amount, c.NextFee, c.height}
        	c.Wallet -= amount + c.NextFee
        }

        // Find asks the node about a hash: nil if the network never saw it.
        func (c *Chain) Find(hash string) *ChainTx { return c.sent[hash] }

        // Confirmations counts the blocks on top of the transaction, its own block included.
        func (c *Chain) Confirmations(hash string) int {
        	if tx := c.sent[hash]; tx != nil {
        		return c.height - tx.Block + 1
        	}
        	return 0
        }

        // Mine adds n blocks; Sends counts the transactions the network holds.
        func (c *Chain) Mine(n int) { c.height += n }
        func (c *Chain) Sends() int { return len(c.sent) }
      flow.go: |
        package main

        import (
        	"crypto/sha256"
        	"fmt"
        )

        const sanctioned = "0xbad" // an address the screening provider flags

        // Withdrawal is the stored state of one flow: a driver can resume it after any crash.
        type Withdrawal struct {
        	ID, User, To           string
        	Amount, EstFee, SvcFee int64
        	Held                   int64 // the open reservation
        	State, Hash            string
        }

        var nextID int

        // Request checks the available balance and reserves amount plus fees in one step.
        func (s *Service) Request(key, from, to string, amount int64) *Withdrawal {
        	if w := s.keys[from+"/withdraw/"+key]; w != nil {
        		return w
        	}
        	nextID++
        	w := &Withdrawal{fmt.Sprintf("w-%d", nextID), from, to, amount, 2 * milli, milli, 0, "reserved", ""}
        	if need := amount + w.EstFee + w.SvcFee; need <= s.available(from) {
        		s.keys[from+"/withdraw/"+key], w.Held = w, need
        		s.holds[from] += need
        		fmt.Printf("%s reserved %s ETH, available %s\n", w.ID, eth(need), eth(s.available(from)))
        	} else {
        		w.State = "released"
        	}
        	return w
        }

        // Drive moves a withdrawal forward from its stored state; it is safe to call again.
        func (s *Service) Drive(w *Withdrawal) {
        	for w.State != "posted" && w.State != "released" {
        		switch w.State {
        		case "reserved": // the compliance gate: may sleep for days in manual review
        			if w.To == sanctioned {
        				s.trail = append(s.trail, w.ID+" blocked: "+w.To)
        				fmt.Printf("%s blocked, released %s\n", w.ID, eth(s.release(w)))
        				w.State = "released"
        				continue
        			}
        			s.trail = append(s.trail, w.ID+" passed screening")
        			// sign first: the hash is stored before anything is sent
        			w.Hash = fmt.Sprintf("0x%x", sha256.Sum256([]byte(w.ID+w.To)))[:10]
        			w.State = "sending"
        		case "sending":
        			if s.chain.Find(w.Hash) != nil {
        				fmt.Printf("%s resumed: %s is on chain, not sent again\n", w.ID, w.Hash)
        			} else {
        				s.chain.Broadcast(w.Hash, w.To, w.Amount)
        			}
        			if s.crashAfter == "sending" {
        				s.crashAfter = ""
        				fmt.Println(w.ID, "crashed after the broadcast")
        				return
        			}
        			w.State = "sent"
        		case "sent":
        			s.chain.Mine(finalAfter) // waiting for finality, compressed
        			if s.chain.Confirmations(w.Hash) >= finalAfter {
        				s.post(w)
        				w.State = "posted"
        			}
        		}
        	}
        }
      ledger.go: |
        package main

        import (
        	"fmt"
        	"strings"
        )

        // Line is one row of a transaction: an amount on the debit or the credit side of one account.
        type Line struct {
        	Account string
        	Debit   int64
        	Credit  int64
        }

        // Tx is one business event. All of its lines are posted together, or none of them.
        type Tx struct {
        	ID    string
        	Memo  string
        	Lines []Line
        }

        // Ledger is an append-only list of posted transactions. Balances are derived from it.
        type Ledger struct {
        	txs []Tx
        }

        // Post appends a transaction only if its debits equal its credits.
        func (l *Ledger) Post(tx Tx) error {
        	var debit, credit int64
        	for _, line := range tx.Lines {
        		debit += line.Debit
        		credit += line.Credit
        	}
        	if debit != credit {
        		return fmt.Errorf("tx %s is not balanced: debit %s, credit %s", tx.ID, cents(debit), cents(credit))
        	}
        	l.txs = append(l.txs, tx)
        	return nil
        }

        // kindOf reads the account type from the name: "asset:bank" is an asset.
        func kindOf(account string) string {
        	kind, _, _ := strings.Cut(account, ":")
        	return kind
        }

        // Balance derives an account's balance on the side where that kind of account grows:
        // assets and expenses grow with debits; liabilities, equity and revenue grow with credits.
        func (l *Ledger) Balance(account string) int64 {
        	var debit, credit int64
        	for _, tx := range l.txs {
        		for _, line := range tx.Lines {
        			if line.Account == account {
        				debit += line.Debit
        				credit += line.Credit
        			}
        		}
        	}
        	if kind := kindOf(account); kind == "asset" || kind == "expense" {
        		return debit - credit
        	}
        	return credit - debit
        }

        // cents prints minor units as an amount with two decimals: cents(1234) is "12.34".
        func cents(n int64) string {
        	sign := ""
        	if n < 0 {
        		sign, n = "-", -n
        	}
        	return fmt.Sprintf("%s%d.%02d", sign, n/100, n%100)
        }

        // format prints minor units with exp decimal places: format(1234, 2) is "12.34" (money.go).
        func format(minor int64, exp int) string {
        	sign := ""
        	if minor < 0 {
        		sign, minor = "-", -minor
        	}
        	digits := fmt.Sprintf("%0*d", exp+1, minor)
        	if exp == 0 {
        		return sign + digits
        	}
        	return sign + digits[:len(digits)-exp] + "." + digits[len(digits)-exp:]
        }

        // eth prints wei (10^18 per ether) without trailing zeros: eth(5e17) is "0.5".
        // int64 wei stops at about 9.22 ETH; a real system keeps 256-bit integers (lesson 03).
        func eth(wei int64) string {
        	return strings.TrimSuffix(strings.TrimRight(format(wei, 18), "0"), ".")
        }
      main.go: |
        package main

        import "fmt"

        const user = "liability:user:1042"

        func main() {
        	// user 1042 holds 0.503 ETH and withdraws 0.5; the network will charge 0.0015
        	s := newService(503*milli, 3*milli/2)
        	w := s.Request("k-1", user, "0x71c", ether/2)
        	again := s.Request("k-1", user, "0x71c", ether/2) // the client retries the submit
        	fmt.Println(again.ID, "again with key k-1: same withdrawal, reserved once")
        	s.Drive(w)
        	s.report()
        }

        // newService starts a 1 ETH hot wallet: user 1042 holds balance, user 2077 the rest.
        func newService(balance, fee int64) *Service {
        	s := &Service{chain: newChain(ether, fee), keys: map[string]*Withdrawal{}, holds: map[string]int64{}}
        	must(s.ledger.Post(Tx{ID: "d-1", Memo: "deposits", Lines: []Line{
        		{Account: "asset:chain", Debit: ether},
        		{Account: user, Credit: balance},
        		{Account: "liability:user:2077", Credit: ether - balance},
        	}}))
        	return s
        }

        // report prints the books, then the nightly check of the ledger against the chain.
        func (s *Service) report() {
        	l := &s.ledger
        	fmt.Printf("user %s  chain %s  gas %s  fees %s\n", eth(l.Balance(user)),
        		eth(l.Balance("asset:chain")), eth(l.Balance("expense:network-fee")), eth(l.Balance("revenue:fees")))
        	fmt.Printf("recon: chain wallet %s, ledger %s\n", eth(s.chain.Wallet), eth(l.Balance("asset:chain")))
        }
