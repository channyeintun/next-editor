# Fintech Engineering, lesson 37: end to end, a crypto withdrawal (Burmese).
#
# Source: Fintech Engineering Handbook, Appendix B "Flow 1: A crypto withdrawal" (CC BY 4.0,
# Voytek Pitula), with pointers back to the lessons that taught each pattern.
# Start state: chain.go (a fake node holding the hot wallet), flow.go (Request reserves amount +
# fee estimates under an idempotency key; Drive runs the stored state machine: compliance gate,
# sign and store the hash, broadcast, finality), books.go (the store, the final posting with the
# real fee, the overdraft), ledger.go (the course ledger + ETH formatting), main.go (the happy path).
# Edits, all insert-only, in main.go:
#   1. a world that crashes right after the broadcast, driven twice -> run-2 "sends on chain: 1"
#   2. a world whose real network fee is above the estimate           -> run-3 the overdraft line
# Runs: run-1 (reserve, same key again, posted, books, nightly check), run-2, run-3.
# Figures: flow (the whole withdrawal as a sequence, 7 steps), books (the final entry), crash
# (resume by asking the chain), fee (the fee above the hold, booked and recovered), iv.
# Facts: B15 (finality on Ethereum and Bitcoin).
# Built by ~/Documents/fintech-course-work/tools/build-lesson.ts; fixtures by sim-go.ts --write.
