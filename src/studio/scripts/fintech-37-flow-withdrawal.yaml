  - id: crash
    chapter: ခက်တဲ့ နေရာ ၁၊ broadcast ပြီးမှ crash
    narration: >-
      [[mark:show-crash]] ခက်တဲ့ နေရာ ပထမ တစ်ခုက broadcast နဲ့ confirmation ကြားမှာ process သေသွားတာပါ။
      [[mark:pt-store]] state ကို sending လို့ hash နဲ့ အတူ သိမ်းပြီးမှ broadcast လုပ်ခဲ့ပါတယ်။ [[mark:pt-crash]]
      နောက် state ကို မသိမ်းရခင် crash ဖြစ်သွားရင် driver ပြန်ကောက်တဲ့အခါ သိမ်းထားတာက sending ပဲ
      ရှိပါတယ်၊ ပို့ပြီးပြီလား မပို့ရသေးဘူးလား မသိပါဘူး။ [[mark:crash-2]] အဖြေက chain ကို hash နဲ့ မေးတာပါ။
      တွေ့ရင် ပို့ပြီးသားမို့ ရှေ့ဆက်ပြီး၊ မတွေ့မှ ပို့ပါတယ်။ lesson ၂၂ က effect နဲ့ မှတ်တမ်းကြားက ကွက်လပ်ပါပဲ၊
      ဒီမှာတော့ chain ကိုယ်တိုင်က hash ကို မှတ်ထားလို့ chain ကို မေးလို့ ရတာပါ။
      [[mark:close-crash]] code နဲ့ စမ်းကြည့်ရအောင်။ [[mark:type-crash]] ledger နဲ့ chain အသစ် တစ်စုံမှာ
      process ကို broadcast ပြီးတာနဲ့ သေအောင် လုပ်ထားပါတယ်။ Drive ကို ပထမ တစ်ခါ ခေါ်တော့ သေသွားပြီး၊
      ဒုတိယ တစ်ခါက သီးခြား driver က ပြန်ကောက်တာပါ။ chain ပေါ်မှာ transaction ဘယ်နှခု ရှိမလဲ
      ခန့်မှန်းကြည့်ပါ။ [[mark:run-2]] run လိုက်ရအောင်။ [[mark:pt-crashed]] ပထမ Drive က
      broadcast ပြီးတာနဲ့ သေသွားပါတယ်။ [[mark:pt-resumed]] ပြန်ကောက်တဲ့ driver က chain ကို မေးတော့ hash ကို
      တွေ့လို့ ထပ်မပို့ပါဘူး။ [[mark:pt-sends]] chain ပေါ်မှာ transaction တစ်ခုပဲ ရှိပါတယ်။ [[mark:dock-2]] hash ကို
      ပို့ပြီးမှ သိမ်းခဲ့ရင် ပြန်ကောက်တဲ့ driver မှာ မေးစရာ hash မရှိတော့လို့ အသစ် ပြန် sign လုပ်ပြီး
      ပို့မိရင် ETH သုည ဒသမ ငါး နှစ်ခါ ထွက်သွားနိုင်ပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Flow 1: A crypto withdrawal (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#flow-1-a-crypto-withdrawal",
        }
      - {
          title: "Fintech Engineering Handbook — Full resumability (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#full-resumability",
        }
      - {
          title: "Fintech Engineering Handbook — Idempotency (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#idempotency",
        }
    actions:
      - { id: show-crash, type: slide.show, at: { mark: show-crash }, slideId: crash-1 }
      - { id: pt-store, type: slide.point, at: { mark: pt-store }, target: { x: 0.302, y: 0.409 } }
      - { id: pt-crash, type: slide.point, at: { mark: pt-crash }, target: { x: 0.139, y: 0.589 } }
      - { id: crash-2, type: slide.show, at: { mark: crash-2 }, slideId: crash-2 }
      - {
          id: pt-ask,
          type: slide.point,
          at: { afterAction: crash-2 },
          target: { x: 0.475, y: 0.679 },
        }
      - { id: close-crash, type: slide.close, at: { mark: close-crash } }
      - id: type-crash
        type: editor.type
        at: { mark: type-crash }
        target: { file: main.go, after: "\ts.report()\n", occurrence: 1 }
        text: "\n\ts2 := newService(503*milli, 3*milli/2)\n\ts2.crashAfter = \"sending\" // the process dies right after the broadcast\n\tw2 := s2.Request(\"k-2\", user, \"0x71c\", ether/2)\n\ts2.Drive(w2) // dies\n\ts2.Drive(w2) // an independent driver resumes from the stored state\n\tfmt.Println(\"sends on chain:\", s2.chain.Sends())\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "sends on chain: 1",
          timeoutMs: 8000,
        }
      - id: pt-crashed
        type: console.point
        at: { mark: pt-crashed }
        target: { text: "w-2 crashed after the broadcast", occurrence: 1 }
      - id: pt-resumed
        type: console.point
        at: { mark: pt-resumed }
        target: { text: "w-2 resumed", occurrence: 1 }
      - id: pt-sends
        type: console.point
        at: { mark: pt-sends }
        target: { text: "sends on chain: 1", occurrence: 1 }
      - { id: dock-2, type: runtime.collapseDock, at: { mark: dock-2 } }
      - {
          id: expect-file,
          type: expect.file,
          at: { afterAction: run-2 },
          path: main.go,
          contains: 's2.crashAfter = "sending"',
        }

  - id: fee
    chapter: ခက်တဲ့ နေရာ ၂၊ fee က estimate ထက် များရင်
    narration: >-
      [[mark:show-fee]] ခက်တဲ့ နေရာ ဒုတိယ တစ်ခုက network fee အစစ်က reserve လုပ်ထားတဲ့ ခန့်မှန်းခြေထက်
      များလာတာပါ။ [[mark:pt-est]] hold ထဲမှာ fee အတွက် ဖယ်ထားတာက ခန့်မှန်းခြေ ပမာဏ ပဲ ရှိပါတယ်။
      [[mark:pt-over]] chain ကတော့ အဲဒီထက် ပိုယူသွားပြီး၊ broadcast ပြီးသွားလို့ ငြင်းလို့လည်း မရတော့ပါဘူး။
      user က balance အကုန်နီးပါး ထုတ်တဲ့ အခါမျိုးမှာ settle လုပ်လိုက်တာနဲ့ account က အနုတ် ဖြစ်သွားနိုင်ပါတယ်။
      [[mark:fee-2]] lesson ၁၉ မှာ ပြောခဲ့သလို ဒါကို overdraft အဖြစ် book လုပ်ပြီး တမင် ပြန်ယူရပါတယ်။
      balance ကို သုညမှာ clamp လုပ်လိုက်ရင်တော့ ငွေကို မရှိဘဲ ဖန်တီးလိုက်တာ ဖြစ်ပါတယ်။ [[mark:close-fee]] code နဲ့
      စမ်းကြည့်ရအောင်။ [[mark:type-fee]] ledger နဲ့ chain နောက်တစ်စုံမှာ chain က ယူမယ့် fee ကို ခန့်မှန်းခြေထက် များအောင်
      ထားပါတယ်။ withdrawal ကို အဆုံးထိ drive လုပ်ပြီး books နဲ့ ညဘက် check ကို ထုတ်ပါတယ်။
      [[mark:run-3]] run လိုက်ရအောင်။ [[mark:pt-overline]] post လုပ်တော့ charge က hold ထက် ပိုနေပါတယ်။
      [[mark:pt-od]] user balance က အနုတ် ဖြစ်သွားပြီး ledger မှာ ဖုံးမထားဘဲ ရှိနေပါတယ်၊ ပြန်ယူဖို့ trail ထဲမှာလည်း မှတ်ထားပါတယ်။
      [[mark:pt-recon3]] ညဘက် check ကတော့ ကိုက်ပါတယ်၊ ledger ထဲမှာ chain က တကယ် ယူသွားတဲ့ fee ကို book
      လုပ်ထားလို့ပါ။ [[mark:dock-3]] ခန့်မှန်းခြေကို book လုပ်ခဲ့ရင် ဒီ line မှာ chain နဲ့ ledger ကွာနေမှာဖြစ်ပြီး၊
      reconciliation က ဖမ်းပေးမှာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Flow 1: A crypto withdrawal (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#flow-1-a-crypto-withdrawal",
        }
      - {
          title: "Fintech Engineering Handbook — Handling overdrafts (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#handling-overdrafts",
        }
      - {
          title: "Fintech Engineering Handbook — Reconciliation (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#reconciliation",
        }
    actions:
      - { id: show-fee, type: slide.show, at: { mark: show-fee, offsetMs: -700 }, slideId: fee-1 }
      - { id: pt-est, type: slide.point, at: { mark: pt-est }, target: { x: 0.204, y: 0.447 } }
      - { id: pt-over, type: slide.point, at: { mark: pt-over }, target: { x: 0.472, y: 0.658 } }
      - { id: fee-2, type: slide.show, at: { mark: fee-2 }, slideId: fee-2 }
      - { id: pt-rc, type: slide.point, at: { afterAction: fee-2 }, target: { x: 0.725, y: 0.864 } }
      - { id: close-fee, type: slide.close, at: { mark: close-fee } }
      - id: type-fee
        type: editor.type
        at: { mark: type-fee }
        target:
          {
            file: main.go,
            after: "\tfmt.Println(\"sends on chain:\", s2.chain.Sends())\n",
            occurrence: 1,
          }
        text: "\n\ts3 := newService(503*milli, 7*milli/2) // the real fee comes in above the estimate\n\ts3.Drive(s3.Request(\"k-3\", user, \"0x71c\", ether/2))\n\ts3.report()\n"
        cadence: line-by-line
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "w-3 overdraft: user -0.0015 ETH",
          timeoutMs: 8000,
        }
      - id: pt-overline
        type: console.point
        at: { mark: pt-overline }
        target: { text: "w-3 final, posted 0.0015 over the hold", occurrence: 1 }
      - id: pt-od
        type: console.point
        at: { mark: pt-od }
        target: { text: "w-3 overdraft", occurrence: 1 }
      - id: pt-recon3
        type: console.point
        at: { mark: pt-recon3 }
        target: { text: "recon: chain wallet 0.4965", occurrence: 1 }
      - { id: dock-3, type: runtime.collapseDock, at: { mark: dock-3 } }

  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] Fintech system design interview တွေမှာ crypto withdrawal system တစ်ခု ဒီဇိုင်းဆွဲပါ လို့
      မေးလေ့ရှိပါတယ်။ box တွေ ဆွဲပြီး queue ထည့်ရုံနဲ့ မလုံလောက်ပါဘူး၊ ပြန်မရတဲ့ step ကို ဗဟိုထားပြီး
      ဖြေပါ။ [[mark:iv-a]] ပထမ၊ broadcast မတိုင်ခင် key နဲ့ request ကို claim လုပ်ပြီး၊ ပမာဏနဲ့ fee
      ခန့်မှန်းခြေကို atomic တစ်ဆင့်တည်းနဲ့ reserve လုပ်ပါ။ [[mark:iv-b]] ဒုတိယ၊ withdrawal ကို သိမ်းထားတဲ့
      state machine အဖြစ် ထားပါ၊ compliance မှာ ရက်ချီ အိပ်နိုင်ပြီး၊ resume လုပ်တဲ့အခါ chain ကို အရင်
      မေးပါတယ်။ [[mark:iv-c]] တတိယ၊ final ဖြစ်မှ fee အစစ်နဲ့ post လုပ်ပြီး၊ hold ထက် ကျော်ရင် overdraft ကို book
      လုပ်ပြီး ပြန်ယူပါ၊ ညတိုင်း ledger ကို chain နဲ့ reconcile လုပ်ပါ။ [[mark:iv-d]] ပြီးရင် ကိုယ် ဘာ build
      လုပ်မလဲ ဆက်ပြောပါ။ withdrawal table က state machine ဖြစ်ပြီး poller က drive လုပ်မယ်၊ hold ကို
      conditional write နဲ့ လုပ်မယ်၊ hash ကို ပို့ခင် သိမ်းမယ် ဆိုတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Flow 1: A crypto withdrawal (Voytek Pitula, CC BY 4.0)",
