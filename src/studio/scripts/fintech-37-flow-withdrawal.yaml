build:
  voiceProfile:
    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 9537

runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "w-1 reserved 0.503 ETH, available 0\nw-1 again with key k-1: same withdrawal, reserved once\nw-1 final, posted, released 0.0005\nuser 0.0005  chain 0.4985  gas 0.0015  fees 0.0025\nrecon: chain wallet 0.4985, ledger 0.4985\n"
      run-2:
        status: success
        exitCode: 0
        output: "w-1 reserved 0.503 ETH, available 0\nw-1 again with key k-1: same withdrawal, reserved once\nw-1 final, posted, released 0.0005\nuser 0.0005  chain 0.4985  gas 0.0015  fees 0.0025\nrecon: chain wallet 0.4985, ledger 0.4985\nw-2 reserved 0.503 ETH, available 0\nw-2 crashed after the broadcast\nw-2 resumed: 0x1351b352 is on chain, not sent again\nw-2 final, posted, released 0.0005\nsends on chain: 1\n"
      run-3:
        status: success
        exitCode: 0
        output: "w-1 reserved 0.503 ETH, available 0\nw-1 again with key k-1: same withdrawal, reserved once\nw-1 final, posted, released 0.0005\nuser 0.0005  chain 0.4985  gas 0.0015  fees 0.0025\nrecon: chain wallet 0.4985, ledger 0.4985\nw-2 reserved 0.503 ETH, available 0\nw-2 crashed after the broadcast\nw-2 resumed: 0x1351b352 is on chain, not sent again\nw-2 final, posted, released 0.0005\nsends on chain: 1\nw-3 reserved 0.503 ETH, available 0\nw-3 final, posted 0.0015 over the hold: fee 0.0035, estimate 0.002\nw-3 overdraft: user -0.0015 ETH, recover from the next deposit\nuser -0.0015  chain 0.4965  gas 0.0035  fees 0.0045\nrecon: chain wallet 0.4965, ledger 0.4965\n"

scenes:
  - id: hook
    chapter: Flow ၁၊ crypto withdrawal
    narration: >-
      ငွေ system ထဲကနေ အပြင်ကို ထွက်သွားတဲ့ crypto withdrawal က end-to-end flow သုံးခုထဲမှာ အဆင့် အများဆုံးပါ။
      chain က confirm လုပ်ပြီးရင် ပို့လိုက်တဲ့ ETH ကို ပြန်ယူလို့ မရတော့လို့ပါ။ [[mark:pt-flow0]] ဒါကြောင့်
      ပြန်မရတဲ့ အဆင့်ကို မရောက်ခင် ကျန်တဲ့ အရာအားလုံး ပြင်ဆင်ပြီးသား ဖြစ်နေရပါမယ်။
      [[mark:sc-user]] user တစ်ယောက်က ETH သုည ဒသမ ငါး ကို အပြင်က address တစ်ခုဆီ ထုတ်မယ်
      ဆိုပါစို့။ [[mark:pt-req]] request က idempotency key နဲ့ ရောက်လာပါတယ်။ lesson ၂၀ မှာလို key ကို
      user နဲ့ operation အလိုက် scope လုပ်ပြီး အလုပ် မစခင် claim လုပ်ရပါတယ်၊ ဒါမှ client က နှစ်ခါ ပို့လည်း
      withdrawal တစ်ခုပဲ ဖြစ်မှာပါ။ [[mark:flow-2]] ပြီးတော့ ပြန်မရတဲ့ အလုပ်
      မလုပ်ခင် ပမာဏနဲ့ network fee ခန့်မှန်းခြေကို reserve လုပ်ပါတယ်။
      lesson ၁၈ မှာ မြင်ခဲ့သလို balance စစ်တာနဲ့ reserve လုပ်တာက linearizable ဖြစ်တဲ့ တစ်ဆင့်တည်း
      ဖြစ်ရပါမယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Flow 1: A crypto withdrawal (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#flow-1-a-crypto-withdrawal",
        }
      - {
          title: "Fintech Engineering Handbook — Funds reservation (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#funds-reservation",
        }
      - {
          title: "Fintech Engineering Handbook — Idempotency (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#idempotency",
        }
    actions:
      - { id: open-main-1, type: workspace.openFile, at: { scene: start }, path: main.go }
      - { id: show-flow, type: slide.show, at: { scene: start, offsetMs: 300 }, slideId: flow-1 }
      - { id: pt-flow0, type: slide.point, at: { mark: pt-flow0 }, target: { x: 0.125, y: 0.184 } }
      - { id: pt-req, type: slide.point, at: { mark: pt-req }, target: { x: 0.196, y: 0.398 } }
      - { id: flow-2, type: slide.show, at: { mark: flow-2 }, slideId: flow-2 }
      - {
          id: pt-res,
          type: slide.point,
          at: { afterAction: flow-2 },
          target: { x: 0.382, y: 0.466 },
        }

  - id: gate
    chapter: Compliance gate မှာ ရက်ချီ အိပ်နိုင်တယ်
    narration: >-
      [[mark:flow-3]] တတိယ အဆင့်က ပြီးခဲ့တဲ့ lesson မှာ ကြည့်ခဲ့တဲ့ compliance gate ပါ။ sanctions၊ AML နဲ့ ပို့မယ့်
      address ကို screen လုပ်တာပါ။ ဒီနေရာမှာ pattern လေးခု ဆုံပါတယ်။ ပထမ၊ ဒါက အပြင်ဘက် call ဖြစ်လို့ lesson ၂၃ မှာလို
      နှေးမယ်၊ fail မယ်၊ မှားပြောမယ်လို့ ယူဆပြီး ရေးရပါတယ်။ [[mark:pt-rev]] ဒုတိယ၊ manual review ကို
      ရောက်သွားရင် နာရီချီ ရက်ချီ ကြာနိုင်လို့ flow က ဒီကြားမှာ သေသွားလည်း ဆက်သွားနိုင်ရပါမယ်။ lesson ၂၂ မှာလို
      state ကို သိမ်းထားပြီး သီးခြား driver တစ်ခုက ပြန်ကောက်ပါတယ်၊ အဲဒီ အတောအတွင်း reservation က နေရာမှာပဲ
      ရှိနေပါတယ်။ [[mark:pt-scr]] တတိယ၊ တစ်ရက်ကို ထုတ်ခွင့်ရှိတဲ့ limit ဆိုတာ lesson ၁၇ ရဲ့ invariant တစ်ခုပါပဲ။ အချိန်
      window ပါပြီး တပြိုင်နက် စစ်ရလို့ reservation နဲ့ ပြဿနာ အတူတူပါ၊ withdrawal နှစ်ခု ပြိုင်ပြီး
      နှစ်ခုလုံး limit ကို ဖြတ်သွားလို့ မရပါဘူး။ [[mark:pt-pass]] စတုတ္ထ၊ pass လား block လား၊ ဘယ်သူ
      override လုပ်ခဲ့လဲ ဆိုတဲ့ ဆုံးဖြတ်ချက် တိုင်းက audit trail ထဲ ရောက်ရပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Flow 1: A crypto withdrawal (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#flow-1-a-crypto-withdrawal",
        }
      - {
          title: "Fintech Engineering Handbook — Full resumability (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#full-resumability",
        }
      - {
          title: "Fintech Engineering Handbook — Invariants (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#invariants",
        }
    actions:
      - { id: flow-3, type: slide.show, at: { mark: flow-3 }, slideId: flow-3 }
      - {
          id: pt-scr-0,
          type: slide.point,
          at: { afterAction: flow-3 },
          target: { x: 0.475, y: 0.535 },
        }
      - { id: pt-rev, type: slide.point, at: { mark: pt-rev }, target: { x: 0.661, y: 0.604 } }
      - { id: pt-scr, type: slide.point, at: { mark: pt-scr }, target: { x: 0.475, y: 0.535 } }
      - { id: pt-pass, type: slide.point, at: { mark: pt-pass }, target: { x: 0.475, y: 0.672 } }

  - id: chain
    chapter: Broadcast၊ finality၊ post
    narration: >-
      [[mark:flow-4]] pass ရပြီ ဆိုရင် transaction ကို sign လုပ်ပြီး node ကနေ broadcast လုပ်ပါတယ်။ ပြန်မရတဲ့
      အဆင့်က ဒီတစ်ခုမို့ idempotent ဖြစ်ရပါမယ်။ network fee အစစ်ကိုလည်း ကြိုမသိနိုင်လို့ ခန့်မှန်းခြေကို reserve လုပ်ခဲ့တာပါ။ [[mark:flow-5]] ပြီးရင် finality ကို စောင့်ပါတယ်။
      confirmation တစ်ခုရရုံနဲ့ မပြီးသေးပါဘူး၊ ပြီးပြီလို့ စောစော ကြေညာထားတဲ့ send ကို reorg က
      ပြန်ဖျက်နိုင်လို့ပါ။ [[mark:pt-fin]] lesson ၃၅ မှာ မြင်ခဲ့သလို proof of stake Ethereum မှာ block
      တစ်ခု final ဖြစ်ဖို့ မိနစ် ၁၅ လောက် ကြာတယ်လို့ Ethereum ရဲ့ documentation က ဆိုပါတယ်။ [[mark:flow-6]] final ဖြစ်မှ ledger ထဲ post
      လုပ်ပြီး reservation ကို settle လုပ်ပါတယ်၊ entry တွေကို ခဏနေ code နဲ့ ကြည့်ပါမယ်။
      [[mark:flow-7]] နောက်ဆုံးက ဒီ flow နဲ့ သီးခြား ညတိုင်း run တဲ့ job ပါ။ ledger ကို chain ပေါ်က
      အမှန်တရားနဲ့ reconcile လုပ်ပြီး၊ confirm မဖြစ်ခဲ့တဲ့ broadcast၊ book လုပ်ထားတာနဲ့ မတူတဲ့ fee ကို
      ဖမ်းပေးတဲ့ safety net ပါ။ [[mark:pt-title]] ဒီ flow မှာ မူ သုံးခုလုံး ပါပါတယ်။ key နဲ့ reservation က ငွေကို
      မရှိဘဲ မဖန်တီးဖို့ No invented data ကို ထိန်းပါတယ်။ state နဲ့ trail က No lost data ကို၊ chain ကို
      ပြန်မေးတာနဲ့ reconciliation က No trust ကို ထိန်းပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Flow 1: A crypto withdrawal (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#flow-1-a-crypto-withdrawal",
        }
      - {
          title: "ethereum.org — Proof-of-stake (PoS): slots and epochs",
          url: "https://ethereum.org/developers/docs/consensus-mechanisms/pos/",
        }
      - {
          title: "ethereum.org — Single slot finality",
          url: "https://ethereum.org/roadmap/single-slot-finality/",
        }
    actions:
      - { id: flow-4, type: slide.show, at: { mark: flow-4 }, slideId: flow-4 }
      - {
          id: pt-bc,
          type: slide.point,
          at: { afterAction: flow-4 },
          target: { x: 0.568, y: 0.741 },
        }
      - { id: flow-5, type: slide.show, at: { mark: flow-5 }, slideId: flow-5 }
      - { id: pt-fin, type: slide.point, at: { mark: pt-fin }, target: { x: 0.568, y: 0.81 } }
      - { id: flow-6, type: slide.show, at: { mark: flow-6 }, slideId: flow-6 }
      - {
          id: pt-post,
          type: slide.point,
          at: { afterAction: flow-6 },
          target: { x: 0.382, y: 0.878 },
        }
      - { id: flow-7, type: slide.show, at: { mark: flow-7 }, slideId: flow-7 }
      - {
          id: pt-rec,
          type: slide.point,
          at: { afterAction: flow-7 },
          target: { x: 0.661, y: 0.947 },
        }
      - { id: pt-title, type: slide.point, at: { mark: pt-title }, target: { x: 0.125, y: 0.184 } }

  - id: code
    chapter: Code ထဲက state machine
    narration: >-
      [[mark:close-flow]] ဒီ flow ကို code နဲ့ ကြည့်ရအောင်။ [[mark:open-flow]] Request က key ကို ရှာပြီး
      ရှိပြီးသား ဆိုရင် ရှိတဲ့ withdrawal ကိုပဲ ပြန်ပေးပါတယ်။ [[mark:sel-hold]] မရှိမှ available ကို စစ်ပြီး
      ပမာဏနဲ့ fee နှစ်ခုကို တစ်ဆင့်တည်းမှာ hold လုပ်ပါတယ်။ [[mark:sel-drive]] Drive က withdrawal ကို
      သိမ်းထားတဲ့ state ကနေ ရှေ့ဆက်ပေးတာပါ၊ ထပ်ခေါ်လည်း အန္တရာယ် မရှိပါဘူး။ [[mark:sel-hash]] သတိထားရမှာက transaction ကို sign လုပ်ပြီး hash ကို ပို့ခင်မှာ
      သိမ်းထားတာပါ၊ ပို့ပြီးမှ မှတ်တာ မဟုတ်ပါဘူး။ [[mark:sel-find]] ဒါကြောင့် sending state မှာ chain ကို
      အဲဒီ hash နဲ့ အရင် မေးပြီး၊ chain က မမြင်ဖူးမှပဲ broadcast လုပ်ပါတယ်။ [[mark:open-main-2]] main မှာ
      ETH သုည ဒသမ ငါးသုညသုံး ရှိတဲ့ user က သုည ဒသမ ငါး ထုတ်ပါတယ်။ balance အကုန်နီးပါး ထုတ်တာပါ။
      [[mark:sel-again]] request ကို key တူတူနဲ့ နှစ်ခါ ပို့ထားပြီး၊ network fee အစစ်က ခန့်မှန်းခြေထက် နည်းပါတယ်။ [[mark:run-1]] run လိုက်ရအောင်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Flow 1: A crypto withdrawal (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#flow-1-a-crypto-withdrawal",
        }
      - {
          title: "Fintech Engineering Handbook — Full resumability (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#full-resumability",
        }
    actions:
      - { id: close-flow, type: slide.close, at: { mark: close-flow } }
      - { id: open-flow, type: workspace.openFile, at: { mark: open-flow }, path: flow.go }
      - id: sel-hold
        type: editor.select
        at: { mark: sel-hold }
        target:
          {
            file: flow.go,
            text: "\t\ts.keys[from+\"/withdraw/\"+key], w.Held = w, need\n\t\ts.holds[from] += need",
            occurrence: 1,
          }
      - id: sel-drive
        type: editor.select
        at: { mark: sel-drive }
        target: { file: flow.go, text: "func (s *Service) Drive(w *Withdrawal) {", occurrence: 1 }
      - id: sel-hash
        type: editor.select
        at: { mark: sel-hash }
        target:
          {
            file: flow.go,
            text: "\t\t\tw.Hash = fmt.Sprintf(\"0x%x\", sha256.Sum256([]byte(w.ID+w.To)))[:10]",
            occurrence: 1,
          }
      - id: sel-find
        type: editor.select
        at: { mark: sel-find }
        target: { file: flow.go, text: "\t\t\tif s.chain.Find(w.Hash) != nil {", occurrence: 1 }
      - { id: open-main-2, type: workspace.openFile, at: { mark: open-main-2 }, path: main.go }
      - id: sel-again
        type: editor.select
        at: { mark: sel-again }
        target:
          {
            file: main.go,
            text: "\tagain := s.Request(\"k-1\", user, \"0x71c\", ether/2)",
            occurrence: 1,
          }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "recon: chain wallet 0.4985, ledger 0.4985",
          timeoutMs: 8000,
        }

  - id: books
    narration: >-
      [[mark:pt-reserved]] hold က ပမာဏ၊ fee ခန့်မှန်းခြေနဲ့ service fee ပေါင်းထားတာဖြစ်ပြီး available က
      သုည ကျန်ပါတယ်။ [[mark:pt-again]] key တူ request ထပ်ရောက်တော့ withdrawal အသစ် မဖြစ်ဘဲ ရှိပြီးသားကိုပဲ
      ပြန်ရပါတယ်။ [[mark:pt-final]] final ဖြစ်တော့ post လုပ်ပြီး hold ထဲက ပိုနေတဲ့ အပိုင်းကို release
      လုပ်ပါတယ်။ [[mark:pt-recon]] ညဘက် check မှာ chain ပေါ်က wallet နဲ့ ledger ကိုက်ပါတယ်။
      [[mark:dock-1]] post လုပ်တဲ့ entry ကို ကြည့်ရအောင်။ [[mark:show-books]] user ကို ပမာဏ၊ chain က
      တကယ် ယူသွားတဲ့ network fee နဲ့ service fee ပေါင်းပြီး debit လုပ်ပါတယ်။ [[mark:pt-chain]] wallet
      ကနေ တကယ် ထွက်သွားတာက ပမာဏနဲ့ network fee ပါ။ [[mark:books-2]] network fee က chain ယူသွားတဲ့ ငွေမို့ expense
      ဖြစ်ပြီး၊ user ဆီက ကောက်တဲ့ fee တွေက revenue ပါ၊ debit နဲ့ credit ညီပါတယ်။ [[mark:pt-rel]] fee
      ခန့်မှန်းခြေကတော့ ဘယ် entry ထဲမှာမှ မပါပါဘူး၊ hold ထဲမှာပဲ ရှိခဲ့တာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Double-entry bookkeeping (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#double-entry-bookkeeping",
        }
      - {
          title: "Fintech Engineering Handbook — Funds reservation (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#funds-reservation",
        }
    actions:
      - id: pt-reserved
        type: console.point
        at: { mark: pt-reserved }
        target: { text: "w-1 reserved 0.503 ETH, available 0", occurrence: 1 }
      - id: pt-again
        type: console.point
        at: { mark: pt-again }
