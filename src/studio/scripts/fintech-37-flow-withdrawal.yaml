  - id: try-it
    chapter: ကိုယ်တိုင် စမ်းကြည့်ပါ
    narration: >-
      [[mark:close-iv]] ကိုယ်တိုင် စမ်းကြည့်ဖို့ တစ်ခု ရှိပါတယ်။ [[mark:sel-try]] ဒီ line မှာ ပို့မယ့် address ကို
      sanctions list ပေါ်က address တစ်ခုဖြစ်တဲ့ sanctioned နဲ့ အစားထိုးပြီး run ကြည့်ပါ။ ပထမ withdrawal က
      gate မှာ block ခံရပြီး hold တစ်ခုလုံး release ဖြစ်သွားပါမယ်၊ chain ကိုလည်း ဘာမှ မရောက်ပါဘူး။ [[mark:recap]] ပြန်ချုပ်ရရင်၊ crypto withdrawal
      က ပြန်မရတဲ့ broadcast ကို ဗဟိုထားတဲ့ flow ပါ၊ အရင် reserve လုပ်၊ state ကို သိမ်း၊ chain ကို ပြန်မေးပြီး
      final ဖြစ်မှ post လုပ်ပါတယ်။ နောက် lesson က ငွေ ဝင်လာတဲ့ card deposit ပါ၊ အဲဒီမှာ အခက်က နှစ်ခါ
      မပို့ဖို့ မဟုတ်တော့ဘဲ အပြင်ကမ္ဘာ ပြောတာကို မယုံဖို့ ဖြစ်လာပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Flow 1: A crypto withdrawal (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#flow-1-a-crypto-withdrawal",
