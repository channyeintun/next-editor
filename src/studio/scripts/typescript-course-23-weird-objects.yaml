      - id: type-cast
        type: editor.type
        at: { mark: type-cast }
        target: { file: src/main.ts, after: "prices[name", occurrence: 1 }
        text: " as keyof typeof prices"
        cadence: fast-explainer
      - id: expect-cast-fixed
        type: expect.preview
        at: { afterAction: type-cast }
