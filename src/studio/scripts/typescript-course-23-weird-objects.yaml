      - id: select-rush
        type: editor.select
        at: { mark: select-rush }
        target:
          {
            file: src/main.ts,
            text: 'const rush = ["သံပုရာရည်", "လက်ဖက်ရည်"].map((item) => ({',
            occurrence: 1,
          }
      - id: select-typo
        type: editor.select
        at: { mark: select-typo }
        target: { file: src/main.ts, text: "sugr", occurrence: 1 }

  - id: symptoms
    chapter: "အမှား တူပေမယ့် error တစ်ခုပဲ"
    narration: >
      [[mark:panel-ready]] panel ရဲ့ Output မှာ အော်ဒါ လေးခုလုံးက သကြား normal ဖြစ်နေပါတယ်။ နာမည်
      မှားနေတဲ့ property ကို function က ရှာမတွေ့လို့ ပုံမှန် အတိုင်းပဲ ဖျော်လိုက်တာပါ။
      [[mark:read-one-error]] ဒါပေမဲ့ Errors မှာ error တစ်ခုပဲ ရှိပြီး၊ object ကို တန်းရေးထားတဲ့ ပထမ
      အော်ဒါမှာ ဖြစ်ပါတယ်။ ဒီလို တန်းရေးထားတဲ့ object ကို object literal လို့ ခေါ်ပါတယ်။ error က ဒီ
      နာမည် Order type ထဲမှာ မရှိဘူး၊ sugar လို့ ရေးချင်တာလား လို့ ပြောနေတာပါ။ ကော်ဖီ အော်ဒါနဲ့ map က
      ဖန်တီးတဲ့ အော်ဒါတွေမှာတော့ အမှား တူတူ ရှိရက်နဲ့ ဘာမှ မပြောပါဘူး။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 12: The Weird Parts (excess property warnings)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/the-weird-parts",
        }
      - {
          title: "TypeScript Handbook: Object Types (excess property checks)",
          url: "https://www.typescriptlang.org/docs/handbook/2/objects.html#excess-property-checks",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-one-error
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-inline-code
        type: expect.preview
        at: { afterAction: expect-one-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-code, value: "2561" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-inline-line
        type: expect.preview
        at: { afterAction: expect-inline-code }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-line, value: "11" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-did-you-mean
        type: expect.preview
        at: { afterAction: expect-inline-line }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "'sugr' does not exist in type 'Order'. Did you mean to write 'sugar'?"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-four-lines
        type: expect.preview
        at: { afterAction: expect-did-you-mean }
        timeoutMs: 5000
        target: { by: testId, value: ts-output }
        attribute: { name: data-count, value: "4" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-coffee-normal
        type: expect.preview
        at: { afterAction: expect-four-lines }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-2 }
        textContains: "ကော်ဖီ သကြား normal"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-rush-normal
        type: expect.preview
        at: { afterAction: expect-coffee-normal }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-3 }
        textContains: "သံပုရာရည် သကြား normal"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: why-open
    chapter: "Object type တွေက open"
    narration: >
      [[mark:board-open]] ဘာကြောင့်လဲ ဆိုတာ ပုံနဲ့ ကြည့်ရအောင်။ [[mark:draw-type]] Order type က အော်ဒါ
      တစ်ခုမှာ အနည်းဆုံး ဘာတွေ ပါရမလဲ ဆိုတာကို ပြောတာ ဖြစ်ပြီး၊ ဒါတွေပဲ ပါရမယ်လို့ ကန့်သတ်တာ မဟုတ်ပါဘူး။
      [[mark:draw-value]] ကော်ဖီ object မှာ ပစ္စည်း နာမည်နဲ့ အရေအတွက် ပါတဲ့အတွက် Order နဲ့ ကိုက်ပြီး၊
      ပိုနေတဲ့ property က ပြဿနာ မဟုတ်ပါဘူး။ ဒီလို ပိုပါတာကို လက်ခံတဲ့ type ကို open type လို့ ခေါ်ပါတယ်။
      JavaScript မှာ object တစ်ခုကို နေရာ အမျိုးမျိုးမှာ ပြန်သုံးလေ့ ရှိပြီး၊ ပိုနေတဲ့ property ကို
      တခြား နေရာက လိုချင်နေတာလည်း ဖြစ်နိုင်လို့ပါ။ [[mark:draw-fresh]] ဒါပေမဲ့ function ကို ခေါ်တဲ့
      နေရာမှာ တန်းရေးလိုက်တဲ့ object ကိုတော့ တခြား ဘယ်နေရာကမှ သုံးလို့ မရတဲ့အတွက်၊ ပိုနေတဲ့ property က
      အမှား ဖြစ်ဖို့ များပါတယ်။ ဒါကြောင့် အဲဒီလို နေရာမှာပဲ TypeScript က excess property check လို့
      ခေါ်တဲ့ အပို စစ်ဆေးချက်ကို လုပ်ပေးတာပါ။ [[mark:draw-optional]] sugar က optional ဖြစ်နေတာကလည်း
      အမှား လွတ်သွားရတဲ့ အကြောင်းပါ။ မဖြစ်မနေ ပါရမယ့် property ဆိုရင်တော့ ပျောက်နေတယ်လို့ error ပြမှာပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 12: The Weird Parts (open vs closed object types)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/the-weird-parts",
        }
      - {
          title: "TypeScript Handbook: Object Types (excess property checks)",
          url: "https://www.typescriptlang.org/docs/handbook/2/objects.html#excess-property-checks",
        }
      - {
          title: "TypeScript Handbook: Type Compatibility",
          url: "https://www.typescriptlang.org/docs/handbook/type-compatibility.html",
        }
    actions:
      - id: board-open
        type: whiteboard.apply
        at: { mark: board-open }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-type
        type: whiteboard.apply
        at: { mark: draw-type }
        upsertIds: [b-type-box, b-type-name, b-type-props, b-type-min]
        drawMs: 2600
      - id: draw-value
        type: whiteboard.apply
        at: { mark: draw-value }
        upsertIds: [b-value-box, b-value-name, b-value-props, b-value-extra, b-arrow, b-fits]
        drawMs: 3600
      - id: draw-fresh
        type: whiteboard.apply
        at: { mark: draw-fresh }
        upsertIds: [b-fresh]
        drawMs: 1600
      - id: draw-optional
        type: whiteboard.apply
        at: { mark: draw-optional }
        upsertIds: [b-optional]
        drawMs: 1600

  - id: fixes
    chapter: "Variable နဲ့ callback ကိုလည်း စစ်ခိုင်းခြင်း"
    narration: >
      [[mark:close-board-open]] ဒါဆို ကော်ဖီ အော်ဒါကိုလည်း စစ်ခိုင်းကြည့်ရအောင်။
      [[mark:type-annotation]] variable နာမည်ရဲ့ နောက်မှာ Order type ကို annotation အနေနဲ့ ထည့်လိုက်ရင်၊
      object ကို ရေးတဲ့ နေရာမှာကတည်းက Order ဖြစ်ရမယ် ဆိုတာ TypeScript က သိသွားပါပြီ။
      [[mark:read-annotation]] ကော်ဖီ အော်ဒါအတွက် error အသစ် ပေါ်လာပါပြီ။ ပြီးခဲ့တဲ့ lesson က satisfies
      ကို သုံးရင်လည်း ဒီလိုပဲ စစ်ပေးပါတယ်။ [[mark:select-callback]] map ထဲက callback ကတော့ return type
      မရှိတဲ့အတွက်၊ TypeScript က ပြန်ပေးတဲ့ object ကနေ type ကို infer လုပ်ယူပြီး Order နဲ့ ပိုတာ
      မပိုတာကို မစစ်ပါဘူး။ [[mark:type-return]] ဒါကြောင့် return type ကို Order လို့ ရေးပေးလိုက်ပါမယ်။
      [[mark:read-return]] တတိယ error ပေါ်လာပြီး၊ အမှား သုံးနေရာလုံးကို အခုမှ မြင်ရပါပြီ။
      [[mark:type-fix-typos]] ကျနေတဲ့ စာလုံးကို သုံးနေရာလုံးမှာ ထည့်ပေးလိုက်ပါမယ်။ [[mark:read-fixed]]
      error တွေ ပျောက်သွားပြီး၊ အော်ဒါ လေးခုလုံး သကြား less ဖြစ်သွားပါပြီ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 12: The Weird Parts (no excess property checks on variables or when comparing functions)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/the-weird-parts",
        }
      - {
          title: "TypeScript Handbook: More on Functions (return type annotations)",
          url: "https://www.typescriptlang.org/docs/handbook/2/functions.html",
        }
      - {
          title: "TypeScript 4.9 release notes: the satisfies operator",
          url: "https://www.typescriptlang.org/docs/handbook/release-notes/typescript-4-9.html#the-satisfies-operator",
        }
    actions:
      - id: close-board-open
        type: whiteboard.apply
        at: { mark: close-board-open }
        open: false
      - id: type-annotation
        type: editor.type
        at: { mark: type-annotation }
        target: { file: src/main.ts, after: "const coffee", occurrence: 1 }
