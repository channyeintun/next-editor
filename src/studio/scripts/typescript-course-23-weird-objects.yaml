  - id: for-in
    narration: >
      [[mark:type-for-in]] ဒုတိယ နည်းကို ကြည့်ဖို့ ဒီနေ့ ရောင်းရတဲ့ ခွက်ရေကို ပစ္စည်း တစ်မျိုးချင်း
      မှတ်ထားတဲ့ object တစ်ခု ရေးပြီး၊ for in loop နဲ့ ပေါင်းကြည့်ရအောင်။ ရောင်းတဲ့ ပစ္စည်းတွေက
      နေ့တိုင်း မတူနိုင်လို့ ဒီ object ရဲ့ key တွေက ပုံသေ မဟုတ်ပါဘူး။ [[mark:read-for-in]] Output မှာ
      ဒီနေ့ ခွက်ရေ ၆၉ လို့ မှန်မှန် ထွက်ပေမယ့် ခုနက error မျိုး ထပ်ပေါ်လာပါတယ်။ [[mark:type-record]]
      ဒီတစ်ခါတော့ object ကိုယ်တိုင်ကို Record type နဲ့ ကြေညာပြီး၊ ဘယ် string key မဆို ရှိနိုင်တယ်၊ value
      တိုင်းက number ဖြစ်တယ်လို့ ပြောပါမယ်။ [[mark:read-record]] error မရှိတော့ပါဘူး။ ဒါပေမဲ့ ဘယ် key
      တွေ တကယ် ရှိလဲ ဆိုတာ TypeScript မသိတော့လို့၊ key နာမည် မှားရိုက်ရင် မဖမ်းနိုင်တော့ပါဘူး။ ဆိုတော့
      ဈေးနှုန်းလို key ပုံသေ ရှိတဲ့ object ဆိုရင် ပထမ နည်းကို၊ ခွက်ရေလို key အမျိုးမျိုး ဝင်လာနိုင်တဲ့
      စာရင်း ဆိုရင်တော့ ဒုတိယ နည်းကို ရွေးပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 12: The Weird Parts (object keys are loosely typed)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/the-weird-parts",
        }
      - {
          title: "TypeScript Handbook: Utility Types (Record<Keys, Type>)",
          url: "https://www.typescriptlang.org/docs/handbook/utility-types.html#recordkeys-type",
        }
      - {
          title: "MDN: for...in",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/for...in",
        }
    actions:
      - id: type-for-in
        type: editor.type
        at: { mark: type-for-in }
        target:
          { file: src/main.ts, after: "prices[name as keyof typeof prices]);\n}\n", occurrence: 1 }
        text: "\nconst cupsToday = { tea: 42, coffee: 18, lime: 9 };\nlet cups = 0;\nfor (const name in cupsToday) {\n  cups += cupsToday[name];\n}\nconsole.log(\"ဒီနေ့ ခွက်ရေ\", cups);\n"
        cadence: line-by-line
      - id: expect-for-in-error
        type: expect.preview
        at: { afterAction: type-for-in }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-for-in-code
        type: expect.preview
        at: { afterAction: expect-for-in-error }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-code, value: "7053" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-for-in-message
        type: expect.preview
        at: { afterAction: expect-for-in-code }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-1 }
        textContains: "expression of type 'string' can't be used to index type '{ tea: number; coffee: number; lime: number; }'"
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-total
        type: expect.preview
        at: { afterAction: expect-for-in-message }
        timeoutMs: 8000
        target: { by: testId, value: ts-out-8 }
        textContains: "ဒီနေ့ ခွက်ရေ 69"
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: type-record
        type: editor.type
        at: { mark: type-record }
        target: { file: src/main.ts, after: "const cupsToday", occurrence: 1 }
        text: ": Record<string, number>"
        cadence: fast-explainer
      - id: expect-record-fixed
        type: expect.preview
        at: { afterAction: type-record }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: evolving
    chapter: "Type မပါတဲ့ variable"
    narration: >
      [[mark:open-today]] တတိယ ထူးဆန်းချက်က variable တွေနဲ့ ဆိုင်ပါတယ်။ ဒါက ဆိုင်ရှေ့ ဆိုင်းဘုတ်အတွက်
      ဖိုင်ပါ။ [[mark:select-let]] ဒီ variable ကို type လည်း မပေး တန်ဖိုးလည်း မထည့်ဘဲ ကြေညာပြီး၊ မနက်မှာ
      မုန့်ဟင်းခါး ဆိုတဲ့ စာသား၊ ညနေမှာ ဈေးနှုန်းကို ထည့်ထားပါတယ်။ [[mark:type-queries]] နေရာ သုံးခုမှာ
      query comment ထည့်ပြီး type ကို မေးကြည့်ရအောင်။ [[mark:read-queries]] ကြေညာတဲ့ နေရာမှာ any
      ဖြစ်ပြီး၊ မနက်ပိုင်းမှာ string ဖြစ်ပြီး၊ ညနေပိုင်းမှာတော့ number ဖြစ်သွားပါတယ်။ ဒီလို any နဲ့
      စပြီး ထည့်တဲ့ တန်ဖိုးအတိုင်း type လိုက်ပြောင်းတာကို evolving any လို့ ခေါ်ပါတယ်။
      [[mark:select-sold]] array အလွတ်နဲ့ စတဲ့ variable မှာလည်း ဒီလိုပဲ ဖြစ်ပါတယ်။ ဒီ array က ရောင်းရတဲ့
      ပစ္စည်း နာမည်တွေ စုဖို့ ဖြစ်ပေမယ့်၊ [[mark:select-wrong-push]] နောက်ဆုံးမှာ နာမည် အစား ကော်ဖီ
      ဈေးကို ထည့်ထားပါတယ်။ [[mark:type-q-sold]] array ရဲ့ type ကိုလည်း မေးကြည့်ရအောင်။
      [[mark:read-q-sold]] string ဒါမှမဟုတ် number ပါတဲ့ array လို့ ပြပါတယ်။ ထည့်သမျှ လက်ခံပြီး type ကို
      ချဲ့သွားလို့၊ ဒီ အမှားကို ဘယ်တော့မှ error မပြပါဘူး။ [[mark:type-sold-annotation]] ဒါကြောင့် string
      array လို့ type annotation ကို ကိုယ်တိုင် ပေးလိုက်ပါမယ်။ [[mark:read-sold-error]] ဈေးနှုန်း
      ထည့်တဲ့ line မှာ error ပေါ်လာပါပြီ။ [[mark:type-comment-push]] အဲဒီ line ကို comment လုပ်ပြီး
      ပိတ်လိုက်ပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 12: The Weird Parts (the evolving any type, evolving any arrays)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/the-weird-parts",
        }
      - {
          title: "TypeScript 2.1 release notes: Improved any inference",
          url: "https://www.typescriptlang.org/docs/handbook/release-notes/typescript-2-1.html#improved-any-inference",
        }
      - {
          title: "TSConfig: noImplicitAny",
          url: "https://www.typescriptlang.org/tsconfig/#noImplicitAny",
        }
    actions:
      - id: open-today
        type: workspace.openFile
        at: { mark: open-today }
        path: src/today.ts
      - id: select-let
        type: editor.select
        at: { mark: select-let }
        target: { file: src/today.ts, text: "let special;", occurrence: 1 }
      - id: type-q-any
        type: editor.type
        at: { mark: type-queries }
        target: { file: src/today.ts, after: "let special;\n", occurrence: 1 }
        text: "//  ^?\n"
        cadence: block
      - id: type-q-morning
        type: editor.type
        at: { afterAction: type-q-any }
        target: { file: src/today.ts, after: "const morningSign = special;\n", occurrence: 1 }
        text: "//                  ^?\n"
        cadence: block
      - id: type-q-evening
        type: editor.type
        at: { afterAction: type-q-morning }
        target: { file: src/today.ts, after: "const eveningSign = special;\n", occurrence: 1 }
        text: "//                  ^?\n"
        cadence: block
      - id: expect-q-any
        type: expect.preview
        at: { afterAction: type-q-evening }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-2 }
        attribute: { name: data-type, value: "let special: any" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-q-morning
        type: expect.preview
        at: { afterAction: expect-q-any }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-3 }
        attribute: { name: data-type, value: "let special: string" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-q-evening
        type: expect.preview
        at: { afterAction: expect-q-morning }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-4 }
        attribute: { name: data-type, value: "let special: number" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: select-sold
        type: editor.select
        at: { mark: select-sold }
        target: { file: src/today.ts, text: "const sold = [];", occurrence: 1 }
      - id: select-wrong-push
        type: editor.select
        at: { mark: select-wrong-push }
        target: { file: src/today.ts, text: "sold.push(1800);", occurrence: 1 }
      - id: type-q-sold
        type: editor.type
        at: { mark: type-q-sold }
        target: { file: src/today.ts, after: "const names = sold.join(\", \");\n", occurrence: 1 }
        text: "//            ^?\n"
        cadence: block
      - id: expect-q-sold
        type: expect.preview
        at: { afterAction: type-q-sold }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-5 }
        attribute: { name: data-type, value: "const sold: (string | number)[]" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-sold-annotation
        type: editor.type
        at: { mark: type-sold-annotation }
        target: { file: src/today.ts, after: "const sold", occurrence: 1 }
        text: ": string[]"
      - id: expect-sold-error
        type: expect.preview
        at: { afterAction: type-sold-annotation }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-sold-error-code
        type: expect.preview
        at: { afterAction: expect-sold-error }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-1 }
        textContains: "Argument of type 'number' is not assignable to parameter of type 'string'."
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-sold-type
        type: expect.preview
        at: { afterAction: expect-sold-error-code }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-5 }
        attribute: { name: data-type, value: "const sold: string[]" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: type-comment-push
        type: editor.type
        at: { mark: type-comment-push }
        target: { file: src/today.ts, after: "sold.push(\"ကော်ဖီ\");\n", occurrence: 1 }
        text: "// "
      - id: expect-push-fixed
        type: expect.preview
        at: { afterAction: type-comment-push }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: empty-object
    chapter: "Empty object type"
    narration: >
      [[mark:type-sign]] နောက်ဆုံးကတော့ empty object type ပါ။ ဆိုင်းဘုတ် variable တစ်ခုကို
      ကွင်းအဖွင့်အပိတ်ပဲ ပါတဲ့ type နဲ့ ကြေညာပြီး၊ စာသား၊ ဂဏန်း၊ object တစ်ခု၊ null နဲ့ undefined ကို
      ထည့်ကြည့်ပါမယ်။ [[mark:read-sign]] error နှစ်ခု ပေါ်လာပြီး၊ null နဲ့ undefined ထည့်တဲ့ line
      တွေမှာပဲ ဖြစ်ပါတယ်။ ဆိုလိုတာက ဒီ type က object အလွတ် မဟုတ်ဘဲ၊ null နဲ့ undefined ကလွဲရင် ဘယ်
      တန်ဖိုးမဆို ဖြစ်ပါတယ်။ [[mark:explain-sign]] ဘာကြောင့်လဲဆိုတော့ ပါရမယ့် property တစ်ခုမှ မရှိတဲ့
      open type ဖြစ်လို့ပါ။ စာသားမှာ length လို property ရှိပြီး ဂဏန်းမှာလည်း method တွေ ရှိပါတယ်။
      property လုံးဝ မရှိတာက null နဲ့ undefined ပဲ ဖြစ်လို့ အဲဒီ နှစ်ခုကိုပဲ ပယ်တာပါ။ object တွေပဲ
      လိုချင်ရင် object type ကို သုံးပြီး၊ ဘာမဆို လက်ခံချင်ရင်တော့ unknown ကို သုံးတာ ပိုရှင်းပါတယ်။
      [[mark:type-comment-null]] စမ်းထားတဲ့ line နှစ်ကြောင်းကိုတော့ comment လုပ်ပြီး ပိတ်လိုက်ပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 12: The Weird Parts (the empty object type)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/the-weird-parts",
        }
      - {
          title: "TypeScript 4.8 release notes: {} and unknown narrowing",
          url: "https://www.typescriptlang.org/docs/handbook/release-notes/typescript-4-8.html#improved-intersection-reduction-union-compatibility-and-narrowing",
        }
    actions:
      - id: type-sign
        type: editor.type
        at: { mark: type-sign }
        target:
          { file: src/today.ts, after: "sold.join(\", \");\n//            ^?\n", occurrence: 1 }
        text: "\nlet sign: {} = \"ဒီနေ့ ဈေးလျှော့\";\nsign = 1500;\nsign = { item: \"ပလာတာ\" };\nsign = null;\nsign = undefined;\n"
        cadence: line-by-line
      - id: expect-sign-errors
        type: expect.preview
        at: { afterAction: type-sign }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-sign-null
        type: expect.preview
        at: { afterAction: expect-sign-errors }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-1 }
        textContains: "Type 'null' is not assignable to type '{}'."
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-sign-undefined
        type: expect.preview
        at: { afterAction: expect-sign-null }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-2 }
        textContains: "Type 'undefined' is not assignable to type '{}'."
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: type-comment-null
        type: editor.type
        at: { mark: type-comment-null }
        target: { file: src/today.ts, after: "sign = { item: \"ပလာတာ\" };\n", occurrence: 1 }
        text: "// "
      - id: type-comment-undefined
        type: editor.type
        at: { afterAction: type-comment-null }
        target: { file: src/today.ts, after: "// sign = null;\n", occurrence: 1 }
        text: "// "
      - id: expect-sign-fixed
        type: expect.preview
        at: { afterAction: type-comment-undefined }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: recap
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ TypeScript ရဲ့ object type တွေက open ဖြစ်လို့ property
      ပိုပါတဲ့ object ကိုလည်း လက်ခံပါတယ်။ excess property check က object ကို တန်းရေးတဲ့ နေရာမှာပဲ
      အလုပ်လုပ်လို့၊ variable နဲ့ callback တွေမှာ type annotation ပေးမှ ရပါတယ်။ [[mark:recap-keys]] ဒီ
      အကြောင်းကြောင့်ပဲ Object.keys နဲ့ for in က key ကို string အဖြစ် ပေးပြီး၊ empty object type ကလည်း
      null နဲ့ undefined ကလွဲရင် အကုန် လက်ခံပါတယ်။ type မပါတဲ့ variable တွေကတော့ ထည့်တဲ့ တန်ဖိုးအတိုင်း
      type ပြောင်းသွားလို့ annotation ပေးထားတာ စိတ်ချရပါတယ်။ နောက် lesson မှာတော့ ထူးဆန်းတဲ့ အပိုင်း
      ဒုတိယ ပိုင်းအနေနဲ့ function တွေရဲ့ ထူးဆန်းချက်တွေ၊ ပြီးတော့ type world နဲ့ value world အကြောင်းကို
      ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 12: The Weird Parts",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/the-weird-parts",
        }
    actions:
      - id: open-main-recap
        type: workspace.openFile
        at: { mark: recap }
        path: src/main.ts
      - id: select-coffee-recap
        type: editor.select
        at: { afterAction: open-main-recap }
        target: { file: src/main.ts, text: "const coffee: Order", occurrence: 1 }
      - id: select-record-recap
        type: editor.select
        at: { mark: recap-keys }
        target:
          { file: src/main.ts, text: "const cupsToday: Record<string, number>", occurrence: 1 }
      - id: expect-file-coffee
        type: expect.file
        at: { afterAction: select-coffee-recap }
        path: src/main.ts
        contains: 'const coffee: Order = { item: "ကော်ဖီ", quantity: 1, sugar: "less" };'
      - id: expect-file-rush
        type: expect.file
        at: { afterAction: expect-file-coffee }
        path: src/main.ts
        contains: ".map((item): Order => ({\n  item,\n  quantity: 1,\n  sugar: \"less\","
      - id: expect-file-keys
        type: expect.file
        at: { afterAction: expect-file-rush }
        path: src/main.ts
        contains: "console.log(name, prices[name as keyof typeof prices]);"
      - id: expect-file-record
        type: expect.file
        at: { afterAction: expect-file-keys }
        path: src/main.ts
        contains: "const cupsToday: Record<string, number> = { tea: 42, coffee: 18, lime: 9 };"
      - id: expect-file-sold
        type: expect.file
        at: { afterAction: expect-file-record }
        path: src/today.ts
        contains: "const sold: string[] = [];"
      - id: expect-file-sign
        type: expect.file
        at: { afterAction: expect-file-sold }
        path: src/today.ts
        contains: "// sign = null;\n// sign = undefined;"
checks:
  - { type: timing.p95Ms, max: 300 }
