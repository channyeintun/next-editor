        sendToKitchen({ item: "လက်ဖက်ရည်", quantity: 2, sugr: "less" });

        const coffee = { item: "ကော်ဖီ", quantity: 1, sugr: "less" };
        sendToKitchen(coffee);

        const rush = ["သံပုရာရည်", "လက်ဖက်ရည်"].map((item) => ({
