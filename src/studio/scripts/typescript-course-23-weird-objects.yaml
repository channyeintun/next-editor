      - id: expect-rush-less
        type: expect.preview
        at: { afterAction: expect-coffee-less }
        timeoutMs: 8000
        target: { by: testId, value: ts-out-3 }
        textContains: "သံပုရာရည် သကြား less"
        retry: { maxAttempts: 3, delayMs: 1200 }

  - id: keys
    chapter: "Object.keys က string ပဲ ပေးတယ်"
    narration: >
      [[mark:type-loop]] ဒုတိယ ထူးဆန်းချက်ကို ကြည့်ရအောင်။ ဈေးနှုန်း object တစ်ခု ရေးပြီး၊ Object.keys က
      ပေးတဲ့ key တွေနဲ့ ပစ္စည်း တစ်ခုချင်းရဲ့ ဈေးကို ထုတ်ပြပါမယ်။ [[mark:read-loop]] Output မှာ
      ဈေးနှုန်း သုံးခုလုံး မှန်မှန် ထွက်လာပေမယ့်၊ Errors မှာတော့ string နဲ့ ဒီ object ကို index လုပ်လို့
      မရဘူး ဆိုတဲ့ error ပေါ်လာပါတယ်။ [[mark:type-key-query]] key ရဲ့ type ကို query comment နဲ့
      မေးကြည့်ရအောင်။ [[mark:read-key-query]] Types မှာ string လို့ ပြပါတယ်။ key သုံးခုထဲက တစ်ခု မဟုတ်ဘဲ
      ဘယ် string မဆို ဖြစ်နိုင်တယ်လို့ ယူထားတာပါ။ [[mark:board-keys]] ဒါလည်း open ဖြစ်တာကြောင့်ပါ။
      [[mark:draw-keys-type]] type ထဲမှာ key သုံးခုပဲ ရေးထားပေမယ့်၊ [[mark:draw-keys-value]] run တဲ့
      အချိန်မှာ တကယ့် object ထဲမှာ key ပိုပါလာနိုင်ပါတယ်။ ကော်ဖီ object မှာ နာမည်မှား key
      ပိုပါနေခဲ့သလိုပါပဲ။ [[mark:draw-keys-result]] ဒါကြောင့် Object.keys က ဘယ် key တွေ ပေးမလဲ
      မသေချာနိုင်လို့ string လို့ပဲ ပြောပြီး၊ for in loop ကလည်း ဒီ အကြောင်းကြောင့် key ကို string အဖြစ်
      ပေးပါတယ်။ [[mark:close-board-keys]] ဖြေရှင်းနည်း နှစ်ခု ရှိပါတယ်။ ပထမ နည်းကို object ကို
      ကိုယ်တိုင် ရေးထားလို့ key ပိုမလာဘူးလို့ သေချာတဲ့အခါ သုံးပါတယ်။ [[mark:type-cast]] key ရဲ့ နောက်မှာ
      as နဲ့ key of type of ကို သုံးပြီး၊ ဒါ ဈေးနှုန်း object ရဲ့ key တစ်ခုပါလို့ ကတိပေးလိုက်တာပါ။
      [[mark:read-cast]] error ပျောက်သွားပေမယ့်၊ ကတိ မှားခဲ့ရင်တော့ TypeScript က ဖမ်းပေးနိုင်မှာ
      မဟုတ်ပါဘူး။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 12: The Weird Parts (object keys are loosely typed)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/the-weird-parts",
        }
      - {
          title: "TypeScript Handbook: Keyof Type Operator",
          url: "https://www.typescriptlang.org/docs/handbook/2/keyof-types.html",
        }
      - {
          title: "TypeScript Handbook: Typeof Type Operator",
          url: "https://www.typescriptlang.org/docs/handbook/2/typeof-types.html",
        }
      - {
          title: "MDN: Object.keys()",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/keys",
        }
    actions:
      - id: type-loop
        type: editor.type
        at: { mark: type-loop }
        target:
          {
            file: src/main.ts,
            after: "for (const order of rush) sendToKitchen(order);\n",
            occurrence: 1,
          }
        text: "\nconst prices = { tea: 1500, coffee: 1800, lime: 1200 };\nfor (const name of Object.keys(prices)) {\n  console.log(name, prices[name]);\n}\n"
        cadence: line-by-line
      - id: expect-loop-error
        type: expect.preview
        at: { afterAction: type-loop }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-loop-code
        type: expect.preview
        at: { afterAction: expect-loop-error }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-code, value: "7053" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-loop-message
        type: expect.preview
        at: { afterAction: expect-loop-code }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-1 }
        textContains: "expression of type 'string' can't be used to index type '{ tea: number; coffee: number; lime: number; }'"
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-loop-output
        type: expect.preview
        at: { afterAction: expect-loop-message }
        timeoutMs: 8000
        target: { by: testId, value: ts-out-5 }
        textContains: "tea 1500"
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: type-key-query
        type: editor.type
        at: { mark: type-key-query }
        target:
          { file: src/main.ts, after: "for (const name of Object.keys(prices)) {\n", occurrence: 1 }
        text: "  //        ^?\n"
        cadence: block
      - id: expect-key-type
        type: expect.preview
        at: { afterAction: type-key-query }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        attribute: { name: data-type, value: "const name: string" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: board-keys
        type: whiteboard.apply
        at: { mark: board-keys }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-keys-type
        type: whiteboard.apply
        at: { mark: draw-keys-type }
        upsertIds: [c-type]
        drawMs: 1200
      - id: draw-keys-value
        type: whiteboard.apply
        at: { mark: draw-keys-value }
        upsertIds: [c-value]
        drawMs: 1600
      - id: draw-keys-result
        type: whiteboard.apply
        at: { mark: draw-keys-result }
