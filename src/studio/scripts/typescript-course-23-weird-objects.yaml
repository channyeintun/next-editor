build:
  # Studio replaces this built-in profile at render time with the Burmese provider chosen in the
  # render console (AthanLab with the user's own key, or VoxCPM2 when that feature is enabled).
  voiceProfile: pocket-alba-v1
  seed: 2301
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "ထူးဆန်းတဲ့ အပိုင်း လေးခု"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ satisfies နဲ့ as ကို သုံးပြီး TypeScript ရဲ့ စစ်ဆေးချက်ကို
      ကိုယ့်ဘက်က ချိန်ညှိပုံကို ကြည့်ခဲ့ပါတယ်။ ဒီ lesson နဲ့ နောက် lesson မှာတော့ TypeScript ကို
      စသုံးတဲ့ သူတွေ အံ့ဩလေ့ရှိတဲ့ ထူးဆန်းတဲ့ အပြုအမူတွေနဲ့၊ အဲဒါတွေ ဘာကြောင့် ဖြစ်ရလဲ ဆိုတာကို
      ကြည့်သွားပါမယ်။ ဒီနေ့မှာတော့ object တွေနဲ့ ဆိုင်တဲ့ အချက် လေးချက်ပါ။ [[mark:draw-same-typo]] ပထမက၊
      စာလုံးပေါင်း အမှား တစ်ခုတည်းကို TypeScript က တစ်နေရာမှာ error ပြပြီး နောက်တစ်နေရာမှာ ဘာမှ
      မပြောတာပါ။ [[mark:draw-keys]] ဒုတိယက၊ Object.keys နဲ့ ယူလိုက်တဲ့ key တွေက ကိုယ် ရေးထားတဲ့ နာမည်တွေ
      မဟုတ်ဘဲ ရိုးရိုး string ဖြစ်နေတာပါ။ [[mark:draw-evolve]] တတိယက၊ type မပေးထားတဲ့ variable ရဲ့ type
      က ထည့်လိုက်တဲ့ တန်ဖိုးအတိုင်း လိုက်ပြောင်းသွားတာပါ။ [[mark:draw-empty]] စတုတ္ထကတော့ object
      အလွတ်လို့ ထင်ရတဲ့ empty object type က တကယ်တော့ အဓိပ္ပာယ် တခြားစီ ဖြစ်နေတာပါ။ [[mark:draw-open]]
      ဒါတွေ ထူးဆန်းသလို ထင်ရပေမယ့်၊ အများစုက TypeScript ရဲ့ object type တွေ open ဖြစ်နေတာကနေ လာတာပါ။
      open ဆိုတာ ဘာလဲ ဆိုတာကို code ထဲမှာ ကြည့်ရင်း နားလည်သွားပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 12: The Weird Parts",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/the-weird-parts",
        }
      - {
          title: "TypeScript Handbook: Type Compatibility (structural typing)",
          url: "https://www.typescriptlang.org/docs/handbook/type-compatibility.html",
        }
    actions:
      - id: open-board-a
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-same-typo
        type: whiteboard.apply
        at: { mark: draw-same-typo }
        upsertIds: [a-1]
        drawMs: 1600
      - id: draw-keys
        type: whiteboard.apply
        at: { mark: draw-keys }
        upsertIds: [a-2]
        drawMs: 1400
      - id: draw-evolve
        type: whiteboard.apply
        at: { mark: draw-evolve }
        upsertIds: [a-3]
        drawMs: 1500
      - id: draw-empty
        type: whiteboard.apply
        at: { mark: draw-empty }
        upsertIds: [a-4]
        drawMs: 1200
      - id: draw-open
        type: whiteboard.apply
        at: { mark: draw-open }
        upsertIds: [a-open, a-open-line]
        drawMs: 2000

  - id: starter
    narration: >
      [[mark:close-board]] ဒီနေ့ code ကို ကြည့်ရအောင်။ [[mark:open-main]] ဒါက မီးဖိုချောင်ကို အော်ဒါ
      ပို့ပေးတဲ့ program ပါ။ [[mark:select-order-type]] အော်ဒါ တစ်ခုမှာ ပစ္စည်း နာမည်၊ အရေအတွက်နဲ့ သကြား
      ဘယ်လောက် ထည့်မလဲ ဆိုတာ ပါပြီး၊ သကြားကတော့ optional property ပါ။ [[mark:select-send]] ဒီ function က
      အော်ဒါရဲ့ ပစ္စည်းနဲ့ သကြား အဆင့်ကို ထုတ်ပြပြီး၊ သကြား မပါရင်တော့ normal လို့ ပြပါတယ်။
      [[mark:select-inline]] အောက်မှာ အော်ဒါ ပို့ပုံ သုံးမျိုး ရှိပါတယ်။ ပထမ တစ်မျိုးက function ကို
      ခေါ်တဲ့ နေရာမှာပဲ object ကို တန်းရေးထားတာပါ။ [[mark:select-variable]] ဒုတိယက object ကို variable
      ထဲ အရင် ထည့်ပြီးမှ ပို့တာ ဖြစ်ပြီး၊ [[mark:select-rush]] တတိယကတော့ ပစ္စည်း နာမည် စာရင်းကနေ map နဲ့
      အော်ဒါတွေကို တစ်ခါတည်း ဖန်တီးတာပါ။ [[mark:select-typo]] ဒီ property နာမည်ကို ကြည့်ပါ။ sugar လို့
      ရေးရမယ့် နေရာမှာ စာလုံး တစ်လုံး ကျနေပြီး၊ ဒီ အမှားက အော်ဒါ သုံးမျိုးလုံးမှာ ပါပါတယ်။ customer
      တွေကတော့ သကြား နည်းနည်းပဲ ထည့်ခိုင်းထားတာပါ။
    sources:
      - {
          title: "TypeScript Handbook: Object Types (optional properties)",
          url: "https://www.typescriptlang.org/docs/handbook/2/objects.html#optional-properties",
        }
      - {
          title: "MDN: Array.prototype.map()",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/map",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: src/main.ts
      - id: select-order-type
        type: editor.select
        at: { mark: select-order-type }
        target:
          {
