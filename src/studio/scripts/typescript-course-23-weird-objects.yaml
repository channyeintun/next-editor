        target: { by: testId, value: ts-error-2 }
        attribute: { name: data-line, value: "13" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: select-callback
        type: editor.select
        at: { mark: select-callback }
        target: { file: src/main.ts, text: "(item) => ({", occurrence: 1 }
      - id: type-return
        type: editor.type
        at: { mark: type-return }
        target: { file: src/main.ts, after: ".map((item)", occurrence: 1 }
        text: ": Order"
      - id: expect-three-errors
