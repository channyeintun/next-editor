# CSS course (Burmese), lesson 15 of 43: flexbox part 1, axes and wrap.
#
# Narration is Burmese (voice-script.md next to this file is its source, with
# the marks inline; DESIGN.md is the span-by-span brief). Every [[mark:…]] sits
# where its action begins, at a sentence end or right after a ၊ pause; each
# span carries one piece of meaning.
#
# Shape: board (recall lesson 14; the sidebar pattern; flexbox lays a group out
# along one direction; what a flex layout can do; the three flexbox lessons)
# while the dev server starts → code tour (index.html: the nav list, the chip
# row and its right-to-left copy, the snack list; empty styles.css) → the nav
# list becomes a flex container: row, content-sized, at the start, no grow, no
# wrap; initial values; inline flex → board (main and cross axis for row and
# column; main-start/main-end, cross-start/cross-end) → the chips become a
# flex row: the right-to-left copy starts on the right (writing direction;
# vertical writing modes) → column, column-reverse, row-reverse on the chips →
# board (visual order vs HTML/Tab/screen-reader order; reading-flow) → the
# snack list becomes a flex row: the cards shrink to min-content and overflow
# past the list's dashed edge (nowrap default; cross-axis stretch; quiz: grid
# does not drop columns by itself either, lesson 19) → wrap, then wrap-reverse;
# flex-wrap: balance named (Chrome and Edge) → board (each flex line is independent; grid lines up both ways; one
# dimension) → flex-flow: row wrap (the shorthand undoes wrap-reverse), gap →
# recap, hand-off to lesson 16 (grow, shrink, basis).
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set(; no postcss config; no HTML edit,
# so no reload; no interaction. Mid-typing prefixes: every keystroke-typed
# value has either no valid prefix or only the value already in force
# ("column" while typing column-reverse after column, "wrap" while typing
# wrap-reverse after wrap). The two lines whose prefix would flash a different
# layout ("row" inside row-reverse after column-reverse, "row" inside
# "row wrap", which means row nowrap) are typed line-by-line.
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
