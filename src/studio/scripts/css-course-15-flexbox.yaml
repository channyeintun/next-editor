      # base.css: sections A, B, B2, C (with .menu-card margin 0, so only the
      # typed gap ever spaces the cards) and D (.demo). Section E pins the
      # dashed outlines on the nav items, the chip pills, the row captions,
      # the sections' top space, and a min-height on the snacks section so
      # the preview can always scroll the snack list to the top. Never typed,
      # never shown; none of it is flex layout.
      base.css: |
        /*
          base.css: pinned, never typed during a lesson.
          The shop's palette and the page furniture, so the CSS a lesson types can
          focus on one idea. Lesson 15 keeps sections A, B, B2, C (cards with no
          margin, so only a typed gap ever spaces them) and D, and pins the chip
          pills and the outlined nav items in section E.
        */

        /* == A. palette == */
        :root {
          color-scheme: light;
          --tea-dark: #3b2314;
          --tea: #8b5a2b;
          --tea-light: #c9a27e;
          --cream: #fff8ec;
          --paper: #fdf3e1;
          --leaf: #2f6b3a;
          --gold: #c9a227;
          --chili: #b23a2b;
          --ink: #2b1d14;
          --muted: #6b5a4c;
          --line: #e6d5bf;
          --radius: 12px;
        }

        /* == B. page == */
        body {
          margin: 0;
          font-family: "Noto Sans Myanmar", "Myanmar Sangam MN", "Myanmar MN", "Myanmar Text", "Padauk",
            system-ui, sans-serif;
          font-size: 16px;
          line-height: 1.8;
          color: var(--ink);
          background: var(--paper);
        }

        .page {
          padding: 0 16px 24px;
        }

        h1,
        h2,
        h3 {
          margin: 0 0 8px;
          line-height: 1.5;
        }

        h1 {
          font-size: 24px;
        }

        h2 {
          font-size: 20px;
        }

        h3 {
          font-size: 17px;
        }

        a {
          color: var(--tea);
        }

        /* Status lines that only expect.preview reads (kit.js data-report, data-say). */
        .visually-hidden {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip-path: inset(50%);
          white-space: nowrap;
        }

        /* == B2. reset (lesson 2 teaches it; every later lesson keeps it) == */
        *,
        *::before,
        *::after {
          box-sizing: border-box;
        }

        /* == C. furniture == */
        .site-header {
          padding: 16px;
          background: var(--tea-dark);
          color: var(--cream);
        }

        .site-header a {
          color: var(--cream);
        }

        .logo {
          display: block;
        }

        .tagline {
          margin: 0;
          color: var(--tea-light);
          font-size: 14px;
        }

        .nav ul {
          margin: 8px 0 0;
          padding: 0;
          list-style: none;
        }

        .hero {
          margin: 16px 0;
          padding: 16px;
          background: var(--cream);
          border-radius: var(--radius);
        }

        .menu {
          margin: 0;
          padding: 0;
          list-style: none;
        }

        .menu-card {
          margin: 0;
          padding: 12px 16px;
          background: #fff;
          border: 1px solid var(--line);
          border-radius: var(--radius);
        }

        .menu-card .name,
        .menu-card .desc {
          margin: 0;
        }

        .menu-card .desc {
          color: var(--muted);
          font-size: 14px;
        }

        .price {
          font-weight: 700;
          color: var(--tea);
        }

        .badge {
          padding: 0 8px;
          border-radius: 999px;
          background: var(--leaf);
          color: #fff;
          font-size: 13px;
        }

        .sold-out {
          opacity: 0.6;
        }

        .order-link,
        .order-btn {
          display: inline-block;
          padding: 6px 16px;
          border: 0;
          border-radius: 999px;
          background: var(--tea);
          color: #fff;
          font: inherit;
          text-decoration: none;
        }

        .order-form label {
          display: block;
          margin-top: 8px;
        }

        .order-form input[type="text"],
        .order-form input[type="tel"],
        .order-form input[type="number"] {
          box-sizing: border-box;
          width: 100%;
          padding: 6px 10px;
          border: 1px solid var(--line);
          border-radius: 8px;
          background: #fff;
          font: inherit;
        }

        .order-btn {
          margin-top: 12px;
        }

        .gallery figure {
          margin: 0 0 12px;
        }

        .gallery img {
          display: block;
          max-width: 100%;
          height: auto;
          border-radius: var(--radius);
        }

        figcaption {
          color: var(--muted);
          font-size: 14px;
        }

        .hours-list {
          margin: 0;
          padding-left: 20px;
        }

        .site-footer {
          margin-top: 24px;
          padding: 16px;
          background: var(--tea-dark);
          color: var(--cream);
          font-size: 14px;
        }

        .site-footer a {
          color: var(--cream);
        }

        /* == D. helpers == */
        /* .demo shows a box's edges without changing layout (outline takes no space). */
        .demo {
          outline: 1px dashed var(--muted);
        }

        /* == E. lesson rules == */
        /* Lesson 15: the nav items show their edges; the tea-strength chips are pills. */
        .nav li {
          padding: 0 8px;
          outline: 1px dashed var(--tea-light);
        }

        .row-label {
          margin: 8px 0 4px;
          color: var(--muted);
          font-size: 14px;
        }

        .chip {
          padding: 2px 12px;
          background: var(--cream);
          border: 1px solid var(--tea-light);
          border-radius: 999px;
        }

        .strengths,
        .snacks {
          margin-top: 16px;
        }

        /* Tall enough that the preview can always scroll the snacks to the top. */
        .snacks {
          min-height: 100vh;
        }
