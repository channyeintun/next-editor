build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 4115

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  - id: intro
    chapter: "Flexbox ဘာကြောင့် လိုလဲ"
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ position နဲ့ transform သုံးပြီး box တွေကို ရွှေ့ခဲ့ပေမယ့်၊ page ပေါ်က box
      အများစုကတော့ အပေါ်ကနေ အောက်ကို ဆင့်နေတုန်းပါ။ ဒီ lesson ကနေ flexbox ကို စကြည့်ပါမယ်။
      [[mark:start-server]] ဒီလို ပြောနေတုန်းမှာပဲ၊ board နောက်မှာ dev server ကို စ နေပါပြီ။
      [[mark:draw-wide]] မကြာခဏ တွေ့ရတဲ့ layout တစ်ခုက ဘေးမှာ sidebar၊ ကျန်တဲ့ နေရာမှာ အဓိက content
      ရှိတာပါ။ screen ကျယ်ရင် နှစ်ခုက ဘေးချင်းကပ် ရှိပါတယ်။ [[mark:draw-narrow]] ဖုန်းလို screen
      ကျဉ်းမှာတော့ နှစ်ခုလုံး ဘေးချင်း မဆံ့လို့၊ sidebar က content ရဲ့ အပေါ်ကို ရောက်သွားတာ
      ပိုကောင်းပါတယ်။ [[mark:flexible-limits]] flexbox က ဒီလို layout နဲ့ သင့်တော်ပါတယ်။ အရွယ်အစား ပုံသေ
      မပေးဘဲ၊ ဘယ်လောက်ထိ ကြီးမလဲ ကျုံ့မလဲ ဆိုတဲ့ အကန့်အသတ်ပဲ ပေးရလို့ပါ။ နေရာ မလောက်ရင်လည်း item တွေက
      နောက်တစ်တန်းကို ဆင်းနိုင်ပါတယ်။ [[mark:draw-row]] flexbox ဆိုတာ item အုပ်စု တစ်ခုကို row တစ်ခု
      ဒါမှမဟုတ် column တစ်ခု၊ တစ်ဘက်တည်းအတိုင်း တန်းစီပေးတဲ့ layout နည်းပါ။ ဒါကြောင့် flexbox ကို
      one-dimensional layout လို့ ခေါ်ပါတယ်။ item တွေ အရွယ်အစား မတူရင်လည်း တစ်ခုချင်း မဟုတ်ဘဲ အုပ်စုလိုက်
      ကြည့်ပြီး၊ တန်းထဲမှာ အဆင်ပြေဆုံး ဆံ့အောင် နေရာ ခွဲပေးပါတယ်။ [[mark:features]] flex layout က row
      ဒါမှမဟုတ် column ဖြစ်နိုင်ပြီး၊ စာရေးတဲ့ ဦးတည်ရာကို လိုက်ပါတယ်။ တစ်တန်းတည်း ထားမလား၊ နောက်တစ်တန်း
      ဆင်းခွင့် ပေးမလား ရွေးနိုင်သလို၊ အစဉ် ပြောင်းပြတာ၊ ကြီးအောင် ကျုံ့အောင် လုပ်တာ၊ align လုပ်တာတွေလည်း
      ရပါတယ်။ [[mark:draw-roadmap]] ဒါတွေ အကုန်လုံးက lesson တစ်ခုစာ မကလို့ flexbox ကို lesson သုံးခု
      ခွဲထားပါတယ်။ ဒီနေ့ flex container၊ သူ့ရဲ့ axis နှစ်ခု၊ direction နဲ့ wrap ကို ကြည့်ပါမယ်။ lesson 16 မှာ item တွေ ကြီးတာ ကျုံ့တာနဲ့ ဒီ sidebar layout ကို၊ lesson 17 မှာ alignment ကို ကြည့်ပါမယ်။
    sources:
      - title: "web.dev Learn CSS — Flexbox"
        url: "https://web.dev/learn/css/flexbox"
      - title: "web.dev Learn CSS — Flexbox: what can you do with a flex layout?"
        url: "https://web.dev/learn/css/flexbox#what_can_you_do_with_a_flex_layout"
      - title: "web.dev Learn CSS — Layout: flexbox"
        url: "https://web.dev/learn/css/layout#flexbox"
      - title: "MDN — Basic concepts of flexbox"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_flexible_box_layout/Basic_concepts_of_flexbox"
    actions:
      - id: open-intro-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      # Runs in the background (boot + pnpm install + spawn); waitForReady sits
      # on the preview mark at the end of the code tour, about two minutes of
      # narration later.
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 45000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-wide
        type: whiteboard.apply
        at: { mark: draw-wide }
        upsertIds: [a-wide-frame, a-wide-sb, a-wide-sb-t, a-wide-ct, a-wide-ct-t, a-wide-label]
        drawMs: 2400
      - id: draw-narrow
        type: whiteboard.apply
        at: { mark: draw-narrow }
        upsertIds:
          [a-narrow-frame, a-narrow-sb, a-narrow-sb-t, a-narrow-ct, a-narrow-ct-t, a-narrow-label]
        drawMs: 2400
      - id: draw-row
        type: whiteboard.apply
        at: { mark: draw-row }
        upsertIds: [a-row-1, a-row-2, a-row-3, a-row-arrow, a-row-label]
        drawMs: 2600
      - id: draw-roadmap
        type: whiteboard.apply
        at: { mark: draw-roadmap }
        upsertIds: [a-road-15, a-road-16, a-road-17]
        drawMs: 2400

  - id: code-tour
    narration: >
      [[mark:close-board]] project ကို ကြည့်ရအောင်။ [[mark:open-index]] ဒါက HTML ဖိုင်ပါ။ အပေါ်ဆုံးမှာ
      ဆိုင်ရဲ့ header ရှိပါတယ်။ [[mark:select-nav]] header ထဲက navigation က link သုံးခု ပါတဲ့ list
      တစ်ခုပါ။ list item တစ်ခုစီမှာ မျဉ်းပြတ် outline ပါလို့၊ သူ့ box ဘယ်က စပြီး ဘယ်မှာ ဆုံးလဲ မြင်ရပါတယ်။
      [[mark:select-chips]] header အောက်မှာ လက်ဖက်ရည် အရသာ တစ်မျိုးစီအတွက် chip လေးခု တစ်တန်း ရှိပါတယ်။
      [[mark:select-rtl]] ပြီးတော့ အဲဒီ chip တွေကိုပဲ နောက်ထပ် box တစ်ခုထဲမှာ ထပ်ပြီး ထည့်ထားပါတယ်။ ဒီ box ထဲမှာတော့ Arabic တို့ Hebrew တို့လို စာကို ညာကနေ ဘယ် ရေးပါတယ်။ [[mark:select-snacks]] နောက်ဆုံးက card
      ငါးခု ပါတဲ့ စားစရာ menu ပါ။ သူ့ list မှာလည်း မျဉ်းပြတ် outline ပါပြီး၊ card တွေမှာ margin မရှိလို့
      card တွေကြားမှာ နေရာလွတ် မရှိသေးပါဘူး။ [[mark:open-styles]] ကိုယ့် CSS ဖိုင်က အလွတ်ပါ။
      [[mark:preview-opens]] dev server အသင့် ဖြစ်လို့ preview ပွင့်လာပါပြီ။ nav item တွေနဲ့ စားစရာ card
      တွေက အပေါ်အောက် ဆင့်နေပါတယ်။ flow layout က block box တွေကို အဲဒီလို စီလို့ပါ။
    sources:
      - title: "web.dev Learn CSS — Layout: normal flow"
        url: "https://web.dev/learn/css/layout#flow"
      - title: "MDN — The dir global attribute"
        url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Global_attributes/dir"
      - title: "MDN — Block and inline layout in normal flow"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_display/Block_and_inline_layout_in_normal_flow"
    actions:
      - id: close-intro-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: open-index
        type: workspace.openFile
        at: { mark: open-index }
        path: index.html
      - id: select-nav
        type: editor.select
        at: { mark: select-nav }
        target:
          {
            file: index.html,
            text: "<ul>\n          <li><a class=\"nav-link active\" href=\"#drinks\" data-testid=\"nav-drinks\">မီနူး</a></li>\n          <li><a class=\"nav-link\" href=\"#hours\" data-testid=\"nav-hours\">ဖွင့်ချိန်</a></li>\n          <li><a class=\"nav-link\" href=\"#order\" data-testid=\"nav-order\">မှာယူရန်</a></li>\n        </ul>",
            occurrence: 1,
          }
      - id: select-chips
        type: editor.select
        at: { mark: select-chips }
        target:
          { file: index.html, text: '<div class="chips demo" data-testid="chips">', occurrence: 1 }
      - id: select-rtl
        type: editor.select
        at: { mark: select-rtl }
        target: { file: index.html, text: '<div dir="rtl" data-testid="rtl-box">', occurrence: 1 }
      - id: select-snacks
        type: editor.select
        at: { mark: select-snacks }
        target:
          {
            file: index.html,
            text: '<ul class="menu demo" data-testid="menu-snacks">',
            occurrence: 1,
          }
      - id: open-styles
        type: workspace.openFile
        at: { mark: open-styles }
        path: styles.css
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { mark: preview-opens }
        timeoutMs: 20000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-dev-server }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-header
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: shop-name }
        textContains: "ရွှေလက်ဖက်ရည်ဆိုင်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-chips
        type: expect.preview
        at: { afterAction: expect-header }
        timeoutMs: 5000
        target: { by: testId, value: chips }
        textContains: "ချိုဆိမ့်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-rtl-box
        type: expect.preview
        at: { afterAction: expect-chips }
        timeoutMs: 5000
        target: { by: testId, value: rtl-box }
        attribute: { name: dir, value: rtl }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-snacks
        type: expect.preview
        at: { afterAction: expect-rtl-box }
        timeoutMs: 5000
        target: { by: testId, value: menu-snacks }
        textContains: "ရှမ်းခေါက်ဆွဲ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: collapse-runner-dock
        type: runtime.collapseDock
        at: { afterAction: expect-snacks }

  - id: display-flex
    chapter: "Flex container လုပ်ကြည့်ရအောင်"
    narration: >
      [[mark:type-nav]] nav ကနေ စကြည့်ရအောင်။ nav ထဲက list မှာ သူ့ child တွေကို flexbox နဲ့
      စီခိုင်းလိုက်ပါမယ်။ ရိုက်နေတုန်း header ကို လိုက်ကြည့်ပါ။ [[mark:after-nav]] link သုံးခုက
      တစ်တန်းတည်း ဖြစ်သွားပါပြီ။ [[mark:select-display]] ဒီ display declaration ကို ကြည့်ပါ။ ဒီ
      တစ်ခုတည်းနဲ့ list က flex container ဖြစ်သွားပြီး၊ သူ့ရဲ့ တိုက်ရိုက် child ဖြစ်တဲ့ list item တွေက flex
      item တွေ ဖြစ်သွားပါတယ်။ သူတို့ထဲက link တွေကတော့ တိုက်ရိုက် child မဟုတ်လို့ flex item မဖြစ်ပါဘူး။
      lesson 13 မှာ ဒါကို ခဏ မြင်ခဲ့ပါတယ်။ [[mark:defaults]] တခြား CSS ဘာမှ မရေးရသေးဘဲ item တွေ ဘယ်လို
      နေရာယူလဲ ကြည့်ပါ။ တစ်တန်းတည်းမှာ စီနေပြီး၊ တစ်ခုစီက သူ့ စာသား ရှိသလောက်ပဲ ကျယ်တာကို မျဉ်းပြတ်
      outline တွေက ပြနေပါတယ်။ [[mark:defaults-2]] item တွေက ဘယ်ဘက်ကနေ စပြီး၊ တန်းရဲ့ ကျန်တဲ့ နေရာက
      လွတ်နေပါတယ်။ flex item တွေက နေရာလွတ်ကို ဖြည့်အောင် မကြီးလို့ပါ။ item တွေ များလို့ မဆံ့တော့ရင်လည်း
      နောက်တစ်တန်း မဆင်းဘဲ တစ်တန်းတည်းမှာပဲ ဆက်နေပါမယ်။ [[mark:initial-values]] အဲဒါတွေ တစ်ခုမှ ကိုယ်
      မရေးထားပါဘူး။ CSS property တိုင်းမှာ initial value ရှိပြီး၊ list က flex container ဖြစ်သွားတာနဲ့ flex
      property တွေက အဲဒီ initial value တွေနဲ့ အလုပ် စလုပ်ပါတယ်။ ဒါကြောင့် declaration တစ်ခုတည်း ရေးရုံနဲ့
      flexbox ရဲ့ default ပုံစံကို ရတာပါ။ [[mark:inline-flex]] list ကိုယ်တိုင်ကတော့ page ပေါ်မှာ block
      လိုပဲ နေရာယူနေတုန်းပါ။ စာကြောင်း တစ်ကြောင်းထဲမှာ ဝင်နေမယ့် flex container လိုရင်တော့ inline flex ကို
      သုံးလို့ ရပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Flexbox: creating a flex container"
        url: "https://web.dev/learn/css/flexbox#creating_a_flex_container"
      - title: "MDN — Flex container"
        url: "https://developer.mozilla.org/en-US/docs/Glossary/Flex_Container"
      - title: "MDN — display"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/display"
      - title: "CSS Flexible Box Layout Module Level 1 — Flex containers"
        url: "https://www.w3.org/TR/css-flexbox-1/#flex-containers"
    actions:
      - id: type-nav
        type: editor.type
        at: { mark: type-nav }
        cadence: natural
        target: { file: styles.css, after: "", occurrence: 1 }
        text: ".nav ul {\n  display: flex;\n}\n"
      - id: expect-nav
        type: expect.preview
        at: { mark: after-nav }
        timeoutMs: 4000
        target: { by: testId, value: nav-order }
        textContains: "မှာယူရန်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-display
        type: editor.select
        at: { mark: select-display }
        target: { file: styles.css, text: "display: flex;", occurrence: 1 }

  - id: axes-board
    chapter: "Main axis နဲ့ cross axis"
    narration: >
      [[mark:open-axes]] flexbox မှာ axis နှစ်ခုကို အရင် သိထားရပါမယ်။ [[mark:draw-row-axes]] item တွေ
      တန်းစီသွားတဲ့ ဦးတည်ရာကို main axis လို့ ခေါ်ပါတယ်။ row မှာဆိုရင် စာ ရေးသွားတဲ့ ဘက်အတိုင်း၊
      မြန်မာစာမှာ ဘယ်ကနေ ညာကို သွားပါတယ်။ [[mark:draw-cross]] cross axis ကတော့ main axis ကို ထောင့်မှန်ကျ
      ဖြတ်သွားတဲ့ ဦးတည်ရာ ဖြစ်လို့၊ row မှာ အပေါ်ကနေ အောက်ပါ။ [[mark:draw-starts]] axis တစ်ခုစီမှာ အစနဲ့
      အဆုံး ရှိပါတယ်။ item တွေက main start ကနေ စပြီး main end ဘက်ကို စီသွားပါတယ်။ cross axis ရဲ့ အစွန်း
      နှစ်ဘက်ကိုတော့ cross start နဲ့ cross end လို့ ခေါ်ပါတယ်။ [[mark:draw-column]] main axis ဘယ်ဘက်
      သွားမလဲ ဆိုတာကို flex direction ဆိုတဲ့ property က ဆုံးဖြတ်ပါတယ်။ direction ကို column ပေးရင် main
      axis က အပေါ်ကနေ အောက် ဖြစ်ပြီး၊ cross axis က ဘေးတိုက် ဖြစ်သွားပါတယ်။ [[mark:axes-why]] ဒီ နာမည်တွေ
      အရေးကြီးတာက lesson 17 က alignment တွေ axis အလိုက် အလုပ်လုပ်လို့ပါ။ direction ပြောင်းလိုက်ရင်
      alignment declaration ကို မပြင်ဘဲ၊ သူက axis နဲ့အတူ လိုက်လှည့်သွားပါတယ်။ [[mark:draw-note]] flexbox က
      ဘယ်၊ ညာ၊ အပေါ်၊ အောက် မသုံးဘဲ start နဲ့ end ကိုပဲ သုံးတာ မှတ်ထားပါ။ ဘာကြောင့်လဲ ဆိုတာ နောက် demo က
      ပြပါမယ်။
    sources:
      - title: "web.dev Learn CSS — Flexbox: the main axis and the cross axis"
        url: "https://web.dev/learn/css/flexbox#the_main_axis_and_the_cross_axis"
      - title: "MDN — Main axis"
        url: "https://developer.mozilla.org/en-US/docs/Glossary/Main_Axis"
      - title: "MDN — Cross axis"
        url: "https://developer.mozilla.org/en-US/docs/Glossary/Cross_Axis"
      - title: "CSS Flexible Box Layout Module Level 1 — Flex layout box model and terminology"
        url: "https://www.w3.org/TR/css-flexbox-1/#box-model"
    actions:
      - id: open-axes
        type: whiteboard.apply
        at: { mark: open-axes }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-row-axes
        type: whiteboard.apply
        at: { mark: draw-row-axes }
        upsertIds: [b-row-t, b-row-box, b-row-i1, b-row-i2, b-row-i3, b-main-arrow, b-main-t]
        drawMs: 3000
      - id: draw-cross
        type: whiteboard.apply
        at: { mark: draw-cross }
        upsertIds: [b-cross-arrow, b-cross-t]
        drawMs: 1400
      - id: draw-starts
        type: whiteboard.apply
        at: { mark: draw-starts }
        upsertIds: [b-main-start, b-main-end, b-cross-start, b-cross-end]
        drawMs: 2800
      - id: draw-column
        type: whiteboard.apply
        at: { mark: draw-column }
        upsertIds: [b-col-t, b-col-box, b-col-i1, b-col-i2, b-col-i3, b-col-main, b-col-cross]
        drawMs: 3000
      - id: draw-note
        type: whiteboard.apply
        at: { mark: draw-note }
        upsertIds: [b-note]
        drawMs: 1400

  - id: chips-rtl
    chapter: "စာရေးတဲ့ ဦးတည်ရာနဲ့ flexbox"
    narration: >
      [[mark:close-axes]] editor ထဲ ပြန်သွားရအောင်။ [[mark:type-chips]] အခု chip တန်းကိုလည်း flex
      container ဖြစ်အောင် လုပ်ပါမယ်။ rule တစ်ခုတည်း ဖြစ်ပေမယ့် selector က chip တန်း နှစ်တန်းလုံးကို
      ရွေးပါတယ်။ ရိုက်နေတုန်း ညာကနေ ဘယ် လို့ ရေးထားတဲ့ အောက်က တန်းကို သတိထား ကြည့်ပါ။ [[mark:after-chips]]
      အပေါ်က တန်းက chip တွေ ဘေးချင်းကပ် ရှိပြီးသား ဖြစ်လို့ သိပ် မပြောင်းပါဘူး။ ဒါပေမဲ့ ညာကနေ ဘယ် တန်းကို
      ကြည့်ပါ၊ ပထမ chip က ညာဘက် အစွန်ဆုံးကို ရောက်သွားပါပြီ။ [[mark:rtl-explain]] flex row က စာကြောင်း
      ရေးသွားတဲ့ ဘက်အတိုင်း သွားပါတယ်။ မြန်မာစာမှာ main start က ဘယ်ဘက်မှာ ရှိပေမယ့်၊ ညာကနေ ဘယ် box ထဲမှာတော့ ညာဘက်မှာ ရှိလို့ တန်းက အဲဒီကနေ စပါတယ်။ flex မပေးခင်က chip တွေက စကားလုံးတွေလို စာကြောင်းထဲမှာ ရှိလို့ မြန်မာစာရဲ့ ဘယ်ကနေ ညာ အစဉ်အတိုင်း ရှိခဲ့တာပါ။ စာရေးတဲ့ ဦးတည်ရာက HTML ကနေ လာပြီး၊ flex row က အဲဒါကို လိုက်တာပါ။ [[mark:vertical-note]] writing mode က
      ဂျပန်စာ တချို့လို ဒေါင်လိုက် ဖြစ်နေရင်တော့ row တောင် အပေါ်ကနေ အောက်ကို သွားပါတယ်။ ဒါကြောင့် flexbox
      က ဘယ်ညာ မပြောဘဲ start နဲ့ end ကို သုံးလို့၊ ဘာသာစကား တိုင်းမှာ CSS တစ်ခုတည်းက အလုပ်လုပ်ပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Flexbox: writing modes and direction"
        url: "https://web.dev/learn/css/flexbox#writing_modes_and_direction"
      - title: "MDN — writing-mode"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/writing-mode"
      - title: "MDN — Relationship of flexbox to other layout methods (writing modes)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_flexible_box_layout/Relationship_of_flexbox_to_other_layout_methods"
    actions:
      - id: close-axes
        type: whiteboard.apply
        at: { mark: close-axes }
        open: false
      - id: type-chips
        type: editor.type
        at: { mark: type-chips }
        cadence: natural
        target: { file: styles.css, after: "  display: flex;\n}\n", occurrence: 1 }
        text: "\n.chips {\n  display: flex;\n}\n"
      - id: expect-chips-rtl
        type: expect.preview
        at: { mark: after-chips }
        timeoutMs: 4000
        target: { by: testId, value: chips-rtl }
        textContains: "နို့စိမ်း"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: directions
    chapter: "Flex direction ပြောင်းကြည့်ရအောင်"
    narration: >
      [[mark:type-column]] အခု direction ကို ပြောင်းကြည့်ရအောင်။ chip တွေရဲ့ flex direction ကို column
      ပေးပါမယ်။ [[mark:after-column]] chip တန်း နှစ်တန်းလုံး အပေါ်အောက် ဆင့်သွားပါပြီ။ main axis က
      အပေါ်ကနေ အောက် ဖြစ်သွားပြီး၊ chip တစ်ခုစီကလည်း cross axis အတိုင်း အကျယ် အပြည့် ဆန့်သွားပါတယ်။
      [[mark:type-colrev]] နောက်တစ်ခုက column reverse ပါ။ ခုနက declaration ရဲ့ အောက်မှာ ထည့်ပါမယ်။ lesson
      5 မှာ မြင်ခဲ့သလို နောက်မှ ရေးတဲ့ declaration က နိုင်ပါတယ်။ [[mark:after-colrev]] အခု main start က
      အောက်ခြေကို ရောက်သွားလို့၊ ပထမ chip က အောက်ဆုံးမှာ၊ နောက်ဆုံး chip က အပေါ်ဆုံးမှာ ရှိနေပါပြီ။
      [[mark:type-rowrev]] နောက်ဆုံးက row reverse ပါ။ [[mark:after-rowrev]] row ပြန်ဖြစ်သွားပေမယ့် ဟိုဘက်
      အစွန်းကနေ စပါတယ်။ အပေါ်က တန်းမှာ chip တွေက ညာဘက်ကနေ စပြီး အစဉ် ပြောင်းပြန် ဖြစ်နေပါတယ်။ ညာကနေ ဘယ်
      တန်းမှာတော့ ဘယ်ဘက်ကနေ စပါတယ်။ [[mark:select-rowrev]] ဒီ row reverse ကို ကြည့်ပါ။ ညာကနေ စခိုင်းတာ
      မဟုတ်ဘဲ၊ main start နဲ့ main end ကို လဲလိုက်တာပါ။
    sources:
      - title: "web.dev Learn CSS — Flexbox: controlling the direction of items"
        url: "https://web.dev/learn/css/flexbox#controlling_the_direction_of_items"
      - title: "MDN — flex-direction"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/flex-direction"
      - title: "CSS Flexible Box Layout Module Level 1 — flex-direction"
        url: "https://www.w3.org/TR/css-flexbox-1/#flex-direction-property"
    actions:
      - id: type-column
        type: editor.type
        at: { mark: type-column }
        cadence: natural
        target: { file: styles.css, after: ".chips {\n  display: flex;\n", occurrence: 1 }
        text: "  flex-direction: column;\n"
      - id: expect-column
        type: expect.preview
        at: { mark: after-column }
        timeoutMs: 4000
        target: { by: testId, value: chips }
        textContains: "ကျဆိမ့်"
        retry: { maxAttempts: 3, delayMs: 300 }
      # Keystroke-safe: the prefix "column" is the value already in force.
      - id: type-colrev
        type: editor.type
        at: { mark: type-colrev }
        cadence: natural
        target: { file: styles.css, after: "  flex-direction: column;\n", occurrence: 1 }
        text: "  flex-direction: column-reverse;\n"
      # line-by-line: a keystroke-typed "row-reverse" passes through "row"
      # and would flash a plain row after the column-reverse stack.
      - id: type-rowrev
        type: editor.type
        at: { mark: type-rowrev }
        cadence: line-by-line
        target: { file: styles.css, after: "  flex-direction: column-reverse;\n", occurrence: 1 }
        text: "  flex-direction: row-reverse;\n"
      - id: expect-rowrev
        type: expect.preview
        at: { mark: after-rowrev }
        timeoutMs: 4000
        target: { by: testId, value: chips-rtl }
        textContains: "ပေါ့ဆိမ့်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-rowrev
        type: editor.select
        at: { mark: select-rowrev }
        target: { file: styles.css, text: "row-reverse", occurrence: 1 }

  - id: order-board
    chapter: "မြင်ရတဲ့ အစဉ်နဲ့ HTML အစဉ်"
    narration: >
      [[mark:open-order]] အစဉ် ပြောင်းပြန် လုပ်ရင် preview မှာ မမြင်ရတဲ့ ပြဿနာ တစ်ခု ရှိပါတယ်။
      [[mark:draw-html-order]] ဥပမာ HTML ထဲမှာ item တွေက 1၊ 2၊ 3၊ 4 အစဉ်အတိုင်း ရှိတယ် ဆိုပါစို့။
      [[mark:draw-visual]] row reverse ပေးလိုက်တော့ screen ပေါ်မှာ 4၊ 3၊ 2၊ 1 လို့ မြင်ရပါတယ်။
      [[mark:draw-tab]] ဒါပေမဲ့ Tab key က HTML အစဉ်အတိုင်းပဲ သွားပါတယ်။ ဒါတွေက link တွေ ဆိုရင်၊ Tab key
      နှိပ်တိုင်း ရွေးထားတဲ့ link က ညာကနေ ဘယ်ကို ခုန်သွားလို့၊ လူတွေ ဖတ်တဲ့ ဘက်နဲ့ ပြောင်းပြန် ဖြစ်ပါမယ်။
      [[mark:draw-reader]] screen ပေါ်က စာကို အသံနဲ့ ဖတ်ပြတဲ့ screen reader ကလည်း မြင်ရတဲ့ အစဉ် မဟုတ်ဘဲ
      HTML အစဉ်အတိုင်း ဖတ်ပါတယ်။ ဒါကြောင့် အစဉ်က အရေးကြီးရင် HTML အစဉ်ကို ပြင်ပြီး၊ keyboard နဲ့ page ကို
      စမ်းကြည့်ပါ။ [[mark:draw-reading-flow]] reading flow ဆိုတဲ့ property အသစ်က Tab key နဲ့ screen reader
      ရဲ့ အစဉ်ကို မြင်ရတဲ့ အစဉ်နဲ့ ကိုက်အောင် လုပ်ပေးနိုင်ပေမယ့်၊ အခု Chrome နဲ့ Edge မှာပဲ ရသေးလို့
      အားမကိုးပါနဲ့။
    sources:
      - title: "web.dev Learn CSS — Flexbox: reversing the flow of items and accessibility"
        url: "https://web.dev/learn/css/flexbox#reversing_the_flow_of_items_and_accessibility"
      - title: "MDN — Ordering flex items"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_flexible_box_layout/Ordering_flex_items"
      - title: "CSS Display Module Level 3 — Reordering and accessibility"
        url: "https://www.w3.org/TR/css-display-3/#order-accessibility"
      - title: "MDN — reading-flow"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/reading-flow"
    actions:
      - id: open-order
        type: whiteboard.apply
        at: { mark: open-order }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-html-order
        type: whiteboard.apply
        at: { mark: draw-html-order }
        upsertIds: [c-html-t, c-html-seq]
        drawMs: 1600
      - id: draw-visual
        type: whiteboard.apply
        at: { mark: draw-visual }
        upsertIds:
          [c-screen-t, c-box-4, c-num-4, c-box-3, c-num-3, c-box-2, c-num-2, c-box-1, c-num-1]
        drawMs: 2800
      - id: draw-tab
        type: whiteboard.apply
        at: { mark: draw-tab }
        upsertIds: [c-tab]
        drawMs: 1600
      - id: draw-reader
        type: whiteboard.apply
        at: { mark: draw-reader }
        upsertIds: [c-reader, c-fix]
        drawMs: 2400
      - id: draw-reading-flow
        type: whiteboard.apply
        at: { mark: draw-reading-flow }
        upsertIds: [c-rf]
        drawMs: 1400

  - id: nowrap
    chapter: "Item တွေ မဆံ့တော့ရင်"
    narration: >
      [[mark:close-order]] item တွေ မဆံ့တော့ရင် ဘာဖြစ်လဲ ဆိုတာ စားစရာ menu နဲ့ ကြည့်ရအောင်။
      [[mark:scroll-snacks]] ဒီမှာ card ငါးခုက အပေါ်အောက် ဆင့်နေပါတယ်။ [[mark:type-snacks]] သူတို့ရဲ့ list
      ကိုလည်း flex container လုပ်ပါမယ်။ card ငါးခုကို ဘေးချင်းကပ် စီဖို့ နေရာ အများကြီး လိုပေမယ့်၊ preview
      က ဖုန်း screen လောက်ပဲ ကျယ်ပါတယ်။ ရိုက်နေတုန်း list ရဲ့ မျဉ်းပြတ် အစွန်းကို သတိထား ကြည့်ပါ။
      [[mark:after-snacks]] card တွေက တစ်တန်းတည်းထဲ ကျပ်ကျပ် ဝင်သွားပါပြီ။ စာကြောင်းတွေ ထပ်ခွဲလို့
      မရတော့တဲ့ အထိ ကျုံ့သွားပေမယ့် မဆံ့သေးလို့၊ နောက်ဆုံး card တွေက မျဉ်းပြတ် အစွန်းကို လွန်ပြီး screen
      ဘေးကနေ ထွက်သွားပါတယ်။ [[mark:explain-nowrap]] item တွေ မဆံ့ရင် နောက်တစ်တန်း ဆင်းခွင့် ပေးတာကို wrap
      လို့ ခေါ်ပါတယ်။ flex wrap ရဲ့ initial value က no wrap ဖြစ်လို့ item တွေ မဆင်းဘဲ ကျုံ့ပါတယ်။ ဒါပေမဲ့ lesson 2 မှာ ကြည့်ခဲ့တဲ့ min-content အထိပဲ ကျုံ့နိုင်ပါတယ်။ ဆိုလိုတာက အရှည်ဆုံး စကားလုံးလောက် အကျယ်ပါ။ အဲဒီနောက်
      container အပြင်ကို လျှံထွက်ပါတယ်။ ဖုန်းမှာဆိုရင် menu တစ်ပိုင်း screen အပြင် ရောက်နေလို့ page ကို
      ဘေးတိုက် scroll လုပ်ရပါမယ်။ [[mark:stretch-cards]] card တိုင်း အမြင့် တူသွားတာကိုလည်း ကြည့်ပါ။ item တွေက cross axis အတိုင်း ဆန့်တာက နောက်ထပ် default တစ်ခုပါ။ ဒါကို lesson 17 မှာ
      ကြည့်ပါမယ်။ [[mark:quiz]] မေးခွန်း တစ်ခု မေးကြည့်ရအောင်။ grid မှာရော screen ကျဉ်းသွားရင် column အရေအတွက်က သူ့ဘာသာ လျော့သွားသလား။ ခဏ စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] မလျော့ပါဘူး။ နေရာ ဆံ့သလောက်ပဲ column လုပ်ခိုင်းတာကို lesson 19 မှာ ကိုယ်တိုင် ရေးရပါတယ်။ ဒါကြောင့် flexbox မှာရော grid မှာပါ နေရာ မဆံ့ရင် ဘာလုပ်မလဲ ဆိုတာ ကိုယ်တိုင် ရွေးရတာပါ။
    sources:
      - title: "web.dev Learn CSS — Flexbox: wrapping flex items"
        url: "https://web.dev/learn/css/flexbox#wrapping_flex_items"
      - title: "web.dev Learn CSS — Layout (flex and grid do not wrap by default)"
        url: "https://web.dev/learn/css/layout"
      - title: "MDN — flex-wrap"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/flex-wrap"
      - title: "CSS Flexible Box Layout Module Level 1 — Automatic minimum size of flex items"
        url: "https://www.w3.org/TR/css-flexbox-1/#min-size-auto"
    actions:
      - id: close-order
        type: whiteboard.apply
        at: { mark: close-order }
        open: false
      # Document scroll: the snacks heading to the top of the preview (section
      # top 392 px at 432 px wide; .snacks has min-height 100vh, so the scroll
      # is always possible).
      - id: scroll-snacks
        type: preview.scroll
        at: { mark: scroll-snacks }
        timeoutMs: 5000
        top: 380
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-snacks
        type: editor.type
        at: { mark: type-snacks }
        cadence: natural
        target: { file: styles.css, after: "  flex-direction: row-reverse;\n}\n", occurrence: 1 }
        text: "\n.snacks .menu {\n  display: flex;\n}\n"
      - id: expect-snacks-row
        type: expect.preview
        at: { mark: after-snacks }
        timeoutMs: 4000
        target: { by: testId, value: card-shan-noodles }
        textContains: "ကုန်သွားပြီ"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: wrap
    chapter: "Wrap ဖွင့်ကြည့်ရအောင်"
    narration: >
      [[mark:type-wrap]] ဒါဆို wrap ကို ဖွင့်ပြီး card တွေကို နောက်တစ်တန်း ဆင်းခွင့် ပေးကြည့်ရအောင်။
      [[mark:after-wrap]] အခု card တွေက တန်းအသစ်တွေကို ဆင်းသွားပါပြီ။ card တစ်ခုစီက သူ့ content လိုသလောက်
      အကျယ်ကို ပြန်ရပြီး၊ နောက် card က မဆံ့တော့ရင် တန်းအသစ်ကနေ စပါတယ်။ [[mark:line-ends]] card တွေက
      တန်းကို ပြည့်အောင် မဆန့်လို့၊ တန်းတွေရဲ့ အဆုံးမှာ နေရာလွတ် ကျန်နေပါတယ်။ အဲဒီ နေရာလွတ်ကို ယူပြီး item
      တွေ ကြီးလာအောင် လုပ်တာကို lesson 16 မှာ ကြည့်ပါမယ်။ [[mark:type-wraprev]] နောက်ထပ် တန်ဖိုး တစ်ခုက
      wrap reverse ပါ။ သူ့ကို အောက်မှာ ထည့်ကြည့်ရအောင်။ [[mark:after-wraprev]] အခု တန်းတွေက အောက်ကနေ
      အပေါ်ကို ဆင့်သွားပါပြီ။ ပထမ တန်းက အောက်ဆုံးမှာ ရှိပြီး၊ တန်းအသစ်တိုင်းက သူ့ အပေါ်မှာ တက်လာပါတယ်။
      wrap reverse က cross start နဲ့ cross end ကို လဲလိုက်လို့ပါ။ သိပ် မသုံးကြပါဘူး။ [[mark:balance-note]]
      Chrome နဲ့ Edge မှာ တန်းတွေကို အရှည် မျှမျှ ဖြစ်အောင် ခွဲပေးတဲ့ တန်ဖိုး အသစ် တစ်ခု ရှိပေမယ့်၊ တခြား
      browser တွေမှာ မရသေးလို့ ဒီမှာ မသုံးပါဘူး။
    sources:
      - title: "web.dev Learn CSS — Flexbox: wrapping flex items"
        url: "https://web.dev/learn/css/flexbox#wrapping_flex_items"
      - title: "MDN — flex-wrap"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/flex-wrap"
      - title: "CSS Flexible Box Layout Module Level 1 — flex-wrap"
        url: "https://www.w3.org/TR/css-flexbox-1/#flex-wrap-property"
    actions:
      - id: type-wrap
        type: editor.type
        at: { mark: type-wrap }
        cadence: natural
        target: { file: styles.css, after: ".snacks .menu {\n  display: flex;\n", occurrence: 1 }
        text: "  flex-wrap: wrap;\n"
      - id: expect-wrap
        type: expect.preview
        at: { mark: after-wrap }
        timeoutMs: 4000
        target: { by: testId, value: card-mohinga }
        textContains: "မုန့်ဟင်းခါး"
        retry: { maxAttempts: 3, delayMs: 300 }
      # Keystroke-safe: the prefix "wrap" is the value already in force.
      - id: type-wraprev
        type: editor.type
        at: { mark: type-wraprev, offsetMs: 300 }
        cadence: natural
        target: { file: styles.css, after: "  flex-wrap: wrap;\n", occurrence: 1 }
        text: "  flex-wrap: wrap-reverse;\n"
      - id: expect-wraprev
        type: expect.preview
        at: { mark: after-wraprev }
        timeoutMs: 4000
        target: { by: testId, value: card-palata }
        textContains: "ပလာတာ"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: lines-board
    chapter: "Flexbox ဘာကြောင့် one-dimensional လဲ"
    narration: >
      card တွေကို ပြန်ကြည့်ပါ။ တစ်တန်းထဲက card တွေရဲ့ အစွန်းတွေက နောက်တစ်တန်းက အစွန်းတွေနဲ့ မညီပါဘူး။
      [[mark:open-lines]] wrap ဖြစ်လာတဲ့ တန်းတိုင်းက flex line တစ်ကြောင်းစီ ဖြစ်လို့ပါ။
      [[mark:draw-flex-lines]] flexbox က line တစ်ကြောင်းချင်းကို သီးသန့် စီပြီး၊ အပေါ်က line ဒါမှမဟုတ်
      အောက်က line ကို လုံးဝ မကြည့်ပါဘူး။ ဒါကြောင့် card တွေ column လိုက် မညီနိုင်တာပါ။
      [[mark:draw-grid-lines]] item တွေကို row နဲ့ column နှစ်ဘက်လုံး တစ်ပြိုင်နက် ညီအောင် စီချင်ရင်၊
      ဦးတည်ရာ နှစ်ခုလုံးကို ထိန်းတဲ့ layout လိုပါတယ်။ အဲဒါက lesson 18 က grid ပါ။ [[mark:draw-1d-2d]]
      one-dimensional ဆိုတာ တကယ်တမ်းတော့ ဒါကို ဆိုလိုတာပါ။ flexbox က တစ်ကြိမ်မှာ axis တစ်ခုကို ထိန်းပြီး၊
      grid က axis နှစ်ခုလုံးကို ထိန်းပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Flexbox: wrapping flex items (each line is independent)"
        url: "https://web.dev/learn/css/flexbox#wrapping_flex_items"
      - title: "web.dev Learn CSS — Layout: flexbox and grid"
        url: "https://web.dev/learn/css/layout#flexbox_and_grid"
      - title: "MDN — Relationship of grid layout to other layout methods"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_grid_layout/Relationship_of_grid_layout_with_other_layout_methods"
    actions:
      - id: open-lines
        type: whiteboard.apply
        at: { mark: open-lines }
        open: true
        clear: true
        upsertIds: [d-title]
      - id: draw-flex-lines
        type: whiteboard.apply
        at: { mark: draw-flex-lines }
        upsertIds: [d-flex-t, d-f1, d-f2, d-f3, d-f4, d-miss, d-miss-t]
        drawMs: 3200
      - id: draw-grid-lines
        type: whiteboard.apply
        at: { mark: draw-grid-lines }
        upsertIds: [d-grid-t, d-g1, d-g2, d-g3, d-g4, d-grid-ok]
        drawMs: 3000
      - id: draw-1d-2d
        type: whiteboard.apply
        at: { mark: draw-1d-2d }
        upsertIds: [d-1d, d-2d]
        drawMs: 2400

  - id: flow-gap
    chapter: "Flex flow နဲ့ gap"
    narration: >
      [[mark:close-lines]] editor ထဲ ပြန်သွားရအောင်။ [[mark:type-flow]] direction နဲ့ wrap ကို
      အများအားဖြင့် တွဲပေးကြလို့၊ နှစ်ခုလုံးကို တစ်ခါတည်း ပေးတဲ့ flex flow ဆိုတဲ့ shorthand ရှိပါတယ်။ wrap
      လုပ်တဲ့ row ဖြစ်အောင် ပေးပါမယ်။ [[mark:after-flow]] တန်းတွေက အပေါ်ကနေ အောက် ပြန်စီသွားပါပြီ။
      [[mark:select-flow]] ဒီ shorthand ကို ကြည့်ပါ။ သူက wrap ကိုပါ ပေးပြီး နောက်မှ ရေးထားလို့၊ အပေါ်က
      wrap reverse ကို နိုင်သွားပါတယ်။ သူ့ initial value က row နဲ့ no wrap ဖြစ်ပြီး၊ စကားလုံး နှစ်လုံးကို
      ဘယ်အစဉ်နဲ့ ရေးရေး ရပါတယ်။ [[mark:type-gap]] အခု card တွေ တစ်ခုနဲ့ တစ်ခု ကပ်နေလို့၊ သူတို့ရဲ့ list
      မှာ gap ထည့်ပါမယ်။ [[mark:after-gap]] အခု တန်းတစ်ခုထဲက card တွေကြားမှာရော၊ တန်းတွေကြားမှာပါ နေရာလွတ်
      ပေါ်လာပါပြီ။ ဒါပေမဲ့ list ရဲ့ အစွန်းနဲ့ card တွေကြားမှာတော့ နေရာလွတ် အပို မရှိပါဘူး။ lesson 13 မှာ
      ပြောခဲ့သလို gap က item တွေရဲ့ ကြားထဲမှာပဲ ထည့်လို့ပါ။ [[mark:gap-more]] card တိုင်းကို margin
      ပေးမယ့်အစား container မှာ တစ်ခါတည်း ပေးရုံပါပဲ။ တန်းတွေကြားနဲ့ card တွေကြား နေရာလွတ် မတူစေချင်ရင်
      row gap နဲ့ column gap ကို သီးသန့် ပေးလို့ ရပါတယ်။ ဒီ gap ကပဲ grid မှာရော၊ lesson 13 က multicolumn
      layout မှာပါ အလုပ်လုပ်ပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Flexbox: the flex-flow shorthand"
        url: "https://web.dev/learn/css/flexbox#the_flex-flow_shorthand"
      - title: "MDN — flex-flow"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/flex-flow"
      - title: "MDN — gap"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/gap"
      - title: "web.dev Learn CSS — Grid (gap)"
        url: "https://web.dev/learn/css/grid"
    actions:
      - id: close-lines
        type: whiteboard.apply
        at: { mark: close-lines }
        open: false
      # line-by-line: a keystroke-typed "row wrap" passes through "row",
      # which means row nowrap and would squeeze the cards back into one row.
      - id: type-flow
        type: editor.type
        at: { mark: type-flow }
        cadence: line-by-line
        target: { file: styles.css, after: "  flex-wrap: wrap-reverse;\n", occurrence: 1 }
        text: "  flex-flow: row wrap;\n"
      - id: expect-flow
        type: expect.preview
        at: { mark: after-flow }
        timeoutMs: 4000
        target: { by: testId, value: card-e-kya-kwe }
        textContains: "အီကြာကွေး"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-flow
        type: editor.select
        at: { mark: select-flow }
        target: { file: styles.css, text: "flex-flow: row wrap;", occurrence: 1 }
      - id: type-gap
        type: editor.type
        at: { mark: type-gap, offsetMs: 400 }
        cadence: natural
        target: { file: styles.css, after: "  flex-flow: row wrap;\n", occurrence: 1 }
        text: "  gap: 12px;\n"
      - id: expect-gap
        type: expect.preview
        at: { mark: after-gap }
        timeoutMs: 4000
        target: { by: testId, value: card-laphet-thoke }
        textContains: "လက်ဖက်သုပ်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ flex container က သူ့ တိုက်ရိုက် child တွေကို main axis
      တစ်လျှောက် တန်းစီပါတယ်။ flex direction က အဲဒီ axis ကို ရွေးပြီး၊ start နဲ့ end က စာရေးတဲ့ ဦးတည်ရာကို
      လိုက်ပါတယ်။ reverse က မြင်ရတာကိုပဲ ပြောင်းပြီး ဖတ်တဲ့ အစဉ်ကို မပြောင်းပါဘူး။ wrap ကို ကိုယ်တိုင်
      မဖွင့်မချင်း item တွေ နောက်တစ်တန်း မဆင်းပါဘူး။ gap ကတော့ item တွေကြားမှာပဲ နေရာလွတ် ထည့်ပါတယ်။
      [[mark:next-lesson]] အခုထိ item တိုင်းက သူ့ content လောက်ပဲ ကျယ်နေပါသေးတယ်။ နောက် lesson မှာတော့
      item တွေက နေရာလွတ်ကို ခွဲယူပြီး ကြီးတာ၊ နေရာ မလောက်ရင် ကျုံ့တာကို ကြည့်သွားပါမယ်။
    sources:
      - title: "web.dev Learn CSS — Flexbox"
        url: "https://web.dev/learn/css/flexbox"
      - title: "MDN — Basic concepts of flexbox"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_flexible_box_layout/Basic_concepts_of_flexbox"
      - title: "web.dev Learn CSS — Flexbox: controlling space inside flex items (next lesson)"
        url: "https://web.dev/learn/css/flexbox#controlling_space_inside_flex_items"
    actions:
      - id: expect-final-css
        type: expect.file
        at: { mark: recap }
        path: styles.css
        contains: ".nav ul {\n  display: flex;\n}\n\n.chips {\n  display: flex;\n  flex-direction: column;\n  flex-direction: column-reverse;\n  flex-direction: row-reverse;\n}\n\n.snacks .menu {\n  display: flex;\n  flex-wrap: wrap;\n  flex-wrap: wrap-reverse;\n  flex-flow: row wrap;\n  gap: 12px;\n}\n"

checks:
  - { type: timing.p95Ms, max: 300 }
