  - id: your-turn
    chapter: ကိုယ့် system အတွက်
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ ကိုယ့် system ထဲမှာ ဒီ customer ဆိုရင် ဒီလို၊ ဟို customer ဆိုရင် ဟိုလို
      ဆိုပြီး if တွေ တန်းစီနေတဲ့ နေရာ တစ်ခုကို ရှာကြည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ဒီ contract ရဲ့ ခေါင်းစဉ်
      သုံးခုအောက်မှာ ကိုယ့် project အတွက် ပြန်ရေးကြည့်ပါ။ core က ဘာပေးမလဲ၊ plug in က ဘာပြန်ပေးမလဲ၊ ဘာကို
      မလုပ်ရဘူးလဲ ဆိုတာပါ။
      [[mark:turn-2]] ရေးရတာ ခက်နေရင်၊ အားလုံးအတွက် တူတဲ့ အပိုင်းနဲ့ customer အလိုက် မတူတဲ့ အပိုင်းကို မခွဲရသေးလို့
      ဖြစ်နိုင်ပါတယ်။ အဲဒါကို သိလိုက်ရတာကိုက ပထမ ခြေလှမ်းပါပဲ။
    sources:
