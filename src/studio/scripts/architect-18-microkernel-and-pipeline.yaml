  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ product တစ်ခုတည်းမှာ customer အလိုက် စည်းမျဉ်းတွေ ကွဲနေရင် microkernel က အံကိုက်ပါတယ်။
      အားလုံးအတွက် တူတာကို သေးသေး တည်ငြိမ်တဲ့ core ထဲ ထားပြီး၊ မတူတာတွေကို contract တစ်ခုတည်းရဲ့ နောက်က plug in
      တွေအဖြစ် ခွဲထုတ်တာပါ။
      [[mark:recap-2]] အလုပ်က တစ်ဖက်တည်း စီးတဲ့ အဆင့်တွေ ဆိုရင်တော့ pipeline က အံကိုက်ပါတယ်။ အဆင့်တိုင်းက အလုပ်
      တစ်ခုတည်း လုပ်တာမို့ တစ်ခုချင်း စစ်လို့ရပြီး၊ အစီအစဉ်ကိုလည်း ပြောင်းစီလို့ ရပါတယ်။ နှစ်ခုလုံးက system တစ်ခုလုံးထက် module တစ်ခုရဲ့
      အထဲမှာ ပိုတွေ့ရတဲ့ ပုံစံတွေပါ။
      [[mark:next]] နောက် lesson မှာတော့ team တစ်ခုရဲ့ bug က အားလုံးရဲ့ release ကို တားနေတဲ့ ပြဿနာအတွက်၊ app ကို
      service ကြီးကြီး အနည်းငယ်အဖြစ် ခွဲတဲ့ service based architecture ကို လေ့လာသွားပါမယ်။
