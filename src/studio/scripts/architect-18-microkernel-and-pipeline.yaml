schemaVersion: 1

lesson:
  slug: architect-18-microkernel-and-pipeline
  title: "Architect Path 18: Microkernel နဲ့ pipeline"
  locale: my-MM
  workspace:
    lessonType: javascript
    name: Architect Notebook
    entryFilePath: notebook/18-plugin-contract.md
    sidebarStartsCollapsed: true
    files:
      README.md: |
        # ခရီးဖော် · system မှတ်စု

        ခရီးဖော်က အဝေးပြေးကား လက်မှတ်ကို app ကနေ ဝယ်လို့ရအောင် လုပ်ပေးတဲ့ ကုမ္ပဏီပါ။
        ဒီ course အတွက် စိတ်ကူးနဲ့ တည်ဆောက်ထားတဲ့ ကုမ္ပဏီ ဖြစ်ပါတယ်။

        ## သုံးတဲ့သူတွေ

        - ခရီးသည်: ခရီးစဉ် ရှာတယ်၊ ထိုင်ခုံ ရွေးတယ်၊ wallet နဲ့ ငွေချေတယ်၊ လက်မှတ် ရတယ်
        - ကားလိုင်း: ခရီးစဉ်နဲ့ ဈေးနှုန်း တင်တယ်၊ ရောင်းအား ကြည့်တယ်
        - ကောင်တာ ဝန်ထမ်း: ကားဂိတ်မှာ ထိုင်ခုံ အတူတူကိုပဲ ရောင်းတယ်

        ## အခု အခြေအနေ (ကုမ္ပဏီ သက်တမ်း 3 နှစ်)

        - developer 18 ယောက်၊ team 3 ခု: Booking, Operator, Payment
        - ကားလိုင်း 120၊ တစ်ရက် လက်မှတ် 25,000 ခန့်
        - deploy လုပ်ရတာက app တစ်ခုတည်းပဲ၊ အထဲမှာ module တွေ ခွဲနေဆဲ
        - release က တစ်ပတ် တစ်ခါ၊ team တစ်ခုရဲ့ bug က အားလုံးရဲ့ release ကို တားတယ်
        - အပြင်က service: wallet payment API၊ SMS gateway
      notebook/18-plugin-contract.md: |+
        # Plug-in contract · လက်မှတ် ဖျက်ခ စည်းမျဉ်း

