scenes:
  - id: open
    chapter: "TDD ဆိုတာ"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ async code ကို test လုပ်တဲ့အခါ၊ Promise ကို await နဲ့
      စောင့်ရမယ် ဆိုတာ မြင်ခဲ့ပါတယ်။ ဒီ lesson ကစပြီး TDD ဆိုတဲ့ နည်းကို လေ့လာပါမယ်။ TDD ဆိုတာ
      test driven development ရဲ့ အတိုကောက် ဖြစ်ပြီး၊ code မရေးခင် ကျမယ့် test ကို အရင် ရေးတဲ့
      နည်းပါ။ [[mark:define]] အဲဒီ ကျနေတဲ့ test က code မှာ ဘာ လိုနေသေးလဲ ဆိုတာကို ပြပေးတဲ့
      လမ်းညွှန် ဖြစ်လာပါတယ်။ test ကို အရင် ရေးရတော့၊ code မရေးခင်ကတည်းက function ကို ဘယ်လို
      ခေါ်မလဲ၊ ဘာ ပြန်ပေးရမလဲ ဆိုတာကို ကြိုစဉ်းစားရပါတယ်။ [[mark:feature]] ဆိုင်က loyalty stamp ပေးချင်တယ်
      ဆိုပါစို့။
      သောက်စရာ တစ်ခွက်ကို stamp တစ်ခု ပေးပြီး၊ စားစရာ အတွက်တော့ stamp မပေးပါဘူး။ stamp ဆယ်ခု
      ပြည့်ရင် လက်ဖက်ရည် အလကား ရတဲ့ အပိုင်းကိုတော့ နောက် lesson မှာ ဆက်ရေးပါမယ်။
      [[mark:draw-red]] TDD မှာ အဆင့် သုံးဆင့် ရှိပါတယ်။ ပထမ အဆင့်ကို red လို့ ခေါ်ပါတယ်။ code
      က ဘာလုပ်ရမလဲ ဆိုတာကို test အသေးလေး တစ်ခုနဲ့ အရင် ရေးပြီး၊ code မရှိသေးတဲ့အတွက် အဲဒီ test
      က ကျရပါမယ်။ test runner တွေက ကျနေတဲ့ test ကို အနီရောင်နဲ့ ပြလို့ red လို့ ခေါ်တာပါ။
      [[mark:draw-green]] ဒုတိယ green
      အဆင့်မှာ အဲဒီ test pass ဖြစ်အောင် အနည်းဆုံး code ကို မြန်မြန် ရေးပါတယ်။ ဒီ အဆင့်မှာ code
      လှဖို့ မလိုသေးပါဘူး။ [[mark:draw-refactor]] တတိယ refactor အဆင့်မှာတော့ test တွေ pass နေတုန်း
      code ကို သန့်အောင် ပြန်ပြင်ပါတယ်။ refactor ဆိုတာ program ရဲ့ အလုပ်လုပ်ပုံ မပြောင်းဘဲ၊ code ကို
      ပိုသန့်အောင် ပြင်တာပါ။ [[mark:draw-loop]] ပြီးရင် နောက် test တစ်ခုနဲ့ ဒီ အဆင့် သုံးဆင့်ကို
      ထပ်လှည့်ပါတယ်။ [[mark:draw-origin]] ဒီ နည်းကို ၁၉၉၀ ခုနှစ်တွေ ကုန်ခါနီးမှာ Kent Beck က၊
      Extreme Programming ဆိုတဲ့ software ရေးနည်းရဲ့ အစိတ်အပိုင်း တစ်ခု အနေနဲ့ ဖော်ထုတ်ခဲ့တာပါ။
      [[mark:draw-rules]] TDD မှာ စည်းကမ်း နှစ်ခု ရှိပါတယ်။ ပထမ စည်းကမ်းက ကျနေတဲ့ test တစ်ခု
      ရှိမှသာ code အသစ်ကို ရေးရမယ် ဆိုတာပါ။ ဒုတိယ စည်းကမ်းကတော့ test pass ဖြစ်အောင် လုပ်ရင်း
      ကိုယ် ထည့်မိတဲ့ ထပ်နေတဲ့ code တွေကို ပြန်ဖယ်ရမယ် ဆိုတာပါ။
    sources:
      - {
          title: "Martin Fowler: Test Driven Development (facts C01)",
          url: "https://martinfowler.com/bliki/TestDrivenDevelopment.html",
        }
      - {
          title: "Kent Beck: Test-Driven Development by Example, preface (facts C02)",
          url: "https://www.informit.com/store/test-driven-development-by-example-9780321146533",
        }
      - {
          title: "web.dev Learn Testing: What to test, an aside on test-driven development",
          url: "https://web.dev/learn/testing/get-started/what-to-test",
        }
      - {
          title: "web.dev Learn Testing: Manual test invocation (TDD)",
          url: "https://web.dev/learn/testing/get-started/where-tests-run#manual_test_invocation",
        }
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 300000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-red
        type: whiteboard.apply
        at: { mark: draw-red }
        upsertIds: [a-red-box, a-red-1, a-red-2]
        drawMs: 2000
      - id: draw-green
        type: whiteboard.apply
        at: { mark: draw-green }
        upsertIds: [a-arrow-1, a-green-box, a-green-1, a-green-2]
        drawMs: 2000
      - id: draw-refactor
        type: whiteboard.apply
        at: { mark: draw-refactor }
        upsertIds: [a-arrow-2, a-ref-box, a-ref-1, a-ref-2]
        drawMs: 2000
      - id: draw-loop
        type: whiteboard.apply
        at: { mark: draw-loop }
        upsertIds: [a-loop]
        drawMs: 1200
      - id: draw-origin
        type: whiteboard.apply
        at: { mark: draw-origin }
        upsertIds: [a-origin]
        drawMs: 1500
      - id: draw-rules
        type: whiteboard.apply
        at: { mark: draw-rules }
        upsertIds: [a-rule-1, a-rule-2]
        drawMs: 3000

  - id: starter
    narration: >
      ဆိုင်ရဲ့ code ထဲကို ဝင်ကြည့်ရအောင်။ ဒါက stamp တွက်ပေးမယ့် function အတွက် ရေးထားတဲ့ test
      ဖိုင်ပါ။ [[mark:select-test]] ပထမ test က လက်ဖက်ရည် တစ်ခွက် ပါတဲ့ အော်ဒါအတွက် stamp တစ်ခု
      ရရမယ်လို့ စစ်ထားပါတယ်။ [[mark:select-import]] ဖိုင်ရဲ့ ထိပ်မှာတော့ အဲဒီ function ကို loyalty
      ဖိုင်ကနေ import လုပ်ထားပါတယ်။ [[mark:open-loyalty]] loyalty ဖိုင်ကို ဖွင့်ကြည့်ရင်တော့ stamp
      စည်းကမ်းကို ပြောထားတဲ့ comment တစ်ကြောင်းပဲ ရှိပြီး၊ function ကို မရေးရသေးပါဘူး။ TDD မှာ
      ဒါက ပုံမှန်ပါပဲ။ test က အရင် လာပြီး၊ code က နောက်ကနေ လိုက်လာတာပါ။
    sources:
      - {
          title: "web.dev Learn Testing: What to test, an aside on test-driven development",
          url: "https://web.dev/learn/testing/get-started/what-to-test",
        }
      - { title: "Vitest: Writing Tests", url: "https://vitest.dev/guide/learn/writing-tests" }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: select-test
        type: editor.select
        at: { mark: select-test }
        target:
          {
            file: src/loyalty.test.js,
            text: 'expect(stampsFor([{ id: "tea" }])).toBe(1);',
            occurrence: 1,
          }
      - id: select-import
        type: editor.select
        at: { mark: select-import }
        target:
          {
            file: src/loyalty.test.js,
            text: 'import { stampsFor } from "./loyalty.js";',
            occurrence: 1,
          }
      - id: open-loyalty
        type: workspace.openFile
        at: { mark: open-loyalty }
        path: src/loyalty.js

  - id: panel
    narration: >
      [[mark:ready]] Vitest က ဒီ test ကို run လိုက်တော့ ဘာ ပြလဲ ကြည့်ရအောင်။ ညာဘက်က panel
      ကလည်း code ပြောင်းတိုင်း သူ့ဘာသာ ပြန် run နေတဲ့ တကယ့် Vitest ရဲ့ ရလဒ်ပါ။
      [[mark:read-type-error]] အပေါ်ဆုံးက status က အနီရောင် FAIL ဖြစ်နေပြီး၊ test ကလည်း
      ကြက်ခြေခတ်နဲ့ fail ဖြစ်နေပါတယ်။ Failed Tests အပိုင်းမှာတော့ stamp တွက်ပေးမယ့် function က
      function မဟုတ်ဘူး ဆိုတဲ့ TypeError ပေါ်နေပါတယ်။ ဒါကြောင့် red အဆင့်ကို ရောက်ပြီလို့ ထင်စရာပါ။
    sources:
      - {
          title: "Vitest: Writing Tests, reading test output",
          url: "https://vitest.dev/guide/learn/writing-tests#reading-test-output",
        }
      - {
          title: "Vitest 5.1.0 output: importing a missing export (capture 15, facts A33)",
          url: "https://vitest.dev/guide/common-errors",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-start-fail
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 3, delayMs: 1000 }
      - id: expect-start-type-error
        type: expect.preview
        at: { afterAction: expect-start-fail }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-name, value: TypeError }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-message
        type: expect.preview
        at: { afterAction: expect-start-type-error }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-message, value: "stampsFor is not a function" }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: right-red
    chapter: "Red ဖြစ်တဲ့ အကြောင်းကို ဖတ်ပါ"
    narration: >
      ဒါပေမဲ့ ဘာကြောင့် ကျတာလဲ ဆိုတာကို သေချာ ဖတ်ကြည့်ပါ။ function က မရှိသေးလို့ ကျတာ ဖြစ်ပြီး၊
      stamp ကို မှားတွက်လို့ ကျတာ မဟုတ်ပါဘူး။ နာမည် စာလုံးပေါင်း မှားတာ၊ import မှားတာမျိုးကလည်း
      ဒီလို red ပဲ ပေးတဲ့အတွက်၊ ဒီ red က ကိုယ် စစ်ချင်တဲ့ အလုပ်လုပ်ပုံအကြောင်း ဘာမှ
      မပြောပြပါဘူး။ [[mark:type-empty]] ဒါကြောင့် ဘာမှ မလုပ်သေးတဲ့ function အလွတ် တစ်ခုကို အရင်
      ထည့်ပါမယ်။ [[mark:select-empty]] function နာမည်နဲ့ အော်ဒါ line တွေကို လက်ခံမယ့် parameter
      တစ်ခုပဲ ပါပြီး၊ အထဲမှာ ဘာမှ မရှိပါဘူး။ [[mark:read-right-red]] panel ကို ကြည့်ပါ။ test က
      ကျနေတုန်းပဲ ဖြစ်ပေမဲ့၊ ဒီတစ်ခါတော့ stamp တစ်ခု ဖြစ်ရမယ့် နေရာမှာ undefined ရနေတယ်လို့
      ပြောပါပြီ။ ဒါမှ မှန်ကန်တဲ့ အကြောင်းကြောင့် ကျတဲ့ red ပါ။ function က ရှိနေပြီး၊ ဘာလုပ်ရမလဲ
      ဆိုတာကို test က ပြောထားပေမဲ့ code က မလုပ်ရသေးလို့ ကျတာ ဖြစ်ပါတယ်။
    sources:
      - {
          title: "Kent Beck: Test-Driven Development by Example, preface, red (facts C02)",
          url: "https://www.informit.com/store/test-driven-development-by-example-9780321146533",
        }
      - { title: "Vitest: expect, toBe", url: "https://vitest.dev/api/expect#tobe" }
    actions:
      - id: type-empty
        type: editor.type
        at: { mark: type-empty }
        target:
          {
            file: src/loyalty.js,
            after: "// One stamp per drink cup; food earns none.\n",
            occurrence: 1,
          }
        text: "\nexport function stampsFor(lines) {\n}\n"
        cadence: block
      - id: select-empty
        type: editor.select
        at: { mark: select-empty }
        target:
          { file: src/loyalty.js, text: "export function stampsFor(lines) {\n}", occurrence: 1 }
      - id: expect-right-red
        type: expect.preview
        at: { afterAction: select-empty }
        timeoutMs: 8000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-name, value: AssertionError }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-right-red-message
        type: expect.preview
        at: { afterAction: expect-right-red }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-message, value: "expected undefined to be 1 // Object.is equality" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-right-red-actual
        type: expect.preview
        at: { afterAction: expect-right-red-message }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-actual, value: undefined }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: fake-it
    chapter: "Green ဖြစ်အောင် အနည်းဆုံး code"
    narration: >
      green ဖြစ်ဖို့ အနည်းဆုံး ဘာ လိုလဲ။ [[mark:type-fake]] function ထဲမှာ ၁ ကို တိုက်ရိုက်
      ပြန်ပေးလိုက်ပါမယ်။ [[mark:read-fake]] panel ကို ကြည့်ပါ။ test က pass ဖြစ်ပြီး၊ အပေါ်ဆုံးမှာလည်း
      အစိမ်းရောင် PASS ပေါ်လာပါပြီ။ ဒီ code က အော်ဒါ အများစုအတွက် မှားနေမယ် ဆိုတာ သိပါတယ်။
      ဒါကို တမင် လုပ်တာပါ။ အဖြေကို code ထဲမှာ တိုက်ရိုက် ပြန်ပေးလိုက်တဲ့ ဒီ နည်းကို Fake It လို့
      ခေါ်ပါတယ်။ ရှိတဲ့ test တစ်ခုအတွက်ဆိုရင် ဒီလောက်နဲ့ လုံလောက်ပါတယ်။ code ကို ပိုရေးချင်ရင်
      ပထမ စည်းကမ်းအတိုင်း အဲဒါကို တောင်းတဲ့ ကျနေတဲ့ test အရင် လိုပါတယ်။
    sources:
      - {
          title: "Kent Beck: Test-Driven Development by Example, sample chapter and index: Fake It (facts C03)",
          url: "https://www.informit.com/content/images/9780321146533/samplepages/0321146530.pdf",
        }
    actions:
      - id: type-fake
        type: editor.type
        at: { mark: type-fake }
        target:
          { file: src/loyalty.js, after: "export function stampsFor(lines) {\n", occurrence: 1 }
        text: "  return 1;\n"
      - id: expect-fake-green
        type: expect.preview
        at: { afterAction: type-fake }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-fake-count
        type: expect.preview
        at: { afterAction: expect-fake-green }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "1" }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: triangulate
    narration: >
      [[mark:open-test-second]] ဒါကြောင့် test အသစ် တစ်ခု ထည့်ပါမယ်။ [[mark:select-second]]
      လက်ဖက်ရည် သုံးခွက် ပါတဲ့ အော်ဒါဆိုရင် stamp သုံးခု ရရမယ်လို့ စစ်ပါတယ်။ ဒီ သုံး ဆိုတဲ့
      ဂဏန်းကိုလည်း code ကနေ မယူဘဲ၊ ဆိုင်ရဲ့ စည်းကမ်းကနေ ကိုယ်တိုင် တွက်ထားတာပါ။
      [[mark:read-second-red]] ညာဘက်က panel မှာ test အသစ်က ကျနေပြီး၊ ၃ ဖြစ်ရမယ့် နေရာမှာ ၁
      ရနေတယ်လို့ ပြောနေပါတယ်။ Expected က အစိမ်းရောင်နဲ့ ၃၊ Received က အနီရောင်နဲ့ ၁ ပါ။ ၁ ကို
      တိုက်ရိုက် ပြန်ပေးတဲ့ code က ဒီ ဥပမာ နှစ်ခုကို တစ်ပြိုင်နက် မအောင်စေနိုင်တော့ပါဘူး။
      [[mark:open-loyalty-general]] အခုတော့ ယေဘုယျ code ကို ရေးရပါပြီ။ ၁ ကို ပြန်ပေးတဲ့ line ရဲ့
      အပေါ်မှာ အော်ဒါ line တွေကို ပေါင်းတဲ့ code ကို ထည့်ပါမယ်။ [[mark:select-reduce]] line
      တစ်ကြောင်းချင်းရဲ့ ခွက်အရေအတွက်ကို ပေါင်းသွားပြီး၊ ခွက်အရေအတွက် မပါတဲ့ line ကိုတော့ တစ်ခွက်လို့
      ယူပါတယ်။ အောက်က ၁ ပြန်ပေးတဲ့ line ကတော့ အခု ဘယ်တော့မှ run မှာ မဟုတ်တော့ပါဘူး။
      [[mark:read-two-green]] test နှစ်ခုလုံး pass ဖြစ်သွားပါပြီ။ ဥပမာ တစ်ခုတည်းနဲ့ code ကို ယေဘုယျ
      မလုပ်ဘဲ၊ ဥပမာ နောက်တစ်ခုနဲ့ code ကို ယေဘုယျ ဖြစ်အောင် တွန်းတဲ့ ဒီ နည်းကို triangulate လို့
      ခေါ်ပါတယ်။
    sources:
      - {
          title: "Kent Beck: Test-Driven Development by Example, sample chapter: Triangulation (facts C03)",
          url: "https://www.informit.com/content/images/9780321146533/samplepages/0321146530.pdf",
        }
      - { title: "Vitest: Writing Tests", url: "https://vitest.dev/guide/learn/writing-tests" }
    actions:
      - id: open-test-second
        type: workspace.openFile
        at: { mark: open-test-second }
        path: src/loyalty.test.js
      - id: type-second
        type: editor.type
        at: { afterAction: open-test-second }
        target:
          {
            file: src/loyalty.test.js,
            after: "  expect(stampsFor([{ id: \"tea\" }])).toBe(1);\n});\n",
            occurrence: 1,
          }
        text: "\ntest(\"gives a stamp for every cup\", () => {\n  expect(stampsFor([{ id: \"tea\", qty: 3 }])).toBe(3);\n});\n"
        cadence: block
      - id: select-second
        type: editor.select
        at: { mark: select-second }
        target:
          {
            file: src/loyalty.test.js,
            text: 'expect(stampsFor([{ id: "tea", qty: 3 }])).toBe(3);',
            occurrence: 1,
          }
      - id: expect-second-red
        type: expect.preview
        at: { afterAction: select-second }
        timeoutMs: 8000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-failed, value: "1" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-second-message
        type: expect.preview
        at: { afterAction: expect-second-red }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-message, value: "expected 1 to be 3 // Object.is equality" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-second-test
        type: expect.preview
        at: { afterAction: expect-second-message }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-2 }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: open-loyalty-general
        type: workspace.openFile
        at: { mark: open-loyalty-general }
        path: src/loyalty.js
      - id: type-general
        type: editor.type
        at: { afterAction: open-loyalty-general }
        target:
          { file: src/loyalty.js, after: "export function stampsFor(lines) {\n", occurrence: 1 }
        text: "  return lines\n    .reduce((sum, line) => sum + (line.qty ?? 1), 0);\n"
        cadence: block
      - id: select-reduce
        type: editor.select
        at: { mark: select-reduce }
        target:
          {
            file: src/loyalty.js,
            text: ".reduce((sum, line) => sum + (line.qty ?? 1), 0);",
            occurrence: 1,
          }
      - id: expect-two-green
        type: expect.preview
        at: { afterAction: select-reduce }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-two-count
        type: expect.preview
        at: { afterAction: expect-two-green }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "2" }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: strategies
    narration: >
      [[mark:board-green]] green ဖြစ်အောင် လုပ်တဲ့ နည်းတွေကို စုကြည့်ရအောင်။ [[mark:draw-fake]]
      Fake It က အဖြေကို code ထဲမှာ တိုက်ရိုက် ပြန်ပေးလိုက်တာပါ။ [[mark:draw-tri]] Triangulate
      ကတော့ ဥပမာ နှစ်ခု ရှိလာမှ code ကို ယေဘုယျ ဖြစ်အောင် ရေးတာပါ။ [[mark:draw-obvious]] ဘာ
      ရေးရမလဲ ရှင်းနေရင်တော့ code အမှန်ကို တန်းရေးလို့ ရပြီး၊ ဒါကို Obvious Implementation လို့
      ခေါ်ပါတယ်။ [[mark:draw-choose]] ဘယ်နည်းကို သုံးမလဲ ဆိုတာ ကိုယ် ဘယ်လောက် သေချာလဲ ဆိုတဲ့
      အပေါ်မှာ မူတည်ပါတယ်။ မသေချာရင် ခြေလှမ်း သေးသေးလေးတွေနဲ့ သွားပြီး၊ သေချာရင် ခြေလှမ်း
      ကြီးကြီး လှမ်းလို့ ရပါတယ်။ test တွေက ခြေလှမ်း တိုင်းမှာ စောင့်ကြည့်ပေးနေလို့ပါ။
    sources:
      - {
          title: "Kent Beck: Test-Driven Development by Example, green bar patterns (facts C03)",
          url: "https://www.informit.com/content/images/9780321146533/samplepages/0321146530.pdf",
        }
    actions:
      - id: board-green
        type: whiteboard.apply
        at: { mark: board-green }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-fake
        type: whiteboard.apply
        at: { mark: draw-fake }
        upsertIds: [b-fake-box, b-fake-name, b-fake-desc]
        drawMs: 2000
      - id: draw-tri
        type: whiteboard.apply
        at: { mark: draw-tri }
        upsertIds: [b-tri-box, b-tri-name, b-tri-desc]
        drawMs: 2000
      - id: draw-obvious
        type: whiteboard.apply
        at: { mark: draw-obvious }
        upsertIds: [b-obv-box, b-obv-name-1, b-obv-name-2, b-obv-desc]
        drawMs: 2000
      - id: draw-choose
        type: whiteboard.apply
        at: { mark: draw-choose }
        upsertIds: [b-choose]
        drawMs: 1500

  - id: refactor
    chapter: "Green ဖြစ်နေမှ refactor လုပ်ရအောင်"
    narration: >
      test တွေ green ဖြစ်နေပြီ ဆိုတော့ refactor အဆင့်ကို ရောက်ပါပြီ။ [[mark:select-dead]] ၁ ကို
      ပြန်ပေးတဲ့ line က ဘယ်တော့မှ run မှာ မဟုတ်တဲ့ code ဖြစ်နေပါတယ်။ Fake It အတွက် ထည့်ခဲ့ပြီး
      အခု မလိုတော့တဲ့ code ပါ။ [[mark:type-refactor]] ဒီ line ကို comment လုပ်ပြီး ပိတ်လိုက်ပါမယ်။
      ကိုယ့် project မှာဆိုရင်တော့ ဖျက်လိုက်ရုံပါပဲ။ [[mark:read-still-green]] panel ကို ကြည့်ပါ။
      Vitest က ပြန် run ပြီးတာတောင် test နှစ်ခုလုံး pass နေဆဲပါ။ refactor ဆိုတာ ဒါပါပဲ။ code ရဲ့
      ပုံစံကို ပြောင်းပေမဲ့ အလုပ်လုပ်ပုံ မပြောင်းရပါဘူး။ ပြောင်းသွားရင် test တွေက ချက်ချင်း
      ပြောပါလိမ့်မယ်။ [[mark:refactor-why]] ဒါကြောင့် refactor ကို green ဖြစ်နေတဲ့ အချိန်မှာပဲ
      လုပ်ပြီး၊ code အသစ် ထည့်တာနဲ့ တစ်ပြိုင်နက် မလုပ်ရပါဘူး။ ဒီလို ခွဲလုပ်ထားမှ test ကျသွားရင်
      ဘာကြောင့်လဲ ဆိုတာ ချက်ချင်း သိနိုင်ပါတယ်။ TDD ကို ကြာကြာ လုပ်လာသူတွေ ပြောလေ့ရှိတာက၊
      အဖြစ်အများဆုံး အမှားဟာ ဒီ refactor အဆင့်ကို ကျော်သွားတာ ဖြစ်ပါတယ်။
    sources:
      - {
          title: "Martin Fowler: Test Driven Development, skipping the refactoring step (facts C01)",
          url: "https://martinfowler.com/bliki/TestDrivenDevelopment.html",
        }
      - {
          title: "Kent Beck: Test-Driven Development by Example, preface, refactor (facts C02)",
          url: "https://www.informit.com/store/test-driven-development-by-example-9780321146533",
        }
    actions:
      - id: close-green-board
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: select-dead
        type: editor.select
        at: { mark: select-dead }
        target: { file: src/loyalty.js, text: "return 1;", occurrence: 1 }
      - id: type-refactor
        type: editor.type
        at: { mark: type-refactor }
        target: { file: src/loyalty.js, after: "(line.qty ?? 1), 0);\n  ", occurrence: 1 }
        text: "// "
      - id: expect-still-green
        type: expect.preview
        at: { mark: read-still-green }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-still-two
        type: expect.preview
        at: { afterAction: expect-still-green }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "2" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-refactored-file
        type: expect.file
        at: { afterAction: expect-still-two }
        path: src/loyalty.js
        contains: "  // return 1;\n}"

  - id: third-test
    narration: >
      [[mark:open-test-third]] stamp စည်းကမ်းမှာ မလုပ်ရသေးတာ တစ်ခု ကျန်ပါသေးတယ်။ စားစရာ အတွက်
      stamp မပေးရဘူး ဆိုတာပါ။ ဒါက refactor မဟုတ်ဘဲ အလုပ်လုပ်ပုံ အသစ် ဖြစ်လို့၊ red ကနေ ပြန်စရပါမယ်။
      [[mark:select-third]] မုန့်ဟင်းခါး တစ်ပွဲနဲ့ လက်ဖက်ရည် တစ်ခွက် ပါတဲ့ အော်ဒါဆိုရင် stamp
      တစ်ခုပဲ ရရမယ်လို့ စစ်ထားပါတယ်။ [[mark:read-third-red]] ဒီတစ်ခါ panel က ၁ ဖြစ်ရမယ့် နေရာမှာ ၂
      ရနေတယ်လို့ ပြောနေပါတယ်။ code က မုန့်ဟင်းခါးကိုပါ stamp ပေးနေလို့ပါ။ ဒီ red ကလည်း မှန်ကန်တဲ့
      အကြောင်းကြောင့် ကျတာပါ။ [[mark:open-loyalty-third]] ဒီတစ်ခါ ဘာ ရေးရမလဲ ရှင်းနေတဲ့အတွက်၊
      Obvious Implementation နဲ့ code အမှန်ကို တန်းရေးပါမယ်။ menu ဖိုင်ကို import လုပ်ပြီး၊
      မပေါင်းခင်မှာ သောက်စရာ line တွေကိုပဲ ရွေးထုတ်ပါမယ်။ menu ဖိုင်ထဲမှာ ဟင်းလျာ
      တစ်ခုချင်းစီအတွက် သောက်စရာ ဟုတ်မဟုတ်ကို မှတ်ထားပြီးသား ဖြစ်လို့၊ stamp စည်းကမ်းအတွက်လည်း
      အဲဒီ အချက်ကိုပဲ ပြန်သုံးတာပါ။ [[mark:select-filter]] ဒီ အပိုင်းက သောက်စရာ line တွေကိုပဲ
      ရွေးပြီး၊ ပေါင်းတဲ့ အပိုင်းဆီ ပို့ပေးပါတယ်။ [[mark:read-three-green]] test သုံးခုလုံး pass ဖြစ်သွားပါပြီ။ အရင် test နှစ်ခုကလည်း
      pass နေဆဲ ဖြစ်လို့၊ အသစ် ထည့်တဲ့ code က ရှိပြီးသား အလုပ်လုပ်ပုံကို မဖျက်ခဲ့ဘူး ဆိုတာ
      သိနိုင်ပါတယ်။
    sources:
      - {
          title: "Kent Beck: Test-Driven Development by Example, Obvious Implementation (facts C03)",
          url: "https://www.informit.com/content/images/9780321146533/samplepages/0321146530.pdf",
        }
      - { title: "Vitest: Writing Tests", url: "https://vitest.dev/guide/learn/writing-tests" }
    actions:
      - id: open-test-third
        type: workspace.openFile
        at: { mark: open-test-third }
        path: src/loyalty.test.js
      - id: type-third
        type: editor.type
        at: { afterAction: open-test-third }
        target:
          {
            file: src/loyalty.test.js,
            after: "  expect(stampsFor([{ id: \"tea\", qty: 3 }])).toBe(3);\n});\n",
            occurrence: 1,
          }
        text: "\ntest(\"gives no stamps for food\", () => {\n  const lines = [{ id: \"mohinga\" }, { id: \"tea\" }];\n  expect(stampsFor(lines)).toBe(1);\n});\n"
        cadence: block
      - id: select-third
        type: editor.select
        at: { mark: select-third }
        target:
          {
            file: src/loyalty.test.js,
            text: "const lines = [{ id: \"mohinga\" }, { id: \"tea\" }];\n  expect(stampsFor(lines)).toBe(1);",
            occurrence: 1,
          }
      - id: expect-third-red
        type: expect.preview
        at: { afterAction: select-third }
        timeoutMs: 8000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-total, value: "3" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-third-failed
        type: expect.preview
        at: { afterAction: expect-third-red }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-failed, value: "1" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-third-message
        type: expect.preview
        at: { afterAction: expect-third-failed }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-message, value: "expected 2 to be 1 // Object.is equality" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: open-loyalty-third
        type: workspace.openFile
        at: { mark: open-loyalty-third }
        path: src/loyalty.js
      - id: type-import
        type: editor.type
        at: { afterAction: open-loyalty-third }
        target: { file: src/loyalty.js, after: "", occurrence: 1 }
        text: "import { MENU } from \"./menu.js\";\n"
        # Boilerplate: one block; the filter line after it is typed so the learner reads it.
        cadence: block
      - id: type-filter
        type: editor.type
        at: { afterAction: type-import }
        target: { file: src/loyalty.js, after: "  return lines", occurrence: 1 }
        text: "\n    .filter((line) => MENU[line.id].drink)"
      - id: select-filter
        type: editor.select
        at: { mark: select-filter }
        target:
          { file: src/loyalty.js, text: ".filter((line) => MENU[line.id].drink)", occurrence: 1 }
      - id: expect-three-green
        type: expect.preview
        at: { afterAction: select-filter }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-three-count
        type: expect.preview
        at: { afterAction: expect-three-green }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "3" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-loyalty-file
        type: expect.file
        at: { afterAction: expect-three-count }
        path: src/loyalty.js
        contains: "  return lines\n    .filter((line) => MENU[line.id].drink)\n    .reduce((sum, line) => sum + (line.qty ?? 1), 0);"
      - id: expect-loyalty-import
        type: expect.file
        at: { afterAction: expect-loyalty-file }
        path: src/loyalty.js
        contains: 'import { MENU } from "./menu.js";'
      - id: expect-test-file
        type: expect.file
        at: { afterAction: expect-loyalty-import }
        path: src/loyalty.test.js
        contains: 'test("gives no stamps for food", () => {'

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ TDD မှာ ကျမယ့် test ကို အရင် ရေးပြီး၊ မှန်ကန်တဲ့ အကြောင်းကြောင့် ကျလား
      ဆိုတာကို စစ်ပါတယ်။ function မရှိလို့ ကျတာ မဟုတ်ဘဲ၊ အလုပ်လုပ်ပုံ မရှိသေးလို့ ကျမှ red
      အမှန်ပါ။ ပြီးရင် Fake It ဖြစ်ဖြစ်၊ Triangulate ဖြစ်ဖြစ်၊ Obvious Implementation ဖြစ်ဖြစ်၊
      အနည်းဆုံး code နဲ့ green ဖြစ်အောင် လုပ်ပါတယ်။ [[mark:recap-refactor]] refactor ကိုတော့ green ဖြစ်နေမှ
      သီးသန့် အဆင့် တစ်ခု အနေနဲ့ လုပ်ပြီး၊ အလုပ်လုပ်ပုံ မပြောင်းဘူး ဆိုတာကို test တွေက သက်သေ
      ပြပေးပါတယ်။ နောက် lesson မှာတော့ ရေးရမယ့် test တွေကို test list အနေနဲ့ အရင် စာရင်းလုပ်ပြီး၊
      ခြေလှမ်း သေးသေးလေးတွေနဲ့ တစ်ခုချင်း သွားတဲ့ နည်းကို ကြည့်ပါမယ်။
    sources:
      - {
          title: "Martin Fowler: Test Driven Development (facts C01)",
          url: "https://martinfowler.com/bliki/TestDrivenDevelopment.html",
        }
      - {
          title: "Kent Beck: Canon TDD, the test list (facts C04)",
          url: "https://tidyfirst.substack.com/p/canon-tdd",
        }
    actions: []
checks:
  - { type: timing.p95Ms, max: 300 }
