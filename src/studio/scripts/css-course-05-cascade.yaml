# CSS course (Burmese), lesson 5 of 43: the cascade and cascade layers.
#
# Narration is Burmese, applied from voice-script.md next to this file
# (DESIGN.md is the span-by-span brief). Every [[mark:…]] sits where its
# action begins, at a sentence end; each span carries one piece of meaning.
# Everything the learner sees (title, chapters, whiteboard labels, UI strings)
# is Burmese too.
#
# Shape: board (two rules disagree about the order button; the cascade as an
# ordered list of questions) while the dev server installs → code tour
# (index.html: the two stylesheet links, two buttons, the teal style
# attribute; empty styles.css) → order of appearance (green, then blue; why
# styles.css beats base.css) → a <style> element after the link (one reload,
# red) → fallback declarations (clamp on the welcome heading; a deliberately
# broken copy on the form heading keeps its fallback) → specificity before
# order (gold class text survives a later element rule) → board: origins, then
# the browser's body margin loses to our plain element rule → the style
# attribute step, a normal rule that changes nothing, then important turns
# both buttons indigo → board: the importance ladder and the !important flip
# → media queries and relevance (a wide-screen rule that never competes, the
# flipped condition that applies) → board: layer trays → layers live on the
# menu cards (later layer beats a heavier, later-written selector; one
# unlayered rule at the top of the file beats both) → board: DevTools
# strike-through, scope in one sentence, the funnel again as the recap.
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only CSS file typed;
# it never contains url(, @import or image-set(; no postcss config. Colour
# keywords typed keystroke by keystroke (seagreen, steelblue, gold, black,
# indigo, orange, lightgreen, lightpink, white) have no valid shorter prefix,
# so no wrong colour flashes. Rules with an open parenthesis (clamp, @media)
# are typed at the end of the file, so a half-typed function never swallows a
# later rule. The one index.html edit is a single block insert of a complete
# <style> element (one reload), asserted after it lands. The rule typed at
# the top of styles.css is a single block insert.
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
