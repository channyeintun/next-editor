      notes.md: |
        # Production ထဲမှာ စမ်းသပ်ခြင်း

        - canary — version အသစ်ကို traffic နည်းနည်းဆီ အရင် ပို့
        - baseline — တစ်ချိန်တည်း version ဟောင်း run နေတဲ့ ယှဉ်စရာ အုပ်စု
        - change supervision — ခေါ်သုံးတဲ့ဘက်က ကိန်းဂဏန်း ဆိုးရင် rollout ကို အလိုအလျောက် ရပ်
        - fault experiment — steady state + hypothesis၊ ပျက်စီးမှုကို ထိန်းချုပ်ပြီး inject
        - soft dependency — မရှိလည်း အဓိက အလုပ် ဆက်ဖြစ်ရ၊ ညတိုင်း စမ်း
        - game day — ပျက်စီးမှုကို အဖွဲ့လိုက် ကြိုလေ့ကျင့်တဲ့ နေ့

        မေးခွန်း: canary ကောင်းနေတယ်။ ဘယ် အုပ်စု နှစ်ခုကို နှိုင်းယှဉ်နေရမလဲ?
