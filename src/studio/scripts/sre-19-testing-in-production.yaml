      - { id: show-p03e, type: slide.show, at: { mark: show-p03e }, slideId: l19-p03e }

  - id: this-week
    narration: >
      [[mark:show-p04]] production ထဲ စမ်းတာကို ဒီအပတ် စာရွက်ပေါ်ကနေ စပါ။ soft dependency တစ်ခုအတွက် steady state၊ hypothesis နဲ့ ပြန်ရပ်နည်း ပါတဲ့ fault experiment တစ်ခု ရေးကြည့်ပါ။ ကိုယ် ခေါ်သုံးနေတဲ့ service တစ်ခုရဲ့ latency ကို ဖြေတဲ့ version အလိုက် ခွဲကြည့်ပါ။ ပြီးတော့ တစ်နာရီ game day တစ်ခုကို calendar ထဲ ထည့်ထားပါ။
