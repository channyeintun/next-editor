          type: whiteboard.apply,
          at: { mark: b3-s2 },
          upsertIds: [l19-b3-inj-t1, l19-b3-inj-t2],
          drawMs: 1200,
        }
      - {
          id: b3-s3,
          type: whiteboard.apply,
          at: { mark: b3-s3 },
