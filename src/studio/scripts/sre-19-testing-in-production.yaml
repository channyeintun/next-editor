  - id: recap
    narration: >
      [[mark:close-p04]] [[mark:open-notes]] notes ထဲက ခြောက်ခုကို pricing နဲ့ loyalty ပုံပြင်နဲ့ တွဲမှတ်ပါ။ [[mark:sel-canary]] canary က version အသစ်ကို traffic နည်းနည်းဆီ အရင် ပို့တာ ဖြစ်ပြီး၊ [[mark:sel-baseline]] baseline က တစ်ချိန်တည်း version ဟောင်း run နေတဲ့ ယှဉ်စရာ အုပ်စုပါ။ [[mark:sel-change-supervision]] change supervision က ခေါ်သုံးတဲ့ဘက်က ကိန်းဂဏန်း ဆိုးလာတာနဲ့ rollout ကို အလိုအလျောက် ရပ်ပေးတာပါ။
      [[mark:sel-fault-experiment]] fault experiment က steady state နဲ့ hypothesis ကနေ စပြီး ပျက်စီးမှုကို ထိန်းချုပ်ပြီး inject လုပ်ကြည့်တာပါ။ [[mark:sel-soft-dependency]] soft dependency က မရှိရင်လည်း အဓိက အလုပ် ဆက်ဖြစ်ရမယ့် dependency ဖြစ်ပြီး၊ [[mark:sel-game-day]] game day ကတော့ ပျက်စီးမှုကို အဖွဲ့လိုက် ကြိုလေ့ကျင့်တဲ့ နေ့ပါ။
      [[mark:sel-question]] မေးခွန်း တစ်ခုနဲ့ ပိတ်ရအောင်။ [[mark:ask-question]] ကိုယ့် canary က ကောင်းနေတယ်လို့ ပြနေရင် အဲဒီ canary က ဘယ် အုပ်စု နှစ်ခုကို နှိုင်းယှဉ်နေရမှာလဲ?
      [[mark:pause-question]] version အသစ် run နေတဲ့ canary နဲ့ တစ်ချိန်တည်းမှာ version ဟောင်း run နေတဲ့ baseline ပါ။ ဒီလိုနဲ့ သင်္ကြန် ရောက်ဖို့ ခြောက်ပတ်ပဲ လိုပါတော့တယ်၊ ပြီးခဲ့တဲ့ နှစ်က ညသန်းခေါင်မှာ Top-up ဆီ တစ်စက္ကန့်ကို request ၂၀၀၀၀ ရောက်လာခဲ့ပါတယ်။ ဒီနှစ်အတွက် ဘယ်လောက်အထိ ပြင်ဆင်ထားရမလဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Workbook: Canarying Releases",
          url: "https://sre.google/workbook/canarying-releases/",
        }
      - { title: "Principles of Chaos Engineering", url: "https://principlesofchaos.org/" }
    actions:
      - { id: close-p04, type: slide.close, at: { mark: close-p04 } }
      - {
          id: open-notes,
          type: workspace.openFile,
          at: { mark: open-notes, offsetMs: 300 },
          path: notes.md,
        }
      - {
          id: sel-canary,
          type: editor.select,
          at: { mark: sel-canary },
          target: { file: notes.md, text: "canary", occurrence: 1 },
        }
      - {
          id: sel-baseline,
          type: editor.select,
          at: { mark: sel-baseline },
          target: { file: notes.md, text: "baseline", occurrence: 1 },
        }
      - {
          id: sel-change-supervision,
          type: editor.select,
          at: { mark: sel-change-supervision },
          target: { file: notes.md, text: "change supervision", occurrence: 1 },
        }
      - {
          id: sel-fault-experiment,
          type: editor.select,
          at: { mark: sel-fault-experiment },
          target: { file: notes.md, text: "fault experiment", occurrence: 1 },
        }
      - {
          id: sel-soft-dependency,
          type: editor.select,
          at: { mark: sel-soft-dependency },
          target: { file: notes.md, text: "soft dependency", occurrence: 1 },
        }
      - {
          id: sel-game-day,
          type: editor.select,
          at: { mark: sel-game-day },
          target: { file: notes.md, text: "game day", occurrence: 1 },
        }
      # The voice script's ⟪select မေးခွန်း⟫ and ⟪pause 3s⟫, the way the Module 1
      # reviewers fixed the pause (as in lessons 3 and 32). sel-question marks where
      # the voice script puts the select, but a select there would drag under the
      # question and leave no pause, and one at pause-question would drag under the
      # answer's first words (the scheduler holds only the dialog after its
      # anchor's). So the question-line select hangs off ask-question, one more mark
      # after the question's lead-in sentence, so the dialog it follows is only the
      # question itself (95 characters): the select starts about as the question
      # ends, its 1.2 s drag runs in silence, and the answer at pause-question waits
      # for it. 6850 leaves about 2.7 / 1.3 / 0.35 s before the answer at
      # 55 / 70 / 95 ms per char (at 95 the drag starts under the question's last
      # words, as in lesson 7); an offset above ~6990 trips compile-check's 2.5 s
      # inserted-silence warning at 55.
      - id: select-question
        type: editor.select
        at: { mark: ask-question, offsetMs: 6850 }
        target:
          file: notes.md
          text: "မေးခွန်း: canary ကောင်းနေတယ်။ ဘယ် အုပ်စု နှစ်ခုကို နှိုင်းယှဉ်နေရမလဲ?"
          occurrence: 1

checks:
  # 500, not 300: google-svg deck pages stall the main thread at show/close.
  - { type: timing.p95Ms, max: 500 }
