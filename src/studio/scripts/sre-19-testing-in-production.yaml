# SRE from zero, lesson 19: Testing in production (Burmese concept lesson).
#
# Built from the approved voice script
# docs/sre-course/voice-scripts/sre-19-testing-in-production.md. Every
# spoken character is that script's "> " lines, unchanged; each ⟪…⟫ marker
# became a [[mark:…]] at the same place. Check it with:
#   bun ~/Documents/sre-course/work/check-narration.ts \
#     docs/sre-course/voice-scripts/sre-19-testing-in-production.md \
#     src/studio/scripts/sre-19-testing-in-production.yaml
#
# Nothing runs: deck pages and the whiteboard carry the lesson, and notes.md is
# the recap. The workspace and runtime follow the validated no-code skeleton
# (WebContainer, empty init command, a harmless dev script).
#
# The arc: pricing v8's canary passed while Bill Pay broke (cover); board B1,
# a canary as a comparison against a baseline, then the rollout steps with a
# rollback branch; board B2, each caller's latency split by serving version,
# Bill Pay's 1-second timeout crossed, the header that makes the split and the
# rollout that stops itself; pages, why test in production and learning before
# users are hurt, the fault experiment's steps and checkout's steady state;
# board B3, the loyalty fault test and its fix; board B4, experiments scaled up
# step by step; pages, the Thingyan game day, what follows it and the model
# checker; this week; recap on notes.md.
#
# Three marks add no spoken text and sit at an existing ။ or ၊:
# - hook-split splits the hook at its paragraph break (one 467-character
#   dialog would pass the 450-character limit; no action uses it).
# - b2-s2b, after the ၊ of "… နှေးရုံပါပဲ၊", lands B2's Bill Pay timeout line
#   and its label as the narration names Bill Pay's 1-second wait, not ~10 s
#   early.
# - ask-question sits after the recap question's lead-in "… ပိတ်ရအောင်။", so
#   the question-line select follows only the 95-character question and can
#   make the ⟪pause 3s⟫ (see select-question). sel-question is the voice
#   script's ⟪select မေးခွန်း⟫ and pause-question its ⟪pause 3s⟫.
# B1 step 3's strip lands in two applies (b1-s3, then b1-s3-draw right after
# it), so no apply adds more than three labelled boxes. Pacing: at 70 ms/char
# no page or board step holds longer than ~35 s (the cover), so no pacing page
# or step was added beyond the voice script's own.
#
# ⟪close board⟫ straight into the next board (scenes 3 and 7) wipes the open
# board 400 ms early (whiteboard.apply clear) instead of closing the panel, as
# in lesson 8, so the editor does not flash between two boards; the next board
# then draws with open: true, clear: true as usual. B1 step 3 wipes the comb
# (clear; the board stays open) because the voice script marks it "cleared",
# as lesson 6's B1 step 5 does. A board followed by a deck page closes the
# panel (open: false) 400 ms before the page, and a deck page followed by a
# board closes the page 400 ms before, as in Module 1.
#
# Boards (B1 P2 comb, then a P1 strip; B2 P5 bars; B3 P1 flow; B4 P7
# staircase). Colour jobs: #1e1e1e ink (paints white) for arrows, the bus, the
# axis, the users box and the bar names; blue the thing named and the first
# data series (baseline and canary, the v7 bars and legend, the header,
# checkout, the experiment steps); violet the result and the second series
# (compare, the v8 bars and legend); green healthy or done (the rollout steps,
# the fix and "every night"); red failure (rollback, the stopped rollout, the
# injected delay, the 30-second default); orange the caveat or limit (Bill
# Pay's timeout line, the 2% note, the soft dependency, the region step done
# on paper only). B2's v8 bars are each the same 600 ms taller than their v7
# bars and only Bill Pay's crosses its timeout line, as the voice script and
# the Module 5 review decided. B4's steps rise left to right as overlapping
# cards (each about 125 px right and 80 px up): the widest step ("dependency
# တစ်ခု fail", 21 code points) needs a box of about 340 px under the 0.55 rule,
# and five steps side by side do not fit the 850 px visible area; the rising
# steps carry the order, so there are no arrows. A label on two lines is two
# text assets, one per line, so each line meets the 0.55 em width rule on its
# own; every label was also measured in Chrome with Excalidraw's Virgil font
# and fits the box it sits in.
#
# Deck pages: deck "Next Editor · SRE 5A · Toil and tests", published; the
# /pub URL below is final. Its l19 pages are built later from the page plan, so
# until then the Director reports page "l19_p01" missing from the published
# deck. Page plan: ~/Documents/sre-course/work/pages/sre-19-testing-in-production.json
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/sre-19-testing-in-production.yaml
#   bun scripts/studio-compile-check.ts src/studio/scripts/sre-19-testing-in-production.yaml
