build:
  # Studio swaps in the Burmese voice chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 2619

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: hook
    chapter: Canary pass ပေမဲ့ Bill Pay ပျက်
    narration: >
      [[mark:show-p01]] routing config ပြောင်းတိုင်း check သုံးဆင့် ဖြတ်ရပြီး live config ကိုလည်း Git နဲ့ ညတိုင်း တိုက်ကြည့်ပါတယ်။ ဒီတစ်ပတ် ဝန်ဆောင်ခ တွက်တဲ့ pricing က version ၈ ကို rollout လုပ်တော့ traffic နည်းနည်းဆီ အရင် ပို့တဲ့ canary က pass ဖြစ်ပြီး dashboard တွေလည်း အစိမ်းရောင်ပါ။
      [[mark:hook-split]] ဒါပေမဲ့ Bill Pay မှာ မီတာခ ပေးလို့ မရဘူးဆိုတဲ့ တိုင်ကြားချက်တွေ ဝင်လာပါတယ်။ ခွဲကြည့်တော့ version ၈ ဆီ ရောက်တဲ့ Bill Pay call တွေရဲ့ ၃၀ ရာခိုင်နှုန်းက timeout ဖြစ်နေတာပါ။ ဒါဆို ဘယ်သူ့ဘက်ကို ကြည့်နေခဲ့တာလဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Workbook: Canarying Releases",
          url: "https://sre.google/workbook/canarying-releases/",
        }
      - {
          title: "SRE book, 1st ed: Testing for Reliability",
          url: "https://sre.google/sre-book/testing-reliability/",
        }
    actions:
      # -1750 / -1450, as in Module 1: a pull-back over 1780 ms pushes the first dialog
      # past the 2 s opening handle, which src/studio/plans/index.test.ts rejects.
      - { id: collapse-dock, type: runtime.collapseDock, at: { scene: start, offsetMs: -1750 } }
      - {
          id: show-p01,
          type: slide.show,
          at: { mark: show-p01, offsetMs: -1450 },
          slideId: l19-p01,
        }

  - id: canary
    chapter: Canary ဆိုတာ နှိုင်းယှဉ်တာ
    narration: >
      [[mark:close-p01]] [[mark:b1-s1]] canary တစ်ခု ဘယ်လို အလုပ်လုပ်လဲ အရင် ကြည့်ရအောင်။ canary မှာ request ၁ ရာခိုင်နှုန်းကိုပဲ version အသစ်ဆီ အရင် ပို့ပြီး တစ်ချိန်တည်း version ဟောင်း run နေတဲ့ အရွယ်တူ အုပ်စု တစ်ခုကိုလည်း ယှဉ်ဖို့ ခွဲထားပါတယ်၊ အဲဒီ အုပ်စုကို baseline လို့ ခေါ်ပါတယ်။
      [[mark:b1-s2]] အုပ်စု နှစ်ခုရဲ့ error နဲ့ latency ကို ဘေးချင်းယှဉ်ပြီး အသစ်က ပိုဆိုးလား စစ်တာကို canary analysis လို့ ခေါ်ပါတယ်၊ graph ကို မျက်စိနဲ့ ထိုင်ကြည့်တာ မဟုတ်ပါဘူး။ တစ်ချိန်တည်း ယှဉ်တော့ နေ့လယ်စာချိန်မှာ နှစ်ဖက်လုံး နှေးရင် version ကြောင့် မဟုတ်မှန်း သိပါတယ်။ code အသစ်က user အစစ်နဲ့ production config အစစ်ကို ပထမဆုံး တွေ့တဲ့ နေရာမို့ canary က တခြား test တွေ မမိတာကို မိတတ်ပါတယ်။
      [[mark:b1-s3]] ကောင်းရင် ၁ ရာခိုင်နှုန်းကနေ ၁၀၊ ၅၀ ရာခိုင်နှုန်း၊ ပြီးမှ အားလုံးဆီ တိုးပြီး ပိုဆိုးရင် ချက်ချင်း rollback လုပ်ပါတယ်။ အဆင့်တစ်ခုစီကြားမှာ ပြဿနာ ပေါ်မလား စောင့်ကြည့်တဲ့ အချိန်ကို bake time လို့ ခေါ်ပြီး ထိတဲ့ user နည်းတဲ့ အစပိုင်းကို မြန်မြန်၊ user များတဲ့ နောက်ပိုင်းကို ဖြည်းဖြည်း သွားပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Workbook: Canarying Releases",
          url: "https://sre.google/workbook/canarying-releases/",
        }
      - {
          title: "SRE book, 1st ed: Testing for Reliability",
          url: "https://sre.google/sre-book/testing-reliability/",
        }
    actions:
      - { id: close-p01, type: slide.close, at: { mark: close-p01, offsetMs: -400 } }
      - id: b1-s1
        type: whiteboard.apply
        at: { mark: b1-s1 }
        open: true
        clear: true
        upsertIds:
          [
            l19-b1-users,
            l19-b1-users-t,
            l19-b1-a0,
            l19-b1-bus,
            l19-b1-a1,
            l19-b1-base,
            l19-b1-base-t1,
            l19-b1-base-t2,
            l19-b1-a2,
            l19-b1-can,
            l19-b1-can-t1,
            l19-b1-can-t2,
          ]
        drawMs: 2400
      - id: b1-s2
        type: whiteboard.apply
        at: { mark: b1-s2 }
        upsertIds: [l19-b1-a3, l19-b1-a4, l19-b1-cmp, l19-b1-cmp-t]
        drawMs: 1200
      # Step 3 wipes the comb (the board stays open), then the strip lands in two
      # applies, the second right after the first, so neither adds more than three
      # labelled boxes: 1%, 10% and 50%, then "all" and the rollback branch.
      - id: b1-s3
        type: whiteboard.apply
        at: { mark: b1-s3 }
        clear: true
        upsertIds:
          [
            l19-b1-s1,
            l19-b1-s1-t,
            l19-b1-sa1,
            l19-b1-s2,
            l19-b1-s2-t,
            l19-b1-sa2,
            l19-b1-s3,
            l19-b1-s3-t,
          ]
        drawMs: 1800
      - id: b1-s3-draw
        type: whiteboard.apply
        at: { afterAction: b1-s3 }
        upsertIds:
          [
            l19-b1-sa3,
            l19-b1-s4,
            l19-b1-s4-t,
            l19-b1-rb-a1,
            l19-b1-rb-a2,
            l19-b1-rb-a3,
            l19-b1-rb,
            l19-b1-rb-t,
          ]
        drawMs: 2000

  - id: callers
    chapter: ခေါ်သုံးတဲ့ဘက်က ကြည့်ပါ
    narration: >
      [[mark:close-b1]] [[mark:b2-s1]] ဒါဆို ဘာ လွဲသွားလဲ? ငွေချေတဲ့ checkout၊ Eats နဲ့ Bill Pay တို့က pricing ကို ခေါ်သုံးပါတယ်။ အပြာရောင် bar တွေက version ၇ က ဖြေတဲ့အခါ အဲဒီ သုံးခုဘက်က စောင့်ရတဲ့ latency ပါ။
      [[mark:b2-s2]] version ၈ ကတော့ ဝန်ဆောင်ခ ရှာတိုင်း ၆၀၀ millisecond လောက် ပိုကြာပါတယ်။ checkout နဲ့ Eats က ပိုကြာကြာ စောင့်နိုင်လို့ နည်းနည်း နှေးရုံပါပဲ၊ [[mark:b2-s2b]] Bill Pay ကတော့ ၁ စက္ကန့်ပဲ စောင့်လို့ version ၈ က ဖြေတဲ့ call အတော်များများ timeout ဖြစ်ပါတယ်။ ဒါပေမဲ့ pricing ရဲ့ canary က version ၈ ပိုနှေးတာကို ကိုယ့် ပစ်မှတ်အတွင်းမှာပဲမို့ လက်ခံလိုက်ပြီး Bill Pay လက်လျှော့ပြီးမှ ပို့တဲ့ အဖြေကိုတောင် အောင်မြင်တယ်လို့ မှတ်လို့ pass ဖြစ်ခဲ့တာပါ။
      [[mark:b2-s3]] version ၈ က pricing call တွေရဲ့ ၂ ရာခိုင်နှုန်းလောက်ပဲ ဖြေနေသေးလို့ စုစုပေါင်း latency ကလည်း မလှုပ်သလောက်ပါ။ ဖြည်းဖြည်း ဖြန့်တာကိုက ပြဿနာကို ဖုံးထားလို့ ကိုယ့်ဘက်ကိုပဲ ကြည့်ရင် ခေါ်သုံးတဲ့သူတွေရဲ့ ဒုက္ခကို မမြင်ရပါဘူး။
      [[mark:b2-s4]] ဒါကြောင့် pricing က အဖြေတိုင်းမှာ ဘယ် version က ဖြေလဲ ဆိုတာ header နဲ့ တွဲပို့ပြီး service တိုင်း မျှသုံးတဲ့ client library က call တိုင်းကို အဲဒီ version အလိုက် ခွဲမှတ်ပေးပါတယ်။ ခေါ်သုံးတဲ့ service တိုင်း ဘာမှ ထပ်မရေးဘဲ ဒီ bar တွေကို ရပြီး ပေးရတဲ့ အဖိုးကတော့ သိမ်းရမယ့် metric label တွေ များလာတာပါ။
      [[mark:b2-s5]] အခုဆို ခေါ်သုံးတဲ့ ဘယ်သူ့ဘက်မှာမဆို version အသစ်ရဲ့ ကိန်းဂဏန်း ဆိုးလာတာနဲ့ rollout က အလိုအလျောက် ရပ်ပါတယ်။ ဒီ နည်းကို change supervision လို့ ခေါ်ပြီး lesson ၈ က အလိုအလျောက် rollback ကို ချဲ့ထားတာပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Workbook: Canarying Releases",
          url: "https://sre.google/workbook/canarying-releases/",
        }
    actions:
      # ⟪close board⟫ into the next board: wipe B1 400 ms early, keep the panel open.
      - {
          id: close-b1,
          type: whiteboard.apply,
          at: { mark: close-b1, offsetMs: -400 },
          clear: true,
        }
      # The axis and the v7 legend land with the board, then the three blue bars
      # and their callers are drawn.
      - {
          id: b2-s1,
          type: whiteboard.apply,
          at: { mark: b2-s1 },
          open: true,
          clear: true,
          upsertIds: [l19-b2-axis, l19-b2-leg7],
        }
      - id: b2-s1-draw
        type: whiteboard.apply
        at: { afterAction: b2-s1 }
        upsertIds: [l19-b2-c7, l19-b2-xc, l19-b2-e7, l19-b2-xe, l19-b2-b7, l19-b2-xb]
        drawMs: 1800
      - { id: b2-s2, type: whiteboard.apply, at: { mark: b2-s2 }, upsertIds: [l19-b2-leg8] }
      - id: b2-s2-draw
        type: whiteboard.apply
        at: { afterAction: b2-s2 }
        upsertIds: [l19-b2-c8, l19-b2-e8, l19-b2-b8]
        drawMs: 1500
      # Bill Pay's 1-second timeout line lands as the narration names it.
      - id: b2-s2b
        type: whiteboard.apply
        at: { mark: b2-s2b }
        upsertIds: [l19-b2-lim, l19-b2-lim-t1, l19-b2-lim-t2]
        drawMs: 1200
      - {
          id: b2-s3,
          type: whiteboard.apply,
          at: { mark: b2-s3 },
          upsertIds: [l19-b2-note],
          drawMs: 1000,
        }
      - {
          id: b2-s4,
          type: whiteboard.apply,
          at: { mark: b2-s4 },
          upsertIds: [l19-b2-hdr],
          drawMs: 1000,
        }
      - {
          id: b2-s5,
          type: whiteboard.apply,
          at: { mark: b2-s5 },
          upsertIds: [l19-b2-stop, l19-b2-stop-t],
          drawMs: 900,
        }

  - id: why-production
    chapter: Production ထဲမှာ ဘာလို့ စမ်းလဲ
    narration: >
      [[mark:close-b2]] [[mark:show-p02]] production ထဲမှာ စမ်းတာ အန္တရာယ် မများဘူးလားလို့ မေးစရာ ရှိပါတယ်။ ဒါပေမဲ့ staging ကို production နဲ့ ဘယ်လောက် ဆင်တူအောင် လုပ်ထားထား user အစစ်တွေရဲ့ အပြုအမူကို အတိအကျ မကူးနိုင်ပါဘူး။ ဒါကြောင့် user နည်းနည်းကိုပဲ ထိအောင် ထားပြီး မြန်မြန် ပြန်ဖြုတ်နိုင်ရင် testing in production က အယုံရဆုံး test ဖြစ်ပါတယ်။ ပြီးတော့ feature တွေကိုပဲ မဟုတ်ဘဲ ပျက်တာကိုပါ ကြိုစမ်းရပါမယ်။
      [[mark:show-p02b]] postmortem က user ဒုက္ခရောက်ပြီးမှ သင်ပေးပြီး system ပြောင်းလဲတဲ့ အမြန်နှုန်းကိုလည်း မမီပါဘူး။ ကြိုစမ်းရင်တော့ user မထိခင် သိရပြီး ပုံမှန် ပြန်စမ်းနေလို့ အပြောင်းအလဲတွေကိုပါ မီပါတယ်။ လူ အပြည့်အဝ နားမလည်တဲ့ code များလာလေ ဒီလို စမ်းတာက အဓိက စစ်ချက် ဖြစ်လာလေပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - { title: "Principles of Chaos Engineering", url: "https://principlesofchaos.org/" }
      - {
          title: "SRE book, 1st ed: Testing for Reliability",
          url: "https://sre.google/sre-book/testing-reliability/",
        }
    actions:
      - {
          id: close-b2,
          type: whiteboard.apply,
          at: { mark: close-b2, offsetMs: -400 },
          open: false,
        }
      - { id: show-p02, type: slide.show, at: { mark: show-p02 }, slideId: l19-p02 }
      - { id: show-p02b, type: slide.show, at: { mark: show-p02b }, slideId: l19-p02b }

  - id: fault-experiment
    chapter: Fault experiment
    narration: >
      [[mark:show-p03]] ပျက်တာကို ကြိုစမ်းတဲ့ နည်းက fault experiment ပါ၊ ပျက်စီးမှု တစ်ခုကို production ထဲ တမင် inject လုပ်ပြီး system ဘယ်လို တုံ့ပြန်လဲ ကြည့်တာပါ။ ဒါကို စနစ်တကျ ပုံမှန် လုပ်တာကို chaos engineering လို့ ခေါ်ပေမဲ့ ကျပန်း ဖျက်တာ မဟုတ်ပါဘူး၊ လူတိုင်း ဖတ်လို့ရတဲ့ Principles of Chaos Engineering ထဲက အဆင့်တွေအတိုင်း သွားပြီး ထိခိုက်နိုင်တဲ့ နယ်ပယ်၊ blast radius ကို အမြဲ ကန့်သတ်ပါတယ်။
      [[mark:show-p03b]] steady state ဆိုတာ ပုံမှန် ကျန်းမာနေတဲ့ ပုံကို သဘောတူထားတဲ့ ပစ်မှတ်၊ SLO လိုပဲ user ခံစားရတဲ့ ကိန်းဂဏန်းနဲ့ ရေးတာပါ။ Padauk ရဲ့ checkout အတွက်ဆို ၉၉.၅ ရာခိုင်နှုန်း အောင်မြင်ပြီး request ၉၅ ရာခိုင်နှုန်းက ၁.၅ စက္ကန့်အတွင်း ပြီးရပါမယ်။ hypothesis ကတော့ စမ်းပြီး စစ်မယ့် ယူဆချက်ပါ၊ point ပေးတဲ့ loyalty service က error ပြန်ပေးပေး၊ ၃ စက္ကန့် နှေးနှေး checkout က ဒီ steady state ထဲမှာ ဆက်ရှိမယ်လို့ ယူဆပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - { title: "Principles of Chaos Engineering", url: "https://principlesofchaos.org/" }
    actions:
      - { id: show-p03, type: slide.show, at: { mark: show-p03 }, slideId: l19-p03 }
      - { id: show-p03b, type: slide.show, at: { mark: show-p03b }, slideId: l19-p03b }

  - id: loyalty-test
    chapter: Soft ဖြစ်နေသေးလား
    narration: >
      [[mark:close-p03b]] [[mark:b3-s1]] point မရရင်တောင် ငွေချေတာ ဆက်ဖြစ်ရမှာမို့ loyalty က soft dependency ပါ၊ မရှိရင်လည်း အဓိက အလုပ် ဆက်လုပ်နိုင်ရမယ့် dependency ပါ။ မစခင် မသီရိရဲ့ အဖွဲ့က ဘာစမ်းမလဲ၊ ဘာကြည့်မလဲ၊ ဘယ်သူမဆို ချက်ချင်း ပြန်ရပ်နိုင်တဲ့ အဆင့်တွေ ပါတဲ့ plan ကို ရေးပြီး loyalty အဖွဲ့ကို review လုပ်ခိုင်းပါတယ်။
      [[mark:b3-s2]] loyalty ကို တကယ် မဖျက်ဘဲ checkout ဘက်ကနေ ထွက်တဲ့ call တွေကိုပဲ နှေးအောင် လုပ်ပါတယ်၊ dependency ပျက်တာကို ကိုယ့်ဘက်ကနေ စမ်းတာပါ။ မနက် ၂ နာရီမှာ traffic ၁ ရာခိုင်နှုန်းမှာပဲ ၃ စက္ကန့် delay ကို inject လုပ်ပြီး အဲဒီ rule ကလည်း အချိန်ပြည့်ရင် ကိုယ့်ဘာသာ ပျောက်သွားပါတယ်။
      [[mark:b3-s3]] ရလဒ်ကတော့ hypothesis နဲ့ မတူပါဘူး၊ checkout က point မပါဘဲ ဆက်သွားမယ့်အစား ၃ စက္ကန့်လုံး ထိုင်စောင့်နေလို့ steady state ရဲ့ ၁.၅ စက္ကန့်ကို ကျော်သွားပါတယ်။ ရှာကြည့်တော့ loyalty call မှာ timeout မသတ်မှတ်ထားလို့ default ၃၀ စက္ကန့် ဖြစ်နေတာပါ၊ loyalty တကယ် ရပ်သွားရင် checkout တိုင်း ၃၀ စက္ကန့်အထိ စောင့်ရမှာပါ။
      [[mark:b3-s4]] ပြင်တာက ရိုးရိုးလေးပါ၊ loyalty ကို ၃၀၀ millisecond ပဲ စောင့်ပြီး မဖြေရင် point ကို နောက်မှ ထည့်ပေးတာပါ။ code ပြောင်းရင်း soft dependency တစ်ခုက ဘယ်သူမှ မသိဘဲ မရှိမဖြစ် dependency ဖြစ်သွားတတ်လို့ ဒီ test ကို အခု ညတိုင်း run ပါတယ်။ ရလဒ် မလှပေမဲ့ မဖုံးဘဲ မျှပေးတော့ တခြား အဖွဲ့တွေလည်း ကိုယ့် timeout တွေကို ပြန်စစ်ကြပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - { title: "Principles of Chaos Engineering", url: "https://principlesofchaos.org/" }
      - {
          title: "SRE book, 1st ed: Testing for Reliability",
          url: "https://sre.google/sre-book/testing-reliability/",
        }
    actions:
      - { id: close-p03b, type: slide.close, at: { mark: close-p03b, offsetMs: -400 } }
      - id: b3-s1
        type: whiteboard.apply
        at: { mark: b3-s1 }
        open: true
        clear: true
        upsertIds: [l19-b3-co, l19-b3-co-t, l19-b3-a1, l19-b3-loy, l19-b3-loy-t1, l19-b3-loy-t2]
        drawMs: 1800
      - {
