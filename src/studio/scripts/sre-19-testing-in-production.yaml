        drawMs: 1600
      - id: b4-s2
        type: whiteboard.apply
        at: { mark: b4-s2 }
        upsertIds: [l19-b4-st3, l19-b4-st3-t, l19-b4-st4, l19-b4-st4-t]
        drawMs: 1600
      - id: b4-s3
