  - id: game-day
    chapter: သင်္ကြန် game day
    narration: >
      [[mark:close-b3]] [[mark:b4-s1]] fault experiment တွေကို လှေကားထစ်လို တစ်ဆင့်ချင်း ကြီးအောင် လုပ်ပါတယ်၊ call တစ်ခု နှေးအောင် လုပ်တာကနေ dependency တစ်ခုလုံး fail ဖြစ်အောင် ဆက်တက်ပါတယ်။
      [[mark:b4-s2]] နောက်တစ်ဆင့်မှာ service နှစ်ခုကြားက network link ကို ဖြတ်ကြည့်ပါတယ်၊ zone တစ်ခုကိုလည်း drain လုပ်ပြီး traffic ကို တခြား zone တွေဆီ လွှဲကြည့်ပါတယ်။ database connection ကုန်တာလို resource ပြတ်တာကို စမ်းရင်လည်း service က crash မဖြစ်ဘဲ ရှင်းတဲ့ error ပြပြီး alert တက်ရပါမယ်။
      [[mark:b4-s3]] အမြင့်ဆုံး အဆင့်က region တစ်ခုလုံး ဆုံးရှုံးတာပါ။ Padauk မှာ region တစ်ခုပဲ ရှိလို့ ဒါကိုတော့ စာရွက်ပေါ်မှာပဲ လေ့ကျင့်ပါတယ်၊ ခေါင်းဆောင်တွေကလည်း ဒါကို သင်္ကြန် game day ခေါင်းစဉ်အဖြစ် ရွေးပါတယ်။
      [[mark:close-b4]] [[mark:show-p03c]] game day ဆိုတာ ပျက်စီးမှုကို တမင် ဖန်တီးပြီး အဖွဲ့လိုက် ကြိုလေ့ကျင့်တဲ့ နေ့ပါ။ region ပျောက်ပြီ ဆိုတဲ့ ခေါင်းစဉ်အောက်မှာ အဖွဲ့တိုင်း ကိုယ့် test ကိုယ် ထည့်ပါတယ်၊ ဥပမာ Wallet က မနေ့က backup ကို တကယ် restore လုပ်ကြည့်ပြီး support ကတော့ settlement ကို ပြန် run တတ်တဲ့ ကိုအောင် ခွင့်ယူထားရင် ဘာလုပ်မလဲ ဆွေးနွေးပါတယ်။
      [[mark:show-p03d]] Wallet နဲ့ Eats က တစ်ဖွဲ့ test ကို တစ်ဖွဲ့ စစ်ပေးပြီး တက်သင့်တဲ့ alert တွေ တကယ် တက်လားလည်း ကြည့်ပါတယ်။ တွေ့သမျှကို နောက် သုံးလပတ် plan ထဲ ထည့်ပါတယ်၊ ဒါက အမှတ်ပေးတဲ့ audit မဟုတ်ဘဲ ပိုကောင်းလာဖို့ပါ။
      [[mark:show-p03e]] test တွေက ဖြစ်နိုင်တဲ့ အခြေအနေ တချို့ကိုပဲ စမ်းနိုင်ပါတယ်။ wallet balance ဘယ်တော့မှ သုညအောက် မရောက်ရဘူး ဆိုတဲ့ သေးပြီး အရေးကြီးတဲ့ rule မျိုးအတွက်တော့ model checker ဆိုတဲ့ tool က အဆင့်တွေရဲ့ အစဉ်တိုင်းကို စမ်းပေးပါတယ်။ ဒီတော့ request နှစ်ခု တစ်ပြိုင်နက် ဝင်လာရင် balance စစ်တာနဲ့ ငွေနှုတ်တာကြားက ကွက်လပ်ကို ရှာပေးနိုင်ပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE principles in practice for business continuity (Google Cloud Blog)",
          url: "https://cloud.google.com/blog/products/management-tools/sre-principles-in-practice-for-business-continuity",
        }
