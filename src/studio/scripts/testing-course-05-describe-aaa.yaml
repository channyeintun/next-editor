            hasErrorLogged: () => false,
          };

          // Typecheck mode: Vitest's watch mode would run `tsc --watch`, which reruns on every write by
          // itself (half-typed code, outside the quiet window). So with `typecheck.enabled` every rerun is a
          // fresh one-off `vitest run` instead (tsc runs once per quiet window; 1.6–3 s locally).
          const typecheckWanted = async (configFile) => {
            try {
              const config = (await import(`${pathToFileURL(configFile).href}?t=${Date.now()}`)).default;
              const resolved = typeof config === "function" ? await config({ command: "serve", mode: "test" }) : config;
