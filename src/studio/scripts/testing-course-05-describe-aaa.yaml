  environment: {}
scenes:
  - id: open
    chapter: "Test တစ်ခုရဲ့ အပိုင်း သုံးပိုင်း"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ assert နဲ့ expect ဆိုတဲ့ စစ်ပုံ နှစ်မျိုးကို ကြည့်ခဲ့ပါတယ်။ ဒီ lesson
      မှာတော့ test တစ်ခုကို အပိုင်းလိုက် ရေးနည်း၊ describe နဲ့ အုပ်စုဖွဲ့နည်းနဲ့ test နာမည် ပေးနည်းကို
      ကြည့်ပါမယ်။ [[mark:draw-arrange]] test တစ်ခုမှာ အများအားဖြင့် အပိုင်း သုံးပိုင်း ပါပါတယ်။ ပထမ
      အပိုင်း arrange က စစ်ဖို့ လိုတဲ့ data ကို ပြင်ဆင်တာ ဖြစ်ပြီး၊ ဒီမှာတော့ လက်ဖက်ရည် နှစ်ခွက် မှာတဲ့
      အော်ဒါ line တစ်ကြောင်းကို ပြင်ထားပါတယ်။ [[mark:draw-act]] ဒုတိယ အပိုင်း act ကတော့ စစ်ချင်တဲ့
      function ကို တကယ် ခေါ်ပြီး၊ အဲဒီ line ရဲ့ ငွေကို တွက်ခိုင်းတာပါ။ [[mark:draw-assert]] တတိယ အပိုင်း
      assert က ရလာတဲ့ ငွေဟာ ၃၀၀၀ ကျပ် ဟုတ်မဟုတ်ကို expect နဲ့ စစ်တာပါ။ မြန်မာလို ပြင်ဆင်၊ လုပ်ဆောင်၊
      စစ်ဆေး လို့ မှတ်ထားလို့ ရပါတယ်။ [[mark:draw-one]] test တစ်ခုက ဒီ သုံးဆင့်နဲ့ အလုပ်လုပ်ပုံ
      တစ်ခုတည်းကိုပဲ စစ်ရင်၊ ကျသွားတဲ့အခါ ဘာ မှားလဲ ဆိုတာ ချက်ချင်း သိနိုင်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn Testing: What testing is, testing libraries in practice (arrange, act, assert)",
          url: "https://web.dev/learn/testing/get-started/what-testing-is",
        }
      - {
          title: "Vitest: Testing in Practice, structuring a test",
          url: "https://vitest.dev/guide/learn/testing-in-practice#structuring-a-test",
        }
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-arrange
        type: whiteboard.apply
        at: { mark: draw-arrange }
        upsertIds: [a-arr-box, a-arr-label, a-arr-code]
        drawMs: 3000
      - id: draw-act
        type: whiteboard.apply
        at: { mark: draw-act }
        upsertIds: [a-arrow-1, a-act-box, a-act-label, a-act-code]
        drawMs: 3000
      - id: draw-assert
        type: whiteboard.apply
        at: { mark: draw-assert }
        upsertIds: [a-arrow-2, a-as-box, a-as-label, a-as-code]
        drawMs: 3000
      - id: draw-one
        type: whiteboard.apply
        at: { mark: draw-one }
        upsertIds: [a-one]
        drawMs: 1500

  - id: starter
    narration: >
      ဆိုင်ရဲ့ code ကို ကြည့်ရအောင်။ ဒါက အော်ဒါရဲ့ ငွေကို တွက်ပေးတဲ့ order ဖိုင်ပါ။
      [[mark:select-params]] ဒီ function က အော်ဒါ line တစ်ကြောင်းကို ယူပြီး ငွေ တွက်ပေးပါတယ်။ line
      ထဲမှာ ဘာ မှာလဲ၊ ဘယ်နှခွက်လဲ၊ ခွက် အရွယ်အစားနဲ့ သကြား ပိုထည့်မထည့် ဆိုတာတွေ ပါပါတယ်။
      [[mark:select-rules]] ခွက်ကြီးဆိုရင် သောက်စရာအတွက်ပဲ ၅၀၀ ကျပ်၊ သကြား ပိုထည့်ရင် ၁၀၀ ကျပ်
      ပိုယူပါတယ်။ [[mark:select-return]] ပြီးမှ တစ်ခွက်စာ ဈေးကို ခွက်အရေအတွက်နဲ့ မြှောက်ပါတယ်။ ဒီ
      code ထဲမှာ bug တစ်ခု ပါနေပြီး၊ ဘယ်မှာလဲ ဆိုတာကို test တွေက ပြောပြလာပါလိမ့်မယ်။
      [[mark:open-test]] ဒါကတော့ အဖွဲ့ထဲက အောင်အောင် ရေးထားတဲ့ test ဖိုင်ပါ။ [[mark:select-name]] test
      တစ်ခုတည်း ပါပြီး၊ နာမည်က order works ပါ။ အော်ဒါ အလုပ်လုပ်တယ် ဆိုတာထက် ဘာမှ မပြောပါဘူး။
      [[mark:select-lines]] အထဲမှာတော့ expect ခြောက်ကြောင်းနဲ့ လက်ဖက်ရည် တစ်ခွက်၊ ကော်ဖီ တစ်ခွက်၊
      လက်ဖက်ရည် နှစ်ခွက်၊ ခွက်ကြီး၊ သကြား ပိုထည့်တာနဲ့ မုန့်ဟင်းခါးကို ခွက်ကြီးလို့ မှာတာကို
      စစ်ထားပါတယ်။ [[mark:why-tempting]] ဒီလို ရေးရတာ မြန်ပါတယ်။ စစ်ချင်တာ အသစ် ရှိတိုင်း line တစ်ကြောင်း
      ထပ်ထည့်ရုံပါပဲ။ ဒါပေမဲ့ line တစ်ကြောင်းစီမှာ အဆင့် သုံးဆင့်လုံးကို ညှပ်ထားပြီး၊ မတူတဲ့
      အလုပ်လုပ်ပုံတွေကိုလည်း test တစ်ခုတည်းထဲမှာ ရောထားပါတယ်။
    sources:
      - {
          title: "web.dev Learn Testing: What to test, your approach (catch-all tests)",
          url: "https://web.dev/learn/testing/get-started/what-to-test",
        }
      - { title: "Vitest: Writing Tests", url: "https://vitest.dev/guide/learn/writing-tests" }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: select-params
        type: editor.select
        at: { mark: select-params }
        target:
          {
            file: src/order.js,
            text: 'lineTotal({ id, qty, size = "small", sugar = false })',
            occurrence: 1,
          }
      - id: select-rules
        type: editor.select
        at: { mark: select-rules }
        target:
          {
            file: src/order.js,
            text: "if (size === \"large\" && MENU[id].drink) price += LARGE_EXTRA;\n  if (sugar) price += SUGAR_FEE;",
            occurrence: 1,
          }
      - id: select-return
        type: editor.select
        at: { mark: select-return }
        target: { file: src/order.js, text: "return price * qty;", occurrence: 1 }
      - id: open-test
        type: workspace.openFile
        at: { mark: open-test }
        path: src/order.test.js
      - id: select-name
        type: editor.select
        at: { mark: select-name }
        target: { file: src/order.test.js, text: 'test("order works", () => {', occurrence: 1 }
      - id: select-lines
        type: editor.select
        at: { mark: select-lines }
        target:
          {
            file: src/order.test.js,
            text: "expect(lineTotal({ id: \"tea\" })).toBe(1500);\n  expect(lineTotal({ id: \"coffee\" })).toBe(1800);\n  expect(lineTotal({ id: \"tea\", qty: 2 })).toBe(3000);\n  expect(lineTotal({ id: \"tea\", size: \"large\" })).toBe(2000);\n  expect(lineTotal({ id: \"tea\", qty: 2, sugar: true })).toBe(3200);\n  expect(lineTotal({ id: \"mohinga\", size: \"large\" })).toBe(2500);",
            occurrence: 1,
          }

  - id: panel
    narration: >
      [[mark:ready]] Vitest က ဘာ ပြလဲ ကြည့်ရအောင်။ ညာဘက်က panel မှာ ပြနေတာကလည်း၊ code ပြောင်းတိုင်း
      သူ့ဘာသာ ပြန် run နေတဲ့ တကယ့် Vitest ရဲ့ ရလဒ်ပါ။ [[mark:read-fail]] အပေါ်က အနီရောင် FAIL နဲ့ test စာရင်းထဲက
      ကြက်ခြေခတ်က ဒီ test ကျနေတယ်လို့ ပြနေပြီး၊ summary မှာလည်း test တစ်ခု fail လို့ ပြပါတယ်။
      [[mark:read-message]] အောက်ဆုံးက Failed Tests အပိုင်းမှာတော့ ၁၅၀၀ ဖြစ်ရမယ့် နေရာမှာ NaN
      ရနေတယ်လို့ ပြောနေပါတယ်။ Expected ကို အစိမ်းရောင်၊ Received ကို အနီရောင်နဲ့ ပြထားပြီး၊ NaN ဆိုတာ
      ဂဏန်း မဟုတ်ဘူး ဆိုတဲ့ အဓိပ္ပာယ်ပါ။ [[mark:read-frame]] code frame က လက်ဖက်ရည် တစ်ခွက်ကို
      စစ်တဲ့ ပထမ line ကို ညွှန်ပြနေပြီး၊ message ကလည်း ဒီ တစ်ခုပဲ ရှိပါတယ်။
    sources:
      - {
          title: "Vitest: Writing Tests, reading test output",
          url: "https://vitest.dev/guide/learn/writing-tests#reading-test-output",
        }
      - {
          title: "MDN: NaN",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/NaN",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-start-fail
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 3, delayMs: 1000 }
      - id: expect-start-one
        type: expect.preview
        at: { afterAction: expect-start-fail }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-total, value: "1" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-message
        type: expect.preview
        at: { afterAction: expect-start-one }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-message, value: "expected NaN to be 1500 // Object.is equality" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-frame
        type: expect.preview
        at: { afterAction: expect-start-message }
        timeoutMs: 5000
        target: { by: testId, value: vt-frame-1 }
        attribute: { name: data-line, value: "5" }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: catch-all
    chapter: "Test ကြီး တစ်ခုထဲမှာ အကုန် စစ်ရင်"
    narration: >
      ဒီ ရလဒ်က ဘယ်လောက် ပြောပြလဲ စဉ်းစားကြည့်ရအောင်။ [[mark:board-stop]] expect တစ်ကြောင်း
      ကျတာနဲ့ error throw လုပ်လိုက်လို့ test က အဲဒီမှာတင် ရပ်သွားပါတယ်။ ကျန်တဲ့ ငါးကြောင်းက run တောင်
      မ run ခဲ့လို့၊ ကော်ဖီရော၊ ခွက်ကြီးရော၊ သကြားခရော မှန်မမှန် မသိနိုင်ပါဘူး။ [[mark:draw-name]]
      နာမည်ကလည်း ဘယ် အလုပ်လုပ်ပုံ ပျက်လဲ မပြောတော့၊ တခြားသူ တစ်ယောက်က ဒီ test ကျတာကို မြင်ရင် code
      ကို ဝင်ဖတ်ပြီးမှ သိရမှာပါ။ [[mark:draw-soft]] Vitest မှာ expect soft ဆိုတာလည်း ရှိပါတယ်။ soft နဲ့
      စစ်ရင် တစ်ကြောင်း ကျလည်း မရပ်ဘဲ ဆက်စစ်ပြီး၊ ကျတာ အကုန်ကို ပြပါတယ်။ ဒါပေမဲ့ test က တစ်ခုတည်း
      ဖြစ်နေတုန်းမို့၊ ဘယ် အလုပ်လုပ်ပုံ ပျက်လဲ ဆိုတဲ့ နာမည်ကိုတော့ မရပါဘူး။ [[mark:test-case]] ဒါကြောင့်
      အလုပ်လုပ်ပုံ တစ်ခုကို test တစ်ခုစီ ခွဲရေးကြည့်ရအောင်။ ဒီလို နာမည်ပေးထားပြီး သီးခြား run လို့ရတဲ့
      စစ်ချက် တစ်ခုကို test case လို့ ခေါ်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn Testing: What to test, your approach (a clear goal per test case)",
          url: "https://web.dev/learn/testing/get-started/what-to-test",
        }
      - {
          title: "web.dev Learn Testing: What testing is, a test case is a single, independent, addressable scenario",
          url: "https://web.dev/learn/testing/get-started/what-testing-is",
        }
      - { title: "Vitest: expect.soft (facts A33)", url: "https://vitest.dev/api/expect#soft" }
    actions:
      - id: board-stop
        type: whiteboard.apply
        at: { mark: board-stop }
        open: true
        clear: true
        upsertIds: [b-title, b-box, b-name, b-r1, b-r2, b-r3, b-r4, b-r5, b-r6, b-stop, b-unknown]
        drawMs: 5000
      - id: draw-name
        type: whiteboard.apply
        at: { mark: draw-name }
        upsertIds: [b-noname]
        drawMs: 1500
      - id: draw-soft
        type: whiteboard.apply
        at: { mark: draw-soft }
        upsertIds: [b-soft]
        drawMs: 1800

  - id: describe
    chapter: "Describe နဲ့ test တွေကို အုပ်စုဖွဲ့ရအောင်"
    narration: >
      test ဖိုင်ကို ပြန်သွားရအောင်။ [[mark:type-import]] describe ကိုလည်း vitest ကနေ ယူသုံးရမှာမို့
      import ထဲမှာ ထည့်ပါမယ်။ [[mark:type-describe]] ပြီးတော့ ဖိုင်ရဲ့ အောက်ဆုံးမှာ describe block
      တစ်ခု ထည့်ပါမယ်။ describe က test တွေကို နာမည် တစ်ခုအောက်မှာ အုပ်စုဖွဲ့ပေးပြီး၊ ဒီလို အုပ်စုကို
      test suite လို့လည်း ခေါ်ပါတယ်။ အုပ်စု နာမည်ကတော့ စစ်မယ့် function ရဲ့ နာမည်ပါ။
      [[mark:select-first]] ပထမ test က menu ဈေးနှုန်းအတိုင်း ယူတယ် ဆိုတဲ့ test ပါ။
      [[mark:select-arrange]] ပထမ line က လက်ဖက်ရည် တစ်ခွက် line ကို ပြင်တဲ့ arrange ပါ။
      [[mark:select-act]] ဒုတိယ line က function ကို ခေါ်တဲ့ act ဖြစ်ပြီး၊ [[mark:select-assert]] တတိယ
      line က ၁၅၀၀ ကျပ် ဖြစ်ရမယ်လို့ စစ်တဲ့ assert ပါ။ ဘုတ်ပေါ်က သုံးဆင့်အတိုင်း တစ်ကြောင်းစီ ခွဲထားလို့
      ဖတ်ရ ရှင်းပြီး၊ ကျတဲ့ line ကလည်း တိုတိုလေးပဲ ဖြစ်ပါတယ်။ [[mark:read-suite]] panel ကို ကြည့်ပါ။ test
      စာရင်းထဲမှာ function နာမည်နဲ့ အုပ်စု တစ်ခု ပေါ်လာပြီး၊ test အသစ်က သူ့အောက်မှာ ဝင်နေပါတယ်။ ဒီ test
      လည်း ကျနေပေမဲ့၊ နာမည်ကို ကြည့်ရုံနဲ့ menu ဈေးနှုန်း ယူတဲ့ အပိုင်း ပျက်နေတယ်လို့ သိနိုင်ပါပြီ။
      [[mark:read-full-name]] Failed Tests အပိုင်းမှာလည်း ဒုတိယ ကျတဲ့ test ကို ဖိုင်နာမည်နောက်မှာ အုပ်စု
      နာမည်နဲ့ test နာမည် ဆက်ပြီး ပြထားပါတယ်။
    sources:
      - { title: "Vitest: describe", url: "https://vitest.dev/api/describe" }
      - {
          title: "Vitest: Writing Tests, grouping tests with describe",
          url: "https://vitest.dev/guide/learn/writing-tests#grouping-tests-with-describe",
        }
      - {
          title: "web.dev Learn Testing: Assertions and other primitives, group tests within files",
          url: "https://web.dev/learn/testing/assertions/tools#group_tests_within_files",
        }
    actions:
      - id: close-soft
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: type-import
        type: editor.type
        at: { mark: type-import }
        target: { file: src/order.test.js, after: "import { ", occurrence: 1 }
        text: "describe, "
      - id: type-describe
        type: editor.type
        at: { mark: type-describe }
        target: { file: src/order.test.js, after: "toBe(2500);\n});\n", occurrence: 1 }
        text: "\ndescribe(\"lineTotal\", () => {\n  test(\"charges the menu price\", () => {\n    const line = { id: \"tea\" };\n    const total = lineTotal(line);\n    expect(total).toBe(1500);\n  });\n});\n"
        # One block (pilot note 1): one write, one run, no half-typed state for Vitest to read.
        cadence: block
      - id: expect-two-tests
        type: expect.preview
        at: { afterAction: type-describe }
        timeoutMs: 8000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-total, value: "2" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-suite
        type: expect.preview
        at: { afterAction: expect-two-tests }
        timeoutMs: 5000
        target: { by: testId, value: vt-suite-1 }
        attribute: { name: data-name, value: "lineTotal" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-menu-price-fails
        type: expect.preview
        at: { afterAction: expect-suite }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-2 }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-full-name
        type: expect.preview
        at: { afterAction: expect-menu-price-fails }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-2 }
        attribute: { name: data-test, value: "lineTotal > charges the menu price" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-first
        type: editor.select
        at: { mark: select-first }
        target:
          { file: src/order.test.js, text: 'test("charges the menu price", () => {', occurrence: 1 }
      - id: select-arrange
        type: editor.select
        at: { mark: select-arrange }
        target: { file: src/order.test.js, text: 'const line = { id: "tea" };', occurrence: 1 }
      - id: select-act
        type: editor.select
        at: { mark: select-act }
        target: { file: src/order.test.js, text: "const total = lineTotal(line);", occurrence: 1 }
      - id: select-assert
        type: editor.select
        at: { mark: select-assert }
        target: { file: src/order.test.js, text: "expect(total).toBe(1500);", occurrence: 1 }

  - id: focused
    narration: >
      ကျန်တဲ့ အလုပ်လုပ်ပုံတွေကိုလည်း test တစ်ခုစီ ထည့်ပါမယ်။ [[mark:type-qty]] ဒုတိယ test က
      ဘုတ်ပေါ်က ဥပမာပါ။ လက်ဖက်ရည် နှစ်ခွက်ဆိုရင် ၃၀၀၀ ကျပ် ဖြစ်ရမယ်လို့ စစ်ပြီး၊ ဒီ test က အမှန်ခြစ်နဲ့
      pass ဖြစ်ပါတယ်။ [[mark:type-large]] တတိယ test က ခွက်ကြီး တစ်ခွက်ကို ၂၀၀၀ ကျပ် ဖြစ်ရမယ်လို့
      စစ်ပါတယ်။ ဒီတစ်ခါ ကြက်ခြေခတ် ပေါ်လာပါတယ်။ [[mark:type-sugar]] စတုတ္ထ test က သကြား ပိုထည့်တဲ့
      လက်ဖက်ရည် နှစ်ခွက်ကို ၃၂၀၀ ကျပ်လို့ စစ်ပြီး၊ ဒါက pass ဖြစ်ပါတယ်။ [[mark:type-food]] နောက်ဆုံး
      test က မုန့်ဟင်းခါးကို ခွက်ကြီးလို့ မှာရင်တောင် ဈေး မပြောင်းရဘူး ဆိုတာ စစ်ပြီး၊ ဒါလည်း
      ကျနေပါတယ်။ [[mark:read-pattern]] အခု test စာရင်းကို နာမည်တွေနဲ့ တွဲဖတ်ကြည့်ပါ။ summary မှာ လေးခု
      fail နဲ့ နှစ်ခု pass လို့ ပြနေပါတယ်။ pass ဖြစ်တဲ့ နှစ်ခုက ခွက်အရေအတွက်နဲ့ မြှောက်တာနဲ့ သကြားခ
      ယူတာ ဖြစ်ပြီး၊ [[mark:select-with-qty]] နှစ်ခုလုံးမှာ နှစ်ခွက်လို့ ပြောထားပါတယ်။ [[mark:select-no-qty]]
      အုပ်စုထဲမှာ ကျနေတဲ့ သုံးခုကတော့ ဘယ်နှခွက်လဲ မပြောထားပါဘူး။ ဆိုင်ရဲ့ စည်းကမ်းအရ မပြောရင်
      တစ်ခွက် ဖြစ်ရမှာမို့၊ bug က ခွက်အရေအတွက် မပါတဲ့ အော်ဒါ line တွေမှာပဲ ပေါ်နေတာပါ။ [[mark:read-hidden]] test ကြီး
      တစ်ခုတည်း ရှိတုန်းက ပထမ line မှာ ရပ်သွားလို့ ဒီ ပုံစံကို မမြင်ခဲ့ရပါဘူး။ နာမည်ပေးထားတဲ့ test တွေ
      ခွဲလိုက်တော့မှ၊ panel က bug ရှိတဲ့ နေရာကို ညွှန်ပြလာတာပါ။
    sources:
      - {
          title: "Vitest: Testing in Practice, one behavior per test",
          url: "https://vitest.dev/guide/learn/testing-in-practice#one-behavior-per-test",
        }
      - {
          title: "web.dev Learn Testing: What testing is, named tests highlight a bug or scenario",
          url: "https://web.dev/learn/testing/get-started/what-testing-is",
        }
    actions:
      - id: type-qty
        type: editor.type
        at: { mark: type-qty }
        target:
          { file: src/order.test.js, after: "expect(total).toBe(1500);\n  });\n", occurrence: 1 }
        text: "\n  test(\"multiplies by the quantity\", () => {\n    const line = { id: \"tea\", qty: 2 };\n    const total = lineTotal(line);\n    expect(total).toBe(3000);\n  });\n"
        cadence: block
      - id: expect-qty-passes
        type: expect.preview
        at: { afterAction: type-qty }
        timeoutMs: 8000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "1" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-qty-test
        type: expect.preview
        at: { afterAction: expect-qty-passes }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-3 }
        attribute: { name: data-name, value: "lineTotal > multiplies by the quantity" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: type-large
        type: editor.type
        at: { mark: type-large }
        target:
          { file: src/order.test.js, after: "expect(total).toBe(3000);\n  });\n", occurrence: 1 }
        text: "\n  test(\"adds the large-cup extra\", () => {\n    const line = { id: \"tea\", size: \"large\" };\n    const total = lineTotal(line);\n    expect(total).toBe(2000);\n  });\n"
        cadence: block
      - id: expect-large-fails
        type: expect.preview
        at: { afterAction: type-large }
        timeoutMs: 8000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-total, value: "4" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-large-test
        type: expect.preview
        at: { afterAction: expect-large-fails }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-4 }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: type-sugar
        type: editor.type
        at: { mark: type-sugar }
        target:
          { file: src/order.test.js, after: "expect(total).toBe(2000);\n  });\n", occurrence: 1 }
        text: "\n  test(\"adds the sugar fee per cup\", () => {\n    const line = { id: \"tea\", qty: 2, sugar: true };\n    const total = lineTotal(line);\n    expect(total).toBe(3200);\n  });\n"
        cadence: block
      - id: expect-sugar-passes
        type: expect.preview
        at: { afterAction: type-sugar }
        timeoutMs: 8000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "2" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: type-food
        type: editor.type
        at: { mark: type-food }
        target:
          { file: src/order.test.js, after: "expect(total).toBe(3200);\n  });\n", occurrence: 1 }
        text: "\n  test(\"ignores size for food\", () => {\n    const line = { id: \"mohinga\", size: \"large\" };\n    const total = lineTotal(line);\n    expect(total).toBe(2500);\n  });\n"
        cadence: block
      - id: expect-food-fails
        type: expect.preview
        at: { afterAction: type-food }
        timeoutMs: 8000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-failed, value: "4" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-six-tests
        type: expect.preview
        at: { afterAction: expect-food-fails }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-total, value: "6" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-food-message
        type: expect.preview
        at: { afterAction: expect-six-tests }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-4 }
        attribute: { name: data-message, value: "expected NaN to be 2500 // Object.is equality" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-with-qty
        type: editor.select
        at: { mark: select-with-qty }
        target:
          { file: src/order.test.js, text: '{ id: "tea", qty: 2, sugar: true }', occurrence: 2 }
      - id: select-no-qty
        type: editor.select
        at: { mark: select-no-qty }
        target: { file: src/order.test.js, text: '{ id: "tea", size: "large" }', occurrence: 2 }

  - id: fix
    narration: >
      [[mark:open-order-fix]] order ဖိုင်ကို ပြန်ဖွင့်ပြီး ပြင်ကြည့်ရအောင်။ [[mark:select-params-again]]
      parameter တွေကို ကြည့်ပါ။ ခွက် အရွယ်အစားနဲ့ သကြားမှာ မပေးရင် သုံးမယ့် default တန်ဖိုး ရှိပေမဲ့၊
      ခွက်အရေအတွက်မှာတော့ မရှိပါဘူး။ ဒါကြောင့် ခွက်အရေအတွက် မပါတဲ့ အော်ဒါ line မှာ သူက undefined
      ဖြစ်နေပြီး၊ ဈေးနှုန်းကို undefined နဲ့ မြှောက်တော့ NaN ထွက်လာတာပါ။ [[mark:type-default]] မပါရင် တစ်ခွက်လို့ ယူအောင်
      default တန်ဖိုး ထည့်ပေးလိုက်ပါမယ်။ [[mark:read-green]] panel ကို ကြည့်ပါ။ test ခြောက်ခုလုံး pass
      ဖြစ်ပြီး၊ အပေါ်မှာ အစိမ်းရောင် PASS ပေါ်လာပါပြီ။ test ကြီးကလည်း pass ဖြစ်ပေမဲ့၊ သူ စစ်တာတွေကို
      နာမည်ပေးထားတဲ့ test ငါးခုက စစ်နေပြီမို့၊ ကိုယ့် project မှာဆိုရင် ဖျက်လိုက်ပါ။
    sources:
      - {
          title: "MDN: Default parameters",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Functions/Default_parameters",
        }
      - {
          title: "MDN: NaN",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/NaN",
        }
    actions:
      - id: open-order-fix
        type: workspace.openFile
        at: { mark: open-order-fix }
        path: src/order.js
      - id: select-params-again
        type: editor.select
        at: { mark: select-params-again }
        target:
          { file: src/order.js, text: '{ id, qty, size = "small", sugar = false }', occurrence: 1 }
      - id: type-default
        type: editor.type
        at: { mark: type-default }
        target: { file: src/order.js, after: "{ id, qty", occurrence: 1 }
        text: " = 1"
      - id: expect-green
        type: expect.preview
        at: { afterAction: type-default }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-six-passed
        type: expect.preview
        at: { afterAction: expect-green }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "6" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-order-file
        type: expect.file
        at: { afterAction: expect-six-passed }
        path: src/order.js
        contains: 'export function lineTotal({ id, qty = 1, size = "small", sugar = false }) {'

  - id: names
    chapter: "Test နာမည် ဘယ်လို ပေးမလဲ"
    narration: >
      [[mark:open-test-names]] test ဖိုင်ကို ပြန်ဖွင့်ပြီး နာမည်တွေကို ကြည့်ရအောင်။
      [[mark:select-describe-name]] describe ရဲ့ အုပ်စု နာမည်ရယ်၊ [[mark:select-test-name]] test ရဲ့
      နာမည်ရယ်ကို Vitest က ဆက်ပြီး၊ test တစ်ခုစီကို နာမည်အပြည့် ပေးပါတယ်။ [[mark:board-names]] ခုနက
      Failed Tests အပိုင်းမှာ ဖိုင်နာမည်နောက်က မြင်ခဲ့ရတာလည်း ဒီ နာမည်အပြည့်ပါ။
      [[mark:draw-uses]] နာမည် ရှိလို့ test တစ်ခုကို လတွေ ကြာလာလည်း ခြေရာခံလို့ ရပါတယ်။ လပေါင်းများစွာ
      pass ဖြစ်နေခဲ့တဲ့ test တစ်ခု ဒီနေ့ ကျသွားရင်၊ ဘယ် အလုပ်လုပ်ပုံ ပျက်သွားလဲ ဆိုတာကို နာမည်က ပြောပါတယ်။ bug ကိုလည်း နာမည်နဲ့
      ညွှန်းလို့ ရပြီး၊ test တချို့ကိုပဲ ရွေး run တဲ့အခါလည်း ဒီ နာမည်နဲ့ ရှာပါတယ်။ [[mark:draw-good]]
      နာမည်ကောင်းက code ဘာလုပ်လဲ ဆိုတဲ့ အလုပ်လုပ်ပုံကို English လို တိုတို ရှင်းရှင်း ပြောပါတယ်။
      [[mark:draw-bad]] အော်ဒါ အလုပ်လုပ်တယ်၊ test ၁ ဆိုတာမျိုး နာမည်တွေက ဘာ ပျက်လဲ မပြောပါဘူး။ should ဆိုတဲ့
      စကားလုံးကလည်း အဓိပ္ပာယ် မထပ်ပေးလို့ မထည့်ပါဘူး။ [[mark:draw-and]] နာမည်ထဲမှာ and ထည့်ဖို့
      လိုလာရင်တော့ test က အလုပ်လုပ်ပုံ နှစ်ခု စစ်နေတာမို့၊ test နှစ်ခု ခွဲရေးပါ။
    sources:
      - {
