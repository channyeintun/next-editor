            for (const [path, text] of files) hash.update(`${path}\0${text}\0`);
            const version = hash.digest("hex").slice(0, 12);
            if (apps.has(version)) return { entry: wantsApp, version, error: "" };
            const scripts = [...files.keys()].filter((path) => SCRIPT.test(path));
            if ((await Promise.all(scripts.map((path) => parses(join(root, path))))).includes(false)) {
              return { entry: wantsApp, version: lastApp?.version ?? null, error: "" };
            }
