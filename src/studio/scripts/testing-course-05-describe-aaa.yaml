  - id: organize
    narration: >
      test တွေကို စီစဉ်တဲ့အခါ သိထားသင့်တာ နည်းနည်း ရှိပါသေးတယ်။ [[mark:draw-alias]] တခြား project
      တွေမှာ describe အစား suite လို့၊ test အစား it လို့ ရေးထားတာ တွေ့ရနိုင်ပြီး၊ အဓိပ္ပာယ်
      အတူတူပါပဲ။ ဒီ course မှာတော့ describe နဲ့ test ကိုပဲ သုံးပါမယ်။ [[mark:draw-nest]] describe ထဲမှာ
      describe ထပ်ထည့်လို့ ရပေမဲ့၊ နှစ်ဆင့်ထက် မပိုအောင် ထားပါ။ အဆင့် များလာရင် ဖတ်ရ ခက်ပါတယ်။
      [[mark:draw-test-in-test]] test ထဲမှာ test ထပ်ရေးရင်တော့ Vitest က အပြင်က test ကို error နဲ့
      ကျစေပြီး၊ describe ထဲမှာ ထည့်ပါလို့ ပြောပါတယ်။ [[mark:draw-files]] test ဖိုင်ကိုတော့ ဒီ lesson လို
      သူ စစ်တဲ့ code ဖိုင်ရဲ့ ဘေးမှာ ထားပြီး၊ page တစ်ခုလုံးကို အစကနေ အဆုံးထိ စစ်တဲ့ test ကြီးတွေကိုတော့
      သီးသန့် folder မှာ ထားလေ့ ရှိပါတယ်။
    sources:
      - { title: "Vitest: describe (alias suite)", url: "https://vitest.dev/api/describe" }
      - { title: "Vitest: test (alias it)", url: "https://vitest.dev/api/test" }
      - {
          title: "Vitest: Testing in Practice, organizing test files",
          url: "https://vitest.dev/guide/learn/testing-in-practice#organizing-test-files",
        }
      - {
          title: "web.dev Learn Testing: Assertions and other primitives, group tests across and within files (facts B09)",
          url: "https://web.dev/learn/testing/assertions/tools#group_tests_across_files",
        }
    actions:
      - id: board-organize
        type: whiteboard.apply
        at: { scene: start }
        clear: true
        upsertIds: [d-title]
      - id: draw-alias
        type: whiteboard.apply
        at: { mark: draw-alias }
        upsertIds: [d-alias]
        drawMs: 1800
      - id: draw-nest
        type: whiteboard.apply
        at: { mark: draw-nest }
        upsertIds: [d-nest]
        drawMs: 1800
      - id: draw-test-in-test
        type: whiteboard.apply
        at: { mark: draw-test-in-test }
        upsertIds: [d-tit, d-tit-msg]
        drawMs: 2500
      - id: draw-files
        type: whiteboard.apply
        at: { mark: draw-files }
        upsertIds: [d-files-1, d-files-2]
        drawMs: 2500

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ test ကြီး တစ်ခုထဲမှာ အကုန် စစ်ရင် ပထမ ကျတဲ့ line မှာ ရပ်သွားပြီး၊ ကျန်တာတွေကို
      ဖုံးထားပါတယ်။ အလုပ်လုပ်ပုံ တစ်ခုကို နာမည်ပေးထားတဲ့ test case တစ်ခုစီ ခွဲရေးပြီး describe နဲ့
      အုပ်စုဖွဲ့ရင်၊ ကျတဲ့ test ရဲ့ နာမည်က bug ရှိတဲ့ နေရာကို ညွှန်ပြပါတယ်။ [[mark:recap-aaa]] test
      တစ်ခုချင်းကိုလည်း ပြင်ဆင်၊ လုပ်ဆောင်၊ စစ်ဆေး ဆိုတဲ့ သုံးဆင့်နဲ့ ရေးပါ။ နောက် lesson မှာတော့ test
      တစ်ခုက နောက် test တစ်ခုကို ဒုက္ခပေးတဲ့ ပြဿနာနဲ့၊ hook တွေနဲ့ test တိုင်းကို အစကနေ သန့်သန့်
      စစေတဲ့ နည်းကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "web.dev Learn Testing: What testing is",
          url: "https://web.dev/learn/testing/get-started/what-testing-is",
        }
      - {
          title: "Vitest: Testing in Practice",
          url: "https://vitest.dev/guide/learn/testing-in-practice",
        }
    actions:
      - id: close-organize
        type: whiteboard.apply
        at: { scene: start }
        open: false
checks:
  - { type: timing.p95Ms, max: 300 }
