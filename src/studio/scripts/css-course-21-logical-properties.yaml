# CSS course (Burmese), lesson 21 of 43: logical properties.
#
# Narration is Burmese (written from the English draft span by span, then
# edited; voice-script.md next to this file is the same text with marks).
# Every [[mark:…]] sits where its action begins, at a sentence end or after
# ၊; each span carries one piece of meaning. Everything the learner sees
# (title, chapters, whiteboard labels, UI strings) is Burmese.
#
# Shape: board A (recall lessons 20 / 15; physical vs logical names of one
# box's sides; inline and block directions) → board B (the axes in
# Burmese/English, Arabic and vertical Japanese) → code tour (side label, the
# mini card, the same card inside dir="rtl"; lang does not set direction) →
# the icon gap: margin-right is right in LTR and wrong in RTL, fixed with
# margin-inline-end → board C (physical → logical mapping) → about box
# max-inline-size + margin-inline auto → prices text-align end → card
# padding-block, two-value padding-inline (start, end), margin-block-end →
# quote border-inline-start + padding-inline-start → board D (corner names:
# block word first) → border-start-end-radius, the badge with
# inset-block-start / inset-inline-end → side label writing-mode vertical-rl,
# text-orientation upright, inline-size (now the height), text-align end (now
# the bottom) → board E (vi / vb, physical still right for a shadow) → quiz
# and recap, hand-off to spacing (lesson 22).
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set(; no postcss config; no reload
# (RTL comes from a pinned dir attribute, so no HTML edit). New rules are
# appended at the END of styles.css; later declarations are inserted inside
# an existing rule. Keystroke-typed values have no misleading valid prefix
# ("8", "8p", "32c", "au", "e", "vertical-r", "upri" are all invalid until
# complete). Two lines are line-by-line because they DO have a valid prefix:
# "padding-inline: 16px" (before " 48px") and "border-inline-start: 6px
# solid" (before " seagreen" — a brown bar would flash, then vanish).
#
# Measured in headless Chrome at 432 × 720 (probe/stages.ts): see DESIGN.md.
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
