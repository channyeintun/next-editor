scenes:
  - id: open
    chapter: သုံးလအကြာ
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ support agent တွေရဲ့ စိုးရိမ်ချက်ကို ဖြေပြီး၊ CTO ဖြစ်တဲ့ အောင်အောင် ပို့မယ့် launch message
      ကို ရေးခဲ့ပါတယ်။
      [[mark:o-title]] launch ပြီး သုံးလ ကြာလာတော့ ဝန်ထမ်း အများစုက Claude ကို ပုံမှန် သုံးနေကြပါပြီ။ ဒါပေမဲ့ ဌာနတွေကို
      လှည့်ကြည့်တော့ ဌာနတိုင်းက ကိုယ့်နည်း ကိုယ်ဟာနဲ့ သွားနေကြတာ တွေ့ရပါတယ်။
      [[mark:o-1]] support မှာ connection ticket အတွက် reply prompt သုံးမျိုး ရှိနေပါတယ်။ အဲဒီထဲက တစ်ခုက NMS ကို
      မစစ်ဘဲ router ပြန်ဖွင့်ဖို့ အကြံပေးနေဆဲပါ။ မုန်တိုင်းကျတဲ့ညက သင်ခန်းစာကို ဌာန တစ်ခုထဲမှာတောင် တစ်ဝက်ပဲ
      မှတ်မိနေတာပါ။
      [[mark:o-2]] finance က ဘယ် data ကို Claude ထဲ ထည့်လို့ရလဲ ဆိုတာကို ကိုယ်ပိုင် စည်းကမ်းနဲ့ ရေးထားပါတယ်။ security
      တာဝန်ခံ ခွင့်ပြုထားတာထက် တင်းကျပ်လွန်းလို့ အလုပ်တွေ မလိုအပ်ဘဲ နှေးနေပါတယ်။
      [[mark:o-3]] Network Tools က developer တွေကလည်း Billing မှာ ရှိပြီးသား skill တစ်ခုကို မသိဘဲ အစကနေ ပြန်ရေးနေကြပါတယ်။
      skill ဆိုတာ အလုပ် တစ်မျိုးကို ဘယ်လို လုပ်ရမလဲ ရေးထားပြီး လိုတဲ့အခါ Claude ဖတ်သုံးတဲ့ လမ်းညွှန်ပါ။
      [[mark:o-need]] ဒီ အမှားတွေက ကြီးကြီးမားမား မဟုတ်ပေမဲ့ တစ်ခုနဲ့ တစ်ခု မမျှဝေကြပါဘူး။ ဒါက Acceleration အဆင့်ကို
      စရမယ့် အချိန် ရောက်ပြီ ဆိုတဲ့ လက္ခဏာပါ။ Acceleration က FDE learning path ရဲ့ အဆင့် သုံးဆင့်ထဲက
      ဒုတိယ အဆင့်ပါ။ နေခြည် အတွက်ဆိုရင် ဌာန တစ်ခုမှာ အလုပ်ဖြစ်တဲ့ နည်းကို တခြားဌာနတွေဆီ မြန်မြန် ရောက်အောင် လုပ်တဲ့
      အဆင့်ပါ။
