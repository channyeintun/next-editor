      နေတုန်း code ရဲ့ ဘယ်အပိုင်းတွေ run သွားလဲ ဆိုတာ ဖြစ်ပြီး၊ coverage lesson မှာ ကြည့်ခဲ့ပြီးပါပြီ။ ဒါပေမဲ့
      line တစ်ကြောင်း run သွားတာနဲ့၊ အဲဒီ line မှန်မမှန် test က စစ်တာက မတူပါဘူး။ [[mark:draw-q2]] ဒုတိယ
      မေးခွန်းက code ထဲက line တစ်ကြောင်း မှားသွားရင် test တစ်ခုခု ကျမလား ဆိုတာပါ။ code ကို တမင်
      ပြောင်းကြည့်ပြီး ဒါကို စစ်တဲ့ နည်းကို mutation testing လို့ ခေါ်ပါတယ်။ [[mark:draw-q3]] တတိယ
      မေးခွန်းကတော့ input ဘယ်လိုပဲ ဖြစ်ဖြစ် code ရဲ့ စည်းကမ်းက မှန်နေလား ဆိုတာပါ။ စည်းကမ်းကို ရေးထားပြီး
      ချိုးဖောက်တဲ့ input ကို tool က ရှာပေးတဲ့ test မျိုးကို property-based test လို့ ခေါ်ပါတယ်။
      [[mark:draw-note]] ဆိုလိုတာက test အားလုံး pass ဖြစ်နေတာဟာ ရေးထားတဲ့ စစ်ချက်တွေ မကျဘူး ဆိုတာကိုပဲ
      ပြောပြီး၊ အဲဒီ စစ်ချက်တွေ လုံလောက်လား ဆိုတာကိုတော့ မပြောပါဘူး။
    sources:
      - {
          title: "web.dev Learn Testing: Types of automated testing, code coverage",
          url: "https://web.dev/learn/testing/get-started/test-types#code-coverage",
        }
      - {
          title: "Stryker docs: what mutation testing is (facts C18)",
          url: "https://stryker-mutator.io/docs/",
        }
      - {
          title: "fast-check: What is Property-Based Testing? (facts C17)",
          url: "https://fast-check.dev/docs/introduction/what-is-property-based-testing/",
        }
      - { title: "Vitest: Coverage", url: "https://vitest.dev/guide/coverage" }
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-q1
        type: whiteboard.apply
        at: { mark: draw-q1 }
        upsertIds: [a-q1, a-t1]
        drawMs: 2500
      - id: draw-q2
        type: whiteboard.apply
        at: { mark: draw-q2 }
        upsertIds: [a-q2, a-t2]
        drawMs: 2500
      - id: draw-q3
        type: whiteboard.apply
        at: { mark: draw-q3 }
        upsertIds: [a-q3, a-t3]
        drawMs: 2500
      - id: draw-note
        type: whiteboard.apply
        at: { mark: draw-note }
        upsertIds: [a-note]
        drawMs: 1500

  - id: starter
    narration: >
      ဒီ မေးခွန်းတွေကို ဆိုင်ရဲ့ code နဲ့ စမ်းကြည့်ရအောင်။ ဆိုင်ရဲ့ loyalty card မှာ stamp ဆယ်ခု ပြည့်ရင်
      လက်ဖက်ရည် တစ်ခွက် အလကား ရပါတယ်။ assistant တစ်ခုက ဒီ စည်းကမ်းအတွက် function တစ်ခုနဲ့ test သုံးခုကို
      ရေးပေးထားတယ် ဆိုပါစို့။ [[mark:select-gt]] function က stamp အရေအတွက် ဆယ်ထက် များမှ true
      ပြန်ပေးပါတယ်။ [[mark:open-tests]] test ဖိုင်ကို ကြည့်ရအောင်။ [[mark:select-tests]] stamp မရှိရင်နဲ့
      ငါးခု ရှိရင် အလကား မရဘူး၊ ဆယ့်နှစ်ခု ရှိရင် ရတယ်လို့ ဥပမာ သုံးခုနဲ့ စစ်ထားပြီး၊ ကြည့်လိုက်ရင်
      လုံလောက်တယ်လို့ ထင်ရပါတယ်။ [[mark:open-discount]] ဒုတိယ ဖိုင်ကတော့ ဈေးနှုန်းကို ရာခိုင်နှုန်းနဲ့
      လျှော့ပေးတဲ့ discount ဖိုင်ပါ။ [[mark:select-formula]] ဈေးနှုန်းထဲကနေ ပေးထားတဲ့ ရာခိုင်နှုန်းကို လျှော့ပြီး၊
      ကျပ် ပြည့်အောင် round လုပ်ပေးပါတယ်။ [[mark:open-property]] သူ့ test ဖိုင်မှာတော့ property-based test
      ရေးဖို့ fast check ဆိုတဲ့ library ကို import လုပ်ထားပါတယ်။ [[mark:select-todo]] ဒါပေမဲ့ test အစစ်
      မရှိသေးဘဲ၊ လျှော့ပြီးတဲ့ ဈေးက ဘယ်တော့မှ သုညအောက် မရောက်ရဘူး ဆိုတဲ့ todo တစ်ကြောင်းပဲ ရှိပါသေးတယ်။
    sources:
      - {
          title: "Vitest: Testing in Practice, testing edge cases",
          url: "https://vitest.dev/guide/learn/testing-in-practice#testing-edge-cases",
        }
      - { title: "Vitest: test.todo", url: "https://vitest.dev/api/test#test-todo" }
      - {
          title: "fast-check: What is Property-Based Testing? (facts C17)",
          url: "https://fast-check.dev/docs/introduction/what-is-property-based-testing/",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: select-gt
        type: editor.select
        at: { mark: select-gt }
        target: { file: src/loyalty.js, text: "stamps > 10", occurrence: 1 }
      - id: open-tests
        type: workspace.openFile
        at: { mark: open-tests }
        path: src/loyalty.test.js
      - id: select-tests
        type: editor.select
        at: { mark: select-tests }
        target:
          {
            file: src/loyalty.test.js,
            text: "test(\"has no free tea at 0 stamps\", () => {\n  expect(freeTeaDue(0)).toBe(false);\n});\n\ntest(\"has no free tea at 5 stamps\", () => {\n  expect(freeTeaDue(5)).toBe(false);\n});\n\ntest(\"has a free tea due at 12 stamps\", () => {\n  expect(freeTeaDue(12)).toBe(true);\n});",
            occurrence: 1,
          }
      - id: open-discount
        type: workspace.openFile
        at: { mark: open-discount }
        path: src/discount.js
      - id: select-formula
        type: editor.select
        at: { mark: select-formula }
        target:
          { file: src/discount.js, text: "Math.round(price * (1 - percent / 100))", occurrence: 1 }
      - id: open-property
        type: workspace.openFile
        at: { mark: open-property }
        path: src/discount.property.test.js
      - id: select-todo
        type: editor.select
        at: { mark: select-todo }
        target:
          {
            file: src/discount.property.test.js,
            text: 'test.todo("a discount never goes below zero");',
            occurrence: 1,
          }

  - id: panel
    narration: >
      [[mark:ready]] ညာဘက်က panel ကလည်း ပြီးခဲ့တဲ့ lesson တွေလိုပဲ တကယ့် Vitest ရဲ့ ရလဒ်ပါ။ loyalty test
      သုံးခုလုံး pass ဖြစ်နေပြီး၊ todo ကိုတော့ လေးထောင့် အကွက်လေးနဲ့ ပြထားပါတယ်။ summary မှာလည်း သုံးခု
      pass နဲ့ todo တစ်ခုလို့ ပြနေပါတယ်။ [[mark:coverage-full]] coverage ဇယားနဲ့ စစ်ရင်လည်း loyalty ဖိုင်က ၁၀၀ ရာခိုင်နှုန်း
      ပြမှာပါ။ function ထဲက line တစ်ကြောင်းတည်းကို test တိုင်းက run လို့ပါ။ ဒါဆို ပထမ မေးခွန်းရဲ့ အဖြေက
      ဟုတ်ပါတယ်။ ဒုတိယ မေးခွန်းကို ဆက်ကြည့်ရအောင်။
    sources:
      - {
          title: "Vitest: Coverage (the 100 % figure measured with istanbul on this start state)",
          url: "https://vitest.dev/guide/coverage",
        }
      - { title: "Vitest: test.todo", url: "https://vitest.dev/api/test#test-todo" }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-start-pass
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1000 }
      - id: expect-start-three
        type: expect.preview
        at: { afterAction: expect-start-pass }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "3" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-todo
        type: expect.preview
        at: { afterAction: expect-start-three }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-todo, value: "1" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-todo-test
        type: expect.preview
        at: { afterAction: expect-start-todo }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-1 }
        attribute: { name: data-state, value: todo }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: mutation
    chapter: "Mutation testing"
    narration: >
      [[mark:board-mutant]] assistant ရေးထားတဲ့ စစ်ချက်ကို တမင် ပြောင်းကြည့်ရအောင်။ ဆယ်ထက် များမှ ဆိုတဲ့
      စစ်ချက်ကို၊ ဆယ်နဲ့ ညီရင်လည်း ရတယ် ဆိုတဲ့ စစ်ချက်နဲ့ လဲလိုက်ပါမယ်။ ဒီလို တမင် ပြောင်းထားတဲ့ code ကို
      mutant လို့ ခေါ်ပါတယ်။ [[mark:draw-rows]] test သုံးခုရဲ့ input တွေကို ထည့်ကြည့်ရင်၊ stamp မရှိတာနဲ့
      ငါးခုမှာ နှစ်ခုလုံး false ပြန်ပေးပြီး၊ ဆယ့်နှစ်ခုမှာတော့ နှစ်ခုလုံး true ပြန်ပေးပါတယ်။
      [[mark:draw-escaped]] ဆိုတော့ code ကို ပြောင်းလိုက်ပေမဲ့ test သုံးခုလုံး pass နေဦးမှာပါ။ ဒီလို mutant
      ကို ဘယ် test ကမှ မဖမ်းမိဘဲ လွတ်သွားတာဟာ၊ test တစ်ခု လိုနေတယ် ဆိုတဲ့ လက္ခဏာပါ။ [[mark:draw-ten]]
      အဖြေ ကွာတာက stamp ဆယ်ခု အတိအကျ ရှိတဲ့ နေရာ တစ်ခုတည်းပါ။ ဒီမှာ code နဲ့ mutant ထဲက တစ်ခုက
      မှားနေရမှာ ဖြစ်ပေမဲ့၊ test တွေက ဒီ နေရာကို မစစ်လို့ မသိနိုင်ပါဘူး။ ဒီလို boundary တွေမှာ mutant တွေ
      လွတ်သွားတတ်ပြီး၊ coverage ကလည်း ဒါကို မပြနိုင်ပါဘူး။
    sources:
      - {
          title: "Stryker docs: mutants, killed and survived (facts C18)",
          url: "https://stryker-mutator.io/docs/",
        }
      - {
          title: "Vitest: Testing in Practice, testing edge cases (the boundary scenario: tdd-ai-notes S8)",
          url: "https://vitest.dev/guide/learn/testing-in-practice#testing-edge-cases",
        }
    actions:
      - id: board-mutant
        type: whiteboard.apply
        at: { mark: board-mutant }
        open: true
        clear: true
        upsertIds: [b-title, b-h-code, b-h-mut]
        drawMs: 2000
      - id: draw-rows
        type: whiteboard.apply
        at: { mark: draw-rows }
        upsertIds:
          [b-tested-box, b-r0-l, b-r0-c, b-r0-m, b-r5-l, b-r5-c, b-r5-m, b-r12-l, b-r12-c, b-r12-m]
        drawMs: 4500
      - id: draw-escaped
        type: whiteboard.apply
        at: { mark: draw-escaped }
        upsertIds: [b-escaped]
        drawMs: 1500
      - id: draw-ten
        type: whiteboard.apply
        at: { mark: draw-ten }
        upsertIds: [b-r10-box, b-r10-l, b-r10-c, b-r10-m]
        drawMs: 2500

  - id: boundary
    narration: >
      ဒါကြောင့် အဲဒီ boundary ကို test နဲ့ စစ်ကြည့်ရအောင်။ [[mark:open-tests-2]] loyalty ရဲ့ test ဖိုင်မှာ၊
      ငါးခုနဲ့ ဆယ့်နှစ်ခု test တွေကြားမှာ stamp ဆယ်ခု အတိအကျ ရှိရင် အလကား ရရမယ် ဆိုတဲ့ test ကို
      ထည့်ပါမယ်။ ဖြစ်ရမယ့် true ကို code ကနေ မယူဘဲ၊ ဆိုင်ရဲ့ စည်းကမ်းကနေ
      ယူထားတာပါ။ [[mark:read-red]] panel ကို ကြည့်ပါ။ test အသစ်မှာ ကြက်ခြေခတ် ပေါ်လာပြီး၊ PASS ကလည်း
      အနီရောင် FAIL ဖြစ်သွားပါပြီ။ Failed Tests အပိုင်းမှာ true ဖြစ်ရမယ့် နေရာမှာ false ရနေတယ်လို့ ပြောနေပြီး၊
      Expected ကို အစိမ်းရောင်နဲ့၊ Received ကို အနီရောင်နဲ့ ပြထားပါတယ်။ [[mark:select-ten]] code frame ကလည်း
      test အသစ်ရဲ့ ဒီ စစ်ချက်ကို ညွှန်ပြနေပါတယ်။ ဆိုင်ရဲ့ စည်းကမ်းအရ မှားနေတာက code ဖြစ်ပြီး၊ assistant ရဲ့
      test သုံးခုက ဒီ နေရာကို တစ်ခါမှ မစစ်ခဲ့တာပါ။
    sources:
      - { title: "Vitest: expect, toBe", url: "https://vitest.dev/api/expect#tobe" }
      - {
          title: "Vitest: Testing in Practice, testing edge cases",
          url: "https://vitest.dev/guide/learn/testing-in-practice#testing-edge-cases",
        }
    actions:
      - id: close-mutant
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-tests-2
        type: workspace.openFile
        at: { mark: open-tests-2 }
        path: src/loyalty.test.js
      - id: type-boundary
        type: editor.type
        at: { afterAction: open-tests-2 }
        target:
          {
            file: src/loyalty.test.js,
            after: "  expect(freeTeaDue(5)).toBe(false);\n});\n",
            occurrence: 1,
          }
        text: "\ntest(\"has a free tea due at exactly 10 stamps\", () => {\n  expect(freeTeaDue(10)).toBe(true);\n});\n"
        # One block (pilot note 1): one write, one run, no half-typed Failed Suite.
        cadence: block
      - id: expect-red
        type: expect.preview
        at: { afterAction: type-boundary }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-red-count
        type: expect.preview
        at: { afterAction: expect-red }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-failed, value: "1" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-red-message
        type: expect.preview
        at: { afterAction: expect-red-count }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-message, value: "expected false to be true // Object.is equality" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-red-test
        type: expect.preview
        at: { afterAction: expect-red-message }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-4 }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-red-diff
        type: expect.preview
        at: { afterAction: expect-red-test }
        timeoutMs: 5000
        target: { by: testId, value: vt-diff-1 }
        textContains: "- true"
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-ten
        type: editor.select
        at: { mark: select-ten }
        target:
          { file: src/loyalty.test.js, text: "expect(freeTeaDue(10)).toBe(true);", occurrence: 1 }
      - id: expect-red-frame
        type: expect.preview
        at: { afterAction: select-ten }
        timeoutMs: 5000
        target: { by: testId, value: vt-frame-1 }
        attribute: { name: data-line, value: "13" }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: catch
    narration: >
      [[mark:open-loyalty-fix]] code ကို ပြင်ရအောင်။ [[mark:type-equals]] loyalty ဖိုင်ထဲက ဆယ်ထက် များမှ ဆိုတဲ့
      စစ်ချက်မှာ စာလုံး တစ်လုံး ထပ်ထည့်ပြီး၊ ဆယ်နဲ့ ညီရင်လည်း ရအောင် ပြင်ပါမယ်။ [[mark:read-green]] test
      လေးခုလုံး pass ဖြစ်ပြီး PASS ပြန်ဖြစ်သွားပါပြီ။ အခုဆိုရင် ဒီ စစ်ချက်ကို ဆယ်ထက် များမှ ဆိုတဲ့ ပုံစံ
      ပြန်ပြောင်းမိရင် ဆယ်ခု test က ကျမှာမို့၊ အဲဒီ mutant ကို ဖမ်းမိပါပြီ။ [[mark:stryker]] ဒီနေ့ mutant တစ်ခုကို ကိုယ်တိုင် စဉ်းစားခဲ့ပေမဲ့၊ StrykerJS လို tool တွေက
      mutant အများကြီးကို အလိုလို ထုတ်ပြီး test တွေကို ပြန် run ပေးလို့၊ လွတ်သွားတဲ့ mutant တွေကို
      တစ်ခါတည်း မြင်ရပါတယ်။ Vitest အတွက် runner လည်း ရှိပေမဲ့၊ ဒီ course မှာတော့ မ run ပါဘူး။
    sources:
      - {
          title: "Stryker docs: mutation testing (facts C18)",
          url: "https://stryker-mutator.io/docs/",
        }
      - {
          title: "StrykerJS: Vitest runner (facts C18; not run in this course)",
          url: "https://stryker-mutator.io/docs/stryker-js/vitest-runner/",
        }
    actions:
      - id: open-loyalty-fix
        type: workspace.openFile
        at: { mark: open-loyalty-fix }
        path: src/loyalty.js
      - id: type-equals
        type: editor.type
        at: { mark: type-equals }
        target: { file: src/loyalty.js, after: "return stamps >", occurrence: 1 }
        text: "="
      - id: expect-green
        type: expect.preview
        at: { afterAction: type-equals }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-green-count
        type: expect.preview
        at: { afterAction: expect-green }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "4" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-green-test
        type: expect.preview
        at: { afterAction: expect-green-count }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-4 }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: property
    chapter: "Property-based test"
    narration: >
      [[mark:open-property-2]] တတိယ မေးခွန်းကို discount ဖိုင်နဲ့ ကြည့်ရအောင်။ ဥပမာ test တွေက ၁၀
      ရာခိုင်နှုန်း၊ ၂၀ ရာခိုင်နှုန်းလို ကိုယ် တွေးမိတဲ့ input တွေကိုပဲ စစ်ပါတယ်။ property-based test မှာတော့
      input တိုင်းအတွက် မှန်ရမယ့် စည်းကမ်းကို ရေးပြီး၊ ဒီ စည်းကမ်းကို property လို့ ခေါ်ပါတယ်။
      [[mark:type-property]] todo ရဲ့ နေရာမှာ test အစစ်ကို ထည့်ပြီး၊ todo line ကိုတော့ comment လုပ်ပြီး
      ပြီးသွားကြောင်း မှတ်ထားပါမယ်။ [[mark:select-prices]] ပထမ နှစ်ကြောင်းက input တွေကို ထုတ်ပေးပါတယ်။
      ဈေးနှုန်းက သုညကနေ ၅၀၀၀ ကျပ်အထိ၊ ရာခိုင်နှုန်းက သုညကနေ ၂၀၀ အထိ ကိန်းပြည့် ဘာမဆို ဖြစ်နိုင်ပါတယ်။
      ၁၀၀ ထက် ကျော်တာကိုပါ ထည့်ထားတာက၊ ဝန်ထမ်းက ၁၂ အစား ၁၂၀ လို့ မှားရိုက်မိတာမျိုး ဖြစ်နိုင်လို့ပါ။
      [[mark:select-rule]] ဒီ အပိုင်းက စည်းကမ်းပါ။ ဘယ် input ဖြစ်ဖြစ် လျှော့ပြီးတဲ့ ဈေးက သုညထက်
      မငယ်ရဘူးလို့ စစ်ထားပါတယ်။ [[mark:select-assert]] နောက်ဆုံး line က fast check ကို ဒီ စည်းကမ်းနဲ့
      စမ်းခိုင်းတာ ဖြစ်ပြီး၊ default အားဖြင့် input အကြိမ် ၁၀၀ ထုတ်ပါတယ်။ seed ဆိုတာ ကျပန်း ဂဏန်းတွေရဲ့
      အစ တန်ဖိုး ဖြစ်ပြီး၊ ပုံသေ ထားလိုက်တော့ run တိုင်း input တွေ အတူတူ ထွက်ပါတယ်။
    sources:
      - {
          title: "Vitest: Testing in Practice, property-based testing",
          url: "https://vitest.dev/guide/learn/testing-in-practice#property-based-testing",
        }
      - {
          title: "fast-check: What is Property-Based Testing? (facts C17; capture 43: an unpinned seed changes every run)",
          url: "https://fast-check.dev/docs/introduction/what-is-property-based-testing/",
        }
    actions:
      - id: open-property-2
        type: workspace.openFile
        at: { mark: open-property-2 }
        path: src/discount.property.test.js
      - id: type-property
        type: editor.type
        at: { mark: type-property }
        target:
          {
            file: src/discount.property.test.js,
            after: "import { applyPercent } from \"./discount.js\";\n\n",
            occurrence: 1,
          }
        text: "test(\"a discount never goes below zero\", () => {\n  const prices = fc.integer({ min: 0, max: 5000 });\n  const percents = fc.integer({ min: 0, max: 200 });\n  const rule = fc.property(prices, percents, (price, percent) => {\n    const paid = applyPercent(price, percent);\n    expect(paid).toBeGreaterThanOrEqual(0);\n  });\n  fc.assert(rule, { seed: 2026 });\n});\n// "
        # One block at the todo line's first character: the new test lands above it and the todo
        # becomes a comment under it, in one write (COURSE-KIT §5, the one-insert line replacement).
        cadence: block
      - id: expect-prop-red
        type: expect.preview
        at: { afterAction: type-property }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-prop-count
        type: expect.preview
        at: { afterAction: expect-prop-red }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-failed, value: "1" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-prop-test
        type: expect.preview
        at: { afterAction: expect-prop-count }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-1 }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-prices
        type: editor.select
        at: { mark: select-prices }
        target:
          {
            file: src/discount.property.test.js,
            text: "const prices = fc.integer({ min: 0, max: 5000 });\n  const percents = fc.integer({ min: 0, max: 200 });",
            occurrence: 1,
          }
      - id: select-rule
        type: editor.select
        at: { mark: select-rule }
        target:
          {
            file: src/discount.property.test.js,
            text: "const paid = applyPercent(price, percent);\n    expect(paid).toBeGreaterThanOrEqual(0);",
            occurrence: 1,
          }
      - id: select-assert
        type: editor.select
        at: { mark: select-assert }
        target:
          {
            file: src/discount.property.test.js,
            text: "fc.assert(rule, { seed: 2026 });",
            occurrence: 1,
          }

  - id: counterexample
    narration: >
      [[mark:read-prop-red]] ကဲ၊ panel ကို ကြည့်ပါ။ property test က ကျနေပြီး၊ Failed Tests အပိုင်းမှာ fast check
      ရဲ့ message ပေါ်နေပါတယ်။ စမ်းတဲ့ သုံးကြိမ်မြောက် input မှာ စည်းကမ်း ပျက်သွားတယ်လို့ ပြောပြီး၊ ဒီ
      အမှားကို ပြန် run ကြည့်နိုင်အောင် seed ၂၀၂၆ ကိုလည်း ပြထားပါတယ်။ [[mark:read-counter]] အရေးအကြီးဆုံးကတော့ Counterexample
      အပိုင်းပါ။ counterexample ဆိုတာ စည်းကမ်းကို ချိုးဖောက်တဲ့ ဥပမာ ဖြစ်ပြီး၊ ဈေးနှုန်း ၂ ကျပ်နဲ့ ၁၂၆
      ရာခိုင်နှုန်းလို့ ပြနေပါတယ်။ [[mark:read-shrunk]] သူ့အောက်က Shrunk ၁၃ ကြိမ် ဆိုတာကတော့၊ fast check က
      ပထမ တွေ့တဲ့ ဥပမာကို ၁၃ ခါ shrink လုပ်ပြီး ဒီလောက် ရိုးရှင်းတဲ့ ဥပမာအထိ ချုံ့ထားတာပါ။ ကျပန်း
      ဂဏန်းကြီးတွေထက် ဒီလို ဥပမာ သေးသေးလေးက ဘာ မှားလဲ ဆိုတာကို ပိုမြန်မြန် ပြပါတယ်။
    sources:
      - {
          title: "fast-check: What is Property-Based Testing? (facts C17; this property and seed checked with sim, review check d)",
          url: "https://fast-check.dev/docs/introduction/what-is-property-based-testing/",
        }
    actions:
      - id: expect-prop-failed-after
        type: expect.preview
        at: { mark: read-prop-red }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        textContains: "Property failed after 3 tests"
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-prop-counter
        type: expect.preview
        at: { mark: read-counter }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        textContains: "Counterexample: [2,126]"
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-prop-shrunk
        type: expect.preview
        at: { mark: read-shrunk }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        textContains: "Shrunk 13 time(s)"
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: cap
    narration: >
      [[mark:open-discount-2]] ဒီ ဥပမာကို ကိုယ်တိုင် တွက်ကြည့်ရအောင်။ [[mark:select-formula-2]] ၂ ကျပ်ကို ၁၂၆
      ရာခိုင်နှုန်း လျှော့ရင် လျှော့ငွေက ၂ ကျပ်ထက် များသွားလို့ ဈေးက သုညအောက် ရောက်ပြီး၊ round
      လုပ်လိုက်တော့ အနုတ် ၁ ကျပ် ဖြစ်သွားပါတယ်။ ဆိုင်က customer ကို ပိုက်ဆံ ပြန်ပေးရမယ့် ဈေးပါ။
      [[mark:decide]] ဒါဆို ဘယ်လို ပြင်မလဲ ဆိုတာကို code ကနေ မဟုတ်ဘဲ ဆိုင်ရဲ့ စည်းကမ်းကနေ ဆုံးဖြတ်ရပါမယ်။
      လျှော့ဈေးက ဈေးနှုန်း တစ်ခုလုံးထက် ပိုမလျှော့ရလို့၊ ၁၀၀ ရာခိုင်နှုန်းထက် ကျော်ရင် သုည ကျပ်
      ဖြစ်ရပါမယ်။ [[mark:type-cap]] function ရဲ့ ထိပ်ဆုံးမှာ ရာခိုင်နှုန်းက ၁၀၀ ထက် ကျော်ရင် သုည ပြန်ပေးတဲ့ line
      တစ်ကြောင်း ထည့်ပါမယ်။ [[mark:read-cap-green]] ဒီတစ်ခါ fast check က အကြိမ် ၁၀၀ စမ်းပြီး
      ချိုးဖောက်တဲ့ ဥပမာ မတွေ့တော့လို့၊ test ငါးခုလုံး pass ဖြစ်သွားပါပြီ။ ဒါက input အားလုံးကို သက်သေပြတာ
      မဟုတ်ပေမဲ့၊ ကိုယ် တွေးမိမယ့် ဥပမာတွေထက် အများကြီး ပိုစစ်ပေးတာပါ။
    sources:
      - {
          title: "fast-check: What is Property-Based Testing? (facts C17)",
          url: "https://fast-check.dev/docs/introduction/what-is-property-based-testing/",
        }
      - {
          title: "Vitest: Testing in Practice, property-based testing",
          url: "https://vitest.dev/guide/learn/testing-in-practice#property-based-testing",
        }
    actions:
      - id: open-discount-2
        type: workspace.openFile
        at: { mark: open-discount-2 }
        path: src/discount.js
      - id: select-formula-2
        type: editor.select
        at: { mark: select-formula-2 }
        target: { file: src/discount.js, text: "price * (1 - percent / 100)", occurrence: 1 }
      - id: type-cap
        type: editor.type
        at: { mark: type-cap }
        target:
          {
            file: src/discount.js,
            after: "export function applyPercent(price, percent) {\n",
            occurrence: 1,
          }
        text: "  if (percent > 100) return 0;\n"
        # Brisker keystrokes (4.5-5.2 s) so the typing fits its dialog; natural took 7.9 s in verify.
        cadence: fast-explainer
      - id: expect-cap-green
        type: expect.preview
        at: { afterAction: type-cap }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-cap-count
        type: expect.preview
        at: { afterAction: expect-cap-green }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "5" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-loyalty-file
        type: expect.file
        at: { afterAction: expect-cap-count }
        path: src/loyalty.js
        contains: "return stamps >= 10;"
      - id: expect-boundary-file
        type: expect.file
        at: { afterAction: expect-loyalty-file }
        path: src/loyalty.test.js
        contains: "test(\"has a free tea due at exactly 10 stamps\", () => {\n  expect(freeTeaDue(10)).toBe(true);\n});"
      - id: expect-property-file
        type: expect.file
        at: { afterAction: expect-boundary-file }
        path: src/discount.property.test.js
        contains: "  fc.assert(rule, { seed: 2026 });\n});\n// test.todo(\"a discount never goes below zero\");"
      - id: expect-discount-file
        type: expect.file
        at: { afterAction: expect-property-file }
        path: src/discount.js
        contains: "  if (percent > 100) return 0;\n  return Math.round(price * (1 - percent / 100));"

  - id: checklist
    chapter: "AI ရေးတဲ့ test ကို review လုပ်ရင်"
    narration: >
      [[mark:board-checklist]] ဒီနေ့ loyalty test တွေကို assistant က ရေးခဲ့တာပါ။ ၂၀၂၆ ခုနှစ် Stack Overflow
      survey မှာ AI သုံးတဲ့ အလုပ်တွေထဲက test ရေးတာနဲ့ ပြင်တာကို ၅၈ ရာခိုင်နှုန်းကျော်က ရွေးထားကြပြီး၊ ဒါက
      ဖြေဆိုသူတွေ ကိုယ်တိုင် ပြောထားတာပါ။ ဒါကြောင့် AI ရေးတဲ့ test ကို draft လို့ သဘောထားပြီး၊ commit
      မလုပ်ခင် ဒီ လေးချက်ကို စစ်ပါ။ [[mark:draw-c1]] ပထမ၊ test က
      တစ်ခုခုကို တကယ် စစ်လား ဆိုတာပါ။ တန်ဖိုး ရှိလား ဆိုတာလောက်ပဲ စစ်တဲ့ test က ဘာ ရရ pass
      ဖြစ်ပါတယ်။ [[mark:draw-c2]] ဒုတိယ၊ အလုပ်လုပ်ပုံကို စစ်လား ဆိုတာပါ။ AI က mock တွေ များများ သုံးပြီး
      အတွင်းပိုင်းကို စစ်တတ်လို့၊ အဲဒီ test တွေက refactor လုပ်တိုင်း ကျပါတယ်။ [[mark:draw-c3]] တတိယ၊
      edge case နဲ့ boundary တွေ ပါလား ဆိုတာပါ။ ဒီနေ့ stamp test တွေလိုပဲ AI က ပုံမှန် input တွေကိုပဲ
      စစ်ပြီး အစွန်းတွေကို ကျော်သွားတတ်ပါတယ်။ [[mark:draw-c4]] စတုတ္ထ၊ test တွေကို တကယ် run
      ကြည့်ပြီးပြီလား ဆိုတာပါ။ import မှားတာမျိုး ဖြစ်နိုင်လို့ vitest run နဲ့ run ကြည့်ပါ။ [[mark:draw-c5]] သတိထားရမှာက skip လုပ်ထားတဲ့ test တွေ၊ အားနည်းတဲ့ စစ်ချက်တွေ၊ code
      ကနေ ကူးထားတဲ့ expected တန်ဖိုးတွေကို Vitest က မဖမ်းနိုင်ဘဲ၊ run က အစိမ်းရောင်ပဲ ပြနေမှာပါ။ ဒါတွေကို
      လူက review လုပ်ပြီး ဒီနေ့ နည်းတွေနဲ့ စစ်ရပါတယ်။
    sources:
      - {
          title: "Vitest: Writing Tests with AI, reviewing AI-generated tests (facts D17; what only review catches, D19)",
          url: "https://vitest.dev/guide/learn/writing-tests-with-ai#reviewing-ai-generated-tests",
        }
      - {
          title: "Stack Overflow Developer Survey 2026: AI, 58.1 % use AI to write or improve tests (facts D12)",
          url: "https://survey.stackoverflow.co/2026/ai",
        }
    actions:
      - id: board-checklist
        type: whiteboard.apply
        at: { mark: board-checklist }
        open: true
        clear: true
        upsertIds: [c-title, c-stat]
        drawMs: 2500
      - id: draw-c1
        type: whiteboard.apply
        at: { mark: draw-c1 }
        upsertIds: [c-1]
        drawMs: 1200
      - id: draw-c2
        type: whiteboard.apply
        at: { mark: draw-c2 }
        upsertIds: [c-2]
        drawMs: 1200
      - id: draw-c3
        type: whiteboard.apply
        at: { mark: draw-c3 }
        upsertIds: [c-3]
        drawMs: 1200
      - id: draw-c4
        type: whiteboard.apply
        at: { mark: draw-c4 }
        upsertIds: [c-4]
        drawMs: 1200
      - id: draw-c5
        type: whiteboard.apply
        at: { mark: draw-c5 }
        upsertIds: [c-5a, c-5b]
        drawMs: 2000

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ test တွေ pass ဖြစ်တာနဲ့ test ကောင်းတာက မတူပါဘူး။ coverage က code run သွားလား
      ပြပြီး၊ code မှားရင် test က သိမလား ဆိုတာကိုတော့ mutation testing နဲ့ မေးရပါတယ်။ mutant တွေ
      လွတ်တတ်တဲ့ boundary တွေကိုလည်း test ထဲ ထည့်ပါ။ [[mark:recap-property]] property-based test ကတော့
      စည်းကမ်း တစ်ခုကို input အများကြီးနဲ့ စစ်ပြီး၊ ချိုးဖောက်တဲ့ ဥပမာကို ရိုးရှင်းအောင် ချုံ့ပြီး
      ပြပေးပါတယ်။ နောက် lesson က ဒီ
      course ရဲ့ နောက်ဆုံး lesson ဖြစ်ပြီး၊ testing ရဲ့ ရည်ရွယ်ချက်နဲ့ course တစ်ခုလုံးကို ပြန်ချုပ်ကြည့်ပါမယ်။
    sources:
      - {
          title: "web.dev Learn Testing: Types of automated testing, code coverage",
          url: "https://web.dev/learn/testing/get-started/test-types#code-coverage",
        }
      - {
          title: "Vitest: Testing in Practice",
          url: "https://vitest.dev/guide/learn/testing-in-practice",
        }
    actions:
      - id: close-checklist
        type: whiteboard.apply
        at: { scene: start }
        open: false
checks:
  - { type: timing.p95Ms, max: 300 }
