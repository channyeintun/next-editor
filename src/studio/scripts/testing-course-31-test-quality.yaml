          },
          "devDependencies": {
            "fast-check": "4.10.2",
            "vite": "7.3.7",
            "vitest": "5.1.0"
          }
        }
      src/discount.js: |
        // Takes `percent` per cent off `price`, in whole Kyat.
        export function applyPercent(price, percent) {
          return Math.round(price * (1 - percent / 100));
        }
      src/discount.property.test.js: |
        import fc from "fast-check";
        import { expect, test } from "vitest";
        import { applyPercent } from "./discount.js";

        test.todo("a discount never goes below zero");
      src/loyalty.js: |
        // Suppose an AI assistant wrote this function
        // and the three tests in loyalty.test.js.
        export function freeTeaDue(stamps) {
          return stamps > 10;
        }
      src/loyalty.test.js: |
        import { expect, test } from "vitest";
        import { freeTeaDue } from "./loyalty.js";

        test("has no free tea at 0 stamps", () => {
          expect(freeTeaDue(0)).toBe(false);
        });

        test("has no free tea at 5 stamps", () => {
          expect(freeTeaDue(5)).toBe(false);
        });

        test("has a free tea due at 12 stamps", () => {
          expect(freeTeaDue(12)).toBe(true);
        });
