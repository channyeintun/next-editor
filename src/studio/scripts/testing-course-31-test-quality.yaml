          } catch (error) {
            if (mountedVersion === state.version) fresh.replaceChildren(el("div", { style: "padding:8px 14px;color:#b42318;font:13px ui-monospace,monospace" }, `${error?.name ?? "Error"}: ${error?.message ?? error}`));
