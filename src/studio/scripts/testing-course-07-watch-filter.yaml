        text: "npm test → စက္ကန့်ပိုင်း၊ browser၊ network မလို",
        strokeColor: "#f08c00",
        fontSize: 28,
      }
build:
  # Studio replaces this built-in profile at render time with the Burmese provider chosen in the
  # render console (AthanLab with the user's own key, or VoxCPM2 when that feature is enabled).
  voiceProfile: pocket-alba-v1
  seed: 5107
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: open
    chapter: "Watch mode က ဘာ လုပ်ပေးလဲ"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ before Each လို hook တွေနဲ့ test တစ်ခုက နောက် test တစ်ခုကို
      မထိခိုက်အောင် ခွဲထားခဲ့ပါတယ်။ ဒီ lesson မှာတော့ code ရေးနေတုန်း Vitest ကို ဘယ်လို ဖွင့်ထားရလဲ၊
      ကိုယ် လိုချင်တဲ့ test တွေကိုပဲ ဘယ်လို ရွေး run ရလဲ ဆိုတာ ကြည့်ပါမယ်။ [[mark:draw-terminal]]
      Vitest နဲ့ ပထမဆုံး test ရေးခဲ့တဲ့ lesson မှာ ပြောခဲ့သလို၊ ကိုယ့် ကွန်ပျူတာရဲ့ terminal မှာ vitest ကို
      run လိုက်ရင် test တွေ ပြီးတာနဲ့ ထွက်မသွားဘဲ ဖိုင် ပြောင်းတာကို စောင့်နေပါတယ်။ ဒါက watch mode ဖြစ်ပြီး၊
      အပေါ်ဆုံးမှာ DEV လို့ ပြပါတယ်။ တစ်ခါပဲ run တဲ့ vitest run ဆိုရင်တော့ အဲဒီ နေရာမှာ RUN လို့
      ပြပါတယ်။ [[mark:draw-rerun]] ဖိုင် တစ်ဖိုင်ကို ပြင်လိုက်ရင် Vitest က test အားလုံးကို ပြန် run တာ
      မဟုတ်ပါဘူး။ test ဖိုင်ကို ပြင်ရင် အဲဒီ ဖိုင်ကိုပဲ run ပြီး၊ menu ဖိုင်လို code ဖိုင်ကို
      ပြင်ရင်တော့ အဲဒီ ဖိုင်ကို တိုက်ရိုက်ဖြစ်ဖြစ်၊ တစ်ဆင့်ဖြစ်ဖြစ် သုံးနေတဲ့ test ဖိုင်တွေကိုပဲ ပြန် run
      ပါတယ်။ ဒါကြောင့် test တွေ များလာလည်း အဖြေကို မြန်မြန် ရပါတယ်။ [[mark:draw-keys]] watch mode
      နဲ့ run နေတုန်း h key ကို နှိပ်ရင် သုံးလို့ရတဲ့ key တွေကို ပြပါတယ်။ a key က test အားလုံးကို၊ f
      key က ကျနေတဲ့ test တွေကိုပဲ ပြန် run ပြီး၊ p key နဲ့ t key က ဖိုင်နာမည်၊ test နာမည်နဲ့ ရွေးခိုင်းတာပါ။
      u နဲ့ i key က နောက်ပိုင်း lesson မှာ လေ့လာမယ့် snapshot အတွက် ဖြစ်ပြီး၊ i key က Vitest ၅ ဒသမ ၁
      မှာ အသစ် ပါလာတာပါ။ q key နဲ့တော့ ထွက်ပါတယ်။ [[mark:keep-open]] code ရေးနေတုန်း ဒီ watch mode ကို
      terminal window တစ်ခုမှာ ဖွင့်ထားခဲ့ရင်၊ ပြင်လိုက်တိုင်း မှန်နေသေးလား ဆိုတာကို ချက်ချင်း
      သိရပါတယ်။
    sources:
      - {
          title: "web.dev Learn Testing: Where tests run, manual test invocation",
          url: "https://web.dev/learn/testing/get-started/where-tests-run#manual_test_invocation",
        }
      - { title: "Vitest: watch (facts A03, B08)", url: "https://vitest.dev/config/watch" }
      - {
          title: "Vitest: Command Line Interface, vitest and vitest run",
          url: "https://vitest.dev/guide/cli",
        }
      - {
          title: "Vitest 5.1 announcement: interactive snapshot review, the i key (facts A29)",
          url: "https://vitest.dev/blog/vitest-5-1",
        }
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-terminal
        type: whiteboard.apply
        at: { mark: draw-terminal }
        upsertIds: [a-term-box, a-term-1, a-term-2, a-term-3]
        drawMs: 3000
      - id: draw-rerun
        type: whiteboard.apply
        at: { mark: draw-rerun }
        upsertIds: [a-rule-1, a-rule-2]
        drawMs: 3000
      - id: draw-keys
        type: whiteboard.apply
        at: { mark: draw-keys }
        upsertIds: [a-key-h, a-key-a, a-key-f, a-key-p, a-key-t, a-key-u, a-key-i, a-key-q]
        drawMs: 5000

  - id: starter
    narration: >
      ဆိုင်ရဲ့ test ဖိုင်တွေကို ဖွင့်ကြည့်ရအောင်။ [[mark:open-order-test]] ဒါက order ဖိုင်အတွက် test
      ဖိုင်ပါ။ [[mark:select-describe]] အော်ဒါ line တစ်ကြောင်းရဲ့ ဈေးကို တွက်တဲ့ function အတွက် test
      ငါးခုကို describe တစ်ခုထဲမှာ စုထားပါတယ်။ [[mark:select-only]] တတိယ test ကို ကြည့်ပါ။ test
      နောက်မှာ only ဆိုတာ ကပ်ပါနေပါတယ်။ မောင်မောင်က သကြားခ test ကို ပြင်နေတုန်း ထည့်ထားပြီး၊
      ပြန်ဖြုတ်ဖို့ မေ့ပြီး commit လုပ်သွားတယ် ဆိုပါစို့။ [[mark:select-pizza]] နောက်ဆုံး test ကတော့ menu
      မှာ မရှိတဲ့ pizza ကို ဈေး တွက်ခိုင်းရင်၊ menu မှာ မရှိဘူး ဆိုတဲ့ error ကို throw လုပ်ရမယ်လို့
      စစ်ထားပါတယ်။ [[mark:open-receipt]] ဘောင်ချာ ဖိုင်အတွက် test ဖိုင်မှာတော့ ဈေးနှုန်းကို ကော်မာ ခံပြီး
      ပြတာနဲ့ စုစုပေါင်းကို စစ်တဲ့ test နှစ်ခု ပါပါတယ်။
    sources:
      - {
          title: "Vitest: Writing Tests, skipping and focusing tests",
          url: "https://vitest.dev/guide/learn/writing-tests#skipping-and-focusing-tests",
        }
      - { title: "Vitest: test.only", url: "https://vitest.dev/api/test#test-only" }
      - {
          title: "Vitest: expect, toThrow (facts A19)",
          url: "https://vitest.dev/api/expect#tothrow",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-order-test
        type: workspace.openFile
        at: { mark: open-order-test }
        path: src/order.test.js
      - id: select-describe
        type: editor.select
        at: { mark: select-describe }
        target: { file: src/order.test.js, text: 'describe("lineTotal", () => {', occurrence: 1 }
      - id: select-only
        type: editor.select
        at: { mark: select-only }
        target: { file: src/order.test.js, text: "test.only", occurrence: 1 }
      - id: select-pizza
        type: editor.select
        at: { mark: select-pizza }
        target:
          {
            file: src/order.test.js,
            text: "const call = () => lineTotal({ id: \"pizza\" });\n    expect(call).toThrow(\"not on the menu\");",
            occurrence: 1,
          }
      - id: open-receipt
        type: workspace.openFile
        at: { mark: open-receipt }
        path: src/receipt.test.js

  - id: panel
    narration: >
      [[mark:ready]] Vitest က ဒီ ဖိုင်တွေကို run လိုက်တော့ ဘာ ပြလဲ ကြည့်ရအောင်။ ညာဘက်က panel ကလည်း ဒီ
      lesson ထဲမှာ watch mode နဲ့ run နေတဲ့ တကယ့် Vitest ရဲ့ ရလဒ်ကို ပြတာပါ။ key တွေကိုတော့ ကိုယ့် terminal
      မှာပဲ နှိပ်လို့ ရပါတယ်။ [[mark:read-pass]] အပေါ်က အစိမ်းရောင် PASS ကို ကြည့်ရင် အဆင်ပြေနေသလိုပါပဲ။
      ဒါပေမဲ့ order test ဖိုင် နာမည်ရဲ့ နောက်က ကွင်းထဲမှာ၊ test ငါးခုထဲက လေးခု skipped လို့ ပြနေပါတယ်။
      အောက်ကို ညွှန်တဲ့ မြှားလေးတွေနဲ့ ပြထားတာက run မသွားဘဲ ကျော်သွားတဲ့ test တွေပါ။
      [[mark:read-receipt]] ဘောင်ချာ test ဖိုင်ကတော့ နှစ်ခုလုံး run ပြီး pass ဖြစ်နေလို့၊ only က သူ
      ရှိတဲ့ ဖိုင်ကိုပဲ ကန့်သတ်တာ ဖြစ်ပါတယ်။ summary မှာလည်း ၃ ခု pass နဲ့ ၄ ခု skipped လို့ ပြနေပါတယ်။
    sources:
      - {
          title: "Vitest: Test Filtering, focusing on specific tests with .only",
          url: "https://vitest.dev/guide/filtering#focusing-on-specific-tests-with-only",
        }
      - {
          title: "Vitest: Writing Tests, reading test output",
          url: "https://vitest.dev/guide/learn/writing-tests#reading-test-output",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-start-pass
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1000 }
      - id: expect-start-skipped
        type: expect.preview
        at: { afterAction: expect-start-pass }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-skipped, value: "4" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-file
        type: expect.preview
        at: { afterAction: expect-start-skipped }
        timeoutMs: 5000
        target: { by: testId, value: vt-file-1 }
        textContains: "(5 tests | 4 skipped)"
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-hidden
        type: expect.preview
        at: { afterAction: expect-start-file }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-5 }
        attribute: { name: data-state, value: skip }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-receipt
        type: expect.preview
        at: { afterAction: expect-start-hidden }
        timeoutMs: 5000
        target: { by: testId, value: vt-file-2 }
        textContains: "src/receipt.test.js (2 tests)"
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-passed
        type: expect.preview
        at: { afterAction: expect-start-receipt }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "3" }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: only
    chapter: "Only ကို ဘယ်အချိန် သုံးမလဲ"
    narration: >
      only က test တစ်ခုကို အာရုံစိုက်ပြီး ပြင်နေတဲ့အခါ အသုံးဝင်ပါတယ်။ ဖိုင်ထဲက တခြား test တွေကို မ run
      ဘဲ အဲဒီ test ကိုပဲ run လို့ ရလဒ်က တိုပြီး ရှင်းပါတယ်။ ဒါပေမဲ့ ပြီးရင် ပြန်ဖြုတ်ရပါမယ်။ commit
      လုပ်သွားမိရင်၊ အဖွဲ့ထဲက လူတိုင်းရဲ့ ကွန်ပျူတာမှာ ခုနကလိုပဲ test တွေကို ဘာမှ မပြောဘဲ
      ကျော်သွားပါလိမ့်မယ်။ [[mark:only-ci]] code ပြောင်းတိုင်း server ပေါ်မှာ test တွေကို အလိုလို run
      ပေးတဲ့ CI မှာတော့၊ Vitest က only ကို တွေ့တာနဲ့ run ကို fail ဖြစ်စေပါတယ်။ ဒါကို CI lesson မှာ
      ပြန်ကြည့်ပါမယ်။ [[mark:open-order-again]] ဒါဆို only ကို ဖြုတ်ကြည့်ရအောင်။ [[mark:type-unonly]]
      only မပါတဲ့ line အသစ်ကို အပေါ်မှာ ရေးပြီး၊ line အဟောင်းကိုတော့ comment လုပ်ထားပါမယ်။ ကိုယ့်
      project မှာဆိုရင်တော့ only ဆိုတဲ့ စကားလုံးကို ဖျက်လိုက်ရုံပါပဲ။ မောင်မောင်ရဲ့ သကြားခ test ကတော့
      only မပါတဲ့ ပုံမှန် test တစ်ခု အဖြစ် ဆက်ရှိနေပါမယ်။ [[mark:read-red]] test ဖိုင်
      ပြောင်းသွားလို့ Vitest က ဒီ ဖိုင်ကို ပြန် run ပါတယ်။ panel ကို ကြည့်ပါ။ ခုနက ကျော်သွားခဲ့တဲ့
      နောက်ဆုံး test မှာ ကြက်ခြေခတ် ပေါ်လာပြီး၊ PASS ကလည်း အနီရောင် FAIL ဖြစ်သွားပါပြီ။ summary မှာ ၁
      ခု fail နဲ့ ၆ ခု pass လို့ ပြနေပါတယ်။ only ကြောင့် ဒီ ကျနေတဲ့ test ကို ခုနက မမြင်ရတာပါ။
    sources:
      - {
          title: "web.dev Learn Testing: Where tests run, only tests",
          url: "https://web.dev/learn/testing/get-started/where-tests-run#manual_test_invocation",
        }
      - {
          title: "Vitest: Test Filtering, remove .only before committing (facts A13)",
          url: "https://vitest.dev/guide/filtering#focusing-on-specific-tests-with-only",
        }
      - { title: "Vitest: test.only", url: "https://vitest.dev/api/test#test-only" }
    actions:
      - id: open-order-again
        type: workspace.openFile
        at: { mark: open-order-again }
        path: src/order.test.js
      - id: type-unonly
        type: editor.type
        at: { mark: type-unonly }
        target: { file: src/order.test.js, after: "toBe(3000);\n  });\n\n  ", occurrence: 1 }
        # One insert at the first character of the test.only( line: the plain opening line, a newline,
        # the indentation and "// ", so the old line becomes a comment and every state parses
        # (COURSE-KIT §5, research/review-checks/f).
        text: "test(\"adds the sugar fee\", () => {\n  // "
      - id: expect-red
        type: expect.preview
        at: { afterAction: type-unonly }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-red-count
        type: expect.preview
        at: { afterAction: expect-red }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-failed, value: "1" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-red-passed
        type: expect.preview
        at: { afterAction: expect-red-count }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "6" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-red-test
        type: expect.preview
        at: { afterAction: expect-red-passed }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-5 }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: hidden-failure
    narration: >
      [[mark:read-message]] summary ရဲ့ အောက်က Failed Tests အပိုင်းကို ဖတ်ကြည့်ရအောင်။ ဒီ test က menu
      မှာ မရှိဘူး ဆိုတဲ့ error ကို မျှော်လင့်ထားပေမဲ့၊ တခြား error တစ်ခု ထွက်လာတယ်လို့ ပြောနေပါတယ်။ Expected
      မှာ ကိုယ် မျှော်လင့်ထားတဲ့ စာကို ပြထားပြီး၊ Received မှာတော့ undefined ရဲ့ price ကို ဖတ်လို့ မရဘူး
      ဆိုတဲ့ JavaScript ကိုယ်တိုင်ရဲ့ error ကို ပြနေပါတယ်။ [[mark:select-tothrow]] code frame ကလည်း to
      Throw နဲ့ စစ်တဲ့ ဒီ line ကို ညွှန်ပြနေပါတယ်။ ဆိုလိုတာက ဆိုင်ရဲ့ code က ရည်ရွယ်ပြီး error throw
      လုပ်တာ မဟုတ်ဘဲ၊ menu မှာ မရှိတဲ့ ပစ္စည်းကို ဖတ်ရင်း ပျက်သွားတာပါ။ [[mark:decide]] menu မှာ မရှိတဲ့
      ပစ္စည်းကို မှာရင် ဘာ မှားလဲ ရှင်းရှင်း ပြောပြတဲ့ error ကို ဆိုင်က လိုချင်တာ ဖြစ်လို့၊ test က မှန်ပါတယ်။
      ပြင်ရမှာက code ပါ။
    sources:
      - {
          title: "Vitest: expect, toThrow (a string is a substring of the message, facts A19)",
          url: "https://vitest.dev/api/expect#tothrow",
        }
      - {
          title: "Vitest: Writing Tests, reading test output",
          url: "https://vitest.dev/guide/learn/writing-tests#reading-test-output",
        }
    actions:
      - id: expect-red-expected
        type: expect.preview
        at: { mark: read-message }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-expected, value: "not on the menu" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-red-actual
        type: expect.preview
        at: { afterAction: expect-red-expected }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute:
          { name: data-actual, value: "Cannot read properties of undefined (reading 'price')" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-red-message
        type: expect.preview
        at: { afterAction: expect-red-actual }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        textContains: "to throw error including 'not on the menu' but got"
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-tothrow
        type: editor.select
        at: { mark: select-tothrow }
        target: { file: src/order.test.js, text: 'toThrow("not on the menu")', occurrence: 1 }
      - id: expect-red-frame
        type: expect.preview
        at: { afterAction: select-tothrow }
        timeoutMs: 5000
        target: { by: testId, value: vt-frame-1 }
        attribute: { name: data-line, value: "24" }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: fix
    narration: >
      [[mark:open-menu]] code ဘက်ကို ကြည့်ရအောင်။ ဒါက ဆိုင်ရဲ့ menu ဖိုင်ပါ။ [[mark:select-return]]
      ဈေးနှုန်း ရှာပေးတဲ့ function က menu ထဲမှာ ပစ္စည်းကို ရှာပြီး သူ့ဈေးကို တန်း ပြန်ပေးပါတယ်။ မရှိတဲ့
      ပစ္စည်း ဆိုရင် ရှာလို့ ရလာတာက undefined ဖြစ်လို့၊ undefined ရဲ့ price ကို ဖတ်မိပြီး error တက်တာပါ။
      [[mark:type-guard]] ဒါကြောင့် ပစ္စည်း မရှိရင် menu မှာ မရှိဘူး ဆိုတဲ့ error ကို ကိုယ်တိုင် throw
      လုပ်တဲ့ line တစ်ကြောင်း ထည့်ပါမယ်။ message ထဲမှာ ဘယ် ပစ္စည်းလဲ ဆိုတာပါ ပါအောင် ရေးထားပါတယ်။ ဒီ line
      က ဈေးကို မဖတ်ခင်မှာ ရှိနေလို့၊ undefined ရဲ့ price ကို ဖတ်မိတာမျိုး မဖြစ်တော့ပါဘူး။
      [[mark:read-green]] menu ဖိုင်ကို ပြင်လိုက်တော့၊ သူ့ကို သုံးနေတဲ့ test ဖိုင် နှစ်ဖိုင်လုံးကို Vitest က
      ပြန် run ပါတယ်။ test ခုနစ်ခုလုံး pass ဖြစ်ပြီး၊ အစိမ်းရောင် PASS ပြန်ဖြစ်သွားပါပြီ။ ဒီတစ်ခါ PASS
      ကတော့ ကျော်သွားတဲ့ test မရှိဘဲ၊ အားလုံး တကယ် run ပြီး ရတဲ့ PASS ပါ။
    sources:
      - { title: "Vitest: expect, toThrow", url: "https://vitest.dev/api/expect#tothrow" }
      - {
          title: "Vitest: Features, watch mode reruns related tests",
          url: "https://vitest.dev/guide/features",
        }
    actions:
      - id: open-menu
        type: workspace.openFile
        at: { mark: open-menu }
        path: src/menu.js
      - id: select-return
        type: editor.select
        at: { mark: select-return }
        target: { file: src/menu.js, text: "return item.price;", occurrence: 1 }
      - id: type-guard
        type: editor.type
        at: { mark: type-guard }
        target: { file: src/menu.js, after: "  const item = MENU[id];\n", occurrence: 1 }
        text: "  if (!item) throw new Error(`${id} is not on the menu`);\n"
      - id: expect-green
        type: expect.preview
        at: { afterAction: type-guard }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-green-count
        type: expect.preview
        at: { afterAction: expect-green }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "7" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-green-test
        type: expect.preview
        at: { afterAction: expect-green-count }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-5 }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-menu-file
        type: expect.file
        at: { afterAction: expect-green-test }
        path: src/menu.js
        contains: "  const item = MENU[id];\n  if (!item) throw new Error(`${id} is not on the menu`);\n  return item.price;"

  - id: skip-todo
    chapter: "Skip နဲ့ todo"
    narration: >
      ကဲ၊ နောက်မှ ရေးမယ့် test တွေကိုလည်း မမေ့အောင် မှတ်ထားကြည့်ရအောင်။ [[mark:open-test-todo]]
      test todo ဆိုတာ ရေးဖို့ စီစဉ်ထားတဲ့ test ကို နာမည်တစ်ခုတည်းနဲ့ စာရင်းထဲ ထည့်ထားတာပါ။
      [[mark:type-todo-1]] ပထမ တစ်ခုက happy hour အချိန်မှာ သောက်စရာတွေကို ဈေး လျှော့ပေးဖို့ပါ။ အချိန်ပေါ်
      မူတည်တဲ့ အလုပ်လုပ်ပုံ ဖြစ်လို့ test ထဲမှာ နာရီကို ဘယ်လို ထိန်းရလဲ သိပြီးမှ test အပြည့်အစုံကို
      ရေးမှာ ဖြစ်ပြီး၊ အခုတော့ နာမည်ပဲ ထည့်ထားပါမယ်။ [[mark:type-todo-2]] ဒုတိယ တစ်ခုကတော့ ခွက်အရေအတွက်
      သုည နဲ့ မှာရင် လက်မခံဖို့ပါ။ အခု code က အဲဒီလို အော်ဒါကို သုည ကျပ်လို့ပဲ တွက်ပေးနေပါတယ်။ ဘယ်လို
      ငြင်းမလဲ ဆိုတာကို ဆိုင်ရှင်နဲ့ ညှိပြီးမှ test ကို ရေးပါမယ်။
      [[mark:read-todo]] panel ကို ကြည့်ပါ။ todo နှစ်ခုကို လေးထောင့် အကွက်လေးတွေနဲ့ ပြပြီး၊ summary မှာ
      ၇ ခု pass နဲ့ todo ၂ ခု လို့ ပြနေပါတယ်။ PASS ကတော့ အစိမ်းရောင် အတိုင်းပါပဲ။ [[mark:board-skip]]
      skip ကိုလည်း todo နဲ့ ယှဉ်ကြည့်ရအောင်။ [[mark:draw-skip-rows]] test နောက်မှာ skip ထည့်ရင်၊
      ရေးပြီးသား test ကို မဖျက်ဘဲ ခဏ ရပ်ထားလို့ ရပါတယ်။ panel မှာတော့ အောက်ကို ညွှန်တဲ့ မြှားနဲ့
      ပြပါတယ်။ [[mark:draw-skip-summary]] test လေးခု ရှိတဲ့ ဖိုင်မှာ တစ်ခုကို skip လုပ်ပြီး နှစ်ခုကို todo
      ထားရင်၊ summary မှာ ၁ ခု pass ဖြစ်ပြီး ၁ ခု skipped နဲ့ todo ၂ ခု လို့ ပြပါတယ်။ run ကတော့ PASS
      ပါပဲ။ [[mark:draw-read-summary]] ဆိုလိုတာက test လေးခုထဲက တစ်ခုပဲ
      တကယ် စစ်ထားတာပါ။ skipped ဆိုတာ pass ဖြစ်တာ မဟုတ်လို့၊ အစိမ်းရောင်ကို မြင်ရုံနဲ့ မယုံဘဲ summary
      ထဲက skipped နဲ့ todo ကို အမြဲ ဖတ်ပါ။ code review လုပ်တဲ့အခါမှာလည်း skip ဒါမှမဟုတ် only အသစ်
      ပါလာတာကို သတိထား ကြည့်ပါ။
    sources:
      - { title: "Vitest: test.todo", url: "https://vitest.dev/api/test#test-todo" }
      - { title: "Vitest: test.skip", url: "https://vitest.dev/api/test#test-skip" }
      - {
          title: "Vitest: Test Filtering, skipping and placeholder tests",
          url: "https://vitest.dev/guide/filtering#skipping-tests-with-skip",
        }
      - {
          title: "Vitest 5.1 output for .skip and .todo, exit code 0 (capture 16a; facts D19)",
          url: "https://vitest.dev/guide/learn/writing-tests#skipping-and-focusing-tests",
        }
    actions:
      - id: open-test-todo
        type: workspace.openFile
        at: { mark: open-test-todo }
        path: src/order.test.js
      - id: type-todo-1
        type: editor.type
        at: { mark: type-todo-1 }
        target:
          {
            file: src/order.test.js,
            after: "    expect(call).toThrow(\"not on the menu\");\n  });\n",
            occurrence: 1,
          }
        text: "\n  test.todo(\"gives the happy-hour price\");\n"
      - id: type-todo-2
        type: editor.type
        at: { mark: type-todo-2 }
        target:
          {
            file: src/order.test.js,
            after: "  test.todo(\"gives the happy-hour price\");\n",
            occurrence: 1,
          }
        text: "  test.todo(\"refuses a quantity of zero\");\n"
      - id: expect-todo
        type: expect.preview
        at: { afterAction: type-todo-2 }
        timeoutMs: 8000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-todo, value: "2" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-todo-pass
        type: expect.preview
        at: { afterAction: expect-todo }
        timeoutMs: 5000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-todo-file
        type: expect.preview
        at: { afterAction: expect-todo-pass }
        timeoutMs: 5000
        target: { by: testId, value: vt-file-1 }
        textContains: "(7 tests | 2 todo)"
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-todo-row
        type: expect.preview
        at: { afterAction: expect-todo-file }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-7 }
        attribute: { name: data-state, value: todo }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-order-file
        type: expect.file
        at: { afterAction: expect-todo-row }
        path: src/order.test.js
        contains: "  test(\"adds the sugar fee\", () => {\n  // test.only(\"adds the sugar fee\", () => {\n"
      - id: expect-todo-lines
        type: expect.file
        at: { afterAction: expect-order-file }
        path: src/order.test.js
        contains: "  test.todo(\"gives the happy-hour price\");\n  test.todo(\"refuses a quantity of zero\");\n"
      - id: board-skip
        type: whiteboard.apply
        at: { mark: board-skip }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-skip-rows
        type: whiteboard.apply
        at: { mark: draw-skip-rows }
        upsertIds: [c-skip-code, c-skip-icon, c-skip-mean, c-todo-code, c-todo-icon, c-todo-mean]
        drawMs: 4500
      - id: draw-skip-summary
        type: whiteboard.apply
        at: { mark: draw-skip-summary }
        upsertIds: [c-sum-box, c-sum, c-pass]
        drawMs: 3000
      - id: draw-read-summary
        type: whiteboard.apply
        at: { mark: draw-read-summary }
        upsertIds: [c-underline, c-warn]
        drawMs: 2000

  - id: filters
    chapter: "Terminal မှာ test ရွေး run ရအောင်"
    narration: >
      [[mark:board-filters]] terminal မှာဆိုရင် vitest ကို စ run ကတည်းက ဘယ် test တွေ run မလဲ
      ရွေးလို့လည်း ရပါတယ်။ [[mark:draw-file-filter]] vitest နောက်မှာ စကားလုံး တစ်ခု ထည့်ရင်၊ ဖိုင် path ထဲမှာ
      အဲဒီ စကားလုံး ပါတဲ့ test ဖိုင်တွေကိုပဲ run ပါတယ်။ order လို့ ထည့်ရင် order test ဖိုင် တစ်ဖိုင်ပဲ run
      ပါတယ်။ [[mark:draw-name-filter]] t ဆိုတဲ့ option ကတော့ test နာမည်နဲ့ ရွေးတာပါ။ Vitest ၅ မှာ describe
      နာမည်နဲ့ test နာမည်ကို ဆက်ထားတဲ့ နာမည် အပြည့်ထဲမှာ ရှာလို့၊ ဒီ ဥပမာမှာ adds နဲ့ စတဲ့ test
      နှစ်ခုပဲ run ပါတယ်။ [[mark:draw-last-failed]] Vitest ၅ ဒသမ ၁ မှာ option အသစ် နှစ်ခု ပါလာပါတယ်။
      last failed က ပြီးခဲ့တဲ့ အကြိမ်မှာ ကျခဲ့တဲ့ test တွေကိုပဲ ပြန် run ပြီး၊ watch mode ရဲ့ f key
      လိုပါပဲ။ [[mark:draw-since]] စမ်းသပ်ဆဲ အဆင့်မှာ ရှိတဲ့ since last run ကတော့၊ ပြီးခဲ့တဲ့ run
      ကတည်းက ပြောင်းသွားတဲ့ ဖိုင်တွေနဲ့ ဆိုင်တဲ့ test တွေကိုပဲ run ပါတယ်။ code ပြင်ပြီးတိုင်း test ပြန်
      run ရတဲ့ AI coding agent တွေအတွက်လည်း သင့်တော်ပါတယ်။ [[mark:draw-fast]] ဘယ်လိုပဲ ရွေးရွေး၊ npm
      test ကိုတော့ မြန်မြန် ပြီးအောင် ထားပါ။ စောင့်ရတာ ကြာရင် ခဏခဏ run ဖြစ်တော့မှာ မဟုတ်လို့၊ browser
      ဖွင့်ရတဲ့ test တွေ၊ network သုံးရတဲ့ test တွေကို အဲဒီထဲ မထည့်ကြပါဘူး။ test တွေ မြန်နေရင်တော့ test
      အားလုံးကို မကြာခဏ run ပါ။
    sources:
      - {
          title: "Vitest: Test Filtering, by file name and by test name",
          url: "https://vitest.dev/guide/filtering",
        }
      - {
          title: "Vitest 5 migration guide: -t matches the full name joined by ' > ' (facts A16)",
          url: "https://vitest.dev/guide/migration/",
        }
      - {
          title: "Vitest CLI: since-last-run and last-failed (facts A29)",
          url: "https://vitest.dev/guide/cli#since-last-run",
        }
      - {
          title: "Vitest 5.1 announcement: --since-last-run and --last-failed",
          url: "https://vitest.dev/blog/vitest-5-1",
        }
      - {
          title: "web.dev Learn Testing: Where tests run, prerequisite script (a fast npm test)",
          url: "https://web.dev/learn/testing/get-started/where-tests-run#prereq-script",
        }
    actions:
      - id: board-filters
        type: whiteboard.apply
        at: { mark: board-filters }
        clear: true
        upsertIds: [d-title]
      - id: draw-file-filter
        type: whiteboard.apply
        at: { mark: draw-file-filter }
        upsertIds: [d-file-cmd, d-file-mean]
        drawMs: 2000
      - id: draw-name-filter
        type: whiteboard.apply
        at: { mark: draw-name-filter }
        upsertIds: [d-name-cmd, d-name-mean]
        drawMs: 2500
      - id: draw-last-failed
        type: whiteboard.apply
        at: { mark: draw-last-failed }
        upsertIds: [d-last-cmd, d-last-mean]
        drawMs: 2500
      - id: draw-since
        type: whiteboard.apply
        at: { mark: draw-since }
        upsertIds: [d-since-cmd, d-since-mean]
        drawMs: 2500
      - id: draw-fast
        type: whiteboard.apply
        at: { mark: draw-fast }
        upsertIds: [d-fast]
        drawMs: 1800

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ watch mode က ပြင်လိုက်တဲ့ ဖိုင်နဲ့ ဆိုင်တဲ့ test တွေကို ချက်ချင်း ပြန် run
      ပေးလို့၊ code ရေးနေတုန်း ဖွင့်ထားဖို့ ကောင်းပါတယ်။ only ကို test တစ်ခုကို အာရုံစိုက်ဖို့ သုံးပြီး၊
      commit မလုပ်ခင် ပြန်ဖြုတ်ပါ။ မဖြုတ်ရင် ကျနေတဲ့ test တွေကို ဖုံးထားနိုင်ပါတယ်။ [[mark:recap-summary]]
      skip နဲ့ todo ကလည်း run ကို အစိမ်းရောင် အတိုင်း ထားလို့၊ PASS ကိုပဲ မကြည့်ဘဲ summary ကို ဖတ်ပါ။
      terminal မှာတော့ ဖိုင်နာမည်၊ test နာမည်၊ ကျခဲ့တဲ့ test နဲ့ ပြောင်းထားတဲ့ ဖိုင်တွေနဲ့ ရွေး run လို့
      ရပါတယ်။ နောက် lesson မှာတော့ test body တစ်ခုတည်းနဲ့ data ဇယား တစ်ခုလုံးကို စစ်ပေးတဲ့ test for
      ကို ကြည့်သွားပါမယ်။
    sources:
      - { title: "Vitest: Test Filtering", url: "https://vitest.dev/guide/filtering" }
      - {
          title: "web.dev Learn Testing: Where tests run",
          url: "https://web.dev/learn/testing/get-started/where-tests-run",
        }
    actions:
      - id: close-filters
        type: whiteboard.apply
        at: { scene: start }
        open: false
checks:
  - { type: timing.p95Ms, max: 300 }
