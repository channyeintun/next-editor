# One shape: a survey of Haskell in a single module — purity, type
# signatures, currying, guards, algebraic data types, Maybe, Either,
# laziness, records, and type classes — three of them drawn on the
# whiteboard first, each written into one growing file, and run once at
# the end.
#
# Every line of code here was compiled with GHC 9.12.4 and executed on
# play.haskell.org; the fixture stdout below is that run's exact text.
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/haskell-crash-course.yaml
