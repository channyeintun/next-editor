schemaVersion: 1

lesson:
  slug: architect-09-coupling-strength
  title: "Architect Path 09: Coupling ရဲ့ အားကို တိုင်းခြင်း"
  locale: my-MM
  workspace:
    lessonType: javascript
    name: Architect Notebook
    entryFilePath: notebook/09-coupling-audit.md
    sidebarStartsCollapsed: true
    files:
      README.md: |
        # ခရီးဖော် · system မှတ်စု

        ခရီးဖော်က အဝေးပြေးကား လက်မှတ်ကို app ကနေ ဝယ်လို့ရအောင် လုပ်ပေးတဲ့ ကုမ္ပဏီပါ။
        ဒီ course အတွက် စိတ်ကူးနဲ့ တည်ဆောက်ထားတဲ့ ကုမ္ပဏီ ဖြစ်ပါတယ်။

        ## သုံးတဲ့သူတွေ

        - ခရီးသည်: ခရီးစဉ် ရှာတယ်၊ ထိုင်ခုံ ရွေးတယ်၊ wallet နဲ့ ငွေချေတယ်၊ လက်မှတ် ရတယ်
        - ကားလိုင်း: ခရီးစဉ်နဲ့ ဈေးနှုန်း တင်တယ်၊ ရောင်းအား ကြည့်တယ်
        - ကောင်တာ ဝန်ထမ်း: ကားဂိတ်မှာ ထိုင်ခုံ အတူတူကိုပဲ ရောင်းတယ်

        ## အခု အခြေအနေ (ကုမ္ပဏီ သက်တမ်း 2 နှစ်)

        - developer 6 ယောက်၊ team တစ်ခု
        - ကားလိုင်း 40၊ တစ်ရက် လက်မှတ် 8,000 ခန့် (60 % က ကောင်တာက)
        - app တစ်ခုတည်း (monolith)၊ database တစ်ခု၊ server တစ်လုံး
        - အပြင်က service: wallet payment API၊ SMS gateway

        ## သင်္ကြန် လက်မှတ် ဖွင့်ရောင်းတဲ့နေ့

        - မနက် 9 နာရီမှာ ဝင်သုံးသူ ပုံမှန်ရဲ့ 15 ဆ
        - app က 2 နာရီကြာ နှေးနေခဲ့တယ်
        - ထိုင်ခုံ 312 ခုံကို နှစ်ခါ ရောင်းမိတယ်
      notebook/09-coupling-audit.md: |
        # Coupling audit · ခရီးဖော်

        | ဆက်သွယ်မှု | မျှသိထားတာ | အဆင့် |
        |---|---|---|
