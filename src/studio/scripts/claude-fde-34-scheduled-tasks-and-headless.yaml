build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 9334

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: need
    chapter: မနက်တိုင်း စစ်ရတဲ့ အလုပ်
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ စည်းကမ်း တစ်ခုစီကို CLAUDE.md၊ permission rule နဲ့ hook ထဲက တကယ် လိုက်နာမယ့်
      နေရာမှာ ထားပြီး၊ အလုပ် အမျိုးအစားအလိုက် permission mode ကို ရွေးခဲ့ပါတယ်။
      [[mark:n-open]] trial စပြီး နောက်ပိုင်း ရွှေ့ပြီးသား report job အသစ်တွေက ညတိုင်း job အဟောင်းတွေနဲ့ ယှဉ်ပြီး
      run နေပါတယ်။ မနက်တိုင်း Billing developer တစ်ယောက်က job အသစ်နဲ့ အဟောင်းရဲ့ စုစုပေါင်း ဂဏန်းတွေ တူမတူ
      ကိုယ်တိုင် တိုက်စစ်ရပါတယ်။ မိနစ် နှစ်ဆယ်လောက် ကြာပြီး၊ ခွင့်ယူတဲ့နေ့ဆို ကျော်သွားတတ်ပါတယ်။
      [[mark:sel-purpose]] ဒီ အလုပ်ကို Claude Code လုပ်ပေးနိုင်ပါတယ်။ ဒါပေမဲ့ မနက် ခုနစ်နာရီမှာ keyboard ရှေ့မှာ
      ဘယ်သူမှ မရှိပါဘူး။ Claude Code ဆိုတာ terminal ထဲကနေ code ကို ဖတ်၊ ပြင်၊ command run ပေးတဲ့ coding agent
      ပါ။ ပုံမှန်ဆိုရင် ကိုယ်က session ဖွင့်၊ prompt ရိုက်၊ ခွင့်ပြုချက် ပေးရပါတယ်။
      [[mark:sel-where]] ဒီ file ကတော့ မနက် ခုနစ်နာရီမှာ ဒီ check ကို run မယ့် script ပါ။ ကိုယ်တို့ရဲ့
      မေးခွန်းက လူ မရှိဘဲ prompt တစ်ခုကို ဘယ်မှာ၊ ဘယ်လို run မလဲ ဆိုတာပါ။
    sources:
      - {
          title: "Claude Code Docs: Run Claude Code programmatically",
          url: "https://code.claude.com/docs/en/headless",
        }
    actions:
      - {
          id: open-script,
          type: workspace.openFile,
          at: { mark: n-open },
          path: billing-service/scripts/morning-check.sh,
        }
      - id: sel-purpose
        type: editor.select
        at: { mark: sel-purpose }
        target:
          file: billing-service/scripts/morning-check.sh
          text: "# Morning check: did last night's new report jobs give the same totals as the old ones?"
      - id: sel-where
        type: editor.select
        at: { mark: sel-where }
        target:
          file: billing-service/scripts/morning-check.sh
          text: "# Runs at 07:00 every morning."

  - id: places
    chapter: Prompt run နိုင်တဲ့ နေရာ သုံးခု
    narration: >
      [[mark:p-open]] prompt တစ်ခုကို run နိုင်တဲ့ နေရာ သုံးခု ရှိပါတယ်။
      [[mark:p-1]] ပထမ နေရာက ကိုယ်တို့ သုံးနေကျ terminal session ပါ။ ကိုယ့်စက်ပေါ်မှာ run ပြီး၊ ကိုယ်က ထိုင်ကြည့်နေပါတယ်။
      ပြီးခဲ့တဲ့ lesson တွေက loop လိုမျိုး ထပ်ခါထပ်ခါ run တာတွေကလည်း ဒီ session ဖွင့်ထားမှ၊ စက် ပွင့်နေမှ အလုပ်လုပ်ပါတယ်။
      [[mark:p-2]] ဒုတိယ နေရာက scheduled task ပါ။ scheduled task ဆိုတာ သတ်မှတ်ချိန်မှာ အလိုအလျောက် run တဲ့ prompt ပါ။
      Anthropic ဘက်က စီမံထားတဲ့ cloud ပေါ်မှာ run တာမို့ ကိုယ့် laptop ကို ပိတ်ထားလည်း အလုပ်လုပ်ပါတယ်။ အရင်က
      routine လို့ ခေါ်ခဲ့ပြီး၊ အခုတော့ scheduled task လို့ နာမည် ပြောင်းထားပါတယ်။
      [[mark:p-3]] တတိယ နေရာက ကိုယ့် pipeline ထဲပါ။ CI ဒါမှမဟုတ် ကိုယ့် server ပေါ်က script တစ်ခုက Claude Code ကို
      print mode နဲ့ ခေါ်တာပါ။ ဒါကို headless mode လို့ ခေါ်ပါတယ်။ headless mode ဆိုတာ လူ မထိုင်ဘဲ script ထဲကနေ
      Claude Code ကို run တာပါ။
      [[mark:p-note]] ဒီ lesson ကို ရေးတဲ့ အချိန်မှာ scheduled task က research preview အဆင့်ပဲ ရှိသေးပြီး၊ Pro၊
      Max၊ Ultra၊ Team နဲ့ Enterprise plan တွေမှာ ရပါတယ်။ ဒါမျိုးက မကြာခဏ ပြောင်းတာမို့ docs ရဲ့ scheduled
      task page မှာ ပြန်စစ်ပါ။
    sources:
      - {
          title: "Claude Code Docs: Scheduled tasks in the cloud",
          url: "https://code.claude.com/docs/en/routines",
        }
      - {
          title: "Claude Code Docs: Run prompts on a schedule",
          url: "https://code.claude.com/docs/en/scheduled-tasks",
        }
    actions:
      - {
          id: draw-p-open,
          type: whiteboard.apply,
          at: { mark: p-open },
          open: true,
          clear: true,
          upsertIds: [p-title],
        }
      - {
          id: draw-p-1,
          type: whiteboard.apply,
          at: { mark: p-1 },
          upsertIds: [p-b1, p-l1, p-t1],
          drawMs: 1500,
        }
      - {
          id: draw-p-2,
          type: whiteboard.apply,
          at: { mark: p-2 },
          upsertIds: [p-b2, p-l2, p-t2],
          drawMs: 1500,
        }
      - {
          id: draw-p-3,
          type: whiteboard.apply,
          at: { mark: p-3 },
          upsertIds: [p-b3, p-l3, p-t3],
          drawMs: 1500,
        }
      - {
          id: draw-p-note,
          type: whiteboard.apply,
          at: { mark: p-note },
          upsertIds: [p-n1, p-n2],
          drawMs: 1200,
        }

  - id: cloud
    chapter: Scheduled task
    narration: >
      [[mark:c-back]] scheduled task ကို ပိုနီးနီးကပ်ကပ် ကြည့်ရအောင်။ scheduled task တစ်ခုမှာ သိမ်းထားတဲ့ prompt
      တစ်ခု၊ ရွေးထားတဲ့ repository တွေနဲ့ connector တွေ ပါပါတယ်။ connector ဆိုတာ Claude ကို တခြား tool၊ data တွေနဲ့
      ချိတ်ပေးတဲ့ အဆက်ပါ။ web ပေါ်က Claude Code စာမျက်နှာ၊ Desktop app ဒါမှမဟုတ် terminal ထဲက schedule command
      နဲ့ ဖန်တီးလို့ ရပါတယ်။ schedule command ကတော့ API key နဲ့ မဟုတ်ဘဲ claude.ai subscription နဲ့ login ဝင်ထားမှ ရပါတယ်။
      [[mark:c-trigger]] စတင်ပေးတဲ့ trigger သုံးမျိုး ရှိပါတယ်။ အချိန်ဇယားနဲ့ဆိုရင် အများဆုံး တစ်နာရီ တစ်ခါပဲ run လို့
      ရပြီး၊ ရိုးရိုး cron နဲ့ ရေးရင် UTC အချိန်နဲ့ ဖတ်ပါတယ်။ မြန်မာ အချိန် မနက် ခုနစ်နာရီဆိုရင် UTC နဲ့ ညဘက်
      ဖြစ်နေတာ သတိထားပါ။
      [[mark:c-api]] API ကနေ ခေါ်တာနဲ့ GitHub ပေါ်က pull request လို event တွေကနေ စတာလည်း ရပါတယ်။ API ကနေ ပို့လိုက်တဲ့ စာသားကို
      ယုံကြည်ရမယ့် ညွှန်ကြားချက် မဟုတ်ဘူးလို့ အမှတ်အသား လုပ်ပြီး ပေးတာမို့၊ အဲဒီ စာသားအတိုင်း လုပ်ရမယ်ဆိုရင် သိမ်းထားတဲ့
      prompt ထဲမှာ ကိုယ်တိုင် ရေးထားရပါတယ်။
      [[mark:c-you]] run တိုင်းက ကိုယ့်ကိုယ်စား လုပ်တာပါ။ commit၊ pull request၊ message တွေမှာ ကိုယ့် identity ပါသွားပါတယ်။
      run က auto mode နဲ့ စပြီး၊ ask rule ကို ရောက်ရင် ဒါမှမဟုတ် ဆက်တိုက် ပိတ်ခံရရင် ရပ်စောင့်ပါတယ်။
      [[mark:c-limit]] ကုန်ကျစရိတ်က ကိုယ့် subscription usage ထဲက ဖြတ်ပါတယ်။ ဒီ lesson ကို ရေးတဲ့ အချိန်မှာ account
      တစ်ခုကို တစ်နာရီ အချိန်ဇယား run တစ်ရာအထိ၊ ချက်ချင်း run တာနဲ့ API ကနေ ခေါ်တာကို task တစ်ခုကို တစ်နာရီ
      သုံးဆယ်အထိပဲ ခွင့်ပြုပါတယ်။
    sources:
      - {
          title: "Claude Code Docs: Scheduled tasks in the cloud",
          url: "https://code.claude.com/docs/en/routines",
        }
    actions:
      - { id: point-cloud, type: whiteboard.point, at: { mark: c-back }, target: { assetId: p-b2 } }
      - {
          id: point-cloud-t,
          type: whiteboard.point,
          at: { mark: c-trigger },
          target: { assetId: p-t2 },
        }
      - {
          id: point-cloud-you,
          type: whiteboard.point,
          at: { mark: c-you },
          target: { assetId: p-l2 },
        }

  - id: print
    chapter: Print mode
    narration: >
      [[mark:h-open]] အခု တတိယ နေရာကို ကြည့်ရအောင်။ print mode နဲ့ run ရင် ဒီလို မြင်ရပါတယ်။
      [[mark:h-cmd]] claude ဆိုတဲ့ command နောက်မှာ print mode နဲ့ မေးခွန်း တစ်ခု ပေးလိုက်တာပါ။ session မဖွင့်ဘဲ တစ်ခါ
      run ပြီး ထွက်သွားပါတယ်။ အောင်ရင် exit code သုည၊ မအောင်ရင် သုည မဟုတ်တာ ပြန်ပေးလို့ script ကနေ စစ်လို့ ရပါတယ်။
      [[mark:h-json]] output format ကို JSON လို့ ပေးထားပါတယ်။ default က စာသားပါ။ JSON ဆိုရင် program တစ်ခုက
      ဖတ်လို့ ရတဲ့ ပုံစံနဲ့ ရပြီး၊ event တွေကို တစ်ခုချင်း stream လုပ်ချင်ရင်လည်း ရွေးလို့ ရပါတယ်။
      [[mark:h-type]] ဒီ ဥပမာမှာ field အချို့ကိုပဲ ရွေးပြထားပါတယ်။ ဒါက run ရဲ့ နောက်ဆုံး ရလဒ် message ပါ။
      [[mark:h-turns]] Claude က အလှည့် ဘယ်နှခု သုံးခဲ့လဲ ဆိုတာလည်း ပါပါတယ်။
      [[mark:h-result]] result field ထဲမှာတော့ Claude ရဲ့ အဖြေ ရှိပါတယ်။ ဒီမှာ invoice code ကို ဖတ်ပြီး commercial
      tax နှုန်းကို ပြောထားပါတယ်။ ဒီမှာ ဖျောက်ထားပေမဲ့ JSON အပြည့်မှာ session id လည်း ပါလို့ နောက်မှ အဲဒီ session ကို ဆက်ခိုင်းလို့ ရပါတယ်။
      [[mark:h-sdk]] ဒီ print mode ဆိုတာ Agent SDK ကို command line ကနေ သုံးတာပါပဲ။ Python နဲ့ TypeScript package
      တွေလည်း ရှိပြီး၊ Claude Code ကို အလုပ်လုပ်စေတဲ့ tool တွေ၊ agent loop နဲ့ context စီမံပုံ အတူတူကို ကိုယ့် program
      ထဲကနေ သုံးလို့ ရပါတယ်။
    sources:
      - {
          title: "Claude Code Docs: Run Claude Code programmatically",
          url: "https://code.claude.com/docs/en/headless",
        }
      - {
          title: "Claude Code Docs: CLI reference",
          url: "https://code.claude.com/docs/en/cli-reference",
        }
    actions:
      - {
          id: close-places,
          type: whiteboard.apply,
          at: { mark: h-open, offsetMs: -1400 },
          open: false,
        }
      - {
          id: show-headless,
          type: slide.show,
          at: { afterAction: close-places },
          slideId: headless-screen,
        }
      - { id: pt-h-cmd, type: slide.point, at: { mark: h-cmd }, target: { x: 0.091, y: 0.288 } }
      - { id: pt-h-json, type: slide.point, at: { mark: h-json }, target: { x: 0.528, y: 0.288 } }
      - { id: pt-h-type, type: slide.point, at: { mark: h-type }, target: { x: 0.105, y: 0.394 } }
      - { id: pt-h-turns, type: slide.point, at: { mark: h-turns }, target: { x: 0.105, y: 0.500 } }
      - {
          id: pt-h-result,
          type: slide.point,
          at: { mark: h-result },
          target: { x: 0.086, y: 0.535 },
        }
      - { id: pt-h-sdk, type: slide.point, at: { mark: h-sdk }, target: { x: 0.091, y: 0.288 } }

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ ဒီ check က report job တွေရဲ့ output ကို Billing ရဲ့ report database ကနေ
      ဖတ်ရပါတယ်။ အဲဒီ database က နေခြည် ရဲ့ network အတွင်းကနေပဲ ချိတ်လို့ ရပါတယ်။ ဒီ check ကို ဘယ်မှာ run သင့်မလဲ။
      [[mark:q-a]] ပထမ အဖြေက laptop ပိတ်ထားလည်း run တဲ့ cloud scheduled task ပါ။
      [[mark:q-b]] ဒုတိယ အဖြေက ကိုယ့် pipeline ထဲက print mode ပါ။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ တစ်ခုပါ။ ဘာကြောင့်လဲဆိုတော့ cloud scheduled task က Anthropic ရဲ့ cloud
      ပေါ်မှာ run ပြီး၊ ရောက်နိုင်တာက ရွေးထားတဲ့ repository တွေ၊ ထည့်ထားတဲ့ connector တွေနဲ့ အဲဒီ environment ရဲ့
      network ပဲ ရှိလို့ပါ။ repository ကိုလည်း run တိုင်း အသစ် clone လုပ်ပြီး၊ local file ဆိုတာ မရှိပါဘူး။ နေခြည် ရဲ့
      network အတွင်းက database ကို မမြင်ရပါဘူး။ CI runner ကတော့ network အတွင်းမှာ ရှိနေပြီးသားပါ။
      [[mark:q-rule]] ဒါကြောင့် repo နဲ့ connector လောက်နဲ့ ပြီးတဲ့ အလုပ်ဆိုရင် scheduled task၊ ကိုယ့် network ထဲက
      data ဒါမှမဟုတ် ကိုယ့် pipeline ရဲ့ အဆင့် တစ်ခုအဖြစ် လိုရင် print mode ကို ရွေးပါ။ ဥပမာအားဖြင့် တနင်္လာနေ့တိုင်း
      Billing repo ထဲက ပြီးခဲ့တဲ့ အပတ် merge လုပ်ထားတဲ့ pull request တွေကို အကျဉ်းချုပ်ပေးတာမျိုးက repo တစ်ခုတည်းနဲ့
      ပြီးလို့ scheduled task အတွက် သင့်တော်ပါတယ်။
    sources:
      - {
          title: "Claude Code Docs: Scheduled tasks in the cloud",
          url: "https://code.claude.com/docs/en/routines",
        }
    actions:
      - { id: close-headless, type: slide.close, at: { mark: quiz, offsetMs: -900 } }
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: q-rule },
          upsertIds: [q-t1, q-t2],
          drawMs: 1600,
        }

  - id: script
    chapter: Morning check script
    narration: >
      [[mark:s-open]] ဒါဆို Billing team ရဲ့ CI runner ပေါ်မှာ မနက်တိုင်း run မယ့် script ကို print mode နဲ့ ရေးကြည့်ရအောင်။
      [[mark:type-prompt]] ပထမ အပိုင်းက prompt ပါ။ bare mode နဲ့ run ပါတယ်။ bare mode မှာ hook၊ skill၊ plugin၊ MCP
      server၊ auto memory နဲ့ CLAUDE.md တွေကို မဖတ်ပါဘူး။ ဒါကြောင့် run တဲ့ စက်ပေါ်က setup ပေါ် မမူတည်တော့ပါဘူး။ CLAUDE.md ကို
      မဖတ်တာမို့ နှိုင်းယှဉ်တဲ့ command ကို prompt ထဲမှာ ကိုယ်တိုင် ပြောထားရပါတယ်။ အဖြေကိုလည်း OK ဒါမှမဟုတ် ဂဏန်း
      မကိုက်တဲ့ job စာရင်း ဆိုပြီး တိုတိုပဲ တောင်းထားပါတယ်။
      [[mark:p-bare]] bare mode မပါရင်တော့ print mode က project ရဲ့ hook တွေနဲ့ MCP config file ထဲက server တွေကို
      run ပါတယ်။ မယုံကြည်ရသေးတဲ့ folder ထဲမှာတောင် trust မေးခွန်း မပြဘဲ run တာမို့ CI မှာ အထူး သတိထားရပါတယ်။ docs
      ကလည်း နောင်မှာ bare mode ကို print mode ရဲ့ default လုပ်မယ်လို့ ဆိုထားပါတယ်။
      [[mark:type-perm]] ဒုတိယ အပိုင်းက permission ပါ။ print mode က manual mode နဲ့ စတာမို့ ခွင့်ပြုချက် လိုတဲ့ tool
      ခေါ်မှုတွေကို မေးစရာ လူ မရှိတော့ ငြင်းလိုက်ပါတယ်။ allowed tools မှာ file ဖတ်တာနဲ့ နှိုင်းယှဉ်တဲ့ command
      တစ်ခုတည်းကိုပဲ ခွင့်ပြုထားပြီး၊ don't ask mode နဲ့ ကျန်တာ အားလုံးကို သေချာ ငြင်းခိုင်းထားပါတယ်။ auto mode နဲ့ run ရင်တော့
      classifier က ပိတ်လိုက်တဲ့ action တစ်ခုကိုပဲ ငြင်းပြီး run က ဆက်သွားပါတယ်။
      [[mark:type-bound]] တတိယ အပိုင်းက ကန့်သတ်ချက်နဲ့ output ပါ။ max turns နဲ့ အလှည့် ဆယ်ခုမှာ ရပ်ခိုင်းပြီး၊ max
      budget နဲ့ ဒေါ်လာ နှစ်ထက် မကျော်အောင် ချုပ်ထားပါတယ်။ budget flag က print mode မှာပဲ ရပါတယ်။ output ကိုတော့
      JSON နဲ့ file တစ်ခုထဲ သိမ်းပါတယ်။
      [[mark:type-read]] နောက်ဆုံး အပိုင်းက ရလဒ်ကို ဖတ်တာပါ။ result field ကို CI log ထဲ ထုတ်ပြပြီး၊ ငြင်းခံခဲ့ရတဲ့
      tool ခေါ်မှုတွေကို permission denials ထဲကနေ ထုတ်ပြပါတယ်။ ဘာကို ငြင်းခဲ့လဲ မသိရင် Claude က တစ်ဝက်ပဲ
      စစ်ပြီး OK လို့ ပြောသွားတာကို မြင်ရမှာ မဟုတ်လို့ပါ။
    sources:
      - {
          title: "Claude Code Docs: Run Claude Code programmatically",
          url: "https://code.claude.com/docs/en/headless",
        }
      - {
          title: "Claude Code Docs: Best practices",
          url: "https://code.claude.com/docs/en/best-practices",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: s-open }, open: false }
      - id: type-prompt
        type: editor.type
        at: { mark: type-prompt }
        cadence: line-by-line
        target: { file: billing-service/scripts/morning-check.sh, after: "set -euo pipefail\n\n" }
        text: "claude --bare -p \"Run npm run report:compare -- --all on last night's output. \\\nReply OK, or list each job whose totals differ.\" \\\n"
      - id: type-perm
        type: editor.type
        at: { mark: type-perm }
        cadence: line-by-line
        target:
          { file: billing-service/scripts/morning-check.sh, after: "whose totals differ.\" \\\n" }
        text: "  --allowedTools \"Read,Bash(npm run report:compare *)\" \\\n  --permission-mode dontAsk \\\n"
      - id: expect-perm
        type: expect.file
        at: { afterAction: type-perm }
        path: billing-service/scripts/morning-check.sh
        contains: "  --allowedTools \"Read,Bash(npm run report:compare *)\" \\\n  --permission-mode dontAsk \\\n"
      - id: type-bound
        type: editor.type
        at: { mark: type-bound }
        cadence: line-by-line
        target:
          {
            file: billing-service/scripts/morning-check.sh,
            after: "--permission-mode dontAsk \\\n",
          }
        text: "  --max-turns 10 --max-budget-usd 2 \\\n  --output-format json > morning-check.json\n"
      - id: type-read
        type: editor.type
        at: { mark: type-read }
        cadence: line-by-line
        target:
          {
            file: billing-service/scripts/morning-check.sh,
            after: "--output-format json > morning-check.json\n",
          }
        text: "\njq -r '.result' morning-check.json\njq '.permission_denials' morning-check.json\n"

  - id: your-turn
    chapter: ကိုယ့် နေ့စဉ် check
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ကိုယ့် team မှာ နေ့တိုင်း လက်နဲ့ လုပ်နေရတဲ့ check
      တစ်ခုကို ရွေးပါ။ ဒီ script ရဲ့ အောက်မှာ comment တစ်ကြောင်းနဲ့ အဲဒီ check ကို ရေးပြီး၊ cloud scheduled task နဲ့
      run မလား၊ ကိုယ့် pipeline ထဲမှာ run မလား ဆုံးဖြတ်ကြည့်ပါ။
      [[mark:turn-2]] ဆုံးဖြတ်ဖို့ မေးခွန်း နှစ်ခု မေးပါ။ ဒီ check က ဘာ data ကို ဖတ်ရမလဲ၊ အဲဒီ data က ဘယ်ကနေ
      ရောက်လို့ရလဲ ဆိုတာပါ။ ပြီးရင် ဘယ် tool တွေကိုပဲ ခွင့်ပြုမလဲ ဆိုတာကိုလည်း တစ်ကြောင်း ထပ်ရေးပါ။
    sources:
      - {
          title: "Claude Code Docs: Run Claude Code programmatically",
          url: "https://code.claude.com/docs/en/headless",
        }
    actions:
      - id: sel-check
        type: editor.select
        at: { mark: turn, offsetMs: 2000 }
        target:
          file: billing-service/scripts/morning-check.sh
          text: "# Morning check: did last night's new report jobs give the same totals as the old ones?"
      - id: sel-allowed
        type: editor.select
        at: { mark: turn-2 }
        target:
          file: billing-service/scripts/morning-check.sh
          text: "  --allowedTools \"Read,Bash(npm run report:compare *)\" \\"

  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ keyboard ရှေ့မှာ လူ မရှိဘဲ prompt ကို run ဖို့ နေရာ နှစ်ခု ရှိပါတယ်။ Anthropic ရဲ့ cloud ပေါ်က
      scheduled task နဲ့ ကိုယ့် pipeline ထဲက print mode ပါ။
      [[mark:recap-2]] print mode မှာ ခွင့်ပြုထားတဲ့ tool တွေကို ကြိုသတ်မှတ်ပြီး၊ အလှည့်နဲ့ ငွေကို ကန့်သတ်ကာ၊ ငြင်းခံခဲ့ရတာတွေကိုပါ
      ဖတ်ပါတယ်။
      [[mark:next]] နောက် lesson မှာတော့ Claude က code ပိုရေးလာလေ review လုပ်တဲ့သူတွေ မနိုင်တော့လေ ဖြစ်လာတဲ့ ပြဿနာကနေ
      စပြီး၊ code review နဲ့ GitHub Actions ကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "Claude Code Docs: Scheduled tasks in the cloud",
          url: "https://code.claude.com/docs/en/routines",
        }
    actions:
      - id: sel-bare
        type: editor.select
        at: { mark: recap-2 }
