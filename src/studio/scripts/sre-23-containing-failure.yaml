build:
  # Studio swaps in the Burmese voice chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 2623

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: hook
    chapter: "တစ်ဝက်ပဲ ပါတဲ့ ဈေးနှုန်းစာရင်း"
    narration: >
      [[mark:show-p01]] Padauk က backup တွေကို အပတ်တိုင်း restore လုပ်ပြီး စစ်သလို data အများကြီး ဖျက်တာကိုလည်း လူ နှစ်ယောက် အတည်ပြုမှ လုပ်ပါတယ်။ ဒါပေမဲ့ တစ်ရက် ည ၁ နာရီမှာ top-up တွေ နေရာတိုင်း ရပ်သွားပါတယ်။ operator တွေရဲ့ plan ဈေးနှုန်းစာရင်းကို ညတိုင်း ထုတ်ပေးတဲ့ job က တစ်ဝက်ပဲ ပါတဲ့ စာရင်းကို ပို့လိုက်ပြီး server တိုင်းက ယုံလိုက်လို့ပါ။
      [[mark:show-p01b]] job က ကြားမှာ ရပ်သွားလို့ စာရင်းထဲမှာ row တွေရဲ့ ၄၀ ရာခိုင်နှုန်းပဲ ပါခဲ့တာပါ။ ဆိုတော့ စာရင်းထဲ မပါတဲ့ plan တွေရဲ့ top-up မှန်သမျှ zone သုံးခုလုံးမှာ fail ကုန်ပါတယ်။ server တစ်လုံးမှ မကျဘဲ health check တွေလည်း အစိမ်းရောင်ပါ၊ မှားနေတာက data ပါ။
      ပြဿနာ မှန်သမျှကို ကြိုမမြင်နိုင်ပေမဲ့ ဘယ်အထိ ပျံ့မလဲ ဆိုတာကိုတော့ design နဲ့ ကန့်သတ်နိုင်ပါတယ်။ ကြိုမစီစဉ်ထားတဲ့ failure ကို ဘယ်လို ဘောင်ခတ်မလဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Building Secure and Reliable Systems, Ch 8: Design for Resilience",
          url: "https://google.github.io/building-secure-and-reliable-systems/raw/ch08.html",
        }
    actions:
      # -1750 / -1450, as in the other lessons: a pull-back over 1780 ms pushes the first dialog
      # past the 2 s opening handle, which src/studio/plans/index.test.ts rejects.
      - id: collapse-dock
        type: runtime.collapseDock
        at: { scene: start, offsetMs: -1750 }
      - id: show-p01
        type: slide.show
        at: { mark: show-p01, offsetMs: -1450 }
        slideId: l23-p01
      - id: show-p01b
        type: slide.show
        at: { mark: show-p01b }
        slideId: l23-p01b

  - id: reliable-resilient
    chapter: "Reliable နဲ့ resilient"
    narration: >
      [[mark:close-p01b]] [[mark:b1-s1]] အပြာရောင် ဘောင်က Top-up ကို design လုပ်ပြီး စမ်းထားတဲ့ load အတိုင်းအတာပါ၊ ဘောင်ထဲက bar တွေကတော့ ပုံမှန် ညတွေပါ။ ဒီဘောင်ထဲမှာ lesson ၆ က Top-up SLO ကို ထိန်းနိုင်နေရင် reliable ဖြစ်တယ်လို့ ပြောပါတယ်။
      [[mark:b1-s2]] ဈေးနှုန်းစာရင်း တစ်ဝက်ပဲ ရောက်တဲ့ ညကတော့ ဘောင်အပြင်ဘက်ပါ။ တချို့ system တွေက အနီရောင်လို ပြိုကျပြီး လူ လာပြင်တဲ့အထိ ရပ်နေပါတယ်။ [[mark:b1-s2b]] တချို့ကတော့ အစိမ်းရောင်လို ခဏ ကျပေမဲ့ ပြဿနာ မပျံ့အောင် ဘောင်ခတ်ပြီး ပြန်တက်လာပါတယ်၊ ဥပမာ ကျန်တဲ့ plan တွေကို ဆက်ရောင်းနေနိုင်ပါတယ်။ ဒီလို design ဘောင် အပြင်က failure ကိုပါ ဘောင်ခတ်ပြီး ပြန်ကောင်းလာနိုင်တာကို resilience လို့ ခေါ်ပါတယ်။
      [[mark:b1-s3]] incident တိုင်းကနေ ရတဲ့ သင်ခန်းစာတွေက ဒီဘောင်ကို တဖြည်းဖြည်း ချဲ့ပေးပါတယ်။ ဒါပေမဲ့ ပြင်ဆင်မှုတိုင်းက ဒီနေ့ ကုန်ကျပြီး failure တကယ် ဖြစ်မှ အကျိုးပြန်ပေးတာမို့ အားလုံးကို မကာကွယ်နိုင်ဘဲ ချိန်ဆပြီး ရွေးရပါတယ်။ ဘယ်လောက် resilient ဖြစ်ရင် လုံလောက်လဲ ဆိုတာကိုလည်း engineer တွေ မဟုတ်ဘဲ user တွေနဲ့ Padauk ကို ခေါ်သုံးတဲ့ system တွေက ဆုံးဖြတ်ပါတယ်။
    sources:
