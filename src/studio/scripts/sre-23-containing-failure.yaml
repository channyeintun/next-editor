  - id: recap
    narration: >
      [[mark:close-p03]] [[mark:open-notes]] ဘောင်ခတ်နည်းတွေကို ပြန်ခေါ်ကြည့်ပါမယ်။ [[mark:sel-resilience]] resilience က design ဘောင် အပြင်က failure ကိုပါ ဘောင်ခတ်ပြီး ပြန်ကောင်းလာနိုင်တာပါ။ [[mark:sel-failure-domain]] failure domain က အတူ ပျက်နိုင်တဲ့ အုပ်စု ဖြစ်ပြီး၊ [[mark:sel-blast-radius]] blast radius က မှားရင် ထိခိုက်မယ့် နယ်ပယ်ပါ။
      [[mark:sel-serial-dependency]] serial dependency တွေမှာ availability တွေကို မြှောက်ရလို့ စုစုပေါင်းက အားအနည်းဆုံး တစ်ခုထက်တောင် နိမ့်ပါတယ်။ [[mark:sel-shared-fate]] shared fate က တစ်ခုတည်းကို မျှသုံးလို့ အတူ ပျက်တာ ဖြစ်ပြီး၊ [[mark:sel-fail-open-closed]] fail open နဲ့ fail closed က data မှားရင် ဆက်ခွင့်ပြုမလား ပိတ်မလား ကြိုရွေးထားတာပါ။
      [[mark:ask-question]] journey တစ်ခုက သီးခြားစီ ပျက်တဲ့ service နှစ်ခုကို အစဉ်လိုက် ခေါ်ပြီး တစ်ခုက ၉၉.၉၊ [[mark:ask-question-b]] နောက်တစ်ခုက ၉၉.၅ ရာခိုင်နှုန်း ဆိုရင် journey က အကောင်းဆုံး ဘယ်လောက် ရနိုင်လဲ?
      [[mark:pause-question]] ၉၉.၄ ရာခိုင်နှုန်းလောက်ပါ၊ မြှောက်ရလို့ ၉၉.၅ ထက်တောင် နိမ့်ပါတယ်။ ခြောက်ပတ် ပြင်ဆင်ခဲ့တဲ့ သင်္ကြန် ညသန်းခေါင် ရောက်တော့ တစ်စက္ကန့်ကို request ၃၀၀၀ အတွက် ဆောက်ထားတဲ့ top-up service ဆီ ၂၀၀၀၀ ရောက်လာပြီး server တွေ restart ဖြစ်လာပါတယ်။ ပြိုမကျဘဲ ဘယ်လို တည်ငြိမ်အောင် ထိန်းမလဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
