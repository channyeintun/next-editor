  - id: dependency-arithmetic
    chapter: "Dependency တွေကို မြှောက်ကြည့်"
    narration: >
      [[mark:close-b3]] [[mark:b4-s1]] Eats ရဲ့ product manager မနှင်းက checkout အတွက် rider တွေနဲ့ ဆိုင်တွေကို ၉၉.၉ ရာခိုင်နှုန်း ကတိပေးချင်ပါတယ်။ [[mark:b4-s1b]] checkout က Wallet ကနေ ငွေဖြတ်ပြီးမှ SMS ပို့ဖို့ notification service ကို ခေါ်ပါတယ်။ ဒီလို request တစ်ခုက အစဉ်လိုက် ခေါ်ရတဲ့ dependency တွေကို serial dependency လို့ ခေါ်ပါတယ်။
      [[mark:b4-s2]] Wallet က ၉၉.၉ ရာခိုင်နှုန်း၊ notification က ၉၉ ရာခိုင်နှုန်း ဆိုရင် နှစ်ခုလုံး အောင်မြင်မှ checkout အောင်မြင်တာမို့ availability တွေကို မြှောက်ရပြီး ၉၈.၉ ရာခိုင်နှုန်းလောက်ပဲ ရပါတယ်။ [[mark:b4-s2b]] ဒါက နှစ်ခု သီးခြားစီ ပျက်တယ်လို့ ယူဆတာပါ၊ ဘယ်လိုပဲ ဖြစ်ဖြစ် notification ရဲ့ ၉၉ ကိုတော့ မကျော်နိုင်ပါဘူး။
      [[mark:b4-s3]] ဒီ design နဲ့ ၉၉.၉ ကတိ မပေးနိုင်လို့ notification ကို queue ထဲ ထည့်လိုက်ပါတယ်။ checkout က SMS ပို့တဲ့အထိ မစောင့်တော့ဘဲ queue ထဲ ရောက်တာနဲ့ ပြီးသွားလို့ notification service ခဏ ပျက်နေလည်း checkout က ဆက်အလုပ်လုပ်ပါတယ်။
      [[mark:b4-s4]] SMS ဘက်မှာတော့ ဒီ တွက်နည်းက အကောင်းဘက်ကနေ လှည့်စားနိုင်ပါတယ်။ provider နှစ်ခုက ၁ ရာခိုင်နှုန်းစီ ပျက်တယ် ဆိုပါစို့၊ သီးခြားစီ ပျက်ရင် နှစ်ခုလုံး တစ်ပြိုင်နက် ပျက်တာ ၁၀၀၀၀ ခါမှာ တစ်ခါပဲ ရှိလို့ ၉၉.၉၉ ရာခိုင်နှုန်း ရမှာပါ။ [[mark:b4-s4b]] ဒါပေမဲ့ နှစ်ခုလုံးက operator gateway တစ်ခုတည်းကို ဖြတ်ရလို့ gateway ထက် ပိုမကောင်းနိုင်ပါဘူး၊ ဒါလည်း shared fate ပါပဲ။
      [[mark:b4-s5]] ဒါကြောင့် error budget တွေကို ရိုးရိုး ပေါင်းမယ့်အစား request က dependency တွေကို တကယ် ဘယ်လို ခေါ်လဲ၊ ဘာကို မျှသုံးလဲ အရင် ဆွဲကြည့်ပြီးမှ တွက်ပါ။
