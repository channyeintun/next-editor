  - id: risk-picture
    chapter: "Padauk ရဲ့ risk ပုံ"
    narration: >
      [[mark:close-b1]] [[mark:b2-s1]] ဒါဆို ဘယ် failure အတွက် အရင် ပြင်ဆင်မလဲ? မသီရိနဲ့ ကိုဇော်က Padauk ရဲ့ risk တွေကို ဘယ်လောက် ခဏခဏ ဖြစ်လဲ၊ ဖြစ်ရင် ဘယ်လောက် ဆိုးလဲ ဆိုတဲ့ ဝင်ရိုး နှစ်ခုပေါ်မှာ နေရာချကြည့်ပါတယ်။ ညာဘက် ရောက်လေ ခဏခဏ ဖြစ်လေ၊ အပေါ် ရောက်လေ ဆိုးလေပါ။
      [[mark:b2-s2]] ဈေးနှုန်းစာရင်း ပြတ်တာက ညတိုင်း ပို့နေလို့ ခဏခဏ ဖြစ်နိုင်ပြီး ဆိုးလည်း ဆိုးပါတယ်။ zone တစ်ခုလုံး ဆုံးရှုံးတာက ရှားပေမဲ့ ဖြစ်ရင် အရမ်း ဆိုးပါတယ်။ [[mark:b2-s2b]] SMS provider နှစ်ခုက operator gateway တစ်ခုတည်းကို မျှသုံးနေတာကတော့ တစ်ခါတလေ ပြဿနာ ပေးပြီး အလယ်အလတ်လောက် ဆိုးပါတယ်။
      [[mark:b2-s3]] ဖြစ်နိုင်ခြေကို ထိခိုက်မှုနဲ့ မြှောက်ပြီး အဆင့်စီရင် zone ဆုံးရှုံးတာလို ရှားတဲ့ ဘေးကြီးက ကိန်းဂဏန်း သေးသေးလေးပဲ ထွက်လို့ အလှည့် ဘယ်တော့မှ မရောက်ပါဘူး။ [[mark:b2-s3b]] တစ်ခါ ဖြစ်ရုံနဲ့ ကုမ္ပဏီကိုပါ ထိနိုင်တဲ့ risk မှာ ဒီနည်း အလုပ်မဖြစ်လို့ ရှားပေမဲ့ ဆိုးတဲ့ risk ကိုလည်း plan တစ်ခု ပေးရပါတယ်။
      [[mark:b2-s4]] ဒါကြောင့် စာရင်း ပြဿနာအတွက် ဈေးပေါပြီး အမြဲ ဖွင့်ထားတဲ့ check တွေ ထည့်ပါတယ်။ zone ဆုံးရှုံးတာအတွက်တော့ ဒီနေ့ ဖြစ်ရင် ဘာလုပ်မလဲ ဆိုတဲ့ plan ကို အခုပဲ ရေးပြီး အမြစ်ကနေ တစ်ဆင့်ချင်း ပြင်ပါတယ်။ [[mark:b2-s4b]] SMS gateway ကိုတော့ အခုအတွက် လက်ခံပြီး ဘာကြောင့်လဲ၊ ဘယ်တော့ ပြန်ကြည့်မလဲ ရေးမှတ်ထားပါတယ်။ ပြင်ပုံကလည်း လက်နဲ့ ပြင်တာ၊ automation နဲ့ ပြင်တာ၊ architecture ပြောင်းပြီး အားနည်းချက်ကို ဖယ်ပစ်တာ ဆိုပြီး သုံးမျိုး ရှိပါတယ်။
    sources:
