# SRE from zero, lesson 23: Failure ကို ဘောင်ခတ်ထားတဲ့ design (Burmese concept lesson).
#
# Built from the approved voice script
# docs/sre-course/voice-scripts/sre-23-containing-failure.md. Every spoken
# character is that script's "> " lines, unchanged; each ⟪…⟫ marker became a
# [[mark:…]] at the same place. Check it with:
#   bun ~/Documents/sre-course/work/check-narration.ts \
#     docs/sre-course/voice-scripts/sre-23-containing-failure.md \
#     src/studio/scripts/sre-23-containing-failure.yaml
#
# Nothing runs: deck pages and the whiteboard carry the lesson, and notes.md is
# the recap. The workspace and runtime follow the validated no-code skeleton
# (WebContainer, empty init command, a harmless dev script).
#
# The arc: the half-written price list (cover, then the 40% page); board B1 (P5
# bars): the designed range with normal nights, the tall night beyond it, red
# collapse vs green dip-and-recover, then the wider range each lesson buys;
# board B2 (P5 two-axis placement): how often against how bad, the three risks,
# the struck-through "likelihood × impact" and Padauk's three decisions; board
# B3 (P2 comb): three zones, the shared session cache, a cache per zone, more
# and smaller domains, and the protected known-good copy; board B4 (P1 flow +
# P2 fan-in): Eats checkout, Wallet 99.9% and notification 99% multiplying to
# 98.9%, the struck promise and the queue, then two SMS providers into one
# operator gateway; pages: Eats checkout's dependency card, three cards, the
# same cards with the third highlighted, then before and after; board B5 (P1
# flow): the checks in front of the price list, reject and keep the last good
# version, the zone-by-zone rollout, fail open and fail closed; the "this week"
# page; recap on notes.md.
#
# Twelve marks add no spoken text and each sits at an existing ။ or ၊. Eleven
# let a board's later boxes land as the narration names them, so no step adds
# more than three labelled boxes: b1-s2b lands B1's green dip-and-recover after
# the red collapse; b2-s2b lands "SMS gateway မျှသုံး" after the other two risks;
# b2-s3b strikes through "ဖြစ်နိုင်ခြေ × ထိခိုက်မှု" once the sentence about it ends;
# b2-s4b lands the SMS decision; b3-s2b lands the red "zone A ပျက် = 100% ပျက်"
# after the shared cache is on the board; b3-s4b lands the second line of the
# orange domain note ("traffic ကို အဆင့်လိုက် လွှဲ"); b4-s1b lands Wallet and
# notification after Eats checkout; b4-s2b lands the 98.9% result and its note
# once the multiplication is spoken (b4-s2 itself only draws the arrow towards
# it); b4-s4b lands the operator gateway after the two providers; b5-s1b lands
# the two checks as the narration names them and b5-s4b the fail-closed line.
# The twelfth, ask-question-b, splits the recap question at its ၊: ask-question
# is the voice script's ⟪select မေးခွန်း⟫, pause-question its ⟪pause 3s⟫, and
# select-question hangs off ask-question-b (see the note there).
# The title "Wallet" is furniture: it is drawn on its own with no drawMs and the
# three zone boxes follow through afterAction, so no apply counts more than
# three labelled boxes. No page or board step holds longer than ~30 s at
# 70 ms/char (the longest is l23_p02c at ~29.6 s), so no pacing page was added
# beyond the voice script's own.
#
# ⟪close board⟫ straight into the next board (scenes 3 to 5) wipes the open
# board 400 ms early (whiteboard.apply clear) instead of closing the panel, so
# the editor does not flash between two boards, as in lesson 8; the next board
# then draws with open: true, clear: true as usual. A board followed by a deck
# page closes the panel (open: false) 400 ms before the page, as in Module 1,
# and a page followed by a board closes the page 400 ms before.
#
# Boards. Colour jobs: #1e1e1e ink (paints white) for titles, axes, arrows and
# buses; blue the thing named (the designed range, the normal nights, the risks,
# the zones, the flow's boxes, the SMS providers); green healthy or the fix (the
# dip-and-recover bars, "a cache per zone", the queue, the last good version,
# the known-good copy); red failure or limit (the collapse bar, losing zone A,
# the operator gateway, the reject box, the struck promise); orange the caveat
# (the shared cache, "likelihood × impact", the accepted gateway risk, the
# domain note, the "promise 99.9%?", the two checks, fail open and fail closed);
# violet result or flow (plan now and fix step by step, the 98.9% result, the
# rollout to the servers). A label on two lines is one text asset per line, so
# each line meets the 0.55 em width rule on its own; every label was also
# measured in Chrome with the fallback font (WORK/opencode/wb-fit.mjs) and
# fits the box it sits in.
#
# Deck pages: deck "Next Editor · SRE 5C · Design and platforms", published; the
# /pub URL below is final. The deck holds only the kit pages until this
# lesson's pages are built from the page plan, so until then the Director
# reports page "l23_p01" missing from the published deck. l23_p02b repeats
# l23_p02 with its third card highlighted yellow. Page plan:
# ~/Documents/sre-course/work/pages/sre-23-containing-failure.json
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/sre-23-containing-failure.yaml
#   bun scripts/studio-compile-check.ts src/studio/scripts/sre-23-containing-failure.yaml
