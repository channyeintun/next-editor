      # The voice script's ⟪select မေးခွန်း⟫ and ⟪pause 3s⟫, the way the Module 1
      # reviewers fixed the pause: a select at ask-question would drag under the
      # question and one at pause-question under the answer, so the question-line
      # select hangs off the question with an offset: it starts about as the
      # question ends, drags in silence, and the answer waits for it. The question
      # is 161 characters, so one offset cannot fit 55 and 70 ms/char at once
      # (it would leave ~0 s of quiet at 70 or over 2.5 s at 55); ask-question-b
      # splits it at its ၊ and the select hangs off the 78-character second half,
      # which is the lesson-16 case (400 + 78 x 70 = 5860 ms; an offset above
      # ~6000 trips compile-check's 2.5 s inserted-silence warning at 55 ms/char).
      - id: select-question
        type: editor.select
        at: { mark: ask-question-b, offsetMs: 5900 }
        target:
          file: notes.md
          text: "မေးခွန်း: journey က သီးခြား service 2 ခုကို အစဉ်လိုက် ခေါ်တယ်၊ 99.9% နဲ့ 99.5%။ အကောင်းဆုံး ဘယ်လောက် ရနိုင်လဲ?"
          occurrence: 1

