    narration: >
      [[mark:close-b5]] [[mark:show-p03]] failure တစ်ခု ဘယ်အထိ ပျံ့နိုင်လဲ သိအောင် ဒီအပတ် စလုပ်စရာ သုံးခုပါ။ ကိုယ့် zone တွေ တကယ်တော့ database၊ cache၊ gateway လို ဘာတွေကို မျှသုံးနေလဲ စာရင်း လုပ်ကြည့်ပါ။ အရေးအကြီးဆုံး journey ရဲ့ dependency တွေကို ဆွဲပြီး availability တွေကို မြှောက်ကြည့်ပါ။ ပြီးတော့ ညတိုင်း ဝင်လာတဲ့ data တစ်ခုမှာ မနေ့ကထက် သေးလွန်းနေလား စစ်တဲ့ check တစ်ခု ထည့်ပါ။
