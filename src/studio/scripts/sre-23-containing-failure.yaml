  - id: bad-input
    chapter: "Bad input"
    narration: >
      [[mark:close-p02c]] [[mark:b5-s1]] ည ၁ နာရီက ဈေးနှုန်းစာရင်းဆီ ပြန်သွားရအောင်။ ပုံမှန်နဲ့ မတူတဲ့ ဒါမှမဟုတ် မှားနေတဲ့ input၊ bad input က attacker ဆီကပဲ မဟုတ်ဘဲ ကိုယ့် job ဒါမှမဟုတ် dependency ကနေလည်း လာနိုင်ပါတယ်။ စာရင်းက တစ်ဝက်မှာ ပြတ်နေတာ၊ အလွတ် ဖြစ်နေတာ၊ ဟောင်းနေတာ ဖြစ်နိုင်ပါတယ်။ [[mark:b5-s1b]] ဒီတော့ server တွေ မယုံခင် မနေ့ကထက် အများကြီး သေးနေလား၊ တစ်နာရီထက် ဟောင်းနေလား စစ်ပါတယ်။
      [[mark:b5-s2]] check မအောင်ရင် စာရင်းအသစ်ကို ငြင်းပြီး alert တက်ပါတယ်၊ server တွေကတော့ နောက်ဆုံး ကောင်းခဲ့တဲ့ version ကို ဆက်သုံးပါတယ်။ သံသယ ဖြစ်ရင် မနေ့က စာရင်းနဲ့ ဆက် run နေတာက အန္တရာယ် အနည်းဆုံးပါ။
      [[mark:b5-s3]] check ကို အောင်သွားရင်တောင် server တိုင်းဆီ တစ်ခါတည်း မပို့ပါဘူး။ server တိုင်း မျှသုံးတဲ့ data က နေရာတိုင်းကို တစ်ပြိုင်နက် ရောက်သွားလို့ အန္တရာယ် အများဆုံး ပြောင်းလဲမှုပါ၊ ဒါကြောင့် code လိုပဲ zone တစ်ခုချင်း rollout လုပ်ရပါတယ်။
      [[mark:b5-s4]] data ဖတ်တဲ့ service တိုင်းကလည်း data မှားနေရင်၊ အလွတ် ဖြစ်နေရင် ဘာလုပ်မလဲ ကြိုဆုံးဖြတ်ထားရပါမယ်။ fraud blocklist အလွတ်ကို ယုံရင် ဘာမှ မတားတော့လို့ အကုန် ဖြတ်သွားပါတယ်၊ ဒါက fail open ပါ။ [[mark:b5-s4b]] merchant စာရင်း အလွတ်ကို ယုံရင်တော့ ဆိုင်တိုင်းရဲ့ ငွေချေမှု ပိတ်ကုန်မှာမို့ fail closed ပါ၊ ဘယ်ဟာ ဘေးကင်းလဲ ဆိုတာ data အလိုက် ကွာပါတယ်။
    sources:
