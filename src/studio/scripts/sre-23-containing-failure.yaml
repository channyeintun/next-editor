  - id: independent
    chapter: "တကယ် သီးခြား ဖြစ်ရဲ့လား"
    narration: >
      [[mark:close-b2]] [[mark:b3-s1]] zone ဆုံးရှုံးရင် သုံးမယ့် plan ကို ရေးရင်း ကိုဇော်က lesson ၂၀ မှာ zone သုံးခုဆီ ဖြန့်ခဲ့တဲ့ Wallet ကို ပြန်စစ်ပါတယ်။ zone တစ်ခုစီက ပြဿနာ တစ်ခုတည်းကြောင့် အတူ ပျက်နိုင်တဲ့ အုပ်စု၊ failure domain ဖြစ်လို့ zone တစ်ခု ပျက်ရင် Wallet ရဲ့ သုံးပုံတစ်ပုံပဲ ထိမှာပါ၊ blast radius ကို ကျဉ်းအောင် ခွဲထားတာပါ။
      [[mark:b3-s2]] ဒါပေမဲ့ request လမ်းကြောင်းကို လိုက်ကြည့်တော့ zone သုံးခုလုံးက login session တွေကို zone A ထဲက cache တစ်ခုတည်းကနေ ဖတ်နေတာ တွေ့ပါတယ်။ [[mark:b3-s2b]] zone A ပျက်ရင် သုံးပုံတစ်ပုံ မဟုတ်ဘဲ Wallet တစ်ခုလုံး ရပ်မှာပါ။ ဒီလို တစ်ခုကို မျှသုံးလို့ အတူ ပျက်ကြတာကို lesson ၈ ကလိုပဲ shared fate လို့ ခေါ်ပါတယ်။
      [[mark:b3-s3]] ဒီတော့ zone တစ်ခုစီမှာ ကိုယ်ပိုင် session cache ထားလိုက်ပါတယ်။ zone တွေ သီးခြားလို့ ထင်ရုံနဲ့ မလုံလောက်ပါဘူး၊ deployment တွေကို failure domain နဲ့ ကိုက်အောင် ထားပြီး zone တစ်ခု ဆုံးရှုံးရင် ဘာတွေ ပါသွားမလဲ ဂဏန်းနဲ့ တွက်ကြည့်ရပါမယ်။
      [[mark:b3-s4]] domain တွေကိုလည်း ပိုကြီးအောင် မချဲ့ဘဲ domain အသစ် ထပ်တိုးရပါမယ်။ domain ကြီး တစ်ခု ပျက်ရင် သူ့ traffic အကုန် ကျန်တဲ့ domain တွေဆီ တစ်ပြိုင်နက် ပြေးလာပြီး သူတို့ကိုပါ လဲစေနိုင်လို့ပါ။ [[mark:b3-s4b]] ပြန်ကောင်းလာတဲ့ domain ကိုလည်း traffic တစ်ခါတည်း ပြန်ဝင်ရင် ထပ်လဲနိုင်လို့ အဆင့်လိုက်ပဲ ပြန်လွှဲပါတယ်။
      [[mark:b3-s5]] ဈေးနှုန်းစာရင်းလို အမှားက zone သုံးခုလုံးကို ထိသွားရင်ကော? zone တစ်ခုကို traffic ကနေ ခွဲထုတ်ပြီး ကောင်းမှန်းသိတဲ့ မိတ္တူကနေ ပြန်ပြင်ပါတယ်။ config၊ data နဲ့ binary တွေကို သီးသန့် ကာကွယ်ထားတဲ့ ဒီ မိတ္တူက ပြောင်းလဲမှု အသစ်တွေကို နောက်ဆုံးမှ လက်ခံပါတယ်။ ပြီးရင် အဲဒီ zone ကို ပြန်ချိတ်ပြီး ကျန်တဲ့ zone တွေမှာ တစ်ခုချင်း ထပ်လုပ်ပါတယ်။
