    lessonType: javascript
    name: SRE from zero
    entryFilePath: notes.md
    sidebarStartsCollapsed: true
    files:
      notes.md: |
        # Failure ကို ဘောင်ခတ်ထားတဲ့ design

        - resilience — design ဘောင် အပြင်က failure ကိုပါ ဘောင်ခတ်ပြီး ပြန်ကောင်းလာ
        - failure domain — ပြဿနာ တစ်ခုတည်းကြောင့် အတူ ပျက်နိုင်တဲ့ အုပ်စု
        - blast radius — မှားရင် ထိခိုက်မယ့် နယ်ပယ်
        - serial dependency — အစဉ်လိုက် ခေါ်ရလို့ availability တွေ မြှောက်ရ
        - shared fate — တစ်ခုတည်းကို မျှသုံးလို့ အတူ ပျက်
        - fail open / fail closed — data မှားရင် ဆက်ခွင့်ပြုမလား၊ ပိတ်မလား

        မေးခွန်း: journey က သီးခြား service 2 ခုကို အစဉ်လိုက် ခေါ်တယ်၊ 99.9% နဲ့ 99.5%။ အကောင်းဆုံး ဘယ်လောက် ရနိုင်လဲ?
