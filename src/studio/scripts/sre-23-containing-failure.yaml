  - id: dependency-card
    chapter: "Dependency card"
    narration: >
      [[mark:close-b4]] [[mark:show-p02]] Eats အဖွဲ့က ဒါတွေကို dependency card တစ်ခုထဲ ချရေးပါတယ်။ မရှိမဖြစ် လိုတာက Wallet ဖြစ်ပြီး notification ကိုတော့ queue ကနေ ပို့ပါတယ်။ loyalty နဲ့ ဟင်းပွဲ ဓာတ်ပုံ service တွေမှာတော့ test ထဲ failure ကို inject လုပ်ကြည့်ပြီး checkout ဆက် အောင်မြင်မှ optional လို့ ရေးပါတယ်၊ မအောင်မြင်ရင် မရှိမဖြစ်ထဲ ထည့်ပါတယ်။
      [[mark:show-p02b]] ကိုယ့်ကို မှီခိုနေတဲ့သူတွေကို ပေးရမယ့် ကတိလည်း card ပေါ်မှာ ပါပါတယ်။ checkout က Wallet ရဲ့ ၉၉.၉ ကို မကျော်နိုင်လို့ မနှင်းက rider တွေနဲ့ ဆိုင်တွေကို ၉၉.၅ ရာခိုင်နှုန်းပဲ ကတိပေးပါတယ်။ ပြဿနာကြီး ဖြစ်တဲ့နေ့ ဘယ်သူ့အတွက် အရင် ပြန်ဖွင့်ပေးမလဲ ဆိုတာလည်း ဒီ ကတိတွေနဲ့ ဆုံးဖြတ်ပါတယ်။
      [[mark:show-p02c]] အရင်က SMS gateway ပျက်တုန်းက notification အဖွဲ့ရော Top-up အဖွဲ့ရော တစ်ဖက်အဖွဲ့က ပိုင်တယ်လို့ ထင်နေခဲ့ပါတယ်။ ဒါကြောင့် အခု မျှသုံးတဲ့ dependency တိုင်းမှာ owner တစ်ယောက်ကို နာမည်နဲ့ ရေးပြီး owner မရှိတဲ့ ကွက်လပ်တွေကို ခေါင်းဆောင်တွေက လိုက်ရှာပါတယ်။ SMS gateway ကို ပြန်ကြည့်တဲ့နေ့ ရောက်တော့ gateway ကို မဖြတ်တဲ့ ကိုယ်ပိုင် လမ်းကြောင်းနဲ့ provider တစ်ခုကို fallback ထည့်ပါတယ်၊ ဈေးပိုကြီးပေမဲ့ gateway နဲ့ အတူ မပျက်ပါဘူး။
    sources:
