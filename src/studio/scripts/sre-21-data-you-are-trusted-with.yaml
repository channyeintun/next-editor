  - id: recap
    narration: >
      [[mark:close-p06]] [[mark:open-notes]] ဆရာမရဲ့ စာ တစ်စောင်က data အကြောင်း အများကြီး သင်ပေးခဲ့ပါတယ်။ [[mark:sel-entrusted]] ယုံကြည်ပြီး အပ်ထားတဲ့ data က ပျက်ရင် outage လို ပြန်စလို့ မရလို့ tool မရွေးခင် business၊ ဥပဒေ၊ ကျင့်ဝတ် မေးခွန်းတွေကို အရင် မေးရပါတယ်။ [[mark:sel-soft-delete]] soft delete က ပြန်ယူလို့ရအောင် ခဏ ထားတာ၊ hard delete က deadline မတိုင်ခင် လုံးဝ ဖျက်ပစ်တာပါ။
      [[mark:sel-original-derived]] original data ကို ပြန်ထုတ်လို့ မရပေမဲ့ derived data ကို ပြန်ဆောက်လို့ ရပါတယ်။ [[mark:sel-least-privilege]] least privilege က တကယ် လိုတဲ့ permission လောက်ပဲ ပေးတာပါ။ [[mark:sel-reconciliation]] reconciliation က ပုံမှန် တိုက်စစ်တာ ဖြစ်ပြီး bug ကြောင့် ပြင်ရတဲ့ repair မှာတော့ log ထားပြီး alert တက်ရပါမယ်။ [[mark:sel-question]] derived data ဖြစ်တဲ့ balance table တစ်ခုကို ပြန်ဆောက်ရင် ၆ နာရီ ကြာတယ် ဆိုပါစို့၊ [[mark:ask-question]] backup ယူထားမလား၊ မယူဘဲ ထားမလား?
      [[mark:pause-question]] ယူထားသင့်ပါတယ်၊ ပြန်ဆောက်နေတဲ့ ၆ နာရီလုံး product ကို သုံးလို့ မရလို့ပါ။ လကုန် စာရင်းပိတ်တော့ cashback bug တစ်ခုက Padauk ရဲ့ အဟောင်းဆုံး backup ထက်တောင် စောပြီး စခဲ့တာ တွေ့ရပါတယ်။ နောက်ပြန် ဘယ်အထိ သွားလို့ ရမလဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book, 1st ed: Data Integrity: What You Read Is What You Wrote",
          url: "https://sre.google/sre-book/data-integrity/",
        }
      - {
          title: "Building Secure and Reliable Systems, Ch 9: Design for Recovery",
          url: "https://google.github.io/building-secure-and-reliable-systems/raw/ch09.html",
        }
    actions:
      - { id: close-p06, type: slide.close, at: { mark: close-p06 } }
      - {
          id: open-notes,
          type: workspace.openFile,
          at: { mark: open-notes, offsetMs: 300 },
          path: notes.md,
        }
      - {
          id: sel-entrusted,
          type: editor.select,
          at: { mark: sel-entrusted },
          target: { file: notes.md, text: "ယုံကြည်ပြီး အပ်ထားတဲ့ data", occurrence: 2 },
        }
      - {
          id: sel-soft-delete,
          type: editor.select,
          at: { mark: sel-soft-delete },
          target: { file: notes.md, text: "soft delete", occurrence: 1 },
        }
      - {
          id: sel-original-derived,
          type: editor.select,
          at: { mark: sel-original-derived },
          target: { file: notes.md, text: "original / derived", occurrence: 1 },
        }
      - {
          id: sel-least-privilege,
          type: editor.select,
          at: { mark: sel-least-privilege },
          target: { file: notes.md, text: "least privilege", occurrence: 1 },
        }
      - {
          id: sel-reconciliation,
          type: editor.select,
          at: { mark: sel-reconciliation },
          target: { file: notes.md, text: "reconciliation", occurrence: 1 },
        }
      # The voice script's ⟪select မေးခွန်း⟫ and ⟪pause 3s⟫, the way the Module 1
      # reviewers fixed the pause (as in lessons 3 and 5). sel-question marks where
      # the voice script puts the select, but a select there would drag under the
      # question and leave no pause, and one at pause-question would drag under the
      # answer's first words (the scheduler holds only the dialog after its
      # anchor's). So the question-line select hangs off ask-question, one more mark
      # after the question's ၊ pause, so the dialog it follows is only the
      # question's last part (32 characters): the select starts about as the
      # question ends, its drag runs in silence, and the answer at pause-question
      # waits for it. 3500 leaves about 2.8 / 2.3 / 1.5 s before the answer at
      # 55 / 70 / 95 ms per char; an offset above ~3530 trips compile-check's 2.5 s
      # inserted-silence warning at 55.
      - id: select-question
        type: editor.select
        at: { mark: ask-question, offsetMs: 3500 }
        target:
          file: notes.md
          text: "မေးခွန်း: derived balance table ကို ပြန်ဆောက်ရင် 6 နာရီ ကြာတယ်။ backup ယူမလား?"
          occurrence: 1

checks:
  # 500, not 300: google-svg deck pages stall the main thread at show/close.
  - { type: timing.p95Ms, max: 500 }
