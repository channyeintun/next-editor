# SRE from zero, lesson 21: Data you are trusted with (Burmese concept lesson).
#
# Built from the approved voice script
# docs/sre-course/voice-scripts/sre-21-data-you-are-trusted-with.md. Every
# spoken character is that script's "> " lines, unchanged; each ⟪…⟫ marker
# became a [[mark:…]] at the same place. Check it with:
#   bun ~/Documents/sre-course/work/check-narration.ts \
#     docs/sre-course/voice-scripts/sre-21-data-you-are-trusted-with.md \
#     src/studio/scripts/sre-21-data-you-are-trusted-with.yaml
#
# Nothing runs: deck pages and the whiteboard carry the lesson, and notes.md is
# the recap. The workspace and runtime follow the validated no-code skeleton
# (WebContainer, empty init command, a harmless dev script).
#
# The derived-data example is the wallet balance table (B1's "balance table"
# store and its "derived" tag, l21_p02c, the recap question and notes.md), as
# the voice script now has it.
#
# Six marks add no spoken text and sit at an existing ။ or ၊:
# - b1-s1b splits B1 step 1 so no apply adds more than three labelled boxes:
#   the request, the bus and the database first, then the cache and the
#   balance table on the sentence that names them.
# - b1-s3b and b1-s3c give B1's three tags a sentence each (original, derived,
#   personal data), instead of "derived" and "personal data" landing 11-16 s
#   before they are named.
# - b3-s2b and b3-s3b land B3's bug-repair lane and its constraint box on the
#   sentence that names each, instead of ~16 s and ~8 s early.
# - ask-question sits after the recap question's ၊ pause so the question-line
#   select can make the ⟪pause 3s⟫, as in lessons 3 and 5 (see
#   select-question). sel-question is the voice script's ⟪select မေးခွန်း⟫; it
#   only splits the recap's reconciliation line from the question.
# Pacing: at 70 ms/char no page or board step holds longer than ~32 s (l21_p04
# with its break-glass paragraph; l21_p03c 31 s, the cover 30 s), and the
# longest dialog is 446 characters (l21_p04's), so no pacing page or step was
# added.
#
# No board follows another board: a board followed by a deck page closes the
# panel (open: false) 400 ms before the page, and a deck page followed by a
# board closes the page 400 ms before, as in Module 1. Every board opens with
# open + clear.
#
# Boards (B1 P2 comb, B2 P1 flow with a note under it, B3 P6 lanes). Colour
# jobs: #1e1e1e ink (paints white) for the request box, the buses, the arrows
# and the store names; blue the thing named (the six stores, soft delete, the
# nightly check, the "derived" tag); green healthy or done (the "original"
# tag, the designed reconciliation lane, the constraint); red failure or a hard
# limit (hard delete and its deadline, silent fix-ups that hide bugs); orange
# the caveat (the "personal data" tag, the TTL note, the bug-repair lane). B1
# puts its six stores in two columns of three on one bus, as the voice script
# asks: the bus carries on under the first column and up into the second (a
# U-shaped bus), because there are no left or up arrows and an arrow from the
# first bus could not reach the second column without crossing the first.
# Each store box leaves room under its name for step 3's tag, a small outlined
# label inside the box. B3's two lanes leave the nightly check through a short
# bus, so both read as the two kinds of mismatch it finds. A label on two lines
# is one text asset per line, so each line meets the 0.55 em width rule on its
# own; every label was also measured in Chrome with Excalidraw's Virgil font
# (wb-fit.mjs) and stays inside its box (Latin can run past the rule:
# "database" is 133 px against the rule's 124, so its text box is 145 px wide).
#
# Deck pages: deck "Next Editor · SRE 5B · Capacity and data", published; the
# /pub URL below is final. Its l21 pages are built later from the page plan, so
# until then the Director reports page "l21_p01" missing from the published
# deck (with the deck URL swapped for an unreachable one it validates: 36
# dialogs, no critic notes). The voice script asks for l21_p02 as a plain
# contrast with no teal "better" colouring (its right column is the harder
# case); the page plan notes it. Page plan:
# ~/Documents/sre-course/work/pages/sre-21-data-you-are-trusted-with.json
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/sre-21-data-you-are-trusted-with.yaml
#   bun scripts/studio-compile-check.ts src/studio/scripts/sre-21-data-you-are-trusted-with.yaml
