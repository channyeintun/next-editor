      notes.md: |
        # ယုံကြည်ပြီး အပ်ထားတဲ့ data

        - ယုံကြည်ပြီး အပ်ထားတဲ့ data — ပြန်စလို့ မရ၊ tool မရွေးခင် business၊ ဥပဒေ၊ ကျင့်ဝတ်
        - soft delete / hard delete — undo window အတွင်း ပြန်ယူလို့ရ / deadline မတိုင်ခင် လုံးဝ ဖျက်
        - original / derived — ပြန်ထုတ်လို့ မရ / ပြန်ဆောက်လို့ရ၊ ကြာရင် original လို ကာကွယ်
        - least privilege — လူရော service ရော လိုတဲ့ permission လောက်ပဲ
        - reconciliation — design ထဲက ပုံမှန် တိုက်စစ်၊ bug repair ကို log ထားပြီး alert

        မေးခွန်း: derived balance table ကို ပြန်ဆောက်ရင် 6 နာရီ ကြာတယ်။ backup ယူမလား?
