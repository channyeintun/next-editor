        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-js-same
        type: expect.preview
        at: { afterAction: expect-tea }
        timeoutMs: 5000
        target: { by: testId, value: ts-js-1 }
        textContains: "constructor(name, price) {"
