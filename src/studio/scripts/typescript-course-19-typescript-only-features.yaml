          { file: src/menu.ts, text: "constructor(name: string, price: number)", occurrence: 1 }

  - id: parameter-properties
    chapter: "Parameter property"
    narration: >
      [[mark:type-cup]] အခု ခွက်အတွက် class တစ်ခုကို ဖိုင်ရဲ့ အပေါ်ဆုံးမှာ ရေးပါမယ်။ ဒီတစ်ခါ
      property တွေကို သီးသန့် မကြေညာဘဲ၊ constructor ရဲ့ parameter တွေ ရှေ့မှာ public ကို
      ထည့်ရေးပါမယ်။ [[mark:select-public]] ဒါကို parameter property လို့ ခေါ်ပါတယ်။ parameter
      ရှေ့မှာ public ရယ်၊ private ရယ်၊ read only ရယ် လို စကားလုံး ပါရင်၊ TypeScript က အဲဒီ နာမည်နဲ့ property
      ကြေညာပေးပြီး တန်ဖိုးကိုပါ ထည့်ပေးလို့၊ constructor ရဲ့ body က အလွတ်ပဲ ဖြစ်နေပါတယ်။
      [[mark:read-cup-js]] JavaScript output ရဲ့ အပေါ်ဆုံးကို ကြည့်ပါ။ Cup ထဲမှာ property ကြေညာတဲ့
      line နှစ်ကြောင်းနဲ့ တန်ဖိုး ထည့်တဲ့ line နှစ်ကြောင်း ပေါ်လာပါတယ်။ ဒီ line တွေက TypeScript
      ဖိုင်ထဲမှာ မရှိပါဘူး၊ TypeScript က ရေးပေးလိုက်တာပါ။ အောက်က MenuItem နဲ့ ယှဉ်ကြည့်ရင် ပုံစံ
      တစ်ထပ်တည်းပါပဲ။ [[mark:open-main-2]] main ဖိုင်မှာ ၁၈၀၀ ကျပ် တန် ခွက်ကြီး တစ်ခွက်ကိုပါ
      ထုတ်ပြကြည့်ရအောင်။ [[mark:read-cup-output]] Output မှာ Cup object ကို အရွယ်အစားနဲ့ ဈေးနှုန်း
      နှစ်ခုလုံးနဲ့ မြင်ရပါပြီ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 9: TypeScript-only Features (class parameter properties)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/typescript-only-features",
        }
      - {
          title: "TypeScript Handbook: Classes (parameter properties)",
          url: "https://www.typescriptlang.org/docs/handbook/2/classes.html#parameter-properties",
        }
    actions:
      - id: type-cup
        type: editor.type
        at: { mark: type-cup }
        target: { file: src/menu.ts, after: "", occurrence: 1 }
        text: "export class Cup {\n  constructor(public size: string, public price: number) {}\n}\n\n"
        cadence: line-by-line
      - id: select-public
        type: editor.select
        at: { mark: select-public }
        target:
          { file: src/menu.ts, text: "public size: string, public price: number", occurrence: 1 }
      - id: expect-cup-js
        type: expect.preview
        at: { afterAction: type-cup }
        timeoutMs: 8000
        target: { by: testId, value: ts-js-1 }
        textContains: "this.size = size;"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-cup-fields
        type: expect.preview
        at: { afterAction: expect-cup-js }
        timeoutMs: 5000
        target: { by: testId, value: ts-js-1 }
        textContains: "export class Cup {\n    size;\n    price;"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: open-main-2
        type: workspace.openFile
        at: { mark: open-main-2 }
        path: src/main.ts
      - id: import-cup
        type: editor.type
        at: { afterAction: open-main-2 }
        target: { file: src/main.ts, after: "import { MenuItem", occurrence: 1 }
        text: ", Cup"
        cadence: fast-explainer
      - id: print-cup
        type: editor.type
        at: { afterAction: import-cup }
        target: { file: src/main.ts, after: "console.log(tea", occurrence: 1 }
        text: ', new Cup("large", 1800)'
        cadence: fast-explainer
      - id: expect-cup-output
        type: expect.preview
        at: { afterAction: print-cup }
        timeoutMs: 8000
        target: { by: testId, value: ts-out-1 }
        textContains: "Cup { size: 'large', price: 1800 }"
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: numeric-enum
    chapter: "Enum"
    narration: >
      [[mark:open-menu-3]] နောက် feature က enum ပါ။ enum ဆိုတာ ဆက်စပ်နေတဲ့ ကိန်းသေ တန်ဖိုးတွေကို
      နာမည် တစ်ခုအောက်မှာ စုထားတာပါ။ [[mark:type-cupsize]] ခွက် အရွယ်အစား နှစ်မျိုးအတွက် enum
      ရေးပါမယ်။ တန်ဖိုး မပေးထားရင် member တွေက သုည၊ တစ် ဆိုပြီး ဂဏန်း အစဉ်လိုက် ရလို့ numeric enum
      လို့ ခေါ်ပါတယ်။ [[mark:read-enum-js]] JavaScript output မှာ variable တစ်ခုနဲ့ ချက်ချင်း run
      သွားတဲ့ function တစ်ခု ပေါ်လာပြီး၊ အဲဒီ function က object ကို ဖြည့်ပေးပါတယ်။ line
      တစ်ကြောင်းမှာ နှစ်ထပ် ထည့်ထားတာကို ကြည့်ပါ။ Small ကို သုညနဲ့ တွဲပြီး၊ သုညကိုလည်း Small နဲ့
      ပြန်တွဲထားပါတယ်။ ဒါကြောင့် နာမည်နဲ့ ဂဏန်းကို ရှာလို့ ရသလို ဂဏန်းနဲ့ နာမည်ကိုလည်း ပြန်ရှာလို့
      ရပြီး၊ ဒါကို reverse mapping လို့ ခေါ်ပါတယ်။ [[mark:open-main-3]] main ဖိုင်မှာ ဂဏန်းကနေ နာမည်
      ပြန်ရှာတဲ့ function ရေးပြီး ခွက်ကြီးနဲ့ ခေါ်ကြည့်ပါမယ်။ [[mark:read-large]] Output မှာ Large
      ဆိုတဲ့ နာမည် ပေါ်လာပါပြီ။ [[mark:select-two-uses]] ဒီ function မှာ CupSize ကို parameter ရဲ့
      type အဖြစ်ရော၊ function ထဲမှာ တန်ဖိုး အဖြစ်ရော သုံးထားတာကိုလည်း သတိထား ကြည့်ပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 9: TypeScript-only Features (numeric enums, reverse mapping)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/typescript-only-features",
        }
      - {
          title: "TypeScript Handbook: Enums (numeric enums, reverse mappings)",
          url: "https://www.typescriptlang.org/docs/handbook/enums.html#reverse-mappings",
        }
    actions:
      - id: open-menu-3
        type: workspace.openFile
        at: { mark: open-menu-3 }
        path: src/menu.ts
      - id: type-cupsize
        type: editor.type
        at: { mark: type-cupsize }
        target: { file: src/menu.ts, after: "", occurrence: 1 }
        text: "export enum CupSize {\n  Small,\n  Large,\n}\n\n"
        cadence: line-by-line
      - id: expect-enum-js
        type: expect.preview
        at: { afterAction: type-cupsize }
        timeoutMs: 8000
        target: { by: testId, value: ts-js-1 }
        textContains: 'CupSize[CupSize["Small"] = 0] = "Small";'
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: open-main-3
        type: workspace.openFile
        at: { mark: open-main-3 }
        path: src/main.ts
      - id: import-cupsize
        type: editor.type
        at: { afterAction: open-main-3 }
        target: { file: src/main.ts, after: "import { MenuItem, Cup", occurrence: 1 }
        text: ", CupSize"
        cadence: fast-explainer
      - id: type-cupname
        type: editor.type
        at: { afterAction: import-cupsize }
        target:
          {
            file: src/main.ts,
            after: "console.log(tea, new Cup(\"large\", 1800));\n",
            occurrence: 1,
          }
        text: "\nfunction cupName(size: CupSize) {\n  return CupSize[size];\n}\nconsole.log(cupName(CupSize.Large));\n"
        cadence: line-by-line
      - id: expect-large
        type: expect.preview
        at: { afterAction: type-cupname }
        timeoutMs: 8000
        target: { by: testId, value: ts-out-2 }
        textContains: "Large"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-large-clean
        type: expect.preview
        at: { afterAction: expect-large }
        timeoutMs: 5000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: select-two-uses
        type: editor.select
        at: { mark: select-two-uses }
        target:
          {
            file: src/main.ts,
            text: "function cupName(size: CupSize) {\n  return CupSize[size];",
            occurrence: 1,
          }

  - id: any-number
    narration: >
      [[mark:type-fromform]] numeric enum မှာ သတိထားစရာ တစ်ခု ရှိပါတယ်။ ဖောင်ကနေ ဝင်လာတဲ့ အရွယ်အစား
      နံပါတ် ငါးကို ဂဏန်း ပြောင်းပြီး ဒီ function ထဲ ပို့ကြည့်ရအောင်။ [[mark:read-undefined]] error
      မပေါ်ပါဘူး၊ ဒါပေမဲ့ Output မှာ undefined ထွက်လာပါတယ်။ numeric enum က number type ရှိတဲ့
      တန်ဖိုး မှန်သမျှကို လက်ခံလို့ပါ။ enum ထဲမှာ မရှိတဲ့ ဂဏန်းကို code ထဲ တိုက်ရိုက် ရေးရင်တော့
      error ပြပေမယ့်၊ တခြား နေရာက ဝင်လာတဲ့ number ကိုတော့ စစ်မပေးနိုင်ပါဘူး။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 9: TypeScript-only Features (numeric enums accept numbers)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/typescript-only-features",
        }
      - {
          title: "TypeScript 5.0 release notes: Enum overhaul (an out-of-domain literal is an error)",
          url: "https://www.typescriptlang.org/docs/handbook/release-notes/typescript-5-0.html#enum-overhaul",
        }
    actions:
      - id: type-fromform
        type: editor.type
        at: { mark: type-fromform }
        target:
          { file: src/main.ts, after: "console.log(cupName(CupSize.Large));\n", occurrence: 1 }
        text: "\nconst fromForm = Number(\"5\");\nconsole.log(cupName(fromForm));\n"
        cadence: line-by-line
      - id: expect-undefined
        type: expect.preview
        at: { afterAction: type-fromform }
        timeoutMs: 8000
        target: { by: testId, value: ts-out-3 }
        textContains: "undefined"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-undefined-clean
        type: expect.preview
        at: { afterAction: expect-undefined }
        timeoutMs: 5000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: select-fromform
        type: editor.select
        at: { mark: read-undefined }
        target: { file: src/main.ts, text: "cupName(fromForm)", occurrence: 1 }

  - id: string-enum
    narration: >
      [[mark:open-menu-4]] ဒီတစ်ခါ သကြား အဆင့်တွေအတွက် enum ရေးပါမယ်။ [[mark:type-sugar]] member
      တိုင်းကို string တန်ဖိုး ပေးထားလို့ ဒါကို string enum လို့ ခေါ်ပါတယ်။ [[mark:read-sugar-js]]
      JavaScript output မှာ နာမည်နဲ့ string ကိုပဲ တွဲပေးပြီး၊ ပြန်တွဲတာ မပါပါဘူး။ string enum မှာ
      reverse mapping မရှိလို့ပါ။ [[mark:open-main-4]] main ဖိုင်မှာ သကြား နည်းနည်းကို member နဲ့
      မဟုတ်ဘဲ၊ တန်ဖိုး တူတဲ့ string နဲ့ ပေးကြည့်ရအောင်။ [[mark:read-raw-error]] ဒီ string ကို Sugar
      type ထဲ ထည့်လို့ မရဘူး ဆိုတဲ့ error ပေါ်လာပါပြီ။ string enum က တန်ဖိုး တူနေရင်တောင် သူ့ member
      တွေကိုပဲ လက်ခံပါတယ်။ [[mark:read-raw-output]] Output မှာတော့ less ထွက်နေပါတယ်။ run တဲ့
      အချိန်မှာ တန်ဖိုး အတူတူ ဖြစ်လို့၊ ဒီ ကန့်သတ်ချက်က type ပိုင်းမှာပဲ ရှိတာပါ။
      [[mark:type-member]] ဒါကြောင့် member ကို ထည့်ရေးပြီး string ကိုတော့ comment အဖြစ်
      ချန်ထားပါမယ်။ [[mark:read-member-fixed]] error ပျောက်သွားပြီး Output ကလည်း မပြောင်းပါဘူး။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 9: TypeScript-only Features (string enums)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/typescript-only-features",
        }
      - {
          title: "TypeScript Handbook: Enums (string enums)",
          url: "https://www.typescriptlang.org/docs/handbook/enums.html#string-enums",
        }
    actions:
      - id: open-menu-4
        type: workspace.openFile
        at: { mark: open-menu-4 }
        path: src/menu.ts
      - id: type-sugar
        type: editor.type
        at: { mark: type-sugar }
        target: { file: src/menu.ts, after: "", occurrence: 1 }
        text: "export enum Sugar {\n  Less = \"less\",\n  Normal = \"normal\",\n  Extra = \"extra\",\n}\n\n"
        cadence: line-by-line
      - id: expect-sugar-js
        type: expect.preview
        at: { afterAction: type-sugar }
        timeoutMs: 8000
        target: { by: testId, value: ts-js-1 }
        textContains: 'Sugar["Less"] = "less";'
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: open-main-4
        type: workspace.openFile
        at: { mark: open-main-4 }
        path: src/main.ts
      - id: import-sugar
        type: editor.type
        at: { afterAction: open-main-4 }
        target: { file: src/main.ts, after: "import { MenuItem, Cup, CupSize", occurrence: 1 }
        text: ", Sugar"
        cadence: fast-explainer
      - id: type-raw
        type: editor.type
        at: { afterAction: import-sugar }
        target: { file: src/main.ts, after: "console.log(cupName(fromForm));\n", occurrence: 1 }
        text: "\nconst sugar: Sugar = \"less\";\nconsole.log(sugar);\n"
        cadence: line-by-line
      - id: expect-raw-error
        type: expect.preview
        at: { afterAction: type-raw }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-raw-code
        type: expect.preview
        at: { afterAction: expect-raw-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: 'Type ''"less"'' is not assignable to type ''Sugar''.'
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-raw-output
        type: expect.preview
        at: { afterAction: expect-raw-code }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-4 }
        textContains: "less"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-raw
        type: editor.select
        at: { mark: read-raw-error }
        target: { file: src/main.ts, text: '"less"', occurrence: 1 }
      - id: type-member
        type: editor.type
        at: { mark: type-member }
        target: { file: src/main.ts, after: "const sugar: Sugar = ", occurrence: 1 }
        text: "Sugar.Less; // "
        cadence: fast-explainer
      - id: expect-member-clean
        type: expect.preview
        at: { afterAction: type-member }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-member-output
        type: expect.preview
        at: { afterAction: expect-member-clean }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-4 }
        textContains: "less"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: const-enum
    narration: >
      [[mark:board-const]] enum ရဲ့ ရှေ့မှာ const ထည့်ရေးရင်တော့ const enum ဖြစ်ပါတယ်။
      [[mark:draw-const-out]] tsc က const enum အတွက် object မထုတ်ပေးဘဲ၊ သုံးထားတဲ့ နေရာတိုင်းမှာ
      member ရဲ့ တန်ဖိုးကို တိုက်ရိုက် ကူးထည့်ပေးပါတယ်။ ဒါကြောင့် run တဲ့ အချိန်မှာ enum ကိုယ်တိုင်
      မရှိတော့ပါဘူး။ [[mark:draw-const-warn]] ဒါပေမဲ့ ဖိုင်တစ်ဖိုင်ချင်း compile လုပ်တဲ့ tool တွေက
      တခြား ဖိုင်ထဲက တန်ဖိုးကို မမြင်ရလို့၊ တခြားသူတွေ သုံးမယ့် library code မှာ const enum ကို
      ရှောင်တာ ပိုကောင်းပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 9: TypeScript-only Features (const enums)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/typescript-only-features",
        }
      - {
          title: "TypeScript Handbook: Enums (const enums, const enum pitfalls)",
          url: "https://www.typescriptlang.org/docs/handbook/enums.html#const-enums",
        }
      - {
          title: "TSConfig: isolatedModules (references to const enum members)",
          url: "https://www.typescriptlang.org/tsconfig/#isolatedModules",
        }
    actions:
      - id: board-const
        type: whiteboard.apply
        at: { mark: board-const }
        open: true
        clear: true
        upsertIds: [b-title, b-ts-1, b-ts-2]
      - id: draw-const-out
        type: whiteboard.apply
        at: { mark: draw-const-out }
        upsertIds: [b-arrow, b-tsc, b-js, b-note]
        drawMs: 2600
      - id: draw-const-warn
        type: whiteboard.apply
        at: { mark: draw-const-warn }
        upsertIds: [b-warn]
        drawMs: 1200

  - id: namespace
    chapter: "Namespace"
    narration: >
      [[mark:close-board-b]] တတိယ feature က namespace ပါ။ JavaScript မှာ module မရှိသေးတဲ့ ခေတ်က၊
      ဆက်စပ်တဲ့ code တွေကို နာမည်တစ်ခုအောက်မှာ စုထားဖို့ သုံးခဲ့ကြတာပါ။ [[mark:type-kitchen]]
      မီးဖိုချောင်အတွက် namespace တစ်ခု ရေးပြီး၊ ဖျော်ပေးတဲ့ function ကို export လုပ်ပါမယ်။
      [[mark:read-kitchen-js]] JavaScript output မှာ enum တုန်းကလိုပဲ variable တစ်ခုနဲ့ ချက်ချင်း
      run သွားတဲ့ function ပေါ်လာပြီး၊ ဖျော်ပေးတဲ့ function ကို Kitchen object ပေါ်မှာ
      ချိတ်ပေးပါတယ်။ [[mark:type-kitchen-2]] နာမည် တူတဲ့ namespace နှစ်ခု ရေးရင် တစ်ခုတည်း အဖြစ်
      ပေါင်းသွားပါတယ်။ စားပွဲကို ပို့ပေးတဲ့ function နဲ့ နောက်တစ်ခု ရေးကြည့်ရအောင်။
      [[mark:read-merge-js]] အခု ချက်ချင်း run သွားတဲ့ function နှစ်ခုလုံးက Kitchen object
      တစ်ခုတည်းကို လက်ခံပါတယ်။ မရှိသေးရင် အသစ် ဆောက်ပြီး၊ ရှိပြီးသား ဆိုရင် အဲဒီ object ပေါ်မှာပဲ
      ထပ်ချိတ်တာပါ။ [[mark:open-main-5]] main ဖိုင်မှာ function နှစ်ခုလုံးကို ဆက်ခေါ်ကြည့်ရအောင်။
      [[mark:read-kitchen-output]] Output မှာ ကော်ဖီကို ဖျော်ပြီး စားပွဲကို ပို့ပြီ ဆိုတာ
      ပေါ်လာပါပြီ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 9: TypeScript-only Features (namespaces, merging)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/typescript-only-features",
        }
      - {
          title: "TypeScript Handbook: Namespaces",
          url: "https://www.typescriptlang.org/docs/handbook/namespaces.html",
        }
      - {
          title: "TypeScript Handbook: Declaration Merging (merging namespaces)",
          url: "https://www.typescriptlang.org/docs/handbook/declaration-merging.html#merging-namespaces",
        }
    actions:
      - id: close-board-b
        type: whiteboard.apply
        at: { mark: close-board-b }
        open: false
      - id: open-menu-5
        type: workspace.openFile
        at: { mark: close-board-b, offsetMs: 700 }
        path: src/menu.ts
      - id: type-kitchen
        type: editor.type
        at: { mark: type-kitchen }
        target: { file: src/menu.ts, after: "", occurrence: 1 }
        text: "export namespace Kitchen {\n  export function brew(item: string) {\n    return `${item} ဖျော်ပြီး`;\n  }\n}\n\n"
        cadence: line-by-line
      - id: expect-kitchen-js
        type: expect.preview
        at: { afterAction: type-kitchen }
        timeoutMs: 8000
        target: { by: testId, value: ts-js-1 }
        textContains: "Kitchen.brew = brew;\n})(Kitchen || (Kitchen = {}));"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-kitchen-2
        type: editor.type
        at: { mark: type-kitchen-2 }
        target: { file: src/menu.ts, after: "", occurrence: 1 }
        text: "export namespace Kitchen {\n  export function serve(item: string) {\n    return `${item}၊ စားပွဲကို ပို့ပြီ`;\n  }\n}\n\n"
        cadence: line-by-line
      - id: expect-merge-js
        type: expect.preview
        at: { afterAction: type-kitchen-2 }
        timeoutMs: 8000
        target: { by: testId, value: ts-js-1 }
        textContains: "Kitchen.serve = serve;\n})(Kitchen || (Kitchen = {}));\n(function (Kitchen) {"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: open-main-5
        type: workspace.openFile
        at: { mark: open-main-5 }
        path: src/main.ts
      - id: import-kitchen
        type: editor.type
        at: { afterAction: open-main-5 }
        target:
          { file: src/main.ts, after: "import { MenuItem, Cup, CupSize, Sugar", occurrence: 1 }
        text: ", Kitchen"
        cadence: fast-explainer
      - id: type-print-kitchen
        type: editor.type
        at: { afterAction: import-kitchen }
        target: { file: src/main.ts, after: "console.log(sugar);\n", occurrence: 1 }
        text: "\nconsole.log(Kitchen.serve(Kitchen.brew(\"ကော်ဖီ\")));\n"
        cadence: line-by-line
      - id: expect-kitchen-output
        type: expect.preview
        at: { afterAction: type-print-kitchen }
        timeoutMs: 8000
        target: { by: testId, value: ts-out-5 }
        textContains: "ကော်ဖီ ဖျော်ပြီး၊ စားပွဲကို ပို့ပြီ"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-kitchen-clean
        type: expect.preview
        at: { afterAction: expect-kitchen-output }
        timeoutMs: 5000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: erasable
    chapter: "Erasable syntax only"
    narration: >
      [[mark:board-node]] ဒီ feature တွေက အခုခေတ်မှာ ဘာကြောင့် ပြဿနာ ဖြစ်လဲ ကြည့်ရအောင်။ Node.js version
      အသစ်တွေက TypeScript ဖိုင်ကို တိုက်ရိုက် run ပေးနိုင်ပါတယ်။ [[mark:draw-strip]] ဒါပေမဲ့ type
      ကို မစစ်ပါဘူး။ type တွေကို နေရာလွတ်နဲ့ အစားထိုးပြီး၊ ကျန်တဲ့ JavaScript ကို run ရုံပါ။
      [[mark:draw-strip-fail]] ဒါကြောင့် code အသစ် ထုတ်ပေးရမယ့် enum ရယ်၊ namespace ရယ်၊ parameter
      property ရယ် ပါတဲ့ ဖိုင်ဆိုရင် error နဲ့ ရပ်သွားပါတယ်။ [[mark:draw-flag]] ဒါကို run မှ
      မသိရအောင် TypeScript ၅.၈ မှာ erasable syntax only ဆိုတဲ့ setting ထည့်ပေးခဲ့ပါတယ်။ type ကို
      ဖယ်ရုံနဲ့ ရတဲ့ syntax ကိုပဲ ခွင့်ပြုမယ်လို့ ဆိုလိုတာပါ။ [[mark:open-tsconfig]] tsconfig ထဲမှာ
      ဖွင့်ကြည့်ရအောင်။ [[mark:read-erasable]] Errors မှာ စာ အတူတူ ပါတဲ့ error ခြောက်ခု ပေါ်လာပါပြီ။
      erasable syntax only ဖွင့်ထားရင် ဒီ syntax ကို သုံးလို့ မရဘူးလို့ ပြောနေတာပါ။
      [[mark:select-flagged]] namespace နှစ်ခု၊ enum နှစ်ခုနဲ့ Cup ရဲ့ parameter property နှစ်ခုမှာ
      ပေါ်ပြီး၊ MenuItem ကိုတော့ ဘာမှ မပြောပါဘူး။ Output ကတော့ ဆက်ထွက်နေပါတယ်၊ type error က program
      ကို မရပ်စေလို့ပါ။
    sources:
      - {
          title: "TSConfig: erasableSyntaxOnly",
          url: "https://www.typescriptlang.org/tsconfig/#erasableSyntaxOnly",
        }
      - {
          title: "TypeScript 5.8 release notes: --erasableSyntaxOnly",
          url: "https://www.typescriptlang.org/docs/handbook/release-notes/typescript-5-8.html",
        }
      - {
          title: "Node.js: Modules — TypeScript (type stripping, unsupported features)",
          url: "https://nodejs.org/api/typescript.html#type-stripping",
        }
    actions:
      - id: board-node
        type: whiteboard.apply
        at: { mark: board-node }
        open: true
        clear: true
        upsertIds: [c-title, c-ts-box, c-ts-name]
      - id: draw-strip
        type: whiteboard.apply
        at: { mark: draw-strip }
        upsertIds: [c-arrow-1, c-strip, c-no-check, c-arrow-2, c-run]
        drawMs: 2400
      - id: draw-strip-fail
        type: whiteboard.apply
        at: { mark: draw-strip-fail }
        upsertIds: [c-fail]
        drawMs: 1600
      - id: draw-flag
        type: whiteboard.apply
        at: { mark: draw-flag }
        upsertIds: [c-flag, c-flag-why]
        drawMs: 2000
      - id: close-board-c
        type: whiteboard.apply
        at: { mark: open-tsconfig }
        open: false
      - id: open-tsconfig
        type: workspace.openFile
        at: { mark: open-tsconfig, offsetMs: 700 }
        path: tsconfig.json
      - id: type-erasable
        type: editor.type
        at: { afterAction: open-tsconfig }
        target: { file: tsconfig.json, after: "\"strict\": true,\n", occurrence: 1 }
        text: "    \"erasableSyntaxOnly\": true,\n"
        cadence: block
      - id: expect-six
        type: expect.preview
        at: { afterAction: type-erasable }
        timeoutMs: 10000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "6" }
        retry: { maxAttempts: 3, delayMs: 800 }
      - id: expect-erasable-first
        type: expect.preview
        at: { afterAction: expect-six }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "This syntax is not allowed when 'erasableSyntaxOnly' is enabled."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-erasable-code
        type: expect.preview
        at: { afterAction: expect-erasable-first }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-6 }
        attribute: { name: data-code, value: "1294" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-still-runs
        type: expect.preview
        at: { afterAction: expect-erasable-code }
        timeoutMs: 5000
        target: { by: testId, value: ts-output }
        attribute: { name: data-count, value: "5" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: open-menu-6
        type: workspace.openFile
        at: { mark: select-flagged }
        path: src/menu.ts
      - id: select-flagged
        type: editor.select
        at: { afterAction: open-menu-6 }
        target:
          { file: src/menu.ts, text: "public size: string, public price: number", occurrence: 1 }

  - id: advice
    chapter: "ဒီ course ရဲ့ ရွေးချယ်မှု"
    narration: >
      [[mark:board-advice]] TypeScript က ဒီ feature တွေကို ဆက်ထောက်ပံ့မှာ ဖြစ်လို့ သုံးထားရင်
      ပျက်မသွားပါဘူး။ ဒါပေမဲ့ ဒီ course မှာတော့ JavaScript ရဲ့ ပုံစံအတိုင်း ရေးပါမယ်။
      [[mark:draw-advice-enum]] enum အစား union type ဒါမှမဟုတ် as const object ကို သုံးပြီး၊ as
      const object ကို နောက် lesson မှာ ကြည့်ပါမယ်။ [[mark:draw-advice-ns]] namespace အစား
      ဖိုင်တွေကို module အဖြစ် ထားပြီး import နဲ့ export ကို သုံးပါမယ်။ [[mark:draw-advice-param]]
      parameter property အစား MenuItem လိုပဲ ရိုးရိုး ရေးပါမယ်။ [[mark:draw-advice-team]]
      သုံးထားပြီးသား project မှာတော့ အကုန် လိုက်ဖျက်စရာ မလိုပါဘူး။ အဖွဲ့နဲ့ သဘောတူပြီး တစ်ပုံစံတည်း
      ရေးတာက ပိုအရေးကြီးပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 9: TypeScript-only Features (should you use them?)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/typescript-only-features",
        }
      - {
          title: "TypeScript Handbook: Enums (objects vs enums)",
          url: "https://www.typescriptlang.org/docs/handbook/enums.html#objects-vs-enums",
        }
      - {
          title: "TypeScript Handbook: Modules",
          url: "https://www.typescriptlang.org/docs/handbook/2/modules.html",
        }
    actions:
      - id: board-advice
        type: whiteboard.apply
        at: { mark: board-advice }
        open: true
        clear: true
        upsertIds: [d-title]
      - id: draw-advice-enum
        type: whiteboard.apply
        at: { mark: draw-advice-enum }
        upsertIds: [d-enum]
        drawMs: 1400
      - id: draw-advice-ns
        type: whiteboard.apply
        at: { mark: draw-advice-ns }
        upsertIds: [d-ns]
        drawMs: 1400
      - id: draw-advice-param
        type: whiteboard.apply
        at: { mark: draw-advice-param }
        upsertIds: [d-param]
        drawMs: 1400
      - id: draw-advice-team
        type: whiteboard.apply
        at: { mark: draw-advice-team }
        upsertIds: [d-team]
        drawMs: 1400

  - id: recap
    narration: >
      [[mark:close-advice]] ဒါဆို ပြန်ချုပ်ရရင်၊ parameter property ရယ်၊ enum ရယ်၊ namespace ရယ်
      ဆိုတဲ့ feature တွေအတွက် TypeScript က JavaScript code အသစ် ရေးပေးရပါတယ်။ [[mark:recap-enum]]
      numeric enum က number ဘာမဆို လက်ခံပြီး၊ string enum ကတော့ သူ့ member တွေကိုပဲ လက်ခံပါတယ်။
      [[mark:recap-erasable]] type ကို ဖယ်ပြီး run တဲ့ tool တွေအတွက်တော့ erasable syntax only နဲ့
      ကြိုစစ်ထားလို့ ရပါတယ်။ နောက် lesson မှာတော့ key of ရယ်၊ type of ရယ်၊ indexed access ရယ်ကို
      သုံးပြီး၊ ရှိပြီးသား type နဲ့ တန်ဖိုးတွေကနေ type အသစ် ထုတ်ယူပုံကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 9: TypeScript-only Features",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/typescript-only-features",
        }
      - {
          title: "Total TypeScript Essentials, ch. 10: Deriving Types",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/deriving-types",
        }
    actions:
      - id: close-advice
        type: whiteboard.apply
        at: { mark: close-advice }
        open: false
      - id: select-cup-recap
        type: editor.select
        at: { mark: recap-enum }
        target: { file: src/menu.ts, text: "export enum CupSize {", occurrence: 1 }
      - id: expect-file-cup
        type: expect.file
        at: { afterAction: close-advice }
        path: src/menu.ts
        contains: "export class Cup {\n  constructor(public size: string, public price: number) {}\n}"
      - id: expect-file-kitchen
        type: expect.file
        at: { afterAction: expect-file-cup }
        path: src/menu.ts
        contains: "export namespace Kitchen {\n  export function serve(item: string) {"
      - id: expect-file-sugar
        type: expect.file
        at: { afterAction: expect-file-kitchen }
        path: src/main.ts
        contains: 'const sugar: Sugar = Sugar.Less; // "less";'
      - id: expect-file-tsconfig
        type: expect.file
        at: { afterAction: expect-file-sugar }
        path: tsconfig.json
        contains: '"erasableSyntaxOnly": true,'
checks:
  - { type: timing.p95Ms, max: 300 }
