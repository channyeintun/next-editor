build:
  # Studio replaces this built-in profile at render time with the Burmese provider chosen in the
  # render console (AthanLab with the user's own key, or VoxCPM2 when that feature is enabled).
  voiceProfile: pocket-alba-v1
  seed: 3119
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "JavaScript မှာ မရှိတဲ့ feature တွေ"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ class တစ်ခုကနေ နောက် class တစ်ခုကို extends နဲ့
      အမွေဆက်ခံပုံကို ကြည့်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ TypeScript မှာပဲ ရှိပြီး JavaScript မှာ
      မရှိတဲ့ feature သုံးမျိုးကို ကြည့်သွားပါမယ်။ [[mark:draw-rule]] TypeScript ဆိုတာ JavaScript
      ပေါ်မှာ type တွေ ထပ်ရေးထားတာ ဖြစ်လို့၊ type တွေကို ဖယ်ထုတ်လိုက်ရင် ကိုယ် ရေးထားတဲ့ JavaScript
      အတိုင်းပဲ ကျန်ပါတယ်။ lesson ၃ မှာလည်း JavaScript output ထဲမှာ type တွေ ပျောက်သွားပြီး၊ code
      ကတော့ မပြောင်းဘဲ ကျန်ခဲ့တာ မြင်ခဲ့ပါတယ်။ [[mark:draw-exceptions]] ဒါပေမဲ့ parameter property
      ရယ်၊ enum ရယ်၊ namespace ရယ်က ဒီ စည်းကမ်းနဲ့ မကိုက်ပါဘူး။ သူတို့က type ပိုင်းမှာတင် မဟုတ်ဘဲ
      program run တဲ့ အချိန်မှာပါ အလုပ်လုပ်ရလို့၊ type ကို ဖယ်ရုံနဲ့ မရပါဘူး။ TypeScript က
      JavaScript code အသစ်တွေကို ကိုယ်တိုင် ရေးထုတ်ပေးရပါတယ်။ [[mark:draw-why]] JavaScript မှာ class
      တွေ၊ module တွေ မရှိသေးတဲ့ ခေတ်က ထည့်ခဲ့တဲ့ feature တွေ ဖြစ်ပြီး၊ အခုတော့ TypeScript အဖွဲ့က
      JavaScript မှာ မရှိတဲ့ runtime feature အသစ်တွေကို မထည့်တော့ပါဘူး။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 9: TypeScript-only Features",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/typescript-only-features",
        }
      - {
          title: "TypeScript Handbook: TypeScript for JavaScript Programmers",
          url: "https://www.typescriptlang.org/docs/handbook/typescript-in-5-minutes.html",
        }
    actions:
      - id: open-board-a
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-rule
        type: whiteboard.apply
        at: { mark: draw-rule }
        upsertIds: [a-ts-box, a-ts-name, a-ts-sub, a-strip, a-arrow, a-js-box, a-js-name, a-js-sub]
        drawMs: 3600
      - id: draw-exceptions
        type: whiteboard.apply
        at: { mark: draw-exceptions }
        upsertIds: [a-except]
        drawMs: 1600
      - id: draw-why
        type: whiteboard.apply
        at: { mark: draw-why }
        upsertIds: [a-except-why]
        drawMs: 1400

  - id: starter
    narration: >
      [[mark:close-board]] ဒါဆို ဒီ feature တွေ မပါခင် ဆိုင်ရဲ့ code ကို အရင် ကြည့်ရအောင်။ [[mark:open-menu]] ဒါက ဆိုင်ရဲ့ menu
      ပစ္စည်းကို class နဲ့ ရေးထားတဲ့ ဖိုင်ပါ။ [[mark:select-fields]] class ထဲမှာ နာမည်နဲ့ ဈေးနှုန်း
      ဆိုတဲ့ property နှစ်ခုကို type နဲ့ ကြေညာထားပါတယ်။ [[mark:select-assign]] constructor ကတော့
      parameter နှစ်ခုကို လက်ခံပြီး၊ property တစ်ခုချင်းစီထဲကို ပြန်ထည့်ပေးပါတယ်။ ဆိုတော့ နာမည်
      ဆိုတဲ့ စကားလုံး တစ်ခုတည်းကို လေးခါ ရေးနေရပါတယ်။ JavaScript မှာ class ရေးရင်လည်း ဒီ ပုံစံပါပဲ။
      [[mark:open-main]] main ဖိုင်မှာတော့ လက်ဖက်ရည်ကို ၁၅၀၀ ကျပ်နဲ့ ဖန်တီးပြီး ထုတ်ပြထားပါတယ်။
      [[mark:say-js]] ဒီ lesson ရဲ့ panel မှာ Errors နဲ့ Output အပြင်၊ menu ဖိုင်ကနေ ထွက်လာတဲ့
      JavaScript output လည်း ပါပါတယ်။ feature အသစ် တစ်ခု ရေးလိုက်တိုင်း အဲဒီ အပိုင်းမှာ ဘာ ပေါ်လာလဲ
      ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "TypeScript Handbook: Classes (fields, constructors)",
          url: "https://www.typescriptlang.org/docs/handbook/2/classes.html",
        }
      - {
          title: "MDN: Classes",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Classes",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: open-menu
        type: workspace.openFile
        at: { mark: open-menu }
        path: src/menu.ts
      - id: select-fields
        type: editor.select
        at: { mark: select-fields }
        target: { file: src/menu.ts, text: "  name: string;\n  price: number;", occurrence: 1 }
      - id: select-assign
        type: editor.select
        at: { mark: select-assign }
        target:
          {
            file: src/menu.ts,
            text: "    this.name = name;\n    this.price = price;",
            occurrence: 1,
          }
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: src/main.ts
      - id: select-tea
        type: editor.select
        at: { afterAction: open-main }
        target: { file: src/main.ts, text: 'new MenuItem("လက်ဖက်ရည်", 1500)', occurrence: 1 }

  - id: js-output
    narration: >
      [[mark:panel-ready]] ညာဘက် panel မှာ error မရှိဘဲ၊ Output မှာ MenuItem object ကို နာမည်နဲ့
      ဈေးနှုန်း နှစ်ခုလုံးနဲ့ မြင်ရပါတယ်။ [[mark:open-menu-2]] အောက်က JavaScript output ကို menu
      ဖိုင်နဲ့ ယှဉ်ကြည့်ပါ။ [[mark:read-js]] type တွေ ပျောက်သွားတာကလွဲရင်၊ ကျန်တဲ့ code က ကိုယ်
      ရေးထားတဲ့ အတိုင်းပဲ ဖြစ်နေပါတယ်။
    sources:
      - {
          title: "TypeScript Handbook: The Basics (erased types)",
          url: "https://www.typescriptlang.org/docs/handbook/2/basic-types.html#erased-types",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
