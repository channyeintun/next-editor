        # Example plan · the agent's reply to Task 01

        1. index.html မှာ order form ဆောက်မယ် — item၊ အရေအတွက်၊ လာယူချိန်၊ နာမည်၊ ဖုန်း
        2. စုစုပေါင်း ဈေးနှုန်းကို တွက်ပြမယ်
        3. customer account နဲ့ login စာမျက်နှာ ထည့်မယ် — နောက်တစ်ခါ အလွယ်တကူ မှာနိုင်အောင်
        4. AC-1 ကနေ AC-4 ကို ဖုန်း screen အရွယ်နဲ့ စစ်မယ်
        5. ပြင်ခဲ့တာတွေကို အကျဉ်းချုပ် ပြန်ပေးမယ်
