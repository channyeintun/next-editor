# AI Builder, lesson 11: briefing an agent on one task (Burmese, docs kind).
#
# Start state (ws/): base-docs (package.json with a no-op dev script, notes.md), AGENTS.md (COURSE-KIT
# §4.4 base, as L10 left it), docs/spec.md (§4.3 without AC-6, as L09 left it), tasks/01-plan.md
# (§4.5 example plan, pinned, never typed) and tasks/01-order-form.md pinned with only its title line.
# Nothing runs. The lesson types the brief section by section (line-by-line); the Constraints section
# is typed with two lines, and the plan review adds the third (login) — the final brief equals §4.5.
#
# Boards: (B) the five questions a capable newcomer asks, one per brief section; (S) step-by-step
# orders vs success criteria with the agent's do → check → fix loop; (P) brief → plan → review → code
# and the three plan-review questions; (Z) the quiz (an SMS step: a v1 Should, but not this task).
#
# Build: bun ~/Documents/ai-builder-course-work/tools/build-lesson.ts template.yaml ws ai-builder-11-briefing-an-agent.yaml
