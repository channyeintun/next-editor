  - id: recap
    chapter: ပြန်ချုပ်ရရင်
    narration: >
      [[mark:close-quiz]] ဒါဆို ပြန်ချုပ်ရရင်၊ agent ကို task အပ်တဲ့အခါ ရလဒ် တစ်ခုပဲ ပါတဲ့ brief ကို ရေးပါ။
      [[mark:rc-read]] ဖတ်ရမယ့် အပိုင်းတွေကို ကူးမထည့်ဘဲ ညွှန်ပြပါ။ [[mark:rc-limits]] မလုပ်ရတာတွေကို ရေးထားပါ။
      [[mark:rc-done]] အဆင့်တိုင်း မခိုင်းဘဲ ပြီးတယ် ဆိုတာကို AC နံပါတ်နဲ့ ပေးပါ။ [[mark:rc-unsure]] မသေချာရင်
      ခန့်မှန်းပြီး ဆက်မလုပ်ဘဲ ရပ်ပြီး မေးခိုင်းပါ။ code မရေးခင် plan ကို တောင်းပြီး review လုပ်ပါ၊
      ပြီးတဲ့အခါမှာလည်း ကိုယ်တိုင် ပြန်စစ်ပါ။ ဒါပေမဲ့ agent ရပ်ပြီး မေးလာတဲ့ မေးခွန်းတွေရဲ့ အဖြေက မြမြ နဲ့ လှလှ
      ဆီမှာ ရှိပါတယ်။ နောက် lesson မှာတော့ ဆက်သွယ် ပြောဆိုတဲ့ အလုပ်ရဲ့ ကျန်တဲ့ တစ်ဝက်ဖြစ်တဲ့ လူတွေနဲ့ ပြောဆိုတာကို
      လေ့လာသွားပါမယ်။
    sources:
