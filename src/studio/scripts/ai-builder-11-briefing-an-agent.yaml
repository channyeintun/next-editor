  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 6111
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}
scenes:
  - id: recall
    chapter: Task တစ်ခု၊ ရလဒ် တစ်ခု
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ project ထဲ ဝင်လာတဲ့ agent တိုင်း အရင်ဖတ်တဲ့ AGENTS.md ကို ရေးခဲ့ပါတယ်။
      [[mark:sel-one-task]] အဲဒီထဲက ဒီ rule က agent ရဲ့ ပြောင်းလဲမှု တစ်ခုချင်းကို ကိုယ် ပြန်စစ်နိုင်လောက်အောင်
      သေးသေးလေး ထားခိုင်းတာပါ။ ဒီနေ့တော့ agent ကို ပထမဆုံး အလုပ် တစ်ခု၊ task တစ်ခု အပ်ကြည့်ပါမယ်။ customer တွေ
      ဖုန်းကနေ ကြိုမှာလို့ရမယ့် order form ပါ။ chat ထဲမှာ တစ်ကြောင်းတည်း ခိုင်းရင်လည်း form တစ်ခု ထွက်လာမှာပါ။
      ဒါပေမဲ့ ဘာတွေ ပါရမလဲ၊ ဘာ မထိရဘူးလဲ၊ ဘယ်တော့ ပြီးလဲ ဆိုတာကို ကိုယ် မပြောထားရင်၊ agent က ကွက်လပ်တွေကို သူ့
      ခန့်မှန်းချက်တွေနဲ့ ဖြည့်သွားမှာပါ။ [[mark:open-brief]] ဒါကြောင့် agent ကို task တစ်ခု အပ်တဲ့ စာ၊ task brief
      တစ်စောင်ကို tasks folder ထဲက ဒီ ဖိုင်မှာ ရေးပါမယ်။ ဖိုင်ထဲမှာ ခေါင်းစဉ် တစ်ကြောင်းပဲ ရှိပါသေးတယ်။ task
      တစ်ခုမှာ ရလဒ် တစ်ခုပဲ ရှိရပါမယ်။ ဒီ task ရဲ့ ရလဒ်က app တစ်ခုလုံး မဟုတ်ဘဲ order form တစ်ခုပါ။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The developer's changing role (specification)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "Claude Code docs: Best practices (write a specific prompt)",
          url: "https://code.claude.com/docs/en/best-practices",
        }
      - { title: "AGENTS.md: a README for agents", url: "https://agents.md/" }
    actions:
      - {
          id: sel-one-task,
          type: editor.select,
          at: { mark: sel-one-task },
          target:
            {
              file: AGENTS.md,
              text: "- One task at a time. Keep each change small.",
              occurrence: 1,
            },
        }
      - {
          id: open-brief,
          type: workspace.openFile,
          at: { mark: open-brief },
          path: tasks/01-order-form.md,
        }

  - id: brief-parts
    narration: >
      [[mark:b-title]] brief ကောင်း တစ်စောင်မှာ ဘာတွေ ပါရမလဲ။ ပြီးခဲ့တဲ့ lesson မှာ team ထဲ ဝင်ခါစ လူသစ်ကို
      စဉ်းစားခဲ့သလိုပဲ၊ ကျွမ်းကျင်တဲ့ လူသစ် တစ်ယောက်ကို အလုပ် တစ်ခု အပ်လိုက်ရင် သူ ပြန်မေးမယ့် မေးခွန်းတွေကို
      စဉ်းစားကြည့်ပါ။ [[mark:b-goal]] ပထမဆုံး ဘာ ရချင်တာလဲ လို့ မေးပါလိမ့်မယ်။ [[mark:b-read]] ပြီးရင် project ထဲက
      ဘာတွေကို အရင် ဖတ်ရမလဲ လို့ မေးပါမယ်။ [[mark:b-limits]] ဘာတွေကို မထိရ၊ မလုပ်ရဘူးလဲ ဆိုတာလည်း
      သိချင်ပါလိမ့်မယ်။ [[mark:b-done]] ပြီးပြီလို့ ဘယ်လို သိမလဲ လို့လည်း မေးပါလိမ့်မယ်။ [[mark:b-unsure]]
      နောက်ဆုံးတော့ မသေချာတာ ကြုံရင် ဘာလုပ်ရမလဲ ဆိုတာပါ။ brief ရဲ့ အပိုင်း ငါးပိုင်းက ဒီ မေးခွန်း ငါးခုကို
      ဖြေထားတာပါ။ [[mark:b-agent]] လူကတော့ မရှင်းရင် ပြန်မေးတတ်ပေမဲ့၊ agent ကတော့ မေးမယ့်အစား ဖြစ်နိုင်လောက်တဲ့
      အဖြေကို ရွေးပြီး ဆက်လုပ်သွားတတ်ပါတယ်။ ဒါကြောင့် အဖြေတွေကို brief ထဲမှာ ကြိုရေးထားရတာပါ။
    sources:
      - {
          title: "The New SDLC (Burmese edition): Context engineering (what a new team member needs)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "The New SDLC (Burmese edition): The developer's changing role (the 80% problem: missing clarification)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: draw-b-title,
          type: whiteboard.apply,
          at: { mark: b-title },
          open: true,
          clear: true,
          upsertIds: [b-title],
        }
      - {
          id: draw-b-goal,
          type: whiteboard.apply,
          at: { mark: b-goal },
          upsertIds: [b-l1, b-q1],
          drawMs: 900,
        }
      - {
          id: draw-b-read,
          type: whiteboard.apply,
          at: { mark: b-read },
          upsertIds: [b-l2, b-q2],
          drawMs: 900,
        }
      - {
          id: draw-b-limits,
          type: whiteboard.apply,
          at: { mark: b-limits },
          upsertIds: [b-l3, b-q3],
          drawMs: 900,
        }
      - {
          id: draw-b-done,
          type: whiteboard.apply,
          at: { mark: b-done },
          upsertIds: [b-l4, b-q4],
          drawMs: 900,
        }
      - {
          id: draw-b-unsure,
          type: whiteboard.apply,
          at: { mark: b-unsure },
          upsertIds: [b-l5, b-q5],
          drawMs: 900,
        }
      - {
          id: draw-b-agent,
          type: whiteboard.apply,
          at: { mark: b-agent },
          upsertIds: [b-agent-box, b-agent],
          drawMs: 1200,
        }

  - id: goal
    chapter: Brief ကို ရေးရအောင်
    narration: >
      [[mark:close-b]] ကဲ၊ order form အတွက် brief ကို editor ထဲမှာ ရေးကြည့်ရအောင်။ [[mark:type-goal]] ပထမ အပိုင်းက
      ဒီ task ပြီးရင် ဘာ ရရမလဲ ဆိုတာကို စာကြောင်း တစ်ကြောင်းတည်းနဲ့ ဆုံးဖြတ်ထားပါတယ်။ ဘယ်သူ သုံးမလဲ၊ ဘာနဲ့ သုံးမလဲ
      ဆိုတာ ပါပြီး၊ form တစ်ခုထက် ပိုမပါပါဘူး။ app တစ်ခုလုံး လုပ်ပေးပါ လို့ ရေးရင် ပြောင်းလဲမှုက
      အရမ်းကြီးသွားပြီး၊ ကိုယ် ပြန်စစ်ဖို့လည်း ခက်ပါတယ်။ ရလဒ်က သေးသေးလေး ဖြစ်မှ agent က ရလဒ် ပြန်ပေးတဲ့အခါ
      ပြီးပြီလား မပြီးသေးဘူးလား ဆိုတာကို တိတိကျကျ ပြောလို့ ရပါတယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The developer's changing role (specification, decomposition)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - { id: close-b, type: whiteboard.apply, at: { mark: close-b }, open: false }
      - id: type-goal
        type: editor.type
        at: { mark: type-goal }
        target: { file: tasks/01-order-form.md, after: "# Task 01 · Order form\n\n", occurrence: 1 }
        text: "## Goal\ncustomer က ဖုန်းကနေ ကြိုမှာလို့ရတဲ့ form တစ်ခု။\n\n"
        cadence: line-by-line

  - id: read-first
    narration: >
      [[mark:type-read]] နောက် အပိုင်းက agent ဘာတွေ အရင် ဖတ်ရမလဲ ဆိုတာပါ။ [[mark:sel-read-spec]] spec တစ်ခုလုံးကို
      chat ထဲ ကူးထည့်မယ့်အစား၊ ဖိုင်ရဲ့ နေရာနဲ့ ဒီ task နဲ့ ဆိုင်တဲ့ အပိုင်းတွေကိုပဲ ညွှန်ပြထားပါတယ်။ ပြီးခဲ့တဲ့
      lesson မှာ ပြောခဲ့သလို AGENTS.md က agent နဲ့ ပြောတဲ့ session တိုင်းမှာ ဖတ်တဲ့ ဖိုင် ဖြစ်ပြီး၊ spec ကတော့
      task က လိုမှ ဖွင့်ဖတ်တဲ့ ဖိုင်ပါ။ ကူးထည့်ထားတဲ့ စာက spec ကို ပြင်လိုက်ရင် ဟောင်းသွားပေမဲ့၊ ဖိုင်ကို
      ညွှန်ပြထားရင်တော့ agent က နောက်ဆုံး version ကို ဖတ်မှာပါ။
    sources:
      - {
          title: "The New SDLC (Burmese edition): Context engineering (static and dynamic context)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "Claude Code docs: Common workflows (reference files and directories)",
          url: "https://code.claude.com/docs/en/common-workflows",
        }
    actions:
      - id: type-read
        type: editor.type
        at: { mark: type-read }
        target: { file: tasks/01-order-form.md, after: "form တစ်ခု။\n\n", occurrence: 1 }
        text: "## Read first\n- docs/spec.md — Rules, AC-1 ကနေ AC-4\n- AGENTS.md\n\n"
        cadence: line-by-line
      - {
          id: sel-read-spec,
          type: editor.select,
          at: { mark: sel-read-spec },
          target:
            {
              file: tasks/01-order-form.md,
              text: "- docs/spec.md — Rules, AC-1 ကနေ AC-4",
              occurrence: 1,
            },
        }

  - id: constraints
    narration: >
      [[mark:type-limits]] တတိယ အပိုင်းက ဒီ task မှာ မလုပ်ရတာတွေပါ။ ပထမ စာကြောင်းက အလုပ်ကို order form မှာပဲ
      ကန့်ထားပါတယ်။ ကောင်တာက လှလှ ကြည့်မယ့် အော်ဒါစာရင်းက ဒီ task ထဲ ရောမပါလာအောင်၊ နောက် task တစ်ခုအဖြစ်
      ခွဲထားတာပါ။ [[mark:sel-package]] ဒုတိယ စာကြောင်းကတော့ project ထဲကို တခြားသူ့ code အသစ် မဝင်လာအောင်
      ကာထားတာပါ။ ကိုယ် မရေးဘဲ ယူသုံးတဲ့ အဲဒီလို code ကို package လို့ ခေါ်ပါတယ်။ AGENTS.md က package မထည့်ခင်
      မေးခိုင်းထားပေမဲ့၊ ဒီ task အတွက်တော့ အဖြေကို ကြိုဆုံးဖြတ်ထားတာပါ။ form တစ်ခုအတွက် package အသစ် မလိုပါဘူး။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The developer's changing role (decomposition)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - id: type-limits
        type: editor.type
        at: { mark: type-limits }
        target: { file: tasks/01-order-form.md, after: "- AGENTS.md\n\n", occurrence: 1 }
        text: "## Constraints\n- order form တစ်ခုတည်း။ ကောင်တာစာရင်းက Task 03။\n- package အသစ် မထည့်ပါနဲ့။\n\n"
        cadence: line-by-line
      - {
          id: sel-package,
          type: editor.select,
          at: { mark: sel-package },
          target: { file: tasks/01-order-form.md, text: "- package အသစ် မထည့်ပါနဲ့။", occurrence: 1 },
        }

  - id: done-when
    narration: >
      [[mark:type-done]] နောက် အပိုင်းက ပြီးပြီ ဆိုတာ ဘယ်လို သိမလဲ ဆိုတာပါ။ [[mark:sel-done-ac]] ပထမ စာကြောင်းက
      ပြီးပြီ ဆိုတာကို ကောင်းကောင်း လုပ်ပါ လို စကားနဲ့ မထားဘဲ၊ spec ထဲက acceptance criteria၊ AC နံပါတ်တွေနဲ့
      ဆုံးဖြတ်ထားပါတယ်။ ဘယ် screen အရွယ်မှာ စစ်ရမလဲ ဆိုတာလည်း သတ်မှတ်ထားလို့၊ agent စစ်မယ့် စစ်ချက်နဲ့ ကိုယ်
      စစ်မယ့် စစ်ချက်က တူတူ ဖြစ်သွားပါတယ်။ [[mark:sel-done-list]] ဒုတိယ စာကြောင်းကတော့ agent က အလုပ် ပြီးလို့
      ပြန်ပေးတဲ့အခါ ကိုယ် ပြန်စစ်ဖို့၊ review လုပ်ဖို့ လိုတာကို တောင်းထားတာပါ။ ပြီးပါပြီ ဆိုတဲ့ စကား တစ်ခွန်းထက်၊
      ဘာ ပြောင်းသွားလဲ၊ ဘာ ကျန်ခဲ့လဲ သိမှ စစ်လို့ ရပါတယ်။
    sources:
      - {
          title: "Claude Code docs: Best practices (give Claude a check to run)",
          url: "https://code.claude.com/docs/en/best-practices",
        }
      - {
          title: "The New SDLC (Burmese edition): The factory model (success criteria)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - id: type-done
        type: editor.type
        at: { mark: type-done }
        target: { file: tasks/01-order-form.md, after: "- package အသစ် မထည့်ပါနဲ့။\n\n", occurrence: 1 }
        text: "## Done when\n- AC-1 ကနေ AC-4 အထိ ဖုန်း screen အရွယ်မှာ pass ဖြစ်ရမယ်။\n- ဘာပြင်ခဲ့လဲ၊ ဘာမလုပ်ခဲ့လဲ စာရင်း ပြန်ပေးပါ။\n\n"
        cadence: line-by-line
      - {
          id: expect-done,
          type: expect.file,
          at: { afterAction: type-done },
          path: tasks/01-order-form.md,
          contains: "- AC-1 ကနေ AC-4 အထိ ဖုန်း screen အရွယ်မှာ pass ဖြစ်ရမယ်။",
        }
      - {
          id: sel-done-ac,
          type: editor.select,
          at: { mark: sel-done-ac },
          target:
            {
              file: tasks/01-order-form.md,
              text: "- AC-1 ကနေ AC-4 အထိ ဖုန်း screen အရွယ်မှာ pass ဖြစ်ရမယ်။",
              occurrence: 1,
            },
        }
      - {
          id: sel-done-list,
          type: editor.select,
          at: { mark: sel-done-list },
          target:
            {
              file: tasks/01-order-form.md,
              text: "- ဘာပြင်ခဲ့လဲ၊ ဘာမလုပ်ခဲ့လဲ စာရင်း ပြန်ပေးပါ။",
              occurrence: 1,
            },
        }

  - id: criteria
    chapter: အဆင့်တွေထက် ပြီးတယ် ဆိုတာ
    narration: >
      [[mark:s-title]] ဒီနေရာမှာ အရေးကြီးတဲ့ ရွေးချယ်မှု တစ်ခု ရှိပါတယ်။ [[mark:s-steps]] agent ကို ဖုန်းနံပါတ်
      အကွက်ကို ဒီနေရာမှာ ထား၊ ဒီလို တွက်၊ ပြီးရင် ဒီ ခလုတ် ထည့် ဆိုပြီး အဆင့်တိုင်း ခိုင်းလို့ ရပါတယ်။
      [[mark:s-bad]] ဒါပေမဲ့ အဲဒီလို ခိုင်းရင်၊ ဒီဇိုင်း အသေးစိတ်တိုင်းကို ကိုယ်တိုင် ဆုံးဖြတ်နေရပြီး၊ အဆင့် တစ်ခု
      မှားနေရင်လည်း agent က အဲဒီအတိုင်းပဲ လုပ်သွားမှာပါ။ ရလဒ် မှန်မမှန် စစ်စရာ တစ်ခုမှ မပေးထားလို့ပါ။
      [[mark:s-good]] အဲဒီအစား ပြီးတယ် ဆိုတာကို AC နံပါတ်တွေနဲ့ ပေးလိုက်ပါ။ [[mark:s-loop]] ဒါဆိုရင် agent က
      တစ်ခုခု ပြင်၊ AC နဲ့ စစ်၊ မကိုက်ရင် ထပ်ပြင်ပြီး ပြန်စစ်တဲ့ အဝိုင်း၊ loop ကို AC အားလုံး အောင်တဲ့အထိ၊ pass
      ဖြစ်တဲ့အထိ ပတ်နိုင်ပါတယ်။ [[mark:s-me]] ဆိုလိုတာက ဘယ်လို လုပ်မလဲ ဆိုတာကို agent ကို ရွေးခွင့်ပေးပြီး၊ ဘာ
      ရရမလဲ ဆိုတာကိုတော့ ကိုယ်က ထိန်းထားတာပါ။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The factory model (success criteria over step-by-step instructions)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "Claude Code docs: Best practices (give Claude a check to run)",
          url: "https://code.claude.com/docs/en/best-practices",
        }
    actions:
      - {
          id: draw-s-title,
          type: whiteboard.apply,
          at: { mark: s-title },
          open: true,
          clear: true,
          upsertIds: [s-title],
        }
      - {
          id: draw-s-steps,
          type: whiteboard.apply,
          at: { mark: s-steps },
          upsertIds: [s-h1, s-l1, s-l2, s-l3],
          drawMs: 1800,
        }
      - {
          id: draw-s-bad,
          type: whiteboard.apply,
          at: { mark: s-bad },
          upsertIds: [s-bad-box, s-bad],
          drawMs: 1000,
        }
      - {
          id: draw-s-good,
          type: whiteboard.apply,
          at: { mark: s-good },
          upsertIds: [s-h2, s-ac-box, s-ac],
          drawMs: 1300,
        }
      - {
          id: draw-s-loop,
          type: whiteboard.apply,
          at: { mark: s-loop },
          upsertIds: [s-a1, s-loop-box, s-loop, s-loop-label],
          drawMs: 1800,
        }
      - {
          id: draw-s-me,
          type: whiteboard.apply,
          at: { mark: s-me },
          upsertIds: [s-me],
          drawMs: 1000,
        }

  - id: unsure
    narration: >
      [[mark:close-s]] editor ထဲ ပြန်သွားရအောင်။ [[mark:type-unsure]] brief ရဲ့ နောက်ဆုံး အပိုင်းက မသေချာတဲ့
      အချိန်မှာ agent ဘာလုပ်ရမလဲ ဆိုတာကို ကြိုဆုံးဖြတ်ထားတာပါ။ [[mark:sel-unsure]] အထူးသဖြင့် ဆိုင်ရဲ့ စည်းကမ်း၊
      business rule တွေကို ကာကွယ်ထားတာပါ။ ဥပမာ ဆိုင်ပိတ်ခါနီး ဘယ်နှမိနစ်အထိ ကြိုမှာခွင့်ပေးမလဲ ဆိုတာကို
      ဆိုင်ပိုင်ရှင် မြမြ မဖြေရသေးပါဘူး။ agent က ဆယ်မိနစ် လို ဂဏန်း တစ်ခုကို သူ့ဘာသာ ရွေးပြီး ဆက်သွားတာထက်၊
      ရပ်ပြီး မေးတာက နည်းနည်း နှေးပေမဲ့ ပိုစိတ်ချရပါတယ်။ အဲဒီ မေးခွန်းကို မြမြ ဆီ ယူသွားဖို့ကတော့ ကိုယ့်တာဝန်ပါ။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The developer's changing role (the 80% problem: business-logic assumptions)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - { id: close-s, type: whiteboard.apply, at: { mark: close-s }, open: false }
      - id: type-unsure
        type: editor.type
        at: { mark: type-unsure }
        target: { file: tasks/01-order-form.md, after: "စာရင်း ပြန်ပေးပါ။\n\n", occurrence: 1 }
        text: "## If unsure\nရပ်ပြီး မေးပါ။ business rule တွေကို ခန့်မှန်းပြီး မဆုံးဖြတ်ပါနဲ့။\n"
        cadence: line-by-line
      - {
          id: sel-unsure,
          type: editor.select,
          at: { mark: sel-unsure },
          target:
            {
              file: tasks/01-order-form.md,
              text: "business rule တွေကို ခန့်မှန်းပြီး မဆုံးဖြတ်ပါနဲ့။",
              occurrence: 1,
            },
        }

  - id: plan-first
    chapter: Plan ကို အရင် တောင်းပါ
    narration: >
      [[mark:p-title]] brief ရေးပြီးပြီ ဆိုပေမဲ့ code ကို ချက်ချင်း မရေးခိုင်းသေးပါဘူး။ [[mark:p-flow]] brief ကို
      ပေးပြီး၊ plan ကို အရင် ပြန်ပေးခိုင်းပါမယ်။ plan ဆိုတာ agent က မလုပ်ခင် ဘာတွေ လုပ်မလဲ ပြန်ပြောတဲ့ စာရင်းပါ။
      [[mark:p-review]] ကိုယ်က plan ကို ပြန်စစ်ကြည့်ပြီး၊ သဘောတူမှ code ကို စရေးခိုင်းပါတယ်။ coding agent
      တချို့မှာ ဒီလို plan အရင် ပြပြီး ခွင့်ပြုချက် ရမှ ဖိုင်တွေကို ပြင်တဲ့ သီးသန့် mode တောင် ပါပါတယ်။ plan
      စာရင်း တစ်ခုကို ပြင်တာက ရေးပြီးသား code ကို ပြင်တာထက် အများကြီး မြန်ပါတယ်။ [[mark:p-q1]] plan ကို ဖတ်တဲ့အခါ
      မေးခွန်း သုံးခု မေးပါ။ ပထမက ခိုင်းတဲ့ အလုပ်ကိုပဲ လုပ်မှာလား ဆိုတာပါ။ [[mark:p-q2]] ဒုတိယက မခိုင်းတာ
      ထပ်ထည့်ထားလား ဆိုတာပါ။ [[mark:p-q3]] တတိယက ပြီးရင် ဘယ်လို စစ်မလဲ ဆိုတာ ပါလား ဆိုတာပါ။
    sources:
      - {
          title: "Claude Code docs: Common workflows (plan before editing)",
          url: "https://code.claude.com/docs/en/common-workflows",
        }
      - {
          title: "The New SDLC (Burmese edition): The developer's changing role (evaluation)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: draw-p-title,
          type: whiteboard.apply,
          at: { mark: p-title },
          open: true,
          clear: true,
          upsertIds: [p-title],
        }
      - {
          id: draw-p-flow,
          type: whiteboard.apply,
          at: { mark: p-flow },
          upsertIds: [p-b1-box, p-b1, p-a1, p-b2-box, p-b2],
          drawMs: 1800,
        }
      - {
          id: draw-p-review,
          type: whiteboard.apply,
          at: { mark: p-review },
          upsertIds: [p-a2, p-b3-box, p-b3, p-a3, p-b4-box, p-b4],
          drawMs: 2000,
        }
      - {
          id: draw-p-q1,
          type: whiteboard.apply,
          at: { mark: p-q1 },
          upsertIds: [p-qh, p-q1],
          drawMs: 1400,
        }
      - {
          id: draw-p-q2,
          type: whiteboard.apply,
          at: { mark: p-q2 },
          upsertIds: [p-q2],
          drawMs: 900,
        }
      - {
          id: draw-p-q3,
          type: whiteboard.apply,
          at: { mark: p-q3 },
          upsertIds: [p-q3],
          drawMs: 900,
        }

  - id: plan-review
    narration: >
      [[mark:close-p]] ဥပမာ အနေနဲ့ agent က ဒီလို plan ပြန်ပေးတယ် ဆိုပါစို့။ tasks folder ထဲက plan ဖိုင်ပါ။
      [[mark:sel-steps12]] ပထမ နှစ်ဆင့်က ရည်မှန်းချက်ထဲက form ကို တိုက်ရိုက် ဆောက်မယ့် အဆင့်တွေ ဖြစ်လို့
      ကိုက်ပါတယ်။ [[mark:sel-step4]] စတုတ္ထ အဆင့်ကလည်း brief ထဲက ပြီးတယ် ဆိုတဲ့ စစ်ချက်တွေကို ဘယ်လို စစ်မလဲ ဆိုတာ
      ပြထားလို့၊ တတိယ မေးခွန်းကို ဖြေထားပါတယ်။ [[mark:sel-step3]] ဒါပေမဲ့ တတိယ အဆင့်ကို ကြည့်ပါ။ brief မှာ
      ဘယ်နေရာမှ မပါတဲ့ အကောင့်နဲ့ ဝင်ရတဲ့ စာမျက်နှာ၊ login တစ်ခုလုံးကို ထပ်ဆောက်ဖို့ ပါနေပါတယ်။ customer တွေ
      နောက်တစ်ခါ မှာရလွယ်အောင် ဆိုတဲ့ အကြောင်းပြချက်က ကောင်းသလို ထင်ရပေမဲ့၊ ဒါက ကိုယ် မခိုင်းထားတဲ့ အလုပ်ပါ။
    sources:
      - {
          title: "Claude Code docs: Common workflows (plan before editing)",
          url: "https://code.claude.com/docs/en/common-workflows",
        }
      - {
          title: "The New SDLC (Burmese edition): The developer's changing role (evaluation)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - { id: close-p, type: whiteboard.apply, at: { mark: close-p }, open: false }
      - {
          id: open-plan,
          type: workspace.openFile,
          at: { afterAction: close-p },
          path: tasks/01-plan.md,
        }
      - {
          id: sel-steps12,
          type: editor.select,
          at: { mark: sel-steps12 },
          target:
            {
              file: tasks/01-plan.md,
              text: "1. index.html မှာ order form ဆောက်မယ် — item၊ အရေအတွက်၊ လာယူချိန်၊ နာမည်၊ ဖုန်း\n2. စုစုပေါင်း ဈေးနှုန်းကို တွက်ပြမယ်\n",
              occurrence: 1,
            },
        }
      - {
          id: sel-step4,
          type: editor.select,
          at: { mark: sel-step4 },
          target:
            {
              file: tasks/01-plan.md,
              text: "4. AC-1 ကနေ AC-4 ကို ဖုန်း screen အရွယ်နဲ့ စစ်မယ်",
              occurrence: 1,
            },
        }
      - {
          id: sel-step3,
          type: editor.select,
          at: { mark: sel-step3 },
          target:
            {
              file: tasks/01-plan.md,
              text: "3. customer account နဲ့ login စာမျက်နှာ ထည့်မယ် — နောက်တစ်ခါ အလွယ်တကူ မှာနိုင်အောင်",
              occurrence: 1,
            },
        }

  - id: out-of-scope
    narration: >
      [[mark:open-spec]] spec ကို ပြန်ကြည့်ရအောင်။ [[mark:sel-out-login]] ဒီ version မှာ မဆောက်မယ့် အရာတွေကို
      ရေးထားတဲ့ အပိုင်းမှာ login ပါပြီးသားပါ။ login တစ်ခု ထည့်လိုက်တာနဲ့ password သိမ်းတာ၊ customer ရဲ့ data ကို
      ကာကွယ်တာ လို ကိုယ် စစ်ရမယ့် အလုပ်တွေ အများကြီး ပါလာပါတယ်။ ဒါကြောင့် တတိယ အဆင့်ကို ဖြုတ်ပြီး plan ကို
      ပြန်ပေးပါ လို့ agent ကို ပြန်ပြောပါမယ်။ ပြင်ထားတဲ့ plan ကို သဘောတူမှ code စရေးခိုင်းပါမယ်။
      [[mark:open-brief2]] ဒီ အမှားက brief ဘက်ကိုလည်း သင်ခန်းစာ ပေးပါတယ်။ ကိုယ့် brief က spec ရဲ့ rule နဲ့ AC
      တွေကိုပဲ ညွှန်ထားပြီး၊ မဆောက်ရမယ့် အရာတွေကို တိုက်ရိုက် မပြောထားခဲ့ပါဘူး။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The developer's changing role (evaluation)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - { id: open-spec, type: workspace.openFile, at: { mark: open-spec }, path: docs/spec.md }
      - {
          id: sel-out-login,
          type: editor.select,
          at: { mark: sel-out-login },
          target:
            {
              file: docs/spec.md,
              text: "Won't (for now) — delivery၊ online ငွေပေးချေမှု၊ login",
              occurrence: 1,
            },
        }
      - {
          id: open-brief2,
          type: workspace.openFile,
          at: { mark: open-brief2 },
          path: tasks/01-order-form.md,
        }

  - id: fix-brief
    narration: >
      [[mark:type-login]] ဒါကြောင့် မလုပ်ရတဲ့ အပိုင်းကို စာကြောင်း တစ်ကြောင်း ထပ်ဖြည့်ပြီး၊ spec က ဆုံးဖြတ်ထားတဲ့
      စည်းကို brief ထဲမှာ တိုက်ရိုက် ထည့်ထားပါမယ်။ ဒီ brief ကို နောက်တစ်ခါ ပြန်သုံးတဲ့အခါ ဒီ အမှား ထပ်ဖြစ်ဖို့
      နည်းသွားပါမယ်။ [[mark:sel-done-list2]] agent က ပြီးပါပြီ လို့ ပြန်ပေးတဲ့အခါမှာလည်း ကိုယ့်အလုပ်
      မပြီးသေးပါဘူး။ အရင်ဆုံး ဒီ စာကြောင်းက တောင်းထားတဲ့ အကျဉ်းချုပ်ကို ဖတ်ပါ။ AC အားလုံး pass ပါတယ် ဆိုတဲ့ စကား
      တစ်ခွန်းတည်းကို မယုံဘဲ၊ ဘယ်လို စစ်ခဲ့လဲ ဆိုတဲ့ အထောက်အထားကို တောင်းပြီး၊ ဖုန်းပေါ်မှာ ကိုယ်တိုင် ထပ်စစ်ပါ။
      ပြီးပြီလို့ နောက်ဆုံး ဆုံးဖြတ်တာက ကိုယ်ပါ။
    sources:
      - {
          title: "Claude Code docs: Best practices (ask for evidence, not just a claim that tests pass)",
          url: "https://code.claude.com/docs/en/best-practices",
        }
      - {
          title: "The New SDLC (Burmese edition): The developer's changing role (evaluation)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - id: type-login
        type: editor.type
        at: { mark: type-login }
        target: { file: tasks/01-order-form.md, after: "- package အသစ် မထည့်ပါနဲ့။\n", occurrence: 1 }
        text: "- login နဲ့ account မဆောက်ပါနဲ့။\n"
        cadence: line-by-line
      - {
          id: expect-login,
          type: expect.file,
          at: { afterAction: type-login },
          path: tasks/01-order-form.md,
          contains: "- login နဲ့ account မဆောက်ပါနဲ့။",
        }
      - {
          id: sel-done-list2,
          type: editor.select,
          at: { mark: sel-done-list2 },
          target:
            {
              file: tasks/01-order-form.md,
              text: "- ဘာပြင်ခဲ့လဲ၊ ဘာမလုပ်ခဲ့လဲ စာရင်း ပြန်ပေးပါ။",
              occurrence: 1,
            },
        }

  - id: quiz
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ ပြင်ပြီး ပြန်လာတဲ့ plan ထဲမှာ အော်ဒါ အသင့်ဖြစ်ရင် customer ဆီ SMS
      ပို့ပေးမယ် ဆိုတဲ့ အဆင့် အသစ် တစ်ခု ပါလာတယ် ဆိုပါစို့။ requirements မှာ ဖြစ်ရင် ကောင်းမယ့် Should အုပ်စုထဲ
      ပါပြီးသား feature ပါ။ ဒီ အဆင့်ကို လက်ခံမလား။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]]
      အဖြေကတော့ ဒီ task မှာ လက်မခံပါဘူး။ ဘာကြောင့်လဲဆိုတော့ SMS က ရှိရင် ကောင်းတဲ့ feature ဖြစ်ပေမဲ့၊ ဒီ task ရဲ့
      ရလဒ်က order form တစ်ခုတည်းမို့လို့ပါ။ အဲဒီ အဆင့်ကို ဖြုတ်ခိုင်းပြီး၊ နောက်မှ သူ့ brief နဲ့သူ task သီးသန့်
      တစ်ခုအဖြစ် အပ်ပါ။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The developer's changing role (decomposition, evaluation)",
