build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 9325

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: need
    chapter: မောင်မောင် ရဲ့ သံသယ
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ Knowledge base audit လို အချိန်ကြာတဲ့ အလုပ်ကို Anthropic ဘက်က run ပေးတဲ့ Managed
      Agents နဲ့ ပြီးခဲ့ပါတယ်။ Reply assistant ရဲ့ prototype အပိုင်းလည်း ဒီမှာ ရပ်ပါမယ်။
      [[mark:sel-billing]] အခု ခြောက်ပတ်မြောက် ရောက်ပါပြီ။ ဒီတစ်ပတ်မှာ ကိုယ်က Billing team နဲ့ အတူ ထိုင်ပြီး Claude
      Code ကို သူတို့ရဲ့ repository ထဲမှာ စသုံးကြည့်ပါမယ်။ Billing က သက်တမ်း ကိုးနှစ်ရှိတဲ့ codebase ပါ။
      [[mark:need-2]] Billing team lead မောင်မောင် က chat tool တွေကို သုံးဖူးပါတယ်။ code တစ်ပိုင်းကို ကူးထည့်၊ အဖြေကို
      ပြန်ကူးထုတ် ဆိုတဲ့ ပုံစံပါ။ အဖြေတွေက ဖတ်လို့ ကောင်းပေမဲ့ တခါတလေ repository ထဲမှာ မရှိတဲ့ function တွေကို
      ညွှန်းပြီး ပြောတတ်ပါတယ်။ ဒါကြောင့် Claude Code လို tool တွေလည်း ဒီ chat tool ပဲ နာမည်ပြောင်းထားတာ မဟုတ်လားလို့ မေးပါတယ်။
      [[mark:need-3]] မောင်မောင် ရဲ့ သံသယက အကြောင်းရင်း ရှိပါတယ်။ ဒါကြောင့် ဒီ lesson မှာ Claude Code က
      chat tool နဲ့ တကယ် ဘာကွာလဲ၊ repository ထဲမှာ ဘာတွေ လုပ်နိုင်လဲ ဆိုတာကို ကြည့်ပါမယ်။
    sources:
      - {
          title: "Claude Code Docs: How Claude Code works",
          url: "https://code.claude.com/docs/en/how-claude-code-works",
        }
    actions:
      - { id: open-readme, type: workspace.openFile, at: { mark: sel-billing }, path: README.md }
      - id: sel-billing
        type: editor.select
        at: { afterAction: open-readme }
        target:
          file: README.md
          text: "- Billing team နဲ့ Claude Code"

  - id: loop
    chapter: Chat tool နဲ့ coding agent
    narration: >
      [[mark:b-open]] chat tool နဲ့ coding agent ကို ဘေးချင်းယှဉ်ကြည့်ရအောင်။
      [[mark:b-chat]] chat tool က ကိုယ် ကူးထည့်ပေးတဲ့ စာကိုပဲ မြင်ပါတယ်။ late fee ကို ဘယ်မှာ တွက်လဲ မေးချင်ရင်
      ဆိုင်မယ်ထင်တဲ့ file ကို ကိုယ်က ရှာပြီး ကူးထည့်ရပါတယ်။ မှားတဲ့ file ကို ထည့်မိရင် အဖြေကလည်း မှားတဲ့ file ပေါ်မှာပဲ
      တည်ပါတယ်။ ရလာတဲ့ အဖြေကို ကိုယ်က code ထဲ ပြန်ကူးထည့်ပြီး ကိုယ်တိုင် စမ်းရပါတယ်။
      [[mark:b-agent]] Claude Code ကတော့ terminal ထဲကနေ code ကို ဖတ်၊ ပြင်၊ command run ပေးတဲ့ coding agent ပါ။
      agent ဆိုတာ ရည်မှန်းချက် ရောက်တဲ့အထိ tool တွေကို ကိုယ်တိုင် ရွေးသုံးပြီး အဆင့်ဆင့် လုပ်သွားတဲ့ model ပါ။ docs
      က Claude Code ကို model ရဲ့ ပတ်ပတ်လည်မှာ tool တွေ ပေးပြီး context ကို စီမံပေးတဲ့ agentic harness လို့ ခေါ်ပါတယ်။
      [[mark:b-gather]] Claude Code အလုပ်လုပ်ပုံမှာ အဆင့် သုံးဆင့် ရှိပါတယ်။ ပထမ တစ်ဆင့်က context စုဆောင်းတာပါ။ file တွေကို
      ကိုယ်တိုင် ရှာပြီး ဖတ်ပါတယ်။
      [[mark:b-act]] ဒုတိယ တစ်ဆင့်က လုပ်ဆောင်တာပါ။ file ပြင်တာ၊ command run တာ ဖြစ်ပါတယ်။
      [[mark:b-verify]] တတိယ တစ်ဆင့်က ရလဒ်ကို စစ်တာပါ။ test ကို run ပြီး error ကို ဖတ်တာမျိုးပါ။ ရလဒ်က နောက်တစ်ဆင့်ကို
      ဆုံးဖြတ်ပေးတာမို့ အလုပ် ပြီးတဲ့အထိ ဒီ သုံးဆင့်က ထပ်ခါထပ်ခါ လည်ပါတယ်။ မေးခွန်း တစ်ခုအတွက်ဆိုရင် ပထမ အဆင့်
      တစ်ခုတည်းနဲ့ ပြီးနိုင်ပြီး၊ bug ပြင်တာကတော့ သုံးဆင့်လုံးကို အကြိမ်ကြိမ် ပတ်ရတတ်ပါတယ်။
      [[mark:b-tools]] ဒါတွေကို လုပ်ဖို့ Claude Code မှာ built-in tool တွေ အမျိုးအစားလိုက် ရှိပါတယ်။ file ဖတ်၊ ပြင်တဲ့ tool၊
      pattern နဲ့ ရှာတဲ့ tool၊ shell command၊ test နဲ့ git ကို run တဲ့ tool တွေက Billing မှာ အများဆုံး သုံးမယ့် အမျိုးအစားတွေပါ။
      web ကနေ docs ရှာတာ၊ type error နဲ့ definition တွေကို ကြည့်တဲ့ code intelligence ဆိုတာတွေလည်း ရှိပါတယ်။
    sources:
      - {
          title: "Claude Code Docs: How Claude Code works",
          url: "https://code.claude.com/docs/en/how-claude-code-works",
        }
      - {
          title: "Claude Code Docs: Tools reference",
          url: "https://code.claude.com/docs/en/tools-reference",
        }
    actions:
      - {
          id: draw-b-open,
          type: whiteboard.apply,
          at: { mark: b-open },
          open: true,
          clear: true,
          upsertIds: [b-title],
        }
      - {
          id: draw-b-chat,
          type: whiteboard.apply,
          at: { mark: b-chat },
          upsertIds: [c-box, c-l, c-in, c-out],
          drawMs: 1800,
        }
      - {
          id: draw-b-gather,
          type: whiteboard.apply,
          at: { mark: b-gather },
          upsertIds: [g1, g1-l],
          drawMs: 900,
        }
      - {
          id: draw-b-act,
          type: whiteboard.apply,
          at: { mark: b-act },
          upsertIds: [g-a1, g2, g2-l],
          drawMs: 1200,
        }
      - {
          id: draw-b-verify,
          type: whiteboard.apply,
          at: { mark: b-verify },
          upsertIds: [g-a2, g3, g3-l, g-back],
          drawMs: 1600,
        }

  - id: welcome
    chapter: စစချင်း screen
    narration: >
      [[mark:w-open]] Billing ရဲ့ repository folder ထဲမှာ Claude Code ကို စဖွင့်လိုက်ရင် ဒီလို မြင်ရပါတယ်။
      [[mark:w-version]] ထိပ်ဆုံးမှာ Claude Code ရဲ့ version ရှိပါတယ်။
      [[mark:w-model]] အောက်မှာ အခု သုံးနေတဲ့ model ပါ။ docs အရ coding အလုပ် အများစုအတွက် Sonnet က လုံလောက်ပြီး၊
      ရှုပ်ထွေးတဲ့ architecture ဆုံးဖြတ်ချက်တွေမှာ Opus က ပိုခိုင်မာတဲ့ ဆင်ခြင်မှု ပေးပါတယ်။ model ကို session အတွင်းမှာ
      ပြောင်းလို့ ရပါတယ်။
      [[mark:w-effort]] ညာဘက်က medium ဆိုတာကတော့ Claude Platform အပိုင်းမှာ တွေ့ခဲ့တဲ့ effort အဆင့်ပါ။ model ကို
      ဘယ်လောက် နက်နက် တွေးခိုင်းမလဲ ဆိုတာ Claude Code မှာလည်း ချိန်လို့ ရပါတယ်။
      [[mark:w-folder]] model ရဲ့ အောက်က စာကြောင်းက folder ပါ။ ဒါက အရေးကြီးပါတယ်။ Claude Code က စဖွင့်တဲ့ project folder
      ထဲက file တွေကို ဖတ်နိုင်ပြီး၊ folder အပြင်က file တွေအတွက်တော့ ခွင့်တောင်းပါတယ်။ terminal မှာ ကိုယ် run
      လို့ရတဲ့ command တွေ၊ git ရဲ့ အခြေအနေ၊ CLAUDE.md ဆိုတဲ့ project မှတ်စု file တို့ကိုလည်း မြင်ပါတယ်။
      [[mark:w-prompt]] အလယ်က box မှာ ကိုယ်က ခိုင်းချင်တာကို ရေးပါတယ်။ file တွေကို ကူးထည့်စရာ မလိုပါဘူး။
      [[mark:w-mode]] အောက်ဆုံး စာကြောင်းက permission mode ပါ။ permission mode ဆိုတာ ဘယ်အရာတွေကို မမေးဘဲ လုပ်ခွင့်ပေးမလဲ
      သတ်မှတ်တဲ့ mode ပါ။ ဒီ lesson ကို ရေးတဲ့ အချိန်မှာ terminal ထဲက session တွေက auto mode နဲ့ စပါတယ်။ Claude
      Code က တစ်ခုခု မလုပ်ခင် ခွင့်တောင်းမလား ဆိုတာကို ဒီ mode က ဆုံးဖြတ်ပါတယ်။
    sources:
      - {
          title: "Claude Code Docs: How Claude Code works",
          url: "https://code.claude.com/docs/en/how-claude-code-works",
        }
      - {
          title: "Claude Code Docs: Permission modes",
          url: "https://code.claude.com/docs/en/permission-modes",
        }
    actions:
      - { id: close-loop, type: whiteboard.apply, at: { mark: w-open }, open: false }
      - {
          id: show-welcome,
          type: slide.show,
          at: { mark: w-open, offsetMs: 600 },
          slideId: welcome,
        }
      - {
          id: pt-version,
          type: slide.point,
          at: { mark: w-version },
          target: { x: 0.21, y: 0.359 },
        }
      - { id: pt-model, type: slide.point, at: { mark: w-model }, target: { x: 0.19, y: 0.394 } }
      - { id: pt-effort, type: slide.point, at: { mark: w-effort }, target: { x: 0.84, y: 0.571 } }
      - { id: pt-folder, type: slide.point, at: { mark: w-folder }, target: { x: 0.21, y: 0.429 } }
      - { id: pt-prompt, type: slide.point, at: { mark: w-prompt }, target: { x: 0.05, y: 0.641 } }
      - { id: pt-mode, type: slide.point, at: { mark: w-mode }, target: { x: 0.15, y: 0.712 } }

  - id: turn
    chapter: Claude Code ဖြေတဲ့ ပုံ
    narration: >
      [[mark:t-open]] အခု ပထမဆုံး မေးခွန်း တစ်ခု မေးကြည့်ရအောင်။ ဒီ screen က ပြင်ဆင်ထားတဲ့ ဥပမာ အလှည့် တစ်ခုပါ။
      [[mark:t-prompt]] late fee ကို invoice မှာ ဘယ်လို ပေါင်းလဲ လို့ မေးထားပါတယ်။ file တစ်ခုမှ ထည့်မပေးထားပါဘူး။
      [[mark:t-plan]] Claude က ပထမဆုံး invoice code နဲ့ သူ့ test ကို ဖတ်မယ်လို့ ပြောပါတယ်။ မဖြေခင် ဘာကို
      ကြည့်မလဲ ဆိုတာ ပြောပြတာပါ။
      [[mark:t-read]] ပြီးတော့ file နှစ်ခုကို ဖတ်ပါတယ်။ အဆင့် သုံးဆင့်ထဲက context စုဆောင်းတဲ့ အဆင့်ပါ။ ဘယ် file
      ကို ဖတ်ရမလဲ ဆိုတာ prompt ထဲမှာ မပါပါဘူး။ တကယ့် session မှာလည်း ဖတ်ရမယ့် file ကို Claude Code က ကိုယ်တိုင် ရှာပြီး ရွေးပါတယ်။
      [[mark:t-answer]] အဖြေက late fee ကို ဘယ်အခြေအနေမှာ ပေါင်းလဲ ဆိုတာကို code ထဲက စည်းကမ်းအတိုင်း
      ရှင်းပြထားပါတယ်။
      [[mark:t-ref]] အရေးကြီးတာက အဖြေက repository ထဲက တကယ့် file နဲ့ test ကို ညွှန်းပြီး ပြောနေတာပါ။ chat tool
      လို မရှိတဲ့ function ကို ခန့်မှန်းပြောတာ မဟုတ်ပါဘူး။
      [[mark:t-check]] ဒါပေမဲ့ Billing developer တစ်ယောက်က ညွှန်းထားတဲ့ code နဲ့ test ကို ကိုယ်တိုင် တိုက်စစ်ရဦးမှာပါ။ မောင်မောင် ကို
      ယုံကြည်စေမှာက demo တစ်ခု မဟုတ်ဘဲ၊ team ရဲ့ code နဲ့ တိုက်စစ်လို့ မှန်တဲ့ အဖြေတွေ စုလာတာပါ။
    sources:
      - {
          title: "Claude Code Docs: How Claude Code works",
          url: "https://code.claude.com/docs/en/how-claude-code-works",
        }
      - { title: "Claude Code Docs: Quickstart", url: "https://code.claude.com/docs/en/quickstart" }
    actions:
      - {
          id: show-turn,
          type: slide.show,
          at: { mark: t-open, offsetMs: -1200 },
          slideId: turn-read,
        }
      - {
          id: pt-t-prompt,
          type: slide.point,
          at: { mark: t-prompt },
          target: { x: 0.18, y: 0.259 },
        }
      - { id: pt-t-plan, type: slide.point, at: { mark: t-plan }, target: { x: 0.17, y: 0.319 } }
      - { id: pt-t-read, type: slide.point, at: { mark: t-read }, target: { x: 0.18, y: 0.379 } }
      - {
          id: pt-t-answer,
          type: slide.point,
          at: { mark: t-answer },
          target: { x: 0.18, y: 0.440 },
        }
      - { id: pt-t-ref, type: slide.point, at: { mark: t-ref }, target: { x: 0.52, y: 0.440 } }
      - { id: pt-t-check, type: slide.point, at: { mark: t-check }, target: { x: 0.22, y: 0.560 } }

  - id: tasks
    chapter: ပထမဆုံး အလုပ် သုံးခု
    narration: >
      [[mark:k-open]] Claude Code ကို တခြား နေရာတွေမှာလည်း သုံးလို့ရပါတယ်။ terminal အပြင် VS Code လို IDE ထဲမှာရော၊
      desktop app နဲ့ web မှာရော ရှိပြီး၊ engine တစ်ခုတည်းကို သုံးတာမို့ setting တွေ အတူတူ အလုပ်လုပ်ပါတယ်။ ပုံမှန်က
      ကိုယ့်စက်ပေါ်မှာ run ပြီး၊ Anthropic ရဲ့ cloud ပေါ်မှာ run တဲ့ ရွေးချယ်မှုလည်း ရှိပါတယ်။ session အသစ် တစ်ခုစီက
      context အသစ်နဲ့ စတာကိုလည်း မှတ်ထားပါ။
      [[mark:k-rule]] Billing team အတွက် ပထမဆုံး အလုပ်တွေကို ချရေးကြည့်ရအောင်။ စည်းကမ်းက ဘာမှ မပြင်ခိုင်းဘဲ ဖတ်ပြီး
      ရှင်းပြခိုင်းတာပါ။ ဖတ်တာက ဘာမှ မပျက်စေနိုင်ပြီး၊ အဖြေ မှန်မမှန်ကို team က code နဲ့ တိုက်စစ်လို့ ရပါတယ်။
      [[mark:type-1]] ပထမ အလုပ်က late fee ကို invoice မှာ ဘယ်လို ပေါင်းလဲ ရှင်းပြခိုင်းတာပါ။ customer တွေ အမေးများပြီး၊
      code ရော test ရော ရှိပြီးသားမို့ အဖြေကို ချက်ချင်း တိုက်စစ်လို့ ရပါတယ်။
      [[mark:type-2]] ဒုတိယ အလုပ်က ညတိုင်း run တဲ့ retry job ရဲ့ အဆင့်တွေကို ရှင်းပြခိုင်းတာပါ။ ပြီးခဲ့တဲ့ တစ်ခေါက်
      ပြင်ပြီးနောက် late fee နှစ်ခါ ကောက်မိတာ ရှိခဲ့လို့ team က ဒီ job ကို အသေအချာ နားလည်ချင်ပါတယ်။
      [[mark:type-3]] တတိယ အလုပ်က test တွေ ဘာကို စစ်ထားလဲ၊ ဘာကို မစစ်ရသေးလဲ စာရင်း လုပ်ခိုင်းတာပါ။ နောက်ပိုင်း
      code ပြင်ခိုင်းတော့မယ်ဆိုရင် ဘယ်နေရာမှာ test အားနည်းလဲ အရင် သိထားဖို့ လိုပါတယ်။
    sources:
      - { title: "Claude Code Docs: Platforms", url: "https://code.claude.com/docs/en/platforms" }
      - { title: "Claude Code Docs: Overview", url: "https://code.claude.com/docs/en/overview" }
    actions:
      - { id: close-turn, type: slide.close, at: { mark: k-open } }
      - {
          id: open-tasks,
          type: workspace.openFile,
          at: { afterAction: close-turn },
          path: notebook/25-first-tasks.md,
        }
      - id: sel-rule
        type: editor.select
        at: { mark: k-rule }
        target:
          file: notebook/25-first-tasks.md
          text: "စည်းကမ်း: ဘာမှ မပြင်ခိုင်းဘဲ ဖတ်ပြီး ရှင်းပြခိုင်းမယ်။"
      - id: type-1
        type: editor.type
        at: { mark: type-1 }
        cadence: line-by-line
        target: { file: notebook/25-first-tasks.md, after: "code နဲ့ တိုက်စစ်မယ်။\n\n" }
        text: "## 1. Late fee ကို invoice မှာ ဘယ်လို ပေါင်းလဲ ရှင်းပြခိုင်း\n- ဘာကြောင့်: customer အမေးများ၊ code နဲ့ test ရှိပြီးသား\n\n"
      - id: type-2
        type: editor.type
        at: { mark: type-2 }
        cadence: line-by-line
        target: { file: notebook/25-first-tasks.md, after: "code နဲ့ test ရှိပြီးသား\n\n" }
        text: "## 2. ညတိုင်း run တဲ့ retry job ရဲ့ အဆင့်တွေကို ရှင်းပြခိုင်း\n- ဘာကြောင့်: ပြင်ပြီးနောက် late fee နှစ်ခါ ကောက်မိတာ ရှိခဲ့\n\n"
      - id: type-3
        type: editor.type
        at: { mark: type-3 }
        cadence: line-by-line
        target: { file: notebook/25-first-tasks.md, after: "နှစ်ခါ ကောက်မိတာ ရှိခဲ့\n\n" }
        text: "## 3. Test တွေ ဘာ စစ်ထားလဲ၊ ဘာ မစစ်ရသေးလဲ စာရင်းလုပ်ခိုင်း\n- ဘာကြောင့်: code မပြင်ခင် test အားနည်းတဲ့ နေရာ သိဖို့\n"
      - id: expect-3
        type: expect.file
        at: { afterAction: type-3 }
        path: notebook/25-first-tasks.md
        contains: "## 3. Test တွေ ဘာ စစ်ထားလဲ၊ ဘာ မစစ်ရသေးလဲ စာရင်းလုပ်ခိုင်း\n"

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ developer တစ်ယောက်က invoice code ကို ပြင်ပြီးနောက်၊ ပြင်ထားတဲ့ code ကို
      chat tool ထဲ ကူးထည့်ပြီး test တွေ အားလုံး pass ဦးမလား လို့ မေးတယ် ဆိုပါစို့။ chat tool ဆီက ဘာ ပြန်ရမလဲ။
      [[mark:q-a]] ပထမ အဖြေက test တွေကို run ထားတဲ့ ရလဒ် ဆိုတာပါ။
      [[mark:q-b]] ဒုတိယ အဖြေက code ကို ဖတ်ပြီး ခန့်မှန်းထားတဲ့ အဖြေ ဆိုတာပါ။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ တစ်ခုပါ။ ဘာကြောင့်လဲဆိုတော့ chat tool က repository ကိုလည်း မမြင်ရ၊ test
      command ကိုလည်း run လို့ မရလို့ပါ။ ကူးထည့်ထားတဲ့ စာကို ဖတ်ပြီး pass မယ် ထင်ပါတယ်လို့ ယုံကြည်စွာ ပြောနိုင်ပေမဲ့
      အဲဒါက ခန့်မှန်းချက်ပါ။ Claude Code ကတော့ repository ထဲမှာ test command ကို ကိုယ်တိုင် run ပြီး ထွက်လာတဲ့ ရလဒ်ကို
      ဖတ်နိုင်ပါတယ်။ ရလဒ်ကို စစ်တဲ့ တတိယ အဆင့်ပါ။
      [[mark:q-rule]] ဒါကြောင့် run ကြည့်မှ သိနိုင်တဲ့ မေးခွန်း ဆိုရင် ခန့်မှန်းချက်ကို မယုံပါနဲ့။ run ပြီး စစ်နိုင်တဲ့ agent
      ကို ခိုင်းပြီး၊ run ခဲ့တဲ့ command နဲ့ ရလဒ်ကို ပြခိုင်းပါ။
    sources:
      - {
          title: "Claude Code Docs: How Claude Code works",
          url: "https://code.claude.com/docs/en/how-claude-code-works",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: q-rule },
          upsertIds: [q-t1, q-t2],
          drawMs: 1600,
        }

  - id: your-turn
    chapter: ကိုယ့် repository အတွက်
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ကိုယ့် repository အတွက် ပထမဆုံး အလုပ် သုံးခုကို
      ဒီ ပုံစံအတိုင်း ရေးကြည့်ပါ။ အလုပ် တစ်ခုစီက ဘာမှ မပြင်ဘဲ ဖတ်ပြီး ရှင်းပြခိုင်းတဲ့ အလုပ် ဖြစ်ရပါမယ်။
      [[mark:turn-2]] ဘာကြောင့် ဒီ အလုပ်ကို ရွေးလဲ ဆိုတဲ့ စာကြောင်း တစ်ကြောင်းစီလည်း ထည့်ပါ။ team ထဲက တစ်ယောက်ယောက်က
      အဖြေကို code နဲ့ တိုက်စစ်လို့ ရတဲ့ အလုပ်တွေကို ရွေးရင် ပိုကောင်းပါတယ်။
    sources:
      - { title: "Claude Code Docs: Quickstart", url: "https://code.claude.com/docs/en/quickstart" }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: turn }, open: false }
