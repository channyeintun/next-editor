# SRE from zero, lesson 12: How complex systems fail (Burmese concept lesson).
#
# Built from the approved voice script
# docs/sre-course/voice-scripts/sre-12-how-complex-systems-fail.md. Every
# spoken character is that script's "> " lines, unchanged; each ⟪…⟫ marker
# became a [[mark:…]] at the same place. Check it with:
#   bun ~/Documents/sre-course/work/check-narration.ts \
#     docs/sre-course/voice-scripts/sre-12-how-complex-systems-fail.md \
#     src/studio/scripts/sre-12-how-complex-systems-fail.yaml
#
# Nothing runs: deck pages and the whiteboard carry the lesson, and notes.md is
# the recap. The workspace and runtime follow the validated no-code skeleton
# (WebContainer, empty init command, a harmless dev script).
#
# One mark adds no spoken text and sits at an existing ၊: b1-s1b splits board
# B1's first step so no step adds more than three labelled elements (the first
# two cheese slices land with "let's draw it", the last two as the narration
# reaches the canary). The voice script's own pacing pages (l12_p01b, p01c,
# p01d, p02b, p02c, p02d, p03b, p03c, p04b) keep every page or board step under
# ~30 s at 70 ms/char, so no other pacing mark was needed.
#
# ⟪close board⟫ straight into the next board (scene 4) wipes the open board
# 400 ms early (whiteboard.apply clear) instead of closing the panel, as in
# lesson 8, so the editor does not flash between two boards; the next board
# then draws with open: true, clear: true as usual. A board followed by a deck
# page closes the panel (open: false) 400 ms before the page, as in Module 1.
#
# Boards (B1 Swiss cheese slices, B2 drift toward a red boundary, B3 P5 bars).
# Colour jobs: #1e1e1e ink (paints white) for titles, arrows, holes and the
# axis; blue the thing named (the defence layers, the Wallet team's shortcuts,
# the spare-capacity bars); green healthy or done (luck, the safe zone, the
# fixes, success still fine); red failure (the push, the boundary, the outage,
# the cliff); orange the caveat (the long-standing gap, "root cause", the
# pressures, where postmortems react, what to watch). A label on two lines is
# two text assets, one per line, so each line meets the 0.55 em width rule on
# its own.
#
# Deck pages: deck "Next Editor · SRE 3 · Respond and learn", published at the
# /pub URL below. Until Lesson 12's pages are built in it, the Director stops
# at 'page "l12_p01" is not in the published deck' (expected before the pages
# step; schema, marks, dialogs and critic pass). Page plan:
# ~/Documents/sre-course/work/pages/sre-12-how-complex-systems-fail.json
# The cover title keeps the voice script's 37 code points, past the K1 title's
# safe 34 (a pure-Burmese bound): 27 of them are Burmese, and even at 0.54 em
# per code point the line is ~565 of 586 pt; deck-kit.md measured a 37-code-
# point mixed title at the same 30 pt bold at 492 pt. Confirm on the thumbnail.
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/sre-12-how-complex-systems-fail.yaml
#   bun scripts/studio-compile-check.ts src/studio/scripts/sre-12-how-complex-systems-fail.yaml
