build:
  # Studio swaps in the Burmese voice chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 2612

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: hook
    chapter: လစာထုတ်ရက်ရဲ့ near miss
    narration: >
      [[mark:show-p01]] ငွေ နှစ်ခါ ဖြတ်ခဲ့တဲ့ ည နောက်မှာ Wallet ကိုလည်း idempotency key တွေ တပ်ပြီးပြီ၊ postmortem template ကလည်း ကံကောင်းခဲ့တာကိုပါ မေးလာပါပြီ။ နောက်လ လစာထုတ်ရက် ညနေမှာတော့ Operator B က endpoint ပြောင်းလိုက်လို့ Top-up engineer တစ်ယောက်က doc ဟောင်းထဲက address ကို config ထဲ ကူးထည့်ပြီး push လုပ်လိုက်ပါတယ်။
      [[mark:show-p01b]] အဲဒီ address က Operator B ရဲ့ test endpoint ဟောင်း ဖြစ်နေပါတယ်။ test endpoint က top-up တိုင်းကို အောင်မြင်တယ်လို့ ပြန်ဖြေလို့ dashboard တွေက အစိမ်းရောင်ပဲ ပြနေပေမဲ့ user တွေရဲ့ ဖုန်းထဲကို ဘေလ် တကယ် မဝင်ပါဘူး။ code review ရော၊ config check ရော၊ canary ရော ဒါကို မဖမ်းမိခဲ့ပါဘူး။
      [[mark:show-p01c]] ၁၀ မိနစ်လောက် ကြာတော့ support lead မစုက ဘေလ် မဝင်ဘူး ဆိုတဲ့ ဒေါသထွက်တဲ့ Facebook post တွေကို တိုက်ဆိုင်ပြီး မြင်လို့ on-call ကို ဖုန်းဆက်တော့မှ rollback လုပ်ဖြစ်ပါတယ်။ top-up ရာဂဏန်းလောက်ပဲ fail ခဲ့ပေမဲ့ ကံ နည်းနည်း မကောင်းရင် တစ်ညလုံး ပျက်နိုင်တဲ့ ဒီလို အဖြစ်ကို near miss လို့ ခေါ်ပါတယ်။ ဘယ်သူမှ ထူးထူးဆန်းဆန်း မမှားခဲ့ပါဘူး။ ဒါဆို ရှုပ်ထွေးတဲ့ system တွေက ဘာကြောင့် ဒီလို ပျက်တတ်တာလဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "How Complex Systems Fail (Richard Cook)",
          url: "https://how.complexsystems.fail/",
        }
      - {
          title: "Workbook: Postmortem Culture: Learning from Failure",
          url: "https://sre.google/workbook/postmortem-culture/",
        }
    actions:
      # -1750 / -1450, as in Module 1: a pull-back over 1780 ms pushes the first dialog
      # past the 2 s opening handle, which src/studio/plans/index.test.ts rejects.
      - { id: collapse-dock, type: runtime.collapseDock, at: { scene: start, offsetMs: -1750 } }
      - {
          id: show-p01,
          type: slide.show,
          at: { mark: show-p01, offsetMs: -1450 },
          slideId: l12-p01,
        }
      - { id: show-p01b, type: slide.show, at: { mark: show-p01b }, slideId: l12-p01b }
      - { id: show-p01c, type: slide.show, at: { mark: show-p01c }, slideId: l12-p01c }

  - id: two-kinds
    chapter: Complex system
    narration: >
      [[mark:show-p01d]] Padauk က ဒီ near miss အတွက်လည်း လူကို အပြစ်မရှာဘဲ system ကို ကြည့်တဲ့ blameless postmortem ရေးတော့ ပျက်နေတဲ့ အပိုင်း ဘာမှ မတွေ့ပါဘူး။ reviewer က ပြောင်းထားတဲ့ စာကြောင်းကို စစ်ခဲ့တယ်၊ test endpoint က သူ့အလုပ်ကို လုပ်ခဲ့တယ်၊ engineer ကလည်း doc ကို ယုံခဲ့တာပါ။
      [[mark:show-p02]] နာရီ တစ်လုံးလို ရိုးရှင်းတဲ့ system ကို အပိုင်းလိုက် နားလည်လို့ရပြီး ပျက်တဲ့အခါလည်း အကြောင်းရင်း ကွင်းဆက်ကို လိုက်ပြီး ကျိုးနေတဲ့ အပိုင်းကို လဲလိုက်ရုံပါပဲ။ Padauk လို complex system မှာတော့ service တွေ၊ operator တွေနဲ့ လူတွေက တစ်ခုနဲ့ တစ်ခု အမြဲ လိုက်ညှိနေကြလို့ အပိုင်းတိုင်း ကောင်းနေရင်တောင် အားလုံး ပေါင်းလိုက်တော့ ပျက်နိုင်ပါတယ်။ ဒါကြောင့် ပြင်ရမှာက အပိုင်း တစ်ခု မဟုတ်ဘဲ သူတို့ ဆက်ဆံပုံပါ။
      [[mark:show-p02b]] doc ရေးခဲ့သူ၊ reviewer နဲ့ Facebook ကြည့်နေတဲ့ မစုလို လူတွေဟာလည်း code လိုပဲ ဒီ system ရဲ့ အစိတ်အပိုင်းပါ။ ဒီ lesson က model တွေကလည်း အမှန်တရား မဟုတ်ဘဲ စဉ်းစားဖို့ ကူညီတဲ့ tool တွေပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "How Complex Systems Fail (Richard Cook)",
          url: "https://how.complexsystems.fail/",
        }
      - {
          title: 'Reason, "Human error: models and management" (BMJ, PMC)',
          url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC1117770/",
        }
    actions:
      - { id: show-p01d, type: slide.show, at: { mark: show-p01d }, slideId: l12-p01d }
      - { id: show-p02, type: slide.show, at: { mark: show-p02 }, slideId: l12-p02 }
      - { id: show-p02b, type: slide.show, at: { mark: show-p02b }, slideId: l12-p02b }

  - id: swiss-cheese
    chapter: Swiss cheese model
    narration: >
      [[mark:close-p02b]] [[mark:b1-s1]] အဲဒီညကို ပုံဆွဲကြည့်ရအောင်။ Top-up ကို ကာကွယ်တဲ့ အလွှာ လေးခု ရှိပါတယ်၊ code review၊ config check၊ [[mark:b1-s1b]] traffic ၅ ရာခိုင်နှုန်းကို အရင် ပို့ကြည့်တဲ့ canary နဲ့ support ရော alert ရော ပါတဲ့ နောက်ဆုံး အလွှာပါ။ အလွှာတိုင်းက အပေါက်ပေါက်နေတဲ့ ဒိန်ခဲ အချပ်လိုပါပဲ။
      [[mark:b1-s2]] အဲဒီညက config ပြောင်းလဲမှုဟာ အလွှာ သုံးခုရဲ့ အပေါက်တွေကို တစ်တန်းတည်း ဖြတ်သွားပါတယ်။ reviewer က test address ကို ခွဲမသိခဲ့ပါဘူး၊ lesson ၂ က config check ကလည်း ဝန်ဆောင်ခကိုပဲ စစ်ပါတယ်၊ canary နဲ့ alert တွေကတော့ test endpoint ရဲ့ အောင်မြင်တယ် ဆိုတဲ့ အဖြေကို ယုံခဲ့ပါတယ်။ နောက်ဆုံး အလွှာမှာ ရပ်သွားတာက မစု Facebook ကြည့်မိခဲ့တဲ့ ကံကြောင့်ပါ။
      [[mark:b1-s3]] အပေါက်တွေ တစ်တန်းတည်း ကျမှ incident ဖြစ်တယ် ဆိုတဲ့ ဒီ ပုံက စိတ်ပညာရှင် James Reason ရဲ့ Swiss cheese model ပါ။ အပေါက် နှစ်မျိုး ရှိပါတယ်၊ push လုပ်တာက အဲဒီည ချက်ချင်း ပွင့်တဲ့ အပေါက်ဖြစ်ပြီး operator address ကို စစ်တဲ့ check မရှိတာကတော့ လနဲ့ချီပြီး သတိမထားမိဘဲ ပွင့်နေခဲ့တဲ့ အပေါက်ပါ။
      [[mark:b1-s4]] ဒါဆို အခြေခံ အကြောင်းရင်း၊ root cause က ဘယ်အပေါက်လဲ? ဘယ်တစ်ခုကို ရွေးရွေး အဖြေ တစ်ခုတည်း လိုချင်လို့ မေးတာ ရပ်လိုက်တဲ့ နေရာ သက်သက်ပါ၊ ဘယ်ဟာ ရွေးမလဲ ဆိုတာကလည်း ကိုယ့် ခေါင်းထဲက model ပေါ် မူတည်ပါတယ်။ push လုပ်တဲ့သူကို အပြစ်တင်တာက အားအနည်းဆုံး အဖြေပါ၊ သူ့နေရာမှာ ဘယ်သူ ရှိရှိ အဲဒီ doc ကို ယုံမှာမို့ပါ။
      [[mark:b1-s5]] Padauk က ကြာကြာ ပွင့်နေခဲ့တဲ့ အပေါက်ကို အရင် ပိတ်ပါတယ်။ endpoint တွေကို production စာရင်းနဲ့ တိုက်စစ်တဲ့ check ထည့်ပြီး prober ကိုလည်း operator တိုင်းမှာ ဘေလ် တကယ် ဝင်လား စစ်ခိုင်းပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: 'Reason, "Human error: models and management" (BMJ, PMC)',
          url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC1117770/",
        }
      - {
          title: "How Complex Systems Fail (Richard Cook)",
          url: "https://how.complexsystems.fail/",
        }
    actions:
      - { id: close-p02b, type: slide.close, at: { mark: close-p02b, offsetMs: -400 } }
      # Step 1 is split in two (at most three labelled elements per step): the first
      # two slices draw in with "let's draw it", the last two as the canary is named.
      - id: b1-s1
        type: whiteboard.apply
        at: { mark: b1-s1 }
        open: true
        clear: true
        upsertIds:
          [
            l12-b1-s1,
            l12-b1-s1-h1,
            l12-b1-s1-h2,
            l12-b1-s1-t,
            l12-b1-s2,
            l12-b1-s2-h1,
            l12-b1-s2-h2,
            l12-b1-s2-t,
          ]
        drawMs: 2400
      - id: b1-s1b
        type: whiteboard.apply
        at: { mark: b1-s1b }
        upsertIds:
          [
            l12-b1-s3,
            l12-b1-s3-h1,
            l12-b1-s3-h2,
            l12-b1-s3-t,
            l12-b1-s4,
            l12-b1-s4-h1,
            l12-b1-s4-h2,
            l12-b1-s4-t1,
            l12-b1-s4-t2,
          ]
        drawMs: 2400
      - id: b1-s2
        type: whiteboard.apply
        at: { mark: b1-s2 }
        upsertIds: [l12-b1-a1, l12-b1-a2, l12-b1-a3, l12-b1-luck]
        drawMs: 2000
      - id: b1-s3
        type: whiteboard.apply
        at: { mark: b1-s3 }
        upsertIds: [l12-b1-active-1, l12-b1-active-2, l12-b1-latent-1, l12-b1-latent-2]
        drawMs: 1800
      - {
          id: b1-s4,
          type: whiteboard.apply,
          at: { mark: b1-s4 },
          upsertIds: [l12-b1-root],
          drawMs: 1400,
        }
      - {
          id: b1-s5,
          type: whiteboard.apply,
          at: { mark: b1-s5 },
          upsertIds: [l12-b1-fix],
          drawMs: 1400,
        }

  - id: drift
    chapter: Drift
    narration: >
      [[mark:close-b1]] [[mark:b2-s1]] တချို့ အပေါက်တွေကတော့ လနဲ့ချီပြီး ဖြည်းဖြည်းချင်း ပွင့်လာတာပါ။ Wallet အဖွဲ့က campaign တွေ မြန်မြန် ထုတ်ချင်လို့ ခြောက်လအတွင်း ဖြတ်လမ်း လေးခု လိုက်ခဲ့ပါတယ်။ release ကို အကုန် မဖြန့်ခင် တစ်ရက် စောင့်ကြည့်တဲ့ အဆင့်ကို ကျော်လိုက်တယ်၊ နှေးလွန်းတဲ့ test တစ်ခုကိုလည်း ပိတ်ထားလိုက်ပါတယ်။
      [[mark:b2-s2]] ပြီးတော့ နှေးတဲ့ query တွေကို ပြင်မယ့်အစား database connection limit ကို မြှင့်လိုက်ပြီး လူ မလောက်လို့ engineer တစ်ယောက်တည်းကို on-call ခဏခဏ ယူခိုင်းပါတယ်။ တစ်ခုချင်းက အဲဒီအချိန်မှာ အဓိပ္ပာယ် ရှိပြီး ဘာမှလည်း မပျက်လို့ ဒီ ဖြတ်လမ်းတွေက ပုံမှန် ဖြစ်သွားပါတယ်။
      [[mark:b2-s3]] သင်္ကြန် အကြိုညမှာတော့ မစောင့်ဘဲ ထုတ်လိုက်တဲ့ ပြောင်းလဲမှု သေးသေးလေး တစ်ခုက peak traffic အောက်မှာ နှေးတဲ့ query နဲ့ ဆုံပြီး Wallet တစ်နာရီလောက် ရပ်သွားပါတယ်။ ဒါပေမဲ့ postmortem မှာ ဆုံးဖြတ်ချက် ဆိုးဆိုး တစ်ခုမှ ရှာမတွေ့ပါဘူး။
      [[mark:b2-s4]] ဘယ်သူမှ အန္တရာယ်ကို ရွေးခဲ့တာ မဟုတ်ပါဘူး။ ပိုမြန်မြန် ထုတ်ချင်တဲ့ business ဖိအားနဲ့ ပိုလွယ်တဲ့ နည်းကို ရွေးချင်တဲ့ လူ့သဘာဝက အမြဲ တွန်းနေတာပါ။ safety ပညာရှင် Jens Rasmussen က ဒီ ဖိအား နှစ်ခုကြောင့် အဖွဲ့အစည်းတွေ အန္တရာယ် အစွန်းဆီ မသိမသာ ရွေ့သွားတတ်တာကို ရှင်းပြခဲ့ပြီး ဒါကို drift လို့ ခေါ်ပါတယ်။
      [[mark:b2-s5]] postmortem က မျဉ်းကို ကျော်ပြီးမှ တုံ့ပြန်တာမို့ မကျော်ခင်ကတည်းက ပြန်တွန်းနေတဲ့ safety အလုပ် လိုပါတယ်။ ဖြတ်လမ်း ယူပြီး ဘာမှ မဖြစ်တိုင်း ဒါ ဘေးကင်းတယ်လို့ ပိုယုံလာတတ်လို့ပါ။ Padauk ကတော့ အခု သုံးလ တစ်ခါ ပုံမှန်လို့ ခေါ်နေတဲ့ ဖြတ်လမ်းတွေကို ပြန်စစ်ပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Defence at the Boundary of Acceptable Performance (SREcon24 Americas)",
          url: "https://www.usenix.org/conference/srecon24americas/presentation/hatch",
        }
      - {
          title: "How Complex Systems Fail (Richard Cook)",
          url: "https://how.complexsystems.fail/",
        }
    actions:
