  - id: ready-moves
    chapter: အသင့် ခလုတ်တွေ
    narration: >
      [[mark:close-b3]] [[mark:show-p04]] အဲဒီညက rider နေရာ မသိရင်တောင် ရပ်ကွက်အလိုက် order ခွဲပေးတဲ့ ခလုတ် ရှိခဲ့ရင် order တွေ ဆက်သွားမှာပါ။ Padauk က ဒီ ခလုတ်နဲ့ Bank X throttle ကို lesson ၁၀ က ဘယ်ပြဿနာမှာမဆို သုံးလို့ရတဲ့ fix စာရင်းထဲ ထည့်ပါတယ်။ zone တစ်ခုကို traffic မပို့တော့တဲ့ drain၊ rollback၊ failover၊ feature ပိတ်တာလို ခလုတ်တိုင်းဟာ မြန်ရမယ်၊ နှိပ်ရ ဘေးကင်းရမယ်၊ မလိုခင်ကတည်းက drill မှာ လေ့ကျင့်ထားရပါမယ်။
      [[mark:show-p04b]] သင်ယူတာ အလုပ်ဖြစ်လား သိချင်ရင် နောက် အလားတူ incident မှာ ထိခိုက်တဲ့ user၊ ပြန်ကောင်းဖို့ ကြာချိန်နဲ့ on-call ရဲ့ ပင်ပန်းမှု လျော့လား နှိုင်းယှဉ်ကြည့်ပါ။ Swiss cheese လို model တွေက အကြောင်းရင်းကို ကွင်းဆက် တစ်ကြောင်းလို ကြည့်လို့ အပိုင်းတွေ ဆက်ဆံရာကနေ ပေါ်လာတဲ့ ပြဿနာကို လွတ်သွားတတ်ပါတယ်၊ ဒါက lesson ၁၃ ရဲ့ ခေါင်းစဉ်ပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Workbook: Postmortem Culture: Learning from Failure",
          url: "https://sre.google/workbook/postmortem-culture/",
        }
      - {
          title: "How Complex Systems Fail (Richard Cook)",
          url: "https://how.complexsystems.fail/",
        }
    actions:
      - {
          id: close-b3,
          type: whiteboard.apply,
          at: { mark: close-b3, offsetMs: -400 },
          open: false,
        }
      - { id: show-p04, type: slide.show, at: { mark: show-p04 }, slideId: l12-p04 }
      - { id: show-p04b, type: slide.show, at: { mark: show-p04b }, slideId: l12-p04b }

  - id: this-week
    narration: >
      [[mark:show-p05]] ကိုယ့်အဖွဲ့ရဲ့ ဒိန်ခဲ အချပ်တွေမှာလည်း အပေါက်တွေ ရှိမှာပါ၊ ဒီအပတ် ရှာကြည့်ပါ။ ပုံမှန်လို့ ခေါ်နေကြတဲ့ ဖြတ်လမ်းတွေကို စာရင်း ချရေးကြည့်ပါ။ အဆင်ပြေခဲ့တဲ့ နေ့ တစ်ရက်ကို incident လိုပဲ လေ့လာပြီး ဘယ်သူ ဘာကို တိတ်တိတ်လေး ညှိပေးနေလဲ ရှာကြည့်ပါ။ ပြီးတော့ success rate ဘေးမှာ ကျန်နေတဲ့ အပို capacity ကိုပါ dashboard မှာ ထည့်ပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Defence at the Boundary of Acceptable Performance (SREcon24 Americas)",
          url: "https://www.usenix.org/conference/srecon24americas/presentation/hatch",
        }
      - {
          title: 'Hollnagel, Wears & Braithwaite, "From Safety-I to Safety-II: A White Paper" (NHS England PDF)',
          url: "https://www.england.nhs.uk/signuptosafety/wp-content/uploads/sites/16/2015/10/safety-1-safety-2-whte-papr.pdf",
        }
    actions:
      - { id: show-p05, type: slide.show, at: { mark: show-p05 }, slideId: l12-p05 }

  - id: recap
    narration: >
      [[mark:close-p05]] [[mark:open-notes]] near miss ကနေ ချောက်ကမ်းပါးအထိ ဒီနေ့ ခရီး ရှည်ခဲ့ပါတယ်။ [[mark:sel-complex]] complex system က အပိုင်းတိုင်း ကောင်းနေရင်တောင် ဆက်ဆံရာကနေ ပျက်နိုင်တဲ့ system ပါ။ [[mark:sel-swiss]] Swiss cheese model က အလွှာတွေရဲ့ အပေါက်တွေ တစ်တန်းတည်း ကျမှ incident ဖြစ်တယ်လို့ ပြပြီး၊ [[mark:sel-near-miss]] near miss ကတော့ ကံကြောင့်သာ အကြီးအကျယ် မဖြစ်လိုက်တဲ့ အဖြစ်ပါ။
      [[mark:sel-drift]] drift က ဖြတ်လမ်းတွေ ပုံမှန် ဖြစ်လာရင်း အန္တရာယ် အစွန်းဆီ မသိမသာ ရွေ့သွားတာပါ။ [[mark:sel-safety-ii]] Safety-II က ပုံမှန် နေ့တွေ ဘာကြောင့် အောင်မြင်လဲ လေ့လာတာ ဖြစ်ပြီး၊ [[mark:sel-cliff]] ချောက်ကမ်းပါး ပြုတ်ကျတာကတော့ ပျက်တာတွေကို ငြိမ်ငြိမ်လေး ခံထားရင်း အပို ကုန်တဲ့နေ့ ရုတ်တရက် ပြိုကျတာပါ။ [[mark:sel-question]] ကိုယ့် system ထဲမှာ လနဲ့ချီပြီး ပွင့်နေခဲ့တဲ့ အပေါက် တစ်ခုကို နာမည် တပ်ပြနိုင်မလား?
      [[mark:pause-question]] အဖြေက လူတိုင်း မတူပါဘူး၊ ဥပမာ ဘယ်သူမှ restore မစမ်းဖူးတဲ့ backup ဒါမှမဟုတ် တစ်ယောက်တည်းပဲ သိတဲ့ အလုပ် ဖြစ်နိုင်ပါတယ်။ နောက် လစာထုတ်ရက် မနက်ကျ လစာ ထည့်ပေးတဲ့ payroll batch ရော လိမ်လည်တဲ့ ငွေလွှဲတွေကို ပိတ်ပေးတဲ့ fraud engine ရော design အတိုင်း အလုပ်လုပ်ခဲ့ရက်နဲ့ wallet ၂၈၀၀ ပိတ်ခံလိုက်ရပါတယ်။ ဒီတစ်ခါ root cause က ဘယ်မှာလဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: 'Reason, "Human error: models and management" (BMJ, PMC)',
          url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC1117770/",
        }
      - {
          title: "How Complex Systems Fail (Richard Cook)",
          url: "https://how.complexsystems.fail/",
        }
    actions:
      - { id: close-p05, type: slide.close, at: { mark: close-p05 } }
      - {
          id: open-notes,
          type: workspace.openFile,
          at: { mark: open-notes, offsetMs: 300 },
          path: notes.md,
        }
      - {
          id: sel-complex,
          type: editor.select,
          at: { mark: sel-complex },
          target: { file: notes.md, text: "complex system", occurrence: 1 },
        }
      - {
          id: sel-swiss,
          type: editor.select,
          at: { mark: sel-swiss },
          target: { file: notes.md, text: "Swiss cheese", occurrence: 1 },
        }
      - {
          id: sel-near-miss,
          type: editor.select,
          at: { mark: sel-near-miss },
          target: { file: notes.md, text: "near miss", occurrence: 1 },
        }
      - {
          id: sel-drift,
          type: editor.select,
          at: { mark: sel-drift },
          target: { file: notes.md, text: "drift", occurrence: 1 },
        }
      - {
          id: sel-safety-ii,
          type: editor.select,
          at: { mark: sel-safety-ii },
          target: { file: notes.md, text: "Safety-II", occurrence: 1 },
        }
      - {
          id: sel-cliff,
          type: editor.select,
          at: { mark: sel-cliff },
          target: { file: notes.md, text: "ချောက်ကမ်းပါး ပြုတ်ကျ", occurrence: 1 },
        }
      # The voice script's ⟪select မေးခွန်း⟫ and ⟪pause 3s⟫, the way the Module 1
      # reviewers fixed the pause. sel-question marks where the voice script puts the
      # select, and the question is the whole dialog that follows it. A select at the
      # mark would drag under the question and leave no pause, and one at
      # pause-question would drag under the answer's first words (the scheduler holds
      # only the dialog after its anchor's). So the question-line select hangs off
      # sel-question by about the question's length: it starts about as the question
      # ends, its drag runs in silence, and the answer at pause-question waits for it.
      # The question is 83 characters with no ၊ to split at, so the quiet depends on
      # the voice's speed: 6300 leaves about 2.8 / 1.6 / 0.35 s before the answer at
      # 55 / 70 / 95 ms per char (at 95 the drag starts under the question's last
      # words, as in lessons 2 and 7); 6400 trips compile-check's 2.5 s
      # inserted-silence warning at 55.
      - id: select-question
        type: editor.select
        at: { mark: sel-question, offsetMs: 6300 }
        target:
          file: notes.md
          text: "မေးခွန်း: ကိုယ့် system ထဲမှာ လနဲ့ချီပြီး ပွင့်နေတဲ့ အပေါက် တစ်ခုကို နာမည် တပ်ပါ။"
          occurrence: 1

checks:
  # 500, not 300: google-svg deck pages stall the main thread at show/close.
  - { type: timing.p95Ms, max: 500 }
