      notes.md: |
        # ရှုပ်ထွေးတဲ့ system တွေ ဘယ်လို ပျက်လဲ

        - complex system — အပိုင်းတိုင်း ကောင်းလည်း ဆက်ဆံရာကနေ ပျက်နိုင်
        - Swiss cheese — အလွှာတွေရဲ့ အပေါက်တွေ တစ်တန်းတည်း ကျမှ incident
        - near miss — ကံကြောင့်သာ အကြီးအကျယ် မဖြစ်လိုက်တဲ့ အဖြစ်
        - drift — ဖြတ်လမ်းတွေ ပုံမှန်ဖြစ်ပြီး အန္တရာယ်ဆီ မသိမသာ ရွေ့
        - Safety-II — ပုံမှန် နေ့တွေ ဘာကြောင့် အောင်မြင်လဲ လေ့လာ
        - ချောက်ကမ်းပါး ပြုတ်ကျ (decompensation) — ငြိမ်ငြိမ်ခံရင်း အပို ကုန်တော့ ရုတ်တရက် ပြို

        မေးခွန်း: ကိုယ့် system ထဲမှာ လနဲ့ချီပြီး ပွင့်နေတဲ့ အပေါက် တစ်ခုကို နာမည် တပ်ပါ။
