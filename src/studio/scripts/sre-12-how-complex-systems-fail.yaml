        drawMs: 2200

  - id: good-days
    chapter: အဆင်ပြေခဲ့တဲ့ နေ့တွေ
    narration: >
      [[mark:close-b2]] [[mark:show-p02c]] ပျက်ခဲ့တဲ့ ညတွေ ပြီးတော့ မသီရိက မေးခွန်းကို ပြောင်းမေးပါတယ်။ လစာထုတ်ရက် အများစုက ဘာလို့ အဆင်ပြေပြေ ပြီးသွားတာလဲ? အဲဒါ သိဖို့ ဘာမှ မဖြစ်ခဲ့တဲ့ လစာထုတ်ရက် တစ်ရက်ကို incident လိုပဲ လေ့လာပြီး on-call ကျခဲ့တဲ့ Wallet engineer ကို မေးကြည့်ပါတယ်။
      [[mark:show-p02d]] Bank X နှေးလာတိုင်း သူက အဲဒီ bank ဆီ ငွေလွှဲနှုန်းကို လက်နဲ့ လျှော့တဲ့ throttle လုပ်ပြီး ငွေလွှဲတာ နောက်ကျနိုင်ပါတယ် ဆိုတဲ့ banner ကို ဖွင့်ထားတာ တွေ့ရပါတယ်။ ဘယ်သူမှ မသိခဲ့ပေမဲ့ လစာထုတ်ရက်တွေ ချောမွေ့နေခဲ့တာ သူ့ကြောင့်ပါ။
      [[mark:show-p03]] safety သုတေသီ Erik Hollnagel က safety ကို ကြည့်ပုံ နှစ်မျိုး ခွဲပြပါတယ်။ ပျက်ခဲ့တာကို လေ့လာပြီး ထပ်မဖြစ်အောင် တားတာက Safety-I ဖြစ်ပြီး ပုံမှန် နေ့တွေ ဘာကြောင့် အောင်မြင်လဲ လေ့လာပြီး အဲဒီ အောင်မြင်မှု ပိုဖြစ်လာအောင် လုပ်တာက Safety-II ပါ။ Safety-II က လူကို အမှား လုပ်တတ်သူ အဖြစ် မကြည့်ဘဲ system ကို တိတ်တိတ်လေး ညှိပေးနေသူ အဖြစ် ကြည့်ပါတယ်။
      [[mark:show-p03b]] ဒါပေမဲ့ throttle နည်းက သူ့ ခေါင်းထဲမှာပဲ ရှိနေရင် lesson ၅ က ကိုအောင်လိုပဲ သူ ခွင့်ယူတဲ့နေ့မှာ ဘယ်သူမှ မလုပ်တတ်တော့ပါဘူး။ ဒါကြောင့် Padauk က throttle ကို စမ်းသပ်ပြီးသား tool အဖြစ် ဆောက်ပြီး runbook ထဲ ထည့်ပါတယ်၊ drill မှာလည်း လေ့ကျင့်ပါတယ်။ ဒီလို နည်းကောင်းတွေက service ကို ကိုယ်တိုင် run တဲ့ အဖွဲ့ထဲမှာ ပေါ်လာတတ်ပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: 'Hollnagel, Wears & Braithwaite, "From Safety-I to Safety-II: A White Paper" (NHS England PDF)',
          url: "https://www.england.nhs.uk/signuptosafety/wp-content/uploads/sites/16/2015/10/safety-1-safety-2-whte-papr.pdf",
        }
      - {
          title: "How Complex Systems Fail (Richard Cook)",
          url: "https://how.complexsystems.fail/",
        }
    actions:
      - {
          id: close-b2,
          type: whiteboard.apply,
          at: { mark: close-b2, offsetMs: -400 },
          open: false,
        }
      - { id: show-p02c, type: slide.show, at: { mark: show-p02c }, slideId: l12-p02c }
      - { id: show-p02d, type: slide.show, at: { mark: show-p02d }, slideId: l12-p02d }
      - { id: show-p03, type: slide.show, at: { mark: show-p03 }, slideId: l12-p03 }
      - { id: show-p03b, type: slide.show, at: { mark: show-p03b }, slideId: l12-p03b }

  - id: partly-broken
    chapter: ချောက်ကမ်းပါး ပြုတ်ကျ
    narration: >
      [[mark:show-p03c]] ပုံမှန် နေ့တွေမှာလည်း server တစ်လုံးလုံး restart ဖြစ်နေတာ အမြဲ ရှိပါတယ်။ သုတေသီ Richard Cook က ရှုပ်ထွေးတဲ့ system တွေဟာ တစ်စိတ်တစ်ပိုင်း ပျက်နေရင်းနဲ့ပဲ အမြဲ run နေတယ်လို့ ထောက်ပြပါတယ်။ ကာကွယ်ရေး အလွှာတွေ များလို့ ကြီးကြီးမားမား ပျက်ဖို့ဆိုရင် ပြဿနာ အများကြီး တစ်ပြိုင်နက် ဆုံရပေမဲ့ အဲဒီလို ဆုံတာက ဘယ်နေ့မဆို ဖြစ်နိုင်ပါတယ်။
      [[mark:close-p03c]] [[mark:b3-s1]] Padauk Eats မှာ rider တွေ ဘယ်နားရောက်နေလဲ ပြတဲ့ rider location service က server ၈ လုံးပေါ်မှာ run ပြီး ပုံမှန်ဆို capacity ရဲ့ ၄၀ ရာခိုင်နှုန်းက အပိုပါ။
      [[mark:b3-s2]] memory leak ကြောင့် server တွေ တစ်လုံးပြီး တစ်လုံး ပျက်ပါတယ်။ နှစ်လုံး ပျက်တော့ အပိုက ၂၀ ရာခိုင်နှုန်းပဲ ကျန်ပေမဲ့ app က rider နေရာကို နည်းနည်း နောက်ကျပြီး ပြရုံပဲမို့ success rate က အစိမ်းရောင်ပါပဲ။
      [[mark:b3-s3]] သောကြာနေ့ ညစာချိန် peak မှာ လေးလုံးမြောက် ပျက်တော့ အပို လုံးဝ မကျန်တော့ပါဘူး။ ကျန်တဲ့ server တွေ ဝန်ပိုလာပြီး app တွေ အားလုံးက တစ်ပြိုင်နက် ပြန်ကြိုးစားကြတဲ့ retry storm ဖြစ်တော့ rider နေရာ ပြတာရော အဲဒါကို သုံးပြီး order ခွဲတာပါ တစ်မြို့လုံးမှာ ရပ်ကုန်ပါတယ်။
      [[mark:b3-s4]] သုတေသီ David Woods က system တစ်ခုဟာ ပျက်တာတွေကို ငြိမ်ငြိမ်လေး ခံထားနိုင်ပေမဲ့ ခံနိုင်တာထက် ပိုလာတဲ့နေ့ ရုတ်တရက် ပြိုတတ်တယ်လို့ ဆိုပါတယ်၊ ဒီ lesson မှာ ဒါကို ချောက်ကမ်းပါး ပြုတ်ကျတာလို့ ခေါ်ပါမယ်။ ကြိုသိဖို့ success rate ကိုချည်း မကြည့်ဘဲ ကျန်နေတဲ့ အပို capacity ပေါ်မှာ alert ထားရပါမယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "How Complex Systems Fail (Richard Cook)",
          url: "https://how.complexsystems.fail/",
        }
      - {
          title: "Paper notes: Going Solid (Cook & Rasmussen)",
          url: "https://ferd.ca/notes/paper-going-solid.html",
        }
    actions:
