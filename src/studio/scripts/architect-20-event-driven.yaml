build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 8120

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: need
    chapter: လက်မှတ် တစ်စောင် ရောင်းပြီးတိုင်း
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ app ကို service ကြီးကြီး အနည်းငယ် ခွဲပြီး database ကို မျှသုံးတဲ့ service based
      architecture ကို လေ့လာခဲ့ပါတယ်။
      [[mark:c-open]] ဒီနေ့တော့ အပိုင်းတွေ အချင်းချင်း ဘယ်လို ဆက်သွယ်မလဲ ဆိုတာကို ကြည့်ပါမယ်။ ခရီးဖော် မှာ
      လက်မှတ် တစ်စောင် ရောင်းပြီးတိုင်း Booking က လုပ်စရာ သုံးခု ရှိပါတယ်။
      [[mark:c-sms]] ပထမက ခရီးသည်ဆီ လက်မှတ် အတည်ပြုတဲ့ SMS ပို့တာပါ။
      [[mark:c-dash]] ဒုတိယက ကားလိုင်းရဲ့ dashboard မှာ ရောင်းအားကို တိုးပေးတာပါ။
      [[mark:c-set]] တတိယက အပတ်စဉ် ငွေစာရင်း ရှင်းဖို့ settlement ဘက်မှာ မှတ်တမ်းတင်တာပါ။
      [[mark:c-wait]] Booking က ဒီ သုံးခုကို တစ်ခုပြီးတစ်ခု လှမ်းခေါ်ပြီး၊ အားလုံး ပြီးမှ ခရီးသည်ကို လက်မှတ် ရပြီလို့
      ပြန်ဖြေပါတယ်။
      [[mark:c-slow]] ပြီးခဲ့တဲ့လက တစ်ညနေမှာ SMS gateway က နှေးသွားပြီး SMS တစ်စောင် ပို့ဖို့ ၈ စက္ကန့်လောက်
      ကြာခဲ့ပါတယ်။ လက်မှတ် ဝယ်တာကလည်း အဲဒီလောက် လိုက်ကြာသွားတော့၊ ခရီးသည်တွေက ငွေချေပြီးတာတောင် လက်မှတ်
      မပေါ်လာဘူးလို့ တိုင်ကြားကြပါတယ်။ ငွေကို ယူပြီးသား၊ ထိုင်ခုံကို ပေးပြီးသား ဖြစ်ပေမဲ့၊ SMS တစ်စောင်ကြောင့်
      ဝယ်ယူမှု တစ်ခုလုံး နှေးနေခဲ့တာပါ။
      [[mark:c-more]] ဒီကြားထဲ product manager လှလှ က လက်မှတ် ဝယ်တိုင်း အမှတ်ပေးတဲ့ အစီအစဉ် တစ်ခု ထပ်ထည့်ချင်ပါတယ်။
      ဆိုလိုတာက Booking ထဲမှာ လှမ်းခေါ်စရာ နောက်တစ်ခု ထပ်တိုးဦးမှာပါ။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - {
          id: draw-c-open,
          type: whiteboard.apply,
          at: { mark: c-open, offsetMs: 5500 },
          open: true,
          upsertIds: [c-bk, c-bk-l],
          drawMs: 1000,
        }
      - {
          id: draw-c-sms,
          type: whiteboard.apply,
          at: { mark: c-sms },
          upsertIds: [c-a1, c-sms, c-sms-l],
          drawMs: 1400,
        }
      - {
          id: draw-c-dash,
          type: whiteboard.apply,
          at: { mark: c-dash },
          upsertIds: [c-a2, c-dash, c-dash-l],
          drawMs: 1400,
        }
