        <div class="stage">
          <div class="title">Event သုံးရင် ပိုခက်လာတာ 5 ခု</div>
          <div class="row" style="top: 26vh"><span class="num">1</span><span class="term red">Error</span>စောင့်နေသူ မရှိတော့ ဘယ်သူ သိမလဲ</div>
