build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 2615

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  - id: intro
    chapter: "Form ကို လူတိုင်း ဖြည့်နိုင်အောင်"
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ video နဲ့ audio ကို caption နဲ့ transcript တွေနဲ့ လူတိုင်း နားလည်အောင် လုပ်တာ
      ကြည့်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ ဆိုင်ရဲ့ အော်ဒါ form ကို ပြင်ကြည့်ပါမယ်။ [[mark:start-server]] form
      ကို ဖြည့်လို့ မရရင် အော်ဒါ မှာလို့ မရ၊ စာရင်း သွင်းလို့ မရ ဖြစ်သွားပါတယ်။ ဒါပေမဲ့ form က မှန်အောင်
      လုပ်ရ အခက်ဆုံး အပိုင်းတွေထဲက တစ်ခုပါ။ အရင် lesson တွေမှာ ကြည့်ခဲ့တဲ့ focus၊ contrast စတာတွေ အကုန်
      လိုအပ်တဲ့အပြင်၊ form အတွက် သီးသန့် စည်းကမ်းတွေ ထပ်ရှိလို့ပါ။ [[mark:draw-part1]] ဒီ lesson မှာ
      အပိုင်း ငါးခု ကြည့်ပါမယ်။ ပထမက field တိုင်းမှာ label လို့ ခေါ်တဲ့ မြင်ရတဲ့ နာမည် ရှိဖို့ပါ။
      [[mark:draw-part2]] ဒုတိယက field အမျိုးအစား မှန်မှန် ရွေးပြီး autocomplete ထည့်ဖို့ပါ။
      [[mark:draw-part3]] တတိယက radio ခလုတ်တွေကို အုပ်စုဖွဲ့ဖို့ပါ။ [[mark:draw-part4]] စတုတ္ထက ဘယ်လို
      ဖြည့်ရမလဲ ဆိုတဲ့ hint ကို field နဲ့ ချိတ်ဖို့ပါ။ [[mark:draw-part5]] နောက်ဆုံးကတော့ အမှားကို
      အရောင်နဲ့ပဲ မပြဘဲ၊ စာနဲ့ ပြပြီး ဘယ်လို ပြင်ရမလဲ ပြောပြဖို့ပါ။
    sources:
      - {
          title: "web.dev Learn Accessibility: Forms",
          url: "https://web.dev/learn/accessibility/forms",
        }
      - { title: "W3C WAI: Forms Tutorial", url: "https://www.w3.org/WAI/tutorials/forms/" }
    actions:
      - id: open-parts-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-part1
        type: whiteboard.apply
        at: { mark: draw-part1 }
        upsertIds: [a-p1-box, a-p1-head, a-p1-body]
        drawMs: 1500
      - id: draw-part2
        type: whiteboard.apply
        at: { mark: draw-part2 }
        upsertIds: [a-p2-box, a-p2-head, a-p2-body]
        drawMs: 1500
      - id: draw-part3
        type: whiteboard.apply
        at: { mark: draw-part3 }
        upsertIds: [a-p3-box, a-p3-head, a-p3-body]
        drawMs: 1500
      - id: draw-part4
        type: whiteboard.apply
        at: { mark: draw-part4 }
        upsertIds: [a-p4-box, a-p4-head, a-p4-body]
        drawMs: 1500
      - id: draw-part5
        type: whiteboard.apply
        at: { mark: draw-part5 }
        upsertIds: [a-p5-box, a-p5-head, a-p5-body]
        drawMs: 1500

  - id: code-tour
    narration: >
      [[mark:close-parts]] ကဲ၊ form ရဲ့ HTML ကို ကြည့်ရအောင်။ [[mark:open-index]] ဒါက ဆိုင်ရဲ့ HTML
      ဖိုင်ပါ။ [[mark:select-name-placeholder]] ပထမ field မှာ label မရှိဘဲ placeholder ပဲ ရှိပါတယ်။
      placeholder ဆိုတာ field ထဲမှာ မှိန်မှိန်လေး ပြထားတဲ့ စာပါ။ ဒီမှာတော့ ဥပမာ နာမည် တစ်ခု ပြထားပါတယ်။
      [[mark:select-asterisk]] ဖုန်း field ဘေးမှာတော့ မဖြစ်မနေ ဖြည့်ရမယ် ဆိုတာကို အနီရောင် ကြယ်ပွင့်လေး
      တစ်ခုနဲ့ပဲ ပြထားပါတယ်။ [[mark:select-sugar-title]] သကြား ရွေးတဲ့ radio သုံးခုကိုတော့ div ထဲမှာ
      စုထားပြီး၊ ခေါင်းစဉ်ကို သာမန် စာပိုဒ်နဲ့ ရေးထားပါတယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: Forms — Labels",
          url: "https://web.dev/learn/accessibility/forms#labels",
        }
      - {
          title: "MDN: placeholder attribute",
          url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Attributes/placeholder",
        }
    actions:
      - id: close-parts
        type: whiteboard.apply
        at: { mark: close-parts }
        open: false
      - id: open-index
        type: workspace.openFile
        at: { mark: open-index }
        path: index.html
      - id: select-name-placeholder
        type: editor.select
        at: { mark: select-name-placeholder }
        target: { file: index.html, text: 'placeholder="ဥပမာ အောင်အောင်"', occurrence: 1 }
      - id: select-asterisk
        type: editor.select
        at: { mark: select-asterisk }
        target: { file: index.html, text: '<span class="req">*</span>', occurrence: 1 }
      - id: select-sugar-title
        type: editor.select
        at: { mark: select-sugar-title }
        target: { file: index.html, text: '<p class="sugar-title">သကြား</p>', occurrence: 1 }

  - id: first-look
    narration: >
      [[mark:preview-ready]] ညာဘက်မှာ form ကို မြင်ရပါပြီ။ မျက်စိနဲ့ ကြည့်ရင်တော့ ပြဿနာ မရှိသလိုပါပဲ။
      accessibility panel မှာတော့ form ရဲ့ tree နဲ့ live region အပိုင်းကို ပြထားပါတယ်။
      [[mark:look-name-row]] ပထမ field ကို ကြည့်ပါ။ role က textbox၊ name က ဥပမာ အောင်အောင် ဖြစ်ပြီး၊ from
      placeholder လို့ ပြထားပါတယ်။ label မရှိလို့ browser က placeholder ကို နာမည်အဖြစ် ယူသုံးလိုက်တာပါ။
      screen reader က ဥပမာ အောင်အောင် လို့ ဖတ်ပြမှာ ဖြစ်ပြီး၊ ဘာ ဖြည့်ရမလဲ ဆိုတာ ရှင်းရှင်း မပြောပါဘူး။
      [[mark:input-name]] field ထဲကို နာမည် ရိုက်ထည့်ကြည့်ရအောင်။ [[mark:after-input-name]] စာ
      ရိုက်လိုက်တာနဲ့ placeholder ပျောက်သွားပါပြီ။ မျက်စိနဲ့ မြင်ရတဲ့သူလည်း ဒီ field ဘာအတွက်လဲ ဆိုတာ
      ပြန်မမြင်ရတော့ပါဘူး။ မှတ်ဉာဏ် အားနည်းတဲ့သူ၊ အာရုံ ခဏခဏ ပျံ့တဲ့သူတွေ အတွက် ဒါက တကယ့် ပြဿနာပါ။
      ဒါကြောင့် placeholder က label ကို အစားထိုးလို့ မရပါဘူး။
    sources:
      - {
          title: "web.dev Learn Accessibility: Forms — Labels",
          url: "https://web.dev/learn/accessibility/forms#labels",
        }
      - {
          title: "W3C WAI: Labeling Controls",
          url: "https://www.w3.org/WAI/tutorials/forms/labels/",
        }
      - {
          title: "HTML-AAM: input accessible name computation (placeholder fallback)",
          url: "https://www.w3.org/TR/html-aam-1.0/#input-type-text-input-type-password-input-type-number-input-type-search-input-type-tel-input-type-email-input-type-url-and-textarea-element-accessible-name-computation",
        }
    actions:
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { mark: preview-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-dev-server }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-document-title
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: a11y-document }
        attribute: { name: data-title, value: "အော်ဒါမှာရန် · ရွှေလက်ဖက်ရည်ဆိုင်" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-name-from-placeholder
        type: expect.preview
        at: { mark: look-name-row }
        timeoutMs: 5000
        target: { by: testId, value: a11y-input-name }
        textContains: '"ဥပမာ အောင်အောင်" from placeholder'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: input-name
        type: preview.input
        at: { mark: input-name }
        timeoutMs: 5000
        target: { by: testId, value: input-name }
        value: "အောင်အောင်"
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-name-value
        type: expect.preview
        at: { mark: after-input-name }
        timeoutMs: 5000
        target: { by: testId, value: input-name }
        value: "အောင်အောင်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: labels
    chapter: "Field တိုင်းမှာ label ထည့်ရအောင်"
    narration: >
      [[mark:type-name-label]] ဒါဆို field တစ်ခုစီရဲ့ အပေါ်မှာ label element ကို ထည့်ပါမယ်။ label ရဲ့ for
      attribute နဲ့ field ရဲ့ id ကို တူအောင် ပေးရင် browser က နှစ်ခုကို ချိတ်ပေးပါတယ်။
      [[mark:after-name-label]] field အပေါ်မှာ နာမည် ဆိုတဲ့ စာ ပေါ်လာပြီး၊ tree ထဲမှာလည်း name က နာမည်
      ဖြစ်သွားပါပြီ။ label ကို နှိပ်ရင်လည်း field ထဲကို cursor ရောက်သွားလို့၊ လက်ကို တိတိကျကျ
      မလှုပ်နိုင်တဲ့သူ အတွက် နှိပ်ရမယ့် နေရာ ပိုကြီးလာပါတယ်။ [[mark:type-phone-label]] ဖုန်း field
      အတွက်လည်း label ထည့်ပါမယ်။ ကြယ်ပွင့်ကို screen reader က ဖတ်ပြချင်မှ ဖတ်ပြမှာ ဖြစ်ပြီး၊ အဓိပ္ပာယ်
      မသိတဲ့သူလည်း ရှိလို့၊ မဖြစ်မနေ ဆိုတာကို label ထဲမှာ စာနဲ့ ရေးထားပါမယ်။ [[mark:after-phone-label]]
      tree မှာ ဖုန်း field ရဲ့ name က ဖုန်း၊ မဖြစ်မနေ ဆိုပြီး ပေါ်လာပါပြီ။
    sources:
      - {
          title: "web.dev Learn Accessibility: Forms — Labels",
          url: "https://web.dev/learn/accessibility/forms#labels",
        }
      - {
          title: "MDN: The label element",
          url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/label",
        }
      - {
          title: "WCAG 2.2 Understanding: Labels or Instructions",
          url: "https://www.w3.org/WAI/WCAG22/Understanding/labels-or-instructions.html",
        }
    actions:
      - id: type-name-label
        type: editor.type
        at: { mark: type-name-label }
        cadence: block
        target: { file: index.html, after: '<h2 id="order-title">အော်ဒါမှာရန်</h2>', occurrence: 1 }
        text: "\n        <label for=\"name\">နာမည်</label>"
      - id: expect-name-label
        type: expect.preview
        at: { mark: after-name-label }
        timeoutMs: 5000
        target: { by: testId, value: a11y-input-name }
        attribute: { name: data-name, value: "နာမည်" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-phone-label
        type: editor.type
        at: { mark: type-phone-label }
        cadence: block
        target: { file: index.html, after: 'data-testid="input-name" />', occurrence: 1 }
        text: "\n        <label for=\"phone\">ဖုန်း (မဖြစ်မနေ)</label>"
      - id: expect-phone-label
        type: expect.preview
        at: { mark: after-phone-label }
        timeoutMs: 5000
        target: { by: testId, value: a11y-input-phone }
        attribute: { name: data-name, value: "ဖုန်း (မဖြစ်မနေ)" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: fields
    chapter: "Field အမျိုးအစားနဲ့ autocomplete"
    narration: >
      field တွေကို div နဲ့ ကိုယ်တိုင် မဆောက်ဘဲ HTML ရဲ့ input element ကို သုံးထားတာ ကောင်းပါတယ်။ state
      တွေ၊ keyboard နဲ့ သုံးတာတွေ ပါပြီးသား ဖြစ်လို့ပါ။ [[mark:type-phone-attrs]] အခု ဖုန်း field မှာ type
      ကို tel လို့ ပေးပြီး၊ autocomplete နဲ့ required ကိုပါ ထည့်ပါမယ်။ [[mark:after-phone-attrs]] tree
      ထဲမှာ required ဆိုတဲ့ state ပေါ်လာပါပြီ။ screen reader က မဖြစ်မနေ ဖြည့်ရမယ့် field လို့ ဖတ်ပြမှာပါ။
      type tel ကတော့ panel မှာ မမြင်ရပေမယ့်၊ ဖုန်းနဲ့ ဖြည့်တဲ့အခါ ဂဏန်း keyboard ကို ပြပေးပါတယ်။ email နဲ့
      number လို type တွေကလည်း သင့်တော်တဲ့ keyboard ကို ပြပေးတဲ့အပြင်၊ ဖြည့်ထားတာ ပုံစံ မှန်မမှန်ကို
      browser က စစ်ပေးပါတယ်။ [[mark:type-name-autocomplete]] နာမည် field မှာလည်း autocomplete name ကို
      ထည့်ပါမယ်။ autocomplete က ဒီ field မှာ ဘယ်လို အချက်အလက် ဖြည့်ရမလဲ ဆိုတာ browser ကို ပြောပြတာပါ။
      ဒါကြောင့် browser က မှတ်ထားတဲ့ နာမည်နဲ့ ဖုန်းနံပါတ်ကို တစ်ချက်တည်းနဲ့ ဖြည့်ပေးနိုင်ပြီး၊ စာရိုက်ရ
      ခက်တဲ့သူ၊ မှတ်ဉာဏ် အားနည်းတဲ့သူတွေ အတွက် အများကြီး သက်သာစေပါတယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: Forms — Fields",
          url: "https://web.dev/learn/accessibility/forms#fields",
        }
      - {
          title: "MDN: autocomplete attribute",
          url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Attributes/autocomplete",
        }
      - {
          title: "MDN: input type tel",
          url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/input/tel",
        }
      - {
          title: "WCAG 2.2 Understanding: Identify Input Purpose",
          url: "https://www.w3.org/WAI/WCAG22/Understanding/identify-input-purpose.html",
        }
    actions:
      - id: type-phone-attrs
        type: editor.type
        at: { mark: type-phone-attrs }
        cadence: block
        target: { file: index.html, after: '<input id="phone" name="phone"', occurrence: 1 }
        text: ' type="tel" autocomplete="tel" required'
      - id: expect-phone-required
        type: expect.preview
        at: { mark: after-phone-attrs }
        timeoutMs: 5000
        target: { by: testId, value: a11y-input-phone }
        textContains: '"ဖုန်း (မဖြစ်မနေ)" required'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-name-autocomplete
        type: editor.type
        at: { mark: type-name-autocomplete }
        cadence: block
        target:
          { file: index.html, after: '<input id="name" name="name" type="text"', occurrence: 1 }
        text: ' autocomplete="name"'

  - id: description
    chapter: "Hint ကို field နဲ့ ချိတ်ရအောင်"
    narration: >
      [[mark:look-hint]] ဖုန်း field အောက်မှာ ၀၉ နဲ့ စတဲ့ နံပါတ် ဆိုတဲ့ hint စာ ရှိပေမယ့်၊ tree ထဲက ဖုန်း
      field မှာတော့ ဒီ စာ မပါပါဘူး။ screen reader သုံးတဲ့သူက Tab key နဲ့ field တစ်ခုကနေ တစ်ခုကို
      ခုန်သွားတာ များလို့၊ field နဲ့ မချိတ်ထားတဲ့ စာကို ကျော်သွားနိုင်ပါတယ်။ [[mark:type-describedby]]
      ဒါကြောင့် ဖုန်း field မှာ aria describedby ကို ထည့်ပြီး hint ရဲ့ id ကို ပေးပါမယ်။
      [[mark:after-describedby]] tree ထဲမှာ desc ဆိုပြီး hint စာ ပေါ်လာပါပြီ။ screen reader က field ရဲ့
      နာမည် ဖတ်ပြီးတာနဲ့ ဒီ hint ကိုပါ ဆက်ဖတ်ပြမှာပါ။
    sources:
      - {
          title: "web.dev Learn Accessibility: Forms — Descriptions",
          url: "https://web.dev/learn/accessibility/forms#descriptions",
        }
      - {
          title: "MDN: aria-describedby",
          url: "https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Attributes/aria-describedby",
        }
    actions:
      - id: expect-no-desc
        type: expect.preview
        at: { mark: look-hint }
        timeoutMs: 5000
        target: { by: testId, value: a11y-input-phone }
        attribute: { name: data-states, value: "required" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-describedby
        type: editor.type
        at: { mark: type-describedby }
        cadence: block
        target:
          {
            file: index.html,
            after: '<input id="phone" name="phone" type="tel" autocomplete="tel" required',
            occurrence: 1,
          }
        text: ' aria-describedby="phone-hint"'
      - id: expect-desc
        type: expect.preview
        at: { mark: after-describedby }
        timeoutMs: 5000
        target: { by: testId, value: a11y-input-phone }
        textContains: 'desc "09 နဲ့ စတဲ့ နံပါတ်"'
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: grouping
    chapter: "Radio တွေကို fieldset နဲ့ အုပ်စုဖွဲ့ရအောင်"
    narration: >
      tree ထဲက radio သုံးခုမှာ ချို၊ ချိုပေါ့၊ မထည့် ဆိုတဲ့ နာမည်တွေ ရှိပါတယ်။ radio တစ်ခုစီကို label
      ထဲမှာ ထည့်ပြီး ချိတ်ထားလို့ပါ။ ဒါပေမဲ့ သကြား ဆိုတဲ့ ခေါင်းစဉ်ကတော့ radio တွေနဲ့ ချိတ်မထားပါဘူး။
      screen reader က ချို၊ radio လို့ပဲ ဖတ်ပြမှာ ဖြစ်လို့၊ သုံးတဲ့သူက ဘာ ချိုတာလဲ မသိနိုင်ပါဘူး။
      [[mark:type-fieldset]] ဒါကြောင့် radio တွေကို fieldset element နဲ့ အုပ်ပြီး၊ ခေါင်းစဉ်ကို legend
      element နဲ့ ရေးထားတဲ့ အုပ်စု အသစ် ထည့်ပါမယ်။ [[mark:after-fieldset]] tree ထဲမှာ name က သကြား ဖြစ်တဲ့
      group တစ်ခု ပေါ်လာပြီး၊ radio တွေက သူ့ အောက်မှာ ရောက်နေပါတယ်။ screen reader က ဒီ အုပ်စုထဲ ဝင်တာနဲ့
      သကြား ဆိုတာ အရင် ဖတ်ပြမှာပါ။ [[mark:type-hide-old]] div အဟောင်းကိုတော့ ကိုယ့် code မှာဆိုရင်
      ဖျက်လိုက်ရုံပါပဲ။ ဒီ lesson မှာတော့ hidden ထည့်ပြီး ဖျောက်ထားပါမယ်။ [[mark:after-hide-old]] အခု
      သကြား အုပ်စု တစ်ခုပဲ ကျန်ပါတော့တယ်။ လိပ်စာ field တွေလို ဆက်စပ်နေတဲ့ field တွေကိုလည်း ဒီ နည်းနဲ့ပဲ
      အုပ်စုဖွဲ့ပါ။
    sources:
      - {
          title: "web.dev Learn Accessibility: Forms — Labels (grouping)",
          url: "https://web.dev/learn/accessibility/forms#labels",
        }
      - {
          title: "W3C WAI: Grouping Controls",
          url: "https://www.w3.org/WAI/tutorials/forms/grouping/",
        }
      - {
          title: "MDN: The fieldset element",
          url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/fieldset",
        }
    actions:
      - id: type-fieldset
        type: editor.type
        at: { mark: type-fieldset }
        cadence: block
        target:
          {
            file: index.html,
            after: "          <label><input type=\"radio\" name=\"sugar\" value=\"none\" /> မထည့်</label>\n        </div>",
            occurrence: 1,
          }
        text: "\n        <fieldset class=\"sugar\" data-testid=\"sugar\">\n          <legend>သကြား</legend>\n          <label><input type=\"radio\" name=\"sugar\" value=\"sweet\" checked data-testid=\"sugar-sweet\" /> ချို</label>\n          <label><input type=\"radio\" name=\"sugar\" value=\"less\" data-testid=\"sugar-less\" /> ချိုပေါ့</label>\n          <label><input type=\"radio\" name=\"sugar\" value=\"none\" data-testid=\"sugar-none\" /> မထည့်</label>\n        </fieldset>"
      - id: expect-group
        type: expect.preview
        at: { mark: after-fieldset }
        timeoutMs: 5000
        target: { by: testId, value: a11y-sugar }
        textContains: 'group "သကြား"'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-group-radio
        type: expect.preview
        at: { afterAction: expect-group }
        timeoutMs: 5000
        target: { by: testId, value: a11y-sugar-sweet }
        textContains: 'radio "ချို" checked'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-hide-old
        type: editor.type
        at: { mark: type-hide-old }
        cadence: block
        target:
          { file: index.html, after: '<div class="sugar" data-testid="sugar-old"', occurrence: 1 }
        text: " hidden"
      - id: expect-old-hidden
        type: expect.preview
        at: { mark: after-hide-old }
        timeoutMs: 5000
        target: { by: testId, value: sugar-old }
        attribute: { name: hidden, value: "" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-group-kept
        type: expect.preview
        at: { afterAction: expect-old-hidden }
        timeoutMs: 5000
        target: { by: testId, value: a11y-sugar }
        textContains: 'group "သကြား"'
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: error-problem
    chapter: "အမှားကို အရောင်တစ်ခုတည်းနဲ့ မပြရအောင်"
    narration: >
      [[mark:input-phone-1]] အခု ဖုန်း field မှာ ၀၉ နဲ့ မစတဲ့ နံပါတ် တစ်ခု ထည့်ကြည့်ရအောင်။
      [[mark:click-order-1]] ပြီးရင် မှာမယ် ကို နှိပ်ပါမယ်။ [[mark:after-order-1]] ဖုန်း field ရဲ့ ဘောင်က
      အနီရောင် ဖြစ်သွားပါပြီ။ ဒါပေမဲ့ ဘာ မှားလဲ၊ ဘယ်လို ပြင်ရမလဲ ဆိုတဲ့ စာ တစ်လုံးမှ မရှိပါဘူး။ အရောင်
      ခွဲခြားရ ခက်တဲ့သူက ဘောင် ပြောင်းတာကို သတိထားမိချင်မှ မိမှာ ဖြစ်သလို၊ tree ထဲက ဖုန်း field မှာလည်း
      ဘာမှ မပြောင်းပါဘူး။ ဒါကြောင့် screen reader သုံးတဲ့သူက အော်ဒါ ဘာကြောင့် မရောက်တာလဲ လုံးဝ
      မသိနိုင်ပါဘူး။
    sources:
      - {
          title: "web.dev Learn Accessibility: Forms — Errors",
          url: "https://web.dev/learn/accessibility/forms#errors",
        }
      - {
          title: "WCAG 2.2 Understanding: Use of Color",
          url: "https://www.w3.org/WAI/WCAG22/Understanding/use-of-color.html",
        }
      - {
          title: "WCAG 2.2 Understanding: Error Identification",
          url: "https://www.w3.org/WAI/WCAG22/Understanding/error-identification.html",
        }
    actions:
      - id: input-phone-1
        type: preview.input
        at: { mark: input-phone-1 }
        timeoutMs: 5000
        target: { by: testId, value: input-phone }
        value: "123 456 789"
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: click-order-1
        type: preview.click
        at: { mark: click-order-1 }
        timeoutMs: 5000
        target: { by: testId, value: order-button }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-red-border
        type: expect.preview
        at: { mark: after-order-1 }
        timeoutMs: 5000
        target: { by: testId, value: input-phone }
        attribute: { name: class, value: "is-invalid" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-not-invalid
        type: expect.preview
        at: { afterAction: expect-red-border }
        timeoutMs: 5000
        target: { by: testId, value: a11y-input-phone }
        attribute: { name: data-states, value: "required" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: error-rules
    narration: >
      [[mark:board-errors]] အမှားကို ပြတဲ့အခါ လုပ်ရမယ့် အချက် သုံးခု ရှိပါတယ်။ [[mark:draw-err1]] ပထမ၊ ဘာ
      မှားလဲ၊ ဘယ်လို ပြင်ရမလဲ ဆိုတာကို field နားမှာ စာနဲ့ ရေးပြပါ။ [[mark:draw-err2]] ဒုတိယ၊ အဲဒီ စာကို
      aria describedby နဲ့ field နဲ့ ချိတ်ပြီး၊ field မှာ aria invalid ကို true ပေးပါ။ [[mark:draw-err3]]
      တတိယ၊ အမှား ဖြစ်သွားပြီ ဆိုတာ သိအောင် focus ကို အဲဒီ field ဆီ ရွှေ့ပေးပါ။ live region နဲ့
      ဖတ်ပြခိုင်းလို့လည်း ရပါတယ်။ field များတဲ့ form မှာဆိုရင်တော့ အမှား အားလုံးကို form ရဲ့ အပေါ်မှာ
      စုပြတဲ့ နည်းလည်း ရှိပါတယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: Forms — Errors",
          url: "https://web.dev/learn/accessibility/forms#errors",
        }
      - {
          title: "W3C WAI: User Notifications (forms tutorial)",
          url: "https://www.w3.org/WAI/tutorials/forms/notifications/",
        }
      - {
          title: "WebAIM: Usable and Accessible Form Validation and Error Recovery",
          url: "https://webaim.org/techniques/formvalidation/",
        }
      - {
          title: "MDN: aria-invalid",
          url: "https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Attributes/aria-invalid",
        }
    actions:
      - id: board-errors
        type: whiteboard.apply
        at: { mark: board-errors }
        open: true
        clear: true
        upsertIds: [b-title, b-bad]
      - id: draw-err1
        type: whiteboard.apply
        at: { mark: draw-err1 }
        upsertIds: [b-r1-box, b-r1-head, b-r1-body]
        drawMs: 1600
      - id: draw-err2
        type: whiteboard.apply
        at: { mark: draw-err2 }
        upsertIds: [b-r2-box, b-r2-head, b-r2-body]
        drawMs: 1600
      - id: draw-err3
        type: whiteboard.apply
        at: { mark: draw-err3 }
        upsertIds: [b-r3-box, b-r3-head, b-r3-body]
        drawMs: 1600

  - id: error-fix
    chapter: "အမှား စာကို field နဲ့ ချိတ်ရအောင်"
    narration: >
      [[mark:close-errors]] ဒါဆို ကိုယ့် form ကို ပြင်ကြည့်ရအောင်။ [[mark:type-error-p]] hint ရဲ့ အောက်မှာ
      အမှား စာအတွက် စာပိုဒ် အလွတ် တစ်ခု ထည့်ပါမယ်။ [[mark:type-error-ref]] ပြီးတော့ ဖုန်း field ရဲ့ aria
      describedby ထဲမှာ အဲဒီ စာပိုဒ်ကို hint ရဲ့ ရှေ့မှာ ထည့်ပါမယ်။ ဒါမှ screen reader က အမှား စာကို အရင်
      ဖတ်ပြမှာပါ။ [[mark:open-main]] နောက်တစ်ဆင့်က JavaScript ပါ။ [[mark:select-toggle]] အခု code က form
      ကို submit လုပ်တိုင်း နံပါတ် မှားရင် အနီရောင် ဘောင်အတွက် class ကိုပဲ ထည့်ပါတယ်။
      [[mark:type-error-js]] သူ့ အောက်မှာ aria invalid ကို ပြောင်းတဲ့ စာကြောင်း၊ အမှား စာ ထည့်တဲ့
      စာကြောင်းနဲ့၊ မှားရင် focus ကို ဖုန်း field ဆီ ရွှေ့တဲ့ စာကြောင်းတွေ ထည့်ပါမယ်။ အမှား စာမှာ ပြင်နည်း
      ပါအောင်၊ ဖုန်းနံပါတ်ကို ၀၉ နဲ့ စပြီး ရိုက်ပါ လို့ ရေးထားပါတယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: Forms — Errors",
          url: "https://web.dev/learn/accessibility/forms#errors",
        }
      - {
          title: "WCAG 2.2 Understanding: Error Suggestion",
          url: "https://www.w3.org/WAI/WCAG22/Understanding/error-suggestion.html",
        }
      - {
          title: "MDN: HTMLElement focus()",
          url: "https://developer.mozilla.org/en-US/docs/Web/API/HTMLElement/focus",
        }
    actions:
      - id: close-errors
        type: whiteboard.apply
        at: { mark: close-errors }
        open: false
      - id: type-error-p
        type: editor.type
        at: { mark: type-error-p }
        cadence: block
        target:
          {
            file: index.html,
            after: '<p class="hint" id="phone-hint" data-testid="phone-hint">09 နဲ့ စတဲ့ နံပါတ်</p>',
            occurrence: 1,
          }
        text: "\n        <p class=\"error\" id=\"phone-error\" data-testid=\"phone-error\"></p>"
      - id: type-error-ref
        type: editor.type
        at: { mark: type-error-ref }
        cadence: block
        target: { file: index.html, after: 'aria-describedby="', occurrence: 1 }
        text: "phone-error "
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: main.js
      - id: select-toggle
        type: editor.select
        at: { mark: select-toggle }
        target: { file: main.js, text: 'phone.classList.toggle("is-invalid", !ok);', occurrence: 1 }
      - id: type-error-js
        type: editor.type
        at: { mark: type-error-js }
        cadence: block
        target:
          { file: main.js, after: 'phone.classList.toggle("is-invalid", !ok);', occurrence: 1 }
        text: "\n  phone.setAttribute(\"aria-invalid\", String(!ok));\n  const phoneError = document.querySelector(\"#phone-error\");\n  phoneError.textContent = ok ? \"\" : \"ဖုန်းနံပါတ်ကို 09 နဲ့ စပြီး ရိုက်ပါ\";\n  if (!ok) phone.focus();"

  - id: error-result
    narration: >
      [[mark:input-phone-2]] မှားတဲ့ နံပါတ်ကို ပြန်ထည့်ပြီး၊ [[mark:click-order-2]] မှာမယ် ကို
      နှိပ်ကြည့်ရအောင်။ [[mark:after-order-2]] ဒီတစ်ခါတော့ field အောက်မှာ အမှား စာ ပေါ်လာပါပြီ။ tree ထဲက
      ဖုန်း field မှာ invalid ဆိုတဲ့ state ပေါ်လာပြီး၊ desc ရဲ့ အစမှာ အမှား စာ ရောက်နေပါတယ်။ focus ကလည်း
      ဖုန်း field ဆီ ရောက်လာလို့၊ screen reader က field ရဲ့ နာမည်၊ invalid ဖြစ်နေတာ၊ အမှား စာနဲ့ hint ကို
      ဆက်တိုက် ဖတ်ပြမှာပါ။ အရောင် ခွဲခြားရ ခက်တဲ့သူရော၊ screen reader သုံးတဲ့သူရော၊ အားလုံး ဘာ ပြင်ရမလဲ
      သိသွားပါပြီ။ [[mark:input-phone-3]] ဒါဆို နံပါတ် အမှန်ကို ထည့်ပြီး၊ [[mark:click-order-3]]
      ထပ်နှိပ်ကြည့်ရအောင်။ [[mark:after-order-3]] အမှား စာ ပျောက်သွားပြီး invalid လည်း မရှိတော့ပါဘူး။ live
      region အပိုင်းမှာ polite နဲ့ မှာပြီးပါပြီ ဆိုတာ ပေါ်လာပါတယ်။ အောင်မြင်သွားပြီ ဆိုတာကိုလည်း ဒီလို
      ပြောပြပေးရပါမယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: Forms — Errors",
          url: "https://web.dev/learn/accessibility/forms#errors",
        }
      - {
          title: "MDN: ARIA live regions",
          url: "https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Guides/Live_regions",
        }
      - {
          title: "WCAG 2.2 Understanding: Status Messages",
          url: "https://www.w3.org/WAI/WCAG22/Understanding/status-messages.html",
        }
    actions:
      - id: input-phone-2
        type: preview.input
        at: { mark: input-phone-2 }
        timeoutMs: 5000
        target: { by: testId, value: input-phone }
        value: "123 456 789"
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: click-order-2
        type: preview.click
        at: { mark: click-order-2 }
        timeoutMs: 5000
        target: { by: testId, value: order-button }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-error-text
        type: expect.preview
        at: { mark: after-order-2 }
        timeoutMs: 5000
        target: { by: testId, value: phone-error }
        textContains: "ဖုန်းနံပါတ်ကို 09 နဲ့ စပြီး ရိုက်ပါ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-invalid-focused
        type: expect.preview
        at: { afterAction: expect-error-text }
        timeoutMs: 5000
        target: { by: testId, value: a11y-input-phone }
        attribute: { name: data-states, value: "required invalid focused" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-error-desc
        type: expect.preview
        at: { afterAction: expect-invalid-focused }
        timeoutMs: 5000
        target: { by: testId, value: a11y-input-phone }
        textContains: 'desc "ဖုန်းနံပါတ်ကို 09 နဲ့ စပြီး'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: input-phone-3
        type: preview.input
        at: { mark: input-phone-3 }
        timeoutMs: 5000
        target: { by: testId, value: input-phone }
        value: "09 123 456 789"
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: click-order-3
        type: preview.click
        at: { mark: click-order-3 }
        timeoutMs: 5000
        target: { by: testId, value: order-button }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-announced
        type: expect.preview
        at: { mark: after-order-3 }
        timeoutMs: 5000
        target: { by: testId, value: live-1 }
        textContains: 'polite "မှာပြီးပါပြီ"'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-valid-again
        type: expect.preview
        at: { afterAction: expect-announced }
        timeoutMs: 5000
        target: { by: testId, value: a11y-input-phone }
        attribute: { name: data-states, value: "required" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: more-criteria
    chapter: "Form အတွက် ထပ်သိထားသင့်တာတွေ"
    narration: >
      [[mark:board-more]] WCAG ၂.၂ မှာ form နဲ့ ဆိုင်တဲ့ စည်းကမ်း အသစ်တွေလည်း ရှိပါတယ်။
      [[mark:draw-more1]] ပထမက လိပ်စာလို တစ်ခါ ဖြည့်ပြီးသား အချက်အလက်ကို နောက် အဆင့်မှာ ထပ်မတောင်းဖို့ပါ။
      ကြိုဖြည့်ထားတာ ဒါမှမဟုတ် ရွေးလို့ ရအောင် လုပ်ပေးရပါမယ်။ [[mark:draw-more2]] ဒုတိယက login ဝင်တဲ့အခါ
      password မှတ်ရတာ၊ ပဟေဠိ ဖြေရတာလို မှတ်ဉာဏ် စမ်းတဲ့ နည်း တစ်ခုတည်း မထားဖို့ပါ။ password manager နဲ့
      ဖြည့်တာ၊ paste လုပ်တာကို ခွင့်ပြုရပါမယ်။ [[mark:draw-more3]] တတိယက နှိပ်ရမယ့် ခလုတ်တွေကို အနည်းဆုံး
      အလျား ၂၄ pixel၊ အနံ ၂၄ pixel ရှိအောင်၊ ဒါမှမဟုတ် ဘေးမှာ နေရာလွတ် လုံလောက်အောင် ထားဖို့ပါ။
      [[mark:draw-more4]] အရင်ကတည်းက ရှိတဲ့ စည်းကမ်း တစ်ခုကတော့၊ အချိန် ကန့်သတ်ထားတဲ့ form မှာ အချိန်
      တိုးလို့ ရအောင် လုပ်ပေးဖို့ပါ။
    sources:
      - {
          title: "web.dev Learn Accessibility: Forms — Additional success criteria",
          url: "https://web.dev/learn/accessibility/forms#additional_success_criteria",
        }
      - {
          title: "WCAG 2.2 Understanding: Redundant Entry",
          url: "https://www.w3.org/WAI/WCAG22/Understanding/redundant-entry.html",
        }
      - {
          title: "WCAG 2.2 Understanding: Accessible Authentication (Minimum)",
          url: "https://www.w3.org/WAI/WCAG22/Understanding/accessible-authentication-minimum.html",
        }
      - {
          title: "WCAG 2.2 Understanding: Target Size (Minimum)",
          url: "https://www.w3.org/WAI/WCAG22/Understanding/target-size-minimum.html",
        }
      - {
          title: "WCAG 2.2 Understanding: Timing Adjustable",
          url: "https://www.w3.org/WAI/WCAG22/Understanding/timing-adjustable.html",
        }
    actions:
      - id: board-more
        type: whiteboard.apply
        at: { mark: board-more }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-more1
        type: whiteboard.apply
        at: { mark: draw-more1 }
        upsertIds: [c-r1-box, c-r1-head, c-r1-body]
        drawMs: 1600
      - id: draw-more2
        type: whiteboard.apply
        at: { mark: draw-more2 }
        upsertIds: [c-r2-box, c-r2-head, c-r2-body]
        drawMs: 1600
      - id: draw-more3
        type: whiteboard.apply
        at: { mark: draw-more3 }
        upsertIds: [c-r3-box, c-r3-head, c-r3-body]
        drawMs: 1600
      - id: draw-more4
        type: whiteboard.apply
        at: { mark: draw-more4 }
        upsertIds: [c-r4-box, c-r4-head, c-r4-body]
        drawMs: 1600

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:close-more]] ဒါဆို ပြန်ချုပ်ရရင်၊ [[mark:recap-label]] field တိုင်းမှာ မြင်ရတဲ့ label
      ရှိရပြီး၊ placeholder က label ကို အစားထိုးလို့ မရပါဘူး။ [[mark:recap-type]] မှန်တဲ့ type နဲ့
      autocomplete က ဖြည့်ရတာကို မြန်စေပါတယ်။ [[mark:recap-group]] radio တွေကို fieldset နဲ့ legend နဲ့
      အုပ်စုဖွဲ့ပါ။ [[mark:recap-error]] hint နဲ့ အမှား စာကို aria describedby နဲ့ ချိတ်ပြီး၊ အမှားကို
      အရောင်နဲ့ပဲ မပြဘဲ စာနဲ့ ပြပါ။ ကိုယ့် ကွန်ပျူတာက screen reader နဲ့ ဒီ form ကို ဖြည့်ကြည့်ပါ။ နောက်
      lesson မှာတော့ pattern၊ component နဲ့ design system အကြောင်း ကြည့်ပြီး၊ div နဲ့ ဆောက်ထားတဲ့
      accordion နဲ့ dialog ကို HTML element တွေနဲ့ ပြန်ဆောက်ကြည့်ပါမယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: Forms",
          url: "https://web.dev/learn/accessibility/forms",
        }
      - {
          title: "web.dev Learn Accessibility: Patterns, components, and design systems",
          url: "https://web.dev/learn/accessibility/patterns",
        }
    actions:
      - id: close-more
        type: whiteboard.apply
        at: { mark: close-more }
        open: false
      - id: open-index-recap
        type: workspace.openFile
        at: { mark: recap-label }
        path: index.html
      - id: recap-label
        type: editor.select
        at: { afterAction: open-index-recap }
        target: { file: index.html, text: '<label for="name">နာမည်</label>', occurrence: 1 }
      - id: recap-type
        type: editor.select
        at: { mark: recap-type }
        target: { file: index.html, text: 'type="tel" autocomplete="tel" required', occurrence: 1 }
      - id: recap-group
        type: editor.select
        at: { mark: recap-group }
        target: { file: index.html, text: "<legend>သကြား</legend>", occurrence: 1 }
      - id: recap-error
        type: editor.select
        at: { mark: recap-error }
        target:
          { file: index.html, text: 'aria-describedby="phone-error phone-hint"', occurrence: 1 }
      - id: expect-file-name-label
        type: expect.file
        at: { afterAction: recap-error }
        path: index.html
        contains: '<label for="name">နာမည်</label>'
      - id: expect-file-phone-input
        type: expect.file
        at: { afterAction: expect-file-name-label }
        path: index.html
        contains: '<input id="phone" name="phone" type="tel" autocomplete="tel" required aria-describedby="phone-error phone-hint"'
      - id: expect-file-name-autocomplete
        type: expect.file
        at: { afterAction: expect-file-phone-input }
        path: index.html
        contains: 'type="text" autocomplete="name"'
      - id: expect-file-fieldset
        type: expect.file
        at: { afterAction: expect-file-name-autocomplete }
        path: index.html
        contains: "<legend>သကြား</legend>"
      - id: expect-file-invalid-js
        type: expect.file
        at: { afterAction: expect-file-fieldset }
        path: main.js
        contains: 'phone.setAttribute("aria-invalid", String(!ok));'

checks:
  - { type: timing.p95Ms, max: 300 }
