build:
  # Studio replaces this built-in profile at render time with the Burmese provider chosen in the
  # render console (AthanLab with the user's own key, or VoxCPM2 when that feature is enabled).
  voiceProfile: pocket-alba-v1
  seed: 3112
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "Object type တွေကို ပေါင်းခြင်း"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ object type တွေကို union နဲ့ ပေါင်းပြီး၊ status လို
      discriminant တစ်ခုနဲ့ ခွဲခြားတဲ့ discriminated union ကို လေ့လာခဲ့ပါတယ်။ ဒီ lesson မှာတော့ object
      type တွေကို နောက်တစ်နည်းနဲ့ ပေါင်းတဲ့ intersection နဲ့၊ object type ကို နာမည်ပေးပြီး ချဲ့လို့ ရတဲ့
      interface ကို ကြည့်သွားပါမယ်။ [[mark:draw-menu-item]] ဆိုင်ရဲ့ menu ထဲက ပစ္စည်း တိုင်းမှာ နာမည်နဲ့
      ဈေးနှုန်း ပါပါတယ်။ ဒီ ပုံစံကို menu item type လို့ ခေါ်ပါမယ်။ [[mark:draw-sugar]] လက်ဖက်ရည်၊
      ကော်ဖီလို သောက်စရာတွေမှာတော့ သကြား ဘယ်လောက် ထည့်မလဲ ဆိုတာပါ ထပ်ပါရပါတယ်။ [[mark:draw-drink]]
      ဆိုတော့ drink ဆိုတာ menu item မှာ ပါတာ အားလုံးရော၊ သကြား အဆင့်ရော ပါရမယ့် type ပါ။ နာမည်နဲ့
      ဈေးနှုန်းကို ထပ်ကူးရေးမယ့်အစား ရှိပြီးသား menu item ကို ယူပြီး ချဲ့လိုက်ရင်၊ menu item
      ပြောင်းတဲ့အခါ drink ပါ လိုက်ပြောင်းသွားမှာပါ။ [[mark:draw-contrast]] union က ဒါ ဒါမှမဟုတ် ဟိုဟာ
      ဆိုတဲ့ အဓိပ္ပာယ် ဖြစ်ပြီး၊ ဒီနေ့ ကြည့်မယ့် intersection ကတော့ ဒါရော ဟိုဟာရော ဆိုတဲ့ အဓိပ္ပာယ်ပါ။
      type နှစ်ခုလုံးမှာ ပါတာ အကုန် ရှိရပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 6: Objects (extending objects, intersection types)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/objects",
        }
      - {
          title: "TypeScript Handbook: Object Types (intersection types)",
          url: "https://www.typescriptlang.org/docs/handbook/2/objects.html#intersection-types",
        }
    actions:
      - id: open-board-a
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-menu-item
        type: whiteboard.apply
        at: { mark: draw-menu-item }
        upsertIds: [a-box1, a-box1-name, a-box1-p1, a-box1-p2]
        drawMs: 2400
      - id: draw-sugar
        type: whiteboard.apply
        at: { mark: draw-sugar }
        upsertIds: [a-amp, a-box2, a-box2-p]
        drawMs: 1600
      - id: draw-drink
        type: whiteboard.apply
        at: { mark: draw-drink }
        upsertIds: [a-arrow, a-box3, a-box3-name, a-box3-p1, a-box3-p2, a-box3-p3]
        drawMs: 3000
      - id: draw-contrast
        type: whiteboard.apply
        at: { mark: draw-contrast }
        upsertIds: [a-union, a-inter]
        drawMs: 2200

  - id: starter
    narration: >
      [[mark:close-board]] ဒီနေ့ code ကို ကြည့်ရအောင်။ [[mark:open-menu]] ဒါက menu ရဲ့ type တွေကို
      စုရေးထားတဲ့ ဖိုင်ပါ။ [[mark:select-menu-item]] menu item type မှာ နာမည်နဲ့ ဈေးနှုန်း ပါပါတယ်။
      [[mark:select-drink]] drink type ကတော့ အခုထိ menu item နဲ့ အတူတူပဲ ဖြစ်နေပြီး၊ သကြား အဆင့်
      မပါသေးပါဘူး။ [[mark:select-sugar]] အပေါ်ဆုံးက sugar type ကတော့ သကြား အဆင့် သုံးမျိုးကို literal
      type တွေနဲ့ ရေးထားတဲ့ union ပါ။ [[mark:open-main]] main ဖိုင်မှာတော့ menu ဖိုင်ကနေ drink နဲ့ snack
      ဆိုတဲ့ type နှစ်ခုကို import လုပ်ထားပါတယ်။ [[mark:select-tea]] လက်ဖက်ရည်က drink ဖြစ်ပြီး သကြား
      နည်းနည်းနဲ့ပါ။ [[mark:select-mohinga]] မုန့်ဟင်းခါးကတော့ snack ဖြစ်ပြီး၊ စပ်လား မစပ်လား ဆိုတဲ့
      property ပါပါတယ်။ ဒါပေမဲ့ snack type ကို menu ဖိုင်မှာ ရေးမထားရသေးပါဘူး။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 6: Objects",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/objects",
        }
      - {
          title: "TypeScript Handbook: Everyday Types (type aliases)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#type-aliases",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: open-menu
        type: workspace.openFile
        at: { mark: open-menu }
        path: src/menu.ts
      - id: select-menu-item
        type: editor.select
        at: { mark: select-menu-item }
        target:
          {
            file: src/menu.ts,
            text: "export type MenuItem = {\n  name: string;\n  price: number;\n};",
            occurrence: 1,
          }
      - id: select-drink
        type: editor.select
        at: { mark: select-drink }
        target: { file: src/menu.ts, text: "export type Drink = MenuItem;", occurrence: 1 }
      - id: select-sugar
        type: editor.select
        at: { mark: select-sugar }
        target:
          {
            file: src/menu.ts,
            text: 'export type Sugar = "less" | "normal" | "extra";',
            occurrence: 1,
          }
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: src/main.ts
      - id: select-tea
        type: editor.select
        at: { mark: select-tea }
        target:
          {
            file: src/main.ts,
            text: 'const tea: Drink = { name: "လက်ဖက်ရည်", price: 1500, sugar: "less" };',
            occurrence: 1,
          }
      - id: select-mohinga
        type: editor.select
        at: { mark: select-mohinga }
        target:
          {
            file: src/main.ts,
            text: 'const mohinga: Snack = { name: "မုန့်ဟင်းခါး", price: 2500, spicy: true };',
            occurrence: 1,
          }

  - id: symptoms
    narration: >
      [[mark:panel-ready]] panel မှာ error သုံးခု ရှိနေပါတယ်။ ပထမ error က menu ဖိုင်မှာ snack ဆိုတဲ့
      export မရှိဘူးလို့ ပြောနေပါတယ်။ [[mark:read-sugar-errors]] ဒုတိယနဲ့ တတိယ error တွေကတော့ menu item
      type မှာ သကြား property မရှိဘူးလို့ ပြောနေပါတယ်။ လက်ဖက်ရည် object ထဲမှာ သကြား ထည့်ထားတဲ့ နေရာနဲ့၊
      သကြားကို ပြန်ထုတ်ပြတဲ့ နေရာမှာပါ။ drink က menu item နဲ့ အတူတူ ဖြစ်နေသေးလို့ error ထဲမှာ menu item
      လို့ ပြတာပါ။ [[mark:read-output]] Output ကိုတော့ ကြည့်ပါ။ type error တွေ ရှိနေပေမယ့် program က run
      သွားပြီး၊ လက်ဖက်ရည်ရဲ့ သကြား အဆင့်နဲ့ မုန့်ဟင်းခါးရဲ့ အစပ်ကို ထုတ်ပြနေပါတယ်။ ဆိုလိုတာက data က
      မှန်နေပြီး၊ type တွေကပဲ data နဲ့ မကိုက်သေးတာပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 6: Objects",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/objects",
        }
      - {
          title: "TypeScript Handbook: Object Types (excess property checks)",
          url: "https://www.typescriptlang.org/docs/handbook/2/objects.html",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-three-errors
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "3" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-no-snack
        type: expect.preview
        at: { afterAction: expect-three-errors }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: 'Module ''"./menu"'' has no exported member ''Snack''.'
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-excess-sugar
        type: expect.preview
        at: { afterAction: expect-no-snack }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-2 }
        textContains: "'sugar' does not exist in type 'MenuItem'."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-no-sugar
        type: expect.preview
        at: { afterAction: expect-excess-sugar }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-3 }
        textContains: "Property 'sugar' does not exist on type 'MenuItem'."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-tea-output
        type: expect.preview
        at: { afterAction: expect-no-sugar }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-1 }
        textContains: "လက်ဖက်ရည် 1500 ကျပ်၊ သကြား less"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-mohinga-output
        type: expect.preview
        at: { afterAction: expect-tea-output }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-2 }
        textContains: "မုန့်ဟင်းခါး 2500 ကျပ်၊ အစပ် true"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: intersection
    chapter: "Intersection"
    narration: >
      [[mark:open-menu-2]] menu ဖိုင်ကို ပြန်သွားပြီး drink ကနေ စပြင်ပါမယ်။ [[mark:type-intersection]]
      menu item ရဲ့ နောက်မှာ ampersand သင်္ကေတနဲ့ သကြား property တစ်ခုတည်း ပါတဲ့ object type ကို
      ဆက်ရေးလိုက်ပါမယ်။ ဒါကို intersection type လို့ ခေါ်ပြီး၊ ဘယ်ဘက် type ရဲ့ property တွေရော၊ ညာဘက်
      type ရဲ့ property တွေရော အကုန် ပါရမယ် ဆိုတဲ့ အဓိပ္ပာယ်ပါ။ [[mark:read-intersection]] သကြားနဲ့
      ပတ်သက်တဲ့ error နှစ်ခု ပျောက်သွားပြီး၊ snack error တစ်ခုပဲ ကျန်ပါတော့တယ်။ အခု drink မှာ နာမည်၊
      ဈေးနှုန်းနဲ့ သကြား သုံးခုလုံး ရှိနေပါပြီ။
    sources:
      - {
          title: "TypeScript Handbook: Object Types (intersection types)",
          url: "https://www.typescriptlang.org/docs/handbook/2/objects.html#intersection-types",
        }
      - {
          title: "Total TypeScript Essentials, ch. 6: Objects (intersection types)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/objects",
        }
    actions:
      - id: open-menu-2
        type: workspace.openFile
        at: { mark: open-menu-2 }
        path: src/menu.ts
      - id: type-intersection
        type: editor.type
        at: { mark: type-intersection }
        target: { file: src/menu.ts, after: "export type Drink = MenuItem", occurrence: 1 }
        text: " & { sugar: Sugar }"
        cadence: fast-explainer
      - id: expect-one-left
        type: expect.preview
        at: { afterAction: type-intersection }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-snack-left
        type: expect.preview
        at: { afterAction: expect-one-left }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "has no exported member 'Snack'."
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: never
    narration: >
      [[mark:type-both]] intersection ကို object type တွေနဲ့ သုံးရင် property တွေ ပေါင်းသွားတာ
      မြင်ရပါပြီ။ ဒါဆို string နဲ့ number လို ရိုးရိုး type နှစ်ခုကို intersection လုပ်ရင် ဘာဖြစ်မလဲ။
      type alias တစ်ခုနဲ့ ရေးပြီး query comment နဲ့ မေးကြည့်ရအောင်။ [[mark:read-both]] Types အပိုင်းမှာ
      never လို့ ပြနေပါတယ်။ [[mark:board-sets]] type တစ်ခုကို အဲဒီ type ဖြစ်နိုင်တဲ့ တန်ဖိုးတွေရဲ့
      အစုလို့ စဉ်းစားကြည့်ရအောင်။ string အစုထဲမှာ စာသားတွေ၊ number အစုထဲမှာ ဂဏန်းတွေ ရှိပါတယ်။
      [[mark:draw-empty]] intersection က အစု နှစ်ခုလုံးထဲမှာ ရှိတဲ့ တန်ဖိုးကို လိုချင်တာပါ။ ဒါပေမဲ့
      စာသားလည်း ဖြစ်၊ ဂဏန်းလည်း ဖြစ်တဲ့ တန်ဖိုး မရှိလို့၊ ဘာမှ မဝင်နိုင်တဲ့ never type ဖြစ်သွားတာပါ။
      [[mark:draw-objects]] object type တွေကျတော့ နာမည်၊ ဈေးနှုန်းနဲ့ သကြား အကုန်ပါတဲ့ object တစ်ခုက
      type နှစ်ခုလုံးထဲ ဝင်နိုင်လို့၊ property တွေ ပေါင်းထားတဲ့ type ဖြစ်လာတာပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 6: Objects (intersections of primitives)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/objects",
        }
      - {
          title: "TypeScript Handbook: Narrowing (the never type)",
          url: "https://www.typescriptlang.org/docs/handbook/2/narrowing.html#the-never-type",
        }
    actions:
      - id: type-both
        type: editor.type
        at: { mark: type-both }
        target:
          {
            file: src/menu.ts,
            after: "export type Drink = MenuItem & { sugar: Sugar };\n",
            occurrence: 1,
          }
        text: "\ntype Both = string & number;\n//   ^?\n"
        cadence: line-by-line
      - id: expect-both-never
        type: expect.preview
        at: { afterAction: type-both }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        attribute: { name: data-type, value: "type Both = never" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: open-board-b
        type: whiteboard.apply
        at: { mark: board-sets }
        open: true
        clear: true
        upsertIds: [b-title, b-e1, b-e1-label, b-e1-ex, b-e2, b-e2-label, b-e2-ex]
        drawMs: 3000
      - id: draw-empty
        type: whiteboard.apply
        at: { mark: draw-empty }
        upsertIds: [b-never]
        drawMs: 1600
      - id: draw-objects
        type: whiteboard.apply
        at: { mark: draw-objects }
        upsertIds: [b-objects]
        drawMs: 1400

  - id: interface
    chapter: "Interface နဲ့ extends"
    narration: >
      [[mark:close-board-b]] အခု ကျန်နေတဲ့ snack error ကို ဖြေရှင်းရအောင်။ ဒီတစ်ခါတော့ object type ကို
      ချဲ့တဲ့ ဒုတိယ နည်းဖြစ်တဲ့ interface ကို သုံးပါမယ်။ [[mark:type-interface]] interface ဆိုတာ object
      type တစ်ခုကို နာမည်ပေးတဲ့ နောက်ထပ် နည်းတစ်ခုပါ။ extends ဆိုတာကတော့ ရှိပြီးသား type ကို အခြေခံပြီး
      ချဲ့တယ် ဆိုတဲ့ အဓိပ္ပာယ်ပါ။ ဒီမှာ snack က menu item ကို ချဲ့ပြီး၊ စပ်မစပ် ဆိုတဲ့ property တစ်ခု
      ထပ်ပါပါတယ်။ [[mark:read-interface]] Errors အပိုင်း ရှင်းသွားပါပြီ။ snack မှာ menu item ရဲ့
      နာမည်နဲ့ ဈေးနှုန်းရော၊ အစပ်ရော ပါတဲ့အတွက် intersection နဲ့ ရလဒ် တူတူပါပဲ။ ဒါဆို ဘယ်ဟာကို
      သုံးသင့်လဲ။ ကွာခြားချက်က property တွေ အချင်းချင်း မကိုက်တဲ့အခါ ပေါ်လာပါတယ်။
    sources:
      - {
          title: "TypeScript Handbook: Object Types (extending types)",
          url: "https://www.typescriptlang.org/docs/handbook/2/objects.html#extending-types",
        }
      - {
          title: "Total TypeScript Essentials, ch. 6: Objects (interfaces, interface extends)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/objects",
        }
    actions:
      - id: close-board-b
        type: whiteboard.apply
        at: { mark: close-board-b }
        open: false
      - id: type-interface
        type: editor.type
        at: { mark: type-interface }
        target: { file: src/menu.ts, after: "//   ^?\n", occurrence: 1 }
        text: "\nexport interface Snack extends MenuItem {\n  spicy: boolean;\n}\n"
        cadence: block
      - id: expect-no-errors
        type: expect.preview
        at: { afterAction: type-interface }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-two-lines
        type: expect.preview
        at: { afterAction: expect-no-errors }
        timeoutMs: 5000
        target: { by: testId, value: ts-output }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: conflict
    chapter: "Property ချင်း မကိုက်ရင်"
    narration: >
      [[mark:type-promo]] ဥပမာအားဖြင့်၊ promotion ဈေးကို စာသားနဲ့ ပြချင်လို့ ဈေးနှုန်းကို string
      ပြောင်းချင်တယ် ဆိုပါစို့။ drink ကို intersection နဲ့ ချဲ့ပြီး ဈေးနှုန်းကို string လို့ ပေးပါမယ်။
      သူ့အောက်မှာ အဲဒီ type နဲ့ ကော်ဖီ object တစ်ခု ရေးပါမယ်။ [[mark:read-promo]] error ပေါ်တဲ့ နေရာကို
      သတိထား ကြည့်ပါ။ type ကို ကြေညာတဲ့ line မှာ မဟုတ်ဘဲ object ထဲက ဈေးနှုန်းမှာ ပေါ်ပြီး၊ string ကို
      never ထဲ ထည့်လို့ မရဘူးလို့ ပြောနေပါတယ်။ ဈေးနှုန်းက number ရော string ရော ဖြစ်ရမယ် ဆိုတော့ never
      ဖြစ်သွားတာပါ။ type ကို ရေးတုန်းက ဘာမှ မပြောဘဲ၊ သုံးမှ နားလည်ရ ခက်တဲ့ error ပေါ်လာတာပါ။
      [[mark:type-promo-snack]] အလားတူ အမှားကို interface extends နဲ့ ရေးကြည့်ရအောင်။
      [[mark:read-promo-snack]] ဒီတစ်ခါတော့ error က interface ကို ကြေညာတဲ့ နေရာမှာ တန်းပေါ်ပါတယ်။ snack
      ကို မှန်မှန်ကန်ကန် မချဲ့ထားဘူး၊ ဈေးနှုန်းမှာ string ကို number နေရာမှာ ထည့်လို့ မရဘူးလို့
      အကြောင်းရင်းကို တိတိကျကျ ပြောပါတယ်။ [[mark:why-faster]] နောက်ထပ် အချက် တစ်ခုက မြန်နှုန်းပါ။
      interface ကို TypeScript က နာမည်နဲ့ မှတ်ထားပြီး စစ်ပြီးသား ရလဒ်တွေကို ပြန်သုံးနိုင်ပေမယ့်၊
      intersection ကိုတော့ သုံးတဲ့ နေရာတိုင်းမှာ ပြန်ပေါင်းတွက်ရတာ များပါတယ်။ project ကြီးတွေမှာ ဒါက
      editor နဲ့ type check ရဲ့ မြန်နှုန်းကို သက်ရောက်ပါတယ်။ [[mark:comment-out]] စမ်းထားတဲ့ line
      သုံးကြောင်းကိုတော့ comment လုပ်ပြီး ပိတ်ထားလိုက်ပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 6: Objects (intersections vs interface extends)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/objects",
        }
      - {
          title: "TypeScript wiki: Performance (preferring interfaces over intersections)",
          url: "https://github.com/microsoft/TypeScript/wiki/Performance#preferring-interfaces-over-intersections",
        }
    actions:
      - id: type-promo
        type: editor.type
        at: { mark: type-promo }
        target: { file: src/menu.ts, after: "  spicy: boolean;\n}\n", occurrence: 1 }
        text: "\ntype Promo = Drink & { price: string };\nconst promo: Promo = { name: \"ကော်ဖီ\", price: \"1000\", sugar: \"less\" };\n"
        cadence: line-by-line
      - id: expect-promo-error
        type: expect.preview
        at: { afterAction: type-promo }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-1 }
        textContains: "Type 'string' is not assignable to type 'never'."
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-promo-count
        type: expect.preview
        at: { afterAction: expect-promo-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: select-promo-price
        type: editor.select
        at: { mark: read-promo }
        target: { file: src/menu.ts, text: 'price: "1000"', occurrence: 1 }
      - id: type-promo-snack
        type: editor.type
        at: { mark: type-promo-snack }
        target: { file: src/menu.ts, after: "sugar: \"less\" };\n", occurrence: 1 }
        text: "interface PromoSnack extends Snack { price: string }\n"
        cadence: line-by-line
      - id: expect-extends-error
        type: expect.preview
        at: { afterAction: type-promo-snack }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-2 }
        textContains: "Interface 'PromoSnack' incorrectly extends interface 'Snack'."
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-extends-bottom
        type: expect.preview
        at: { afterAction: expect-extends-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-2 }
        textContains: "Type 'string' is not assignable to type 'number'."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-two-errors
        type: expect.preview
        at: { afterAction: expect-extends-bottom }
        timeoutMs: 5000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: select-experiments
        type: editor.select
        at: { mark: comment-out }
        target:
          {
            file: src/menu.ts,
            text: "type Promo = Drink & { price: string };\nconst promo: Promo = { name: \"ကော်ဖီ\", price: \"1000\", sugar: \"less\" };\ninterface PromoSnack extends Snack { price: string }",
            occurrence: 1,
          }
      - id: comment-promo-object
        type: editor.type
        at: { afterAction: select-experiments }
        target:
          { file: src/menu.ts, after: "type Promo = Drink & { price: string };\n", occurrence: 1 }
        text: "// "
        cadence: fast-explainer
      - id: comment-promo
        type: editor.type
        at: { afterAction: comment-promo-object }
        target: { file: src/menu.ts, after: "  spicy: boolean;\n}\n\n", occurrence: 1 }
        text: "// "
        cadence: fast-explainer
      - id: comment-promo-snack
        type: editor.type
        at: { afterAction: comment-promo }
        target: { file: src/menu.ts, after: "sugar: \"less\" };\n", occurrence: 1 }
        text: "// "
        cadence: fast-explainer
      - id: expect-clean-again
        type: expect.preview
        at: { afterAction: comment-promo-snack }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: merge
    chapter: "နာမည်တူ interface"
    narration: >
      [[mark:type-merge]] interface မှာ သိထားရမယ့် ထူးခြားချက် တစ်ခု ရှိပါသေးတယ်။ snack ဆိုတဲ့ နာမည်နဲ့
      interface တစ်ခု ထပ်ရေးပြီး၊ သက်သတ်လွတ် ဟုတ်မဟုတ် ဆိုတဲ့ property ကို ထည့်ကြည့်ပါမယ်။
      [[mark:read-merge]] menu ဖိုင်မှာ error မပေါ်ပါဘူး။ ဒါပေမဲ့ main ဖိုင်က မုန့်ဟင်းခါးမှာ သက်သတ်လွတ်
      property မပါဘူး ဆိုတဲ့ error ပေါ်လာပါတယ်။ ဘာကြောင့်လဲဆိုတော့ နာမည်တူ interface နှစ်ခုကို
      TypeScript က တစ်ခုတည်းအဖြစ် ပေါင်းလိုက်လို့ပါ။ ဒါကို declaration merging လို့ ခေါ်ပါတယ်။ သူ့ကို
      သုံးရမယ့် နေရာတွေ ရှိပေမယ့်၊ ဖိုင်ကြီးတွေထဲမှာ မရည်ရွယ်ဘဲ ဖြစ်သွားရင် အကြောင်းရင်းကို ရှာရ
      ခက်ပါတယ်။ [[mark:type-dup]] type alias ကိုကျတော့ နာမည်တူ နှစ်ခါ ရေးကြည့်ရအောင်။ [[mark:read-dup]]
      ဒီတစ်ခါတော့ နာမည် ထပ်နေတယ် ဆိုတဲ့ error က နှစ်နေရာလုံးမှာ ချက်ချင်း ပေါ်လာပါတယ်။ ပေါင်းမသွားဘဲ
      error ပြတဲ့အတွက် type alias က ပိုစိတ်ချရပါတယ်။ [[mark:comment-merge]] ဒီ line နှစ်ကြောင်းကိုလည်း
      comment လုပ်ပြီး ပိတ်ထားလိုက်ပါမယ်။
    sources:
      - {
          title: "TypeScript Handbook: Declaration Merging (merging interfaces)",
          url: "https://www.typescriptlang.org/docs/handbook/declaration-merging.html#merging-interfaces",
        }
      - {
          title: "Total TypeScript Essentials, ch. 6: Objects (types vs interfaces, declaration merging)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/objects",
        }
    actions:
      - id: type-merge
        type: editor.type
        at: { mark: type-merge }
        target:
          {
            file: src/menu.ts,
            after: "// interface PromoSnack extends Snack { price: string }\n",
            occurrence: 1,
          }
        text: "\nexport interface Snack { vegetarian: boolean }\n"
        cadence: line-by-line
      - id: expect-merge-error
        type: expect.preview
        at: { afterAction: type-merge }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-1 }
        textContains: "Property 'vegetarian' is missing in type '{ name: string; price: number; spicy: true; }' but required in type 'Snack'."
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-merge-file
        type: expect.preview
        at: { afterAction: expect-merge-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-file, value: "src/main.ts" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-dup
        type: editor.type
        at: { mark: type-dup }
        target:
          {
            file: src/menu.ts,
            after: "export interface Snack { vegetarian: boolean }\n",
            occurrence: 1,
          }
        text: "export type Drink = { hot: boolean };\n"
        cadence: line-by-line
      - id: expect-dup-count
        type: expect.preview
        at: { afterAction: type-dup }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "3" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-dup-error
        type: expect.preview
        at: { afterAction: expect-dup-count }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Duplicate identifier 'Drink'."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-dup-error-2
        type: expect.preview
        at: { afterAction: expect-dup-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-2 }
        textContains: "Duplicate identifier 'Drink'."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: comment-merge
        type: editor.type
        at: { mark: comment-merge }
        target:
          {
            file: src/menu.ts,
            after: "// interface PromoSnack extends Snack { price: string }\n\n",
            occurrence: 1,
          }
        text: "// "
        cadence: fast-explainer
      - id: comment-dup
        type: editor.type
        at: { afterAction: comment-merge }
        target:
          {
            file: src/menu.ts,
            after: "// export interface Snack { vegetarian: boolean }\n",
            occurrence: 1,
          }
        text: "// "
        cadence: fast-explainer
      - id: expect-merge-clean
        type: expect.preview
        at: { afterAction: comment-dup }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: choose
    chapter: "type လား၊ interface လား"
    narration: >
      [[mark:board-choose]] ဒါဆို type alias နဲ့ interface ကို ဘယ်လို ရွေးမလဲ။ [[mark:draw-type-col]]
      type alias က union အပါအဝင် ဘယ် type ကိုမဆို နာမည်ပေးနိုင်ပါတယ်။ sugar type လို union ကို interface
      နဲ့ ရေးလို့ မရပါဘူး။ ampersand နဲ့ ချဲ့ရင်တော့ မကိုက်တဲ့ property က သုံးမှ error ပေါ်ပြီး၊ နာမည်တူ
      ထပ်ရေးရင် error ပြပါတယ်။ [[mark:draw-interface-col]] interface ကတော့ object type အတွက်ပဲ ဖြစ်ပြီး၊
      extends နဲ့ ချဲ့တဲ့အခါ error ကို ကြေညာတဲ့ နေရာမှာ ပြပါတယ်။ နာမည်တူ ထပ်ရေးရင်တော့ ပေါင်းသွားပါတယ်။
      [[mark:draw-default]] ဒါကြောင့် ဒီ course မှာ ပုံမှန်အားဖြင့် type alias ကို သုံးပြီး၊ object type
      တစ်ခုကို ချဲ့ဖို့ လိုတဲ့အခါမှာတော့ interface extends ကို သုံးပါမယ်။ ဥပမာအားဖြင့် ခုနက intersection နဲ့
      ရေးခဲ့တဲ့ drink ကိုလည်း interface extends နဲ့ ပြောင်းရေးလို့ ရပါတယ်၊ lesson ကို pause လုပ်ပြီး
      ကိုယ်တိုင် စမ်းကြည့်ပါ။ interface ကို ပိုကြိုက်တဲ့
      team တွေလည်း ရှိပြီး နှစ်ခုလုံး အလုပ်လုပ်ပါတယ်။ အရေးကြီးတာက project တစ်ခုထဲမှာ တစ်ပုံစံတည်း
      သုံးဖို့ပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 6: Objects (types vs interfaces)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/objects",
        }
      - {
          title: "TypeScript Handbook: Everyday Types (differences between type aliases and interfaces)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#differences-between-type-aliases-and-interfaces",
        }
    actions:
      - id: open-board-c
        type: whiteboard.apply
        at: { mark: board-choose }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-type-col
        type: whiteboard.apply
        at: { mark: draw-type-col }
        upsertIds: [c-type-h, c-type-1, c-type-2, c-type-3]
        drawMs: 2800
      - id: draw-interface-col
        type: whiteboard.apply
        at: { mark: draw-interface-col }
        upsertIds: [c-int-h, c-int-1, c-int-2, c-int-3]
        drawMs: 2800
      - id: draw-default
        type: whiteboard.apply
        at: { mark: draw-default }
        upsertIds: [c-default]
        drawMs: 1800

  - id: recap
    narration: >
      [[mark:close-board-c]] ဒါဆို ပြန်ချုပ်ရရင်၊ intersection က ampersand နဲ့ type တွေကို ပေါင်းပြီး၊
      object type တွေမှာဆိုရင် property အားလုံး ပါတဲ့ type ကို ပေးပါတယ်။ string နဲ့ number လို တန်ဖိုး
      တစ်ခုမှ မထပ်တဲ့ type တွေကို ပေါင်းရင်တော့ never ရပါတယ်။ [[mark:recap-interface]] interface extends
      ကလည်း object type ကို ချဲ့ပေးပြီး၊ မကိုက်တဲ့ property ကို ကြေညာတဲ့ နေရာမှာ ပြပေးတာ၊ စစ်ပြီးသား
      ရလဒ်တွေကို ပြန်သုံးနိုင်တာတွေကြောင့် object တွေကို ချဲ့တဲ့အခါ ပိုသင့်တော်ပါတယ်။ နာမည်တူ interface တွေ
      ပေါင်းသွားတတ်တာကိုတော့ သတိထားပါ။ နောက် lesson မှာတော့ ပစ္စည်း တစ်ခုစီရဲ့ လက်ကျန်လို key တွေကို
      ကြိုမသိတဲ့ object တွေအတွက် dynamic key နဲ့ Record ကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 6: Objects",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/objects",
        }
      - {
          title: "TypeScript Handbook: Object Types",
          url: "https://www.typescriptlang.org/docs/handbook/2/objects.html",
        }
    actions:
      - id: close-board-c
        type: whiteboard.apply
        at: { mark: close-board-c }
        open: false
      - id: select-intersection-recap
        type: editor.select
        at: { afterAction: close-board-c }
        target:
          {
            file: src/menu.ts,
            text: "export type Drink = MenuItem & { sugar: Sugar };",
            occurrence: 1,
          }
      - id: select-interface-recap
        type: editor.select
        at: { mark: recap-interface }
        target:
          {
            file: src/menu.ts,
            text: "export interface Snack extends MenuItem {\n  spicy: boolean;\n}",
            occurrence: 1,
          }
      - id: expect-file-drink
        type: expect.file
        at: { afterAction: select-intersection-recap }
        path: src/menu.ts
        contains: "export type Drink = MenuItem & { sugar: Sugar };\n\ntype Both = string & number;\n//   ^?\n\nexport interface Snack extends MenuItem {\n  spicy: boolean;\n}\n"
      - id: expect-file-commented
        type: expect.file
        at: { afterAction: expect-file-drink }
        path: src/menu.ts
        contains: "// type Promo = Drink & { price: string };\n// const promo: Promo = { name: \"ကော်ဖီ\", price: \"1000\", sugar: \"less\" };\n// interface PromoSnack extends Snack { price: string }\n\n// export interface Snack { vegetarian: boolean }\n// export type Drink = { hot: boolean };\n"
checks:
  - { type: timing.p95Ms, max: 300 }
