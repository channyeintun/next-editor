build:
  # Studio replaces this built-in profile at render time with the Burmese provider chosen in the
  # render console (AthanLab with the user's own key, or VoxCPM2 when that feature is enabled).
  voiceProfile: pocket-alba-v1
  seed: 3120
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "ကူးရေးမယ့်အစား ထုတ်ယူပါ"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ enum လို TypeScript မှာပဲ ရှိတဲ့ feature တွေကို
      ကြည့်ခဲ့ပြီး၊ enum အစား as const object ကို သုံးမယ်လို့ ပြောခဲ့ပါတယ်။ ဒီ lesson မှာ အဲဒီ
      နည်းကို နားလည်ဖို့၊ ရှိပြီးသား type နဲ့ တန်ဖိုးတွေကနေ type အသစ် ထုတ်ယူတဲ့ နည်းတွေကို အရင်
      လေ့လာပါမယ်။ [[mark:draw-copy]] code ထဲမှာ အချက်အလက် တစ်ခုတည်းကို နှစ်နေရာမှာ ရေးထားရင်၊
      တစ်နေရာကို ပြင်တဲ့အခါ ကျန်တဲ့ နေရာကို ပြင်ဖို့ မေ့သွားတတ်ပါတယ်။ ဥပမာအားဖြင့် menu ထဲကို ပလာတာ
      ထပ်ထည့်လိုက်ပေမယ့်၊ ပစ္စည်း နာမည်တွေကို ကူးရေးထားတဲ့ type ထဲမှာတော့ ထည့်ဖို့ မေ့သွားတာမျိုးပါ။
      [[mark:draw-derive]] အဲဒီအစား type ကို မူရင်း တန်ဖိုး ဒါမှမဟုတ် မူရင်း type ကနေ ထုတ်ယူထားရင်၊
      မူရင်းကို ပြင်လိုက်တာနဲ့ ထုတ်ယူထားတဲ့ type ကလည်း အလိုလို လိုက်ပြောင်းပါတယ်။ ဆိုတော့ ပြင်စရာ
      နေရာ တစ်နေရာပဲ ရှိတော့ပါတယ်။ [[mark:draw-tools]] ဒီလို ထုတ်ယူဖို့ TypeScript မှာ type of ရယ်၊
      key of ရယ်၊ indexed access ရယ် ဆိုတဲ့ နည်း သုံးမျိုး ရှိပြီး၊ ဒီ lesson မှာ တစ်ခုချင်း သုံးကြည့်ပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 10: Deriving Types (derived types)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/deriving-types",
        }
      - {
          title: "TypeScript Handbook: Creating Types from Types",
          url: "https://www.typescriptlang.org/docs/handbook/2/types-from-types.html",
        }
    actions:
      - id: open-board-a
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-copy
        type: whiteboard.apply
        at: { mark: draw-copy }
        upsertIds: [a-src-box, a-src-name, a-src-sub, a-arrow-copy, a-copy]
        drawMs: 3000
      - id: draw-derive
        type: whiteboard.apply
        at: { mark: draw-derive }
        upsertIds: [a-arrow-derive, a-derive, a-rule]
        drawMs: 2600
      - id: draw-tools
        type: whiteboard.apply
        at: { mark: draw-tools }
        upsertIds: [a-tools]
        drawMs: 1200

  - id: starter
    narration: >
      [[mark:close-board]] ဒါဆို ဒီ ပြဿနာကို ဆိုင်ရဲ့ code ထဲမှာ ကြည့်ရအောင်။ [[mark:open-menu]] ဒါက ဆိုင်ရဲ့ menu ဖိုင်ပါ။
      [[mark:select-menu]] menu object ထဲမှာ ပစ္စည်း တစ်ခုချင်းရဲ့ နာမည်နဲ့ ဈေးနှုန်းကို ရေးထားပြီး၊
      နောက်ဆုံးက ပလာတာကို မကြာခင်က ထပ်ထည့်ထားတာပါ။ [[mark:select-item-name]] သူ့အောက်က type ကတော့
      ပစ္စည်း နာမည်တွေကို လက်နဲ့ ကူးရေးထားတာ ဖြစ်ပြီး၊ ပလာတာ မပါသေးပါဘူး။ [[mark:select-price-of]]
      ဈေးနှုန်း ရှာပေးတဲ့ function က အဲဒီ type ကို parameter ရဲ့ type အဖြစ် သုံးထားပါတယ်။
      [[mark:open-order]] order ဖိုင်မှာတော့ သကြား အဆင့်တွေကို enum မဟုတ်ဘဲ ရိုးရိုး object နဲ့
      ရေးထားပါတယ်။ [[mark:select-order-type]] အောက်မှာ အော်ဒါ တစ်ခုရဲ့ type ရှိပြီး၊ status
      လေးမျိုးနဲ့ customer ရဲ့ နာမည်၊ စားပွဲ နံပါတ်တို့ ပါပါတယ်။ [[mark:open-main]] main ဖိုင်ကတော့
      လက်ဖက်ရည်နဲ့ ပလာတာရဲ့ ဈေးနှုန်းနဲ့ သကြား အဆင့်ကို ထုတ်ပြပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 10: Deriving Types",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/deriving-types",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: open-menu
        type: workspace.openFile
        at: { mark: open-menu }
        path: src/menu.ts
      - id: select-menu
        type: editor.select
        at: { mark: select-menu }
        target:
          {
            file: src/menu.ts,
            text: "  tea: 1500,\n  coffee: 1800,\n  mohinga: 2500,\n  palata: 1200,",
            occurrence: 1,
          }
      - id: select-item-name
        type: editor.select
        at: { mark: select-item-name }
        target:
          {
            file: src/menu.ts,
            text: 'export type ItemName = "tea" | "coffee" | "mohinga";',
            occurrence: 1,
          }
      - id: select-price-of
        type: editor.select
        at: { mark: select-price-of }
        target:
          { file: src/menu.ts, text: "export function priceOf(name: ItemName)", occurrence: 1 }
      - id: open-order
        type: workspace.openFile
        at: { mark: open-order }
        path: src/order.ts
      - id: select-sugar
        type: editor.select
        at: { afterAction: open-order }
        target:
          {
            file: src/order.ts,
            text: "  Less: \"less\",\n  Normal: \"normal\",\n  Extra: \"extra\",",
            occurrence: 1,
          }
      - id: select-order-type
        type: editor.select
        at: { mark: select-order-type }
        target:
          {
            file: src/order.ts,
            text: "  status: \"pending\" | \"brewing\" | \"ready\" | \"paid\";\n  customer: { name: string; table: number };",
            occurrence: 1,
          }
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: src/main.ts

  - id: symptoms
    narration: >
      [[mark:panel-ready]] ညာဘက် panel ရဲ့ Output မှာ ပလာတာ ၁၂၀၀ ကျပ် အပါအဝင် line သုံးကြောင်း
      မှန်မှန် ထွက်နေပါတယ်။ ဒါပေမဲ့ Errors မှာတော့ ပလာတာ ဆိုတဲ့ string ကို ItemName type ထဲ ထည့်လို့
      မရဘူး ဆိုတဲ့ error ပေါ်နေပါတယ်။ [[mark:select-palata-call]] ဆိုလိုတာက program က မှန်နေပေမယ့်၊
      လက်နဲ့ ကူးရေးထားတဲ့ type က menu နဲ့ မကိုက်တော့တာပါ။ ကူးရေးထားတဲ့ နေရာ များလေ၊ ဒီလို ပြဿနာ
      များလေ ဖြစ်ပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 10: Deriving Types (derived types, single source of truth)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/deriving-types",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-one-error
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-palata-error
        type: expect.preview
        at: { afterAction: expect-one-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: 'Argument of type ''"palata"'' is not assignable to parameter of type ''ItemName''.'
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-palata-price
        type: expect.preview
        at: { afterAction: expect-palata-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-2 }
        textContains: "ပလာတာ 1200 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-three-lines
        type: expect.preview
        at: { afterAction: expect-palata-price }
        timeoutMs: 5000
        target: { by: testId, value: ts-output }
        attribute: { name: data-count, value: "3" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: select-palata-call
        type: editor.select
        at: { mark: select-palata-call }
        target: { file: src/main.ts, text: 'priceOf("palata")', occurrence: 1 }

  - id: typeof
    chapter: "typeof နဲ့ တန်ဖိုးရဲ့ type"
    narration: >
      [[mark:open-menu-2]] အရင်ဆုံး menu object ရဲ့ type ကို ထုတ်ယူကြည့်ရအောင်။
      [[mark:type-menu-type]] type alias တစ်ခုမှာ type of ကို menu variable နဲ့ တွဲရေးပြီး၊ query
      comment နဲ့ ကြည့်ပါမယ်။ [[mark:read-menu-type]] Types မှာ menu ရဲ့ type ပေါ်လာပါပြီ။ property
      လေးခု ပါပြီး တစ်ခုချင်းစီက number ဖြစ်ပါတယ်။ type of ကို type ရေးတဲ့ နေရာမှာ သုံးရင်၊ တန်ဖိုး
      တစ်ခုရဲ့ type ကို TypeScript ဆီကနေ ထုတ်ယူပေးပါတယ်။ JavaScript မှာလည်း type of ရှိပေမယ့်၊ အဲဒါက
      program run တဲ့ အချိန်မှာ object လို စာသား တစ်ခုကို ပြန်ပေးတာ ဖြစ်လို့ နာမည်တူပေမယ့်
      အလုပ်လုပ်ပုံ မတူပါဘူး။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 10: Deriving Types (typeof)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/deriving-types",
        }
      - {
          title: "TypeScript Handbook: Typeof Type Operator",
          url: "https://www.typescriptlang.org/docs/handbook/2/typeof-types.html",
        }
    actions:
      - id: open-menu-2
        type: workspace.openFile
        at: { mark: open-menu-2 }
        path: src/menu.ts
      - id: type-menu-type
        type: editor.type
        at: { mark: type-menu-type }
        target: { file: src/menu.ts, after: "  palata: 1200,\n};\n", occurrence: 1 }
        text: "\ntype Menu = typeof menu;\n//   ^?\n"
        cadence: line-by-line
      - id: expect-menu-type
        type: expect.preview
        at: { afterAction: type-menu-type }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        textContains: "type Menu = {\n    tea: number;\n    coffee: number;\n    mohinga: number;\n    palata: number;\n}"
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: keyof
    chapter: "keyof နဲ့ key တွေရဲ့ union"
    narration: >
      key of ကတော့ object type တစ်ခုရဲ့ key နာမည်တွေကို union type အဖြစ် ထုတ်ပေးပါတယ်။ ဆိုတော့ ခုနက
      ထုတ်ယူထားတဲ့ menu ရဲ့ type ကို key of နဲ့ တွဲလိုက်ရင် ပစ္စည်း နာမည်တွေ ရလာမှာပါ။ [[mark:type-keyof]]
      ကူးရေးထားတဲ့ type ရဲ့ အပေါ်မှာ အဲဒီ နည်းနဲ့ ထုတ်ယူထားတဲ့ type ကို ရေးပြီး၊ အဟောင်းကိုတော့
      comment အဖြစ် ချန်ထားပါမယ်။ [[mark:read-keyof]] Errors ရှင်းသွားပါပြီ။ Types မှာ ItemName က
      ပလာတာ အပါအဝင် ပစ္စည်း နာမည် လေးခုရဲ့ union ဖြစ်သွားတာ တွေ့ရပါတယ်။ [[mark:type-lime]] အခု menu
      ထဲကို သံပုရာရည် ထပ်ထည့်ကြည့်ရအောင်။ [[mark:read-lime]] type တွေကို ဘာမှ မပြင်ရဘဲ၊ menu ရဲ့
      type မှာရော ItemName မှာရော lime ပါလာပါပြီ။ ဒါက ထုတ်ယူတဲ့ နည်းရဲ့ အကျိုးပါ။ မူရင်း
      တစ်နေရာကိုပဲ ပြင်ရပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 10: Deriving Types (keyof, keyof typeof)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/deriving-types",
        }
      - {
          title: "TypeScript Handbook: Keyof Type Operator",
          url: "https://www.typescriptlang.org/docs/handbook/2/keyof-types.html",
        }
    actions:
      - id: type-keyof
        type: editor.type
        at: { mark: type-keyof }
        target: { file: src/menu.ts, after: "// menu ထဲက ပစ္စည်း နာမည်တွေ\n", occurrence: 1 }
        text: "export type ItemName = keyof Menu;\n//          ^?\n// "
        cadence: block
      - id: expect-keyof-clean
        type: expect.preview
        at: { afterAction: type-keyof }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-keyof-union
        type: expect.preview
        at: { afterAction: expect-keyof-clean }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-2 }
        attribute:
          { name: data-type, value: 'type ItemName = "tea" | "coffee" | "mohinga" | "palata"' }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: select-keyof
        type: editor.select
        at: { mark: read-keyof }
        target: { file: src/menu.ts, text: "keyof Menu", occurrence: 1 }
      - id: type-lime
        type: editor.type
        at: { mark: type-lime }
        target: { file: src/menu.ts, after: "  palata: 1200,\n", occurrence: 1 }
        text: "  lime: 1200,\n"
        cadence: fast-explainer
      - id: expect-lime-union
        type: expect.preview
        at: { afterAction: type-lime }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-2 }
        attribute:
          {
            name: data-type,
            value: 'type ItemName = "tea" | "coffee" | "mohinga" | "palata" | "lime"',
          }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-lime-menu
        type: expect.preview
        at: { afterAction: expect-lime-union }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        textContains: "    lime: number;"
        retry: { maxAttempts: 3, delayMs: 1200 }

  - id: no-way-back
    narration: >
      [[mark:type-experiment]] ဒါဆို ပြောင်းပြန် လုပ်လို့ ရမလား။ type တစ်ခုကို တန်ဖိုး တစ်ခုလို
      ထုတ်ပြကြည့်ရအောင်။ [[mark:read-experiment]] Errors မှာ ItemName က type သက်သက် ဖြစ်ပြီး၊
      တန်ဖိုး အဖြစ် သုံးနေတယ်လို့ ပြောနေပါတယ်။ Output မှာလည်း ဈေးနှုန်း line တွေ မထွက်တော့ဘဲ၊ run တဲ့ အချိန်မှာ
      ItemName ဆိုတာ မရှိဘူး ဆိုတဲ့ error နဲ့ program ရပ်သွားပါတယ်။ type တွေက JavaScript ဖြစ်တဲ့အခါ
      ဖယ်ထုတ်ခံရလို့ပါ။ ဒါကြောင့် တန်ဖိုးကနေ type ကို ထုတ်ယူလို့ ရပေမယ့်၊ type ကနေ တန်ဖိုးကို
      ပြန်ထုတ်လို့ မရပါဘူး။ [[mark:type-comment-out]] ဒီ line ကို comment လုပ်လိုက်ပါမယ်။
      [[mark:read-restored]] error ပျောက်ပြီး Output ပြန်ထွက်လာပါပြီ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 10: Deriving Types (you can't create runtime values from types)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/deriving-types",
        }
      - {
          title: "TypeScript Handbook: The Basics (erased types)",
          url: "https://www.typescriptlang.org/docs/handbook/2/basic-types.html#erased-types",
        }
    actions:
      - id: type-experiment
        type: editor.type
        at: { mark: type-experiment }
        target: { file: src/menu.ts, after: "  return menu[name];\n}\n", occurrence: 1 }
        text: "\nconsole.log(ItemName);\n"
        cadence: fast-explainer
      - id: expect-experiment-error
        type: expect.preview
        at: { afterAction: type-experiment }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-1 }
        textContains: "'ItemName' only refers to a type, but is being used as a value here."
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-experiment-crash
        type: expect.preview
        at: { afterAction: expect-experiment-error }
        timeoutMs: 8000
        target: { by: testId, value: ts-out-1 }
        textContains: "Uncaught ReferenceError: ItemName is not defined"
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-experiment-only-line
        type: expect.preview
        at: { afterAction: expect-experiment-crash }
        timeoutMs: 8000
        target: { by: testId, value: ts-output }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-experiment-count
        type: expect.preview
        at: { afterAction: expect-experiment-only-line }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: type-comment-out
        type: editor.type
        at: { mark: type-comment-out }
        target: { file: src/menu.ts, after: "  return menu[name];\n}\n\n", occurrence: 1 }
        text: "// "
        cadence: fast-explainer
      - id: expect-restored
        type: expect.preview
        at: { afterAction: type-comment-out }
        timeoutMs: 8000
        target: { by: testId, value: ts-output }
        attribute: { name: data-count, value: "3" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-restored-clean
        type: expect.preview
        at: { afterAction: expect-restored }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 1200 }

  - id: indexed
    chapter: "Indexed access type"
    narration: >
      [[mark:open-order-2]] တတိယ နည်းက indexed access type ပါ။ object ထဲက property ကို လေးထောင့်
      ကွင်းနဲ့ ယူသလိုပဲ၊ type တစ်ခုထဲက property ရဲ့ type ကို ယူတာပါ။ [[mark:type-status]] အော်ဒါရဲ့
      status ရဲ့ type ကို ထုတ်ယူကြည့်ရအောင်။ [[mark:read-status]] Types ရဲ့ အပေါ်ဆုံးမှာ status
      လေးမျိုးရဲ့ union ပေါ်လာပါပြီ။ status တွေကို ထပ်ကူးရေးစရာ မလိုတော့ပါဘူး။ [[mark:type-table]]
      လေးထောင့် ကွင်းတွေကို ဆက်ရေးပြီး၊ customer ထဲက စားပွဲ နံပါတ်ရဲ့ type ကိုလည်း ယူလို့ ရပါတယ်။
      [[mark:read-table]] စားပွဲ နံပါတ်က number ဖြစ်တာ ပေါ်လာပါပြီ။ [[mark:type-union-key]] ကွင်းထဲမှာ key တစ်ခုထက်
      ပိုပြီး union နဲ့ ပေးရင်၊ အဲဒီ property တွေရဲ့ type တွေကို ပေါင်းထားတဲ့ union ကို ရပါတယ်။
      [[mark:read-union-key]] id ရဲ့ number နဲ့ status လေးမျိုး ပေါင်းထားတာ မြင်ရပါတယ်။
      [[mark:type-all-values]] ကွင်းထဲမှာ key of Order ကို ထည့်ကြည့်ရအောင်။ key of Order ဆိုတာ
      အော်ဒါရဲ့ key လေးခုလုံးရဲ့ union ဖြစ်လို့၊ property အားလုံးရဲ့ type တွေကို ရပါတယ်။
      [[mark:read-all-values]] string ရယ်၊ number ရယ်၊ customer object ရဲ့ type ရယ် ပေါ်လာပါတယ်။
      status ရဲ့ တန်ဖိုး လေးမျိုးက string ထဲမှာ ပါပြီးသား ဖြစ်လို့ သီးသန့် မပြတော့တာပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 10: Deriving Types (indexed access types)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/deriving-types",
        }
      - {
          title: "TypeScript Handbook: Indexed Access Types",
          url: "https://www.typescriptlang.org/docs/handbook/2/indexed-access-types.html",
        }
    actions:
      - id: open-order-2
        type: workspace.openFile
        at: { mark: open-order-2 }
        path: src/order.ts
      - id: type-status
        type: editor.type
        at: { mark: type-status }
        target:
          {
            file: src/order.ts,
            after: "  customer: { name: string; table: number };\n};\n",
            occurrence: 1,
          }
        text: "\ntype Status = Order[\"status\"];\n//   ^?\n"
        cadence: line-by-line
      - id: expect-status
        type: expect.preview
        at: { afterAction: type-status }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        attribute:
          { name: data-type, value: 'type Status = "pending" | "brewing" | "ready" | "paid"' }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-table
        type: editor.type
        at: { mark: type-table }
        target:
          {
            file: src/order.ts,
            after: "type Status = Order[\"status\"];\n//   ^?\n",
            occurrence: 1,
          }
        text: "type Table = Order[\"customer\"][\"table\"];\n//   ^?\n"
        cadence: line-by-line
      - id: expect-table
        type: expect.preview
        at: { afterAction: type-table }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-2 }
        attribute: { name: data-type, value: "type Table = number" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-union-key
        type: editor.type
        at: { mark: type-union-key }
        target:
          {
            file: src/order.ts,
            after: "type Table = Order[\"customer\"][\"table\"];\n//   ^?\n",
            occurrence: 1,
          }
        text: "type IdOrStatus = Order[\"id\" | \"status\"];\n//   ^?\n"
        cadence: line-by-line
      - id: expect-union-key
        type: expect.preview
        at: { afterAction: type-union-key }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-3 }
        attribute:
          {
            name: data-type,
            value: 'type IdOrStatus = number | "pending" | "brewing" | "ready" | "paid"',
          }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-all-values
        type: editor.type
        at: { mark: type-all-values }
        target:
          {
            file: src/order.ts,
            after: "type IdOrStatus = Order[\"id\" | \"status\"];\n//   ^?\n",
            occurrence: 1,
          }
        text: "type OrderValue = Order[keyof Order];\n//   ^?\n"
        cadence: line-by-line
      - id: expect-all-values
        type: expect.preview
        at: { afterAction: type-all-values }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-4 }
        textContains: "type OrderValue = string | number | {\n    name: string;\n    table: number;\n}"
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: as-const
    chapter: "Enum အစား as const object"
    narration: >
      [[mark:select-sugar-2]] ဖိုင်ရဲ့ အပေါ်က သကြား object ကို ပြန်ကြည့်ရအောင်။ enum လိုပဲ နာမည်
      တစ်ခုစီမှာ တန်ဖိုး တစ်ခုစီ ရှိပါတယ်။ [[mark:type-sugar-level]] ဒီ object ရဲ့ တန်ဖိုး
      အားလုံးကို type အဖြစ် ထုတ်ယူဖို့၊ type of နဲ့ object ရဲ့ type ကို ယူပြီး၊ ကွင်းထဲမှာလည်း key of နဲ့ type of ကို
      တွဲရေးပြီး key အားလုံးကို ပေးပါမယ်။ [[mark:read-string]] ဒါပေမဲ့ Types မှာ string ပဲ ပေါ်ပါတယ်။ object
      ရဲ့ property တွေကို နောက်မှ ပြင်လို့ ရတဲ့အတွက်၊ TypeScript က တန်ဖိုးတွေကို string အဖြစ်
      ချဲ့ပြီး infer လုပ်လို့ပါ။ [[mark:type-as-const]] ဒါကြောင့် lesson ၁၆ မှာ သုံးခဲ့တဲ့ as const
      ကို object ရဲ့ နောက်မှာ ထည့်ပါမယ်။ [[mark:read-levels]] အခု သကြား အဆင့် သုံးမျိုးရဲ့ union
      ဖြစ်သွားပါပြီ။ as const က property တွေကို read only ဖြစ်စေပြီး၊ တန်ဖိုးတွေကို literal type
      အတိုင်း ထားပေးလို့ပါ။ [[mark:open-main-2]] main ဖိုင်မှာ ဒီ type ကို သုံးတဲ့ function တစ်ခု
      ရေးပြီး၊ object ရဲ့ member နဲ့ရော string သက်သက်နဲ့ရော ခေါ်ကြည့်ပါမယ်။
      [[mark:read-note-output]] error မရှိဘဲ Output မှာ နှစ်ခုလုံး ထွက်လာပါပြီ။ ပြီးခဲ့တဲ့ lesson မှာ တွေ့ခဲ့တဲ့
      string enum ဆိုရင်တော့ string သက်သက်ကို လက်မခံခဲ့ပါဘူး။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 10: Deriving Types (as const objects instead of enums)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/deriving-types",
        }
      - {
          title: "TypeScript Handbook: Enums (objects vs enums)",
          url: "https://www.typescriptlang.org/docs/handbook/enums.html#objects-vs-enums",
        }
    actions:
      - id: select-sugar-2
        type: editor.select
        at: { mark: select-sugar-2 }
        target: { file: src/order.ts, text: "export const Sugar = {", occurrence: 1 }
      - id: type-sugar-level
        type: editor.type
        at: { mark: type-sugar-level }
        target: { file: src/order.ts, after: "  Extra: \"extra\",\n};\n", occurrence: 1 }
        text: "export type SugarLevel = (typeof Sugar)[keyof typeof Sugar];\n//          ^?\n"
        cadence: line-by-line
      - id: expect-level-string
        type: expect.preview
        at: { afterAction: type-sugar-level }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        attribute: { name: data-type, value: "type SugarLevel = string" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-as-const
        type: editor.type
        at: { mark: type-as-const }
        target: { file: src/order.ts, after: "  Extra: \"extra\",\n}", occurrence: 1 }
        text: " as const"
        cadence: fast-explainer
      - id: expect-level-union
        type: expect.preview
        at: { afterAction: type-as-const }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        attribute: { name: data-type, value: 'type SugarLevel = "less" | "normal" | "extra"' }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: open-main-2
        type: workspace.openFile
        at: { mark: open-main-2 }
        path: src/main.ts
      - id: import-level
        type: editor.type
        at: { afterAction: open-main-2 }
        target: { file: src/main.ts, after: "import { Sugar", occurrence: 1 }
        text: ", type SugarLevel"
        cadence: fast-explainer
      - id: type-note
        type: editor.type
        at: { afterAction: import-level }
        target: { file: src/main.ts, after: "console.log(\"သကြား\", Sugar.Less);\n", occurrence: 1 }
        text: "\nfunction sugarNote(level: SugarLevel) {\n  return `သကြား ${level}`;\n}\nconsole.log(sugarNote(Sugar.Extra), sugarNote(\"less\"));\n"
        cadence: line-by-line
      - id: expect-note-output
        type: expect.preview
        at: { afterAction: type-note }
        timeoutMs: 8000
        target: { by: testId, value: ts-out-4 }
        textContains: "သကြား extra သကြား less"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-note-clean
        type: expect.preview
        at: { afterAction: expect-note-output }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: select-raw-less
        type: editor.select
        at: { mark: read-note-output }
        target: { file: src/main.ts, text: 'sugarNote("less")', occurrence: 1 }

  - id: enum-vs-object
    narration: >
      [[mark:board-compare]] ဒါဆို enum နဲ့ as const object ကို ယှဉ်ကြည့်ရအောင်။ [[mark:draw-raw]]
      ပထမ အချက်က string သက်သက်ကို ပေးလို့ ရမရပါ။ enum က member ကိုပဲ လက်ခံလို့ ပိုတိကျပြီး၊ as const
      object ကတော့ string ကိုပါ လက်ခံလို့ ပိုအဆင်ပြေပါတယ်။ ဒါပေမဲ့ နောက်မှ တန်ဖိုး ပြောင်းချင်ရင်
      string တွေကို လိုက်ရှာရပါတယ်။ [[mark:draw-import]] ဒုတိယက import ပါ။ enum ကို သုံးတဲ့
      ဖိုင်တိုင်းမှာ import လုပ်ရပေမယ့်၊ object ကိုတော့ string နဲ့ပဲ ပေးမယ်ဆိုရင် import လုပ်စရာ
      မလိုပါဘူး။ [[mark:draw-nominal]] တတိယက တန်ဖိုး တူတဲ့ enum နှစ်ခုပါ။ enum ကို နာမည်နဲ့
      ခွဲခြားလို့၊ တန်ဖိုး တူနေပေမယ့် တစ်ခုရဲ့ နေရာမှာ နောက်တစ်ခုကို ထည့်လို့ မရပါဘူး။ ဒါကို nominal
      လို့ ခေါ်ပါတယ်။ as const object ကတော့ type ပုံစံ တူရင် ရပြီး၊ ဒါကို structural လို့ ခေါ်ပါတယ်။
      [[mark:draw-choice]] ဒီ course မှာ code အသစ်အတွက် as const object ကို သုံးပါမယ်။ အဖွဲ့က enum
      ကို သုံးနေပြီးသား ဆိုရင်တော့ ဆက်သုံးလည်း ရပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 10: Deriving Types (enums vs as const objects)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/deriving-types",
        }
      - {
          title: "Total TypeScript Essentials, ch. 9: TypeScript-only Features (string enums are nominal)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/typescript-only-features",
        }
    actions:
      - id: board-compare
        type: whiteboard.apply
        at: { mark: board-compare }
        open: true
        clear: true
        upsertIds: [b-title, b-h-enum, b-h-obj]
      - id: draw-raw
        type: whiteboard.apply
        at: { mark: draw-raw }
        upsertIds: [b-r1-label, b-r1-enum, b-r1-obj]
        drawMs: 1800
      - id: draw-import
        type: whiteboard.apply
        at: { mark: draw-import }
        upsertIds: [b-r2-label, b-r2-enum, b-r2-obj]
        drawMs: 1800
      - id: draw-nominal
        type: whiteboard.apply
        at: { mark: draw-nominal }
        upsertIds: [b-r3-label, b-r3-enum, b-r3-obj]
        drawMs: 1800
      - id: draw-choice
        type: whiteboard.apply
        at: { mark: draw-choice }
        upsertIds: [b-choice]
        drawMs: 1200

  - id: recap
    narration: >
      [[mark:close-compare]] ဒါဆို ပြန်ချုပ်ရရင်၊ type of က တန်ဖိုးကနေ type ကို ထုတ်ယူပြီး၊ key of က
      object type ရဲ့ key တွေကို union အဖြစ် ထုတ်ပေးပါတယ်။ indexed access ကတော့ property တစ်ခုရဲ့
      type ဒါမှမဟုတ် property အားလုံးရဲ့ type တွေကို ယူပေးပါတယ်။ [[mark:recap-as-const]] ဒီ
      နည်းတွေကို as const object နဲ့ တွဲသုံးရင် enum လို အလုပ်လုပ်တဲ့ type ကို ရပြီး၊ ကူးရေးမယ့်အစား
      ထုတ်ယူထားလို့ မူရင်းကို ပြင်တာနဲ့ အားလုံး လိုက်ပြောင်းပါတယ်။ နောက် lesson မှာတော့ function
      တစ်ခုရဲ့ parameter တွေနဲ့ return type ကနေ type ထုတ်ယူပုံနဲ့၊ union type တွေကို ပြောင်းပေးတဲ့ utility
      type တွေကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 10: Deriving Types",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/deriving-types",
        }
    actions:
      - id: close-compare
        type: whiteboard.apply
        at: { mark: close-compare }
        open: false
      - id: open-order-3
        type: workspace.openFile
        at: { mark: close-compare, offsetMs: 700 }
        path: src/order.ts
      - id: select-recap-level
        type: editor.select
        at: { mark: recap-as-const }
        target:
          {
            file: src/order.ts,
            text: "export type SugarLevel = (typeof Sugar)[keyof typeof Sugar];",
            occurrence: 1,
          }
      - id: expect-file-keyof
        type: expect.file
        at: { afterAction: close-compare }
        path: src/menu.ts
        contains: "type Menu = typeof menu;\n//   ^?\n\n// menu ထဲက ပစ္စည်း နာမည်တွေ\nexport type ItemName = keyof Menu;\n//          ^?\n// export type ItemName = \"tea\" | \"coffee\" | \"mohinga\";"
      - id: expect-file-indexed
        type: expect.file
        at: { afterAction: expect-file-keyof }
        path: src/order.ts
        contains: "type OrderValue = Order[keyof Order];"
      - id: expect-file-as-const
        type: expect.file
        at: { afterAction: expect-file-indexed }
        path: src/order.ts
        contains: "  Extra: \"extra\",\n} as const;"
      - id: expect-file-note
        type: expect.file
        at: { afterAction: expect-file-as-const }
        path: src/main.ts
        contains: 'console.log(sugarNote(Sugar.Extra), sugarNote("less"));'
checks:
  - { type: timing.p95Ms, max: 300 }
