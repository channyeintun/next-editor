build:
  voiceProfile:
    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 9535

runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "in 110000 -> pay 100000 + change 8500 + fee 1500\nbalance ours: 28800 in 3 unspent outputs\n"
      run-2:
        status: success
        exitCode: 0
        output: "in 110000 -> pay 100000 + change 8500 + fee 1500\nbalance ours: 28800 in 3 unspent outputs\ntip: 105\ndep-a 80000: 2 confirmations\ndep-b 50000: 5 confirmations\n"
      run-3:
        status: success
        exitCode: 0
        output: "in 110000 -> pay 100000 + change 8500 + fee 1500\nbalance ours: 28800 in 3 unspent outputs\ntip: 105\ndep-a 80000: 2 confirmations\ndep-b 50000: 5 confirmations\nreorg from block 104, new tip: 106\nK=1 credited [dep-a dep-b] -> dep-a 80000 not on chain\nK=3 credited [dep-b] -> all on chain\n"

scenes:
  - id: hook
    chapter: Key ကိုင်ထားသူက ငွေကို ရွှေ့နိုင်တယ်
    narration: >-
      [[mark:show-keys]] ledger ထဲက row တစ်ခု မှားရင် correction entry နဲ့ ပြင်လို့ ရပါတယ်။ chain ပေါ်ကို
      ပို့လိုက်တဲ့ ငွေကတော့ chain က confirm လုပ်ပြီးတာနဲ့ ပြန်ယူလို့ မရတော့ပါဘူး။ [[mark:pt-priv]] ပို့ခွင့်ကို
      ဆုံးဖြတ်တာက private key ပါ၊ spend လုပ်တိုင်း sign လုပ်ဖို့ လိုတဲ့ လျှို့ဝှက်ချက်ပါ။ [[mark:pt-addr]] အဲဒီကနေ
      public key ကို၊ public key ကနေ ငွေလက်ခံမယ့် address ကို တွက်ထုတ်ပါတယ်။ [[mark:keys-2]] seed phrase က key အားလုံးကို ပြန်ဆောက်နိုင်တဲ့ backup
      ဖြစ်လို့ seed phrase ရတဲ့သူဟာ ငွေရတဲ့သူပါပဲ။ [[mark:pt-cust]] custody ဆိုတာ key ကို ဘယ်သူ ထိန်းထားလဲ ဆိုတဲ့
      မေးခွန်းပါ။ user ကိုယ်တိုင် ထိန်းရင် self-custody၊ platform က ထိန်းရင် custodial ပါ။ custodial platform မှာ user ရဲ့ balance က liability ဖြစ်ပြီး၊ အဲဒါကို ကာမိရမယ့် asset က ကိုယ့် key တွေနဲ့ ထိန်းထားတဲ့ ငွေပါ။ [[mark:keys-3]] key တွေကို နေရာ ခွဲထားရတာ ဒါကြောင့်ပါ။ hot wallet က online မှာ ရှိလို့
      withdrawal ကို ချက်ချင်း sign လုပ်နိုင်ပေမဲ့ attack ခံရနိုင်ပါတယ်။ cold wallet က offline ဖြစ်လို့ ပိုလုံခြုံပေမဲ့
      သုံးဖို့ အချိန်ယူရပါတယ်။ [[mark:pt-multi]] multisig နဲ့ MPC ကတော့ key တစ်ခုတည်း၊ device တစ်ခုတည်းနဲ့ ငွေ
      မရွှေ့နိုင်အောင် key အများ ဒါမှမဟုတ် key အပိုင်းအစ အများ လိုအောင် လုပ်ထားတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Custody & crypto (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#custody-crypto",
        }
      - {
          title: "Fintech Engineering Handbook — Flow 1: A crypto withdrawal (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#flow-1-a-crypto-withdrawal",
        }
    actions:
      - {
          id: show-keys,
          type: slide.show,
          at: { mark: show-keys, offsetMs: -700 },
          slideId: keys-1,
        }
      - { id: pt-priv, type: slide.point, at: { mark: pt-priv }, target: { x: 0.175, y: 0.426 } }
      - { id: pt-addr, type: slide.point, at: { mark: pt-addr }, target: { x: 0.825, y: 0.426 } }
      - { id: keys-2, type: slide.show, at: { mark: keys-2 }, slideId: keys-2 }
      - {
          id: pt-seed,
          type: slide.point,
          at: { afterAction: keys-2 },
          target: { x: 0.175, y: 0.648 },
        }
      - { id: pt-cust, type: slide.point, at: { mark: pt-cust }, target: { x: 0.825, y: 0.648 } }
      - { id: keys-3, type: slide.show, at: { mark: keys-3 }, slideId: keys-3 }
      - {
          id: pt-hot,
          type: slide.point,
          at: { afterAction: keys-3 },
          target: { x: 0.175, y: 0.898 },
        }
      - { id: pt-multi, type: slide.point, at: { mark: pt-multi }, target: { x: 0.825, y: 0.898 } }

  - id: utxo
    chapter: Balance field မရှိတဲ့ chain
    narration: >-
      [[mark:close-keys]] ဘာကို ရွှေ့တာလဲ ဆိုတာကတော့ chain ရဲ့
      accounting model ပေါ် မူတည်ပါတယ်။ [[mark:open-utxo]] Bitcoin စတိုင် UTXO model ကို အရင် ကြည့်ရအောင်။
      [[mark:sel-unspent]] ဒီ model မှာ balance ဆိုတဲ့ field ဘယ်နေရာမှာမှ မရှိပါဘူး။ chain မှာ ရှိတာက မသုံးရသေးတဲ့
      output တွေပဲ ဖြစ်ပြီး၊ output တစ်ခုစီက address တစ်ခုကို ချိတ်ထားတဲ့ ငွေပမာဏ တစ်ခုပါ။ [[mark:sel-whole]] output
      ကို အပိုင်းလိုက် သုံးလို့ မရဘဲ တစ်ခုလုံး သုံးရပါတယ်၊ ဒီ program မှာ output အသစ်တွေ မယူသွားတဲ့ ငွေက fee
      ဖြစ်ပါတယ်။ [[mark:open-main]] main က ခုနစ်သောင်းနဲ့ လေးသောင်း output နှစ်ခုကို သုံးပြီး merchant ကို တစ်သိန်း
      ပေးပါတယ်။ [[mark:sel-change]] ရှစ်ထောင့်ငါးရာကို change အဖြစ် ကိုယ့်ဆီ ပြန်ပို့ပါတယ်။ fee ကို ဘယ်နေရာမှာမှ မရေးထားပါဘူး။ [[mark:run-1]] run လိုက်ရအောင်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Custody & crypto: UTXO vs account model (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#custody-crypto",
        }
    actions:
      - { id: close-keys, type: slide.close, at: { mark: close-keys } }
      - { id: open-utxo, type: workspace.openFile, at: { mark: open-utxo }, path: utxo.go }
      - id: sel-unspent
        type: editor.select
        at: { mark: sel-unspent }
        target: { file: utxo.go, text: "var unspent = []Output{", occurrence: 1 }
      - id: sel-whole
        type: editor.select
        at: { mark: sel-whole }
        target: { file: utxo.go, text: "return in, in - out, nil", occurrence: 1 }
      - { id: open-main, type: workspace.openFile, at: { mark: open-main }, path: main.go }
      - id: sel-change
        type: editor.select
        at: { mark: sel-change }
        target: { file: main.go, text: '{"b2", "ours", 8_500}, // change', occurrence: 1 }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "fee 1500",
          timeoutMs: 8000,
        }

  - id: read-1
    narration: >-
      [[mark:pt-fee]] output နှစ်ခုက တစ်သိန်း ရှစ်ထောင့်ငါးရာပဲ ယူလို့ ကျန်တဲ့ တစ်ထောင့်ငါးရာက fee ဖြစ်သွားပါတယ်။
      change ကို ထည့်ဖို့ မေ့ခဲ့ရင် ရှစ်ထောင့်ငါးရာပါ fee ထဲ ပါသွားပြီး error တစ်ခုမှ မတက်ပါဘူး။ [[mark:pt-bal]]
      balance ကတော့ ကိုယ့် address က unspent output သုံးခုကို ပေါင်းမှ ရတဲ့ derived တန်ဖိုးပါ။ [[mark:dock-1]]
      ledger ဘက်မှာ သတိထားရမှာက change ပါ။ ကိုယ့် address ဆီ ဝင်လာသမျှကို user deposit လို့ credit လုပ်တဲ့
      scanner က change ကိုပါ ငွေအသစ်လို့ မှတ်ပြီး မရှိတဲ့ ငွေကို ဖန်တီးလိုက်ပါလိမ့်မယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Custody & crypto (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#custody-crypto",
        }
    actions:
      - id: pt-fee
        type: console.point
        at: { mark: pt-fee }
        target: { text: "fee 1500", occurrence: 1 }
      - id: pt-bal
        type: console.point
        at: { mark: pt-bal }
        target: { text: "balance ours: 28800", occurrence: 1 }
      - { id: dock-1, type: runtime.collapseDock, at: { mark: dock-1 } }

  - id: models
    chapter: UTXO နဲ့ account model
    narration: >-
      [[mark:show-models]] တူညီတဲ့ payment ကို model နှစ်ခုနဲ့ ယှဉ်ကြည့်ရအောင်။ [[mark:pt-tx]] UTXO ဘက်မှာ ခုနက payment ပါ၊ coin နှစ်ခု ဝင်ပြီး နှစ်ခု ထွက်ပါတယ်။ [[mark:models-2]] Ethereum စတိုင်
      account model မှာတော့ address တစ်ခုချင်းမှာ running balance ရှိပြီး payment က တစ်ဖက်ကို နုတ်၊ တစ်ဖက်ကို
      ပေါင်းတာပါ။ change မရှိဘဲ gas လို့ ခေါ်တဲ့ fee ကလည်း balance ထဲကပဲ ထွက်ပါတယ်။ [[mark:pt-acct]] ဒါကြောင့် UTXO chain မှာ ကိုယ်ပိုင် output တစ်ခုချင်းကို ခြေရာခံရပြီး၊ account chain မှာ address balance ကို
      တိုက်ရပါတယ်။ [[mark:models-3]] coin ဆိုတာ BTC၊ ETH လို chain ရဲ့ ကိုယ်ပိုင်
      asset ဖြစ်ပြီး၊ token က chain ပေါ်မှာ ထပ်ထုတ်ထားတဲ့ ERC-20 လို asset ပါ။ ledger မှာ နှစ်ခုကို မရောဘဲ currency
      တစ်ခုစီလို ထားရပါတယ်။ [[mark:pt-dust]] dust ဆိုတာ ရွှေ့ဖို့ fee က တန်ဖိုးထက် များနေတဲ့ ပမာဏပါ၊ ခုနက သုံးရာပဲ
      ရှိတဲ့ output လိုမျိုး balance ထဲ ပါပေမဲ့ ရွှေ့ရင် အရှုံးပေါ်တဲ့ ငွေပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Custody & crypto (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#custody-crypto",
        }
    actions:
      - {
          id: show-models,
          type: slide.show,
          at: { mark: show-models, offsetMs: -700 },
          slideId: models-1,
        }
      - { id: pt-tx, type: slide.point, at: { mark: pt-tx }, target: { x: 0.284, y: 0.576 } }
      - { id: models-2, type: slide.show, at: { mark: models-2 }, slideId: models-2 }
      - {
          id: pt-ha,
          type: slide.point,
          at: { afterAction: models-2 },
          target: { x: 0.619, y: 0.276 },
        }
      - { id: pt-acct, type: slide.point, at: { mark: pt-acct }, target: { x: 0.763, y: 0.584 } }
      - { id: pt-tok, type: slide.point, at: { mark: models-3 }, target: { x: 0.209, y: 0.864 } }
      - { id: pt-dust, type: slide.point, at: { mark: pt-dust }, target: { x: 0.597, y: 0.864 } }

  - id: confirm
    chapter: Confirmation ကို ရေတွက်ခြင်း
    narration: >-
      [[mark:close-models]] ဒီတစ်ခါ ငွေဝင်တဲ့ဘက်ကို ကြည့်ရအောင်။ user ပို့လိုက်တဲ့ transaction က ပထမ mempool ထဲမှာ
      စောင့်ပါတယ်၊ mempool ဆိုတာ block ထဲ မဝင်ရသေးတဲ့ transaction တွေ စုနေတဲ့ နေရာပါ။ network fee က block ထဲ
      ရောက်ဖို့ ပေးရတဲ့ ငွေပါ။ [[mark:open-chain]] deposit နှစ်ခု ရောက်နေတဲ့ chain ကို ကြည့်ရအောင်။
      [[mark:sel-chain]] block ခြောက်ခု ရှိပြီး deposit နှစ်ခုက block မတူတာတွေထဲမှာ ပါပါတယ်။ [[mark:sel-conf]]
      transaction ပါတဲ့ block အပေါ်မှာ block တစ်ခု ဆင့်တိုင်း confirmation တစ်ခု တိုးပါတယ်။ ဒီ function က အဲဒီ
      block ကိုယ်တိုင်ကနေ tip လို့ ခေါ်တဲ့ နောက်ဆုံး block အထိ ရေတွက်လို့ block ထဲ ဝင်တာနဲ့ တစ်ခု ရပါတယ်။ [[mark:open-main2]] main ထဲမှာ deposit
      တစ်ခုချင်းရဲ့ confirmation ကို ထုတ်ကြည့်ပါမယ်။ [[mark:type-conf]] ပိုစောတဲ့ block ထဲမှာ ပါတဲ့ deposit က
      confirmation ပိုများရပါမယ်။ ဘယ် block ထဲမှာမှ မရှိတဲ့ transaction ဆိုရင်တော့ သုည ရပါမယ်။ [[mark:run-2]] run
      လိုက်ရအောင်။ [[mark:pt-a]] block ၁၀၄ ထဲက dep-a မှာ confirmation နှစ်ခု ရှိပါတယ်။ [[mark:pt-b]] block ၁၀၁
      ထဲက dep-b မှာတော့ ငါးခု ရှိပါတယ်။ [[mark:dock-2]] မေးခွန်းက ဘယ်နှခု ရှိမှ user ရဲ့ balance ထဲ credit
      လုပ်မလဲ ဆိုတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Custody & crypto: confirmation, finality, mempool (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#custody-crypto",
        }
      - { title: "Bitcoin Wiki — Confirmation", url: "https://en.bitcoin.it/wiki/Confirmation" }
    actions:
      - { id: close-models, type: slide.close, at: { mark: close-models } }
      - { id: open-chain, type: workspace.openFile, at: { mark: open-chain }, path: chain.go }
      - id: sel-chain
        type: editor.select
        at: { mark: sel-chain }
        target: { file: chain.go, text: "var chain = []Block{", occurrence: 1 }
      - id: sel-conf
        type: editor.select
        at: { mark: sel-conf }
        target: { file: chain.go, text: "return tip() - b.Height + 1", occurrence: 1 }
      - { id: open-main2, type: workspace.openFile, at: { mark: open-main2 }, path: main.go }
      - id: type-conf
        type: editor.type
        at: { mark: type-conf }
        target:
          {
            file: main.go,
            after: "\tfmt.Printf(\"balance ours: %d in %d unspent outputs\\n\", total, n)\n",
            occurrence: 1,
          }
        text: "\n\tfmt.Println(\"tip:\", tip())\n\tfor _, d := range deposits {\n\t\tfmt.Printf(\"%s %d: %d confirmations\\n\", d.ID, d.Amount, confirmations(d.ID))\n\t}\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "dep-b 50000: 5 confirmations",
          timeoutMs: 8000,
        }
      - id: pt-a
        type: console.point
        at: { mark: pt-a }
        target: { text: "dep-a 80000: 2 confirmations", occurrence: 1 }
      - id: pt-b
        type: console.point
        at: { mark: pt-b }
        target: { text: "dep-b 50000: 5 confirmations", occurrence: 1 }
      - { id: dock-2, type: runtime.collapseDock, at: { mark: dock-2 } }

  - id: reorg
    chapter: Reorg နဲ့ finality
    narration: >-
      [[mark:show-reorg]] chain ရဲ့ လက်ရှိ အခြေအနေက ဒါပါ။ [[mark:reorg-2]] dep-b ကနေ tip အထိ block ငါးခု၊ dep-a
      အတွက် နှစ်ခု ရှိပါတယ်။ [[mark:reorg-3]] ဒါပေမဲ့ node မြင်နေတဲ့ chain က နောက်ဆုံး မဟုတ်သေးပါဘူး။ block ၁၀၃
      ကနေ ခွဲထွက်တဲ့ ပြိုင်ဘက် branch က အနိုင်ရသွားရင် chain ကို ပြန်စီပါတယ်၊ ဒါကို reorg လို့ ခေါ်ပါတယ်။
      [[mark:reorg-4]] block ၁၀၄ နဲ့ ၁၀၅ ပျောက်သွားပြီး dep-a က branch အသစ်ထဲမှာ မပါပါဘူး။ mempool ထဲ ပြန်ရောက်ပြီး
      နောက်မှ ဝင်ချင် ဝင်မယ်၊ လုံးဝ မဝင်တော့တာလည်း ဖြစ်နိုင်ပါတယ်။ finality ဆိုတာ ပြန်မပြောင်းနိုင်တော့တဲ့ အချိန်ဖြစ်ပြီး၊
      confirmation များလေ finality ပိုရလေပါ။ [[mark:reorg-5]] ဒါ သီအိုရီ မဟုတ်ပါဘူး။ ၂၀၁၉ ဇန်နဝါရီမှာ Coinbase က Ethereum Classic ပေါ်မှာ coin
      တစ်ခုကို နှစ်ခါ သုံးတဲ့ double spend ပါတဲ့ reorg တွေကို တွေ့ခဲ့ပါတယ်။ [[mark:pt-etc]] ၂၀၂၀ ဩဂုတ်လမှာတော့
      block ခုနစ်ထောင်ကျော် နက်တဲ့ reorg အထိ ဖြစ်ခဲ့ပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Custody & crypto: reorg, finality (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#custody-crypto",
        }
      - {
          title: "Coinbase — Deep Chain Reorganization Detected on Ethereum Classic (ETC), January 2019",
          url: "https://medium.com/the-coinbase-blog/ethereum-classic-etc-is-currently-being-51-attacked-33be13ce32de",
        }
      - {
          title: "The Block — Ethereum Classic was hit with another 51% attack, for the third time in a month (Aug 2020)",
          url: "https://www.theblock.co/news/ecosystems/2020-08-31-ethereum-classic-etc-third-51-attack-76431",
        }
    actions:
      - {
          id: show-reorg,
          type: slide.show,
          at: { mark: show-reorg, offsetMs: -700 },
          slideId: reorg-1,
        }
      - {
          id: pt-chain,
          type: slide.point,
          at: { afterAction: show-reorg },
          target: { x: 0.506, y: 0.564 },
        }
      - { id: reorg-2, type: slide.show, at: { mark: reorg-2 }, slideId: reorg-2 }
      - {
          id: pt-cb,
          type: slide.point,
          at: { afterAction: reorg-2 },
          target: { x: 0.506, y: 0.66 },
        }
      - { id: reorg-3, type: slide.show, at: { mark: reorg-3 }, slideId: reorg-3 }
      - {
          id: pt-fork,
          type: slide.point,
          at: { afterAction: reorg-3 },
          target: { x: 0.9, y: 0.359 },
        }
      - { id: reorg-4, type: slide.show, at: { mark: reorg-4 }, slideId: reorg-4 }
      - {
          id: pt-pool,
          type: slide.point,
          at: { afterAction: reorg-4 },
          target: { x: 0.222, y: 0.842 },
        }
      - { id: reorg-5, type: slide.show, at: { mark: reorg-5 }, slideId: reorg-5 }
      - { id: pt-etc, type: slide.point, at: { mark: pt-etc }, target: { x: 0.36, y: 0.942 } }

  - id: credit
    chapter: K confirmations စောင့်ခြင်း
    narration: >-
      [[mark:close-reorg]] ဒီ reorg ကို code နဲ့ ဖြစ်ကြည့်ရအောင်။ [[mark:type-k]] reorg မတိုင်ခင် credit rule နှစ်ခုကို
      run ပါမယ်။ တစ်ခုက confirmation တစ်ခုနဲ့တင် credit လုပ်ပြီး၊ နောက်တစ်ခုက K ခု စောင့်ပါတယ်၊ K က သုံးပါ။ ပြီးရင်
      block ၁၀၄ ကနေ reorg လုပ်ပြီး credit လုပ်ထားတာတွေ chain ပေါ်မှာ ရှိသေးလား စစ်ပါမယ်။ ဘယ် rule က ပြဿနာ
      ဖြစ်မလဲ ခန့်မှန်းကြည့်ပါ။ [[mark:run-3]] run လိုက်ရအောင်။ [[mark:pt-k1]] confirmation တစ်ခုနဲ့ credit လုပ်တဲ့ rule က deposit နှစ်ခုလုံးကို credit လုပ်ခဲ့ပြီး dep-a
      ရှစ်သောင်းက chain ပေါ်မှာ မရှိတော့ပါဘူး။ ledger ထဲမှာပဲ ရှိတဲ့ ဒီငွေကို user က ထုတ်သွားရင် platform ရဲ့ အရှုံးပါ။ [[mark:pt-k3]] K သုံးခု စောင့်တဲ့ rule ကတော့ dep-b ကိုပဲ credit လုပ်ခဲ့လို့ ဘာမှ မပျက်ပါဘူး၊ ဒီ reorg က block
      နှစ်ခုပဲ နက်လို့ပါ။ [[mark:dock-3]] စောင့်တာမှာ ကုန်ကျစရိတ် ရှိပါတယ်။ Bitcoin block က ပျမ်းမျှ
      ဆယ်မိနစ် တစ်ခါ ထွက်ပြီး၊ ပမာဏကြီးရင် confirmation ခြောက်ခုကို အနည်းဆုံးလို့ Bitcoin ရဲ့ လမ်းညွှန်က
      ဆိုထားလို့ ပျမ်းမျှ တစ်နာရီလောက် စောင့်ရပါတယ်။ [[mark:wait-eth]] proof-of-stake Ethereum မှာတော့ block
      တစ်ခု finalize ဖြစ်ဖို့ ဆယ့်ငါးမိနစ်လောက် ကြာပါတယ်။ [[mark:sel-k]] ခြောက်ခု ဆိုတာ protocol စည်းမျဉ်း မဟုတ်ပါဘူး။ K က
      user စောင့်ရတဲ့ အချိန်နဲ့ reorg risk ကို ချိန်ပြီး chain နဲ့ ပမာဏ အလိုက် ကိုယ်တိုင် ရွေးရတဲ့ risk
      ဆုံးဖြတ်ချက်ပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Flow 1: wait for finality, then post (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#flow-1-a-crypto-withdrawal",
        }
      - {
          title: "bitcoin.org — Some things you need to know (confirmations)",
          url: "https://bitcoin.org/en/you-need-to-know",
        }
      - {
          title: "ethereum.org — Single slot finality",
          url: "https://ethereum.org/roadmap/single-slot-finality/",
        }
    actions:
      - { id: close-reorg, type: slide.close, at: { mark: close-reorg } }
      - id: type-k
        type: editor.type
        at: { mark: type-k }
        target: { file: main.go, after: "confirmations(d.ID))\n\t}\n", occurrence: 1 }
        text: "\n\tconst K = 3\n\tearly, patient := credit(1), credit(K)\n\treorg(104, 3)\n\tfmt.Println(\"reorg from block 104, new tip:\", tip())\n\tfmt.Println(\"K=1 credited\", early, \"->\", offChain(early))\n\tfmt.Printf(\"K=%d credited %v -> %s\\n\", K, patient, offChain(patient))\n"
        cadence: line-by-line
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "dep-a 80000 not on chain",
          timeoutMs: 8000,
        }
      - id: pt-k1
        type: console.point
        at: { mark: pt-k1 }
        target: { text: "K=1 credited", occurrence: 1 }
      - id: pt-k3
        type: console.point
        at: { mark: pt-k3 }
        target: { text: "K=3 credited", occurrence: 1 }
      - id: sel-k
        type: editor.select
        at: { mark: sel-k }
        target: { file: main.go, text: "const K = 3", occurrence: 1 }
      - {
          id: expect-file-k,
          type: expect.file,
          at: { afterAction: run-3 },
          path: main.go,
          contains: "early, patient := credit(1), credit(K)",
        }

  - id: sign
    chapter: Multisig က magic မဟုတ်ဘူး
    narration: >-
      [[mark:show-sign]] ငွေထွက်တဲ့ဘက်မှာလည်း multisig ကို အလိုလို မယုံရပါဘူး။ [[mark:pt-ronin]] ၂၀၂၂ မတ်လမှာ attacker တွေက Ronin bridge ရဲ့ validator key ကိုးခုထဲက ငါးခုကို
      ထိန်းချုပ်ပြီး၊ ETH နဲ့ USDC ဒေါ်လာ သန်း ခြောက်ရာလောက်ကို ထုတ်ယူသွားခဲ့ပါတယ်။ [[mark:pt-rsub]] အဲဒီ ငါးခုထဲက လေးခုကို Sky
      Mavis တစ်ခုတည်းက run ထားပါတယ်။ key တွေ တစ်နေရာတည်းမှာ စုနေရင် threshold က နာမည်သက်သက်ပါ။
      [[mark:sign-2]] lesson ၂၇ က Bybit ရဲ့ multisig cold wallet ကိုလည်း ပြန်စဉ်းစားကြည့်ပါ၊ ဒေါ်လာ ဘီလီယံ
      တစ်ဒသမ ငါး လောက် ခိုးခံခဲ့ရတာပါ။ [[mark:pt-bsub]] key တွေ ဘယ်လောက်ပဲ ခွဲထားထား၊ signer တွေက ဖုံးကွယ်ထားတဲ့
      interface ပြတာကိုပဲ sign လုပ်ခဲ့ကြတာပါ။ [[mark:sign-3]] ဒါကြောင့် key တွေကို လူနဲ့ system မတူတာတွေဆီ
      ခွဲထားရပါတယ်။ sign လုပ်မယ့် transaction ကို နောက်ထပ် device တစ်ခုမှာ decode လုပ်ပြီး စစ်ရပါတယ်။ [[mark:pt-allow]]
      withdrawal ကိုလည်း ကြိုတင် အတည်ပြုထားတဲ့ address တွေဆီပဲ ခွင့်ပြုတဲ့ allow-list နဲ့ ကန့်သတ်ထားရပါတယ်။
