  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] Crypto platform interview တွေမှာ deposit ကို balance ထဲ ဘယ်အချိန်မှာ credit လုပ်မလဲ လို့
      မေးလေ့ရှိပါတယ်။ confirmation ခြောက်ခု လို့ ဂဏန်းတစ်ခုတည်း ဖြေရင် မလုံလောက်ပါဘူး။ [[mark:iv-a]] ပထမ၊ မြင်ရတာနဲ့
      final ဖြစ်တာ မတူပါဘူး၊ reorg က မကြာသေးတဲ့ block တွေကို ဖျက်နိုင်ပါတယ်။ [[mark:iv-b]] ဒုတိယ၊ K ကို chain နဲ့
      ပမာဏ အလိုက် ရွေးပြီး user စောင့်ရတဲ့ အချိန်နဲ့ risk ကို ချိန်ပါတယ်။ [[mark:iv-c]] တတိယ၊ ကိုယ့် address ဆီ
      ဝင်တာ တိုင်း deposit မဟုတ်ပါဘူး၊ change နဲ့ ကိုယ့် wallet အချင်းချင်း ရွှေ့တာကို ခွဲထုတ်ရပါတယ်။ [[mark:iv-d]]
      ပြီးရင် ကိုယ် ဘာလုပ်မလဲ ပြောပါ။ deposit ကို pending အဖြစ် ချက်ချင်း ပြပြီး K ရောက်မှ credit လုပ်မယ်၊ ပြီးမှ
      reorg ဖြစ်ရင် linked reversal entry နဲ့ ပြင်ပြီး alert ပေးမယ်၊ node နဲ့ ledger ကို နေ့တိုင်း reconcile လုပ်မယ်
      ဆိုတာပါ။
