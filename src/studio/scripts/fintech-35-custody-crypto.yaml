  - id: try-it
    chapter: ကိုယ်တိုင် စမ်းကြည့်ပါ
    narration: >-
      [[mark:close-iv]] ကိုယ်တိုင် စမ်းကြည့်ဖို့ တစ်ခု ရှိပါတယ်။ [[mark:sel-try]] K ကို နှစ် လို့ ပြောင်းပြီး run ကြည့်ပါ။
      dep-a ပါ credit ဖြစ်သွားပြီး reorg နောက်မှာ chain ပေါ်မှာ မရှိတော့ပါဘူး။  [[mark:recap]] ပြန်ချုပ်ရရင်၊ crypto မှာ ငွေကို
      ပိုင်တာက key ကို ထိန်းထားတာဖြစ်ပြီး၊ chain ပေါ်က deposit က လုံလောက်အောင် final ဖြစ်မှသာ ledger ထဲက ငွေ
      ဖြစ်ပါတယ်။ နောက် lesson မှာတော့ ငွေ ဘယ်သူ့ဆီက လာပြီး ဘယ်သူ့ဆီ သွားလဲ ဆိုတာကို platform က သိထားရမယ့်
      compliance နဲ့၊ အဲဒီအတွက် engineer တွေ ဘာ ဆောက်ရလဲ ဆိုတာကို ကြည့်ပါမယ်။
    sources:
