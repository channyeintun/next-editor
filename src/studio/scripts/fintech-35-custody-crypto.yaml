      chain.go: |
        package main

        import (
        	"fmt"
        	"strings"
        )

        // Block is one block: its height and the transactions it holds.
        type Block struct {
        	Height int
        	Txs    []string
        }

        // chain is the node's current view, oldest block first.
        var chain = []Block{
        	{100, nil},
        	{101, []string{"dep-b"}},
        	{102, nil},
        	{103, nil},
        	{104, []string{"dep-a"}},
        	{105, nil},
        }

        // deposits to one of our addresses, as the node reported them when they appeared.
        var deposits = []struct {
        	ID     string
        	Amount int64
        }{{"dep-a", 80_000}, {"dep-b", 50_000}}

        func tip() int { return chain[len(chain)-1].Height }

        // confirmations counts the blocks from the one holding tx up to the tip; 0 if no block holds it.
        func confirmations(tx string) int {
        	for _, b := range chain {
        		for _, t := range b.Txs {
        			if t == tx {
        				return tip() - b.Height + 1
        			}
        		}
        	}
        	return 0
        }

        // reorg drops every block from height on and puts a longer competing branch of n blocks there.
        func reorg(height, n int) {
        	chain = chain[:height-chain[0].Height]
        	for i := range n {
        		chain = append(chain, Block{Height: height + i})
        	}
        }

        // credit lists the deposits a rule of k confirmations would credit right now.
        func credit(k int) []string {
        	var ids []string
        	for _, d := range deposits {
        		if confirmations(d.ID) >= k {
        			ids = append(ids, d.ID)
        		}
        	}
        	return ids
        }

        // offChain says which credited deposits no block holds any more.
        func offChain(ids []string) string {
        	if len(ids) == 0 {
        		return "nothing credited yet"
        	}
        	var gone []string
        	for _, d := range deposits {
        		for _, id := range ids {
        			if id == d.ID && confirmations(id) == 0 {
        				gone = append(gone, fmt.Sprintf("%s %d not on chain", d.ID, d.Amount))
        			}
        		}
        	}
        	if len(gone) == 0 {
        		return "all on chain"
        	}
        	return strings.Join(gone, ", ")
        }
      main.go: |
        package main

        import "fmt"

        func main() {
        	in, fee, err := spend([]string{"a1", "a2"}, []Output{
        		{"b1", "merchant", 100_000},
        		{"b2", "ours", 8_500}, // change
        	})
        	if err != nil {
        		fmt.Println(err)
        		return
        	}
        	fmt.Printf("in %d -> pay 100000 + change 8500 + fee %d\n", in, fee)
        	total, n := balance("ours")
        	fmt.Printf("balance ours: %d in %d unspent outputs\n", total, n)
        }
      utxo.go: |
        package main

        import (
        	"fmt"
        	"slices"
        )

        // Output is one coin on a UTXO chain: an amount locked to an address.
        // It is spent whole or not at all. Amounts are integers in the chain's smallest unit.
        type Output struct {
        	ID      string
        	Address string
        	Amount  int64
        }

        // unspent is the whole state of the chain. There is no balance field anywhere.
        var unspent = []Output{
        	{"a1", "ours", 70_000},
        	{"a2", "ours", 40_000},
        	{"a3", "ours", 20_000},
        	{"a4", "ours", 300},
        }

        // spend consumes the inputs whole and creates the outputs.
        // Whatever the outputs do not claim is the network fee.
        func spend(inputs []string, outputs []Output) (in, fee int64, err error) {
        	var out int64
        	var kept []Output
        	for _, o := range unspent {
        		if slices.Contains(inputs, o.ID) {
        			in += o.Amount
        		} else {
        			kept = append(kept, o)
        		}
        	}
        	for _, o := range outputs {
        		out += o.Amount
        	}
        	if out > in {
        		return 0, 0, fmt.Errorf("outputs %d exceed inputs %d", out, in)
        	}
        	unspent = append(kept, outputs...)
        	return in, in - out, nil
        }

        // balance is derived: the sum of the unspent outputs an address can spend.
        func balance(address string) (total int64, n int) {
        	for _, o := range unspent {
        		if o.Address == address {
        			total += o.Amount
        			n++
        		}
        	}
        	return total, n
        }
