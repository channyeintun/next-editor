# CSS course (Burmese), lesson 4 of 43: complex selectors (combinators,
# compound selectors, pseudo-classes by state and by position, :has()).
#
# Narration is an ENGLISH DRAFT for the Burmese writer (DESIGN.md next to this
# file is the span-by-span brief). Every [[mark:…]] sits where its action
# begins, at a sentence end; each span carries one piece of meaning tied to
# what is on screen. Everything the learner sees (title, chapters, whiteboard
# labels, the tea-shop UI) is already Burmese.
#
# Shape: board (recall lesson 3, the family tree of a menu card) while the dev
# server installs → board (the four combinators) → descendant: header links
# turn cream → child: only the card's own description slants, the nested
# pairing note does not → next sibling: the owl adds gaps only between cards
# → board (pseudo-class vs pseudo-element) → subsequent sibling + :checked: a
# CSS-only "iced only" switch, clicked on and off → compound vs descendant
# (featured card outline, every badge's text) → :first-child / :last-child →
# :first-child fails and :first-of-type works in the about section → nth-child
# stripes and the An+B board → :empty hides the stray note → :has() gives the
# two cards with a badge a green border, then the :has() board → recap,
# hand-off to the cascade (lesson 5).
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set(; no postcss config. Every rule is
# appended at the end of the file, so an unfinished selector, string or
# bracket never swallows a later rule. Colour keywords typed keystroke by
# keystroke (cornsilk, gold, khaki, wheat, seagreen) have no valid shorter
# prefix. index.html is never edited, so the preview never reloads and the
# checkbox state survives every CSS edit.
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
