      base.css: |
        /*
          base.css: pinned, never typed during a lesson.
          The shop's palette and the page furniture, so the CSS a lesson types
          can focus on one idea. Lesson 4 keeps A, B, B2 and the parts of C its
          page uses.
        */

        /* == A. palette == */
        :root {
          color-scheme: light;
          --tea-dark: #3b2314;
          --tea: #8b5a2b;
          --tea-light: #c9a27e;
          --cream: #fff8ec;
          --paper: #fdf3e1;
          --leaf: #2f6b3a;
          --gold: #c9a227;
          --chili: #b23a2b;
          --ink: #2b1d14;
          --muted: #6b5a4c;
          --line: #e6d5bf;
          --radius: 12px;
        }

        /* == B. page == */
        body {
          margin: 0;
          font-family: "Noto Sans Myanmar", "Myanmar Sangam MN", "Myanmar MN", "Myanmar Text", "Padauk",
            system-ui, sans-serif;
          font-size: 16px;
          line-height: 1.8;
          color: var(--ink);
          background: var(--paper);
        }

        .page {
          padding: 0 16px 24px;
        }

        h1,
        h2,
        h3 {
          margin: 0 0 8px;
          line-height: 1.5;
        }

        h1 {
          font-size: 24px;
        }

        h2 {
          font-size: 20px;
        }

        h3 {
          font-size: 17px;
        }

        a {
          color: var(--tea);
        }

        /* Status lines that only expect.preview reads (kit.js data-report, data-say). */
        .visually-hidden {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip-path: inset(50%);
          white-space: nowrap;
        }

        /* == B2. reset == */
        *,
        *::before,
        *::after {
          box-sizing: border-box;
        }

        /* == C. furniture (the parts this page uses) == */
        .site-header {
          padding: 16px;
          background: var(--tea-dark);
          color: var(--cream);
        }

        .logo {
          display: block;
        }

        .tagline {
          margin: 0;
          color: var(--tea-light);
          font-size: 14px;
        }

        .nav ul {
          margin: 8px 0 0;
          padding: 0;
          list-style: none;
        }

        .menu {
          margin: 0;
          padding: 0;
          list-style: none;
        }

        .menu-card {
          margin: 0;
          padding: 12px 16px;
          background: #fff;
          border: 1px solid var(--line);
          border-radius: var(--radius);
        }

        .menu-card .name,
        .menu-card .desc {
          margin: 0;
        }

        .menu-card .desc {
          color: var(--muted);
          font-size: 14px;
        }

        .price {
          font-weight: 700;
          color: var(--tea);
        }

        .badge {
          padding: 0 8px;
          border-radius: 999px;
          background: var(--leaf);
          color: #fff;
          font-size: 13px;
        }

        /* == E. lesson rules == */
        /* Lesson 4: the nav links in one row, so the header stays short. */
        .nav ul {
          display: flex;
          gap: 16px;
        }

        /* Lesson 4: the pairing note nested one level deeper in the first card. */
        .pairing {
          padding-left: 8px;
          border-left: 3px solid var(--tea-light);
        }

        .pairing p {
          margin: 0;
          font-size: 14px;
        }

        /* Lesson 4: the stray empty note, visible as a dashed box until :empty hides it. */
        .note {
          margin: 0;
          padding: 12px;
          border: 2px dashed var(--tea);
          border-radius: var(--radius);
        }

        .about {
          margin-top: 24px;
        }
