  - id: tokens
    narration: >
      [[mark:type-tokens]] model က တကယ် ဘာကို ဖတ်ရလဲ သိဖို့ tokenizer က ခွဲပေးတဲ့ token တွေကို ပြခိုင်းပါမယ်။
      [[mark:read-tokens]] အောက်ဆုံးက table မှာ အင်္ဂလိပ် စာကြောင်းက စကားလုံး token တွေ ဖြစ်ပေမယ့်၊
      မြန်မာ စာကြောင်းကတော့ UNK ဆိုတဲ့ token လေးခုပဲ ဖြစ်နေပါတယ်။ UNK ဆိုတာ model ရဲ့ စကားလုံး စာရင်းထဲမှာ
      မရှိတဲ့ စာပါ။ ဆိုလိုတာက model က မြန်မာ စကားလုံး တစ်လုံးမှ မမြင်ရလို့ ချီးကျူးတာနဲ့ တိုင်ကြားတာ အမှတ်
      တူနေတာပါ။ အင်္ဂလိပ် စာလုံးနဲ့ ရေးတဲ့ review ကလည်း အဓိပ္ပာယ် မရှိတဲ့ အင်္ဂလိပ် အပိုင်းအစတွေ ဖြစ်သွားလို့၊
      positive ရတာ မှန်ပေမယ့် ယုံလို့ မရပါဘူး။ [[mark:type-statement]] ဒါကြောင့် ဒီ feature ဘေးမှာ ပြမယ့်
      coverage statement ကို ထည့်ပါမယ်။ [[mark:read-statement]] panel အောက်ဆုံးမှာ ဒီ model ကို
      မြန်မာ review တွေအတွက် မသုံးဘူး ဆိုတဲ့ statement ပေါ်လာပါပြီ။ အင်္ဂလိပ် model
      တစ်ခုက ဘာသာစကား တစ်ခုလုံးကို မမျှမတ ဆက်ဆံမိနိုင်လို့၊ မြန်မာ review တွေအတွက် တခြား နည်းကို platform
      lesson တွေမှာ ရွေးပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: AI governance: Build responsibly (fairness: document your data sources and coverage)",
          url: "https://web.dev/learn/ai/responsibility",
        }
      - {
          title: "Hugging Face: typeform/mobilebert-uncased-mnli (model card: English)",
          url: "https://huggingface.co/typeform/mobilebert-uncased-mnli",
        }
    actions:
      - { id: open-main-2, type: workspace.openFile, at: { mark: type-tokens }, path: src/main.js }
      - id: type-tokens
        type: editor.type
        at: { afterAction: open-main-2 }
        target:
          {
            file: src/main.js,
            after: "await showPairs(classify, labels, pairs.rows);\n",
            occurrence: 1,
          }
        text: "showTokens(classify, pairs.rows, [\"p04\", \"p05\", \"p08\"]);\n"
        cadence: line-by-line
      - id: expect-tokens
        type: expect.preview
        at: { afterAction: type-tokens }
        timeoutMs: 8000
        target: { by: testId, value: ai-tokens-2 }
        textContains: "[UNK] [UNK] [UNK] [UNK]"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: scroll-tokens
        type: preview.scroll
        at: { mark: read-tokens }
        top: 5000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-statement
        type: editor.type
        at: { mark: type-statement }
        target:
          {
            file: src/main.js,
            after: "showTokens(classify, pairs.rows, [\"p04\", \"p05\", \"p08\"]);\n",
            occurrence: 1,
          }
        text: "showStatement(\"ဒီ model ကို အင်္ဂလိပ်စာနဲ့ပဲ train ထားလို့ မြန်မာလို review တွေအတွက် မသုံးပါ။\");\n"
        cadence: line-by-line
      - id: expect-statement
        type: expect.preview
        at: { afterAction: type-statement }
        timeoutMs: 8000
        target: { by: testId, value: ai-statement }
        textContains: "အင်္ဂလိပ်စာနဲ့ပဲ train ထားလို့"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: scroll-statement
        type: preview.scroll
        at: { mark: read-statement }
        top: 5000
        retry: { maxAttempts: 2, delayMs: 250 }

  - id: proxy
    chapter: "Township က proxy ဖြစ်နေလား"
    narration: >
      intelligence အလွှာမှာ predictive model တွေအတွက် အထူး သတိထားရမယ့် အချက်က proxy ပါ။ proxy ဆိုတာ တိုက်ရိုက်
      မမေးပေမယ့် လူမျိုး၊ လူတန်းစား လို အရေးကြီးတဲ့ အချက်ကို သွယ်ဝိုက်ပြီး ပြနေတဲ့ column ပါ။ နေရပ်၊ ပညာရေး၊
      ဝင်ငွေ လို column တွေက ဒီလို ဖြစ်နိုင်ပြီး၊ lesson ၄ မှာ ထားခဲ့တဲ့ township ကလည်း နေရပ်ကို ပြတဲ့ column ပါ။
      [[mark:type-member]] lesson ၅ ရဲ့ member model ကို panel ရဲ့ ထိပ်ဆုံးမှာ ပြခိုင်းပါမယ်။
      [[mark:read-member]] Member model card မှာ lesson ၅ ရဲ့ model သေးသေးလေးကို ဒီ page ထဲမှာ ပြန် train
      လုပ်ထားလို့ precision ၉၀၊ recall ၇၅ ရာခိုင်နှုန်းကို ပြန်မြင်ရပါတယ်။ အောက်က table ကတော့ ဒီ model အတွက်
      paired test ပါ၊ ပြီးခဲ့တဲ့ lesson တွေက member တစ်ယောက်တည်းရဲ့ township ကိုပဲ ပြောင်းပြီး model ကို
      ပေးကြည့်တာပါ။ township ကို model ထဲ မထည့်ရသေးလို့ ဘယ်မြို့နယ်ပဲ ဖြစ်ဖြစ် ၂၇ ရာခိုင်နှုန်းလောက်
      ဖြစ်နေပါတယ်။ [[mark:click-with]] township ကို ထည့်တဲ့ ခလုတ်ကို နှိပ်ကြည့်ပါမယ်။ [[mark:read-with]] test
      set ရဲ့ precision နဲ့ recall က လုံးဝ မပြောင်းပါဘူး။ ဒါပေမဲ့ model က မြို့နယ်တွေကို weight ပေးလိုက်လို့
      member တစ်ယောက်တည်းပဲ ဖြစ်ပေမယ့် ကမာရွတ် မှာ နေရင် ၅၀ ရာခိုင်နှုန်း၊ ရန်ကင်း မှာ နေရင် ၂
      ရာခိုင်နှုန်းလောက်ပဲ ဖြစ်သွားပါတယ်။ [[mark:read-why]] ဒီ နမူနာ data မှာ township က member ဆက်လာမလာနဲ့
      မဆိုင်ပေမယ့်၊ model က data ထဲက မတော်တဆ ကွာခြားမှုတွေကို သင်ယူသွားတာပါ။ ဒီ ကွာခြားမှုက ဘာမှ မကူညီဘဲ နေတဲ့
      နေရာကြောင့် member တွေကို မတရား ဆက်ဆံနိုင်ပါတယ်။ ဒါကြောင့် township ကို member
      model ထဲ မထည့်ဖို့ ဆုံးဖြတ်ပြီး၊ [[mark:click-without]] မထည့် ခလုတ်ကို ပြန်နှိပ်ပါမယ်။ [[mark:read-without]] မြို့နယ် အားလုံး အရင်လို
      တူသွားပါပြီ။ ဒီ ဆုံးဖြတ်ချက်ရဲ့ အကြောင်းရင်းက accuracy မဟုတ်ဘဲ fairness ပါ။
    sources:
      - {
          title: "web.dev Learn AI: AI governance: Build responsibly (fairness: intelligence, sensitive data)",
          url: "https://web.dev/learn/ai/responsibility",
        }
    actions:
      - id: type-member
        type: editor.type
        at: { mark: type-member }
        target:
          {
            file: src/main.js,
            after: "const columns = [\"visits_30d\", \"days_since_last\", \"complaints_per_visit\"];\n",
            occurrence: 1,
          }
        text: "showMemberModel(wide, sets, columns);\n"
        cadence: line-by-line
      - id: expect-member-model
        type: expect.preview
        at: { afterAction: type-member }
        timeoutMs: 8000
        target: { by: testId, value: ai-member-model-2 }
        attribute: { name: data-value, value: "0.75" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: scroll-top
        type: preview.scroll
        at: { mark: read-member }
        top: 0
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-precision-before
        type: expect.preview
        at: { afterAction: scroll-top }
        timeoutMs: 5000
        target: { by: testId, value: ai-member-model-1 }
        attribute: { name: data-value, value: "0.9" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-same-before
        type: expect.preview
        at: { afterAction: expect-precision-before }
        timeoutMs: 5000
        target: { by: testId, value: ai-township-2 }
        textContains: "ကမာရွတ်—26.9%"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: click-with
        type: preview.click
        at: { mark: click-with }
        target: { by: testId, value: township-2 }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-with-recall
        type: expect.preview
        at: { afterAction: click-with }
        timeoutMs: 5000
        target: { by: testId, value: ai-member-model-2 }
        attribute: { name: data-value, value: "0.75" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-with-precision
        type: expect.preview
        at: { afterAction: expect-with-recall }
        timeoutMs: 5000
        target: { by: testId, value: ai-member-model-1 }
        attribute: { name: data-value, value: "0.9" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-kamayut
        type: expect.preview
        at: { afterAction: expect-with-precision }
        timeoutMs: 5000
        target: { by: testId, value: ai-township-2 }
        textContains: "ကမာရွတ်0.570350.0%"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-yankin
        type: expect.preview
        at: { afterAction: expect-kamayut }
