        strokeColor: "#6741d9",
        fontSize: 28,
      }
build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 5109
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "Fairness ဆိုတာ ဘာလဲ"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ browser အပြင်ကို ထွက်သွားမယ့် data ထဲက ဖုန်းနံပါတ်နဲ့ နာမည်ကို
      မပို့ခင် ဖယ်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ governance ရဲ့ နောက်တစ်ချက် ဖြစ်တဲ့ fairness ကို လေ့လာပါမယ်။
      [[mark:draw-mini]] blueprint မှာ fairness က governance ထဲမှာ ရှိပေမယ့် data၊ intelligence၊ U X အလွှာ
      သုံးခုလုံးနဲ့ ဆိုင်ပါတယ်။ [[mark:draw-today]] fairness ဆိုတာ AI က လူ အားလုံးကို မျှမျှတတ ဆက်ဆံတာပါ။
      ဒီနေ့ ဆိုင်ရဲ့ model နှစ်ခုကို တကယ် စစ်ကြည့်ပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: AI governance: Build responsibly (fairness)",
          url: "https://web.dev/learn/ai/responsibility",
        }
      - {
          title: "web.dev Learn AI: Introduction to AI on the web (the blueprint)",
          url: "https://web.dev/learn/ai/introduction",
        }
      - {
          title: "web.dev Learn AI: Welcome to Learn AI! (course credit: written by Dr. Janna Lipenkova with editorial guidance from Alexandra Klepper; text CC BY 4.0, code Apache 2.0; adapted into Burmese with the course's own tea-shop examples)",
          url: "https://web.dev/learn/ai/welcome",
        }
      - {
          title: "Creative Commons: Attribution 4.0 International (CC BY 4.0), the licence of the web.dev Learn AI text adapted here",
          url: "https://creativecommons.org/licenses/by/4.0/",
        }
    actions:
      - {
          id: open-board-a,
          type: whiteboard.apply,
          at: { scene: start, offsetMs: -450 },
          open: true,
          clear: true,
          upsertIds: [a-title],
        }
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - {
          id: draw-mini,
          type: whiteboard.apply,
          at: { mark: draw-mini },
          upsertIds:
            [
              a-opp,
              a-opp-t,
              a-arrow-1,
              a-data,
              a-data-t,
              a-intel,
              a-intel-t,
              a-ux,
              a-ux-t,
              a-arrow-2,
              a-gov,
              a-gov-t,
              a-gov-f,
            ],
          drawMs: 2400,
        }
      - {
          id: draw-today,
          type: whiteboard.apply,
          at: { mark: draw-today },
          upsertIds: [a-today],
          drawMs: 1000,
        }

  - id: bias
    narration: >
      [[mark:draw-bias]] bias ဆိုတာ training data ထဲက မမျှတတဲ့ အမြင်တွေကို model က လိုက်ယူ ဒါမှမဟုတ်
      ပိုချဲ့ပြီး၊ လူ တချို့ကို မတရား ဆက်ဆံမိတာပါ။ အလုပ်ခန့်တာ၊ ဥပဒေ၊ ငွေကြေး လို လူတွေရဲ့ ဘဝကို တိုက်ရိုက်
      ထိတဲ့ နေရာတွေမှာ အန္တရာယ် အများဆုံးပါ။ ဥပမာ အရင်က အလုပ်ခန့်ခဲ့တဲ့ မှတ်တမ်းတွေနဲ့ train လုပ်ထားတဲ့ model
      က လူ အုပ်စု တချို့ကို မသိမသာ နှိမ်ခဲ့တဲ့ အရင် ပုံစံအတိုင်း ဆက်ခန့်မှန်းသွားနိုင်ပါတယ်။
      [[mark:draw-born]] bias က data ထဲမှာ မွေးလာပါတယ်။ [[mark:draw-amp]] model က အဲဒီ ပုံစံကို သင်ယူရင်း
      ပိုချဲ့ပါတယ်။ [[mark:draw-seen]] နောက်ဆုံး user တွေက U X ထဲမှာ အဲဒီ အကျိုးဆက်ကို မြင်ရပါတယ်။ ဒါကြောင့်
      အလွှာ သုံးခုလုံးမှာ ကာကွယ်ရပါတယ်။ [[mark:draw-shop]] ကိုယ်တို့ ဆိုင်မှာ စစ်စရာ နှစ်ခု ရှိပါတယ်။ review
      တွေကို positive လား negative လား ခွဲမယ့် model က မြန်မာလို ရေးတဲ့ customer တွေကိုလည်း မျှမျှတတ
      ဆက်ဆံရဲ့လား၊ ပြီးခဲ့တဲ့ lesson တွေက member model က နေတဲ့ မြို့နယ်ကို ကြည့်ပြီး ခွဲခြားနေသလား ဆိုတာပါ။
    sources:
      - {
          title: "web.dev Learn AI: AI governance: Build responsibly (fairness)",
          url: "https://web.dev/learn/ai/responsibility",
        }
    actions:
      - {
          id: draw-bias,
          type: whiteboard.apply,
          at: { mark: draw-bias },
          clear: true,
          upsertIds: [b-title, b-harm],
          drawMs: 1200,
        }
      - {
          id: draw-born,
          type: whiteboard.apply,
          at: { mark: draw-born },
          upsertIds: [b-data, b-data-t, b-data-v],
          drawMs: 1000,
        }
      - {
          id: draw-amp,
          type: whiteboard.apply,
          at: { mark: draw-amp },
          upsertIds: [b-arrow-1, b-intel, b-intel-t, b-intel-v],
          drawMs: 1200,
        }
      - {
          id: draw-seen,
          type: whiteboard.apply,
          at: { mark: draw-seen },
          upsertIds: [b-arrow-2, b-ux, b-ux-t, b-ux-v],
          drawMs: 1200,
        }
      - {
          id: draw-shop,
          type: whiteboard.apply,
          at: { mark: draw-shop },
          upsertIds: [b-shop1, b-shop2],
          drawMs: 1600,
        }

  - id: model
    chapter: "Review model ကို စစ်ရအောင်"
    narration: >
      [[mark:close-bias]] review model ကို code မှာ ကြည့်ရအောင်။ [[mark:panel-ready]] ပထမဆုံး စစ်မှာက
      customer review တွေကို ခွဲမယ့် model ပါ။ [[mark:sel-pipeline]] ဒီ စာကြောင်းက Hugging Face Hub
      ပေါ်က အင်္ဂလိပ် model သေးသေးလေး တစ်ခုကို ယူသုံးတာပါ။ အရွယ်အစား ၂၈ megabyte လောက်ရှိပြီး ဒီ page ထဲမှာပဲ
      Transformers.js နဲ့ run ပါတယ်။ [[mark:sel-labels]] label နှစ်ခု ပေးလိုက်ရင် review တစ်ခုချင်းစီအတွက် ဘယ်
      label က ပိုကိုက်လဲ အမှတ်ပေးပါတယ်။ ကိုယ်တိုင် train မလုပ်ဘဲ label ကိုပဲ ပေးလိုက်တာမို့ ဆိုင်က ချက်ချင်း
      သုံးလို့ ရပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: AI governance: Build responsibly (fairness: data)",
          url: "https://web.dev/learn/ai/responsibility",
        }
      - {
          title: "Hugging Face: Xenova/mobilebert-uncased-mnli",
          url: "https://huggingface.co/Xenova/mobilebert-uncased-mnli",
        }
      - {
          title: "Hugging Face: typeform/mobilebert-uncased-mnli (model card: English, fine-tuned on MNLI)",
          url: "https://huggingface.co/typeform/mobilebert-uncased-mnli",
        }
    actions:
      - { id: close-bias, type: whiteboard.apply, at: { mark: close-bias }, open: false }
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-model-card
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 10000
        target: { by: testId, value: ai-model-1 }
        attribute: { name: data-label, value: "Model" }
        retry: { maxAttempts: 3, delayMs: 1000 }
      - { id: open-main, type: workspace.openFile, at: { mark: sel-pipeline }, path: src/main.js }
      - id: sel-pipeline
        type: editor.select
        at: { afterAction: open-main }
        target:
          {
            file: src/main.js,
            text: 'await pipeline("zero-shot-classification", "Xenova/mobilebert-uncased-mnli", { dtype: "q8" })',
            occurrence: 1,
          }
      - id: sel-labels
        type: editor.select
        at: { mark: sel-labels }
        target:
          { file: src/main.js, text: 'const labels = ["positive", "negative"];', occurrence: 1 }

  - id: data-layer
    narration: >
      [[mark:draw-data]] data အလွှာကနေ စကြည့်ရအောင်။ training data က လက်တွေ့ ဘဝကနေ စုထားတဲ့ အပိုင်းအစတွေ
      ဖြစ်လို့ အဲဒီက bias တွေ ပါလာနိုင်သလို၊ bias အသစ်လည်း ဝင်လာနိုင်ပါတယ်။ [[mark:draw-statement]] ပထမ
      နည်းက model ကို ဘယ် data နဲ့ train ထားလဲ၊ ဘယ်နေရာမှာ အားနည်းလဲ ဆိုတာကို user တွေ မြင်အောင် coverage
      statement တိုတိုလေး ရေးပြတာပါ။ ခုနက model ရဲ့ Hugging Face ပေါ်က model card မှာလည်း အင်္ဂလိပ်စာ အတွက်လို့ ရေးထားပါတယ်။
      [[mark:draw-paired]] ဒုတိယက diagnostic check တွေ run တာပါ။ paired test ဆိုတာ စာသား တစ်နေရာတည်းပဲ ကွာတဲ့
      input နှစ်ခုကို model ဆီ ပေးပြီး အဖြေ ကွာမကွာ စစ်တာပါ။ ဥပမာ she၊ he၊ they ပဲ ကွာတဲ့ စာကြောင်းတွေမှာ အဖြေ
      မတူရင် bias ရှိနိုင်လို့ သတိထားရပါမယ်။ [[mark:draw-meta]] တတိယက row တိုင်းမှာ ဘာသာစကား၊ menu item၊ ဘယ်
      channel က ရောက်လာလဲ ဆိုတဲ့ metadata ကပ်ထားတာပါ။ ဒါမှ နောက်ပိုင်း ဘယ် အုပ်စုမှာ မှားလဲ ခွဲစစ်နိုင်ပါတယ်။
      [[mark:draw-balance]] ကိုယ်တိုင် train လုပ်မယ်ဆိုရင်တော့ အုပ်စု အားလုံး မျှမျှ ပါအောင် data ကို
      စုရပါမယ်။ model ဆောက်ပြီးမှ ပြင်တာထက် အများကြီး ပိုထိရောက်လို့ပါ။
    sources:
      - {
          title: "web.dev Learn AI: AI governance: Build responsibly (fairness: data)",
          url: "https://web.dev/learn/ai/responsibility",
        }
      - {
          title: "Hugging Face: typeform/mobilebert-uncased-mnli (model card: English)",
          url: "https://huggingface.co/typeform/mobilebert-uncased-mnli",
        }
    actions:
      - {
          id: draw-data,
          type: whiteboard.apply,
          at: { mark: draw-data },
          open: true,
          clear: true,
          upsertIds: [c-title],
          drawMs: 600,
        }
      - {
          id: draw-statement,
          type: whiteboard.apply,
          at: { mark: draw-statement },
          upsertIds: [c-stmt],
          drawMs: 1000,
        }
      - {
          id: draw-paired,
          type: whiteboard.apply,
          at: { mark: draw-paired },
          upsertIds: [c-pair, c-pair-ex, c-same],
          drawMs: 1800,
        }
      - {
          id: draw-meta,
          type: whiteboard.apply,
          at: { mark: draw-meta },
          upsertIds: [c-meta],
          drawMs: 1000,
        }
      - {
          id: draw-balance,
          type: whiteboard.apply,
          at: { mark: draw-balance },
          upsertIds: [c-bal],
          drawMs: 1000,
        }

  - id: pairs-data
    narration: >
      [[mark:close-data]] ကိုယ်တို့ရဲ့ paired test တွေကို ကြည့်ရအောင်။ [[mark:open-pairs]] ဒါတွေက lesson အတွက်
      ရေးထားတဲ့ နမူနာ review တွေပါ။ test တစ်ခုချင်းမှာ pronoun၊ ဘာသာစကား၊ ရေးတဲ့ စာလုံး၊ နာမည် ဆိုပြီး
      တစ်ချက်ပဲ ပြောင်းထားပါတယ်။ ကျောင်းသား မောင်မောင် လို customer တွေ ရိုက်တတ်တဲ့ အင်္ဂလိပ် စာလုံးနဲ့ ရေးတဲ့
      မြန်မာစကား review လည်း ပါပါတယ်။ [[mark:sel-meta]] row တိုင်းမှာ metadata ကိုလည်း ကပ်ထားပါတယ်။ [[mark:sel-names]] နောက်ဆုံး နှစ်ကြောင်းကတော့ ဆိုင်ပိုင်ရှင် လှလှ နဲ့ member အောင်အောင် ဆိုပြီး
      အမျိုးသမီး နာမည်နဲ့ အမျိုးသား နာမည်ပဲ ကွာတဲ့ မြန်မာ review တွေပါ။
    sources:
      - {
          title: "web.dev Learn AI: AI governance: Build responsibly (fairness: diagnostic checks, metadata)",
          url: "https://web.dev/learn/ai/responsibility",
        }
    actions:
      - { id: close-data, type: whiteboard.apply, at: { mark: close-data }, open: false }
      - {
          id: open-pairs,
          type: workspace.openFile,
          at: { mark: open-pairs },
          path: data/pairs.json,
        }
      - id: sel-meta
        type: editor.select
        at: { mark: sel-meta }
        target:
          {
            file: data/pairs.json,
            text: '"lang": "my", "item": "palata", "channel": "app"',
            occurrence: 1,
          }
      - id: sel-names
        type: editor.select
        at: { mark: sel-names }
        target:
          { file: data/pairs.json, text: '"text": "လှလှ မှာထားတဲ့ မုန့်ဟင်းခါး အေးနေတယ်။"', occurrence: 1 }

  - id: results
    chapter: "Paired test ရလဒ်"
    narration: >
      [[mark:read-pairs]] AI panel ရဲ့ Paired tests table မှာ model က ဒီ page ထဲမှာ တွက်ထားတဲ့ ရလဒ်တွေ
      ပေါ်လာပါပြီ။ she၊ he၊ they စာကြောင်း သုံးကြောင်းလုံး negative ဖြစ်ပြီး အမှတ်တွေလည်း အတူတူနီးပါး
      ဖြစ်ပါတယ်၊ ဒီ test မှာတော့ ကွာခြားမှု မတွေ့ရပါဘူး။ [[mark:read-lang]] အင်္ဂလိပ် review နှစ်ခုကိုလည်း
      မှန်မှန် ခွဲပါတယ်၊ လက်ဖက်ရည် ကောင်းတာက positive၊ ပလာတာ ဆီများတာက negative ပါ။ ဒါပေမဲ့ အဲဒီ နှစ်ခုနဲ့
      အဓိပ္ပာယ် တူတဲ့ မြန်မာ review တွေကတော့ ချီးကျူးတာရော တိုင်ကြားတာရော positive ဘက်ကို နည်းနည်းပဲ
      ယိမ်းတဲ့ အမှတ် အတူတူ ရနေပါတယ်။ [[mark:read-name]] လှလှ နဲ့ အောင်အောင် review နှစ်ခုလည်း အမှတ် တစ်ထပ်တည်း
      ဖြစ်ပြီး၊ မုန့်ဟင်းခါး အေးနေတယ် ဆိုတဲ့ တိုင်ကြားချက်ကို positive လို့ ခွဲထားပါတယ်။ နာမည် ပြောင်းတာနဲ့
      အဖြေ မပြောင်းတာက မျှတလို့ မဟုတ်ဘဲ၊ model က မြန်မာစာကို လုံးဝ မဖတ်နိုင်လို့ ဖြစ်နိုင်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: AI governance: Build responsibly (fairness: run diagnostic checks)",
          url: "https://web.dev/learn/ai/responsibility",
        }
      - {
          title: "Transformers.js: zero-shot classification",
          url: "https://huggingface.co/docs/transformers.js/api/pipelines#module_pipelines.ZeroShotClassificationPipeline",
        }
    actions:
      - id: wait-model
        type: expect.preview
        at: { mark: read-pairs }
        timeoutMs: 120000
        target: { by: testId, value: ai-model-1 }
        attribute: { name: data-status, value: "ready" }
        retry: { maxAttempts: 3, delayMs: 45000 }
      - id: expect-done
        type: expect.preview
        at: { afterAction: wait-model }
