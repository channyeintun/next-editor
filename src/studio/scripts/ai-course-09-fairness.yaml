      src/features.js: |
        // A new input feature made from two columns the data already has:
        //   rows = perVisit(rows, "complaints_90d");  → every row gets complaints_per_visit,
        // the complaints divided by the visits in the month (at least 1, so a member with no visits
        // is not divided by zero). Plain code, no model.
        export function perVisit(rows, column) {
          const name = `${column.replace(/_90d$/, "")}_per_visit`;
          return rows.map((r) => ({ ...r, [name]: r[column] / Math.max(1, r.visits_30d) }));
        }
      src/main.js: |
        import { pipeline } from "@huggingface/transformers";
        import data from "../data/members.json";
        import pairs from "../data/pairs.json";
        import { TOWNSHIP_SPELLINGS, dropDuplicates, normalize, fillMissing, toNumber, dropColumn, encode, split, oneHot } from "./prepare.js";
        import { perVisit } from "./features.js";
        import { showMemberModel, showPairs, showTokens, showStatement } from "./report.js";

        // Lesson 05's member model: lesson 04's steps (sample data written for the course), the per-visit
        // column and its three input features. Township is still in the data, as 0/1 columns.
        let rows = data.rows;
        rows = dropDuplicates(rows);
        rows = normalize(rows, "township", TOWNSHIP_SPELLINGS);
        rows = fillMissing(rows, "township", "မသိ");
        rows = toNumber(rows, "avg_order_kyat");
        rows = dropColumn(rows, "phone");
        rows = encode(rows, "member_type", { card: 0, app: 1 });
        rows = perVisit(rows, "complaints_90d");
        const wide = oneHot(rows, "township");
        const sets = split(wide.rows, { seed: 5104 });
        const columns = ["visits_30d", "days_since_last", "complaints_per_visit"];

        // The review model: an English model from the Hugging Face Hub that scores how well each label fits.
        const classify = await pipeline("zero-shot-classification", "Xenova/mobilebert-uncased-mnli", { dtype: "q8" });
        const labels = ["positive", "negative"];

        // Paired tests: reviews that differ in one thing only (data/pairs.json, with metadata on every row).
        await showPairs(classify, labels, pairs.rows);
      src/ml.js: |
        // Tiny machine learning in plain JavaScript: everything here runs in the page, with no
        // downloads, and gives the same numbers every time.

        // Burmese has no spaces between words, so the models count syllables instead.
        // A syllable starts at a consonant, unless that consonant is stacked under the one
        // before it (္) or killed by an asat (်) and so ends the syllable before it.
        const STARTS = /[က-ဪဿ၌-၏]/;
        export function syllables(word) {
          const chars = [...word];
          const out = [];
          for (let i = 0; i < chars.length; i++) {
            const next = chars[i + 1] === "့" ? chars[i + 2] : chars[i + 1];
            const starts = STARTS.test(chars[i]) && chars[i - 1] !== "္" && next !== "်" && next !== "္";
            if (starts || !out.length) out.push(chars[i]);
            else out[out.length - 1] += chars[i];
          }
          return out;
        }

        export function tokenize(text) {
          const tokens = [];
          for (const [piece] of text.toLowerCase().matchAll(/[a-z0-9']+|[၀-၉]+|[က-ဿ၌-႟]+/g)) {
            if (/^[က-ဿ၌-႟]/.test(piece)) tokens.push(...syllables(piece));
            else tokens.push(piece);
          }
          return tokens;
        }

        // Naive Bayes: count how often each token appears with each label, then score a new
        // text by how well its tokens fit each label.
        export function trainNaiveBayes(examples) {
          const labels = {};
          const vocab = new Set();
          for (const { text, label } of examples) {
            const c = (labels[label] ??= { docs: 0, tokens: 0, counts: {} });
            c.docs += 1;
            for (const t of tokenize(text)) {
              c.counts[t] = (c.counts[t] ?? 0) + 1;
              c.tokens += 1;
              vocab.add(t);
            }
          }
          return { labels, vocab, total: examples.length };
        }

        export function predict(model, text) {
          const tokens = tokenize(text).filter((t) => model.vocab.has(t));
          const logs = {};
          for (const [label, c] of Object.entries(model.labels)) {
            let score = Math.log(c.docs / model.total);
            for (const t of tokens) score += Math.log(((c.counts[t] ?? 0) + 1) / (c.tokens + model.vocab.size));
            logs[label] = score;
          }
          const max = Math.max(...Object.values(logs));
          const sum = Object.values(logs).reduce((s, v) => s + Math.exp(v - max), 0);
          return Object.fromEntries(Object.entries(logs).map(([label, v]) => [label, Math.exp(v - max) / sum]));
        }

        export function topLabel(scores) {
          return Object.entries(scores).sort((a, b) => b[1] - a[1])[0][0];
        }

        // k nearest neighbours: find the training texts that share the most tokens with a new one.
        function vector(text) {
          const v = {};
          for (const t of tokenize(text)) v[t] = (v[t] ?? 0) + 1;
          return v;
        }
        function cosine(a, b) {
          let dot = 0;
          for (const t in a) if (t in b) dot += a[t] * b[t];
          const norm = (v) => Math.sqrt(Object.values(v).reduce((s, x) => s + x * x, 0));
          return dot === 0 ? 0 : dot / (norm(a) * norm(b));
        }
        export function nearest(examples, text, k = 3) {
          const q = vector(text);
          return examples
            .map((e, i) => ({ ...e, similarity: cosine(q, vector(e.text)), i }))
            .sort((a, b) => b.similarity - a.similarity || a.i - b.i)
            .slice(0, k)
            .map(({ i, ...rest }) => rest);
        }
        export function knnPredict(examples, text, k = 3) {
          const votes = {};
          for (const e of examples) votes[e.label] = 0;
          for (const n of nearest(examples, text, k)) votes[n.label] += 1 / k;
          return votes;
        }

        // A straight line through a series (least squares): the simplest forecast.
        export function fitLine(ys) {
          const n = ys.length;
          const mx = (n - 1) / 2;
          const my = ys.reduce((s, y) => s + y, 0) / n;
          let num = 0;
          let den = 0;
          ys.forEach((y, x) => {
            num += (x - mx) * (y - my);
            den += (x - mx) ** 2;
          });
          const slope = den === 0 ? 0 : num / den;
          const intercept = my - slope * mx;
          return { slope, intercept, at: (x) => intercept + slope * x };
        }

        export function meanAbsoluteError(actual, predicted) {
          return actual.reduce((s, a, i) => s + Math.abs(a - predicted[i]), 0) / actual.length;
        }

        // Accuracy, precision, recall and F1 for one label (the "positive" class).
        export function scoreReport(rows, positive) {
          let tp = 0, fp = 0, fn = 0, correct = 0;
          for (const { expected, predicted } of rows) {
            if (expected === predicted) correct += 1;
            if (predicted === positive && expected === positive) tp += 1;
            if (predicted === positive && expected !== positive) fp += 1;
            if (predicted !== positive && expected === positive) fn += 1;
          }
          const precision = tp + fp === 0 ? 0 : tp / (tp + fp);
          const recall = tp + fn === 0 ? 0 : tp / (tp + fn);
          const f1 = precision + recall === 0 ? 0 : (2 * precision * recall) / (precision + recall);
          return { accuracy: correct / rows.length, precision, recall, f1 };
        }

        // A shuffle that gives the same order every time for the same seed.
        export function shuffle(list, seed = 1) {
          let s = seed >>> 0;
          const random = () => {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
          const out = [...list];
          for (let i = out.length - 1; i > 0; i--) {
            const j = Math.floor(random() * (i + 1));
            [out[i], out[j]] = [out[j], out[i]];
          }
          return out;
        }

        // A seeded random number generator (0 ≤ x < 1): the same seed gives the same numbers every time.
        export function rng(seed = 1) {
          let s = seed >>> 0;
          return () => {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        // Logistic regression for tabular data: one weight per input column, learned by gradient descent
        // from zero, on columns scaled to mean 0 and spread 1. Same data and settings → same weights.
        //   const model = trainLogistic(rows, { columns: ["visits_30d", "days_since_last"], label: "stopped" });
        //   model.weights → { visits_30d: -1.2, days_since_last: 1.9 } (on the scaled columns)
        //   model.probability(row) → 0.72
        export function trainLogistic(rows, { columns, label, epochs = 400, rate = 0.5 } = {}) {
          const n = rows.length;
          const mean = {};
          const spread = {};
          for (const c of columns) {
            mean[c] = rows.reduce((s, r) => s + Number(r[c]), 0) / n;
            const v = rows.reduce((s, r) => s + (Number(r[c]) - mean[c]) ** 2, 0) / n;
            spread[c] = Math.sqrt(v) || 1;
          }
          const scaled = (r) => columns.map((c) => (Number(r[c]) - mean[c]) / spread[c]);
          const xs = rows.map(scaled);
          const ys = rows.map((r) => Number(r[label]));
          const w = columns.map(() => 0);
          let b = 0;
          const sigmoid = (z) => 1 / (1 + Math.exp(-z));
          for (let e = 0; e < epochs; e++) {
            const gw = columns.map(() => 0);
            let gb = 0;
            for (let i = 0; i < n; i++) {
              const p = sigmoid(xs[i].reduce((s, x, j) => s + x * w[j], b));
              const err = p - ys[i];
              for (let j = 0; j < w.length; j++) gw[j] += err * xs[i][j];
              gb += err;
            }
            for (let j = 0; j < w.length; j++) w[j] -= (rate * gw[j]) / n;
            b -= (rate * gb) / n;
          }
          const probability = (r) => sigmoid(scaled(r).reduce((s, x, j) => s + x * w[j], b));
          return { columns, label, weights: Object.fromEntries(columns.map((c, j) => [c, w[j]])), bias: b, probability };
        }

        // Rows → { expected, predicted } at a threshold, ready for scoreReport(rows, "yes").
        export function atThreshold(model, rows, threshold = 0.5) {
          return rows.map((r) => ({
            ...r,
            probability: model.probability(r),
            expected: Number(r[model.label]) === 1 ? "yes" : "no",
            predicted: model.probability(r) >= threshold ? "yes" : "no",
          }));
        }
      src/prepare.js: |
        // Data preparation for tabular data, in small steps a lesson can add one line at a time:
        // every function takes rows (plain objects) and returns new rows, never changing the input.
        //   rows = dropDuplicates(rows);  rows = normalize(rows, "township", TOWNSHIP_SPELLINGS);
        //   rows = toNumber(rows, "avg_order_kyat");  rows = dropColumn(rows, "phone");
        //   rows = encode(rows, "member_type", { card: 0, app: 1 });  const sets = split(rows, { seed: 5104 });
        //   const { rows: wide, columns } = oneHot(rows, "township");   // township=ဗဟန်း, … as 0/1 columns
        import { shuffle } from "./ml.js";

        // The township names typed in Latin letters at the counter, and the spelling the website uses.
        export const TOWNSHIP_SPELLINGS = { Bahan: "ဗဟန်း", Kamayut: "ကမာရွတ်", Sanchaung: "စမ်းချောင်း", Tamwe: "တာမွေ", Yankin: "ရန်ကင်း", Hlaing: "လှိုင်" };

        /** Rows that are exact copies of an earlier row are dropped. */
        export function dropDuplicates(rows) {
          const seen = new Set();
          return rows.filter((r) => {
            const key = JSON.stringify(r);
            if (seen.has(key)) return false;
            seen.add(key);
            return true;
          });
        }

        /** Replace spellings: `mapping` = { written: wanted }. Values not in it stay as they are. */
        export function normalize(rows, column, mapping) {
          return rows.map((r) => (r[column] in mapping ? { ...r, [column]: mapping[r[column]] } : r));
        }

        /** Fill an empty value (null, undefined or "") with `value`. */
        export function fillMissing(rows, column, value) {
          return rows.map((r) => (r[column] == null || r[column] === "" ? { ...r, [column]: value } : r));
        }

        /** Text such as "2,500" becomes the number 2500. */
        export function toNumber(rows, column) {
          return rows.map((r) => ({ ...r, [column]: typeof r[column] === "number" ? r[column] : Number(String(r[column]).replace(/[^0-9.-]/g, "")) }));
        }

        /** Leave a column out of every row. */
        export function dropColumn(rows, column) {
          return rows.map(({ [column]: _dropped, ...rest }) => rest);
        }

        /** Categories become numbers: encode(rows, "member_type", { card: 0, app: 1 }). */
        export function encode(rows, column, mapping) {
          return rows.map((r) => ({ ...r, [column]: mapping[r[column]] }));
        }

        /** One 0/1 column per value of a category column (`township=ဗဟန်း`, …); the original column goes.
         *  Returns { rows, columns } so the new column names can be passed to trainLogistic. */
        export function oneHot(rows, column) {
          const values = [...new Set(rows.map((r) => r[column]))].sort();
          const columns = values.map((v) => `${column}=${v}`);
          const out = rows.map(({ [column]: value, ...rest }) => ({ ...rest, ...Object.fromEntries(values.map((v, i) => [columns[i], value === v ? 1 : 0])) }));
          return { rows: out, columns };
        }

        /** How many rows have no value in each column. */
        export function countMissing(rows) {
          const columns = [...new Set(rows.flatMap((r) => Object.keys(r)))];
          return Object.fromEntries(columns.map((c) => [c, rows.filter((r) => r[c] == null || r[c] === "").length]));
        }

        /** Values that are not numbers in a column that should hold numbers. */
        export function countText(rows, column) {
          return rows.filter((r) => typeof r[column] !== "number").length;
        }

        /** A seeded split into training, validation and test sets (default 70 / 10 / 20). */
        export function split(rows, { seed = 1, train = 0.7, validation = 0.1 } = {}) {
          const mixed = shuffle(rows, seed);
          const a = Math.round(mixed.length * train);
          const b = a + Math.round(mixed.length * validation);
          return { train: mixed.slice(0, a), validation: mixed.slice(a, b), test: mixed.slice(b) };
        }
      src/report.js: |
        import { panel } from "ai-panel";
        import { trainLogistic, atThreshold, scoreReport } from "./ml.js";
        import { choices } from "./ui.js";

        // What the panel shows in lesson 09. The review model runs in this page (Transformers.js); the
        // member model is the small logistic regression in ml.js, trained in this page.
        const pct = (p) => `${(p * 100).toFixed(1)}%`;

        // Every paired input goes through the review model with the labels; the table shows the label
        // that fits best and its score (the two scores add up to 100%).
        export async function showPairs(classify, labels, rows) {
          const out = [];
          for (const r of rows) {
            const result = await classify(r.text, labels);
            out.push({ text: r.text, result: `${result.labels[0]} ${pct(result.scores[0])}` });
          }
          panel.table("Paired tests", out, { id: "pairs" });
        }

        // What the model really receives: the pieces its tokenizer makes of each text (lesson 06's tokens).
        export function showTokens(classify, rows, ids) {
          const pieces = (text) => classify.tokenizer.encode(text, { add_special_tokens: false }).map((id) => classify.tokenizer.decode([id])).join(" ");
          panel.table("What the model reads", rows.filter((r) => ids.includes(r.id)).map((r) => ({ lang: r.lang, tokens: pieces(r.text) })), { id: "tokens" });
        }

        // The coverage statement the shop shows next to the feature.
        export function showStatement(text) {
          panel.note(text, { id: "statement" });
        }

        // Lesson 05's member model, with township left out or put in (a page control), and the probability
        // it gives member M0023 when nothing but the township changes.
        const TOWNSHIPS = ["ဗဟန်း", "ကမာရွတ်", "စမ်းချောင်း", "တာမွေ", "ရန်ကင်း", "လှိုင်"];
        export function showMemberModel(wide, sets, columns) {
          const draw = (withTownship) => {
            const model = trainLogistic(sets.train, { columns: withTownship ? [...columns, ...wide.columns] : columns, label: "stopped" });
            const { precision, recall, f1 } = scoreReport(atThreshold(model, sets.test, 0.5), "yes");
            panel.metrics("Member model · test set", { precision, recall, f1 }, { id: "member-model", badge: "ဒီ page ထဲမှာ train ထားတဲ့ model" });
            const member = wide.rows.find((r) => r.member_id === "M0023");
            panel.table("M0023 · only the township changed", TOWNSHIPS.map((t) => {
              const row = { ...member, ...Object.fromEntries(wide.columns.map((c) => [c, c === `township=${t}` ? 1 : 0])) };
              return { township: t, weight: withTownship ? model.weights[`township=${t}`] : "—", stops: pct(model.probability(row)) };
            }), { id: "township" });
          };
          choices("township", ["မထည့်", "ထည့်"], (choice) => draw(choice === "ထည့်"), { selected: "မထည့်" });
          draw(false);
        }
      src/ui.js: |
        // Page controls for the lesson program: a row of buttons or choices in #app, above the AI panel.
        // Plain DOM, so the studio records every click and replay shows it exactly. Each control gets a
        // data-testid for preview.click. #app starts empty on every run, so controls are drawn by the
        // program each time. A handler that throws prints to the panel's Console (never the page).
        //
        //   import { row, button, choices } from "./ui.js";
        //   choices("threshold", [0.5, 0.7, 0.9], (t) => show(t), { selected: 0.5 });
        //     → buttons with test ids threshold-1, threshold-2, threshold-3 (1-based, in order)
        //   button("ဖော်ပြချက်တွေ ကြည့်မယ်", "show-descriptions", () => …);
        const STYLE_ID = "ui-style";
        const STYLE = `
        #app .ui-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px 0;
          font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans Myanmar", "Myanmar Sangam MN", "Myanmar Text", sans-serif; color: #d9dce2; }
        #app .ui-label { color: #adb5bd; font-size: 13px; }
        #app .ui-btn { font: inherit; color: #f1f3f5; background: #2d323c; border: 1px solid #3a404b; border-radius: 6px; padding: 3px 12px; cursor: pointer; }
        #app .ui-btn[aria-pressed="true"] { background: #7048e8; border-color: #7048e8; color: #fff; font-weight: 600; }
        `;

        function ensureStyle() {
          if (document.getElementById(STYLE_ID)) return;
          const style = document.createElement("style");
          style.id = STYLE_ID;
          style.textContent = STYLE;
          document.head.append(style);
        }

        const safe = (fn) => (...args) => {
          try {
            const result = fn(...args);
            if (result && typeof result.catch === "function") result.catch((error) => console.error(error));
          } catch (error) {
            console.error(error);
          }
        };

        /** A new row in #app, optionally with a short label in front. Returns the row element. */
        export function row(label = "") {
          ensureStyle();
          const el = document.createElement("div");
          el.className = "ui-row";
          if (label) {
            const span = document.createElement("span");
            span.className = "ui-label";
            span.textContent = label;
            el.append(span);
          }
          document.getElementById("app").append(el);
          return el;
        }

        /** One button. `testid` is used as is. */
        export function button(label, testid, onClick, parent = row()) {
          const el = document.createElement("button");
          el.type = "button";
          el.className = "ui-btn";
          el.textContent = String(label);
          el.dataset.testid = testid;
          el.addEventListener("click", safe(onClick));
          parent.append(el);
          return el;
        }

        /** A row of choices; the picked one is shown pressed. Test ids are `<name>-1`, `<name>-2`, … */
        export function choices(name, options, onPick, { label = name, selected } = {}) {
          const parent = row(label);
          const buttons = options.map((option, i) =>
            button(option, `${name}-${i + 1}`, () => {
              for (const b of buttons) b.setAttribute("aria-pressed", String(b === buttons[i]));
              onPick(option, i);
            }, parent),
          );
          for (const [i, b] of buttons.entries()) b.setAttribute("aria-pressed", String(options[i] === selected));
          return buttons;
        }
      vite.config.js: |
        import { defineConfig } from "vite";
        import courseRunner from "./course/runner.js";

        export default defineConfig({
          plugins: [courseRunner()],
        });
