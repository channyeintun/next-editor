  - id: intel-ux
    narration: >
      [[mark:draw-intel]] intelligence အလွှာမှာ township လို proxy ကို သတိထားတာအပြင် တခြား
      လုပ်စရာတွေလည်း ရှိပါတယ်။ ခုနက paired test လို bias
      စစ်တာကို model ပြောင်းတိုင်း ပုံမှန် ပြန် run ရပါမယ်။ ကျား မ ခွဲတဲ့ စကားလုံး၊ လူ တချို့ကို ချန်ထားတဲ့
      စကားလုံးတွေကို filter နဲ့ ဖမ်းပြီး၊ အချိန်ကြာလာရင် drift ဖြစ်မဖြစ်လည်း စောင့်ကြည့်ရပါမယ်။
      [[mark:draw-rank]] generative model ဆိုရင် အဖြေ အများကြီး ထုတ်ခိုင်းပြီး ဘက်မလိုက်ဆုံး၊ အမျိုးမျိုး
      ပါဆုံး ဟာကို ရွေးလို့ ရသလို၊ လူ အုပ်စု တစ်ခုကို ပုံသေ ကြည့်တဲ့ stereotype
      ကို တားတဲ့ rule တွေလည်း ထည့်နိုင်ပါတယ်။ [[mark:draw-ux]] U X
      အလွှာမှာတော့ AI ရဲ့ အဖြေ ဘေးမှာ ဘာကြောင့်လဲ ဆိုတာ ပြပါ။ ဥပမာ menu အကြံပြုချက်မှာ ပုံမှန် မှာနေကျ
      အချိန်ကို ကြည့်ပြီး အကြံပြုထားပါတယ် လို့ ပြတာမျိုးပါ။ tone၊ အရှည် လို setting တွေကိုလည်း user ကိုယ်တိုင်
      ရွေးခွင့် ပေးပါ။ [[mark:draw-report]] bias တွေ့ရင် report လုပ်ဖို့ ခလုတ် ထားပြီး၊ report တွေကို retrain
      ဒါမှမဟုတ် rule ပြင်ဖို့ သုံးရပါမယ်။ ဘာပြင်လိုက်လဲ ဆိုတာကိုလည်း user ကို ပြန်ပြောပြရပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: AI governance: Build responsibly (fairness: intelligence, user experience)",
          url: "https://web.dev/learn/ai/responsibility",
        }
    actions:
      - {
          id: draw-intel,
          type: whiteboard.apply,
          at: { mark: draw-intel },
          open: true,
          clear: true,
          upsertIds: [d-title, d-test, d-proxy],
          drawMs: 1400,
        }
      - {
          id: draw-rank,
          type: whiteboard.apply,
          at: { mark: draw-rank },
          upsertIds: [d-rank, d-rule],
          drawMs: 1400,
        }
      - {
          id: draw-ux,
          type: whiteboard.apply,
          at: { mark: draw-ux },
          upsertIds: [d-why, d-control],
          drawMs: 1400,
        }
      - {
          id: draw-report,
          type: whiteboard.apply,
          at: { mark: draw-report },
          upsertIds: [d-report, d-loop],
          drawMs: 1200,
        }

  - id: quiz
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ fairness အတွက် intelligence အလွှာမှာ ဘာလုပ်သင့်လဲ။ training data
      မှာ bias မရှိဘူးလို့ ယူဆတာလား၊ model ရဲ့ မူလ အတိုင်းပဲ ထားတာလား၊ အဖြေ အများကြီး ထုတ်ပြီး ရွေးတာလား။
      lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] အဖြေကတော့ အဖြေ အများကြီး ထုတ်ပြီး
      ဘက်မလိုက်ဆုံး၊ အမျိုးမျိုး ပါဆုံး ဟာကို ရွေးတာပါ။ ဘာကြောင့်လဲဆိုတော့ intelligence အလွှာက model ရဲ့
      အဖြေကို စစ်ပြီး ထိန်းတဲ့ နေရာ ဖြစ်လို့ပါ။ data မှာ bias မရှိဘူးလို့ ယူဆတာ၊ model ကို မူလအတိုင်း
      ထားတာတွေကတော့ ခုနက မြန်မာ review ပြဿနာလို အမှားကို မမြင်ရအောင် ဖုံးထားတာပါပဲ။
    sources:
      - {
          title: "web.dev Learn AI: AI governance: Build responsibly (Check your understanding)",
          url: "https://web.dev/learn/ai/responsibility",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          clear: true,
          upsertIds: [z-title, z-q, z-o1, z-o2, z-o3],
          drawMs: 2000,
        }
      - {
          id: draw-quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [z-ring, z-a, z-note],
          drawMs: 1800,
        }

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ bias ဟာ data မှာ မွေး၊ model မှာ ပိုကြီး၊ U X မှာ ပေါ်လာတာမို့ အလွှာ
      သုံးခုလုံးမှာ ကာကွယ်ရပါတယ်။ [[mark:sel-final-pairs]] paired test နဲ့ စစ်တော့ အင်္ဂလိပ် model က မြန်မာ
      review တွေကို မဖတ်နိုင်တာ တွေ့ရလို့၊ [[mark:sel-final-statement]] coverage statement နဲ့
      ပွင့်ပွင့်လင်းလင်း ပြောပြပါတယ်။ [[mark:sel-final-member]] member model မှာတော့ township က proxy
      ဖြစ်နိုင်လို့ fairness အတွက် မထည့်ဖို့ ဆုံးဖြတ်ခဲ့ပါတယ်။ နောက် lesson မှာတော့ user တွေက AI ကို
      သင့်တင့်တဲ့ အတိုင်းအတာနဲ့ ယုံနိုင်အောင် လုပ်တဲ့ trust နဲ့ transparency ကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: AI governance: Build responsibly (fairness summary)",
          url: "https://web.dev/learn/ai/responsibility",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: recap }, open: false }
      - id: sel-final-pairs
        type: editor.select
        at: { mark: sel-final-pairs }
        target:
          {
            file: src/main.js,
            text: "await showPairs(classify, labels, pairs.rows);",
            occurrence: 1,
          }
      - id: sel-final-statement
        type: editor.select
        at: { mark: sel-final-statement }
        target: { file: src/main.js, text: "showStatement(", occurrence: 1 }
      - id: sel-final-member
        type: editor.select
        at: { mark: sel-final-member }
        target: { file: src/main.js, text: "showMemberModel(wide, sets, columns);", occurrence: 1 }
      - {
          id: expect-final-code,
          type: expect.file,
          at: { afterAction: sel-final-member },
          path: src/main.js,
          contains: "const columns = [\"visits_30d\", \"days_since_last\", \"complaints_per_visit\"];\nshowMemberModel(wide, sets, columns);\n",
        }
      - {
          id: expect-final-statement,
          type: expect.file,
          at: { afterAction: expect-final-code },
          path: src/main.js,
          contains: "await showPairs(classify, labels, pairs.rows);\nshowTokens(classify, pairs.rows, [\"p04\", \"p05\", \"p08\"]);\nshowStatement(",
        }
checks:
  - { type: timing.p95Ms, max: 300 }
