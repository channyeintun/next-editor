build:
  voiceProfile:
    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 9511

runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "jan by value:      230.00\njan by booking:    150.00\n"
      run-2:
        status: success
        exitCode: 0
        output: "jan by value:      230.00\njan by booking:    150.00\ntx-2 settles:      Mon 02 Feb\njan by settlement: 50.00\n"
      run-3:
        status: success
        exitCode: 0
        output: "jan by value:      230.00\njan by booking:    150.00\ntx-2 settles:      Mon 02 Feb\njan by settlement: 50.00\nwith so-4: 230.00 by value, 210.00 by booking\n"

scenes:
  - id: hook
    chapter: Created at တစ်ခုတည်း မလုံလောက်ဘူး
    narration: >-
      ငွေ အရွေ့အပြောင်း တစ်ခုကို database ထဲ သိမ်းတဲ့အခါ ပုံမှန် backend မှာဆိုရင် created at column
      တစ်ခုတည်း ထည့်လေ့ ရှိပါတယ်။ ငွေ system မှာ ဒါ မလုံလောက်ပါဘူး။ [[mark:sel-data]] ဒီမှာ PSP က
      capture လုပ်ပြီးသား card payment သုံးခု ရှိပါတယ်။ တစ်ခုချင်းမှာ အချိန် နှစ်ခု ပါပြီး၊ ပထမက
      payment ဖြစ်တဲ့ အချိန်၊ ဒုတိယက ကိုယ့် system က မှတ်လိုက်တဲ့ အချိန်ပါ။ [[mark:sel-tx3]] တတိယ
      payment က ဇန်နဝါရီ ၃၁ ရက်၊ သန်းခေါင် မထိုးခင် နှစ်မိနစ်မှာ ဖြစ်ပါတယ်။ ကိုယ့် system က
      မှတ်လိုက်တာကတော့ သန်းခေါင် ကျော်ပြီး လေးမိနစ်မှာပါ၊ ဆိုလိုတာက ဖေဖော်ဝါရီလထဲ ရောက်သွားပါပြီ။
      [[mark:sel-main]] main ထဲက ပထမ line က ဇန်နဝါရီလ စုစုပေါင်းကို payment ဖြစ်တဲ့ အချိန်နဲ့ တွက်ပြီး၊
      ဒုတိယ line က မှတ်တဲ့ အချိန်နဲ့ တွက်ပါတယ်။ data တစ်ခုတည်းကနေ ဂဏန်း ဘယ်နှခု ထွက်မလဲ
      ခန့်မှန်းကြည့်ပါ။ [[mark:run-1]] run လိုက်ရအောင်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Value time vs booking time vs settlement time (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#value-time-vs-booking-time-vs-settlement-time",
        }
      - { title: "Go standard library — package time", url: "https://pkg.go.dev/time" }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }
      - id: sel-data
        type: editor.select
        at: { mark: sel-data }
        target:
          {
            file: main.go,
            text: "\t{\"tx-1\", 5000, at(1, 26, 10, 0), at(1, 26, 10, 0)},\n\t{\"tx-2\", 10000, at(1, 29, 15, 0), at(1, 29, 15, 0)},\n\t{\"tx-3\", 8000, at(1, 31, 23, 58), at(2, 1, 0, 4)},",
            occurrence: 1,
          }
      - id: sel-tx3
        type: editor.select
        at: { mark: sel-tx3 }
