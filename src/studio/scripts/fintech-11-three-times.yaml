  - id: month
    chapter: Month boundary ကို ဖြတ်တဲ့အခါ
    narration: >-
      [[mark:show-month]] value နဲ့ booking ကွာတာ အရေးကြီးလာတာက reporting period ရဲ့ နယ်နိမိတ်ကို
      ဖြတ်တဲ့အခါပါ။ [[mark:pt-v3]] booking က value ထက် နောက်ကျရင် backdated လို့ ခေါ်ပါတယ်။ တကယ်တော့
      transaction အားလုံးနီးပါးက စက္ကန့်ပိုင်းလောက် backdated ဖြစ်ပြီးသားပါ။ ပြဿနာ ဖြစ်တာက ခုနက
      တတိယ payment လို ရက်၊ လ၊ နှစ် နယ်နိမိတ်ကို ဖြတ်သွားတဲ့အခါပါ။ [[mark:month-2]] ပြောင်းပြန်
      ဖြစ်တာလည်း ရှိပါတယ်၊ booking က value ထက် စောရင် forward-dated ပါ။ user တစ်ယောက်က ယူရို ၆၀
      standing order၊ ဆိုလိုတာက ကြိုစီစဉ်ထားတဲ့ ငွေလွှဲ တစ်ခုကို ဇန်နဝါရီ ၂၇ ရက်မှာ စီစဉ်ထားပြီး ဖေဖော်ဝါရီ ၃ ရက်ကျမှ ဝင်မယ် ဆိုပါစို့။ system
      က ဒီနေ့ မှတ်ပေမဲ့ ငွေက နောက်အပတ်ကျမှ ရွေ့မှာပါ။ [[mark:month-3]] ဒါဆို report တစ်ခုမှာ ဘယ်
      အချိန်ကို သုံးမလဲ။ business က သုံးတဲ့ report တွေက များသောအားဖြင့် value time ဒါမှမဟုတ် settlement time ကို
      သုံးပြီး၊ booking time ကတော့ ဘယ်အချိန်မှာ ဘာကို သိခဲ့လဲ ဆိုတာ ပြန် ခြေရာခံဖို့ပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Value time vs booking time vs settlement time (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#value-time-vs-booking-time-vs-settlement-time",
        }
    actions:
      - {
          id: show-month,
          type: slide.show,
          at: { mark: show-month, offsetMs: -700 },
          slideId: month-1,
        }
      - { id: pt-v3, type: slide.point, at: { mark: pt-v3 }, target: { x: 0.738, y: 0.442 } }
      - { id: month-2, type: slide.show, at: { mark: month-2 }, slideId: month-2 }
      - {
          id: pt-v4,
          type: slide.point,
          at: { afterAction: month-2 },
          target: { x: 0.263, y: 0.698 },
        }
      - { id: month-3, type: slide.show, at: { mark: month-3 }, slideId: month-3 }
      - {
          id: pt-use,
          type: slide.point,
          at: { afterAction: month-3 },
          target: { x: 0.257, y: 0.878 },
        }

  - id: forward
    narration: >-
      [[mark:close-month]] standing order ကို data ထဲ ထည့်ကြည့်ရအောင်။ [[mark:type-so]] value က
      ဖေဖော်ဝါရီ ၃ ရက်၊ booking က ဇန်နဝါရီ ၂၇ ရက်ပါ။ ပြီးရင် ဇန်နဝါရီလ စုစုပေါင်းကို value နဲ့ရော
      booking နဲ့ပါ တစ်ကြောင်းတည်းမှာ ပြန်ထုတ်ပါတယ်။ ဒီတစ်ခါ ဂဏန်း ရွေ့သွားမယ့် ဘက်က ခုနက တတိယ
      payment နဲ့ ပြောင်းပြန် ဖြစ်ရပါမယ်။ [[mark:run-3]] run လိုက်ရအောင်။ [[mark:pt-so]] value နဲ့ဆို
      ၂၃၀ ပဲ ရှိနေဆဲပါ၊ standing order က ဖေဖော်ဝါရီလရဲ့ ငွေ ဖြစ်လို့ပါ။ booking နဲ့ဆိုတော့ ၁၅၀ ကနေ
      ၂၁၀ ဖြစ်သွားပါတယ်။ [[mark:dock-3]] booking time နဲ့ report လုပ်ရင် backdated entry က ဂဏန်းကို
      လျော့စေပြီး forward-dated entry က တိုးစေပါတယ်။ နှစ်ခုလုံး ဇန်နဝါရီလမှာ တကယ် ဖြစ်ခဲ့တာနဲ့
      မကိုက်ပါဘူး။
    sources:
      - {
          title: "Fintech Engineering Handbook — Value time vs booking time vs settlement time (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#value-time-vs-booking-time-vs-settlement-time",
        }
    actions:
      - { id: close-month, type: slide.close, at: { mark: close-month } }
      - id: type-so
        type: editor.type
        at: { mark: type-so }
        target:
          {
            file: main.go,
            after: "\tfmt.Println(\"jan by settlement:\", jan(settled))\n",
            occurrence: 1,
          }
        text: "\n\ttxs = append(txs, Tx{\"so-4\", 6000, at(2, 3, 9, 0), at(1, 27, 11, 0)})\n\tfmt.Println(\"with so-4:\", jan(byValue), \"by value,\", jan(byBooking), \"by booking\")\n"
        cadence: line-by-line
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "with so-4: 230.00 by value, 210.00 by booking",
          timeoutMs: 8000,
        }
      - id: pt-so
        type: console.point
        at: { mark: pt-so }
        target: { text: "with so-4", occurrence: 1 }
      - { id: dock-3, type: runtime.collapseDock, at: { mark: dock-3 } }

  - id: close
    chapter: Report ပို့ပြီးမှ ရောက်လာတဲ့ entry
    narration: >-
      [[mark:show-close]] ဒီနေရာကစပြီး ပိုစိတ်ဝင်စားဖို့ ကောင်းလာပါတယ်။ [[mark:pt-sent]] value time နဲ့
      report လုပ်တယ် ဆိုပါစို့၊ ဇန်နဝါရီလ report ကို ဖေဖော်ဝါရီ ၂ ရက်မှာ ယူရို ၂၃၀ လို့ ပို့လိုက်ပါပြီ။
      [[mark:close-2]] ဖေဖော်ဝါရီ ၅ ရက်ကျမှ value က ဇန်နဝါရီ ၃၀ ရက် ဖြစ်တဲ့ entry တစ်ခု ရောက်လာပါတယ်။
      query ကို ပြန် run ရင် ဇန်နဝါရီလက ၂၇၀ ဖြစ်သွားပြီး ပို့ပြီးသား report နဲ့ မကိုက်တော့ပါဘူး။ value
      time နဲ့ ထုတ်တဲ့ report က လ ကုန်သွားတာတောင် ဆက် ပြောင်းနေနိုင်တာပါ။ [[mark:close-3]] booking time
      က ဒီမှာ အသုံးဝင်ပါတယ်။ value က ဇန်နဝါရီ ဖြစ်ပြီး booking က report ပို့တဲ့ အချိန် မတိုင်ခင်
      ဖြစ်တဲ့ entry တွေကိုပဲ ယူရင်၊ ပို့ခဲ့တဲ့ ၂၃၀ ကို ဘယ်အချိန်မဆို ပြန်ထုတ်နိုင်ပါတယ်။ auditor က ဒီ
      ဂဏန်း ဘယ်က ရလာလဲ မေးရင် ဖြေနိုင်တာ ဒါကြောင့်ပါ။ [[mark:pt-open]] ပြင်ပကို report လုပ်ပြီးသား period
      ထဲကို backdate လုပ်ခွင့် များသောအားဖြင့် မရှိပါဘူး။ ဒါကြောင့် နောက်ကျ ရောက်လာတဲ့ entry ကို
      လက်ရှိ ဖွင့်ထားတဲ့ period ထဲမှာ မှတ်ရပါတယ်။ [[mark:pt-recon]] settlement time ကလည်း reconciliation
      ကို ပုံဖော်ပါတယ်။ PSP က T plus two နဲ့ ပေးရင် ဘဏ်ထဲ မရောက်သေးတဲ့ payment တွေက ပထမ နှစ်ရက်မှာ
      ပုံမှန်ပါ၊ expected settlement ရက် မတိုင်ခင် alert မလုပ်မှ false alarm တွေ မထွက်မှာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Value time vs booking time vs settlement time (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#value-time-vs-booking-time-vs-settlement-time",
        }
      - {
          title: "Fintech Engineering Handbook — Reversals and corrections (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#reversals-and-corrections",
        }
      - {
          title: "Fintech Engineering Handbook — Reconciliation (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#reconciliation",
        }
    actions:
      - {
          id: show-close,
          type: slide.show,
          at: { mark: show-close, offsetMs: -700 },
          slideId: close-1,
        }
      - { id: pt-sent, type: slide.point, at: { mark: pt-sent }, target: { x: 0.238, y: 0.42 } }
      - { id: close-2, type: slide.show, at: { mark: close-2 }, slideId: close-2 }
      - {
          id: pt-late,
          type: slide.point,
          at: { afterAction: close-2 },
          target: { x: 0.763, y: 0.42 },
        }
      - { id: close-3, type: slide.show, at: { mark: close-3 }, slideId: close-3 }
      - {
          id: pt-asof,
          type: slide.point,
          at: { afterAction: close-3 },
          target: { x: 0.128, y: 0.746 },
        }
      - { id: pt-open, type: slide.point, at: { mark: pt-open }, target: { x: 0.797, y: 0.787 } }
      - { id: pt-recon, type: slide.point, at: { mark: pt-recon }, target: { x: 0.333, y: 0.92 } }

  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] Fintech interview တွေမှာ transaction တစ်ခုအတွက် timestamp ဘယ်နှခု လိုလဲ ဆိုတာ
      မေးတတ်ပါတယ်။ created at တစ်ခုပဲ လို့ မဖြေပါနဲ့၊ အချက် သုံးချက်နဲ့ ဖြေပါ။ [[mark:iv-a]] ပထမ၊ value၊ booking၊ settlement သုံးခုကို သီးခြား
      သိမ်းမယ်၊ ငွေ မရွှေ့သေးတဲ့ transaction မှာ settlement က ဗလာ ဖြစ်နိုင်တယ်။ [[mark:iv-b]] ဒုတိယ၊
      အဲဒီ အချိန်တွေက period နယ်နိမိတ်မှာ ကွဲတတ်လို့ ဘယ် အချိန်နဲ့ group လုပ်လဲ ဆိုတာက report ရဲ့
      ဂဏန်းကို ပြောင်းစေတယ်။ [[mark:iv-c]] တတိယ၊ settlement ရက်ကို business day၊ cut-off နဲ့ rail ရဲ့
      calendar နဲ့ တွက်ရပြီး၊ reconciliation က အဲဒီ ရက်ကို စောင့်ရတယ်။ [[mark:iv-d]] ပြီးရင် ကိုယ်
      ဘယ်လို သုံးမလဲ ဆက်ပြောပါ။ business report ကို value ဒါမှမဟုတ် settlement နဲ့ ထုတ်မယ်၊ booking
      ကို as-of query အတွက် သုံးမယ်၊ ပိတ်ပြီးသား period ထဲ backdate မလုပ်ဘူး ဆိုတာပါ။
    sources:
