  - id: settle
    chapter: T plus two ကို တွက်ကြည့်
    narration: >-
      [[mark:close-three]] settlement ရက်ကို code နဲ့ တွက်ကြည့်ရအောင်။ [[mark:type-fn]] ဒီ function က
      value ရက်ကနေ စပြီး တစ်ရက်ချင်း ရှေ့တိုးပါတယ်။ စနေ၊ တနင်္ဂနွေ မဟုတ်တဲ့ ရက်ကိုပဲ ရေတွက်ပြီး၊ X ရက်
      ပြည့်တဲ့နေ့ကို settlement ရက်အဖြစ် ပြန်ပေးပါတယ်။ ပြက္ခဒိန် ရက်နဲ့ မဟုတ်ဘဲ business day နဲ့
      ရေတွက်တာက ဒီ function ရဲ့ အဓိက အချက်ပါ။ [[mark:type-use]] main ထဲမှာတော့ ဒုတိယ payment ရဲ့
      settlement ရက်ကို ထုတ်ပြပြီး၊ ဇန်နဝါရီလ စုစုပေါင်းကို settlement ရက်နဲ့ ထပ်တွက်ပါတယ်။ ဒုတိယ
      payment က ကြာသပတေးနေ့ ညနေ သုံးနာရီမှာ ဖြစ်တာပါ။ PSP က T plus two နဲ့ ငွေ ပေးတယ် ဆိုပါစို့။
      [[mark:run-2]] run လိုက်ရအောင်။ [[mark:pt-settles]] ကြာသပတေးကနေ တနင်္လာနေ့ ဖြစ်သွားပါတယ်။
      သောကြာက ပထမ ရက်ဖြစ်ပြီး စနေ တနင်္ဂနွေကို မရေတွက်လို့ တနင်္လာက ဒုတိယ ရက်ပါ။ ပြက္ခဒိန်နဲ့ဆို
      လေးရက် ကြာပြီး လ တစ်လလည်း ကျော်သွားပါတယ်။ [[mark:pt-settlement]] settlement ရက်နဲ့ဆိုရင်
      ဇန်နဝါရီလထဲမှာ ယူရို ငါးဆယ်ပဲ ကျန်ပါတော့တယ်၊ ဇန်နဝါရီ ၂၆ ရက် တနင်္လာနေ့က payment တစ်ခုပါ။
      [[mark:dock-2]] ဆိုတော့ data တစ်ခုတည်း၊ လ တစ်လတည်းအတွက် ယူရို ၂၃၀၊ ၁၅၀ နဲ့ ငါးဆယ် ဆိုပြီး မတူတဲ့
      ဂဏန်း သုံးခု ရပါတယ်။ ဇန်နဝါရီလအတွင်း settlement တကယ် ပြီးသွားတာက နောက်ဆုံး ဂဏန်းပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Transactions, timing & settlement (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#transactions-timing-settlement",
        }
      - { title: "Go standard library — time.Weekday", url: "https://pkg.go.dev/time#Weekday" }
    actions:
      - { id: close-three, type: slide.close, at: { mark: close-three } }
      - id: type-fn
        type: editor.type
        at: { mark: type-fn }
        target:
          {
            file: main.go,
            after: "\tfmt.Println(\"jan by booking:   \", jan(byBooking))\n}\n",
            occurrence: 1,
          }
        text: "\n// settleDate is T+x counted in business days: Saturday and Sunday do not count.\nfunc settleDate(value time.Time, x int) time.Time {\n\td := value\n\tfor x > 0 {\n\t\td = d.AddDate(0, 0, 1)\n\t\tif d.Weekday() != time.Saturday && d.Weekday() != time.Sunday {\n\t\t\tx--\n\t\t}\n\t}\n\treturn d\n}\n"
        cadence: line-by-line
      - id: type-use
        type: editor.type
        at: { mark: type-use }
        target:
          {
            file: main.go,
            after: "\tfmt.Println(\"jan by booking:   \", jan(byBooking))\n",
            occurrence: 1,
          }
        text: "\n\tfmt.Println(\"tx-2 settles:     \", settleDate(txs[1].Value, 2).Format(\"Mon 02 Jan\"))\n\tsettled := func(t Tx) time.Time { return settleDate(t.Value, 2) }\n\tfmt.Println(\"jan by settlement:\", jan(settled))\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "jan by settlement: 50.00",
          timeoutMs: 8000,
        }
      - id: pt-settles
        type: console.point
        at: { mark: pt-settles }
        target: { text: "tx-2 settles", occurrence: 1 }
      - id: pt-settlement
        type: console.point
        at: { mark: pt-settlement }
        target: { text: "jan by settlement", occurrence: 1 }
      - { id: dock-2, type: runtime.collapseDock, at: { mark: dock-2 } }
      - {
          id: expect-file-settle,
          type: expect.file,
          at: { afterAction: run-2 },
          path: main.go,
          contains: "d.Weekday() != time.Saturday && d.Weekday() != time.Sunday",
        }

  - id: tplus
    chapter: Business day၊ cut-off၊ calendar
    narration: >-
      [[mark:show-tplus]] T plus X ကို တွက်တဲ့အခါ ဂရုစိုက်ရတဲ့ အချက် သုံးခု ရှိပါတယ်။ [[mark:pt-sat]]
      ပထမက ခုနက မြင်ခဲ့တဲ့ စနေ တနင်္ဂနွေပါ။ [[mark:tplus-2]] ဒုတိယက cut-off time ပါ။ cut-off ဆိုတာ settlement window
      တစ်ခုအတွက် နေ့စဉ် နောက်ဆုံး အချိန်ပါ၊ အဲဒီ အချိန် ကျော်မှ ဝင်လာတဲ့ transaction က နောက် window
      ထဲ ရောက်သွားပါတယ်။ [[mark:pt-cal]] တတိယက ရုံးပိတ်ရက် calendar ပါ။ ဘယ်ရက်က business day လဲ
      ဆိုတာ rail တစ်ခုချင်း၊ market တစ်ခုချင်းရဲ့ calendar က ဆုံးဖြတ်တာ ဖြစ်လို့ စနေ တနင်္ဂနွေ စစ်ရုံနဲ့
      မလုံလောက်ပါဘူး။ [[mark:tplus-3]] X ရဲ့ တန်ဖိုးကလည်း ပြောင်းလဲနေပါတယ်။ အမေရိကန် securities
      market က ၂၀၂၄ မေလ ၂၈ ရက်မှာ T plus two ကနေ T plus one ကို ပြောင်းခဲ့ပါတယ်။ [[mark:pt-eu]] EU မှာလည်း ၂၀၂၇ အောက်တိုဘာ ၁၁ ရက်ကစပြီး T plus one ဖြစ်ဖို့
      ဥပဒေ ထွက်ထားပါပြီ။ [[mark:pt-sepa]] SEPA Instant လို rail မှာတော့ တစ်နှစ်ပတ်လုံး နေ့ရော ညပါ
      ဆယ်စက္ကန့်အတွင်း လက်ခံသူဆီ ငွေ ရောက်ပါတယ်။ ဆိုတော့ X ကို code ထဲမှာ အသေ ရေးမထားဘဲ rail
      တစ်ခုချင်းရဲ့ configuration အဖြစ် ထားရပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Transactions, timing & settlement (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#transactions-timing-settlement",
        }
      - {
          title: "SEC press release 2023-29 — shortening the securities transaction settlement cycle",
          url: "https://www.sec.gov/news/press-release/2023-29",
        }
      - {
          title: "ECB — Instant payments",
          url: "https://www.ecb.europa.eu/paym/retail/instant_payments/html/index.en.html",
        }
    actions:
      - {
          id: show-tplus,
          type: slide.show,
          at: { mark: show-tplus, offsetMs: -700 },
          slideId: tplus-1,
        }
      - { id: pt-sat, type: slide.point, at: { mark: pt-sat }, target: { x: 0.481, y: 0.513 } }
      - { id: tplus-2, type: slide.show, at: { mark: tplus-2 }, slideId: tplus-2 }
      - {
          id: pt-cutoff,
          type: slide.point,
          at: { afterAction: tplus-2 },
          target: { x: 0.275, y: 0.731 },
        }
      - { id: pt-cal, type: slide.point, at: { mark: pt-cal }, target: { x: 0.725, y: 0.731 } }
      - { id: tplus-3, type: slide.show, at: { mark: tplus-3 }, slideId: tplus-3 }
      - {
