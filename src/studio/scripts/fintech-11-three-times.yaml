  - id: three
    chapter: Value၊ booking၊ settlement
    narration: >-
      [[mark:show-three]] ငွေ system မှာ transaction တစ်ခုကို အချိန် သုံးခုနဲ့ ကြည့်ပါတယ်။
      [[mark:pt-tvalue]] value time ဆိုတာ စီးပွားရေးအရ ဖြစ်ခဲ့တဲ့ အချိန်ပါ၊ card payment ဆိုရင် user က
      ငွေ ပေးလိုက်တဲ့ အချိန်ပါ။ [[mark:three-2]] booking time ကတော့ ကိုယ့် ledger က အဲဒီ entry ကို
      မှတ်လိုက်တဲ့ အချိန်ပါ၊ data ဘယ်လို ဝင်လာလဲ ပေါ်မူတည်ပြီး စက္ကန့်ပိုင်းကနေ ရက်ပိုင်းအထိ
      နောက်ကျနိုင်ပါတယ်။ [[mark:three-3]] settlement time က ငွေ
      တကယ် ရွှေ့တဲ့ အချိန်၊ ဆိုလိုတာက PSP က ကိုယ့် ဘဏ် account ထဲကို ငွေ လွှဲပေးတဲ့ အချိန်ပါ။
      [[mark:pt-span]] အဲဒါကို များသောအားဖြင့် T plus X လို့ ရေးပြီး၊ value ရက်ကနေ business day X
      ရက် အကြာ ဆိုတဲ့ အဓိပ္ပာယ်ပါ။ ကြားထဲ ရက်တွေမှာ ငွေက PSP ဆီမှာ ရှိနေပြီး ကိုယ့် ဘဏ်ထဲ
      မရောက်သေးပါဘူး။ ledger မှာတော့ အဲဒီ ကြားကာလကို receivable account နဲ့ ပြပါတယ်။ ငွေ လွှဲနေတုန်း
      system နှစ်ခုလုံးမှာ ရှိနေသလို၊ ဒါမှမဟုတ် ဘယ်မှာမှ မရှိသလို ဖြစ်နေတဲ့ ငွေကိုတော့ float လို့ ခေါ်ပါတယ်။ [[mark:pt-none]] transaction တိုင်းမှာ
      settlement time ရှိတာ မဟုတ်ပါဘူး။ user နှစ်ယောက်ကြား ledger ထဲမှာပဲ လွှဲတဲ့ internal transfer
      မှာ ဘဏ်က ငွေ ဘယ်မှ မရွှေ့ပါဘူး။ [[mark:pt-lost]] ဒီ အချိန် သုံးခုကို created at တစ်ခုထဲ
      ပေါင်းလိုက်ရင် ပျောက်သွားတာကို နောက်မှ ပြန်ဖော်လို့ မရပါဘူး။ ဒါကြောင့် သုံးခုလုံးကို သိမ်းတာက No lost
      data ဆိုတဲ့ မူ၊ ဆိုလိုတာက ငွေနဲ့ ပတ်သက်ပြီး ဖြစ်ခဲ့သမျှ မပျောက်ရဘူး ဆိုတဲ့ မူရဲ့ အစိတ်အပိုင်း တစ်ခုပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Value time vs booking time vs settlement time (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#value-time-vs-booking-time-vs-settlement-time",
        }
      - {
          title: "Fintech Engineering Handbook — Flow 2: A card deposit (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#flow-2-a-card-deposit",
        }
    actions:
      - {
          id: show-three,
          type: slide.show,
          at: { mark: show-three, offsetMs: -700 },
          slideId: three-1,
        }
      - {
          id: pt-tvalue,
          type: slide.point,
          at: { mark: pt-tvalue },
          target: { x: 0.197, y: 0.442 },
        }
      - { id: three-2, type: slide.show, at: { mark: three-2 }, slideId: three-2 }
      - {
          id: pt-tbooking,
          type: slide.point,
          at: { afterAction: three-2 },
          target: { x: 0.481, y: 0.729 },
        }
      - { id: three-3, type: slide.show, at: { mark: three-3 }, slideId: three-3 }
      - {
