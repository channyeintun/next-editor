  - id: try-it
    chapter: ကိုယ်တိုင် စမ်းကြည့်ပါ
    narration: >-
      [[mark:close-iv]] ကိုယ်တိုင် စမ်းကြည့်ဖို့ တစ်ခု ရှိပါတယ်။ [[mark:sel-try]] တတိယ payment ရဲ့ booking
      time ကို ဇန်နဝါရီ ၃၁ ရက်၊ ည ဆယ့်တစ်နာရီ ငါးဆယ့်ကိုး မိနစ်လို့ ပြောင်းပြီး run ကြည့်ပါ။ booking နဲ့
      တွက်တဲ့ ဇန်နဝါရီလ စုစုပေါင်းက value နဲ့ တွက်တာနဲ့ ညီသွားပြီး၊ settlement နဲ့ တွက်တာကတော့
      မပြောင်းပါဘူး။ [[mark:try-why]] မှတ်တဲ့ အချိန် ငါးမိနစ် ကွာတာလေးက report ကို ယူရို ရှစ်ဆယ်
      ရွှေ့နိုင်တာပါ။ [[mark:recap]] ပြန်ချုပ်ရရင်၊ ငွေ အရွေ့အပြောင်း တစ်ခုမှာ ဖြစ်တဲ့ အချိန်၊ မှတ်တဲ့
      အချိန်၊ ငွေ တကယ် ရွှေ့တဲ့ အချိန် ဆိုပြီး သုံးခု ရှိပြီး၊ report တစ်ခုက ဘယ် အချိန်ကို မေးနေလဲ ဆိုတာ
      သိမှ ဂဏန်း မှန်ပါတယ်။ နောက် lesson မှာတော့ ဘယ်အချိန် ဆိုတာအပြင်၊ ဘယ်သူ လုပ်လဲ၊ ဘာကြောင့် လုပ်လဲ
      ဆိုတာကို audit က ဘယ်လို မေးလဲ ကြည့်ပါမယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Value time vs booking time vs settlement time (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#value-time-vs-booking-time-vs-settlement-time",
        }
    actions:
      - { id: close-iv, type: slide.close, at: { mark: close-iv } }
      - id: sel-try
        type: editor.select
        at: { mark: sel-try }
        target: { file: main.go, text: "at(2, 1, 0, 4)", occurrence: 1 }

checks:
  - { type: timing.p95Ms, max: 300 }
