# Fintech Engineering, lesson 11: value, booking and settlement time (Burmese).
#
# Source: Fintech Engineering Handbook, "Value time vs booking time vs settlement time" and
# Appendix A "Transactions, timing & settlement" (CC BY 4.0, Voytek Pitula).
# Start state: main.go holds three captured card payments with a value and a booking time;
# report.go sums January by a chosen time. Run 1 prints January by value and by booking.
# Edits, all insert-only:
#   1. settleDate: T+x counted in business days (end of main.go)
#   2. two lines in main: when tx-2 settles, January by settlement  -> run-2: Mon 02 Feb, 50.00
#   3. a forward-dated standing order and January again             -> run-3: 230.00 / 210.00
# Figures: three (the three times of one card payment), tplus (T+2 across a weekend, cut-off,
# calendar, real settlement cycles), month (backdated and forward-dated across the month
# boundary), close (a late entry after the report was sent; the as-of query), iv.
# Built by ~/Documents/fintech-course-work/tools/build-lesson.ts; fixtures by sim-go.ts --write.
schemaVersion: 1

lesson:
  slug: fintech-11-three-times
  title: "Fintech Engineering 11: Value၊ booking၊ settlement အချိန်"
  locale: my-MM
  workspace:
    lessonType: go
    name: Fintech Engineering
    entryFilePath: main.go
    files:
      main.go: |
        package main

        import (
        	"fmt"
        	"time"
        )

        // Tx is a card payment captured by the PSP, with the two times we always know.
        type Tx struct {
        	ID      string
        	Amount  int64     // cents
        	Value   time.Time // when the payment happened
        	Booking time.Time // when our system recorded it
        }

        var txs = []Tx{
        	{"tx-1", 5000, at(1, 26, 10, 0), at(1, 26, 10, 0)},
        	{"tx-2", 10000, at(1, 29, 15, 0), at(1, 29, 15, 0)},
        	{"tx-3", 8000, at(1, 31, 23, 58), at(2, 1, 0, 4)},
        }

        func main() {
        	fmt.Println("jan by value:     ", jan(byValue))
        	fmt.Println("jan by booking:   ", jan(byBooking))
        }
      report.go: |
        package main

        import (
        	"fmt"
        	"time"
        )

        // at builds a UTC time in 2026: at(1, 31, 23, 58) is 31 January, 23:58.
        func at(month time.Month, day, hour, minute int) time.Time {
        	return time.Date(2026, month, day, hour, minute, 0, 0, time.UTC)
        }

        func byValue(t Tx) time.Time   { return t.Value }
        func byBooking(t Tx) time.Time { return t.Booking }

        // jan sums the payments whose chosen time falls in January 2026.
        func jan(when func(Tx) time.Time) string {
        	var sum int64
        	for _, t := range txs {
        		if w := when(t); w.Year() == 2026 && w.Month() == time.January {
        			sum += t.Amount
        		}
        	}
        	return cents(sum)
        }

        // cents prints minor units as an amount with two decimals: cents(1234) is "12.34".
        func cents(n int64) string {
        	sign := ""
        	if n < 0 {
        		sign, n = "-", -n
        	}
        	return fmt.Sprintf("%s%d.%02d", sign, n/100, n%100)
        }
