  - id: read-1
    narration: >-
      [[mark:pt-value]] payment ဖြစ်တဲ့ အချိန်နဲ့ဆိုရင် ဇန်နဝါရီလမှာ ယူရို ၂၃၀ ရှိပါတယ်။
      [[mark:pt-booking]] မှတ်တဲ့ အချိန်နဲ့ဆိုရင်တော့ ၁၅၀ ပဲ ရှိပါတယ်။ ယူရို ရှစ်ဆယ်က လ နှစ်လကြား
      ရွေ့သွားတာပါ။ ဂဏန်း နှစ်ခုလုံး မှန်ပါတယ်၊ မေးခွန်း မတူတာပါ။ [[mark:dock-1]] created at
      တစ်ခုတည်း ရှိရင်တော့ ကိုယ့် report က ဘယ် မေးခွန်းကို ဖြေနေလဲ ဆိုတာ ကိုယ်ကိုယ်တိုင်တောင်
      ပြောလို့ မရတော့ပါဘူး။
    sources:
      - {
          title: "Fintech Engineering Handbook — Value time vs booking time vs settlement time (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#value-time-vs-booking-time-vs-settlement-time",
        }
