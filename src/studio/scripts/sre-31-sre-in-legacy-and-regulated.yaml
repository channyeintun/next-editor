# SRE from zero, lesson 31: SRE in old, regulated companies (Burmese concept lesson).
#
# Built from the approved voice script
# docs/sre-course/voice-scripts/sre-31-sre-in-legacy-and-regulated.md. Every
# spoken character is that script's "> " lines, unchanged; each ⟪…⟫ marker
# became a [[mark:…]] at the same place. Check it with:
#   bun ~/Documents/sre-course/work/check-narration.ts \
#     docs/sre-course/voice-scripts/sre-31-sre-in-legacy-and-regulated.md \
#     src/studio/scripts/sre-31-sre-in-legacy-and-regulated.yaml
#
# Nothing runs: deck pages and the whiteboard carry the lesson, and notes.md is
# the recap. The workspace and runtime follow the validated no-code skeleton
# (WebContainer, empty init command, a harmless dev script).
#
# Three marks add no spoken text and sit at an existing ။: hook-midnight
# splits the hook's narration at its paragraph break (one 485-character
# dialog would pass the 450-character limit; no action uses it); b1-s4b lands
# B1's "70 မိနစ် → 5 မိနစ်" box on the sentence that says it (the drill), not
# ~24 s early; and b2-s1b lands B2's "restart script" label on its own
# sentence, not ~15 s early. ask-question is the voice script's
# ⟪select မေးခွန်း⟫, which already starts the question's own dialog, so the
# question-line select hangs off it for the ⟪pause 3s⟫ (pause-question), as
# in Module 1.
#
# Pacing: at 70 ms/char no page or board step holds longer than ~37 s (the
# longest is the cover, l31_p01, counting the 1.45 s it shows before the
# first word; next is l31_p04c at ~31 s), so the voice script's own markers
# carry it and no pacing page or board step was added.
#
# Every board here is followed by a deck page and every run of pages by a
# board, so a board closes the panel (open: false) 400 ms before the next
# page, and a page closes 400 ms before the next board draws with open: true,
# clear: true, as in Module 1.
#
# Boards (B1 a P1 flow with its guards and outcomes below it, B2 a P1 flow
# into the wrapped vendor system, B3 a P2 fan-in comb, B4 a P2 fan-out comb).
# Colour jobs: #1e1e1e ink (paints white) for arrows and the buses; blue the
# thing named (the incident commander's mandate, users and Padauk's gateway,
# the three data sources, the three lenses); green healthy or done
# (70 → 5 minutes, the user-success alert, the gateway fix); red failure (the
# read-only desk, the closed vendor system, NRC numbers in the vendor's logs);
# orange the caveat or limit (break-glass and its three guards, the
# setup-as-code boundary and its restart script, "blameless ≠ no owner", the
# vulnerability rule); violet the result (the postmortem sent as the
# regulator's report, the one SLO report). The voice script's "gray" (old or
# risky, as on the slides, where the brand has no red) is drawn red: the
# board palette has no gray, and red is the course's colour for what failed.
# A label on two or three lines is one text asset per line, so each line
# meets the 0.55 em width rule on its own; every label was also measured in
# Chrome with Excalidraw's Virgil font and fits its box. B2's gateway line
# "timeout · queue · metric · config check" and its alert line need ~600 px
# each under that rule, so the gateway runs on three lines and the alert on
# two, and the boundary's label sits on two lines inside the orange outline;
# B4's source box runs on two lines too, so the fan-out fits. B2's arrow into
# the vendor box crosses the orange boundary on purpose: every request passes
# through the layer Padauk owns.
#
# Deck pages: deck "Next Editor · SRE 6B · Where you work, and what's next"
# (published). Until the lead builds this lesson's pages from the page plan,
# the Director reports the l31 pages missing from the published deck. On
# l31_p03 only the middle card has a term (ဘယ်မှာမဆို), per the voice script's
# "term: line" item. Page plan:
# ~/Documents/sre-course/work/pages/sre-31-sre-in-legacy-and-regulated.json
#
