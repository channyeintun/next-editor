  - id: sre-here
    chapter: ဒီမှာ SRE ဆိုတာ
    narration: >
      [[mark:close-b4]] [[mark:show-p04c]] Padauk က SRE ကို tool တစ်ခုလို ဝယ်ခဲ့တာ မဟုတ်ပါဘူး။ ကိုယ့် အရွယ်အစား၊ budget နဲ့ regulator ကို ကိုက်တဲ့ အလေ့အထတွေကို ရွေးပြီး ပြင်သုံးခဲ့တာမို့ SRE က စည်းမျဉ်း စာရင်း မဟုတ်ဘဲ တွေးပုံ တစ်ခုပါ။
      Parcel မှာ SRE က ကိုမင်း တစ်ယောက်တည်း၊ Padauk မှာ platform အဖွဲ့ ဖြစ်သလို ကိုယ့်ဆီမှာ on-call rotation ဒါမှမဟုတ် ပိုအားကောင်းတဲ့ DevOps အဖွဲ့ ဖြစ်နိုင်ပါတယ်။ ဒါပေမဲ့ အချိန်နဲ့ manager ရဲ့ ထောက်ခံမှု မရှိရင် ဘယ်ပုံစံမှ အလုပ်မဖြစ်ပါဘူး။
      [[mark:show-p05]] ကုမ္ပဏီ အဟောင်းမှာလည်း ဒီအပတ် စလို့ရတာ သုံးခုပါ။ ညဘက် incident မှာ အရေးပေါ် access ကို ဘယ်သူ အတည်ပြုမလဲ စာနဲ့ ရေးထားပါ။ အဖွဲ့နဲ့ တစ်နာရီ ထိုင်ပြီး toil audit သေးသေးလေး လုပ်ကြည့်ပါ။ ပြီးတော့ ကိုယ့်ဆီမှာ SRE ဆိုတာ ဘာလဲ စာပိုဒ် တစ်ပိုဒ် ရေးကြည့်ပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "From Nothing to SRE: Implementing SRE in Smaller Organisations (SREcon19 EMEA)",
          url: "https://www.usenix.org/conference/srecon19emea/presentation/huxtable",
        }
      - {
          title: "Succeeding as the Lone SRE in a Small Team (SREcon23 EMEA)",
          url: "https://www.usenix.org/conference/srecon23emea/presentation/kirchmeier",
        }
    actions:
      - {
          id: close-b4,
          type: whiteboard.apply,
          at: { mark: close-b4, offsetMs: -400 },
          open: false,
        }
      - { id: show-p04c, type: slide.show, at: { mark: show-p04c }, slideId: l31-p04c }
      - { id: show-p05, type: slide.show, at: { mark: show-p05 }, slideId: l31-p05 }

  - id: recap
    narration: >
      [[mark:close-p05]] [[mark:open-notes]] ဘဏ်ဘက်ကို ကိုဇော် ယူသွားခဲ့တဲ့ အလေ့အထတွေပါ။ [[mark:sel-break-glass]] break-glass က အရေးပေါ်မှာ ပုံမှန် ကန့်သတ်ချက်ကို ကျော်လို့ရအောင် ကြိုသဘောတူထားတဲ့ လမ်းပါ။ [[mark:sel-toil-audit]] toil audit က complaint ကို နာရီနဲ့ incident ပါတဲ့ business case ဖြစ်အောင် ပြောင်းပေးပါတယ်။ [[mark:sel-acl]] anticorruption layer က ပြင်လို့မရတဲ့ system ရှေ့က ကိုယ်ပိုင် gateway ပါ။
      [[mark:sel-sponsor]] executive sponsor က အချိန်နဲ့ ရင်းမြစ် ပေးပြီး ထောက်ခံတဲ့ ခေါင်းဆောင် ဖြစ်ပြီး၊ [[mark:sel-one-report]] SLO report တစ်ခုတည်းက ရှိပြီးသား tool တွေကို ဖတ်ပြီး ကိန်းဂဏန်း တစ်စုတည်း ပြပေးပါတယ်။
      [[mark:ask-question]] ကိုယ့် ပြင်ပ support desk က incident အတွင်း ကြည့်ရုံပဲ ကြည့်နိုင်တယ် ဆိုရင် အရေးပေါ် access ကို ဘေးကင်းအောင် ဘယ် အကာအကွယ် နှစ်ခု ထည့်မလဲ?
      [[mark:pause-question]] အချိန် ကန့်သတ်ချက်၊ ဒုတိယ လူရဲ့ အတည်ပြုချက်နဲ့ audit log ထဲက နှစ်ခု ဆိုရင် မှန်ပါတယ်။ နောက်ဆုံး lesson ကတော့ Padauk ရဲ့ နှစ်ကုန် review ပါ၊ သုံးလစာ uptime ကိန်းဂဏန်းတွေက ရှေ့မှာ ဘာလာမလဲ ဘာမှ မပြောခဲ့ပါဘူး။ ဒါဆို ဘာက ကြိုပြောနိုင်မလဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Workbook: SRE: Reaching Beyond Your Walls",
          url: "https://sre.google/workbook/reaching-beyond/",
        }
      - {
          title: "Strangler Fig Application (Martin Fowler)",
          url: "https://martinfowler.com/bliki/StranglerFigApplication.html",
        }
    actions:
      - { id: close-p05, type: slide.close, at: { mark: close-p05 } }
      - {
          id: open-notes,
          type: workspace.openFile,
          at: { mark: open-notes, offsetMs: 300 },
          path: notes.md,
        }
      - {
          id: sel-break-glass,
          type: editor.select,
          at: { mark: sel-break-glass },
          target: { file: notes.md, text: "break-glass", occurrence: 1 },
        }
      - {
          id: sel-toil-audit,
          type: editor.select,
          at: { mark: sel-toil-audit },
          target: { file: notes.md, text: "toil audit", occurrence: 1 },
        }
      - {
          id: sel-acl,
          type: editor.select,
          at: { mark: sel-acl },
          target: { file: notes.md, text: "anticorruption layer", occurrence: 1 },
        }
      - {
          id: sel-sponsor,
          type: editor.select,
          at: { mark: sel-sponsor },
          target: { file: notes.md, text: "executive sponsor", occurrence: 1 },
        }
      - {
          id: sel-one-report,
          type: editor.select,
          at: { mark: sel-one-report },
          target: { file: notes.md, text: "SLO report တစ်ခုတည်း", occurrence: 1 },
        }
      # The voice script's ⟪select မေးခွန်း⟫ and ⟪pause 3s⟫, the way the Module 1
      # reviewers fixed the pause. ⟪select မေးခွန်း⟫ (ask-question) already starts
      # the question's own dialog, but a select right there would drag under the
      # question and leave no pause, and one at pause-question would drag under
      # the answer's first words (the scheduler holds only the dialog after its
      # anchor's). So the question-line select hangs off ask-question with an
      # offset of about the question's length: it starts about as the question
      # ends, its drag runs in silence, and the answer at pause-question waits
      # for it. The question is 137 characters with no ၊ to split at, so the
      # quiet depends on the voice's speed: 9250 leaves about 2.8 / 0.74 / 0.35 s
      # before the answer at 55 / 70 / 95 ms per char (at 95 the drag starts
      # under the question's last words, as in lessons 10 and 14); an offset
      # above ~9305 trips compile-check's 2.5 s inserted-silence warning at 55.
      - id: select-question
        type: editor.select
        at: { mark: ask-question, offsetMs: 9250 }
        target:
          file: notes.md
          text: "မေးခွန်း: ပြင်ပ desk က incident မှာ ကြည့်ရုံပဲ ရတယ်။ အရေးပေါ် access ကို ဘေးကင်းအောင် လုပ်တဲ့ အကာအကွယ် နှစ်ခုက ဘာလဲ?"
          occurrence: 1

