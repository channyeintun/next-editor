build:
  # Studio swaps in the Burmese voice chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 2631

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: hook
    chapter: ညသန်းခေါင်မှာ ပိတ်မိတဲ့ wallet
    narration: >
      [[mark:show-p01]] ကိုမင်းက Parcel ရဲ့ ပထမဆုံး Site Reliability Engineer၊ SRE ဖြစ်ချိန်မှာ Padauk ကလည်း Bank X နဲ့ partner ဖြစ်လာလို့ ဘဏ်ရဲ့ စည်းမျဉ်းတွေ၊ ပြင်လို့မရတဲ့ vendor system တွေကြားမှာ အလုပ်လုပ်ရပါပြီ။ ဒီ အလုပ်ကို ဘဏ်မှာ system administrator လုပ်ခဲ့ဖူးတဲ့ ကိုဇော်က ဦးဆောင်ပါတယ်။
      [[mark:hook-midnight]] တစ်ည ၁၂ နာရီမှာ job တစ်ခု မှားသွားလို့ wallet တွေ ပိတ်မိသွားပြီး user တွေ ငွေလွှဲလို့ မရတော့ပါဘူး။ ညဘက်အတွက် ငှားထားတဲ့ ပြင်ပ support desk က ချက်ချင်း မြင်ပေမဲ့ read-only access ပဲ ရှိလို့ ကြည့်ရုံပဲ ကြည့်နိုင်ပါတယ်။
      [[mark:show-p01b]] desk က engineer တွေကို လိုက်ဖုန်းဆက်ရပါတယ်။ ပြင်နည်း သိတဲ့သူ ရောက်လာတော့လည်း compliance ခွင့်ပြုချက် မရမချင်း production data ကို မပြင်ရဘူးလို့ စည်းမျဉ်းက ဆိုတယ် ဆိုပါစို့။ ပြင်တာက ၅ မိနစ်ပဲ ကြာပေမဲ့ wallet တွေ မိနစ် ၇၀ ပိတ်မိနေခဲ့ပါတယ်။ ကျန်တဲ့ မိနစ် ၆၅ က ဘယ်ရောက်သွားလဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Workbook: SRE: Reaching Beyond Your Walls",
          url: "https://sre.google/workbook/reaching-beyond/",
        }
    actions:
      # -1750 / -1450, as in Module 1: a pull-back over 1780 ms pushes the first dialog
      # past the 2 s opening handle, which src/studio/plans/index.test.ts rejects.
      - { id: collapse-dock, type: runtime.collapseDock, at: { scene: start, offsetMs: -1750 } }
      - {
          id: show-p01,
          type: slide.show,
          at: { mark: show-p01, offsetMs: -1450 },
          slideId: l31-p01,
        }
      - { id: show-p01b, type: slide.show, at: { mark: show-p01b }, slideId: l31-p01b }

  - id: authority-access
    chapter: မြင်ခွင့်နဲ့ လုပ်ခွင့်
    narration: >
      [[mark:close-p01b]] [[mark:b1-s1]] ၆၅ မိနစ်လုံး လုပ်ခွင့် ရှိတဲ့သူကို ရှာရင်း ကုန်သွားတာပါ။ incident ကို တုံ့ပြန်တဲ့သူမှာ မြင်ခွင့် ရှိရုံနဲ့ မလုံလောက်ပါဘူး၊ ပြင်ခွင့်ပါ ရှိရပါမယ်။ ဒါကြောင့် incident ကို ညှိပြီး ဆုံးဖြတ်တဲ့ incident commander က ဘယ် engineer ကိုမဆို နှိုးခွင့်နဲ့ အရေးပေါ် access ကို အတည်ပြုခွင့် ရှိတယ်လို့ CTO ကိုနေလင်းက စာနဲ့ ကြေညာပေးပါတယ်။
      [[mark:b1-s2]] ဒါပေမဲ့ နှိုးလိုက်တဲ့ engineer မှာ access မရှိရင် ထပ်စောင့်ရမှာပါပဲ။ ဒါကြောင့် အရေးပေါ်မှာ ပုံမှန် ကန့်သတ်ချက်တွေကို ကျော်လို့ရတဲ့ break-glass လမ်းကို compliance အဖွဲ့နဲ့ ကြိုသဘောတူထားပါတယ်။
      [[mark:b1-s3]] ဒီ လမ်းမှာ အကာအကွယ် သုံးခု ပါပါတယ်။ access က ၂ နာရီနဲ့ အလိုအလျောက် ပြန်ပိတ်တယ်၊ ဒုတိယ လူတစ်ယောက် အတည်ပြုမှ ပွင့်တယ်၊ ဘယ်သူ ဘာလုပ်ခဲ့လဲကို ပြင်လို့မရတဲ့ audit log ထဲ မှတ်ပါတယ်။ ပုံမှန်နေ့တွေမှာတော့ တကယ် လိုတဲ့ permission လောက်ပဲ ပေးတဲ့ least privilege နဲ့ သွားပြီး ဒီ စည်းတွေကို incident မှာသာ မဟုတ်ဘဲ production access အားလုံးမှာ သုံးပါတယ်။
      [[mark:b1-s4]] desk ကတော့ read-only အတိုင်းပါပဲ။ ဒါပေမဲ့ postmortem မှာ desk က ကြည့်ပဲ ကြည့်နိုင်ခဲ့တယ်လို့ ပြောတော့ အဲဒီ စကားက incident commander ကို တိုက်ရိုက် page ပို့ခွင့် ပေးမယ့် action item ဖြစ်လာပြီး owner လည်း ရပါတယ်။ အဲဒါ လုပ်ဖို့ အချိန် ပေးတဲ့ ကိုနေလင်းလို ထောက်ခံပြီး ရင်းမြစ် ပေးတဲ့ ခေါင်းဆောင်ကို executive sponsor လို့ ခေါ်ပါတယ်။ [[mark:b1-s4b]] နောက်လ drill မှာတော့ အစကနေ အဆုံး ၅ မိနစ်နဲ့ ပြီးသွားပါတယ်။
      [[mark:b1-s5]] ငွေကြေး လုပ်ငန်းတွေကို စစ်တဲ့ regulator က ကြာကြာ ပျက်တဲ့ incident တိုင်းအတွက် report တောင်းတယ် ဆိုပါစို့။ Padauk က report သီးသန့် မရေးဘဲ ဒီ postmortem ကိုပဲ ပို့ပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Workbook: SRE: Reaching Beyond Your Walls",
          url: "https://sre.google/workbook/reaching-beyond/",
        }
    actions:
      - { id: close-p01b, type: slide.close, at: { mark: close-p01b, offsetMs: -400 } }
      - id: b1-s1
        type: whiteboard.apply
        at: { mark: b1-s1 }
        open: true
        clear: true
        upsertIds: [l31-b1-ic, l31-b1-ic-t1, l31-b1-ic-t2]
        drawMs: 1400
      - id: b1-s2
        type: whiteboard.apply
        at: { mark: b1-s2 }
        upsertIds: [l31-b1-a1, l31-b1-bg, l31-b1-bg-t]
        drawMs: 1200
      # The three guards under break-glass.
      - id: b1-s3
        type: whiteboard.apply
        at: { mark: b1-s3 }
        upsertIds: [l31-b1-g1, l31-b1-g2, l31-b1-g3]
        drawMs: 1800
      - id: b1-s4
        type: whiteboard.apply
        at: { mark: b1-s4 }
        upsertIds: [l31-b1-desk, l31-b1-desk-t]
        drawMs: 1000
      # "70 → 5 minutes" lands as the drill sentence says it.
      - id: b1-s4b
        type: whiteboard.apply
        at: { mark: b1-s4b }
        upsertIds: [l31-b1-fast, l31-b1-fast-t]
        drawMs: 1000
      - id: b1-s5
        type: whiteboard.apply
        at: { mark: b1-s5 }
        upsertIds: [l31-b1-report, l31-b1-report-t]
        drawMs: 1400

  - id: business-case
    chapter: Complaint ကနေ business case ဆီ
    narration: >
      [[mark:close-b1]] [[mark:show-p02]] ကိုဇော်ရဲ့ နောက်ပြဿနာက Bill Pay နောက်ကွယ်က vendor billing system ပါ၊ ဝယ်ထားပေမဲ့ code ကို ပြင်လို့ မရပါဘူး။ မီတာခ ပေးရက် နီးတိုင်း ပျက်တတ်လို့ restart လုပ်တာ၊ settlement ဖိုင် ပြင်တာတွေကို လက်နဲ့ လုပ်ရပါတယ်။ ဒီလို ထပ်ခါထပ်ခါ လုပ်ရတဲ့ လက်အလုပ်၊ toil များလွန်းတယ်လို့ အဖွဲ့က ပြောခဲ့ပေမဲ့ ဘယ်သူမှ နားမထောင်ခဲ့ပါဘူး။
      [[mark:show-p02b]] ကိုဇော်က အဲဒီ အလုပ် လုပ်တဲ့သူတွေနဲ့အတူ toil ကို နာရီနဲ့ incident အရေအတွက်နဲ့ တိုင်းတဲ့ toil audit လုပ်ပါတယ်။ တစ်လ ၄၅ နာရီ ကုန်ပြီး လက်နဲ့ ပြင်တဲ့ ဖိုင်တွေကြောင့် incident နှစ်ခု ဖြစ်ခဲ့တာ ထွက်လာပါတယ်။ automate လုပ်ရင် ဒီ နာရီတွေ product အလုပ်ဆီ ပြန်ရမယ် ဆိုတော့ complaint က business case ဖြစ်သွားပြီး ကိုနေလင်းက ချက်ချင်း ခွင့်ပြုပါတယ်။
      [[mark:show-p02c]] ဒါပေမဲ့ ထပ်မဖြစ်အောင် ကြိုကာတဲ့ အလုပ်မှာ ခေါင်းဆောင်က အချိန် ပေးရုံ မကဘဲ အဖွဲ့ကလည်း action item တွေ လုပ်မယ်လို့ ကတိ ပေးရပါတယ်။ automation ကလည်း ဆောက်ပြီး မေ့ထားလို့ရတာ မဟုတ်လို့ script တိုင်းမှာ owner ထားပြီး script မှားတဲ့နေ့မှာလည်း ရေးတဲ့သူကို အပြစ်မရှာဘဲ blameless review လုပ်ပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Workbook: SRE: Reaching Beyond Your Walls",
          url: "https://sre.google/workbook/reaching-beyond/",
        }
    actions:
      - {
          id: close-b1,
          type: whiteboard.apply,
          at: { mark: close-b1, offsetMs: -400 },
          open: false,
        }
      - { id: show-p02, type: slide.show, at: { mark: show-p02 }, slideId: l31-p02 }
      - { id: show-p02b, type: slide.show, at: { mark: show-p02b }, slideId: l31-p02b }
      - { id: show-p02c, type: slide.show, at: { mark: show-p02c }, slideId: l31-p02c }

  - id: wrap-vendor
    chapter: Vendor system ရှေ့က ကိုယ်ပိုင် အလွှာ
    narration: >
      [[mark:close-p02c]] [[mark:b2-s1]] vendor system ရဲ့ အထဲကို မပြင်နိုင်ပေမဲ့ ပတ်ဝန်းကျင်ကိုတော့ Padauk ပိုင်ပါတယ်။ ဒါကြောင့် server၊ network နဲ့ setting တွေကို click နှိပ်ပြီး မပြင်ဘဲ code နဲ့ ရေးတဲ့ infrastructure as code နဲ့ စီမံပါတယ်။ [[mark:b2-s1b]] ခဏခဏ ရပ်တတ်တဲ့ ချိတ်ဆက်မှုအတွက်လည်း restart script ရိုးရိုးလေး ရေးပါတယ်။
      [[mark:b2-s2]] ပြီးတော့ vendor ရှေ့မှာ Padauk ကိုယ်ပိုင် gateway ထားလို့ request တိုင်း အဲဒီကို ဖြတ်ရပါတယ်။ gateway က vendor နှေးရင် timeout နဲ့ ဖြတ်တယ်၊ ပေးရက်မှာ များလာတဲ့ request တွေကို queue ထဲ စီတယ်၊ metric ထုတ်ပြီး config ပြောင်းတိုင်း check နဲ့ စစ်ပါတယ်။ ပြင်လို့မရတဲ့ system ရှေ့က ဒီလို ကိုယ်ပိုင် ကာကွယ်ရေး အလွှာကို anticorruption layer လို့ ခေါ်ပါတယ်။
      [[mark:b2-s3]] alert ကိုလည်း vendor ရဲ့ အတွင်း ကိန်းဂဏန်းပေါ်မှာ မထားဘဲ user ဘေလ် ဆောင်တာ ဘယ်လောက် အောင်မြင်လဲ ဆိုတာပေါ်မှာ ထားပါတယ်၊ ဒီလို user ဘက်က alert က system ဟောင်း အသစ် မရွေး အလုပ်ဖြစ်ပါတယ်။ အောက်က system တွေ မတူပေမဲ့ သူတို့ကို စီမံတဲ့ code နဲ့ monitoring ကိုတော့ ပုံစံ တစ်ခုတည်း ထားပါတယ်။
    sources:
