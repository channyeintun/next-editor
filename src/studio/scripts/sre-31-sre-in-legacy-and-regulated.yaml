  - id: monsoon
    chapter: မိုးရာသီ ရေကြီးတဲ့ည
    narration: >
      [[mark:close-b3]] [[mark:show-p04]] incident မှာ လေ့ကျင့်ထားတဲ့ စွမ်းရည်က software နဲ့ မဆိုင်တဲ့ အကျပ်အတည်းမှာလည်း အသုံးဝင်ပါတယ်။ မိုးရာသီ ညတစ်ညမှာ ရန်ကုန် မြို့နယ် တချို့ ရေကြီးလို့ rider တွေ ပိတ်မိပြီး ဆိုင်တချို့ internet ပြတ်သွားတော့ Padauk က incident ကြေညာပါတယ်။ rider တိုင်းကို လုံခြုံလား ဖုန်းဆက်မေးတယ်၊ ဆိုင်တွေကို cash on delivery ပြောင်းပေးတယ်၊ status page တစ်ခုတည်းမှာ လူတိုင်းအတွက် update တင်ပါတယ်။
      [[mark:show-p04b]] အဲဒီညက ပုံစံက မီးသတ်နဲ့ ကယ်ဆယ်ရေး အဖွဲ့တွေ သုံးတဲ့ Incident Command System ကနေ ယူထားတာပါ၊ incident commander က ညှိပေးရုံပဲ လုပ်ပြီး rider အဖွဲ့၊ ဆိုင်ဘက် အဖွဲ့နဲ့ support က ကိုယ့်နယ်ပယ်မှာ ကိုယ်တိုင် လုပ်ကြတာပါ။ Padauk က လူတိုင်း call တစ်ခုထဲ ဝင်ဖို့ ကြီးလွန်းပြီး အချိန်ပြည့် အရေးပေါ် အဖွဲ့ ထားဖို့ သေးလွန်းလို့ ဒီပုံစံနဲ့ ကိုက်ပါတယ်။
    sources:
