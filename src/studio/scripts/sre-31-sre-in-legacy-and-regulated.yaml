      notes.md: |
        # ကုမ္ပဏီကြီး အဟောင်းတွေထဲက SRE

        - break-glass — အရေးပေါ်မှာ ကန့်သတ်ချက်ကို ကျော်ဖို့ ကြိုသဘောတူထားတဲ့ လမ်း
        - toil audit — complaint ကို နာရီနဲ့ incident ပါတဲ့ business case ဖြစ်အောင်
        - anticorruption layer — ပြင်လို့ မရတဲ့ system ရှေ့က ကိုယ်ပိုင် gateway
        - executive sponsor — အချိန်နဲ့ ရင်းမြစ် ပေးပြီး ထောက်ခံတဲ့ ခေါင်းဆောင်
        - SLO report တစ်ခုတည်း — ရှိပြီးသား tool တွေကို ဖတ်ပြီး ကိန်းဂဏန်း တစ်စုတည်း

        မေးခွန်း: ပြင်ပ desk က incident မှာ ကြည့်ရုံပဲ ရတယ်။ အရေးပေါ် access ကို ဘေးကင်းအောင် လုပ်တဲ့ အကာအကွယ် နှစ်ခုက ဘာလဲ?
