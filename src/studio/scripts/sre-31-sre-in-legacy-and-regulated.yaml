  - id: cant-change
    narration: >
      [[mark:close-b2]] [[mark:show-p03]] system ဟောင်း အသစ် ရောနေတဲ့ နေရာမှာ အားလုံးကို တစ်ပြိုင်နက် မပြင်ပါနဲ့၊ Padauk ကလည်း Bill Pay တစ်ခုကနေ စခဲ့တာပါ။ incident မှာလည်း အတွင်းကို နားမလည်ဘဲ ဘယ်မှာမဆို လုပ်လို့ရတဲ့ rollback၊ traffic လွှဲတဲ့ drain၊ အရန်ဆီ ပြောင်းတဲ့ failover ကို အရင် သုံးပါတယ်။ ပြင်လို့ မရတဲ့ system ဖြစ်ပေမဲ့ ပြန်ထူတာကိုတော့ drill နဲ့ လေ့ကျင့်ထားပါတယ်။
      [[mark:show-p03b]] automate လုပ်မလား လူ လုပ်မလား ဆိုရင် Padauk က လူကို စောင့်ရတာက ပိုအန္တရာယ် များမှပဲ automate လုပ်ပါတယ်၊ ဥပမာ ချိတ်ဆက်မှု ရပ်ရင် restart script က ချက်ချင်း run ပါတယ်။ ဝန်ဆောင်ခ ဇယားကတော့ lesson ၂ က typo လို တစ်လုံး မှားရင် user တိုင်း ထိမှာမို့ script ကို မပေးဘဲ လူကပဲ ပြောင်းပါတယ်။
    sources:
