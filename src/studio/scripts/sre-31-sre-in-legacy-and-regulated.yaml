  - id: three-lenses
    chapter: ပြဿနာ တစ်ခု၊ ရှုထောင့် သုံးခု
    narration: >
      [[mark:close-p04b]] [[mark:b4-s1]] အပတ် အနည်းငယ် ကြာတော့ vendor system နှေးလို့ alert တက်ပါတယ်။ ကိုဇော် ဝင်ကြည့်တော့ disk ပြည့်နေပြီး vendor က customer တွေရဲ့ NRC နံပါတ်တွေကို log ထဲ ရေးထည့်နေတာ တွေ့ပါတယ်။ ဒါကို ရှုထောင့် သုံးခုကနေ ကြည့်ရအောင်။
      [[mark:b4-s2]] reliability ဘက်က log တွေ ကြီးလာလို့ storage ဘေလ် တက်ပြီး disk ပြည့်ရင် system ရပ်နိုင်တဲ့ ပြဿနာပါ။ security ဘက်ကတော့ log ရသွားတဲ့ ဘယ်သူမဆို NRC နံပါတ်တွေကို ယူသွားနိုင်တဲ့ ပြဿနာပါ။
      [[mark:b4-s3]] privacy ဘက်ကတော့ အထောက်အထား စစ်ဖို့ပဲ ပေးခဲ့တဲ့ data ကို log ထဲ သိမ်းထားတဲ့ ပြဿနာပါ။ ဘာက ပျက်နိုင်လဲ ကြိုရှာတဲ့ အလေ့အထက သုံးခုလုံး တူပေမဲ့ ရန်က မတူပါဘူး။ reliability ရဲ့ ရန်က ပမာဏပါ၊ ငွေလွှဲ သန်းချီ ရှိရင် ရှားတဲ့ အမှားတောင် နေ့တိုင်း ကြုံရလို့ပါ။ security ရဲ့ ရန်က NRC ကို ခိုးချင်တဲ့သူ၊ privacy ရဲ့ ရန်ကတော့ ပေးခဲ့တဲ့ ရည်ရွယ်ချက်ထက် ကျော်သုံးတာပါ။
      [[mark:b4-s4]] ပြင်နည်းကတော့ တစ်ခုတည်းပါ၊ gateway က vendor မလိုတဲ့ NRC နံပါတ်ကို ဖြုတ်ပစ်ပြီး log ဟောင်းတွေကို ရှင်းလိုက်တော့ ရှုထောင့် သုံးခုလုံး တစ်ပြိုင်နက် ကောင်းသွားပါတယ်။
      [[mark:b4-s5]] library တစ်ခုမှာ လုံခြုံရေး အားနည်းချက်၊ vulnerability ပေါ်တော့လည်း Padauk က incident တစ်ခုတည်းအဖြစ် run ပါတယ်။ အဖွဲ့တိုင်းအတွက် ပြီးတယ် ဆိုတာ upgrade လုပ်ပြီးတာ ဒါမှမဟုတ် စာနဲ့ ရေးထားတဲ့ exception ရှိတာ ဖြစ်ပြီး အခြေအနေကို တစ်နေရာတည်းမှာ မှတ်ပါတယ်၊ ပြီးပြီလို့ ပြောရုံနဲ့ မရဘဲ သက်သေ ပြရပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Workbook: SRE: Reaching Beyond Your Walls",
