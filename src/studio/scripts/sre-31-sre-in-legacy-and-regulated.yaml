  - id: one-report
    chapter: SLO report တစ်ခုတည်း
    narration: >
      [[mark:close-p03b]] [[mark:b3-s1]] ကိုဇော်က SRE အလေ့အထတွေကို Bank X ဘက်အထိ ယူသွားချင်ပါတယ်။ ဒါပေမဲ့ incident တိုင်းမှာ vendor၊ Padauk နဲ့ ဘဏ်က ကိုယ့် monitoring ကိုယ် ပြပြီး ဘယ်သူ့ ကိန်းဂဏန်း မှန်လဲ ငြင်းနေကြပါတယ်။
      [[mark:b3-s2]] ဘဏ်ကို tool အသစ် ပြောင်းဖို့ အမိန့် ပေးလို့ မရတော့ ကိုဇော်က ရှိပြီးသား သုံးခုလုံးကို ဖတ်တဲ့ SLO report တစ်ခုတည်းကို ဆောက်ပါတယ်၊ အားလုံး ကိန်းဂဏန်း တစ်စုတည်းကို ကြည့်လာတော့ ငြင်းတာ ရပ်သွားပါတယ်။ ဘဏ်လို ယုံကြည်မှု နည်းပြီး ကျွမ်းကျင်သူ ရှားတဲ့ နေရာမှာ lesson ၁၅ မှာလို SRE ကို အဖွဲ့တိုင်းထဲ ခွဲထည့်တာထက် ဗဟိုက အဖွဲ့ငယ်လေးက ပိုအလုပ်ဖြစ်တတ်ပါတယ်။
      [[mark:b3-s3]] ဘဏ်နဲ့ vendor ပါတဲ့ postmortem တွေမှာတော့ blameless ဆိုတဲ့ စကားကို ဒိုင်းအဖြစ် သုံးပြီး action item ရှောင်လာကြပါတယ်။ ဒါကြောင့် ကိုဇော်က blameless ဆိုတာ လူကို အပြစ်မရှာတာပါ၊ action item တိုင်းမှာတော့ owner ရှိရမယ်လို့ ပြန်ရှင်းပြပါတယ်။
    sources:
