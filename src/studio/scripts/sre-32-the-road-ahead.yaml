# SRE from zero, lesson 32: The road ahead (Burmese concept lesson).
#
# Built from the approved voice script
# docs/sre-course/voice-scripts/sre-32-the-road-ahead.md. Every spoken
# character is that script's "> " lines, unchanged; each ⟪…⟫ marker became a
# [[mark:…]] at the same place. Check it with:
#   bun ~/Documents/sre-course/work/check-narration.ts \
#     docs/sre-course/voice-scripts/sre-32-the-road-ahead.md \
#     src/studio/scripts/sre-32-the-road-ahead.yaml
#
# Nothing runs: deck pages and the whiteboard carry the lesson, and notes.md is
# the recap. The workspace and runtime follow the validated no-code skeleton
# (WebContainer, empty init command, a harmless dev script).
#
# The arc: Padauk's year-end review, where three months of uptime said nothing
# ahead of the outage (cover); board B1, unfixed risks rising while uptime
# stays level (leading vs trailing); board B2, Thiri's risk sheet and one fix
# in the shared config service; pages, what Padauk kept and changed; board B3,
# the release train replaced by one pipeline and one canary per change; pages,
# the catalog entry before any deploy, supervising agents, what Padauk learned
# to value, Thiri the generalist; board B4, the whole course on the Padauk
# loop; your next step; recap on notes.md.
#
# Nine marks add no spoken text and sit at an existing ။, ၊ or ?:
# - b1-lesson1 only splits B1 step 3's narration at its paragraph break (one
#   454-character dialog would pass the 450-character limit; no action uses it).
# - b1-s1b, b2-s5b and b3-s1b land a board piece on the sentence that names it
#   (the three risk bars, the design-review label, "which one broke it?")
#   instead of 12-15 s early.
# - b3-s2b splits B3 step 2 so no apply adds more than three labelled boxes:
#   change, tests and 1% with the pipeline sentences, then all and the green
#   "caught alone" label with the sentence that says so.
# - b4-s2b, b4-s3b and b4-s3c give each station of B4 its own check as the
#   narration reaches it, as lesson 2's loop does; b4-s3b and b4-s3c sit after
#   the ၊ pauses of the one sentence that walks respond, learn and build.
# - ask-question sits after the recap question's ၊ pause so the question-line
#   select can make the ⟪pause 3s⟫, as in lesson 3 (see select-question).
# Pacing: at 70 ms/char no page or board step holds longer than ~33 s (B1
# step 3 with the lesson-1 paragraph), so no pacing page or step was added.
#
# ⟪board B2 step 1⟫ follows board B1 with no ⟪close board⟫, so it opens with
# open + clear like every new board (the panel is still open), as lesson 6's
# B3 does, and B2 step 4 wipes the bars (clear) because the voice script marks
# it "cleared". A board followed by a deck page closes the panel (open: false)
# 400 ms before the page, and a deck page followed by a board closes the page
# 400 ms before, as in Module 1.
#
# Boards (B1 and B2 P5 bars, B2 step 4 a row of teams on one platform slab, B3
# P6 lanes, B4 P3 ring). Colour jobs: #1e1e1e ink (paints white) for titles,
# axes, arrows, the source box, the bar categories, "trailing" and the loop's
# station names; blue the thing named and the data series (the risk bars and
# "leading", the incident bars, the teams, the per-change pipeline, the loop's
# stations); green healthy or done (the level uptime months, the shared config
# service, the bad change caught alone, the people and the checks); red
# failure (the 99.71% month, the circled biggest pattern, the release train
# and "which one broke it?"); orange the caveat (keep looking: the two
# risk-finding labels); violet the result or flow (× 600 each alone, the
# loop's ring and arrows). Titles, axes and B4's loop are furniture and land
# without drawMs. B4 re-draws lesson 1's loop as furniture (its seven labels
# land at once; the steps add only checks and the hub circle) at lesson 1's
# coordinates, its သတိထားမိ and တည်ဆောက် stations as lesson 1 widened them
# around their centres; only the သဘောတူ, သတိထားမိ and တည်ဆောက် label boxes
# are wider than lesson 1's (by 20, 15 and 30 px), and every check sits 10-15 px
# clear of its station. Every label meets the 0.55 em rule and was measured in
# Chrome with Excalidraw's Virgil font: it stays inside the box it sits in, and
# no label box is narrower than its measured text. A label on two lines is two
# text assets, one per line: the overflow rule counts a whole text's length.
#
# Deck pages: deck "Next Editor · SRE 6B · Where you work, and what's next",
# published. Its l32 pages are built later from the page plan, so until then
# the Director reports page "l32_p01" missing from the published deck. Page
# plan: ~/Documents/sre-course/work/pages/sre-32-the-road-ahead.json
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/sre-32-the-road-ahead.yaml
#   bun scripts/studio-compile-check.ts src/studio/scripts/sre-32-the-road-ahead.yaml
