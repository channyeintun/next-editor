      - { id: show-p02c, type: slide.show, at: { mark: show-p02c }, slideId: l32-p02c }
      - { id: show-p03, type: slide.show, at: { mark: show-p03 }, slideId: l32-p03 }
      - { id: show-p03b, type: slide.show, at: { mark: show-p03b }, slideId: l32-p03b }

  - id: learned-to-value
    chapter: Padauk တန်ဖိုးထားလာတာ
    narration: >
      [[mark:show-p04]] review အဆုံးမှာ မသီရိက Padauk တန်ဖိုးထားလာတဲ့ အရာ သုံးခုကို ရေးပါတယ်။ မသိတာကို မသိဘူးလို့ ဖွင့်ပြောတာ၊ တခြားသူ ဆက်လုပ်နိုင်အောင် စာနဲ့ ချရေးတာနဲ့ ဘေးကင်းတဲ့ လမ်းကို အလွယ်ဆုံး လမ်း ဖြစ်အောင် လုပ်တာပါ။ ဒါဆိုရင် reliability က မှတ်ထားရမယ့် စည်းကမ်း မဟုတ်တော့ဘဲ အလိုလို ရနေတဲ့ default ဖြစ်လာပါတယ်။
      [[mark:show-p04b]] မသီရိရဲ့ အလုပ်လည်း ပြောင်းသွားပါတယ်။ သင်္ကြန် မတိုင်ခင် သူ မထိဖူးတဲ့ rider dispatch system ကို စစ်ရတော့ code ကို ထိုင်ဖတ်မယ့်အစား agent တွေကို ဒီသင်တန်းက principle တွေနဲ့ စစ်ခိုင်းပါတယ်။ call တိုင်းမှာ timeout ရှိလား၊ load များရင် request တချို့ကို ငြင်းတဲ့ load shedding ရှိလား၊ deploy တိုင်း canary ကို ဖြတ်လား၊ အရန်လမ်း fallback ရှိလား ဆိုတာပါ။
      [[mark:show-p04c]] agent တွေ ယူလာတဲ့ အထောက်အထားကို ကြည့်ပြီး မသီရိက သင်္ကြန် မတိုင်ခင် ပြင်မယ့် နှစ်ခုကို ရွေးပါတယ်။ ဒီလို နယ်ပယ် တစ်ခုတည်းမှာ နက်တာထက် system အများကြီးကို principle တွေနဲ့ ကြည့်ပြီး agent တွေကို လမ်းညွှန်တဲ့ SRE ကို generalist လို့ ခေါ်ပါတယ်။ ဘာကြောင့်လဲ မေးတတ်တာ၊ အလွှာ အများကြီးကို နည်းနည်းစီ သိတာနဲ့ အဖြေ မရှင်းချိန်မှာ ကောင်းကောင်း ဆုံးဖြတ်တတ်တာကတော့ ဘယ်ခေတ်မှာမဆို အသုံးဝင်ပါတယ်။
      [[mark:show-p04d]] service တွေ များလာတုန်း toil က ၄၅ ရာခိုင်နှုန်းအထိ ပြန်တက်ခဲ့ပေမဲ့ အခု ၁၅ ရာခိုင်နှုန်းပဲ ကျန်ပြီး တစ်ပတ်ကို page ဝင်တာလည်း ၂၀ ကနေ ၆ ခုအထိ လျော့သွားပါတယ်၊ အဖွဲ့က လူ အတူတူပါပဲ။ AI ကြောင့် အလုပ်အကိုင်တွေ ဘယ်လို ပြောင်းမလဲ စိုးရိမ်တာ သဘာဝကျပြီး ဘယ်သူမှလည်း ကတိ မပေးနိုင်ပါဘူး။ Padauk မှာတော့ အလုပ် မပျောက်သွားဘဲ ပုံစံ ပြောင်းသွားပြီး ပိုခက်တဲ့ ပြဿနာတွေအတွက် အချိန် ရလာပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "AI in SRE: How Google is Engineering the Future of Reliable Operations (sre.google)",
          url: "https://sre.google/resources/practices-and-processes/ai-engineering-reliable-operations/",
        }
      - { title: "Workbook: Conclusion", url: "https://sre.google/workbook/conclusion/" }
    actions:
      - { id: show-p04, type: slide.show, at: { mark: show-p04 }, slideId: l32-p04 }
      - { id: show-p04b, type: slide.show, at: { mark: show-p04b }, slideId: l32-p04b }
