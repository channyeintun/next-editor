  - id: next-step
    chapter: နောက်တစ်လှမ်း
    narration: >
      [[mark:close-b4]] [[mark:show-p05]] သင်တန်း ပြီးသွားပေမဲ့ ကိုယ့်အဖွဲ့မှာ ဒီလ စလုပ်လို့ရတာ သုံးခု ရှိပါတယ်။ နောက် postmortem ရဲ့ အဆုံးမှာ တွေ့ခဲ့တဲ့ risk တွေ ဆိုတဲ့ ခေါင်းစဉ် ထည့်ပါ။ spreadsheet တစ်ခုနဲ့ ကိုယ့် risk sheet ကို စပြီး risk တိုင်းကို အမျိုးအစား ပေးကြည့်ပါ။ ပြီးတော့ lesson တစ်ခုကို ရွေးပြီး ဒီလအတွင်း ကိုယ့်အဖွဲ့နဲ့ စမ်းကြည့်ပါ။
