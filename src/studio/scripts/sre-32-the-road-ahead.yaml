      notes.md: |
        # SRE ရဲ့ ရှေ့ခရီး

        - leading indicator — outage မဖြစ်ခင် ကြိုပြတဲ့ အချက်၊ risk လို
        - risk sheet — risk တွေကို နေရာ တစ်ခု၊ အမျိုးအစားနဲ့ စု၊ အကြီးဆုံး ပုံစံကို တစ်ခါ ပြင်
        - service catalog — service တိုင်းရဲ့ owner နဲ့ dependency၊ deploy မလုပ်ခင်
        - generalist — principle တွေနဲ့ agent တွေကို လမ်းညွှန်တဲ့ SRE
        - reliability loop — သဘောတူ → သတိထားမိ → တုံ့ပြန် → သင်ယူ → တည်ဆောက်၊ အလယ်မှာ လူတွေ

        မေးခွန်း: ကိုယ့်အဖွဲ့က loop ရဲ့ ဘယ်အဆင့်မှာ အားအနည်းဆုံးလဲ? ဒီအပတ် လုပ်နိုင်တဲ့ ခြေလှမ်း တစ်ခုက ဘာလဲ?
