  - id: kept-changed
    chapter: ထိန်းထားတာနဲ့ ပြောင်းလိုက်တာ
    narration: >
      [[mark:close-b2]] [[mark:show-p02]] နောက်နှစ်အတွက် ဘာ ပြင်ဆင်ရမလဲလို့ ကိုနေလင်း မေးတော့ မသီရိက အဖြေကို နှစ်ပိုင်း ခွဲပြပါတယ်။ လူကို အပြစ်မရှာတဲ့ blameless review၊ user journey ပေါ်က SLO နဲ့ ပြဿနာ ရှိရင် rollback ကို အရင်လုပ်တဲ့ အလေ့အထကို ဆက်ထိန်းထားပါတယ်။ ပြောင်းသွားတာကတော့ code ကို ဘယ်သူ ရေးလဲ၊ service ဘယ်နှခု run လဲ ဆိုတာနဲ့ အပတ်စဉ် release train ပါ။
      [[mark:show-p02b]] လူတွေက မိဘဆီ ငွေပို့တာလို နေ့စဉ် ကိစ္စတွေကို Padauk နဲ့ လုပ်လာလေ ပျက်တဲ့ တစ်မိနစ်ရဲ့ တန်ဖိုး ကြီးလာလေမို့ ဒီ အလုပ်က နှစ်တိုင်း ပိုအရေးကြီးလာမှာပါ။ ရှေ့ကို ဘယ်သူမှ တိတိကျကျ မသိနိုင်လို့ သတိနဲ့ပဲ ခန့်မှန်းရပေမဲ့ ဒီနေ့ အလေ့အထတွေ သက်သက်နဲ့တော့ agent တွေ ပါလာတဲ့ နောက်တစ်ဆင့်မှာ မလုံလောက်ပါဘူး။ user တွေ ယုံလို့ရတဲ့ service ဆိုတဲ့ ပန်းတိုင်က မပြောင်းပေမဲ့ အဲဒီကို ရောက်တဲ့ နည်းတွေကိုတော့ ပြန်စဉ်းစားနေရပါမယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - { title: "Workbook: Conclusion", url: "https://sre.google/workbook/conclusion/" }
      - { title: "20 Years of SRE at Google", url: "https://sre.google/20/" }
    actions:
      - {
          id: close-b2,
          type: whiteboard.apply,
          at: { mark: close-b2, offsetMs: -400 },
          open: false,
        }
      - { id: show-p02, type: slide.show, at: { mark: show-p02 }, slideId: l32-p02 }
      - { id: show-p02b, type: slide.show, at: { mark: show-p02b }, slideId: l32-p02b }

  - id: release-train
    chapter: Release train
    narration: >
      [[mark:close-p02b]] [[mark:b3-s1]] ဥပမာ Padauk ရဲ့ အပတ်စဉ် release train က တစ်ပတ်လုံးက ပြောင်းလဲမှုတွေကို တစ်တွဲတည်း စုပြီး တစ်ရက်တည်းမှာ ထုတ်ပါတယ်။ coding agent တွေ ရောက်လာတော့ တစ်တွဲမှာ ပြောင်းလဲမှုက ၉၀ လောက်ကနေ ၆၀၀ လောက် ဖြစ်လာပါတယ်။ [[mark:b3-s1b]] ငွေလွှဲ တချို့ fail လာတဲ့ ပတ်မှာ ဘယ်ဟာကြောင့်လဲ ရှာရတာ နာရီနဲ့ချီ ကြာပြီး တစ်တွဲလုံး rollback လုပ်ရင်လည်း Bank X စောင့်နေတဲ့ fix ကိုပါ ပြန်ဖြုတ်ရမှာပါ။
      [[mark:b3-s2]] ဒါကြောင့် Padauk က train ကို ဖျက်ပြီး ပြောင်းလဲမှု တစ်ခုချင်းကို ကိုယ်ပိုင် pipeline နဲ့ ပို့ပါတယ်။ test တွေ အောင်ရင် canary အဆင့် ရောက်ပါတယ်၊ version အသစ်ကို traffic ၁ ရာခိုင်နှုန်းဆီ အရင် ပို့ပြီး version ဟောင်းနဲ့ နှိုင်းယှဉ်တဲ့ အဆင့်ပါ။ [[mark:b3-s2b]] ကောင်းမှ အားလုံးဆီ ဖြန့်ပြီး ပျက်နေရင် အဲဒီ တစ်ခုတည်းကို ဖမ်းမိလို့ သူ့ကိုပဲ rollback လုပ်ပါတယ်။
      [[mark:b3-s3]] ဒီ လမ်းကြောင်းကို ပြောင်းလဲမှု ၆၀၀ လုံးက တစ်ခုစီ သီးသန့် ဖြတ်ပါတယ်။ code များလာလေ release ကို သေးသေးလေးတွေ ခွဲထုတ်ရလေ ဖြစ်ပြီး လူ့ အမြန်နှုန်းအတွက် ဆောက်ထားတဲ့ tool တွေကိုလည်း agent တွေနဲ့ ကိုက်အောင် ပြန်ဒီဇိုင်း ဆွဲရပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "AI in SRE: How Google is Engineering the Future of Reliable Operations (sre.google)",
