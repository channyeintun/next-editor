  - id: one-loop
    chapter: Loop ပေါ်က ခရီး
    narration: >
      [[mark:close-p04d]] [[mark:b4-s1]] ဒါဆို ဒီသင်တန်း တစ်ခုလုံးကို Padauk ရဲ့ reliability loop၊ ပြဿနာ ဖြစ်တိုင်း ပတ်ရတဲ့ စက်ဝိုင်းပေါ်မှာ နောက်ဆုံး တစ်ပတ် ပတ်ကြည့်ရအောင်။ ခရီးက lesson ၁ ရဲ့ သင်္ကြန် အကြိုညကနေ စခဲ့တာပါ၊ အဲဒီတုန်းက top-up တွေ ငွေ နှစ်ခါ ဖြတ်နေပြီး SRE တစ်ယောက်မှ မရှိသေးပါဘူး။
      [[mark:b4-s2]] သဘောတူတဲ့ အဆင့်မှာ finance က ၁၀၀ ရာခိုင်နှုန်း လိုချင်ခဲ့ပေမဲ့ Top-up အတွက် ၉၉.၅ ရာခိုင်နှုန်း SLO ကို သဘောတူခဲ့ပါတယ်။ [[mark:b4-s2b]] သတိထားမိတဲ့ အဆင့်မှာ SLO တွေ အစိမ်းရောင် ဖြစ်နေရက်နဲ့ Eats order တွေ ရပ်နေခဲ့လို့ journey တစ်ခုလုံးကို တိုင်းတတ်လာပါတယ်။
      [[mark:b4-s3]] တုံ့ပြန်တဲ့ အဆင့်မှာ လစာထုတ်ရက် top-up incident ကို role တွေ ခွဲပြီး handle လုပ်ခဲ့တယ်၊ [[mark:b4-s3b]] သင်ယူတဲ့ အဆင့်မှာ ကိုနေလင်း ဝင်ထိုင်ခဲ့တဲ့ blameless review ရှိခဲ့တယ်၊ [[mark:b4-s3c]] တည်ဆောက်တဲ့ အဆင့်မှာတော့ သင်ခန်းစာတွေကို platform ထဲ ထည့်ခဲ့ပါတယ်။
      [[mark:b4-s4]] ဒီ loop ကို လည်စေခဲ့တာ tool တွေ မဟုတ်ဘဲ အလယ်က လူတွေပါ။ သတင်းဆိုး ပြောဖို့ ချီတုံချတုံ ဖြစ်ခဲ့တဲ့ ကိုမင်းက အခု Padauk Parcel ရဲ့ SRE ဖြစ်နေပြီး reliability ကို အပိုတာဝန်အဖြစ် စခဲ့တဲ့ မသီရိကလည်း generalist ဖြစ်လာပါပြီ။ reliability က ဘယ်တော့မှ ပြီးမသွားလို့ ဒီ loop လည်း မရပ်ပါဘူး။
    sources:
