build:
  # Studio swaps in the Burmese voice chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 2632

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: hook
    chapter: နှစ်ကုန် review
    narration: >
      [[mark:show-p01]] ညသန်းခေါင် incident နောက်မှာ Padauk က incident commander ရဲ့ လုပ်ပိုင်ခွင့်၊ အကာအကွယ် ပါတဲ့ break-glass access နဲ့ vendor ရှေ့က gateway ကို ရလာခဲ့ပါတယ်။ ဒီ နောက်ဆုံး lesson မှာတော့ နှစ်ကုန် review ကနေ Site Reliability Engineering၊ SRE ရဲ့ ရှေ့ခရီးကို ကြည့်ပါမယ်။
      [[mark:show-p01b]] review က Wallet ရဲ့ နောက်ဆုံး သုံးလ uptime နဲ့ စပါတယ်။ ပထမ နှစ်လက ၉၉.၉၄ နဲ့ ၉၉.၉၅ ရာခိုင်နှုန်း ဆိုတော့ အားလုံး စိတ်အေးနေခဲ့ကြပါတယ်။ ဒါပေမဲ့ တတိယလမှာ config ပြောင်းလဲမှု တစ်ခုကို zone အားလုံးဆီ တစ်ပြိုင်နက် push လုပ်လိုက်တော့ ငွေလွှဲတာ ၂ နာရီလောက် ရပ်သွားပြီး ၉၉.၇၁ ရာခိုင်နှုန်းကို ကျသွားပါတယ်။ ဘာလို့ ကြိုမမြင်ခဲ့ကြတာလဲလို့ ကိုနေလင်းက မေးပါတယ်။ uptime က ရှေ့ကို ဘာမှ မပြောခဲ့ရင် ဘာက ကြိုပြောနိုင်မလဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - { title: "20 Years of SRE at Google", url: "https://sre.google/20/" }
      - {
          title: "The Evolution of SRE at Google (USENIX ;login:)",
          url: "https://usenix.org/publications/loginonline/evolution-sre-google",
        }
    actions:
      # -1750 / -1450, as in Module 1: a pull-back over 1780 ms pushes the first dialog
      # past the 2 s opening handle, which src/studio/plans/index.test.ts rejects.
      - { id: collapse-dock, type: runtime.collapseDock, at: { scene: start, offsetMs: -1750 } }
      - {
          id: show-p01,
          type: slide.show,
          at: { mark: show-p01, offsetMs: -1450 },
          slideId: l32-p01,
        }
      - { id: show-p01b, type: slide.show, at: { mark: show-p01b }, slideId: l32-p01b }

  - id: leading-trailing
    chapter: Leading နဲ့ trailing
    narration: >
      [[mark:close-p01b]] [[mark:b1-s1]] ဒီ မေးခွန်းကို ဖြေဖို့ မသီရိက incident ပြီးတိုင်း ဘာဖြစ်ခဲ့လဲ ပြန်ရေးတဲ့ postmortem တွေနဲ့ ကံကောင်းလို့သာ incident မဖြစ်ခဲ့တဲ့ near miss တွေကို ပြန်ကြည့်ပါတယ်။ [[mark:b1-s1b]] တွေ့ထားပြီး မပြင်ရသေးတဲ့ risk တွေက outage မတိုင်ခင်ကတည်းက ၁၂ ခု၊ ၁၉ ခု၊ ၂၇ ခု ဆိုပြီး လတိုင်း တက်လာနေခဲ့တာပါ။
      [[mark:b1-s2]] uptime ကတော့ ပထမ နှစ်လ ငြိမ်နေပြီး outage ဖြစ်တော့မှပဲ ကျသွားပါတယ်။ risk တွေ စုလာနေတုန်း uptime လို availability ကိန်းဂဏန်းတွေက မလှုပ်ဘဲ user တွေ တကယ် ထိခိုက်ပြီးမှပဲ ပြောင်းတာပါ။
      [[mark:b1-s3]] ဒီလို ဖြစ်ပြီးမှ တိုင်းလို့ရတဲ့ ကိန်းဂဏန်းကို trailing indicator၊ risk လို ပြဿနာ မဖြစ်ခင် ကြိုပြတဲ့ အချက်ကို leading indicator လို့ ခေါ်ပါတယ်။ availability ကို တိုင်းတဲ့ SLO အများစုလည်း trailing indicator တွေပါ၊ အသုံးမဝင်လို့ မဟုတ်ဘဲ ဖြစ်ပြီးသားကိုပဲ ပြနိုင်လို့ပါ။
      [[mark:b1-lesson1]] lesson ၁ မှာ သင်္ကြန် အကြိုည ပြီးတော့ Padauk ရေးခဲ့တဲ့ ဖြတ်လမ်း အကြွေး စာရင်းကို မှတ်မိသေးလား? အဲဒါက Padauk ရဲ့ ပထမဆုံး risk စာရင်းပါ၊ အကြွေးနဲ့ risk က outage မတိုင်ခင် အရင် ပေါ်တတ်လို့ပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "The Evolution of SRE at Google (USENIX ;login:)",
          url: "https://usenix.org/publications/loginonline/evolution-sre-google",
        }
      - { title: "20 Years of SRE at Google", url: "https://sre.google/20/" }
    actions:
      - { id: close-p01b, type: slide.close, at: { mark: close-p01b, offsetMs: -400 } }
      # The title and axis are furniture; the three risk bars land on the sentence
      # that gives their numbers (b1-s1b), not ~12 s early.
      - {
          id: b1-s1,
          type: whiteboard.apply,
          at: { mark: b1-s1 },
          open: true,
          clear: true,
          upsertIds: [l32-b1-title, l32-b1-axis1],
        }
      - {
          id: b1-s1b,
          type: whiteboard.apply,
          at: { mark: b1-s1b },
          upsertIds: [l32-b1-r1, l32-b1-r1-n, l32-b1-r2, l32-b1-r2-n, l32-b1-r3, l32-b1-r3-n],
          drawMs: 1800,
        }
      - {
          id: b1-s2,
          type: whiteboard.apply,
          at: { mark: b1-s2 },
          upsertIds: [l32-b1-up-title, l32-b1-axis2],
        }
      - {
          id: b1-s2-draw,
          type: whiteboard.apply,
          at: { afterAction: b1-s2 },
          upsertIds: [l32-b1-u1, l32-b1-u1-n, l32-b1-u2, l32-b1-u2-n, l32-b1-u3, l32-b1-u3-n],
          drawMs: 2000,
        }
      # trailing first, as the narration names it first.
      - {
          id: b1-s3,
          type: whiteboard.apply,
          at: { mark: b1-s3 },
          upsertIds: [l32-b1-trailing, l32-b1-leading],
          drawMs: 1400,
        }

  - id: risk-sheet
    chapter: မသီရိရဲ့ risk sheet
    narration: >
      [[mark:b2-s1]] မသီရိက တစ်နှစ်စာ postmortem ၃၁ ခုနဲ့ near miss ၁၂ ခုထဲက တွေ့သမျှ risk ကို spreadsheet တစ်ခုထဲ စုပါတယ်။ risk တစ်ခုချင်း ဘယ်လောက် ဖြစ်နိုင်လဲ၊ ဖြစ်ရင် ဘယ်လောက် ထိခိုက်မလဲ ရေးထားတဲ့ ဒီ စာရင်းက risk sheet ပါ။
      [[mark:b2-s2]] ပြီးတော့ incident နဲ့ risk တစ်ခုစီကို retry၊ capacity လို ကြိုသတ်မှတ်ထားတဲ့ အမျိုးအစား တစ်ခုစီ ပေးပါတယ်။ incident ၃၁ ခုကို ရေတွက်ကြည့်တော့ retry ကြောင့် ၇ ခု၊ capacity မလောက်လို့ ၅ ခု၊ တခြား ၈ ခု ထွက်လာပါတယ်။
      [[mark:b2-s3]] ကျန်တဲ့ ၁၁ ခုကတော့ config ကို check မလုပ်ဘဲ နေရာတိုင်းဆီ တစ်ပြိုင်နက် push လုပ်တာကနေ လာပါတယ်။ အဖွဲ့တိုင်းမှာ push ပုံ ကိုယ်စီ ရှိလို့ မတူသလို ထင်ရပေမဲ့ incident သုံးခုမှာ တစ်ခုလောက်က ပုံစံ တစ်ခုတည်းကနေ လာနေတာပါ။
      [[mark:b2-s4]] ဒါကြောင့် အဖွဲ့တိုင်းကို သီးသန့် ပြင်ခိုင်းမယ့်အစား Wallet၊ Top-up၊ Eats အားလုံး သုံးတဲ့ shared config service ထဲမှာ check နဲ့ zone တစ်ခုပြီးမှ တစ်ခု ဖြန့်တဲ့ rollout ကို တစ်ခါတည်း ထည့်လိုက်ပါတယ်။ ဒါက lesson ၂၅ က shift down၊ reliability အလုပ်ကို developer တစ်ယောက်ချင်းဆီ မပုံဘဲ platform ထဲ ထည့်ပေးတာပါ၊ developer တိုင်းကို အကုန် သယ်ခိုင်းရင် ဘယ်သူမှ မနိုင်လို့ပါ။
      [[mark:b2-s5]] risk ရှာတာကိုလည်း ဆက်လုပ်ရပါတယ်။ အခု postmortem တိုင်းရဲ့ အဆုံးမှာ တွေ့ခဲ့တဲ့ risk တွေ ဆိုတဲ့ ခေါင်းစဉ် ပါလာပြီး ဒီ incident နဲ့ မဆိုင်တဲ့ risk ကိုတောင် ချရေးပါတယ်။ [[mark:b2-s5b]] design review မှာလည်း လူတွေရော agent တွေပါ risk အသစ်တွေ ထပ်ရှာပေးပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "The Evolution of SRE at Google (USENIX ;login:)",
          url: "https://usenix.org/publications/loginonline/evolution-sre-google",
        }
      - { title: "Workbook: Conclusion", url: "https://sre.google/workbook/conclusion/" }
    actions:
      # B2 is a new board, so it opens with open + clear like every new board (the
      # panel is still open from B1, as in lesson 6); its title, source box and axis
      # are furniture.
      - {
          id: b2-s1,
          type: whiteboard.apply,
          at: { mark: b2-s1 },
          open: true,
          clear: true,
          upsertIds: [l32-b2-title, l32-b2-src, l32-b2-src-t, l32-b2-axis],
