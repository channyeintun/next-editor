          type: whiteboard.apply,
          at: { mark: b2-s2 },
          upsertIds: [l32-b2-k1, l32-b2-k1-t, l32-b2-k2, l32-b2-k2-t, l32-b2-k3, l32-b2-k3-t],
          drawMs: 2200,
        }
      - {
          id: b2-s3,
          type: whiteboard.apply,
          at: { mark: b2-s3 },
          upsertIds: [l32-b2-k4, l32-b2-k4-t, l32-b2-k4-circle],
          drawMs: 1800,
        }
      # Step 4 is "cleared": the bars go, and the three teams land first, then
      # (afterAction) the shared config service under them, so no apply adds more
      # than three labelled boxes.
      - {
          id: b2-s4,
          type: whiteboard.apply,
          at: { mark: b2-s4 },
          clear: true,
          upsertIds:
            [
              l32-b2-team1,
              l32-b2-team1-t,
              l32-b2-team2,
              l32-b2-team2-t,
              l32-b2-team3,
              l32-b2-team3-t,
