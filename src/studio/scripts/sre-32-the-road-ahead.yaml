  - id: recap
    narration: >
      [[mark:close-p05]] [[mark:open-notes]] နှစ်ကုန် review ကနေ မှတ်စရာတွေပါ။ [[mark:sel-leading]] leading indicator က outage မဖြစ်ခင် ကြိုပြတဲ့ risk လို အချက်ပါ။ [[mark:sel-risk-sheet]] risk sheet က risk တွေကို အမျိုးအစားနဲ့ တစ်နေရာတည်း စုထားလို့ အကြီးဆုံး ပုံစံကို မြင်ပြီး တစ်ခါတည်း ပြင်နိုင်စေပါတယ်။
      [[mark:sel-catalog]] service catalog က service တိုင်းရဲ့ owner နဲ့ dependency ကို deploy မလုပ်ခင် စာရင်းသွင်းထားတာပါ။ [[mark:sel-generalist]] generalist က principle တွေနဲ့ agent တွေကို လမ်းညွှန်တဲ့ SRE ဖြစ်ပြီး၊ [[mark:sel-loop]] reliability loop ကတော့ အလယ်က လူတွေ လည်စေတဲ့ အဆင့် ငါးဆင့် စက်ဝိုင်းပါ။
      [[mark:sel-question]] သင်တန်းရဲ့ နောက်ဆုံး မေးခွန်းပါ။ ဒီနေ့ ကိုယ့်အဖွဲ့က reliability loop ရဲ့ ဘယ်အဆင့်မှာ အားအနည်းဆုံးလဲ၊ [[mark:ask-question]] ဒီအပတ်မှာ လုပ်နိုင်တဲ့ ခြေလှမ်း တစ်ခုက ဘာလဲ?
      [[mark:pause-question]] အဖြေ မှန် တစ်ခုတည်း မရှိပါဘူး၊ အရေးကြီးတာက အဆင့် တစ်ခုကို ရွေးပြီး ခြေလှမ်း သေးသေးလေး တစ်ခုနဲ့ စလိုက်တာပါ။ Padauk ရဲ့ ဇာတ်လမ်းက ဒီမှာ မပြီးသေးပါဘူး၊ reliability လိုပဲ ဆက်သွားနေမှာပါ။ ဒီသင်တန်းကို အဆုံးထိ လိုက်ကြည့်ပေးလို့ ကျေးဇူးတင်ပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - { title: "20 Years of SRE at Google", url: "https://sre.google/20/" }
      - {
          title: "AI in SRE: How Google is Engineering the Future of Reliable Operations (sre.google)",
          url: "https://sre.google/resources/practices-and-processes/ai-engineering-reliable-operations/",
        }
    actions:
      - { id: close-p05, type: slide.close, at: { mark: close-p05 } }
      - {
          id: open-notes,
          type: workspace.openFile,
          at: { mark: open-notes, offsetMs: 300 },
          path: notes.md,
        }
      - {
          id: sel-leading,
          type: editor.select,
          at: { mark: sel-leading },
          target: { file: notes.md, text: "leading indicator", occurrence: 1 },
        }
      - {
          id: sel-risk-sheet,
          type: editor.select,
          at: { mark: sel-risk-sheet },
          target: { file: notes.md, text: "risk sheet", occurrence: 1 },
        }
      - {
          id: sel-catalog,
          type: editor.select,
          at: { mark: sel-catalog },
          target: { file: notes.md, text: "service catalog", occurrence: 1 },
        }
      - {
          id: sel-generalist,
          type: editor.select,
          at: { mark: sel-generalist },
          target: { file: notes.md, text: "generalist", occurrence: 1 },
        }
      - {
          id: sel-loop,
          type: editor.select,
          at: { mark: sel-loop },
          target: { file: notes.md, text: "reliability loop", occurrence: 1 },
        }
      # The voice script's ⟪select မေးခွန်း⟫ and ⟪pause 3s⟫, the way the Module 1
      # reviewers fixed the pause (as in lesson 3). sel-question marks where the
      # voice script puts the select, but a select there would drag under the
      # question and leave no pause, and one at pause-question would drag under the
      # answer's first words (the scheduler holds only the dialog after its
      # anchor's). So the question-line select hangs off ask-question, one more mark
      # after the question's ၊ pause, so the dialog it follows is only the
      # question's last clause (44 characters): the select starts about as the
      # question ends, its drag runs in silence, and the answer at pause-question
      # waits for it. 4050 leaves about 2.7 / 2.05 / 0.95 s before the answer at
      # 55 / 70 / 95 ms per char (at 95 the drag starts under the question's last
      # words, as in lesson 7); an offset above ~4190 trips compile-check's 2.5 s
      # inserted-silence warning at 55.
      - {
          id: select-question,
          type: editor.select,
          at: { mark: ask-question, offsetMs: 4050 },
          target:
            {
              file: notes.md,
              text: "မေးခွန်း: ကိုယ့်အဖွဲ့က loop ရဲ့ ဘယ်အဆင့်မှာ အားအနည်းဆုံးလဲ? ဒီအပတ် လုပ်နိုင်တဲ့ ခြေလှမ်း တစ်ခုက ဘာလဲ?",
              occurrence: 1,
            },
        }

checks:
  # 500, not 300: google-svg deck pages stall the main thread at show/close.
  - { type: timing.p95Ms, max: 500 }
