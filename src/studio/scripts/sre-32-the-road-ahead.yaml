  - id: before-deploy
    chapter: Deploy မလုပ်ခင်
    narration: >
      [[mark:close-b3]] [[mark:show-p02c]] agent တွေကြောင့် service တွေလည်း ၃၅ ခုကနေ ၉၀ အထိ များလာပါတယ်။ တစ်ညမှာ top-up တွေ နှေးလို့ on-call က လိုက်ရှာတော့ top-up လမ်းကြောင်းထဲမှာ agent ဆောက်ခဲ့တဲ့ operator balance checker ဆိုတဲ့ service ကို တွေ့ပါတယ်။ owner မရှိလို့ ဘယ်သူ့ကို နှိုးရမလဲ၊ ဘာက သူ့ကို မှီနေလဲ ဘယ်သူမှ မသိပါဘူး။
      [[mark:show-p03]] ဒါကြောင့် အခု ဘယ် service မဆို deploy မလုပ်ခင် owner၊ အရေးပါမှုနဲ့ dependency တွေကို စာရင်းလုပ်ထားတဲ့ service catalog ထဲမှာ entry ရှိရပါမယ်။ နာမည်ပါတဲ့ owner နဲ့ rollback လုပ်နည်း မပါရင် pipeline က deploy ကို လက်မခံပါဘူး။
      [[mark:show-p03b]] agent တွေ production ထဲမှာ ကိုယ်တိုင် အလုပ်လုပ်လာတာက ရှေ့လာမယ့် အကြီးဆုံး ပြောင်းလဲမှု ဖြစ်နိုင်ပြီး လူတွေက ကိုယ်တိုင် လုပ်တာကနေ ကြီးကြပ်တာဆီ ရွှေ့လာပါတယ်။ ကြီးကြပ်တယ် ဆိုတာ ထိုင်ကြည့်နေရုံ မဟုတ်ဘဲ ပန်းတိုင် ပေးတာ၊ အထောက်အထား စစ်တာ၊ approve လုပ်တာ၊ လိုရင် ရပ်လိုက်တာပါ။ မကြုံဖူးတဲ့ ပြဿနာ အသစ်တွေကိုတော့ လူတွေကပဲ ဝင်ယူရပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "AI in SRE: How Google is Engineering the Future of Reliable Operations (sre.google)",
          url: "https://sre.google/resources/practices-and-processes/ai-engineering-reliable-operations/",
        }
