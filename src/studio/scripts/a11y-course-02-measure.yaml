# Accessibility course, lesson 2: how accessibility is measured.
#
# A concept lesson: nothing runs. Deck pages (course deck) and two whiteboard
# boards carry the lesson, and the recap highlights the key lines in notes.md.
# Flow: why a shared yardstick is needed (the lesson 1 personas), which standard
# to follow, what an audit is (four kinds of testing; a board shows it repeating
# through the life cycle), WCAG and its versions, the three levels and the 86
# success criteria of WCAG 2.2 (31 / 24 / 31), POUR built on a board with two
# tea-shop examples landing in each principle, POUR as a way of thinking about
# people rather than a checklist, a quiz page with its reveal, and the recap.
#
# Deck: every page points at the course deck's placeholder /pub URL until Chan
# publishes it; the Director's unreachable-deck warning is expected.
# Page plan (kit fields per page): ~/Documents/a11y-course-work/pages/a11y-course-02-measure.json
#
# Validate with (from the repo root):
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
schemaVersion: 1

