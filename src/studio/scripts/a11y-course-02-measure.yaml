      notes.md: |
        # Accessibility ကို ဘယ်လို တိုင်းတာလဲ

        - audit — စံနှုန်း တစ်ခု၊ level တစ်ခုနဲ့ တိုက်စစ်တာ (design · automated · manual · assistive technology)၊ ထပ်ခါ ထပ်ခါ
        - WCAG 2.2 — W3C ရဲ့ စံနှုန်း (2023)၊ WCAG 3 က draft သာ
        - success criterion 86 ခု — A 31 · AA 24 · AAA 31
        - level AA = A + AA — ဥပဒေ အများစုနဲ့ team အများစုရဲ့ ပန်းတိုင်
        - POUR — Perceivable · Operable · Understandable · Robust

        နောက် lesson: accessibility tree နဲ့ semantic HTML
