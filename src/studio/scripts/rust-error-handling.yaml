scenes:
  - id: two-kinds
    chapter: Error နှစ်မျိုး
    narration: >-
      program တွေဆိုတာ တစ်ခါတစ်လေ အမှား ဖြစ်တတ်ပါတယ်။ ဖွင့်ချင်တဲ့ ဖိုင်က မရှိနေတာမျိုး၊ ဒါမှမဟုတ်
      ကိန်းဂဏန်း လိုချင်တဲ့ နေရာမှာ တစ်ယောက်ယောက်က စာလုံးတွေ ရိုက်ထည့်လိုက်တာမျိုးပါ။ Rust မှာ
      exception ဆိုတာ မရှိပါဘူး။ အဲဒီအစား error တွေကို နှစ်မျိုး ခွဲထားပါတယ်။ [[mark:draw-bug]] ပထမ
      တစ်မျိုးက bug ပါ။ ဥပမာအားဖြင့်၊ element သုံးခုပဲ ရှိတဲ့ Vec တစ်ခုမှာ index 99 ကို
      ဖတ်ကြည့်တာမျိုးပါ။ [[mark:draw-panic]] Vec ရဲ့ အဆုံးကို ကျော်ပြီး ဖတ်တာက ဘေးကင်းတဲ့ အလုပ်
      မဟုတ်လို့၊ Rust က panic ဖြစ်ပါတယ်။ ဒီ message ကို print ထုတ်ပြီး၊ program က ရပ်သွားပါတယ်။
      panic macro ကို ကိုယ်တိုင်လည်း ခေါ်လို့ ရပါတယ်။ [[mark:draw-input]] ဒုတိယ တစ်မျိုးကတော့
      ဖြစ်လာနိုင်တယ်လို့ ကြိုသိထားတဲ့ အမှားမျိုးပါ၊ ဥပမာအားဖြင့် မှားနေတဲ့ input ပါ။
      [[mark:draw-result]] ဒီလို အခြေအနေအတွက်ကတော့ function က Result တစ်ခု ပြန်ပေးပြီး၊ အဲဒီ
      function ကို ခေါ်တဲ့သူက ဘာ ဆက်လုပ်မလဲ ဆိုတာကို ဆုံးဖြတ်ပါတယ်။ [[mark:draw-values]] ဆိုတော့
      ကြိုမျှော်လင့်ထားတဲ့ error ဆိုတာ crash မဟုတ်ပါဘူး။ return type ထဲမှာ ပါနေတဲ့ တန်ဖိုး တစ်ခုပါ။
      ဒါကြောင့် ဘယ် function ကို ခေါ်တဲ့အခါ အမှား ဖြစ်နိုင်လဲ ဆိုတာကို return type ကနေပဲ
      မြင်နိုင်ပါတယ်။
    sources:
      - title: "The Rust Book — Error Handling"
        url: "https://doc.rust-lang.org/book/ch09-00-error-handling.html"
      - title: "The Rust Book — Unrecoverable Errors with panic!"
        url: "https://doc.rust-lang.org/book/ch09-01-unrecoverable-errors-with-panic.html"
      - title: "std::panic! macro"
        url: "https://doc.rust-lang.org/std/macro.panic.html"
    actions:
      # Opens in the quiet handle before the first word, already titled.
      - id: open-board-kinds
        type: whiteboard.apply
        at: { scene: start, offsetMs: -1500 }
        open: true
        upsertIds: [b-title]
      - id: draw-bug
        type: whiteboard.apply
        at: { mark: draw-bug }
        upsertIds: [b-bug-box, b-bug-text]
        drawMs: 1200
      - id: draw-panic
        type: whiteboard.apply
        at: { mark: draw-panic }
        upsertIds: [b-arrow-a, b-panic-box, b-panic-text, b-stops, b-msg]
        drawMs: 3000
      - id: draw-input
        type: whiteboard.apply
        at: { mark: draw-input }
        upsertIds: [b-input-box, b-input-text]
        drawMs: 1200
      - id: draw-result
        type: whiteboard.apply
        at: { mark: draw-result }
        upsertIds: [b-arrow-b, b-result-box, b-result-text, b-decide, b-parse]
        drawMs: 2800
      - id: draw-values
        type: whiteboard.apply
        at: { mark: draw-values }
        upsertIds: [b-values]
        drawMs: 1400

  - id: result-type
    narration: >-
      [[mark:show-result]] Result ဆိုတာ handle လုပ်ပြီး ဆက်သွားလို့ ရတဲ့ error တွေအတွက် enum
      တစ်ခုပါ။ အလုပ် ဖြစ်သွားရင် Ok ထဲမှာ တန်ဖိုးကို သိမ်းထားပြီး၊ အလုပ် မဖြစ်ရင်တော့ Err ထဲမှာ
      error ကို သိမ်းထားပါတယ်။ T နဲ့ E ကတော့ အဲဒီ type နှစ်ခုအတွက် placeholder တွေပါ။ ဆိုလိုတာက T က
      အောင်မြင်ရင် ရမယ့် တန်ဖိုးရဲ့ type ဖြစ်ပြီး၊ E ကတော့ error ရဲ့ type ပါ။ Option နဲ့ အတူတူပါပဲ၊
      ထဲက တန်ဖိုးကို သုံးချင်ရင် case နှစ်ခုလုံးကို handle လုပ်ရပါမယ်။
    sources:
      - title: "The Rust Book — Recoverable Errors with Result"
        url: "https://doc.rust-lang.org/book/ch09-02-recoverable-errors-with-result.html"
      - title: "std::result::Result"
        url: "https://doc.rust-lang.org/std/result/enum.Result.html"
    actions:
      - id: close-board-kinds
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: show-result
        type: slide.show
        at: { mark: show-result, offsetMs: 300 }
        slideId: result-slide

  - id: parse
    chapter: ကိန်းဂဏန်း parse လုပ်ခြင်း
    narration: >-
      ဒီမှာ စာသား နှစ်ခုကို တစ်ခုချင်း သွားတဲ့ loop တစ်ခု ရှိပါတယ်။ တစ်ခုက 42 ဖြစ်ပြီး၊ နောက်တစ်ခုက
      oops ဆိုတဲ့ စကားလုံးပါ။ [[mark:type-parse]] ဒီ စာသား တစ်ခုချင်းစီကို parse နဲ့ ကိန်းဂဏန်း
      ပြောင်းကြည့်ရအောင်။ angle bracket ထဲက i32 က parse ကို ဘယ် type ထုတ်ရမလဲ ပြောတာပါ။
      [[mark:select-parse]] ဒါဆို parse က ဘာကို ပြန်ပေးလဲ။ i32 တော့ မဟုတ်ပါဘူး။ oops လို စာသားက
      ကိန်းဂဏန်း ဖြစ်လို့ မရတဲ့အတွက်၊ parse က Result တစ်ခုကို ပြန်ပေးပါတယ်။
    sources:
      - title: "std — str::parse"
        url: "https://doc.rust-lang.org/std/primitive.str.html#method.parse"
      - title: "The Rust Book — Recoverable Errors with Result"
        url: "https://doc.rust-lang.org/book/ch09-02-recoverable-errors-with-result.html"
    actions:
      - id: close-result-slide
        type: slide.close
        at: { scene: start }
      - id: open-main
        type: workspace.openFile
        at: { scene: start, offsetMs: 800 }
        path: main.rs
      - id: type-parse
        type: editor.type
        at: { mark: type-parse }
        target:
          file: main.rs
          after: "    for input in [\"42\", \"oops\"] {\n"
          occurrence: 1
        cadence: fast-explainer
        text: "        let parsed = input.parse::<i32>();\n"
      - id: select-parse
        type: editor.select
        at: { mark: select-parse }
        target:
          file: main.rs
          text: "input.parse::<i32>()"
          occurrence: 1

  - id: not-a-number
    narration: >-
      [[mark:draw-e1-code]] ဒါပေမဲ့ parsed ကို သာမန် ကိန်းဂဏန်း တစ်ခုလိုပဲ သဘောထားပြီး 2 နဲ့
      မြှောက်ကြည့်ရင် ဘာဖြစ်မလဲ။ [[mark:draw-e1-msg]] compiler က E0369 error နဲ့ ရပ်သွားပါတယ်။
      Result တစ်ခုကို integer နဲ့ မြှောက်လို့ မရပါဘူးတဲ့။ [[mark:draw-e1-type]] ပြီးတော့ parsed ရဲ့
      type အစစ်ကိုလည်း ပြပေးပါတယ်၊ Result of i32 နဲ့ ParseIntError ပါ။ [[mark:draw-e1-fix]] ထဲက
      ကိန်းဂဏန်းကို ထုတ်ယူချင်ရင်၊ case နှစ်ခုလုံးကို အရင် handle လုပ်ရပါမယ်။
    sources:
      - title: "Rust error codes — E0369"
        url: "https://doc.rust-lang.org/error_codes/E0369.html"
      - title: "std::num::ParseIntError"
        url: "https://doc.rust-lang.org/std/num/struct.ParseIntError.html"
    actions:
      - id: open-board-e1
        type: whiteboard.apply
        at: { scene: start }
        open: true
        clear: true
        upsertIds: [e1-title]
      - id: draw-e1-code
        type: whiteboard.apply
        at: { mark: draw-e1-code, offsetMs: 300 }
        upsertIds: [e1-code1, e1-code2]
        drawMs: 1800
      - id: draw-e1-msg
        type: whiteboard.apply
        at: { mark: draw-e1-msg }
        upsertIds: [e1-msg1, e1-msg2]
        drawMs: 2200
      - id: draw-e1-type
        type: whiteboard.apply
        at: { mark: draw-e1-type }
        upsertIds: [e1-under, e1-type]
        drawMs: 1600
      - id: draw-e1-fix
        type: whiteboard.apply
        at: { mark: draw-e1-fix }
        upsertIds: [e1-fix]
        drawMs: 1400

  - id: match
    narration: >-
      [[mark:type-match]] ဒါကို match နဲ့ handle လုပ်ကြည့်ရအောင်။ Ok အတွက် arm တစ်ခု၊ Err အတွက် arm
      တစ်ခုပါ။ [[mark:select-ok]] Ok arm ထဲမှာ n ဆိုတာ i32 တန်ဖိုး အစစ်ပါ၊ ဒါကြောင့် သာမန်
      ကိန်းဂဏန်း တစ်ခုလို တန်းသုံးလို့ ရပါတယ်။ [[mark:select-err]] Err arm ထဲမှာတော့ e က error
      ဖြစ်ပြီး၊ သူ့ကို print ထုတ်လိုက်ရင် ဘာ မှားသွားလဲ ဆိုတာကို ပြောပြပါတယ်။ arm တစ်ခုခုကို
      ချန်ထားခဲ့ရင်တော့ E0004 error တက်ပါလိမ့်မယ်၊ match ထဲမှာ case အကုန် မပါသေးပါဘူးတဲ့။
    sources:
      - title: "The Rust Book — Recoverable Errors with Result"
        url: "https://doc.rust-lang.org/book/ch09-02-recoverable-errors-with-result.html"
      - title: "Rust error codes — E0004"
        url: "https://doc.rust-lang.org/error_codes/E0004.html"
    actions:
      - id: close-board-e1
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: type-match
        type: editor.type
        at: { mark: type-match, offsetMs: 300 }
        target:
          file: main.rs
          after: "        let parsed = input.parse::<i32>();\n"
          occurrence: 1
        cadence: line-by-line
        text: "        match parsed {

          \            Ok(n) => println!(\"{input} is the number {n}\"),

          \            Err(e) => println!(\"{input} failed: {e}\"),

          \        }\n"
      - id: select-ok
        type: editor.select
        at: { mark: select-ok }
        target:
          file: main.rs
          text: "Ok(n)"
          occurrence: 1
      - id: select-err
        type: editor.select
        at: { mark: select-err }
        target:
          file: main.rs
          text: "Err(e)"
          occurrence: 1

  - id: question-mark
    chapter: Question mark operator
    narration: >-
      [[mark:select-match]] ဒါပေမဲ့ Result တစ်ခု ရတိုင်း match တစ်ခု ရေးနေရရင် code က ရှည်လာပါတယ်။
      အတိုကောက် နည်းလမ်း တစ်ခုက unwrap ပါ။ Ok ဆိုရင် ထဲက တန်ဖိုးကို ထုတ်ပေးပြီး၊ Err ဆိုရင်တော့
      panic ဖြစ်သွားပါတယ်။ ခဏ စမ်းကြည့်တဲ့ code မှာတော့ အဆင်ပြေပေမယ့်၊ user ဆီက input အတွက်တော့
      မသင့်တော်ပါဘူး။ [[mark:show-q]] ဒီထက် ပိုကောင်းတဲ့ နည်းလမ်းကတော့ question mark operator ပါ။
      Result ပြန်ပေးတဲ့ function ကို ခေါ်ထားတဲ့ နေရာရဲ့ နောက်မှာ question mark ထည့်လိုက်တာပါ။ Ok
      ဆိုရင် ထဲက တန်ဖိုးကို ထုတ်ပေးပြီး၊ code က ပုံမှန်အတိုင်း ဆက်သွားပါတယ်။ Err ဆိုရင်တော့ အဲဒီ
      error ကို function ကနေ ချက်ချင်း return ပြန်လုပ်ပေးပြီး၊ ခေါ်တဲ့သူက ဘာ ဆက်လုပ်မလဲ ဆိုတာကို
      ဆုံးဖြတ်ပါတယ်။
    sources:
      - title: "The Rust Book — Shortcuts for Panic on Error: unwrap and expect"
        url:
          "https://doc.rust-lang.org/book/ch09-02-recoverable-errors-with-result.html#shortcuts-for-pani\
          c-on-error"
      - title: "The Rust Book — The ? Operator Shortcut"
        url:
          "https://doc.rust-lang.org/book/ch09-02-recoverable-errors-with-result.html#the--operator-shor\
          tcut"
      - title: "The Rust Reference — The try propagation expression"
        url:
          "https://doc.rust-lang.org/reference/expressions/operator-expr.html#the-try-propagation-expres\
          sion"
    actions:
      - id: select-match
        type: editor.select
        at: { mark: select-match }
        target:
          file: main.rs
          text: "match parsed {

            \            Ok(n) => println!(\"{input} is the number {n}\"),

            \            Err(e) => println!(\"{input} failed: {e}\"),

            \        }"
          occurrence: 1
      - id: show-q
        type: slide.show
        at: { mark: show-q }
        slideId: question-slide

  - id: add
    narration: >-
      [[mark:type-add]] ကဲ၊ add ဆိုတဲ့ function တစ်ခု ရေးကြည့်ရအောင်။ စာသား နှစ်ခုကို parse လုပ်ပြီး
      ပေါင်းပေးတဲ့ function ပါ။ အပေါ်ဆုံးက use စာကြောင်းကတော့ integer တွေကို parse လုပ်တဲ့အခါ
      ထွက်လာနိုင်တဲ့ error type ဖြစ်တဲ့ ParseIntError ကို ခေါ်သွင်းပေးတာပါ။ [[mark:select-q]] ဒီမှာ
      ပထမ parse ရဲ့ နောက်က question mark ကို ကြည့်ပါ။ အဲဒီ စာသားက ကိန်းဂဏန်း မဟုတ်ဘူးဆိုရင်၊ add က
      ဒီနေရာမှာပဲ ရပ်ပြီး Err ကို ပြန်ပေးလိုက်ပါတယ်။ [[mark:select-sum]] နှစ်ခုလုံး parse လုပ်လို့
      ရသွားရင်တော့၊ ပေါင်းလဒ်ကို Ok ထဲ ထည့်ပြီး ပြန်ပေးပါတယ်။ ဘာကြောင့်လဲဆိုတော့ add က Result တစ်ခု
      ပြန်ပေးရမှာ ဖြစ်လို့ပါ။
    sources:
      - title: "The Rust Book — Propagating Errors"
        url: "https://doc.rust-lang.org/book/ch09-02-recoverable-errors-with-result.html#propagating-errors"
      - title: "std::num::ParseIntError"
        url: "https://doc.rust-lang.org/std/num/struct.ParseIntError.html"
    actions:
      - id: close-q-slide
        type: slide.close
        at: { scene: start }
      - id: type-add
        type: editor.type
        at: { mark: type-add, offsetMs: 300 }
        target:
          file: main.rs
          after: ""
          occurrence: 1
        cadence: line-by-line
        text: "use std::num::ParseIntError;


          fn add(a: &str, b: &str) -> Result<i32, ParseIntError> {

          \    let x = a.parse::<i32>()?;

          \    let y = b.parse::<i32>()?;

          \    Ok(x + y)

          }

          \n"
      - id: select-q
        type: editor.select
        at: { mark: select-q }
        target:
          file: main.rs
          text: "a.parse::<i32>()?"
          occurrence: 1
      - id: select-sum
        type: editor.select
        at: { mark: select-sum }
        target:
          file: main.rs
          text: "Ok(x + y)"
          occurrence: 1

  - id: needs-result
    narration: >-
      [[mark:select-ret]] add ရဲ့ return type ကို ကြည့်ပါ၊ Result တစ်ခုပါ။ ဒါကြောင့် question mark က
      error ကို ပို့စရာ နေရာ ရှိသွားတာပါ။ [[mark:draw-e2-code]] ဒါဆို main ထဲမှာ question mark ကို
      သုံးကြည့်ရင်ရော။ main က unit type ကို ပြန်ပေးပါတယ်၊ ကွင်းအလွတ်နဲ့ ရေးတဲ့ type ပါ။
      [[mark:draw-e2-msg]] အဲဒီအခါ compiler က E0277 error နဲ့ ရပ်သွားပါတယ်။ question mark operator
      ကို Result ဒါမှမဟုတ် Option ပြန်ပေးတဲ့ function ထဲမှာပဲ သုံးလို့ ရပါတယ်တဲ့။
      [[mark:draw-e2-works]] ဒါကြောင့်ပဲ add ထဲမှာတော့ အလုပ်လုပ်တာပါ။
    sources:
      - title: "The Rust Book — Where to Use the ? Operator"
        url:
          "https://doc.rust-lang.org/book/ch09-02-recoverable-errors-with-result.html#where-to-use-the--\
          operator"
      - title: "Rust error codes — E0277"
        url: "https://doc.rust-lang.org/error_codes/E0277.html"
      - title: "std — The unit type ()"
        url: "https://doc.rust-lang.org/std/primitive.unit.html"
    actions:
      - id: select-ret
        type: editor.select
        at: { mark: select-ret }
        target:
          file: main.rs
          text: "Result<i32, ParseIntError>"
          occurrence: 1
      - id: open-board-e2
        type: whiteboard.apply
        at: { mark: draw-e2-code, offsetMs: -300 }
        open: true
        clear: true
        upsertIds: [e2-title]
      - id: draw-e2-code
        type: whiteboard.apply
        at: { mark: draw-e2-code, offsetMs: 300 }
        upsertIds: [e2-code1, e2-code2, e2-under-main, e2-returns]
        drawMs: 2600
      - id: draw-e2-msg
        type: whiteboard.apply
        at: { mark: draw-e2-msg }
        upsertIds: [e2-circle-q, e2-msg1, e2-msg2]
        drawMs: 3000
      - id: draw-e2-works
        type: whiteboard.apply
        at: { mark: draw-e2-works }
        upsertIds: [e2-works, e2-works-code]
        drawMs: 1600

  - id: calls
    narration: >-
      [[mark:type-calls]] အခု main ထဲကနေ add ကို ခေါ်ကြည့်ရအောင်။ ပထမ တစ်ကြိမ်မှာ 20 နဲ့ 22 ကို
      ပေးပြီး၊ ဒုတိယ တစ်ကြိမ်မှာတော့ 20 နဲ့ oops ကို ပေးပါမယ်။ ရလာတဲ့ Result တစ်ခုချင်းစီကိုတော့
      struct တွေ လေ့လာတုန်းက တွေ့ခဲ့တဲ့ Debug placeholder နဲ့ print ထုတ်ပါမယ်၊ ဆိုလိုတာက
      တွန့်ကွင်းထဲမှာ colon နဲ့ question mark ထည့်တာပါ။
    sources:
      - title: "std::fmt::Debug"
        url: "https://doc.rust-lang.org/std/fmt/trait.Debug.html"
    actions:
      - id: close-board-e2
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: type-calls
        type: editor.type
        at: { mark: type-calls, offsetMs: 400 }
        target:
          file: main.rs
          after: "            Err(e) => println!(\"{input} failed: {e}\"),

            \        }

            \    }\n"
          occurrence: 1
        cadence: line-by-line
        text: "

          \    println!(\"{:?}\", add(\"20\", \"22\"));

          \    println!(\"{:?}\", add(\"20\", \"oops\"));\n"

  - id: run
    narration: >-
      [[mark:run]] ကဲ၊ run ကြည့်ရအောင်။ ပထမ စာကြောင်းမှာ 42 က ကိန်းဂဏန်း ဖြစ်သွားပါတယ်။ oops ကတော့
      အလုပ် မဖြစ်ပါဘူး၊ ပြီးတော့ error က ဘာကြောင့်လဲ ဆိုတာကိုပါ ပြောပြပါတယ်၊ invalid digit found in
      string တဲ့။ add ကတော့ Ok 42 ပြန်ပေးပါတယ်။ oops နဲ့ ခေါ်တဲ့အခါမှာတော့ Err တစ်ခု ထွက်လာပါတယ်။
      question mark က အဲဒီ error ကို စောစော return ပြန်လုပ်လိုက်တဲ့အတွက်၊ ပေါင်းတဲ့ အဆင့်ကို လုံးဝ
      မရောက်တော့ဘဲ၊ ဘာမှလည်း panic မဖြစ်ပါဘူး။
    sources:
      - title: "The Rust Book — Recoverable Errors with Result"
        url: "https://doc.rust-lang.org/book/ch09-02-recoverable-errors-with-result.html"
    actions:
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "oops failed: invalid digit found in string"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: "let x = a.parse::<i32>()?;"

  - id: wrap
    narration: >-
      ဒါဆို ပြန်ချုပ်ရရင်၊ panic ဆိုတာ bug တွေအတွက် ဖြစ်ပြီး၊ program ကို ရပ်ပစ်ပါတယ်။ Result ကတော့
      ကြိုမျှော်လင့်ထားတဲ့ error တွေအတွက်ပါ။ match နဲ့ handle လုပ်လို့ ရသလို၊ question mark နဲ့
      ခေါ်တဲ့သူဆီ ပြန်ပို့လို့လည်း ရပါတယ်။ နောက် lesson မှာတော့ generic တွေ၊ ဆိုလိုတာက type
      အမျိုးမျိုးအတွက် function တစ်ခုတည်းနဲ့ ဘယ်လို ရေးလဲ ဆိုတာကို ကြည့်သွားပါမယ်။
    sources:
      - title: "The Rust Book — To panic! or Not to panic!"
        url: "https://doc.rust-lang.org/book/ch09-03-to-panic-or-not-to-panic.html"
      - title: "The Rust Book — Generic Data Types"
        url: "https://doc.rust-lang.org/book/ch10-01-syntax.html"
    actions: []

checks:
  # 500 (not 300): google-svg deck slides embed per-slide font data whose
  # paint briefly stalls the main thread at each show/close.
  - { type: timing.p95Ms, max: 500 }
