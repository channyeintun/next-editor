# Rust from zero, lesson 15: error handling.
#
# The arc: a whiteboard sorts errors into two kinds (Rust has no exceptions):
# a bug panics and stops the program (v[99] → index out of bounds), while a
# failure you expect (bad input) comes back as a Result value and the caller
# decides. The deck page "Result<T, E>" gives the enum. The editor then
# parses two strings in a loop; parse returns a Result, not an i32, and a
# second board shows the compiler's answer when you treat it as a number
# (E0369). A match handles Ok and Err (leaving one out is E0004). unwrap is
# named as the panicking shortcut, and the deck page "The ? operator" gives
# the better one. The editor builds add(), which uses ? on two parses and
# returns Result; a third board shows ? used in main (E0277). main prints
# both add() results with {:?}. One run at the end.
#
# Every compiler message on the boards or in the narration was confirmed with
# rustc 1.98 (edition 2024) on the broken variants:
#   let parsed = input.parse::<i32>(); let doubled = parsed * 2;
#     error[E0369]: cannot multiply `Result<i32, ParseIntError>` by `{integer}`
#     (label under `parsed`: Result<i32, ParseIntError>)
#   fn main() { let n = "42".parse::<i32>()?; … }
#     error[E0277]: the `?` operator can only be used in a function that
#       returns `Result` or `Option` (or another type that implements
#       `FromResidual`)
#     label: cannot use the `?` operator in a function that returns `()`
#   match parsed { Ok(n) => … }   (no Err arm)
#     error[E0004]: non-exhaustive patterns: `Err(_)` not covered
#   let v = vec![1, 2, 3]; println!("{}", v[99]);   (compiles, then panics)
#     thread 'main' (…) panicked at …
#     index out of bounds: the len is 3 but the index is 99
#   "oops".parse::<i32>().unwrap()   (panics)
#     called `Result::unwrap()` on an `Err` value: ParseIntError { kind: InvalidDigit }
#
# Board colours: red = panic and the compiler errors, blue = Result (the
# thing being named), orange = bad input / the type that surprises you,
# green = what works (handle it, the caller decides), violet = the result
# (an error you expect is a value). #1e1e1e paints white on the dark board.
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/rust-error-handling.yaml
