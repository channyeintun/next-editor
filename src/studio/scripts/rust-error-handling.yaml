build:
  voiceProfile: pocket-alba-v1
  seed: 44

runtime:
  kind: rust-playground
  defaultMode: fixture
  fixture:
    latencyMs: 600
    result:
      status: success
      stdout: "42 is the number 42\noops failed: invalid digit found in string\nOk(42)\nErr(ParseIntError { kind: InvalidDigit })\n"
      stderr: ""

scenes:
  - id: two-kinds
    chapter: Two kinds of errors
    narration: >
      Programs fail. A file is missing, or someone types letters where you
      wanted a number. Rust has no exceptions. It sorts errors into two kinds.
      [[mark:draw-bug]] The first kind is a bug, like reading index
      ninety-nine of a vector that only has three items.
      [[mark:draw-panic]] Reading past the end isn't safe, so Rust panics. It
      prints this message, and the program stops. You can call the panic
      macro yourself, too.
      [[mark:draw-input]] The second kind is a failure you expect, like bad
      input.
      [[mark:draw-result]] For those, a function returns a Result, and its
      caller decides what to do.
      [[mark:draw-values]] So an expected error isn't a crash. It's a value in
      the return type, so you can see which calls can fail.
    sources:
      - title: "The Rust Book — Error Handling"
        url: "https://doc.rust-lang.org/book/ch09-00-error-handling.html"
      - title: "The Rust Book — Unrecoverable Errors with panic!"
        url: "https://doc.rust-lang.org/book/ch09-01-unrecoverable-errors-with-panic.html"
      - title: "std::panic! macro"
        url: "https://doc.rust-lang.org/std/macro.panic.html"
    actions:
      # Opens in the quiet handle before the first word, already titled.
      - id: open-board-kinds
        type: whiteboard.apply
        at: { scene: start, offsetMs: -1500 }
        open: true
        upsertIds: [b-title]
      - id: draw-bug
        type: whiteboard.apply
        at: { mark: draw-bug }
        upsertIds: [b-bug-box, b-bug-text]
        drawMs: 1200
      - id: draw-panic
        type: whiteboard.apply
        at: { mark: draw-panic }
        upsertIds: [b-arrow-a, b-panic-box, b-panic-text, b-stops, b-msg]
        drawMs: 3000
      - id: draw-input
        type: whiteboard.apply
        at: { mark: draw-input }
        upsertIds: [b-input-box, b-input-text]
        drawMs: 1200
      - id: draw-result
        type: whiteboard.apply
        at: { mark: draw-result }
        upsertIds: [b-arrow-b, b-result-box, b-result-text, b-decide, b-parse]
        drawMs: 2800
      - id: draw-values
        type: whiteboard.apply
        at: { mark: draw-values }
        upsertIds: [b-values]
        drawMs: 1400

  - id: result-type
    narration: >
      [[mark:show-result]] Result is an enum for errors you can recover from.
      Ok holds the value when things work, and Err holds the error when they
      don't. T and E are placeholders for those two types. Like Option, you
      must handle both cases to use the value.
    sources:
      - title: "The Rust Book — Recoverable Errors with Result"
        url: "https://doc.rust-lang.org/book/ch09-02-recoverable-errors-with-result.html"
      - title: "std::result::Result"
        url: "https://doc.rust-lang.org/std/result/enum.Result.html"
    actions:
      - id: close-board-kinds
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: show-result
        type: slide.show
        at: { mark: show-result, offsetMs: 300 }
        slideId: result-slide

  - id: parse
    chapter: Parsing a number
    narration: >
      Here's a loop over two pieces of text: forty-two, and the word oops.
      [[mark:type-parse]] Let's turn each one into a number with parse. The
      i32 in angle brackets tells parse which type to make.
      [[mark:select-parse]] So what does parse give back? Not an i32. Text
      like oops can't become a number, so parse returns a Result.
    sources:
      - title: "std — str::parse"
        url: "https://doc.rust-lang.org/std/primitive.str.html#method.parse"
      - title: "The Rust Book — Recoverable Errors with Result"
        url: "https://doc.rust-lang.org/book/ch09-02-recoverable-errors-with-result.html"
    actions:
      - id: close-result-slide
        type: slide.close
        at: { scene: start }
      - id: open-main
        type: workspace.openFile
        at: { scene: start, offsetMs: 800 }
        path: main.rs
      - id: type-parse
        type: editor.type
        at: { mark: type-parse }
        target:
          file: main.rs
          after: "    for input in [\"42\", \"oops\"] {\n"
          occurrence: 1
        cadence: fast-explainer
        text: "        let parsed = input.parse::<i32>();\n"
      - id: select-parse
        type: editor.select
        at: { mark: select-parse }
        target:
          file: main.rs
          text: "input.parse::<i32>()"
          occurrence: 1

  - id: not-a-number
    narration: >
      [[mark:draw-e1-code]] What if you multiply parsed by two anyway?
      [[mark:draw-e1-msg]] The compiler stops you with error E0369. It can't
      multiply a Result by an integer.
      [[mark:draw-e1-type]] It also shows you the real type of parsed.
      [[mark:draw-e1-fix]] To get the number out, you have to handle both
      cases first.
    sources:
      - title: "Rust error codes — E0369"
        url: "https://doc.rust-lang.org/error_codes/E0369.html"
      - title: "std::num::ParseIntError"
        url: "https://doc.rust-lang.org/std/num/struct.ParseIntError.html"
    actions:
      - id: open-board-e1
        type: whiteboard.apply
        at: { scene: start }
        open: true
        clear: true
        upsertIds: [e1-title]
      - id: draw-e1-code
        type: whiteboard.apply
        at: { mark: draw-e1-code, offsetMs: 300 }
        upsertIds: [e1-code1, e1-code2]
        drawMs: 1800
      - id: draw-e1-msg
        type: whiteboard.apply
        at: { mark: draw-e1-msg }
        upsertIds: [e1-msg1, e1-msg2]
        drawMs: 2200
      - id: draw-e1-type
        type: whiteboard.apply
        at: { mark: draw-e1-type }
        upsertIds: [e1-under, e1-type]
        drawMs: 1600
      - id: draw-e1-fix
        type: whiteboard.apply
        at: { mark: draw-e1-fix }
        upsertIds: [e1-fix]
        drawMs: 1400

  - id: match
    narration: >
      [[mark:type-match]] Let's handle it with a match: one arm for Ok, and
      one for Err.
      [[mark:select-ok]] In the Ok arm, n is the i32 itself.
      [[mark:select-err]] In the Err arm, e is the error, and printing it says
      what went wrong. Leave out either arm, and it's error E0004: the match
      doesn't cover every case.
    sources:
      - title: "The Rust Book — Recoverable Errors with Result"
        url: "https://doc.rust-lang.org/book/ch09-02-recoverable-errors-with-result.html"
      - title: "Rust error codes — E0004"
        url: "https://doc.rust-lang.org/error_codes/E0004.html"
    actions:
      - id: close-board-e1
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: type-match
        type: editor.type
        at: { mark: type-match, offsetMs: 300 }
        target:
          file: main.rs
          after: "        let parsed = input.parse::<i32>();\n"
          occurrence: 1
        cadence: line-by-line
        text: "        match parsed {\n            Ok(n) => println!(\"{input} is the number {n}\"),\n            Err(e) => println!(\"{input} failed: {e}\"),\n        }\n"
      - id: select-ok
        type: editor.select
        at: { mark: select-ok }
        target:
          file: main.rs
          text: "Ok(n)"
          occurrence: 1
      - id: select-err
        type: editor.select
        at: { mark: select-err }
        target:
          file: main.rs
          text: "Err(e)"
          occurrence: 1

  - id: question-mark
    chapter: The question-mark operator
    narration: >
      [[mark:select-match]] Writing a match every time gets long. One
      shortcut is unwrap. It gives you the value on Ok, but it panics on Err.
      That's fine in a quick test, but not for user input.
      [[mark:show-q]] A better one is the question-mark operator. Put it after
      a call that returns a Result. On Ok, it unwraps the value, and your code
      keeps going. On Err, it returns that error from the function right away,
      and the caller decides what to do.
    sources:
      - title: "The Rust Book — Shortcuts for Panic on Error: unwrap and expect"
        url: "https://doc.rust-lang.org/book/ch09-02-recoverable-errors-with-result.html#shortcuts-for-panic-on-error"
      - title: "The Rust Book — The ? Operator Shortcut"
        url: "https://doc.rust-lang.org/book/ch09-02-recoverable-errors-with-result.html#the--operator-shortcut"
      - title: "The Rust Reference — The try propagation expression"
        url: "https://doc.rust-lang.org/reference/expressions/operator-expr.html#the-try-propagation-expression"
    actions:
      - id: select-match
        type: editor.select
        at: { mark: select-match }
        target:
          file: main.rs
          text: "match parsed {\n            Ok(n) => println!(\"{input} is the number {n}\"),\n            Err(e) => println!(\"{input} failed: {e}\"),\n        }"
          occurrence: 1
      - id: show-q
        type: slide.show
        at: { mark: show-q }
        slideId: question-slide

  - id: add
    narration: >
      [[mark:type-add]] Let's write a function called add. It parses two
      pieces of text and adds them. The use line at the top brings in parse's
      error type for whole numbers.
      [[mark:select-q]] Here's the question mark, after the first parse. If
      that text isn't a number, add stops right here and returns the Err.
      [[mark:select-sum]] If both parse, we wrap the sum in Ok, because add
      returns a Result.
    sources:
      - title: "The Rust Book — Propagating Errors"
        url: "https://doc.rust-lang.org/book/ch09-02-recoverable-errors-with-result.html#propagating-errors"
      - title: "std::num::ParseIntError"
        url: "https://doc.rust-lang.org/std/num/struct.ParseIntError.html"
    actions:
      - id: close-q-slide
        type: slide.close
        at: { scene: start }
      - id: type-add
        type: editor.type
        at: { mark: type-add, offsetMs: 300 }
        target:
          file: main.rs
          after: ""
          occurrence: 1
        cadence: line-by-line
        text: "use std::num::ParseIntError;\n\nfn add(a: &str, b: &str) -> Result<i32, ParseIntError> {\n    let x = a.parse::<i32>()?;\n    let y = b.parse::<i32>()?;\n    Ok(x + y)\n}\n\n"
      - id: select-q
        type: editor.select
        at: { mark: select-q }
        target:
          file: main.rs
          text: "a.parse::<i32>()?"
          occurrence: 1
      - id: select-sum
        type: editor.select
        at: { mark: select-sum }
        target:
          file: main.rs
          text: "Ok(x + y)"
          occurrence: 1

  - id: needs-result
    narration: >
      [[mark:select-ret]] Look at add's return type: a Result. That gives the
      question mark a place to send the error.
      [[mark:draw-e2-code]] What if you use it in main instead? main returns
      unit, written as empty parentheses.
      [[mark:draw-e2-msg]] You get error E0277: the question-mark operator can
      only be used in a function that returns Result or Option.
      [[mark:draw-e2-works]] That's why it works in add.
    sources:
      - title: "The Rust Book — Where to Use the ? Operator"
        url: "https://doc.rust-lang.org/book/ch09-02-recoverable-errors-with-result.html#where-to-use-the--operator"
      - title: "Rust error codes — E0277"
        url: "https://doc.rust-lang.org/error_codes/E0277.html"
      - title: "std — The unit type ()"
        url: "https://doc.rust-lang.org/std/primitive.unit.html"
    actions:
      - id: select-ret
        type: editor.select
        at: { mark: select-ret }
        target:
          file: main.rs
          text: "Result<i32, ParseIntError>"
          occurrence: 1
      - id: open-board-e2
        type: whiteboard.apply
        at: { mark: draw-e2-code, offsetMs: -300 }
        open: true
        clear: true
        upsertIds: [e2-title]
      - id: draw-e2-code
        type: whiteboard.apply
        at: { mark: draw-e2-code, offsetMs: 300 }
        upsertIds: [e2-code1, e2-code2, e2-under-main, e2-returns]
        drawMs: 2600
      - id: draw-e2-msg
        type: whiteboard.apply
        at: { mark: draw-e2-msg }
        upsertIds: [e2-circle-q, e2-msg1, e2-msg2]
        drawMs: 3000
      - id: draw-e2-works
        type: whiteboard.apply
        at: { mark: draw-e2-works }
        upsertIds: [e2-works, e2-works-code]
        drawMs: 1600

  - id: calls
    narration: >
      [[mark:type-calls]] Let's call add from main, with twenty and
      twenty-two, then with oops. We print each Result with the Debug
      placeholder you've seen with structs.
    sources:
      - title: "std::fmt::Debug"
        url: "https://doc.rust-lang.org/std/fmt/trait.Debug.html"
    actions:
      - id: close-board-e2
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: type-calls
        type: editor.type
        at: { mark: type-calls, offsetMs: 400 }
        target:
          file: main.rs
          after: "            Err(e) => println!(\"{input} failed: {e}\"),\n        }\n    }\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n    println!(\"{:?}\", add(\"20\", \"22\"));\n    println!(\"{:?}\", add(\"20\", \"oops\"));\n"

  - id: run
    narration: >
      [[mark:run]] Let's run it. Forty-two became a number. The word oops
      failed, and the error says why: invalid digit found in string. add gives Ok,
      forty-two. With oops, it's an Err. The question mark returned it early,
      so the addition never ran, and nothing panicked.
    sources:
      - title: "The Rust Book — Recoverable Errors with Result"
        url: "https://doc.rust-lang.org/book/ch09-02-recoverable-errors-with-result.html"
    actions:
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "oops failed: invalid digit found in string"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: "let x = a.parse::<i32>()?;"

  - id: wrap
    narration: >
      So panic is for bugs, and it stops the program. Result is for errors you
      expect: handle it with match, or send it to the caller with the
      question mark.
      Next, generics: one function for many types.
    sources:
      - title: "The Rust Book — To panic! or Not to panic!"
        url: "https://doc.rust-lang.org/book/ch09-03-to-panic-or-not-to-panic.html"
      - title: "The Rust Book — Generic Data Types"
        url: "https://doc.rust-lang.org/book/ch10-01-syntax.html"
    actions: []

checks:
  # 500 (not 300): google-svg deck slides embed per-slide font data whose
  # paint briefly stalls the main thread at each show/close.
  - { type: timing.p95Ms, max: 500 }
