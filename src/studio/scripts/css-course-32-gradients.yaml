# CSS course (Burmese), lesson 32 of 43: gradients.
#
# Narration is Burmese (voice-script.md next to this file is its source;
# DESIGN.md is the span-by-span brief). Every [[mark:…]] sits where its action
# begins, at a sentence end; each span carries one piece of meaning.
# Everything the learner sees (title, chapters, whiteboard labels, UI strings)
# is already Burmese.
#
# Shape: board (recall lesson 31; a gradient is a picture the browser draws, so
# it goes in background-image, not background-color) → code tour (header with
# an empty awning strip, a dark hero with white text, an empty tea glass, a
# coin badge, a beige pie with a legend in a card, two beige bars) → hero:
# background-color: linear-gradient() does nothing (invalid, dropped) →
# background-image: top to bottom → to right → board (0deg up, clockwise,
# to right = 90deg, corner keywords depend on the box) → 135deg → a 60% stop
# → board (stops on a ruler, colour hint, hard stop) → the glass gets three
# hard-stop bands (double positions; a 0 is raised to the previous stop) →
# the hero gets a dark see-through layer on top (the first layer is on top)
# → coin: default radial, then circle at 30% 30% → board (size keywords,
# ending shape, explicit sizes) → board (conic as a clock: 12 o'clock,
# clockwise, from, at) → pie: soft conic, then a hard-stop pie chart →
# awning: repeating stripes → stats card: one big spot, then background-size
# tiles it into dots → bars: blue → yellow in sRGB (grey middle) and
# `in oklch` on the second bar (vivid) → board (default interpolation, `in`,
# shorter/longer hue) → quiz + recap, hand-off to the background properties
# (lesson 33).
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set(; no postcss config; no reload.
# A keystroke-typed gradient has an unclosed "(" until its last ")", and an
# unclosed function swallows the rest of the stylesheet. So every keystroke
# edit lands in the LAST rule of the file (nothing after it can be swallowed)
# and the one edit into an earlier rule (the hero's layers, after the glass
# rule exists) is line-by-line: each revealed line has balanced parentheses.
# The glass and awning rules are line-by-line too: long stop lists the
# narration summarises and then points at with editor.select.
# A keystroke edit always has a "}" after the cursor (a new rule lands first
# as an empty block insert; the only exception is the hero's first line,
# background-color, which is invalid in every half-typed state): at the very
# end of the file the browser closes
# an open "(" and "{" by itself, so "radial-gradient(#fff" would paint white.
# With the "}" in the way, a new declaration stays invalid until its last ")"
# and the previous one in the same rule keeps painting.
#
# Measured in headless Chrome at 432 × 720 (probe/stages.ts, same anchors):
# header 0–125 (awning 28 tall at the top), hero 141–341 (400 × 200), glass
# 80 × 140 at y 357, coin 96 × 96 at y 379, stats card 513–707 (pie 160),
# bars at y 748 and 818, document 886 tall (screenshots in probe/).
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
