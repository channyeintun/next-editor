  - id: gray-failure
    chapter: "Gray failure"
    narration: >
      [[mark:close-p03b]] [[mark:draw-b3-s1]] ဒါဆို Bank Y ညနေကို ပြန်သွားရအောင်။ အပေါ်ဘက်က status check က server တိုင်းကို မိနစ်တိုင်း မေးကြည့်ပြီး ပြန်ဖြေရင် up လို့ ပြတာမို့ ညနေ တစ်ခုလုံး အစိမ်းရောင်ပါပဲ။ ဒါပေမဲ့ ဒီ check က server ပြန်ဖြေနိုင်သေးလားလို့ပဲ မေးတာပါ၊ user ရဲ့ ငွေလွှဲ ဘယ်လောက် ကြာလဲ ဆိုတာ မမေးပါဘူး။
      [[mark:draw-b3-s2]] အောက်ဘက်ကတော့ Android app အဟောင်းကနေ Bank Y ကို ငွေလွှဲတာတွေထဲက ၅ စက္ကန့်ထက် ကြာတဲ့ ရာခိုင်နှုန်းကို မိနစ် ၃၀ စီ ပြထားတာပါ။ [[mark:draw-b3-s2b]] လိမ္မော်ရောင် မျဉ်းက နှေးတာ ၁ ရာခိုင်နှုန်းထက် မပိုရဘူး ဆိုတဲ့ ပစ်မှတ်ပါ။ lesson ၃ မှာ ပြောခဲ့သလို ဒီလို သဘောတူထားတဲ့ ပစ်မှတ်ကို service level objective၊ အတိုကောက် SLO လို့ ခေါ်ပါတယ်။ ပထမ ၁ နာရီမှာ ၁ ရာခိုင်နှုန်း မပြည့်လို့ မျဉ်းအောက်မှာပါ။
      [[mark:draw-b3-s3]] နောက် ၂ နာရီမှာတော့ ၂၀ ရာခိုင်နှုန်းလောက်အထိ တက်သွားပြီး၊ ဒါက lesson အစက ၂ နာရီပါ။ ဒီလို server တွေ up နေပေမဲ့ Android app အဟောင်း သုံးသူတွေလို user တချို့အတွက် နှေးနေတာ၊ တစ်ဝက်တစ်ပျက် ပျက်နေတာမျိုးကို gray failure လို့ ခေါ်ပါတယ်။ ငွေလွှဲ အားလုံးရဲ့ ပျမ်းမျှက ကောင်းနေတုန်းပဲ ဖြစ်ပြီး ဒုက္ခက user အုပ်စု တစ်ခုမှာပဲ စုနေလို့ dashboard မှာ မမြင်ရတာပါ။
    sources:
