  - id: golden-path
    chapter: "Golden path နဲ့ guardrail"
    narration: >
      [[mark:draw-b2-s1]] ဒုတိယ ပြောင်းလဲမှုက service အသစ် တစ်ခု production ရောက်ပုံပါ။ Padauk က လျှပ်စစ် မီတာခ ပေးလို့ရမယ့် Bill Pay ကို ထုတ်တော့မှာပါ။ အပေါ်ဘက်က လမ်းဟောင်းမှာ developer က ticket တင်ပြီး ops ဆီက server ကို ၂ ပတ်လောက် စောင့်ရပါတယ်။ [[mark:draw-b2-s1b]] ရလာတဲ့ server မှာလည်း monitoring မပါလို့ ပျက်ရင် user တွေ မတိုင်မချင်း ဘယ်သူမှ မသိပါဘူး။
      [[mark:draw-b2-s2]] ဒါကြောင့် မသီရိက template တစ်ခု ဆောက်လိုက်ပါတယ်။ အောက်ဘက်က လမ်းသစ်မှာ developer က template ကို ရွေးလိုက်ရုံနဲ့ metric၊ alert၊ backup တွေ ပါပြီးသား service ရပါတယ်။ ဒီလို လိုက်သွားရုံနဲ့ reliability အများစု ပါလာတဲ့ standard လမ်းကို golden path လို့ ခေါ်ပါတယ်။
      [[mark:draw-b2-s2b]] lesson ၁ က ပြောခဲ့တဲ့ developer က ကိုယ်ရေးတာကို ကိုယ်တိုင် run တဲ့ ပုံစံကို you build it, you run it လို့ ခေါ်ပါတယ်။ ဒါပေမဲ့ server၊ network၊ storage၊ security အားလုံးကို တစ်ယောက်တည်း မကျွမ်းကျင်နိုင်လို့ အဲဒါတွေကို platform က ထမ်းပေးမှ ဖြစ်နိုင်တာပါ။
      [[mark:draw-b2-s3]] template ထဲမှာ check တွေလည်း ပါပါတယ်။ Bill Pay ရဲ့ ပထမဆုံး deploy မှာ developer တစ်ယောက်က lesson ၂ က ဝန်ဆောင်ခ typo လိုပဲ config မှာ typo ရိုက်မိပေမဲ့ check က deploy မလုပ်ခင်မှာပဲ ရပ်ပေးလိုက်ပါတယ်။ ဒီလိုနဲ့ Bill Pay က ၂ ပတ် မစောင့်ရဘဲ monitoring အပြည့်နဲ့ production ရောက်သွားပြီး အဲဒီ template က Padauk ရဲ့ ပထမဆုံး golden path ဖြစ်လာပါတယ်။
