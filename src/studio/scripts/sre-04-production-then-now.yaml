# SRE from zero, lesson 04: production then and now.
#
# Built from the approved voice script
# docs/sre-course/voice-scripts/sre-04-production-then-now.md. The narration
# is that script's spoken lines, character for character; each ⟪…⟫ marker is
# a [[mark:…]] at the same place. Check with
#   bun ~/Documents/sre-course/work/check-narration.ts \
#     docs/sre-course/voice-scripts/sre-04-production-then-now.md \
#     src/studio/scripts/sre-04-production-then-now.yaml
#
# The arc: the cover asks who is right when every status check is green but
# Bank Y transfers are slow; a compare page sets hand-kept servers against
# workloads on rented platforms; board B1 turns capacity into a spending
# choice (Thingyan peak, idle money, autoscaling, the doubled bill, spot vs
# reserved, the provider's control plane); board B2 sets the two-week ticket
# path against the Bill Pay template (golden path, the platform underneath, a
# check that stops a typo); pages name guardrails and rules written as code;
# board B3 shows the gray failure from the hook; pages answer the hook (server
# says, user feels; when you find out) and point at seeing production; the
# recap selects the five terms in notes.md and leaves a pause before the
# answer to its question.
#
# Pacing (decided for Module 1, settled at YAML build time): stretches that
# would hold one page or board step longer than ~35 s got extra page advances
# (l04_p01b, l04_p02b, l04_p02c, l04_p03b, l04_p04b, l04_p05b) or board steps
# (B1 steps 3b, 4 and 5; B2 step 2b), each at an existing sentence end. B2
# step 1b keeps step 1 to three boxes, and B3 step 2b lands the orange target
# as the narration names it, both at existing sentence ends too. The
# spoken text did not change. ask-question is one more mark at an existing
# sentence end: the question-line select hangs off it so the select's drag
# lands in silence after the question, and the answer waits for it.
#
# Deck: "Next Editor · SRE 1 · Why SRE". The deckUrl placeholder is swapped
# for the real /pub link once Chan publishes the deck; until then the
# Director warns that the deck is unreachable.
#
# Board colours (course colour jobs, authored for light mode; the dark board
# inverts them): #1e1e1e ink paints white; blue #1971c2 = the thing named and
# data series; green #2f9e44 = healthy; red #e03131 = failure; orange
# #f08c00 = caveat, limit or threshold; violet #6741d9 = a second series.
# A label that needs two or three lines is one text asset per line, so each
# line meets the 0.55 em width rule on its own.
