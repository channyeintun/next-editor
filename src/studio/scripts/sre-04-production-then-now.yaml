build:
  # Studio swaps in the Burmese voice chosen in the render console
  # (AthanLab or VoxCPM2); scripts keep pinning a built-in profile.
  voiceProfile: pocket-alba-v1
  seed: 2604

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: hook
    chapter: "Production အရင်နဲ့ အခု"
    narration: >
      [[mark:show-p01]] reliability အတွက် လူနဲ့ အချိန် ပေးဖို့ CTO ကိုနေလင်း သဘောတူပြီးကတည်းက မသီရိက ပထမနှစ် စာရင်းကို တစ်ခုချင်း လုပ်နေပါတယ်။ တစ်ရက် ညနေမှာတော့ Bank Y ကို ငွေလွှဲတာ အကြာကြီး စောင့်နေရတယ် ဆိုတဲ့ post တွေ တက်လာတာကို support အဖွဲ့ကို ဦးဆောင်တဲ့ မစု သတိထားမိပါတယ်။
      [[mark:show-p01b]] မသီရိက dashboard ကို ဖွင့်ကြည့်တော့ status check တွေ အားလုံး up ဖြစ်ပြီး အစိမ်းရောင် ပြနေပါတယ်။ ဒါပေမဲ့ user တချို့အတွက်တော့ ၂ နာရီလောက် Bank Y ကို ငွေလွှဲလို့ မရသလောက် နှေးနေခဲ့ပါတယ်။ ဒါဆို ဘယ်သူ မှန်လဲ၊ dashboard လား၊ user တွေလား?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book second edition (Google Cloud Blog)",
          url: "https://cloud.google.com/blog/products/devops-sre/sre-book-second-edition",
        }
      - {
          title: "Google Cloud Well-Architected Framework: Reliability pillar",
          url: "https://docs.cloud.google.com/architecture/framework/reliability",
        }
    actions:
      # -1750 / -1450, not the skeleton's -1900 / -1600: a pull-back over 1780 ms pushes the
      # first dialog past the 2 s opening handle, which src/studio/plans/index.test.ts rejects.
      - { id: collapse-dock, type: runtime.collapseDock, at: { scene: start, offsetMs: -1750 } }
      - {
          id: show-p01,
          type: slide.show,
          at: { mark: show-p01, offsetMs: -1450 },
          slideId: l04_p01,
        }
      # Pacing: the cover's details and question arrive with the dashboard.
      - { id: show-p01b, type: slide.show, at: { mark: show-p01b }, slideId: l04_p01b }

  - id: then-now
    narration: >
      [[mark:show-p02]] ဒီမေးခွန်းကို မဖြေခင် production ဘယ်လို ပြောင်းလဲလာလဲ အရင် ကြည့်ရအောင်။ ဘယ်ဘက်က အရင်ခေတ်မှာ server တွေကို ကိုယ်တိုင် ဝယ်ပြီး တစ်လုံးချင်း လက်နဲ့ ပြုစုခဲ့ကြပါတယ်။ server အသစ် လိုရင် ticket တင်ပြီး ရက်သတ္တပတ်ချီ စောင့်ရသလို၊ system ကောင်းမကောင်းကိုလည်း server ရဲ့ uptime နဲ့ပဲ တိုင်းခဲ့ကြပါတယ်။
      [[mark:show-p02b]] ညာဘက်က အခုခေတ်မှာတော့ Padauk လို ကုမ္ပဏီ အသေးတွေကတောင် cloud ကနေ စက် ငှားပြီး code ကို container တွေ၊ request ဝင်လာမှ run တဲ့ function တွေအဖြစ် run ပါတယ်။ developer က လိုတာကို ticket မတင်ဘဲ self-service နဲ့ ကိုယ်တိုင် ယူနိုင်လို့ မိနစ်ပိုင်းပဲ ကြာပါတယ်။
      [[mark:show-p02c]] ဒီလို server တစ်လုံးချင်းအစား container၊ function လို workload တွေကို platform ပေါ်မှာ run ပြီး user ခံစားရတာကို ကြည့်တဲ့ ပုံစံကို workload-centric လို့ ခေါ်ပါတယ်။ ပြဿနာက Padauk ရဲ့ dashboard က server up လား ဆိုတဲ့ အရင်ခေတ် မေးခွန်းကိုပဲ ဖြေနေသေးတာပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book, 1st ed: The Production Environment at Google",
          url: "https://sre.google/sre-book/production-environment/",
        }
      - {
          title: "Hybrid and multicloud architecture patterns",
          url: "https://docs.cloud.google.com/architecture/hybrid-multicloud-patterns",
        }
    actions:
      # Advances in place from the cover: the left (then) column first.
      - { id: show-p02, type: slide.show, at: { mark: show-p02 }, slideId: l04_p02 }
      # Pacing: the right (now) column lands as the narration turns to it.
      - { id: show-p02b, type: slide.show, at: { mark: show-p02b }, slideId: l04_p02b }
      # Pacing: the comparison gets its name, workload-centric.
      - { id: show-p02c, type: slide.show, at: { mark: show-p02c }, slideId: l04_p02c }

  - id: capacity
    chapter: "Capacity နဲ့ cloud bill"
    narration: >
      [[mark:close-p02]] [[mark:draw-b1-s1]] cloud ကြောင့် ပထမဆုံး ပြောင်းသွားတာက capacity ပါ။ ဒီ bar တွေက Padauk ရဲ့ လအလိုက် traffic ဖြစ်ပြီး ဧပြီလမှာ သင်္ကြန်ကြောင့် အများကြီး မြင့်ပါတယ်။ ကိုယ်ပိုင် server ခေတ်မှာတော့ စက်ရဖို့ လနဲ့ချီ ကြာလို့ တစ်နှစ်လုံးရဲ့ အမြင့်ဆုံး လကို ခံနိုင်အောင် ကြိုဝယ်ထားရပါတယ်။
      [[mark:draw-b1-s2]] ဒီ လိမ္မော်ရောင် မျဉ်းက peak အတွက် ကြိုဝယ်ထားတဲ့ capacity ပါ။ မျဉ်းအောက်က နေရာလွတ်တွေကတော့ မသုံးဘဲ အလဟဿ ဖြစ်နေတဲ့ ငွေတွေပါ။ cloud မှာတော့ သုံးသလောက်ပဲ ပေးရလို့ capacity ဆိုတာ ငွေ ဘယ်လောက် သုံးမလဲ ဆိုတဲ့ ဆုံးဖြတ်ချက် ဖြစ်လာပါတယ်။
      [[mark:draw-b1-s3]] ဒီတော့ သင်္ကြန် မတိုင်ခင် capacity တိုးပြီး ပွဲပြီးရင် ပြန်လျှော့နိုင်ပါတယ်၊ load အလိုက် စက်ကို အလိုအလျောက် တိုးပေး လျှော့ပေးတာကို autoscaling လို့ ခေါ်ပါတယ်။ [[mark:draw-b1-s3b]] ဒါပေမဲ့ peak ည တစ်ညမှာ autoscaling မှာ အကန့်အသတ် မရှိတဲ့အပြင် retry loop တစ်ခုက request တွေကို ထပ်ခါထပ်ခါ ပို့နေတော့ စက်တွေ ဆက်တိုးပြီး cloud bill ၂ ဆ ဖြစ်သွားလို့ အခု အကန့်အသတ် ထည့်ထားပါပြီ။
      [[mark:draw-b1-s4]] ငွေကိစ္စက တစ်ခါ စီစဉ်ရုံနဲ့ မပြီးပါဘူး၊ ဥပမာ merchant တွေဆီ ငွေလွှဲတဲ့ settlement job က နောက်ကျလို့ရလို့ စျေးပေါပေမဲ့ provider က ပြန်ယူနိုင်တဲ့ spot instance ပေါ်မှာ run ပြီး payment API ကိုတော့ ကြိုငှားထားတဲ့ စက်တွေပေါ်မှာ ထားပါတယ်။ database ကို provider က run ပေးတဲ့ managed service နဲ့ သုံးရင်တောင် ကိုယ့် design နဲ့ code ကတော့ ကိုယ့်တာဝန်ပါပဲ။
      [[mark:draw-b1-s5]] cloud မှာ ပျက်ပုံကလည်း ပြောင်းလာပါတယ်။ customer တွေ မျှသုံးပြီး စက်နဲ့ setting တွေကို စီမံတဲ့ provider ရဲ့ control plane မှာ ၁ နာရီလောက် ပြဿနာ တက်ရင် ထိခိုက်မယ့် နယ်ပယ်၊ blast radius က customer ထောင်ချီအထိ ကျယ်နိုင်ပါတယ်။ အဲဒီအချိန်မှာ ကိုယ့် app ဆက်အလုပ်လုပ်နိုင်အောင် ကိုယ်ပဲ ကြိုပြင်ထားရပါမယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Google Cloud Well-Architected Framework: Reliability pillar",
          url: "https://docs.cloud.google.com/architecture/framework/reliability",
        }
      - { title: "Workbook: Managing Load", url: "https://sre.google/workbook/managing-load/" }
      - {
          title: "Timeouts, retries, and backoff with jitter (AWS Builders' Library)",
          url: "https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/",
        }
    actions:
      - { id: close-p02, type: slide.close, at: { mark: close-p02, offsetMs: -400 } }
      # Opens on an empty board with the title only (furniture, no drawMs).
      - {
          id: open-b1,
          type: whiteboard.apply,
          at: { mark: draw-b1-s1 },
          open: true,
          clear: true,
          upsertIds: [l04-b1-title],
        }
      - id: draw-b1-s1
        type: whiteboard.apply
        at: { mark: draw-b1-s1, offsetMs: 200 }
        upsertIds:
          [
            l04-b1-axis,
            l04-b1-jan,
            l04-b1-dec,
            l04-b1-m01,
            l04-b1-m02,
            l04-b1-m03,
            l04-b1-m04,
            l04-b1-m05,
            l04-b1-m06,
            l04-b1-m07,
            l04-b1-m08,
            l04-b1-m09,
            l04-b1-m10,
            l04-b1-m11,
            l04-b1-m12,
            l04-b1-thingyan,
          ]
        drawMs: 2600
      - {
          id: draw-b1-s2,
