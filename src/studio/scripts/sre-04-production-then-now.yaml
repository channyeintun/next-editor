          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - { title: "OpenTelemetry: Signals", url: "https://opentelemetry.io/docs/concepts/signals/" }
      - {
          title: "OpenTelemetry: Observability primer",
          url: "https://opentelemetry.io/docs/concepts/observability-primer/",
        }
      - {
          title: "SRE book, 1st ed: Monitoring Distributed Systems",
          url: "https://sre.google/sre-book/monitoring-distributed-systems/",
        }
    actions:
      # Advances in place from l04_p04b: the trace line first.
      - { id: show-p05, type: slide.show, at: { mark: show-p05 }, slideId: l04_p05 }
      # Pacing: the SLO and metric-label lines land as the narration names them.
      - { id: show-p05b, type: slide.show, at: { mark: show-p05b }, slideId: l04_p05b }

  - id: this-week
    narration: >
      [[mark:show-p06]] ဒီအပတ်အတွက်ကတော့ အဖွဲ့ သေးသေးလေးမှာတောင် လုပ်လို့ရတာ သုံးခုပါ။ ပထမ၊ app version အဟောင်း ဒါမှမဟုတ် ဘဏ် တစ်ခုတည်းအတွက်ပဲ နှေးနေတာမျိုး၊ dashboard မမြင်ရတဲ့ failure တစ်ခုကို ရှာကြည့်ပါ။ ဒုတိယ၊ ကိုယ့် autoscaling မှာ အကန့်အသတ် ရှိလား စစ်ကြည့်ပါ။ တတိယ၊ service အသစ် တစ်ခု စဆောက်တာကနေ production ရောက်တဲ့အထိ ဘယ်လောက် ကြာလဲ အချိန် မှတ်ကြည့်ပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Measuring reliability (sre.google)",
          url: "https://sre.google/resources/practices-and-processes/measuring-reliability/",
        }
      - { title: "Workbook: Managing Load", url: "https://sre.google/workbook/managing-load/" }
      - {
          title: "CNCF Platforms White Paper",
          url: "https://tag-app-delivery.cncf.io/whitepapers/platforms/",
        }
    actions:
      - { id: show-p06, type: slide.show, at: { mark: show-p06 }, slideId: l04_p06 }

  - id: recap
    narration: >
      [[mark:close-p06]] [[mark:open-notes]] ဒီနေ့ အချက် ငါးခုကို notes ထဲမှာ စုထားပါတယ်။ [[mark:select-workload]] workload-centric က server တစ်လုံးချင်းအစား workload နဲ့ user ဘက်က ရလဒ်ကို ကြည့်တာပါ။ [[mark:select-golden]] golden path က template ကို ရွေးရုံနဲ့ metric၊ alert၊ backup ပါလာတဲ့ standard လမ်းပါ။ [[mark:select-guardrail]] guardrail က ခွင့်ပြုချက် စောင့်ရတဲ့ ဂိတ် မဟုတ်ဘဲ လမ်းထဲက check ပါ။
      [[mark:select-gray]] gray failure က server တွေ up နေပေမဲ့ user အုပ်စု တစ်ခုအတွက် နှေးနေတာမျိုးပါ။ [[mark:select-user-side]] ဒါကြောင့် reliability ကို user ဘက်ကနေ တိုင်းထားမှ စောစော သိပြီး ပြင်ချိန် ရပါတယ်။ ကဲ၊ ဒီ lesson ရဲ့ မေးခွန်းပါ။ ကိုယ့် dashboard က အစိမ်းရောင် ပြနေတုန်းမှာ user အုပ်စု တစ်ခုရဲ့ request ၂၀ ရာခိုင်နှုန်းက နှေးနေတယ်။ [[mark:ask-question]] ဒါ ဘယ်လို failure မျိုးလဲ?
      [[mark:pause-answer]] ဒါက gray failure ပါ။ နောက် lesson ကတော့ ည ၉ နာရီမှာ စပါမယ်။ promo ကြီး မစခင်မှာ SMS code တွေ နှေးလာတာကို developer ကိုမင်း သတိထားမိပါတယ်။ သူက အဖွဲ့ထဲ ရောက်တာ မကြာသေးသလို ပြီးခဲ့တဲ့လကလည်း သူ့မေးခွန်းကို တစ်ယောက်က ရယ်ခဲ့ဖူးပါတယ်။ ကိုမင်း ပြောရဲပါ့မလား?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book second edition (Google Cloud Blog)",
          url: "https://cloud.google.com/blog/products/devops-sre/sre-book-second-edition",
        }
      - {
          title: "Google Cloud Well-Architected Framework: Reliability pillar",
          url: "https://docs.cloud.google.com/architecture/framework/reliability",
        }
    actions:
      - { id: close-p06, type: slide.close, at: { mark: close-p06 } }
      # notes.md is the entry file and already showing, so no click.
      - {
          id: open-notes,
          type: workspace.openFile,
          at: { mark: open-notes, offsetMs: 300 },
          path: notes.md,
        }
      - {
          id: select-workload,
          type: editor.select,
          at: { mark: select-workload },
          target: { file: notes.md, text: "workload-centric", occurrence: 1 },
        }
      - {
          id: select-golden,
          type: editor.select,
          at: { mark: select-golden },
          target: { file: notes.md, text: "golden path", occurrence: 1 },
        }
      - {
          id: select-guardrail,
          type: editor.select,
          at: { mark: select-guardrail },
          target: { file: notes.md, text: "guardrail", occurrence: 1 },
        }
      - {
          id: select-gray,
          type: editor.select,
          at: { mark: select-gray },
          target: { file: notes.md, text: "gray failure", occurrence: 1 },
        }
      - {
          id: select-user-side,
          type: editor.select,
          at: { mark: select-user-side },
          target: { file: notes.md, text: "user ဘက်က တိုင်းတာ", occurrence: 1 },
        }
      # The ⟪pause 3s⟫: the question-line select starts as the question ends
      # and its drag runs in silence; the answer at pause-answer waits for it
      # (the scheduler holds the next dialog until a select finishes). Hung
      # off ask-question because an action at pause-answer itself would run
      # under the answer instead of before it.
      - id: select-question
        type: editor.select
        at: { mark: ask-question, offsetMs: 3100 }
        target:
          file: notes.md
          text: "မေးခွန်း: dashboard က အစိမ်း၊ ဒါပေမဲ့ user အုပ်စု တစ်ခုရဲ့ request 20% က နှေးနေတယ်။ ဒါ ဘယ်လို failure လဲ?"
          occurrence: 1

checks:
  # 500, not 300: google deck pages stall the main thread at show/close.
  - { type: timing.p95Ms, max: 500 }
