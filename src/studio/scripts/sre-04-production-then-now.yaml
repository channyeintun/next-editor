  - id: server-vs-user
    narration: >
      [[mark:close-b3]] [[mark:show-p04]] အခု အစက မေးခွန်းကို ဖြေလို့ရပါပြီ။ server ဘက်က အားလုံး up ဖြစ်နေပေမဲ့ user ဘက်ကတော့ Bank Y ကို ငွေလွှဲလို့ မရပါဘူး။ ငွေလွှဲ အားလုံးရဲ့ ပျမ်းမျှက ၂ စက္ကန့်ပဲ ရှိပေမဲ့ Android app အဟောင်း user တွေထဲက ၅ ယောက်မှာ ၁ ယောက်က ၂၀ စက္ကန့်လောက် စောင့်နေရလို့ dashboard အစိမ်းရောင် ဖြစ်နေချိန်မှာ ဒေါသထွက်နေတဲ့ post တွေ တက်လာတာပါ။
      [[mark:show-p04b]] နှစ်ဘက်လုံးရဲ့ ကိန်းဂဏန်းတွေ မှန်ပေမဲ့ reliability ကို ဆုံးဖြတ်တာက user ဘက်ပါ။ server ဘက်က dashboard ကိုပဲ ကြည့်နေရင် user တွေ ဒုက္ခရောက်ပြီး post တင်မှ သိရပါတယ်။ user ဘက်ကနေ တိုင်းထားရင်တော့ နှေးတာ ၁ ရာခိုင်နှုန်း ကျော်တာနဲ့ သိရလို့ post တွေ မတက်ခင် ပြင်ဖို့ အချိန် ရပါသေးတယ်။
