  - id: guardrails
    narration: >
      [[mark:close-b2]] [[mark:show-p03]] ခုနက check လို ကန့်သတ်ချက်ကို guardrail လို့ ခေါ်ပါတယ်။ လမ်းဘေးက အကာလိုပဲ အန္တရာယ်ရှိတဲ့ နေရာကို မကျော်အောင် ကာပေးပြီး ဘေးကင်းတဲ့ အလုပ်ကိုတော့ ဆက်သွားခွင့် ပေးပါတယ်။ ဂိတ်မှာဆိုရင် ပြောင်းလဲမှု တစ်ခုချင်းကို လူ တစ်ယောက်က ခွင့်ပြုတဲ့အထိ ရပ်စောင့်ရပါတယ်။ guardrail မှာတော့ check တွေကို လမ်းထဲမှာ ထည့်ထားပြီး monitoring နဲ့ backup ကလည်း အစကတည်းက ပါလို့ developer တွေ ပိုမြန်လာပေမဲ့ risk မတိုးပါဘူး။
      [[mark:show-p03b]] စည်းမျဉ်းတွေကို code နဲ့ ရေးပြီး pipeline ကို စစ်ခိုင်းလို့လည်း ရပါတယ်။ ဥပမာ မှတ်ပုံတင် အချက်အလက်တွေကို ပြည်တွင်းမှာပဲ ထားရမယ်လို့ စည်းမျဉ်းက ဆိုတယ် ဆိုပါစို့။ အဲဒီ data ကို ပြည်ပ ရောက်စေမယ့် deploy မှန်သမျှကို pipeline က တားပေးပါတယ်။
