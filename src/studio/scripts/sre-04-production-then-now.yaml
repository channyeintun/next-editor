  - id: seeing-production
    narration: >
      [[mark:show-p05]] အဲဒီညနေက မသီရိက အချိန် ဘယ်မှာ ကုန်နေလဲ ရှာဖို့ service တိုင်းရဲ့ log ကို တစ်ခုပြီး တစ်ခု ဖွင့်ခဲ့ရပါတယ်။ ငွေလွှဲ request တစ်ခုက gateway၊ payment service၊ ဘဏ် ဆိုပြီး ဖြတ်သွားတာမို့ အစအဆုံး ခြေရာခံပေးတဲ့ trace ရှိရင် ဘယ်နေရာ နှေးနေလဲ မိနစ်ပိုင်းနဲ့ မြင်ရမှာပါ။
      [[mark:show-p05b]] ပြဿနာကို အရင်ဆုံး ပြနိုင်တာက metric အများကြီး မဟုတ်ဘဲ ငွေလွှဲရဲ့ SLO ပါ၊ SLO လွဲမှ အသေးစိတ်ကို ဝင်ရှာရပါတယ်။ metric မှာ ဖုန်းနံပါတ်လို label ထည့်မိရင် metric အရေအတွက် အဆမတန် များလာပြီး bill တက်တတ်လို့ label ကို နည်းနည်းပဲ ထားသင့်ပါတယ်။ data ကိုလည်း support အဖွဲ့ပါ ကြည့်လို့ရအောင် မျှသုံးပါ။ ဒါတွေကို lesson ၈ မှာ ဆက်လေ့လာပါမယ်။
    sources:
