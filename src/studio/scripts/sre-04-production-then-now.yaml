      notes.md: |
        # Production ဘယ်လို ပြောင်းလဲလာလဲ

        - workload-centric — server တစ်လုံးချင်းထက် workload နဲ့ user ရလဒ်ကို ကြည့်
        - golden path — template နဲ့ ဘေးကင်းတဲ့ standard လမ်း
        - guardrail — ခွင့်ပြုချက် အစား လမ်းထဲက check
        - gray failure — server up၊ user တချို့အတွက် နှေး
        - user ဘက်က တိုင်းတာ — server မဟုတ်ဘဲ user ခံစားရတာကို တိုင်း

        မေးခွန်း: dashboard က အစိမ်း၊ ဒါပေမဲ့ user အုပ်စု တစ်ခုရဲ့ request 20% က နှေးနေတယ်။ ဒါ ဘယ်လို failure လဲ?
