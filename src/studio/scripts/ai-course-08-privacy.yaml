      src/customer.js: |
        // Sample data written for this lesson (not a real customer): what the shop's records hold about one
        // ရွှေ member, and the two reviews he wrote this week (r16 and r21 in data/reviews.json).
        import data from "../data/reviews.json";

        const review = (id) => data.reviews.find((r) => r.id === id).text;

        export const customer = {
          name: "အောင်အောင်",
          phone: "09 000 123 456",
          township: "ဗဟန်း",
          orders: "လက်ဖက်ရည် 20 · မုန့်ဟင်းခါး 12",
        };

        export const reviews = [review("r16"), review("r21")];
      src/main.js: |
        import { customer, reviews } from "./customer.js";
        import { PHONE, KNOWN_NAMES, keepOnly, redact, showSent, showPrivacyControls } from "./privacy.js";

        // What the shop's page sends to the model on the server with အောင်အောင်'s two reviews:
        let sent = { ...customer, reviews };

        // 1. Only what the review analysis needs:

        // 2. Rules that hide personal data (PII) in what he typed:
        const rules = [
        ];
        sent = redact(sent, rules);

        // 3. How many days the shop keeps its raw logs:
        let keepDays = Infinity;

        showSent(sent, keepDays);
      src/privacy.js: |
        // Privacy steps for the review analysis, and the customer's page. Plain rules: no model runs here.
        import { panel } from "ai-panel";
        import { button, choices, row } from "./ui.js";
        import { customer } from "./customer.js";

        // Patterns for personal data (PII) in free text.
        export const PHONE = /09[ 0-9]{7,12}[0-9]/g; // a Myanmar mobile number
        export const KNOWN_NAMES = /လှလှ|အောင်အောင်|မောင်မောင်/g; // names in the shop's records

        // Keep only the fields the feature needs.
        export const keepOnly = (sent, fields) =>
          Object.fromEntries(Object.entries(sent).filter(([field]) => fields.includes(field)));

        // Replace every match of each rule's pattern with its mark, in every text that is sent.
        const clean = (text, rules) => rules.reduce((t, [pattern, mark]) => t.replace(pattern, mark), String(text));
        export const redact = (sent, rules) =>
          Object.fromEntries(
            Object.entries(sent).map(([field, value]) => [
              field,
              Array.isArray(value) ? value.map((text) => clean(text, rules)) : clean(value, rules),
            ]),
          );

        const texts = (sent) => Object.values(sent).flat().map(String);
        const count = (sent, pattern) => texts(sent).reduce((n, text) => n + (text.match(pattern)?.length ?? 0), 0);

        // The AI panel: what this page would send to the model on the server, and a check of it.
        export function showSent(sent, keepDays) {
          panel.metrics("Privacy check", {
            fields: Object.keys(sent).length,
            "phone numbers": count(sent, PHONE),
            names: count(sent, KNOWN_NAMES),
            "raw logs": Number.isFinite(keepDays) ? `${keepDays} days` : "forever",
          }, { id: "check", badge: "rules · AI မပါ" });
          // One column, "field · value", so a long review never squeezes the field names.
          const rows = Object.entries(sent).flatMap(([field, value]) =>
            Array.isArray(value)
              ? value.map((text) => ({ "field · value": `${field.replace(/s$/, "")} · ${text}` })) // reviews → review
              : [{ "field · value": `${field} · ${value}` }],
          );
          panel.table("Leaves the browser", rows, { id: "sent", columns: ["field · value"] });
        }

        // What the customer reads when he opens the details: what is sent and why, what is removed, how long.
        function details(sent, keepDays) {
          const reviews = sent.reviews?.length ?? 0;
          const removed = count(sent, PHONE) === 0 && count(sent, KNOWN_NAMES) === 0;
          return [
            `review ${reviews} ခု · ဆိုင်ကို ဘာပြောလဲ သိဖို့`,
            "orders" in sent ? "မှာခဲ့တာ အရေအတွက် · အကြံပေးဖို့" : null,
            removed ? "ဖုန်း၊ နာမည် · ဒီ စက်ထဲမှာပဲ ဖယ်ပါတယ်" : "ဖုန်း၊ နာမည် · ပါနေပါတယ်",
            Number.isFinite(keepDays) ? `log · ${keepDays} ရက်ပြီးရင် ဖျက်ပါတယ်` : "log · အမြဲ သိမ်းထားပါတယ်",
          ].filter(Boolean).join("\n");
        }

        // The customer's page (#app): a label that says where his reviews go, the details behind it, and a
        // question asked where it matters, before his past orders are used.
        export function showPrivacyControls(sent, keepDays) {
          let agreed = false;
          let open = false;
          const label = row();
          const where = document.createElement("span");
          where.dataset.testid = "where";
          where.textContent = "review ကို စစ်ဖို့ server ကို လုံခြုံစွာ ပို့ပါတယ်";
          label.append(where);
          button("ဘယ်လို လုပ်လဲ", "how", () => {
            open = !open;
            draw();
          }, label);
          const more = row();
          more.dataset.testid = "details";
          more.style.whiteSpace = "pre-line";
          more.style.display = "none";
          choices("consent", ["သုံးပါ", "မသုံးပါနဲ့"], (choice) => {
            agreed = choice === "သုံးပါ";
            draw();
          }, { label: "မှာခဲ့ဖူးတာတွေကို သုံးပြီး အကြံပေးရမလား" });
          const draw = () => {
            const now = agreed ? { ...sent, orders: customer.orders } : sent;
            showSent(now, keepDays);
            more.textContent = open ? details(now, keepDays) : "";
            more.style.display = open ? "block" : "none";
          };
        }
      src/ui.js: |
        // Page controls for the lesson program: a row of buttons or choices in #app, above the AI panel.
        // Plain DOM, so the studio records every click and replay shows it exactly. Each control gets a
        // data-testid for preview.click. #app starts empty on every run, so controls are drawn by the
        // program each time. A handler that throws prints to the panel's Console (never the page).
        //
        //   import { row, button, choices } from "./ui.js";
        //   choices("threshold", [0.5, 0.7, 0.9], (t) => show(t), { selected: 0.5 });
        //     → buttons with test ids threshold-1, threshold-2, threshold-3 (1-based, in order)
        //   button("ဖော်ပြချက်တွေ ကြည့်မယ်", "show-descriptions", () => …);
        const STYLE_ID = "ui-style";
        const STYLE = `
        #app .ui-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px 0;
          font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans Myanmar", "Myanmar Sangam MN", "Myanmar Text", sans-serif; color: #d9dce2; }
        #app .ui-label { color: #adb5bd; font-size: 13px; }
        #app .ui-btn { font: inherit; color: #f1f3f5; background: #2d323c; border: 1px solid #3a404b; border-radius: 6px; padding: 3px 12px; cursor: pointer; }
        #app .ui-btn[aria-pressed="true"] { background: #7048e8; border-color: #7048e8; color: #fff; font-weight: 600; }
        `;

        function ensureStyle() {
          if (document.getElementById(STYLE_ID)) return;
          const style = document.createElement("style");
          style.id = STYLE_ID;
          style.textContent = STYLE;
          document.head.append(style);
        }

        const safe = (fn) => (...args) => {
          try {
            const result = fn(...args);
            if (result && typeof result.catch === "function") result.catch((error) => console.error(error));
          } catch (error) {
            console.error(error);
          }
        };

        /** A new row in #app, optionally with a short label in front. Returns the row element. */
        export function row(label = "") {
          ensureStyle();
          const el = document.createElement("div");
          el.className = "ui-row";
          if (label) {
            const span = document.createElement("span");
            span.className = "ui-label";
            span.textContent = label;
            el.append(span);
          }
          document.getElementById("app").append(el);
          return el;
        }

        /** One button. `testid` is used as is. */
        export function button(label, testid, onClick, parent = row()) {
          const el = document.createElement("button");
          el.type = "button";
          el.className = "ui-btn";
          el.textContent = String(label);
          el.dataset.testid = testid;
          el.addEventListener("click", safe(onClick));
          parent.append(el);
          return el;
        }

        /** A row of choices; the picked one is shown pressed. Test ids are `<name>-1`, `<name>-2`, … */
        export function choices(name, options, onPick, { label = name, selected } = {}) {
          const parent = row(label);
          const buttons = options.map((option, i) =>
            button(option, `${name}-${i + 1}`, () => {
              for (const b of buttons) b.setAttribute("aria-pressed", String(b === buttons[i]));
              onPick(option, i);
            }, parent),
          );
          for (const [i, b] of buttons.entries()) b.setAttribute("aria-pressed", String(options[i] === selected));
          return buttons;
        }
      vite.config.js: |
        import { defineConfig } from "vite";
        import courseRunner from "./course/runner.js";

        export default defineConfig({
          plugins: [courseRunner()],
        });
