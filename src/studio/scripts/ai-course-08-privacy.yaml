  - id: collect
    chapter: "လိုတာကိုပဲ ယူရအောင်"
    narration: >
      data အလွှာရဲ့ ပထမ စည်းကမ်းက feature အတွက် လိုတာကိုပဲ ယူဖို့ပါ။ review ဘာအကြောင်း ပြောလဲ ခွဲဖို့ review
      စာသားပဲ လိုပြီး၊ customer ရဲ့ profile မလိုပါဘူး။ နောင် လိုမလား ဆိုပြီး အကုန် ယူထားရင်၊ ပေါက်ကြားတဲ့
      နေ့မှာ ဆုံးရှုံးမယ့် data လည်း အကုန်ပါပဲ။ [[mark:type-keep]] ဒါကြောင့် review နှစ်ခုကိုပဲ ချန်ထားတဲ့
      စာကြောင်း ထည့်ပါမယ်။ [[mark:read-keep]] field က ငါးခုကနေ တစ်ခု ဖြစ်သွားပြီး၊ review နှစ်ခုပဲ
      ကျန်ပါတော့တယ်။ ဒါပေမဲ့ customer ရေးတဲ့ စာထဲမှာ ဖုန်းနံပါတ် တစ်ခုနဲ့ နာမည် တစ်ခု ကျန်နေသေးပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: AI governance: Build responsibly (privacy: collect only what's needed)",
          url: "https://web.dev/learn/ai/responsibility",
        }
    actions:
      - id: type-keep
        type: editor.type
        at: { mark: type-keep }
        target:
          {
            file: src/main.js,
            after: "// 1. Only what the review analysis needs:\n",
            occurrence: 1,
          }
        text: "sent = keepOnly(sent, [\"reviews\"]);\n"
        cadence: line-by-line
      - id: expect-sent-2
        type: expect.preview
        at: { afterAction: type-keep }
        timeoutMs: 8000
        target: { by: testId, value: ai-sent }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-fields-1
        type: expect.preview
        at: { afterAction: expect-sent-2 }
        timeoutMs: 5000
        target: { by: testId, value: ai-check-1 }
        attribute: { name: data-value, value: "1" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-phones-1
        type: expect.preview
        at: { mark: read-keep }
        timeoutMs: 5000
        target: { by: testId, value: ai-check-2 }
        attribute: { name: data-value, value: "1" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-names-1
        type: expect.preview
        at: { afterAction: expect-phones-1 }
        timeoutMs: 5000
        target: { by: testId, value: ai-check-3 }
        attribute: { name: data-value, value: "1" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: redact
    chapter: "PII ကို မပို့ခင် ဖယ်ရအောင်"
    narration: >
      [[mark:draw-strip]] အပြင်က model ဆီ မပို့ခင် PII ကို ဖယ်ရပါမယ်။ PII ဆိုတာ နာမည်၊ ဖုန်းနံပါတ် လို လူ
      တစ်ယောက်ကို ခွဲခြား သိနိုင်တဲ့ အချက်တွေပါ။ ဖယ်တဲ့ နည်း သုံးမျိုး ရှိပါတယ်။
      [[mark:draw-anon]] anonymization က ဘယ်သူလဲ လုံးဝ မသိနိုင်အောင် ဖယ်တာပါ၊ ဖုန်းနံပါတ်နေရာမှာ ဖုန်း ဆိုတဲ့
      အမှတ်အသား ထည့်တာမျိုးပါ။ [[mark:draw-pseudo]] pseudonymization ကတော့ နာမည် အစစ်အစား customer ခုနစ် လို
      အမှတ်အသား ပြောင်းထည့်တာ ဖြစ်လို့ ဆိုင်ကပဲ ပြန်ချိတ်နိုင်ပါတယ်။ [[mark:draw-agg]] aggregation က လူ
      တစ်ယောက်ချင်း မဟုတ်ဘဲ၊ ဗဟန်း က review ဘယ်နှခု လို စုပေါင်း ကိန်းဂဏန်းပဲ သိမ်းတာပါ။
      [[mark:draw-strip-today]] ဒီနေ့တော့ ပထမ နည်းအတိုင်း ဖုန်းနံပါတ်နဲ့ နာမည်ကို အမှတ်အသားနဲ့ အစားထိုးပါမယ်။
      [[mark:close-strip]] code မှာ ကြည့်ရအောင်။ [[mark:sel-rules]] rule စာရင်းက အခု ဗလာ ဖြစ်နေလို့ ဘာမှ
      မဖယ်ရသေးပါဘူး။ [[mark:type-phone]] ပထမ rule က ဖုန်းနံပါတ် ပုံစံ တွေ့ရင် ဖုန်း ဆိုတဲ့ အမှတ်အသားနဲ့
      အစားထိုးပါတယ်။ [[mark:read-phone]] ပထမ review မှာ ဖုန်းနံပါတ်အစား အမှတ်အသားပဲ ကျန်ပြီး၊ Privacy check
      မှာလည်း ဖုန်းနံပါတ် သုည ဖြစ်သွားပါပြီ။ [[mark:type-name]] ဒုတိယ rule က ဆိုင်ရဲ့ record ထဲက နာမည်တွေကို
      နာမည် ဆိုတဲ့ အမှတ်အသားနဲ့ အစားထိုးပါတယ်။ [[mark:read-name]] ဒုတိယ review မှာလည်း လှလှ ရဲ့ နာမည်
      မပါတော့လို့ နာမည်လည်း သုည ဖြစ်ပါပြီ။ model က review ကို ခွဲဖို့ ဖုန်းနဲ့ နာမည် မလိုပါဘူး။ rule
      တွေက browser ထဲမှာပဲ run တာမို့၊ ဖုန်းနဲ့ နာမည်က page အပြင်ကို ရောက်မှာ မဟုတ်တော့ပါဘူး။
    sources:
      - {
          title: "web.dev Learn AI: AI governance: Build responsibly (privacy: strip sensitive information)",
          url: "https://web.dev/learn/ai/responsibility",
        }
    actions:
      - {
          id: draw-strip,
          type: whiteboard.apply,
          at: { mark: draw-strip },
          open: true,
          clear: true,
          upsertIds: [p-title],
        }
      - {
          id: draw-anon,
          type: whiteboard.apply,
          at: { mark: draw-anon },
          upsertIds: [p-a-n, p-a-e, p-a-d],
          drawMs: 1500,
        }
      - {
          id: draw-pseudo,
          type: whiteboard.apply,
          at: { mark: draw-pseudo },
          upsertIds: [p-p-n, p-p-e, p-p-d],
          drawMs: 1500,
        }
      - {
          id: draw-agg,
          type: whiteboard.apply,
          at: { mark: draw-agg },
          upsertIds: [p-g-n, p-g-e, p-g-d],
          drawMs: 1500,
        }
      - {
          id: draw-strip-today,
          type: whiteboard.apply,
          at: { mark: draw-strip-today },
          upsertIds: [p-today],
          drawMs: 1000,
        }
      - { id: close-strip, type: whiteboard.apply, at: { mark: close-strip }, open: false }
      - id: sel-rules
        type: editor.select
        at: { mark: sel-rules }
        target: { file: src/main.js, text: "const rules = [\n];\n", occurrence: 1 }
      - id: type-phone
        type: editor.type
        at: { mark: type-phone }
        target: { file: src/main.js, after: "const rules = [\n", occurrence: 1 }
        text: "  [PHONE, \"[ဖုန်း]\"],\n"
        cadence: line-by-line
      - id: expect-phones-0
        type: expect.preview
        at: { afterAction: type-phone }
        timeoutMs: 8000
        target: { by: testId, value: ai-check-2 }
        attribute: { name: data-value, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-phone-mark
        type: expect.preview
        at: { mark: read-phone }
        timeoutMs: 5000
        target: { by: testId, value: ai-sent-1 }
        textContains: "review · အော်ဒါ မရောက်သေးဘူး။ [ဖုန်း] ကို ပြန်ဆက်ပေးပါ။"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-name
        type: editor.type
        at: { mark: type-name }
        target: { file: src/main.js, after: "  [PHONE, \"[ဖုန်း]\"],\n", occurrence: 1 }
        text: "  [KNOWN_NAMES, \"[နာမည်]\"],\n"
        cadence: line-by-line
      - id: expect-names-0
        type: expect.preview
        at: { afterAction: type-name }
        timeoutMs: 8000
        target: { by: testId, value: ai-check-3 }
        attribute: { name: data-value, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-name-mark
        type: expect.preview
        at: { mark: read-name }
        timeoutMs: 5000
        target: { by: testId, value: ai-sent-2 }
        textContains: "review · ကောင်တာက [နာမည်] က"
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: retention
    narration: >
      ဆိုင်က ပို့တဲ့ data နဲ့ ပြန်ရတဲ့ အဖြေကို log အဖြစ် သိမ်းပြီး evaluation အတွက် သုံးပါတယ်။ ဒါပေမဲ့
      သုံးပြီးရင် ဖျက်ရပါမယ်၊ ကြာကြာ မသိမ်းလေ အန္တရာယ် နည်းလေပါပဲ။ [[mark:type-days]] ဒါကြောင့် အစက
      တန်ဖိုးရဲ့ အောက်မှာ ရက် ၃၀ ပြည့်ရင် ဖျက်မယ့် စာကြောင်း ထပ်ထည့်ပြီး အစားထိုးပါမယ်။ [[mark:read-days]] raw logs က အမြဲ ကနေ ရက် ၃၀
      ဖြစ်သွားပါပြီ။ ဘာ data ယူလဲ၊ ဘာကြောင့် ယူလဲ၊ ဘယ်လောက်ကြာ သိမ်းလဲ ဆိုတာလည်း ရေးမှတ်ထားပါ။ ဆိုင်ပိုင်ရှင် ကို
      ရှင်းပြလို့ မရရင် အဲဒီ data flow က ရှုပ်လွန်းနေပြီ ဆိုတဲ့ သဘောပါ။
    sources:
      - {
          title: "web.dev Learn AI: AI governance: Build responsibly (privacy: limit retention, document)",
          url: "https://web.dev/learn/ai/responsibility",
        }
    actions:
      - id: type-days
        type: editor.type
        at: { mark: type-days }
        target: { file: src/main.js, after: "let keepDays = Infinity;\n", occurrence: 1 }
        text: "keepDays = 30;\n"
        cadence: line-by-line
      - id: expect-logs-30
        type: expect.preview
        at: { afterAction: type-days }
        timeoutMs: 8000
        target: { by: testId, value: ai-check-4 }
        attribute: { name: data-value, value: "30 days" }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: intelligence
    chapter: "Model ဘက်က privacy"
    narration: >
      [[mark:draw-intel]] intelligence အလွှာကို ကြည့်ရင်၊ [[mark:draw-free]] customer တွေက ဖုန်းနံပါတ်၊ ကျန်းမာရေး အခြေအနေ လို ကိုယ်ရေး အချက်တွေကို free text ထဲမှာ သတိမထားမိဘဲ
      ရေးတတ်ပါတယ်။ rule က ကိုယ်ပေးထားတဲ့ ပုံစံကိုပဲ ရှာနိုင်လို့၊ ဆိုင် မသိတဲ့ နာမည်၊ နို့ မတည့်တာ လို
      အချက်တွေ လွတ်သွားနိုင်ပါတယ်။ [[mark:draw-log]] model က အပြင် provider ရဲ့ server ပေါ်မှာ run ရင်၊
      provider က ပို့တဲ့ စာကို log သိမ်းတာ၊ model အသစ် train လုပ်ဖို့ သုံးတာ ရှိနိုင်ပါတယ်။ အဲဒီ စာတွေနဲ့ train လုပ်ထားတဲ့
      model က တချို့ စာကို အလွတ်မှတ်ပြီး တခြား user တွေဆီ ပြန်ထုတ်ပေးမိတာလည်း ဖြစ်နိုင်ပါတယ်။ [[mark:draw-vet]] ဒါကြောင့် ဒီ
      အချက်တွေကို provider ရဲ့ data policy မှာ သေချာ စစ်ပါ။ provider တချို့က
      model ကို ဘယ်လို ဆောက်ပြီး ဘယ်လို စစ်ထားလဲ ရေးထားတဲ့ model card ကိုလည်း ထုတ်ပေးပါတယ်။ [[mark:draw-own]]
      model ကို ကိုယ်တိုင် train လုပ်ရင်တော့ မြို့နယ် လို column က လူတွေရဲ့ အခြေအနေကို သွယ်ဝိုက်ပြီး
      ပြနေတတ်တာကို သတိထားပါ၊ နောက် lesson မှာ ပြန်ကြည့်ပါမယ်။
      [[mark:draw-client]] ကျန်းမာရေး လို sensitive ဖြစ်တဲ့ နယ်ပယ်မှာဆိုရင် user ရဲ့ device ထဲမှာပဲ model ကို
      run တဲ့ client side inference က ပိုကောင်းပါတယ်။ [[mark:draw-fed]] federated learning ဆိုတဲ့ နည်းမှာတော့
      data က user ရဲ့ device ထဲမှာပဲ ကျန်ပြီး၊ အဲဒီမှာ train လုပ်ထားတဲ့ model ရဲ့ ပြောင်းလဲမှုကိုပဲ server ကို ပို့ပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: AI governance: Build responsibly (privacy: intelligence)",
          url: "https://web.dev/learn/ai/responsibility",
        }
    actions:
      - {
          id: draw-intel,
          type: whiteboard.apply,
          at: { mark: draw-intel },
          open: true,
          clear: true,
          upsertIds: [i-title],
        }
      - {
          id: draw-free,
          type: whiteboard.apply,
          at: { mark: draw-free },
          upsertIds: [i-free],
          drawMs: 1200,
        }
      - {
          id: draw-log,
          type: whiteboard.apply,
          at: { mark: draw-log },
          upsertIds: [i-log, i-mem],
          drawMs: 1600,
        }
      - {
          id: draw-vet,
          type: whiteboard.apply,
          at: { mark: draw-vet },
          upsertIds: [i-vet],
          drawMs: 1000,
        }
      - {
          id: draw-own,
          type: whiteboard.apply,
          at: { mark: draw-own },
          upsertIds: [i-own],
          drawMs: 1000,
        }
      - {
          id: draw-client,
          type: whiteboard.apply,
          at: { mark: draw-client },
          upsertIds: [i-client],
          drawMs: 1000,
        }
      - {
          id: draw-fed,
          type: whiteboard.apply,
          at: { mark: draw-fed },
          upsertIds: [i-fed],
          drawMs: 1000,
        }

  - id: ux
    chapter: "User ကို မြင်အောင် ပြရအောင်"
    narration: >
      [[mark:close-intel]] U X အလွှာမှာတော့ ဘာဖြစ်နေလဲ user ကို မြင်အောင် ပြပြီး၊ ကိုယ့် data ကို ကိုယ်
      ထိန်းခွင့် ပေးရပါမယ်။ [[mark:type-controls]] customer မြင်ရမယ့် page ကို ဆွဲပေးတဲ့ စာကြောင်း ထည့်ပါမယ်။
      [[mark:read-label]] panel အပေါ်မှာ review ကို စစ်ဖို့ server ကို လုံခြုံစွာ ပို့ပါတယ် ဆိုတဲ့ label
      တိုတိုလေး ပေါ်လာပါပြီ။ ဒီ စက်ထဲမှာပဲ စစ်လား၊ server ကို ပို့လား ဆိုတာ ဒီလို ပြောပြရင် user ရဲ့
      ယုံကြည်မှု ရပါတယ်။ [[mark:click-how]] ဘယ်လို လုပ်လဲ ခလုတ်ကို နှိပ်ကြည့်ပါမယ်။ [[mark:read-how]] ဘာ
      ပို့လဲ၊ ဘာကြောင့် ပို့လဲ၊ ဖုန်းနဲ့ နာမည်ကို ဒီ စက်ထဲမှာပဲ ဖယ်တာ၊ log ကို ရက် ၃၀ ပြီးရင် ဖျက်တာ
      ပေါ်လာပါတယ်။ အစမှာ အတိုလေးပဲ ပြပြီး သိချင်တဲ့သူ နှိပ်မှ အသေးစိတ် ပြတာကို progressive disclosure လို့
      ခေါ်ပါတယ်။ [[mark:read-consent]]
      အောက်က မေးခွန်းကတော့ မှာခဲ့ဖူးတာတွေကို သုံးပြီး အကြံပေးရမလား လို့ data လိုတဲ့ နေရာမှာမှ မေးတာပါ။ account
      ဖွင့်တုန်းက အကုန် သဘောတူလား လို့ တစ်ခါတည်း မေးတာထက် ပိုအဓိပ္ပာယ် ရှိပါတယ်။ [[mark:click-yes]] အောင်အောင်
      က သုံးပါ ကို နှိပ်တယ် ဆိုပါစို့။ [[mark:read-yes]] table မှာ မှာခဲ့တာ အရေအတွက် row ပေါ်လာပြီး၊ အသေးစိတ်
      စာမှာလည်း အကြံပေးဖို့ ဆိုတာ ပါလာပါတယ်။ [[mark:click-no]] စိတ်ပြောင်းပြီး မသုံးပါနဲ့ ကို နှိပ်ရင်၊ [[mark:read-no]]
      အဲဒီ row ပျောက်သွားပါတယ်။ user က ရှင်းရှင်းလေး မြင်ရတဲ့ ခလုတ်နဲ့ ကိုယ့်ဘာသာ ပြန်ပိတ်နိုင်ရပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: AI governance: Build responsibly (privacy: user experience)",
          url: "https://web.dev/learn/ai/responsibility",
        }
    actions:
      - { id: close-intel, type: whiteboard.apply, at: { mark: close-intel }, open: false }
      - id: type-controls
        type: editor.type
        at: { mark: type-controls }
        target: { file: src/main.js, after: "showSent(sent, keepDays);\n", occurrence: 1 }
        text: "showPrivacyControls(sent, keepDays);\n"
        cadence: line-by-line
      - id: expect-label
        type: expect.preview
        at: { afterAction: type-controls }
        timeoutMs: 8000
        target: { by: testId, value: where }
        textContains: "server ကို လုံခြုံစွာ ပို့ပါတယ်"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-not-asked
        type: expect.preview
        at: { afterAction: expect-label }
        timeoutMs: 5000
        target: { by: testId, value: consent-1 }
        attribute: { name: aria-pressed, value: "false" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: click-how
        type: preview.click
        at: { mark: click-how }
        target: { by: testId, value: how }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-details
        type: expect.preview
        at: { afterAction: click-how }
        timeoutMs: 5000
        target: { by: testId, value: details }
        textContains: "log · 30 ရက်ပြီးရင် ဖျက်ပါတယ်"
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-details-removed
        type: expect.preview
        at: { afterAction: expect-details }
        timeoutMs: 5000
        target: { by: testId, value: details }
        textContains: "ဖုန်း၊ နာမည် · ဒီ စက်ထဲမှာပဲ ဖယ်ပါတယ်"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: click-yes
        type: preview.click
        at: { mark: click-yes }
        target: { by: testId, value: consent-1 }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-yes-pressed
        type: expect.preview
        at: { afterAction: click-yes }
        timeoutMs: 5000
        target: { by: testId, value: consent-1 }
        attribute: { name: aria-pressed, value: "true" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-sent-3
        type: expect.preview
        at: { afterAction: expect-yes-pressed }
        timeoutMs: 5000
        target: { by: testId, value: ai-sent }
        attribute: { name: data-count, value: "3" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-orders-row
        type: expect.preview
        at: { mark: read-yes }
        timeoutMs: 5000
        target: { by: testId, value: ai-sent-3 }
        textContains: "orders · လက်ဖက်ရည် 20 · မုန့်ဟင်းခါး 12"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-details-orders
        type: expect.preview
        at: { afterAction: expect-orders-row }
        timeoutMs: 5000
        target: { by: testId, value: details }
        textContains: "မှာခဲ့တာ အရေအတွက် · အကြံပေးဖို့"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: click-no
        type: preview.click
        at: { mark: click-no }
        target: { by: testId, value: consent-2 }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-no-pressed
        type: expect.preview
        at: { afterAction: click-no }
        timeoutMs: 5000
        target: { by: testId, value: consent-2 }
        attribute: { name: aria-pressed, value: "true" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-sent-back-2
        type: expect.preview
        at: { mark: read-no }
        timeoutMs: 5000
        target: { by: testId, value: ai-sent }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: summary
    narration: >
      [[mark:draw-summary]] privacy ကို အလွှာ သုံးခုလုံးမှာ ပြန်စုကြည့်ရအောင်။ data မှာ လိုတာကိုပဲ ယူ၊ PII ကို
      ဖယ်ပြီး log ကို အချိန်တန်ရင် ဖျက်ပါ။ [[mark:draw-sum-intel]] intelligence မှာ provider ကို စစ်ပြီး၊
      ကိုယ်ရေး စာတွေကို model က အလွတ်မှတ်သွားမှာ သတိထားပါ။ [[mark:draw-sum-ux]] U X မှာ label နဲ့ ပြောပြ၊ လိုမှ
      မေး၊ ပိတ်လို့ ရတဲ့ ခလုတ် ထားပါ။ customer က သူ့ data ကို ကိုယ်တိုင် ကြည့်ပြီး ဖျက်လို့ ရတဲ့
      ကိုယ့် data စာမျက်နှာ သေးသေးလေးလည်း ထားသင့်ပါတယ်။ ဘာကြောင့် ယူလဲ ရှင်းပြရင် user တွေက data ပေးဖို့
      ပိုစိတ်ချကြပါတယ်။ [[mark:draw-motto]] အတိုချုပ်ရရင် နည်းနည်း ယူပြီး များများ ကာကွယ်ဖို့ပါ။
    sources:
      - {
          title: "web.dev Learn AI: AI governance: Build responsibly (privacy summary)",
          url: "https://web.dev/learn/ai/responsibility",
        }
    actions:
      - {
          id: draw-summary,
          type: whiteboard.apply,
          at: { mark: draw-summary },
          open: true,
          clear: true,
          upsertIds: [s-title, s-d-l, s-d],
          drawMs: 1600,
        }
      - {
          id: draw-sum-intel,
          type: whiteboard.apply,
          at: { mark: draw-sum-intel },
          upsertIds: [s-i-l, s-i],
          drawMs: 1200,
        }
      - {
          id: draw-sum-ux,
          type: whiteboard.apply,
          at: { mark: draw-sum-ux },
          upsertIds: [s-u-l, s-u, s-u2],
          drawMs: 1800,
        }
      - {
          id: draw-motto,
          type: whiteboard.apply,
          at: { mark: draw-motto },
          upsertIds: [s-motto],
          drawMs: 1200,
        }

  - id: quiz
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ review feature အတွက် ဘယ်လို လုပ်တာ မှန်လဲ။ နောင် လိုမလား ဆိုပြီး
      profile တစ်ခုလုံးပါ ယူထားတာလား၊ review စာသားကိုပဲ ယူပြီး PII ကို ဖယ်တာလား၊ log တွေကို မဖျက်ဘဲ
      ထားတာလား။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] အဖြေကတော့
      review စာသားကိုပဲ ယူပြီး PII ကို ဖယ်တာပါ။ ဘာကြောင့်လဲဆိုတော့ ကိုယ့်ဆီမှာ မရှိတဲ့ data က ပေါက်ကြားလို့
      မရလို့ပါ။ ကျန်တဲ့ နှစ်ခုကတော့ တစ်နေ့ ပေါက်ကြားရင် ထိခိုက်မယ့် data ကို ပိုများစေပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: AI governance: Build responsibly (Check your understanding)",
          url: "https://web.dev/learn/ai/responsibility",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          clear: true,
          upsertIds: [z-title, z-q, z-o1, z-o2, z-o3],
          drawMs: 2000,
        }
      - {
          id: draw-quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [z-ring, z-a, z-note],
          drawMs: 1800,
        }

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ [[mark:sel-final-keep]] ဒီနေ့ program မှာ feature အတွက် လိုတာကိုပဲ ယူပြီး၊
      [[mark:sel-final-rules]] PII ကို browser ထဲမှာပဲ ဖယ်ပြီးမှ ပို့ပါတယ်။ [[mark:sel-final-days]] log ကို
      အချိန်တန်ရင် ဖျက်ပြီး၊ [[mark:sel-final-controls]] ဘာ ပို့လဲ user ကို ပြောပြ၊ လိုတဲ့ နေရာမှာမှ ခွင့်တောင်းပါတယ်။
      နောက် lesson မှာတော့ governance ရဲ့ နောက်တစ်ချက် ဖြစ်တဲ့ fairness နဲ့ bias ကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: AI governance: Build responsibly",
          url: "https://web.dev/learn/ai/responsibility",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: recap }, open: false }
      - id: sel-final-keep
        type: editor.select
        at: { mark: sel-final-keep }
        target: { file: src/main.js, text: 'sent = keepOnly(sent, ["reviews"]);', occurrence: 1 }
      - id: sel-final-rules
        type: editor.select
        at: { mark: sel-final-rules }
        target:
          {
            file: src/main.js,
            text: "  [PHONE, \"[ဖုန်း]\"],\n  [KNOWN_NAMES, \"[နာမည်]\"],\n",
            occurrence: 1,
          }
      - id: sel-final-days
        type: editor.select
        at: { mark: sel-final-days }
        target: { file: src/main.js, text: "keepDays = 30;", occurrence: 1 }
      - id: sel-final-controls
        type: editor.select
        at: { mark: sel-final-controls }
        target: { file: src/main.js, text: "showPrivacyControls(sent, keepDays);", occurrence: 1 }
      - {
          id: expect-final-code,
          type: expect.file,
          at: { afterAction: sel-final-controls },
          path: src/main.js,
          contains: "sent = keepOnly(sent, [\"reviews\"]);\n\n// 2. Rules that hide personal data (PII) in what he typed:\nconst rules = [\n  [PHONE, \"[ဖုန်း]\"],\n  [KNOWN_NAMES, \"[နာမည်]\"],\n];\nsent = redact(sent, rules);\n\n// 3. How many days the shop keeps its raw logs:\nlet keepDays = Infinity;\nkeepDays = 30;\n\nshowSent(sent, keepDays);\nshowPrivacyControls(sent, keepDays);\n",
        }
checks:
  - { type: timing.p95Ms, max: 300 }
