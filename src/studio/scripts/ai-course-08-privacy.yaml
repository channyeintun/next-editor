build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 5108
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "Privacy ဆိုတာ ဘာလဲ"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ ဖော်ပြချက် helper ကို တကယ် သုံးတဲ့ log တွေကနေ ဆက်တိုးတက်အောင်
      လုပ်တဲ့ feedback loop ကို ကြည့်ခဲ့ပါတယ်။ အဲဒီ loop အတွက် user တွေရဲ့ တကယ့် data လိုလာတာနဲ့ privacy
      မေးခွန်းလည်း ပေါ်လာပါတယ်။ [[mark:draw-mini]] blueprint မှာ ကြည့်ရင် ဒီနေ့ကစပြီး AI ကို တာဝန်သိသိ
      ဆောက်တဲ့ Governance အပိုင်းကို လေ့လာပါမယ်။ [[mark:draw-today]] ပထမဆုံးက privacy ပါ။ ကိုယ်တို့ ဆိုင်အတွက်
      privacy ဆိုတာ customer ရဲ့ ကိုယ်ရေး data ကို ဘယ်လောက် ယူမလဲ၊ ဘယ်ကို ပို့မလဲ၊ ဘယ်လောက်ကြာ သိမ်းမလဲ
      ဆိုတာကို ဂရုတစိုက် ဆုံးဖြတ်ပြီး၊ customer ကိုလည်း သိအောင် ပြောပြတာပါ။
    sources:
      - {
          title: "web.dev Learn AI: AI governance: Build responsibly",
          url: "https://web.dev/learn/ai/responsibility",
        }
      - {
          title: "web.dev Learn AI: Introduction to AI on the web (the blueprint)",
          url: "https://web.dev/learn/ai/introduction",
        }
      - {
          title: "web.dev Learn AI: Welcome to Learn AI! (course credit: written by Dr. Janna Lipenkova with editorial guidance from Alexandra Klepper; text CC BY 4.0, code Apache 2.0; adapted into Burmese with the course's own tea-shop examples)",
          url: "https://web.dev/learn/ai/welcome",
        }
      - {
          title: "Creative Commons: Attribution 4.0 International (CC BY 4.0), the licence of the web.dev Learn AI text adapted here",
          url: "https://creativecommons.org/licenses/by/4.0/",
        }
    actions:
      - {
          id: open-board-a,
          type: whiteboard.apply,
          at: { scene: start, offsetMs: -450 },
          open: true,
          clear: true,
          upsertIds: [a-title],
        }
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - {
          id: draw-mini,
          type: whiteboard.apply,
          at: { mark: draw-mini },
          upsertIds:
            [
              a-opp,
              a-opp-t,
              a-arrow-1,
              a-data,
              a-data-t,
              a-intel,
              a-intel-t,
              a-ux,
              a-ux-t,
              a-arrow-2,
              a-gov,
              a-gov-t,
            ],
          drawMs: 2400,
        }
      - {
          id: draw-today,
          type: whiteboard.apply,
          at: { mark: draw-today },
          upsertIds: [a-today],
          drawMs: 1000,
        }

  - id: governance
    narration: >
      [[mark:draw-dims]] governance ကို lesson သုံးခုမှာ အချက် သုံးချက်နဲ့ ကြည့်ပါမယ်။ ဒီနေ့ privacy၊ နောက်
      lesson မှာ fairness၊ ပြီးရင် trust နဲ့ transparency ပါ။ [[mark:draw-layers]] အချက် တစ်ချက်ချင်းကို data၊
      intelligence၊ U X အလွှာ သုံးခုလုံးမှာ စစ်ပါမယ်။ [[mark:draw-security]] security ကလည်း အရေးကြီးတဲ့
      နောက်ထပ် အချက်ပါ၊ ဒါပေမဲ့ ဒီ course မှာ အသေးစိတ် မပါပါဘူး။ [[mark:draw-expect]] privacy ကို ဘယ်လောက်
      တင်းကျပ်ရမလဲ ဆိုတာက user ပေါ် မူတည်ပါတယ်။ သာမန် customer တွေက သူတို့ နာမည်၊ message၊ ဘာတွေ ကြည့်လဲ
      ဆိုတာကို ကာကွယ်ချင်ကြပါတယ်။ [[mark:draw-expect-b]] လုပ်ငန်းတွေကတော့ လျှို့ဝှက် data နဲ့ ကိုယ်ပိုင်
      design၊ code လို ဖန်တီးမှုတွေကို ကာကွယ်ချင်ကြပါတယ်။ [[mark:draw-expect-s]] ကျန်းမာရေး၊ ငွေကြေး၊ ပညာရေး
      လို လူတွေရဲ့ ဘဝနဲ့ ဆိုင်တဲ့ နယ်ပယ်တွေမှာ ပိုတင်းကျပ်ရပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: AI governance: Build responsibly (three dimensions, privacy)",
          url: "https://web.dev/learn/ai/responsibility",
        }
      - {
          title: "Google: Secure AI Framework (SAIF)",
          url: "https://safety.google/cybersecurity-advancements/saif/",
        }
    actions:
      - {
          id: draw-dims,
          type: whiteboard.apply,
          at: { mark: draw-dims },
          clear: true,
          upsertIds: [g-title, g-p, g-p-t, g-f, g-f-t, g-t, g-t-t, g-n-p, g-n-f, g-n-t],
          drawMs: 2600,
        }
      - {
          id: draw-layers,
          type: whiteboard.apply,
          at: { mark: draw-layers },
          upsertIds: [g-each, g-d, g-d-t, g-i, g-i-t, g-u, g-u-t],
          drawMs: 2200,
        }
      - {
          id: draw-security,
          type: whiteboard.apply,
          at: { mark: draw-security },
          upsertIds: [g-sec],
          drawMs: 1000,
        }
      - {
          id: draw-expect,
          type: whiteboard.apply,
          at: { mark: draw-expect },
          clear: true,
          upsertIds: [e-title, e-c-l, e-c],
          drawMs: 1600,
        }
      - {
          id: draw-expect-b,
          type: whiteboard.apply,
          at: { mark: draw-expect-b },
          upsertIds: [e-b-l, e-b],
          drawMs: 1200,
        }
      - {
          id: draw-expect-s,
          type: whiteboard.apply,
          at: { mark: draw-expect-s },
          upsertIds: [e-s, e-s2],
          drawMs: 1400,
        }

  - id: payload
    chapter: "Browser အပြင်ကို ဘာ ထွက်သွားလဲ"
    narration: >
      [[mark:close-expect]] ဒါဆို ဆိုင်ရဲ့ code ကို ကြည့်ရအောင်။ [[mark:panel-ready]] ကိုယ်တို့က customer
      ရေးတဲ့ review တွေကို အပြင် ကုမ္ပဏီ တစ်ခုရဲ့ server ပေါ်က model ဆီ ပို့ပြီး ဘာအကြောင်း ပြောလဲ ခွဲခိုင်းမယ့်
      feature ကို ဆောက်နေပါတယ်။ ဆိုင်ပိုင်ရှင် က ရလဒ်ကို dashboard မှာ ကြည့်ဖို့ပါ။ ညာဘက် AI panel မှာ ပို့မယ့် data
      ကို ပြထားပါတယ်။ ဒီ data က lesson အတွက် ပြင်ဆင်ထားတဲ့ နမူနာ data ပါ။ [[mark:open-main]] program က member
      အောင်အောင် ရေးတဲ့ review နှစ်ခုကို၊ [[mark:sel-sent]] ဆိုင်ရဲ့ record ထဲက သူ့ profile နဲ့ ပေါင်းပြီး
      ပို့ဖို့ ပြင်ထားပါတယ်။ [[mark:read-sent]] Leaves the browser table မှာ နာမည်၊ ဖုန်းနံပါတ်၊ မြို့နယ်၊ မှာခဲ့တာ
      အရေအတွက်နဲ့ review နှစ်ခု ပါပါတယ်။ ပထမ review ထဲမှာ သူ့ ဖုန်းနံပါတ်ကို သူကိုယ်တိုင် ရေးထားပြီး၊ ဒုတိယ
      review မှာတော့ ကောင်တာက လှလှ ရဲ့ နာမည် ပါပါတယ်။ [[mark:read-check]] Privacy check card ကလည်း field
      ငါးခု၊ ဖုန်းနံပါတ် နှစ်ခု၊ နာမည် နှစ်ခု ပါပြီး၊ ဆိုင်ဘက်မှာ သိမ်းမယ့် log ကိုလည်း အမြဲ ထားမယ်လို့ ပြနေပါတယ်။ ဒီလို စစ်တာ
      model မလိုလို့၊ card ရဲ့ badge ကလည်း AI မပါဘူးလို့ ပြနေပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: AI governance: Build responsibly (privacy: data)",
          url: "https://web.dev/learn/ai/responsibility",
        }
    actions:
      - { id: close-expect, type: whiteboard.apply, at: { mark: close-expect }, open: false }
      - id: wait-ready
        type: runtime.waitForReady
