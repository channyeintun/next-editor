build:
  voiceProfile:
    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 9527

runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "adj-1 posted: maker u-17, no checker\n"
      run-2:
        status: success
        exitCode: 0
        output: "adj-1 posted: maker u-17, no checker\nadj-2 waits for a second person\nadj-2 refused: u-17 cannot approve own request\nadj-2 posted: maker u-17, checker u-42\n"
      run-3:
        status: success
        exitCode: 0
        output: "adj-1 posted: maker u-17, no checker\nadj-2 waits for a second person\nadj-2 refused: u-17 cannot approve own request\nadj-2 posted: maker u-17, checker u-42\nadj-3 posted: maker u-17, BREAK-GLASS: provider outage\nreview queue: [adj-3 by u-17]\n"

scenes:
  - id: hook
    chapter: No trust ကို အတွင်းဘက် လှည့်ကြည့်
    narration: >-
      ဒီအထိ ကြည့်ခဲ့တဲ့ pattern တွေက ငွေနဲ့ ပတ်သက်တဲ့ data ကို မှန်အောင် ထိန်းတာပါ။ ဒါပေမဲ့ ငွေ
      system တစ်ခုက ဘယ်သူ ဘာလုပ်ခွင့် ရှိလဲ ဆိုတာကိုလည်း ကန့်သတ်ရပြီး၊ process ကို
      လိုက်နာခဲ့တယ် ဆိုတာကို နောက်မှ သက်သေပြနိုင်ရပါမယ်။ ဒီနေရာမှာ No trust က အတွင်းဘက်ကို
      လှည့်လာပါတယ်။ provider တွေ၊ component တွေလိုပဲ ကိုယ့် operator တွေ၊ engineer တွေကလည်း trust
      boundary တစ်ခုပါ။ [[mark:sel-exec]] ဒီ execute function က manual correction တစ်ခုကို ledger
      ထဲ post လုပ်ပြီး ဘယ်သူ လုပ်လဲ ဆိုတာ ထုတ်ပြပါတယ်။ [[mark:sel-call]] main ထဲမှာတော့ engineer
      တစ်ယောက်က write-off expense account ကနေ user တစ်ယောက်ကို ယူရို တစ်ထောင့်ငါးရာ credit
      ပေးတာကို တိုက်ရိုက် ခေါ်ထားပါတယ်။ ကြားမှာ ဘယ်သူမှ ကြည့်ပေးတာ မရှိပါဘူး။ [[mark:run-1]] run
      လိုက်ရအောင်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Controls and access (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#controls-and-access",
        }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }
      - id: sel-exec
        type: editor.select
        at: { mark: sel-exec }
        target: { file: main.go, text: "func execute(r *Request, note string) {", occurrence: 1 }
      - id: sel-call
        type: editor.select
        at: { mark: sel-call }
        target:
          {
            file: main.go,
            text: 'execute(&Request{Tx: credit("adj-1", 1500_00), Maker: "u-17"}, "no checker")',
            occurrence: 1,
          }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "adj-1 posted: maker u-17, no checker",
          timeoutMs: 8000,
        }

  - id: read-1
    narration: >-
      [[mark:pt-1]] post ဖြစ်သွားပါပြီ၊ checker ဆိုတာ မရှိပါဘူး။ သတိထားရမှာက ဒီ transaction ဟာ
      debit နဲ့ credit ညီပြီး ledger ရဲ့ invariant တွေ အကုန် pass ပါတယ်။ ဒါပေမဲ့ user တစ်ယောက်ရဲ့
      balance ထဲကို ယူရို တစ်ထောင့်ငါးရာ ဝင်သွားတာက engineer တစ်ယောက်တည်းရဲ့ ဆုံးဖြတ်ချက်ပါ။
      ရိုက်မှားတာလည်း ဖြစ်နိုင်၊ ကိုယ်သိတဲ့ account ကို ငွေ ထည့်ပေးတာလည်း ဖြစ်နိုင်ပါတယ်၊ ledger က
      အဲဒီ နှစ်ခုကို ခွဲမပြနိုင်ပါဘူး။ [[mark:dock-1]] invariant က ငွေ ဘယ်လို ရွေ့လဲ ဆိုတာကို စစ်တာပါ၊
      ဘယ်သူ ရွှေ့ခွင့် ရှိလဲ ဆိုတာကိုတော့ မစစ်ပါဘူး။
    sources:
      - {
          title: "Fintech Engineering Handbook — Controls and access (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#controls-and-access",
        }
    actions:
      - id: pt-1
        type: console.point
        at: { mark: pt-1 }
        target: { text: "adj-1 posted: maker u-17, no checker", occurrence: 1 }
      - { id: dock-1, type: runtime.collapseDock, at: { mark: dock-1 } }

  - id: maker
    chapter: Maker-checker
    narration: >-
      [[mark:show-maker]] finance မှာ အဟောင်းဆုံး control က အလုပ်တစ်ခုကို လူ နှစ်ယောက် ခွဲလုပ်တာပါ။
      ပုံစံ နှစ်မျိုး ရှိပါတယ်။ segregation of duties ဆိုတာ process တစ်ခုလုံးကို လူ တစ်ယောက်တည်း
      မပိုင်ရတာပါ။ four-eyes ဒါမှမဟုတ် maker-checker ဆိုတာကတော့ action တစ်ခု အသက်မဝင်ခင် ဒုတိယ လူ
      တစ်ယောက်က approve လုပ်ရတာပါ၊ dual control လို့လည်း ခေါ်ပါတယ်။ [[mark:pt-req]] maker က request
      တင်လိုက်ရင် ဘာမှ မရွေ့သေးပါဘူး၊ pending ပဲ ဖြစ်ပါတယ်။ [[mark:maker-2]] maker မဟုတ်တဲ့ checker
      က approve လုပ်မှ ledger ထဲ ရောက်ပါတယ်။ [[mark:maker-3]] approval ကိုယ်တိုင်ကလည်း trail ရဲ့
      အစိတ်အပိုင်းပါ။ ဘယ်သူ request လုပ်လဲ၊ ဘယ်သူ approve လုပ်လဲ၊ အဲဒီ နှစ်ယောက် မတူဘူး ဆိုတာ
      record ထဲမှာ မပါရင် control ရှိခဲ့တယ် ဆိုတာကို auditor ကို သက်သေပြလို့ မရပါဘူး။ ဘယ်လောက်
      ယုံရတဲ့ လူ ဖြစ်ဖြစ်၊ အတွင်းက လူ တစ်ယောက်တည်းရဲ့ ဆုံးဖြတ်ချက်က sensitive ဖြစ်တဲ့၊ ပြန်ပြင်လို့
      မရတဲ့ action အတွက် မလုံလောက်ပါဘူး၊ ဒါက No trust ပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Segregation of duties and four-eyes (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#segregation-of-duties-and-four-eyes",
        }
      - {
          title: "Fintech Engineering Handbook — Audits and audit trails (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#audits-and-audit-trails",
        }
    actions:
      - {
          id: show-maker,
          type: slide.show,
          at: { mark: show-maker, offsetMs: -700 },
          slideId: maker-1,
        }
      - {
          id: pt-mk,
          type: slide.point,
          at: { afterAction: show-maker },
          target: { x: 0.1, y: 0.487 },
        }
      - { id: pt-req, type: slide.point, at: { mark: pt-req }, target: { x: 0.419, y: 0.453 } }
      - { id: maker-2, type: slide.show, at: { mark: maker-2 }, slideId: maker-2 }
      - {
          id: pt-ck,
          type: slide.point,
          at: { afterAction: maker-2 },
          target: { x: 0.394, y: 0.742 },
        }
      - { id: maker-3, type: slide.show, at: { mark: maker-3 }, slideId: maker-3 }
      - {
          id: pt-rec,
          type: slide.point,
          at: { afterAction: maker-3 },
          target: { x: 0.609, y: 0.768 },
