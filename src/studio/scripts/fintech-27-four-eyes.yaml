      ledger.go: |
        package main

        import (
        	"fmt"
        	"strings"
        )

        // Line is one row of a transaction: an amount on the debit or the credit side of one account.
        type Line struct {
        	Account string
        	Debit   int64
        	Credit  int64
        }

        // Tx is one business event. All of its lines are posted together, or none of them.
        type Tx struct {
        	ID    string
        	Memo  string
        	Lines []Line
        }

        // Ledger is an append-only list of posted transactions. Balances are derived from it.
        type Ledger struct {
        	txs []Tx
        }

        // Post appends a transaction only if its debits equal its credits.
        func (l *Ledger) Post(tx Tx) error {
        	var debit, credit int64
        	for _, line := range tx.Lines {
        		debit += line.Debit
        		credit += line.Credit
        	}
        	if debit != credit {
        		return fmt.Errorf("tx %s is not balanced: debit %s, credit %s", tx.ID, cents(debit), cents(credit))
        	}
        	l.txs = append(l.txs, tx)
        	return nil
        }

        // kindOf reads the account type from the name: "asset:bank" is an asset.
        func kindOf(account string) string {
        	kind, _, _ := strings.Cut(account, ":")
        	return kind
        }

        // Balance derives an account's balance on the side where that kind of account grows:
        // assets and expenses grow with debits; liabilities, equity and revenue grow with credits.
        func (l *Ledger) Balance(account string) int64 {
        	var debit, credit int64
        	for _, tx := range l.txs {
        		for _, line := range tx.Lines {
        			if line.Account == account {
        				debit += line.Debit
        				credit += line.Credit
        			}
        		}
        	}
        	if kind := kindOf(account); kind == "asset" || kind == "expense" {
        		return debit - credit
        	}
        	return credit - debit
        }

        // cents prints minor units as an amount with two decimals: cents(1234) is "12.34".
        func cents(n int64) string {
        	sign := ""
        	if n < 0 {
        		sign, n = "-", -n
        	}
        	return fmt.Sprintf("%s%d.%02d", sign, n/100, n%100)
        }

        // credit is a manual correction that pays a user from the write-off expense account.
        func credit(id string, amount int64) Tx {
        	return Tx{ID: id, Memo: "manual correction", Lines: []Line{
        		{Account: "expense:writeoff", Debit: amount},
        		{Account: "liability:user:1042", Credit: amount},
        	}}
        }
      main.go: |
        package main

        import "fmt"

        const threshold = 1000_00 // a correction this large needs a second person

        // Request is one manual ledger correction and who has acted on it.
        type Request struct {
        	Tx      Tx
        	Maker   string
        	Checker string
        	Status  string // pending, posted
        }

        var books Ledger
        var reviews []string // break-glass posts that a second person must look at afterwards

        // execute posts the correction and records who made and who checked it.
        func execute(r *Request, note string) {
        	if err := books.Post(r.Tx); err != nil {
        		fmt.Println(r.Tx.ID, "failed:", err)
        		return
        	}
        	r.Status = "posted"
        	fmt.Printf("%s posted: maker %s, %s\n", r.Tx.ID, r.Maker, note)
        }

        // request posts a small correction at once and holds a large one for a second person.
        func request(maker string, tx Tx) *Request {
        	r := &Request{Tx: tx, Maker: maker, Status: "pending"}
        	if tx.Lines[0].Debit < threshold {
        		execute(r, "under threshold")
        	} else {
        		fmt.Println(tx.ID, "waits for a second person")
        	}
        	return r
        }

        // approve posts a pending request once a second person agrees to it.
        func approve(r *Request, checker string) {
        	if r.Status != "pending" {
        		fmt.Println(r.Tx.ID, "is already", r.Status)
        		return
        	}
        	r.Checker = checker
        	execute(r, "checker "+checker)
        }

        func main() {
        	execute(&Request{Tx: credit("adj-1", 1500_00), Maker: "u-17"}, "no checker")
        }
