  - id: try-it
    chapter: ကိုယ်တိုင် စမ်းကြည့်ပါ
    narration: >-
      [[mark:close-iv]] ကိုယ်တိုင် စမ်းကြည့်ဖို့ တစ်ခု ရှိပါတယ်။ [[mark:sel-try]] threshold ကို ယူရို
      နှစ်ထောင် လို့ ပြောင်းပြီး run ကြည့်ပါ။ ယူရို တစ်ထောင့်ငါးရာ correction က ဘယ်သူမှ မကြည့်ဘဲ
      ချက်ချင်း post ဖြစ်သွားပြီး၊ ဒုတိယ လူ approve လုပ်ဖို့ ရောက်လာတဲ့အခါ post ပြီးသား
      ဖြစ်နေပါလိမ့်မယ်။ threshold ကို ဘယ်မှာ ထားမလဲ ဆိုတာ code ဆုံးဖြတ်ချက် မဟုတ်ဘဲ risk
      ဆုံးဖြတ်ချက်ပါ။ [[mark:recap]] ပြန်ချုပ်ရရင်၊ ငွေကို ရွှေ့နိုင်တဲ့ sensitive action တွေမှာ လုပ်တဲ့သူနဲ့
      အတည်ပြုတဲ့သူ မတူရဘူး ဆိုတာကို system က စစ်ပြီး၊ နှစ်ယောက်လုံးကို trail ထဲ မှတ်ရပါတယ်၊
      approver ကိုလည်း တကယ့် effect ကို ပြရပါတယ်။ နောက် lesson မှာတော့ ဘယ်သူ checker ဖြစ်ခွင့်
      ရှိလဲ၊ အဲဒီ ခွင့်ကို ဘယ်လို ရလာခဲ့လဲ ဆိုတဲ့ access control ကို ကြည့်ပါမယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Segregation of duties and four-eyes (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#segregation-of-duties-and-four-eyes",
        }
