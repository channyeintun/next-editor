#   1. approve refuses a checker who is the maker                  } run-2: wait, refuse, post
#   2. main requests adj-2 and approves it as the maker, then as u-42 }   with maker and checker
#   3. breakGlass: post without a checker, say so, queue a review  } run-3: BREAK-GLASS line and
#   4. main posts adj-3 through it and prints the review queue     }   the review queue
