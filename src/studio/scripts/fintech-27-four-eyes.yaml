  - id: control
    chapter: Approver က maker မဖြစ်ရ
    narration: >-
      [[mark:close-maker]] code ထဲ ထည့်ကြည့်ရအောင်။ [[mark:sel-request]] request function က threshold
      အောက်က correction ကို ချက်ချင်း post လုပ်ပြီး၊ threshold ကျော်ရင် ဒုတိယ လူကို စောင့်ခိုင်းပါတယ်။
      [[mark:type-check]] approve ထဲမှာ ပထမဆုံး စစ်ရမှာက approve လုပ်တဲ့သူဟာ request တင်တဲ့သူ
      မဖြစ်ရဘူး ဆိုတာပါ။ ဒီစစ်ချက်ကို UI မှာ မထားဘဲ ငွေ ရွှေ့တဲ့ code ထဲမှာ ထားရပါတယ်၊ ဒါမှ API ကို
      တိုက်ရိုက် ခေါ်လည်း ကျော်လို့ မရမှာပါ။ [[mark:type-calls]] main ထဲမှာတော့ ယူရို တစ်ထောင့်ငါးရာ
      correction ကို request တင်ပြီး၊ maker ကိုယ်တိုင် approve လုပ်ကြည့်ပါမယ်၊ ပြီးမှ တခြား တစ်ယောက်က
      approve လုပ်ပါမယ်။ maker ကိုယ်တိုင် approve လုပ်တဲ့ line က ဘာ ထုတ်မလဲ ခန့်မှန်းကြည့်ပါ။
      [[mark:run-2]] run လိုက်ရအောင်။ [[mark:pt-wait]] request တင်ရုံနဲ့ post မဖြစ်ဘဲ စောင့်နေပါတယ်။
      [[mark:pt-refused]] maker ကိုယ်တိုင် approve လုပ်တာကို ငြင်းလိုက်ပါတယ်။ [[mark:pt-posted]] ဒုတိယ
      လူ approve လုပ်မှ post ဖြစ်ပြီး၊ record ထဲမှာ maker နဲ့ checker နှစ်ယောက်လုံး ပါပါတယ်။
      [[mark:pt-first]] ပထမ line ကို ပြန်ယှဉ်ကြည့်ရင် အဲဒီ record မှာ checker မရှိပါဘူး။ [[mark:dock-2]]
      တကယ့် system မှာ execute လို direct path ကို လူတွေ ခေါ်လို့ မရအောင် ထားရပါမယ်။ ခေါ်လို့ ရနေသေးရင်
      control က ရှိတယ်ဆိုရုံပဲ ဖြစ်နေပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Segregation of duties and four-eyes (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#segregation-of-duties-and-four-eyes",
        }
    actions:
      - { id: close-maker, type: slide.close, at: { mark: close-maker } }
      - id: sel-request
        type: editor.select
        at: { mark: sel-request }
        target: { file: main.go, text: "if tx.Lines[0].Debit < threshold {", occurrence: 1 }
      - id: type-check
        type: editor.type
        at: { mark: type-check }
        target:
          { file: main.go, after: "func approve(r *Request, checker string) {\n", occurrence: 1 }
        text: "\tif checker == r.Maker {\n\t\tfmt.Println(r.Tx.ID, \"refused:\", checker, \"cannot approve own request\")\n\t\treturn\n\t}\n"
        cadence: line-by-line
      - id: type-calls
        type: editor.type
        at: { mark: type-calls }
        target:
          {
            file: main.go,
            after: "\texecute(&Request{Tx: credit(\"adj-1\", 1500_00), Maker: \"u-17\"}, \"no checker\")\n",
            occurrence: 1,
          }
        text: "\n\tr := request(\"u-17\", credit(\"adj-2\", 1500_00))\n\tapprove(r, \"u-17\")\n\tapprove(r, \"u-42\")\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "adj-2 posted: maker u-17, checker u-42",
          timeoutMs: 8000,
        }
      - {
          id: expect-file-check,
          type: expect.file,
          at: { afterAction: expect-2 },
          path: main.go,
          contains: "if checker == r.Maker {",
        }
      - id: pt-wait
        type: console.point
        at: { mark: pt-wait }
        target: { text: "adj-2 waits for a second person", occurrence: 1 }
      - id: pt-refused
        type: console.point
        at: { mark: pt-refused }
        target: { text: "adj-2 refused", occurrence: 1 }
      - id: pt-posted
        type: console.point
        at: { mark: pt-posted }
        target: { text: "checker u-42", occurrence: 1 }
      - id: pt-first
        type: console.point
        at: { mark: pt-first }
        target: { text: "no checker", occurrence: 1 }
      - { id: dock-2, type: runtime.collapseDock, at: { mark: dock-2 } }

  - id: where
    chapter: ဘယ်နေရာတွေမှာ လိုလဲ
    narration: >-
      [[mark:show-where]] ဒုတိယ approver ထားဖို့ စဉ်းစားရမယ့် နေရာက ငွေကို ရွှေ့နိုင်တဲ့၊ ဒါမှမဟုတ် ငွေကို
      မှားပြနိုင်တဲ့ action မှန်သမျှပါ။ [[mark:pt-m1]] ပမာဏ ကြီးတဲ့ withdrawal၊ လူက ကိုယ်တိုင် လုပ်တဲ့ withdrawal၊
      ခုနက လို manual ledger correction၊ treasury နဲ့ cold wallet ကနေ ငွေ ရွှေ့တာတွေ ပါပါတယ်။
      [[mark:pt-m4]] fee schedule နဲ့ limit ပြောင်းတာလည်း ပါပါတယ်။ ငွေ တစ်ပြားမှ မရွှေ့ပေမဲ့ နောက်
      transaction တိုင်းရဲ့ ပမာဏကို ပြောင်းသွားလို့ပါ။ [[mark:where-2]] engineering ဘက်မှာလည်း
      အတူတူပါပဲ။ main ထဲ merge လုပ်တာ၊ production ကို deploy လုပ်တာ၊ infrastructure ပြောင်းတာတွေက
      ငွေ system မှာ sensitive action တွေပါ၊ code တစ်ကြောင်းက manual correction တစ်ခုထက် ငွေ
      ပိုများများ ရွှေ့နိုင်လို့ပါ။ ဒါကြောင့် review နဲ့ approval ကို များသောအားဖြင့် မဖြစ်မနေ လိုအပ်အောင် ထားကြပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Segregation of duties and four-eyes (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#segregation-of-duties-and-four-eyes",
        }
    actions:
      - {
          id: show-where,
          type: slide.show,
          at: { mark: show-where, offsetMs: -700 },
          slideId: where-1,
        }
      - { id: pt-m1, type: slide.point, at: { mark: pt-m1 }, target: { x: 0.269, y: 0.414 } }
      - { id: pt-m4, type: slide.point, at: { mark: pt-m4 }, target: { x: 0.269, y: 0.781 } }
      - { id: where-2, type: slide.show, at: { mark: where-2 }, slideId: where-2 }
      - {
          id: pt-e2,
          type: slide.point,
          at: { afterAction: where-2 },
          target: { x: 0.731, y: 0.537 },
        }

  - id: glass
    chapter: Break-glass
    narration: >-
      [[mark:show-glass]] control တင်းကျပ်လွန်းရင် တခြား ပြဿနာ တစ်ခု ပေါ်လာပါတယ်။ အရေးပေါ်
      အချိန်မှာ ဒုတိယ လူ မရှိရင် လူတွေက control ကို ရှောင်တဲ့ လမ်းကို ကိုယ်တိုင် ဖောက်တတ်ပါတယ်၊ database
      ကို တိုက်ရိုက် ပြင်တာမျိုးပါ။ [[mark:glass-2]] ဒါကြောင့် break-glass ဆိုတဲ့ တရားဝင် လမ်း တစ်ခု
      ပေးထားပါတယ်။ checker မပါဘဲ လုပ်လို့ ရပေမဲ့ ဈေးကြီးပါတယ်။ [[mark:glass-3]] record ထဲမှာ
      break-glass လို့ အကြောင်းပြချက်နဲ့ ထင်ထင်ရှားရှား မှတ်တယ်၊ alert ကို ချက်ချင်း ပို့တယ်၊ ပြီးတော့
      ဒုတိယ လူ တစ်ယောက်က နောက်မှ စစ်ရမယ့် review queue ထဲ ထည့်ပါတယ်။ approval ကို ရှေ့မှာ
      မလုပ်နိုင်ရင် နောက်မှ လုပ်တာပါ။ [[mark:close-glass]] code ထဲ ထည့်ကြည့်ရအောင်။
      [[mark:type-glass]] break-glass function က checker မပါဘဲ execute ကို ခေါ်ပေမဲ့၊ record ထဲမှာ
      break-glass နဲ့ အကြောင်းပြချက်ကို ရေးပြီး review queue ထဲ ထည့်ပါတယ်။ [[mark:type-call3]] main
      ထဲမှာ provider outage ကြောင့် ယူရို နှစ်ထောင် correction ကို အဲဒီ လမ်းကနေ post လုပ်ပြီး review
      queue ကို ထုတ်ပြပါမယ်။ [[mark:run-3]] run လိုက်ရအောင်။ [[mark:pt-bg]] post ဖြစ်ပေမဲ့ record
      ထဲမှာ break-glass နဲ့ အကြောင်းပြချက် ပါနေပါတယ်။ [[mark:pt-queue]] review queue ထဲမှာလည်း
      ရောက်နေပါပြီ။ [[mark:dock-3]] break-glass ကို ဘယ်နှခါ သုံးလဲ ဆိုတာ ကိုယ်တိုင်က စောင့်ကြည့်ရမယ့်
      metric တစ်ခုပါ၊ ပုံမှန် လမ်းလို သုံးနေရင် control ကို ပြန်ဒီဇိုင်းဆွဲဖို့ signal ပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Segregation of duties and four-eyes (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#segregation-of-duties-and-four-eyes",
        }
    actions:
      - {
          id: show-glass,
          type: slide.show,
          at: { mark: show-glass, offsetMs: -700 },
          slideId: glass-1,
        }
      - {
          id: pt-ap,
          type: slide.point,
          at: { afterAction: show-glass },
          target: { x: 0.425, y: 0.409 },
        }
      - { id: glass-2, type: slide.show, at: { mark: glass-2 }, slideId: glass-2 }
      - {
          id: pt-bgc,
          type: slide.point,
          at: { afterAction: glass-2 },
          target: { x: 0.45, y: 0.664 },
        }
      - { id: glass-3, type: slide.show, at: { mark: glass-3 }, slideId: glass-3 }
      - { id: pt-c1, type: slide.point, at: { afterAction: glass-3 }, target: { x: 0.21, y: 0.82 } }
      - { id: close-glass, type: slide.close, at: { mark: close-glass } }
      - id: type-glass
        type: editor.type
        at: { mark: type-glass }
        target: { file: main.go, after: "\texecute(r, \"checker \"+checker)\n}\n", occurrence: 1 }
        text: "\nfunc breakGlass(r *Request, reason string) {\n\texecute(r, \"BREAK-GLASS: \"+reason)\n\treviews = append(reviews, r.Tx.ID+\" by \"+r.Maker)\n}\n"
        cadence: line-by-line
      - id: type-call3
        type: editor.type
        at: { mark: type-call3 }
        target: { file: main.go, after: "\tapprove(r, \"u-42\")\n", occurrence: 1 }
        text: "\n\tbreakGlass(&Request{Tx: credit(\"adj-3\", 2000_00), Maker: \"u-17\"}, \"provider outage\")\n\tfmt.Println(\"review queue:\", reviews)\n"
        cadence: line-by-line
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "review queue: [adj-3 by u-17]",
          timeoutMs: 8000,
        }
      - id: pt-bg
        type: console.point
        at: { mark: pt-bg }
        target: { text: "BREAK-GLASS", occurrence: 1 }
      - id: pt-queue
        type: console.point
        at: { mark: pt-queue }
        target: { text: "review queue", occurrence: 1 }
      - { id: dock-3, type: runtime.collapseDock, at: { mark: dock-3 } }

  - id: case
    chapter: Approver တွေ ရှိရဲ့နဲ့
    narration: >-
      [[mark:show-case]] approver ရှိနေရုံနဲ့ လုံခြုံတာ မဟုတ်ပါဘူး။ ၂၀၂၀ ခုနှစ် ဩဂုတ်လ ၁၁ ရက်နေ့မှာ
      Citibank က Revlon ရဲ့ term loan အတွက် administrative agent အနေနဲ့ lender တွေဆီ အတိုး ဒေါ်လာ သန်း ခုနစ်ဒသမ ရှစ် လောက် ပို့ဖို့ ရည်ရွယ်ခဲ့ပါတယ်။ [[mark:pt-sent]] ဒါပေမဲ့ ကိုယ့်ငွေ ဒေါ်လာ သန်း ၉၀၀ နီးပါးကိုပါ
      လွှဲမိခဲ့ပါတယ်၊ ကျန်နေတဲ့ principal နဲ့ ညီတဲ့ ပမာဏပါ။ [[mark:case-2]] ဒီ payment ကို Oracle
      Flexcube ထဲမှာ ထည့်ခဲ့ပြီး Citibank ရဲ့ six-eye procedure ကို ဖြတ်သွားပါတယ်၊ maker၊ checker နဲ့
      approver ဆိုပြီး သုံးယောက် အတည်ပြုခဲ့တာပါ။ ဒေါ်လာ သန်း ၅၀၀ ကျော် ရထားတဲ့ lender တွေက ပြန်မပေးခဲ့ပါဘူး။
      [[mark:case-3]] ၂၀၂၅ ဖေဖော်ဝါရီ ၂၁ ရက်နေ့မှာတော့ Bybit ရဲ့ Ethereum multisig cold wallet ကနေ warm
      wallet ကို ပုံမှန် လွှဲနေတုန်း ဒေါ်လာ ဘီလီယံ တစ်ဒသမ ငါး လောက်တန် virtual asset တွေ
      ခိုးခံခဲ့ရပါတယ်။ multisig ဆိုတာ key အများက sign လုပ်မှ ငွေ ရွှေ့လို့ရတဲ့ wallet ပါ၊ four-eyes ကို
      cryptography နဲ့ enforce လုပ်ထားတာပါ။ [[mark:pt-saw]] Bybit ရဲ့ ပြောချက်အရ signer တွေ မြင်ခဲ့ရတာက
      ဖုံးကွယ်ထားတဲ့ interface ပါ၊ [[mark:pt-did]] transaction ကတော့ cold wallet ရဲ့ smart contract logic
      ကို ပြောင်းလိုက်တာပါ။ FBI က ဒီ ခိုးမှုကို North Korea လုပ်တာလို့ သတ်မှတ်ခဲ့ပါတယ်။
      [[mark:pt-rule]] ဆိုလိုတာက approver ဘယ်နှယောက် ရှိလဲ ဆိုတာထက် approver ဘာကို မြင်လဲ ဆိုတာ
      ပိုအရေးကြီးပါတယ်။ approver အားလုံး screen တစ်ခုတည်းကို ကြည့်ပြီး အဲဒီ screen မှားနေရင်
      approval တွေက တစ်ခုနဲ့ တစ်ခု independent မဖြစ်တော့ပါဘူး။ [[mark:case-rule2]] ဒါကြောင့် approver
      ကို maker ရေးတဲ့ ဖော်ပြချက် မဟုတ်ဘဲ၊ operation ကနေ တွက်ထုတ်ထားတဲ့ တကယ့် effect ကို ပြရပါတယ်၊
      ဘယ် account က ဘယ်လောက် ပြောင်းမလဲ ဆိုတာပါ။ approval ကိုလည်း အဲဒီ version အတိအကျနဲ့
      ချည်ထားပြီး request ပြောင်းရင် ပြန်အတည်ပြုခိုင်းရပါတယ်။
    sources:
