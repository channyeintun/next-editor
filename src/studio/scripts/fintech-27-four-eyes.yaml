  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] Fintech interview တွေမှာ manual ledger adjustment tool တစ်ခု ဒီဇိုင်းဆွဲပါ လို့
      မေးတတ်ပါတယ်။ approve ခလုတ် ထည့်မယ် ဆိုတာထက် ပိုပြောရပါမယ်။ [[mark:iv-a]] ပထမ၊ request နဲ့
      approve ကို ခွဲပြီး checker က maker မဖြစ်ရဘူး ဆိုတာ server ဘက်က စစ်မယ်။ threshold ကို request
      တစ်ခုချင်းနဲ့ မဟုတ်ဘဲ maker တစ်ယောက်ရဲ့ ကာလ တစ်ခုအတွင်း စုစုပေါင်းနဲ့ စစ်မယ်၊ မဟုတ်ရင် ပမာဏကို
      ခွဲတင်ပြီး ကျော်လို့ ရပါတယ်။ [[mark:iv-b]] ဒုတိယ၊ approver ကို posting တွေနဲ့ balance
      အပြောင်းအလဲ ဆိုတဲ့ တကယ့် effect ကို ပြပြီး၊ approval ကို အဲဒီ version နဲ့ ချည်မယ်။ [[mark:iv-c]]
      တတိယ၊ အဆင့်တိုင်း trail ထဲ ရောက်မယ်၊ break-glass လမ်း ရှိပြီး နောက်မှ review လုပ်မယ်၊
      correction ကိုလည်း entry အသစ်နဲ့ပဲ လုပ်မယ်။ [[mark:iv-d]] ပြီးရင် ဘယ်သူ maker ဖြစ်ခွင့်၊ checker
      ဖြစ်ခွင့် ရှိလဲ ဆိုတာ role နဲ့ ထိန်းမယ်၊ maker က checker ကို ကိုယ်တိုင် ရွေးလို့ မရဘူး ဆိုတာ
      ဆက်ပြောပါ။
    sources:
