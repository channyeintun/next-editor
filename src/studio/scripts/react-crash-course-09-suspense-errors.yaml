# React crash course, lesson 9 — Suspense, use() and error boundaries (Burmese, my-MM).
#
# Story: data takes time to arrive and can fail. A fake api.js returns
# promises that resolve after a delay, cached in a module-level Map. MenuList
# reads the menu with use(promise) behind one <Suspense> boundary; a lazily
# loaded Reviews panel waits for its code AND its data behind its own
# boundary. The pinned class ErrorBoundary is read in a code tour; main.jsx
# gains an onCaughtError root option that writes to an on-page error log
# (outside React) instead of console.error. Finally a "today's specials"
# request whose promise rejects (created in a click handler, with a .catch
# attached so the browser never reports an unhandled rejection) shows the
# boundary's friendly fallback and one error-log line — with no console error.
#
# Insert-only plan: api.js, MenuList.jsx and Specials.jsx are pinned EMPTY and
# typed while nothing imports them. App.jsx, main.jsx and (once imported)
# api.js are live, so they only take `block` inserts: whole lines, or the
# curriculum's atomic suffix inserts into an import list / the createRoot call
# (", lazy, useState", ", fetchSpecials", ", { onCaughtError }"). The import
# always lands before its usage. New sections go directly under <Header />,
# so the newest demo is always at the top of the 432 px preview. Every JS edit
# reloads the preview (no Fast Refresh), so every click comes after the last
# edit, and every reload restarts the menu's 4-second fallback.
#
# The dev server starts during the first board and is waited on only when the
# preview opens, about two minutes of narration later.
#
# Narration is Burmese (my-MM); voice-script.md next to this file is the
# source of the narration text (tools/set_narration.py re-wraps it into the
# YAML), and every visible string (title, chapters, board labels, UI) is
# Burmese too. DESIGN.md is the writer's brief.
