build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 9209

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  # ------------------------------------------------------------------ 1
  - id: suspense-idea
    chapter: "Suspense ဘာကြောင့် လိုလဲ"
    narration: >
      တကယ့် app မှာ data ရောက်ဖို့ အချိန် ယူရပြီး error လည်း တက်တတ်ပါတယ်။
      ဒါကြောင့် ဒီ lesson မှာ data စောင့်နေတုန်း ဘာ ပြမလဲ၊ error တက်ရင် ဘယ်လို
      ဖမ်းမလဲ ဆိုတာကို Suspense၊ use နဲ့ error boundary တို့နဲ့
      ကြည့်သွားပါမယ်။ [[mark:start-server]] ရှင်းပြနေတုန်း dev server ကို
      နောက်ကွယ်မှာ စ run ထားလိုက်ရအောင်။ [[mark:draw-old]] အရင် နည်းမှာတော့
      component တိုင်းက loading state တစ်ခုနဲ့ loading စာသား တစ်ခု ကိုယ်စီ
      ထားရပါတယ်။ component သုံးခုဆိုရင် တူညီတဲ့ logic ကို သုံးခါ ထပ်ရေးရတာပါ။
      [[mark:draw-suspense]] React ရဲ့ Suspense ကတော့ အဲဒီ logic ကို
      တစ်နေရာတည်းမှာ စုပေးပါတယ်။ page ရဲ့ အပိုင်း တစ်ပိုင်းကို Suspense နဲ့
      ထုပ်ပြီး fallback ပေးထားရင်၊ အဲဒါ Suspense boundary ပါ။ fallback ဆိုတာ
      အထဲက component တွေ စောင့်နေတုန်း ခဏ ပြထားမယ့် UI ပါ။ [[mark:draw-sign]]
      အဲဒီ အပိုင်းပေါ်မှာ ခဏစောင့်ပါ ဆိုတဲ့ ဆိုင်းဘုတ် ချိတ်ထားသလိုပါပဲ။
      [[mark:draw-rule]] ဒါဆို component တစ်ခုစီထဲမှာ data ရောက်ရင် ဘာ ပြမလဲ
      ဆိုတာပဲ ရေးပြီး၊ စောင့်နေတုန်း UI ကို ဘယ်မှာ ပြမလဲ ဆိုတာကိုတော့ ကိုယ်က
      ရွေးရုံပါပဲ။
    sources:
      - title: "React — <Suspense>"
        url: "https://react.dev/reference/react/Suspense"
      - title: "React — <Suspense>: Displaying a fallback while content is loading"
        url: "https://react.dev/reference/react/Suspense#displaying-a-fallback-while-content-is-loading"
      - title: "Vite — Getting Started"
        url: "https://vite.dev/guide/"
    actions:
      - id: open-board-1
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        maximized: true
        clear: true
        upsertIds: [b1-title]
      - id: start-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 45000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-old
        type: whiteboard.apply
        at: { mark: draw-old }
        upsertIds:
          [
            b1-old-head,
            b1-old-box-1,
            b1-old-text-1,
            b1-old-box-2,
            b1-old-text-2,
            b1-old-box-3,
            b1-old-text-3,
            b1-old-note,
          ]
        drawMs: 3000
      - id: draw-suspense
        type: whiteboard.apply
        at: { mark: draw-suspense }
        upsertIds: [b1-new-head, b1-new-box, b1-children-1, b1-children-2]
        drawMs: 2200
      - id: draw-sign
        type: whiteboard.apply
        at: { mark: draw-sign }
        upsertIds: [b1-sign-box, b1-sign]
        drawMs: 1200
      - id: draw-rule
        type: whiteboard.apply
        at: { mark: draw-rule }
        upsertIds: [b1-rule, b1-rule-underline]
        drawMs: 1400

  # ------------------------------------------------------------------ 2
  - id: fake-api
    chapter: "Promise ကို use နဲ့ ဖတ်ကြည့်ရအောင်"
    narration: >
      [[mark:close-board-1]] editor ထဲ ပြန်သွားရအောင်။ တကယ့် server မရှိလို့
      server အတု သေးသေးလေး တစ်ခု ရေးပါမယ်။ [[mark:open-api]] api ဖိုင်က အခု
      အလွတ်ပါ၊ ဘယ်ဖိုင်ကမှ import မလုပ်ထားသေးပါဘူး။ [[mark:type-api-top]] data
      ဖိုင် နှစ်ခုကနေ ဟင်းလျာ စာရင်းနဲ့ သုံးသပ်ချက်တွေကို ယူပြီး၊ ရပြီးသားကို
      မှတ်ထားဖို့ Map တစ်ခုကို cache အဖြစ် ထားပါတယ်။ [[mark:type-delay]]
      promise ဆိုတာ နောက်မှ ရောက်လာမယ့် တန်ဖိုး တစ်ခုကို ကိုယ်စားပြုတဲ့
      JavaScript object ပါ။ delay က ခဏ ကြာမှ ပြီးမယ့် promise ကို ပြန်ပေးလို့၊
      network ကနေ အဖြေ ပြန်လာသလိုပါပဲ။ [[mark:type-fetch-menu]] fetchMenu
      ကတော့ 4 စက္ကန့် ကြာမှ ဟင်းလျာ စာရင်း ရမယ့် promise ကို ပြန်ပေးပါတယ်။
      စောင့်ရတာ မြင်သာအောင် တမင် နှေးထားတာပါ။ [[mark:select-cache]] cache
      ထဲမှာ ရှိပြီးလား စစ်တဲ့ အပိုင်းကို ကြည့်ပါ။ ပထမဆုံး ခေါ်တဲ့အခါမှာပဲ
      promise ကို ဖန်တီးပြီး၊ နောက်ပိုင်း ခေါ်တိုင်း အဲဒီ promise
      တစ်ခုတည်းကိုပဲ ပြန်ရပါတယ်။ [[mark:type-fetch-reviews]] fetchReviews
      ကလည်း သုံးသပ်ချက်တွေအတွက် အဲဒီအတိုင်းပါပဲ၊ ဒီတစ်ခါတော့ 3 စက္ကန့်ပါ။
    sources:
      - title: "MDN — Promise"
        url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise"
      - title: "MDN — setTimeout()"
        url: "https://developer.mozilla.org/en-US/docs/Web/API/Window/setTimeout"
      - title: "MDN — Map"
        url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Map"
      - title: "React — use: Caching Promises for Client Components"
        url: "https://react.dev/reference/react/use#caching-promises-for-client-components"
    actions:
      - id: close-board-1
        type: whiteboard.apply
        at: { mark: close-board-1 }
        open: false
      - id: collapse-dock-early
        type: runtime.collapseDock
        at: { afterAction: close-board-1 }
      - id: open-api
        type: workspace.openFile
        at: { mark: open-api }
        path: src/api.js
      - id: type-api-top
        type: editor.type
        at: { mark: type-api-top }
        cadence: line-by-line
        target: { file: src/api.js, after: "", occurrence: 1 }
        text: "import { menu } from \"./menu.js\";\nimport { reviews } from \"./reviews.js\";\n\nconst cache = new Map();\n"
      - id: type-delay
        type: editor.type
        at: { mark: type-delay }
        cadence: line-by-line
        target: { file: src/api.js, after: "const cache = new Map();\n", occurrence: 1 }
        text: "\nfunction delay(ms, value) {\n  return new Promise((resolve) => {\n    setTimeout(() => resolve(value), ms);\n  });\n}\n"
      - id: type-fetch-menu
        type: editor.type
        at: { mark: type-fetch-menu }
        cadence: line-by-line
        target:
          {
            file: src/api.js,
            after: "    setTimeout(() => resolve(value), ms);\n  });\n}\n",
            occurrence: 1,
          }
        text: "\nexport function fetchMenu() {\n  if (!cache.has(\"menu\")) {\n    cache.set(\"menu\", delay(4000, menu));\n  }\n  return cache.get(\"menu\");\n}\n"
      - id: select-cache
        type: editor.select
        at: { mark: select-cache }
        target:
          {
            file: src/api.js,
            text: "  if (!cache.has(\"menu\")) {\n    cache.set(\"menu\", delay(4000, menu));\n  }\n",
            occurrence: 1,
          }
      - id: type-fetch-reviews
        type: editor.type
        at: { mark: type-fetch-reviews }
        cadence: line-by-line
        target: { file: src/api.js, after: "  return cache.get(\"menu\");\n}\n", occurrence: 1 }
        text: "\nexport function fetchReviews() {\n  if (!cache.has(\"reviews\")) {\n    cache.set(\"reviews\", delay(3000, reviews));\n  }\n  return cache.get(\"reviews\");\n}\n"

  # ------------------------------------------------------------------ 3
  - id: menu-list
    narration: >
      [[mark:open-menu-list]] အခု ဟင်းလျာ စာရင်းကို ပြမယ့် component
      ရေးရအောင်။ MenuList ဖိုင်လည်း အလွတ်ပါပဲ။ [[mark:type-menu-top]] MenuList
      က promise ကို အပြင်ကနေ prop အနေနဲ့ လက်ခံပါတယ်။ [[mark:type-use-line]]
      ပြီးတော့ အဲဒီ promise ကို use နဲ့ ဖတ်ပါတယ်။ lesson 5 မှာ context ဖတ်ဖို့
      သုံးခဲ့တဲ့ React API ပါပဲ။ [[mark:select-use]] use ခေါ်ထားတဲ့ နေရာကို
      ကြည့်ပါ။ promise ပြီးပြီဆိုရင် use က ရလာတဲ့ တန်ဖိုးကို ပြန်ပေးပါတယ်။
      မပြီးသေးရင်တော့ component က ခဏ ရပ်စောင့်ပါတယ်။ ဒါကို suspend ဖြစ်တယ်လို့
      ခေါ်ပါတယ်။ အဲဒီအခါ promise ပြီးတဲ့အထိ React က အနီးဆုံး Suspense ရဲ့
      fallback ကို ပြထားပါတယ်။ [[mark:type-menu-return]] ကျန်တာက lesson 2 က
      list အတိုင်းပါပဲ။ ဟင်းလျာ တစ်ခုစီအတွက် စာကြောင်း တစ်ကြောင်းစီ ဖြစ်ပြီး၊
      key၊ နာမည်နဲ့ ဈေးနှုန်း ပါပါတယ်။ ဒီ component ထဲမှာ loading state လည်း
      မရှိ၊ effect လည်း မရှိတာကို သတိထား ကြည့်ပါ။
    sources:
      - title: "React — use"
        url: "https://react.dev/reference/react/use"
      - title: "React — use: Reading a Promise with use"
        url: "https://react.dev/reference/react/use#reading-a-promise-with-use"
      - title: "React 19 — New API: use"
        url: "https://react.dev/blog/2024/12/05/react-19#new-feature-use"
    actions:
      - id: open-menu-list
        type: workspace.openFile
        at: { mark: open-menu-list, offsetMs: 400 }
        path: src/MenuList.jsx
      - id: type-menu-top
        type: editor.type
        at: { mark: type-menu-top }
        cadence: line-by-line
        target: { file: src/MenuList.jsx, after: "", occurrence: 1 }
        text: "import { use } from \"react\";\n\nexport default function MenuList({ promise }) {\n"
      - id: type-use-line
        type: editor.type
        at: { mark: type-use-line }
        cadence: fast-explainer
        target:
          {
            file: src/MenuList.jsx,
            after: "export default function MenuList({ promise }) {\n",
            occurrence: 1,
          }
        text: "  const dishes = use(promise);\n"
      - id: select-use
        type: editor.select
        at: { mark: select-use }
        target: { file: src/MenuList.jsx, text: "use(promise)", occurrence: 1 }
      - id: type-menu-return
        type: editor.type
        at: { mark: type-menu-return }
        cadence: line-by-line
        target: { file: src/MenuList.jsx, after: "  const dishes = use(promise);\n", occurrence: 1 }
        text: "  return (\n    <ul className=\"list\" data-testid=\"menu-list\">\n      {dishes.map((dish) => (\n        <li key={dish.id}>\n          <span>{dish.name}</span>\n          <span className=\"muted\">{dish.price.toLocaleString(\"en-US\") + \" ကျပ်\"}</span>\n        </li>\n      ))}\n    </ul>\n  );\n}\n"

  # ------------------------------------------------------------------ 4
  - id: menu-suspense
    narration: >
      [[mark:open-app-menu]] ကဲ၊ ဟင်းလျာ စာရင်းကို page ပေါ် တင်ရအောင်။ App က
      အခုထိ ဆိုင်ရဲ့ ခေါင်းစဉ်ကိုပဲ ပြနေပါသေးတယ်။ [[mark:wire-react-import]]
      အရင်ဆုံး လိုမယ့် အရာ သုံးခုကို import လုပ်ပါတယ်။ React ရဲ့ Suspense၊
      server အတုက fetchMenu နဲ့ ခုနက ရေးခဲ့တဲ့ MenuList ပါ။
      [[mark:preview-opens]] dev server အသင့် ဖြစ်နေပြီမို့ preview ကို
      ဖွင့်လိုက်ရအောင်။ အခု ထည့်မှာကတော့ ခေါင်းစဉ် ပါတဲ့ ဟင်းလျာ card
      တစ်ခုနဲ့၊ list ကို ထုပ်ထားတဲ့ Suspense boundary ပါ။
      [[mark:wire-menu-jsx]] ကြည့်ပါ၊ ခေါင်းစဉ် အောက်မှာ fallback စာကြောင်း
      ပေါ်နေပါပြီ။ fetchMenu ကို 4 စက္ကန့် ကြာအောင် လုပ်ထားလို့၊ list က ခဏ
      စောင့်ရပါတယ်။ [[mark:menu-arrives]] promise ပြီးသွားတော့ အဲဒီ နေရာမှာ
      ဟင်းလျာတွေ ရောက်လာပါပြီ။ [[mark:select-suspense-jsx]] ဒီ boundary က list
      ကိုပဲ ထုပ်ထားလို့၊ card ရဲ့ ခေါင်းစဉ်က ချက်ချင်း ပေါ်ပြီး list ကပဲ
      စောင့်ရတာပါ။ Suspense ထားတဲ့ နေရာက page ရဲ့ ဘယ်အပိုင်း စောင့်ရမလဲ
      ဆိုတာကို ဆုံးဖြတ်ပါတယ်။
    sources:
      - title: "React — <Suspense>: Displaying a fallback while content is loading"
        url: "https://react.dev/reference/react/Suspense#displaying-a-fallback-while-content-is-loading"
      - title: "React — use: Displaying an error with an Error Boundary"
        url: "https://react.dev/reference/react/use#displaying-an-error-with-an-error-boundary"
    actions:
      - id: open-app-menu
        type: workspace.openFile
        at: { mark: open-app-menu, offsetMs: 400 }
        path: src/App.jsx
      - id: wire-react-import
        type: editor.type
        at: { mark: wire-react-import }
        cadence: block
        target: { file: src/App.jsx, after: "", occurrence: 1 }
        text: "import { Suspense } from \"react\";\n"
      - id: wire-menu-import
        type: editor.type
        at: { afterAction: wire-react-import }
        cadence: block
        target:
          { file: src/App.jsx, after: "import { Header } from \"./Header.jsx\";\n", occurrence: 1 }
        text: "import { fetchMenu } from \"./api.js\";\nimport MenuList from \"./MenuList.jsx\";\n"
      - id: wait-for-server
        type: runtime.waitForReady
        at: { mark: preview-opens }
        timeoutMs: 20000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-server }
        timeoutMs: 15000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-header
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: title }
        textContains: "ရွှေရန်ကုန်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: collapse-dock
        type: runtime.collapseDock
        at: { afterAction: expect-header }
      - id: wire-menu-jsx
        type: editor.type
        at: { mark: wire-menu-jsx }
        cadence: block
        target: { file: src/App.jsx, after: "      <Header />\n", occurrence: 1 }
        text: "      <section className=\"card\">\n        <h2>ဟင်းလျာစာရင်း</h2>\n        <Suspense fallback={<p className=\"muted\" data-testid=\"menu-loading\">ဟင်းလျာတွေ ယူနေပါတယ်…</p>}>\n          <MenuList promise={fetchMenu()} />\n        </Suspense>\n      </section>\n"
      - id: expect-menu-loading
