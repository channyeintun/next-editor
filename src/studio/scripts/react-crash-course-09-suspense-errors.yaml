            occurrence: 1,
          }

  # ------------------------------------------------------------------ 5
  - id: promise-board
    narration: >
      ဒါဆို cache က ဘာကြောင့် လိုလဲ။ [[mark:draw-in-render]] promise ကို
      render ထဲမှာ ဖန်တီးမယ် ဆိုပါစို့။ ပြန် render လုပ်တိုင်း promise အသစ်
      ဖြစ်ပြီး ထပ် suspend ဖြစ်လို့၊ React က fallback ကနေ ဘယ်တော့မှ
      ထွက်မလာတော့ပါဘူး။ [[mark:draw-outside]] ဒါကြောင့် promise ကို render
      အပြင်မှာ ဖန်တီးရပါမယ်၊ cache ထဲမှာ ဒါမှမဟုတ် event handler ထဲမှာ
      ဖန်တီးပြီး state ထဲ သိမ်းထားတာမျိုးပါ။ App က fetchMenu ကို render
      လုပ်တိုင်း ခေါ်ပေမယ့်၊ cache ရှိလို့ promise အသစ် မဖြစ်ပါဘူး။
      [[mark:draw-use-note]] use ကို hook တွေနဲ့ မတူဘဲ if ထဲမှာ ခေါ်လို့
      ရပါတယ်။ ဒါပေမဲ့ try နဲ့ catch ထဲမှာတော့ မခေါ်ရပါဘူး။ promise ကို
      စောင့်ဖို့ use က render ကို ရပ်လိုက်တာကို၊ catch က ကြားက
      ဖမ်းယူသွားနိုင်လို့ပါ။ [[mark:draw-use-next]] promise က တန်ဖိုး
      မပေးနိုင်ဘဲ error နဲ့ ပြီးသွားတာကို reject ဖြစ်တယ်လို့ ခေါ်ပါတယ်။ အဲဒီ
      error ကိုတော့ try နဲ့ catch အစား error boundary ဆိုတဲ့ component နဲ့
      ဖမ်းပါတယ်၊ ခဏနေရင် ကြည့်ပါမယ်။
    sources:
      - title: "React — use(promise): Caveats"
        url: "https://react.dev/reference/react/use#promise-caveats"
      - title: "React — use: Displaying an error with an Error Boundary"
        url: "https://react.dev/reference/react/use#displaying-an-error-with-an-error-boundary"
    actions:
      - id: board-promise
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        maximized: true
        clear: true
        upsertIds: [b2-title]
      - id: draw-in-render
        type: whiteboard.apply
        at: { mark: draw-in-render }
        upsertIds: [b2-bad-box, b2-bad-head, b2-bad-l1, b2-bad-l2, b2-bad-strike]
        drawMs: 2600
      - id: draw-outside
        type: whiteboard.apply
        at: { mark: draw-outside }
        upsertIds: [b2-good-box, b2-good-head, b2-good-l1, b2-good-l2, b2-good-check]
        drawMs: 2600
      - id: draw-use-note
        type: whiteboard.apply
        at: { mark: draw-use-note }
        upsertIds: [b2-use-note]
        drawMs: 1000
      - id: draw-use-next
        type: whiteboard.apply
        at: { mark: draw-use-next }
        upsertIds: [b2-use-next]
        drawMs: 900

  # ------------------------------------------------------------------ 6
  - id: lazy-reviews
    chapter: "Code ကို lazy နဲ့ လိုမှ ယူရအောင်"
    narration: >
      [[mark:close-board-promise]] Suspense က data ကိုသာမက code ကိုလည်း
      စောင့်ပေးပါတယ်။ ဆိုင်ရဲ့ သုံးသပ်ချက် အပိုင်းနဲ့ ကြည့်ရအောင်။
      [[mark:open-reviews]] သုံးသပ်ချက်တွေကို ပြတဲ့ Reviews component က
      ရေးပြီးသားပါ။ [[mark:select-reviews-use]] သူက MenuList လိုပဲ
      သုံးသပ်ချက်တွေကို use နဲ့ ဖတ်ပါတယ်။ fetchReviews ကို render ထဲမှာ
      ခေါ်ပေမယ့်၊ cache ကနေ promise တစ်ခုတည်းကိုပဲ ပြန်ရလို့ ရပါတယ်။
      [[mark:open-app-reviews]] ဧည့်သည် အများစုက သုံးသပ်ချက်ကို
      ဖွင့်မကြည့်ကြပါဘူး။ ဒါဆို ဒီ code ကို လူတိုင်း download လုပ်ဖို့
      လိုပါသလား။ [[mark:wire-lazy-import]] React import ထဲကို lazy နဲ့
      useState ထပ်ထည့်ပါတယ်။ [[mark:wire-lazy-const]] lazy က ဖိုင်ကို import
      လုပ်မယ့် function တစ်ခုကို ယူပြီး၊ component တစ်ခု ပြန်ပေးပါတယ်။ အဲဒီ
      function ကို Reviews ပထမဆုံး render လုပ်မှ React က ခေါ်ပါတယ်။
      [[mark:select-lazy]] function လို ခေါ်ထားတဲ့ ဒီ import ကြောင့်၊
      production build မှာ Reviews က သီးသန့် ဖိုင် ဖြစ်သွားပြီး လိုမှသာ
      download လုပ်ပါတယ်။ ဒါကို lazy load လုပ်တယ်လို့ ခေါ်ပါတယ်။
      [[mark:wire-reviews-state]] သုံးသပ်ချက် ဖွင့်ထားလား ဆိုတာကို state
      တစ်ခုနဲ့ မှတ်ထားပါတယ်။ [[mark:wire-reviews-jsx]] ပြီးတော့ ခလုတ် ပါတဲ့
      card တစ်ခု ထည့်ပြီး၊ ခလုတ် နှိပ်မှ Reviews ကို သူ့ကိုယ်ပိုင် Suspense
      boundary ထဲမှာ ပြလို့၊ fallback က ဒီ card ထဲမှာပဲ ပေါ်ပါတယ်။
      [[mark:click-reviews]] ဖွင့်ကြည့်ရအောင်။ fallback ကို
      ကြည့်ပါ။ [[mark:reviews-arrive]] သုံးသပ်ချက်တွေ ရောက်လာပါပြီ။ code
      ယူတာရော data စောင့်တာရော နှစ်ခုလုံးကို fallback တစ်ခုတည်းက
      ကိုင်ပေးသွားတာပါ။ [[mark:prewarm-note]] အရင်က component တစ်ခု suspend
      ဖြစ်ရင်၊ boundary ထဲက ကျန်တဲ့ component တွေ အကုန် render ပြီးမှ fallback
      ပေါ်ပါတယ်။ React 19 ကစပြီးတော့ fallback ကို ချက်ချင်း ပြပြီး၊ ကျန်တဲ့
      component တွေကို နောက်ကွယ်မှာ ဆက် render လုပ်ပါတယ်။ ဒါကြောင့် သူတို့ရဲ့
      request တွေလည်း စောစော စပါတယ်။
    sources:
      - title: "React — lazy"
        url: "https://react.dev/reference/react/lazy"
      - title: "React — lazy: Suspense for lazy-loaded components"
        url: "https://react.dev/reference/react/lazy#suspense-for-code-splitting"
      - title: "Vite — Features: Dynamic Import"
        url: "https://vite.dev/guide/features.html#dynamic-import"
      - title: "React 19 Upgrade Guide — Improvements to Suspense"
        url: "https://react.dev/blog/2024/04/25/react-19-upgrade-guide#improvements-to-suspense"
    actions:
      - id: close-board-promise
        type: whiteboard.apply
        at: { mark: close-board-promise }
        open: false
      - id: open-reviews
        type: workspace.openFile
        at: { mark: open-reviews }
        path: src/Reviews.jsx
      - id: select-reviews-use
        type: editor.select
        at: { mark: select-reviews-use }
        target: { file: src/Reviews.jsx, text: "use(fetchReviews())", occurrence: 1 }
      - id: open-app-reviews
        type: workspace.openFile
        at: { mark: open-app-reviews }
        path: src/App.jsx
      - id: wire-lazy-import
        type: editor.type
        at: { mark: wire-lazy-import }
        cadence: block
        target: { file: src/App.jsx, after: "import { Suspense", occurrence: 1 }
        text: ", lazy, useState"
      - id: wire-lazy-const
        type: editor.type
        at: { mark: wire-lazy-const }
        cadence: block
        target:
          { file: src/App.jsx, after: "import MenuList from \"./MenuList.jsx\";\n", occurrence: 1 }
        text: "\nconst Reviews = lazy(() => import(\"./Reviews.jsx\"));\n"
      - id: select-lazy
        type: editor.select
        at: { mark: select-lazy }
        target: { file: src/App.jsx, text: 'import("./Reviews.jsx")', occurrence: 1 }
      - id: wire-reviews-state
        type: editor.type
        at: { mark: wire-reviews-state }
        cadence: block
        target: { file: src/App.jsx, after: "export default function App() {\n", occurrence: 1 }
        text: "  const [showReviews, setShowReviews] = useState(false);\n\n"
      - id: wire-reviews-jsx
        type: editor.type
        at: { mark: wire-reviews-jsx }
        cadence: block
        target: { file: src/App.jsx, after: "      <Header />\n", occurrence: 1 }
        text: "      <section className=\"card\">\n        <button data-testid=\"show-reviews\" onClick={() => setShowReviews(true)}>\n          သုံးသပ်ချက် ကြည့်မယ်\n        </button>\n        {showReviews && (\n          <Suspense fallback={<p className=\"muted\" data-testid=\"reviews-loading\">သုံးသပ်ချက်တွေ ယူနေပါတယ်…</p>}>\n            <Reviews />\n          </Suspense>\n        )}\n      </section>\n"
      - id: expect-reviews-button
        type: expect.preview
        at: { mark: click-reviews, offsetMs: -700 }
        timeoutMs: 5000
        target: { by: testId, value: show-reviews }
        textContains: "သုံးသပ်ချက်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: click-reviews
        type: preview.click
        at: { mark: click-reviews }
        timeoutMs: 5000
        target: { by: testId, value: show-reviews }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-reviews-loading
        type: expect.preview
        at: { afterAction: click-reviews }
        timeoutMs: 5000
        target: { by: testId, value: reviews-loading }
        textContains: "ယူနေပါတယ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-reviews
        type: expect.preview
        at: { mark: reviews-arrive }
        timeoutMs: 5000
        target: { by: testId, value: reviews }
        textContains: "အရသာ"
        retry: { maxAttempts: 3, delayMs: 1500 }

  # ------------------------------------------------------------------ 7
  - id: boundary-tour
    chapter: "Error boundary ဆိုတာ ဘာလဲ"
    narration: >
      [[mark:open-boundary]] နောက်တစ်ခုက request မအောင်မြင်တဲ့အခါပါ။ error
      boundary ဆိုတာ သူ့အောက်က component error တက်ရင် page တစ်ခုလုံး
      ပျက်မသွားအောင် ဖမ်းပြီး၊ အစားထိုး UI ပြပေးတဲ့ component ပါ။
      [[mark:select-extends]] ဒီဖိုင်မှာ ErrorBoundary ကို class component
      အနေနဲ့ ရေးထားပါတယ်။ class component ဆိုတာ function အစား JavaScript class
      နဲ့ ရေးတဲ့ ရေးနည်း အဟောင်းပါ။ error boundary အတွက် hook က အခုထိ
      မရှိသေးလို့၊ ဒီ course မှာ class ဆိုလို့ ဒီတစ်ခုပဲ ပါပါတယ်။
      [[mark:select-derived]] အောက်က component က error throw လုပ်တာနဲ့ React က
      getDerivedStateFromError ကို ခေါ်ပြီး၊ သူ ပြန်ပေးတာက boundary ရဲ့ state
      အသစ် ဖြစ်သွားပါတယ်။ [[mark:select-did-catch]] componentDidCatch ကတော့
      တကယ့် app မှာ error ကို logging service ဆီ ပို့တဲ့ နေရာပါ၊ ဒီမှာတော့
      မှတ်ချက် တစ်ကြောင်းပဲ ထားပါတယ်။ [[mark:select-render]] render ကတော့
      error ရှိရင် fallback prop ကို ပြပြီး၊ မရှိရင် children ကို
      ပုံမှန်အတိုင်း ပြပါတယ်။
    sources:
      - title: "React — Component: Catching rendering errors with an Error Boundary"
        url: "https://react.dev/reference/react/Component#catching-rendering-errors-with-an-error-boundary"
      - title: "React — Component: static getDerivedStateFromError"
        url: "https://react.dev/reference/react/Component#static-getderivedstatefromerror"
      - title: "React — Component: componentDidCatch"
        url: "https://react.dev/reference/react/Component#componentdidcatch"
    actions:
      - id: open-boundary
        type: workspace.openFile
        at: { mark: open-boundary }
        path: src/ErrorBoundary.jsx
      - id: select-extends
        type: editor.select
        at: { mark: select-extends }
        target:
          {
            file: src/ErrorBoundary.jsx,
            text: "class ErrorBoundary extends Component",
            occurrence: 1,
          }
      - id: select-derived
        type: editor.select
        at: { mark: select-derived }
        target:
          {
            file: src/ErrorBoundary.jsx,
            text: "  static getDerivedStateFromError(error) {\n    return { error };\n  }\n",
            occurrence: 1,
          }
      - id: select-did-catch
        type: editor.select
        at: { mark: select-did-catch }
        target:
          { file: src/ErrorBoundary.jsx, text: "componentDidCatch(error, info)", occurrence: 1 }
      - id: select-render
        type: editor.select
        at: { mark: select-render }
        target:
          {
            file: src/ErrorBoundary.jsx,
            text: "    if (this.state.error) {\n      return this.props.fallback;\n    }\n    return this.props.children;\n",
            occurrence: 1,
          }

  # ------------------------------------------------------------------ 8
  - id: root-on-caught
    narration: >
      [[mark:open-main]] main ဖိုင်ကို ကြည့်ရအောင်။ boundary ဖမ်းမိတဲ့ error
      တွေကို React 19 က default အားဖြင့် console.error နဲ့ report လုပ်ပါတယ်။
      တကယ့် app မှာ ကိုယ့် logging service ဆီ ပို့ချင်ရင်တော့၊ createRoot ရဲ့
      option နဲ့ ပြောင်းလို့ ရပါတယ်။ [[mark:type-on-caught]] ဒီ function က
      console အစား page ပေါ်က error log ထဲ စာကြောင်း တစ်ကြောင်း ထည့်ပါတယ်။
      [[mark:type-root-option]] ဒီ function ကို createRoot ဆီ onCaughtError
      အနေနဲ့ ပေးလိုက်တော့၊ boundary က error ဖမ်းမိတိုင်း React က ဒီ function
      ကို ခေါ်ပါတယ်။ [[mark:select-root-option]] componentDidCatch က boundary
      တစ်ခုစီအတွက်ပါ၊ ဒီ option ကတော့ app ထဲက boundary အားလုံး ဖမ်းမိတဲ့ error
      တွေအတွက် တစ်နေရာတည်းပါ။
    sources:
      - title: "React — createRoot: Parameters"
        url: "https://react.dev/reference/react-dom/client/createRoot#parameters"
      - title: "React — createRoot: Error logging in production"
        url: "https://react.dev/reference/react-dom/client/createRoot#error-logging-in-production"
      - title: "React 19 — Better error reporting"
        url: "https://react.dev/blog/2024/12/05/react-19#error-handling"
    actions:
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: src/main.jsx
      - id: type-on-caught
        type: editor.type
        at: { mark: type-on-caught }
        cadence: block
        target: { file: src/main.jsx, after: "import \"./styles.css\";\n\n", occurrence: 1 }
        text: "function onCaughtError(error) {\n  const item = document.createElement(\"li\");\n  item.textContent = \"ဖမ်းမိတဲ့ error – \" + error.message;\n  document.getElementById(\"error-log\").append(item);\n}\n\n"
      - id: type-root-option
        type: editor.type
        at: { mark: type-root-option }
        cadence: block
        target:
          { file: src/main.jsx, after: 'createRoot(document.getElementById("root")', occurrence: 1 }
        text: ", { onCaughtError }"
      - id: select-root-option
        type: editor.select
        at: { mark: select-root-option }
        target: { file: src/main.jsx, text: "{ onCaughtError }", occurrence: 1 }

  # ------------------------------------------------------------------ 9
  - id: error-routes
    narration: >
      [[mark:board-routes]] error ဘယ်ကို ရောက်လဲ ပုံဆွဲ ကြည့်ရအောင်။
      [[mark:draw-caught]] render လုပ်နေတုန်း ဖြစ်တဲ့ error ဖြစ်ဖြစ်၊ reject
      ဖြစ်တဲ့ promise ဖြစ်ဖြစ်၊ အနီးဆုံး boundary က fallback ကို ပြပြီး၊ error
      က onCaughtError ဆီ ရောက်ပါတယ်။ [[mark:draw-uncaught]] ဖမ်းမယ့် boundary
      မရှိရင်တော့ error က uncaught ဖြစ်ပါတယ်။ React က root ရဲ့ UI တစ်ခုလုံးကို
      ဖယ်ထုတ်ပြီး၊ createRoot ရဲ့ onUncaughtError option ကို ခေါ်ပါတယ်။
      [[mark:draw-owner-stack]] development မှာပဲ ရတဲ့ captureOwnerStack ကို
      ဒီ option တွေထဲမှာ ခေါ်ရင်၊ error တက်တဲ့ component ကို ဘယ် component
      တွေက ဖန်တီးခဲ့လဲ သိရပါတယ်။
    sources:
      - title: "React — createRoot: Parameters (onCaughtError, onUncaughtError)"
        url: "https://react.dev/reference/react-dom/client/createRoot#parameters"
      - title: "React 19 Upgrade Guide — Errors in render are not re-thrown"
        url: "https://react.dev/blog/2024/04/25/react-19-upgrade-guide#errors-in-render-are-not-re-thrown"
      - title: "React — captureOwnerStack"
        url: "https://react.dev/reference/react/captureOwnerStack"
    actions:
      - id: board-routes
        type: whiteboard.apply
        at: { mark: board-routes }
        open: true
        maximized: true
        clear: true
        upsertIds: [b3-title]
      - id: draw-caught
        type: whiteboard.apply
        at: { mark: draw-caught }
        upsertIds:
          [
            b3-c-src-box,
            b3-c-src-text,
            b3-c-src-sub,
            b3-c-arrow-1,
            b3-c-eb-box,
            b3-c-eb-text,
            b3-c-arrow-2,
            b3-c-fb-box,
            b3-c-fb-text,
            b3-c-report,
            b3-c-default,
          ]
        drawMs: 3600
      - id: draw-uncaught
        type: whiteboard.apply
        at: { mark: draw-uncaught }
        upsertIds:
          [
            b3-u-src-box,
            b3-u-src-text,
            b3-u-arrow-1,
            b3-u-handler-box,
            b3-u-handler-text,
            b3-u-arrow-2,
            b3-u-result-box,
            b3-u-result-text,
          ]
        drawMs: 3000
      - id: draw-owner-stack
        type: whiteboard.apply
        at: { mark: draw-owner-stack }
        upsertIds: [b3-owner]
        drawMs: 1000

  # ------------------------------------------------------------------ 10
  - id: specials-code
    chapter: "Error ကို ဖမ်းကြည့်ရအောင်"
    narration: >
      [[mark:close-board-routes]] ကဲ၊ server က အဖြေ မပေးနိုင်တဲ့ request
      တစ်ခုကို အတုလုပ်ပြီး၊ error ကို တကယ် ဖမ်းကြည့်ရအောင်။
      [[mark:open-api-2]] api ဖိုင်ထဲမှာ ဒီနေ့ special စာရင်း ယူမယ့် function
      အသစ် တစ်ခု ထည့်ပါမယ်။ [[mark:type-fetch-specials]] fetchSpecials ကတော့
      ခေါ်တိုင်း promise အသစ် တစ်ခု ဖန်တီးပြီး၊ 4 စက္ကန့် ကြာရင် error နဲ့
      reject လုပ်ပါတယ်။ render ထဲမှာ မဟုတ်ဘဲ ခလုတ် နှိပ်မှ ခေါ်မှာမို့ cache
      မလိုပါဘူး။ [[mark:select-catch]] reject ဖြစ်တဲ့ promise ကို ဘယ်သူမှ
      မကိုင်တွယ်ရင်၊ browser က console ထဲမှာ error ပြပါတယ်။ ဒီ catch အလွတ်က
      ကိုင်တွယ်ပြီးပြီလို့ browser ကို ပြောလိုက်တာပါ။ use ကတော့ promise
      ကိုယ်တိုင်ကို ဖတ်လို့ error ကို မြင်နေဆဲပါ။ [[mark:open-specials]]
      Specials ဖိုင်ကတော့ အလွတ်ပါ။ [[mark:type-specials-head]] Specials ကလည်း
      MenuList လိုပဲ promise ကို prop နဲ့ ယူပါတယ်။ [[mark:type-specials-use]]
      ပြီးတော့ use နဲ့ ဖတ်ပါတယ်။ promise reject ဖြစ်သွားရင် use က အဲဒီ error
      ကို render လုပ်နေချိန်မှာ throw လုပ်လို့၊ boundary က ဖမ်းလို့ ရပါတယ်။
      [[mark:type-specials-return]] special တွေ တကယ် ရလာရင်တော့ စာကြောင်း
      တစ်ကြောင်းတည်းနဲ့ ပြမှာပါ။
    sources:
      - title: "React — use: Displaying an error with an Error Boundary"
        url: "https://react.dev/reference/react/use#displaying-an-error-with-an-error-boundary"
      - title: "MDN — Promise.prototype.catch()"
        url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise/catch"
      - title: "MDN — Window: unhandledrejection event"
        url: "https://developer.mozilla.org/en-US/docs/Web/API/Window/unhandledrejection_event"
    actions:
      - id: close-board-routes
        type: whiteboard.apply
        at: { mark: close-board-routes }
        open: false
      - id: open-api-2
        type: workspace.openFile
        at: { mark: open-api-2 }
        path: src/api.js
      - id: type-fetch-specials
        type: editor.type
        at: { mark: type-fetch-specials }
        cadence: block
        target: { file: src/api.js, after: "  return cache.get(\"reviews\");\n}\n", occurrence: 1 }
        text: "\nexport function fetchSpecials() {\n  const promise = new Promise((resolve, reject) => {\n    setTimeout(() => reject(new Error(\"special စာရင်း မရသေးပါ\")), 4000);\n  });\n  promise.catch(() => {});\n  return promise;\n}\n"
      - id: select-catch
        type: editor.select
        at: { mark: select-catch }
        target: { file: src/api.js, text: "  promise.catch(() => {});\n", occurrence: 1 }
      - id: open-specials
        type: workspace.openFile
        at: { mark: open-specials }
        path: src/Specials.jsx
      - id: type-specials-head
        type: editor.type
        at: { mark: type-specials-head }
        cadence: line-by-line
        target: { file: src/Specials.jsx, after: "", occurrence: 1 }
        text: "import { use } from \"react\";\n\nexport default function Specials({ promise }) {\n"
      - id: type-specials-use
        type: editor.type
        at: { mark: type-specials-use }
        cadence: fast-explainer
        target:
          {
            file: src/Specials.jsx,
            after: "export default function Specials({ promise }) {\n",
            occurrence: 1,
          }
        text: "  const specials = use(promise);\n"
      - id: type-specials-return
        type: editor.type
        at: { mark: type-specials-return }
        cadence: line-by-line
        target:
          { file: src/Specials.jsx, after: "  const specials = use(promise);\n", occurrence: 1 }
        text: "  return <p data-testid=\"specials\">{specials.join(\"၊ \")}</p>;\n}\n"

  # ------------------------------------------------------------------ 11
  - id: specials-error
    narration: >
      [[mark:open-app-specials]] App ထဲကို special အပိုင်း ထည့်ကြည့်ရအောင်။
      [[mark:wire-specials-imports]] အရင်ဆုံး ရေးပြီးသား error boundary၊ ခုနက
      ရေးခဲ့တဲ့ Specials နဲ့ request လုပ်မယ့် function ကို import လုပ်ပါတယ်။
      [[mark:wire-specials-state]] promise ကို state ထဲမှာ ထားပါမယ်။ အစမှာတော့
      ဘာမှ မရှိပါဘူး။ [[mark:wire-specials-jsx]] ခလုတ် နှိပ်တဲ့အခါ click
      handler က promise ကို ဖန်တီးပြီး state ထဲ သိမ်းလို့၊ request က ခလုတ်
      နှိပ်မှသာ စပါတယ်။ [[mark:select-boundaries]] ဒီ boundary နှစ်ထပ်ကို
      ကြည့်ပါ။ စောင့်တာကို အတွင်းက Suspense က၊ မအောင်မြင်တာကို အပြင်က error
      boundary က ကိုင်ပါတယ်။ [[mark:click-specials]] special ခလုတ်ကို
      နှိပ်ကြည့်ရအောင်။ fallback ပေါ်လာပါပြီ။ [[mark:specials-failed]]
      ခဏနေတော့ promise reject ဖြစ်သွားပါတယ်။ boundary က ဧည့်သည်အတွက် စာသားကို
      ပြပြီး၊ error log ထဲမှာ onCaughtError ကနေ စာကြောင်း တစ်ကြောင်း
      ရောက်လာပါတယ်။ [[mark:after-error]] ကျန်တဲ့ page က ပုံမှန်အတိုင်း
      အလုပ်လုပ်နေပြီး၊ console ထဲမှာလည်း error မရှိပါဘူး။
    sources:
      - title: "React — Component: Catching rendering errors with an Error Boundary"
        url: "https://react.dev/reference/react/Component#catching-rendering-errors-with-an-error-boundary"
      - title: "React — use: Displaying an error with an Error Boundary"
        url: "https://react.dev/reference/react/use#displaying-an-error-with-an-error-boundary"
      - title: "React — createRoot: Parameters"
        url: "https://react.dev/reference/react-dom/client/createRoot#parameters"
    actions:
      - id: open-app-specials
        type: workspace.openFile
        at: { mark: open-app-specials, offsetMs: 400 }
        path: src/App.jsx
      - id: wire-specials-imports
        type: editor.type
        at: { mark: wire-specials-imports }
        cadence: block
        target:
          { file: src/App.jsx, after: "import MenuList from \"./MenuList.jsx\";\n", occurrence: 1 }
        text: "import ErrorBoundary from \"./ErrorBoundary.jsx\";\nimport Specials from \"./Specials.jsx\";\n"
      - id: wire-api-specials
        type: editor.type
        at: { afterAction: wire-specials-imports }
        cadence: block
        target: { file: src/App.jsx, after: "import { fetchMenu", occurrence: 1 }
        text: ", fetchSpecials"
      - id: wire-specials-state
        type: editor.type
        at: { mark: wire-specials-state }
        cadence: block
        target:
          {
            file: src/App.jsx,
            after: "  const [showReviews, setShowReviews] = useState(false);\n",
            occurrence: 1,
          }
        text: "  const [specialsPromise, setSpecialsPromise] = useState(null);\n"
      - id: wire-specials-jsx
        type: editor.type
        at: { mark: wire-specials-jsx }
        cadence: block
        target: { file: src/App.jsx, after: "      <Header />\n", occurrence: 1 }
        text: "      <section className=\"card\">\n        <button data-testid=\"load-specials\" onClick={() => setSpecialsPromise(fetchSpecials())}>\n          ဒီနေ့ special ကြည့်မယ်\n        </button>\n        {specialsPromise && (\n          <ErrorBoundary fallback={<p className=\"badge warn\" data-testid=\"specials-error\">ဒီနေ့ special မရသေးပါ</p>}>\n            <Suspense fallback={<p className=\"muted\" data-testid=\"specials-loading\">special တွေ ယူနေပါတယ်…</p>}>\n              <Specials promise={specialsPromise} />\n            </Suspense>\n          </ErrorBoundary>\n        )}\n      </section>\n"
      - id: select-boundaries
        type: editor.select
        at: { mark: select-boundaries }
        target:
          {
            file: src/App.jsx,
            text: "          <ErrorBoundary fallback={<p className=\"badge warn\" data-testid=\"specials-error\">ဒီနေ့ special မရသေးပါ</p>}>\n            <Suspense fallback={<p className=\"muted\" data-testid=\"specials-loading\">special တွေ ယူနေပါတယ်…</p>}>\n              <Specials promise={specialsPromise} />\n            </Suspense>\n          </ErrorBoundary>\n",
            occurrence: 1,
          }
      - id: expect-specials-button
        type: expect.preview
        at: { mark: click-specials, offsetMs: -700 }
        timeoutMs: 5000
        target: { by: testId, value: load-specials }
        textContains: "special"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: click-specials
        type: preview.click
        at: { mark: click-specials }
        timeoutMs: 5000
        target: { by: testId, value: load-specials }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-specials-loading
        type: expect.preview
        at: { afterAction: click-specials }
        timeoutMs: 5000
        target: { by: testId, value: specials-loading }
        textContains: "ယူနေပါတယ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-specials-error
        type: expect.preview
        at: { mark: specials-failed }
        timeoutMs: 5000
        target: { by: testId, value: specials-error }
        textContains: "မရသေးပါ"
        retry: { maxAttempts: 3, delayMs: 2000 }
      - id: expect-error-log
        type: expect.preview
        at: { afterAction: expect-specials-error }
        timeoutMs: 5000
        target: { by: testId, value: error-log }
        textContains: "ဖမ်းမိတဲ့ error – special စာရင်း မရသေးပါ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-menu-still
        type: expect.preview
        at: { mark: after-error }
        timeoutMs: 5000
        target: { by: testId, value: menu-list }
        textContains: "လက်ဖက်သုပ်"
        retry: { maxAttempts: 3, delayMs: 1500 }

  # ------------------------------------------------------------------ 12
  - id: recap
    narration: >
      [[mark:board-recap]] ဒါပေမဲ့ error boundary မှာ ကန့်သတ်ချက် တစ်ခု
      ရှိပါတယ်။ [[mark:draw-not-caught]] boundary က render နဲ့ effect ထဲက
      error တွေကို ဖမ်းပေမယ့်၊ သာမန် event handler ထဲက error နဲ့ setTimeout
      callback ထဲက error တွေကိုတော့ မဖမ်းပါဘူး။ အဲဒါတွေကို try နဲ့ catch နဲ့
      ကိုယ်တိုင် ဖမ်းရပါမယ်။ special ရဲ့ error လည်း setTimeout ထဲမှာ ဖြစ်တာပါ။
      boundary ဖမ်းနိုင်ခဲ့တာက use က အဲဒီ error ကို render လုပ်နေချိန်မှာ ပြန်
      throw လုပ်ပေးလို့ပါ။ startTransition ထဲက error ကတော့ ခြွင်းချက်ပါ၊
      boundary ဆီ ရောက်ပါတယ်။ [[mark:draw-recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ use နဲ့
      ဖတ်တဲ့ data ဖြစ်ဖြစ်၊ lazy နဲ့ ယူတဲ့ code ဖြစ်ဖြစ်၊ စောင့်နေတုန်း
      Suspense က fallback ကို ပြပေးပါတယ်။ error boundary ကတော့ render
      မအောင်မြင်ရင် fallback ကို ပြပြီး၊ ဖမ်းမိတဲ့ error ကို ဘယ်မှာ report
      လုပ်မလဲ ဆိုတာကိုတော့ root ရဲ့ onCaughtError နဲ့ ဆုံးဖြတ်ပါတယ်။
      [[mark:next-lesson]] နောက် lesson မှာတော့ form ပို့တဲ့အခါ pending နဲ့
      error ကို ကိုင်တွယ်ပေးတဲ့ Action တွေကို ကြည့်သွားပါမယ်။ lesson 12 နဲ့ 13
      မှာတော့ Server Component တွေ run တဲ့အခါ Suspense ကို ပြန်တွေ့ရပါမယ်။
    sources:
      - title: "React — Component: Catching rendering errors with an Error Boundary (caveats)"
        url: "https://react.dev/reference/react/Component#catching-rendering-errors-with-an-error-boundary"
      - title: "React — <Suspense>"
        url: "https://react.dev/reference/react/Suspense"
      - title: "React 19 — Actions"
        url: "https://react.dev/blog/2024/12/05/react-19#actions"
    actions:
      - id: board-recap
        type: whiteboard.apply
        at: { mark: board-recap }
        open: true
        maximized: true
        upsertIds: [b3-title]
      - id: draw-not-caught
        type: whiteboard.apply
        at: { mark: draw-not-caught }
        upsertIds: [b3-not-caught, b3-not-caught-underline]
        drawMs: 1600
      - id: draw-recap
        type: whiteboard.apply
        at: { mark: draw-recap }
        clear: true
        upsertIds: [b4-title, b4-suspense, b4-boundary, b4-report]
        drawMs: 2400
      - id: draw-next
        type: whiteboard.apply
        at: { mark: next-lesson }
        upsertIds: [b4-next, b4-next-underline]
        drawMs: 1000
      - id: expect-api-file
        type: expect.file
        at: { afterAction: draw-next }
        path: src/api.js
        contains: "export function fetchMenu() {\n  if (!cache.has(\"menu\")) {\n    cache.set(\"menu\", delay(4000, menu));\n  }\n  return cache.get(\"menu\");\n}\n"
      - id: expect-specials-api-file
        type: expect.file
        at: { afterAction: expect-api-file }
        path: src/api.js
        contains: "  promise.catch(() => {});\n  return promise;\n"
      - id: expect-menu-list-file
        type: expect.file
        at: { afterAction: expect-specials-api-file }
        path: src/MenuList.jsx
        contains: "  const dishes = use(promise);\n"
      - id: expect-specials-file
        type: expect.file
        at: { afterAction: expect-menu-list-file }
        path: src/Specials.jsx
        contains: "  const specials = use(promise);\n"
      - id: expect-main-file
        type: expect.file
        at: { afterAction: expect-specials-file }
        path: src/main.jsx
        contains: 'createRoot(document.getElementById("root"), { onCaughtError }).render('
      - id: expect-app-imports-file
        type: expect.file
        at: { afterAction: expect-main-file }
        path: src/App.jsx
        contains: "import { Suspense, lazy, useState } from \"react\";\nimport { Header } from \"./Header.jsx\";\nimport { fetchMenu, fetchSpecials } from \"./api.js\";\n"
      - id: expect-app-lazy-file
        type: expect.file
        at: { afterAction: expect-app-imports-file }
        path: src/App.jsx
        contains: "const Reviews = lazy(() => import(\"./Reviews.jsx\"));\n"
      - id: expect-app-boundary-file
        type: expect.file
        at: { afterAction: expect-app-lazy-file }
        path: src/App.jsx
        contains: "          </ErrorBoundary>\n        )}\n      </section>\n"

checks:
  - { type: timing.p95Ms, max: 300 }
