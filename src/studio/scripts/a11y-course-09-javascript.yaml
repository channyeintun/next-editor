build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 2609

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  - id: intro
    chapter: "JavaScript က page ကို ပြောင်းတဲ့အခါ"
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ keyboard focus နဲ့ Tab key ရဲ့ အစဉ်ကို ကြည့်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့
      JavaScript က page ကို ပြောင်းတဲ့အခါ၊ အဲဒီ အပြောင်းအလဲကို လူတိုင်း သိအောင် ဘယ်လို လုပ်မလဲ ဆိုတာ
      ကြည့်ပါမယ်။ [[mark:start-server]] ခလုတ် နှိပ်ရင် စာရင်း ပေါ်လာတာ၊ အော်ဒါ မှာရင် စာ တစ်ကြောင်း
      ပေါ်လာတာ စတာတွေက JavaScript ရဲ့ အလုပ်ပါ။ မျက်စိနဲ့ မြင်ရတဲ့သူက ချက်ချင်း သတိထားမိပေမယ့်၊ screen
      reader သုံးတဲ့သူကတော့ accessibility tree ထဲမှာ ပြောင်းသွားတာကိုပဲ သိနိုင်ပါတယ်။ ဒါကြောင့် page
      ကို ပြောင်းတိုင်း tree ကိုပါ မှန်အောင် ထိန်းပေးရပါမယ်။ [[mark:draw-job1]] ဒီ lesson မှာ အလုပ်
      လေးခုကို ကြည့်ပါမယ်။ ပထမက event တွေကို keyboard နဲ့လည်း သုံးလို့ ရအောင် လုပ်ဖို့ပါ။
      [[mark:draw-job2]] ဒုတိယက ခလုတ်ရဲ့ state ကို မြင်ရတဲ့ အတိုင်း tree ထဲမှာ လိုက်ပြောင်းဖို့ပါ။
      [[mark:draw-job3]] တတိယက ပေါ်လာတဲ့ စာကို screen reader က ဖတ်ပြအောင် live region သုံးဖို့ပါ။
      [[mark:draw-job4]] နောက်ဆုံးကတော့ page title နဲ့ focus ကို ဂရုစိုက်ပြီး၊ သုံးတဲ့သူ ဘယ်ရောက်နေလဲ
      သိနေအောင် လုပ်ဖို့ပါ။
    sources:
      - {
          title: "web.dev Learn Accessibility: JavaScript",
          url: "https://web.dev/learn/accessibility/javascript",
        }
      - {
          title: "MDN: Accessibility tree",
          url: "https://developer.mozilla.org/en-US/docs/Glossary/Accessibility_tree",
        }
    actions:
      - id: open-jobs-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-job1
        type: whiteboard.apply
        at: { mark: draw-job1 }
        upsertIds: [a-job1-box, a-job1-head, a-job1-body]
        drawMs: 1500
      - id: draw-job2
        type: whiteboard.apply
        at: { mark: draw-job2 }
        upsertIds: [a-job2-box, a-job2-head, a-job2-body]
        drawMs: 1500
      - id: draw-job3
        type: whiteboard.apply
        at: { mark: draw-job3 }
        upsertIds: [a-job3-box, a-job3-head, a-job3-body]
        drawMs: 1500
      - id: draw-job4
        type: whiteboard.apply
        at: { mark: draw-job4 }
        upsertIds: [a-job4-box, a-job4-head, a-job4-body]
        drawMs: 1500

  - id: trigger-events
    chapter: "Click event နဲ့ keyboard"
    narration: >
      [[mark:board-events]] event ကနေ စကြည့်ရအောင်။ mouse မသုံးနိုင်တဲ့သူ၊ လက်ကို တိတိကျကျ လှုပ်ရှားရ
      ခက်တဲ့သူ၊ screen reader သုံးတဲ့သူ အများစုက web ကို keyboard နဲ့ သုံးကြပါတယ်။
      [[mark:draw-button-row]] button element ပေါ်မှာ click ကို နားထောင်ထားရင်၊ keyboard ရဲ့ Enter
      ဒါမှမဟုတ် Space နှိပ်တာကိုလည်း browser က click အဖြစ် ပို့ပေးပါတယ်။ link ဆိုရင်လည်း Enter
      နှိပ်တာက click ဖြစ်သွားပါတယ်။ ကိုယ်က ဘာမှ ထပ်ရေးစရာ မလိုပါဘူး။ [[mark:draw-div-row]] ဒါပေမဲ့ div
      ပေါ်မှာ click ထည့်ထားရင်တော့ mouse နဲ့ပဲ အလုပ်လုပ်ပါတယ်။ div ကို မဖြစ်မနေ သုံးရမယ်ဆိုရင် role
      နဲ့ tab index အပြင်၊ Enter နဲ့ Space ကို စစ်တဲ့ key event ကိုပါ ကိုယ်တိုင် ရေးရပါမယ်။ ဒါကို
      မေ့သွားရင် keyboard သုံးတဲ့သူအတွက် အဲဒီ ခလုတ်က လုံးဝ သုံးလို့ မရတော့ပါဘူး။
      [[mark:draw-mouse-row]] mouse တင်မှ ပေါ်လာတဲ့ menu နဲ့ နှစ်ချက် ဆက်နှိပ်မှ အလုပ်လုပ်တဲ့
      ခလုတ်တွေကလည်း mouse သုံးတဲ့သူပဲ သုံးလို့ ရပါတယ်။ ဒါကြောင့် တကယ့် button နဲ့ link ပေါ်မှာ click
      ကို နားထောင်တာက အကောင်းဆုံးပါ။
    sources:
      - {
          title: "web.dev Learn Accessibility: JavaScript — Trigger events",
          url: "https://web.dev/learn/accessibility/javascript#trigger_events",
        }
      - {
          title: "MDN: Element click event",
          url: "https://developer.mozilla.org/en-US/docs/Web/API/Element/click_event",
        }
      - {
          title: "WAI-ARIA APG: Button pattern (keyboard interaction)",
          url: "https://www.w3.org/WAI/ARIA/apg/patterns/button/",
        }
    actions:
      - id: board-events
        type: whiteboard.apply
        at: { mark: board-events }
        clear: true
        upsertIds: [b-title]
      - id: draw-button-row
        type: whiteboard.apply
        at: { mark: draw-button-row }
        upsertIds: [b-button-box, b-button-label, b-button-result]
        drawMs: 1800
      - id: draw-div-row
        type: whiteboard.apply
        at: { mark: draw-div-row }
        upsertIds: [b-div-box, b-div-label, b-div-result]
        drawMs: 1800
      - id: draw-mouse-row
        type: whiteboard.apply
        at: { mark: draw-mouse-row }
        upsertIds: [b-mouse-box, b-mouse-label, b-mouse-result]
        drawMs: 1800

  - id: code-tour
    narration: >
      [[mark:close-events]] ကဲ၊ ဆိုင်ရဲ့ code ကို ကြည့်ရအောင်။ [[mark:open-main]] ဒါက page ကို
      လှုပ်ရှားစေတဲ့ JavaScript ဖိုင်ပါ။ [[mark:select-strength-click]] ပထမ အပိုင်းက အရသာ ရွေးရန်
      ခလုတ်ရဲ့ click ကို နားထောင်ပါတယ်။ တကယ့် button element ဖြစ်လို့ keyboard နဲ့လည်း နှိပ်လို့
      ရပြီးသားပါ။ [[mark:select-hidden-toggle]] နှိပ်လိုက်တိုင်း အရသာ စာရင်းကို ပြလိုက် ဖျောက်လိုက်
      လုပ်ပါတယ်။ စာရင်းက page ထဲမှာ ရှိပြီးသား ဖြစ်ပြီး၊ HTML အသစ် ထုတ်မပေးဘဲ hidden ကိုပဲ ပြောင်းတာက
      ကောင်းတဲ့ အလေ့အကျင့်ပါ။ [[mark:select-order-text]] ဒုတိယ အပိုင်းကတော့ မှာမယ် ခလုတ်ကို နှိပ်ရင်၊
      ခလုတ်အောက်က စာပိုဒ်ထဲကို မှာပြီးပါပြီ ဆိုတဲ့ စာ ထည့်ပေးပါတယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: JavaScript — Dynamic content",
          url: "https://web.dev/learn/accessibility/javascript#dynamic_content",
        }
      - {
          title: "MDN: HTMLElement hidden property",
          url: "https://developer.mozilla.org/en-US/docs/Web/API/HTMLElement/hidden",
        }
    actions:
      - id: close-events
        type: whiteboard.apply
        at: { mark: close-events }
        open: false
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: main.js
      - id: select-strength-click
        type: editor.select
        at: { mark: select-strength-click }
        target: { file: main.js, text: 'strengthButton.addEventListener("click"', occurrence: 1 }
      - id: select-hidden-toggle
        type: editor.select
        at: { mark: select-hidden-toggle }
        target: { file: main.js, text: "strengthList.hidden = !willOpen;", occurrence: 1 }
      - id: select-order-text
        type: editor.select
        at: { mark: select-order-text }
        target: { file: main.js, text: 'orderStatus.textContent = "မှာပြီးပါပြီ";', occurrence: 1 }

  - id: first-look
    narration: >
      [[mark:preview-ready]] ညာဘက်မှာ ဆိုင်ရဲ့ page ကို မြင်ရပါပြီ။ မျက်စိနဲ့ ကြည့်ရင်တော့ ပြဿနာ
      မရှိသလိုပါပဲ။ accessibility panel မှာ ဒီတစ်ခါ အပေါ်က tree နဲ့ အောက်က live region အပိုင်း
      ပါပါတယ်။ live region အပိုင်းက screen reader က အလိုလို ဖတ်ပြမယ့် စာတွေကို ရိုးရှင်းအောင်
      ပြထားတာပါ။ [[mark:look-strength-row]] tree ထဲမှာ အရသာ ရွေးရန် ခလုတ်ကို role က button၊ name က
      အရသာ ရွေးရန် ဆိုပြီး မြင်ရပါတယ်။ ဒါပေမဲ့ စာရင်း ပွင့်နေလား ပိတ်နေလား ဆိုတဲ့ state မပါလို့၊
      screen reader သုံးတဲ့သူက နှိပ်ရင် တစ်ခုခု ပွင့်မယ် ဆိုတာ ကြိုမသိနိုင်ပါဘူး။
    sources:
      - {
          title: "web.dev Learn Accessibility: ARIA and HTML — the accessibility tree",
          url: "https://web.dev/learn/accessibility/aria-html",
        }
      - {
          title: "web.dev Learn Accessibility: JavaScript — State management",
          url: "https://web.dev/learn/accessibility/javascript#state_management",
        }
    actions:
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { mark: preview-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-dev-server }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-document-title
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: a11y-document }
        attribute: { name: data-title, value: "ရွှေလက်ဖက်ရည်ဆိုင်" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-strength-no-state
        type: expect.preview
        at: { mark: look-strength-row }
        timeoutMs: 5000
        target: { by: testId, value: a11y-strength-button }
        attribute: { name: data-states, value: "" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-strength-name
        type: expect.preview
        at: { afterAction: expect-strength-no-state }
        timeoutMs: 5000
        target: { by: testId, value: a11y-strength-button }
        attribute: { name: data-name, value: "အရသာ ရွေးရန်" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: expanded-attribute
    chapter: "ခလုတ်ရဲ့ state ကို tree ထဲ ပြရအောင်"
    narration: >
      [[mark:open-index]] HTML ဖိုင်ကို ဖွင့်ပြီး ခလုတ်ကို ပြင်ကြည့်ရအောင်။ [[mark:type-expanded]]
      ခလုတ်မှာ aria expanded ကို false နဲ့ ထည့်ပါမယ်။ ဒီ ခလုတ်က တစ်ခုခုကို အဖွင့် အပိတ် လုပ်တဲ့
      ခလုတ်ဖြစ်ပြီး၊ အခု ပိတ်ထားတယ် လို့ ပြောလိုက်တာပါ။ [[mark:after-expanded]] tree ကို ကြည့်ပါ၊
      ခလုတ်ရဲ့ နာမည် နောက်မှာ collapsed ပေါ်လာပါပြီ။ screen reader က အရသာ ရွေးရန်၊ button၊ collapsed
      လို့ ဖတ်ပြမှာပါ။ [[mark:click-strength-1]] ခလုတ်ကို နှိပ်ကြည့်ရအောင်။ [[mark:after-click-1]]
      အရသာ စာရင်း ပေါ်လာပါပြီ။ ဒါပေမဲ့ tree မှာတော့ collapsed ပဲ ကျန်နေပါတယ်။ မျက်စိနဲ့ မြင်ရတာက
      ပွင့်နေပေမယ့်၊ screen reader ကတော့ ပိတ်နေတယ် လို့ ပြောနေတာပါ။ HTML ထဲက attribute က သူ့ဘာသာ
      မပြောင်းလို့၊ state ပြောင်းတိုင်း JavaScript က လိုက်ပြောင်းပေးရပါမယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: JavaScript — State management",
          url: "https://web.dev/learn/accessibility/javascript#state_management",
        }
      - {
          title: "MDN: aria-expanded",
          url: "https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Attributes/aria-expanded",
        }
      - {
          title: "WAI-ARIA APG: Disclosure (Show/Hide) pattern",
          url: "https://www.w3.org/WAI/ARIA/apg/patterns/disclosure/",
        }
    actions:
      - id: open-index
        type: workspace.openFile
        at: { mark: open-index }
        path: index.html
      - id: type-expanded
        type: editor.type
        at: { mark: type-expanded }
        cadence: block
        target:
          {
            file: index.html,
            after: '<button class="disclosure" id="strength-button" type="button"',
            occurrence: 1,
          }
        text: ' aria-expanded="false"'
      - id: expect-collapsed
        type: expect.preview
        at: { mark: after-expanded }
        timeoutMs: 5000
        target: { by: testId, value: a11y-strength-button }
        textContains: '"အရသာ ရွေးရန်" collapsed'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: click-strength-1
        type: preview.click
        at: { mark: click-strength-1 }
        timeoutMs: 5000
        target: { by: testId, value: strength-button }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-list-shown-1
        type: expect.preview
        at: { mark: after-click-1 }
        timeoutMs: 5000
        target: { by: testId, value: a11y-strength-list }
        textContains: "list"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-still-collapsed
        type: expect.preview
        at: { afterAction: expect-list-shown-1 }
        timeoutMs: 5000
        target: { by: testId, value: a11y-strength-button }
        attribute: { name: data-states, value: "collapsed focused" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: expanded-script
    narration: >
      [[mark:open-main-2]] JavaScript ဖိုင်ကို ပြန်သွားရအောင်။ [[mark:type-set-expanded]] စာရင်းကို ပြ
      ဖျောက် လုပ်တဲ့ စာကြောင်းရဲ့ အောက်မှာ၊ aria expanded ကို စာရင်းနဲ့ အတူတူ ပြောင်းပေးတဲ့ စာကြောင်း
      ထည့်ပါမယ်။ စာရင်း ပွင့်ရင် true၊ ပိတ်ရင် false ဖြစ်မှာပါ။ [[mark:click-strength-2]] ခလုတ်ကို
      ထပ်နှိပ်ကြည့်ရအောင်။ [[mark:after-click-2]] ဒီတစ်ခါတော့ စာရင်း ပေါ်လာတာနဲ့ အတူ tree ထဲမှာလည်း
      expanded ဖြစ်သွားပါပြီ။ ခလုတ်ပေါ်မှာ focus ရှိနေလို့ သူ့ row ကို အပြာရောင်နဲ့ ပြထားတာကိုလည်း
      သတိထား ကြည့်ပါ။ [[mark:explain-states]] ဒီလိုပဲ ခလုတ်ကို ဖိထားလား မဖိထားလား ပြတဲ့ aria pressed၊
      tab အုပ်စုထဲမှာ ဘယ် tab ကို ရွေးထားလဲ ပြတဲ့ aria selected၊ menu ထဲမှာ အခု ရောက်နေတဲ့ page ကို
      ပြတဲ့ aria current စတာတွေ ရှိပါသေးတယ်။ ဘယ်ဟာကို သုံးသုံး၊ မြင်ရတဲ့ အခြေအနေ ပြောင်းတဲ့ code
      နေရာမှာ ARIA ကိုပါ တစ်ခါတည်း လိုက်ပြောင်းရပါမယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: JavaScript — State management",
          url: "https://web.dev/learn/accessibility/javascript#state_management",
        }
      - {
          title: "MDN: Element.setAttribute()",
          url: "https://developer.mozilla.org/en-US/docs/Web/API/Element/setAttribute",
        }
      - {
          title: "MDN: ARIA states and properties",
          url: "https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Attributes",
        }
    actions:
      - id: open-main-2
        type: workspace.openFile
        at: { mark: open-main-2 }
        path: main.js
      - id: type-set-expanded
        type: editor.type
        at: { mark: type-set-expanded }
        cadence: block
        target: { file: main.js, after: "strengthList.hidden = !willOpen;", occurrence: 1 }
        text: "\n  strengthButton.setAttribute(\"aria-expanded\", String(willOpen));"
      - id: expect-collapsed-again
        type: expect.preview
        at: { mark: click-strength-2, offsetMs: -700 }
        timeoutMs: 5000
        target: { by: testId, value: a11y-strength-button }
        attribute: { name: data-states, value: "collapsed" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: click-strength-2
        type: preview.click
        at: { mark: click-strength-2 }
        timeoutMs: 5000
        target: { by: testId, value: strength-button }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-expanded
        type: expect.preview
        at: { mark: after-click-2 }
        timeoutMs: 5000
        target: { by: testId, value: a11y-strength-button }
        textContains: '"အရသာ ရွေးရန်" expanded'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-expanded-focused
        type: expect.preview
        at: { afterAction: expect-expanded }
        timeoutMs: 5000
        target: { by: testId, value: a11y-strength-button }
        attribute: { name: data-states, value: "expanded focused" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: live-problem
    chapter: "ပေါ်လာတဲ့ စာကို ဖတ်ပြအောင်"
    narration: >
      [[mark:click-order-1]] အခု မှာမယ် ခလုတ်ကို နှိပ်ကြည့်ရအောင်။ [[mark:after-order-1]]
      ခလုတ်အောက်မှာ မှာပြီးပါပြီ ဆိုတဲ့ စာ ပေါ်လာပေမယ့်၊ live region အပိုင်းမှာ ဘာမှ မရှိပါဘူး။ screen
      reader သုံးတဲ့သူက ခလုတ်ပေါ်မှာပဲ ရှိနေလို့ စာ ပေါ်လာမှန်း မသိပါဘူး။ အော်ဒါ ရောက်မရောက်
      မသေချာလို့ ထပ်နှိပ်မိရင် နှစ်ခါ မှာမိသွားနိုင်ပါတယ်။ [[mark:board-live]] ဒီလို နေရာမှာ live
      region ကို သုံးပါတယ်။ live region ဆိုတာ စာသား ပြောင်းတာနဲ့ screen reader က အလိုလို ဖတ်ပြမယ့်
      နေရာပါ။ [[mark:draw-live-ok]] အရေးကြီးတဲ့ စည်းကမ်းက၊ region က page ထဲမှာ အရင် ရှိနေပြီးမှ သူ့ထဲက
      စာကို ပြောင်းရမယ် ဆိုတာပါ။ [[mark:draw-live-bad]] region နဲ့ စာကို တစ်ပြိုင်တည်း
      ထည့်လိုက်ရင်တော့ screen reader က မဖတ်ပြတာ များပါတယ်။ [[mark:draw-live-levels]] role status
      ဒါမှမဟုတ် aria live polite က လက်ရှိ ဖတ်နေတာ ပြီးမှ ဖတ်ပြပြီး၊ role alert ဒါမှမဟုတ် aria live
      assertive ကတော့ ဖြတ်ပြီး ချက်ချင်း ဖတ်ပါတယ်။ ဒါကြောင့် alert ကို အရေးကြီးတဲ့ သတိပေးချက်အတွက်ပဲ
      သုံးပြီး၊ စာကိုလည်း တိုတို ရှင်းရှင်း ရေးပါ။
    sources:
      - {
          title: "web.dev Learn Accessibility: JavaScript — State management (page level)",
          url: "https://web.dev/learn/accessibility/javascript#page_level_2",
        }
      - {
          title: "MDN: ARIA live regions",
          url: "https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Guides/Live_regions",
        }
      - {
          title: "MDN: ARIA status role",
          url: "https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/status_role",
        }
      - {
          title: "MDN: ARIA alert role",
          url: "https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/alert_role",
        }
    actions:
      - id: click-order-1
        type: preview.click
        at: { mark: click-order-1 }
        timeoutMs: 5000
        target: { by: testId, value: order-button }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-status-text-1
        type: expect.preview
        at: { mark: after-order-1 }
        timeoutMs: 5000
        target: { by: testId, value: order-status }
        textContains: "မှာပြီးပါပြီ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-nothing-announced
        type: expect.preview
        at: { afterAction: expect-status-text-1 }
        timeoutMs: 5000
        target: { by: testId, value: live-count }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: board-live
        type: whiteboard.apply
        at: { mark: board-live }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-live-ok
        type: whiteboard.apply
        at: { mark: draw-live-ok }
        upsertIds: [c-ok-box, c-ok-label, c-ok-result]
        drawMs: 1800
      - id: draw-live-bad
        type: whiteboard.apply
        at: { mark: draw-live-bad }
        upsertIds: [c-bad-box, c-bad-label, c-bad-result]
        drawMs: 1800
      - id: draw-live-levels
        type: whiteboard.apply
        at: { mark: draw-live-levels }
        upsertIds: [c-polite, c-assertive]
        drawMs: 1600

  - id: live-fix
    narration: >
      [[mark:close-live]] ကိုယ့် page မှာတော့ အော်ဒါ စာ ထည့်မယ့် စာပိုဒ်က အလွတ်နဲ့ ရှိနေပြီးသားပါ။
      [[mark:open-index-2]] ဒါကြောင့် HTML ထဲက အဲဒီ စာပိုဒ်ကို live region ဖြစ်အောင် လုပ်ရုံပါပဲ။
      [[mark:type-status]] role status ကို ထည့်ပါမယ်။ JavaScript ကိုတော့ ပြင်စရာ မလိုပါဘူး။
      [[mark:click-order-2]] မှာမယ် ကို ထပ်နှိပ်ကြည့်ရအောင်။ [[mark:after-order-2]] live region
      အပိုင်းမှာ polite နဲ့ မှာပြီးပါပြီ ဆိုတာ ပေါ်လာပါပြီ။ screen reader က လက်ရှိ ဖတ်နေတာ ပြီးတာနဲ့
      မှာပြီးပါပြီ လို့ ဖတ်ပြမှာပါ။ ဒီ panel က ရိုးရှင်းအောင် ပြထားတာမို့၊ ကိုယ့် ကွန်ပျူတာက screen
      reader နဲ့လည်း စမ်းကြည့်ပါ။
    sources:
      - {
          title: "web.dev Learn Accessibility: JavaScript — State management (page level)",
          url: "https://web.dev/learn/accessibility/javascript#page_level_2",
        }
      - {
          title: "MDN: ARIA status role",
          url: "https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/status_role",
        }
      - {
          title: "WCAG 2.2 Understanding: Status Messages",
          url: "https://www.w3.org/WAI/WCAG22/Understanding/status-messages.html",
        }
    actions:
      - id: close-live
        type: whiteboard.apply
        at: { mark: close-live }
        open: false
      - id: open-index-2
        type: workspace.openFile
        at: { mark: open-index-2 }
        path: index.html
      - id: type-status
        type: editor.type
        at: { mark: type-status }
        cadence: block
        target:
          { file: index.html, after: '<p class="order-status" id="order-status"', occurrence: 1 }
        text: ' role="status"'
      - id: expect-status-role
        type: expect.preview
        at: { mark: click-order-2, offsetMs: -700 }
        timeoutMs: 5000
        target: { by: testId, value: a11y-order-status }
        textContains: "status"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: click-order-2
        type: preview.click
        at: { mark: click-order-2 }
        timeoutMs: 5000
        target: { by: testId, value: order-button }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-announced
        type: expect.preview
        at: { mark: after-order-2 }
        timeoutMs: 5000
        target: { by: testId, value: live-1 }
        textContains: 'polite "မှာပြီးပါပြီ"'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-one-announcement
        type: expect.preview
        at: { afterAction: expect-announced }
        timeoutMs: 5000
        target: { by: testId, value: live-count }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: page-title
    chapter: "View ပြောင်းရင် title လည်း ပြောင်းရအောင်"
    narration: >
      [[mark:look-document]] ဒါပေမဲ့ panel ရဲ့ အပေါ်ဆုံးက document row ကို ကြည့်ပါ။ အော်ဒါ
      မှာပြီးပေမယ့် page title က ရွှေလက်ဖက်ရည်ဆိုင် အတိုင်းပဲ ရှိနေပါတယ်။ page title က screen reader
      ပထမဆုံး ဖတ်ပြတဲ့ စာဖြစ်ပြီး၊ ဘယ် page ရောက်နေလဲ ဆိုတာ ပြောပြပါတယ်။ [[mark:explain-spa]] single
      page app မှာ JavaScript က HTML ဖိုင် တစ်ခုတည်းထဲမှာပဲ view ကို လဲပေးတာ ဖြစ်လို့၊ title က သူ့ဘာသာ
      မပြောင်းပါဘူး။ [[mark:open-main-3]] ဒါကြောင့် view ပြောင်းတဲ့ နေရာမှာ title ကို ကိုယ်တိုင်
      ပြောင်းပေးရပါမယ်။ [[mark:type-title]] ကိုယ့် page မှာတော့ အော်ဒါ မှာပြီးသွားတာကို view အသစ်
      တစ်ခုလို သဘောထားပြီး၊ အော်ဒါ စာ ထည့်တဲ့ စာကြောင်းရဲ့ အောက်မှာ document title ကို ပြောင်းပါမယ်။
      ဒီ view အတွက် အပိုင်းက ရှေ့မှာ၊ ဆိုင် နာမည်က နောက်မှာ ရှိပါတယ်။ [[mark:click-order-3]] မှာမယ်
      ကို နှိပ်ကြည့်ရအောင်။ [[mark:after-order-3]] document row ရဲ့ title က မှာပြီးပါပြီ၊
      ရွှေလက်ဖက်ရည်ဆိုင် ဆိုပြီး ပြောင်းသွားပါပြီ။ browser tab မှာလည်း ဒီ နာမည် ပေါ်မှာပါ။ ဒါပေမဲ့
      title ပြောင်းရုံနဲ့ screen reader က ချက်ချင်း ဖတ်ပြမယ်လို့ အာမခံ မရလို့၊ live region ဒါမှမဟုတ်
      focus ရွှေ့တဲ့ နည်းနဲ့ တွဲသုံးရပါတယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: JavaScript — Page titles",
          url: "https://web.dev/learn/accessibility/javascript#page_titles",
        }
      - {
          title: "MDN: Document.title",
          url: "https://developer.mozilla.org/en-US/docs/Web/API/Document/title",
        }
      - {
          title: "MDN: SPA (Single-page application)",
          url: "https://developer.mozilla.org/en-US/docs/Glossary/SPA",
        }
      - {
          title: "Hidde de Vries: Accessible page titles in a single page app",
          url: "https://hidde.blog/accessible-page-titles-in-a-single-page-app/",
        }
    actions:
      - id: expect-title-unchanged
        type: expect.preview
        at: { mark: look-document }
        timeoutMs: 5000
        target: { by: testId, value: a11y-document }
        attribute: { name: data-title, value: "ရွှေလက်ဖက်ရည်ဆိုင်" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: open-main-3
        type: workspace.openFile
        at: { mark: open-main-3 }
        path: main.js
      - id: type-title
        type: editor.type
        at: { mark: type-title }
        cadence: block
        target: { file: main.js, after: 'orderStatus.textContent = "မှာပြီးပါပြီ";', occurrence: 1 }
        text: "\n  document.title = \"မှာပြီးပါပြီ · ရွှေလက်ဖက်ရည်ဆိုင်\";"
      - id: expect-reloaded-before-order-3
        type: expect.preview
        at: { mark: click-order-3, offsetMs: -700 }
        timeoutMs: 5000
        target: { by: testId, value: a11y-order-status }
        textContains: "status"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: click-order-3
        type: preview.click
        at: { mark: click-order-3 }
        timeoutMs: 5000
        target: { by: testId, value: order-button }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-title-changed
        type: expect.preview
        at: { mark: after-order-3 }
        timeoutMs: 5000
        target: { by: testId, value: a11y-document }
        attribute: { name: data-title, value: "မှာပြီးပါပြီ · ရွှေလက်ဖက်ရည်ဆိုင်" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-announced-again
        type: expect.preview
        at: { afterAction: expect-title-changed }
        timeoutMs: 5000
        target: { by: testId, value: live-1 }
        textContains: 'polite "မှာပြီးပါပြီ"'
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: focus
    chapter: "Focus ကို ဘယ်ပို့မလဲ"
    narration: >
      [[mark:look-focus]] နောက်ဆုံး အလုပ်က focus ပါ။ panel ကို ကြည့်ပါ။ မှာမယ် ခလုတ်ကို နှိပ်ပြီးတဲ့
      နောက်မှာလည်း ခလုတ်က နေရာမှာ ရှိနေဆဲ ဖြစ်လို့၊ သူ့ row က focus ရှိနေတုန်းပါ။ [[mark:board-focus]]
      keyboard သုံးတဲ့သူအတွက် focus ဆိုတာ page ပေါ်မှာ ကိုယ် ရောက်နေတဲ့ နေရာပါ။ JavaScript က page ကို ပြောင်းတဲ့အခါ အဲဒီ နေရာ ပျောက်မသွားအောင် ကိုယ်က
      ဆုံးဖြတ်ပေးရပါတယ်။ [[mark:draw-component]] component အဆင့်မှာဆိုရင်၊ dialog ဖွင့်တာနဲ့ focus ကို
      အထဲ ရွှေ့ပေးရပြီး၊ ဖွင့်ထားတုန်း Tab key က dialog ထဲမှာပဲ လှည့်နေရပါမယ်။ ပိတ်လိုက်ရင်တော့ focus
      ကို ဖွင့်ခဲ့တဲ့ ခလုတ်ဆီ ပြန်ပို့ပေးရပါမယ်။ [[mark:draw-page]] page အဆင့်မှာတော့ view အသစ်
      ပြောင်းတဲ့အခါ focus ကို ခေါင်းစဉ် ဒါမှမဟုတ် main အပိုင်းဆီ ရွှေ့ပေးတာ များပါတယ်။ ဘယ်နည်း ရွေးမလဲ
      ဆိုတာ ကိုယ့် app ပေါ် မူတည်ပါတယ်။ [[mark:draw-trap]] dialog က Tab ကို အထဲမှာ ထိန်းထားပေမယ့်၊
      Escape ဒါမှမဟုတ် ပိတ်တဲ့ ခလုတ်နဲ့ အမြဲ ပြန်ထွက်လို့ ရရပါမယ်။ ထွက်လမ်း မရှိဘဲ focus ပိတ်မိနေတဲ့
      keyboard trap ကိုတော့ ဘယ်တော့မှ မဖြစ်စေရပါဘူး။ [[mark:draw-stay]] ကိုယ့် ဆိုင်ရဲ့ မှာမယ် ခလုတ်ကတော့
      ခုနက မြင်ခဲ့သလို နှိပ်ပြီးတဲ့ နောက်မှာလည်း နေရာမှာ ရှိနေလို့၊ focus ပျောက်မသွားပါဘူး။
      [[mark:close-focus]] ဒါကြောင့် focus ကို မရွှေ့ဘဲ live region နဲ့ ပြောပြတာ မှန်ပါတယ်။ ခလုတ်
      ပျောက်သွားခဲ့ရင်တော့ focus က page ရဲ့ body ဆီ ပြန်ကျသွားလို့၊ JavaScript နဲ့ သင့်တော်တဲ့ နေရာဆီ
      ရွှေ့ပေးရပါမယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: JavaScript — Focus management",
          url: "https://web.dev/learn/accessibility/javascript#focus_management",
        }
      - {
          title: "WAI-ARIA APG: Dialog (Modal) pattern",
          url: "https://www.w3.org/WAI/ARIA/apg/patterns/dialog-modal/",
        }
      - {
          title: "WCAG 2.2 Understanding: No Keyboard Trap",
          url: "https://www.w3.org/WAI/WCAG22/Understanding/no-keyboard-trap.html",
        }
      - {
          title: "HTML Standard: focus fixup rule",
          url: "https://html.spec.whatwg.org/multipage/interaction.html#focus-fixup-rule",
        }
    actions:
      - id: expect-order-focused
        type: expect.preview
        at: { mark: look-focus }
        timeoutMs: 5000
        target: { by: testId, value: a11y-order-button }
        attribute: { name: data-states, value: "focused" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: board-focus
        type: whiteboard.apply
        at: { mark: board-focus }
        open: true
        clear: true
        upsertIds: [d-title]
      - id: draw-component
        type: whiteboard.apply
        at: { mark: draw-component }
        upsertIds: [d-comp-box, d-comp-head, d-comp-body]
        drawMs: 2200
      - id: draw-page
        type: whiteboard.apply
        at: { mark: draw-page }
        upsertIds: [d-page-box, d-page-head, d-page-body]
        drawMs: 2000
      - id: draw-trap
        type: whiteboard.apply
        at: { mark: draw-trap }
        upsertIds: [d-trap]
        drawMs: 1400
      - id: draw-stay
        type: whiteboard.apply
        at: { mark: draw-stay }
        upsertIds: [d-stay]
        drawMs: 1400
      - id: close-focus
        type: whiteboard.apply
        at: { mark: close-focus }
        open: false

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ JavaScript က page ကို ပြောင်းတိုင်း၊ မျက်စိနဲ့ မမြင်ရတဲ့သူလည်း
      အဲဒီ အပြောင်းအလဲကို သိရပါမယ်။ [[mark:recap-events]] တကယ့် button နဲ့ link ပေါ်မှာ click ကို
      နားထောင်ရင် keyboard နဲ့လည်း အလုပ်လုပ်ပါတယ်။ [[mark:recap-state]] ခလုတ်ရဲ့ အခြေအနေ
      ပြောင်းတဲ့ နေရာမှာ aria expanded လို state ကို တစ်ခါတည်း လိုက်ပြောင်းပေးပါ။
      [[mark:recap-live]] ရုတ်တရက် ပေါ်လာတဲ့ စာကိုတော့ page ထဲမှာ ကြိုရှိနေတဲ့ live region ထဲ
      ထည့်ပေးပါ။ [[mark:recap-title]] view ပြောင်းရင် page title ကို ပြောင်းပေးပြီး၊ focus ဘယ်ကို
      သွားမလဲ ဆိုတာကိုလည်း ဆုံးဖြတ်ပေးပါ။ နောက် lesson မှာတော့ ပုံတွေနဲ့ alt text အကြောင်း
      ကြည့်သွားပါမယ်။ ပုံ တစ်ပုံကို မမြင်ရတဲ့သူအတွက် ဘာ စာ ရေးပေးရမလဲ ဆိုတာ၊ ပုံရဲ့
      ရည်ရွယ်ချက်ပေါ် မူတည်ပုံကို ကြည့်ပါမယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: JavaScript",
          url: "https://web.dev/learn/accessibility/javascript",
        }
      - {
          title: "web.dev Learn Accessibility: Images",
          url: "https://web.dev/learn/accessibility/images",
        }
    actions:
      - id: recap-events
        type: editor.select
        at: { mark: recap-events }
        target: { file: main.js, text: 'strengthButton.addEventListener("click"', occurrence: 1 }
      - id: recap-state
        type: editor.select
        at: { mark: recap-state }
        target:
          {
            file: main.js,
            text: 'strengthButton.setAttribute("aria-expanded", String(willOpen));',
            occurrence: 1,
          }
      - id: recap-live
        type: editor.select
        at: { mark: recap-live }
        target: { file: main.js, text: 'orderStatus.textContent = "မှာပြီးပါပြီ";', occurrence: 1 }
      - id: recap-title
        type: editor.select
        at: { mark: recap-title }
        target: { file: main.js, text: 'document.title = "မှာပြီးပါပြီ · ရွှေလက်ဖက်ရည်ဆိုင်";', occurrence: 1 }
      - id: expect-file-expanded-js
        type: expect.file
        at: { afterAction: recap-title }
        path: main.js
        contains: 'strengthButton.setAttribute("aria-expanded", String(willOpen));'
      - id: expect-file-title-js
        type: expect.file
        at: { afterAction: expect-file-expanded-js }
        path: main.js
        contains: 'document.title = "မှာပြီးပါပြီ · ရွှေလက်ဖက်ရည်ဆိုင်";'
      - id: expect-file-expanded-html
        type: expect.file
