  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ နေခြည် ရဲ့ finance team က လစဉ် ဝင်ငွေ report ကို AI နဲ့
      ရေးခိုင်းချင်တယ်လို့ ပြောလာတယ် ဆိုပါစို့။ FDE အနေနဲ့ ဘယ်မေးခွန်းကို အရင် မေးသင့်မလဲ။
      [[mark:q-a]] ပထမ မေးခွန်းက ဒီအလုပ်အတွက် ဘယ် model က အတော်ဆုံးလဲ ဆိုတာပါ။
      [[mark:q-b]] ဒုတိယ မေးခွန်းက report ထဲက ဂဏန်းတွေကို ဘယ်ကနေ ယူမလဲ၊ ထွက်လာတဲ့ ဂဏန်းကို ဘယ်သူက တိုက်စစ်မလဲ
      ဆိုတာပါ။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ မေးခွန်းပါ။ ဘာကြောင့်လဲဆိုတော့ နေခြည် ရဲ့ ဝင်ငွေ ဂဏန်းတွေကို ဘယ် model
      ကမှ ကြိုသိထားတာ မဟုတ်လို့ပါ။ Billing system ထဲက data ကို မမြင်ရဘဲ ရေးခိုင်းရင်၊ ဖတ်လို့ကောင်းပေမဲ့ ဂဏန်း
      မှားနေတဲ့ report တစ်စောင် ထွက်လာနိုင်ပါတယ်။ finance report မှာ ဂဏန်း တစ်လုံး မှားတာက စာသား မချောတာထက်
      အများကြီး ပိုဆိုးပါတယ်။ ဘယ် model ကို သုံးမလဲ ဆိုတာကတော့ အဲဒီနောက်မှ စဉ်းစားရမယ့် ကိစ္စပါ။
      [[mark:q-rule]] ဒါကြောင့် AI ကို အလုပ် တစ်ခုထဲ ထည့်တော့မယ် ဆိုတိုင်း မေးခွန်း နှစ်ခုကို အရင် မေးပါ။ model က
      ဘာကို မြင်ရမလဲ၊ ရလဒ်ကို ဘယ်သူ စစ်မလဲ ဆိုတာပါ။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: q-rule, offsetMs: 2500 },
          upsertIds: [q-t1, q-t2],
          drawMs: 1600,
        }

  - id: your-turn
    chapter: ကိုယ့် team အတွက်
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ဒီ ခေါင်းစဉ် လေးခုအောက်မှာ ကိုယ့် team အတွက်
      တစ်ကြောင်းစီ ရေးကြည့်ပါ။ နေခြည် အတွက် ရေးထားတာတွေကို ဖျက်ပြီး ကိုယ့် team ရဲ့ လက်ရှိ အခြေအနေနဲ့
      အစားထိုးလိုက်ပါ။
      [[mark:turn-2]] ကိုယ့် team မှာ AI ကို မသုံးသေးဘူး ဆိုရင်လည်း ရပါတယ်။ သုံးတော့မယ် ဆိုရင် ဒီ မေးခွန်း
      လေးခုကို ဘယ်လို ဖြေမလဲ ဆိုတာကို ရေးကြည့်ပါ။ မသိသေးတဲ့ ခေါင်းစဉ်အောက်မှာတော့ မသိသေးဘူးလို့ပဲ ရေးထားပါ။
      FDE တစ်ယောက်အတွက် အဲဒီ ကွက်လပ်တွေက အလုပ် စရမယ့် နေရာတွေ ဖြစ်ပါတယ်။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: turn }, open: false }
      - id: sel-headings
        type: editor.select
        at: { mark: turn, offsetMs: 2200 }
        target:
          file: notebook/01-ai-at-naychi.md
          text: "## ဘယ်သူတွေ သုံးနေလဲ\n- support agent တချို့၊ personal account နဲ့။ ဘယ်နှယောက်လဲ မသိ\n\n## AI က ဘာကို မြင်နိုင်လဲ\n- ကူးထည့်ပေးတဲ့ ticket စာသားပဲ။ NMS၊ Billing၊ Knowledge base မမြင်ရ\n\n## မပို့ခင် ဘယ်သူ စစ်လဲ\n- စည်းကမ်း မရှိ။ support agent တစ်ယောက်ချင်းအပေါ် မူတည်\n\n## အကျိုးကို ဘယ်လို တိုင်းလဲ"

  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ မုန်တိုင်းကျတဲ့ညက နေခြည် မှာ model လည်း မပျက်ခဲ့သလို၊ လူတွေလည်း
      မပေါ့ဆခဲ့ပါဘူး။ model က ဘာကို မြင်ရမလဲ၊ ရလဒ်ကို ဘယ်သူ စစ်မလဲ၊ အကျိုးကို ဘယ်လို တိုင်းမလဲ ဆိုတာကို
      ဘယ်သူမှ design မဆွဲခဲ့တာပါ။
      [[mark:recap-2]] forward deployed engineer ဆိုတာ customer ရဲ့ အဖွဲ့ထဲ ဝင်ပြီး အဲဒီ design ကို ဆွဲပေးသူပါ။
      model ကို နားလည်တာ၊ system တွေထဲ တည်ဆောက်တာနဲ့ လူတွေဆီ ဖြန့်ကျက်တာ ဆိုတဲ့ အလုပ် သုံးမျိုးကို
      လုပ်ရပါတယ်။
      [[mark:next]] နောက် lesson မှာတော့ support manager လှလှ မေးတဲ့ မေးခွန်း တစ်ခုကနေ စပါမယ်။ AI ဆိုတာ search
      engine လိုမျိုးလား၊ အဖြေတွေ သိမ်းထားတဲ့ စက်လား ဆိုတာပါ။ AI လို့ ပြောတဲ့အခါ တကယ်တော့ ဘာကို ပြောနေတာလဲ
      ဆိုတာကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
