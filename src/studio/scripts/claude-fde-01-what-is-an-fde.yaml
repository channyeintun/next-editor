build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 9301

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: welcome
    chapter: မုန်တိုင်းကျတဲ့ည
    narration: >
      မင်္ဂလာပါ ခင်ဗျာ။ Claude FDE course ကို ကြိုဆိုပါတယ်။ ဒီ course က Claude ကို ကုမ္ပဏီ တစ်ခုရဲ့ တကယ့်
      အလုပ်ထဲမှာ အသုံးဝင်အောင် တပ်ဆင်ပေးချင်တဲ့ developer တွေအတွက် ရည်ရွယ်ပါတယ်။ အဲဒီလို အလုပ်မျိုး
      လုပ်တဲ့သူကို forward deployed engineer၊ အတိုကောက် FDE လို့ ခေါ်ပါတယ်။
      [[mark:path]] course ရဲ့ အကြောင်းအရာ အစီအစဉ်ကိုတော့ Anthropic ရဲ့ Claude Forward Deployed Engineer
      learning path ကို လိုက်ပြီး စီထားပါတယ်။ ဒါပေမဲ့ Anthropic ရဲ့ တရားဝင် course မဟုတ်ဘဲ၊ ရှင်းပြချက်နဲ့
      ဥပမာ အားလုံးကို သီးခြား ပြင်ဆင်ထားတာ ဖြစ်ပါတယ်။
      [[mark:company]] course တစ်လျှောက်လုံးမှာ ကုမ္ပဏီ တစ်ခုရဲ့ ဇာတ်လမ်းနဲ့ တွဲပြီး လေ့လာသွားမှာပါ။ အဲဒီ
      ကုမ္ပဏီရဲ့ နာမည်က နေခြည် Fiber ပါ။ နေခြည် Fiber ဆိုတာ ဒီ course အတွက် စိတ်ကူးနဲ့ တည်ဆောက်ထားတဲ့
      ကုမ္ပဏီပါ။
      [[mark:sel-company]] နေခြည် Fiber က ရန်ကုန်နဲ့ မန္တလေးမှာ fiber internet ဝန်ဆောင်မှု ပေးနေပြီး၊ customer
      ၆၂၀၀၀ လောက် ရှိပါတယ်။ ဝန်ထမ်း ၄၃၀ ထဲမှာ support agent ၄၅ ယောက်နဲ့ developer ၂၄ ယောက် ပါပါတယ်။
      [[mark:sel-support]] support ဘက်ကို တစ်ရက်မှာ ticket ၁၈၀၀ လောက် ဝင်ပါတယ်။ ticket ဆိုတာ customer
      တစ်ယောက်ရဲ့ တိုင်ကြားချက် ဒါမှမဟုတ် မေးခွန်း တစ်ခုပါ။ ထက်ဝက်ကျော်က internet မရဘူး၊ နှေးတယ် ဆိုတဲ့
      connection ပြဿနာတွေ ဖြစ်ပါတယ်။
      [[mark:s-open]] ဒီနှစ် မိုးတွင်းမှာ နေခြည် Fiber အတွက် မမေ့နိုင်တဲ့ည တစ်ည ရှိခဲ့ပါတယ်။
      [[mark:s-rain]] မုန်တိုင်းကျတဲ့ အဲဒီညမှာ မြို့နယ် သုံးခုမှာ လိုင်းကျသွားပါတယ်။
      [[mark:s-tickets]] customer တွေက တစ်ပြိုင်တည်း စာပို့ကြတော့ ticket က ပုံမှန်ရဲ့ လေးဆ ဖြစ်သွားပါတယ်။
      [[mark:s-ai]] support agent တချို့က အလုပ်နိုင်အောင် personal chat AI account တွေနဲ့ အဖြေတွေကို
      ရေးခိုင်းပြီး ပြန်ပို့ကြပါတယ်။ AI ရေးပေးတဲ့ အဖြေတွေက ယဉ်ကျေးပြီး ဖတ်လို့လည်း ကောင်းပါတယ်။
      [[mark:s-wrong]] ဒါပေမဲ့ အဲဒီထဲက ၆၄ စောင်က လိုင်းကျနေတဲ့ မြို့နယ်ထဲက customer တွေကို router ကို ပိတ်ပြီး
      ပြန်ဖွင့်ကြည့်ဖို့ ပြောခဲ့တာပါ။ လိုင်းကိုယ်တိုင် ကျနေတာမို့ router ကို ဘယ်နှခါ ပြန်ဖွင့်ဖွင့် internet
      ရလာမှာ မဟုတ်ပါဘူး။ နောက်တစ်နေ့မှာတော့ မကျေနပ်တဲ့ customer တွေရဲ့ စာတွေ ထပ်ဝင်လာပါတော့တယ်။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
    actions:
      - { id: open-readme, type: workspace.openFile, at: { mark: company }, path: README.md }
      - id: sel-company
        type: editor.select
        at: { mark: sel-company }
        target:
          file: README.md
          text: "- customer 62,000 ခန့် (အိမ်နဲ့ ဆိုင်)\n- ဝန်ထမ်း 430: support agent 45၊ field technician 130၊ developer 24"
      - id: sel-support
        type: editor.select
        at: { mark: sel-support }
        target:
          file: README.md
          text: "- တစ်ရက် ticket 1,800 ခန့်\n- connection 55 %၊ billing 25 %၊ တပ်ဆင်နဲ့ ရွှေ့ပြောင်း 12 %၊ အခြား 8 %"
      - {
          id: draw-s-open,
          type: whiteboard.apply,
          at: { mark: s-open },
          open: true,
          upsertIds: [s-title],
        }
      - {
          id: draw-s-rain,
          type: whiteboard.apply,
          at: { mark: s-rain },
          upsertIds: [s-b1, s-l1],
          drawMs: 1200,
        }
      - {
          id: draw-s-tickets,
          type: whiteboard.apply,
          at: { mark: s-tickets },
          upsertIds: [s-a1, s-b2, s-l2],
          drawMs: 1500,
        }
      - {
          id: draw-s-ai,
          type: whiteboard.apply,
          at: { mark: s-ai },
          upsertIds: [s-a2, s-b3, s-l3],
          drawMs: 1500,
        }
      - {
          id: draw-s-wrong,
          type: whiteboard.apply,
          at: { mark: s-wrong },
          upsertIds: [s-a3, s-b4, s-l4],
          drawMs: 1500,
        }

  - id: whose-mistake
    chapter: ဘယ်သူ့အမှားလဲ
    narration: >
      [[mark:n-open]] ဒီ ဖြစ်ရပ်ကို ကြားရင် လူအများစုက AI မှားတာပဲ၊ ဒါမှမဟုတ် support agent တွေ ပေါ့ဆတာပဲလို့
      ထင်ကြပါတယ်။ တကယ်တော့ နှစ်ခုလုံး မဟုတ်ပါဘူး။
      [[mark:n-model]] အလယ်မှာ model ရှိပါတယ်။ model ဆိုတာ စာတွေ အများကြီးကနေ သင်ယူထားပြီး၊ ပေးလိုက်တဲ့ စာကို
      ဆက်ရေးပေးတဲ့ program ပါ။ အဲဒီညက model က လုပ်နေကျ အလုပ်ကို ပုံမှန်အတိုင်း လုပ်ခဲ့တာပါ။ ရလာတဲ့ ticket
      စာသားကို ကြည့်ပြီး၊ အဖြစ်နိုင်ဆုံး အဖြေကို ချောချောမွေ့မွေ့ ရေးပေးခဲ့ပါတယ်။ လိုနေခဲ့တာက model ရဲ့
      ပတ်ဝန်းကျင်မှာပါ။
      [[mark:n-see]] ပထမ ကွက်လပ်က model မြင်နိုင်တဲ့ အရာပါ။ ဘယ်မြို့နယ်မှာ လိုင်းကျနေလဲ ဆိုတာကို နေခြည် ရဲ့
      network monitoring system၊ အတိုကောက် NMS ကပဲ သိပါတယ်။ model ကတော့ NMS ကို မမြင်ရပါဘူး။ မမြင်ရတဲ့အခါ
      မသိဘူးလို့ မပြောဘဲ၊ internet မရတဲ့ ပြဿနာအတွက် အဖြစ်များဆုံး အကြံကို ပေးလိုက်တာပါ။
      [[mark:n-check]] ဒုတိယ ကွက်လပ်က စစ်ဆေးတဲ့သူပါ။ AI ရေးတဲ့ အဖြေကို မပို့ခင် ဘယ်သူက ဘာနဲ့ တိုက်စစ်ရမလဲ
      ဆိုတာ ဘယ်သူမှ မသတ်မှတ်ထားခဲ့ပါဘူး။ ticket တွေ လေးဆ ဝင်နေတဲ့ညမှာ support agent တွေအနေနဲ့ တစ်စောင်ချင်း
      ထိုင်စစ်ဖို့ အချိန်လည်း မရှိခဲ့ပါဘူး။
      [[mark:n-own]] တတိယ ကွက်လပ်က တိုင်းတာမှုပါ။ personal account တွေနဲ့ သုံးနေတာမို့ ကုမ္ပဏီအနေနဲ့ ဘယ်သူတွေ
      သုံးနေလဲ၊ customer ရဲ့ အချက်အလက်တွေ ဘယ်ကို ရောက်သွားလဲ၊ အဖြေတွေ ဘယ်လောက် မှန်လဲ ဆိုတာ တစ်ခုမှ
      မသိခဲ့ပါဘူး။
      [[mark:n-point]] ဆိုလိုတာက model ရဲ့ စွမ်းရည်က ရှိနေပြီးသားပါ။ မရှိခဲ့တာက အဲဒီ စွမ်းရည်ကို နေခြည် ရဲ့
      အလုပ်ထဲ ဘယ်လို ထည့်သုံးမလဲ ဆိုတဲ့ design ပါ။ အဲဒီ design ကို ဆွဲပြီး လက်တွေ့ အလုပ်ဖြစ်လာအောင်
      လုပ်ပေးတာက forward deployed engineer ရဲ့ အလုပ် ဖြစ်ပါတယ်။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
    actions:
      - {
          id: draw-n-open,
          type: whiteboard.apply,
          at: { mark: n-open },
          clear: true,
          upsertIds: [n-title],
        }
      - {
          id: draw-n-model,
          type: whiteboard.apply,
          at: { mark: n-model },
          upsertIds: [n-model, n-model-l],
          drawMs: 1200,
        }
      - {
          id: draw-n-see,
          type: whiteboard.apply,
          at: { mark: n-see },
          upsertIds: [n-a1, n-r1, n-r1-l],
          drawMs: 1500,
        }
      - {
          id: draw-n-check,
          type: whiteboard.apply,
          at: { mark: n-check },
          upsertIds: [n-a2, n-r2, n-r2-l],
          drawMs: 1500,
        }
      - {
          id: draw-n-own,
          type: whiteboard.apply,
          at: { mark: n-own },
          upsertIds: [n-a3, n-r3, n-r3-l],
          drawMs: 1500,
        }
      - {
          id: draw-n-conc,
          type: whiteboard.apply,
          at: { mark: n-point },
          upsertIds: [n-conc],
          drawMs: 1000,
        }

  - id: the-fde
    chapter: FDE ရဲ့ အလုပ်
    narration: >
      [[mark:f-close]] forward deployed engineer ဆိုတာ customer ရဲ့ အဖွဲ့ထဲ ဝင်ထိုင်ပြီး၊ AI ကို အဲဒီ လုပ်ငန်းရဲ့
      တကယ့် အလုပ်ထဲမှာ အသုံးဝင်အောင် တပ်ဆင်ပေးတဲ့ engineer ပါ။ အကြံပေးစာတမ်း တစ်စောင် ရေးပေးပြီး
      ပြန်သွားတဲ့သူ မဟုတ်သလို၊ software ကို ရောင်းပြီး ကျန်တာကို customer ဘက်က ဆက်လုပ်ပါစေ ဆိုတဲ့သူလည်း
      မဟုတ်ပါဘူး။ customer ရဲ့ system တွေကို ကိုယ်တိုင် ဖတ်တယ်၊ code ကို ကိုယ်တိုင် ရေးတယ်၊ သုံးမယ့်သူတွေနဲ့
      အတူ ထိုင်တယ်၊ ပြီးတော့ ရလဒ်ကို ဂဏန်းနဲ့ ပြနိုင်တဲ့အထိ တာဝန်ယူပါတယ်။
      [[mark:f-cto]] မုန်တိုင်းကျတဲ့ည ပြီးတော့ နေခြည် ရဲ့ CTO ဖြစ်တဲ့ အောင်အောင် က ဆုံးဖြတ်ချက် တစ်ခု
      ချပါတယ်။ AI ကို ပိတ်ပင်မယ့်အစား စနစ်တကျ သုံးမယ် ဆိုတာပါ။ အဲဒီအတွက် Claude ကို လုပ်ငန်းတွေမှာ
      တပ်ဆင်ပေးနေတဲ့ ကိုယ့် ကုမ္ပဏီဆီ အကူအညီ တောင်းလာပါတယ်။ ဒီ course တစ်လျှောက်လုံးမှာ ကိုယ်က နေခြည် ဆီ
      ၁၂ ပတ် သွားလုပ်ရမယ့် FDE ဖြစ်ပါတယ်။
      [[mark:sel-work]] ၁၂ ပတ်အတွင်း လုပ်ရမယ့် အလုပ်က သုံးခု ရှိပါတယ်။ ပထမ တစ်ခုက Reply assistant ပါ။ support
      ticket တစ်ခုအတွက် အဖြေ မူကြမ်းကို ရေးပေးပြီး၊ support agent က စစ်ပြီးမှ ပို့ရမယ့် agent ဖြစ်ပါတယ်။ agent
      ဆိုတာ ရည်မှန်းချက် ရောက်တဲ့အထိ tool တွေကို ရွေးသုံးပြီး အဆင့်ဆင့် လုပ်သွားတဲ့ model ကို ခေါ်တာပါ။
      [[mark:work-2]] ဒုတိယ တစ်ခုက နေခြည် ရဲ့ developer တွေ Claude Code နဲ့ အလုပ်လုပ်တတ်လာအောင် ကူညီပေးဖို့ပါ။
      တတိယ တစ်ခုကတော့ ကုမ္ပဏီ တစ်ခုလုံးက Claude ကို စနစ်တကျ သုံးနိုင်အောင် ပြင်ဆင်ပေးဖို့ ဖြစ်ပါတယ်။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
    actions:
      - { id: close-gaps, type: whiteboard.apply, at: { mark: f-close }, open: false }
      - id: sel-storm
        type: editor.select
        at: { mark: f-cto }
        target:
          file: README.md
          text: "- chat AI နဲ့ ရေးထားတဲ့ အဖြေ 64 စောင်က လိုင်းကျနေတဲ့ customer တွေကို router ပြန်ဖွင့်ခိုင်းခဲ့တယ်"
      - id: sel-work
        type: editor.select
        at: { mark: sel-work }
        target:
          file: README.md
          text: "- Reply assistant: support ticket အတွက် အဖြေ မူကြမ်း ရေးပေးတဲ့ agent"
      - id: sel-work-2
        type: editor.select
        at: { mark: work-2 }
        target:
          file: README.md
          text: "- Billing team နဲ့ Claude Code\n- ကုမ္ပဏီ တစ်ခုလုံးအတွက် Claude"

  - id: three-kinds
    chapter: အလုပ် သုံးမျိုး
    narration: >
      [[mark:m-open]] FDE တစ်ယောက်ရဲ့ အလုပ်ကို သုံးမျိုး ခွဲကြည့်လို့ ရပါတယ်။ ဒီ course ရဲ့ lesson ၅၆ ခုကိုလည်း
      အဲဒီ သုံးမျိုးအတိုင်း စီထားပါတယ်။
      [[mark:m-1]] ပထမ တစ်မျိုးက နားလည်တာပါ။ model က ဘာကြောင့် ဒီလို ပြုမူလဲ၊ ဘာကို ယုံလို့ရပြီး ဘာကို
      စစ်ရမလဲ ဆိုတာကို သိမှ ကျန်တာတွေကို ဆုံးဖြတ်နိုင်ပါတယ်။ မုန်တိုင်းကျတဲ့ညက အဖြေတွေ ဘာကြောင့် အဲဒီလို
      ထွက်လာခဲ့လဲ ဆိုတာကိုလည်း ဒီအပိုင်းမှာ အသေးစိတ် ပြန်ကြည့်ပါမယ်။
      [[mark:m-2]] ဒုတိယ တစ်မျိုးက တည်ဆောက်တာပါ။ model ကို နေခြည် ရဲ့ system တွေနဲ့ ချိတ်ပေးရပါမယ်။ Claude
      Platform ပေါ်မှာ Reply assistant ကို ဆောက်တာ၊ developer တွေအတွက် Claude Code ကို ပြင်ဆင်ပေးတာ၊ ticket နဲ့
      လိုင်းကျမှု အချက်အလက်တွေကို Claude မြင်နိုင်အောင် ချိတ်ပေးတာတွေ ပါဝင်ပါတယ်။
      [[mark:m-3]] တတိယ တစ်မျိုးက ဖြန့်ကျက်တာပါ။ ဆောက်ပြီးသား အရာကို လူတွေ တကယ် သုံးလာအောင်၊ သုံးလို့
      ရလာတဲ့ အကျိုးကို ဂဏန်းနဲ့ ပြနိုင်အောင် လုပ်ရပါတယ်။ နည်းပညာကို တပ်ဆင်တာက ပိုလွယ်တဲ့ အပိုင်းပါ။
      ပိုခက်တာက လူတွေရဲ့ အလုပ်လုပ်ပုံကို ပြောင်းတာနဲ့၊ ရလဒ်ကို သက်သေပြတာ ဖြစ်ပါတယ်။ FDE ကို engineer
      သက်သက်နဲ့ ကွာစေတာလည်း ဒီ တတိယ အပိုင်းပါပဲ။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
    actions:
      - {
          id: show-kinds,
          type: slide.show,
          at: { mark: m-open, offsetMs: -1200 },
          slideId: three-kinds,
        }
      - { id: point-kind-1, type: slide.point, at: { mark: m-1 }, target: { x: 0.15, y: 0.43 } }
      - { id: point-kind-2, type: slide.point, at: { mark: m-2 }, target: { x: 0.15, y: 0.59 } }
      - { id: point-kind-3, type: slide.point, at: { mark: m-3 }, target: { x: 0.15, y: 0.75 } }

  - id: today
    chapter: အခု အခြေအနေကို ချရေးခြင်း
    narration: >
      [[mark:d-open]] FDE တစ်ယောက် customer ဆီ ရောက်ရင် ပထမဆုံး လုပ်တာက ဘာမှ မဆောက်သေးဘဲ၊ အခု လက်ရှိ ဘယ်လို
      သုံးနေလဲ ဆိုတာကို ရိုးရိုးသားသား ချရေးတာပါ။ နေခြည် အတွက် မေးခွန်း လေးခုနဲ့ ရေးကြည့်ရအောင်။
      [[mark:type-who]] ပထမ မေးခွန်းက ဘယ်သူတွေ သုံးနေလဲ ဆိုတာပါ။ support agent တချို့က personal account နဲ့
      သုံးနေပြီး၊ ဘယ်နှယောက်လဲ ဆိုတာကိုတောင် ကုမ္ပဏီက မသိပါဘူး။
      [[mark:type-see]] ဒုတိယ မေးခွန်းက AI က ဘာကို မြင်နိုင်လဲ ဆိုတာပါ။ support agent က ကူးထည့်ပေးတဲ့ ticket
      စာသားကိုပဲ မြင်ရပါတယ်။ လိုင်းကျမှု အခြေအနေ၊ customer သုံးနေတဲ့ plan နဲ့ ပြဿနာဖြေရှင်းနည်း article တွေကိုတော့
      မမြင်ရပါဘူး။
      [[mark:type-check]] တတိယ မေးခွန်းက မပို့ခင် ဘယ်သူ စစ်လဲ ဆိုတာပါ။ စည်းကမ်း မရှိတဲ့အတွက် support agent
      တစ်ယောက်ချင်းစီရဲ့ အချိန်နဲ့ သတိအပေါ်မှာပဲ မူတည်နေပါတယ်။
      [[mark:type-measure]] စတုတ္ထ မေးခွန်းက အကျိုးရှိမရှိ ဘယ်လို တိုင်းလဲ ဆိုတာပါ။ အခုတော့ မတိုင်းသေးပါဘူး။
      support ရဲ့ ပထမဆုံး ပြန်ဖြေချိန်က ပျမ်းမျှ ၃၈ မိနစ် ဆိုတာကို သိပေမဲ့၊ AI သုံးလို့ အဲဒါ ပိုမြန်လာလား၊ အမှား
      ပိုများလာလား ဆိုတာကိုတော့ ဘယ်သူမှ မပြောနိုင်ပါဘူး။
      [[mark:d-point]] ဒီ လေးချက်ကို ကြည့်ရင် မုန်တိုင်းကျတဲ့ညက ဖြစ်ရပ်ဟာ မတော်တဆ မဟုတ်ဘဲ၊ တစ်နေ့နေ့ ဖြစ်လာမယ့်
      အရာ တစ်ခု ဆိုတာ မြင်ရပါတယ်။ ကိုယ်တို့ ၁၂ ပတ်အတွင်း ပြောင်းရမယ့် အရာတွေကလည်း ဒီ လေးချက်ပါပဲ။
    sources:
