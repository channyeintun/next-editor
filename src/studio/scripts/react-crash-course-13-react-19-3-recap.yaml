  # ------------------------------------------------------------------ 7
  - id: fragment-board
    chapter: "Fragment ref နဲ့ DOM အုပ်စု"
    narration: >
      [[mark:draw-frag-title]] နောက်ဆုံး feature အသစ်ကတော့ DOM နဲ့ ဆိုင်ပါတယ်။
      [[mark:draw-frag-div]] field အုပ်စု တစ်ခုလုံးအတွက် ref တစ်ခုတည်း လိုတယ်
      ဆိုပါစို့။ အရင်က div နဲ့ ထုပ်ခဲ့ရပါတယ်။ ဒါပေမဲ့ ဒီ card က သူ့ထဲက element
      တွေကြားမှာ gap လို့ ခေါ်တဲ့ နေရာလွတ် ထည့်ပေးပါတယ်။ div နဲ့ ထုပ်လိုက်ရင်
      field သုံးခုက element တစ်ခုတည်း ဖြစ်သွားလို့ gap ပျောက်သွားပါတယ်။
      [[mark:draw-frag-ref]] React 19.3 မှာတော့ ref ကို Fragment ပေါ်မှာ တပ်လို့
      ရပါပြီ။ သူ့ ref က FragmentInstance တစ်ခုကို ပေးပြီး၊ အဲဒါက Fragment ထဲက
      child အားလုံးကို အုပ်စု တစ်ခုလို ကိုင်ပေးပါတယ်။ [[mark:draw-frag-methods]]
      သူက ပထမ ဒါမှမဟုတ် နောက်ဆုံး field ကို focus လုပ်တာ၊ child တိုင်းမှာ event
      listener ထည့်တာ၊ observeUsing နဲ့ screen ပေါ် မြင်ရလား၊ အရွယ်အစား ပြောင်းလား
      စောင့်ကြည့်တာတွေ လုပ်နိုင်ပါတယ်။
    sources:
      - title: "React — <Fragment> (ref)"
        url: "https://react.dev/reference/react/Fragment"
      - title: "React 19.3"
        url: "https://react.dev/blog/2026/09/09/react-19-3"
      - title: "MDN — CSS grid layout"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_grid_layout"
    actions:
      - id: draw-frag-title
        type: whiteboard.apply
        at: { mark: draw-frag-title }
        open: true
        clear: true
        upsertIds: [b5-title]
      - id: draw-frag-div
        type: whiteboard.apply
        at: { mark: draw-frag-div }
        upsertIds: [b5-div-label, b5-div-card, b5-div-inner, b5-div-text, b5-div-note]
        drawMs: 2600
      - id: draw-frag-ref
        type: whiteboard.apply
        at: { mark: draw-frag-ref }
        upsertIds: [b5-frag-label, b5-frag-card, b5-frag-f1, b5-frag-f2, b5-frag-f3, b5-frag-note]
        drawMs: 2600
      - id: draw-frag-methods
        type: whiteboard.apply
        at: { mark: draw-frag-methods }
        upsertIds: [b5-methods-1, b5-methods-2]
        drawMs: 1800

  # ------------------------------------------------------------------ 8
  - id: fragment-code
    narration: >
      [[mark:close-board-frag]] order အသေးစိတ် card တစ်ခု ရေးရအောင်။
      [[mark:open-details]] ဖိုင်က အလွတ်ပါ။ [[mark:type-details-head]] ref နဲ့
      focus က browser ထဲမှာပဲ ရှိလို့ ဒါက Client Component ပါ။ lesson 2 က key
      လိုပဲ tag အလွတ် ရေးနည်းက ref ကို လက်မခံလို့၊ Fragment ကို import လုပ်ပါတယ်။
      [[mark:type-details-state]] ref တစ်ခုက FragmentInstance ကို ကိုင်ထားမှာ
      ဖြစ်ပြီး၊ state တစ်ခုက ဘယ် field မှာ focus ရှိလဲ မှတ်ထားပါတယ်။
      [[mark:type-details-fn]] ခလုတ်ကို နှိပ်ရင် အုပ်စုက သူ့ ပထမဆုံး field ကို
      focus လုပ်ပါတယ်။ ပြီးတော့ focus ရောက်နေတဲ့ element ရဲ့ နာမည်ကို preview မှာ
      ပြဖို့ မှတ်ထားပါတယ်။ [[mark:type-details-jsx]] နာမည်၊ စားပွဲ နံပါတ်နဲ့
      မှတ်ချက် field သုံးခုကို label နဲ့ ထုပ်ပြီး၊ ref ပါတဲ့ Fragment ထဲမှာ
      ထားပါတယ်။ ခလုတ်နဲ့ အောက်က စာကြောင်းကတော့ Fragment အပြင်မှာ ထားတဲ့အတွက်
      အုပ်စုထဲ မပါပါဘူး။ ပြီးတော့ Fragment က element အပို မထည့်တဲ့အတွက်၊ field
      တွေကြားက gap တွေလည်း မပျောက်ပါဘူး။ [[mark:select-group-focus]] ဒီ focus ကို
      အုပ်စု တစ်ခုလုံးပေါ်မှာ ခေါ်တာပါ။ [[mark:open-app-details]] နောက်ဆုံး တစ်ခါ
      App ပြန်ရအောင်။ [[mark:wire-details-import]] card ကို ယူပါတယ်။
      [[mark:wire-details-use]] မှာထားတဲ့ အရေအတွက် အောက်မှာ render လုပ်ပါတယ်။
      [[mark:click-fill]] ခလုတ်ကို နှိပ်ကြည့်ရအောင်။ [[mark:after-fill]] အောက်က
      စာကြောင်းက နာမည် အကွက်မှာ focus ရောက်နေတယ်လို့ ပြနေပါပြီ။ wrapper div လည်း
      မလို၊ input မှာ ref လည်း မတပ်ဘဲ Fragment က ရှာတွေ့သွားတာပါ။
    sources:
      - title: "React — <Fragment>: managing focus"
        url: "https://react.dev/reference/react/Fragment"
      - title: "React — useRef"
        url: "https://react.dev/reference/react/useRef"
      - title: "MDN — Document.activeElement"
        url: "https://developer.mozilla.org/en-US/docs/Web/API/Document/activeElement"
    actions:
      - id: close-board-frag
        type: whiteboard.apply
        at: { mark: close-board-frag }
        open: false
      - id: open-details
        type: workspace.openFile
        at: { mark: open-details }
        path: src/OrderDetails.jsx
      - id: type-details-head
        type: editor.type
        at: { mark: type-details-head }
        cadence: line-by-line
        target: { file: src/OrderDetails.jsx, after: "", occurrence: 1 }
        text: "\"use client\";\nimport { Fragment, useRef, useState } from \"react\";\n"
      - id: type-details-state
        type: editor.type
        at: { mark: type-details-state }
        cadence: line-by-line
        target:
          {
            file: src/OrderDetails.jsx,
            after: "import { Fragment, useRef, useState } from \"react\";\n",
            occurrence: 1,
          }
        text: "\nexport function OrderDetails() {\n  const groupRef = useRef(null);\n  const [focused, setFocused] = useState(\"\");\n"
      - id: type-details-fn
        type: editor.type
        at: { mark: type-details-fn }
        cadence: line-by-line
        target:
          {
            file: src/OrderDetails.jsx,
            after: "  const [focused, setFocused] = useState(\"\");\n",
            occurrence: 1,
          }
        text: "\n  function startFilling() {\n    groupRef.current.focus();\n    setFocused(document.activeElement.name);\n  }\n"
      - id: type-details-jsx
        type: editor.type
        at: { mark: type-details-jsx }
        cadence: line-by-line
        target:
          {
            file: src/OrderDetails.jsx,
            after: "    setFocused(document.activeElement.name);\n  }\n",
            occurrence: 1,
          }
        text: "\n  return (\n    <section className=\"card\">\n      <Fragment ref={groupRef}>\n        <label>နာမည် <input name=\"name\" /></label>\n        <label>စားပွဲ နံပါတ် <input name=\"table\" /></label>\n        <label>မှတ်ချက် <textarea name=\"note\" /></label>\n      </Fragment>\n      <button data-testid=\"fill-details\" onClick={startFilling}>\n        အချက်အလက် ဖြည့်မယ်\n      </button>\n      <p className=\"muted\" data-testid=\"focus-label\">\n        {focused && \"အခု ဖြည့်နေတာ · \" + focused}\n      </p>\n    </section>\n  );\n}\n"
      - id: select-group-focus
        type: editor.select
        at: { mark: select-group-focus }
        target: { file: src/OrderDetails.jsx, text: "groupRef.current.focus();", occurrence: 1 }
      - id: open-app-details
        type: workspace.openFile
        at: { mark: open-app-details, offsetMs: 400 }
        path: src/App.jsx
      - id: wire-details-import
        type: editor.type
        at: { mark: wire-details-import }
        cadence: block
        target:
          {
            file: src/App.jsx,
            after: "import { TimeZone } from \"./TimeZone.jsx\";\n",
            occurrence: 1,
          }
        text: "import { OrderDetails } from \"./OrderDetails.jsx\";\n"
      - id: wire-details-use
        type: editor.type
        at: { mark: wire-details-use }
        cadence: block
        target:
          {
            file: src/App.jsx,
            after: "            မှာထားတာ {orders.length} ခု\n          </p>\n",
            occurrence: 1,
          }
        text: "          <OrderDetails />\n"
      - id: expect-details
        type: expect.preview
        at: { afterAction: wire-details-use }
        timeoutMs: 5000
        target: { by: testId, value: fill-details }
        textContains: "ဖြည့်မယ်"
        retry: { maxAttempts: 3, delayMs: 1000 }
      - id: click-fill
        type: preview.click
        at: { mark: click-fill }
        timeoutMs: 5000
        target: { by: testId, value: fill-details }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-focus
        type: expect.preview
        at: { mark: after-fill }
        timeoutMs: 5000
        target: { by: testId, value: focus-label }
        textContains: "အခု ဖြည့်နေတာ · name"
        retry: { maxAttempts: 3, delayMs: 400 }

  # ------------------------------------------------------------------ 9
  - id: trusted-types
    chapter: "Trusted Types နဲ့ တခြား ပြောင်းလဲမှုတွေ"
    narration: >
      [[mark:draw-tt-title]] အစက စာရင်းထဲက နောက်ဆုံး တစ်ခုကတော့ Trusted Types ပါ။
      [[mark:draw-tt-rule]] တချို့ site တွေက browser ရဲ့ security စည်းကမ်း
      တစ်ခုကို ဖွင့်ထားပြီး၊ စစ်ပြီးသား HTML နဲ့ script URL ကိုပဲ လက်ခံပါတယ်။
      ဒါကြောင့် ထိုးထည့်တဲ့ script တွေကို တားနိုင်ပါတယ်။ [[mark:draw-tt-before]]
      React 19.3 မတိုင်ခင်က attribute ထဲက ခွင့်ပြုပြီးသား တန်ဖိုးတွေကို React က
      string အဖြစ် ပြောင်းလိုက်လို့၊ browser က လက်မခံခဲ့ပါဘူး။
      [[mark:draw-tt-now]] အခုတော့ React က မပြောင်းဘဲ ဒီအတိုင်း ပို့ပေးပါတယ်။
      [[mark:draw-tt-other]] တခြား ပြောင်းလဲမှု သေးသေး နှစ်ခုလည်း ရှိပါတယ်။
      condition ထဲမှာ use ကို မှားသုံးထားရင် development မှာ သတိပေးတဲ့ warning
      အသစ်နဲ့၊ fullscreen အတွက် event အသစ်တွေပါ။
    sources:
      - title: "React 19.3"
        url: "https://react.dev/blog/2026/09/09/react-19-3"
      - title: "MDN — Trusted Types API"
        url: "https://developer.mozilla.org/en-US/docs/Web/API/Trusted_Types_API"
      - title: "React 19.3 changelog"
        url: "https://github.com/react/react/blob/main/CHANGELOG.md"
    actions:
      - id: draw-tt-title
        type: whiteboard.apply
        at: { mark: draw-tt-title }
        open: true
        clear: true
        upsertIds: [b6-title]
      - id: draw-tt-rule
        type: whiteboard.apply
        at: { mark: draw-tt-rule }
        upsertIds: [b6-rule]
        drawMs: 1400
      - id: draw-tt-before
        type: whiteboard.apply
        at: { mark: draw-tt-before }
        upsertIds: [b6-before]
        drawMs: 1400
      - id: draw-tt-now
        type: whiteboard.apply
        at: { mark: draw-tt-now }
        upsertIds: [b6-now, b6-now-check]
        drawMs: 1400
      - id: draw-tt-other
        type: whiteboard.apply
        at: { mark: draw-tt-other }
        upsertIds: [b6-other-label, b6-other-underline, b6-other-1, b6-other-2]
        drawMs: 2400

