# React crash course, lesson 13 — React 19.3 and the course recap
# (Burmese, my-MM). The last lesson of the course.
#
# Story: the same React Server Components app as lesson 12 (Vite 7.3.7 +
# @vitejs/plugin-rsc 0.5.37, React 19.3.1; no framework, no router), minus
# the slow Specials so every server refresh stays fast. A whiteboard map of
# what React 19.3 added (two items already taught in lessons 8 and 11), then
# hydration: server HTML -> hydrateRoot, read in the pinned
# src/framework/entry.browser.jsx, with React 19's mismatch diff and 19.3's
# StrictMode-during-hydration change. Three 19.3 features are then written
# into the running app: a context created in a 'use client' file and
# RENDERED by the App Server Component as <ShopContext value> (opening
# hours); a TimeZone Client Component that opts out of server rendering with
# use(browser()) inside <Suspense>; and an OrderDetails card whose three
# fields sit in a <Fragment ref>, focused as a group through the
# FragmentInstance. A board on Trusted Types and the smaller 19.3 changes,
# and a recap of the whole course (lessons 1-13) close it.
#
# Insert-only plan: ShopContext.jsx, ShopHours.jsx, TimeZone.jsx and
# OrderDetails.jsx are pinned EMPTY and typed while nothing imports them
# (the 'use client' line keystroke by keystroke, the rest line by line).
# App.jsx is a live Server Component: it only takes `block` inserts of
# complete lines, the import first, then the usage. Every App edit is an
# in-place RSC refresh (no reload). The three new parts are inserted ABOVE
# the menu (after the header, and after the order count) so the whole demo
# stays inside the docked preview without scrolling; nothing is clicked
# before them, so the siblings they shift have no client state to lose.
#
# The dev server starts in the first scene (install + boot take ~40 s in the
# WebContainer); the preview opens only after the hydration scene, more than
# two minutes later.
#
# Narration is Burmese (my-MM). Its source is voice-script.md next to this
# file: tools/sync_check.py copies it into tools/template.yaml and rebuilds
# this YAML with tools/build.py, so edit voice-script.md, not the narration
# here. Every visible string (title, chapters, board labels, UI) is Burmese.
