      vite.config.js: |
        import "./webcontainer-fix.js";
        import rsc from "@vitejs/plugin-rsc";
        import { defineConfig } from "vite";

        export default defineConfig({
          // JSX through esbuild's automatic runtime: components never import React.
          esbuild: { jsx: "automatic" },
          // Pre-bundle every browser entry up front so Vite never discovers a new
          // dependency mid-lesson and force-reloads the preview.
          optimizeDeps: {
            include: [
              "react",
              "react/jsx-dev-runtime",
              "react-dom",
              "react-dom/client",
              "rsc-html-stream/client",
            ],
          },
          plugins: [
            // React's bundler integration for Server Components. It builds three
            // environments: rsc (Server Components + Server Functions), ssr (HTML)
            // and client (hydration in the browser).
            rsc({
              entries: {
                rsc: "./src/framework/entry.rsc.jsx",
                ssr: "./src/framework/entry.ssr.jsx",
                client: "./src/framework/entry.browser.jsx",
              },
            }),
          ],
        });
      webcontainer-fix.js: |
        // Two gaps between WebContainer's in-browser Node.js and real Node.js that
        // React Server Components run into. Real Node.js passes both checks and is
        // left alone. Imported once by vite.config.js, which runs in the server process.

        // 1. The server clock (performance.timeOrigin + performance.now()) runs
        // behind the browser's Date.now(). React stamps that time into the RSC stream,
        // so the browser computes component times before the page existed and React's
        // dev performance track throws "cannot have a negative time stamp".
        const drift = Date.now() - (performance.timeOrigin + performance.now());
        if (Math.abs(drift) > 20) {
          Object.defineProperty(performance, "timeOrigin", { value: performance.timeOrigin + drift });
        }

        // 2. TextDecoder ignores { stream: true }: a Burmese letter (3 bytes in UTF-8)
        // split between two chunks of the RSC stream turns into "�" and corrupts the
        // page. Keep an unfinished letter's bytes and decode them with the next chunk.
        const NativeTextDecoder = globalThis.TextDecoder;

        function decodesSplitLetters() {
          const decoder = new NativeTextDecoder();
          const text =
            decoder.decode(new Uint8Array([0xe1, 0x80]), { stream: true }) +
            decoder.decode(new Uint8Array([0x81]));
          return text === "ခ";
        }

        if (process.env.FORCE_TEXT_DECODER_FIX || !decodesSplitLetters()) {
          globalThis.TextDecoder = class TextDecoder extends NativeTextDecoder {
            #pending = new Uint8Array(0);

            decode(input, options) {
              let bytes = !input
                ? new Uint8Array(0)
                : ArrayBuffer.isView(input)
                  ? new Uint8Array(input.buffer, input.byteOffset, input.byteLength)
                  : new Uint8Array(input);
              if (this.#pending.length > 0) {
                const joined = new Uint8Array(this.#pending.length + bytes.length);
                joined.set(this.#pending);
                joined.set(bytes, this.#pending.length);
                bytes = joined;
              }
              let end = bytes.length;
              if (options?.stream) {
                // Step back over continuation bytes (10xxxxxx) to the letter's first byte.
                let start = end - 1;
                while (start >= 0 && end - start < 4 && (bytes[start] & 0xc0) === 0x80) start--;
                if (start >= 0) {
                  const first = bytes[start];
                  const length = first >= 0xf0 ? 4 : first >= 0xe0 ? 3 : first >= 0xc0 ? 2 : 1;
                  if (start + length > end) end = start;
                }
              }
              this.#pending = bytes.slice(end);
              return super.decode(bytes.slice(0, end));
            }
          };
        }
      src/framework/entry.rsc.jsx: |
        // Runs on the server, in the "rsc" environment (react-server condition).
        // GET  /            -> HTML (rendered by the ssr environment)
        // GET  /?rsc        -> the RSC payload (used by the browser to refresh)
        // POST /?rsc + x-rsc-action header -> call a Server Function, then re-render
        import {
          renderToReadableStream,
          createTemporaryReferenceSet,
          decodeReply,
          loadServerAction,
          decodeAction,
          decodeFormState,
        } from "@vitejs/plugin-rsc/rsc/server";
        import App from "../App.jsx";

        async function handler(request) {
          const url = new URL(request.url);
          const wantsRsc = url.searchParams.has("rsc");
          let returnValue;
          let formState;
          let temporaryReferences;

          if (request.method === "POST") {
            const actionId = request.headers.get("x-rsc-action");
            if (actionId) {
              // Called from the hydrated page (React's server callback).
              const contentType = request.headers.get("content-type") ?? "";
              const body = contentType.startsWith("multipart/form-data")
                ? await request.formData()
                : await request.text();
              temporaryReferences = createTemporaryReferenceSet();
              const args = await decodeReply(body, { temporaryReferences });
              const action = await loadServerAction(actionId);
              try {
                returnValue = { ok: true, data: await action(...args) };
              } catch (error) {
                returnValue = { ok: false, data: error };
              }
            } else {
              // A plain <form> post before JavaScript loaded.
              const formData = await request.formData();
              const action = await decodeAction(formData);
              formState = await decodeFormState(await action(), formData);
            }
          }

          // A closed tab or a reloaded preview cancels the stream: not an error.
          const onError = (error) => {
            if (!request.signal.aborted) console.error(error);
          };
          const rscStream = renderToReadableStream(
            { root: <App />, returnValue, formState },
            { temporaryReferences, onError },
          );

          if (wantsRsc) {
            return new Response(rscStream, {
              headers: { "content-type": "text/x-component;charset=utf-8" },
            });
          }

          const ssr = await import.meta.viteRsc.loadModule("ssr", "index");
          const htmlStream = await ssr.renderHtml(rscStream, { formState, onError });
          return new Response(htmlStream, {
            headers: { "content-type": "text/html;charset=utf-8" },
          });
        }

        export default { fetch: handler };

        if (import.meta.hot) {
          import.meta.hot.accept();
        }
      src/framework/entry.ssr.jsx: |
        // Runs on the server, in the "ssr" environment: turns the RSC payload into
        // HTML and embeds the payload in the page so the browser can hydrate.
        import { createFromReadableStream, getClientEntryUrl } from "@vitejs/plugin-rsc/ssr";
        import { use } from "react";
        import { renderToReadableStream } from "react-dom/server.edge";
        import { injectRSCPayload } from "rsc-html-stream/server";

        export async function renderHtml(rscStream, { formState, onError }) {
          const [forHtml, forBrowser] = rscStream.tee();
          let payload;
          function SsrRoot() {
            payload ??= createFromReadableStream(forHtml);
            return use(payload).root;
          }
          const htmlStream = await renderToReadableStream(<SsrRoot />, {
            bootstrapScriptContent: `import(${JSON.stringify(getClientEntryUrl())})`,
            formState,
            onError,
          });
          return htmlStream.pipeThrough(injectRSCPayload(forBrowser));
        }
      src/framework/entry.browser.jsx: |
        // Runs in the browser: hydrates the server HTML, calls Server Functions,
        // and re-renders whenever the server sends a new RSC payload.
        import {
          createFromReadableStream,
          createFromFetch,
          setServerCallback,
          createTemporaryReferenceSet,
          encodeReply,
        } from "@vitejs/plugin-rsc/browser";
        import { StrictMode, startTransition, useEffect, useState } from "react";
        import { hydrateRoot } from "react-dom/client";
        import { rscStream } from "rsc-html-stream/client";

        // Replaced once the page has hydrated; a server edit that lands before
        // that has nothing to update (the HTML is already the newest render).
        let setPayload = () => {};

        function rscUrl() {
          const url = new URL(window.location.href);
          url.searchParams.set("rsc", "");
          return url;
        }

        function Root({ initial }) {
          const [payload, set] = useState(initial);
          useEffect(() => {
            setPayload = (next) => startTransition(() => set(next));
          }, []);
          return payload.root;
        }

        setServerCallback(async (id, args) => {
          const temporaryReferences = createTemporaryReferenceSet();
          const payload = await createFromFetch(
            fetch(rscUrl(), {
              method: "POST",
              headers: { "x-rsc-action": id },
              body: await encodeReply(args, { temporaryReferences }),
            }),
            { temporaryReferences },
          );
          setPayload(payload);
          if (!payload.returnValue.ok) throw payload.returnValue.data;
          return payload.returnValue.data;
        });

        createFromReadableStream(rscStream).then((initial) => {
          hydrateRoot(
            document,
            <StrictMode>
              <Root initial={initial} />
            </StrictMode>,
            { formState: initial.formState },
          );
        });

        // An edit to a server file: fetch a fresh RSC payload instead of reloading.
        if (import.meta.hot) {
          import.meta.hot.on("rsc:update", async () => {
            setPayload(await createFromFetch(fetch(rscUrl())));
          });
        }
      src/db.js: |
        // Server-only data: this module never reaches the browser.
        import "server-only";
        import { readFile } from "node:fs/promises";

        export async function getMenu() {
          const text = await readFile(new URL("./menu.json", import.meta.url), "utf8");
          return JSON.parse(text);
        }

        // Orders live in the server's memory (kept across edits for the lesson).
        globalThis.orders ??= [];

        export function getOrders() {
          return globalThis.orders;
        }

        export function addOrder(name) {
          globalThis.orders.push(name);
        }
      src/menu.json: |
        [
