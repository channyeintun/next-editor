build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 13527

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  # ------------------------------------------------------------------ 1
  - id: react-19-3-map
    chapter: "React 19.3 မှာ ဘာအသစ်တွေ ပါလဲ"
    narration: >
      ဒီ lesson က course ရဲ့ နောက်ဆုံး lesson ပါ။ lesson 12 က ဆိုင် app ပေါ်မှာ
      React 19.3 ရဲ့ feature အသစ်တွေကို ထည့်ကြည့်ပြီး၊ course တစ်ခုလုံးကို
      ပြန်ချုပ်ပါမယ်။ [[mark:start-server]] package တွေ install လုပ်ရတာ
      ကြာတဲ့အတွက်၊ dev server ကို အရင်ဆုံး စ run ထားလိုက်ရအောင်။
      [[mark:draw-done-1]] React 19.3 ထဲက တချို့ကိုတော့ သုံးခဲ့ပြီးသားပါ။ lesson
      11 မှာ သုံးခဲ့တဲ့ ViewTransition နဲ့ addTransitionType ပါ။
      [[mark:draw-done-2]] lesson 8 မှာလည်း React က Transition တွေကို သီးခြားစီ
      render လုပ်တာ တွေ့ခဲ့ပါတယ်။ [[mark:draw-new]] ဒီနေ့တော့ ကျန်တာတွေထဲက
      သုံးခုကို app ထဲ ထည့်ရေးပါမယ်။ Server Component က render လုပ်တဲ့ context၊
      browser ဆိုတဲ့ function အသစ်နဲ့ Fragment ပေါ်မှာ တပ်တဲ့ ref ပါ။
      [[mark:draw-tt]] Trusted Types ကတော့ security နဲ့ ဆိုင်ပြီး၊ lesson
      အဆုံးနားမှာ ပြန်ပြောပါမယ်။
    sources:
      - title: "React 19.3"
        url: "https://react.dev/blog/2026/09/09/react-19-3"
      - title: "React — <ViewTransition>"
        url: "https://react.dev/reference/react/ViewTransition"
      - title: "React — useTransition"
        url: "https://react.dev/reference/react/useTransition"
    actions:
      - id: open-board-1
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [b1-title]
      - id: start-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 45000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-done-1
        type: whiteboard.apply
        at: { mark: draw-done-1 }
        upsertIds: [b1-done-check-1, b1-done-1, b1-done-1-tag]
        drawMs: 1600
      - id: draw-done-2
        type: whiteboard.apply
        at: { mark: draw-done-2 }
        upsertIds: [b1-done-check-2, b1-done-2, b1-done-2-tag]
        drawMs: 1600
      - id: draw-new
        type: whiteboard.apply
        at: { mark: draw-new }
        upsertIds: [b1-new-label, b1-new-box, b1-new-1, b1-new-2, b1-new-3]
        drawMs: 2600
      - id: draw-tt
        type: whiteboard.apply
        at: { mark: draw-tt }
        upsertIds: [b1-tt]
        drawMs: 1000

  # ------------------------------------------------------------------ 2
  - id: ssr-hydration
    chapter: "Server HTML နဲ့ hydration"
    narration: >
      [[mark:draw-hydration]] အရင်ဆုံး lesson 12 မှာ နာမည် မပြောခဲ့ရသေးတဲ့
      hydration ကို ကြည့်ရအောင်။ [[mark:draw-step-html]] page တစ်ခု ပွင့်လာတဲ့အခါ
      server က ပြီးပြီးသား HTML ကို ပို့ပေးလို့၊ JavaScript မ run ရသေးခင်မှာပဲ
      browser က ဆိုင်ကို ပြနိုင်ပါတယ်။ [[mark:draw-step-show]] ဒါပေမဲ့ ခလုတ်တွေကို
      နှိပ်လို့ မရသေးပါဘူး။ [[mark:draw-step-hydrate]] JavaScript ရောက်လာတဲ့အခါ
      React က page ကို ပြန်မဆောက်ဘဲ၊ ရှိပြီးသား HTML ပေါ်မှာ လာချိတ်ပါတယ်။ အဲဒီ
      အဆင့်ကို hydration လို့ ခေါ်ပါတယ်။ [[mark:draw-mismatch]] ဒါကြောင့် browser
      ရဲ့ ပထမ render က server ရဲ့ HTML နဲ့ ကိုက်ညီရပါမယ်။ ဒါပေမဲ့ လက်ရှိ အချိန်၊
      ကြည့်နေသူရဲ့ time zone လိုမျိုး တန်ဖိုးတွေက နှစ်ဘက် မတူ ဖြစ်နိုင်ပါတယ်။
      [[mark:draw-diff]] မကိုက်ရင် React 19 က server စာနဲ့ browser စာ ဘယ်မှာ ကွာလဲ
      ပြတဲ့ error ကို ပြပြီး၊ အဲဒီ အပိုင်းကို browser မှာ ပြန် render လုပ်ပါတယ်။
      [[mark:close-board-2]] hydration ကို app ထဲမှာ ရှာကြည့်ရအောင်။
      [[mark:select-hydrate-import]] ဒါက browser ထဲမှာ run တဲ့ framework ဖိုင်ပါ။
      ဒီ import က hydrateRoot ကို ယူထားပါတယ်။ [[mark:select-hydrate]] lesson 1 မှာ
      createRoot က page ကို အလွတ်ကနေ ဆောက်ခဲ့ပါတယ်။ hydrateRoot ကတော့ server
      ပို့ထားတဲ့ document တစ်ခုလုံးကို ဆက်ကိုင်ပါတယ်။ [[mark:select-strict]]
      သူ့ကို StrictMode နဲ့ ထုပ်ထားပါတယ်။ React 19.3 ကစပြီး development မှာ
      StrictMode က hydration လုပ်တုန်းမှာလည်း Effect တွေကို နှစ်ခါ run ပါတယ်။
    sources:
      - title: "React — hydrateRoot"
        url: "https://react.dev/reference/react-dom/client/hydrateRoot"
      - title: "React 19 — Diffs for hydration errors"
        url: "https://react.dev/blog/2024/12/05/react-19#diffs-for-hydration-errors"
      - title: "React — <StrictMode>"
        url: "https://react.dev/reference/react/StrictMode"
      - title: "React 19.3 changelog"
        url: "https://github.com/react/react/blob/main/CHANGELOG.md"
    actions:
      - id: draw-hydration
        type: whiteboard.apply
        at: { mark: draw-hydration }
        clear: true
        upsertIds: [b2-title]
      - id: draw-step-html
        type: whiteboard.apply
        at: { mark: draw-step-html }
        upsertIds: [b2-html-box, b2-html-text, b2-arrow-1, b2-show-box, b2-show-text]
        drawMs: 2400
      - id: draw-step-show
        type: whiteboard.apply
        at: { mark: draw-step-show }
        upsertIds: [b2-show-note]
        drawMs: 1000
      - id: draw-step-hydrate
        type: whiteboard.apply
        at: { mark: draw-step-hydrate }
        upsertIds: [b2-arrow-2, b2-hydrate-box, b2-hydrate-text]
        drawMs: 1800
      - id: draw-mismatch
        type: whiteboard.apply
        at: { mark: draw-mismatch }
        upsertIds: [b2-mismatch, b2-mismatch-eg]
        drawMs: 1600
      - id: draw-diff
        type: whiteboard.apply
        at: { mark: draw-diff }
        upsertIds: [b2-diff-box, b2-diff-plus, b2-diff-minus, b2-diff-label]
        drawMs: 2400
      - id: close-board-2
        type: whiteboard.apply
        at: { mark: close-board-2 }
        open: false
      - id: collapse-dock-early
        type: runtime.collapseDock
        at: { afterAction: close-board-2 }
      - id: open-entry-browser
        type: workspace.openFile
        at: { mark: close-board-2, offsetMs: 700 }
        path: src/framework/entry.browser.jsx
      - id: select-hydrate-import
        type: editor.select
        at: { mark: select-hydrate-import }
        target:
          {
            file: src/framework/entry.browser.jsx,
            text: 'import { hydrateRoot } from "react-dom/client";',
            occurrence: 1,
          }
      - id: select-hydrate
        type: editor.select
        at: { mark: select-hydrate }
        target:
          {
            file: src/framework/entry.browser.jsx,
            text: "hydrateRoot(\n    document,",
            occurrence: 1,
          }
      - id: select-strict
        type: editor.select
        at: { mark: select-strict }
        target: { file: src/framework/entry.browser.jsx, text: "<StrictMode>", occurrence: 1 }

  # ------------------------------------------------------------------ 3
  - id: context-code
    chapter: "Server Component ထဲမှာ context"
    narration: >
      [[mark:preview-opens]] dev server က အသင့် ဖြစ်နေပြီမို့ preview ကို
      ဖွင့်ရအောင်။ [[mark:after-preview]] ဒါက lesson 12 က ကိုယ့် ဆိုင်ပါပဲ။ menu
      ရော၊ order မှာတဲ့ form ရော ရှိနေပါတယ်။ [[mark:open-context]] ပထမ feature
      အနေနဲ့ ဆိုင် ဖွင့်ချိန်ကို context ကနေ ပြပါမယ်။ context ဖိုင်က အခု အလွတ်ပါ။
      [[mark:type-context-directive]] ဖိုင်ကို use client နဲ့ အရင် စပါတယ်။
      [[mark:type-context]] ပြီးတော့ context ကို ဖန်တီးပါတယ်။ Server Component က
      context ကို ဖန်တီးလို့ မရပါဘူး၊ server ဘက် React မှာ createContext
      မပါလို့ပါ။ [[mark:open-hours]] နောက်ဖိုင်က အဲဒါကို ဖတ်မယ့် Client Component
      လေးပါ။ [[mark:type-hours]] သူက lesson 5 လိုပဲ use နဲ့ context ကို ဖတ်ပါတယ်။
      context ကို ဖတ်တာက Client Component ထဲမှာပဲ ရလို့၊ ဒီ ဖိုင်ကလည်း use client
      နဲ့ စပါတယ်။ [[mark:open-app-context]] Server Component ဖြစ်တဲ့ App ဆီ
      ပြန်သွားရအောင်။ [[mark:wire-context-import]] နှစ်ဖိုင်လုံးကို ယူပါတယ်။
      [[mark:wire-context-use]] ဒီ အပိုင်းကတော့ အသစ်ပါ။
      [[mark:select-context-provider]] App က context ကို provider အနေနဲ့
      တိုက်ရိုက် render လုပ်ပြီး၊ ဖွင့်ချိန်ကို သူ့ တန်ဖိုး အဖြစ် ပေးထားပါတယ်။
      [[mark:after-context]] ဆိုင်နာမည် အောက်မှာ ဖွင့်ချိန် ပေါ်လာပါပြီ။
      တန်ဖိုးကို server က ပေးပြီး၊ Client Component က context ကနေ ဖတ်တာပါ။
    sources:
      - title: "React 19.3 — Context in Server Components"
        url: "https://react.dev/blog/2026/09/09/react-19-3"
      - title: "React — createContext"
        url: "https://react.dev/reference/react/createContext"
      - title: "React — use"
        url: "https://react.dev/reference/react/use"
    actions:
      - id: wait-for-server
        type: runtime.waitForReady
        at: { mark: preview-opens }
        timeoutMs: 20000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-server }
        timeoutMs: 15000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-title
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: title }
        textContains: "ရွှေရန်ကုန် မုန့်ဟင်းခါးဆိုင်"
        retry: { maxAttempts: 3, delayMs: 400 }
      - id: collapse-dock
        type: runtime.collapseDock
        at: { afterAction: expect-title }
      - id: expect-menu
        type: expect.preview
        at: { mark: after-preview }
        timeoutMs: 5000
        target: { by: testId, value: menu }
        textContains: "မုန့်ဟင်းခါး"
        retry: { maxAttempts: 3, delayMs: 400 }
      - id: open-context
        type: workspace.openFile
        at: { mark: open-context }
        path: src/ShopContext.jsx
      - id: type-context-directive
        type: editor.type
        at: { mark: type-context-directive }
        cadence: fast-explainer
        target: { file: src/ShopContext.jsx, after: "", occurrence: 1 }
        text: "\"use client\";\n"
      - id: type-context
        type: editor.type
        at: { mark: type-context }
        cadence: line-by-line
        target: { file: src/ShopContext.jsx, after: "\"use client\";\n", occurrence: 1 }
        text: "import { createContext } from \"react\";\n\nexport const ShopContext = createContext(\"\");\n"
      - id: open-hours
        type: workspace.openFile
        at: { mark: open-hours }
        path: src/ShopHours.jsx
      - id: type-hours
        type: editor.type
        at: { mark: type-hours }
        cadence: line-by-line
        target: { file: src/ShopHours.jsx, after: "", occurrence: 1 }
        text: "\"use client\";\nimport { use } from \"react\";\nimport { ShopContext } from \"./ShopContext.jsx\";\n\nexport function ShopHours() {\n  const hours = use(ShopContext);\n  return <p className=\"muted\" data-testid=\"shop-hours\">ဖွင့်ချိန် · {hours}</p>;\n}\n"
      - id: open-app-context
        type: workspace.openFile
        at: { mark: open-app-context, offsetMs: 400 }
        path: src/App.jsx
      - id: wire-context-import
        type: editor.type
        at: { mark: wire-context-import }
        cadence: block
        target:
          {
            file: src/App.jsx,
            after: "import { OrderForm } from \"./OrderForm.jsx\";\n",
            occurrence: 1,
          }
        text: "import { ShopContext } from \"./ShopContext.jsx\";\nimport { ShopHours } from \"./ShopHours.jsx\";\n"
      - id: wire-context-use
        type: editor.type
        at: { mark: wire-context-use }
        cadence: block
        target: { file: src/App.jsx, after: "          </header>\n", occurrence: 1 }
        text: "          <ShopContext value=\"မနက် ၆ နာရီ မှ ညနေ ၆ နာရီ အထိ\">\n            <ShopHours />\n          </ShopContext>\n"
      - id: select-context-provider
        type: editor.select
        at: { mark: select-context-provider }
        target:
          {
            file: src/App.jsx,
            text: '<ShopContext value="မနက် ၆ နာရီ မှ ညနေ ၆ နာရီ အထိ">',
            occurrence: 1,
          }
      - id: expect-hours
        type: expect.preview
        at: { mark: after-context }
        timeoutMs: 5000
        target: { by: testId, value: shop-hours }
        textContains: "မနက် ၆ နာရီ"
        retry: { maxAttempts: 3, delayMs: 1000 }

  # ------------------------------------------------------------------ 4
  - id: context-board
    narration: >
      [[mark:draw-ctx-before]] React 19.3 မတိုင်ခင်က ဒီလို မရခဲ့ပါဘူး။ တန်ဖိုး
      တစ်ခု အောက်ကို ပို့ရုံလေးအတွက်တောင်၊ use client wrapper component တစ်ခု
      ထပ်ရေးခဲ့ရပါတယ်။ [[mark:draw-ctx-now]] အခုတော့ wrapper မလိုဘဲ၊ Server
      Component က context ကို ကိုယ်တိုင် render လုပ်ပါတယ်။ [[mark:draw-ctx-rule]]
      ဆိုတော့ မှတ်ရမှာက၊ context ကို use client ဖိုင်ထဲမှာ ဖန်တီးပြီး၊ render
      ကိုတော့ server မှာလည်း လုပ်နိုင်ပါတယ်။
    sources:
      - title: "React 19.3 — Context in Server Components"
        url: "https://react.dev/blog/2026/09/09/react-19-3"
      - title: "React — 'use client'"
        url: "https://react.dev/reference/rsc/use-client"
    actions:
      - id: draw-ctx-before
        type: whiteboard.apply
        at: { mark: draw-ctx-before }
        open: true
        clear: true
        upsertIds: [b3-title, b3-before-label, b3-before]
        drawMs: 2000
      - id: draw-ctx-now
        type: whiteboard.apply
        at: { mark: draw-ctx-now }
        upsertIds: [b3-before-strike, b3-now-label, b3-now]
        drawMs: 2000
      - id: draw-ctx-rule
        type: whiteboard.apply
        at: { mark: draw-ctx-rule }
        upsertIds: [b3-rule-box, b3-rule-create, b3-rule-render]
        drawMs: 2200

  # ------------------------------------------------------------------ 5
  - id: browser-board
    chapter: "browser() နဲ့ browser ထဲမှာပဲ render လုပ်ရအောင်"
    narration: >
      [[mark:draw-browser-title]] time zone ဥပမာကို ပြန်ကြည့်ရအောင်။ server က
      ကြည့်နေသူရဲ့ time zone ကို မသိပါဘူး။ [[mark:draw-browser-problem]] ဒီအတိုင်း
      render လုပ်ရင် server နဲ့ browser က time zone မတူလို့ hydration မှာ
      မကိုက်တော့ပါဘူး။ [[mark:draw-browser-server]] ဒါအတွက် React 19.3 ရဲ့
      react-dom မှာ browser ဆိုတဲ့ function ပါလာပါတယ်။ component က အဲဒါကို use နဲ့
      ခေါ်ရင်၊ server က component ကို render မလုပ်ဘဲ၊ အနီးဆုံး Suspense ရဲ့
      fallback ကို HTML ထဲ ထည့်ပါတယ်။ [[mark:draw-browser-client]] hydration
      ပြီးမှ browser က component အစစ်ကို render လုပ်တဲ့အတွက်၊ မကိုက်ညီစရာ ဘာမှ
      မရှိတော့ပါဘူး။ [[mark:draw-browser-nowait]] browser ထဲမှာကျတော့ use က
      ဘာကိုမှ မစောင့်ပါဘူး။ component က ချက်ချင်း render လုပ်ပါတယ်။
    sources:
      - title: "React — browser"
        url: "https://react.dev/reference/react-dom/browser"
      - title: "React 19.3"
        url: "https://react.dev/blog/2026/09/09/react-19-3"
    actions:
      - id: draw-browser-title
        type: whiteboard.apply
        at: { mark: draw-browser-title }
        clear: true
        upsertIds: [b4-title]
      - id: draw-browser-problem
        type: whiteboard.apply
        at: { mark: draw-browser-problem }
        upsertIds: [b4-problem]
        drawMs: 1400
      - id: draw-browser-server
        type: whiteboard.apply
        at: { mark: draw-browser-server }
        upsertIds: [b4-server-box, b4-server-name, b4-server-l1, b4-server-l2]
        drawMs: 2200
      - id: draw-browser-client
        type: whiteboard.apply
        at: { mark: draw-browser-client }
        upsertIds: [b4-arrow, b4-client-box, b4-client-name, b4-client-l1, b4-client-l2]
        drawMs: 2200
      - id: draw-browser-nowait
        type: whiteboard.apply
        at: { mark: draw-browser-nowait }
        upsertIds: [b4-nowait, b4-nowait-underline]
        drawMs: 1400

  # ------------------------------------------------------------------ 6
  - id: browser-code
    narration: >
      [[mark:close-board-browser]] ကဲ၊ editor ထဲ ပြန်သွားပြီး ရေးကြည့်ရအောင်။
      [[mark:open-timezone]] time zone ဖိုင်ကလည်း အလွတ်ပါပဲ။ [[mark:type-tz-head]]
      browser ထဲမှာပဲ render လုပ်မှာမို့ ဒါက Client Component ပါ။ react-dom ကနေ
      browser function ကို import လုပ်ပါတယ်။ [[mark:type-tz-body]] component က
      သုံးကြောင်းပဲ ပါပါတယ်။ server render ကို ရှောင်တဲ့ စာကြောင်း၊ time zone
      ဖတ်တဲ့ စာကြောင်းနဲ့ ပြတဲ့ စာကြောင်းပါ။ [[mark:select-tz-browser]] ဒီ ပထမ
      စာကြောင်းက server မှာ render မလုပ်ပါနဲ့လို့ React ကို ပြောတာပါ။ ထဲက စာသားက
      browser မှာပဲ render လုပ်ရတဲ့ အကြောင်းပြချက် ဖြစ်ပြီး၊ server ဘက် React က
      အဲဒါကို onBrowserBailout ဆိုတဲ့ callback ဆီ ပို့ပေးပါတယ်။
      [[mark:select-tz-zone]] ပြီးတော့ ဒီ Intl API က browser ရဲ့ time zone ကို
      ပေးပါတယ်။ [[mark:open-app-tz]] App ပြန်ရအောင်။ [[mark:wire-tz-import]]
      Suspense နဲ့ TimeZone ကို ယူပါတယ်။ [[mark:wire-tz-use]] ပြီးတော့ TimeZone
      ကို Suspense ထဲမှာ render လုပ်ပြီး၊ စောင့်ခိုင်းတဲ့ စာ တိုတိုကို fallback
      အဖြစ် ပေးပါတယ်။ server ရဲ့ HTML ထဲ ရောက်မှာက အဲဒီ စာပါ။ Suspense မပါရင်တော့
      server render က error နဲ့ ရပ်သွားပါတယ်။ [[mark:after-tz]] preview မှာ ဒီ
      browser ရဲ့ time zone ပေါ်လာပါပြီ။ page ပွင့်ပြီးမှ ထည့်လိုက်တာမို့ browser
      က တိုက်ရိုက် render လုပ်တာပါ။ page ကို အသစ် ဖွင့်ရင်တော့ server ရဲ့ HTML က
      စောင့်ခိုင်းတဲ့ စာကို အရင် ပြမှာပါ။
    sources:
      - title: "React — browser"
        url: "https://react.dev/reference/react-dom/browser"
      - title: "React — <Suspense>"
        url: "https://react.dev/reference/react/Suspense"
      - title: "MDN — Intl.DateTimeFormat.prototype.resolvedOptions()"
        url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Intl/DateTimeFormat/resolvedOptions"
    actions:
      - id: close-board-browser
        type: whiteboard.apply
        at: { mark: close-board-browser }
        open: false
      - id: open-timezone
        type: workspace.openFile
        at: { mark: open-timezone }
        path: src/TimeZone.jsx
      - id: type-tz-head
        type: editor.type
        at: { mark: type-tz-head }
        cadence: line-by-line
