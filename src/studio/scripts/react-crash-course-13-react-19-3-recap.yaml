        ]
      src/styles.css: |
        :root {
          --bg: #f1f3f5;
          --surface: #ffffff;
          --text: #1e1e1e;
          --muted: #5c636a;
          --line: #dee2e6;
          --accent: #1971c2;
          --accent-soft: #e7f1fb;
          --ok: #2f9e44;
          --warn: #e67700;
          --radius: 12px;
          font-family: "Noto Sans Myanmar", "Myanmar Sangam MN", "Myanmar MN", "Padauk",
            system-ui, -apple-system, "Segoe UI", sans-serif;
          font-size: 17px;
          line-height: 1.8;
          color: var(--text);
          background: var(--bg);
        }

        * {
          box-sizing: border-box;
        }

        body {
          margin: 0;
          min-height: 100vh;
        }

        .page {
          max-width: 560px;
          margin: 0 auto;
          padding: 20px 16px 40px;
          display: grid;
          gap: 14px;
        }

        .header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 12px;
          padding-bottom: 10px;
          border-bottom: 2px solid var(--line);
        }

        h1,
        h2,
        h3 {
          margin: 0;
          line-height: 1.6;
        }

        h1 {
          font-size: 1.45rem;
        }

        h2 {
          font-size: 1.15rem;
        }

        p {
          margin: 0;
        }

        .muted {
          color: var(--muted);
        }

        .card {
          display: grid;
          gap: 8px;
          padding: 14px 16px;
          border: 1px solid var(--line);
          border-radius: var(--radius);
          background: var(--surface);
          box-shadow: 0 4px 14px rgb(0 0 0 / 0.05);
        }

        .row {
          display: flex;
          align-items: center;
          gap: 10px;
          flex-wrap: wrap;
        }

        .list {
          display: grid;
          gap: 8px;
          margin: 0;
          padding: 0;
          list-style: none;
        }

        .list > li {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 10px;
          padding: 8px 12px;
          border: 1px solid var(--line);
          border-radius: 10px;
          background: var(--surface);
        }

        button {
          font: inherit;
          padding: 6px 16px;
          border: 0;
          border-radius: 999px;
          background: var(--accent);
          color: white;
          cursor: pointer;
        }

        button.secondary {
          background: var(--accent-soft);
          color: var(--accent);
        }

        button:disabled {
          background: var(--line);
          color: var(--muted);
          cursor: not-allowed;
        }

        input,
        select,
        textarea {
          font: inherit;
          width: 100%;
          padding: 6px 12px;
          border: 1px solid var(--line);
          border-radius: 10px;
          background: var(--surface);
          color: var(--text);
        }

        input:focus,
        select:focus,
        textarea:focus,
        button:focus-visible {
          outline: 2px solid var(--accent);
          outline-offset: 2px;
        }

        .badge {
          display: inline-block;
          padding: 0 10px;
          border-radius: 999px;
          background: var(--accent-soft);
          color: var(--accent);
          font-size: 0.85rem;
        }

        .badge.ok {
          background: #ebfbee;
          color: var(--ok);
        }

        .badge.warn {
          background: #fff4e6;
          color: var(--warn);
        }

        /* Lesson 12: buttons inside a card keep their own width. */
        .card > button {
          justify-self: start;
        }
      src/App.jsx: |
        import { getMenu, getOrders } from "./db.js";
        import { AddButton } from "./AddButton.jsx";
        import { OrderForm } from "./OrderForm.jsx";
        import "./styles.css";

        export default async function App() {
          const menu = await getMenu();
          const orders = getOrders();
          return (
            <html lang="my">
              <head>
                <meta charSet="UTF-8" />
                <meta name="viewport" content="width=device-width, initial-scale=1.0" />
                <title>ရွှေရန်ကုန် မုန့်ဟင်းခါးဆိုင်</title>
              </head>
              <body>
                <main className="page">
                  <header className="header">
                    <h1 data-testid="title">ရွှေရန်ကုန် မုန့်ဟင်းခါးဆိုင်</h1>
                  </header>
                  <p className="muted" data-testid="order-count">
                    မှာထားတာ {orders.length} ခု
                  </p>
                  <ul className="list" data-testid="menu">
                    {menu.map((dish) => (
                      <li key={dish.id}>
                        <span>{dish.name}</span>
                        <AddButton id={dish.id} price={dish.price} />
                      </li>
                    ))}
                  </ul>
                  <OrderForm dishes={menu.map((dish) => dish.name)} />
                </main>
              </body>
            </html>
          );
        }
      src/AddButton.jsx: |
        "use client";
        import { useState } from "react";

        export function AddButton({ id, price }) {
          const [count, setCount] = useState(0);
          return (
            <button data-testid={"add-" + id} onClick={() => setCount(count + 1)}>
              + {count} ({(count * price).toLocaleString("en-US")} ကျပ်)
            </button>
          );
        }
      src/actions.js: |
        "use server";
        import { addOrder, getMenu } from "./db.js";

        export async function placeOrder(previousState, formData) {
          const dish = formData.get("dish");
          const menu = await getMenu();
          if (!menu.some((item) => item.name === dish)) return "ဟင်းလျာ ရွေးပါ";
          addOrder(dish);
          return dish + " မှာပြီးပါပြီ";
        }
      src/OrderForm.jsx: |
        "use client";
        import { useActionState } from "react";
        import { placeOrder } from "./actions.js";

        export function OrderForm({ dishes }) {
          const [message, formAction, isPending] = useActionState(placeOrder, "");
          return (
            <form action={formAction} className="card">
              <label>
                ဟင်းလျာ
                <select name="dish" data-testid="order-dish">
                  {dishes.map((dish) => (
                    <option key={dish}>{dish}</option>
                  ))}
                </select>
              </label>
              <button data-testid="submit-order" disabled={isPending}>မှာမယ်</button>
              <p data-testid="order-message">{message}</p>
            </form>
          );
        }
      src/ShopContext.jsx: ""
      src/ShopHours.jsx: ""
      src/TimeZone.jsx: ""
      src/OrderDetails.jsx: ""

