      နဲ့ Effect တွေကို လေ့လာခဲ့ပါတယ်။ [[mark:draw-recap-3]] နောက်တော့ app ကို
      မြန်အောင် လုပ်ခဲ့ပြီး၊ Suspense နဲ့ data ကို စောင့်ခဲ့ပါတယ်။ form တွေကိုတော့
      Action နဲ့ ပို့ခဲ့ပါတယ်။ [[mark:draw-recap-4]] Activity က ဖျောက်ထားတဲ့ UI
      ရဲ့ state ကို မှတ်ထားပေးပြီး၊ ViewTransition က animation ထည့်ခဲ့ပါတယ်။
