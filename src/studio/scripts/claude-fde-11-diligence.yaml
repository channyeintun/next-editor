  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ အဖြေ ၆၄ စောင်အတွက် တာဝန်ယူရတာက နေခြည် ကုမ္ပဏီပါ။ ရှေ့လျှောက်မှာတော့ ပို့သူက စာကို
      တာဝန်ယူပြီး မပို့ခင် စစ်ရပါမယ်။ ပွင့်လင်းမှု၊ data ကို ကာကွယ်တာနဲ့ မှတ်တမ်း ထားတာက အဲဒီ တာဝန်ကို ထမ်းနိုင်အောင်
      ကူညီပါတယ်။ ဒါကို team ကိုယ်တိုင် ရေးထားတာက Diligence ပါ။
      [[mark:recap-2]] ဒီ lesson နဲ့ 4D framework ရဲ့ အလေ့အကျင့် လေးခု ပြီးသွားပါပြီ။ ဘာကို ပေးမလဲ၊ ဘယ်လို ပြောမလဲ၊
      ဘယ်လို စစ်မလဲ၊ ဘယ်သူ တာဝန်ယူမလဲ ဆိုတဲ့ မေးခွန်း လေးခုကို AI နဲ့ အလုပ်လုပ်တိုင်း မေးပါ။ မုန်တိုင်းကျတဲ့ညကို ပြန်ကြည့်ရင်
      ဒီ လေးခုလုံး မရှိခဲ့ပါဘူး။ အဖြေ ရေးတာကို AI ကို ပေးဖို့ ဘယ်သူမှ မဆုံးဖြတ်ခဲ့သလို၊ လိုင်းကျနေတာကို model ကို မပြောပြခဲ့၊
      draft ကို မစစ်ခဲ့၊ ဘယ်သူ တာဝန်ယူမလဲ ဆိုတာလည်း မသတ်မှတ်ခဲ့ပါဘူး။
      [[mark:next]] နောက် lesson မှာတော့ prompt တစ်ကြောင်းမှ မရေးခင် ချရမယ့် ဆုံးဖြတ်ချက် လေးခုထဲက ပထမဆုံး ဖြစ်တဲ့
      entry point ကို လေ့လာပါမယ်။ entry point ဆိုတာ Claude ကို ဘယ်နေရာကနေ သုံးမလဲ ဆိုတာပါ။ နေခြည် မှာ အလုပ်
      မတူတဲ့ အဖွဲ့ သုံးဖွဲ့အတွက် ဘယ် entry point ကို ရွေးမလဲ ဆိုတာကို လေ့လာသွားပါမယ်။
