      သုံးကြောင်းကို ဒီ file ရဲ့ အောက်မှာ ရေးကြည့်ပါ။ AI နဲ့ လုပ်တဲ့ အလုပ်ကို ဘယ်သူ ပို့သလဲ ဒါမှမဟုတ် ship လုပ်သလဲ၊
      မပို့ခင် ဘာကို စစ်မလဲ၊ ဘယ် data ကို ဘယ်မှာ ထည့်ခွင့်ရှိလဲ ဆိုတဲ့ သုံးခုနဲ့ စလို့ ရပါတယ်။
