build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 9311

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: who-answers
    chapter: အဖြေ ၆၄ စောင်အတွက် ဘယ်သူ တာဝန်ယူမလဲ
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ Discernment ကို လေ့လာခဲ့ပါတယ်။ AI ပြန်ပေးတဲ့ code နဲ့ customer reply ကို မယုံခင်၊ code
      မျက်လုံးနဲ့ customer မျက်လုံး နှစ်ခုနဲ့ စစ်တာပါ။
      [[mark:w-open]] ဒီနေ့တော့ ဒီ course ရဲ့ အစက မေးခွန်း တစ်ခုကို ပြန်မေးပါမယ်။ မုန်တိုင်းကျတဲ့ညက လိုင်းကျနေတဲ့
      customer တွေကို router ပြန်ဖွင့်ခိုင်းခဲ့တဲ့ အဖြေ ၆၄ စောင်အတွက် ဘယ်သူ တာဝန်ယူရမလဲ။ support manager လှလှ
      ရဲ့ team ထဲမှာ ဒီ မေးခွန်းကို မေးတိုင်း အားလုံး တိတ်သွားတတ်ပါတယ်။
      [[mark:w-model]] model က တာဝန်ယူလို့ မရပါဘူး။ တောင်းပန်စာကို ရေးပေးနိုင်ပေမဲ့၊ customer ကို ကိုယ်စားပြုပြီး
      ဖြေရှင်းပေးဖို့နဲ့ နောက်တစ်ခါ မဖြစ်အောင် အလုပ်လုပ်ပုံကို ပြောင်းဖို့ကတော့ လူတွေရဲ့ အလုပ်ပါ။ model က စာကို ရေးပေးတဲ့ program တစ်ခုပဲ ဖြစ်ပါတယ်။
      [[mark:w-agents]] အဖြေ ပို့ခဲ့တဲ့ support agent တွေကို အပြစ်ပုံချရင်လည်း မမျှတပါဘူး။ ticket တွေ လေးဆ ဝင်နေတဲ့
      ညမှာ စစ်ဖို့ အချိန်လည်း မရှိခဲ့သလို၊ ဘာကို စစ်ရမလဲ ဆိုတဲ့ စည်းကမ်းလည်း မရှိခဲ့ပါဘူး။
      [[mark:w-answer]] ဒါကြောင့် အဲဒီညအတွက် တာဝန်ယူရတာက နေခြည် ကုမ္ပဏီ ကိုယ်တိုင်ပါ။ customer ဆီ ရောက်သွားတဲ့
      စာတိုင်းက နေခြည် ရဲ့ စာ ဖြစ်လို့ပါ။
      [[mark:w-ahead]] ဒါပေမဲ့ ရှေ့လျှောက် ဒီ မေးခွန်းကို ထပ်မေးရင် ဘယ်သူလဲ ဆိုတာ ချက်ချင်း ဖြေနိုင်အောင်
      ကြိုသတ်မှတ်ထားရပါမယ်။ ဒါက 4D framework ရဲ့ နောက်ဆုံး အလေ့အကျင့် Diligence ပါ။ AI ကူလုပ်ပေးထားပေမဲ့၊ ထွက်သွားတဲ့
      အလုပ်ကို ကိုယ့်အလုပ်လို့ သဘောထားပြီး ရှေ့ထွက် ဖြေရှင်းတာပါ။
    sources:
      - {
          title: "AI Fluency Framework by Rick Dakan, Joseph Feller and Anthropic, CC BY-NC-SA 4.0",
          url: "https://www-cdn.anthropic.com/b383cf6baddbfc72fdf8b0ed533a518e2872d531.pdf",
        }
      - {
          title: "AI Fluency for Builders (Anthropic and CodePath, public course description)",
          url: "https://anthropic.skilljar.com/ai-fluency-for-builders",
        }
    actions:
      - {
          id: draw-w-open,
          type: whiteboard.apply,
          at: { mark: w-open },
          open: true,
          upsertIds: [w-title],
        }
      - {
          id: draw-w-model,
          type: whiteboard.apply,
          at: { mark: w-model },
          upsertIds: [w-1, w-1x],
          drawMs: 1200,
        }
      - {
          id: draw-w-agents,
          type: whiteboard.apply,
          at: { mark: w-agents },
          upsertIds: [w-2, w-2x],
          drawMs: 1200,
        }
      - {
          id: draw-w-answer,
          type: whiteboard.apply,
          at: { mark: w-answer },
          upsertIds: [w-3, w-3ok],
          drawMs: 1200,
        }
      - {
          id: draw-w-ahead,
          type: whiteboard.apply,
          at: { mark: w-ahead },
          upsertIds: [w-4],
          drawMs: 1000,
        }

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ မုန်တိုင်းကျတဲ့ည ပြီးတော့ team ထဲကနေ အကြံ နှစ်ခု ထွက်လာပါတယ်။
      ဘယ်အကြံက Diligence ကို ပြလဲ။
      [[mark:q-a]] ပထမ အကြံက AI ရေးတဲ့ reply တိုင်းရဲ့ အောက်ဆုံးမှာ AI ရေးထားတာမို့ မှားနိုင်ပါတယ် ဆိုတဲ့ စာကြောင်း
      တစ်ကြောင်း ထည့်တာပါ။
      [[mark:q-b]] ဒုတိယ အကြံက support agent က draft တစ်စောင်ချင်းကို ticket နဲ့ NMS တို့နဲ့ တိုက်စစ်ပြီးမှ ပို့တာပါ။
      lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ အကြံပါ။ ဘာကြောင့်လဲဆိုတော့ ပထမ အကြံက စစ်ရမယ့် တာဝန်ကို customer ဆီ
      လွှဲပေးလိုက်တာ ဖြစ်လို့ပါ။ internet မရလို့ စာပို့လာတဲ့ customer က ဘယ်စာကြောင်း မှားနေလဲ ဆိုတာကို ဘယ်လိုမှ
      မစစ်နိုင်ပါဘူး။ AI ပါတယ်လို့ ပြောတာက ပွင့်လင်းမှု ဖြစ်နိုင်ပေမဲ့၊ စစ်ဆေးမှုကိုတော့ အစားမထိုးနိုင်ပါဘူး။
      [[mark:q-rule]] ဒါကြောင့် Diligence ရဲ့ ပထမ စည်းကမ်းက customer ဆီ ပို့တဲ့သူက စာကို တာဝန်ယူတာနဲ့၊ မပို့ခင်
      စစ်တာ ဖြစ်ပါတယ်။
    sources:
      - {
          title: "AI Fluency Framework by Rick Dakan, Joseph Feller and Anthropic, CC BY-NC-SA 4.0",
          url: "https://www-cdn.anthropic.com/b383cf6baddbfc72fdf8b0ed533a518e2872d531.pdf",
        }
      - {
          title: "Claude Docs: Reduce hallucinations (always validate critical information)",
          url: "https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: q-rule },
          upsertIds: [q-t1, q-t2],
          drawMs: 1600,
        }

  - id: path
    chapter: reply တစ်စောင်ရဲ့ လမ်းကြောင်း
    narration: >
      [[mark:p-open]] ဒါကို reply တစ်စောင်ရဲ့ လမ်းကြောင်းနဲ့ ကြည့်ရအောင်။ အဆင့် တစ်ခုစီမှာ ဘယ်သူ တာဝန်ယူလဲ ဆိုတာ
      နာမည်တပ်ထားရပါမယ်။
      [[mark:p1]] ပထမ အဆင့်က AI က draft ရေးတာပါ။ draft ရဲ့ အရည်အသွေးကို တာဝန်ယူတာက Reply assistant ကို ဆောက်မယ့်
      FDE ဖြစ်တဲ့ ကိုယ်နဲ့၊ ဒီ use case ကို ပိုင်တဲ့ လှလှ ပါ။ use case ဆိုတာ AI နဲ့ ဖြေရှင်းမယ့် အလုပ် တစ်မျိုးပါ။ system
      prompt၊ စစ်ချက်နဲ့ test တွေကို ကိုယ်တို့ တာဝန်ယူပြီး၊ draft တွေ မကြာခဏ မှားနေရင် ပြင်ရမှာလည်း ကိုယ်တို့ပါ။
      [[mark:p2]] ဒုတိယ အဆင့်က စစ်တာပါ။ support agent က ticket နဲ့ NMS ကို တိုက်ပြီး draft ကို စစ်ပါတယ်။ ဒါက လူ
      စစ်တဲ့ နေရာမို့ ကျော်လို့ မရပါဘူး။ ticket တွေ များတဲ့ညမှာ ဒီ အဆင့်ကို ကျော်ချင်စိတ် ပေါ်လာတတ်ပါတယ်။ အဲဒီအခါမှာ
      မြန်မြန် ပို့တာထက် မှန်မှန် ပို့တာက ပိုအရေးကြီးပါတယ်။
      [[mark:p2-fast]] ဒါပေမဲ့ စစ်တာက ရေးတာထက် ကြာနေရင် လူတွေ ကျော်ကြပါလိမ့်မယ်။ ဒါကြောင့် စစ်ရ မြန်အောင် design ဆွဲတာက
      FDE ရဲ့ တာဝန်ပါ။ ဥပမာ Reply assistant က draft ရေးတဲ့အခါ ဘယ် NMS အချက်အလက်ကို သုံးခဲ့လဲ ဆိုတာကို draft ဘေးမှာ
      ပြပေးရင်၊ support agent က တစ်ချက်ကြည့်ရုံနဲ့ တိုက်စစ်နိုင်ပါတယ်။
      [[mark:p3]] တတိယ အဆင့်က customer ဆီ ပို့တာပါ။ ပို့ခလုတ်ကို နှိပ်လိုက်တဲ့ support agent က အဲဒီ စာကို တာဝန်ယူပါတယ်။
      AI က ရေးပေးခဲ့ပေမဲ့ ပို့လိုက်တဲ့ အချိန်ကစပြီး ကိုယ့်စာ ဖြစ်သွားပါပြီ။ developer တစ်ယောက်က AI ရေးပေးတဲ့ code ကို
      merge လုပ်လိုက်ရင်လည်း အဲဒီ code ကို အဲဒီ developer က တာဝန်ယူတာ အတူတူပါပဲ။
      [[mark:p-point]] တာဝန်ယူတယ် ဆိုတာ မှားတိုင်း အပြစ်ပေးမယ်လို့ ဆိုလိုတာ မဟုတ်ပါဘူး။ မှားသွားရင် ဘယ်သူ ပြင်မလဲ၊
      customer ကို ဘယ်သူ ရှင်းပြမလဲ ဆိုတာ ရှင်းနေတာကို ဆိုလိုတာပါ။
    sources:
      - {
          title: "AI Fluency Framework by Rick Dakan, Joseph Feller and Anthropic, CC BY-NC-SA 4.0",
          url: "https://www-cdn.anthropic.com/b383cf6baddbfc72fdf8b0ed533a518e2872d531.pdf",
        }
      - {
          title: "Anthropic Engineering: Building effective agents (test with guardrails; transparency)",
          url: "https://www.anthropic.com/engineering/building-effective-agents",
        }
    actions:
      - {
          id: draw-p-open,
          type: whiteboard.apply,
          at: { mark: p-open },
          clear: true,
          upsertIds: [p-title],
        }
      - {
          id: draw-p1,
          type: whiteboard.apply,
          at: { mark: p1 },
          upsertIds: [p-b1, p-l1, p-o1],
          drawMs: 1500,
        }
      - {
          id: draw-p2,
          type: whiteboard.apply,
          at: { mark: p2 },
          upsertIds: [p-a1, p-b2, p-l2, p-ok, p-o2],
          drawMs: 2000,
        }
      - {
          id: draw-p3,
          type: whiteboard.apply,
          at: { mark: p3 },
          upsertIds: [p-a2, p-b3, p-l3, p-o3],
          drawMs: 1800,
        }
      - { id: point-p-ok, type: whiteboard.point, at: { mark: p-point }, target: { assetId: p-b2 } }

  - id: three-more
    chapter: ပွင့်လင်းမှု၊ data နဲ့ မှတ်တမ်း
    narration: >
      [[mark:o-open]] ပို့သူ တာဝန်ယူတာနဲ့ မပို့ခင် စစ်တာ အပြင်၊ အဲဒီ တာဝန်ကို တကယ် ထမ်းနိုင်အောင် ကူညီတဲ့ အလေ့အကျင့်
      သုံးခု ထပ်ရှိပါတယ်။
      [[mark:o1]] ပထမ တစ်ခုက ပွင့်လင်းမှုပါ။ AI ပါတယ် ဆိုတာ သိဖို့ လိုတဲ့သူကို ပြောတာပါ။ customer က ဒီစာ AI ရေးတာလားလို့
      တကယ် မေးလာရင် မှန်မှန် ပြောရပါမယ်။ CTO ဖြစ်တဲ့ အောင်အောင် ဆီ ပို့မယ့် report မှာလည်း ဘယ်အပိုင်းကို AI နဲ့
      လုပ်ခဲ့လဲ ဆိုတာ ထည့်ရေးပါ။ framework ကို ရေးတဲ့ ပညာရှင်တွေကိုယ်တိုင်လည်း သူတို့ document ရဲ့ အဆုံးမှာ ဘယ် AI
      ကူခဲ့လဲ၊ အားလုံးကို သူတို့ စစ်ပြီး တာဝန်ယူတယ် ဆိုတာ ရေးထားပါတယ်။
      [[mark:o2]] ဒုတိယ တစ်ခုက data ကို ကာကွယ်တာပါ။ မုန်တိုင်းကျတဲ့ညက ticket စာသားတွေကို personal account တွေထဲ
      ကူးထည့်ခဲ့ကြပါတယ်။ အဲဒီ စာသားတွေထဲမှာ customer ရဲ့ နာမည်၊ ဖုန်းနံပါတ်နဲ့ လိပ်စာတွေ ပါပါတယ်။ ဒါက support agent
      တွေ ပေါ့ဆလို့ မဟုတ်ပါဘူး။ customer data ကို ဘယ်မှာ ထည့်ခွင့်ရှိလဲ ဆိုတာ ဘယ်သူမှ မသတ်မှတ်ထားခဲ့လို့ပါ။
      [[mark:o3]] တတိယ တစ်ခုက မှတ်တမ်းပါ။ AI ရေးတဲ့ draft ကို ဘယ်သူ စစ်ပြီး ဘယ်အချိန် ပို့လဲ ဆိုတာ ticket မှာ
      မှတ်ထားရင်၊ မှားတဲ့ အဖြေ တစ်စောင် တွေ့တဲ့အခါ ဘယ်အဆင့်မှာ လွတ်သွားလဲ ပြန်ရှာနိုင်ပါတယ်။ မုန်တိုင်းကျတဲ့ညက
      ၆၄ စောင် ဆိုတဲ့ ဂဏန်းကိုတောင် customer တွေ ပြန်တိုင်ကြားမှ သိခဲ့ရတာပါ။ မှတ်တမ်း ရှိရင်တော့ လှလှ က အပတ်တိုင်း
      draft နမူနာ တချို့ကို ပြန်ဖတ်ပြီး၊ ပြဿနာကို customer မတိုင်ကြားခင် ကိုယ်တိုင် အရင် တွေ့နိုင်ပါတယ်။
    sources:
      - {
          title: "AI Fluency Framework by Rick Dakan, Joseph Feller and Anthropic, CC BY-NC-SA 4.0",
          url: "https://www-cdn.anthropic.com/b383cf6baddbfc72fdf8b0ed533a518e2872d531.pdf",
        }
      - {
          title: "The Framework for AI Fluency, Practical Summary Document v1.1 (its closing Diligence Statement)",
          url: "https://ringling.libguides.com/ai/framework",
        }
      - {
          title: "Claude's constitution (honesty: not denying being an AI when sincerely asked)",
          url: "https://www.anthropic.com/constitution",
        }
    actions:
      - {
          id: close-path,
          type: whiteboard.apply,
          at: { mark: o-open, offsetMs: -1500 },
          open: false,
        }
      - { id: show-three, type: slide.show, at: { afterAction: close-path }, slideId: three-habits }
      - { id: point-o1, type: slide.point, at: { mark: o1 }, target: { x: 0.15, y: 0.43 } }
      - { id: point-o2, type: slide.point, at: { mark: o2 }, target: { x: 0.15, y: 0.59 } }
      - { id: point-o3, type: slide.point, at: { mark: o3 }, target: { x: 0.15, y: 0.75 } }

  - id: agreement
    chapter: team ကိုယ်တိုင် ရေးတဲ့ သဘောတူညီချက်
    narration: >
      [[mark:a-open]] ဒီ အချက်တွေကို support team ရဲ့ AI သုံးပုံ သဘောတူညီချက်အဖြစ် ရေးကြည့်ရအောင်။ အရေးကြီးတာက
      ဒီ စာကို FDE တစ်ယောက်တည်း ရေးပြီး ကပ်ပေးလိုက်တာ မဟုတ်ဘဲ၊ support agent တွေနဲ့ လှလှ အတူ ထိုင်ရေးတာပါ။ ကိုယ်တိုင်
      ရေးထားတဲ့ စည်းကမ်းကို လူတွေက ပိုလိုက်နာတတ်လို့ပါ။ စာမျက်နှာ အများကြီး ရှိတဲ့ policy ထက်၊ မှတ်မိနိုင်တဲ့ စာကြောင်း
      ငါးကြောင်းကို ရွေးပါတယ်။
      [[mark:type-a1]] ပထမ စာကြောင်းက ပို့သူ တာဝန်ယူတယ် ဆိုတာပါ။ AI ရေးတဲ့ စာ ဖြစ်ပေမဲ့ ပို့လိုက်ရင် ကိုယ့်စာပဲ
      ဆိုတာကို support agent တိုင်း သိထားဖို့ပါ။
      [[mark:type-a2]] ဒုတိယ စာကြောင်းက မပို့ခင် စစ်တာပါ။ ဘာနဲ့ စစ်ရမလဲ ဆိုတာကိုပါ ရေးထားပြီး၊ မသေချာရင် မပို့ဘဲ
      shift lead ကို မေးရမယ် ဆိုတာ ထည့်ထားပါတယ်။ အလုပ်များတဲ့ညမှာ ဆုံးဖြတ်ရ ခက်တဲ့ အချိန်အတွက်ပါ။
      [[mark:type-a3]] တတိယ စာကြောင်းက data ပါ။ customer data ကို personal AI account ထဲ မထည့်ရပါဘူး။ ကုမ္ပဏီက
      ခွင့်ပြုထားတဲ့ tool ရောက်လာမှ အဲဒီ tool ထဲမှာပဲ သုံးပါမယ်။
      [[mark:type-a4]] စတုတ္ထ စာကြောင်းက ပွင့်လင်းမှုပါ။ customer က AI ရေးတာလားလို့ မေးရင် မှန်မှန် ဖြေမယ် ဆိုတာပါ။
      [[mark:type-a5]] နောက်ဆုံး စာကြောင်းက မှတ်တမ်းပါ။ AI draft ကို သုံးတိုင်း ဘယ်သူ စစ်ပြီး ပို့လဲ ticket မှာ
      မှတ်ထားပါမယ်။ ဒီ သဘောတူညီချက်ကို သုံးလ တစ်ခါ ပြန်ကြည့်ပြီး လိုသလို ပြင်ပါမယ်။
    sources:
      - {
          title: "AI Fluency Framework by Rick Dakan, Joseph Feller and Anthropic, CC BY-NC-SA 4.0",
          url: "https://www-cdn.anthropic.com/b383cf6baddbfc72fdf8b0ed533a518e2872d531.pdf",
        }
      - {
          title: "Creative Commons CC BY-NC-SA 4.0 licence",
          url: "https://creativecommons.org/licenses/by-nc-sa/4.0/deed.en",
        }
    actions:
      - { id: close-three, type: slide.close, at: { mark: a-open } }
      - {
          id: open-agreement,
          type: workspace.openFile,
          at: { afterAction: close-three },
          path: notebook/11-working-agreement.md,
        }
      - id: type-a1
        type: editor.type
        at: { mark: type-a1 }
        cadence: line-by-line
        target: { file: notebook/11-working-agreement.md, after: "3 လ တစ်ခါ ပြန်ကြည့်မယ်။\n" }
        text: "\n1. customer ဆီ ပို့တဲ့သူက အဲဒီ reply ကို တာဝန်ယူတယ်။ AI ရေးတာလည်း ကိုယ့်စာပဲ\n"
      - id: type-a2
        type: editor.type
        at: { mark: type-a2 }
        cadence: line-by-line
        target: { file: notebook/11-working-agreement.md, after: "AI ရေးတာလည်း ကိုယ့်စာပဲ\n" }
        text: "2. မပို့ခင် ticket နဲ့ NMS ကို တိုက်စစ်တယ်။ မသေချာရင် မပို့ဘဲ shift lead ကို မေး\n"
      - id: type-a3
        type: editor.type
        at: { mark: type-a3 }
        cadence: line-by-line
        target: { file: notebook/11-working-agreement.md, after: "shift lead ကို မေး\n" }
        text: "3. customer data ကို personal AI account ထဲ မထည့်။ ကုမ္ပဏီ tool ရောက်မှ အဲဒီမှာပဲ\n"
      - id: type-a4
