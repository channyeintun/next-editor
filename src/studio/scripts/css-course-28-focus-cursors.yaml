build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 4128

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  - id: focus-intro
    chapter: "Focus ဘာကြောင့် အရေးကြီးလဲ"
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ mouse တင်ထားတာ၊ check လုပ်ထားတာ၊ disabled ဖြစ်နေတာလို
      အခြေအနေတွေကို ကြည့်ပြီး style ပေးခဲ့ပါတယ်။ ဒီ lesson မှာတော့ ချန်ထားခဲ့တဲ့ focus ကို
      ကြည့်ပြီး၊ mouse cursor ကိုပါ ကြည့်ပါမယ်။ [[mark:start-server]] ပြောနေတုန်းမှာပဲ၊
      board နောက်မှာ dev server ကို စနေပါပြီ။ [[mark:draw-keys]] လူတိုင်း mouse သုံးတာ
      မဟုတ်ပါဘူး။ လူအများကြီးက keyboard နဲ့ သွားလာကြပါတယ်။ Tab key နှိပ်ရင် နောက် ခလုတ်
      ဒါမှမဟုတ် field ကို ရောက်ပြီး၊ Shift နဲ့ Tab တွဲနှိပ်ရင် နောက်ပြန် ဆုတ်ပါတယ်။
      [[mark:draw-users]] ခလုတ်ကြီးတွေပဲ ပါတဲ့ switch device သုံးသူတွေ၊ screen reader သုံးသူ
      တော်တော်များများလည်း ဒီလိုပဲ သွားပါတယ်။ [[mark:draw-focus]] focus ဆိုတာ keyboard နဲ့
      စာ ရိုက်ဖို့ ဒါမှမဟုတ် နှိပ်ဖို့ အခု ရွေးထားတဲ့ element ရဲ့ အခြေအနေပါ။ ဥပမာ၊ စာလုံးတွေ
      ဝင်မယ့် field၊ ဒါမှမဟုတ် Enter နှိပ်ရင် အလုပ်လုပ်မယ့် ခလုတ် မျိုးပါ။
      [[mark:draw-ring]] focus ring ဆိုတာ အဲဒီ element ပတ်လည်မှာ ဆွဲပေးတဲ့ မျဉ်းပါ။ mouse
      သုံးသူက pointer ကို ကြည့်သလို၊ keyboard သုံးသူက ဒီ ring ကို ကြည့်ပြီး ဘယ်ရောက်နေလဲ
      သိပါတယ်။ ring မရှိရင် လမ်းပျောက်ပြီး၊ မှားတဲ့ ခလုတ်ကို နှိပ်မိနိုင်ပါတယ်။
      [[mark:draw-wcag]] ဒါကြောင့် web accessibility လမ်းညွှန်ချက် WCAG က၊ keyboard နဲ့
      သုံးလို့ ရတဲ့ အရာတိုင်းမှာ focus ကို မြင်ရရမယ်လို့ သတ်မှတ်ထားပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Focus: why is focus important"
        url: "https://web.dev/learn/css/focus#why_is_focus_important"
      - title: "MDN — :focus"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/:focus"
      - title: "WCAG 2.2 Understanding 2.4.7 Focus Visible"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/focus-visible"
    actions:
      - id: open-intro-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      # Runs in the background (boot + pnpm install + spawn); waitForReady sits
      # on the preview mark in the code tour, well over 40 s of narration later.
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 45000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-keys
        type: whiteboard.apply
        at: { mark: draw-keys }
        upsertIds: [a-keys]
        drawMs: 1600
      - id: draw-users
        type: whiteboard.apply
        at: { mark: draw-users }
        upsertIds: [a-users]
        drawMs: 1400
      - id: draw-focus
        type: whiteboard.apply
        at: { mark: draw-focus }
        upsertIds: [a-btn, a-btn-t, a-focus]
        drawMs: 1800
      - id: draw-ring
        type: whiteboard.apply
        at: { mark: draw-ring }
        upsertIds: [a-ring, a-ring-l]
        drawMs: 1600
      - id: draw-wcag
        type: whiteboard.apply
        at: { mark: draw-wcag }
        upsertIds: [a-wcag]
        drawMs: 1200

  - id: focusable
    chapter: "ဘယ် element တွေ focus ရလဲ"
    narration: >
      [[mark:open-focusable]] ဒါဆို ဘယ် element တွေက focus ရလဲ။ [[mark:draw-yes]] နှိပ်လို့
      ဒါမှမဟုတ် စာ ရိုက်လို့ ရတဲ့ element တွေပါ။ href ပါတဲ့ link၊ button၊ input၊ select၊
      textarea နဲ့ details element ရဲ့ summary တို့ပါ။ ဒါတွေက ကိုယ် ဘာမှ မလုပ်ရဘဲ focus
      ရပြီးသားပါ။ [[mark:draw-no]] စာပိုဒ်၊ div၊ span တို့ကတော့ focus မရပါဘူး။ href မပါတဲ့
      link လည်း မရပါဘူး။ disabled ဖြစ်နေတဲ့ ခလုတ်နဲ့ field တွေကိုလည်း focus က
      ကျော်သွားပါတယ်။ [[mark:draw-order]] Tab key နှိပ်တိုင်း focus က ဒီ element တွေဆီကို
      HTML ထဲမှာ ရေးထားတဲ့ အစဉ်အတိုင်း ရွှေ့သွားပါတယ်။ အဲဒီ အစဉ်ကို tab order လို့
      ခေါ်ပါတယ်။ [[mark:draw-visual]] lesson 15 က row reverse နဲ့ lesson 16 က order ဟာ
      မြင်ရတဲ့ အစဉ်ကိုပဲ ပြောင်းတယ် ဆိုတာ ကြည့်ခဲ့ပါတယ်။ ဒီ ပုံမှာတော့ ဒုတိယ link ကို
      ရှေ့ဆုံးမှာ ပြထားပါတယ်။ [[mark:draw-jump]] ဒါပေမဲ့ Tab key က HTML အစဉ်အတိုင်း 1၊ 2၊ 3
      သွားလို့၊ focus ring က ဟိုခုန် ဒီခုန် ဖြစ်နေပါတယ်။ ဒါကြောင့် HTML အစဉ်ကို မြင်ရတဲ့
      အစဉ်နဲ့ ကိုက်အောင် ရေးပါ။
    sources:
      - title: "web.dev Learn CSS — Focus: how elements get focus"
        url: "https://web.dev/learn/css/focus#how_elements_get_focus"
      - title: "MDN — tabindex (focusable elements, tab order)"
        url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Global_attributes/tabindex"
      - title: "MDN — order (accessibility concerns)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/order#accessibility"
    actions:
      - id: open-focusable
        type: whiteboard.apply
        at: { mark: open-focusable }
        clear: true
        upsertIds: [b-title]
      - id: draw-yes
        type: whiteboard.apply
        at: { mark: draw-yes }
        upsertIds: [b-yes1, b-yes2]
        drawMs: 2000
      - id: draw-no
        type: whiteboard.apply
        at: { mark: draw-no }
        upsertIds: [b-no]
        drawMs: 1400
      - id: draw-order
        type: whiteboard.apply
        at: { mark: draw-order }
        upsertIds: [b-order]
        drawMs: 1200
      - id: draw-visual
        type: whiteboard.apply
        at: { mark: draw-visual }
        upsertIds: [b-box1, b-n1, b-box2, b-n2, b-box3, b-n3, b-visual]
        drawMs: 2200
      - id: draw-jump
        type: whiteboard.apply
        at: { mark: draw-jump }
        upsertIds: [b-jump]
        drawMs: 1400

  - id: tabindex
    narration: >
      [[mark:open-tabindex]] focus မရတဲ့ element ကို tabindex attribute နဲ့ focus ရအောင်
      လုပ်လို့ ရပါတယ်။ [[mark:draw-zero]] tabindex ကို သုည ပေးရင်၊ element က HTML ထဲက သူ့
      နေရာအတိုင်း tab order ထဲ ဝင်သွားပါတယ်။ lesson 24 က မှတ်ချက် box ကိုလည်း keyboard နဲ့
      scroll လုပ်လို့ ရအောင် ဒီလို လုပ်ခဲ့ပါတယ်။ [[mark:draw-button]] ဒါပေမဲ့ လူတွေ
      နှိပ်ရမယ့် အရာဆိုရင်တော့ button အစစ်က ပိုကောင်းပါတယ်။ သူက focus ရပြီးသား ဖြစ်ပြီး၊
      code အပို မရေးဘဲ Enter ဒါမှမဟုတ် Space key နဲ့ နှိပ်လို့ ရလို့ပါ။ [[mark:draw-minus]]
      tabindex ကို အနုတ် တစ် ပေးရင်တော့ element က focus ရနိုင်ပေမယ့် Tab key က
      ကျော်သွားပါတယ်။ script ဒါမှမဟုတ် သူ့ကို ညွှန်ထားတဲ့ link က focus ကို သူ့ဆီ
      ရွှေ့ပေးနိုင်ပါတယ်။ ဒီ lesson ရဲ့ skip link အတွက် ဒါကို လိုပါတယ်။
      [[mark:draw-positive]] သုညထက် ကြီးတဲ့ ဂဏန်း ပေးရင်တော့ element က တခြား အရာအားလုံးရဲ့
      ရှေ့ကို ခုန်တက်သွားလို့၊ tab order က page အစဉ်အတိုင်း မဟုတ်တော့ပါဘူး။ ဒါကြောင့်
      မသုံးပါနဲ့။
    sources:
      - title: "web.dev Learn CSS — Focus: how elements get focus (tabindex)"
        url: "https://web.dev/learn/css/focus#how_elements_get_focus"
      - title: "MDN — tabindex"
        url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Global_attributes/tabindex"
    actions:
      - id: open-tabindex
        type: whiteboard.apply
        at: { mark: open-tabindex }
        clear: true
        upsertIds: [c-title]
      - id: draw-zero
        type: whiteboard.apply
        at: { mark: draw-zero }
        upsertIds: [c-zero]
        drawMs: 1600
      - id: draw-button
        type: whiteboard.apply
        at: { mark: draw-button }
        upsertIds: [c-button]
        drawMs: 1400
      - id: draw-minus
        type: whiteboard.apply
        at: { mark: draw-minus }
        upsertIds: [c-minus]
        drawMs: 1600
      - id: draw-positive
        type: whiteboard.apply
        at: { mark: draw-positive }
        upsertIds: [c-pos, c-pos-line]
        drawMs: 1800

  - id: code-tour
    narration: >
      [[mark:close-tabindex]] ဒါတွေကို ဆိုင်ရဲ့ page ထဲမှာ ရှာကြည့်ရအောင်။
      [[mark:open-index]] ဒါက HTML ဖိုင်ပါ။ [[mark:select-skip]] body ထဲက ပထမဆုံး element
      ကို ကြည့်ပါ။ အဓိက အကြောင်းအရာဆီ သွားတဲ့ link ပါ။ ဒါကို skip link လို့ ခေါ်ပြီး၊
      နောက်မှ style ပေးပါမယ်။ [[mark:select-main]] main element ကို ကြည့်ပါ။ link
      ညွှန်ထားတဲ့ id က သူ့မှာ ပါပြီး၊ tabindex အနုတ် တစ် ပါလို့ link ကနေ focus ရနိုင်ပါတယ်။
      [[mark:select-rings]] main ရဲ့ အပေါ်ဆုံးမှာ ring ပုံစံ စမ်းဖို့ ရိုးရိုး ခလုတ် သုံးခု
      တစ်တန်းတည်း ရှိပါတယ်။ [[mark:select-order-btn]] အောက်ဆုံးမှာတော့ အော်ဒါ form နဲ့
      မှာမယ် ခလုတ် ရှိပါတယ်။ [[mark:open-styles]] CSS ဖိုင်ကတော့ အလွတ်ပါ။
      [[mark:preview-opens]] preview ပွင့်လာပါပြီ။ skip link က header ရဲ့ အပေါ်မှာ ရိုးရိုး
      link တစ်ခုလို ပေါ်နေသေးပြီး၊ ခလုတ် သုံးခုက header ရဲ့ အောက်မှာ ရှိပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Focus (skip link and tabindex on main)"
        url: "https://web.dev/learn/css/focus"
      - title: "MDN — <main>"
        url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Element/main"
    actions:
      - id: close-tabindex
        type: whiteboard.apply
        at: { mark: close-tabindex }
        open: false
      - id: open-index
        type: workspace.openFile
        at: { mark: open-index }
        path: index.html
      - id: select-skip
        type: editor.select
        at: { mark: select-skip }
        target:
          {
            file: index.html,
            text: '<a class="skip-link" href="#main" data-testid="skip-link">',
            occurrence: 1,
          }
      - id: select-main
        type: editor.select
        at: { mark: select-main }
        target:
          {
            file: index.html,
            text: '<main class="page" id="main" tabindex="-1" data-testid="main">',
            occurrence: 1,
          }
      - id: select-rings
        type: editor.select
        at: { mark: select-rings }
        target:
          {
            file: index.html,
            text: "<button class=\"ring-a\" type=\"button\" data-testid=\"ring-a\">ခလုတ် က</button>\n        <button class=\"ring-b\" type=\"button\" data-testid=\"ring-b\">ခလုတ် ခ</button>\n        <button class=\"ring-c\" type=\"button\" data-testid=\"ring-c\">ခလုတ် ဂ</button>",
            occurrence: 1,
          }
      - id: select-order-btn
        type: editor.select
        at: { mark: select-order-btn }
        target: { file: index.html, text: '<button class="order-btn" type="button"', occurrence: 1 }
      - id: open-styles
        type: workspace.openFile
        at: { mark: open-styles }
        path: styles.css
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { mark: preview-opens }
        timeoutMs: 20000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-dev-server }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-skip-link
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: skip-link }
        attribute: { name: href, value: "#main" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-main
        type: expect.preview
        at: { afterAction: expect-skip-link }
        timeoutMs: 5000
        target: { by: testId, value: main }
        attribute: { name: tabindex, value: "-1" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-ring-a
        type: expect.preview
        at: { afterAction: expect-main }
        timeoutMs: 5000
        target: { by: testId, value: ring-a }
        textContains: "ခလုတ် က"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: collapse-runner-dock
        type: runtime.collapseDock
        at: { afterAction: expect-ring-a }

  - id: outline-ring
    chapter: "Outline နဲ့ focus ring"
    narration: >
      [[mark:type-ring-a]] focus ring က element မှာ focus ရနေတုန်းပဲ ပေါ်ပါတယ်။ ဒါကြောင့်
      ring ပုံစံကို မြင်ရအောင်၊ ပထမ ခလုတ်မှာ အမြဲ ပေါ်နေတဲ့ ring နဲ့ အရင် စမ်းကြည့်ရအောင်။ 3
      pixel ထူတဲ့ အစိမ်းရောင် မျဉ်းဖြောင့် outline ပေးပြီး၊ ခလုတ်နဲ့ ring ကြားမှာ နေရာလွတ်
      နည်းနည်း ချန်ပါမယ်။ [[mark:after-ring-a]] ပထမ ခလုတ်ရဲ့ ပတ်လည်မှာ အစိမ်းရောင် ring
      ပေါ်လာပါပြီ။ ထောင့်တွေကို ကြည့်ပါ။ ring က ခလုတ်ရဲ့ ထောင့်ဝိုင်းအတိုင်း
      လိုက်ဝိုင်းနေပါတယ်။ browser အဟောင်းတွေမှာတော့ ring က လေးထောင့် ဖြစ်ခဲ့ပါတယ်။
      [[mark:select-offset]] ဒီ outline offset ကို ကြည့်ပါ။ ခလုတ်ရဲ့ အနားနဲ့ ring ကြားက
      နေရာလွတ်ကို သူက သတ်မှတ်ပါတယ်။ [[mark:type-offset-neg]] offset ကို အနုတ် တန်ဖိုး
      ပေးရင်တော့ ring က အထဲဘက်ကို ဝင်လာပါတယ်။ offset နောက်တစ်ကြောင်း ထပ်ထည့်ပါမယ်။ lesson 5
      မှာ မြင်ခဲ့သလို နောက်မှ ရေးတာ နိုင်ပါတယ်။ [[mark:after-offset-neg]] အခု ring က
      ခလုတ်ရဲ့ အတွင်းဘက်မှာ ပေါ်နေပါပြီ။ ဒါက element ပတ်လည်မှာ နေရာ မလောက်တဲ့အခါ
      အသုံးဝင်ပါတယ်။ [[mark:type-ring-b]] lesson 2 မှာ outline က နေရာ မယူဘူးလို့
      ပြောခဲ့ပါတယ်။ ဒုတိယ ခလုတ်ကို အထူ တူတဲ့ border ပေးပြီး စစ်ကြည့်ပါမယ်။ ရိုက်နေတုန်း တတိယ
      ခလုတ်ကို လိုက်ကြည့်ပါ။ [[mark:after-ring-b]] ဒုတိယ ခလုတ် ကြီးလာပြီး၊ တတိယ ခလုတ်က
      ညာဘက်ကို ရွေ့သွားပါတယ်။ အောက်က menu လည်း နည်းနည်း ဆင်းသွားပါတယ်။ ပထမ ခလုတ်ရဲ့ ring
      ကတော့ ဘာကိုမှ မရွှေ့ခဲ့ပါဘူး။ [[mark:explain-outline]] ဒါကြောင့် focus ring တွေကို
      outline နဲ့ ဆွဲကြတာပါ။ focus က element တစ်ခုကနေ နောက်တစ်ခုကို အမြဲ ရွှေ့နေလို့၊ border
      နဲ့ ဆွဲရင် Tab key နှိပ်တိုင်း page က ခုန်နေပါလိမ့်မယ်။
    sources:
      - title: "web.dev Learn CSS — Focus: styling focus (outline, outline-offset)"
        url: "https://web.dev/learn/css/focus#styling_focus"
      - title: "MDN — outline"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/outline"
      - title: "MDN — outline-offset"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/outline-offset"
      - title: "CSS Basic User Interface Module Level 4 — outline properties"
        url: "https://www.w3.org/TR/css-ui-4/#outline-props"
    actions:
      - id: type-ring-a
        type: editor.type
        at: { mark: type-ring-a }
        cadence: fast-explainer
        target: { file: styles.css, after: "", occurrence: 1 }
        text: ".ring-a {\n  outline: 3px solid seagreen;\n  outline-offset: 3px;\n}\n"
      - id: select-offset
        type: editor.select
        at: { mark: select-offset }
        target: { file: styles.css, text: "outline-offset: 3px;", occurrence: 1 }
      - id: type-offset-neg
        type: editor.type
        at: { mark: type-offset-neg }
        cadence: fast-explainer
        target: { file: styles.css, after: "  outline-offset: 3px;\n", occurrence: 1 }
        text: "  outline-offset: -6px;\n"
      - id: type-ring-b
        type: editor.type
        at: { mark: type-ring-b }
        cadence: fast-explainer
        target: { file: styles.css, after: "  outline-offset: -6px;\n}\n", occurrence: 1 }
        text: "\n.ring-b {\n  border: 3px solid seagreen;\n}\n"
      - id: expect-ring-c
        type: expect.preview
        at: { mark: after-ring-b }
        timeoutMs: 4000
        target: { by: testId, value: ring-c }
        textContains: "ခလုတ် ဂ"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: focus-visible
    chapter: "Focus-visible နဲ့ focus-within"
    narration: >
      [[mark:scroll-form]] အခု form အောက်ဆုံးက မှာမယ် ခလုတ်မှာ focus ရမှ ပေါ်မယ့် ring ကို
      ထည့်ကြည့်ရအောင်။ [[mark:type-focus-visible]] focus visible နဲ့ ကိုက်နေတဲ့ အချိန်မှာပဲ
      မှာမယ် ခလုတ်ကို ရွေးပြီး၊ ခုနက အစိမ်းရောင် ring ကို နေရာလွတ် နည်းနည်းနဲ့ ပေးပါမယ်။
      [[mark:select-focus-visible]] ဒီ focus visible ကို ကြည့်ပါ။ ring ပြဖို့ လိုတယ်လို့
      browser က ဆုံးဖြတ်တဲ့အခါမှ ကိုက်တဲ့ pseudo-class ပါ။ keyboard ကနေ focus ရောက်လာရင်
      ကိုက်ပြီး၊ စာ ရိုက်ရတဲ့ field တွေမှာတော့ အမြဲ ကိုက်ပါတယ်။ ခလုတ်ကို mouse နဲ့
      နှိပ်ရင်တော့ ပုံမှန်အားဖြင့် မကိုက်လို့ ring မပေါ်ပါဘူး။ [[mark:click-order]] ခလုတ်ဆီ
      focus ရွှေ့ပြီး နှိပ်ကြည့်ရအောင်။ ဒီ lesson မှာ focus ကို script နဲ့ ရွှေ့တာ ဖြစ်ပြီး၊
      browser က အဲဒါကို keyboard focus လိုပဲ သဘောထားပါတယ်။ [[mark:after-click]] ခလုတ်
      ပတ်လည်မှာ အစိမ်းရောင် ring ပေါ်လာပြီး၊ ခလုတ်ရဲ့ ပုံသဏ္ဌာန်အတိုင်း ဝိုင်းနေပါတယ်။
      အောက်က စာကြောင်းကလည်း အော်ဒါ မှာပြီးပြီလို့ ပြနေပါတယ်။ [[mark:explain-focus]] ရိုးရိုး
      focus pseudo-class ကတော့ focus ဘယ်လိုပဲ ရောက်လာလာ ကိုက်ပါတယ်။ mouse နဲ့ နှိပ်တာလည်း
      ပါပါတယ်။ ဒါကြောင့် ခလုတ်တွေရဲ့ ring ကို focus visible နဲ့ ပေးကြတာပါ။
      [[mark:explain-default]] ကိုယ်က rule မရေးထားရင် browser က သူ့ default ring ကို
      ဆွဲပါတယ်။ browser တစ်ခုနဲ့ တစ်ခု ပုံစံ မတူလို့ website တော်တော်များများက ring ကို
      ကိုယ်တိုင် style ပေးကြပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Pseudo-classes: :focus, :focus-within and :focus-visible"
        url: "https://web.dev/learn/css/pseudo-classes#focus_focus-within_and_focus-visible"
      - title: "MDN — :focus-visible"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/:focus-visible"
      - title: "MDN — :focus"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/:focus"
      - title: "Selectors Level 4 — the :focus-visible pseudo-class"
        url: "https://www.w3.org/TR/selectors-4/#the-focus-visible-pseudo"
    actions:
      # Clamps to the end of the page: the form, the order button and the
      # empty status line under it are on screen.
      # Was 900: the page is 1311 px tall here, so a preview up to about 828
      # px high reaches 480; a larger target is clamped and the gate finds no
      # recorded command.
      - id: scroll-form
        type: preview.scroll
        at: { mark: scroll-form }
        timeoutMs: 5000
        top: 480
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-order-button
        type: expect.preview
        at: { afterAction: scroll-form }
        timeoutMs: 4000
        target: { by: testId, value: order-button }
        textContains: "မှာမယ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-focus-visible
        type: editor.type
        at: { mark: type-focus-visible }
        cadence: line-by-line
        target: { file: styles.css, after: "  border: 3px solid seagreen;\n}\n", occurrence: 1 }
        text: "\n.order-btn:focus-visible {\n  outline: 3px solid seagreen;\n  outline-offset: 3px;\n}\n"
      - id: select-focus-visible
        type: editor.select
        at: { mark: select-focus-visible }
        target: { file: styles.css, text: ":focus-visible", occurrence: 1 }
      # The bridge focuses the button, then clicks it: :focus-visible matches
      # (scripted focus) and kit.js writes the status line.
      - id: click-order
        type: preview.click
        at: { mark: click-order }
        timeoutMs: 5000
        target: { by: testId, value: order-button }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-ordered
        type: expect.preview
        at: { mark: after-click }
        timeoutMs: 4000
        target: { by: testId, value: order-status }
        textContains: "မှာပြီးပါပြီ"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: focus-within
    narration: >
      [[mark:type-focus-within]] focus within ကတော့ element ကိုယ်တိုင် ဒါမှမဟုတ် သူ့ထဲက
      element တစ်ခုခု focus ရနေရင် ကိုက်ပါတယ်။ form ထဲ ဘယ်နေရာမှာပဲ focus ရှိရှိ၊ အော်ဒါ
      form တစ်ခုလုံးကို အစိမ်းရောင် ဖျော့ဖျော့ နောက်ခံ ပေးပါမယ်။ [[mark:type-input-focus]]
      field တွေအတွက်တော့ ရိုးရိုး focus က အဆင်ပြေပါတယ်။ field မှာ focus ရောက်တိုင်း စာ
      ရိုက်တော့မှာ ဖြစ်လို့၊ ring က ဘယ်အချိန်မှာမဆို အသုံးဝင်ပါတယ်။ ပြီးတော့ browser က field
      မှာ ဆွဲတဲ့ default ring ကိုလည်း ဒီ ring က အစားထိုးပေးပါတယ်။ [[mark:input-name]] နာမည်
      field ထဲမှာ နာမည် တစ်ခု ရိုက်ကြည့်ရအောင်။ [[mark:after-input]] field မှာ ring
      ပေါ်ပြီး၊ form တစ်ခုလုံးလည်း အစိမ်းရောင် ဖျော့ဖျော့ ဖြစ်သွားပါတယ်။ သူ့ထဲက တစ်ခုခု
      focus ရနေလို့ပါ။ မှာမယ် ခလုတ်ရဲ့ ring ကတော့ editor မှာ စ ရိုက်ကတည်းက ပျောက်သွားပါပြီ။
      focus က editor ဆီ ရောက်သွားလို့ပါ။ [[mark:select-focus-within]] ဒီ focus within ကို
      ကြည့်ပါ။ lesson 4 က has လိုပဲ၊ အထဲမှာ ဖြစ်နေတာကို ကြည့်ပြီး parent ကို style ပေးတာပါ။
      focus က editor ဆီ ပြန်ရောက်လို့၊ field ရဲ့ ring နဲ့ form ရဲ့ အစိမ်းရောင်
      ပျောက်သွားပါပြီ။
    sources:
      - title: "web.dev Learn CSS — Focus: styling focus (:focus-within)"
        url: "https://web.dev/learn/css/focus#styling_focus"
      - title: "MDN — :focus-within"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/:focus-within"
      - title: "MDN — :focus"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/:focus"
    actions:
      - id: type-focus-within
        type: editor.type
        at: { mark: type-focus-within }
        cadence: fast-explainer
        target:
          {
            file: styles.css,
            after: ".order-btn:focus-visible {\n  outline: 3px solid seagreen;\n  outline-offset: 3px;\n}\n",
            occurrence: 1,
          }
        text: "\n.order-form:focus-within {\n  background: honeydew;\n}\n"
      - id: type-input-focus
        type: editor.type
        at: { mark: type-input-focus }
        cadence: fast-explainer
        target: { file: styles.css, after: "  background: honeydew;\n}\n", occurrence: 1 }
        text: "\n.order-form input:focus {\n  outline: 2px solid seagreen;\n}\n"
      # The bridge focuses the field, then sets its value: :focus on the field,
      # :focus-within on the form.
      - id: input-name
        type: preview.input
        at: { mark: input-name }
        timeoutMs: 5000
        target: { by: testId, value: input-name }
        value: "ကိုအောင်"
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-name
        type: expect.preview
        at: { mark: after-input }
        timeoutMs: 4000
        target: { by: testId, value: input-name }
        value: "ကိုအောင်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-focus-within
        type: editor.select
        at: { mark: select-focus-within }
        target: { file: styles.css, text: ".order-form:focus-within", occurrence: 1 }

  - id: focus-rules
    chapter: "Focus ring ကို မဖျောက်ပါနဲ့"
    narration: >
      [[mark:open-rules]] focus style အတွက် စည်းမျဉ်း တချို့ပါ။ [[mark:draw-none]] website
      တချို့က ring ရဲ့ ပုံစံကို မကြိုက်လို့ outline none နဲ့ ဖျောက်ပစ်ကြပါတယ်။ lesson 7 မှာ
      all ကို unset လုပ်ရင်လည်း ring ပျောက်တယ်လို့ ပြောခဲ့ပါတယ်။ အစားထိုး မပေးရင် keyboard
      သုံးသူတွေက ဘယ်ရောက်နေလဲ လုံးဝ မသိတော့ပါဘူး။ [[mark:draw-instead]] ဒါကြောင့် ring ကို
      မဖျောက်ပါနဲ့။ ခုနကလို focus visible နဲ့ ring ရဲ့ ပုံစံကို ပြောင်းပါ။
      [[mark:draw-contrast]] focus ရနေတဲ့ ပုံစံက ပုံမှန် ပုံစံနဲ့ သိသိသာသာ ကွာရပါမယ်။ အရောင်
      နည်းနည်း ပြောင်းရုံနဲ့ မလုံလောက်ပါဘူး။ WCAG က အနည်းဆုံး 2 pixel ထူပြီး၊ focus မရတဲ့
      ပုံစံနဲ့ contrast ပြတ်ပြတ်သားသား ကွာတဲ့ ring ကို အကြံပြုထားပါတယ်။ [[mark:draw-shadow]]
      website တချို့က ring ကို box shadow နဲ့ ဆွဲကြပါတယ်။ ဒါပေမဲ့ Windows မှာ contrast
      ပြင်းပြင်း လိုတဲ့သူတွေအတွက် forced colors mode ရှိပြီး၊ အဲဒီ mode က အရိပ်တွေကို
      ဖယ်ပစ်လို့ ring ပါ ပျောက်သွားပါတယ်။ [[mark:draw-fix]] ဒါကြောင့် outline ကို ထားပါ။
      အရိပ် သုံးချင်ရင်လည်း မမြင်ရတဲ့ transparent outline ကို တွဲထည့်ပါ။ forced colors mode
      မှာတော့ browser က အဲဒီ outline ကို မြင်ရတဲ့ အရောင်နဲ့ ဆွဲပေးပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Focus: in summary"
        url: "https://web.dev/learn/css/focus#in_summary"
      - title: "web.dev Learn CSS — Pseudo-classes (outline: none anti-pattern)"
        url: "https://web.dev/learn/css/pseudo-classes#focus_focus-within_and_focus-visible"
      - title: "WCAG 2.2 Understanding 2.4.13 Focus Appearance"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/focus-appearance"
      - title: "MDN — forced-colors"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/@media/forced-colors"
    actions:
      - id: open-rules
        type: whiteboard.apply
        at: { mark: open-rules }
        open: true
        clear: true
        upsertIds: [d-title]
      - id: draw-none
        type: whiteboard.apply
        at: { mark: draw-none }
        upsertIds: [d-none, d-none-strike, d-none-l]
        drawMs: 2000
      - id: draw-instead
        type: whiteboard.apply
        at: { mark: draw-instead }
        upsertIds: [d-instead]
        drawMs: 1400
      - id: draw-contrast
        type: whiteboard.apply
        at: { mark: draw-contrast }
        upsertIds: [d-contrast]
        drawMs: 1400
      - id: draw-shadow
        type: whiteboard.apply
        at: { mark: draw-shadow }
        upsertIds: [d-shadow]
        drawMs: 1400
      - id: draw-fix
        type: whiteboard.apply
        at: { mark: draw-fix }
        upsertIds: [d-fix]
        drawMs: 1400

  - id: skip-link
    chapter: "Skip link ဆိုတာ ဘာလဲ"
    narration: >
      [[mark:close-rules]] page အပေါ်ဆုံးကို ပြန်သွားရအောင်။ [[mark:explain-skip]] keyboard
      သုံးသူက အဓိက အကြောင်းအရာကို မရောက်ခင်၊ page တိုင်းမှာ menu link တွေကို Tab နဲ့
      ဖြတ်ရပါတယ်။ skip link ဆိုတာ အဲဒီ link တွေကို ကျော်ပြီး main ဆီ တန်းခုန်လို့ ရတဲ့ link
      ပါ။ [[mark:type-skip]] အရင်ဆုံး link ကို box တစ်ခု ဖြစ်အောင် လုပ်ပါမယ်။ position
      absolute နဲ့ flow ထဲကနေ ထုတ်ပြီး၊ padding၊ အစိမ်းရောင် နောက်ခံနဲ့ အဖြူရောင် စာလုံး
      ပေးပါမယ်။ [[mark:after-skip]] skip link က header ရဲ့ ဘယ်ဘက် အပေါ်ထောင့်မှာ ထပ်နေတဲ့
      အစိမ်းရောင် box ဖြစ်သွားပြီး၊ သူ ချန်ခဲ့တဲ့ နေရာထဲကို header က တက်လာပါတယ်။
      [[mark:type-skip-hide]] အခု သူ့ကို ဖျောက်ပါမယ်။ translate နဲ့ သူ့ အမြင့်ရဲ့ နှစ်ဆ
      အပေါ်ကို ရွှေ့ပါမယ်။ [[mark:after-skip-hide]] page ရဲ့ အပေါ်ဘက်ကို ထွက်ပြီး
      ပျောက်သွားပါပြီ။ ဒါပေမဲ့ ဖယ်ထုတ်လိုက်တာ မဟုတ်ပါဘူး။ display none ဆိုရင် focus
      မရတော့ပေမယ့်၊ ဒီနည်းနဲ့ဆိုရင် Tab key ရောက်မယ့် ပထမဆုံး အရာ ဖြစ်နေတုန်းပါ။
      [[mark:type-skip-focus]] နောက်ဆုံး၊ focus ရတဲ့ အချိန်အတွက် rule တစ်ခု ရေးပါမယ်။
      translate ကို သုည ပြန်ပေးလို့၊ link က focus ရတာနဲ့ မြင်ရတဲ့ နေရာကို ပြန်ဆင်းလာပါမယ်။
      [[mark:select-skip-focus]] ဒီ focus ကို ကြည့်ပါ။ ဒီ link က focus ဘယ်လိုပဲ ရရ မြင်ရဖို့
      လိုလို့ ရိုးရိုး focus ကို သုံးတာပါ။
    sources:
      - title: "web.dev Learn CSS — Focus (skip link)"
        url: "https://web.dev/learn/css/focus"
      - title: "MDN — translate"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/translate"
      - title: "MDN — :focus"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/:focus"
    actions:
      - id: close-rules
        type: whiteboard.apply
        at: { mark: close-rules }
        open: false
      - id: scroll-top
        type: preview.scroll
        at: { mark: close-rules, offsetMs: 300 }
        timeoutMs: 5000
        top: 0
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-skip-text
        type: expect.preview
        at: { afterAction: scroll-top }
        timeoutMs: 4000
        target: { by: testId, value: skip-link }
        textContains: "အဓိက အကြောင်းအရာသို့ ကျော်ရန်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-skip
        type: editor.type
        at: { mark: type-skip }
        cadence: line-by-line
        target: { file: styles.css, after: "  outline: 2px solid seagreen;\n}\n", occurrence: 1 }
        text: "\n.skip-link {\n  position: absolute;\n  padding: 8px 16px;\n  background: darkgreen;\n  color: white;\n}\n"
      - id: type-skip-hide
        type: editor.type
        at: { mark: type-skip-hide }
        cadence: fast-explainer
        target: { file: styles.css, after: "  color: white;\n", occurrence: 1 }
        text: "  translate: 0 -200%;\n"
      - id: type-skip-focus
        type: editor.type
        at: { mark: type-skip-focus }
        cadence: fast-explainer
        target: { file: styles.css, after: "  translate: 0 -200%;\n}\n", occurrence: 1 }
        text: "\n.skip-link:focus {\n  translate: 0 0;\n}\n"
      - id: select-skip-focus
        type: editor.select
        at: { mark: select-skip-focus }
        target: { file: styles.css, text: ".skip-link:focus", occurrence: 1 }

  - id: skip-board
    narration: >
      [[mark:open-skip-board]] ဒီ link ကိုတော့ preview ထဲမှာ မနှိပ်ပါဘူး။ နှိပ်ရင် focus က
      main ဆီ ချက်ချင်း ရောက်သွားလို့ link ပေါ်လာတာ မမြင်ရပါဘူး။ ဒါကြောင့် board ပေါ်မှာ
      ဆွဲပြပါမယ်။ [[mark:draw-tab]] ပထမဆုံး Tab တစ်ချက်နဲ့ skip link က focus ရပြီး၊ မြင်ရတဲ့
      နေရာကို ဆင်းလာပါတယ်။ [[mark:draw-enter]] Enter နှိပ်လိုက်တော့ page က main ဆီ
      ခုန်သွားပါတယ်။ [[mark:draw-main]] main မှာ tabindex အနုတ် တစ် ပါလို့ သူလည်း focus
      ရပါတယ်။ [[mark:draw-next]] ဒါကြောင့် နောက် Tab က main ထဲက ပထမ ခလုတ်ကို ရောက်ပါတယ်။
      [[mark:draw-skipped]] menu link တွေကို ကျော်သွားပါပြီ။ lesson ကို pause လုပ်ပြီး run
      ကြည့်ပါ၊ preview ထဲက header ကို click လုပ်ပြီး Shift နဲ့ Tab နှိပ်ရင် skip link
      ပေါ်လာပါမယ်။
    sources:
      - title: 'web.dev Learn CSS — Focus (skip link, tabindex="-1" on main)'
        url: "https://web.dev/learn/css/focus"
      - title: "MDN — tabindex (negative values)"
        url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Global_attributes/tabindex"
    actions:
      - id: open-skip-board
        type: whiteboard.apply
        at: { mark: open-skip-board }
        open: true
        clear: true
        upsertIds: [e-title]
      - id: draw-tab
        type: whiteboard.apply
        at: { mark: draw-tab }
        upsertIds: [e-tab]
        drawMs: 1400
      - id: draw-enter
        type: whiteboard.apply
        at: { mark: draw-enter }
        upsertIds: [e-enter]
        drawMs: 1200
      - id: draw-main
        type: whiteboard.apply
        at: { mark: draw-main }
        upsertIds: [e-main]
        drawMs: 1400
      - id: draw-next
        type: whiteboard.apply
        at: { mark: draw-next }
        upsertIds: [e-next]
        drawMs: 1400
      - id: draw-skipped
        type: whiteboard.apply
        at: { mark: draw-skipped }
        upsertIds: [e-nav, e-nav-t, e-nav-strike, e-nav-l]
        drawMs: 2000

  - id: cursors
    chapter: "Cursor နဲ့ caret"
    narration: >
      [[mark:open-cursors]] အခု mouse ဘက်ကို ကြည့်ရအောင်။ cursor ဆိုတာ mouse pointer ရဲ့
      ပုံပါ။ [[mark:draw-auto]] ပုံမှန်အားဖြင့် ပုံကို browser က ရွေးပေးပြီး၊ ဒါက auto
      ဆိုတဲ့ တန်ဖိုးပါ။ ရွေးလို့ ရတဲ့ စာပေါ်မှာ I ပုံ၊ link ပေါ်မှာ လက်ညှိုး ပုံ ပြပြီး၊
      ကျန်တဲ့ နေရာမှာ default ဆိုတဲ့ မြား ပုံ ပြပါတယ်။ [[mark:draw-pointer]] cursor property
      နဲ့ ပုံကို ရွေးလို့ ရပါတယ်။ လက်ညှိုး ပုံ ဖြစ်တဲ့ pointer က နှိပ်လို့ ရတယ်လို့
      ပြောပြီး၊ text ကတော့ I ပုံပါ။ [[mark:draw-not-allowed]] not allowed က မျဉ်း ဖြတ်ထားတဲ့
      စက်ဝိုင်း ပုံ ဖြစ်ပြီး၊ ဒီ အလုပ်ကို အခု လုပ်လို့ မရဘူးလို့ ပြောပါတယ်။ ပြီးခဲ့တဲ့
      lesson က disabled ခလုတ်မှာ ပေးခဲ့ပါတယ်။ [[mark:draw-others]] grab က ဆွဲရွှေ့လို့ ရတယ်၊
      wait က စောင့်ပါလို့ ပြောပြီး၊ resize အုပ်စုက အရွယ်အစား ဆွဲပြောင်းဖို့ပါ။
      [[mark:draw-advice]] cursor ကို အဓိပ္ပာယ် ရှိမှပဲ ပြောင်းပါ။ နှိပ်လို့ မရတဲ့
      အရာပေါ်မှာ လက်ညှိုး ပုံ ပြရင်၊ နှိပ်လို့ ရမယ် ထင်ပြီး နှိပ်ကြည့်ကြပါလိမ့်မယ်။
      [[mark:close-cursors]] ဒီနေ့ ဖာလူဒါ ကုန်သွားပါပြီ။ [[mark:type-cursor]] ကုန်သွားတဲ့
      card တွေကို not allowed cursor ပေးပါမယ်။ ဒါဆို mouse သုံးသူက ဒီ card ကို မှာလို့ မရဘူး
      ဆိုတာ ချက်ချင်း သိပါမယ်။ [[mark:after-cursor]] card ရဲ့ ပုံစံကတော့ မပြောင်းပါဘူး။
      cursor ပုံက mouse အစစ် သုံးမှ ပေါ်ပြီး၊ lesson recording က အဲဒီ ပုံကို မမှတ်လို့ board
      ပေါ်မှာ ဆွဲပြခဲ့တာပါ။ lesson ကို pause လုပ်ပြီး run ကြည့်ပါ၊ mouse ကို ဖာလူဒါ card
      ပေါ် တင်ကြည့်ပါ။
    sources:
      - title: "web.dev Learn CSS — Cursors and pointers: cursors"
        url: "https://web.dev/learn/css/cursors-and-pointers#cursors"
      - title: "MDN — cursor"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/cursor"
      - title: "CSS Basic User Interface Module Level 4 — cursor"
        url: "https://www.w3.org/TR/css-ui-4/#cursor"
    actions:
      - id: open-cursors
        type: whiteboard.apply
        at: { mark: open-cursors }
        open: true
        clear: true
        upsertIds: [f-title]
      - id: draw-auto
        type: whiteboard.apply
        at: { mark: draw-auto }
        upsertIds: [f-auto, f-default]
        drawMs: 1600
      - id: draw-pointer
        type: whiteboard.apply
        at: { mark: draw-pointer }
        upsertIds: [f-pointer, f-text]
        drawMs: 1800
      - id: draw-not-allowed
        type: whiteboard.apply
        at: { mark: draw-not-allowed }
        upsertIds: [f-na-circle, f-na-strike, f-na]
        drawMs: 1800
      - id: draw-others
        type: whiteboard.apply
        at: { mark: draw-others }
        upsertIds: [f-grab, f-wait, f-resize]
        drawMs: 2200
      - id: draw-advice
        type: whiteboard.apply
        at: { mark: draw-advice }
        upsertIds: [f-advice]
        drawMs: 1400
      - id: close-cursors
        type: whiteboard.apply
        at: { mark: close-cursors }
        open: false
      # Brings the sold-out falooda card near the top of the preview (a
      # 720 px viewport clamps it to 607).
      # Was 640: the page is 1327 px tall here, so a preview up to about 828
      # px high reaches 495; a larger target is clamped and the gate finds no
      # recorded command.
      - id: scroll-sold-out
        type: preview.scroll
        at: { mark: close-cursors, offsetMs: 300 }
        timeoutMs: 5000
        top: 495
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-sold-out
        type: expect.preview
        at: { afterAction: scroll-sold-out }
        timeoutMs: 4000
        target: { by: testId, value: card-falooda }
        textContains: "ကုန်သွားပြီ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-cursor
        type: editor.type
        at: { mark: type-cursor }
        cadence: fast-explainer
        target: { file: styles.css, after: "  translate: 0 0;\n}\n", occurrence: 1 }
        text: "\n.sold-out {\n  cursor: not-allowed;\n}\n"

  - id: caret
    narration: >
      [[mark:open-custom]] ကိုယ်ပိုင် ပုံကိုလည်း cursor အဖြစ် သုံးလို့ ရပါတယ်။
      [[mark:draw-hotspot]] ပုံ နာမည်ရဲ့ နောက်က ဂဏန်း နှစ်ခုက hotspot ပါ။ ပုံထဲက ဘယ် အစက်နဲ့
      တကယ် နှိပ်မလဲ ဆိုတာပါ။ [[mark:draw-fallback]] နောက်ဆုံးမှာ keyword တစ်ခု ပါရပါမယ်။ ပုံ
      load မရရင် သုံးမယ့် fallback ပါ။ မပါရင် declaration တစ်ခုလုံးကို browser က
      ကျော်သွားပါတယ်။ [[mark:draw-size]] ပုံကို 32 pixel လောက် သေးသေးပဲ ထားပါ။ အရမ်းကြီးတဲ့
      ပုံကို browser တွေက လက်မခံပါဘူး။ [[mark:draw-caret]] page ပေါ်မှာ cursor နောက်တစ်မျိုး
      ရှိပါသေးတယ်။ အဲဒါက caret ပါ။ text field ထဲမှာ နောက် စာလုံး ဘယ်မှာ ဝင်မလဲ ပြတဲ့
      မှိတ်တုတ်မှိတ်တုတ် မျဉ်းလေးပါ။ စာ ရိုက်တာနဲ့အမျှ ရွေ့သွားပြီး၊ mouse နောက်ကိုတော့
      မလိုက်ပါဘူး။ [[mark:close-custom]] caret ကို အရောင် ပေးကြည့်ရအောင်။
      [[mark:type-caret]] caret color က အဲဒီ မျဉ်းလေးရဲ့ အရောင်ပါ။ အော်ဒါ form ထဲက field
      တွေမှာ အညိုရောင် caret ပေးပါမယ်။ [[mark:after-caret]] board ပေါ်က ဒီ မျဉ်းလေးက၊ တကယ့်
      field ထဲမှာဆိုရင် focus ရနေတုန်း အညိုရောင်နဲ့ မှိတ်တုတ်မှိတ်တုတ် ဖြစ်နေပါမယ်။
      [[mark:draw-mouse]] caret color က mouse ရဲ့ I ပုံကို မပြောင်းပါဘူး။
    sources:
      - title: "web.dev Learn CSS — Cursors and pointers: carets"
        url: "https://web.dev/learn/css/cursors-and-pointers#carets"
      - title: "MDN — cursor (url values, hotspot, fallback)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/cursor#syntax"
      - title: "MDN — caret-color"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/caret-color"
    actions:
      - id: open-custom
        type: whiteboard.apply
        at: { mark: open-custom }
        open: true
        clear: true
        upsertIds: [g-title, g-url]
      - id: draw-hotspot
        type: whiteboard.apply
        at: { mark: draw-hotspot }
        upsertIds: [g-hot]
        drawMs: 1400
      - id: draw-fallback
        type: whiteboard.apply
        at: { mark: draw-fallback }
        upsertIds: [g-fallback]
        drawMs: 1400
      - id: draw-size
        type: whiteboard.apply
        at: { mark: draw-size }
        upsertIds: [g-size]
        drawMs: 1200
      - id: draw-caret
        type: whiteboard.apply
        at: { mark: draw-caret }
        upsertIds: [g-field, g-field-t, g-caret, g-caret-l]
        drawMs: 2200
      - id: close-custom
        type: whiteboard.apply
        at: { mark: close-custom }
        open: false
      - id: type-caret
        type: editor.type
        at: { mark: type-caret }
        cadence: fast-explainer
        target: { file: styles.css, after: "  cursor: not-allowed;\n}\n", occurrence: 1 }
        text: "\n.order-form input {\n  caret-color: sienna;\n}\n"
      - id: reopen-caret
        type: whiteboard.apply
        at: { mark: after-caret }
        open: true
        upsertIds: [g-caret]
      - id: draw-mouse
        type: whiteboard.apply
        at: { mark: draw-mouse }
        upsertIds: [g-mouse]
        drawMs: 1200

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:open-recap]] မေးခွန်း တစ်ခုပါ။ focus ကို ဘာတွေက ရွှေ့နိုင်လဲ။
      [[mark:draw-devices]] keyboard၊ switch device နဲ့ screen reader တို့ပါ။ mouse နဲ့
      နှိပ်ရင်လည်း text field မှာ focus ရပြီး၊ browser အများစုမှာ ခလုတ်လည်း focus ရပါတယ်။
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ focus ring ကို အစားထိုး မပေးဘဲ ဘယ်တော့မှ
      မဖျောက်ပါနဲ့။ ring ကို outline နဲ့ outline offset နဲ့ ဆွဲပြီး၊ ခလုတ်တွေရဲ့ ring ကို
      focus visible နဲ့ ပေးပါ။ focus within ကတော့ အထဲက တစ်ခုခု focus ရနေတုန်း parent ကို
      style ပေးပါတယ်။ [[mark:draw-tab-rules]] HTML အစဉ်ကို မြင်ရတဲ့ အစဉ်နဲ့ ကိုက်အောင်
      ထားပြီး၊ tabindex မှာ သုည နဲ့ အနုတ် တစ် ကိုပဲ သုံးပါ။ skip link ထည့်ပေးပါ။ cursor
      ကိုတော့ အဓိပ္ပာယ် ရှိမှပဲ ပြောင်းပါ။ [[mark:recall-pointer]] touchscreen မှာတော့
      cursor မရှိပါဘူး။ lesson 25 ကို ပြန်မှတ်ရရင်၊ touch action က browser handle လုပ်ခွင့်
      ရှိတဲ့ gesture တွေကို ပြောပြီး၊ any pointer က ချိတ်ထားတဲ့ input တစ်ခုခု coarse ဖြစ်လား
      မေးပါတယ်။ [[mark:next-lesson]] ဒါဆိုရင် pseudo-element နဲ့ pseudo-class အပိုင်း
      ပြီးသွားပါပြီ။ နောက် lesson မှာတော့ list marker တွေကို ပုံစံ ပြောင်းပြီး၊ CSS က ဘယ်လို
      ရေတွက်လဲ ဆိုတဲ့ counter ကို ကြည့်သွားပါမယ်။
    sources:
      - title: "web.dev Learn CSS — Focus: in summary"
        url: "https://web.dev/learn/css/focus#in_summary"
      - title: "web.dev Learn CSS — Cursors and pointers (touch-action, any-pointer)"
        url: "https://web.dev/learn/css/cursors-and-pointers#responding_to_a_users_pointer_inputs"
      - title: "MDN — any-pointer"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/@media/any-pointer"
    actions:
      - id: open-recap
        type: whiteboard.apply
        at: { mark: open-recap }
        clear: true
        upsertIds: [h-title]
      - id: draw-devices
        type: whiteboard.apply
        at: { mark: draw-devices }
        upsertIds: [h-devices]
        drawMs: 1400
      - id: draw-recap
        type: whiteboard.apply
        at: { mark: recap }
        upsertIds: [h-r1, h-r2]
        drawMs: 2000
      - id: draw-tab-rules
        type: whiteboard.apply
        at: { mark: draw-tab-rules }
        upsertIds: [h-r3, h-r4, h-r5]
        drawMs: 2200
      - id: expect-final-css
        type: expect.file
        at: { mark: recall-pointer }
        path: styles.css
        contains: ".ring-a {\n  outline: 3px solid seagreen;\n  outline-offset: 3px;\n  outline-offset: -6px;\n}\n\n.ring-b {\n  border: 3px solid seagreen;\n}\n\n.order-btn:focus-visible {\n  outline: 3px solid seagreen;\n  outline-offset: 3px;\n}\n\n.order-form:focus-within {\n  background: honeydew;\n}\n\n.order-form input:focus {\n  outline: 2px solid seagreen;\n}\n\n.skip-link {\n  position: absolute;\n  padding: 8px 16px;\n  background: darkgreen;\n  color: white;\n  translate: 0 -200%;\n}\n\n.skip-link:focus {\n  translate: 0 0;\n}\n\n.sold-out {\n  cursor: not-allowed;\n}\n\n.order-form input {\n  caret-color: sienna;\n}\n"

checks:
  - { type: timing.p95Ms, max: 300 }
