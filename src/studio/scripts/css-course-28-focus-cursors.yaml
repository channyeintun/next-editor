# CSS course (Burmese), lesson 28 of 43: focus and cursors.
#
# Narration is Burmese (voice-script.md next to this file is its source;
# DESIGN.md is the writer's brief). Every [[mark:…]] sits
# where its action begins, at a sentence end; each span carries one piece of
# meaning. Everything the learner sees (title, chapters, whiteboard labels, UI
# strings) is already Burmese.
#
# Shape: board A (recall lesson 27; why focus matters: Tab / Shift+Tab users,
# the ring is their pointer, WCAG 2.4.7) → board B (what is focusable; tab
# order = HTML order, recall lessons 15/16) → board C (tabindex 0 / -1 /
# positive) → code tour (skip link, main tabindex -1, three demo buttons, the
# order button) → always-on ring on button က (outline + offset, rounded
# corners) → negative offset → border on button ခ pushes ဂ and the menu (outline
# moved nothing, lesson 2) → order button :focus-visible rule + scripted focus
# (ring appears; status line proves the click) → :focus-within tint + input
# :focus ring, then a name typed into the field → board D (never outline: none,
# focus appearance, box-shadow vs forced colours) → skip link: a box, hidden by
# translate, back on :focus → board E (Tab → Enter → main takes focus) →
# board F (cursor keywords, auto) → sold-out card gets not-allowed → board G
# (custom cursor image + hotspot + fallback; the caret) → caret-color →
# board H recap + hand-off to lists and counters (lesson 29).
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set( (the custom-cursor url() lives
# only on the whiteboard); no postcss config; CSS edits never reload, so the
# focus state and the typed name survive them. Unitless lengths are invalid
# until the unit lands ("-6" → "-6px", "-200" → "-200%"), so no half-typed
# value flashes; "3px solid" is a valid black outline for a moment before the
# colour lands (never narrated).
#
# Measured in headless Chrome at 432 × 720 (probe/stages.ts, same anchors):
# document 1305 tall at start (skip link line 0–29, header 29–273, ring row
# 288–355, drinks 371–867, form 883–1281). Border on ခ: ခ 94×41 → 100×47, ဂ
# x 256 → 262, everything below +6 px. Scroll 900 clamps to the page end
# (591 at 720): the order button at viewport y 628, its status line under it
# after the click (+45 px). Skip link absolute: a 45 px tall green box at 0,0 over
# the header's top-left; the header moves up 29 px; translate -200% → y -90.
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
