  - id: slo-first
    chapter: code မရေးခင် SLO
    narration: >
      [[mark:close-b2]] [[mark:b3-s1]] SRE အကူအညီက architecture ပြောင်းရတာ အသက်သာဆုံး ဖြစ်တဲ့ design အဆင့်မှာ အထိရောက်ဆုံးပါ။ ဒါကြောင့် Eats ရဲ့ rider matching ကို စတော့ product manager မနှင်းက code မရေးခင် မသီရိနဲ့ SLO ကို အရင် သတ်မှတ်ပါတယ်၊ order ၉၅ ရာခိုင်နှုန်းကို စက္ကန့် ၄၅ အတွင်း rider နဲ့ တွဲပေးရမယ် ဆိုတာပါ။
      ပစ်မှတ်ကို Wallet ထက် နိမ့်ထားတာက rider တွေ ဒီ feature ကို မြန်မြန် လိုချင်လို့ပါ၊ ဘာလို့ နိမ့်လဲ၊ ဘယ်တော့ မြှင့်မလဲ ဆိုတာကိုလည်း ချရေးထားပါတယ်။
      [[mark:b3-s2]] SLO ကို အရင် သိတော့ design ကိုလည်း ညှိပါတယ်။ peak ချိန်မှာ order တွေ fail မဖြစ်ဘဲ တန်းစီ စောင့်နိုင်အောင် queue ထည့်တယ်၊ retry လုပ်မိလည်း rider နှစ်ယောက်နဲ့ မတွဲမိအောင် order တိုင်းမှာ key တစ်ခု ပါတယ်၊ peak မှာ ဓာတ်ပုံလို အရေးမကြီးတဲ့ အပိုင်းကို ခဏ ပိတ်ပါတယ်။
      [[mark:b3-s3]] ပထမ version ကလည်း dashboard၊ runbook နဲ့ rollback လုပ်နည်း ပါပြီးသား ထွက်ပါတယ်။ ဘာလုပ်လဲ မဟုတ်ဘဲ ဘယ်လောက် မြန်ရမလဲ၊ စိတ်ချရရမလဲ ဆိုတဲ့ လိုအပ်ချက်တွေကို nonfunctional requirement လို့ ခေါ်ပြီး roadmap မှာ မေ့ကျန်တတ်လို့ SRE က အသံ ထွက်ပေးရပါတယ်။
      ဥပမာ ပြီးခဲ့တဲ့ ညစာ peak မှာ Eats နှေးတုန်းက မသီရိက ဆုံးရှုံးခဲ့တဲ့ order နဲ့ refund တွေကို ငွေနဲ့ တွက်ပြပြီး postmortem ကိုလည်း မနှင်းကို အဓိက ရည်ရွယ်ပြီး ရေးခဲ့ပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book, 1st ed: The Evolving SRE Engagement Model",
          url: "https://sre.google/sre-book/evolving-sre-engagement-model/",
        }
      - {
          title: "SRE book, 1st ed: Launch Coordination Checklist",
          url: "https://sre.google/sre-book/launch-checklist/",
        }
    actions:
      - {
          id: close-b2,
          type: whiteboard.apply,
          at: { mark: close-b2, offsetMs: -400 },
          clear: true,
        }
      - id: b3-s1
        type: whiteboard.apply
        at: { mark: b3-s1 }
        open: true
        clear: true
        upsertIds: [l16-b3-r1, l16-b3-r1-t1, l16-b3-r1-t2, l16-b3-r1-t3]
        drawMs: 1600
      - id: b3-s2
        type: whiteboard.apply
        at: { mark: b3-s2 }
        upsertIds: [l16-b3-a1, l16-b3-r2, l16-b3-r2-t1, l16-b3-r2-t2, l16-b3-r2-t3]
        drawMs: 1800
      - id: b3-s3
        type: whiteboard.apply
        at: { mark: b3-s3 }
        upsertIds: [l16-b3-a2, l16-b3-r3, l16-b3-r3-t1, l16-b3-r3-t2, l16-b3-r3-t3]
        drawMs: 1800

  - id: stopped-questions
    chapter: ဂိတ်စောင့်ကနေ ကူညီသူ
    narration: >
      [[mark:close-b3]] [[mark:show-p04]] ဒါပေမဲ့ လူ သုံးယောက်နဲ့ design တိုင်းမှာ ဝင်ထိုင်လို့ မရပါဘူး။ မသီရိဆီ Viber ကနေ alert ဘယ်လို ထည့်ရမလဲ၊ လစာထုတ်ရက်မှာ deploy လုပ်လို့ ရလား ဆိုတဲ့ မေးခွန်းတွေလည်း နေ့တိုင်း ဝင်လာလို့ အပတ်တိုင်း ရေတွက်ကြည့်ပါတယ်။ အများဆုံး မေးတဲ့ သုံးခုကို lesson ၄ က service အသစ် ဆောက်တိုင်း သုံးတဲ့ golden path template ထဲမှာ check တွေ အဖြစ် ထည့်လိုက်တော့ နောက်တစ်လမှာ အဲဒီ မေးခွန်းတွေ မလာတော့ပါဘူး။
      [[mark:show-p04b]] ဒါက SRE အကူအညီကို ချဲ့တဲ့ လှေကားပါ။ မေးတာကို ဖြေပေးတာကနေ ကိုယ်တိုင် ဖြေတတ်အောင် သင်ပေးတာ၊ နောက်ဆုံး template ထဲက check တွေနဲ့ မေးစရာကိုပါ မလိုအောင် လုပ်ပေးတာအထိ တက်သွားပါတယ်။ ဒီလိုနဲ့ SRE က launch တိုင်းကို တားစစ်တဲ့ ဂိတ်စောင့်ကနေ ကူညီပေးသူ ဖြစ်လာပြီး risk များတဲ့ launch ကိုပဲ review လုပ်ပါတော့တယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book, 1st ed: The Evolving SRE Engagement Model",
          url: "https://sre.google/sre-book/evolving-sre-engagement-model/",
        }
      - {
