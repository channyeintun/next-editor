  - id: big-customer
    chapter: customer ကြီး တစ်ခု
    narration: >
      [[mark:show-p04c]] အဲဒီ သုံးလပတ်ထဲမှာပဲ Padauk for Business ရဲ့ developer တစ်ယောက်က merchant တွေဆီ နေ့တိုင်း ပို့တဲ့ settlement file ထဲက column တစ်ခုကို နေရာ ရွှေ့လိုက်ပါတယ်။ SLO တိုင်း အစိမ်းရောင် ဖြစ်နေပေမဲ့ နောက်တစ်မနက် အကြီးဆုံး customer ဖြစ်တဲ့ supermarket chain က ထပ်ပြီး ဖုန်းဆက်လာပါတယ်၊ သူတို့ရဲ့ import script က file ကို ဖတ်မရတော့လို့ပါ။
      [[mark:show-p05]] chain က ကတိ မပေးထားတဲ့ column အစဉ်ကို အားကိုးနေခဲ့တာပါ။ lesson ၇ က Hyrum's law အတိုင်းပဲ user များလာရင် ကတိ မပေးထားတဲ့ အပြုအမူကိုတောင် တစ်ယောက်ယောက်က အားကိုးလာတတ်ပါတယ်။
      SLO က user အများကြီးကို ပေါင်းကြည့်တာမို့ complaint တစ်ခုက သိပ်မပေါ်ပါဘူး။ ဒါပေမဲ့ customer ကြီး တစ်ခုရဲ့ complaint ကတော့ outage တစ်ခုလောက် အရေးကြီးလို့ သူ့ account manager ကနေ အရင် ပြောရပါတယ်။
      [[mark:show-p05b]] တခြား merchant တွေက ပုံစံသစ်နဲ့ အဆင်ပြေနေလို့ rollback မလုပ်ဘဲ merchant အလိုက် file ပုံစံဟောင်းကို ရွေးလို့ရတဲ့ setting ထည့်ပေးပါတယ်။ user သန်းချီ ဆိုရင်တော့ rollback ကို အရင် လုပ်ပါတယ်၊ ပြင်တာလည်း အားလုံးအတွက် တစ်ခါတည်းပါ။ customer ကြီး တစ်ခုအတွက်တော့ အရင် ပြောပြီးမှ ပြင်ပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Workbook: SRE Engagement Model",
          url: "https://sre.google/workbook/engagement-model/",
        }
    actions:
      - { id: show-p04c, type: slide.show, at: { mark: show-p04c }, slideId: l16-p04c }
      - { id: show-p05, type: slide.show, at: { mark: show-p05 }, slideId: l16-p05 }
      - { id: show-p05b, type: slide.show, at: { mark: show-p05b }, slideId: l16-p05b }

  - id: now-next-year
    chapter: Bill Pay အခုနဲ့ နောက်နှစ်
    narration: >
      [[mark:show-p06]] သုံးလ ကြာတော့ engagement ကို ပြန်ကြည့်ပါတယ်။ အခု SRE က Bill Pay ရဲ့ မီးတွေကို ငြိမ်းပေးနေတုန်းပါ၊ စဖို့ သင့်တော်တဲ့ နေရာ ဖြစ်ပေမဲ့ အမြဲ နေရမယ့် နေရာ မဟုတ်ပါဘူး။ နောက်နှစ်မှာ Bill Pay အဖွဲ့က ကိုယ်တိုင် run ပြီး SRE က product တစ်ခုကို နက်နက် ကူတာနဲ့အတူ product တိုင်း သုံးတဲ့ ဘုံ check တွေကိုလည်း ဆောက်ပါမယ်။
