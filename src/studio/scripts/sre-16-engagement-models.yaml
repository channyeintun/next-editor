  - id: this-week
    narration: >
      [[mark:show-p07]] တခြား အဖွဲ့ တစ်ခုနဲ့ တွဲလုပ်နေရင် ဒီအပတ် ဒီ သုံးခုကို စမ်းကြည့်ပါ။ အဲဒီ အဖွဲ့နဲ့ ကိုယ့် engagement ကို စာကြောင်း ငါးကြောင်းနဲ့ ရေးကြည့်ပါ။ task တွေ မဟုတ်ဘဲ ရယူချင်တဲ့ ရလဒ် သုံးခုကို အရေးကြီးတဲ့ အစဉ်နဲ့ စီကြည့်ပါ။ ပြီးတော့ ဘယ် page ကို ဘယ်သူ ယူမလဲ ဆိုတာ အတူ သဘောတူထားပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Workbook: SRE Engagement Model",
          url: "https://sre.google/workbook/engagement-model/",
        }
    actions:
      - { id: show-p07, type: slide.show, at: { mark: show-p07 }, slideId: l16-p07 }

  - id: recap
    narration: >
      [[mark:close-p07]] [[mark:open-notes]] Bill Pay နဲ့ တွဲလုပ်ခဲ့ပုံကို ပြန်ကြည့်ရအောင်။ [[mark:sel-engagement]] engagement က SRE နဲ့ product team ဘယ်လို တွဲလုပ်မလဲ၊ ဘယ်တော့ ပြီးမလဲ ရေးထားတဲ့ သဘောတူညီချက်ပါ။ [[mark:sel-outcomes]] အစဉ်စီထားတဲ့ ရလဒ်က အလုပ်ကို task နဲ့ မဟုတ်ဘဲ ရလဒ်နဲ့ စီတာပါ၊ ထိပ်ဆုံးတွေကို အချိန် ကန့်သတ်ထားတဲ့ project တွေနဲ့ လုပ်ပါတယ်။
      [[mark:sel-shared-oncall]] on-call ခွဲယူတာက app page ကို developer က၊ database နဲ့ gateway page ကို SRE က ယူတာပါ။ [[mark:sel-handback]] ကြိုစီစဉ်ထားတဲ့ handback က ရက်စွဲ၊ runbook၊ training နဲ့ on-call ပြန်လွှဲတာပါ။ [[mark:sel-nfr]] nonfunctional requirement က ဘယ်လောက် မြန်ရမလဲ၊ စိတ်ချရရမလဲ ဆိုတာပါ၊ [[mark:sel-hyrum]] Hyrum's law ကတော့ ကတိ မပေးထားတာကိုတောင် တစ်ယောက်ယောက် အားကိုးလာမယ် ဆိုတာပါ။
      [[mark:sel-four-checks]] engagement တိုင်းမှာ စစ်စရာ လေးခု ရှိပါတယ်၊ SRE ကို reliability အလုပ်ပေါ်မှာ ထားသလား၊ business ကို အကျိုး အများဆုံး ပေးသလား၊ SRE ကို အလုပ် မပိစေဘူးလား၊ တွဲလုပ်ရ လွယ်သလား ဆိုတာပါ။ [[mark:ask-question]] Bill Pay က pager တစ်ခုလုံး ယူပေးပါလို့ ထပ်တောင်းရင် အဲဒီအစား ဘာ ကမ်းလှမ်းမလဲ?
      [[mark:pause-question]] အစဉ်စီထားတဲ့ ရလဒ်တွေ၊ အတူ လုပ်မယ့် project တစ်ခုနဲ့ ပြီးမယ့် ရက် ပါတဲ့ on-call ခွဲယူမှုကို ကမ်းလှမ်းနိုင်ပါတယ်။ Module ၅ မှာ SRE အဖွဲ့ လေးယောက် ဖြစ်လာပေမဲ့ အလုပ်ချိန်ကို တိုင်းကြည့်တော့ တစ်ပတ်ရဲ့ တစ်ဝက်ကျော်က လက်နဲ့ ထပ်ခါထပ်ခါ လုပ်ရတဲ့ toil ဖြစ်နေပါတယ်။ ဘယ်ကနေ စမလဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Workbook: SRE Engagement Model",
          url: "https://sre.google/workbook/engagement-model/",
        }
      - {
          title: "SRE book, 1st ed: The Evolving SRE Engagement Model",
          url: "https://sre.google/sre-book/evolving-sre-engagement-model/",
        }
    actions:
      - { id: close-p07, type: slide.close, at: { mark: close-p07 } }
      - {
          id: open-notes,
          type: workspace.openFile,
          at: { mark: open-notes, offsetMs: 300 },
          path: notes.md,
        }
      - {
          id: sel-engagement,
          type: editor.select,
          at: { mark: sel-engagement },
          target: { file: notes.md, text: "engagement", occurrence: 1 },
        }
      - {
          id: sel-outcomes,
          type: editor.select,
          at: { mark: sel-outcomes },
          target: { file: notes.md, text: "အစဉ်စီထားတဲ့ ရလဒ်", occurrence: 1 },
        }
      - {
          id: sel-shared-oncall,
          type: editor.select,
          at: { mark: sel-shared-oncall },
          target: { file: notes.md, text: "on-call ခွဲယူတာ", occurrence: 1 },
        }
      - {
          id: sel-handback,
          type: editor.select,
          at: { mark: sel-handback },
          target: { file: notes.md, text: "ကြိုစီစဉ်ထားတဲ့ handback", occurrence: 1 },
        }
      - {
          id: sel-nfr,
          type: editor.select,
          at: { mark: sel-nfr },
          target: { file: notes.md, text: "nonfunctional requirement", occurrence: 1 },
        }
      - {
          id: sel-hyrum,
          type: editor.select,
          at: { mark: sel-hyrum },
          target: { file: notes.md, text: "Hyrum's law", occurrence: 1 },
        }
      - {
          id: sel-four-checks,
          type: editor.select,
          at: { mark: sel-four-checks },
          target: { file: notes.md, text: "စစ်စရာ လေးခု", occurrence: 1 },
        }
      # The voice script's ⟪select မေးခွန်း⟫ and ⟪pause 3s⟫, the way the Module 1
      # reviewers fixed the pause. ⟪select မေးခွန်း⟫ (ask-question) already starts
      # the question's own dialog, but a select right there would drag under the
      # question and leave no pause, and one at pause-question would drag under
      # the answer's first words (the scheduler holds only the dialog after its
      # anchor's). So the question-line select hangs off ask-question with an
      # offset: it starts about as the question ends, its drag runs in silence,
      # and the answer at pause-question waits for it. The question is 77
      # characters, so 5790 (400 + 77 x 70) starts the drag as the question ends
      # at 70 ms per char and leaves about 2.8 / 1.6 / 0.5 s of quiet before the
      # answer at 55 / 70 / 95; an offset above ~6000 trips compile-check's
      # 2.5 s inserted-silence warning at 55.
      - id: select-question
        type: editor.select
        at: { mark: ask-question, offsetMs: 5790 }
        target:
          file: notes.md
          text: "မေးခွန်း: Bill Pay က pager တစ်ခုလုံး ယူပေးပါလို့ ထပ်တောင်းရင် pager အစား ဘာ ကမ်းလှမ်းမလဲ?"
          occurrence: 1

checks:
  # 500, not 300: google-svg deck pages stall the main thread at show/close.
  - { type: timing.p95Ms, max: 500 }
