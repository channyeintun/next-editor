build:
  # Studio swaps in the Burmese voice chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 2616

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: hook
    chapter: pager ကို ယူပေးပါ
    narration: >
      [[mark:show-p01]] မသီရိ၊ ကိုဇော်နဲ့ နောက်တစ်ယောက် ပါတဲ့ Site Reliability Engineering၊ SRE အဖွဲ့က Wallet နဲ့ Top-up အတွက် charter တစ်ခုနဲ့ အလုပ်စလိုက်ပြီး လစဉ် review မှာလည်း ဘယ်အဖွဲ့ကိုမှ အဆင့် မစီတော့ပါဘူး။
      [[mark:hook-billpay]] မကြာခင်မှာပဲ မီတာခ၊ ရေခ ပေးလို့ရတဲ့ Bill Pay ရဲ့ ခေါင်းဆောင်က ပြင်လို့မရတဲ့ vendor billing system ကြောင့် ညတိုင်းလိုလို page ဝင်လာလို့ အဖွဲ့ ပင်ပန်းနေပြီ၊ အဲဒီ page တွေ ဖြေရတဲ့ on-call တာဝန်၊ pager ကို SRE က အပြည့် ယူပေးပါလို့ လာတောင်းပါတယ်။ လူ သုံးယောက်ပဲ ရှိတဲ့ SRE အဖွဲ့က pager အစား ဘာကို ယူသင့်လဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Workbook: SRE Engagement Model",
          url: "https://sre.google/workbook/engagement-model/",
        }
      - {
          title: "SRE book, 1st ed: The Evolving SRE Engagement Model",
          url: "https://sre.google/sre-book/evolving-sre-engagement-model/",
        }
    actions:
      # -1750 / -1450, as in Module 1: a pull-back over 1780 ms pushes the first dialog
      # past the 2 s opening handle, which src/studio/plans/index.test.ts rejects.
      - { id: collapse-dock, type: runtime.collapseDock, at: { scene: start, offsetMs: -1750 } }
      - {
          id: show-p01,
          type: slide.show,
          at: { mark: show-p01, offsetMs: -1450 },
          slideId: l16-p01,
        }

  - id: agreement
    chapter: Engagement ဆိုတာ
    narration: >
      [[mark:show-p01b]] ရပါတယ်လို့ ဖြေလိုက်ရင် လွယ်ပေမဲ့ အရင်က လုပ်ခဲ့ပုံတွေက အဲဒီ တစ်ခွန်းရဲ့ ကုန်ကျစရိတ်ကို သင်ပေးခဲ့ပါတယ်။ review ကြီး အောင်မှ SRE က လက်ခံရင် design ပြောင်းဖို့ နောက်ကျမှ ရောက်လာပါတယ်။ pager ကို တစ်ခါ ယူပြီးရင် ပြန်ပေးရ ခက်ပြီး developer တွေလည်း production ကို ဆက်မသင်တော့ပါဘူး။
      [[mark:p01b-levels]] pager ဘယ်သူ ယူလဲ ဆိုတာနဲ့ support အဆင့် ခွဲရင် အဖွဲ့တိုင်းက Bill Pay လိုပဲ pager ပါတဲ့ အဆင့်ကို လိုချင်ကြပါတယ်။ launch တိုင်းကို review လုပ်ရင်လည်း launch တွေ များလာတာကို SRE လူ တိုးတာနဲ့ မမီတော့ပါဘူး။
      [[mark:show-p02]] ဒါကြောင့် မသီရိက ရတယ်၊ မရဘူးလို့ မဖြေဘဲ engagement တစ်ခု အတူ ရေးကြရအောင်လို့ ပြောပါတယ်။ engagement ဆိုတာ SRE နဲ့ product team ဘယ်လို တွဲလုပ်မလဲ ရေးထားတဲ့ တိုတိုလေး သဘောတူညီချက်ပါ။ ဘယ်သူ ဘာ ပိုင်လဲ၊ ဘယ် ရလဒ်တွေ ရယူမလဲ၊ on-call ကို ဘယ်လို ခွဲယူမလဲ၊ ဘယ်တော့ ဘယ်လို ပြီးမလဲ ဆိုတာ ပါရပါမယ်။
      အဆုံးကို အစကတည်းက ရေးထားမှ engagement က အဆုံးမဲ့ မဖြစ်မှာပါ။ business အတွက် ဘယ် risk တွေ အရေးအကြီးဆုံးလဲ ဆိုတာကိုလည်း နှစ်ဖက် အရင် သဘောတူရပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book, 1st ed: The Evolving SRE Engagement Model",
          url: "https://sre.google/sre-book/evolving-sre-engagement-model/",
        }
      - {
          title: "Workbook: SRE Engagement Model",
          url: "https://sre.google/workbook/engagement-model/",
        }
    actions:
      - { id: show-p01b, type: slide.show, at: { mark: show-p01b }, slideId: l16-p01b }
      - { id: show-p02, type: slide.show, at: { mark: show-p02 }, slideId: l16-p02 }

  - id: team-shapes
    chapter: SRE အဖွဲ့ ပုံစံတွေ
    narration: >
      [[mark:show-p03]] Bill Pay တောင်းတာကို လက်ခံရင် မသီရိရဲ့ အဖွဲ့က ဘာမဆို on-call ယူပေးတဲ့ kitchen sink အဖွဲ့ ဖြစ်သွားပြီး engineering လုပ်ချိန် မကျန်တော့ပါဘူး။ ops အဖွဲ့ကို SRE လို့ နာမည်ပဲ ပြောင်းပြီး ဘယ်သူမှ code မရေးရင်လည်း ဒီ ပုံစံပဲ ဖြစ်ပြီး ဘာမှ မပြောင်းပါဘူး။
      product team ထဲ ဝင်လုပ်တဲ့ embedded SRE က system ကို နီးနီးကပ်ကပ် သိပေမဲ့ တစ်ယောက်တည်း ဖြစ်လို့ တခြား SRE တွေနဲ့ လုပ်ပုံ ကွဲသွားတတ်ပါတယ်။ လိုမှ လာမေးတဲ့ consulting ကတော့ system ကို နက်နက် မသိပါဘူး။
      [[mark:show-p03b]] product SRE၊ infrastructure SRE၊ tool ဆောက်တဲ့ tools SRE လို ပုံစံတွေလည်း ရှိပြီး ကုမ္ပဏီ အများစုက ရောသုံးကြပါတယ်။ Padauk ကြီးလာရင် Wallet မှာ product SRE၊ rider tracking ထဲမှာ embedded SRE၊ မျှသုံးတဲ့ cluster မှာ infrastructure SRE ထားပြီး ကျန်တဲ့ အဖွဲ့တွေကို အပတ်စဉ် လာမေးလို့ရတဲ့ office hours နဲ့ ကူဖို့ မသီရိ ပုံကြမ်း ဆွဲထားပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Workbook: SRE Engagement Model",
          url: "https://sre.google/workbook/engagement-model/",
        }
      # Listed for this lesson in the curriculum: the public list of team shapes.
      - {
          title: "SRE at Google: How to structure your SRE team (Google Cloud Blog)",
          url: "https://cloud.google.com/blog/products/devops-sre/how-sre-teams-are-organized-and-how-to-get-started",
        }
    actions:
      - { id: show-p03, type: slide.show, at: { mark: show-p03 }, slideId: l16-p03 }
      - { id: show-p03b, type: slide.show, at: { mark: show-p03b }, slideId: l16-p03b }

  - id: outcomes
    chapter: Bill Pay ရဲ့ ရလဒ်တွေ
    narration: >
      [[mark:close-p03b]] [[mark:b1-s1]] engagement ရေးတဲ့နေ့မှာ မသီရိနဲ့ Bill Pay ခေါင်းဆောင်က user တွေနဲ့ business ကို ဘာက ဒုက္ခ အပေးဆုံးလဲ မေးပြီး ရလဒ်တွေကို အရေးကြီးတဲ့ အစဉ်နဲ့ စီပါတယ်။ ပထမက ဘေလ် ကောက်တဲ့ဘက်က timeout ကြောင့် pending မှာ ပိတ်မိနေတဲ့ ငွေချေမှု မရှိရ၊ ဒုတိယက ဘေလ် နောက်ဆုံးရက် reminder တွေ ပို့ချိန် လူတွေ တပြိုင်နက် ဝင်လာလည်း Wallet မနှေးရ ဆိုတာပါ။
      [[mark:b1-s2]] တတိယက ပြေစာ တစ်မိနစ်အတွင်း ရောက်ရ၊ စတုတ္ထက vendor ဆီက file အမှားကို မနက် ၆ နာရီ မတိုင်ခင် ဖမ်းမိရ ဆိုတာပါ။ ဒါတွေက SRE လုပ်ပေးရမယ့် task စာရင်း မဟုတ်ဘဲ user နဲ့ business တကယ် ခံစားရမယ့် ရလဒ်တွေပါ။ ဘယ်သူ ဘာ လုပ်မလဲ ဆိုတာကိုတော့ ရလဒ်တွေ သဘောတူပြီးမှ ခွဲပါတယ်။
      [[mark:b1-s3]] SRE သုံးယောက်မှာ Wallet နဲ့ Top-up အလုပ်လည်း ရှိလို့ လူအင်အားက ထိပ်ဆုံး နှစ်ခုအတွက်ပဲ လောက်ပါတယ်။ အဲဒီ နှစ်ခုအတွက် နှစ်ဖက်က engineer တွေ ၈ ပတ်ကနေ ၁၀ ပတ်အထိ အတူ လုပ်မယ့် project တွေ ဖွဲ့ပြီး project ပြီးရင် SRE က နောက် ရလဒ်ဆီ ရွှေ့ပါတယ်။ engagement တစ်ခုလုံးအတွက် တာဝန်ခံ tech lead ကတော့ ကိုဇော်ပါ။
      [[mark:b1-s4]] ticket၊ မေးခွန်းလို ကြားဖြတ် အလုပ်ကိုတော့ အဖွဲ့ နှစ်ခုလုံး ခွဲယူပါတယ်။ project မရတဲ့ အဖွဲ့တွေတောင် postmortem review၊ office hours၊ incident ကြီးမှာ ဝင်ကူတာလို အခြေခံ အကူအညီကို အမြဲ ရပါတယ်။ [[mark:b1-s4b]] ရလဒ် စာရင်းကိုလည်း သုံးလ တစ်ခါ ပြန်စီပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Workbook: SRE Engagement Model",
          url: "https://sre.google/workbook/engagement-model/",
        }
      - {
          title: "SRE book, 1st ed: The Evolving SRE Engagement Model",
          url: "https://sre.google/sre-book/evolving-sre-engagement-model/",
        }
    actions:
      - { id: close-p03b, type: slide.close, at: { mark: close-p03b, offsetMs: -400 } }
      - id: b1-s1
        type: whiteboard.apply
        at: { mark: b1-s1 }
        open: true
        clear: true
        upsertIds: [l16-b1-c1, l16-b1-c1-t1, l16-b1-c1-t2, l16-b1-c2, l16-b1-c2-t1, l16-b1-c2-t2]
        drawMs: 1800
      - id: b1-s2
        type: whiteboard.apply
        at: { mark: b1-s2 }
        upsertIds: [l16-b1-c3, l16-b1-c3-t1, l16-b1-c3-t2, l16-b1-c4, l16-b1-c4-t1, l16-b1-c4-t2]
        drawMs: 1800
      # The SRE-capacity line under card 2, the arrow from cards 1-2, the joint project.
      - id: b1-s3
        type: whiteboard.apply
        at: { mark: b1-s3 }
        upsertIds:
          [l16-b1-cap, l16-b1-cap-t, l16-b1-a1, l16-b1-proj, l16-b1-proj-t1, l16-b1-proj-t2]
        drawMs: 2200
      - id: b1-s4
        type: whiteboard.apply
        at: { mark: b1-s4 }
        upsertIds: [l16-b1-base, l16-b1-base-t1, l16-b1-base-t2]
        drawMs: 1600
      # "Re-rank every quarter" lands as the last sentence says it, not ~16 s early.
      - id: b1-s4b
        type: whiteboard.apply
        at: { mark: b1-s4b }
        upsertIds: [l16-b1-rerank]
        drawMs: 800

  - id: pagers
    chapter: ဘယ် pager ကို ဘယ်သူ ယူမလဲ
    narration: >
      [[mark:close-b1]] [[mark:b2-s1]] ဒါဆို pager ကို SRE က ဘာလို့ မယူတာလဲ? ပြီးခဲ့တဲ့ သင်္ကြန်က ကံစမ်းမဲ service ကို ကြည့်ပါ။ [[mark:b2-s1b]] ပွဲတော် ခဏပဲ ဆိုပြီး SRE က pager ကို ယူပေးခဲ့ပေမဲ့ launch ပြီးတော့ developer တွေက project အသစ်ဆီ ရွှေ့သွားလို့ လတွေ ကြာတဲ့အထိ ပိုင်ရှင်မဲ့ service ရဲ့ page တွေကို SRE ကပဲ ဖြေနေရပါတယ်။
      [[mark:b2-s2]] ဒါကြောင့် အဲဒီ service ကို ဆောက်ခဲ့တဲ့ အဖွဲ့ဆီ ပြန်ပေးပါတယ်။ on-call တာဝန်ကို developer တွေဆီ ပြန်လွှဲတာကို handback လို့ ခေါ်ပြီး ဒီတစ်ခါတော့ ရက်စွဲ၊ runbook၊ training နဲ့ ကြိုစီစဉ်ပြီး လွှဲတာပါ၊ office hours လည်း ဆက်ရှိပါတယ်။ lesson ၃ မှာတော့ service က သဘောတူထားတဲ့ reliability ပစ်မှတ် ဖြစ်တဲ့ service level objective၊ SLO ကို ခဏခဏ မမီလို့ ပြန်လွှဲတာပါ။
      [[mark:b2-s3]] Bill Pay အတွက်တော့ on-call ကို ခွဲယူပါတယ်။ [[mark:b2-s3b]] app ရဲ့ page တွေကို developer တွေက အရင် ဖြေပြီး မျှသုံးတဲ့ database နဲ့ ဘေလ် ကောက်တဲ့ ကုမ္ပဏီတွေဆီ ချိတ်တဲ့ gateway ရဲ့ page တွေကိုတော့ SRE က ယူပါတယ်။ ဒီနေ့ release မှာ ဘာ ပြောင်းသွားလဲ ဆိုတာ developer တွေပဲ သိလို့ ညဘက်မှာလည်း ဆက်သွယ်လို့ ရနေရပါတယ်။ on-call ကနေ နှစ်ဖက်လုံး production ကို သင်ယူကြပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Workbook: SRE Engagement Model",
          url: "https://sre.google/workbook/engagement-model/",
        }
      - {
          title: "SRE book, 1st ed: The Evolving SRE Engagement Model",
          url: "https://sre.google/sre-book/evolving-sre-engagement-model/",
        }
    actions:
      # ⟪close board⟫ into the next board: wipe B1 400 ms early, keep the panel open.
      - {
          id: close-b1,
          type: whiteboard.apply,
          at: { mark: close-b1, offsetMs: -400 },
          clear: true,
        }
      # Top lane, two boxes and two: design and launch first, then (b2-s1b) the
      # developers moving on and SRE left with the pager as the narration says so.
      - id: b2-s1
        type: whiteboard.apply
        at: { mark: b2-s1 }
        open: true
        clear: true
        upsertIds: [l16-b2-r1, l16-b2-r1-t, l16-b2-a1, l16-b2-r2, l16-b2-r2-t]
        drawMs: 1400
      - id: b2-s1b
        type: whiteboard.apply
        at: { mark: b2-s1b }
        upsertIds:
          [
            l16-b2-a2,
            l16-b2-r3,
            l16-b2-r3-t1,
            l16-b2-r3-t2,
            l16-b2-a3,
            l16-b2-r4,
            l16-b2-r4-t1,
            l16-b2-r4-t2,
          ]
        drawMs: 4000
      - { id: b2-s2, type: whiteboard.apply, at: { mark: b2-s2 }, upsertIds: [l16-b2-lane2] }
      - id: b2-s2-draw
        type: whiteboard.apply
        at: { afterAction: b2-s2 }
        upsertIds: [l16-b2-r5, l16-b2-r5-t, l16-b2-a5, l16-b2-r6, l16-b2-r6-t]
        drawMs: 1800
      # Bottom lane: the "Bill Pay" title as the narration names it, then the
