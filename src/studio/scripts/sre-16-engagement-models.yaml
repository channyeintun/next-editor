# SRE from zero, lesson 16: Working with product teams (Burmese concept lesson).
#
# Built from the approved voice script
# docs/sre-course/voice-scripts/sre-16-engagement-models.md. Every spoken
# character is that script's "> " lines, unchanged; each ⟪…⟫ marker became a
# [[mark:…]] at the same place. Check it with:
#   bun ~/Documents/sre-course/work/check-narration.ts \
#     docs/sre-course/voice-scripts/sre-16-engagement-models.md \
#     src/studio/scripts/sre-16-engagement-models.yaml
#
# Nothing runs: deck pages and the whiteboard carry the lesson, and notes.md is
# the recap. The workspace and runtime follow the validated no-code skeleton
# (WebContainer, empty init command, a harmless dev script).
#
# Six marks add no spoken text and sit at an existing ။ or ?:
# hook-billpay and p01b-levels split the hook's narration and l16_p01b's
# narration at their paragraph breaks (one 491- or 475-character dialog would
# pass the 450-character limit; no action uses them); b2-s1b and b2-s3b let
# board B2's top lane and bottom lane land as the narration names them, so no
# step adds more than three labelled boxes at once (the top lane's four boxes
# are split two and two, as Module 1 split its four-box rows, and the bottom
# lane's two rows are two applies, the second after the first); b1-s4b lands
# B1's "re-rank every quarter" label on the sentence that says it; and
# ask-question is the voice script's ⟪select မေးခွန်း⟫, which already starts
# the question's own dialog, so the question-line select hangs off it for the
# ⟪pause 3s⟫, as in Module 1.
#
# ⟪close board⟫ straight into the next board (scenes 5 and 6) wipes the open
# board 400 ms early (whiteboard.apply clear) instead of closing the panel, so
# the editor does not flash between two boards, as in lesson 8; the next board
# then draws with open: true, clear: true as usual. A board followed by a deck
# page closes the panel (open: false) 400 ms before the page, as in Module 1.
#
# Boards (B1 a column of four ranked cards, B2 P6 lanes, B3 P1 flow). Colour
# jobs: #1e1e1e ink (paints white) for arrows; blue the thing named (the ranked
# outcomes, the design/launch steps, Bill Pay's lane); green healthy or done
# (the planned handback, v1 shipping ready); red failure or limit spent (SRE
# stuck with the pager, the SRE-capacity line); orange the caveat (developers
# moving on); violet the result (the joint project, the always-on basics, the
# design that follows the SLO). A label on two or three lines is one text asset
# per line, so each line meets the 0.55 em width rule on its own; every label
# was also measured in Chrome with Excalidraw's Virgil font and fits its box.
# B3 runs top to bottom, not left to right as the voice script sketches it:
# its widest lines ("dashboard · runbook", "queue · order key", 17-19 code
# points) need boxes of 262-293 px under the 0.55 rule, and three of those
# plus two arrows do not fit across the 850 px visible area.
#
# Deck pages: deck "Next Editor · SRE 4 · People and teams". The /pub URL
# below is a placeholder until Chan publishes the deck with this lesson's
# pages; until then the Director reports the deck unreachable or, while the
# published copy still holds only the kit pages, the l16 pages missing. The
# voice script asks for l16_p05b as two plain K3 columns (no better/worse
# colouring). Page plan:
# ~/Documents/sre-course/work/pages/sre-16-engagement-models.json
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/sre-16-engagement-models.yaml
#   bun scripts/studio-compile-check.ts src/studio/scripts/sre-16-engagement-models.yaml
