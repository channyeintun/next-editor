      notes.md: |
        # Product team နဲ့ ဘယ်လို တွဲလုပ်မလဲ

        - engagement — SRE နဲ့ product team ဘယ်လို တွဲလုပ်မလဲ၊ ဘယ်တော့ ပြီးမလဲ ရေးထားတဲ့ သဘောတူညီချက်
        - အစဉ်စီထားတဲ့ ရလဒ် — task မဟုတ်ဘဲ ရလဒ်၊ ထိပ်ဆုံးတွေကို အချိန် ကန့်သတ်ထားတဲ့ project နဲ့ လုပ်
        - on-call ခွဲယူတာ — app page က developer၊ database နဲ့ gateway page က SRE
        - ကြိုစီစဉ်ထားတဲ့ handback — ရက်စွဲ၊ runbook၊ training နဲ့ on-call ပြန်လွှဲ
        - nonfunctional requirement — ဘယ်လောက် မြန်ရမလဲ၊ စိတ်ချရရမလဲ
        - Hyrum's law — ကတိ မပေးထားတဲ့ အပြုအမူကိုတောင် တစ်ယောက်ယောက် အားကိုး
        - စစ်စရာ လေးခု — reliability ပေါ်မှာလား · business အကျိုး အများဆုံးလား · SRE အလုပ် မပိဘူးလား · တွဲလုပ်ရ လွယ်လား

        မေးခွန်း: Bill Pay က pager တစ်ခုလုံး ယူပေးပါလို့ ထပ်တောင်းရင် pager အစား ဘာ ကမ်းလှမ်းမလဲ?
