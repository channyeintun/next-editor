# Go course, lesson 04: whole numbers, decimals and constants (Burmese).
#
# Start state: main.go with `package main`, `import "fmt"` and an empty `func main`.
# Edits, all insert-only:
#   1. `const lakh`, a salary and the lakhs line (/), then the rest line (%) -> run-1:
#      17 သိန်း / 50000 ကျပ်;
#   2. viss (int), kgPerViss (float64), kg := viss * kgPerViss and its Println -> run-2: compile
#      error `./main.go:12:8: invalid operation: viss * kgPerViss (mismatched types int and float64)`;
#   3. `float64(` + `)` around viss, then a Println of int(kg) -> run-3 adds 4.899 ကီလို /
#      4 ကီလို အပြည့်.
# Boards: (L) lakh bundles: / counts the bundles, % is the loose rest; (T) int and float64 do not
# mix, a written conversion does; (F) 0.1 + 0.2 as variables, so money stays int, and min / max;
# (Q) quiz: float64 of an integer division.
# Fixtures: bun ~/Documents/go-course-work/tools/sim-go.ts <this yaml> --write
schemaVersion: 1

lesson:
  slug: go-course-04-numbers
  title: "Go course 04: ကိန်းပြည့်နဲ့ ဒသမ ကိန်း"
  locale: my-MM
  workspace:
    lessonType: go
    name: Go Course
    entryFilePath: main.go
    # One file: an open explorer would be a list of one beside the code.
    sidebarStartsCollapsed: true
    files:
      main.go: |
        package main

        import "fmt"

        func main() {
        }
