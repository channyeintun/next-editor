        fontSize: 36,
      }
    - { id: l-b1, kind: rectangle, x: 290, y: 245, width: 80, height: 60, strokeColor: "#1971c2" }
    - { id: l-b2, kind: rectangle, x: 385, y: 245, width: 80, height: 60, strokeColor: "#1971c2" }
