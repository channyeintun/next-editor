build:
  # Studio replaces this built-in profile at render time with the Burmese provider chosen in the
  # render console (AthanLab with the user's own key, or VoxCPM2 when that feature is enabled).
  voiceProfile: pocket-alba-v1
  seed: 5106
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: open
    chapter: "Test တွေ data ကို မျှသုံးရင်"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ test တွေကို describe နဲ့ အုပ်စုဖွဲ့ပြီး၊ test တစ်ခုကို ပြင်ဆင်၊
      လုပ်ဆောင်၊ စစ်ဆေး ဆိုတဲ့ အဆင့် သုံးဆင့်နဲ့ ရေးခဲ့ပါတယ်။ ဒီ lesson မှာတော့ test တွေ တစ်ခုနဲ့
      တစ်ခု မထိခိုက်အောင် ဘယ်လို ခွဲထားမလဲ ဆိုတာ ကြည့်ပါမယ်။ [[mark:draw-queue]] ဆိုင်ရဲ့
      မီးဖိုချောင်မှာ အော်ဒါ စာရွက်တွေကို ဝင်လာတဲ့ အစဉ်အတိုင်း တန်းစီထားတဲ့ queue တစ်ခု ရှိပါတယ်။
      အရင် ဝင်လာတဲ့ အော်ဒါကို အရင် ချက်ပေးပါတယ်။ code ထဲမှာလည်း ဒီ queue က ဖိုင်တစ်ခုလုံးမှာ
      တစ်ခုတည်းပဲ ရှိပါတယ်။ [[mark:draw-tests]] ဒီ queue အတွက် test သုံးခု ရေးထားပါတယ်။ ပထမ test က
      အော်ဒါ တစ်ခု ထည့်ပြီး queue မှာ တစ်ခု ရှိလားလို့ စစ်ပါတယ်။ ဒုတိယ test က အော်ဒါ နှစ်ခု ထည့်ပြီး၊
      အရင် ဝင်တဲ့ လှလှရဲ့ အော်ဒါ အရင် ထွက်လာလားလို့ စစ်ပါတယ်။ တတိယ test ကတော့ ဘာမှ မထည့်ရသေးတဲ့
      queue က အလွတ် ဖြစ်ရမယ်လို့ စစ်ပါတယ်။ [[mark:draw-shared]] test သုံးခုလုံးက queue
      တစ်ခုတည်းကိုပဲ သုံးနေကြတာ သတိထားကြည့်ပါ။ ဒါဆို test တစ်ခု ထည့်ခဲ့တဲ့ အော်ဒါက နောက် test
      ထဲအထိ ကျန်နေမလား။
    sources:
      - {
          title: "Vitest: Setup and Teardown",
          url: "https://vitest.dev/guide/learn/setup-teardown",
        }
      - {
          title: "Google Testing Blog: Test Sizes, tests must run in any order (facts C15)",
          url: "https://testing.googleblog.com/2010/12/test-sizes.html",
        }
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-queue
        type: whiteboard.apply
        at: { mark: draw-queue }
        upsertIds: [a-queue-box, a-queue]
        drawMs: 2500
      - id: draw-tests
        type: whiteboard.apply
        at: { mark: draw-tests }
        upsertIds:
          [
            a-t1-box,
            a-t1-head,
            a-t1-do,
            a-t1-check,
            a-t2-box,
            a-t2-head,
            a-t2-do,
            a-t2-check,
            a-t3-box,
            a-t3-head,
            a-t3-do,
            a-t3-check,
          ]
        drawMs: 5500
      - id: draw-shared
        type: whiteboard.apply
        at: { mark: draw-shared }
        upsertIds: [a-arrow-1, a-arrow-2, a-arrow-3]
        drawMs: 1500

  - id: starter
    narration: >
      code ကို ကြည့်ရအောင်။ ဒါက မီးဖိုချောင်ရဲ့ kitchen ဖိုင်ဖြစ်ပြီး၊ အရင်ကတည်းက ရှိခဲ့တဲ့ code
      ဟောင်းပါ။ [[mark:select-queue]] queue ကို function တွေရဲ့ အပြင်ဘက်၊ ဖိုင်ရဲ့ ထိပ်ဆုံးမှာ တစ်ခါပဲ
      ဆောက်ထားပါတယ်။ ဒါကြောင့် ဒီ ဖိုင်ကို ယူသုံးတဲ့ နေရာတိုင်းက array တစ်ခုတည်းကိုပဲ မျှသုံးကြပါတယ်။
      [[mark:select-functions]] အော်ဒါ ထည့်တာ၊ အရင် ဝင်တာကို ထုတ်ပေးတာနဲ့ ဘယ်နှခု ရှိလဲ ပြတာ ဆိုတဲ့
      function သုံးခုက အဲဒီ queue ကိုပဲ သုံးပါတယ်။ [[mark:select-reset]] အောက်ဆုံးက function ကတော့
      queue ကို ရှင်းပြီး အလွတ် ပြန်ဖြစ်စေပါတယ်။ ဒါပေမဲ့ ဘယ်နေရာကမှ မခေါ်ရသေးပါဘူး။ [[mark:open-test]]
      test ဖိုင်ကို ဖွင့်ကြည့်ရအောင်။ [[mark:select-first]] ပထမ test က လှလှရဲ့ လက်ဖက်ရည် အော်ဒါ တစ်ခု
      ထည့်ပြီး၊ queue မှာ တစ်ခု ရှိရမယ်လို့ စစ်ပါတယ်။ [[mark:select-second]] ဒုတိယ test က လှလှရဲ့
      လက်ဖက်ရည်နဲ့ အောင်အောင်ရဲ့ ကော်ဖီကို ထည့်ပြီး၊ ပထမ ထွက်လာတဲ့ အော်ဒါက လှလှရဲ့ အော်ဒါ
      ဖြစ်ရမယ်လို့ စစ်ပါတယ်။ [[mark:select-third]] တတိယ test က queue အလွတ် ဖြစ်ရမယ်လို့ စစ်ထားပါတယ်။
      ဆိုင် စဖွင့်ချိန်မှာ အော်ဒါ တစ်ခုမှ မရှိသေးတဲ့အတွက် ဒီ test က မှန်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn Testing: Assertions and other primitives, lifecycle methods",
          url: "https://web.dev/learn/testing/assertions/tools#lifecycle_methods",
        }
      - {
          title: "Vitest: Setup and Teardown, repeating setup for each test",
          url: "https://vitest.dev/guide/learn/setup-teardown#repeating-setup-for-each-test",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: select-queue
        type: editor.select
        at: { mark: select-queue }
        target: { file: src/kitchen.js, text: "const queue = [];", occurrence: 1 }
      - id: select-functions
        type: editor.select
        at: { mark: select-functions }
        target:
          {
            file: src/kitchen.js,
            text: "export function addOrder(order) {\n  queue.push(order);\n}\n\nexport function nextOrder() {\n  return queue.shift();\n}\n\nexport function queueSize() {\n  return queue.length;\n}",
            occurrence: 1,
          }
      - id: select-reset
        type: editor.select
        at: { mark: select-reset }
        target:
          {
            file: src/kitchen.js,
            text: "export function resetKitchen() {\n  queue.length = 0;\n}",
            occurrence: 1,
          }
      - id: open-test
        type: workspace.openFile
        at: { mark: open-test }
        path: src/kitchen.test.js
      - id: select-first
        type: editor.select
        at: { mark: select-first }
        target:
          {
            file: src/kitchen.test.js,
            text: "addOrder({ id: \"tea\", customer: \"လှလှ\" });\n  expect(queueSize()).toBe(1);",
            occurrence: 1,
          }
      - id: select-second
        type: editor.select
        at: { mark: select-second }
        target:
          {
            file: src/kitchen.test.js,
            text: "addOrder({ id: \"tea\", customer: \"လှလှ\" });\n  addOrder({ id: \"coffee\", customer: \"အောင်အောင်\" });\n  expect(nextOrder().customer).toBe(\"လှလှ\");",
            occurrence: 1,
          }
      - id: select-third
        type: editor.select
        at: { mark: select-third }
        target:
          {
            file: src/kitchen.test.js,
            text: "test(\"starts empty\", () => {\n  expect(queueSize()).toBe(0);\n});",
            occurrence: 1,
          }

  - id: panel
    narration: >
      [[mark:ready]] Vitest က ဘာ ပြလဲ ကြည့်ရအောင်။ ညာဘက်က panel ကလည်း ပြီးခဲ့တဲ့ lesson တွေကလိုပဲ၊
      code ပြောင်းတိုင်း သူ့ဘာသာ ပြန် run နေတဲ့ တကယ့် Vitest ရဲ့ ရလဒ်ကို ပြတာပါ။ [[mark:read-tree]] အပေါ်မှာ အနီရောင် FAIL ပေါ်နေပြီး၊
      test စာရင်းမှာ ရှေ့က test နှစ်ခုက အမှန်ခြစ်နဲ့ pass ဖြစ်ပေမဲ့ တတိယ test ကတော့ ကြက်ခြေခတ်နဲ့
      ကျနေပါတယ်။ [[mark:read-message]]
      အလယ်က Failed Tests အပိုင်းမှာ သုည ဖြစ်ရမယ့် နေရာမှာ ၂ ရနေတယ်လို့ ပြောနေပါတယ်။ အစိမ်းရောင်
      Expected က သုည၊ အနီရောင် Received က ၂ ပါ။ ဆိုလိုတာက အလွတ် ဖြစ်ရမယ့် queue ထဲမှာ အော်ဒါ နှစ်ခု
      ရှိနေတာပါ။ [[mark:read-summary]] အောက်ဆုံးက summary မှာလည်း တစ်ခု fail နဲ့ နှစ်ခု pass လို့
      ပြနေပါတယ်။
    sources:
      - {
          title: "Vitest: Writing Tests, reading test output",
          url: "https://vitest.dev/guide/learn/writing-tests#reading-test-output",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-start-fail
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 3, delayMs: 1000 }
      - id: expect-start-two-passed
        type: expect.preview
        at: { afterAction: expect-start-fail }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "2" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-third-fails
        type: expect.preview
        at: { afterAction: expect-start-two-passed }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-3 }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-message
        type: expect.preview
        at: { afterAction: expect-start-third-fails }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-message, value: "expected 2 to be +0 // Object.is equality" }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: order-dependence
    chapter: "Test တစ်ခုက နောက် test ကို ထိခိုက်ရင်"
    narration: >
      တတိယ test က မှားနေတာလား။ မမှားပါဘူး၊ ဆိုင် စဖွင့်ချိန်မှာ queue က အလွတ် ဖြစ်ရပါမယ်။ ဒါဆို အော်ဒါ
      နှစ်ခု ဘယ်က ရောက်လာတာလဲ။ [[mark:board-left]] Vitest က ဖိုင်တစ်ခုထဲက test တွေကို အပေါ်ကနေ အောက်ကို
      တစ်ခုပြီးတစ်ခု run ပြီး၊ kitchen ဖိုင်ကိုလည်း တစ်ခါပဲ load လုပ်ပါတယ်။ ဒါကြောင့် queue က test တွေကြားမှာ
      ရှင်းမသွားပါဘူး။ [[mark:draw-left-1]] ပထမ test ပြီးတော့ queue ထဲမှာ အော်ဒါ တစ်ခု ကျန်ခဲ့ပါတယ်။
      [[mark:draw-left-2]] ဒုတိယ test က နှစ်ခု ထပ်ထည့်ပြီး တစ်ခု ထုတ်လိုက်တော့ နှစ်ခု ကျန်ခဲ့ပါတယ်။
      [[mark:draw-left-3]] တတိယ test က သုည ဖြစ်ရမယ်လို့ စစ်တော့ ၂ ကို တွေ့ပြီး ကျသွားတာပါ။ ဒီ test
      တစ်ခုတည်းကိုပဲ run ရင်တော့ pass ဖြစ်မှာ ဖြစ်ပြီး၊ တခြား test တွေနဲ့ အတူ run မှ ကျတာပါ။
      [[mark:draw-luck]] ဒုတိယ test ကလည်း မှန်ကန်တဲ့ အကြောင်းကြောင့် pass ဖြစ်တာ မဟုတ်ပါဘူး။ သူ ထုတ်လိုက်တဲ့ အော်ဒါက ပထမ
      test ထည့်ခဲ့တဲ့ လှလှရဲ့ လက်ဖက်ရည် ဖြစ်ပြီး၊ မှာတဲ့သူ နာမည် တူနေလို့ ကံကောင်းပြီး pass ဖြစ်နေတာပါ။
      [[mark:draw-isolation]] ဆိုလိုတာက test တစ်ခုရဲ့ ရလဒ်က တခြား test တွေပေါ်၊ run တဲ့ အစဉ်ပေါ်
      မူတည်နေပါတယ်။ test ကောင်းတွေကတော့ တစ်ခုတည်း run တာဖြစ်ဖြစ်၊ ဘယ် အစဉ်နဲ့ run တာဖြစ်ဖြစ် ရလဒ်
      တူရပါမယ်။
      ဒီလို test တစ်ခုက နောက် test တစ်ခုကို မထိခိုက်ဘဲ သီးခြား ဖြစ်နေတာကို isolation လို့ ခေါ်ပါတယ်။
      [[mark:files-isolated]] Vitest က test ဖိုင် တစ်ဖိုင်ချင်းကိုတော့ သီးခြား ပတ်ဝန်းကျင်မှာ run တဲ့အတွက်၊ တခြား
      ဖိုင်က test တွေက ဒီ queue ကို မထိနိုင်ပါဘူး။ ပြဿနာက ဖိုင်တစ်ခုတည်းထဲက test တွေက module
      တစ်ခုတည်းကို မျှသုံးနေတာပါ။
    sources:
      - {
          title: "Google Testing Blog: Test Sizes, tests must run in any order (facts C15)",
          url: "https://testing.googleblog.com/2010/12/test-sizes.html",
        }
      - {
          title: "Vitest: Features, each test file runs isolated (facts A07)",
          url: "https://vitest.dev/guide/features",
        }
      - {
          title: "Vitest: isolate (default true, facts A07)",
          url: "https://vitest.dev/config/isolate",
        }
    actions:
      - id: board-left
        type: whiteboard.apply
        at: { mark: board-left }
        open: true
        upsertIds: [a-title]
      - id: draw-left-1
        type: whiteboard.apply
        at: { mark: draw-left-1 }
        upsertIds: [a-left-1]
        drawMs: 1000
      - id: draw-left-2
        type: whiteboard.apply
        at: { mark: draw-left-2 }
        upsertIds: [a-left-2]
        drawMs: 1000
      - id: draw-left-3
        type: whiteboard.apply
        at: { mark: draw-left-3 }
        upsertIds: [a-left-3]
        drawMs: 1000
      - id: draw-luck
        type: whiteboard.apply
        at: { mark: draw-luck }
        upsertIds: [a-luck]
        drawMs: 2000
      - id: draw-isolation
        type: whiteboard.apply
        at: { mark: draw-isolation }
        upsertIds: [a-isolation]
        drawMs: 2000

  - id: before-each
    chapter: "Before Each နဲ့ အစကနေ ပြန်စရအောင်"
    narration: >
      ဒါဆို test တိုင်း မစခင် queue ကို ရှင်းပေးရပါမယ်။ ရှင်းတဲ့ function ကို test တိုင်းရဲ့ ထိပ်မှာ ကိုယ်တိုင်
      ခေါ်နေမယ့်အစား၊ hook ကို သုံးပါမယ်။ hook ဆိုတာ test တစ်ခုချင်း မစခင် ဒါမှမဟုတ် ပြီးတဲ့နောက် Vitest က အလိုလို run
      ပေးတဲ့ function ပါ။ [[mark:type-imports]] ဖိုင်ရဲ့ ထိပ်မှာ vitest ကနေ before Each ကို ယူပြီး၊ kitchen
      ဖိုင်ကနေလည်း queue ကို ရှင်းတဲ့ function ကို ယူပါမယ်။ [[mark:type-hook]] ပြီးတော့ import တွေရဲ့ အောက်မှာ
      before Each hook တစ်ခု ထည့်ပါမယ်။ test တစ်ခု မစခင်တိုင်း queue ကို ရှင်းခိုင်းထားတာပါ။
      [[mark:select-hook]] ဒီ hook ကို describe တစ်ခုခုထဲမှာ မထည့်ဘဲ ဖိုင်ရဲ့ အပြင်ဆုံး အဆင့်မှာ
      ရေးထားတဲ့အတွက်၊ ဖိုင်ထဲက test အားလုံးအတွက် အလုပ်လုပ်ပါတယ်။
      [[mark:read-green]] panel ကို ကြည့်ပါ။ test သုံးခုလုံး pass ဖြစ်ပြီး၊ အပေါ်မှာ အစိမ်းရောင် PASS
      ပေါ်လာပါပြီ။ တတိယ test က queue အလွတ်နဲ့ စလို့ pass ဖြစ်ပြီး၊ ဒုတိယ test ကလည်း အခုတော့ သူ
      ကိုယ်တိုင် ထည့်ထားတဲ့ အော်ဒါကို ထုတ်ပြီး pass ဖြစ်တာပါ။ test တွေရဲ့ အစဉ် ပြောင်းသွားရင်လည်း ရလဒ်
      မပြောင်းတော့ပါဘူး။
    sources:
      - { title: "Vitest: Hooks, beforeEach", url: "https://vitest.dev/api/hooks#beforeeach" }
      - {
          title: "Vitest: Setup and Teardown",
          url: "https://vitest.dev/guide/learn/setup-teardown",
        }
    actions:
      - id: close-left
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: type-import-hook
        type: editor.type
        at: { mark: type-imports }
        target: { file: src/kitchen.test.js, after: "import { ", occurrence: 1 }
        text: "beforeEach, "
      - id: type-import-reset
        type: editor.type
        at: { afterAction: type-import-hook }
        target: { file: src/kitchen.test.js, after: "queueSize", occurrence: 1 }
        text: ", resetKitchen"
      - id: type-hook
        type: editor.type
        at: { mark: type-hook }
        target: { file: src/kitchen.test.js, after: "from \"./kitchen.js\";\n", occurrence: 1 }
        text: "\nbeforeEach(() => {\n  resetKitchen();\n});\n"
        # One block (pilot note 1): one write, one run.
        cadence: block
      - id: expect-green
        type: expect.preview
        at: { afterAction: type-hook }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-three-passed
        type: expect.preview
        at: { afterAction: expect-green }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "3" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-third-passes
        type: expect.preview
        at: { afterAction: expect-three-passed }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-3 }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-hook
        type: editor.select
        at: { mark: select-hook }
        target:
          {
            file: src/kitchen.test.js,
            text: "beforeEach(() => {\n  resetKitchen();\n});",
            occurrence: 1,
          }
      - id: expect-hook-file
        type: expect.file
        at: { afterAction: select-hook }
        path: src/kitchen.test.js
        contains: "import { beforeEach, expect, test } from \"vitest\";\nimport { addOrder, nextOrder, queueSize, resetKitchen } from \"./kitchen.js\";\n\nbeforeEach(() => {\n  resetKitchen();\n});"

  - id: hook-order
    chapter: "အခြေခံ hook လေးမျိုးနဲ့ သူတို့ရဲ့ အစဉ်"
    narration: >
      [[mark:board-hooks]] Vitest ရဲ့ အခြေခံ hook လေးမျိုးကို၊ run တဲ့ အစဉ်အတိုင်း အပေါ်ကနေ အောက်ကို
      ဆွဲကြည့်ရအောင်။ [[mark:draw-before-all]] before All က ဖိုင်ထဲက test တွေ မစခင် တစ်ခါပဲ run ပါတယ်။
      database ချိတ်တာ၊ ဖိုင်ကြီး တစ်ခု ဖတ်တာလို အချိန်ကြာတဲ့ setup ကို တစ်ခါတည်း လုပ်ချင်တဲ့အခါ
      သုံးပါတယ်။ ဒီ lesson ရဲ့ queue ကို before All နဲ့ ရှင်းခဲ့ရင်တော့ အစမှာ တစ်ခါပဲ ရှင်းမှာမို့၊ test
      တွေကြားမှာ အော်ဒါတွေ ကျန်နေဦးမှာပါ။ [[mark:draw-each]] before Each က test တိုင်း မစခင် run ပြီး၊ test ပြီးတဲ့နောက်မှာတော့
      after Each က run ပါတယ်။ test ကျသွားရင်တောင် after Each က run ပေးလို့၊ test တစ်ခု
      ပြောင်းထားခဲ့တာတွေကို ပြန်ရှင်းဖို့ ကောင်းပါတယ်။ နောက် lesson တွေမှာ အတု လုပ်ထားတဲ့ နာရီနဲ့ function တွေကို မူလအတိုင်း ပြန်ထားဖို့
      after Each ကို သုံးပါမယ်။ [[mark:draw-after-all]] after All က test အားလုံး ပြီးတဲ့နောက် တစ်ခါပဲ run
      ပြီး၊ before All မှာ ဖွင့်ခဲ့တာတွေကို ပိတ်ဖို့ သုံးပါတယ်။ [[mark:draw-scope]] hook ကို describe ထဲမှာ ရေးရင်
      အဲဒီ describe ထဲက test တွေအတွက်ပဲ အလုပ်လုပ်ပါတယ်။ hook တွေ အဆင့်ဆင့် ရှိနေရင် after hook
      တွေကတော့ ပြောင်းပြန် အစဉ်နဲ့ run ပြီး၊ အတွင်းဘက်က after Each က အရင်၊ အပြင်ဘက်က after Each က
      နောက်မှ run ပါတယ်။ [[mark:draw-throw]] hook ကိုယ်တိုင် error တက်ရင်တော့၊ စစ်နေတဲ့ အလုပ်လုပ်ပုံ
      မှားတာထက် test တွေကို ပြင်ဆင်ထားပုံမှာ ပြဿနာ ရှိတယ် ဆိုတဲ့ လက္ခဏာပါ။
    sources:
      - {
          title: "web.dev Learn Testing: Assertions and other primitives, lifecycle methods",
          url: "https://web.dev/learn/testing/assertions/tools#lifecycle_methods",
        }
      - {
          title: "Vitest: Setup and Teardown, one-time setup, scoping with describe, execution order",
          url: "https://vitest.dev/guide/learn/setup-teardown",
        }
      - { title: "Vitest: Hooks", url: "https://vitest.dev/api/hooks" }
      - {
          title: "Vitest: Migrating from Jest, hooks run as a stack (facts A27)",
          url: "https://vitest.dev/guide/migration/jest",
        }
    actions:
      - id: board-hooks
        type: whiteboard.apply
        at: { mark: board-hooks }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-before-all
        type: whiteboard.apply
        at: { mark: draw-before-all }
        upsertIds: [b-ba-box, b-ba, b-ba-note]
        drawMs: 2000
      - id: draw-each
        type: whiteboard.apply
        at: { mark: draw-each }
        upsertIds:
          [
            b-arrow-1,
            b-be-box,
            b-be,
            b-be-note,
            b-arrow-2,
            b-t-box,
            b-t,
            b-arrow-3,
            b-ae-box,
            b-ae,
            b-ae-note,
          ]
        drawMs: 5000
      - id: draw-after-all
        type: whiteboard.apply
        at: { mark: draw-after-all }
        upsertIds: [b-arrow-4, b-aa-box, b-aa, b-aa-note]
        drawMs: 2000
      - id: draw-scope
        type: whiteboard.apply
        at: { mark: draw-scope }
        upsertIds: [b-scope]
        drawMs: 1800
      - id: draw-throw
        type: whiteboard.apply
        at: { mark: draw-throw }
        upsertIds: [b-throw]
        drawMs: 1800

  - id: fixtures
    narration: >
      ဒီ lesson ရဲ့ kitchen ဖိုင်က queue တစ်ခုတည်းကို မျှသုံးတဲ့ code ဟောင်း ဖြစ်လို့ before Each နဲ့
      ရှင်းပေးရပါတယ်။ [[mark:board-fixture]] code အသစ်တွေမှာတော့ kitchen အသစ် တစ်ခုကို ဆောက်ပေးတဲ့
      function ရှိတာ များပါတယ်။ အဲဒီလို ဆိုရင် Vitest ရဲ့ fixture ကို သုံးနိုင်ပါတယ်။ fixture ဆိုတာ test
      အတွက် ကြိုပြင်ပေးထားတဲ့ data ဒါမှမဟုတ် object ပါ။ [[mark:draw-extend]] test extend နဲ့ kitchen
      ဆိုတဲ့ fixture တစ်ခုကို သတ်မှတ်ထားပြီး၊ [[mark:draw-use]] test က သူ့ parameter ထဲကနေ kitchen ကို
      တောင်းယူလိုက်ရင်၊ Vitest က test တိုင်းအတွက် kitchen အသစ် တစ်ခုစီ ဆောက်ပေးပါတယ်။
      [[mark:draw-new]] ဒါကြောင့် test တစ်ခုစီက သူ့ကိုယ်ပိုင် queue နဲ့ စပြီး၊ ရှင်းဖို့ မေ့စရာ မရှိတော့ပါဘူး။
      [[mark:draw-finished]] test တစ်ခုထဲမှာ ဖွင့်ခဲ့တာကို test ပြီးရင် ပိတ်ချင်ရင်တော့ on Test Finished ကို
      သုံးပြီး၊ ပိတ်တဲ့ code ကို ဖွင့်တဲ့ နေရာနားမှာပဲ ရေးထားလို့ ရပါတယ်။
    sources:
      - {
          title: "Vitest: Test Context, extend test context, builder pattern (facts A32)",
          url: "https://vitest.dev/guide/test-context#builder-pattern",
        }
      - {
          title: "Vitest: Setup and Teardown, fixtures with test.extend and cleanup with onTestFinished",
          url: "https://vitest.dev/guide/learn/setup-teardown#fixtures-with-test-extend",
        }
      - {
          title: "Vitest: Hooks, onTestFinished",
          url: "https://vitest.dev/api/hooks#ontestfinished",
        }
    actions:
      - id: board-fixture
        type: whiteboard.apply
        at: { mark: board-fixture }
        clear: true
        upsertIds: [c-title]
      - id: draw-extend
        type: whiteboard.apply
        at: { mark: draw-extend }
        upsertIds: [c-code-1, c-code-2, c-code-3]
        drawMs: 2500
      - id: draw-use
        type: whiteboard.apply
        at: { mark: draw-use }
        upsertIds: [c-code-4, c-code-5, c-code-6]
        drawMs: 2500
      - id: draw-new
        type: whiteboard.apply
        at: { mark: draw-new }
        upsertIds: [c-new]
        drawMs: 1800
      - id: draw-finished
        type: whiteboard.apply
        at: { mark: draw-finished }
        upsertIds: [c-finished]
        drawMs: 1800

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ test တွေက module ထဲက data တစ်ခုတည်းကို မျှသုံးရင်၊ test တစ်ခု ထားခဲ့တာက
      နောက် test ထဲ ရောက်သွားပြီး၊ test ရဲ့ ရလဒ်က run တဲ့ အစဉ်ပေါ် မူတည်သွားပါတယ်။ test
      တိုင်းကို before Each နဲ့ အစကနေ ပြန်စပေးပြီး၊ test ပြောင်းထားခဲ့တာတွေကို after Each နဲ့ ပြန်ရှင်းပါ။ [[mark:recap-all]] before All နဲ့
      after All ကတော့ ဖိုင် ဒါမှမဟုတ် describe တစ်ခုအတွက် တစ်ခါပဲ run ပြီး၊ code အသစ်မှာဆိုရင် fixture နဲ့
      test တိုင်းကို ကိုယ်ပိုင် object ပေးလို့ ရပါတယ်။ နောက် lesson မှာတော့ code ရေးနေတုန်း watch mode
      နဲ့ Vitest ကို ဘယ်လို ဖွင့်ထားရလဲ၊ ကိုယ် လိုချင်တဲ့ test တွေကိုပဲ ဘယ်လို ရွေး run ရလဲ ဆိုတာ
      ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "Vitest: Setup and Teardown",
          url: "https://vitest.dev/guide/learn/setup-teardown",
        }
      - {
          title: "web.dev Learn Testing: Assertions and other primitives, lifecycle methods",
          url: "https://web.dev/learn/testing/assertions/tools#lifecycle_methods",
        }
    actions:
      - id: close-fixture
        type: whiteboard.apply
        at: { scene: start }
        open: false
checks:
  - { type: timing.p95Ms, max: 300 }
