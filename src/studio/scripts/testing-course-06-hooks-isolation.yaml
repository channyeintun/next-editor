        id: c-code-6,
        kind: text,
        x: 290,
        y: 452,
        width: 800,
        height: 36,
        text: "});",
        strokeColor: "#1e1e1e",
        fontSize: 28,
      }
    - {
        id: c-new,
        kind: text,
        x: 290,
        y: 516,
        width: 800,
        height: 36,
        text: "test တိုင်း kitchen အသစ် · ရှင်းဖို့ မေ့စရာ မရှိ",
        strokeColor: "#2f9e44",
        fontSize: 28,
      }
    - {
        id: c-finished,
