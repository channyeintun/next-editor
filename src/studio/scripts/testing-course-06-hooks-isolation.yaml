      src/kitchen.js: |
        const queue = [];

        export function addOrder(order) {
          queue.push(order);
        }

        export function nextOrder() {
          return queue.shift();
        }

        export function queueSize() {
          return queue.length;
        }

        export function resetKitchen() {
          queue.length = 0;
        }
      src/kitchen.test.js: |
        import { expect, test } from "vitest";
        import { addOrder, nextOrder, queueSize } from "./kitchen.js";

        test("adds an order to the queue", () => {
          addOrder({ id: "tea", customer: "လှလှ" });
          expect(queueSize()).toBe(1);
        });

        test("serves orders in arrival order", () => {
          addOrder({ id: "tea", customer: "လှလှ" });
          addOrder({ id: "coffee", customer: "အောင်အောင်" });
          expect(nextOrder().customer).toBe("လှလှ");
        });

        test("starts empty", () => {
          expect(queueSize()).toBe(0);
        });
