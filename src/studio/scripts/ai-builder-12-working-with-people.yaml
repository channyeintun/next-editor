# AI Builder, lesson 12: working with people (Burmese, docs kind).
#
# Start state (ws/): base-docs (package.json with a no-op dev script, notes.md) and docs/updates.md
# pinned with only its title line. Nothing runs. The lesson writes docs/updates.md (lesson-local,
# COURSE-KIT §4.6 outline; full text in _updates-final.md): a weekly status update to မြမြ (Done ·
# Next · Blocked / need from you · Decision needed · delivery) and one question for လှလှ.
#
# Boards: (T) the people around the app — မြမြ (business), လှလှ (the counter), the customers — with the
# builder (orange) in the middle translating, and the agent (violet) that only gets what the builder
# writes; then the rule "ask instead of guessing"; (O) မြမြ asks for delivery by Friday: red "no" and
# red "yes" vs green "two options with costs" + a question back; (F) feedback on the person (red) vs on
# the work (green); (Z) the quiz (which bad-news message to send on Wednesday).
#
# Build: bun ~/Documents/ai-builder-course-work/tools/build-lesson.ts template.yaml ws ai-builder-12-working-with-people.yaml
