      - {
          id: draw-t-title,
          type: whiteboard.apply,
          at: { mark: t-title },
          open: true,
          clear: true,
          upsertIds: [t-title],
        }
      - {
          id: draw-t-mm,
          type: whiteboard.apply,
          at: { mark: t-mm },
          upsertIds: [t-mm-box, t-mm, t-mm-w],
          drawMs: 1300,
        }
      - {
          id: draw-t-hla,
          type: whiteboard.apply,
          at: { mark: t-hla },
          upsertIds: [t-hla-box, t-hla, t-hla-w],
          drawMs: 1300,
        }
      - {
          id: draw-t-cust,
          type: whiteboard.apply,
          at: { mark: t-cust },
          upsertIds: [t-cust-box, t-cust, t-cust-w],
          drawMs: 1300,
        }
      - {
          id: draw-t-me,
