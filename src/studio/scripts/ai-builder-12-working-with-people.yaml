build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 6112
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}
scenes:
  - id: recall
    chapter: ဘယ်သူတွေနဲ့ ဆောက်လဲ
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ agent ကို order form task အပ်ဖို့ brief ရေးပြီး၊ မသေချာရင် ရပ်ပြီး မေးဖို့
      ပြောခဲ့ပါတယ်။ ဒါပေမဲ့ အဲဒီ မေးခွန်းတွေရဲ့ အဖြေက agent ဆီမှာ မရှိသလို၊ ကိုယ့်ဆီမှာလည်း အမြဲ မရှိပါဘူး။
      ဆိုင်ပိုင်ရှင် မြမြ၊ ကောင်တာက လှလှ နဲ့ customer တွေ ဆီမှာ ရှိပါတယ်။ agent က code ကို မြန်မြန်
      ထုတ်ပေးနိုင်ပေမဲ့ ဘာ ဆောက်ရမလဲ ဆိုတာက လူတွေဆီက လာတာ ဖြစ်လို့၊ လူတွေနဲ့ ပြောဆိုတာက app ကို ဆောက်ပေးတဲ့
      builder ရဲ့ အဓိက အလုပ် တစ်ခုပါ။ [[mark:sel-title]] editor ထဲက updates ဖိုင်မှာ ဒီနေ့ ကိုယ် ပို့မယ့် စာကို
      ရေးပါမယ်။ အခု ခေါင်းစဉ်နဲ့ ရက်စွဲပဲ ရှိပါသေးတယ်။ ဒီနေ့ မနက် မြမြ ဆီက message တစ်စောင် ရောက်လာပါတယ်။ app
      ဘယ်အဆင့် ရောက်ပြီလဲ၊ ပြီးတော့ သောကြာနေ့ကျရင် အိမ်အရောက် ပို့ပေးတဲ့ delivery ပါ ထည့်လို့ ရမလား တဲ့။ ဒီ
      message ကို ဘယ်လို ပြန်ဖြေမလဲ ဆိုတာနဲ့ ဒီနေ့ lesson ကို စပါမယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): Where to start (organisations: humans give direction)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: sel-title,
          type: editor.select,
          at: { mark: sel-title },
          target: { file: docs/updates.md, text: "# Updates · 2026-11-08", occurrence: 1 },
        }

  - id: people
    narration: >
      [[mark:t-title]] software ကို လူတွေအတွက် ဆောက်တာ ဖြစ်သလို၊ လူတွေနဲ့ အတူ ဆောက်ရတာလည်း ဖြစ်ပါတယ်။ ကိုယ်တို့
      app ပတ်လည်မှာ လူ သုံးဖွဲ့ ရှိပါတယ်။ [[mark:t-mm]] မြမြ က ဆိုင်ပိုင်ရှင် ဖြစ်လို့ စီးပွားရေး ဘက်က ကြည့်ပါတယ်။
      မနက်တိုင်း customer တွေ ပြန်မထွက်သွားဖို့နဲ့ ကုန်ကျစရိတ် မများဖို့ ဂရုစိုက်ပါတယ်။ [[mark:t-hla]] လှလှ ကတော့
      မနက် အလုပ်ရှုပ်ချိန်မှာ ကောင်တာမှာ တကယ် ဘာဖြစ်လဲ ဆိုတာ အသိဆုံးပါ။ လက်ဖက်ရည် ဖျော်ရင်း ဖုန်းကို ခဏခဏ
      ကြည့်ဖို့ အချိန် မရှိပါဘူး။ [[mark:t-cust]] member အောင်အောင် နဲ့ ကျောင်းသား မောင်မောင် လို customer
      တွေကတော့ အလုပ်၊ ကျောင်း မနောက်ကျဖို့ကို ဂရုစိုက်ပါတယ်။ ဒီလို product ရဲ့ ရလဒ်ကို ဂရုစိုက်တဲ့ သူတွေကို
      stakeholder လို့ ခေါ်ပါတယ်။ [[mark:t-me]] ကိုယ်က သူတို့ ကြားမှာ ရပ်ပြီး ဘာသာပြန်ပေးရတဲ့ သူပါ။ သူတို့ ပြောတဲ့
      စကားကို agent ဖတ်မယ့် စာတွေ အဖြစ် ရေးပေးရပါတယ်။ [[mark:t-agent]] agent ဆီ ရောက်တာက ကိုယ် ရေးပေးတဲ့ စာတွေပဲ
      ဖြစ်ပါတယ်။ နည်းပညာ ဘက်က အကြောင်းတွေကိုလည်း မြမြ နဲ့ လှလှ ပြောနေကျ စကားနဲ့ ပြန်ပြောပြရပါတယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): Where to start (organisations: hybrid teams, direction and judgment)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
