        }
      - id: sel-instruction
        type: editor.select
        at: { mark: sel-instruction }
        target: { file: src/prompt.js, text: "export const instruction =", occurrence: 1 }
      - id: sel-format
        type: editor.select
        at: { mark: sel-format }
