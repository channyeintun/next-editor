        at: { afterAction: click-n02 }
        timeoutMs: 5000
        target: { by: testId, value: ai-view }
        textContains: "အကောင်းဆုံးပေါင်းစပ်မှု"
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-n02-pressed
        type: expect.preview
