  - id: baseline
    narration: >
      [[mark:open-prompt]] prompt ဖိုင်ကို ဖွင့်ကြည့်ရအောင်။ ဒါက ကိုယ်တို့ရဲ့ baseline ပါ။ zero shot ဖြစ်လို့
      နမူနာ မပေးဘဲ အလုပ်ကိုပဲ ပြောထားပြီး၊ constraint တွေကို စစ်ကြည့်လို့ လိုမှ ထပ်ထည့်ပါမယ်။ [[mark:sel-instruction]] instruction
      က model ကို ဆိုင်ရဲ့ menu ဖော်ပြချက် ရေးသူ နေရာမှာ ထားပြီး၊ user ပို့တဲ့ item အတွက် မြန်မာလို
      ဖော်ပြချက် တိုတို သုံးခု ရေးခိုင်းထားပါတယ်။
      [[mark:sel-format]] output format က အဲဒီ သုံးခုကို JSON နဲ့ ပြန်ပေးခိုင်းတာပါ။ [[mark:sel-template]]
      template ထဲက တွန့်ကွင်းနဲ့ ရေးထားတဲ့ နေရာတွေက placeholder ပါ။ app က item တစ်ခုချင်းရဲ့ နာမည်၊
      မှတ်ချက်နဲ့ style ကို အဲဒီ နေရာမှာ ဖြည့်ပေးပါတယ်။ [[mark:click-n01]] panel အပေါ်က ခလုတ်နဲ့ ပထမ
      input ရဲ့ အဖြေကို ဖွင့်ကြည့်ရအောင်။ [[mark:read-answer]] Answer card မှာ ထန်းလျက် ကော်ဖီ အတွက် model
      ပေးခဲ့တဲ့ အဖြေ ပေါ်လာပါပြီ။ input ၁၂ ခုလုံးရဲ့ အဖြေတွေက open model သေးသေးလေး
      တစ်ခုကို ဒီ prompt နဲ့ ကြိုပြီး run ထားတုန်းက တကယ် ထွက်လာခဲ့တဲ့ အဖြေတွေ ဖြစ်လို့၊ card ရဲ့ badge
      ကလည်း ကြိုမှတ်ထားတဲ့ အဖြေလို့ ပြနေပါတယ်။ [[mark:read-fence]] အထဲမှာ ဖော်ပြချက် သုံးခုကို JSON နဲ့
      ပေးထားပေမယ့်၊ အပေါ်နဲ့ အောက်မှာ markdown ရဲ့ code fence နဲ့ အုပ်ထားတာကို သတိထားကြည့်ပါ။
    sources:
      - {
          title: "web.dev Learn AI: Evaluation-driven development (initialize a baseline)",
