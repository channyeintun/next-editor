  - id: checks
    chapter: "Code check တွေ ရေးရအောင်"
    narration: >
      [[mark:open-checks]] ဒါဆို code based check တွေ ရေးကြည့်ရအောင်။ code based check ဆိုတာ code နဲ့
      အလိုလို စစ်လို့ ရတဲ့ စစ်ချက်ပါ။ [[mark:type-json]] ပထမ check က app က အဖြေကို JSON အဖြစ် ဒီအတိုင်း ဖတ်လို့ ရလား စစ်တာပါ။
      [[mark:read-json]] Scorecard မှာ JSON column ပေါ်လာပြီး၊ ၁၂ ကြောင်းလုံး ကြက်ခြေခတ် ဖြစ်နေပါတယ်။
      အဖြေတိုင်းကို code fence နဲ့ အုပ်ထားလို့ app က JSON အဖြစ် ဖတ်လို့ မရတာပါ။ [[mark:sel-read]] ဒါပေမဲ့
      app က fence ထဲက ဖော်ပြချက်တွေကို ထုတ်ပြီးမှ check တွေဆီ ပို့ထားလို့၊ ကျန်တဲ့ check တွေက ဆက်စစ်နိုင်ပါတယ်။ [[mark:type-three]] ဒုတိယ check က ဖော်ပြချက်
      သုံးခု အတိအကျ ပါလား စစ်ပါတယ်။ [[mark:read-three]] ဒီ တစ်ခုကတော့ ၁၂ ကြောင်းလုံး အမှန်ခြစ် ရပါတယ်။
      [[mark:type-length]] တတိယ check က ဖော်ပြချက် တစ်ခုချင်း စာလုံး ၆၀ ထက် မပိုလား စစ်တာပါ။
      [[mark:sel-graphemes]] မြန်မာစာမှာ သရ၊ အသတ် လို အမှတ်အသားတွေကို JavaScript ရဲ့ length က
      တစ်ခုချင်း သီးသန့် ရေတွက်လို့၊ စာက တကယ်ထက် ပိုရှည်သလို ဖြစ်နေပါတယ်။ ဒါကြောင့် မျက်စိနဲ့ မြင်ရတဲ့
      စာလုံးအတိုင်း ရေတွက်တဲ့ grapheme နဲ့ စစ်ပါတယ်။ [[mark:read-length]] အရှည်ကြောင့် မအောင်တာ
      လေးကြောင်း ရှိပြီး၊ အဲဒီထဲမှာ ideal input တစ်ခုနဲ့ အရမ်း ရှည်တဲ့ မှတ်ချက် ပေးထားတဲ့ input လည်း ပါပါတယ်။
      [[mark:type-claim]] နောက်ဆုံး check က အကောင်းဆုံး၊ အခမဲ့ လို ဆိုင်က သက်သေ မပြနိုင်တဲ့ စကားလုံးတွေ ပါလား
      ရှာတာပါ။ [[mark:read-claim]] claim column မှာ နှစ်ကြောင်း မအောင်ပါဘူး။ တစ်ကြောင်းက claim တောင်းထားတဲ့
      input ဖြစ်ပြီး၊ ကျန်တစ်ကြောင်းကတော့ claim မတောင်းထားတဲ့ ideal input ပါ။
    sources:
      - {
