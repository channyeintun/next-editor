build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 5117
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "Prompt ကောင်းမကောင်း ဘယ်လို သိမလဲ"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ prompting နည်းလမ်း လေးမျိုးကို စမ်းခဲ့ပြီး၊ prompt တစ်ခု ကောင်းလာဖို့ အကြိမ်ကြိမ် ပြင်ရတယ်
      ဆိုတာ တွေ့ခဲ့ပါတယ်။ ဒါပေမဲ့ ပြင်လိုက်တိုင်း အဖြေတွေ တကယ် ပိုကောင်းလာလား၊ တခြား နေရာမှာ
      ပြန်ဆိုးသွားလား ဆိုတာ ဘယ်လို သိနိုင်မလဲ။ [[mark:draw-mini]] blueprint မှာ ကြည့်ရင်၊ ဒီနေ့ အလုပ်က
      Solution ထဲက intelligence အလွှာမှာပါ။ [[mark:draw-today]] prompt တစ်ခုနဲ့ model ထုတ်ပေးတဲ့ အဖြေတွေကို
      စနစ်တကျ စစ်ရင်း prompt ကို တိုးတက်အောင် လုပ်တဲ့ evaluation driven development ကို လေ့လာပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Evaluation-driven development",
          url: "https://web.dev/learn/ai/evaluation-driven-development",
        }
      - {
          title: "web.dev Learn AI: Prompt engineering (prompting techniques)",
          url: "https://web.dev/learn/ai/prompt-engineering",
        }
      - {
          title: "web.dev Learn AI: Introduction to AI on the web (the blueprint)",
          url: "https://web.dev/learn/ai/introduction",
        }
      - {
          title: "web.dev Learn AI: Welcome to Learn AI! (course credit: written by Dr. Janna Lipenkova with editorial guidance from Alexandra Klepper; text CC BY 4.0, code Apache 2.0; adapted into Burmese with the course's own tea-shop examples)",
          url: "https://web.dev/learn/ai/welcome",
        }
      - {
          title: "Creative Commons: Attribution 4.0 International (CC BY 4.0), the licence of the web.dev Learn AI text adapted here",
          url: "https://creativecommons.org/licenses/by/4.0/",
        }
    actions:
      - {
          id: open-board-a,
          type: whiteboard.apply,
          at: { scene: start, offsetMs: -450 },
          open: true,
          clear: true,
          upsertIds: [a-title],
        }
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - {
          id: draw-mini,
          type: whiteboard.apply,
          at: { mark: draw-mini },
          upsertIds:
            [
              a-opp,
              a-opp-t,
              a-arrow-1,
              a-data,
              a-data-t,
              a-intel,
              a-intel-t,
              a-ux,
              a-ux-t,
              a-arrow-2,
              a-gov,
              a-gov-t,
            ],
          drawMs: 2400,
        }
      - {
          id: draw-today,
          type: whiteboard.apply,
          at: { mark: draw-today },
          upsertIds: [a-today],
          drawMs: 1000,
        }

  - id: tradeoff
    chapter: "Prompt တိုတာနဲ့ အဖြေ ကောင်းတာ"
    narration: >
      [[mark:draw-tradeoff]] prompt ရေးတဲ့အခါ ချိန်ညှိရတဲ့ အချက် တစ်ခု အမြဲ ရှိပါတယ်။
      [[mark:draw-short]] prompt တိုရင် token နည်းလို့ အဖြေ မြန်မြန် ရပြီး ကုန်ကျစရိတ်လည်း သက်သာပါတယ်။
      ပြင်ရ ထိန်းရတာလည်း အဆင်ပြေပါတယ်။ latency နဲ့ token limit အရေးကြီးတဲ့ web app မှာဆိုရင် ဒါက
      ပိုအရေးပါပါတယ်။ [[mark:draw-too-short]] ဒါပေမဲ့ တိုလွန်းသွားရင်တော့ model ဆီမှာ
      context၊ instruction၊ နမူနာ မလုံလောက်လို့ အဖြေ ညံ့လာပါတယ်။ [[mark:draw-edd]] evaluation driven
      development၊ အတိုကောက် E D D က ဒီ ချိန်ခွင်လျှာကို မှန်းဆပြီး မဆုံးဖြတ်ဘဲ၊ ထပ်ခါထပ်ခါ စစ်လို့ ရတဲ့
      နည်းနဲ့ တစ်ဆင့်ချင်း ညှိပေးပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Evaluation-driven development",
          url: "https://web.dev/learn/ai/evaluation-driven-development",
        }
    actions:
      - {
          id: draw-tradeoff,
          type: whiteboard.apply,
          at: { mark: draw-tradeoff },
          clear: true,
          upsertIds: [b-title],
        }
      - {
          id: draw-short,
          type: whiteboard.apply,
          at: { mark: draw-short },
          upsertIds: [b-short, b-short-t, b-s1, b-s2],
          drawMs: 1600,
        }
      - {
          id: draw-too-short,
          type: whiteboard.apply,
          at: { mark: draw-too-short },
          upsertIds: [b-thin, b-thin-t, b-t1, b-t2],
          drawMs: 1600,
        }
      - {
          id: draw-edd,
          type: whiteboard.apply,
          at: { mark: draw-edd },
          upsertIds: [b-edd],
          drawMs: 1100,
        }

  - id: loop
    narration: >
      [[mark:draw-tdd]] ဒါကို test driven development၊ T D D နဲ့ နှိုင်းယှဉ်ကြည့်ရအောင်။ T D D မှာ test ကို
      အရင်ရေးပြီး၊ အဲဒီ test pass ဖြစ်အောင် code ကို ရေးပါတယ်။ code က deterministic ဖြစ်လို့ မှန်ရမယ့်
      အဖြေကို ကြိုရေးထားလို့ ရပါတယ်။ [[mark:draw-edd-loop]] AI ရဲ့ အဖြေကိုတော့ ဒီလို ကြိုမရေးထားနိုင်ပါဘူး။
      ကောင်းတဲ့ အဖြေရော၊ မှားတဲ့ အဖြေပါ ကြိုမမှန်းနိုင်တဲ့ ပုံစံတွေနဲ့ ထွက်လာလို့ပါ။ ဒါကြောင့် E D D မှာ
      ပြဿနာကို အရင် သတ်မှတ်၊ နှိုင်းယှဉ်ဖို့ အစ version ဖြစ်တဲ့ baseline ကို ရေး၊ အဖြေတွေကို evaluate
      လုပ်ပြီးမှ prompt ကို optimize လုပ်ပါတယ်။ [[mark:draw-edd-back]] ပြင်ပြီးတိုင်း ပြန်စစ်ရလို့ loop
      ဖြစ်တာပါ။ စစ်မယ့် စံတွေကို ချရေးရင်း ကိုယ် တကယ် လိုချင်တာကလည်း ပိုရှင်းလာပါတယ်။ [[mark:draw-soft]]
      ဒါ့အပြင် user ကို စာနာနိုင်တာ၊ tone နဲ့ ရှင်းလင်းမှုကို ခံစားနိုင်တာ လို soft skill တွေလည်း လိုပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Evaluation-driven development",
          url: "https://web.dev/learn/ai/evaluation-driven-development",
        }
      - {
          title: "Martin Fowler: Test Driven Development",
          url: "https://martinfowler.com/bliki/TestDrivenDevelopment.html",
        }
    actions:
      - {
          id: draw-tdd,
          type: whiteboard.apply,
          at: { mark: draw-tdd },
          clear: true,
          upsertIds:
            [c-title, c-tdd-h, c-t1, c-t1-t, c-ta1, c-t2, c-t2-t, c-ta2, c-t3, c-t3-t, c-tdd-note],
          drawMs: 3000,
        }
      - {
          id: draw-edd-loop,
          type: whiteboard.apply,
          at: { mark: draw-edd-loop },
          upsertIds:
            [
              c-ai-note,
              c-edd-h,
              c-e1,
              c-e1-t,
              c-ea1,
              c-e2,
              c-e2-t,
              c-ea2,
              c-e3,
              c-e3-t,
              c-ea3,
              c-e4,
              c-e4-t,
            ],
          drawMs: 3600,
        }
      - {
          id: draw-edd-back,
          type: whiteboard.apply,
          at: { mark: draw-edd-back },
          upsertIds: [c-back],
          drawMs: 900,
        }
      - {
          id: draw-soft,
          type: whiteboard.apply,
          at: { mark: draw-soft },
          upsertIds: [c-soft],
          drawMs: 1000,
        }

  - id: contract
    chapter: "ပြဿနာကို contract လို သတ်မှတ်ရအောင်"
    narration: >
      [[mark:draw-contract]] ကိုယ်တို့ စစ်မယ့် feature က ကောင်တာက လှလှ သုံးမယ့် menu ဖော်ပြချက် helper ပါ။
      ပထမ အဆင့်က ပြဿနာကို API contract တစ်ခုလို ရှင်းရှင်း သတ်မှတ်တာပါ။ [[mark:draw-io]] input က item
      နာမည်၊ လှလှ ရဲ့ မှတ်ချက်နဲ့ ရေးပုံ style ဖြစ်ပါတယ်။ output ကတော့ ဖော်ပြချက် သုံးခု ပါတဲ့ JSON ပါ။
      [[mark:draw-constraints]] constraint တွေကတော့ ဖော်ပြချက် တစ်ခုကို စာလုံး ၆၀ ထက် မပိုဖို့၊ tone
      နွေးထွေးဖို့၊ ဆိုင်က သက်သေ မပြနိုင်တဲ့ claim မပါဖို့ပါ။ [[mark:draw-tests]] ပြီးရင် စမ်းမယ့် input တွေကို
      စုရပါမယ်။ ပုံမှန် ကောင်းကောင်း input ငါးခု အပြင်၊ လက်တွေ့မှာ ကြုံရမယ့် ရှုပ်ပွတဲ့ input ခုနစ်ခုကိုပါ
      ထည့်ထားပါတယ်။ [[mark:draw-messy]] emoji ပါတဲ့ မှတ်ချက်၊ အရမ်း ရှည်တဲ့ မှတ်ချက်၊ အကောင်းဆုံးလို့
      ရေးပေးပါလို့ တောင်းတဲ့ မှတ်ချက် စတဲ့ edge case တွေပါ။ edge case ဆိုတာ ရှားပေမယ့် ကြုံနိုင်တဲ့
      ထူးဆန်းတဲ့ input ပါ။
    sources:
      - {
          title: "web.dev Learn AI: Evaluation-driven development (define the problem)",
          url: "https://web.dev/learn/ai/evaluation-driven-development",
        }
    actions:
      - {
          id: draw-contract,
          type: whiteboard.apply,
          at: { mark: draw-contract },
          clear: true,
          upsertIds: [d-title],
        }
      - {
          id: draw-io,
          type: whiteboard.apply,
          at: { mark: draw-io },
          upsertIds: [d-in-l, d-in, d-out-l, d-out],
          drawMs: 1600,
        }
      - {
          id: draw-constraints,
          type: whiteboard.apply,
          at: { mark: draw-constraints },
          upsertIds: [d-con-l, d-con, d-con2],
          drawMs: 1400,
        }
      - {
          id: draw-tests,
          type: whiteboard.apply,
          at: { mark: draw-tests },
          upsertIds: [d-tests],
          drawMs: 900,
        }
      - {
          id: draw-messy,
          type: whiteboard.apply,
          at: { mark: draw-messy },
          upsertIds: [d-messy, d-messy2, d-edge],
          drawMs: 1800,
        }

  - id: inputs
    chapter: "Baseline ကို စမ်းကြည့်ရအောင်"
    narration: >
      [[mark:close-contract]] ဒါဆို code မှာ ကြည့်ရအောင်။ [[mark:panel-ready]] ညာဘက် AI panel ရဲ့ Scorecard
      card မှာ စမ်းမယ့် input ၁၂ ခုကို တစ်ကြောင်းချင်း ပြထားပါတယ်။ ဒီ input တွေက lesson အတွက်
      ပြင်ဆင်ထားတဲ့ နမူနာ data ပါ။ input column မှာ ideal ငါးကြောင်းနဲ့ emoji၊ long၊ phone လို ရှုပ်ပွတဲ့
      input တွေကို တွေ့ရပါမယ်။ [[mark:sel-cases]] program က အဲဒီ input တွေကို data ဖိုင်ကနေ ယူပြီး၊
      [[mark:sel-loop]] input တစ်ခုချင်းအတွက် prompt ကို တည်ဆောက်ပြီး model ရဲ့ အဖြေကို ယူပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Evaluation-driven development (define the problem)",
          url: "https://web.dev/learn/ai/evaluation-driven-development",
        }
    actions:
      - { id: close-contract, type: whiteboard.apply, at: { mark: close-contract }, open: false }
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-done
