  - id: read
    chapter: "အဖြေတွေကို ဖတ်ကြည့်ရအောင်"
    narration: >
      ဒါပေမဲ့ code check တွေနဲ့ tone ကောင်းလား၊ customer အတွက် အသုံးဝင်လား၊ ဖော်ပြချက်တွေ ကွဲကွဲပြားပြား
      ရှိလား ဆိုတာကိုတော့ မစစ်နိုင်ပါဘူး။ ဒီလို လူ့ အမြင်ပေါ် မူတည်တဲ့ subjective metric တွေကို သတ်မှတ်ပြီး
      ညှိရတာက evaluation မှာ အချိန် အကုန်ဆုံး အပိုင်း ဖြစ်လို့၊ အဖြေတွေကို ကိုယ်တိုင် ဖတ်ရပါမယ်။ [[mark:click-n02]] panel အပေါ်က ခလုတ်နဲ့ claim မအောင်တဲ့ ideal input ကို
      ဖွင့်ကြည့်ရအောင်။ [[mark:read-n02]] ဒုတိယ ဖော်ပြချက်က ကြက်ဥနဲ့ ပဲဟင်းရဲ့ အကောင်းဆုံး ပေါင်းစပ်မှုလို့
      ပြောထားပါတယ်။ လှလှ ရဲ့ မှတ်ချက်ထဲမှာ မပါတဲ့ စကားပါ။ [[mark:click-e06]] အကောင်းဆုံးလို့
      ရေးပေးပါလို့ တောင်းထားတဲ့ input ကိုလည်း ကြည့်ပါ။ [[mark:read-e06]] ပထမ နှစ်ခုက ရန်ကုန်မှာ
      အကောင်းဆုံး ဆိုတဲ့ claim ကို မှတ်ချက် တောင်းတဲ့အတိုင်း ရေးထားပါတယ်။ prompt ထဲမှာ claim မရေးရဘူး
      ဆိုတဲ့ constraint မပါသေးတော့၊ model က မှတ်ချက် တောင်းတဲ့အတိုင်းပဲ ရေးပေးခဲ့တာပါ။ [[mark:notice]] ဖတ်ရင်းနဲ့
      နောက်ထပ် တစ်ခုကိုလည်း သတိထားမိပါတယ်။ ဖော်ပြချက် အတော်များများက အရသာ ဆိုတဲ့ စကားလုံးနဲ့ပဲ
      စ နေပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Evaluation-driven development (define your evaluation metrics)",
          url: "https://web.dev/learn/ai/evaluation-driven-development",
        }
    actions:
      - id: click-n02
        type: preview.click
        at: { mark: click-n02 }
        target: { by: testId, value: show-3 }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-n02
