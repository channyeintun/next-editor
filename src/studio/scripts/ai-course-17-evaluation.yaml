  - id: openings
    narration: >
      [[mark:type-openings]] ဒါကို ရေတွက်တဲ့ metric တစ်ခု program ထဲ ထည့်ပါမယ်။ [[mark:read-openings]]
      Openings card မှာ ဖော်ပြချက် ၃၆ ခုထဲက ၁၁ ခုက အရသာ နဲ့ စတယ်လို့ ပြနေပါတယ်။ သုံးခုမှာ တစ်ခုလောက်က
      အစ တူနေတော့၊ menu တစ်ခုလုံး ဖတ်တဲ့ customer အတွက် ထပ်နေသလို ဖြစ်မှာပါ။ ဒီ ပြဿနာက အဖြေတွေကို ဖတ်ကြည့်မှ
      ပေါ်လာတာ ဖြစ်လို့ အစက metric စာရင်းထဲမှာ မပါခဲ့ပါဘူး။ metric တွေက ဒီလို တဖြည်းဖြည်း တိုးလာပြီး
      နောက်ပိုင်းမှ ငြိမ်သွားပါတယ်။ [[mark:draw-metrics]] အခုထိ တွေ့ခဲ့တာကို စုကြည့်ရအောင်။ JSON၊ သုံးခု၊
      အရှည်၊ claim တို့က မှန်တဲ့ အဖြေ တစ်ခုတည်း ရှိတဲ့ deterministic metric တွေပါ။ [[mark:draw-subjective]]
      tone၊ အသုံးဝင်မှု၊ variety တို့ကတော့ subjective metric တွေပါ။ variety ကို အစ စကားလုံးနဲ့
      ရေတွက်ကြည့်ခဲ့ပေမယ့်၊ တကယ် ကွဲပြားလား ဆိုတာ ဖတ်မှ သိရပါတယ်။ [[mark:draw-bench]] MMLU Pro၊ SEED
      Bench လို public benchmark တွေက model ရွေးတဲ့အခါ အစ signal လောက်ပဲ ပေးနိုင်ပြီး၊ ကိုယ့် customer
      တွေကိုတော့ ကိုယ်စားမပြုပါဘူး။ [[mark:draw-expert]] ဘယ်လို ဖော်ပြချက်မျိုးက ကောင်းလဲ ဆိုတာ
      အသိဆုံးက လှလှ ပါ။ ဒါကြောင့် domain expert ဖြစ်တဲ့ လှလှ နဲ့ အတူ စစ်ရင် သိမ်မွေ့တဲ့ အမှားတွေကိုပါ
      မိနိုင်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Evaluation-driven development (define your evaluation metrics)",
          url: "https://web.dev/learn/ai/evaluation-driven-development",
        }
      - { title: "TIGER-Lab: MMLU-Pro", url: "https://huggingface.co/spaces/TIGER-Lab/MMLU-Pro" }
      - {
          title: "AILab-CVC: SEED-Bench leaderboard",
          url: "https://huggingface.co/spaces/AILab-CVC/SEED-Bench_Leaderboard",
        }
    actions:
      - {
          id: open-main-2,
          type: workspace.openFile,
          at: { mark: type-openings },
          path: src/main.js,
        }
      - id: type-openings
        type: editor.type
        at: { afterAction: open-main-2 }
        target:
          {
            file: src/main.js,
            after: "// The panel: the scorecard and, with the buttons above it, each recorded answer.\n",
            occurrence: 1,
          }
        text: "showOpenings(cases, \"အရသာ\");\n"
        cadence: line-by-line
      - id: expect-two-cards
        type: expect.preview
        at: { afterAction: type-openings }
        timeoutMs: 8000
        target: { by: testId, value: ai-cards }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-openings-36
        type: expect.preview
        at: { afterAction: expect-two-cards }
        timeoutMs: 5000
        target: { by: testId, value: ai-openings-1 }
        attribute: { name: data-value, value: "36" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-openings-11
        type: expect.preview
        at: { afterAction: expect-openings-36 }
        timeoutMs: 5000
        target: { by: testId, value: ai-openings-2 }
        attribute: { name: data-value, value: "11" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - {
          id: draw-metrics,
          type: whiteboard.apply,
          at: { mark: draw-metrics },
          open: true,
          clear: true,
          upsertIds: [e-title, e-det-l, e-det],
          drawMs: 1600,
        }
      - {
          id: draw-subjective,
          type: whiteboard.apply,
          at: { mark: draw-subjective },
          upsertIds: [e-sub-l, e-sub],
          drawMs: 1200,
        }
      - {
          id: draw-bench,
          type: whiteboard.apply,
          at: { mark: draw-bench },
          upsertIds: [e-bench],
          drawMs: 1100,
        }
      - {
          id: draw-expert,
          type: whiteboard.apply,
          at: { mark: draw-expert },
          upsertIds: [e-expert],
          drawMs: 1000,
        }

  - id: quiz
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ evaluation driven development ရဲ့ အဓိက ရည်မှန်းချက်က ဘာလဲ။
      public benchmark တွေမှာ အမှတ်ကောင်းဖို့လား၊ ဒါမှမဟုတ် တခြား တစ်ခုခုလား။ lesson ကို pause လုပ်ပြီး
      စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] အဖြေကတော့ prompt ကို တိုတိုနဲ့ ထိန်းထားရင်း အဖြေ ကောင်းအောင်လည်း
      စနစ်တကျ ချိန်ညှိဖို့ပါ။ ဘာကြောင့်လဲဆိုတော့ prompt တိုရင် မြန်ပြီး သက်သာပေမယ့် တိုလွန်းရင် အဖြေ
      ညံ့တတ်လို့ပါ။ E D D က ပြင်လိုက်တိုင်း ကိုယ့် input တွေပေါ်မှာ ပြန်စစ်ရင်း အဲဒီ ကြားက နေရာကို ရှာပေးပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Evaluation-driven development (Check your understanding)",
          url: "https://web.dev/learn/ai/evaluation-driven-development",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          clear: true,
          upsertIds: [z-title, z-q1, z-q2],
          drawMs: 1500,
        }
      - {
          id: draw-quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [z-a, z-a-note],
          drawMs: 1800,
        }

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ E D D က prompt တိုတာနဲ့ အဖြေ ကောင်းတာကို စစ်လို့ ရတဲ့ loop နဲ့
      ညှိပေးတဲ့ နည်းပါ။ ပြဿနာကို contract လို သတ်မှတ်၊ ideal input ရော ရှုပ်ပွတဲ့ input ပါ စု၊ zero shot
      baseline နဲ့ စပါတယ်။ [[mark:sel-checks]] ပြီးရင် JSON၊ အရေအတွက်၊ grapheme နဲ့ ရေတွက်တဲ့ အရှည်၊ claim
      လို deterministic check တွေကို code နဲ့ ရေးပြီး input တိုင်းပေါ်မှာ run ပါတယ်။ [[mark:sel-openings]]
      tone၊ variety လို subjective အပိုင်းကတော့ အဖြေတွေကို ဖတ်ရင်း metric အသစ်တွေ ထည့်ရပြီး၊ domain
      expert နဲ့ အတူ စစ်ရပါတယ်။ နောက် lesson မှာတော့ judge တွေနဲ့ prompt ကို တိုးတက်အောင် လုပ်တာကို
      ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Evaluation-driven development (your takeaways)",
          url: "https://web.dev/learn/ai/evaluation-driven-development",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: recap }, open: false }
      - {
          id: open-checks-2,
          type: workspace.openFile,
          at: { mark: sel-checks },
          path: src/checks.js,
        }
      - id: sel-checks
        type: editor.select
        at: { afterAction: open-checks-2 }
        target:
          {
            file: src/checks.js,
            text: "  { name: \"json\", test: (a) => a.json !== null },\n  { name: \"three\", test: (a) => a.items.length === 3 },\n  { name: \"length\", test: (a) => a.items.every((d) => graphemes(d) <= 60) },\n  { name: \"claim\", test: (a) => !CLAIMS.some((w) => a.text.includes(w)) },\n",
            occurrence: 1,
          }
      - { id: open-main-3, type: workspace.openFile, at: { mark: sel-openings }, path: src/main.js }
      - id: sel-openings
        type: editor.select
        at: { afterAction: open-main-3 }
        target: { file: src/main.js, text: 'showOpenings(cases, "အရသာ");', occurrence: 1 }
      - {
          id: expect-final-checks,
          type: expect.file,
          at: { afterAction: sel-openings },
          path: src/checks.js,
          contains: "export const checks = [\n  { name: \"json\", test: (a) => a.json !== null },\n  { name: \"three\", test: (a) => a.items.length === 3 },\n  { name: \"length\", test: (a) => a.items.every((d) => graphemes(d) <= 60) },\n  { name: \"claim\", test: (a) => !CLAIMS.some((w) => a.text.includes(w)) },\n];\n",
        }
      - {
          id: expect-final-main,
          type: expect.file,
          at: { afterAction: expect-final-checks },
          path: src/main.js,
          contains: "showOpenings(cases, \"အရသာ\");\nshowResults(cases, checks);\n",
        }
checks:
  - { type: timing.p95Ms, max: 300 }
