build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 2605

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  - id: intro
    chapter: "Page ရဲ့ structure ဆိုတာ ဘာလဲ"
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ ARIA ကို ဘယ်အချိန် သုံးသင့်လဲ ဆိုတာ ကြည့်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ page
      တစ်ခုလုံးရဲ့ structure ကို ကြည့်ပါမယ်။ [[mark:draw-page]] မျက်စိနဲ့ မြင်ရတဲ့သူက page ကို
      ဖွင့်လိုက်တာနဲ့ အပေါ်က ဆိုင်နာမည်နဲ့ link တွေ၊ အလယ်က အဓိက အကြောင်းအရာ၊ အောက်ဆုံးက လိပ်စာ ဆိုပြီး
      တစ်ချက်ကြည့်ရုံနဲ့ ခွဲမြင်နိုင်ပါတယ်။ screen reader သုံးတဲ့သူကတော့ အဲဒီ အပိုင်းတွေကို landmark တွေကနေ
      သိရပါတယ်။ landmark ဆိုတာ page ကို ပိုင်းခြားထားတဲ့ အဓိက နေရာကြီးတွေပါ။ [[mark:draw-outline]]
      နောက်တစ်ခုက heading တွေပါ။ heading တွေကို level အလိုက် စီလိုက်ရင်၊ စာအုပ်ရဲ့ မာတိကာလို page ရဲ့
      outline တစ်ခု ရလာပါတယ်။ [[mark:draw-jump]] screen reader တွေမှာ landmark တစ်ခုကနေ တစ်ခု၊
      heading တစ်ခုကနေ တစ်ခု ခုန်သွားတဲ့ command တွေ ရှိပါတယ်။ ဒါကြောင့် page ကို အစကနေ အဆုံးထိ
      နားထောင်စရာ မလိုဘဲ၊ လိုချင်တဲ့ အပိုင်းဆီ တန်းရောက်သွားနိုင်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: Content structure",
          url: "https://web.dev/learn/accessibility/structure",
        }
      - {
          title: "W3C WAI: Page Structure Tutorial",
          url: "https://www.w3.org/WAI/tutorials/page-structure/",
        }
      - {
          title: "W3C WAI-ARIA APG: Landmark Regions",
          url: "https://www.w3.org/WAI/ARIA/apg/practices/landmark-regions/",
        }
    actions:
      - id: start-dev-server
        type: runtime.start
        at: { scene: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: open-board-a
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [l05-a-title]
      - id: draw-page
        type: whiteboard.apply
        at: { mark: draw-page }
        upsertIds:
          [l05-a-banner, l05-a-banner-t, l05-a-main, l05-a-main-t, l05-a-footer, l05-a-footer-t]
        drawMs: 2400
      - id: draw-outline
        type: whiteboard.apply
        at: { mark: draw-outline }
        upsertIds: [l05-a-h1, l05-a-h2a, l05-a-h2b]
        drawMs: 1800
      - id: draw-jump
        type: whiteboard.apply
        at: { mark: draw-jump }
        upsertIds: [l05-a-arrow, l05-a-jump]
        drawMs: 1600

  - id: code-tour
    narration: >
      [[mark:close-board-a]] ဒါဆို ဆိုင်ရဲ့ page မှာ ဒီ မြေပုံ ပါရဲ့လား ကြည့်ရအောင်။ [[mark:open-index]] ဒါက
      page ရဲ့ HTML ဖိုင်ပါ။ [[mark:select-header-div]] အပေါ်ဆုံးက ဆိုင်နာမည်နဲ့ link တွေကို div တစ်ခုထဲ
      ထည့်ထားပြီး၊ class မှာတော့ site header လို့ နာမည် ပေးထားပါတယ်။ [[mark:select-page-div]] အလယ်က
      အကြောင်းအရာ အားလုံးကိုလည်း div နဲ့ပဲ ထုပ်ထားပါတယ်။ class နာမည်က developer အတွက် အဓိပ္ပာယ်
      ရှိပေမယ့် browser ကတော့ နားမလည်ပါဘူး။ ဒါကြောင့် ဒီ div တွေက accessibility tree ထဲမှာ role
      မရပါဘူး။ ဒီလို div တွေချည်း ထပ်နေတဲ့ code ကို div soup လို့ ခေါ်ကြပါတယ်။
      [[mark:preview-opens]] ညာဘက်မှာ ဆိုင်ရဲ့ page ကို မြင်ရပါပြီ။ မျက်စိနဲ့ ကြည့်ရင်တော့ ခေါင်းစဉ်တွေ
      နေရာတကျ ရှိနေပါတယ်။ ဒါပေမဲ့ အောက်က accessibility panel ကို ကြည့်ပါ။ heading နဲ့ link တွေ တန်းစီ
      နေပြီး၊ banner တို့ main တို့လို landmark တစ်ခုမှ မရှိပါဘူး။ [[mark:point-headings]] heading
      တွေကိုလည်း သတိထား ကြည့်ပါ။ ဆိုင်နာမည်က heading level တစ် ဖြစ်ပြီး၊ နောက်တစ်ခုက တန်း level လေး
      ဖြစ်နေပါတယ်။ ဖွင့်ချိန် ဆိုတဲ့ ခေါင်းစဉ်ကတော့ page ပေါ်မှာ မြင်ရပေမယ့် panel ထဲမှာ လုံးဝ မပါပါဘူး။
      ဒီ ပြဿနာ နှစ်ခုကို landmark ပြီးမှ ပြန်ကြည့်ပါမယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: Content structure",
          url: "https://web.dev/learn/accessibility/structure",
        }
      - {
          title: "MDN: Semantics in HTML",
          url: "https://developer.mozilla.org/en-US/docs/Glossary/Semantics#semantics_in_html",
        }
      - {
          title: "MDN: <div> (no meaning of its own)",
          url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Element/div",
        }
    actions:
      - id: close-board-a
        type: whiteboard.apply
        at: { mark: close-board-a }
        open: false
      - id: open-index
        type: workspace.openFile
        at: { mark: open-index }
        path: index.html
      - id: select-header-div
        type: editor.select
        at: { mark: select-header-div }
        target: { file: index.html, text: '<div class="site-header">', occurrence: 1 }
      - id: select-page-div
        type: editor.select
        at: { mark: select-page-div }
        target: { file: index.html, text: '<div class="page">', occurrence: 1 }
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { mark: preview-opens }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-dev-server }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-document-row
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: a11y-document }
        textContains: 'document "ရွှေလက်ဖက်ရည်ဆိုင်" lang="my"'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-no-warnings-start
        type: expect.preview
        at: { afterAction: expect-document-row }
        timeoutMs: 5000
        target: { by: testId, value: a11y-summary }
        attribute: { name: data-warnings, value: "0" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-nav-link-row
        type: expect.preview
        at: { afterAction: expect-no-warnings-start }
        timeoutMs: 5000
        target: { by: testId, value: a11y-nav-drinks }
        textContains: 'link "မီနူး"'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: collapse-runner-dock
        type: runtime.collapseDock
        at: { afterAction: expect-nav-link-row }
      - id: expect-h1-row
        type: expect.preview
        at: { mark: point-headings }
        timeoutMs: 5000
        target: { by: testId, value: a11y-shop-name }
        textContains: 'heading level 1 "ရွှေလက်ဖက်ရည်ဆိုင်"'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-h4-row
        type: expect.preview
        at: { afterAction: expect-h1-row }
        timeoutMs: 5000
        target: { by: testId, value: a11y-drinks-h4 }
        textContains: 'heading level 4 "သောက်စရာ"'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-fake-on-page
        type: expect.preview
        at: { afterAction: expect-h4-row }
        timeoutMs: 5000
        target: { by: testId, value: hours-fake }
        textContains: "ဖွင့်ချိန်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: landmark-board
    chapter: "Landmark element တွေ"
    narration: >
      [[mark:open-board-b]] ဒါဆို ဘယ် element တွေက landmark ဖြစ်လဲ ကြည့်ရအောင်။ [[mark:draw-pairs]] HTML
      မှာ landmark အတွက် element ကိုယ်စီ ရှိပြီး၊ browser က တစ်ခုချင်းကို landmark role တစ်ခုစီ
      ပေးပါတယ်။ page ရဲ့ အပေါ်ဆုံးက header က banner၊ nav က navigation၊ main က main၊ ဘေးမှာ
      ဆက်စပ်ပြီး ပြတဲ့ aside က complementary၊ အောက်ဆုံးက footer က contentinfo ဖြစ်ပါတယ်။
      [[mark:draw-named]] form နဲ့ section ကတော့ နာမည် တစ်ခု ပေးထားမှပဲ landmark ဖြစ်ပါတယ်။ [[mark:draw-prefer]] role attribute နဲ့ banner လို role
      ကို div ပေါ်မှာ ပေးလို့လည်း ရပါတယ်။ ဒါပေမဲ့ ARIA ရဲ့ ပထမ စည်းကမ်းအတိုင်း HTML element ရှိရင်
      element ကိုပဲ သုံးပါ။ page တိုင်းမှာ landmark အနည်းဆုံး တစ်ခု ရှိသင့်ပြီး၊ အရေးအကြီးဆုံးကတော့ main
      ပါ။
    sources:
      - {
          title: "web.dev Learn Accessibility: Content structure (Landmarks)",
          url: "https://web.dev/learn/accessibility/structure#landmarks",
        }
      - {
          title: "W3C HTML-AAM: HTML element role mappings",
          url: "https://www.w3.org/TR/html-aam-1.0/#html-element-role-mappings",
        }
      - {
          title: "MDN: ARIA landmark roles",
          url: "https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/landmark_role",
        }
      - {
          title: "W3C: Using ARIA (first rule of ARIA use)",
          url: "https://www.w3.org/TR/using-aria/#rule1",
        }
    actions:
      - id: open-board-b
        type: whiteboard.apply
        at: { mark: open-board-b }
        open: true
        clear: true
        upsertIds: [l05-b-title]
      - id: draw-pairs
        type: whiteboard.apply
        at: { mark: draw-pairs }
        upsertIds:
          [
            l05-b-header,
            l05-b-header-r,
            l05-b-nav,
            l05-b-nav-r,
            l05-b-main,
            l05-b-main-r,
            l05-b-aside,
            l05-b-aside-r,
            l05-b-footer,
            l05-b-footer-r,
          ]
        drawMs: 3000
      - id: draw-named
        type: whiteboard.apply
        at: { mark: draw-named }
        upsertIds:
          [l05-b-form, l05-b-form-r, l05-b-section, l05-b-section-r, l05-b-named-mark, l05-b-named]
        drawMs: 2200
      - id: draw-prefer
        type: whiteboard.apply
        at: { mark: draw-prefer }
        upsertIds: [l05-b-prefer]
        drawMs: 1200

  - id: wrap-main
    chapter: "Div တွေကို landmark နဲ့ ထုပ်ရအောင်"
    narration: >
      [[mark:close-board-b]] main ကနေ စကြည့်ရအောင်။ ဒီမှာ div ကို main အဖြစ် ပြောင်းရေးမယ့်အစား၊ အပြင်ကနေ
      landmark element နဲ့ ထုပ်လိုက်ပါမယ်။ ဒါဆို div မှာ ပေးထားတဲ့ class တွေ၊ style တွေ မပျက်ဘဲ landmark
      ရလာပါတယ်။ [[mark:open-main]] အလယ်က div ရဲ့ အပေါ်မှာ main ရဲ့ အဖွင့် tag ကို ထည့်ပါမယ်။
      [[mark:close-main]] div ပြီးတဲ့ နေရာမှာတော့ အပိတ် tag ကို ထည့်ပါမယ်။ [[mark:after-main]] panel ထဲမှာ
      main row ပေါ်လာပြီး၊ သောက်စရာ heading က သူ့အောက်ကို ဝင်သွားပါပြီ။ screen reader သုံးသူက main ဆီ
      တန်းခုန်လိုက်ရင်၊ အပေါ်က link တွေကို ကျော်ပြီး ဆိုင်ရဲ့ menu ကနေ စ နားထောင်နိုင်ပါပြီ။ main က page
      တစ်ခုမှာ တစ်ခုပဲ ရှိရပါမယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: Content structure (Landmarks)",
          url: "https://web.dev/learn/accessibility/structure#landmarks",
        }
      - {
          title: "MDN: <main>",
          url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Element/main",
        }
    actions:
      - id: close-board-b
        type: whiteboard.apply
        at: { mark: close-board-b }
        open: false
      - id: open-main
        type: editor.type
        at: { mark: open-main }
        cadence: block
        target: { file: index.html, after: "    <!-- page content -->\n", occurrence: 1 }
        text: "    <main data-testid=\"main\">\n"
      - id: close-main
        type: editor.type
        at: { mark: close-main }
        cadence: block
        target: { file: index.html, after: "</div><!-- /page content -->", occurrence: 1 }
        text: "\n    </main>"
      - id: expect-main-row
        type: expect.preview
        at: { mark: after-main }
        timeoutMs: 5000
        target: { by: testId, value: a11y-main }
        attribute: { name: data-name, value: "" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-main-text
        type: expect.preview
        at: { afterAction: expect-main-row }
        timeoutMs: 5000
        target: { by: testId, value: a11y-main }
        textContains: "main"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: wrap-header
    narration: >
      [[mark:open-header]] အပေါ်ဆုံးက div ကိုလည်း ဒီနည်းအတိုင်း header နဲ့ ထုပ်ပါမယ်။ [[mark:close-header]]
      ဒီ header က main ရဲ့ အပြင်မှာ ရှိတဲ့အတွက် banner landmark ဖြစ်ပါတယ်။ main၊ article ဒါမှမဟုတ်
      section လို element တွေရဲ့ အထဲက header ကတော့ banner မဖြစ်ပါဘူး။ [[mark:after-header]] banner row ပေါ်လာပြီး၊ ဆိုင်နာမည်
      heading က သူ့ထဲကို ရောက်သွားပါပြီ။ [[mark:open-nav]] header ထဲက link တွေကိုတော့ nav နဲ့ ထုပ်ပါမယ်။
      nav ကို တခြား page တွေဆီ ဒါမှမဟုတ် page ထဲက အပိုင်းတွေဆီ သွားတဲ့ အဓိက link အုပ်စုတွေအတွက် သုံးပါတယ်။
      ဒီ page မှာ link အုပ်စု နှစ်ခု ရှိလာမှာမို့၊ aria label နဲ့ အဓိက ဆိုတဲ့ နာမည်ပါ ပေးထားပါတယ်။
      [[mark:close-nav]] nav ရဲ့ အပိတ် tag က link နှစ်ခုရဲ့ နောက်မှာ ရှိရပါမယ်။ [[mark:after-nav]]
      navigation row မှာ အဓိက ဆိုတဲ့ name ပါလာပြီး၊ link နှစ်ခုက သူ့အောက်မှာ ရှိနေပါပြီ။
    sources:
      - {
          title: "web.dev Learn Accessibility: Content structure (Landmarks)",
          url: "https://web.dev/learn/accessibility/structure#landmarks",
        }
      - {
          title: "MDN: <header> (banner only outside article, aside, main, nav and section)",
          url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Element/header",
        }
      - {
          title: "MDN: <nav>",
          url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Element/nav",
        }
    actions:
      - id: open-header
        type: editor.type
        at: { mark: open-header }
        cadence: block
        target: { file: index.html, after: "    <!-- site header -->\n", occurrence: 1 }
        text: "    <header data-testid=\"site-header\">\n"
      - id: close-header
        type: editor.type
        at: { mark: close-header }
        cadence: block
        target: { file: index.html, after: "</div><!-- /site header -->", occurrence: 1 }
        text: "\n    </header>"
      - id: expect-banner-row
        type: expect.preview
        at: { mark: after-header }
        timeoutMs: 5000
        target: { by: testId, value: a11y-site-header }
        textContains: "banner"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: open-nav
        type: editor.type
        at: { mark: open-nav }
        cadence: block
        target: { file: index.html, after: "ရွှေလက်ဖက်ရည်ဆိုင်</h1>\n      </div>\n", occurrence: 1 }
        text: "      <nav aria-label=\"အဓိက\" data-testid=\"nav\">\n"
      - id: close-nav
        type: editor.type
        at: { mark: close-nav }
        cadence: block
        target: { file: index.html, after: "ဖွင့်ချိန်</a>\n      </div>\n", occurrence: 1 }
        text: "      </nav>\n"
      - id: expect-nav-row
        type: expect.preview
        at: { mark: after-nav }
        timeoutMs: 5000
        target: { by: testId, value: a11y-nav }
        textContains: 'navigation "အဓိက"'
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: wrap-footer
    narration: >
      [[mark:open-footer]] အောက်ဆုံးက div ကိုလည်း footer နဲ့ ထုပ်ပါမယ်။ [[mark:close-footer]] လိပ်စာ၊
      ဆိုင်အကြောင်း link တွေလို page တစ်ခုလုံးနဲ့ ဆိုင်တဲ့ အချက်အလက်တွေက footer ထဲမှာ ရှိတတ်ပါတယ်။
      [[mark:after-footer]] contentinfo row ပေါ်လာပါပြီ။ [[mark:open-footer-nav]] footer ထဲက ဆိုင်ခွဲများ၊
      အလုပ်ခေါ်စာ page တွေဆီ သွားတဲ့ link တွေကိုလည်း nav နဲ့ ထုပ်ပြီး၊ ဆိုင်အကြောင်း ဆိုတဲ့ နာမည် ပေးပါမယ်။ [[mark:close-footer-nav]] ဒါဆို
      navigation landmark နှစ်ခု ဖြစ်လာပါပြီ။ [[mark:after-footer-nav]] panel ထဲမှာ navigation row
      နှစ်ခုကို နာမည် ကိုယ်စီနဲ့ မြင်ရပါတယ်။ နာမည် မပေးထားရင် screen reader က landmark စာရင်းမှာ
      navigation၊ navigation လို့ပဲ ဖတ်ပြမှာမို့ ဘယ်ဟာက ဘာလဲ မသိနိုင်ပါဘူး။ ဒါကြောင့် အမျိုးအစား တူတဲ့
      landmark တစ်ခုထက် ပိုရှိရင် နာမည် ကိုယ်စီ ပေးပါ။
    sources:
      - {
          title: "web.dev Learn Accessibility: Content structure (Landmarks)",
          url: "https://web.dev/learn/accessibility/structure#landmarks",
        }
      - {
          title: "MDN: <footer> (contentinfo)",
          url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Element/footer",
        }
      - {
          title: "W3C WAI-ARIA APG: Landmark Regions (label multiple landmarks of the same type)",
          url: "https://www.w3.org/WAI/ARIA/apg/practices/landmark-regions/",
        }
    actions:
      - id: open-footer
        type: editor.type
        at: { mark: open-footer }
        cadence: block
        target: { file: index.html, after: "    <!-- site footer -->\n", occurrence: 1 }
        text: "    <footer data-testid=\"site-footer\">\n"
      - id: close-footer
        type: editor.type
        at: { mark: close-footer }
        cadence: block
        target: { file: index.html, after: "</div><!-- /site footer -->", occurrence: 1 }
        text: "\n    </footer>"
      - id: expect-contentinfo-row
        type: expect.preview
        at: { mark: after-footer }
        timeoutMs: 5000
        target: { by: testId, value: a11y-site-footer }
        textContains: "contentinfo"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: open-footer-nav
        type: editor.type
        at: { mark: open-footer-nav }
        cadence: block
        target: { file: index.html, after: "<p>အမှတ် ၁၂၊ ဗဟန်း၊ ရန်ကုန်</p>\n", occurrence: 1 }
        text: "      <nav aria-label=\"ဆိုင်အကြောင်း\" data-testid=\"footer-nav\">\n"
      - id: close-footer-nav
        type: editor.type
        at: { mark: close-footer-nav }
        cadence: block
        target: { file: index.html, after: "အလုပ်ခေါ်စာ</a>\n      </div>\n", occurrence: 1 }
        text: "      </nav>\n"
      - id: expect-footer-nav-row
        type: expect.preview
        at: { mark: after-footer-nav }
        timeoutMs: 5000
        target: { by: testId, value: a11y-footer-nav }
        textContains: 'navigation "ဆိုင်အကြောင်း"'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-main-nav-still-named
        type: expect.preview
        at: { afterAction: expect-footer-nav-row }
        timeoutMs: 5000
        target: { by: testId, value: a11y-nav }
        attribute: { name: data-name, value: "အဓိက" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: heading-board
    chapter: "Heading တွေနဲ့ outline"
    narration: >
      [[mark:open-board-c]] အခု heading တွေဘက် ပြောင်းရအောင်။ HTML မှာ heading level တစ်ကနေ ခြောက်အထိ
      ရှိပါတယ်။ level တစ်က page ရဲ့ အဓိက ခေါင်းစဉ်ဖြစ်ပြီး၊ ဂဏန်း ကြီးလာလေ အပိုင်း ငယ်လာလေပါ။
      [[mark:draw-now]] ဘယ်ဘက်မှာ ဆိုင်ရဲ့ အခု outline ပါ။ level တစ်ရဲ့ နောက်မှာ တန်း level လေး ရောက်လာလို့
      level နှစ်နဲ့ သုံးကို ကျော်သွားပါတယ်။ ဖွင့်ချိန်ကတော့ div ကို heading နဲ့ တူအောင် style ပေးထားတာမို့၊ screen reader အတွက်
      heading မဟုတ်ပါဘူး။ [[mark:draw-should]] ညာဘက်ကတော့ ဖြစ်သင့်တဲ့ outline ပါ။ ဆိုင်နာမည် အောက်မှာ
      အပိုင်း နှစ်ခုလုံးက level နှစ် ဖြစ်ရပါမယ်။ [[mark:draw-rules]] ဒါကြောင့် စည်းကမ်း သုံးခု မှတ်ထားပါ။
      အောက်ကို ဆင်းတဲ့အခါ level ကို မကျော်ပါနဲ့။ style သက်သက်နဲ့ heading အတု မလုပ်ပါနဲ့။ စာလုံး အရွယ်အစားကို heading level
      နဲ့ မရွေးဘဲ class နဲ့ ပေးပါ။
    sources:
      - {
          title: "web.dev Learn Accessibility: Content structure (Headings)",
          url: "https://web.dev/learn/accessibility/structure#headings",
        }
      - {
          title: "W3C WAI: Headings tutorial",
          url: "https://www.w3.org/WAI/tutorials/page-structure/headings/",
        }
      - {
          title: "MDN: <h1>–<h6> (do not skip heading levels)",
          url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Element/Heading_Elements",
        }
    actions:
      - id: open-board-c
        type: whiteboard.apply
        at: { mark: open-board-c }
        open: true
        clear: true
        upsertIds: [l05-c-title]
      - id: draw-now
        type: whiteboard.apply
        at: { mark: draw-now }
        upsertIds: [l05-c-now, l05-c-now-h1, l05-c-now-h4, l05-c-now-div]
        drawMs: 2400
      - id: draw-should
        type: whiteboard.apply
        at: { mark: draw-should }
        upsertIds: [l05-c-should, l05-c-should-h1, l05-c-should-h2a, l05-c-should-h2b]
        drawMs: 2400
      - id: draw-rules
        type: whiteboard.apply
        at: { mark: draw-rules }
        upsertIds: [l05-c-rule1, l05-c-rule2, l05-c-rule3]
        drawMs: 2400

  - id: fix-skipped-level
    chapter: "Level ကျော်နေတဲ့ heading ကို ပြင်ရအောင်"
    narration: >
      [[mark:close-board-c]] editor ထဲ ပြန်သွားရအောင်။ [[mark:type-drinks-h2]] level လေး heading ရဲ့
      အောက်မှာ မှန်ရမယ့် level နှစ် heading ကို ထည့်ပါမယ်။ class တစ်ခုနဲ့ id တစ်ခုပါ ပေးထားပြီး၊ id ကို
      နောက်မှ ပြန်သုံးပါမယ်။ [[mark:after-drinks-h2]] panel ထဲမှာ သောက်စရာ heading level နှစ် ပေါ်လာပါပြီ။
      page ပေါ်မှာတော့ ခေါင်းစဉ် နှစ်ခု ဖြစ်နေပါတယ်။ [[mark:hide-h4]] ကိုယ့် project မှာဆိုရင် level လေး
      အဟောင်းကို ဖျက်လိုက်ရုံပါပဲ။ ဒီမှာတော့ အဟောင်းနဲ့ အသစ်ကို code ထဲမှာ ယှဉ်ကြည့်လို့ ရအောင်၊ အဟောင်းကို
      hidden attribute နဲ့ ဖျောက်ထားပါမယ်။ [[mark:after-hide-h4]] level လေး row ပျောက်သွားပါပြီ။ ဒါပေမဲ့
      ခေါင်းစဉ်က အရင်ထက် ကြီးနေပါတယ်။ developer က level လေးကို ရွေးခဲ့တာ ဒီ အကြောင်းကြောင့်ပါ။
      [[mark:open-styles]] CSS ဖိုင်ကို ဖွင့်ပါမယ်။ [[mark:type-css]] ခုနက class ကို အရင် ခေါင်းစဉ်လောက်ပဲ
      အရွယ်အစား ပေးပါမယ်။ ရိုက်နေတုန်း page ပေါ်က သောက်စရာ ခေါင်းစဉ်ကို လိုက်ကြည့်ပါ။ [[mark:after-css]]
      ခေါင်းစဉ်က အရင် အရွယ်အစား ပြန်ဖြစ်သွားပေမယ့်၊ panel ထဲမှာတော့ level နှစ် အတိုင်းပဲ ရှိနေပါတယ်။
      ပုံစံကို CSS က ထိန်းပြီး၊ level ကိုတော့ HTML က ထိန်းတာပါ။
    sources:
      - {
          title: "web.dev Learn Accessibility: Content structure (Headings)",
          url: "https://web.dev/learn/accessibility/structure#headings",
        }
      - {
          title: "MDN: <h1>–<h6> (do not use headings to make text big or bold)",
          url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Element/Heading_Elements#usage_notes",
        }
      - {
          title: "MDN: hidden (removed from rendering and the accessibility tree)",
          url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Global_attributes/hidden",
        }
    actions:
      - id: close-board-c
        type: whiteboard.apply
        at: { mark: close-board-c }
        open: false
      - id: type-drinks-h2
        type: editor.type
        at: { mark: type-drinks-h2 }
        cadence: block
        target:
          { file: index.html, after: "<h4 data-testid=\"drinks-h4\">သောက်စရာ</h4>\n", occurrence: 1 }
        text: "        <h2 class=\"section-title\" id=\"drinks-title\" data-testid=\"drinks-title\">သောက်စရာ</h2>\n"
      - id: expect-drinks-h2-row
        type: expect.preview
        at: { mark: after-drinks-h2 }
        timeoutMs: 5000
        target: { by: testId, value: a11y-drinks-title }
        textContains: 'heading level 2 "သောက်စရာ"'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: hide-h4
        type: editor.type
        at: { mark: hide-h4 }
        cadence: block
        target: { file: index.html, after: "<h4", occurrence: 1 }
        text: " hidden"
      - id: expect-h4-hidden
        type: expect.preview
        at: { mark: after-hide-h4 }
        timeoutMs: 5000
        target: { by: testId, value: drinks-h4 }
        attribute: { name: hidden, value: "" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-drinks-h2-after-hide
        type: expect.preview
        at: { afterAction: expect-h4-hidden }
        timeoutMs: 5000
        target: { by: testId, value: a11y-drinks-title }
        attribute: { name: data-name, value: "သောက်စရာ" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: open-styles
        type: workspace.openFile
        at: { mark: open-styles }
        path: styles.css
      - id: type-css
        type: editor.type
        at: { mark: type-css }
        cadence: fast-explainer
        target: { file: styles.css, after: "", occurrence: 1 }
        text: ".section-title {\n  font-size: 1rem;\n}\n"
      - id: expect-level-kept
        type: expect.preview
        at: { mark: after-css }
        timeoutMs: 5000
        target: { by: testId, value: a11y-drinks-title }
        textContains: 'heading level 2 "သောက်စရာ"'
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: fix-fake-heading
    chapter: "Heading အတုကို heading အစစ် ပြောင်းရအောင်"
    narration: >
      [[mark:open-index-again]] HTML ဖိုင်ကို ပြန်ဖွင့်ပါမယ်။ [[mark:select-fake]] ဒီ div ကို ကြည့်ပါ။ CSS
      နဲ့ ခေါင်းစဉ်လို ထူထူ ပြထားပေမယ့် HTML အရတော့ div ပဲ ဖြစ်လို့ panel ထဲမှာ မပေါ်ပါဘူး။ မျက်စိနဲ့ မြင်ရတဲ့
      ခေါင်းစဉ်တိုင်းက heading element ဖြစ်ရပါမယ်။ [[mark:type-hours-h2]] ဒီ အောက်မှာ class တူတူနဲ့ level
      နှစ် heading ကို ထည့်ပါမယ်။ [[mark:hide-fake]] ပြီးတော့ div အဟောင်းကို ခုနကလိုပဲ ဖျောက်ထားပါမယ်။
      [[mark:after-hours]] panel ထဲမှာ ဖွင့်ချိန် heading level နှစ် ပေါ်လာပြီး၊ page ပေါ်မှာတော့ ခေါင်းစဉ်က
      အရင်အတိုင်းပဲ မြင်ရပါတယ်။ heading စာသားကိုလည်း အဲဒီ အပိုင်းမှာ ဘာရှိလဲ သိသာအောင် ရေးပါ။
      အာရုံစူးစိုက်ရ ခက်တဲ့သူတွေ၊ နားလည်မှုနဲ့ ဆိုင်တဲ့ မသန်စွမ်းမှု ရှိသူတွေက ဘယ်အပိုင်း အရေးကြီးလဲ
      ဆိုတာကို heading တွေကနေ အရင် ဖတ်ကြလို့ပါ။
    sources:
      - {
          title: "web.dev Learn Accessibility: Content structure (Headings)",
          url: "https://web.dev/learn/accessibility/structure#headings",
        }
      - {
          title: "W3C WAI: Understanding SC 1.3.1 Info and Relationships",
          url: "https://www.w3.org/WAI/WCAG22/Understanding/info-and-relationships.html",
        }
      - {
          title: "W3C WAI: Understanding SC 2.4.6 Headings and Labels",
          url: "https://www.w3.org/WAI/WCAG22/Understanding/headings-and-labels.html",
        }
    actions:
      - id: open-index-again
        type: workspace.openFile
        at: { mark: open-index-again }
        path: index.html
      - id: select-fake
        type: editor.select
        at: { mark: select-fake }
        target:
          {
            file: index.html,
            text: '<div class="title" data-testid="hours-fake">ဖွင့်ချိန်</div>',
            occurrence: 1,
          }
      - id: type-hours-h2
        type: editor.type
        at: { mark: type-hours-h2 }
        cadence: block
        target:
          {
            file: index.html,
            after: "<div class=\"title\" data-testid=\"hours-fake\">ဖွင့်ချိန်</div>\n",
            occurrence: 1,
          }
        text: "        <h2 class=\"section-title\" data-testid=\"hours-title\">ဖွင့်ချိန်</h2>\n"
      - id: hide-fake
        type: editor.type
        at: { mark: hide-fake }
        cadence: block
        target: { file: index.html, after: '<div class="title"', occurrence: 1 }
        text: " hidden"
      - id: expect-hours-h2-row
        type: expect.preview
        at: { mark: after-hours }
        timeoutMs: 5000
        target: { by: testId, value: a11y-hours-title }
        textContains: 'heading level 2 "ဖွင့်ချိန်"'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-fake-hidden
        type: expect.preview
        at: { afterAction: expect-hours-h2-row }
        timeoutMs: 5000
        target: { by: testId, value: hours-fake }
        attribute: { name: hidden, value: "" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: name-the-section
    narration: >
      [[mark:select-section]] landmark တစ်ခု ကျန်ပါသေးတယ်။ သောက်စရာ အပိုင်းက ဆိုင်ရဲ့ menu ဖြစ်လို့ landmark
      အဖြစ် တန်းခုန်လို့ ရစေချင်ပါတယ်။ section element နဲ့ ရေးထားပေမယ့် နာမည် မပါလို့ region မဖြစ်သေးပါဘူး။ [[mark:type-labelledby]] aria labelledby နဲ့
      ခုနက heading ရဲ့ id ကို ညွှန်ပေးပါမယ်။ ဒါဆို မြင်ရတဲ့ ခေါင်းစဉ်ကပဲ section ရဲ့ နာမည် ဖြစ်လာပါမယ်။
      [[mark:after-region]] region row မှာ သောက်စရာ ဆိုတဲ့ name ပါလာပါပြီ။ form element ကိုလည်း
      ဒီနည်းအတိုင်း နာမည် ပေးမှ form landmark ဖြစ်ပါတယ်။ ဒါပေမဲ့ section တိုင်းကို region မလုပ်ပါနဲ့။ landmark
      များလွန်းရင် စာရင်းက ရှည်ပြီး ခုန်ရတာ အသုံးမဝင်တော့ပါဘူး။
    sources:
      - {
          title: "web.dev Learn Accessibility: Content structure (section needs a name)",
          url: "https://web.dev/learn/accessibility/structure#landmarks",
        }
      - {
          title: "MDN: ARIA region role",
          url: "https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/region_role",
        }
      - {
          title: "MDN: aria-labelledby",
          url: "https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Attributes/aria-labelledby",
        }
      - {
          title: "W3C WAI-ARIA APG: Landmark Regions (too many landmarks create noise)",
          url: "https://www.w3.org/WAI/ARIA/apg/practices/landmark-regions/",
        }
    actions:
      - id: select-section
        type: editor.select
        at: { mark: select-section }
        target:
          { file: index.html, text: '<section class="menu-section" id="drinks"', occurrence: 1 }
      - id: type-labelledby
        type: editor.type
        at: { mark: type-labelledby }
        cadence: block
        target:
          { file: index.html, after: '<section class="menu-section" id="drinks"', occurrence: 1 }
        text: ' aria-labelledby="drinks-title"'
      - id: expect-region-row
        type: expect.preview
        at: { mark: after-region }
        timeoutMs: 5000
        target: { by: testId, value: a11y-drinks }
        textContains: 'region "သောက်စရာ"'
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: read-the-outline
    chapter: "Panel ကနေ outline ကို ဖတ်ကြည့်ရအောင်"
    narration: >
      [[mark:read-tree]] panel ကို အပေါ်ကနေ အောက်ကို ဖတ်ကြည့်ရအောင်။ အစက တန်းစီနေခဲ့တဲ့ row တွေက အခု
      banner၊ main၊ contentinfo ဆိုပြီး အုပ်စု သုံးစု ဖြစ်သွားပါပြီ။ heading တွေကလည်း ဆိုင်နာမည် level
      တစ်နဲ့ သူ့အောက်က level နှစ် နှစ်ခု ဆိုပြီး outline ကျနေပါပြီ။ [[mark:open-board-d]] screen reader
      တွေမှာ page ထဲက landmark တွေနဲ့ heading တွေကို စာရင်း တစ်ခုအဖြစ် ထုတ်ပြတဲ့ နေရာ ရှိပါတယ်။
      [[mark:draw-landmark-list]] ဆိုင်ရဲ့ page ဆိုရင် landmark စာရင်းမှာ ဒီ ခြောက်ခု ပေါ်လာမှာပါ။
      [[mark:draw-heading-list]] heading စာရင်းမှာတော့ level နဲ့အတူ ဒီ သုံးခု ပေါ်လာမှာပါ။ တစ်ခုကို
      ရွေးလိုက်တာနဲ့ အဲဒီ နေရာကို တန်းရောက်သွားပါတယ်။ ကိုယ့် ကွန်ပျူတာမှာ VoiceOver ဒါမှမဟုတ် NVDA ကို
      ဖွင့်ပြီး ဒီ စာရင်းတွေကို ကိုယ်တိုင် စမ်းကြည့်ပါ။
    sources:
      - {
          title: "web.dev Learn Accessibility: Content structure",
          url: "https://web.dev/learn/accessibility/structure",
        }
      - {
          title: "Apple: Use the VoiceOver rotor on Mac",
          url: "https://support.apple.com/guide/voiceover/use-the-voiceover-rotor-mchlp2719/mac",
        }
      - {
          title: "NVDA User Guide: Elements List",
          url: "https://download.nvaccess.org/documentation/userGuide.html#ElementsList",
        }
    actions:
      - id: expect-final-banner
        type: expect.preview
        at: { mark: read-tree }
        timeoutMs: 5000
        target: { by: testId, value: a11y-site-header }
        textContains: "banner"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-final-no-warnings
        type: expect.preview
        at: { afterAction: expect-final-banner }
        timeoutMs: 5000
        target: { by: testId, value: a11y-summary }
        attribute: { name: data-warnings, value: "0" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: open-board-d
        type: whiteboard.apply
        at: { mark: open-board-d }
        open: true
        clear: true
        upsertIds: [l05-d-title]
      - id: draw-landmark-list
        type: whiteboard.apply
        at: { mark: draw-landmark-list }
        upsertIds: [l05-d-landmarks, l05-d-l1, l05-d-l2, l05-d-l3, l05-d-l4, l05-d-l5, l05-d-l6]
        drawMs: 2800
      - id: draw-heading-list
        type: whiteboard.apply
        at: { mark: draw-heading-list }
        upsertIds: [l05-d-headings, l05-d-h1, l05-d-h2, l05-d-h3, l05-d-pick]
        drawMs: 2400

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:close-board-d]] ဒါဆို ပြန်ချုပ်ရရင်၊ ဒီ lesson မှာ မှတ်စရာ သုံးချက် ရှိပါတယ်။ [[mark:select-main]] page ရဲ့ အဓိက အပိုင်းကြီးတွေကို header၊
      nav၊ main၊ footer လို landmark element တွေနဲ့ ရေးပါ။ [[mark:select-nav-label]] အမျိုးအစား တူတဲ့
      landmark တွေကိုတော့ နာမည် ကိုယ်စီ ပေးပါ။ [[mark:select-h2]] heading တွေကို level မကျော်ဘဲ outline
      ဖြစ်အောင် ရေးပြီး၊ အရွယ်အစားကိုတော့ class နဲ့ ပေးပါ။ နောက် lesson မှာတော့ page ထဲက list နဲ့ table
      တွေကို screen reader က ဘယ်လို ဖတ်ပြလဲ၊ ဘယ်လို ရေးရမလဲ ဆိုတာ ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: Content structure",
          url: "https://web.dev/learn/accessibility/structure",
        }
      - {
          title: "W3C WAI: Page Structure Tutorial",
          url: "https://www.w3.org/WAI/tutorials/page-structure/",
        }
    actions:
      - id: close-board-d
        type: whiteboard.apply
        at: { mark: close-board-d }
        open: false
      - id: select-main
        type: editor.select
        at: { mark: select-main }
        target: { file: index.html, text: '<main data-testid="main">', occurrence: 1 }
      - id: select-nav-label
        type: editor.select
        at: { mark: select-nav-label }
        target: { file: index.html, text: 'aria-label="အဓိက"', occurrence: 1 }
      - id: select-h2
        type: editor.select
        at: { mark: select-h2 }
        target:
          { file: index.html, text: '<h2 class="section-title" id="drinks-title"', occurrence: 1 }
      - id: expect-file-main
        type: expect.file
        at: { afterAction: select-h2 }
        path: index.html
        contains: "    <main data-testid=\"main\">\n    <div class=\"page\">"
      - id: expect-file-header
        type: expect.file
        at: { afterAction: expect-file-main }
        path: index.html
        contains: "</div><!-- /site header -->\n    </header>"
      - id: expect-file-region
        type: expect.file
        at: { afterAction: expect-file-header }
        path: index.html
        contains: '<section class="menu-section" id="drinks" aria-labelledby="drinks-title"'
      - id: expect-file-css
        type: expect.file
        at: { afterAction: expect-file-region }
        path: styles.css
        contains: ".section-title {\n  font-size: 1rem;\n}"

checks:
  - { type: timing.p95Ms, max: 300 }
