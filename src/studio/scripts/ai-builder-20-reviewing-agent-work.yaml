# AI Builder, lesson 20: reviewing an agent's work (Burmese, docs kind).
#
# Start state (ws/): base-docs (package.json with a no-op dev script, notes.md, unused) +
# AGENTS.md (COURSE-KIT §4.4 base + Simplicity, exactly as L17 leaves it), docs/spec.md (§4.3 without
# AC-6, as L09 leaves it), tasks/02-summary.md (an EXAMPLE change summary written for this lesson:
# first line "# Example summary", never typed, called an example once) and docs/review-checklist.md
# pinned with its title line only. Nothing runs.
#
# Typed into docs/review-checklist.md (COURSE-KIT §4.12 outline; this lesson writes the full text):
# ## Questions in two groups (the package question is added after the quiz, in its place after the
# files question, so the quiz is not given away); ## Task 02 review: one finding per discovery, the
# Decision line, then the package finding (after the quiz) above the Decision.
#
# Boards: (F) the review funnel (orange, narrowing: what to look at first) with each level's red flag
# (red) beside it and the rule (green); (Z) the quiz: the kyat-format package.
#
# Build: bun ~/Documents/ai-builder-course-work/tools/build-lesson.ts template.yaml ws ai-builder-20-reviewing-agent-work.yaml
schemaVersion: 1
lesson:
  slug: ai-builder-20-reviewing-agent-work
  title: "AI Builder 20: Agent ရဲ့ အလုပ်ကို review လုပ်ခြင်း"
  locale: my-MM
  workspace:
    lessonType: javascript
    name: AI Builder
    entryFilePath: docs/review-checklist.md
    sidebarStartsCollapsed: true
    files:
      AGENTS.md: |
        # AGENTS.md · Shwe Tea House pre-order app

        ## Project
        A pre-order web app for a tea shop in Yangon. Customers order ahead and pick up at the counter.
        Read docs/spec.md before any change. If the spec does not answer a question, stop and ask.

        ## Stack
        Plain HTML, CSS and JavaScript. No framework.

        ## Rules
        - Prices are whole kyat (integers). Never use decimals.
        - Customer-facing text is Burmese (Unicode).
        - Times are Asia/Yangon.
        - Ask before adding any package.
        - One task at a time. Keep each change small.

        ## Done means
        - The acceptance criteria named in the task pass.
        - Summarise what you changed and what you did not do.

        ## Simplicity
        - Choose the simplest approach that meets the spec. Explain any new file or layer.
        - No new dependency, service or abstraction without asking first.
      docs/review-checklist.md: |+
        # Review checklist

      docs/spec.md: |
        # Spec · ကြိုမှာ app (v1)

        ## Goal
        မနက်ပိုင်း customer တွေ တန်းမစီရဘဲ ကြိုမှာပြီး လာယူနိုင်ဖို့ (problem.md)။

        ## Users
        customer (အောင်အောင်၊ မောင်မောင်)၊ ကောင်တာ (လှလှ)၊ ဆိုင်ပိုင်ရှင်

        ## Rules
        - ဈေးနှုန်း — ကျပ် ကိန်းပြည့်၊ ဒသမ မပါ။
        - အရေအတွက် — 1 ကနေ 20 အထိ။
        - လာယူချိန် — ဒီနေ့၊ ဆိုင်ဖွင့်ချိန်အတွင်း၊ အနည်းဆုံး 15 မိနစ် ကြိုမှာရမယ်။
        - အော်ဒါနံပါတ် — နေ့တိုင်း #101 ကနေ စမယ်။
        - ငွေ — ကောင်တာမှာ ချေမယ်။

        ## Example
        အောင်အောင် — လက်ဖက်ရည် 2 ခွက်၊ 8:30 မှာ လာယူမယ် → အော်ဒါ #101၊ 3,000 ကျပ်

        ## Out of scope
        requirements.md ရဲ့ Won't (for now) — delivery၊ online ငွေပေးချေမှု၊ login

        ## Acceptance criteria
        AC-1 Given လက်ဖက်ရည် 2၊ 8:30၊ နာမည်နဲ့ ဖုန်း ထည့်ထားတယ်
             When မှာမယ် ကို နှိပ်တယ်
             Then အော်ဒါနံပါတ်၊ စုစုပေါင်း 3,000 ကျပ်နဲ့ 8:30 ကို မြင်ရမယ်
        AC-2 Given အရေအတွက် 0
             When မှာမယ် ကို နှိပ်တယ်
             Then အော်ဒါ မဖြစ်ဘဲ "1 ကနေ 20 အထိ ရွေးပါ" လို့ ပြမယ်
        AC-3 Given လာယူချိန်က ဆိုင်ပိတ်ချိန်ထဲမှာ
             When မှာမယ် ကို နှိပ်တယ်
             Then အော်ဒါ မဖြစ်ဘဲ ဆိုင်ဖွင့်ချိန်ကို ပြမယ်
        AC-4 Given ဖုန်းနံပါတ် မထည့်ရသေးဘူး
             When မှာမယ် ကို နှိပ်တယ်
             Then အော်ဒါ မဖြစ်ဘဲ ဖုန်းနံပါတ် ထည့်ခိုင်းမယ်
        AC-5 Given အော်ဒါ အသစ် ဝင်လာတယ်
             When လှလှ က ကောင်တာစာရင်းကို ကြည့်တယ်
             Then အော်ဒါကို လာယူချိန်အလိုက် စီပြီး မြင်ရမယ်

        ## Definition of done
        - သက်ဆိုင်တဲ့ AC တွေ ဖုန်း screen ပေါ်မှာ စစ်ပြီး pass ဖြစ်ရမယ်။
        - code ထဲမှာ secret မပါရဘူး။
        - spec.md နဲ့ decisions.md ကို update လုပ်ပြီးပြီ။

        ## Open questions
        requirements.md ရဲ့ Questions for the owner ကို ကြည့်ပါ။
