  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 6120
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}
scenes:
  - id: recall
    chapter: ပြီးပြီ ဆိုတဲ့ summary
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ test plan နဲ့ app ကို လက်နဲ့ စမ်းခဲ့တော့၊ အရေအတွက် သုည၊ ဆိုင်ပိတ်ချိန်နဲ့ ဖုန်းနံပါတ်
      မပါတဲ့ case တွေ၊ TC နှစ် ကနေ TC လေး အထိ fail ဖြစ်ခဲ့ပါတယ်။ ဒါကြောင့် plan ထဲက ဒုတိယ task၊ မှားတဲ့ input ကို
      ငြင်းတဲ့ အလုပ်ကို brief တစ်စောင်နဲ့ agent ဆီ အပ်လိုက်ပါတယ်။ [[mark:open-summary]] ဥပမာ အနေနဲ့ agent က ဒီလို
      summary ပြန်ပေးတယ် ဆိုပါစို့။ ဘာတွေ ပြင်ခဲ့လဲ ဆိုတဲ့ အကျဉ်းချုပ်ပါ။ [[mark:sel-pass]] အောက်ဆုံးမှာ AC တွေ
      အားလုံး pass ဖြစ်တယ် လို့ ရေးထားပါတယ်။ ဒါဆို ဒီ ပြောင်းလဲမှုကို ယူသုံးလိုက်ရုံပဲလား။ [[mark:review]] code
      ကို ကိုယ်တိုင် မဖတ်တတ်ပေမဲ့ ဒီ မေးခွန်းကို ဖြေရမှာ ကိုယ်ပါ။ ပြောင်းလဲမှု တစ်ခုကို project ထဲ မထည့်ခင် တခြား
      မျက်စိနဲ့ စစ်တာကို code review လုပ်တယ် လို့ ခေါ်ပါတယ်။ code ကို တစ်ကြောင်းချင်း မဖတ်နိုင်ရင်တောင်၊ ကိုယ်
      ဆုံးဖြတ်နိုင်တဲ့ အရာတွေ အများကြီး ရှိပါတယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): Where to start (review the agent output you ship)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "The New SDLC (Burmese edition): The new SDLC (code review and deployment)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "Claude Code docs: Best practices (ask for evidence: all tests pass on its own tells you very little)",
          url: "https://code.claude.com/docs/en/best-practices",
        }
    actions:
      - {
          id: open-summary,
          type: workspace.openFile,
          at: { mark: open-summary },
          path: tasks/02-summary.md,
        }
      - {
          id: sel-pass,
          type: editor.select,
          at: { mark: sel-pass },
          target:
            {
              file: tasks/02-summary.md,
              text: "- AC-2၊ AC-3၊ AC-4 အားလုံး pass ဖြစ်ပါတယ်။",
              occurrence: 1,
            },
        }

  - id: funnel
    chapter: Code မဖတ်ဘဲ ဘာ စစ်မလဲ
    narration: >
      [[mark:f-open]] ဘယ်ကနေ စကြည့်မလဲ ဆိုတာကို ဇလုတ် ပုံနဲ့ ဆွဲကြည့်ရအောင်။ အပေါ်က အဆင့်တွေက စစ်ရ မြန်ပြီး၊
      အောက်ကို ဆင်းလေ ပိုသေချာ ကြည့်ရလေပါ။ ညာဘက်မှာတော့ အဆင့်တိုင်းရဲ့ red flag၊ ရပ်ပြီး မေးရမယ့် အချက်ကို
      ရေးပါမယ်။ [[mark:f-1]] ပထမ အဆင့်က brief နဲ့ summary ကို ယှဉ်ကြည့်တာပါ။ ခိုင်းထားတဲ့ အလုပ်ကို လုပ်ခဲ့လား၊
      မခိုင်းတာ ထပ်ပါလာလား ဆိုတာပါ။ [[mark:f-2]] ဒုတိယက ပြင်ခဲ့တဲ့ file စာရင်းနဲ့ ပြောင်းလဲမှုရဲ့ အရွယ်ပါ။ ဘာ
      ပြောင်းသွားလဲ ဆိုတာ အတိအကျ ပြတဲ့ စာရင်းကို diff လို့ ခေါ်ပါတယ်။ ခိုင်းတာ သေးပြီး diff ကြီးနေရင် red flag ပါ။
      ပြောင်းလဲမှု ကြီးလေ စစ်ရ ခက်လေ၊ အမှား ဝှက်နေနိုင်လေ ဖြစ်လို့ပါ။ [[mark:f-3]] တတိယက ထိရင် အန္တရာယ် များတဲ့
      နေရာတွေပါ။ spec နဲ့ test တွေက မှန်တယ် ဆိုတာ ဘာလဲ ဆိုတဲ့ ကိုယ့် စစ်ချက်တွေ ဖြစ်လို့၊ agent က အဲဒါတွေကို
      ပြင်သွားရင် စံကို ရွှေ့သွားတာပါ။ secret နဲ့ customer ရဲ့ data ကိုလည်း ဒီ အဆင့်မှာ ကြည့်ပါတယ်။ [[mark:f-4]]
      စတုတ္ထက customer ဖုန်းပေါ်မှာ မြင်ရမယ့် စာတွေပါ။ [[mark:f-5]] နောက်ဆုံးက ဒီ ပြောင်းလဲမှုကို ကိုယ်
      ရှင်းပြနိုင်လား ဆိုတာပါ။ [[mark:f-rule]] ဘယ် အဆင့်မှာပဲ red flag တွေ့တွေ့၊ merge မလုပ်ခင် ရပ်ပြီး မေးပါ။
      merge ဆိုတာ agent ပြင်ထားတဲ့ ပြောင်းလဲမှုကို project ရဲ့ အဓိက code ထဲ ပေါင်းထည့်တာပါ။
    sources:
      - {
          title: "Google Engineering Practices: Small CLs (large changes are reviewed less thoroughly; reviewers may reject a change for being too large)",
          url: "https://google.github.io/eng-practices/review/developer/small-cls.html",
        }
      - {
          title: "Google Engineering Practices: What to look for in a code review (functionality, complexity, tests must be valid)",
          url: "https://google.github.io/eng-practices/review/reviewer/looking-for.html",
        }
      - {
          title: "The New SDLC (Burmese edition): Where to start (code review for AI code)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: open-board-f,
          type: whiteboard.apply,
          at: { mark: f-open },
          open: true,
          clear: true,
          upsertIds: [f-title, f-lh, f-rh],
        }
      - {
          id: draw-f1,
          type: whiteboard.apply,
          at: { mark: f-1 },
          upsertIds: [f1-box, f1, fr1],
          drawMs: 1400,
        }
      - {
          id: draw-f2,
          type: whiteboard.apply,
          at: { mark: f-2 },
          upsertIds: [f2-box, f2, fr2],
          drawMs: 1400,
        }
      - {
          id: draw-f3,
          type: whiteboard.apply,
          at: { mark: f-3 },
          upsertIds: [f3-box, f3, fr3],
          drawMs: 1400,
        }
      - {
          id: draw-f4,
          type: whiteboard.apply,
          at: { mark: f-4 },
          upsertIds: [f4-box, f4, fr4],
          drawMs: 1200,
        }
      - {
          id: draw-f5,
          type: whiteboard.apply,
          at: { mark: f-5 },
          upsertIds: [f5-box, f5, fr5],
          drawMs: 1200,
        }
      - {
          id: draw-f-rule,
