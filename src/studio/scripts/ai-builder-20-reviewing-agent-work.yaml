  - id: checklist
    chapter: Review checklist ရေးရအောင်
    narration: >
      [[mark:close-f]] ဒီ အစဉ်ကို ပြောင်းလဲမှု တိုင်းမှာ ပြန်သုံးနိုင်အောင် checklist တစ်ခု အဖြစ် ရေးထားပါမယ်။
      [[mark:type-q1]] ပထမ သုံးကြောင်းက ခိုင်းတာ၊ အရွယ်နဲ့ ထိခဲ့တဲ့ file တွေကို မေးတာပါ။ code မဖတ်ဘဲ summary နဲ့
      file နာမည်တွေကနေ ဖြေလို့ ရတဲ့ မေးခွန်းတွေ ဖြစ်လို့ အရင်ဆုံး ထားပါတယ်။ [[mark:type-q2]] နောက် လေးကြောင်းက
      ဇလုတ်ရဲ့ အောက်ပိုင်းပါ။ ပြောင်းလဲမှုထဲကို ပိုနီးနီး ကပ်ကြည့်ရမယ့် မေးခွန်းတွေပါ။ [[mark:sel-secret]] secret
      ဆိုတာ API key၊ password လို လျှို့ဝှက်ထားရမယ့် စာသားပါ။ code ထဲ ရောက်သွားရင် တခြားသူ ယူသုံးနိုင်ပါတယ်။ code
      မဖတ်တတ်လည်း diff ထဲမှာ စာလုံး အရှည်ကြီးတွေ၊ ဖုန်းနံပါတ် စာရင်းတွေ ပါနေတာမျိုးကို မြင်ရင် သိနိုင်ပါတယ်။
      [[mark:sel-error]] error စာသားကတော့ ဘာ မှားလဲ၊ ဘာ လုပ်ရမလဲ ဆိုတာကို customer နားလည်တဲ့ စကားနဲ့ ပြောရပါမယ်။
      ဒါကို summary ကနေ မသိနိုင်လို့ ဖုန်းပေါ်မှာ test plan အတိုင်း ပြန်စမ်းတဲ့အခါ ကြည့်ပါ။
    sources:
      - {
          title: "GitHub Docs: About secret scanning (hardcoded credentials can be abused)",
          url: "https://docs.github.com/en/code-security/secret-scanning/introduction/about-secret-scanning",
        }
      - {
          title: "GOV.UK Design System: Error message (say what has happened and how to fix it, in plain words)",
          url: "https://design-system.service.gov.uk/components/error-message/",
        }
    actions:
      - { id: close-f, type: whiteboard.apply, at: { mark: close-f }, open: false }
      - {
          id: open-check,
          type: workspace.openFile,
          at: { afterAction: close-f },
          path: docs/review-checklist.md,
        }
      - id: type-q1
        type: editor.type
        at: { mark: type-q1 }
        target: { file: docs/review-checklist.md, after: "# Review checklist\n\n", occurrence: 1 }
        text: "## Questions\n- ခိုင်းတဲ့ task ကိုပဲ လုပ်ခဲ့လား၊ မခိုင်းတာ ပါလာလား။\n- ပြောင်းလဲမှု အရွယ်က task နဲ့ ကိုက်လား။\n- မထိရမယ့် file — spec၊ test — ကို ပြင်ခဲ့လား။\n"
        cadence: line-by-line
      - id: type-q2
        type: editor.type
        at: { mark: type-q2 }
        target: { file: docs/review-checklist.md, after: "ကို ပြင်ခဲ့လား။\n", occurrence: 1 }
        text: "- secret ဒါမှမဟုတ် customer ရဲ့ data code ထဲ ပါလား။\n- customer မြင်ရမယ့် error စာသားက ဘာမှားလဲ၊ ဘာလုပ်ရမလဲ ပြောလား။\n- မလုပ်ခဲ့တာတွေကို စာရင်း ပေးထားလား။\n- ဒီ ပြောင်းလဲမှုကို ကိုယ် နှစ်ကြောင်းနဲ့ ရှင်းပြနိုင်လား။\n"
        cadence: line-by-line
      - {
          id: sel-secret,
          type: editor.select,
          at: { mark: sel-secret },
          target:
            {
              file: docs/review-checklist.md,
              text: "- secret ဒါမှမဟုတ် customer ရဲ့ data code ထဲ ပါလား။",
              occurrence: 1,
            },
        }
      - {
          id: sel-error,
          type: editor.select,
          at: { mark: sel-error },
          target:
            {
              file: docs/review-checklist.md,
              text: "- customer မြင်ရမယ့် error စာသားက ဘာမှားလဲ၊ ဘာလုပ်ရမလဲ ပြောလား။",
              occurrence: 1,
            },
        }

  - id: size
    chapter: Task 02 ကို review လုပ်ရအောင်
    narration: >
      [[mark:open-summary2]] ကဲ၊ agent ရဲ့ summary ကို checklist နဲ့ စစ်ကြည့်ရအောင်။ [[mark:sel-files]] task မှာ
      စစ်ရမယ့် rule က သုံးခုပဲ ရှိပါတယ်။ အရေအတွက်၊ လာယူချိန်နဲ့ ဖုန်းနံပါတ်ပါ။ ဒါပေမဲ့ file ကိုးခု ပြင်ထားပါတယ်။
      [[mark:sel-new]] အဲဒီထဲမှာ folder အသစ် နှစ်ခုနဲ့ file အသစ် လေးခု ပါပါတယ်။ ရိုးရှင်းအောင် ထိန်းဖို့
      လေ့လာခဲ့တုန်းက သတိထားခဲ့တဲ့ အလွှာ အသစ်တွေပါ။ [[mark:open-agents]] AGENTS.md ကို ပြန်ကြည့်ရအောင်။
      [[mark:sel-layer]] ဒီ rule က project ထဲ အသစ် ဝင်လာတဲ့ အပိုင်း တိုင်းအတွက် အကြောင်းပြချက် တောင်းထားပါတယ်။
      summary မှာတော့ အဲဒီ အကြောင်းပြချက် မပါပါဘူး။ မှားတယ်လို့ ချက်ချင်း မဆိုနိုင်ပေမဲ့၊ မေးရမယ့် red flag ပါ။
      [[mark:open-check2]] ဒီ တွေ့ချက်တွေကို checklist မှာ ချရေးထားရအောင်။ [[mark:type-f1]] ဒုတိယ task အတွက် review အပိုင်းကို
      စရေးပါမယ်။ ပထမ တွေ့ချက်က ပြောင်းလဲမှုရဲ့ အရွယ်ပါ။ ကြက်ခြေခတ် အမှတ်အသားက ဒီအတိုင်း လက်မခံနိုင်သေးဘူး ဆိုတဲ့
      အဓိပ္ပာယ်ပါ။
    sources:
      - {
          title: "Google Engineering Practices: Small CLs (a change spread across many files can be too large)",
          url: "https://google.github.io/eng-practices/review/developer/small-cls.html",
        }
      - {
          title: "Claude docs: Prompting best practices, Overeagerness (extra files, unnecessary abstractions)",
          url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices",
        }
    actions:
      - {
          id: open-summary2,
          type: workspace.openFile,
          at: { mark: open-summary2 },
          path: tasks/02-summary.md,
        }
      - {
          id: sel-files,
          type: editor.select,
          at: { mark: sel-files },
          target: { file: tasks/02-summary.md, text: "## Changed — 9 files", occurrence: 1 },
        }
      - {
          id: sel-new,
          type: editor.select,
          at: { mark: sel-new },
          target:
            {
              file: tasks/02-summary.md,
              text: "- src/validation/index.js — အသစ်\n- src/validation/rules.js — အသစ်\n- src/validation/messages.js — အသစ်\n- src/config/hours.js — အသစ်\n",
              occurrence: 1,
            },
        }
      - { id: open-agents, type: workspace.openFile, at: { mark: open-agents }, path: AGENTS.md }
      - {
          id: sel-layer,
          type: editor.select,
          at: { mark: sel-layer },
          target: { file: AGENTS.md, text: "Explain any new file or layer.", occurrence: 1 },
        }
      - {
          id: open-check2,
          type: workspace.openFile,
          at: { mark: open-check2 },
          path: docs/review-checklist.md,
        }
      - id: type-f1
        type: editor.type
        at: { mark: type-f1 }
        target: { file: docs/review-checklist.md, after: "နှစ်ကြောင်းနဲ့ ရှင်းပြနိုင်လား။\n", occurrence: 1 }
        text: "\n## Task 02 review\n- ❌ rule 3 ခုအတွက် file 9 ခု၊ အသစ် 4 ခု — ဘာကြောင့်လဲ ရှင်းမထားဘူး။\n"
        cadence: line-by-line
      - {
          id: expect-review,
          type: expect.file,
          at: { afterAction: type-f1 },
          path: docs/review-checklist.md,
          contains: "## Task 02 review",
        }

  - id: spec
    narration: >
      [[mark:open-summary3]] summary ကို ဆက်ကြည့်ရအောင်။ [[mark:sel-spec-file]] file စာရင်းရဲ့ နောက်ဆုံးမှာ spec
      ဖိုင် ပါနေပါတယ်။ [[mark:sel-note]] မှတ်ချက်ကို ကြည့်ရင် agent က AC သုံး ကို လျှော့ထားပါတယ်။ ဆိုင်ပိတ်ချိန်
      အော်ဒါတွေ ဆက်ဝင်လာနိုင်အောင်ပါ။ customer မဆုံးရှုံးအောင် ဆိုတဲ့ အကြောင်းပြချက်က ကောင်းသလို ထင်ရပါတယ်။
      [[mark:open-spec]] ဒါပေမဲ့ ကိုယ်တို့ spec ကို ပြန်ကြည့်ရအောင်။ [[mark:sel-ac3]] AC သုံး က ပိတ်ချိန်
      အော်ဒါကို လက်မခံဘဲ ဖွင့်ချိန်ကို ပြခိုင်းထားပါတယ်။ ဆိုလိုတာက agent က code ကို AC နဲ့ ကိုက်အောင် မပြင်ဘဲ၊ AC
      ကို code နဲ့ ကိုက်အောင် ပြင်သွားတာပါ။ အားလုံး pass ဖြစ်တယ် ဆိုတာလည်း ဒါကြောင့်ပါ။ spec ကို ပြောင်းမလား ဆိုတာ
      ဆိုင်ပိုင်ရှင် နဲ့ ကိုယ် ဆုံးဖြတ်ရမယ့် business ကိစ္စပါ။ agent က အဲဒီ ကိစ္စကို သူ့ဘာသာ ပြောင်းသွားလို့၊
      ဒါက ဒီနေ့ တွေ့ချက်တွေထဲမှာ အလေးဆုံးပါ။ [[mark:open-check3]] agent ကို ဘာ ပြန်ပြင်ခိုင်းရမလဲ ဆိုတာလည်း ရှင်းပါတယ်။ [[mark:type-f2]]
      ဒါကို ဒုတိယ တွေ့ချက် အဖြစ် ရေးထားပါမယ်။ spec ကို မူလ အတိုင်း ပြန်ထားပြီး၊ code ကိုသာ AC နဲ့ ကိုက်အောင်
      ပြင်ခိုင်းရမှာပါ။
    sources:
      - {
          title: "Google Engineering Practices: What to look for in a code review (a human must ensure that tests are valid)",
          url: "https://google.github.io/eng-practices/review/reviewer/looking-for.html",
        }
      - {
          title: "Claude Code docs: Best practices (review the work against your spec)",
          url: "https://code.claude.com/docs/en/best-practices",
        }
      - {
          title: "The New SDLC (Burmese edition): The developer's changing role (the 80 % problem: output that looks right)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: open-summary3,
          type: workspace.openFile,
          at: { mark: open-summary3 },
          path: tasks/02-summary.md,
        }
      - {
          id: sel-spec-file,
          type: editor.select,
          at: { mark: sel-spec-file },
          target:
            { file: tasks/02-summary.md, text: "- docs/spec.md — AC-3 ကို ပြင်တယ်", occurrence: 1 },
        }
      - {
          id: sel-note,
          type: editor.select,
          at: { mark: sel-note },
          target:
            {
              file: tasks/02-summary.md,
              text: "- AC-3 — ဆိုင်ပိတ်ချိန် အော်ဒါကို ငြင်းမယ့်အစား သတိပေးစာ ပြပြီး လက်ခံအောင် ပြင်ထားတယ်။",
              occurrence: 1,
            },
        }
      - { id: open-spec, type: workspace.openFile, at: { mark: open-spec }, path: docs/spec.md }
      - {
          id: sel-ac3,
          type: editor.select,
          at: { mark: sel-ac3 },
          target:
            {
              file: docs/spec.md,
              text: "AC-3 Given လာယူချိန်က ဆိုင်ပိတ်ချိန်ထဲမှာ\n     When မှာမယ် ကို နှိပ်တယ်\n     Then အော်ဒါ မဖြစ်ဘဲ ဆိုင်ဖွင့်ချိန်ကို ပြမယ်",
              occurrence: 1,
            },
        }
      - {
          id: open-check3,
          type: workspace.openFile,
          at: { mark: open-check3 },
          path: docs/review-checklist.md,
        }
      - id: type-f2
        type: editor.type
        at: { mark: type-f2 }
        target: { file: docs/review-checklist.md, after: "ရှင်းမထားဘူး။\n", occurrence: 1 }
        text: "- ❌ AC-3 ကို ပြည့်အောင် မလုပ်ဘဲ spec.md ကို ပြင်သွားတယ်။ spec က ကိုယ်တို့ ဆုံးဖြတ်ရတာ။\n"
        cadence: line-by-line

  - id: verdict
    narration: >
      [[mark:open-agents2]] AGENTS.md ကို နောက်တစ်ခါ ပြန်ကြည့်ရအောင်။ [[mark:sel-summarise]] ဒီ rule က အလုပ်
      ပြီးတိုင်း ကိုယ့်ဆီ ပြန်ရောက်လာမယ့် အစီရင်ခံစာမှာ မလုပ်ခဲ့တာတွေပါ ပါအောင် သတ်မှတ်ထားပါတယ်။ ဒါပေမဲ့ summary
      မှာ အဲဒီ စာရင်း မပါပါဘူး။ မလုပ်ခဲ့တာ တကယ် မရှိလို့လား၊ မပြောခဲ့လို့လား ဆိုတာ ကိုယ် မသိနိုင်ပါဘူး။
      [[mark:open-check4]] ဒီ အချက်ကိုလည်း မှတ်ထားရအောင်။ [[mark:type-f3]] တတိယ တွေ့ချက် အဖြစ် ရေးပြီး၊ အောက်မှာ
      ဆုံးဖြတ်ချက်ကိုလည်း ထည့်ပါမယ်။ [[mark:sel-decision]] ဆုံးဖြတ်ချက်က ဒီ ပြောင်းလဲမှုကို project ထဲ မထည့်သေးဘဲ
      agent ဆီ ပြန်ပို့တာပါ။ ပြင်ပြီး ပြန်လာရင် ပြီးခဲ့တဲ့ lesson ရဲ့ test plan နဲ့ ထပ်စစ်ပါမယ်။ [[mark:fresh]]
      ပြန်ပို့တဲ့အခါ ဘာ ပြောင်းခဲ့လဲ ဆိုတာကို code မဖတ်တဲ့သူ နားလည်တဲ့ စကားနဲ့ ရှင်းပြခိုင်းပြီး၊ မလုပ်ခဲ့တာ
      စာရင်းကိုလည်း တောင်းပါ။ နောက်ထပ် အကူအညီ တစ်ခုက agent နဲ့ အလုပ် အသစ် စတဲ့ session တစ်ခု ဒါမှမဟုတ် code
      ဖတ်တတ်တဲ့ လူ တစ်ယောက်ကို spec နဲ့ တိုက်စစ်ခိုင်းတာပါ။ နှစ်မျိုးလုံးဆီမှာ ဒီ code ကို ဘာကြောင့် ဒီလို
      ရေးခဲ့လဲ ဆိုတဲ့ အရင် စကားတွေ မရှိလို့၊ ရလဒ်ကိုပဲ spec နဲ့ ယှဉ်ပြီး စစ်ပါတယ်။ [[mark:nobody]] ဒါပေမဲ့
      နောက်ဆုံး ဆုံးဖြတ်တာက ကိုယ်ပါ။ ဘယ်သူမှ ရှင်းမပြနိုင်တဲ့ ပြောင်းလဲမှုကို merge မလုပ်ပါနဲ့။ ပျက်တဲ့နေ့မှာ
      ပြင်ပေးနိုင်မယ့်သူ မရှိလို့ပါ။
    sources:
      - {
          title: "Claude Code docs: Best practices (a second session is the easiest independent reviewer; a fresh reviewer is not swayed by the reasoning that produced the code)",
          url: "https://code.claude.com/docs/en/best-practices",
        }
      - {
          title: "Google Engineering Practices: What to look for in a code review (if you can't understand the code, others won't either)",
          url: "https://google.github.io/eng-practices/review/reviewer/looking-for.html",
        }
      - {
          title: "The New SDLC (Burmese edition): Where to start (code nobody understands becomes a debugging cost); The new SDLC (AI as a first-pass reviewer, human judgment still needed)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - { id: open-agents2, type: workspace.openFile, at: { mark: open-agents2 }, path: AGENTS.md }
      - {
          id: sel-summarise,
          type: editor.select,
          at: { mark: sel-summarise },
          target:
            {
              file: AGENTS.md,
              text: "- Summarise what you changed and what you did not do.",
              occurrence: 1,
            },
        }
      - {
          id: open-check4,
          type: workspace.openFile,
          at: { mark: open-check4 },
          path: docs/review-checklist.md,
        }
      - id: type-f3
        type: editor.type
        at: { mark: type-f3 }
        target: { file: docs/review-checklist.md, after: "spec က ကိုယ်တို့ ဆုံးဖြတ်ရတာ။\n", occurrence: 1 }
        text: "- ❌ မလုပ်ခဲ့တာ စာရင်း မပါဘူး။\nDecision — merge မလုပ်ဘူး။ ❌ တွေ ပြင်ဖို့ ပြန်ပို့မယ်၊ ပြီးရင် test plan ကို ပြန် run မယ်။\n"
        cadence: line-by-line
      - {
          id: sel-decision,
          type: editor.select,
          at: { mark: sel-decision },
          target:
            { file: docs/review-checklist.md, text: "Decision — merge မလုပ်ဘူး။", occurrence: 1 },
        }

  - id: quiz
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ summary ထဲမှာ ကျပ် ပမာဏကို သပ်သပ်ရပ်ရပ် ပြဖို့ ဆိုပြီး kyat format
      ဆိုတဲ့ package အသစ် တစ်ခု ထည့်ထားတယ် လို့ ပါပါတယ်။ package ဆိုတာ ကိုယ် မရေးဘဲ ယူသုံးတဲ့ တခြားသူ့ code ပါ။ AC
      တွေ pass ဖြစ်နေလို့ ဒီအတိုင်း ထားမလား၊ တကယ် လိုလား၊ တကယ် ရှိလား ဆိုတာ အရင် မေးမလား။ lesson ကို pause
      လုပ်ပြီး စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] အဖြေကတော့ အရင် မေးတာပါ။ ဘာကြောင့်လဲဆိုတော့ တကယ် လိုလား ဆိုတဲ့
      မေးခွန်းရဲ့ အဖြေက မလိုဘူး ဖြစ်နေလို့ပါ။ app က အခုလည်း စုစုပေါင်းကို ကော်မာ ပါတဲ့ ၃၀၀၀ ကျပ် လို့
      ပြနေပြီးသားပါ။ browser ထဲမှာ ဂဏန်းကို ဒီလို ပြပေးတဲ့ လုပ်ဆောင်ချက် ပါပြီးသား ဖြစ်လို့ပါ။ [[mark:quiz-real]]
      တကယ် ရှိလား ဆိုတဲ့ မေးခွန်းကလည်း အရေးကြီးပါတယ်။ AI model တွေက တကယ် မရှိတဲ့ package နာမည်တွေကို ယုံကြည်စရာ
      ကောင်းကောင်း ထုတ်ပေးတတ်ပါတယ်။ အဲဒီ နာမည်တွေနဲ့ အန္တရာယ် ရှိတဲ့ package တွေကို တမင် တင်ထားတဲ့ လူတွေလည်း
      ရှိနိုင်ပါတယ်။ ဒီလို လုပ်တာကို slopsquatting လို့ ခေါ်ပါတယ်။ ဒီ နာမည်ကလည်း တကယ် ရှိမှာ မသေချာပါဘူး။
      [[mark:quiz-check]] ဒါကြောင့် package တစ်ခု ထည့်ခါနီးရင် သူ့ စာမျက်နှာကို ဖွင့်ပြီး တကယ် ရှိလား၊
      ထိန်းနေတဲ့သူ ရှိလား၊ မကြာသေးခင်က update လုပ်ထားလား အရင် ကြည့်ပါ။
    sources:
      - {
          title: "MDN: Intl.NumberFormat (language-sensitive number formatting, built into browsers)",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Intl/NumberFormat",
        }
      - {
          title: "OWASP Top 10 for LLM Applications 2025: LLM09 Misinformation (non-existent libraries; attackers publish packages under hallucinated names)",
          url: "https://genai.owasp.org/llmrisk/llm092025-misinformation/",
        }
      - {
          title: "Socket: Slopsquatting (registering package names hallucinated by an LLM)",
          url: "https://socket.dev/blog/slopsquatting-how-ai-hallucinations-are-fueling-a-new-class-of-supply-chain-attacks",
        }
      - {
          title: "Spracklen et al.: We Have a Package for You! Package hallucinations by code-generating LLMs (USENIX Security 2025)",
          url: "https://arxiv.org/abs/2406.10279",
        }
      - {
          title: "OpenSSF: Concise Guide for Evaluating Open Source Software (can it be avoided; is it maintained; is it the authentic package)",
          url: "https://best.openssf.org/Concise-Guide-for-Evaluating-Open-Source-Software",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [z-title, z-q, z-o1, z-o2],
          drawMs: 1800,
        }
      - {
          id: draw-quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [z-a, z-a1],
          drawMs: 1200,
        }
      - {
          id: draw-quiz-real,
          type: whiteboard.apply,
          at: { mark: quiz-real },
          upsertIds: [z-a2],
          drawMs: 1000,
        }
      - {
          id: draw-quiz-check,
          type: whiteboard.apply,
          at: { mark: quiz-check },
          upsertIds: [z-a3],
          drawMs: 1000,
        }

  - id: package
    narration: >
      [[mark:close-quiz]] ဒီ မေးခွန်းက checklist ထဲမှာ မပါသေးပါဘူး။ [[mark:type-q-pkg]] ဒါကြောင့် ထိခဲ့တဲ့ file
      တွေကို မေးတဲ့ စာကြောင်းရဲ့ အောက်မှာ package အတွက် မေးခွန်း တစ်ကြောင်း ထပ်ဖြည့်ပါမယ်။ နောက် ပြောင်းလဲမှု
      တိုင်းမှာ မေ့မသွားတော့ပါဘူး။ [[mark:type-f-pkg]] review မှာတော့ ဒီ package ကို ဖယ်ခိုင်းမယ့် တွေ့ချက်ကို
      ဆုံးဖြတ်ချက်ရဲ့ အပေါ်မှာ ထည့်ပါမယ်။ ကျပ် ပမာဏကို ပြတဲ့ ပုံစံ ပြင်တာက ဒီ task မှာ မခိုင်းထားတဲ့ အလုပ်လည်း
      ဖြစ်ပါတယ်။ AGENTS.md ကလည်း package အသစ် မထည့်ခင် ကိုယ့်ကို အရင် မေးခိုင်းထားပေမဲ့၊ agent က မမေးဘဲ
      ထည့်သွားတာပါ။
    sources:
      - {
          title: "The New SDLC (Burmese edition): Where to start (check that imports are real packages)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "OpenSSF: Concise Guide for Evaluating Open Source Software",
          url: "https://best.openssf.org/Concise-Guide-for-Evaluating-Open-Source-Software",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: close-quiz }, open: false }
      - id: type-q-pkg
        type: editor.type
        at: { mark: type-q-pkg }
        target: { file: docs/review-checklist.md, after: "ကို ပြင်ခဲ့လား။\n", occurrence: 1 }
        text: "- package အသစ် ပါလား — တကယ် လိုလား၊ တကယ် ရှိလား၊ ထိန်းနေသူ ရှိလား။\n"
        cadence: line-by-line
      - id: type-f-pkg
        type: editor.type
        at: { mark: type-f-pkg }
        target:
          { file: docs/review-checklist.md, after: "- ❌ မလုပ်ခဲ့တာ စာရင်း မပါဘူး။\n", occurrence: 1 }
        text: "- ❌ kyat-format — မလိုဘူး၊ app က ကျပ်ကို ပြပြီးသား။ တကယ် ရှိမရှိလည်း မသေချာဘူး။\n"
        cadence: line-by-line
      - {
          id: expect-pkg,
          type: expect.file,
          at: { afterAction: type-f-pkg },
          path: docs/review-checklist.md,
          contains: "- ❌ kyat-format — မလိုဘူး",
        }

  - id: recap
    chapter: ပြန်ချုပ်ရရင်
    narration: >
      [[mark:r-q]] ဒါဆို ပြန်ချုပ်ရရင်၊ code ကို တစ်ကြောင်းချင်း မဖတ်နိုင်ရင်တောင် review လုပ်လို့ ရပါတယ်။
      ခိုင်းတာ၊ အရွယ်၊ ထိခဲ့တဲ့ file နဲ့ package အသစ်တွေကို checklist နဲ့ အရင် စစ်ပါ။ [[mark:r-spec]] agent က spec
      ဒါမှမဟုတ် test ကို ပြင်သွားတာ တွေ့ရင် ရပ်ပါ။ ကိုယ့် စံကို ရွှေ့လိုက်တာ ဖြစ်လို့ပါ။ [[mark:r-decision]]
      ရှင်းပြချက်နဲ့ မလုပ်ခဲ့တာ စာရင်းကို တောင်းပြီး၊ ဘယ်သူမှ ရှင်းမပြနိုင်တာကို merge မလုပ်ပါနဲ့။ နောက် lesson
      မှာတော့ တစ်ခုခု မှားနေတဲ့အခါ အကြောင်းရင်းကို ဘယ်လို ရှာမလဲ၊ debug လုပ်တာကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): Where to start",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "The New SDLC (Burmese edition): Conclusion (verification and judgment)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: r-q,
          type: editor.select,
          at: { mark: r-q },
          target: { file: docs/review-checklist.md, text: "## Questions", occurrence: 1 },
        }
      - {
          id: r-spec,
          type: editor.select,
          at: { mark: r-spec },
          target:
            {
              file: docs/review-checklist.md,
              text: "- ❌ AC-3 ကို ပြည့်အောင် မလုပ်ဘဲ spec.md ကို ပြင်သွားတယ်။",
              occurrence: 1,
            },
        }
      - {
          id: r-decision,
          type: editor.select,
          at: { mark: r-decision },
          target:
            {
              file: docs/review-checklist.md,
              text: "Decision — merge မလုပ်ဘူး။ ❌ တွေ ပြင်ဖို့ ပြန်ပို့မယ်၊ ပြီးရင် test plan ကို ပြန် run မယ်။",
              occurrence: 1,
            },
        }
checks:
  - { type: timing.p95Ms, max: 300 }
