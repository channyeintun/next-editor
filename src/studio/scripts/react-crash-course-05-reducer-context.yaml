  # ------------------------------------------------------------------ 8
  - id: context-rules
    chapter: "Context ရဲ့ စည်းကမ်းတွေ"
    narration: >
      [[mark:open-board-3]] မဆုံးခင် context ရဲ့ စည်းကမ်း လေးချက် ကြည့်ရအောင်။
      [[mark:draw-nested]] ပထမက၊ component က သူ့အပေါ်က အနီးဆုံး provider ကို ဖတ်လို့၊
      အတွင်းက provider က အပြင်ကဟာကို လွှမ်းမိုးပါတယ်။ [[mark:draw-default]] ဒုတိယက၊
      createContext ရဲ့ default တန်ဖိုးကို အပေါ်မှာ provider လုံးဝ မရှိမှပဲ သုံးပါတယ်။
      [[mark:draw-rerender]] တတိယက၊ provider ရဲ့ value ပြောင်းရင် အဲဒီ context ကို ဖတ်တဲ့
      component တိုင်း ပြန် render လုပ်ပါတယ်။ ဒါကြောင့် badge နဲ့ စာရင်း အတူတူ
      ပြောင်းသွားတာပါ။ [[mark:draw-removed]] နောက်ဆုံးက၊ အရင် React version တွေက
      contextTypes ဆိုတဲ့ context နည်းဟောင်းကို React 19 မှာ ဖယ်လိုက်ပြီး၊ အခုတော့
      createContext တစ်ခုတည်းပါပဲ။ [[mark:summary]] ဒါဆို ပြန်ချုပ်ရရင်၊ reducer က state
      ပြောင်းတဲ့ စည်းကမ်းတွေကို pure function တစ်ခုထဲ စုပြီး၊ component က action ပဲ
      ပို့ပါတယ်။ context ကတော့ အဲဒီ state နဲ့ dispatch ကို prop drilling မလုပ်ဘဲ အောက်က
      component တွေဆီ ပို့ပေးပါတယ်။ ဒီနှစ်ခုနဲ့ screen တစ်ခုလုံးကို React နဲ့ပဲ
      စီမံနိုင်ပါပြီ။ [[mark:next-lesson]] နောက် lesson မှာတော့ ref ကို ကြည့်သွားပါမယ်။
      ပြန် render မလုပ်ဘဲ တန်ဖိုး မှတ်သလို၊ DOM element ကိုပါ ကိုင်လို့ ရပါတယ်။
    sources:
      - { title: "useContext — React", url: "https://react.dev/reference/react/useContext" }
      - { title: "createContext — React", url: "https://react.dev/reference/react/createContext" }
      - {
          title: "React 19 Upgrade Guide — Removed: legacy context",
          url: "https://react.dev/blog/2024/04/25/react-19-upgrade-guide#removed-removing-legacy-context",
        }
      - {
          title: "Scaling Up with Reducer and Context — React",
          url: "https://react.dev/learn/scaling-up-with-reducer-and-context",
        }
