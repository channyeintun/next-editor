  # ------------------------------------------------------------------ 2
  - id: write-reducer
    chapter: "Reducer ကို ရေးကြည့်ရအောင်"
    narration: >
      [[mark:close-board-1]] ကဲ၊ ရေးရအောင်။ [[mark:open-reducer]] ဒီ ဖိုင်အသစ်က အလွတ်ပါ။
      ဘယ် ဖိုင်ကမှ import မလုပ်ရသေးလို့၊ run နေတဲ့ app ကို မထိပါဘူး။
      [[mark:type-signature]] reducer ဆိုတာ component အပြင်ဘက်က သာမန် function တစ်ခုပါ။
      လက်ရှိ order နဲ့ action ကို လက်ခံပါတယ်။ ပြီးတော့ action ရဲ့ type ကို switch နဲ့
      စစ်ပြီး၊ ဘာ ဖြစ်သွားလဲ ခွဲပါတယ်။ [[mark:type-added]] ပထမ case က added ပါ။ ဟင်းပွဲက
      order ထဲ ရှိပြီးသားဆိုရင် သူ့ အရေအတွက်ကိုပဲ တစ်ခု တိုးပေးပြီး၊ မရှိသေးရင်တော့
      နောက်ဆုံးမှာ ထည့်ပေးပါတယ်။ [[mark:select-spread]] ဒီ array အသစ် ဆောက်တဲ့ နေရာကို
      ကြည့်ပါ။ lesson 3 ကလိုပဲ အဟောင်းကို မပြင်ဘဲ အသစ် ဆောက်တာပါ။ [[mark:type-removed]]
      removed ကတော့ id တူတဲ့ တစ်ခုကလွဲပြီး ကျန်တာ အကုန် ချန်ထားပါတယ်။ အရေအတွက်
      ပြောင်းတာကလည်း ဒီလိုပဲ case တစ်ခု ထပ်ထည့်ရုံပါ။ [[mark:type-default]] မသိတဲ့ type
      ဆိုရင် error ပစ်ထားလို့၊ နာမည် မှားရိုက်မိရင် ချက်ချင်း သိရပါတယ်။
      [[mark:select-signature]] ဒီ function ကို ကြည့်ပါ။ အပြင်က ဘာကိုမှ မထိသလို၊ argument
      ကိုလည်း မပြင်ပါဘူး။ ဒါကြောင့် order တူ action တူရင် အဖြေ အမြဲ တူပါတယ်။ ဒါကို pure
      လို့ ခေါ်ပြီး၊ reducer တိုင်း pure ဖြစ်ရပါမယ်။ development မှာ StrictMode က reducer
      ကိုလည်း နှစ်ကြိမ် ခေါ်ကြည့်လို့၊ pure မဟုတ်ရင် ပြဿနာက စောစော ပေါ်လာပါတယ်။
    sources:
      - {
          title: "Extracting State Logic into a Reducer — React",
          url: "https://react.dev/learn/extracting-state-logic-into-a-reducer",
        }
      - { title: "useReducer — React", url: "https://react.dev/reference/react/useReducer" }
      - {
          title: "Updating Arrays in State — React",
          url: "https://react.dev/learn/updating-arrays-in-state",
        }
    actions:
      - id: close-board-1
        type: whiteboard.apply
        at: { mark: close-board-1 }
        open: false
      - id: collapse-dock
        type: runtime.collapseDock
        at: { afterAction: close-board-1 }
      - id: open-reducer
        type: workspace.openFile
        at: { mark: open-reducer }
        path: src/orderReducer.js
      - id: type-signature
        type: editor.type
        at: { mark: type-signature }
        cadence: fast-explainer
        target: { file: src/orderReducer.js, after: "", occurrence: 1 }
        text: "export function orderReducer(order, action) {\n  switch (action.type) {\n"
      - id: type-added
        type: editor.type
        at: { mark: type-added }
        cadence: line-by-line
        target: { file: src/orderReducer.js, after: "  switch (action.type) {\n", occurrence: 1 }
        text: |2
              case "added": {
                const old = order.find((item) => item.id === action.dish.id);
                if (old) {
                  return order.map((item) =>
                    item.id === old.id ? { ...item, count: item.count + 1 } : item,
                  );
                }
                return [...order, { ...action.dish, count: 1 }];
              }
      - id: select-spread
        type: editor.select
        at: { mark: select-spread }
        target:
          {
            file: src/orderReducer.js,
            text: "[...order, { ...action.dish, count: 1 }]",
            occurrence: 1,
          }
      - id: type-removed
        type: editor.type
        at: { mark: type-removed }
        cadence: line-by-line
        target:
          {
            file: src/orderReducer.js,
            after: "      return [...order, { ...action.dish, count: 1 }];\n    }\n",
            occurrence: 1,
          }
        text: |2
              case "removed": {
                return order.filter((item) => item.id !== action.id);
              }
      - id: type-default
        type: editor.type
        at: { mark: type-default }
        cadence: line-by-line
        target:
          {
            file: src/orderReducer.js,
            after: "      return order.filter((item) => item.id !== action.id);\n    }\n",
            occurrence: 1,
          }
        text: |2
              default: {
                throw Error("Unknown action: " + action.type);
              }
            }
          }
      - id: select-signature
        type: editor.select
        at: { mark: select-signature }
        target: { file: src/orderReducer.js, text: "orderReducer(order, action)", occurrence: 1 }
      - id: expect-reducer-file
        type: expect.file
        at: { afterAction: select-signature }
        path: src/orderReducer.js
        contains: "    case \"added\": {\n      const old = order.find((item) => item.id === action.dish.id);\n"

  # ------------------------------------------------------------------ 3
  - id: prop-drilling
    chapter: "Props ကို အဆင့်ဆင့် မပို့ချင်ရင်"
    narration: >
      [[mark:open-board-2]] နောက်မေးခွန်းက ဘယ် component တွေက order ကို ဖတ်ပြီး dispatch
      ခေါ်မလဲ ဆိုတာပါ။ [[mark:draw-ladder]] menu က tree တစ်ခုလိုပါ။ App က MenuList ကို၊
      MenuList က ဟင်းပွဲ တစ်ပွဲစီအတွက် DishCard ကို render လုပ်ပြီး၊ card ထဲမှာ မှာမယ့်
      ခလုတ် ထည့်မှာပါ။ [[mark:draw-drilling]] props နဲ့ပဲ ပို့ရင် dispatch ကို အဆင့်ဆင့်
      လက်ဆင့်ကမ်းရပါတယ်။ ကိုယ်တိုင် မသုံးတဲ့ MenuList နဲ့ DishCard ကပါ ကြားခံ
      ပို့ပေးရပါတယ်။ ဒါကို prop drilling လို့ ခေါ်ပါတယ်။ [[mark:draw-pipe]] context ကတော့
      အပေါ်က component က တန်ဖိုး တစ်ခု ထည့်ထားရင်၊ အောက်က component တွေ ဘယ်လောက် နက်နက်
      ရှိရှိ တိုက်ရိုက် ဖတ်လို့ ရတဲ့ နည်းပါ။ အဲဒီလို တန်ဖိုး ထည့်ပေးတဲ့ အပေါ်က component
      ကို provider လို့ ခေါ်ပါတယ်။ [[mark:draw-pipe-label]] အလယ်က component တွေ သိစရာတောင်
      မလိုပါဘူး။ ကိုယ့် app မှာ context နှစ်ခု လုပ်ပါမယ်။ order အတွက် တစ်ခု၊ dispatch
      အတွက် တစ်ခုပါ။ dispatch က ဘယ်တော့မှ မပြောင်းလို့၊ action ပဲ ပို့တဲ့ ခလုတ်လို
      component တွေက order ကို လိုက်ကြည့်စရာ မလိုအောင်ပါ။
    sources:
      - {
          title: "Passing Data Deeply with Context — React",
          url: "https://react.dev/learn/passing-data-deeply-with-context",
        }
      - {
          title: "Scaling Up with Reducer and Context — React",
          url: "https://react.dev/learn/scaling-up-with-reducer-and-context",
        }
    actions:
      - id: open-board-2
        type: whiteboard.apply
        at: { mark: open-board-2 }
        open: true
        clear: true
        upsertIds: [b2-title]
        drawMs: 900
      - id: draw-ladder
        type: whiteboard.apply
        at: { mark: draw-ladder }
        upsertIds:
          [
            b2-app,
            b2-app-t,
            b2-menulist,
            b2-menulist-t,
            b2-dishcard,
            b2-dishcard-t,
            b2-addbutton,
            b2-addbutton-t,
          ]
        drawMs: 2400
      - id: draw-drilling
        type: whiteboard.apply
        at: { mark: draw-drilling }
        upsertIds: [b2-drill-1, b2-drill-2, b2-drill-3, b2-drill-label]
        drawMs: 2000
      - id: draw-pipe
        type: whiteboard.apply
        at: { mark: draw-pipe }
        upsertIds: [b2-pipe-top, b2-pipe, b2-pipe-arrow]
        drawMs: 1500
      - id: draw-pipe-label
        type: whiteboard.apply
        at: { mark: draw-pipe-label }
        upsertIds: [b2-pipe-label]
        drawMs: 1200

  # ------------------------------------------------------------------ 4
  - id: write-provider
    narration: >
      [[mark:close-board-2]] context တွေကို သီးသန့် ဖိုင်နဲ့ ရေးရအောင်။
      [[mark:open-context]] ဒါလည်း ခုနကလိုပဲ ဖိုင်အလွတ်ပါ။ [[mark:type-context-imports]]
      React ဆီက createContext နဲ့ useReducer၊ ခုနက reducer ကိုပါ import လုပ်ပါတယ်။
      [[mark:type-create-context]] အခု context နှစ်ခုကို createContext နဲ့ component
      အပြင်ဘက်မှာ တစ်ခါတည်း လုပ်ထားပါတယ်။ argument က default တန်ဖိုးပါ။ order အတွက် စာရင်း
      အလွတ်၊ dispatch အတွက်တော့ null ပါ။ ဒီ default ကို ရတာက အပေါ်မှာ provider လုံးဝ
      မရှိမှပါ။ [[mark:type-provider]] OrderProvider ကတော့ order ကို ပိုင်တဲ့ component
      ပါ။ useReducer နဲ့ order ကို မှတ်ထားပြီး၊ သူ့ children ကို provider နှစ်ခုနဲ့
      ထုပ်ပေးပါတယ်။ [[mark:select-use-reducer]] ဒီ useReducer က reducer ကို React state
      နဲ့ ချိတ်ပေးပြီး၊ လက်ရှိ order နဲ့ dispatch၊ နှစ်ခုကို ပြန်ပေးပါတယ်။
      [[mark:select-provider]] ဒီ provider က အောက်က component တွေကို တန်ဖိုး ပေးတာပါ။
      React 19 မှာ context ကိုယ်တိုင်ကို render လုပ်ပြီး value ပေးရုံပါ။ context နောက်မှာ
      Provider ဆက်ရေးတဲ့ ပုံစံအဟောင်းလည်း ရပါသေးတယ်။ [[mark:select-children]] အလယ်မှာ
      children ကို render လုပ်ထားလို့၊ OrderProvider နဲ့ ထုပ်ထားတဲ့ component တိုင်း
      တန်ဖိုး နှစ်ခုလုံး ဖတ်လို့ ရပါတယ်။ ဒါကို ကိုယ်တိုင် ရေးတဲ့ custom hook နဲ့
      ဖတ်တာကတော့ lesson 7 မှာပါ။
    sources:
      - { title: "createContext — React", url: "https://react.dev/reference/react/createContext" }
      - {
          title: "React v19 — <Context> as a provider",
          url: "https://react.dev/blog/2024/12/05/react-19#context-as-a-provider",
        }
      - {
          title: "Scaling Up with Reducer and Context — React",
          url: "https://react.dev/learn/scaling-up-with-reducer-and-context",
        }
      - { title: "useReducer — React", url: "https://react.dev/reference/react/useReducer" }
    actions:
      - id: close-board-2
        type: whiteboard.apply
        at: { mark: close-board-2 }
        open: false
      - id: open-context
        type: workspace.openFile
        at: { mark: open-context }
        path: src/OrderContext.jsx
      - id: type-context-imports
        type: editor.type
        at: { mark: type-context-imports }
        cadence: line-by-line
        target: { file: src/OrderContext.jsx, after: "", occurrence: 1 }
        text: |+
          import { createContext, useReducer } from "react";
          import { orderReducer } from "./orderReducer.js";

      - id: type-create-context
        type: editor.type
        at: { mark: type-create-context }
        cadence: fast-explainer
        target:
          {
            file: src/OrderContext.jsx,
            after: "import { orderReducer } from \"./orderReducer.js\";\n\n",
            occurrence: 1,
          }
        text: |
          export const OrderContext = createContext([]);
          export const OrderDispatchContext = createContext(null);
      - id: type-provider
        type: editor.type
        at: { mark: type-provider }
        cadence: line-by-line
        target:
          {
            file: src/OrderContext.jsx,
            after: "export const OrderDispatchContext = createContext(null);\n",
            occurrence: 1,
          }
        text: "\nexport function OrderProvider({ children }) {\n  const [order, dispatch] = useReducer(orderReducer, []);\n  return (\n    <OrderContext value={order}>\n      <OrderDispatchContext value={dispatch}>\n        {children}\n      </OrderDispatchContext>\n    </OrderContext>\n  );\n}\n"
      - id: select-use-reducer
        type: editor.select
        at: { mark: select-use-reducer }
        target: { file: src/OrderContext.jsx, text: "useReducer(orderReducer, [])", occurrence: 1 }
      - id: select-provider
        type: editor.select
        at: { mark: select-provider }
        target: { file: src/OrderContext.jsx, text: "<OrderContext value={order}>", occurrence: 1 }
      - id: select-children
        type: editor.select
        at: { mark: select-children }
        target: { file: src/OrderContext.jsx, text: "{children}", occurrence: 1 }
      - id: expect-context-file
        type: expect.file
        at: { afterAction: select-children }
        path: src/OrderContext.jsx
        contains: "    <OrderContext value={order}>\n      <OrderDispatchContext value={dispatch}>\n"

  # ------------------------------------------------------------------ 5
  - id: read-context
    chapter: "Context ကို ဖတ်ကြည့်ရအောင်"
    narration: >
      [[mark:open-addbutton]] နောက်တစ်ဆင့်က မှာမယ့် ခလုတ်ပါ။ [[mark:type-addbutton]] ဒီ
      ခလုတ်က ဟင်းပွဲကိုတော့ သာမန် prop အနေနဲ့ ရပါတယ်၊ card ရဲ့ ကိုယ်ပိုင် data ဖြစ်လို့ပါ။
      ဟင်းပွဲ ကုန်နေရင် ခလုတ်ကို disabled လုပ်ထားပြီး၊ နှိပ်လိုက်ရင်တော့ reducer ဆီ action
      တစ်ခု ပို့ပါတယ်။ [[mark:select-usecontext]] dispatch ကတော့ ဒီ useContext ကနေ ရတာပါ။
      သူက အပေါ်က အနီးဆုံး provider ကို ရှာပြီး တန်ဖိုး ပြန်ပေးလို့၊ props တစ်ခုမှ
      မလိုပါဘူး။ [[mark:select-dispatch-call]] နှိပ်ရင် ဟင်းပွဲ ပါတဲ့ added action ကို
      dispatch လုပ်ပါတယ်။ order ထဲ ဘယ်လို ထည့်မလဲ ဆိုတာက reducer ရဲ့ အလုပ်ပါ။
      [[mark:open-badge]] နောက်တစ်ခုက order ထဲက ဟင်းပွဲ အရေအတွက် ပြမယ့် badge ပါ။
      [[mark:type-badge]] ဒီမှာလည်း order ကို useContext နဲ့ အတူတူ ဖတ်ပြီး၊ item တိုင်းရဲ့
      အရေအတွက်ကို ပေါင်းပါတယ်။ မုန့်ဟင်းခါး နှစ်ပွဲနဲ့ ရှမ်းခေါက်ဆွဲ တစ်ပွဲ ဆိုရင် 3 လို့
      ပြပါမယ်။ [[mark:select-badge-context]] ဒီ useContext ကတော့ order context ကို
      ဖတ်တာပါ။ [[mark:open-dishcard]] ကဲ၊ ခလုတ်ကို card တစ်ခုစီထဲ ထည့်ရအောင်။
      [[mark:type-dishcard-import]] အရင်ဆုံး အပေါ်ဆုံးမှာ import လုပ်ပါတယ်။ ဒါမှ card က
      ခလုတ်အသစ်ကို သုံးလို့ ရပါမယ်။ [[mark:type-dishcard-usage]] ပြီးတော့ card ထဲမှာ
      ခလုတ်ကို ထည့်ပြီး၊ ဟင်းပွဲကို prop အနေနဲ့ ပေးလိုက်ပါတယ်။
      [[mark:select-dishcard-props]] ဒီ parameter ကို ကြည့်ပါ။ card က ဟင်းပွဲပဲ ရပါတယ်။
      order မပါ၊ dispatch မပါ၊ MenuList ကိုလည်း ပြင်စရာ မလိုပါဘူး။
    sources:
      - { title: "useContext — React", url: "https://react.dev/reference/react/useContext" }
      - {
          title: "Scaling Up with Reducer and Context — React",
          url: "https://react.dev/learn/scaling-up-with-reducer-and-context",
        }
    actions:
      - id: open-addbutton
        type: workspace.openFile
        at: { mark: open-addbutton }
        path: src/AddButton.jsx
      - id: type-addbutton
        type: editor.type
        at: { mark: type-addbutton }
        cadence: line-by-line
        target: { file: src/AddButton.jsx, after: "", occurrence: 1 }
        text: |
          import { useContext } from "react";
          import { OrderDispatchContext } from "./OrderContext.jsx";

          export default function AddButton({ dish }) {
            const dispatch = useContext(OrderDispatchContext);
            return (
              <button
                data-testid={`add-${dish.id}`}
                disabled={dish.soldOut}
                onClick={() => dispatch({ type: "added", dish })}
              >
                မှာမယ်
              </button>
            );
          }
      - id: select-usecontext
        type: editor.select
        at: { mark: select-usecontext }
        target: { file: src/AddButton.jsx, text: "useContext(OrderDispatchContext)", occurrence: 1 }
      - id: select-dispatch-call
        type: editor.select
        at: { mark: select-dispatch-call }
        target:
          { file: src/AddButton.jsx, text: 'dispatch({ type: "added", dish })', occurrence: 1 }
      - id: open-badge
        type: workspace.openFile
        at: { mark: open-badge }
        path: src/OrderBadge.jsx
      - id: type-badge
        type: editor.type
        at: { mark: type-badge }
        cadence: line-by-line
        target: { file: src/OrderBadge.jsx, after: "", occurrence: 1 }
        text: |
          import { useContext } from "react";
          import { OrderContext } from "./OrderContext.jsx";

          export default function OrderBadge() {
            const order = useContext(OrderContext);
            const count = order.reduce((sum, item) => sum + item.count, 0);
            return (
              <span className="badge" data-testid="order-badge">
                {count} ပွဲ
              </span>
            );
          }
      - id: select-badge-context
        type: editor.select
        at: { mark: select-badge-context }
        target: { file: src/OrderBadge.jsx, text: "useContext(OrderContext)", occurrence: 1 }
      - id: open-dishcard
        type: workspace.openFile
        at: { mark: open-dishcard }
        path: src/DishCard.jsx
      - id: type-dishcard-import
        type: editor.type
        at: { mark: type-dishcard-import }
        cadence: fast-explainer
        target: { file: src/DishCard.jsx, after: "", occurrence: 1 }
        text: |+
          import AddButton from "./AddButton.jsx";

      - id: type-dishcard-usage
        type: editor.type
        at: { mark: type-dishcard-usage }
        cadence: fast-explainer
        target:
          {
            file: src/DishCard.jsx,
            after: "        <p className=\"muted\">{dish.price.toLocaleString(\"en-US\")} ကျပ်</p>\n      </div>\n",
            occurrence: 1,
          }
        text: "      <AddButton dish={dish} />\n"
      - id: select-dishcard-props
        type: editor.select
        at: { mark: select-dishcard-props }
        target: { file: src/DishCard.jsx, text: "DishCard({ dish })", occurrence: 1 }
      - id: expect-dishcard-file
        type: expect.file
        at: { afterAction: select-dishcard-props }
        path: src/DishCard.jsx
        contains: "      </div>\n      <AddButton dish={dish} />\n    </article>"

  # ------------------------------------------------------------------ 6
  - id: summary-with-use
    chapter: "Early return နောက်မှာ use နဲ့ ဖတ်ကြည့်ရအောင်"
    narration: >
      [[mark:open-summary]] နောက်ထပ် view တစ်ခုက ဖွင့်ထားမှ ပေါ်မယ့် မှာထားတဲ့ စာရင်းပါ။
      [[mark:type-summary-top]] use နဲ့ context နှစ်ခုကို import လုပ်ပြီး၊ open prop
      ယူပါတယ်။ [[mark:type-early-return]] open မဟုတ်ရင် ဘာမှ မပြဘဲ ချက်ချင်း
      ထွက်သွားပါတယ်။ အဲဒီ early return ရဲ့ နောက်မှ order ကို context ကနေ ဖတ်ပါတယ်။ ဒီ
      နှစ်ကြောင်းက အရေးကြီးပါတယ်။ [[mark:select-use]] ဒီမှာ ဖတ်တာက useContext မဟုတ်ဘဲ use
      ပါ။ useContext က hook ဖြစ်လို့၊ early return မရောက်ခင် အပေါ်ဆုံး အဆင့်မှာပဲ
      ခေါ်ရပါတယ်။ [[mark:use-explained]] use ကတော့ hook တွေရဲ့ ဒီ စည်းကမ်း မပါတဲ့ React
      ရဲ့ API ပါ။ early return နောက်မှာရော if ထဲမှာပါ ခေါ်လို့ ရပါတယ်။ ဒါပေမဲ့ render
      နေချိန်မှာပဲ ခေါ်ရပြီး၊ event handler ထဲမှာတော့ မရပါဘူး။ [[mark:type-summary-calc]]
      dispatch ကိုလည်း အတူတူပဲ ဖတ်ပြီး၊ စုစုပေါင်း ကျသင့်ငွေ တွက်ပါတယ်။
      [[mark:type-summary-markup]] JSX ကတော့ ဟင်းပွဲ တစ်ပွဲစီကို ဖယ်မယ့် ခလုတ်နဲ့
      တွဲပြပြီး၊ အောက်ဆုံးမှာ စုစုပေါင်း ပြပါတယ်။ [[mark:select-remove]] ဖယ်မယ့် ခလုတ်က
      ဟင်းပွဲ id ပါတဲ့ removed action ကို အဲဒီ reducer ဆီပဲ dispatch လုပ်ပါတယ်။
      [[mark:select-key]] row တိုင်းမှာ key အနေနဲ့ ဟင်းပွဲ id ထည့်ထားတာ lesson 2 ကလိုပါပဲ။
    sources:
      - { title: "use — React", url: "https://react.dev/reference/react/use" }
      - { title: "Rules of Hooks — React", url: "https://react.dev/reference/rules/rules-of-hooks" }
      - { title: "useContext — React", url: "https://react.dev/reference/react/useContext" }
    actions:
      - id: open-summary
