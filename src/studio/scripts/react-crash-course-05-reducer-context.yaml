        at: { mark: open-summary }
        path: src/OrderSummary.jsx
      - id: type-summary-top
        type: editor.type
        at: { mark: type-summary-top }
        cadence: line-by-line
        target: { file: src/OrderSummary.jsx, after: "", occurrence: 1 }
        text: |
          import { use } from "react";
          import { OrderContext, OrderDispatchContext } from "./OrderContext.jsx";

          export default function OrderSummary({ open }) {
      - id: type-early-return
        type: editor.type
        at: { mark: type-early-return }
        cadence: fast-explainer
        target:
          {
            file: src/OrderSummary.jsx,
            after: "export default function OrderSummary({ open }) {\n",
            occurrence: 1,
          }
        text: |2
            if (!open) return null;
            const order = use(OrderContext);
      - id: select-use
        type: editor.select
        at: { mark: select-use }
        target: { file: src/OrderSummary.jsx, text: "use(OrderContext)", occurrence: 1 }
      - id: type-summary-calc
        type: editor.type
