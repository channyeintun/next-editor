  # ------------------------------------------------------------------ 7
  - id: wire-app
    chapter: "App ထဲမှာ ချိတ်ပြီး စမ်းကြည့်ရအောင်"
    narration: >
      [[mark:open-app]] ကဲ၊ အကုန်လုံးကို App ထဲ ချိတ်ရအောင်။ App က အခုထိ Header ပဲ render
      လုပ်နေပါသေးတယ်။ [[mark:open-preview]] dev server က အစကတည်းက run နေပြီးသားမို့၊
      preview ကို ဖွင့်လိုက်ရအောင်။ [[mark:add-imports]] အရင်ဆုံး import တွေပါ။ ခုနက
      ရေးခဲ့တဲ့ ဖိုင်တွေ၊ menu data နဲ့ ပြီးခဲ့တဲ့ lesson က MenuList ကို ယူထားတာပါ။
      [[mark:add-state]] ပြီးတော့ စာရင်းကို ဖွင့်ထားလား ဆိုတဲ့ သာမန် state တစ်ခုပါ။ App
      ကပဲ သုံးမှာ ဖြစ်လို့၊ ရိုးရိုး useState နဲ့ လုံလောက်ပါတယ်။ [[mark:fill-slot]] အခု
      အဓိက အပိုင်းကို တစ်ခါတည်း ထည့်ပါမယ်။ OrderProvider က badge၊ ဖွင့်ပိတ် ခလုတ်၊
      စာရင်းနဲ့ menu ကို ထုပ်ထားပါတယ်။ [[mark:menu-back]] preview ပြန်ပွင့်လာတော့ card
      တိုင်းမှာ မှာမယ့် ခလုတ် ပါလာပါပြီ။ badge ကတော့ 0 ပြနေပါတယ်။ [[mark:click-add-1]]
      မုန့်ဟင်းခါး တစ်ပွဲ မှာကြည့်ရအောင်။ ခလုတ်က သုံးဆင့် အောက်မှာ ရှိပေမယ့်၊ props
      မဖြတ်ဘဲ action က reducer ဆီ တန်းရောက်သွားပါတယ်။ [[mark:after-add-1]] badge က 1
      ဖြစ်သွားပါပြီ။ [[mark:click-add-2]] မုန့်ဟင်းခါး ထပ်မှာ၊ [[mark:click-add-3]]
      ရှမ်းခေါက်ဆွဲ တစ်ပွဲပါ။ [[mark:after-add-3]] badge က 3 ပါ။ item တိုင်းရဲ့
      အရေအတွက်ကို ပေါင်းပြထားလို့ပါ။ [[mark:click-toggle]] စာရင်းကို ဖွင့်ကြည့်ရအောင်။
      [[mark:after-toggle]] မုန့်ဟင်းခါးက row နှစ်ကြောင်း မဟုတ်ဘဲ၊ နှစ်ပွဲ ဆိုတဲ့ row
      တစ်ကြောင်းတည်းပါ။ reducer က အရေအတွက်ကိုပဲ တိုးလိုက်လို့ပါ။ ရှမ်းခေါက်ဆွဲ တစ်ပွဲနဲ့
      စုစုပေါင်း 8000 ကျပ်ပါ။ [[mark:click-remove]] မုန့်ဟင်းခါးကို ဖယ်ကြည့်ရအောင်။
      [[mark:after-remove]] row ပျောက်သွားပြီး၊ စုစုပေါင်း 3000 ကျပ်၊ badge ကလည်း 1
      ဖြစ်သွားပါပြီ။
    sources:
