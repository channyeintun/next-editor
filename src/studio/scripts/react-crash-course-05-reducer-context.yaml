build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 5205

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  # ------------------------------------------------------------------ 1
  - id: why-reducer
    chapter: "Reducer ဘာကြောင့် လိုလဲ"
    narration: >
      ဒီ lesson မှာ order ပြောင်းတဲ့ logic တွေကို reducer ဆိုတဲ့ function တစ်ခုထဲ စုပြီး၊
      context နဲ့ ဘယ် component ကမဆို ယူသုံးနိုင်အောင် လုပ်သွားပါမယ်။ [[mark:draw-before]]
      lesson 3 မှာ App က order ကို state နဲ့ မှတ်ထားပြီး၊ ဟင်းပွဲ ထည့်တာ၊ ဖယ်တာ၊ အရေအတွက်
      ပြောင်းတာ ဆိုပြီး handler သုံးခုက ပြောင်းပေးခဲ့ပါတယ်။ [[mark:mark-scattered]]
      handler တစ်ခုစီက array အသစ်ကို သူ့ဘာသာသူ ဆောက်ရပါတယ်။ app ကြီးလာရင် ဒီ code တွေ
      component အနှံ့ ပြန့်သွားပြီး၊ order ဘယ်လို ပြောင်းနိုင်လဲ ဆိုတာ ခြုံပြီး
      မမြင်ရတော့ပါဘူး။ [[mark:start-server]] ဒီကြားထဲမှာ dev server ကို နောက်ကွယ်ကနေ စ run
      ထားရအောင်။ [[mark:draw-action]] reducer နည်းမှာတော့ component က ဘာ ဖြစ်သွားလဲ
      ဆိုတာကိုပဲ action ဆိုတဲ့ object လေးနဲ့ ဖော်ပြပါတယ်။ ဟင်းပွဲ ထည့်ပြီ ဆိုတဲ့
      မှာစာလိုပါပဲ၊ ဘယ်လို ပြင်ရမလဲ မပါပါဘူး။ [[mark:draw-dispatch]] အဲဒီ မှာစာကို reducer
      ဆီ ပို့ပေးတာက dispatch ဆိုတဲ့ function ပါ။ [[mark:draw-reducer]] reducer ကတော့
      ငွေကိုင်နဲ့ တူပါတယ်။ လက်ရှိ order နဲ့ မှာစာကို ယူပြီး၊ အဟောင်းကို မပြင်ဘဲ order အသစ်
      ပြန်ပေးပါတယ်။ [[mark:draw-state]] အဲဒါကို React က state အသစ်အဖြစ် သိမ်းပြီး ပြန်
      render လုပ်ပါတယ်။
    sources:
      - { title: "useReducer — React", url: "https://react.dev/reference/react/useReducer" }
      - {
          title: "Extracting State Logic into a Reducer — React",
          url: "https://react.dev/learn/extracting-state-logic-into-a-reducer",
        }
    actions:
      - id: open-board-1
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: []
      - id: draw-b1-title
        type: whiteboard.apply
        at: { scene: start }
        upsertIds: [b1-title]
        drawMs: 900
      - id: draw-before
