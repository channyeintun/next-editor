# React crash course, lesson 5 — useReducer and Context (Burmese, my-MM).
#
# Story: the order logic from lesson 3 (three handlers in App) moves into one
# pure reducer; then the order and dispatch are shared through two contexts,
# so an add button three levels down, a badge and an order summary all read
# one order without prop drilling. OrderSummary reads context with use()
# after an early return (React 19); the provider is rendered as <Context
# value> (React 19).
#
# Insert-only plan: every new module (orderReducer.js, OrderContext.jsx,
# AddButton.jsx, OrderBadge.jsx, OrderSummary.jsx) is pinned EMPTY and typed
# while nothing imports it; DishCard.jsx and MenuList.jsx are pinned but not
# imported until the last scene, so DishCard can take keystrokes too. App.jsx
# (live) only gets three `block` inserts: the imports, one state line, then
# one JSX block that renders everything already wrapped in <OrderProvider>.
# Each App edit reloads the preview, so every click comes after the last edit.
#
# The dev server starts during the first board (install + boot take time) and
# is waited on only when the preview opens, several minutes later.
#
# Narration is the edited Burmese voice script (voice-script.md next to this
# file, brief in DESIGN.md); every visible string (title, chapters, board
# labels, UI) is Burmese too.
