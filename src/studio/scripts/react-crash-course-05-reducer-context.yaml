        at: { mark: draw-before }
        upsertIds: [b1-app-box, b1-app-name, b1-handler-1, b1-handler-2, b1-handler-3]
        drawMs: 2000
      - id: mark-scattered
        type: whiteboard.apply
        at: { mark: mark-scattered }
        upsertIds: [b1-scattered]
        drawMs: 1200
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 45000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-action
        type: whiteboard.apply
        at: { mark: draw-action }
