scenes:
  - id: open
    chapter: "Test တွေ ဘယ်မှာ run လဲ"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ အဖွဲ့ထဲက ကွန်ပျူတာတိုင်းနဲ့ CI မှာ test တွေကို တစ်ပုံစံတည်း run
      စေမယ့် config ဖိုင်ကို ပြင်ဆင်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ test တွေကို pull request တိုင်းမှာ အလိုလို
      run ပေးမယ့် workflow ကို ရေးကြည့်ပြီး၊ CI ထဲမှာ Vitest ဘယ်လို အလုပ်လုပ်လဲ ကြည့်ပါမယ်။
      [[mark:draw-local]] test တွေကို နေရာ လေးခုမှာ run လေ့ ရှိပါတယ်။ ပထမ နေရာက ကိုယ့် ကွန်ပျူတာပါ။ code
      ရေးနေတုန်း watch mode က ဆိုင်ရာ test တွေကို ချက်ချင်း ပြန် run ပေးပေမဲ့၊ ကိုယ့် ကွန်ပျူတာမှာ pass
      ဖြစ်တာကို တခြားသူတွေက မမြင်ရပါဘူး။ [[mark:draw-pr]] ဒါကြောင့် ဒုတိယ နေရာအနေနဲ့၊ ကိုယ့်
      ပြောင်းလဲမှုကို main branch ထဲ ပေါင်းဖို့ pull request ဖွင့်လိုက်တာနဲ့ server ပေါ်မှာ test တွေ
      အလိုလို run ပါတယ်။ ဒါကို pull request check လို့ ခေါ်ပြီး၊ check pass မှ merge လုပ်ကြလို့ ကျနေတဲ့
      code က main ထဲ မရောက်တော့ပါဘူး။ [[mark:draw-main]] တတိယ နေရာက merge လုပ်ပြီးတိုင်း main
      branch ပေါ်မှာ ထပ် run တာပါ။ နောက်ဆုံး နေရာကတော့ end to end test လို ကြာတဲ့ test တွေကို pull request
      တိုင်းမှာ မ run ဘဲ၊ ညတိုင်း တစ်ခါ run တာပါ။ [[mark:draw-ci]] ဒီလို server ပေါ်မှာ test တွေကို
      အလိုလို run ပေးတဲ့ စနစ်က course တစ်လျှောက် ပြောခဲ့တဲ့ CI ပါ။ နာမည် အပြည့်က continuous integration ပါ။
    sources:
      - {
          title: "web.dev Learn Testing: Where tests run, manual test invocation",
          url: "https://web.dev/learn/testing/get-started/where-tests-run#manual_test_invocation",
        }
      - {
          title: "web.dev Learn Testing: Run tests as part of presubmit or review",
          url: "https://web.dev/learn/testing/get-started/where-tests-run#presubmit-review",
        }
      - {
          title: "web.dev Learn Testing: Run tests as part of Continuous Integration",
          url: "https://web.dev/learn/testing/get-started/where-tests-run#continuous-integration",
        }
      - { title: "Vitest: watch (facts A03)", url: "https://vitest.dev/config/watch" }
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 300000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-local
        type: whiteboard.apply
        at: { mark: draw-local }
        upsertIds: [a-local-box, a-local]
        drawMs: 1800
      - id: draw-pr
        type: whiteboard.apply
        at: { mark: draw-pr }
        upsertIds: [a-arrow-1, a-pr-box, a-pr]
        drawMs: 2000
      - id: draw-main
        type: whiteboard.apply
        at: { mark: draw-main }
        upsertIds: [a-arrow-2, a-main-box, a-main, a-arrow-3, a-night-box, a-night]
        drawMs: 4000
      - id: draw-ci
        type: whiteboard.apply
        at: { mark: draw-ci }
        upsertIds: [a-ci]
        drawMs: 1500

  - id: starter
    narration: >
      ဆိုင်ရဲ့ project ကို ကြည့်ရအောင်။ ဒါက package json ဖိုင်ပါ။ [[mark:select-script]] course
      အစပိုင်းမှာ ကြည့်ခဲ့တဲ့ test script ပါ။ npm test က ဒီ script ကို run ပြီး၊ CI ကလည်း ဒီ command ကိုပဲ
      သုံးပါမယ်။ [[mark:open-workflow]]
      ဒါကတော့ GitHub Actions ရဲ့ workflow ဖိုင်ပါ။ GitHub က project ထဲက workflows folder ထဲမှာ ရှိတဲ့ YAML
      ဖိုင်တွေကို ဖတ်ပြီး၊ ရေးထားတဲ့ အလုပ်တွေကို သူ့ server ပေါ်မှာ run ပေးပါတယ်။ [[mark:select-on]] ဒီ
      အပိုင်းက workflow ကို pull request တိုင်းမှာ run ဖို့နဲ့၊ main branch ကို push လုပ်တိုင်း run ဖို့
      ပြောထားပါတယ်။ ဒါပေမဲ့ ဘာ run ရမလဲ ဆိုတဲ့ job တစ်ခုမှ မရှိသေးပါဘူး။ [[mark:open-test]] test
      ဖိုင်ကိုလည်း ကြည့်ရအောင်။ [[mark:select-only]] ခွက်ကြီး ယူရင် ၅၀၀ ကျပ် ပိုယူရမယ် ဆိုတဲ့ test မှာ
      only ပါနေပါတယ်။ လှလှက ဒီ test ကို ပြင်နေတုန်း ထည့်ထားပြီး၊ ပြန်မဖြုတ်ဘဲ commit လုပ်ခဲ့တယ် ဆိုပါစို့။
    sources:
      - {
          title: "web.dev Learn Testing: Prerequisite script",
          url: "https://web.dev/learn/testing/get-started/where-tests-run#prereq-script",
        }
      - {
          title: "GitHub starter workflows: Node.js CI (facts B13)",
          url: "https://github.com/actions/starter-workflows/blob/main/ci/node.js.yml",
        }
      - {
          title: "Vitest: Test Filtering, focusing on specific tests with .only",
          url: "https://vitest.dev/guide/filtering#focusing-on-specific-tests-with-only",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: select-script
        type: editor.select
        at: { mark: select-script }
        target: { file: package.json, text: '"test": "vitest"', occurrence: 1 }
      - id: open-workflow
        type: workspace.openFile
        at: { mark: open-workflow }
        path: .github/workflows/test.yml
      - id: select-on
        type: editor.select
        at: { mark: select-on }
        target:
          {
            file: .github/workflows/test.yml,
            text: "on:\n  pull_request:\n  push:\n    branches: [main]",
            occurrence: 1,
          }
      - id: open-test
        type: workspace.openFile
        at: { mark: open-test }
        path: src/order.test.js
      - id: select-only
        type: editor.select
        at: { mark: select-only }
        target:
          {
            file: src/order.test.js,
            text: 'test.only("adds the large cup fee", () => {',
            occurrence: 1,
          }

  - id: panel
    narration: >
      [[mark:ready]] Vitest က ဒီ test တွေကို run လိုက်တော့ ဘာ ပြလဲ ကြည့်ရအောင်။ ညာဘက်က panel ကလည်း code
      ပြောင်းတိုင်း ပြန် run တဲ့ တကယ့် Vitest ရဲ့ ရလဒ်ပါ။ [[mark:read-skipped]] အပေါ်မှာ အစိမ်းရောင် PASS
      ပြနေပေမဲ့၊ test စာရင်းကို ကြည့်ပါ။ test လေးခုထဲက ခွက်ကြီး test တစ်ခုပဲ အမှန်ခြစ် ရပြီး၊ ကျန်တဲ့
      သုံးခုရှေ့မှာ အောက်ကို ညွှန်တဲ့ မြှားလေးတွေ ပါနေပါတယ်။ summary မှာလည်း ၁ ခု pass နဲ့ ၃ ခု skipped
      လို့ ပြနေပါတယ်။ ဒီ PASS က test တစ်ခုတည်းရဲ့ PASS ဖြစ်ပြီး၊ ဘယ်သူ့ ကွန်ပျူတာမှာ run တဲ့အခါမှာမဆို
      ကျန်တဲ့ test သုံးခုကို ကျော်သွားမှာပါ။
    sources:
      - {
          title: "Vitest: Test Filtering, focusing on specific tests with .only",
          url: "https://vitest.dev/guide/filtering#focusing-on-specific-tests-with-only",
        }
      - { title: "Vitest: test.only", url: "https://vitest.dev/api/test#test-only" }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-start-pass
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1000 }
      - id: expect-start-skipped
        type: expect.preview
        at: { afterAction: expect-start-pass }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-skipped, value: "3" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-only
        type: expect.preview
        at: { afterAction: expect-start-skipped }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-2 }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: workflow
    chapter: "Workflow ကို ရေးရအောင်"
    narration: >
      [[mark:open-workflow-2]] ကဲ၊ workflow ထဲမှာ test တွေ run မယ့် job ကို ရေးကြည့်ရအောင်။ ဒီ ဖိုင်ကို ဒီ
      lesson ထဲမှာ run မှာ မဟုတ်ဘဲ၊ GitHub ပေါ်ကို push လုပ်မှ GitHub က run ပေးမှာပါ။ [[mark:type-job]]
      test ဆိုတဲ့ job တစ်ခု ထည့်ပြီး၊ GitHub ပေးတဲ့ Linux စက် အသစ်တစ်လုံးပေါ်မှာ run ခိုင်းထားပါတယ်။
      စက်အသစ် ဖြစ်လို့ ကိုယ့် ကွန်ပျူတာမှာပဲ ရှိနေတဲ့ ဖိုင်တစ်ခုခုကြောင့် pass ဖြစ်နေတာမျိုးကို
      ဖမ်းမိပါတယ်။ steps ကတော့ အစဉ်လိုက် လုပ်ရမယ့် အဆင့်တွေပါ။ [[mark:type-checkout]] ပထမ အဆင့်က checkout
      ပါ။ pull request ရဲ့ code ကို အဲဒီ စက်ပေါ်ကို ယူလာပေးပါတယ်။ [[mark:type-node]] ဒုတိယ အဆင့်က Node ၂၄
      ကို ထည့်တာပါ။ GitHub ရဲ့ နမူနာ workflow က Node ၁၈၊ ၂၀ နဲ့ ၂၂ ပေါ်မှာ run ပေမဲ့၊ Vitest ၅ က Node ၂၂
      ဒသမ ၁၂ နဲ့ အထက် လိုအပ်လို့ ၁၈ နဲ့ ၂၀ ပေါ်က job တွေက ကျပါလိမ့်မယ်။ [[mark:type-ci]] တတိယ အဆင့်က npm
      ci ပါ။ commit လုပ်ထားတဲ့ lock ဖိုင်ထဲက package version တွေအတိုင်း အစကနေ install လုပ်လို့၊ CI မှာလည်း
      ကိုယ် စမ်းခဲ့တဲ့ version တွေနဲ့ပဲ run ပါတယ်။ [[mark:type-npm-test]]
      နောက်ဆုံး အဆင့်က npm test ပါ။ ကိုယ့် ကွန်ပျူတာမှာ watch mode နဲ့ စောင့်နေမယ့် vitest ကို run တာပါ။
      ဒါပေမဲ့ GitHub Actions က CI ဆိုတဲ့ environment variable ကို true လို့ အမြဲ ပေးထားပြီး interactive
      terminal လည်း မဟုတ်လို့၊ Vitest က တစ်ခါပဲ run ပြီး ထွက်သွားပါတယ်။ [[mark:exit-code]] test တစ်ခု
      ကျရင် Vitest က exit code ၁ နဲ့ ထွက်လို့ ဒီ အဆင့် fail ဖြစ်ပြီး check က အနီ ဖြစ်သွားပါတယ်။ CI မှာ
      vitest run ဆိုတဲ့ command ကို တိုက်ရိုက် ရေးရင်လည်း တူတူပဲ ဖြစ်ပြီး ဖတ်ရ ပိုရှင်းပါတယ်။
    sources:
      - {
          title: "GitHub starter workflows: Node.js CI (facts B13)",
          url: "https://github.com/actions/starter-workflows/blob/main/ci/node.js.yml",
        }
      - {
          title: "GitHub Docs: GitHub-hosted runners",
          url: "https://docs.github.com/en/actions/concepts/runners/github-hosted-runners",
        }
      - { title: "npm Docs: npm ci", url: "https://docs.npmjs.com/cli/v10/commands/npm-ci" }
      - {
          title: "Vitest: Migration guide, Vitest 5 requires Node 22.12 (facts A01)",
          url: "https://vitest.dev/guide/migration/",
        }
      - {
          title: "GitHub Docs: Variables, CI is always true (facts B13)",
          url: "https://docs.github.com/en/actions/reference/workflows-and-actions/variables",
        }
      - { title: "Vitest: watch (facts A03)", url: "https://vitest.dev/config/watch" }
      - { title: "Vitest: Command Line Interface, vitest run", url: "https://vitest.dev/guide/cli" }
    actions:
      - id: open-workflow-2
        type: workspace.openFile
        at: { mark: open-workflow-2 }
        path: .github/workflows/test.yml
      - id: type-job
        type: editor.type
        at: { mark: type-job }
        target: { file: .github/workflows/test.yml, after: "    branches: [main]\n", occurrence: 1 }
        text: "\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n"
        # No test imports the workflow, so no run can start on a half-typed state (the bridge only
        # parses scripts): line by line is safe here, unlike in a test file (pilot note 1).
        cadence: line-by-line
      - id: type-checkout
        type: editor.type
        at: { mark: type-checkout }
        target: { file: .github/workflows/test.yml, after: "    steps:\n", occurrence: 1 }
        text: "      - uses: actions/checkout@v7\n"
        cadence: line-by-line
      - id: type-node
        type: editor.type
        at: { mark: type-node }
        target:
          {
            file: .github/workflows/test.yml,
            after: "      - uses: actions/checkout@v7\n",
            occurrence: 1,
          }
        text: "      - uses: actions/setup-node@v7\n        with:\n          node-version: 24\n"
        cadence: line-by-line
      - id: type-ci
        type: editor.type
        at: { mark: type-ci }
        target:
          { file: .github/workflows/test.yml, after: "          node-version: 24\n", occurrence: 1 }
        text: "      - run: npm ci\n"
        cadence: line-by-line
      - id: type-npm-test
        type: editor.type
        at: { mark: type-npm-test }
        target: { file: .github/workflows/test.yml, after: "      - run: npm ci\n", occurrence: 1 }
        text: "      - run: npm test\n"
        cadence: line-by-line
      - id: expect-workflow-file
        type: expect.file
        at: { mark: exit-code }
        path: .github/workflows/test.yml
        contains: "    steps:\n      - uses: actions/checkout@v7\n      - uses: actions/setup-node@v7\n        with:\n          node-version: 24\n      - run: npm ci\n      - run: npm test\n"

  - id: pr-page
    narration: >
      [[mark:board-pr]] pull request ဖွင့်လိုက်ရင် ဘာ မြင်ရမလဲ ဆိုတာ board ပေါ်မှာ ဆွဲကြည့်ရအောင်။
      [[mark:draw-checks]] pull request page ရဲ့ အောက်ပိုင်းမှာ ဒီ job က status check တစ်ခု အနေနဲ့
      ပေါ်ပါတယ်။ test အားလုံး pass ရင် အစိမ်းရောင် အမှန်ခြစ်၊ တစ်ခုခု ကျရင် အနီရောင် ကြက်ခြေခတ် ပြပါတယ်။
      [[mark:draw-merge]] ဒီ check ကို မဖြစ်မနေ pass ရမယ်လို့ project setting မှာ သတ်မှတ်ထားရင်၊ အနီ
      ဖြစ်နေသရွေ့ merge လုပ်လို့ မရပါဘူး။ ဒီလိုနဲ့ main branch ကို green ထိန်းထားတာပါ။
      [[mark:draw-annotation]] Vitest ကလည်း GitHub Actions ပေါ်မှာ run နေမှန်း သိရင် github actions
      reporter ကို သူ့ဘာသာ ထပ်ထည့်ပြီး၊ ကျတဲ့ test ရဲ့ error ကို ဖိုင်နဲ့ line နံပါတ် တွဲပြီး annotation
      အဖြစ် ပြပေးပါတယ်။
    sources:
      - {
          title: "web.dev Learn Testing: Run tests as part of presubmit or review",
          url: "https://web.dev/learn/testing/get-started/where-tests-run#presubmit-review",
        }
      - {
          title: "Vitest: Reporters, default configuration (facts A21)",
          url: "https://vitest.dev/guide/reporters#default-configuration",
        }
      - {
          title: "Vitest: GitHub Actions reporter",
          url: "https://vitest.dev/guide/reporters#github-actions-reporter",
        }
    actions:
      - id: board-pr
        type: whiteboard.apply
        at: { mark: board-pr }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-checks
        type: whiteboard.apply
        at: { mark: draw-checks }
        upsertIds: [b-ok-box, b-ok, b-bad-box, b-bad]
        drawMs: 3000
      - id: draw-merge
        type: whiteboard.apply
        at: { mark: draw-merge }
        upsertIds: [b-merge-box, b-merge]
        drawMs: 1800
      - id: draw-annotation
        type: whiteboard.apply
        at: { mark: draw-annotation }
        upsertIds: [b-annot-1, b-annot-2]
        drawMs: 2500

  - id: ci-mode
    chapter: "CI မှာ Vitest ဘာ ပြောင်းလဲ"
    narration: >
      CI ထဲမှာ Vitest ကိုယ်တိုင် ဘာ ပြောင်းလဲ လုပ်လဲ ဆက်ကြည့်ရအောင်။ တစ်ခါပဲ run တာကို ခုနက ပြောခဲ့ပါပြီ။
      နောက်တစ်ခုက only ပါ။ allow Only ဆိုတဲ့ option ရဲ့ default က ကိုယ့် ကွန်ပျူတာမှာ
      true ဖြစ်ပြီး CI မှာ false ဖြစ်လို့၊ CI မှာ only ပါတဲ့ test ကို တွေ့ရင် Vitest က run ကို fail
      ဖြစ်စေပါတယ်။ [[mark:open-config]] CI လုပ်မယ့် အတိုင်း panel မှာ မြင်ရအောင်၊ config ဖိုင်ကို
      ဖွင့်ပြီး ဒီ option ကို ကိုယ်တိုင် ထည့်ကြည့်ပါမယ်။ [[mark:select-team]] ဒါတွေက ပြီးခဲ့တဲ့ lesson မှာ
      ထည့်ခဲ့တဲ့ option သုံးခုပါ။ [[mark:type-allow-only]] သူတို့ရဲ့ အောက်မှာ allow Only ကို false နဲ့
      ထည့်လိုက်ပါမယ်။ config ပြောင်းသွားလို့ Vitest က config အသစ်နဲ့ ပြန် စ run ပါတယ်။
      [[mark:read-only-fail]] panel ကို ကြည့်ပါ။ PASS က အနီရောင် FAIL ဖြစ်သွားပြီး၊ ခွက်ကြီး test ရှေ့မှာ
      ကြက်ခြေခတ် ပေါ်လာပါပြီ။ အလယ်က Failed Tests အပိုင်းမှာ only ကို မမျှော်လင့်ထားဘူး၊ ဖြုတ်ပါ ဒါမှမဟုတ်
      allow Only နဲ့ ခွင့်ပြုပါလို့ ပြောနေပါတယ်။ [[mark:read-why-fail]] code မှားလို့ ကျတာ မဟုတ်ဘဲ၊ only က
      ကျန်တဲ့ test သုံးခုကို ကျော်ခိုင်းထားလို့ Vitest က တမင် fail ပေးတာပါ။ summary မှာလည်း ၁ ခု fail နဲ့ ၃ ခု
      skipped လို့ ပြနေပါတယ်။
    sources:
      - {
          title: "Vitest: Test Filtering, .only fails the run in CI (facts A13)",
          url: "https://vitest.dev/guide/filtering#focusing-on-specific-tests-with-only",
        }
      - { title: "Vitest: allowOnly", url: "https://vitest.dev/config/allowonly" }
    actions:
      - id: close-pr
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-config
        type: workspace.openFile
        at: { mark: open-config }
        path: vitest.config.js
      - id: select-team
        type: editor.select
        at: { mark: select-team }
        target:
          {
            file: vitest.config.js,
            text: "    include: [\"src/**/*.test.js\"],\n    restoreMocks: true,\n    unstubGlobals: true,",
            occurrence: 1,
          }
      - id: type-allow-only
        type: editor.type
        at: { mark: type-allow-only }
        target: { file: vitest.config.js, after: "    unstubGlobals: true,\n", occurrence: 1 }
        text: "    allowOnly: false,\n"
        # vitest.config.js takes only whole option lines in one block (PLATFORM.md §5): Vitest
        # restarts with the new config, no page reload.
        cadence: block
      - id: expect-only-fail
        type: expect.preview
        at: { afterAction: type-allow-only }
        timeoutMs: 10000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 3, delayMs: 2000 }
      - id: expect-only-count
        type: expect.preview
        at: { afterAction: expect-only-fail }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-failed, value: "1" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-only-message
        type: expect.preview
        at: { afterAction: expect-only-count }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute:
          {
            name: data-message,
            value: "[Vitest] Unexpected .only modifier. Remove it or pass --allowOnly argument to bypass this error",
          }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-only-test
        type: expect.preview
        at: { afterAction: expect-only-message }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-2 }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: unfocus
    narration: >
      [[mark:open-test-2]] ဒါဆို test ဖိုင်ကို ပြန်ဖွင့်ပြီး only ကို ဖြုတ်ကြည့်ရအောင်။
      [[mark:type-unonly]] only မပါတဲ့ line အသစ်ကို အပေါ်မှာ ရေးပြီး၊ line အဟောင်းကိုတော့ comment
      လုပ်ထားပါမယ်။ ကိုယ့် project မှာဆိုရင်တော့ only ဆိုတဲ့ စကားလုံးကို ဖျက်လိုက်ရုံပါပဲ။
      [[mark:read-four]] panel ကို ကြည့်ပါ။ test လေးခုလုံး အမှန်ခြစ် ရပြီး၊ summary မှာ ၄ ခု pass လို့
      ပြနေပါတယ်။ PASS ပြန်ဖြစ်သွားပြီး၊ ဒီတစ်ခါတော့ ကျော်သွားတဲ့ test တစ်ခုမှ မရှိပါဘူး။ allow Only ကိုတော့ ကိုယ့် project မှာ ရေးစရာ မလိုပါဘူး။ CI မှာ Vitest က သူ့ဘာသာ
      false လုပ်ပေးလို့ပါ။
    sources:
      - { title: "Vitest: test.only", url: "https://vitest.dev/api/test#test-only" }
      - { title: "Vitest: allowOnly", url: "https://vitest.dev/config/allowonly" }
    actions:
      - id: open-test-2
        type: workspace.openFile
        at: { mark: open-test-2 }
        path: src/order.test.js
      - id: type-unonly
        type: editor.type
        at: { mark: type-unonly }
        target: { file: src/order.test.js, after: "toBe(1500);\n  });\n\n  ", occurrence: 1 }
        # The one-insert line replacement (COURSE-KIT §5): at the test.only( line's first character,
        # the plain test( line, a newline, the indent and "// " — every state parses.
        text: "test(\"adds the large cup fee\", () => {\n  // "
        # Brisk keystrokes: natural typing of these 44 characters took 11.8 s in verify, longer
        # than its sentence; fast-explainer gaps stay under 629 ms, so no run starts mid-line.
        cadence: fast-explainer
      - id: expect-four-pass
        type: expect.preview
        at: { afterAction: type-unonly }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-four-count
        type: expect.preview
        at: { afterAction: expect-four-pass }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "4" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-test-file
        type: expect.file
        at: { afterAction: expect-four-count }
        path: src/order.test.js
        contains: "  test(\"adds the large cup fee\", () => {\n  // test.only(\"adds the large cup fee\", () => {\n"
      - id: expect-config-file
        type: expect.file
        at: { afterAction: expect-test-file }
        path: vitest.config.js
        contains: "    unstubGlobals: true,\n    allowOnly: false,\n"

  - id: ci-files
    narration: >
      [[mark:open-ignore]] CI နဲ့ ဆိုင်တဲ့ အချက် နှစ်ချက် ကျန်ပါသေးတယ်။ ဒါက git ignore ဖိုင်ပါ။ Vitest ၅ က
      report လို သူ ထုတ်တဲ့ ဖိုင်တွေကို project root က vitest ဆိုတဲ့ folder တစ်ခုထဲမှာ စုထားပါတယ်။
      [[mark:type-ignore]] အဲဒီ folder ကို git ထဲ မပါအောင် ဒီမှာ ထည့်လိုက်ပါမယ်။ [[mark:snapshots-ci]] ဒုတိယက snapshot ပါ။ snapshot
      lesson မှာ ပြောခဲ့သလို CI က snapshot ကို မရေးပေးဘဲ မရှိရင် ကျလို့၊ snapshot ဖိုင်တွေကို test နဲ့ အတူ
      commit လုပ်ပါ။
    sources:
      - {
          title: "Vitest: Getting Started, the .vitest directory in .gitignore (facts A20)",
          url: "https://vitest.dev/guide/",
        }
      - {
          title: "Vitest: Migration guide, generated reports and artifacts use .vitest (facts A20)",
          url: "https://vitest.dev/guide/migration/",
        }
      - {
          title: "Vitest: update, CI runs write no snapshots (facts A12)",
          url: "https://vitest.dev/config/update",
        }
    actions:
      - id: open-ignore
        type: workspace.openFile
        at: { mark: open-ignore }
        path: .gitignore
      - id: type-ignore
        type: editor.type
        at: { mark: type-ignore }
        target: { file: .gitignore, after: "node_modules/\n", occurrence: 1 }
        text: ".vitest/\n"
      - id: expect-ignore-file
        type: expect.file
        at: { mark: snapshots-ci }
        path: .gitignore
        contains: "node_modules/\n.vitest/\n"

  - id: red-main
    chapter: "Main branch အနီ ဖြစ်ရင်"
    narration: >
      [[mark:board-red]] pull request တိုင်း green ဖြစ်မှ merge လုပ်ပေမဲ့၊ main branch က အနီ ဖြစ်သွားတာ
      ကြုံရနိုင်ပါသေးတယ်။ [[mark:draw-together]] ပထမ အကြောင်းက pull request နှစ်ခုကို အချိန် နီးနီးမှာ
      merge လုပ်တာပါ။ တစ်ခုချင်း pass ဖြစ်ပေမဲ့၊ ပေါင်းလိုက်တော့ တစ်ခုနဲ့ တစ်ခု ထိခိုက်ပြီး
      ကျသွားတာမျိုးပါ။ [[mark:draw-flaky]] ဒုတိယ အကြောင်းက flaky test ပါ။ Google က သူ့ test တွေကို ၂၀၁၆
      ခုနှစ်မှာ ကြည့်တော့၊ pass ကနေ fail ပြောင်းသွားတဲ့ အကြိမ်တွေရဲ့ ၈၄ ရာခိုင်နှုန်းလောက်မှာ flaky test
      ပါနေခဲ့ပါတယ်။ [[mark:draw-slow]] တတိယ အကြောင်းကတော့ ညတိုင်းမှ run တဲ့ ကြာတဲ့ test တွေပါ။ pull
      request check မြန်အောင် ညကို ရွှေ့ထားလို့ ကျရင် နောက်မှ သိရပါတယ်။ npm test ကို စက္ကန့်ပိုင်းအတွင်း
      ပြီးအောင် ထားတာကလည်း ဒီအတွက်ပါ။
    sources:
      - {
          title: "web.dev Learn Testing: Run tests as part of Continuous Integration",
          url: "https://web.dev/learn/testing/get-started/where-tests-run#continuous-integration",
        }
      - {
          title: "web.dev Learn Testing: Prerequisite script, a fast npm test",
          url: "https://web.dev/learn/testing/get-started/where-tests-run#prereq-script",
        }
      - {
          title: "Google Testing Blog: Flaky Tests at Google and How We Mitigate Them, 2016 (facts C16)",
          url: "https://testing.googleblog.com/2016/05/flaky-tests-at-google-and-how-we.html",
        }
    actions:
      - id: board-red
        type: whiteboard.apply
        at: { mark: board-red }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-together
        type: whiteboard.apply
        at: { mark: draw-together }
        upsertIds: [c-1]
        drawMs: 1500
      - id: draw-flaky
        type: whiteboard.apply
        at: { mark: draw-flaky }
        upsertIds: [c-2, c-google]
        drawMs: 2500
      - id: draw-slow
        type: whiteboard.apply
        at: { mark: draw-slow }
        upsertIds: [c-3, c-fast]
        drawMs: 2500

  - id: roll-back
    narration: >
      [[mark:board-respond]] main အနီ ဖြစ်သွားရင် ဘာလုပ်မလဲ။ တစ်နည်းက roll back ပါ။ ပြဿနာ ဖြစ်စေတဲ့
      ပြောင်းလဲမှုကို revert လုပ်ပြီး၊ အလုပ်လုပ်တဲ့ အခြေအနေကို အမြန် ပြန်ရောက်အောင် လုပ်တာပါ။
      [[mark:draw-forward]] နောက်တစ်နည်းက roll forward ပါ။ ပြောင်းလဲမှုကို မဖြုတ်ဘဲ ပြင်ဆင်ချက် အသစ်နဲ့
      ရှေ့ဆက်ပြင်တာပါ။ [[mark:draw-goal]] ဘယ်နည်းကို ရွေးရွေး၊ ကိုယ် တကယ် လိုချင်တာက ဆိုင်ရဲ့ software
      မှန်မှန် အလုပ်လုပ်ဖို့ပါ။ test တွေက အဲဒါကို သိဖို့ သုံးတဲ့ နည်းလမ်းပဲ ဖြစ်ပါတယ်။ [[mark:draw-fatigue]]
      ပိုဆိုးတာက flaky test ကြောင့် main က ခဏခဏ အနီ ဖြစ်နေတာပါ။ alarm fatigue ကြောင့် အဖွဲ့က အနီရောင်ကို
      မယုံတော့ဘဲ test တွေကို ပိတ်ပစ်တဲ့ အထိ ဖြစ်တတ်လို့၊ flaky test ကို မြန်မြန် ပြင်ပြီး၊ test
      ရေးတာ ပိုကျွမ်းကျင်အောင် လေ့ကျင့်ပါ။ test တွေကိုလည်း သေးသေး ရှင်းရှင်း ထားပါ။ [[mark:draw-dora]] AI
      ခေတ်မှာ ဒါက ပိုအရေးကြီးပါတယ်။ software team တွေကို လေ့လာတဲ့ DORA ရဲ့ ၂၀၂၄ နဲ့ ၂၀၂၅ ခုနှစ်
      သုတေသနတွေမှာ AI က code ကို ပိုမြန်မြန် ပို့နိုင်စေပေမဲ့၊ test လို အခြေခံ မခိုင်ရင် ပြဿနာ
      ပိုတက်တတ်တယ်လို့ တွေ့ထားပါတယ်။
    sources:
      - {
          title: "web.dev Learn Testing: An interlude on rolling back",
          url: "https://web.dev/learn/testing/get-started/where-tests-run#roll-back",
        }
      - {
          title: "DORA: 2025 year in review, AI and stability (facts D13)",
          url: "https://dora.dev/insights/dora-2025-year-in-review/",
        }
      - {
          title: "DORA: 2024 report, robust testing remains crucial (facts D13)",
          url: "https://dora.dev/research/2024/dora-report/",
        }
    actions:
      - id: board-respond
        type: whiteboard.apply
        at: { mark: board-respond }
        clear: true
        upsertIds: [d-title]
      - id: draw-back
        type: whiteboard.apply
        at: { afterAction: board-respond }
        upsertIds: [d-back-box, d-back-1, d-back-2]
        drawMs: 2000
      - id: draw-forward
        type: whiteboard.apply
        at: { mark: draw-forward }
        upsertIds: [d-fwd-box, d-fwd-1, d-fwd-2]
        drawMs: 2000
      - id: draw-goal
        type: whiteboard.apply
        at: { mark: draw-goal }
        upsertIds: [d-goal]
        drawMs: 1500
      - id: draw-fatigue
        type: whiteboard.apply
        at: { mark: draw-fatigue }
        upsertIds: [d-fatigue]
        drawMs: 1500
      - id: draw-dora
        type: whiteboard.apply
        at: { mark: draw-dora }
        upsertIds: [d-dora]
        drawMs: 1500

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ test တွေကို ကိုယ့် ကွန်ပျူတာမှာ၊ pull request တိုင်းမှာ၊ main branch မှာနဲ့
      ညတိုင်း run ပါတယ်။ workflow က code ကို ယူ၊ Node ကို ထည့်၊ package တွေကို install လုပ်ပြီး npm test
      ကို run ပါတယ်။ [[mark:recap-ci]] CI ထဲမှာ Vitest က တစ်ခါပဲ run ပြီး၊ only ကို လက်မခံ၊
      snapshot အသစ်ကို မရေးဘဲ annotation တွေ ထုတ်ပေးပါတယ်။ main ကို green ထိန်းဖို့ flaky test တွေကို
      မြန်မြန် ပြင်ပြီး npm test ကို မြန်အောင် ထားပါ။ နောက် lesson မှာတော့ test framework နဲ့ tool တွေကို
      ဘယ်လို ရွေးမလဲ ဆိုတာနဲ့၊ Jest test တစ်ခုကို Vitest မှာ run လို့ ရအောင် ပြောင်းကြည့်ပါမယ်။
    sources:
      - {
          title: "web.dev Learn Testing: Where tests run",
          url: "https://web.dev/learn/testing/get-started/where-tests-run",
        }
      - { title: "Vitest: Command Line Interface", url: "https://vitest.dev/guide/cli" }
    actions:
      - id: close-respond
        type: whiteboard.apply
        at: { scene: start }
        open: false
checks:
  - { type: timing.p95Ms, max: 300 }
