build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 2616

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  - id: intro
    chapter: "Component ကို ဘယ်လို ရွေးမလဲ"
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ အော်ဒါ form ကို label၊ fieldset နဲ့ error message တွေနဲ့ လူတိုင်း
      ဖြည့်နိုင်အောင် ပြင်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ pattern၊ component နဲ့ design system အကြောင်း
      ကြည့်ပါမယ်။ [[mark:start-server]] အခု website အများစုကို component လေးတွေ ခွဲပြီး ဆောက်ကြပါတယ်။
      ခလုတ်၊ accordion၊ dialog စတဲ့ အပိုင်းလေးတွေကို တစ်ခါ ဆောက်ထားပြီး နေရာတိုင်းမှာ ပြန်သုံးတာပါ။ အဲဒီ
      component တွေကို စုထားပြီး ဘယ်လို သုံးရမလဲ ဆိုတာပါ ရေးထားတာကို design system လို့ ခေါ်ပါတယ်။
      [[mark:draw-chain]] accessibility ဘက်က ကြည့်ရင် ဒါက အကောင်းရော အဆိုးရော ဖြစ်နိုင်ပါတယ်။ component
      တစ်ခုမှာ ပြဿနာ ရှိရင် သူ့ကို သုံးထားတဲ့ page တိုင်းမှာ ပြဿနာ ပါသွားပြီး၊ component တစ်ခုကို
      ပြင်လိုက်ရင်တော့ နေရာတိုင်းမှာ တစ်ခါတည်း ကောင်းသွားပါတယ်။ [[mark:draw-q1]] ဒါကြောင့် component
      တစ်ခုကို ရွေးခင် မေးခွန်း သုံးခု မေးကြည့်ပါ။ ပထမ၊ accessible ဖြစ်တဲ့ pattern ဒါမှမဟုတ် design system
      ရှိပြီးသားလား။ [[mark:draw-q2]] ဒုတိယ၊ ကိုယ့် user တွေ သုံးတဲ့ ဘယ် browser နဲ့ ဘယ် assistive
      technology ကို support လုပ်ရမလဲ။ [[mark:draw-q3]] တတိယ၊ ကိုယ် သုံးနေတဲ့ code ဒါမှမဟုတ် framework မှာ
      ကန့်သတ်ချက် ရှိလား။ အကုန် ပြည့်စုံတဲ့ pattern တစ်ခုတည်း ဆိုတာ မရှိဘဲ၊ ကိုယ့် အခြေအနေနဲ့
      အကိုက်ဆုံးကို ရွေးရတာပါ။
    sources:
      - {
          title: "web.dev Learn Accessibility: Patterns, components, and design systems",
          url: "https://web.dev/learn/accessibility/patterns",
        }
    actions:
      - id: open-questions-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-chain
        type: whiteboard.apply
        at: { mark: draw-chain }
        upsertIds: [a-chain]
        drawMs: 1500
      - id: draw-q1
        type: whiteboard.apply
        at: { mark: draw-q1 }
        upsertIds: [a-q1-box, a-q1]
        drawMs: 1500
      - id: draw-q2
        type: whiteboard.apply
        at: { mark: draw-q2 }
        upsertIds: [a-q2-box, a-q2]
        drawMs: 1500
      - id: draw-q3
        type: whiteboard.apply
        at: { mark: draw-q3 }
        upsertIds: [a-q3-box, a-q3]
        drawMs: 1500

  - id: code-tour
    narration: >
      [[mark:close-questions]] ဆိုင်ရဲ့ page မှာလည်း ကိုယ်တိုင် ဆောက်ထားတဲ့ component နှစ်ခု ရှိပါတယ်။
      [[mark:open-index]] HTML ဖိုင်ကို ကြည့်ရအောင်။ [[mark:select-old-head]] ပထမ တစ်ခုက မေးလေ့ရှိတဲ့
      မေးခွန်းအတွက် accordion ပါ။ ခေါင်းစဉ်ကို နှိပ်ရင် အဖြေ ပေါ်လာအောင် div နှစ်ခုနဲ့ ဆောက်ထားပါတယ်။
      [[mark:select-fake-modal]] ဒုတိယ တစ်ခုက အော်ဒါ အတည်ပြုဖို့ modal ပါ။ ဒါလည်း div ပဲ ဖြစ်ပြီး၊ page
      ကို ဖုံးပြီး ပေါ်လာအောင် CSS နဲ့ နေရာချထားပါတယ်။ [[mark:open-main]] JavaScript ဖိုင်ကိုလည်း ကြည့်ပါ။
      [[mark:select-head-click]] accordion ရဲ့ ခေါင်းစဉ် div မှာ click ကို နားထောင်ပြီး အဖြေကို ပြလိုက်
      ဖျောက်လိုက် လုပ်ပါတယ်။ [[mark:select-show-fake]] modal ကတော့ ခလုတ် နှိပ်ရင် div ကို ပြရုံပါပဲ။ focus
      ကို အထဲ ရွှေ့တာ၊ Escape key နဲ့ ပိတ်တာ၊ နောက်က page ကို သုံးလို့ မရအောင် ပိတ်တာ စတဲ့ code တွေ
      တစ်ကြောင်းမှ မပါပါဘူး။
    sources:
      - {
          title: "web.dev Learn Accessibility: Patterns — Think critically",
          url: "https://web.dev/learn/accessibility/patterns#think_critically",
        }
      - {
          title: "WAI-ARIA APG: Disclosure (Show/Hide) pattern",
          url: "https://www.w3.org/WAI/ARIA/apg/patterns/disclosure/",
        }
    actions:
      - id: close-questions
        type: whiteboard.apply
        at: { mark: close-questions }
        open: false
      - id: open-index
        type: workspace.openFile
        at: { mark: open-index }
        path: index.html
      - id: select-old-head
        type: editor.select
        at: { mark: select-old-head }
        target:
          { file: index.html, text: '<div class="accordion-head" id="faq-head"', occurrence: 1 }
      - id: select-fake-modal
        type: editor.select
        at: { mark: select-fake-modal }
        target:
          {
            file: index.html,
            text: '<div class="fake-modal" id="fake-modal" hidden',
            occurrence: 1,
          }
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: main.js
      - id: select-head-click
        type: editor.select
        at: { mark: select-head-click }
        target: { file: main.js, text: 'faqHead.addEventListener("click"', occurrence: 1 }
      - id: select-show-fake
        type: editor.select
        at: { mark: select-show-fake }
        target: { file: main.js, text: "fakeModal.hidden = false;", occurrence: 1 }

  - id: accordion-problem
    chapter: "Div accordion ရဲ့ ပြဿနာ"
    narration: >
      [[mark:preview-ready]] ညာဘက်မှာ page ကို မြင်ရပါပြီ။ accessibility panel မှာ ဒီတစ်ခါ tree နဲ့ Tab
      key ရဲ့ အစဉ်ကို ပြထားပါတယ်။ [[mark:look-tabs]] tree ထဲမှာ ဖွင့်ချိန် ဆိုတဲ့ accordion ခေါင်းစဉ်
      မပါပါဘူး။ Tab အစဉ်မှာလည်း အော်ဒါ အတည်ပြုမယ် ခလုတ် တစ်ခုပဲ ရှိပါတယ်။ [[mark:click-old-head]]
      ခေါင်းစဉ်ကို mouse နဲ့ နှိပ်ကြည့်ရအောင်။ [[mark:after-old-head]] အဖြေ ပေါ်လာပါပြီ။ ဒါပေမဲ့ Tab
      အစဉ်မှာ ဘာမှ မပြောင်းပါဘူး။ keyboard သုံးတဲ့သူက ဒီ ခေါင်းစဉ်ဆီ မရောက်နိုင်သလို၊ screen reader
      သုံးတဲ့သူကလည်း ဒါ နှိပ်လို့ရတဲ့ ခလုတ် ဖြစ်မှန်း၊ ဖွင့်ထားလား ပိတ်ထားလား ဆိုတာ မသိနိုင်ပါဘူး။ div
      ကိုပဲ ဆက်သုံးမယ်ဆိုရင် role၊ tab index၊ aria expanded နဲ့ keyboard event တွေ အကုန် ကိုယ်တိုင်
      ထည့်ရပါမယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: ARIA and HTML — the accessibility tree",
          url: "https://web.dev/learn/accessibility/aria-html",
        }
      - {
          title: "WAI-ARIA APG: Accordion pattern",
          url: "https://www.w3.org/WAI/ARIA/apg/patterns/accordion/",
        }
    actions:
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { mark: preview-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-dev-server }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-one-stop
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: tab-count }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-opener-is-stop
        type: expect.preview
        at: { mark: look-tabs }
        timeoutMs: 5000
        target: { by: testId, value: tab-fake-open }
        textContains: '1 button "အော်ဒါ အတည်ပြုမယ်"'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: click-old-head
        type: preview.click
        at: { mark: click-old-head }
        timeoutMs: 5000
        target: { by: testId, value: faq-old-head }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-still-one-stop
        type: expect.preview
        at: { mark: after-old-head }
        timeoutMs: 5000
        target: { by: testId, value: tab-count }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: accordion-fix
    chapter: "HTML element ကို အရင် သုံးရအောင်"
    narration: >
      [[mark:open-index-2]] အဲဒီအစား HTML မှာ ပါပြီးသား element ကို အရင် ရှာကြည့်ရအောင်။
      [[mark:type-details]] ဖွင့်လိုက် ပိတ်လိုက် လုပ်တဲ့ အပိုင်းအတွက် details element နဲ့ summary element
      ရှိပါတယ်။ summary ထဲမှာ ခေါင်းစဉ်၊ သူ့အောက်မှာ အဖြေကို ထည့်ပါမယ်။ JavaScript တစ်ကြောင်းမှ မလိုပါဘူး။
      [[mark:after-details]] tree ထဲမှာ role က button၊ name က ဖွင့်ချိန်၊ state က collapsed ဆိုပြီး
      ပေါ်လာပါပြီ။ Tab အစဉ်မှာလည်း နံပါတ် တစ် ဖြစ်လာပါတယ်။ preview မှာ ခေါင်းစဉ် နှစ်ခု တူတူ မြင်ရပေမယ့်၊
      browser က အသစ် တစ်ခုကိုပဲ ခလုတ် အဖြစ် သိပါတယ်။ [[mark:type-hide-old-faq]] div အဟောင်းကို ကိုယ့် code
      မှာဆိုရင် ဖျက်လိုက်ပါ။ ဒီမှာတော့ hidden ထည့်ပြီး ဖျောက်ထားပါမယ်။ [[mark:click-summary]] ခေါင်းစဉ်ကို
      နှိပ်ကြည့်ရအောင်။ [[mark:after-summary]] အဖြေ ပေါ်လာပြီး၊ tree မှာလည်း expanded ဖြစ်သွားပါပြီ။
      keyboard နဲ့ဆိုရင် Enter ဒါမှမဟုတ် Space နှိပ်ပြီး ဖွင့်လို့ ရတာကိုလည်း browser က ပေးထားပါတယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: ARIA and HTML — When to use ARIA",
          url: "https://web.dev/learn/accessibility/aria-html#when_to_use_aria",
        }
      - {
          title: "MDN: The details element",
          url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/details",
        }
      - {
          title: "HTML Standard: the details and summary elements",
          url: "https://html.spec.whatwg.org/multipage/interactive-elements.html#the-details-element",
        }
    actions:
      - id: open-index-2
        type: workspace.openFile
        at: { mark: open-index-2 }
        path: index.html
      - id: type-details
        type: editor.type
        at: { mark: type-details }
        cadence: block
        target:
          {
            file: index.html,
            after: "          <div class=\"accordion-body\" id=\"faq-body\" hidden data-testid=\"faq-old-body\">နေ့တိုင်း မနက် ၆ နာရီ မှ ည ၈ နာရီ</div>\n        </div>",
            occurrence: 1,
          }
        text: "\n        <details class=\"faq\" data-testid=\"faq\">\n          <summary data-testid=\"faq-summary\">ဖွင့်ချိန်</summary>\n          <p>နေ့တိုင်း မနက် ၆ နာရီ မှ ည ၈ နာရီ</p>\n        </details>"
      - id: expect-summary-row
        type: expect.preview
        at: { mark: after-details }
        timeoutMs: 5000
        target: { by: testId, value: a11y-faq-summary }
        textContains: 'button "ဖွင့်ချိန်" collapsed'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-summary-stop
        type: expect.preview
        at: { afterAction: expect-summary-row }
        timeoutMs: 5000
        target: { by: testId, value: tab-faq-summary }
        attribute: { name: data-order, value: "1" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-hide-old-faq
        type: editor.type
        at: { mark: type-hide-old-faq }
        cadence: block
        target:
          { file: index.html, after: '<div class="accordion" data-testid="faq-old"', occurrence: 1 }
        text: " hidden"
      - id: expect-old-faq-hidden
        type: expect.preview
        at: { mark: click-summary, offsetMs: -700 }
        timeoutMs: 5000
        target: { by: testId, value: faq-old }
        attribute: { name: hidden, value: "" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: click-summary
        type: preview.click
        at: { mark: click-summary }
        timeoutMs: 5000
        target: { by: testId, value: faq-summary }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-expanded
        type: expect.preview
        at: { mark: after-summary }
        timeoutMs: 5000
        target: { by: testId, value: a11y-faq-summary }
        textContains: '"ဖွင့်ချိန်" expanded'
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: modal-problem
    chapter: "Div modal ရဲ့ ပြဿနာ"
    narration: >
      [[mark:click-fake-open]] အခု div modal ကို ဖွင့်ကြည့်ရအောင်။ [[mark:after-fake-open]] modal
      ပေါ်လာပြီး နောက်က page ကို မှိန်ထားပါတယ်။ ဒါပေမဲ့ tree ထဲမှာ dialog ဆိုတဲ့ row မရှိဘဲ၊ modal ထဲက
      ခလုတ်တွေက page ရဲ့ အောက်ဆုံးမှာ သာမန် ခလုတ်တွေလို ပါနေပါတယ်။ focus ကလည်း modal ထဲ မရောက်ဘဲ၊
      ဖွင့်ခဲ့တဲ့ ခလုတ်ပေါ်မှာပဲ ကျန်နေပါတယ်။ ဒါကြောင့် screen reader သုံးတဲ့သူက modal ပေါ်လာမှန်းတောင်
      မသိနိုင်ပါဘူး။ [[mark:look-fake-tabs]] Tab အစဉ်ကိုလည်း ကြည့်ပါ။ နောက်က page ထဲက ခလုတ်တွေပါ
      ပေါင်းပြီး stop လေးခု ရှိနေပါတယ်။ [[mark:shift-tab]] Shift နဲ့ Tab ကို နှိပ်ကြည့်ရအောင်။
      [[mark:after-shift-tab]] focus က modal ရဲ့ နောက်ကွယ်က ဖွင့်ချိန် ခေါင်းစဉ်ဆီ ရောက်သွားပါပြီ။
      keyboard သုံးတဲ့သူက modal ရဲ့ နောက်ကွယ်မှာ လမ်းပျောက်နေတာပါ။ code ထဲမှာ Escape key ကို
      နားထောင်ထားတာလည်း မရှိလို့၊ Escape နှိပ်ရင် ပိတ်မှာ မဟုတ်ပါဘူး။
    sources:
      - {
          title: "web.dev Learn Accessibility: JavaScript — Focus management",
          url: "https://web.dev/learn/accessibility/javascript#focus_management",
        }
      - {
          title: "WAI-ARIA APG: Dialog (Modal) pattern",
          url: "https://www.w3.org/WAI/ARIA/apg/patterns/dialog-modal/",
        }
    actions:
      - id: click-fake-open
        type: preview.click
        at: { mark: click-fake-open }
        timeoutMs: 5000
        target: { by: testId, value: fake-open }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-fake-shown
        type: expect.preview
        at: { mark: after-fake-open }
        timeoutMs: 5000
        target: { by: testId, value: a11y-fake-cancel }
        textContains: 'button "ပယ်ဖျက်"'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-focus-behind
        type: expect.preview
        at: { afterAction: expect-fake-shown }
        timeoutMs: 5000
        target: { by: testId, value: a11y-fake-open }
        attribute: { name: data-states, value: "focused" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-four-stops
        type: expect.preview
        at: { mark: look-fake-tabs }
        timeoutMs: 5000
        target: { by: testId, value: tab-count }
        attribute: { name: data-count, value: "4" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: shift-tab
        type: preview.click
        at: { mark: shift-tab }
        timeoutMs: 5000
        target: { by: testId, value: a11y-tab-prev }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-focus-escaped
        type: expect.preview
        at: { mark: after-shift-tab }
        timeoutMs: 5000
        target: { by: testId, value: a11y-faq-summary }
        attribute: { name: data-states, value: "expanded focused" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: dialog-fix
    chapter: "Dialog element နဲ့ ပြန်ဆောက်ရအောင်"
    narration: >
      [[mark:type-hide-old-confirm]] ဒီ modal ကိုလည်း HTML ရဲ့ dialog element နဲ့ ပြန်ဆောက်ပါမယ်။
      အဟောင်းကို hidden နဲ့ အရင် ဖျောက်ထားပါမယ်။ [[mark:type-dialog]] ပြီးတော့ ဖွင့်မယ့် ခလုတ်နဲ့ dialog
      ကို ထည့်ပါမယ်။ dialog ထဲက form ကို method dialog လို့ ပေးထားလို့၊ အထဲက ခလုတ် နှိပ်ရင် dialog က
      သူ့ဘာသာ ပိတ်သွားပါတယ်။ [[mark:open-main-2]] ဖွင့်တဲ့ အပိုင်းကိုတော့ JavaScript ဖိုင်မှာ ရေးပါမယ်။
      [[mark:type-show-modal]] ခလုတ်ကို နှိပ်ရင် dialog ရဲ့ showModal ကို ခေါ်တဲ့ စာကြောင်း နည်းနည်း
      ထည့်ပါမယ်။ show လို့ မခေါ်ဘဲ showModal လို့ ခေါ်မှ modal အဖြစ် ဖွင့်ပေးပြီး၊ နောက်က page ကိုလည်း
      browser က ပိတ်ပေးတာပါ။ [[mark:click-open-confirm]] ခလုတ်ကို နှိပ်ကြည့်ရအောင်။
      [[mark:after-open-confirm]] tree က dialog ရဲ့ အထဲကိုပဲ ပြပြီး၊ role က dialog၊ name က အော်ဒါ
      အတည်ပြုမလား ဖြစ်နေပါတယ်။ focus ကလည်း ပယ်ဖျက် ခလုတ်ဆီ အလိုလို ရောက်လာပါပြီ။ [[mark:look-dialog-tabs]]
      Tab အစဉ်မှာ dialog ထဲက ခလုတ် နှစ်ခုပဲ ကျန်ပါတော့တယ်။ နောက်က page ကို browser က သုံးလို့ မရအောင်
      ပိတ်ထားလို့ပါ။ [[mark:tab-in-dialog]] Tab ကို နှိပ်ကြည့်ရအောင်။ [[mark:after-tab-in-dialog]] focus က
      အတည်ပြု ခလုတ်ဆီ ရွှေ့သွားပြီး၊ dialog ထဲမှာပဲ ရှိနေပါတယ်။ Escape key နှိပ်ရင်လည်း browser ကိုယ်တိုင်
      dialog ကို ပိတ်ပေးပါတယ်။ ဒီ lesson ထဲမှာ key နှိပ်ပြလို့ မရလို့၊ ကိုယ့် ကွန်ပျူတာမှာ စမ်းကြည့်ပါ။
      [[mark:click-cancel]] ဒီမှာတော့ ပယ်ဖျက် ကို နှိပ်ပြီး ပိတ်ကြည့်ရအောင်။ [[mark:after-cancel]] dialog
      ပိတ်သွားပြီး၊ focus က ဖွင့်ခဲ့တဲ့ ခလုတ်ဆီ ပြန်ရောက်လာပါပြီ။ div နဲ့ဆိုရင် ကိုယ်တိုင် ရေးရမယ့်
      အလုပ်တွေကို browser က လုပ်ပေးသွားတာပါ။
    sources:
      - {
          title: "MDN: The dialog element",
          url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/dialog",
        }
      - {
          title: "MDN: HTMLDialogElement showModal()",
          url: "https://developer.mozilla.org/en-US/docs/Web/API/HTMLDialogElement/showModal",
        }
      - {
          title: "HTML Standard: the dialog element",
          url: "https://html.spec.whatwg.org/multipage/interactive-elements.html#the-dialog-element",
        }
    actions:
      - id: type-hide-old-confirm
        type: editor.type
        at: { mark: type-hide-old-confirm }
        cadence: block
        target:
          {
            file: index.html,
            after: '<div class="old-confirm" data-testid="old-confirm"',
            occurrence: 1,
          }
        text: " hidden"
      - id: type-dialog
        type: editor.type
        at: { mark: type-dialog }
        cadence: block
        target:
          {
            file: index.html,
            after: "            </div>\n          </div>\n        </div>",
            occurrence: 1,
          }
        text: "\n        <button class=\"confirm-btn\" id=\"open-confirm\" type=\"button\" data-testid=\"open-confirm\">အော်ဒါ အတည်ပြုမယ်</button>\n        <dialog class=\"confirm\" id=\"confirm\" aria-labelledby=\"confirm-title\" data-testid=\"confirm\">\n          <h2 id=\"confirm-title\">အော်ဒါ အတည်ပြုမလား</h2>\n          <form method=\"dialog\">\n            <button value=\"cancel\" data-testid=\"confirm-cancel\">ပယ်ဖျက်</button>\n            <button value=\"ok\" data-testid=\"confirm-ok\">အတည်ပြု</button>\n          </form>\n        </dialog>"
      - id: open-main-2
        type: workspace.openFile
        at: { mark: open-main-2 }
        path: main.js
      - id: type-show-modal
        type: editor.type
        at: { mark: type-show-modal }
        cadence: block
        target: { file: main.js, after: "    fakeModal.hidden = true;\n  });\n}\n", occurrence: 1 }
        text: "\n// dialog: ခလုတ်ကို နှိပ်ရင် modal အဖြစ် ဖွင့်\nconst confirmDialog = document.querySelector(\"#confirm\");\ndocument.querySelector(\"#open-confirm\").addEventListener(\"click\", () => {\n  confirmDialog.showModal();\n});\n"
      - id: expect-native-opener
        type: expect.preview
        at: { mark: click-open-confirm, offsetMs: -700 }
        timeoutMs: 5000
        target: { by: testId, value: a11y-open-confirm }
        textContains: 'button "အော်ဒါ အတည်ပြုမယ်"'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: click-open-confirm
        type: preview.click
        at: { mark: click-open-confirm }
        timeoutMs: 5000
        target: { by: testId, value: open-confirm }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-dialog-row
        type: expect.preview
        at: { mark: after-open-confirm }
        timeoutMs: 5000
        target: { by: testId, value: a11y-confirm }
        textContains: 'dialog "အော်ဒါ အတည်ပြုမလား"'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-focus-inside
        type: expect.preview
        at: { afterAction: expect-dialog-row }
        timeoutMs: 5000
        target: { by: testId, value: a11y-confirm-cancel }
        attribute: { name: data-states, value: "focused" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-two-stops
        type: expect.preview
        at: { mark: look-dialog-tabs }
        timeoutMs: 5000
        target: { by: testId, value: tab-count }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: tab-in-dialog
        type: preview.click
        at: { mark: tab-in-dialog }
        timeoutMs: 5000
        target: { by: testId, value: a11y-tab-next }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-tab-ok
        type: expect.preview
        at: { mark: after-tab-in-dialog }
        timeoutMs: 5000
        target: { by: testId, value: tab-confirm-ok }
        textContains: '2 button "အတည်ပြု" focused'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: click-cancel
        type: preview.click
        at: { mark: click-cancel }
        timeoutMs: 5000
        target: { by: testId, value: confirm-cancel }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-focus-returned
        type: expect.preview
        at: { mark: after-cancel }
        timeoutMs: 5000
        target: { by: testId, value: a11y-open-confirm }
        attribute: { name: data-states, value: "focused" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: resources
    chapter: "Pattern တွေကို ဘယ်က ရှာမလဲ"
    narration: >
      [[mark:board-resources]] ဒါဆို accessible ဖြစ်တဲ့ pattern တွေကို ဘယ်က ရှာမလဲ။ [[mark:draw-apg]] W3C
      ရဲ့ ARIA Authoring Practices Guide ကို APG လို့ ခေါ်ပြီး၊ accordion၊ dialog၊ tab စတဲ့ pattern တွေမှာ
      ARIA နဲ့ keyboard ကို ဘယ်လို သုံးရမလဲ ဥပမာနဲ့ ပြထားပါတယ်။ ဒါပေမဲ့ သူ့ ဥပမာတွေက နည်းပညာကို ပြဖို့
      ဖြစ်ပြီး၊ production မှာ ဒီအတိုင်း ကူးသုံးဖို့ မဟုတ်ပါဘူး။ [[mark:draw-inclusive]] Inclusive
      Components မှာတော့ component တစ်ခုချင်းကို ဘာကြောင့် ဒီလို ဆောက်လဲ ဆိုတာ ရှင်းပြထားပါတယ်။
      [[mark:draw-govuk]] GOV.UK Design System လို design system တွေကတော့ user အစစ်တွေနဲ့ စမ်းပြီးသား
      component တွေကို စုထားပါတယ်။ [[mark:draw-warn]] ဘယ်ကနေ ယူယူ၊ accessible လို့ ရေးထားရင်တောင် copy
      လုပ်ပြီး ဒီအတိုင်း ထည့်လို့ မရပါဘူး။ ကိုယ့် page မှာ assistive technology နဲ့ရော၊ မသန်စွမ်းသူ user
      တွေနဲ့ပါ စမ်းကြည့်ရပါမယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: Patterns — Established resources",
          url: "https://web.dev/learn/accessibility/patterns#established_resources",
        }
      - {
          title: "WAI-ARIA Authoring Practices Guide: Read Me First",
          url: "https://www.w3.org/WAI/ARIA/apg/practices/read-me-first/",
        }
      - { title: "Inclusive Components", url: "https://inclusive-components.design/" }
      - {
          title: "GOV.UK Design System: Components",
          url: "https://design-system.service.gov.uk/components/",
        }
    actions:
      - id: board-resources
        type: whiteboard.apply
        at: { mark: board-resources }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-apg
        type: whiteboard.apply
        at: { mark: draw-apg }
        upsertIds: [b-r1-box, b-r1-head, b-r1-body]
        drawMs: 1600
      - id: draw-inclusive
        type: whiteboard.apply
        at: { mark: draw-inclusive }
        upsertIds: [b-r2-box, b-r2-head, b-r2-body]
        drawMs: 1400
      - id: draw-govuk
        type: whiteboard.apply
        at: { mark: draw-govuk }
        upsertIds: [b-r3-box, b-r3-head, b-r3-body]
        drawMs: 1400
      - id: draw-warn
        type: whiteboard.apply
        at: { mark: draw-warn }
        upsertIds: [b-warn]
        drawMs: 1400

  - id: support
    chapter: "Browser နဲ့ assistive technology support"
    narration: >
      [[mark:board-support]] နောက် တစ်ချက်က support ပါ။ [[mark:draw-pairs]] screen reader တွေက browser
      တချို့နဲ့ တွဲသုံးမှ အကောင်းဆုံး အလုပ်လုပ်ပါတယ်။ ဥပမာအားဖြင့် Windows မှာ NVDA နဲ့ JAWS ကို Chrome
      ဒါမှမဟုတ် Firefox နဲ့ တွဲသုံးကြပြီး၊ Apple device တွေမှာ VoiceOver ကို Safari နဲ့၊ Android မှာ
      TalkBack ကို Chrome နဲ့ တွဲသုံးကြပါတယ်။ တွဲတာ မတူရင် ARIA attribute တစ်ခုတည်းကိုတောင် ဖတ်ပြတာ
      မတူနိုင်ပါဘူး။ [[mark:draw-check]] ဒါကြောင့် pattern တစ်ခုကို မသုံးခင်၊ Accessibility Support ဆိုတဲ့
      site မှာ assistive technology တွေ ဘယ်လောက် support လုပ်လဲ၊ Can I use မှာ browser တွေ ဘယ်လောက်
      support လုပ်လဲ ဆိုတာ စစ်ကြည့်ပါ။
    sources:
      - {
          title: "web.dev Learn Accessibility: Patterns — Browsers and AT support",
          url: "https://web.dev/learn/accessibility/patterns#browsers_and_assistive_technology_at_support",
        }
      - { title: "Accessibility Support (a11ysupport.io)", url: "https://a11ysupport.io/" }
      - { title: "Can I use", url: "https://caniuse.com/" }
    actions:
      - id: board-support
        type: whiteboard.apply
        at: { mark: board-support }
        clear: true
        upsertIds: [c-title]
      - id: draw-pairs
        type: whiteboard.apply
        at: { mark: draw-pairs }
        upsertIds: [c-r1, c-r2, c-r3]
        drawMs: 2400
      - id: draw-check
        type: whiteboard.apply
        at: { mark: draw-check }
        upsertIds: [c-check-box, c-check-head, c-check-body]
        drawMs: 1600

  - id: other
    chapter: "ထပ် စဉ်းစားရမှာတွေ"
    narration: >
      [[mark:board-other]] component တစ်ခုကို ရွေးတဲ့အခါ ထပ် စဉ်းစားရမှာတွေလည်း ရှိပါတယ်။
      [[mark:draw-keyboard]] keyboard ပိုင်းမှာ၊ Tab နဲ့ ဘယ်ကို သွားမလဲ၊ menu လို component ထဲမှာ arrow
      key နဲ့ ရွှေ့ရမလား၊ Escape နဲ့ ပိတ်ရမလား ဆိုတာ သတ်မှတ်ထားရပါမယ်။ [[mark:draw-language]] ဘာသာစကား
      ပိုင်းမှာ၊ ဘာသာပြန်လိုက်တဲ့အခါ စာ ရှည်လာတာ၊ မြန်မာစာလို အပေါ်အောက် နေရာ ပိုလိုတဲ့ စာတွေကြောင့်
      ခလုတ်ထဲမှာ မဆံ့တာမျိုး မဖြစ်အောင် စစ်ရပါမယ်။ [[mark:draw-settings]] user setting ပိုင်းမှာ၊
      လှုပ်ရှားမှု လျှော့ထားတာ၊ zoom လုပ်ထားတာ၊ အရောင် ပြောင်းထားတာတွေကို component က လိုက်လျောရပါမယ်။
      [[mark:draw-docs]] design system ဆိုရင်တော့ component တစ်ခုစီကို accessible ဖြစ်အောင် ဘယ်လို
      သုံးရမလဲ ဆိုတာ documentation မှာ ရေးထားပေးပါ။ accessibility အကြောင်း သိတာ နည်းတဲ့ developer လည်း
      မှန်မှန် သုံးနိုင်အောင်ပါ။
    sources:
      - {
          title: "web.dev Learn Accessibility: Patterns — Other considerations",
          url: "https://web.dev/learn/accessibility/patterns#other_considerations",
        }
      - {
          title: "WAI-ARIA APG: Developing a Keyboard Interface",
          url: "https://www.w3.org/WAI/ARIA/apg/practices/keyboard-interface/",
        }
    actions:
      - id: board-other
        type: whiteboard.apply
        at: { mark: board-other }
        clear: true
        upsertIds: [d-title]
      - id: draw-keyboard
        type: whiteboard.apply
        at: { mark: draw-keyboard }
        upsertIds: [d-1-box, d-1-head, d-1-body]
        drawMs: 1400
      - id: draw-language
        type: whiteboard.apply
        at: { mark: draw-language }
        upsertIds: [d-2-box, d-2-head, d-2-body]
        drawMs: 1400
      - id: draw-settings
        type: whiteboard.apply
        at: { mark: draw-settings }
        upsertIds: [d-3-box, d-3-head, d-3-body]
        drawMs: 1400
      - id: draw-docs
        type: whiteboard.apply
        at: { mark: draw-docs }
        upsertIds: [d-4-box, d-4-head, d-4-body]
        drawMs: 1400

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:close-other]] ဒါဆို ပြန်ချုပ်ရရင်၊ component တစ်ခုကို copy ကူးတာထက် စဉ်းစားပြီး ရွေးရပါတယ်။
      [[mark:recap-details]] HTML မှာ ပါပြီးသား details နဲ့ summary လို element တွေက role၊ state နဲ့
      keyboard ကို အလိုလို ပေးပါတယ်။ [[mark:recap-dialog]] dialog element ကို showModal နဲ့ ဖွင့်ရင် focus
      ရွှေ့တာ၊ နောက်က page ကို ပိတ်တာ၊ Escape နဲ့ ပိတ်တာ၊ focus ပြန်ပို့တာတွေကို browser က လုပ်ပေးပါတယ်။
      APG လို resource တွေက စမှတ်ပဲ ဖြစ်ပြီး၊ support ကို စစ်ပြီး ကိုယ်တိုင် စမ်းသပ်ရပါမယ်။ နောက် lesson
      မှာတော့ code မရေးခင် design အဆင့်ကတည်းက accessibility ကို ဘယ်လို ထည့်စဉ်းစားမလဲ ဆိုတဲ့ design နဲ့ UX
      အကြောင်း ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: Patterns, components, and design systems",
          url: "https://web.dev/learn/accessibility/patterns",
        }
      - {
          title: "web.dev Learn Accessibility: Design and user experience",
          url: "https://web.dev/learn/accessibility/design-ux",
        }
    actions:
      - id: close-other
        type: whiteboard.apply
        at: { mark: close-other }
        open: false
      - id: open-index-recap
        type: workspace.openFile
        at: { mark: recap-details }
        path: index.html
      - id: recap-details
        type: editor.select
        at: { afterAction: open-index-recap }
        target:
          {
            file: index.html,
            text: '<summary data-testid="faq-summary">ဖွင့်ချိန်</summary>',
            occurrence: 1,
          }
      - id: recap-dialog
        type: editor.select
        at: { mark: recap-dialog }
        target: { file: index.html, text: '<dialog class="confirm" id="confirm"', occurrence: 1 }
      - id: expect-file-details
        type: expect.file
        at: { afterAction: recap-dialog }
        path: index.html
        contains: '<details class="faq" data-testid="faq">'
      - id: expect-file-dialog
        type: expect.file
        at: { afterAction: expect-file-details }
        path: index.html
        contains: '<dialog class="confirm" id="confirm" aria-labelledby="confirm-title" data-testid="confirm">'
      - id: expect-file-opener
        type: expect.file
        at: { afterAction: expect-file-dialog }
        path: main.js
        contains: "confirmDialog.showModal();"

checks:
  - { type: timing.p95Ms, max: 300 }
