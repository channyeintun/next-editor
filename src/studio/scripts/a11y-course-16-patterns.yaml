# Accessibility course, lesson 16: patterns, components and design systems.
#
# Hands-on (tea-shop page, accessibility panel modes "tree tabs", scoped to
# <main>). Start state, both driven by a pinned main.js the learner reads: an
# FAQ "accordion" made of two divs (a click toggles hidden; no role, no state,
# no tab stop, no keyboard), and a div "modal" (a fixed overlay that main.js
# un-hides; focus stays on the opener, the page behind stays reachable, no
# dialog role, no Escape handler).
#
# Native first, all insert-only (every HTML save reloads the page):
#   1. a <details class="faq"><summary>… block inserted after the old div
#      accordion (both visible for one beat: only the new one is in the tree
#      and the tab order), then the old one hidden.
#   2. the old opener + div modal hidden, then the kit's native <dialog> with
#      a new opener inserted, plus one main.js block that calls showModal().
#      Opened: dialog row, focus on its first button, 2 tab stops, Tab moves
#      inside it; Escape cannot be pressed by Studio, so the narration says
#      what it does and closes with the cancel button; focus returns to the
#      opener.
# APG, established resources, browser/AT support and other considerations are
# drawn on boards.
#
# Built from template.yaml + ws/ with `bun build.ts`.
# Validate with (from the repo root):
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   ~/Documents/a11y-course-work/tools/verify.sh <this file>
schemaVersion: 1

lesson:
  slug: a11y-course-16-patterns
  title: "Accessibility course 16: Pattern၊ component နဲ့ design system"
  locale: my-MM
  workspace:
    lessonType: javascript
    name: Accessibility course
    entryFilePath: index.html
    files:
      base.css: |
        /*
          base.css: pinned, never typed during a lesson.
          The shop's palette and page furniture, in its accessible form: every text
          colour passes WCAG AA, form fields have 3:1 borders, nothing hides focus.
          A lesson keeps the sections it needs and drops any declaration its own demo
          types or relies on being absent (COURSE-KIT.md, "Deriving a lesson
          workspace"). Section E holds the few rules a start state pins on purpose,
          including deliberately broken ones (a pale colour, a removed outline).
          Keep it free of the url, image-set and @-import functions (they switch on
          Vite's postcss step); images come from <img>.
        */

        /* == A. palette == */
        :root {
          color-scheme: light;
          --tea-dark: #3b2314;
          --tea: #8b5a2b;
          --tea-light: #c9a27e;
          --cream: #fff8ec;
          --paper: #fdf3e1;
          --leaf: #2f6b3a;
          --gold: #c9a227;
          --chili: #b23a2b;
          --ink: #2b1d14;
          --muted: #6b5a4c;
          --line: #e6d5bf;
          --field: #8a7866;
          --radius: 12px;
        }

        /* == B. page == */
        body {
          margin: 0;
          font-family: "Noto Sans Myanmar", "Myanmar Sangam MN", "Myanmar MN", "Myanmar Text", "Padauk",
            system-ui, sans-serif;
          font-size: 16px;
          line-height: 1.8;
          color: var(--ink);
          background: var(--paper);
        }

        .page {
          padding: 0 16px 24px;
        }

        h1,
        h2,
        h3 {
          margin: 0 0 8px;
          line-height: 1.5;
        }

        h1 {
          font-size: 22px;
        }

        h2 {
          font-size: 20px;
        }

        h3 {
          font-size: 17px;
        }

        a {
          color: var(--tea);
        }

        /* A class that sets display must never un-hide a [hidden] element. */
        [hidden] {
          display: none !important;
        }

        /* Text for screen readers only (the forms and images lessons use it). */
        .visually-hidden {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip-path: inset(50%);
          white-space: nowrap;
        }

        /* == B2. reset == */
        *,
        *::before,
        *::after {
          box-sizing: border-box;
        }

        /* == C. furniture == */
        .skip-link {
          position: absolute;
          top: -48px;
          left: 8px;
          padding: 4px 12px;
          background: var(--cream);
          color: var(--tea-dark);
        }

        .skip-link:focus {
          top: 8px;
        }

        .site-header {
          padding: 12px 16px;
          background: var(--tea-dark);
          color: var(--cream);
        }

        .site-header a {
          color: var(--cream);
        }

        .brand {
          display: flex;
          align-items: center;
          gap: 8px;
        }

        .logo {
          display: block;
        }

        .shop-name {
          margin: 0;
          flex: 1;
        }

        .call-link {
          display: inline-flex;
          padding: 8px;
          border-radius: 999px;
          background: var(--tea);
        }

        .call-link img {
          display: block;
        }

        .tagline {
          margin: 0;
          color: var(--tea-light);
          font-size: 14px;
        }

        .nav ul {
          display: flex;
          gap: 16px;
          margin: 4px 0 0;
          padding: 0;
          list-style: none;
        }

        .hero {
          margin: 16px 0;
          padding: 16px;
          background: var(--cream);
          border-radius: var(--radius);
        }

        .divider {
          display: block;
          max-width: 100%;
          height: auto;
          margin: 0 auto 16px;
        }

        .menu {
          margin: 0;
          padding: 0;
          list-style: none;
        }

        .menu-card {
          margin: 0 0 12px;
          padding: 12px 16px;
          background: #fff;
          border: 1px solid var(--line);
          border-radius: var(--radius);
        }

        .menu-card .name,
        .menu-card .desc {
          margin: 0;
        }

        .menu-card .desc {
          color: var(--muted);
          font-size: 14px;
        }

        .price {
          font-weight: 700;
          color: var(--tea);
        }

        .status {
          margin-left: 8px;
          color: var(--chili);
          font-size: 14px;
        }

        .sold-out .name {
          text-decoration: line-through;
        }

        .order-link,
        .order-btn,
        .confirm-btn,
        .disclosure,
        .fav,
        .confirm button {
          display: inline-block;
          padding: 6px 16px;
          border: 0;
          border-radius: 999px;
          background: var(--tea);
          color: #fff;
          font: inherit;
          text-decoration: none;
        }

        .fav {
          margin-left: 8px;
          padding: 0 12px;
          font-size: 14px;
        }

        .fav[aria-pressed="true"] {
          background: var(--leaf);
        }

        .tea-options {
          margin: 16px 0;
        }

        .chips {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
          margin: 12px 0 0;
          padding: 0;
          list-style: none;
        }

        .chips li {
          padding: 2px 12px;
          border: 1px solid var(--field);
          border-radius: 999px;
          background: #fff;
        }

        .gallery figure {
          margin: 0 0 12px;
        }

        .gallery img {
          display: block;
          max-width: 100%;
          height: auto;
          border-radius: var(--radius);
        }

        figcaption {
          color: var(--muted);
          font-size: 14px;
        }

        .quote {
          margin: 16px 0;
          padding: 8px 16px;
          border-left: 4px solid var(--tea);
          background: var(--cream);
          font-style: italic;
        }

        .quote p {
          margin: 0;
        }

        .hours-table {
          width: 100%;
          border-collapse: collapse;
          background: #fff;
        }

        .hours-table caption {
          text-align: start;
          color: var(--muted);
          font-size: 14px;
        }

        .hours-table th,
        .hours-table td {
          padding: 4px 8px;
          border: 1px solid var(--line);
          text-align: start;
        }

        .hours-table thead th {
          background: var(--cream);
        }

        .location {
          margin: 16px 0;
        }

        .map {
          position: relative;
          height: 120px;
          border: 1px solid var(--field);
          border-radius: var(--radius);
          background:
            linear-gradient(90deg, transparent 46%, #fff 46%, #fff 54%, transparent 54%),
            linear-gradient(0deg, transparent 40%, #fff 40%, #fff 50%, transparent 50%),
            #d9e8c9;
        }

        .map-pin {
          position: absolute;
          top: 34px;
          left: 56%;
          width: 18px;
          height: 18px;
          border: 3px solid #fff;
          border-radius: 50%;
          background: var(--chili);
        }

        .address {
          margin: 4px 0 0;
        }

        .order-form {
          margin: 16px 0;
        }

        .order-form label {
          display: block;
          margin-top: 8px;
        }

        .order-form input[type="text"],
        .order-form input[type="tel"],
        .order-form input[type="number"] {
          width: 100%;
          padding: 6px 10px;
          border: 1px solid var(--field);
          border-radius: 8px;
          background: #fff;
          font: inherit;
        }

        .hint {
          margin: 2px 0 0;
          color: var(--muted);
          font-size: 14px;
        }

        .sugar {
          margin: 12px 0 0;
          padding: 4px 12px 8px;
          border: 1px solid var(--field);
          border-radius: 8px;
        }

        .sugar label {
          display: inline-block;
          margin: 0 12px 0 0;
        }

        .order-btn {
          margin-top: 12px;
        }

        .error {
          margin: 2px 0 0;
          color: var(--chili);
          font-size: 14px;
        }

        .alert {
          margin: 8px 0 0;
          padding: 8px 12px;
          border-radius: 8px;
          background: #fde8e4;
          color: var(--chili);
        }

        .order-status {
          min-height: 1.8em;
          margin: 8px 0 0;
          color: var(--leaf);
          font-weight: 700;
        }

        .confirm {
          margin: 16px auto auto;
          max-width: 320px;
          padding: 16px;
          border: 0;
          border-radius: var(--radius);
          background: var(--cream);
          color: var(--ink);
        }

        .confirm::backdrop {
          background: rgb(0 0 0 / 0.25);
        }

        .confirm form {
          display: flex;
          gap: 8px;
        }

        .site-footer {
          margin-top: 24px;
          padding: 16px;
          background: var(--tea-dark);
          color: var(--cream);
          font-size: 14px;
        }

        .site-footer p {
          margin: 0;
        }

        .site-footer a {
          color: var(--cream);
        }

        /* == D. helpers == */
        /* .demo shows a box's edges without changing layout (outline takes no space). */
        .demo {
          outline: 1px dashed var(--muted);
        }

        /* == E. lesson rules == */
        /* Patterns lesson start state: an FAQ "accordion" built from two divs, and a
           div "modal" (a fixed overlay with a box at the top of the preview, like the
           kit dialog), both driven by main.js. The native details/summary and dialog
           that replace them use the kit styles above. */
        .accordion,
        details.faq {
          margin: 8px 0 16px;
          padding: 8px 12px;
          border: 1px solid var(--field);
          border-radius: 8px;
          background: #fff;
        }

        .accordion-head,
        details.faq summary {
          font-weight: 700;
          cursor: pointer;
        }

        .accordion-body,
        details.faq p {
          margin: 4px 0 0;
        }

        .fake-modal {
          position: fixed;
          inset: 0;
          z-index: 10;
          background: rgb(0 0 0 / 0.25);
        }

        .fake-modal-box {
          margin: 16px auto 0;
          max-width: 320px;
          padding: 16px;
          border-radius: var(--radius);
          background: var(--cream);
        }

        .fake-modal-buttons {
          display: flex;
          gap: 8px;
        }

        .fake-modal-buttons button {
          display: inline-block;
          padding: 6px 16px;
          border: 0;
          border-radius: 999px;
          background: var(--tea);
          color: #fff;
          font: inherit;
        }
      index.html: |
        <!doctype html>
        <html lang="my">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <link rel="icon" href="data:," />
            <title>ရွှေလက်ဖက်ရည်ဆိုင်</title>
            <link rel="stylesheet" href="/base.css" />
            <link rel="stylesheet" href="/styles.css" />
          </head>
          <body>
            <!-- kit block: header (brand only) -->
            <header class="site-header" data-testid="site-header">
              <div class="brand">
                <img class="logo" src="/cup.svg" alt="" width="40" height="40" data-testid="logo" />
                <h1 class="shop-name" data-testid="shop-name">ရွှေလက်ဖက်ရည်ဆိုင်</h1>
              </div>
            </header>

            <main class="page" id="main" data-testid="main">
              <!-- lesson block: an FAQ accordion built from divs (main.js) -->
              <section class="faq-section" data-testid="faq-section">
                <h2>မေးလေ့ရှိတဲ့ မေးခွန်း</h2>
                <div class="accordion" data-testid="faq-old">
                  <div class="accordion-head" id="faq-head" data-testid="faq-old-head">ဖွင့်ချိန်</div>
                  <div class="accordion-body" id="faq-body" hidden data-testid="faq-old-body">နေ့တိုင်း မနက် ၆ နာရီ မှ ည ၈ နာရီ</div>
                </div>
              </section>

              <!-- lesson block: order confirmation with a div "modal" (main.js) -->
              <section class="confirm-section" data-testid="confirm-section">
                <h2>အော်ဒါ</h2>
                <div class="old-confirm" data-testid="old-confirm">
                  <button class="confirm-btn" id="fake-open" type="button" data-testid="fake-open">အော်ဒါ အတည်ပြုမယ်</button>
                  <div class="fake-modal" id="fake-modal" hidden data-testid="fake-modal">
                    <div class="fake-modal-box">
                      <h2>အော်ဒါ အတည်ပြုမလား</h2>
                      <div class="fake-modal-buttons">
                        <button type="button" data-testid="fake-cancel">ပယ်ဖျက်</button>
                        <button type="button" data-testid="fake-ok">အတည်ပြု</button>
                      </div>
                    </div>
                  </div>
                </div>
              </section>
            </main>

            <script type="module" src="/main.js"></script>
            <!-- kit block: panel-script (tree and tab order, scoped to main) -->
            <script type="module" src="/panel.js" data-modes="tree tabs" data-scope="#main" data-height="45"></script>
          </body>
        </html>
      main.js: |
        // div တွေနဲ့ ကိုယ်တိုင် ဆောက်ထားတဲ့ component နှစ်ခု

        // accordion: ခေါင်းစဉ်ကို နှိပ်ရင် အဖြေကို ပြ / ဖျောက်
        const faqHead = document.querySelector("#faq-head");
        const faqBody = document.querySelector("#faq-body");
        faqHead.addEventListener("click", () => {
          faqBody.hidden = !faqBody.hidden;
        });

        // modal: ခလုတ်ကို နှိပ်ရင် div ကို ပြ၊ အထဲက ခလုတ်ကို နှိပ်ရင် ပြန်ဖျောက်
        const fakeModal = document.querySelector("#fake-modal");
        document.querySelector("#fake-open").addEventListener("click", () => {
          fakeModal.hidden = false;
        });
        for (const button of fakeModal.querySelectorAll("button")) {
          button.addEventListener("click", () => {
            fakeModal.hidden = true;
          });
        }
      package.json: |
        {
          "name": "a11y-course-tea-shop",
          "private": true,
          "version": "1.0.0",
          "type": "module",
          "scripts": {
            "dev": "vite --host 0.0.0.0 --port 5173 --strictPort"
          },
          "devDependencies": {
            "dom-accessibility-api": "0.7.1",
            "tabbable": "6.5.0",
            "vite": "5.4.21"
          }
        }
      panel.js: |
        // panel.js: the course's A11y panel. Pinned, never typed, never edited.
        // It shows what assistive technology gets from the page, as real DOM in a
        // drawer at the bottom of the preview, so the recorded lesson replays it.
        //
        //   <script type="module" src="/panel.js" data-modes="tree tabs" data-scope="#order"></script>
        //
        //   data-modes     any of: tree tabs contrast live axe (drawn in that order)
        //   data-scope     CSS selector; tree, contrast, live and axe look only inside
        //                  it, tabs keeps page-wide numbers but lists only stops inside
        //   data-height    drawer height, % of the preview height (20-60, default 40)
        //   data-axe-tags  axe rule tags to run (default: axe's default rules)
        //
        // A row for an element with data-testid="x" gets data-testid="a11y-x" (tree),
        // "tab-x" (tabs) or "contrast-x" (COURSE-KIT.md lists every test id). The
        // panel is inert: never focusable, never in the accessibility tree, never in
        // its own results. It rewrites a section only when its text changes. Names
        // come from dom-accessibility-api (W3C accname), tab stops from tabbable,
        // roles from Chrome's mapping of HTML elements.

        import { computeAccessibleDescription, computeAccessibleName } from "dom-accessibility-api";
        import { isFocusable, tabbable } from "tabbable";

        const tag = document.querySelector('script[src*="panel.js"]');
        const config = {
          modes: (tag?.dataset.modes || "tree").split(/\s+/).filter((m) => ["tree", "tabs", "contrast", "live", "axe"].includes(m)),
          scope: tag?.dataset.scope || "",
          height: Math.min(60, Math.max(20, Number(tag?.dataset.height) || 40)),
          axeTags: (tag?.dataset.axeTags || "").split(/\s+/).filter(Boolean),
        };
        const on = (mode) => config.modes.includes(mode);
        const words = (text) => new Set(text.split(" "));

        // ---------------------------------------------------------------- roles

        const TAG_ROLES = {
          article: "article", aside: "complementary", blockquote: "blockquote", button: "button", dialog: "dialog",
          dd: "definition", details: "group", dl: "list", dt: "term", fieldset: "group", figure: "figure", hr: "separator",
          iframe: "iframe", li: "listitem",
          main: "main", menu: "list", meter: "meter", nav: "navigation", ol: "list", optgroup: "group", option: "option",
          output: "status", p: "paragraph", progress: "progressbar", search: "search", summary: "button", table: "table",
          textarea: "textbox", tr: "row", ul: "list", h1: "heading", h2: "heading", h3: "heading", h4: "heading",
          h5: "heading", h6: "heading",
        };
        const INPUT_ROLES = {
          button: "button", submit: "button", reset: "button", image: "button", checkbox: "checkbox", radio: "radio",
          range: "slider", number: "spinbutton", search: "searchbox", hidden: "none",
        };
        // Roles that get a row; paragraph and generic get one only with lang, aria-live or focus.
        const ROWS = words(
          "alert alertdialog article banner blockquote button cell checkbox columnheader combobox complementary " +
            "contentinfo dialog figure form grid gridcell group heading iframe img link list listbox listitem log main " +
            "menu menubar menuitem menuitemcheckbox menuitemradio meter navigation option progressbar radio radiogroup " +
            "region row rowheader search searchbox separator slider spinbutton status switch tab table tablist tabpanel " +
            "term definition textbox timer toolbar tooltip tree treeitem",
        );
        // Roles that must have an accessible name ("⚠ no name").
        const NEEDS_NAME = words(
          "button link img iframe dialog alertdialog checkbox radio switch textbox searchbox combobox listbox slider " +
            "spinbutton tab menuitem menuitemcheckbox menuitemradio treeitem option region form progressbar meter",
        );
        // Controls: one that cannot take focus gets "⚠ not focusable".
        const INTERACTIVE = words(
          "button link checkbox radio switch textbox searchbox combobox listbox slider spinbutton tab menuitem " +
            "menuitemcheckbox menuitemradio treeitem",
        );
        // Roles whose children are presentational: the row stands for the whole control.
        const LEAF = words("button checkbox radio switch img textbox searchbox spinbutton slider progressbar meter separator iframe tab");
        // Roles that never take a name, so the panel skips computing one.
        const UNNAMED = words("list listitem row paragraph generic separator blockquote term definition");

        const explicitRole = (el) => (el.getAttribute("role") || "").trim().split(/\s+/)[0].toLowerCase();
        const hasName = (el) => el.hasAttribute("aria-label") || el.hasAttribute("aria-labelledby") || el.hasAttribute("title");
        const outsideSections = (el) => !el.parentElement?.closest("article, aside, main, nav, section");

        function focusable(el) {
          try {
            return isFocusable(el);
          } catch {
            return false;
          }
        }

        function roleOf(el) {
          const role = explicitRole(el);
          // An author cannot take the role away from something focusable or named.
          if (role === "none" || role === "presentation") return focusable(el) || hasName(el) ? implicitRole(el) : "none";
          return role || implicitRole(el);
        }

        function implicitRole(el) {
          const tagName = el.localName;
          const cellsHidden = () => ["none", "presentation"].includes(explicitRole(el.closest("table") || el));
          switch (tagName) {
            case "a":
            case "area":
              return el.hasAttribute("href") ? "link" : "generic";
            case "img":
              return el.getAttribute("alt") === "" && !hasName(el) ? "none" : "img";
            case "svg":
              return hasName(el) || el.querySelector(":scope > title") ? "img" : "none";
            case "input":
              return INPUT_ROLES[el.type] || (el.hasAttribute("list") ? "combobox" : "textbox");
            case "select":
              return el.multiple || el.size > 1 ? "listbox" : "combobox";
            case "header":
              return outsideSections(el) ? "banner" : "generic";
            case "footer":
              return outsideSections(el) ? "contentinfo" : "generic";
            case "section":
              return hasName(el) ? "region" : "generic";
            case "form":
              return hasName(el) ? "form" : "generic";
            case "li":
              return el.parentElement?.matches("ul, ol, menu") ? "listitem" : "generic";
            case "tr":
              return cellsHidden() ? "generic" : "row";
            case "td":
              return cellsHidden() ? "generic" : el.closest("[role=grid], [role=treegrid]") ? "gridcell" : "cell";
            case "th": {
              if (cellsHidden()) return "generic";
              const scope = el.getAttribute("scope");
              if (scope === "row" || scope === "rowgroup") return "rowheader";
              if (scope === "col" || scope === "colgroup" || el.closest("thead")) return "columnheader";
              const firstOfDataRow = el.parentElement?.firstElementChild === el && el.parentElement.querySelector(":scope > td");
              return firstOfDataRow ? "rowheader" : "columnheader";
            }
            default:
              return TAG_ROLES[tagName] || "generic";
          }
        }

        // ---------------------------------------------------------------- names and states

        const squash = (text) => (text || "").replace(/\s+/g, " ").trim();
        const segmenter = new Intl.Segmenter();
        function clip(text, max) {
          const graphemes = Array.from(segmenter.segment(text), (part) => part.segment);
          return graphemes.length > max ? `${graphemes.slice(0, max - 1).join("")}…` : text;
        }

        function nameOf(el) {
          let name = "";
          try {
            name = squash(computeAccessibleName(el, { computedStyleSupportsPseudoElements: true }));
          } catch {}
          if (name) return { name, from: "" };
          // Two HTML-AAM rules Chrome follows and accname leaves out.
          if (el.localName === "figure") return { name: squash(el.querySelector(":scope > figcaption")?.textContent), from: "" };
          const placeholder = /^(input|textarea)$/.test(el.localName) ? squash(el.getAttribute("placeholder")) : "";
          return placeholder ? { name: placeholder, from: "from placeholder" } : { name: "", from: "" };
        }

        function statesOf(el, role) {
          const states = [];
          const aria = (name) => el.getAttribute(`aria-${name}`);
          const summary = el.localName === "summary";
          if (aria("expanded") === "true" || (summary && el.parentElement?.open)) states.push("expanded");
          else if (aria("expanded") === "false" || summary) states.push("collapsed");
          if (aria("pressed")) states.push({ true: "pressed", false: "not pressed", mixed: "mixed" }[aria("pressed")] || "");
          if (["checkbox", "radio", "switch", "menuitemcheckbox", "menuitemradio"].includes(role)) {
            const native = el instanceof HTMLInputElement;
            const mixed = native ? el.indeterminate : aria("checked") === "mixed";
            states.push(mixed ? "mixed" : (native ? el.checked : aria("checked") === "true") ? "checked" : "not checked");
          }
          if (aria("selected") === "true" || (el instanceof HTMLOptionElement && el.selected)) states.push("selected");
          if (aria("current") && aria("current") !== "false") states.push(`current=${aria("current")}`);
          if (el.hasAttribute("required") || aria("required") === "true") states.push("required");
          if (["true", "grammar", "spelling"].includes(aria("invalid"))) states.push("invalid");
          if (el.hasAttribute("readonly") || aria("readonly") === "true") states.push("readonly");
          const disabled = el.matches(":disabled") || aria("disabled") === "true";
          if (disabled) states.push("disabled");
          const canFocus = focusable(el);
          if (canFocus && !INTERACTIVE.has(role) && role !== "iframe") states.push("focusable");
          if (!canFocus && !disabled && INTERACTIVE.has(role)) states.push("⚠ not focusable");
          if (el === activeElement()) states.push("focused");
          if (aria("live") && aria("live") !== "off") states.push(`live=${aria("live")}`);
          return states.filter(Boolean);
        }

        function activeElement() {
          const el = document.activeElement;
          return el && el !== document.body && el !== document.documentElement && !host.contains(el) ? el : null;
        }

        function openModal() {
          try {
            return document.querySelector("dialog:modal");
          } catch {
            return null;
          }
        }

        function scopeRoot() {
          try {
            return (config.scope && document.querySelector(config.scope)) || document.body;
          } catch {
            return document.body;
          }
        }

        // ---------------------------------------------------------------- tree

        function describe(el, role) {
          const states = statesOf(el, role);
          const extra = el.hasAttribute("lang") || states.some((s) => s === "focusable" || s === "focused" || s.startsWith("live="));
          if (role === "none" || !(ROWS.has(role) || extra)) return null;
          const { name, from } = UNNAMED.has(role) ? { name: "", from: "" } : nameOf(el);
          const level = role === "heading" ? Number(el.getAttribute("aria-level")) || Number(el.localName.slice(1)) || 2 : 0;
          const parts = [{ cls: "role", text: level ? `heading level ${level}` : role }];
          if (name) parts.push({ cls: "name", text: `"${clip(name, 60)}"` });
          else if (NEEDS_NAME.has(role)) parts.push({ cls: "warn", text: "⚠ no name" });
          if (from) parts.push({ cls: "muted", text: from });
          if (role === "list" && el.localName !== "dl") {
            const items = Array.from(el.children).filter((c) => c.localName === "li" || explicitRole(c) === "listitem");
            parts.push({ cls: "muted", text: `${items.length} ${items.length === 1 ? "item" : "items"}` });
          }
          for (const state of states) parts.push({ cls: state.startsWith("⚠") ? "warn" : "state", text: state });
          if (el.hasAttribute("aria-describedby")) {
            let description = "";
            try {
              description = squash(computeAccessibleDescription(el));
            } catch {}
            if (description) parts.push({ cls: "muted", text: `desc "${clip(description, 40)}"` });
          }
          if (el.hasAttribute("lang")) parts.push({ cls: "state", text: `lang="${el.getAttribute("lang")}"` });
          if (!name && ["paragraph", "generic", "blockquote", "status", "alert", "log", "term", "definition"].includes(role) && squash(el.textContent)) {
            parts.push({ cls: "muted", text: `· ${clip(squash(el.textContent), 40)}` });
          }
          const warnings = parts.filter((part) => part.cls === "warn").length;
          return { role, name, states, parts, warnings, testid: el.getAttribute("data-testid") };
        }

        function buildTree() {
          const rows = [];
          const visit = (el, depth) => {
            if (el === host || /^(script|style|template|noscript|head|title|meta|link)$/.test(el.localName)) return;
            if (el.getAttribute("aria-hidden") === "true" || el.hasAttribute("inert")) return;
            const style = getComputedStyle(el);
            if (style.display === "none") return;
            let childDepth = depth;
            if (style.visibility === "visible" && el !== document.body) {
              const role = roleOf(el);
              const row = describe(el, role);
              if (row) {
                rows.push({ ...row, depth });
                childDepth = depth + 1;
                if (LEAF.has(role)) return;
              }
            }
            if (el.localName === "svg" || el.localName === "select") return;
            for (const child of el.children) visit(child, childDepth);
          };
          // While a modal dialog is open, everything outside it is inert.
          visit(openModal() || scopeRoot(), 0);
          return { rows, title: squash(document.title), lang: document.documentElement.getAttribute("lang") || "" };
        }

        function renderTree({ rows, title, lang }) {
          const warnings = rows.reduce((sum, r) => sum + r.warnings, 0) + (title ? 0 : 1) + (lang ? 0 : 1);
          const label = warnings ? `Accessibility tree · ⚠ ${warnings} ${warnings === 1 ? "warning" : "warnings"}` : "Accessibility tree · no warnings";
          const head = row({ testid: "a11y-summary", head: true, attrs: { "data-warnings": warnings } }, [{ text: label }]);
          const doc = row({ testid: "a11y-document", depth: 0, attrs: { "data-title": title, "data-lang": lang } }, [
            { cls: "role", text: "document" },
            title ? { cls: "name", text: `"${clip(title, 50)}"` } : { cls: "warn", text: "⚠ no title" },
            lang ? { cls: "state", text: `lang="${lang}"` } : { cls: "warn", text: "⚠ no lang" },
          ]);
          const body = rows.map((r) =>
            row(
              {
                testid: r.testid && `a11y-${r.testid}`,
                depth: r.depth + 1,
                focused: r.states.includes("focused"),
                attrs: { "data-name": r.name, "data-states": r.states.join(" ") },
              },
              r.parts,
            ),
          );
          return [head, doc, ...body];
        }

        // ---------------------------------------------------------------- tabs

        function tabStops() {
          let stops = [];
          try {
            stops = tabbable(openModal() || document.body, { displayCheck: "full" });
          } catch {}
          // A radio group with nothing checked is one stop (its first radio), as in Chrome.
          const groups = new Set();
          return stops.filter((el) => {
            if (!(el instanceof HTMLInputElement) || el.type !== "radio" || !el.name) return true;
            const group = Array.from((el.form || document).querySelectorAll("input[type=radio]")).filter((r) => r.name === el.name);
            if (group.some((r) => r.checked)) return true;
            if (groups.has(group[0])) return false;
            groups.add(group[0]);
            return true;
          });
        }

        let marked = new Map();
        function buildTabs() {
          const scope = openModal() || (config.scope ? scopeRoot() : null);
          const stops = tabStops().map((el, index) => {
            const rect = el.getBoundingClientRect();
            const text = squash(el.textContent);
            return {
              el,
              order: index + 1,
              role: roleOf(el),
              name: nameOf(el).name,
              text,
              testid: el.getAttribute("data-testid"),
              ariaHidden: Boolean(el.closest('[aria-hidden="true"]')),
              focused: el === activeElement(),
              x: Math.round(rect.left + scrollX),
              y: Math.round(rect.top + scrollY),
              listed: !scope || scope.contains(el),
            };
          });
          // data-a11y-tab="n" on a listed stop is what its badge anchors to.
          const next = new Map(stops.filter((s) => s.listed && s.order <= 60).map((s) => [s.el, String(s.order)]));
          for (const el of marked.keys()) if (!next.has(el)) el.removeAttribute("data-a11y-tab");
          for (const [el, order] of next) if (el.getAttribute("data-a11y-tab") !== order) el.setAttribute("data-a11y-tab", order);
          marked = next;
          return stops;
        }

        function renderTabs(stops) {
          const head = row({ testid: "tab-count", head: true, attrs: { "data-count": stops.length } }, [
            { text: `Tab order · ${stops.length} stops` },
          ]);
          const items = stops
            .filter((s) => s.listed)
            .map((s) => {
              const parts = [{ cls: "order", text: String(s.order) }, { cls: "role", text: s.role }];
              if (s.name) parts.push({ cls: "name", text: `"${clip(s.name, 50)}"` });
              else if (NEEDS_NAME.has(s.role)) parts.push({ cls: "warn", text: "⚠ no name" });
              else if (s.text) parts.push({ cls: "muted", text: `· ${clip(s.text, 40)}` });
              if (s.ariaHidden) parts.push({ cls: "warn", text: "⚠ aria-hidden" });
              if (s.focused) parts.push({ cls: "state", text: "focused" });
              return row({ testid: s.testid && `tab-${s.testid}`, depth: 0, focused: s.focused, attrs: { "data-order": s.order } }, parts);
            });
          return [head, ...(items.length ? items : [row({}, [{ cls: "muted", text: "(no tab stops here)" }])])];
        }

        // Studio cannot press keys, so a lesson clicks two hidden panel controls
        // (preview.click on a11y-tab-next / a11y-tab-prev) to move focus the way Tab
        // and Shift+Tab do. Past the last stop focus leaves the page (body).
        function moveFocus(step) {
          const stops = tabStops();
          const active = activeElement();
          let next = active ? null : step > 0 ? stops[0] : stops.at(-1);
          if (active) {
            let index = stops.indexOf(active);
            if (index === -1) {
              // Focus sits outside the order: continue from its place in the page.
              const after = stops.findIndex((el) => active.compareDocumentPosition(el) & Node.DOCUMENT_POSITION_FOLLOWING);
              index = (after === -1 ? stops.length : after) - (step > 0 ? 1 : 0);
            }
            next = stops[index + step];
          }
          if (next) next.focus();
          else active?.blur();
        }

        const renderBadges = (stops) =>
          stops
            .filter((s) => s.listed)
            .map(
              (s) =>
                `<span class="a11yp-badge${s.focused ? " is-focused" : ""}" style="--x:${s.x}px;--y:${s.y}px;position-anchor:--a11yp-${s.order}">${s.order}</span>`,
            );

        // ---------------------------------------------------------------- contrast

        const canvas = document.createElement("canvas").getContext("2d", { willReadFrequently: true });
        function parseColor(value) {
          const match = /^rgba?\(([^)]+)\)$/.exec(value || "");
          if (match) {
            const [r, g, b, a = 1] = match[1].split(/[\s,/]+/).filter(Boolean).map(Number);
            return { r, g, b, a };
          }
          // oklch(), color(), color-mix() and friends: let a 1px canvas convert them.
          canvas.clearRect(0, 0, 1, 1);
          canvas.fillStyle = "#000";
          canvas.fillStyle = value;
          canvas.fillRect(0, 0, 1, 1);
          const [r, g, b, a] = canvas.getImageData(0, 0, 1, 1).data;
          return { r, g, b, a: a / 255 };
        }

        const over = (top, below) => ({
          r: top.r * top.a + below.r * (1 - top.a),
          g: top.g * top.a + below.g * (1 - top.a),
          b: top.b * top.a + below.b * (1 - top.a),
          a: 1,
        });

        // The colour behind an element: its own and its ancestors' background colours
        // stacked on a white canvas. Background images and opacity are not counted.
        function backgroundOf(el) {
          const layers = [];
          let image = false;
          for (let node = el; node instanceof Element; node = node.parentElement) {
            const style = getComputedStyle(node);
            image ||= style.backgroundImage !== "none";
            layers.push(parseColor(style.backgroundColor));
            if (layers.at(-1).a >= 1) break;
          }
          return { color: layers.reduceRight((below, layer) => over(layer, below), { r: 255, g: 255, b: 255, a: 1 }), image };
        }

        function luminance({ r, g, b }) {
          const linear = (v) => (v / 255 <= 0.04045 ? v / 255 / 12.92 : ((v / 255 + 0.055) / 1.055) ** 2.4);
          return 0.2126 * linear(r) + 0.7152 * linear(g) + 0.0722 * linear(b);
        }

        const hex = (c) => `#${[c.r, c.g, c.b].map((v) => Math.round(v).toString(16).padStart(2, "0")).join("")}`;

        function buildContrast() {
          const root = scopeRoot();
          const targets = [...(root.matches("[data-contrast]") ? [root] : []), ...root.querySelectorAll("[data-contrast]")];
          return targets.map((el) => {
            const style = getComputedStyle(el);
            const border = el.dataset.contrast === "border";
            const label = el.dataset.contrastLabel || clip(squash(el.textContent) || nameOf(el).name || el.localName, 18);
            const item = { testid: el.getAttribute("data-testid"), label, border };
            if (!el.getClientRects().length) return { ...item, hidden: true };
            const behind = backgroundOf(border ? el.parentElement || el : el);
            const side = ["Top", "Right", "Bottom", "Left"].find((s) => parseFloat(style[`border${s}Width`]) > 0);
            const ink = border ? (side ? parseColor(style[`border${side}Color`]) : behind.color) : parseColor(style.color);
            const fg = over(ink, behind.color);
            const [high, low] = [luminance(fg), luminance(behind.color)].sort((x, y) => y - x);
            const ratio = (high + 0.05) / (low + 0.05);
            const size = parseFloat(style.fontSize);
            const large = size >= 24 || (size >= 18.66 && Number(style.fontWeight) >= 700);
            // Compare the exact ratio, show it cut (not rounded) to 2 places: 4.499 shows 4.49 and fails.
            const shown = (Math.floor(ratio * 100 + 1e-9) / 100).toFixed(2);
            return { ...item, shown, large, fg: hex(fg), bg: hex(behind.color), image: behind.image, aa: ratio >= (border || large ? 3 : 4.5), aaa: ratio >= (large ? 4.5 : 7) };
          });
        }

        function renderContrast(items) {
          const rows = items.map((item) => {
            const parts = [{ cls: "name", text: `"${item.label}"` }];
            const attrs = {};
            const verdict = (ok, prefix) => ({ cls: ok ? "pass" : "warn", text: `${prefix}${ok ? "pass" : "fail"}` });
            if (item.hidden) parts.push({ cls: "muted", text: "not rendered" });
            else if (item.border) {
              Object.assign(attrs, { "data-ratio": item.shown, "data-aa": item.aa ? "pass" : "fail" });
              parts.push({ cls: "role", text: "border" }, { cls: "order", text: `${item.shown}:1` }, { cls: "muted", text: "needs 3:1" }, verdict(item.aa, ""));
            } else {
              Object.assign(attrs, { "data-ratio": item.shown, "data-aa": item.aa ? "pass" : "fail", "data-aaa": item.aaa ? "pass" : "fail" });
              parts.push({ cls: "order", text: `${item.shown}:1` }, verdict(item.aa, "AA "), verdict(item.aaa, "AAA "));
              if (item.large) parts.push({ cls: "muted", text: "large text" });
            }
            if (item.image) parts.push({ cls: "warn", text: "⚠ background image: check by eye" });
            const swatches = item.hidden ? "" : `<span class="a11yp-swatch" style="background:${item.fg}"></span><span class="a11yp-swatch" style="background:${item.bg}"></span>`;
            return row({ testid: item.testid && `contrast-${item.testid}`, depth: 0, attrs, prefix: swatches }, parts);
          });
          const head = row({ head: true }, [{ text: "Contrast (WCAG 2)" }]);
          return [head, ...(rows.length ? rows : [row({}, [{ cls: "muted", text: "(mark elements with data-contrast)" }])])];
        }

        // ---------------------------------------------------------------- live regions

        // A simplified screen reader: it speaks a change to a live region that was
        // already on the page, never the text a region arrives with (except an alert).
        const liveState = new WeakMap();
        const liveLog = [];
        let liveCount = 0;
        let liveBaseline = false;

        function scanLive() {
          if (!on("live")) return false;
          let changed = false;
          for (const el of scopeRoot().querySelectorAll("[aria-live], [role~=status], [role~=alert], [role~=log], output")) {
            const alert = /\balert\b/.test(el.getAttribute("role") || "");
            const politeness = el.getAttribute("aria-live") || (alert ? "assertive" : "polite");
            const present = !el.closest('[hidden], [aria-hidden="true"], [inert]') && el.checkVisibility();
            const now = { present, text: squash(el.innerText) };
            const before = liveState.get(el);
            liveState.set(el, now);
            if (!liveBaseline || politeness === "off" || !now.present || !now.text) continue;
            if (before?.present ? before.text === now.text : !alert) continue;
            liveCount += 1;
            liveLog.push({ n: liveCount, politeness, text: now.text });
            if (liveLog.length > 6) liveLog.shift();
            changed = true;
          }
          liveBaseline = true;
          return changed;
        }

        function renderLive() {
          const head = row({ testid: "live-count", head: true, attrs: { "data-count": liveCount } }, [
            { text: "Live regions · likely spoken (simplified)" },
          ]);
          const rows = liveLog.map((entry) =>
            row({ testid: `live-${entry.n}`, depth: 0 }, [
              { cls: "order", text: String(entry.n) },
              { cls: entry.politeness === "assertive" ? "warn" : "state", text: entry.politeness },
              { cls: "name", text: `"${clip(entry.text, 60)}"` },
            ]),
          );
          return [head, ...(rows.length ? rows : [row({}, [{ cls: "muted", text: "(nothing announced yet)" }])])];
        }

        // ---------------------------------------------------------------- axe (base-axe workspaces: axe.js sets window.a11yPanelAxe)

        const axeRun = { running: false, again: false, timer: 0, state: null };

        function scheduleAxe(delay = 700) {
          if (!on("axe") || !window.a11yPanelAxe) return;
          clearTimeout(axeRun.timer);
          axeRun.timer = setTimeout(runAxe, delay);
        }

        async function runAxe() {
          const axe = window.a11yPanelAxe;
          if (axeRun.running) return void (axeRun.again = true);
          axeRun.running = true;
          try {
            const context = { exclude: [["#a11y-panel"]], ...(config.scope && { include: [[config.scope]] }) };
            const options = { resultTypes: ["violations"], ...(config.axeTags.length && { runOnly: { type: "tag", values: config.axeTags } }) };
            const { violations } = await axe.run(context, options);
            axeRun.state = { violations: violations.map((v) => ({ id: v.id, impact: v.impact || "minor", help: v.help, nodes: v.nodes.length })) };
          } catch (error) {
            axeRun.state = { error: String(error?.message || error) };
          }
          axeRun.running = false;
          render();
          if (axeRun.again) {
            axeRun.again = false;
            scheduleAxe(300);
          }
        }

        function renderAxe() {
          const { state } = axeRun;
          const version = window.a11yPanelAxe?.version;
          if (!version) return [row({ head: true }, [{ text: "axe · not installed in this lesson" }])];
          if (!state || state.error) {
            return [row({ testid: "axe-count", head: true }, [state ? { cls: "warn", text: `axe error: ${clip(state.error, 60)}` } : { text: "axe · running…" }])];
          }
          const impact = { critical: 0, serious: 1, moderate: 2, minor: 3 };
          const issues = state.violations.length;
          const head = row({ testid: "axe-count", head: true, attrs: { "data-count": issues } }, [
            { text: `axe-core ${version} · ${issues ? `${issues} ${issues === 1 ? "issue" : "issues"}` : "no issues"}` },
          ]);
          const rows = state.violations
            .sort((a, b) => impact[a.impact] - impact[b.impact] || a.id.localeCompare(b.id))
            .map((v) =>
              row({ testid: `axe-${v.id}`, depth: 0, attrs: { "data-count": v.nodes } }, [
                { cls: impact[v.impact] < 2 ? "warn" : "state", text: v.impact },
                { cls: "role", text: v.id },
                { cls: "order", text: `×${v.nodes}` },
                { cls: "muted", text: v.help },
              ]),
            );
          return [head, ...rows];
        }

        // ---------------------------------------------------------------- drawing

        const escape = (text) => String(text).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

        // One row. Its textContent is the parts joined by single spaces, exactly as
        // it reads, so expect.preview's textContains matches what learners see.
        function row({ testid, head = false, depth = -1, focused = false, attrs = {}, prefix = "" }, parts) {
          const classes = `a11yp-row${head ? " a11yp-head" : ""}${focused ? " is-focused" : ""}`;
          const extra = Object.entries(attrs).map(([key, value]) => ` ${key}="${escape(value)}"`).join("");
          const id = testid ? ` data-testid="${escape(testid)}"` : "";
          const indent = depth >= 0 ? ` style="--d:${Math.min(depth, 8)}"` : "";
          const spans = parts.map((p) => (p.cls ? `<span class="a11yp-${p.cls}">${escape(p.text)}</span>` : escape(p.text))).join(" ");
          return `<div class="${classes}"${id}${indent}${extra}>${prefix}${spans}</div>`;
        }

        const C = { bg: "#202124", head: "#303134", text: "#e8eaed", role: "#aecbfa", name: "#fdd663", state: "#d7aefb", muted: "#bdc1c6", warn: "#f6aea9", pass: "#a8dab5", focus: "#123a6e", ring: "#8ab4f8" };
        const P = "#a11y-panel";
        const CSS = `
        :where(html){scroll-padding-bottom:calc(${config.height}vh + 16px)}
        ${P} .a11yp-spacer{display:block;height:${config.height}vh}
        ${P} .a11yp-drawer{position:fixed;inset:auto 0 0 0;z-index:2147483001;box-sizing:border-box;height:${config.height}vh;margin:0;padding:0 0 8px;overflow:auto;overscroll-behavior:contain;background:${C.bg};color:${C.text};border-top:3px solid ${C.ring};font:14px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans Myanmar","Myanmar Sangam MN","Myanmar MN","Myanmar Text",Padauk,monospace;text-align:start;letter-spacing:normal;text-transform:none;font-style:normal}
        ${P} .a11yp-row{display:block;margin:0;padding:1px 8px 1px calc(8px + var(--d,0) * 14px);border-left:4px solid transparent;overflow-wrap:anywhere}
        ${P} .a11yp-head{position:sticky;top:0;z-index:1;padding-left:8px;background:${C.head};font-weight:700}
        ${P} .a11yp-row.is-focused{background:${C.focus};border-left-color:${C.ring}}
        ${P} .a11yp-role{color:${C.role}} ${P} .a11yp-name{color:${C.name}} ${P} .a11yp-state{color:${C.state}}
        ${P} .a11yp-muted{color:${C.muted}} ${P} .a11yp-pass{color:${C.pass}} ${P} .a11yp-order{font-weight:700}
        ${P} .a11yp-warn{color:${C.warn};font-weight:700}
        ${P} .a11yp-swatch{display:inline-block;width:12px;height:12px;margin-right:4px;border:1px solid ${C.muted};vertical-align:middle}
        ${P} .a11yp-badges{display:block;position:static;height:0}
        ${P} .a11yp-badge{position:absolute;z-index:2147483000;top:var(--y);left:var(--x);box-sizing:border-box;min-width:20px;height:20px;margin:-8px 0 0 -8px;padding:0 4px;border-radius:10px;background:#174ea6;color:#fff;font:700 13px/20px ui-monospace,Menlo,monospace;text-align:center;box-shadow:0 0 0 2px #fff;pointer-events:none}
        ${P} .a11yp-badge.is-focused{background:#b3261e}
        @supports (anchor-name: --a){${P} .a11yp-badge{top:anchor(top,var(--y));left:anchor(left,var(--x));position-visibility:anchors-visible}}
        ${Array.from({ length: 60 }, (_, i) => `[data-a11y-tab="${i + 1}"]{anchor-name:--a11yp-${i + 1}}`).join("")}`;

        const host = document.createElement("div");
        host.id = "a11y-panel";
        host.inert = true;
        host.innerHTML =
          `<style>${CSS}</style><div class="a11yp-badges"></div><div class="a11yp-spacer"></div>` +
          `<span hidden data-step="1" data-testid="a11y-tab-next"></span><span hidden data-step="-1" data-testid="a11y-tab-prev"></span>` +
          `<div class="a11yp-drawer" data-testid="a11y-panel">` +
          `${config.modes.map((mode) => `<div data-mode="${mode}"></div>`).join("")}</div>`;
        document.body.append(host);
        const drawer = host.querySelector(".a11yp-drawer");
        const badges = host.querySelector(".a11yp-badges");
        const sections = Object.fromEntries(Array.from(drawer.children, (el) => [el.dataset.mode, el]));
        const written = new Map();

        // Rewrite only the rows whose text changed (a focus move touches two rows);
        // a change in the number of rows redraws the section.
        function write(el, rows) {
          const before = written.get(el) || [];
          written.set(el, rows);
          if (before.length !== rows.length || el.children.length !== rows.length) el.innerHTML = rows.join("");
          else rows.forEach((html, i) => html !== before[i] && (el.children[i].outerHTML = html));
        }

        // Keep the focused row and the newest announcement in view inside the drawer.
        let shown = { focus: null, live: 0 };
        function reveal() {
          const focus = activeElement();
          let target = null;
          if (focus !== shown.focus) target = drawer.querySelector(".is-focused");
          if (liveCount !== shown.live) target = drawer.querySelector(`[data-testid="live-${liveCount}"]`);
          shown = { focus, live: liveCount };
          if (!target) return;
          const headHeight = target.parentElement.firstElementChild.offsetHeight;
          const top = target.offsetTop - headHeight;
          const bottom = target.offsetTop + target.offsetHeight - drawer.clientHeight;
          if (top < drawer.scrollTop) drawer.scrollTop = top;
          else if (bottom > drawer.scrollTop) drawer.scrollTop = bottom + 8;
        }

        function render() {
          try {
            if (on("tree")) write(sections.tree, renderTree(buildTree()));
            if (on("tabs")) {
              const stops = buildTabs();
              write(sections.tabs, renderTabs(stops));
              write(badges, renderBadges(stops));
            }
            if (on("contrast")) write(sections.contrast, renderContrast(buildContrast()));
            if (on("live")) write(sections.live, renderLive());
            if (on("axe")) write(sections.axe, renderAxe());
            reveal();
          } catch {
            // The panel must never break a lesson; the next tick tries again.
          }
        }

        // ---------------------------------------------------------------- updates

        let timer = 0;
        const schedule = (delay = 40) => {
          clearTimeout(timer);
          timer = setTimeout(render, delay);
        };

        new MutationObserver((records) => {
          if (!records.some((r) => !host.contains(r.target) && r.attributeName !== "data-a11y-tab")) return;
          scanLive();
          schedule();
          if (!axeRun.running) scheduleAxe();
        }).observe(document.documentElement, { subtree: true, childList: true, attributes: true, characterData: true });

        document.addEventListener("focusin", () => schedule(0), true);
        document.addEventListener("focusout", () => schedule(0), true);
        // A CSS edit swaps the stylesheet <link>; its load (and image loads) can change contrast and layout.
        document.addEventListener("load", () => (schedule(), scheduleAxe()), true);
        addEventListener("resize", () => schedule(100));
        addEventListener("a11y-panel-axe", () => scheduleAxe(0));
        host.addEventListener("click", (event) => {
          const step = Number(event.target.closest?.("[data-step]")?.dataset.step);
          if (step) moveFocus(step);
        });
        // The drawer is inert, so the wheel would scroll the page under it; scroll the drawer instead.
        addEventListener(
          "wheel",
          (event) => {
            if (event.clientY < drawer.getBoundingClientRect().top) return;
            event.preventDefault();
            drawer.scrollTop += event.deltaMode === 1 ? event.deltaY * 16 : event.deltaY;
          },
          { passive: false },
        );

        // A cheap periodic pass catches what no event reports (a style change that
        // hides something or changes a colour). Timers, not animation frames: frames
        // never run in a hidden tab.
        (function tick() {
          if (scanLive()) schedule(0);
          render();
          setTimeout(tick, 600);
        })();
        scheduleAxe(0);
