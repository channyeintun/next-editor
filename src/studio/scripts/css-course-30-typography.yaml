build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 4130

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  - id: fonts-intro
    chapter: "Font face နဲ့ font family"
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ list marker တွေကို ပုံစံ ပြောင်းပြီး၊ counter တွေနဲ့ ရေတွက်ခဲ့ပါတယ်။ ဒီ lesson
      မှာတော့ စာသားဆီ ဆက်သွားပြီး၊ font ကနေ စကြည့်ပါမယ်။ page ရဲ့ အများစုက စာသား ဖြစ်လို့၊ font တစ်ခု
      ပြောင်းရုံနဲ့ page တစ်ခုလုံး ဖတ်ရတာ ပြောင်းသွားပါတယ်။ [[mark:start-server]] ဒီလို ပြောနေတုန်းမှာပဲ၊
      board နောက်မှာ dev server ကို စ နေပါပြီ။ [[mark:draw-define]] font ကို သုံးဖို့ အပိုင်း နှစ်ပိုင်း
      ရှိပါတယ်။ font face ဆိုတဲ့ at-rule က font ကို နာမည် ပေးပြီး၊ ဖိုင်တွေ ဘယ်မှာ ရှိလဲ browser ကို
      ပြောပြပါတယ်။ [[mark:draw-use]] font family property ကတော့ font ကို သုံးတဲ့ဘက်ပါ။ element မှာ
      ပေးပြီး၊ font နာမည် စာရင်း တစ်ခုကို ယူပါတယ်။ [[mark:draw-stack]] စာရင်းထဲက နာမည်က စက်ထဲမှာ ရှိတဲ့
      font၊ font face rule နဲ့ သတ်မှတ်ထားတဲ့ font၊ ဒါမှမဟုတ် sans serif လို font အမျိုးအစား တစ်ခုလုံးကို
      ခေါ်တဲ့ generic family ဖြစ်နိုင်ပါတယ်။ [[mark:draw-fallback]] browser က ပထမ font ကို အရင် ရှာပြီး၊
      မရှိရင် နောက် တစ်ခုကို ဆက်ရှာပါတယ်။ ဒီလို ရှာတာကို စာလုံး တစ်လုံးချင်းစီအတွက် လုပ်တာ ဖြစ်ပြီး၊ ခဏနေ
      မြင်ရပါမယ်။
    sources:
      - title: "web.dev Learn CSS — Typography"
        url: "https://web.dev/learn/css/typography"
      - title: "web.dev Learn CSS — Typography: @font-face and font-family"
        url: "https://web.dev/learn/css/typography#font-face-family"
      - title: "MDN — @font-face"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/@font-face"
      - title: "MDN — font-family"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/font-family"
    actions:
      - id: open-intro-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      # Runs in the background (boot + pnpm install + spawn); waitForReady sits
      # on the preview mark in the code tour, well over 40 s of narration later.
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 45000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-define
        type: whiteboard.apply
        at: { mark: draw-define }
        upsertIds: [a-def-box, a-def-h, a-def-1, a-def-2]
        drawMs: 2400
      - id: draw-use
        type: whiteboard.apply
        at: { mark: draw-use }
        upsertIds: [a-arrow, a-use-box, a-use-h, a-use-1, a-use-2]
        drawMs: 2600
      - id: draw-stack
        type: whiteboard.apply
        at: { mark: draw-stack }
        upsertIds: [a-stack]
        drawMs: 1800
      - id: draw-fallback
        type: whiteboard.apply
        at: { mark: draw-fallback }
        upsertIds: [a-stack-arrow, a-stack-l]
        drawMs: 1800

  - id: code-tour
    narration: >
      [[mark:close-intro]] ကဲ၊ project ကို ကြည့်ရအောင်။ [[mark:open-index]] ဒါက HTML ဖိုင်ပါ။
      [[mark:select-header]] အပေါ်ဆုံးက header မှာ မြန်မာလို ဆိုင်နာမည်နဲ့ အင်္ဂလိပ် စာကြောင်း တိုတို
      တစ်ကြောင်း ပါပါတယ်။ [[mark:select-mixed]] header အောက်က စာကြောင်းမှာတော့ ဘာသာစကား နှစ်မျိုး
      ရောထားပါတယ်။ အင်္ဂလိပ် စကားလုံးတွေကို span ထဲ ထည့်ပြီး lang attribute နဲ့ အင်္ဂလိပ်စာလို့
      မှတ်ထားပါတယ်။ [[mark:select-cards]] ပြီးတော့ ဈေးနှုန်းတွေ ပါတဲ့ သောက်စရာ card တွေနဲ့ ဆိုင်အကြောင်း
      အပိုင်း ရှိပါတယ်။ [[mark:open-fonts]] fonts ဆိုတဲ့ CSS ဖိုင် အသစ် တစ်ဖိုင်လည်း ပါပြီး၊ အခုတော့
      အလွတ်ပါ။ font သတ်မှတ်ချက်တွေကို ဒီထဲမှာ ရေးပါမယ်။ [[mark:open-styles]] ကိုယ့် CSS ဖိုင်ကလည်း
      အလွတ်ပါ။ [[mark:preview-opens]] preview ပွင့်လာပါပြီ။ စာသား အားလုံးက lesson 1 မှာ ရေးခဲ့တဲ့ font
      စာရင်းကိုပဲ base CSS ဖိုင်ကနေ သုံးနေပါသေးတယ်။
    sources:
      - title: "web.dev Learn CSS — Typography"
        url: "https://web.dev/learn/css/typography"
      - title: "MDN — lang global attribute"
        url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Global_attributes/lang"
    actions:
      - id: close-intro
        type: whiteboard.apply
        at: { mark: close-intro }
        open: false
      - id: open-index
        type: workspace.openFile
        at: { mark: open-index }
        path: index.html
      - id: select-header
        type: editor.select
        at: { mark: select-header }
        target:
          {
            file: index.html,
            text: '<h1 class="shop-name" data-testid="shop-name">ရွှေလက်ဖက်ရည်ဆိုင်</h1>',
            occurrence: 1,
          }
      - id: select-mixed
        type: editor.select
        at: { mark: select-mixed }
        target:
          {
            file: index.html,
            text: '<span lang="en" data-testid="mixed-en">Shwe Tea House</span>',
            occurrence: 1,
          }
      - id: select-cards
        type: editor.select
        at: { mark: select-cards }
        target:
          {
            file: index.html,
            text: '<span class="price" data-testid="price-laphet-yay">1,500 ကျပ်</span>',
            occurrence: 1,
          }
      - id: open-fonts
        type: workspace.openFile
        at: { mark: open-fonts }
        path: fonts.css
      - id: open-styles
        type: workspace.openFile
        at: { mark: open-styles }
        path: styles.css
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { mark: preview-opens }
        timeoutMs: 20000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-dev-server }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-mixed
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: mixed }
        textContains: "Shwe Tea House"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-mixed-lang
        type: expect.preview
        at: { afterAction: expect-mixed }
        timeoutMs: 5000
        target: { by: testId, value: mixed-en }
        attribute: { name: lang, value: en }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: collapse-runner-dock
        type: runtime.collapseDock
        at: { afterAction: expect-mixed-lang }

  - id: font-stack
    chapter: "Font family နဲ့ fallback"
    narration: >
      [[mark:type-courier]] ရောထားတဲ့ စာကြောင်းကို ကိုယ်ပိုင် font စာရင်း ပေးကြည့်ရအောင်။ ပထမက မြန်မာ
      စာလုံး မပါတဲ့ လက်နှိပ်စက် ပုံစံ font အဟောင်း Courier New ပါ။ ပြီးရင် မြန်မာ font ဖြစ်တဲ့ Noto Sans
      Myanmar၊ နောက်ဆုံးမှာ monospace ဆိုတဲ့ generic family ပါ။ ရိုက်နေတုန်း preview ထဲက စာကြောင်းကို
      လိုက်ကြည့်ပါ။ [[mark:after-courier]] အင်္ဂလိပ် စကားလုံးတွေက လက်နှိပ်စက် font ဖြစ်သွားပေမယ့်၊
      မြန်မာစာကတော့ မြန်မာ font နဲ့ပဲ ကျန်နေပါတယ်။ [[mark:explain-per-char]] ဘာကြောင့်လဲဆိုတော့၊ browser က
      font ကို element တစ်ခုလုံးအတွက် မဟုတ်ဘဲ စာလုံး တစ်လုံးချင်းစီအတွက် ရွေးလို့ပါ။ စာလုံး တစ်လုံးစီကို
      ဆွဲပေးနိုင်တဲ့ ပထမဆုံး font ကို သုံးပါတယ်။ Courier New မှာ မြန်မာ စာလုံး မပါလို့၊ မြန်မာ စာလုံးတွေက
      နောက် font ကို ဆက်သွားတာပါ။ [[mark:select-quoted]] space ပါတဲ့ ဒီ font နာမည်ကို quote ထဲ ရေးပါ။
      [[mark:select-generic]] generic family ကိုတော့ quote မပါဘဲ ရေးပါ။ font နာမည် မဟုတ်ဘဲ keyword
      ဖြစ်လို့ပါ။ စာရင်းတိုင်းကို generic family တစ်ခုနဲ့ အဆုံးသတ်ပါ။
    sources:
      - title: "web.dev Learn CSS — Typography: change the typeface"
        url: "https://web.dev/learn/css/typography#change_the_typeface"
      - title: "MDN — font-family (syntax, quoting, generic names)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/font-family"
      - title: "CSS Fonts Module Level 4 — font-family and fallback per character"
        url: "https://drafts.csswg.org/css-fonts-4/#font-family-prop"
    actions:
      - id: type-courier
        type: editor.type
        at: { mark: type-courier }
        cadence: fast-explainer
        target: { file: styles.css, after: "", occurrence: 1 }
        text: ".mixed {\n  font-family: \"Courier New\", \"Noto Sans Myanmar\", monospace;\n}\n"
      - id: expect-courier
        type: expect.preview
        at: { mark: after-courier }
        timeoutMs: 4000
        target: { by: testId, value: mixed }
        textContains: "ရွှေလက်ဖက်ရည်ဆိုင်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-quoted
        type: editor.select
        at: { mark: select-quoted }
        target: { file: styles.css, text: '"Courier New"', occurrence: 1 }
      - id: select-generic
        type: editor.select
        at: { mark: select-generic }
        target: { file: styles.css, text: "monospace", occurrence: 1 }

  - id: generic-families
    narration: >
      [[mark:open-generic]] အသုံးများတဲ့ generic family တွေကို ကြည့်ရအောင်။ [[mark:draw-serif]] serif font
      တွေရဲ့ စာလုံး အဖျားတွေမှာ အမြီးလေးတွေ ပါပြီး၊ sans serif မှာတော့ မပါပါဘူး။ [[mark:draw-mono]]
      monospace မှာတော့ code editor ထဲကလို စာလုံးတိုင်း အကျယ် တူတူ ရှိပါတယ်။ [[mark:draw-system]] system
      ui ကတော့ ကြည့်တဲ့သူရဲ့ operating system font ကို သုံးပါတယ်။ [[mark:draw-device]] တစ်ခုစီက ကြည့်တဲ့
      စက်ပေါ်မှာ font အစစ် တစ်ခုခု ဖြစ်သွားပါတယ်။ ဒါကြောင့် စက်အလိုက် ပုံစံ ကွာနိုင်ပေမယ့်၊ font
      အမျိုးအစားကတော့ မပြောင်းပါဘူး။ [[mark:draw-quoted]] generic နာမည်ကို quote ထဲ ထည့်လိုက်ရင် keyword
      မဟုတ်တော့ပါဘူး။ browser က အဲဒီ နာမည်နဲ့ font ကို လိုက်ရှာပေမယ့်၊ ရှာမတွေ့ပါဘူး။
    sources:
      - title: "MDN — font-family: generic family names"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/font-family#generic-name"
      - title: "CSS Fonts Module Level 4 — generic font families"
        url: "https://drafts.csswg.org/css-fonts-4/#generic-font-families"
      - title: "web.dev Learn CSS — Typography: check your understanding"
        url: "https://web.dev/learn/css/typography#check_your_understanding"
    actions:
      - id: open-generic
        type: whiteboard.apply
        at: { mark: open-generic }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-serif
        type: whiteboard.apply
        at: { mark: draw-serif }
        upsertIds: [b-serif, b-sans]
        drawMs: 2000
      - id: draw-mono
        type: whiteboard.apply
        at: { mark: draw-mono }
        upsertIds: [b-mono]
        drawMs: 1200
      - id: draw-system
        type: whiteboard.apply
        at: { mark: draw-system }
        upsertIds: [b-system]
        drawMs: 1200
      - id: draw-device
        type: whiteboard.apply
        at: { mark: draw-device }
        upsertIds: [b-device]
        drawMs: 1400
      - id: draw-quoted
        type: whiteboard.apply
        at: { mark: draw-quoted }
        upsertIds: [b-quoted, b-quoted-l]
        drawMs: 1600

  - id: font-face
    chapter: "Web font ကို font face နဲ့ ထည့်ရအောင်"
    narration: >
      [[mark:close-generic]] install လုပ်ထားတဲ့ font တွေက စက်တိုင်း မတူပါဘူး။ လူတိုင်း font တစ်ခုတည်း
      မြင်ရအောင်၊ download လုပ်ရတဲ့ web font တွေကို font face rule နဲ့ ထည့်ပါမယ်။ [[mark:open-fonts-file]]
      fonts ဖိုင်ကို ဖွင့်ပါမယ်။ [[mark:insert-faces]] Google Fonts ပေါ်က ဖိုင်တွေနဲ့ font face rule
      နှစ်ခု ထည့်လိုက်ပါပြီ။ font face rule ကို ဖိုင်ရဲ့ အပြင်ဆုံး အဆင့်မှာ ဒါမှမဟုတ် media query လို
      အခြေအနေ စစ်တဲ့ rule ထဲမှာ ရေးရပြီး၊ selector ပါတဲ့ rule ထဲမှာတော့ ရေးလို့ မရပါဘူး။
      [[mark:select-family-my]] ဒီ font family က ကိုယ် ပေးတဲ့ နာမည်ပါ။ ကိုယ့် font စာရင်းတွေက Shop Myanmar
      ဆိုတဲ့ ဒီ နာမည်ကို သုံးပါမယ်။ [[mark:select-src-my]] src က ဖိုင် ဘယ်မှာ ရှိလဲ ပြောပါတယ်။ url က
      လိပ်စာ ဖြစ်ပြီး၊ [[mark:select-format-my]] ဒီ format က woff2 ဖိုင်လို့ ပြောတာပါ။ browser က သုံးမရတဲ့
      format ကို download မလုပ်ဘဲ ကျော်သွားပါတယ်။ woff2 က web အတွက် ချုံ့ထားလို့ ဖိုင် သေးပြီး၊ အခု
      browser တိုင်းမှာ ရပါတယ်။ [[mark:select-local]] ဒုတိယ rule ဖြစ်တဲ့ Shop Display ရဲ့ src မှာ စာရင်း
      တစ်ခု ပါပါတယ်။ ဒီ local က ကြည့်တဲ့သူရဲ့ စက်ထဲမှာ Playfair Display ရှိပြီးသား ဆိုရင် အဲဒါကို
      သုံးပါတယ်။ မရှိမှ url ကနေ download လုပ်ပါတယ်။ [[mark:explain-tech]] src ထဲက ဖိုင် တစ်ဖိုင်က color
      font လို နည်းပညာ လိုရင် tech နဲ့ ရေးလို့ ရပါတယ်။ အဲဒါ မရတဲ့ browser က အဲဒီ ဖိုင်ကို ကျော်ပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Typography: @font-face"
        url: "https://web.dev/learn/css/typography#font-face"
      - title: "MDN — @font-face src (local, url, format, tech)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/@font-face/src"
      - title: "CSS Fonts Module Level 4 — the src descriptor"
        url: "https://drafts.csswg.org/css-fonts-4/#src-desc"
      - title: "Google Fonts — Noto Sans Myanmar"
        url: "https://fonts.google.com/noto/specimen/Noto+Sans+Myanmar"
      - title: "Google Fonts — Playfair Display"
        url: "https://fonts.google.com/specimen/Playfair+Display"
    actions:
      - id: close-generic
        type: whiteboard.apply
        at: { mark: close-generic }
        open: false
      - id: open-fonts-file
        type: workspace.openFile
        at: { mark: open-fonts-file }
        path: fonts.css
      # One complete block insert: fonts.css is never keystroke-typed, so Vite's
      # postcss step (switched on by url()) only ever sees valid CSS.
      - id: insert-faces
        type: editor.type
        at: { mark: insert-faces }
        cadence: block
        target: { file: fonts.css, after: "", occurrence: 1 }
        text: "@font-face {\n  font-family: \"Shop Myanmar\";\n  src: url(\"https://fonts.gstatic.com/s/notosansmyanmar/v27/AlZZ_y1ZtY3ymOryg38hOCSdOnFq0FP9_gnYM_ME0QeqLzzW6GJXTxJ5K2vF.woff2\")\n    format(\"woff2\");\n  font-weight: 100 900;\n  font-display: swap;\n  unicode-range: U+1000-109F;\n}\n\n@font-face {\n  font-family: \"Shop Display\";\n  src:\n    local(\"Playfair Display\"),\n    url(\"https://fonts.gstatic.com/s/playfairdisplay/v40/nuFiD-vYSZviVYUb_rj3ij__anPXDTzYgEM86xQ.woff2\")\n      format(\"woff2\");\n  font-weight: 400 900;\n  font-display: swap;\n}\n"
      - id: select-family-my
        type: editor.select
        at: { mark: select-family-my }
        target: { file: fonts.css, text: 'font-family: "Shop Myanmar";', occurrence: 1 }
      - id: select-src-my
        type: editor.select
        at: { mark: select-src-my }
        target: { file: fonts.css, text: "src: url(", occurrence: 1 }
      - id: select-format-my
        type: editor.select
        at: { mark: select-format-my }
        target: { file: fonts.css, text: 'format("woff2")', occurrence: 1 }
      - id: select-local
        type: editor.select
        at: { mark: select-local }
        target: { file: fonts.css, text: 'local("Playfair Display"),', occurrence: 1 }

  - id: descriptors
    narration: >
      [[mark:select-weight-range]] rule ထဲက စာကြောင်း တိုင်းကို descriptor လို့ ခေါ်ပြီး၊ ကျန်တာတွေက
      ဖိုင်အကြောင်း ဖော်ပြပါတယ်။ ဒီ font weight က ဖိုင်ထဲမှာ 100 ကနေ 900 ထိ weight အားလုံး ပါတယ်လို့
      ပြောပါတယ်။ [[mark:select-display]] font display က ဖိုင် download လုပ်နေတုန်း စာသားကို ဘယ်လို ပြမလဲ
      ဆုံးဖြတ်ပါတယ်။ [[mark:select-unicode]] unicode range က ဒီ ဖိုင်မှာ ဘယ် စာလုံးတွေ ပါလဲ ပြောပါတယ်။ ဒီ
      range က Unicode ရဲ့ မြန်မာ block ဖြစ်လို့၊ page မှာ မြန်မာ စာလုံး ပါမှပဲ browser က ဒီ ဖိုင်ကို
      download လုပ်ပါတယ်။ [[mark:explain-more-descriptors]] တခြား descriptor တွေလည်း ရှိပါတယ်။ size adjust
      နဲ့ override descriptor တွေက fallback font ရဲ့ အရွယ်ကို web font နဲ့ ကိုက်အောင် ညှိပေးပါတယ်။
      [[mark:explain-cors]] server က font ဖိုင်ကို ဒါ font ပါ ဆိုတဲ့ content type နဲ့ ပို့ရပါတယ်။ ဖိုင်က
      တခြား site မှာ ရှိရင်တော့၊ အဲဒီ site က CORS header နဲ့ ခွင့်ပြုမှ load လုပ်လို့ ရပါတယ်။ Google Fonts
      က နှစ်ခုလုံး ပို့ပေးပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Typography: descriptors"
        url: "https://web.dev/learn/css/typography#descriptors"
      - title: "web.dev Learn CSS — Typography: font MIME types"
        url: "https://web.dev/learn/css/typography#font-mime-types"
      - title: "MDN — unicode-range"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/@font-face/unicode-range"
      - title: "MDN — size-adjust"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/@font-face/size-adjust"
      - title: "MDN — Cross-Origin Resource Sharing (CORS)"
        url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS"
    actions:
      - id: select-weight-range
        type: editor.select
        at: { mark: select-weight-range }
        target: { file: fonts.css, text: "font-weight: 100 900;", occurrence: 1 }
      - id: select-display
        type: editor.select
        at: { mark: select-display }
        target: { file: fonts.css, text: "font-display: swap;", occurrence: 1 }
      - id: select-unicode
        type: editor.select
        at: { mark: select-unicode }
        target: { file: fonts.css, text: "unicode-range: U+1000-109F;", occurrence: 1 }

  - id: font-display
    narration: >
      [[mark:open-display]] web font လိုတဲ့ စာသားက ဖိုင် ရောက်လာတဲ့အထိ စောင့်ရပါတယ်။ [[mark:draw-block]]
      ပထမက block ကာလပါ။ browser က စာသားကို ဖျောက်ထားပြီး၊ အများဆုံး 3 စက္ကန့်လောက် ကြာနိုင်ပါတယ်။
      [[mark:draw-swap]] ပြီးရင် swap ကာလပါ။ စာသားကို fallback font နဲ့ ပြထားပြီး၊ ဖိုင် ရောက်လာတဲ့အခါ
      browser က web font နဲ့ လဲပေးပါတယ်။ [[mark:draw-values]] font display က ဒီ ကာလတွေကို သတ်မှတ်ပါတယ်။
      block က စာသားကို အကြာဆုံး ဖျောက်ထားပါတယ်။ swap က fallback ကို ချက်ချင်းလိုလို ပြပြီး၊ ဖိုင်
      ဘယ်အချိန် ရောက်ရောက် လဲပေးပါတယ်။ fallback တန်ဖိုးကတော့ ခဏလေးပဲ ဖျောက်ပြီး၊ ပထမ စက္ကန့်
      အနည်းငယ်အတွင်း ရောက်မှပဲ လဲပါတယ်။ auto ကတော့ browser ကို ရွေးခိုင်းတာပါ။ [[mark:draw-optional]]
      optional ကတော့ ဖိုင် နှေးနေရင် fallback ကိုပဲ ဆက်သုံးခွင့် ပေးပါတယ်။ [[mark:draw-choice]] ချက်ချင်း
      ဖတ်ရမယ့် စာသားအတွက်တော့ swap ကို ရွေးတာ ကောင်းပါတယ်။
    sources:
      - title: "MDN — font-display"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/@font-face/font-display"
      - title: "web.dev — Best practices for fonts (font-display)"
        url: "https://web.dev/articles/font-best-practices#choose_an_appropriate_font-display_strategy"
      - title: "CSS Fonts Module Level 4 — font-display timeline"
        url: "https://drafts.csswg.org/css-fonts-4/#font-display-timeline"
    actions:
      - id: open-display
        type: whiteboard.apply
        at: { mark: open-display }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-block
        type: whiteboard.apply
        at: { mark: draw-block }
        upsertIds: [c-block, c-block-t, c-block-l]
        drawMs: 1800
      - id: draw-swap
        type: whiteboard.apply
        at: { mark: draw-swap }
        upsertIds: [c-swap, c-swap-t, c-swap-l, c-arrive]
        drawMs: 2600
      - id: draw-values
        type: whiteboard.apply
        at: { mark: draw-values }
        upsertIds: [c-values]
        drawMs: 1600
      - id: draw-optional
        type: whiteboard.apply
        at: { mark: draw-optional }
        upsertIds: [c-optional]
        drawMs: 1400
      - id: draw-choice
        type: whiteboard.apply
        at: { mark: draw-choice }
        upsertIds: [c-choice]
        drawMs: 1200

  - id: use-web-font
    narration: >
      [[mark:close-display]] ဒီ font နာမည်တွေကို သုံးကြည့်ရအောင်။ [[mark:open-styles-use]] CSS ဖိုင်ဆီ
      ပြန်သွားပါမယ်။ [[mark:type-use]] ဆိုင်နာမည်၊ ရောထားတဲ့ စာကြောင်းနဲ့ ဈေးနှုန်းတွေကို font စာရင်း အသစ်
      ပေးပါမယ်။ ရှေ့ဆုံးမှာ Shop Display၊ ပြီးရင် Shop Myanmar၊ ဖိုင် နှစ်ခုလုံး load မရရင် သုံးဖို့
      နောက်ဆုံးမှာ sans serif ပါ။ preview ကို ကြည့်ပါ။ [[mark:after-use]] ဒီ rule က နောက်မှ လာလို့ Courier
      စာရင်းကို နိုင်ပါတယ်။ အင်္ဂလိပ် စကားလုံးတွေက အထူ အပါး ကွဲတဲ့ မျဉ်းတွေနဲ့ Playfair Display
      ဖြစ်သွားပြီး၊ မြန်မာစာကတော့ Shop Myanmar ဖိုင်ကနေ လာပါတယ်။ ဈေးနှုန်းထဲက ဂဏန်းတွေလည်း
      ပြောင်းသွားပြီး၊ နောက်မှ ပြန်ကြည့်ပါမယ်။ [[mark:explain-unicode-live]] browser က အင်္ဂလိပ်
      စာလုံးတွေကို Shop Display မှာတင် ရှာတွေ့ပါတယ်။ သူ့မှာ မြန်မာ စာလုံး မပါလို့ မြန်မာစာက Shop Myanmar
      ကို ဆက်သွားပြီး၊ အဲဒီ ဖိုင်ကိုလည်း page မှာ မြန်မာစာ ပါလို့ပဲ download လုပ်ခဲ့တာပါ။
      [[mark:explain-swap-live]] swap ပေးထားလို့၊ ဖိုင် နှေးရင်လည်း စာသားက fallback font နဲ့ ချက်ချင်း
      ပေါ်ပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Typography: @font-face and font-family"
        url: "https://web.dev/learn/css/typography#font-face-family"
      - title: "MDN — unicode-range (one font per script)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/@font-face/unicode-range"
      - title: "CSS Fonts Module Level 4 — font matching and unicode-range"
        url: "https://drafts.csswg.org/css-fonts-4/#font-matching-algorithm"
    actions:
      - id: close-display
        type: whiteboard.apply
        at: { mark: close-display }
        open: false
      - id: open-styles-use
        type: workspace.openFile
        at: { mark: open-styles-use }
        path: styles.css
      - id: type-use
        type: editor.type
        at: { mark: type-use }
        cadence: line-by-line
        target: { file: styles.css, after: "\"Noto Sans Myanmar\", monospace;\n}\n", occurrence: 1 }
        text: "\n.shop-name,\n.mixed,\n.price {\n  font-family: \"Shop Display\", \"Shop Myanmar\",\n    sans-serif;\n}\n"
      - id: expect-use
        type: expect.preview
        at: { mark: after-use }
        timeoutMs: 4000
        target: { by: testId, value: price-laphet-yay }
        textContains: "1,500"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: font-weight
    chapter: "Weight၊ style နဲ့ size"
    narration: >
      [[mark:type-w300]] အခု စာလုံး အထူကို ကြည့်ရအောင်။ ဆိုင်နာမည်က ခေါင်းစဉ် ဖြစ်လို့ browser က ထူထူ
      ပြပါတယ်။ သူ့ font weight ကို 300 ပေးကြည့်ပါမယ်။ [[mark:after-w300]] ပါးသွားပါပြီ။ [[mark:type-w500]]
      နောက်မှ ရေးတဲ့ declaration က နိုင်လို့၊ 500 ကို ဆက်ရေးပါမယ်။ [[mark:after-w500]] နည်းနည်း ထူလာပါပြီ။
      [[mark:type-w800]] အခု 800 ပါ။ [[mark:after-w800]] ပုံမှန် bold ထက်တောင် ထူသွားပါပြီ။
      [[mark:explain-weight-keywords]] keyword အနေနဲ့ normal က 400၊ bold က 700 ပါ။ ဂဏန်းကတော့ 1 ကနေ 1000
      ထိ ဘာမဆို ပေးလို့ ရပါတယ်။ lighter နဲ့ bolder ကတော့ parent ရဲ့ အထူထက် တစ်ဆင့် ပါး ဒါမှမဟုတ် ထူပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Typography: make text bold"
        url: "https://web.dev/learn/css/typography#make_text_bold"
      - title: "MDN — font-weight (keywords, numbers, relative weights)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/font-weight"
    actions:
      - id: type-w300
        type: editor.type
        at: { mark: type-w300 }
        cadence: fast-explainer
        target: { file: styles.css, after: "    sans-serif;\n}\n", occurrence: 1 }
        text: "\n.shop-name {\n  font-weight: 300;\n}\n"
      - id: expect-w300
        type: expect.preview
        at: { mark: after-w300 }
        timeoutMs: 4000
        target: { by: testId, value: shop-name }
        textContains: "ရွှေလက်ဖက်ရည်ဆိုင်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-w500
        type: editor.type
        at: { mark: type-w500 }
        cadence: fast-explainer
        target: { file: styles.css, after: "  font-weight: 300;\n", occurrence: 1 }
        text: "  font-weight: 500;\n"
      - id: type-w800
        type: editor.type
        at: { mark: type-w800 }
        cadence: fast-explainer
        target: { file: styles.css, after: "  font-weight: 500;\n", occurrence: 1 }
        text: "  font-weight: 800;\n"

  - id: variable-fonts
    narration: >
      [[mark:open-axis]] ဒါဆို ဂဏန်းတိုင်း ဘာကြောင့် ရတာလဲ။ [[mark:draw-axis]] Shop Myanmar က variable
      font ဖြစ်လို့ပါ။ ဖိုင် တစ်ဖိုင်တည်းမှာ weight ကို axis လို့ ခေါ်တဲ့ မျဉ်းပေါ်က ဘယ်နေရာမဆို
      ရွေးနိုင်ပြီး၊ ဒီမှာ 100 ကနေ 900 ထိပါ။ [[mark:draw-static]] static font မှာတော့ weight တစ်ခုကို
      ဖိုင် တစ်ဖိုင်စီ ရှိပြီး၊ browser က အနီးဆုံး ဖိုင်ကို သုံးပါတယ်။ [[mark:draw-fake]] bold ဖိုင်
      မရှိရင်တော့၊ browser က စာလုံးတွေကို ထူအောင် လုပ်ပြီး bold အတု ဖန်တီးပါတယ်။ [[mark:draw-axes]] စာလုံး
      အကျယ်၊ စောင်းတာ၊ optical size လို တခြား axis တွေလည်း ပါနိုင်ပါတယ်။ board ပေါ်က စာလုံး လေးလုံးစီက
      axis tag တွေ ဖြစ်ပြီး၊ font variation settings မှာ tag နဲ့ တန်ဖိုး ပေးလို့ ရပါတယ်။
      [[mark:draw-synthesis]] font synthesis ကို none ပေးရင် browser က bold နဲ့ italic အတု မလုပ်တော့ပါဘူး။
    sources:
      - title: "web.dev Learn CSS — Typography: variable fonts"
        url: "https://web.dev/learn/css/typography#variable_fonts"
      - title: "MDN — Variable fonts guide"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_fonts/Variable_fonts_guide"
      - title: "web.dev — Introduction to variable fonts on the web"
        url: "https://web.dev/articles/variable-fonts"
      - title: "MDN — font-synthesis"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/font-synthesis"
    actions:
      - id: open-axis
        type: whiteboard.apply
        at: { mark: open-axis }
        open: true
        clear: true
        upsertIds: [d-title]
      - id: draw-axis
        type: whiteboard.apply
        at: { mark: draw-axis }
        upsertIds: [d-bar, d-100, d-900, d-k300, d-k500, d-k800, d-axis-l]
        drawMs: 2800
      - id: draw-static
        type: whiteboard.apply
        at: { mark: draw-static }
        upsertIds: [d-static]
        drawMs: 1400
      - id: draw-fake
        type: whiteboard.apply
        at: { mark: draw-fake }
        upsertIds: [d-fake]
        drawMs: 1400
      - id: draw-axes
        type: whiteboard.apply
        at: { mark: draw-axes }
        upsertIds: [d-axes]
        drawMs: 1400
      - id: draw-synthesis
        type: whiteboard.apply
        at: { mark: draw-synthesis }
        upsertIds: [d-synth]
        drawMs: 1400

  - id: font-style
    narration: >
      [[mark:close-axis]] အခု font style ပါ။ [[mark:type-italic]] ဖိုင် အောက်ဆုံးမှာ rule အသစ် တစ်ခုနဲ့
      ရောထားတဲ့ စာကြောင်းကို italic ပေးကြည့်ရအောင်။ ဘာသာစကား နှစ်မျိုးလုံးကို ကြည့်ပါ။
      [[mark:after-italic]] ဘာသာစကား နှစ်မျိုးလုံး စောင်းသွားပါပြီ။ ကိုယ့် font တွေမှာ italic ဖိုင်
      မရှိသေးလို့၊ browser က ပုံမှန် စာလုံးတွေကို စောင်းပေးလိုက်တာပါ။ ဒါက italic အတုပါ။
      [[mark:open-fonts-italic]] အစစ် တစ်ခု ထည့်ရအောင်။ [[mark:insert-italic]] font face rule
      နောက်တစ်ခုပါ။ နာမည်က Shop Display ပဲ ဖြစ်ပြီး၊ ဖိုင်က Playfair ရဲ့ italic ဖိုင်ပါ။
      [[mark:after-italic-face]] ဒီ font style descriptor ကြောင့် အင်္ဂလိပ် စာလုံးတွေရဲ့ ပုံစံ
      ပြောင်းသွားတာကို ကြည့်ပါ။ italic အစစ်က စောင်းရုံ မဟုတ်ဘဲ သီးသန့် design ပါ။ browser က element
      တောင်းတဲ့ ပုံစံနဲ့ descriptor ကိုက်တဲ့ font face ကို ရွေးပါတယ်။ [[mark:explain-oblique]] နောက်
      တန်ဖိုး တစ်ခု ဖြစ်တဲ့ oblique ကတော့ ပုံမှန် စာလုံးကို စောင်းထားတဲ့ ပုံစံကို တောင်းတာ ဖြစ်ပြီး၊ ဒီဂရီ
      ပေးလို့ ရပါတယ်။ [[mark:explain-burmese-italic]] မြန်မာစာကတော့ အတုအတိုင်း စောင်းနေဆဲပါ။ မြန်မာ font
      တွေမှာ italic မပါသလောက် ဖြစ်ပြီး၊ စောင်းနေတဲ့ မြန်မာစာက ဖတ်ရ ထူးဆန်းပါတယ်။ ဒါကြောင့် မြန်မာစာကို
      အလေးပေးချင်ရင် အထူ ဒါမှမဟုတ် အရောင်ကို သုံးပါ။
    sources:
      - title: "web.dev Learn CSS — Typography: italic and oblique fonts"
        url: "https://web.dev/learn/css/typography#use_italic_and_oblique_fonts"
      - title: "MDN — font-style"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/font-style"
      - title: "W3C — Myanmar Layout Requirements"
        url: "https://www.w3.org/TR/mlreq/"
    actions:
      - id: close-axis
        type: whiteboard.apply
        at: { mark: close-axis }
        open: false
      - id: type-italic
        type: editor.type
        at: { mark: type-italic }
        cadence: fast-explainer
        target: { file: styles.css, after: "  font-weight: 800;\n}\n", occurrence: 1 }
        text: "\n.mixed {\n  font-style: italic;\n}\n"
      - id: open-fonts-italic
        type: workspace.openFile
        at: { mark: open-fonts-italic }
        path: fonts.css
      - id: insert-italic
        type: editor.type
        at: { mark: insert-italic }
        cadence: block
        target:
          {
            file: fonts.css,
            after: "  font-weight: 400 900;\n  font-display: swap;\n}\n",
            occurrence: 1,
          }
        text: "\n@font-face {\n  font-family: \"Shop Display\";\n  src: url(\"https://fonts.gstatic.com/s/playfairdisplay/v40/nuFkD-vYSZviVYUb_rj3ij__anPXDTnogkk7yRZrPA.woff2\")\n    format(\"woff2\");\n  font-weight: 400 900;\n  font-style: italic;\n  font-display: swap;\n}\n"
      - id: select-italic-desc
        type: editor.select
        at: { mark: after-italic-face }
        target: { file: fonts.css, text: "font-style: italic;", occurrence: 1 }
      - id: expect-italic
        type: expect.preview
        at: { afterAction: select-italic-desc }
        timeoutMs: 4000
        target: { by: testId, value: mixed-en }
        textContains: "Shwe Tea House"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: font-size
    narration: >
      [[mark:open-styles-size]] CSS ဖိုင်ဆီ ပြန်သွားပါမယ်။ [[mark:scroll-story]] အခု ဆိုင်အကြောင်း
      စာပိုဒ်ပါ။ [[mark:type-px]] သူ့ကို font size 18 pixel ပေးကြည့်ရအောင်။ အခု ရှိနေတဲ့ 16 pixel ထက်
      နည်းနည်း ကြီးပါတယ်။ [[mark:after-px]] စာလုံးတွေ ကြီးလာပြီး စာကြောင်းတွေလည်း လိုက်မြင့်လာပါတယ်။
      lesson 10 မှာလို line height က unit မပါတဲ့ အဆ ဖြစ်လို့ font size နဲ့ လိုက်ပြောင်းတာပါ။
      [[mark:type-rem]] အောက်မှာ အရွယ် တူတူကို rem နဲ့ ပေးပါမယ်။ [[mark:after-rem]] ဘာမှ မပြောင်းပါဘူး။
      default အရွယ်မှာ ဒါက 18 pixel ပဲ ဖြစ်လို့ပါ။ ဒါပေမဲ့ ဖတ်တဲ့သူက browser မှာ စာလုံး အရွယ် ကြီးထားရင်၊
      rem က လိုက်ကြီးပေမယ့် pixel က မလိုက်ပါဘူး။ [[mark:explain-size-values]] font size မှာ parent
      အရွယ်ရဲ့ ရာခိုင်နှုန်းနဲ့ ပေးတာ၊ keyword နဲ့ ပေးတာလည်း ရပါတယ်။ medium က default အရွယ်၊ larger နဲ့
      smaller က parent ထက် တစ်ဆင့် ကြီး ဒါမှမဟုတ် သေးပါတယ်။ [[mark:explain-size-adjust]] font size adjust
      က fallback font သုံးရတဲ့အခါ အင်္ဂလိပ် စာလုံး အသေးတွေရဲ့ အမြင့် မပြောင်းအောင် ထိန်းပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Typography: change the size of text"
        url: "https://web.dev/learn/css/typography#change_the_size_of_text"
      - title: "MDN — font-size"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/font-size"
      - title: "MDN — font-size-adjust"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/font-size-adjust"
    actions:
      - id: open-styles-size
        type: workspace.openFile
        at: { mark: open-styles-size }
        path: styles.css
      - id: scroll-story
        type: preview.scroll
        at: { mark: scroll-story }
        timeoutMs: 5000
        top: 400
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-story
        type: expect.preview
        at: { afterAction: scroll-story }
        timeoutMs: 4000
        target: { by: testId, value: story }
        textContains: "ဗဟန်း"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-px
        type: editor.type
        at: { mark: type-px }
        cadence: fast-explainer
        target: { file: styles.css, after: "  font-style: italic;\n}\n", occurrence: 1 }
        text: "\n.story {\n  font-size: 18px;\n}\n"
      - id: type-rem
        type: editor.type
        at: { mark: type-rem }
        cadence: fast-explainer
        target: { file: styles.css, after: "  font-size: 18px;\n", occurrence: 1 }
        text: "  font-size: 1.125rem;\n"

  - id: letter-spacing
    chapter: "စာလုံးကြား နေရာလွတ်နဲ့ lang"
    narration: >
      [[mark:scroll-top]] page အပေါ်ဆုံးကို ပြန်တက်ရအောင်။ [[mark:type-ls-tagline]] header ထဲက အင်္ဂလိပ်
      စာကြောင်းကို letter spacing ပေးပါမယ်။ em နဲ့ ပေးလို့ စာလုံး ကြီးရင် ကြားက နေရာလွတ်လည်း
      လိုက်ကြီးပါတယ်။ [[mark:after-ls-tagline]] စာလုံးတွေ ကျဲသွားပါပြီ။ စာလုံး သေးသေးနဲ့ အင်္ဂလိပ် label
      တိုတိုတွေက ဒီလို ဆိုရင် ဖတ်ရ ပိုကောင်းတတ်ပါတယ်။ [[mark:type-ls-mixed]] ရောထားတဲ့ စာကြောင်းရဲ့ italic
      rule မှာလည်း ဒီ spacing ပေးပါမယ်။ [[mark:after-ls-mixed]] အင်္ဂလိပ်စာက အဆင်ပြေပေမယ့် မြန်မာစာကို
      ကြည့်ပါ။ lesson 26 မှာ first letter က syllable ကို ခွဲလိုက်သလိုပဲ၊ syllable တစ်ခုထဲမှာတောင် နေရာလွတ်
      ဝင်ပြီး ကွဲသွားပါတယ်။ [[mark:explain-word-spacing]] word spacing ကတော့ space တွေ ရှိတဲ့ နေရာမှာပဲ
      နေရာလွတ် ထည့်ပါတယ်။ မြန်မာစာမှာ စကားစုတွေကြားမှာပဲ space ခြားလို့၊ အင်္ဂလိပ်စာထက် ပြောင်းတဲ့ နေရာ
      အများကြီး နည်းပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Typography: space between characters"
        url: "https://web.dev/learn/css/typography#change_the_space_between_characters"
      - title: "web.dev Learn CSS — Typography: space between words"
        url: "https://web.dev/learn/css/typography#change_the_space_between_words"
      - title: "MDN — letter-spacing"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/letter-spacing"
      - title: "MDN — word-spacing"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/word-spacing"
      - title: "W3C — Myanmar Layout Requirements"
        url: "https://www.w3.org/TR/mlreq/"
    actions:
      - id: scroll-top
        type: preview.scroll
        at: { mark: scroll-top }
        timeoutMs: 5000
        top: 0
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: type-ls-tagline
        type: editor.type
        at: { mark: type-ls-tagline }
        cadence: fast-explainer
        target: { file: styles.css, after: "  font-weight: 800;\n}\n", occurrence: 1 }
        text: "\n.tagline {\n  letter-spacing: 0.12em;\n}\n"
      - id: expect-tagline
        type: expect.preview
        at: { mark: after-ls-tagline }
        timeoutMs: 4000
        target: { by: testId, value: tagline }
        textContains: "Yangon"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-ls-mixed
        type: editor.type
        at: { mark: type-ls-mixed }
        cadence: fast-explainer
        target: { file: styles.css, after: "  font-style: italic;\n", occurrence: 1 }
        text: "  letter-spacing: 0.12em;\n"

  - id: lang
    narration: >
      [[mark:open-index-lang]] HTML က အပိုင်း တစ်ခုစီရဲ့ ဘာသာစကားကို ပြောထားပြီးသားပါ။
      [[mark:select-html-lang]] html element က page ကို မြန်မာစာလို့ ပြောထားပါတယ်။
      [[mark:select-span-lang]] ဒီ span ကတော့ အင်္ဂလိပ်စာပါ။ lang က browser ကို font ရွေးဖို့၊ စာကြောင်း
      ချိုးဖို့ ကူညီပြီး၊ screen reader ကိုလည်း ဘယ်အသံနဲ့ ဖတ်ရမလဲ ပြောပါတယ်။ [[mark:open-styles-lang]] CSS
      ကလည်း ဖတ်လို့ ရပါတယ်။ [[mark:type-lang]] ရောထားတဲ့ စာကြောင်းရဲ့ selector နောက်မှာ space ခြားပြီး
      lang ဆိုတဲ့ pseudo-class ထည့်ပါမယ်။ space ကြောင့် စာကြောင်း ကိုယ်တိုင်ကို မဟုတ်ဘဲ၊ သူ့ထဲက အင်္ဂလိပ်
      element ကိုပဲ ရွေးတာပါ။ [[mark:after-lang]] အခု အင်္ဂလိပ် စကားလုံးတွေပဲ စောင်းပြီး ကျဲနေတော့၊
      မြန်မာစာက ပြန်ဖတ်ရ ကောင်းသွားပါပြီ။ [[mark:explain-lang]] lang မပါတဲ့ element က အပြင်က element ဆီကနေ
      ဆက်ယူလို့၊ စာကြောင်း ကိုယ်တိုင်နဲ့ page ထဲက ကျန်တာ အားလုံးက မြန်မာစာ ဖြစ်ပါတယ်။
    sources:
      - title: "MDN — lang global attribute"
        url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Global_attributes/lang"
      - title: "MDN — :lang()"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/:lang"
      - title: "W3C — Language on the Web: declaring language in HTML"
        url: "https://www.w3.org/International/questions/qa-html-language-declarations"
    actions:
      - id: open-index-lang
        type: workspace.openFile
        at: { mark: open-index-lang }
        path: index.html
      - id: select-html-lang
        type: editor.select
        at: { mark: select-html-lang }
        target: { file: index.html, text: '<html lang="my">', occurrence: 1 }
      - id: select-span-lang
        type: editor.select
        at: { mark: select-span-lang }
        target: { file: index.html, text: 'lang="en" data-testid="mixed-en"', occurrence: 1 }
      - id: open-styles-lang
        type: workspace.openFile
        at: { mark: open-styles-lang }
        path: styles.css
      - id: type-lang
        type: editor.type
        at: { mark: type-lang }
        cadence: fast-explainer
        target:
          {
            file: styles.css,
            after: ".tagline {\n  letter-spacing: 0.12em;\n}\n\n.mixed",
            occurrence: 1,
          }
        text: " :lang(en)"
      - id: expect-lang
        type: expect.preview
        at: { mark: after-lang }
        timeoutMs: 4000
        target: { by: testId, value: mixed-en }
        attribute: { name: lang, value: en }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: font-variant
    chapter: "Font variant နဲ့ shorthand"
    narration: >
      [[mark:type-lining]] အခု ဈေးနှုန်းတွေပါ။ Playfair Display က ဂဏန်းတွေကို စာလုံး အသေးလို အပေါ်တက်
      အောက်ဆင်း ဆွဲတဲ့ old style ဂဏန်းနဲ့ ပြပါတယ်။ font variant numeric နဲ့ lining ဂဏန်း
      ပြောင်းကြည့်ရအောင်။ [[mark:after-lining]] ဂဏန်းတွေက အမြင့် တူတူနဲ့ မျဉ်းပေါ်မှာ ရပ်နေလို့၊
      ဈေးနှုန်းနဲ့ ပိုလိုက်ပါတယ်။ [[mark:explain-tabular]] tabular nums ဆိုတဲ့ တန်ဖိုးကတော့ ဂဏန်းတိုင်းကို
      အကျယ် တူအောင် လုပ်လို့၊ column ထဲက ဈေးနှုန်းတွေ တန်းညီပါတယ်။ ဒါပေမဲ့ font ဖိုင်ထဲမှာ ပါမှပဲ
      အလုပ်လုပ်ပြီး၊ ကိုယ့် ဖိုင်မှာ tabular ဂဏန်း မပါပါဘူး။ [[mark:explain-small-caps]] font variant က
      ဒီလို property တွေကို စုပေးတဲ့ shorthand ပါ။ သူနဲ့ small caps ပေးရင်၊ အင်္ဂလိပ် စာလုံး အသေးတွေကို
      စာလုံးကြီး ပုံစံ သေးသေးလေးနဲ့ ပြပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Typography: font-variant"
        url: "https://web.dev/learn/css/typography#font-variant"
      - title: "MDN — font-variant-numeric"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/font-variant-numeric"
      - title: "MDN — font-variant"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/font-variant"
    actions:
      - id: type-lining
        type: editor.type
        at: { mark: type-lining }
        cadence: fast-explainer
        target: { file: styles.css, after: "  font-size: 1.125rem;\n}\n", occurrence: 1 }
        text: "\n.price {\n  font-variant-numeric: lining-nums;\n}\n"
      - id: expect-lining
        type: expect.preview
        at: { mark: after-lining }
        timeoutMs: 4000
        target: { by: testId, value: price-laphet-yay }
        textContains: "1,500"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: font-shorthand
    narration: >
      [[mark:open-shorthand]] font shorthand က font property အများကြီးကို declaration တစ်ခုတည်းနဲ့
      ပေးပါတယ်။ [[mark:draw-order]] အစဉ် အရေးကြီးပါတယ်။ style နဲ့ weight က ရှေ့ဆုံးမှာ လာပြီး မထည့်လည်း
      ရပါတယ်။ [[mark:draw-size]] ပြီးရင် မဖြစ်မနေ ပါရမယ့် size၊ သူ့နောက်မှာ slash နဲ့ မထည့်လည်း ရတဲ့ line
      height ပါ။ [[mark:draw-family]] family စာရင်းက နောက်ဆုံးမှာ လာပြီး၊ သူလည်း မဖြစ်မနေ ပါရပါတယ်။
      [[mark:draw-reset]] သတိထားရမှာက၊ မရေးခဲ့တဲ့ font property တိုင်းက initial value ကို
      ပြန်ရောက်သွားလို့၊ အရင် ပေးထားတဲ့ line height ပျောက်သွားနိုင်ပါတယ်။ [[mark:draw-advice]] အကုန်လုံး
      တစ်ခါတည်း ပေးချင်ရင် shorthand ကို၊ တစ်ခုတည်း ပြောင်းချင်ရင် longhand ကို သုံးပါ။
    sources:
      - title: "web.dev Learn CSS — Typography: font shorthand"
        url: "https://web.dev/learn/css/typography#font_shorthand"
      - title: "MDN — font (shorthand)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/font"
    actions:
      - id: open-shorthand
        type: whiteboard.apply
        at: { mark: open-shorthand }
        open: true
        clear: true
        upsertIds: [e-title]
      - id: draw-order
        type: whiteboard.apply
        at: { mark: draw-order }
        upsertIds: [e-font, e-style, e-l1]
        drawMs: 1400
      - id: draw-size
        type: whiteboard.apply
        at: { mark: draw-size }
        upsertIds: [e-size, e-lh, e-l2]
        drawMs: 1400
      - id: draw-family
        type: whiteboard.apply
        at: { mark: draw-family }
        upsertIds: [e-family, e-l3]
        drawMs: 1400
      - id: draw-reset
        type: whiteboard.apply
        at: { mark: draw-reset }
        upsertIds: [e-reset]
        drawMs: 1400
      - id: draw-advice
        type: whiteboard.apply
        at: { mark: draw-advice }
        upsertIds: [e-advice]
        drawMs: 1400

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:open-quiz]] မေးခွန်း တစ်ခု စစ်ကြည့်ရအောင်။ ဒီထဲက ဘယ်ဟာတွေက generic family လဲ။
      [[mark:quiz-answer]] serif နဲ့ monospace ပါ။ Helvetica က font တစ်ခုရဲ့ နာမည် ဖြစ်ပြီး၊ italic က font
      style ရဲ့ တန်ဖိုးပါ။ [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ font face rule က font နဲ့ သူ့ ဖိုင်တွေကို
      သတ်မှတ်ပြီး၊ font family က စာလုံး တစ်လုံးချင်း fallback လုပ်တဲ့ စာရင်းနဲ့ သုံးပါတယ်။ weight၊ style၊
      size နဲ့ spacing တွေက စာလုံးကို ပြင်ပြီး၊ lang က ဘာသာစကားကို browser ကို ပြောပါတယ်။
      [[mark:draw-best]] font ဖိုင် တိုင်းက download တစ်ခုစီ ဖြစ်လို့၊ လိုတဲ့ font လောက်ကိုပဲ woff2 နဲ့
      load လုပ်ပါ။ ပိုသိချင်ရင် MDN မှာ font ကို style ပေးနည်း guide ကို ရှာဖတ်ကြည့်ပါ။
      [[mark:next-lesson]] နောက် lesson မှာတော့ စာလုံး အကြီး အသေး၊ အောက်မျဉ်း၊ ညှိတာ၊ စာကြောင်း ချိုးတာ
      စတာတွေနဲ့ ဒီ စာသားကို စီကြည့်ပါမယ်။
    sources:
      - title: "web.dev Learn CSS — Typography: check your understanding"
        url: "https://web.dev/learn/css/typography#check_your_understanding"
      - title: "web.dev — Best practices for fonts"
        url: "https://web.dev/articles/font-best-practices"
      - title: "MDN — Fundamental text and font styling"
        url: "https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Text_styling/Fundamentals"
      - title: "web.dev Learn CSS — Typography (next lesson continues it)"
        url: "https://web.dev/learn/css/typography"
    actions:
      - id: open-quiz
        type: whiteboard.apply
        at: { mark: open-quiz }
        open: true
        clear: true
        upsertIds: [f-title, f-o1, f-o2, f-o3, f-o4]
      - id: draw-quiz-answer
        type: whiteboard.apply
        at: { mark: quiz-answer }
        upsertIds: [f-a1, f-a2, f-a3, f-a4]
        drawMs: 2400
      - id: draw-best
        type: whiteboard.apply
        at: { mark: draw-best }
        upsertIds: [f-best]
        drawMs: 1400
      - id: expect-final-css
        type: expect.file
        at: { mark: recap }
        path: styles.css
        contains: ".mixed {\n  font-family: \"Courier New\", \"Noto Sans Myanmar\", monospace;\n}\n\n.shop-name,\n.mixed,\n.price {\n  font-family: \"Shop Display\", \"Shop Myanmar\",\n    sans-serif;\n}\n\n.shop-name {\n  font-weight: 300;\n  font-weight: 500;\n  font-weight: 800;\n}\n\n.tagline {\n  letter-spacing: 0.12em;\n}\n\n.mixed :lang(en) {\n  font-style: italic;\n  letter-spacing: 0.12em;\n}\n\n.story {\n  font-size: 18px;\n  font-size: 1.125rem;\n}\n\n.price {\n  font-variant-numeric: lining-nums;\n}\n"
      - id: expect-final-fonts
        type: expect.file
        at: { mark: recap }
        path: fonts.css
        contains: "@font-face {\n  font-family: \"Shop Myanmar\";\n  src: url(\"https://fonts.gstatic.com/s/notosansmyanmar/v27/AlZZ_y1ZtY3ymOryg38hOCSdOnFq0FP9_gnYM_ME0QeqLzzW6GJXTxJ5K2vF.woff2\")\n    format(\"woff2\");\n  font-weight: 100 900;\n  font-display: swap;\n  unicode-range: U+1000-109F;\n}\n\n@font-face {\n  font-family: \"Shop Display\";\n  src:\n    local(\"Playfair Display\"),\n    url(\"https://fonts.gstatic.com/s/playfairdisplay/v40/nuFiD-vYSZviVYUb_rj3ij__anPXDTzYgEM86xQ.woff2\")\n      format(\"woff2\");\n  font-weight: 400 900;\n  font-display: swap;\n}\n\n@font-face {\n  font-family: \"Shop Display\";\n  src: url(\"https://fonts.gstatic.com/s/playfairdisplay/v40/nuFkD-vYSZviVYUb_rj3ij__anPXDTnogkk7yRZrPA.woff2\")\n    format(\"woff2\");\n  font-weight: 400 900;\n  font-style: italic;\n  font-display: swap;\n}\n"

checks:
  - { type: timing.p95Ms, max: 300 }
