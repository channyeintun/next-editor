# CSS course (Burmese), lesson 30 of 43: typography, part 1 — fonts.
#
# Narration below is the Burmese narration (voice-script.md next to this file
# holds the same text with its marks; DESIGN.md is the brief). Every [[mark:…]] sits where its
# action begins, at a sentence end; each span carries one piece of meaning.
# Everything the learner sees (title, chapters, whiteboard labels, UI strings)
# is already Burmese.
#
# Shape: board (recall lesson 29; @font-face defines, font-family uses, a list
# falls back) → code tour (header, mixed English/Burmese line, cards, about,
# empty fonts.css and styles.css) → .mixed font stack with Courier New first:
# English goes typewriter, Burmese falls to the next font (per-character
# fallback) → board (generic families, never quoted) → one block insert into
# fonts.css: two @font-face rules (Shop Myanmar = Noto Sans Myanmar, variable
# 100–900, unicode-range U+1000-109F; Shop Display = local() then Playfair
# Display) → descriptors, MIME/CORS → board (font-display periods and values)
# → shop name, mixed line and prices use "Shop Display", "Shop Myanmar" →
# weights 300 / 500 / 800 on the shop name → board (variable font axis, static
# fonts, synthesis) → italic on the mixed line (fake slant) → a third
# @font-face with font-style: italic (real italic letters for English; Burmese
# stays a fake slant) → about paragraph 18px, then the same in rem →
# letter-spacing on the English tagline, then on the mixed line (Burmese
# syllables break apart) → html lang="my" / span lang="en" → " :lang(en)"
# inserted into the mixed rule's selector (only the English is italic and
# spaced) → lining-nums on the prices (Playfair's digits are old style; the
# Google file has no tabular digits, said honestly) → board (font shorthand
# order and resets) → quiz board + recap, hand-off to lesson 31.
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only keystroke-typed
# file and never contains url(, @import or image-set(. The url() rules live in
# fonts.css, which is never typed: it starts empty and gets two complete
# `block` inserts (one save each), so Vite's postcss sees only valid CSS.
# Web fonts load from fonts.gstatic.com (font/woff2, Access-Control-Allow-
# Origin: *, Cross-Origin-Resource-Policy: cross-origin — checked 2026-10-17),
# so they load under the studio's COEP and in the replay. Unitless lengths are
# invalid until the unit lands (18 → 18px, 1.125 → 1.125rem, 0.12 → 0.12em).
# Weights pass through 3, 30, 5, 50, 8, 80 (valid, a sub-second flash, never
# narrated). The " :lang(en)" insert has an unclosed "(" for a moment, which
# drops the rules after it (only .story, scrolled out of view) until ")" lands.
#
# Measured in headless Chrome at 432 × 720 (probe/stages.ts, same anchors; CDP
# CSS.getPlatformFontsForNode): start — English of the mixed line in Myanmar
# Sangam MN, Burmese in Noto Sans Myanmar (system); Courier stack — English
# Courier New:14 glyphs, Burmese Noto Sans Myanmar:17; after "use" — English
# Playfair Display (web), Burmese Noto Sans Myanmar (web), prices' digits in
# Playfair (old style, widths 38.25 / 40.09 / 39.50 / 43.11); italic before
# the italic face — synthetic slant on both; after the italic face — English
# real italic; letter-spacing on the mixed line wraps it to two lines (72 tall)
# with the Burmese syllables split; after :lang(en) one line again (36 tall);
# lining-nums — digit widths 39.94 / 40.91 / 40.09 / 44.48 (tabular-nums has no
# effect: the Google subset has no tnum). Header 0–244, mixed line 260, drinks
# 312–808, about 824 → story 884 (162 tall at 18px), document 1087.
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
schemaVersion: 1

