# Rust from zero, lesson 11: pattern matching. match compares one value with
# each pattern in order, the first pattern that fits runs, a pattern can bind
# the data inside a variant, and match is an expression (a diagram is drawn in
# on the whiteboard). A missing arm is a compile error, so the E0004 answer
# goes on a second board, since an insert-only lesson can't run broken code.
# Then, built live in a loop over three shapes: a match that computes each
# area, a match on that number with ranges and the _ catch-all, and if let for
# the one variant we care about. One run, and a recap board.
#
# Both E0004 messages in the lesson ("non-exhaustive patterns: `Shape::Dot`
# not covered" on the board, and "`10_u32..=u32::MAX` not covered" for the
# area match without `_`, said as "ten and up aren't covered") were confirmed
# with rustc 1.98 --edition 2024 by removing that arm from the final program.
# The fixture is the exact output of the final program, which compiles with
# no warnings.
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/rust-match.yaml
schemaVersion: 1

lesson:
  slug: rust-match
  title: "Rust from zero: Pattern matching"
  locale: my-MM
  workspace:
    lessonType: rust
    name: Rust Lesson
    entryFilePath: main.rs
