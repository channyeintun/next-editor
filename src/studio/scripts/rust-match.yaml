runtime:
  kind: rust-playground
  defaultMode: fixture
  fixture:
    latencyMs: 600
    result:
      status: success
      stdout: "area 9: small

        area 10: large

        rect is 2 by 5

        area 0: empty\n"
      stderr: ""

scenes:
  - id: how-match-works
    chapter: match က ဘယ်လို အလုပ်လုပ်လဲ
    narration: >-
      [[mark:open-board]] ပြီးခဲ့တဲ့ lesson မှာ enum ကို တွေ့ခဲ့ပြီးပါပြီ။ enum တန်ဖိုး တစ်ခုဆိုတာ
      သတ်မှတ်ထားတဲ့ variant တွေထဲက တစ်ခု ဖြစ်ပါတယ်။ ဒါဆို ကိုယ့်လက်ထဲက တန်ဖိုးက ဘယ် variant လဲ ဆိုတာ
      ဘယ်လို သိမလဲ၊ ပြီးတော့ အထဲက data ကို ဘယ်လို ထုတ်ယူမလဲ။ ဒါအတွက် match ကို သုံးပါတယ်။
      [[mark:draw-value]] ဒီမှာ Rect 2 နဲ့ 5 ဆိုတဲ့ တန်ဖိုး တစ်ခု ရှိပါတယ်။ [[mark:draw-arms]] match
      က ဒီ တန်ဖိုးကို pattern တစ်ခုချင်းစီနဲ့ အပေါ်ကနေ အောက်ကို အစဉ်လိုက် တိုက်စစ်ပါတယ်။
      [[mark:draw-skip]] Square နဲ့ မကိုက်တဲ့အတွက် ဒီ arm ကို ကျော်သွားပါတယ်။ [[mark:draw-fit]] Rect
      နဲ့တော့ ကိုက်တဲ့အတွက် အဲဒီ arm က run ပါတယ်။ အရင်ဆုံး ကိုက်တဲ့ arm က အနိုင်ရပြီး၊ သူ့အောက်က arm
      တွေကို ဆက်မစစ်တော့ပါဘူး။ [[mark:draw-bind]] ပြီးတော့ pattern က variant ထဲက data တွေကို နာမည်
      ပေးလိုက်ပါတယ်။ w က 2 ကို ရပြီး၊ h က 5 ကို ရသွားပါတယ်။ [[mark:draw-result]] နောက်တစ်ခုက၊ match
      က if လိုပဲ expression တစ်ခု ဖြစ်ပါတယ်။ run သွားတဲ့ arm က တန်ဖိုး တစ်ခု ပြန်ပေးပါတယ်။
      ဒီမှာဆိုရင် area ဖြစ်တဲ့ 10 ကို ပြန်ပေးတာပါ။
    sources:
      - title: "The Rust Book — The match Control Flow Construct"
        url: "https://doc.rust-lang.org/book/ch06-02-match.html"
      - title: "The Rust Reference — match expressions"
        url: "https://doc.rust-lang.org/reference/expressions/match-expr.html"
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { mark: open-board }
        open: true
        upsertIds: [b1-title]
      - id: draw-value
        type: whiteboard.apply
        at: { mark: draw-value }
        upsertIds: [b1-value, b1-value-t, b1-value-label]
        drawMs: 1200
      - id: draw-arms
        type: whiteboard.apply
        at: { mark: draw-arms }
        upsertIds: [b1-arrow-in, b1-arm1, b1-arm1-t, b1-arm2, b1-arm2-t, b1-arm3, b1-arm3-t]
        drawMs: 2400
      - id: draw-skip
        type: whiteboard.apply
        at: { mark: draw-skip }
        upsertIds: [b1-skip, b1-skip-t]
        drawMs: 1000
      - id: draw-fit
        type: whiteboard.apply
        at: { mark: draw-fit }
        upsertIds: [b1-check, b1-rest-t]
        drawMs: 1200
      - id: draw-bind
        type: whiteboard.apply
        at: { mark: draw-bind }
        upsertIds: [b1-arrow-bind, b1-bind-t]
        drawMs: 1400
      - id: draw-result
        type: whiteboard.apply
        at: { mark: draw-result }
        upsertIds: [b1-arrow-result, b1-result, b1-result-t]
        drawMs: 1600

  - id: build-area
    narration: >-
      ဒါကို code နဲ့ ရေးကြည့်ရအောင်။ [[mark:open-main]] ဒီမှာ Shape ဆိုတဲ့ enum တစ်ခု ရှိပါတယ်။
      Square နဲ့ Rect က ကိန်းဂဏန်းတွေ သယ်ထားပြီး၊ Dot ကတော့ ဘာမှ မသယ်ပါဘူး။ အောက်က loop ကတော့ shape
      သုံးခုကို တစ်ခုချင်း သွားပါတယ်။ [[mark:type-area]] အခု shape ကို match လုပ်ပြီး၊ ရလဒ်ကို area
      ထဲ ထည့်ကြည့်ပါမယ်။ variant တစ်ခုစီအတွက် arm တစ်ခုစီ ရှိပါတယ်။ [[mark:select-arm]] arm တစ်ခုကို
      ကြည့်ရင်၊ pattern၊ ပြီးတော့ arrow၊ ပြီးတော့ ပြန်ပေးမယ့် တန်ဖိုး၊ ဒီအစဉ်အတိုင်း ရေးထားပါတယ်။
      [[mark:select-bind]] ဒီ pattern ထဲမှာ w နဲ့ h က variable အသစ်တွေပါ။ Rect ထဲက ကိန်းဂဏန်း
      နှစ်ခုကို သူတို့က လက်ခံလိုက်တဲ့အတွက်၊ ဒီ arm ထဲမှာ အဲဒီ နှစ်ခုကို မြှောက်လို့ ရသွားပါတယ်။
      [[mark:select-dot]] Dot မှာ data မပါတဲ့အတွက် သူ့ area က 0 ပါ။ arm တိုင်းက type တစ်မျိုးတည်း
      ပြန်ပေးရပါမယ်။ ဘာကြောင့်လဲဆိုတော့ area မှာ type တစ်ခုပဲ ရှိနိုင်လို့ပါ။
    sources:
      - title: "The Rust Book — Patterns That Bind to Values"
        url: "https://doc.rust-lang.org/book/ch06-02-match.html#patterns-that-bind-to-values"
      - title: "Rust by Example — Destructuring enums"
        url:
          "https://doc.rust-lang.org/rust-by-example/flow_control/match/destructuring/destructure_enum.h\
          tml"
    actions:
      - id: close-board1
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: main.rs
      - id: type-area
        type: editor.type
        at: { mark: type-area, offsetMs: -200 }
        target:
          file: main.rs
          after: "    for shape in shapes {\n"
          occurrence: 1
        cadence: line-by-line
        text: "        let area = match shape {

          \            Shape::Square(side) => side * side,

          \            Shape::Rect(w, h) => w * h,

          \            Shape::Dot => 0,

          \        };\n"
      - id: select-arm
        type: editor.select
        at: { mark: select-arm }
        target:
          file: main.rs
          text: "Shape::Square(side) => side * side"
          occurrence: 1
      - id: select-bind
        type: editor.select
        at: { mark: select-bind }
        target:
          file: main.rs
          text: "Shape::Rect(w, h)"
          occurrence: 1
      - id: select-dot
        type: editor.select
        at: { mark: select-dot }
        target:
          file: main.rs
          text: "Shape::Dot => 0"
          occurrence: 1

  - id: exhaustive
    chapter: case တိုင်း ပါရမယ်
    narration: >-
      [[mark:open-rules]] ဒါဆို arm တစ်ခု ထည့်ဖို့ မေ့သွားရင် ဘာဖြစ်မလဲ။ [[mark:draw-broken]]
      ဥပမာအားဖြင့်၊ match ထဲမှာ Square နဲ့ Rect ကိုတော့ handle လုပ်ထားပြီး၊ Dot အတွက် arm မပါဘူး
      ဆိုပါစို့။ [[mark:draw-error]] အဲဒီအခါ compile လုပ်လို့ မရတော့ပါဘူး။ compiler က E0004 error၊
      non-exhaustive patterns နဲ့ ရပ်သွားပါတယ်။ လွတ်နေတဲ့ case ကိုလည်း နာမည်နဲ့ တန်းပြောပြပါတယ်၊ Dot
      ကို handle မလုပ်ထားဘူးတဲ့။ exhaustive ဆိုတာ ဖြစ်နိုင်တဲ့ တန်ဖိုး တိုင်းကို handle လုပ်ထားတယ်
      ဆိုတဲ့ အဓိပ္ပာယ်ပါ။ [[mark:draw-why]] ဒီ စည်းကမ်းက တကယ် အသုံးဝင်ပါတယ်။ နောက်ပိုင်းမှာ Circle
      လို variant အသစ် တစ်ခု ထပ်ထည့်လိုက်တယ် ဆိုပါစို့။ အဲဒီအခါ အဲဒီ variant ကို handle မလုပ်ရသေးတဲ့
      match တိုင်းကို compiler က လိုက်ပြပေးပါတယ်။ catch-all arm ပါတဲ့ match ကတော့ ချွင်းချက်ပါ၊
      catch-all ကို ခဏနေရင် တွေ့ရပါမယ်။ တခြား ဘာသာစကား အများစုမှာတော့ case တစ်ခု လွတ်နေရင်လည်း
      compile လုပ်လို့ ရနေပြီး၊ program run နေချိန်ကျမှ bug က ပေါ်လာတာမျိုးပါ။ [[mark:draw-fix]]
      ပြင်နည်းကတော့ လွတ်နေတဲ့ arm ကို ထပ်ထည့်လိုက်ရုံပါပဲ။
    sources:
      - title: "Rust error codes — E0004"
        url: "https://doc.rust-lang.org/error_codes/E0004.html"
      - title: "The Rust Book — Matches Are Exhaustive"
        url: "https://doc.rust-lang.org/book/ch06-02-match.html#matches-are-exhaustive"
    actions:
      - id: open-rules
        type: whiteboard.apply
        at: { mark: open-rules }
        open: true
        clear: true
        upsertIds: [b2-title]
      - id: draw-broken
        type: whiteboard.apply
        at: { mark: draw-broken }
        upsertIds: [b2-code1, b2-code2, b2-code3, b2-code4]
        drawMs: 2400
      - id: draw-error
        type: whiteboard.apply
        at: { mark: draw-error }
        upsertIds: [b2-underline, b2-err1, b2-err2]
        drawMs: 2400
      - id: draw-why
        type: whiteboard.apply
        at: { mark: draw-why }
        upsertIds: [b2-why1, b2-why2]
        drawMs: 2200
      - id: draw-fix
        type: whiteboard.apply
        at: { mark: draw-fix }
        upsertIds: [b2-fix, b2-fix-check]
        drawMs: 1400

  - id: catch-all
    chapter: "_ ဆိုတဲ့ catch-all"
    narration: >-
      အခု ကိန်းဂဏန်း တစ်ခုကို match လုပ်ကြည့်ရအောင်။ [[mark:type-size]] area တစ်ခုချင်းစီကို
      အရွယ်အစား ပြောတဲ့ စကားလုံး တစ်လုံးအဖြစ် ပြောင်းပေးပါမယ်။ [[mark:select-range]] pattern တစ်ခုက
      0 လို ကိန်းဂဏန်း တစ်ခုတည်း ဖြစ်နိုင်သလို၊ 1 ကနေ 9 အထိ ဆိုတာမျိုး range တစ်ခုလည်း
      ဖြစ်နိုင်ပါတယ်။ ဒါပေမဲ့ u32 တစ်ခုမှာ ဖြစ်နိုင်တဲ့ တန်ဖိုးက သန်းပေါင်း လေးထောင်ကျော်
      ရှိတဲ့အတွက်၊ အကုန်လုံးကို တစ်ခုချင်း ရေးလို့ မရပါဘူး။ [[mark:select-underscore]] ဒါကြောင့်
      နောက်ဆုံး arm မှာ underscore ကို သုံးပါတယ်။ ဒါက catch-all pattern ပါ၊ ဆိုလိုတာက ကျန်တာ အကုန်
      ဖမ်းတဲ့ arm ပါ။ အပေါ်က arm တွေနဲ့ မကိုက်တဲ့ တန်ဖိုး ဘာပဲ ဖြစ်ဖြစ် သူနဲ့ ကိုက်ပါတယ်။ သူ့ကို
      နောက်ဆုံးမှာ ထားရပါတယ်။ ဘာကြောင့်လဲဆိုတော့ arm တွေကို အစဉ်လိုက် စစ်တာ ဖြစ်လို့၊ underscore
      နောက်မှာ arm တစ်ခု ထပ်ထည့်ရင် အဲဒီ arm က ဘယ်တော့မှ run မဖြစ်တော့မှာပါ။ underscore မပါရင်တော့
      10 နဲ့ အထက် တန်ဖိုးတွေကို handle မလုပ်ရသေးတဲ့အတွက်၊ E0004 error ပြန်တက်ပါလိမ့်မယ်။
      [[mark:type-print]] ပြီးရင် area နဲ့ သူ့ size ကို print ထုတ်ပါမယ်။
    sources:
      - title: "The Rust Book — Catch-All Patterns and the _ Placeholder"
        url: "https://doc.rust-lang.org/book/ch06-02-match.html#catch-all-patterns-and-the-_-placeholder"
      - title: "The Rust Reference — Range patterns"
        url: "https://doc.rust-lang.org/reference/patterns.html#range-patterns"
      - title: "std — u32::MAX"
        url: "https://doc.rust-lang.org/std/primitive.u32.html#associatedconstant.MAX"
    actions:
      - id: close-rules
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: type-size
        type: editor.type
        at: { mark: type-size, offsetMs: -200 }
        target:
          file: main.rs
          after: "            Shape::Dot => 0,

            \        };\n"
          occurrence: 1
        cadence: line-by-line
        text: "        let size = match area {

          \            0 => \"empty\",

          \            1..=9 => \"small\",

          \            _ => \"large\",

          \        };\n"
      - id: select-range
        type: editor.select
        at: { mark: select-range }
        target:
          file: main.rs
          text: "1..=9"
          occurrence: 1
      - id: select-underscore
        type: editor.select
        at: { mark: select-underscore }
        target:
          file: main.rs
          text: '_ => "large"'
          occurrence: 1
      - id: type-print
        type: editor.type
        at: { mark: type-print }
        target:
          file: main.rs
          after: "            _ => \"large\",

            \        };\n"
          occurrence: 1
        cadence: line-by-line
        text: "        println!(\"area {area}: {size}\");\n"

  - id: if-let
    chapter: case တစ်ခုအတွက် if let
    narration: >-
      [[mark:type-iflet]] တစ်ခါတစ်လေ variant တစ်ခုတည်းပဲ အရေးကြီးတာမျိုး ရှိပါတယ်။ ဥပမာအားဖြင့်၊
      Rect ဖြစ်မှသာ သူ့ အနားတွေကို print ထုတ်ချင်တယ် ဆိုပါစို့။ [[mark:select-iflet]] if let မှာ
      pattern တစ်ခု၊ ပြီးတော့ equal sign၊ ပြီးတော့ တန်ဖိုး တစ်ခု၊ ဒီအစဉ်အတိုင်း ရေးပါတယ်။ ကိုက်ရင် w
      နဲ့ h က ကိန်းဂဏန်းတွေကို ရသွားပြီး၊ block က run ပါတယ်။ မကိုက်ရင်တော့ block ကို ကျော်သွားပါတယ်။
      ဒါကို match နဲ့ ရေးမယ်ဆိုရင် ဘာမှ မလုပ်တဲ့ underscore arm တစ်ခု ထပ်လိုမှာ ဖြစ်လို့၊ if let က
      ပိုတိုပါတယ်။ ဒါပေမဲ့ if let က exhaustive မဟုတ်ပါဘူး။ ဒါကြောင့် ကျန်တဲ့ case တွေ
      အရေးမကြီးတဲ့အခါမှပဲ သုံးသင့်ပါတယ်။ ပြီးတော့ ဒီနေရာမှာ shape ကို ဆက်သုံးလို့ ရနေသေးတာ သတိထား
      ကြည့်ပါ။ ဘာကြောင့်လဲဆိုတော့ ပထမ match က shape ထဲက ကိန်းဂဏန်းတွေကိုပဲ copy ကူးယူသွားတာ
      ဖြစ်လို့ပါ။ if let ကို Option နဲ့ တွဲသုံးတာကိုလည်း မကြာခဏ တွေ့ရပါလိမ့်မယ်။ if let Some ဆိုတာ
      တန်ဖိုး တစ်ခု ရှိမှသာ အဲဒီ တန်ဖိုးကို သုံးတာပါ။
    sources:
      - title: "The Rust Book — Concise Control Flow with if let"
        url: "https://doc.rust-lang.org/book/ch06-03-if-let.html"
      - title: "Rust by Example — if let"
        url: "https://doc.rust-lang.org/rust-by-example/flow_control/if_let.html"
    actions:
      - id: type-iflet
        type: editor.type
        at: { mark: type-iflet, offsetMs: -200 }
        target:
          file: main.rs
          after: "        println!(\"area {area}: {size}\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "        if let Shape::Rect(w, h) = shape {

          \            println!(\"rect is {w} by {h}\");

          \        }\n"
      - id: select-iflet
        type: editor.select
        at: { mark: select-iflet }
        target:
          file: main.rs
          text: "if let Shape::Rect(w, h) = shape"
          occurrence: 1

  - id: run
    narration: >-
      [[mark:run]] ကဲ၊ run ကြည့်ရအောင်။ Square ရဲ့ area က 9 ဖြစ်တဲ့အတွက် small ဖြစ်ပါတယ်။ Rect ရဲ့
      area ကတော့ 10 ပါ။ 9 ကို ကျော်သွားတဲ့အတွက် underscore arm က large ကို ပြန်ပေးပြီး၊ if let ကလည်း
      သူ့ အနားတွေ ဖြစ်တဲ့ 2 နဲ့ 5 ကို print ထုတ်ပေးပါတယ်။ နောက်ဆုံး Dot ရဲ့ area က 0 ဖြစ်လို့ empty
      ဖြစ်ပါတယ်။
    sources:
      - title: "Rust by Example — match"
        url: "https://doc.rust-lang.org/rust-by-example/flow_control/match.html"
    actions:
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "area 10: large"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: "if let Shape::Rect(w, h) = shape {"

  - id: wrap
    narration: >-
      [[mark:recap-match]] ဒါဆို ပြန်ချုပ်ရရင်၊ match တစ်ခုမှာ ဖြစ်နိုင်တဲ့ case တိုင်း ပါရပြီး၊
      အရင်ဆုံး ကိုက်တဲ့ pattern က အနိုင်ရပါတယ်။ [[mark:recap-bind]] pattern တစ်ခုက variant ထဲက data
      ကို ဆွဲထုတ်ပေးနိုင်ပါတယ်။ [[mark:recap-any]] underscore က ကျန်တာ အကုန် ဖမ်းတဲ့အတွက်၊
      နောက်ဆုံးမှာ ထားရပါတယ်။ [[mark:recap-iflet]] ပြီးတော့ if let က pattern တစ်ခုတည်းကို handle
      လုပ်ပြီး၊ ကျန်တာကို ကျော်သွားပါတယ်။ နောက် lesson မှာတော့ Vec၊ ဆိုလိုတာက ကြီးလာနိုင်တဲ့ တန်ဖိုး
      စာရင်းတွေကို ကြည့်သွားပါမယ်။
    sources:
      - title: "The Rust Book — Enums and Pattern Matching"
        url: "https://doc.rust-lang.org/book/ch06-00-enums.html"
      - title: "The Rust Book — Storing Lists of Values with Vectors"
        url: "https://doc.rust-lang.org/book/ch08-01-vectors.html"
    actions:
      - id: open-recap
        type: whiteboard.apply
        at: { mark: recap-match, offsetMs: -300 }
        open: true
        clear: true
        upsertIds: [b3-title]
      - id: recap-match
        type: whiteboard.apply
        at: { mark: recap-match }
        upsertIds: [b3-match-box, b3-match-k, b3-match-arrow, b3-match-d]
        drawMs: 1600
      - id: recap-bind
        type: whiteboard.apply
        at: { mark: recap-bind }
        upsertIds: [b3-bind-box, b3-bind-k, b3-bind-arrow, b3-bind-d]
        drawMs: 1600
      - id: recap-any
        type: whiteboard.apply
        at: { mark: recap-any }
        upsertIds: [b3-any-box, b3-any-k, b3-any-arrow, b3-any-d]
        drawMs: 1400
      - id: recap-iflet
        type: whiteboard.apply
        at: { mark: recap-iflet }
        upsertIds: [b3-iflet-box, b3-iflet-k, b3-iflet-arrow, b3-iflet-d]
        drawMs: 1400

checks:
  - { type: timing.p95Ms, max: 300 }
