build:
  voiceProfile: pocket-alba-v1
  seed: 37

runtime:
  kind: rust-playground
  defaultMode: fixture
  fixture:
    latencyMs: 600
    result:
      status: success
      stdout: "area 9: small\narea 10: large\nrect is 2 by 5\narea 0: empty\n"
      stderr: ""

scenes:
  - id: how-match-works
    chapter: How match works
    narration: >
      [[mark:open-board]] You've seen enums: a value that's one of several
      variants. So how do you find out which variant you have, and get the
      data inside? You use match. [[mark:draw-value]] Here's a value: a Rect
      that's two by five. [[mark:draw-arms]] match compares it with each
      pattern, from top to bottom. [[mark:draw-skip]] Square doesn't fit, so
      it's skipped. [[mark:draw-fit]] Rect fits, so that arm runs. The first
      fit wins, and the arms below it aren't checked. [[mark:draw-bind]] The
      pattern also gives names to the data inside the variant. w gets two,
      and h gets five. [[mark:draw-result]] And match is an expression, like
      an if. The arm that runs gives back a value: here, the area, ten.
    sources:
      - title: "The Rust Book — The match Control Flow Construct"
        url: "https://doc.rust-lang.org/book/ch06-02-match.html"
      - title: "The Rust Reference — match expressions"
        url: "https://doc.rust-lang.org/reference/expressions/match-expr.html"
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { mark: open-board }
        open: true
        upsertIds: [b1-title]
      - id: draw-value
        type: whiteboard.apply
        at: { mark: draw-value }
        upsertIds: [b1-value, b1-value-t, b1-value-label]
        drawMs: 1200
      - id: draw-arms
        type: whiteboard.apply
        at: { mark: draw-arms }
        upsertIds: [b1-arrow-in, b1-arm1, b1-arm1-t, b1-arm2, b1-arm2-t, b1-arm3, b1-arm3-t]
        drawMs: 2400
      - id: draw-skip
        type: whiteboard.apply
        at: { mark: draw-skip }
        upsertIds: [b1-skip, b1-skip-t]
        drawMs: 1000
      - id: draw-fit
        type: whiteboard.apply
        at: { mark: draw-fit }
        upsertIds: [b1-check, b1-rest-t]
        drawMs: 1200
      - id: draw-bind
        type: whiteboard.apply
        at: { mark: draw-bind }
        upsertIds: [b1-arrow-bind, b1-bind-t]
        drawMs: 1400
      - id: draw-result
        type: whiteboard.apply
        at: { mark: draw-result }
        upsertIds: [b1-arrow-result, b1-result, b1-result-t]
        drawMs: 1600

  - id: build-area
    narration: >
      Let's write it. [[mark:open-main]] Here's a Shape enum. Square and
      Rect carry numbers, and Dot carries nothing. The loop goes through
      three shapes. [[mark:type-area]] Let's match on shape, and store the
      result in area. There's one arm for each variant.
      [[mark:select-arm]] Each arm is a pattern, then an arrow, then the
      value it gives back. [[mark:select-bind]] In this pattern, w and h are new variables. They take the two numbers
      inside the Rect, so this arm can multiply them. [[mark:select-dot]] Dot
      has no data, so its area is zero. Every arm must give back the same
      type, because area can only have one.
    sources:
      - title: "The Rust Book — Patterns That Bind to Values"
        url: "https://doc.rust-lang.org/book/ch06-02-match.html#patterns-that-bind-to-values"
      - title: "Rust by Example — Destructuring enums"
        url: "https://doc.rust-lang.org/rust-by-example/flow_control/match/destructuring/destructure_enum.html"
    actions:
      - id: close-board1
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: main.rs
      - id: type-area
        type: editor.type
        at: { mark: type-area, offsetMs: -200 }
        target:
          file: main.rs
          after: "    for shape in shapes {\n"
          occurrence: 1
        cadence: line-by-line
        text: "        let area = match shape {\n            Shape::Square(side) => side * side,\n            Shape::Rect(w, h) => w * h,\n            Shape::Dot => 0,\n        };\n"
      - id: select-arm
        type: editor.select
        at: { mark: select-arm }
        target:
          file: main.rs
          text: "Shape::Square(side) => side * side"
          occurrence: 1
      - id: select-bind
        type: editor.select
        at: { mark: select-bind }
        target:
          file: main.rs
          text: "Shape::Rect(w, h)"
          occurrence: 1
      - id: select-dot
        type: editor.select
        at: { mark: select-dot }
        target:
          file: main.rs
          text: "Shape::Dot => 0"
          occurrence: 1

  - id: exhaustive
    chapter: Every case must be covered
    narration: >
      [[mark:open-rules]] What if you forget an arm? [[mark:draw-broken]]
      Say the match handles Square and Rect, but there's no arm for Dot.
      [[mark:draw-error]] Then it doesn't compile. You get error E0004:
      non-exhaustive patterns. It names the missing case: Dot isn't covered.
      Exhaustive means every possible value is handled. [[mark:draw-why]]
      That helps. Say you add a new variant later, like Circle.
      The compiler then shows you every match that doesn't handle it yet,
      unless that match has a catch-all arm. You'll meet the catch-all next. In
      many languages, a missing case still compiles, and the bug shows up
      when the program runs. [[mark:draw-fix]] The fix is to add the missing
      arm.
    sources:
      - title: "Rust error codes — E0004"
        url: "https://doc.rust-lang.org/error_codes/E0004.html"
      - title: "The Rust Book — Matches Are Exhaustive"
        url: "https://doc.rust-lang.org/book/ch06-02-match.html#matches-are-exhaustive"
    actions:
      - id: open-rules
        type: whiteboard.apply
        at: { mark: open-rules }
        open: true
        clear: true
        upsertIds: [b2-title]
      - id: draw-broken
        type: whiteboard.apply
        at: { mark: draw-broken }
        upsertIds: [b2-code1, b2-code2, b2-code3, b2-code4]
        drawMs: 2400
      - id: draw-error
        type: whiteboard.apply
        at: { mark: draw-error }
        upsertIds: [b2-underline, b2-err1, b2-err2]
        drawMs: 2400
      - id: draw-why
        type: whiteboard.apply
        at: { mark: draw-why }
        upsertIds: [b2-why1, b2-why2]
        drawMs: 2200
      - id: draw-fix
        type: whiteboard.apply
        at: { mark: draw-fix }
        upsertIds: [b2-fix, b2-fix-check]
        drawMs: 1400

  - id: catch-all
    chapter: "The _ catch-all"
    narration: >
      Now let's match on a number. [[mark:type-size]] We'll turn each area
      into a size word. [[mark:select-range]] A pattern can be one number,
      like zero, or a range, like one to nine. But a u32 has over four
      billion values, and you can't list them all. [[mark:select-underscore]]
      So the last arm is an underscore. It's the
      catch-all pattern: it matches any value that's left. It goes last,
      because the arms are checked in order, and an arm after it would never
      run. Without it, you'd get E0004 again, because ten and up aren't
      covered. [[mark:type-print]] Then we print the area and its size.
    sources:
      - title: "The Rust Book — Catch-All Patterns and the _ Placeholder"
        url: "https://doc.rust-lang.org/book/ch06-02-match.html#catch-all-patterns-and-the-_-placeholder"
      - title: "The Rust Reference — Range patterns"
        url: "https://doc.rust-lang.org/reference/patterns.html#range-patterns"
      - title: "std — u32::MAX"
        url: "https://doc.rust-lang.org/std/primitive.u32.html#associatedconstant.MAX"
    actions:
      - id: close-rules
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: type-size
        type: editor.type
        at: { mark: type-size, offsetMs: -200 }
        target:
          file: main.rs
          after: "            Shape::Dot => 0,\n        };\n"
          occurrence: 1
        cadence: line-by-line
        text: "        let size = match area {\n            0 => \"empty\",\n            1..=9 => \"small\",\n            _ => \"large\",\n        };\n"
      - id: select-range
        type: editor.select
        at: { mark: select-range }
        target:
          file: main.rs
          text: "1..=9"
          occurrence: 1
      - id: select-underscore
        type: editor.select
        at: { mark: select-underscore }
        target:
          file: main.rs
          text: '_ => "large"'
          occurrence: 1
      - id: type-print
        type: editor.type
        at: { mark: type-print }
        target:
          file: main.rs
          after: "            _ => \"large\",\n        };\n"
          occurrence: 1
        cadence: line-by-line
        text: "        println!(\"area {area}: {size}\");\n"

  - id: if-let
    chapter: if let for one case
    narration: >
      [[mark:type-iflet]] Sometimes only one variant matters. Let's print the
      sides, but only for a Rect. [[mark:select-iflet]] if let takes one
      pattern, an equals sign, and a value. If it fits, w and h get the
      numbers, and the block runs. If it doesn't, the block is skipped. A match
      would need an underscore arm that does nothing, so this is shorter. But
      if let isn't exhaustive, so use it only when the other cases don't
      matter. And shape is still usable here: the first match only copied
      numbers out of it. [[mark:option-note]] You'll often see if let with
      Option, too: if let Some uses a value only when there's one.
    sources:
      - title: "The Rust Book — Concise Control Flow with if let"
        url: "https://doc.rust-lang.org/book/ch06-03-if-let.html"
      - title: "Rust by Example — if let"
        url: "https://doc.rust-lang.org/rust-by-example/flow_control/if_let.html"
    actions:
      - id: type-iflet
        type: editor.type
        at: { mark: type-iflet, offsetMs: -200 }
        target:
          file: main.rs
          after: "        println!(\"area {area}: {size}\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "        if let Shape::Rect(w, h) = shape {\n            println!(\"rect is {w} by {h}\");\n        }\n"
      - id: select-iflet
        type: editor.select
        at: { mark: select-iflet }
        target:
          file: main.rs
          text: "if let Shape::Rect(w, h) = shape"
          occurrence: 1

  - id: run
    narration: >
      [[mark:run]] Let's run it. [[mark:read-output]] The square's area is
      nine, so it's small. The rectangle's area is ten. That's past nine, so
      the underscore arm gives large, and if let prints its sides, two by
      five. And the dot's area is zero, so it's empty.
    sources:
      - title: "Rust by Example — match"
        url: "https://doc.rust-lang.org/rust-by-example/flow_control/match.html"
    actions:
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "area 10: large"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: "if let Shape::Rect(w, h) = shape {"

  - id: wrap
    narration: >
      [[mark:recap-match]] So, a match must cover every case, and the first
      pattern that fits wins. [[mark:recap-bind]] A pattern can pull out the data
      inside a variant. [[mark:recap-any]] The underscore catches everything
      else, so it goes last. [[mark:recap-iflet]] And if let handles one
      pattern, and skips the rest. Next, we'll look at vectors: lists of
      values that can grow.
    sources:
      - title: "The Rust Book — Enums and Pattern Matching"
        url: "https://doc.rust-lang.org/book/ch06-00-enums.html"
      - title: "The Rust Book — Storing Lists of Values with Vectors"
        url: "https://doc.rust-lang.org/book/ch08-01-vectors.html"
    actions:
      - id: open-recap
        type: whiteboard.apply
        at: { mark: recap-match, offsetMs: -300 }
        open: true
        clear: true
        upsertIds: [b3-title]
      - id: recap-match
        type: whiteboard.apply
