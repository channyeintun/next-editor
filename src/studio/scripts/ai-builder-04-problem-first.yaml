        # Problem · ကြိုမှာ app

      notes.md: |
        # Notes
      package.json: |
        {
          "name": "ai-builder-lesson",
          "private": true,
          "version": "1.0.0",
          "scripts": {
            "dev": "echo concept lesson: nothing to run"
          }
