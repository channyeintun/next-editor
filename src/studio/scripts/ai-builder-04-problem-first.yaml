# AI Builder, lesson 04: the problem before the solution (Burmese, the course pilot, docs kind).
#
# Start state (ws/): base-docs (package.json with a no-op dev script, notes.md) and docs/problem.md
# pinned with only its title line. Nothing runs. The lesson types all of COURSE-KIT §4.1 into
# problem.md, one section per action (line-by-line), interleaved with three boards.
#
# Boards: (A) solution first vs problem first, two columns flowing down (red ends in the wrong
# thing, orange/blue/green ends in what is needed); (I) weak vs good questions for users (red
# predictions, green past events, orange: what people did is the evidence); (Z) the quiz.
# Typed: Problem · Who · Today · Why it matters · How we'll know · Not the problem.
#
# Build: bun ~/Documents/ai-builder-course-work/tools/build-lesson.ts template.yaml ws ai-builder-04-problem-first.yaml
schemaVersion: 1
