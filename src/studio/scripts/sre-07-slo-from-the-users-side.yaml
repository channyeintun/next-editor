  - id: explicit
    narration: >
      [[mark:close-b3]] [[mark:show-p05]] ဒီ ပြဿနာရဲ့ အဖြေက မရေးထားတဲ့ ကတိကို ရေးထားတဲ့ ကတိ ဖြစ်အောင် လုပ်တာပါ။ profile အဖွဲ့က တကယ် ဆိုလိုတဲ့ SLO ကို ရေးတင်ပြီး သုံးတဲ့ အဖွဲ့တွေနဲ့ ပုံမှန် စကားပြောပါတယ်။ SLO ထက် အများကြီး ပိုကောင်းနေရင် အဲဒီ အပိုကို အားမကိုးပါနဲ့လို့ ကြိုပြောပြီး database ပြောင်းတာလို အပြောင်းအလဲတွေကိုလည်း ကြိုကြေညာပါတယ်။ Eats အဖွဲ့ကလည်း cache ကို ပြန်ထည့်ပါတယ်။
