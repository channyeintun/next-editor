# SRE from zero, lesson 07: SLOs from the user's side (Burmese concept lesson).
#
# Built from the approved voice script
# docs/sre-course/voice-scripts/sre-07-slo-from-the-users-side.md. Every spoken
# character is that script's "> " lines, unchanged; each ⟪…⟫ marker became a
# [[mark:…]] at the same place. Check it with:
#   bun ~/Documents/sre-course/work/check-narration.ts \
#     docs/sre-course/voice-scripts/sre-07-slo-from-the-users-side.md \
#     src/studio/scripts/sre-07-slo-from-the-users-side.yaml
#
# Nothing runs: deck pages and the whiteboard carry the lesson, and notes.md is
# the recap. The workspace and runtime follow the validated no-code skeleton
# (WebContainer, empty init command, a harmless dev script).
#
# The arc: every Eats SLO is green while lunch orders hang (cover); three ways
# a green SLO lies. Board B1 (P1 flow): where we measured, a lost callback and
# the synthetic test order. Pages: measure the journey, bad minutes, what only
# the phone sees. Board B2 (P5 bars): whom we averaged, the supermarket chain's
# Mandalay stores and per-customer SLOs. Board B3 (P5 bars): what we never
# promised, the profile service's implicit SLO. Pages: make the promise
# explicit, where SLOs strain, this week; recap on notes.md.
#
# Extra marks, all at existing sentence ends, add no spoken text: b1-s1b, b2-s2b
# and b3-s2b keep each board step to at most three new labelled elements and
# land the shop, the 2% note and the Eats box as they are named; b1-s3b and
# b2-s3b land the second bar and the finding as the narration names them;
# hook-lunch only splits the opening 488-character dialog; ask-question times
# the recap pause (see select-question). No page or board step holds longer
# than ~37 s at 70 ms/char (the cover), so no pacing page was added beyond the
# voice script's own.
#
# Boards. Colour jobs: #1e1e1e ink (paints white) for titles, axes and the
# finding arrow; blue the thing named and the delivered-reliability bars; green
# healthy (the two backends whose SLOs read green, the end-to-end test, the fix);
# red failure; orange the caveat or limit (the written threshold, the removed
# cache, the cost of getting better); violet the request flow and the teams
# that built on the profile service. A label on two lines is two text assets,
# one per line: the overflow rule counts a whole text's length.
#
# Deck pages: deck "Next Editor · SRE 2 · Agree and notice". The /pub URL
# below is a placeholder until Chan publishes the deck; the Director's
# unreachable-deck warning is expected until then. Page plan:
# ~/Documents/sre-course/work/pages/sre-07-slo-from-the-users-side.json
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/sre-07-slo-from-the-users-side.yaml
#   bun scripts/studio-compile-check.ts src/studio/scripts/sre-07-slo-from-the-users-side.yaml
