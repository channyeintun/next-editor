build:
  # Studio swaps in the Burmese voice chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 2607

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: hook
    chapter: SLO အစိမ်းနဲ့ ရပ်နေတဲ့ order
    narration: >
      [[mark:show-p01]] Top-up မှာ သဘောတူထားတဲ့ ပစ်မှတ် ဖြစ်တဲ့ service level objective၊ SLO တွေနဲ့ ပျက်ခွင့်၊ error budget ကုန်ရင် ဘာလုပ်မလဲ ဆိုတဲ့ policy ရလာတော့ အစားအသောက် ပို့ပေးတဲ့ Padauk Eats အဖွဲ့ကလည်း သူတို့အတွက် လုပ်ပေးဖို့ တောင်းပါတယ်။ မသီရိက Eats သုံးတဲ့ payment service နဲ့ order service အတွက် SLO တွေ ရေးပေးပါတယ်။
      [[mark:hook-lunch]] တစ်ရက် နေ့လယ်စာချိန်မှာ SLO တွေ အားလုံး အစိမ်းရောင် ပြနေပေမဲ့ ငွေဖြတ်သွားပြီ၊ loading က လည်နေတုန်းပဲ၊ ပြေစာလည်း မပေါ်ဘူး ဆိုတဲ့ message တွေ မစုရဲ့ support အဖွဲ့ဆီ အဆက်မပြတ် ဝင်လာပါတယ်။ ဒါဆို ဘာကို တိုင်းဖို့ မေ့ခဲ့လဲ?
      [[mark:show-p01b]] ဒီ lesson မှာ အစိမ်းရောင် SLO က လှည့်စားတတ်တဲ့ နည်း သုံးမျိုးကို ကြည့်ပါမယ်။ ဘယ်နေရာမှာ တိုင်းခဲ့လဲ၊ ဘယ်သူတွေကို ပျမ်းမျှခဲ့လဲ၊ ဘာကို ကတိ မပေးခဲ့လဲ ဆိုတာပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Product-Focused Reliability for SRE (sre.google)",
          url: "https://sre.google/resources/practices-and-processes/product-focused-reliability-for-sre/",
        }
      - {
          title: "SRE book, 1st ed: Service Level Objectives",
          url: "https://sre.google/sre-book/service-level-objectives/",
        }
    actions:
      # -1750 / -1450, as Module 1: a pull-back over 1780 ms pushes the first dialog
      # past the 2 s opening handle, which src/studio/plans/index.test.ts rejects.
      - { id: collapse-dock, type: runtime.collapseDock, at: { scene: start, offsetMs: -1750 } }
      - {
          id: show-p01,
          type: slide.show,
          at: { mark: show-p01, offsetMs: -1450 },
          slideId: l07-p01,
        }
      # The three lies, as the narration lists them.
      - { id: show-p01b, type: slide.show, at: { mark: show-p01b }, slideId: l07-p01b }

  - id: where-measured
    chapter: ဘယ်နေရာမှာ တိုင်းခဲ့လဲ
    narration: >
      [[mark:close-p01b]] [[mark:b1-s1]] မသီရိက နေ့လယ်စာ မှာတဲ့ လမ်းကြောင်းကို ဆွဲကြည့်ပါတယ်။ user က app ကနေ ငွေချေရင် payment service က ငွေဖြတ်ပြီး order service ကို ငွေရပြီလို့ ပြန်ခေါ်ပြောရပါတယ်၊ ဒီလို ပြန်ခေါ်တာကို callback လို့ ခေါ်ပါတယ်။ [[mark:b1-s1b]] callback ရောက်မှ order က ဆိုင်ဆီ ရောက်ပြီး app မှာ ပြေစာ ပေါ်တာပါ။ SLO တွေကတော့ service တစ်ခုချင်းအလိုက်ပဲ ရှိပါတယ်။
      [[mark:b1-s2]] အဲဒီနေ့က callback တွေ error မပြဘဲ တိတ်တိတ်လေး ပျောက်နေခဲ့ပါတယ်။ payment service က ငွေဖြတ်တာ အောင်မြင်နေလို့ အစိမ်းရောင်၊ order service ကလည်း ရောက်လာတဲ့ request တွေကို အကုန် လုပ်ပေးနေလို့ အစိမ်းရောင်ပါပဲ။ ရောက်မလာတဲ့ request ကိုတော့ fail လို့ ဘယ်သူမှ မရေတွက်ပါဘူး။ ဒါကြောင့် SLO တိုင်း အစိမ်းရောင် ဖြစ်နေပေမဲ့ user ကတော့ ငွေပေးပြီးသားနဲ့ ဗိုက်ဆာဆာ စောင့်နေရတာပါ။
      [[mark:b1-s3]] home page ပွင့်လား မိနစ်တိုင်း စစ်တဲ့ check ကလည်း လမ်းကြောင်းရဲ့ အစလေးကိုပဲ စစ်လို့ OK ပဲ ပြနေခဲ့ပါတယ်။ [[mark:b1-s3b]] ဒါကြောင့် မသီရိက test wallet နဲ့ test ဆိုင်ကို သုံးပြီး order တစ်ခုကို user လို အစအဆုံး မိနစ်တိုင်း မှာကြည့်တဲ့ synthetic test order ကို ထည့်ပါတယ်၊ ပြေစာ မပေါ်ရင် fail ဖြစ်လို့ user တွေ မတိုင်ခင် သိရပါမယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Product-Focused Reliability for SRE (sre.google)",
          url: "https://sre.google/resources/practices-and-processes/product-focused-reliability-for-sre/",
        }
      - {
          title: "Workbook: Implementing SLOs",
          url: "https://sre.google/workbook/implementing-slos/",
        }
    actions:
      - { id: close-p01b, type: slide.close, at: { mark: close-p01b, offsetMs: -400 } }
      # Step 1 is split in two: at most three boxes per step, and the shop lands as it is named.
      - id: b1-s1
        type: whiteboard.apply
        at: { mark: b1-s1 }
        open: true
        clear: true
        upsertIds:
          [
            l07-b1-app,
            l07-b1-app-t,
            l07-b1-a1,
            l07-b1-pay,
            l07-b1-pay-t,
            l07-b1-a2,
            l07-b1-ord,
            l07-b1-ord-t,
          ]
        drawMs: 2400
      - id: b1-s1b
        type: whiteboard.apply
        at: { mark: b1-s1b }
        upsertIds: [l07-b1-a3, l07-b1-shop, l07-b1-shop-t]
        drawMs: 1000
      - id: b1-s2
        type: whiteboard.apply
        at: { mark: b1-s2 }
        upsertIds: [l07-b1-strike, l07-b1-lost]
        drawMs: 1200
      - id: b1-s3
        type: whiteboard.apply
        at: { mark: b1-s3 }
        upsertIds: [l07-b1-home-bar, l07-b1-home-t]
        drawMs: 1200
      # The test order's bar lands as the narration names it.
      - id: b1-s3b
        type: whiteboard.apply
        at: { mark: b1-s3b }
        upsertIds: [l07-b1-test-bar, l07-b1-test-t]
        drawMs: 1600

  - id: journey
    narration: >
      [[mark:close-b1]] [[mark:show-p02]] ဒါက ပထမ လှည့်စားပုံပါ၊ တိုင်းတဲ့ နေရာ မှားနေတာပါ။ user တစ်ယောက် ရည်ရွယ်ချက် တစ်ခု ပြီးဖို့ ဖြတ်သွားရတဲ့ အရေးကြီး အဆင့်တွေကို critical user journey လို့ ခေါ်ပြီး service တစ်ခုချင်းအစား journey တစ်ခုလုံးကို တိုင်းရပါမယ်။ Eats အဖွဲ့က ဒီ journey ကို architecture ပုံထဲက နာမည်တွေနဲ့ မခေါ်ဘဲ user ပြောသလို နေ့လယ်စာ မှာမယ်လို့ ခေါ်ပြီး app ထဲမှာရော Padauk API မှာရော တိုင်းပါတယ်။
      [[mark:show-p02b]] journey ထဲက ဟင်း ရွေးတာ၊ Pay နှိပ်တာ၊ ပြေစာ မြင်တာ ဆိုတဲ့ အဆင့်တွေကိုလည်း နာမည်ပေးပြီး metric နဲ့ log လို telemetry တွေမှာ journey နာမည်ကို tag အဖြစ် တွဲထားတော့ ဘယ် journey ရဲ့ ဘယ်အဆင့်မှာ ပျက်နေလဲ ချက်ချင်း မြင်ရပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Product-Focused Reliability for SRE (sre.google)",
          url: "https://sre.google/resources/practices-and-processes/product-focused-reliability-for-sre/",
        }
      - {
          title: "Workbook: Implementing SLOs",
          url: "https://sre.google/workbook/implementing-slos/",
        }
    actions:
      - {
          id: close-b1,
          type: whiteboard.apply,
          at: { mark: close-b1, offsetMs: -400 },
          open: false,
        }
      - { id: show-p02, type: slide.show, at: { mark: show-p02 }, slideId: l07-p02 }
      - { id: show-p02b, type: slide.show, at: { mark: show-p02b }, slideId: l07-p02b }

  - id: bad-minutes
    chapter: Bad minute
    narration: >
      [[mark:show-p02c]] ဒါဆို journey ကို ဘယ်လို တိုင်းမလဲ? အဆင့်တိုင်းမှာ user ကြုံရတာကို တိုင်းတဲ့ ကိန်းဂဏန်း ဖြစ်တဲ့ service level indicator၊ SLI တစ်ခုစီ ရှိပါတယ်။ ဥပမာ နေ့လယ် ၁၂ နာရီ ၇ မိနစ်မှာ Pay နှိပ်တာ အဆင်ပြေပေမဲ့ ပြေစာ မြင်တဲ့ အဆင့်က fail နေရင် အဲဒီ မိနစ်ကို journey အတွက် မကောင်းတဲ့ မိနစ်၊ bad minute လို့ ရေတွက်ပါတယ်၊ user အတွက်တော့ အဆင့် တစ်ခု ပျက်ရင် journey တစ်ခုလုံး ပျက်တာပါပဲ။
      [[mark:show-p03]] journey SLO ကတော့ မိနစ် အားလုံးထဲက ကောင်းတဲ့ မိနစ် ရာခိုင်နှုန်းပါ။ ရက် ၃၀ မှာ မိနစ် ၄၃၂၀၀ ရှိပြီး product manager မနှင်းနဲ့ Eats အဖွဲ့က ၉၉.၉ ရာခိုင်နှုန်းကို သဘောတူထားတော့ တစ်လကို bad minute ၄၃ ခုလောက်ပဲ သုံးခွင့် ရှိပါတယ်၊ ဒါက journey ရဲ့ error budget ပါ။ callback ပျောက်တဲ့ နေ့လယ်မျိုးဆို ဒီ budget မြန်မြန် ကုန်လို့ alert တက်မှာပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Workbook: Implementing SLOs",
          url: "https://sre.google/workbook/implementing-slos/",
        }
      - {
          title: "SRE book, 1st ed: Service Level Objectives",
          url: "https://sre.google/sre-book/service-level-objectives/",
        }
    actions:
      - { id: show-p02c, type: slide.show, at: { mark: show-p02c }, slideId: l07-p02c }
      - { id: show-p03, type: slide.show, at: { mark: show-p03 }, slideId: l07-p03 }

  - id: phone
    chapter: ဖုန်းကပဲ မြင်တာ
    narration: >
      [[mark:show-p04]] တချို့ ပြဿနာတွေကို server က ဘယ်တော့မှ မမြင်ရပါဘူး။ app crash ဖြစ်တာ၊ လိုင်းပြတ်တာ၊ ခလုတ် နှိပ်လို့ ဘာမှ မဖြစ်တာတွေကို user ရဲ့ ဖုန်းကပဲ မြင်လို့ ဖုန်းဘက်ကနေ တိုင်းတဲ့ client-side SLO လည်း လိုပါတယ်။ ဒါပေမဲ့ ဖုန်းက data မှာ ရှောင်လို့မရတဲ့ နောက်ခံ fail တွေ အမြဲ ပါပါတယ်။
      [[mark:show-p04b]] ဥပမာ Eats rider တွေက ဈေးပေါတဲ့ ဖုန်းနဲ့ အားနည်းတဲ့ mobile data ကို သုံးလို့ ပုံမှန် နေ့တွေမှာတောင် request ၃ ရာခိုင်နှုန်းလောက် fail နေပါတယ်။ request တွေကို တိုက်ရိုက် ရေတွက်ရင် ပစ်မှတ်ကို ၉၇ ရာခိုင်နှုန်းအောက် လျှော့ထားရပြီး budget က အရမ်း ကျယ်သွားလို့ တကယ့် outage မှာတောင် page ဝင်မလာနိုင်တော့ပါဘူး။
      [[mark:show-p04c]] ဒါကြောင့် rider app မှာ တစ်မိနစ်အတွင်း fail တာ ၅ ရာခိုင်နှုန်း ကျော်မှ bad minute လို့ ရေတွက်ပါတယ်။ ဒီတော့ ပုံမှန် မိနစ်တွေက budget ကို မသုံးတော့ဘဲ rider တွေ တကယ် ဒုက္ခရောက်တဲ့ မိနစ်တွေကပဲ သုံးလို့ ပစ်မှတ်ကို တင်းတင်း ထားနိုင်ပါတယ်။
      [[mark:show-p04d]] ဖုန်းဘက်က ပြဿနာကို ပြင်ရင်လည်း app store ကနေ user တွေ update လုပ်တဲ့အထိ ရက်နဲ့ချီ စောင့်ရပါတယ်။ ဖုန်းက data ကလည်း နောက်ကျပြီး ရောက်တတ်သလို ဘယ်သူမဆို ခေါ်လို့ရတဲ့ public endpoint ကနေ ကိုယ် မထိန်းနိုင်တဲ့ device တွေဆီက လာတာမို့ ယုံဖို့ သတိထားရပါတယ်။
      ဒါကြောင့် SLI တစ်ခုချင်းကို အဖွဲ့တိုင်း ယုံတဲ့ အဓိပ္ပာယ် တစ်ခုတည်း သတ်မှတ်ပြီး မျှသုံးတဲ့ SLO tool တစ်ခုထဲမှာ ထားပါ၊ ဒါမှ ကိန်းဂဏန်းကို ငြင်းမနေဘဲ ပြင်ကြမှာပါ။
    sources:
