      notes.md: |
        # User ဘက်က ကြည့်တဲ့ SLO

        - critical user journey — user ရည်ရွယ်ချက် တစ်ခု ပြီးဖို့ ဖြတ်သွားတဲ့ အဆင့်တွေ၊ user ပြောသလို နာမည်ပေး
        - synthetic test order — လမ်းတစ်လျှောက်လုံးကို user လို လျှောက်စစ်တဲ့ test
        - bad minute — journey ရဲ့ အဆင့် တစ်ခုခု မကောင်းခဲ့တဲ့ မိနစ်
        - client-side SLO — server မမြင်ရတာကို ဖုန်းဘက်ကနေ တိုင်း
        - per-customer SLO — ပျမ်းမျှထဲမှာ ပျောက်နေတဲ့ customer ကြီးကို ခွဲတိုင်း
        - implicit SLO — ကတိ မပေးထားပေမဲ့ သုံးတဲ့သူတွေ အားကိုးလာတဲ့ reliability

        မေးခွန်း: ရက် 30၊ ကောင်းတဲ့ မိနစ် 99.5%။ bad minute ဘယ်နှခု သုံးခွင့် ရှိလဲ?
