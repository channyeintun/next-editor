  - id: never-promised
    chapter: ဘာကို ကတိ မပေးခဲ့လဲ
    narration: >
      [[mark:b3-s1]] တတိယ လှည့်စားပုံကတော့ ကတိ မပေးခဲ့တဲ့ နေရာက လာပါတယ်။ user လိပ်စာတွေ သိမ်းပြီး တခြား အဖွဲ့တွေကို ပေးတဲ့ profile service က SLO ကို ၉၉.၅ ရာခိုင်နှုန်းလို့ ရေးထားပေမဲ့ လပေါင်း အများကြီး တကယ် ပေးခဲ့တာက ၉၉.၉၉ ရာခိုင်နှုန်းပါ။
      [[mark:b3-s2]] ဘယ်တော့မှ မပျက်တာ မြင်တော့ တခြား အဖွဲ့တွေက သူ့အပေါ် တဖြည်းဖြည်း အားကိုးလာကြပါတယ်။ [[mark:b3-s2b]] ဥပမာ Eats အဖွဲ့က profile service ပျက်ရင် သုံးဖို့ ထားတဲ့ လိပ်စာ cache ကို မလိုတော့ဘူး ထင်ပြီး ဖြုတ်လိုက်ပေမဲ့ ဘယ်သူ့ကိုမှ မပြောခဲ့ပါဘူး။
      [[mark:b3-s3]] နောက်တော့ profile အဖွဲ့က database ကို အသစ် တစ်ခုဆီ ပြောင်းလိုက်တော့ ၉၉.၇ ရာခိုင်နှုန်းကို ကျသွားပါတယ်။ ရေးထားတဲ့ ၉၉.၅ ရာခိုင်နှုန်းထက် မြင့်နေသေးလို့ သူတို့အမြင်မှာ ဘာမှ မမှားပါဘူး။ ဒါပေမဲ့ သောကြာနေ့ နေ့လယ်စာချိန်မှာ profile service ခဏ ရပ်သွားတော့ Eats app က လိပ်စာ မပြနိုင်လို့ order တွေ ရပ်ကုန်ပါတယ်။
      [[mark:b3-s4]] service တစ်ခုကို သုံးတဲ့သူတွေက ရေးထားတဲ့ reliability ပေါ်မှာ မဟုတ်ဘဲ တကယ် ရနေတဲ့ reliability ပေါ်မှာ ဆောက်ကြပါတယ်။ ကတိ မပေးထားပေမဲ့ ဒီလိုပဲ အမြဲ ဖြစ်မှာလို့ အားကိုးလာတဲ့ အဲဒီ အဆင့်ကို implicit SLO လို့ ခေါ်ပါတယ်။ Hyrum's law ကလည်း user များလာရင် မြင်ရတဲ့ အပြုအမူ မှန်သမျှကို တစ်ယောက်ယောက်က အားကိုးလာမယ်လို့ ဆိုပါတယ်၊ reliability လည်း အဲဒီထဲမှာ ပါပါတယ်။
      [[mark:b3-s5]] reliability ကျသွားတာရော တက်လာတာရော နှစ်ဘက်လုံး ဒုက္ခ ပေးတတ်ပါတယ်။ ဖုန်းကုမ္ပဏီတွေဆီ ချိတ်ပေးတဲ့ operator gateway client က ရုတ်တရက် အများကြီး ပိုစိတ်ချရလာတော့ gateway ပျက်မှာ စိုးလို့ ဆောက်ထားတဲ့ Top-up ရဲ့ ညတိုင်း ပြန်စစ်တဲ့ job နဲ့ Bill Pay ရဲ့ retry wrapper က ကုန်ကျစရိတ် သက်သက် ဖြစ်သွားပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book, 1st ed: Service Level Objectives",
