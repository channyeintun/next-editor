  - id: whom-averaged
    chapter: ဘယ်သူတွေကို ပျမ်းမျှခဲ့လဲ
    narration: >
      [[mark:close-p04d]] [[mark:b2-s1]] ဒုတိယ လှည့်စားပုံက ဆိုင်တွေမှာ QR နဲ့ ငွေလက်ခံပေးတဲ့ Padauk for Business မှာ ပေါ်ပါတယ်။ ငွေချေမှု အားလုံးကို ပေါင်းကြည့်ရင် ၉၉.၉၁ ရာခိုင်နှုန်း အောင်မြင်နေလို့ dashboard က အစိမ်းရောင်ပါ။ ဒါပေမဲ့ တစ်မနက်မှာ အကြီးဆုံး customer ဖြစ်တဲ့ supermarket chain က ဒေါသတကြီး ဖုန်းဆက်လာပါတယ်။
      [[mark:b2-s2]] သူတို့ရဲ့ မန္တလေး ဆိုင်ခွဲတွေမှာ QR ငွေချေတာ ၂၅ ခါမှာ ၁ ခါ fail နေတာ ရက်အတော်ကြာနေပါပြီ။ [[mark:b2-s2b]] အဲဒီ ဆိုင်ခွဲတွေက ငွေချေမှု အားလုံးရဲ့ ၂ ရာခိုင်နှုန်းလောက်ပဲ ရှိလို့ သူတို့ရဲ့ ၉၆ ရာခိုင်နှုန်းက ပေါင်းထားတဲ့ ကိန်းဂဏန်းကို သိပ်မလှုပ်နိုင်ပါဘူး။ lesson ၄ က gray failure လိုပဲ ကိန်းဂဏန်း တစ်ခုတည်းက နေ့တိုင်း ဒုက္ခရောက်နေတဲ့ အုပ်စု သေးသေးလေးကို ဖုံးထားနိုင်တာပါ။
      [[mark:b2-s3]] ဒါကြောင့် Padauk က အကြီးဆုံး merchant ၁၀ ခုအတွက် တစ်ခုချင်း သီးသန့် တိုင်းတဲ့ per-customer SLO တွေ ထားလိုက်ပါတယ်၊ ရှိပြီးသား metric မှာ merchant label တစ်ခု ထည့်ရုံပါပဲ။ [[mark:b2-s3b]] ခွဲကြည့်တော့ fail တွေက ကောင်တာက ငွေရှင်းစက် model အဟောင်း တစ်မျိုးမှာပဲ စုနေတာ တွေ့ရပါတယ်။ အခုဆို alert မှာ merchant နာမည် ပါလာလို့ account manager က ဆိုင်တွေ မတိုင်ခင် chain ကို ကြိုဖုန်းဆက်နိုင်ပါပြီ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
