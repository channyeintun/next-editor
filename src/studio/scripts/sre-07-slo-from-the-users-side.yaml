  - id: strain
    chapter: SLO ရဲ့ အကန့်အသတ်
    narration: >
      [[mark:show-p06]] SLO တွေ မကိုက်တဲ့ နေရာတွေလည်း ရှိပါတယ်။ SLO က event တစ်ခုချင်းကို ကောင်းလား မကောင်းလား ရေတွက်နိုင်မှ အလုပ်ဖြစ်ပါတယ်။ ဥပမာ AI က အဖြေ မှားပြောနေတောင် request က အောင်မြင်တယ်လို့ပဲ ပြန်လာတတ်လို့ ရေတွက်ဖို့ ခက်ပါတယ်၊ ဒါကို lesson ၂၇ မှာ ကြည့်ပါမယ်။
      SLO လွဲတဲ့အခါ တုံ့ပြန်ပုံကလည်း page ပို့မလား၊ ဘာမှ မလုပ်ဘူးလား ဆိုတဲ့ နှစ်မျိုးတည်း ဖြစ်နေတတ်လို့ ticket ဖွင့်တာ၊ rollout ကို ဖြည်းဖြည်း လုပ်တာလို ကြားထဲက တုံ့ပြန်မှုတွေကို ရည်ရွယ်ပြီး ကြိုစီစဉ်ထားရပါမယ်။
      [[mark:show-p06b]] ဒါကြောင့် SLO ဆိုတာ ပန်းတိုင် မဟုတ်ဘဲ user လိုချင်တာနဲ့ ကုမ္ပဏီ တတ်နိုင်တာကို ညှိပေးတဲ့ နည်းလမ်း တစ်ခုပါ။ SLO ကို တင်းတင်း ထားတာက service အရေးကြီးကြောင်း ပြတဲ့ တံဆိပ် မဟုတ်ပါဘူး။ Eats မှာလည်း မနှင်းနဲ့ engineer တွေ ဘယ်လောက်ဆို လုံလောက်ပြီလို့ အတူ သဘောတူခဲ့တာကမှ တကယ့် တန်ဖိုးပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Workbook: Implementing SLOs",
          url: "https://sre.google/workbook/implementing-slos/",
        }
      - {
          title: "Workbook: Example Error Budget Policy",
          url: "https://sre.google/workbook/error-budget-policy/",
        }
    actions:
      - { id: show-p06, type: slide.show, at: { mark: show-p06 }, slideId: l07-p06 }
      - { id: show-p06b, type: slide.show, at: { mark: show-p06b }, slideId: l07-p06b }

  - id: this-week
    narration: >
      [[mark:show-p07]] ကိုယ့် SLO တွေ လှည့်စားနေလား ဒီအပတ် စစ်ကြည့်ရအောင်။ ကိုယ့် product ရဲ့ အရေးအကြီးဆုံး journey ကို user ပြောမယ့် စကားနဲ့ ချရေးကြည့်ပါ။ SLI တစ်ခုကို အကြီးဆုံး customer တွေအလိုက် ခွဲကြည့်ပါ။ ပြီးတော့ ကတိထက် အများကြီး ပိုပေးနေတဲ့ နေရာ တစ်ခုကို ရှာပြီး ဘယ်သူတွေ အားကိုးနေလဲ မေးကြည့်ပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Product-Focused Reliability for SRE (sre.google)",
          url: "https://sre.google/resources/practices-and-processes/product-focused-reliability-for-sre/",
        }
      - {
          title: "Workbook: Implementing SLOs",
          url: "https://sre.google/workbook/implementing-slos/",
        }
    actions:
      - { id: show-p07, type: slide.show, at: { mark: show-p07 }, slideId: l07-p07 }

  - id: recap
    narration: >
      [[mark:close-p07]] [[mark:open-notes]] အစိမ်းရောင် SLO ကို မယုံခင် မှတ်ထားစရာတွေပါ။ [[mark:sel-cuj]] critical user journey က user ရည်ရွယ်ချက် တစ်ခု ပြီးဖို့ ဖြတ်သွားရတဲ့ အဆင့်တွေကို user ပြောသလို နာမည်ပေးထားတာပါ၊ [[mark:sel-synthetic]] synthetic test order က အဲဒီ လမ်းတစ်လျှောက်လုံးကို user လို အမြဲ လျှောက်စစ်ပေးပါတယ်။
      [[mark:sel-bad-minute]] bad minute က journey ရဲ့ အဆင့် တစ်ခုခု မကောင်းခဲ့တဲ့ မိနစ်ပါ။ [[mark:sel-client]] client-side SLO က server မမြင်ရတာကို ဖုန်းဘက်ကနေ တိုင်းတာပါ။ [[mark:sel-per-customer]] per-customer SLO က ပျမ်းမျှထဲမှာ ပျောက်နေတဲ့ customer ကြီးကို ခွဲတိုင်းတာ ဖြစ်ပြီး၊ [[mark:sel-implicit]] implicit SLO ကတော့ ကတိ မပေးထားပေမဲ့ သုံးတဲ့သူတွေ အားကိုးလာတဲ့ reliability ပါ။
      [[mark:sel-question]] ဒါဆို ခေါင်းထဲမှာ တွက်ကြည့်ပါ။ [[mark:ask-question]] journey SLO က ရက် ၃၀ မှာ ကောင်းတဲ့ မိနစ် ၉၉.၅ ရာခိုင်နှုန်း ဆိုရင် တစ်လကို bad minute ဘယ်နှခု သုံးခွင့် ရှိလဲ?
      [[mark:pause-question]] မိနစ် ၄၃၂၀၀ ရဲ့ ၀.၅ ရာခိုင်နှုန်းမို့ bad minute ၂၁၆ ခုပါ။ အဲဒီနောက် Top-up မှာတော့ app က ဖုန်းဘေလ် ဝင်ကြောင်း ဘယ်တော့မှ မပြလို့ user တွေက ဝင်ပြီးသား top-up တွေအတွက်တောင် refund တောင်းလာပေမဲ့ dashboard တိုင်းမှာ အားလုံး ကောင်းနေပါတယ်။ system ရဲ့ အထဲကို ဘယ်လို မြင်မလဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Product-Focused Reliability for SRE (sre.google)",
          url: "https://sre.google/resources/practices-and-processes/product-focused-reliability-for-sre/",
        }
      - {
          title: "Workbook: Implementing SLOs",
          url: "https://sre.google/workbook/implementing-slos/",
        }
    actions:
      - { id: close-p07, type: slide.close, at: { mark: close-p07 } }
      - {
          id: open-notes,
          type: workspace.openFile,
          at: { mark: open-notes, offsetMs: 300 },
          path: notes.md,
        }
      - {
          id: sel-cuj,
          type: editor.select,
          at: { mark: sel-cuj },
          target: { file: notes.md, text: "critical user journey", occurrence: 1 },
        }
      - {
          id: sel-synthetic,
          type: editor.select,
          at: { mark: sel-synthetic },
          target: { file: notes.md, text: "synthetic test order", occurrence: 1 },
        }
      - {
          id: sel-bad-minute,
          type: editor.select,
          at: { mark: sel-bad-minute },
          target: { file: notes.md, text: "bad minute", occurrence: 1 },
        }
      - {
          id: sel-client,
          type: editor.select,
          at: { mark: sel-client },
          target: { file: notes.md, text: "client-side SLO", occurrence: 1 },
        }
      - {
          id: sel-per-customer,
          type: editor.select,
          at: { mark: sel-per-customer },
          target: { file: notes.md, text: "per-customer SLO", occurrence: 1 },
        }
      - {
          id: sel-implicit,
          type: editor.select,
          at: { mark: sel-implicit },
          target: { file: notes.md, text: "implicit SLO", occurrence: 1 },
        }
      # The voice script's ⟪select မေးခွန်း⟫ and ⟪pause 3s⟫, the way the Module 1
      # reviewers fixed the pause. sel-question marks where the voice script puts
      # the select, but a select there would drag under the question and leave no
      # pause, and one at pause-question would drag under the answer's first words
      # (the scheduler holds only the dialog after its anchor's). So the
      # question-line select hangs off ask-question, one more mark at an existing
      # sentence end that makes the question its own dialog: it starts about as
      # the question ends, its drag runs in silence, and the answer at
      # pause-question waits for it. The question is a long dialog (~110
      # characters, no ၊ to split at), so the quiet depends on the voice's speed:
      # 7750 leaves about 2.8 / 1.1 / 0.35 s before the answer at 55 / 70 / 95
      # ms per char (at 95 the drag starts under the question's last words, as
      # in lesson 2); more trips compile-check's 2.5 s inserted-silence warning
      # at 55.
      - id: select-question
        type: editor.select
        at: { mark: ask-question, offsetMs: 7750 }
        target:
          file: notes.md
          text: "မေးခွန်း: ရက် 30၊ ကောင်းတဲ့ မိနစ် 99.5%။ bad minute ဘယ်နှခု သုံးခွင့် ရှိလဲ?"
          occurrence: 1

checks:
  # 500, not 300: google-svg deck pages stall the main thread at show/close.
  - { type: timing.p95Ms, max: 500 }
