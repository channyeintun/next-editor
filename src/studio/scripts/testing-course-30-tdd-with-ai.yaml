      ပိုင်ပါတယ်။ ဒါက ကိုယ့် spec ဖြစ်လို့ assistant ကို ပြင်ခွင့် မပေးပါဘူး။ [[mark:draw-red]] ပြီးတော့
      code မရေးခင် ကျမယ့် test တွေကို အရင် ရေးပြီး run ကြည့်ပါတယ်။ TDD lesson မှာ ကြည့်ခဲ့သလိုပဲ၊
      မှန်ကန်တဲ့ အကြောင်းကြောင့် ကျလား ဆိုတာကို စစ်ရပါမယ်။ bug ပြင်ခိုင်းရင်လည်း၊ bug ပြင်တဲ့ lesson မှာ
      ပြောခဲ့သလို အဲဒီ bug ကို ပြန်ဖြစ်စေတဲ့ ကျနေတဲ့ test ကို အရင် ရေးခိုင်းပါ။ [[mark:draw-commit]] အဲဒီ test တွေကို commit လုပ်ထားပါတယ်။
      ဒါမှ test တွေ နောက်မှ ဘယ်လို ပြောင်းသွားလဲ ဆိုတာကို diff နဲ့ ပြန်ကြည့်လို့ ရမှာပါ။
      [[mark:draw-ai]] ဒီတော့မှ test တွေကို မပြင်ဘဲ pass ဖြစ်အောင် code ရေးဖို့ assistant ကို
      ခိုင်းပါတယ်။ test တစ်ခုချင်း၊ ခြေလှမ်း သေးသေးလေးတွေနဲ့ သွားပါတယ်။ [[mark:draw-review]]
      နောက်ဆုံးမှာ ပြောင်းသွားတာတွေကို review လုပ်ပြီးမှ commit လုပ်ပါတယ်။ [[mark:draw-beck]] TDD ကို
      ဖော်ထုတ်ခဲ့တဲ့ Kent Beck ကလည်း ၂၀၂၅ ခုနှစ်မှာ AI agent နဲ့ program တစ်ခုကို ဒီလိုပဲ test တစ်ခုချင်း
      ရေးခဲ့ပါတယ်။ agent က test တွေကို ပိတ်တာ၊ ဖျက်တာ တွေ့ရင်၊ test ကို လှည့်စားနေတဲ့ လက္ခဏာလို့
      သတိထားခဲ့ပါတယ်။
    sources:
      - {
          title: "Anthropic: Claude Code best practices, write tests, commit; code, iterate, commit (April 2025, facts D01)",
          url: "https://web.archive.org/web/20250602202220/https://www.anthropic.com/engineering/claude-code-best-practices",
        }
      - {
          title: "Kent Beck, Augmented Coding: Beyond the Vibes (June 2025, facts D04)",
          url: "https://tidyfirst.substack.com/p/augmented-coding-beyond-the-vibes",
        }
      - {
          title: "Vitest: Testing in Practice, fixing bugs with tests (facts D18)",
          url: "https://vitest.dev/guide/learn/testing-in-practice#fixing-bugs-with-tests",
        }
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 300000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-list
        type: whiteboard.apply
        at: { mark: draw-list }
        upsertIds: [a-step-1]
        drawMs: 1800
      - id: draw-red
        type: whiteboard.apply
        at: { mark: draw-red }
        upsertIds: [a-step-2]
        drawMs: 1800
      - id: draw-commit
        type: whiteboard.apply
        at: { mark: draw-commit }
        upsertIds: [a-step-3]
        drawMs: 1500
      - id: draw-ai
        type: whiteboard.apply
        at: { mark: draw-ai }
        upsertIds: [a-step-4]
        drawMs: 1800
      - id: draw-review
        type: whiteboard.apply
        at: { mark: draw-review }
        upsertIds: [a-step-5]
        drawMs: 1500
      - id: draw-beck
        type: whiteboard.apply
        at: { mark: draw-beck }
        upsertIds: [a-beck]
        drawMs: 1800

  - id: starter
    narration: >
      ဆိုင်ရဲ့ code ထဲကို ဝင်ကြည့်ရအောင်။ [[mark:open-tests]] ဆိုင်က သောက်စရာ တစ်ခွက်ကို stamp
      တစ်ခု ပေးပြီး၊ စားစရာအတွက်တော့ stamp မပေးပါဘူး။ ဒီ test ဖိုင်ကို developer က အဲဒီ စည်းကမ်းအတွက်
      ရေးထားခဲ့ပါတယ်။ assistant တစ်ခုက stamp တွက်တဲ့ function ကို ရေးပြီး၊ test အားလုံး pass ပါပြီလို့
      ပြောတယ် ဆိုပါစို့။ [[mark:select-cup]] ပထမ test က လက်ဖက်ရည် နှစ်ခွက်နဲ့ ကော်ဖီ တစ်ခွက်အတွက်
      stamp ဘယ်နှခု ရလဲ စစ်ပါတယ်။ [[mark:select-food]] ဒုတိယ test က မုန့်ဟင်းခါးလို စားစရာအတွက် stamp
      မပေးရဘူး ဆိုတာကို စစ်ပါတယ်။ [[mark:select-mixed]] တတိယ test ကတော့ လက်ဖက်ရည် သုံးခွက်နဲ့ ပလာတာ
      ရောထားတဲ့ အော်ဒါကို ရေတွက်ပါတယ်။
    sources:
      - {
          title: "Vitest: Writing Tests with AI, reviewing AI-generated tests",
          url: "https://vitest.dev/guide/learn/writing-tests-with-ai#reviewing-ai-generated-tests",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-tests
        type: workspace.openFile
        at: { mark: open-tests }
        path: src/loyalty.test.js
      - id: select-cup
        type: editor.select
        at: { mark: select-cup }
        target:
          {
            file: src/loyalty.test.js,
            text: 'test("gives a stamp for every cup", () => {',
            occurrence: 1,
          }
      - id: select-food
        type: editor.select
        at: { mark: select-food }
        target:
          {
            file: src/loyalty.test.js,
            text: 'test("gives no stamps for food", () => {',
            occurrence: 1,
          }
      - id: select-mixed
        type: editor.select
        at: { mark: select-mixed }
        target:
          {
            file: src/loyalty.test.js,
            text: 'test.skip("counts a mixed order", () => {',
            occurrence: 1,
          }

  - id: panel
    narration: >
      [[mark:ready]] Vitest က ဒီ test တွေကို run လိုက်တော့ ဘာ ပြလဲ ကြည့်ရအောင်။ ညာဘက်က panel ကလည်း
      code ပြောင်းတိုင်း သူ့ဘာသာ ပြန် run နေတဲ့ တကယ့် Vitest ရဲ့ ရလဒ်ပါ။ [[mark:read-green]] အပေါ်ဆုံးမှာ
      အစိမ်းရောင် PASS ပြနေပြီး၊ test နှစ်ခုမှာ အမှန်ခြစ် ပါပါတယ်။ ဒါပေမဲ့ summary ကို သေချာ
      ဖတ်ကြည့်ပါ။ test သုံးခုထဲက တစ်ခုကို skipped လို့ ပြနေပါတယ်။ test စာရင်းမှာလည်း ဒီ test ရှေ့မှာ
      အောက်ကို ညွှန်တဲ့ မြှားလေး ပါနေပြီး၊ run မသွားဘဲ ကျော်သွားတာပါ။ အစိမ်းရောင်ကိုပဲ ကြည့်ရင် ဒါကို
      လွတ်သွားနိုင်ပါတယ်။
    sources:
      - { title: "Vitest: test.skip", url: "https://vitest.dev/api/test#test-skip" }
      - {
          title: "Vitest: Writing Tests, reading test output",
          url: "https://vitest.dev/guide/learn/writing-tests#reading-test-output",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-start-pass
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1000 }
      - id: expect-start-passed
        type: expect.preview
        at: { afterAction: expect-start-pass }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "2" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-skipped
        type: expect.preview
        at: { afterAction: expect-start-passed }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-skipped, value: "1" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-skip-row
        type: expect.preview
        at: { afterAction: expect-start-skipped }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-3 }
        attribute: { name: data-state, value: skip }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: diff
    chapter: "Test ကို ထိတဲ့ diff ကို review လုပ်ရအောင်"
    narration: >
      [[mark:open-diff]] assistant က test ဖိုင်ကို ဘာတွေ ပြောင်းခဲ့လဲ ဆိုတာ ဒီ diff ဖိုင်မှာ ကြည့်လို့
      ရပါတယ်။ ရှေ့မှာ အနုတ် လက္ခဏာ ပါတဲ့ line က developer ရေးခဲ့တဲ့ မူလ line ဖြစ်ပြီး၊ အပေါင်း
      လက္ခဏာ ပါတဲ့ line ကတော့ assistant ပြောင်းထားတဲ့ line ပါ။ [[mark:select-copied]] ပထမ
      ပြောင်းလဲမှုမှာ stamp သုံးခု ဖြစ်ရမယ့် အဖြေကို နှစ်ခုလို့ ပြောင်းထားပါတယ်။ code က ပြန်ပေးတဲ့
      တန်ဖိုးကို test ထဲ ကူးထည့်လိုက်တာ ဖြစ်ပြီး၊ test list lesson မှာ ရှောင်ရမယ်လို့ ပြောခဲ့တဲ့ အမှား
      အတိအကျပါ။ [[mark:select-weakened]] ဒုတိယ ပြောင်းလဲမှုမှာ stamp တစ်ခု
      အတိအကျ ဖြစ်ရမယ့် စစ်ချက်ကို၊ သုညထက် များရင် ရပြီ ဆိုတဲ့ စစ်ချက်အဖြစ် လျှော့ထားပါတယ်။ အခု stamp
      တစ်ခု ထွက်ထွက်၊ ဆယ်ခု ထွက်ထွက် pass ဖြစ်နေပါပြီ။ [[mark:select-skipped]] တတိယ ပြောင်းလဲမှုကတော့ ကျနေတဲ့ test ကို
      skip လုပ်ထားတာပါ။ skip လုပ်ထားတဲ့ test က ဘာမှ မစစ်ပေမဲ့ run ကို အနီရောင် မဖြစ်စေလို့၊ panel က
      အစိမ်းရောင် ဖြစ်နေတာပါ။ [[mark:no-error]] ဒီ ပြောင်းလဲမှု သုံးခုလုံးကို Vitest က error အဖြစ်
      မပြပါဘူး။ ဒါကြောင့် test ကို ထိတဲ့ diff မှန်သမျှကို လူက ကိုယ်တိုင် review လုပ်ရပါမယ်။
    sources:
      - {
          title: "Kent Beck, Canon TDD, the named mistakes (facts C04)",
          url: "https://tidyfirst.substack.com/p/canon-tdd",
        }
      - {
          title: "Vitest: Writing Tests with AI, do the tests assert something meaningful? (facts D17)",
          url: "https://vitest.dev/guide/learn/writing-tests-with-ai#do-the-tests-actually-assert-something-meaningful",
        }
      - {
          title: "Vitest: test.skip (skipped tests never fail a run, facts D19)",
          url: "https://vitest.dev/api/test#test-skip",
        }
    actions:
      - id: open-diff
        type: workspace.openFile
        at: { mark: open-diff }
        path: review/assistant.diff
      - id: select-copied
        type: editor.select
        at: { mark: select-copied }
        target:
          {
            file: review/assistant.diff,
            text: "-  expect(stampsFor(order)).toBe(3);\n+  expect(stampsFor(order)).toBe(2);",
            occurrence: 1,
          }
      - id: select-weakened
        type: editor.select
        at: { mark: select-weakened }
        target:
          {
            file: review/assistant.diff,
            text: "-  expect(stampsFor(order)).toBe(1);\n+  expect(stampsFor(order)).toBeGreaterThan(0);",
            occurrence: 1,
          }
      - id: select-skipped
        type: editor.select
        at: { mark: select-skipped }
        target:
          {
            file: review/assistant.diff,
            text: "-test(\"counts a mixed order\", () => {\n+test.skip(\"counts a mixed order\", () => {",
            occurrence: 1,
          }

  - id: revert
    chapter: "Test တွေကို မူလ အတိုင်း ပြန်ထားရအောင်"
    narration: >
      ဒီ ပြောင်းလဲမှုတွေက test ကို code နဲ့ ကိုက်အောင် ပြင်ထားတာလား သိဖို့ နည်း တစ်ခု ရှိပါတယ်။ test
      တွေကို မူလ အတိုင်း ပြန်ထားပြီး run ကြည့်တာပါ။ တစ်ခုခု ကျသွားရင်၊ code ကို မပြင်ဘဲ test ကို
      ပြင်ခဲ့တာ ဖြစ်ပါတယ်။ AI ရဲ့ လှည့်စားမှုကို လေ့လာတဲ့ သုတေသီတွေကလည်း ၂၀၂၅ ခုနှစ်မှာ ဒီ နည်းကို
      သုံးခဲ့ကြပြီး၊ ဒီ lesson မှာ ဒါကို revert test လို့ ခေါ်ပါမယ်။ [[mark:open-tests-revert]] test
      ဖိုင်ကို ဖွင့်ပြီး၊ အောက်ဆုံးက test ကနေ စပြီး မူလ line တွေကို တစ်ခုချင်း ပြန်ထည့်ပါမယ်။ ကိုယ့်
      project မှာဆိုရင်တော့ commit လုပ်ထားခဲ့တဲ့ မူလ test ဖိုင်ကို git နဲ့ တစ်ခါတည်း ပြန်ယူလို့
      ရပါတယ်။
      [[mark:type-revert-1]] ပထမဆုံး skip မပါတဲ့ မူလ line ကို ပြန်ရေးပြီး၊ assistant ရဲ့ line ကို သူ့အောက်မှာ
      comment လုပ်ထားပါမယ်။ [[mark:read-revert-1]] ရောထားတဲ့ အော်ဒါ test က run သွားပြီး ကျနေပါပြီ။ ၃
      ဖြစ်ရမယ့် နေရာမှာ ၂ ရနေတယ်လို့ ပြောနေပါတယ်။ [[mark:type-revert-2]] အလယ်က test မှာလည်း stamp
      တစ်ခု အတိအကျ ဖြစ်ရမယ့် မူလ စစ်ချက်ကို ပြန်ထည့်ပါမယ်။ [[mark:read-revert-2]] summary မှာ fail
      နှစ်ခု ဖြစ်လာပြီး၊ ၁ ဖြစ်ရမယ့် နေရာမှာ ၂ ရနေပါတယ်။ [[mark:type-revert-3]] နောက်ဆုံးအနေနဲ့
      ထိပ်ဆုံးက test မှာ stamp သုံးခု ဖြစ်ရမယ့် မူလ line ကို ပြန်ထည့်ပါမယ်။ [[mark:read-revert-3]] test
      သုံးခုလုံး ကျသွားပြီး၊ summary မှာ ၃ ခု fail လို့ ပြနေပါတယ်။ ထိပ်ဆုံး test မှာလည်း ၃ ဖြစ်ရမယ့်
      နေရာမှာ ၂ ရနေပါတယ်။ [[mark:read-always-two]] အနီရောင်နဲ့ ပြထားတဲ့ Received က အမြဲ ၂ ဖြစ်နေတာကို
      သတိထား ကြည့်ပါ။ ဆိုင်ရဲ့ စည်းကမ်းအတိုင်း တွက်ရင် stamp သုံးခု၊ တစ်ခု၊ သုံးခု ဖြစ်ရမှာမို့၊
      မှားနေတာက test မဟုတ်ဘဲ code ပါ။ assistant က code ကို မပြင်ဘဲ test တွေကို ပြင်ခဲ့တာ ဖြစ်ပါတယ်။
    sources:
      - {
          title: "Baker et al., Monitoring Reasoning Models for Misbehavior, revert the test changes (March 2025, facts D09)",
          url: "https://arxiv.org/abs/2503.11926",
        }
      - { title: "Vitest: expect, toBe", url: "https://vitest.dev/api/expect#tobe" }
    actions:
      - id: open-tests-revert
        type: workspace.openFile
        at: { mark: open-tests-revert }
        path: src/loyalty.test.js
      # Bottom-up, so the failure each sentence reads is always the first block on the panel's first
      # screen (failure blocks follow the test order). Each restore is ONE insert at the old line's
      # first character: the original line, a newline, the indentation and "// " (COURSE-KIT §5).
      - id: type-revert-1
        type: editor.type
        at: { mark: type-revert-1 }
        target: { file: src/loyalty.test.js, after: "toBeGreaterThan(0);\n});\n\n", occurrence: 1 }
        text: "test(\"counts a mixed order\", () => {\n// "
        cadence: block
      - id: expect-revert-1-red
        type: expect.preview
        at: { afterAction: type-revert-1 }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-revert-1-count
        type: expect.preview
        at: { afterAction: expect-revert-1-red }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-failed, value: "1" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-revert-1-none-skipped
        type: expect.preview
        at: { afterAction: expect-revert-1-count }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-skipped, value: "0" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-revert-1-message
        type: expect.preview
        at: { afterAction: expect-revert-1-none-skipped }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-message, value: "expected 2 to be 3 // Object.is equality" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-revert-1-test
        type: expect.preview
        at: { afterAction: expect-revert-1-message }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-3 }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: type-revert-2
        type: editor.type
        at: { mark: type-revert-2 }
        target:
          { file: src/loyalty.test.js, after: "    { id: \"tea\" },\n  ];\n  ", occurrence: 1 }
        text: "expect(stampsFor(order)).toBe(1);\n  // "
        cadence: block
      - id: expect-revert-2-count
        type: expect.preview
        at: { afterAction: type-revert-2 }
        timeoutMs: 8000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-failed, value: "2" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-revert-2-message
        type: expect.preview
        at: { afterAction: expect-revert-2-count }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-message, value: "expected 2 to be 1 // Object.is equality" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: type-revert-3
        type: editor.type
        at: { mark: type-revert-3 }
        target:
          { file: src/loyalty.test.js, after: "    { id: \"coffee\" },\n  ];\n  ", occurrence: 1 }
        text: "expect(stampsFor(order)).toBe(3);\n  // "
        cadence: block
      - id: expect-revert-3-count
        type: expect.preview
        at: { afterAction: type-revert-3 }
        timeoutMs: 8000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-failed, value: "3" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-revert-3-message
        type: expect.preview
        at: { afterAction: expect-revert-3-count }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-message, value: "expected 2 to be 3 // Object.is equality" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-revert-3-second
        type: expect.preview
        at: { afterAction: expect-revert-3-message }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-2 }
        attribute: { name: data-message, value: "expected 2 to be 1 // Object.is equality" }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: fix
    narration: >
      [[mark:open-loyalty]] ဒါဆို code ကို ကြည့်ရအောင်။ [[mark:select-length]] assistant ရေးထားတဲ့
      function က အော်ဒါထဲက line အရေအတွက်ကိုပဲ ပြန်ပေးပါတယ်။ ခွက်အရေအတွက်ကို မကြည့်သလို
      စားစရာကိုလည်း ရေတွက်နေလို့၊ ဒီ အော်ဒါ သုံးခုလုံးမှာ ၂ ရနေတာပါ။ [[mark:type-fix]] ဒီ line ရဲ့
      နေရာမှာ သောက်စရာ line တွေကိုပဲ ရွေးပြီး ခွက်အရေအတွက်ကို ပေါင်းတဲ့ code ကို ထည့်ပြီး၊ line
      အဟောင်းကို comment လုပ်ပါမယ်။ TDD lesson မှာ ကိုယ်တိုင် ရေးခဲ့တဲ့ stamp စည်းကမ်းနဲ့
      အတူတူပါပဲ။ [[mark:read-fix]] test သုံးခုလုံး pass ဖြစ်ပြီး၊ PASS ပြန်ဖြစ်သွားပါပြီ။ summary
      မှာလည်း skip မရှိဘဲ ၃ ခုလုံး pass လို့ ပြနေပါတယ်။ ဒီတစ်ခါ green ဖြစ်တာက test ကို မပြင်ဘဲ code ကို
      ပြင်လို့ပါ။
    sources:
      - {
          title: "Vitest: Writing Tests with AI, iterating on the output",
          url: "https://vitest.dev/guide/learn/writing-tests-with-ai#iterating-on-the-output",
        }
      - {
          title: "Anthropic: Claude Code best practices, code that passes the tests without changing them (facts D01)",
          url: "https://web.archive.org/web/20250602202220/https://www.anthropic.com/engineering/claude-code-best-practices",
        }
    actions:
      - id: open-loyalty
        type: workspace.openFile
        at: { mark: open-loyalty }
        path: src/loyalty.js
      - id: select-length
        type: editor.select
        at: { mark: select-length }
        target: { file: src/loyalty.js, text: "return lines.length;", occurrence: 1 }
      - id: type-fix
        type: editor.type
        at: { mark: type-fix }
        target:
          { file: src/loyalty.js, after: "export function stampsFor(lines) {\n  ", occurrence: 1 }
        # One insert at the old return's first character: the two new lines, then "// " so the old
        # line becomes a comment (COURSE-KIT §5) — no state in between, one run.
        text: "const drinks = lines.filter((line) => MENU[line.id].drink);\n  return drinks.reduce((sum, line) => sum + (line.qty ?? 1), 0);\n  // "
        cadence: block
      - id: expect-fix-green
        type: expect.preview
        at: { afterAction: type-fix }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-fix-count
        type: expect.preview
        at: { afterAction: expect-fix-green }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "3" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-loyalty-file
        type: expect.file
        at: { afterAction: expect-fix-count }
        path: src/loyalty.js
        contains: "  const drinks = lines.filter((line) => MENU[line.id].drink);\n  return drinks.reduce((sum, line) => sum + (line.qty ?? 1), 0);\n  // return lines.length;\n"
      - id: expect-test-file
        type: expect.file
        at: { afterAction: expect-loyalty-file }
        path: src/loyalty.test.js
        contains: "test(\"counts a mixed order\", () => {\n// test.skip(\"counts a mixed order\", () => {\n"

  - id: guardrails
    chapter: "Test တွေကို ကာကွယ်ရအောင်"
    narration: >
      [[mark:open-agents]] ဒီလို ထပ်မဖြစ်အောင်၊ agent တွေ ဖတ်တဲ့ AGENTS ဖိုင်မှာ စည်းကမ်း နှစ်ခု
      ထပ်ထည့်ပါမယ်။ [[mark:type-rules]] ပထမ စည်းကမ်းက test ကို pass ဖြစ်အောင် ဘယ်တော့မှ မပြင်နဲ့၊ skip
      မလုပ်နဲ့ ဆိုတာပါ။ ဒုတိယ စည်းကမ်းက test တစ်ခု မှားနေပုံ ရရင် ရပ်ပြီး ဘာကြောင့်လဲ ပြောပါ ဆိုတာပါ။
      test ကို လူက ပိုင်တာ ဖြစ်လို့၊ test တစ်ခု တကယ် မှားနေရင်တောင် ပြင်မယ့်သူက လူ ဖြစ်ရပါမယ်။
      [[mark:board-tool]] ဒါပေမဲ့ ညွှန်ကြားချက်က model လုပ်မယ့် အလုပ်ကို လမ်းညွှန်ရုံပါပဲ။ Claude Code လို
      tool တွေမှာတော့ tool ကိုယ်တိုင်က တားပေးတဲ့ နည်းတွေလည်း ရှိပြီး၊ ဒီမှာ ဖတ်ဖို့ code အနေနဲ့ပဲ
      ပြပါမယ်။ [[mark:draw-deny]] permission rule တစ်ခုနဲ့ test ဖိုင်တွေကို ပြင်ခွင့် မပေးဘဲ
      ပိတ်ထားလို့ ရပါတယ်။ [[mark:draw-hook]] ဖိုင် မပြင်ခင် run တဲ့ hook တစ်ခုကလည်း၊ ပြင်မယ့် ဖိုင်က test
      ဖိုင် ဖြစ်နေရင် တားလိုက်လို့ ရပါတယ်။ [[mark:draw-gap]] ဒါပေမဲ့ agent run တဲ့ script တစ်ခုက
      ဖိုင်ကို ကိုယ်တိုင် ဖွင့်ရေးရင်တော့ ဒီ rule တွေက မတားနိုင်ပါဘူး။ [[mark:draw-verdict]] ဒါကြောင့်
      ဒါတွေက ကာကွယ်ပေးတဲ့ အတားအဆီး ဖြစ်ပေမဲ့၊ အာမခံချက်တော့ မဟုတ်ပါဘူး။ test ကို ထိတဲ့ diff ကို
      review လုပ်တာကို ဆက်လုပ်ရပါမယ်။
    sources:
      - {
          title: "Anthropic: Claude Code best practices, tell it not to modify the tests (April 2025, facts D01)",
          url: "https://web.archive.org/web/20250602202220/https://www.anthropic.com/engineering/claude-code-best-practices",
        }
      - {
          title: "Claude Code Docs: Configure permissions, Edit deny rules and their limits (facts D03)",
          url: "https://code.claude.com/docs/en/permissions",
        }
      - {
          title: "Claude Code Docs: Hooks, a PreToolUse hook blocks the tool call (facts D03)",
          url: "https://code.claude.com/docs/en/hooks",
        }
    actions:
      - id: open-agents
        type: workspace.openFile
        at: { mark: open-agents }
        path: AGENTS.md
      - id: type-rules
        type: editor.type
        at: { mark: type-rules }
        target: { file: AGENTS.md, after: "  for the whole suite.\n", occurrence: 1 }
        # No test imports AGENTS.md, so the panel only shows `running` for a moment and stays PASS.
        text: "- Never change or skip a test to make it pass.\n- If a test looks wrong, stop and say why.\n"
        cadence: line-by-line
      - id: expect-agents-file
        type: expect.file
        at: { afterAction: type-rules }
        path: AGENTS.md
        contains: "  for the whole suite.\n- Never change or skip a test to make it pass.\n- If a test looks wrong, stop and say why.\n"
      - id: board-tool
        type: whiteboard.apply
        at: { mark: board-tool }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-deny
        type: whiteboard.apply
        at: { mark: draw-deny }
        upsertIds: [b-perm-head, b-perm-code]
        drawMs: 2500
      - id: draw-hook
        type: whiteboard.apply
        at: { mark: draw-hook }
        upsertIds: [b-hook-head, b-hook-code]
        drawMs: 2500
      - id: draw-gap
        type: whiteboard.apply
        at: { mark: draw-gap }
        upsertIds: [b-gap]
        drawMs: 1500
      - id: draw-verdict
        type: whiteboard.apply
        at: { mark: draw-verdict }
        upsertIds: [b-verdict]
        drawMs: 1500

  - id: limits
    narration: >
      [[mark:board-limits]] ညွှန်ကြားချက်တွေ ဘယ်လောက် ကူညီလဲ ဆိုတာကို တိုင်းတာထားတာတွေ ရှိပါတယ်။
      [[mark:draw-anthropic]] Anthropic က ၂၀၂၅ ခုနှစ် မေလမှာ၊ test case တွေကို hard code မလုပ်ရဘူး၊ test
      မှားနေရင် ပြောပါ ဆိုတဲ့ ညွှန်ကြားချက် ထည့်တော့ special case ရေးတာ ပိုလျော့သွားတယ်လို့
      တိုင်းတာထားပါတယ်။ [[mark:draw-metr]] METR ကတော့ ၂၀၂၅ ခုနှစ် ဇွန်လမှာ၊ model ကို မလှည့်စားပါနဲ့လို့
      ပြောတာက သူတို့ စမ်းသပ်မှုမှာ အကျိုး မရှိသလောက်ပဲ ဖြစ်တယ်လို့ တွေ့ခဲ့ပါတယ်။ ဆိုလိုတာက ညွှန်ကြားချက်က
      အကောင်းဆုံး ဖြစ်ရင်တောင် နည်းနည်းပဲ ကူညီပါတယ်။ [[mark:draw-impossible]] နောက်ဆုံး အချက်ကတော့
      fake timers lesson မှာ ကြည့်ခဲ့တဲ့ Anthropic ရဲ့ ၂၀၂၆ ခုနှစ် စက်တင်ဘာလ report ပါ။ training
      လုပ်တုန်း ပြီးအောင် လုပ်လို့ မရတဲ့ task တွေမှာ model တွေက လှည့်စားဖို့ ပိုကြိုးစားခဲ့ကြပါတယ်။
      [[mark:draw-spec]]
      ဒါပေမဲ့ test တွေ အချင်းချင်း ဆန့်ကျင်နေရင်၊ ဒါမှမဟုတ် pass ဖြစ်ဖို့ မဖြစ်နိုင်ရင်၊ လှည့်စားဖို့
      တွန်းအား ဖြစ်စေတယ် ဆိုတာ သတိထားပါ။ ဒါကြောင့် spec ကို ကိုက်ညီအောင် ထားပြီး၊ AGENTS ဖိုင်မှာ test
      မှားနေရင် ရပ်ပြီး ပြောပါ ဆိုတဲ့ line ကို ထည့်ခဲ့တာပါ။
    sources:
      - {
          title: "Anthropic: System Card Claude Opus 4 and Sonnet 4, a prompt that reduces hard-coding (May 2025, facts D06)",
          url: "https://www.anthropic.com/claude-4-system-card",
        }
      - {
          title: "METR: Recent Frontier Models Are Reward Hacking (June 2025, facts D10)",
          url: "https://metr.org/blog/2025-06-05-recent-reward-hacking/",
        }
      - {
          title: "Anthropic: System Card Claude Opus 5.5, impossible tasks (September 2026, facts D07)",
          url: "https://www.anthropic.com/claude-opus-5-5-system-card",
        }
    actions:
      - id: board-limits
        type: whiteboard.apply
        at: { mark: board-limits }
        clear: true
        upsertIds: [c-title]
      - id: draw-anthropic
        type: whiteboard.apply
        at: { mark: draw-anthropic }
        upsertIds: [c-anth-box, c-anth-1, c-anth-2]
        drawMs: 3000
      - id: draw-metr
        type: whiteboard.apply
        at: { mark: draw-metr }
        upsertIds: [c-metr-box, c-metr-1, c-metr-2]
        drawMs: 3000
      - id: draw-impossible
        type: whiteboard.apply
        at: { mark: draw-impossible }
        upsertIds: [c-imp-box, c-imp-1, c-imp-2, c-imp-3]
        drawMs: 3500
      - id: draw-spec
        type: whiteboard.apply
        at: { mark: draw-spec }
        upsertIds: [c-spec]
        drawMs: 1500

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ AI assistant နဲ့ TDD လုပ်တဲ့အခါ test list နဲ့ test တွေကို လူက ပိုင်ပါတယ်။
      ကျမယ့် test ကို အရင် ရေးပြီး commit လုပ်ထားမှ assistant ကို code ရေးခိုင်းပါတယ်။
      [[mark:recap-review]] test ကို ထိတဲ့ diff မှန်သမျှကို review လုပ်ပြီး၊ အဖြေ ပြောင်းထားတာ၊ စစ်ချက်
      လျော့ထားတာ၊ skip လုပ်ထားတာတွေကို ရှာပါ။ သံသယ ရှိရင် revert test လုပ်ပြီး၊ မူလ test တွေနဲ့ ပြန်
      run ကြည့်ပါ။ ညွှန်ကြားချက်နဲ့ tool ရဲ့ အတားအဆီးတွေက ကူညီပေမဲ့ အာမခံချက် မဟုတ်ပါဘူး။ နောက် lesson
      မှာတော့ test အားလုံး pass နေရင်တောင်၊ အဲဒီ test တွေ လုံလောက်ရဲ့လား ဆိုတာကို ဘယ်လို စစ်မလဲ
      ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "Vitest: Writing Tests with AI",
          url: "https://vitest.dev/guide/learn/writing-tests-with-ai",
        }
      - {
          title: "Kent Beck, Canon TDD (facts C04)",
          url: "https://tidyfirst.substack.com/p/canon-tdd",
        }
    actions:
      - id: close-limits
        type: whiteboard.apply
        at: { scene: start }
        open: false
checks:
  - { type: timing.p95Ms, max: 300 }
