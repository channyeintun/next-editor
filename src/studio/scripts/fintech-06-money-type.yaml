  - id: asset
    chapter: Crypto asset ကို ဘယ်လို ခွဲခြားမလဲ
    narration: >-
      [[mark:show-asset]] fiat currency အတွက်တော့ စာလုံး သုံးလုံးပါတဲ့ ISO currency code ကို identity အဖြစ် သုံးလို့ ရပါတယ်။ USD
      ဆိုတာ တစ်ခုပဲ ရှိပါတယ်။ [[mark:asset-2]] crypto မှာတော့ symbol ကို identifier အဖြစ် သုံးလို့ မရပါဘူး။
      network မတူ၊ contract မတူတဲ့ token နှစ်ခုက USDC ဆိုတဲ့ symbol တူနေနိုင်ပြီး asset နှစ်ခု ဖြစ်ပါတယ်။
      [[mark:pt-ne]] တစ်ခုကို လက်ခံပြီး နောက်တစ်ခုအဖြစ် user ကို credit ပေးမိရင် မရှိတဲ့ ငွေကို
      ဖန်တီးလိုက်တာပါ။ [[mark:asset-3]] ဒါကြောင့် crypto asset ကို network နဲ့ contract address တွဲပြီး
      ခွဲခြားပါတယ်။ [[mark:pt-meta]] symbol နဲ့ name လို metadata တွေကို display အတွက် လိုတာ များပြီး၊ business logic
      မှာ သုံးဖို့ ခဲပါတယ်။ [[mark:pt-dec]] decimals ကိုတော့ minor unit lesson မှာ ပြောခဲ့သလို ကိုယ့်ဘာသာ မမှန်းဘဲ token contract ကနေ ဖတ်ပြီး၊
      asset တစ်ခုချင်းနဲ့ တွဲ သိမ်းထားရပါတယ်။
    sources:
