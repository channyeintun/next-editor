build:
  voiceProfile:
    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 9506

runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "plain int64: 2000\n"
      run-2:
        status: success
        exitCode: 0
        output: "plain int64: 2000\nMoney: (none) error: cannot add JPY to USD\n"
      run-3:
        status: success
        exitCode: 0
        output: "plain int64: 2000\nMoney: (none) error: cannot add JPY to USD\nboundary: unsupported currency \"XYZ\"\nsame asset: false\n"

scenes:
  - id: hook
    chapter: ကိန်းဂဏန်း တစ်ခုတည်းက ငွေ မဟုတ်ဘူး
    narration: >-
      amount column ထဲက ၁၀၀၀ က ဒေါ်လာ ဆယ် ဖြစ်နိုင်သလို ယန်း တစ်ထောင်လည်း ဖြစ်နိုင်ပါတယ်။ ပြဿနာက အဲဒီ ကိန်းပြည့်တွေနဲ့
      တွက်တဲ့အခါ ပေါ်လာပါတယ်။ [[mark:sel-usd]] ဒီ
      program မှာ ဒေါ်လာ ဆယ်ကို ဆင့်နဲ့ ရေတွက်ထားလို့ ၁၀၀၀ ဖြစ်ပါတယ်။ [[mark:sel-jpy]] ယန်းမှာ minor
      unit မရှိလို့ ယန်း တစ်ထောင်ကလည်း ၁၀၀၀ ပါပဲ။ အောက်က line က ကိန်းပြည့် နှစ်ခုကို ပေါင်းပြီး
      ထုတ်ပြပါတယ်။ [[mark:run-1]] run လိုက်ရအောင်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Currency handling (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#currency-handling",
        }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }
      - id: sel-usd
        type: editor.select
        at: { mark: sel-usd }
        target: { file: main.go, text: "usd := int64(1000)", occurrence: 1 }
      - id: sel-jpy
        type: editor.select
        at: { mark: sel-jpy }
        target: { file: main.go, text: "jpy := int64(1000)", occurrence: 1 }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "plain int64: 2000",
          timeoutMs: 8000,
        }

  - id: mix
    narration: >-
      [[mark:pt-plain]] ၂၀၀၀ လို့ ထွက်ပါတယ်။ error လည်း မရှိ၊ warning လည်း မရှိပါဘူး။ [[mark:dock-1]]
      ဒါပေမဲ့ ဒီ ၂၀၀၀ က ဒေါ်လာလည်း မဟုတ်၊ ယန်းလည်း မဟုတ်ပါဘူး။ [[mark:show-mix]] ၆၄ bit ကိန်းပြည့် တစ်ခုက
      ဂဏန်းကိုပဲ သိပြီး unit ကို မသိပါဘူး။ [[mark:pt-sum]] ဒါကြောင့် ငွေ နှစ်မျိုးကို ပေါင်းမိတာကို
      compiler က လက်ခံပြီး၊ ထွက်လာတဲ့ ပမာဏက ဘယ် currency နဲ့မှ မကိုက်ပါဘူး။ ledger ထဲ ရောက်သွားရင်
      မရှိတဲ့ ငွေကို ဖန်တီးလိုက်တာနဲ့ အတူတူပါပဲ။ ဒါက No invented data ကို ချိုးဖောက်တာပါ၊ ငွေကို
      မရှိဘဲ မဖန်တီးရဘူး ဆိုတဲ့ မူပါ။ [[mark:mix-2]] ဖြေရှင်းနည်းက amount နဲ့ currency ကို ဘယ်တော့မှ
      မခွဲဘဲ type တစ်ခုထဲမှာ တွဲထားတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Currency handling (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#currency-handling",
        }
      - {
          title: "Fintech Engineering Handbook — Principles (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#principles",
        }
    actions:
      - id: pt-plain
        type: console.point
        at: { mark: pt-plain }
        target: { text: "plain int64:", occurrence: 1 }
      - { id: dock-1, type: runtime.collapseDock, at: { mark: dock-1 } }
      - { id: show-mix, type: slide.show, at: { mark: show-mix, offsetMs: -700 }, slideId: mix-1 }
      - {
          id: pt-usd-card,
          type: slide.point,
          at: { afterAction: show-mix },
          target: { x: 0.5, y: 0.531 },
        }
      - { id: pt-sum, type: slide.point, at: { mark: pt-sum }, target: { x: 0.819, y: 0.531 } }
      - { id: mix-2, type: slide.show, at: { mark: mix-2 }, slideId: mix-2 }
      - {
          id: pt-fix,
          type: slide.point,
          at: { afterAction: mix-2 },
          target: { x: 0.249, y: 0.836 },
        }

  - id: type
    chapter: Money type နဲ့ သူ့ စည်းမျဉ်းတွေ
    narration: >-
      [[mark:show-type]] Money type ဆိုတာ amount ကို minor unit ကိန်းပြည့်နဲ့၊ currency ကို code နဲ့
      တွဲထားတဲ့ value တစ်ခုပါ။ [[mark:type-2]] ပထမ စည်းမျဉ်းက currency မတူတဲ့ ပမာဏ နှစ်ခုကို ပေါင်းလို့
      မရတာပါ။ ပေါင်းခိုင်းရင် ပမာဏ မပြန်ဘဲ error ပြန်ပေးပါတယ်။ [[mark:type-3]] ဒုတိယက အပြင်ကနေ
      ဝင်လာတဲ့ currency code ကို system ရဲ့ boundary မှာ စစ်တာပါ။ controlled set ဆိုတာ system လက်ခံတဲ့
      currency စာရင်းကို config ဒါမှမဟုတ် service တစ်ခုမှာ တင်းတင်းကျပ်ကျပ် ထိန်းထားတာပါ။ စာရင်းထဲ
      မရှိတဲ့ code ကို အထဲ မဝင်ခိုင်းပါဘူး။ [[mark:pt-edge]] အပြင်က ဝင်လာတဲ့ code ကို မစစ်ဘဲ မယုံတာက No trust ပါ၊ ဘယ်သူ့ကိုမှ၊ ကိုယ့်
      component ကိုတောင် အလိုလို မယုံရဘူး ဆိုတဲ့ မူပါ။ စစ်ပြီးသွားရင်တော့ စစ်ပြီးကြောင်းကို Money type က သယ်သွားလို့၊ အထဲက code တိုင်းမှာ ထပ်စစ်စရာ မလိုတော့ပါဘူး။ [[mark:type-4]] တတိယက currency ပြောင်းတာကို
      ပေါင်းတာထဲ ဝှက်မထားဘဲ၊ rate တစ်ခုကို တမင် ထည့်ပေးရတဲ့ function သီးသန့် ဖြစ်အောင် ထားတာပါ။ ဘယ်
      rate ကို သုံးမလဲ ဆိုတာ နောက် lesson မှာ ကြည့်ပါမယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Currency handling (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#currency-handling",
        }
    actions:
      - {
          id: show-type,
          type: slide.show,
          at: { mark: show-type, offsetMs: -700 },
          slideId: type-1,
        }
      - {
          id: pt-money,
          type: slide.point,
          at: { afterAction: show-type },
          target: { x: 0.519, y: 0.487 },
        }
      - { id: type-2, type: slide.show, at: { mark: type-2 }, slideId: type-2 }
      - {
          id: pt-add,
          type: slide.point,
          at: { afterAction: type-2 },
          target: { x: 0.803, y: 0.487 },
        }
      - { id: type-3, type: slide.show, at: { mark: type-3 }, slideId: type-3 }
      - {
          id: pt-newm,
          type: slide.point,
          at: { afterAction: type-3 },
          target: { x: 0.519, y: 0.709 },
        }
      - { id: pt-edge, type: slide.point, at: { mark: pt-edge }, target: { x: 0.61, y: 0.844 } }
      - { id: type-4, type: slide.show, at: { mark: type-4 }, slideId: type-4 }
      - {
          id: pt-conv,
          type: slide.point,
          at: { afterAction: type-4 },
          target: { x: 0.803, y: 0.709 },
        }

  - id: add
    chapter: Add က error ပြန်ပေးတယ်
    narration: >-
      [[mark:close-type]] ပထမ စည်းမျဉ်းကို code နဲ့ ရေးကြည့်ရအောင်။ [[mark:type-add]] Add က currency
      နှစ်ခု မတူရင် ပေါင်းမပေးဘဲ error ပြန်ပေးပါတယ်။ တူမှသာ amount နှစ်ခုကို ပေါင်းပြီး Money အသစ်
      တစ်ခု ပြန်ပေးပါတယ်။ [[mark:type-call]] ဒေါ်လာ ဆယ်နဲ့ ယန်း တစ်ထောင်ကို ဒီတစ်ခါ Money အနေနဲ့
      ပေါင်းခိုင်းပြီး၊ ရလဒ်နဲ့ error ကို ထုတ်ပြပါမယ်။ [[mark:run-2]] run လိုက်ရအောင်။ [[mark:pt-err]]
      ပေါင်းလဒ် မရတော့ဘဲ ယန်းကို ဒေါ်လာထဲ ပေါင်းလို့ မရဘူး ဆိုတဲ့ error ရပါတယ်။ အမှားက ledger ထဲ
      မရောက်ခင် ပေါင်းတဲ့ နေရာမှာတင် ပေါ်လာတာပါ။ [[mark:dock-2]] ကျန်တဲ့ operation တွေလည်း ဒီ
      အတိုင်းပါပဲ။ နုတ်တာက currency တူမှ ရပါတယ်။ fee တွက်ဖို့ ကိန်းဂဏန်း တစ်ခုနဲ့ မြှောက်တာ ရပေမဲ့ Money
      နှစ်ခု မြှောက်တာက အဓိပ္ပာယ် မရှိပါဘူး။ ခွဲတာကတော့ ပြီးခဲ့တဲ့ lesson က allocate နဲ့ပါ။ သတိထားရမှာက
      Go မှာ ဒီ struct ကို field တွေနဲ့ တိုက်ရိုက် ဆောက်လို့ ရနေသေးတာပါ။ တကယ့် codebase မှာ field
      တွေကို package အပြင်ကနေ ထိလို့ မရအောင် ထားပြီး constructor ကနေပဲ ဆောက်ခိုင်းပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Currency handling (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#currency-handling",
        }
      - {
          title: "The Go Programming Language Specification — Exported identifiers",
          url: "https://go.dev/ref/spec#Exported_identifiers",
        }
    actions:
      - { id: close-type, type: slide.close, at: { mark: close-type } }
      - id: type-add
        type: editor.type
        at: { mark: type-add }
        target:
          { file: main.go, after: "\tfmt.Println(\"plain int64:\", usd+jpy)\n}\n", occurrence: 1 }
        text: "\n// Add refuses to add two different currencies.\nfunc (m Money) Add(o Money) (Money, error) {\n\tif m.Currency != o.Currency {\n\t\treturn Money{}, fmt.Errorf(\"cannot add %s to %s\", o.Currency, m.Currency)\n\t}\n\treturn Money{m.Amount + o.Amount, m.Currency}, nil\n}\n"
        cadence: line-by-line
      - id: type-call
        type: editor.type
        at: { mark: type-call }
        target:
          { file: main.go, after: "\tfmt.Println(\"plain int64:\", usd+jpy)\n", occurrence: 1 }
        text: "\n\tsum, err := Money{1000, \"USD\"}.Add(Money{1000, \"JPY\"})\n\tfmt.Println(\"Money:\", sum, \"error:\", err)\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "cannot add JPY to USD",
          timeoutMs: 8000,
        }
      - id: pt-err
        type: console.point
        at: { mark: pt-err }
        target: { text: "Money:", occurrence: 1 }
      - { id: dock-2, type: runtime.collapseDock, at: { mark: dock-2 } }

  - id: boundary
    narration: >-
      [[mark:open-money]] ဒုတိယ စည်းမျဉ်းက money ဖိုင်ထဲမှာ ရှိပါတယ်။ [[mark:sel-set]] ဒီ map က system
      လက်ခံတဲ့ currency လေးခုနဲ့ သူတို့ရဲ့ ဒသမ နေရာ အရေအတွက်ပါ၊ ဒါက controlled set ပါ။
      [[mark:sel-new]] NewMoney က အပြင်ကနေ ဝင်လာတဲ့ ပမာဏ တိုင်း ဖြတ်ရမယ့် တံခါးပါ။ code က set ထဲ
      မရှိရင် Money ကို မဆောက်ပေးပါဘူး။ API request၊ file import၊ provider ဆီက webhook လို အပြင်က data
      ဝင်တဲ့ နေရာတိုင်းမှာ ဒီ function ကို ခေါ်ရပါမယ်။ code ရဲ့ format မှန်ရုံနဲ့ မလုံလောက်ပါဘူး၊ ကိုယ့်
      system က အဲဒီ currency ကို handle လုပ်နိုင်မှ လက်ခံရတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Currency handling (Voytek Pitula, CC BY 4.0)",
