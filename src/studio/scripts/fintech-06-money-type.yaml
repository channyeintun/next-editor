# Fintech Engineering, lesson 06: the Money type and currency identity (Burmese).
#
# Source: Fintech Engineering Handbook, "Currency handling" (CC BY 4.0, Voytek Pitula).
# Start state: main.go adds 10.00 USD (1000 cents) and 1000 JPY as plain int64; money.go pins the
# controlled currency set, Money, NewMoney, String and format; asset.go pins Asset, Same and two
# tokens that both call themselves USDC.
# Edits, all insert-only:
#   1. Money.Add, refusing two different currencies                  (typed after main)
#   2. Add on 10.00 USD and 1000 JPY                                  -> run-2 prints the error
#   3. NewMoney with an unknown code, and the two USDC compared        -> run-3 prints the rejection, false
# Figures: mix (a number is not money), type (the Money type and its rules, at the boundary),
# asset (fiat code vs network + contract), peg (USDC, March 2023), iv (the interview answer).
# Built by ~/Documents/fintech-course-work/tools/build-lesson.ts; fixtures by sim-go.ts --write.
schemaVersion: 1

lesson:
  slug: fintech-06-money-type
  title: "Fintech Engineering 06: Money type နဲ့ currency"
  locale: my-MM
  workspace:
    lessonType: go
    name: Fintech Engineering
    entryFilePath: main.go
    files:
      asset.go: |
        package main

        // Asset identifies a crypto asset by where it lives: its network and its contract address.
        // Symbol and Decimals are metadata, read from the token contract and used for display.
        type Asset struct {
        	Network  string
        	Contract string
        	Symbol   string
        	Decimals int
        }

        // Same compares identity only. Two tokens with the same symbol can be different assets.
        func (a Asset) Same(b Asset) bool {
        	return a.Network == b.Network && a.Contract == b.Contract
        }

        // Two tokens that both call themselves USDC (illustrative ids, not real contracts).
        var (
        	usdcOnA = Asset{Network: "net-a", Contract: "0x1111", Symbol: "USDC", Decimals: 6}
        	usdcOnB = Asset{Network: "net-b", Contract: "0x2222", Symbol: "USDC", Decimals: 6}
        )
      main.go: |
        package main

        import "fmt"

        func main() {
        	usd := int64(1000) // 10.00 USD, in cents
        	jpy := int64(1000) // 1000 JPY: the yen has no minor unit
        	fmt.Println("plain int64:", usd+jpy)
        }
      money.go: |
        package main

        import "fmt"

        // exponent is the controlled currency set: the currencies this system accepts and their
        // number of decimal places (ISO 4217). Anything else is rejected at the boundary.
        var exponent = map[string]int{"EUR": 2, "USD": 2, "JPY": 0, "BHD": 3}

        // Money is an amount counted in the currency's minor units, with its currency. Never a float.
        type Money struct {
        	Amount   int64
        	Currency string
        }

        // NewMoney is the way in from outside the system: the currency must be in the set.
        func NewMoney(amount int64, currency string) (Money, error) {
        	if _, ok := exponent[currency]; !ok {
        		return Money{}, fmt.Errorf("unsupported currency %q", currency)
        	}
        	return Money{amount, currency}, nil
        }

        // String prints 1234 EUR as "12.34 EUR".
        func (m Money) String() string {
        	if m.Currency == "" {
        		return "(none)"
        	}
        	return format(m.Amount, exponent[m.Currency]) + " " + m.Currency
        }

        // format prints minor units with exp decimal places: format(1234, 2) is "12.34".
        func format(minor int64, exp int) string {
        	sign := ""
        	if minor < 0 {
        		sign, minor = "-", -minor
        	}
        	digits := fmt.Sprintf("%0*d", exp+1, minor)
        	if exp == 0 {
        		return sign + digits
        	}
        	return sign + digits[:len(digits)-exp] + "." + digits[len(digits)-exp:]
        }
