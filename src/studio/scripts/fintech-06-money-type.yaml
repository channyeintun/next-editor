  - id: try-it
    chapter: ကိုယ်တိုင် စမ်းကြည့်ပါ
    narration: >-
      [[mark:close-iv]] ကိုယ်တိုင် စမ်းကြည့်ဖို့ တစ်ခု ရှိပါတယ်။ [[mark:sel-try]] ဒီ Money ရဲ့ currency ကို
      USD၊ amount ကို ၂၅၀ လို့ ပြောင်းပြီး run ကြည့်ပါ။ ဒီတစ်ခါ error မရှိဘဲ၊ format
      လုပ်ထားတဲ့ ဆယ့်နှစ် ဒသမ ငါး ဒေါ်လာ ဆိုတဲ့ ပေါင်းလဒ် ထွက်လာပါလိမ့်မယ်။ [[mark:recap]] ပြန်ချုပ်ရရင်၊
      ငွေဆိုတာ ကိန်းဂဏန်းနဲ့ currency ကို အမြဲ တွဲထားတဲ့ value ဖြစ်ပြီး၊ currency မတူတာကို ရောပေါင်းတာ၊
      မသိတဲ့ code ကို လက်ခံတာ၊ symbol တူတာကို asset တူတယ်လို့ ယူဆတာကို type က တားပေးရပါတယ်။ နောက်
      lesson မှာတော့ currency ပြောင်းတဲ့အခါ ဘယ် rate ကို သုံးမလဲ ဆိုတာ ကြည့်ပါမယ်။ ယူရိုကနေ ဒေါ်လာ rate
      က ဒေါ်လာကနေ ယူရို rate ရဲ့ ပြောင်းပြန် မဟုတ်ပါဘူး။
    sources:
      - {
          title: "Fintech Engineering Handbook — Currency handling (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#currency-handling",
