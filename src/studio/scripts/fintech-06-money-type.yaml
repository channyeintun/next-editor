  - id: asset-code
    narration: >-
      [[mark:close-asset]] ဒီ idea ကို code နဲ့ ကြည့်ရအောင်။ [[mark:open-asset]] asset ဖိုင်ထဲမှာ Asset type နဲ့ Same function ရှိပါတယ်။ [[mark:sel-same]] Same က network
      နဲ့ contract ကိုပဲ နှိုင်းယှဉ်ပြီး symbol ကို လုံးဝ မကြည့်ပါဘူး။ [[mark:sel-vars]] အောက်က token
      နှစ်ခုက symbol ရော decimals ရော တူပေမဲ့ network နဲ့ contract မတူပါဘူး။ ဒီ id တွေက ဥပမာ သက်သက်ပါ၊
      တကယ့် contract တွေ မဟုတ်ပါဘူး။ [[mark:open-main2]] main ဖိုင်ထဲမှာ နှစ်ခုလုံးကို စမ်းကြည့်ရအောင်။
      [[mark:type-checks]] ပထမ နှစ်ကြောင်းက set ထဲ မရှိတဲ့ code နဲ့ Money ဆောက်ကြည့်ပြီး၊ တတိယ ကြောင်းက
      USDC နှစ်ခုကို Same နဲ့ စစ်ပါတယ်။ symbol တူနေတော့ ဘာထွက်မလဲ၊ run မလုပ်ခင် ခန့်မှန်းကြည့်ပါ။
      [[mark:run-3]] run လိုက်ရအောင်။ [[mark:pt-boundary]] မသိတဲ့ code ကို boundary မှာပဲ ငြင်းလိုက်ပါတယ်။
      [[mark:pt-same]] USDC နှစ်ခုက false ပါ၊ symbol တူပေမဲ့ asset တစ်ခုတည်း မဟုတ်ပါဘူး။ [[mark:dock-3]]
      ledger ထဲမှာလည်း balance ကို symbol နဲ့ မဟုတ်ဘဲ asset id နဲ့ သိမ်းရတာ ဒါကြောင့်ပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Currency handling (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#currency-handling",
        }
    actions:
      - { id: close-asset, type: slide.close, at: { mark: close-asset } }
      - { id: open-asset, type: workspace.openFile, at: { mark: open-asset }, path: asset.go }
      - id: sel-same
        type: editor.select
        at: { mark: sel-same }
        target:
          {
            file: asset.go,
            text: "return a.Network == b.Network && a.Contract == b.Contract",
            occurrence: 1,
          }
      - id: sel-vars
        type: editor.select
        at: { mark: sel-vars }
        target:
          {
            file: asset.go,
            text: "usdcOnA = Asset{Network: \"net-a\", Contract: \"0x1111\", Symbol: \"USDC\", Decimals: 6}\n\tusdcOnB = Asset{Network: \"net-b\", Contract: \"0x2222\", Symbol: \"USDC\", Decimals: 6}",
            occurrence: 1,
          }
      - { id: open-main2, type: workspace.openFile, at: { mark: open-main2 }, path: main.go }
      - id: type-checks
        type: editor.type
        at: { mark: type-checks }
        target:
          {
            file: main.go,
            after: "\tfmt.Println(\"Money:\", sum, \"error:\", err)\n",
            occurrence: 1,
          }
        text: "\n\t_, err = NewMoney(500, \"XYZ\")\n\tfmt.Println(\"boundary:\", err)\n\tfmt.Println(\"same asset:\", usdcOnA.Same(usdcOnB))\n"
        cadence: line-by-line
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "same asset: false",
          timeoutMs: 8000,
        }
      - id: pt-boundary
        type: console.point
        at: { mark: pt-boundary }
        target: { text: "boundary:", occurrence: 1 }
      - id: pt-same
        type: console.point
        at: { mark: pt-same }
        target: { text: "same asset:", occurrence: 1 }
      - { id: dock-3, type: runtime.collapseDock, at: { mark: dock-3 } }
      - {
          id: expect-file-add,
          type: expect.file,
          at: { afterAction: run-3 },
          path: main.go,
          contains: "if m.Currency != o.Currency {",
        }

  - id: peg
    chapter: Pegged ဆိုတာ underlying မဟုတ်ဘူး
    narration: >-
      [[mark:show-peg]] symbol တူတာထက် ပိုအန္တရာယ်များတာက peg ပါ။ stablecoin ဆိုတာ ဒေါ်လာ လို reference
      asset တစ်ခုနဲ့ peg လုပ်ထားတဲ့ token ပါ၊ ဆိုလိုတာက တန်ဖိုး တူအောင် ချိတ်ထားတာပါ။ bridged နဲ့
      wrapped token တွေလည်း underlying asset တစ်ခုနဲ့ ချိတ်ထားပေမဲ့ အဲဒီ asset ကိုယ်တိုင် မဟုတ်ပါဘူး။
      [[mark:pt-res]] ၂၀၂၃ မတ်လ ဆယ်ရက် သောကြာနေ့မှာ SVB ဘဏ် ပြိုလဲခဲ့ပါတယ်။ အဲဒီညမှာ Circle က USDC
      reserves ထဲက ဒေါ်လာ သုံး ဒသမ သုံး ဘီလီယံ၊ ရှစ် ရာခိုင်နှုန်းလောက်ကို အဲဒီဘဏ်ကနေ ထုတ်လို့ မရဘူးလို့
      ပြောခဲ့ပါတယ်။ [[mark:peg-2]] ပိတ်ရက်မှာ USDC တစ်ခုက ဆင့် ရှစ်ဆယ့်ခြောက်ကနေ ရှစ်ဆယ့်ရှစ် လောက်အထိ
      ကျသွားပါတယ်။ အနိမ့်ဆုံး တန်ဖိုးက ဘယ် data source ကို ကြည့်လဲ ပေါ်မူတည်ပါတယ်။ [[mark:peg-3]]
      တနင်္ဂနွေနေ့ US backstop ကြေညာချက် ထွက်ပြီးနောက် ပြန်တက်လာပြီး၊ တနင်္လာနေ့ Circle က redemption
      ပြန်ဖွင့်တော့ ဒေါ်လာ တစ်ခုနား ပြန်ရောက်ပါတယ်။ [[mark:pt-span]] USDC တစ်ခုကို ဒေါ်လာ တစ်ခုလို့
      hard code လုပ်ထားတဲ့ system က အဲဒီ ရက်တွေမှာ ကျနေတဲ့ token ကို ဒေါ်လာ အပြည့်နဲ့ လက်ခံမိမှာပါ။
      ဒါကြောင့် peg ကို ပုံသေ တန်ဖိုး မဟုတ်ဘဲ ပြောင်းလဲနိုင်တဲ့ rate တစ်ခုအနေနဲ့ ထားပြီး၊ asset နှစ်ခုကြား ပြောင်းတာကိုလည်း conversion
      တစ်ခုအနေနဲ့ပဲ မှတ်ရပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Currency handling (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#currency-handling",
        }
      - {
          title: "Circle — $3.3 Billion of USDC Reserve Risk Removed, Dollar De-peg Closes (March 2023)",
          url: "https://www.circle.com/pressroom/3-3-billion-of-usdc-reserve-risk-removed-dollar-de-peg-closes",
        }
      - {
          title: "Federal Reserve FEDS Notes — In the Shadow of Bank Run (17 Dec 2025)",
          url: "https://www.federalreserve.gov/econres/notes/feds-notes/in-the-shadow-of-bank-run-lessons-from-the-silicon-valley-bank-failure-and-its-impact-on-stablecoins-20251217.html",
        }
    actions:
      - { id: show-peg, type: slide.show, at: { mark: show-peg, offsetMs: -700 }, slideId: peg-1 }
      - {
          id: pt-title,
          type: slide.point,
          at: { afterAction: show-peg },
          target: { x: 0.125, y: 0.184 },
        }
      - { id: pt-res, type: slide.point, at: { mark: pt-res }, target: { x: 0.663, y: 0.464 } }
      - { id: peg-2, type: slide.show, at: { mark: peg-2 }, slideId: peg-2 }
      - { id: pt-low, type: slide.point, at: { afterAction: peg-2 }, target: { x: 0.1, y: 0.464 } }
      - { id: peg-3, type: slide.show, at: { mark: peg-3 }, slideId: peg-3 }
      - {
          id: pt-mon,
          type: slide.point,
          at: { afterAction: peg-3 },
          target: { x: 0.828, y: 0.851 },
        }
      - { id: pt-span, type: slide.point, at: { mark: pt-span }, target: { x: 0.44, y: 0.858 } }

  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] Fintech interview တွေမှာ Money type တစ်ခု ဒီဇိုင်းဆွဲပြပါ လို့ မေးတတ်ပါတယ်။ struct
      တစ်ခုထဲ field နှစ်ခု ထည့်ပြရုံနဲ့ မလုံလောက်ပါဘူး၊ type က ဘာကို တားပေးလဲ ဆိုတာကို ပြောရပါမယ်။
      [[mark:iv-a]] ပထမ၊ amount ကို minor unit ကိန်းပြည့်နဲ့ currency နဲ့ တွဲထားပြီး ပြင်လို့ မရတဲ့ value
      အဖြစ် ထားပါ။ [[mark:iv-b]] ဒုတိယ၊ currency မတူရင် ပေါင်းတာ နုတ်တာ error ဖြစ်ပြီး၊ ပြောင်းတာကို rate
      နဲ့ တမင် ခေါ်မှ ရပါတယ်။ ခွဲတာကို allocate နဲ့ လုပ်ပါတယ်။ [[mark:iv-c]] တတိယ၊ constructor က
      currency ကို controlled set နဲ့ boundary မှာ စစ်ပြီး၊ crypto ဆိုရင် network နဲ့ contract ကို identity
      အဖြစ် သုံးပါတယ်။ [[mark:iv-d]] ပြီးရင် ကိုယ် ဘာလုပ်မလဲ ဆိုတာ ဆက်ပြောပါ။ field တွေကို အပြင်ကနေ ထိလို့ မရအောင်
      ထားပြီး constructor ကနေပဲ ဆောက်ခိုင်းမယ်၊ currency ရောပေါင်းတဲ့ case တွေကို test နဲ့ ပိတ်ထားမယ်
      ဆိုတာပါ။
    sources:
