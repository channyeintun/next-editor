      model ဆီ မပို့ဘဲ၊ အော်ဒါ ၂၄၁၇ အတွက် ၅၀၀၀ ကျပ် ပြန်အမ်းဖို့ တောင်းမှာ သေချာလား လို့ အရင် မေးပါတယ်။ ပမာဏကိုလည်း
      code က အော်ဒါ data ထဲက ပိုပေးမိတဲ့ ငွေကနေ တွက်ထားတာပါ။ [[mark:click-yes]] အောင်အောင် က အတည်ပြု ခလုတ်ကို
      နှိပ်ပါတယ်။ [[mark:read-handoff]] အခု ၅၀၀၀ ကျပ် ပြန်အမ်းဖို့ ကောင်တာက လှလှ ဆီ လွှဲပေးလိုက်ပြီလို့ ပြပါတယ်။ ငွေ
      ပြန်အမ်းတာကိုတော့ လူကပဲ လုပ်ပါတယ်။
