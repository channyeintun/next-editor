build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 5120
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "Open-ended AI ဆိုတာ"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ user မသိသာဘဲ အလုပ်လုပ်တဲ့ background AI နဲ့၊ ခလုတ် နှိပ်မှ စတဲ့
      constrained AI ကို ကြည့်ခဲ့ပါတယ်။ ဒီ နောက်ဆုံး lesson မှာတော့ user က ကြိုက်သလို စာရိုက်ပြီး ခိုင်းလို့ ရတဲ့
      open ended AI ကို ဆိုင်ရဲ့ chat နဲ့ စမ်းကြည့်ပြီး၊ course တစ်ခုလုံးကိုလည်း ပြန်ချုပ်ပါမယ်။
      [[mark:draw-mini]] blueprint မှာ ဒီနေ့ အလွှာက U X ပါ။ [[mark:draw-today]] user ဆီမှာ AI ဘယ်လောက်
      ပေါ်လွင်မလဲ၊ မှားရင် ဘယ်လို ကာကွယ်မလဲ ဆိုတာကို U X မှာ ဆုံးဖြတ်ရလို့ပါ။
    sources:
      - {
          title: "web.dev Learn AI: Design AI user experiences",
          url: "https://web.dev/learn/ai/ux-patterns",
        }
      - {
          title: "web.dev Learn AI: Introduction to AI on the web (the blueprint)",
          url: "https://web.dev/learn/ai/introduction",
        }
      - {
          title: "web.dev Learn AI: Welcome to Learn AI! (course credit: written by Dr. Janna Lipenkova with editorial guidance from Alexandra Klepper; text CC BY 4.0, code Apache 2.0; adapted into Burmese with the course's own tea-shop examples)",
          url: "https://web.dev/learn/ai/welcome",
        }
      - {
          title: "Creative Commons: Attribution 4.0 International (CC BY 4.0), the licence of the web.dev Learn AI text adapted here",
          url: "https://creativecommons.org/licenses/by/4.0/",
        }
    actions:
      - {
          id: open-board-a,
          type: whiteboard.apply,
          at: { scene: start, offsetMs: -450 },
          open: true,
          clear: true,
          upsertIds: [a-title],
        }
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - {
          id: draw-mini,
          type: whiteboard.apply,
          at: { mark: draw-mini },
          upsertIds:
            [
              a-opp,
              a-opp-t,
              a-arrow-1,
              a-data,
              a-data-t,
              a-intel,
              a-intel-t,
              a-ux,
              a-ux-t,
              a-arrow-2,
              a-gov,
              a-gov-t,
            ],
          drawMs: 2400,
        }
      - {
          id: draw-today,
          type: whiteboard.apply,
          at: { mark: draw-today },
          upsertIds: [a-today],
          drawMs: 1000,
        }

  - id: open
    narration: >
      [[mark:draw-o]] ပြီးခဲ့တဲ့ lesson က AI ဘယ်လောက် ပေါ်လွင်လဲ ဆိုတဲ့ အဆင့် သုံးဆင့်ကို ပြန်ကြည့်ရအောင်။
      [[mark:draw-ladder]] background ကနေ constrained၊ open ended ဘက် ရောက်လာလေ၊ user လုပ်လို့ ရတာ
      များလာပြီး risk လည်း များလာလေပါပဲ။ open ended AI မှာတော့ system က user ဘာလိုချင်လဲ ခန့်မှန်းရပြီး၊ မပါတဲ့ အချက်တွေကိုလည်း ဖြည့်ပြီးမှ ဘာလုပ်မလဲ ဆုံးဖြတ်ရပါတယ်။
      [[mark:draw-risks]] ဒါကြောင့် customer ရေးတဲ့ စာက မရှင်းတာ၊ မစုံတာ ဖြစ်နိုင်ပြီး၊ output ကလည်း ကြိုမှန်းလို့
      မရပါဘူး။ အဖြေ မှားတာ ပိုများနိုင်သလို၊ user က
      လွန်ကဲ ယုံကြည်တာ၊ system ကို အလွဲသုံးဖို့ ကြိုးစားတာတွေလည်း ရှိပါတယ်။ [[mark:draw-start]] AI ကို စသုံးတဲ့
      team ဆိုရင် background ဒါမှမဟုတ် constrained ကနေ စပြီး၊ user တွေ တောင်းလာမှ ချဲ့တာ ပိုကောင်းပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Design AI user experiences (open-ended AI)",
          url: "https://web.dev/learn/ai/ux-patterns",
        }
    actions:
      - {
          id: draw-o,
          type: whiteboard.apply,
          at: { mark: draw-o },
          clear: true,
          upsertIds: [o-title],
        }
      - {
          id: draw-ladder,
          type: whiteboard.apply,
          at: { mark: draw-ladder },
          upsertIds: [o-b1, o-b1-t, o-a1, o-b2, o-b2-t, o-a2, o-b3, o-b3-t, o-scale],
          drawMs: 2600,
        }
      - {
          id: draw-risks,
          type: whiteboard.apply,
          at: { mark: draw-risks },
          upsertIds: [o-r1, o-r2, o-r3],
          drawMs: 2200,
        }
      - {
          id: draw-start,
          type: whiteboard.apply,
          at: { mark: draw-start },
          upsertIds: [o-start],
          drawMs: 1300,
        }

  - id: flow
    narration: >
      [[mark:draw-s]] ဆိုင်ရဲ့ assistant ကို lesson ၁၂ မှာ router နဲ့ စဆောက်ခဲ့ပါတယ်။ နောက်ပိုင်း ခလုတ်တွေ များပြီး
      ရှုပ်လာလို့ chat ကို ထည့်ပါမယ်။ [[mark:draw-s1]] customer ရေးတဲ့ စာက router ကို ဖြတ်ပြီး
      server ပေါ်က model ဆီ ရောက်ပါတယ်။ [[mark:draw-s2]] server ဘက်မှာ model တစ်ခုတည်း မဟုတ်ဘဲ၊ အော်ဒါ data နဲ့
      ဆိုင်ရဲ့ rule တွေကို တွဲထားတဲ့ compound AI system ပါ။ ဒီလို chat အများစုက server side မှာ run ပါတယ်။
      [[mark:draw-s3]] ငွေ ပြန်အမ်းတာလို အရေးကြီးတဲ့ အလုပ် မလုပ်ခင် အတည်ပြုခိုင်းတဲ့ အဆင့်နဲ့၊ မသေချာရင် ကောင်တာက
      လှလှ ဆီ လွှဲပေးတဲ့ လမ်းလည်း လိုပါတယ်။ customer အများကြီး မေးတဲ့ မေးခွန်း မျိုးစုံကို ဖြေနိုင်တာက chat ရဲ့
      အကျိုးကျေးဇူး ဖြစ်ပေမယ့်၊ assistant က မှားပြောရင် ဆိုင်က တာဝန်ယူရနိုင်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Design AI user experiences (example: AI-powered customer support agent)",
          url: "https://web.dev/learn/ai/ux-patterns",
        }
      - {
          title: "web.dev Learn AI: Glossary and concepts (compound AI architecture)",
          url: "https://web.dev/learn/ai/glossary",
        }
    actions:
      - {
          id: draw-s,
          type: whiteboard.apply,
          at: { mark: draw-s },
          clear: true,
          upsertIds: [s-title],
        }
      - {
          id: draw-s1,
          type: whiteboard.apply,
          at: { mark: draw-s1 },
          upsertIds: [s-msg, s-msg-t, s-a1, s-router, s-router-t, s-a2, s-server, s-server-t],
          drawMs: 2600,
        }
      - {
          id: draw-s2,
          type: whiteboard.apply,
          at: { mark: draw-s2 },
          upsertIds: [s-db1, s-db2, s-compound],
          drawMs: 1800,
        }
      - {
          id: draw-s3,
          type: whiteboard.apply,
          at: { mark: draw-s3 },
          upsertIds: [s-a3, s-confirm, s-confirm-t, s-a4, s-person, s-person-t],
          drawMs: 2400,
        }

  - id: code
    chapter: "Order-help chat ကို ဆောက်ရအောင်"
    narration: >
      [[mark:close-s]] code ထဲမှာ ကြည့်ရအောင်။ [[mark:panel-ready]] ညာဘက် AI panel ရဲ့ အပေါ်မှာ စာရိုက်တဲ့ နေရာ
      အစား၊ ရွှေ member အောင်အောင် နှိပ်လို့ ရမယ့် မေးခွန်း အကြံပြုချက်တွေနဲ့ အော်ဒါ နံပါတ် ခလုတ်တွေ ရှိပါတယ်။
      အော်ဒါ data က lesson
      အတွက် ပြင်ဆင်ထားတဲ့ နမူနာ data ဖြစ်ပြီး၊ ဒီနေ့ မနက် အောင်အောင် မှာထားတာ နှစ်ခု ပါပါတယ်။ [[mark:sel-route]]
      program ထဲမှာ lesson ၁၂ ရဲ့ router နဲ့ rule တွေကို မပြောင်းဘဲ ယူထားပါတယ်။ router က ဒီ page ထဲမှာ train
      လုပ်ထားတဲ့ model သေးလေးပါ။ [[mark:sel-next]] nextStep function က customer စာ တစ်ခု ရောက်လာရင် ဘာလုပ်မလဲ
      ဆုံးဖြတ်ပြီး၊ အခုတော့ router ရဲ့ အဖြေကိုပဲ ပြန်ပေးပါတယ်။ [[mark:sel-prompt]] server ကို ပို့တဲ့ request
      တိုင်းမှာ ဆိုင်ရဲ့ အချက်တွေနဲ့ program ရှာထားတဲ့ အော်ဒါ အသေးစိတ်ကို system prompt ထဲ ထည့်ပေးပါတယ်။
      server ဘက် အဖြေတွေကတော့ open model သေးသေးလေး တစ်ခုကို ကြိုပြီး run ထားတုန်းက တကယ် ထွက်လာခဲ့တဲ့
      အဖြေတွေပါ။
    sources:
      - {
          title: "web.dev Learn AI: Design AI user experiences (open-ended AI)",
          url: "https://web.dev/learn/ai/ux-patterns",
        }
      - {
          title: "web.dev Learn AI: Choose your platform (hybrid AI)",
          url: "https://web.dev/learn/ai/platform",
        }
    actions:
      - { id: close-s, type: whiteboard.apply, at: { mark: close-s }, open: false }
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-done
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: ai-status }
        attribute: { name: data-state, value: "done" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-three-cards
        type: expect.preview
        at: { afterAction: expect-done }
        timeoutMs: 5000
        target: { by: testId, value: ai-cards }
        attribute: { name: data-count, value: "3" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-orders-today
        type: expect.preview
        at: { afterAction: expect-three-cards }
        timeoutMs: 5000
        target: { by: testId, value: ai-state }
        textContains: "ဒီနေ့ အော်ဒါ 2 ခု"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-guess-chip
        type: expect.preview
        at: { afterAction: expect-orders-today }
        timeoutMs: 5000
        target: { by: testId, value: order-1 }
        attribute: { name: aria-pressed, value: "true" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: sel-route
        type: editor.select
        at: { mark: sel-route }
        target:
          {
            file: src/main.js,
            text: "  if (question.includes(\"မတည့်\")) return \"person\";\n  if (!device.localModel) return \"server\";\n",
            occurrence: 1,
          }
      - id: sel-next
        type: editor.select
        at: { mark: sel-next }
        target:
          { file: src/main.js, text: "  return route(text, { localModel: true });", occurrence: 1 }
      - { id: open-chat, type: workspace.openFile, at: { mark: sel-prompt }, path: src/chat.js }
      - id: sel-prompt
        type: editor.select
        at: { afterAction: open-chat }
        target:
          {
            file: src/chat.js,
            text: "  \"Shop facts:\",\n  SHOP_FACTS,\n  `The customer is ${shop.customer}, a ရွှေ member. The order the shop's system looked up:`,\n  describe(o),",
            occurrence: 1,
          }

  - id: gates
    narration: >
      [[mark:type-confirm]] ပထမဆုံး ငွေ ပြန်အမ်းဖို့ တောင်းရင် model ဆီ မပို့ဘဲ၊ customer ကို အရင် အတည်ပြုခိုင်းတဲ့
      အဆင့် ထည့်ပါမယ်။ ငွေနဲ့ ဆိုင်တဲ့ အလုပ် မလုပ်ခင် ဘာလုပ်မလဲ ပြောပြပြီး ခွင့်တောင်းရလို့ပါ။ [[mark:type-unsure]]
      ဒုတိယက router ပေးတဲ့ ပုံမှန် မေးခွန်း ဖြစ်နိုင်ခြေက ၃၀ နဲ့ ၇၀ ရာခိုင်နှုန်းကြားမှာ ရှိနေရင်၊ ပုံမှန်လား ခက်လား သေချာ မသိတာမို့ လူဆီ
      လွှဲပါမယ်။ chat မှာ ကိုယ့်စကားနဲ့ကိုယ် ရေးကြလို့ router မသေချာတဲ့ စာတွေ
      ဝင်လာနိုင်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Design AI user experiences (best practices: ask before acting, surface uncertainty)",
          url: "https://web.dev/learn/ai/ux-patterns",
        }
    actions:
      - { id: open-main, type: workspace.openFile, at: { mark: type-confirm }, path: src/main.js }
      - id: type-confirm
        type: editor.type
        at: { afterAction: open-main }
        target: { file: src/main.js, after: "  // Ask before acting:\n", occurrence: 1 }
        text: "  if (text.includes(\"ပြန်အမ်း\")) return \"confirm\";\n"
        cadence: line-by-line
      - id: expect-done-confirm
        type: expect.preview
        at: { afterAction: type-confirm }
        timeoutMs: 8000
        target: { by: testId, value: ai-status }
        attribute: { name: data-state, value: "done" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-unsure
        type: editor.type
        at: { mark: type-unsure }
        target:
          {
            file: src/main.js,
            after: "  const routine = predict(router, question).routine;\n",
            occurrence: 1,
          }
        text: "  if (routine > 0.3 && routine < 0.7) return \"person\";\n"
        cadence: line-by-line
      - id: expect-done-unsure
        type: expect.preview
        at: { afterAction: type-unsure }
        timeoutMs: 8000
        target: { by: testId, value: ai-status }
        attribute: { name: data-state, value: "done" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-cards-after-edits
        type: expect.preview
        at: { afterAction: expect-done-unsure }
        timeoutMs: 5000
        target: { by: testId, value: ai-cards }
        attribute: { name: data-count, value: "3" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: chat
    narration: >
      [[mark:click-late]] အောင်အောင် က အော်ဒါ မရောက်သေးဘူး ဆိုတဲ့ အကြံပြုချက်ကို နှိပ်ပါတယ်။ [[mark:read-guess]]
      program က နောက်ဆုံး မှာထားတဲ့ အော်ဒါ ၂၄၁၈ ကို ရွေးပြီး၊ အဲဒီ အော်ဒါ အကြောင်း မေးတာလို့ ထင်ပါတယ် ဆိုပြီး
      ပြပါတယ်။ ဒီ စာကြောင်းနဲ့ အော်ဒါ အသေးစိတ်ကို model က မဟုတ်ဘဲ code က ရှာပြထားတာမို့ badge က AI မပါဘူးလို့
      ပြနေပါတယ်။ [[mark:read-guess-answer]] model ပေးခဲ့တဲ့ အဖြေက ကော်ဖီ တစ်ခွက်ကို ကောင်တာမှာ ယူထားပြီးပြီလို့
      ပြောပါတယ်။ အဲဒါ မှန်ပေမယ့် အောင်အောင် မေးတာက delivery နဲ့ မှာထားတဲ့ အော်ဒါပါ။ [[mark:click-order]]
      ဒါကြောင့် အစကနေ ပြန်မရေးဘဲ၊ အော်ဒါ ၂၄၁၇ ခလုတ်ကို နှိပ်ပြီး ပြင်လိုက်ပါတယ်။ [[mark:read-fixed]] အခု program
      က ခုနက မေးခွန်းကို အော်ဒါ ၂၄၁၇ နဲ့ ပြန်မေးပါတယ်။ model ပေးခဲ့တဲ့ အဖြေက မုန့်ဟင်းခါးနဲ့ လက်ဖက်ရည်ကို ဗဟန်းကို ပို့နေပြီလို့ ပြောပါတယ်။ [[mark:read-promise]]
      ဒါပေမဲ့ customer မမေးရသေးဘဲ ကောင်တာက ငွေ ပြန်အမ်းပေးမယ်လို့လည်း ပြောထားပါတယ်။ [[mark:sel-promise]] prompt
      က ငွေ ပြန်အမ်းမယ်လို့ ကိုယ်တိုင် ကတိ မပေးဖို့ ပြောထားပေမယ့်၊ model သေးလေးက အမြဲ မလိုက်နာပါဘူး။ ဒါကြောင့် ငွေနဲ့ ဆိုင်တာကို model ရဲ့ စကားအပေါ် မထားဘဲ၊ code ထဲက အတည်ပြု
      အဆင့်နဲ့ပဲ လုပ်ရပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Design AI user experiences (make system state and assumptions visible; combine with constrained AI features)",
          url: "https://web.dev/learn/ai/ux-patterns",
        }
    actions:
      - id: click-late
        type: preview.click
        at: { mark: click-late }
        target: { by: testId, value: say-1 }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-guess-label
        type: expect.preview
        at: { afterAction: click-late }
        timeoutMs: 5000
        target: { by: testId, value: ai-state }
        attribute: { name: data-label, value: "အော်ဒါ 2418 အကြောင်း မေးတာလို့ ထင်ပါတယ်" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-guess-collected
        type: expect.preview
        at: { afterAction: expect-guess-label }
        timeoutMs: 5000
        target: { by: testId, value: ai-state-3 }
        attribute: { name: data-value, value: "collected" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-guess-badge
        type: expect.preview
        at: { mark: read-guess }
        timeoutMs: 5000
        target: { by: testId, value: ai-state-badge }
        textContains: "rules · AI မပါ"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-guess-server
        type: expect.preview
        at: { afterAction: expect-guess-badge }
        timeoutMs: 5000
        target: { by: testId, value: ai-route-1 }
        attribute: { name: data-value, value: "server" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-guess-answer
        type: expect.preview
        at: { mark: read-guess-answer }
        timeoutMs: 5000
        target: { by: testId, value: ai-answer }
        textContains: "ကောင်တာမှာ ယူထားပြီး ဖြစ်ပါတယ်"
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-guess-recorded
        type: expect.preview
        at: { afterAction: expect-guess-answer }
        timeoutMs: 5000
        target: { by: testId, value: ai-answer-badge }
        textContains: "recorded · Gemma 4 E2B · greedy"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: click-order
        type: preview.click
        at: { mark: click-order }
        target: { by: testId, value: order-2 }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-fixed-label
