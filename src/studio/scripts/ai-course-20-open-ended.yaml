  - id: summary
    chapter: "UX pattern အနှစ်ချုပ်"
    narration: >
      [[mark:click-patterns]] U X pattern တွေကို တစ်ခါတည်း ယှဉ်ကြည့်ရအောင်။ [[mark:read-patterns]] ဒီ ဇယားက AI
      အမျိုးအစား တစ်ခုချင်းအတွက် pattern တစ်ခုစီ မဖြစ်မနေ လိုလား၊ ထည့်ရင် ကောင်းလား၊
      မလိုဘူးလား ဆိုတာကို ပြထားပါတယ်။ [[mark:open-patterns]] ဇယားထဲက data ကို patterns file ထဲမှာ ရေးထားပါတယ်။
      [[mark:read-required]] ဘယ် အမျိုးအစားမှာမဆို မဖြစ်မနေ လိုတာ နှစ်ခု ရှိပါတယ်။ စကားလုံးကို သတိထားပြီး သုံးတာနဲ့၊
      AI မရရင်လည်း အလုပ်ဖြစ်တဲ့ fallback ပါ။ [[mark:read-open]] ညာဘက်ဆုံး open ended column မှာတော့ မဖြစ်မနေ
      လိုတာ အများဆုံးပါ။ system ဘာယူဆလဲ ပြတာ၊ မေးခွန်း အကြံပြုတာ၊ အရေးကြီးတဲ့ အလုပ် မလုပ်ခင် ရပ်စစ်တာ လို ခုနက
      chat မှာ ထည့်ခဲ့တာတွေ ပါပါတယ်။ လူ ဝန်ထမ်းဆီ လွှဲပေးတာကိုတော့ open ended မှာတောင်
      ထည့်ရင် ကောင်းတယ်လို့ပဲ ပြထားပေမယ့်၊ ငွေနဲ့ ဆိုင်တဲ့ ဆိုင်ရဲ့ chat မှာတော့ ကိုယ်တို့ ထည့်ခဲ့ပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Design AI user experiences (key takeaways, the summary table)",
          url: "https://web.dev/learn/ai/ux-patterns",
        }
    actions:
      - id: click-patterns
        type: preview.click
        at: { mark: click-patterns }
        target: { by: testId, value: patterns }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-patterns-table
        type: expect.preview
        at: { afterAction: click-patterns }
        timeoutMs: 5000
        target: { by: testId, value: ai-route }
        attribute: { name: data-count, value: "15" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-patterns-label
        type: expect.preview
        at: { afterAction: expect-patterns-table }
        timeoutMs: 5000
        target: { by: testId, value: ai-route }
        attribute: { name: data-label, value: "UX patterns" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - {
          id: open-patterns,
          type: workspace.openFile,
          at: { mark: open-patterns },
          path: src/patterns.js,
        }
      - id: expect-wording
        type: expect.preview
        at: { mark: read-required }
        timeoutMs: 5000
        target: { by: testId, value: ai-route-11 }
        textContains: "careful wording●●●"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-fallback
        type: expect.preview
        at: { afterAction: expect-wording }
        timeoutMs: 5000
        target: { by: testId, value: ai-route-15 }
        textContains: "non-AI fallback●●●"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: sel-required
        type: editor.select
        at: { afterAction: expect-fallback }
        target:
          {
            file: src/patterns.js,
            text: '  { pattern: "careful wording", background: "●", constrained: "●", open: "●" },',
            occurrence: 1,
          }
      - id: expect-state-open
        type: expect.preview
        at: { mark: read-open }
        timeoutMs: 5000
        target: { by: testId, value: ai-route-3 }
        textContains: "state visible○◐●"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-handoff-row
        type: expect.preview
        at: { afterAction: expect-state-open }
        timeoutMs: 5000
        target: { by: testId, value: ai-route-14 }
        textContains: "human handoff○○◐"
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: quiz
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ open ended AI ကို ဘယ်အချိန်မှာ သုံးသင့်လဲ။ lesson ကို pause လုပ်ပြီး
      စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] အဖြေကတော့ user ရေးမယ့် input တွေက မျိုးစုံပြီး ကြိုမှန်းလို့ မရတဲ့အခါပါ။
      ဘာကြောင့်လဲဆိုတော့ အဲဒီလို input ကို ခလုတ် အနည်းငယ်နဲ့ မဖမ်းနိုင်လို့ပါ။ ဒါပေမဲ့ ကိုယ့် system ကို စစ်ပြီး
      ယုံကြည်ရမှ သုံးရပါမယ်။ ရွေးစရာ နည်းနည်းပဲ ရှိရင်တော့ constrained AI က ပိုသင့်တော်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Design AI user experiences (Check your understanding)",
          url: "https://web.dev/learn/ai/ux-patterns",
        }
    actions:
      - {
          id: draw-quiz,
