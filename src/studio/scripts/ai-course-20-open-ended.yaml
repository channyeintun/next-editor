      src/chat.js: |
        // The order-help chat around lesson 12's router (main.js): the customer's suggested messages, the
        // order the shop's system looks up, the server side (recorded answers, src/llm.js) with the whole
        // conversation, the confirm step, the handoff to the counter, and the cards.
        import { panel } from "ai-panel";
        import support from "../data/support.json";
        import shop from "../data/orders.json";
        import { trainNaiveBayes, predict, topLabel } from "./ml.js";
        import { generate, model } from "./llm.js";
        import { choices, button, row } from "./ui.js";
        import { PATTERNS } from "./patterns.js";

        // The FAQ side (lesson 12): a small model trained in this page picks the FAQ answer that fits.
        const faqModel = trainNaiveBayes(
          support.messages.filter((m) => m.route === "routine").map((m) => ({ text: m.text, label: m.intent })),
        );
        const matchFaq = (question) => topLabel(predict(faqModel, question));

        // The server side: the shop's facts and the looked-up order go into the system prompt.
        const SHOP_FACTS = Object.values(support.faq).map((fact) => `- ${fact}`).join("\n");
        const kyat = (n) => `${n.toLocaleString("en-US")} kyat`;
        const items = (o) => o.items.map((i) => `one ${i.name} (${kyat(i.price)})`).join(" and ");
        const paid = (o) => `paid ${o.payments.length === 1 ? "once" : `${o.payments.length} times`} (${o.payments.map(kyat).join(" + ")})`;
        const describe = (o) =>
          o.type === "delivery"
            ? `- order ${o.id}: delivery to ${o.township}, ${items(o)}, delivery fee ${kyat(o.deliveryFee)}, total ${kyat(o.total)}, ${paid(o)}, status: ${o.status} (${o.detail}).`
            : `- order ${o.id}: pickup at the counter, ${items(o)}, total ${kyat(o.total)}, ${paid(o)}, status: ${o.status} (${o.detail}).`;
        const systemFor = (o) => [
          "You are the order-help assistant of Shwe Tea House, a tea shop in Bahan, Yangon.",
          "Reply to the customer in polite spoken Burmese, in at most two short sentences.",
          "First say which order you mean, then answer from its details. Use only the shop facts and the order details below.",
          "Never promise a refund yourself: the counter staff make refunds.",
          "Shop facts:",
          SHOP_FACTS,
          `The customer is ${shop.customer}, a ရွှေ member. The order the shop's system looked up:`,
          describe(o),
        ].join("\n");

        export const SUGGESTIONS = ["အော်ဒါ မရောက်သေးဘူး", "ငွေ နှစ်ခါ ဖြတ်သွားတယ်", "ငွေ ပြန်အမ်းပေးပါ", "လိပ်စာ ပြောင်းချင်တယ်"];
        const RULES = "rules · AI မပါ";

        // The chat. nextStep(text) answers "here", "server", "person" or "confirm".
        export function startChat(nextStep, router) {
          const byId = new Map(shop.orders.map((o) => [String(o.id), o]));
          const newest = shop.orders.reduce((a, b) => (b.placed > a.placed ? b : a));
          let order = newest; // the system's guess: the newest order
          let picked = false; // true once the customer has chosen the order
          let turns = []; // the conversation so far: { role, content }
          let confirmRow = null;

          const showRoute = (step, text, sent) => {
            const ran = step === "here" || step === "server" || (step === "person" && !text.includes("မတည့်"));
            const routine = ran ? `${Math.round(predict(router, text).routine * 100)}%` : "—";
            // The badge says what decided the step: the router model, or a rule that ran before it.
            const badge = ran ? "ဒီ page ထဲမှာ train ထားတဲ့ model" : RULES;
            panel.metrics("Route", { route: step, routine, sent: sent ?? "—" }, { id: "route", badge });
          };
          const showOrder = () => {
            const payments = order.payments.length === 1 ? String(order.payments[0]) : `${order.payments[0]} × ${order.payments.length}`;
            panel.metrics(picked ? `အော်ဒါ ${order.id} အကြောင်းပါ` : `အော်ဒါ ${order.id} အကြောင်း မေးတာလို့ ထင်ပါတယ်`, { order: order.id, paid: payments, status: order.status }, { id: "state", badge: RULES });
          };
          const handoff = (why) => {
            panel.output("Handoff", `${why}ကောင်တာက လှလှ ဆီ လွှဲပေးလိုက်ပါပြီ။`, { id: "answer", badge: RULES });
          };
          const askServer = async () => {
            const messages = [{ role: "system", content: systemFor(order) }, ...turns];
            showRoute("server", turns.at(-1).content, messages.length);
            try {
              const answer = await generate(messages, { show: false });
              turns.push({ role: "assistant", content: answer });
              panel.output("Assistant", answer, { id: "answer", badge: `recorded · ${model.label} · greedy` });
            } catch (error) {
              if (error.name !== "CourseNotice") throw error;
              panel.notice(error.message, { id: "answer" });
            }
          };
          const clearConfirm = () => {
            confirmRow?.remove();
            confirmRow = null;
          };

          // One step for the latest customer message (its user turn is already in `turns`).
          const respond = (text, step) => {
            clearConfirm();
            showOrder();
            if (step === "server") return askServer();
            showRoute(step, text);
            if (step === "here") return panel.output("FAQ answer", support.faq[matchFaq(text)], { id: "answer", badge: RULES });
            if (step === "person") return handoff(text.includes("မတည့်") ? "ကျန်းမာရေး မေးခွန်းမို့ " : "ဘာ လုပ်ပေးရမလဲ သေချာ မသိလို့ ");
            // "confirm": ask before acting — summarize the refund and wait for the customer.
            const amount = order.payments.slice(1).reduce((s, p) => s + p, 0);
            if (amount === 0) return panel.output("Confirm", `အော်ဒါ ${order.id} မှာ ပိုပေးထားတဲ့ ငွေ မတွေ့ပါဘူး။`, { id: "answer", badge: RULES });
            panel.output("Confirm", `အော်ဒါ ${order.id} အတွက် ${amount.toLocaleString("en-US")} ကျပ် ပြန်အမ်းဖို့ တောင်းမှာ သေချာလား`, { id: "answer", badge: RULES });
            confirmRow = row("confirm");
            patternsRow.before(confirmRow);
            button("အတည်ပြု", "confirm-yes", () => {
              clearConfirm();
              handoff(`အော်ဒါ ${order.id} ရဲ့ ${amount.toLocaleString("en-US")} ကျပ် ပြန်အမ်းဖို့ `);
            }, confirmRow);
            button("ပယ်ဖျက်", "confirm-no", () => {
              clearConfirm();
              panel.output("Assistant", "ပယ်ဖျက်လိုက်ပါပြီ။", { id: "answer", badge: RULES });
            }, confirmRow);
          };
          const send = (text) => {
            turns.push({ role: "user", content: text });
            return respond(text, nextStep(text));
          };

          // The customer corrects the order the system guessed: the last message is answered again with the
          // right order, without starting the conversation over.
          const pickOrder = (id) => {
            order = byId.get(String(id));
            picked = true;
            const last = turns.findLastIndex((t) => t.role === "user");
            if (last < 0) return clearConfirm();
            turns = turns.slice(0, last + 1);
            return respond(turns[last].content, nextStep(turns[last].content));
          };

          choices("say", SUGGESTIONS, send, { label: shop.customer });
          const newestFirst = [...shop.orders].sort((a, b) => (a.placed < b.placed ? 1 : -1));
          choices("order", newestFirst.map((o) => String(o.id)), pickOrder, { label: "order", selected: String(order.id) });
          const patternsRow = row("");
          button("UX patterns", "patterns", showPatterns, patternsRow);

          panel.note("customer က အပေါ်က မေးခွန်း တစ်ခုကို နှိပ်ပါ", { id: "route" });
          panel.note(`${shop.customer} · ဒီနေ့ အော်ဒါ ${shop.orders.length} ခု`, { id: "state" });
          panel.output("Assistant", `မင်္ဂလာပါ ${shop.customer}၊ ဘာ ကူညီပေးရမလဲ`, { id: "answer", badge: RULES });
        }

        // The summary card, drawn in place of the chat cards.
        export function showPatterns() {
          document.getElementById("app").replaceChildren();
          row("● required · ◐ optional · ○ not needed");
          panel.table("UX patterns", PATTERNS, { id: "route", columns: ["pattern", "background", "constrained", "open"] });
          panel.note("background = review highlights · constrained = the helper's button · open = this chat", { id: "state" });
          panel.note("web.dev Learn AI: UX patterns, in our words", { id: "answer" });
        }
      src/llm.js: |
        // The lesson's stand-in for a model API.
        // A real model is slow and can answer differently from run to run, so this lesson uses answers
        // recorded ahead of time from a real model: data/responses.json (how: data/PROVENANCE.md).
        // generate() returns the recorded answer for exactly these messages, and shows it in the panel.
        import recorded from "../data/responses.json";
        import { panel } from "ai-panel";

        export const model = recorded.provenance;

        const find = (messages) => {
          const key = JSON.stringify(messages.map(({ role, content }) => ({ role, content })));
          return recorded.responses.find((r) => JSON.stringify(r.messages) === key);
        };

        export async function generate(messages, { show = true } = {}) {
          const hit = find(messages);
          if (!hit) {
            const error = new Error("No recorded answer for these exact messages yet.");
            error.name = "CourseNotice";
            throw error;
          }
          if (show) panel.output("Model answer", hit.output, { id: "answer", badge: `recorded · ${model.label} · greedy` });
          return hit.output;
        }

        // The token counts the model's own tokenizer gave when the answer was recorded (the prompt includes
        // the chat template's own tokens): { promptTokens, outputTokens }, or null when not recorded.
        export function tokensFor(messages) {
          const hit = find(messages);
          return hit ? { promptTokens: hit.promptTokens, outputTokens: hit.outputTokens } : null;
        }
      src/main.js: |
        import support from "../data/support.json";
        import { trainNaiveBayes, predict, shuffle } from "./ml.js";
        import { startChat } from "./chat.js";

        // Lesson 12's router: a small model trained in this page on last month's messages.
        const messages = shuffle(support.messages, 5112);
        const train = messages.slice(0, 24);
        const router = trainNaiveBayes(train.map((m) => ({ text: m.text, label: m.route })));

        // Lesson 12's routing: "here" (the FAQ, in this page), "server" or "person".
        function route(question, device) {
          // Rules decided in advance (no model needed):
          if (question.includes("မတည့်")) return "person";
          if (!device.localModel) return "server";

          const routine = predict(router, question).routine;
          return routine >= 0.5 ? "here" : "server";
        }

        // The chat: what the assistant does with one customer message.
        function nextStep(text) {
          // Ask before acting:

          return route(text, { localModel: true });
        }

        startChat(nextStep, router);
      src/ml.js: |
        // Tiny machine learning in plain JavaScript: everything here runs in the page, with no
        // downloads, and gives the same numbers every time.

        // Burmese has no spaces between words, so the models count syllables instead.
        // A syllable starts at a consonant, unless that consonant is stacked under the one
        // before it (္) or killed by an asat (်) and so ends the syllable before it.
        const STARTS = /[က-ဪဿ၌-၏]/;
        export function syllables(word) {
          const chars = [...word];
          const out = [];
          for (let i = 0; i < chars.length; i++) {
            const next = chars[i + 1] === "့" ? chars[i + 2] : chars[i + 1];
            const starts = STARTS.test(chars[i]) && chars[i - 1] !== "္" && next !== "်" && next !== "္";
            if (starts || !out.length) out.push(chars[i]);
            else out[out.length - 1] += chars[i];
          }
          return out;
        }

        export function tokenize(text) {
          const tokens = [];
          for (const [piece] of text.toLowerCase().matchAll(/[a-z0-9']+|[၀-၉]+|[က-ဿ၌-႟]+/g)) {
            if (/^[က-ဿ၌-႟]/.test(piece)) tokens.push(...syllables(piece));
            else tokens.push(piece);
          }
          return tokens;
        }

        // Naive Bayes: count how often each token appears with each label, then score a new
        // text by how well its tokens fit each label.
        export function trainNaiveBayes(examples) {
          const labels = {};
          const vocab = new Set();
          for (const { text, label } of examples) {
            const c = (labels[label] ??= { docs: 0, tokens: 0, counts: {} });
            c.docs += 1;
            for (const t of tokenize(text)) {
              c.counts[t] = (c.counts[t] ?? 0) + 1;
              c.tokens += 1;
              vocab.add(t);
            }
          }
          return { labels, vocab, total: examples.length };
        }

        export function predict(model, text) {
          const tokens = tokenize(text).filter((t) => model.vocab.has(t));
          const logs = {};
          for (const [label, c] of Object.entries(model.labels)) {
            let score = Math.log(c.docs / model.total);
            for (const t of tokens) score += Math.log(((c.counts[t] ?? 0) + 1) / (c.tokens + model.vocab.size));
            logs[label] = score;
          }
          const max = Math.max(...Object.values(logs));
          const sum = Object.values(logs).reduce((s, v) => s + Math.exp(v - max), 0);
          return Object.fromEntries(Object.entries(logs).map(([label, v]) => [label, Math.exp(v - max) / sum]));
        }

        export function topLabel(scores) {
          return Object.entries(scores).sort((a, b) => b[1] - a[1])[0][0];
        }

        // k nearest neighbours: find the training texts that share the most tokens with a new one.
        function vector(text) {
          const v = {};
          for (const t of tokenize(text)) v[t] = (v[t] ?? 0) + 1;
          return v;
        }
        function cosine(a, b) {
          let dot = 0;
          for (const t in a) if (t in b) dot += a[t] * b[t];
          const norm = (v) => Math.sqrt(Object.values(v).reduce((s, x) => s + x * x, 0));
          return dot === 0 ? 0 : dot / (norm(a) * norm(b));
        }
        export function nearest(examples, text, k = 3) {
          const q = vector(text);
          return examples
            .map((e, i) => ({ ...e, similarity: cosine(q, vector(e.text)), i }))
            .sort((a, b) => b.similarity - a.similarity || a.i - b.i)
            .slice(0, k)
            .map(({ i, ...rest }) => rest);
        }
        export function knnPredict(examples, text, k = 3) {
          const votes = {};
          for (const e of examples) votes[e.label] = 0;
          for (const n of nearest(examples, text, k)) votes[n.label] += 1 / k;
          return votes;
        }

        // A straight line through a series (least squares): the simplest forecast.
        export function fitLine(ys) {
          const n = ys.length;
          const mx = (n - 1) / 2;
          const my = ys.reduce((s, y) => s + y, 0) / n;
          let num = 0;
          let den = 0;
          ys.forEach((y, x) => {
            num += (x - mx) * (y - my);
            den += (x - mx) ** 2;
          });
          const slope = den === 0 ? 0 : num / den;
          const intercept = my - slope * mx;
          return { slope, intercept, at: (x) => intercept + slope * x };
        }

        export function meanAbsoluteError(actual, predicted) {
          return actual.reduce((s, a, i) => s + Math.abs(a - predicted[i]), 0) / actual.length;
        }

        // Accuracy, precision, recall and F1 for one label (the "positive" class).
        export function scoreReport(rows, positive) {
          let tp = 0, fp = 0, fn = 0, correct = 0;
          for (const { expected, predicted } of rows) {
            if (expected === predicted) correct += 1;
            if (predicted === positive && expected === positive) tp += 1;
            if (predicted === positive && expected !== positive) fp += 1;
            if (predicted !== positive && expected === positive) fn += 1;
          }
          const precision = tp + fp === 0 ? 0 : tp / (tp + fp);
          const recall = tp + fn === 0 ? 0 : tp / (tp + fn);
          const f1 = precision + recall === 0 ? 0 : (2 * precision * recall) / (precision + recall);
          return { accuracy: correct / rows.length, precision, recall, f1 };
        }

        // A shuffle that gives the same order every time for the same seed.
        export function shuffle(list, seed = 1) {
          let s = seed >>> 0;
          const random = () => {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
          const out = [...list];
          for (let i = out.length - 1; i > 0; i--) {
            const j = Math.floor(random() * (i + 1));
            [out[i], out[j]] = [out[j], out[i]];
          }
          return out;
        }

        // A seeded random number generator (0 ≤ x < 1): the same seed gives the same numbers every time.
        export function rng(seed = 1) {
          let s = seed >>> 0;
          return () => {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        // Logistic regression for tabular data: one weight per input column, learned by gradient descent
        // from zero, on columns scaled to mean 0 and spread 1. Same data and settings → same weights.
        //   const model = trainLogistic(rows, { columns: ["visits_30d", "days_since_last"], label: "stopped" });
        //   model.weights → { visits_30d: -1.2, days_since_last: 1.9 } (on the scaled columns)
        //   model.probability(row) → 0.72
        export function trainLogistic(rows, { columns, label, epochs = 400, rate = 0.5 } = {}) {
          const n = rows.length;
          const mean = {};
          const spread = {};
          for (const c of columns) {
            mean[c] = rows.reduce((s, r) => s + Number(r[c]), 0) / n;
            const v = rows.reduce((s, r) => s + (Number(r[c]) - mean[c]) ** 2, 0) / n;
            spread[c] = Math.sqrt(v) || 1;
          }
          const scaled = (r) => columns.map((c) => (Number(r[c]) - mean[c]) / spread[c]);
          const xs = rows.map(scaled);
          const ys = rows.map((r) => Number(r[label]));
          const w = columns.map(() => 0);
          let b = 0;
          const sigmoid = (z) => 1 / (1 + Math.exp(-z));
          for (let e = 0; e < epochs; e++) {
            const gw = columns.map(() => 0);
            let gb = 0;
            for (let i = 0; i < n; i++) {
              const p = sigmoid(xs[i].reduce((s, x, j) => s + x * w[j], b));
              const err = p - ys[i];
              for (let j = 0; j < w.length; j++) gw[j] += err * xs[i][j];
              gb += err;
            }
            for (let j = 0; j < w.length; j++) w[j] -= (rate * gw[j]) / n;
            b -= (rate * gb) / n;
          }
          const probability = (r) => sigmoid(scaled(r).reduce((s, x, j) => s + x * w[j], b));
          return { columns, label, weights: Object.fromEntries(columns.map((c, j) => [c, w[j]])), bias: b, probability };
        }

        // Rows → { expected, predicted } at a threshold, ready for scoreReport(rows, "yes").
        export function atThreshold(model, rows, threshold = 0.5) {
          return rows.map((r) => ({
            ...r,
            probability: model.probability(r),
            expected: Number(r[model.label]) === 1 ? "yes" : "no",
            predicted: model.probability(r) >= threshold ? "yes" : "no",
          }));
        }
      src/patterns.js: |
        // The UX patterns each kind of AI feature needs: ● required · ◐ optional · ○ not needed.
        // Our short English names for the rows of the summary table in web.dev Learn AI's UX patterns module.
        export const PATTERNS = [
          // transparency
          { pattern: "AI is signalled", background: "◐", constrained: "●", open: "●" },
          { pattern: "light explanation", background: "◐", constrained: "◐", open: "●" },
          { pattern: "state visible", background: "○", constrained: "◐", open: "●" },
          // guidance
          { pattern: "prompt suggestions", background: "○", constrained: "◐", open: "●" },
          { pattern: "structured input", background: "○", constrained: "◐", open: "◐" },
          // control
          { pattern: "explicit trigger", background: "○", constrained: "●", open: "●" },
          { pattern: "preview first", background: "○", constrained: "●", open: "●" },
          { pattern: "alternatives", background: "○", constrained: "◐", open: "◐" },
          { pattern: "regenerate", background: "○", constrained: "◐", open: "●" },
          { pattern: "undo", background: "○", constrained: "●", open: "●" },
          // trust
          { pattern: "careful wording", background: "●", constrained: "●", open: "●" },
          { pattern: "confidence", background: "◐", constrained: "◐", open: "●" },
          // risks and failures
          { pattern: "review gates", background: "○", constrained: "◐", open: "●" },
          { pattern: "human handoff", background: "○", constrained: "○", open: "◐" },
          { pattern: "non-AI fallback", background: "●", constrained: "●", open: "●" },
        ];
      src/ui.js: |
        // Page controls for the lesson program: a row of buttons or choices in #app, above the AI panel.
        // Plain DOM, so the studio records every click and replay shows it exactly. Each control gets a
        // data-testid for preview.click. #app starts empty on every run, so controls are drawn by the
        // program each time. A handler that throws prints to the panel's Console (never the page).
        //
        //   import { row, button, choices } from "./ui.js";
        //   choices("threshold", [0.5, 0.7, 0.9], (t) => show(t), { selected: 0.5 });
        //     → buttons with test ids threshold-1, threshold-2, threshold-3 (1-based, in order)
        //   button("ဖော်ပြချက်တွေ ကြည့်မယ်", "show-descriptions", () => …);
        const STYLE_ID = "ui-style";
        const STYLE = `
        #app .ui-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px 0;
          font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans Myanmar", "Myanmar Sangam MN", "Myanmar Text", sans-serif; color: #d9dce2; }
        #app .ui-label { color: #adb5bd; font-size: 13px; }
        #app .ui-btn { font: inherit; color: #f1f3f5; background: #2d323c; border: 1px solid #3a404b; border-radius: 6px; padding: 3px 12px; cursor: pointer; }
        #app .ui-btn[aria-pressed="true"] { background: #7048e8; border-color: #7048e8; color: #fff; font-weight: 600; }
        `;

        function ensureStyle() {
          if (document.getElementById(STYLE_ID)) return;
          const style = document.createElement("style");
          style.id = STYLE_ID;
          style.textContent = STYLE;
          document.head.append(style);
        }

        const safe = (fn) => (...args) => {
          try {
            const result = fn(...args);
            if (result && typeof result.catch === "function") result.catch((error) => console.error(error));
          } catch (error) {
            console.error(error);
          }
        };

        /** A new row in #app, optionally with a short label in front. Returns the row element. */
        export function row(label = "") {
          ensureStyle();
          const el = document.createElement("div");
          el.className = "ui-row";
          if (label) {
            const span = document.createElement("span");
            span.className = "ui-label";
            span.textContent = label;
            el.append(span);
          }
          document.getElementById("app").append(el);
          return el;
        }

        /** One button. `testid` is used as is. */
        export function button(label, testid, onClick, parent = row()) {
          const el = document.createElement("button");
          el.type = "button";
          el.className = "ui-btn";
          el.textContent = String(label);
          el.dataset.testid = testid;
          el.addEventListener("click", safe(onClick));
          parent.append(el);
          return el;
        }

        /** A row of choices; the picked one is shown pressed. Test ids are `<name>-1`, `<name>-2`, … */
        export function choices(name, options, onPick, { label = name, selected } = {}) {
          const parent = row(label);
          const buttons = options.map((option, i) =>
            button(option, `${name}-${i + 1}`, () => {
              for (const b of buttons) b.setAttribute("aria-pressed", String(b === buttons[i]));
              onPick(option, i);
            }, parent),
          );
          for (const [i, b] of buttons.entries()) b.setAttribute("aria-pressed", String(options[i] === selected));
          return buttons;
        }
      vite.config.js: |
        import { defineConfig } from "vite";
        import courseRunner from "./course/runner.js";

        export default defineConfig({
          plugins: [courseRunner()],
        });
