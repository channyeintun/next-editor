      [[mark:click-twice]] နောက်တစ်ခါ ငွေ နှစ်ခါ ဖြတ်သွားတယ် ဆိုတာကို နှိပ်ပါတယ်။ [[mark:read-twice]] Route card မှာ
      model ဆီ message လေးခု ပို့ထားတယ်လို့ ပြပါတယ်။ system prompt၊ ပထမ မေးခွန်း၊ အဲဒီ မေးခွန်းရဲ့ အဖြေနဲ့ အခု
      မေးခွန်းပါ။ စကားပြောခဲ့တာ အားလုံး request နဲ့ ပါသွားလို့ customer က အစကနေ ပြန်ရှင်းပြစရာ မလိုပါဘူး။ model
      ပေးခဲ့တဲ့ အဖြေက အော်ဒါ ၂၄၁၇ အကြောင်းပါ။ ငွေကို ဆိုင်ကပဲ ပြန်ပေးနိုင်တယ်လို့ ပြောပေမယ့် ဘာ ဆက်လုပ်ရမလဲတော့
      မပြောပါဘူး။
