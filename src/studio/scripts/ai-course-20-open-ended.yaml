      [[mark:click-address]] နောက်ဆုံး လိပ်စာ ပြောင်းချင်တယ် ဆိုတာကို နှိပ်ပါတယ်။ [[mark:read-unsure]] router က
      ပုံမှန် မေးခွန်း ဖြစ်နိုင်ခြေ ၄၇ ရာခိုင်နှုန်းပဲ ပေးလို့ ၃၀ နဲ့ ၇၀ ကြားမှာ ရှိပါတယ်။ ဒါကြောင့် ဒုတိယ rule က
      သေချာ မသိလို့ ဆိုပြီး လှလှ ဆီ လွှဲပေးလိုက်ပါတယ်။ အော်ဒါ ခလုတ်ထက် တစ်ဆင့် ပိုပြီး၊
      request တိုင်းအလိုက် UI တစ်ခုလုံးကို ပြောင်းပေးတဲ့ generative UI ဆိုတဲ့ စိတ်ကူးလည်း ရှိပါတယ်။
