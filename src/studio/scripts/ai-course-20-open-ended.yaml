          drawMs: 2400,
        }

  - id: next
    narration: >
      [[mark:draw-n]] ဆက်လေ့လာချင်ရင် board ပေါ်က နေရာ သုံးခုကို ကြည့်ပါ။ [[mark:draw-quote]] AI တစ်ခု တကယ်
      အလုပ်ဖြစ်သွားတဲ့အခါ လူတွေက AI လို့တောင် မခေါ်ကြတော့ဘူး ဆိုတဲ့ စကား ရှိပါတယ်။ ကိုယ်တို့ ဆိုင်ရဲ့ search၊ router၊
      chat တွေလည်း customer အတွက် တကယ် အသုံးဝင်လာရင်၊ ဆိုင်ရဲ့ ပုံမှန် ဝန်ဆောင်မှု တစ်ခုလိုပဲ ဖြစ်သွားမှာပါ။
      ဒါပေမဲ့ AI ပါတယ် ဆိုတာကိုတော့ label နဲ့ ဆက်ပြီး ပွင့်ပွင့်လင်းလင်း ပြထားရပါမယ်။ [[mark:thanks]] ဒီ course ကို အဆုံးထိ လေ့လာပေးလို့ ကျေးဇူးတင်ပါတယ် ခင်ဗျာ။
