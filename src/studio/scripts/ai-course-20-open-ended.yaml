          clear: true,
          upsertIds: [z-title, z-q1, z-q2],
          drawMs: 1500,
        }
      - {
          id: draw-quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [z-a, z-a-n1, z-a-n2],
          drawMs: 1800,
        }

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ open ended AI က flexibility အများဆုံး ပေးပေမယ့် risk လည်း အများဆုံးပါ။
      [[mark:sel-confirm]] ဒါကြောင့် ဆိုင်ရဲ့ chat မှာ system ဘာယူဆလဲ ပြပြီး customer ပြင်လို့ ရအောင် လုပ်တာ၊ ငွေနဲ့
      ဆိုင်တဲ့ အလုပ် မလုပ်ခင် အတည်ပြုခိုင်းတာ၊ [[mark:sel-unsure]] router မသေချာရင် လူဆီ လွှဲတာ တွေကို ထည့်ခဲ့ပါတယ်။
      ပြီးတော့ pattern ဇယားက ဘယ် AI feature မှာမဆို AI မရရင်လည်း အလုပ်ဖြစ်ရမယ် ဆိုတာကို ပြပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Design AI user experiences (key takeaways)",
          url: "https://web.dev/learn/ai/ux-patterns",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: recap }, open: false }
      - {
          id: open-main-recap,
          type: workspace.openFile,
          at: { mark: sel-confirm },
          path: src/main.js,
        }
      - id: sel-confirm
        type: editor.select
        at: { afterAction: open-main-recap }
        target:
          {
            file: src/main.js,
            text: '  if (text.includes("ပြန်အမ်း")) return "confirm";',
            occurrence: 1,
          }
      - id: sel-unsure
        type: editor.select
        at: { mark: sel-unsure }
        target:
          {
            file: src/main.js,
            text: '  if (routine > 0.3 && routine < 0.7) return "person";',
            occurrence: 1,
          }
      - {
          id: expect-final-route,
          type: expect.file,
          at: { afterAction: sel-unsure },
          path: src/main.js,
          contains: "  const routine = predict(router, question).routine;\n  if (routine > 0.3 && routine < 0.7) return \"person\";\n  return routine >= 0.5 ? \"here\" : \"server\";\n",
        }
      - {
          id: expect-final-confirm,
          type: expect.file,
          at: { afterAction: expect-final-route },
          path: src/main.js,
          contains: "  // Ask before acting:\n  if (text.includes(\"ပြန်အမ်း\")) return \"confirm\";\n\n  return route(text, { localModel: true });\n",
        }

  - id: course
    chapter: "Course တစ်ခုလုံးကို ပြန်ကြည့်ရအောင်"
    narration: >
      [[mark:draw-b]] course တစ်ခုလုံးကို blueprint နဲ့ ပြန်ကြည့်ရအောင်။ [[mark:draw-b1]] အစ lesson တွေမှာ AI ကို
      AI ဖြစ်လို့ မထည့်ဘဲ၊ customer ရဲ့ ပြဿနာကနေ opportunity ကို ရှာခဲ့ပါတယ်။ [[mark:draw-b2]] Solution ထဲမှာ
      data ပြင်ဆင်တာ၊ predictive နဲ့ generative model တွေ၊ platform၊ prompt နဲ့ evaluation ကို လုပ်ခဲ့ပြီး၊ U X
      pattern တွေနဲ့ အဆုံးသတ်ခဲ့ပါတယ်။ [[mark:draw-b3]] အဲဒီ တစ်လျှောက်လုံးမှာ privacy၊ fairness၊ trust ဆိုတဲ့
      governance ကလည်း ပါနေခဲ့ပါတယ်။ [[mark:draw-q]] lesson ၁ က မေးခွန်း သုံးခုကို ပြန်မေးရရင်၊ ဘာ feature ကို
      ဘာကြောင့် ဆောက်မလဲ၊ AI က အဲဒီအတွက် မှန်တဲ့ tool လား၊ အောင်မြင်တာကို ဘာနဲ့ တိုင်းမလဲ ဆိုတာပါ။
      [[mark:draw-q-start]] feature အသစ် တိုင်းကို ဒီ မေးခွန်း သုံးခုနဲ့ပဲ စပါ။
    sources:
