  - id: terms
    narration: >
      [[mark:draw-t]] course ထဲက အဓိက စကားလုံးတချို့ကို ပြန်ကြည့်ရအောင်။ [[mark:draw-t1]] input
      တူရင် output အမြဲ တူတဲ့ deterministic software နဲ့ မတူဘဲ၊ model က train လုပ်ရင်း ညှိထားတဲ့ model weights နဲ့
      ခန့်မှန်းပါတယ်။ train တုန်းက data နဲ့ အခု data မတူတော့လို့ မှန်ကန်မှု ကျလာတာက data drift ပါ။ model ကို ဘယ်လို
      ဆောက်ပြီး စစ်ထားလဲ ဆိုတာကိုတော့ model card မှာ ရေးပါတယ်။ [[mark:draw-t2]] ခုနက chat ရဲ့ server ဘက်လို model
      ကို database၊ rule တွေနဲ့ တွဲထားတာက compound AI ပါ။ အော်ဒါ တစ်ခုတည်းရဲ့ အချက်ကိုပဲ prompt ထဲ ထည့်ခဲ့သလို၊
      လိုတဲ့ အချက်ကိုပဲ ရွေးပို့တာက context engineering ပါ။
      developer ရေးတဲ့ system prompt နဲ့ customer ရေးတဲ့ user prompt ကိုလည်း ခွဲပြီး စဉ်းစားရပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Glossary and concepts",
          url: "https://web.dev/learn/ai/glossary",
        }
