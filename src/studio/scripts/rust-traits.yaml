build:
  voiceProfile: pocket-alba-v1
  seed: 46

runtime:
  kind: rust-playground
  defaultMode: fixture
  fixture:
    latencyMs: 600
    result:
      status: success
      stdout: "Hello, Rex!\nBEEP. I am Unit-7.\n"
      stderr: ""

scenes:
  - id: traits-slide
    chapter: Shared behavior
    narration: >
      You've already used traits. Debug, which you added to structs with
      derive, is one. So is PartialOrd, the bound you saw with generics. A
      trait describes behavior that many types can share. It's a bit like an
      interface in other languages. Here's our own trait, called Greet. It
      says every type that greets must have a method called name, which
      returns a String. Each type provides its own name.
    sources:
      - title: "The Rust Book — Defining a Trait"
        url: "https://doc.rust-lang.org/book/ch10-02-traits.html#defining-a-trait"
      - title: "The Rust Book — Derivable Traits"
        url: "https://doc.rust-lang.org/book/appendix-03-derivable-traits.html"
      - title: "std::cmp::PartialOrd"
        url: "https://doc.rust-lang.org/std/cmp/trait.PartialOrd.html"
    actions:
      # Opens in the quiet handle before the first word.
      - id: show-trait
        type: slide.show
        at: { scene: start, offsetMs: -1500 }
        slideId: trait-slide

  - id: contract
    narration: >
      Why traits? In Rust, one struct can't inherit from another. Traits are
      how different types share behavior.
      [[mark:draw-trait]] At the top, the trait Greet, with one required
      method, name.
      [[mark:draw-impls]] Below it, two types implement Greet. Dog's name is
      Rex, and Robot's name is Unit-7. Code that only needs a name can now
      work with both. The trait is a promise, and the compiler checks it.
      [[mark:draw-cat]] Say we write impl Greet for a type called Cat, with
      nothing inside.
      [[mark:draw-cat-error]] The compiler stops you, with error E0046: not
      all trait items implemented, missing name.
    sources:
      - title: "The Rust Book — Inheritance as a Type System and as Code Sharing"
        url: "https://doc.rust-lang.org/book/ch18-01-what-is-oo.html#inheritance-as-a-type-system-and-as-code-sharing"
      - title: "The Rust Book — Implementing a Trait on a Type"
        url: "https://doc.rust-lang.org/book/ch10-02-traits.html#implementing-a-trait-on-a-type"
      - title: "Rust error codes — E0046"
        url: "https://doc.rust-lang.org/error_codes/E0046.html"
    actions:
      - id: close-trait-slide
        type: slide.close
        at: { scene: start }
      - id: open-board-contract
        type: whiteboard.apply
        at: { scene: start, offsetMs: 300 }
        open: true
        upsertIds: [b1-title]
      - id: draw-trait
        type: whiteboard.apply
        at: { mark: draw-trait }
        upsertIds: [b1-trait-box, b1-trait-name, b1-trait-sig]
        drawMs: 1800
      - id: draw-impls
        type: whiteboard.apply
        at: { mark: draw-impls }
        upsertIds:
          [
            b1-arrow-dog,
            b1-dog-box,
            b1-dog-impl,
            b1-dog-name,
            b1-arrow-robot,
            b1-robot-box,
            b1-robot-impl,
            b1-robot-name,
          ]
        drawMs: 3600
      - id: draw-cat
        type: whiteboard.apply
        at: { mark: draw-cat }
        upsertIds: [b1-cat-code, b1-cat-circle]
        drawMs: 2000
      - id: draw-cat-error
        type: whiteboard.apply
        at: { mark: draw-cat-error }
        upsertIds: [b1-cat-err1, b1-cat-err2]
        drawMs: 2000

  - id: define
    chapter: Implementing a trait
    narration: >
      Now let's write it. Dog is a struct with no fields, and Robot holds an
      id.
      [[mark:type-trait]] First, the trait: the trait keyword, its name, and
      the method signatures in curly braces.
      [[mark:select-sig]] name borrows the value through ampersand self, and
      returns a String. There's no body, only a semicolon. So every type that
      implements Greet has to write that body itself.
    sources:
      - title: "The Rust Book — Defining a Trait"
        url: "https://doc.rust-lang.org/book/ch10-02-traits.html#defining-a-trait"
      - title: "The Rust Book — Unit-Like Structs Without Any Fields"
        url: "https://doc.rust-lang.org/book/ch05-01-defining-structs.html#unit-like-structs-without-any-fields"
      - title: "The Rust Reference — Traits"
        url: "https://doc.rust-lang.org/reference/items/traits.html"
    actions:
      - id: close-board-contract
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-main
        type: workspace.openFile
        at: { scene: start, offsetMs: 500 }
        path: main.rs
      - id: type-trait
        type: editor.type
        at: { mark: type-trait }
        target:
          file: main.rs
          after: ""
          occurrence: 1
        cadence: line-by-line
        text: "trait Greet {\n    fn name(&self) -> String;\n}\n\n"
      - id: select-sig
        type: editor.select
        at: { mark: select-sig }
        target:
          file: main.rs
          text: "fn name(&self) -> String;"
          occurrence: 1

  - id: impl-dog
    narration: >
      [[mark:type-dog]] To implement a trait, write impl, the trait's name,
      the word for, and the type.
      [[mark:select-impl-dog]] So this block is impl Greet for Dog. Inside it
      goes the body of name, and Dog returns Rex.
    sources:
      - title: "The Rust Book — Implementing a Trait on a Type"
        url: "https://doc.rust-lang.org/book/ch10-02-traits.html#implementing-a-trait-on-a-type"
      - title: "The Rust Reference — Trait Implementations"
        url: "https://doc.rust-lang.org/reference/items/implementations.html#trait-implementations"
    actions:
      - id: type-dog
        type: editor.type
        at: { mark: type-dog }
        target:
          file: main.rs
          after: "struct Dog;\n\n"
          occurrence: 1
        cadence: line-by-line
        text: "impl Greet for Dog {\n    fn name(&self) -> String {\n        String::from(\"Rex\")\n    }\n}\n\n"
      - id: select-impl-dog
        type: editor.select
        at: { mark: select-impl-dog }
        target:
          file: main.rs
          text: "impl Greet for Dog"
          occurrence: 1

  - id: impl-robot
    narration: >
      [[mark:type-robot]] Robot implements Greet in its own way. It builds
      its name from its id, with format. Now both types keep the promise.
    sources:
      - title: "The Rust Book — Implementing a Trait on a Type"
        url: "https://doc.rust-lang.org/book/ch10-02-traits.html#implementing-a-trait-on-a-type"
      - title: "std::format!"
        url: "https://doc.rust-lang.org/std/macro.format.html"
    actions:
      - id: type-robot
        type: editor.type
        at: { mark: type-robot }
        target:
          file: main.rs
          after: "    id: u32,\n}\n"
          occurrence: 1
        cadence: line-by-line
        text: "\nimpl Greet for Robot {\n    fn name(&self) -> String {\n        format!(\"Unit-{}\", self.id)\n    }\n}\n"

  - id: defaults-slide
    chapter: Default methods
    narration: >
      [[mark:show-default]] A trait can also supply a default: a method with
      a body. Here, hello builds a greeting from name. A type can use the
      default as it is, or override it with its own version.
    sources:
      - title: "The Rust Book — Default Implementations"
        url: "https://doc.rust-lang.org/book/ch10-02-traits.html#default-implementations"
    actions:
      - id: show-default
        type: slide.show
        at: { mark: show-default }
        slideId: default-slide

  - id: default-code
    narration: >
      Back to the code. [[mark:type-default]] Let's add hello to the trait.
      [[mark:select-call-name]] Inside, the default calls name on self. That
      always works, because every type that implements Greet must have name.
      Dog writes nothing more, so Dog uses this default.
    sources:
      - title: "The Rust Book — Default Implementations"
        url: "https://doc.rust-lang.org/book/ch10-02-traits.html#default-implementations"
    actions:
      - id: close-default-slide
        type: slide.close
        at: { scene: start }
      - id: type-default
        type: editor.type
        at: { mark: type-default }
        target:
          file: main.rs
          after: "    fn name(&self) -> String;\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n    fn hello(&self) -> String {\n        format!(\"Hello, {}!\", self.name())\n    }\n"
      - id: select-call-name
        type: editor.select
        at: { mark: select-call-name }
        target:
          file: main.rs
          text: "self.name()"
          occurrence: 1

  - id: override
    narration: >
      [[mark:type-override]] Robot wants a different greeting, so it
      overrides hello, with a beep. When a type writes its own version, Rust
      uses that one instead of the default.
    sources:
      - title: "The Rust Book — Default Implementations"
        url: "https://doc.rust-lang.org/book/ch10-02-traits.html#default-implementations"
    actions:
      - id: type-override
        type: editor.type
        at: { mark: type-override }
        target:
          file: main.rs
          after: "        format!(\"Unit-{}\", self.id)\n    }\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n    fn hello(&self) -> String {\n        format!(\"BEEP. I am {}.\", self.name())\n    }\n"

  - id: impl-param
    chapter: Traits as parameters
    narration: >
      Now, a function that works with any type that greets.
      [[mark:type-introduce]] It's called introduce, and it prints the
      greeting.
      [[mark:select-impl-greet]] Look at the parameter type: ampersand impl
      Greet. It means a reference to any type that implements Greet. Inside
      the function, you can only use what Greet promises, like hello.
    sources:
      - title: "The Rust Book — Traits as Parameters"
        url: "https://doc.rust-lang.org/book/ch10-02-traits.html#traits-as-parameters"
    actions:
      - id: type-introduce
        type: editor.type
        at: { mark: type-introduce }
        target:
          file: main.rs
          after: "        format!(\"BEEP. I am {}.\", self.name())\n    }\n}\n"
          occurrence: 1
        cadence: line-by-line
        text: "\nfn introduce(guest: &impl Greet) {\n    println!(\"{}\", guest.hello());\n}\n"
      - id: select-impl-greet
        type: editor.select
        at: { mark: select-impl-greet }
        target:
          file: main.rs
          text: "&impl Greet"
          occurrence: 1

  - id: not-greet
    narration: >
      So which types can you pass?
      [[mark:draw-sig]] introduce takes ampersand impl Greet, which means
      any type with Greet.
      [[mark:draw-ok]] A Dog works, and so does a Robot.
      [[mark:draw-cat-call]] Now say Cat has no impl Greet at all, and you
      pass a Cat.
      [[mark:draw-cat-err]] The compiler refuses, with error E0277: the trait
      bound isn't satisfied. That means Cat doesn't implement Greet. You find
      this when you compile, not while the program runs.
      [[mark:draw-same]] Why a trait bound? Because impl Greet is short for a
      generic with a trait bound: T must implement Greet. As with generics,
      the compiler builds a version of introduce for each type, so there's
      no runtime cost.
    sources:
      - title: "Rust error codes — E0277"
        url: "https://doc.rust-lang.org/error_codes/E0277.html"
      - title: "The Rust Book — Trait Bound Syntax"
        url: "https://doc.rust-lang.org/book/ch10-02-traits.html#trait-bound-syntax"
      - title: "The Rust Book — Performance of Code Using Generics"
        url: "https://doc.rust-lang.org/book/ch10-01-syntax.html#performance-of-code-using-generics"
    actions:
      - id: open-board-introduce
        type: whiteboard.apply
        at: { scene: start }
        open: true
        clear: true
        upsertIds: [b2-title]
      - id: draw-sig
        type: whiteboard.apply
        at: { mark: draw-sig }
        upsertIds: [b2-sig, b2-sig-line, b2-sig-label]
        drawMs: 1800
      - id: draw-ok
        type: whiteboard.apply
        at: { mark: draw-ok }
        upsertIds: [b2-dog, b2-dog-check, b2-robot, b2-robot-check]
        drawMs: 2000
      - id: draw-cat-call
        type: whiteboard.apply
        at: { mark: draw-cat-call }
        upsertIds: [b2-cat, b2-cat-line]
        drawMs: 1800
      - id: draw-cat-err
        type: whiteboard.apply
        at: { mark: draw-cat-err }
        upsertIds: [b2-err1, b2-err2]
        drawMs: 2200
      - id: draw-same
        type: whiteboard.apply
        at: { mark: draw-same }
        upsertIds: [b2-same]
        drawMs: 1600

  - id: main-calls
    narration: >
      Back to main. [[mark:type-main]] Let's make a Dog. It has no fields, so
      writing Dog is enough. Then a Robot with id seven, and we introduce
      both. We pass each one with an ampersand, so introduce only borrows
      them.
    sources:
      - title: "The Rust Book — Traits as Parameters"
        url: "https://doc.rust-lang.org/book/ch10-02-traits.html#traits-as-parameters"
      - title: "The Rust Book — References and Borrowing"
        url: "https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html"
    actions:
      - id: close-board-introduce
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: type-main
        type: editor.type
        at: { mark: type-main }
        target:
          file: main.rs
          after: "fn main() {\n"
          occurrence: 1
