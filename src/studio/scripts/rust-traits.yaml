# Rust from zero, lesson 17: traits.
#
# The arc: the deck page "Traits" names the idea (shared behavior, like an
# interface) with the Greet trait the whole lesson uses, and links it to the
# traits the learner already met (Debug via derive, PartialOrd as a bound).
# A whiteboard draws why: structs can't inherit, so one trait with a required
# name() is implemented by Dog and Robot, each its own way; a Cat that writes
# an empty impl gets E0046. The editor then builds it: the trait (signature
# only), impl Greet for Dog, impl Greet for Robot. The deck page "Default
# methods" introduces hello() with a body; the editor adds it to the trait
# (Dog uses it as-is) and Robot overrides it. Then `&impl Greet` as a
# parameter type in introduce(); a second board shows who can be passed, the
# compiler's answer for a type without the trait (E0277), and that impl Greet
# is shorthand for a generic bound <T: Greet> (no runtime cost). main
# introduces both. One run.
#
# Every compiler message on the boards or in the narration was confirmed with
# rustc 1.98 (edition 2024) on broken variants of the final program:
#   struct Cat; impl Greet for Cat {}
#     error[E0046]: not all trait items implemented, missing: `name`
#   struct Cat; let cat = Cat; introduce(&cat);   (no impl Greet for Cat)
#     error[E0277]: the trait bound `Cat: Greet` is not satisfied
#     help: the trait `Greet` is not implemented for `Cat`
#   fn introduce<T: Greet>(guest: &T)  compiles and prints the same output.
# The final program compiles with zero warnings.
#
# Board colours: blue = the trait being named (Greet, &impl Greet), green =
# types that implement it / calls that work, violet = the name each type
# returns (the result), red = the errors, orange = the caveat (impl Greet is
# a generic in disguise). #1e1e1e paints white on the dark board.
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/rust-traits.yaml
