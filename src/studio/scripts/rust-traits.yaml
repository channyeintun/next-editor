runtime:
  kind: rust-playground
  defaultMode: fixture
  fixture:
    latencyMs: 600
    result:
      status: success
      stdout: "Hello, Rex!\nBEEP. I am Unit-7.\n"
      stderr: ""

scenes:
  - id: traits-slide
    chapter: Trait နဲ့ မျှဝေသုံးတဲ့ စွမ်းရည်
    narration: >-
      trait တွေကို တကယ်တော့ ကိုယ် သုံးဖူးပြီးသားပါ။ struct တွေ လေ့လာတုန်းက derive နဲ့ ထည့်ခဲ့တဲ့
      Debug ဟာ trait တစ်ခုပါ။ generic တွေ လေ့လာတုန်းက trait bound အနေနဲ့ တွေ့ခဲ့တဲ့ PartialOrd ကလည်း
      trait တစ်ခုပါပဲ။ trait ဆိုတာ type အများကြီးက မျှဝေသုံးနိုင်တဲ့ စွမ်းရည်တွေကို နာမည်
      ပေးထားတာပါ။ တခြား ဘာသာစကား အများစုမှာ ရှိတဲ့ interface နဲ့ နည်းနည်း ဆင်ပါတယ်။ ဒီမှာ ကိုယ်ပိုင်
      trait တစ်ခု ရှိပါတယ်၊ နာမည်က Greet ပါ။ Greet က ပြောထားတာက၊ နှုတ်ဆက်နိုင်တဲ့ type တိုင်းမှာ
      name ဆိုတဲ့ method တစ်ခု ရှိရမယ်၊ ပြီးတော့ အဲဒီ name က String တစ်ခု ပြန်ပေးရမယ် ဆိုတာပါ။
      ဒါပေမဲ့ name ထဲမှာ ဘာ ပြန်ပေးမလဲ ဆိုတာကိုတော့ type တစ်ခုချင်းစီက ကိုယ့်ဟာကိုယ်
      သတ်မှတ်ပေးရပါတယ်။
    sources:
      - title: "The Rust Book — Defining a Trait"
        url: "https://doc.rust-lang.org/book/ch10-02-traits.html#defining-a-trait"
      - title: "The Rust Book — Derivable Traits"
        url: "https://doc.rust-lang.org/book/appendix-03-derivable-traits.html"
      - title: "std::cmp::PartialOrd"
        url: "https://doc.rust-lang.org/std/cmp/trait.PartialOrd.html"
    actions:
      # Opens in the quiet handle before the first word.
      - id: show-trait
        type: slide.show
        at: { scene: start, offsetMs: -1500 }
        slideId: trait-slide

  - id: contract
    narration: >-
      ဘာကြောင့် trait လိုလဲ ဆိုတာ ပုံနဲ့ ကြည့်ရအောင်။ Rust မှာ struct တစ်ခုက တခြား struct တစ်ခုဆီကနေ
      inherit လုပ်လို့ မရပါဘူး။ ဒါကြောင့် မတူတဲ့ type တွေကြားမှာ စွမ်းရည် တစ်ခုကို မျှဝေသုံးချင်ရင်၊
      trait နဲ့ လုပ်ရပါတယ်။ [[mark:draw-trait]] အပေါ်ဆုံးမှာ Greet trait ရှိပြီး၊ သူ့ထဲမှာ မဖြစ်မနေ
      ရေးရမယ့် method တစ်ခုတည်း ပါပါတယ်၊ အဲဒါက name ပါ။ [[mark:draw-impls]] သူ့အောက်မှာတော့ Greet
      ကို implement လုပ်ထားတဲ့ type နှစ်ခု ရှိပါတယ်။ Dog ရဲ့ name က Rex ကို ပြန်ပေးပြီး၊ Robot ရဲ့
      name ကတော့ Unit 7 ကို ပြန်ပေးပါတယ်။ ဒီတော့ name တစ်ခုပဲ လိုတဲ့ code ဆိုရင်၊ Dog နဲ့ရော Robot
      နဲ့ရော နှစ်ခုလုံးနဲ့ အလုပ်လုပ်လို့ ရသွားပါပြီ။ trait ဆိုတာ ကတိ တစ်ခုပါ၊ ပြီးတော့ အဲဒီ ကတိကို
      တည်မတည် compiler က စစ်ပေးပါတယ်။ [[mark:draw-cat]] ဥပမာအားဖြင့်၊ Cat ဆိုတဲ့ type အတွက် impl
      Greet ကို ရေးပြီး၊ သူ့ထဲမှာ ဘာမှ မထည့်ဘူး ဆိုပါစို့။ [[mark:draw-cat-error]] အဲဒီအခါ compiler
      က E0046 error နဲ့ ရပ်သွားပါတယ်။ trait ထဲက item တွေ အကုန် implement မလုပ်ရသေးဘူး၊ name
      ကျန်နေတယ်လို့ ပြောတာပါ။
    sources:
      - title: "The Rust Book — Inheritance as a Type System and as Code Sharing"
        url:
          "https://doc.rust-lang.org/book/ch18-01-what-is-oo.html#inheritance-as-a-type-system-and-as-co\
          de-sharing"
      - title: "The Rust Book — Implementing a Trait on a Type"
        url: "https://doc.rust-lang.org/book/ch10-02-traits.html#implementing-a-trait-on-a-type"
      - title: "Rust error codes — E0046"
        url: "https://doc.rust-lang.org/error_codes/E0046.html"
    actions:
      - id: close-trait-slide
        type: slide.close
        at: { scene: start }
      - id: open-board-contract
        type: whiteboard.apply
        at: { scene: start, offsetMs: 300 }
        open: true
        upsertIds: [b1-title]
      - id: draw-trait
        type: whiteboard.apply
        at: { mark: draw-trait }
        upsertIds: [b1-trait-box, b1-trait-name, b1-trait-sig]
        drawMs: 1800
      - id: draw-impls
        type: whiteboard.apply
        at: { mark: draw-impls }
        upsertIds:
          [
            b1-arrow-dog,
            b1-dog-box,
            b1-dog-impl,
            b1-dog-name,
            b1-arrow-robot,
            b1-robot-box,
            b1-robot-impl,
            b1-robot-name,
          ]
        drawMs: 3600
      - id: draw-cat
        type: whiteboard.apply
        at: { mark: draw-cat }
        upsertIds: [b1-cat-code, b1-cat-circle]
        drawMs: 2000
      - id: draw-cat-error
        type: whiteboard.apply
        at: { mark: draw-cat-error }
        upsertIds: [b1-cat-err1, b1-cat-err2]
        drawMs: 2000

  - id: define
    chapter: Trait တစ်ခုကို implement လုပ်ခြင်း
    narration: >-
      ကဲ၊ အခု code နဲ့ ရေးကြည့်ရအောင်။ ဖိုင်ထဲမှာ struct နှစ်ခု ရှိပါတယ်။ Dog က field ဘာမှ မပါတဲ့
      struct ဖြစ်ပြီး၊ Robot ကတော့ id တစ်ခု သိမ်းထားပါတယ်။ [[mark:type-trait]] အရင်ဆုံး trait ကို
      ရေးပါမယ်။ trait keyword နဲ့ စပြီး၊ နောက်မှာ trait ရဲ့ နာမည်၊ ပြီးတော့ method signature တွေကို
      တွန့်ကွင်းထဲမှာ ရေးပါတယ်။ [[mark:select-sig]] ဒီ signature ကို ကြည့်ပါ။ name က တန်ဖိုးကို
      ampersand self နဲ့ borrow လုပ်ပါတယ်၊ borrow ဆိုတာ ငှားသုံးတာပါ။ ပြီးတော့ String တစ်ခု
      ပြန်ပေးပါတယ်။ body မပါဘဲ semicolon နဲ့ပဲ ဆုံးထားတာ သတိထား ကြည့်ပါ။ ဒါကြောင့် Greet ကို
      implement လုပ်မယ့် type တိုင်းက အဲဒီ body ကို ကိုယ့်ဟာကိုယ် ရေးပေးရပါတယ်။
    sources:
      - title: "The Rust Book — Defining a Trait"
        url: "https://doc.rust-lang.org/book/ch10-02-traits.html#defining-a-trait"
      - title: "The Rust Book — Unit-Like Structs Without Any Fields"
        url:
          "https://doc.rust-lang.org/book/ch05-01-defining-structs.html#unit-like-structs-without-any-fi\
          elds"
      - title: "The Rust Reference — Traits"
        url: "https://doc.rust-lang.org/reference/items/traits.html"
    actions:
      - id: close-board-contract
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-main
        type: workspace.openFile
        at: { scene: start, offsetMs: 500 }
        path: main.rs
      - id: type-trait
        type: editor.type
        at: { mark: type-trait }
        target:
          file: main.rs
          after: ""
          occurrence: 1
        cadence: line-by-line
        text: "trait Greet {

          \    fn name(&self) -> String;

          }

          \n"
      - id: select-sig
        type: editor.select
        at: { mark: select-sig }
        target:
          file: main.rs
          text: "fn name(&self) -> String;"
          occurrence: 1

  - id: impl-dog
    narration: >-
      [[mark:type-dog]] trait တစ်ခုကို implement လုပ်ဖို့ကတော့ impl၊ trait ရဲ့ နာမည်၊ for၊ ပြီးတော့
      type ရဲ့ နာမည် ဆိုပြီး အစဉ်လိုက် ရေးပါတယ်။ [[mark:select-impl-dog]] ဒါကြောင့် ဒီ block က impl
      Greet for Dog ပါ။ သူ့ထဲမှာ name ရဲ့ body ကို ရေးပြီး၊ Dog ကတော့ Rex ကို ပြန်ပေးပါတယ်။
    sources:
      - title: "The Rust Book — Implementing a Trait on a Type"
        url: "https://doc.rust-lang.org/book/ch10-02-traits.html#implementing-a-trait-on-a-type"
      - title: "The Rust Reference — Trait Implementations"
        url: "https://doc.rust-lang.org/reference/items/implementations.html#trait-implementations"
    actions:
      - id: type-dog
        type: editor.type
        at: { mark: type-dog }
        target:
          file: main.rs
          after: "struct Dog;\n\n"
          occurrence: 1
        cadence: line-by-line
        text: "impl Greet for Dog {

          \    fn name(&self) -> String {

          \        String::from(\"Rex\")

          \    }

          }

          \n"
      - id: select-impl-dog
        type: editor.select
        at: { mark: select-impl-dog }
        target:
          file: main.rs
          text: "impl Greet for Dog"
          occurrence: 1

  - id: impl-robot
    narration: >-
      [[mark:type-robot]] Robot ကလည်း Greet ကို implement လုပ်ပါတယ်၊ ဒါပေမဲ့ သူ့နည်းနဲ့သူပါ။ သူက
      name ကို သူ့ id ကနေ format macro နဲ့ တည်ဆောက်ပေးပါတယ်။ အခုတော့ type နှစ်ခုလုံးက Greet ရဲ့
      ကတိကို တည်သွားပါပြီ။
    sources:
      - title: "The Rust Book — Implementing a Trait on a Type"
        url: "https://doc.rust-lang.org/book/ch10-02-traits.html#implementing-a-trait-on-a-type"
      - title: "std::format!"
        url: "https://doc.rust-lang.org/std/macro.format.html"
    actions:
      - id: type-robot
        type: editor.type
        at: { mark: type-robot }
        target:
          file: main.rs
          after: "    id: u32,\n}\n"
          occurrence: 1
        cadence: line-by-line
        text: "

          impl Greet for Robot {

          \    fn name(&self) -> String {

          \        format!(\"Unit-{}\", self.id)

          \    }

          }\n"

  - id: defaults-slide
    chapter: Default method တွေ
    narration: >-
      [[mark:show-default]] trait တစ်ခုက default method ကိုလည်း ပေးထားလို့ ရပါတယ်။ ဆိုလိုတာက
      signature တင် မကဘဲ body ပါ ထည့်ရေးထားတဲ့ method ပါ။ ဒီမှာ hello ဆိုတဲ့ method က name ကို
      သုံးပြီး နှုတ်ဆက်စကား တစ်ခု တည်ဆောက်ပေးပါတယ်။ type တစ်ခုက ဒီ default ကို ဒီအတိုင်း ယူသုံးလို့
      ရသလို၊ ကိုယ်ပိုင် version နဲ့ override လုပ်လို့လည်း ရပါတယ်။
    sources:
      - title: "The Rust Book — Default Implementations"
        url: "https://doc.rust-lang.org/book/ch10-02-traits.html#default-implementations"
    actions:
      - id: show-default
        type: slide.show
        at: { mark: show-default }
        slideId: default-slide

  - id: default-code
    narration: >-
      editor ထဲ ပြန်သွားရအောင်။ [[mark:type-default]] trait ထဲ hello ကို ထည့်ကြည့်ရအောင်။
      [[mark:select-call-name]] သူ့ body ထဲမှာ self ရဲ့ name ကို ခေါ်ထားပါတယ်။ ဒီလို ခေါ်တာ အမြဲ
      အဆင်ပြေပါတယ်။ ဘာကြောင့်လဲဆိုတော့၊ Greet ကို implement လုပ်ထားတဲ့ type တိုင်းမှာ name မဖြစ်မနေ
      ရှိရမှာ ဖြစ်လို့ပါ။ Dog ကတော့ ဒီထက် ဘာမှ ထပ်မရေးတဲ့အတွက်၊ ဒီ default hello ကိုပဲ
      သုံးသွားပါလိမ့်မယ်။
    sources:
      - title: "The Rust Book — Default Implementations"
        url: "https://doc.rust-lang.org/book/ch10-02-traits.html#default-implementations"
    actions:
      - id: close-default-slide
        type: slide.close
        at: { scene: start }
      - id: type-default
        type: editor.type
        at: { mark: type-default }
        target:
          file: main.rs
          after: "    fn name(&self) -> String;\n"
          occurrence: 1
        cadence: line-by-line
        text: "

          \    fn hello(&self) -> String {

          \        format!(\"Hello, {}!\", self.name())

          \    }\n"
      - id: select-call-name
        type: editor.select
        at: { mark: select-call-name }
        target:
          file: main.rs
          text: "self.name()"
          occurrence: 1

  - id: override
    narration: >-
      [[mark:type-override]] Robot ကတော့ နှုတ်ဆက်ပုံ မတူချင်လို့၊ hello ကို သူ့ impl block ထဲမှာ
      override လုပ်ပြီး၊ BEEP နဲ့ စတဲ့ စာသား ပြန်ပေးပါတယ်။ type တစ်ခုက ကိုယ်ပိုင် version ရေးထားရင်၊
      Rust က default အစား အဲဒီ version ကို သုံးပါတယ်။
    sources:
      - title: "The Rust Book — Default Implementations"
        url: "https://doc.rust-lang.org/book/ch10-02-traits.html#default-implementations"
    actions:
      - id: type-override
        type: editor.type
        at: { mark: type-override }
        target:
          file: main.rs
          after: "        format!(\"Unit-{}\", self.id)

            \    }\n"
          occurrence: 1
        cadence: line-by-line
        text: "

          \    fn hello(&self) -> String {

          \        format!(\"BEEP. I am {}.\", self.name())

          \    }\n"

  - id: impl-param
    chapter: Trait ကို parameter အဖြစ် သုံးခြင်း
    narration: >-
      အခု နှုတ်ဆက်နိုင်တဲ့ ဘယ် type နဲ့မဆို အလုပ်လုပ်တဲ့ function တစ်ခု ရေးကြည့်ရအောင်။
      [[mark:type-introduce]] နာမည်က introduce ဖြစ်ပြီး၊ သူက နှုတ်ဆက်စကားကို print ထုတ်ပေးပါတယ်။
      [[mark:select-impl-greet]] parameter ရဲ့ type ကို ကြည့်ပါ၊ ampersand impl Greet ပါ။ ဆိုလိုတာက
      Greet ကို implement လုပ်ထားတဲ့ ဘယ် type ရဲ့ reference ကိုမဆို လက်ခံတယ် ဆိုတာပါ။ function
      ထဲမှာတော့ Greet က ကတိပေးထားတဲ့ အရာတွေကိုပဲ သုံးလို့ ရပါတယ်၊ ဥပမာအားဖြင့် hello လိုမျိုးပါ။
    sources:
      - title: "The Rust Book — Traits as Parameters"
        url: "https://doc.rust-lang.org/book/ch10-02-traits.html#traits-as-parameters"
    actions:
      - id: type-introduce
        type: editor.type
        at: { mark: type-introduce }
        target:
          file: main.rs
          after: "        format!(\"BEEP. I am {}.\", self.name())

            \    }

            }\n"
          occurrence: 1
        cadence: line-by-line
        text: "

          fn introduce(guest: &impl Greet) {

          \    println!(\"{}\", guest.hello());

          }\n"
      - id: select-impl-greet
        type: editor.select
        at: { mark: select-impl-greet }
        target:
          file: main.rs
          text: "&impl Greet"
          occurrence: 1

  - id: not-greet
    narration: >-
      ဒါဆို introduce ကို ဘယ် type တွေ ပေးလို့ ရလဲ ဆိုတာ ပုံနဲ့ ကြည့်ရအောင်။ [[mark:draw-sig]]
      introduce က ampersand impl Greet ကို လက်ခံပါတယ်။ ဆိုလိုတာက Greet ပါတဲ့ type တိုင်းကို ပေးလို့
      ရတယ် ဆိုတာပါ။ [[mark:draw-ok]] Dog ဆိုရင် ရပါတယ်၊ Robot ဆိုရင်လည်း ရပါတယ်။
      [[mark:draw-cat-call]] ဒါပေမဲ့ Cat အတွက် impl Greet လုံးဝ မရေးထားဘဲ၊ Cat တစ်ခုကို ပေးလိုက်တယ်
      ဆိုပါစို့။ [[mark:draw-cat-err]] အဲဒီအခါ compiler က လက်မခံဘဲ E0277 error နဲ့ ရပ်သွားပါတယ်။
      trait bound က မပြည့်မီဘူးတဲ့။ ဆိုလိုတာက Cat က Greet ကို implement မလုပ်ထားဘူး ဆိုတာပါ။ ဒီ
      အမှားကို program run နေချိန်မှာ တွေ့တာ မဟုတ်ဘဲ၊ compile လုပ်ချိန်မှာတင် ဖမ်းမိသွားတာပါ။
      [[mark:draw-same]] ဘာကြောင့် trait bound လို့ ပြောလဲဆိုတော့၊ impl Greet ဆိုတာ တကယ်တော့ trait
      bound ပါတဲ့ generic တစ်ခုရဲ့ အတိုကောက် ဖြစ်လို့ပါ။ ဆိုလိုတာက T က Greet ကို implement
      လုပ်ထားရမယ် ဆိုတဲ့ သဘောပါ။ generic တွေမှာလိုပဲ၊ compiler က ကိုယ် သုံးတဲ့ type
      တစ်ခုချင်းစီအတွက် introduce ရဲ့ version တစ်ခုစီ တည်ဆောက်ပေးတဲ့အတွက်၊ program run နေချိန်မှာ
      ဘာမှ ပိုနှေးမသွားပါဘူး။
    sources:
      - title: "Rust error codes — E0277"
        url: "https://doc.rust-lang.org/error_codes/E0277.html"
      - title: "The Rust Book — Trait Bound Syntax"
        url: "https://doc.rust-lang.org/book/ch10-02-traits.html#trait-bound-syntax"
      - title: "The Rust Book — Performance of Code Using Generics"
        url: "https://doc.rust-lang.org/book/ch10-01-syntax.html#performance-of-code-using-generics"
    actions:
      - id: open-board-introduce
        type: whiteboard.apply
        at: { scene: start }
        open: true
        clear: true
        upsertIds: [b2-title]
      - id: draw-sig
        type: whiteboard.apply
        at: { mark: draw-sig }
        upsertIds: [b2-sig, b2-sig-line, b2-sig-label]
        drawMs: 1800
      - id: draw-ok
        type: whiteboard.apply
        at: { mark: draw-ok }
        upsertIds: [b2-dog, b2-dog-check, b2-robot, b2-robot-check]
        drawMs: 2000
      - id: draw-cat-call
        type: whiteboard.apply
        at: { mark: draw-cat-call }
        upsertIds: [b2-cat, b2-cat-line]
        drawMs: 1800
      - id: draw-cat-err
        type: whiteboard.apply
        at: { mark: draw-cat-err }
        upsertIds: [b2-err1, b2-err2]
        drawMs: 2200
      - id: draw-same
        type: whiteboard.apply
        at: { mark: draw-same }
        upsertIds: [b2-same]
        drawMs: 1600

  - id: main-calls
    narration: >-
      main ထဲ ပြန်သွားရအောင်။ [[mark:type-main]] အရင်ဆုံး Dog တစ်ခု လုပ်ပါမယ်။ Dog မှာ field
      မပါတဲ့အတွက် Dog လို့ ရေးလိုက်ရုံနဲ့ လုံလောက်ပါတယ်။ ပြီးတော့ id က 7 ဖြစ်တဲ့ Robot တစ်ခု
      လုပ်ပြီး၊ နှစ်ခုလုံးကို introduce နဲ့ မိတ်ဆက်ပေးပါမယ်။ ပေးတဲ့အခါ တစ်ခုချင်းစီရဲ့ ရှေ့မှာ
      ampersand ထည့်ပြီး ပေးတာ သတိထား ကြည့်ပါ။ ဒါကြောင့် introduce က အဲဒီ တန်ဖိုးတွေကို borrow
      လုပ်ရုံပဲ လုပ်ပါတယ်။
    sources:
      - title: "The Rust Book — Traits as Parameters"
        url: "https://doc.rust-lang.org/book/ch10-02-traits.html#traits-as-parameters"
      - title: "The Rust Book — References and Borrowing"
        url: "https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html"
    actions:
      - id: close-board-introduce
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: type-main
        type: editor.type
        at: { mark: type-main }
        target:
          file: main.rs
          after: "fn main() {\n"
          occurrence: 1
        cadence: line-by-line
        text: "    let dog = Dog;

          \    let robot = Robot { id: 7 };

          \    introduce(&dog);

          \    introduce(&robot);\n"

  - id: run
    narration: >-
      [[mark:run]] ကဲ၊ run ကြည့်ရအောင်။ ပထမ စာကြောင်းက Hello, Rex ပါ။ Dog က default hello ကို
      သုံးသွားတာပါ။ နောက် စာကြောင်းကတော့ BEEP၊ I am Unit 7 ပါ။ Robot ကတော့ သူ့ ကိုယ်ပိုင် hello ကို
      သုံးသွားတာပါ။ function တစ်ခုတည်းနဲ့ type နှစ်မျိုးလုံးကို နှုတ်ဆက်လိုက်တာပါ။
    sources:
      - title: "The Rust Book — Traits: Defining Shared Behavior"
        url: "https://doc.rust-lang.org/book/ch10-02-traits.html"
    actions:
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "BEEP. I am Unit-7."
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: "fn introduce(guest: &impl Greet) {"

  - id: wrap
    narration: >-
      ဒါဆို ပြန်ချုပ်ရရင်၊ trait ဆိုတာ type တွေမှာ ရှိမယ်လို့ ကတိပေးထားတဲ့ စွမ်းရည်တွေကို နာမည်
      ပေးထားတာပါ။ default method က ထပ်ခါထပ်ခါ ရေးရမယ့် code ကို သက်သာစေပြီး၊ impl Greet ကတော့ အဲဒီ
      ကတိကို တည်တဲ့ ဘယ် type ကိုမဆို လက်ခံပါတယ်။ နောက် lesson မှာတော့ lifetime တွေ၊ ဆိုလိုတာက
      reference တစ်ခုကို သူ ညွှန်ထားတဲ့ တန်ဖိုး ပျောက်သွားပြီးနောက် ဘယ်တော့မှ မသုံးမိအောင် Rust က
      ဘယ်လို စစ်ပေးလဲ ဆိုတာကို ကြည့်သွားပါမယ်။
    sources:
      - title: "The Rust Book — Traits: Defining Shared Behavior"
        url: "https://doc.rust-lang.org/book/ch10-02-traits.html"
      - title: "The Rust Book — Validating References with Lifetimes"
        url: "https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html"
    actions: []

checks:
  # 500 (not 300): google-svg deck slides embed per-slide font data whose
  # paint briefly stalls the main thread at each show/close.
  - { type: timing.p95Ms, max: 500 }
