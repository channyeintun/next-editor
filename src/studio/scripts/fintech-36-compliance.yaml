  - id: rule
    chapter: Transaction monitoring
    narration: >-
      [[mark:show-rule]] gate ထဲက rule တစ်ခုကို ကြည့်ရအောင်။ AML နဲ့ CFT ဆိုတာ anti-money laundering
      နဲ့ countering the financing of terrorism ပါ၊ တရားမဝင် ငွေကို ရှာဖွေ တားဆီးတဲ့ control တွေပါ။
      transaction monitoring က အဲဒီ control တွေရဲ့ engineering အပိုင်းဖြစ်ပြီး၊ ငွေရွှေ့ပုံ pattern တွေကို rule
      နဲ့ စစ်ပါတယ်။ [[mark:pt-d1]] deposit တစ်ခုချင်းက threshold အောက်မှာပဲ ရှိပါတယ်။ threshold အောက်မှာ
      နေအောင် ပမာဏကို ခွဲပို့တဲ့ pattern ကို structuring လို့ ခေါ်ပါတယ်။ [[mark:rule-2]] တစ်ခုချင်း ကြည့်ရင်
      ဘာမှ မဖြစ်ပေမဲ့ တစ်ရက်အတွင်း ပေါင်းကြည့်ရင် threshold ကို အများကြီး ကျော်ပါတယ်။ [[mark:rule-3]] ဒီလို rule ရဲ့ အလုပ်က များသောအားဖြင့် ပိတ်ဖို့ မဟုတ်ဘဲ alert တစ်ခုနဲ့ case တစ်ခု ဖွင့်ဖို့ပါ၊ ဆုံးဖြတ်တာက
      လူပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Compliance & regulation: AML / CFT (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#compliance-regulation",
        }
