      data.go: |
        package main

        import "time"

        var customers = []Customer{{1042, Verified}, {2077, Pending}, {3150, Restricted}}

        func at(hour, minute int) time.Time { return time.Date(2026, 3, 2, hour, minute, 0, 0, time.UTC) }

        // deposits of one day, in EUR cents.
        var deposits = []Deposit{
        	{1042, 1900_00, at(9, 10)},
        	{2077, 300_00, at(10, 0)},
        	{1042, 1950_00, at(13, 40)},
        	{2077, 450_00, at(14, 5)},
        	{3150, 700_00, at(15, 30)},
        	{1042, 1800_00, at(18, 5)},
        	{2077, 250_00, at(20, 15)},
        	{3150, 600_00, at(21, 0)},
        	{3150, 400_00, at(22, 30)},
        }
      gate.go: |
        package main

        import "fmt"

        // State is where a customer is in onboarding. It decides what they may do with money.
        type State string

        const (
        	Pending    State = "pending"    // signed up, identity not verified yet
        	Verified   State = "verified"   // KYC passed
        	Restricted State = "restricted" // flagged: every money movement waits for a human
        )

        type Customer struct {
        	ID    int
        	State State
        }

        // Decision is one compliance outcome. Every one is kept: an auditor will ask why.
        type Decision struct {
        	Subject, Check, Outcome string
        }

        var trail []Decision
        var cases int

        func record(subject, check, outcome string) string {
        	trail = append(trail, Decision{subject, check, outcome})
        	return outcome
        }

        // openCase puts an item in the manual-review queue.
        func openCase() string {
        	cases++
        	return fmt.Sprintf("case C-%d", cases)
        }

        // gate decides a withdrawal: allow it, block it, or hold it for a human.
        func gate(c Customer, amount int64) string {
        	subject := fmt.Sprintf("withdraw %s by %d", cents(amount), c.ID)
        	switch c.State {
        	case Verified:
        		return record(subject, "kyc", "allow")
        	case Pending:
        		return record(subject, "kyc", "block, KYC not finished")
        	default:
        		return record(subject, "kyc", "hold, "+openCase())
        	}
        }

        // cents prints minor units as an amount with two decimals: cents(1234) is "12.34".
        func cents(n int64) string {
        	return fmt.Sprintf("%d.%02d", n/100, n%100)
        }
      main.go: |
        package main

        import "fmt"

        func main() {
        	for _, c := range customers {
        		fmt.Printf("withdraw 100.00 by %d (%s): %s\n", c.ID, c.State, gate(c, 100_00))
        	}

        	fmt.Println("trail:", len(trail), "decisions")
        }
      monitor.go: |
        package main

        import (
        	"fmt"
        	"strings"
        	"time"
        )

        // day is the window the structuring rule looks at.
        const day = 24 * time.Hour

        type Deposit struct {
        	User   int
        	Amount int64
        	At     time.Time
        }

        // under returns the user's deposits below the threshold made within window of their last one.
        func under(deps []Deposit, user int, threshold int64, window time.Duration) []Deposit {
        	var last time.Time
        	for _, d := range deps {
        		if d.User == user && d.At.After(last) {
        			last = d.At
        		}
        	}
        	var hits []Deposit
        	for _, d := range deps {
        		if d.User == user && d.Amount < threshold && last.Sub(d.At) < window {
        			hits = append(hits, d)
        		}
        	}
        	return hits
        }

        func sum(ds []Deposit) int64 {
        	var total int64
        	for _, d := range ds {
        		total += d.Amount
        	}
        	return total
        }

        // alert opens a case for a monitoring hit, with the deposits that caused it.
        func alert(rule string, user int, hits []Deposit) {
        	var parts []string
        	for _, d := range hits {
        		parts = append(parts, cents(d.Amount))
        	}
        	outcome := record(fmt.Sprintf("user %d", user), rule, openCase())
        	fmt.Printf("alert %s %d: %s = %s -> %s\n", rule, user, strings.Join(parts, " + "), cents(sum(hits)), outcome)
        }
      screen.go: |
        package main

        import (
        	"strings"
        	"unicode"
        )

        // listed is a toy list with placeholder names. Real screening runs against the published
        // sanctions lists and runs again whenever they change.
        var listed = []string{"EXAMPLE METALS LLC", "SAMPLE SHIPPING CO"}

        // normalize lower-cases a name, drops punctuation and collapses the spaces.
        func normalize(s string) string {
        	s = strings.Map(func(r rune) rune {
        		if unicode.IsLetter(r) || unicode.IsDigit(r) || unicode.IsSpace(r) {
        			return unicode.ToLower(r)
        		}
        		return -1
        	}, s)
        	return strings.Join(strings.Fields(s), " ")
        }

        // screen matches the normalized name exactly against the normalized list.
        func screen(name string) string {
        	for _, l := range listed {
        		if normalize(l) == normalize(name) {
        			return record(name, "sanctions", "match "+l+", "+openCase())
        		}
        	}
        	return record(name, "sanctions", "no match")
        }
