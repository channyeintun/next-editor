# Fintech Engineering, lesson 36: compliance for engineers (Burmese).
#
# Source: Fintech Engineering Handbook, Appendix A "Compliance & regulation" and Appendix B
# "Flow 1" (the compliance gate) (CC BY 4.0, Voytek Pitula).
# Start state: gate.go holds the customer states, the decision trail, the case queue and the
# withdrawal gate; monitor.go the deposit window helpers; screen.go a toy list with placeholder
# names and normalize/screen; data.go three customers and one day of deposits; main.go gates a
# withdrawal for each customer and prints the trail size.
# Edits, all insert-only (main.go):
#   1. a structuring rule: >= 3 deposits under the threshold in a day, summing over it -> run-2
#   2. screen two counterparty names                                                   -> run-3
# Runs: run-1 (allow, block, hold; trail 3), run-2 (one alert), run-3 (a match and a miss).
# Figures: kyc (states and what they allow; PEP, SoF/SoW, sanctions), gate (the gate in a money
# flow), rule (deposits under a threshold inside one day), travel (Travel Rule, VASP/CASP, MiCA), iv.
# Facts: B17 (Travel Rule), B18 (MiCA, VASP/CASP), B23 (sanctions lists), B24 (PEP).
# Built by ~/Documents/fintech-course-work/tools/build-lesson.ts; fixtures by sim-go.ts --write.
