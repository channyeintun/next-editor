scenes:
  - id: hook
    chapter: KYC နဲ့ customer state
    narration: >-
      ငွေ system တစ်ခုက ငွေကို မှန်မှန်ကန်ကန် ရွှေ့ရုံနဲ့ မလုံလောက်ပါဘူး၊ ဘယ်သူ့ငွေကို ဘယ်သူ့ဆီ
      ရွှေ့နေလဲ ဆိုတာကိုပါ သိရပါတယ်။ [[mark:sel-states]] KYC ဆိုတာ Know Your Customer ပါ၊ customer က
      တကယ် ဘယ်သူလဲ ဆိုတာကို စစ်ဆေးတာပါ။ စစ်ပြီး မပြီး ဆိုတာကို customer ရဲ့ state အဖြစ် သိမ်းထားပြီး၊
      ဒီ program မှာ pending၊ verified နဲ့ restricted ဆိုပြီး သုံးမျိုး ရှိပါတယ်။ [[mark:sel-gate]] gate
      function က withdrawal တစ်ခုကို state ကြည့်ပြီး ခွင့်ပြုမလား၊ ပိတ်မလား၊ case ဖွင့်ပြီး လူ့ဆီ
      လွှဲမလား ဆုံးဖြတ်ပါတယ်။ [[mark:sel-record]] ဘယ်လို ဆုံးဖြတ်ဆုံးဖြတ်၊ ဆုံးဖြတ်ချက် တိုင်းကို trail ထဲ
      ထည့်ပါတယ်။ customer သုံးယောက်စလုံး ယူရို တစ်ရာစီ ထုတ်ချင်တယ် ဆိုပါစို့။ [[mark:run-1]] run
      လိုက်ရအောင်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Compliance & regulation (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#compliance-regulation",
        }
    actions:
      - { id: open-gate, type: workspace.openFile, at: { scene: start }, path: gate.go }
      - id: sel-states
        type: editor.select
        at: { mark: sel-states }
        target: { file: gate.go, text: "type State string", occurrence: 1 }
      - id: sel-gate
        type: editor.select
        at: { mark: sel-gate }
        target: { file: gate.go, text: "switch c.State {", occurrence: 1 }
      - id: sel-record
        type: editor.select
        at: { mark: sel-record }
        target:
          {
            file: gate.go,
            text: "trail = append(trail, Decision{subject, check, outcome})",
            occurrence: 1,
          }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "trail: 3 decisions",
          timeoutMs: 8000,
        }

  - id: read-1
    narration: >-
      [[mark:pt-allow]] verified ဖြစ်တဲ့ customer က ထုတ်ခွင့် ရပါတယ်။ [[mark:pt-block]] pending
      customer ကိုတော့ KYC မပြီးသေးလို့ ပိတ်ပါတယ်။ [[mark:pt-hold]] restricted customer ရဲ့ withdrawal ကို
      ငြင်းတာ မဟုတ်ဘဲ hold လုပ်ပြီး manual review အတွက် case တစ်ခု ဖွင့်ပါတယ်။ [[mark:pt-trail]] ရလဒ်
      သုံးမျိုးလုံး trail ထဲ ရောက်ပါတယ်။ [[mark:dock-1]] ခွင့်ပြုခဲ့တဲ့ ဆုံးဖြတ်ချက်ကိုပါ သိမ်းရတာက၊ နောက်မှ
      auditor ဒါမှမဟုတ် regulator က ဒီ withdrawal ကို ဘာ check တွေနဲ့ ခွင့်ပြုခဲ့လဲ မေးရင် ဖြေနိုင်ဖို့ပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Audits and audit trails (Voytek Pitula, CC BY 4.0)",
