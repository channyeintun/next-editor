      - { id: pt-sanc, type: slide.point, at: { mark: pt-sanc }, target: { x: 0.806, y: 0.864 } }

  - id: gate
    chapter: Compliance gate
    narration: >-
      [[mark:show-gate]] engineering ဘက်က ကြည့်ရင် compliance က money flow ထဲက gate တစ်ခုပါ။
      [[mark:pt-when]] onboarding မှာ တစ်ခါ စစ်ရုံ မဟုတ်ဘဲ transaction တွေမှာလည်း ထပ်စစ်ပါတယ်။ [[mark:gate-2]]
      gate ရဲ့ ရလဒ် သုံးမျိုး ရှိပါတယ်၊ ခွင့်ပြုတာ၊ ပိတ်တာ၊ ငွေကို hold လုပ်ပြီး case queue ထဲ ထည့်တာပါ။
      [[mark:pt-hold2]] case queue ဆိုတာ compliance analyst တွေ တစ်ခုချင်း ကြည့်ဆုံးဖြတ်တဲ့ manual review
      တန်းစီပါ။ [[mark:gate-3]] manual review က ရက်ပိုင်း ကြာနိုင်လို့ flow က gate မှာ ရက်ချီ စောင့်နိုင်ရပါမယ်၊ ဒါကို နောက် lesson ရဲ့
      withdrawal flow ထဲမှာ အသေးစိတ် ကြည့်ပါမယ်။
      [[mark:pt-trail2]] pass ဖြစ်ဖြစ်၊ block ဖြစ်ဖြစ်၊ ဘယ်သူ override လုပ်ခဲ့လဲ ဆိုတာပါ audit trail ထဲ
      ရောက်ရပါတယ်။
    sources:
