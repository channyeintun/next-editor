  - id: kyc
    narration: >-
      [[mark:show-kyc]] state တွေကို lifecycle အဖြစ် ကြည့်ရအောင်။ [[mark:pt-pend]] pending customer က
      sign up လုပ်လို့ ရပေမဲ့ ငွေ ထုတ်လို့ မရပါဘူး။ KYC အောင်မှ verified ဖြစ်ပါတယ်။ [[mark:pt-res]] alert
      တစ်ခု ဒါမှမဟုတ် list hit တစ်ခုကြောင့် restricted ဖြစ်သွားပြီး၊ case ပိတ်မှ ပြန်လာပါတယ်။ ဒါကြောင့်
      customer state ဆိုတာ profile ထဲက flag တစ်ခု မဟုတ်ဘဲ၊ ငွေရွှေ့တဲ့ code path တိုင်းက စစ်ရမယ့် state
      machine ပါ။ [[mark:kyc-2]] verified ဖြစ်တာနဲ့ risk နည်းတယ်လို့ မဆိုလိုပါဘူး။ [[mark:pt-pep]] PEP ဆိုတာ politically exposed person ပါ။ FATF ရဲ့ အဓိပ္ပာယ်အရ ထင်ရှားတဲ့ public function ကို ထမ်းဆောင်နေတဲ့ ဒါမှမဟုတ် ထမ်းဆောင်ခဲ့တဲ့ လူဖြစ်ပြီး၊ အလယ်အလတ်နဲ့ အောက်ပိုင်း အရာရှိတွေ မပါပါဘူး။ PEP ကို ငြင်းရမယ်လို့ မဆိုလိုဘဲ risk ပိုမြင့်လို့ ပိုနက်တဲ့
      စစ်ဆေးမှု လိုတာပါ။ [[mark:pt-sof]] source of funds နဲ့ source of wealth ကတော့ ငွေ ဘယ်က လာလဲ ဆိုတဲ့ သက်သေ document တွေပါ။ [[mark:pt-sanc]] sanctions
      screening ကတော့ customer နဲ့ payment တွေကို sanction list တွေနဲ့ တိုက်စစ်တာပါ။ US Treasury ရဲ့
      OFAC က SDN list ကို ထုတ်ပြီး၊ list ထဲက လူတွေရဲ့ US jurisdiction ထဲက ပိုင်ဆိုင်မှုကို block လုပ်ပါတယ်။
      EU ကလည်း financial sanctions ရဲ့ consolidated list ကို ထုတ်ပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Compliance & regulation (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#compliance-regulation",
        }
      - {
          title: "FATF Guidance — Politically Exposed Persons (Recommendations 12 and 22), June 2013",
          url: "https://cbos.gov.sd/sites/default/files/guidance-pep-rec12-22.pdf",
        }
      - {
          title: "OFAC — Specially Designated Nationals and Blocked Persons List (SDN)",
          url: "https://ofac.treasury.gov/specially-designated-nationals-and-blocked-persons-list-sdn-human-readable-lists",
        }
    actions:
      - { id: show-kyc, type: slide.show, at: { mark: show-kyc, offsetMs: -700 }, slideId: kyc-1 }
      - { id: pt-pend, type: slide.point, at: { mark: pt-pend }, target: { x: 0.172, y: 0.442 } }
