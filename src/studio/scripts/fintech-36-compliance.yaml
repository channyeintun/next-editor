  - id: try-it
    chapter: ကိုယ်တိုင် စမ်းကြည့်ပါ
    narration: >-
      [[mark:close-iv]] ကိုယ်တိုင် စမ်းကြည့်ဖို့ တစ်ခု ရှိပါတယ်။ [[mark:sel-try]] threshold ကို ယူရို
      ကိုးရာ လို့ လျှော့ပြီး run ကြည့်ပါ။ alert နှစ်ခု ထွက်လာပြီး နှစ်ခုလုံးက ပမာဏ သေးသေးလေးတွေ ပို့တဲ့ customer တွေပါ။ user ၁၀၄၂ ကတော့ deposit တွေက ကိုးရာထက် ကြီးနေလို့ alert မဖြစ်တော့ပါဘူး။  [[mark:recap]] ပြန်ချုပ်ရရင်၊ engineer အတွက် compliance ဆိုတာ ငွေ ရွှေ့တဲ့ လမ်းပေါ်က gate တွေဖြစ်ပြီး၊ ဆုံးဖြတ်ချက် တိုင်း
      trail ထဲ ရောက်ရပါတယ်။ နောက် lesson ကစပြီး course တစ်ခုလုံးက
      pattern တွေကို end-to-end flow သုံးခုထဲမှာ ပေါင်းကြည့်ပါမယ်၊ ပထမဆုံးက crypto withdrawal ပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Compliance & regulation (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#compliance-regulation",
