      - {
          id: pt-win,
          type: slide.point,
          at: { afterAction: rule-2 },
          target: { x: 0.434, y: 0.866 },
        }
      - { id: rule-3, type: slide.show, at: { mark: rule-3 }, slideId: rule-3 }
      - {
          id: pt-al,
          type: slide.point,
          at: { afterAction: rule-3 },
          target: { x: 0.813, y: 0.531 },
        }

  - id: monitor
    narration: >-
      [[mark:close-rule]] ဒီ rule ကို code နဲ့ ရေးကြည့်ရအောင်။ [[mark:open-data]] deposit data ကို အရင်
      ကြည့်ပါမယ်။ [[mark:sel-deps]] ဒီနေ့အတွက် customer သုံးယောက်ရဲ့ deposit တွေပါ၊ တစ်ခုချင်းစီမှာ
      အချိန် ပါပါတယ်။ [[mark:open-main]] rule ကို main ထဲမှာ ထည့်ပါမယ်။ [[mark:type-rule]] customer
      တစ်ယောက်ချင်းအတွက် threshold အောက်က deposit တွေကို တစ်ရက်အတွင်း စုပါတယ်။ သုံးခုနဲ့ အထက် ရှိပြီး
      ပေါင်းလဒ်က threshold ကို ကျော်ရင် alert ပေးပါတယ်။ threshold က ဥပမာ တန်ဖိုးပါ။ ဘယ် customer alert
      ဖြစ်မလဲ ခန့်မှန်းကြည့်ပါ။ [[mark:run-2]] run လိုက်ရအောင်။ [[mark:pt-alert]] user ၁၀၄၂ တစ်ယောက်ပဲ alert
      ဖြစ်ပါတယ်။ alert ထဲမှာ အကြောင်းရင်း deposit သုံးခု ပါလို့ analyst က ဘာကြောင့်လဲ ချက်ချင်း မြင်ရပါတယ်။ [[mark:pt-trail3]] alert ကိုယ်တိုင်ကလည်း ဆုံးဖြတ်ချက်
      တစ်ခုမို့ trail ထဲ ရောက်ပါတယ်။ [[mark:dock-2]] ဒီ rule က ledger ထဲက event တွေပေါ်မှာ run ရပါတယ်၊ app
      log ပေါ်မှာ run ရင် ပျောက်တဲ့ log တစ်ကြောင်းက လွတ်သွားတဲ့ alert တစ်ခု ဖြစ်သွားလို့ပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Compliance & regulation (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#compliance-regulation",
        }
      - { title: "Go package time — Duration", url: "https://pkg.go.dev/time#Duration" }
    actions:
      - { id: close-rule, type: slide.close, at: { mark: close-rule } }
      - { id: open-data, type: workspace.openFile, at: { mark: open-data }, path: data.go }
      - id: sel-deps
        type: editor.select
        at: { mark: sel-deps }
        target: { file: data.go, text: "var deposits = []Deposit{", occurrence: 1 }
      - { id: open-main, type: workspace.openFile, at: { mark: open-main }, path: main.go }
      - id: type-rule
        type: editor.type
        at: { mark: type-rule }
        target: { file: main.go, after: "gate(c, 100_00))\n\t}\n", occurrence: 1 }
        text: "\n\tconst threshold = 2000_00 // an example value, not a legal one\n\tfor _, user := range []int{1042, 2077, 3150} {\n\t\thits := under(deposits, user, threshold, day)\n\t\tif len(hits) >= 3 && sum(hits) >= threshold {\n\t\t\talert(\"structuring\", user, hits)\n\t\t}\n\t}\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "alert structuring 1042",
          timeoutMs: 8000,
        }
      - id: pt-alert
        type: console.point
        at: { mark: pt-alert }
        target: { text: "alert structuring 1042", occurrence: 1 }
      - id: pt-trail3
        type: console.point
        at: { mark: pt-trail3 }
        target: { text: "trail: 4 decisions", occurrence: 1 }
      - { id: dock-2, type: runtime.collapseDock, at: { mark: dock-2 } }

  - id: screen
    chapter: Sanctions screening နဲ့ false positive
    narration: >-
      [[mark:open-screen]] sanctions screening ကို code နဲ့ ကြည့်ရအောင်။ [[mark:sel-listed]] ဒီ list က
      placeholder company နာမည် နှစ်ခုပါတဲ့ ဥပမာ list ပါ။ [[mark:sel-norm]] နာမည်ကို တိုက်မစစ်ခင် normalize
      လုပ်ပါတယ်၊ စာလုံးအသေး ပြောင်းတာ၊ punctuation ဖြုတ်တာ၊ space တွေ စုတာပါ။ ပြီးမှ တစ်လုံးမကျန် ကိုက်မှ
      match လို့ ယူပါတယ်။ [[mark:open-main3]] payment ရဲ့ counterparty နာမည် နှစ်ခုကို screen လုပ်ကြည့်ပါမယ်။
      [[mark:type-screen]] ပထမ နာမည်က list ထဲက နာမည်ကို punctuation တွေ ထည့်ရေးထားတာပါ။ ဒုတိယ နာမည်က
      စာလုံး နှစ်လုံး နေရာလဲ ရေးထားတာပါ။ [[mark:run-3]] run လိုက်ရအောင်။ [[mark:pt-match]] ပထမ နာမည်က
      normalize လုပ်ပြီးနောက် ကိုက်သွားလို့ case ဖွင့်ပါတယ်။ [[mark:pt-miss]] ဒုတိယ နာမည်ကတော့ no match ပါ။
      လူတစ်ယောက် ကြည့်ရင် ချက်ချင်း သိမယ့် typo ကို exact match က လွတ်သွားပါတယ်။ fuzzy
      matching ကို သုံးရင် ဒီ typo ကို မိပေမဲ့ နာမည်ဆင်တူတဲ့ ပုံမှန် company တွေပါ alert ဖြစ်လာပါတယ်။
      false positive ဆိုတာ ဒါပါ။ alert တိုင်းက case တစ်ခု၊ case တိုင်းက analyst ရဲ့ အချိန်နဲ့ hold ခံထားရတဲ့
      user တစ်ယောက် ဖြစ်လို့ compliance ရဲ့ နေ့စဉ် ကုန်ကျစရိတ်ပါ။ [[mark:dock-3b]] ဘယ်လောက် ဆင်တူမှ match ယူမလဲ ဆိုတာကို
      engineer တစ်ယောက်တည်း မဆုံးဖြတ်ဘဲ compliance team နဲ့ ချိန်ရပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Compliance & regulation: sanctions screening (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#compliance-regulation",
        }
      - {
          title: "OFAC Sanctions List Service — SDN list",
          url: "https://sanctionslist.ofac.treas.gov/Home/SdnList",
        }
    actions:
      - { id: open-screen, type: workspace.openFile, at: { mark: open-screen }, path: screen.go }
      - id: sel-listed
        type: editor.select
        at: { mark: sel-listed }
        target:
          {
            file: screen.go,
            text: 'var listed = []string{"EXAMPLE METALS LLC", "SAMPLE SHIPPING CO"}',
            occurrence: 1,
          }
      - id: sel-norm
        type: editor.select
        at: { mark: sel-norm }
        target: { file: screen.go, text: "func normalize(s string) string {", occurrence: 1 }
      - { id: open-main3, type: workspace.openFile, at: { mark: open-main3 }, path: main.go }
      - id: type-screen
        type: editor.type
        at: { mark: type-screen }
        target:
          {
            file: main.go,
            after: "alert(\"structuring\", user, hits)\n\t\t}\n\t}\n",
            occurrence: 1,
          }
        text: "\n\tfor _, name := range []string{\"Example Metals, L.L.C.\", \"Exampel Metals LLC\"} {\n\t\tfmt.Printf(\"screen %q: %s\\n\", name, screen(name))\n\t}\n"
        cadence: line-by-line
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "no match",
          timeoutMs: 8000,
        }
      - id: pt-match
        type: console.point
        at: { mark: pt-match }
        target: { text: "match EXAMPLE METALS LLC", occurrence: 1 }
      - id: pt-miss
        type: console.point
        at: { mark: pt-miss }
        target: { text: "no match", occurrence: 1 }
      - { id: dock-3, type: runtime.collapseDock, at: { mark: dock-3b } }
      - {
          id: expect-file-rule,
          type: expect.file,
          at: { afterAction: run-3 },
          path: main.go,
          contains: "if len(hits) >= 3 && sum(hits) >= threshold {",
        }

  - id: travel
    chapter: Travel Rule နဲ့ MiCA
    narration: >-
      [[mark:show-travel]] crypto transfer တွေအတွက် နောက်ထပ် စည်းမျဉ်း တစ်ခု ရှိပါတယ်။ [[mark:pt-a]] VASP
      ဆိုတာ virtual asset service provider ပါ။ FATF က သုံးတဲ့ term ဖြစ်ပြီး၊ သူတစ်ပါးအတွက် virtual asset ကို
      လဲပေး၊ လွှဲပေး ဒါမှမဟုတ် ထိန်းပေးတဲ့ business ပါ။ [[mark:travel-2]] FATF ရဲ့ standard က VASP တွေကို
      transfer နဲ့အတူ ပို့သူနဲ့ လက်ခံသူ အချက်အလက်ကို ရယူ၊ သိမ်းဆည်းပြီး ပို့ပေးဖို့ တောင်းဆိုထားပါတယ်။ ဒါကို
      Travel Rule လို့ ခေါ်ပါတယ်။ engineering အတွက် ဆိုလိုတာက transfer တစ်ခုမှာ ငွေနဲ့ အချက်အလက် ဆိုပြီး
      message နှစ်ခု ပါလာတာပါ။ [[mark:travel-3]] threshold က နေရာအလိုက် ကွာပါတယ်။ [[mark:pt-fatf]] FATF
      က နိုင်ငံတွေကို ဒေါ်လာ ဒါမှမဟုတ် ယူရို တစ်ထောင်အောက် transfer တွေကို ကင်းလွတ်ခွင့် ပေးနိုင်အောင်
      ခွင့်ပြုထားပါတယ်။ [[mark:pt-us]] US မှာ ဒေါ်လာ သုံးထောင်နဲ့ အထက် funds transfer တွေမှာ ဘဏ်ရော ဘဏ်
      မဟုတ်တဲ့ financial institution တွေမှာပါ သက်ရောက်ပါတယ်။ [[mark:pt-eu]] EU မှာတော့ ၂၀၂၄ ဒီဇင်ဘာ ၃၀
      ကစပြီး crypto-asset service provider တွေကြားမှာ အနည်းဆုံး ပမာဏ မရှိပါဘူး။ [[mark:pt-mica]] အဲဒီ provider ကို EU ရဲ့ Markets in Crypto-Assets regulation၊ အတိုကောက် MiCA က CASP လို့ ခေါ်ပြီး၊
      ခွင့်ပြုချက် ရထားတဲ့ firm ကို ဆိုလိုပါတယ်။ VASP က FATF ရဲ့ အမျိုးအစား၊ CASP က EU licence status ဖြစ်လို့ တူတဲ့ term မဟုတ်ပါဘူး။ ဘယ် rule၊ ဘယ်
      threshold က ကိုယ့် business အပေါ် သက်ရောက်လဲ ဆိုတာကို compliance နဲ့ legal team က ဆုံးဖြတ်ပြီး၊ engineer က အဲဒါကို config အဖြစ် ပြောင်းလို့ရတဲ့ system ကို ဆောက်ပေးတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Compliance & regulation: Travel Rule, VASP, MiCA (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#compliance-regulation",
        }
      - {
          title: "FinCEN — Funds Travel Regulations: Questions & Answers",
          url: "https://www.fincen.gov/resources/statutes-regulations/guidance/funds-travel-regulations-questions-answers",
        }
      - {
          title: "ESMA — Markets in Crypto-Assets Regulation (MiCA)",
          url: "https://www.esma.europa.eu/esmas-activities/digital-finance-and-innovation/markets-crypto-assets-regulation-mica",
        }
    actions:
      - {
          id: show-travel,
          type: slide.show,
          at: { mark: show-travel, offsetMs: -700 },
          slideId: travel-1,
        }
      - { id: pt-a, type: slide.point, at: { mark: pt-a }, target: { x: 0.181, y: 0.42 } }
      - { id: travel-2, type: slide.show, at: { mark: travel-2 }, slideId: travel-2 }
      - {
          id: pt-b,
          type: slide.point,
          at: { afterAction: travel-2 },
          target: { x: 0.819, y: 0.42 },
        }
      - { id: travel-3, type: slide.show, at: { mark: travel-3 }, slideId: travel-3 }
      - { id: pt-fatf, type: slide.point, at: { mark: pt-fatf }, target: { x: 0.131, y: 0.609 } }
      - { id: pt-us, type: slide.point, at: { mark: pt-us }, target: { x: 0.131, y: 0.678 } }
      - { id: pt-eu, type: slide.point, at: { mark: pt-eu }, target: { x: 0.131, y: 0.747 } }
      - { id: pt-mica, type: slide.point, at: { mark: pt-mica }, target: { x: 0.378, y: 0.909 } }

  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] Fintech interview တွေမှာ transaction monitoring rule တစ်ခုကို ဘယ်လို ဒီဇိုင်းဆွဲမလဲ၊
      false positive ကို ဘယ်လို ကိုင်တွယ်မလဲ လို့ မေးတတ်ပါတယ်။ [[mark:iv-a]] ပထမ၊ rule ဆိုတာ pattern၊ window နဲ့ threshold ပါ၊ version ပါတဲ့ config အဖြစ် ထားပြီး ledger event တွေပေါ်မှာ run ပါတယ်။ alert မှာ အကြောင်းရင်း transaction တွေ ပါရပါတယ်။ [[mark:iv-b]] ဒုတိယ၊ alert က case queue ထဲ ဝင်ပါတယ်။ ငွေကို hold လုပ်ထားတုန်း လူက ဆုံးဖြတ်ပြီး၊ ဆုံးဖြတ်ချက်ကော rule
      version ကော audit trail ထဲ ရောက်ပါတယ်။ [[mark:iv-c]] တတိယ၊ false positive က နေ့စဉ် ကုန်ကျစရိတ်ဖြစ်ပြီး၊ threshold ကို
      ပြောင်းရင် alert အရေအတွက်သာမက ဘယ်သူ alert ဖြစ်လဲပါ ပြောင်းပါတယ်။ [[mark:iv-d]] ပြီးရင် ကိုယ် ဘာလုပ်မလဲ
      ပြောပါ။ rule အသစ်ကို history ပေါ်မှာ back-test လုပ်ပြီးမှ deploy လုပ်မယ်၊ alert rate နဲ့ case
      ရလဒ်ကို တိုင်းပြီး compliance team နဲ့ အတူ tune လုပ်မယ် ဆိုတာပါ။
    sources:
