# Rust from zero, lesson 2: variables. let binds a name to a value and is
# immutable by default (the E0384 error and the reason behind it are drawn on
# the whiteboard, since an insert-only lesson can't run broken code); mut opts
# in to change; shadowing makes a new variable with the same name, even with
# a new type (contrasted with mut on a second board); const needs an upper-case
# name and a type; and a let can carry a type annotation instead of relying on
# inference. One run at the end.
#
# Every error quoted in the narration or on the board (E0384 and its help
# line, E0308, "missing type for `const` item", and the non_upper_case_globals
# warning for a lower-case const name) was confirmed with
# rustc 1.98 --edition 2024. The fixture is the exact output of the final
# program, which compiles with no warnings.
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/rust-variables.yaml
