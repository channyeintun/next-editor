build:
  voiceProfile: pocket-alba-v1
  seed: 31

runtime:
  kind: rust-playground
  defaultMode: fixture
  fixture:
    latencyMs: 600
    result:
      status: success
      stdout: "lives: 3\nscore: 250 of 1000\nspaces: 4\n"
      stderr: ""

scenes:
  - id: let-binding
    chapter: "let: immutable by default"
    narration: >
      [[mark:open-main]] Here's a small Rust program with one variable.
      [[mark:select-let]] You make a variable with let. This line binds the
      name lives to the value three. Notice there's no type written here. Rust
      looks at the three and picks the type for you. That's called type
      inference.
    sources:
      - title: "The Rust Book — Variables and Mutability"
        url: "https://doc.rust-lang.org/book/ch03-01-variables-and-mutability.html"
      - title: "The Rust Reference — let statements"
        url: "https://doc.rust-lang.org/reference/statements.html#let-statements"
    actions:
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: main.rs
      - id: select-let
        type: editor.select
        at: { mark: select-let }
        target:
          file: main.rs
          text: "let lives = 3;"
          occurrence: 1

  - id: immutable
    narration: >
      [[mark:board-title]] So what does let really make?
      [[mark:draw-binding]] Think of the name lives pointing at a box that
      holds three. [[mark:draw-stays]] By default, a variable is immutable. Once
      lives is three, it stays three. [[mark:draw-broken]] So what happens if
      you add a line that assigns two to lives? [[mark:draw-error]] The
      program doesn't compile. You get error E0384, and the message says you
      can't assign twice to an immutable variable. [[mark:why]] Why is this the
      default? Say one part of your code expects lives to stay three, and
      another part changes it. That kind of bug is hard to find.
      [[mark:draw-trust]] When values can't change, you can read a line and
      trust what it says, because the compiler checks it for you.
      [[mark:draw-help]] And look at the help line. The compiler tells you how
      to allow the change: make the binding mutable.
    sources:
      - title: "The Rust Book — Variables and Mutability"
        url: "https://doc.rust-lang.org/book/ch03-01-variables-and-mutability.html"
      - title: "Rust error codes — E0384"
        url: "https://doc.rust-lang.org/error_codes/E0384.html"
    actions:
      - id: board1-open
        type: whiteboard.apply
        at: { mark: board-title }
        open: true
        upsertIds: [b1-title]
      - id: draw-binding
        type: whiteboard.apply
        at: { mark: draw-binding }
        upsertIds: [b1-code, b1-name, b1-arrow, b1-box, b1-value]
        drawMs: 2200
      - id: draw-stays
        type: whiteboard.apply
        at: { mark: draw-stays }
        upsertIds: [b1-stays]
        drawMs: 900
      - id: draw-broken
        type: whiteboard.apply
        at: { mark: draw-broken }
        upsertIds: [b1-broken, b1-strike]
        drawMs: 1200
      - id: draw-error
        type: whiteboard.apply
        at: { mark: draw-error }
        upsertIds: [b1-err1, b1-err2]
        drawMs: 1800
      - id: draw-trust
        type: whiteboard.apply
        at: { mark: draw-trust }
        upsertIds: [b1-trust]
        drawMs: 900
      - id: draw-help
        type: whiteboard.apply
        at: { mark: draw-help }
        upsertIds: [b1-help]
        drawMs: 1200

  - id: mut
    chapter: Changing a value with mut
    narration: >
      [[mark:type-mut]] Let's add a score, which does need to change.
      [[mark:select-mut]] The mut keyword makes this binding mutable. Score
      starts at zero, and the plus-equals line adds two hundred fifty to it.
      mut is also a note to anyone reading your code: this value is going to
      change. Take mut away, and the plus-equals line gets the same E0384
      error.
    sources:
      - title: "The Rust Book — Variables and Mutability"
        url: "https://doc.rust-lang.org/book/ch03-01-variables-and-mutability.html"
      - title: "The Rust Reference — Compound assignment expressions"
        url: "https://doc.rust-lang.org/reference/expressions/operator-expr.html#compound-assignment-expressions"
    actions:
      - id: close-board1
        type: whiteboard.apply
        at: { scene: start, offsetMs: -600 }
        open: false
      - id: type-mut
        type: editor.type
        at: { mark: type-mut }
        target:
          file: main.rs
          after: "    println!(\"lives: {lives}\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n    let mut score = 0;\n    score += 250;\n    println!(\"score: {score}\");\n"
      - id: select-mut
        type: editor.select
        at: { mark: select-mut }
        target:
          file: main.rs
          text: "mut"
          occurrence: 1

  - id: shadow-board
    chapter: Shadowing
    narration: >
      [[mark:board2]] There's a second way to reuse a name, and it's called
      shadowing. Let's compare it with mut. [[mark:draw-mut]] With mut,
      there's one variable. You put a new value in the same box, and it has to
      be the same type. [[mark:draw-shadow1]] With shadowing, you start with a
      variable, like spaces, that holds some text. [[mark:draw-shadow2]] Then
      you write let again, with the same name. That makes a brand-new
      variable, in a new box. From that line on, the old one is hidden.
      [[mark:draw-shadow-type]] And since it's a new variable, it can even
      have a different type. Here, it's a number.
    sources:
      - title: "The Rust Book — Shadowing"
        url: "https://doc.rust-lang.org/book/ch03-01-variables-and-mutability.html#shadowing"
    actions:
      - id: board2-open
        type: whiteboard.apply
        at: { mark: board2 }
        open: true
        clear: true
        upsertIds: [b2-title]
      - id: draw-mut
        type: whiteboard.apply
        at: { mark: draw-mut }
        upsertIds:
          [
            b2-mut-code,
            b2-mut-arrow,
            b2-mut-box,
            b2-mut-old,
            b2-mut-strike,
            b2-mut-new,
            b2-mut-note,
          ]
        drawMs: 2800
      - id: draw-shadow1
        type: whiteboard.apply
        at: { mark: draw-shadow1 }
        upsertIds: [b2-sh-code1, b2-sh-arrow1, b2-sh-box1, b2-sh-val1]
        drawMs: 1600
      - id: draw-shadow2
        type: whiteboard.apply
        at: { mark: draw-shadow2 }
        upsertIds: [b2-sh-code2, b2-sh-arrow2, b2-sh-box2, b2-sh-val2, b2-sh-hidden]
        drawMs: 2200
      - id: draw-shadow-type
        type: whiteboard.apply
        at: { mark: draw-shadow-type }
        upsertIds: [b2-sh-note1, b2-sh-note2]
        drawMs: 1000

  - id: shadow-code
    narration: >
      [[mark:type-shadow]] Let's try it. spaces starts as text, four spaces
      between quotes. [[mark:select-shadow]] Then the second let takes its
      length, which is a number, and keeps the name spaces. You don't need a
      second name, like space count. If spaces were mut instead, assigning
      the length to it would fail with error E0308, mismatched types.
    sources:
      - title: "The Rust Book — Shadowing"
        url: "https://doc.rust-lang.org/book/ch03-01-variables-and-mutability.html#shadowing"
      - title: "Rust error codes — E0308"
        url: "https://doc.rust-lang.org/error_codes/E0308.html"
      - title: "std — str::len"
        url: "https://doc.rust-lang.org/std/primitive.str.html#method.len"
    actions:
      - id: close-board2
        type: whiteboard.apply
        at: { scene: start, offsetMs: -600 }
        open: false
      - id: type-shadow
        type: editor.type
        at: { mark: type-shadow }
        target:
          file: main.rs
          after: "    println!(\"score: {score}\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n    let spaces = \"    \";\n    let spaces = spaces.len();\n    println!(\"spaces: {spaces}\");\n"
      - id: select-shadow
        type: editor.select
        at: { mark: select-shadow }
        target:
          file: main.rs
          text: "let spaces = spaces.len();"
          occurrence: 1

  - id: constants
    chapter: Constants and type annotations
    narration: >
      [[mark:type-const]] Some values are fixed for the whole program, like a
      top score. For those, Rust has const. You can put it outside any
      function, so all of your code can use it. [[mark:select-const]] A
      constant's name is upper case, with underscores between words. The
      compiler warns you if it isn't. And the type is required. Here it's u32,
      an unsigned 32-bit integer, so it can't be negative. Leave the type out,
      and the compiler stops with the error: missing type for const item. A
      const can't be mut, and its value must be known when the program
      compiles.
    sources:
      - title: "The Rust Book — Constants"
        url: "https://doc.rust-lang.org/book/ch03-01-variables-and-mutability.html#constants"
      - title: "The Rust Reference — Constant items"
        url: "https://doc.rust-lang.org/reference/items/constant-items.html"
      - title: "rustc lints — non_upper_case_globals"
        url: "https://doc.rust-lang.org/rustc/lints/listing/warn-by-default.html#non-upper-case-globals"
    actions:
      - id: type-const
        type: editor.type
        at: { mark: type-const }
        target:
          file: main.rs
          after: ""
          occurrence: 1
        cadence: fast-explainer
        text: "const MAX_SCORE: u32 = 1000;\n\n"
      - id: select-const
        type: editor.select
        at: { mark: select-const }
        target:
          file: main.rs
          text: "MAX_SCORE: u32"
          occurrence: 1

  - id: annotate
    narration: >
      [[mark:select-score]] A let can have its type written out too. Rust
      picked i32 for score, the default for whole numbers. But a score never
      goes below zero. [[mark:type-annotation]] So let's write u32, after a
      colon. That's a type annotation. [[mark:type-max]] Now let's print the
      score next to the constant.
    sources:
      - title: "The Rust Book — Data Types"
        url: "https://doc.rust-lang.org/book/ch03-02-data-types.html"
      - title: "The Rust Reference — Type inference"
        url: "https://doc.rust-lang.org/reference/type-inference.html"
    actions:
      - id: select-score
        type: editor.select
        at: { mark: select-score }
        target:
          file: main.rs
          text: "let mut score = 0;"
          occurrence: 1
      - id: type-annotation
        type: editor.type
        at: { mark: type-annotation }
        target:
          file: main.rs
          after: "    let mut score"
          occurrence: 1
        cadence: natural
        text: ": u32"
      - id: type-max
        type: editor.type
        at: { mark: type-max }
        target:
          file: main.rs
          after: '    println!("score: {score}'
          occurrence: 1
        cadence: natural
        text: " of {MAX_SCORE}"

  - id: run
    narration: >
      [[mark:run]] Let's run it. [[mark:read-output]] Lives is three. The
      score is two hundred fifty, out of a thousand. And spaces is now the
      number four, not the text.
    sources:
      - title: "Rust Playground"
        url: "https://play.rust-lang.org/"
    actions:
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "score: 250 of 1000"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: "let spaces = spaces.len();"

  - id: wrap
    narration: >
      So, let makes a variable that can't change, unless you add mut.
      Shadowing makes a new variable with the same name, and const is a fixed
      value with a type. Next, we'll look at Rust's data types, like the i32
      and u32 you met here.
    sources:
      - title: "The Rust Book — Variables and Mutability"
        url: "https://doc.rust-lang.org/book/ch03-01-variables-and-mutability.html"
    actions: []

checks:
  - { type: timing.p95Ms, max: 300 }
