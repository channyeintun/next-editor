build:
  voiceProfile:
    # Studio replaces this built-in profile with the selected Burmese VoxCPM2
    # profile at render time when the signed-in user has the D1 capability.
    pocket-alba-v1
  seed: 31

runtime:
  kind: rust-playground
  defaultMode: fixture
  fixture:
    latencyMs: 600
    result:
      status: success
      stdout: "lives: 3

        score: 250 of 1000

        spaces: 4\n"
      stderr: ""

scenes:
  - id: let-binding
    chapter: "let: default က immutable"
    narration: >-
      [[mark:open-main]] ဒီမှာ variable တစ်ခုပဲ ပါတဲ့ Rust program သေးသေးလေး တစ်ခု ရှိပါတယ်။
      [[mark:select-let]] Rust မှာ variable တစ်ခု လုပ်ချင်ရင် let ကို သုံးရပါတယ်။ ဒီ စာကြောင်းမှာ
      let က lives ဆိုတဲ့ နာမည်ကို 3 ဆိုတဲ့ တန်ဖိုးနဲ့ ချိတ်ပေးလိုက်တာပါ။ type ကို ဘယ်နေရာမှာမှ
      မရေးထားတာ သတိထား ကြည့်ပါ။ Rust က 3 ကို ကြည့်ပြီး type ကို ကိုယ့်အစား ရွေးပေးလိုက်တာ ဖြစ်ပြီး၊
      ဒါကို type inference လို့ ခေါ်ပါတယ်။
    sources:
      - title: "The Rust Book — Variables and Mutability"
        url: "https://doc.rust-lang.org/book/ch03-01-variables-and-mutability.html"
      - title: "The Rust Reference — let statements"
        url: "https://doc.rust-lang.org/reference/statements.html#let-statements"
    actions:
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: main.rs
      - id: select-let
        type: editor.select
        at: { mark: select-let }
        target:
          file: main.rs
          text: "let lives = 3;"
          occurrence: 1

  - id: immutable
    narration: >-
      [[mark:board-title]] ဒါဆို let က တကယ်တမ်း ဘာကို လုပ်ပေးလိုက်တာလဲ ဆိုတာ whiteboard ပေါ်မှာ
      ကြည့်ရအောင်။ [[mark:draw-binding]] lives ဆိုတဲ့ နာမည်က 3 ကို ထည့်ထားတဲ့ အကွက် တစ်ခုကို
      ညွှန်နေတယ်လို့ စဉ်းစားကြည့်ပါ။ [[mark:draw-stays]] Rust မှာ variable တစ်ခုက default အားဖြင့်
      immutable ဖြစ်ပါတယ်၊ ဆိုလိုတာက ပြောင်းလို့ မရပါဘူး။ lives က 3 ဖြစ်သွားပြီဆိုရင် 3 အတိုင်းပဲ
      ဆက်နေမှာပါ။ [[mark:draw-broken]] ဒါဆို lives ထဲကို 2 ထည့်တဲ့ စာကြောင်း တစ်ကြောင်း
      ထပ်ရေးလိုက်ရင် ဘာဖြစ်မလဲ။ [[mark:draw-error]] program က compile လုပ်လို့ မရတော့ပါဘူး။ compiler
      က E0384 error နဲ့ ရပ်သွားပြီး၊ immutable variable တစ်ခုထဲကို တန်ဖိုး နှစ်ကြိမ် ထည့်လို့
      မရဘူးလို့ ပြောပါတယ်။ ဒါဆို ဘာကြောင့် ဒါကို default လုပ်ထားတာလဲ။ ဥပမာအားဖြင့်၊ ကိုယ့် code ရဲ့
      တစ်နေရာက lives ကို 3 အတိုင်း ရှိနေမယ်လို့ မျှော်လင့်ထားပြီး၊ တခြား တစ်နေရာကနေ အဲဒါကို
      ပြောင်းလိုက်တယ် ဆိုပါစို့။ အဲဒီလို bug မျိုးက ရှာရ အရမ်း ခက်ပါတယ်။ [[mark:draw-trust]]
      တန်ဖိုးတွေက ပြောင်းလို့ မရဘူးဆိုရင်တော့၊ စာကြောင်း တစ်ကြောင်းကို ဖတ်လိုက်ရင် အဲဒီ စာကြောင်းက
      ပြောတဲ့အတိုင်းပဲ ဖြစ်မယ်လို့ စိတ်ချလို့ ရပါတယ်။ ဘာကြောင့်လဲဆိုတော့ compiler က ကိုယ့်အစား
      စစ်ပေးထားလို့ပါ။ [[mark:draw-help]] ပြီးတော့ help စာကြောင်းကိုလည်း ကြည့်ပါ။ ပြောင်းလို့ ရအောင်
      ဘယ်လို လုပ်ရမလဲ ဆိုတာကို compiler က တန်းပြောပြထားပါတယ်။ binding ကို mutable လုပ်လိုက်ပါတဲ့။
      mutable ဆိုတာ ပြောင်းလို့ ရတယ်လို့ ဆိုလိုတာပါ။
    sources:
      - title: "The Rust Book — Variables and Mutability"
        url: "https://doc.rust-lang.org/book/ch03-01-variables-and-mutability.html"
      - title: "Rust error codes — E0384"
        url: "https://doc.rust-lang.org/error_codes/E0384.html"
    actions:
      - id: board1-open
        type: whiteboard.apply
        at: { mark: board-title }
        open: true
        upsertIds: [b1-title]
      - id: draw-binding
        type: whiteboard.apply
        at: { mark: draw-binding }
        upsertIds: [b1-code, b1-name, b1-arrow, b1-box, b1-value]
        drawMs: 2200
      - id: draw-stays
        type: whiteboard.apply
        at: { mark: draw-stays }
        upsertIds: [b1-stays]
        drawMs: 900
      - id: draw-broken
        type: whiteboard.apply
        at: { mark: draw-broken }
        upsertIds: [b1-broken, b1-strike]
        drawMs: 1200
      - id: draw-error
        type: whiteboard.apply
        at: { mark: draw-error }
        upsertIds: [b1-err1, b1-err2]
        drawMs: 1800
      - id: draw-trust
        type: whiteboard.apply
        at: { mark: draw-trust }
        upsertIds: [b1-trust]
        drawMs: 900
      - id: draw-help
        type: whiteboard.apply
        at: { mark: draw-help }
        upsertIds: [b1-help]
        drawMs: 1200

  - id: mut
    chapter: mut နဲ့ တန်ဖိုး ပြောင်းခြင်း
    narration: >-
      [[mark:type-mut]] ကဲ၊ editor ထဲ ပြန်သွားပြီး၊ ဒီတစ်ခါ တကယ် ပြောင်းဖို့ လိုတဲ့ score တစ်ခု
      ထည့်ကြည့်ရအောင်။ [[mark:select-mut]] ဒီ mut keyword ကြောင့် score ဆိုတဲ့ variable က mutable
      ဖြစ်သွားပြီး၊ ပြောင်းလို့ ရသွားတာပါ။ score က 0 ကနေ စပြီး၊ plus equal စာကြောင်းက 250 ကို
      ပေါင်းထည့်ပေးပါတယ်။ ပြီးတော့ mut ဆိုတာ ကိုယ့် code ကို ဖတ်မယ့်သူတိုင်းအတွက် မှတ်ချက် တစ်ခုလည်း
      ဖြစ်ပါတယ်။ ဒီ တန်ဖိုးက နောက်ပိုင်းမှာ ပြောင်းသွားမယ်လို့ ကြိုပြောထားတာပါ။ mut ကို
      ပြန်ဖြုတ်လိုက်ရင်တော့၊ plus equal စာကြောင်းမှာ ခုနက E0384 error ပဲ ထပ်တက်ပါလိမ့်မယ်။
    sources:
      - title: "The Rust Book — Variables and Mutability"
        url: "https://doc.rust-lang.org/book/ch03-01-variables-and-mutability.html"
      - title: "The Rust Reference — Compound assignment expressions"
        url:
          "https://doc.rust-lang.org/reference/expressions/operator-expr.html#compound-assignment-expres\
          sions"
    actions:
      - id: close-board1
        type: whiteboard.apply
        at: { scene: start, offsetMs: -600 }
        open: false
      - id: type-mut
        type: editor.type
        at: { mark: type-mut }
        target:
          file: main.rs
          after: "    println!(\"lives: {lives}\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "

          \    let mut score = 0;

          \    score += 250;

          \    println!(\"score: {score}\");\n"
      - id: select-mut
        type: editor.select
        at: { mark: select-mut }
        target:
          file: main.rs
          text: "mut"
          occurrence: 1

  - id: shadow-board
    chapter: Shadowing
    narration: >-
      [[mark:board2]] နာမည် တစ်ခုကို ပြန်သုံးဖို့ နောက်နည်း တစ်နည်း ရှိပါသေးတယ်။ ဒါကို shadowing
      လို့ ခေါ်ပြီး၊ mut နဲ့ ဘာကွာလဲ ဆိုတာ whiteboard ပေါ်မှာ နှိုင်းယှဉ် ကြည့်ရအောင်။
      [[mark:draw-mut]] mut နဲ့ဆိုရင် variable က တစ်ခုတည်းပါ။ အကွက် တစ်ခုတည်းထဲကို တန်ဖိုး အသစ်
      ထည့်တာ ဖြစ်ပြီး၊ အဲဒီ တန်ဖိုးက type အတူတူပဲ ဖြစ်ရပါမယ်။ [[mark:draw-shadow1]] shadowing ကတော့
      ဒီလိုပါ။ အစမှာ spaces လို variable တစ်ခု ရှိပြီး၊ သူ့ထဲမှာ စာသား တစ်ခု ထည့်ထားတယ် ဆိုပါစို့။
      [[mark:draw-shadow2]] ပြီးတော့ နာမည် အတူတူနဲ့ let ကို ထပ်ရေးလိုက်ပါတယ်။ အဲဒီအခါ အကွက် အသစ်
      တစ်ခုထဲမှာ variable အသစ်စက်စက် တစ်ခု ထွက်လာပြီး၊ အဲဒီ စာကြောင်းကစပြီး အဟောင်းက ကွယ်သွားပါတယ်။
      [[mark:draw-shadow-type]] ပြီးတော့ variable အသစ် ဖြစ်တဲ့အတွက်၊ type တောင် ပြောင်းလို့ ရပါတယ်။
      ဒီမှာဆိုရင် ကိန်းဂဏန်း ဖြစ်သွားပါပြီ။
    sources:
      - title: "The Rust Book — Shadowing"
        url: "https://doc.rust-lang.org/book/ch03-01-variables-and-mutability.html#shadowing"
    actions:
      - id: board2-open
        type: whiteboard.apply
        at: { mark: board2 }
        open: true
        clear: true
        upsertIds: [b2-title]
      - id: draw-mut
        type: whiteboard.apply
        at: { mark: draw-mut }
        upsertIds:
          [
            b2-mut-code,
            b2-mut-arrow,
            b2-mut-box,
            b2-mut-old,
            b2-mut-strike,
            b2-mut-new,
            b2-mut-note,
          ]
        drawMs: 2800
      - id: draw-shadow1
        type: whiteboard.apply
        at: { mark: draw-shadow1 }
        upsertIds: [b2-sh-code1, b2-sh-arrow1, b2-sh-box1, b2-sh-val1]
        drawMs: 1600
      - id: draw-shadow2
        type: whiteboard.apply
        at: { mark: draw-shadow2 }
        upsertIds: [b2-sh-code2, b2-sh-arrow2, b2-sh-box2, b2-sh-val2, b2-sh-hidden]
        drawMs: 2200
      - id: draw-shadow-type
        type: whiteboard.apply
        at: { mark: draw-shadow-type }
        upsertIds: [b2-sh-note1, b2-sh-note2]
        drawMs: 1000

  - id: shadow-code
    narration: >-
      [[mark:type-shadow]] ကဲ၊ editor ထဲ ပြန်သွားပြီး စမ်းကြည့်ရအောင်။ spaces က အစမှာ double quote
      ကြားမှာ space လေးခု ပါတဲ့ စာသား တစ်ခုပါ။ [[mark:select-shadow]] ပြီးတော့ ဒုတိယ let က အဲဒီ
      စာသားရဲ့ အရှည်ကို ယူလိုက်ပါတယ်။ အရှည်ဆိုတာ ကိန်းဂဏန်း ဖြစ်ပေမယ့်၊ နာမည်ကတော့ spaces အတိုင်းပဲ
      ဆက်သုံးထားပါတယ်။ ဒါကြောင့် space count လို ဒုတိယ နာမည် တစ်ခု ထပ်ရှာစရာ မလိုတော့ပါဘူး။
      ဒီနေရာမှာ spaces ကို shadow မလုပ်ဘဲ mut နဲ့ ရေးထားမယ်ဆိုရင်တော့၊ စာသား variable ထဲကို
      ကိန်းဂဏန်း ထည့်တာ ဖြစ်သွားပြီး၊ type မကိုက်တဲ့အတွက် compiler က E0308 error၊ mismatched types
      နဲ့ ရပ်သွားပါလိမ့်မယ်။
    sources:
      - title: "The Rust Book — Shadowing"
        url: "https://doc.rust-lang.org/book/ch03-01-variables-and-mutability.html#shadowing"
      - title: "Rust error codes — E0308"
        url: "https://doc.rust-lang.org/error_codes/E0308.html"
      - title: "std — str::len"
        url: "https://doc.rust-lang.org/std/primitive.str.html#method.len"
    actions:
      - id: close-board2
        type: whiteboard.apply
        at: { scene: start, offsetMs: -600 }
        open: false
      - id: type-shadow
        type: editor.type
        at: { mark: type-shadow }
        target:
          file: main.rs
          after: "    println!(\"score: {score}\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "

          \    let spaces = \"    \";

          \    let spaces = spaces.len();

          \    println!(\"spaces: {spaces}\");\n"
      - id: select-shadow
        type: editor.select
        at: { mark: select-shadow }
        target:
          file: main.rs
          text: "let spaces = spaces.len();"
          occurrence: 1

  - id: constants
    chapter: Const နဲ့ type annotation
    narration: >-
      [[mark:type-const]] တချို့ တန်ဖိုးတွေကတော့ program တစ်ခုလုံးမှာ ဘယ်တော့မှ မပြောင်းပါဘူး။
      ဥပမာအားဖြင့် ရနိုင်တဲ့ အများဆုံး score လိုမျိုးပါ။ အဲဒီလို တန်ဖိုးတွေအတွက် Rust မှာ const
      ရှိပါတယ်။ const ကို function တွေရဲ့ အပြင်ဘက်မှာ ရေးထားလို့ ရတဲ့အတွက်၊ ကိုယ့် code အားလုံးကနေ
      သုံးလို့ ရပါတယ်။ [[mark:select-const]] MAX SCORE ဆိုတဲ့ နာမည်ကို ကြည့်ပါ။ constant ရဲ့
      နာမည်ကို စာလုံးကြီးနဲ့ ရေးပြီး၊ စကားလုံးတွေကြားမှာ underscore ခံပြီး ရေးရပါတယ်။ ဒီလို
      မရေးထားရင် compiler က warning ပေးပါလိမ့်မယ်။ ပြီးတော့ type ကိုလည်း မဖြစ်မနေ ရေးပေးရပါတယ်။
      ဒီမှာတော့ u32 ပါ၊ unsigned 32 bit integer ဖြစ်တဲ့အတွက် အနုတ်ကိန်း ဖြစ်လို့ မရပါဘူး။ type ကို
      ချန်ထားလိုက်ရင် compiler က missing type for const item ဆိုတဲ့ error နဲ့ ရပ်သွားပါတယ်။ const
      ကို mut လုပ်လို့ မရသလို၊ သူ့ တန်ဖိုးကိုလည်း program compile လုပ်ချိန်မှာတင် သိနေရပါမယ်။
    sources:
      - title: "The Rust Book — Constants"
        url: "https://doc.rust-lang.org/book/ch03-01-variables-and-mutability.html#constants"
      - title: "The Rust Reference — Constant items"
        url: "https://doc.rust-lang.org/reference/items/constant-items.html"
      - title: "rustc lints — non_upper_case_globals"
        url: "https://doc.rust-lang.org/rustc/lints/listing/warn-by-default.html#non-upper-case-globals"
    actions:
      - id: type-const
        type: editor.type
        at: { mark: type-const }
        target:
          file: main.rs
          after: ""
          occurrence: 1
        cadence: fast-explainer
        text: "const MAX_SCORE: u32 = 1000;\n\n"
      - id: select-const
        type: editor.select
        at: { mark: select-const }
        target:
          file: main.rs
          text: "MAX_SCORE: u32"
          occurrence: 1

  - id: annotate
    narration: >-
      [[mark:select-score]] let မှာလည်း type ကို ထည့်ရေးလို့ ရပါတယ်။ score အတွက် Rust က i32 ကို
      ရွေးပေးထားပါတယ်၊ ဒါက ဒသမ မပါတဲ့ ကိန်းဂဏန်းတွေအတွက် default type ပါ။ ဒါပေမဲ့ score ဆိုတာ
      ဘယ်တော့မှ သုညအောက် မရောက်ပါဘူး။ [[mark:type-annotation]] ဒါကြောင့် score နောက်မှာ colon ခံပြီး
      u32 လို့ ရေးလိုက်ရအောင်။ ဒါကို type annotation လို့ ခေါ်ပါတယ်။ [[mark:type-max]] အခု score ကို
      constant နဲ့ တွဲပြီး print ထုတ်ကြည့်ရအောင်။
    sources:
      - title: "The Rust Book — Data Types"
        url: "https://doc.rust-lang.org/book/ch03-02-data-types.html"
      - title: "The Rust Reference — Type inference"
        url: "https://doc.rust-lang.org/reference/type-inference.html"
    actions:
      - id: select-score
        type: editor.select
        at: { mark: select-score }
        target:
          file: main.rs
          text: "let mut score = 0;"
          occurrence: 1
      - id: type-annotation
        type: editor.type
        at: { mark: type-annotation }
        target:
          file: main.rs
          after: "    let mut score"
          occurrence: 1
        cadence: natural
        text: ": u32"
      - id: type-max
        type: editor.type
        at: { mark: type-max }
        target:
          file: main.rs
          after: '    println!("score: {score}'
          occurrence: 1
        cadence: natural
        text: " of {MAX_SCORE}"

  - id: run
    narration: >-
      [[mark:run]] ကဲ၊ run ကြည့်ရအောင်။ lives က 3 ပါ။ score က 1000 ထဲက 250 ပါ။ ပြီးတော့ spaces ကတော့
      အခု စာသား မဟုတ်တော့ဘဲ၊ 4 ဆိုတဲ့ ကိန်းဂဏန်း ဖြစ်သွားပါပြီ။
    sources:
      - title: "Rust Playground"
        url: "https://play.rust-lang.org/"
    actions:
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "score: 250 of 1000"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: "let spaces = spaces.len();"

  - id: wrap
    narration: >-
      ဒါဆို ပြန်ချုပ်ရရင်၊ let က ပြောင်းလို့ မရတဲ့ variable တစ်ခု လုပ်ပေးပြီး၊ ပြောင်းချင်ရင် mut
      ထည့်ရပါတယ်။ shadowing ကတော့ နာမည် အတူတူနဲ့ variable အသစ် တစ်ခု လုပ်တာ ဖြစ်ပြီး၊ const ကတော့
      type ပါတဲ့ အသေ သတ်မှတ်ထားတဲ့ တန်ဖိုး တစ်ခုပါ။ နောက် lesson မှာတော့ ဒီ lesson မှာ တွေ့ခဲ့တဲ့
      i32 နဲ့ u32 လို Rust ရဲ့ data type တွေကို ကြည့်သွားပါမယ်။
    sources:
      - title: "The Rust Book — Variables and Mutability"
        url: "https://doc.rust-lang.org/book/ch03-01-variables-and-mutability.html"
    actions: []

checks:
  - { type: timing.p95Ms, max: 300 }
