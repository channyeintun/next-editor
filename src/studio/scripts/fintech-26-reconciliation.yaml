  - id: try-it
    chapter: ကိုယ်တိုင် စမ်းကြည့်ပါ
    narration: >-
      [[mark:close-iv]] ကိုယ်တိုင် စမ်းကြည့်ဖို့ တစ်ခု ရှိပါတယ်။ [[mark:open-data2]] ledger ထဲက ဒုတိယ
      record ကို ကြည့်ပါ။ [[mark:sel-try]] သူ့ရဲ့ provider id ကို ဖျက်ပြီး run ကြည့်ပါ။ ဒုတိယ record က ပမာဏနဲ့ ရက်နဲ့ ခန့်မှန်းတွဲတဲ့ class ထဲ ရောက်သွားပါလိမ့်မယ်။ ပြီးရင် PSP report မှာ အဲဒီ payment ရဲ့ အပေါ်မှာ ယူရို ရှစ်ဆယ် record နောက်တစ်ခု ထည့်ကြည့်ပါ၊ ခန့်မှန်းချက် မှားသွားပြီး မှန်တဲ့ payment က ledger ထဲမှာ မရှိဘူး လို့ ပေါ်လာပါလိမ့်မယ်။ [[mark:recap]] ပြန်ချုပ်ရရင်၊ reconciliation
      ဆိုတာ ledger ကို အပြင်က source တွေနဲ့ တိုက်ပြီး ကွာတာတိုင်းကို class ခွဲ၊ နားလည်ပြီးမှ
      first-class tool နဲ့ ပြင်တာပါ၊ ကိုက်အောင် ပြင်ရေးတာ မဟုတ်ပါဘူး။ နောက် lesson ကစပြီး controls
      and access အပိုင်းကို ကြည့်ပါမယ်။ break တစ်ခုကို ပြင်တဲ့ correction entry ကို engineer
      တစ်ယောက်တည်း post လုပ်ခွင့် ရှိသင့်လား ဆိုတဲ့ မေးခွန်းကနေ စပါမယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Reconciliation (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#reconciliation",
        }
