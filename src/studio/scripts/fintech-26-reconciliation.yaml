    files:
      data.go: |
        package main

        import "fmt"

        const today = 14 // the business day the reconciliation job runs

        // classes are the report's lines, in this order. Every record of both sides lands in one.
        var classes = []string{"matched by id", "matched by amount+day", "amount differs", "pending",
        	"missing at provider", "missing in ledger"}

        // Record is one money movement as one system saw it. Ref is the other side's id, if we kept it.
        type Record struct {
        	ID     string
        	Ref    string
        	Amount int64
        	Day    int
        }

        // ledger is what we booked.
        var ledger = []Record{
        	{ID: "tx-1", Ref: "pi_101", Amount: 100_00, Day: 10},
        	{ID: "tx-2", Ref: "pi_102", Amount: 80_00, Day: 10},
        	{ID: "tx-3", Ref: "pi_103", Amount: 50_00, Day: 11},
        	{ID: "tx-4", Ref: "pi_104", Amount: 30_00, Day: 13},
        	{ID: "tx-5", Ref: "pi_105", Amount: 20_00, Day: 9},
        }

        // provider is the PSP's report for the same days.
        var provider = []Record{
        	{ID: "pi_101", Amount: 100_00, Day: 10},
        	{ID: "pi_102", Amount: 80_00, Day: 11},
        	{ID: "pi_103", Amount: 5_00, Day: 11},
        	{ID: "pi_106", Amount: 12_00, Day: 12},
        }

        // Payout is one bank transfer from the PSP that settles several payments, net of its fees.
        type Payout struct {
        	ID    string
        	Items map[string]bool
        	Fees  int64
        }

        var payout = Payout{ID: "po_77", Items: map[string]bool{"pi_101": true, "pi_102": true}, Fees: 2_90}

        // bank is the line for that payout on our bank statement.
        var bank = Record{ID: "po_77", Amount: 177_10, Day: 12}

        // cents prints minor units as an amount with two decimals: cents(1234) is "12.34".
        func cents(n int64) string {
        	sign := ""
        	if n < 0 {
        		sign, n = "-", -n
        	}
        	return fmt.Sprintf("%s%d.%02d", sign, n/100, n%100)
        }
      main.go: |
        package main

        import (
        	"fmt"
        	"strings"
        )

        // guess pairs a record without a provider id with an unused one: same amount, a day apart.
        func guess(o Record, theirs []Record, used map[string]bool) (Record, bool) {
        	for _, t := range theirs {
        		if !used[t.ID] && t.Amount == o.Amount && max(t.Day-o.Day, o.Day-t.Day) <= 1 {
        			return t, true
        		}
        	}
        	return Record{}, false
        }

        // reconcile puts every record of both sides in exactly one class.
        func reconcile(ours, theirs []Record) map[string][]string {
        	byID := map[string]Record{}
        	for _, t := range theirs {
        		byID[t.ID] = t
        	}
        	used, out := map[string]bool{}, map[string][]string{}
        	add := func(class, s string) { out[class] = append(out[class], s) }
        	for _, o := range ours {
        		t, ok := byID[o.Ref]
        		how := "matched by id"
        		if !ok {
        			t, ok = guess(o, theirs, used)
        			how = "matched by amount+day"
        		}
        		switch {
        		case ok && t.Amount != o.Amount:
        			used[t.ID] = true
        			add("amount differs", o.ID+" "+cents(o.Amount)+" vs "+cents(t.Amount))
        		case ok:
        			used[t.ID] = true
        			add(how, o.ID)
        		default:
        			add("missing at provider", o.ID)
        		}
        	}
        	for _, t := range theirs {
        		if !used[t.ID] {
        			add("missing in ledger", t.ID+" "+cents(t.Amount))
        		}
        	}
        	return out
        }

        func main() {
        	report := reconcile(ledger, provider)
        	for _, c := range classes {
        		if len(report[c]) > 0 {
        			fmt.Printf("%s: %s\n", c, strings.Join(report[c], ", "))
        		}
        	}
        }
