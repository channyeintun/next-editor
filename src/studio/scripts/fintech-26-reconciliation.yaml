build:
  voiceProfile:
    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 9526

runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "matched by id: tx-1, tx-2\namount differs: tx-3 50.00 vs 5.00\nmissing at provider: tx-4, tx-5\nmissing in ledger: pi_106 12.00\n"
      run-2:
        status: success
        exitCode: 0
        output: "matched by id: tx-1, tx-2\namount differs: tx-3 50.00 vs 5.00\npending: tx-4\nmissing at provider: tx-5\nmissing in ledger: pi_106 12.00\n"
      run-3:
        status: success
        exitCode: 0
        output: "matched by id: tx-1, tx-2\namount differs: tx-3 50.00 vs 5.00\npending: tx-4\nmissing at provider: tx-5\nmissing in ledger: pi_106 12.00\npo_77: 180.00 - 2.90 fees = 177.10 | bank 177.10\n"

scenes:
  - id: hook
    chapter: Ledger ကို ဘာနဲ့ တိုက်စစ်မလဲ
    narration: >-
      ledger က ကိုယ့်ဘက်က မှတ်ထားတဲ့ စာရင်းပါ။ ငွေ တကယ် ရှိနေတာကတော့ PSP မှာနဲ့ ဘဏ်မှာပါ။
      ဒါကြောင့် ledger မှန်သလား ဆိုတာ ledger ကို ကြည့်ရုံနဲ့ ဘယ်တော့မှ မသိနိုင်ပါဘူး။
      reconciliation က အပြင်က မှတ်တမ်းတွေနဲ့ တိုက်ရုံ မကဘဲ၊ ကွာတာတိုင်းကို ရှင်းပေးရပါတယ်။ [[mark:sel-ref]] ကိုယ့် ledger ထဲက record တိုင်းမှာ PSP ဘက်က payment id ကို
      တွဲသိမ်းထားပါတယ်။ system နှစ်ခုကို တွဲဖို့ key က ဒါပါပဲ။ [[mark:sel-provider]] အောက်မှာတော့
      အဲဒီ ရက်တွေအတွက် PSP ပို့ပေးတဲ့ report ရှိပါတယ်။ [[mark:open-main]] ခွဲခြားတဲ့ logic ကို ကြည့်ရအောင်။ [[mark:sel-byid]] reconcile
      function က ကိုယ့် record တစ်ခုချင်းအတွက် PSP record ကို id နဲ့ ရှာပါတယ်။ [[mark:sel-switch]]
      တွေ့ပြီး ပမာဏ ကွာရင် amount differs၊ ကိုက်ရင် matched၊ မတွေ့ရင် PSP မှာ မရှိဘူး လို့ class
      ခွဲပါတယ်။ ဘယ်သူနဲ့မှ မတွဲမိခဲ့တဲ့ PSP record တွေကတော့ ledger ထဲမှာ မရှိတဲ့ class ပါ။
      [[mark:run-1]] run လိုက်ရအောင်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Reconciliation (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#reconciliation",
        }
    actions:
      - { id: open-data, type: workspace.openFile, at: { scene: start }, path: data.go }
      - id: sel-ref
        type: editor.select
        at: { mark: sel-ref }
        target: { file: data.go, text: 'Ref: "pi_101"', occurrence: 1 }
      - id: sel-provider
        type: editor.select
        at: { mark: sel-provider }
        target: { file: data.go, text: "var provider = []Record{", occurrence: 1 }
      - { id: open-main, type: workspace.openFile, at: { mark: open-main }, path: main.go }
      - id: sel-byid
        type: editor.select
        at: { mark: sel-byid }
        target: { file: main.go, text: "t, ok := byID[o.Ref]", occurrence: 1 }
      - id: sel-switch
        type: editor.select
        at: { mark: sel-switch }
        target: { file: main.go, text: "case ok && t.Amount != o.Amount:", occurrence: 1 }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "missing at provider: tx-4, tx-5",
          timeoutMs: 8000,
        }

  - id: read-1
    narration: >-
      [[mark:pt-m]] ပထမ record နှစ်ခုက id နဲ့ တွဲမိပြီး ပမာဏလည်း ကိုက်ပါတယ်။ [[mark:pt-diff]] တတိယ
      record ကတော့ တွဲမိပေမဲ့ ကိုယ့်ဘက်မှာ ယူရို ငါးဆယ်၊ PSP ဘက်မှာ ငါးယူရိုပဲ ဖြစ်နေပါတယ်။
      [[mark:pt-miss]] နောက်ဆုံး record နှစ်ခုကိုတော့ PSP report ထဲမှာ ရှာမတွေ့ပါဘူး။
      [[mark:pt-extra]] ပြောင်းပြန်အနေနဲ့ PSP မှာ ရှိပြီး ကိုယ့် ledger ထဲမှာ မရှိတဲ့ ဆယ့်နှစ်ယူရို
      payment တစ်ခု ပါလာပါတယ်။ reconciliation က ရှာတွေ့တဲ့ ကွာခြားချက် တစ်ခုချင်းကို break လို့
      ခေါ်ပါတယ်။ [[mark:dock-1]] missing ဖြစ်တဲ့ break က ပြင်ရ မခက်ပါဘူး၊ ဘာ ပျောက်နေလဲ ဆိုတာ
      သိနေလို့ပါ။ ပမာဏ ကွာတဲ့ break ကတော့ ပိုခက်ပါတယ်၊ ဘယ်ဘက်က မှန်လဲ ဆိုတာကို ကိုယ်တိုင်
      ရှာဖွေရလို့ပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Reconciliation (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#reconciliation",
        }
    actions:
      - id: pt-m
        type: console.point
        at: { mark: pt-m }
        target: { text: "matched by id: tx-1, tx-2", occurrence: 1 }
      - id: pt-diff
        type: console.point
        at: { mark: pt-diff }
        target: { text: "amount differs: tx-3", occurrence: 1 }
      - id: pt-miss
        type: console.point
        at: { mark: pt-miss }
        target: { text: "missing at provider", occurrence: 1 }
      - id: pt-extra
        type: console.point
        at: { mark: pt-extra }
        target: { text: "missing in ledger", occurrence: 1 }
      - { id: dock-1, type: runtime.collapseDock, at: { mark: dock-1 } }

  - id: drift
    chapter: Drift ဘယ်က လာလဲ
    narration: >-
      [[mark:show-drift]] ဒီ break တွေက bug ကြောင့်ချည်း ဖြစ်တာ မဟုတ်ပါဘူး။ အပြင်က data ကို
      အားကိုးတဲ့ system မှာ drift ဖြစ်တတ်ပါတယ်၊ ဆိုလိုတာက system နှစ်ခု တဖြည်းဖြည်း
      မကိုက်တော့တာပါ။ [[mark:pt-ok]] ပုံမှန်ဆိုရင် PSP က webhook ပို့ပြီး ကိုယ်က ledger ထဲ post
      လုပ်ပါတယ်။ [[mark:drift-2]] webhook တစ်ခု မရောက်လာရင်၊ PSP မှာ ရှိပြီး ledger ထဲမှာ မရှိတဲ့
      payment ဖြစ်လာပါတယ်။ handler ဘယ်လောက် ကောင်းကောင်း၊ မရောက်လာတဲ့ webhook ကိုတော့ handle လုပ်လို့ မရပါဘူး။ [[mark:drift-3]] ပြောင်းပြန်အနေနဲ့ ledger ထဲ post လုပ်ပြီးမှ PSP ဆီ ပို့တဲ့
      request မရောက်ရင်၊ ကိုယ့်ဘက်မှာပဲ ရှိတဲ့ record ဖြစ်လာပါတယ်။ [[mark:drift-4]] ဒါကြောင့်
      reconciliation ကို schedule နဲ့ run ပါတယ်။ context ပေါ် မူတည်ပြီး တစ်နာရီ တစ်ခါကနေ တစ်နှစ် တစ်ခါအထိ ရှိနိုင်ပြီး၊ ledger၊ PSP နဲ့ ဘဏ် ဆိုပြီး system သုံးခု ပါလာလည်း စဉ်းစားပုံ အတူတူပါပဲ။
    sources:
