  - id: window
    chapter: Settlement window
    narration: >-
      [[mark:close-drift]] ခုနက break စာရင်းထဲမှာ တစ်ခုက break မဟုတ်ပါဘူး။ [[mark:sel-default]] PSP
      မှာ မတွေ့တဲ့ record မှန်သမျှ ဒီ class ထဲ ရောက်နေပါတယ်။ ဒါပေမဲ့ စတုတ္ထ record ကို မနေ့ကမှ book
      လုပ်ခဲ့တာပါ။ PSP က T plus two မှာ settle လုပ်ရင် ဒီ record က မနက်ဖြန်မှ report ထဲ
      ရောက်ပါမယ်။ အဲဒါကို alert ပေးရင် false alarm ပါ။ [[mark:type-pend]] ဒါကြောင့် PSP မှာ
      မတွေ့သေးတဲ့ record ကို settlement window မကျော်သေးရင် pending လို့ သတ်မှတ်ပါမယ်။ window ကို
      provider နဲ့ rail တစ်ခုချင်းအလိုက် သတ်မှတ်ရပါတယ်။ ပဉ္စမ record ကလည်း PSP မှာ မရှိပါဘူး။ သူ
      ဘယ် class ထဲ ရောက်မလဲ ခန့်မှန်းကြည့်ပါ။ [[mark:run-2]] run လိုက်ရအောင်။ [[mark:pt-pend]]
      စတုတ္ထ record က pending ဖြစ်သွားပါပြီ။ [[mark:pt-miss2]] ပဉ္စမ record ကတော့ book လုပ်တာ
      ငါးရက် ရှိပြီမို့ window ကျော်သွားပါပြီ။ ဒါကြောင့် တကယ့် break အဖြစ် ကျန်ပါတယ်။
      [[mark:dock-2]] pending ဆိုတာ မေ့ထားလို့ရတဲ့ class မဟုတ်ပါဘူး၊ window ပြည့်တဲ့အထိ PSP မှာ
      မပေါ်လာရင် နောက် run မှာ break ဖြစ်သွားမှာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Reconciliation (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#reconciliation",
        }
      - {
          title: "Fintech Engineering Handbook — Value time vs booking time vs settlement time (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#value-time-vs-booking-time-vs-settlement-time",
        }
    actions:
      - { id: close-drift, type: slide.close, at: { mark: close-drift } }
      - id: sel-default
        type: editor.select
        at: { mark: sel-default }
        target: { file: main.go, text: 'add("missing at provider", o.ID)', occurrence: 1 }
      - id: type-pend
        type: editor.type
        at: { mark: type-pend }
        target: { file: main.go, after: "\t\t\tadd(how, o.ID)\n", occurrence: 1 }
        text: "\t\tcase today-o.Day <= 2: // settles at T+2: not in the report yet\n\t\t\tadd(\"pending\", o.ID)\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "pending: tx-4",
          timeoutMs: 8000,
        }
      - {
          id: expect-file-pend,
          type: expect.file,
          at: { afterAction: expect-2 },
          path: main.go,
          contains: "case today-o.Day <= 2:",
        }
      - id: pt-pend
        type: console.point
        at: { mark: pt-pend }
        target: { text: "pending: tx-4", occurrence: 1 }
      - id: pt-miss2
        type: console.point
        at: { mark: pt-miss2 }
        target: { text: "missing at provider: tx-5", occurrence: 1 }
      - { id: dock-2, type: runtime.collapseDock, at: { mark: dock-2 } }

  - id: kinds
    chapter: Align လုပ်တာ overwrite မဟုတ်ဘူး
    narration: >-
      [[mark:show-kinds]] break တွေ့ပြီဆိုရင် အရေးကြီးဆုံးက ဘယ်လို ပြင်မလဲ ဆိုတာပါ။ [[mark:pt-k1]]
      ledger ထဲမှာ မရှိတဲ့ payment ဆိုရင် ပျောက်သွားတဲ့ webhook ကို reprocess လုပ်ပါတယ်။ row ကို တိုက်ရိုက် ထည့်တာ မဟုတ်ဘဲ handler ရဲ့ path အတိုင်း ပြန်ဖြတ်လို့ idempotency check တွေ အကုန် ပါသွားပါတယ်။ [[mark:kinds-2]] PSP မှာ မရှိတဲ့ record
      ဆိုရင် PSP နဲ့ အရင် စစ်ပါတယ်။ ငွေ တကယ် မရွေ့ခဲ့ဘူး ဆိုတာ သေချာမှ reversal နဲ့ ပယ်ပါတယ်။
      [[mark:kinds-3]] ပမာဏ ကွာတာကတော့ ဘာကြောင့် ကွာလဲ အရင် ရှာရပါတယ်။ ကိုယ်က gross နဲ့ book လုပ်ပြီး PSP က net နဲ့ ပြတာလည်း ဖြစ်နိုင်၊ ကိုယ့် bug လည်း ဖြစ်နိုင်၊ PSP ဘက်က မှားတာလည်း ဖြစ်နိုင်ပါတယ်။ အကြောင်းရင်း သိမှ correction entry နဲ့ ပြင်ပါတယ်။
      [[mark:kinds-4]] provider id မသိမ်းထားခဲ့ရင် ပမာဏနဲ့ ရက်နဲ့ ခန့်မှန်းတွဲရပါတယ်။ တစ်ရက်တည်းမှာ ယူရို ရှစ်ဆယ် payment နှစ်ခု ရှိရင် ဘယ်ဟာနဲ့ တွဲမလဲ မသေချာတော့ပါဘူး။
      မှားတွဲမိရင် တကယ်တော့ break ဖြစ်နေတဲ့ record ကို matched လို့ ပြပြီး ဖုံးထားမိတာပါ။ [[mark:kinds-5]] ဒါကြောင့် ခန့်မှန်းတွဲတာကို guess မှန်း မှတ်ထားပြီး လူက review လုပ်တာ ကောင်းပါတယ်၊ provider id ကိုတော့ write လုပ်ချိန်မှာတင် သိမ်းထားတာ အကောင်းဆုံးပါ။
      [[mark:kinds-6]] ဘယ် break ပဲ ဖြစ်ဖြစ်၊ report ကိုက်အောင် ledger row ကို ပြင်ရေးလိုက်တာကတော့
      ဘယ်တော့မှ မလုပ်ရပါဘူး။ အဲဒါက ကွာခြားချက်ကို ဖျောက်လိုက်တာပါ။ ဘယ် source ကိုမှ အလိုလို မှန်တယ်လို့ မယူဘဲ အချင်းချင်း တိုက်စစ်တာက
      No trust ပါ။ ပျောက်သွားတဲ့ webhook ကို အပြီးအပိုင် မပျောက်ခင် ဖမ်းမိတာကတော့ No lost data ပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Reconciliation (Voytek Pitula, CC BY 4.0)",
