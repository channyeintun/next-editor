  - id: batch
    chapter: One-to-many settlement
    narration: >-
      [[mark:show-batch]] ကိုယ့် ဘဏ် statement ကို ကြည့်ရင် payment တစ်ခုချင်းကို မတွေ့ရပါဘူး။ PSP က
      payment အများကို စုပြီး fee နုတ်၊ payout တစ်ခုတည်းနဲ့ လွှဲပေးပါတယ်။ netting ဆိုတာ ပေးစရာ
      အများကြီးကို တစ်ခုချင်း မလွှဲဘဲ net ပမာဏ တစ်ခုတည်းနဲ့ settle လုပ်တာပါ။ [[mark:batch-2]]
      ဒါကြောင့် ဘဏ်က line တစ်ကြောင်းကို PSP record အများနဲ့ တိုက်ရပါတယ်။ item တွေကို ပေါင်းပြီး fee
      နုတ်ရင် ဘဏ်ထဲ ဝင်တဲ့ ပမာဏ အတိအကျ ထွက်ရပါမယ်။ [[mark:close-batch]] ဒီ စစ်ချက်ကို
      ထည့်ကြည့်ရအောင်။ [[mark:type-batch]] payout ထဲ ပါတဲ့ PSP record တွေရဲ့ ပမာဏကို ပေါင်းပြီး၊ fee
      နုတ်ထားတဲ့ ရလဒ်ကို ဘဏ် statement ထဲက ပမာဏနဲ့ တစ်ကြောင်းတည်းမှာ ထုတ်ပြပါတယ်။ တကယ့် system မှာ မညီရင် break တစ်ခု ဖွင့်ပါတယ်။ [[mark:run-3]] run
      လိုက်ရအောင်။ [[mark:pt-batch]] item နှစ်ခု ပေါင်းရင် ယူရို တစ်ရာ့ရှစ်ဆယ်ပါ၊ fee နှစ်ဒသမ ကိုး
      ယူရို နုတ်လိုက်ရင် ဘဏ်ထဲ ဝင်တဲ့ ပမာဏနဲ့ အတိအကျ ကိုက်ပါတယ်။ [[mark:dock-3]] သတိထားရမှာက
      အဲဒီ fee ကိုလည်း ledger ထဲမှာ expense အဖြစ် post လုပ်ထားရပါမယ်။ မဟုတ်ရင် PSP ဆီက ရစရာ ရှိတဲ့
      receivable account မှာ နှစ်ဒသမ ကိုး ယူရို ကျန်နေပြီး ဘယ်တော့မှ သုည မဖြစ်တော့ပါဘူး။
    sources:
      - {
          title: "Fintech Engineering Handbook — Reconciliation (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#reconciliation",
        }
      - {
          title: "Fintech Engineering Handbook — Transactions, timing & settlement: netting (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#transactions-timing-settlement",
        }
    actions:
      - {
          id: show-batch,
          type: slide.show,
          at: { mark: show-batch, offsetMs: -700 },
          slideId: batch-1,
        }
      - {
          id: pt-po,
          type: slide.point,
          at: { afterAction: show-batch },
          target: { x: 0.522, y: 0.559 },
        }
      - { id: batch-2, type: slide.show, at: { mark: batch-2 }, slideId: batch-2 }
      - {
          id: pt-sum,
          type: slide.point,
          at: { afterAction: batch-2 },
          target: { x: 0.318, y: 0.838 },
        }
      - { id: close-batch, type: slide.close, at: { mark: close-batch } }
      - id: type-batch
        type: editor.type
        at: { mark: type-batch }
        target:
          {
            file: main.go,
            after: "\t\t\tfmt.Printf(\"%s: %s\\n\", c, strings.Join(report[c], \", \"))\n\t\t}\n\t}\n",
            occurrence: 1,
          }
        text: "\n\tvar gross int64\n\tfor _, t := range provider {\n\t\tif payout.Items[t.ID] {\n\t\t\tgross += t.Amount\n\t\t}\n\t}\n\tfmt.Println(payout.ID+\":\", cents(gross), \"-\", cents(payout.Fees), \"fees =\",\n\t\tcents(gross-payout.Fees), \"| bank\", cents(bank.Amount))\n"
        cadence: line-by-line
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "| bank 177.10",
          timeoutMs: 8000,
        }
      - id: pt-batch
        type: console.point
        at: { mark: pt-batch }
        target: { text: "po_77:", occurrence: 1 }
      - { id: dock-3, type: runtime.collapseDock, at: { mark: dock-3 } }

  - id: case
    chapter: Reconcile မလုပ်နိုင်ရင်
    narration: >-
      [[mark:show-case]] ledger နဲ့ ဘဏ်ထဲက ငွေ မကိုက်တော့ရင် ဘာဖြစ်လဲ ဆိုတာ Synapse Financial Technologies
      မှာ မြင်ရပါတယ်။ Synapse က ၂၀၂၄ ခုနှစ် ဧပြီလ ၂၂ ရက်နေ့မှာ Chapter ၁၁ bankruptcy ကို
      လျှောက်ခဲ့ပါတယ်။ [[mark:pt-banks]] user တွေ ကိုယ်စား ဘဏ်မှာ ငွေ စုထားတဲ့ account ကို for
      benefit of account၊ အတိုကောက် FBO account လို့ ခေါ်ပါတယ်။ [[mark:pt-gap]] Chapter ၁၁ trustee က
      partner ဘဏ်တွေရဲ့ FBO account ထဲက ငွေနဲ့ Synapse ရဲ့ ledger ကြားမှာ ဒေါ်လာ သန်း ၈၅ လောက်
      shortfall ရှိတယ်လို့ ပထမ ခန့်မှန်းခဲ့ပါတယ်။ နောက်ပိုင်းမှာ သန်း ၆၅ ကနေ ၉၆ ကြားလို့ ခန့်မှန်းခဲ့ပါတယ်၊ ကွာဟချက်ကိုတောင် ဂဏန်း တစ်ခုတည်းနဲ့ မပြောနိုင်တာပါ။ [[mark:case-2]] ၂၀၂၄
      စက်တင်ဘာ ၁၇ ရက်နေ့မှာ FDIC Board က custodial account တချို့ကို ကိုင်တဲ့ ဘဏ်တွေအတွက် rule
      တစ်ခု propose လုပ်ခဲ့ပါတယ်။ beneficial owner တစ်ယောက်ချင်းကို သိနိုင်တဲ့ record ထားဖို့နဲ့
      owner တစ်ယောက်ချင်းရဲ့ balance ကို နေ့တိုင်း reconcile လုပ်ဖို့ပါ၊ အခုထိ proposal အဆင့်ပဲ
      ရှိပါသေးတယ်။ [[mark:case-3]] insured ဘဏ် ပြုတ်တဲ့အခါ owner တစ်ယောက်ချင်းကို ကာကွယ်ပေးတဲ့ FDIC ရဲ့ pass-through insurance ကလည်း၊ owner တစ်ယောက်ချင်း
      ဘယ်လောက် ပိုင်လဲ ဆိုတာ record ကနေ သက်သေပြနိုင်မှ အလုပ်လုပ်ပါတယ်။
      ဆိုလိုတာက reconciliation ဟာ လကုန် စာရင်းပိတ်တဲ့ အလုပ် သက်သက် မဟုတ်ပါဘူး၊ user ငွေ ဘယ်မှာ
      ဘယ်လောက် ရှိလဲ ဆိုတာကို သက်သေပြတဲ့ နည်းပါ။
    sources:
