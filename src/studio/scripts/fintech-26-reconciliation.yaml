# Fintech Engineering, lesson 26: reconciliation (Burmese).
#
# Source: Fintech Engineering Handbook, "Reconciliation" and Appendix A "Reconciliation break",
# "Netting" (CC BY 4.0, Voytek Pitula).
# Start state: data.go holds five ledger records (each with the PSP's payment id), the PSP's report,
# one payout and its bank-statement line; main.go classifies every record of both sides.
# Edits, all insert-only:
#   1. a pending case: not at the PSP yet but inside T+2      -> run-2 prints "pending: tx-4"
#   2. the one-to-many check: payout items - fees vs the bank -> run-3 prints the po_77 line
# Runs: run-1 (four classes, tx-4 a false alarm), run-2, run-3.
# Figures: drift (where breaks come from), kinds (each class and its first-class fix), batch
# (one transfer settles many payments), case (Synapse), iv (the interview answer).
# Facts: B04 (Synapse, FDIC proposal), B25 (FDIC pass-through records).
# Built by ~/Documents/fintech-course-work/tools/build-lesson.ts; fixtures by sim-go.ts --write.
