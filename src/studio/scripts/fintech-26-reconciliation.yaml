  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] Fintech interview တွေမှာ ledger နဲ့ bank statement မကိုက်ရင် ဘာလုပ်မလဲ လို့
      မေးလေ့ရှိပါတယ်။ ရှာပြီး ပြင်မယ် လို့ပဲ ဖြေရင် မလုံလောက်ပါဘူး။ [[mark:iv-a]] ပထမ၊
      ဘယ်လို တွဲမလဲ ပြောပါ။ provider id နဲ့ တွဲမယ်၊ id မရှိမှ ပမာဏနဲ့ အချိန်နဲ့ ခန့်မှန်းတွဲမယ်၊
      payout တစ်ခုကို item တွေ ပေါင်းပြီး fee နုတ်တာနဲ့ တိုက်မယ် ဆိုတာပါ။ [[mark:iv-b]] ဒုတိယ၊
      ကွာတာတိုင်းကို class ခွဲပါ။ missing၊ ပမာဏ ကွာတာ၊ settlement window ထဲက pending ဆိုပြီး ခွဲရင် pending ကို alert မပေးရတော့ပါဘူး။ [[mark:iv-c]] တတိယ၊ ပြင်တာကို
      first-class tool နဲ့ပဲ လုပ်ပါ။ correction entry နဲ့၊ webhook ကို reprocess လုပ်တာနဲ့ ပြင်ပြီး row
      ကို overwrite မလုပ်ပါဘူး။ [[mark:iv-d]] ပြီးရင် ဘယ်လို run မလဲ ဆက်ပြောပါ။ schedule နဲ့ run ပြီး break တိုင်းကို တာဝန်ယူတဲ့သူ ရှိတဲ့ queue ထဲ ပိတ်တဲ့အထိ ထားမယ်၊ ဘယ် source ကိုမှ အလိုလို မယုံဘူး ဆိုတာပါ။
    sources:
