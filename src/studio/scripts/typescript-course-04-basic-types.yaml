build:
  # Studio replaces this built-in profile at render time with the Burmese provider chosen in the
  # render console (AthanLab with the user's own key, or VoxCPM2 when that feature is enabled).
  voiceProfile: pocket-alba-v1
  seed: 3104
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "Type annotation ရေးပုံ"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ TypeScript ကို JavaScript ပြောင်းတဲ့အခါ type တွေကိုပဲ ဖယ်ထုတ်ပြီး၊
      ကျန်တဲ့ code က မပြောင်းဘူး ဆိုတာ မြင်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ အဲဒီ type တွေကို ဘယ်လို ရေးရလဲ၊
      ဘယ်နေရာမှာ ရေးဖို့ လိုပြီး ဘယ်နေရာမှာ မလိုလဲ ဆိုတာနဲ့၊ TypeScript ရဲ့ အခြေခံ type တွေကို ကြည့်သွားပါမယ်။
      [[mark:draw-rule]] type annotation ရေးပုံက တစ်မျိုးတည်းပါ။ နာမည်ရဲ့ နောက်မှာ colon တစ်လုံး ခံပြီး type
      ကို ရေးပေးတာပါ။ [[mark:draw-var]] variable မှာဆိုရင် variable နာမည်ရဲ့ နောက်မှာ ရေးပါတယ်။ ဥပမာအားဖြင့်၊
      ဒီ line က ခွက် အရေအတွက် variable ထဲကို number ပဲ ထည့်ရမယ်လို့ ပြောလိုက်တာ ဖြစ်ပါတယ်။ [[mark:draw-param]] function ရဲ့ parameter မှာလည်း ဒီ
      ပုံစံအတိုင်းပဲ ရေးပါတယ်။ အဲဒီအခါ function ကို ခေါ်တဲ့ သူက ဘယ်လို တန်ဖိုး ပေးရမလဲ ဆိုတာကို သတ်မှတ်လိုက်တာ
      ဖြစ်ပြီး၊ ပေးလိုက်တဲ့ တန်ဖိုးက type နဲ့ မကိုက်ရင် TypeScript က ခေါ်တဲ့ နေရာမှာ error ပြပါတယ်။
      [[mark:draw-erase]] ပြီးခဲ့တဲ့ lesson မှာ မြင်ခဲ့သလို၊ ဒီ annotation တွေက type checker အတွက်ပဲ ဖြစ်လို့
      JavaScript ပြောင်းတဲ့အခါ ဖယ်ထုတ်ခံရပါတယ်။ [[mark:draw-check]] ဒါကြောင့် program အလုပ်လုပ်ပုံကို
      မပြောင်းပေမယ့်၊ code ကို run စရာ မလိုဘဲ အမှားတွေကို ကြိုသိအောင် ကူညီပေးပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 4: Essential Types and Annotations (basic annotations)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/essential-types-and-annotations",
        }
      - {
          title: "TypeScript Handbook: Everyday Types (type annotations on variables)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#type-annotations-on-variables",
        }
      - {
          title: "TypeScript Handbook: Everyday Types (parameter type annotations)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#parameter-type-annotations",
        }
    actions:
      - id: open-board-a
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-rule
        type: whiteboard.apply
        at: { mark: draw-rule }
        upsertIds: [a-rule, a-rule-box]
        drawMs: 1200
      - id: draw-var
        type: whiteboard.apply
        at: { mark: draw-var }
        upsertIds: [a-var-key, a-var-code]
        drawMs: 1800
      - id: draw-param
        type: whiteboard.apply
        at: { mark: draw-param }
        upsertIds: [a-param-key, a-param-code]
        drawMs: 2000
      - id: draw-erase
        type: whiteboard.apply
        at: { mark: draw-erase }
        upsertIds: [a-erase]
        drawMs: 1400
      - id: draw-check
        type: whiteboard.apply
        at: { mark: draw-check }
        upsertIds: [a-check]
        drawMs: 1400

  - id: starter
    narration: >
      [[mark:close-board]] ဒီနေ့ code ကို ကြည့်ရအောင်။ [[mark:open-main]] ဒါက မြမြရဲ့ အော်ဒါကို တွက်ပေးတဲ့ program ပါ။
      [[mark:select-vars]] အပေါ်ဆုံးမှာ customer နာမည်၊ ခွက် အရေအတွက်နဲ့ ပါဆယ် ယူမလား ဆိုတာကို variable
      သုံးခုနဲ့ ထားပါတယ်။ ဘယ် variable မှာမှ type မရေးထားတာကို သတိထား ကြည့်ပါ။ [[mark:select-cup-total]] ဒီ
      function က တစ်ခွက်ဈေးကို ခွက် အရေအတွက်နဲ့ မြှောက်ပြီး ကျသင့်ငွေကို ပြန်ပေးပါတယ်။ [[mark:select-kyat]]
      အောက်က function ကတော့ ငွေပမာဏကို ထောင်ဂဏန်းတိုင်းမှာ comma ခံပြီး၊ နောက်မှာ ကျပ် ဆိုတဲ့ စာကို
      တွဲပေးဖို့ ရေးထားတာပါ။ function နှစ်ခုလုံးရဲ့ parameter တွေမှာလည်း type မရေးထားပါဘူး။
      [[mark:select-logs]] နောက်ဆုံး နှစ်ကြောင်းကတော့ အော်ဒါရဲ့ အချက်အလက်တွေနဲ့ လက်ဖက်ရည် နှစ်ခွက်ရဲ့
      ကျသင့်ငွေကို ထုတ်ပြပါတယ်။ ဒီ code ကို TypeScript က ဘယ်လို မြင်လဲ ကြည့်ရအောင်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 4: Essential Types and Annotations",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/essential-types-and-annotations",
        }
      - {
          title: "MDN: Number.prototype.toLocaleString()",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Number/toLocaleString",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: src/main.ts
      - id: select-vars
        type: editor.select
        at: { mark: select-vars }
        target:
          {
            file: src/main.ts,
            text: "let customer = \"မြမြ\";\nlet cups = 2;\nlet isTakeaway = false;",
            occurrence: 1,
          }
      - id: select-cup-total
        type: editor.select
        at: { mark: select-cup-total }
        target: { file: src/main.ts, text: "function cupTotal(price, count)", occurrence: 1 }
      - id: select-kyat
        type: editor.select
        at: { mark: select-kyat }
        target: { file: src/main.ts, text: "function kyat(amount)", occurrence: 1 }
      - id: select-logs
        type: editor.select
        at: { mark: select-logs }
        target:
          {
            file: src/main.ts,
            text: "console.log(customer, cups, \"ခွက်\", \"ပါဆယ်\", isTakeaway);\nconsole.log(\"လက်ဖက်ရည်\", kyat(cupTotal(1500, cups)));",
            occurrence: 1,
          }

  - id: panel
    narration: >
      [[mark:panel-ready]] ညာဘက် panel ရဲ့ Output ကို အရင် ကြည့်ရအောင်။ ပထမ line မှာ မြမြ၊ ခွက် အရေအတွက်နဲ့
      ပါဆယ် မဟုတ်ဘူး ဆိုတဲ့ false ထွက်လာပါတယ်။ [[mark:read-crash]] ဒုတိယ line မှာတော့ အနီရောင် error နဲ့
      program ရပ်သွားပါတယ်။ ငွေပမာဏ ပေါ်မှာ ခေါ်ထားတဲ့ method က function မဟုတ်ဘူး လို့ ပြောနေတာပါ။ ဘာ
      မှားနေလဲ ဆိုတာကို ခဏနေမှ ရှာကြည့်ပါမယ်။ [[mark:read-errors]] အပေါ်က Errors အပိုင်းမှာတော့ error သုံးခု
      ရှိပါတယ်။ သုံးခုလုံးက ပြောတာ အတူတူပါပဲ။ type မရေးထားတဲ့ parameter သုံးခုကို TypeScript က any type လို့
      ယူဆလိုက်ရပြီး၊ ဒီလို ကိုယ် မသိလိုက်ဘဲ any ဖြစ်သွားတာကို လက်မခံဘူးလို့ ပြောနေတာပါ။ error code ၇၀၀၆ နဲ့
      ရှာကြည့်ရင် ဒီ error အကြောင်း အများကြီး တွေ့ပါလိမ့်မယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 4: Essential Types and Annotations (type inference: function parameters)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/essential-types-and-annotations",
        }
      - {
          title: "TSConfig Reference: noImplicitAny",
          url: "https://www.typescriptlang.org/tsconfig/#noImplicitAny",
        }
      - {
          title: 'MDN: TypeError: "x" is not a function',
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Errors/Not_a_function",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-start-three
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "3" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-start-order-line
        type: expect.preview
        at: { afterAction: expect-start-three }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-1 }
        textContains: "မြမြ 2 ခွက် ပါဆယ် false"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-start-crash
        type: expect.preview
        at: { afterAction: expect-start-order-line }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-2 }
        textContains: "Uncaught TypeError: amount.toLocalString is not a function"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-start-crash-level
        type: expect.preview
        at: { afterAction: expect-start-crash }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-2 }
        attribute: { name: data-level, value: "error" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-start-price
        type: expect.preview
        at: { mark: read-errors }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Parameter 'price' implicitly has an 'any' type."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-start-code
        type: expect.preview
        at: { afterAction: expect-start-price }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-code, value: "7006" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-start-count
        type: expect.preview
        at: { afterAction: expect-start-code }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-2 }
        textContains: "Parameter 'count' implicitly has an 'any' type."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-start-amount
        type: expect.preview
        at: { afterAction: expect-start-count }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-3 }
        textContains: "Parameter 'amount' implicitly has an 'any' type."
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: parameters
    chapter: "Parameter တွေမှာ type လိုတယ်"
    narration: >
      [[mark:select-params]] ဒါဆို variable တွေမှာ type မရေးထားတာကို ဘာမှ မပြောဘဲ၊ parameter တွေကျမှ ဘာလို့
      error ပြတာလဲ။ variable ကတော့ ညီမျှခြင်းရဲ့ ညာဘက်က တန်ဖိုးကို ကြည့်ပြီး TypeScript က type ကို
      သိနိုင်ပါတယ်။ parameter ကတော့ function ကို ခေါ်တဲ့ သူက နောက်မှ ပေးမယ့် တန်ဖိုး ဖြစ်လို့၊ function ကို
      ကြည့်ရုံနဲ့ ဘာ type ရောက်လာမလဲ ဆိုတာ TypeScript မသိနိုင်ပါဘူး။ function ထဲမှာ ဘယ်လို သုံးထားလဲ ဆိုတာကနေလည်း
      မှန်းပြီး မပေးပါဘူး။ [[mark:type-price]] ဒါကြောင့် parameter တွေမှာ type ကို ကိုယ်တိုင် ရေးပေးရပါတယ်။
      တစ်ခွက်ဈေးရော၊ ခွက် အရေအတွက်ရော ဂဏန်း ဖြစ်ရမှာမို့၊ နှစ်ခုလုံးကို number လို့ ရေးပေးလိုက်ပါမယ်။
      [[mark:read-one-left]]
      Errors မှာ error နှစ်ခု ပျောက်သွားပြီး၊ ငွေပမာဏ parameter အတွက် error တစ်ခုပဲ ကျန်ပါတော့တယ်။ အခု ဒီ
      function ကို စာသားနဲ့ ခေါ်မိရင်၊ TypeScript က ခေါ်တဲ့ နေရာမှာ ချက်ချင်း error ပြပေးပါလိမ့်မယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 4: Essential Types and Annotations (function parameter annotations)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/essential-types-and-annotations",
        }
      - {
          title: "TypeScript Handbook: Everyday Types (parameter type annotations)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#parameter-type-annotations",
        }
    actions:
      - id: select-params
        type: editor.select
        at: { mark: select-params }
        target: { file: src/main.ts, text: "(price, count)", occurrence: 1 }
      - id: type-price
        type: editor.type
        at: { mark: type-price }
        target: { file: src/main.ts, after: "function cupTotal(price", occurrence: 1 }
        text: ": number"
      - id: type-count
        type: editor.type
        at: { afterAction: type-price }
        target:
          { file: src/main.ts, after: "function cupTotal(price: number, count", occurrence: 1 }
        text: ": number"
      - id: expect-one-left
        type: expect.preview
        at: { afterAction: type-count }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-amount-left
        type: expect.preview
        at: { afterAction: expect-one-left }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Parameter 'amount' implicitly has an 'any' type."
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: any
    chapter: "any type ဆိုတာ"
    narration: >
      [[mark:type-query-amount]] ကျန်နေတဲ့ parameter ကို TypeScript က ဘာ type လို့ မြင်နေလဲ မေးကြည့်ရအောင်။
      ငွေပမာဏ parameter ရဲ့ အောက်မှာ query comment တစ်ကြောင်း ထည့်ပါမယ်။ [[mark:read-any]] Types အပိုင်းမှာ
      any လို့ ပြနေပါတယ်။ any type ဆိုတာ ဘာ ဖြစ်ဖြစ် ဖြစ်နိုင်တယ် ဆိုတဲ့ type ဖြစ်ပြီး၊ any ဖြစ်နေတဲ့ တန်ဖိုး
      ပေါ်မှာ TypeScript က ဘာကိုမှ မစစ်တော့ပါဘူး။ ဘယ် method ကို ခေါ်ခေါ်၊ ဘယ် property ကို ဖတ်ဖတ်၊ မှန်တယ်လို့ပဲ
      ယူဆပါတယ်။ [[mark:select-call]] ဒါကြောင့် ဒီ line မှာ program ပျက်သွားခဲ့ပေမယ့်၊ TypeScript ကတော့ ဒီ
      line အကြောင်း ဘာမှ မပြောနိုင်ခဲ့ပါဘူး။ Errors မှာ ပြနေတာကလည်း type မရေးထားလို့ ဆိုတဲ့ error ပဲ ဖြစ်ပြီး၊
      program ပျက်တဲ့ အကြောင်းရင်းကို ညွှန်မပြပါဘူး။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 4: Essential Types and Annotations (the any type)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/essential-types-and-annotations",
        }
      - {
          title: "TypeScript Handbook: Everyday Types (any)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#any",
        }
    actions:
      - id: type-query-amount
        type: editor.type
        at: { mark: type-query-amount }
        target: { file: src/main.ts, after: "function kyat(amount) {\n", occurrence: 1 }
        text: "  //          ^?\n"
      - id: expect-amount-any
        type: expect.preview
        at: { afterAction: type-query-amount }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        attribute: { name: data-type, value: "(parameter) amount: any" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: select-call
        type: editor.select
        at: { mark: select-call }
        target: { file: src/main.ts, text: 'amount.toLocalString("en-US")', occurrence: 1 }

  - id: typo
    chapter: "Type ရေးလိုက်တော့ အမှား ပေါ်လာတယ်"
    narration: >
      [[mark:type-amount]] ငွေပမာဏက ဂဏန်း ဖြစ်ရမှာမို့ number လို့ ရေးပေးလိုက်ပါမယ်။ [[mark:read-typo-error]]
      Types မှာ number ဖြစ်သွားပြီး၊ Errors မှာတော့ error အသစ် တစ်ခု ပေါ်လာပါပြီ။ number မှာ ဒီ နာမည်နဲ့ method
      မရှိဘူးလို့ ပြောပြီး၊ e တစ်လုံး ပိုပါတဲ့ မှန်ကန်တဲ့ method နာမည်ကို ရေးချင်တာလား လို့ အကြံပေးနေပါတယ်။ any
      ဖြစ်နေတုန်းက ဖုံးထားခဲ့တဲ့ စာလုံးပေါင်း အမှားကို၊ type ရေးလိုက်တာနဲ့ TypeScript က ချက်ချင်း ရှာတွေ့သွားတာပါ။
      Output ကတော့ code ကို မပြင်ရသေးလို့ ခုနက အတိုင်း ပျက်နေတုန်းပါ။ [[mark:type-e]] ဒါဆို ကျနေတဲ့ e ကို ထည့်ပြီး
      method နာမည်ကို ပြင်လိုက်ပါမယ်။
      [[mark:read-fixed]] error တွေ အကုန် ပျောက်သွားပြီး၊ Output မှာ လက်ဖက်ရည် ၃၀၀၀ ကျပ် ဆိုပြီး comma နဲ့
      ထွက်လာပါပြီ။ [[mark:explain-any]] ဒါကြောင့် any ကို သတိထားပြီး သုံးရပါတယ်။ parameter မှာ type
      မရေးမိလို့ ဖြစ်ဖြစ်၊ ကိုယ်တိုင် any လို့ ရေးလိုက်လို့ ဖြစ်ဖြစ်၊ အဲဒီ တန်ဖိုးအတွက် TypeScript ရဲ့ စစ်ဆေးမှုကို
      ပိတ်လိုက်တာနဲ့ အတူတူပါပဲ။ [[mark:explicit-any]] ကိုယ်တိုင် any လို့ ရေးရင်တော့ type မရေးထားဘူး ဆိုတဲ့ error တောင်
      မပြတော့ပါဘူး။ TypeScript ၆ ကစပြီး default အနေနဲ့ ဖွင့်ထားတဲ့ strict mode က၊ ကိုယ် မသိလိုက်ဘဲ any
      ဖြစ်သွားတာကို error အနေနဲ့ ပြပေးတာ ဒီ အန္တရာယ်ကြောင့်ပါ။ any က type ရှုပ်လွန်းတဲ့
      နေရာတွေမှာ ခဏ သုံးဖို့ ထွက်ပေါက် တစ်ခုလို ရှိတာ ဖြစ်ပေမယ့်၊ များများ သုံးလေ TypeScript ရဲ့ အကျိုး
      နည်းလေပါပဲ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 4: Essential Types and Annotations (the any type)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/essential-types-and-annotations",
        }
      - {
          title: "TypeScript Handbook: Everyday Types (noImplicitAny)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#noimplicitany",
        }
      - {
          title: "TSConfig Reference: strict",
          url: "https://www.typescriptlang.org/tsconfig/#strict",
        }
    actions:
      - id: type-amount
        type: editor.type
        at: { mark: type-amount }
        target: { file: src/main.ts, after: "function kyat(amount", occurrence: 1 }
        text: ": number"
      - id: expect-typo-one
        type: expect.preview
        at: { afterAction: type-amount }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-typo-code
        type: expect.preview
        at: { afterAction: expect-typo-one }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-code, value: "2551" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-typo-hint
        type: expect.preview
        at: { afterAction: expect-typo-code }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Property 'toLocalString' does not exist on type 'number'. Did you mean 'toLocaleString'?"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-amount-number
        type: expect.preview
        at: { afterAction: expect-typo-hint }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-1 }
        attribute: { name: data-type, value: "(parameter) amount: number" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-still-crash
        type: expect.preview
        at: { afterAction: expect-amount-number }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-2 }
        textContains: "amount.toLocalString is not a function"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-e
        type: editor.type
        at: { mark: type-e }
        target: { file: src/main.ts, after: "amount.toLocal", occurrence: 1 }
        text: "e"
      - id: expect-clean
        type: expect.preview
        at: { afterAction: type-e }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-kyat-output
        type: expect.preview
        at: { afterAction: expect-clean }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-2 }
        textContains: "လက်ဖက်ရည် 3,000 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: inference
    chapter: "Variable တွေမှာ type မရေးလည်း ရတယ်"
    narration: >
      [[mark:type-queries]] အခု variable တွေဘက် ပြန်ကြည့်ရအောင်။ variable သုံးခုလုံးရဲ့ အောက်မှာ query comment
      တစ်ကြောင်းစီ ထည့်ပြီး၊ TypeScript က သူတို့ကို ဘယ်လို နားလည်ထားလဲ မေးကြည့်ပါမယ်။ [[mark:read-inferred]]
      Types အပိုင်းမှာ customer နာမည်ကို string လို့၊ ခွက် အရေအတွက်ကို number လို့၊ ပါဆယ် ယူမလား ဆိုတာကိုတော့
      boolean လို့ ပြနေပါတယ်။ boolean ဆိုတာ true ဒါမှမဟုတ် false နှစ်ခုထဲက တစ်ခုပဲ ဖြစ်နိုင်တဲ့ type ပါ။ ကိုယ်က type
      တစ်ခုမှ မရေးထားပေမယ့်၊ ညီမျှခြင်းရဲ့ ညာဘက်က တန်ဖိုးကို ကြည့်ပြီး TypeScript က infer လုပ်ပေးထားတာပါ။
      [[mark:type-test]] infer လုပ်ထားတဲ့ type ကိုလည်း annotation ရေးထားသလိုပဲ စစ်ပေးလား စမ်းကြည့်ရအောင်။
      ဖိုင်ရဲ့ အောက်ဆုံးမှာ ခွက် အရေအတွက်ထဲကို စာသား ထည့်တဲ့ line တစ်ကြောင်း စမ်းရေးကြည့်ပါမယ်။
      [[mark:read-test-error]] string ကို number နေရာမှာ ထည့်လို့ မရဘူး ဆိုတဲ့ error ပေါ်လာပါပြီ။ TypeScript က
      ခွက် အရေအတွက်ကို number လို့ မှတ်ထားပြီး၊ ကိုယ်တိုင် ရေးထားတဲ့ type လိုပဲ စစ်ပေးတာပါ။
      [[mark:comment-test]] စမ်းကြည့်ပြီးပြီ ဖြစ်လို့ ဒီ line ကို comment လုပ်ပြီး ပိတ်ထားပါမယ်။
      [[mark:read-rule]] ဆိုတော့ မှတ်ထားရမှာက၊ တန်ဖိုး တစ်ခါတည်း ထည့်ပေးတဲ့ variable တွေမှာ TypeScript ရဲ့
      inference ကို ယုံပြီး type မရေးဘဲ ထားလို့ ရတယ်၊ function parameter တွေမှာတော့ type ကို ကိုယ်တိုင်
      ရေးပေးရတယ် ဆိုတာပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 4: Essential Types and Annotations (type inference)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/essential-types-and-annotations",
        }
      - {
          title: "TypeScript Handbook: Everyday Types (type annotations on variables — inference)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#type-annotations-on-variables",
        }
      - {
          title: "TypeScript Handbook: Type Inference",
          url: "https://www.typescriptlang.org/docs/handbook/type-inference.html",
        }
    actions:
      - id: type-query-customer
        type: editor.type
        at: { mark: type-queries }
        target: { file: src/main.ts, after: "let customer = \"မြမြ\";\n", occurrence: 1 }
        text: "//  ^?\n"
      - id: type-query-cups
        type: editor.type
        at: { afterAction: type-query-customer }
        target: { file: src/main.ts, after: "let cups = 2;\n", occurrence: 1 }
        text: "//  ^?\n"
      - id: type-query-takeaway
        type: editor.type
        at: { afterAction: type-query-cups }
        target: { file: src/main.ts, after: "let isTakeaway = false;\n", occurrence: 1 }
        text: "//  ^?\n"
      - id: expect-four-queries
        type: expect.preview
        at: { afterAction: type-query-takeaway }
        timeoutMs: 8000
        target: { by: testId, value: ts-types }
        attribute: { name: data-count, value: "4" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-customer-string
        type: expect.preview
        at: { afterAction: expect-four-queries }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-1 }
        attribute: { name: data-type, value: "let customer: string" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-cups-number
        type: expect.preview
        at: { afterAction: expect-customer-string }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-2 }
        attribute: { name: data-type, value: "let cups: number" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-takeaway-boolean
        type: expect.preview
        at: { afterAction: expect-cups-number }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-3 }
        attribute: { name: data-type, value: "let isTakeaway: boolean" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-test
        type: editor.type
        at: { mark: type-test }
        target: { file: src/main.ts, after: "kyat(cupTotal(1500, cups)));\n", occurrence: 1 }
        text: "cups = \"သုံး\";\n"
      - id: expect-test-error
        type: expect.preview
        at: { afterAction: type-test }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-test-message
        type: expect.preview
        at: { afterAction: expect-test-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Type 'string' is not assignable to type 'number'."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: comment-test
        type: editor.type
        at: { mark: comment-test }
        target: { file: src/main.ts, after: "kyat(cupTotal(1500, cups)));\n", occurrence: 1 }
        text: "// "
      - id: expect-test-gone
        type: expect.preview
        at: { afterAction: comment-test }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: primitives
    chapter: "အခြေခံ type တွေ"
    narration: >
      [[mark:board-primitives]] ခုနက တွေ့ခဲ့တဲ့ string ရယ်၊ number ရယ်၊ boolean ရယ် ဆိုတဲ့ type သုံးခုက
      TypeScript ရဲ့ အခြေခံ type တွေထဲမှာ အသုံးအများဆုံးပါ။ JavaScript ရဲ့ အခြေခံ တန်ဖိုး အမျိုးအစားတွေနဲ့ တစ်ခုချင်း ကိုက်ပါတယ်။
      [[mark:draw-common]] string က စာသား၊ number က ဂဏန်း၊ boolean က true နဲ့ false ပါ။ တခြား programming
      language တချို့မှာ ကိန်းပြည့်နဲ့ ဒသမကိန်းကို type ခွဲထားပေမယ့်၊ TypeScript မှာတော့ ဂဏန်း အားလုံးက number
      တစ်မျိုးတည်းပါ။
      [[mark:draw-empty]] null နဲ့ undefined ကတော့ တန်ဖိုး မရှိတာကို ပြတဲ့ type နှစ်ခုပါ။ null က တန်ဖိုး
      မရှိဘူး ဆိုတာကို တမင် ပြောထားတာ ဖြစ်ပြီး၊ ဥပမာအားဖြင့် ငွေ မချေရသေးတဲ့ အော်ဒါရဲ့ ငွေချေတဲ့ အချိန်ကို null
      ထားတာမျိုးပါ။ undefined ကတော့ တန်ဖိုး ထည့်မပေးရသေးတာပါ။ ပြီးခဲ့တဲ့ lesson မှာ ဈေးနှုန်း ထည့်ဖို့ ကျန်ခဲ့တော့၊
      အဲဒီ parameter က undefined ဖြစ်ပြီး NaN ထွက်ခဲ့တာ မှတ်မိမှာပါ။ နောက် lesson တွေမှာ ဒီ နှစ်ခုကို
      အများကြီး တွေ့ရပါမယ်။ [[mark:draw-rare]] နောက်ဆုံး နှစ်ခုကတော့ သိပ် မသုံးရပါဘူး။ bigint က number နဲ့
      တိတိကျကျ မသိမ်းနိုင်လောက်အောင် ကြီးတဲ့ ကိန်းပြည့်တွေအတွက် ဖြစ်ပြီး၊ symbol ကတော့ ဘယ်တော့မှ မထပ်နိုင်တဲ့
      key တွေ ဖန်တီးဖို့ပါ။ ဒီ type တွေ အားလုံးကို ခုနက ပုံစံအတိုင်း annotation အဖြစ် ရေးလို့ ရပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 4: Essential Types and Annotations (the basic types)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/essential-types-and-annotations",
        }
      - {
          title: "TypeScript Handbook: Everyday Types (the primitives string, number and boolean)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#the-primitives-string-number-and-boolean",
        }
      - {
          title: "TypeScript Handbook: Everyday Types (null and undefined; less common primitives)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#null-and-undefined",
        }
      - {
          title: "MDN: Primitive",
          url: "https://developer.mozilla.org/en-US/docs/Glossary/Primitive",
        }
    actions:
      - id: open-board-b
        type: whiteboard.apply
        at: { mark: board-primitives }
        open: true
        clear: true
        upsertIds: [p-title]
      - id: draw-common
        type: whiteboard.apply
        at: { mark: draw-common }
        upsertIds:
          [
            p-common-box,
            p-string-key,
            p-string-desc,
            p-number-key,
            p-number-desc,
            p-boolean-key,
            p-boolean-desc,
          ]
        drawMs: 3000
      - id: draw-empty
        type: whiteboard.apply
        at: { mark: draw-empty }
        upsertIds: [p-empty-box, p-null-key, p-null-desc, p-undefined-key, p-undefined-desc]
        drawMs: 2200
      - id: draw-rare
        type: whiteboard.apply
        at: { mark: draw-rare }
        upsertIds: [p-bigint-key, p-bigint-desc, p-symbol-key, p-symbol-desc]
        drawMs: 2200

  - id: recap
    narration: >
      [[mark:close-board-b]] ဒါဆို ပြန်ချုပ်ရရင်၊ type annotation ဆိုတာ နာမည်ရဲ့ နောက်မှာ type ကို ရေးပေးတာ
      ဖြစ်ပြီး၊ type နေရာမှာ string ရယ်၊ number ရယ်၊ boolean ရယ်၊ null နဲ့ undefined ရယ် စတဲ့ အခြေခံ type
      တွေကို သုံးပါတယ်။
      [[mark:recap-params]] function parameter တွေမှာ type ကို ကိုယ်တိုင် ရေးပေးရပြီး၊ variable တွေမှာတော့
      TypeScript က တန်ဖိုးကို ကြည့်ပြီး infer လုပ်ပေးလို့ များသောအားဖြင့် ရေးစရာ မလိုပါဘူး။ parameter မှာ type မရှိရင် any
      ဖြစ်သွားပြီး၊ any က စစ်ဆေးမှုကို ပိတ်လိုက်လို့ အမှားတွေကို run တဲ့ အချိန်ကျမှ သိရပါတယ်။ နောက် lesson
      မှာတော့ အော်ဒါ တစ်ခုလို တန်ဖိုး အများကြီး စုထားတဲ့ object တွေကို type ပေးပုံနဲ့ type alias ကို
      ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 4: Essential Types and Annotations",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/essential-types-and-annotations",
        }
      - {
          title: "TypeScript Handbook: Everyday Types",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html",
        }
    actions:
      - id: close-board-b
        type: whiteboard.apply
        at: { mark: close-board-b }
        open: false
      - id: select-recap-params
        type: editor.select
        at: { mark: recap-params }
        target:
          {
            file: src/main.ts,
            text: "function cupTotal(price: number, count: number)",
            occurrence: 1,
          }
      - id: expect-file-params
        type: expect.file
        at: { afterAction: select-recap-params }
        path: src/main.ts
        contains: "function cupTotal(price: number, count: number) {"
      - id: expect-file-kyat
        type: expect.file
        at: { afterAction: expect-file-params }
        path: src/main.ts
        contains: "function kyat(amount: number) {\n  //          ^?\n  return amount.toLocaleString(\"en-US\") + \" ကျပ်\";"
      - id: expect-file-queries
        type: expect.file
        at: { afterAction: expect-file-kyat }
        path: src/main.ts
        contains: "let customer = \"မြမြ\";\n//  ^?\nlet cups = 2;\n//  ^?\nlet isTakeaway = false;\n//  ^?\n"
      - id: expect-file-test
        type: expect.file
        at: { afterAction: expect-file-queries }
        path: src/main.ts
        contains: '// cups = "သုံး";'
checks:
  - { type: timing.p95Ms, max: 300 }
