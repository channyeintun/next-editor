build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 2620

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  - id: opening
    chapter: "နောက်ဆုံး lesson"
    narration: >
      [[mark:p01]] ပြီးခဲ့တဲ့ lesson မှာ keyboard၊ contrast နဲ့ စာလုံးကြား အကွာအဝေးတွေကို လက်နဲ့ စစ်ပြီး၊ tool တွေ မတွေ့တဲ့
      ပြဿနာတွေကို ရှာခဲ့ပါတယ်။ ဒီ course ရဲ့ နောက်ဆုံး lesson မှာတော့ assistive technology နဲ့ စစ်တာ၊
      အထူးသဖြင့် screen reader နဲ့ စစ်တာကို ကြည့်ပါမယ်။ [[mark:start-server]] ပြီးရင် ဆိုင်ရဲ့ page မှာ
      ကျန်နေတဲ့ ပြဿနာ ငါးမျိုးကို screen reader ဖတ်မယ့် ပုံစံနဲ့ ရှာပြီး ပြင်ကြည့်ပါမယ်။ နောက်ဆုံးမှာတော့
      course တစ်ခုလုံးကို ပြန်ချုပ်ပါမယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: Assistive Technology testing",
          url: "https://web.dev/learn/accessibility/test-assistive-technology",
        }
      - {
          title: "web.dev Learn Accessibility: Manual accessibility testing",
          url: "https://web.dev/learn/accessibility/test-manual",
        }
    actions:
      - { id: show-p01, type: slide.show, at: { mark: p01, offsetMs: -1450 }, slideId: l20_p01 }
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: at-kinds
    chapter: "Assistive technology"
    narration: >
      [[mark:p02]] assistive technology ဆိုတာ မသန်စွမ်းသူတွေ device ကို သုံးဖို့ အကူအညီပေးတဲ့ software နဲ့
      hardware ပါ။ ခေါင်းမှာ တပ်ထားတဲ့ ဒါမှမဟုတ် ပါးစပ်နဲ့ ကိုက်ထားတဲ့ တုတ်၊ မှန်ဘီလူး လို ရိုးရှင်းတဲ့ ပစ္စည်းတွေကနေ၊ အသံနဲ့
      ခိုင်းတဲ့ device၊ eye tracking လို high-tech တွေအထိ ရှိပါတယ်။ [[mark:at-hw]] switch ခလုတ်၊ braille display လို hardware
      တွေနဲ့ screen reader၊ live caption လို software တွေလည်း ရှိပါတယ်။ အမျိုးမျိုးနဲ့ စမ်းတာ ကောင်းပေမယ့်၊
      ဒီနေ့တော့ screen reader ကို အဓိက ကြည့်ပါမယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: Assistive Technology testing (types of AT)",
          url: "https://web.dev/learn/accessibility/test-assistive-technology",
        }
      - {
          title: "W3C WAI: Tools and Techniques (assistive technologies)",
          url: "https://www.w3.org/WAI/people-use-web/tools-techniques/",
        }
    actions:
      - { id: show-p02, type: slide.show, at: { mark: p02 }, slideId: l20_p02 }

  - id: sr-basics
    chapter: "Screen reader နဲ့ browser"
    narration: >
      [[mark:p03]] screen reader က browser ဆီကနေ page ရဲ့ accessibility tree ကို ယူဖတ်ပြီး၊ အသံ ဒါမှမဟုတ်
      braille အဖြစ် ပြောင်းပေးတဲ့ software ပါ။ မျက်မမြင်တွေ၊ မမြင် မကြားသူတွေအတွက် မရှိမဖြစ် လိုပြီး၊ အမြင် အားနည်းသူ၊ စာဖတ်ရ ခက်သူတွေလည်း
      သုံးကြပါတယ်။ [[mark:sr-pairs]] screen reader တစ်ခုစီက သူနဲ့ ကိုက်တဲ့ browser နဲ့ တွဲမှ အကောင်းဆုံး အလုပ်လုပ်ပါတယ်။ Windows မှာ အခမဲ့ရတဲ့ NVDA နဲ့ ပိုက်ဆံပေးရတဲ့ JAWS ကို Chrome၊ Firefox နဲ့၊ Windows မှာ ပါပြီးသား Narrator ကို Edge နဲ့၊ Mac
      မှာ ပါပြီးသား VoiceOver ကို Safari နဲ့ တွဲသုံးကြပါတယ်။ [[mark:p03b]] ဖုန်းမှာတော့ iPhone၊ iPad မှာ
      VoiceOver ကို Safari နဲ့၊ Android မှာ TalkBack ကို Chrome နဲ့ သုံးပါတယ်။ မကိုက်တဲ့ browser နဲ့ တွဲရင်
      မမျှော်လင့်တဲ့ bug တွေ ပိုတွေ့နိုင်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: Assistive Technology testing — Browser compatibility",
          url: "https://web.dev/learn/accessibility/test-assistive-technology#browser_compatibility",
        }
      - {
          title: "NV Access: NVDA (free screen reader for Windows)",
          url: "https://www.nvaccess.org/",
        }
      - {
          title: "Freedom Scientific: JAWS (commercial screen reader for Windows)",
          url: "https://www.freedomscientific.com/products/software/jaws/",
        }
      - {
          title: "Microsoft: Complete guide to Narrator",
          url: "https://support.microsoft.com/en-us/windows/complete-guide-to-narrator-e4397a0d-ef4f-b386-d8ae-c172f109bdb1",
        }
      - {
          title: "Apple: VoiceOver User Guide for Mac",
          url: "https://support.apple.com/guide/voiceover/welcome/mac",
        }
      - {
          title: "Google: Get started on Android with TalkBack",
          url: "https://support.google.com/accessibility/android/answer/6283677",
        }
    actions:
      - { id: show-p03, type: slide.show, at: { mark: p03 }, slideId: l20_p03 }
      - { id: show-p03b, type: slide.show, at: { mark: p03b }, slideId: l20_p03b }

  - id: commands
    chapter: "Command တချို့"
    narration: >
      [[mark:p04]] screen reader ကို စသုံးရင် command အနည်းငယ်ကို အရင် လေ့ကျင့်ပါ။ NVDA မှာ command အများစုက
      Insert key နဲ့ စပြီး၊ VoiceOver မှာတော့ Control နဲ့ Option ကို တွဲနှိပ်ပြီး စပါတယ်၊ အဲဒီ နှစ်ခုကို VO
      လို့ ရေးကြပါတယ်။ [[mark:p04b]] စဖတ်ခိုင်းချင်ရင် NVDA မှာ Insert နဲ့ down arrow၊ VoiceOver မှာ VO နဲ့ A
      ကို နှိပ်ပါတယ်။ ဖတ်နေတာကို ရပ်ချင်ရင် နှစ်ခုလုံးမှာ Control ကို နှိပ်ပါ။ heading တစ်ခုကနေ နောက်တစ်ခုကို
      ခုန်ချင်ရင် NVDA မှာ H ကို နှိပ်ရုံပါပဲ။ [[mark:p04c]] landmark အတွက် D၊ form field အတွက် F ကို
      နှိပ်ပြီး၊ link၊ heading၊ landmark တွေကို စာရင်းလုပ်ပြတဲ့ command လည်း ရှိပါတယ်။ VoiceOver မှာ အဲဒီ
      စာရင်းကို rotor လို့ ခေါ်ပါတယ်။ [[mark:p05]] ဖုန်းမှာတော့ လက်နဲ့ ထိပြီး သုံးပါတယ်။ လက်တစ်ချောင်း ဆွဲရင်
      လက်အောက်က အရာကို ဖတ်ပြပြီး၊ နှစ်ချက် ဆက်တိုက် တို့ရင် နှိပ်ပါတယ်။ လက်တစ်ချောင်းနဲ့ ဘယ်ညာ ပွတ်ရင်
      ရှေ့တစ်ခု၊ နောက်တစ်ခုကို ရွှေ့ပြီး၊ page ကို scroll လုပ်ဖို့ TalkBack မှာ လက် နှစ်ချောင်း၊ VoiceOver မှာ
      လက် သုံးချောင်းနဲ့ အပေါ်အောက် ပွတ်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: Assistive Technology testing — Screen reader commands",
          url: "https://web.dev/learn/accessibility/test-assistive-technology#screen_reader_commands",
        }
      - {
          title: "Deque University: Screen reader keyboard shortcuts and gestures",
          url: "https://dequeuniversity.com/screenreaders/",
        }
      - {
          title: "NV Access: NVDA User Guide",
          url: "https://www.nvaccess.org/files/nvda/documentation/userGuide.html",
        }
      - {
          title: "Apple: VoiceOver User Guide for Mac",
          url: "https://support.apple.com/guide/voiceover/welcome/mac",
        }
    actions:
      - { id: show-p04, type: slide.show, at: { mark: p04 }, slideId: l20_p04 }
      - { id: show-p04b, type: slide.show, at: { mark: p04b }, slideId: l20_p04b }
      - { id: show-p04c, type: slide.show, at: { mark: p04c }, slideId: l20_p04c }
      - { id: show-p05, type: slide.show, at: { mark: p05 }, slideId: l20_p05 }

  - id: goal
    narration: >
      [[mark:p06]] ဒီမှာ သတိထားရမှာက၊ screen reader နဲ့ စမ်းတဲ့ ရည်ရွယ်ချက်က သုံးသူရဲ့ အတွေ့အကြုံကို
      အတုလုပ်ဖို့ မဟုတ်ပါဘူး။ နေ့တိုင်း သုံးနေတဲ့ သူလို ကျွမ်းကျင်ဖို့ မလိုဘဲ၊ command နည်းနည်းနဲ့ code ထဲက
      ပြဿနာတွေကို ရှာဖို့ပါ။ သုံးသူတွေရဲ့ တကယ့် အတွေ့အကြုံကိုတော့ သူတို့ကို တိုက်ရိုက် မေးရပါမယ်၊ နှစ်ခုလုံး
      လိုပါတယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: Assistive Technology testing — Screen reader commands (goal of testing)",
          url: "https://web.dev/learn/accessibility/test-assistive-technology#screen_reader_commands",
        }
      - {
          title: "W3C WAI: Involving Users in Evaluating Web Accessibility",
          url: "https://www.w3.org/WAI/test-evaluate/involving-users/",
        }
    actions:
      - { id: show-p06, type: slide.show, at: { mark: p06 }, slideId: l20_p06 }

  - id: other-at
    narration: >
      [[mark:p07]] တခြား assistive technology တွေနဲ့လည်း စမ်းကြည့်ပါ။ screen magnifier ဒါမှမဟုတ် browser zoom နဲ့
      ချဲ့ကြည့်ရင် အကြောင်းအရာ အားလုံးကို မြင်ရရမှာ ဖြစ်ပြီး၊ ၂၀၀ ရာခိုင်နှုန်း၊ ၄၀၀ ရာခိုင်နှုန်းမှာ page က
      ပြတ်မသွားရပါဘူး။ voice control သုံးသူက မြင်ရတဲ့ စာကို ပြောပြီး
      နှိပ်လို့၊ ခလုတ်ရဲ့ name ထဲမှာ မြင်ရတဲ့ စာ ပါရပါမယ်။ keyboard နဲ့ အကုန် သုံးလို့ရတဲ့ page ဆိုရင်တော့
      switch သုံးသူအတွက်လည်း အဆင်ပြေဖို့ များပါတယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: Assistive Technology testing",
          url: "https://web.dev/learn/accessibility/test-assistive-technology",
        }
      - {
          title: "WCAG 2.2 Understanding: Reflow",
          url: "https://www.w3.org/WAI/WCAG22/Understanding/reflow",
        }
      - {
          title: "WCAG 2.2 Understanding: Label in Name",
          url: "https://www.w3.org/WAI/WCAG22/Understanding/label-in-name",
        }
      - {
          title: "W3C WAI: Tools and Techniques (switch access, voice recognition, magnification)",
          url: "https://www.w3.org/WAI/people-use-web/tools-techniques/",
        }
    actions:
      - { id: show-p07, type: slide.show, at: { mark: p07 }, slideId: l20_p07 }

  - id: capstone
    chapter: "Tree ကို screen reader လို ဖတ်ကြည့်ရအောင်"
    narration: >
      ဒါဆို ဆိုင်ရဲ့ page ကို စစ်ကြည့်ရအောင်။ ဒါက ဆိုင်ရဲ့ HTML ဖိုင်ပါ။ အပေါ်မှာ
      ဆိုင်နာမည်နဲ့ မှာယူရန် link၊ အလယ်မှာ ယနေ့အထူး၊ အောက်ဆုံးမှာ နာမည် ထည့်တဲ့ form ရှိပါတယ်။
      [[mark:preview-ready]] ညာဘက်မှာ ဆိုင်ရဲ့ page နဲ့ accessibility panel ကို မြင်ရပါပြီ။ ဒီ lesson ထဲမှာ
      screen reader အစစ်ကို ဖွင့်ပြလို့ မရပေမယ့်၊ screen reader က ယူဖတ်တဲ့ accessibility tree ကိုတော့ panel
      မှာ မြင်ရပါတယ်။ ဒါကြောင့် row တွေကို အပေါ်ကနေ အောက် ဖတ်ကြည့်ရင်၊ screen reader က ဘာ ဖတ်ပြမလဲ
      ခန့်မှန်းလို့ ရပါတယ်။ [[mark:look-rows]] summary မှာ warning တစ်ခုပဲ ပြပေမယ့်၊ သေချာ ဖတ်ကြည့်ရင် ပြဿနာ
      ငါးမျိုး ရှိနေပါတယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: Assistive Technology testing — Screen reader testing demo",
          url: "https://web.dev/learn/accessibility/test-assistive-technology#screen_reader_testing_demo",
        }
      - {
          title: "Chrome DevTools: Accessibility features reference (accessibility tree)",
          url: "https://developer.chrome.com/docs/devtools/accessibility/reference#tree",
        }
    actions:
      - { id: close-p07, type: slide.close, at: { scene: start, offsetMs: -400 } }
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { mark: preview-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-dev-server }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-one-warning
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: a11y-summary }
        attribute: { name: data-warnings, value: "1" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: collapse-runner-dock
        type: runtime.collapseDock
        at: { afterAction: expect-one-warning }
      - id: expect-cup-unnamed
        type: expect.preview
        at: { mark: look-rows }
        timeoutMs: 5000
        target: { by: testId, value: a11y-hero-cup }
        textContains: "img ⚠ no name"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-more-vague
        type: expect.preview
        at: { afterAction: expect-cup-unnamed }
        timeoutMs: 5000
        target: { by: testId, value: a11y-more-link }
        attribute: { name: data-name, value: "ဆက်ဖတ်ရန်" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-order-emoji
        type: expect.preview
        at: { afterAction: expect-more-vague }
        timeoutMs: 5000
        target: { by: testId, value: a11y-order-link }
        textContains: 'link "☕ မှာယူရန်"'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-name-placeholder
        type: expect.preview
        at: { afterAction: expect-order-emoji }
        timeoutMs: 5000
        target: { by: testId, value: a11y-input-name }
        textContains: 'textbox "ဥပမာ မြမြ" from placeholder'
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: fix-structure
    chapter: "ပြဿနာ ငါးမျိုးကို ပြင်ရအောင်"
    narration: >
      [[mark:select-div]] ပထမ ပြဿနာက content structure ပါ။ tree ထဲမှာ main landmark မရှိပါဘူး။ code ကို ကြည့်ရင်
      page ရဲ့ အဓိက အပိုင်းကို ရိုးရိုး div နဲ့ပဲ ဆောက်ထားပါတယ်။ [[mark:select-title]] ယနေ့အထူး ဆိုတဲ့
      ခေါင်းစဉ်ကလည်း class နဲ့ ကြီးကြီး ပြထားတဲ့ span ပဲ ဖြစ်လို့ heading row မပေါ်ပါဘူး။ screen reader သုံးသူက
      landmark နဲ့ heading ကို ခုန်ပြီး ရှာကြလို့၊ ဒါတွေ မရှိရင် page တစ်ခုလုံးကို အစကနေ နားထောင်ရပါတယ်။
      [[mark:open-main]] div ကို main element နဲ့ အပြင်ကနေ ထုပ်ပါမယ်။ အဖွင့် tag ကို div ရဲ့ အပေါ်မှာ၊
      [[mark:close-main]] အပိတ် tag ကို div ရဲ့ အောက်မှာ ထည့်ပါတယ်။ [[mark:after-main]] tree ထဲမှာ main row
      ပေါ်လာပါပြီ။ [[mark:close-h2]] ခေါင်းစဉ်ကိုလည်း heading level နှစ်နဲ့ ထုပ်ပါမယ်။ span ရဲ့ နောက်မှာ အပိတ် tag
      ကို အရင် ထည့်ပြီး၊ [[mark:open-h2]] ရှေ့မှာ အဖွင့် tag ကို ထည့်ပါတယ်။ [[mark:after-h2]] heading level
      နှစ်၊ ယနေ့အထူး ဆိုတဲ့ row ပေါ်လာပါပြီ။ page ကတော့ အရင်အတိုင်းပဲ မြင်ရပေမယ့်၊ screen reader သုံးသူအတွက်
      ခုန်လို့ရတဲ့ နေရာတွေ ရလာပါပြီ။ ကိုယ့် code မှာဆိုရင်တော့ span ကို heading element နဲ့ တိုက်ရိုက် အစားထိုးလို့လည်း ရပါတယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: Assistive Technology testing — Issue 1: Content structure",
          url: "https://web.dev/learn/accessibility/test-assistive-technology#issue_1_content_structure",
        }
      - {
          title: "web.dev Learn Accessibility: Content structure",
          url: "https://web.dev/learn/accessibility/structure",
        }
      - {
          title: "MDN: <main>",
          url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/main",
        }
    actions:
      - id: select-div
        type: editor.select
        at: { mark: select-div }
        target: { file: index.html, text: '<div class="page" data-testid="page">', occurrence: 1 }
      - id: select-title
        type: editor.select
        at: { mark: select-title }
        target:
          {
            file: index.html,
            text: '<span class="section-title" data-testid="special-title">ယနေ့အထူး</span>',
            occurrence: 1,
          }
      - id: open-main
        type: editor.type
        at: { mark: open-main }
        cadence: block
        target: { file: index.html, after: "  <body>\n", occurrence: 1 }
        text: "    <main data-testid=\"main\">\n"
      - id: close-main
        type: editor.type
        at: { mark: close-main }
        cadence: block
        target: { file: index.html, after: "      </form>\n    </div>", occurrence: 1 }
        text: "\n    </main>"
      - id: expect-main-row
        type: expect.preview
        at: { mark: after-main }
        timeoutMs: 5000
        target: { by: testId, value: a11y-main }
        textContains: "main"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: close-h2
        type: editor.type
        at: { mark: close-h2 }
        cadence: block
        target:
          { file: index.html, after: 'data-testid="special-title">ယနေ့အထူး</span>', occurrence: 1 }
        text: "</h2>"
      - id: open-h2
        type: editor.type
        at: { mark: open-h2 }
        cadence: block
        target:
          {
            file: index.html,
            after: "<section class=\"special\" data-testid=\"special\">\n        ",
            occurrence: 1,
          }
        text: '<h2 data-testid="special-heading">'
      - id: expect-h2-row
        type: expect.preview
        at: { mark: after-h2 }
        timeoutMs: 5000
        target: { by: testId, value: a11y-special-heading }
        textContains: 'heading level 2 "ယနေ့အထူး"'
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: fix-link
    narration: >
      [[mark:select-more]] ဒုတိယက link ရဲ့ context ပါ။ link ရဲ့ name က ဆက်ဖတ်ရန် ဆိုတာပဲ ဖြစ်နေပါတယ်။ page ကို
      ကြည့်နေတဲ့ သူက ဘာကို ဆက်ဖတ်မလဲ သိပေမယ့်၊ screen reader ရဲ့ link စာရင်းကနေ နားထောင်တဲ့ သူကတော့ ဆက်ဖတ်ရန်
      ဆိုတာပဲ ကြားရမှာပါ။ [[mark:type-label]] ဒါကြောင့် aria label နဲ့ context ထည့်ပါမယ်။ aria label က link
      ရဲ့ စာသားကို အစားထိုးလို့၊ မြင်ရတဲ့ ဆက်ဖတ်ရန် ဆိုတဲ့ စကားကို ရှေ့ဆုံးမှာ ထားပါတယ်။ ဒါမှ voice control
      သုံးသူကလည်း ဆက်ဖတ်ရန် လို့ ပြောပြီး နှိပ်နိုင်မှာပါ။ [[mark:after-label]] link ရဲ့ name
      ပြည့်စုံသွားပါပြီ။ မြင်ရတဲ့ link စာသားကိုယ်တိုင် ရှင်းအောင် ရေးရင်တော့ စာဖတ်ရ ခက်တဲ့ သူတွေအတွက်ပါ
      ပိုကောင်းပါတယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: Assistive Technology testing — Issue 2: Link context",
          url: "https://web.dev/learn/accessibility/test-assistive-technology#issue_2_link_context",
        }
      - {
          title: "WCAG 2.2 Understanding: Link Purpose (In Context)",
          url: "https://www.w3.org/WAI/WCAG22/Understanding/link-purpose-in-context",
        }
      - {
          title: "WCAG 2.2 Understanding: Label in Name",
          url: "https://www.w3.org/WAI/WCAG22/Understanding/label-in-name",
        }
      - {
          title: "MDN: aria-label",
          url: "https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Attributes/aria-label",
        }
    actions:
      - id: select-more
        type: editor.select
        at: { mark: select-more }
        target:
          {
            file: index.html,
            text: '<a href="/special.html" data-testid="more-link">ဆက်ဖတ်ရန်</a>',
            occurrence: 1,
          }
      - id: type-label
        type: editor.type
        at: { mark: type-label }
        cadence: block
        target: { file: index.html, after: '<a href="/special.html"', occurrence: 1 }
        text: ' aria-label="ဆက်ဖတ်ရန်၊ ယနေ့အထူး မုန့်ဟင်းခါး"'
      - id: expect-more-named
        type: expect.preview
        at: { mark: after-label }
        timeoutMs: 5000
        target: { by: testId, value: a11y-more-link }
        attribute: { name: data-name, value: "ဆက်ဖတ်ရန်၊ ယနေ့အထူး မုန့်ဟင်းခါး" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: fix-image
    narration: >
      [[mark:select-cup]] တတိယက အလှဆင် ပုံပါ။ ဆိုင်နာမည်ရဲ့ အပေါ်က ခွက်ပုံမှာ alt text မပါလို့၊ tree ထဲမှာ name မရှိတဲ့
      img အဖြစ် ပေါ်နေပြီး၊ screen reader က ဖိုင်နာမည်ကို ဖတ်ပြနိုင်ပါတယ်။ ဒီ ပုံက အလှအတွက်ပဲ ဖြစ်လို့၊ [[mark:type-alt]] alt text ကို အလွတ် ထည့်ပါမယ်။ [[mark:after-alt]] img row ပျောက်သွားပြီး၊ summary မှာ warning
      မရှိတော့ပါဘူး။ page ထဲမှာ တိုက်ရိုက် ရေးထားတဲ့ SVG ပုံ ဆိုရင်တော့ aria hidden ဒါမှမဟုတ် role presentation ပေးပြီး ဖျောက်နိုင်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: Assistive Technology testing — Issue 3: Decorative image",
          url: "https://web.dev/learn/accessibility/test-assistive-technology#issue_3_decorative_image",
        }
      - {
          title: "W3C WAI Images Tutorial: Decorative Images",
          url: "https://www.w3.org/WAI/tutorials/images/decorative/",
        }
    actions:
      - id: select-cup
        type: editor.select
        at: { mark: select-cup }
        target: { file: index.html, text: '<img class="hero-cup" src="/cup.svg"', occurrence: 1 }
      - id: type-alt
        type: editor.type
        at: { mark: type-alt }
        cadence: block
        target: { file: index.html, after: '<img class="hero-cup" src="/cup.svg"', occurrence: 1 }
        text: ' alt=""'
      - id: expect-no-warnings
        type: expect.preview
        at: { mark: after-alt }
        timeoutMs: 5000
        target: { by: testId, value: a11y-summary }
        attribute: { name: data-warnings, value: "0" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: fix-decoration
    narration: >
      [[mark:select-deco]] warning မရှိတော့ပေမယ့် မပြီးသေးပါဘူး။ မှာယူရန် link ရဲ့ row ကို ကြည့်ပါ။ name ရဲ့
      ရှေ့မှာ ခွက် emoji ပါနေပါတယ်။ မျက်စိနဲ့ ကြည့်ရင် အလှဆင် သင်္ကေတ လေးပဲ ဖြစ်ပေမယ့်၊ screen reader
      က emoji ရဲ့ နာမည်ကို အရင် ဖတ်ပြမှာ ဖြစ်လို့ နားထောင်ရတာ အနှောင့်အယှက် ဖြစ်ပါတယ်။
      [[mark:type-hidden]] emoji ကို ထုပ်ထားတဲ့ span ကိုပဲ aria hidden ပေးပါမယ်။ [[mark:after-hidden]] link ရဲ့
      name က မှာယူရန် ပဲ ကျန်ပါတော့တယ်။ သတိထားရမှာက aria hidden ကို link တစ်ခုလုံး ဒါမှမဟုတ် စာပိုဒ် တစ်ခုလုံးမှာ
      မပေးရပါဘူး၊ ပေးလိုက်ရင် စာသား အားလုံးပါ ပျောက်သွားမှာပါ။
    sources:
      - {
          title: "web.dev Learn Accessibility: Assistive Technology testing — Issue 4: Bullet decoration",
          url: "https://web.dev/learn/accessibility/test-assistive-technology#issue_4_bullet_decoration",
        }
      - {
          title: "MDN: aria-hidden",
          url: "https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Attributes/aria-hidden",
        }
      - {
          title: "Unicode CLDR: emoji names and keywords",
          url: "https://cldr.unicode.org/translation/characters/short-names-and-keywords",
        }
    actions:
      - id: select-deco
        type: editor.select
        at: { mark: select-deco }
        target: { file: index.html, text: '<span class="deco">☕</span>', occurrence: 1 }
      - id: type-hidden
        type: editor.type
        at: { mark: type-hidden }
        cadence: block
        target: { file: index.html, after: '<span class="deco"', occurrence: 1 }
        text: ' aria-hidden="true"'
      - id: expect-order-clean
        type: expect.preview
        at: { mark: after-hidden }
        timeoutMs: 5000
        target: { by: testId, value: a11y-order-link }
        attribute: { name: data-name, value: "မှာယူရန်" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: fix-form
    narration: >
      [[mark:select-input]] နောက်ဆုံးက form field ပါ။ နာမည် အကွက်ရဲ့ row မှာ from placeholder လို့ ပြနေပါတယ်။
      label မရှိလို့ browser က placeholder ကို name အဖြစ် ယူထားတာပါ။ placeholder က စာရိုက်လိုက်တာနဲ့
      ပျောက်သွားပြီး၊ screen reader တချို့ကလည်း ကောင်းကောင်း မဖတ်ပေးပါဘူး။ [[mark:type-label-el]] input ရဲ့
      ရှေ့မှာ နာမည် ဆိုတဲ့ label element ကို ထည့်ပြီး for attribute နဲ့ ချိတ်ပါမယ်။ [[mark:scroll-form]] page
      ကို အောက်ဆင်း ကြည့်ရအောင်။ [[mark:after-label-el]] အကွက်ရဲ့ အပေါ်မှာ label ပေါ်လာပြီး၊ tree ထဲမှာလည်း
      textbox ရဲ့ name က နာမည် ဖြစ်သွားပါပြီ။
    sources:
      - {
          title: "web.dev Learn Accessibility: Assistive Technology testing — Issue 5: Form field",
          url: "https://web.dev/learn/accessibility/test-assistive-technology#issue_5_form_field",
        }
      - {
          title: "web.dev Learn Accessibility: Forms",
          url: "https://web.dev/learn/accessibility/forms",
        }
      - {
          title: "W3C WAI Forms Tutorial: Labeling Controls",
          url: "https://www.w3.org/WAI/tutorials/forms/labels/",
        }
    actions:
      - id: select-input
        type: editor.select
        at: { mark: select-input }
        target:
          {
            file: index.html,
            text: '<input id="name" name="name" type="text" autocomplete="name" placeholder="ဥပမာ မြမြ"',
            occurrence: 1,
          }
      - id: type-label-el
        type: editor.type
        at: { mark: type-label-el }
        cadence: block
        target:
          {
            file: index.html,
            after: "<form class=\"order-form\" id=\"order\" data-testid=\"order-form\">\n",
            occurrence: 1,
          }
        text: "        <label for=\"name\">နာမည်</label>\n"
      - id: scroll-form
        type: preview.scroll
        at: { mark: scroll-form }
        timeoutMs: 5000
        top: 5000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-name-labelled
        type: expect.preview
        at: { mark: after-label-el }
        timeoutMs: 5000
        target: { by: testId, value: a11y-input-name }
        attribute: { name: data-name, value: "နာမည်" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-file-main
        type: expect.file
        at: { afterAction: expect-name-labelled }
        path: index.html
        contains: "    <main data-testid=\"main\">\n    <div class=\"page\" data-testid=\"page\">"
      - id: expect-file-h2
        type: expect.file
        at: { afterAction: expect-file-main }
        path: index.html
        contains: '<h2 data-testid="special-heading"><span class="section-title" data-testid="special-title">ယနေ့အထူး</span></h2>'
      - id: expect-file-link
        type: expect.file
        at: { afterAction: expect-file-h2 }
        path: index.html
        contains: '<a href="/special.html" aria-label="ဆက်ဖတ်ရန်၊ ယနေ့အထူး မုန့်ဟင်းခါး" data-testid="more-link">ဆက်ဖတ်ရန်</a>'
      - id: expect-file-cup
        type: expect.file
        at: { afterAction: expect-file-link }
        path: index.html
        contains: '<img class="hero-cup" src="/cup.svg" alt=""'
      - id: expect-file-deco
        type: expect.file
        at: { afterAction: expect-file-cup }
        path: index.html
        contains: '<span class="deco" aria-hidden="true">☕</span> မှာယူရန်'
      - id: expect-file-label
        type: expect.file
        at: { afterAction: expect-file-deco }
        path: index.html
        contains: "<label for=\"name\">နာမည်</label>\n        <input id=\"name\""

  - id: quiz
    chapter: "Quiz"
    narration: >
      [[mark:p08]] မေးခွန်း တစ်ခု မေးပါရစေ။ screen reader နဲ့ စမ်းတဲ့ အဓိက ရည်ရွယ်ချက်က ဘာလဲ။ lesson ကို pause
      လုပ်ပြီး စဉ်းစားကြည့်ပါ။ [[mark:p08b]] အဖြေကတော့ B ပါ။ code ထဲက ပြဿနာတွေကို ရှာဖို့ပါ။ screen reader သုံးသူရဲ့
      အတွေ့အကြုံကိုတော့ သူတို့ကို တိုက်ရိုက် မေးရပြီး၊ automated tool တွေ မတွေ့တဲ့ ပြဿနာကို ရှာဖို့ ဒီ စမ်းသပ်မှုက
      လိုပါတယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: Assistive Technology testing",
          url: "https://web.dev/learn/accessibility/test-assistive-technology",
        }
      - {
          title: "web.dev Learn Accessibility: Automated accessibility testing",
          url: "https://web.dev/learn/accessibility/test-automated",
        }
    actions:
      - { id: show-p08, type: slide.show, at: { mark: p08 }, slideId: l20_p08 }
      - { id: show-p08b, type: slide.show, at: { mark: p08b }, slideId: l20_p08b }

  - id: course-recap
    chapter: "Course ကို ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:p09]] ဒါဆို course တစ်ခုလုံးကို ပြန်ကြည့်ရအောင်။ accessibility ဆိုတာ ဘာလဲ၊ WCAG နဲ့ POUR နဲ့
      ဘယ်လို တိုင်းတာလဲ ဆိုတဲ့ အခြေခံကနေ စခဲ့ပြီး၊ semantic HTML၊ ARIA၊ landmark၊ heading တွေနဲ့ page ရဲ့
      structure ကို ဆောက်ခဲ့ပါတယ်။ [[mark:p09b]] keyboard၊ JavaScript၊ form တွေကို လူတိုင်း သုံးနိုင်အောင်
      လုပ်ခဲ့ပြီး၊ ပုံ၊ အရောင်၊ motion၊ စာလုံး၊ video တွေကို လူတိုင်း မြင်နိုင်၊ ကြားနိုင်အောင် ပြင်ခဲ့ပါတယ်။
      [[mark:p09c]] နောက်ဆုံးမှာ design အဆင့်ကနေ tool၊ လက်၊ screen reader နဲ့ စစ်တဲ့ အထိ ကြည့်ခဲ့ပါတယ်။
      [[mark:p10]] ဆက်လေ့လာချင်ရင် W3C ရဲ့ Web Accessibility Initiative၊ WebAIM၊ MDN နဲ့ checklist တွေ
      စုထားတဲ့ project တစ်ခုကို page ပေါ်မှာ ပြထားပါတယ်။
    sources:
      - {
          title: "web.dev Learn Accessibility: Conclusion and next steps",
          url: "https://web.dev/learn/accessibility/conclusion",
        }
      - { title: "W3C Web Accessibility Initiative (WAI)", url: "https://www.w3.org/WAI/" }
      - { title: "WebAIM", url: "https://webaim.org/" }
      - { title: "The A11Y Project", url: "https://www.a11yproject.com/" }
      - {
          title: "MDN: Accessibility",
          url: "https://developer.mozilla.org/en-US/docs/Web/Accessibility",
        }
    actions:
      - { id: show-p09, type: slide.show, at: { mark: p09 }, slideId: l20_p09 }
      - { id: show-p09b, type: slide.show, at: { mark: p09b }, slideId: l20_p09b }
      - { id: show-p09c, type: slide.show, at: { mark: p09c }, slideId: l20_p09c }
      - { id: show-p10, type: slide.show, at: { mark: p10 }, slideId: l20_p10 }

  - id: thanks
    narration: >
      [[mark:p11]] နောက်ဆုံး မှတ်ထားစေချင်တာက၊ accessibility က project ရဲ့ အဆုံးမှာ တစ်ခါ စစ်ပြီး ပြီးသွားတာ
      မဟုတ်ပါဘူး။ plan၊ design၊ code၊ test အဆင့်တိုင်းမှာ ထည့်စဉ်းစားပြီး၊ မသန်စွမ်းသူတွေကို အစကတည်းက
      ပါဝင်စေရပါမယ်။ test တွေ အကုန် pass ဖြစ်တာနဲ့ အပြည့်အဝ accessible ဖြစ်ပြီလို့ မဆိုနိုင်လို့၊
      ဆက်လေ့လာ၊ ဆက်စမ်းသပ်နေရပါမယ်။ [[mark:p12]] ကိုယ့် website တွေကို လူတိုင်း သုံးနိုင်အောင် အတူတူ
      ဆောက်ကြရအောင်။ ဒီ course ကို အဆုံးထိ လေ့လာပေးတဲ့အတွက် ကျေးဇူးတင်ပါတယ် ခင်ဗျာ။
    sources:
      - {
          title: "web.dev Learn Accessibility: Conclusion and next steps",
          url: "https://web.dev/learn/accessibility/conclusion",
        }
      - {
          title: "web.dev Learn Accessibility: Assistive Technology testing — Wrap up",
          url: "https://web.dev/learn/accessibility/test-assistive-technology#wrap_up",
        }
      - {
          title: "W3C WAI: Involving Users in Web Projects for Better, Easier Accessibility",
          url: "https://www.w3.org/WAI/planning/involving-users/",
        }
    actions:
      - { id: show-p11, type: slide.show, at: { mark: p11 }, slideId: l20_p11 }
      - { id: show-p12, type: slide.show, at: { mark: p12 }, slideId: l20_p12 }

