# AI Builder, lesson 07: edge cases and assumptions (Burmese, docs kind).
#
# Start state (ws/): base-docs (package.json with a no-op dev script, notes.md) and
# docs/requirements.md pinned exactly as COURSE-KIT §4.2 stands after L06 (through `## Scope (v1)`,
# followed by a blank line). Nothing runs. The lesson types the binder's last three sections:
# Edge cases · Assumptions · Questions for မြမြ (one line-by-line action each).
# Deliberate gap (binder note): the Burmese-digit requirement is NOT made an edge case here.
#
# Boards: (C) the happy path, then the what-if checklist drawn item by item (3 × 3 orange boxes);
# (E) one story and the four ways to decide an edge (green handle, red refuse clearly, white ignore on
# purpose, orange ask), with the rule that the agent must not decide it; (Z) the quiz.
#
# Build: bun ~/Documents/ai-builder-course-work/tools/build-lesson.ts template.yaml ws ai-builder-07-edge-cases.yaml
schemaVersion: 1
lesson:
  slug: ai-builder-07-edge-cases
  title: "AI Builder 07: Edge case နဲ့ assumption"
  locale: my-MM
  workspace:
    lessonType: javascript
    name: AI Builder
    entryFilePath: docs/requirements.md
    sidebarStartsCollapsed: true
    files:
      docs/requirements.md: |+
        # Requirements · ကြိုမှာ app

        ## User stories
        - Customer အနေနဲ့ ဆိုင်မရောက်ခင် ဖုန်းကနေ ကြိုမှာချင်တယ်၊ ဒါမှ တန်းမစီရဘဲ ယူသွားလို့ရမယ်။
        - Customer အနေနဲ့ လာယူမယ့် အချိန်ကို ရွေးချင်တယ်၊ ဒါမှ ရောက်တဲ့အချိန် အသင့်ဖြစ်နေမယ်။
        - ကောင်တာက လှလှ အနေနဲ့ ဝင်လာတဲ့ အော်ဒါတွေကို လာယူချိန်အလိုက် မြင်ချင်တယ်၊ ဒါမှ အချိန်မီ ပြင်ထားနိုင်မယ်။
        - ဆိုင်ပိုင်ရှင် မြမြ အနေနဲ့ တစ်မနက် ကြိုမှာတဲ့ အော်ဒါ အရေအတွက်ကို သိချင်တယ်၊ ဒါမှ app က အလုပ်ဖြစ်မဖြစ် သိမယ်။

        ## Non-functional
        - ဈေးပေါတဲ့ Android ဖုန်း၊ နှေးတဲ့ mobile data မှာ 3 စက္ကန့်အတွင်း ပွင့်ရမယ်။
        - မြန်မာစာ မှန်မှန် ပေါ်ရမယ်။ မြန်မာဂဏန်းနဲ့ ရိုက်ရင်လည်း လက်ခံရမယ်။
        - customer ရဲ့ ဖုန်းနံပါတ်ကို ဆိုင်ကလွဲရင် ဘယ်သူမှ မမြင်ရဘူး။
        - စာလုံး ကြီးကြီးနဲ့ ဖတ်တဲ့သူလည်း သုံးလို့ရရမယ်။
        - run ဖို့ တစ်လ 30,000 ကျပ်ထက် မကုန်ရဘူး။

        ## Constraints
        - app ကို ကိုယ်တစ်ယောက်တည်း AI agent နဲ့ တည်ဆောက်မယ်။
        - ငွေကို ကောင်တာမှာပဲ ချေမယ်။
        - ဆိုင်ဖွင့်ချိန် — တနင်္လာ–သောကြာ 6:00–20:00၊ စနေ–တနင်္ဂနွေ 7:00–21:00

        ## Scope (v1)
        Must
        - လာယူမယ့် အချိန်နဲ့ ကြိုမှာလို့ရတာ
        - အော်ဒါနံပါတ်
        - ကောင်တာမှာ အော်ဒါစာရင်း မြင်ရတာ
        Should
        - အော်ဒါ အသင့်ဖြစ်ရင် SMS ပို့တာ
        Won't (for now)
        - delivery
        - online ငွေပေးချေမှု
        - customer account နဲ့ login

