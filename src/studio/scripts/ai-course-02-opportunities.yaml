build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 5102
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "Opportunity ကို ရှာရအောင်"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ AI feature တစ်ခုကို Opportunity၊ Solution နဲ့ Governance
      ဆိုတဲ့ blueprint နဲ့ စီစဉ်ရမယ်လို့ ပြောခဲ့ပါတယ်။ ဒီ lesson မှာတော့ ပထမ အပိုင်းဖြစ်တဲ့ Opportunity
      ကို ဘယ်လို ရှာမလဲ ဆိုတာ ကြည့်သွားပါမယ်။ [[mark:draw-mini]] blueprint မှာ ကြည့်ရင်၊ ဒီနေ့ အလုပ်က
      အပေါ်ဆုံးက Opportunity အကွက်ပါ။ ဘယ် user ရဲ့ ဘယ် ပြဿနာကို ဖြေရှင်းမလဲ၊ ဖြေရှင်းရင် ဘာ
      အကျိုးကျေးဇူး ရမလဲ ဆိုတာကို ဒီမှာ ဆုံးဖြတ်ရတာပါ။ [[mark:draw-two]] web developer အနေနဲ့ ကိုယ်က idea တစ်ခုကို
      နည်းပညာအရ ဆောက်လို့ ရမရ ဆိုတာရော၊ user ရဲ့ အတွေ့အကြုံကို ဘယ်လို ပြောင်းစေမလဲ ဆိုတာပါ နှစ်ဘက်လုံး
      မြင်နိုင်ပါတယ်။ ဒါကြောင့် AI အခွင့်အလမ်း ရှာတဲ့ နေရာမှာ ကိုယ့် အမြင်က အရေးပါပါတယ်။
      [[mark:draw-why]] AI ကို ထည့်တဲ့ အကြောင်းကလည်း အသစ်ဖြစ်လို့၊ အထင်ကြီးစရာ ကောင်းလို့ မဟုတ်ဘဲ၊ user
      အတွက် ပိုလွယ်၊ ပိုမြန်၊ ပိုပျော်စရာ ကောင်းအောင် တကယ် လုပ်ပေးနိုင်လို့ ဖြစ်ရပါမယ်။
    sources:
      - { title: "web.dev Learn AI: Explore use cases", url: "https://web.dev/learn/ai/use-cases" }
      - {
          title: "web.dev Learn AI: Introduction to AI on the web (the blueprint)",
          url: "https://web.dev/learn/ai/introduction",
        }
      - {
          title: "web.dev Learn AI: Welcome to Learn AI! (course credit: written by Dr. Janna Lipenkova with editorial guidance from Alexandra Klepper; text CC BY 4.0, code Apache 2.0; adapted into Burmese with the course's own tea-shop examples)",
          url: "https://web.dev/learn/ai/welcome",
        }
      - {
          title: "Creative Commons: Attribution 4.0 International (CC BY 4.0), the licence of the web.dev Learn AI text adapted here",
          url: "https://creativecommons.org/licenses/by/4.0/",
        }
    actions:
      - {
          id: open-board-a,
          type: whiteboard.apply,
          at: { scene: start, offsetMs: -450 },
          open: true,
          clear: true,
          upsertIds: [a-title],
        }
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - {
          id: draw-mini,
          type: whiteboard.apply,
          at: { mark: draw-mini },
          upsertIds:
            [
              a-opp,
              a-opp-t,
              a-opp-d,
              a-arrow-1,
              a-data,
              a-data-t,
              a-intel,
              a-intel-t,
              a-ux,
              a-ux-t,
              a-arrow-2,
              a-gov,
              a-gov-t,
              a-today,
            ],
          drawMs: 2600,
        }
      - {
          id: draw-two,
          type: whiteboard.apply,
          at: { mark: draw-two },
          upsertIds: [a-two],
          drawMs: 1200,
        }
      - {
          id: draw-why,
          type: whiteboard.apply,
          at: { mark: draw-why },
          upsertIds: [a-why],
          drawMs: 1000,
        }

  - id: value
    chapter: "AI ရဲ့ အကျိုးကျေးဇူး ငါးမျိုး"
    narration: >
      [[mark:draw-tree]] AI က ပေးနိုင်တဲ့ အကျိုးကျေးဇူးကို အမျိုးအစား ငါးမျိုး ခွဲကြည့်လို့ ရပါတယ်။
      [[mark:draw-insights]] ပထမ တစ်ခု insights ဆိုတာ ဆုံးဖြတ်ချက် ပိုကောင်းအောင် အချက် ထုတ်ပေးတာပါ။
      ဥပမာ customer တွေ ဘာကို အများဆုံး တိုင်ကြားလဲ ဆိုတာ ဆိုင်ပိုင်ရှင်ကို စုပြပေးတာမျိုးပါ။
      [[mark:draw-convenience]] convenience က လုပ်ရ ခက်တာ၊ အချိန်ကုန်တာကို လျှော့ပေးတာပါ။ customer က
      ကိုယ့်စကားနဲ့ ရှာရင်တောင် menu ထဲက လိုချင်တာကို တန်းတွေ့တာမျိုးပါ။ [[mark:draw-automation]]
      automation ကတော့ ထပ်ခါထပ်ခါ လုပ်ရတဲ့ အလုပ်ကို အစားလုပ်ပေးတာပါ။ ဆိုင် ဘယ်နှနာရီ ဖွင့်လဲ လို
      ခဏခဏ မေးတဲ့ မေးခွန်းတွေကို အလိုလို ဖြေပေးတာမျိုးပါ။ [[mark:draw-augmentation]] augmentation က
      ခက်တဲ့၊ ဖန်တီးရတဲ့ အလုပ်မှာ ကူညီပေးတာပါ။ menu ဖော်ပြချက် အသစ်အတွက် မူကြမ်း ရေးပေးတာမျိုးပါ။
      [[mark:draw-personalization]] personalization ကတော့ လူ တစ်ယောက်ချင်းရဲ့ လိုအပ်ချက်နဲ့ ကြိုက်တာကို
      လိုက်ပြီး ပြောင်းပေးတာပါ။ customer တစ်ယောက်ချင်းအတွက် menu ကို အကြံပြုတာမျိုးပါ။
      [[mark:draw-risk]] စာရင်းရဲ့ အောက်ကို ဆင်းလာလေ ဆောက်ရတာ ပိုရှုပ်ထွေးလာလေ ဖြစ်ပါတယ်။ မှားရင်
      ဖြစ်မယ့် risk ရော၊ user အပေါ် သက်ရောက်မှုပါ ပိုကြီးလာပါတယ်။ [[mark:draw-start]] ဒါကြောင့်
      အပေါ်ဘက်ကနေ စတာ ကောင်းပါတယ်။ ဆိုင်ထဲမှာပဲ သုံးတဲ့ insights နဲ့ စရင်၊ model မှားသွားလည်း
      ဝန်ထမ်းတွေပဲ မြင်လို့ customer ကို မထိခိုက်ပါဘူး။ ပြီးမှ customer တွေ အခုကတည်းက အခက်တွေ့နေတဲ့
      နေရာတွေကို ပြင်ပြီး၊ အတွေ့အကြုံ ရလာတော့မှ ပိုခက်တဲ့ idea တွေဆီ ဆက်သွားပါ။ [[mark:draw-light]]
      ဒါပေမဲ့ personalization ထဲမှာတောင် လုပ်ရ မခက်၊ risk နည်းပြီး customer အတွက် အဓိပ္ပာယ် ရှိတဲ့
      အပေါ့စားလေးတွေ ရှိပါတယ်။ ဥပမာ member တစ်ယောက် သောက်နေကျ အချိုအဆိမ့်ကို မှတ်ထားပေးတာမျိုးပါ။
    sources:
      - {
          title: "web.dev Learn AI: Explore use cases (Understand the value of AI)",
          url: "https://web.dev/learn/ai/use-cases",
        }
    actions:
      - {
          id: draw-tree,
          type: whiteboard.apply,
          at: { mark: draw-tree },
          clear: true,
          upsertIds: [v-title],
        }
      - {
          id: draw-insights,
          type: whiteboard.apply,
          at: { mark: draw-insights },
          upsertIds: [v-ins, v-ins-ex],
          drawMs: 1200,
        }
      - {
          id: draw-convenience,
          type: whiteboard.apply,
          at: { mark: draw-convenience },
          upsertIds: [v-conv, v-conv-ex],
          drawMs: 1200,
        }
      - {
          id: draw-automation,
          type: whiteboard.apply,
          at: { mark: draw-automation },
          upsertIds: [v-auto, v-auto-ex],
          drawMs: 1200,
        }
      - {
          id: draw-augmentation,
          type: whiteboard.apply,
          at: { mark: draw-augmentation },
          upsertIds: [v-aug, v-aug-ex],
          drawMs: 1200,
        }
      - {
          id: draw-personalization,
          type: whiteboard.apply,
          at: { mark: draw-personalization },
          upsertIds: [v-pers, v-pers-ex],
          drawMs: 1200,
        }
      - {
          id: draw-risk,
          type: whiteboard.apply,
          at: { mark: draw-risk },
          upsertIds: [v-arrow, v-risk],
          drawMs: 1600,
        }
      - {
          id: draw-start,
          type: whiteboard.apply,
          at: { mark: draw-start },
          upsertIds: [v-start-ring, v-start],
          drawMs: 1200,
        }
      - {
          id: draw-light,
          type: whiteboard.apply,
          at: { mark: draw-light },
          upsertIds: [v-light],
          drawMs: 1200,
        }

  - id: people
    chapter: "User ကို အရင် သိရအောင်"
    narration: >
      [[mark:draw-people]] ဘယ် idea ကို ရွေးမလဲ ဆုံးဖြတ်ဖို့ ကိုယ့် user တွေ ဘယ်သူတွေလဲ ဆိုတာ အရင်
      သိရပါမယ်။ U X team ရှိရင် သူတို့နဲ့ တွဲပြီး persona တွေ သတ်မှတ်ပါ။ persona ဆိုတာ user
      အမျိုးအစား တစ်ခုကို ကိုယ်စားပြုတဲ့ လူပါ။ ကိုယ်တို့ ဆိုင်အတွက်တော့ persona လေးယောက်ကို ကြည့်ပါမယ်။
      [[mark:draw-mm]]
      ဆိုင်ပိုင်ရှင် မြမြ က customer တွေ ဘာကို မကျေနပ်လဲ ဆိုတာ သိချင်ပါတယ်။ [[mark:draw-hh]] ကောင်တာမှာရော၊
      ဆိုင်ရဲ့ page မှာပါ အလုပ်လုပ်တဲ့ လှလှ ကတော့ menu ဖော်ပြချက် ရေးရတာ အချိန် အများကြီး ကုန်ပါတယ်။
      [[mark:draw-aa]] မနက်တိုင်း မှာတဲ့ member အောင်အောင် က မှာနေကျ အော်ဒါကို မြန်မြန် ပြန်မှာချင်ပါတယ်။
      [[mark:draw-mg]] ကျောင်းသား customer အသစ် မောင်မောင် ကတော့ ကိုယ့်စကားနဲ့ ရှာတဲ့အခါ လိုချင်တာကို
      ရှာမတွေ့ပါဘူး။ [[mark:draw-first]] ဒီလို user ရဲ့ တကယ့် လိုအပ်ချက်ကနေ စပြီး၊ တွေ့လာတဲ့ AI
      အခွင့်အလမ်း တစ်ခုချင်းကို ဆိုင်မှာ တကယ် ဖြေရှင်းမယ့် use case တစ်ခုအဖြစ် ချရေးရပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Explore use cases (Identify opportunities in your product)",
          url: "https://web.dev/learn/ai/use-cases",
        }
      - {
          title: "People + AI Guidebook: User needs and defining success",
          url: "https://pair.withgoogle.com/guidebook/chapters/user-needs-and-defining-success",
        }
    actions:
      - {
          id: draw-people,
          type: whiteboard.apply,
          at: { mark: draw-people },
          clear: true,
          upsertIds: [p-title],
        }
      - {
          id: draw-mm,
          type: whiteboard.apply,
          at: { mark: draw-mm },
          upsertIds: [p-mm-box, p-mm, p-mm-need],
          drawMs: 1300,
        }
      - {
          id: draw-hh,
          type: whiteboard.apply,
          at: { mark: draw-hh },
          upsertIds: [p-hh-box, p-hh, p-hh-need],
          drawMs: 1300,
        }
      - {
          id: draw-aa,
          type: whiteboard.apply,
          at: { mark: draw-aa },
          upsertIds: [p-aa-box, p-aa, p-aa-need],
          drawMs: 1300,
        }
      - {
          id: draw-mg,
          type: whiteboard.apply,
          at: { mark: draw-mg },
          upsertIds: [p-mg-box, p-mg, p-mg-need],
          drawMs: 1300,
        }
      - {
          id: draw-first,
          type: whiteboard.apply,
          at: { mark: draw-first },
          upsertIds: [p-first],
          drawMs: 1100,
        }

  - id: sources
    narration: >
      [[mark:draw-sources]] idea တွေက နေရာ သုံးနေရာကနေ လာတတ်ပါတယ်။ [[mark:draw-src-user]] အကောင်းဆုံးကတော့
      user ကိုယ်တိုင် ပြောတဲ့ လိုအပ်ချက်၊ ဒါမှမဟုတ် ကြုံနေရတဲ့ အခက်အခဲပါ။ မောင်မောင် ရှာမတွေ့တာလို
      ပြဿနာမျိုးပါ။ [[mark:draw-src-team]] ဒုတိယက ကိုယ် ဒါမှမဟုတ် team ထဲက တစ်ယောက်ယောက် စဉ်းစားမိတဲ့
      idea ပါ။ ဒီလို idea ဆိုရင် user တွေ တကယ် လိုချင်လား ဆိုတာကို မြန်မြန် စစ်ရပါမယ်။ မစစ်ရင် AI
      ပါအောင်လို့ပဲ ထည့်တဲ့ feature ဖြစ်သွားတတ်ပါတယ်။ [[mark:draw-src-rival]] တတိယက ပြိုင်ဘက်တွေ
      လုပ်တာကို ကြည့်ပြီး ရလာတဲ့ idea ပါ။ ဥပမာ ဘေးက ဆိုင်မှာ chatbot ရှိလို့ ကိုယ်လည်း လုပ်ချင်တာမျိုးပါ။
      ဒါပေမဲ့ သူတို့ customer နဲ့ ကိုယ်တို့ customer က မတူနိုင်လို့၊ ကိုယ်တို့ ဆိုင်မှာလည်း အလုပ်ဖြစ်မလား
      စောစော စမ်းကြည့်ရပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Explore use cases (Identify opportunities in your product)",
          url: "https://web.dev/learn/ai/use-cases",
        }
    actions:
      - {
          id: draw-sources,
          type: whiteboard.apply,
          at: { mark: draw-sources },
          clear: true,
          upsertIds: [s-title],
        }
      - {
          id: draw-src-user,
          type: whiteboard.apply,
          at: { mark: draw-src-user },
          upsertIds: [s-user, s-user-check, s-user-ex],
          drawMs: 1400,
        }
      - {
          id: draw-src-team,
          type: whiteboard.apply,
          at: { mark: draw-src-team },
          upsertIds: [s-team, s-team-ex],
          drawMs: 1200,
        }
      - {
          id: draw-src-rival,
          type: whiteboard.apply,
          at: { mark: draw-src-rival },
          upsertIds: [s-rival, s-rival-ex],
          drawMs: 1200,
        }

  - id: journey
    chapter: "User journey တစ်လျှောက် ကြည့်ရအောင်"
    narration: >
      [[mark:close-sources]] ဒါဆို idea တွေကို customer ရဲ့ ခရီးတစ်လျှောက် ချရေးကြည့်ရအောင်။
      [[mark:panel-ready]] customer က ရှာတာကနေ မှာ၊ ငွေချေ၊ ရပြီးတဲ့အထိ ဖြတ်သွားတဲ့ အဆင့်တွေကို user
      journey လို့ ခေါ်ပါတယ်။ ညာဘက်က AI panel မှာ ဆိုင်ရဲ့ user journey အဆင့်တစ်ခုချင်းက AI idea တွေကို
      ဇယား တစ်ခုနဲ့ ပြထားပါတယ်။
      [[mark:open-journey]] ဒီ ဖိုင်ထဲမှာ idea တစ်ခုကို တစ်ကြောင်းစီ ရေးထားပြီး၊ panel က အဲဒါကို
      ဇယားအဖြစ် ဆွဲပေးတာပါ။ model တစ်ခုမှ run နေတာ မဟုတ်ပါဘူး။ column တွေကတော့ အဆင့်၊ အကျိုးကျေးဇူး
      အမျိုးအစား၊ idea နဲ့ AI လိုမလို ဆိုတာပါ။ [[mark:sel-find]] ပထမ ရှာတဲ့ အဆင့်မှာ idea သုံးခု
      ရှိပါတယ်။ ရှာမတွေ့တဲ့ search တွေကို စုကြည့်တာက insights ပါ။ ကိုယ့်စကားနဲ့ ရှာရင်တောင် တွေ့အောင်
      လုပ်တာက convenience ဖြစ်ပြီး၊ customer တစ်ယောက်ချင်းအတွက် အကြံပြုတာကတော့ personalization ပါ။
      [[mark:sel-choose]] ရွေးတဲ့ အဆင့်မှာတော့ review တွေကို အနှစ်ချုပ်ပြတာ၊ ဘာနဲ့ တွဲစားရင် ကောင်းလဲ
      အကြံပေးတာ စတဲ့ idea တွေ ရှိပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Explore use cases (Identify opportunities in your product: the journey table)",
          url: "https://web.dev/learn/ai/use-cases",
        }
    actions:
      - { id: close-sources, type: whiteboard.apply, at: { mark: close-sources }, open: false }
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-done
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: ai-status }
        attribute: { name: data-state, value: "done" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-journey-card
        type: expect.preview
        at: { afterAction: expect-done }
        timeoutMs: 5000
        target: { by: testId, value: ai-journey }
        attribute: { name: data-label, value: "Customer journey" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-journey-rows
        type: expect.preview
        at: { afterAction: expect-journey-card }
        timeoutMs: 5000
        target: { by: testId, value: ai-journey }
        attribute: { name: data-count, value: "13" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - {
          id: open-journey,
          type: workspace.openFile,
          at: { mark: open-journey },
          path: src/journey.js,
        }
      - id: sel-find
        type: editor.select
        at: { mark: sel-find }
        target:
          {
            file: src/journey.js,
            text: "idea(\"ရှာ\", \"insights\", \"ရှာမတွေ့တဲ့ search တွေ\"),\n  idea(\"ရှာ\", \"convenience\", \"ကိုယ့်စကားနဲ့ ရှာ\"),\n  idea(\"ရှာ\", \"personalization\", \"ကိုယ့်အတွက် အကြံပြု\"),",
            occurrence: 1,
          }
      - id: expect-find-insights
        type: expect.preview
        at: { afterAction: sel-find }
        timeoutMs: 5000
        target: { by: testId, value: ai-journey-1 }
        textContains: "ရှာinsightsရှာမတွေ့တဲ့ search တွေ✓"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-find-personal
        type: expect.preview
        at: { afterAction: expect-find-insights }
        timeoutMs: 5000
        target: { by: testId, value: ai-journey-3 }
        textContains: "ရှာpersonalizationကိုယ့်အတွက် အကြံပြု✓"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: sel-choose
        type: editor.select
        at: { mark: sel-choose }
        target:
          {
            file: src/journey.js,
            text: "idea(\"ရွေး\", \"convenience\", \"review အနှစ်ချုပ်\"),\n  idea(\"ရွေး\", \"augmentation\", \"တွဲစားရင် ကောင်းတာ\"),",
            occurrence: 1,
          }
      - id: expect-choose-review
        type: expect.preview
        at: { afterAction: sel-choose }
        timeoutMs: 5000
        target: { by: testId, value: ai-journey-4 }
        textContains: "ရွေးconveniencereview အနှစ်ချုပ်✓"
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: journey-rest
    narration: >
      [[mark:sel-order]] မှာပြီး ငွေချေတဲ့ အဆင့်မှာတော့ ငွေ နှစ်ခါ ဖြတ်မိရင် သတိပေးတာက automation ပါ။
      [[mark:read-no-ai]] ဒါပေမဲ့ panel ရဲ့ နောက်ဆုံး column ကို ကြည့်ပါ။ ခုနက personalization အပေါ့စား
      ဥပမာ ဖြစ်တဲ့ အချိုအဆိမ့် မှတ်ထားတာနဲ့ မှာနေကျကို ပြန်မှာတာ နှစ်ခုမှာ AI မလိုဘူးလို့ ကြက်ခြေခတ်နဲ့
      ပြနေပါတယ်။ အောင်အောင် လို member အတွက် သိမ်းထားတဲ့ setting တစ်ခုနဲ့၊ နောက်ဆုံး မှာခဲ့တဲ့ အော်ဒါကို
      ပြန်မှာပေးတဲ့ ခလုတ် တစ်ခုနဲ့တင် လုပ်လို့ ရလို့ပါ။ သာမန် code နဲ့ ရရင် AI မလိုဘူး ဆိုတာ ဒီမှာလည်း
      မှန်ပါတယ်။ [[mark:sel-after]]
      ရပြီးနောက် အဆင့်မှာ customer message တွေကို ခွဲပြီး ဆိုင်ပိုင်ရှင်ကို စုပြတာ၊ ဆိုင် မလာတော့မယ့်
      member ကို ကြိုသိအောင် လုပ်တာ၊ ခဏခဏ မေးတဲ့ မေးခွန်းကို အလိုလို ဖြေတာ တို့ ရှိပါတယ်။
      [[mark:sel-staff]] နောက်ဆုံး နှစ်ကြောင်းကတော့ customer ရဲ့ journey မဟုတ်ဘဲ၊ မနက်ဖြန် ဘယ်နှပွဲ
      ရောင်းရမလဲ ခန့်မှန်းတာ၊ ဖော်ပြချက် မူကြမ်း ရေးတာလို ဆိုင်ဘက်က အလုပ်တွေပါ။ [[mark:read-stages]]
      ဒီလို ချရေးကြည့်လိုက်တော့ အဆင့်တိုင်းမှာ အခွင့်အလမ်း မတူတာကို မြင်ရပါတယ်။ ဒါကြောင့် feature
      တစ်ခုတည်းကို စဉ်းစားတာထက် customer ဖြတ်သွားတဲ့ အဆင့်တွေ တစ်လျှောက်လုံး ရှာကြည့်တာက ပိုကောင်းပါတယ်။
    sources:
      - {
          title: "web.dev Learn AI: Explore use cases (Identify opportunities in your product: the journey table)",
          url: "https://web.dev/learn/ai/use-cases",
        }
      - {
          title: "web.dev Learn AI: Introduction to AI on the web (use AI only when needed)",
          url: "https://web.dev/learn/ai/introduction",
        }
    actions:
      - id: sel-order
        type: editor.select
        at: { mark: sel-order }
        target:
          {
            file: src/journey.js,
            text: 'idea("မှာ၊ ငွေချေ", "automation", "ငွေ 2 ခါ ဖြတ်ရင် သတိပေး"),',
            occurrence: 1,
          }
      - id: expect-order-auto
        type: expect.preview
        at: { afterAction: sel-order }
        timeoutMs: 5000
        target: { by: testId, value: ai-journey-8 }
        textContains: "automationငွေ 2 ခါ ဖြတ်ရင် သတိပေး✓"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: sel-no-ai
        type: editor.select
        at: { mark: read-no-ai }
        target:
          {
            file: src/journey.js,
            text: "idea(\"ရွေး\", \"personalization\", \"အချိုအဆိမ့် မှတ်ထား\", false),\n  idea(\"မှာ၊ ငွေချေ\", \"convenience\", \"မှာနေကျ ပြန်မှာ\", false),",
            occurrence: 1,
          }
      - id: expect-no-ai-sugar
        type: expect.preview
        at: { afterAction: sel-no-ai }
        timeoutMs: 5000
        target: { by: testId, value: ai-journey-6 }
        textContains: "personalizationအချိုအဆိမ့် မှတ်ထား✗"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-no-ai-usual
        type: expect.preview
        at: { afterAction: expect-no-ai-sugar }
        timeoutMs: 5000
        target: { by: testId, value: ai-journey-7 }
        textContains: "မှာနေကျ ပြန်မှာ✗"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: sel-after
        type: editor.select
        at: { mark: sel-after }
        target:
          {
            file: src/journey.js,
            text: "idea(\"ရပြီးနောက်\", \"insights\", \"message တွေ ခွဲပြီး စုပြ\"),\n  idea(\"ရပြီးနောက်\", \"insights\", \"မလာတော့မယ့် member\"),\n  idea(\"ရပြီးနောက်\", \"automation\", \"မေးတာ အလိုလို ဖြေ\"),",
            occurrence: 1,
          }
      - id: expect-after-member
        type: expect.preview
        at: { afterAction: sel-after }
        timeoutMs: 5000
        target: { by: testId, value: ai-journey-10 }
        textContains: "ရပြီးနောက်insightsမလာတော့မယ့် member✓"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: sel-staff
        type: editor.select
        at: { mark: sel-staff }
        target:
          {
            file: src/journey.js,
            text: "idea(\"ဆိုင်ဘက်\", \"insights\", \"မနက်ဖြန် ဘယ်နှပွဲ\"),\n  idea(\"ဆိုင်ဘက်\", \"augmentation\", \"ဖော်ပြချက် မူကြမ်း\"),",
            occurrence: 1,
          }
      - id: expect-staff
        type: expect.preview
        at: { afterAction: sel-staff }
        timeoutMs: 5000
        target: { by: testId, value: ai-journey-13 }
        textContains: "ဆိုင်ဘက်augmentationဖော်ပြချက် မူကြမ်း✓"
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: quiz
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ လှလှ က menu ဖော်ပြချက် အသစ်တွေ ရေးတဲ့အခါ AI ရဲ့ အကူအညီ
      လိုချင်တယ် ဆိုပါစို့။ ဒါက အကျိုးကျေးဇူး အမျိုးအစား ငါးမျိုးထဲက ဘယ်ဟာလဲ။ lesson ကို pause လုပ်ပြီး
      စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] အဖြေကတော့ augmentation ပါ။ ဘာကြောင့်လဲဆိုတော့ ဖန်တီးရတဲ့
      အလုပ်ကို AI က မူကြမ်းနဲ့ ကူညီပေးရုံပဲ ဖြစ်ပြီး၊ ဘယ်ဟာ သုံးမလဲ ရွေးတာ၊ ပြင်တာ၊ နောက်ဆုံး
      ဆုံးဖြတ်တာကို လှလှ ကိုယ်တိုင် လုပ်နေဆဲ ဖြစ်လို့ပါ။ automation ဆိုရင်တော့ အလုပ် တစ်ခုလုံးကို AI က
      အစားလုပ်ပေးတာ ဖြစ်လို့ ဒီနေရာမှာ မကိုက်ပါဘူး။
    sources:
      - {
          title: "web.dev Learn AI: Explore use cases (Check your understanding)",
          url: "https://web.dev/learn/ai/use-cases",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [z-title, z-q1, z-q2, z-q3],
          drawMs: 1800,
        }
      - {
          id: draw-quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [z-a, z-a-note],
          drawMs: 1800,
        }

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:close-quiz]] ဒါဆို ပြန်ချုပ်ရရင်၊ AI ကို ထည့်တဲ့ အကြောင်းက user အတွက် တကယ် ပိုလွယ်၊
      ပိုမြန်အောင် လုပ်ပေးဖို့ပါ။ [[mark:sel-five]] အကျိုးကျေးဇူးကို အမျိုးအစား ငါးမျိုးနဲ့ စဉ်းစားပြီး၊
      [[mark:sel-low]] risk နည်းတဲ့ ဆိုင်ထဲက insights ကနေ စပါ။ [[mark:sel-users]] idea တွေကို user ရဲ့
      လိုအပ်ချက်ကနေ ရှာပြီး၊ team နဲ့ ပြိုင်ဘက်ဆီက idea တွေကိုတော့ user နဲ့ စစ်ပါ။ [[mark:sel-journey]]
      user journey ရဲ့ အဆင့်တိုင်းမှာ အခွင့်အလမ်း မတူတာကိုလည်း မှတ်ထားပါ။ [[mark:sel-terms]] စကားလုံး
      အသစ်တွေကိုလည်း notes ဖိုင်မှာ စာရင်း လုပ်ထားပါတယ်။ နောက် lesson မှာတော့ idea တစ်ခုကို ပုံဖော်တာ၊
      ကုန်ကျစရိတ်နဲ့ မှားနိုင်တဲ့ ပုံစံတွေကို ခန့်မှန်းတာနဲ့ prototype အမြန် လုပ်ကြည့်တာကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "web.dev Learn AI: Explore use cases (Your takeaways)",
          url: "https://web.dev/learn/ai/use-cases",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: close-quiz }, open: false }
      - {
          id: open-notes,
          type: workspace.openFile,
          at: { mark: close-quiz, offsetMs: 400 },
          path: notes.md,
        }
      - id: sel-why
        type: editor.select
        at: { afterAction: open-notes }
        target:
          {
            file: notes.md,
            text: "အထင်ကြီးစရာ ကောင်းလို့ မဟုတ်ဘဲ user အတွက် ပိုလွယ်၊ ပိုမြန်၊ ပိုပျော်စရာ ကောင်းအောင်",
            occurrence: 1,
          }
      - id: sel-five
        type: editor.select
        at: { mark: sel-five }
        target:
          {
            file: notes.md,
            text: "insights · convenience · automation · augmentation · personalization",
            occurrence: 1,
          }
      - id: sel-low
        type: editor.select
        at: { mark: sel-low }
        target: { file: notes.md, text: "ဆိုင်ထဲ insights ကနေ စ", occurrence: 1 }
      - id: sel-users
        type: editor.select
        at: { mark: sel-users }
        target:
          {
            file: notes.md,
            text: "user ရဲ့ လိုအပ်ချက်ကနေ စ · team နဲ့ ပြိုင်ဘက်ရဲ့ idea ကို user နဲ့ စစ်",
            occurrence: 1,
          }
      - id: sel-journey
        type: editor.select
        at: { mark: sel-journey }
        target: { file: notes.md, text: "အဆင့်တိုင်းမှာ အခွင့်အလမ်း မတူ", occurrence: 1 }
      - id: sel-terms
        type: editor.select
        at: { mark: sel-terms }
        target: { file: notes.md, text: "ဒီ lesson ထဲက စကားလုံး အသစ်တွေ", occurrence: 1 }
checks:
  - { type: timing.p95Ms, max: 300 }
