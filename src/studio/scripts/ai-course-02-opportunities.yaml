      src/journey.js: |
        // ရွှေလက်ဖက်ရည်ဆိုင်'s user journey: the AI ideas at each stage, one row per idea (a plan, not code).
        // category = the kind of value the idea gives. false at the end = plain code does it, no AI needed.
        const idea = (stage, category, text, ai = true) => ({ stage, category, idea: text, "AI လို": ai });

        export const journey = [
          idea("ရှာ", "insights", "ရှာမတွေ့တဲ့ search တွေ"),
          idea("ရှာ", "convenience", "ကိုယ့်စကားနဲ့ ရှာ"),
          idea("ရှာ", "personalization", "ကိုယ့်အတွက် အကြံပြု"),
          idea("ရွေး", "convenience", "review အနှစ်ချုပ်"),
          idea("ရွေး", "augmentation", "တွဲစားရင် ကောင်းတာ"),
          idea("ရွေး", "personalization", "အချိုအဆိမ့် မှတ်ထား", false),
          idea("မှာ၊ ငွေချေ", "convenience", "မှာနေကျ ပြန်မှာ", false),
          idea("မှာ၊ ငွေချေ", "automation", "ငွေ 2 ခါ ဖြတ်ရင် သတိပေး"),
          idea("ရပြီးနောက်", "insights", "message တွေ ခွဲပြီး စုပြ"),
          idea("ရပြီးနောက်", "insights", "မလာတော့မယ့် member"),
          idea("ရပြီးနောက်", "automation", "မေးတာ အလိုလို ဖြေ"),
          // The shop's own side, not the customer's journey:
          idea("ဆိုင်ဘက်", "insights", "မနက်ဖြန် ဘယ်နှပွဲ"),
          idea("ဆိုင်ဘက်", "augmentation", "ဖော်ပြချက် မူကြမ်း"),
        ];
      src/main.js: |
        import { panel } from "ai-panel";
        import { journey } from "./journey.js";

        // The journey table as one static card: no model runs here, the rows are the plan in journey.js.
        panel.table("Customer journey", journey, { id: "journey" });
      vite.config.js: |
        import { defineConfig } from "vite";
        import courseRunner from "./course/runner.js";

        export default defineConfig({
          plugins: [courseRunner()],
        });
