        }

  - id: context
    chapter: Context view ကို တစ်ဆင့်ချင်း ဆွဲခြင်း
    narration: >
      [[mark:c-open]] ဒါဆို ကားလိုင်းဘက်က engineer တွေရဲ့ မေးခွန်းအတွက် ပုံကို အစကနေ ဆွဲကြည့်ရအောင်။ အရင်ဆုံး
      ခရီးဖော် တစ်ခုလုံးကို box တစ်ခုတည်းအဖြစ် အလယ်မှာ ထားပါမယ်။ အထဲမှာ service ဘယ်နှခု ရှိလဲ ဆိုတာ ဒီ
      မေးခွန်းအတွက် မလိုသေးပါဘူး။
      [[mark:c-users]] ပြီးရင် သုံးတဲ့သူတွေကို ထည့်ပါမယ်။ app ကနေ ဝယ်တဲ့ ခရီးသည်နဲ့ ကားဂိတ်က ကောင်တာ
      ဝန်ထမ်းတွေပါ။
      [[mark:c-wallet]] နောက်တစ်ခုက ခရီးဖော် က လှမ်းခေါ်ရတဲ့ အပြင်က system တွေပါ။ ငွေချေဖို့ wallet ကုမ္ပဏီရဲ့ API
      ကို ခေါ်ရပါတယ်။
      [[mark:c-sms]] လက်မှတ် ရောင်းပြီးရင်တော့ SMS gateway ကနေ SMS ပို့ပါတယ်။
      [[mark:c-partner]] နောက်ဆုံးမှာမှ ဒီ ပုံရဲ့ အဓိက ဖြစ်တဲ့ ကားလိုင်းရဲ့ ကိုယ်ပိုင် system ကို ထည့်ပါမယ်။
      သူတို့ဘက်က ခရီးဖော် ကို လှမ်းခေါ်တာ ရှိသလို၊ ခရီးဖော် ဘက်က သူတို့ဆီ ပြန်ပို့တာလည်း ရှိပါတယ်။
      [[mark:c-name]] system တစ်ခုကို သူ့ကို သုံးတဲ့သူတွေနဲ့၊ ဆက်သွယ်ရတဲ့ အပြင်က system တွေကြားမှာ ပြတဲ့ ဒီလို
      ပုံကို context view လို့ ခေါ်ပါတယ်။ box ၆၀ မဟုတ်တော့ဘဲ လေးခုပဲ ရှိတာမို့၊ ကားလိုင်းဘက်က engineer က သူ့
      system ကို တစ်ချက်ကြည့်ရုံနဲ့ တွေ့နိုင်ပါပြီ။
      [[mark:c-left]] ပုံထဲမှာ မပါတာတွေကလည်း တမင် ချန်ထားတာပါ။ report တွေ၊ database တွေက တကယ် ရှိပေမဲ့ ဒီ
      မေးခွန်းအတွက် မလိုပါဘူး။ မြေပုံ တစ်ခုလိုပါပဲ။ အရာအားလုံးကို ထည့်ထားတဲ့ မြေပုံက လမ်းမပြနိုင်တော့ပါဘူး။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
      - { title: "The C4 model for visualising software architecture", url: "https://c4model.com/" }
    actions:
      - {
          id: draw-c-open,
          type: whiteboard.apply,
          at: { mark: c-open, offsetMs: 5500 },
          clear: true,
          upsertIds: [c-sys, c-sys-l],
          drawMs: 1400,
        }
      - {
          id: draw-c-users,
          type: whiteboard.apply,
          at: { mark: c-users },
          upsertIds: [c-users, c-users-a],
          drawMs: 1400,
        }
      - {
          id: draw-c-wallet,
          type: whiteboard.apply,
          at: { mark: c-wallet, offsetMs: 3500 },
          upsertIds: [c-wallet-a, c-wallet, c-wallet-l],
          drawMs: 1500,
        }
      - {
          id: draw-c-sms,
          type: whiteboard.apply,
          at: { mark: c-sms },
          upsertIds: [c-sms-a, c-sms, c-sms-l],
          drawMs: 1500,
        }
      - {
          id: draw-c-partner,
          type: whiteboard.apply,
          at: { mark: c-partner },
          upsertIds: [c-partner, c-partner-l],
          drawMs: 1300,
        }
      - {
          id: draw-c-lines,
          type: whiteboard.apply,
          at: { mark: c-partner, offsetMs: 6500 },
          upsertIds: [c-partner-up, c-partner-down],
          drawMs: 1200,
        }
      - {
          id: point-c-sys,
          type: whiteboard.point,
          at: { mark: c-name },
          target: { assetId: c-sys },
        }

  - id: zoom
    chapter: ချဲ့ကြည့်ခြင်းနဲ့ မျဉ်းတွေရဲ့ အဓိပ္ပာယ်
    narration: >
      [[mark:z-point]] ကားလိုင်းဘက်က engineer အတွက် နောက်ထပ် သိချင်တာက ဒီ မျဉ်းနှစ်ကြောင်းက တကယ်တော့ ဘာတွေလဲ
      ဆိုတာပါ။ ဒါကြောင့် ဒီနေရာကို ချဲ့ကြည့်ပါမယ်။ မချဲ့ခင် တစ်ခုလုံးထဲက ဘယ်နေရာကို ချဲ့မှာလဲ ဆိုတာ အရင်
      ပြတာကို သတိထားပါ။
      [[mark:z-open]] ချဲ့လိုက်ရင် ခရီးဖော် ရဲ့ အတွင်းဘက်ကို သီးခြား deploy လုပ်တဲ့ အပိုင်းတွေအနေနဲ့ မြင်ရပါတယ်။
      ဒါပေမဲ့ အားလုံးကို မပြဘဲ၊ ကားလိုင်း system နဲ့ ဆိုင်တဲ့ နှစ်ခုကိုပဲ ပြပါမယ်။
      [[mark:z-in]] ကားလိုင်း system က ခရီးစဉ်နဲ့ ဈေးနှုန်းတွေကို Operator service ဆီ တင်ပါတယ်။ ဒီမျဉ်းမှာ ဘာ
      စီးသွားလဲ ဆိုတာနဲ့အတူ၊ ခေါ်တဲ့ဘက်က အဖြေကို စောင့်တယ် ဆိုတာပါ ရေးထားပါတယ်။
      [[mark:z-out]] ပြန်လာတဲ့ မျဉ်းကတော့ Booking service က ထိုင်ခုံ တစ်ခုံ ရောင်းပြီးတိုင်း ကားလိုင်း system ဆီ
      အကြောင်းကြားတာပါ။ ဒီတစ်ခါတော့ Booking က အဖြေကို မစောင့်ဘဲ ဆက်သွားပါတယ်။
      [[mark:z-lines]] diagram တစ်ခုမှာ အဓိပ္ပာယ်ကို သယ်ထားတာက box တွေထက် မျဉ်းတွေပါ။ box တွေချည်း ဆိုရင် ဘာတွေ
      ရှိလဲ ဆိုတာပဲ ပြောနိုင်ပြီး၊ ဘယ်လို အလုပ်လုပ်လဲ ဆိုတာကိုတော့ မျဉ်းတွေက ပြောတာပါ။
      [[mark:z-wait]] ဥပမာ စောင့်ရတဲ့ call ဆိုရင် အဖြေ မလာတဲ့အခါ ဘာလုပ်မလဲ ဆိုတာ ကားလိုင်းဘက်က engineer က
      စဉ်းစားထားရပါမယ်။ မစောင့်ဘဲ ပို့တဲ့ အကြောင်းကြားချက်ဆိုရင်တော့ နောက်ကျပြီး ရောက်လာတာ၊ နှစ်ခါ ရောက်လာတာကို
      သူ့ system က ခံနိုင်ရပါမယ်။ မျဉ်းပေါ်က စာလုံး နှစ်လုံးက သူ့ design ကို ပြောင်းစေတာပါ။
      [[mark:z-key]] ကျန်တာက အသေးအဖွဲလို့ ထင်ရပေမဲ့ မပါရင် မဖြစ်တဲ့ အရာ သုံးခုပါ။ ဘယ်သူ့အတွက် ဘာပုံလဲ ပြောတဲ့
      ခေါင်းစဉ်၊ shape တစ်မျိုးကို အဓိပ္ပာယ် တစ်မျိုးတည်းနဲ့ သုံးတာနဲ့၊ သင်္ကေတတွေရဲ့ အဓိပ္ပာယ်ကို ရှင်းပြတဲ့ key ပါ။
      [[mark:z-level]] ဒီထက် ထပ်ချဲ့ရင် Booking service ထဲက component တွေ၊ ဆိုလိုတာက လုပ်ငန်း တစ်ခုစီကို
      တာဝန်ယူတဲ့ အစိတ်အပိုင်းတွေကို မြင်ရမှာပါ။ အဲဒါကတော့ Booking team အတွက် ပုံ ဖြစ်သွားပါပြီ။
      [[mark:z-mix]] context၊ deploy လုပ်တဲ့ အပိုင်းတွေနဲ့ component တွေ ဆိုတဲ့ အဆင့် သုံးဆင့်ကို ပုံတစ်ပုံထဲမှာ
      ရောမဆွဲပါနဲ့။ ပုံတစ်ပုံမှာ အဆင့် တစ်ဆင့်ပဲ ထားပါ။ box ၆၀ ပုံရဲ့ ပြဿနာက အဆင့် သုံးဆင့်လုံး တစ်ပုံတည်းမှာ
      ရောနေတာပါပဲ။
    sources:
      - {
          title: "The Software Architect Elevator (Hohpe)",
          url: "https://oreil.ly/Software_Architect_Elevator",
        }
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
      - { title: "The C4 model for visualising software architecture", url: "https://c4model.com/" }
    actions:
      - {
          id: point-partner,
          type: whiteboard.point,
          at: { mark: z-point },
          target: { assetId: c-partner },
        }
      - {
          id: draw-z-open,
          type: whiteboard.apply,
          at: { mark: z-open },
          clear: true,
          upsertIds: [z-title, z-partner, z-partner-l, z-bound, z-bound-l],
          drawMs: 2500,
        }
      - {
          id: draw-z-in,
          type: whiteboard.apply,
          at: { mark: z-in },
          upsertIds: [z-op, z-op-l, z-in, z-in-l],
          drawMs: 2400,
        }
      - {
          id: draw-z-out,
          type: whiteboard.apply,
          at: { mark: z-out },
          upsertIds: [z-bk, z-bk-l, z-out, z-out-l],
          drawMs: 2400,
        }
      - {
          id: draw-z-key,
          type: whiteboard.apply,
          at: { mark: z-key, offsetMs: 9000 },
          upsertIds: [z-key],
          drawMs: 1200,
        }
      - { id: point-z-bk, type: whiteboard.point, at: { mark: z-level }, target: { assetId: z-bk } }

  - id: checklist
    chapter: မမျှခင် စစ်ဆေးရန်
    narration: >
      [[mark:k-close]] အခု လုပ်ခဲ့တာတွေကို diagram တစ်ခု မမျှခင်တိုင်း စစ်လို့ရတဲ့ စာရင်းတိုလေး အဖြစ်
      ချရေးပါမယ်။
      [[mark:k-who]] ပထမဆုံး စစ်ရမှာက ဒီပုံက ဘယ်သူ့အတွက်လဲ၊ ဘာမေးခွန်းကို ဖြေတာလဲ ဆိုတာပါ။ တစ်ကြောင်းတည်းနဲ့
      မဖြေနိုင်ရင် ပုံက နှစ်ပုံ ဖြစ်သင့်နေပါပြီ။
      [[mark:k-level]] ဒုတိယက ပုံက အဆင့် တစ်ဆင့်တည်းမှာ ရှိရဲ့လား ဆိုတာပါ။ context လား၊ deploy လုပ်တဲ့
      အပိုင်းတွေလား၊ component တွေလား ဆိုတာ တစ်ခုပဲ ရွေးပါ။
      [[mark:k-lines]] တတိယက မျဉ်းတိုင်းမှာ ဘာ စီးလဲ၊ ခေါ်သူက စောင့်လား ဆိုတာ ရေးထားရဲ့လား စစ်ပါ။ ဘာမှ
      ရေးမထားတဲ့ မျဉ်းက ဆက်ထားတယ် ဆိုတာလောက်ပဲ ပြောပါတယ်။ ဒီနေ့ ဆွဲခဲ့တဲ့ context view ကိုလည်း မမျှခင်
      မျဉ်းတွေမှာ စာ ထည့်ရပါဦးမယ်။
      [[mark:k-key]] စတုတ္ထက shape တွေကို တသမတ်တည်း သုံးထားပြီး key ပါရဲ့လား ဆိုတာပါ။ မှားဖတ်နိုင်တဲ့ ပုံက
      ပုံ မရှိတာထက် ပိုဆိုးနိုင်ပါတယ်။
      [[mark:k-sketch]] နောက်ဆုံးက သေသေသပ်သပ် မဆွဲခင် ပုံကြမ်းနဲ့ တစ်ယောက်ယောက်ကို ပြပြီးပြီလား ဆိုတာပါ။ ဒီနေ့
      ဆွဲခဲ့တဲ့ ပုံတွေကလည်း လက်နဲ့ ဆွဲထားတဲ့ ပုံကြမ်းတွေပါပဲ။ ပုံကြမ်းဆိုရင် မှားနေတာကို ကြည့်တဲ့သူက ထောက်ပြရဲပြီး၊
      ဆွဲတဲ့သူကလည်း ဖျက်ပြီး ပြန်ဆွဲဖို့ ဝန်မလေးပါဘူး။ tool နဲ့ နာရီပေါင်းများစွာ အချိန်ကုန်ခံ ဆွဲထားတဲ့
      ပုံကျတော့၊ မှားနေမှန်း သိရင်တောင် မပြင်ချင်တော့တာ လူ့သဘာဝပါ။
      [[mark:p-open]] ပုံ ကောင်းရုံနဲ့ မပြီးသေးပါဘူး။ တင်ပြတဲ့ ပုံစံကလည်း အရေးကြီးပါတယ်။ ဒီနေ့ ကိုယ်တို့
      ဘယ်လို လုပ်ခဲ့လဲ ပြန်ကြည့်ရအောင်။
      [[mark:p-purpose]] ကားလိုင်းဘက်က engineer ရဲ့ မေးခွန်း၊ ဆိုလိုတာက ရည်ရွယ်ချက်ကနေ စခဲ့ပါတယ်။ service
      စာရင်းကနေ မစခဲ့ပါဘူး။
      [[mark:p-build]] ပုံကိုလည်း တစ်ခါတည်း အပြည့် မပြဘဲ၊ တစ်ပိုင်းချင်း တည်ဆောက်ပြခဲ့ပါတယ်။ ကြည့်တဲ့သူက
      ကိုယ် ပြောနေတဲ့ အပိုင်းကိုပဲ ကြည့်နိုင်အောင်ပါ။
      [[mark:p-where]] ချဲ့တဲ့အခါမှာလည်း တစ်ခုလုံးထဲက ဘယ်နေရာလဲ ဆိုတာ အရင် ပြခဲ့ပါတယ်။ ဒါမှ ကြည့်တဲ့သူက
      လမ်းမပျောက်မှာပါ။
      [[mark:p-deck]] နောက်တစ်ခု သတိထားစရာက တင်ပြဖို့ slide နဲ့ ဖတ်ဖို့ စာက မတူတာပါ။ တင်ပြတဲ့အခါ ကိုယ်က ဘေးကနေ
      ရှင်းပြနေတာမို့ slide ပေါ်မှာ စာ နည်းနည်းပဲ လိုပါတယ်။ ကိုယ် မရှိဘဲ ဖတ်ရမယ့်သူအတွက်ကတော့ အပြည့်အစုံ
      ရေးထားတဲ့ စာတစ်စောင် သီးခြား လိုပါတယ်။ slide တွေကို စာအပြည့် ဖြည့်ပြီး နှစ်မျိုးလုံးအတွက် သုံးရင်၊
      နှစ်မျိုးလုံးမှာ အဆင်မပြေပါဘူး။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
      - {
          title: "The Software Architect Elevator (Hohpe)",
          url: "https://oreil.ly/Software_Architect_Elevator",
        }
    actions:
      - { id: close-zoom, type: whiteboard.apply, at: { mark: k-close }, open: false }
      - {
          id: open-notebook,
          type: workspace.openFile,
          at: { afterAction: close-zoom },
          path: notebook/49-diagram-checklist.md,
        }
      - id: type-who
        type: editor.type
        at: { mark: k-who }
        cadence: line-by-line
        target: { file: notebook/49-diagram-checklist.md, after: "## ပုံ\n" }
        text: "- [ ] ဘယ်သူ့အတွက်လဲ၊ ဘာမေးခွန်းကို ဖြေတာလဲ (ခေါင်းစဉ်မှာ ရေးထား)\n"
      - id: type-level
        type: editor.type
        at: { mark: k-level }
        cadence: line-by-line
        target: { file: notebook/49-diagram-checklist.md, after: "(ခေါင်းစဉ်မှာ ရေးထား)\n" }
        text: "- [ ] အဆင့် တစ်ဆင့်တည်းလား: context / deploy လုပ်တဲ့ အပိုင်း / component\n"
      - id: type-lines
        type: editor.type
        at: { mark: k-lines }
        cadence: line-by-line
        target: { file: notebook/49-diagram-checklist.md, after: "/ component\n" }
        text: "- [ ] မျဉ်းတိုင်းမှာ ဘာ စီးလဲ၊ ခေါ်သူ စောင့်လား ရေးထားလား\n"
      - id: type-key
        type: editor.type
        at: { mark: k-key }
        cadence: line-by-line
        target: { file: notebook/49-diagram-checklist.md, after: "စောင့်လား ရေးထားလား\n" }
        text: "- [ ] shape တစ်မျိုး = အဓိပ္ပာယ် တစ်မျိုးလား၊ key ပါလား\n"
      - id: type-sketch
        type: editor.type
        at: { mark: k-sketch }
        cadence: line-by-line
        target: { file: notebook/49-diagram-checklist.md, after: "key ပါလား\n" }
        text: "- [ ] ပုံကြမ်းနဲ့ အရင် ပြပြီးပြီလား\n"
      - id: type-present
        type: editor.type
        at: { mark: p-open }
        cadence: line-by-line
        target: { file: notebook/49-diagram-checklist.md, after: "အရင် ပြပြီးပြီလား\n" }
        text: "\n## တင်ပြတဲ့အခါ\n"
      - id: type-purpose
        type: editor.type
        at: { mark: p-purpose }
        cadence: line-by-line
        target: { file: notebook/49-diagram-checklist.md, after: "## တင်ပြတဲ့အခါ\n" }
        text: "- [ ] ရည်ရွယ်ချက်ကနေ စ\n"
      - id: type-build
        type: editor.type
        at: { mark: p-build }
        cadence: line-by-line
        target: { file: notebook/49-diagram-checklist.md, after: "ရည်ရွယ်ချက်ကနေ စ\n" }
        text: "- [ ] ပုံကို တစ်ပိုင်းချင်း တည်ဆောက်ပြ\n"
      - id: type-where
        type: editor.type
        at: { mark: p-where }
        cadence: line-by-line
        target: { file: notebook/49-diagram-checklist.md, after: "တစ်ပိုင်းချင်း တည်ဆောက်ပြ\n" }
        text: "- [ ] မချဲ့ခင် တစ်ခုလုံးထဲက ဘယ်နေရာလဲ အရင်ပြ\n"
      - id: expect-who
        type: expect.file
        at: { afterAction: type-where }
        path: notebook/49-diagram-checklist.md
        contains: "- [ ] ဘယ်သူ့အတွက်လဲ၊ ဘာမေးခွန်းကို ဖြေတာလဲ (ခေါင်းစဉ်မှာ ရေးထား)\n"

  - id: your-turn
    chapter: ကိုယ့် system အတွက်
    narration: >
      အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ စာရွက် တစ်ရွက်ပေါ်မှာ ကိုယ့် system ရဲ့ context
      view ကို ဆွဲကြည့်ပါ။ ကိုယ့် system ကို အလယ်မှာ box တစ်ခုတည်း ထားပြီး၊ သုံးတဲ့သူတွေနဲ့ ဆက်သွယ်ရတဲ့ အပြင်က
      system တွေကို ပတ်ပတ်လည်မှာ ထည့်ပါ။
      [[mark:turn-2]] ပြီးရင် ဒီ စာရင်းထဲက ပထမ ငါးချက်နဲ့ စစ်ကြည့်ပါ။ ဘယ်သူ့အတွက်လဲ ဆိုတဲ့ ပထမ အချက်မှာတင်
      ရပ်သွားရင်လည်း၊ အဲဒါက အရေးကြီးဆုံး တွေ့ရှိချက်ပါပဲ။
      [[mark:turn-3]] နောက်ဆုံး စမ်းသပ်ချက် တစ်ခုလည်း လုပ်ကြည့်ပါ။ ပုံကို တစ်ယောက်ယောက်ကို ငါးစက္ကန့်လောက်ပဲ
      ပြပြီး ဘာမြင်လိုက်လဲ မေးပါ။ သူ ပြန်ပြောတာက ကိုယ် ပြချင်တာနဲ့ တူရင်၊ အဲဒီပုံက အလုပ်ဖြစ်ပါပြီ။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - id: sel-checks
        type: editor.select
        at: { mark: turn-2 }
        target:
          file: notebook/49-diagram-checklist.md
          text: "- [ ] ဘယ်သူ့အတွက်လဲ၊ ဘာမေးခွန်းကို ဖြေတာလဲ (ခေါင်းစဉ်မှာ ရေးထား)\n- [ ] အဆင့် တစ်ဆင့်တည်းလား: context / deploy လုပ်တဲ့ အပိုင်း / component\n- [ ] မျဉ်းတိုင်းမှာ ဘာ စီးလဲ၊ ခေါ်သူ စောင့်လား ရေးထားလား\n- [ ] shape တစ်မျိုး = အဓိပ္ပာယ် တစ်မျိုးလား၊ key ပါလား\n- [ ] ပုံကြမ်းနဲ့ အရင် ပြပြီးပြီလား"

  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ diagram တစ်ခုက လူတစ်မျိုးအတွက် မေးခွန်း တစ်ခုကိုပဲ ဖြေရပါတယ်။ ပုံတစ်ပုံမှာ အဆင့်
      တစ်ဆင့်ပဲ ထားပြီး၊ မျဉ်းတိုင်းမှာ ဘာ စီးလဲ၊ စောင့်လား ဆိုတာ ရေးပါ။ ပုံကြမ်းနဲ့ အရင် ပြပါ။ တင်ပြတဲ့အခါ
      ရည်ရွယ်ချက်ကနေ စပြီး၊ တစ်ပိုင်းချင်း တည်ဆောက်ပြပါ။ box ၆၀ ပါတဲ့ ပုံက မမှားပေမဲ့၊ ဘယ်သူ့မေးခွန်းကိုမှ
      မဖြေခဲ့တာပါ။
      [[mark:next]] ဒီ lesson နဲ့ဆို architecture ကို စောင့်ရှောက်တာ၊ မှတ်တမ်းတင်တာ၊ ပြသတာတွေ ပြီးပါပြီ။ ကျန်တာက
      လူတွေနဲ့ အလုပ်လုပ်တဲ့ အပိုင်းပါ။ နောက် lesson မှာတော့ architect တစ်ယောက်က development team နဲ့ ဘယ်လောက်
      နီးနီးကပ်ကပ် အလုပ်လုပ်သင့်လဲ ဆိုတာကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions: []

checks:
  - { type: timing.p95Ms, max: 300 }
