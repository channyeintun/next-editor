build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 8149

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: need
    chapter: Box 60 ပါတဲ့ diagram
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ system ရဲ့ အပိုင်း တစ်ခုစီမှာ risk ဘယ်လောက် ရှိလဲ ဆိုတာကို ထိခိုက်မှုနဲ့ ဖြစ်နိုင်ခြေ
      တွဲပြီး အကဲဖြတ်ခဲ့ပါတယ်။
      [[mark:n-open]] ဒီနေ့ကတော့ product manager လှလှ က ပြဿနာ တစ်ခု ယူလာပါတယ်။ ခရီးဖော် နဲ့ စချိတ်မယ့်
      ကားလိုင်း အသစ်တွေမှာ ကိုယ်ပိုင် system ရှိကြပါတယ်။ သူတို့ဘက်က engineer တွေကို ကိုယ်တို့ရဲ့ architecture
      diagram ကို ပေးထားပါတယ်။
      [[mark:n-boxes]] အဲဒီ ပုံက architect team က ဂရုတစိုက် ဆွဲထားတာပါ။ service တိုင်း၊ database တိုင်း၊ queue
      တိုင်း ပါပြီး box ပေါင်း ၆၀ ရှိပါတယ်။ မှားတာ တစ်ခုမှ မပါပါဘူး။ ပြည့်စုံလေ ကောင်းလေလို့ ကိုယ်တို့
      ထင်ခဲ့ကြတာပါ။
      [[mark:n-q]] ဒါပေမဲ့ ကားလိုင်းဘက်က engineer တွေကတော့ မေးခွန်း တစ်ခုတည်းကိုပဲ ထပ်ခါထပ်ခါ မေးနေကြပါတယ်။
      ကိုယ့် system က ဘယ်နေရာမှာ ချိတ်ရမှာလဲ တဲ့။ ပုံထဲမှာ အဖြေ ပါပေမဲ့၊ box ၆၀ ကြားထဲမှာ ဘယ်သူမှ
      ရှာမတွေ့ကြပါဘူး။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
      - {
          title: "The Software Architect Elevator (Hohpe)",
          url: "https://oreil.ly/Software_Architect_Elevator",
        }
    actions:
      - {
          id: draw-n-open,
          type: whiteboard.apply,
          at: { mark: n-open },
          open: true,
          upsertIds: [n-title],
        }
      - {
          id: draw-n-boxes,
          type: whiteboard.apply,
          at: { mark: n-boxes },
          upsertIds: [n-x1, n-x2, n-x3, n-x4, n-x5, n-x6, n-x7, n-x8, n-x9, n-x10],
          drawMs: 3000,
        }
      - {
          id: draw-n-more,
          type: whiteboard.apply,
          at: { mark: n-boxes, offsetMs: 6500 },
          upsertIds: [n-more],
          drawMs: 900,
        }
      - {
          id: draw-n-q,
          type: whiteboard.apply,
          at: { mark: n-q, offsetMs: 6500 },
          upsertIds: [n-q],
          drawMs: 1200,
        }

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ ဒီ ပုံကို ကြည့်နေတာ ကားလိုင်းဘက်က engineer တွေချည်း မဟုတ်ပါဘူး။ CTO
      ဖြစ်တဲ့ အောင်အောင် လည်း ကြည့်သလို၊ ညဘက် system ပျက်ရင် ထကြည့်ရတဲ့ on call engineer လည်း ကြည့်ပါတယ်။
      [[mark:quiz-a]] ပထမ နည်းက ပုံကို ရှင်းအောင် ပြန်ဆွဲပြီး၊ လူတိုင်းအတွက် တစ်ပုံတည်း ထားတာပါ။ Booking team lead
      မောင်မောင် က ဒီနည်းကို ကြိုက်ပါတယ်။ ပုံ များလာရင် ထိန်းရတာ ခက်မှာကို သူ စိုးရိမ်လို့ပါ။
      [[mark:quiz-b]] ဒုတိယ နည်းက မေးခွန်း တစ်ခုအတွက် ပုံတစ်ပုံစီ ဆွဲတာပါ။ ဘယ်နည်းက ပိုသင့်တော်မလဲ။ lesson ကို
      pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ နည်းပါ။ ဘာကြောင့်လဲဆိုတော့ သုံးယောက်က မေးခွန်း သုံးခုကို
      မေးနေကြလို့ပါ။
      [[mark:q-cto]] အောင်အောင် က ဘယ်အပိုင်းမှာ ငွေ အများဆုံး ကုန်ပြီး၊ ဘယ်မှာ risk ရှိလဲ သိချင်ပါတယ်။
      [[mark:q-partner]] ကားလိုင်းဘက်က engineer က သူ့ system ကို ဘယ်မှာ ချိတ်ရမလဲ သိချင်ပါတယ်။
      [[mark:q-oncall]] on call engineer ကတော့ အပိုင်း တစ်ခု ပျက်ရင် ဘာတွေ လိုက်ပျက်မလဲ သိချင်ပါတယ်။
      [[mark:q-rule]] ပုံတစ်ပုံတည်းနဲ့ သုံးခုလုံးကို ဖြေဖို့ ကြိုးစားရင် box ၆၀ ပုံကိုပဲ ပြန်ရမှာပါ။ ဒါကြောင့်
      diagram တစ်ခုက လူတစ်မျိုးအတွက်၊ မေးခွန်း တစ်ခုကိုပဲ ဖြေရပါတယ်။ မောင်မောင် စိုးရိမ်တာလည်း မမှားပါဘူး။
      ပုံ တစ်ခုစီကို သေးသေးနဲ့ ရှင်းရှင်း ထားမှ ပြန်ဆွဲရတာ သက်သာမှာပါ။
    sources:
      - {
          title: "The Software Architect Elevator (Hohpe)",
          url: "https://oreil.ly/Software_Architect_Elevator",
        }
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - {
          id: draw-quiz-a,
          type: whiteboard.apply,
          at: { mark: quiz-a },
          upsertIds: [q-a],
          drawMs: 900,
        }
      - {
          id: draw-quiz-b,
          type: whiteboard.apply,
          at: { mark: quiz-b },
          upsertIds: [q-b],
          drawMs: 900,
        }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-q-cto,
          type: whiteboard.apply,
          at: { mark: q-cto },
          upsertIds: [q-cto],
          drawMs: 1000,
        }
      - {
          id: draw-q-partner,
          type: whiteboard.apply,
          at: { mark: q-partner },
          upsertIds: [q-partner],
          drawMs: 1000,
        }
      - {
          id: draw-q-oncall,
