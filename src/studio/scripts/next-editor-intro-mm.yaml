# Burmese introduction to Next Editor for learners who have never seen it.
# Narration is the owner-approved voice script, word for word; only the
# [[mark:…]] anchors were added where its on-screen notes place each action.
# Two whiteboards explain the idea (a coding video is only pictures; a lesson
# is one timeline of event tracks), a small Vite page is built in the real
# editor (HTML -> CSS -> JavaScript -> a click in the preview), and three more
# boards cover the learner's pause-edit-run loop, what else a lesson can carry,
# and where to start. The close says the lesson was made with Studio.
#
# Typing into a running Vite server: index.html changes reload the page, so the
# HTML lands line by line (every intermediate file is valid HTML); plain CSS is
# hot-updated on every keystroke without a reload, so the heading colour is a
# name with no valid shorter prefix (royalblue: the heading stays as it was
# until the word is complete, where a hex value would flash #197, #1971, ...)
# and the button lines land whole; main.js changes reload the page and a
# half-typed script would throw in the preview, so the JavaScript lands as one
# block. The final scene closes the board on style.css with the button's green
# selected, so a learner who pauses as told sees the code, not a diagram.
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/next-editor-intro-mm.yaml
