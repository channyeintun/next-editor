build:
  # Studio replaces this built-in profile with the selected Burmese VoxCPM2
  # profile at render time when the signed-in user has the D1 capability.
  voiceProfile: pocket-alba-v1
  seed: 207

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install --frozen-lockfile
  runCommand: pnpm dev
  expectedPort: 5173
  lockfilePath: pnpm-lock.yaml
  environment: {}

scenes:
  - id: video-vs-next-editor
    chapter: "သာမန် ဗီဒီယိုနဲ့ ဘာကွာလဲ"
    narration: >
      မင်္ဂလာပါ ခင်ဗျာ။ ဒီ lesson မှာ Next Editor ဆိုတာ ဘာလဲ၊ သာမန် ဗီဒီယိုနဲ့
      ဘာကွာလဲ ဆိုတာကို ရှင်းပြသွားပါမယ်။ Coding ကို ဗီဒီယိုကနေ
      လေ့လာဖူးတဲ့သူတိုင်း ဒီအတွေ့အကြုံကို သိကြမှာပါ။ [[mark:draw-video-frame]]
      ဗီဒီယိုထဲက ဆရာက code ရိုက်ပြနေတော့၊ ကိုယ်ကလည်း ဗီဒီယိုကို pause လုပ်၊ ကိုယ့် editor ဘက်ကို
      ပြောင်း၊ မြင်ရတဲ့ code ကို တစ်လုံးချင်း ပြန်ရိုက်၊ ပြီးမှ ဗီဒီယိုကို
      ပြန်ဖွင့်၊ ဒီလိုပဲ ထပ်ခါထပ်ခါ လုပ်နေရပါတယ်။ တစ်လုံး မှားရိုက်မိတာနဲ့ error
      တက်ပြီး၊ အမှား ရှာရင်းနဲ့ ဗီဒီယို ဘယ်ရောက်နေပြီလဲတောင်
      ပြန်မသိတော့တာမျိုးလည်း ကြုံဖူးကြမှာပါ။ [[mark:label-video-pictures]] ဘာလို့
      ဒီလို ဖြစ်ရလဲဆိုတော့၊ ဗီဒီယိုဆိုတာ မျက်နှာပြင်ကို ရိုက်ထားတဲ့ ပုံတွေပဲ
      ဖြစ်လို့ပါ။ ကိုယ်က code လို့ မြင်နေရပေမယ့်၊ ကွန်ပျူတာအတွက်ကတော့
      ပုံတစ်ပုံပါပဲ။ [[mark:cross-out-video-limits]] ဒါကြောင့် အဲဒီ code ကို
      copy ကူးလို့ မရသလို၊ ပြင်ကြည့်လို့လည်း မရ၊ run ကြည့်လို့လည်း မရပါဘူး။
      [[mark:draw-next-editor-box]] Next Editor ကတော့ မျက်နှာပြင်ကို ဗီဒီယို
      ရိုက်မယ့်အစား၊ lesson အတွင်းမှာ တကယ် ဖြစ်သွားတဲ့ အရာတွေကို
      မှတ်တမ်းတင်ထားပါတယ်။ [[mark:list-recorded-events]] ဘယ်ဖိုင်ကို
      ဖွင့်လိုက်လဲ၊ ဘာ code ရိုက်ထည့်လိုက်လဲ၊ preview ထဲမှာ ဘာ ပြောင်းသွားလဲ
      ဆိုတာတွေကို တစ်ခုချင်းစီ မှတ်ထားတဲ့အတွက်၊ ပြန်ကြည့်တဲ့အခါ ပုံ ပြန်ပြတာ
      မဟုတ်ဘဲ၊ ဖြစ်ခဲ့တာတွေကို တကယ့် editor ထဲမှာ အဲဒီအတိုင်း
      ပြန်လုပ်ပြနိုင်တာပါ။
    sources:
      - title: "Next Editor"
        url: "https://nexteditor.dev/"
      - title: "Next Editor — Architecture"
        url: "https://nexteditor.dev/architecture"
    actions:
      - id: open-hook-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        maximized: true
        clear: true
        upsertIds: []
      - id: draw-hook-title
        type: whiteboard.apply
        at: { scene: start }
        upsertIds: [hook-title]
        drawMs: 1200
      # The player is drawn while the pause / switch / retype / play story is
      # told, so that long opening is not spent on a title alone; the red label
      # lands on the words that say a video is only pictures.
      - id: draw-video-frame
        type: whiteboard.apply
        at: { mark: draw-video-frame }
        upsertIds:
          [
            hook-video-frame,
            hook-video-line-1,
            hook-video-line-2,
            hook-video-line-3,
            hook-video-play,
            hook-video-bar,
            hook-video-progress,
          ]
        drawMs: 2600
      - id: label-video-pictures
        type: whiteboard.apply
        at: { mark: label-video-pictures }
        upsertIds: [hook-video-label]
        drawMs: 800
      - id: cross-out-video-limits
        type: whiteboard.apply
        at: { mark: cross-out-video-limits }
        upsertIds:
          [
            hook-no-copy,
            hook-no-copy-strike,
            hook-no-edit,
            hook-no-edit-strike,
            hook-no-run,
            hook-no-run-strike,
          ]
        drawMs: 2700
      - id: draw-next-editor-box
        type: whiteboard.apply
        at: { mark: draw-next-editor-box }
        upsertIds: [hook-arrow, hook-ne-box, hook-ne-heading, hook-ne-body]
        drawMs: 2200
      - id: list-recorded-events
        type: whiteboard.apply
        at: { mark: list-recorded-events }
        upsertIds:
          [
            hook-rec-check-1,
            hook-rec-file,
            hook-rec-check-2,
            hook-rec-code,
            hook-rec-check-3,
            hook-rec-preview,
          ]
        drawMs: 2700

  - id: one-timeline
    chapter: "lesson တစ်ခုကို ဘယ်လို သိမ်းထားလဲ"
    narration: >
      ဒါဆို lesson တစ်ခုကို ဘယ်လို သိမ်းထားလဲ ဆိုတာ ပုံနဲ့ ကြည့်ရအောင်။
      [[mark:draw-timeline-title]] Next Editor မှာ lesson တစ်ခုဆိုတာ
      အခြေခံအားဖြင့် timeline တစ်ခုပါ။ [[mark:draw-voice-track]] ဒီ timeline
      ပေါ်မှာ track တွေ အလွှာလိုက် ရှိပြီး၊ အပေါ်ဆုံး track ကတော့ ရှင်းပြနေတဲ့
      အသံပါ။ [[mark:draw-code-file-tracks]] သူ့အောက်မှာ code ပြင်တာအတွက် track
      တစ်ခု၊ ဖိုင် ဖွင့်တာ ပိတ်တာအတွက် track တစ်ခု ရှိပါတယ်။
      [[mark:draw-view-tracks]] ပြီးတော့ preview၊ whiteboard နဲ့ slide
      တွေအတွက်လည်း track တွေ ကိုယ်စီ ရှိပါတယ်။ [[mark:mark-track-events]] track
      တွေပေါ်က အကွက်လေးတွေကတော့ event တွေပါ။ စာလုံးတစ်လုံး ရိုက်လိုက်တာ၊
      ဖိုင်တစ်ခု ဖွင့်လိုက်တာ၊ preview ထဲက ခလုတ်ကို နှိပ်လိုက်တာ၊ ဒါတွေ
      တစ်ခုချင်းစီက event တစ်ခုစီ ဖြစ်ပြီး၊ ဘယ်အချိန်မှာ ဘာ ဖြစ်သွားလဲ ဆိုတာကို
      timeline ပေါ်မှာ အတိအကျ မှတ်ထားတာပါ။ [[mark:draw-playhead]] ဒီ အနီရောင်
      မျဉ်းကတော့ playhead ပါ။ lesson ကို ဖွင့်လိုက်ရင် playhead က timeline
      အတိုင်း ရွေ့သွားပြီး၊ သူ ရောက်သွားတဲ့ နေရာက event တွေကို editor က
      တစ်ခုချင်း ပြန်လုပ်ပြပါတယ်။ [[mark:write-replay-rule]] ဒါကြောင့်
      ပြန်ကြည့်နေချိန်မှာ ကိုယ် မြင်နေရတာတွေဟာ ဗီဒီယို မဟုတ်ဘဲ၊ တကယ့် editor
      ထဲမှာ တကယ့် ဖိုင်တွေနဲ့ အစကနေ ပြန်ဖြစ်နေတာပါ။
    sources:
      - title: "Next Editor — Architecture"
        url: "https://nexteditor.dev/architecture"
      - title: "rrweb — record and replay the web"
        url: "https://github.com/rrweb-io/rrweb"
    actions:
      - id: draw-timeline-title
        type: whiteboard.apply
        at: { mark: draw-timeline-title }
        clear: true
        upsertIds: [tl-title]
        drawMs: 1000
      - id: draw-voice-track
        type: whiteboard.apply
        at: { mark: draw-voice-track }
        upsertIds: [tl-voice-label, tl-voice-bar, tl-voice-clip]
        drawMs: 1500
      - id: draw-code-file-tracks
        type: whiteboard.apply
        at: { mark: draw-code-file-tracks }
        upsertIds: [tl-code-label, tl-code-bar, tl-file-label, tl-file-bar]
        drawMs: 2000
      - id: draw-view-tracks
        type: whiteboard.apply
        at: { mark: draw-view-tracks }
        upsertIds:
          [
            tl-preview-label,
            tl-preview-bar,
            tl-board-label,
            tl-board-bar,
            tl-slide-label,
            tl-slide-bar,
          ]
        drawMs: 2700
      - id: mark-track-events
        type: whiteboard.apply
        at: { mark: mark-track-events }
        upsertIds:
          [
            tl-code-event-1,
            tl-file-event-1,
            tl-board-event-1,
            tl-code-event-2,
            tl-preview-event-1,
            tl-code-event-3,
            tl-preview-event-2,
            tl-slide-event-1,
            tl-file-event-2,
            tl-code-event-4,
            tl-preview-event-3,
            tl-board-event-2,
          ]
        drawMs: 3000
      - id: draw-playhead
        type: whiteboard.apply
        at: { mark: draw-playhead }
        upsertIds: [tl-playhead, tl-playhead-label]
        drawMs: 1200
      - id: write-replay-rule
        type: whiteboard.apply
        at: { mark: write-replay-rule }
        upsertIds: [tl-rule]
        drawMs: 1800

  - id: demo-dev-server
    chapter: "တကယ့် editor ထဲမှာ လက်တွေ့ ကြည့်ရအောင်"
    narration: >
      [[mark:close-concept-board]] ပြောရုံနဲ့တော့ မြင်သာမှာ မဟုတ်လို့၊ တကယ့်
      editor ထဲမှာ လက်တွေ့ ကြည့်ရအောင်။ [[mark:open-index-html]] ဒီမှာ ဖိုင်
      သုံးဖိုင်ပဲ ပါတဲ့ project သေးသေးလေး တစ်ခု ရှိပါတယ်။ page ကိုယ်တိုင်
      ဖြစ်မယ့် HTML ဖိုင် တစ်ဖိုင်၊ အဲဒီ page ကို အလှဆင်ပေးမယ့် CSS ဖိုင်
      တစ်ဖိုင်နဲ့၊ page ကို အလုပ်လုပ်စေမယ့် JavaScript ဖိုင် တစ်ဖိုင်ပါ။ အခု
      ဖွင့်ထားတာက HTML ဖိုင် ဖြစ်ပြီး၊ page ရဲ့ အဓိက အပိုင်းက အလွတ်ပဲ
      ရှိပါသေးတယ်။ [[mark:start-dev-server]] အရင်ဆုံး dev server ကို စ run
      ကြည့်ရအောင်။ အောက်က terminal ထဲမှာ လိုအပ်တဲ့ package တွေ install
      လုပ်နေတာကို မြင်ရပါလိမ့်မယ်။ ဒီနေရာမှာ အရေးကြီးတာ တစ်ခုက၊ အခု run နေတဲ့
      Node.js ဟာ အဝေးက server တစ်ခုခုပေါ်မှာ run နေတာ မဟုတ်ဘဲ၊ ကိုယ့် browser
      tab ထဲမှာပဲ အကုန် အလုပ်လုပ်နေတာပါ။ ဒါကြောင့် lesson ကြည့်မယ့်သူက ကိုယ့်
      ကွန်ပျူတာမှာ ဘာမှ install လုပ်စရာ မလိုဘဲ၊ browser ထဲမှာ lesson ကို
      ဖွင့်လိုက်ရုံနဲ့ အကုန် အသင့် ဖြစ်နေပါတယ်။ [[mark:preview-opens]] install
      ပြီးသွားတော့ dev server စသွားပြီး၊ ညာဘက်မှာ preview ပွင့်လာပါပြီ။ အခုတော့
      ဘာမှ မပါသေးတဲ့ အကွက်အလွတ်လေး တစ်ခုပဲ မြင်ရပါသေးတယ်။ ဒီ preview က ဖိုင်ထဲက
      HTML ကို browser က တကယ် ဖတ်ပြီး ပြနေတာ ဖြစ်တဲ့အတွက်၊ ဖိုင်ကို
      ပြင်လိုက်တိုင်း ဒီနေရာမှာ လိုက်ပြောင်းသွားမှာပါ။
    sources:
      - title: "WebContainers — Introduction"
        url: "https://webcontainers.io/guides/introduction"
      - title: "Vite — Getting Started"
        url: "https://vite.dev/guide/"
    actions:
      - id: close-concept-board
        type: whiteboard.apply
        at: { mark: close-concept-board }
        open: false
      - id: open-index-html
        type: workspace.openFile
        at: { mark: open-index-html }
        path: index.html
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-dev-server }
        timeoutMs: 45000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { afterAction: start-dev-server }
        timeoutMs: 20000
        retry: { maxAttempts: 2, delayMs: 250 }
      # Opened on the words that announce it; the Performer runs actions in
      # order, so it also waits for the server to be ready.
      - id: open-preview
        type: preview.open
        at: { mark: preview-opens }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-empty-card
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: card }
        retry: { maxAttempts: 3, delayMs: 150 }
      # The install output has been read; give the editor the room for the three
      # files that follow.
      - id: collapse-runner-dock
        type: runtime.collapseDock
        at: { afterAction: expect-empty-card }

  - id: page-content
    narration: >
      ကဲ၊ page ထဲကို အကြောင်းအရာ ထည့်ကြည့်ရအောင်။ [[mark:type-page-content]]
      ထည့်မှာက ခေါင်းစဉ် တစ်ခု၊ စာပိုဒ် အတို တစ်ခုနဲ့ ခလုတ် တစ်ခုပါ။ စာသားတွေကို
      မြန်မာလို ရေးထားတဲ့အတွက်၊ preview ထဲမှာ မြန်မာစာ ပေါ်လာတာကိုပါ
      တွဲမြင်ရပါလိမ့်မယ်။ ရိုက်နေတုန်း ဘေးက preview ကို လိုက်ကြည့်ပါ။ HTML
      ဖိုင်ကို ပြင်လိုက်တိုင်း dev server က page ကို အလိုအလျောက်
      ပြန်ဖွင့်ပေးတဲ့အတွက်၊ ထည့်လိုက်တဲ့ အရာတွေက preview ထဲမှာ တန်းပေါ်လာပါတယ်။
      [[mark:preview-shows-content]] ဒီမှာ ခေါင်းစဉ်၊ စာပိုဒ်နဲ့ ခလုတ်၊
      သုံးခုလုံး ရောက်နေပါပြီ။ ဒီအဆင့်မှာ ခလုတ်ကို နှိပ်ရင်တော့ ဘာမှ
      မဖြစ်သေးပါဘူး။ ဘာကြောင့်လဲဆိုတော့၊ ခလုတ်ကို နှိပ်ရင် ဘာလုပ်ရမလဲ ဆိုတာကို
      JavaScript နဲ့ မပြောထားသေးလို့ပါ။ ဒီ preview ကို Next Editor က ပုံအနေနဲ့
      မှတ်ထားတာ မဟုတ်ဘဲ၊ page ထဲမှာ ဖြစ်သွားတဲ့ ပြောင်းလဲမှုတွေကိုပဲ
      မှတ်ထားတာပါ။ ဒါကြောင့် နောက်မှ ပြန်ကြည့်တဲ့အခါ၊ page အစစ်ကို
      ပြန်တည်ဆောက်ပြီး ဒီအတိုင်း ပြန်ပြတာ ဖြစ်ပါတယ်။
    sources:
      - title: "MDN — <button>: The Button element"
        url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Element/button"
      - title: "Vite — index.html and Project Root"
        url: "https://vite.dev/guide/#index-html-and-project-root"
      - title: "rrweb — record and replay the web"
        url: "https://github.com/rrweb-io/rrweb"
    actions:
      # index.html changes make Vite reload the page, so the HTML lands one whole
      # line at a time: every intermediate file is valid HTML.
      - id: type-page-content
        type: editor.type
        at: { mark: type-page-content }
        cadence: line-by-line
        target:
          file: index.html
          after: "    <main class=\"card\" data-testid=\"card\">\n"
          occurrence: 1
        text: "      <h1 data-testid=\"title\">မင်္ဂလာပါ</h1>\n      <p data-testid=\"message\">အောက်က ခလုတ်ကို နှိပ်ကြည့်ပါ။</p>\n      <button type=\"button\" data-testid=\"hello-button\">နှိပ်ကြည့်ပါ</button>\n"
      - id: expect-heading-shown
        type: expect.preview
        at: { mark: preview-shows-content }
        timeoutMs: 4000
        target: { by: testId, value: title }
        textContains: "မင်္ဂလာပါ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-paragraph-shown
        type: expect.preview
        at: { afterAction: expect-heading-shown }
        timeoutMs: 4000
        target: { by: testId, value: message }
        textContains: "အောက်က ခလုတ်ကို နှိပ်ကြည့်ပါ။"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-button-shown
        type: expect.preview
        at: { afterAction: expect-paragraph-shown }
        timeoutMs: 4000
        target: { by: testId, value: hello-button }
        textContains: "နှိပ်ကြည့်ပါ"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: page-styles
    narration: >
      အခု page ကို နည်းနည်း လှအောင် လုပ်ကြည့်ရအောင်။ [[mark:open-style-css]]
      ဒါအတွက် CSS ဖိုင်ကို ဖွင့်ပါမယ်။ [[mark:type-heading-colour]] ပထမဆုံး
      ခေါင်းစဉ်ကို အပြာရောင် ပေးကြည့်ပါမယ်။ အရောင်ကို ရိုက်နေတုန်းမှာပဲ preview
      ထဲက ခေါင်းစဉ် လိုက်ပြောင်းနေတာကို သတိထား ကြည့်ပါ။ ဒီတစ်ခါ page တစ်ခုလုံး
      ပြန်ပွင့်တာ မဟုတ်ဘဲ၊ ပြောင်းသွားတဲ့ style လေးကိုပဲ browser က
      အစားထိုးလိုက်တာပါ။ CSS ကို ပြင်တဲ့အခါ dev server က ဒီလိုပဲ လုပ်ပေးပါတယ်။
      [[mark:type-button-shape]] နောက်တစ်ဆင့်က ခလုတ်ပါ။ အခု ခလုတ်က browser ရဲ့
      မူလ ပုံစံအတိုင်း ရိုးရိုးပဲ ရှိနေတဲ့အတွက်၊ စာသားနဲ့ ဘောင်ကြားမှာ နေရာလွတ်
      ပိုရအောင်၊ ထောင့်တွေကိုလည်း ဝိုင်းဝိုင်းလေး ဖြစ်အောင် style ပေးလိုက်ပါမယ်။
      [[mark:type-button-colours]] နောက်ဆုံး နောက်ခံကို အစိမ်းရောင်၊ စာလုံးကို
      အဖြူရောင် ပေးလိုက်တော့၊ နှိပ်ချင်စရာ ကောင်းတဲ့ ခလုတ်လေး ဖြစ်သွားပါပြီ။
      [[mark:styles-done]] ဒီလို code တစ်ကြောင်း ရိုက်လိုက်တိုင်း သူ့ရလဒ်ကို
      ဘေးမှာ တန်းမြင်ရတာက သင်ယူတဲ့သူအတွက် တကယ် အရေးကြီးပါတယ်။ CSS ကို
      စလေ့လာတဲ့အခါ အခက်ဆုံးက syntax မဟုတ်ဘဲ၊ ဘယ်စာကြောင်းက ဘာကို ပြောင်းပေးလဲ
      ဆိုတာကို စိတ်ထဲမှာ မြင်နိုင်ဖို့ပါ။ code နဲ့ ရလဒ်ကို ဒီလို တွဲမြင်ရတော့၊
      ဖတ်ရုံနဲ့ မှတ်ရတာ မဟုတ်ဘဲ မျက်စိနဲ့ပါ မှတ်မိသွားပါတယ်။
    sources:
      - title: "Vite — Features: CSS"
        url: "https://vite.dev/guide/features.html#css"
      - title: "Vite — Features: Hot Module Replacement"
        url: "https://vite.dev/guide/features.html#hot-module-replacement"
      - title: "MDN — border-radius"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/border-radius"
    actions:
      - id: open-style-css
        type: workspace.openFile
        at: { mark: open-style-css }
        path: style.css
      # Plain CSS reaches the page untouched (no PostCSS config, @import or
      # url()) and the preview updates without a reload on every keystroke.
      # The browser closes the unfinished rule at the end of the file, so every
      # prefix of the value is applied: a hex colour would flash #197 (teal),
      # #1971 (almost transparent) and then black before #1971c2. No prefix of
      # "royalblue" is a colour, so the heading turns blue in one step.
      - id: type-heading-colour
        type: editor.type
        at: { mark: type-heading-colour }
        target:
          file: style.css
          after: "button {\n  font: inherit;\n}\n"
          occurrence: 1
        text: "\nh1 {\n  color: royalblue;\n}\n"
      - id: type-button-shape
        type: editor.type
        at: { mark: type-button-shape }
        cadence: fast-explainer
        target:
          file: style.css
          after: "  font: inherit;\n"
          occurrence: 1
        text: "  padding: 12px 28px;\n  border-radius: 999px;\n"
      # The colour lines land one at a time: keystrokes here would outlast the
      # one short sentence that announces them.
      - id: type-button-colours
        type: editor.type
        at: { mark: type-button-colours }
        cadence: line-by-line
        target:
          file: style.css
          after: "  border-radius: 999px;\n"
          occurrence: 1
        text: "  background: #2f9e44;\n  color: white;\n  border: 0;\n"
      - id: expect-button-styles
        type: expect.file
        at: { mark: styles-done }
        path: style.css
        contains: "  background: #2f9e44;\n  color: white;\n  border: 0;\n}"

  - id: button-script
    chapter: "ခလုတ်ကို အလုပ်လုပ်အောင် လုပ်ကြည့်ရအောင်"
    narration: >
      ကဲ၊ အခု ခလုတ်ကို အလုပ်လုပ်အောင် လုပ်ကြည့်ရအောင်။ [[mark:open-main-js]]
      ဒါအတွက် JavaScript ဖိုင်ကို ဖွင့်ပါမယ်။ [[mark:type-click-handler]]
      ထည့်မယ့် code က အကြောင်း နည်းနည်းပဲ ရှိပါတယ်။ သဘောကတော့၊ page ထဲက ခလုတ်နဲ့
      စာပိုဒ်ကို အရင် ရှာထားပြီး၊ ခလုတ်ကို နှိပ်လိုက်တဲ့အခါ စာပိုဒ်ထဲက စာသားကို
      အသစ်တစ်ခုနဲ့ လဲပေးဖို့ ရေးထားတာပါ။ code တစ်ကြောင်းချင်းစီကိုတော့ ဒီ lesson
      မှာ အသေးစိတ် မရှင်းတော့ပါဘူး။ ဒီ lesson က JavaScript သင်တာ မဟုတ်ဘဲ Next
      Editor ကို မိတ်ဆက်တာ ဖြစ်လို့ပါ။ [[mark:page-reloads]] JavaScript ဖိုင်ကို
      ပြင်လိုက်တော့ dev server က page ကို ပြန်ဖွင့်ပြီး၊ code အသစ်ကို run
      ပေးပါပြီ။ [[mark:click-button]] ဒါဆို preview ထဲက ခလုတ်ကို
      နှိပ်ကြည့်ရအောင်။ [[mark:after-click]] ကြည့်ပါ၊ စာပိုဒ်ထဲက စာသား
      ပြောင်းသွားပါပြီ။ အခု ဖြစ်သွားတာက ဗီဒီယိုထဲက ပုံ ပြောင်းသွားတာ မဟုတ်ပါဘူး။
      ခုနက ရေးလိုက်တဲ့ code က browser ထဲမှာ တကယ် run နေပြီး၊ ခလုတ်
      နှိပ်လိုက်တာကို တကယ် လက်ခံပြီး၊ စာပိုဒ်ကို တကယ် ပြောင်းပေးလိုက်တာပါ။
    sources:
      - title: "MDN — Document.querySelector()"
        url: "https://developer.mozilla.org/en-US/docs/Web/API/Document/querySelector"
      - title: "MDN — EventTarget.addEventListener()"
        url: "https://developer.mozilla.org/en-US/docs/Web/API/EventTarget/addEventListener"
      - title: "MDN — Node.textContent"
        url: "https://developer.mozilla.org/en-US/docs/Web/API/Node/textContent"
    actions:
      - id: open-main-js
        type: workspace.openFile
        at: { mark: open-main-js }
        path: main.js
      # main.js changes reload the page and a half-typed script would throw in
      # the preview, so the lines land as one block.
      - id: type-click-handler
        type: editor.type
        at: { mark: type-click-handler }
        cadence: block
        target:
          file: main.js
          after: "import \"./style.css\";\n"
          occurrence: 1
        text: "\nconst button = document.querySelector('[data-testid=\"hello-button\"]');\nconst message = document.querySelector('[data-testid=\"message\"]');\n\nbutton.addEventListener(\"click\", () => {\n  message.textContent = \"ဗီဒီယို မဟုတ်ပါဘူး၊ တကယ် run နေတဲ့ code ပါ။\";\n});\n"
      # The reload has settled: the page is back with its first paragraph.
      - id: expect-page-reloaded
        type: expect.preview
        at: { mark: page-reloads }
        timeoutMs: 4000
        target: { by: testId, value: message }
        textContains: "အောက်က ခလုတ်ကို နှိပ်ကြည့်ပါ။"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: click-hello-button
        type: preview.click
        at: { mark: click-button }
        timeoutMs: 5000
        target: { by: testId, value: hello-button }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-paragraph-changed
        type: expect.preview
        at: { mark: after-click }
        timeoutMs: 5000
        target: { by: testId, value: message }
        textContains: "ဗီဒီယို မဟုတ်ပါဘူး၊ တကယ် run နေတဲ့ code ပါ။"
        retry: { maxAttempts: 3, delayMs: 150 }
      - id: expect-final-script
        type: expect.file
        at: { afterAction: expect-paragraph-changed }
        path: main.js
        contains: 'button.addEventListener("click"'

  - id: learner-loop
    chapter: "ကြည့်ရင်း စမ်း၊ စမ်းရင်း ကြည့်"
    narration: >
      ဒါဆို ဒီအချက်တွေက lesson ကြည့်နေတဲ့သူအတွက် ဘာ ထူးသွားလဲ ဆိုတာ ကြည့်ရအောင်။
      အစမှာ ပြောခဲ့တဲ့ ဗီဒီယို pause လုပ်၊ editor ပြောင်း၊ code ပြန်ရိုက်၊
      ဗီဒီယို ပြန်ဖွင့် ဆိုတဲ့ အဆင့်တွေ ဒီမှာ မလိုတော့ပါဘူး။
      [[mark:draw-pause-step]] lesson ကို ကြိုက်တဲ့ နေရာမှာ pause လုပ်ထားလို့
      ရပါတယ်။ [[mark:draw-edit-step]] pause လုပ်ထားတဲ့အချိန်မှာ မျက်နှာပြင်ပေါ်က
      editor ဟာ တကယ့် editor ဖြစ်နေတဲ့အတွက်၊ ထဲက code ကို ဘယ်ကမှ ကူးစရာ မလိုဘဲ
      ဒီအတိုင်းပဲ ဝင်ပြင်လို့ ရပါတယ်။ ဥပမာအားဖြင့် ခုနက ခလုတ်ရဲ့ အစိမ်းရောင်ကို
      ကိုယ်ကြိုက်တဲ့ အရောင် ပြောင်းကြည့်လို့ ရပါတယ်။ [[mark:draw-run-step]]
      ပြင်ပြီးရင် run ကြည့်လိုက်ရုံပါပဲ၊ ရလဒ်ကို preview ထဲမှာ ချက်ချင်း
      မြင်ရပါလိမ့်မယ်။ [[mark:draw-continue-step]] စိတ်ကျေနပ်သွားရင် Play ကို
      ပြန်နှိပ်ပြီး lesson ကို ဆက်ကြည့်လို့ ရပါတယ်။ ဘယ်နေရာ ရောက်နေပြီလဲ
      ပြန်ရှာစရာ မလိုဘဲ၊ lesson က ရပ်ထားတဲ့ နေရာကနေ သူ့ code နဲ့သူ
      ဆက်သွားပါလိမ့်မယ်။ [[mark:draw-versions]] ကိုယ် ပြင်ထားတာတွေကလည်း
      ပျောက်မသွားပါဘူး။ lesson ကို ပြန်ဆက်လိုက်တဲ့အခါ၊ ဒါမှမဟုတ် တခြား နေရာကို
      ခုန်သွားတဲ့အခါမှာ၊ ကိုယ် ပြင်ထားတဲ့ code ကို version တစ်ခုအနေနဲ့
      သိမ်းထားပေးပြီး၊ နောက်မှ ပြန်ယူလို့ ရပါတယ်။ lesson တစ်ခုအတွက် version
      ဆယ်ခုအထိ သိမ်းထားနိုင်ပါတယ်။ ဒီလို ကြည့်ရင်း စမ်း၊ စမ်းရင်း ကြည့်တာက
      ကိုယ့်လက်နဲ့ ပြင်ပြီး ရလဒ်ကို ကိုယ်တိုင် မြင်ရတဲ့အတွက်၊ ကြည့်ရုံ
      ကြည့်တာထက် အများကြီး ပိုမှတ်မိစေပါတယ်။
    sources:
      - title: "Next Editor — Learn"
        url: "https://nexteditor.dev/learn"
      - title: "Next Editor — Architecture"
        url: "https://nexteditor.dev/architecture"
    actions:
      - id: open-loop-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        maximized: true
        clear: true
        upsertIds: []
      - id: draw-loop-track
        type: whiteboard.apply
        at: { scene: start }
        upsertIds: [loop-title, loop-track]
        drawMs: 1500
      - id: draw-pause-step
        type: whiteboard.apply
        at: { mark: draw-pause-step }
        upsertIds: [loop-pause-box, loop-pause-label]
        drawMs: 900
      - id: draw-edit-step
        type: whiteboard.apply
        at: { mark: draw-edit-step }
        upsertIds: [loop-arrow-edit, loop-edit-box, loop-edit-label]
        drawMs: 1300
      - id: draw-run-step
        type: whiteboard.apply
        at: { mark: draw-run-step }
        upsertIds: [loop-arrow-run, loop-run-box, loop-run-label]
        drawMs: 1300
      - id: draw-continue-step
        type: whiteboard.apply
        at: { mark: draw-continue-step }
        upsertIds: [loop-continue-box, loop-continue-label]
        drawMs: 900
      - id: draw-versions
        type: whiteboard.apply
        at: { mark: draw-versions }
        upsertIds:
          [loop-version-1, loop-version-2, loop-version-3, loop-version-label, loop-version-note]
        drawMs: 2000

  - id: what-a-lesson-carries
    chapter: "lesson ထဲမှာ ဘာတွေ ထည့်လို့ ရလဲ"
    narration: >
      Next Editor lesson တစ်ခုထဲမှာ code နဲ့ preview တင် ပါတာ မဟုတ်ပါဘူး။
      [[mark:draw-teaching-card]] ရှင်းပြဖို့အတွက် slide တွေနဲ့ whiteboard ပါ
      ထည့်လို့ ရပါတယ်။ အခု မြင်နေရတဲ့ ပုံတွေကိုယ်တိုင်က whiteboard ပေါ်မှာ
      ဆွဲထားတာ ဖြစ်ပြီး၊ ပြန်ကြည့်တဲ့အခါ မျဉ်းကြောင်း တစ်ကြောင်းချင်း
      ပြန်ဆွဲပြပါတယ်။ [[mark:draw-side-card]] code ဘေးမှာ terminal ထဲက output
      တွေရော၊ code ရေးရာမှာ ကူညီပေးတဲ့ AI coding agent နဲ့ ပြောထားတဲ့ chat ကိုပါ
      lesson ထဲ တွဲမှတ်ထားလို့ ရပါတယ်။ [[mark:draw-viewer-card]]
      ကြည့်တဲ့သူအတွက်ကတော့ chapter တွေနဲ့ လိုချင်တဲ့ အပိုင်းကို တန်းသွားလို့
      ရသလို၊ caption စာတန်းတွေကိုလည်း ကိုယ့် ကွန်ပျူတာပေါ်မှာပဲ အလိုအလျောက်
      ထုတ်ပြီး ထည့်လို့ ရပါတယ်။ [[mark:draw-live-room-card]] ပြီးတော့ live room
      တစ်ခု ဖွင့်ပြီး၊ သူငယ်ချင်းတွေနဲ့ code တစ်ခုတည်းကို အတူတူ ပြင်ရင်း voice
      chat နဲ့ စကားပြောလို့လည်း ရပါတယ်။ [[mark:draw-languages]] ဘာသာစကား
      အနေနဲ့လည်း HTML၊ CSS၊ JavaScript တင် မကဘဲ၊ React၊ Node.js၊ Python တို့က
      browser ထဲမှာပဲ run ပြီး၊ Go၊ Rust၊ Kotlin၊ Zig၊ Haskell တို့ကတော့ online
      playground တွေကနေ တစ်ဆင့် run ပေးပါတယ်။ ဘယ်ဘာသာစကား ဖြစ်ဖြစ် ဘာမှ install
      လုပ်စရာ မလိုသလို၊ code run ဖို့ အကောင့် ဝင်စရာလည်း မလိုပါဘူး။ တစ်ခု
      သိထားရမှာက၊ browser ထဲမှာ run တဲ့ web lesson တွေကတော့ ကွန်ပျူတာပေါ်က
      browser လိုပါတယ်။ ဖုန်းကနေဆိုရင် code ကို run လို့ မရပေမယ့်၊ lesson ထဲက
      မှတ်တမ်းတင်ထားတဲ့ preview တွေကိုတော့ ပုံမှန်အတိုင်း ပြန်ကြည့်လို့ ရပါတယ်။
    sources:
      - title: "Next Editor — Architecture"
        url: "https://nexteditor.dev/architecture"
      - title: "Next Editor — Learn"
        url: "https://nexteditor.dev/learn"
      - title: "WebContainers — Introduction"
        url: "https://webcontainers.io/guides/introduction"
    actions:
      - id: draw-features-title
        type: whiteboard.apply
        at: { scene: start }
        clear: true
        upsertIds: [feat-title]
        drawMs: 900
      - id: draw-teaching-card
        type: whiteboard.apply
        at: { mark: draw-teaching-card }
        upsertIds: [feat-teach-card, feat-teach-heading, feat-teach-items]
        drawMs: 1500
      - id: draw-side-card
        type: whiteboard.apply
        at: { mark: draw-side-card }
        upsertIds: [feat-side-card, feat-side-heading, feat-side-items]
        drawMs: 1500
      - id: draw-viewer-card
        type: whiteboard.apply
        at: { mark: draw-viewer-card }
        upsertIds: [feat-viewer-card, feat-viewer-heading, feat-viewer-items]
        drawMs: 1500
      - id: draw-live-room-card
        type: whiteboard.apply
        at: { mark: draw-live-room-card }
        upsertIds: [feat-room-card, feat-room-heading, feat-room-items]
        drawMs: 1500
      - id: draw-languages
        type: whiteboard.apply
        at: { mark: draw-languages }
        upsertIds:
          [
            feat-lang-box,
            feat-lang-browser-head,
            feat-lang-browser-names,
            feat-lang-online-head,
            feat-lang-online-names,
          ]
        drawMs: 3000

  - id: where-to-start
    chapter: "ဘယ်ကနေ စမလဲ"
    narration: >
      [[mark:write-learn-page]] ဒါဆို ဘယ်ကနေ စမလဲ။ Next Editor website ရဲ့ Learn
      page မှာ တင်ထားတဲ့ lesson တွေကို ရှာကြည့်လို့ ရပါတယ်။
      [[mark:draw-try-steps]] ကြိုက်တဲ့ lesson တစ်ခုကို ဖွင့်ပြီးရင် ကြည့်ရုံ
      မကြည့်ဘဲ၊ ရှင်းပြနေတုန်း pause လုပ်လိုက်ပါ၊ code ကို ကိုယ်ကြိုက်သလို
      ပြင်ကြည့်ပါ၊ ပြီးရင် run ကြည့်ပါ။ [[mark:draw-studio-note]] နောက်ဆုံး
      တစ်ခု ပြောချင်ပါတယ်။ အခု ကြည့်နေတဲ့ ဒီ lesson ကိုယ်တိုင်ကို Next Editor
      Studio နဲ့ ဖန်တီးထားတာပါ။ Studio ဆိုတာ ကြိုရေးထားတဲ့ lesson script
      တစ်ခုကို ယူပြီး၊ code ရိုက်တာ၊ ခလုတ် နှိပ်တာ၊ whiteboard ပေါ်
      ပုံဆွဲတာတွေကို editor ထဲမှာ အလိုအလျောက် လုပ်ပြပြီး၊ အသံနဲ့အတူ lesson အဖြစ်
      မှတ်တမ်းတင်ပေးတဲ့ စနစ်ပါ။ [[mark:draw-ordinary-lesson]] ဒါပေမဲ့ ထွက်လာတဲ့
      ရလဒ်ကတော့ သာမန် lesson တစ်ခုနဲ့ အတူတူပါပဲ။ [[mark:try-it-now]] ဒါကြောင့်
      ဒီ lesson ကိုပဲ အခု pause လုပ်ပြီး၊ ခုနက ခလုတ်ရဲ့ အရောင်ကို ကိုယ်ကြိုက်တဲ့
      အရောင် ပြောင်းကြည့်ပါ။ ကိုယ့်လက်နဲ့ စမ်းကြည့်မှ Next Editor ရဲ့ သဘောကို
      အရှင်းဆုံး နားလည်သွားပါလိမ့်မယ်။ ကျေးဇူးတင်ပါတယ် ခင်ဗျာ။
    sources:
      - title: "Next Editor — Learn"
        url: "https://nexteditor.dev/learn"
      - title: "Next Editor Studio"
        url: "https://nexteditor.dev/studio"
    actions:
      - id: write-learn-page
        type: whiteboard.apply
        at: { mark: write-learn-page }
        clear: true
        upsertIds: [end-title, end-learn, end-learn-underline, end-learn-url]
        drawMs: 2400
      - id: draw-try-steps
        type: whiteboard.apply
        at: { mark: draw-try-steps }
        upsertIds:
          [
            end-try-pause-box,
            end-try-pause-label,
            end-try-arrow-edit,
            end-try-edit-box,
            end-try-edit-label,
            end-try-arrow-run,
            end-try-run-box,
            end-try-run-label,
          ]
        drawMs: 2400
      - id: draw-studio-note
        type: whiteboard.apply
        at: { mark: draw-studio-note }
        upsertIds:
          [
            end-script-box,
            end-script-label,
            end-arrow-studio,
            end-studio-box,
            end-studio-label,
            end-studio-sub,
          ]
        drawMs: 2600
      - id: draw-ordinary-lesson
        type: whiteboard.apply
        at: { mark: draw-ordinary-lesson }
        upsertIds: [end-arrow-lesson, end-lesson-box, end-lesson-label]
        drawMs: 1500
      # The lesson ends by telling the learner to pause and change the button's
      # colour, so the last frame is the code with that colour selected and the
      # live preview beside it, not the board. The file opens on an offset, not
      # afterAction: chained after the close it would get no time for its
      # cursor move.
      - id: close-final-board
        type: whiteboard.apply
        at: { mark: try-it-now }
        open: false
      - id: show-button-styles
        type: workspace.openFile
        at: { mark: try-it-now, offsetMs: 900 }
        path: style.css
      - id: point-at-button-colour
        type: editor.select
        at: { afterAction: show-button-styles }
        target: { file: style.css, text: "#2f9e44", occurrence: 1 }

checks:
  - { type: timing.p95Ms, max: 300 }
