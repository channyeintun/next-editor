      index.html: |
        <!doctype html>
        <html lang="my">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Next Editor ကို မိတ်ဆက်ခြင်း</title>
          </head>
          <body>
            <main class="card" data-testid="card">
            </main>
            <script type="module" src="/main.js"></script>
          </body>
        </html>
      main.js: |
        import "./style.css";
      style.css: |
        body {
          margin: 0;
          min-height: 100vh;
          display: grid;
          place-items: center;
          font-family: "Noto Sans Myanmar", "Myanmar Sangam MN", "Padauk", system-ui, sans-serif;
          font-size: 20px;
          line-height: 1.8;
          color: #1e1e1e;
          background: #f1f3f5;
        }

        .card {
          min-width: 260px;
          min-height: 120px;
          padding: 32px 48px;
          border-radius: 16px;
          background: white;
          text-align: center;
          box-shadow: 0 8px 24px rgb(0 0 0 / 0.08);
        }

        button {
          font: inherit;
        }
