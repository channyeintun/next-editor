      # base.css: kit sections A, B, B2 and C (D dropped). Section E pins the
      # lesson blocks' look: the dot, the pause button, the cup and steam
      # lines, the chips, the monospace typing dots, and the banner
      # (display: none until .is-shown). Nothing in base.css animates.
      base.css: |
        /*
          base.css: pinned, never typed during a lesson.
          The shop's palette and the page "furniture", so the CSS a lesson types can
          focus on one idea. Each lesson keeps only the sections it needs and drops
          any declaration that its own demo types or relies on being absent
          (COURSE-KIT.md, "Deriving a lesson workspace"). B2 travels with B (every
          lesson that keeps B keeps B2, except lesson 2, which types the reset).
          Section E holds the few lesson-specific rules a start state pins.
          Lesson 39 keeps A, B, B2 and C (section D dropped). Section E pins the
          lesson's blocks: the pulsing dot, the steaming cup, the easing chips and
          their pause button, the typing dots and the order banner. Nothing here animates:
          every animation is typed in styles.css.
          Keep it free of the url, image-set and @-import functions (they switch on
          Vite's postcss step); images come from <img> or the pinned images.css.
        */

        /* == A. palette == */
        :root {
          color-scheme: light;
          --tea-dark: #3b2314;
          --tea: #8b5a2b;
          --tea-light: #c9a27e;
          --cream: #fff8ec;
          --paper: #fdf3e1;
          --leaf: #2f6b3a;
          --gold: #c9a227;
          --chili: #b23a2b;
          --ink: #2b1d14;
