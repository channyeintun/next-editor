# CSS course (Burmese), lesson 39 of 43: animations and keyframes.
#
# Narration is Burmese (voice-script.md next to this file; DESIGN.md is the
# span-by-span brief). Every [[mark:…]] sits where its
# action begins, at a sentence end; each span carries one piece of meaning.
# Everything the learner sees (title, chapters, whiteboard labels, UI
# strings) is Burmese already.
#
# Shape: board (recall lesson 38; a keyframe is a state on a timeline; a
# transition has two states, an animation many, starts by itself, repeats) →
# code tour (the dot, the steaming cup, six easing chips + their pause
# button, the typing dots, the order button + banner; three ready-made keyframes pinned
# at the top of styles.css) → pulse keyframes alone do nothing; the name;
# the missing 0%/100% → duration alone (still nothing: no name), then the
# name (one pulse: an animation starts when its name is set; probe/durtest),
# iteration count infinite → steam: from/to and 50%, the shorthand →
# negative delays stagger the three lines → board: easing curves, the
# overshoot, easing per segment → chips: slide + alternate, five keywords,
# cubic-bezier overshoot; easing inside a keyframe, linear() → typing dots
# with steps(4); board: jump positions → banner: fade-in with a 1s delay
# blinks; fill-mode backwards fixes it (hide + show restarts it); board: fill
# mode zones → pause the chips with play-state → boards: the shorthand and
# several animations; performance, individual transforms, the cascade →
# reduced-motion block (honest about the viewer's device) + the opt-in
# pattern → sentences (restart, events, composition, scroll-driven), quiz,
# recap, hand-off to anchor positioning (lesson 40).
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set(; no postcss config; no reload.
# Every keystroke edit that contains "(" (cubic-bezier, steps) is the LAST
# rule of the file while it is typed, so an unclosed "(" swallows nothing
# (at the end of the file the parser closes it). The reduced-motion media
# query is one block insert. Every other edit is appended at the end of the
# file or inside an existing rule, and contains no "(".
#
# Replay (PLATFORM.md §3): @keyframes animations replay on the viewer's
# clock at 1x and restart after a seek, so every demo either loops (dot,
# steam, chips, dots) or is started by a recorded click (the banner); class
# toggles from kit.js (is-shown, is-paused) replay. prefers-reduced-motion is
# evaluated on the viewer's device, and the narration says so.
#
# Measured in headless Chrome at 432 × 720 (probe/stages.ts, same anchors):
# card 54–159 (dot at 142,73), steam cup 171–241, chips 253–439 (110 px
# each, slide 200 px), pause button ~453–476, preparing line ~500, order
# button ~533–572, banner ~585–628 when shown (verify-shots-fix final
# screenshot); the document is 720 tall (no scrolling).
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
