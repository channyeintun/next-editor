          text-align: center;
        }

        .easing-strip span:last-child {
          background: var(--chili);
        }

        .preparing {
          margin: 0;
        }

        /* The typing dots: a monospace font, so 1ch is exactly one dot. */
        .typing {
          display: inline-block;
          overflow: hidden;
          white-space: nowrap;
          vertical-align: bottom;
          font-family: ui-monospace, Menlo, Consolas, monospace;
