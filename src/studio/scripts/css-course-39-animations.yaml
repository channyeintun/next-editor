        /* The order banner: hidden until the order button adds is-shown. */
        .banner {
          display: none;
          margin: 12px 0 0;
          padding: 8px 16px;
          border-radius: var(--radius);
          background: var(--leaf);
          color: #fff;
        }

        .banner.is-shown {
