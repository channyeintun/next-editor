        x: 300,
        y: 490,
        width: 700,
        height: 36,
        text: "animation > ပုံမှန် declaration",
        strokeColor: "#6741d9",
        fontSize: 28,
      }
    - {
        id: f-important,
        kind: text,
        x: 300,
        y: 540,
        width: 700,
        height: 36,
        text: "!important > animation",
        strokeColor: "#6741d9",
        fontSize: 28,
      }
    - {
        id: f-ignored,
        kind: text,
        x: 300,
        y: 590,
        width: 700,
        height: 36,
        text: "keyframe ထဲက !important → မသက်ရောက်",
        strokeColor: "#e03131",
        fontSize: 28,
      }

    # Board G — the closing question and the rule of thumb. Blue = question,
    # green = answer, orange = transition, violet = animation.
    - {
        id: g-title,
        kind: text,
        x: 300,
        y: 160,
        width: 500,
        height: 46,
        text: "မေးခွန်း တစ်ခု",
