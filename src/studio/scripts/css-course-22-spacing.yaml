build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 4122

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  - id: spacing-intro
    chapter: "နေရာလွတ် သုံးမျိုး"
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ margin နဲ့ padding ရဲ့ ဘက်တွေကို စာ ရေးတဲ့ ဦးတည်ရာနဲ့ ခေါ်ခဲ့ပါတယ်။ ဒီ
      lesson မှာတော့ နေရာလွတ်ကို ဘယ်နည်းနဲ့ ဘယ်မှာ ထည့်မလဲ၊ ဘယ်လို တစ်ပုံစံတည်း ထိန်းမလဲ ဆိုတာ
      ကြည့်ပါမယ်။ box ပုံတွေနဲ့ ကိုက်အောင် အပေါ်၊ အောက် နာမည်တွေကို သုံးပေမယ့်၊ logical နာမည်တွေနဲ့လည်း
      အတူတူပါပဲ။ [[mark:start-server]] ဒီလို ပြောနေတုန်းမှာပဲ၊ board နောက်မှာ dev server ကို စနေပါပြီ။
      [[mark:draw-puzzle]] အရင်ဆုံး ပြဿနာလေး တစ်ခု ကြည့်ရအောင်။ list ထဲမှာ card သုံးခု ရှိပြီး၊ card
      တွေကြားမှာ နေရာလွတ် လိုချင်ပါတယ်။ card တိုင်းကို အောက်ဘက် margin ပေးလိုက်ရင်၊ နောက်ဆုံး card လည်း
      ရသွားလို့ မလိုချင်တဲ့ နေရာလွတ် အပို ပေါ်လာပါတယ်။ [[mark:draw-margin]] ဘာကြောင့်လဲဆိုတော့၊ margin က
      box တစ်ခုစီရဲ့ အပြင်ဘက်မှာ အမြဲ ပါလာတဲ့ နေရာလွတ် ဖြစ်လို့ပါ။ ဘေးက box တွေကို တွန်းထုတ်ပြီး၊
      နောက်ခံ အရောင် မရှိပါဘူး။ [[mark:draw-padding]] padding ကတော့ box ရဲ့ အတွင်းဘက်၊ border နဲ့
      content ကြားက နေရာလွတ်ပါ။ box ရဲ့ နောက်ခံ အရောင်က padding ကိုပါ ဖုံးထားပါတယ်။ [[mark:draw-gap]]
      gap ကတော့ flex ဒါမှမဟုတ် grid container ထဲက item တွေကြားက နေရာလွတ်ပါ။ ပထမ item ရှေ့နဲ့ နောက်ဆုံး
      item နောက်မှာ မထည့်ပါဘူး။ နေရာလွတ် လိုရင် အပြင်လား၊ အတွင်းလား၊ ကြားလား ဆိုတာ အရင် မေးကြည့်ပါ။
    sources:
      - title: "web.dev Learn CSS — Spacing"
        url: "https://web.dev/learn/css/spacing"
      - title: "web.dev Learn CSS — The box model"
        url: "https://web.dev/learn/css/box-model"
      - title: "MDN — margin"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/margin"
      - title: "MDN — padding"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/padding"
      - title: "MDN — gap"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/gap"
    actions:
      - id: open-intro-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      # Runs in the background (boot + pnpm install + spawn); waitForReady sits
      # in the code tour, well over 40 s of narration later.
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 45000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-puzzle
        type: whiteboard.apply
        at: { mark: draw-puzzle }
        upsertIds: [a-card1, a-band1, a-card2, a-band2, a-card3, a-band3, a-extra-ring, a-extra]
        drawMs: 3600
      - id: draw-margin
        type: whiteboard.apply
        at: { mark: draw-margin }
        upsertIds: [a-m-outer, a-m-inner, a-m-label]
        drawMs: 1800
      - id: draw-padding
        type: whiteboard.apply
        at: { mark: draw-padding }
        upsertIds: [a-p-box, a-p-content, a-p-label]
        drawMs: 1800
      - id: draw-gap
        type: whiteboard.apply
        at: { mark: draw-gap }
        upsertIds: [a-g-a, a-g-stripe, a-g-b, a-g-label]
        drawMs: 1800

  - id: html-spacing
    chapter: "HTML ထဲက နေရာလွတ်"
    narration: >
      [[mark:open-html-board]] HTML မှာလည်း နေရာလွတ် ထည့်တဲ့ နည်း တချို့ ရှိပါတယ်။ [[mark:draw-br]] br
      element က စာသားထဲမှာ စာကြောင်း ချိုးပေးပါတယ်။ လိပ်စာလို၊ စာကြောင်း ချိုးတာက content ရဲ့
      အစိတ်အပိုင်း ဖြစ်မှ သုံးပါတယ်။ [[mark:draw-hr]] hr element ကတော့ အပိုင်း တစ်ခုကနေ နောက်တစ်ခုကို
      အကြောင်းအရာ ပြောင်းတာကို ပြပါတယ်။ browser က မျဉ်း တစ်ကြောင်း ဆွဲပေမယ့်၊ သူ့ အဓိပ္ပာယ်ကတော့ အဲဒီ
      ပြောင်းတာပါ။ ဒါကြောင့် အလှအတွက် မျဉ်းပဲ လိုရင် CSS border ကို သုံးပါ။ [[mark:draw-nbsp]]
      non-breaking space ကတော့ browser က စာကြောင်း ဘယ်တော့မှ မချိုးတဲ့ space ပါ။ ဒါကြောင့် ဈေးနှုန်းမှာ
      သုံးရင် ဂဏန်းနဲ့ ကျပ် အမြဲ တွဲနေပါတယ်။ အများကြီး သုံးရင်တော့ ချိုးလို့ မရတဲ့ စာတန်း ရှည်ကြီးတွေ
      ဖြစ်သွားပါတယ်။ [[mark:draw-html-rule]] ဒါကြောင့် HTML နဲ့ နေရာလွတ် ထည့်တာကို content ထဲမှာ
      အဓိပ္ပာယ် ရှိမှပဲ လုပ်ပါ။ ကြည့်ကောင်းအောင်ပဲ လိုတဲ့ နေရာလွတ်ကိုတော့ CSS မှာ ရေးပါ။
      [[mark:draw-no-br]] content ကို အောက် တွန်းချဖို့ br တွေ ဆင့်ထည့်တာကိုတော့ ရှောင်ပါ။
    sources:
      - title: "web.dev Learn CSS — Spacing: HTML spacing"
        url: "https://web.dev/learn/css/spacing#html_spacing"
      - title: "MDN — <br>: the line break element"
        url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Element/br"
      - title: "MDN — <hr>: the thematic break element"
        url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Element/hr"
      - title: "MDN — Entity (&nbsp;)"
        url: "https://developer.mozilla.org/en-US/docs/Glossary/Entity"
    actions:
      - id: open-html-board
        type: whiteboard.apply
        at: { mark: open-html-board }
        clear: true
        upsertIds: [b-title]
      - id: draw-br
        type: whiteboard.apply
        at: { mark: draw-br }
        upsertIds: [b-br-k, b-br-m]
        drawMs: 1400
      - id: draw-hr
        type: whiteboard.apply
        at: { mark: draw-hr }
        upsertIds: [b-hr-k, b-hr-m]
        drawMs: 1400
      - id: draw-nbsp
        type: whiteboard.apply
        at: { mark: draw-nbsp }
        upsertIds: [b-nbsp-k, b-nbsp-m]
        drawMs: 1400
      - id: draw-html-rule
        type: whiteboard.apply
        at: { mark: draw-html-rule }
        upsertIds: [b-rule]
        drawMs: 1600
      - id: draw-no-br
        type: whiteboard.apply
        at: { mark: draw-no-br }
        upsertIds: [b-no-k, b-no-strike, b-no-m]
        drawMs: 1800

  - id: code-tour
    narration: >
      [[mark:close-html-board]] ဒါတွေကို ဆိုင်ရဲ့ page မှာ ရှာကြည့်ရအောင်။ [[mark:open-index]] ဒါက HTML
      ဖိုင်ပါ။ [[mark:preview-opens]] dev server အသင့် ဖြစ်လို့ preview ပွင့်လာပါပြီ။ base ဖိုင်က card
      တွေကို margin နဲ့ padding မပေးထားလို့၊ card တွေ ကပ်နေပြီး စာသားတွေက ဘောင်နဲ့ ထိနေပါတယ်။ မှာမယ်
      ခလုတ်မှာလည်း စာသားနဲ့ ခလုတ် အစွန်းကြား နေရာ သိပ် မရှိပါဘူး။ အရောင်ဖျော့ နောက်ခံက list ကိုယ်တိုင်
      ဖြစ်လို့၊ နေရာလွတ် တစ်ခုစီ ဘယ်ရောက်လဲ မြင်ရပါမယ်။ [[mark:scroll-footer]] အရင် footer ကို
      ဆင်းကြည့်ရအောင်။ [[mark:select-br]] လိပ်စာထဲက br က စာကြောင်းကို ချိုးပေးလို့၊ မြို့နာမည်က
      အောက်တစ်ကြောင်းမှာ ရှိနေပါတယ်။ [[mark:select-hr]] ဖုန်းနံပါတ်ရဲ့ နောက်က hr က ဆက်သွယ်ရန်
      အချက်အလက်တွေနဲ့ copyright စာကြောင်းကို ခွဲထားပါတယ်။ [[mark:select-nbsp]] အပေါ်က menu ထဲမှာတော့
      လက်ဖက်ရည် ဈေးနှုန်းမှာ ဂဏန်းနဲ့ ကျပ်ကြား non-breaking space ရှိလို့၊ နှစ်ခုက ဘယ်တော့မှ
      ခွဲမသွားပါဘူး။ [[mark:open-styles]] ကိုယ့် CSS ဖိုင်က အလွတ်ပါ။
    sources:
      - title: "web.dev Learn CSS — Spacing: HTML spacing"
        url: "https://web.dev/learn/css/spacing#html_spacing"
      - title: "MDN — <br>"
        url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Element/br"
      - title: "MDN — <hr>"
        url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Element/hr"
    actions:
      - id: close-html-board
        type: whiteboard.apply
        at: { mark: close-html-board }
        open: false
      - id: open-index
        type: workspace.openFile
        at: { mark: open-index }
        path: index.html
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { mark: preview-opens }
        timeoutMs: 20000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-dev-server }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-drinks
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: menu-drinks }
        textContains: "သံပုရာရည်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-button
        type: expect.preview
        at: { afterAction: expect-drinks }
        timeoutMs: 5000
        target: { by: testId, value: order-button }
        textContains: "မှာမယ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: collapse-runner-dock
        type: runtime.collapseDock
        at: { afterAction: expect-button }
      # The scroll for this step is gone: the page is only 750 px tall, so in
      # a preview this tall there is nothing to scroll and no scroll event to
      # record.
      - id: expect-footer
        type: expect.preview
        at: { mark: scroll-footer }
        timeoutMs: 5000
        target: { by: testId, value: footer }
        textContains: "ရန်ကုန်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-br
        type: editor.select
        at: { mark: select-br }
        target: { file: index.html, text: "<br />", occurrence: 1 }
      - id: select-hr
        type: editor.select
        at: { mark: select-hr }
        target: { file: index.html, text: "<hr />", occurrence: 1 }
      - id: select-nbsp
        type: editor.select
        at: { mark: select-nbsp }
        target: { file: index.html, text: "1,500&nbsp;ကျပ်", occurrence: 1 }
      # The scroll for this step is gone: the page is only 750 px tall, so in
      # a preview this tall there is nothing to scroll and no scroll event to
      # record.
      - id: expect-price
        type: expect.preview
        at: { afterAction: select-nbsp }
        timeoutMs: 5000
        target: { by: testId, value: price-laphet-yay }
        textContains: "ကျပ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: open-styles
        type: workspace.openFile
        at: { mark: open-styles }
        path: styles.css

  - id: padding-margin
    chapter: "Card တွေမှာ padding နဲ့ margin ထည့်ကြည့်ရအောင်"
    narration: >
      [[mark:type-card-padding]] အရင်ဆုံး အတွင်းဘက်ကနေ စရအောင်။ card တိုင်းကို လေးဘက်လုံး padding တူတူ
      ပေးပါမယ်။ [[mark:after-card-padding]] စာသားတွေ ဘောင်ကနေ ခွာသွားပြီး၊ အဖြူရောင် နောက်ခံကလည်း
      padding နေရာကိုပါ ဖုံးသွားပါတယ်။ padding က box ရဲ့ အစိတ်အပိုင်း ဖြစ်လို့ပါ။
      [[mark:type-card-margin]] အခု အပြင်ဘက်ပါ။ နောက်က card ကို တွန်းခွာဖို့ card တိုင်းကို အောက်ဘက်
      margin ပေးပါမယ်။ [[mark:after-card-margin]] card တွေကြားမှာ နေရာလွတ် ပေါ်လာပြီး၊ အဲဒီ ကြားကနေ list
      ရဲ့ နောက်ခံကို မြင်ရပါတယ်။ margin မှာ နောက်ခံ အရောင် မရှိလို့ပါ။ [[mark:look-last-card]] ဒါပေမဲ့
      နောက်ဆုံး card ရဲ့ အောက်ကို ကြည့်ပါ။ သူလည်း margin ရသွားလို့၊ list ရဲ့ အောက်ဘက်မှာ အပေါ်ဘက်ထက်
      နေရာလွတ် ပိုနေပါတယ်။ board ပေါ်က ပြဿနာ အတိုင်းပါပဲ။
    sources:
      - title: "web.dev Learn CSS — Spacing: padding"
        url: "https://web.dev/learn/css/spacing#padding"
      - title: "web.dev Learn CSS — Spacing: margin"
        url: "https://web.dev/learn/css/spacing#margin"
      - title: "MDN — padding (the background extends under it)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/padding"
      - title: "MDN — margin-bottom"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/margin-bottom"
    actions:
      - id: type-card-padding
        type: editor.type
        at: { mark: type-card-padding }
        cadence: fast-explainer
        target: { file: styles.css, after: "", occurrence: 1 }
        text: ".menu-card {\n  padding: 12px;\n}\n"
      - id: expect-card-padding
        type: expect.preview
        at: { mark: after-card-padding }
        timeoutMs: 4000
        target: { by: testId, value: card-coffee }
        textContains: "ကော်ဖီ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-card-margin
        type: editor.type
        at: { mark: type-card-margin }
        cadence: fast-explainer
        target: { file: styles.css, after: "  padding: 12px;\n", occurrence: 1 }
        text: "  margin-bottom: 16px;\n"
      - id: expect-card-margin
        type: expect.preview
        at: { mark: after-card-margin }
        timeoutMs: 4000
        target: { by: testId, value: card-lime-juice }
        textContains: "သံပုရာရည်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: gap
    narration: >
      [[mark:type-margin-zero]] ဒါကြောင့် margin ကို ပြန်ဖြုတ်ပါမယ်။ နောက်မှ ရေးတဲ့ သုည တန်ဖိုးက
      နိုင်ပါတယ်။ [[mark:type-list-gap]] အဲဒီအစား နေရာလွတ်ကို list မှာ ထည့်ပါမယ်။ list ကို grid
      container လုပ်ပြီး gap 16 pixel ပေးပါမယ်။ grid မှာ default အားဖြင့် column တစ်ခုတည်း ရှိလို့ card
      တွေ ဆင့်နေတုန်းပါ။ [[mark:after-list-gap]] အခု card တွေကြားမှာပဲ နေရာလွတ် ရှိပါတယ်။ ပထမ card ရဲ့
      အပေါ်နဲ့ နောက်ဆုံး card ရဲ့ အောက်မှာ နေရာလွတ် သေးသေးလေး တူတူ ကျန်နေတာကတော့ list ကိုယ်တိုင်ရဲ့
      padding ပါ။ [[mark:select-gap]] ဒီ gap ကို ကြည့်ပါ။ margin ကို card တစ်ခုစီက ပိုင်ပေမယ့်၊ gap ကို
      layout က ပိုင်ပါတယ်။ ဒါကြောင့် card ဘယ်နှစ်ခု ထည့်ထည့်၊ နေရာလွတ်က card တွေကြားမှာပဲ ပေါ်ပြီး၊ card
      တွေကိုလည်း margin ပေးစရာ မလိုတော့ပါဘူး။ flexbox နဲ့ သတင်းစာလို column ခွဲတဲ့ layout မှာလည်း
      အတူတူပါပဲ။
    sources:
      - title: "web.dev Learn CSS — Spacing: grid and flexbox"
        url: "https://web.dev/learn/css/spacing#grid_and_flexbox"
      - title: "MDN — gap (flex, grid and multi-column)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/gap"
    actions:
      - id: type-margin-zero
        type: editor.type
        at: { mark: type-margin-zero }
        cadence: fast-explainer
        target: { file: styles.css, after: "  margin-bottom: 16px;\n", occurrence: 1 }
        text: "  margin-bottom: 0;\n"
      - id: type-list-gap
        type: editor.type
        at: { mark: type-list-gap }
        cadence: fast-explainer
        target: { file: styles.css, after: "  margin-bottom: 0;\n}\n", occurrence: 1 }
        text: "\n.drinks .menu {\n  display: grid;\n  gap: 16px;\n}\n"
      - id: expect-list-gap
        type: expect.preview
        at: { mark: after-list-gap }
        timeoutMs: 4000
        target: { by: testId, value: menu-drinks }
        textContains: "ကော်ဖီ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-gap
        type: editor.select
        at: { mark: select-gap }
        target: { file: styles.css, text: "gap: 16px;", occurrence: 1 }

  - id: shorthand
    chapter: "တန်ဖိုး တစ်ခုကနေ လေးခုအထိ"
    narration: >
      [[mark:type-btn-padding]] အခု မှာမယ် ခလုတ်ပါ။ သူ့မှာ အပေါ်အောက်ထက် ဘယ်ညာမှာ နေရာ ပိုလိုလို့၊
      padding ကို တန်ဖိုး နှစ်ခု ပေးပါမယ်။ [[mark:after-btn-padding]] ခလုတ်ထဲမှာ နေရာ ချောင်သွားပါပြီ။
      [[mark:open-trbl-board]] တန်ဖိုးတွေက ဘက်တွေနဲ့ ဘယ်လို ကိုက်လဲ။ [[mark:draw-trbl-box]] margin နဲ့
      padding တန်ဖိုးတွေက အပေါ်ကနေ စပြီး နာရီလက်တံ လည်တဲ့ဘက် ပတ်ပါတယ်။ အပေါ်၊ ညာ၊ အောက်၊ ပြီးမှ ဘယ်ပါ။
      [[mark:draw-trbl-one]] တစ်ခုတည်းဆိုရင် လေးဘက်လုံး ရပါတယ်။ [[mark:draw-trbl-two]] နှစ်ခုဆိုရင် ပထမက
      အပေါ်နဲ့ အောက်၊ ဒုတိယက ဘယ်နဲ့ ညာ အတွက်ပါ။ ကိုယ့် ခလုတ်လိုပါပဲ။ [[mark:draw-trbl-three]]
      သုံးခုဆိုရင် အပေါ်၊ ပြီးရင် ဘယ်ညာ၊ နောက်ဆုံးမှ အောက်ပါ။ [[mark:draw-trbl-four]] လေးခုဆိုရင်တော့
      ဘက်တိုင်း ကိုယ်ပိုင် တန်ဖိုး ရပါတယ်။ အစဉ်ကတော့ ခုနက အတိုင်းပါ။ [[mark:draw-box-sizing]] lesson 2 က
      border box rule ကို ဆက်သုံးထားလို့၊ ကိုယ် ပေးတဲ့ အကျယ်ထဲမှာ padding က ဆံ့နေပါတယ်။ အဲဒီ rule
      မရှိရင်တော့ padding က ကိုယ် ပေးတဲ့ အကျယ်ထဲ မပါဘဲ အပြင်ကို ထပ်တိုးသွားလို့ box က ကြီးလာပါမယ်။
    sources:
      - title: "web.dev Learn CSS — Spacing: margin (one to four values)"
        url: "https://web.dev/learn/css/spacing#margin"
      - title: "MDN — padding (one to four values)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/padding#syntax"
      - title: "MDN — box-sizing"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/box-sizing"
    actions:
      - id: type-btn-padding
        type: editor.type
        at: { mark: type-btn-padding }
        cadence: fast-explainer
        target: { file: styles.css, after: "  gap: 16px;\n}\n", occurrence: 1 }
        text: "\n.order-btn {\n  padding: 8px 20px;\n}\n"
      - id: expect-btn-padding
        type: expect.preview
        at: { mark: after-btn-padding }
        timeoutMs: 4000
        target: { by: testId, value: order-button }
        textContains: "မှာမယ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: open-trbl-board
        type: whiteboard.apply
        at: { mark: open-trbl-board }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-trbl-box
        type: whiteboard.apply
        at: { mark: draw-trbl-box }
        upsertIds: [c-box, c-top, c-right, c-bottom, c-left]
        drawMs: 2600
      - id: draw-trbl-one
        type: whiteboard.apply
        at: { mark: draw-trbl-one }
        upsertIds: [c-one, c-one-m]
        drawMs: 1200
      - id: draw-trbl-two
        type: whiteboard.apply
        at: { mark: draw-trbl-two }
        upsertIds: [c-two, c-two-m]
        drawMs: 1400
      - id: draw-trbl-three
        type: whiteboard.apply
        at: { mark: draw-trbl-three }
        upsertIds: [c-three, c-three-m]
        drawMs: 1400
      - id: draw-trbl-four
        type: whiteboard.apply
        at: { mark: draw-trbl-four }
        upsertIds: [c-four, c-four-m]
        drawMs: 1400
      - id: draw-box-sizing
        type: whiteboard.apply
        at: { mark: draw-box-sizing }
        upsertIds: [c-sizing]
        drawMs: 1600

  - id: margin-auto
    chapter: "Auto margin နဲ့ အနုတ် margin"
    narration: >
      [[mark:close-trbl-board]] margin ဆီ ပြန်ရအောင်။ [[mark:type-center]] သောက်စရာ အပိုင်းကို page ထက်
      ကျဉ်းတဲ့ အကျယ် အများဆုံး တစ်ခု အရင် ပေးပါမယ်။ ပြီးရင် margin ကို အပေါ်နဲ့ အောက် သုည၊ ဘယ်နဲ့ ညာကို
      auto ပေးပါမယ်။ [[mark:after-center]] သောက်စရာ အပိုင်း ကျဉ်းသွားပြီး၊ အလယ်မှာ ရောက်သွားပါပြီ။
      [[mark:select-auto]] ဒီ auto ကို ကြည့်ပါ။ auto က သူ ရှိတဲ့ဘက်မှာ ကျန်နေတဲ့ နေရာလွတ် အကုန်လုံးကို
      ယူပါတယ်။ ဘယ်ညာ နှစ်ဘက်လုံး auto ဆိုရင် ကျန်တဲ့ နေရာကို တစ်ဝက်စီ ခွဲလို့၊ container ထက် ကျဉ်းတဲ့
      box က အလယ် ရောက်ပါတယ်။ [[mark:explain-margin-values]] margin မှာ ရာခိုင်နှုန်းလည်း ရပါတယ်။ အပေါ်
      ဒါမှမဟုတ် အောက် margin ဖြစ်နေရင်တောင် ရာခိုင်နှုန်းက container ရဲ့ အမြင့်ကို မဟုတ်ဘဲ အကျယ်ကို
      ယူတွက်ပါတယ်။ flow layout ထဲမှာ အပေါ်အောက် auto margin က သုည ဖြစ်လို့၊ ဒီနည်းက ဘယ်ညာမှာပဲ
      အလယ်ပို့ပါတယ်။ flex container ထဲမှာတော့ lesson 17 မှာ မြင်ခဲ့သလို အပေါ်အောက် auto margin လည်း
      အလုပ်လုပ်လို့၊ ဒေါင်လိုက်ပါ အလယ် ပို့နိုင်ပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Spacing: margin (auto)"
        url: "https://web.dev/learn/css/spacing#margin"
      - title: "MDN — margin (percentages refer to the containing block's inline size; auto)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/margin#values"
      - title: "CSS Box Model Module Level 3 — margins"
        url: "https://drafts.csswg.org/css-box-3/#margins"
    actions:
      - id: close-trbl-board
        type: whiteboard.apply
        at: { mark: close-trbl-board }
        open: false
      - id: type-center
        type: editor.type
        at: { mark: type-center }
        cadence: fast-explainer
        target: { file: styles.css, after: "  padding: 8px 20px;\n}\n", occurrence: 1 }
        text: "\n.drinks {\n  max-width: 320px;\n  margin: 0 auto;\n}\n"
      - id: expect-center
        type: expect.preview
        at: { mark: after-center }
        timeoutMs: 4000
        target: { by: testId, value: drinks }
        textContains: "သောက်စရာ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-auto
        type: editor.select
        at: { mark: select-auto }
        target: { file: styles.css, text: "margin: 0 auto;", occurrence: 1 }

  - id: negative-margin
    narration: >
      [[mark:type-badge]] margin ကို အနုတ် တန်ဖိုးလည်း ပေးလို့ ရပါတယ်။ လက်ဖက်ရည် card ရဲ့ အပေါ်ဆုံးမှာ
      အသစ် ဆိုတဲ့ badge ရှိပါတယ်။ သူက inline element ဖြစ်လို့ အပေါ် margin က သူ့ကို မရွှေ့နိုင်ပါဘူး။
      ဒါကြောင့် သူ့ကို block ပြောင်းပြီး စာသား ရှိသလောက်ပဲ ကျယ်အောင် ထားပါမယ်။ ပြီးမှ အပေါ်ဘက်ကို အနုတ်
      margin ပေးပါမယ်။ [[mark:after-badge]] badge က အပေါ်ကို တက်သွားပြီး card ရဲ့ အပေါ် ဘောင်ကို
      ဖုံးထားပါတယ်။ သူ့ အောက်က နာမည်ကလည်း လိုက်တက်လာပါတယ်။ အပေါင်း margin က တွန်းခွာပေမယ့်၊ အနုတ် margin
      က box ကိုရော သူ့နောက်က အရာတွေကိုပါ ပြောင်းပြန် ဆွဲတင်လို့ပါ။ [[mark:select-negative]] ဒီ အနုတ်
      တန်ဖိုးကို ကြည့်ပါ။ padding က ဘယ်တော့မှ အနုတ် မဖြစ်နိုင်ပေမယ့် margin ကတော့ ဖြစ်နိုင်ပါတယ်။ design
      တွေမှာ box တွေကို တမင် ထပ်အောင် ဒီလို လုပ်ကြပါတယ်။ ဒါဆို ဘယ် box က အပေါ်မှာ ပေါ်မလဲ။ အဲဒါကို နောက်
      lesson မှာ ကြည့်ပါမယ်။
    sources:
      - title: "web.dev Learn CSS — Spacing: negative margin"
        url: "https://web.dev/learn/css/spacing#negative_margin"
      - title: "MDN — margin (negative values are allowed)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/margin#values"
      - title: "MDN — padding (negative values are invalid)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/padding#values"
      - title: "MDN — fit-content"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/fit-content"
    actions:
      - id: type-badge
        type: editor.type
        at: { mark: type-badge }
        cadence: fast-explainer
        target: { file: styles.css, after: "  margin: 0 auto;\n}\n", occurrence: 1 }
        text: "\n.badge {\n  width: fit-content;\n  display: block;\n  margin-top: -24px;\n}\n"
      - id: expect-badge
        type: expect.preview
        at: { mark: after-badge }
        timeoutMs: 4000
        target: { by: testId, value: badge-laphet-yay }
        textContains: "အသစ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-negative
        type: editor.select
        at: { mark: select-negative }
        target: { file: styles.css, text: "margin-top: -24px;", occurrence: 1 }

  - id: collapse
    chapter: "Margin collapse"
    narration: >
      [[mark:scroll-collapse]] အခု menu အောက်က အဖြူရောင် box ထဲက အရောင်ဖျော့ card ကို ကြည့်ရအောင်။ သူ့
      ခေါင်းစဉ်နဲ့ စာပိုဒ်မှာ margin မရှိသေးပြီး၊ မျဉ်းပြတ်တွေက box တွေရဲ့ အစွန်းကို ပြပါတယ်။
      [[mark:type-h3-bottom]] ခေါင်းစဉ်ကနေ စရအောင်။ သူ့ကို အောက်ဘက် margin 20 pixel ပေးလိုက်ရင်
      စာပိုဒ်ကို အောက် တွန်းချသင့်ပါတယ်။ [[mark:after-h3-bottom]] ခေါင်းစဉ်နဲ့ စာပိုဒ်ကြားမှာ နေရာလွတ်
      ပေါ်လာပါပြီ။ [[mark:type-p-top]] ပြီးရင် စာပိုဒ်ကို အပေါ်ဘက် margin 30 pixel ပေးပါမယ်။
      ခေါင်းစဉ်ရဲ့ margin ထက် နည်းနည်း ပိုများပါတယ်။ [[mark:after-p-top]] နေရာလွတ် နည်းနည်းပဲ
      ကြီးလာပါတယ်။ lesson 2 မှာ card တွေကြား မြင်ခဲ့တာ ဒါပါပဲ။ အခု ရှင်းပြပါမယ်။
      [[mark:open-collapse-board]] ဆွဲကြည့်ရအောင်။ [[mark:draw-collapse-bands]] margin နှစ်ခုက တစ်ခုနဲ့
      တစ်ခု ထိနေပါတယ်။ flow layout ထဲမှာ အပေါ်အောက် ကပ်နေတဲ့ block နှစ်ခုရဲ့ margin တွေက ပေါင်းမသွားဘဲ
      ထပ်သွားပြီး၊ ကြီးတဲ့ တစ်ခုပဲ ကျန်ပါတယ်။ ဒါကြောင့် နေရာလွတ်က 50 မဟုတ်ဘဲ 30 pixel ပဲ ရှိပါတယ်။ ဒါကို
      margin collapse လို့ ခေါ်ပါတယ်။ [[mark:draw-collapse-axis]] collapse က block direction မှာပဲ
      ဖြစ်ပါတယ်။ ဒီမှာဆိုရင် အပေါ်နဲ့ အောက်ပါ။ inline direction က margin တွေ၊ ဒီမှာဆိုရင် ဘယ်ညာ margin
      တွေကတော့ collapse မဖြစ်ပါဘူး။ [[mark:draw-collapse-why]] ဒီလို ဖြစ်ရတာက CSS ကို document တွေအတွက်
      ဖန်တီးခဲ့လို့ပါ။ ခေါင်းစဉ်နဲ့ စာပိုဒ်ရဲ့ margin တွေ နှစ်ဆ မဖြစ်သင့်ပါဘူး။
      [[mark:draw-collapse-negative]] margin တစ်ခုက အနုတ် ဖြစ်နေရင်တော့၊ browser က အနုတ် အများဆုံးကို
      အပေါင်း အကြီးဆုံးနဲ့ ပေါင်းပါတယ်။ ဒါကြောင့် 30 နဲ့ အနုတ် 10 ဆိုရင် 20 ရပါတယ်။
      [[mark:draw-collapse-empty]] content၊ padding၊ border၊ အမြင့် မရှိတဲ့ block အလွတ်မှာတော့၊ သူ့
      အပေါ်နဲ့ အောက် margin က အချင်းချင်း collapse ဖြစ်ပြီး တစ်ခုပဲ ကျန်ပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Spacing: margin collapse"
        url: "https://web.dev/learn/css/spacing#margin_collapse"
      - title: "MDN — Mastering margin collapsing"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_box_model/Mastering_margin_collapsing"
      - title: "CSS 2.2 — Collapsing margins"
        url: "https://www.w3.org/TR/CSS22/box.html#collapsing-margins"
    actions:
      # The scroll for this step is gone: the page is only 839 px tall, so in
      # a preview this tall there is nothing to scroll and no scroll event to
      # record.
      - id: expect-info
        type: expect.preview
        at: { mark: scroll-collapse }
        timeoutMs: 5000
        target: { by: testId, value: info }
        textContains: "နေ့တိုင်း"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-h3-bottom
        type: editor.type
        at: { mark: type-h3-bottom }
        cadence: fast-explainer
        target: { file: styles.css, after: "  margin-top: -24px;\n}\n", occurrence: 1 }
        text: "\n.info h3 {\n  margin-bottom: 20px;\n}\n"
      - id: type-p-top
        type: editor.type
        at: { mark: type-p-top }
        cadence: fast-explainer
        target: { file: styles.css, after: "  margin-bottom: 20px;\n}\n", occurrence: 1 }
        text: "\n.info p {\n  margin-top: 30px;\n}\n"
      - id: expect-p-top
        type: expect.preview
        at: { mark: after-p-top }
        timeoutMs: 4000
        target: { by: testId, value: info }
        textContains: "ဖွင့်ချိန်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: open-collapse-board
        type: whiteboard.apply
        at: { mark: open-collapse-board }
        open: true
        clear: true
        upsertIds: [d-title]
      - id: draw-collapse-bands
        type: whiteboard.apply
        at: { mark: draw-collapse-bands }
        upsertIds: [d-h3, d-h3-l, d-band20, d-20, d-band30, d-30, d-p, d-p-l, d-result]
        drawMs: 4500
      - id: draw-collapse-axis
        type: whiteboard.apply
        at: { mark: draw-collapse-axis }
        upsertIds: [d-axis]
        drawMs: 1600
      - id: draw-collapse-negative
        type: whiteboard.apply
        at: { mark: draw-collapse-negative }
        upsertIds: [d-neg]
        drawMs: 1400
      - id: draw-collapse-empty
        type: whiteboard.apply
        at: { mark: draw-collapse-empty }
        upsertIds: [d-empty]
        drawMs: 1600

  - id: parent-child
    chapter: "Margin collapse ကို ဘယ်လို တားမလဲ"
    narration: >
      [[mark:close-collapse-board]] collapse နောက်တစ်မျိုးကတော့ မထင်မှတ်ဘဲ ကြုံရတတ်ပါတယ်။
      [[mark:type-h3-top]] အရောင်ဖျော့ card ထဲမှာ ခေါင်းစဉ်ရဲ့ အပေါ်ဘက် နေရာ ရအောင်၊ ခေါင်းစဉ်ကို အပေါ်
      margin ပါ ပေးကြည့်ရအောင်။ [[mark:after-h3-top]] နေရာလွတ် ဘယ်ရောက်လဲ ကြည့်ပါ၊ card ထဲ မဟုတ်ပါဘူး။
      card တစ်ခုလုံး ဆင်းသွားပြီး အပေါ်မှာ အဖြူ နေရာ ပေါ်လာပါတယ်။ ခေါင်းစဉ်က card ထိပ်နဲ့ ကပ်နေတုန်းပါ။
      [[mark:explain-parent-child]] ခေါင်းစဉ်က card ရဲ့ ပထမ child ဖြစ်ပြီး၊ card မှာ အပေါ် padding ရော
      border ပါ မရှိပါဘူး။ ဒါကြောင့် ခေါင်းစဉ်ရဲ့ အပေါ် margin က card ကိုယ်တိုင်ရဲ့ အပေါ် margin နဲ့
      collapse ဖြစ်ပြီး card အပြင်ကို ရောက်သွားပါတယ်။ နောက်ဆုံး child ရဲ့ အောက် margin ကလည်း ဒီလိုပဲ
      ထွက်သွားနိုင်ပါတယ်။ [[mark:type-flow-root]] ပြင်နည်း တစ်ခုက card ရဲ့ display ကို flow-root
      ပေးတာပါ။ [[mark:after-flow-root]] card က အပေါ် ပြန်တက်လာပြီး၊ နေရာလွတ်က card ထဲမှာ ရောက်သွားပါပြီ။
      lesson 13 မှာလိုပဲ flow-root က box ထဲမှာ flow layout အသစ် တစ်ခု စခိုင်းလို့၊ child တွေရဲ့ margin က
      အထဲမှာပဲ ကျန်ပါတယ်။ [[mark:select-flow-root]] ဒီ flow-root က card ကို အပြင်ကနေ ခွဲပေမယ့်၊
      ခေါင်းစဉ်နဲ့ စာပိုဒ်ကြားမှာ 30 pixel ပဲ ရှိတုန်းပါ။ card ထဲမှာ flow layout ဖြစ်နေတုန်းလို့ပါ။
      [[mark:type-grid]] အခု card ကို grid container အဖြစ် ပြောင်းကြည့်ရအောင်။ [[mark:after-grid]]
      စာပိုဒ်က အောက်ကို ခုန်ဆင်းသွားပါပြီ။ grid item တွေ၊ flex item တွေရဲ့ margin က collapse မဖြစ်လို့၊
      20 နဲ့ 30 ပေါင်းပြီး 50 ဖြစ်သွားပါတယ်။
    sources:
      - title: "MDN — Mastering margin collapsing (parent and first or last child)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_box_model/Mastering_margin_collapsing"
      - title: "MDN — display: flow-root"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/display#flow-root"
      - title: "CSS Grid Layout Module Level 2 — grid item margins do not collapse"
        url: "https://drafts.csswg.org/css-grid/#grid-items"
      - title: "web.dev Learn CSS — Spacing: preventing margin collapse"
        url: "https://web.dev/learn/css/spacing#preventing_margin_collapse"
    actions:
      - id: close-collapse-board
        type: whiteboard.apply
        at: { mark: close-collapse-board }
        open: false
      - id: type-h3-top
        type: editor.type
        at: { mark: type-h3-top }
        cadence: fast-explainer
        target: { file: styles.css, after: ".info h3 {\n  margin-bottom: 20px;\n", occurrence: 1 }
        text: "  margin-top: 20px;\n"
      - id: expect-h3-top
        type: expect.preview
        at: { mark: after-h3-top }
        timeoutMs: 4000
        target: { by: testId, value: collapse-stage }
        textContains: "ဖွင့်ချိန်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-flow-root
        type: editor.type
        at: { mark: type-flow-root }
        cadence: fast-explainer
        target: { file: styles.css, after: "  margin-top: 30px;\n}\n", occurrence: 1 }
        text: "\n.info {\n  display: flow-root;\n}\n"
      - id: expect-flow-root
        type: expect.preview
        at: { mark: after-flow-root }
        timeoutMs: 4000
        target: { by: testId, value: info }
        textContains: "ဖွင့်ချိန်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-flow-root
        type: editor.select
        at: { mark: select-flow-root }
        target: { file: styles.css, text: "display: flow-root;", occurrence: 1 }
      - id: type-grid
        type: editor.type
        at: { mark: type-grid }
        cadence: fast-explainer
        target: { file: styles.css, after: "  display: flow-root;\n", occurrence: 1 }
        text: "  display: grid;\n"
      - id: expect-grid
        type: expect.preview
        at: { mark: after-grid }
        timeoutMs: 4000
        target: { by: testId, value: info }
        textContains: "နေ့တိုင်း"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: prevent-board
    narration: >
      [[mark:open-prevent-board]] margin collapse ကို တားလို့ ရတဲ့ နည်းတွေ ကြည့်ရအောင်။
      [[mark:draw-prevent-padding]] parent မှာ padding ဒါမှမဟုတ် border ရှိရင်၊ child ရဲ့ margin က
      parent ထဲမှာပဲ ကျန်ပါတယ်။ ခုနက card တွေရဲ့ margin က list ထဲမှာ ကျန်ခဲ့တာ list မှာ padding
      ရှိလို့ပါ။ [[mark:draw-prevent-root]] parent ကို flow-root ပေးရင်လည်း အတူတူပါ။
      [[mark:draw-prevent-flex]] flex item နဲ့ grid item တွေရဲ့ margin က collapse မဖြစ်ဘဲ ပေါင်းပါတယ်။
      [[mark:draw-prevent-out]] float box နဲ့ absolute box တွေလည်း collapse မဖြစ်ပါဘူး။
      [[mark:draw-prevent-between]] margin တွေက ထိနေမှ collapse ဖြစ်တာပါ။ ဒါကြောင့် ကြားမှာ content၊
      padding ဒါမှမဟုတ် border တစ်ခုခု ရှိနေရင် margin နှစ်ခုလုံး ကျန်ပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Spacing: preventing margin collapse"
        url: "https://web.dev/learn/css/spacing#preventing_margin_collapse"
      - title: "MDN — Mastering margin collapsing"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_box_model/Mastering_margin_collapsing"
      - title: "MDN — Block formatting context"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_display/Block_formatting_context"
    actions:
      - id: open-prevent-board
        type: whiteboard.apply
        at: { mark: open-prevent-board }
        open: true
        clear: true
        upsertIds: [e-title]
      - id: draw-prevent-padding
        type: whiteboard.apply
        at: { mark: draw-prevent-padding }
        upsertIds: [e-c1, e-1]
        drawMs: 1600
      - id: draw-prevent-root
        type: whiteboard.apply
        at: { mark: draw-prevent-root }
        upsertIds: [e-c2, e-2]
        drawMs: 1400
      - id: draw-prevent-flex
        type: whiteboard.apply
        at: { mark: draw-prevent-flex }
        upsertIds: [e-c3, e-3]
        drawMs: 1600
      - id: draw-prevent-out
        type: whiteboard.apply
        at: { mark: draw-prevent-out }
        upsertIds: [e-c4, e-4]
        drawMs: 1400
      - id: draw-prevent-between
        type: whiteboard.apply
        at: { mark: draw-prevent-between }
        upsertIds: [e-c5, e-5]
        drawMs: 1600

  - id: strategy
    chapter: "Spacing ကို တစ်ပုံစံတည်း ထိန်းရအောင်"
    narration: >
      [[mark:open-strategy-board]] နည်း ဒီလောက် များတော့ page မှာ အစီအစဉ် လိုပါတယ်။
      [[mark:draw-strategy-component]] အဆင်ပြေတဲ့ အစီအစဉ် တစ်ခုက၊ card ဒါမှမဟုတ် ခလုတ်လို component က
      သူ့ အတွင်းဘက် နေရာလွတ် ဖြစ်တဲ့ padding ကို ကိုယ်တိုင် ပိုင်တာပါ။ [[mark:draw-strategy-layout]]
      component တွေကို ထည့်ထားတဲ့ layout ကတော့ သူတို့ကြားက နေရာလွတ်ကို gap နဲ့ ပိုင်ပါတယ်။
      [[mark:draw-strategy-no-margin]] component တွေကို အပြင်ဘက် margin မပေးတာ ကောင်းပါတယ်။ margin က
      ဘေးက အရာကို တွန်းလို့၊ ခုနက နောက်ဆုံး card အောက်က နေရာလွတ် အပိုလို ဖြစ်တတ်ပါတယ်။
      [[mark:draw-strategy-align]] alignment ကလည်း နေရာလွတ် ဖန်တီးပါတယ်။ item တွေကို ဖြန့်လိုက်ရင်
      ကျန်တဲ့ နေရာကို item တွေကြား ခွဲပေးပါတယ်။ [[mark:draw-strategy-scale]] ပြီးတော့ spacing တန်ဖိုး
      သုံးလေးခုကိုပဲ နေရာတိုင်းမှာ ပြန်သုံးရင် page က ညီညာပါမယ်။
    sources:
      - title: "web.dev Learn CSS — Spacing: creating consistent spacing"
        url: "https://web.dev/learn/css/spacing#creating_consistent_spacing"
      - title: "web.dev Learn CSS — Flexbox: alignment and space distribution"
        url: "https://web.dev/learn/css/flexbox#alignment_and_space_distribution"
      - title: "web.dev Learn CSS — Logical properties"
        url: "https://web.dev/learn/css/logical-properties"
    actions:
      - id: open-strategy-board
        type: whiteboard.apply
        at: { mark: open-strategy-board }
        clear: true
        upsertIds: [f-title]
      - id: draw-strategy-component
        type: whiteboard.apply
        at: { mark: draw-strategy-component }
        upsertIds: [f-layout, f-c1, f-c2, f-c3, f-comp-l]
        drawMs: 2600
      - id: draw-strategy-layout
        type: whiteboard.apply
        at: { mark: draw-strategy-layout }
        upsertIds: [f-g1, f-g2, f-layout-l]
        drawMs: 1800
      - id: draw-strategy-no-margin
        type: whiteboard.apply
        at: { mark: draw-strategy-no-margin }
        upsertIds: [f-no-margin]
        drawMs: 1400
      - id: draw-strategy-align
        type: whiteboard.apply
        at: { mark: draw-strategy-align }
        upsertIds: [f-align]
        drawMs: 1400
      - id: draw-strategy-scale
        type: whiteboard.apply
        at: { mark: draw-strategy-scale }
        upsertIds: [f-scale]
        drawMs: 1600

  - id: tokens
    narration: >
      [[mark:close-strategy-board]] အဲဒီ တန်ဖိုးတွေကို custom property ထဲ သိမ်းရအောင်။
      [[mark:type-root]] ဖိုင်ရဲ့ ထိပ်ဆုံးမှာ root element အတွက် spacing custom property နှစ်ခု
      ကြေညာပါမယ်။ 8 pixel ရှိတဲ့ အသေး တစ်ခုနဲ့ 16 pixel ရှိတဲ့ အလတ် တစ်ခုပါ။ [[mark:type-tok-gap]] list
      ရဲ့ gap က အလတ်ကို သုံးပါတယ်။ [[mark:type-tok-card]] card တစ်ခုစီရဲ့ padding က အပေါ်အောက်အတွက်
      အသေးကို၊ ဘယ်ညာအတွက် အလတ်ကို သုံးပါတယ်။ [[mark:type-tok-btn]] ခလုတ်လည်း ဒီ အတွဲကိုပဲ ယူပါတယ်။
      [[mark:after-tokens]] တန်ဖိုးတွေ သိပ် မကွာလို့ ဘာမှ သိပ် မရွေ့ပါဘူး။ ဒါပေမဲ့ အခု card တွေကြားက gap
      နဲ့ card၊ ခလုတ်ရဲ့ padding တွေက တစ်နေရာတည်းမှာ ရှိတဲ့ နာမည် နှစ်ခုကနေ လာပါတယ်။
      [[mark:type-space-24]] အလတ် တန်ဖိုးကို 24 pixel ပြောင်းကြည့်ရအောင်။ [[mark:after-space-24]]
      တစ်နေရာတည်း ပြင်လိုက်တာနဲ့ gap တွေ၊ card ရဲ့ ဘယ်ညာ padding နဲ့ ခလုတ်ပါ အတူတူ ကြီးသွားပါပြီ။ lesson
      11 မှာလို custom property ကို component တစ်ခုမှာပဲ ပြန်ပေးရင်တော့ အဲဒီ အပိုင်းပဲ ပြောင်းပါတယ်။
    sources:
      - title: "web.dev Learn CSS — Spacing: creating consistent spacing"
        url: "https://web.dev/learn/css/spacing#creating_consistent_spacing"
      - title: "web.dev Learn CSS — Custom properties"
        url: "https://web.dev/learn/css/custom-properties"
      - title: "MDN — Using CSS custom properties"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/Using_CSS_custom_properties"
    actions:
      - id: close-strategy-board
        type: whiteboard.apply
        at: { mark: close-strategy-board }
        open: false
      # The scroll for this step is gone: the page is only 909 px tall, so in
      # a preview this tall there is nothing to scroll and no scroll event to
      # record.
      - id: type-root
        type: editor.type
        at: { mark: type-root }
        cadence: line-by-line
        target: { file: styles.css, after: "", occurrence: 1 }
        text: ":root {\n  --space-s: 8px;\n  --space-m: 16px;\n}\n\n"
      - id: type-tok-gap
        type: editor.type
        at: { mark: type-tok-gap }
        cadence: line-by-line
        target: { file: styles.css, after: "  gap: 16px;\n", occurrence: 1 }
        text: "  gap: var(--space-m);\n"
      - id: type-tok-card
        type: editor.type
        at: { mark: type-tok-card }
        cadence: line-by-line
        target: { file: styles.css, after: "  margin-bottom: 0;\n", occurrence: 1 }
        text: "  padding: var(--space-s) var(--space-m);\n"
      - id: type-tok-btn
        type: editor.type
        at: { mark: type-tok-btn }
        cadence: line-by-line
        target: { file: styles.css, after: "  padding: 8px 20px;\n", occurrence: 1 }
        text: "  padding: var(--space-s) var(--space-m);\n"
      - id: expect-tokens
        type: expect.preview
        at: { mark: after-tokens }
        timeoutMs: 4000
        target: { by: testId, value: menu-drinks }
        textContains: "လက်ဖက်ရည်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-space-24
        type: editor.type
        at: { mark: type-space-24 }
        cadence: line-by-line
        target: { file: styles.css, after: "  --space-m: 16px;\n", occurrence: 1 }
        text: "  --space-m: 24px;\n"
      - id: expect-space-24
        type: expect.preview
        at: { mark: after-space-24 }
        timeoutMs: 4000
        target: { by: testId, value: order-button }
        textContains: "မှာမယ်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:open-quiz]] မပြီးခင် မေးခွန်း တစ်ခု မေးကြည့်ရအောင်။ ခေါင်းစဉ်ရဲ့ အောက် margin က 20 pixel၊
      နောက်က စာပိုဒ်ရဲ့ အပေါ် margin က 30 ဖြစ်ပြီး၊ သူတို့ parent က direction ကို column ပေးထားတဲ့ flex
      container ပါ။ နှစ်ခုကြားမှာ နေရာလွတ် ဘယ်လောက် ရှိမလဲ။ ခဏ စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]]
      အဖြေက 50 pixel ပါ။ flex item တွေက grid item တွေလိုပဲ margin collapse မဖြစ်လို့ပါ။ [[mark:recap]]
      ဒါဆို ပြန်ချုပ်ရရင်၊ HTML နဲ့ နေရာလွတ် ထည့်တာကို အဓိပ္ပာယ် ရှိမှပဲ လုပ်ပါ။ padding က box ရဲ့
      အတွင်း၊ margin က အပြင်၊ gap က layout ထဲက item တွေကြားက နေရာလွတ်ပါ။ [[mark:recap-values]] shorthand
      တန်ဖိုးတွေက အပေါ်ကနေ နာရီလက်တံ လည်တဲ့ဘက် သွားပါတယ်။ အကျယ် ကန့်သတ်ထားတဲ့ box ကို auto margin က အလယ်
      ပို့ပြီး၊ margin က အနုတ်လည်း ရပါတယ်။ flow layout ထဲမှာ အပေါ်အောက် margin တွေ collapse ဖြစ်ပေမယ့်၊
      padding၊ border၊ flow-root၊ flex ဒါမှမဟုတ် grid က အဲဒါကို တားပါတယ်။ spacing custom property တွေက
      နေရာလွတ်တွေကို တစ်ပုံစံတည်း ထိန်းပေးပါတယ်။ [[mark:next-lesson]] card အစွန်းပေါ်က badge က မေးခွန်း
      တစ်ခု ချန်ထားပါတယ်။ box တွေ ထပ်နေရင် ဘယ်ဟာ အပေါ်မှာ ပေါ်မလဲ။ နောက် lesson မှာတော့ z-index နဲ့
      stacking context ကို ကြည့်သွားပါမယ်။
    sources:
      - title: "web.dev Learn CSS — Spacing: check your understanding"
        url: "https://web.dev/learn/css/spacing#check_your_understanding"
      - title: "MDN — Mastering margin collapsing (flex and grid items)"
        url: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_box_model/Mastering_margin_collapsing"
      - title: "web.dev Learn CSS — Z-index and stacking contexts (next lesson)"
        url: "https://web.dev/learn/css/z-index"
    actions:
      - id: open-quiz
        type: whiteboard.apply
        at: { mark: open-quiz }
        open: true
        clear: true
        upsertIds: [g-title, g-q]
      - id: draw-quiz-answer
        type: whiteboard.apply
        at: { mark: quiz-answer }
        upsertIds: [g-a, g-a-check, g-rule]
        drawMs: 2000
      - id: expect-final-css
        type: expect.file
        at: { mark: recap }
        path: styles.css
        contains: ":root {\n  --space-s: 8px;\n  --space-m: 16px;\n  --space-m: 24px;\n}\n\n.menu-card {\n  padding: 12px;\n  margin-bottom: 16px;\n  margin-bottom: 0;\n  padding: var(--space-s) var(--space-m);\n}\n\n.drinks .menu {\n  display: grid;\n  gap: 16px;\n  gap: var(--space-m);\n}\n\n.order-btn {\n  padding: 8px 20px;\n  padding: var(--space-s) var(--space-m);\n}\n\n.drinks {\n  max-width: 320px;\n  margin: 0 auto;\n}\n"
      - id: expect-final-css-2
        type: expect.file
        at: { afterAction: expect-final-css }
        path: styles.css
        contains: "\n.badge {\n  width: fit-content;\n  display: block;\n  margin-top: -24px;\n}\n\n.info h3 {\n  margin-bottom: 20px;\n  margin-top: 20px;\n}\n\n.info p {\n  margin-top: 30px;\n}\n\n.info {\n  display: flow-root;\n  display: grid;\n}\n"

checks:
  - { type: timing.p95Ms, max: 300 }
