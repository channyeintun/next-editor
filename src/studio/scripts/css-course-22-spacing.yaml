# CSS course (Burmese), lesson 22 of 43: spacing.
#
# Narration is an ENGLISH DRAFT for the Burmese writer (DESIGN.md next to this
# file is the span-by-span brief). Every [[mark:…]] sits where its action
# begins, at a sentence end; each span carries one piece of meaning.
# Everything the learner sees (title, chapters, whiteboard labels, UI strings)
# is Burmese already.
#
# Shape: board (recall lesson 21; the three-cards puzzle; margin outside,
# padding inside, gap between) → board (HTML spacing: br, hr, nbsp; only
# when it carries meaning) → code tour (the br in the footer address, the hr,
# the nbsp in the special's price; empty styles.css) → card padding (inside,
# the background fills it) → card margin-bottom (outside, transparent; extra
# space after the last card) → margin-bottom: 0 + the list as a grid with a
# gap (space only between) → order button padding with two values → board
# (one to four values clockwise from the top; border-box keeps padding inside
# a set width) → drinks section max-width + margin 0 auto (centred; % margins
# use the width; vertical auto is 0; auto in flex) → badge: block, fit-content,
# negative top margin (overlaps the card edge, the name follows it up) →
# .info heading bottom 20 + paragraph top 30 (30, not 50) → board (collapse
# bands; block axis only; why; negative; empty block) → heading top 20 (the
# tinted card moves down: parent-child collapse) → flow-root (the space moves
# inside) → grid (20 + 30 = 50) → board (ways to prevent collapse) → board
# (strategy: components own padding, layouts own gap, no outer margins on
# components; alignment space; a scale) → tokens on :root, used by gap, card
# padding and button padding → --space-m 24 (everything grows together) →
# quiz (flex 20 + 30 = 50) and recap, hand-off to z-index (lesson 23).
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set(; no postcss config; no reload
# (index.html is never edited). Keystroke-typed values have no misleading
# valid prefix: "padding: 1…", "margin-bottom: 1…", "gap: 1…", "max-width: 3…"
# and "margin-top: -2…" are invalid until their unit lands; "display: g…" is
# invalid until "grid". The badge rule types width: fit-content BEFORE
# display: block (width does nothing on an inline span, so the badge never
# flashes as a full-width bar). "padding: 8px 20px" passes through "8px"
# (8 on all sides for a moment) — never narrated. The :root rule, the lines
# that contain var(…) and the --space-m override are line-by-line: :root is
# typed at the top of a full file, and a half-typed ":r" selector or an
# unterminated "--space-s: 8" would drop or swallow every rule after it (33
# of 47 keystroke states did, probe-fix/root-states.ts); whole lines are
# always valid (":root {" just nests the rest), and no unclosed parenthesis
# or "--space-m: 2" ever reaches the browser.
#
# Measured in headless Chrome at 432 × 720 (probe/stages.ts): cards 384 wide
# touching → padding 12 (cards 105 tall) → margin-bottom 16 (tinted list 361
# → 409: 8 above the first card, 24 under the last) → grid + gap 16 (8 above,
# 8 below, 16 between) → button 59 × 31 → 87 × 45 → drinks section 400 →
# 320, 40 each side → badge 11 px above the card's top border, the name 30 px
# higher → heading/paragraph space 0 → 20 → 30 → heading top 20: the tinted
# card moves down 20 inside the white stage, heading flush with its top →
# flow-root: card back up, 20 inside above the heading → grid: space 30 → 50
# → tokens: card padding 8/16 (badge 15 px above the border), gap 16 →
# --space-m 24: gaps 24, card sides 24, button 79 → 95 wide.
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
