# Go course, lesson 06: if and else (Burmese).
#
# Start state: main.go with `package main`, `import "fmt"` and an empty `func main`.
# Edits, all insert-only:
#   1. the two marks (myanmar, maths := 85, 72) and a Println of two comparisons, then the
#      if / else if / else chain on the Myanmar mark -> run-1: true false / 85 ဂုဏ်ထူး;
#   2. an && check of both subjects and an if with a short statement (total >= 150)
#      -> run-2 adds ဘာသာ နှစ်ခုလုံး အောင် / 157 ဆုရ;
#   3. an || check (either subject failed), then a second student's marks inserted as a new
#      assignment under the first line (35, 60) -> run-3: false false / 35 ကျ / ဘာသာ တစ်ခုခု ကျ.
# Boards: (F) if is a fork, questions asked top to bottom; (C) comparisons answer true/false;
# (E) the = vs == trap (said, not run); (T) the and / or / not table; (Q) quiz.
# Fixtures: bun ~/Documents/go-course-work/tools/sim-go.ts <this yaml> --write
