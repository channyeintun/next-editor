  - id: your-turn
    chapter: ကိုယ့် team အတွက်
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ ကိုယ့် team မှာ ခဏခဏ ပြန်ရှင်းပြနေရတဲ့ လုပ်ငန်းစဉ် တစ်ခုကို စဉ်းစားပါ။ release
      မထုတ်ခင် စစ်ရတဲ့ အဆင့်တွေ၊ incident တစ်ခုပြီးရင် ရေးရတဲ့ မှတ်တမ်း ပုံစံ ဆိုရင် ဖြစ်ပါတယ်။
      [[mark:turn-2]] lesson ကို pause လုပ်ပြီး၊ ဒီ file ထဲက description လို စာကြောင်း တစ်ကြောင်းကို ကိုယ့်
      လုပ်ငန်းစဉ်အတွက် ရေးကြည့်ပါ။ ဘာလုပ်လဲ၊ ဘယ်အချိန် သုံးရမလဲ နှစ်ခုလုံး ပါရပါမယ်။ ကိုယ့် team က တကယ် ခိုင်းမယ့်
      စကားလုံးတွေ ပါမပါကိုလည်း ပြန်စစ်ကြည့်ပါ။
    sources:
      - {
          title: "Claude Docs: Skill authoring best practices",
          url: "https://platform.claude.com/docs/en/agents-and-tools/agent-skills/best-practices",
        }
    actions:
      - { id: close-run, type: slide.close, at: { mark: turn } }
      - id: sel-desc
        type: editor.select
        at: { mark: turn-2 }
        target:
          file: billing-service/.claude/skills/outage-notice/SKILL.md
          text: "description: Drafts an outage notice with the bill credit. Use when asked to write an outage notice."

  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ outage တိုင်း ပြန်ရှင်းနေရတဲ့ လုပ်ငန်းစဉ်ကို skill တစ်ခုထဲမှာ တစ်ခါတည်း
      ရေးထားလိုက်ပါပြီ။ skill က SKILL.md ပါတဲ့ folder တစ်ခုပါ။ description က ဘယ်အချိန် သုံးမလဲ ပြောပြီး၊ စာကိုယ်က
      ဘယ်လို လုပ်မလဲ ပြောပါတယ်။
      [[mark:recap-2]] Claude က session တိုင်း description တွေကိုပဲ ကြည့်ထားပြီး၊ task နဲ့ ကိုက်တဲ့အခါမှ စာကိုယ်ကို
      ဖတ်ပါတယ်။ ဒါကြောင့် description ကောင်းမှ skill က အချိန်မှန် အလုပ်လုပ်ပါတယ်။
      [[mark:next]] နောက် lesson မှာတော့ report job တွေ ရွှေ့တဲ့ ရှည်လျားတဲ့ လုပ်ငန်းစဉ်အတွက်၊ reference file နဲ့ script
      ပါတဲ့ skill ကို context မပြည့်အောင် ဘယ်လို ဖွဲ့စည်းမလဲ ဆိုတာကို လေ့လာသွားပါမယ်။
    sources:
