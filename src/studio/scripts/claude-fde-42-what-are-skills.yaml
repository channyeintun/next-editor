build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 9342

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: need
    chapter: Outage တိုင်း ပြန်ရှင်းရတဲ့ အလုပ်
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ MCP client က server ပေးထားတဲ့ tool တွေကို ရှာပြီး ခေါ်ပေးပုံနဲ့၊ Billing ရဲ့ Claude Code ကို
      ticket MCP server နဲ့ ချိတ်ပုံကို လေ့လာခဲ့ပါတယ်။ အခု Billing ရဲ့ Claude Code က Ticket system နဲ့ NMS ကို
      ဖတ်နိုင်ပါပြီ။
      [[mark:sel-nms]] ဒီအပတ်မှာတော့ တခြား ပြဿနာ တစ်ခု ပေါ်လာပါတယ်။ လိုင်းကျတိုင်း၊ ဒါမှမဟုတ် ညဘက် လိုင်းပြင်ဖို့
      စီစဉ်တိုင်း၊ ထိခိုက်တဲ့ customer တွေဆီ notice တစ်စောင် ပို့ရပါတယ်။ notice ထဲမှာ ဘယ်မြို့နယ်၊ ဘယ်အချိန်ကနေ
      ဘယ်အချိန်ထိ ဆိုတာအပြင်၊ customer က bill credit ဘယ်လောက် ရမလဲ ဆိုတာလည်း ပါရပါတယ်။
      [[mark:story]] credit ကို plan ဈေးနဲ့ တွက်ရတာမို့ support team က Billing developer တစ်ယောက်ကို အကူအညီ
      တောင်းပါတယ်။ အဲဒီ developer က Claude Code ကို notice ရေးခိုင်းတိုင်း ရှင်းပြချက် အတူတူကို ပြန်ရိုက်ရပါတယ်။
      မြို့နယ်နဲ့ အချိန် မပါရင် မေးဖို့၊ credit ကို ဘယ်လို တွက်ရမလဲ၊ စာ ဘယ်လောက် ရှည်ရမလဲ ဆိုတာတွေပါ။ တစ်ခါတလေ
      တစ်ချက်ချက် ကျန်သွားတော့ notice တွေက တစ်စောင်နဲ့ တစ်စောင် မတူ ဖြစ်နေပါတယ်။
      [[mark:story-2]] ဒီလို ခဏခဏ ပြန်ရှင်းနေရတဲ့ လုပ်ငန်းစဉ်အတွက် Claude Code မှာ skill ဆိုတာ ရှိပါတယ်။ skill ဆိုတာ
      အလုပ် တစ်မျိုးကို ဘယ်လို လုပ်ရမလဲ ရေးထားပြီး၊ လိုတဲ့အချိန်မှ Claude ဖတ်သုံးတဲ့ လမ်းညွှန်ပါ။ docs ကလည်း
      ညွှန်ကြားချက် အတူတူကို chat ထဲ ခဏခဏ ကူးထည့်နေရရင်၊ ဒါမှမဟုတ် CLAUDE.md ထဲက အပိုင်း တစ်ခုက လုပ်ငန်းစဉ်
      တစ်ခုလို ရှည်လာရင် skill လုပ်ဖို့ အချိန်ရောက်ပြီလို့ ပြောပါတယ်။ CLAUDE.md နဲ့ မတူတာက skill ရဲ့ စာကိုယ်ကို
      သုံးတဲ့အချိန်မှပဲ ဖတ်တာပါ။
    sources:
      - {
          title: "Claude Code Docs: Extend Claude with skills",
          url: "https://code.claude.com/docs/en/skills",
        }
    actions:
      - { id: open-readme, type: workspace.openFile, at: { scene: start }, path: README.md }
      - id: sel-nms
        type: editor.select
        at: { mark: sel-nms }
        target:
          file: README.md
          text: "- NMS: မြို့နယ်အလိုက် လိုင်းကျမှု အခြေအနေ"
      - id: sel-billing
        type: editor.select
        at: { mark: story }
        target:
          file: README.md
          text: "- Billing: plan၊ invoice၊ ငွေပေးချေမှု (သက်တမ်း 9 နှစ်ရှိ codebase)"

  - id: anatomy
    chapter: Skill ဆိုတာ folder တစ်ခု
    narration: >
      [[mark:b1-open]] skill တစ်ခုကို ဘာနဲ့ ဖွဲ့စည်းထားလဲ ဆွဲကြည့်ရအောင်။ skill တစ်ခုဟာ folder တစ်ခုပါ။ folder ရဲ့
      နာမည်က skill ရဲ့ နာမည် ဖြစ်လာပါတယ်။
      [[mark:b1-file]] folder ထဲမှာ SKILL.md ဆိုတဲ့ file တစ်ခု မဖြစ်မနေ ရှိရပါတယ်။ SKILL.md မှာ အပိုင်း နှစ်ပိုင်း
      ပါပါတယ်။
      [[mark:b1-front]] ထိပ်ဆုံးက dash သုံးခု မျဉ်းနှစ်ကြောင်းကြားမှာ YAML frontmatter ရှိပါတယ်။ ဒီထဲက description က
      ဒီ skill ကို ဘယ်အချိန် သုံးရမလဲ ဆိုတာ Claude ကို ပြောပြပါတယ်။ frontmatter ကို ဖတ်ပေးတာက file ရဲ့ ပထမဆုံး
      စာကြောင်းက dash သုံးခု ဖြစ်မှပါ။
      [[mark:b1-body]] အောက်က markdown စာကိုယ်ကတော့ အလုပ်ကို ဘယ်လို လုပ်ရမလဲ ဆိုတဲ့ ညွှန်ကြားချက်တွေပါ။
      [[mark:b1-where]] ဒီ folder ကို ဘယ်မှာ ထားမလဲ ဆိုတာလည်း အရေးကြီးပါတယ်။ project ရဲ့ skills folder ထဲ ထားပြီး
      commit လုပ်ရင် team တစ်ခုလုံး git ကနေ ရပါတယ်။ ကိုယ့် home folder ထဲက skills folder မှာ ထားရင်တော့ ဒီစက်ပေါ်က
      ကိုယ့် project အားလုံးမှာ ကိုယ်တစ်ယောက်တည်း သုံးရပါတယ်။ ကုမ္ပဏီ တစ်ခုလုံးအတွက် ထားတဲ့ နေရာနဲ့ plugin ထဲ
      ထည့်တဲ့ နည်းလည်း ရှိပါသေးတယ်။ outage notice skill ကိုတော့ Billing developer အားလုံး သုံးရမှာမို့ project ထဲမှာ
      ထားပါမယ်။
    sources:
      - {
          title: "Claude Code Docs: Extend Claude with skills (where skills live)",
          url: "https://code.claude.com/docs/en/skills",
        }
      - { title: "Agent Skills: Specification", url: "https://agentskills.io/specification" }
