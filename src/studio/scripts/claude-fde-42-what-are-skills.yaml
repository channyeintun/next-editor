  - id: the-run
    chapter: Skill ကို သုံးပုံ နှစ်မျိုး
    narration: >
      [[mark:r-open]] skill ကို သုံးဖို့ နည်း နှစ်မျိုး ရှိပါတယ်။ ပထမ နည်းက ပုံမှန် စကားနဲ့ ခိုင်းတာပါ။ ဒီ screen မှာ
      developer တစ်ယောက်က စမ်းချောင်းအတွက် notice ရေးခိုင်းတာကို ဒီလို မြင်ရပါတယ်။ prompt ထဲမှာ skill နာမည် မပါပါဘူး။
      [[mark:r-skill]] Claude က description နဲ့ ကိုက်တာကို တွေ့တော့ outage notice skill ကို ခေါ်ပါတယ်။
      [[mark:r-loaded]] skill ရဲ့ ညွှန်ကြားချက်တွေ ဝင်လာပြီ ဆိုတာကို ပြနေပါတယ်။ SKILL.md ရဲ့ စာကိုယ်က context ထဲ
      ရောက်လာတာ ဒီအချိန်မှာပါ။
      [[mark:r-notice]] ရလာတဲ့ notice က skill ထဲက အဆင့်တွေအတိုင်း မြို့နယ်၊ အချိန်နဲ့ ဖုန်းနံပါတ် ပါတဲ့ စာပိုဒ်
      တစ်ပိုဒ်ပါ။
      [[mark:r-credit]] credit စာကြောင်းမှာလည်း ၂၄ နာရီ မပြည့်လို့ credit မရှိဘူးလို့ စည်းကမ်းအတိုင်း ရေးထားပါတယ်။
      ဒီ screen ထဲက စကားတွေကို ဥပမာအဖြစ် ကြိုစီစဉ်ထားတာဖြစ်ပြီး၊ tool ခေါ်ပုံကတော့ Claude Code ရဲ့ တကယ့် ပုံစံပါ။
      [[mark:r-direct]] ဒုတိယ နည်းက ကိုယ်တိုင် ခေါ်တာပါ။ folder နာမည်က command ဖြစ်လာတာမို့ message ရဲ့ အစမှာ
      outage notice command ကို ရိုက်ရင် skill ကို တိုက်ရိုက် run ပါတယ်။ message ရဲ့ အလယ်မှာ ရေးရင်တော့ Claude ကို
      run ခွင့်ပေးတာလောက်ပဲ ဖြစ်ပါတယ်။
    sources:
