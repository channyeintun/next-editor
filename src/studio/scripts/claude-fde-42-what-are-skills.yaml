          at: { mark: c-task },
          upsertIds: [c-task, c-task-l],
          drawMs: 900,
        }
      - {
          id: draw-c-match,
          type: whiteboard.apply,
          at: { mark: c-match },
          upsertIds: [c-a1, c-match],
          drawMs: 900,
        }
      - {
          id: draw-c-body,
          type: whiteboard.apply,
          at: { mark: c-body },
