          at: { mark: c-open },
          clear: true,
          upsertIds: [c-title],
        }
      - {
          id: draw-c-ctx,
          type: whiteboard.apply,
          at: { mark: c-ctx },
          upsertIds: [c-ctx, c-ctx-l, c-d1-l, c-d2-l, c-d3-l],
          drawMs: 1800,
        }
      - {
          id: draw-c-task,
