  - id: choosing
    chapter: Claude က skill ကို ဘယ်လို ရွေးလဲ
    narration: >
      [[mark:c-open]] skill တွေ တစ်ခုထက် ပိုလာရင် Claude က ဘယ်ဟာကို သုံးမလဲ ဘယ်လို ဆုံးဖြတ်လဲ။ နောက်ပိုင်း Billing မှာ
      skill တွေ များလာမယ် ဆိုပါစို့။
      [[mark:c-ctx]] session စတဲ့အခါ Claude Code က skill တစ်ခုစီရဲ့ name နဲ့ description ကိုပဲ context window ထဲ
      ထည့်ပါတယ်။ context window ဆိုတာ request တစ်ခုမှာ model မြင်နိုင်တဲ့ စာ အားလုံးအတွက် နေရာပါ။ skill ရဲ့ စာကိုယ်
      အပြည့်ကိုတော့ ဒီအဆင့်မှာ မဖတ်သေးပါဘူး။
      [[mark:c-task]] အခု developer တစ်ယောက်က စမ်းချောင်းမှာ ဒီည fibre ပြင်မယ်၊ notice ရေးပေးပါလို့ ခိုင်းတယ်
      ဆိုပါစို့။
      [[mark:c-match]] Claude က ဒီ task ကို description တွေနဲ့ တိုက်ကြည့်ပြီး၊ ကိုက်ညီတဲ့ skill ကို ရွေးပါတယ်။
      [[mark:c-body]] ရွေးပြီးမှ အဲဒီ skill ရဲ့ SKILL.md ကို file ကနေ ဖတ်ပြီး ညွှန်ကြားချက်အတိုင်း လုပ်ပါတယ်။ ကျန်တဲ့
      skill တွေရဲ့ စာကိုယ်ကတော့ ဒီ task မှာ context ထဲ ရောက်မလာပါဘူး။
      [[mark:c-cost]] ဒါကြောင့် skill တွေ များလာလည်း session တိုင်းမှာ ကုန်တာက description တွေအတွက်ပဲ ဖြစ်ပါတယ်။ token
      ဆိုတာ model က စာကို ဖြတ်ယူတဲ့ အပိုင်းအစလေးပါ။ platform docs အရ skill တစ်ခုရဲ့ name နဲ့ description က token
      ၁၀၀ လောက်ပဲ ကုန်ပါတယ်။ ဆိုလိုတာက skill ကို ရွေးတဲ့ အချိန်မှာ Claude လက်ထဲ ရှိတာ description ပဲ ဖြစ်ပါတယ်။
    sources:
      - {
          title: "Claude Code Docs: Extend Claude Code (features overview)",
          url: "https://code.claude.com/docs/en/features-overview",
        }
      - {
          title: "Claude Docs: Agent Skills overview",
          url: "https://platform.claude.com/docs/en/agents-and-tools/agent-skills/overview",
        }
    actions:
