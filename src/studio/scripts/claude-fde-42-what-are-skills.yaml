  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ outage notice skill အတွက် description နှစ်မျိုး ရေးထားတယ် ဆိုပါစို့။
      developer က notice ရေးပေးပါလို့ ခိုင်းတဲ့အခါ ဘယ် description က အချိန်မှန် ရွေးခံရဖို့ ပိုသေချာမလဲ။
      [[mark:q-a]] ပထမ တစ်ခုမှာ notice တွေအတွက် ကူညီပေးတယ်လို့ပဲ ရေးထားပါတယ်။
      [[mark:q-b]] ဒုတိယ တစ်ခုမှာ outage notice ကို ရေးပေးတယ်၊ outage notice တောင်းတဲ့အခါ သုံးပါလို့ ရေးထားပါတယ်။
      lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ တစ်ခုပါ။ ဘာကြောင့်လဲဆိုတော့ Claude က developer ခိုင်းတဲ့ စကားကို
      description တွေနဲ့ တိုက်ကြည့်ပြီး ရွေးလို့ပါ။ ပထမ တစ်ခုက ဘာ notice လဲ၊ ဘယ်အချိန် သုံးရမလဲ မပြောတော့၊
      တခြား skill တွေနဲ့ ရောပြီး မှားရွေးတာ၊ ဒါမှမဟုတ် လုံးဝ မရွေးတာ ဖြစ်တတ်ပါတယ်။
      [[mark:q-rule]] ဒါကြောင့် description မှာ skill က ဘာလုပ်လဲနဲ့ ဘယ်အချိန် သုံးရမလဲ ဆိုတာ နှစ်ခုလုံး ရေးပါ။ user
      တွေ တကယ် ပြောမယ့် စကားလုံးတွေကို ထည့်ပြီး၊ အဓိက အသုံးကို ရှေ့ဆုံးမှာ ထားပါ။
    sources:
      - {
          title: "Claude Docs: Skill authoring best practices (descriptions)",
          url: "https://platform.claude.com/docs/en/agents-and-tools/agent-skills/best-practices",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: q-rule },
          upsertIds: [q-t1, q-t2],
          drawMs: 1600,
        }

  - id: write-it
    chapter: Outage notice skill ကို ရေးခြင်း
    narration: >
      [[mark:f-open]] ဒါဆို Billing ရဲ့ outage notice skill ကို ရေးကြည့်ရအောင်။ file က project ရဲ့ skills folder အောက်က
      outage notice folder ထဲမှာ ရှိပြီး၊ name ကို ရေးထားပြီးသားပါ။
      [[mark:type-desc]] Claude Code မှာ frontmatter field တွေ အားလုံးက မထည့်လည်း ရပါတယ်။ name မပါရင် folder
      နာမည်ကို ယူပြီး၊ description မပါရင် စာကိုယ်ရဲ့ ပထမ စာကြောင်းကို သုံးပါတယ်။ ဒါပေမဲ့ Agent Skills ဆိုတဲ့ open
      standard မှာရော၊ Claude app နဲ့ API ဘက်မှာပါ name နဲ့ description နှစ်ခုလုံး မဖြစ်မနေ လိုပါတယ်။ ဒါကြောင့်
      နေရာတိုင်းမှာ သုံးစေချင်ရင် နှစ်ခုလုံး ထည့်ပါ။ description မှာ ဘာရေးလဲ၊ ဘယ်အချိန် သုံးလဲ နှစ်ခုလုံး ပါပါတယ်။
      [[mark:type-steps]] စာကိုယ်မှာ developer ခဏခဏ ပြန်ရိုက်ခဲ့တဲ့ ရှင်းပြချက်ကို အဆင့်လိုက် ရေးပါမယ်။ ပထမ အဆင့်က
      မြို့နယ်နဲ့ အချိန် မပါရင် ခန့်မှန်းမရေးဘဲ မေးဖို့ပါ။ ဒုတိယ အဆင့်က credit စည်းကမ်းပါ။ လိုင်းကျတာ ၂၄ နာရီ
      အပြည့် တစ်ခါ ပြည့်တိုင်း plan ဈေးရဲ့ တစ်ရက်စာကို credit ပေးပါတယ်။
      [[mark:type-format]] တတိယ အဆင့်က ပုံစံပါ။ အင်္ဂလိပ်လို စာပိုဒ် တိုတို တစ်ပိုဒ်ပဲ ရေးပြီး၊ မြန်မာလို ဗားရှင်းကို
      support team က ထည့်ပါတယ်။ နောက်ဆုံး အဆင့်က support ဖုန်းနံပါတ်နဲ့ အဆုံးသတ်ဖို့ပါ။ ဒီ လေးဆင့်ကြောင့် notice
      တိုင်းက ပုံစံ တစ်မျိုးတည်း ဖြစ်လာပါတယ်။
      [[mark:sel-credit]] ဒီ credit စာကြောင်းက skill ထဲမှာ အရေးအကြီးဆုံးပါ။ customer ကို ပေးမယ့် ငွေနဲ့ ဆိုင်တာမို့
      developer တစ်ယောက်ချင်း မှတ်မိသလို မတွက်ဘဲ၊ စည်းကမ်း တစ်ခုတည်းကို skill ထဲမှာ ရေးထားတာပါ။ notice ကို
      customer တွေဆီ မပို့ခင် shift lead က စစ်ပြီး approve လုပ်တာကတော့ အရင်အတိုင်းပါပဲ။
    sources:
      - {
          title: "Claude Code Docs: Extend Claude with skills (frontmatter reference)",
          url: "https://code.claude.com/docs/en/skills",
        }
      - { title: "Agent Skills: Specification", url: "https://agentskills.io/specification" }
    actions:
      - {
          id: close-quiz,
          type: whiteboard.apply,
          at: { mark: f-open, offsetMs: -900 },
          open: false,
        }
      - {
          id: open-skill,
          type: workspace.openFile,
          at: { afterAction: close-quiz },
          path: billing-service/.claude/skills/outage-notice/SKILL.md,
        }
      - id: type-desc
        type: editor.type
        at: { mark: type-desc }
        cadence: line-by-line
        target:
          {
            file: billing-service/.claude/skills/outage-notice/SKILL.md,
            after: "name: outage-notice\n",
          }
        text: "description: Drafts an outage notice with the bill credit. Use when asked to write an outage notice.\n"
      - id: type-steps
        type: editor.type
        at: { mark: type-steps }
        cadence: line-by-line
        target:
          {
            file: billing-service/.claude/skills/outage-notice/SKILL.md,
            after: "# Outage notice\n\n",
          }
        text: "1. If the townships, the start time or the expected end time are missing, ask for them.\n2. Bill credit: one day of the plan price for every full 24 hours of outage.\n"
      - id: type-format
        type: editor.type
        at: { mark: type-format }
        cadence: line-by-line
        target:
          {
            file: billing-service/.claude/skills/outage-notice/SKILL.md,
            after: "for every full 24 hours of outage.\n",
          }
        text: "3. Write one short English paragraph. The support team adds the Burmese version.\n4. End with the support line: \"Call 1800 for help.\"\n"
      - id: expect-credit
        type: expect.file
        at: { afterAction: type-format }
        path: billing-service/.claude/skills/outage-notice/SKILL.md
        contains: "2. Bill credit: one day of the plan price for every full 24 hours of outage.\n"
      - id: sel-credit
        type: editor.select
        at: { mark: sel-credit }
        target:
          file: billing-service/.claude/skills/outage-notice/SKILL.md
          text: "2. Bill credit: one day of the plan price for every full 24 hours of outage."

  - id: listed
    chapter: Skill ရောက်မရောက် စစ်ခြင်း
    narration: >
      Claude Code က skills folder တွေကို စောင့်ကြည့်နေတာမို့ skill ကို ထည့်တာ၊ ပြင်တာက လက်ရှိ session
      ထဲမှာပဲ restart မလုပ်ဘဲ သက်ရောက်ပါတယ်။ ဒါပေမဲ့ Billing မှာ skills folder ကိုယ်တိုင်က အသစ် ဖြစ်နေရင်တော့
      recent version တွေမှာ reload skills command ကို တစ်ခါ run ပေးဖို့ လိုပါတယ်။
      [[mark:l-title]] skill တကယ် ရောက်မရောက်ကို skills command နဲ့ စစ်လို့ ရပါတယ်။ ဒီ screen မှာ Billing repository
      ထဲမှာ skills command ကို ဖွင့်ထားတာကို ဒီလို မြင်ရပါတယ်။ project၊ user နဲ့ plugin ကလာတဲ့ skill တွေကို
      စာရင်းပြပါတယ်။
      [[mark:l-skill]] ဒီမှာ outage notice skill တစ်ခုပဲ ရှိပြီး၊ ဖွင့်ထားတဲ့ အမှန်ခြစ်နဲ့ မြင်ရပါတယ်။
      [[mark:l-scope]] ဘေးက project ဆိုတာ repository ထဲက skill ဖြစ်ကြောင်း ပြတာပါ။ token အရေအတွက် ခန့်မှန်းချက်ကိုလည်း
      ပြထားပြီး၊ skill များလာရင် token အလိုက် စီကြည့်လို့ ရပါတယ်။ Claude က skill ကို မသုံးဘူး ထင်ရရင် ပထမဆုံး
      ကြည့်ရမယ့် နေရာက ဒီ စာရင်းပါ။
    sources:
      - {
          title: "Claude Code Docs: Commands (skills)",
          url: "https://code.claude.com/docs/en/commands",
        }
      - {
          title: "Claude Code Docs: Extend Claude with skills (live change detection)",
          url: "https://code.claude.com/docs/en/skills",
        }
    actions:
      - {
          id: show-skills,
          type: slide.show,
          at: { mark: l-title, offsetMs: -1200 },
          slideId: skills-screen,
        }
      - {
          id: point-l-title,
          type: slide.point,
          at: { mark: l-title },
