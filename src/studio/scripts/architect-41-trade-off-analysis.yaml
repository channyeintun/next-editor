  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ analysis ပြီးပါပြီ။ အခု အောင်အောင် ဆီ ဘာကို ယူသွားမလဲ။
      [[mark:q-a]] ပထမ နည်းက ရွေးစရာ နှစ်ခုရဲ့ ကောင်းကွက်၊ ဆိုးကွက် ၁၂ ချက်လုံးကို စာရင်းလုပ်ပြီး ပြတာပါ။ ဘာမှ မကျန်အောင်
      စဉ်းစားထားကြောင်း မြင်ရပါတယ်။
      [[mark:q-b]] ဒုတိယ နည်းက မေးခွန်း တစ်ခုတည်း မေးတာပါ။ settlement event တစ်ခုမှ မပျောက်တာနဲ့၊ Booking ကို မထိဘဲ
      consumer အသစ် ထည့်နိုင်တာ၊ ဘယ်ဟာကို ပိုလိုချင်လဲ ဆိုတာပါ။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ မေးခွန်း တစ်ခုတည်း မေးတာပါ။
      [[mark:q-why]] ဘာကြောင့်လဲဆိုတော့ ဆုံးဖြတ်မယ့်သူက business အတွက် ဘယ်ရလဒ်က
      ပိုအရေးကြီးလဲ ဆိုတာကိုတော့ ကိုယ့်ထက် ပိုသိလို့ပါ။ ၁၂ ချက် စာရင်းက သူ့ကို ကိုယ့်နေရာမှာ ဝင်ပြီး analysis
      ပြန်လုပ်ခိုင်းတာနဲ့ အတူတူပါပဲ။
      [[mark:q-why2]] ကျန်တဲ့ အသေးစိတ်တွေကတော့ မပျောက်ပါဘူး။ သူ မေးလာရင် ပြဖို့ မှတ်စုထဲမှာ ရှိနေပါတယ်။
    sources:
      - {
          title: "Software Architecture: The Hard Parts (Ford, Richards, Sadalage, Dehghani)",
          url: "https://oreil.ly/sa-the-hard-parts",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [q-title],
          drawMs: 1200,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 1200 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 1200 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-why,
          type: whiteboard.apply,
          at: { mark: q-why },
          upsertIds: [q-why],
          drawMs: 1200,
        }
      - {
          id: draw-why2,
          type: whiteboard.apply,
          at: { mark: q-why2 },
          upsertIds: [q-why2],
          drawMs: 1200,
        }

  - id: bottom-line
    chapter: မေးခွန်း တစ်ခုတည်းနဲ့ ဆုံးဖြတ်ချက်
    narration: >
      [[mark:bl-close]] ဒါကြောင့် table အောက်မှာ အောင်အောင် အတွက် မေးခွန်းကို ရေးပါမယ်။
      [[mark:type-q]] analysis တစ်ခုလုံးကို ဒီ တစ်ကြောင်းအဖြစ် ချုံ့လိုက်တာပါ။ နှစ်ဖက်လုံးက နည်းပညာ စကား မဟုတ်ဘဲ business
      ရလဒ် ဖြစ်နေတာကို သတိထားကြည့်ပါ။
      [[mark:answer]] အောင်အောင် ရဲ့ အဖြေက မြန်ပါတယ်။ ကားလိုင်းကို ငွေလျော့ပေးမိတာက ဘယ်လိုမှ လက်မခံနိုင်ပါဘူး။ consumer
      အသစ်ကတော့ တစ်နှစ် နှစ်ခုပဲမို့ စောင့်နိုင်ပါတယ်။
      [[mark:type-d]] ဒီအဖြေနဲ့ဆို ဆုံးဖြတ်ချက်က ရှင်းသွားပါပြီ။ topic ကို ဆက်ထားပြီး၊ ငွေနဲ့ ဆိုင်တဲ့ Settlement
      တစ်ခုတည်းအတွက် queue သီးသန့် ထပ်ထည့်ပါမယ်။ analysis က ရွေးစရာ နှစ်ခုထဲက တစ်ခုကို ရွေးခိုင်းတာ မဟုတ်ဘဲ၊ ဘယ်
      consumer က ဘာလိုလဲ ဆိုတာကို ပြလိုက်တာပါ။ မောင်မောင် နဲ့ Settlement team ကိုလည်း ဒီ table ကိုပဲ ပြပါတယ်။ ဘာကြောင့်
      ဒီလို ဆုံးဖြတ်လဲ ဆိုတာ မြင်ရတော့ နှစ်ဖက်လုံး လက်ခံရ ပိုလွယ်သွားပါတယ်။
      [[mark:type-r]] နောက်ဆုံး တစ်ကြောင်းက ဒီဆုံးဖြတ်ချက်ကို ဘယ်တော့ ပြန်စစ်မလဲ ဆိုတာပါ။ ငွေနဲ့ ဆိုင်တဲ့ consumer အသစ်
      ပေါ်လာရင် အခြေအနေ ပြောင်းသွားပါပြီ။ topic ကို ကြိုက်လို့၊ queue ကို ကြိုက်လို့ ရွေးခဲ့တာ မဟုတ်တဲ့အတွက်၊
      အခြေအနေ ပြောင်းရင် အဖြေလည်း ပြောင်းနိုင်ပါတယ်။
    sources:
      - {
          title: "Software Architecture: The Hard Parts (Ford, Richards, Sadalage, Dehghani)",
          url: "https://oreil.ly/sa-the-hard-parts",
        }
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: bl-close }, open: false }
      - id: type-q
