          target: { assetId: a-book },
        }

  - id: method
    chapter: Analysis အဆင့် သုံးဆင့်
    narration: >
      [[mark:m-open]] analysis လုပ်တဲ့ နည်းက အဆင့် သုံးဆင့်ပါ။
      [[mark:m-1]] ပထမ အဆင့်က ဘာတွေက တစ်ခုနဲ့တစ်ခု ချည်နေလဲ ရှာတာပါ။ ဒီမှာ ချည်နေတာက Booking နဲ့ consumer တွေပါ။
      [[mark:m-2]] ဒုတိယ အဆင့်က ဘယ်လို ချည်နေလဲ ကြည့်တာပါ။ သုံးနေရာမှာ ချည်နေပါတယ်။ Booking က consumer တွေကို
      သိရလား၊ event ရဲ့ ပုံစံကို ဘယ်နှယောက် မျှသုံးလဲ၊ event တစ်ခု ရောက်မရောက်ကို ဘယ်သူ တာဝန်ယူလဲ ဆိုတာပါ။
      [[mark:m-3]] တတိယ အဆင့်က တစ်ခုကို ပြောင်းကြည့်ပြီး ကျန်တာတွေ ဘာဖြစ်လဲ ကြည့်တာပါ။ ဒါကို စိတ်ကူးနဲ့ မလုပ်ဘဲ၊
      ခရီးဖော် မှာ တကယ် ဖြစ်နိုင်တဲ့ scenario လေးခုကို ရွေးစရာ တစ်ခုစီထဲ ဖြတ်ပြေးကြည့်ပါမယ်။
    sources:
      - {
          title: "Software Architecture: The Hard Parts (Ford, Richards, Sadalage, Dehghani)",
          url: "https://oreil.ly/sa-the-hard-parts",
        }
    actions:
      - {
          id: close-options,
          type: whiteboard.apply,
          at: { mark: m-open, offsetMs: -1500 },
          open: false,
        }
      - {
          id: show-method,
          type: slide.show,
          at: { mark: m-open, offsetMs: -1000 },
          slideId: method,
        }
      - { id: point-m1, type: slide.point, at: { mark: m-1 }, target: { x: 0.15, y: 0.43 } }
      - { id: point-m2, type: slide.point, at: { mark: m-2 }, target: { x: 0.15, y: 0.59 } }
      - { id: point-m3, type: slide.point, at: { mark: m-3 }, target: { x: 0.15, y: 0.75 } }

  - id: scenarios
    chapter: Scenario လေးခုနဲ့ စမ်းခြင်း
    narration: >
      [[mark:s-open]] ပထမ scenario က consumer အသစ် တစ်ခု ပေါ်လာတာပါ။ product manager လှလှ ရဲ့ အမှတ်ပေး အစီအစဉ်က လက်မှတ်
      ရောင်းတိုင်း သိချင်ပါတယ်။
      [[mark:s-1]] topic ဆိုရင် အသစ်က လာနားထောင်ရုံပါပဲ။ Booking ကို မထိပါဘူး။ queue သီးသန့်ဆိုရင်တော့ Booking ကို
      ပြင်ပြီး deploy လုပ်ရပါမယ်။
      [[mark:s-2]] ဒုတိယ scenario က consumer တစ်ခု နှေးသွားတာပါ။ queue ကို ထောက်ခံတဲ့ article တွေက queue သီးသန့်ဆိုမှ
      တစ်ခု နှေးတာက ကျန်တာကို မထိဘူးလို့ ဆိုကြပါတယ်။
      [[mark:s-2b]] ဒါပေမဲ့ ခရီးဖော် ရဲ့ event stream မှာ consumer တစ်ခုစီက ကိုယ့်အရှိန်နဲ့ကိုယ် ဖတ်တာမို့၊ topic မှာလည်း
      ကျန်တာကို မထိပါဘူး။ ယေဘုယျ ကောင်းကွက်၊ ဆိုးကွက် စာရင်းက ကိုယ့် အခြေအနေမှာ မမှန်တတ်တာကြောင့်၊ တစ်ချက်စီကို
      ကိုယ့် system ထဲမှာ ပြန်ချိန်ရပါတယ်။
      [[mark:s-3]] တတိယ scenario က settlement အတွက် event တစ်ခုမှ မပျောက်ရဘူး ဆိုတာပါ။ topic မှာ Booking က ဘယ်သူတွေ
      နားထောင်နေလဲ မသိတာမို့၊ Settlement ဘက်က event တစ်ခုကို မဖတ်မိခဲ့ရင် Booking ဘက်က သိစရာ မရှိပါဘူး။ Settlement
      ကိုယ်တိုင် မစစ်ထားရင် တနင်္လာနေ့ ငွေရှင်းတဲ့အထိ မသိဘဲ ကျန်နိုင်ပါတယ်။
      [[mark:s-3b]] queue သီးသန့်ဆိုရင်တော့ အဲဒီ queue တစ်ခုတည်းကို စောင့်ကြည့်ပြီး alarm ထားလို့ ရပါတယ်။
      [[mark:s-4]] စတုတ္ထ scenario က event ရဲ့ ပုံစံ ပြောင်းတာပါ။ topic မှာ ပုံစံ တစ်ခုတည်းကို အားလုံး မျှသုံးတာမို့
      ပြောင်းတိုင်း consumer အားလုံးကို ထိနိုင်ပါတယ်။
      [[mark:s-4b]] queue သီးသန့်မှာတော့ လိုတဲ့သူရဲ့ ပုံစံကိုပဲ ပြောင်းရပါတယ်။
      [[mark:s-sum]] ကြည့်လိုက်ရင် ဘယ်ရွေးစရာကမှ အားလုံးမှာ မနိုင်ပါဘူး။ trade off analysis ရဲ့ ရလဒ်က အနိုင်ရသူ
      မဟုတ်ဘဲ၊ ဘာကို ရဖို့ ဘာကို ပေးရမလဲ ဆိုတဲ့ ပုံပါ။
    sources:
      - {
          title: "Software Architecture: The Hard Parts (Ford, Richards, Sadalage, Dehghani)",
          url: "https://oreil.ly/sa-the-hard-parts",
        }
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - { id: close-method, type: slide.close, at: { mark: s-open } }
      - {
          id: draw-s-open,
          type: whiteboard.apply,
          at: { afterAction: close-method },
          open: true,
          clear: true,
          upsertIds: [m-h1, m-h2, m-r1],
          drawMs: 1500,
        }
      - {
          id: draw-s-1,
          type: whiteboard.apply,
          at: { mark: s-1 },
          upsertIds: [m-c11, m-c12],
          drawMs: 1500,
        }
      - {
          id: draw-s-2,
          type: whiteboard.apply,
          at: { mark: s-2 },
          upsertIds: [m-r2, m-c22],
          drawMs: 1500,
        }
      - {
          id: draw-s-2b,
          type: whiteboard.apply,
          at: { mark: s-2b, offsetMs: 4000 },
          upsertIds: [m-c21],
          drawMs: 900,
        }
      - { id: draw-s-3, type: whiteboard.apply, at: { mark: s-3 }, upsertIds: [m-r3], drawMs: 900 }
      - {
          id: draw-s-3a,
          type: whiteboard.apply,
          at: { mark: s-3, offsetMs: 6000 },
          upsertIds: [m-c31],
          drawMs: 1000,
        }
      - {
          id: draw-s-3b,
          type: whiteboard.apply,
          at: { mark: s-3b },
          upsertIds: [m-c32],
          drawMs: 1000,
        }
      - {
          id: draw-s-4,
          type: whiteboard.apply,
          at: { mark: s-4 },
          upsertIds: [m-r4, m-c41],
          drawMs: 1600,
        }
      - {
          id: draw-s-4b,
          type: whiteboard.apply,
          at: { mark: s-4b },
          upsertIds: [m-c42],
          drawMs: 900,
        }

  - id: evidence
    chapter: ကိန်းဂဏန်းနဲ့ ဆင်ခြင်ချက်
    narration: >
      [[mark:t-close]] ဒီ ရလဒ်ကို မှတ်စုထဲ ချရေးတဲ့အခါ column တစ်ခု ထပ်ထည့်ပါမယ်။ အထောက်အထားပါ။
      [[mark:type-1]] ကိန်းဂဏန်း ရှိတဲ့ နေရာမှာ ကိန်းဂဏန်းကို ရေးပါတယ်။ consumer အသစ်က တစ်နှစ်မှာ နှစ်ခုလောက်ပဲ
      ပေါ်ပါတယ်။ consumer နှေးတဲ့ scenario မှာတော့ နှစ်ဖက် တူနေတာမို့၊ ဒီ row က ဆုံးဖြတ်ချက်ကို မပြောင်းတော့ပါဘူး။
      [[mark:type-2]] event ပျောက်တာအတွက်တော့ ယုံရတဲ့ ကိန်းဂဏန်း မရှိပါဘူး။ အရင်တစ်ခါ ဖြစ်ခဲ့တဲ့ အကြောင်းရင်းကို ပြင်ပြီးသားမို့၊
      နောက်တစ်ခါ ဘယ်လောက် ဖြစ်နိုင်လဲ မသိနိုင်ပါဘူး။ မသိတဲ့အခါ ဟန်ဆောင်ပြီး မတပ်ဘဲ၊ ဆင်ခြင်ပြီး
      နှိုင်းထားတာလို့ ရိုးရိုးသားသား ရေးပါတယ်။ event ပုံစံကတော့ မနှစ်က ခြောက်ခါ ပြောင်းခဲ့ပါတယ်။
      [[mark:weigh]] ဘယ်လောက် မကြာခဏ ဖြစ်လဲ ဆိုတာအပြင်၊ ဖြစ်ရင် ဘယ်လောက် နာမလဲ ဆိုတာကိုလည်း တွဲကြည့်ရပါတယ်။ consumer
      အသစ်အတွက် Booking ကို တစ်နှစ် နှစ်ခါ ပြင်ရတာက သက်သာပါတယ်။ settlement event တစ်ခု ပျောက်တာကတော့ ရှားပေမဲ့၊
      ဖြစ်ရင် ကားလိုင်းရဲ့ ယုံကြည်မှုကို ထိပါတယ်။
    sources:
      - {
          title: "Software Architecture: The Hard Parts (Ford, Richards, Sadalage, Dehghani)",
          url: "https://oreil.ly/sa-the-hard-parts",
        }
    actions:
      - { id: close-matrix, type: whiteboard.apply, at: { mark: t-close }, open: false }
      - {
          id: reopen-notebook,
          type: workspace.openFile,
          at: { afterAction: close-matrix },
          path: notebook/41-analysis.md,
        }
      - id: type-1
        type: editor.type
        at: { mark: type-1 }
        cadence: line-by-line
        target: { file: notebook/41-analysis.md, after: "|---|---|---|---|\n" }
        text: "| consumer အသစ် ထပ်လာ | Booking မထိ | Booking ပြင်ပြီး deploy | တစ်နှစ် 2 ခု |\n| consumer တစ်ခု နှေး | ကျန်တာ မထိ | ကျန်တာ မထိ | stream က consumer အလိုက် ဖတ် |\n"
      - id: type-2
        type: editor.type
        at: { mark: type-2 }
        cadence: line-by-line
        target: { file: notebook/41-analysis.md, after: "| stream က consumer အလိုက် ဖတ် |\n" }
        text: "| settlement event မပျောက်ရ | ပျောက်လည်း Booking မသိ | queue အလိုက် စောင့်ကြည့်နိုင် | ကိန်းဂဏန်း မရှိ၊ ဆင်ခြင်ချက် |\n| event ပုံစံ ပြောင်း | consumer အားလုံး ထိ | လိုတဲ့သူပဲ ထိ | မနှစ်က 6 ခါ |\n"
      - id: sel-lost
        type: editor.select
        at: { mark: weigh, offsetMs: 9000 }
        target:
          {
            file: notebook/41-analysis.md,
