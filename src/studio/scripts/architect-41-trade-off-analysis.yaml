build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 8141

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: need
    chapter: Article တွေက အဖြေ မပေးတဲ့ မေးခွန်း
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ service တွေကြား မျှသုံးမယ့် အရာ တစ်ခုစီကို ဘယ်လောက် ပြောင်းလဲ မေးပြီး၊ မျှသုံးနည်းကို
      ရွေးပုံကို လေ့လာခဲ့ပါတယ်။
      [[mark:open-doc]] ပြီးခဲ့တဲ့ lesson အနည်းငယ်မှာ ခွဲမလား ပေါင်းမလား၊ ဘယ်သူ ပိုင်မလဲ၊ မျှမလား ကူးမလား ဆိုတဲ့
      ဆုံးဖြတ်ချက်တွေကို ချခဲ့ပါတယ်။ ဒီနေ့တော့ အဲဒီလို ဆုံးဖြတ်ချက်တွေအတွက် သုံးခဲ့တဲ့ နည်းကိုယ်တိုင်ကို
      ကြည့်ပါမယ်။
      [[mark:sel-question]] ဒီအပတ်ရဲ့ မေးခွန်းက လက်မှတ် တစ်စောင် ရောင်းပြီးတိုင်း Booking က တခြား service တွေကို ဘယ်လို
      အသိပေးမလဲ ဆိုတာပါ။ အခုက event stream ပေါ်က topic တစ်ခုတည်းမှာ ကြေညာပြီး၊ လိုတဲ့သူတိုင်းက လာနားထောင်ပါတယ်။
      [[mark:camps]] Settlement team ကတော့ သူတို့အတွက် queue သီးသန့် လိုချင်ပါတယ်။ event တွေ လွတ်သွားလို့ ကားလိုင်း
      တစ်ခုကို ငွေလျော့ပေးမိခဲ့ဖူးတာကြောင့်၊ နောက်တစ်ခါ မဖြစ်စေချင်လို့ပါ။
      [[mark:camp-2]] Booking team lead မောင်မောင် ကတော့ topic တစ်ခုတည်းကိုပဲ
      ဆက်ထားချင်ပါတယ်။ consumer တိုးတိုင်း Booking ကို မပြင်ချင်လို့ပါ။ နှစ်ဖက်လုံးက ကိုယ့်ဘက်ကို ထောက်ခံတဲ့ article
      တွေကို ပို့လာကြပါတယ်။
      [[mark:cto]] CTO ဖြစ်တဲ့ အောင်အောင် ကတော့ ဘယ်ဟာ မှန်လဲလို့ ကိုယ့်ကို မေးပါတယ်။ ဒါပေမဲ့ ခရီးဖော် ရဲ့ အခြေအနေနဲ့
      ကိုက်တဲ့ အဖြေကို ဘယ် article ကမှ ရေးမထားပါဘူး။ တကယ့် ဆုံးဖြတ်ချက် တော်တော်များများက ဒီလိုပါပဲ။ ဒါကြောင့် trade off
      analysis ကို ကိုယ်တိုင် လုပ်တတ်ဖို့ လိုပါတယ်။ trade off ဆိုတာ တစ်ခု ရဖို့ နောက်တစ်ခုကို လျှော့ပေးရတာပါ။
    sources:
      - {
          title: "Software Architecture: The Hard Parts (Ford, Richards, Sadalage, Dehghani)",
          url: "https://oreil.ly/sa-the-hard-parts",
        }
    actions:
      - {
          id: open-notebook,
          type: workspace.openFile,
          at: { mark: open-doc },
          path: notebook/41-analysis.md,
        }
      - id: sel-question
        type: editor.select
        at: { mark: sel-question }
        target:
          {
            file: notebook/41-analysis.md,
            text: "မေးခွန်း: topic တစ်ခုတည်းမှာ ကြေညာမလား၊ consumer တစ်ခုစီအတွက် queue သီးသန့် ထားမလား",
          }
      - id: sel-queue
        type: editor.select
        at: { mark: camps }
        target: { file: notebook/41-analysis.md, text: "consumer တစ်ခုစီအတွက် queue သီးသန့် ထားမလား" }
      - id: sel-topic
        type: editor.select
        at: { mark: camp-2 }
        target: { file: notebook/41-analysis.md, text: "topic တစ်ခုတည်းမှာ ကြေညာမလား" }
      - id: sel-header
        type: editor.select
        at: { mark: cto }
        target: { file: notebook/41-analysis.md, text: "| Topic တစ်ခု | Queue သီးသန့် |" }

  - id: options
    chapter: ရွေးစရာ နှစ်ခု
    narration: >
      [[mark:a-open]] ပထမဆုံး ရွေးစရာတွေကို တန်းတူ ထားပြီး ဆွဲကြည့်ပါမယ်။
      [[mark:a-topic]] ပထမ ရွေးစရာမှာ Booking က topic တစ်ခုတည်းဆီ event ကို တစ်ခါ ပို့ပါတယ်။ topic ဆိုတာ
      စိတ်ဝင်စားသူတိုင်း လာနားထောင်လို့ရတဲ့ လမ်းကြောင်း တစ်ခုပါ။
      [[mark:a-cons]] Notification၊ Settlement နဲ့ နောင်လာမယ့် consumer တွေက အဲဒီ topic ကို နားထောင်ပါတယ်။ consumer
      ဆိုတာ event ကို ယူပြီး ကိုယ့်အလုပ် လုပ်တဲ့ service ပါ။
      [[mark:a-note]] Booking ကတော့ ဘယ်သူတွေ နားထောင်နေလဲ မသိပါဘူး။ ဒါက topic ရဲ့ အားသာချက်လည်း ဟုတ်သလို၊ နောက်မှ
      မြင်ရမယ့် အားနည်းချက်လည်း ဟုတ်ပါတယ်။
      [[mark:b-open]] ဒုတိယ ရွေးစရာမှာတော့ consumer တစ်ခုစီအတွက် queue တစ်ခုစီ ထားပါတယ်။ queue ဆိုတာ လက်ခံသူ
      တစ်ယောက်တည်းအတွက် တန်းစီထားတဲ့ message တွေပါ။
      [[mark:b-q]] Booking က Notification အတွက် တစ်ခု၊ Settlement အတွက် တစ်ခု ဆိုပြီး queue တစ်ခုစီထဲ သီးခြား
      ထည့်ပေးပါတယ်။
      [[mark:b-new]] consumer အသစ် တစ်ခု ပေါ်လာရင် queue အသစ် တစ်ခုနဲ့၊ Booking ထဲမှာ ပို့တဲ့ code အသစ် လိုပါတယ်။
      [[mark:b-fair]] နှိုင်းယှဉ်တဲ့အခါ စည်းကမ်း နှစ်ခု ရှိပါတယ်။ အမျိုးအစား တူတာချင်း နှိုင်းရပါမယ်။ ဒီ နှစ်ခုလုံးက
      message broker တစ်ခုတည်းပေါ်က ပုံစံ နှစ်မျိုးပါ။ ပြီးတော့ တကယ် ဖြစ်နိုင်တဲ့ ရွေးစရာ အားလုံး ပါရပါမယ်။ တတိယ
      ရွေးစရာ ဖြစ်တဲ့ service တစ်ခုစီကို တိုက်ရိုက် လှမ်းခေါ်တာကိုတော့၊ SMS နှေးလို့ လက်မှတ် ဝယ်တာပါ
      နှေးခဲ့ဖူးတာကြောင့် ကြိုဖယ်ထားပါတယ်။
      [[mark:b-nofav]] ကိုယ်တိုင်ကလည်း ဘယ်ဘက်ကိုမှ ကြိုမရွေးထားရပါဘူး။ ကြိုက်တဲ့ဘက် ရှိနေရင် analysis က အဲဒီဘက်အတွက်
      အကြောင်းပြချက် ရှာတာပဲ ဖြစ်သွားပါလိမ့်မယ်။
    sources:
      - {
          title: "Software Architecture: The Hard Parts (Ford, Richards, Sadalage, Dehghani)",
          url: "https://oreil.ly/sa-the-hard-parts",
        }
    actions:
      - {
          id: draw-a-open,
          type: whiteboard.apply,
          at: { mark: a-open },
          open: true,
          upsertIds: [a-title, a-book, a-book-l],
          drawMs: 1500,
        }
      - {
          id: draw-a-topic,
          type: whiteboard.apply,
          at: { mark: a-topic },
          upsertIds: [a-arrow, a-topic, a-topic-l],
          drawMs: 1600,
        }
      - {
          id: draw-a-cons,
          type: whiteboard.apply,
          at: { mark: a-cons },
          upsertIds: [a-brace, a-n, a-n-l, a-s, a-s-l, a-new, a-new-l],
          drawMs: 3000,
        }
      - {
          id: draw-a-note,
          type: whiteboard.apply,
          at: { mark: a-note },
          upsertIds: [a-note],
          drawMs: 1300,
        }
      - {
          id: draw-b-open,
          type: whiteboard.apply,
          at: { mark: b-open },
          clear: true,
          upsertIds: [b-title, a-book, a-book-l, a-n, a-n-l, a-s, a-s-l, a-new, a-new-l],
        }
      - {
          id: draw-b-q,
          type: whiteboard.apply,
          at: { mark: b-q },
          upsertIds: [b-q1, b-q-l, b-q2],
          drawMs: 1600,
        }
      - {
          id: draw-b-new,
