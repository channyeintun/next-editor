# SRE from zero, lesson 2: what SRE is (Burmese concept lesson; nothing runs).
#
# Narration is Chan's approved voice script
# docs/sre-course/voice-scripts/sre-02-what-sre-is.md, byte for byte: each
# ⟪…⟫ marker became a [[mark:…]] at the same place. Extra marks sit only at
# existing sentence ends: l02-*-b marks advance to a pacing page (lNN_pMMb, same
# kit), l02-b1-alert/-git/-mdy, l02-b2-users and l02-b3-notice/-tools/-learn/
# -build split a board step so each piece lands as the narration names it,
# l02-ask times the recap question's pause, and l02-b1-afterfire / l02-b3-hub
# only split a long dialog.
#
# The arc: a fee-config typo charges users ten times the fee for 20 minutes
# (cover); Ma Su's inbox sorts what users felt into down, slow and wrong; how
# reliable is enough; board B1 shrinks the incident three ways (how long, how
# often, how wide); hand fix vs engineering fix; board B2, roads not walls;
# board B3 walks the incident round the Padauk reliability loop; this week;
# recap on notes.md.
#
# Board colours (course colour jobs): #1e1e1e ink paints white; blue = the
# thing named (developers, users, stations); green = healthy or done;
# red = failure; orange = the tools note; violet = flow and rollout order.
# Board B3 re-shows lesson 1's loop in lesson 1's colours (violet ring and
# arrows, blue stations, green people in the hub), compressed to the left so
# the tools note fits beside သတိထားမိ. Station boxes are filled #ffffff, which
# inverts to the canvas colour and hides the ring line behind their labels.
#
# Deck pages live in deck "Next Editor · SRE 1 · Why SRE"; the deckUrl is a
# placeholder until Chan publishes the deck (the Director's unreachable-deck
# warning is expected until then). Page text: sre-course/work/pages/sre-02-what-sre-is.json.
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/sre-02-what-sre-is.yaml
#   bun scripts/studio-compile-check.ts src/studio/scripts/sre-02-what-sre-is.yaml
