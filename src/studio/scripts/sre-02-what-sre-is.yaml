build:
  # Studio swaps in the Burmese voice (AthanLab or VoxCPM2) in the render
  # console; scripts keep pinning a built-in profile.
  voiceProfile: pocket-alba-v1
  seed: 2602

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: hook
    chapter: မိနစ် 20 ကြာ ဝန်ဆောင်ခ 10 ဆ
    narration: >
      [[mark:l02-cover]] ပြီးခဲ့တဲ့ lesson မှာ Padauk က ဖြတ်လမ်း အကြွေး စာရင်း ရေးခဲ့ပြီး၊ မသီရိကလည်း
      Top-up အလုပ်ဘေးမှာ reliability ကိုပါ ကြည့်ပေးဖို့ တာဝန်ယူခဲ့ပါတယ်။ ညတစ်ညမှာတော့ engineer
      တစ်ယောက်က code မပြင်ဘဲ ဝန်ဆောင်ခ နှုန်းတွေကို ပြောင်းလို့ရတဲ့ config ကို ပြင်ရင်း သုည တစ်လုံး
      ပိုရိုက်မိသွားပါတယ်။ အဲဒီ config က ဘယ်သူမှ မစစ်ဘဲ ရန်ကုန်ရော မန္တလေးပါ တစ်ခါတည်း ရောက်သွားတော့၊
      မိနစ် 20 လုံးလုံး user တွေ ဝန်ဆောင်ခ 10 ဆ ပေးခဲ့ရပါတယ်။ [[mark:l02-cover-b]] လူအများစုက ဘယ်သူ
      မှားတာလဲလို့ အရင် မေးကြပေမဲ့၊ ဒီ lesson မှာတော့ ဘာကို အရင်ဆုံး ပြင်မလဲ မေးပါမယ်။ အဲဒီ အဖြေကနေ
      Site Reliability Engineering၊ အတိုကောက် SRE ဆိုတာ ဘာလဲ နားလည်လာပါလိမ့်မယ်။
    sources:
      - title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading"
        url: "https://sre.google/books/"
      - title: "SRE book, 1st ed: Introduction"
        url: "https://sre.google/sre-book/introduction/"
    actions:
      # -1750, not the skeleton's -1900: a pull-back past 1780 ms delays the first
      # dialog beyond the 2000 ms opening handle the registry test pins.
      - { id: collapse-dock, type: runtime.collapseDock, at: { scene: start, offsetMs: -1750 } }
      - {
          id: show-cover,
          type: slide.show,
          at: { mark: l02-cover, offsetMs: -1450 },
          slideId: l02-p01,
        }
      - { id: show-cover-b, type: slide.show, at: { mark: l02-cover-b }, slideId: l02-p01b }

  - id: inbox
    chapter: user ခံစားရတဲ့ reliability
    narration: >
      [[mark:l02-inbox]] ပြဿနာကို ပထမဆုံး သိတာက engineer တွေ မဟုတ်ဘဲ customer support ကို ဦးဆောင်တဲ့
      မစုပါ။ မစုက ဒီလ ရောက်လာတဲ့ complaint တွေကို သုံးစု ခွဲလိုက်ပါတယ်။ top-up မဝင်တာက ပျက်နေတာ၊
      စက္ကန့် 40 စောင့်ရတာက နှေးနေတာ၊ ဝန်ဆောင်ခ 10 ဆ ပေးလိုက်ရတာကတော့ မှားနေတာပါ။ [[mark:l02-inbox-b]]
      ဝန်ဆောင်ခ မှားနေတဲ့ အချိန်မှာတောင် server တွေကတော့ config အတိုင်း ကောင်းကောင်း
      အလုပ်လုပ်နေခဲ့ပါတယ်။ ဒါကြောင့် reliability ကို server တွေဘက်ကနေ မတိုင်းဘဲ user တွေ ခံစားရတာနဲ့
      တိုင်းရပါတယ်။ ဒီလို ညမျိုးမှာ feature အသစ်တွေကို ဘယ်သူမှ ဂရုမစိုက်ပါဘူး၊ ဒါကြောင့် reliability က
      အရေးအကြီးဆုံး feature ဖြစ်နေတတ်ပါတယ်။
    sources:
      - title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading"
        url: "https://sre.google/books/"
      - title: "SRE book, 1st ed: Introduction"
        url: "https://sre.google/sre-book/introduction/"
      - title: "Prodverbs"
        url: "https://sre.google/prodverbs/"
    actions:
      - { id: show-inbox, type: slide.show, at: { mark: l02-inbox }, slideId: l02-p02 }
      - { id: show-inbox-b, type: slide.show, at: { mark: l02-inbox-b }, slideId: l02-p02b }

  - id: enough
    narration: >
      [[mark:l02-enough]] နောက်နေ့မှာ product manager မနှင်းက အရာအားလုံးကို 100 ရာခိုင်နှုန်း
      စိတ်ချရအောင် လုပ်ရမှာလားလို့ မေးပါတယ်။ မသီရိကတော့ ကြော်ငြာပုံ တစ်မိနစ် ပျက်လည်း ရပေမဲ့ wallet
      balance က တစ်မိနစ်တောင် မှားလို့ မရဘူး၊ ဒါကြောင့် ကြော်ငြာပုံကို နည်းနည်း ကာကွယ်ရုံနဲ့ ရပြီး
      balance ကိုတော့ တကယ် အားစိုက်ရမယ်လို့ ဖြေပါတယ်။ ပစ်မှတ်က 100 ရာခိုင်နှုန်း မဟုတ်ဘဲ ဒီအသုံးအတွက်
      လုံလောက်တဲ့ reliability ပါ။ [[mark:l02-enough-b]] SRE ဆိုတာ ဒီလို ချိန်ဆတဲ့ အလုပ်နယ်ပယ်ကိုရော၊
      လုပ်တဲ့ engineer ကိုရော၊ အဖွဲ့ကိုရော ဆိုလိုနိုင်ပါတယ်။ feature deadline တွေကြားမှာ reliability က
      နောက်ကျ ကျန်တတ်လို့ အလုပ် စီစဉ်တဲ့အခါ သူ့ဘက်က အမြဲ ပြောပေးမယ့်သူ လိုပါတယ်။ ဒါပေမဲ့ SRE က 100
      ရာခိုင်နှုန်းကို မလိုက်ဘဲ ဘယ်လောက်ဆို လုံလောက်လဲ အဖွဲ့တိုင်း စဉ်းစားတတ်တဲ့ ယဉ်ကျေးမှုကို
      သင်ပေးပါတယ်။
    sources:
      - title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading"
        url: "https://sre.google/books/"
      - title: "SRE book, 1st ed: Introduction"
        url: "https://sre.google/sre-book/introduction/"
      - title: "Workbook: How SRE Relates to DevOps"
        url: "https://sre.google/workbook/how-sre-relates/"
    actions:
      - { id: show-enough, type: slide.show, at: { mark: l02-enough }, slideId: l02-p03 }
      - { id: show-enough-b, type: slide.show, at: { mark: l02-enough-b }, slideId: l02-p03b }

  - id: shrink
    chapter: incident ကို သေးအောင် လုပ်နည်း
    narration: >
      [[mark:l02-shrink-close]] ဝန်ဆောင်ခ typo လို user တွေကို ထိခိုက်နေလို့ ချက်ချင်း
      ဝိုင်းဖြေရှင်းရတဲ့ ပြဿနာကို incident လို့ ခေါ်ပါတယ်။ [[mark:l02-b1-long]] incident ရဲ့ impact၊
      ဆိုလိုတာက user တွေ ထိခိုက်ရတာဟာ ဘယ်လောက် ကြာလဲ၊ ဘယ်နှခါ ဖြစ်လဲ၊ ဘယ်လောက် ကျယ်လဲ ဆိုတဲ့ သုံးခုကို
      မြှောက်ထားသလိုပါပဲ။ ဒါကြောင့် incident တွေကို ပိုတိုအောင်၊ ပိုနည်းအောင်၊ ပိုသေးအောင် လုပ်ရင်
      impact လျော့သွားပါတယ်။ ပထမက ဘယ်လောက် ကြာလဲ ဆိုတာပါ။ မိနစ် 20 ထဲက အများစုက ဘယ်သူမှ မသိသေးတဲ့
      အချိန်ပါ၊ သိပြီးတော့ rollback လုပ်တာက 3 မိနစ်ပဲ ကြာပါတယ်။ [[mark:l02-b1-alert]] ဒါကြောင့်
      ဝန်ဆောင်ခ ပုံမှန် မဟုတ်တာနဲ့ တက်မယ့် ဝန်ဆောင်ခ alert တစ်ခု ထည့်လိုက်ပါတယ်၊ alert ဆိုတာ လူ
      ဝင်ကြည့်ဖို့ လိုပြီလို့ system က အလိုအလျောက် သတိပေးတာပါ။ နောက်တစ်ခါဆို 3 မိနစ်လောက်နဲ့
      ပြီးနိုင်ပါတယ်။ [[mark:l02-b1-often]] ဒုတိယက ဘယ်နှခါ ဖြစ်လဲ ဆိုတာပါ။ typo ကို ပြင်ရုံနဲ့
      မလုံလောက်ပါဘူး၊ နောက်တစ်ယောက် ထပ်မှားနိုင်လို့ပါ။ [[mark:l02-b1-git]] ဒါကြောင့် config ကို Git
      ထဲ သိမ်းပြီး ဝန်ဆောင်ခ နှုန်း ရုတ်တရက် အများကြီး ပြောင်းရင် ငြင်းမယ့် check တစ်ခု
      ထည့်လိုက်ပါတယ်။ ဒါက incident တစ်ခုကို ပြင်တာ မဟုတ်ဘဲ ဒီလို အမှားမျိုး တစ်ခုလုံး ထပ်မဖြစ်အောင်
      ပိတ်လိုက်တာပါ။ [[mark:l02-b1-afterfire]] ဒီလို ပြင်ဆင်မှုတွေကို incident ငြိမ်ပြီးမှ လုပ်ရပေမဲ့
      ရေရှည် အကျိုး အများဆုံး ပေးတာ ဒီ အပိုင်းပါ။ ဒါကြောင့် ပြဿနာ တက်ရင် ချက်ချင်း တုံ့ပြန်ဖို့
      on-call ကျနေရတာရဲ့ တန်ဖိုးက ပြေးပြင်ရတာ ကိုယ်တိုင် မဟုတ်ဘဲ system မှာ ဘာ ပြင်ဖို့ လိုလဲ
      သိလာရတာပါ။ [[mark:l02-b1-wide]] တတိယက ဘယ်လောက် ကျယ်လဲ ဆိုတာပါ။ အခု config အသစ်ကို မြို့တိုင်း
      တစ်ပြိုင်နက် မပို့တော့ဘဲ ရန်ကုန်မှာ အရင် ဖြန့်ပြီး အဆင်ပြေမှ မန္တလေးကို ဆက်ဖြန့်ပါတယ်။ တစ်ခုခု
      မှားရင် ထိခိုက်မယ့် နယ်ပယ်ကို blast radius လို့ ခေါ်ပြီး၊ ပြဿနာ တစ်ခုတည်းကြောင့် အတူတူ
      ပျက်နိုင်တဲ့ အုပ်စုကို failure domain လို့ ခေါ်ပါတယ်။ [[mark:l02-b1-mdy]] ရန်ကုန်ကို failure
      domain တစ်ခုလို ခွဲထားလို့ blast radius က မန္တလေးအထိ မရောက်တော့ပါဘူး။ ပြဿနာ တက်ရင် ကြော်ငြာလို
      အပို feature တွေကို ပိတ်ပြီး ငွေပေးချေတာကိုတော့ ဆက်ရနေအောင် ထားတာကလည်း blast radius ကို
      ကျဉ်းစေပါတယ်။
    sources:
      - title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading"
        url: "https://sre.google/books/"
      - title: "SRE book, 1st ed: Introduction"
        url: "https://sre.google/sre-book/introduction/"
      - title: "Prodverbs"
        url: "https://sre.google/prodverbs/"
    actions:
      - { id: close-enough, type: slide.close, at: { mark: l02-shrink-close } }
      - id: draw-long
        type: whiteboard.apply
        at: { mark: l02-b1-long }
        open: true
        clear: true
        upsertIds: [l02-b1-long-title, l02-b1-long-bar, l02-b1-long-label]
        drawMs: 1800
      - id: draw-alert
        type: whiteboard.apply
        at: { mark: l02-b1-alert }
        upsertIds: [l02-b1-short-bar, l02-b1-short-label]
        drawMs: 1400
      - id: draw-often
        type: whiteboard.apply
        at: { mark: l02-b1-often }
        clear: true
        upsertIds:
          [
            l02-b1-often-title,
            l02-b1-dot-1,
            l02-b1-dot-2,
            l02-b1-dot-3,
            l02-b1-dot-4,
            l02-b1-dot-5,
            l02-b1-dot-6,
            l02-b1-dot-7,
            l02-b1-dot-8,
          ]
        drawMs: 1800
      - id: draw-git
        type: whiteboard.apply
        at: { mark: l02-b1-git }
        upsertIds: [l02-b1-often-arrow, l02-b1-often-label, l02-b1-few-1, l02-b1-few-2]
        drawMs: 2000
      - id: draw-wide
        type: whiteboard.apply
        at: { mark: l02-b1-wide }
        clear: true
        upsertIds: [l02-b1-wide-title, l02-b1-ygn-box, l02-b1-ygn-label, l02-b1-first-label]
        drawMs: 2000
      - id: draw-mandalay
        type: whiteboard.apply
        at: { mark: l02-b1-mdy }
        upsertIds: [l02-b1-wide-arrow, l02-b1-mdy-box, l02-b1-mdy-label]
        drawMs: 1600

  - id: engineering
    chapter: SRE ဘယ်လို အလုပ်လုပ်လဲ
    narration: >
      [[mark:l02-eng-close]] incident ပြီးလို့ ပြန်ဆွေးနွေးတော့ တစ်ယောက်က နောက်ဆို
      ပိုသတိထားကြရအောင်လို့ ပြောပါတယ်။ [[mark:l02-hand]] ဒါက ဘယ်ဘက်က လက်နဲ့ ပြင်တဲ့ နည်းပါ။ ပြဿနာ
      ဖြစ်တိုင်း လူက ဝင်ပြင်ရလို့ အလုပ်များလာရင် လူ ထပ်လိုပြီး၊ ရလဒ်ကလည်း ဘယ်သူ နိုးနေလဲ ဆိုတာအပေါ်
      မူတည်နေပါတယ်။ ညာဘက်က engineering နဲ့ ပြင်တဲ့ နည်းကတော့ ပြဿနာ ဘာကြောင့် ဖြစ်လဲ နားလည်ပြီး ခုနက
      check လို system ကို တစ်ခါတည်း ပြောင်းလိုက်တာပါ။ [[mark:l02-hand-b]] လူ လက်နဲ့ လုပ်ရတာကို
      software က အစား လုပ်ပေးတဲ့ automation ကနေ အကျိုး နှစ်မျိုး ရပါတယ်။ အချိန် သက်သာလို့
      အလုပ်များလာလည်း လူ လိုက်တိုးစရာ မလိုသလို၊ ပင်ပန်းနေတဲ့ လူလို မမှားဘဲ အမြဲ တစ်ပုံစံတည်း
      လုပ်ပေးပါတယ်။ ပြီးခဲ့တဲ့ lesson က တနင်္လာနေ့တိုင်း လက်နဲ့ တိုက်စစ်ရတာလို၊ ထပ်ခါထပ်ခါ လုပ်ရပြီး
      ရေရှည် တန်ဖိုး မကျန်ခဲ့တဲ့ အလုပ်ကို toil လို့ ခေါ်ပါတယ်၊ နောက် lesson မှာ ဆက်ကြည့်ပါမယ်။
    sources:
      - title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading"
        url: "https://sre.google/books/"
      - title: "SRE book, 1st ed: Introduction"
        url: "https://sre.google/sre-book/introduction/"
    actions:
      - { id: close-board-b1, type: whiteboard.apply, at: { mark: l02-eng-close }, open: false }
      - { id: show-hand, type: slide.show, at: { mark: l02-hand }, slideId: l02-p04 }
      - { id: show-hand-b, type: slide.show, at: { mark: l02-hand-b }, slideId: l02-p04b }

  - id: roads
    narration: >
      [[mark:l02-roads-close]] ဆွေးနွေးပွဲမှာ နောက်ထပ် အကြံ တစ်ခုကတော့ config ပြောင်းတိုင်း မသီရိဆီက
      ခွင့်ပြုချက် အရင် ယူရမယ် ဆိုတာပါ။ [[mark:l02-b2-wall]] ဘေးကင်းသလို ထင်ရပေမဲ့ မသီရိက developer
      အားလုံးရဲ့ ရှေ့မှာ မရဘူးလို့ တားတဲ့ နံရံ ဖြစ်သွားပြီး၊ သူ မအားတဲ့နေ့ဆို အားလုံး ရပ်စောင့်ရမှာပါ။
      [[mark:l02-b2-road]] ဒါကြောင့် မသီရိက ခွင့်ပြုချက် ပေးမယ့်အစား ဘေးကင်းတဲ့ လမ်း တစ်ခု
      ဖောက်ပေးပါတယ်၊ ခုနက ရန်ကုန်မှာ အရင် rollout လုပ်တဲ့ လမ်းပါ။ [[mark:l02-b2-users]] config အသစ်
      မှန်သမျှ ဒီလမ်းကို အလိုအလျောက် ဖြတ်သွားလို့ ဘယ်သူ့ကိုမှ မစောင့်ဘဲ မြန်မြန်ရော ဘေးကင်းကင်းပါ user
      တွေဆီ ရောက်ပါတယ်။ SRE က developer တွေကို တားတဲ့ဘက်က မဟုတ်ဘဲ သူတို့နဲ့ အတူ လုပ်တဲ့ဘက်ကပါ။ ဒီလို
      လုပ်ဖို့ SRE အဖွဲ့ ရှိစရာ မလိုပါဘူး၊ Padauk မှာလည်း ဒီ ပြင်ဆင်မှု သုံးခုလုံးကို developer တွေ
      ကိုယ်တိုင် လုပ်ခဲ့ကြတာပါ။
    sources:
      - title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading"
        url: "https://sre.google/books/"
      - title: "Workbook: How SRE Relates to DevOps"
        url: "https://sre.google/workbook/how-sre-relates/"
    actions:
      - { id: close-hand, type: slide.close, at: { mark: l02-roads-close } }
      - id: draw-wall
        type: whiteboard.apply
        at: { mark: l02-b2-wall }
        open: true
        clear: true
        upsertIds:
          [l02-b2-dev1-box, l02-b2-dev1-label, l02-b2-arrow1, l02-b2-wall, l02-b2-wall-label]
        drawMs: 2000
      - id: draw-road
        type: whiteboard.apply
        at: { mark: l02-b2-road }
        upsertIds:
          [
            l02-b2-dev2-box,
            l02-b2-dev2-label,
            l02-b2-arrow2,
            l02-b2-road-box,
            l02-b2-road-label-1,
            l02-b2-road-label-2,
          ]
        drawMs: 2200
      - id: draw-users
        type: whiteboard.apply
        at: { mark: l02-b2-users }
        upsertIds: [l02-b2-arrow3, l02-b2-users-box, l02-b2-users-label]
        drawMs: 1400

  - id: loop
    chapter: Padauk ရဲ့ reliability loop
    narration: >
      [[mark:l02-loop-close]] ဒါဆို ဒီ incident ကို Padauk ရဲ့ reliability loop ပေါ်မှာ
      ပတ်ကြည့်ရအောင်။ [[mark:l02-b3-loop]] lesson 1 က ဒီ စက်ဝိုင်းကို incident တိုင်း ပတ်ရပါတယ်။
      ဘယ်လောက် စိတ်ချရရင် လုံလောက်လဲ သဘောတူတယ်၊ user ထိခိုက်နေတာကို သတိထားမိတယ်၊ တုံ့ပြန်တယ်၊
      သင်ယူတယ်၊ ပြီးတော့ သင်ခန်းစာကို system ထဲ ထည့်တည်ဆောက်တယ်။ [[mark:l02-b3-hub]] အဆင့်တိုင်းမှာ
      လူနဲ့ နည်းပညာ အတူတူ ပါလို့ အလယ်မှာ လူတွေ ရှိပါတယ်။ ဂရုမစိုက်ရင် reliability က တဖြည်းဖြည်း
      ပြန်ကျသွားတတ်လို့ ဒီ loop က ဘယ်တော့မှ မရပ်ပါဘူး။ နောက်ပိုင်းမှာ AI ကလည်း run ရမယ့် system
      အနေနဲ့ရော၊ ကူညီမယ့် tool အနေနဲ့ရော loop ပေါ် ရောက်လာပါမယ်။ [[mark:l02-b3-agree]] သဘောတူတဲ့
      အဆင့်မှာ Padauk က ဝန်ဆောင်ခ အမြဲ ပုံမှန် ဖြစ်ရမယ်လို့ စာနဲ့ ရေးပြီး သဘောတူပါတယ်။
      [[mark:l02-b3-notice]] သတိထားမိတဲ့ အဆင့်မှာ ဒီတစ်ခါ မစုရဲ့ complaint တွေက alert အစား ဖြစ်ခဲ့ပေမဲ့
      နောက်ဆို ဝန်ဆောင်ခ alert က user တွေ မတိုင်ခင် သတိပေးပါမယ်။ [[mark:l02-b3-tools]] ဘေးက SLO လို ပစ်မှတ်တွေ၊ alert၊ dashboard၊ log
      နဲ့ trace တွေက production ထဲ ဘာဖြစ်နေလဲ မြင်ရအောင် ကူညီတဲ့ tool တွေပါ၊ Module 2 မှာ လေ့လာပါမယ်။
      အရင်က production ကျန်းမာဖို့ဆိုတာ ပြဿနာ တက်မှ ပြေးပြင်တာ ဖြစ်ခဲ့ပေမဲ့ အခုတော့ အများစုက design
      ကောင်းတာနဲ့ ကြိုပြင်ထားတာကနေ လာပါတယ်။ [[mark:l02-b3-respond]] တုံ့ပြန်တဲ့ အဆင့်မှာ 3 မိနစ်နဲ့
      rollback လုပ်ခဲ့ပါတယ်။ [[mark:l02-b3-learn]] သင်ယူတဲ့ အဆင့်မှာတော့ ဘာဖြစ်ခဲ့လဲ စာနဲ့ ရေးပြီး
      အဖွဲ့လိုက် သင်ယူပါတယ်၊ ဒါကို postmortem လို့ ခေါ်ပါတယ်။ သုည ပိုရိုက်မိခဲ့တဲ့ engineer ကိုယ်တိုင်လည်း postmortem ကို
      ဝင်ရေးပါတယ်၊ ဘယ်သူ့ အပြစ်လဲ မရှာဘဲ system ထဲက အားနည်းချက်ကို ရှာတာမို့ သူ ကြောက်စရာ မလိုပါဘူး။
      [[mark:l02-b3-build]] တည်ဆောက်တဲ့ အဆင့်မှာ config check နဲ့ ရန်ကုန်မှာ အရင် ဖြန့်တဲ့ လမ်းကို
      system ထဲ အပြီး ထည့်လိုက်ပါတယ်။ ရေရှည် reliability က လူတစ်ယောက်ချင်း သတိရဖို့ကို အားကိုးလို့
      မရဘဲ tool တွေနဲ့ အဖွဲ့အစည်းထဲ ထည့်ထားမှ ရတာပါ။ ဒါကို lesson 25 မှာ ကြည့်ပါမယ်။
    sources:
      - title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading"
        url: "https://sre.google/books/"
      - title: "Workbook: How SRE Relates to DevOps"
        url: "https://sre.google/workbook/how-sre-relates/"
      - title: "SRE book, 1st ed: Introduction"
        url: "https://sre.google/sre-book/introduction/"
    actions:
      - { id: close-board-b2, type: whiteboard.apply, at: { mark: l02-loop-close }, open: false }
      # The L01 loop, re-shown as furniture: no drawMs.
      - id: show-loop
        type: whiteboard.apply
        at: { mark: l02-b3-loop }
        open: true
        clear: true
        upsertIds:
          [
            l02-b3-title,
            l02-b3-ring,
            l02-b3-arrow-top,
            l02-b3-arrow-side,
            l02-b3-agree-box,
            l02-b3-agree-label,
            l02-b3-notice-box,
            l02-b3-notice-label,
            l02-b3-respond-box,
            l02-b3-respond-label,
            l02-b3-learn-box,
            l02-b3-learn-label,
            l02-b3-build-box,
            l02-b3-build-label,
            l02-b3-doll-head,
            l02-b3-doll-body,
            l02-b3-doll-label,
          ]
      # Each station's check lands as the narration reaches that station.
      - id: check-agree
        type: whiteboard.apply
        at: { mark: l02-b3-agree }
        upsertIds: [l02-b3-check-agree]
        drawMs: 800
      - id: check-notice
        type: whiteboard.apply
        at: { mark: l02-b3-notice }
        upsertIds: [l02-b3-check-notice]
        drawMs: 800
      - id: draw-tools
        type: whiteboard.apply
        at: { mark: l02-b3-tools }
        upsertIds: [l02-b3-tools-1, l02-b3-tools-2]
        drawMs: 1600
      - id: check-respond
        type: whiteboard.apply
        at: { mark: l02-b3-respond }
        upsertIds: [l02-b3-check-respond]
        drawMs: 800
      - id: check-learn
        type: whiteboard.apply
        at: { mark: l02-b3-learn }
        upsertIds: [l02-b3-check-learn]
        drawMs: 800
      - id: check-build
        type: whiteboard.apply
        at: { mark: l02-b3-build }
        upsertIds: [l02-b3-check-build]
        drawMs: 800

  - id: this-week
    narration: >
      [[mark:l02-week-close]] ဒီ lesson ကနေ ဒီအပတ်ထဲ ချက်ချင်း စမ်းလုပ်လို့ရတာ သုံးခု ရှိပါတယ်။
      [[mark:l02-week]] ပထမ၊ ပြီးခဲ့တဲ့လ complaint တွေကို မစုလိုပဲ ပျက်နေတာ၊ နှေးနေတာ၊ မှားနေတာ
      ဆိုပြီး ခွဲကြည့်ပါ။ ဒုတိယ၊ နောက်ဆုံး ပြင်ခဲ့တဲ့ ပြဿနာမှာ alert တက်တာကနေ ပြင်ပြီးတဲ့အထိ အချိန်
      မှတ်ကြည့်ပါ။ တတိယ၊ loop ထဲက ကိုယ့်အဖွဲ့ အားအနည်းဆုံး အဆင့်ကို ရှာကြည့်ပါ။
    sources:
      - title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading"
        url: "https://sre.google/books/"
      - title: "Prodverbs"
        url: "https://sre.google/prodverbs/"
    actions:
      - { id: close-board-b3, type: whiteboard.apply, at: { mark: l02-week-close }, open: false }
      - { id: show-week, type: slide.show, at: { mark: l02-week }, slideId: l02-p05 }

  - id: recap
    narration: >
      [[mark:l02-recap-close]] [[mark:l02-notes]] အဓိက အချက်တွေကို ပြန်ကြည့်ရအောင်။
      [[mark:l02-sel-felt]] reliability ကို user ခံစားရတဲ့ ပျက်နေတာ၊ နှေးနေတာ၊ မှားနေတာ ဆိုတဲ့
      သုံးမျိုးနဲ့ ကြည့်ပါတယ်။ [[mark:l02-sel-enough]] 100 ရာခိုင်နှုန်းကို မလိုက်ဘဲ ဒီအသုံးအတွက်
      လုံလောက်တဲ့ reliability ကို ရွေးပါတယ်။ [[mark:l02-sel-impact]] incident တွေကို ပိုတိုအောင်၊
      ပိုနည်းအောင်၊ ပိုသေးအောင် လုပ်ရင် impact လျော့ပါတယ်။ [[mark:l02-sel-blast]] ပိုသေးအောင် ဆိုတာ
      မှားရင် ထိခိုက်မယ့် နယ်ပယ်၊ blast radius ကို ကျဉ်းအောင် လုပ်တာပါ။ [[mark:l02-sel-loop]] incident
      တိုင်းက reliability loop ကို တစ်ပတ် ပတ်ရပြီး အလယ်မှာ လူတွေ ရှိပါတယ်။ ကဲ၊ စဉ်းစားကြည့်ပါ။ bug
      တစ်ခုက user 5 ရာခိုင်နှုန်းကို 2 နာရီကြာ ထိခိုက်ခဲ့ပါတယ်။ [[mark:l02-ask]] ဒီလို bug မျိုးကို နောက်တစ်ခါ
      ပိုတိုအောင်၊ ပိုနည်းအောင်၊ ပိုသေးအောင် လုပ်ဖို့ နည်းလမ်း တစ်ခုစီ ပြောနိုင်မလား?
      [[mark:l02-pause]] ဥပမာ user ဘက်က error များလာတာနဲ့ alert တက်အောင် လုပ်ရင် ပိုတိုပါမယ်။ အဲဒီ bug
      မျိုးကို ဖမ်းမယ့် test တစ်ခု ထည့်ရင် ပိုနည်းပြီး၊ ပြောင်းလဲမှုကို user နည်းနည်းဆီ အရင် rollout
      လုပ်ရင် ပိုသေးပါမယ်။ lesson 3 ကိုတော့ နေ့လယ်စာချိန်မှာ ဆိုင်တွေရဲ့ QR ငွေချေတာ 30 မိနစ်
      ပျက်တာနဲ့ စပါမယ်။ တကယ့် ကုန်ကျစရိတ်က 30 မိနစ်စာပဲလား၊ အဲဒီထက် အများကြီး ပိုကြီးလား?
    sources:
      - title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading"
        url: "https://sre.google/books/"
      - title: "SRE book, 1st ed: Introduction"
        url: "https://sre.google/sre-book/introduction/"
      - title: "Workbook: How SRE Relates to DevOps"
        url: "https://sre.google/workbook/how-sre-relates/"
    actions:
      - { id: close-week, type: slide.close, at: { mark: l02-recap-close } }
      - {
          id: open-notes,
          type: workspace.openFile,
          at: { mark: l02-notes, offsetMs: 300 },
          path: notes.md,
        }
      - id: select-felt
        type: editor.select
        at: { mark: l02-sel-felt }
        target: { file: notes.md, text: "ပျက်နေတာ၊ နှေးနေတာ၊ မှားနေတာ", occurrence: 1 }
      - id: select-enough
        type: editor.select
        at: { mark: l02-sel-enough }
        target: { file: notes.md, text: "လုံလောက်တဲ့ reliability", occurrence: 1 }
      - id: select-impact
        type: editor.select
        at: { mark: l02-sel-impact }
        target: { file: notes.md, text: "incident ရဲ့ impact", occurrence: 1 }
      - id: select-blast
        type: editor.select
        at: { mark: l02-sel-blast }
        target: { file: notes.md, text: "blast radius", occurrence: 1 }
      - id: select-loop
        type: editor.select
        at: { mark: l02-sel-loop }
        target: { file: notes.md, text: "reliability loop", occurrence: 1 }
      # The voice script's ⟪pause 3s⟫. An action at l02-pause would run under
      # the answer, so the question-line select hangs off l02-ask (the start of
      # the question sentence) and lands as that sentence ends; the scheduler
      # holds the answer until the drag is done. The scheduler cannot pause after
      # a dialog's end, so the silence depends on the voice's speed: about 2.8 s
      # at 55 ms/char, 1.2 s at 70, none at 95 (where the drag runs under the
      # question's last words). 7650 keeps 55 ms/char under the 2.5 s
      # inserted-silence warning.
      - id: select-question
        type: editor.select
        at: { mark: l02-ask, offsetMs: 7650 }
        target:
          file: notes.md
          text: "မေးခွန်း: bug တစ်ခုက user 5% ကို 2 နာရီ ထိခိုက်ခဲ့တယ်။ နောက်တစ်ခါ ပိုတို၊ ပိုနည်း၊ ပိုသေးအောင် တစ်နည်းစီ ဘာလုပ်မလဲ?"
          occurrence: 1

checks:
  # 500 (not 300): deck pages stall paint briefly at each show/close.
  - { type: timing.p95Ms, max: 500 }
