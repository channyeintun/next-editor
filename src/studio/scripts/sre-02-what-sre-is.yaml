    entryFilePath: notes.md
    sidebarStartsCollapsed: true
    files:
      notes.md: |
        # SRE ဆိုတာ ဘာလဲ

        - ပျက်နေတာ၊ နှေးနေတာ၊ မှားနေတာ — user ခံစားရတဲ့ ပြဿနာ သုံးမျိုး
        - လုံလောက်တဲ့ reliability — 100% မဟုတ်၊ ဒီအသုံးအတွက် လိုသလောက်
        - incident ရဲ့ impact — ဘယ်လောက်ကြာ · ဘယ်နှခါ · ဘယ်လောက်ကျယ်
        - blast radius — မှားရင် ထိခိုက်မယ့် နယ်ပယ်
        - reliability loop — သဘောတူ → သတိထားမိ → တုံ့ပြန် → သင်ယူ → တည်ဆောက်

        မေးခွန်း: bug တစ်ခုက user 5% ကို 2 နာရီ ထိခိုက်ခဲ့တယ်။ နောက်တစ်ခါ ပိုတို၊ ပိုနည်း၊ ပိုသေးအောင် တစ်နည်းစီ ဘာလုပ်မလဲ?
