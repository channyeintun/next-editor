# Accessibility course (Burmese), lesson 12: animation and motion.
#
# Hands-on lesson on the tea-shop page with the accessibility panel in tree
# mode (scope #main). Shape: board (who motion affects: vestibular disorders,
# attention, photosensitive seizures) → board (WCAG: three flashes, PEAT, "is
# the motion essential?", pause/stop/hide after 5 s) → the page: steam rising
# from the cup and a "today's special" banner sliding forever, the tree has no
# control to stop them → insert a "လှုပ်ရှားမှု လျှော့" toggle button with
# aria-pressed (kit.js flips it and toggles a class on <body>), the tree shows
# "not pressed" → type the rule the class switches on (.reduce-motion *
# { animation: none !important }) → click: the motion stops, the button turns
# green, the tree says "pressed", <body> carries the class → board (OS setting
# names, prefers-reduced-motion reduce / no-preference) → type the media query
# honestly (the preview cannot switch the OS setting) → board (progressive
# enhancement, default off, layering with lesson 11's queries) → recap
# pointing at both rules → next: typography.
#
# Start state (base.css section E, never typed, never shown): .wisp steam
# keyframes and the .banner-track slide keyframes, both infinite, both start on
# load. Lesson furniture for the cup, banner and toggle sits in section C.
# Fixes are inserts only: the button (HTML block), the class rule and the
# media query (CSS in styles.css; !important so the user's choice beats every
# animation rule on the page).
#
# Replay: CSS keyframe animations run again in the replay (a seek restarts the
# loops, which is fine); the click is a recorded class + aria-pressed mutation,
# so the stop replays.
#
# Workspace: ws/ pinned byte-exact with tools/pin-files.ts (this file is the
# template; `bun probe/build.ts template.yaml ws <slug>.yaml` builds the YAML).
# Measured at 432 × 720 (smoke.ts): hero 105-328, specials 344-389, drawer top
# 504; the inserted toggle sits at the top of <main>, all above the drawer.
#
# Validate with (from the repo root):
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   ~/Documents/a11y-course-work/tools/verify.sh <this file>
