build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 2612

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  - id: who-is-affected
    chapter: "Motion က ဘယ်သူတွေကို ထိခိုက်လဲ"
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ အရောင်နဲ့ contrast ကို ပြင်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ page ပေါ်မှာ
      လှုပ်ရှားနေတဲ့ အရာတွေ၊ animation နဲ့ motion အကြောင်း ကြည့်သွားပါမယ်။ [[mark:start-server]]
      animation တွေက page ကို အသက်ဝင်စေပေမယ့်၊ တချို့ user တွေအတွက်တော့ တကယ့် အခက်အခဲ
      ဖြစ်စေနိုင်ပါတယ်။ [[mark:draw-vestibular]] ပထမ အုပ်စုက ဟန်ချက်နဲ့ မူးဝေတာဆိုင်ရာ ပြဿနာ၊
      vestibular disorder ရှိသူတွေပါ။ ကား ဒါမှမဟုတ် လှေ စီးရင် ပတ်ဝန်းကျင် လည်နေသလို ခံစားရတာမျိုးပါ။
      screen ပေါ်မှာ ကြီးကြီးမားမား ရွေ့နေတဲ့ အရာတွေက သူတို့ကို မူးဝေပြီး ပျို့အန်ချင်အောင်
      ဖြစ်စေနိုင်ပါတယ်။ [[mark:draw-vest-stat]] အမေရိကန်မှာ လုပ်ခဲ့တဲ့ လေ့လာမှု တစ်ခုအရ၊ အသက် ၄၀ နဲ့
      အထက် လူကြီးတွေရဲ့ ၃၅ ရာခိုင်နှုန်းကျော်မှာ ဟန်ချက် ထိန်းတဲ့ စနစ် ပြဿနာ တစ်မျိုးမျိုး ရှိနေတာ
      တွေ့ရပါတယ်။ [[mark:draw-attention]] ဒုတိယ အုပ်စုက ADHD လို အာရုံ စူးစိုက်ရ ခက်တဲ့ သူတွေပါ။
      မရပ်တမ်း လှုပ်နေတဲ့ animation က သူတို့ရဲ့ အာရုံကို ဆွဲယူသွားလို့၊ website ကို ဘာလုပ်ဖို့ လာခဲ့လဲ
      ဆိုတာတောင် မေ့သွားနိုင်ပါတယ်။ [[mark:draw-seizure]] တတိယ အုပ်စုက အလင်းကြောင့် တက်တတ်တဲ့
      photosensitive epilepsy ရှိသူတွေပါ။ အမှောင်နဲ့ အလင်း မြန်မြန် ပြောင်းနေတဲ့ flashing က သူတို့ကို
      တက်စေနိုင်ပါတယ်။
    sources:
      - title: "web.dev Learn Accessibility — Animation and motion"
        url: "https://web.dev/learn/accessibility/motion"
      - title: "Agrawal et al., Arch Intern Med 2009 — 35.4% of US adults aged 40+ had vestibular dysfunction (NHANES 2001–2004)"
        url: "https://pubmed.ncbi.nlm.nih.gov/19468085/"
      - title: "Vestibular Disorders Association — About vestibular disorders"
        url: "https://vestibular.org/article/what-is-vestibular/about-vestibular-disorders/"
      - title: "Epilepsy Foundation — Photosensitivity and seizures"
        url: "https://www.epilepsy.com/what-is-epilepsy/seizure-triggers/photosensitivity"
    actions:
      - id: open-board-a
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      # Boot + pnpm install + vite run under the two opening boards; the
      # waitForReady sits on the preview mark more than 60 s of narration later.
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-vestibular
        type: whiteboard.apply
        at: { mark: draw-vestibular }
        upsertIds: [a-vest, a-vest-what]
        drawMs: 2400
      - id: draw-vest-stat
        type: whiteboard.apply
        at: { mark: draw-vest-stat }
        upsertIds: [a-vest-stat]
        drawMs: 1400
      - id: draw-attention
        type: whiteboard.apply
        at: { mark: draw-attention }
        upsertIds: [a-attn, a-attn-what]
        drawMs: 2200
      - id: draw-seizure
        type: whiteboard.apply
        at: { mark: draw-seizure }
        upsertIds: [a-seiz, a-seiz-what]
        drawMs: 2200

  - id: wcag-rules
    chapter: "Flashing နဲ့ ငါးစက္ကန့် စည်းကမ်း"
    narration: >
      [[mark:board-rules]] ဒါကြောင့် WCAG မှာ ဒီ ပြဿနာတွေအတွက် အဓိက စည်းကမ်း နှစ်ခု ရှိပါတယ်။
      [[mark:draw-flash]] ပထမ တစ်ခုက flashing ပါ။ ဘယ် တစ်စက္ကန့်အတွင်းမှာမဆို သုံးကြိမ်ထက် ပိုပြီး
      လင်းလိုက် မှိန်လိုက် မဖြစ်ရပါဘူး။ level A ဖြစ်လို့ အနည်းဆုံး လိုက်နာရမယ့် စည်းကမ်းပါ။
      [[mark:draw-peat]] flashing ဒါမှမဟုတ် အလင်း အမှောင် မြန်မြန် ပြောင်းတဲ့ animation တွေ၊ video တွေ
      ပါရင် PEAT လို အခမဲ့ tool နဲ့ စစ်ကြည့်သင့်ပါတယ်။ [[mark:draw-essential]] ပြီးတော့ animation
      တစ်ခု ထည့်တိုင်း၊ ဒီ လှုပ်ရှားမှုက အကြောင်းအရာကို နားလည်ဖို့ တကယ် လိုလား လို့ ကိုယ့်ကိုယ်ကို
      မေးကြည့်ပါ။ မလိုရင် လုံးဝ မထည့်တာ အကောင်းဆုံးပါ။ [[mark:draw-pause]] ထားချင်တယ် ဆိုရင်တော့ ဒုတိယ
      စည်းကမ်း ရှိပါတယ်။ အလိုလို စပြီး ငါးစက္ကန့်ထက် ကြာကြာ လှုပ်နေတဲ့ အရာကို တခြား အကြောင်းအရာတွေနဲ့
      အတူ ပြထားရင်၊ user က ရပ်လို့၊ ခဏ နားလို့ ဒါမှမဟုတ် ဖျောက်လို့ ရရပါမယ်။ ဒါကလည်း level A ပါ။
    sources:
      - title: "web.dev Learn Accessibility — Animation and motion (Flashing and moving content)"
        url: "https://web.dev/learn/accessibility/motion"
      - title: "WCAG 2.2 — Understanding 2.3.1 Three Flashes or Below Threshold"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/three-flashes-or-below-threshold.html"
      - title: "WCAG 2.2 — Understanding 2.2.2 Pause, Stop, Hide"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/pause-stop-hide.html"
      - title: "Trace Center — Photosensitive Epilepsy Analysis Tool (PEAT)"
        url: "https://trace.umd.edu/peat/"
    actions:
      - id: board-rules
        type: whiteboard.apply
        at: { mark: board-rules }
        clear: true
        upsertIds: [b-title]
      - id: draw-flash
        type: whiteboard.apply
        at: { mark: draw-flash }
        upsertIds: [b-flash, b-flash-level]
        drawMs: 2000
      - id: draw-peat
        type: whiteboard.apply
        at: { mark: draw-peat }
        upsertIds: [b-peat]
        drawMs: 1000
      - id: draw-essential
        type: whiteboard.apply
        at: { mark: draw-essential }
        upsertIds: [b-essential, b-essential-line]
        drawMs: 1600
      - id: draw-pause
        type: whiteboard.apply
        at: { mark: draw-pause }
        upsertIds: [b-pause, b-pause-level]
        drawMs: 2200

  - id: first-look
    chapter: "ဆိုင်ရဲ့ page ကို ကြည့်ရအောင်"
    narration: >
      [[mark:close-rules]] ဒါဆို ဆိုင်ရဲ့ page ကို ကြည့်ရအောင်။ [[mark:preview-opens]] ညာဘက်မှာ
      ဆိုင်ရဲ့ page ကို မြင်ရပါပြီ။ လက်ဖက်ရည်ခွက်ပေါ်က အငွေ့လေးတွေက အဆက်မပြတ် တက်နေပြီး၊
      အောက်က ယနေ့အထူး banner ကလည်း ဘယ်ဘက်ကို အမြဲ ရွေ့နေပါတယ်။ page ကို ကြည့်တာနဲ့ အလိုလို
      စပြီး ဘယ်တော့မှ မရပ်ပါဘူး။ [[mark:read-tree]] accessibility panel ကို ကြည့်ပါ။ main ထဲမှာ
      heading နဲ့ ယနေ့အထူး region ပဲ ရှိပြီး၊ ဒီ လှုပ်ရှားမှုကို ရပ်ဖို့ ခလုတ် တစ်ခုမှ မရှိပါဘူး။ ဒါက
      ခုနက ငါးစက္ကန့် စည်းကမ်းကို မလိုက်နာတာပါ။ ဒါကြောင့် page တစ်ခုလုံးရဲ့ လှုပ်ရှားမှုကို
      ရပ်ပေးမယ့် ခလုတ် တစ်ခု ထည့်ကြည့်ရအောင်။
    sources:
      - title: "web.dev Learn Accessibility — Animation and motion (Pause, stop, or hide movement)"
        url: "https://web.dev/learn/accessibility/motion"
      - title: "WCAG 2.2 — Understanding 2.2.2 Pause, Stop, Hide"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/pause-stop-hide.html"
    actions:
      - id: close-rules
        type: whiteboard.apply
        at: { mark: close-rules }
        open: false
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { mark: preview-opens }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-dev-server }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-banner
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: banner }
        textContains: "ယနေ့အထူး"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-region-row
        type: expect.preview
        at: { mark: read-tree }
        timeoutMs: 5000
        target: { by: testId, value: a11y-specials }
        textContains: 'region "ယနေ့အထူး"'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-no-warnings
        type: expect.preview
        at: { afterAction: expect-region-row }
        timeoutMs: 5000
        target: { by: testId, value: a11y-summary }
        attribute: { name: data-warnings, value: "0" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: toggle-button
    chapter: "User ကို ရွေးခွင့် ပေးရအောင်"
    narration: >
      [[mark:open-index]] ဒါက page ရဲ့ HTML ဖိုင်ပါ။ [[mark:type-button]] main ရဲ့ အစမှာ button
      element တစ်ခု ထည့်ပါမယ်။ ခလုတ်ပေါ်က စာက လှုပ်ရှားမှု လျှော့ ဖြစ်ပြီး၊ ဒီ စာက နှိပ်တိုင်း
      မပြောင်းပါဘူး။ [[mark:select-pressed]] ပြောင်းမှာက aria pressed ပါ။ ဒီ ခလုတ်ကို နှိပ်ထားလား၊
      မနှိပ်ရသေးလား ဆိုတဲ့ state ကို screen reader ဆီ ပြောပေးတာ ဖြစ်ပြီး၊ ဒီလို ခလုတ်ကို toggle
      button လို့ ခေါ်ပါတယ်။ [[mark:select-toggle-class]] ဒီ project ရဲ့ kit script က ခလုတ်ကို
      နှိပ်တိုင်း page ရဲ့ body မှာ reduce motion ဆိုတဲ့ class ကို ထည့်လိုက် ဖြုတ်လိုက်
      လုပ်ပေးပြီး၊ aria pressed ကိုလည်း true နဲ့ false ကြား ပြောင်းပေးပါတယ်။ [[mark:read-button-row]]
      panel မှာ role က button၊ name က လှုပ်ရှားမှု လျှော့၊ state က not pressed ဆိုပြီး
      ပေါ်လာပါပြီ။ screen reader ကလည်း ဒါ toggle button ဖြစ်ကြောင်းနဲ့ မနှိပ်ရသေးကြောင်း
      ပြောပြမှာပါ။
    sources:
      - title: "web.dev Learn Accessibility — Animation and motion (Pause, stop, or hide movement)"
        url: "https://web.dev/learn/accessibility/motion"
      - title: "MDN — aria-pressed"
        url: "https://developer.mozilla.org/docs/Web/Accessibility/ARIA/Reference/Attributes/aria-pressed"
      - title: "WAI-ARIA Authoring Practices — Button pattern (toggle button)"
        url: "https://www.w3.org/WAI/ARIA/apg/patterns/button/"
    actions:
      - id: open-index
        type: workspace.openFile
        at: { mark: open-index }
        path: index.html
      - id: type-button
        type: editor.type
        at: { mark: type-button }
        cadence: block
        target:
          {
            file: index.html,
            after: '<main class="page" id="main" data-testid="main">',
            occurrence: 1,
          }
        text: "\n      <button class=\"motion-toggle\" type=\"button\" aria-pressed=\"false\" data-toggle-class=\"reduce-motion\" data-target=\"body\" data-testid=\"motion-toggle\">လှုပ်ရှားမှု လျှော့</button>"
      - id: select-pressed
        type: editor.select
        at: { mark: select-pressed }
        target: { file: index.html, text: 'aria-pressed="false"', occurrence: 1 }
      - id: select-toggle-class
        type: editor.select
        at: { mark: select-toggle-class }
        target:
          {
            file: index.html,
            text: 'data-toggle-class="reduce-motion" data-target="body"',
            occurrence: 1,
          }
      - id: expect-button-row
        type: expect.preview
        at: { mark: read-button-row }
        timeoutMs: 5000
        target: { by: testId, value: a11y-motion-toggle }
        textContains: 'button "လှုပ်ရှားမှု လျှော့" not pressed'
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: toggle-css
    narration: >
      [[mark:open-styles]] ခလုတ်က class ကို ပြောင်းပေးပေမယ့်၊ အဲဒီ class ရောက်လာရင် ဘာလုပ်ရမလဲ
      ဆိုတာကိုတော့ CSS က ပြောရပါမယ်။ [[mark:type-rule]] body မှာ reduce motion class ရှိနေရင်၊ page
      ထဲက element တိုင်းရဲ့ animation ကို ပိတ်ပါမယ်။ important ကို သုံးတာက၊ user ရဲ့ ရွေးချယ်မှုဟာ
      page ထဲက ဘယ် animation rule ကိုမဆို နိုင်ရမယ် ဖြစ်လို့ပါ။ ဒီ နေရာမှာ important က တကယ် အဓိပ္ပာယ်
      ရှိပါတယ်။ [[mark:after-rule]] ခလုတ်ကို မနှိပ်ရသေးတဲ့အတွက်၊ page ပေါ်မှာတော့ အခုထိ ဘာမှ
      မပြောင်းသေးပါဘူး။
    sources:
      - title: "web.dev Learn Accessibility — Animation and motion"
        url: "https://web.dev/learn/accessibility/motion"
      - title: "MDN — !important"
        url: "https://developer.mozilla.org/docs/Web/CSS/important"
    actions:
      - id: open-styles
        type: workspace.openFile
        at: { mark: open-styles }
        path: styles.css
      - id: type-rule
        type: editor.type
        at: { mark: type-rule }
        cadence: fast-explainer
        target: { file: styles.css, after: "", occurrence: 1 }
        text: ".reduce-motion * {\n  animation: none !important;\n}\n"
      - id: expect-still-not-pressed
        type: expect.preview
        at: { mark: after-rule }
        timeoutMs: 5000
        target: { by: testId, value: a11y-motion-toggle }
        textContains: 'button "လှုပ်ရှားမှု လျှော့" not pressed'
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: click-toggle
    narration: >
      [[mark:click-toggle]] ဒါဆို ခလုတ်ကို နှိပ်ကြည့်ရအောင်။ [[mark:after-click]] ကြည့်ပါ၊
      အငွေ့လေးတွေနဲ့ banner က ချက်ချင်း ရပ်သွားပါပြီ။ banner ထဲက စာကလည်း တစ်နေရာတည်းမှာ
      ငြိမ်ငြိမ်လေး ဖတ်လို့ ရသွားပါပြီ။ ခလုတ်က အစိမ်းရောင် ပြောင်းသွားပြီး၊ panel မှာလည်း state
      က pressed ဖြစ်သွားပါပြီ။ ဆိုလိုတာက မျက်စိနဲ့ မြင်ရတဲ့ အခြေအနေနဲ့ screen reader ကို ပြောတဲ့
      state က တစ်ထပ်တည်း ကျနေပါတယ်။ တကယ့် site မှာဆိုရင် ဒီ ရွေးချယ်မှုကို browser မှာ
      မှတ်ထားပြီး၊ တခြား page တွေမှာပါ ဆက်သက်ရောက်အောင် လုပ်ပေးသင့်ပါတယ်။
    sources:
      - title: "web.dev Learn Accessibility — Animation and motion (Allow your users to choose)"
        url: "https://web.dev/learn/accessibility/motion"
      - title: "WCAG 2.2 — Understanding 2.2.2 Pause, Stop, Hide"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/pause-stop-hide.html"
    actions:
      - id: click-toggle
        type: preview.click
        at: { mark: click-toggle }
        timeoutMs: 5000
        target: { by: testId, value: motion-toggle }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-pressed
        type: expect.preview
        at: { mark: after-click }
        timeoutMs: 5000
        target: { by: testId, value: a11y-motion-toggle }
        textContains: '"လှုပ်ရှားမှု လျှော့" pressed'
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-pressed-attr
        type: expect.preview
        at: { afterAction: expect-pressed }
        timeoutMs: 5000
        target: { by: testId, value: motion-toggle }
        attribute: { name: aria-pressed, value: "true" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-body-class
        type: expect.preview
        at: { afterAction: expect-pressed-attr }
        timeoutMs: 5000
        target: { by: testId, value: site-body }
        attribute: { name: class, value: "reduce-motion" }
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: os-setting
    chapter: "OS setting ကို လိုက်ရအောင်"
    narration: >
      [[mark:board-os]] user တချို့ကတော့ ဒီ ရွေးချယ်မှုကို ကိုယ့် device ရဲ့ setting မှာ တစ်ခါတည်း
      လုပ်ထားပြီးသားပါ။ [[mark:draw-os-names]] macOS နဲ့ iPhone မှာ Reduce motion၊ Android မှာ
      Remove animations ကို ဖွင့်ရပြီး၊ Windows မှာတော့ Animation effects ကို ပိတ်ရပါတယ်။
      နာမည်တွေ မတူပေမယ့် ဆိုလိုရင်းက အတူတူပါ။ [[mark:draw-query]] browser က ဒီ setting ကို
      prefers reduced motion media query နဲ့ page ကို ပြောပြပါတယ်။ setting ဖွင့်ထားရင် reduce၊
      မဖွင့်ထားရင် no preference ပါ။ [[mark:close-os]] editor ထဲ ပြန်သွားရအောင်။ [[mark:type-mq]]
      styles ဖိုင်ထဲမှာ reduce ဖြစ်တဲ့ user အတွက် animation ကို ပိတ်တဲ့ media query ကို ထည့်ပါမယ်။
      ဒီ user တွေက ခလုတ်ကို ရှာပြီး နှိပ်စရာ မလိုဘဲ၊ page ကို စဖွင့်ကတည်းက animation
      မပါတော့ပါဘူး။ [[mark:select-query]] ဒီ query အပိုင်းက OS setting ကို စစ်တဲ့ နေရာပါ။ lesson
      ထဲက preview က ကွန်ပျူတာရဲ့ setting ကို ပြောင်းလို့ မရလို့၊ ဒီ rule ရဲ့ ရလဒ်ကို ဒီမှာ ပြလို့
      မရပါဘူး။ ကိုယ့် ကွန်ပျူတာမှာ reduce motion setting ကို ဖွင့်ပြီး စမ်းကြည့်ပါ။
    sources:
      - title: "web.dev Learn Accessibility — Animation and motion (Use media queries)"
        url: "https://web.dev/learn/accessibility/motion"
      - title: "MDN — prefers-reduced-motion (user preferences per operating system)"
        url: "https://developer.mozilla.org/docs/Web/CSS/@media/prefers-reduced-motion#user_preferences"
    actions:
      - id: board-os
        type: whiteboard.apply
        at: { mark: board-os }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-os-names
        type: whiteboard.apply
        at: { mark: draw-os-names }
        upsertIds: [c-mac, c-android, c-win]
        drawMs: 2600
      - id: draw-query
        type: whiteboard.apply
        at: { mark: draw-query }
        upsertIds: [c-arrow, c-reduce, c-nopref]
        drawMs: 2200
      - id: close-os
        type: whiteboard.apply
        at: { mark: close-os }
        open: false
      - id: type-mq
        type: editor.type
        at: { mark: type-mq }
        cadence: line-by-line
        target: { file: styles.css, after: "  animation: none !important;\n}\n", occurrence: 1 }
        text: "\n@media (prefers-reduced-motion: reduce) {\n  * {\n    animation: none !important;\n  }\n}\n"
      - id: select-query
        type: editor.select
        at: { mark: select-query }
        target: { file: styles.css, text: "(prefers-reduced-motion: reduce)", occurrence: 1 }
      - id: expect-mq-file
        type: expect.file
        at: { afterAction: select-query }
        path: styles.css
        contains: "@media (prefers-reduced-motion: reduce) {"

  - id: progressive
    chapter: "Motion ကို ရွေးမှ ပေးရအောင်"
    narration: >
      [[mark:board-progressive]] နောက်ထပ် နည်း တစ်ခုက ပြောင်းပြန် စဉ်းစားတာပါ။ [[mark:draw-no-pref]]
      animation ကို အမြဲ ထည့်ထားပြီး လိုမှ ပိတ်မယ့်အစား၊ no preference ဖြစ်တဲ့ media query
      ထဲမှာပဲ animation ကို ရေးတာပါ။ ဒါဆို setting ဖွင့်ထားတဲ့ user ဆီကို animation လုံးဝ
      မရောက်တော့ပါဘူး။ ဒီ နည်းကို progressive enhancement လို့ ခေါ်ပါတယ်။ [[mark:draw-default]]
      ဘယ်လောက် လှုပ်ရှားမှုက ဘယ်သူ့ကို ထိခိုက်မလဲ ဆိုတာ ကြိုမသိနိုင်လို့၊ animation ကို default
      အနေနဲ့ ပိတ်ထားပြီး user က ဖွင့်မှ ပေါ်စေတာကိုလည်း စဉ်းစားနိုင်ပါတယ်။ [[mark:draw-layer]]
      ပြီးခဲ့တဲ့ lesson က prefers color scheme၊ prefers contrast တို့နဲ့ ဒီ query ကို တွဲသုံးပြီး၊
      user ရဲ့ ရွေးချယ်မှု အမျိုးမျိုးကို တစ်ပြိုင်နက် လိုက်ပေးနိုင်ပါတယ်။ [[mark:draw-own]] OS
      တစ်ခုချင်းစီမှာ setting နာမည် မတူတဲ့အပြင် ရှာရလည်း ခက်လို့၊ media query ရှိပြီးသား
      ဖြစ်ပေမယ့် page ထဲမှာ ကိုယ်ပိုင် ခလုတ်ပါ ထားပေးတာ အကောင်းဆုံးပါ။
    sources:
      - title: "web.dev Learn Accessibility — Animation and motion (Progressive enhancement, layered media queries)"
        url: "https://web.dev/learn/accessibility/motion"
      - title: "MDN — prefers-reduced-motion"
        url: "https://developer.mozilla.org/docs/Web/CSS/@media/prefers-reduced-motion"
      - title: "WCAG 2.2 — Understanding 2.3.3 Animation from Interactions"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/animation-from-interactions.html"
    actions:
      - id: board-progressive
        type: whiteboard.apply
        at: { mark: board-progressive }
        open: true
        clear: true
        upsertIds: [d-title]
      - id: draw-no-pref
        type: whiteboard.apply
        at: { mark: draw-no-pref }
        upsertIds: [d-code-1, d-code-2, d-code-3, d-code-4]
        drawMs: 3000
      - id: draw-default
        type: whiteboard.apply
        at: { mark: draw-default }
        upsertIds: [d-default]
        drawMs: 1600
      - id: draw-layer
        type: whiteboard.apply
        at: { mark: draw-layer }
        upsertIds: [d-layer]
        drawMs: 1600
      - id: draw-own
        type: whiteboard.apply
        at: { mark: draw-own }
        upsertIds: [d-own]
        drawMs: 1400

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      [[mark:close-progressive]] ဒါဆို ပြန်ချုပ်ရရင်၊ flashing က တစ်စက္ကန့်မှာ သုံးကြိမ်ထက်
      မပိုရပါဘူး။ အလိုလို စပြီး ငါးစက္ကန့်ထက် ကြာတဲ့ လှုပ်ရှားမှုကိုတော့ user က ရပ်လို့
      ရရပါမယ်။ [[mark:sel-toggle-rule]] ဒါကြောင့် page ထဲမှာ aria pressed ပါတဲ့ ခလုတ်နဲ့ user
      ကို ကိုယ်တိုင် ရွေးခွင့် ပေးပြီး၊ [[mark:sel-mq]] OS မှာ reduce motion ဖွင့်ထားတဲ့ user
      အတွက်လည်း media query နဲ့ animation ကို ပိတ်ပေးပါတယ်။ နောက် lesson မှာတော့ ဖတ်ရလွယ်တဲ့
      စာသား ဖြစ်ဖို့ font၊ စာလုံး အရွယ်အစားနဲ့ spacing ကို ကြည့်သွားပါမယ်။
    sources:
      - title: "web.dev Learn Accessibility — Animation and motion"
        url: "https://web.dev/learn/accessibility/motion"
      - title: "WCAG 2.2 — Understanding 2.2.2 Pause, Stop, Hide"
        url: "https://www.w3.org/WAI/WCAG22/Understanding/pause-stop-hide.html"
    actions:
      - id: close-progressive
        type: whiteboard.apply
        at: { mark: close-progressive }
        open: false
      - id: sel-toggle-rule
        type: editor.select
        at: { mark: sel-toggle-rule }
        target: { file: styles.css, text: ".reduce-motion * {", occurrence: 1 }
      - id: sel-mq
        type: editor.select
        at: { mark: sel-mq }
        target: { file: styles.css, text: "@media (prefers-reduced-motion: reduce)", occurrence: 1 }
      - id: expect-still-pressed
        type: expect.preview
        at: { afterAction: sel-mq }
        timeoutMs: 5000
        target: { by: testId, value: motion-toggle }
        attribute: { name: aria-pressed, value: "true" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-rule-file
        type: expect.file
        at: { afterAction: expect-still-pressed }
        path: styles.css
        contains: ".reduce-motion * {\n  animation: none !important;\n}"

checks:
  - { type: timing.p95Ms, max: 300 }
