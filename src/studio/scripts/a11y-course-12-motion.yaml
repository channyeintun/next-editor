          background: var(--leaf);
          color: #fff;
        }

        /* == D. helpers == */
        /* .demo shows a box's edges without changing layout (outline takes no space). */
        .demo {
          outline: 1px dashed var(--muted);
        }

        /* == E. lesson rules == */
        /* Start state of the motion lesson (never typed, never shown): steam that
           rises from the cup forever and a "today's special" banner that slides
           across forever, both starting on their own, with no way to stop them and
           no reduced-motion handling. */
        .wisp {
          animation: steam 2.4s ease-in-out infinite;
        }

        .wisp:nth-child(2) {
          animation-delay: 0.8s;
        }

        .wisp:nth-child(3) {
          animation-delay: 1.6s;
        }

        .banner-track {
          animation: slide 9s linear infinite;
        }

        @keyframes steam {
          0% {
            transform: translateY(10px);
            opacity: 0;
          }
          50% {
            opacity: 1;
          }
          100% {
            transform: translateY(-14px);
            opacity: 0;
          }
        }

        @keyframes slide {
          from {
            transform: translateX(110%);
          }
          to {
            transform: translateX(-110%);
          }
        }
