      tasks/01-order-form.md: |
        # Task 01 · Order form

        ## Goal
        customer က ဖုန်းကနေ ကြိုမှာလို့ရတဲ့ form တစ်ခု။

        ## Read first
        - docs/spec.md — Rules, AC-1 ကနေ AC-4
        - AGENTS.md

        ## Constraints
        - order form တစ်ခုတည်း။ ကောင်တာစာရင်းက Task 03။
        - package အသစ် မထည့်ပါနဲ့။
        - login နဲ့ account မဆောက်ပါနဲ့။

        ## Done when
        - AC-1 ကနေ AC-4 အထိ ဖုန်း screen အရွယ်မှာ pass ဖြစ်ရမယ်။
        - ဘာပြင်ခဲ့လဲ၊ ဘာမလုပ်ခဲ့လဲ စာရင်း ပြန်ပေးပါ။

        ## If unsure
        ရပ်ပြီး မေးပါ။ business rule တွေကို ခန့်မှန်းပြီး မဆုံးဖြတ်ပါနဲ့။
      tasks/01-plan.md: |
        # Example plan · the agent's reply to Task 01

        1. index.html မှာ order form ဆောက်မယ် — item၊ အရေအတွက်၊ လာယူချိန်၊ နာမည်၊ ဖုန်း
        2. စုစုပေါင်း ဈေးနှုန်းကို တွက်ပြမယ်
        3. customer account နဲ့ login စာမျက်နှာ ထည့်မယ် — နောက်တစ်ခါ အလွယ်တကူ မှာနိုင်အောင်
        4. AC-1 ကနေ AC-4 ကို ဖုန်း screen အရွယ်နဲ့ စစ်မယ်
        5. ပြင်ခဲ့တာတွေကို အကျဉ်းချုပ် ပြန်ပေးမယ်
