        # Costs · ကြိုမှာ app

        ## Running cost (တစ်လ)
        Budget — 30,000 ကျပ်အောက် (requirements.md)
        - hosting — free tier၊ 0 ကျပ်
        - database — managed service ရဲ့ free tier (ADR-002)၊ 0 ကျပ်
        - SMS — မပို့ရသေးဘူး။ ထည့်ရင် 15,000 ကျပ်အထိ
        - free tier ကျော်ရင် — 15,000 ကျပ် ချန်ထား

        ## Builder's tools (app budget ထဲ မပါ)
        - AI agent — subscription ဆိုရင် လစဉ် ပုံသေ၊ API ဆိုရင် token အလိုက်
        - ကိုယ့်အချိန် — task တစ်ခုစီ ဘယ်နှနာရီ ကြာလဲ မှတ်

        ## Limits
        - running cost — budget ရဲ့ 50% နဲ့ 90% ရောက်ရင် alert
        - AI agent API — spend limit၊ ရောက်ရင် ရပ်
        - ရိုးရှင်းတဲ့ task — model အသေး၊ ခက်တဲ့ ဆုံးဖြတ်ချက် — အကောင်းဆုံး model
        - AGENTS.md တိုတို၊ English။ task မှာ လိုတဲ့ ဖိုင်ကိုပဲ ညွှန်၊ task ပြီးရင် session အသစ်
