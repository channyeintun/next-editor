        # Harness · ကြိုမှာ app

        ## Rules
        - AGENTS.md — session တိုင်း ဖတ်တယ်။ တိုတို၊ English။
        - မမှန်တော့တဲ့ rule ကို ဖယ်မယ်။ ရှည်လာရင် skill ထဲ ရွှေ့မယ်။

        ## Tools
        - ဖိုင် ဖတ်၊ ဖိုင် ပြင်၊ test run — ခွင့်ပြုတယ်။
        - MCP — hosting ရဲ့ error log ကို ဖတ်ရုံပဲ။
        - package အသစ် — မေးပြီးမှ။
        - production database — မပေးဘူး။

        ## Skills
        - release — release checklist ရဲ့ အဆင့်တွေ။ release လုပ်မှ ဖတ်မယ်။

        ## Hooks
        - pre-commit — key ဒါမှမဟုတ် ဖုန်းနံပါတ် စာရင်း ပါရင် commit ကို ပိတ်မယ်။

        ## Sandbox
        - agent က project မိတ္တူ ပေါ်မှာ test data နဲ့ပဲ အလုပ်လုပ်မယ်။

        ## Logs
        - task တစ်ခုစီ — agent run ခဲ့တဲ့ command နဲ့ ပြင်ခဲ့တဲ့ ဖိုင်တွေကို tasks/ ထဲ သိမ်းမယ်။

        ## Changes
        - harness ကို ပြင်ရင် commit လုပ်ပြီး code လိုပဲ review လုပ်မယ်။
