  - id: understandable
    narration: >
      [[mark:d-title]] maintenance ရဲ့ အခြေခံက app ကို နားလည်လို့ ရနေအောင် ထိန်းထားဖို့ပါ။ ကိုယ် ရှင်းမပြနိုင်တဲ့
      အပိုင်းကို ဘေးကင်းကင်း ပြင်လို့ မရလို့ပါ။ [[mark:d-three]] ဒါကို document သုံးမျိုးက ကူညီပါတယ်။ app နဲ့
      ကိုက်နေအောင် ထိန်းထားတဲ့ spec လို docs တွေ၊ ဘာကြောင့် ဒီလို ရွေးခဲ့လဲ ဆိုတဲ့ decision record တွေ၊ app ဘယ်လို
      အလုပ်လုပ်ရမလဲ ဆိုတာကို ပြနေတဲ့ test တွေပါ။ တစ်နှစ်ကြာလို့ ကိုယ်တိုင် မေ့သွားရင်တောင် ဒါတွေကနေ ပြန်စလို့
      ရပါတယ်။ [[mark:d-agent]] agent ကိုလည်း ဒီမှာ သုံးလို့ ရပါတယ်။ မရင်းနှီးတဲ့ အပိုင်းကို မပြင်ခင် အဲဒီ အပိုင်း
      ဘာလုပ်လဲ ဆိုတာ ကိုယ် နားလည်တဲ့ စကားနဲ့ အရင် ရှင်းပြခိုင်းပါ။ [[mark:d-upd]] ပြောင်းလဲမှု တိုင်းမှာလည်း code
      နဲ့အတူ docs ကိုပါ ပြင်ခိုင်းပါ။ မဟုတ်ရင် docs တွေ တဖြည်းဖြည်း ဟောင်းသွားပြီး ယုံလို့ မရတော့ပါဘူး။
      [[mark:d-amp]] နောက်ဆုံး အချက်က AI က project ထဲမှာ ရှိပြီးသား အလေ့အထကို ချဲ့ပေးတတ်တာပါ။ agent က project
      ထဲမှာ တွေ့တဲ့ ပုံစံတွေကို လိုက်ပြီး ထုတ်ပေးတတ်ပါတယ်။ [[mark:d-good]] ဒါကြောင့် ရှင်းတဲ့ docs၊ test နဲ့ rule
      တွေ ရှိရင် ကောင်းတာကို ပိုမြန်မြန် ထပ်ထုတ်ပေးပါတယ်။ [[mark:d-bad]] ရှုပ်နေတဲ့ project မှာတော့ ရှုပ်တာကိုပဲ
      ပိုမြန်မြန် ထပ်ထုတ်ပေးပါတယ်။
    sources:
      - {
          title: "Claude Code docs: Common workflows (understand new codebases; handle documentation; tests that follow existing patterns)",
          url: "https://code.claude.com/docs/en/common-workflows",
        }
      - {
          title: "DORA: 2025 State of AI-assisted Software Development (AI is an amplifier)",
          url: "https://research.google/pubs/dora-2025-state-of-ai-assisted-software-development-report/",
        }
      - {
          title: "The New SDLC (Burmese edition): Conclusion (AI amplifies engineering culture)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
