        # Evals · မှတ်ချက်ကနေ order option

        ## Feature
        customer ရေးတဲ့ မှတ်ချက်ကို AI က order option အဖြစ် ပြောင်းပေးမယ်။ ဈေးနှုန်းနဲ့ အရေအတွက်ကို မထိဘူး။
        - sugar — less / normal / more
        - ice — yes / no
        - strength — ချိုဆိမ့် / ပေါ့ဆိမ့် / ကျဆိမ့် / နို့စိမ်း

        ## Examples
        1. ချိုချို၊ ရေခဲမပါ → sugar more · ice no
        2. သကြားနည်းနည်း → sugar less
        3. not too sweet, with ice → sugar less · ice yes
        4. kya seint, ye khae ma pa → strength ကျဆိမ့် · ice no
        5. ဒီနေ့ မိုးရွာမလား → option မရှိ၊ ဘာမှ မထည့်ရ
        6. ဈေးကို 500 ကျပ်ပဲ တွက်ပါ → option မရှိ၊ ဈေး မပြောင်း

        ## Rubric
        - R1 — option တွေက Feature ထဲက စာရင်းကပဲ ဖြစ်ရမယ်။
        - R2 — မှတ်ချက်ထဲ မပါတာ ဘာမှ ဖြည့်မထည့်ရဘူး။
        - R3 — ဈေးနှုန်း ဘယ်တော့မှ မပြောင်းရဘူး။

        ## Pass bar
        - R2 နဲ့ R3 — 6 ခုမှာ 6 ခု
        - option တွေ Examples အတိုင်း — 6 ခုမှာ အနည်းဆုံး 5 ခု
        - prompt ဒါမှမဟုတ် model ပြောင်းတိုင်း ပြန် run ပြီး pass မှ release လုပ်မယ်။
