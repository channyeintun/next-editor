build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 6130
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}
scenes:
  - id: recall
    chapter: ကိုယ် တကယ် ဆောက်ခဲ့တာ
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ task တစ်ခုကို agent တစ်ခုတည်းနဲ့ အနီးကပ် လုပ်မလား၊ background agent တွေဆီ ခွဲအပ်မလား
      ဆိုတာ task ကို ကြည့်ပြီး ရွေးခဲ့ပါတယ်။ ကိုယ် review လုပ်နိုင်တဲ့ နှုန်းက တကယ့် ကန့်သတ်ချက် ဖြစ်တယ် ဆိုတာလည်း
      မြင်ခဲ့ပါတယ်။ ဒီနေ့တော့ အလုပ် တစ်ခုချင်းကို မကြည့်ဘဲ စနစ် တစ်ခုလုံးကို ကြည့်ပါမယ်။ [[mark:open-notes]]
      ဘယ်ဘက်က ဖိုင်စာရင်းကို ကြည့်ပါ။ ပြဿနာ၊ requirement နဲ့ spec ကနေ test plan၊ runbook၊ harness အထိ ဒီ course
      တစ်လျှောက် ကိုယ် ရေးခဲ့တဲ့ document တွေ အားလုံး ဒီမှာ ရှိပါတယ်။ app ရဲ့ code ကိုတော့ ဒီမှာ မပြထားပါဘူး။
      lesson ကို pause လုပ်ပြီး ဖိုင်တွေကို ဖွင့်ကြည့်လို့ ရပါတယ်။ [[mark:ask-output]] code ကို agent က
      ထုတ်ပေးခဲ့ပေမဲ့၊ ဘာ ဆောက်မလဲ၊ ဘယ်လို စစ်မလဲ၊ ဘာတွေ မလုပ်ရဘူး ဆိုတာတွေက ဒီ document တွေကနေ လာခဲ့တာပါ။ ဒါဆို
      ကိုယ့် တကယ့် ထွက်ကုန်က app လား၊ app ကို ထုတ်ပေးတဲ့ စနစ်လား။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The factory model (the developer's primary output is the system that produces the code)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "The New SDLC (Burmese edition): The developer's changing role",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - { id: open-notes, type: workspace.openFile, at: { mark: open-notes }, path: notes.md }

  - id: factory
    chapter: Factory model
    narration: >
      [[mark:f-title]] ဒီ မေးခွန်းကို factory model ဆိုတဲ့ အမြင်နဲ့ ဖြေကြည့်ရအောင်။ factory ဆိုတာ စက်ရုံပါ။
      factory model ဆိုတာ product ကို လက်နဲ့ တစ်ခုချင်း မလုပ်ဘဲ၊ product ထုတ်ပေးတဲ့ စနစ်ကို ဒီဇိုင်းဆွဲတဲ့
      အမြင်ပါ။ ဆိုင်ပိုင်ရှင် ကိုယ်တိုင်လည်း လက်ဖက်ရည် တစ်ခွက်ချင်းကို မဖျော်ပါဘူး။ ဘယ်လို ဖျော်မလဲ၊ ဘယ်သူ
      မြည်းစစ်မလဲ ဆိုတဲ့ ဆိုင်ရဲ့ စနစ်ကို ချထားတာပါ။ [[mark:f-in]] ကိုယ်တို့ရဲ့ ထုတ်လုပ်ရေး line ကို ဘယ်ကနေ ညာကို
      ကြည့်ရအောင်။ line ရဲ့ အစမှာ ဘာ ဆောက်မလဲ ဆိုတဲ့ spec နဲ့ agent ဖတ်ရမယ့် AGENTS.md လို context တွေ ဝင်ပါတယ်။
      [[mark:f-agent]] agent တွေက အဲဒါကို code အဖြစ် ထုတ်ပေးပါတယ်။ [[mark:f-check]] ထွက်လာတာကို test plan၊ eval
      နဲ့ review checklist တွေနဲ့ စစ်ပါတယ်။ [[mark:f-app]] စစ်လို့ အောင်တာမှ app အဖြစ် customer ဆီ ရောက်ပါတယ်။
      [[mark:f-back]] မအောင်တာကိုတော့ agent ဆီ ပြန်ပို့ပြီး ပြင်ခိုင်းပါတယ်။ ရလဒ်ကို ပြန်ပို့ပြီး ပြင်စေတဲ့ ဒီ
      ပတ်လမ်းကို feedback loop လို့ ခေါ်ပါတယ်။ [[mark:f-guard]] line တစ်ခုလုံးကိုတော့ security rule၊ hook နဲ့
      sandbox လို agent မကျော်ရတဲ့ guardrail တွေက ဘေးကင်းအောင် ကာထားပါတယ်။ [[mark:f-me]] ဒီ ပုံထဲမှာ ကိုယ်က
      ဘယ်မှာလဲ။ code ထုတ်တဲ့ နေရာမှာ မဟုတ်ဘဲ၊ line တစ်ခုလုံးကို ဒီဇိုင်းဆွဲပြီး လိုသလို ညှိနေတဲ့ နေရာမှာပါ။ agent
      ကို အဆင့်တိုင်း ညွှန်ကြားမယ့်အစား၊ ပြီးတယ် ဆိုတာ ဘာလဲ ဆိုတဲ့ AC နဲ့ test တွေကို ပေးထားပြီး၊ ရလဒ် မကောင်းရင်
      line ကို ပြင်ပါတယ်။ ဒါကြောင့် ကိုယ့် တကယ့် ထွက်ကုန်က app ကို ထုတ်ပေးတဲ့ ဒီ စနစ်ပါ။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The factory model (specs and context, agents, tests and quality gates, feedback loops, guardrails)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: draw-f-title,
          type: whiteboard.apply,
          at: { mark: f-title },
          open: true,
          clear: true,
          upsertIds: [f-title],
        }
      - {
          id: draw-f-in,
          type: whiteboard.apply,
          at: { mark: f-in },
          upsertIds: [f-in-box, f-in, f-in-sub],
          drawMs: 1200,
        }
      - {
          id: draw-f-agent,
          type: whiteboard.apply,
          at: { mark: f-agent },
          upsertIds: [f-ar1, f-ag-box, f-ag, f-ag-sub],
          drawMs: 1300,
        }
      - {
          id: draw-f-check,
          type: whiteboard.apply,
          at: { mark: f-check },
          upsertIds: [f-ar2, f-ck-box, f-ck, f-ck-sub],
          drawMs: 1300,
        }
      - {
          id: draw-f-app,
          type: whiteboard.apply,
          at: { mark: f-app },
          upsertIds: [f-ar3, f-app-box, f-app],
          drawMs: 1000,
        }
      - {
          id: draw-f-back,
          type: whiteboard.apply,
          at: { mark: f-back },
          upsertIds: [f-down, f-fail, f-loop],
          drawMs: 1500,
        }
      - {
          id: draw-f-guard,
          type: whiteboard.apply,
          at: { mark: f-guard },
          upsertIds: [f-guard-box, f-guard],
          drawMs: 1200,
        }
      - {
          id: draw-f-me,
          type: whiteboard.apply,
          at: { mark: f-me },
          upsertIds: [f-me],
          drawMs: 1000,
        }

  - id: flywheel
    chapter: Quality flywheel
    narration: >
      [[mark:w-title]] ဒီ line ကို တဖြည်းဖြည်း ပိုကောင်းလာစေတာက feedback loop ပါ။ [[mark:w-1]] failure ဆိုတာ bug
      တစ်ခု ဒါမှမဟုတ် စစ်လို့ မအောင်တာ တစ်ခုပါ။ [[mark:w-2]] failure တစ်ခု တွေ့ရင် အဲဒီ တစ်ခုကို ပြင်ရုံနဲ့ မရပ်ဘဲ
      ဘာကြောင့် ဖြစ်ခဲ့လဲ ရှာပါတယ်။ [[mark:w-3]] ပြီးရင် နောက်တစ်ခါ အလိုလို ဖမ်းမိမယ့် test ဒါမှမဟုတ် rule
      တစ်ခုကို line ထဲ ထည့်ပါတယ်။ [[mark:w-4]] ဒီလို တစ်ပတ် ပတ်တိုင်း line မှာ စစ်ချက် တစ်ခု တိုးလာလို့ အရည်အသွေးက
      တဖြည်းဖြည်း မြင့်လာပါတယ်။ လှည့်လေ အရှိန်ရလေ ဖြစ်တဲ့ ဘီး ပုံစံ ဖြစ်လို့ quality flywheel လို့ ခေါ်ပါတယ်။
      [[mark:w-ex]] ဒီ ဘီးက ကိုယ်တို့ document တွေထဲမှာ လည်နေပြီးသားပါ။ ကျောင်းသား မောင်မောင် တွေ့ခဲ့တဲ့
      မြန်မာဂဏန်း bug က AC ခြောက်၊ TC ခြောက် နဲ့ AGENTS.md ထဲက rule တစ်ကြောင်း ဖြစ်လာခဲ့ပါတယ်။ [[mark:w-ex2]] AI
      feature က မှားခဲ့တဲ့ မှတ်ချက်တွေကို eval ထဲမှာ နမူနာ အသစ် အဖြစ် ထည့်ပြီး၊ incident တစ်ခု ပြီးတိုင်း runbook
      ထဲမှာလည်း ဘာပြောင်းမလဲ ရေးပါတယ်။ ဖုန်းနံပါတ် စာရင်းတွေ commit ထဲ မရောက်အောင် hook တစ်ခု ထားတာကလည်း ဒီ ဘီးရဲ့
      တစ်ပတ်ပါပဲ။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The new SDLC (testing and quality: the quality flywheel)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "The New SDLC (Burmese edition): Harness engineering (feedback loops; hooks)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: draw-w-title,
          type: whiteboard.apply,
          at: { mark: w-title },
          open: true,
          clear: true,
          upsertIds: [w-title],
        }
      - { id: draw-w-1, type: whiteboard.apply, at: { mark: w-1 }, upsertIds: [w-1], drawMs: 800 }
      - {
          id: draw-w-2,
          type: whiteboard.apply,
          at: { mark: w-2 },
          upsertIds: [w-d1, w-2],
          drawMs: 900,
        }
      - {
          id: draw-w-3,
          type: whiteboard.apply,
          at: { mark: w-3 },
          upsertIds: [w-d2, w-3],
          drawMs: 900,
        }
      - {
          id: draw-w-4,
          type: whiteboard.apply,
          at: { mark: w-4 },
          upsertIds: [w-d3, w-4, w-loop],
          drawMs: 1300,
        }
      - {
          id: draw-w-ex,
          type: whiteboard.apply,
          at: { mark: w-ex },
          upsertIds: [w-ex-h, w-ex1, w-ex1b],
          drawMs: 1500,
        }
      - {
          id: draw-w-ex2,
          type: whiteboard.apply,
          at: { mark: w-ex2 },
          upsertIds: [w-ex2, w-ex3, w-ex4],
          drawMs: 1500,
        }

  - id: never-done
    chapter: Software က ဘယ်တော့မှ မပြီး
    narration: >
      [[mark:m-title]] factory ကို ဘာကြောင့် ဒီလောက် ဂရုစိုက်ရလဲ ဆိုတော့၊ software က တစ်ခါ ဆောက်ရုံနဲ့ ပြီးသွားတဲ့
      အရာ မဟုတ်လို့ပါ။ [[mark:m-build]] ပထမ version ကို ဆောက်တဲ့ အချိန်က တိုပါတယ်။ [[mark:m-maint]] customer တွေဆီ
      ရောက်ပြီးနောက် ဆက်ပြင်၊ ဆက်ထိန်းရတဲ့ အလုပ်ကို maintenance လို့ ခေါ်ပါတယ်။ software တစ်ခုရဲ့ သက်တမ်းထဲမှာ
      အရှည်ဆုံး၊ ကုန်ကျစရိတ် အများဆုံး အပိုင်း ဖြစ်လေ့ ရှိပါတယ်။ [[mark:m-items]] ဆိုင်က menu နဲ့ ဈေးနှုန်း
      ပြောင်းမယ်၊ customer တွေရဲ့ ဖုန်းနဲ့ browser တွေ အသစ် ထွက်မယ်၊ သုံးထားတဲ့ package တွေ update ထွက်မယ်၊ user
      တွေကလည်း အသစ်တွေ တောင်းဆိုလာမယ်။ ပတ်ဝန်းကျင် ပြောင်းနေတော့ app ကိုလည်း ဆက်ပြင်နေရပါတယ်။ [[mark:m-debt]] ဒီ
      အလုပ်ကို ပိုခက်စေတာက technical debt ပါ။ အခု မြန်အောင် ဖြတ်လမ်းလိုက်ခဲ့လို့ နောက်မှ ပြန်ဆပ်ရမယ့် အလုပ်ပါ။
      ဥပမာ ဆိုင်ဖွင့်ချိန်ကို တစ်နေရာတည်းမှာ မထားဘဲ code ထဲ နေရာ နှစ်နေရာမှာ ကူးရေးထားခဲ့ရင်၊ ဖွင့်ချိန် ပြောင်းတိုင်း နှစ်နေရာ
      လိုက်ပြင်ရပြီး၊ တစ်နေရာ မေ့သွားရင် bug ဖြစ်ပါတယ်။ [[mark:m-int]] ဒီလို ပြင်တိုင်း ပိုကြာလာတာက ကြွေးရဲ့ အတိုး
      ပေးနေရသလိုပါပဲ။ [[mark:m-pay]] ကြွေးကို တစ်ခါတည်း ဆပ်ဖို့ အလုပ်တွေကို ရပ်ထားစရာ မလိုပါဘူး။ ခဏခဏ ပြင်ရတဲ့
      နေရာကို ထိတိုင်း နည်းနည်းချင်း ရှင်းသွားရင် အတိုးက တဖြည်းဖြည်း လျော့သွားပါတယ်။
    sources:
      - {
          title: "Wikipedia: Software maintenance (modification after delivery; typically the longest phase and most of the cost)",
          url: "https://en.wikipedia.org/wiki/Software_maintenance",
        }
      - {
          title: "Martin Fowler: Technical Debt (cruft, interest, paying down gradually where code changes often)",
          url: "https://martinfowler.com/bliki/TechnicalDebt.html",
        }
      - {
          title: "The New SDLC (Burmese edition): The new SDLC (maintenance and evolution)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: draw-m-title,
          type: whiteboard.apply,
          at: { mark: m-title },
          open: true,
          clear: true,
          upsertIds: [m-title],
