  - id: rhythm
    narration: >
      [[mark:close-d]] ဒါတွေကို မေ့မသွားအောင် ပုံမှန် လုပ်မယ့် အချိန်ဇယား တစ်ခု အဖြစ် notes ထဲမှာ ရေးထားပါမယ်။
      အားတဲ့အခါမှ လုပ်မယ် ဆိုရင် မလုပ်ဖြစ်တတ်လို့ပါ။ [[mark:type-weekly]] အပတ်တိုင်း လုပ်မယ့် အလုပ်တွေက
      သေးသေးလေးပါ။ app မှာ ဘာဖြစ်နေလဲ နားထောင်ဖို့နဲ့ debt ကို နည်းနည်းချင်း ဆပ်ဖို့ပါ။ [[mark:sel-notebook]]
      ကောင်တာက လှလှ ရဲ့ မှတ်စုကိုပါ ထည့်ထားတာ သတိထား ကြည့်ပါ။ error log မှာ မပေါ်တဲ့ ပြဿနာတွေကို ကောင်တာက အရင်
      ကြားရတတ်လို့ပါ။ runbook အတိုင်း နေ့တိုင်း ဖတ်နေပေမဲ့၊ တစ်ပတ်စာကို စုကြည့်မှ ထပ်ခါ ပေါ်နေတဲ့ ပြဿနာကို မြင်ရပါတယ်။ [[mark:type-monthly]] လစဉ် အလုပ်တွေကတော့ document တွေနဲ့ app ကို ကိုက်နေအောင် ထိန်းတာပါ။
      docs နဲ့ package တွေ မဟောင်းအောင် ကြည့်ပါတယ်။ [[mark:sel-rerun]] ပြီးတော့ test plan နဲ့ eval တွေကို အစအဆုံး
      ပြန်စစ်ပါတယ်။ eval ကိုတော့ prompt ဒါမှမဟုတ် model ပြောင်းတိုင်းလည်း ထပ်စစ်ရပါမယ်။
    sources:
      - {
          title: "Martin Fowler: Technical Debt (remove cruft a little at a time)",
          url: "https://martinfowler.com/bliki/TechnicalDebt.html",
        }
      - {
          title: "The New SDLC (Burmese edition): The new SDLC (maintenance and evolution; regression suite)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - { id: close-d, type: whiteboard.apply, at: { mark: close-d }, open: false }
      - id: type-weekly
        type: editor.type
        at: { mark: type-weekly }
        target: { file: notes.md, after: "# Notes\n", occurrence: 1 }
        text: "\n## Lesson 30 · Maintenance rhythm\n### Weekly\n- error log နဲ့ လှလှ ရဲ့ မှတ်စုကို ဖတ်။\n- ရှုပ်နေတဲ့ နေရာ တစ်ခုကို နည်းနည်း ရှင်း။\n"
        cadence: line-by-line
      - {
          id: sel-notebook,
          type: editor.select,
          at: { mark: sel-notebook },
          target: { file: notes.md, text: "လှလှ ရဲ့ မှတ်စု", occurrence: 1 },
        }
      - id: type-monthly
        type: editor.type
        at: { mark: type-monthly }
        target: { file: notes.md, after: "- ရှုပ်နေတဲ့ နေရာ တစ်ခုကို နည်းနည်း ရှင်း။\n", occurrence: 1 }
        text: "\n### Monthly\n- docs နဲ့ AGENTS.md ကို app အတိုင်း ဖြစ်အောင် update လုပ်။\n- package တွေကို စစ် — လိုသေးလား၊ update ရှိလား။\n- test plan နဲ့ evals ကို အစအဆုံး ပြန် run။\n"
        cadence: line-by-line
      - {
          id: expect-monthly,
          type: expect.file,
          at: { afterAction: type-monthly },
          path: notes.md,
          contains: "- test plan နဲ့ evals ကို အစအဆုံး ပြန် run။",
        }
      - {
          id: sel-rerun,
          type: editor.select,
          at: { mark: sel-rerun },
          target: { file: notes.md, text: "- test plan နဲ့ evals ကို အစအဆုံး ပြန် run။", occurrence: 1 },
        }

  - id: quiz
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ မှာမယ် ကို နှစ်ခါ နှိပ်ရင် အော်ဒါ နှစ်ခု ဖြစ်သွားတဲ့ bug ကို
      ပြီးခဲ့တဲ့ လက ပြင်ခဲ့ပြီး၊ ဖုန်းနဲ့ တစ်ခါ စမ်းကြည့်တော့ မှန်နေခဲ့တယ် ဆိုပါစို့။ ဒီလမှာ agent က တခြား အလုပ်
      တစ်ခုအတွက် order form ကို ပြင်ရင်း အဲဒီ bug ပြန်ပေါ်လာပါတယ်။ factory ထဲမှာ ဘာ လိုနေခဲ့လဲ။ lesson ကို pause
      လုပ်ပြီး စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] အဖြေကတော့ အဲဒီ bug ကို ပြန်ဖမ်းမယ့် test ပါ။
      ဘာကြောင့်လဲဆိုတော့ code ကို ပြင်ခဲ့ပေမဲ့၊ ပြောင်းလဲမှု တိုင်းမှာ အလိုလို run တဲ့ စစ်ချက်ကို line ထဲ
      မထည့်ခဲ့လို့ပါ။ လက်နဲ့ တစ်ခါ စမ်းတာက အဲဒီနေ့ကိုပဲ စစ်ပေးပါတယ်။ အရင် မှန်နေတာ နောက် ပြောင်းလဲမှုကြောင့်
      ပြန်ပျက်တာကို regression လို့ ခေါ်ပြီး၊ bug တစ်ခု ပြင်တိုင်း test တစ်ခု ကျန်ခဲ့မှ ဒါကို ဖမ်းနိုင်ပါတယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The new SDLC (testing; verify fixes against a regression suite)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [z-title, z-q, z-q2],
          drawMs: 1600,
        }
      - {
          id: draw-quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [z-a, z-a-note],
          drawMs: 1200,
        }

  - id: every-change
    narration: >
      [[mark:close-quiz]] ဒါကို notes ရဲ့ နောက်ဆုံး အပိုင်းမှာ ထည့်ပါမယ်။ [[mark:type-every]] ဒီ အပိုင်းက အပတ်နဲ့
      လကို မစောင့်ဘဲ ပြောင်းလဲမှု တစ်ခု ဖြစ်တိုင်း လုပ်ရမယ့် နှစ်ချက်ပါ။ ပထမ တစ်ချက်က flywheel ကို လည်နေစေပြီး၊
      ဒုတိယ တစ်ချက်က document တွေကို app နဲ့ ကိုက်နေစေပါတယ်။ ဒီ နှစ်ချက်ကို ပြောင်းလဲမှု တိုင်းမှာ လုပ်ထားရင်
      အပတ်တိုင်း၊ လတိုင်း အလုပ်တွေ ပေါ့သွားပါတယ်။
    sources:
      - {
          title: "Claude Code docs: Common workflows (handle documentation)",
          url: "https://code.claude.com/docs/en/common-workflows",
        }
      - {
          title: "The New SDLC (Burmese edition): The new SDLC (the quality flywheel)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: close-quiz }, open: false }
      - id: type-every
        type: editor.type
        at: { mark: type-every }
        target: { file: notes.md, after: "- test plan နဲ့ evals ကို အစအဆုံး ပြန် run။\n", occurrence: 1 }
        text: "\n### Every change\n- bug တစ်ခု ပြင်တိုင်း test ဒါမှမဟုတ် rule တစ်ခု ထည့်။\n- agent ကို ဘာပြောင်းလဲ ရှင်းပြခိုင်းပြီး docs ကိုပါ ပြင်ခိုင်း။\n"
        cadence: line-by-line
      - {
          id: expect-every,
          type: expect.file,
          at: { afterAction: type-every },
          path: notes.md,
          contains: "- bug တစ်ခု ပြင်တိုင်း test ဒါမှမဟုတ် rule တစ်ခု ထည့်။",
        }

  - id: recap
    chapter: ပြန်ချုပ်ရရင်
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ ကိုယ့် တကယ့် ထွက်ကုန်က app တစ်ခုတည်း မဟုတ်ဘဲ app ကို ထုတ်ပေးတဲ့ line ပါ။ spec နဲ့
      context ကနေ agent ထုတ်ပေးတာကို test နဲ့ eval တွေနဲ့ စစ်ပြီး၊ မအောင်တာကို ပြန်ပြင်ခိုင်းပါတယ်။ line
      တစ်ခုလုံးကိုတော့ guardrail တွေက ကာထားပါတယ်။ [[mark:rc-every]] failure တိုင်းကို test ဒါမှမဟုတ် rule တစ်ခု
      ဖြစ်အောင် လုပ်ရင် line က တစ်ပတ် လည်တိုင်း ပိုခိုင်လာပါတယ်။ [[mark:rc-clean]] app က customer ဆီ ရောက်မှ
      သက်တမ်းရဲ့ အရှည်ဆုံး အပိုင်းဖြစ်တဲ့ maintenance စတာပါ။ debt ကိုလည်း ထိတိုင်း နည်းနည်းချင်း ဆပ်ပါ။
      [[mark:rc-docs]] app ကို docs၊ decision record နဲ့ test တွေနဲ့ နားလည်လို့ ရနေအောင် ထိန်းပါ။ AI က ကိုယ့်
      အလေ့အထကို ချဲ့ပေးမှာ ဖြစ်လို့ အလေ့အထ ကောင်းတွေကို အရင် ထားပါ။ နောက် lesson မှာတော့ app ရဲ့ တကယ့်
      အကဲဖြတ်သူတွေ ဖြစ်တဲ့ user တွေဆီကနေ ဘယ်လို သင်ယူမလဲ ဆိုတာကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The factory model",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "The New SDLC (Burmese edition): Conclusion",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: rc-every,
          type: editor.select,
          at: { mark: rc-every },
          target:
            { file: notes.md, text: "- bug တစ်ခု ပြင်တိုင်း test ဒါမှမဟုတ် rule တစ်ခု ထည့်။", occurrence: 1 },
        }
      - {
          id: rc-clean,
          type: editor.select,
          at: { mark: rc-clean },
          target: { file: notes.md, text: "- ရှုပ်နေတဲ့ နေရာ တစ်ခုကို နည်းနည်း ရှင်း။", occurrence: 1 },
        }
      - {
          id: rc-docs,
          type: editor.select,
          at: { mark: rc-docs },
          target:
            {
              file: notes.md,
              text: "- docs နဲ့ AGENTS.md ကို app အတိုင်း ဖြစ်အောင် update လုပ်။",
              occurrence: 1,
            },
        }
checks:
  - { type: timing.p95Ms, max: 300 }
