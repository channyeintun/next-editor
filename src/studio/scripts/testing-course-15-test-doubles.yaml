        drawMs: 3500
      - id: draw-spy-mock
        type: whiteboard.apply
        at: { mark: draw-spy-mock }
        upsertIds: [b-spy, b-spy-what, b-spy-tool, b-mock, b-mock-what, b-mock-tool]
        drawMs: 3500
      - id: draw-fake
        type: whiteboard.apply
        at: { mark: draw-fake }
        upsertIds: [b-fake, b-fake-what, b-fake-tool, b-note-box, b-note]
        drawMs: 3500

  - id: what-to-check
    chapter: "ရလဒ်လား၊ ခေါ်ပုံလား"
    narration: >
      [[mark:board-check]] double နဲ့ test ရေးရင် ဘာကို စစ်မလဲ။
      [[mark:draw-state]] တစ်နည်းက ရလဒ်ကို စစ်တာပါ။ စာရွက် နံပါတ်၊ booking ကို ငြင်းတာ ဆိုတာမျိုး
      ဖြစ်ပြီး၊ ဒါကို state verification လို့ ခေါ်ပါတယ်။ [[mark:draw-behaviour]] နောက်တစ်နည်းက double
      ကို ဘယ်လို ခေါ်ခဲ့လဲ စစ်တာ ဖြစ်ပြီး၊ behaviour verification လို့ ခေါ်ပါတယ်။ [[mark:draw-prefer]]
      ဖြစ်နိုင်ရင် ရလဒ်ကို စစ်တာကို ဦးစားပေးပါ။ ခေါ်ပုံကို စစ်တဲ့ test က code ရဲ့ အတွင်းပိုင်းနဲ့
      ကပ်နေလို့၊ ရလဒ် မပြောင်းဘဲ code ကို ပြင်ရုံနဲ့ ကျတတ်ပါတယ်။ ခေါ်တာကိုယ်တိုင်က လုပ်ရမယ့် အလုပ်
      ဖြစ်မှသာ ခေါ်ပုံကို စစ်ပါ။ printer ဆီ စာရွက် ပို့တာက အဲဒီလို အလုပ်မျိုးပါ။ [[mark:draw-warnings]]
      သတိထားစရာ နှစ်ခုလည်း ရှိပါတယ်။ double နဲ့ စစ်တာက ဆိုင်မှာ တကယ် run တဲ့ ပုံစံ မဟုတ်လို့၊
      ဆိုင်ရဲ့ ကွန်ပျူတာမှာ printer အစစ်နဲ့ စစ်တာလို test တစ်ခုကို အနည်းဆုံး ထားပါ။ ပြီးတော့ ကိုယ် စစ်နေတဲ့ code ကိုယ်တိုင်ကို ဘယ်တော့မှ double နဲ့ မလဲပါနဲ့။ ဒါဆို ကိုယ့် code ကို မစစ်ဘဲ အတုကိုပဲ စစ်နေမှာပါ။
    sources:
      - {
          title: "Martin Fowler: Mocks Aren't Stubs, state and behavior verification (facts C08)",
          url: "https://martinfowler.com/articles/mocksArentStubs.html",
        }
      - {
          title: "Gerard Meszaros: Test Double, xUnit Test Patterns (facts C07)",
          url: "http://xunitpatterns.com/Test%20Double.html",
        }
      - {
          title: "Vitest: Writing Tests with AI, testing behavior or implementation",
          url: "https://vitest.dev/guide/learn/writing-tests-with-ai#are-they-testing-behavior-or-implementation",
        }
    actions:
      - id: board-check
        type: whiteboard.apply
        at: { mark: board-check }
        clear: true
        upsertIds: [c-title]
      - id: draw-state
        type: whiteboard.apply
        at: { mark: draw-state }
        upsertIds: [c-state-box, c-state-head, c-state-1, c-state-2]
        drawMs: 3000
      - id: draw-behaviour
        type: whiteboard.apply
        at: { mark: draw-behaviour }
        upsertIds: [c-beh-box, c-beh-head, c-beh-1, c-beh-2]
        drawMs: 3000
      - id: draw-prefer
        type: whiteboard.apply
        at: { mark: draw-prefer }
        upsertIds: [c-prefer, c-prefer-2]
        drawMs: 2500
      - id: draw-warnings
        type: whiteboard.apply
        at: { mark: draw-warnings }
        upsertIds: [c-warn-1, c-warn-2]
        drawMs: 2500

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ dependency အစစ်က နှေးတာ၊ မရှိသေးတာ ဒါမှမဟုတ် စက္ကူ ထွက်တာလို တကယ့်
      အကျိုးဆက် ရှိတာ ဆိုရင်၊ test ထဲမှာ test double နဲ့ အစားထိုးပါတယ်။ dependency ကို အပြင်ကနေ ထည့်ပေးထားရင် code ပြင်စရာ မလိုပါဘူး။ vi fn က stub ရော spy ရော mock ပါ ဖန်တီးပေးပြီး၊ စစ်တဲ့အခါ ရလဒ်ကို ဦးစားပေးပါ။ [[mark:recap-next]] နောက် lesson
      မှာတော့ argument အနေနဲ့ ထည့်ပေးလို့ မရတဲ့ dependency တွေကို၊ ဥပမာ fetch လို global တစ်ခု၊ module
      တစ်ခုလုံး ဒါမှမဟုတ် object ရဲ့ method တစ်ခုကို နေရာမှာတင် အစားထိုးနည်းကို ကြည့်သွားပါမယ်။
    sources:
      - { title: "Vitest: Mock Functions", url: "https://vitest.dev/guide/learn/mock-functions" }
      - {
          title: "web.dev Learn Testing: Welcome (coming soon: test doubles)",
          url: "https://web.dev/learn/testing/welcome",
        }
    actions:
      - id: close-check
        type: whiteboard.apply
        at: { scene: start }
        open: false
checks:
  - { type: timing.p95Ms, max: 300 }
