      - id: expect-fake-test
        type: expect.preview
        at: { afterAction: expect-fake-passed }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-3 }
        attribute: { name: data-name, value: "rejects a second booking" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-fake
        type: editor.select
        at: { mark: read-fake }
        target: { file: src/booking.test.js, text: "createBookings(memoryStore())", occurrence: 1 }
      - id: expect-booking-file
        type: expect.file
        at: { afterAction: select-fake }
        path: src/booking.test.js
        contains: 'const store = { get: vi.fn().mockResolvedValue("အောင်အောင်") };'

  - id: family
    narration: >
      [[mark:board-family]] ခုနက test double တွေကို စုကြည့်ရအောင်။ [[mark:draw-dummy-stub]]
      dummy က ထည့်ပေးရပေမဲ့ မသုံးတဲ့ null လို အရာ ဖြစ်ပြီး၊ stub က ကြိုသတ်မှတ်ထားတဲ့ အဖြေ ပြန်ပေးပါတယ်။ [[mark:draw-spy-mock]] spy က ခေါ်ပုံကို မှတ်ထားပြီး၊ mock ကတော့ ခေါ်ပုံကိုပါ စစ်ပါတယ်။ print အတုကို to Have Been Called With နဲ့ စစ်တော့ mock ပုံစံ ဖြစ်သွားတာပါ။ [[mark:draw-fake]] fake ကတော့ memory store လို တကယ် အလုပ်လုပ်တဲ့ အသေးစား အစားထိုးပါ။ Vitest မှာ vi fn တစ်ခုတည်းက stub ရော spy ရော mock ပါ လုပ်ပေးပြီး၊ dummy နဲ့ fake ကတော့ ရိုးရိုး code ပါ။
    sources:
      - {
          title: "Martin Fowler: Test Double (facts C06)",
          url: "https://martinfowler.com/bliki/TestDouble.html",
        }
      - { title: "Vitest: Mocking", url: "https://vitest.dev/guide/mocking" }
    actions:
      - id: board-family
        type: whiteboard.apply
        at: { mark: board-family }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-dummy-stub
