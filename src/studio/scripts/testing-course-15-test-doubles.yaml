  - id: count
    narration: >
      [[mark:type-count-test]] နောက် test တစ်ခုမှာတော့ စားပွဲ နံပါတ် ၅ နဲ့ ၈ က အော်ဒါ နှစ်ခုကို ဆက်တိုက် ထည့်ပါမယ်။
      [[mark:select-times]] to Have Been Called Times က ဘယ်နှခါ ခေါ်ခံရလဲ ရေတွက်ပြီး၊ အော်ဒါ နှစ်ခုအတွက်
      နှစ်ခါ ဖြစ်ရပါမယ်။ [[mark:select-calls]] mock function တိုင်းမှာ mock calls ဆိုတဲ့ စာရင်း ရှိပြီး၊
      call တစ်ခုစီရဲ့ argument တွေကို အစဉ်လိုက် မှတ်ထားပါတယ်။ ဒီမှာ ဒုတိယ call ရဲ့ ပထမ argument
      ဖြစ်တဲ့ ဒုတိယ စာရွက်က စားပွဲ နံပါတ် ၈ အတွက် ဖြစ်ရမယ်လို့ စစ်ထားပါတယ်။ [[mark:read-count]] test
      လေးခုလုံး pass ဖြစ်ပါပြီ။ mock function တစ်ခုကို test တွေကြား မျှသုံးထားရင်တောင်၊ Vitest ၅ က
      test တိုင်း မစခင် call စာရင်းကို ရှင်းပေးလို့ ရှေ့ test က call တွေ ပါမလာပါဘူး။ clear Mocks ဆိုတဲ့
      option ကို default အနေနဲ့ ဖွင့်ထားလို့ပါ။
    sources:
      - { title: "Vitest: mock.calls", url: "https://vitest.dev/api/mock#mock-calls" }
      - {
          title: "Vitest: expect, toHaveBeenCalledTimes",
          url: "https://vitest.dev/api/expect#tohavebeencalledtimes",
        }
      - { title: "Vitest: clearMocks (facts A09)", url: "https://vitest.dev/config/clearmocks" }
    actions:
      - id: type-count-test
        type: editor.type
        at: { mark: type-count-test }
        target:
          {
            file: src/kitchen.test.js,
            after: "  // expect(print).toHaveBeenCalledWith(order);\n});\n",
            occurrence: 1,
          }
        text: "\ntest(\"prints one ticket per order\", () => {\n  const print = vi.fn();\n  const kitchen = createKitchen({ print });\n\n  kitchen.add({ table: 5, item: \"tea\" });\n  kitchen.add({ table: 8, item: \"coffee\" });\n\n  expect(print).toHaveBeenCalledTimes(2);\n  expect(print.mock.calls[1][0].table).toBe(8);\n});\n"
        cadence: block
      - id: expect-count-passed
        type: expect.preview
        at: { afterAction: type-count-test }
        timeoutMs: 8000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "4" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-count-test
        type: expect.preview
        at: { afterAction: expect-count-passed }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-4 }
        attribute: { name: data-name, value: "prints one ticket per order" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-times
        type: editor.select
        at: { mark: select-times }
        target: { file: src/kitchen.test.js, text: "toHaveBeenCalledTimes(2)", occurrence: 1 }
      - id: select-calls
        type: editor.select
        at: { mark: select-calls }
        target: { file: src/kitchen.test.js, text: "print.mock.calls[1][0].table", occurrence: 1 }
      - id: expect-kitchen-file
        type: expect.file
        at: { afterAction: select-calls }
        path: src/kitchen.test.js
        contains: "  const print = vi.fn();\n  // const print = printTicket;\n"

  - id: stub
    chapter: "Stub၊ fake နဲ့ dummy"
    narration: >
      [[mark:open-booking]] booking ဖိုင်ကို ကြည့်ရအောင်။ သူကလည်း booking တွေ သိမ်းမယ့် store ကို အပြင်ကနေ လက်ခံပြီး၊ ဆိုင်မှာ အဲဒါက database ပါ။ [[mark:select-get]] store ကို
      အရင် မေးပြီး၊ အဲဒီ စားပွဲမှာ အဲဒီ အချိန်အတွက် လူ ရှိပြီးသား ဆိုရင် error throw လုပ်ပါတယ်။
      [[mark:select-memory]] အောက်ဆုံးမှာ booking တွေကို memory ထဲမှာ မှတ်ထားတဲ့ store သေးသေးလေးလည်း ပါပါတယ်။ [[mark:open-booking-test]] test ဖိုင်ကို ဖွင့်ကြည့်ရအောင်။
      [[mark:select-dummy]] ရှိပြီးသား test က စားပွဲ နံပါတ် ၁၃ ကို ငြင်းရမယ်လို့ စစ်ပြီး၊ store နေရာမှာ
      null ကို ထည့်ထားပါတယ်။ ဆိုင်မှာ စားပွဲ ၁၂ လုံးပဲ ရှိလို့၊ code က store ကို မမေးခင်ကတည်းက
      ငြင်းပါတယ်။ ဒီလို ထည့်ပေးရပေမဲ့ ဘယ်တော့မှ မသုံးတဲ့ double ကို dummy လို့ ခေါ်ပါတယ်။
      [[mark:type-stub]] တခြားလူ booking လုပ်ထားပြီးသား စားပွဲကို စစ်ဖို့အတွက်တော့၊ store ကို မေးတဲ့ function ကို mock function နဲ့ အစားထိုးပြီး၊ အောင်အောင် booking လုပ်ထားတယ် ဆိုတဲ့ အဖြေကို ကြိုသတ်မှတ်ပါမယ်။
      [[mark:select-resolved]] mock Resolved Value က ခေါ်တိုင်း ဒီ အဖြေနဲ့ resolve ဖြစ်တဲ့ Promise ကို
      ပြန်ပေးပါတယ်။ async မဟုတ်တဲ့ function ဆိုရင်တော့ mock Return Value ကို သုံးပါတယ်။ ဒီလို
      ကြိုသတ်မှတ်ထားတဲ့ အဖြေကို ပြန်ပေးတဲ့ double ကို stub လို့ ခေါ်ပါတယ်။ [[mark:read-stub]] test
      ငါးခုလုံး pass ဖြစ်ပါပြီ။ stub က အောင်အောင် ရှိတယ်လို့ ဖြေလို့၊ လှလှ ရဲ့ booking ကို code က
      ငြင်းလိုက်တာပါ။
    sources:
      - { title: "Vitest: mockResolvedValue", url: "https://vitest.dev/api/mock#mockresolvedvalue" }
      - {
          title: "Vitest: Mock Functions, mock return values",
          url: "https://vitest.dev/guide/learn/mock-functions#mock-return-values",
        }
      - {
          title: "Martin Fowler: Test Double, dummy and stub (facts C06)",
          url: "https://martinfowler.com/bliki/TestDouble.html",
        }
    actions:
      - id: open-booking
        type: workspace.openFile
        at: { mark: open-booking }
        path: src/booking.js
      - id: select-get
        type: editor.select
        at: { mark: select-get }
        target: { file: src/booking.js, text: "if (await store.get(key)) {", occurrence: 1 }
      - id: select-memory
        type: editor.select
        at: { mark: select-memory }
        target:
          {
            file: src/booking.js,
            text: "export function memoryStore() {\n  const data = new Map();",
            occurrence: 1,
          }
      - id: open-booking-test
        type: workspace.openFile
        at: { mark: open-booking-test }
        path: src/booking.test.js
      - id: select-dummy
        type: editor.select
        at: { mark: select-dummy }
        target: { file: src/booking.test.js, text: "createBookings(null)", occurrence: 1 }
      - id: type-stub
        type: editor.type
        at: { mark: type-stub }
        target:
          {
            file: src/booking.test.js,
            after: "  await expect(booking).rejects.toThrow(\"does not exist\");\n});\n",
            occurrence: 1,
          }
        text: "\ntest(\"rejects a table that is taken\", async () => {\n  const store = { get: vi.fn().mockResolvedValue(\"အောင်အောင်\") };\n  const bookings = createBookings(store);\n\n  const booking = bookings.book(5, \"18:00\", \"လှလှ\");\n  await expect(booking).rejects.toThrow(\"is taken\");\n});\n"
        cadence: block
      - id: expect-stub-passed
        type: expect.preview
        at: { afterAction: type-stub }
        timeoutMs: 8000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "5" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-stub-test
        type: expect.preview
        at: { afterAction: expect-stub-passed }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-2 }
        attribute: { name: data-name, value: "rejects a table that is taken" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-resolved
        type: editor.select
        at: { mark: select-resolved }
        target:
          {
            file: src/booking.test.js,
            text: 'vi.fn().mockResolvedValue("အောင်အောင်")',
            occurrence: 1,
          }

  - id: fake
    narration: >
      [[mark:type-fake]] ဒီတစ်ခါ memory store ကို ထည့်ပေးပြီး၊ အောင်အောင် booking လုပ်ပြီးမှ လှလှ အဲဒီ
      စားပွဲကို အဲဒီ အချိန်မှာ ထပ် booking လုပ်ကြည့်ပါမယ်။ [[mark:read-fake]] test ခြောက်ခုလုံး pass
      ဖြစ်ပါပြီ။ ဒီတစ်ခါ ဘယ် အဖြေကိုမှ ကြိုမသတ်မှတ်ထားဘဲ၊ ပထမ booking ကို store ထဲ တကယ် ရေးပြီး
      ဒုတိယ booking က အဲဒါကို တကယ် ပြန်တွေ့လို့ ငြင်းတာပါ။ ဒီလို အစစ်လို အလုပ်လုပ်တဲ့ ရိုးရှင်းတဲ့ အစားထိုးကို fake လို့ ခေါ်ပြီး၊ ကိုယ်တိုင် ရေးတဲ့ ရိုးရိုး code ပါ။
    sources:
      - {
          title: "Martin Fowler: Test Double, fake (facts C06)",
          url: "https://martinfowler.com/bliki/TestDouble.html",
        }
      - {
          title: "web.dev Learn Testing: Test types, integration tests and fake services",
          url: "https://web.dev/learn/testing/get-started/test-types#integration_tests",
        }
    actions:
      - id: type-fake
        type: editor.type
        at: { mark: type-fake }
        target:
          {
            file: src/booking.test.js,
            after: "  await expect(booking).rejects.toThrow(\"is taken\");\n});\n",
            occurrence: 1,
          }
        text: "\ntest(\"rejects a second booking\", async () => {\n  const bookings = createBookings(memoryStore());\n\n  await bookings.book(5, \"18:00\", \"အောင်အောင်\");\n  const second = bookings.book(5, \"18:00\", \"လှလှ\");\n  await expect(second).rejects.toThrow(\"is taken\");\n});\n"
        cadence: block
      - id: expect-fake-passed
        type: expect.preview
        at: { afterAction: type-fake }
