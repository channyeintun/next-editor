      }
    - {
        id: c-warn-1,
        kind: text,
        x: 290,
        y: 540,
        width: 800,
        height: 40,
        text: "! dependency အစစ်နဲ့ test တစ်ခု ထား",
        strokeColor: "#f08c00",
        fontSize: 28,
      }
    - {
        id: c-warn-2,
        kind: text,
        x: 290,
        y: 588,
        width: 800,
        height: 40,
        text: "! စစ်နေတဲ့ code ကို အတု မလုပ်နဲ့",
        strokeColor: "#f08c00",
        fontSize: 28,
      }
build:
  # Studio replaces this built-in profile at render time with the Burmese provider chosen in the
  # render console (AthanLab with the user's own key, or VoxCPM2 when that feature is enabled).
  voiceProfile: pocket-alba-v1
  seed: 5115
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: open
    chapter: "Test double ဆိုတာ ဘာလဲ"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ ဘာကို အရင် test လုပ်သင့်လဲ၊ function ရဲ့ contract နဲ့
      အစွန်းတွေကို အပြင်ကနေ ဘယ်လို စစ်မလဲ ဆိုတာ ကြည့်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ ကိုယ့် code က
      printer လို၊ database လို တခြား အရာတွေကို မှီခိုနေတဲ့အခါ ဘယ်လို test လုပ်မလဲ ဆိုတာ ကြည့်ပါမယ်။
      [[mark:draw-code]] မီးဖိုချောင်မှာ အော်ဒါ တစ်ခု ဝင်လာတိုင်း၊ ဆိုင်ရဲ့ code က printer ကို ခေါ်ပြီး
      အော်ဒါ စာရွက် ထုတ်ခိုင်းပါတယ်။ ဒီလို ကိုယ့် code အလုပ်လုပ်ဖို့ လိုအပ်တဲ့ တခြား အရာကို
      dependency လို့ ခေါ်ပါတယ်။ [[mark:draw-problems]] test ထဲမှာ printer အစစ်ကို သုံးရင်၊ test run
      တိုင်း စက္ကူ တကယ် ထွက်လာပြီး၊ printer မရှိတဲ့ ကွန်ပျူတာမှာ ဆိုရင် code မှန်နေတာတောင် test က
      ကျသွားပါလိမ့်မယ်။ booking တွေ သိမ်းထားတဲ့ database ကလည်း နှေးနိုင်ပြီး data အစစ်ကို
      ပြောင်းသွားစေနိုင်သလို၊ တချို့ service တွေဆိုရင် မရေးရသေးတာတောင် ဖြစ်နိုင်ပါတယ်။
      [[mark:draw-double]] တကယ်တမ်း စစ်ချင်တာက printer ကိုယ်တိုင် မဟုတ်ဘဲ၊ ကိုယ့် code က မှန်ကန်တဲ့
      စာရွက်ကို printer ဆီ ပို့လား ဆိုတာပါ။ ဒါကြောင့် test လုပ်တဲ့အခါ printer အစစ်အစား၊
      ပို့လာသမျှကို မှတ်ထားပေးတဲ့ အတု တစ်ခုကို ထည့်ပေးပါမယ်။ ဒီလို dependency အစစ်ရဲ့ နေရာမှာ test
      အတွက် အစားထိုး ထည့်တဲ့ အတုကို test double လို့ ခေါ်ပါတယ်။ ရုပ်ရှင်မှာ အန္တရာယ်များတဲ့ အခန်းကို
      မင်းသားအစား၊ သူနဲ့ တူအောင် ပြင်ထားတဲ့ တခြားလူက ဝင်ရိုက်ပေးသလိုပါပဲ။ [[mark:close-board]]
      ဆိုင်ရဲ့ code ကို ကြည့်ရအောင်။ ဒါက kitchen ဖိုင်ပါ။
      [[mark:select-param]] kitchen ကို ဆောက်ပေးတဲ့ ဒီ function က printer ကို သူ့ဘာသာ မဆောက်ဘဲ၊ print
      ဆိုတဲ့ function တစ်ခုကို အပြင်ကနေ လက်ခံပါတယ်။ ဒီလို dependency ကို အထဲမှာ ကိုယ်တိုင်
      မဆောက်ဘဲ အပြင်ကနေ ထည့်ပေးတာကို dependency injection လို့ ခေါ်ပါတယ်။ [[mark:select-print]]
      အော်ဒါ တစ်ခု ထည့်လိုက်တိုင်း၊ နံပါတ် တပ်ထားတဲ့ စာရွက်နဲ့ ဒီ line မှာ print ကို ခေါ်ပါတယ်။
      [[mark:open-test]] ဒါကတော့ kitchen ရဲ့ test ဖိုင်ပါ။ ပထမ စာရွက်ရဲ့ နံပါတ်က ၁ ဖြစ်ရမယ်လို့
      စစ်ထားပါတယ်။ [[mark:select-real]] ဒါပေမဲ့ ဒီ line က printer ဖိုင်ထဲက printer အစစ်ကိုပဲ kitchen
      ဆီ ထည့်ပေးထားပါတယ်။ printer ဖိုင်က ဆိုင်ရဲ့ ကွန်ပျူတာမှာ printer ချိတ်ထားမှ အလုပ်လုပ်ပြီး၊
      တခြား နေရာမှာ ဆိုရင် error throw လုပ်ပါတယ်။
    sources:
      - {
          title: "web.dev Learn Testing: Component testing in practice, Mock fetch (what mocking is)",
          url: "https://web.dev/learn/testing/get-started/component-testing#mock_fetch",
        }
      - {
          title: "web.dev Learn Testing: Welcome (coming soon: test doubles)",
          url: "https://web.dev/learn/testing/welcome",
        }
      - {
          title: "Martin Fowler: Test Double (facts C06)",
          url: "https://martinfowler.com/bliki/TestDouble.html",
        }
      - { title: "Vitest: Mock Functions", url: "https://vitest.dev/guide/learn/mock-functions" }
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-code
        type: whiteboard.apply
        at: { mark: draw-code }
        upsertIds: [a-code-box, a-code, a-arrow, a-dep-box, a-dep]
        drawMs: 3000
      - id: draw-problems
        type: whiteboard.apply
        at: { mark: draw-problems }
        upsertIds: [a-prob-1, a-prob-2, a-prob-3]
        drawMs: 4500
      - id: draw-double
        type: whiteboard.apply
        at: { mark: draw-double }
        upsertIds: [a-double-box, a-double-1, a-double-2]
        drawMs: 3500
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: select-param
        type: editor.select
        at: { mark: select-param }
        target: { file: src/kitchen.js, text: "createKitchen({ print })", occurrence: 1 }
      - id: select-print
        type: editor.select
        at: { mark: select-print }
        target: { file: src/kitchen.js, text: "print(ticket);", occurrence: 1 }
      - id: open-test
        type: workspace.openFile
        at: { mark: open-test }
        path: src/kitchen.test.js
      - id: select-real
        type: editor.select
        at: { mark: select-real }
        target: { file: src/kitchen.test.js, text: "const print = printTicket;", occurrence: 1 }

  - id: panel
    narration: >
      [[mark:ready]] code ပြောင်းတိုင်း Vitest က သူ့ဘာသာ ပြန် run ပြီး ရလဒ်ကို ပြပေးတဲ့ panel ကို
      ကြည့်ရအောင်။ [[mark:read-red]] booking test က pass ဖြစ်နေပေမဲ့၊ kitchen test ကတော့ ကြက်ခြေခတ်နဲ့
      fail ဖြစ်ပြီး၊ Failed Tests အပိုင်းမှာ မီးဖိုချောင် printer ကို ချိတ်မထားဘူး ဆိုတဲ့ error ကို
      ပြနေပါတယ်။ [[mark:read-stack]] code frame က printer ဖိုင်ထဲက line ကို ညွှန်ပြပြီး၊ သူ့အောက်မှာ kitchen ကနေ ခေါ်သွားတဲ့ လမ်းကြောင်းကို ပြပေးပါတယ်။ ဆိုလိုတာက
      kitchen ရဲ့ code မှားလို့ မဟုတ်ဘဲ၊ printer အစစ် မရှိလို့ test က ကျနေတာပါ။
    sources:
      - {
          title: "Vitest: Writing Tests, reading test output",
          url: "https://vitest.dev/guide/learn/writing-tests#reading-test-output",
        }
      - {
          title: "web.dev Learn Testing: Test types, integration tests and fake services",
          url: "https://web.dev/learn/testing/get-started/test-types#integration_tests",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-start-fail
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 3, delayMs: 1000 }
      - id: expect-start-count
        type: expect.preview
        at: { afterAction: expect-start-fail }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-failed, value: "1" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-message
        type: expect.preview
        at: { afterAction: expect-start-count }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-message, value: "the kitchen printer is not connected" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-frame
        type: expect.preview
        at: { afterAction: expect-start-message }
        timeoutMs: 5000
        target: { by: testId, value: vt-frame-1 }
        attribute: { name: data-file, value: src/printer.js }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: spy
    chapter: "Mock function နဲ့ vi.fn"
    narration: >
      [[mark:type-fn]] printer အစစ်ရဲ့ နေရာမှာ အတုကို ထည့်ကြည့်ရအောင်။ vi ဆိုတာ test double တွေ
      ဖန်တီးဖို့ Vitest က ပေးထားတဲ့ helper object ဖြစ်ပြီး၊ ဖိုင်ရဲ့ ထိပ်မှာ import လုပ်ထားပြီးသားပါ။
      vi fn က mock function တစ်ခုကို ဖန်တီးပေးပါတယ်။ သူ့ကို ခေါ်ရင် undefined ပဲ ပြန်ပေးပေမဲ့၊
      ဘယ်နှခါ ခေါ်ခံရလဲ၊ ဘယ် argument တွေနဲ့ ခေါ်ခံရလဲ ဆိုတာကိုတော့ အကုန် မှတ်ထားပါတယ်။ line
      အဟောင်းကိုတော့ comment အဖြစ် ချန်ထားပါတယ်။ [[mark:read-green]] panel ကို ကြည့်ပါ။ kitchen test
      လည်း pass ဖြစ်သွားပြီး၊ အပေါ်မှာ အစိမ်းရောင် PASS ပေါ်လာပါပြီ။ kitchen ရဲ့ code ကို
      တစ်လုံးမှ မပြင်ခဲ့ပါဘူး။ printer ကို အပြင်ကနေ လက်ခံထားလို့၊ test ကနေ အတုကို
      ထည့်ပေးလိုက်ရုံပါပဲ။
    sources:
      - { title: "Vitest: vi.fn", url: "https://vitest.dev/api/vi#vi-fn" }
      - { title: "Vitest: Mocking Functions", url: "https://vitest.dev/guide/mocking/functions" }
      - {
          title: "web.dev Learn Testing: What to test, opaque versus clear box (callbacks and mocks)",
          url: "https://web.dev/learn/testing/get-started/what-to-test",
        }
    actions:
      - id: type-fn
        type: editor.type
        at: { mark: type-fn }
        target:
          {
            file: src/kitchen.test.js,
            after: "test(\"numbers the tickets from 1\", () => {\n  ",
            occurrence: 1,
          }
        text: "const print = vi.fn();\n  // "
      - id: expect-green
        type: expect.preview
        at: { afterAction: type-fn }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-green-count
        type: expect.preview
        at: { afterAction: expect-green }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "2" }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: calls
    narration: >
      စာရွက်ကို printer ဆီ ပို့တာကလည်း kitchen ရဲ့ အလုပ် ဖြစ်ပါတယ်။ [[mark:type-call-test]] ဒီ test က စားပွဲ နံပါတ် ၅ က လက်ဖက်ရည် မှာတဲ့ အော်ဒါကို ထည့်ပြီး၊ printer ဆီ ဘာ ရောက်သွားလဲ စစ်ပါတယ်။ [[mark:select-name]] mock function ကိုတော့ mock Name နဲ့ print လို့ နာမည် ပေးထားပါတယ်။ test ကျရင်
      message မှာ ဒီ နာမည်နဲ့ ပြပေးလို့ ဖတ်ရတာ ပိုရှင်းပါတယ်။ [[mark:select-called-with]] to Have Been
      Called With က mock function ကို ဒီ argument နဲ့ ခေါ်ခဲ့လားလို့ စစ်ပါတယ်။ kitchen က စာရွက်မှာ
      နံပါတ် ထပ်တပ်မယ် ဆိုတာ သိပေမဲ့၊ call မကိုက်ရင် Vitest က ဘယ်လို ပြလဲ မြင်ရအောင်၊ အော်ဒါ
      အတိုင်း အတိအကျ ဖြစ်ရမယ်လို့ တမင် စစ်ထားပါတယ်။ [[mark:read-call-red]] test အသစ်က fail
      ဖြစ်ပါပြီ။ message က print ကို ဒီ argument နဲ့ ခေါ်ရမယ်လို့ ပြောပြီး၊ Received အပိုင်းမှာ print
      ရဲ့ ပထမ call ကို ပြထားပါတယ်။ printer ဆီ ရောက်သွားတဲ့ စာရွက်မှာ နံပါတ် ၁ ဆိုတဲ့ field တစ်ခု
      ပိုပါနေပြီး၊ print ကို တစ်ခါ ခေါ်ခဲ့တယ်လို့လည်း ပြနေပါတယ်။ [[mark:decide]] နံပါတ် တပ်တာက
      kitchen ရဲ့ အလုပ်ပဲ ဖြစ်ပြီး၊ ပထမ test က စစ်ပြီးသားပါ။ ဒီ test က ဘယ် စားပွဲက ဘာ မှာလဲ ဆိုတာ
      printer ဆီ ရောက်လား ဆိုတာကိုပဲ စစ်ချင်တာ ဖြစ်လို့၊ ပြီးခဲ့တဲ့ lesson ကလို လိုတာထက်
      ပိုမစစ်သင့်ပါဘူး။ [[mark:type-containing]] ဒါကြောင့် ဒီ line ကို object Containing နဲ့ အစားထိုးပြီး၊ line အဟောင်းကို comment အဖြစ် ချန်ထားပါမယ်။ [[mark:select-containing]] object Containing က ပေးထားတဲ့ field တွေ ပါလားလို့ပဲ
      စစ်ပြီး၊ ပိုပါနေတဲ့ field တွေကိုတော့ ဂရုမစိုက်ပါဘူး။ [[mark:read-call-green]] test သုံးခုလုံး pass
      ဖြစ်သွားပါပြီ။
    sources:
      - {
          title: "Vitest: expect, toHaveBeenCalledWith",
          url: "https://vitest.dev/api/expect#tohavebeencalledwith",
        }
      - {
          title: "Vitest: expect.objectContaining",
          url: "https://vitest.dev/api/expect#expect-objectcontaining",
        }
      - { title: "Vitest: mockName", url: "https://vitest.dev/api/mock#mockname" }
      - {
          title: "Kent C. Dodds: Testing Implementation Details (facts C13)",
          url: "https://kentcdodds.com/blog/testing-implementation-details",
        }
    actions:
      - id: type-call-test
        type: editor.type
        at: { mark: type-call-test }
        target:
          { file: src/kitchen.test.js, after: "  expect(ticket.no).toBe(1);\n});\n", occurrence: 1 }
        text: "\ntest(\"prints the order on a ticket\", () => {\n  const print = vi.fn().mockName(\"print\");\n  const kitchen = createKitchen({ print });\n  const order = { table: 5, item: \"tea\" };\n\n  kitchen.add(order);\n\n  expect(print).toHaveBeenCalledWith(order);\n});\n"
        cadence: block
      - id: expect-call-red
        type: expect.preview
        at: { afterAction: type-call-test }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-call-red-count
        type: expect.preview
