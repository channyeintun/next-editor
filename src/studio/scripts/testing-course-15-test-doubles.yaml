      package.json: |
        {
          "name": "testing-course-tea-shop",
          "private": true,
          "version": "1.0.0",
          "type": "module",
          "scripts": {
            "dev": "vite --host 0.0.0.0 --port 5173 --strictPort",
            "test": "vitest"
          },
          "devDependencies": {
            "vite": "7.3.7",
            "vitest": "5.1.0"
          }
        }
      src/booking.js: |
        // `store` is where the bookings are kept: the shop's database in the
        // real app, or memoryStore() below.
        export function createBookings(store) {
          return {
            async book(table, time, customer) {
              if (table < 1 || table > 12) {
                throw new Error(`table ${table} does not exist`);
              }
              const key = `${table}@${time}`;
              if (await store.get(key)) {
                throw new Error(`table ${table} is taken at ${time}`);
              }
              await store.set(key, customer);
              return { table, time, customer };
            },
          };
        }

        // Keeps the bookings in a Map in memory instead of a database.
        export function memoryStore() {
          const data = new Map();
          return {
            get: async (key) => data.get(key),
            set: async (key, value) => void data.set(key, value),
          };
        }
      src/booking.test.js: |
        import { expect, test, vi } from "vitest";
        import { createBookings, memoryStore } from "./booking.js";

        test("rejects table 13", async () => {
          const bookings = createBookings(null);

          const booking = bookings.book(13, "18:00", "လှလှ");
          await expect(booking).rejects.toThrow("does not exist");
        });
      src/kitchen.js: |
        export function createKitchen({ print }) {
          const queue = [];
          let lastNo = 0;
          return {
            add(order) {
              lastNo += 1;
              const ticket = { no: lastNo, ...order };
              queue.push(ticket);
              print(ticket);
              return ticket;
            },
            next: () => queue.shift(),
            size: () => queue.length,
          };
        }
      src/kitchen.test.js: |
        import { expect, test, vi } from "vitest";
        import { createKitchen } from "./kitchen.js";
        import { printTicket } from "./printer.js";

        test("numbers the tickets from 1", () => {
          const print = printTicket;
          const kitchen = createKitchen({ print });

          const ticket = kitchen.add({ table: 5, item: "tea" });

          expect(ticket.no).toBe(1);
        });
      src/printer.js: |
        // Sends a ticket to the printer in the kitchen. The printer is plugged
        // into the shop's own computer; anywhere else it is not connected.
        export function printTicket(ticket) {
          throw new Error("the kitchen printer is not connected");
        }
      vite.config.js: |
        import { defineConfig } from "vite";
        import courseVitestBridge from "./course/vitest-bridge.js";

        // The course panel: the dev server runs the real Vitest and the preview shows its results.
        export default defineConfig({
          plugins: [courseVitestBridge()],
        });
      vitest.config.js: |
        import { defineConfig } from "vitest/config";

        export default defineConfig({
          test: {
          },
        });
