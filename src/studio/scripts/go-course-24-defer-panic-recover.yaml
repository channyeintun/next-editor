# Go course, lesson 24: defer, panic and recover (Burmese).
#
# Start state: main.go with `package main`, an import block holding only "fmt" ("strings" arrives
# as one inserted line at run-2) and an empty `func main`.
# Edits, all insert-only (canonical states: probes 23b-defer, 23b-panic, 23b-recover):
#   1. closeDay with two defers (lock the store room, then hand in the cash) and its call in main
#      -> run-1: ငွေကို အပ် / ပစ္စည်း အခန်းကို သော့ခတ် (the reverse of the written order);
#      then the doc comment above closeDay;
#   2. the day loop over three tracking codes (one typed without its dash) printing the part after
#      the dash inline in main, before closeDay(), + "strings" -> run-2 ✗ panic
#      `index out of range [1] with length 1` at main.go:16; closeDay never ran;
#   3. safely(code, work func()) (work() first, then the deferred recover), and the loop's print
#      line wrapped in `safely(code, func() {` … `})` -> run-3: 0001 / NPT0002 ပြဿနာ: … /
#      0003 / both deferred lines (5 lines).
# Boards: (D) defers as a stack of plates, taken from the top; (P) three parcels, the bad one
# panics, a recover net under each parcel's work, recover only inside a defer; (Q) the quiz
# (an early return: does the deferred line still run?).
# Fixtures: bun ~/Documents/go-course-work/tools/sim-go.ts <this yaml> --write
