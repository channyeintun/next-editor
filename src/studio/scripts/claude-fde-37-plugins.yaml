build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 9337

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: need
    chapter: Copy ကူးထားတဲ့ setup
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ လူ မစောင့်ကြည့်ခဲ့တဲ့ run တစ်ခု ပြီးရင်၊ report ထဲက စာကြောင်းကို မယုံဘဲ ပြောင်းလဲမှုနဲ့ test
      output ကိုယ်တိုင်ကနေ ဘယ်လို စစ်ရမလဲ လေ့လာခဲ့ပါတယ်။
      [[mark:n-open]] Billing team မှာ Claude Code နဲ့ အလုပ်လုပ်ဖို့ ပြင်ဆင်ထားတာတွေ တဖြည်းဖြည်း များလာပါပြီ။ Claude Code
      ဆိုတာ terminal ထဲကနေ code ကို ဖတ်၊ ပြင်၊ command run ပေးတဲ့ coding agent ပါ။ ဒီအပတ်မှာ Network Tools team ကလည်း
      Billing team သုံးနေတဲ့ setup အတိုင်း သုံးချင်တယ်လို့ ပြောလာပါတယ်။ အဲဒီ setup ထဲက အဓိက နှစ်ခုကို ကြည့်ရအောင်။
      [[mark:sel-agent]] ပထမ တစ်ခုက test-runner ဆိုတဲ့ subagent ပါ။ subagent ဆိုတာ အလုပ် တစ်ပိုင်းကို သီးသန့် context
      နဲ့ လုပ်ပေးတဲ့ လက်ထောက် agent ပါ။ ဒီ subagent က test တွေကို run ပြီး၊ ကျရှုံးတဲ့ test တွေကိုပဲ တိုတိုလေး
      ပြန်ပြောပေးပါတယ်။
      [[mark:open-hooks]] ဒုတိယ တစ်ခုက hook ပါ။ hook ဆိုတာ Claude Code ရဲ့ အဆင့် တစ်ခုခုမှာ အလိုအလျောက် run တဲ့
      ကိုယ့် command ပါ။
      [[mark:sel-hook]] ဒီ hook က Claude Code shell command တစ်ခု မ run ခင်တိုင်း စစ်ပြီး၊ database migration ဆိုရင်
      ပိတ်လိုက်ပါတယ်။ နေခြည် မှာ migration တွေကို platform team ကပဲ လုပ်တာမို့ပါ။
      [[mark:n-drift]] Network Tools ဘက်က developer တစ်ယောက်က နှစ်ပတ်လောက် အရင်က Billing ရဲ့ folder တွေကို လက်နဲ့
      copy ကူးသွားခဲ့ပါတယ်။ အဲဒီနောက် Billing က subagent ရဲ့ ညွှန်ကြားချက်ကို ပြင်ခဲ့ပေမဲ့၊ Network Tools ဆီမှာတော့
      အဟောင်းအတိုင်း ကျန်နေပါတယ်။ migration ကို ပိတ်တဲ့ hook ကလည်း settings file ထဲမှာ ရှိနေတာမို့ ကူးဖို့
      ကျန်ခဲ့ပါတယ်။
      [[mark:n-want]] ဆိုတော့ team နှစ်ခုရဲ့ setup က ဘယ်သူမှ မသိလိုက်ဘဲ ကွဲသွားပါပြီ။ ကိုယ်တို့ လိုချင်တာက ဒီ setup ကို
      တစ်နေရာတည်းမှာ ထိန်းပြီး၊ ဘယ် team မဆို တစ်ပုံစံတည်း install လုပ်လို့ ရတာပါ။
    sources:
      - {
          title: "Claude Code Docs: Create plugins",
          url: "https://code.claude.com/docs/en/plugins/create",
        }
    actions:
      - {
          id: open-agent,
          type: workspace.openFile,
          at: { mark: n-open },
          path: naychi-plugin/agents/test-runner.md,
        }
      - id: sel-agent
        type: editor.select
        at: { mark: sel-agent }
        target:
          file: naychi-plugin/agents/test-runner.md
          text: "description: Runs npm test and reports only the failing tests. Use proactively after edits."
      - {
          id: open-hooks,
          type: workspace.openFile,
          at: { mark: open-hooks },
          path: naychi-plugin/hooks/hooks.json,
        }
      - id: sel-hook
        type: editor.select
        at: { mark: sel-hook }
        target:
          file: naychi-plugin/hooks/hooks.json
          text: '"PreToolUse": ['

  - id: bundle
    chapter: Plugin တစ်ထုပ်
    narration: >
      [[mark:b-open]] plugin ဆိုတာ ဒီ ပြဿနာအတွက်ပါ။ plugin ဆိုတာ skill၊ agent၊ hook၊ MCP server တွေကို တစ်ထုပ်တည်း
      ထုပ်ပြီး install လုပ်လို့ရအောင် လုပ်ထားတာပါ။ တကယ်တော့ folder တစ်ခုပဲ ဖြစ်ပြီး၊ အဲဒီ folder တစ်ခုလုံးကို
      အစုတစ်ခုအနေနဲ့ install လုပ်၊ load လုပ်ပါတယ်။
      [[mark:b-parts]] အထဲမှာ ထည့်လို့ရတဲ့ အပိုင်း လေးမျိုး ရှိပါတယ်။ agent နဲ့ hook ကိုတော့ ခုနက မြင်ခဲ့ပါပြီ။ skill
      ဆိုတာ အလုပ် တစ်မျိုးကို ဘယ်လို လုပ်ရမလဲ ရေးထားပြီး၊ လိုတဲ့အချိန်မှ Claude ဖတ်သုံးတဲ့ လမ်းညွှန်ပါ။ MCP server
      ကတော့ Model Context Protocol၊ အတိုကောက် MCP နဲ့ Claude ကို အပြင်က system တွေနဲ့ ချိတ်ပေးတဲ့ program ပါ။ ဒီ
      နှစ်မျိုးကို နောက် lesson တွေမှာ အသေးစိတ် လေ့လာမှာ ဖြစ်ပြီး၊ ရလာရင် ဒီ plugin ထဲကိုပဲ ထပ်ထည့်ရုံပါ။
      [[mark:b-pack]] ဒီ အပိုင်းတွေကို naychi-dev ဆိုတဲ့ plugin တစ်ခုထဲ စုထည့်ပါမယ်။ setup ကို ပြင်ချင်ရင် ဒီ plugin
      တစ်ခုကိုပဲ ပြင်ရတော့မှာပါ။
      [[mark:b-out]] ပြီးရင် Billing ရော Network Tools ပါ အဲဒီ plugin တစ်ခုတည်းကို install လုပ်ပါတယ်။ copy နှစ်ခု
      မရှိတော့တာမို့ တစ်ခုနဲ့တစ်ခု ကွဲသွားစရာလည်း မရှိတော့ပါဘူး။
      [[mark:b-cost]] သတိထားရမှာ နှစ်ခု ရှိပါတယ်။ plugin ကို enable လုပ်ထားရင် အထဲက skill နဲ့ agent တွေရဲ့ description
      က session တိုင်းရဲ့ context ထဲ ဝင်သွားပါတယ်။ ဒါကြောင့် team အားလုံး တကယ် လိုတာကိုပဲ ထည့်ပါ။
      [[mark:b-you]] နောက်တစ်ခုက plugin က ကိုယ့်ကိုယ်စား၊ ကိုယ့် ခွင့်ပြုချက်တွေနဲ့ run တာပါ။ ဒါကြောင့် plugin ထဲ
      ဘာထည့်ထားလဲ ဆိုတာကို code တစ်ခုလိုပဲ review လုပ်ပြီးမှ ထုတ်ရပါတယ်။
    sources:
      - {
          title: "Claude Code Docs: Plugins overview",
          url: "https://code.claude.com/docs/en/plugins/overview",
        }
      - {
          title: "Claude Code Docs: Create plugins",
          url: "https://code.claude.com/docs/en/plugins/create",
        }
    actions:
      - {
          id: draw-b-open,
          type: whiteboard.apply,
          at: { mark: b-open },
          open: true,
          clear: true,
          upsertIds: [b-title],
        }
      - {
          id: draw-b-parts,
          type: whiteboard.apply,
          at: { mark: b-parts },
          upsertIds: [b-p1, b-p2, b-p3, b-p4],
          drawMs: 1800,
        }
      - {
          id: draw-b-pack,
          type: whiteboard.apply,
          at: { mark: b-pack },
          upsertIds: [b-brace, b-plugin, b-plugin-l],
          drawMs: 1500,
        }
      - {
          id: draw-b-out,
          type: whiteboard.apply,
          at: { mark: b-out },
          upsertIds: [b-a1, b-t1, b-a2, b-t2],
          drawMs: 1800,
        }
      - {
          id: draw-b-cost,
          type: whiteboard.apply,
          at: { mark: b-cost },
          upsertIds: [b-cost],
          drawMs: 1000,
        }
      - {
          id: point-b-you,
          type: whiteboard.point,
          at: { mark: b-you },
          target: { assetId: b-plugin },
        }

  - id: manifest
    chapter: Manifest
    narration: >
      [[mark:l-close]] plugin folder ရဲ့ ပုံစံကို ကြည့်ရအောင်။ folder ရဲ့ အပေါ်ဆုံးမှာ claude plugin ဆိုတဲ့ folder
      တစ်ခု ရှိပြီး၊ အထဲမှာ manifest file တစ်ခုတည်းပဲ ထားရပါတယ်။ manifest ဆိုတာ plugin ရဲ့ နာမည်နဲ့ အချက်အလက်တွေကို
      Claude Code ကို ပြောပြတဲ့ file ပါ။ agent တွေ၊ hook တွေ၊ skill တွေကတော့ အမျိုးအစားအလိုက် folder တစ်ခုစီနဲ့
      plugin folder အောက်မှာ ထားရပါတယ်။ manifest ရှိတဲ့ folder ထဲ ထည့်မိရင် load မဖြစ်ပါဘူး။
      [[mark:type-name]] manifest မှာ မဖြစ်မနေ လိုတာ name တစ်ခုပဲ ရှိပါတယ်။ ဒီ name က plugin ထဲက agent နဲ့ skill တိုင်းရဲ့
      ရှေ့ဆက် ဖြစ်လာပါတယ်။ ဒါကြောင့် install လုပ်ပြီးရင် test-runner agent ကို naychi-dev ရှေ့ဆက်နဲ့ ခေါ်ရပါတယ်။ team
      တစ်ခုခုမှာ နာမည်တူ agent ရှိနေရင်တောင် မရောတော့ပါဘူး။
      [[mark:type-desc]] description ကတော့ plugin က ဘာတွေ ပေးလဲ ဆိုတာကို တိုတိုပြောတာပါ။ install လုပ်မယ့်သူက ဒီ
      စာကြောင်းကို ဖတ်ပြီး ဆုံးဖြတ်တာမို့၊ ပါတဲ့ အပိုင်းတွေကို နာမည်နဲ့ ရေးထားပါတယ်။
      [[mark:type-version]] version က ဒီ plugin ရဲ့ ထုတ်ဝေမှု နံပါတ်ပါ။ ပထမဆုံး ထုတ်တာမို့ version တစ်လို့ ပေးထားပါတယ်။
      [[mark:type-author]] author မှာတော့ ဒီ plugin ကို ဘယ်သူ ထိန်းလဲ ရေးထားပါတယ်။ Billing team lead မောင်မောင် ရဲ့
      team က ထိန်းမှာမို့၊ ပြင်စေချင်တာ ရှိရင် ဘယ်သူ့ကို ပြောရမလဲ ဆိုတာ ဒီကနေ သိရပါတယ်။
      [[mark:l-twice]] hook ကို Billing ရဲ့ settings file ကနေ plugin ထဲ ရွှေ့ပြီးရင် settings file ထဲက မူရင်းကို
      ဖျက်ရပါမယ်။ agent နဲ့ skill တွေလို hook မှာ ရှေ့ဆက် မရှိတာမို့၊ နှစ်နေရာလုံးမှာ ကျန်နေရင် event တစ်ခါ ဖြစ်တိုင်း
      နှစ်ခါ run လို့ပါ။
      [[mark:l-test]] ထုတ်မပေးခင် manifest ကို validate command နဲ့ စစ်ပြီး၊ ဒီ folder ကို session တစ်ခုအတွက်ပဲ load
      လုပ်ကာ စမ်းကြည့်လို့ ရပါတယ်။
    sources:
      - {
          title: "Claude Code Docs: Create plugins",
          url: "https://code.claude.com/docs/en/plugins/create",
        }
      - {
          title: "Claude Code Docs: Plugin manifest reference",
          url: "https://code.claude.com/docs/en/plugins/manifest-reference",
        }
    actions:
      - { id: close-bundle, type: whiteboard.apply, at: { mark: l-close }, open: false }
      - {
          id: open-manifest,
          type: workspace.openFile,
          at: { afterAction: close-bundle },
          path: naychi-plugin/.claude-plugin/plugin.json,
        }
      - id: type-name
        type: editor.type
        at: { mark: type-name }
        cadence: line-by-line
        target: { file: naychi-plugin/.claude-plugin/plugin.json, after: "{\n" }
        text: "  \"name\": \"naychi-dev\",\n"
      - id: type-desc
        type: editor.type
        at: { mark: type-desc }
        cadence: line-by-line
        target: { file: naychi-plugin/.claude-plugin/plugin.json, after: "\"naychi-dev\",\n" }
        text: "  \"description\": \"Naychi Fiber dev setup: test-runner agent, migration guard hook\",\n"
      - id: type-version
        type: editor.type
        at: { mark: type-version }
        cadence: line-by-line
        target:
          { file: naychi-plugin/.claude-plugin/plugin.json, after: "migration guard hook\",\n" }
        text: "  \"version\": \"1.0.0\",\n"
      - id: type-author
        type: editor.type
        at: { mark: type-author }
        cadence: line-by-line
        target: { file: naychi-plugin/.claude-plugin/plugin.json, after: "\"1.0.0\",\n" }
        text: "  \"author\": { \"name\": \"Naychi Fiber Billing team\" }\n"
      - id: expect-name
        type: expect.file
        at: { afterAction: type-author }
        path: naychi-plugin/.claude-plugin/plugin.json
        contains: "  \"name\": \"naychi-dev\",\n"
      - id: sel-name
        type: editor.select
        at: { mark: l-twice }
        target:
          file: naychi-plugin/.claude-plugin/plugin.json
          text: '"name": "naychi-dev"'

  - id: screen
    chapter: Marketplace
    narration: >
      [[mark:m-open]] plugin တွေကို ဘယ်ကနေ ရှာပြီး install လုပ်လဲ ဆိုတာကို Claude Code ရဲ့ plugin command နဲ့ ကြည့်ရအောင်။
      ဒီလို မြင်ရပါတယ်။
      [[mark:m-view]] ဒါက plugin တွေကို စီမံတဲ့ view ပါ။ ရှာဖို့၊ install လုပ်ထားတာ ကြည့်ဖို့၊ marketplace တွေကို
      စီမံဖို့နဲ့ error တွေ ကြည့်ဖို့ tab တွေ ခွဲထားပါတယ်။
      [[mark:m-disc]] Discover tab မှာ ရှာလို့ရတဲ့ plugin စာရင်း ပေါ်ပါတယ်။ ဒီ စာရင်းက Anthropic ရဲ့ တရားဝင် marketplace
      ကပါ။ အဲဒီ marketplace ကို interactive terminal session ကို ပထမဆုံး ဖွင့်တဲ့အခါ အလိုအလျောက် ထည့်ပေးထားပါတယ်။
      [[mark:m-item]] စာရင်းထဲက plugin တစ်ခုစီမှာ နာမည်၊ ဘယ် marketplace ကလဲ ဆိုတာနဲ့ description ပါပါတယ်။ ခုနက
      ကိုယ်တို့ ရေးခဲ့တဲ့ description လိုမျိုးပါ။
      [[mark:m-market]] marketplace ဆိုတာ plugin တွေရဲ့ စာရင်းကို file တစ်ခုနဲ့ ထားတဲ့ repository ဒါမှမဟုတ် folder ပါ။
      ပစ္စည်း ရောင်းတဲ့ ဆိုင် မဟုတ်ဘဲ catalog တစ်ခုပါ။ ဒါကြောင့် နေခြည် ကလည်း company ရဲ့ marketplace repository
      တစ်ခု လုပ်ပြီး၊ naychi-dev ကို အဲဒီ စာရင်းထဲ ထည့်ထားလို့ ရပါတယ်။
    sources:
      - {
          title: "Claude Code Docs: Discover and install plugins",
          url: "https://code.claude.com/docs/en/plugins/install",
        }
      - {
          title: "Claude Code Docs: Create and distribute a plugin marketplace",
          url: "https://code.claude.com/docs/en/plugins/create-marketplace",
        }
    actions:
      - {
          id: show-plugin,
          type: slide.show,
          at: { mark: m-open, offsetMs: -1200 },
          slideId: plugin-screen,
        }
      - { id: pt-view, type: slide.point, at: { mark: m-view }, target: { x: 0.150, y: 0.259 } }
      - { id: pt-disc, type: slide.point, at: { mark: m-disc }, target: { x: 0.171, y: 0.319 } }
      - { id: pt-item, type: slide.point, at: { mark: m-item }, target: { x: 0.199, y: 0.470 } }
      - { id: pt-market, type: slide.point, at: { mark: m-market }, target: { x: 0.428, y: 0.259 } }

  - id: rollout
    chapter: Team တစ်ခုလုံးဆီ
    narration: >
      [[mark:r-open]] ကျန်တဲ့ မေးခွန်းက team တစ်ခုလုံးက plugin တစ်ခုတည်းကို ဘယ်လို သုံးလာမလဲ ဆိုတာပါ။
      [[mark:r-1]] ပထမ အဆင့်က marketplace ပါ။ နေခြည် ရဲ့ marketplace repository ထဲမှာ catalog file တစ်ခု ထားပြီး၊
      naychi-dev plugin ဘယ်မှာ ရှိလဲ ဆိုတာ ရေးထားပါတယ်။
      [[mark:r-2]] ဒုတိယ အဆင့်က repository တစ်ခုစီရဲ့ shared project settings ပါ။ အဲဒီမှာ ဘယ် marketplace ကို
      သိထားရမလဲ၊ ဘယ် plugin ကို enable လုပ်မလဲ ဆိုတာ ရေးပြီး commit လုပ်ထားပါတယ်။ ဒီ setting တွေက workspace trust
      ကို လက်ခံပြီးမှ အလုပ်လုပ်ပါတယ်။ workspace trust ဆိုတာ ဒီ folder ကို ယုံကြည်ပါတယ်လို့ developer က ကိုယ်တိုင်
      လက်ခံရတဲ့ မေးခွန်းပါ။
      [[mark:r-3]] တတိယ အဆင့်ကတော့ developer တစ်ယောက်စီက plugin install command ကို project scope နဲ့ တစ်ခါ run
      တာပါ။ project scope ဆိုတာ repository ကို သုံးတဲ့ လူတိုင်းအတွက်ပါ။ user scope က ကိုယ့် project အားလုံးအတွက်ဖြစ်ပြီး၊
      local scope ကတော့ ဒီ repository မှာ ကိုယ်တစ်ယောက်တည်းအတွက်ပါ။
      [[mark:r-org]] ကုမ္ပဏီ တစ်ခုလုံး အတိုင်းအတာနဲ့ဆိုရင်တော့ managed settings ကို သုံးနိုင်ပါတယ်။ managed settings
      ဆိုတာ user တွေ ပြင်လို့ မရတဲ့ အဖွဲ့အစည်းရဲ့ policy ပါ။ အဲဒီကနေ plugin တစ်ခုကို မဖြစ်မနေ install လုပ်ခိုင်းတာ၊
      ပိတ်ထားတာနဲ့ ခွင့်ပြုထားတဲ့ marketplace စာရင်းနဲ့ ကန့်သတ်တာတွေ လုပ်လို့ ရပါတယ်။ နေခြည် မှာတော့ team နှစ်ခုပဲ
      ရှိသေးတာမို့ project settings နဲ့ပဲ စပါမယ်။
    sources:
      - {
          title: "Claude Code Docs: Manage plugins for your organization",
          url: "https://code.claude.com/docs/en/plugins/org",
        }
      - {
          title: "Claude Code Docs: Plugins overview",
          url: "https://code.claude.com/docs/en/plugins/overview",
        }
    actions:
      - { id: close-plugin, type: slide.close, at: { mark: r-open, offsetMs: -600 } }
      - {
          id: draw-r-open,
          type: whiteboard.apply,
          at: { mark: r-open },
          open: true,
          clear: true,
          upsertIds: [r-title],
        }
      - {
          id: draw-r-1,
          type: whiteboard.apply,
          at: { mark: r-1 },
          upsertIds: [r-b1, r-l1, r-t1],
          drawMs: 1500,
        }
      - {
          id: draw-r-2,
          type: whiteboard.apply,
          at: { mark: r-2 },
          upsertIds: [r-a1, r-b2, r-l2, r-t2],
          drawMs: 1800,
        }
      - {
          id: draw-r-3,
          type: whiteboard.apply,
          at: { mark: r-3 },
          upsertIds: [r-a2, r-b3, r-l3, r-t3],
          drawMs: 1800,
        }
      - {
          id: draw-r-org,
          type: whiteboard.apply,
          at: { mark: r-org },
          upsertIds: [r-note],
          drawMs: 1000,
        }

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ Network Tools က plugin ကို install လုပ်ပြီး တစ်ပတ်အကြာမှာ Billing က hook
      ကို ပြင်ပြီး marketplace repository ထဲ push လုပ်လိုက်တယ် ဆိုပါစို့။ manifest ထဲက version ကိုတော့ မပြောင်းခဲ့ပါဘူး။
      Network Tools ရဲ့ developer တွေဆီ hook အသစ် ရောက်မလား။
      [[mark:q-a]] ပထမ အဖြေက repository ထဲ ရောက်နေပြီမို့ ရောက်မယ် ဆိုတာပါ။
      [[mark:q-b]] ဒုတိယ အဖြေက version မပြောင်းမချင်း အဟောင်းကိုပဲ ဆက်သုံးနေမယ် ဆိုတာပါ။ lesson ကို pause လုပ်ပြီး
      စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ တစ်ခုပါ။ ဘာကြောင့်လဲဆိုတော့ Claude Code က plugin တစ်ခုမှာ update ရှိမရှိကို
      version နဲ့ ဆုံးဖြတ်လို့ပါ။ manifest ထဲမှာ version ကို သတ်မှတ်ထားရင် commit ဘယ်နှခု push လုပ်လုပ်၊ author က
      အဲဒီ စာကြောင်းကို မပြောင်းမချင်း user တွေက cache ထဲက copy အဟောင်းမှာပဲ ရှိနေပါတယ်။
      [[mark:q-rule]] ဒါကြောင့် plugin ကို code လိုပဲ version ခွဲပြီး ထုတ်ပါ။ ပြင်ပြီး review လုပ်ပြီးမှ version ကို
      တိုးပြီး ထုတ်တော့၊ team တိုင်းက ဘယ် version ကို သုံးနေလဲ အတိအကျ သိရပါတယ်။ commit တိုင်းကို လိုက်စေချင်ရင်တော့
      version ကို manifest ထဲရော catalog ထဲမှာပါ မထည့်ဘဲ ထားလို့ ရပါတယ်။
    sources:
      - {
          title: "Claude Code Docs: Plugin loading reference",
          url: "https://code.claude.com/docs/en/plugins/loading",
        }
      - {
          title: "Claude Code Docs: Plugin manifest reference",
          url: "https://code.claude.com/docs/en/plugins/manifest-reference",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: q-rule },
          upsertIds: [q-t1, q-t2],
          drawMs: 1600,
        }

  - id: your-turn
    chapter: ကိုယ့် team ရဲ့ plugin
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး ဒီ manifest ကို ကိုယ့် team အတွက် ပြင်ရေးကြည့်ပါ။
      name ကို ကိုယ့် team ရဲ့ plugin နာမည်နဲ့ အစားထိုးပြီး၊ description ထဲမှာ ကိုယ့် team က တခြားသူတွေနဲ့
      မျှသုံးချင်တဲ့ agent၊ hook၊ skill ဒါမှမဟုတ် MCP server တွေကို နာမည်နဲ့ ရေးကြည့်ပါ။
      [[mark:turn-2]] ရေးပြီးရင် တစ်ခုချင်းစီအတွက် ဒါကို team အားလုံး တကယ် လိုသလား၊ ကိုယ်တစ်ယောက်တည်းအတွက်လား
      ဆိုတာ မေးကြည့်ပါ။ ကိုယ်တစ်ယောက်တည်း သုံးတာဆိုရင် plugin ထဲ မထည့်ဘဲ ကိုယ့် setting ထဲမှာပဲ ထားခဲ့ပါ။
    sources:
      - {
          title: "Claude Code Docs: Create plugins",
          url: "https://code.claude.com/docs/en/plugins/create",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: turn }, open: false }
      - id: sel-desc
        type: editor.select
        at: { mark: turn, offsetMs: 2200 }
        target:
          file: naychi-plugin/.claude-plugin/plugin.json
          text: '"description": "Naychi Fiber dev setup: test-runner agent, migration guard hook"'

  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ folder တွေကို လက်နဲ့ copy ကူးတာက team နှစ်ခုရဲ့ setup ကို ဘယ်သူမှ မသိလိုက်ဘဲ
      ကွဲသွားစေပါတယ်။ plugin က agent၊ hook၊ skill နဲ့ MCP server တွေကို manifest တစ်ခုအောက်မှာ တစ်ထုပ်တည်း စုပေးပြီး၊
      marketplace နဲ့ project settings ကနေ team တိုင်းဆီ version တူ ရောက်စေပါတယ်။
      [[mark:next]] နောက် lesson မှာတော့ Reply assistant၊ Claude Code နဲ့ support lead တွေရဲ့ app သုံးခုလုံးက Ticket
      system ကို ဖတ်ဖို့ လိုလာတဲ့ ပြဿနာကနေ စပြီး၊ Model Context Protocol၊ အတိုကောက် MCP ဆိုတာ ဘာလဲ ဆိုတာကို
      လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "Claude Code Docs: Plugins overview",
          url: "https://code.claude.com/docs/en/plugins/overview",
        }
    actions:
      - id: sel-version
        type: editor.select
        at: { mark: recap }
        target:
          file: naychi-plugin/.claude-plugin/plugin.json
          text: '"version": "1.0.0"'

checks:
  - { type: timing.p95Ms, max: 300 }
