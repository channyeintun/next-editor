  - id: two-budgets
    chapter: Budget နှစ်ခုနဲ့ stop button
    narration: >
      [[mark:close-p02]] [[mark:b4-s1]] Ops Buddy ကို သီးသန့် budget နှစ်ခုနဲ့ ထိန်းပါတယ်။ ပထမက service level objective၊ SLO ပစ်မှတ်က ခွင့်ပြုထားတဲ့ ပျက်ခွင့်၊ service ရဲ့ error budget ပါ၊ Top-up ဆိုရင် တစ်လကို fail ဖြစ်တဲ့ top-up ၁၀၀၀၀ ပါ။ ဒုတိယက Ops Buddy ကိုယ်ပိုင် safety budget ပါ၊ on-call က သူ့ action ကို ပြန် undo လုပ်ပေးရတိုင်း၊ သူ့ အကြံကို ဘေးမကင်းလို့ ငြင်းရတိုင်း လျော့သွားပါတယ်။
      [[mark:b4-s2]] Top-up ရဲ့ error budget ကုန်ရင် Ops Buddy က Top-up မှာ ကိုယ်တိုင် ဘာမှ မလုပ်တော့ဘဲ အကြံပဲ ပေးပါတယ်။ safety budget ကုန်ရင်တော့ service ကောင်းနေရင်တောင် အဖွဲ့က review မလုပ်မချင်း ကိုယ်တိုင် လုပ်ခွင့် အားလုံး ရပ်ပါတယ်။ ဒါ့အပြင် action မလုပ်ခင် ဖွင့်ထားတဲ့ incident ရှိလား စစ်ပါတယ်၊ သင်္ကြန် change freeze အတွင်းမှာလည်း ကိုယ့်ဘာသာ ရပ်နေပါတယ်။
      [[mark:b4-s3]] နောက်ဆုံး ဘရိတ်က stop button ပါ။ on-call ကျနေတဲ့ ဘယ်သူမဆို ခွင့်မတောင်းဘဲ နှိပ်လိုက်တာနဲ့ Ops Buddy ရဲ့ access အားလုံး ချက်ချင်း ပြတ်ပါတယ်။ ရပ်လို့ရမှန်း သိထားမှ on-call တွေက Ops Buddy နဲ့ စိတ်ချလက်ချ တွဲလုပ်ရဲကြတာပါ။
