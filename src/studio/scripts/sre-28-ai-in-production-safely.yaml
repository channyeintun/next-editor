        # AI ကို production ထဲ ဘေးကင်းကင်း ထည့်ခြင်း

        - action card — action တစ်ခုချင်း: လုပ်ခွင့် · undo နည်း · ရပ်ရမယ့် အခြေအနေ
        - budget နှစ်ခု — service budget ကုန်: အကြံပဲ · safety budget ကုန်: ရပ်
        - stop button — on-call ဘယ်သူမဆို ချက်ချင်း နှိပ်လို့ရတဲ့ ဘရိတ်
        - undo လုပ်လို့ရတဲ့ action — သေးပြီး မကောင်းရင် အလိုအလျောက် ပြန် undo
        - dry run — တကယ် မပြောင်းဘဲ လုပ်မယ့်ဟာကို မှတ်တမ်းတင်

        မေးခွန်း: undo နည်း ဘယ်သူမှ မသိတဲ့ action။ Ops Buddy ရဲ့ action card မှာ ဘာ ရေးမလဲ?
