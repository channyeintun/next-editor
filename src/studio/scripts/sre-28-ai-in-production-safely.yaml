  - id: recap
    narration: >
      [[mark:close-p04]] [[mark:open-notes]] Ops Buddy ကို ဘေးကင်းအောင် ထားတဲ့ နည်းတွေပါ။ [[mark:sel-action-card]] action card က action တစ်ခုချင်းရဲ့ လုပ်ခွင့်၊ undo လုပ်နည်းနဲ့ ရပ်ရမယ့် အခြေအနေကို ရေးထားတဲ့ ကတ်ပါ။ [[mark:sel-budgets]] budget နှစ်ခုမှာ service ရဲ့ error budget ကုန်ရင် Ops Buddy က အကြံပဲ ပေးပြီး safety budget ကုန်ရင် ရပ်ပါတယ်။
      [[mark:sel-stop]] stop button က on-call ဘယ်သူမဆို ချက်ချင်း နှိပ်လို့ရတဲ့ ဘရိတ်ပါ။ [[mark:sel-undo]] undo လုပ်လို့ရတဲ့ action က မကောင်းရင် အလိုအလျောက် ပြန် undo လုပ်တဲ့ action အသေးလေးပါ။ [[mark:sel-dry-run]] dry run ကတော့ တကယ် မပြောင်းဘဲ လုပ်မယ့်ဟာကိုပဲ မှတ်တမ်းတင်တာပါ။
      [[mark:sel-question]] card ကို ကိုယ်တိုင် ဖြည့်ကြည့်ပါ။ [[mark:ask-question]] Ops Buddy လုပ်ချင်တဲ့ action တစ်ခုကို ဘယ်လို undo လုပ်ရမလဲ ဘယ်သူမှ မသိဘူး ဆိုရင် သူ့ action card မှာ ဘာ ရေးမလဲ?
      [[mark:pause-question]] ဘယ်တော့မှ မလုပ်ရဘူးလို့ ရေးပါတယ်၊ အဲဒီ action က လူတွေ လက်ထဲမှာပဲ ကျန်ပါတယ်။ ဘရိတ်တွေ ရှိလာပြီ ဆိုတော့ AI က တကယ် ဘယ်မှာ ကူညီလဲ? သောကြာနေ့ promo တစ်ခုမှာ dashboard က ၉၉.၇ ရာခိုင်နှုန်း အောင်မြင်တယ်လို့ ပြနေပေမဲ့ Facebook မှာ ဒေါသထွက်နေတဲ့ comment တွေ ပြည့်နေပါတယ်။ alert ဘာလို့ မတက်ခဲ့တာလဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "AI in SRE: How Google is Engineering the Future of Reliable Operations (sre.google)",
          url: "https://sre.google/resources/practices-and-processes/ai-engineering-reliable-operations/",
        }
      - {
          title: "DORA: State of AI-assisted Software Development 2025",
          url: "https://dora.dev/research/2025/dora-report/",
        }
    actions:
      - { id: close-p04, type: slide.close, at: { mark: close-p04 } }
      - {
          id: open-notes,
          type: workspace.openFile,
          at: { mark: open-notes, offsetMs: 300 },
          path: notes.md,
        }
      - {
          id: sel-action-card,
          type: editor.select,
          at: { mark: sel-action-card },
          target: { file: notes.md, text: "action card", occurrence: 1 },
        }
      - {
          id: sel-budgets,
          type: editor.select,
          at: { mark: sel-budgets },
          target: { file: notes.md, text: "budget နှစ်ခု", occurrence: 1 },
        }
      - {
          id: sel-stop,
          type: editor.select,
          at: { mark: sel-stop },
          target: { file: notes.md, text: "stop button", occurrence: 1 },
        }
      - {
          id: sel-undo,
          type: editor.select,
          at: { mark: sel-undo },
          target: { file: notes.md, text: "undo လုပ်လို့ရတဲ့ action", occurrence: 1 },
        }
      - {
          id: sel-dry-run,
          type: editor.select,
          at: { mark: sel-dry-run },
          target: { file: notes.md, text: "dry run", occurrence: 1 },
        }
      # The voice script's ⟪select မေးခွန်း⟫ and ⟪pause 3s⟫, the way the Module 1
      # reviewers fixed the pause. sel-question marks where the voice script puts
      # the select, but a select there would drag under the question and leave
      # no pause, and one at pause-question would drag under the answer's first
      # words (the scheduler holds only the dialog after its anchor's). So the
      # question-line select hangs off ask-question, one more mark at an existing
      # sentence end that makes the question its own dialog: it starts about as
      # the question ends, its drag runs in silence, and the answer at
      # pause-question waits for it. The question is 111 characters (no ၊ to
      # split at), so the quiet depends on the voice's speed: 7750 leaves about
      # 2.7 / 1.05 / 0.35 s before the answer at 55 / 70 / 95 ms per char (at 70
      # and 95 the drag starts under the question's last words, as in lessons 7,
      # 8 and 15); above ~7875 trips compile-check's 2.5 s inserted-silence
      # warning at 55.
      - id: select-question
        type: editor.select
        at: { mark: ask-question, offsetMs: 7750 }
        target:
          file: notes.md
          text: "မေးခွန်း: undo နည်း ဘယ်သူမှ မသိတဲ့ action။ Ops Buddy ရဲ့ action card မှာ ဘာ ရေးမလဲ?"
          occurrence: 1

checks:
  # 500, not 300: google-svg deck pages stall the main thread at show/close.
  - { type: timing.p95Ms, max: 500 }
