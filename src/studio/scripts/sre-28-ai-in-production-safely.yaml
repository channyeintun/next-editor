  - id: before-production
    chapter: Production မထိခင်
    narration: >
      [[mark:close-b3]] [[mark:show-p02]] ကိုဇော် admin token ကို ငြင်းတာ lesson ၂၂ ရဲ့ cleanup script ကြောင့်ပါ။ AI နဲ့ ရေးထားတဲ့ အဲဒီ script ကို admin credential နဲ့ run လိုက်တော့ merchant ၁၀၀၀၀ ကို ဖျက်မိခဲ့ပါတယ်။ agent ဆိုရင် ဒီလို အမှားကို ပိုမြန်မြန် လုပ်နိုင်ပါတယ်။
      ဒါကြောင့် Ops Buddy ကို read-only နဲ့ စပြီး least privilege နဲ့ပဲ ထားပါတယ်။ action တိုင်း မလုပ်ခင် dry run နဲ့ ဘာပြောင်းမလဲ ပြရပြီး တကယ် အလုပ်လုပ်တဲ့ stop button လည်း ရှိရပါမယ်။ စမ်းရုံနဲ့တောင် admin token မပေးပါနဲ့။
    sources:
