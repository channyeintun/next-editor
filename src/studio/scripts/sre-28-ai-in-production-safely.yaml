  - id: undoable-unit
    chapter: Undo လုပ်လို့ရမှ လုပ်
    narration: >
      [[mark:close-b4]] [[mark:b5-s1]] အခြေခံ စည်းကမ်းက undo လုပ်နည်း မသိရင် action မလုပ်ရဘူး ဆိုတာပါ။ [[mark:b5-s1b]] action ကို လုပ်ပြီးရင် ငြိမ်လာအောင် warm-up အချိန် စောင့်ပြီးမှ ကောင်းလား ကြည့်ပါတယ်။ ဥပမာ promo SMS batch ကို ရပ်ရင် provider ဆီ ရောက်ပြီးသား message တွေ ကုန်အောင် မိနစ်အနည်းငယ် စောင့်ပြီးမှ SMS code latency ကို ကြည့်ပါတယ်။
      [[mark:b5-s2]] SMS code ပြန်မြန်လာရင် batch ကို ဆက်ရပ်ထားပြီး ငြိမ်မှ promo ကို ဖြည်းဖြည်း ပြန်ပို့ပါတယ်။ မမြန်လာရင်တော့ promo က အကြောင်းရင်း မဟုတ်လို့ batch ကို အလိုအလျောက် ပြန်ဖွင့်ပြီး on-call ဆီ page ပို့ပါတယ်။
      [[mark:b5-s3]] ဒီ အဆင့်တွေကို တစ်ဝက်တစ်ပျက် မကျန်အောင် unit တစ်ခုတည်းအဖြစ် run ပြီး audit log ထဲမှာလည်း တစ်ခုတည်းအဖြစ် မှတ်ပါတယ်။ lesson ၂၆ မှာ release တစ်ခုလုံးကို rollback မလုပ်နိုင်ခဲ့ပေမဲ့ agent ရဲ့ action တစ်ခုချင်းကတော့ သေးပြီး undo လုပ်လို့ ရရပါမယ်။ data ဖျက်တာ၊ schema ပြောင်းတာလို ပြန်ယူလို့ မရတဲ့ အလုပ်တွေကတော့ လူတွေ လက်ထဲမှာပဲ ကျန်ပါတယ်။
      [[mark:b5-s4]] Ops Buddy ကိုယ်တိုင်လည်း SLO ရှိတဲ့ service တစ်ခုပါ။ ဘယ်လောက် မြန်လဲ၊ အကြံ လက်ခံတဲ့ နှုန်းနဲ့ ဘယ်လောက် အသုံးဝင်လဲ၊ ဘယ်လောက် ဘေးကင်းလဲ တိုင်းပြီး အရင် incident တွေမှာ လူတွေ လုပ်ခဲ့တာနဲ့ အမြဲ တိုက်စစ်ပါတယ်၊ incident ပြီးတိုင်း စစ်စရာ case တစ်ခု တိုးပါတယ်။ သူ ဖတ်တဲ့ service map နဲ့ deploy မှတ်တမ်း နောက်ကျနေရင် သူ့ အကြံလည်း မှားမှာပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "AI in SRE: How Google is Engineering the Future of Reliable Operations (sre.google)",
