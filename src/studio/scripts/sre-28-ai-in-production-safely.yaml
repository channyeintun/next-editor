  - id: people-now
    chapter: လူတွေရဲ့ နေရာသစ်
    narration: >
      [[mark:close-b5]] [[mark:show-p03]] ဒါဆို AI က Site Reliability Engineering၊ SRE လုပ်တဲ့ လူတွေကို အစားထိုးမလား? မထိုးပါဘူး၊ သူတို့ နေရာ ပြောင်းသွားတာပါ။ အဆင့်တိုင်းကို ကိုယ်တိုင် လုပ်နေမယ့်အစား အပေါ်ကနေ ပန်းတိုင်နဲ့ ကန့်သတ်ချက် သတ်မှတ်တယ်၊ အထောက်အထား စစ်ပြီး approve လုပ်တယ်၊ လိုရင် ရပ်တယ်၊ ခက်တဲ့ ပြဿနာ အသစ်တွေကို ယူပါတယ်။ ဒါကို human over the loop လို့ ခေါ်ပါတယ်။
      [[mark:show-p03b]] reliability အလုပ် ဈေးသက်သာလာရင် SRE အလုပ် နည်းမယ် ထင်ရပေမဲ့ တကယ်တော့ ပိုများလာတတ်ပါတယ်၊ ဒါက Jevons paradox ပါ။ Padauk လည်း ချွေတာတဲ့ အချိန်နဲ့ SLO မရှိသေးတဲ့ service တွေကို SLO ထည့်ပါတယ်။ senior တွေ သတိကြီးတာ အကြောင်း ရှိလို့ အတင်း မခိုင်းဘဲ dry run မှတ်တမ်းလို အထောက်အထားနဲ့ ယုံလာအောင် လုပ်ပါတယ်။
      tool တွေ ပြောင်းသွားလည်း အမြဲ စစ်တာ၊ AI ကိုယ်တိုင် reliable ဖြစ်တာ၊ လုပ်ခွင့်ကို တစ်ဆင့်ချင်း ပေးတာနဲ့ AI က လူကို ကူညီတာကတော့ ကျန်နေမှာပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "AI in SRE: How Google is Engineering the Future of Reliable Operations (sre.google)",
          url: "https://sre.google/resources/practices-and-processes/ai-engineering-reliable-operations/",
        }
      - {
          title: "DORA: State of AI-assisted Software Development 2025",
          url: "https://dora.dev/research/2025/dora-report/",
        }
    actions:
      - {
          id: close-b5,
          type: whiteboard.apply,
          at: { mark: close-b5, offsetMs: -400 },
          open: false,
        }
      - { id: show-p03, type: slide.show, at: { mark: show-p03 }, slideId: l28-p03 }
      - { id: show-p03b, type: slide.show, at: { mark: show-p03b }, slideId: l28-p03b }

  - id: this-week
    narration: >
      [[mark:show-p04]] AI helper တစ်ခုကို ကိုယ့် production နဲ့ ချိတ်ဖို့ စဉ်းစားနေရင် ဒီအပတ် ဒီ သုံးခုကနေ စပါ။ AI helper ကို read-only access ပဲ ပေးပါ။ သူ ဘယ်တော့မှ မလုပ်ရမယ့် action တွေကို စာရင်း ချရေးပါ။ ပြီးတော့ ဘာ လုပ်ခွင့်မှ မပေးခင် stop button ကို အရင် ဆောက်ပါ။
