build:
  # Studio swaps in the Burmese voice chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 2628

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: hook
    chapter: Production access တောင်းတဲ့ Ops Buddy
    narration: >
      [[mark:show-p01]] Ask Padauk မှာ အခု AI အတွက် user ကြုံရတာကို တိုင်းတဲ့ service level indicator၊ SLI တွေ ရှိပြီး နေ့တိုင်း အဖြေ နမူနာ စစ်နေသလို fraud model ကလည်း data မကောင်းရင် training ကို ရပ်ပါတယ်။ ဒီနေ့တော့ production ကို run ဖို့ ကူညီမယ့် AI ဘက်ကို လှည့်ကြည့်ပါမယ်။
      [[mark:hook-ops-buddy]] platform အဖွဲ့က alert နဲ့ log တွေကို ဖတ်ပြီး on-call ကို ကူညီမယ့် internal AI agent၊ Ops Buddy ကို ဆောက်ပါတယ်။ ဒါပေမဲ့ သူ့ ပထမ version က admin token နဲ့ production တစ်ခုလုံး ဝင်ခွင့် တောင်းထားပါတယ်။ Ops Buddy ကို ဘေးကင်းကင်း ဘယ်လို ဝင်ခွင့်ပေးမလဲ?
      [[mark:show-p01b]] AI ကို ဘာလို့ လိုလာတာလဲ? service တွေ များလာတော့ alert တိုင်းကို လူက လိုက်ကြည့်လို့ မမီသလို script တွေကလည်း ကြိုသိထားတဲ့ ပြဿနာကိုပဲ ဖြေရှင်းနိုင်ပါတယ်။ AI ကတော့ ပုံစံမကျတဲ့ chat နဲ့ log တွေကို ဖတ်ပြီး ဘယ်သူမှ rule မရေးထားတဲ့ အခြေအနေမှာလည်း အကြံပေးနိုင်ပါတယ်၊ ဒါပေမဲ့ ရိုးရိုး rule နဲ့ ရပြီးသား နေရာမှာတော့ AI မလိုပါဘူး။
      [[mark:show-p01c]] ပြဿနာက လူနဲ့ agent မှားပုံ မတူတာပါ။ လူ တစ်ယောက် မှားရင် တစ်ခါပဲ မှားပြီး ဘေးက တစ်ယောက်ယောက် သတိထားမိတတ်ပါတယ်။ ၂၀၀ ခါမှာ တစ်ခါပဲ မှားတဲ့ agent က တစ်ရက်ကို action ၁၀၀၀ လုပ်ရင်တော့ အမှား ငါးခုကို ပုံစံတူ မြန်မြန် ထပ်လုပ်ပါလိမ့်မယ်။ input တူရင်တောင် အဖြေ ကွဲနိုင်တဲ့ AI ကို ဘယ်တော့မှ မမှားအောင် လုပ်လို့ မရလို့ ဘယ်လောက် မှားလဲ တိုင်းပြီး ထိန်းရပါတယ်။
      [[mark:show-p01d]] ပြီးတော့ production မှာ အမှားကို ဘေးကင်းကင်း ပိတ်ထားပေးမယ့် sandbox မရှိပါဘူး။ Ask Padauk မှားရင် သူဖွင့်တဲ့ ticket ကို လူက ပြန်စစ်ပေးနိုင်ပေမဲ့ Ops Buddy က နေ့လယ်စာချိန်မှာ rider dispatch worker တွေကို မှားပြီး restart လုပ်ရင် Eats order တွေ ချက်ချင်း ရပ်သွားနိုင်ပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "AI in SRE: How Google is Engineering the Future of Reliable Operations (sre.google)",
          url: "https://sre.google/resources/practices-and-processes/ai-engineering-reliable-operations/",
        }
      - {
          title: "DORA: State of AI-assisted Software Development 2025",
          url: "https://dora.dev/research/2025/dora-report/",
        }
    actions:
      # -1750 / -1450, not the skeleton's -1900 / -1600: a pull-back over 1780 ms pushes the
      # first dialog past the 2 s opening handle, which src/studio/plans/index.test.ts rejects.
      - { id: collapse-dock, type: runtime.collapseDock, at: { scene: start, offsetMs: -1750 } }
      - {
          id: show-p01,
          type: slide.show,
          at: { mark: show-p01, offsetMs: -1450 },
          slideId: l28-p01,
        }
      - { id: show-p01b, type: slide.show, at: { mark: show-p01b }, slideId: l28-p01b }
      - { id: show-p01c, type: slide.show, at: { mark: show-p01c }, slideId: l28-p01c }
      - { id: show-p01d, type: slide.show, at: { mark: show-p01d }, slideId: l28-p01d }

  - id: where-it-helps
    chapter: မှားလည်း နည်းနည်းပဲ ထိတဲ့ နေရာ
    narration: >
      [[mark:close-p01d]] [[mark:b1-s1]] ဘဏ်မှာ system administrator လုပ်ခဲ့ဖူးတဲ့ ကိုဇော်က admin token ကို ငြင်းလိုက်ပါတယ်။ AI က တစ်ခါခါ မှားမှာ သေချာနေတော့ Padauk ရဲ့ reliability loop ပေါ်မှာ မှားရင် နည်းနည်းပဲ ထိမယ့် နေရာကို ရှာပါတယ်။
      [[mark:b1-s2]] သတိထားမိတဲ့ အဆင့်မှာ Ops Buddy က Facebook နဲ့ Viber ကနေ မစုဆီ ဝင်လာတဲ့ complaint တွေကို အုပ်စုဖွဲ့ပေးပြီး သင်ယူတဲ့ အဆင့်မှာ postmortem အတွက် timeline မူကြမ်း ရေးပေးပါတယ်။ မှားရင် ကုန်ကျစရိတ် နည်းပြီး လူက ရလဒ်ကို အမြဲ ပြန်ဖတ်တဲ့ နေရာတွေပါ။
      [[mark:b1-s3]] incident ကို တုံ့ပြန်တဲ့ အဆင့်မှာတော့ အစပိုင်း အကြံပဲ ပေးပြီး ဆုံးဖြတ်တာက on-call ပါ။ tool ထက် အရင် လိုတာက အပြစ်ပေးခံရမှာ မကြောက်ဘဲ ပြောရဲတဲ့ psychological safety ပါ၊ ဒါကြောင့် Ops Buddy ရဲ့ မှတ်တမ်းကို လူတွေကို အမှတ်ပေးဖို့ ဘယ်တော့မှ မသုံးပါဘူး။ ဘေးကင်းကြောင်း မသေချာခင် အားလုံးကို အတင်း သုံးခိုင်းရင်လည်း ယုံကြည်မှု ပျက်တတ်ပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book second edition (Google Cloud Blog)",
          url: "https://cloud.google.com/blog/products/devops-sre/sre-book-second-edition",
        }
      - {
          title: "DORA: State of AI-assisted Software Development 2025",
          url: "https://dora.dev/research/2025/dora-report/",
        }
    actions:
      - { id: close-p01d, type: slide.close, at: { mark: close-p01d, offsetMs: -400 } }
      # The loop is furniture: it lands at once, with no drawMs.
      - id: b1-s1
        type: whiteboard.apply
        at: { mark: b1-s1 }
        open: true
        clear: true
        upsertIds:
          [
            l28-b1-ring,
            l28-b1-arrow-top,
            l28-b1-arrow-side,
            l28-b1-agree-box,
            l28-b1-agree-label,
            l28-b1-notice-box,
            l28-b1-notice-label,
            l28-b1-respond-box,
            l28-b1-respond-label,
            l28-b1-learn-box,
            l28-b1-learn-label,
            l28-b1-build-box,
            l28-b1-build-label,
            l28-b1-doll-head,
            l28-b1-doll-body,
            l28-b1-doll-label,
          ]
      - id: b1-s2
        type: whiteboard.apply
        at: { mark: b1-s2 }
        upsertIds: [l28-b1-note-notice, l28-b1-note-learn]
        drawMs: 1400
      - id: b1-s3
        type: whiteboard.apply
        at: { mark: b1-s3 }
        upsertIds: [l28-b1-note-respond]
        drawMs: 900

  - id: dry-run-month
    chapter: ကိုဇော်ရဲ့ dry run တစ်လ
    narration: >
      [[mark:close-b1]] [[mark:b2-s1]] ကိုဇော်က Ops Buddy ကို တစ်လလုံး dry run နဲ့ပဲ run ထားပါတယ်၊ တကယ် ဘာမှ မပြောင်းဘဲ လုပ်မယ့်ဟာကိုပဲ မှတ်တမ်းတင်တာပါ။ အကြံ ၄၀ ကို on-call တွေ တကယ် လုပ်ခဲ့တာနဲ့ တိုက်ကြည့်တော့ ၃၁ ခုက မှန်ပြီး ၆ ခုက မမှန်ပေမဲ့ အန္တရာယ် မရှိပါဘူး၊ ကျန်တဲ့ ၃ ခုကတော့ မှားပါတယ်။
      မှားတဲ့ တစ်ခုက Operator B နှေးနေတုန်း Top-up traffic အားလုံးကို Operator A ဆီ လွှဲခိုင်းတာပါ၊ တကယ်သာ လုပ်ခဲ့ရင် Operator A ပါ ဝန်ပိုပြီး ကျသွားမှာပါ။
      [[mark:b2-s2]] ဒီ ရလဒ်တွေကို ကိုဇော်က သောကြာနေ့ session တစ်ခုမှာ senior တွေနဲ့ အလုပ်ဝင်ခါစ engineer တွေကို အတူ ပြပါတယ်။ Ops Buddy က ဘာမှာ တော်ပြီး ဘယ်မှာ မှားတတ်လဲ မြင်တော့ senior တွေက အလွန်အကျွံ မကြောက်တော့သလို လူသစ်တွေလည်း မျက်စိမှိတ် မယုံတော့ပါဘူး။ အဲဒီနောက်မှ SMS code တွေ နှေးလာရင် အဲဒီ provider ကို မျှသုံးနေတဲ့ promo SMS batch ကို ခဏ ရပ်တာကို ပထမဆုံး ကိုယ်တိုင် လုပ်ခွင့်အဖြစ် ပေးပါတယ်။
      [[mark:b2-s3]] ဒါပေမဲ့ ဒီ ရလဒ်က ဒီ model အတွက်ပဲ မှန်လို့ model ကို ပိုကောင်းတဲ့ တစ်ခုနဲ့ လဲတာတောင် production change တစ်ခုလို dry run နဲ့ ပြန်စစ်ပါတယ်။ AI tool တွေက မြန်မြန် ဟောင်းသွားပေမဲ့ ဒီလို အရင် စစ်တဲ့ စည်းမျဉ်းတွေကတော့ ကျန်နေပါတယ်။ Ops Buddy မလုပ်နိုင်သေးတဲ့ အလုပ်တွေကိုလည်း လက်မလျှော့ဘဲ လအနည်းငယ်နေရင် ပြန်စမ်းပါတယ်။
    sources:
