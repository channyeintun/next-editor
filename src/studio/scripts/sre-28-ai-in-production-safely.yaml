# SRE from zero, lesson 28: AI in production, safely (Burmese concept lesson).
#
# Built from the approved voice script
# docs/sre-course/voice-scripts/sre-28-ai-in-production-safely.md. Every spoken
# character is that script's "> " lines, unchanged; each ⟪…⟫ marker became a
# [[mark:…]] at the same place. Check it with:
#   bun ~/Documents/sre-course/work/check-narration.ts \
#     docs/sre-course/voice-scripts/sre-28-ai-in-production-safely.md \
#     src/studio/scripts/sre-28-ai-in-production-safely.yaml
#
# Nothing runs: deck pages and the whiteboard carry the lesson, and notes.md is
# the recap. The workspace and runtime follow the validated no-code skeleton
# (WebContainer, empty init command, a harmless dev script).
#
# The arc: Ops Buddy asks for an admin token (cover), why AI and why its
# mistakes repeat (1000 ÷ 200 = 5), and production has no sandbox. Board B1
# (P3, the Padauk loop as furniture): where a mistake costs little. Board B2
# (P8 timeline): Ko Zaw's dry-run month, the Friday session, the first solo
# action, a model swap as a production change. Board B3: the action card
# (acts then tells, asks first, never) and what it takes to move a row up.
# Page: before Ops Buddy touches production. Board B4 (P5 bars): the service's
# error budget and Ops Buddy's own safety budget, then the STOP brake. Board
# B5 (P1 flow + branch): act, warm up, watch, check, keep or auto-undo, as one
# audited unit; Ops Buddy's own SLO. Pages: what people do now, Jevons
# paradox and trust; this week; recap on notes.md.
#
# Two marks add no spoken text and sit at an existing ။: b5-s1b splits board
# B5's first step so it adds at most three labelled boxes (act first, then
# warm-up, watch and healthy? as the next sentence names them), and
# ask-question makes the recap question its own dialog so the question-line
# select can hang off it for the ⟪pause 3s⟫, as in Module 1. The voice script
# already carries its pacing pages (p01b, p01c, p01d, p03b); every dialog stays
# under 450 characters, and no page or board step holds longer than about
# 33 s at 70 ms/char (the cover, l28_p01: 443 characters after the opening
# handle), so no pacing page was added.
#
# ⟪close board⟫ straight into the next board (scenes 3, 4 and 7) wipes the open
# board 400 ms early (whiteboard.apply clear) instead of closing the panel, as
# in lesson 8, so the editor does not flash between two boards; the next board
# then draws with open: true, clear: true as usual. A board followed by a deck
# page closes the panel (open: false) 400 ms before the page, as in Module 1.
#
# Boards. Colour jobs: #1e1e1e ink (paints white) for axes, arrows, the card
# frame and the audited-unit frame; blue the thing named (loop stations, the
# dry-run and Friday ticks, the card's actions, the service's budget, Ops
# Buddy's SLO); green healthy or done (cheap places to help, the first solo
# action, acts-then-tells, keep); red failure or budget spent (never, spent
# budgets, STOP, auto-undo); orange the caveat or limit (suggest only at
# first, asks first, a model swap, moving a row up); violet the result or flow
# (the loop's ring, the review result, the safety budget as a second series,
# the act-watch flow). B1 reuses lesson 2's compact loop so the notes fit beside its
# stations (its တည်ဆောက် box 18 px wider, since the label runs 156 px in
# Chrome); its furniture lands without drawMs, so the board stays at nine
# labels. A label on two lines is two text assets, one per line: the overflow
# rule counts a whole text's length. Mostly-Latin labels get extra width,
# since Virgil's Latin and digits run wider than the 0.55 em rule, and short
# Burmese words such as ဆက်ထား run past it too (0.7 em in Chrome's Noto Sans
# Myanmar): every label was also measured in Chrome with Excalidraw's Virgil
# font and fits inside its box. B5's audited-unit frame holds both outcomes,
# keep and auto-undo.
#
# Deck pages: deck "Next Editor · SRE 6A · AI", published; the /pub URL below
# is final. The deck holds only the kit pages until this lesson's pages are
# built from the page plan, so until then the Director reports page "l28_p01"
# missing from the published deck. Page plan:
# ~/Documents/sre-course/work/pages/sre-28-ai-in-production-safely.json (the
# cover's title is shortened there to "AI ကို production ထဲ ဘေးကင်းကင်း", 32
# code points, because the full title's 42 pass the K1 title's safe 34).
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/sre-28-ai-in-production-safely.yaml
#   bun scripts/studio-compile-check.ts src/studio/scripts/sre-28-ai-in-production-safely.yaml
