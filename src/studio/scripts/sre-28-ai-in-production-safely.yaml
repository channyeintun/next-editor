  - id: action-card
    chapter: Action card
    narration: >
      [[mark:close-b2]] [[mark:b3-s1]] Ops Buddy ရဲ့ လုပ်ခွင့်တွေကို lesson ၁၇ က failover bot လိုပဲ action card ပေါ်မှာ ရေးပါတယ်။ action card ဆိုတာ action တစ်ခုချင်းအတွက် အကြံပဲ ပေးမလား၊ အရင် မေးမလား၊ လုပ်ပြီးမှ ပြောမလား၊ ဘယ်တော့မှ မလုပ်ရဘူးလား ဆိုတာနဲ့ undo လုပ်နည်း၊ ရပ်ရမယ့် အခြေအနေကို ရေးထားတဲ့ ကတ်ပါ။ promo SMS ရပ်တာနဲ့ Top-up instance တစ်ခု တိုးတာက မိနစ်ပိုင်းအတွင်း undo လုပ်လို့ရလို့ လုပ်ပြီးမှ ပြောပါတယ်။
      [[mark:b3-s2]] operator traffic ၁၀ ရာခိုင်နှုန်း လွှဲတာနဲ့ တစ်နေတဲ့ dispatch worker ကို restart လုပ်တာကတော့ မှားရင် ပိုထိလို့ on-call ကို အရင် မေးရပါတယ်။ ဒါပေမဲ့ အဆင့်တိုင်းကို approve လုပ်ခိုင်းရင် ကြာတော့ လူက မဖတ်တော့ဘဲ approve ကိုပဲ နှိပ်ပေးတတ်ပါတယ်။ ဒါကြောင့် review တိုင်းကို နောက်တစ်ဆင့် တက်ဖို့ feedback အဖြစ် သုံးပါတယ်။
      [[mark:b3-s3]] Wallet ရဲ့ ledger ကိုတော့ ဘယ်တော့မှ မထိရပါဘူး။ ဒီလို လုပ်ခွင့်ကို agent တစ်ခုလုံးအတွက် မဟုတ်ဘဲ action တစ်ခုချင်း ဘယ်လောက် အရေးကြီးလဲ၊ မှားရင် ဘယ်လောက် ဆုံးရှုံးမလဲ ချိန်ပြီး ဆုံးဖြတ်တာပါ။
      [[mark:b3-s4]] ဥပမာ operator traffic လွှဲတာကို လုပ်ပြီးမှ ပြော အဆင့် တင်ချင်ရင် approve ခံခဲ့တဲ့ မှတ်တမ်း ကောင်းကောင်း၊ အရင် အခြေအနေကို ပြန်ယူတဲ့ rollback ကို စမ်းပြီးသား ဖြစ်တာ၊ test တွေနဲ့ budget တွေ ရှိမှ တင်ပါတယ်။ လုပ်ခွင့် နည်းနည်းပဲ ပေးထားတာက ပိုကောင်းတဲ့ action တွေလည်း အများကြီး ရှိပါတယ်။
    sources:
