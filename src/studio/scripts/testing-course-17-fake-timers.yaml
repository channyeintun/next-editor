scenes:
  - id: open
    chapter: "နာရီကို ဖတ်တဲ့ code"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ global တွေ၊ module တွေ၊ method တွေကို နေရာမှာတင် အစားထိုးပြီး၊
      test ပြီးတိုင်း ပြန်ဖြုတ်ရတယ် ဆိုတာ ကြည့်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ အချိန်ကို test ထဲမှာ ကိုယ်တိုင်
      ထိန်းကြည့်ပါမယ်။ [[mark:draw-rule]] ဆိုင်မှာ နေ့လယ် ၂ နာရီကနေ ညနေ ၄ နာရီ မထိုးခင်အထိ happy hour
      ရှိပြီး၊ သောက်စရာတွေကို ၂၀ ရာခိုင်နှုန်း လျှော့ပေးပါတယ်။ အခု happy hour ဟုတ်မဟုတ် ပြောတဲ့ function
      က ကွန်ပျူတာရဲ့ နာရီကို သူ့ဘာသာ ဖတ်ပါတယ်။ [[mark:draw-clocks]] ဒီ function ကို ရိုးရိုး test နဲ့
      စစ်ရင် ဘာ ဖြစ်မလဲ။ happy hour ဖြစ်ရမယ်လို့ စစ်တဲ့ test က ညနေ ၃ နာရီမှာ run ရင် pass ဖြစ်ပေမဲ့၊
      code တစ်ကြောင်းမှ မပြင်ဘဲ ည ၈ နာရီမှာ run ရင်တော့ fail ဖြစ်သွားပါတယ်။ [[mark:draw-flaky]] ဒီလို code
      မပြောင်းဘဲ တစ်ခါ pass တစ်ခါ fail ဖြစ်တဲ့ test ကို flaky test လို့ ခေါ်ပါတယ်။ ခဏခဏ ဖြစ်လာရင် test
      ရဲ့ အနီရောင်ကို ဘယ်သူမှ မယုံတော့ပါဘူး။ ဆိုင်ရဲ့ test တွေထဲမှာ happy hour test မရှိသေးတာလည်း
      ဒါကြောင့်ပါ။
      [[mark:draw-brew]] နောက် ပြဿနာ တစ်ခုက စောင့်ရတာပါ။ မီးဖိုချောင်က လက်ဖက်ရည် စ ဖျော်ပြီး ၃ မိနစ်
      ကြာမှ အသင့်ဖြစ်ပြီလို့ ပြောပါတယ်။ test က ၃ မိနစ် တကယ် စောင့်ရင် အရမ်း နှေးသလို၊ Vitest ကလည်း
      test တစ်ခုကို default အနေနဲ့ ၅ စက္ကန့်ပဲ စောင့်လို့ timeout နဲ့ ကျသွားမှာပါ။ [[mark:draw-fake]] ဒီ
      ပြဿနာ နှစ်ခုကို Vitest ရဲ့ fake timers နဲ့ ဖြေရှင်းပါမယ်။ fake timers ဆိုတာ test ထဲမှာ အချိန်ကို
      ကိုယ်တိုင် ထိန်းလို့ရအောင် အတုလုပ်ထားတဲ့ နာရီပါ။ အခု ဘယ်အချိန်လဲ ဆိုတာကို သတ်မှတ်လို့ ရသလို၊
      နာရီကို ရှေ့တိုးလို့လည်း ရပါတယ်။
    sources:
      - {
          title: "web.dev Learn Testing: Run tests as part of Continuous Integration (flaky tests)",
          url: "https://web.dev/learn/testing/get-started/where-tests-run#run_tests_as_part_of_continuous_integration",
        }
      - {
          title: "web.dev Learn Testing: Welcome, coming soon: problem-driven testing",
          url: "https://web.dev/learn/testing/welcome",
        }
      - { title: "Vitest: Mocking, Timers", url: "https://vitest.dev/guide/mocking/timers" }
      - {
          title: "Vitest: testTimeout, 5 s by default (facts A14)",
          url: "https://vitest.dev/config/testtimeout",
        }
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-rule
        type: whiteboard.apply
        at: { mark: draw-rule }
        upsertIds: [a-rule]
        drawMs: 1500
      - id: draw-clocks
        type: whiteboard.apply
        at: { mark: draw-clocks }
        upsertIds:
          [
            a-test-box,
            a-test-1,
            a-test-2,
            a-test-3,
            a-arrow-1,
            a-pass-box,
            a-pass,
            a-arrow-2,
            a-fail-box,
            a-fail,
          ]
        drawMs: 5000
      - id: draw-flaky
        type: whiteboard.apply
        at: { mark: draw-flaky }
        upsertIds: [a-flaky]
        drawMs: 1800
      - id: draw-brew
        type: whiteboard.apply
        at: { mark: draw-brew }
        clear: true
        upsertIds: [b-title, b-brew-box, b-brew-1, b-brew-2, b-arrow, b-wait, b-timeout]
        drawMs: 4500
      - id: draw-fake
        type: whiteboard.apply
        at: { mark: draw-fake }
        upsertIds: [b-fake-box, b-fake-head, b-fake-1, b-fake-2]
        drawMs: 4000

  - id: starter
    narration: >
      [[mark:close-board]] ဆိုင်ရဲ့ code ကို ကြည့်ရအောင်။ ဒါက ဆိုင်ရဲ့ လျှော့ဈေး စည်းကမ်းတွေကို ရေးထားတဲ့
      discount ဖိုင်ပါ။ [[mark:select-now]] happy hour function က ဒီ နေရာမှာ new Date နဲ့ ကွန်ပျူတာရဲ့
      နာရီကနေ အခု အချိန်ကို ယူပါတယ်။ test ကနေ ဒီ အချိန်ကို ပေးလို့ မရတာက ပြဿနာရဲ့ အရင်းအမြစ်ပါ။
      [[mark:select-rule]]
      ဒီ အပိုင်းကတော့ ရလာတဲ့ နာရီက happy hour ထဲမှာလား ဆိုတာ ဆုံးဖြတ်ပါတယ်။ အပေါ်က comment ထဲက
      ဆိုင်ရဲ့ စည်းကမ်းနဲ့ အတိအကျ ကိုက်မကိုက်ကိုတော့ test တွေက ပြောပြပါလိမ့်မယ်။ [[mark:open-kitchen]]
      kitchen ဖိုင်ကိုလည်း ကြည့်ရအောင်။ [[mark:select-timeout]] လက်ဖက်ရည် ဖျော်တဲ့ function က set
      Timeout ကို သုံးပြီး၊ အချိန် ပြည့်မှ ကောင်တာက ပေးထားတဲ့ function ကို ပြန်ခေါ်ပါတယ်။ ဒီလို
      နောက်မှ ပြန်ခေါ်ခိုင်းတဲ့ function ကို callback လို့ ခေါ်ပါတယ်။ [[mark:select-ms]] ၃ မိနစ်ကိုတော့
      millisecond နဲ့ တွက်ပြီး ရေးထားပါတယ်။
    sources:
      - { title: "Vitest: Mocking, Dates", url: "https://vitest.dev/guide/mocking/dates" }
      - { title: "Vitest: Mocking, Timers", url: "https://vitest.dev/guide/mocking/timers" }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: select-now
        type: editor.select
        at: { mark: select-now }
        target: { file: src/discount.js, text: "new Date()", occurrence: 1 }
      - id: select-rule
        type: editor.select
        at: { mark: select-rule }
        target: { file: src/discount.js, text: "hour > 14 && hour < 16", occurrence: 1 }
      - id: open-kitchen
        type: workspace.openFile
        at: { mark: open-kitchen }
        path: src/kitchen.js
      - id: select-timeout
        type: editor.select
        at: { mark: select-timeout }
        target:
          {
            file: src/kitchen.js,
            text: "setTimeout(() => onReady(ticket), READY_AFTER_MS);",
            occurrence: 1,
          }
      - id: select-ms
        type: editor.select
        at: { mark: select-ms }
        target: { file: src/kitchen.js, text: "3 * 60 * 1000", occurrence: 1 }

  - id: panel
    narration: >
      [[mark:ready]] ညာဘက်က Vitest panel ကလည်း အရင် lesson တွေလိုပဲ၊ code ပြောင်းတိုင်း သူ့ဘာသာ ပြန်
      run တဲ့ တကယ့် Vitest ရဲ့ ရလဒ်ပါ။ [[mark:read-start]] လျှော့ဈေး ကုဒ်ကို စစ်တဲ့ test က pass
      ဖြစ်နေပြီး၊ kitchen test ဖိုင်မှာတော့ ၃ မိနစ် စောင့်ရမယ့် test ကို todo အဖြစ်ပဲ ထားခဲ့ပါသေးတယ်။
      summary မှာလည်း တစ်ခု pass နဲ့ တစ်ခု todo လို့ ပြနေပါတယ်။
    sources:
      - { title: "Vitest: test.todo", url: "https://vitest.dev/api/test#test-todo" }
      - {
          title: "Vitest: Writing Tests, reading test output",
          url: "https://vitest.dev/guide/learn/writing-tests#reading-test-output",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-start-pass
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1000 }
      - id: expect-start-todo
        type: expect.preview
        at: { afterAction: expect-start-pass }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-todo, value: "1" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-start-todo-test
        type: expect.preview
        at: { afterAction: expect-start-todo }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-2 }
        attribute: { name: data-state, value: todo }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: system-time
    chapter: "နာရီ အတုနဲ့ အခု အချိန်ကို သတ်မှတ်ရအောင်"
    narration: >
      [[mark:open-test]] happy hour test တွေကို fake timers နဲ့ ရေးကြည့်ရအောင်။ ဒါက discount ရဲ့ test
      ဖိုင်ပါ။ [[mark:type-imports]] ဖိုင်ရဲ့ ထိပ်မှာ vitest ကနေ hook နှစ်ခု၊ describe နဲ့ vi ကို ထပ်ယူပြီး၊
      happy hour function ကိုလည်း import လုပ်ပါမယ်။ mock function တွေကို ဆောက်ခဲ့တဲ့ vi ထဲမှာပဲ
      fake timers လည်း ပါပါတယ်။ [[mark:type-describe]] ပြီးတော့ happy hour function အတွက်
      describe တစ်ခု ထည့်ပါမယ်။ အထဲမှာ ညနေ ၃ နာရီ test တစ်ခု ပါပါတယ်။ [[mark:select-fake]] before
      Each ထဲက use Fake Timers ကြောင့်၊ test တိုင်း မစခင် Vitest က အစစ် နာရီကို အတုနဲ့ လဲပေးပါတယ်။
      arrow function ထဲမှာ ခေါ်ထားတာကတော့၊ hook က ထည့်ပေးတဲ့ argument ကို use Fake Timers က သူ့
      setting အဖြစ် မယူသွားအောင်ပါ။ [[mark:select-real]] after Each ထဲက use Real Timers ကတော့ test
      ပြီးတိုင်း အစစ် နာရီကို ပြန်ထားပြီး၊ ထည့်ထားတဲ့ အတုကို ပြန်ဖြုတ်ပေးပါတယ်။ [[mark:select-time]]
      test ထဲမှာတော့ set System Time နဲ့ အခု အချိန်ကို ၂၀၂၆ ခုနှစ် နိုဝင်ဘာလ ၅ ရက်၊ ညနေ ၃ နာရီလို့
      သတ်မှတ်ပါတယ်။ JavaScript မှာ လကို သုညကနေ စရေတွက်လို့ ၁၀ က နိုဝင်ဘာလပါ။ [[mark:local-time]]
      နံပါတ်တွေနဲ့ ဆောက်တဲ့ Date က local time ဖြစ်လို့၊ ဘယ် time zone မှာ run run ၃ နာရီပဲ ဖြစ်ပါတယ်။
      [[mark:read-two]] panel မှာ ညနေ ၃ နာရီ test က pass ဖြစ်ပြီး၊ summary မှာ ၂ ခု pass လို့
      ပြနေပါတယ်။ ဒီ test က ဘယ်အချိန်မှာ run တာ ဖြစ်ဖြစ်၊ ရလဒ် အတူတူပါပဲ။
    sources:
      - { title: "Vitest: vi.useFakeTimers", url: "https://vitest.dev/api/vi#vi-usefaketimers" }
      - { title: "Vitest: vi.setSystemTime", url: "https://vitest.dev/api/vi#vi-setsystemtime" }
      - { title: "Vitest: vi.useRealTimers", url: "https://vitest.dev/api/vi#vi-userealtimers" }
      - {
          title: "Vitest: Mocking, Dates (useFakeTimers in beforeEach, useRealTimers in afterEach)",
          url: "https://vitest.dev/guide/mocking/dates",
        }
      - {
          title: "MDN: Date() constructor, month index from 0, local time",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date/Date",
        }
    actions:
      - id: open-test
        type: workspace.openFile
        at: { mark: open-test }
        path: src/discount.test.js
      - id: type-import-hooks
        type: editor.type
        at: { mark: type-imports }
        target: { file: src/discount.test.js, after: "import { ", occurrence: 1 }
        text: "afterEach, beforeEach, describe, "
      - id: type-import-vi
        type: editor.type
        at: { afterAction: type-import-hooks }
        target: { file: src/discount.test.js, after: "expect, test", occurrence: 1 }
        text: ", vi"
      - id: type-import-now
        type: editor.type
        at: { afterAction: type-import-vi }
        target: { file: src/discount.test.js, after: "import { codePercent", occurrence: 1 }
        text: ", isHappyHourNow"
      - id: type-describe
        type: editor.type
        at: { mark: type-describe }
        target:
          {
            file: src/discount.test.js,
            after: "  expect(codePercent(\"TEA10\")).toBe(10);\n});\n",
            occurrence: 1,
          }
        text: "\ndescribe(\"isHappyHourNow\", () => {\n  beforeEach(() => {\n    vi.useFakeTimers();\n  });\n  afterEach(() => {\n    vi.useRealTimers();\n  });\n\n  test(\"is on at 15:00\", () => {\n    vi.setSystemTime(new Date(2026, 10, 5, 15, 0));\n    expect(isHappyHourNow()).toBe(true);\n  });\n});\n"
        # One block (pilot note 1): one write, one run.
        cadence: block
      - id: expect-two-passed
        type: expect.preview
        at: { afterAction: type-describe }
        timeoutMs: 8000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "2" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-new-test
        type: expect.preview
        at: { afterAction: expect-two-passed }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-2 }
        attribute: { name: data-name, value: "isHappyHourNow > is on at 15:00" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-fake
        type: editor.select
        at: { mark: select-fake }
        target:
          {
            file: src/discount.test.js,
            text: "beforeEach(() => {\n    vi.useFakeTimers();\n  });",
            occurrence: 1,
          }
      - id: select-real
        type: editor.select
        at: { mark: select-real }
        target:
          {
            file: src/discount.test.js,
            text: "afterEach(() => {\n    vi.useRealTimers();\n  });",
            occurrence: 1,
          }
      - id: select-time
        type: editor.select
        at: { mark: select-time }
        target:
          {
            file: src/discount.test.js,
            text: "vi.setSystemTime(new Date(2026, 10, 5, 15, 0));",
            occurrence: 1,
          }

  - id: boundaries
    narration: >
      အချိန်ကို သတ်မှတ်လို့ ရပြီ ဆိုတော့၊ စည်းကမ်း ပြောင်းသွားတဲ့ အစွန်း boundary တွေကို စစ်လို့ ရပါပြီ။
      [[mark:type-start-edge]] happy hour စတဲ့ ၂ နာရီ တိတိမှာ ဖြစ်ရမယ်၊ တစ်မိနစ် အရင် ၁ နာရီ ၅၉ မိနစ်မှာ
      မဖြစ်ရဘူးလို့ test နှစ်ခု ထည့်ပါမယ်။ code ကို မပြင်ခင် test ကို အရင် ရေးတာပါ။ [[mark:read-red]]
      panel ကို ကြည့်ပါ။ ၁ နာရီ ၅၉ မိနစ် test က pass ဖြစ်ပေမဲ့ ၂ နာရီ test က ကြက်ခြေခတ်နဲ့ ကျနေပြီး၊
      အပေါ်က PASS ကလည်း အနီရောင် FAIL ဖြစ်သွားပါပြီ။ [[mark:read-message]] Failed Tests အပိုင်းမှာ
      true ဖြစ်ရမယ့် နေရာမှာ false ရနေတယ်လို့ ပြောနေပါတယ်။ အစိမ်းရောင် Expected က true ဖြစ်ပြီး၊
      အနီရောင် Received က false ပါ။ ဆိုလိုတာက ၂ နာရီ တိတိမှာ code က happy hour မဟုတ်ဘူးလို့
      ဖြေနေတာပါ။ [[mark:select-frame]] code frame ကလည်း ဒီ to Be ကို ညွှန်ပြနေပါတယ်။ ဆိုင်ရဲ့
      စည်းကမ်းအရ ၂ နာရီ တိတိမှာ စရမှာမို့၊ မှားနေတာက code ပါ။ [[mark:open-fix]] discount ဖိုင်ကို
      ပြန်ဖွင့်ပါမယ်။ [[mark:select-gt]] ဒီမှာ နာရီက ၁၄ ထက် ကြီးမှလို့ ရေးထားလို့၊ ၁၄ နာရီ တိတိ မပါတာပါ။
      [[mark:type-fix]] ညီမျှခြင်း သင်္ကေတ တစ်လုံး ထည့်ပြီး၊ ၁၄ နဲ့ ညီရင်လည်း happy hour ဖြစ်အောင်
      ပြင်ပါမယ်။ [[mark:read-fixed]] Vitest က ပြန် run လိုက်တော့၊ test လေးခုလုံး pass ဖြစ်ပြီး PASS
      ပြန်ဖြစ်သွားပါပြီ။ [[mark:type-end-edge]] happy hour ပြီးတဲ့ဘက်ကိုလည်း စစ်ရပါမယ်။ ညနေ ၃ နာရီ ၅၉
      မိနစ်မှာ ဖြစ်နေသေးပြီး၊ ညနေ ၄ နာရီ တိတိမှာ ပြီးသွားရမယ်လို့ test နှစ်ခု ထပ်ထည့်ပါမယ်။
      [[mark:read-six]] ဒီ နှစ်ခုက ချက်ချင်း pass ဖြစ်ပြီး၊ summary မှာ ၆ ခု pass လို့ ပြနေပါတယ်။
      အဆုံးဘက်က မှန်နေပြီးသား ဖြစ်ပေမဲ့၊ နောက်မှ တစ်ယောက်ယောက် ဒီ code ကို ပြင်ရင်း မှားသွားရင် ဒီ test
      တွေက ချက်ချင်း ဖမ်းပေးပါလိမ့်မယ်။
    sources:
      - { title: "Vitest: Mocking, Dates", url: "https://vitest.dev/guide/mocking/dates" }
      - { title: "Vitest: expect, toBe", url: "https://vitest.dev/api/expect#tobe" }
      - {
          title: "web.dev Learn Testing: What to test (edge cases)",
          url: "https://web.dev/learn/testing/get-started/what-to-test",
        }
    actions:
      - id: type-start-edge
        type: editor.type
        at: { mark: type-start-edge }
        target:
          { file: src/discount.test.js, after: "    vi.useRealTimers();\n  });\n", occurrence: 1 }
        text: "\n  test(\"is off at 13:59\", () => {\n    vi.setSystemTime(new Date(2026, 10, 5, 13, 59));\n    expect(isHappyHourNow()).toBe(false);\n  });\n\n  test(\"is on at 14:00\", () => {\n    vi.setSystemTime(new Date(2026, 10, 5, 14, 0));\n    expect(isHappyHourNow()).toBe(true);\n  });\n"
        cadence: block
      - id: expect-red
        type: expect.preview
        at: { afterAction: type-start-edge }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-red-count
        type: expect.preview
        at: { afterAction: expect-red }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-failed, value: "1" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-red-message
        type: expect.preview
        at: { afterAction: expect-red-count }
        timeoutMs: 5000
        target: { by: testId, value: vt-error-1 }
        attribute: { name: data-message, value: "expected false to be true // Object.is equality" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-red-test
        type: expect.preview
        at: { afterAction: expect-red-message }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-3 }
        attribute: { name: data-state, value: fail }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-frame
        type: editor.select
        at: { mark: select-frame }
        target: { file: src/discount.test.js, text: "toBe(true)", occurrence: 1 }
      - id: expect-frame
        type: expect.preview
        at: { afterAction: select-frame }
        timeoutMs: 5000
        target: { by: testId, value: vt-frame-1 }
        attribute: { name: data-line, value: "23" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: open-fix
        type: workspace.openFile
        at: { mark: open-fix }
        path: src/discount.js
      - id: select-gt
        type: editor.select
        at: { mark: select-gt }
        target: { file: src/discount.js, text: "hour > 14", occurrence: 1 }
      - id: type-fix
        type: editor.type
        at: { mark: type-fix }
        target: { file: src/discount.js, after: "hour >", occurrence: 1 }
        text: "="
      - id: expect-fixed
        type: expect.preview
        at: { afterAction: type-fix }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-four-passed
        type: expect.preview
        at: { afterAction: expect-fixed }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "4" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: open-test-again
        type: workspace.openFile
        at: { mark: type-end-edge }
        path: src/discount.test.js
      - id: type-end-edge
        type: editor.type
        at: { afterAction: open-test-again }
        target:
          {
            file: src/discount.test.js,
            after: "new Date(2026, 10, 5, 15, 0));\n    expect(isHappyHourNow()).toBe(true);\n  });\n",
            occurrence: 1,
          }
        text: "\n  test(\"is on at 15:59\", () => {\n    vi.setSystemTime(new Date(2026, 10, 5, 15, 59));\n    expect(isHappyHourNow()).toBe(true);\n  });\n\n  test(\"is off at 16:00\", () => {\n    vi.setSystemTime(new Date(2026, 10, 5, 16, 0));\n    expect(isHappyHourNow()).toBe(false);\n  });\n"
        cadence: block
      - id: expect-six-passed
        type: expect.preview
        at: { afterAction: type-end-edge }
        timeoutMs: 8000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "6" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-four-pm
        type: expect.preview
        at: { afterAction: expect-six-passed }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-6 }
        attribute: { name: data-name, value: "isHappyHourNow > is off at 16:00" }
        retry: { maxAttempts: 2, delayMs: 500 }

  - id: timers
    chapter: "setTimeout ကို မစောင့်ဘဲ စစ်ရအောင်"
    narration: >
      [[mark:open-kitchen-test]] အခု ၃ မိနစ် စောင့်ရတဲ့ ပြဿနာကို ဖြေရှင်းရအောင်။ ဒါက kitchen ရဲ့ test
      ဖိုင်ပါ။ [[mark:select-hooks]] ဒီ ဖိုင်ကလည်း ခုနက ပုံစံအတိုင်း၊ test တိုင်း မစခင် နာရီ အတုကို
      ဖွင့်ပြီး ပြီးတိုင်း ပြန်ပိတ်အောင် ပြင်ဆင်ထားပြီးသားပါ။ [[mark:type-brew-test]] todo ရဲ့ နေရာမှာ
      တကယ့် test ကို ရေးပြီး၊ todo line ကိုတော့ သူ့အောက်မှာ comment အဖြစ် ထားခဲ့ပါမယ်။
      [[mark:select-brew]] test က ကောင်တာရဲ့ callback နေရာမှာ mock function တစ်ခု ထည့်ပြီး လက်ဖက်ရည်
      ဖျော်ပါတယ်။ [[mark:select-almost]] advance Timers By Time နဲ့ နာရီ အတုကို ၃ မိနစ်ထက် တစ်
      millisecond လျော့ပြီး ရှေ့တိုးလိုက်တော့၊ callback ကို မခေါ်ရသေးဘူးလို့ စစ်ပါတယ်။
      [[mark:select-ready]] နောက်ထပ် တစ် millisecond တိုးလိုက်မှ၊ အော်ဒါ စာရွက်နဲ့ ခေါ်ရမယ်လို့
      စစ်ပါတယ်။ ဒီလို နှစ်ဘက်လုံးကို စစ်ထားလို့၊ စောပြီး ခေါ်တာရော၊ အချိန်ပြည့်တာတောင် မခေါ်တာရော
      နှစ်မျိုးလုံးကို ဖမ်းနိုင်ပါတယ်။ [[mark:read-brew]] panel မှာ todo ပျောက်သွားပြီး၊ summary မှာ ၇
      ခုလုံး pass လို့ ပြနေပါတယ်။ ၃ မိနစ်ကို မစောင့်ဘဲ ချက်ချင်း ပြီးသွားတာပါ။ စောင့်နေတဲ့ timer
      အားလုံးကို တစ်ခါတည်း run ချင်ရင်တော့ run All Timers ကို သုံးနိုင်ပါတယ်။
    sources:
      - { title: "Vitest: Mocking, Timers", url: "https://vitest.dev/guide/mocking/timers" }
      - {
          title: "Vitest: vi.advanceTimersByTime",
          url: "https://vitest.dev/api/vi#vi-advancetimersbytime",
        }
      - { title: "Vitest: vi.runAllTimers", url: "https://vitest.dev/api/vi#vi-runalltimers" }
      - {
          title: "Vitest: mock functions, toHaveBeenCalledWith",
          url: "https://vitest.dev/api/expect#tohavebeencalledwith",
        }
    actions:
      - id: open-kitchen-test
        type: workspace.openFile
        at: { mark: open-kitchen-test }
        path: src/kitchen.test.js
      - id: select-hooks
        type: editor.select
        at: { mark: select-hooks }
        target:
          {
            file: src/kitchen.test.js,
            text: "beforeEach(() => {\n    vi.useFakeTimers();\n  });\n  afterEach(() => {\n    vi.useRealTimers();\n  });",
            occurrence: 1,
          }
      - id: type-brew-test
        type: editor.type
        at: { mark: type-brew-test }
        target:
          {
            file: src/kitchen.test.js,
            after: "    vi.useRealTimers();\n  });\n\n  ",
            occurrence: 1,
          }
        text: "test(\"calls back after three minutes\", () => {\n    const ticket = { no: 1, id: \"tea\" };\n    const onReady = vi.fn();\n    brew(ticket, onReady);\n\n    vi.advanceTimersByTime(READY_AFTER_MS - 1);\n    expect(onReady).not.toHaveBeenCalled();\n\n    vi.advanceTimersByTime(1);\n    expect(onReady).toHaveBeenCalledWith(ticket);\n  });\n  // "
        # One block that also turns the todo line below it into a comment (the one-insert
        # replacement, COURSE-KIT §5): every state parses, one write, one run.
        cadence: block
      - id: expect-seven-passed
        type: expect.preview
        at: { afterAction: type-brew-test }
        timeoutMs: 8000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "7" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-no-todo
        type: expect.preview
        at: { afterAction: expect-seven-passed }
        timeoutMs: 5000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-todo, value: "0" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: expect-brew-pass
        type: expect.preview
        at: { afterAction: expect-no-todo }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-7 }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-brew
        type: editor.select
        at: { mark: select-brew }
        target:
          {
            file: src/kitchen.test.js,
            text: "const onReady = vi.fn();\n    brew(ticket, onReady);",
            occurrence: 1,
          }
      - id: select-almost
        type: editor.select
        at: { mark: select-almost }
        target:
          {
            file: src/kitchen.test.js,
            text: "vi.advanceTimersByTime(READY_AFTER_MS - 1);\n    expect(onReady).not.toHaveBeenCalled();",
            occurrence: 1,
          }
      - id: select-ready
        type: editor.select
        at: { mark: select-ready }
        target:
          {
            file: src/kitchen.test.js,
            text: "vi.advanceTimersByTime(1);\n    expect(onReady).toHaveBeenCalledWith(ticket);",
            occurrence: 1,
          }

  - id: inject
    chapter: "အချိန်ကို argument အဖြစ် ပေးရင်"
    narration: >
      fake timers က ရှိပြီးသား code ကို မပြင်ဘဲ စစ်ချင်တဲ့အခါ အသုံးဝင်ပါတယ်။ code ကို ပြင်လို့
      ရရင်တော့ ပိုရိုးရှင်းတဲ့ နည်းက၊ အချိန်ကို function ထဲမှာ မဖတ်ဘဲ argument အဖြစ် လက်ခံတာပါ။
      [[mark:open-discount-2]] discount ဖိုင်ကို ဖွင့်ပါမယ်။ [[mark:type-extract]] စည်းကမ်းကို အချိန်
      လက်ခံတဲ့ function အသစ်ထဲ ရွှေ့ပြီး၊ အရင် function ကတော့ နာရီကို ဖတ်ပြီး အဲဒါကို ခေါ်ပေးရုံပဲ
      လုပ်ပါမယ်။ [[mark:select-core]] function အသစ်က ပေးလိုက်တဲ့ အချိန်ကနေ နာရီကို ယူပြီး
      ဆုံးဖြတ်ပါတယ်။ အရင် line ကိုတော့ comment အဖြစ် ထားခဲ့ပါတယ်။ fake timers test တွေ pass
      ဖြစ်နေတုန်းမို့၊ code ပုံစံ ပြောင်းပေမဲ့ အလုပ်လုပ်ပုံ မပြောင်းဘူး ဆိုတာ သိနိုင်ပါတယ်။
      [[mark:open-test-3]] test ဖိုင်ကို ပြန်ဖွင့်ပြီး function အသစ်ကို import လုပ်ပါမယ်။ describe
      ထဲက test တွေကိုတော့ မထိပါဘူး။ [[mark:type-plain-test]]
      ပြီးတော့ describe ရဲ့ အပြင်ဘက်မှာ test အသစ် တစ်ခု ထည့်ပါမယ်။ ဒီ test က function အသစ်ကို
      တိုက်ရိုက် စစ်ပါတယ်။ [[mark:select-dates]] fake timers လည်း မပါ၊ hook လည်း မပါပါဘူး။ ၂ နာရီနဲ့ ၄
      နာရီကို Date နှစ်ခု ဆောက်ပြီး function ဆီ ပေးလိုက်ရုံပါ။ [[mark:read-eight]] test ၈ ခုလုံး pass
      ဖြစ်ပြီး၊ test အသစ်မှာ ပြန်ဖြုတ်ရမယ့် အတုလည်း မရှိပါဘူး။ နောက်ပိုင်း lesson တစ်ခုမှာ ဒီ နည်းကို
      ပိုကျယ်ကျယ် သုံးကြည့်ပါမယ်။ [[mark:ai-note]] AI assistant တွေနဲ့ အလုပ်လုပ်ရင်လည်း ဒါ အရေးကြီးပါတယ်။
      အစက ပြောခဲ့တဲ့ test လို၊ ည ၈ နာရီမှာ မှန်တဲ့ code နဲ့တောင် pass လို့ မရတဲ့ test ကို ပေးရင်၊
      assistant က code ကို မှန်အောင် မပြင်ဘဲ test အောင်ဖို့ပဲ လမ်းရှာနိုင်ပါတယ်။ [[mark:ai-fact]] AI ကုမ္ပဏီ
      Anthropic က ၂၀၂၆ ခုနှစ် စက်တင်ဘာလမှာ ထုတ်ခဲ့တဲ့ အစီရင်ခံစာအရ၊ model တွေကို training လုပ်နေတုန်း
      ပြီးအောင် လုပ်လို့ မရတဲ့ task တွေ ပေးတဲ့အခါ၊ ဒီလို test အောင်ဖို့ပဲ လမ်းရှာတာ၊ ပြီးအောင် လုပ်လို့
      ရတဲ့ task တွေထက် ၃ ဆကနေ ၆ ဆအထိ ပိုများတယ်လို့ တွေ့ခဲ့ပါတယ်။ [[mark:ai-advice]] ဒါကြောင့်
      အချိန်ကို test ထဲမှာ ရှင်းရှင်း သတ်မှတ်ပြီး၊ မဖြစ်နိုင်တဲ့ test ကို တွေ့ရင် ရပ်ပြီး မေးဖို့
      assistant ကို ပြောထားပါ။
    sources:
      - {
          title: "web.dev Learn Testing: Test algorithmic or business logic",
          url: "https://web.dev/learn/testing/get-started/testing-environment#test_algorithmic_or_business_logic",
        }
      - {
          title: "web.dev Learn Testing: Welcome, coming soon: writing testable code",
          url: "https://web.dev/learn/testing/welcome",
        }
      - {
          title: "Anthropic: System Card, Claude Opus 5.5, Sept 2026, sections 6.2.1-6.2.2 (facts D07)",
          url: "https://www.anthropic.com/claude-opus-5-5-system-card",
        }
      - {
          title: "Anthropic: System Card, Claude Opus 4 and Sonnet 4, May 2025, reward hacking (facts D06)",
          url: "https://www.anthropic.com/claude-4-system-card",
        }
    actions:
      - id: open-discount-2
        type: workspace.openFile
        at: { mark: open-discount-2 }
        path: src/discount.js
      - id: type-extract
        type: editor.type
        at: { mark: type-extract }
        target:
          { file: src/discount.js, after: "export function isHappyHourNow() {\n  ", occurrence: 1 }
        text: "return isHappyHour(new Date());\n}\n\nexport function isHappyHour(date) {\n  const hour = date.getHours();\n  // "
        # One block at the old line's first character (COURSE-KIT §5): the wrapper, the new function's
        # head and its first line, then "// " so the old clock line becomes a comment. Every state parses.
        cadence: block
      - id: select-core
        type: editor.select
        at: { mark: select-core }
        target:
          {
            file: src/discount.js,
            text: "export function isHappyHour(date) {\n  const hour = date.getHours();",
            occurrence: 1,
          }
      - id: open-test-3
        type: workspace.openFile
        at: { mark: open-test-3 }
        path: src/discount.test.js
      - id: type-import-core
        type: editor.type
        at: { afterAction: open-test-3 }
        target: { file: src/discount.test.js, after: "import { codePercent, ", occurrence: 1 }
        text: "isHappyHour, "
      - id: type-plain-test
        type: editor.type
        at: { mark: type-plain-test }
        target:
          {
            file: src/discount.test.js,
            after: "    expect(isHappyHourNow()).toBe(false);\n  });\n});\n",
            occurrence: 1,
          }
        text: "\ntest(\"checks the time it is given\", () => {\n  const at2pm = new Date(2026, 10, 5, 14, 0);\n  const at4pm = new Date(2026, 10, 5, 16, 0);\n\n  expect(isHappyHour(at2pm)).toBe(true);\n  expect(isHappyHour(at4pm)).toBe(false);\n});\n"
        cadence: block
      - id: expect-eight-passed
        type: expect.preview
        at: { afterAction: type-plain-test }
        timeoutMs: 8000
        target: { by: testId, value: vt-summary }
        attribute: { name: data-tests-passed, value: "8" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-plain-test
        type: expect.preview
        at: { afterAction: expect-eight-passed }
        timeoutMs: 5000
        target: { by: testId, value: vt-test-7 }
        attribute: { name: data-name, value: "checks the time it is given" }
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: select-dates
        type: editor.select
        at: { mark: select-dates }
        target:
          {
            file: src/discount.test.js,
            text: "const at2pm = new Date(2026, 10, 5, 14, 0);\n  const at4pm = new Date(2026, 10, 5, 16, 0);",
            occurrence: 1,
          }
      - id: expect-discount-file
        type: expect.file
        at: { mark: read-eight }
        path: src/discount.js
        contains: "export function isHappyHourNow() {\n  return isHappyHour(new Date());\n}\n\nexport function isHappyHour(date) {\n  const hour = date.getHours();\n  // const hour = new Date().getHours();\n  return hour >= 14 && hour < 16;\n}"
      - id: expect-discount-test-file
        type: expect.file
        at: { afterAction: expect-discount-file }
        path: src/discount.test.js
        contains: "  beforeEach(() => {\n    vi.useFakeTimers();\n  });\n  afterEach(() => {\n    vi.useRealTimers();\n  });\n\n  test(\"is off at 13:59\", () => {"
      - id: expect-kitchen-test-file
        type: expect.file
        at: { afterAction: expect-discount-test-file }
        path: src/kitchen.test.js
        contains: "    vi.advanceTimersByTime(READY_AFTER_MS - 1);\n    expect(onReady).not.toHaveBeenCalled();\n\n    vi.advanceTimersByTime(1);\n    expect(onReady).toHaveBeenCalledWith(ticket);"
      - id: open-ai-board
        type: whiteboard.apply
        at: { mark: ai-note }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-ai-fact
        type: whiteboard.apply
        at: { mark: ai-fact }
        upsertIds: [c-box, c-src, c-task, c-hack]
        drawMs: 3500
      - id: draw-ai-advice
        type: whiteboard.apply
        at: { mark: ai-advice }
        upsertIds: [c-advice]
        drawMs: 1500

  - id: recap
    chapter: "ပြန်ချုပ်ရရင်"
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ နာရီကို ကိုယ်တိုင် ဖတ်တဲ့ code ကို အစစ် နာရီနဲ့ စစ်ရင် flaky test
      ဖြစ်ပါတယ်။ use Fake Timers နဲ့ set System Time က အခု အချိန်ကို ပုံသေ ထားပေးပြီး၊ after Each မှာ
      အစစ် နာရီကို ပြန်ထားရပါတယ်။ [[mark:recap-edges]] boundary နှစ်ဘက်လုံးကို စစ်ပြီး၊ set Timeout
      ကိုတော့ advance Timers By Time နဲ့ မစောင့်ဘဲ စစ်ပါတယ်။ code ကို ပြင်လို့ ရရင်တော့ အချိန်ကို
      argument အဖြစ် ပေးတာ အရိုးရှင်းဆုံးပါ။ နောက် lesson မှာတော့ test တွေ ဘယ်မှာ run လဲ ဆိုတဲ့ test
      environment ကို ကြည့်ပါမယ်။ Node ထဲမှာ ရိုးရိုး run တာ၊ Node ထဲမှာ DOM အတုနဲ့ run တာ၊ browser
      အစစ်ထဲမှာ run တာ ဘယ်လို ကွာလဲ ဆိုတာပါ။
    sources:
      - { title: "Vitest: Mocking, Timers", url: "https://vitest.dev/guide/mocking/timers" }
      - {
          title: "web.dev Learn Testing: The testing environment",
          url: "https://web.dev/learn/testing/get-started/testing-environment",
        }
    actions:
      - id: close-ai-board
        type: whiteboard.apply
        at: { scene: start }
        open: false
      # The recap is spoken over the settled green report. In a render the last edit is a minute old
      # by now; verify replays the import keystrokes and the last block back to back, so this check
      # also waits out the bridge's last quiet window there.
      - id: expect-final-pass
        type: expect.preview
        at: { afterAction: close-ai-board }
        timeoutMs: 8000
        target: { by: testId, value: vt-status }
        attribute: { name: data-state, value: pass }
        retry: { maxAttempts: 3, delayMs: 1000 }
checks:
  - { type: timing.p95Ms, max: 300 }
