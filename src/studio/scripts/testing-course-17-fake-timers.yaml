          renderLint(report);
          void mountApp(report.app);
        }

        if (import.meta.hot) {
          const hello = () => import.meta.hot.send(`${EVENT}:hello`, { app: appEntry, lint: modes.includes("lint") });
          import.meta.hot.on(EVENT, render);
          import.meta.hot.on("vite:ws:connect", hello);
          hello();
        }
      course/vitest-bridge.js: |
        // Testing course · Vitest bridge (a Vite plugin that runs in the dev server; pinned, never edited).
        //
        // Starts the real Vitest (its Node API, watch mode) inside the dev-server process and sends the
        // results of every test run to the preview page (course/panel.js) over Vite's HMR socket: test
        // files → suites → tests with their state (pass / fail / skip / todo), each failure with Vitest's
        // own error name, message, Expected / Received diff and the ❯ file:line:col code frame, errors
        // outside tests (a syntax error, a failed import), console output from tests, the Test Files /
        // Tests summary, snapshots and, when the config turns it on, coverage. Nothing is invented here:
        // every value comes from Vitest's reporter API (TestModule / TestCase / onCoverage).
        //
        // Runs follow the dev server's file watcher. Typing in the studio writes a file chunk by chunk, so
        // the bridge runs once the files have been quiet for QUIET_MS (the studio's natural typing pauses
        // at most ~960 ms between keys), or for SYNTAX_QUIET_MS while a changed script does not parse yet
        // (line-by-line typing pauses up to ~1.4 s between lines) — a real syntax error still shows.
        // Vitest's own Vite server watches nothing, so it never reruns half-typed code by itself. Which
        // tests rerun is Vitest's own watch-mode decision (vitest.watcher). An edit of vitest.config.js
        // restarts Vitest with the new config; the page never reloads.
        //
        // The dev server starts listening only after the first test run has finished, so the first report
        // is ready when the preview opens; a page that loads later asks for the latest report ("hello").
        //
        // A file watcher can miss a write: macOS FSEvents drops events under heavy disk I/O (it asks the
        // consumer to rescan, which chokidar 3 does not do), and one lost event left a lesson's panel on an
        // old report for the rest of a replay. So every POLL_MS the bridge also compares src/ and the
        // Vitest config with what it last handed to Vitest (modification time and size), and treats a file
        // that changed at least MISSED_AFTER_MS ago without any watcher event exactly like a watcher event
        // (once per state of the file). When the watcher works, every change is already pending or handed
        // over, and the check does nothing.
        import { createHash } from "node:crypto";
        import { existsSync, readFileSync, readdirSync, statSync } from "node:fs";
        import { isAbsolute, join, posix, relative } from "node:path";
        import { PassThrough, Writable } from "node:stream";
        import { pathToFileURL } from "node:url";
        import * as vite from "vite";

        const EVENT = "course:vitest";
        const QUIET_MS = 1000;
        const SYNTAX_QUIET_MS = 2500;
        const NO_RUN_GRACE_MS = 700;
        const POLL_MS = 500;
        const MISSED_AFTER_MS = 300;
        const FIRST_RUN_LIMIT_MS = 45000;
        const CONFIG_FILES = ["vitest.config.js", "vitest.config.mjs", "vitest.config.ts"];
        const SCRIPT = /\.(c|m)?(js|jsx|ts|tsx)$/;
        const APP_PREFIX = "/@course-app/";
        const OUTPUT_DIR = "node_modules/.course";

        export default function courseVitestBridge() {
          let bridge = null;
          return {
            name: "course-vitest-bridge",
            enforce: "pre",
            // Only in the dev server: Vitest's own Vite server runs in mode "test" and never applies it.
            apply: (_config, env) => env.command === "serve" && env.mode !== "test",
            async configureServer(server) {
              bridge = createBridge(server);
              await bridge.firstRun();
            },
            resolveId(id, importer) {
              if (id.startsWith(APP_PREFIX)) return id.split("?")[0];
              // A relative import inside the app copy stays inside the same immutable copy.
              if (importer?.startsWith(APP_PREFIX) && id.startsWith(".")) return posix.join(posix.dirname(importer), id.split("?")[0]);
              return null;
            },
            load(id) {
              return id.startsWith(APP_PREFIX) ? (bridge?.appModule(id) ?? null) : null;
            },
            async buildEnd() {
              await bridge?.close();
            },
          };
        }

        function createBridge(server) {
          const root = server.config.root;
          const rel = (file) => relative(root, file).split("\\").join("/");
          const inProject = (file) => {
            const r = relative(root, file);
            return !!r && !r.startsWith("..") && !isAbsolute(r);
          };
          // Snapshot files are Vitest's own output: a write of one is no reason to run again (Vitest's own
          // watch mode does not rerun for them either, since no test imports a .snap file).
          const ignored = (file) =>
            !inProject(file) || file.endsWith(".snap") || rel(file).split("/").some((part) => part === "node_modules" || part === ".git");

          let current = null; // the Vitest instance (set in onInit, before its first run ends)
          let starting = null; // a (re)start in progress
          let closed = false;
          let seq = 0; // finished runs
          let running = true; // edits are waiting or a run is in flight
          let latest = { seq: 0, state: "waiting", note: "Vitest is starting…", files: [], failures: [], console: [], summary: emptySummary(), snapshot: null, coverage: null, app: null };
          let coverage = null;
          let runStarted = false;
          const vitestLog = [];

          // ------------------------------------------------------------------ the page
          const view = () => ({ ...latest, running });
          const broadcast = () => server.ws.send({ type: "custom", event: EVENT, data: view() });
          const setRunning = (value) => {
            if (running === value) return;
            running = value;
            broadcast();
          };
          server.ws.on(`${EVENT}:hello`, async (data, client) => {
            const app = typeof data?.app === "string" && data.app ? data.app : null;
            if (app !== wantsApp || (app && !latest.app)) {
              wantsApp = app;
              latest = { ...latest, app: await appState() };
            }
            if (data?.lint && !wantsLint) {
              wantsLint = true;
              latest = { ...latest, lint: await lintNow() };
            }
            client.send(EVENT, view());
          });

          // ------------------------------------------------------------------ Vitest
          // One reporter per Vitest instance: a closing instance (a restart) can still report a late run,
          // and only the current instance's events may reach the page.
          const makeReporter = () => {
            let mine = null;
            const live = () => mine !== null && mine === current;
            return {
              onInit(instance) {
                mine = instance;
                current = instance;
                // Vitest's own file watcher is closed: only this bridge decides when to rerun.
                void instance.vite?.watcher?.close();
              },
              onTestRunStart() {
                if (!live()) return;
                runStarted = true;
                setRunning(true);
              },
              onCoverage(map) {
                if (live()) coverage = summarizeCoverage(map, rel);
              },
              async onTestRunEnd(_modules, unhandledErrors) {
                if (!live()) return;
                const report = buildReport(current, unhandledErrors, { seq: seq + 1, root, rel, inProject });
                report.coverage = current?.config?.coverage?.enabled ? coverage : null;
                report.app = await appState();
                report.lint = wantsLint ? await lintNow() : null;
                if (!live()) return;
                seq += 1;
                report.seq = seq;
                latest = report;
                const t = latest.summary.tests;
                process.stdout.write(
                  `[course] vitest run ${seq}: ${latest.state === "pass" ? "PASS" : "FAIL"} · Tests ${t.failed} failed | ${t.passed} passed | ${t.skipped + t.todo} skipped (${t.total})\n`,
                );
                running = pending.size > 0;
                broadcast();
              },
            };
          };

          // Vitest's own terminal output (and its Vite server's log) goes here, not to the dev terminal:
          // the studio's verify step reads that terminal, and the panel already shows every result.
          const remember = (text) => {
            for (const line of String(text).split(/\r?\n/)) {
              const clean = stripAnsi(line).trimEnd();
              if (clean) vitestLog.push(clean);
            }
            if (vitestLog.length > 200) vitestLog.splice(0, vitestLog.length - 200);
          };
          const sink = new Writable({
            write(chunk, _encoding, done) {
              remember(chunk);
              done();
            },
          });
          const viteLogger = {
            hasWarned: false,
            info: remember,
            warn: (text) => ((viteLogger.hasWarned = true), remember(text)),
            warnOnce: (text) => ((viteLogger.hasWarned = true), remember(text)),
            error: (text) => remember(text?.message ?? text),
            clearScreen: () => {},
            hasErrorLogged: () => false,
          };

          // Typecheck mode: Vitest's watch mode would run `tsc --watch`, which reruns on every write by
          // itself (half-typed code, outside the quiet window). So with `typecheck.enabled` every rerun is a
          // fresh one-off `vitest run` instead (tsc runs once per quiet window; 1.6–3 s locally).
          const typecheckWanted = async (configFile) => {
            try {
              const config = (await import(`${pathToFileURL(configFile).href}?t=${Date.now()}`)).default;
              const resolved = typeof config === "function" ? await config({ command: "serve", mode: "test" }) : config;
              return resolved?.test?.typecheck?.enabled === true;
            } catch {
              return false;
            }
          };

          const start = async () => {
            const configFile = CONFIG_FILES.map((name) => join(root, name)).find((file) => existsSync(file));
            coverage = null;
            vitestLog.length = 0;
            const before = seq;
            try {
              const watch = !(configFile && (await typecheckWanted(configFile)));
              const { startVitest } = await import("vitest/node");
              const instance = await startVitest(
                [],
                {
                  root,
                  config: configFile ?? false,
                  watch,
                  reporters: [makeReporter()],
                  includeTaskLocation: true,
                  // Node imports vitest.config.js itself: a broken config throws one error into the panel
                  // instead of esbuild printing "✘ [ERROR]" lines into the dev terminal.
                  configLoader: "native",
                  // Coverage files stay out of the project: the studio would sync them into the editor.
                  coverage: { reportsDirectory: join(root, OUTPUT_DIR, "coverage"), reporter: [["json-summary", {}]] },
                },
                { clearScreen: false, customLogger: viteLogger },
                { stdin: new PassThrough(), stdout: sink, stderr: sink },
              );
              if (closed) {
                await instance?.close();
                return;
              }
              current = instance ?? current;
              if (seq === before) await failStart(vitestLog);
            } catch (error) {
              const message = stripAnsi(error?.message ?? error);
              await failStart([...vitestLog, /^\w*Error:/.test(message) ? message : `${error?.name ?? "Error"}: ${message}`]);
            }
          };

          const failStart = async (log) => {
            seq += 1;
            const message = stripAnsi(log.filter(Boolean).slice(-12).join("\n")).split(`${root}/`).join("") || "Vitest did not start.";
            latest = {
              seq,
              state: "fail",
              note: "Vitest did not start.",
              files: [],
              failures: [{ kind: "start", title: "Vitest could not start", test: "", name: "Error", message, expected: null, actual: null, diff: "", plugin: null, pluginFile: null, pluginFrame: null, codeFrame: null, frames: [], file: "", line: 0, col: 0, frame: null }],
              console: [],
              summary: emptySummary(),
              snapshot: null,
              coverage: null,
              app: await appState(),
            };
            running = pending.size > 0;
            broadcast();
          };

          // `starting` covers the old instance's close too, so no second restart can begin meanwhile.
          const restart = async () => {
            setRunning(true);
            const old = current;
            current = null;
            starting = (async () => {
              await old?.close().catch(() => {});
              await start();
            })();
            await starting;
            starting = null;
          };

          // ------------------------------------------------------------------ edits
          const pending = new Map(); // file -> "add" | "change" | "unlink"
          let timer = null;
          let noRunTimer = null;
          let lastChangeAt = 0;
          const schedule = (delay) => {
            clearTimeout(timer);
            timer = setTimeout(() => void flush(), delay);
          };

          const flush = async () => {
            timer = null;
            if (starting) return schedule(QUIET_MS);
            const quiet = Date.now() - lastChangeAt;
            if (quiet < SYNTAX_QUIET_MS && (await Promise.all([...pending.keys()].map(parses))).includes(false)) {
              return schedule(SYNTAX_QUIET_MS - quiet);
            }
            const changes = [...pending.entries()];
            pending.clear();
            if (!changes.length) return;
            for (const [file] of changes) if (inPollScope(rel(file))) handled.set(rel(file), stamp(rel(file))?.sig ?? null);
            // Typecheck mode reruns as a fresh one-off run (see typecheckWanted); a config edit restarts.
            if (!current || current.config?.typecheck?.enabled || changes.some(([file]) => CONFIG_FILES.includes(rel(file)))) return restart();
            runStarted = false;
            for (const [file, event] of changes) {
              if (event === "unlink") current.watcher.onFileDelete(file);
              else if (event === "add") current.watcher.onFileCreate(file);
              else current.watcher.onFileChange(file);
            }
            // A change that no test depends on runs nothing: show the last report as it was.
            clearTimeout(noRunTimer);
            noRunTimer = setTimeout(async () => {
              if (runStarted || pending.size || starting) return;
              if (wantsLint) latest = { ...latest, lint: await lintNow() };
              running = false;
              broadcast();
            }, NO_RUN_GRACE_MS);
          };

          const onWatch = (event, file) => {
            if (closed || !["add", "change", "unlink"].includes(event) || ignored(file)) return;
            lastChangeAt = Date.now();
            pending.set(file, pending.get(file) === "add" && event === "change" ? "add" : event);
            setRunning(true);
            schedule(QUIET_MS);
          };
          server.watcher.on("all", onWatch);

          // The safety net for a missed watcher event (see the header), keyed by project-relative path:
          // `handled` is each file of src/ and each config file as last handed to Vitest ("mtime:size",
          // null = absent); `reported` is the state the check last reported for a file, so it reports a
          // state at most once.
          const inPollScope = (path) =>
            CONFIG_FILES.includes(path) ||
            (path.startsWith("src/") && !path.split("/").some((part) => part === "node_modules" || part.startsWith(".")) && !path.endsWith(".snap"));
          const stamp = (path) => {
            try {
              const stats = statSync(join(root, path));
              return stats.isFile() ? { sig: `${stats.mtimeMs}:${stats.size}`, mtimeMs: stats.mtimeMs } : null;
            } catch {
              return null;
            }
          };
          const onDisk = () => {
            const files = new Map();
            const walk = (dir) => {
              let entries;
              try {
                entries = readdirSync(join(root, dir), { withFileTypes: true });
              } catch {
                return;
              }
              for (const entry of entries) {
                const path = `${dir}/${entry.name}`;
                if (entry.isDirectory()) {
                  if (entry.name !== "node_modules" && !entry.name.startsWith(".")) walk(path);
                } else if (inPollScope(path)) {
                  const now = stamp(path);
                  if (now) files.set(path, now);
                }
              }
            };
            walk("src");
            for (const path of CONFIG_FILES) {
              const now = stamp(path);
              if (now) files.set(path, now);
            }
            return files;
          };
          const handled = new Map([...onDisk()].map(([path, now]) => [path, now.sig]));
          const reported = new Map();
          const poll = setInterval(() => {
            if (closed) return;
            const disk = onDisk();
            const waiting = new Set([...pending.keys()].map(rel));
            const caught = [];
            for (const [path, now] of disk) {
              if (waiting.has(path) || Date.now() - now.mtimeMs < MISSED_AFTER_MS) continue;
              const before = handled.get(path);
              if (before === now.sig || reported.get(path) === now.sig) continue;
              caught.push([before ? "change" : "add", path, now.sig]);
            }
            for (const [path, before] of handled) {
              if (before && !disk.has(path) && !waiting.has(path) && reported.get(path) !== null) caught.push(["unlink", path, null]);
            }
            for (const [event, path, sig] of caught) {
              reported.set(path, sig);
              process.stdout.write(`[course] the file watcher missed ${event === "unlink" ? "the removal of" : "a change to"} ${path}; the bridge's own check caught it\n`);
              onWatch(event, join(root, path));
            }
          }, POLL_MS);
          poll.unref?.();

          // ------------------------------------------------------------------ the #app region
          // The page never imports a project file itself (half-typed code would raise Vite errors in it).
          // The bridge serves an immutable copy of src/ under /@course-app/<version>/ instead, taken when
          // a report is sent and only from files that parse, so the app is the code Vitest just tested.
          let wantsApp = null;
          const apps = new Map(); // version -> Map(path -> text)
          let lastApp = null;
          const appState = async () => {
            if (!wantsApp) return null;
            const files = new Map();
            const walk = (dir) => {
              if (!existsSync(dir)) return;
              for (const name of readdirSync(dir).sort()) {
                if (name === "node_modules" || name.startsWith(".")) continue;
                const path = join(dir, name);
                if (statSync(path).isDirectory()) walk(path);
                else if (/\.(c|m)?(js|jsx|ts|tsx)$|\.(css|json|svg)$/.test(name)) files.set(rel(path), readFileSync(path, "utf8"));
              }
            };
            walk(join(root, "src"));
            if (!files.has(wantsApp)) return { entry: wantsApp, version: lastApp?.version ?? null, error: `${wantsApp} not found` };
            const hash = createHash("sha256");
            for (const [path, text] of files) hash.update(`${path}\0${text}\0`);
            const version = hash.digest("hex").slice(0, 12);
            if (apps.has(version)) return { entry: wantsApp, version, error: "" };
            const scripts = [...files.keys()].filter((path) => SCRIPT.test(path));
            if ((await Promise.all(scripts.map((path) => parses(join(root, path))))).includes(false)) {
              return { entry: wantsApp, version: lastApp?.version ?? null, error: "" };
            }
            apps.set(version, files);
            if (apps.size > 40) apps.delete(apps.keys().next().value);
            lastApp = { version };
            return { entry: wantsApp, version, error: "" };
          };
          const appModule = (id) => {
            const rest = id.slice(APP_PREFIX.length);
            const slash = rest.indexOf("/");
            return apps.get(rest.slice(0, slash))?.get(rest.slice(slash + 1)) ?? null;
          };

          // ------------------------------------------------------------------ ESLint (data-modes "lint")
          // The project's own ESLint (its eslint.config.js) on src/, through ESLint's Node API.
          let wantsLint = false;
          let eslint = null;
          const lintNow = async () => {
            try {
              eslint ??= new (await import("eslint")).ESLint({ cwd: root });
              const results = await eslint.lintFiles(["src"]);
              const messages = results
                .flatMap((r) => r.messages.map((m) => ({ file: rel(r.filePath), line: m.line ?? 0, col: m.column ?? 0, rule: m.ruleId ?? "", severity: m.severity === 2 ? "error" : "warning", message: m.message })))
                .sort((a, b) => a.file.localeCompare(b.file) || a.line - b.line || a.col - b.col);
              return { messages, errors: messages.filter((m) => m.severity === "error").length, warnings: messages.filter((m) => m.severity === "warning").length, error: "" };
            } catch (error) {
              eslint = null;
              return { messages: [], errors: 0, warnings: 0, error: stripAnsi(error?.message ?? error).split(`${root}/`).join("") };
            }
          };

          // ------------------------------------------------------------------ lifecycle
          // The server listens once the first run has finished, or after FIRST_RUN_LIMIT_MS with a note
          // in the panel (a first run that never ends usually means a test loops forever or Vitest hangs).
          let firstRunPromise = null;
          const firstRun = () =>
            (firstRunPromise ??= Promise.race([
              (starting = start()).finally(() => (starting = null)),
              new Promise((done) =>
                setTimeout(() => {
                  if (!seq) latest = { ...latest, note: `Vitest's first run has not finished after ${FIRST_RUN_LIMIT_MS / 1000} s.` };
                  done();
                }, FIRST_RUN_LIMIT_MS),
              ),
            ]));
          const close = async () => {
            closed = true;
            clearInterval(poll);
            clearTimeout(timer);
            clearTimeout(noRunTimer);
            await starting?.catch(() => {});
            await current?.close().catch(() => {});
            current = null;
          };
          server.httpServer?.once("close", () => void close());

          return { firstRun, close, appModule };
        }

        // Does a changed script parse yet? Vite 7: rollup's parser for JavaScript / JSX, esbuild for
        // TypeScript (rollup cannot read types); Vite 8 would use oxc's parseSync for all of them.
        async function parses(file) {
          if (!SCRIPT.test(file) || !existsSync(file)) return true;
          try {
            const code = readFileSync(file, "utf8");
            if (typeof vite.parseSync === "function") return !vite.parseSync(file, code).errors?.length;
            if (/\.(c|m)?tsx?$/.test(file)) {
              await vite.transformWithEsbuild(code, file, { loader: /x$/.test(file) ? "tsx" : "ts" });
              return true;
            }
            vite.parseAst(code, { jsx: /x$/.test(file) });
            return true;
          } catch {
            return false;
          }
        }

        // -------------------------------------------------------------------- the report
        const stripAnsi = (text) => String(text ?? "").replace(/\x1b\[[0-9;?]*[A-Za-z]/g, "");
        const flatten = (nodes) => nodes.flatMap((n) => (n.kind === "suite" ? flatten(n.children) : [n]));

        function emptySummary() {
          return {
            files: { failed: 0, passed: 0, skipped: 0, total: 0 },
            tests: { failed: 0, passed: 0, skipped: 0, todo: 0, total: 0 },
          };
        }

        function testState(testCase) {
          const { state } = testCase.result();
          if (state === "passed") return "pass";
          if (state === "failed") return "fail";
          if (state === "skipped") return testCase.options.mode === "todo" ? "todo" : "skip";
          return "pending";
        }

        function buildReport(vitest, unhandledErrors, { seq, root, rel, inProject }) {
          const local = (text) => stripAnsi(text).split(`${root}/`).join("");
          const modules = (vitest?.state.getTestModules() ?? []).slice().sort((a, b) => a.relativeModuleId.localeCompare(b.relativeModuleId));
          const summary = emptySummary();
          const files = [];
          const suiteFailures = [];
          const testFailures = [];
          const consoleLines = [];
          const projectFile = (file) => !!file && inProject(file) && !file.split("/").includes("node_modules");

          const framesOf = (error) => {
            let frames = (error.stacks ?? []).map((s) => ({ method: s.method || "", file: s.file, line: s.line, col: s.column }));
            if (!frames.length) frames = parseStack([error.stack, error.runnerError?.stack].filter(Boolean).join("\n"));
            return frames.filter((f) => projectFile(f.file)).map((f) => ({ ...f, file: rel(f.file) }));
          };

          const entry = (kind, title, test, error) => {
            const frames = framesOf(error);
            const near = frames[0] ?? null;
            const rollup = error.__vitest_rollup_error__;
            return {
              kind,
              title: kind === "unhandled" && typeof error.type === "string" && error.type ? error.type : title,
              test,
              name: error.name || "Error",
              message: local(error.message ?? String(error)),
              expected: typeof error.expected === "string" ? local(error.expected) : null,
              actual: typeof error.actual === "string" ? local(error.actual) : null,
              diff: error.diff ? local(error.diff) : "",
              plugin: rollup?.plugin ?? null,
              pluginFile: rollup?.id ? `${rel(rollup.id)}${rollup.loc ? `:${rollup.loc.line}:${rollup.loc.column}` : ""}` : null,
              pluginFrame: rollup?.frame ? local(rollup.frame) : null,
              codeFrame: error.codeFrame ? local(error.codeFrame) : null,
              frames,
              file: near?.file ?? "",
              line: near?.line ?? 0,
              col: near?.col ?? 0,
              frame: near ? codeFrame(join(root, near.file), near.line, near.col) : null,
            };
          };

          const logsOf = (entity, file, test) => {
            for (const log of entity.logs?.() ?? []) {
              consoleLines.push({ type: log.type, file, test, content: local(log.content).replace(/\n$/, "") });
            }
          };

          const walk = (collection, file) => {
            const nodes = [];
            for (const child of collection) {
              if (child.type === "suite") {
                logsOf(child, file, child.fullName);
                const children = walk(child.children, file);
                const states = flatten(children).map((n) => n.state);
                const errors = child.errors();
                nodes.push({
                  kind: "suite",
                  name: child.name,
                  fullName: child.fullName,
                  line: child.location?.line ?? 0,
                  state: states.includes("fail") || errors.length ? "fail" : states.length && states.every((s) => s === "skip" || s === "todo") ? "skip" : "pass",
                  count: states.length,
                  children,
                });
                for (const error of errors) suiteFailures.push(entry("suite", `${file} > ${child.fullName}`, child.fullName, error));
                continue;
              }
              const state = testState(child);
              summary.tests.total += 1;
              if (state === "pass") summary.tests.passed += 1;
              else if (state === "fail") summary.tests.failed += 1;
              else if (state === "todo") summary.tests.todo += 1;
              else if (state === "skip") summary.tests.skipped += 1;
              logsOf(child, file, child.fullName);
              nodes.push({ kind: "test", name: child.name, fullName: child.fullName, line: child.location?.line ?? 0, state });
              if (state === "fail") {
                for (const error of child.result().errors ?? []) testFailures.push(entry("test", `${file} > ${child.fullName}`, child.fullName, error));
              }
            }
            return nodes;
          };

          for (const module of modules) {
            const file = module.relativeModuleId;
            logsOf(module, file, "");
            const tests = walk(module.children, file);
            const moduleErrors = module.errors();
            const flat = flatten(tests);
            const count = (state) => flat.filter((n) => n.state === state).length;
            const state = moduleErrors.length || count("fail") || !flat.length ? "fail" : flat.every((n) => n.state === "skip" || n.state === "todo") ? "skip" : "pass";
            summary.files.total += 1;
            summary.files[state === "fail" ? "failed" : state === "skip" ? "skipped" : "passed"] += 1;
            let pool = "";
            try {
              pool = module.toTestSpecification().pool;
            } catch {
              // An older Vitest: no specification on the module.
            }
            files.push({ file, state, typecheck: pool === "typescript", count: flat.length, failed: count("fail"), skipped: count("skip"), todo: count("todo"), tests });
            for (const error of moduleErrors) suiteFailures.push(entry("suite", `${file} [ ${file} ]`, "", error));
            if (!flat.length && !moduleErrors.length) {
              suiteFailures.push(entry("suite", `${file} [ ${file} ]`, "", { name: "Error", message: `No test suite found in file ${file}` }));
            }
          }
          const unhandled = (unhandledErrors ?? []).map((error) => entry("unhandled", "Unhandled Error", "", error));
          const failures = [...suiteFailures, ...testFailures, ...unhandled];

          const s = vitest?.snapshot?.summary;
          const snapshot = {
            written: s?.added ?? 0,
            matched: s?.matched ?? 0,
            failed: s?.unmatched ?? 0,
            updated: s?.updated ?? 0,
            obsolete: s?.unchecked ?? 0,
            files: snapshotFiles(root, rel),
          };

          const ok = modules.length && !failures.length && !summary.tests.failed && !summary.files.failed;
          return {
            seq,
            state: ok ? "pass" : "fail",
            note: modules.length ? "" : "No test files found.",
            files,
            failures,
            console: consoleLines.slice(-60),
            summary,
            snapshot,
            coverage: null,
          };
        }

        function parseStack(stack) {
          const frames = [];
          for (const line of String(stack).split("\n")) {
            const m = /^\s*at (?:(.+?) \()?(?:file:\/\/)?(\/[^():]+):(\d+):(\d+)\)?\s*$/.exec(line);
            if (!m) continue;
            const method = (m[1] ?? "").replace(/^async /, "");
            frames.push({ method, file: m[2], line: Number(m[3]), col: Number(m[4]) });
          }
          return frames;
        }

        // Vitest's code frame: two lines either side of the failing line and a caret under its column.
        function codeFrame(file, line, col) {
          if (!existsSync(file)) return null;
          const lines = readFileSync(file, "utf8").split(/\r?\n/);
          const out = [];
          for (let n = line - 2; n <= line + 2; n++) {
            if (n < 1 || n > lines.length) continue;
            out.push({ no: n, text: lines[n - 1].replace(/\t/g, " ") });
            if (n === line) out.push({ no: null, text: `${" ".repeat(Math.max(0, col - 1))}^` });
          }
          return out;
        }

        function snapshotFiles(root, rel) {
          const found = [];
          const walk = (dir) => {
            if (!existsSync(dir)) return;
            for (const name of readdirSync(dir).sort()) {
              if (name === "node_modules" || name.startsWith(".")) continue;
              const path = join(dir, name);
              if (statSync(path).isDirectory()) walk(path);
              else if (name.endsWith(".snap")) found.push({ file: rel(path), content: readFileSync(path, "utf8") });
            }
          };
          walk(join(root, "src"));
          return found;
        }

        function summarizeCoverage(map, rel) {
          if (!map || typeof map.files !== "function") return null;
          const rows = [];
          const total = { statements: [0, 0], branches: [0, 0], functions: [0, 0], lines: [0, 0] };
          for (const file of map.files().sort()) {
            const fc = map.fileCoverageFor(file);
            const s = fc.toSummary();
            const pct = (k) => (s[k].total ? Math.round((s[k].covered / s[k].total) * 10000) / 100 : 100);
            for (const k of Object.keys(total)) {
              total[k][0] += s[k].covered;
              total[k][1] += s[k].total;
            }
            rows.push({ file: rel(file), statements: pct("statements"), branches: pct("branches"), functions: pct("functions"), lines: pct("lines"), uncovered: ranges(fc.getUncoveredLines().map(Number)) });
          }
          const all = (k) => (total[k][1] ? Math.round((total[k][0] / total[k][1]) * 10000) / 100 : 100);
          return { rows, all: { statements: all("statements"), branches: all("branches"), functions: all("functions"), lines: all("lines") } };
        }

        function ranges(numbers) {
          const sorted = [...new Set(numbers)].sort((a, b) => a - b);
          const out = [];
          for (let i = 0; i < sorted.length; i++) {
            let j = i;
            while (j + 1 < sorted.length && sorted[j + 1] === sorted[j] + 1) j++;
            out.push(i === j ? String(sorted[i]) : `${sorted[i]}-${sorted[j]}`);
            i = j;
          }
          return out.join(",");
        }
