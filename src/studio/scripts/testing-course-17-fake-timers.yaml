      package.json: |
        {
          "name": "testing-course-tea-shop",
          "private": true,
          "version": "1.0.0",
          "type": "module",
          "scripts": {
            "dev": "vite --host 0.0.0.0 --port 5173 --strictPort",
            "test": "vitest"
          },
          "devDependencies": {
            "vite": "7.3.7",
            "vitest": "5.1.0"
          }
        }
      src/discount.js: |
        // Happy hour: drinks are 20 % off from 14:00 to 15:59.
        export function isHappyHourNow() {
          const hour = new Date().getHours();
          return hour > 14 && hour < 16;
        }

        export function codePercent(code) {
          if (code.trim().toUpperCase() === "TEA10") return 10;
          return 0;
        }
      src/discount.test.js: |
        import { expect, test } from "vitest";
        import { codePercent } from "./discount.js";

        test("accepts the TEA10 code", () => {
          expect(codePercent("TEA10")).toBe(10);
        });
      src/kitchen.js: |
        // A drink is ready three minutes after brewing starts.
        export const READY_AFTER_MS = 3 * 60 * 1000;

        export function brew(ticket, onReady) {
          setTimeout(() => onReady(ticket), READY_AFTER_MS);
        }
      src/kitchen.test.js: |
        import { afterEach, beforeEach, describe, expect, test, vi } from "vitest";
        import { brew, READY_AFTER_MS } from "./kitchen.js";

        describe("brew", () => {
          beforeEach(() => {
            vi.useFakeTimers();
          });
          afterEach(() => {
            vi.useRealTimers();
          });

          test.todo("calls back after three minutes");
        });
      vite.config.js: |
        import { defineConfig } from "vite";
        import courseVitestBridge from "./course/vitest-bridge.js";

        // The course panel: the dev server runs the real Vitest and the preview shows its results.
        export default defineConfig({
          plugins: [courseVitestBridge()],
        });
      vitest.config.js: |
        import { defineConfig } from "vitest/config";

        export default defineConfig({
          test: {
          },
        });
