build:
  voiceProfile:
    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 9518

runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "no hold: A true B true balance -60.00\n"
      run-2:
        status: success
        exitCode: 0
        output: "no hold: A true B true balance -60.00\nw1 reserve 80.00: ok\nw2 reserve 80.00: rejected — available 20.00, need 80.00\ntotal 100.00  reserved 80.00  available 20.00\n"
      run-3:
        status: success
        exitCode: 0
        output: "no hold: A true B true balance -60.00\nw1 reserve 80.00: ok\nw2 reserve 80.00: rejected — available 20.00, need 80.00\ntotal 100.00  reserved 80.00  available 20.00\nw1 settle 79.50: ok\ntotal 20.50  reserved 0.00  available 20.50\n"

scenes:
  - id: hook
    chapter: Check လုပ်ပြီးမှ debit လုပ်ရင်
    narration: >-
      ငွေထုတ်တဲ့ request တစ်ခုက balance ကို စစ်ပြီး ချက်ချင်း debit လုပ်တာ မဟုတ်ပါဘူး။ ကြားထဲမှာ
      compliance check လုပ်တာ၊ ဘဏ်ဘက်မှာ withdrawal ကို မှတ်ပုံတင်တာ စတဲ့ အပြင်ဘက်က အလုပ်တွေ
      ရှိပါတယ်။ [[mark:sel-race]] ဒီ program က ယူရို ၁၀၀ ရှိတဲ့ account ကနေ ယူရို ရှစ်ဆယ်စီ ထုတ်မယ့်
      request နှစ်ခုကို၊ တပြိုင်နက် ဖြစ်တဲ့အခါ အဆင့်တွေ ရောသွားတဲ့ အစီအစဉ်အတိုင်း တစ်ဆင့်ချင်း
      ရေးထားတာပါ။ [[mark:sel-checks]] request နှစ်ခုလုံးက balance ကို အရင် စစ်ပါတယ်၊ ဒုတိယ request က
      ပထမ request က အပြင်ဘက်ကို စောင့်နေတုန်း စစ်တာပါ။ [[mark:sel-debits]] ပြီးမှ တစ်ခုချင်း debit
      လုပ်ပါတယ်။ balance ဘယ်လောက် ကျန်မလဲ ခန့်မှန်းကြည့်ပါ။ [[mark:run-1]] run လိုက်ရအောင်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Funds reservation (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#funds-reservation",
        }
    actions:
      - { id: open-main-1, type: workspace.openFile, at: { scene: start }, path: main.go }
      - id: sel-race
        type: editor.select
        at: { mark: sel-race }
        target: { file: main.go, text: "\tl := funded()", occurrence: 1 }
      - id: sel-checks
        type: editor.select
        at: { mark: sel-checks }
        target:
          {
            file: main.go,
            text: "\tokA := l.Balance(user) >= 8000 // A checks\n\tokB := l.Balance(user) >= 8000 // B checks while A is still waiting",
            occurrence: 1,
          }
      - id: sel-debits
        type: editor.select
        at: { mark: sel-debits }
        target:
          {
            file: main.go,
            text: "\t\tmust(l.Post(withdrawal(\"b\", user, 8000))) // B debits",
            occurrence: 1,
          }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "balance -60.00",
          timeoutMs: 8000,
        }

  - id: race
    narration: >-
      [[mark:pt-race]] check နှစ်ခုလုံး ဖြတ်သွားပြီး balance က အနုတ် ယူရို ခြောက်ဆယ် ဖြစ်သွားပါတယ်။
      ယူရို ၁၀၀ ပဲ ရှိတဲ့ account ကနေ ယူရို ၁၆၀ ထွက်သွားတာပါ။ [[mark:dock-1]] ကွာနေတဲ့ ယူရို
      ခြောက်ဆယ်က မရှိဘဲ ဖန်တီးလိုက်တဲ့ ငွေပါ။ [[mark:show-race]] request တစ်ခုက balance ကို စစ်တော့
      ယူရို ၁၀၀ ရှိလို့ ဖြတ်ပါတယ်။ [[mark:race-2]] ပြီးတော့ compliance နဲ့ ဘဏ်ကို စောင့်ပါတယ်၊ ဒီ
      ကြားကာလက database write တစ်ခုထက် အများကြီး ပိုကြာပါတယ်။ [[mark:pt-cb]] အဲဒီ ကြားထဲမှာ ဒုတိယ
      request ရောက်လာပြီး balance ကို စစ်တော့၊ ပထမ request က debit မလုပ်ရသေးလို့ ယူရို ၁၀၀ ကိုပဲ
      မြင်ပါတယ်။ [[mark:race-3]] နောက်ဆုံး နှစ်ခုလုံး debit လုပ်တော့ ငွေ တစ်စုတည်းက transaction
      နှစ်ခုကို ထောက်ပံ့လိုက်သလို ဖြစ်သွားပါတယ်။ [[mark:reverse]] အစီအစဉ်ကို ပြောင်းပြန် လုပ်ရင်လည်း
      မရပါဘူး၊ အပြင်ဘက်ကို အရင် ခေါ်ပြီးမှ balance မလောက်မှန်း သိရရင် ဘဏ်ဘက်မှာ withdrawal က
      မှတ်ပြီးသား ဖြစ်နေပါပြီ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Funds reservation (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#funds-reservation",
        }
    actions:
      - id: pt-race
        type: console.point
        at: { mark: pt-race }
        target: { text: "balance -60.00", occurrence: 1 }
      - { id: dock-1, type: runtime.collapseDock, at: { mark: dock-1 } }
      - {
          id: show-race,
          type: slide.show,
          at: { mark: show-race, offsetMs: -700 },
          slideId: race-1,
        }
      - {
          id: pt-ca,
          type: slide.point,
          at: { afterAction: show-race },
          target: { x: 0.295, y: 0.418 },
        }
      - { id: race-2, type: slide.show, at: { mark: race-2 }, slideId: race-2 }
      - {
          id: pt-wait,
          type: slide.point,
          at: { afterAction: race-2 },
          target: { x: 0.116, y: 0.514 },
        }
      - { id: pt-cb, type: slide.point, at: { mark: pt-cb }, target: { x: 0.655, y: 0.609 } }
      - { id: race-3, type: slide.show, at: { mark: race-3 }, slideId: race-3 }
      - {
          id: pt-neg,
          type: slide.point,
          at: { afterAction: race-3 },
          target: { x: 0.475, y: 0.896 },
        }

  - id: hold
    chapter: Hold and release
    narration: >-
      [[mark:show-bar]] ဖြေရှင်းနည်းက funds reservation ပါ၊ hold and release လို့လည်း ခေါ်ပါတယ်။
      အပြင်ဘက်ကို မခေါ်ခင် ငွေကို ဒီ transaction အတွက် သီးသန့် ဖယ်ထားပြီးမှ နှေးတဲ့ အလုပ်ကို
      လုပ်တာပါ။ [[mark:pt-f]] ဒါကြောင့် balance နှစ်မျိုး ဖြစ်လာပါတယ်။ total က user ပိုင်တဲ့ ငွေ
      အားလုံးပါ၊ reserve လုပ်ထားတာလည်း ပါပါတယ်။ available ကတော့ total ထဲက reserve လုပ်ထားတာကို
      နုတ်ထားတာပါ။ [[mark:bar-2]] ပထမ request က ယူရို ရှစ်ဆယ်ကို reserve လုပ်လိုက်ရင် total က ၁၀၀
      ရှိနေသေးပေမဲ့ available က နှစ်ဆယ်ပဲ ကျန်ပါတယ်။ [[mark:bar-3]] balance စစ်တာနဲ့ reservation အသစ်
      လုပ်တာ အားလုံးကို available နဲ့ စစ်တာမို့ ဒုတိယ request ရဲ့ ယူရို ရှစ်ဆယ်ကို ငြင်းလိုက်ပါတယ်။
      ငွေ တစ်စုတည်းက transaction နှစ်ခုကို မထောက်ပံ့နိုင်တော့တာ ဒီ စည်းမျဉ်းကြောင့်ပါ။ [[mark:bar-4]]
      အပြင်ဘက်က အလုပ် ပြီးတော့ reservation ကို settle လုပ်ပါတယ်။ fee ဒါမှမဟုတ် rate ကြောင့် နောက်ဆုံး
      ပမာဏက ခန့်မှန်းထားတာနဲ့ မတူနိုင်လို့၊ ခန့်မှန်းခြေ ယူရို ရှစ်ဆယ်ကို hold လုပ်ပြီး တကယ့် ပမာဏ
      ခုနစ်ဆယ့်ကိုး ဒသမ ငါး ကို settle လုပ်၊ ကျန်တဲ့ သုည ဒသမ ငါး ကို release လုပ်ပါတယ်။ [[mark:pt-rel]]
      ဒါက No invented data မူပါ၊ ငွေကို မရှိဘဲ မဖန်တီးရဘူး ဆိုတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Funds reservation (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#funds-reservation",
        }
      - {
          title: "Fintech Engineering Handbook — Principles (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#principles",
        }
    actions:
      - { id: show-bar, type: slide.show, at: { mark: show-bar, offsetMs: -700 }, slideId: bar-1 }
      - {
          id: pt-b1,
          type: slide.point,
          at: { afterAction: show-bar },
          target: { x: 0.5, y: 0.576 },
        }
      - { id: pt-f, type: slide.point, at: { mark: pt-f }, target: { x: 0.243, y: 0.327 } }
      - { id: bar-2, type: slide.show, at: { mark: bar-2 }, slideId: bar-2 }
      - { id: pt-b2, type: slide.point, at: { afterAction: bar-2 }, target: { x: 0.575, y: 0.624 } }
      - { id: bar-3, type: slide.show, at: { mark: bar-3 }, slideId: bar-3 }
      - {
          id: pt-w2-fig,
          type: slide.point,
          at: { afterAction: bar-3 },
          target: { x: 0.256, y: 0.876 },
        }
      - { id: bar-4, type: slide.show, at: { mark: bar-4 }, slideId: bar-4 }
      - { id: pt-st, type: slide.point, at: { afterAction: bar-4 }, target: { x: 0.256, y: 0.876 } }
      - { id: pt-rel, type: slide.point, at: { mark: pt-rel }, target: { x: 0.632, y: 0.842 } }

  - id: reserve
    narration: >-
      [[mark:close-bar]] code နဲ့ ရေးကြည့်ရအောင်။ [[mark:open-holds]] hold တွေကို ledger ဘေးမှာ သီးခြား
      သိမ်းထားပြီး၊ available က ledger ရဲ့ balance ထဲက ဖွင့်ထားဆဲ hold တွေကို နုတ်ထားတာပါ။
      [[mark:type-reserve]] Reserve က available ကို စစ်ပြီး hold ကို အဲဒီ တစ်ဆင့်တည်းမှာ မှတ်ပါတယ်။
      စစ်ပြီးတဲ့ နောက် ကြားထဲကို တခြား request ဝင်လို့ရတဲ့ အချိန် မကျန်အောင်ပါ။ ဒီ program မှာ request
      တွေ တစ်ခုပြီးမှ တစ်ခု run လို့ တစ်ဆင့်တည်း ဖြစ်ပြီးသားပါ၊ တကယ့် system မှာတော့ database ကို
      တစ်ဆင့်တည်း ဖြစ်အောင် ခိုင်းရပြီး၊ အဲဒါကို ခဏနေ ကြည့်ပါမယ်။ [[mark:open-main-2]] request
      နှစ်ခုကို reserve နဲ့ ပြန်လုပ်ကြည့်ရအောင်။ [[mark:type-calls]] ယူရို ၁၀၀ ရှိတဲ့ ledger အသစ်ပေါ်မှာ
      ယူရို ရှစ်ဆယ်စီ reserve နှစ်ခု လုပ်ပြီး၊ balance သုံးမျိုးလုံးကို ထုတ်ပြပါတယ်။ ဒီတစ်ခါ ဒုတိယ
      request ကို အပြင်ဘက် မခေါ်ခင်မှာပဲ ရပ်နိုင်ရပါမယ်။ [[mark:run-2]] run လိုက်ရအောင်။
      [[mark:pt-w2]] ဒုတိယ request ကို available နှစ်ဆယ်ပဲ ရှိလို့ ငြင်းလိုက်ပါတယ်။ [[mark:pt-bal2]]
      total က ၁၀၀၊ reserved က ရှစ်ဆယ်၊ available က နှစ်ဆယ် ဖြစ်ပြီး၊ [[mark:dock-2]] ledger ထဲမှာတော့ ငွေ ဘာမှ
      မရွေ့ရသေးပါဘူး။
    sources:
      - {
          title: "Fintech Engineering Handbook — Funds reservation (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#funds-reservation",
        }
    actions:
      - { id: close-bar, type: slide.close, at: { mark: close-bar } }
      - { id: open-holds, type: workspace.openFile, at: { mark: open-holds }, path: holds.go }
      - id: type-reserve
        type: editor.type
        at: { mark: type-reserve }
        target:
          {
            file: holds.go,
            after: "\treturn fmt.Errorf(\"no open hold %s\", id)\n}\n",
            occurrence: 1,
          }
        text: "\n// Reserve checks the available balance and records the hold in one step.\nfunc (h *Holds) Reserve(id, account string, amount int64) error {\n\tif avail := h.Available(account); amount > avail {\n\t\treturn fmt.Errorf(\"available %s, need %s\", cents(avail), cents(amount))\n\t}\n\th.holds = append(h.holds, Hold{ID: id, Account: account, Amount: amount, Open: true})\n\treturn nil\n}\n"
        cadence: line-by-line
      - { id: open-main-2, type: workspace.openFile, at: { mark: open-main-2 }, path: main.go }
      - id: type-calls
        type: editor.type
        at: { mark: type-calls }
        target:
          {
            file: main.go,
            after: "\tfmt.Println(\"no hold: A\", okA, \"B\", okB, \"balance\", cents(l.Balance(user)))\n",
            occurrence: 1,
          }
        text: "\n\th := &Holds{l: funded()}\n\tshow(\"w1 reserve 80.00\", h.Reserve(\"w1\", user, 8000))\n\tshow(\"w2 reserve 80.00\", h.Reserve(\"w2\", user, 8000))\n\tbalances(h)\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "w2 reserve 80.00: rejected",
          timeoutMs: 8000,
        }
      - id: pt-w2
        type: console.point
        at: { mark: pt-w2 }
        target: { text: "w2 reserve 80.00: rejected", occurrence: 1 }
      - id: pt-bal2
        type: console.point
        at: { mark: pt-bal2 }
        target: { text: "total 100.00", occurrence: 1 }
      - { id: dock-2, type: runtime.collapseDock, at: { mark: dock-2 } }

  - id: settle
    narration: >-
      [[mark:type-settle]] အပြင်ဘက်က တကယ့် ပမာဏ ခုနစ်ဆယ့်ကိုး ဒသမ ငါး ပြန်လာတယ် ဆိုပါစို့။ ဒီ line
      တွေက ပထမ hold ကို အဲဒီ ပမာဏနဲ့ settle လုပ်ပြီး balance တွေကို ပြန်ထုတ်ပါတယ်။ Settle က hold ကို
      ပိတ်ပြီး တကယ့် ပမာဏကိုပဲ ledger ထဲ post လုပ်လို့၊ hold လုပ်ထားတဲ့ ပိုငွေက အလိုလို available ထဲ
      ပြန်ရောက်ပါတယ်။ [[mark:run-3]] run လိုက်ရအောင်။ [[mark:pt-bal3]] total က နှစ်ဆယ် ဒသမ ငါး၊
      reserved က သုည၊ available ကလည်း နှစ်ဆယ် ဒသမ ငါး ဖြစ်ပါတယ်။ [[mark:dock-3]] ledger ထဲ ရောက်တာက
      တကယ် ထွက်သွားတဲ့ ငွေပဲ ဖြစ်ပြီး၊ ခန့်မှန်းခြေ ယူရို ရှစ်ဆယ်က ဘယ် entry ထဲမှာမှ မပါပါဘူး။
    sources:
      - {
          title: "Fintech Engineering Handbook — Funds reservation (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#funds-reservation",
        }
    actions:
      - id: type-settle
        type: editor.type
        at: { mark: type-settle }
        target:
          {
            file: main.go,
            after: "\tshow(\"w2 reserve 80.00\", h.Reserve(\"w2\", user, 8000))\n\tbalances(h)\n",
            occurrence: 1,
          }
        text: "\n\tshow(\"w1 settle 79.50\", h.Settle(\"w1\", 7950))\n\tbalances(h)\n"
        cadence: line-by-line
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "total 20.50",
          timeoutMs: 8000,
        }
      - {
          id: expect-file-reserve,
          type: expect.file,
          at: { afterAction: run-3 },
          path: holds.go,
          contains: "if avail := h.Available(account); amount > avail {",
        }
      - id: pt-bal3
        type: console.point
        at: { mark: pt-bal3 }
        target: { text: "total 20.50", occurrence: 1 }
      - { id: dock-3, type: runtime.collapseDock, at: { mark: dock-3 } }

  - id: life
    chapter: Reservation တိုင်း ဆုံးရမယ်
    narration: >-
      [[mark:show-life]] reservation တစ်ခုမှာ ပုံမှန် အဆုံး နှစ်မျိုး ရှိပါတယ်။ [[mark:life-2]] flow
      အောင်မြင်ရင် settle လုပ်ပြီး တကယ့် ပမာဏကို post လုပ်ပါတယ်၊ တစ်ခုခု မှားသွားရင် release လုပ်ပြီး
      ငွေက available ထဲ ပြန်ရောက်ပါတယ်။ ဒါကြောင့် reservation ဖန်တီးတဲ့ flow တိုင်းက အဲဒါကို
      တစ်နေရာမှာ ဆုံးအောင် တာဝန်ယူရပါတယ်။ [[mark:life-3]] ဘယ်သူမှ မဆုံးပေးတဲ့ hold က user ရဲ့ ငွေကို
      ပိတ်ထားပါတယ်။ expiry ဒါမှမဟုတ် timeout ကို safety net အနေနဲ့ ထားလို့ရပေမဲ့ မဖြစ်မနေ
      မဟုတ်ပါဘူး၊ system ရဲ့ discipline ကို အားကိုးလည်း ရပါတယ်။ [[mark:pt-orphan]] သတိထားမိဖို့
      ကောင်းတာက ဒီ failure mode က conservative ဖြစ်တာပါ။ orphan hold က ငွေကို lock ပဲ လုပ်ပြီး၊ ငွေ
      ပျောက်တာ၊ ငွေ ပေါ်လာတာ မဖြစ်ပါဘူး။ [[mark:pt-card]] card payment မှာလည်း ဒီ pattern ပဲ
      ရှိပါတယ်။ authorization က hold ချတာ၊ capture က တကယ် charge လုပ်တာပါ။ [[mark:stripe]] Stripe မှာ
      manual capture နဲ့ဆို card payment ကို အခု authorize လုပ်ပြီး နောက်မှ capture လုပ်နိုင်ပါတယ်။
      capture မလုပ်ခင် authorization သက်တမ်း ကုန်သွားရင် ငွေကို release လုပ်ပြီး payment က canceled
      ဖြစ်သွားပါတယ်။ [[mark:window]] customer ကိုယ်တိုင် online မှာ စတဲ့ payment တွေအတွက် Visa၊
      Mastercard၊ Amex နဲ့ Discover မှာ ခုနစ်ရက် ရှိပါတယ်။ ဒါပေမဲ့ card network၊ ဆိုင်မှာ တိုက်ရိုက် ပေးတာလား၊
      merchant ဘက်က စတာလား ဆိုတာပေါ် မူတည်ပြီး ကွာလို့ ရက် တစ်ခုတည်းကို code ထဲမှာ အသေ မထားရပါဘူး။
    sources:
