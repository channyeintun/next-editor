      holds.go: |
        package main

        import "fmt"

        // Hold is money set aside for one flow that has not finished yet.
        type Hold struct {
        	ID      string
        	Account string
        	Amount  int64
        	Open    bool
        }

        // Holds keeps the reservations beside the ledger that holds the money.
        type Holds struct {
        	l     *Ledger
        	holds []Hold
        }

        // Reserved sums the open holds on an account. Available is total minus reserved.
        func (h *Holds) Reserved(account string) int64 {
        	var sum int64
        	for _, x := range h.holds {
        		if x.Open && x.Account == account {
        			sum += x.Amount
        		}
        	}
        	return sum
        }

        func (h *Holds) Available(account string) int64 {
        	return h.l.Balance(account) - h.Reserved(account)
        }

        // Settle closes a hold and posts the final amount; whatever was held above it is released.
        func (h *Holds) Settle(id string, final int64) error {
        	for i, x := range h.holds {
        		if x.ID == id && x.Open {
        			h.holds[i].Open = false
        			return h.l.Post(withdrawal(id, x.Account, final))
        		}
        	}
        	return fmt.Errorf("no open hold %s", id)
        }
      ledger.go: |
        package main

        import (
        	"fmt"
        	"strings"
        )

        // Line is one row of a transaction: an amount on the debit or the credit side of one account.
        type Line struct {
        	Account string
        	Debit   int64
        	Credit  int64
        }

        // Tx is one business event. All of its lines are posted together, or none of them.
        type Tx struct {
        	ID    string
        	Memo  string
        	Lines []Line
        }

        // Ledger is an append-only list of posted transactions. Balances are derived from it.
        type Ledger struct {
        	txs []Tx
        }

        // Post appends a transaction only if its debits equal its credits.
        func (l *Ledger) Post(tx Tx) error {
        	var debit, credit int64
        	for _, line := range tx.Lines {
        		debit += line.Debit
        		credit += line.Credit
        	}
        	if debit != credit {
        		return fmt.Errorf("tx %s is not balanced: debit %s, credit %s", tx.ID, cents(debit), cents(credit))
        	}
        	l.txs = append(l.txs, tx)
        	return nil
        }

        // Balance derives an account's balance on the side where that kind of account grows:
        // assets and expenses grow with debits; liabilities, equity and revenue grow with credits.
        func (l *Ledger) Balance(account string) int64 {
        	var debit, credit int64
        	for _, tx := range l.txs {
        		for _, line := range tx.Lines {
        			if line.Account == account {
        				debit += line.Debit
        				credit += line.Credit
        			}
        		}
        	}
        	if kind, _, _ := strings.Cut(account, ":"); kind == "asset" || kind == "expense" {
        		return debit - credit
        	}
        	return credit - debit
        }

        // withdrawal pays a user's money out of the pooled bank account.
        func withdrawal(id, user string, amount int64) Tx {
        	return Tx{ID: id, Memo: "withdrawal", Lines: []Line{
        		{Account: user, Debit: amount},
        		{Account: "asset:bank", Credit: amount},
        	}}
        }

        // must stops the program on an error that the example never expects.
        func must(err error) {
        	if err != nil {
        		panic(err)
        	}
        }

        // cents prints minor units as an amount with two decimals: cents(1234) is "12.34".
        func cents(n int64) string {
        	sign := ""
        	if n < 0 {
        		sign, n = "-", -n
        	}
        	return fmt.Sprintf("%s%d.%02d", sign, n/100, n%100)
        }
      main.go: |
        package main

        import "fmt"

        const user = "liability:user:1042"

        // funded returns a ledger in which the user has deposited 100.00.
        func funded() *Ledger {
        	l := &Ledger{}
        	must(l.Post(Tx{ID: "d1", Memo: "deposit", Lines: []Line{
        		{Account: "asset:bank", Debit: 10000},
        		{Account: user, Credit: 10000},
        	}}))
        	return l
        }

        // show prints one labelled result: ok, or why it was rejected.
        func show(label string, err error) {
        	if err != nil {
        		fmt.Println(label+": rejected —", err)
        		return
        	}
        	fmt.Println(label + ": ok")
        }

        func balances(h *Holds) {
        	total := h.l.Balance(user)
        	fmt.Printf("total %s  reserved %s  available %s\n",
        		cents(total), cents(h.Reserved(user)), cents(h.Available(user)))
        }

        func main() {
        	// Two withdrawals of 80.00. Each checks the balance, waits on compliance and the bank,
        	// then debits. The steps are written out in the order they interleave.
        	l := funded()
        	okA := l.Balance(user) >= 8000 // A checks
        	okB := l.Balance(user) >= 8000 // B checks while A is still waiting
        	if okA {
        		must(l.Post(withdrawal("a", user, 8000))) // A debits
        	}
        	if okB {
        		must(l.Post(withdrawal("b", user, 8000))) // B debits
        	}
        	fmt.Println("no hold: A", okA, "B", okB, "balance", cents(l.Balance(user)))
        }
