  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] Fintech interview တွေမှာ double spending ကို ဘယ်လို ကာကွယ်မလဲ လို့
      မေးလေ့ရှိပါတယ်။ lock သုံးမယ် လို့ပဲ ဖြေရင် မလုံလောက်ပါဘူး။ [[mark:iv-a]] ပထမ၊ balance စစ်တာနဲ့ debit လုပ်တာကြားမှာ compliance၊ provider call လို နှေးတဲ့ အလုပ်တွေ ရှိလို့
      request နှစ်ခုလုံး check ကို ဖြတ်သွားနိုင်ပါတယ်။ [[mark:iv-b]] ဒုတိယ၊ အပြင်ဘက်ကို မခေါ်ခင် reserve
      လုပ်ပြီး၊ check နဲ့ reservation အသစ် အားလုံးကို available နဲ့ စစ်ပါ။ [[mark:iv-c]] တတိယ၊ စစ်တာနဲ့ hold မှတ်တာ တစ်ဆင့်တည်း
      ဖြစ်ရပါမယ်။ conditional write၊ row lock ဒါမှမဟုတ် serializable isolation နဲ့ပါ၊ replica ကနေ
      ဖတ်တာ မဖြစ်ရပါဘူး။ [[mark:iv-d]] ပြီးရင် ကိုယ် ဘာလုပ်မလဲ ဆက်ပြောပါ။ reservation ကို conditional
      write တစ်ခုနဲ့ လုပ်မယ်၊ flow တိုင်းကို settle ဒါမှမဟုတ် release နဲ့ ဆုံးအောင် လုပ်မယ်၊ expiry ကို
      safety net အဖြစ်ပဲ ထားမယ် ဆိုတာပါ။
    sources:
