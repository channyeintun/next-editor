        }
      - { id: pt-cond, type: slide.point, at: { mark: pt-cond }, target: { x: 0.584, y: 0.528 } }
      - { id: atomic-3, type: slide.show, at: { mark: atomic-3 }, slideId: atomic-3 }
      - {
