  - id: try-it
    chapter: ကိုယ်တိုင် စမ်းကြည့်ပါ
    narration: >-
      [[mark:close-iv]] ကိုယ်တိုင် စမ်းကြည့်ဖို့ တစ်ခု ရှိပါတယ်။ [[mark:sel-try]] ဒုတိယ reserve line
      အောက်မှာ ယူရို နှစ်ဆယ်အတွက် တတိယ reserve တစ်ခု ထပ်ထည့်ပြီး run ကြည့်ပါ။ available နှစ်ဆယ်
      အတိအကျ ရှိလို့ လက်ခံပြီး available က သုည ဖြစ်သွားပါမယ်။ [[mark:try-why]] settle လုပ်ပြီးတဲ့
      နောက်မှာလည်း reserved က နှစ်ဆယ် ကျန်နေတာကို တွေ့ရပါမယ်၊ အဲဒီ hold က ဆုံးဖို့ စောင့်နေဆဲ မို့ပါ။
      [[mark:recap]] ပြန်ချုပ်ရရင်၊ balance ကို စစ်ပြီးမှ debit လုပ်တာ မဟုတ်ဘဲ၊ ငွေကို တစ်ဆင့်တည်းနဲ့
      reserve လုပ်ပြီးမှ အပြင်ဘက်ကို ခေါ်ရပါတယ်။ နောက် lesson မှာ settle လုပ်တဲ့ ပမာဏက hold ထက်
      ကြီးလာတဲ့အခါ၊ ဆိုလိုတာက policy က ခွင့်မပြုပေမဲ့ balance က အနုတ် ဖြစ်သွားတဲ့အခါ ဘာလုပ်မလဲ
      ကြည့်ပါမယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Funds reservation (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#funds-reservation",
        }
      - {
          title: "Fintech Engineering Handbook — Handling overdrafts (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#handling-overdrafts",
        }
