  - id: atomic
    chapter: Consistency ဘယ်လောက် လိုလဲ
    narration: >-
      [[mark:show-atomic]] ဒီ pattern တစ်ခုလုံးက တစ်ချက်ပေါ်မှာ မူတည်ပါတယ်။ စစ်တာနဲ့ reservation
      မှတ်တာက linearizable ဖြစ်ရပါမယ်၊ ဆိုလိုတာက စစ်တဲ့အခါ နောက်ဆုံး write ကို မြင်ရပြီး၊ စစ်တာနဲ့
      ရေးတာကြားကို ဘယ် request မှ ဝင်လို့ မရအောင် ဖြစ်ရပါမယ်။ [[mark:pt-bad]] available ကို အရင် ဖတ်ပြီးမှ
      hold ကို သီးခြား ထည့်တဲ့ ပုံစံက ခုနက race ကို ပြန်ဖြစ်စေပါတယ်၊ request နှစ်ခုလုံး ယူရို ၁၀၀ ကို
      ဖတ်ပြီးမှ hold ထည့်နိုင်လို့ပါ။ replica ကနေ ဖတ်ရင် ပိုဆိုးပါတယ်၊ replica နောက်ကျနေရင် ပြီးသွားတဲ့
      hold ကိုတောင် မမြင်ရလို့ပါ။ [[mark:atomic-2]] မှန်တဲ့ ပုံစံက စစ်တာကို write ထဲမှာ
      ထည့်လိုက်တာပါ။ [[mark:pt-cond]] update က available လုံလောက်မှပဲ row ကို ပြောင်းပြီး၊ row တစ်ကြောင်း
      ပြောင်းရင် hold ရ၊ သုည ကြောင်း ဆိုရင် ငြင်းပါတယ်။ [[mark:atomic-3]] row lock နဲ့ ဒါမှမဟုတ်
      serializable isolation နဲ့လည်း ရပါတယ်၊ ဒါပေမဲ့ eventual consistency ကတော့ ဒီနေရာမှာ လုံးဝ
      မရပါဘူး။ [[mark:lock-why]] account ကို အပြင်ဘက် call ပြီးတဲ့အထိ lock ချထားရင်ရော ဆိုတာ မေးစရာပါ။
      ရပေမဲ့ နှေးတဲ့ call တစ်ခုစာ lock ကို ကိုင်ထားရလို့ အဲဒီ account ရဲ့ တခြား request အားလုံး
      စောင့်ရပါတယ်။ reservation က ရှည်လျားတဲ့ critical section တစ်ခုကို reserve နဲ့ settle ဆိုတဲ့
      တိုတောင်းတဲ့ atomic အဆင့် နှစ်ဆင့် ခွဲပေးလိုက်တာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Funds reservation (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#funds-reservation",
        }
    actions:
      - {
          id: show-atomic,
          type: slide.show,
          at: { mark: show-atomic, offsetMs: -700 },
          slideId: atomic-1,
        }
      - {
          id: pt-title-atomic,
          type: slide.point,
          at: { afterAction: show-atomic },
          target: { x: 0.125, y: 0.184 },
        }
      - { id: pt-bad, type: slide.point, at: { mark: pt-bad }, target: { x: 0.109, y: 0.571 } }
      - { id: atomic-2, type: slide.show, at: { mark: atomic-2 }, slideId: atomic-2 }
      - {
