# Fintech Engineering, lesson 18: funds reservation (Burmese).
#
# Source: Fintech Engineering Handbook, "Funds reservation" and Appendix A "Authorization vs
# capture" (CC BY 4.0, Voytek Pitula); fact A18 (Stripe authorization holds).
# Start state: main.go writes two 80.00 withdrawals against a 100.00 balance as explicit steps
# (both check, then both debit). ledger.go is the course ledger plus withdrawal() and must();
# holds.go has Hold, Reserved, Available and Settle.
# Edits, all insert-only:
#   1. holds.go: Reserve, which checks available and records the hold in one step
#   2. main.go: the two withdrawals again through Reserve    -> run-2: w2 refused; 100 / 80 / 20
#   3. main.go: settle w1 at 79.50                           -> run-3: 20.50 / 0.00 / 20.50
# Figures: race (the interleaving), bar (total vs available through reserve / refuse / settle),
# life (reserved -> settled | released | expired), atomic (check and hold in one write), iv.
# Built by ~/Documents/fintech-course-work/tools/build-lesson.ts; fixtures by sim-go.ts --write.
