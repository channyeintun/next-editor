      ကဲ၊ မှာကြည့်ရအောင်။ [[mark:click-add-nan-gyi]] အရင်ဆုံး နန်းကြီးသုပ်ကို မှာပါမယ်။
      [[mark:click-add-mohinga]] နောက် မုန့်ဟင်းခါးပါ။ [[mark:click-add-shan]] ပြီးတော့ ရှမ်းခေါက်ဆွဲပါ။
      panel ထဲမှာ row သုံးခု ဖြစ်သွားပြီး၊ စုစုပေါင်းက 8300 ကျပ်ပါ။ [[mark:click-more-mohinga]]
