# React crash course 3 (Burmese): state and events.
#
# NARRATION IS AN ENGLISH DRAFT. A Burmese writer converts it span by span
# (the text between two marks) using DESIGN.md next to this file and the
# course GLOSSARY.md. Every mark already sits where its action begins, at a
# sentence end; keep each mark between the same two ideas when translating.
#
# Start state = lesson 2's end state (App maps menu.js into DishCard, DishCard
# wraps its content in Card with spicy / sold-out badges) plus an EMPTY
# src/OrderPanel.jsx that this lesson types while nothing imports it.
#
# Editing discipline (insert-only, live Vite without the React plugin, so every
# .jsx edit fully reloads the preview and resets state):
# - DishCard.jsx and App.jsx are imported by the running app, so every edit to
#   them is a `block` insert of complete lines (import line before any use,
#   handler before the JSX that names it) or an atomic mid-line insert
#   (", onAdd" into the props, " onAdd={handleAdd}" into the DishCard tag).
# - OrderPanel.jsx is typed keystroke by keystroke (head) and line by line
#   (markup) while unimported, then wired in with two blocks: import, usage.
# - Every click that follows an edit is guarded by an expect.preview first,
#   because the edit reloaded the page — and the narration says so once (scene
#   snapshot), since the reload also sends every card's likes back to 0.
# - The per-card counter is a like counter (❤), so it never competes with the
#   order count; the two "+3" buttons are labelled က and ခ (A and B).
#
# Gates:
#   bun scripts/studio-director.ts <this file>
#   bun <course>/harness/compile-check.ts <this file>
#   bun <course>/harness/verify-lesson.ts <this file>
