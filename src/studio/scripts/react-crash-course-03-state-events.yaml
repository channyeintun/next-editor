      vite.config.js: |
        import { defineConfig } from "vite";

        export default defineConfig({
          // JSX through esbuild's automatic runtime: components never import React.
          esbuild: { jsx: "automatic" },
          // Pre-bundle every React entry up front so Vite never discovers a new
          // dependency mid-lesson and force-reloads the preview.
          optimizeDeps: {
            include: [
              "react",
              "react/jsx-dev-runtime",
              "react/jsx-runtime",
              "react-dom",
              "react-dom/client",
            ],
          },
        });
      index.html: |
        <!doctype html>
        <html lang="my">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>React သင်ခန်းစာ</title>
          </head>
          <body>
            <div id="root"></div>
            <script type="module" src="/src/main.jsx"></script>
          </body>
        </html>
      src/main.jsx: |
        import { StrictMode } from "react";
        import { createRoot } from "react-dom/client";
        import App from "./App.jsx";
        import "./styles.css";

        createRoot(document.getElementById("root")).render(
          <StrictMode>
            <App />
          </StrictMode>,
        );
      src/App.jsx: |
        import { Header } from "./Header.jsx";
        import DishCard from "./DishCard.jsx";
        import { menu } from "./menu.js";

        export default function App() {
          const available = menu.filter((dish) => !dish.soldOut).length;

          return (
            <main className="page">
              <header className="header">
                <Header />
              </header>
              <p className="muted" data-testid="summary">
                {available > 0 ? `${available} မျိုး ရနိုင်ပါတယ်` : "ဒီနေ့ ကုန်သွားပါပြီ"}
              </p>
              <section className="menu">
                {menu.map((dish) => <DishCard key={dish.id} {...dish} />)}
              </section>
            </main>
          );
        }
      src/Header.jsx: |
        const shopName = "ရွှေရန်ကုန် မုန့်ဟင်းခါးဆိုင်";
        const openHours = "မနက် ၆ နာရီ မှ ညနေ ၆ နာရီ အထိ";

        export function Header() {
          return (
            <>
              <h1 data-testid="title">{shopName}</h1>
              <p className="muted">{openHours}</p>
            </>
          );
        }
      src/Card.jsx: |
        export default function Card({ children }) {
          return <div className="card">{children}</div>;
        }
      src/DishCard.jsx: |
        import Card from "./Card.jsx";

        export default function DishCard({ id, name, price, spicy = false, soldOut = false }) {
          return (
            <Card>
              <div className="row" data-testid={`dish-card-${id}`}>
                <h3>{name}</h3>
                {spicy && <span className="badge warn">စပ်</span>}
                {soldOut && <span className="badge">ကုန်ပြီ</span>}
                <span className="price">{price.toLocaleString("en-US")} ကျပ်</span>
              </div>
            </Card>
          );
        }
      src/menu.js: |
        export const menu = [
          { id: "mohinga", name: "မုန့်ဟင်းခါး", price: 2500, spicy: false, soldOut: false },
          { id: "shan-noodles", name: "ရှမ်းခေါက်ဆွဲ", price: 3000, spicy: false, soldOut: false },
          { id: "nan-gyi-thoke", name: "နန်းကြီးသုပ်", price: 2800, spicy: true, soldOut: false },
          { id: "ohn-no-khao-swe", name: "အုန်းနို့ခေါက်ဆွဲ", price: 3500, spicy: false, soldOut: true },
          { id: "laphet-thoke", name: "လက်ဖက်သုပ်", price: 2000, spicy: true, soldOut: false },
        ];
      src/OrderPanel.jsx: ""
      src/styles.css: |
        :root {
          --bg: #f1f3f5;
          --surface: #ffffff;
          --text: #1e1e1e;
          --muted: #5c636a;
          --line: #dee2e6;
          --accent: #1971c2;
          --accent-soft: #e7f1fb;
          --ok: #2f9e44;
          --warn: #e67700;
          --radius: 12px;
          font-family: "Noto Sans Myanmar", "Myanmar Sangam MN", "Myanmar MN", "Padauk",
            system-ui, -apple-system, "Segoe UI", sans-serif;
          font-size: 17px;
          line-height: 1.8;
          color: var(--text);
          background: var(--bg);
        }

        * {
          box-sizing: border-box;
        }

        body {
          margin: 0;
          min-height: 100vh;
        }

        .page {
          max-width: 560px;
          margin: 0 auto;
          padding: 20px 16px 40px;
          display: grid;
          gap: 14px;
        }

        .header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 12px;
          padding-bottom: 10px;
          border-bottom: 2px solid var(--line);
        }

        h1,
        h2,
        h3 {
          margin: 0;
          line-height: 1.6;
        }

        h1 {
          font-size: 1.45rem;
        }

        h2 {
          font-size: 1.15rem;
        }

        p {
          margin: 0;
        }

        .muted {
          color: var(--muted);
        }

        .card {
          display: grid;
          gap: 8px;
          padding: 14px 16px;
          border: 1px solid var(--line);
          border-radius: var(--radius);
          background: var(--surface);
          box-shadow: 0 4px 14px rgb(0 0 0 / 0.05);
        }

        .row {
          display: flex;
          align-items: center;
          gap: 10px;
          flex-wrap: wrap;
        }

        .list {
          display: grid;
          gap: 8px;
          margin: 0;
          padding: 0;
          list-style: none;
        }

        .list > li {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 10px;
          padding: 8px 12px;
          border: 1px solid var(--line);
          border-radius: 10px;
          background: var(--surface);
        }

        button {
          font: inherit;
          padding: 6px 16px;
          border: 0;
          border-radius: 999px;
          background: var(--accent);
          color: white;
          cursor: pointer;
        }

        button.secondary {
          background: var(--accent-soft);
          color: var(--accent);
        }

        button:disabled {
          background: var(--line);
          color: var(--muted);
          cursor: not-allowed;
        }

        input,
        select,
        textarea {
          font: inherit;
          width: 100%;
          padding: 6px 12px;
          border: 1px solid var(--line);
          border-radius: 10px;
          background: var(--surface);
          color: var(--text);
        }

        input:focus,
        select:focus,
        textarea:focus,
        button:focus-visible {
          outline: 2px solid var(--accent);
          outline-offset: 2px;
        }

        .badge {
          display: inline-block;
          padding: 0 10px;
          border-radius: 999px;
          background: var(--accent-soft);
          color: var(--accent);
          font-size: 0.85rem;
        }

        .badge.ok {
          background: #ebfbee;
          color: var(--ok);
        }

        .badge.warn {
          background: #fff4e6;
          color: var(--warn);
        }

        /* Lessons 1–2: header, menu and dish cards */
        .header {
          flex-wrap: wrap;
          row-gap: 0;
        }

        .menu {
          display: grid;
          gap: 14px;
        }

        .price {
          margin-left: auto;
          font-weight: 600;
        }

        /* Lesson 3: compact buttons in the order rows */
        .order-row button {
          padding: 2px 12px;
        }
