  # ------------------------------------------------------------------ 12
  - id: hooks-rules
    chapter: "Hook တွေရဲ့ စည်းကမ်း"
    narration: >
      နောက်ဆုံး စည်းကမ်းက hook ကို ဘယ်နေရာမှာ ခေါ်ရမလဲ ဆိုတာပါ။ [[mark:draw-hook-slots]] React က state ကို
      variable နာမည်နဲ့ မဟုတ်ဘဲ၊ hook ခေါ်တဲ့ အစဉ်နဲ့ မှတ်ပါတယ်။ ဒါကြောင့် render တိုင်း အစဉ် အတူတူ
      ခေါ်ရပါမယ်။ [[mark:draw-hook-bad]] if ဒါမှမဟုတ် loop ထဲက hook က render တချို့မှာ
      ကျော်သွားနိုင်ပါတယ်။ အဲဒီအခါ နောက် hook က သူ့ဟာ မဟုတ်တဲ့ state ရပြီး၊ app က error နဲ့ ရပ်သွားပါတယ်။
      event handler ထဲမှာ ခေါ်ရင်တော့ render အပြင်မှာ ခေါ်တာ ဖြစ်လို့ တန်း error တက်ပါတယ်။
      [[mark:draw-hook-rule]] ဒါကြောင့် hook ကို component ဒါမှမဟုတ် ကိုယ်တိုင် ရေးတဲ့ custom hook ရဲ့
      အပေါ်ဆုံးမှာပဲ၊ ဘယ် return မှ မရောက်ခင် ခေါ်ပါ။ [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ state ဆိုတာ
      component ရဲ့ memory ဖြစ်ပြီး၊ ပြောင်းလိုက်တိုင်း React က ပြန် render လုပ်ပေးပါတယ်။ render
      တစ်ခုစီက သူ့ snapshot ကိုပဲ မြင်ပါတယ်။ state ထဲက array ကိုလည်း မပြင်ဘဲ အသစ်နဲ့ လဲပါတယ်။ နောက် lesson
      မှာတော့ input ထဲ ရိုက်တာကို state နဲ့ ချိတ်တာနဲ့၊ component နှစ်ခု တူတူ သုံးရမယ့် state ကို ဘယ်မှာ
      ထားရမလဲ ဆိုတာ ကြည့်သွားပါမယ်။
    sources:
      - title: "Rules of Hooks"
        url: "https://react.dev/reference/rules/rules-of-hooks"
      - title: "How does React know which state to return?"
        url: "https://react.dev/learn/state-a-components-memory#how-does-react-know-which-state-to-return"
    actions:
      - id: wb-open-hooks
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [e-title]
      - id: wb-hook-slots
        type: whiteboard.apply
        at: { mark: draw-hook-slots }
        upsertIds: [e-good-head, e-slot1, e-slot1-text, e-slot2, e-slot2-text, e-why]
        drawMs: 2600
      - id: wb-hook-bad
        type: whiteboard.apply
        at: { mark: draw-hook-bad }
        upsertIds: [e-bad-head, e-bad-box, e-bad-l1, e-bad-l2, e-bad-l3]
