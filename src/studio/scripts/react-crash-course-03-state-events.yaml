        upsertIds:
          [b-arrow-1, b-render-box, b-render-name, b-render-verb, b-render-note-1, b-render-note-2]
        drawMs: 2200
      - id: wb-draw-commit
        type: whiteboard.apply
        at: { mark: draw-commit }
        upsertIds:
          [b-arrow-2, b-commit-box, b-commit-name, b-commit-verb, b-commit-note-1, b-commit-note-2]
        drawMs: 2200
      - id: wb-draw-paint
        type: whiteboard.apply
        at: { mark: draw-paint }
        upsertIds: [b-arrow-3, b-paint-box, b-paint]
        drawMs: 1400

  # ------------------------------------------------------------------ 5
  - id: snapshot
    chapter: "State က snapshot တစ်ခုပါ"
    narration: >
      အခု လူအများ အံ့ဩတတ်တဲ့ အချက် တစ်ခုပါ။ [[mark:type-like-three]] ဒီ handler အသစ်က setLikes ကို likes
      ထက် တစ် ပိုတဲ့ တန်ဖိုးနဲ့ သုံးကြိမ် ဆက်တိုက် ခေါ်ပါတယ်။ [[mark:type-like-three-button]] သူ့အတွက်
      ခလုတ် ထည့်ပါမယ်။ ဒီ project မှာ ဖိုင်ကို ပြင်လိုက်တိုင်း page တစ်ခုလုံး ပြန်ပွင့်ပြီး state က 0 ကနေ
      ပြန်စလို့၊ ခုနက 2 က ပျောက်သွားပါပြီ။ တစ်ချက် နှိပ်ရင် သုံးခု တိုးမယ်လို့ ထင်ရမှာပါ။
      [[mark:click-like-three]] နှိပ်ကြည့်ရအောင်။ ကြည့်ပါ၊ 0 ကနေ 1 ပဲ တက်သွားပါတယ်။
      [[mark:open-snapshot-board]] ဘာကြောင့်လဲဆိုတော့၊ render တစ်ခုစီမှာ state က ဓာတ်ပုံလို ပုံသေ
      ဖြစ်နေလို့ပါ၊ snapshot လို့ ခေါ်ပါတယ်။ [[mark:draw-snapshot-frame]] ကိုယ် click လုပ်လိုက်တဲ့ render
      မှာ likes က 0 ဖြစ်လို့၊ handler ကလည်း 0 ကိုပဲ မြင်ပါတယ်။ [[mark:draw-snapshot-calls]] ဒါကြောင့်
      သုံးကြိမ်လုံးက 0 နဲ့ 1 ပေါင်းတဲ့ 1 ကိုပဲ တောင်းနေတာပါ။ setLikes ခေါ်တာက run နေဆဲ code ထဲက likes ကို
      ချက်ချင်း မပြောင်းဘဲ၊ render အသစ် တောင်းတာပါ။ အဲဒီ render ကျမှ အသစ်ကို မြင်ရပါတယ်။
    sources:
      - title: "State as a Snapshot"
        url: "https://react.dev/learn/state-as-a-snapshot"
    actions:
      - id: wb-close-render
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: type-like-three
        type: editor.type
        at: { mark: type-like-three }
        cadence: block
        target:
          file: src/DishCard.jsx
          after: "    setLikes(likes + 1);\n  }\n"
          occurrence: 1
        text: "\n  function handleLikeThree() {\n    setLikes(likes + 1);\n    setLikes(likes + 1);\n    setLikes(likes + 1);\n  }\n"
      - id: type-like-three-button
        type: editor.type
        at: { mark: type-like-three-button }
        cadence: block
        target:
          file: src/DishCard.jsx
          after: "          ❤ {likes}\n        </button>\n"
          occurrence: 1
        text: "        <button\n          className=\"secondary\"\n          data-testid={`like-three-${id}`}\n          onClick={handleLikeThree}\n        >\n          +3 က\n        </button>\n"
      - id: expect-like-three-button
        type: expect.preview
        at: { afterAction: type-like-three-button }
        timeoutMs: 5000
        target: { by: testId, value: like-three-mohinga }
        textContains: "+3 က"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: click-like-three
        type: preview.click
        at: { mark: click-like-three }
        timeoutMs: 5000
        target: { by: testId, value: like-three-mohinga }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-like-one
        type: expect.preview
        at: { afterAction: click-like-three }
        timeoutMs: 5000
        target: { by: testId, value: like-mohinga }
        textContains: "❤ 1"
        retry: { maxAttempts: 3, delayMs: 200 }
      - id: wb-open-snapshot
        type: whiteboard.apply
        at: { mark: open-snapshot-board }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: wb-snapshot-frame
        type: whiteboard.apply
        at: { mark: draw-snapshot-frame }
        upsertIds: [c-frame, c-frame-label, c-frame-sub]
        drawMs: 1300
      - id: wb-snapshot-calls
        type: whiteboard.apply
        at: { mark: draw-snapshot-calls }
        upsertIds: [c-calls, c-result1, c-result1-circle]
        drawMs: 1600

  # ------------------------------------------------------------------ 6
  - id: updater
    narration: >
      ဒါဆို သုံးခု ဘယ်လို တိုးမလဲ။ [[mark:type-queued]] ဒီတစ်ခါ setLikes ကို function တစ်ခု ပေးပါတယ်၊
      updater function လို့ ခေါ်ပါတယ်။ သူက အရင် update တွေ ပြီးတဲ့ နောက်ဆုံး တန်ဖိုးကို ရပြီး၊ တစ် ပိုတဲ့
      တန်ဖိုး ပြန်ပေးပါတယ်။ [[mark:type-queued-button]] ဒုတိယ ခလုတ်ကတော့ ဒီ handler အသစ်ကို သုံးပါမယ်။
      [[mark:click-queued]] နှိပ်ကြည့်ရအောင်။ အခုတော့ 0 ကနေ 3 ဖြစ်သွားပါပြီ။ [[mark:open-queue-board]]
      React က click handler တစ်ခုလုံး ပြီးမှ render တစ်ကြိမ်တည်း လုပ်ပါတယ်။ အဲဒါကို batching လို့
      ခေါ်ပါတယ်။ [[mark:draw-queue-box]] အဲဒီကြားမှာ updater function သုံးခုက queue ထဲ တန်းစီနေပါတယ်။
      [[mark:draw-queue-steps]] နောက် render မှာ React က သူတို့ကို အစဉ်အတိုင်း run ပေးလို့၊ 3
      ရောက်သွားတာပါ။ [[mark:draw-queue-rule]] ဒါကြောင့် event တစ်ခုထဲမှာ state တစ်ခုကို အရင် တန်ဖိုးပေါ်
      မူတည်ပြီး အကြိမ်ကြိမ် ပြောင်းရင်၊ updater function ကို သုံးပါ။ တစ်ကြိမ်တည်း ပြောင်းရင်တော့ တန်ဖိုး
      အသစ်ကို တန်းပေးလို့ ရပါတယ်။
    sources:
      - title: "Queueing a Series of State Updates"
        url: "https://react.dev/learn/queueing-a-series-of-state-updates"
      - title: "useState: updating state based on the previous state"
        url: "https://react.dev/reference/react/useState#updating-state-based-on-the-previous-state"
    actions:
      - id: wb-close-snapshot
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: type-queued
        type: editor.type
        at: { mark: type-queued }
        cadence: block
        target:
          file: src/DishCard.jsx
          after: "  function handleLikeThree() {\n    setLikes(likes + 1);\n    setLikes(likes + 1);\n    setLikes(likes + 1);\n  }\n"
          occurrence: 1
        text: "\n  function handleLikeThreeQueued() {\n    setLikes((prev) => prev + 1);\n    setLikes((prev) => prev + 1);\n    setLikes((prev) => prev + 1);\n  }\n"
      - id: select-updater
        type: editor.select
        at: { mark: type-queued, offsetMs: 1500 }
        target:
          file: src/DishCard.jsx
          text: "(prev) => prev + 1"
          occurrence: 1
      - id: type-queued-button
        type: editor.type
        at: { mark: type-queued-button }
        cadence: block
        target:
          file: src/DishCard.jsx
          after: "          +3 က\n        </button>\n"
          occurrence: 1
        text: "        <button\n          className=\"secondary\"\n          data-testid={`like-queue-${id}`}\n          onClick={handleLikeThreeQueued}\n        >\n          +3 ခ\n        </button>\n"
      - id: expect-queued-button
        type: expect.preview
        at: { afterAction: type-queued-button }
        timeoutMs: 5000
        target: { by: testId, value: like-queue-mohinga }
        textContains: "+3 ခ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: click-queued
        type: preview.click
        at: { mark: click-queued }
        timeoutMs: 5000
        target: { by: testId, value: like-queue-mohinga }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-like-three
        type: expect.preview
        at: { afterAction: click-queued }
        timeoutMs: 5000
        target: { by: testId, value: like-mohinga }
        textContains: "❤ 3"
        retry: { maxAttempts: 3, delayMs: 200 }
      - id: wb-open-queue
        type: whiteboard.apply
        at: { mark: open-queue-board }
        open: true
        upsertIds: [c-batch]
        drawMs: 1200
      - id: wb-queue-box
        type: whiteboard.apply
        at: { mark: draw-queue-box }
        upsertIds: [c-queue-box, c-queue-label, c-queue-sub]
        drawMs: 1500
      - id: wb-queue-steps
        type: whiteboard.apply
        at: { mark: draw-queue-steps }
        upsertIds: [c-steps, c-check]
        drawMs: 1500
      - id: wb-queue-rule
        type: whiteboard.apply
        at: { mark: draw-queue-rule }
        upsertIds: [c-rule, c-rule-underline]
        drawMs: 1300

  # ------------------------------------------------------------------ 7
  - id: array-rules
    chapter: "Array state ကို ပြောင်းကြည့်ရအောင်"
    narration: >
      နောက်တစ်ခုက order ပါ။ ဟင်းလျာ စာရင်း ဖြစ်လို့၊ သူ့ state က array တစ်ခု ဖြစ်ပါမယ်။
      [[mark:draw-array-rule]] စည်းကမ်းက၊ state ထဲက array ကို တိုက်ရိုက် မပြင်ရဘဲ၊ array အသစ်နဲ့ လဲရပါတယ်။
      [[mark:draw-mutating]] push နဲ့ splice က မူရင်း array ကိုယ်တိုင်ကို ပြင်လိုက်တာပါ။ sort၊ reverse နဲ့
      item တစ်ခုကို တိုက်ရိုက် ပြောင်းတာလည်း အတူတူပါပဲ။ [[mark:strike-mutating]] အဲဒီလိုဆိုရင် React က
      array အဟောင်းအတိုင်းပဲ ပြန်ရလို့၊ မပြောင်းဘူး ထင်ပြီး ပြန် render မလုပ်ပါဘူး။ [[mark:draw-copies]]
      အဲဒီအစား၊ ထည့်ချင်ရင် အဟောင်းတွေကို array အသစ်ထဲ spread နဲ့ ကူးထည့်ပါ။ ဖယ်ချင်ရင် filter၊ တစ်ခု
      ပြောင်းချင်ရင် map ပါ။ [[mark:draw-sort-copy]] sort ဆိုရင်တော့ အရင် copy ကူးပါ။
    sources:
      - title: "Updating Arrays in State"
        url: "https://react.dev/learn/updating-arrays-in-state"
    actions:
      - id: wb-open-array
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [d-title]
      - id: wb-array-rule
        type: whiteboard.apply
        at: { mark: draw-array-rule }
        upsertIds: [d-note, d-note-underline]
        drawMs: 1300
      - id: wb-mutating
        type: whiteboard.apply
        at: { mark: draw-mutating }
        upsertIds: [d-bad-box, d-bad-head, d-bad-1, d-bad-2, d-bad-3, d-bad-4]
        drawMs: 2200
      - id: wb-strike-mutating
        type: whiteboard.apply
        at: { mark: strike-mutating }
        upsertIds: [d-bad-1-strike, d-bad-2-strike, d-bad-3-strike, d-bad-4-strike]
        drawMs: 1600
      - id: wb-copies
        type: whiteboard.apply
        at: { mark: draw-copies }
        upsertIds: [d-good-box, d-good-head, d-good-1, d-good-2, d-good-4]
        drawMs: 2200
      - id: wb-sort-copy
        type: whiteboard.apply
        at: { mark: draw-sort-copy }
        upsertIds: [d-good-3]
        drawMs: 800

  # ------------------------------------------------------------------ 8
  - id: order-handlers
    narration: >
      [[mark:close-array-board]] ကဲ၊ App ထဲမှာ ရေးကြည့်ရအောင်။ [[mark:open-app]] App က card အားလုံးရဲ့
      parent ဖြစ်လို့၊ order state ကို ဒီမှာ ထားပါမယ်။ [[mark:type-app-import]] useState ကို အရင် import
      လုပ်ပြီး၊ order ကို array အလွတ်နဲ့ စပါတယ်။ [[mark:type-handle-add]] ပထမ handler က ဟင်းလျာ ထည့်ပါတယ်။
      မှာပြီးသားဆို ကျော်ပါတယ်၊ ပန်းကန် အရေအတွက် တိုးတာကို နောက်မှ ရေးမယ့် order panel ထဲက အပေါင်း
      ခလုတ်နဲ့ လုပ်မှာမို့ပါ။ [[mark:select-spread]] ဒီ array အသစ်ကို ကြည့်ပါ။ spread က အဟောင်းထဲက item
      တွေကို ကူးထည့်ပြီး၊ နောက်ဆုံးမှာ count 1 ပါတဲ့ ဟင်းလျာ copy ထပ်ထည့်ပါတယ်။ အဟောင်းကို မထိပါဘူး။
      [[mark:type-handle-remove]] ဒုတိယ handler က ဟင်းလျာ တစ်ခု ဖယ်ပါတယ်။ [[mark:select-filter]] ဒီ filter
      က အဲဒီ id မပါတော့တဲ့ array အသစ် ပြန်ပေးပါတယ်။ [[mark:type-handle-count]] တတိယက count ကို
      ပြောင်းပါတယ်။ [[mark:select-map]] ဒီ map က array အသစ် ပြန်ပေးပြီး၊ id ကိုက်တဲ့ item ကိုပဲ count
      အသစ်နဲ့ copy လုပ်ပါတယ်။ ကျန်တဲ့ item တွေက အဟောင်းအတိုင်းပါပဲ။
    sources:
      - title: "Updating Arrays in State"
        url: "https://react.dev/learn/updating-arrays-in-state"
      - title: "useState"
        url: "https://react.dev/reference/react/useState"
    actions:
      - id: wb-close-array
        type: whiteboard.apply
        at: { mark: close-array-board }
        open: false
      - id: open-app
        type: workspace.openFile
        at: { mark: open-app }
        path: src/App.jsx
      - id: type-app-import
        type: editor.type
        at: { mark: type-app-import }
        cadence: block
        target:
          file: src/App.jsx
          after: ""
          occurrence: 1
        text: "import { useState } from \"react\";\n"
      - id: type-order-state
        type: editor.type
        at: { mark: type-app-import, offsetMs: 1400 }
        cadence: block
        target:
          file: src/App.jsx
          after: "export default function App() {\n"
          occurrence: 1
        text: "  const [order, setOrder] = useState([]);\n"
      - id: type-handle-add
        type: editor.type
        at: { mark: type-handle-add }
        cadence: block
        target:
          file: src/App.jsx
          after: "  const available = menu.filter((dish) => !dish.soldOut).length;\n"
          occurrence: 1
        text: "\n  function handleAdd(id) {\n    if (order.some((item) => item.id === id)) return;\n    const dish = menu.find((d) => d.id === id);\n    setOrder([...order, { ...dish, count: 1 }]);\n  }\n"
      - id: select-spread
        type: editor.select
        at: { mark: select-spread }
        target:
          file: src/App.jsx
          text: "[...order, { ...dish, count: 1 }]"
          occurrence: 1
      - id: type-handle-remove
        type: editor.type
        at: { mark: type-handle-remove }
        cadence: block
        target:
          file: src/App.jsx
          after: "    setOrder([...order, { ...dish, count: 1 }]);\n  }\n"
          occurrence: 1
        text: "\n  function handleRemove(id) {\n    setOrder(order.filter((item) => item.id !== id));\n  }\n"
      - id: select-filter
        type: editor.select
        at: { mark: select-filter }
        target:
          file: src/App.jsx
          text: "order.filter((item) => item.id !== id)"
          occurrence: 1
      - id: type-handle-count
        type: editor.type
        at: { mark: type-handle-count }
        cadence: block
        target:
          file: src/App.jsx
          after: "    setOrder(order.filter((item) => item.id !== id));\n  }\n"
          occurrence: 1
        text: "\n  function handleChangeCount(id, count) {\n    setOrder(\n      order.map((item) => (item.id === id ? { ...item, count } : item)),\n    );\n  }\n"
      - id: select-map
        type: editor.select
        at: { mark: select-map }
        target:
          file: src/App.jsx
          text: "order.map((item) => (item.id === id ? { ...item, count } : item))"
          occurrence: 1

  # ------------------------------------------------------------------ 9
  - id: wire-add
    narration: >
      card တွေက handleAdd ကို ခေါ်ဖို့ လိုလို့၊ DishCard ထဲ ပြန်သွားရအောင်။ [[mark:type-on-add-prop]]
      onAdd ဆိုတဲ့ prop ထည့်ပါမယ်။ handler prop ကို on နဲ့၊ handler ကို handle နဲ့ စပေးတာ React ရဲ့
      ထုံးစံပါ။ [[mark:type-add-button]] ပြီးတော့ မှာမယ့် ခလုတ်ပါ။ ဒီတစ်ခါ onAdd ကို ဟင်းလျာရဲ့ id နဲ့
      ခေါ်ရမှာမို့၊ onClick ထဲမှာ တိုက်ရိုက် ခေါ်ရေးလို့ မရပါဘူး၊ render တုန်းမှာတင် run သွားမှာမို့ပါ။
      ဒါကြောင့် function ကို အတိုကောက် ရေးတဲ့ arrow function လေးနဲ့ ထုပ်ထားပြီး၊ click လုပ်မှ အဲဒီထဲက
      onAdd ကို id နဲ့ ခေါ်ပါတယ်။ ကုန်သွားတဲ့ ဟင်းလျာဆို ခလုတ်ကို ပိတ်ထားပါတယ်။ [[mark:open-app-again]]
      ကဲ၊ App ထဲ ပြန်ရအောင်။ [[mark:type-pass-on-add]] card တိုင်း handleAdd ကို onAdd အနေနဲ့ ရပါတယ်။
      [[mark:add-buttons-shown]] page ပြန်ပွင့်တော့ card တိုင်းမှာ မှာမယ့် ခလုတ် ပေါ်လာပြီး၊ ကုန်သွားတဲ့
      ဟာကတော့ နှိပ်လို့ မရပါဘူး။
    sources:
      - title: "Passing event handlers as props"
        url: "https://react.dev/learn/responding-to-events#passing-event-handlers-as-props"
      - title: "Naming event handler props"
        url: "https://react.dev/learn/responding-to-events#naming-event-handler-props"
    actions:
      - id: open-dish-card-again
        type: workspace.openFile
        at: { scene: start }
        path: src/DishCard.jsx
      - id: type-on-add-prop
        type: editor.type
        at: { mark: type-on-add-prop }
        cadence: block
        target:
          file: src/DishCard.jsx
          after: "soldOut = false"
          occurrence: 1
        text: ", onAdd"
      - id: type-add-button
        type: editor.type
        at: { mark: type-add-button }
        cadence: block
        target:
          file: src/DishCard.jsx
          after: "          +3 ခ\n        </button>\n"
          occurrence: 1
        text: "        <button\n          data-testid={`add-${id}`}\n          disabled={soldOut}\n          onClick={() => onAdd(id)}\n        >\n          မှာမယ်\n        </button>\n"
      - id: open-app-again
        type: workspace.openFile
        at: { mark: open-app-again }
        path: src/App.jsx
      - id: type-pass-on-add
        type: editor.type
        at: { mark: type-pass-on-add }
        cadence: block
        target:
          file: src/App.jsx
          after: "<DishCard key={dish.id} {...dish}"
          occurrence: 1
        text: " onAdd={handleAdd}"
      - id: expect-add-button
        type: expect.preview
        at: { mark: add-buttons-shown }
        timeoutMs: 5000
        target: { by: testId, value: add-mohinga }
        textContains: "မှာမယ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-sold-out-disabled
        type: expect.preview
        at: { afterAction: expect-add-button }
        timeoutMs: 5000
        target: { by: testId, value: add-ohn-no-khao-swe }
        attribute: { name: disabled, value: "" }
        retry: { maxAttempts: 3, delayMs: 300 }

  # ------------------------------------------------------------------ 10
  - id: order-panel
    chapter: "မှာထားတာတွေကို ပြကြည့်ရအောင်"
    narration: >
      order ကို screen ပေါ် မမြင်ရသေးလို့၊ OrderPanel ဆိုတဲ့ component တစ်ခု ရေးရအောင်။
      [[mark:open-order-panel]] ဒီ ဖိုင်ကို ဘယ်ဖိုင်ကမှ import မလုပ်ထားသေးလို့၊ ဒီထဲ ရိုက်တာက run နေတဲ့
      page ကို မထိပါဘူး။ [[mark:type-panel-head]] ဒီ component က order နဲ့ handler နှစ်ခုကို props အနေနဲ့
      လက်ခံပါတယ်။ prop နာမည်တွေကို App က ပေးမယ့် နာမည်နဲ့ အတူတူ ထားလို့၊ ဖိုင် နှစ်ဖိုင် ကိုက်ညီနေမှာပါ။
      [[mark:type-panel-total-line]] ပြီးတော့ စုစုပေါင်းပါ။ row တိုင်းရဲ့ ဈေးနှုန်းနဲ့ count ကို
      မြှောက်ပြီး ပေါင်းတာပါ။ state ထဲ သိမ်းမထားဘဲ render တိုင်း order ကနေ ပြန်တွက်လို့၊ order နဲ့ အမြဲ
      ကိုက်နေပါတယ်။ [[mark:type-panel-list]] နောက်တစ်ခုက JSX ပါ။ ခေါင်းစဉ်၊ order အလွတ်တုန်း ပြမယ့်
      စာသားနဲ့၊ ဟင်းလျာ တစ်ခုစီအတွက် row တစ်ခုစီပါ။ row မှာ နာမည်နဲ့ ပန်းကန် အရေအတွက် ပြပါတယ်။ key ကို
      ဟင်းလျာရဲ့ id ပေးထားလို့၊ ထည့်လိုက် ဖယ်လိုက်တဲ့အခါ ဘယ် row က ဘယ်ဟာလဲ React က မှတ်မိပါတယ်။
      [[mark:type-panel-buttons]] row တစ်ခုစီမှာ ခလုတ် သုံးခုပါ။ အနုတ်နဲ့ အပေါင်းက onChangeCount ကို count
      တစ် လျော့တာ ဒါမှမဟုတ် တစ် ပိုတာနဲ့ ခေါ်ပါတယ်။ count 1 မှာ အနုတ်ကို ပိတ်ထားလို့၊ ပန်းကန် 0 ဘယ်တော့မှ
      မပေါ်ပါဘူး။ နောက်ဆုံး ခလုတ်ကတော့ onRemove ကို ဟင်းလျာရဲ့ id နဲ့ ခေါ်ပြီး၊ row ကို ဖယ်ပါတယ်။
      [[mark:type-panel-total]] အောက်ဆုံးမှာတော့ စုစုပေါင်းကို ကျပ်နဲ့ ပြပါတယ်။
      [[mark:open-app-for-panel]] ကဲ၊ App ထဲမှာ သုံးကြည့်ရအောင်။ [[mark:type-panel-import]] import
      စာကြောင်းက အရင် လာရပါမယ်။ [[mark:type-panel-usage]] ပြီးတော့ panel ကို menu အပေါ်မှာ order နဲ့
      handler နှစ်ခုလုံးနဲ့ ထည့်ပါတယ်။ preview မှာ panel ပေါ်လာပြီး၊ မမှာရသေးပါလို့ ပြနေပါတယ်။
    sources:
      - title: "Avoid redundant state"
        url: "https://react.dev/learn/choosing-the-state-structure#avoid-redundant-state"
      - title: "Rendering Lists: keeping list items in order with key"
        url: "https://react.dev/learn/rendering-lists#keeping-list-items-in-order-with-key"
      - title: "Array.prototype.reduce()"
        url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/reduce"
    actions:
      - id: open-order-panel
        type: workspace.openFile
        at: { mark: open-order-panel }
        path: src/OrderPanel.jsx
      - id: type-panel-head
        type: editor.type
        at: { mark: type-panel-head }
        cadence: fast-explainer
        target:
          file: src/OrderPanel.jsx
          after: ""
          occurrence: 1
        text: "export default function OrderPanel({ order, onRemove, onChangeCount }) {\n"
      - id: type-panel-total-line
        type: editor.type
        at: { mark: type-panel-total-line }
        cadence: line-by-line
        target:
          file: src/OrderPanel.jsx
          after: "onChangeCount }) {\n"
          occurrence: 1
        text: "  const total = order.reduce((sum, item) => sum + item.price * item.count, 0);\n"
      - id: select-total
        type: editor.select
        at: { mark: type-panel-total-line, offsetMs: 2500 }
        target:
          file: src/OrderPanel.jsx
          text: "order.reduce((sum, item) => sum + item.price * item.count, 0)"
          occurrence: 1
      - id: type-panel-list
        type: editor.type
        at: { mark: type-panel-list }
        cadence: line-by-line
        target:
          file: src/OrderPanel.jsx
          after: "item.price * item.count, 0);\n"
          occurrence: 1
        text: "\n  return (\n    <section className=\"card\" data-testid=\"order-panel\">\n      <h2>မှာထားတာတွေ</h2>\n      {order.length === 0 && (\n        <p className=\"muted\" data-testid=\"order-empty\">\n          မမှာရသေးပါ\n        </p>\n      )}\n      <ul className=\"list\">\n        {order.map((item) => (\n          <li\n            key={item.id}\n            className=\"order-row\"\n            data-testid={`order-row-${item.id}`}\n          >\n            <span>\n              {item.name} × {item.count}\n            </span>\n"
      - id: type-panel-buttons
        type: editor.type
        at: { mark: type-panel-buttons }
        cadence: line-by-line
        target:
          file: src/OrderPanel.jsx
          after: "              {item.name} × {item.count}\n            </span>\n"
          occurrence: 1
        text: "            <span className=\"row\">\n              <button\n                data-testid={`less-${item.id}`}\n                disabled={item.count === 1}\n                onClick={() => onChangeCount(item.id, item.count - 1)}\n              >\n                −\n              </button>\n              <button\n                data-testid={`more-${item.id}`}\n                onClick={() => onChangeCount(item.id, item.count + 1)}\n              >\n                +\n              </button>\n              <button\n                className=\"secondary\"\n                data-testid={`remove-${item.id}`}\n                onClick={() => onRemove(item.id)}\n              >\n                ဖျက်\n              </button>\n            </span>\n"
      - id: type-panel-total
        type: editor.type
        at: { mark: type-panel-total }
        cadence: block
        target:
          file: src/OrderPanel.jsx
          after: "                ဖျက်\n              </button>\n            </span>\n"
          occurrence: 1
        text: "          </li>\n        ))}\n      </ul>\n      <p data-testid=\"order-total\">\n        စုစုပေါင်း {total.toLocaleString(\"en-US\")} ကျပ်\n      </p>\n    </section>\n  );\n}\n"
      - id: open-app-for-panel
        type: workspace.openFile
        at: { mark: open-app-for-panel }
        path: src/App.jsx
      - id: type-panel-import
        type: editor.type
        at: { mark: type-panel-import }
        cadence: block
        target:
          file: src/App.jsx
          after: "import DishCard from \"./DishCard.jsx\";\n"
          occurrence: 1
        text: "import OrderPanel from \"./OrderPanel.jsx\";\n"
      - id: type-panel-usage
        type: editor.type
        at: { mark: type-panel-usage }
        cadence: block
        target:
          file: src/App.jsx
          after: "        <Header />\n      </header>\n"
          occurrence: 1
        text: "      <OrderPanel\n        order={order}\n        onRemove={handleRemove}\n        onChangeCount={handleChangeCount}\n      />\n"
      - id: expect-panel-empty
        type: expect.preview
        at: { afterAction: type-panel-usage }
        timeoutMs: 5000
        target: { by: testId, value: order-empty }
        textContains: "မမှာရသေးပါ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-total-zero
        type: expect.preview
        at: { afterAction: expect-panel-empty }
        timeoutMs: 5000
        target: { by: testId, value: order-total }
        textContains: "စုစုပေါင်း 0 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 300 }

  # ------------------------------------------------------------------ 11
  - id: order-demo
