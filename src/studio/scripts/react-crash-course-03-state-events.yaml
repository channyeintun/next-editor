build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 3031

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  # ------------------------------------------------------------------ 1
  - id: why-state
    chapter: "State ဘာကြောင့် လိုလဲ"
    narration: >
      ပြီးခဲ့တဲ့ lesson အဆုံးမှာ card တွေကို နှိပ်လို့ ဘာမှ မဖြစ်သေးပါဘူး။ ဒီ lesson မှာ card တိုင်းမှာ
      like ခလုတ် ထည့်ပြီး၊ ဟင်းလျာ မှာလို့ ရတဲ့ order panel အထိ ရေးသွားမှာမို့၊ component က တန်ဖိုးကို
      ဘယ်လို မှတ်ထားလဲ ဆိုတာကနေ စကြည့်ရအောင်။ [[mark:start-server]] အဲဒီကြားမှာ editor က package တွေ
      install လုပ်ပြီး dev server စ run ထားပါလိမ့်မယ်။ [[mark:draw-let]] အရင်ဆုံး၊ သာမန် variable နဲ့
      ဘာကြောင့် မရလဲ။ card တစ်ခုစီက like အရေအတွက်ကို component ထဲက let variable မှာ မှတ်ထားတယ် ဆိုပါစို့။
      [[mark:let-resets]] React က card ကို ပြတိုင်း component ကို ပြန်ခေါ်လို့၊ အဲဒီ variable က ခေါ်တိုင်း
      0 ကနေ ပြန်စပါတယ်။ [[mark:let-silent]] ပြီးတော့ click လုပ်လို့ အဲဒါ ပြောင်းသွားရင်လည်း React က
      မသိလို့၊ screen ပေါ်မှာ အဟောင်းအတိုင်းပဲ ကျန်နေပါတယ်။ [[mark:draw-state]] ဒါကြောင့် React က
      component ကို state ဆိုတဲ့ memory ပေးထားပါတယ်။ [[mark:state-remembers]] useState ဆိုတဲ့ hook က
      အဲဒီ တန်ဖိုးကို render ကြားမှာ မှတ်ထားပေးပါတယ်။ hook ဆိုတာ use နဲ့ စတဲ့ React ရဲ့ အထူး function
      တွေပါ။ [[mark:state-rerenders]] useState က တန်ဖိုး ပြောင်းဖို့ function တစ်ခုလည်း ပေးပါတယ်။ အဲဒါ
      ခေါ်ရင် React က component ကို ပြန်ခေါ်ပြီး အသစ်ကို ပြပါတယ်၊ ဒါကို ပြန် render လုပ်တယ်လို့ ခေါ်ပါတယ်။
    sources:
      - title: "State: A Component's Memory"
        url: "https://react.dev/learn/state-a-components-memory"
      - title: "useState"
        url: "https://react.dev/reference/react/useState"
    actions:
      - id: wb-open-why
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: []
      - id: wb-why-title
        type: whiteboard.apply
        at: { scene: start }
        upsertIds: [a-title]
        drawMs: 1000
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 45000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: wb-draw-let
        type: whiteboard.apply
        at: { mark: draw-let }
        upsertIds: [a-let-box, a-let-code]
        drawMs: 1200
      - id: wb-let-resets
        type: whiteboard.apply
        at: { mark: let-resets }
        upsertIds: [a-let-l1]
        drawMs: 800
      - id: wb-let-silent
        type: whiteboard.apply
        at: { mark: let-silent }
        upsertIds: [a-let-l2, a-let-l3, a-let-strike]
        drawMs: 1500
      - id: wb-draw-state
        type: whiteboard.apply
        at: { mark: draw-state }
        upsertIds: [a-state-box, a-state-code]
        drawMs: 1200
      - id: wb-state-remembers
        type: whiteboard.apply
        at: { mark: state-remembers }
        upsertIds: [a-state-l1]
        drawMs: 800
      - id: wb-state-rerenders
        type: whiteboard.apply
        at: { mark: state-rerenders }
        upsertIds: [a-state-l2, a-state-l3, a-state-check]
        drawMs: 1800

  # ------------------------------------------------------------------ 2
  - id: add-use-state
    chapter: "Editor ထဲမှာ state ထည့်ကြည့်ရအောင်"
    narration: >
      ကဲ၊ ဟင်းလျာ card ဆီ သွားရအောင်။ [[mark:open-dish-card]] ဒါက ပြီးခဲ့တဲ့ lesson က DishCard ပါ။
      [[mark:select-props]] ဒီ props တွေကို ကြည့်ပါ။ ဟင်းလျာ တစ်ခုကို ဒီကနေ ရပြီး၊ နာမည်၊ badge နဲ့
      ဈေးနှုန်း ပြပါတယ်။ [[mark:open-preview]] preview ကို ဖွင့်ရအောင်။ card ငါးခု ပေါ်နေပေမယ့်၊ ခလုတ်
      မပါသေးပါဘူး။ [[mark:type-import]] useState ကို အရင် import လုပ်ပါမယ်။ [[mark:type-state]] ပြီးတော့
      component ရဲ့ အပေါ်ဆုံးမှာ သူ့ကို 0 နဲ့ ခေါ်ပါတယ်၊ အဲဒီ 0 က စစချင်း တန်ဖိုးပါ။ [[mark:select-state]]
      ဒီ useState စာကြောင်းကို ကြည့်ပါ။ သူက နှစ်ခု ပြန်ပေးပါတယ်၊ လက်ရှိ တန်ဖိုး likes နဲ့၊ အဲဒါကို
      ပြောင်းဖို့ ခေါ်ရမယ့် function setLikes ပါ။ [[mark:type-handler]] နောက်တစ်ဆင့်က event handler ပါ။
      event ဆိုတာ ခလုတ် နှိပ်တာလို အဖြစ်အပျက် ဖြစ်ပြီး၊ event handler ဆိုတာ အဲဒါ ဖြစ်ရင် React က
      ခေါ်ပေးမယ့် function ပါ။ နာမည်ကို handle နဲ့ စပြီး၊ likes ထက် တစ် ပိုတဲ့ တန်ဖိုးကို setLikes နဲ့
      တောင်းပါတယ်။ [[mark:type-like-button]] ပြီးတော့ နှလုံးပုံနဲ့ like အရေအတွက် ပြမယ့် ခလုတ်ပါ။ [[mark:select-onclick]] ဒီ onClick ကို ကြည့်ပါ။ handleLike ကို ခေါ်တာ
      မဟုတ်ဘဲ၊ function ကိုယ်တိုင်ကို ပေးတာပါ။ ဒီမှာ ခေါ်မိရင် click မှ မဟုတ်ဘဲ render တုန်းမှာတင် run
      သွားပါမယ်။
    sources:
      - title: "Responding to Events"
        url: "https://react.dev/learn/responding-to-events"
      - title: "State: A Component's Memory"
        url: "https://react.dev/learn/state-a-components-memory"
      - title: "useState"
        url: "https://react.dev/reference/react/useState"
    actions:
      - id: wb-close-why
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: wait-dev-server
        type: runtime.waitForReady
        at: { scene: start, offsetMs: 300 }
        timeoutMs: 20000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-dish-card
        type: workspace.openFile
        at: { mark: open-dish-card }
        path: src/DishCard.jsx
      - id: select-props
        type: editor.select
        at: { mark: select-props }
        target:
          file: src/DishCard.jsx
          text: "{ id, name, price, spicy = false, soldOut = false }"
          occurrence: 1
      - id: open-preview
        type: preview.open
        at: { mark: open-preview }
        timeoutMs: 15000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-cards
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: dish-card-mohinga }
        textContains: "မုန့်ဟင်းခါး"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: collapse-dock
        type: runtime.collapseDock
        at: { afterAction: expect-cards }
      - id: type-import
        type: editor.type
        at: { mark: type-import }
        cadence: block
        target:
          file: src/DishCard.jsx
          after: ""
          occurrence: 1
        text: "import { useState } from \"react\";\n"
      - id: type-state
        type: editor.type
        at: { mark: type-state }
        cadence: block
        target:
          file: src/DishCard.jsx
          after: "soldOut = false }) {\n"
          occurrence: 1
        text: "  const [likes, setLikes] = useState(0);\n\n"
      - id: select-state
        type: editor.select
        at: { mark: select-state }
        target:
          file: src/DishCard.jsx
          text: "const [likes, setLikes] = useState(0);"
          occurrence: 1
      - id: type-handler
        type: editor.type
        at: { mark: type-handler }
        cadence: block
        target:
          file: src/DishCard.jsx
          after: "  const [likes, setLikes] = useState(0);\n"
          occurrence: 1
        text: "\n  function handleLike() {\n    setLikes(likes + 1);\n  }\n"
      - id: type-like-button
        type: editor.type
        at: { mark: type-like-button }
        cadence: block
        target:
          file: src/DishCard.jsx
          after: "        <span className=\"price\">{price.toLocaleString(\"en-US\")} ကျပ်</span>\n      </div>\n"
          occurrence: 1
        text: "      <div className=\"row\">\n        <button\n          className=\"secondary\"\n          data-testid={`like-${id}`}\n          onClick={handleLike}\n        >\n          ❤ {likes}\n        </button>\n      </div>\n"
      - id: expect-like-button
        type: expect.preview
        at: { afterAction: type-like-button }
        timeoutMs: 5000
        target: { by: testId, value: like-mohinga }
        textContains: "❤ 0"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-onclick
        type: editor.select
        at: { mark: select-onclick }
        target:
          file: src/DishCard.jsx
          text: "onClick={handleLike}"
          occurrence: 1

  # ------------------------------------------------------------------ 3
  - id: click-like
    narration: >
      ကဲ၊ စမ်းကြည့်ရအောင်။ [[mark:click-like-1]] ပထမ card ရဲ့ နှလုံးပုံကို နှိပ်လိုက်တော့ 1 ဖြစ်သွားပါပြီ။
      [[mark:click-like-2]] ထပ်နှိပ်တော့ 2 ဖြစ်သွားပါပြီ။ [[mark:check-other-card]] ဒါပေမဲ့ ဒုတိယ card
      ကတော့ 0 အတိုင်းပါပဲ။ card တစ်ခုစီက သီးခြား copy ဖြစ်ပြီး၊ ကိုယ်ပိုင် state ကိုယ်စီ ရှိလို့ပါ။
    sources:
      - title: "State is isolated and private"
        url: "https://react.dev/learn/state-a-components-memory#state-is-isolated-and-private"
    actions:
      - id: click-like-1
        type: preview.click
        at: { mark: click-like-1 }
        timeoutMs: 5000
        target: { by: testId, value: like-mohinga }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: click-like-2
        type: preview.click
        at: { mark: click-like-2 }
        timeoutMs: 5000
        target: { by: testId, value: like-mohinga }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-like-two
        type: expect.preview
        at: { afterAction: click-like-2 }
        timeoutMs: 5000
        target: { by: testId, value: like-mohinga }
        textContains: "❤ 2"
        retry: { maxAttempts: 3, delayMs: 200 }
      - id: expect-other-zero
        type: expect.preview
        at: { mark: check-other-card }
        timeoutMs: 5000
        target: { by: testId, value: like-shan-noodles }
        textContains: "❤ 0"
        retry: { maxAttempts: 3, delayMs: 200 }

  # ------------------------------------------------------------------ 4
  - id: render-commit
    chapter: "Click ပြီးရင် ဘာ ဖြစ်လဲ"
    narration: >
      ဒါဆို click နဲ့ ကိန်းဂဏန်း အသစ် ကြားမှာ ဘာတွေ ဖြစ်သွားလဲ ကြည့်ရအောင်။ စားသောက်ဆိုင် တစ်ဆိုင်လို
      စဉ်းစားကြည့်ပါ။ [[mark:draw-trigger]] ပထမက trigger ပါ၊ ဧည့်သည်က ဟင်း မှာလိုက်တာပါ။ React မှာ trigger
      က နှစ်မျိုးပဲ ရှိပါတယ်၊ app စစချင်း render လုပ်တာနဲ့၊ ခုနက click လို state ပြောင်းတာပါ။
      [[mark:draw-render]] ဒုတိယက render ပါ၊ မီးဖိုချောင်က ချက်တာပါ။ screen မှာ ဘာ ပြရမလဲ တွက်ဖို့ React က
      component ကို ပြန်ခေါ်ပါတယ်။ screen ပေါ် ဘာမှ မပြောင်းသေးပါဘူး။ [[mark:draw-commit]] တတိယက commit
      ပါ၊ ဟင်းပွဲ စားပွဲ ရောက်တာပါ။ React က DOM ထဲက ကွာတဲ့ နေရာလေးကိုပဲ ပြင်ပါတယ်၊ ဒီမှာ ကိန်းဂဏန်း
      တစ်လုံးတည်းပါ။ [[mark:draw-paint]] ပြီးမှ browser က paint လုပ်ပေးလို့ ကိုယ် မြင်ရတာပါ။
    sources:
      - title: "Render and Commit"
        url: "https://react.dev/learn/render-and-commit"
    actions:
      - id: wb-open-render
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: wb-draw-trigger
        type: whiteboard.apply
        at: { mark: draw-trigger }
        upsertIds:
          [b-trigger-box, b-trigger-name, b-trigger-verb, b-trigger-note-1, b-trigger-note-2]
        drawMs: 2000
      - id: wb-draw-render
        type: whiteboard.apply
