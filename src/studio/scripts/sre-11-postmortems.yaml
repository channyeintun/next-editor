  - id: this-week
    narration: >
      [[mark:close-b3]] [[mark:show-p05]] ဒီအပတ် ကိုယ့်အဖွဲ့ရဲ့ postmortem အလေ့အထကို နည်းနည်းချင်း ပြင်ကြည့်ပါ။ ကိုယ့် postmortem template မှာ ဘာ မှန်ခဲ့လဲ၊ ဘယ်မှာ ကံကောင်းခဲ့လဲ ဆိုတဲ့ ခေါင်းစဉ် နှစ်ခု ထည့်ပါ။ မပြီးသေးတဲ့ action item တိုင်းကို နာမည်ပါတဲ့ owner ပေးပါ။ ပြီးတော့ ကံကောင်းလို့ ထိခိုက်မှု မရှိသလောက်နဲ့ လွတ်ခဲ့တဲ့ near miss တစ်ခုကို ရေးကြည့်ပါ၊ incident လိုပဲ သင်ခန်းစာ ပေးပေမဲ့ ကုန်ကျစရိတ် အများကြီး နည်းပါတယ်။
