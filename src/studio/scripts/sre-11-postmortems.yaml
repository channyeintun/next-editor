# SRE from zero, lesson 11: A postmortem that teaches (Burmese concept lesson).
#
# Built from the approved voice script
# docs/sre-course/voice-scripts/sre-11-postmortems.md. Every spoken
# character is that script's "> " lines, unchanged; each ⟪…⟫ marker became a
# [[mark:…]] at the same place. Check it with:
#   bun ~/Documents/sre-course/work/check-narration.ts \
#     docs/sre-course/voice-scripts/sre-11-postmortems.md \
#     src/studio/scripts/sre-11-postmortems.yaml
#
# Nothing runs: deck pages and the whiteboard carry the lesson, and notes.md is
# the recap. The workspace and runtime follow the validated no-code skeleton
# (WebContainer, empty init command, a harmless dev script).
#
# Pacing: no page or board step holds longer than about 31 s at 70 ms/char
# (l11_p04, whose two paragraphs name the problem and then the three action
# items the page lists), so no marks were added beyond the voice script's own.
#
# Boards (B1 P8 timeline, B2 left-to-right blame flow, B3 P6 lanes). Colour
# jobs: #1e1e1e ink (paints white) for the axis, neutral ticks, the quote and
# arrows; blue the thing named (our post, the automatic refunds); green healthy
# or done (the mitigation, the better question, the better message); red
# failure (double charges, blame, our retry, nobody told users); orange the
# caveat (the two biases, the silent gap, 1,500 calls). A label on two lines is
# two text assets, one per line, so each line meets the 0.55 em width rule on
# its own. "Three new elements per step" counts a tick or box with its label as
# one element, as in Module 1.
#
# Deck pages: deck "Next Editor · SRE 3 · Respond and learn". The /pub URL
# below is the deck's published link; until this lesson's pages are built
# into it, the published copy holds only the kit pages and the Director
# reports the l11 pages missing. Page plan:
# ~/Documents/sre-course/work/pages/sre-11-postmortems.json
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/sre-11-postmortems.yaml
#   bun scripts/studio-compile-check.ts src/studio/scripts/sre-11-postmortems.yaml
