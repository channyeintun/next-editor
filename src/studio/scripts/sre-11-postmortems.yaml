  - id: made-sense
    chapter: အဲဒီညက အဓိပ္ပာယ် ရှိခဲ့တာ
    narration: >
      [[mark:close-b1]] [[mark:show-p02]] အစည်းအဝေးမှာ တစ်ယောက်က ကိုမင်းကို ဘာလို့ retry ထည့်တာလဲ၊ ဘာလို့ idempotency key မထည့်တာလဲလို့ မေးပါတယ်။ ဒီလို မေးခံရရင် လူက ကိုယ့်ကိုယ်ကို ကာကွယ်ဖို့ပဲ စဉ်းစားမိလို့ Eats lead က မေးခွန်းကို ပြောင်းပြီး အဲဒီညက Bank X ဘာဖြစ်နေလဲ၊ ရှိပြီးသား code က ဘယ်လို လုပ်ခဲ့လဲလို့ အခြေအနေကို မေးပါတယ်။ ဒီလို မေးမှ ပြင်လို့ရတဲ့ အချက်တွေ ပေါ်လာတာပါ။
      [[mark:show-p02b]] ကိုမင်းက retry ကို ဘေးကင်းတယ် ထင်ခဲ့တာ သူ လုပ်နေကျ Top-up code မှာ retry နဲ့ idempotency key နှစ်ခုလုံး ရှိလို့ပါ။ ဒီ key က ငွေချေမှု တစ်ခုချင်းကို သီးသန့် နံပါတ် ပေးထားလို့ ဘယ်နှခါ ပြန်ပို့ပို့ ငွေ တစ်ခါပဲ ဖြတ်ပါတယ်။ lesson ၁ ရဲ့ အကြွေး စာရင်းထဲမှာ ဒီ key ပါခဲ့ပေမဲ့ Top-up ဘက်မှာပဲ ဆပ်ခဲ့ပြီး Wallet ဘက်က တစ်ဝက်ကို ဘယ်သူမှ မဆပ်ခဲ့ပါဘူး။
      [[mark:show-p02c]] အဲဒီအချိန်မှာ သူ သိထားတာနဲ့ဆိုရင် လုပ်ခဲ့တာက သူ့အတွက် အဓိပ္ပာယ် ရှိခဲ့တယ်လို့ ကြည့်တာကို local rationality လို့ ခေါ်ပါတယ်။ ကိုမင်းကို ဘေးကင်းတယ်လို့ ထင်စေခဲ့တဲ့ အခြေအနေ မပြောင်းရင် နောက်လူလည်း ဒီလိုပဲ ထင်မှာမို့ ပြင်ရမှာက ကိုမင်း မဟုတ်ဘဲ အခြေအနေပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Workbook: Postmortem Culture: Learning from Failure",
          url: "https://sre.google/workbook/postmortem-culture/",
        }
      - {
          title: "Reason, Human error: models and management (BMJ, PMC)",
          url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC1117770/",
        }
    actions:
      - {
          id: close-b1,
          type: whiteboard.apply,
          at: { mark: close-b1, offsetMs: -400 },
          open: false,
        }
      - { id: show-p02, type: slide.show, at: { mark: show-p02 }, slideId: l11-p02 }
      - { id: show-p02b, type: slide.show, at: { mark: show-p02b }, slideId: l11-p02b }
      - { id: show-p02c, type: slide.show, at: { mark: show-p02c }, slideId: l11-p02c }

  - id: obviously
    chapter: Hindsight နဲ့ outcome bias
    narration: >
      [[mark:close-p02c]] [[mark:b2-s1]] ဆွေးနွေးရင်း တစ်ယောက်က key မပါဘဲ retry လုပ်ရင် နှစ်ခါ ဖြတ်မှာ သိသာပါတယ်လို့ ပြောလိုက်တော့ Eats lead က ဒီ စကားထဲက bias နှစ်ခုကို ထောက်ပြပါတယ်။ အဖြေ သိပြီးမှ ပြန်ကြည့်တော့ သိသာခဲ့သလို ထင်မိတာက hindsight bias ပါ၊ retry ထည့်တုန်းက ဘယ်သူမှ မမြင်ခဲ့ပါဘူး။ ရလဒ် ဆိုးလို့ ဆုံးဖြတ်ချက်ကိုပါ ဆိုးတယ်လို့ အကဲဖြတ်မိတာကတော့ outcome bias ပါ။
      [[mark:b2-s2]] တကယ်လို့ Bank X က ငွေ မဖြတ်ဘဲ fail ပဲ ဖြစ်ခဲ့ရင် retry က ငွေချေမှုတွေကို ကယ်လို့ ကိုမင်းကို ချီးကျူးကြမှာပါ၊ ဆုံးဖြတ်ချက်က အတူတူပဲ၊ ကံပဲ ကွာသွားတာပါ။ bias နှစ်ခုလုံးက blameless review ကို အပြစ်ရှာတဲ့ဘက် တိတ်တိတ်လေး ပြန်ဆွဲသွားလို့ နောက်တစ်ခါ ဘယ်သူမှ ပွင့်ပွင့်လင်းလင်း ပြောရဲတော့မှာ မဟုတ်ပါဘူး။
      [[mark:b2-s3]] ဒါကြောင့် Eats lead က bias ကြားတိုင်း အဲဒီအချိန်က ကိုမင်း ဘာကို သိခဲ့လဲလို့ ပြန်မေးပါတယ်။ အဖြေကတော့ Wallet မှာ key မပါကြောင်း သတိပေးမယ့် test လည်း မရှိ၊ ရေးထားတဲ့ စာ တစ်ကြောင်းလည်း မရှိခဲ့တာပါ။ ဒါတွေက အပြစ်ရှာစရာ မဟုတ်ဘဲ ပြင်စရာ နေရာတွေပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "How Complex Systems Fail (Richard Cook)",
          url: "https://how.complexsystems.fail/",
        }
      - {
          title: "Reason, Human error: models and management (BMJ, PMC)",
          url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC1117770/",
        }
    actions:
      - { id: close-p02c, type: slide.close, at: { mark: close-p02c, offsetMs: -400 } }
      - {
          id: b2-s1,
          type: whiteboard.apply,
          at: { mark: b2-s1 },
          open: true,
          clear: true,
          upsertIds: [l11-b2-quote],
        }
      - id: b2-s1-draw
        type: whiteboard.apply
        at: { afterAction: b2-s1 }
        upsertIds: [l11-b2-hind, l11-b2-hind-t, l11-b2-out, l11-b2-out-t1, l11-b2-out-t2]
        drawMs: 2000
      - id: b2-s2
        type: whiteboard.apply
        at: { mark: b2-s2 }
        upsertIds: [l11-b2-a1, l11-b2-a2, l11-b2-blame, l11-b2-blame-t1, l11-b2-blame-t2]
        drawMs: 1800
      - {
          id: b2-s3,
          type: whiteboard.apply,
          at: { mark: b2-s3 },
          upsertIds: [l11-b2-a3, l11-b2-know, l11-b2-know-t1, l11-b2-know-t2],
          drawMs: 1500,
        }

  - id: wrong-right-lucky
    chapter: မှား၊ မှန်၊ ကံကောင်း
    narration: >
      [[mark:close-b2]] [[mark:show-p03]] postmortem တွေက မှားခဲ့တာကိုပဲ ရေးလေ့ ရှိပေမဲ့ Padauk ကတော့ ဘာ မှန်ခဲ့လဲ၊ ဘယ်မှာ ကံကောင်းခဲ့လဲ ဆိုတာကိုပါ မေးပါတယ်။ မှားခဲ့တာကို ပြင်ပြီး မှန်ခဲ့တာကို မတော်တဆ မဟုတ်ဘဲ အမြဲ ဖြစ်အောင် default လုပ်ရပါမယ်။ ကံကောင်းခဲ့တာကိုတော့ ဆက် အားမကိုးရအောင် ပြင်ရပါမယ်၊ ကံက အမြဲ ပါမလာလို့ပါ။
      [[mark:show-p03b]] ဥပမာ အဲဒီည refund job က မတော်တဆ စော run ခဲ့လို့ user အများစု မနက် မလင်းခင် ငွေ ပြန်ရခဲ့ပါတယ်၊ ဒါက ကံ သက်သက်ပါ။ မစုရဲ့ အဖွဲ့က မိနစ်ပိုင်းအတွင်း ရေးလိုက်တဲ့ ပြန်စာ နမူနာကတော့ အရမ်း အလုပ်ဖြစ်လို့ ငွေနဲ့ ဆိုင်တဲ့ incident တိုင်းအတွက် default ဖြစ်သွားပါတယ်။ အခု Padauk ရဲ့ postmortem template မှာ မှန်ခဲ့တာနဲ့ ကံကောင်းခဲ့တာ ဆိုတဲ့ အပိုင်း နှစ်ခု အမြဲ ပါပါပြီ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Hollnagel, Wears & Braithwaite, From Safety-I to Safety-II: A White Paper (NHS England PDF)",
          url: "https://www.england.nhs.uk/signuptosafety/wp-content/uploads/sites/16/2015/10/safety-1-safety-2-whte-papr.pdf",
        }
      - {
          title: "Workbook: Postmortem Culture: Learning from Failure",
          url: "https://sre.google/workbook/postmortem-culture/",
        }
    actions:
