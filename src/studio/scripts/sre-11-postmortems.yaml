      notes.md: |
        # သင်ခန်းစာ ရတဲ့ postmortem

        - postmortem — ဘာဖြစ် · ဘယ်သူ ထိခိုက် · ဘာက ဖြစ်စေ · ဘာ ပိုသိ
        - timeline — ဘာကြောင့်လဲ မမေးခင် သဘောတူတဲ့ မှတ်တမ်း
        - local rationality — အဲဒီအချိန်က သိထားတာနဲ့ အဓိပ္ပာယ် ရှိခဲ့
        - hindsight bias — အဖြေ သိမှ "သိသာခဲ့တယ်"
        - outcome bias — ရလဒ်ဆိုး = ဆုံးဖြတ်ချက်ဆိုး လို့ ထင်တာ
        - restorative accountability — အပြစ်ပေးမယ့်အစား ပြင်ရာမှာ ပါဝင်ပြီး တာဝန်ယူ

        မေးခွန်း: "log တွေကို ဘာလို့ မစစ်ခဲ့တာလဲ?" ကို အခြေအနေကို မေးတဲ့ မေးခွန်း ဖြစ်အောင် ပြန်ရေးပါ။
