build:
  # Studio swaps in the Burmese voice chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 2611

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: hook
    chapter: ငွေ နှစ်ခါ ဖြတ်ခံရတဲ့ ည
    narration: >
      [[mark:show-p01]] လစာထုတ်ရက် incident ကနေ Padauk ထုတ်ခဲ့တာ သုံးခုပါ၊ ဘယ်ပြဿနာမှာမဆို သုံးလို့ရတဲ့ fix စာရင်း၊ drill card နဲ့ လစဉ် incident role-play ပါ။ တစ်ပတ်အကြာ Wallet promotion မစခင်မှာ developer ကိုမင်းက Bank X နှေးရင်တောင် ငွေချေမှုတွေ fail မဖြစ်အောင် payment call မှာ retry ထည့်လိုက်ပါတယ်။
      [[mark:show-p01b]] promotion စတဲ့ ညနေ ၇ နာရီကျော်မှာ Bank X တကယ်ပဲ နှေးလာပါတယ်။ Bank X က ငွေ ဖြတ်ပြီးသား ဖြစ်ပေမဲ့ အဖြေ နောက်ကျတော့ Padauk ဘက်က မအောင်မြင်ဘူး ထင်ပြီး ထပ်ပို့လိုက်လို့ user တချို့ ငွေ နှစ်ခါ ဖြတ်ခံရပါတယ်။ အဖွဲ့က retry ကို ပိတ်လိုက်ပါတယ်၊ ဒါက အကြောင်းရင်း မသိခင် user ထိခိုက်တာကို အရင် ရပ်တဲ့ mitigation ပါ။ ဒါပေမဲ့ refund တောင်းတာတွေ ပုံလာလို့ ဒေါသထွက်နေတဲ့ user တွေကို ဖြေရင်း ညတစ်ညလုံး ကုန်သွားပါတယ်။
      [[mark:show-p01c]] နောက်တစ်နေ့ မနက် team chat ထဲမှာ ဒါ ဘယ်သူ deploy လုပ်တာလဲ ဆိုတဲ့ message ပေါ်လာတော့ ကိုမင်း တိတ်သွားပါတယ်။ ကိုမင်းကို အပြစ်မရှာဘဲ ဒီ incident ကနေ ဘာ သင်ခန်းစာ ယူမလဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Workbook: Postmortem Culture: Learning from Failure",
          url: "https://sre.google/workbook/postmortem-culture/",
        }
    actions:
      # -1750 / -1450, as in Module 1: a pull-back over 1780 ms pushes the first dialog
      # past the 2 s opening handle, which src/studio/plans/index.test.ts rejects.
      - { id: collapse-dock, type: runtime.collapseDock, at: { scene: start, offsetMs: -1750 } }
      - {
          id: show-p01,
          type: slide.show,
          at: { mark: show-p01, offsetMs: -1450 },
          slideId: l11-p01,
        }
      - { id: show-p01b, type: slide.show, at: { mark: show-p01b }, slideId: l11-p01b }
      - { id: show-p01c, type: slide.show, at: { mark: show-p01c }, slideId: l11-p01c }

  - id: the-meeting
    chapter: Timeline ကနေ စတဲ့ postmortem
    narration: >
      [[mark:show-p01d]] မသီရိက ဒီ postmortem ကို incident မှာ မပါခဲ့တဲ့ Eats အဖွဲ့က lead တစ်ယောက်ကို ဦးဆောင်ခိုင်းပါတယ်။ အပြင်လူမို့ ဘက်မလိုက်ဘဲ ကြည့်နိုင်ပြီး တစ်ညလုံး မအိပ်ရတဲ့ Wallet အဖွဲ့လည်း အနားယူရပါတယ်။ ပြဿနာက အဖွဲ့ နှစ်ဖွဲ့ကြားမှာ ဖြစ်ခဲ့လို့ စာကိုတော့ Wallet အဖွဲ့နဲ့ Bank X ချိတ်ဆက်မှုကို ပိုင်တဲ့ engineer က အတူ ရေးပါတယ်။
      [[mark:show-p01e]] postmortem ဆိုတာ incident ပြီးရင် စာနဲ့ ရေးပြီး အဖွဲ့လိုက် သင်ယူတာပါ၊ lesson ၅ က blameless review လိုပဲ လူကို အပြစ်မရှာဘဲ system ထဲက အားနည်းချက်ကို ရှာပါတယ်။ ဘာဖြစ်ခဲ့လဲ၊ ဘယ်သူတွေ ထိခိုက်ခဲ့လဲ၊ ဘာတွေက ဖြစ်စေခဲ့လဲ၊ ဘာ ပိုသိလာလဲ ဆိုတဲ့ မေးခွန်း လေးခုကို ဖြေရပါတယ်။ ဖြစ်စေခဲ့တဲ့ အကြောင်းရင်းကတော့ တစ်ခုတည်း ရှိလေ့ မရှိပါဘူး။
      [[mark:close-p01e]] [[mark:b1-s1]] Eats lead က ဘာကြောင့်လဲ မမေးခင် ဘာက ဘယ်အချိန် ဖြစ်ခဲ့လဲ ဆိုတဲ့ timeline ကို အရင် စီပါတယ်။ deploy မှတ်တမ်း၊ log နဲ့ chat တွေကို စုလိုက်တော့ retry change ကို deploy လုပ်တာ၊ Bank X နှေးလာတာ၊ ငွေ နှစ်ခါ စဖြတ်တာတွေ timeline ပေါ်ကို ရောက်လာပါတယ်။
      [[mark:b1-s2]] ပြီးတော့ support lead မစုကိုလည်း မေးကြည့်တော့ refund တောင်းတဲ့ message တွေက alert မတက်ခင် ကတည်းက ဝင်နေခဲ့တာ ပေါ်လာပါတယ်။ timeline ကို အားလုံး သဘောတူမှ ဘာကြောင့်လဲ စဆွေးနွေးပါတယ်၊ ဒီလို မလုပ်ရင် ကိုယ်စီ မှတ်မိသလို ငြင်းနေကြမှာပါ။
      [[mark:b1-s3]] timeline က ပြဿနာကို အစောဆုံး သိနိုင်ခဲ့တဲ့ နေရာကိုလည်း ပြပါတယ်။ ငွေ နှစ်ခါ စဖြတ်တာနဲ့ alert တက်တာကြား မိနစ် ၄၀ လောက်မှာ system က ဘာမှ မပြောဘဲ user တွေကပဲ ပြောနေခဲ့ပါတယ်။ အကောင်းဆုံး fix တွေက ဒီလို ကွက်လပ်မှာ ရှိတတ်ပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Workbook: Postmortem Culture: Learning from Failure",
          url: "https://sre.google/workbook/postmortem-culture/",
        }
      - {
          title: "How Complex Systems Fail (Richard Cook)",
          url: "https://how.complexsystems.fail/",
        }
    actions:
      - { id: show-p01d, type: slide.show, at: { mark: show-p01d }, slideId: l11-p01d }
      - { id: show-p01e, type: slide.show, at: { mark: show-p01e }, slideId: l11-p01e }
      - { id: close-p01e, type: slide.close, at: { mark: close-p01e, offsetMs: -400 } }
