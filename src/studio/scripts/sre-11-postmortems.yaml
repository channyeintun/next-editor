      - { id: show-p03b, type: slide.show, at: { mark: show-p03b }, slideId: l11-p03b }

  - id: action-items
    chapter: Action item နဲ့ တာဝန်ယူမှု
    narration: >
      [[mark:show-p04]] အဲဒီည retry ကို ပိတ်လိုက်တာက ယာယီ patch ပါ။ ဒီအတိုင်း ထားရင် Bank X နှေးတိုင်း ငွေချေမှုတွေ fail ဖြစ်ပြီး တစ်ယောက်ယောက်က key မပါဘဲ retry ကို ပြန်ထည့်မိဦးမှာပါ။ ဒါကြောင့် လုပ်စရာ၊ action item သုံးခု ထွက်လာပါတယ်။
      Wallet မှာ idempotency key ထည့်တာကို ကိုမင်းနဲ့ Wallet lead က ယူပါတယ်။ ငွေ နှစ်ခါ ဖြတ်ရင် တက်မယ့် alert ကို မသီရိက နှစ်ပတ်အတွင်း ထည့်ပါမယ်။ refund ကို တစ်နာရီအတွင်း ပြီးအောင် လုပ်တာကိုတော့ support နဲ့ Wallet အဖွဲ့က ယူပါတယ်။
      [[mark:show-p04b]] ဒီ သုံးခုက ထပ်မဖြစ်အောင် တားတာ၊ စောစော သိအောင် လုပ်တာ၊ ထိခိုက်မှု လျှော့တာ ဆိုပြီး ထောင့် သုံးခုကနေ ကာထားတာပါ။ item တိုင်းမှာ နာမည်ပါတဲ့ owner၊ ဘာကြောင့် အရင်လုပ်ရမလဲ ဆိုတဲ့ အကြောင်းပြချက်နဲ့ sprint ထဲမှာ တကယ် ပေးထားတဲ့ အချိန် ရှိရပါမယ်။ item ကိုလည်း တကယ် ပြီးမှ ပိတ်ပါတယ်၊ မပြီးတဲ့ item တွေ ပုံနေရင် postmortem ရေးတာ အလကားပဲလို့ လူတွေ ထင်လာလို့ပါ။
      [[mark:show-p04c]] ကိုမင်းကိုယ်တိုင် key ထည့်တဲ့ အလုပ်ရဲ့ owner ဖြစ်နေတာကိုလည်း သတိထားကြည့်ပါ။ blameless ဆိုတာ ဘယ်သူမှ တာဝန်မရှိဘူးလို့ မဆိုလိုပါဘူး။ ဆုံးဖြတ်ချက်နဲ့ အနီးဆုံး လူကို အပြစ်ပေးမယ့်အစား ပြင်တဲ့ အလုပ်မှာ ပါဝင်ပြီး တာဝန်ယူစေတာကို restorative accountability လို့ ခေါ်ပါတယ်။
      [[mark:show-p04d]] postmortem ကို အဖွဲ့တိုင်း ဖတ်လို့ရအောင် မျှလို့ Eats အဖွဲ့ကလည်း ကိုယ့်ဘက်ကို ပြန်စစ်ပါတယ်။ တခြား အဖွဲ့က reviewer တစ်ယောက်က ဒီ item တွေ နောက် incident ကို တကယ် တိုစေမလား စစ်ပေးပါတယ်။ CTO ကိုနေလင်းကလည်း လတိုင်း incident trend တွေနဲ့ အဆင်ပြေခဲ့တဲ့ launch တစ်ခုကို ပြန်ကြည့်ပြီး item တွေ ပြီးဖို့ အချိန် ပေးပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Workbook: Postmortem Culture: Learning from Failure",
          url: "https://sre.google/workbook/postmortem-culture/",
        }
    actions:
      - { id: show-p04, type: slide.show, at: { mark: show-p04 }, slideId: l11-p04 }
      - { id: show-p04b, type: slide.show, at: { mark: show-p04b }, slideId: l11-p04b }
      - { id: show-p04c, type: slide.show, at: { mark: show-p04c }, slideId: l11-p04c }
      - { id: show-p04d, type: slide.show, at: { mark: show-p04d }, slideId: l11-p04d }

  - id: customer-side
    chapter: Customer ဘက်က review
    narration: >
      [[mark:close-p04d]] [[mark:b3-s1]] နောက်ဆုံးမှာ မစုက engineer တွေ မမြင်ခဲ့တဲ့ customer ဘက်ကို ပြပါတယ်။ incident စစချင်း Padauk က Facebook မှာ Bank X ပြဿနာပါလို့ post တင်ခဲ့ပေမဲ့ တကယ်တော့ ကိုယ့် retry ကြောင့် ဖြစ်တာပါ။ မသေချာတာကို သေချာသလို ပြောမိလို့ Bank X ကိုပါ အပြစ်ဖို့မိခဲ့တာပါ။
      [[mark:b3-s2]] refund တွေက အလိုအလျောက် ပြန်ရမှာ ဖြစ်ပေမဲ့ user တွေကို ဘယ်သူမှ ကြိုမပြောခဲ့လို့ support ဆီ ဖုန်း ၁၅၀၀ လောက် ဝင်လာပါတယ်။ ဒါကြောင့် postmortem က ဘယ်နှယောက် ထိခိုက်လဲ ဆိုတာအပြင် ဘာကို ဘယ်အချိန် ပြောခဲ့လဲ ဆိုတာကိုပါ review လုပ်ပါတယ်။
      [[mark:b3-s3]] မစုရဲ့ အဓိက အချက်ကတော့ customer ကို ပြောတဲ့ စကားကလည်း engineering ရဲ့ အစိတ်အပိုင်းမို့ code လိုပဲ review လုပ်ရမယ် ဆိုတာပါ။ နောက်ဆို incident message တွေမှာ သေချာတာနဲ့ ခန့်မှန်းတာကို ခွဲပြောပြီး refund ကို အလိုအလျောက် ပြန်ရမယ်လို့ ကြိုပြောပါမယ်။
    sources:
