  - id: recap
    narration: >
      [[mark:close-p05]] [[mark:open-notes]] ကိုမင်းရဲ့ ညက သင်ခန်းစာတွေကို ပြန်စုကြည့်ရအောင်။ [[mark:sel-postmortem]] postmortem က incident ပြီးရင် မေးခွန်း လေးခုကို ဖြေပြီး အဖွဲ့လိုက် သင်ယူတာပါ။ [[mark:sel-timeline]] timeline ကတော့ ဘာကြောင့်လဲ မမေးခင် အားလုံး သဘောတူထားတဲ့ အချိန်အလိုက် မှတ်တမ်းပါ။
      [[mark:sel-local]] local rationality က အဲဒီအချိန်က သိထားတာနဲ့ဆိုရင် သူ့ ဆုံးဖြတ်ချက်က အဓိပ္ပာယ် ရှိခဲ့တယ်လို့ ကြည့်တာပါ။ [[mark:sel-hindsight]] hindsight bias က အဖြေ သိပြီးမှ သိသာခဲ့တယ်လို့ ထင်တာဖြစ်ပြီး၊ [[mark:sel-outcome]] outcome bias က ရလဒ် ဆိုးလို့ ဆုံးဖြတ်ချက်ကိုပါ ဆိုးတယ်လို့ အကဲဖြတ်တာပါ။
      [[mark:sel-restorative]] restorative accountability ကတော့ အပြစ်ပေးမယ့်အစား ပြင်တဲ့ အလုပ်မှာ ပါဝင်ပြီး တာဝန်ယူစေတာပါ။ [[mark:sel-question]] log တွေကို ဘာလို့ မစစ်ခဲ့တာလဲ ဆိုတဲ့ မေးခွန်းကို Eats lead လိုပဲ လူကို မဟုတ်ဘဲ အခြေအနေကို မေးအောင် ဘယ်လို ပြန်ရေးမလဲ?
      [[mark:pause-question]] အဲဒီအချိန်က log နဲ့ dashboard တွေမှာ ဘာ ပြနေခဲ့လဲ ဆိုတာမျိုး မေးလို့ရပါတယ်။ နောက်လ လစာထုတ်ရက်မှာ ဘယ်သူမှ မမှားဘဲ ကံကြောင့်သာ လွတ်သွားတဲ့ near miss တစ်ခု ဖြစ်ပါတယ်။ ရှုပ်ထွေးတဲ့ system တွေက ဘာကြောင့် အဲဒီလို ပျက်တတ်တာလဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Workbook: Postmortem Culture: Learning from Failure",
          url: "https://sre.google/workbook/postmortem-culture/",
        }
      - {
          title: "How Complex Systems Fail (Richard Cook)",
          url: "https://how.complexsystems.fail/",
        }
    actions:
      - { id: close-p05, type: slide.close, at: { mark: close-p05 } }
      - {
          id: open-notes,
          type: workspace.openFile,
          at: { mark: open-notes, offsetMs: 300 },
          path: notes.md,
        }
      # occurrence 2: the title line "# သင်ခန်းစာ ရတဲ့ postmortem" holds the first match.
      - {
          id: sel-postmortem,
          type: editor.select,
          at: { mark: sel-postmortem },
          target: { file: notes.md, text: "postmortem", occurrence: 2 },
        }
      - {
          id: sel-timeline,
          type: editor.select,
          at: { mark: sel-timeline },
          target: { file: notes.md, text: "timeline", occurrence: 1 },
        }
      - {
          id: sel-local,
          type: editor.select,
          at: { mark: sel-local },
          target: { file: notes.md, text: "local rationality", occurrence: 1 },
        }
      - {
          id: sel-hindsight,
          type: editor.select,
          at: { mark: sel-hindsight },
          target: { file: notes.md, text: "hindsight bias", occurrence: 1 },
        }
      - {
          id: sel-outcome,
          type: editor.select,
          at: { mark: sel-outcome },
          target: { file: notes.md, text: "outcome bias", occurrence: 1 },
        }
      - {
          id: sel-restorative,
          type: editor.select,
          at: { mark: sel-restorative },
          target: { file: notes.md, text: "restorative accountability", occurrence: 1 },
        }
      # The voice script's ⟪select မေးခွန်း⟫ and ⟪pause 3s⟫, the way the Module 1
      # reviewers fixed the pause. Here the ⟪select မေးခွန်း⟫ mark already starts
      # the question's own dialog (the question is one sentence), so no extra mark
      # is needed: the question-line select hangs off sel-question with an offset
      # that starts it about as the question ends, its drag runs in silence, and
      # the answer at pause-question waits for it (the scheduler holds only the
      # dialog after its anchor's). A select with no offset would drag under the
      # question and leave no pause. The question is a long
      # dialog (117 characters, no ၊ to split at), so the quiet depends on the
      # voice's speed: 8200 leaves about 2.8 / 1.1 / 0.35 s before the answer at
      # 55 / 70 / 95 ms per char (at 95 the drag starts under the question's last
      # words, as in lesson 7); 8250 trips compile-check's 2.5 s inserted-silence
      # warning at 55.
      - id: select-question
        type: editor.select
        at: { mark: sel-question, offsetMs: 8200 }
