# Rust from zero, lesson 1: your first program. A whiteboard shows what
# happens between writing Rust and running it (the compiler checks the whole
# file first); then fn main, println! and why it's a macro, the semicolon, a
# comment, and the two kinds of placeholder ({} and {name}) are built live.
# A second board shows two real compiler errors (E0423 for a missing `!`, and
# the format-string argument count check), and one run ends the lesson.
#
# Every error quoted on the board or in the narration was confirmed with
# `rustc --edition 2024` (rustc 1.98); the fixture is the final program's
# exact stdout. Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/rust-hello.yaml
#
# Narration says "print line" for println and "f n" for fn: the voice has no
# lexicon entry for either token and would try to read them as words.
schemaVersion: 1

lesson:
  slug: rust-hello
  title: "Rust from zero: ပထမဆုံး program"
  locale: my-MM
  workspace:
    lessonType: rust
    name: Rust Lesson
    entryFilePath: main.rs
    files:
      main.rs: |
        fn main() {
        }
  whiteboardAssets:
    # Board 1 — how a Rust program goes from source to output.
    # blue = the code you write, orange = the compiler (it changes code into a
    # program), red = the error path, green = the program that works,
    # violet = the result it prints.
    - id: h-title
      kind: text
      x: 280
      y: 160
      width: 600
      height: 48
      text: "Rust က code ကို ဘယ်လို run လဲ"
      strokeColor: "#1e1e1e"
      fontSize: 38
    - id: h-src-box
