build:
  voiceProfile: pocket-alba-v1
  seed: 101

runtime:
  kind: rust-playground
  defaultMode: fixture
  # One run at the very end: keep the empty dock shut until there's output.
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    result:
      status: success
      stdout: "Hello, world!\n2 + 3 = 5\nHello, Ferris!\n"
      stderr: ""

scenes:
  - id: big-picture
    chapter: From code to a running program
    narration: >
      [[mark:board]] Welcome to Rust from zero. Let's write your first Rust
      program, and see what happens between writing it and running it.
      [[mark:draw-source]] First, you write your code in a source file.
      [[mark:draw-compiler]] Then the Rust compiler reads the whole file, and
      checks it before anything runs. [[mark:draw-error]] If it finds a
      mistake, it stops and shows you an error. Nothing runs.
      [[mark:draw-program]] If the code is fine, the compiler builds a
      program, and that program prints your output. [[mark:draw-rule]] So a
      lot of mistakes are caught before your program ever starts. In
      languages like Python or JavaScript, many mistakes only show up while
      the program is running. Think of the compiler as a helper that reads
      your code first.
    sources:
      - title: "The Rust Book — Compiling and Running Are Separate Steps"
        url: "https://doc.rust-lang.org/book/ch01-02-hello-world.html#compiling-and-running-are-separate-steps"
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { mark: board }
        open: true
        upsertIds: [h-title]
      - id: draw-source
        type: whiteboard.apply
        at: { mark: draw-source }
        upsertIds: [h-src-box, h-src-t, h-src-l]
        drawMs: 1200
      - id: draw-compiler
        type: whiteboard.apply
        at: { mark: draw-compiler }
        upsertIds: [h-arr-1, h-cmp-box, h-cmp-t, h-cmp-l]
        drawMs: 1600
      - id: draw-error
        type: whiteboard.apply
        at: { mark: draw-error }
        upsertIds: [h-arr-err, h-err-t]
        drawMs: 1300
      - id: draw-program
        type: whiteboard.apply
        at: { mark: draw-program }
        upsertIds: [h-arr-2, h-prog-box, h-prog-t, h-arr-out, h-out-t]
        drawMs: 2000
      - id: draw-rule
        type: whiteboard.apply
        at: { mark: draw-rule }
        upsertIds: [h-rule]
        drawMs: 1000

  - id: main-fn
    chapter: Your first lines of Rust
    narration: >
      Now let's write it. [[mark:open-main]] Here's our file, with one empty
      function. [[mark:select-main]] f n is short for function, and this
      function is called main. main is special. It's where every Rust program
      starts running. Its body goes between the curly braces, and right now
      it's empty. [[mark:type-hello]] Let's give it something to do. Print
      line prints some text, then moves to a new line. We'll print the classic
      first message: Hello, world. [[mark:select-macro]] See the exclamation
      mark after print line? It tells you that print line isn't a normal
      function. It's a macro. A macro is code that writes more code for you,
      while your program compiles. Why does that matter? A normal Rust
      function always takes the same number of values. A macro can take any
      number, and print line checks them before anything runs.
      [[mark:select-semi]] And the line ends with a semicolon. In Rust, a
      semicolon ends a statement, one step of your program. If you forget it
      and another line follows, the compiler stops and tells you it expected a
      semicolon.
    sources:
      - title: "The Rust Book — Anatomy of a Rust Program"
        url: "https://doc.rust-lang.org/book/ch01-02-hello-world.html#anatomy-of-a-rust-program"
      - title: "The Rust Book — Macros"
        url: "https://doc.rust-lang.org/book/ch20-05-macros.html"
      - title: "std::println"
        url: "https://doc.rust-lang.org/std/macro.println.html"
    actions:
      - id: close-board-1
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: main.rs
      - id: select-main
        type: editor.select
        at: { mark: select-main }
        target:
          file: main.rs
          text: "fn main()"
          occurrence: 1
      - id: type-hello
        type: editor.type
        at: { mark: type-hello, offsetMs: -300 }
        target:
          file: main.rs
          after: "fn main() {\n"
          occurrence: 1
        text: "    println!(\"Hello, world!\");\n"
      - id: select-macro
        type: editor.select
        at: { mark: select-macro }
        target:
          file: main.rs
          text: "println!"
          occurrence: 1
      - id: select-semi
        type: editor.select
        at: { mark: select-semi }
        target:
          file: main.rs
          text: ";"
          occurrence: 1

  - id: comment
    narration: >
      [[mark:type-comment]] Now let's add a note at the top of the file. Two
      slashes start a comment. The compiler ignores everything after them, up
      to the end of the line, so a comment is only for the people who read
      your code. Use it to explain things a reader might not know yet, like
      where a Rust program starts.
    sources:
      - title: "The Rust Book — Comments"
        url: "https://doc.rust-lang.org/book/ch03-04-comments.html"
      - title: "Rust by Example — Comments"
        url: "https://doc.rust-lang.org/rust-by-example/hello/comment.html"
    actions:
      - id: type-comment
        type: editor.type
        at: { mark: type-comment, offsetMs: -300 }
        target:
          file: main.rs
          after: ""
          occurrence: 1
        text: "// Every Rust program starts at main.\n"

  - id: placeholders
    chapter: "Placeholders: printing values"
    narration: >
      [[mark:type-sum]] Fixed text is a good start. But most of the time,
      you'll want to print values that your program calculates. Let's print a
      small sum. [[mark:select-braces]] These curly braces are a placeholder.
      Print line fills it with the first value after the text. Here, the
      program adds two plus three, and five goes where the braces are. Add
      more braces, and the values fill them in order.
      [[mark:type-name]] There's a shorter way, too, when a value has a name.
      Let's give a value a name with let. You'll learn let properly in the
      next lesson. [[mark:select-name]] Now you can write that name right
      inside the braces, and print line fills in its value. You can't put a
      calculation there, though. For that, use empty braces and pass the value
      after the text.
    sources:
      - title: "std::fmt — Positional parameters"
        url: "https://doc.rust-lang.org/std/fmt/index.html#positional-parameters"
      - title: "std::fmt — Named parameters"
        url: "https://doc.rust-lang.org/std/fmt/index.html#named-parameters"
      - title: "Rust by Example — Formatted print"
        url: "https://doc.rust-lang.org/rust-by-example/hello/print.html"
    actions:
      - id: type-sum
        type: editor.type
        at: { mark: type-sum, offsetMs: -300 }
        target:
          file: main.rs
          after: "    println!(\"Hello, world!\");\n"
          occurrence: 1
        cadence: fast-explainer
        text: "    println!(\"2 + 3 = {}\", 2 + 3);\n"
      - id: select-braces
        type: editor.select
        at: { mark: select-braces }
        target:
          file: main.rs
          text: "{}"
          occurrence: 1
      - id: type-name
        type: editor.type
        at: { mark: type-name }
        target:
          file: main.rs
          after: "    println!(\"2 + 3 = {}\", 2 + 3);\n"
          occurrence: 1
        cadence: line-by-line
        text: "    let name = \"Ferris\";\n    println!(\"Hello, {name}!\");\n"
      - id: select-name
        type: editor.select
        at: { mark: select-name }
        target:
          file: main.rs
          text: "{name}"
          occurrence: 1

  - id: compiler-errors
    chapter: When the compiler says no
    narration: >
      [[mark:board-errors]] So what happens when you get something wrong?
      [[mark:draw-nobang]] Say you forget the exclamation mark.
      [[mark:draw-e0423]] The compiler stops with error E0423: expected
      function, found macro. [[mark:draw-help]] And look at the help line. It
      tells you the fix: use the exclamation mark. [[mark:draw-args]] Here's
      another one: two placeholders, but only one value.
      [[mark:draw-args-error]] Because print line is a macro, the compiler
      checks this too. Two positional arguments in the format string, but
      there's only one argument. [[mark:draw-note]] Neither program runs until
      you fix it. So read these messages closely. They point at the exact
      spot, and they often tell you the fix.
    sources:
      - title: "Error code E0423"
        url: "https://doc.rust-lang.org/error_codes/E0423.html"
      - title: "std::fmt — a format string must use all of its arguments"
        url: "https://doc.rust-lang.org/std/fmt/index.html#positional-parameters"
    actions:
      - id: board-errors
        type: whiteboard.apply
        at: { mark: board-errors }
        open: true
        clear: true
        upsertIds: [e-title]
      - id: draw-nobang
        type: whiteboard.apply
        at: { mark: draw-nobang }
        upsertIds: [e-code1, e-mark1]
        drawMs: 1200
      - id: draw-e0423
        type: whiteboard.apply
        at: { mark: draw-e0423 }
        upsertIds: [e-err1]
        drawMs: 1500
      - id: draw-help
        type: whiteboard.apply
        at: { mark: draw-help }
        upsertIds: [e-help1]
        drawMs: 1100
      - id: draw-args
        type: whiteboard.apply
        at: { mark: draw-args }
        upsertIds: [e-code2, e-mark2]
        drawMs: 1200
      - id: draw-args-error
        type: whiteboard.apply
        at: { mark: draw-args-error }
        upsertIds: [e-err2a, e-err2b]
        drawMs: 1800
      - id: draw-note
        type: whiteboard.apply
        at: { mark: draw-note }
        upsertIds: [e-note]
        drawMs: 1000

  - id: run
    narration: >
      Back in the editor, our program is correct. [[mark:run]] Let's run it.
      Three lines. Hello, world. Then two plus three equals five. And Hello,
      Ferris, with the name filled into the braces.
    sources:
      - title: "Rust by Example — Hello World"
        url: "https://doc.rust-lang.org/rust-by-example/hello.html"
    actions:
      - id: close-board-2
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "Hello, Ferris!"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: 'let name = "Ferris";'

  - id: wrap
    narration: >
      So, your program starts at main, and print line is a macro that fills
      its placeholders with values. And the compiler checks the whole file
      before anything runs. Next, we'll look at variables: how let works, and
      why a Rust variable can't change unless you allow it.
    sources:
      - title: "The Rust Book — Hello, World!"
        url: "https://doc.rust-lang.org/book/ch01-02-hello-world.html"
      - title: "The Rust Book — Variables and Mutability"
        url: "https://doc.rust-lang.org/book/ch03-01-variables-and-mutability.html"
    actions: []

checks:
  - { type: timing.p95Ms, max: 300 }
