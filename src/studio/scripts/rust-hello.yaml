      width: 200
      height: 100
      strokeColor: "#1971c2"
    - id: h-src-t
      kind: text
      x: 322
      y: 280
      width: 140
      height: 40
      text: "main.rs"
      strokeColor: "#1e1e1e"
      fontSize: 30
    - id: h-src-l
      kind: text
      x: 290
      y: 366
      width: 200
      height: 36
      text: "ကိုယ် ရေးတယ်"
      strokeColor: "#1971c2"
      fontSize: 28
    - id: h-arr-1
      kind: freedraw
      stroke: arrow-right
      x: 482
