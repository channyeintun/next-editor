build:
  voiceProfile:
    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 101

runtime:
  kind: rust-playground
  defaultMode: fixture
  # One run at the very end: keep the empty dock shut until there's output.
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    result:
      status: success
      stdout: "Hello, world!

        2 + 3 = 5

        Hello, Ferris!\n"
      stderr: ""

scenes:
  - id: big-picture
    chapter: Code ကနေ program အထိ
    narration: >-
      [[mark:board]] မင်္ဂလာပါ ခင်ဗျာ။ Rust from zero course ကို ကြိုဆိုပါတယ်။ ဒီ lesson မှာ
      ကိုယ့်ရဲ့ ပထမဆုံး Rust program ကို ရေးကြည့်မှာ ဖြစ်ပြီး၊ code ရေးပြီးတဲ့အချိန်ကနေ run
      တဲ့အချိန်အထိ ကြားထဲမှာ ဘာတွေ ဖြစ်သွားလဲ ဆိုတာကိုပါ ကြည့်သွားပါမယ်။ [[mark:draw-source]]
      အရင်ဆုံး ကိုယ်က code ကို source file တစ်ခုထဲမှာ ရေးပါတယ်။ [[mark:draw-compiler]] ပြီးတော့ Rust
      compiler က အဲဒီ ဖိုင် တစ်ဖိုင်လုံးကို ဖတ်ပြီး၊ ဘာမှ run မလုပ်ခင် အကုန် စစ်ပါတယ်။
      [[mark:draw-error]] စစ်ရင်းနဲ့ အမှား တစ်ခုခု တွေ့သွားရင်၊ compiler က အဲဒီမှာ ရပ်ပြီး error
      ပြပါတယ်။ အဲဒီအခါ ဘာမှ run မဖြစ်ပါဘူး။ [[mark:draw-program]] code မှာ ပြဿနာ မရှိဘူးဆိုရင်တော့၊
      compiler က program တစ်ခု တည်ဆောက်ပေးပြီး၊ အဲဒီ program က ကိုယ့် output ကို print ထုတ်ပေးပါတယ်။
      [[mark:draw-rule]] ဆိုတော့ အမှား အများကြီးကို program စတောင် မစခင်မှာ ဖမ်းမိသွားတာပါ။ Python
      တို့ JavaScript တို့လို ဘာသာစကားတွေမှာဆိုရင်၊ အမှား အတော်များများက program run နေတဲ့အချိန်ကျမှ
      ပေါ်လာတတ်ပါတယ်။ ဒါကြောင့် compiler ဆိုတာ ကိုယ့် code ကို အရင် ဖတ်ပြီး စစ်ပေးတဲ့ လက်ထောက်
      တစ်ယောက်လို သဘောထားလို့ ရပါတယ်။
    sources:
      - title: "The Rust Book — Compiling and Running Are Separate Steps"
        url:
          "https://doc.rust-lang.org/book/ch01-02-hello-world.html#compiling-and-running-are-separate-st\
          eps"
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { mark: board }
        open: true
        upsertIds: [h-title]
      - id: draw-source
        type: whiteboard.apply
        at: { mark: draw-source }
        upsertIds: [h-src-box, h-src-t, h-src-l]
        drawMs: 1200
      - id: draw-compiler
        type: whiteboard.apply
        at: { mark: draw-compiler }
        upsertIds: [h-arr-1, h-cmp-box, h-cmp-t, h-cmp-l]
        drawMs: 1600
      - id: draw-error
        type: whiteboard.apply
        at: { mark: draw-error }
        upsertIds: [h-arr-err, h-err-t]
        drawMs: 1300
      - id: draw-program
        type: whiteboard.apply
        at: { mark: draw-program }
        upsertIds: [h-arr-2, h-prog-box, h-prog-t, h-arr-out, h-out-t]
        drawMs: 2000
      - id: draw-rule
        type: whiteboard.apply
        at: { mark: draw-rule }
        upsertIds: [h-rule]
        drawMs: 1000

  - id: main-fn
    chapter: ပထမဆုံး Rust စာကြောင်းတွေ
    narration: >-
      ကဲ၊ အခု ရေးကြည့်ရအောင်။ [[mark:open-main]] ဒီမှာ ကိုယ့် ဖိုင် ရှိပါတယ်။ သူ့ထဲမှာ function
      အလွတ် တစ်ခုပဲ ပါပါသေးတယ်။ [[mark:select-main]] f n ဆိုတာ function ရဲ့ အတိုကောက်ပါ။ ဒီ function
      ကိုတော့ main လို့ နာမည် ပေးထားပါတယ်။ main function က ထူးခြားပါတယ်။ Rust program တိုင်းဟာ main
      ကနေ စ run တာပါ။ function ရဲ့ body က တွန့်ကွင်းထဲမှာ ရှိပြီး၊ အခုတော့ အလွတ်ပဲ ရှိပါသေးတယ်။
      [[mark:type-hello]] ဒါဆို သူ့ကို အလုပ် တစ်ခု ပေးကြည့်ရအောင်။ println က စာသားကို print ထုတ်ပြီး
      နောက်တစ်ကြောင်း ဆင်းပေးပါတယ်။ ပထမဆုံး program တိုင်းလိုလို ရေးလေ့ရှိတဲ့ Hello, world ဆိုတဲ့
      စာသားကို print ထုတ်ကြည့်ပါမယ်။ [[mark:select-macro]] println နောက်က exclamation mark ကို
      သတိထား ကြည့်ပါ။ အဲဒါက println ဟာ သာမန် function မဟုတ်ဘဲ macro ဖြစ်တယ်လို့ ပြောတာပါ။ macro
      ဆိုတာ ကိုယ့် program ကို compile လုပ်နေချိန်မှာ ကိုယ့်အစား code ထပ်ရေးပေးတဲ့ code ပါ။ ဒါက
      ဘာကြောင့် အရေးကြီးလဲဆိုတော့၊ သာမန် Rust function တစ်ခုက လက်ခံတဲ့ တန်ဖိုး အရေအတွက်က အမြဲ
      ပုံသေပါ။ macro ကတော့ တန်ဖိုး ဘယ်နှစ်ခု ဖြစ်ဖြစ် လက်ခံနိုင်ပြီး၊ println က အဲဒီ တန်ဖိုးတွေကို
      ဘာမှ run မလုပ်ခင် စစ်ပေးပါတယ်။ [[mark:select-semi]] ပြီးတော့ စာကြောင်း အဆုံးမှာ semicolon
      ရှိပါတယ်။ Rust မှာ semicolon က statement တစ်ခု ပြီးသွားပြီ ဆိုတာကို ပြတာပါ။ statement ဆိုတာ
      ကိုယ့် program ရဲ့ အဆင့် တစ်ဆင့်ပါ။ semicolon ထည့်ဖို့ မေ့သွားပြီး သူ့နောက်မှာ စာကြောင်း
      တစ်ကြောင်း ထပ်ပါလာရင်၊ compiler က ရပ်ပြီး semicolon လိုနေတယ်လို့ ပြောပါလိမ့်မယ်။
    sources:
      - title: "The Rust Book — Anatomy of a Rust Program"
        url: "https://doc.rust-lang.org/book/ch01-02-hello-world.html#anatomy-of-a-rust-program"
      - title: "The Rust Book — Macros"
        url: "https://doc.rust-lang.org/book/ch20-05-macros.html"
      - title: "std::println"
        url: "https://doc.rust-lang.org/std/macro.println.html"
    actions:
      - id: close-board-1
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: main.rs
      - id: select-main
        type: editor.select
        at: { mark: select-main }
        target:
          file: main.rs
          text: "fn main()"
          occurrence: 1
      - id: type-hello
        type: editor.type
        at: { mark: type-hello, offsetMs: -300 }
        target:
          file: main.rs
          after: "fn main() {\n"
          occurrence: 1
        text: "    println!(\"Hello, world!\");\n"
      - id: select-macro
        type: editor.select
        at: { mark: select-macro }
        target:
          file: main.rs
          text: "println!"
          occurrence: 1
      - id: select-semi
        type: editor.select
        at: { mark: select-semi }
        target:
          file: main.rs
          text: ";"
          occurrence: 1

  - id: comment
    narration: >-
      [[mark:type-comment]] အခု ဖိုင်ရဲ့ ထိပ်ဆုံးမှာ မှတ်စု တစ်ကြောင်း ထည့်ကြည့်ရအောင်။ slash
      နှစ်ခုနဲ့ comment စပါတယ်။ slash နှစ်ခု နောက်ကနေ စာကြောင်း အဆုံးအထိ ရှိသမျှကို compiler က လုံးဝ
      ဂရုမစိုက်ပါဘူး။ ဒါကြောင့် comment ဆိုတာ code ကို ဖတ်မယ့် လူတွေအတွက်ပဲ ဖြစ်ပါတယ်။ ဖတ်တဲ့သူ
      မသိသေးနိုင်တဲ့ အချက်တွေ၊ ဥပမာအားဖြင့် Rust program က ဘယ်ကနေ စလဲ ဆိုတာမျိုးကို ရှင်းပြဖို့
      comment ကို သုံးပါ။
    sources:
      - title: "The Rust Book — Comments"
        url: "https://doc.rust-lang.org/book/ch03-04-comments.html"
      - title: "Rust by Example — Comments"
        url: "https://doc.rust-lang.org/rust-by-example/hello/comment.html"
    actions:
      - id: type-comment
        type: editor.type
        at: { mark: type-comment, offsetMs: -300 }
        target:
          file: main.rs
          after: ""
          occurrence: 1
        text: "// Every Rust program starts at main.\n"

  - id: placeholders
    chapter: "Placeholder: တန်ဖိုး print ထုတ်ခြင်း"
    narration: >-
      [[mark:type-sum]] ပုံသေ စာသား print ထုတ်တာက အစအနေနဲ့ ကောင်းပါတယ်။ ဒါပေမဲ့ အများအားဖြင့်တော့
      ကိုယ့် program က တွက်ထုတ်လိုက်တဲ့ တန်ဖိုးတွေကို print ထုတ်ချင်မှာပါ။ ပေါင်းလဒ် သေးသေးလေး တစ်ခု
      print ထုတ်ကြည့်ရအောင်။ [[mark:select-braces]] ဒီ တွန့်ကွင်း အလွတ်က placeholder ပါ။ စာသား
      နောက်က ပထမ တန်ဖိုးကို println က အဲဒီ နေရာမှာ ဖြည့်ပေးပါတယ်။ ဒီမှာ program က 2 ပေါင်း 3 ကို
      တွက်ပြီး၊ 5 ဆိုတဲ့ အဖြေက တွန့်ကွင်း နေရာမှာ ဝင်သွားပါတယ်။ တွန့်ကွင်း ထပ်ထည့်ရင်လည်း၊
      တန်ဖိုးတွေက အစဉ်လိုက် ဝင်သွားပါတယ်။ [[mark:type-name]] တန်ဖိုး တစ်ခုမှာ နာမည် ရှိတယ်ဆိုရင်
      ပိုတိုတဲ့ နည်းလည်း ရှိပါသေးတယ်။ let နဲ့ တန်ဖိုး တစ်ခုကို နာမည် ပေးကြည့်ရအောင်။ let
      အကြောင်းကိုတော့ နောက် lesson မှာ သေသေချာချာ လေ့လာရပါမယ်။ [[mark:select-name]] အခု အဲဒီ
      နာမည်ကို တွန့်ကွင်းထဲမှာ တန်းရေးလို့ ရပြီး၊ println က သူ့ တန်ဖိုးကို ဖြည့်ပေးပါတယ်။ ဒါပေမဲ့
      တွန့်ကွင်းထဲမှာ တွက်ချက်မှု တစ်ခုကိုတော့ ထည့်လို့ မရပါဘူး။ အဲဒါမျိုးအတွက်ဆိုရင် တွန့်ကွင်း
      အလွတ် သုံးပြီး၊ တန်ဖိုးကို စာသား နောက်မှာ ထည့်ပေးရပါတယ်။
    sources:
      - title: "std::fmt — Positional parameters"
        url: "https://doc.rust-lang.org/std/fmt/index.html#positional-parameters"
      - title: "std::fmt — Named parameters"
        url: "https://doc.rust-lang.org/std/fmt/index.html#named-parameters"
      - title: "Rust by Example — Formatted print"
        url: "https://doc.rust-lang.org/rust-by-example/hello/print.html"
    actions:
      - id: type-sum
        type: editor.type
        at: { mark: type-sum, offsetMs: -300 }
        target:
          file: main.rs
          after: "    println!(\"Hello, world!\");\n"
          occurrence: 1
        cadence: fast-explainer
        text: "    println!(\"2 + 3 = {}\", 2 + 3);\n"
      - id: select-braces
        type: editor.select
        at: { mark: select-braces }
        target:
          file: main.rs
          text: "{}"
          occurrence: 1
      - id: type-name
        type: editor.type
        at: { mark: type-name }
        target:
          file: main.rs
          after: "    println!(\"2 + 3 = {}\", 2 + 3);\n"
          occurrence: 1
        cadence: line-by-line
        text: "    let name = \"Ferris\";

          \    println!(\"Hello, {name}!\");\n"
      - id: select-name
        type: editor.select
        at: { mark: select-name }
        target:
          file: main.rs
          text: "{name}"
          occurrence: 1

  - id: compiler-errors
    chapter: Compiler က လက်မခံတဲ့အခါ
    narration: >-
      [[mark:board-errors]] ဒါဆို တစ်ခုခု မှားသွားရင် ဘာ ဖြစ်မလဲ ကြည့်ရအောင်။ [[mark:draw-nobang]]
      ဥပမာအားဖြင့် exclamation mark ထည့်ဖို့ မေ့သွားတယ် ဆိုပါစို့။ [[mark:draw-e0423]] compiler က
      E0423 error နဲ့ ရပ်သွားပါတယ်။ function တစ်ခု မျှော်လင့်ထားပေမယ့် macro တစ်ခု တွေ့သွားတယ်လို့
      ဆိုလိုတာပါ။ [[mark:draw-help]] ပြီးတော့ help စာကြောင်းကို ကြည့်ပါ။ ပြင်နည်းကို
      တန်းပြောထားပါတယ်၊ exclamation mark သုံးပါတဲ့။ [[mark:draw-args]] နောက်တစ်ခု ကြည့်ရအောင်။ ဒီမှာ
      placeholder နှစ်ခု ရှိပေမယ့်၊ တန်ဖိုးကတော့ တစ်ခုပဲ ပေးထားပါတယ်။ [[mark:draw-args-error]]
      println က macro ဖြစ်တဲ့အတွက်၊ compiler က ဒါကိုလည်း စစ်ပါတယ်။ format string ထဲမှာ positional
      argument နှစ်ခု ရှိပေမယ့်၊ argument က တစ်ခုပဲ ရှိတယ်လို့ ပြောတာပါ။ [[mark:draw-note]] ဒီ
      program နှစ်ခုလုံး ကိုယ် မပြင်မချင်း run မဖြစ်ပါဘူး။ ဒါကြောင့် ဒီလို error တွေ တက်လာရင်
      သေသေချာချာ ဖတ်ပါ။ သူတို့က မှားတဲ့ နေရာ အတိအကျကို ညွှန်ပြပြီး၊ အများအားဖြင့် ပြင်နည်းကိုပါ
      ပြောပြပါတယ်။
    sources:
      - title: "Error code E0423"
        url: "https://doc.rust-lang.org/error_codes/E0423.html"
      - title: "std::fmt — a format string must use all of its arguments"
        url: "https://doc.rust-lang.org/std/fmt/index.html#positional-parameters"
    actions:
      - id: board-errors
        type: whiteboard.apply
        at: { mark: board-errors }
        open: true
        clear: true
        upsertIds: [e-title]
      - id: draw-nobang
        type: whiteboard.apply
        at: { mark: draw-nobang }
        upsertIds: [e-code1, e-mark1]
        drawMs: 1200
      - id: draw-e0423
        type: whiteboard.apply
        at: { mark: draw-e0423 }
        upsertIds: [e-err1]
        drawMs: 1500
      - id: draw-help
        type: whiteboard.apply
        at: { mark: draw-help }
        upsertIds: [e-help1]
        drawMs: 1100
      - id: draw-args
        type: whiteboard.apply
        at: { mark: draw-args }
        upsertIds: [e-code2, e-mark2]
        drawMs: 1200
      - id: draw-args-error
        type: whiteboard.apply
        at: { mark: draw-args-error }
        upsertIds: [e-err2a, e-err2b]
        drawMs: 1800
      - id: draw-note
        type: whiteboard.apply
        at: { mark: draw-note }
        upsertIds: [e-note]
        drawMs: 1000

  - id: run
    narration: >-
      editor ထဲ ပြန်သွားရအောင်။ ကိုယ့် program မှာတော့ အမှား မရှိပါဘူး။ [[mark:run]] run
      ကြည့်ရအောင်။ စာကြောင်း သုံးကြောင်း ထွက်လာပါတယ်။ ပထမက Hello, world ပါ။ ပြီးတော့ 2 ပေါင်း 3 က 5
      ဖြစ်တယ် ဆိုတဲ့ စာကြောင်းပါ။ နောက်ဆုံးက Hello, Ferris ဖြစ်ပြီး၊ တွန့်ကွင်း နေရာမှာ နာမည်
      ဝင်သွားတာကို မြင်ရပါတယ်။
    sources:
      - title: "Rust by Example — Hello World"
        url: "https://doc.rust-lang.org/rust-by-example/hello.html"
    actions:
      - id: close-board-2
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "Hello, Ferris!"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: 'let name = "Ferris";'

  - id: wrap
    narration: >-
      ဒါဆို ပြန်ချုပ်ရရင်၊ ကိုယ့် program က main ကနေ စပါတယ်။ println က macro တစ်ခု ဖြစ်ပြီး၊ သူ့
      placeholder တွေကို တန်ဖိုးတွေနဲ့ ဖြည့်ပေးပါတယ်။ ပြီးတော့ compiler က ဘာမှ run မလုပ်ခင် ဖိုင်
      တစ်ဖိုင်လုံးကို စစ်ပါတယ်။ နောက် lesson မှာတော့ variable နဲ့ mutability ကို ကြည့်သွားပါမယ်။ let
      က ဘယ်လို အလုပ်လုပ်လဲ၊ ပြီးတော့ Rust variable တစ်ခုကို ကိုယ်က ခွင့်မပြုမချင်း ဘာကြောင့်
      ပြောင်းလို့ မရလဲ ဆိုတာတွေပါ။
    sources:
      - title: "The Rust Book — Hello, World!"
        url: "https://doc.rust-lang.org/book/ch01-02-hello-world.html"
      - title: "The Rust Book — Variables and Mutability"
        url: "https://doc.rust-lang.org/book/ch03-01-variables-and-mutability.html"
    actions: []

checks:
  - { type: timing.p95Ms, max: 300 }
