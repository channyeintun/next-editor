  slug: rust-hello
  title: "Rust from zero: Your first program"
  locale: en-US
  workspace:
    lessonType: rust
    name: Rust Lesson
    entryFilePath: main.rs
    files:
      main.rs: |
        fn main() {
        }
  whiteboardAssets:
    # Board 1 — how a Rust program goes from source to output.
    # blue = the code you write, orange = the compiler (it changes code into a
