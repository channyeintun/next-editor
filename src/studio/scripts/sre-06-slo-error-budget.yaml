    files:
      notes.md: |
        # SLO နဲ့ error budget

        - SLI — valid ဖြစ်တာထဲက ကောင်းတာ %
        - SLO — SLI အတွက် ပစ်မှတ် + window
        - SLA — မမီရင် လျော်ရတဲ့ customer ကတိ
        - error budget — SLO ခွင့်ပြုထားတဲ့ ပျက်ခွင့်
        - burn rate — budget ကို ခွင့်ပြုနှုန်းထက် ဘယ်နှဆ မြန်မြန် သုံးနေလဲ
        - budget policy — budget နည်းရင်၊ ကုန်ရင် ဘာလုပ်မလဲ ကြိုရေးထားတဲ့ စည်းမျဉ်း

        မေးခွန်း: budget က တစ်လကို fail ဖြစ်ခွင့် top-up 10,000။ မနေ့က 1,000 fail ဖြစ်ခဲ့ရင် မနေ့ရဲ့ burn rate ဘယ်လောက်လဲ?
