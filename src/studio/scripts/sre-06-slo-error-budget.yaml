# SRE from zero, lesson 06: SLOs and error budgets (Burmese concept lesson).
#
# Built from the approved voice script
# docs/sre-course/voice-scripts/sre-06-slo-error-budget.md. Every spoken
# character is that script's "> " lines, unchanged; each ⟪…⟫ marker became a
# [[mark:…]] at the same place. Check it with:
#   bun ~/Documents/sre-course/work/check-narration.ts \
#     docs/sre-course/voice-scripts/sre-06-slo-error-budget.md \
#     src/studio/scripts/sre-06-slo-error-budget.yaml
#
# Nothing runs: deck pages and the whiteboard carry the lesson, and notes.md is
# the recap. The workspace and runtime follow the validated no-code skeleton
# (WebContainer, empty init command, a harmless dev script).
#
# Four marks were added at existing sentence ends; they add no spoken text:
# b1-s1b and b2-s4b split a board step so no step adds more than three
# labelled elements (B1's four-box flow, B2's stacked bar), burn-rate-named
# only splits the burn-rate page's 463-character dialog in two (no action),
# and ask-question (recap) carries the question-line select that makes the
# ⟪pause 3s⟫ real silence. No page or board step holds longer than ~34 s at
# 70 ms/char, so no pacing pages were needed.
#
# Boards (P1 flow then P5 bars, P5 bars, P3 ring). Colour jobs: #1e1e1e ink
# (paints white) for titles, arrows, axes and notes; violet the request flow
# and the result; blue the thing named and the main data series; green
# healthy; red failure or budget spent; orange the threshold, and the
# orange bar and segment the voice script asks for. A label on two lines is
# two text assets, one per line: the overflow rule counts a whole text's
# length, so one "\n" label would need the width of both lines.
#
# Deck pages: deck "Next Editor · SRE 2 · Agree and notice". The /pub URL
# below is a placeholder until Chan publishes the deck; the Director's
# unreachable-deck warning is expected until then. Page plan:
# ~/Documents/sre-course/work/pages/sre-06-slo-error-budget.json
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/sre-06-slo-error-budget.yaml
#   bun scripts/studio-compile-check.ts src/studio/scripts/sre-06-slo-error-budget.yaml
