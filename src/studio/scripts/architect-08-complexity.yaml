build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 8108

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: need
    chapter: စာကြောင်း သုံးကြောင်းကြောင့် ပျက်သွားတဲ့ SMS
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ အတူ ပြောင်းတတ်တဲ့ code ကို စုထားတဲ့ အပိုင်း၊ module တစ်ခုကို ဘာကို ဖုံးထားလဲ၊
      ဘယ်သူတွေ မှီခိုနေလဲ ဆိုတာနဲ့ အကဲဖြတ်တာကို လေ့လာခဲ့ပါတယ်။
      [[mark:n-price]] ပြီးခဲ့တဲ့ အပတ်က team ထဲက developer မောင်မောင် က အပြောင်းအလဲ သေးသေးလေး တစ်ခု
      လုပ်ခဲ့ပါတယ်။ app ထဲမှာ ပြတဲ့ ဈေးနှုန်းတွေကို ဖတ်ရ လွယ်အောင် ကော်မာ ခံပြီး၊ နောက်မှာ ကျပ် ဆိုတဲ့
      စာလုံး ထည့်ပေးလိုက်တာပါ။ ပြင်ရတာက function တစ်ခုတည်း၊ စာကြောင်း သုံးကြောင်းပါ။
      [[mark:n-sms]] နောက်တစ်နေ့ မနက်မှာ ကားဂိတ်တွေကနေ ဖုန်းတွေ ဝင်လာပါတယ်။ ခရီးသည်တွေဆီ ရောက်တဲ့ SMS ထဲမှာ
      လက်မှတ် နံပါတ်က တစ်ဝက်ပဲ ပါတော့တာပါ။ SMS စာသား စီတဲ့ code က အဲဒီ ဈေးနှုန်း function ကိုပဲ ယူသုံးထားပြီး၊
      စာသား ရှည်လွန်းရင် အဆုံးပိုင်းကို ဖြတ်ပစ်ထားတာ ဖြစ်နေပါတယ်။ ဈေးနှုန်း စာသား ရှည်လာတော့ အဆုံးမှာ ရှိတဲ့
      လက်မှတ် နံပါတ်က ပြတ်ကျန်ခဲ့တာပါ။
      [[mark:n-who]] မောင်မောင် ပေါ့ဆလို့ ဖြစ်တာ မဟုတ်ပါဘူး။ ဒီ နှစ်ခု ဆက်နေတယ် ဆိုတာကို team ထဲက ဘယ်သူမှ
      ကြိုမသိနိုင်ခဲ့တာပါ။ တကယ့် ပြဿနာက အဲဒါပါပဲ။
      [[mark:n-def]] ပြင်လိုက်ရင် ဘာဖြစ်မလဲ ဆိုတာ ကြိုမှန်းလို့ မရတော့တဲ့ အခြေအနေကို complexity လို့
      ခေါ်ပါတယ်။ complexity က ဘယ်က လာတာလဲ၊ အဲဒီလို အခြေအနေမှာ ဘယ်လို ဆုံးဖြတ်ရမလဲ ဆိုတာ ဒီနေ့ ကြည့်ကြရအောင်။
    sources:
      - {
          title: "Balancing Coupling in Software Design (Khononov)",
          url: "https://www.informit.com/store/balancing-coupling-in-software-design-universal-design-9780137353484",
        }
    actions:
      - {
          id: draw-n-price,
          type: whiteboard.apply,
          at: { mark: n-price },
          open: true,
          upsertIds: [n-p, n-p-l1, n-p-l2],
          drawMs: 1500,
        }
      - {
          id: draw-n-sms,
          type: whiteboard.apply,
          at: { mark: n-sms },
          upsertIds: [n-arrow, n-s, n-s-l1, n-s-l2],
          drawMs: 2000,
        }
      - {
          id: draw-n-ask,
          type: whiteboard.apply,
          at: { mark: n-who },
          upsertIds: [n-ask],
          drawMs: 1000,
        }
      - {
          id: draw-n-def,
          type: whiteboard.apply,
          at: { mark: n-def },
          upsertIds: [n-def],
          drawMs: 1000,
        }

  - id: four-situations
    chapter: အခြေအနေ လေးမျိုး
    narration: >
      [[mark:f-open]] ဆုံးဖြတ်စရာ တစ်ခု ကြုံတိုင်း အရင်ဆုံး မေးသင့်တာက၊ ဒါကို လုပ်လိုက်ရင် ဘာဖြစ်မလဲ ဆိုတာ
      ဘယ်လောက် ကြိုသိနိုင်လဲ ဆိုတာပါ။ အဲဒီ အဖြေပေါ် မူတည်ပြီး အခြေအနေကို လေးမျိုး ခွဲကြည့်လို့ ရပါတယ်။ ဒီ
      ခွဲပုံကို Cynefin framework လို့ ခေါ်ပါတယ်။
      [[mark:f-clear]] ပထမ အခြေအနေက clear ပါ။ လုပ်လိုက်ရင် ဘာဖြစ်မလဲ ဆိုတာ လူတိုင်း သိနေတဲ့ အခြေအနေပါ။
      ခရီးဖော် မှာ ကားလိုင်း အသစ် တစ်ခု ထည့်တာက အဲဒီလိုပါ။ အကြိမ် လေးဆယ် လုပ်ဖူးပြီးသားမို့ အဆင့်တွေက
      ရှိပြီးသားပါ။ ဒီလို အခြေအနေမှာ အကြာကြီး စဉ်းစားနေစရာ မလိုဘဲ၊ ရှိပြီးသား စည်းမျဉ်းအတိုင်း လုပ်လိုက်ရုံပါပဲ။
      [[mark:f-complicated]] ဒုတိယက complicated ပါ။ အဖြေကို ကိုယ်တိုင် မသိပေမဲ့၊ ကျွမ်းကျင်သူ တစ်ယောက်က
      လေ့လာကြည့်ရင် ပြောပြနိုင်တဲ့ အခြေအနေပါ။ ခရီးစဉ် ရှာတဲ့ query နှေးနေတာက ဥပမာ တစ်ခုပါ။ database ကို
      ကောင်းကောင်း သိတဲ့သူက ခွဲခြမ်းကြည့်ပြီး ဘာလုပ်ရမလဲ ပြောနိုင်ပါတယ်။ ဆိုတော့ ဒီမှာ လုပ်ရမှာက သိတဲ့သူကို
      မေးတာ၊ ဒါမှမဟုတ် ကိုယ်တိုင် အချိန်ယူပြီး လေ့လာတာပါ။
      [[mark:f-complex]] တတိယက complex ပါ။ ဘယ်လောက် ကျွမ်းကျင်တဲ့သူမှ အဖြေကို ကြိုမပြောနိုင်ဘဲ၊
      လုပ်ကြည့်ပြီးမှသာ သိရတဲ့ အခြေအနေပါ။ ဈေးနှုန်း function ကို ပြင်ရင် ဘာတွေ ပျက်မလဲ ဆိုတာက ဒီထဲမှာ
      ပါပါတယ်။ ဒီလို အခြေအနေမှာ ထိုင်စဉ်းစားနေရုံနဲ့ အဖြေ မထွက်ပါဘူး။ သေးသေးလေး၊ ပြန်ဖျက်လို့ ရတဲ့
      စမ်းသပ်မှု တစ်ခု လုပ်ပြီး၊ ဘာဖြစ်လာလဲ တိုင်းကြည့်ရပါတယ်။
      [[mark:f-chaotic]] စတုတ္ထက chaotic ပါ။ ဘာက ဘာကြောင့် ဖြစ်နေမှန်း မသိသလို၊ စမ်းသပ်နေဖို့ အချိန်လည်း
      မရှိတဲ့ အခြေအနေပါ။ သင်္ကြန် လက်မှတ် ဖွင့်ရောင်းတဲ့ မနက်က ဒီလိုပါပဲ။ အဲဒီအချိန်မှာ အကြောင်းရင်းကို
      ထိုင်ရှာနေလို့ မရပါဘူး။ ထိခိုက်မှု ဆက်မတိုးအောင် တစ်ခုခုကို အရင် လုပ်ရပါတယ်။ ဥပမာ ကောင်တာက ရောင်းတာကို
      ခဏ ရပ်ထားလိုက်တာမျိုးပါ။ အခြေအနေ ငြိမ်သွားမှ ဘာဖြစ်ခဲ့လဲ ဆိုတာကို ပြန်ကြည့်ရပါတယ်။
      [[mark:f-mistake]] အဖြစ်များတဲ့ အမှားကတော့ အခြေအနေကို မှားပြီး ခွဲမိတာပါ။ ဈေးနှုန်း ပြင်တာကို team က
      clear လို့ ထင်ပြီး တန်းလုပ်လိုက်ပေမဲ့၊ တကယ်တော့ complex ဖြစ်နေခဲ့တာပါ။
    sources:
      - {
          title: "Balancing Coupling in Software Design (Khononov)",
          url: "https://www.informit.com/store/balancing-coupling-in-software-design-universal-design-9780137353484",
        }
      - {
          title: "Cynefin framework (Wikipedia)",
          url: "https://en.wikipedia.org/wiki/Cynefin_framework",
        }
    actions:
      - {
          id: draw-a-open,
          type: whiteboard.apply,
          at: { mark: f-open },
          clear: true,
          upsertIds: [a-title],
          drawMs: 900,
        }
      - {
          id: draw-a-clear,
          type: whiteboard.apply,
          at: { mark: f-clear },
          upsertIds: [a-c1, a-c1-t, a-c1-v],
          drawMs: 1500,
        }
      - {
          id: draw-a-complicated,
          type: whiteboard.apply,
          at: { mark: f-complicated },
          upsertIds: [a-c2, a-c2-t, a-c2-v],
          drawMs: 1500,
        }
      - {
          id: draw-a-complex,
          type: whiteboard.apply,
          at: { mark: f-complex },
          upsertIds: [a-c3, a-c3-t, a-c3-v],
          drawMs: 1500,
        }
      - {
          id: draw-a-chaotic,
          type: whiteboard.apply,
          at: { mark: f-chaotic },
          upsertIds: [a-c4, a-c4-t, a-c4-v],
          drawMs: 1500,
        }
      - {
          id: point-a-complex,
          type: whiteboard.point,
          at: { mark: f-mistake },
          target: { assetId: a-c3 },
        }

  - id: interactions
    chapter: အရေအတွက် မဟုတ်၊ ဆက်သွယ်ပုံ
    narration: >
      [[mark:i-open]] ဒါဆို code ထဲမှာ complex ဖြစ်တဲ့ အခြေအနေက ဘယ်က ပေါ်လာတာလဲ။ လူအများစုကတော့ code
      များလာလို့၊ အပိုင်းတွေ များလာလို့လို့ ထင်ကြပါတယ်။
      [[mark:i-line]] ဒါပေမဲ့ လက်မှတ် ဝယ်တဲ့ လမ်းကြောင်းကို ကြည့်ပါ။ ခရီးစဉ် ရှာတာကနေ SMS ပို့တာအထိ အဆင့်
      ခုနစ်ဆင့် ရှိပေမဲ့၊ တစ်ဆင့်ပြီးမှ တစ်ဆင့် ဆက်သွားတာပါ။
      [[mark:i-line-2]] အဆင့် တစ်ခုကို ပြင်ရင် သူ့နောက်က အဆင့်ကိုပဲ ကြည့်ရတော့၊ အပိုင်း များပေမဲ့ ဘာဖြစ်မလဲ
      ဆိုတာ ကြိုသိနိုင်ပါတယ်။
      [[mark:i-tangle]] အခု အပိုင်း ငါးခုပဲ ရှိတဲ့ ပုံကို ကြည့်ပါ။
      [[mark:i-tangle-2]] တစ်ခုက နောက်တစ်ခုကို ခေါ်တယ်၊ အဲဒီ တစ်ခုက တခြား နှစ်ခုကို ပြန်ခေါ်တယ်၊ တချို့က data
      တစ်ခုတည်းကို ဝိုင်းပြင်ကြတယ်။ အရေအတွက်က နည်းပေမဲ့ တစ်ခုကို ထိလိုက်ရင် ဘယ်နှခု လှုပ်မလဲ မပြောနိုင်တော့ပါဘူး။
      ဈေးနှုန်း code နဲ့ SMS code လိုပဲ၊ ဆက်နေမယ်လို့ ဘယ်သူမှ မထင်ထားတဲ့ နှစ်ခုက ဆက်နေတာမျိုးပါ။
      [[mark:i-where]] ဆိုလိုတာက complexity က အပိုင်းတွေရဲ့ အရေအတွက်ထဲမှာ မရှိဘဲ၊ အပိုင်းတွေ အချင်းချင်း
      ဆက်သွယ်ပုံထဲမှာ ရှိတာပါ။
      [[mark:i-tiny]] ဒါကြောင့် module တွေကို သေးသေးလေးတွေ ဖြစ်အောင် ခွဲလိုက်ရုံနဲ့ complexity မလျော့ပါဘူး။
      module တစ်ခုချင်းကတော့ ဖတ်ရ လွယ်သွားပါတယ်။ ဒါပေမဲ့ အရင်က module တစ်ခုထဲမှာ ရှိခဲ့တဲ့ ရှုပ်ထွေးမှုက module
      တွေ ကြားက မြားတွေဆီကို ရွှေ့သွားတာပဲ ရှိပါတယ်။ အထဲမှာ ရှုပ်တာထက် အကြားမှာ ရှုပ်တာက မြင်ရ ပိုခက်ပါသေးတယ်။
    sources:
      - {
          title: "Balancing Coupling in Software Design (Khononov)",
          url: "https://www.informit.com/store/balancing-coupling-in-software-design-universal-design-9780137353484",
        }
    actions:
      - {
          id: draw-b-open,
          type: whiteboard.apply,
          at: { mark: i-open },
          clear: true,
          upsertIds: [b-title],
          drawMs: 900,
        }
      - {
          id: draw-line,
          type: whiteboard.apply,
          at: { mark: i-line },
          upsertIds: [l-1, l-2, l-3, l-4, l-5, l-6, l-7, l-arrow],
          drawMs: 3200,
        }
      - {
          id: draw-line-cap,
          type: whiteboard.apply,
          at: { mark: i-line-2 },
          upsertIds: [l-cap1, l-cap2],
          drawMs: 1600,
        }
      - {
          id: draw-tangle-nodes,
          type: whiteboard.apply,
          at: { mark: i-tangle },
          clear: true,
          upsertIds: [t-1, t-2, t-3, t-4, t-5],
          drawMs: 1800,
        }
      - {
          id: draw-tangle-arrows,
          type: whiteboard.apply,
          at: { mark: i-tangle-2 },
          upsertIds: [t-a1, t-a2, t-a3, t-a4, t-a5, t-a6, t-a7],
          drawMs: 3000,
        }
      - {
          id: draw-tangle-cap,
          type: whiteboard.apply,
          at: { mark: i-where },
          upsertIds: [t-cap],
          drawMs: 1000,
        }

  - id: growth
    chapter: ကြီးလာလေ ဆက်စရာ များလေ
    narration: >
      [[mark:g-open]] system ကြီးလာတဲ့အခါ ဒီ ပြဿနာက ပိုဆိုးလာပါတယ်။ ဂဏန်းလေး တွက်ကြည့်ရအောင်။
      [[mark:g-5]] module ငါးခု ရှိရင် အချင်းချင်း ဆက်နိုင်တဲ့ အတွဲက ၁၀ တွဲ ရှိပါတယ်။
      [[mark:g-10]] module ကို နှစ်ဆ တိုးပြီး ၁၀ ခု ဖြစ်သွားရင်တော့ အတွဲက ၄၅ တွဲ ဖြစ်သွားပါတယ်။
      [[mark:g-20]] module ၂၀ ဆိုရင် ၁၉၀ တွဲပါ။ feature တွေက တစ်ခုပြီး တစ်ခု ပုံမှန် တိုးလာပေမဲ့၊ ဆက်နိုင်တဲ့
      နည်းလမ်းတွေကတော့ အဲဒီထက် အများကြီး ပိုမြန်မြန် တိုးလာတာပါ။
      [[mark:g-head]] တစ်ဖက်မှာတော့ ကိုယ်တို့ ခေါင်းထဲမှာ တစ်ပြိုင်တည်း မှတ်ထားနိုင်တဲ့ ပမာဏက အရင်အတိုင်းပါပဲ။
      developer ခြောက်ယောက်လုံးက system တစ်ခုလုံးကို ခေါင်းထဲ ထည့်ထားနိုင်တဲ့ အချိန်က ကုန်တော့မှာပါ။
      [[mark:g-group]] ဖြေရှင်းနည်းက ပိုကြိုးစားပြီး မှတ်ဖို့ မဟုတ်ဘဲ၊ အုပ်စုဖွဲ့တဲ့ အဆင့်သစ် တစ်ဆင့် ထပ်ထည့်ဖို့ပါ။
      ဆက်စပ်တဲ့ module တွေကို အစုကြီး တစ်ခုထဲ စုလိုက်ပြီး၊ အစုကြီး အချင်းချင်းကိုတော့ သဘောတူထားတဲ့ ပုံစံ
      သေးသေးလေး တစ်ခုနဲ့ပဲ ဆက်ခိုင်းရင်၊ ခေါင်းထဲမှာ တစ်ပြိုင်တည်း ထားရမယ့် အရာက ပြန်နည်းသွားပါတယ်။
    sources:
      - {
          title: "Balancing Coupling in Software Design (Khononov)",
          url: "https://www.informit.com/store/balancing-coupling-in-software-design-universal-design-9780137353484",
        }
    actions:
      - {
          id: draw-g-open,
          type: whiteboard.apply,
          at: { mark: g-open },
          clear: true,
          upsertIds: [g-title],
          drawMs: 900,
        }
