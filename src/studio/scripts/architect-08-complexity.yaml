  - id: decide
    chapter: ဘယ်လို ဆုံးဖြတ်မလဲ
    narration: >
      [[mark:d-close]] ဒါတွေကို ခရီးဖော် မှာ အခု ဖြေရှင်းစရာ ရှိနေတဲ့ ကိစ္စတွေနဲ့ တွဲကြည့်ရအောင်။
      [[mark:d-sel]] ကိစ္စ တစ်ခုစီအတွက် အခြေအနေက ဘာလဲ၊ ဒါဆို ဘယ်လို ဆုံးဖြတ်မလဲ ဆိုတာကို ချရေးပါမယ်။
      [[mark:type-clear]] ကားလိုင်း အသစ် ထည့်တာက clear ပါ။ လုပ်နေကျ အဆင့်တွေကို checklist တစ်ခုအဖြစ် ရေးထားပြီး၊
      အဲဒီအတိုင်း လုပ်ရုံပါပဲ။ ဒီအတွက် အစည်းအဝေး ခေါ်နေစရာ မလိုပါဘူး။
      [[mark:type-complicated]] ခရီးစဉ် ရှာတဲ့ query နှေးနေတာက complicated ပါ။ အဖြေက ရှိပြီးသားမို့၊ database
      ကို သိတဲ့သူနဲ့ အတူ ထိုင်ပြီး ခွဲခြမ်းကြည့်ပါမယ်။ team ထဲမှာ သိတဲ့သူ မရှိရင် အပြင်က ကျွမ်းကျင်သူကို
      မေးတာလည်း သင့်တော်ပါတယ်။
      [[mark:type-complex]] utils ဆိုတဲ့ folder ကြီးကို ခွဲထုတ်တာကတော့ complex ပါ။ စာကြောင်း ၄၀၀၀ ထဲမှာ ဘာက
      ဘာနဲ့ ဆက်နေလဲ ဆိုတာ ဘယ်သူမှ အကုန် မသိပါဘူး။ ဒါကြောင့် plan အကြီးကြီး ဆွဲမနေဘဲ၊ တစ်စုချင်း ရွှေ့ပြီး
      ရွှေ့တိုင်း test နဲ့ စစ်ပါမယ်။ တစ်ခုခု ပျက်ရင် အဲဒီ တစ်စုကိုပဲ ပြန်ဖြုတ်လို့ ရပါတယ်။
      [[mark:type-chaotic]] နောက်ဆုံး တစ်ခုက လက်မှတ် ရောင်းနေတုန်း wallet ကုမ္ပဏီရဲ့ payment API ရုတ်တရက်
      ကျသွားတာမျိုးပါ။ ဒါက chaotic ပါ။ အဲဒီအချိန်ကျမှ စဉ်းစားရင် နောက်ကျပါပြီ။ ပထမဆုံး ဘာလုပ်မလဲ ဆိုတာကို
      အခုကတည်းက ဆုံးဖြတ်ထားရပါမယ်။ ငွေချေတာကို အရင် ပိတ်ပြီး ခရီးသည်ကို အသိပေးမယ်၊ အကြောင်းရင်းကိုတော့ ပြီးမှ
      ရှာမယ် ဆိုတာပါ။
    sources:
      - {
          title: "Balancing Coupling in Software Design (Khononov)",
          url: "https://www.informit.com/store/balancing-coupling-in-software-design-universal-design-9780137353484",
        }
      - {
          title: "Cynefin framework (Wikipedia)",
          url: "https://en.wikipedia.org/wiki/Cynefin_framework",
        }
    actions:
      - { id: close-g, type: whiteboard.apply, at: { mark: d-close }, open: false }
      - {
          id: open-notebook,
          type: workspace.openFile,
          at: { afterAction: close-g },
          path: notebook/08-how-to-decide.md,
        }
      - id: sel-head
        type: editor.select
        at: { mark: d-sel }
        target:
          { file: notebook/08-how-to-decide.md, text: "| ဖြေရှင်းစရာ | အခြေအနေ | ဘယ်လို ဆုံးဖြတ်မလဲ |" }
      - id: type-clear
        type: editor.type
        at: { mark: type-clear }
        cadence: line-by-line
        target: { file: notebook/08-how-to-decide.md, after: "|---|---|---|\n" }
        text: "| ကားလိုင်း အသစ် ထည့်တာ | clear | checklist အတိုင်း လုပ်မယ် |\n"
      - id: type-complicated
        type: editor.type
        at: { mark: type-complicated }
        cadence: line-by-line
        target: { file: notebook/08-how-to-decide.md, after: "| checklist အတိုင်း လုပ်မယ် |\n" }
        text: "| ရှာတဲ့ query နှေးနေတာ | complicated | database သိသူနဲ့ ခွဲခြမ်းကြည့်မယ် |\n"
      - id: type-complex
        type: editor.type
        at: { mark: type-complex }
        cadence: line-by-line
        target: { file: notebook/08-how-to-decide.md, after: "| database သိသူနဲ့ ခွဲခြမ်းကြည့်မယ် |\n" }
        text: "| utils ကို ခွဲထုတ်တာ | complex | တစ်စုချင်း ရွှေ့၊ ရွှေ့တိုင်း test နဲ့ စစ်မယ် |\n"
      - id: type-chaotic
        type: editor.type
        at: { mark: type-chaotic }
        cadence: line-by-line
        target: { file: notebook/08-how-to-decide.md, after: "| တစ်စုချင်း ရွှေ့၊ ရွှေ့တိုင်း test နဲ့ စစ်မယ် |\n" }
        text: "| payment API ရုတ်တရက် ကျတာ | chaotic | ငွေချေတာ အရင် ပိတ်၊ အကြောင်းရင်း ပြီးမှ ရှာမယ် |\n"
      - id: expect-complex
        type: expect.file
        at: { afterAction: type-chaotic }
        path: notebook/08-how-to-decide.md
        contains: "| utils ကို ခွဲထုတ်တာ | complex | တစ်စုချင်း ရွှေ့၊ ရွှေ့တိုင်း test နဲ့ စစ်မယ် |\n"

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ ထိုင်ခုံကို ၁၀ မိနစ်ပဲ ထိန်းထားပေးမယ် ဆိုရင် ခရီးသည်တွေ ဘယ်လို
      တုံ့ပြန်မလဲ ဆိုတာ team ထဲမှာ ဘယ်သူမှ မသိပါဘူး။ ငွေချေတာ မပြီးခင် ခုံ လွတ်သွားလို့ စိတ်ပျက်ပြီး
      ထွက်သွားကြမလား၊ ပိုမြန်မြန် ချေဖြစ်သွားကြမလား ဆိုတာပါ။ ဒါကို ဘယ်လို ဆုံးဖြတ်မလဲ။
      [[mark:q-a]] ပထမ နည်းက app design ကို ကျွမ်းကျင်တဲ့သူ တစ်ယောက်ကို မေးပြီး၊ သူ ပြောတဲ့အတိုင်း လုပ်တာပါ။
      [[mark:q-b]] ဒုတိယ နည်းက ခရီးစဉ် တစ်ခုတည်းမှာ အရင် စမ်းသုံးကြည့်ပြီး၊ ဘာဖြစ်လာလဲ တိုင်းတာပါ။ lesson ကို
      pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ နည်းပါ။ ဘာကြောင့်လဲဆိုတော့ ဒါက complicated မဟုတ်ဘဲ complex
      ဖြစ်နေလို့ပါ။ ကျွမ်းကျင်သူက တခြား app တွေမှာ ဘာဖြစ်ခဲ့လဲ ဆိုတာ ပြောပြနိုင်ပါတယ်။ ဒါပေမဲ့ ခရီးဖော် ရဲ့
      ခရီးသည်တွေ၊ အထူးသဖြင့် internet အားနည်းတဲ့ ကားဂိတ်ကနေ ဖုန်းနဲ့ ဝယ်နေတဲ့သူတွေ ဘယ်လို တုံ့ပြန်မလဲ ဆိုတာကတော့
      လုပ်မကြည့်ဘဲ ဘယ်သူမှ မသိနိုင်ပါဘူး။
      [[mark:q-test]] နှစ်ခုကို ခွဲဖို့ မေးခွန်းက တစ်ခုတည်းပါ။ ဒီ အဖြေကို တစ်ယောက်ယောက်က ကြိုပြောနိုင်လား
      ဆိုတာပါ။ ပြောနိုင်ရင် မေးပါ။ ဘယ်သူမှ မပြောနိုင်ရင်တော့ သေးသေးလေး စမ်းပြီး တိုင်းပါ။
    sources:
      - {
          title: "Balancing Coupling in Software Design (Khononov)",
          url: "https://www.informit.com/store/balancing-coupling-in-software-design-universal-design-9780137353484",
        }
      - {
          title: "Cynefin framework (Wikipedia)",
          url: "https://en.wikipedia.org/wiki/Cynefin_framework",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-test,
          type: whiteboard.apply,
          at: { mark: q-test },
          upsertIds: [q-t1, q-t2],
          drawMs: 1600,
        }

  - id: your-turn
    chapter: ကိုယ့် team အတွက်
    narration: >
      [[mark:turn]] ဒီ အဖြေကိုလည်း table ထဲမှာ ထည့်ထားလိုက်ပါမယ်။
      [[mark:type-hold]] hold အချိန်ကို ခရီးစဉ် တစ်ခုမှာပဲ အရင် စမ်းပါမယ်။ ငွေချေတာ ပြီးသွားတဲ့သူ ဘယ်နှယောက်၊
      တစ်ဝက်မှာ ထွက်သွားတဲ့သူ ဘယ်နှယောက် ဆိုတာကို တိုင်းပါမယ်။ ရလဒ် မကောင်းရင် အဲဒီ ခရီးစဉ် တစ်ခုမှာပဲ
      ပြန်ဖြုတ်လိုက်ရုံပါ။
      [[mark:turn-you]] အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ကိုယ့် team မှာ အခု ဆုံးဖြတ်စရာ ရှိနေတဲ့
      ကိစ္စ နှစ်ခုကို ဒီ table ထဲမှာ ထပ်ရေးကြည့်ပါ။ တစ်ခုစီအတွက် အခြေအနေက လေးမျိုးထဲက ဘယ်ဟာလဲ၊ ဒါဆို ဘယ်လို
      ဆုံးဖြတ်မလဲ ဆိုတာကို ဖြည့်ပါ။
      [[mark:turn-2]] ဖြည့်ရင်း သတိထားကြည့်စရာက အစည်းအဝေးထဲမှာ အကြာကြီး ငြင်းနေရတဲ့ ကိစ္စတွေပါ။ အဲဒီလို ကိစ္စ
      အများစုက complex ဖြစ်နေတတ်ပြီး၊ ဆက်ငြင်းနေမယ့်အစား သေးသေးလေး စမ်းကြည့်လိုက်တာက ပိုမြန်ပါတယ်။
    sources:
      - {
          title: "Balancing Coupling in Software Design (Khononov)",
          url: "https://www.informit.com/store/balancing-coupling-in-software-design-universal-design-9780137353484",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: turn }, open: false }
      - id: type-hold
        type: editor.type
        at: { mark: type-hold }
        cadence: line-by-line
        target:
          {
            file: notebook/08-how-to-decide.md,
            after: "| ငွေချေတာ အရင် ပိတ်၊ အကြောင်းရင်း ပြီးမှ ရှာမယ် |\n",
          }
        text: "| hold 10 မိနစ်ကို ခရီးသည် ဘယ်လို တုံ့ပြန်မလဲ | complex | ခရီးစဉ် 1 ခုမှာ စမ်းပြီး တိုင်းမယ် |\n"
      - id: sel-turn
        type: editor.select
        at: { mark: turn-you }
        target:
          { file: notebook/08-how-to-decide.md, text: "| ဖြေရှင်းစရာ | အခြေအနေ | ဘယ်လို ဆုံးဖြတ်မလဲ |" }

  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ complexity ဆိုတာ ပြင်လိုက်ရင် ဘာဖြစ်မလဲ ကြိုမှန်းလို့ မရတာပါ။ အဲဒါက အပိုင်းတွေရဲ့
      အရေအတွက်ကြောင့် မဟုတ်ဘဲ၊ အချင်းချင်း ဆက်သွယ်ပုံကြောင့် ဖြစ်တာပါ။ ဆုံးဖြတ်စရာ ကြုံရင် အခြေအနေကို အရင်
      ခွဲပါ။ clear ဆိုရင် စည်းမျဉ်းအတိုင်း လုပ်၊ complicated ဆိုရင် သိတဲ့သူကို မေး၊ complex ဆိုရင် စမ်းပြီး
      တိုင်း၊ chaotic ဆိုရင် အရင် လုပ်ပြီးမှ အကြောင်းရင်း ရှာပါ။
      [[mark:next]] နောက် lesson မှာတော့ module နှစ်ခုက တစ်ခုအကြောင်း တစ်ခု ဘယ်လောက် သိနေရလဲ၊ အဲဒီ
      ဆက်နွယ်မှုရဲ့ အားကို ဘယ်လို တိုင်းမလဲ ဆိုတာကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "Balancing Coupling in Software Design (Khononov)",
          url: "https://www.informit.com/store/balancing-coupling-in-software-design-universal-design-9780137353484",
        }
    actions: []

checks:
  - { type: timing.p95Ms, max: 300 }
