build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 40419

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  # ------------------------------------------------------------------ 1
  # Board 1 while pnpm install + vite boot run (preview is needed ~2 min later).
  - id: plan-the-screen
    chapter: "Thinking in React နဲ့ state ရဲ့ နေရာ"
    narration: >
      ဒီ lesson မှာ menu ရှာတဲ့ search box နဲ့၊ စားပွဲ တစ်ခုစီအတွက် မှတ်ချက်
      form ထည့်ကြည့်ပါမယ်။ [[mark:start-server]] install လုပ်တာ ကြာတတ်လို့၊
      dev server ကို အခုကတည်း စ run ထားပြီး၊ ကြားမှာ board ပေါ်မှာ
      စီစဉ်ကြည့်ရအောင်။ [[mark:draw-sketch]] page ကို အကွက် ခွဲကြည့်ရင်၊ App
      ထဲမှာ header၊ search box နဲ့ menu list ရှိပါတယ်။ [[mark:draw-steps-1-2]]
      React က အဆင့် 5 ဆင့်နဲ့ စဉ်းစားဖို့ အကြံပြုထားပါတယ်။ ပထမက UI ကို
      component တွေအဖြစ် ခွဲတာပါ။ ဒုတိယက state မပါဘဲ props နဲ့ ပြရုံ version
      အရင် ဆောက်တာပါ။ [[mark:draw-step-3]] တတိယက screen အတွက် လိုတဲ့ အနည်းဆုံး
      state ကို ရှာတာပါ။ ဒီမှာ ရှာတဲ့ စာသားနဲ့၊ စပ်တာ ဖျောက်မလား၊ ဒီနှစ်ခုပဲ
      လိုပါတယ်။ စစ်ထုတ်ပြီးသား list ကတော့ အဲဒီ နှစ်ခုကနေ တွက်လို့ ရလို့ state
      မဟုတ်ပါဘူး။ [[mark:draw-steps-4-5]] စတုတ္ထက အဲဒီ state ကို ဘယ် component
      က ပိုင်မလဲ ဆုံးဖြတ်တာပါ။ နောက်ဆုံးက child တွေက ပြောင်းလဲမှုကို အပေါ်ကို
      ပြန်ပို့တာပါ။ [[mark:circle-step-4]] ဒီအထဲမှာ အဆင့် 4 ကို လူအများစု
      မှားတတ်ကြပါတယ်။
    sources:
      - title: "React — Thinking in React"
        url: "https://react.dev/learn/thinking-in-react"
      - title: "Vite — Getting Started"
        url: "https://vite.dev/guide/"
    actions:
      - id: open-plan-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [plan-title]
      - id: start-dev-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 45000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-sketch
        type: whiteboard.apply
        at: { mark: draw-sketch }
        upsertIds:
          [
            plan-app,
            plan-app-label,
            plan-header,
            plan-header-label,
            plan-search,
            plan-search-label,
            plan-menu,
            plan-menu-label,
            plan-menu-dishes,
          ]
        drawMs: 2400
      - id: draw-steps-1-2
        type: whiteboard.apply
        at: { mark: draw-steps-1-2 }
        upsertIds: [plan-step-1, plan-step-2]
        drawMs: 1400
      - id: draw-step-3
        type: whiteboard.apply
        at: { mark: draw-step-3 }
        upsertIds: [plan-step-3, plan-step-3-detail]
        drawMs: 1400
      - id: draw-steps-4-5
        type: whiteboard.apply
        at: { mark: draw-steps-4-5 }
        upsertIds: [plan-step-4, plan-step-5]
        drawMs: 1400
      - id: circle-step-4
        type: whiteboard.apply
        at: { mark: circle-step-4 }
        upsertIds: [plan-circle-4]
        drawMs: 900

  # ------------------------------------------------------------------ 2
  # Thinking in React step 4: the tempting "state in SearchBox" version is the
  # whiteboard 'before' (it is never typed), the lifted version is what we write.
  - id: where-state-lives
    narration: >
      [[mark:draw-lift-title]] ရှာတဲ့ စာသားကို SearchBox ထဲမှာပဲ state အနေနဲ့
      ထားချင်တတ်ပါတယ်၊ စာရိုက်တာက အဲဒီမှာ ဖြစ်လို့ပါ။ [[mark:draw-wrong-tree]]
      ဒါပေမဲ့ SearchBox နဲ့ MenuList က App အောက်က ဘေးချင်းကပ် component
      နှစ်ခုပါ။ state က သူ့ကို ပိုင်တဲ့ component ထဲမှာပဲ ရှိလို့၊ MenuList က
      မမြင်ရပါဘူး။ [[mark:strike-wrong]] ဆိုတော့ ဒီ version နဲ့ ဘာမှ စစ်လို့
      မရပါဘူး။ [[mark:draw-right-tree]] အဲဒီအစား state ကို နှစ်ခုလုံးရဲ့
      အနီးဆုံး parent ဖြစ်တဲ့ App ထဲ ရွှေ့ပြီး၊ App ကပဲ လိုတဲ့ တန်ဖိုးကို
      props နဲ့ အောက်ကို ပေးပါတယ်။ [[mark:draw-flow-up]] App က function
      တစ်ခုလည်း ပေးပါတယ်။ စာရိုက်တိုင်း SearchBox က အဲဒီ function ကို စာသား
      အသစ်နဲ့ ခေါ်ပြီး၊ App က state ကို ပြောင်းပါတယ်။ ဆိုတော့ တန်ဖိုးက props
      နဲ့ အောက် ဆင်းပြီး၊ ပြောင်းလဲမှုက function နဲ့ အပေါ် ပြန်တက်ပါတယ်။
      [[mark:check-right]] ဒါကို lifting state up လို့ ခေါ်ပါတယ်။
    sources:
      - title: "React — Sharing State Between Components"
        url: "https://react.dev/learn/sharing-state-between-components"
      - title: "React — Thinking in React: where your state should live"
        url: "https://react.dev/learn/thinking-in-react#step-4-identify-where-your-state-should-live"
    actions:
      - id: draw-lift-title
        type: whiteboard.apply
        at: { mark: draw-lift-title }
        clear: true
        upsertIds: [lift-title]
      - id: draw-wrong-tree
        type: whiteboard.apply
        at: { mark: draw-wrong-tree }
        upsertIds:
          [
            wrong-app,
            wrong-app-label,
            wrong-search,
            wrong-search-label,
            wrong-search-state,
            wrong-menu,
            wrong-menu-label,
            wrong-menu-q,
          ]
        drawMs: 2600
      - id: strike-wrong
        type: whiteboard.apply
        at: { mark: strike-wrong }
        upsertIds: [wrong-note, wrong-strike]
        drawMs: 1200
      - id: draw-right-tree
        type: whiteboard.apply
        at: { mark: draw-right-tree }
        upsertIds:
          [
            right-app,
            right-app-label,
            right-app-state,
            right-arrow-search,
            right-arrow-menu,
            right-search,
            right-search-label,
            right-menu,
            right-menu-label,
            right-props,
          ]
        drawMs: 3000
      - id: draw-flow-up
        type: whiteboard.apply
        at: { mark: draw-flow-up }
        upsertIds: [right-up]
        drawMs: 1000
      - id: check-right
        type: whiteboard.apply
        at: { mark: check-right }
        upsertIds: [right-check]
        drawMs: 600

  # ------------------------------------------------------------------ 3
  # SearchBox.jsx is pinned empty and nothing imports it: boilerplate lands
  # line by line, the controlled-input lines as keystrokes.
  - id: search-box
    chapter: "Controlled input ရေးကြည့်ရအောင်"
    narration: >
      [[mark:close-lift-board]] ကဲ၊ editor ထဲ ပြန်သွားရအောင်။
      [[mark:show-preview]] dev server ရသွားပါပြီ။ preview ဖွင့်လိုက်တော့
      ဟင်းလျာ 5 မျိုး ပေါ်နေပါပြီ။ [[mark:open-searchbox]] SearchBox ဖိုင်က
      အလွတ်ပါ။ ဘယ်ဖိုင်ကမှလည်း import မလုပ်ရသေးပါဘူး။
      [[mark:type-search-head]] ဒီ component က App ဆီက props လေးခု
      လက်ခံပါတယ်။ ရှာတဲ့ စာသားနဲ့၊ စပ်တာ ဖျောက်မလား ဆိုတဲ့ တန်ဖိုး နှစ်ခုနဲ့၊ အဲဒါတွေကို
      ပြောင်းဖို့ function နှစ်ခုပါ။ ပြီးရင် useId ဆီက id ယူပြီး label နဲ့
      input ကို ချိတ်ထားလို့၊ label နှိပ်ရင် cursor က input ထဲ ရောက်ပါတယ်။
      [[mark:type-search-value]] ဒီ နှစ်ကြောင်းက controlled input ပါ။
      တန်ဖိုးကို state ထဲ ထားပြီး၊ စာရိုက်တိုင်း state ကို ပြောင်းပေးတာပါ။
      value က App ရဲ့ state ကနေ လာပြီး၊ onChange က စာသား အသစ်ကို App ဆီ
      ပြန်ပို့ပါတယ်။ [[mark:select-value]] ဒီ နှစ်ကြောင်းကြောင့် input ထဲမှာ
      App ရဲ့ state အတိုင်းပဲ ပြနေလို့၊ input နဲ့ state ဘယ်တော့မှ မကွဲပါဘူး။
      [[mark:type-search-check]] checkbox ကလည်း ဒီအတိုင်းပါပဲ။ ကွာတာက value
      အစား checked ကို သုံးပြီး၊ event ထဲကလည်း checked ကိုပဲ ဖတ်တာပါ။ ပြီးရင်
      component ကို ပိတ်လိုက်ပါမယ်။ [[mark:select-useid]] ဒီ useId ကို
      ကြည့်ပါ။ ခေါ်တဲ့ component တိုင်း ကိုယ်ပိုင် id ရလို့၊ page ထဲ နှစ်ကြိမ်
      သုံးထားရင်တောင် id မတူပါဘူး။ [[mark:useid-format]] ဒီ label ကို ကြည့်ပါ။
      useId ရဲ့ id ကို label နဲ့ input လို element တွေ အချင်းချင်း ချိတ်ဖို့
      သုံးပါ။ ပုံစံက React 19.1 နဲ့ React 19.2 မှာ ပြောင်းခဲ့လို့ ခွဲဖတ်တာမျိုး
      မလုပ်ပါနဲ့။ list key ကတော့ item တစ်ခုစီရဲ့ data ထဲက id ဖြစ်ရလို့၊ useId
      ကို list key အဖြစ်လည်း မသုံးပါနဲ့။ [[mark:uncontrolled-note]] value အစား
      default
      တန်ဖိုး ပေးထားတဲ့ input ကတော့ uncontrolled ပါ။ စာသားကို browser ကပဲ
      မှတ်ထားပြီး၊ form ပို့တဲ့အခါမှ FormData နဲ့ ဖတ်ရပါတယ်။ lesson 10 မှာ
      အဲဒါ သုံးပါမယ်။
    sources:
      - title: "React — <input>: controlling an input with a state variable"
        url: "https://react.dev/reference/react-dom/components/input#controlling-an-input-with-a-state-variable"
      - title: "React — controlled and uncontrolled components"
        url: "https://react.dev/learn/sharing-state-between-components#controlled-and-uncontrolled-components"
      - title: "React — useId"
        url: "https://react.dev/reference/react/useId"
      - title: "React 19.2 (useId format)"
        url: "https://react.dev/blog/2025/10/01/react-19-2"
      - title: "React CHANGELOG (19.1 and 19.2 useId format)"
        url: "https://github.com/react/react/blob/main/CHANGELOG.md"
    actions:
      - id: close-lift-board
        type: whiteboard.apply
        at: { mark: close-lift-board }
        open: false
      - id: wait-for-dev-server
        type: runtime.waitForReady
        at: { mark: show-preview }
        timeoutMs: 20000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-dev-server }
        timeoutMs: 15000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-five-dishes
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: menu-count }
        textContains: "ဟင်းလျာ 5 မျိုး"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: collapse-runner-dock
        type: runtime.collapseDock
        at: { afterAction: expect-five-dishes }
      - id: open-searchbox
        type: workspace.openFile
        at: { mark: open-searchbox }
        path: src/SearchBox.jsx
      - id: type-search-head
        type: editor.type
        at: { mark: type-search-head }
        cadence: line-by-line
        target: { file: src/SearchBox.jsx, after: "", occurrence: 1 }
        text: "import { useId } from \"react\";\n\nexport default function SearchBox({\n  query,\n  onQueryChange,\n  mildOnly,\n  onMildOnlyChange,\n}) {\n  const id = useId();\n  return (\n    <div className=\"card\">\n      <label htmlFor={id}>ဟင်းလျာ ရှာရန်</label>\n      <input\n        id={id}\n        data-testid=\"search-input\"\n        "
      - id: type-search-value
        type: editor.type
        at: { mark: type-search-value }
        cadence: fast-explainer
        target:
          {
            file: src/SearchBox.jsx,
            after: "        data-testid=\"search-input\"\n        ",
            occurrence: 1,
          }
        text: "value={query}\n        onChange={(e) => onQueryChange(e.target.value)}\n"
      - id: select-value
        type: editor.select
        at: { mark: select-value }
        target:
          {
            file: src/SearchBox.jsx,
            text: "        value={query}\n        onChange={(e) => onQueryChange(e.target.value)}",
            occurrence: 1,
          }
      - id: type-search-check
        type: editor.type
        at: { mark: type-search-check }
        cadence: line-by-line
        target:
          { file: src/SearchBox.jsx, after: "onQueryChange(e.target.value)}\n", occurrence: 1 }
        text: "      />\n      <label className=\"check\">\n        <input\n          type=\"checkbox\"\n          data-testid=\"mild-only\"\n          checked={mildOnly}\n          onChange={(e) => onMildOnlyChange(e.target.checked)}\n        />\n        မစပ်တာပဲ ပြပါ\n      </label>\n    </div>\n  );\n}\n"
      - id: select-useid
        type: editor.select
        at: { mark: select-useid }
        target: { file: src/SearchBox.jsx, text: "const id = useId();", occurrence: 1 }
      - id: select-htmlfor
        type: editor.select
        at: { mark: useid-format }
        target: { file: src/SearchBox.jsx, text: "<label htmlFor={id}>", occurrence: 1 }
      - id: select-value-controlled
        type: editor.select
        at: { mark: uncontrolled-note }
        target: { file: src/SearchBox.jsx, text: "value={query}", occurrence: 1 }

  # ------------------------------------------------------------------ 4
  # App.jsx is live: four block inserts, import first, filter last.
  - id: wire-search
    narration: >
      [[mark:open-app]] အခု App ဖိုင်ပါ။ menu တစ်ခုလုံးကို ပြနေပါသေးတယ်။
      [[mark:type-app-imports]] import တွေကို အရင် ထည့်ပါမယ်။ ဒါမှ သုံးတဲ့အခါ
      နာမည်တွေ ရှိနေမှာပါ။ [[mark:type-app-state]] နောက်က state နှစ်ခုနဲ့၊
      ဟင်းလျာ တစ်မျိုးကို ပြမလား မပြဘူးလား ဆုံးဖြတ်မယ့် function ပါ။ checkbox
      ခြစ်ထားရင် စပ်တာ ဖျောက်ပြီး၊ နာမည်ထဲ ရှာတဲ့ စာသား ပါမှ ပြပါတယ်။
      [[mark:type-app-searchbox]] ပြီးရင် SearchBox ကို header အောက် ထည့်ပြီး၊
      တန်ဖိုးရော function ရော ပေးလိုက်ပါတယ်။ [[mark:type-app-filter]]
      နောက်ဆုံး MenuList ကို menu ပေးတဲ့ နေရာမှာပဲ filter နဲ့ စစ်ထုတ်ပါတယ်။
      [[mark:select-filter]] ဒီ filter ကို ကြည့်ပါ။ စစ်ထုတ်ပြီးသား list ကို
      state ထဲ မသိမ်းဘဲ၊ render တိုင်း ပြန်တွက်တဲ့အတွက် state နဲ့ အမြဲ
      ကိုက်နေပါတယ်။ [[mark:input-search]] search box ထဲ ရှမ်း လို့
      ရိုက်ရအောင်။ ဟင်းလျာ 1 မျိုး၊ ရှမ်းခေါက်ဆွဲပဲ ကျန်ပါတယ်။ SearchBox နဲ့ MenuList
      နှစ်ခုလုံးက App ရဲ့ state တစ်ခုတည်းကို သုံးလို့ပါ။ [[mark:clear-search]]
      ပြန်ဖျက်လိုက်တော့ ဟင်းလျာ 5 မျိုးလုံး ပြန်ပေါ်လာပါပြီ။
      [[mark:click-mild]] အခု မစပ်တာပဲ ပြပါ ဆိုတဲ့ အကွက်ကို အမှန်ခြစ်ရအောင်။
      စပ်တဲ့ အသုပ် နှစ်မျိုး ပျောက်သွားပြီး၊ ဟင်းလျာ 3 မျိုးပဲ ကျန်ပါတော့တယ်။
    sources:
      - title: "React — Sharing State Between Components"
        url: "https://react.dev/learn/sharing-state-between-components"
      - title: "React — Thinking in React: add inverse data flow"
        url: "https://react.dev/learn/thinking-in-react#step-5-add-inverse-data-flow"
      - title: "React — Choosing the State Structure: avoid redundant state"
        url: "https://react.dev/learn/choosing-the-state-structure#avoid-redundant-state"
    actions:
      - id: open-app
        type: workspace.openFile
        at: { mark: open-app }
        path: src/App.jsx
      - id: type-app-imports
        type: editor.type
        at: { mark: type-app-imports }
        cadence: block
        target: { file: src/App.jsx, after: "", occurrence: 1 }
        text: "import { useState } from \"react\";\nimport SearchBox from \"./SearchBox.jsx\";\n"
      - id: type-app-state
        type: editor.type
        at: { mark: type-app-state }
        cadence: block
        target: { file: src/App.jsx, after: "export default function App() {\n", occurrence: 1 }
        text: "  const [query, setQuery] = useState(\"\");\n  const [mildOnly, setMildOnly] = useState(false);\n\n  function matches(dish) {\n    if (mildOnly && dish.spicy) return false;\n    return dish.name.includes(query);\n  }\n\n"
      - id: type-app-searchbox
        type: editor.type
        at: { mark: type-app-searchbox }
        cadence: block
        target: { file: src/App.jsx, after: "      <Header />\n", occurrence: 1 }
        text: "      <SearchBox\n        query={query}\n        onQueryChange={setQuery}\n        mildOnly={mildOnly}\n        onMildOnlyChange={setMildOnly}\n      />\n"
      - id: expect-search-box-shown
        type: expect.preview
        at: { mark: type-app-filter }
        timeoutMs: 4000
        target: { by: testId, value: search-input }
        value: ""
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-app-filter
        type: editor.type
        at: { mark: type-app-filter, offsetMs: 300 }
        cadence: block
        target: { file: src/App.jsx, after: "dishes={menu", occurrence: 1 }
        text: ".filter(matches)"
      - id: select-filter
        type: editor.select
        at: { mark: select-filter }
        target: { file: src/App.jsx, text: "menu.filter(matches)", occurrence: 1 }
      - id: input-search
        type: preview.input
        at: { mark: input-search }
        timeoutMs: 5000
        target: { by: testId, value: search-input }
        value: "ရှမ်း"
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-one-dish
        type: expect.preview
        at: { afterAction: input-search }
        timeoutMs: 4000
        target: { by: testId, value: menu-count }
        textContains: "ဟင်းလျာ 1 မျိုး"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-shan-card
        type: expect.preview
        at: { afterAction: expect-one-dish }
        timeoutMs: 4000
        target: { by: testId, value: dish-card-shan-noodles }
        textContains: "ရှမ်းခေါက်ဆွဲ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: clear-search
        type: preview.input
        at: { mark: clear-search }
        timeoutMs: 5000
        target: { by: testId, value: search-input }
        value: ""
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-five-again
        type: expect.preview
        at: { afterAction: clear-search }
        timeoutMs: 4000
        target: { by: testId, value: menu-count }
        textContains: "ဟင်းလျာ 5 မျိုး"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: click-mild-only
        type: preview.click
        at: { mark: click-mild }
        timeoutMs: 5000
        target: { by: testId, value: mild-only }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-three-dishes
        type: expect.preview
        at: { afterAction: click-mild-only }
        timeoutMs: 4000
        target: { by: testId, value: menu-count }
        textContains: "ဟင်းလျာ 3 မျိုး"
        retry: { maxAttempts: 3, delayMs: 300 }

  # ------------------------------------------------------------------ 5
  - id: derived-state
    chapter: "State ကို ဘယ်လို ပုံစံချမလဲ"
    narration: >
      [[mark:open-derived-board]] ဒါဆို စစ်ထုတ်ပြီးသား list ကို state ထဲမှာ
      ဘာလို့ မထားတာလဲ။ [[mark:draw-duplicate]] ထားရင် data တစ်ခုတည်းက နှစ်နေရာ
      ရှိနေပြီး၊ ပြောင်းတိုင်း နှစ်နေရာလုံး လိုက်ပြင်ရပါမယ်။ တစ်ခါ မေ့တာနဲ့
      screen ပေါ်မှာ ဟင်းလျာ မှားပြနေမှာပါ။ [[mark:draw-derived]] ဆိုတော့
      ရှိပြီးသား props ဒါမှမဟုတ် state ကနေ တွက်လို့ ရရင်၊ state ထဲ မထည့်ဘဲ
      render ထဲမှာပဲ တွက်ပါ။ အဲဒီအခါ ကိုက်အောင် ထိန်းစရာ ဘာမှ မကျန်တော့ပါဘူး။
      [[mark:draw-ids]] အလားတူပဲ၊ ရွေးထားတဲ့ ဟင်းလျာကို မှတ်ချင်ရင် object ကို
      copy မမှတ်ဘဲ၊ id ကိုပဲ မှတ်ပါ။ menu ထဲက ဟင်းလျာ ပြောင်းသွားရင် copy က
      အဟောင်းအတိုင်း ကျန်နေပေမယ့်၊ id ကတော့ အစစ်ကို အမြဲ ညွှန်ပါတယ်။
    sources:
      - title: "React — Choosing the State Structure"
        url: "https://react.dev/learn/choosing-the-state-structure"
    actions:
      - id: open-derived-board
        type: whiteboard.apply
        at: { mark: open-derived-board }
        open: true
        clear: true
        upsertIds: [derived-title]
      - id: draw-duplicate
        type: whiteboard.apply
        at: { mark: draw-duplicate }
        upsertIds: [dup-box, dup-line-1, dup-line-2, dup-line-3, dup-strike]
        drawMs: 2200
      - id: draw-derived
        type: whiteboard.apply
        at: { mark: draw-derived }
        upsertIds: [derived-box, derived-line-1, derived-line-2, derived-line-3, derived-check]
        drawMs: 2200
      - id: draw-ids
        type: whiteboard.apply
        at: { mark: draw-ids }
        upsertIds: [ids-box, ids-line-1, ids-line-2]
        drawMs: 1800

  # ------------------------------------------------------------------ 6
  # TableNote.jsx is pinned empty and nothing imports it yet.
  - id: table-note
    chapter: "Form နဲ့ object state"
    narration: >
      [[mark:close-derived-board]] အခု စားပွဲ တစ်ခုစီရဲ့ မှတ်ချက် form ပါ။
      [[mark:open-tablenote]] TableNote ဖိုင်ကလည်း အလွတ်ပါပဲ။
      [[mark:type-note-state]] နာမည်နဲ့ မှတ်ချက်က မှတ်ချက် တစ်ခုတည်းရဲ့
      အပိုင်းတွေ ဖြစ်ပြီး အတူ သိမ်းရလို့၊ object တစ်ခုတည်းနဲ့ state ထဲ
      ထားပါတယ်။ ဒုတိယ state ကတော့ သိမ်းပြီးပြီလား ဆိုတာ မှတ်ထားပါတယ်။
      [[mark:type-note-submit]] form ဆိုတာ input တွေ စုပြီး submit လုပ်လို့
      ရတဲ့ HTML အပိုင်းပါ။ submit လုပ်ရင် run မယ့် handler ထဲမှာ
      preventDefault ကို အရင် ခေါ်ပါတယ်။ မဟုတ်ရင် browser က page ကို အစကနေ
      ပြန်ဖွင့်လို့ state အကုန် ပျောက်မှာပါ။ ပြီးမှ သိမ်းပြီးပြီလို့ မှတ်ပါတယ်။
      [[mark:type-note-form]] form မှာ အဲဒီ handler ကို ချိတ်ပြီး၊ စားပွဲ
      နံပါတ် ခေါင်းစဉ်နဲ့ နာမည် input ထည့်ပါတယ်။ label က input ကို သူ့ထဲမှာ
      ထည့်ထားလို့၊ ဒီတစ်ခါ id ချိတ်စရာ မလိုပါဘူး။ သူ့ value က object ထဲက
      နာမည် field ကနေ လာပါတယ်။ [[mark:type-note-name]] အခု သူ့ onChange ပါ။
      array လိုပဲ object အဟောင်းကို မပြင်ဘဲ၊ object အသစ် ဆောက်ပါတယ်။ အစက်
      သုံးစက် spread က အဟောင်းထဲက field အားလုံးကို ကူးပြီး၊ နာမည်ကိုပဲ
      အသစ်နဲ့ လဲတာပါ။ [[mark:select-spread]] ဒီ copy မပါရင် နာမည်
      ရိုက်လိုက်တာနဲ့ မှတ်ချက် ပျောက်သွားမှာပါ။ [[mark:type-note-rest]]
      မှတ်ချက် input ကလည်း သူ့ field အတွက် ဒီအတိုင်းပါပဲ။ ပြီးရင် သိမ်းမယ့်
      ခလုတ်ပါ။ form ထဲက ခလုတ်ကို နှိပ်ရင် form က submit ဖြစ်ပြီး ခုနက handler
      run လို့၊ ခလုတ်မှာ onClick ထည့်စရာ မလိုပါဘူး။ နောက်ဆုံးက သိမ်းပြီးမှ
      ပေါ်လာမယ့် စာကြောင်းပါ။ spread က အပေါ်ယံ တစ်ထပ်ပဲ ကူးလို့၊ object ထဲမှာ
      object ထပ်ပါနေရင် ပြောင်းမယ့် အထပ်တိုင်းကို copy ကူးရပါတယ်။
    sources:
      - title: "React — Updating Objects in State"
        url: "https://react.dev/learn/updating-objects-in-state"
      - title: "React — Responding to Events: preventing default behavior"
        url: "https://react.dev/learn/responding-to-events#preventing-default-behavior"
      - title: "MDN — HTMLFormElement: submit event"
        url: "https://developer.mozilla.org/en-US/docs/Web/API/HTMLFormElement/submit_event"
    actions:
      - id: close-derived-board
        type: whiteboard.apply
        at: { mark: close-derived-board }
        open: false
      - id: open-tablenote
        type: workspace.openFile
        at: { mark: open-tablenote }
        path: src/TableNote.jsx
      - id: type-note-state
        type: editor.type
        at: { mark: type-note-state }
        cadence: line-by-line
        target: { file: src/TableNote.jsx, after: "", occurrence: 1 }
        text: "import { useState } from \"react\";\n\nexport default function TableNote({ tableId }) {\n  const [info, setInfo] = useState({ name: \"\", note: \"\" });\n  const [saved, setSaved] = useState(false);\n"
      - id: type-note-submit
        type: editor.type
        at: { mark: type-note-submit }
        cadence: line-by-line
        target:
          {
            file: src/TableNote.jsx,
            after: "  const [saved, setSaved] = useState(false);\n",
            occurrence: 1,
          }
        text: "\n  function handleSubmit(e) {\n    e.preventDefault();\n    setSaved(true);\n  }\n"
      - id: type-note-form
        type: editor.type
        at: { mark: type-note-form }
        cadence: line-by-line
        target: { file: src/TableNote.jsx, after: "    setSaved(true);\n  }\n", occurrence: 1 }
        text: "\n  return (\n    <form className=\"card\" data-testid=\"table-note\" onSubmit={handleSubmit}>\n      <h2>စားပွဲ {tableId}</h2>\n      <label>\n        နာမည်\n        <input\n          data-testid=\"note-name\"\n          value={info.name}\n          "
      - id: type-note-name
        type: editor.type
        at: { mark: type-note-name }
        cadence: fast-explainer
        target:
          {
            file: src/TableNote.jsx,
            after: "          value={info.name}\n          ",
            occurrence: 1,
          }
        text: "onChange={(e) => setInfo({ ...info, name: e.target.value })}\n"
      - id: select-spread
        type: editor.select
        at: { mark: select-spread }
        target:
          { file: src/TableNote.jsx, text: "{ ...info, name: e.target.value }", occurrence: 1 }
      - id: type-note-rest
        type: editor.type
        at: { mark: type-note-rest }
        cadence: line-by-line
        target: { file: src/TableNote.jsx, after: "name: e.target.value })}\n", occurrence: 1 }
        text: "        />\n      </label>\n      <label>\n        မှတ်ချက်\n        <input\n          data-testid=\"note-text\"\n          value={info.note}\n          onChange={(e) => setInfo({ ...info, note: e.target.value })}\n        />\n      </label>\n      <button data-testid=\"save-note\">သိမ်းမယ်</button>\n      {saved && <p data-testid=\"note-saved\">{info.name} ရဲ့ မှတ်ချက် သိမ်းပြီးပါပြီ</p>}\n    </form>\n  );\n}\n"

  # ------------------------------------------------------------------ 7
  # Whiteboard aside only: bubbling and stopPropagation are not typed.
  - id: event-bubbling
    narration: >
      [[mark:open-bubble-board]] preventDefault ကို event ရဲ့ တခြား method နဲ့
      ရောတတ်လို့၊ နှစ်ခုလုံး board ပေါ် ဆွဲပြပါမယ်။ [[mark:draw-bubble-boxes]]
      ဒီမှာ ခလုတ်က form ထဲမှာ ရှိပြီး၊ form ကတော့ div ထဲမှာ ရှိပါတယ်။
      [[mark:draw-bubble-order]] ခလုတ် နှိပ်ရင် သူ့ handler အရင် run ပြီး၊
      event က အပေါ် တက်လို့ form၊ ပြီးရင် div ရဲ့ handler ပါ run ပါတယ်။ ဒါကို
      bubbling လို့ ခေါ်ပါတယ်။ [[mark:draw-stop]] stopPropagation က အဲဒီ
      တက်တာကို ရပ်ပေးတဲ့အတွက်၊ form နဲ့ div က ဒီ click ကို မသိတော့ပါဘူး။
      [[mark:draw-prevent]] preventDefault ကတော့ အပေါ် တက်တာကို မရပ်ပါဘူး။
      browser ရဲ့ မူလ အလုပ်ကိုပဲ ရပ်တာပါ၊ ဥပမာ submit လုပ်ရင် page
      ပြန်ပွင့်တာမျိုးပါ။ ဒီ နှစ်ခုက မဆိုင်ပါဘူး။
    sources:
      - title: "React — Responding to Events: event propagation"
        url: "https://react.dev/learn/responding-to-events#event-propagation"
      - title: "MDN — Event: stopPropagation() method"
        url: "https://developer.mozilla.org/en-US/docs/Web/API/Event/stopPropagation"
      - title: "MDN — Event: preventDefault() method"
        url: "https://developer.mozilla.org/en-US/docs/Web/API/Event/preventDefault"
    actions:
      - id: open-bubble-board
        type: whiteboard.apply
        at: { mark: open-bubble-board }
        open: true
        clear: true
        upsertIds: [bubble-title]
      - id: draw-bubble-boxes
        type: whiteboard.apply
        at: { mark: draw-bubble-boxes }
        upsertIds:
          [
            bubble-div,
            bubble-div-label,
            bubble-form,
            bubble-form-label,
            bubble-button,
            bubble-button-label,
          ]
        drawMs: 2200
      - id: draw-bubble-order
        type: whiteboard.apply
        at: { mark: draw-bubble-order }
        upsertIds: [bubble-order-1, bubble-order-2, bubble-order-3]
        drawMs: 1500
      - id: draw-stop
        type: whiteboard.apply
