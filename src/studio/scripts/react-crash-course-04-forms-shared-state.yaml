# React crash course, lesson 4 of 12: forms and shared state (Burmese course,
# narration drafted in English for the Burmese writer — see DESIGN.md).
#
# App: the Yangon food-shop menu from lessons 1–3. A SearchBox (controlled text
# input + "not spicy" checkbox, label wired with useId) filters the sibling
# MenuList through state kept in App and a filter computed during render. A
# TableNote form (label-wrapped inputs) keeps { name, note } in one state object,
# saves without a page reload (preventDefault), keeps table 1's text on table 2 until key={tableId}
# is added, after which every table starts fresh.
#
# Editing rules (live Vite, no React plugin, every JS edit is a full reload):
# - SearchBox.jsx and TableNote.jsx are pinned EMPTY and typed while nothing
#   imports them: boilerplate lands line by line, the lines the lesson is about
#   (value/onChange, checked/onChange, the object spread) as keystrokes.
# - Every edit to App.jsx is a `block` insert of complete lines: imports first,
#   then state, then the JSX that uses them, then the `.filter(matches)` and
#   ` key={tableId}` atomic inserts at the call sites.
# - Preview state resets on every App.jsx edit, so each interaction is done
#   after the edit it depends on, and every claim is an expect.preview.
# Validate with:
#   bun scripts/studio-director.ts <this file>
schemaVersion: 1

