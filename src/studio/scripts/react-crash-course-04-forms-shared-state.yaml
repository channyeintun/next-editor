  # ------------------------------------------------------------------ 10
  # Declarative UI states (bridge to lesson 10's Actions), recap, final files.
  - id: form-states-recap
    narration: >
      [[mark:open-states-board]] နောက်ဆုံးတစ်ခုပါ။ [[mark:draw-states]] ဥပမာ
      order form တစ်ခုဆိုရင် အခြေအနေ လေးခုကြား ကူးပြောင်းပါတယ်။ typing၊ submitting၊
      ပြီးရင် success ဒါမှမဟုတ် error ပါ။ [[mark:draw-states-rule]] React မှာ
      အခြေအနေ တစ်ခုစီမှာ ဘာ ပြမလဲ ကြိုရေးထားပြီး၊ state ပြောင်းရုံနဲ့ တစ်ခုကနေ
      တစ်ခု ကူးပါတယ်။ page ကို တစ်ဆင့်ချင်း ကိုယ်တိုင် လိုက်ပြင်စရာ မလိုပါဘူး။
      [[mark:draw-states-next]] lesson 10 မှာ submitting အပိုင်းကို Action
      တွေက ကိုယ့်အစား လုပ်ပေးပါမယ်။ [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊
      controlled input က တန်ဖိုးကို state ကနေ ယူပြီး၊ မျှသုံးတဲ့ state က
      အနီးဆုံး parent မှာ နေပါတယ်။ တွက်လို့ ရတာကို မသိမ်းသလို၊ object ကို
      မပြင်ဘဲ copy ကူးပါတယ်။ key က state ကို ဘယ်အချိန် ပြန်စမလဲ ဆုံးဖြတ်ပါတယ်။
      နောက် lesson မှာတော့ lesson 3 က order logic ကို reducer တစ်ခုထဲ စုပြီး၊
      context နဲ့ ဘယ် component ကမဆို ယူသုံးနိုင်အောင် လုပ်သွားပါမယ်။
    sources:
      - title: "React — Reacting to Input with State"
        url: "https://react.dev/learn/reacting-to-input-with-state"
      - title: "React — Managing State"
        url: "https://react.dev/learn/managing-state"
    actions:
      - id: open-states-board
        type: whiteboard.apply
        at: { mark: open-states-board }
        open: true
        clear: true
        upsertIds: [st-title]
      - id: draw-states
        type: whiteboard.apply
        at: { mark: draw-states }
        upsertIds:
          [
            st-typing,
            st-typing-label,
            st-arrow-1,
            st-submitting,
            st-submitting-label,
            st-arrow-2,
            st-success,
            st-success-label,
            st-error,
            st-error-label,
          ]
        drawMs: 3000
      - id: draw-states-rule
        type: whiteboard.apply
        at: { mark: draw-states-rule }
        upsertIds: [st-rule-1, st-rule-2]
        drawMs: 1600
      - id: draw-states-next
        type: whiteboard.apply
        at: { mark: draw-states-next }
        upsertIds: [st-next-box, st-next]
        drawMs: 900
      - id: expect-app-final
        type: expect.file
        at: { mark: recap }
        path: src/App.jsx
        contains: "      <TableNote key={tableId} tableId={tableId} />\n      <SearchBox\n"
      - id: expect-app-filter
        type: expect.file
        at: { afterAction: expect-app-final }
        path: src/App.jsx
        contains: "<MenuList dishes={menu.filter(matches)} />"
      - id: expect-searchbox-final
        type: expect.file
        at: { afterAction: expect-app-filter }
        path: src/SearchBox.jsx
        contains: "        value={query}\n        onChange={(e) => onQueryChange(e.target.value)}\n"
      - id: expect-tablenote-final
        type: expect.file
        at: { afterAction: expect-searchbox-final }
        path: src/TableNote.jsx
        contains: "onChange={(e) => setInfo({ ...info, note: e.target.value })}"

checks:
  - { type: timing.p95Ms, max: 300 }
