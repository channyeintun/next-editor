  # ------------------------------------------------------------------ 9
  # Why the note stayed (position in the tree), then the one-prop fix.
  - id: position-and-key
    chapter: "Key က state ကို ဘယ်အချိန် ပြန်စလဲ"
    narration: >
      [[mark:open-position-board]] ဘာလို့ ဒီလို ဖြစ်ရတာလဲ။
      [[mark:draw-position-tree]] React က state ကို component function ထဲမှာ
      မသိမ်းပါဘူး။ component tree ထဲက အဲဒီ component ရဲ့ နေရာမှာ သိမ်းတာပါ။
      [[mark:draw-same-slot]] စားပွဲ ပြောင်းတာက TableNote အတူတူကို နေရာ
      အတူတူမှာပဲ prop အသစ်နဲ့ ပြန် render လုပ်တာမို့၊ state က အဲဒီအတိုင်း
      ကျန်နေတာပါ။ [[mark:draw-key-slot]] key က အဲဒါကို ပြောင်းပေးပါတယ်။ စားပွဲ
      နံပါတ်ကို key ပေးလိုက်ရင်၊ key ပြောင်းတိုင်း React အတွက် component အသစ်
      ဖြစ်သွားလို့၊ state အဟောင်း ပစ်ပြီး အစကနေ ပြန်စပါတယ်။
      [[mark:close-position-board]] ထည့်ကြည့်ရအောင်။ [[mark:type-key]]
      TableNote tag မှာ key တစ်ခု ထပ်ထည့်ရုံပါ။ [[mark:select-key]] ဒီ key
      ကတော့ စားပွဲ နံပါတ်ပါ။ key ကို TableNote က prop အနေနဲ့ မရလို့၊ စားပွဲ
      နံပါတ်ကို tableId နဲ့ သီးသန့် ပေးထားရတာပါ။ [[mark:input-name-again]] ဖိုင် ပြင်လို့ page
      ပြန်ပွင့်သွားတဲ့အတွက်၊ စားပွဲ 1 မှာ နာမည် ပြန်ရိုက်ရအောင်။
      [[mark:click-table-2-again]] ပြီးရင် စားပွဲ 2 ကို ပြောင်းလိုက်ပါမယ်။
      ဒီတစ်ခါတော့ စားပွဲ 2 က form အလွတ်နဲ့ စပါပြီ။
      [[mark:click-table-1-again]] စားပွဲ 1 ပြန်သွားတော့လည်း နာမည်
      ပျောက်သွားပါပြီ။ key ပြန်ပြောင်းလို့ ဒါလည်း component အသစ် ဖြစ်ပြန်တာပါ။
      စားပွဲတိုင်း မှတ်ချက် သိမ်းထားချင်ရင်၊ state ကို App ထဲ ရွှေ့ပြီး စားပွဲ
      နံပါတ်နဲ့ သိမ်းရပါမယ်။
    sources:
      - title: "React — Preserving and Resetting State"
        url: "https://react.dev/learn/preserving-and-resetting-state"
      - title: "React — Resetting state with a key"
