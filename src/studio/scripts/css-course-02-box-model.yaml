# CSS course (Burmese), lesson 2 of 43: the box model.
#
# Narration is Burmese, applied from voice-script.md next to this file
# (DESIGN.md is the span-by-span brief). Every [[mark:…]] sits where its
# action begins, at a sentence end; each span carries one piece of meaning.
# Everything the learner sees (title, chapters, whiteboard labels, UI strings)
# is Burmese too.
#
# Shape: board (recall lesson 1, the 100 → 142 puzzle, everything is a box) →
# code tour (index.html: the new stamp and tag; empty styles.css) → the stamp
# grows 100 → 142 live → board (the four areas, the sum, the picture-frame
# analogy) → padding, border, margin on the menu cards → outline on the badge
# → board (who decides a box's size: extrinsic vs intrinsic) → fixed height
# overflows today's special, then height: auto hands the height back to the
# content → the English tag as an inline-block, then min-content → box-sizing
# content-box (no change) then border-box (142 → 100) on the stamp → board
# (the 260 / 200 check) → a 100%-wide hero sticks out of the page, and the
# global border-box reset at the top of styles.css pulls it back → board
# (the DevTools box-model diagram) → recap, hand-off to selectors (lesson 3).
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set(; no postcss config. Every typed
# state is plain CSS that hot-swaps with no reload, so no interaction is ever
# lost and no index.html edit is needed. Values were picked so that no prefix
# of them misleads mid-typing (unitless "padding: 2" is invalid and ignored;
# colour keywords gold, khaki, tan, tomato and saddlebrown have no valid
# prefix).
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
