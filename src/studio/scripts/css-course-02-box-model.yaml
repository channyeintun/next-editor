      # base.css: sections A and B of the course kit WITHOUT the B2 box-sizing
      # reset (this lesson types it) and without section C, so cards, badges
      # and the hero start with no padding, border or margin. Section E pins
      # only the menu list reset (no bullets, no indent): never typed, never
      # shown, and nothing the lesson's demos rely on being absent.
      base.css: |
        /*
          base.css: pinned, never typed during a lesson.
          The shop's palette and the page basics, so the CSS a lesson types can
          focus on one idea. Lesson 2 keeps sections A and B only: no box-sizing
          reset (the lesson types it) and no card furniture.
        */

        /* == A. palette == */
        :root {
          color-scheme: light;
          --tea-dark: #3b2314;
          --tea: #8b5a2b;
          --tea-light: #c9a27e;
          --cream: #fff8ec;
          --paper: #fdf3e1;
          --leaf: #2f6b3a;
          --gold: #c9a227;
          --chili: #b23a2b;
          --ink: #2b1d14;
          --muted: #6b5a4c;
          --line: #e6d5bf;
          --radius: 12px;
        }

        /* == B. page == */
        body {
          margin: 0;
          font-family: "Noto Sans Myanmar", "Myanmar Sangam MN", "Myanmar MN", "Myanmar Text", "Padauk",
            system-ui, sans-serif;
          font-size: 16px;
          line-height: 1.8;
          color: var(--ink);
          background: var(--paper);
        }

        .page {
          padding: 0 16px 24px;
        }

        h1,
        h2,
        h3 {
          margin: 0 0 8px;
          line-height: 1.5;
        }

        h1 {
          font-size: 24px;
        }

        h2 {
          font-size: 20px;
        }

        h3 {
          font-size: 17px;
        }

        a {
          color: var(--tea);
        }

        /* Status lines that only expect.preview reads (kit.js data-report, data-say). */
        .visually-hidden {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip-path: inset(50%);
          white-space: nowrap;
        }

        /* == E. lesson rules == */
        /* Lesson 2: the drinks list without bullets or indent, so each card's
           own margin is the only space around it. */
        .menu {
          margin: 0;
          padding: 0;
          list-style: none;
        }
      styles.css: ""

