  defaultMode: fixture
  fixture:
    latencyMs: 600
    result:
      status: success
      stdout: "today is 30 degrees

        it feels hot

        doubled past 100: 128

        3...

        2...

        1...

        lap 1

        lap 2

        lap 3

        12 degrees

        21 degrees

        30 degrees\n"
      stderr: ""

scenes:
  - id: if-expression
    chapter: if ဆိုတာ expression တစ်ခု
    narration: >-
      [[mark:open-board]] program တစ်ခုဆိုတာ အခြေအနေကို ကြည့်ပြီး ရွေးချယ်ရတာတွေ ရှိသလို၊ အလုပ်
      တစ်ခုကို ထပ်ခါထပ်ခါ လုပ်ရတာတွေလည်း ရှိပါတယ်။ ဒီလို program ရဲ့ သွားလမ်းကို ထိန်းတာကို control
      flow လို့ ခေါ်ပါတယ်။ ဒီ lesson မှာ ရွေးချယ်ဖို့အတွက် if ကို သုံးမှာ ဖြစ်ပြီး၊ ထပ်ခါထပ်ခါ
      လုပ်ဖို့အတွက်တော့ loop သုံးမျိုးကို ကြည့်သွားပါမယ်။ [[mark:draw-cond]] if က condition တစ်ခုကို
      စစ်ပါတယ်။ condition ဆိုတာ bool တစ်ခု ဖြစ်ပြီး၊ အဖြေက true ဒါမှမဟုတ် false ထွက်မယ့် မေးခွန်း
      တစ်ခုလို့ မြင်လို့ ရပါတယ်။ ဥပမာအားဖြင့် today က 25 ထက် ကြီးလား ဆိုတာမျိုးပါ။
      [[mark:draw-branches]] အဖြေက true ဆိုရင် ပထမ branch ကို run ပြီး၊ false ဆိုရင်တော့ else branch
      ကို run ပါတယ်။ [[mark:draw-result]] Rust မှာ ထူးခြားတာက ဒီနေရာပါ။ if ဆိုတာ expression တစ်ခု
      ဖြစ်တဲ့အတွက်၊ တန်ဖိုး တစ်ခု ပြန်ပေးပါတယ်။ ဆိုလိုတာက၊ run သွားတဲ့ branch ရဲ့ တန်ဖိုးက label ထဲ
      ရောက်သွားတာပါ။ တခြား ဘာသာစကား အများစုမှာဆိုရင် ဒီအလုပ်အတွက် question mark နဲ့ colon သုံးတဲ့
      operator သီးသန့် တစ်ခု လိုပါတယ်။ Rust မှာတော့ အဲဒီလို operator မရှိပါဘူး။ ဘာကြောင့်လဲဆိုတော့၊
      if ကိုယ်တိုင်က အဲဒီ အလုပ်ကို လုပ်ပေးနေလို့ပါ။
    sources:
      - title: "The Rust Book — if Expressions"
        url: "https://doc.rust-lang.org/book/ch03-05-control-flow.html#if-expressions"
      - title: "The Rust Reference — if expressions"
        url: "https://doc.rust-lang.org/reference/expressions/if-expr.html"
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { mark: open-board }
        open: true
        upsertIds: [b1-title]
      - id: draw-cond
        type: whiteboard.apply
        at: { mark: draw-cond }
        upsertIds: [b1-cond, b1-cond-t, b1-bool]
        drawMs: 1400
      - id: draw-branches
        type: whiteboard.apply
        at: { mark: draw-branches }
        upsertIds:
          [b1-arrow-true, b1-true, b1-hot, b1-hot-t, b1-arrow-false, b1-false, b1-mild, b1-mild-t]
        drawMs: 3200
      - id: draw-result
        type: whiteboard.apply
        at: { mark: draw-result }
        upsertIds: [b1-arrow-hot, b1-arrow-mild, b1-result, b1-result-t]
        drawMs: 2000

  - id: build-if
    narration: >-
      ကဲ၊ ရေးကြည့်ရအောင်။ [[mark:open-main]] ဖိုင်ထဲမှာ အခု ရှိနေတာက today ဆိုတဲ့ variable ပါ၊
      တန်ဖိုးက 30 ပါ။ [[mark:type-if]] ရလဒ်ကို label လို့ နာမည် ပေးပြီး၊ equal sign ရဲ့ ညာဘက်မှာ if
      တစ်ခုလုံးကို ရေးပါတယ်။ branch တစ်ခုစီမှာ တန်ဖိုး တစ်ခုစီ ပါပါတယ်၊ hot ဒါမှမဟုတ် mild ပါ။
      [[mark:select-cond]] condition ကို ကွင်းခတ်စရာ မလိုတာ သတိထား ကြည့်ပါ။ ကွင်း ထည့်ရေးလိုက်ရင်
      compiler က မလိုအပ်ဘူးဆိုပြီး warning ပြပါလိမ့်မယ်။ [[mark:select-branches]] ပြီးတော့ hot
      နောက်မှာရော mild နောက်မှာရော semicolon မပါတာကိုလည်း ကြည့်ပါ။ function lesson မှာ
      တွေ့ခဲ့ပြီးသားအတိုင်း၊ block တစ်ခုရဲ့ တန်ဖိုးဆိုတာ သူ့ရဲ့ နောက်ဆုံး expression ပါ။ semicolon
      ကတော့ let တစ်ခုလုံးရဲ့ အဆုံးမှာ တစ်ခါပဲ လာပါတယ်။ [[mark:type-print]] ပြီးရင် label ကို print
      ထုတ်ကြည့်ပါမယ်။
    sources:
      - title: "The Rust Book — Using if in a let Statement"
        url: "https://doc.rust-lang.org/book/ch03-05-control-flow.html#using-if-in-a-let-statement"
      - title: "The Rust Book — Statements and Expressions"
        url: "https://doc.rust-lang.org/book/ch03-03-how-functions-work.html#statements-and-expressions"
      - title: "The Rust Reference — if expressions"
        url: "https://doc.rust-lang.org/reference/expressions/if-expr.html"
      - title: "The rustc book — unused_parens lint"
        url: "https://doc.rust-lang.org/rustc/lints/listing/warn-by-default.html#unused-parens"
    actions:
      - id: close-board1
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: main.rs
      - id: type-if
        type: editor.type
        at: { mark: type-if, offsetMs: -200 }
        target:
          file: main.rs
          after: "    println!(\"today is {today} degrees\");\n"
          occurrence: 1
        cadence: fast-explainer
        text: "    let label = if today > 25 { \"hot\" } else { \"mild\" };\n"
      - id: select-cond
        type: editor.select
        at: { mark: select-cond }
        target:
          file: main.rs
          text: "today > 25"
          occurrence: 1
      - id: select-branches
        type: editor.select
        at: { mark: select-branches }
        target:
          file: main.rs
          text: '{ "hot" } else { "mild" }'
          occurrence: 1
      - id: type-print
        type: editor.type
        at: { mark: type-print }
        target:
          file: main.rs
          after: "{ \"mild\" };\n"
          occurrence: 1
        cadence: line-by-line
        text: "    println!(\"it feels {label}\");\n"

  - id: compiler-rules
    chapter: Compiler က ဘာ စစ်လဲ
    narration: >-
      [[mark:open-rules]] program run မလုပ်ခင်မှာ compiler က if နဲ့ ပတ်သက်ပြီး စည်းကမ်း နှစ်ချက်ကို
      စစ်ပါတယ်။ [[mark:draw-rule-one]] ပထမ အချက်က၊ condition က bool ဖြစ်ကို ဖြစ်ရပါမယ်။ တချို့
      ဘာသာစကားတွေမှာ ကိန်းဂဏန်း တစ်ခုကို condition အနေနဲ့ တန်းသုံးလို့ ရပြီး၊ သုည ဆိုရင် false လို့
      ယူဆပါတယ်။ Rust ကတော့ ဒီလို ခန့်မှန်းပြီး မလုပ်ပေးပါဘူး။ [[mark:draw-error-one]] if today လို့
      ရေးလိုက်ရင် compiler က E0308 error၊ mismatched types နဲ့ ရပ်သွားပါတယ်။ ဆိုလိုတာက၊ bool ကို
      မျှော်လင့်ထားတဲ့ နေရာမှာ integer တစ်ခု တွေ့သွားလို့ပါ။ [[mark:draw-fix-one]] ဒါကြောင့်
      နှိုင်းယှဉ်တဲ့ အပိုင်းကို ကိုယ်တိုင် ရေးပေးရပါတယ်။ အဲဒီလို ရေးလိုက်တော့ ဒီ code က ဘာကို
      စစ်နေလဲ ဆိုတာ အတိအကျ သိသာသွားပါတယ်။ [[mark:draw-rule-two]] ဒုတိယ အချက်က၊ branch နှစ်ခုလုံးက
      type တူတဲ့ တန်ဖိုး ပြန်ပေးရပါမယ်။ ဘာကြောင့်လဲဆိုတော့၊ label မှာ type တစ်ခုတည်း ရှိရမှာ
      ဖြစ်ပြီး၊ အဲဒီ type ကို compile လုပ်ချိန်မှာတင် သိထားရလို့ပါ။ [[mark:draw-error-two]]
      ဒါကြောင့် branch တစ်ခုမှာ စာသား၊ နောက် တစ်ခုမှာ ကိန်းဂဏန်း ပြန်ပေးမိရင်လည်း E0308 error ပါပဲ။
      if နဲ့ else မှာ type မကိုက်ဘူးလို့ compiler က ပြောပါလိမ့်မယ်။
    sources:
      - title: "Rust error codes — E0308"
        url: "https://doc.rust-lang.org/error_codes/E0308.html"
      - title: "The Rust Book — if Expressions"
        url: "https://doc.rust-lang.org/book/ch03-05-control-flow.html#if-expressions"
      - title: "The Rust Book — Using if in a let Statement"
        url: "https://doc.rust-lang.org/book/ch03-05-control-flow.html#using-if-in-a-let-statement"
    actions:
      - id: open-rules
        type: whiteboard.apply
        at: { mark: open-rules }
        open: true
        clear: true
        upsertIds: [b2-title]
      - id: draw-rule-one
        type: whiteboard.apply
        at: { mark: draw-rule-one }
        upsertIds: [b2-rule1]
        drawMs: 1000
      - id: draw-error-one
        type: whiteboard.apply
        at: { mark: draw-error-one }
        upsertIds: [b2-bad1, b2-bad1-line, b2-err1a, b2-err1b]
        drawMs: 2600
      - id: draw-fix-one
        type: whiteboard.apply
        at: { mark: draw-fix-one }
        upsertIds: [b2-good1, b2-check1]
        drawMs: 1400
      - id: draw-rule-two
        type: whiteboard.apply
        at: { mark: draw-rule-two }
        upsertIds: [b2-rule2]
        drawMs: 1200
      - id: draw-error-two
        type: whiteboard.apply
        at: { mark: draw-error-two }
        upsertIds: [b2-bad2, b2-bad2-line, b2-err2a, b2-err2b]
        drawMs: 2800

  - id: loop-break
    chapter: Loop သုံးမျိုး
    narration: >-
      အခု ထပ်ခါထပ်ခါ လုပ်တဲ့ အပိုင်းကို ကြည့်ရအောင်။ ပထမဆုံး loop ကတော့ နာမည်ကိုက loop လို့
      ခေါ်ပါတယ်။ [[mark:type-loop]] ဒီ loop က ရပ်ခိုင်းမှ ရပ်ပါတယ်၊ မရပ်ခိုင်းသရွေ့ အဆုံးမရှိ
      ပတ်နေမှာပါ။ ဒီမှာ n က 1 ကနေ စပြီး၊ တစ်ကြိမ် ပတ်တိုင်း နှစ်ဆ တိုးသွားပါတယ်။
      [[mark:select-if-no-else]] ဒီ if မှာ else မပါတာ သတိထား ကြည့်ပါ။ ဒီလို ရေးလို့ ရပါတယ်။
      ဘာကြောင့်လဲဆိုတော့၊ ဒီ if ရဲ့ တန်ဖိုးကို ကိုယ်က မသုံးလို့ပါ။ ဘယ်အချိန် ရပ်မလဲ ဆိုတာကိုပဲ သူက
      ဆုံးဖြတ်ပေးတာပါ။ [[mark:select-break]] break က loop ကို ရပ်ပေးတာ ဖြစ်ပြီး၊ ရပ်တဲ့အခါ တန်ဖိုး
      တစ်ခုကိုပါ အပြင် သယ်ထွက်လို့ ရပါတယ်။ ဒါကြောင့် loop ကလည်း if လိုပဲ expression တစ်ခု ဖြစ်ပါတယ်။
      သူ့ရဲ့ တန်ဖိုးက big ထဲ ရောက်သွားပြီး၊ big က နောက်ပိုင်း ဘယ်တော့မှ မပြောင်းတော့တဲ့အတွက် mut
      လည်း မလိုပါဘူး။ ဒီလို တန်ဖိုး ပြန်ပေးတာကို loop ပဲ လုပ်နိုင်ပါတယ်။ ဘာကြောင့်လဲဆိုတော့၊ while
      နဲ့ for ကတော့ break မပါဘဲလည်း အဆုံးသတ်သွားနိုင်လို့ပါ။
    sources:
      - title: "The Rust Book — Returning Values from Loops"
        url: "https://doc.rust-lang.org/book/ch03-05-control-flow.html#returning-values-from-loops"
      - title: "The Rust Reference — break and loop values"
        url: "https://doc.rust-lang.org/reference/expressions/loop-expr.html#break-and-loop-values"
      - title: "Rust error codes — E0571"
        url: "https://doc.rust-lang.org/error_codes/E0571.html"
    actions:
      - id: close-rules
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: type-loop
        type: editor.type
        at: { mark: type-loop, offsetMs: -200 }
        target:
          file: main.rs
          after: "    println!(\"it feels {label}\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "

          \    let mut n = 1;

          \    let big = loop {

          \        n *= 2;

          \        if n > 100 {

          \            break n;

          \        }

          \    };

          \    println!(\"doubled past 100: {big}\");\n"
      - id: select-if-no-else
        type: editor.select
        at: { mark: select-if-no-else }
        target:
          file: main.rs
          text: "if n > 100 {"
          occurrence: 1
      - id: select-break
        type: editor.select
        at: { mark: select-break }
        target:
          file: main.rs
          text: "break n;"
          occurrence: 1

  - id: while-loop
    narration: >-
      [[mark:type-while]] ဒုတိယ loop က while ပါ။ ဒါကို 3 ကနေ နောက်ပြန် ရေတွက်တဲ့ countdown အတွက်
      သုံးကြည့်ရအောင်။ [[mark:select-while]] while က တစ်ကြိမ် မပတ်ခင်တိုင်း သူ့ condition ကို အရင်
      စစ်ပြီး၊ false ဖြစ်တာနဲ့ ချက်ချင်း ရပ်ပါတယ်။ ဒီမှာဆိုရင် countdown က သုည ရောက်သွားတဲ့အခါ
      ရပ်မှာပါ။ ဘယ်နှစ်ကြိမ် ပတ်ရမလဲ ဆိုတာ ကြိုမသိတဲ့အခါမျိုးမှာ while က အသုံးအဝင်ဆုံးပါ။
    sources:
      - title: "The Rust Book — Conditional Loops with while"
        url: "https://doc.rust-lang.org/book/ch03-05-control-flow.html#conditional-loops-with-while"
    actions:
      - id: type-while
        type: editor.type
        at: { mark: type-while, offsetMs: -200 }
        target:
          file: main.rs
          after: "    println!(\"doubled past 100: {big}\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "

          \    let mut countdown = 3;

          \    while countdown > 0 {

          \        println!(\"{countdown}...\");

          \        countdown -= 1;

          \    }\n"
      - id: select-while
        type: editor.select
        at: { mark: select-while }
        target:
          file: main.rs
          text: "while countdown > 0"
          occurrence: 1

  - id: for-loop
    narration: >-
      [[mark:type-range]] တတိယ loop က for ဖြစ်ပြီး၊ အသုံးအများဆုံး loop လည်း ဖြစ်ပါတယ်။ for က range
      တစ်ခုထဲက တန်ဖိုး တစ်ခုချင်းစီအတွက် တစ်ကြိမ်စီ ပတ်ပေးပါတယ်။ [[mark:select-range]] dot dot equal
      လို့ ရေးထားတဲ့အတွက် range ထဲမှာ အဆုံး ကိန်းပါ ပါဝင်ပြီး၊ ဒီမှာဆိုရင် 1၊ 2 နဲ့ 3 ရပါတယ်။ equal
      sign မပါဘဲ dot dot ပဲ ရေးရင်တော့ range က 3 မရောက်ခင်မှာ ရပ်သွားပါလိမ့်မယ်။ [[mark:type-array]]
      for ကို array ပေါ်မှာလည်း သုံးလို့ ရပါတယ်။ ဒီမှာ အပူချိန် သုံးခု ပါတဲ့ array တစ်ခု ရှိပါတယ်။
      [[mark:select-for-array]] တစ်ကြိမ် ပတ်တိုင်း နောက်တစ်ခု element က temp ထဲ ရောက်လာပါတယ်။
      ကိုယ်တိုင် ထိန်းရမယ့် index မရှိတဲ့အတွက်၊ array အဆုံး ကျော်ပြီး ဖတ်မိစရာလည်း မရှိပါဘူး။
      ဒါကြောင့် counter နဲ့ while သုံးတာထက် for က ပုံမှန်အားဖြင့် ပိုစိတ်ချရပါတယ်။
    sources:
      - title: "The Rust Book — Looping Through a Collection with for"
        url:
          "https://doc.rust-lang.org/book/ch03-05-control-flow.html#looping-through-a-collection-with-fo\
          r"
      - title: "The Rust Reference — Range expressions"
        url: "https://doc.rust-lang.org/reference/expressions/range-expr.html"
    actions:
      - id: type-range
        type: editor.type
        at: { mark: type-range, offsetMs: -200 }
        target:
          file: main.rs
          after: "        countdown -= 1;\n    }\n"
          occurrence: 1
        cadence: line-by-line
        text: "

          \    for lap in 1..=3 {

          \        println!(\"lap {lap}\");

          \    }\n"
      - id: select-range
        type: editor.select
        at: { mark: select-range }
        target:
          file: main.rs
          text: "1..=3"
          occurrence: 1
      - id: type-array
        type: editor.type
        at: { mark: type-array, offsetMs: -200 }
        target:
          file: main.rs
          after: "        println!(\"lap {lap}\");

            \    }\n"
          occurrence: 1
        cadence: line-by-line
        text: "

          \    let temps = [12, 21, 30];

          \    for temp in temps {

          \        println!(\"{temp} degrees\");

          \    }\n"
      - id: select-for-array
        type: editor.select
        at: { mark: select-for-array }
        target:
          file: main.rs
          text: "for temp in temps"
          occurrence: 1

  - id: run
    chapter: Run ကြည့်ရအောင်
    narration: >-
      [[mark:run]] ကဲ၊ run ကြည့်ရအောင်။ အပူချိန်က 30 ဖြစ်တဲ့အတွက် it feels hot လို့ ထွက်လာပါတယ်။ n က
      နှစ်ဆ နှစ်ဆ တိုးရင်း 100 ကို ကျော်သွားတဲ့အချိန်မှာ 128 ဖြစ်နေတဲ့အတွက်၊ 128 လို့ ပြပါတယ်။
      ပြီးတော့ countdown က 3၊ 2၊ 1 ပါ။ range ကနေ lap သုံးကြိမ် ထွက်လာပြီး၊ နောက်ဆုံးမှာ array ထဲက
      အပူချိန် တစ်ခုချင်းစီ ထွက်လာပါတယ်။
    sources:
      - title: "Rust by Example — for loops"
        url: "https://doc.rust-lang.org/rust-by-example/flow_control/for.html"
      - title: "Rust by Example — Returning from loops"
        url: "https://doc.rust-lang.org/rust-by-example/flow_control/loop/return.html"
    actions:
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "doubled past 100: 128"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: "let big = loop {"

  - id: wrap
    narration: >-
      ဒါဆို ပြန်ချုပ်ရရင်၊ [[mark:recap-if]] if က branch တစ်ခုကို ရွေးပြီး၊ တန်ဖိုး တစ်ခု
      ပြန်ပေးပါတယ်။ [[mark:recap-loop]] loop က break မတွေ့မချင်း ပတ်နေပြီး၊ သူလည်း တန်ဖိုး
      ပြန်ပေးနိုင်ပါတယ်။ [[mark:recap-while]] while ကတော့ condition က true ဖြစ်နေသရွေ့ ထပ်ခါထပ်ခါ
      ပတ်ပါတယ်။ [[mark:recap-for]] ပြီးတော့ for က range ဒါမှမဟုတ် array ထဲက တန်ဖိုး တစ်ခုချင်းစီကို
      အစဉ်လိုက် သွားပေးပါတယ်။ နောက် lesson မှာတော့ ownership ကို ကြည့်သွားပါမယ်။ garbage collector
      မပါဘဲ Rust က memory ကို ဘယ်လို စီမံလဲ ဆိုတာပါ။
    sources:
      - title: "The Rust Book — Control Flow"
        url: "https://doc.rust-lang.org/book/ch03-05-control-flow.html"
      - title: "The Rust Book — What Is Ownership?"
        url: "https://doc.rust-lang.org/book/ch04-01-what-is-ownership.html"
    actions:
      - id: open-recap
        type: whiteboard.apply
        at: { mark: recap-if, offsetMs: -300 }
        open: true
        clear: true
        upsertIds: [b3-title]
      - id: recap-if
        type: whiteboard.apply
        at: { mark: recap-if }
        upsertIds: [b3-if-box, b3-if-k, b3-if-arrow, b3-if-d, b3-if-v]
        drawMs: 1600
      - id: recap-loop
        type: whiteboard.apply
        at: { mark: recap-loop }
        upsertIds: [b3-loop-box, b3-loop-k, b3-loop-arrow, b3-loop-d, b3-loop-v]
        drawMs: 1600
      - id: recap-while
        type: whiteboard.apply
        at: { mark: recap-while }
        upsertIds: [b3-while-box, b3-while-k, b3-while-arrow, b3-while-d]
        drawMs: 1400
      - id: recap-for
        type: whiteboard.apply
        at: { mark: recap-for }
        upsertIds: [b3-for-box, b3-for-k, b3-for-arrow, b3-for-d]
        drawMs: 1400

checks:
  - { type: timing.p95Ms, max: 300 }
