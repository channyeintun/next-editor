build:
  voiceProfile: pocket-alba-v1
  seed: 34

runtime:
  kind: rust-playground
  defaultMode: fixture
  fixture:
    latencyMs: 600
    result:
      status: success
      stdout: "today is 30 degrees\nit feels hot\ndoubled past 100: 128\n3...\n2...\n1...\nlap 1\nlap 2\nlap 3\n12 degrees\n21 degrees\n30 degrees\n"
      stderr: ""

scenes:
  - id: if-expression
    chapter: if is an expression
    narration: >
      [[mark:open-board]] Programs make choices, and they repeat work. That's
      control flow. We'll use if to choose, and three kinds of loop to repeat.
      [[mark:draw-cond]] An if checks a condition that's a bool: is today
      greater than twenty-five? [[mark:draw-branches]] When it's true, the
      first branch runs. When it's false, the else branch runs.
      [[mark:draw-result]] Now here's what's different in Rust. if is an
      expression, so it gives back a value. The branch that runs gives its
      value to label. Many languages need a separate operator for this, with a
      question mark and a colon. Rust doesn't have one. if does that job.
    sources:
      - title: "The Rust Book — if Expressions"
        url: "https://doc.rust-lang.org/book/ch03-05-control-flow.html#if-expressions"
      - title: "The Rust Reference — if expressions"
        url: "https://doc.rust-lang.org/reference/expressions/if-expr.html"
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { mark: open-board }
        open: true
        upsertIds: [b1-title]
      - id: draw-cond
        type: whiteboard.apply
        at: { mark: draw-cond }
        upsertIds: [b1-cond, b1-cond-t, b1-bool]
        drawMs: 1400
      - id: draw-branches
        type: whiteboard.apply
        at: { mark: draw-branches }
        upsertIds:
          [b1-arrow-true, b1-true, b1-hot, b1-hot-t, b1-arrow-false, b1-false, b1-mild, b1-mild-t]
        drawMs: 3200
      - id: draw-result
        type: whiteboard.apply
        at: { mark: draw-result }
        upsertIds: [b1-arrow-hot, b1-arrow-mild, b1-result, b1-result-t]
        drawMs: 2000

  - id: build-if
    narration: >
      Let's write it. [[mark:open-main]] So far, today is thirty.
      [[mark:type-if]] We name the result label. Then, on the right of the
      equals sign, we write the whole if, with a value in each branch: hot, or
      mild. [[mark:select-cond]] The condition needs no parentheses. Add them,
      and the compiler warns you. [[mark:select-branches]] There's no
      semicolon after hot, or after mild. You saw this with functions: a
      block's value is its last expression. The semicolon comes once, at the
      end of the whole let.
      [[mark:type-print]] Then we print label.
    sources:
      - title: "The Rust Book — Using if in a let Statement"
        url: "https://doc.rust-lang.org/book/ch03-05-control-flow.html#using-if-in-a-let-statement"
      - title: "The Rust Book — Statements and Expressions"
        url: "https://doc.rust-lang.org/book/ch03-03-how-functions-work.html#statements-and-expressions"
      - title: "The Rust Reference — if expressions"
        url: "https://doc.rust-lang.org/reference/expressions/if-expr.html"
      - title: "The rustc book — unused_parens lint"
        url: "https://doc.rust-lang.org/rustc/lints/listing/warn-by-default.html#unused-parens"
    actions:
      - id: close-board1
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: main.rs
      - id: type-if
        type: editor.type
        at: { mark: type-if, offsetMs: -200 }
        target:
          file: main.rs
          after: "    println!(\"today is {today} degrees\");\n"
          occurrence: 1
        cadence: fast-explainer
        text: "    let label = if today > 25 { \"hot\" } else { \"mild\" };\n"
      - id: select-cond
        type: editor.select
        at: { mark: select-cond }
        target:
          file: main.rs
          text: "today > 25"
          occurrence: 1
      - id: select-branches
        type: editor.select
        at: { mark: select-branches }
        target:
          file: main.rs
          text: '{ "hot" } else { "mild" }'
          occurrence: 1
      - id: type-print
        type: editor.type
        at: { mark: type-print }
        target:
          file: main.rs
          after: "{ \"mild\" };\n"
          occurrence: 1
        cadence: line-by-line
        text: "    println!(\"it feels {label}\");\n"

  - id: compiler-rules
    chapter: What the compiler checks
    narration: >
      [[mark:open-rules]] Before the program runs, the compiler checks two
      rules about if. [[mark:draw-rule-one]] First, the condition must be a
      bool. In some languages, a number works as a condition, and zero means
      false. Rust won't guess. [[mark:draw-error-one]] Write if today, and the
      compiler stops with error E0308, mismatched types. It expected a bool,
      and found an integer. [[mark:draw-fix-one]] So you write the comparison
      yourself, and the code says exactly what it checks.
      [[mark:draw-rule-two]] Second, both branches must give the same type,
      because label needs one type, known at compile time.
      [[mark:draw-error-two]] So a string in one branch and a number in
      the other is also E0308: if and else have incompatible types.
    sources:
      - title: "Rust error codes — E0308"
        url: "https://doc.rust-lang.org/error_codes/E0308.html"
      - title: "The Rust Book — if Expressions"
        url: "https://doc.rust-lang.org/book/ch03-05-control-flow.html#if-expressions"
      - title: "The Rust Book — Using if in a let Statement"
        url: "https://doc.rust-lang.org/book/ch03-05-control-flow.html#using-if-in-a-let-statement"
    actions:
      - id: open-rules
        type: whiteboard.apply
        at: { mark: open-rules }
        open: true
        clear: true
        upsertIds: [b2-title]
      - id: draw-rule-one
        type: whiteboard.apply
        at: { mark: draw-rule-one }
        upsertIds: [b2-rule1]
        drawMs: 1000
      - id: draw-error-one
        type: whiteboard.apply
        at: { mark: draw-error-one }
        upsertIds: [b2-bad1, b2-bad1-line, b2-err1a, b2-err1b]
        drawMs: 2600
      - id: draw-fix-one
        type: whiteboard.apply
        at: { mark: draw-fix-one }
        upsertIds: [b2-good1, b2-check1]
        drawMs: 1400
      - id: draw-rule-two
        type: whiteboard.apply
        at: { mark: draw-rule-two }
        upsertIds: [b2-rule2]
        drawMs: 1200
      - id: draw-error-two
        type: whiteboard.apply
        at: { mark: draw-error-two }
        upsertIds: [b2-bad2, b2-bad2-line, b2-err2a, b2-err2b]
        drawMs: 2800

  - id: loop-break
    chapter: Three kinds of loop
    narration: >
      Now, repeating work. The first loop is called loop.
      [[mark:type-loop]] It repeats forever, until you tell it to stop.
      Here, n starts at one and doubles each time.
      [[mark:select-if-no-else]] This if has no else. That's fine, because we
      don't use its value. It only decides when to stop.
      [[mark:select-break]] break stops the loop, and it can carry a value
      out. So loop is an expression too, like if. Its value goes into big, and
      big doesn't need mut, because it never changes. Only loop can do this,
      since while and for can end without any break.
    sources:
      - title: "The Rust Book — Returning Values from Loops"
        url: "https://doc.rust-lang.org/book/ch03-05-control-flow.html#returning-values-from-loops"
      - title: "The Rust Reference — break and loop values"
        url: "https://doc.rust-lang.org/reference/expressions/loop-expr.html#break-and-loop-values"
      - title: "Rust error codes — E0571"
        url: "https://doc.rust-lang.org/error_codes/E0571.html"
    actions:
      - id: close-rules
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: type-loop
        type: editor.type
        at: { mark: type-loop, offsetMs: -200 }
        target:
          file: main.rs
          after: "    println!(\"it feels {label}\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n    let mut n = 1;\n    let big = loop {\n        n *= 2;\n        if n > 100 {\n            break n;\n        }\n    };\n    println!(\"doubled past 100: {big}\");\n"
      - id: select-if-no-else
        type: editor.select
        at: { mark: select-if-no-else }
        target:
          file: main.rs
          text: "if n > 100 {"
          occurrence: 1
      - id: select-break
        type: editor.select
        at: { mark: select-break }
        target:
          file: main.rs
          text: "break n;"
          occurrence: 1

  - id: while-loop
    narration: >
      [[mark:type-while]] The second is while. Let's use it for a countdown
      from three. [[mark:select-while]] while checks its condition before each
      pass, and stops as soon as it's false. Here, that's when countdown
      reaches zero. while is most useful when you don't know in advance how
      many passes you'll need.
    sources:
      - title: "The Rust Book — Conditional Loops with while"
        url: "https://doc.rust-lang.org/book/ch03-05-control-flow.html#conditional-loops-with-while"
    actions:
      - id: type-while
        type: editor.type
        at: { mark: type-while, offsetMs: -200 }
        target:
          file: main.rs
          after: "    println!(\"doubled past 100: {big}\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n    let mut countdown = 3;\n    while countdown > 0 {\n        println!(\"{countdown}...\");\n        countdown -= 1;\n    }\n"
      - id: select-while
        type: editor.select
        at: { mark: select-while }
        target:
          file: main.rs
          text: "while countdown > 0"
          occurrence: 1

  - id: for-loop
    narration: >
      [[mark:type-range]] The third is for, and it's the loop you'll use
      most. It runs once for each value in a range. [[mark:select-range]] Two
      dots and an equals sign make the range include its end, so this gives
      one, two, and three. Without the equals sign, the range stops just
      before three. [[mark:type-array]] for also works on an array. Here's
      an array of three temperatures.
      [[mark:select-for-array]] Each pass gives you the next element, temp.
      There's no index to manage, so you can't read past the end. That's why
      for is usually safer than while with a counter.
    sources:
      - title: "The Rust Book — Looping Through a Collection with for"
        url: "https://doc.rust-lang.org/book/ch03-05-control-flow.html#looping-through-a-collection-with-for"
      - title: "The Rust Reference — Range expressions"
        url: "https://doc.rust-lang.org/reference/expressions/range-expr.html"
    actions:
      - id: type-range
        type: editor.type
        at: { mark: type-range, offsetMs: -200 }
        target:
          file: main.rs
          after: "        countdown -= 1;\n    }\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n    for lap in 1..=3 {\n        println!(\"lap {lap}\");\n    }\n"
      - id: select-range
        type: editor.select
        at: { mark: select-range }
        target:
          file: main.rs
          text: "1..=3"
          occurrence: 1
      - id: type-array
        type: editor.type
        at: { mark: type-array, offsetMs: -200 }
        target:
          file: main.rs
          after: "        println!(\"lap {lap}\");\n    }\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n    let temps = [12, 21, 30];\n    for temp in temps {\n        println!(\"{temp} degrees\");\n    }\n"
      - id: select-for-array
        type: editor.select
        at: { mark: select-for-array }
        target:
          file: main.rs
          text: "for temp in temps"
          occurrence: 1

  - id: run
    chapter: Run it
    narration: >
      [[mark:run]] Let's run it. [[mark:read-output]] Thirty degrees, so it
      feels hot. Doubling passed one hundred at one hundred twenty-eight. Then
      the countdown: three, two, one. Three laps from the range. And each
      temperature from the array.
    sources:
      - title: "Rust by Example — for loops"
        url: "https://doc.rust-lang.org/rust-by-example/flow_control/for.html"
      - title: "Rust by Example — Returning from loops"
        url: "https://doc.rust-lang.org/rust-by-example/flow_control/loop/return.html"
    actions:
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "doubled past 100: 128"
        timeoutMs: 8000
