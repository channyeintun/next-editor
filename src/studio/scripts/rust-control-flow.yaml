# Rust from zero, lesson 5: control flow. if checks a condition that must be
# a bool, and if is an expression, so a `let` can take its value (a flow
# diagram is drawn in on the whiteboard). The two rules the compiler checks
# about if, and its E0308 answers, go on a second board, since an
# insert-only lesson can't run broken code. Then the three loops, built live:
# loop (break carries a value out), while (a countdown), and for (over an
# inclusive range and over an array). One run, and a recap board.
#
# Both errors quoted on the board and in the narration ("mismatched types /
# expected `bool`, found integer" and "`if` and `else` have incompatible
# types") were confirmed with rustc 1.98 --edition 2024, as were the two
# spoken-only claims: parentheses around an if condition raise the
# unused_parens warning, and `break` with a value inside while is E0571. The
# fixture is the exact output of the final program, which compiles with no
# warnings.
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/rust-control-flow.yaml
schemaVersion: 1

