build:
  # Studio replaces this built-in profile at render time with the Burmese provider chosen in the
  # render console (AthanLab with the user's own key, or VoxCPM2 when that feature is enabled).
  voiceProfile: pocket-alba-v1
  seed: 3103
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "Browser က JavaScript ကိုပဲ သိတယ်"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ editor က TypeScript ရဲ့ အကူအညီနဲ့ အမှားကို အကြောင်းရင်းနားမှာ
      ပြပေးပြီး၊ mouse တင်ကြည့်ရုံနဲ့ function တစ်ခုရဲ့ type တွေကို ပြပေးတယ် ဆိုတာ မြင်ခဲ့ပါတယ်။ ဒီ lesson
      မှာတော့ ကိုယ် ရေးလိုက်တဲ့ TypeScript code က တကယ် run လို့ရတဲ့ JavaScript ဘယ်လို ဖြစ်လာလဲ ဆိုတာကို
      ကြည့်သွားပါမယ်။ [[mark:draw-browser]] ပထမဆုံး သိထားရမှာက၊ browser က JavaScript ကိုပဲ နားလည်တယ်
      ဆိုတာပါ။ type annotation ပါတဲ့ dot ts ဖိုင်ကို browser ထဲ တိုက်ရိုက်
      ထည့်ပေးလိုက်ရင်၊ နာမည်နောက်မှာ type ရေးထားတဲ့ အပိုင်းက JavaScript မှာ မရှိတဲ့ ရေးပုံ ဖြစ်လို့၊ browser က
      နားမလည်ဘဲ syntax error နဲ့ ချက်ချင်း ရပ်သွားပါတယ်။ [[mark:think-strip]] ဒါဆို type တွေကို လက်နဲ့
      ဖျက်ပြီး run ရင်ရော။ browser ကတော့ run နိုင်သွားပေမယ့်၊ type checker စစ်စရာ type တွေ မရှိတော့လို့
      TypeScript ရေးရတဲ့ အကျိုး ပျောက်သွားပါတယ်။ ဒါကြောင့် code ကို dot ts ဖိုင်မှာပဲ ဆက်ရေးထားပြီး၊ run ခါနီးမှ
      tool တစ်ခုက JavaScript ဖိုင်ကို ထုတ်ပေးတဲ့ နည်းကို သုံးကြပါတယ်။
      [[mark:draw-pipeline]] TypeScript ရဲ့ ကိုယ်ပိုင် tool ကတော့ tsc ပါ။ TypeScript ကို project ထဲ
      ထည့်လိုက်တာနဲ့ ပါလာတဲ့ command ဖြစ်ပြီး၊ dot ts ဖိုင်ကို ဖတ်ပြီး type တွေကို စစ်တယ်၊ ပြီးတော့ type တွေကို
      ဖယ်ထုတ်ပြီး dot js ဖိုင်ကို ရေးပေးပါတယ်။ browser က တကယ် run တာက အဲဒီ dot js ဖိုင်ပါ။
      [[mark:draw-transpile]] ဒီလို TypeScript code ကို JavaScript code ပြန်ပြောင်းတာကို transpile လို့
      ခေါ်ပါတယ်။ code တစ်မျိုးကနေ လူ ဖတ်လို့ရတဲ့ နောက် code တစ်မျိုးကို ပြောင်းတာမို့ ဒီလို ခေါ်တာပါ။
      compile လို့ ခေါ်တာလည်း ကြားရပါလိမ့်မယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 3: TypeScript in the Development Pipeline",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/typescript-in-the-development-pipeline",
        }
      - {
          title: "TypeScript Handbook: The Basics (tsc, the TypeScript compiler)",
          url: "https://www.typescriptlang.org/docs/handbook/2/basic-types.html#tsc-the-typescript-compiler",
        }
      - {
          title: "TypeScript Handbook: The Basics (erased types)",
          url: "https://www.typescriptlang.org/docs/handbook/2/basic-types.html#erased-types",
        }
    actions:
      - id: open-board-a
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-browser
        type: whiteboard.apply
        at: { mark: draw-browser }
        upsertIds:
          [
            a-ts-box,
            a-ts-name,
            a-ts-sub,
            a-arrow-1,
            a-browser-box,
            a-browser-name,
            a-browser-sub,
            a-arrow-2,
            a-err-box,
            a-err-name,
            a-err-sub,
          ]
        drawMs: 4000
      - id: draw-pipeline
        type: whiteboard.apply
        at: { mark: draw-pipeline }
        upsertIds:
          [
            a-ts2-box,
            a-ts2-name,
            a-ts2-sub,
            a-arrow-3,
            a-tsc-box,
            a-tsc-name,
            a-tsc-sub,
            a-arrow-4,
            a-js-box,
            a-js-name,
            a-js-sub,
          ]
        drawMs: 4000
      - id: draw-transpile
        type: whiteboard.apply
        at: { mark: draw-transpile }
        upsertIds: [a-transpile]
        drawMs: 1500

  - id: starter
    narration: >
      [[mark:close-board]] ဒီနေ့ code ကို ကြည့်ရအောင်။ [[mark:open-bill]] ဒါက ဘောင်ချာ စာကြောင်း ထုတ်ပေးတဲ့
      bill ဖိုင်ပါ။ [[mark:select-params]] ဒီ function က မှာတဲ့ ပစ္စည်း၊ ခွက် အရေအတွက်နဲ့ တစ်ခွက်ဈေးကို
      လက်ခံပြီး၊ parameter တစ်ခုချင်းစီမှာ type ရေးထားပါတယ်။ ပစ္စည်း နာမည်က string ဖြစ်ပြီး၊ ခွက်
      အရေအတွက်နဲ့ ဈေးကတော့ number ပါ။ [[mark:select-total]] function ထဲမှာ ခွက် အရေအတွက်ကို ဈေးနဲ့
      မြှောက်ပြီး ကျသင့်ငွေကို တွက်ပါတယ်။ [[mark:select-return]] ပြီးတော့ ပစ္စည်း နာမည်၊ ခွက် အရေအတွက်နဲ့
      ကျသင့်ငွေကို ဆက်ပြီး ဘောင်ချာ စာကြောင်း တစ်ကြောင်း အဖြစ် ပြန်ပေးပါတယ်။ [[mark:open-main]] main
      ဖိုင်ကတော့ ဒီ function ကို import လုပ်ပြီး ဘောင်ချာ သုံးကြောင်း ထုတ်ပါတယ်။ [[mark:select-calls]] ပထမ
      နှစ်ကြောင်းက လက်ဖက်ရည် နှစ်ခွက်နဲ့ ကော်ဖီ တစ်ခွက်ပါ။ [[mark:select-lime]] တတိယ line က သံပုရာရည်
      တစ်ခွက် ဖြစ်ပြီး၊ ဒီ line မှာတော့ ဈေးနှုန်း ထည့်ဖို့ ကျန်ခဲ့ပါတယ်။ အဲဒါ ဘာ ဖြစ်စေလဲ ဆိုတာကို ခဏနေမှ
      ပြန်ကြည့်ပါမယ်။
    sources:
      - {
          title: "TypeScript Handbook: Everyday Types (functions, parameter type annotations)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#parameter-type-annotations",
        }
      - {
          title: "MDN: Template literals",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Template_literals",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: open-bill
        type: workspace.openFile
        at: { mark: open-bill }
        path: src/bill.ts
      - id: select-params
        type: editor.select
        at: { mark: select-params }
        target:
          { file: src/bill.ts, text: "item: string, cups: number, price: number", occurrence: 1 }
      - id: select-total
        type: editor.select
        at: { mark: select-total }
        target: { file: src/bill.ts, text: "const total = cups * price;", occurrence: 1 }
      - id: select-return
        type: editor.select
        at: { mark: select-return }
        target:
          { file: src/bill.ts, text: "return `${item} ${cups} ခွက် ${total} ကျပ်`;", occurrence: 1 }
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: src/main.ts
      - id: select-calls
        type: editor.select
        at: { mark: select-calls }
        target:
          {
            file: src/main.ts,
            text: "console.log(billLine(\"လက်ဖက်ရည်\", 2, 1500));\nconsole.log(billLine(\"ကော်ဖီ\", 1, 1800));",
            occurrence: 1,
          }
      - id: select-lime
        type: editor.select
        at: { mark: select-lime }
        target: { file: src/main.ts, text: 'billLine("သံပုရာရည်", 1)', occurrence: 1 }

  - id: js-output
    chapter: "tsc က ဘာ ထုတ်ပေးလဲ"
    narration: >
      [[mark:panel-ready]] ညာဘက် panel မှာ ဒီတစ်ခါ အောက်ဆုံးမှာ JavaScript output ဆိုတဲ့ အပိုင်း အသစ်
      ပါလာပါတယ်။ ဒါက bill ဖိုင်ကို tsc က JavaScript ပြောင်းရင် ထွက်လာမယ့် bill dot js ဖိုင်ပါ။
      [[mark:open-bill-2]] editor ထဲက bill ဖိုင်နဲ့ ဘေးချင်း ယှဉ်ပြီး ကြည့်ရအောင်။ [[mark:select-params-2]]
      editor ထဲမှာ parameter တွေရဲ့ နောက်မှာ type တွေ ရေးထားပေမယ့်၊ JavaScript output မှာတော့ parameter
      နာမည် သုံးခုပဲ ကျန်ပါတော့တယ်။ type တွေက type checker အတွက်ပဲ ရှိတာ ဖြစ်လို့၊ run မယ့် code ထဲကို
      ပါမသွားတာပါ။ [[mark:read-same]] ကျန်တဲ့ အပိုင်းတွေကို ကြည့်ပါ။ အပေါ်က comment ရော၊ မြှောက်တဲ့ line ရော၊
      ဘောင်ချာ စာကြောင်း ဆက်တဲ့ line ရော၊ ကိုယ် ရေးထားတဲ့ အတိုင်း အတိအကျ ရှိနေပါတယ်။ line တွေရဲ့ ရှေ့က
      နေရာလွတ်ကို tsc က သူ့ပုံစံနဲ့ ပြန်စီထားတာလောက်ပဲ ကွာပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 3: TypeScript in the Development Pipeline (running tsc)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/typescript-in-the-development-pipeline",
        }
      - {
          title: "TypeScript Handbook: The Basics (erased types)",
          url: "https://www.typescriptlang.org/docs/handbook/2/basic-types.html#erased-types",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-start-one-error
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-start-output
        type: expect.preview
        at: { afterAction: expect-start-one-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-output }
        attribute: { name: data-count, value: "3" }
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-js-signature
        type: expect.preview
        at: { afterAction: expect-start-output }
        timeoutMs: 5000
        target: { by: testId, value: ts-js-1 }
        textContains: "export function billLine(item, cups, price) {"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-js-file
        type: expect.preview
        at: { afterAction: expect-js-signature }
        timeoutMs: 5000
        target: { by: testId, value: ts-js-1 }
        attribute: { name: data-file, value: "src/bill.ts" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: open-bill-2
        type: workspace.openFile
        at: { mark: open-bill-2 }
        path: src/bill.ts
      - id: select-params-2
        type: editor.select
        at: { mark: select-params-2 }
        target:
          { file: src/bill.ts, text: "item: string, cups: number, price: number", occurrence: 1 }
      - id: expect-js-comment
        type: expect.preview
        at: { mark: read-same }
        timeoutMs: 5000
        target: { by: testId, value: ts-js-1 }
        textContains: "// ဘောင်ချာ တစ်ကြောင်းကို စာသား အဖြစ် ပြန်ပေးတယ်"
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: annotations-vanish
    chapter: "JavaScript က သိပ် မပြောင်းပါဘူး"
    narration: >
      type တစ်ခု ထပ်ထည့်ရင် JavaScript output ဘာ ဖြစ်မလဲ စမ်းကြည့်ရအောင်။
      [[mark:type-return-annotation]] function က ပြန်ပေးမယ့် တန်ဖိုးက string ဖြစ်တယ် ဆိုတာကို parameter
      တွေရဲ့ နောက်မှာ ကိုယ်တိုင် ရေးပေးလိုက်ပါမယ်။ ဒါကို return type လို့ ခေါ်ပြီး၊ ဒီ function ကို သုံးမယ့်
      သူက ဘာ ပြန်ရမလဲ ဆိုတာကို code ဖတ်ရုံနဲ့ သိစေပါတယ်။
      [[mark:read-unchanged]] editor ထဲက code ရှည်လာပေမယ့်၊ JavaScript output ကတော့ စာလုံး တစ်လုံးမှ
      မပြောင်းပါဘူး။ ဒါက TypeScript ရဲ့ အရေးကြီးတဲ့ သဘောပါ။ TypeScript ဆိုတာ ကိုယ့် JavaScript ပေါ်မှာ type
      အလွှာ ပါးပါးလေး တစ်ထပ် ထပ်ထားတာ ဖြစ်ပြီး၊ JavaScript ပြောင်းတဲ့အခါ အဲဒီ အလွှာကိုပဲ ခွာထုတ်လိုက်တာပါ။
      [[mark:explain-no-extra]] ဒါကြောင့် run နေတဲ့ အချိန်မှာ type ကို လိုက်စစ်ပေးမယ့် code တွေ ထပ်ထည့်မပေးသလို၊
      code ကို ပိုမြန်အောင်လည်း ပြင်မပေးပါဘူး။ TypeScript မှာပဲ ရှိတဲ့ enum လို feature တချို့ကတော့
      JavaScript code အသစ် ထုတ်ပေးတဲ့ ချွင်းချက်တွေ ဖြစ်ပြီး၊ နောက်ပိုင်း lesson တစ်ခုမှာ သီးသန့် ကြည့်ပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 3: TypeScript in the Development Pipeline (does TypeScript change my JavaScript?)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/typescript-in-the-development-pipeline",
        }
      - {
          title: "TypeScript Handbook: TypeScript for JavaScript Programmers",
          url: "https://www.typescriptlang.org/docs/handbook/typescript-in-5-minutes.html",
        }
    actions:
      - id: type-return-annotation
        type: editor.type
        at: { mark: type-return-annotation }
        target: { file: src/bill.ts, after: "price: number)", occurrence: 1 }
        text: ": string"
      - id: expect-js-signature-same
        type: expect.preview
        at: { afterAction: type-return-annotation }
        timeoutMs: 8000
        target: { by: testId, value: ts-js-1 }
        textContains: "export function billLine(item, cups, price) {"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-still-one-error
        type: expect.preview
        at: { afterAction: expect-js-signature-same }
        timeoutMs: 5000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: still-runs
    chapter: "Type error ရှိလည်း JavaScript ထွက်ပါတယ်"
    narration: >
      [[mark:read-error]] အခု panel ရဲ့ အပေါ်ဆုံးက Errors ကို ကြည့်ပါ။ main ဖိုင်ရဲ့ ငါးကြောင်းမြောက် line
      မှာ argument သုံးခု လိုပေမယ့် နှစ်ခုပဲ ပေးထားတယ် ဆိုတဲ့ error ရှိနေပါတယ်။ သံပုရာရည်ရဲ့ ဈေး ကျန်ခဲ့တဲ့
      line ပါ။ [[mark:read-nan]] ဒါပေမဲ့ Output ကို ကြည့်ရင် ဘောင်ချာ သုံးကြောင်းလုံး ထွက်လာပြီး၊
      သံပုရာရည်ရဲ့ ကျသင့်ငွေကတော့ ဂဏန်း မဟုတ်ဘူး ဆိုတဲ့ NaN ဖြစ်နေပါတယ်။ ဈေး မပေးထားလို့ undefined နဲ့
      မြှောက်မိသွားတာပါ။ [[mark:read-no-check]] JavaScript output ထဲက function ကို ပြန်ကြည့်ပါ။ ဈေး ပါမပါ
      စစ်တဲ့ code တစ်ကြောင်းမှ မရှိပါဘူး။ type error ဆိုတာ type checker က ကိုယ့်ကို ပေးတဲ့ သတိပေးချက် ဖြစ်ပြီး၊
      tsc က error ရှိနေလည်း JavaScript ဖိုင်ကို ပုံမှန်အတိုင်း ထုတ်ပေးပါတယ်။ ဒါကြောင့် program က run သွားပြီး
      အဖြေ မှားထွက်လာတာပါ။ [[mark:say-noemitonerror]] error ရှိနေရင် JavaScript ကို မထုတ်စေချင်ဘူး ဆိုရင်တော့၊
      TypeScript ရဲ့ setting တွေ ရေးထားတဲ့ tsconfig ဖိုင်ထဲမှာ no emit on error ဆိုတဲ့ option ကို ဖွင့်ထားလို့
      ရပါတယ်။ ဒါဆို error တွေ အကုန် ပြင်ပြီးမှ
      tsc က JavaScript ဖိုင်တွေကို ရေးပေးပါလိမ့်မယ်။
    sources:
      - {
          title: "TypeScript Handbook: The Basics (emitting with errors)",
          url: "https://www.typescriptlang.org/docs/handbook/2/basic-types.html#emitting-with-errors",
        }
      - {
          title: "TSConfig Reference: noEmitOnError",
          url: "https://www.typescriptlang.org/tsconfig/#noEmitOnError",
        }
      - {
          title: "MDN: NaN",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/NaN",
        }
    actions:
      - id: open-main-2
        type: workspace.openFile
        at: { mark: read-error }
        path: src/main.ts
      - id: select-lime-2
        type: editor.select
        at: { afterAction: open-main-2 }
        target: { file: src/main.ts, text: 'billLine("သံပုရာရည်", 1)', occurrence: 1 }
      - id: expect-arity-code
        type: expect.preview
        at: { afterAction: select-lime-2 }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-code, value: "2554" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-arity-message
        type: expect.preview
        at: { afterAction: expect-arity-code }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Expected 3 arguments, but got 2."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-arity-line
        type: expect.preview
        at: { afterAction: expect-arity-message }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-line, value: "5" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-nan
        type: expect.preview
        at: { mark: read-nan }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-3 }
        textContains: "သံပုရာရည် 1 ခွက် NaN ကျပ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-tea-line
        type: expect.preview
        at: { afterAction: expect-nan }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-1 }
        textContains: "လက်ဖက်ရည် 2 ခွက် 3000 ကျပ်"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-coffee-line
        type: expect.preview
        at: { afterAction: expect-tea-line }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-2 }
        textContains: "ကော်ဖီ 1 ခွက် 1800 ကျပ်"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-js-no-check
        type: expect.preview
        at: { mark: read-no-check }
        timeoutMs: 5000
        target: { by: testId, value: ts-js-1 }
        textContains: "const total = cups * price;\n    return"
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: fix
    narration: >
      [[mark:type-price]] ဒါဆို ကျန်ခဲ့တဲ့ ဈေးကို ထည့်ပေးလိုက်ရအောင်။ သံပုရာရည် တစ်ခွက်က ၁၂၀၀ ကျပ်ပါ။
      [[mark:read-fixed]] Errors အပိုင်းမှာ error မရှိတော့ဘဲ၊ Output မှာ သံပုရာရည်ရဲ့ ကျသင့်ငွေက ၁၂၀၀ ကျပ်
      ဖြစ်သွားပါပြီ။ bill ဖိုင်ကို မပြင်ခဲ့လို့ JavaScript output ကတော့ ခုနက အတိုင်းပဲ ရှိပါတယ်။
    sources:
      - {
          title: "TypeScript Handbook: More on Functions (parameters and arguments)",
          url: "https://www.typescriptlang.org/docs/handbook/2/functions.html",
        }
    actions:
      - id: type-price
        type: editor.type
        at: { mark: type-price }
        target: { file: src/main.ts, after: 'billLine("သံပုရာရည်", 1', occurrence: 1 }
        text: ", 1200"
      - id: expect-fixed-clean
        type: expect.preview
        at: { afterAction: type-price }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-fixed-lime
        type: expect.preview
        at: { afterAction: expect-fixed-clean }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-3 }
        textContains: "သံပုရာရည် 1 ခွက် 1200 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: tsconfig
    chapter: "tsconfig နဲ့ tsc command တွေ"
    narration: >
      [[mark:open-tsconfig]] tsc က ဘယ် ဖိုင်တွေကို ဘယ်လို စစ်ပြီး ဘယ်လို ပြောင်းရမလဲ ဆိုတာကို ဒီ tsconfig
      ဖိုင်ကနေ ဖတ်ပါတယ်။ [[mark:select-include]] အောက်ဆုံးက include က src folder ထဲက ဖိုင်တွေကို
      စစ်ပါလို့ ပြောထားတာပါ။ [[mark:select-target]] အပေါ်က target ကတော့ ဘယ် JavaScript version နဲ့
      ထုတ်ရမလဲ ဆိုတာ သတ်မှတ်တာပါ။ ဒီ option တွေကို နောက်ပိုင်း lesson တစ်ခုမှာ အသေးစိတ် ကြည့်ပါမယ်။ [[mark:board-commands]] project အသစ်
      တစ်ခုမှာဆိုရင် ဒီ ဖိုင်ကို ကိုယ်တိုင် စရေးစရာ မလိုပါဘူး။ [[mark:draw-init]] tsc ကို init option နဲ့
      run လိုက်ရင်၊ အကြံပြုထားတဲ့ setting တွေ ပါတဲ့ tsconfig ဖိုင်ကို ဆောက်ပေးပါတယ်။ [[mark:draw-tsc]] ပြီးရင်
      project folder ထဲမှာ tsc ကို ဒီအတိုင်း run လိုက်တာနဲ့၊ dot ts ဖိုင် အားလုံးကို စစ်ပြီး dot js ဖိုင်တွေ
      ထုတ်ပေးပါတယ်။ error ရှိရင်တော့ terminal မှာ ပြပါတယ်။ [[mark:draw-watch]] ဖိုင် ပြင်တိုင်း tsc ကို
      ပြန် run နေရတာ အလုပ်ရှုပ်ရင် watch mode ကို သုံးပါတယ်။ အဲဒီအခါ tsc က ရပ်မသွားဘဲ ဆက် run နေပြီး၊ ဖိုင်
      တစ်ခု ပြောင်းတာနဲ့ project တစ်ခုလုံးကို ပြန်စစ်ပြီး JavaScript ကို ပြန်ထုတ်ပေးပါတယ်။
      [[mark:draw-gitignore]] နောက်ဆုံး တစ်ချက်က၊ ထွက်လာတဲ့ dot js ဖိုင်တွေကို git ignore ဖိုင်ထဲ ထည့်ပြီး
      git မှာ မတင်ကြပါဘူး။ [[mark:draw-source]] မူရင်း code က dot ts ဖိုင်တွေ ဖြစ်ပြီး၊ JavaScript ကိုတော့
      လိုတဲ့ အချိန် tsc နဲ့ ပြန်ထုတ်လို့ ရလို့ပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 3: TypeScript in the Development Pipeline (tsc --init, watch mode, version control)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/typescript-in-the-development-pipeline",
        }
      - {
          title: "TypeScript Handbook: What is a tsconfig.json",
          url: "https://www.typescriptlang.org/docs/handbook/tsconfig-json.html",
        }
      - {
          title: "TypeScript Handbook: tsc CLI Options (--init, --watch)",
          url: "https://www.typescriptlang.org/docs/handbook/compiler-options.html",
        }
      - {
          title: "TSConfig Reference: include",
          url: "https://www.typescriptlang.org/tsconfig/#include",
        }
    actions:
      - id: open-tsconfig
        type: workspace.openFile
        at: { mark: open-tsconfig }
        path: tsconfig.json
      - id: select-include
        type: editor.select
        at: { mark: select-include }
        target: { file: tsconfig.json, text: '"include": ["src"]', occurrence: 1 }
      - id: select-target
        type: editor.select
        at: { mark: select-target }
        target: { file: tsconfig.json, text: '"target": "es2022"', occurrence: 1 }
      - id: open-board-b
        type: whiteboard.apply
        at: { mark: board-commands }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-init
        type: whiteboard.apply
        at: { mark: draw-init }
        upsertIds: [b-init-key, b-init-desc]
        drawMs: 1500
      - id: draw-tsc
        type: whiteboard.apply
        at: { mark: draw-tsc }
        upsertIds: [b-tsc-key, b-tsc-desc]
        drawMs: 1500
      - id: draw-watch
        type: whiteboard.apply
        at: { mark: draw-watch }
        upsertIds: [b-watch-key, b-watch-desc]
        drawMs: 1500
      - id: draw-gitignore
        type: whiteboard.apply
        at: { mark: draw-gitignore }
        upsertIds: [b-git-key, b-git-desc]
        drawMs: 1500
      - id: draw-source
        type: whiteboard.apply
        at: { mark: draw-source }
        upsertIds: [b-source]
        drawMs: 1200

  - id: tools
    chapter: "Type ဖယ်တဲ့ tool နဲ့ စစ်တဲ့ tool"
    narration: >
      [[mark:close-board-b]] ဒါပေမဲ့ ဒီ project ရဲ့ tsconfig ကို ပြန်ကြည့်ပါ။ [[mark:select-noemit]] no emit ဆိုတဲ့
      option ကို ဖွင့်ထားပါတယ်။ ဒါက tsc ကို JavaScript ဖိုင် မထုတ်ဘဲ စစ်ရုံပဲ စစ်ပါလို့ ပြောထားတာပါ။ ဘာကြောင့်လဲဆိုတော့
      ဒီ project က Vite နဲ့ run တဲ့ project ဖြစ်ပြီး၊ JavaScript ထုတ်တဲ့ အလုပ်ကို Vite က လုပ်လို့ပါ။ panel ရဲ့
      JavaScript output ကတော့ tsc ထုတ်ရင် ဘာ ထွက်မလဲ ဆိုတာကို သီးသန့် တောင်းပြီး ပြထားတာပါ။
      [[mark:board-tools]] အခုခေတ် project အများစုမှာ ဒီလိုပဲ အလုပ်ခွဲထားကြပါတယ်။ [[mark:draw-strippers]] Vite
      နဲ့ esbuild လို tool တွေက dot ts ဖိုင်ထဲက type တွေကို ဖယ်ရုံပဲ ဖယ်ပြီး JavaScript ကို ထုတ်ပေးပါတယ်။
      Node.js ကလည်း ၂၂.၁၈ နဲ့ ၂၄ လို version အသစ်တွေမှာ dot ts ဖိုင်ကို တိုက်ရိုက် run နိုင်ပါပြီ။
      သူကလည်း type တွေကို ဖယ်ပြီးမှ run တာ ဖြစ်လို့၊ ခုနက ပြောခဲ့တဲ့ enum လို feature တွေကိုတော့ မ run
      နိုင်ပါဘူး။ [[mark:draw-fast]] ဒီ tool တွေ မြန်ရတဲ့ အကြောင်းရင်း တစ်ခုက type ကို လုံးဝ မစစ်လို့ပါ။ ဆိုလိုတာက
      type error ရှိနေလည်း သူတို့က ဘာမှ မပြောဘဲ ဆက် run သွားမှာပါ။ ဒီ panel ရဲ့ Output ကလည်း type တွေကို
      ဖယ်ပြီးမှ run တာ ဖြစ်လို့၊ ခုနက error ရှိနေတုန်း ဘောင်ချာ သုံးကြောင်းလုံး ထွက်လာခဲ့တာပါ။
      [[mark:draw-checker]] ဒါကြောင့် type စစ်တဲ့ အလုပ်ကို tsc က သီးသန့် လုပ်ပါတယ်။ no emit နဲ့ run ရင် tsc က
      ဘာ ဖိုင်မှ မထုတ်ဘဲ error ရှိမရှိကိုပဲ ပြောပါတယ်။ code ကို စစ်ပေးတဲ့ linter တစ်ခုလို သုံးတာပါ။
      [[mark:draw-ci]] team တွေက ဒီ command ကို CI ထဲမှာ ထည့်ထားကြပါတယ်။ CI ဆိုတာ code ကို git မှာ
      တင်လိုက်တိုင်း server ပေါ်မှာ အလိုအလျောက် စစ်ပေးတဲ့ စနစ်ပါ။ type error ရှိနေရင် အဲဒီ code ကို main branch
      ထဲ ပေါင်းလို့ မရအောင် ပိတ်ထားနိုင်ပါတယ်။ [[mark:draw-ts7]] TypeScript ၇ မှာတော့ tsc ကို Go နဲ့ ပြန်ရေးထားလို့၊
      project ကြီးတွေမှာ ဒီ စစ်ဆေးမှုက အရင်ကထက် ဆယ်ဆလောက် မြန်လာပါပြီ။ [[mark:draw-panel]]
      ဒီ course ရဲ့ panel ကတော့ TypeScript ၆.၀ compiler ကို သုံးထားပေမယ့်၊ ၇.၀ နဲ့ စစ်ပုံ အတူတူပါပဲ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 3: TypeScript in the Development Pipeline (modern frameworks, TypeScript as a linter)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/typescript-in-the-development-pipeline",
        }
      - {
          title: "Vite: Features — TypeScript (transpile only, run tsc --noEmit)",
          url: "https://vite.dev/guide/features.html#typescript",
        }
      - {
          title: "esbuild: Content types — TypeScript (no type checking)",
          url: "https://esbuild.github.io/content-types/#typescript",
        }
      - {
          title: "Node.js: Modules — TypeScript (type stripping, enabled by default in v22.18.0 / v23.6.0)",
          url: "https://nodejs.org/api/typescript.html",
        }
      - {
          title: "TSConfig Reference: noEmit",
          url: "https://www.typescriptlang.org/tsconfig/#noEmit",
        }
      - {
          title: "Announcing TypeScript 7.0",
          url: "https://devblogs.microsoft.com/typescript/announcing-typescript-7-0/",
        }
    actions:
      - id: close-board-b
        type: whiteboard.apply
        at: { mark: close-board-b }
        open: false
      - id: select-noemit
        type: editor.select
        at: { mark: select-noemit }
        target: { file: tsconfig.json, text: '"noEmit": true', occurrence: 1 }
      - id: open-board-c
        type: whiteboard.apply
        at: { mark: board-tools }
        open: true
        clear: true
        upsertIds: [c-title]
      - id: draw-strippers
        type: whiteboard.apply
        at: { mark: draw-strippers }
        upsertIds: [c-strip-box, c-strip-name, c-strip-node, c-strip-what]
        drawMs: 2500
      - id: draw-fast
        type: whiteboard.apply
        at: { mark: draw-fast }
        upsertIds: [c-strip-fast]
        drawMs: 1000
      - id: draw-checker
        type: whiteboard.apply
        at: { mark: draw-checker }
        upsertIds: [c-check-box, c-check-name, c-check-what, c-check-nojs]
        drawMs: 2500
      - id: draw-ci
        type: whiteboard.apply
        at: { mark: draw-ci }
        upsertIds: [c-check-ci]
        drawMs: 1000
      - id: draw-ts7
        type: whiteboard.apply
        at: { mark: draw-ts7 }
        upsertIds: [c-ts7]
        drawMs: 1500
      - id: draw-panel
        type: whiteboard.apply
        at: { mark: draw-panel }
        upsertIds: [c-panel]
        drawMs: 1200

  - id: recap
    narration: >
      [[mark:close-board-c]] ဒါဆို ပြန်ချုပ်ရရင်၊ browser က JavaScript ကိုပဲ နားလည်တဲ့အတွက်၊ TypeScript
      code ကို transpile လုပ်ပြီး JavaScript ပြောင်းပေးရပါတယ်။ [[mark:recap-js]] အဲဒီအခါ type တွေ
      ဖယ်ထုတ်ခံရရုံပဲ ဖြစ်ပြီး၊ ကျန်တဲ့ code က ကိုယ် ရေးထားတဲ့ အတိုင်းပါပဲ။ type error ရှိနေလည်း JavaScript
      ထွက်ပြီး program run သွားတာမို့၊ error တွေကို ကိုယ်တိုင် ဂရုစိုက် ပြင်ပေးရပါတယ်။ Vite လို tool တွေက type
      ကို ဖယ်ရုံပဲ ဖယ်တာ ဖြစ်လို့၊ type စစ်ဖို့ tsc ကို no emit နဲ့ သီးသန့် run ပြီး CI ထဲမှာ ထည့်ထားပါ။ နောက်
      lesson မှာတော့ type annotation ရေးပုံနဲ့ TypeScript ရဲ့ အခြေခံ type တွေကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 3: TypeScript in the Development Pipeline",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/typescript-in-the-development-pipeline",
        }
      - {
          title: "TypeScript Handbook: The Basics",
          url: "https://www.typescriptlang.org/docs/handbook/2/basic-types.html",
        }
    actions:
      - id: close-board-c
        type: whiteboard.apply
        at: { mark: close-board-c }
        open: false
      - id: open-bill-3
        type: workspace.openFile
        at: { mark: recap-js }
        path: src/bill.ts
      - id: select-annotations
        type: editor.select
        at: { afterAction: open-bill-3 }
        target:
          {
            file: src/bill.ts,
            text: "item: string, cups: number, price: number): string",
            occurrence: 1,
          }
      - id: expect-file-bill
        type: expect.file
        at: { afterAction: select-annotations }
        path: src/bill.ts
        contains: "export function billLine(item: string, cups: number, price: number): string {\n  const total = cups * price;"
      - id: expect-file-main
        type: expect.file
        at: { afterAction: expect-file-bill }
        path: src/main.ts
        contains: 'console.log(billLine("သံပုရာရည်", 1, 1200));'
checks:
  - { type: timing.p95Ms, max: 300 }
