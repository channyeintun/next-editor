  - id: try-it
    chapter: ကိုယ်တိုင် စမ်းကြည့်ပါ
    narration: >-
      [[mark:close-iv]] ကိုယ်တိုင် စမ်းကြည့်ဖို့ တစ်ခု ရှိပါတယ်။ [[mark:sel-try]] ဒီ line အောက်မှာ user ၂၀၇၇
      အတွက်လည်း erasure ကို ခေါ်တဲ့ line တစ်ကြောင်း ထည့်ပြီး run ကြည့်ပါ။ event နှစ်ခုလုံးရဲ့ email ကို
      ဖတ်မရတော့ပေမဲ့၊ user တွေကို ပေးစရာ ရှိတဲ့ စုစုပေါင်းက ယူရို ၁၅၀ အတိုင်း ကျန်ပါလိမ့်မယ်။
      [[mark:recap]] ပြန်ချုပ်ရရင်၊ ledger မှာ personal data မထားဘဲ id ပဲ ထားပြီး၊ record ထဲ ဝင်ရတဲ့
      personal data ကို user ရဲ့ key နဲ့ encrypt လုပ်ထားရင်၊ erasure က history ကို ပြန်ရေးတာ မဟုတ်ဘဲ row
      တစ်ခုနဲ့ key တစ်ခု ဖျက်တာ ဖြစ်သွားပါတယ်။ နောက် lesson ကစပြီး ငွေ flow တွေကို execute လုပ်တဲ့
      အပိုင်းကို ရောက်ပါပြီ။ invariant တစ်ခုကို ဘယ်လို ထိန်းမလဲ ဆိုတဲ့ နည်း သုံးမျိုးနဲ့ စပါမယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Immutability vs GDPR (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#immutability-vs-gdpr",
        }
    actions:
      - { id: close-iv, type: slide.close, at: { mark: close-iv } }
      - id: sel-try
        type: editor.select
        at: { mark: sel-try }
        target:
          { file: main.go, text: 'p.Forget("1042") // user 1042 asked to be erased', occurrence: 1 }

