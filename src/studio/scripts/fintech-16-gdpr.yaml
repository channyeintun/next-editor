      ledger.go: |
        package main

        import (
        	"fmt"
        	"strings"
        )

        // Line is one row of a transaction: an amount on the debit or the credit side of one account.
        type Line struct {
        	Account string
        	Debit   int64
        	Credit  int64
        }

        // Tx is one business event. All of its lines are posted together, or none of them.
        type Tx struct {
        	ID    string
        	Memo  string
        	Lines []Line
        }

        // Ledger is an append-only list of posted transactions. It knows users only by opaque ids.
        type Ledger struct {
        	txs []Tx
        }

        // Post appends a transaction only if its debits equal its credits.
        func (l *Ledger) Post(tx Tx) error {
        	var debit, credit int64
        	for _, line := range tx.Lines {
        		debit += line.Debit
        		credit += line.Credit
        	}
        	if debit != credit {
        		return fmt.Errorf("tx %s is not balanced: debit %s, credit %s", tx.ID, cents(debit), cents(credit))
        	}
        	l.txs = append(l.txs, tx)
        	return nil
        }

        // kindOf reads the account type from the name: "asset:bank" is an asset.
        func kindOf(account string) string {
        	kind, _, _ := strings.Cut(account, ":")
        	return kind
        }

        // Balance derives an account's balance on the side where that kind of account grows.
        func (l *Ledger) Balance(account string) int64 {
        	var debit, credit int64
        	for _, tx := range l.txs {
        		for _, line := range tx.Lines {
        			if line.Account == account {
        				debit += line.Debit
        				credit += line.Credit
        			}
        		}
        	}
        	if kind := kindOf(account); kind == "asset" || kind == "expense" {
        		return debit - credit
        	}
        	return credit - debit
        }

        // cents prints minor units as an amount with two decimals: cents(1234) is "12.34".
        func cents(n int64) string {
        	sign := ""
        	if n < 0 {
        		sign, n = "-", -n
        	}
        	return fmt.Sprintf("%s%d.%02d", sign, n/100, n%100)
        }
      main.go: |
        package main

        import "fmt"

        // Event is an immutable record. Its receipt email is personal data, so it is sealed.
        type Event struct {
        	Seq     uint64
        	User    string // an opaque id, never a name
        	Amount  int64
        	Receipt []byte // the receipt email, encrypted with the user's key
        }

        func main() {
        	p := NewPII()
        	p.Add("1042", "user1042@example.com")
        	p.Add("2077", "user2077@example.com")
        	var l Ledger
        	events := []Event{
        		deposit(p, &l, 1, "1042", 10000),
        		deposit(p, &l, 2, "2077", 5000),
        	}
        	for _, e := range events {
        		show(p, e)
        	}
        }

        // deposit posts the money to the ledger and records an event with the receipt email sealed.
        func deposit(p *PII, l *Ledger, seq uint64, user string, amount int64) Event {
        	must(l.Post(Tx{ID: fmt.Sprint("tx-", seq), Memo: "deposit", Lines: []Line{
        		{Account: "asset:bank", Debit: amount},
        		{Account: "liability:user:" + user, Credit: amount},
        	}}))
        	return Event{Seq: seq, User: user, Amount: amount, Receipt: p.Seal(user, seq, p.profiles[user])}
        }

        func show(p *PII, e Event) {
        	receipt, err := p.Open(e.User, e.Seq, e.Receipt)
        	if err != nil {
        		receipt = "unreadable, " + err.Error()
        	}
        	fmt.Printf("#%d user %s deposit %6s  receipt: %s\n", e.Seq, e.User, cents(e.Amount), receipt)
        }

        func must(err error) {
        	if err != nil {
        		panic(err)
        	}
        }
      pii.go: |
        package main

        import (
        	"crypto/aes"
        	"crypto/cipher"
        	"crypto/sha256"
        	"encoding/binary"
        	"errors"
        )

        // PII is the separate, mutable store for everything personal, keyed by the opaque user id.
        type PII struct {
        	profiles map[string]string // user id → email
        	keys     map[string][]byte // user id → the key for that user's fields inside events
        }

        func NewPII() *PII {
        	return &PII{profiles: map[string]string{}, keys: map[string][]byte{}}
        }

        // Add stores a user's profile and gives the user a key of their own.
        // Demo only: real keys are random and live in a key store, never derived from the id.
        func (p *PII) Add(user, email string) {
        	p.profiles[user] = email
        	key := sha256.Sum256([]byte("demo key for user " + user))
        	p.keys[user] = key[:]
        }

        // nonce must never repeat for one key. Demo only: here it is the event's sequence number;
        // real systems use a random nonce for every encryption.
        func nonce(seq uint64) []byte {
        	n := make([]byte, 12)
        	binary.BigEndian.PutUint64(n[4:], seq)
        	return n
        }

        func gcm(key []byte) cipher.AEAD {
        	block, err := aes.NewCipher(key)
        	must(err)
        	aead, err := cipher.NewGCM(block)
        	must(err)
        	return aead
        }

        // Seal encrypts a personal field with the user's own key (AES-GCM).
        func (p *PII) Seal(user string, seq uint64, field string) []byte {
        	return gcm(p.keys[user]).Seal(nil, nonce(seq), []byte(field), []byte(user))
        }

        // Open decrypts a sealed field. Without the user's key there is nothing to decrypt with.
        func (p *PII) Open(user string, seq uint64, sealed []byte) (string, error) {
        	key, ok := p.keys[user]
        	if !ok {
        		return "", errors.New("no key for user " + user)
        	}
        	plain, err := gcm(key).Open(nil, nonce(seq), sealed, []byte(user))
        	return string(plain), err
        }
