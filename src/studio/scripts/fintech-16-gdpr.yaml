# Fintech Engineering, lesson 16: immutability and the right to erasure (Burmese).
#
# Source: Fintech Engineering Handbook, "Immutability vs GDPR" (CC BY 4.0, Voytek Pitula); fact A15.
# Start state: ledger.go (Line, Tx, Ledger, Post, Balance, cents from kit/go/ledger.go), pii.go
# (PII store: profiles and per-user keys, Seal / Open with AES-GCM; demo keys and nonces are
# derived, with comments saying real systems use random ones), main.go records two deposits in
# the ledger and as events whose receipt email is sealed with the user's key, and reads them back.
# Edits, all insert-only:
#   1. pii.go: Forget deletes the profile row and the key
#   2. main.go: forget user 1042, read the events again  -> run-2: 1042's email unreadable, 2077's fine
#   3. main.go: what the ledger owes after the erasure   -> run-3: 100.00 and 150.00, unchanged
# Figures: clash (erasure vs retention, with the A15 periods), split (ledger ids vs the PII store),
# shred (per-user keys; one deleted), keys (backups and the key store), iv.
# Built by ~/Documents/fintech-course-work/tools/build-lesson.ts; fixtures by sim-go.ts --write.
