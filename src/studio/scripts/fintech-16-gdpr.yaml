  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] Fintech interview တွေမှာ user က data ဖျက်ခိုင်းရင် immutable ledger နဲ့ ဘယ်လို
      ညှိမလဲ လို့ မေးတတ်ပါတယ်။ ledger ကို ဖျက်မယ် လို့ ဖြေတာရော၊ ဘာမှ မဖျက်ဘူး လို့ ဖြေတာရော
      မှားပါတယ်။ အချက် သုံးချက်နဲ့ ဖြေပါ။ [[mark:iv-a]] ပထမ၊ ဥပဒေအရ သိမ်းရမယ့် transaction data ကို
      GDPR ကိုယ်တိုင်က ခြွင်းချက် ပေးထားပြီး၊ AML ရဲ့ retention ကာလ ကုန်ရင်တော့ personal data ကို
      ဖျက်ရတယ် လို့ ပြောပါ။ [[mark:iv-b]] ဒုတိယ၊ ledger က opaque id ပဲ သိပြီး personal data က ဖျက်လို့
      ရတဲ့ သီးသန့် store မှာ ရှိပါတယ်။ [[mark:iv-c]] တတိယ၊ immutable record ထဲ ထည့်ရတဲ့ personal field
      တွေကို user တစ်ယောက်ချင်း key နဲ့ encrypt လုပ်ပြီး၊ key ကို ဖျက်တာနဲ့ erase လုပ်ပါတယ်။
      [[mark:iv-d]] ပြီးရင် key store ရဲ့ backup ကို ဘယ်လို ကိုင်မလဲ၊ ဘယ် field ကို သိမ်းရမလဲ ဆိုတာ
      compliance နဲ့ ဘယ်လို ဆုံးဖြတ်မလဲ ဆိုတာ ဆက်ပြောပါ။
    sources:
