build:
  voiceProfile:
    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 9516

runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "#1 user 1042 deposit 100.00  receipt: user1042@example.com\n#2 user 2077 deposit  50.00  receipt: user2077@example.com\n"
      run-2:
        status: success
        exitCode: 0
        output: "#1 user 1042 deposit 100.00  receipt: user1042@example.com\n#2 user 2077 deposit  50.00  receipt: user2077@example.com\nprofile 1042: \"\"\n#1 user 1042 deposit 100.00  receipt: unreadable, no key for user 1042\n#2 user 2077 deposit  50.00  receipt: user2077@example.com\n"
      run-3:
        status: success
        exitCode: 0
        output: "#1 user 1042 deposit 100.00  receipt: user1042@example.com\n#2 user 2077 deposit  50.00  receipt: user2077@example.com\nprofile 1042: \"\"\n#1 user 1042 deposit 100.00  receipt: unreadable, no key for user 1042\n#2 user 2077 deposit  50.00  receipt: user2077@example.com\nowed to user:1042: 100.00\nowed to all users: 150.00\n"

scenes:
  - id: hook
    chapter: ဖျက်ခိုင်းရင် ဘာလုပ်မလဲ
    narration: >-
      ငွေ system တစ်ခုကို user တစ်ယောက်က ကိုယ့်ရဲ့ personal data အားလုံး ဖျက်ပေးပါ လို့
      တောင်းဆိုလာတယ် ဆိုပါစို့။ [[mark:sel-receipt]] ဒီ program မှာ deposit event တွေ ရှိပြီး၊ event
      တစ်ခုစီထဲမှာ receipt ပို့ရမယ့် email ပါပါတယ်၊ ဒါက personal data ပါ။ [[mark:sel-post]] တစ်ချိန်တည်းမှာ
      ငွေကို ledger ထဲ post လုပ်ပါတယ်။ ledger ရော event log ရော append-only ဖြစ်လို့ ဘယ်တော့မှ
      မဖျက်ရပါဘူး။ [[mark:run-1]] run လိုက်ရအောင်။ [[mark:pt-r1]] event နှစ်ခုလုံးမှာ email ကို ဖတ်လို့
      ရပါတယ်။ [[mark:dock-1]] ဒါဆို ဖျက်ပေးပါ ဆိုတဲ့ request နဲ့ ဘယ်တော့မှ မဖျက်ရတဲ့ record တွေကို
      ဘယ်လို ညှိမလဲ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Immutability vs GDPR (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#immutability-vs-gdpr",
        }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }
      - id: sel-receipt
        type: editor.select
        at: { mark: sel-receipt }
        target:
          {
            file: main.go,
            text: "Receipt []byte // the receipt email, encrypted with the user's key",
            occurrence: 1,
          }
      - id: sel-post
        type: editor.select
        at: { mark: sel-post }
        target:
          {
            file: main.go,
            text: '{Account: "liability:user:" + user, Credit: amount},',
            occurrence: 1,
          }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "receipt: user1042@example.com",
          timeoutMs: 8000,
        }
      - id: pt-r1
        type: console.point
        at: { mark: pt-r1 }
        target: { text: "receipt: user1042@example.com", occurrence: 1 }
      - { id: dock-1, type: runtime.collapseDock, at: { mark: dock-1 } }

  - id: clash
    chapter: Erasure နဲ့ retention
    narration: >-
      [[mark:show-clash]] EU ရဲ့ GDPR မှာ right to erasure ရှိပါတယ်၊ ကိုယ့်အကြောင်း data ကို ဖျက်ခိုင်းနိုင်တဲ့
      အခွင့်အရေးပါ။ [[mark:pt-ledger]] တစ်ဖက်မှာတော့ ငွေ မှတ်တမ်းတွေကို ဘယ်တော့မှ မပြင်၊ မဖျက်ရပါဘူး။
      ကြည့်လိုက်ရင် နှစ်ခု ဆန့်ကျင်နေသလိုပါပဲ။ [[mark:clash-2]] လက်တွေ့မှာ financial record တွေက
      အများစု ခြွင်းချက် ရပါတယ်။ GDPR ရဲ့ Article ၁၇ ကိုယ်တိုင်က၊ EU ဒါမှမဟုတ် member state ဥပဒေ
      တစ်ခုက ပေးထားတဲ့ တာဝန်ကို လိုက်နာဖို့ data လိုအပ်ရင် erasure မသက်ရောက်ဘူး လို့ ခြွင်းချက်
      ထားပါတယ်။ [[mark:clash-3]] အဲဒီ တာဝန်တွေထဲက တစ်ခုက AML ပါ၊ AML ဆိုတာ ငွေကြေး ခဝါချမှုကို
      တားဆီးတဲ့ စည်းမျဉ်းတွေပါ။ EU ရဲ့ AML Directive က customer ကို စစ်ဆေးခဲ့တဲ့ မှတ်တမ်းနဲ့
      transaction သက်သေတွေကို business relationship ပြီးဆုံးပြီး ငါးနှစ် သိမ်းထားဖို့ တောင်းဆိုပါတယ်။
      [[mark:pt-ten]] member state တွေက နောက်ထပ် ငါးနှစ်အထိ တိုးနိုင်ပါတယ်။ [[mark:pt-del]] သတိထားရမှာက
      ဒါ အမြဲတမ်း သိမ်းခွင့် မဟုတ်ပါဘူး။ ၂၀၂၇ ခုနှစ် ဇူလိုင် ၁၀ ရက်ကစပြီး သက်ရောက်မယ့် AML
      Regulation အသစ်က ငါးနှစ်ကို ဆက်ထားပြီး၊ ကာလ ကုန်ရင် personal data ကို ဖျက်ဖို့ တောင်းဆိုပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Immutability vs GDPR (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#immutability-vs-gdpr",
        }
      - { title: "GDPR Article 17 — Right to erasure", url: "https://gdpr-info.eu/art-17-gdpr/" }
      - {
          title: "Directive (EU) 2015/849 Article 40; Regulation (EU) 2024/1624 Articles 77 and 90",
          url: "https://www.legislation.gov.uk/eudr/2015/849/article/40",
        }
    actions:
      - {
          id: show-clash,
          type: slide.show,
          at: { mark: show-clash, offsetMs: -700 },
          slideId: clash-1,
        }
      - {
          id: pt-erase,
          type: slide.point,
          at: { afterAction: show-clash },
          target: { x: 0.225, y: 0.42 },
        }
      - { id: pt-ledger, type: slide.point, at: { mark: pt-ledger }, target: { x: 0.775, y: 0.42 } }
      - { id: clash-2, type: slide.show, at: { mark: clash-2 }, slideId: clash-2 }
      - {
          id: pt-exc,
          type: slide.point,
          at: { afterAction: clash-2 },
          target: { x: 0.324, y: 0.542 },
        }
      - { id: clash-3, type: slide.show, at: { mark: clash-3 }, slideId: clash-3 }
      - {
          id: pt-five,
          type: slide.point,
          at: { afterAction: clash-3 },
          target: { x: 0.481, y: 0.907 },
        }
      - { id: pt-ten, type: slide.point, at: { mark: pt-ten }, target: { x: 0.838, y: 0.907 } }
      - { id: pt-del, type: slide.point, at: { mark: pt-del }, target: { x: 0.813, y: 0.626 } }

  - id: split
    chapter: Personal data ကို ခွဲထားမယ်
    narration: >-
      [[mark:show-split]] ဒါပေမဲ့ ခြွင်းချက်က သိမ်းဖို့ တာဝန်ရှိတာကိုပဲ ကာကွယ်ပေးတာပါ၊ သိမ်းထားချင်တာ
      အားလုံးကို မဟုတ်ပါဘူး။ ဥပမာ marketing အတွက် သိမ်းထားချင်တဲ့ data က ဥပဒေက သိမ်းခိုင်းတဲ့ data မဟုတ်ပါဘူး။ ဒါကြောင့် ပထမ နည်းက personal data ကို financial data ကနေ ခွဲထားတာပါ။
      [[mark:pt-ids]] immutable ledger က user ကို opaque id နဲ့ပဲ သိပါတယ်၊ opaque id ဆိုတာ ဘယ်သူလဲ
      ဆိုတဲ့ အဓိပ္ပာယ် မပါတဲ့ internal နံပါတ်ပါ။ [[mark:split-2]] နာမည်၊ လိပ်စာ၊ document တွေက
      သီးသန့် mutable store မှာ ရှိပြီး၊ id တစ်ခုတည်းက နှစ်ဖက်ကို ချိတ်ပေးပါတယ်။ [[mark:split-3]]
      erasure request လာရင် အဲဒီ store ထဲမှာ သိမ်းဖို့ တာဝန် မရှိတဲ့ field တွေကို ဖျက် ဒါမှမဟုတ် redact
      လုပ်ပြီး၊ တာဝန်ရှိတာကိုတော့ ကာလ ကုန်တဲ့အထိ ထားပါတယ်။ [[mark:pt-same]] ledger ထဲက entry တွေကတော့
      တစ်ကြောင်းမှ မပြောင်းပါဘူး။
    sources:
      - {
          title: "Fintech Engineering Handbook — Immutability vs GDPR (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#immutability-vs-gdpr",
        }
    actions:
      - {
          id: show-split,
          type: slide.show,
          at: { mark: show-split, offsetMs: -700 },
          slideId: split-1,
        }
      - { id: pt-ids, type: slide.point, at: { mark: pt-ids }, target: { x: 0.098, y: 0.414 } }
      - { id: split-2, type: slide.show, at: { mark: split-2 }, slideId: split-2 }
      - {
          id: pt-pii,
          type: slide.point,
          at: { afterAction: split-2 },
          target: { x: 0.609, y: 0.414 },
        }
      - { id: split-3, type: slide.show, at: { mark: split-3 }, slideId: split-3 }
      - {
          id: pt-gone,
          type: slide.point,
          at: { afterAction: split-3 },
          target: { x: 0.756, y: 0.709 },
        }
      - { id: pt-same, type: slide.point, at: { mark: pt-same }, target: { x: 0.25, y: 0.82 } }

  - id: shred
    chapter: Crypto-shredding
    narration: >-
      [[mark:show-shred]] ဒါပေမဲ့ personal data က immutable record ထဲကို ဝင်သွားရတဲ့ အခါတွေ ရှိပါတယ်၊
      ဥပမာ event payload ထဲက email လိုမျိုးပါ။ အဲဒီအတွက် crypto-shredding ကို သုံးပါတယ်။
      [[mark:pt-keys]] user တစ်ယောက်စီအတွက် key သီးသန့် ထားပြီး၊ သူ့ရဲ့ personal field တွေကို အဲဒီ key နဲ့
      encrypt လုပ်ပြီးမှ event ထဲ ထည့်ပါတယ်။ [[mark:shred-2]] ဖျက်ခိုင်းရင် event ကို မထိဘဲ key ကိုပဲ
      ဖျက်ပါတယ်။ [[mark:pt-noise]] key မရှိတော့ရင် ciphertext က ဘယ်သူမှ ဖတ်မရတဲ့ byte တွေပဲ ကျန်ပါတယ်။
      ဆိုလိုတာက erasure က history ကို ပြန်ရေးတာ မဟုတ်ဘဲ key တစ်ခု ဖျက်တာ ဖြစ်သွားပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Immutability vs GDPR (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#immutability-vs-gdpr",
        }
    actions:
      - {
          id: show-shred,
          type: slide.show,
          at: { mark: show-shred, offsetMs: -700 },
          slideId: shred-1,
        }
      - {
          id: pt-e1,
          type: slide.point,
          at: { afterAction: show-shred },
          target: { x: 0.263, y: 0.438 },
        }
      - { id: pt-keys, type: slide.point, at: { mark: pt-keys }, target: { x: 0.788, y: 0.437 } }
      - { id: shred-2, type: slide.show, at: { mark: shred-2 }, slideId: shred-2 }
      - {
          id: pt-k1gone,
          type: slide.point,
          at: { afterAction: shred-2 },
          target: { x: 0.788, y: 0.437 },
        }
      - { id: pt-noise, type: slide.point, at: { mark: pt-noise }, target: { x: 0.195, y: 0.831 } }

  - id: forget
    chapter: Key ကို ဖျက်ကြည့်မယ်
    narration: >-
      [[mark:close-shred]] code မှာ ကြည့်ရအောင်။ [[mark:open-pii]] personal data ကို ကိုင်တဲ့ store က
      ဒီဖိုင်မှာပါ။ [[mark:sel-store]] profile တွေနဲ့ user တစ်ယောက်ချင်းရဲ့ key တွေကို id နဲ့ သိမ်းထားပါတယ်။
      demo ဖြစ်လို့ key ကို id ကနေ ထုတ်ထားပါတယ်။ တကယ့် system မှာ ဒီလို မလုပ်ရပါဘူး၊ id ကနေ key ကို
      ပြန်ထုတ်လို့ ရရင် key ကို ဖျက်တာက ဘာမှ ဖျက်တာ မဟုတ်လို့ပါ၊ random key ကို key store မှာပဲ ထားရပါတယ်။
      [[mark:sel-seal]] seal လုပ်တဲ့ function က user ရဲ့ key နဲ့ AES GCM ကို သုံးပြီး encrypt လုပ်ပါတယ်။
      nonce ကိုလည်း demo မှာ event ရဲ့ နံပါတ်ကနေ ယူထားပြီး၊ တကယ့် system မှာ encrypt တိုင်း random
      nonce ကို သုံးပါတယ်။ [[mark:type-forget]] erasure request အတွက် function တစ်ခု ထည့်ပါမယ်။ profile row ကို
      ဖျက်ပြီး၊ key ကိုလည်း ဖျက်ပါတယ်၊ event log ကိုတော့ လုံးဝ မထိပါဘူး။ [[mark:open-main-2]] main ထဲမှာ
      အဲဒီ function ကို ခေါ်ပါမယ်။ [[mark:type-call]] user ၁၀၄၂ ရဲ့ data ကို ဖျက်ပြီး၊ profile နဲ့ event တွေကို
      ပြန်ဖတ်ပါတယ်။ ဒုတိယ user ရဲ့ event ကရော ဘာဖြစ်မလဲ။ run မလုပ်ခင် ခန့်မှန်းကြည့်ပါ။ [[mark:run-2]]
      run လိုက်ရအောင်။ [[mark:pt-profile]] profile က ဗလာ ဖြစ်သွားပါပြီ။ [[mark:pt-unread]] user ၁၀၄၂ ရဲ့
      event က ရှိနေဆဲ ဖြစ်ပေမဲ့ email ကို ဖတ်လို့ မရတော့ပါဘူး၊ key မရှိလို့ပါ။ [[mark:pt-other]] user ၂၀၇၇
      ရဲ့ event ကတော့ ဖတ်လို့ ရနေဆဲပါ၊ key တွေ သီးသန့် ဖြစ်လို့ တစ်ယောက်ကို ဖျက်တာက တခြားသူကို
      မထိပါဘူး။
    sources:
      - {
          title: "Fintech Engineering Handbook — Immutability vs GDPR (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#immutability-vs-gdpr",
        }
      - {
          title: "Go standard library — crypto/cipher (GCM)",
          url: "https://pkg.go.dev/crypto/cipher#NewGCM",
        }
    actions:
      - { id: close-shred, type: slide.close, at: { mark: close-shred } }
      - { id: open-pii, type: workspace.openFile, at: { mark: open-pii }, path: pii.go }
      - id: sel-store
        type: editor.select
        at: { mark: sel-store }
        target:
          {
            file: pii.go,
            text: "profiles map[string]string // user id → email\n\tkeys     map[string][]byte // user id → the key for that user's fields inside events",
            occurrence: 1,
          }
      - id: sel-seal
        type: editor.select
        at: { mark: sel-seal }
        target:
          {
            file: pii.go,
            text: "return gcm(p.keys[user]).Seal(nil, nonce(seq), []byte(field), []byte(user))",
            occurrence: 1,
          }
      - id: type-forget
        type: editor.type
        at: { mark: type-forget }
        target: { file: pii.go, after: "\treturn string(plain), err\n}\n", occurrence: 1 }
        text: "\n// Forget honours an erasure request: the profile row goes, and so does the key.\nfunc (p *PII) Forget(user string) {\n\tdelete(p.profiles, user)\n\tdelete(p.keys, user)\n}\n"
        cadence: line-by-line
      - { id: open-main-2, type: workspace.openFile, at: { mark: open-main-2 }, path: main.go }
      - id: type-call
        type: editor.type
        at: { mark: type-call }
        target:
          {
            file: main.go,
            after: "\tfor _, e := range events {\n\t\tshow(p, e)\n\t}\n",
            occurrence: 1,
          }
        text: "\n\tp.Forget(\"1042\") // user 1042 asked to be erased\n\tfmt.Printf(\"profile 1042: %q\\n\", p.profiles[\"1042\"])\n\tfor _, e := range events {\n\t\tshow(p, e)\n\t}\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "unreadable, no key for user 1042",
          timeoutMs: 8000,
        }
      - id: pt-profile
        type: console.point
        at: { mark: pt-profile }
        target: { text: "profile 1042", occurrence: 1 }
      - id: pt-unread
        type: console.point
        at: { mark: pt-unread }
        target: { text: "unreadable, no key for user 1042", occurrence: 1 }
      - id: pt-other
        type: console.point
        at: { mark: pt-other }
        target: { text: "receipt: user2077@example.com", occurrence: 2 }
      - {
          id: expect-file-forget,
          type: expect.file,
          at: { afterAction: run-2 },
          path: pii.go,
          contains: "delete(p.keys, user)",
        }

  - id: owed
    narration: >-
      [[mark:type-owed]] ငွေ ဘက်က ဘာဖြစ်လဲ စစ်ကြည့်ရအောင်။ ဒီ line တွေက user ၁၀၄၂ ကို ပေးစရာ ရှိတာနဲ့၊
      user အားလုံးကို ပေးစရာ ရှိတဲ့ စုစုပေါင်းကို ledger ကနေ တွက်ပါတယ်။ erasure က ledger ကို မထိလို့
      ဒီ ဂဏန်းတွေ မပြောင်းသင့်ပါဘူး။ [[mark:run-3]] run လိုက်ရအောင်။ [[mark:pt-owed]] user ၁၀၄၂ ကို
      ပေးစရာ ယူရို ၁၀၀ က ledger ထဲမှာ အတိအကျ ကျန်ပါတယ်။ [[mark:pt-all]] စုစုပေါင်း ယူရို ၁၅၀ လည်း
      မပြောင်းပါဘူး။ [[mark:dock-3]] personal data ကို ဖျက်လိုက်ပေမဲ့ financial history ကတော့ တစ်ကြောင်းမှ
      မပျောက်ပါဘူး။ ဒါက no lost data ဆိုတဲ့ မူပါ၊ ငွေနဲ့ ပတ်သက်ပြီး ဖြစ်ခဲ့သမျှ မပျောက်ရဘူး ဆိုတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Immutability vs GDPR (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#immutability-vs-gdpr",
        }
      - {
          title: "Fintech Engineering Handbook — Principles (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#principles",
        }
    actions:
      - id: type-owed
        type: editor.type
        at: { mark: type-owed }
        target: { file: main.go, after: "\t\tshow(p, e)\n\t}\n", occurrence: 2 }
        text: "\towed := l.Balance(\"liability:user:1042\") + l.Balance(\"liability:user:2077\")\n\tfmt.Println(\"owed to user:1042:\", cents(l.Balance(\"liability:user:1042\")))\n\tfmt.Println(\"owed to all users:\", cents(owed))\n"
        cadence: line-by-line
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "owed to all users: 150.00",
          timeoutMs: 8000,
        }
      - id: pt-owed
        type: console.point
        at: { mark: pt-owed }
        target: { text: "owed to user:1042: 100.00", occurrence: 1 }
      - id: pt-all
        type: console.point
        at: { mark: pt-all }
        target: { text: "owed to all users: 150.00", occurrence: 1 }
      - { id: dock-3, type: runtime.collapseDock, at: { mark: dock-3 } }

  - id: keys
    chapter: ခက်တဲ့ အပိုင်းက key store
    narration: >-
      [[mark:show-keys]] ဒီနည်းမှာ ခက်တဲ့ အပိုင်းက key store ပါ။ [[mark:pt-logb]] event log ရဲ့ backup တွေထဲမှာ
      ciphertext ပဲ ရှိလို့၊ key ဖျက်လိုက်တာနဲ့ backup ထဲက personal data လည်း တစ်ပါတည်း ဖတ်မရတော့ပါဘူး။
      immutable backup တွေကို ပြန်ရေးစရာ မလိုတာ ဒီနည်းရဲ့ အားသာချက်ပါ။ [[mark:keys-2]] ဒါပေမဲ့ key store
      ကိုယ်တိုင်ရဲ့ backup ထဲမှာ ဖျက်လိုက်တဲ့ key ကျန်နေရင် erasure က တကယ် မဖြစ်သေးပါဘူး။ log ဒါမှမဟုတ် cache ထဲမှာ plaintext email ကျန်ခဲ့ရင်လည်း key ဖျက်တာက အဲဒါကို မထိပါဘူး၊ crypto-shredding က ciphertext ကိုပဲ ဖတ်မရအောင် လုပ်တာပါ။ [[mark:keys-3]]
      ပြောင်းပြန်အနေနဲ့ key store ပျက်သွားရင်၊ သိမ်းဖို့ တာဝန်ရှိတဲ့ record တွေထဲက personal data ပါ ဖတ်လို့
      မရတော့ပါဘူး၊ ဒါလည်း data ပျောက်တာပါပဲ။ [[mark:pt-sched]] ဒါကြောင့် key store ကို ledger လိုပဲ
      ဂရုစိုက်ရပြီး၊ key ကို ဖျက်တဲ့ အချိန်ကို erasure request နဲ့ retention ကာလ ကုန်တာနဲ့ ချိတ်ထားရပါတယ်။
      ဘယ် field ကို ဘယ်လောက်ကြာ သိမ်းရမလဲ ဆိုတာ legal နဲ့ compliance ဆုံးဖြတ်ရတာပါ။ engineering ရဲ့
      အလုပ်က အဲဒီ ဆုံးဖြတ်ချက် ဘာပဲ ဖြစ်ဖြစ်၊ ledger ကို မထိဘဲ လုပ်နိုင်အောင် ပြင်ထားတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Immutability vs GDPR (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#immutability-vs-gdpr",
        }
      - {
          title: "Regulation (EU) 2024/1624 Article 77 (retention, then deletion)",
          url: "https://eur-lex.europa.eu/eli/reg/2024/1624/oj/eng",
        }
    actions:
      - {
          id: show-keys,
          type: slide.show,
          at: { mark: show-keys, offsetMs: -700 },
          slideId: keys-1,
        }
      - {
          id: pt-store,
          type: slide.point,
          at: { afterAction: show-keys },
          target: { x: 0.5, y: 0.62 },
        }
      - { id: pt-logb, type: slide.point, at: { mark: pt-logb }, target: { x: 0.175, y: 0.431 } }
      - { id: keys-2, type: slide.show, at: { mark: keys-2 }, slideId: keys-2 }
      - {
          id: pt-keyb,
          type: slide.point,
          at: { afterAction: keys-2 },
          target: { x: 0.825, y: 0.431 },
        }
      - { id: keys-3, type: slide.show, at: { mark: keys-3 }, slideId: keys-3 }
      - {
          id: pt-lost,
