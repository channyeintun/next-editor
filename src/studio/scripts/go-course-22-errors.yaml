        package main

        import (
        	"fmt"
        )

        func main() {
        }
      parcel.go: |
        package main

        // Parcel is one parcel handed in at the counter.
        type Parcel struct {
        	Code     string  // tracking code: "MDY-0001"
        	To       string  // city code: "MDY"
        	WeightKg float64 // weight in kilograms
        }

        // cityNames holds the cities the service sends to, by code.
        var cityNames = map[string]string{
        	"YGN": "ရန်ကုန်",
        	"BGO": "ပဲခူး",
        	"NPT": "နေပြည်တော်",
