# Go course, lesson 22: errors are values (Burmese).
#
# Start state: main.go (an import block holding "fmt", an empty main), parcel.go (Parcel and
# cityNames, COURSE-KIT §3.4), digits.go (only `package main`). Edits, all insert-only:
#   1. cityName(code) (string, error) above main, and a loop over "MDY" and "MDX" that checks err
#      and continues -> run-1: MDY မန္တလေး / error: unknown city "MDX";
#   2. "strconv" into the import block, then Atoi on the COD amount "၁၅၀၀၀" with both results
#      printed -> run-2 adds 0 strconv.Atoi: parsing "၁၅၀၀၀": invalid syntax;
#   3. digits.go: import "fmt" and the error-returning fromMyanmarDigits (COURSE-KIT §3.3), then in
#      main the fallback when Atoi fails, the check with an early return and the amount
#      -> run-3 adds 15000 ကျပ်.
# Boards: (N) the rider comes back with the parcel delivered or a note: a result and an error;
# (Z) an ignored error: the COD becomes 0 kyats, silently; (P) error vs panic; (Q) quiz.
# Fixtures: bun ~/Documents/go-course-work/tools/sim-go.ts <this yaml> --write
schemaVersion: 1

