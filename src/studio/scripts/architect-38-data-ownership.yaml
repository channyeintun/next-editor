        </style>
        <div class="stage">
          <div class="title">ကိုယ်မပိုင်တဲ့ data ကို ဖတ်နည်း 4 မျိုး</div>
          <div class="row" style="top: 30vh"><span class="num">1</span><span class="term wide green">Memory ထဲ မိတ္တူ</span>အမြန်ဆုံး၊ data သေးပြီး ပြောင်းခဲမှ</div>
