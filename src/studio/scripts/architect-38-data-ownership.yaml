          at: { mark: q-why },
          upsertIds: [q-why],
          drawMs: 1200,
        }
      - {
          id: draw-why2,
          type: whiteboard.apply,
          at: { mark: q-why2, offsetMs: 6000 },
          upsertIds: [q-why2],
          drawMs: 1200,
        }

  - id: reading
    chapter: ကိုယ်မပိုင်တဲ့ data ကို ဖတ်နည်း
    narration: >
      [[mark:w-open]] ကိုယ်မပိုင်တဲ့ data ကို ဖတ်တဲ့နည်းက လေးမျိုး ရှိပါတယ်။
      [[mark:w-1]] ပထမက ခုနက ကားလိုင်း နာမည်တွေအတွက် ရွေးခဲ့တဲ့ နည်းပါ။ data တစ်ခုလုံးကို service ရဲ့ memory ထဲမှာ
      မိတ္တူ ထားတာပါ။ အမြန်ဆုံး ဖြစ်ပေမဲ့ data သေးပြီး ပြောင်းခဲမှ သင့်တော်ပါတယ်။
      [[mark:w-2]] ဒုတိယက ကိုယ်လိုတဲ့ column တွေကိုပဲ ကိုယ့်ဘက်မှာ ကူးထားတာပါ။ ပိုင်ရှင်က ပြောင်းတိုင်း event နဲ့
      အသိပေးပြီး၊ ကိုယ်က ကိုယ့်မိတ္တူကို လိုက်ပြင်ပါတယ်။ မြန်ပြီး ပိုင်ရှင်ကို မမှီခိုတော့ပါဘူး။ ပေးရတာက မိတ္တူက
      ခဏ ဟောင်းနေနိုင်တာပါ။
      [[mark:w-3]] တတိယက လိုတဲ့အချိန်မှာ ပိုင်ရှင်ကို လှမ်းမေးတာပါ။ ရိုးရှင်းပြီး ပိုင်ရှင်ဆီက အလတ်ဆတ်ဆုံး data ကို
      ရပါတယ်။ ပေးရတာက ကိုယ့် availability ကို ပိုင်ရှင်ရဲ့ availability နဲ့ ချည်လိုက်ရတာပါ။ availability ဆိုတာ
      သုံးချင်တဲ့အချိန် သုံးလို့ရနေတာပါ။
      [[mark:w-4]] စတုတ္ထက table ကိုပဲ မျှသုံးတာပါ။ ရိုးရှင်းပြီး join လည်း လုပ်လို့ ရပါတယ်။ ပေးရတာက boundary
      ကျယ်သွားတာပါ။ ပိုင်ရှင်က schema ပြောင်းတိုင်း ဖတ်နေသူတွေ အားလုံး ပျက်နိုင်ပါတယ်။ ခရီးဖော် ရဲ့ Report က အခု ဒီနည်းနဲ့
      ဖတ်နေတာပါ။
      [[mark:w-choose]] ဘယ်နည်းကို ရွေးမလဲ ဆိုတာကို မေးခွန်း သုံးခုနဲ့ ဆုံးဖြတ်ပါတယ်။ data က ဘယ်လောက် လတ်ဆတ်ဖို့
      လိုလဲ၊ ဘယ်လောက် များလဲ၊ ဘယ်လောက် မကြာခဏ ပြောင်းလဲ ဆိုတာပါ။
    sources:
      - {
          title: "Software Architecture: The Hard Parts (Ford, Richards, Sadalage, Dehghani)",
          url: "https://oreil.ly/sa-the-hard-parts",
        }
    actions:
      - {
          id: close-quiz,
          type: whiteboard.apply,
          at: { mark: w-open, offsetMs: -1500 },
          open: false,
        }
      - {
          id: show-reads,
          type: slide.show,
          at: { mark: w-open, offsetMs: -1000 },
          slideId: four-reads,
        }
      - { id: point-w1, type: slide.point, at: { mark: w-1 }, target: { x: 0.15, y: 0.39 } }
      - { id: point-w2, type: slide.point, at: { mark: w-2 }, target: { x: 0.15, y: 0.53 } }
      - { id: point-w3, type: slide.point, at: { mark: w-3 }, target: { x: 0.15, y: 0.67 } }
      - { id: point-w4, type: slide.point, at: { mark: w-4 }, target: { x: 0.15, y: 0.81 } }

  - id: table
    chapter: Ownership table
    narration: >
      [[mark:t-close]] ဒီ ဆုံးဖြတ်ချက်တွေကို table တစ်ခုစီအတွက် ချရေးကြည့်ရအောင်။
      [[mark:type-trips]] trips ကို Operator တစ်ယောက်တည်း ရေးပါတယ်။ Search က ထွက်ချိန်နဲ့ ဈေးနှုန်းလို သူလိုတဲ့ column
      တွေကို event တွေကနေ ကူးထားပါတယ်။ ရှာတဲ့ request က အရမ်း များပြီး၊ ဒီ data က စက္ကန့်ပိုင်း ဟောင်းလည်း ရလို့ပါ။
      [[mark:type-seats]] ကျန်တဲ့ခုံ အရေအတွက်ကတော့ Booking ပိုင်တဲ့ table အသစ်ထဲ ရောက်သွားပါပြီ။ ဒါက စက္ကန့်တိုင်း
      ပြောင်းနေတာမို့၊ Search က ရှာတိုင်း Booking ကို လှမ်းမေးပါတယ်။ လတ်ဆတ်တာကို ရဖို့ Search ရဲ့ availability ကို
      Booking နဲ့ ချည်ထားရတာပါ။ သိသိနဲ့ ပေးထားတဲ့ ဈေးမို့ table ထဲမှာ မှတ်ထားပါတယ်။
      [[mark:type-holds]] seat hold ကလည်း အဲဒီလိုပါပဲ။ Payment က ငွေမဖြတ်ခင် hold က သက်တမ်း ရှိသေးလား ဆိုတာကို Booking
      ဆီ အဲဒီအချိန်မှာပဲ လှမ်းမေးပါတယ်။ တစ်စက္ကန့် ဟောင်းတာတောင် လက်မခံနိုင်လို့ပါ။
      [[mark:type-ops]] ကားလိုင်း table ကိုတော့ ခုနက ဆုံးဖြတ်ခဲ့တဲ့အတိုင်း Search ရဲ့ memory ထဲမှာ မိတ္တူ
      ထားပါတယ်။
      [[mark:type-tickets]] နောက်ဆုံးက Report ပါ။ Report က table တွေရဲ့ ညစဉ် မိတ္တူကို မျှသုံးပြီး ဖတ်ပါတယ်။ boundary
      ကျယ်တယ်ဆိုတာ သိသိနဲ့ ရွေးတာပါ။ report တွေက တစ်ရက် ဟောင်းလည်း ရပြီး၊ join အများကြီး လိုလို့ပါ။ အဲဒီအတွက်
      ပိုင်ရှင်တွေက schema မပြောင်းခင် Report ကို ကြိုပြောရပါမယ်။
      [[mark:sel-rule]] အောက်ဆုံးက စည်းမျဉ်းကတော့ table အသစ်တိုင်းအတွက်ပါ။ table တစ်ခုကို service တစ်ခုတည်းက
      ရေးပြီး၊ ကျန်တဲ့သူက ပိုင်ရှင်ဆီကနေပဲ ရရပါမယ်။
    sources:
      - {
          title: "Software Architecture: The Hard Parts (Ford, Richards, Sadalage, Dehghani)",
          url: "https://oreil.ly/sa-the-hard-parts",
        }
    actions:
      - { id: close-reads, type: slide.close, at: { mark: t-close } }
      - {
          id: reopen-notebook,
          type: workspace.openFile,
          at: { afterAction: close-reads },
          path: notebook/38-ownership.md,
        }
      - id: type-trips
        type: editor.type
        at: { mark: type-trips }
        cadence: line-by-line
        target: { file: notebook/38-ownership.md, after: "|---|---|---|---|\n" }
        text: "| trips | Operator | Operator | Search: လိုတဲ့ column ကူးထား |\n"
      - id: type-seats
        type: editor.type
        at: { mark: type-seats }
        cadence: line-by-line
        target:
          {
            file: notebook/38-ownership.md,
            after: "| trips | Operator | Operator | Search: လိုတဲ့ column ကူးထား |\n",
          }
        text: "| seat_counts (trips က ခွဲထုတ်) | Booking | Booking | Search: ရှာတိုင်း Booking ကို မေး (လတ်ဆတ်ဖို့) |\n"
      - id: type-holds
        type: editor.type
        at: { mark: type-holds }
        cadence: line-by-line
        target:
          { file: notebook/38-ownership.md, after: "| Search: ရှာတိုင်း Booking ကို မေး (လတ်ဆတ်ဖို့) |\n" }
        text: "| seat_holds | Booking | Booking | Payment: ငွေမဖြတ်ခင် Booking ကို မေး |\n"
      - id: type-ops
        type: editor.type
        at: { mark: type-ops }
        cadence: line-by-line
        target: { file: notebook/38-ownership.md, after: "| Payment: ငွေမဖြတ်ခင် Booking ကို မေး |\n" }
        text: "| operators | Operator | Operator | Search: memory ထဲမှာ မိတ္တူ |\n"
      - id: type-tickets
        type: editor.type
        at: { mark: type-tickets }
        cadence: line-by-line
        target: { file: notebook/38-ownership.md, after: "| Search: memory ထဲမှာ မိတ္တူ |\n" }
        text: "| tickets | Booking | Booking | Report: ညစဉ် မိတ္တူကို မျှသုံး (schema မပြောင်းခင် ကြိုပြော) |\n"
      - id: expect-split
        type: expect.file
        at: { afterAction: type-tickets }
        path: notebook/38-ownership.md
        contains: "| seat_counts (trips က ခွဲထုတ်) | Booking | Booking | Search: ရှာတိုင်း Booking ကို မေး (လတ်ဆတ်ဖို့) |\n"
      - id: sel-rule
        type: editor.select
        at: { mark: sel-rule }
        target:
          {
            file: notebook/38-ownership.md,
            text: "စည်းမျဉ်း: table တစ်ခု၊ ရေးသူ တစ်ယောက်\nကျန်တဲ့သူက ပိုင်ရှင်ဆီကနေပဲ ရမယ်",
          }

  - id: your-turn
    chapter: ကိုယ့် system အတွက်
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ ကိုယ့် system ထဲမှာ service နှစ်ခု၊ ဒါမှမဟုတ် code ရဲ့ အပိုင်း နှစ်ခုက
      ရေးနေတဲ့ table တစ်ခုကို ရှာပါ။ lesson ကို pause လုပ်ပြီး၊ ဒီ table ထဲမှာ ကိုယ့် project အတွက် row တစ်ခု
      ရေးကြည့်ပါ။
      [[mark:turn-2]] ပိုင်ရှင် တစ်ယောက် သတ်မှတ်မလား၊ table ကို ခွဲမလား၊ boundary ကို ချဲ့မလား ဆိုတာ ရွေးပြီး၊
      ကျန်တဲ့သူက ဘယ်လို ဖတ်မလဲ ဆိုတာပါ ဖြည့်ပါ။
    sources:
      - {
          title: "Software Architecture: The Hard Parts (Ford, Richards, Sadalage, Dehghani)",
          url: "https://oreil.ly/sa-the-hard-parts",
        }
    actions:
      - id: sel-header
        type: editor.select
        at: { mark: turn, offsetMs: 5000 }
        target: { file: notebook/38-ownership.md, text: "| Table | ရေးသူ | ပိုင်ရှင် | တခြားသူ ဖတ်ပုံ |" }

  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ table တစ်ခုကို ရေးတဲ့ service က ပိုင်ပါတယ်။ ရေးသူ နှစ်ယောက် ရှိလာရင် ပိုင်ရှင်
      တစ်ယောက် သတ်မှတ်တာ၊ table ကို ခွဲတာ၊ boundary ကို ချဲ့တာထဲက တစ်ခုကို ရွေးပါ။ ကိုယ်မပိုင်တဲ့ data ကိုတော့
      ဘယ်လောက် လတ်ဆတ်ဖို့ လိုလဲ၊ ဘယ်လောက် များလဲ၊ ဘယ်လောက် ပြောင်းလဲ ဆိုတာ ကြည့်ပြီး ဖတ်နည်းကို ရွေးပါ။ ပိုင်ရှင်
      မရှိတဲ့ table ဆိုတာ မှားသွားရင် ဘယ်သူမှ တာဝန်မယူတဲ့ table ပါပဲ။
      [[mark:next]] နောက် lesson မှာတော့ service တစ်ခုထက် ပိုတဲ့ နေရာက data တွေကို အတူ ပြောင်းရတဲ့
      လုပ်ငန်းစဉ်တွေအတွက် distributed transaction နဲ့ saga ကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "Software Architecture: The Hard Parts (Ford, Richards, Sadalage, Dehghani)",
          url: "https://oreil.ly/sa-the-hard-parts",
        }
    actions:
      - id: sel-title
        type: editor.select
        at: { mark: recap }
        target: { file: notebook/38-ownership.md, text: "# Data ownership: table တစ်ခုစီကို ဘယ်သူ ပိုင်လဲ" }

checks:
  - { type: timing.p95Ms, max: 300 }
