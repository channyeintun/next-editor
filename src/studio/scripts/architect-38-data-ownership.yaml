  - id: owner
    chapter: ရေးတဲ့သူက ပိုင်တယ်
    narration: >
      [[mark:o-open]] trips ကို ဘယ်သူတွေ ရေးနေလဲ ဆိုတာ အရင် ကြည့်ရအောင်။
      [[mark:o-book]] Booking က trips ထဲက ကျန်တဲ့ခုံ အရေအတွက်ကို ရေးပါတယ်။
      [[mark:o-op]] Operator ကလည်း အဲဒီ table ကိုပဲ ခရီးစဉ် တစ်ခုလုံး သိမ်းတဲ့ပုံစံနဲ့ ရေးပါတယ်။
      [[mark:o-bug]] တစ်ခုချင်းစီက မှန်ပေမဲ့၊ နှစ်ခု ပေါင်းလိုက်တော့ သုံးခုံက ၁၂ ခုံ ဖြစ်သွားတာပါ။
      [[mark:o-rule]] service တွေကို ခွဲတဲ့အခါ လိုက်နာရတဲ့ စည်းမျဉ်း တစ်ခု ရှိပါတယ်။ table တစ်ခုကို ရေးတဲ့ service က
      အဲဒီ table ကို ပိုင်တယ် ဆိုတာပါ။ ပိုင်တယ်ဆိုတာက schema ကို ပြောင်းခွင့်ရှိပြီး၊ data မှန်ကန်ဖို့
      တာဝန်ယူရတာကို ဆိုလိုပါတယ်။ schema ဆိုတာ data ရဲ့ ပုံစံပါ။
      [[mark:o-q]] ရေးတဲ့သူ တစ်ယောက်တည်းဆိုရင် ဒီစည်းမျဉ်းက ရှင်းပါတယ်။ ဒါပေမဲ့ trips မှာလို ရေးတဲ့သူ နှစ်ယောက်
      ရှိနေရင်တော့ ပိုင်ရှင်ကို ရွေးပေးရပါမယ်။
    sources:
