  - id: resolutions
    chapter: ရေးသူ နှစ်ယောက်ရှိရင်
    narration: >
      [[mark:r-open]] ရေးသူ နှစ်ယောက် ရှိတဲ့အခါ ဖြေရှင်းနည်း သုံးမျိုး ရှိပါတယ်။
      [[mark:r-1]] ပထမ နည်းက ပိုင်ရှင် တစ်ယောက်ကိုပဲ သတ်မှတ်ပြီး၊ ကျန်တဲ့သူက ပိုင်ရှင်ကို တောင်းဆိုပြီး ရေးခိုင်းတာပါ။
      Operator ကို ပိုင်ရှင် ထားမယ်ဆိုရင်၊ Booking က လက်မှတ် ရောင်းတိုင်း ခုံအရေအတွက် လျှော့ပေးဖို့ Operator ကို
      လှမ်းခေါ်ရပါမယ်။ data က တစ်နေရာတည်းမှာ မှန်နေပါတယ်။ ပေးရတာက လက်မှတ် ရောင်းတာ နှေးသွားပြီး၊ Operator
      ပျက်ရင် လက်မှတ်ပါ ရောင်းမရတော့တာပါ။
      [[mark:r-2]] ဒုတိယ နည်းက table ကို ခွဲတာပါ။ တစ်ယောက် ရေးတဲ့ column တွေကို table တစ်ခု၊ နောက်တစ်ယောက် ရေးတဲ့
      column တွေကို နောက် table တစ်ခု ခွဲပြီး၊ တစ်ယောက် တစ်ခုစီ ပိုင်တာပါ။ ပေးရတာက အရင်က join တစ်ခုနဲ့ ရတဲ့
      data ကို အခု နှစ်နေရာက ယူရတာပါ။
      [[mark:r-3]] တတိယ နည်းက boundary ကို ချဲ့တာပါ။ service နှစ်ခုလုံးက အဲဒီ table ကို အတူ ပိုင်တယ်လို့
      လက်ခံလိုက်တာပါ။ ဘာမှ ပြောင်းစရာ မလိုပေမဲ့၊ schema ပြောင်းတိုင်း team နှစ်ခု ညှိရပြီး၊ service နှစ်ခုကလည်း
      တကယ်တော့ အစု တစ်ခုတည်း ဖြစ်သွားပါတယ်။
    sources:
      - {
          title: "Software Architecture: The Hard Parts (Ford, Richards, Sadalage, Dehghani)",
          url: "https://oreil.ly/sa-the-hard-parts",
        }
    actions:
      - {
          id: close-owner,
          type: whiteboard.apply,
          at: { mark: r-open, offsetMs: -1500 },
          open: false,
        }
      - {
          id: show-writers,
          type: slide.show,
          at: { mark: r-open, offsetMs: -1000 },
          slideId: two-writers,
        }
      - { id: point-r1, type: slide.point, at: { mark: r-1 }, target: { x: 0.15, y: 0.43 } }
      - { id: point-r2, type: slide.point, at: { mark: r-2 }, target: { x: 0.15, y: 0.59 } }
      - { id: point-r3, type: slide.point, at: { mark: r-3 }, target: { x: 0.15, y: 0.75 } }

  - id: decide
    chapter: trips ကို ခွဲခြင်း
    narration: >
      [[mark:d-open]] ဘယ်နည်းကို ရွေးမလဲ ဆိုတာကို data ကို ပေါင်းထားဖို့ အကြောင်းတွေနဲ့ ခွဲဖို့ အကြောင်းတွေ ချိန်ပြီး
      ဆုံးဖြတ်ပါတယ်။ ပေါင်းထားဖို့ အကြောင်းက နှစ်ခုပါ။ table တွေကြားက relation နဲ့၊ အကုန်ဖြစ် ဒါမှမဟုတ် တစ်ခုမှ
      မဖြစ် ဆိုတဲ့ transaction ပါ။ ထွက်ချိန် ပြင်တာနဲ့ ခုံအရေအတွက် လျှော့တာကတော့ transaction တစ်ခုတည်းမှာ
      ဖြစ်စရာ မလိုပါဘူး။
      [[mark:d-op]] ဒါကြောင့် table ကို ခွဲပါမယ်။ ထွက်ချိန်၊ ဈေးနှုန်းလို ကားလိုင်းက သတ်မှတ်တဲ့ အရာတွေက trips ထဲမှာ
      ကျန်ခဲ့ပြီး Operator က ပိုင်ပါတယ်။
      [[mark:d-book]] ကျန်တဲ့ခုံ အရေအတွက်ကိုတော့ table အသစ် တစ်ခုထဲ ခွဲထုတ်ပြီး Booking က ပိုင်ပါတယ်။ ထိုင်ခုံနဲ့ ပတ်သက်သမျှက Booking ရဲ့ အလုပ်မို့ပါ။ အခုဆို Operator ဘက်က ခရီးစဉ် တစ်ခုလုံးကို ပြန်သိမ်းလည်း၊
      ခုံအရေအတွက်က အဲဒီ table ထဲမှာ မရှိတော့တာမို့ ဖုံးမိစရာ မရှိတော့ပါဘူး။
      [[mark:d-why1]] ခွဲဖို့ အကြောင်းတွေကတော့ သုံးခုပါ။ ပထမက schema ပြောင်းရင် ဘယ်သူ ထိမလဲ ဆိုတာပါ။ အခု Operator က
      သူ့ schema ကို ပြောင်းရင် Booking ကို မထိတော့ပါဘူး။ ဒုတိယက ပျက်တာကို ကန့်ထားနိုင်တာပါ။ တစ်ဖက်ရဲ့ အမှားက
      နောက်တစ်ဖက်ရဲ့ data ကို မဖျက်နိုင်တော့ပါဘူး။
      [[mark:d-why2]] တတိယက scale မတူတာပါ။ ခုံအရေအတွက်ကို တစ်ရက် ၈ သောင်းလောက် ရေးရပြီး၊ ခရီးစဉ်ကိုတော့ တစ်ရက်
      ရာဂဏန်းလောက်ပဲ ပြင်တာပါ။
      [[mark:d-keep]] လက်မှတ်၊ ထိုင်ခုံနဲ့ seat hold table တွေကတော့ လက်မှတ် တစ်စောင် ရောင်းတိုင်း transaction
      တစ်ခုတည်းမှာ အတူ ပြောင်းရတာမို့၊ Booking တစ်ခုတည်းအောက်မှာ အတူ ရှိနေရပါမယ်။
    sources:
      - {
          title: "Software Architecture: The Hard Parts (Ford, Richards, Sadalage, Dehghani)",
          url: "https://oreil.ly/sa-the-hard-parts",
        }
    actions:
      - { id: close-writers, type: slide.close, at: { mark: d-open } }
      - {
          id: draw-d-open,
          type: whiteboard.apply,
          at: { afterAction: close-writers },
          open: true,
          clear: true,
          upsertIds: [d-title, d-op, d-op-l, d-book, d-book-l],
          drawMs: 2400,
        }
      - {
          id: draw-d-op,
          type: whiteboard.apply,
          at: { mark: d-op },
          upsertIds: [d-a1, d-trips, d-trips-l],
          drawMs: 1500,
        }
      - {
          id: draw-d-book,
          type: whiteboard.apply,
          at: { mark: d-book },
          upsertIds: [d-a2, d-seats, d-seats-l],
          drawMs: 1500,
        }
      - {
          id: draw-d-why1,
          type: whiteboard.apply,
          at: { mark: d-why1, offsetMs: 3000 },
          upsertIds: [d-r1],
          drawMs: 1200,
        }
      - {
          id: draw-d-why2,
          type: whiteboard.apply,
          at: { mark: d-why2 },
          upsertIds: [d-r2],
          drawMs: 1200,
        }

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ ပိုင်ရှင် သတ်မှတ်ပြီးတာနဲ့ နောက်ပြဿနာ တစ်ခု ပေါ်လာပါတယ်။ ကိုယ်မပိုင်တဲ့
      data ကို လိုအပ်တဲ့အခါ ဘယ်လို ရမလဲ ဆိုတာပါ။ ခရီးစဉ် ရှာပေးတဲ့ Search က ရလဒ်တိုင်းမှာ ကားလိုင်းရဲ့ နာမည်ကို
      ပြရပါတယ်။ ကားလိုင်း data ကို ပိုင်တာကတော့ Operator ပါ။
      [[mark:q-g]] ကားလိုင်းက ၃၀၀ ပဲ ရှိပြီး၊ နာမည်တွေကလည်း တစ်လ တစ်ခါလောက်ပဲ ပြောင်းပါတယ်။
      [[mark:q-a]] Search က ရှာတိုင်း Operator ကို လှမ်းမေးမလား။
      [[mark:q-b]] ဒါမှမဟုတ် Search ဘက်မှာ မိတ္တူ တစ်ခု ထားမလား။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ Search ဘက်မှာ မိတ္တူ ထားတာပါ။
      [[mark:q-why]] ဘာကြောင့်လဲဆိုတော့ ဒီ data က သေးပြီး ပြောင်းခဲလို့ပါ။ မိတ္တူကို ငါးမိနစ်တစ်ခါ ပြန်ယူရင်တောင်၊
      နာမည် အဟောင်း ပြမိမယ့် အချိန်က တစ်လမှာ မိနစ်ပိုင်းပဲ ရှိပါတယ်။
      [[mark:q-why2]] လှမ်းမေးနေရင်တော့ ရှာတာတိုင်း နှေးသလို၊ Operator ပျက်တဲ့နေ့မှာ ခရီးစဉ် ရှာတာပါ
      ပျက်ပါလိမ့်မယ်။ မိတ္တူ ထားရင် Operator ပျက်နေလည်း Search က ဆက်အလုပ်လုပ်နိုင်ပါတယ်။
    sources:
      - {
          title: "Software Architecture: The Hard Parts (Ford, Richards, Sadalage, Dehghani)",
          url: "https://oreil.ly/sa-the-hard-parts",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          clear: true,
          upsertIds: [q-title],
          drawMs: 1200,
        }
      - { id: draw-q-g, type: whiteboard.apply, at: { mark: q-g }, upsertIds: [q-g], drawMs: 1200 }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
