  environment: {}

scenes:
  - id: need
    chapter: ကျန်တဲ့ခုံ ပြန်တိုးလာတဲ့ နေ့
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ service တစ်ခုကို ခွဲမလား၊ ပေါင်းမလား ဆိုတာကို အားတွေ ချိန်ပြီး ဆုံးဖြတ်ပုံကို
      လေ့လာခဲ့ပါတယ်။
      [[mark:open-doc]] service တွေ ခွဲပြီးတဲ့နောက်မှာတော့ data နဲ့ ပတ်သက်တဲ့ ပြဿနာ တစ်မျိုး ပေါ်လာပါတယ်။
      [[mark:sel-incident]] ပြီးခဲ့တဲ့အပတ်က ရန်ကုန်ကနေ မန္တလေး သွားတဲ့ ခရီးစဉ် တစ်ခုမှာ ကျန်တဲ့ခုံ အရေအတွက်က
      သုံးခုံကနေ ၁၂ ခုံကို ရုတ်တရက် ပြန်တက်သွားပါတယ်။ ရောင်းပြီးသား ခုံတွေကို လွတ်နေတယ်လို့ ပြနေတာပါ။
      [[mark:cause]] အကြောင်းရင်းက trips ဆိုတဲ့ ခရီးစဉ် table ပါ။ လက်မှတ် တစ်စောင် ရောင်းတိုင်း Booking က အဲဒီ table
      ထဲက ကျန်တဲ့ခုံ အရေအတွက်ကို လျှော့ပါတယ်။ ကားလိုင်းတွေ သုံးတဲ့ Operator ဘက်က screen ကလည်း ထွက်ချိန်
      ပြင်တဲ့အခါ ခရီးစဉ် တစ်ခုလုံးကို ပြန်သိမ်းပါတယ်။ ကားလိုင်း ဝန်ထမ်း တစ်ယောက် ထွက်ချိန် ပြင်နေတုန်း
      ရောင်းလိုက်တဲ့ ခုံတွေကို၊ သူ သိမ်းလိုက်တဲ့ အရေအတွက် အဟောင်းက ဖုံးသွားတာပါ။
      [[mark:whose]] Booking team lead မောင်မောင် ကတော့ Operator ဘက်က Booking ရဲ့ data ကို ဖျက်တယ်လို့ ဆိုပါတယ်။
      Operator team ကတော့ trips က သူတို့ table ပါလို့ ဆိုပါတယ်။ ဒီ table ကို တကယ် ဘယ်သူ ပိုင်တာလဲ ဆိုတာ ဘယ်သူမှ မပြောနိုင်ပါဘူး။ ဒီကြားထဲ Report ကလည်း table အားလုံးကို
      တိုက်ရိုက် ဖတ်နေတာမို့၊ ဘယ် table ကိုမှ စိတ်ချလက်ချ ပြောင်းလို့ မရပါဘူး။
    sources:
      - {
          title: "Software Architecture: The Hard Parts (Ford, Richards, Sadalage, Dehghani)",
          url: "https://oreil.ly/sa-the-hard-parts",
        }
    actions:
      - {
          id: open-notebook,
          type: workspace.openFile,
          at: { mark: open-doc },
          path: notebook/38-ownership.md,
        }
      - id: sel-incident
        type: editor.select
        at: { mark: sel-incident }
