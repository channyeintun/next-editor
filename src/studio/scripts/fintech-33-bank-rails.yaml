  - id: gross
    chapter: Gross နဲ့ net
    narration: >-
      [[mark:close-corr]] ဘဏ်တွေကြား payment တွေက တစ်နေ့ကို အများကြီး ရှိပါတယ်။ [[mark:type-pay]] clearing
      cycle တစ်ခုအတွင်း ဘဏ် သုံးခုကြား payment ခြောက်ခု ရှိတယ် ဆိုပါစို့။ A က B ကို ပေးရသလို B ကလည်း A ကို
      ပေးရပါတယ်။  payment တစ်ခုချင်းကို သီးသန့် settle လုပ်ရင် ဘယ်လောက် ရွှေ့ရမလဲ ကြည့်ရအောင်။
      [[mark:run-2]] run လိုက်ရအောင်။ [[mark:pt-gross]] ယူရို ငါးရာ ရွှေ့ရပါတယ်၊ ဒါကို gross settlement
      လို့ ခေါ်ပါတယ်။ [[mark:dock-2]] payment တိုင်းအတွက် ငွေ ကြိုရှိနေရလို့ liquidity၊ ဆိုလိုတာက
      ချက်ချင်း ပေးလို့ရတဲ့ ငွေ အများကြီး လိုပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Appendix A: Transactions, timing & settlement (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#transactions-timing-settlement",
        }
    actions:
      - { id: close-corr, type: slide.close, at: { mark: close-corr } }
      - id: type-pay
        type: editor.type
        at: { mark: type-pay }
        target:
          {
            file: main.go,
            after: "\t\tfmt.Println(iban, \"valid:\", validIBAN(iban))\n\t}\n",
            occurrence: 1,
          }
        text: "\n\tpayments := []Payment{\n\t\t{\"A\", \"B\", 12000}, {\"B\", \"A\", 10000}, {\"A\", \"C\", 8000},\n\t\t{\"C\", \"A\", 5000}, {\"B\", \"C\", 9000}, {\"C\", \"B\", 6000},\n\t}\n\tfmt.Println(\"gross:\", len(payments), \"payments,\", cents(gross(payments)))\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "gross: 6 payments, 500.00",
          timeoutMs: 8000,
        }
      - id: pt-gross
        type: console.point
        at: { mark: pt-gross }
        target: { text: "gross: 6 payments, 500.00", occurrence: 1 }
      - { id: dock-2, type: runtime.collapseDock, at: { mark: dock-2 } }

  - id: netting
    narration: >-
      [[mark:show-net]] ဒါပေမဲ့ ဒီ payment တွေက အပြန်အလှန် ဖြစ်နေပါတယ်။ [[mark:net-2]] payment တွေကို
      cut-off အထိ စုပြီး ဘဏ် တစ်ခုချင်း ပေးရမှာနဲ့ ရမှာကို ပေါင်းနုတ်လိုက်ရင် ဘဏ် တစ်ခုကို position
      တစ်ခုပဲ ကျန်ပါတယ်။ A က ယူရို ငါးဆယ်၊ B က ယူရို ဆယ် ပေးရပြီး၊ C က ယူရို ခြောက်ဆယ် ရပါတယ်။
      [[mark:pt-sum]] position အားလုံး ပေါင်းရင် သုည ဖြစ်ရပါတယ်၊ ငွေ ပေါ်လာတာ ပျောက်သွားတာ မရှိရလို့ပါ။
      [[mark:net-3]] settle လုပ်ရတာ transfer နှစ်ခုနဲ့ ယူရို ခြောက်ဆယ်ပဲ ဖြစ်သွားပါတယ်။ lesson ၂၆ မှာ ကြားခဲ့တဲ့ netting ဆိုတာ ဒါပါ၊ obligation အများကြီးကို net transfer အနည်းငယ်အဖြစ် ချုံ့တာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Appendix A: Transactions, timing & settlement (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#transactions-timing-settlement",
        }
    actions:
