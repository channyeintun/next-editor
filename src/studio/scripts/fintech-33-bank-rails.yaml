        <g><circle cx="138" cy="249" r="25" fill="#4fd1c5"/><text x="138" y="259" font-size="28" text-anchor="middle" fill="#0b0e14" font-weight="800">1</text><text x="188" y="261" font-size="33" fill="#e9edf5" font-weight="600">ငွေ မသွားဘူး — ဘဏ်တွေ အချင်းချင်း ကိုင်ထားတဲ့ account တွေ ပြောင်းတယ်</text><text x="188" y="311" font-size="26" fill="#8a94a8">nostro / vostro · correspondent တစ်ဆင့်ချင်းက ledger entry</text></g><g><circle cx="138" cy="381" r="25" fill="#6cb2f5"/><text x="138" y="391" font-size="28" text-anchor="middle" fill="#0b0e14" font-weight="800">2</text><text x="188" y="393" font-size="34" fill="#e9edf5" font-weight="600">Message ≠ money — Swift က instruction ပဲ</text><text x="188" y="443" font-size="26" fill="#8a94a8">clearing က သဘောတူ၊ settlement က ရွှေ့ · cut-off · netting</text></g><g><circle cx="138" cy="513" r="25" fill="#f6ad55"/><text x="138" y="523" font-size="28" text-anchor="middle" fill="#0b0e14" font-weight="800">3</text><text x="188" y="525" font-size="34" fill="#e9edf5" font-weight="600">လမ်းခုလတ်က ငွေ (float) ကို model လုပ်</text><text x="188" y="575" font-size="26" fill="#8a94a8">IBAN check က typo ပဲ ဖမ်းတယ်၊ account ရှိမရှိ မသိဘူး</text></g><g class="in"><use href="#i-check" x="114" y="621" width="48" height="48" style="color:#68d391"/><text x="188" y="657" font-size="34" fill="#e9edf5" font-weight="600">in-transit account + bank statement နဲ့ reconcile</text><text x="188" y="707" font-size="26" fill="#8a94a8">FBO total = user balance တွေ ပေါင်းလဒ်၊ နေ့တိုင်း</text></g>
        </svg>
