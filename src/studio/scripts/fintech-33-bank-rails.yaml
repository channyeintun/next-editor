  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] interview မှာ ဘဏ်တစ်ခုကနေ တစ်ခုကို ငွေလွှဲရင် တကယ် ဘာဖြစ်သွားတာလဲ လို့ မေးတတ်ပါတယ်။
      [[mark:iv-a]] ပထမ၊ ငွေက ဘဏ်တွေကြား မသွားပါဘူး။ ဘဏ်တွေ အချင်းချင်း ကိုင်ထားတဲ့ nostro၊ vostro account
      တွေ ဒါမှမဟုတ် settlement system ထဲက account တွေကို ပြောင်းတာပါ၊ correspondent တစ်ဆင့်ချင်းက ledger
      entry တစ်ခုပါ။ [[mark:iv-b]] ဒုတိယ၊ message နဲ့ ငွေကို ခွဲပြောပါ။ Swift က instruction ပဲ သယ်ပြီး၊
      clearing က သဘောတူတာ၊ settlement က ရွှေ့တာပါ၊ cut-off နဲ့ netting က ရွှေ့တဲ့ အချိန်နဲ့ ပမာဏကို
      ပြောင်းပါတယ်။ [[mark:iv-c]] တတိယ၊ လမ်းခုလတ်က ငွေ၊ float ကို model လုပ်ရပါမယ်။ IBAN check က
      ရိုက်မှားတာကိုပဲ ဖမ်းပြီး account ရှိမရှိ မပြောပါဘူး။ [[mark:iv-d]] ပြီးရင် ကိုယ် ဘယ်လို လုပ်မလဲ
      ပြောပါ။ ထွက်သွားတဲ့ ငွေကို in-transit account မှာ ထားမယ်၊ bank statement ရောက်မှ settled လို့
      မှတ်မယ်၊ FBO balance ကို user balance တွေ ပေါင်းလဒ်နဲ့ နေ့တိုင်း reconcile လုပ်မယ် ဆိုတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Appendix A: Payments, rails & cards (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#payments-rails-cards",
        }
    actions:
