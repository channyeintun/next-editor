  - id: try-it
    chapter: ကိုယ်တိုင် စမ်းကြည့်ပါ
    narration: >-
      [[mark:close-iv]] ကိုယ်တိုင် စမ်းကြည့်ဖို့ တစ်ခု ရှိပါတယ်။ [[mark:sel-try]] တတိယ IBAN ကို ကိုယ့်ဘာသာ
      စိတ်ကူးထားတဲ့ IBAN တစ်ခုနဲ့ အစားထိုးပြီး run ကြည့်ပါ။ false ထွက်ဖို့ များပါတယ်၊ ကျပန်း ဂဏန်းတွေမှာ
      ၉၇ ခုမှာ တစ်ခုလောက်ပဲ check ကို ဖြတ်လို့ပါ။ [[mark:recap]] ပြန်ချုပ်ရရင်၊ ဘဏ်တွေက ငွေကို ပို့တာ
      မဟုတ်ဘဲ တစ်ခုဆီမှာ တစ်ခု ကိုင်ထားတဲ့ account တွေကို ပြင်တာပါ၊ message က instruction ပဲ ဖြစ်ပါတယ်။
      ငွေ တကယ် ရောက်ပြီလား ဆိုတာကို ကိုယ့် ledger နဲ့ bank statement တိုက်မှ သိရပါတယ်။ နောက် lesson
      မှာတော့ trading ကို ကြည့်ပါမယ်၊ buy order နဲ့ sell order တွေ order book ထဲမှာ ဘယ်လို ကိုက်လဲ
      ဆိုတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Appendix A: Payments, rails & cards (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#payments-rails-cards",
