      - {
          id: pt-net-gross,
          type: slide.point,
          at: { afterAction: show-net },
          target: { x: 0.23, y: 0.953 },
        }
      - { id: net-2, type: slide.show, at: { mark: net-2 }, slideId: net-2 }
