# Fintech Engineering, lesson 33: bank rails, accounts and settlement (Burmese).
#
# Source: Fintech Engineering Handbook, Appendix A "Payments, rails & cards" and "Transactions,
# timing & settlement" (CC BY 4.0, Voytek Pitula). Facts: A12, B12, B13, B14, B25.
# Start state: main.go checks three IBANs (two published examples, one with two digits swapped);
# clearing.go holds Payment, gross and net.
# Edits, all insert-only (main.go):
#   1. six gross payments between three banks            -> run-2 gross: 6 payments, 500.00
#   2. the net position of each bank and what really moves -> run-3 net moved: 60.00
# Figures: rails (a table of rails), corr (correspondent banking: nostro / vostro, the Swift
# message, three sets of books), net (gross arrows, positions, two net transfers), fbo (omnibus /
# FBO account, sweep, pass-through conditions), iv (the interview answer).
# Built by ~/Documents/fintech-course-work/tools/build-lesson.ts; fixtures by sim-go.ts --write.
