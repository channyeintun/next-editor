      - { id: pt-sum, type: slide.point, at: { mark: pt-sum }, target: { x: 0.454, y: 0.38 } }
      - { id: net-3, type: slide.show, at: { mark: net-3 }, slideId: net-3 }
      - {
          id: pt-netc,
          type: slide.point,
          at: { afterAction: net-3 },
          target: { x: 0.767, y: 0.953 },
        }

  - id: net-code
    narration: >-
      [[mark:close-net]] code နဲ့ တွက်ကြည့်ရအောင်။ [[mark:open-clr]] net function က payment တွေကို ဘဏ်
      တစ်ခုချင်းရဲ့ position အဖြစ် ပြောင်းပါတယ်။ [[mark:sel-net]] payment တစ်ခုချင်းအတွက် ပေးသူရဲ့
      position ကနေ နုတ်ပြီး လက်ခံသူရဲ့ position ကို ထည့်တာပါ၊ ledger မှာ debit နဲ့ credit ညီရသလိုပါပဲ။
      [[mark:back-main]] main ထဲမှာ အဲဒါကို သုံးပါမယ်။ [[mark:type-print]] ဘဏ် တစ်ခုချင်းရဲ့ position ကို
      ထုတ်ပြပြီး၊ ရရမယ့် ဘက်တွေကို ပေါင်းတာက တကယ် ရွှေ့ရမယ့် ပမာဏပါ။ position အားလုံး ပေါင်းရင် သုည
      ဖြစ်လို့ ပေးရမယ့် ဘက်တွေကို ပေါင်းလည်း အတူတူပါပဲ။  [[mark:run-3]] run လိုက်ရအောင်။
      [[mark:pt-a]] A က အနုတ် ငါးဆယ်၊ B က အနုတ် ဆယ်၊ C က ခြောက်ဆယ် ပါ။ [[mark:pt-moved]] တကယ် ရွှေ့ရတာ
      ယူရို ခြောက်ဆယ်ပဲ ဖြစ်ပြီး၊ gross ရဲ့ ဆယ်ပုံ တစ်ပုံ ကျော်ကျော်ပဲ ရှိပါတယ်။ [[mark:dock-3]] ဒါကြောင့်
      netting လုပ်တဲ့ rail တွေမှာ ဘဏ်တွေက liquidity နည်းနည်းနဲ့ payment အများကြီးကို settle လုပ်နိုင်တာပါ။
      ဒါပေမဲ့ net position က settlement ဖြစ်မှ ငွေ ဖြစ်တာပါ၊ အဲဒီအထိ obligation ပဲ ရှိပါသေးတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Appendix A: Transactions, timing & settlement (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#transactions-timing-settlement",
        }
    actions:
      - { id: close-net, type: slide.close, at: { mark: close-net } }
      - { id: open-clearing, type: workspace.openFile, at: { mark: open-clr }, path: clearing.go }
      - id: sel-net
        type: editor.select
        at: { mark: sel-net }
        target:
          {
            file: clearing.go,
            text: "\t\tpos[p.From] -= p.Amount\n\t\tpos[p.To] += p.Amount",
            occurrence: 1,
          }
      - { id: open-main-2, type: workspace.openFile, at: { mark: back-main }, path: main.go }
      - id: type-print
        type: editor.type
        at: { mark: type-print }
        target:
          {
            file: main.go,
            after: "\tfmt.Println(\"gross:\", len(payments), \"payments,\", cents(gross(payments)))\n",
            occurrence: 1,
          }
        text: "\n\tpos, moved := net(payments), int64(0)\n\tfor _, bank := range []string{\"A\", \"B\", \"C\"} {\n\t\tfmt.Println(bank+\":\", cents(pos[bank]))\n\t\tmoved += max(pos[bank], 0)\n\t}\n\tfmt.Println(\"net moved:\", cents(moved))\n"
        cadence: line-by-line
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "net moved: 60.00",
          timeoutMs: 8000,
        }
      - id: pt-a
        type: console.point
        at: { mark: pt-a }
        target: { text: "A: -50.00", occurrence: 1 }
      - id: pt-moved
        type: console.point
        at: { mark: pt-moved }
        target: { text: "net moved: 60.00", occurrence: 1 }
      - { id: dock-3, type: runtime.collapseDock, at: { mark: dock-3 } }
      - {
          id: expect-file-moved,
          type: expect.file,
          at: { afterAction: run-3 },
          path: main.go,
          contains: "moved += max(pos[bank], 0)",
        }

  - id: fbo
    chapter: Omnibus နဲ့ FBO account
    narration: >-
      [[mark:show-fbo]] fintech တစ်ခုရဲ့ user ငွေတွေက ဘဏ်မှာ ဘယ်လို ရှိလဲ။ user တစ်ယောက်ချင်း account
      မဖွင့်ဘဲ partner ဘဏ်မှာ account တစ်ခုထဲ စုထားတာ များပါတယ်။ [[mark:pt-bankrow]] ဒါက lesson ၁၀ က omnibus account ပါ၊ lesson ၂၆ က FBO account လို user တွေကိုယ်စား ကုမ္ပဏီက ကိုင်ထားပြီး၊
      user တစ်ယောက်ချင်းရဲ့ balance ကို ကိုယ့် ledger ထဲမှာ ခွဲမှတ်ပါတယ်။ commingling မဟုတ်ဘဲ တရားဝင် စုထားတာပါ။ [[mark:pt-total]] ဘဏ်က ယူရို သုံးရာ
      ဆိုတဲ့ ဂဏန်း တစ်ခုပဲ မြင်ပါတယ်။ ဘယ် user က ဘယ်လောက် ပိုင်လဲ ဆိုတာ ကိုယ့် ledger ကပဲ သိလို့၊ ledger
      ရဲ့ စုစုပေါင်းနဲ့ ဘဏ် balance ကို နေ့တိုင်း reconcile လုပ်ရပါတယ်။ [[mark:fbo-2]] sweep ဆိုတာ balance
      ကို schedule နဲ့ တခြား account ကို အလိုအလျောက် ရွှေ့တာပါ၊ ဥပမာ အတိုး ရတဲ့ account ကို။
      ရွှေ့ပြီးတာတောင် user တစ်ယောက်ချင်းရဲ့ ငွေ ဘယ်မှာ ရှိလဲ ledger က ပြောနိုင်ရပါမယ်။ [[mark:fbo-3]] ဒီ
      ledger က ကိုယ့် အတွက်တင် မဟုတ်ပါဘူး။ အမေရိကမှာ FDIC insured ဘဏ် ပြိုသွားရင် FBO account ထဲက ငွေကို
      user တစ်ယောက်ချင်းဆီ insurance ရောက်ဖို့ အချက် သုံးချက် ပြည့်ရပါတယ်။ [[mark:pt-pass]] ငွေက user တွေ
      ပိုင်ရမယ်၊ ဘဏ်ရဲ့ မှတ်တမ်းမှာ custodial account လို့ ပြရမယ်၊ ပိုင်ရှင် တစ်ယောက်ချင်းနဲ့ ပမာဏကို
      မှတ်တမ်းကနေ သိနိုင်ရမယ်။ မပြည့်ရင် ကုမ္ပဏီရဲ့ ကိုယ်ပိုင် deposit အဖြစ်ပဲ တွက်ပါတယ်။ ဆိုလိုတာက ဘဏ် ပြိုရင် user တစ်ယောက်ချင်းရဲ့ insurance အတွက် သက်သေက ကိုယ့် ledger ပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Appendix A: Payments, rails & cards (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#payments-rails-cards",
