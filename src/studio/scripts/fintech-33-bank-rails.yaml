build:
  voiceProfile:
    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 9533

runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "GB82 WEST 1234 5698 7654 32 valid: true\nDE89 3704 0044 0532 0130 00 valid: true\nGB82 WEST 1234 5698 7654 23 valid: false\n"
      run-2:
        status: success
        exitCode: 0
        output: "GB82 WEST 1234 5698 7654 32 valid: true\nDE89 3704 0044 0532 0130 00 valid: true\nGB82 WEST 1234 5698 7654 23 valid: false\ngross: 6 payments, 500.00\n"
      run-3:
        status: success
        exitCode: 0
        output: "GB82 WEST 1234 5698 7654 32 valid: true\nDE89 3704 0044 0532 0130 00 valid: true\nGB82 WEST 1234 5698 7654 23 valid: false\ngross: 6 payments, 500.00\nA: -50.00\nB: -10.00\nC: 60.00\nnet moved: 60.00\n"

scenes:
  - id: hook
    chapter: IBAN ကို စစ်တာ
    narration: >-
      ဘဏ် account တစ်ခုဆီ ငွေ ထုတ်ပေးတဲ့ flow မှာ ပထမဆုံး မှားနိုင်တာက user ရိုက်ထည့်တဲ့ account နံပါတ်ပါ။
       IBAN ဆိုတာ ISO standard တစ်ခုက သတ်မှတ်ထားတဲ့ international
      bank account number ဖြစ်ပြီး၊ ရိုက်မှားတာကို ဖမ်းဖို့ check digit ပါပါတယ်။ [[mark:sel-check]] စစ်တဲ့
      နည်းက ရှေ့ဆုံး စာလုံး လေးလုံးကို နောက်ဆုံးကို ရွှေ့ပြီး၊ စာလုံး တစ်လုံးချင်းကို ဂဏန်း နှစ်လုံး
      ပြောင်းပြီး၊ ရလာတဲ့ ဂဏန်းကြီးကို ၉၇ နဲ့ စားတာပါ။ [[mark:sel-mod]] အကြွင်း တစ် ဖြစ်မှ valid ပါ။
      [[mark:sel-list]] ပထမ နှစ်ခုက ထုတ်ဝေထားတဲ့ ဥပမာ IBAN တွေပါ၊ တကယ့် account တွေ မဟုတ်ပါဘူး။ တတိယ
      တစ်ခုက ပထမ တစ်ခုရဲ့ နောက်ဆုံး ဂဏန်း နှစ်လုံးကို နေရာလဲထားတာပါ။ ဒီ အမှားကို check က ဖမ်းမိမလား
      ခန့်မှန်းကြည့်ပါ။ [[mark:run-1]] run လိုက်ရအောင်။ [[mark:pt-true]] ဥပမာ နှစ်ခုက valid ဖြစ်ပြီး check
      ကို ဖြတ်ပါတယ်။ [[mark:pt-false]] နေရာလဲထားတဲ့ တစ်ခုကိုတော့ false လို့ ဖမ်းမိပါတယ်။ [[mark:dock-1]]
      သတိထားရမှာက valid ဆိုတာ account တကယ် ရှိတယ် လို့ မဆိုလိုပါဘူး။ 
    sources:
      - {
          title: "Fintech Engineering Handbook — Appendix A: Payments, rails & cards (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#payments-rails-cards",
        }
      - {
          title: "Experian Bank Wizard — IBAN formats (DE89 3704 0044 0532 0130 00)",
          url: "https://identityandfraud.uk.experian.com/documentation/bank-wizard-api-guide-j12f/subsystems/default/country_details/iban_formats.htm",
        }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }
      - id: sel-check
        type: editor.select
        at: { mark: sel-check }
        target: { file: main.go, text: "for _, c := range s[4:] + s[:4] {", occurrence: 1 }
      - id: sel-mod
        type: editor.select
        at: { mark: sel-mod }
        target: { file: main.go, text: "return rem == 1", occurrence: 1 }
      - id: sel-list
        type: editor.select
        at: { mark: sel-list }
        target:
          {
            file: main.go,
            text: '"GB82 WEST 1234 5698 7654 23", // the last two digits swapped',
            occurrence: 1,
          }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "7654 23 valid: false",
          timeoutMs: 8000,
        }
      - id: pt-true
        type: console.point
        at: { mark: pt-true }
        target: { text: "DE89 3704 0044 0532 0130 00 valid: true", occurrence: 1 }
      - id: pt-false
        type: console.point
        at: { mark: pt-false }
        target: { text: "GB82 WEST 1234 5698 7654 23 valid: false", occurrence: 1 }
      - { id: dock-1, type: runtime.collapseDock, at: { mark: dock-1 } }

  - id: rails
    chapter: Payment rail
    narration: >-
      [[mark:show-rails]] IBAN မှန်ပြီဆိုရင် ငွေက rail တစ်ခုပေါ်ကနေ သွားပါတယ်။ rail ဆိုတာ payment သွားတဲ့
      network ပါ၊ rail တစ်ခုချင်းမှာ ကိုယ့် speed၊ cost၊ ဖွင့်ချိန်နဲ့ ရောက်နိုင်တဲ့ နေရာ ရှိပါတယ်။
      [[mark:pt-cards]] card network ကို lesson ၃၂ မှာ မြင်ခဲ့ပြီးပါပြီ၊ authorization က စက္ကန့်ပိုင်း၊
      settlement က ရက်ပိုင်းပါ။ [[mark:rails-2]] SEPA Instant ကတော့ euro credit transfer ကို
      တစ်နှစ်ပတ်လုံး နေ့ရော ညရော ဖွင့်ထားပြီး၊ ငွေကို ဆယ်စက္ကန့်အတွင်း လက်ခံသူ သုံးလို့ရအောင် ပေးပါတယ်။
      [[mark:pt-bank]] ACH၊ FPS၊ CHAPS နဲ့ wire လို ဘဏ် rail တွေမှာ ဖွင့်ချိန်၊ lesson ၁၁ က cut-off နဲ့ limit ကိုယ်စီ ရှိပါတယ်။ [[mark:rails-3]] Swift ကတော့ ကွာပါတယ်။ ဘဏ်တွေကြား standard message တွေကို
      သယ်ပေးပေမဲ့၊ Swift ကိုယ်တိုင် asset မကိုင်ပါဘူး၊ clear လည်း မလုပ်၊ settle လည်း မလုပ်ပါဘူး။

    sources:
      - {
          title: "Fintech Engineering Handbook — Appendix A: Payments, rails & cards (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#payments-rails-cards",
        }
      - {
          title: "ECB — Instant payments",
          url: "https://www.ecb.europa.eu/paym/retail/instant_payments/html/index.en.html",
        }
      - {
          title: "Swift — Fighting illegal financial activities (what Swift does and does not do)",
          url: "https://www.swift.com/about-us/legal/compliance-0/fighting-illegal-financial-activities",
        }
    actions:
      - {
          id: show-rails,
          type: slide.show,
          at: { mark: show-rails, offsetMs: -700 },
          slideId: rails-1,
        }
      - { id: pt-cards, type: slide.point, at: { mark: pt-cards }, target: { x: 0.138, y: 0.378 } }
      - { id: rails-2, type: slide.show, at: { mark: rails-2 }, slideId: rails-2 }
      - {
          id: pt-sepa,
          type: slide.point,
          at: { afterAction: rails-2 },
          target: { x: 0.138, y: 0.471 },
        }
      - { id: pt-bank, type: slide.point, at: { mark: pt-bank }, target: { x: 0.138, y: 0.564 } }
      - { id: rails-3, type: slide.show, at: { mark: rails-3 }, slideId: rails-3 }
      - {
          id: pt-swift,
          type: slide.point,
          at: { afterAction: rails-3 },
          target: { x: 0.138, y: 0.751 },
        }

  - id: corr
    chapter: Nostro နဲ့ vostro
    narration: >-
      [[mark:show-corr]] Swift က ငွေ မရွှေ့ရင် ငွေက ဘယ်လို ရွှေ့လဲ။ Bank A ရဲ့ customer တစ်ယောက်က Bank B
      မှာ ရှိတဲ့ account ကို ယူရို ၁၀၀ လွှဲတယ် ဆိုပါစို့။ ပို့သူကို originator၊ လက်ခံသူကို beneficiary
      လို့ ခေါ်ပါတယ်။ [[mark:pt-none]] Bank A နဲ့ Bank B ကြားမှာ account မရှိရင် နှစ်ခုကြား တိုက်ရိုက်
      လွှဲလို့ မရပါဘူး။ [[mark:corr-2]] ဒါကြောင့် settlement system တစ်ခုကို ဖြတ်ရပါတယ်၊ ဒါမှမဟုတ် ဒီ ဥပမာလို နှစ်ဘက်လုံး account
      ဖွင့်ထားတဲ့ correspondent ဘဏ်ကို ဖြတ်ရပါတယ်။ cross-border ဆိုရင် correspondent တစ်ခုထက် ပိုပြီး ဖြတ်နိုင်ပါတယ်။ [[mark:pt-nostro]]
      Bank A ဘက်က ကြည့်ရင် correspondent မှာ ထားတဲ့ ကိုယ့်ငွေကို nostro လို့ ခေါ်ပါတယ်၊ ကိုယ့်ငွေ၊
      သူများဘဏ်မှာ ဆိုတဲ့ အဓိပ္ပာယ်ပါ။ [[mark:pt-vostro]] correspondent ဘက်ကတော့ အဲဒီ account ကို vostro
      လို့ ခေါ်ပါတယ်၊ သူများငွေ၊ ကိုယ့်ဘဏ်မှာ ပါ။ account တစ်ခုတည်းကို ဘက်နှစ်ဘက်က နာမည် နှစ်မျိုးနဲ့
      ခေါ်တာပါ။ [[mark:corr-3]] Bank A က correspondent ကို Swift message ပို့ပြီး၊ correspondent က Bank B
      ကို ဆက်ပို့ပါတယ်။ [[mark:pt-iso]] Swift ပေါ်က cross-border payment message တွေက ISO 20022 format ကို
      ပြောင်းနေပြီး၊ ၂၀၂၅ နိုဝင်ဘာ ၂၄ ရက်မှာ payment instruction ရဲ့ ၉၇ ရာခိုင်နှုန်းက အဲဒီ format နဲ့
      ရောက်ပါတယ်။ format ဘာပဲဖြစ်ဖြစ် message က instruction ပဲ ဖြစ်ပြီး ငွေ မဟုတ်ပါဘူး။ [[mark:corr-4]] ငွေ ရွှေ့တာက ဘဏ်
      တစ်ခုချင်းရဲ့ ledger ထဲမှာပါ။ Bank A က originator ရဲ့ account ကို နုတ်ပြီး nostro ကိုလည်း နုတ်ပါတယ်။
      [[mark:pt-tc]] correspondent က Bank A ရဲ့ account ကနေ နုတ်ပြီး Bank B ရဲ့ account ကို ထည့်ပါတယ်၊
      Bank B ကလည်း nostro နဲ့ beneficiary ကို ထည့်ပါတယ်။ [[mark:pt-nothing]] ဘဏ်တွေကြား ဘာမှ မသွားပါဘူး၊
      ledger သုံးခု ပြောင်းသွားတာပါ။ [[mark:pt-float]] ဒီ ပြောင်းတာတွေ အချိန်တစ်ပြိုင်တည်း မဖြစ်လို့ lesson ၁၁ က float ပေါ်လာပါတယ်၊ လမ်းခုလတ်မှာ ငွေက
      system နှစ်ခုလုံးမှာ ရှိသလို ဒါမှမဟုတ် ဘယ်မှာမှ မရှိသလို ဖြစ်တာပါ။ [[mark:pt-intransit]] ဒါကြောင့် ကိုယ့် ledger မှာ ထွက်သွားပြီး မရောက်သေးတဲ့
      ငွေကို in-transit account နဲ့ ထားပြီး၊ message ရောက်တာ၊ API က success ပြန်တာကို မယုံဘဲ bank
      statement နဲ့ reconcile လုပ်မှ settled လို့ မှတ်ရပါတယ်။ [[mark:pt-trust]] ဒါက No trust ပါ၊
      ဘယ်သူ့ကိုမှ၊ ကိုယ့် component ကိုတောင် အလိုလို မယုံရဘူး ဆိုတဲ့ မူပါ။
    sources:
