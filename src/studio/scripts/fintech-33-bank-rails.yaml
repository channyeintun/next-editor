      clearing.go: |
        package main

        // Payment is one obligation between two banks inside the same clearing cycle.
        type Payment struct {
        	From, To string
        	Amount   int64 // cents
        }

        // gross is what moves when every payment is settled on its own.
        func gross(ps []Payment) int64 {
        	var sum int64
        	for _, p := range ps {
        		sum += p.Amount
        	}
        	return sum
        }

        // net turns many payments into one position per bank: negative pays, positive receives.
        func net(ps []Payment) map[string]int64 {
        	pos := map[string]int64{}
        	for _, p := range ps {
        		pos[p.From] -= p.Amount
        		pos[p.To] += p.Amount
        	}
        	return pos
        }
      main.go: |
        package main

        import (
        	"fmt"
        	"strings"
        )

        // validIBAN is the ISO 13616 check: move the first four characters to the end, turn each
        // letter into two digits (A = 10 … Z = 35), and the whole number mod 97 must be 1.
        func validIBAN(iban string) bool {
        	s := strings.ReplaceAll(iban, " ", "")
        	if len(s) < 5 {
        		return false
        	}
        	rem := 0
        	for _, c := range s[4:] + s[:4] {
        		switch {
        		case c >= '0' && c <= '9':
        			rem = (rem*10 + int(c-'0')) % 97
        		case c >= 'A' && c <= 'Z':
        			rem = (rem*100 + int(c-'A'+10)) % 97
        		default:
        			return false
        		}
        	}
        	return rem == 1
        }

        func main() {
        	for _, iban := range []string{
        		"GB82 WEST 1234 5698 7654 32", // published example
        		"DE89 3704 0044 0532 0130 00", // published example
        		"GB82 WEST 1234 5698 7654 23", // the last two digits swapped
        	} {
        		fmt.Println(iban, "valid:", validIBAN(iban))
        	}
        }

        // cents prints minor units as an amount with two decimals: cents(1234) is "12.34".
        func cents(n int64) string {
        	sign := ""
        	if n < 0 {
        		sign, n = "-", -n
        	}
        	return fmt.Sprintf("%s%d.%02d", sign, n/100, n%100)
        }
