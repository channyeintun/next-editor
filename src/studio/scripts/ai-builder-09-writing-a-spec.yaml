# AI Builder, lesson 09: writing a spec (Burmese, docs kind).
#
# Start state (ws/): base-docs (package.json with a no-op dev script, notes.md), docs/problem.md
# (COURSE-KIT §4.1, complete), docs/requirements.md (§4.2 as L07 leaves it) and docs/spec.md as L08
# leaves it: the title line, a blank line, ## Acceptance criteria (AC-1…AC-5) and ## Definition of
# done. Nothing runs.
#
# Typed into spec.md (COURSE-KIT §4.3, insert-only): Goal, Users, Rules, Example, Out of scope between
# the title and the criteria (each anchored after the previous section), then ## Open questions at
# the end. The final file equals §4.3 without AC-6 (tools/sim-docs.ts).
#
# Boards: (S) the spec as a stack of its sections, each with the question it answers (the criteria
# already there, green); (C) three unclear sentences and their clear versions; (G) before building:
# read it as a newcomer → ask the agent for gaps (questions, not code) → ask မြမြ; (Z) the quiz.
#
# Build: bun ~/Documents/ai-builder-course-work/tools/build-lesson.ts template.yaml ws ai-builder-09-writing-a-spec.yaml
