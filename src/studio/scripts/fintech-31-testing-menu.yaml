  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] Fintech interview တွေမှာ idempotency နဲ့ crash safety ကို ဘယ်လို test ရေးမလဲ လို့ မေးလေ့ရှိပါတယ်။ key ပါတဲ့ request ကို နှစ်ခါ ပို့ကြည့်ပါမယ် လို့ပဲ ဖြေရင် မလုံလောက်ပါဘူး။ [[mark:iv-a]] ပထမ၊ operation တွေကို registry တစ်ခုမှာ declare လုပ်ပြီး harness က အားလုံးကို နှစ်ခါ run ပါတယ်။ operation အသစ် ထည့်တာနဲ့ test ပါပြီးသား ဖြစ်ပါတယ်။ [[mark:iv-b]] ဒုတိယ၊ flow ရဲ့ step တိုင်းနောက်မှာ crash ကို inject လုပ်ပြီး resume လုပ်ပါတယ်။ effect ပြီးပြီး progress မသိမ်းရသေးတဲ့ အချိန်က အဆိုးဆုံးပါ။ [[mark:iv-c]] တတိယ၊ oracle က crash မဖြစ်တဲ့ run ရဲ့ အဆုံး state နဲ့ invariant တွေပါ။ random operation sequence နဲ့ ပေါင်းသုံးပြီး seed ကို log ထုတ်ထားပါတယ်။ [[mark:iv-d]] ပြီးရင် ဒါတွေကို CI မှာ မဖြစ်မနေ run ပြီး၊ production မှာ synthetic transaction ကို ledger ထဲကပဲ ဖြတ်ပြီး reversal နဲ့ ရှင်းမယ် လို့ ဆက်ပြောပါ။
    sources:
