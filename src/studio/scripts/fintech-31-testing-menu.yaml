  - id: senior
    narration: >-
      [[mark:close-prod]] ဒီ နည်းတွေ ကြာလာရင် ပျက်တတ်တဲ့ နေရာ နှစ်ခု ရှိပါတယ်။ [[mark:open-compat]] ပထမက golden test ပါ။ [[mark:sel-golden]] ဒီ string က reviewer တစ်ယောက် စစ်ပြီးသား အဖြေပါ။ fail တဲ့ အခါ test ကို pass အောင် string ကို အသစ်နဲ့ အစားထိုးလိုက်ရင် golden test ရဲ့ အဓိပ္ပာယ် ပျောက်သွားပါတယ်။ ဒါကြောင့် golden ပြောင်းတာကို code change တစ်ခုလိုပဲ diff ကို review လုပ်ပြီးမှ လက်ခံရပါတယ်။ [[mark:sel-corpus]] ဒုတိယက corpus ပါ။ code အဟောင်း ရေးခဲ့မယ်လို့ ကိုယ် ထင်တာကို လက်နဲ့ ရေးထားရင် ကိုယ့် ယူဆချက်ကိုပဲ စစ်တာ ဖြစ်ပါတယ်။ production storage ထဲက တကယ့် payload အဟောင်းတွေကို နမူနာ ယူထားမှ မှတ်မထားမိတဲ့ field၊ format ကွဲတာတွေ ပါလာပါတယ်။
