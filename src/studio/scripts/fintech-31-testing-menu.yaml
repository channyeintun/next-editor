# Fintech Engineering, lesson 31: the testing menu for money systems (Burmese).
#
# Source: Fintech Engineering Handbook, "Testing" (generative idempotency, crash and resume
# injection, round-trip, golden, backward compatibility, testing in production) (CC BY 4.0,
# Voytek Pitula).
# Start state: ops.go holds a tiny wallet and three operations with idempotency keys (Fee forgets
# its key check: the harness is meant to find it); flow.go a three-step withdrawal flow that saves
# its progress and can be made to crash; compat.go a fee breakdown, its golden string, a corpus of
# old event payloads and today's decoder; money.go the course's Money helpers; main.go the
# apply-twice harness.
# Edits, all insert-only, in main.go:
#   1. crash injection after every step of the flow, then resume -> run-2: the fee step differs
#   2. a golden check of the fee breakdown and the old-event corpus with a round trip -> run-3
# Figures: menu (the six techniques), twice (apply once vs twice), crash (a crash after each step),
# prod (testing in production through the same books), iv (the interview answer).
# Built by ~/Documents/fintech-course-work/tools/build-lesson.ts; fixtures by sim-go.ts --write.
