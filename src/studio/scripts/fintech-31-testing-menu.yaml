      compat.go: |
        package main

        import (
        	"encoding/json"
        	"fmt"
        	"strings"
        )

        // feeBreakdown splits the fee on a payment into its parts (example rates, not real ones).
        func feeBreakdown(amount int64) string {
        	processing, fixed, platform := amount*14/1000, int64(25), amount*125/10000
        	return fmt.Sprintf("processing %s + fixed %s + platform %s = %s", format(processing, 2),
        		format(fixed, 2), format(platform, 2), format(processing+fixed+platform, 2))
        }

        // goldenFee is the breakdown of a 100.00 payment as a reviewer checked it once.
        const goldenFee = "processing 1.40 + fixed 0.25 + platform 1.25 = 2.90"

        // corpus holds events as older versions of the code wrote them.
        var corpus = []string{
        	`{"v":1,"amount":"12.34","currency":"EUR"}`,
        	`{"v":2,"amount_minor":1234,"currency":"EUR"}`,
        }

        type event struct {
        	V           int    `json:"v"`
        	Amount      string `json:"amount,omitempty"`
        	AmountMinor int64  `json:"amount_minor"`
        	Currency    string `json:"currency"`
        }

        // decode reads every version this system ever wrote into today's Money.
        func decode(raw string) (Money, error) {
        	var e event
        	if err := json.NewDecoder(strings.NewReader(raw)).Decode(&e); err != nil {
        		return Money{}, err
        	}
        	if e.V == 1 {
        		n, err := parseMinor(e.Amount, exponent[e.Currency])
        		return Money{n, e.Currency}, err
        	}
        	return Money{e.AmountMinor, e.Currency}, nil
        }

        // encode writes today's version.
        func encode(m Money) string {
        	b, _ := json.Marshal(event{V: 2, AmountMinor: m.Amount, Currency: m.Currency})
        	return string(b)
        }
      flow.go: |
        package main

        // flow is three steps, money in, the fee and the payout, each an operation with its own key.
        var flow = []Op{Deposit{"d-1", 10000}, Fee{"f-1", 290}, Payout{"p-1", 8000}}

        // run performs the flow from its saved step. With crashAfter >= 0 the process dies right after
        // that step's effect and before its progress is saved: the worst moment to crash.
        func run(s *State, crashAfter int) {
        	for i := s.Step; i < len(flow); i++ {
        		flow[i].Apply(s)
        		if i == crashAfter {
        			return
        		}
        		s.Step = i + 1
        	}
        }
      main.go: |
        package main

        import "fmt"

        func main() {
        	for _, op := range flow {
        		once, twice := fresh(), fresh()
        		op.Apply(once)
        		op.Apply(twice)
        		op.Apply(twice)
        		if twice.String() == once.String() {
        			fmt.Println("twice", op.Name()+": no change")
        		} else {
        			fmt.Println("twice", op.Name()+": changed,", twice)
        		}
        	}
        }
      money.go: |
        package main

        import (
        	"fmt"
        	"strings"
        )

        // exponent is the number of decimal places of each currency this system accepts (ISO 4217).
        var exponent = map[string]int{"EUR": 2, "USD": 2, "JPY": 0, "BHD": 3}

        // Money is an amount counted in the currency's minor units. It is never a float.
        type Money struct {
        	Amount   int64
        	Currency string
        }

        // String prints 1234 EUR as "12.34 EUR".
        func (m Money) String() string {
        	return format(m.Amount, exponent[m.Currency]) + " " + m.Currency
        }

        // format prints minor units with exp decimal places: format(1234, 2) is "12.34".
        func format(minor int64, exp int) string {
        	sign := ""
        	if minor < 0 {
        		sign, minor = "-", -minor
        	}
        	digits := fmt.Sprintf("%0*d", exp+1, minor)
        	if exp == 0 {
        		return sign + digits
        	}
        	return sign + digits[:len(digits)-exp] + "." + digits[len(digits)-exp:]
        }

        // parseMinor reads a decimal string such as "12.34" into minor units without using a float.
        func parseMinor(s string, exp int) (int64, error) {
        	whole, frac, _ := strings.Cut(s, ".")
        	if len(frac) > exp {
        		return 0, fmt.Errorf("%q has more than %d decimal places", s, exp)
        	}
        	frac += strings.Repeat("0", exp-len(frac))
        	var n int64
        	for _, c := range whole + frac {
        		if c < '0' || c > '9' {
        			return 0, fmt.Errorf("%q is not a decimal number", s)
        		}
        		n = n*10 + int64(c-'0')
        	}
        	return n, nil
        }
      ops.go: |
        package main

        import "fmt"

        // State is a tiny wallet: its balance, what it paid out, the fees taken, the idempotency
        // keys already handled, and the flow's saved progress (steps finished so far).
        type State struct {
        	Balance, PaidOut, Fees int64
        	Seen                   map[string]bool
        	Step                   int
        }

        // fresh is a wallet that already holds 100.00.
        func fresh() *State { return &State{Balance: 10000, Seen: map[string]bool{}} }

        func (s *State) String() string {
        	return fmt.Sprintf("balance %s, paid out %s, fees %s",
        		format(s.Balance, 2), format(s.PaidOut, 2), format(s.Fees, 2))
        }

        // Op is an operation the system declares. Each one carries its idempotency key.
        type Op interface {
        	Apply(s *State)
        	Name() string
        }

        type Deposit struct {
        	Key    string
        	Amount int64
        }

        type Fee struct {
        	Key    string
        	Amount int64
        }

        type Payout struct {
        	Key    string
        	Amount int64
        }

        func (o Deposit) Name() string { return "deposit" }
        func (o Fee) Name() string     { return "fee" }
        func (o Payout) Name() string  { return "payout" }

        func (o Deposit) Apply(s *State) {
        	if s.Seen[o.Key] {
        		return
        	}
        	s.Seen[o.Key] = true
        	s.Balance += o.Amount
        }

        func (o Fee) Apply(s *State) {
        	s.Balance -= o.Amount
        	s.Fees += o.Amount
        }

        func (o Payout) Apply(s *State) {
        	if s.Seen[o.Key] {
        		return
        	}
        	s.Seen[o.Key] = true
        	s.Balance -= o.Amount
        	s.PaidOut += o.Amount
        }
