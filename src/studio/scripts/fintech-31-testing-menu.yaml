      run-3:
        status: success
        exitCode: 0
        output: "twice deposit: no change\ntwice fee: changed, balance 94.20, paid out 0.00, fees 5.80\ntwice payout: no change\ncrash after deposit, resume: true\ncrash after fee, resume: false\ncrash after payout, resume: true\ngolden fee: true\nold event v1: 12.34 EUR, round trip: true\nold event v2: 12.34 EUR, round trip: true\n"

scenes:
  - id: hook
    chapter: Test menu
    narration: >-
      ငွေ system မှာ retry တစ်ခုက ငွေကို နှစ်ခါ ရွှေ့နိုင်ပြီး၊ crash တစ်ခုက flow ကို တစ်ဝက်မှာ ရပ်သွားစေနိုင်ပါတယ်။ idempotency နဲ့ resumable flow တွေကို ဒါတွေအတွက် တည်ဆောက်ခဲ့ပေမဲ့၊ code ထဲမှာ တကယ် မှန်နေကြောင်း test က ပြရပါတယ်။ [[mark:show-menu]] property test အပြင် ရွေးလို့ရတဲ့ နည်း ခြောက်မျိုး ရှိပြီး၊ menu တစ်ခုလိုပဲ ကိုယ့် system မှာ အကျိုးအရှိဆုံး နည်းတွေကို ရွေးသုံးရပါတယ်။ [[mark:pt-row1]] ပထမ နှစ်မျိုးက retry နဲ့ crash အတွက်ပါ။ No invented data၊ ဆိုလိုတာက ငွေကို မရှိဘဲ မဖန်တီးရဘူး ဆိုတဲ့ မူကို ထိန်းပြီး၊ ပြန်လုပ်တာနဲ့ ပြန်ဆက်တာက ငွေကို နှစ်ခါ မတွက်ကြောင်း ပြပါတယ်။ [[mark:menu-2]] နောက် သုံးမျိုးက data ရဲ့ boundary နဲ့ အချိန်အတွက်ပါ။ golden test က review လုပ်ထားတဲ့ တွက်ချက်မှု မထင်မှတ်ဘဲ မပြောင်းကြောင်း ပြပါတယ်။ round-trip နဲ့ data အဟောင်း test ကတော့ precision နဲ့ history က format ပြောင်းတာ၊ နှစ်တွေ ကြာတာကို ဖြတ်ပြီး ကျန်ကြောင်း ပြပါတယ်။ ဒါက No lost data၊ ဆိုလိုတာက ငွေနဲ့ ပတ်သက်ပြီး ဖြစ်ခဲ့သမျှ မပျောက်ရဘူး ဆိုတဲ့ မူပါ။ [[mark:menu-3]] နောက်ဆုံးက production ထဲမှာ test လုပ်တာပါ။ No trust၊ ဆိုလိုတာက ဘယ်သူ့ကိုမှ၊ ကိုယ့် component ကိုတောင် အလိုလို မယုံရဘူး ဆိုတဲ့ မူအရ တချို့ ယုံကြည်မှုကို တကယ့် system ပေါ်မှာပဲ ရနိုင်လို့ပါ။ ပထမ နှစ်မျိုးကနေ code နဲ့ စကြည့်ရအောင်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Testing (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#testing",
        }
      - {
          title: "Fintech Engineering Handbook — Principles (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#principles",
        }
    actions:
      - {
          id: show-menu,
          type: slide.show,
          at: { mark: show-menu, offsetMs: -700 },
          slideId: menu-1,
        }
      - { id: pt-row1, type: slide.point, at: { mark: pt-row1 }, target: { x: 0.131, y: 0.367 } }
      - { id: menu-2, type: slide.show, at: { mark: menu-2 }, slideId: menu-2 }
      - {
          id: pt-row3,
          type: slide.point,
          at: { afterAction: menu-2 },
          target: { x: 0.131, y: 0.553 },
        }
      - { id: menu-3, type: slide.show, at: { mark: menu-3 }, slideId: menu-3 }
      - {
          id: pt-row6,
          type: slide.point,
          at: { afterAction: menu-3 },
          target: { x: 0.131, y: 0.833 },
        }

  - id: twice
    chapter: Generative idempotency
    narration: >-
      [[mark:close-menu]] ops ဖိုင်မှာ wallet တစ်ခုနဲ့ operation သုံးခု ရှိပါတယ်၊ deposit၊ fee နဲ့ payout ပါ။ [[mark:open-ops]] တစ်ခုစီမှာ idempotency key ပါပါတယ်။ [[mark:sel-key]] deposit က အဲဒီ key ကို အရင် မြင်ဖူးရင် ဘာမှ မလုပ်ဘဲ ပြန်ထွက်ပါတယ်။ သုံးခုထဲက တစ်ခုကို ဒီ check မပါဘဲ ရည်ရွယ်ချက်ရှိရှိ ရေးထားပြီး၊ ဘယ်ဟာလဲ ဆိုတာကို harness က ရှာရမှာပါ။ [[mark:open-main]] ဒီ loop က system declare လုပ်ထားတဲ့ operation တိုင်းကို ယူပါတယ်။ [[mark:sel-twice]] wallet အသစ် နှစ်ခုပေါ်မှာ တစ်ခုကို တစ်ခါ၊ နောက်တစ်ခုကို နှစ်ခါ apply လုပ်ပြီး state နှစ်ခုကို ယှဉ်ပါတယ်။ ဒုတိယ call က ဘာမှ မပြောင်းရင် idempotent ပါ။ [[mark:run-1]] run လိုက်ရအောင်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Testing (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#testing",
        }
      - {
          title: "Fintech Engineering Handbook — Idempotency (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#idempotency",
        }
    actions:
      - { id: close-menu, type: slide.close, at: { mark: close-menu } }
      - { id: open-ops, type: workspace.openFile, at: { mark: open-ops }, path: ops.go }
      - id: sel-key
        type: editor.select
        at: { mark: sel-key }
        target: { file: ops.go, text: "\tif s.Seen[o.Key] {\n\t\treturn\n\t}", occurrence: 1 }
      - { id: open-main, type: workspace.openFile, at: { mark: open-main }, path: main.go }
      - id: sel-twice
        type: editor.select
        at: { mark: sel-twice }
        target:
          {
            file: main.go,
            text: "\t\top.Apply(once)\n\t\top.Apply(twice)\n\t\top.Apply(twice)",
            occurrence: 1,
          }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "twice fee: changed, balance 94.20",
          timeoutMs: 8000,
        }

  - id: read-twice
    narration: >-
      [[mark:pt-dep]] deposit နဲ့ payout က ဒုတိယ call မှာ ဘာမှ မပြောင်းပါဘူး။ [[mark:pt-fee]] fee ကတော့ နှစ်ခါ ကောက်သွားလို့ balance က ယူရို ၉၄ ဒသမ နှစ် ဖြစ်သွားပြီး fee စုစုပေါင်း နှစ်ဆ ဖြစ်နေပါတယ်။ [[mark:show-twice]] ဒီ harness က ဘယ်လို အလုပ်လုပ်လဲ ဆိုတာ ပြန်ကြည့်ရအောင်။ deposit ကို ဒုတိယ အကြိမ် ခေါ်တော့ key ကို မြင်ပြီးသား ဖြစ်လို့ state မပြောင်းပါဘူး။ [[mark:twice-2]] fee မှာတော့ key ကို မစစ်လို့ ယူရို နှစ်ဒသမ ကိုး ထပ်ကောက်ပါတယ်။ [[mark:pt-rule]] အဓိက အချက်က operation တွေကို တစ်နေရာတည်းမှာ declare လုပ်ထားတာပါ။ ဒါမှ operation အသစ် ထည့်တာနဲ့ harness က အလိုလို နှစ်ခါ စမ်းပေးပြီး၊ test ရေးဖို့ မေ့သွားလို့ မရတော့ပါဘူး။
    sources:
      - {
          title: "Fintech Engineering Handbook — Testing (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#testing",
        }
    actions:
      - id: pt-dep
        type: console.point
        at: { mark: pt-dep }
        target: { text: "twice deposit: no change", occurrence: 1 }
      - id: pt-fee
        type: console.point
        at: { mark: pt-fee }
        target: { text: "twice fee: changed, balance 94.20", occurrence: 1 }
      - {
          id: show-twice,
          type: slide.show,
          at: { mark: show-twice, offsetMs: -700 },
          slideId: twice-1,
        }
      - {
          id: pt-d2,
          type: slide.point,
          at: { afterAction: show-twice },
          target: { x: 0.844, y: 0.464 },
        }
      - { id: twice-2, type: slide.show, at: { mark: twice-2 }, slideId: twice-2 }
      - {
          id: pt-f2,
          type: slide.point,
          at: { afterAction: twice-2 },
          target: { x: 0.844, y: 0.776 },
        }
      - { id: pt-rule, type: slide.point, at: { mark: pt-rule }, target: { x: 0.494, y: 0.909 } }

  - id: crash
    chapter: Crash နဲ့ resume
    narration: >-
      [[mark:close-twice]] ဒုတိယ နည်းက flow တစ်ခုကို step ကြားမှာ သေခိုင်းတာပါ။ flow ဖိုင်ထဲက flow မှာ deposit၊ fee၊ payout ဆိုတဲ့ step သုံးခု ရှိပြီး၊ step တစ်ခု ပြီးတိုင်း ဘယ်အထိ ရောက်ပြီလဲ ဆိုတာကို သိမ်းပါတယ်။ [[mark:type-crash]] ဒီ code က ပထမဆုံး crash မဖြစ်တဲ့ run ကို အဖြေမှန်အဖြစ် ယူပါတယ်။ ပြီးရင် step တိုင်းအတွက် wallet အသစ် တစ်ခုပေါ်မှာ flow ကို အဲဒီ step ရဲ့ effect ပြီးပြီး progress မသိမ်းရသေးခင်မှာ သေခိုင်းပါတယ်။ ဒါက crash ဖြစ်ဖို့ အဆိုးဆုံး အချိန်ပါ။ ပြီးတော့ resume လုပ်ပြီး အဆုံး state ကို အဖြေမှန်နဲ့ ယှဉ်ပါတယ်။ ဘယ် step မှာ မကိုက်မလဲ ခန့်မှန်းကြည့်ပါ။ [[mark:run-2]] run လိုက်ရအောင်။ [[mark:pt-c1]] deposit ပြီးတဲ့ နောက် သေရင် resume က deposit ကို ပြန် run ပေမဲ့ key ကြောင့် တစ်ခါပဲ တွက်ပါတယ်။ [[mark:pt-c2]] fee ပြီးတဲ့ နောက် သေရင်တော့ အဆုံး state မတူပါဘူး။ [[mark:pt-c3]] payout ကလည်း key ကြောင့် ပြန် run တာကို ကာကွယ်ထားလို့ မှန်ပါတယ်။ [[mark:dock-2]] ပထမ harness က ရှာတွေ့တဲ့ bug ကို တခြား လမ်းကနေ ပြန်တွေ့တာပါ။ retry မရှိတဲ့ system မှာတောင် crash တစ်ခုက operation ကို နှစ်ခါ run စေနိုင်ပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Testing (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#testing",
        }
      - {
          title: "Fintech Engineering Handbook — Full resumability (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#full-resumability",
        }
    actions:
      - { id: close-twice, type: slide.close, at: { mark: close-twice } }
      - id: type-crash
        type: editor.type
        at: { mark: type-crash }
        target:
          {
            file: main.go,
            after: "\t\t\tfmt.Println(\"twice\", op.Name()+\": changed,\", twice)\n\t\t}\n\t}\n",
            occurrence: 1,
          }
        text: "\n\twant := fresh()\n\trun(want, -1)\n\tfor crash := range flow {\n\t\ts := fresh()\n\t\trun(s, crash)\n\t\trun(s, -1)\n\t\tfmt.Println(\"crash after\", flow[crash].Name()+\", resume:\", s.String() == want.String())\n\t}\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "crash after fee, resume: false",
          timeoutMs: 8000,
        }
      - id: pt-c1
        type: console.point
        at: { mark: pt-c1 }
        target: { text: "crash after deposit, resume: true", occurrence: 1 }
      - id: pt-c2
        type: console.point
        at: { mark: pt-c2 }
        target: { text: "crash after fee, resume: false", occurrence: 1 }
      - id: pt-c3
        type: console.point
        at: { mark: pt-c3 }
        target: { text: "crash after payout, resume: true", occurrence: 1 }
      - { id: dock-2, type: runtime.collapseDock, at: { mark: dock-2 } }

  - id: crash-fig
    narration: >-
      [[mark:show-crash]] flow ကို step တစ်ခုချင်း ကြည့်ရအောင်။ step တစ်ခု ပြီးတိုင်း progress ကို သိမ်းထားလို့ crash ဖြစ်ရင် နောက်ဆုံး သိမ်းထားတဲ့ နေရာကနေ ဆက်ပါတယ်။ [[mark:crash-2]] fee ရဲ့ effect ပြီးပြီ၊ ဒါပေမဲ့ progress မသိမ်းရသေးခင် သေသွားတော့ resume က fee ကို နောက်တစ်ခါ run ပါတယ်။ idempotency key မစစ်တဲ့ fee က ယူရို နှစ်ဒသမ ကိုး ထပ်ကောက်ပါတယ်။ [[mark:crash-3]] ဒီ test က step တိုင်းနောက်မှာ crash ကို တစ်ခုချင်း ထည့်ပြီး၊ crash မဖြစ်တဲ့ run နဲ့ ယှဉ်ပါတယ်။ တကယ့် harness မှာ ဒီ crash point တွေကို လက်နဲ့ ရွေးမထားဘဲ database write နဲ့ provider call တိုင်းမှာ အလိုလို ထည့်တာ ပိုကောင်းပါတယ်။
    sources:
      - {
