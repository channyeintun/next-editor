  - id: golden
    chapter: Golden၊ round-trip၊ data အဟောင်း
    narration: >-
      [[mark:close-crash]] နောက် သုံးမျိုးကို code တစ်ပိုင်းတည်းမှာ ကြည့်ရအောင်။ [[mark:type-golden]] ပထမ line က golden test ပါ။ ယူရို ၁၀၀ payment ရဲ့ fee breakdown ကို တစ်ခါ review လုပ်ပြီး string အဖြစ် သိမ်းထားပြီး၊ ဒီနေ့ code ရဲ့ output နဲ့ အတိအကျ ယှဉ်ပါတယ်။ [[mark:corpus]] အောက်က loop ကတော့ code အဟောင်းတွေ ရေးခဲ့တဲ့ event တွေကို ဒီနေ့ decoder နဲ့ ဖတ်ပါတယ်။ version တစ်က ပမာဏကို decimal string နဲ့ ရေးပြီး၊ version နှစ်က minor unit ကိန်းပြည့်နဲ့ ရေးပါတယ်။ ဖတ်ပြီးရင် format အသစ်နဲ့ encode လုပ်၊ ပြန် decode လုပ်ပြီး မူလ တန်ဖိုး ပြန်ရလား စစ်ပါတယ်၊ ဒါက round-trip test ပါ။ [[mark:run-3]] run လိုက်ရအောင်။ [[mark:pt-gold]] fee breakdown က review လုပ်ထားတဲ့ အဖြေနဲ့ ကိုက်ပါတယ်။ fee တွက်ပုံ တစ်နေရာ ပြောင်းမိရင် ဒီ line က false ဖြစ်သွားပြီး၊ breakdown အသစ်နဲ့ အဟောင်းကို ယှဉ်ကြည့်ခိုင်းပါတယ်။ [[mark:pt-v1]] version တစ် event ကို ယူရို ဆယ့်နှစ် ဒသမ သုံးလေး အဖြစ် အတိအကျ ဖတ်နိုင်ပြီး၊ [[mark:pt-v2]] version နှစ်ကလည်း တန်ဖိုး အတူတူ ရပြီး round-trip လည်း မှန်ပါတယ်။ [[mark:dock-3]] event တွေက နှစ်ပေါင်းများစွာ သိမ်းထားရတာ ဖြစ်လို့ schema ပြောင်းတိုင်း history ကို တိတ်တိတ်လေး မပျက်စေဖို့ ဒီ corpus က ကာကွယ်ပေးပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — Testing (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#testing",
        }
      - {
          title: "Fintech Engineering Handbook — Event sourcing (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#event-sourcing",
        }
      - { title: "Go standard library — encoding/json", url: "https://pkg.go.dev/encoding/json" }
    actions:
      - { id: close-crash, type: slide.close, at: { mark: close-crash } }
      - id: type-golden
        type: editor.type
        at: { mark: type-golden }
        target:
          {
            file: main.go,
            after: "\t\tfmt.Println(\"crash after\", flow[crash].Name()+\", resume:\", s.String() == want.String())\n\t}\n",
            occurrence: 1,
          }
        text: "\n\tfmt.Println(\"golden fee:\", feeBreakdown(10000) == goldenFee)\n\tfor i, raw := range corpus {\n\t\tm, err := decode(raw)\n\t\tback, _ := decode(encode(m))\n\t\tfmt.Printf(\"old event v%d: %v, round trip: %v\\n\", i+1, m, err == nil && back == m)\n\t}\n"
        cadence: line-by-line
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "old event v1: 12.34 EUR, round trip: true",
          timeoutMs: 8000,
        }
      - id: pt-gold
        type: console.point
        at: { mark: pt-gold }
        target: { text: "golden fee: true", occurrence: 1 }
      - id: pt-v1
        type: console.point
        at: { mark: pt-v1 }
        target: { text: "old event v1: 12.34 EUR, round trip: true", occurrence: 1 }
      - id: pt-v2
        type: console.point
        at: { mark: pt-v2 }
        target: { text: "old event v2: 12.34 EUR, round trip: true", occurrence: 1 }
      - {
          id: expect-file-crash,
          type: expect.file,
          at: { afterAction: run-3 },
          path: main.go,
          contains: "run(s, crash)",
        }
      - { id: dock-3, type: runtime.collapseDock, at: { mark: dock-3 } }

  - id: prod
    chapter: Production ထဲမှာ test လုပ်ခြင်း
    narration: >-
      [[mark:show-prod]] တချို့ ယုံကြည်မှုကိုတော့ တကယ့် system ပေါ်မှာပဲ ရနိုင်ပါတယ်။ provider sandbox တွေက production နဲ့ အများကြီး ကွာတတ်ပါတယ်။ ဒါကြောင့် integration တစ်ခု အလုပ်လုပ်ကြောင်း နောက်ဆုံး သက်သေကို များသောအားဖြင့် canary release၊ blast radius သေးတဲ့ rollout ဒါမှမဟုတ် ငွေ အနည်းငယ်ကို အမြဲ ဖြတ်ပို့နေတဲ့ synthetic transaction တွေနဲ့ ယူရပါတယ်။ [[mark:pt-syn]] ငွေ system မှာ ထူးခြားတာက ဒီ test တွေက တကယ့် ငွေကို ရွှေ့တာပါ။ ဒါကြောင့် တခြား ငွေတွေ ဖြတ်တဲ့ ledger၊ reconciliation နဲ့ audit trail ထဲကပဲ ဖြတ်ရပြီး၊ synthetic လို့ tag ရှင်းရှင်း တပ်ထားရပါတယ်။ [[mark:prod-2]] test ပြီးရင် ရှင်းတာကိုလည်း ပုံမှန် reversal လမ်းကြောင်းနဲ့ပဲ လုပ်ရပါတယ်။ [[mark:prod-3]] test row တွေကို database ထဲကနေ တိုက်ရိုက် ဖျက်တာက books ကို ကျော်တဲ့ back door ဖြစ်ပြီး၊ နောက်တစ်ကြိမ် reconcile လုပ်တဲ့ အခါ ledger နဲ့ ဘဏ် မကိုက်တော့ပါဘူး။
    sources:
      - {
          title: "Fintech Engineering Handbook — Testing (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#testing",
        }
      - {
          title: "Fintech Engineering Handbook — Consuming APIs (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#consuming-apis",
        }
    actions:
      - {
          id: show-prod,
          type: slide.show,
          at: { mark: show-prod, offsetMs: -700 },
          slideId: prod-1,
        }
      - {
          id: pt-kinds,
          type: slide.point,
          at: { afterAction: show-prod },
          target: { x: 0.248, y: 0.292 },
        }
      - { id: pt-syn, type: slide.point, at: { mark: pt-syn }, target: { x: 0.153, y: 0.509 } }
      - { id: prod-2, type: slide.show, at: { mark: prod-2 }, slideId: prod-2 }
      - {
