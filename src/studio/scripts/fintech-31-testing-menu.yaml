  - id: try-it
    narration: >-
      [[mark:close-iv]] ကိုယ်တိုင် စမ်းကြည့်ဖို့ တစ်ခု ရှိပါတယ်။ [[mark:open-ops2]] ops ဖိုင်ထဲက fee ကို ပြင်ရမှာပါ။ [[mark:sel-try]] deposit ရဲ့ ထိပ်ဆုံးက key စစ်တဲ့ line သုံးကြောင်းနဲ့ key ကို မှတ်တဲ့ line ကို fee ရဲ့ အစမှာ ထည့်ပြီး run ကြည့်ပါ။ နှစ်ခါ run တဲ့ harness မှာ fee က no change ဖြစ်သွားပြီး၊ crash harness မှာလည်း step သုံးခုလုံး true ဖြစ်ပါလိမ့်မယ်။ bug တစ်ခုတည်းကို ပြင်တာနဲ့ test နှစ်မျိုးလုံး ပြောင်းသွားတာပါ။ [[mark:recap]] ပြန်ချုပ်ရရင်၊ ငွေ system ရဲ့ test က menu တစ်ခုပါ။ နှစ်ခါ run တာ၊ crash ထည့်တာက ငွေ ပိုမထွက်ကြောင်း ပြပါတယ်။ round-trip နဲ့ data အဟောင်း test က precision နဲ့ history မပျောက်ကြောင်း၊ golden က တွက်ချက်မှု မထင်မှတ်ဘဲ မပြောင်းကြောင်း ပြပြီး၊ production test ကတော့ books ထဲကပဲ ဖြတ်ရပါတယ်။ နောက် lesson ကစပြီး domain ကို သိအောင် လေ့လာပါမယ်။ card ကို tap လိုက်တာကနေ merchant ရဲ့ bank account ထဲ ငွေ ရောက်တဲ့အထိ ဘယ်သူတွေ၊ ဘယ် message တွေ ပါလဲ ဆိုတာပါ။
