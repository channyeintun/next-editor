build:
  voiceProfile:
    # Studio replaces this built-in profile with the selected Burmese VoxCPM2
    # profile at render time when the signed-in user has the D1 capability.
    pocket-alba-v1
  seed: 47

runtime:
  kind: rust-playground
  defaultMode: fixture
  fixture:
    latencyMs: 600
    result:
      status: success
      stdout: "longest: lifetimes\n"
      stderr: ""

scenes:
  - id: lifetimes
    chapter: Lifetime ဆိုတာ ဘာလဲ
    narration: >-
      Rust မှာ reference တိုင်းဟာ program ရဲ့ အပိုင်း တစ်ပိုင်းအတွင်းမှာပဲ သုံးလို့ ရပါတယ်။ အဲဒီ
      သုံးလို့ ရနေတဲ့ ကာလကို reference ရဲ့ lifetime လို့ ခေါ်ပါတယ်။ အများအားဖြင့်တော့ compiler က
      အဲဒီ lifetime ကို ကိုယ့်အစား တွက်ပေးပါတယ်။ ဒါပေမဲ့ reference တွေက function တစ်ခုထဲ ဝင်သွားပြီး
      ပြန်ထွက်လာတဲ့အခါမျိုးမှာတော့၊ compiler က ကိုယ့်ဆီကနေ အချက်အလက် တစ်ခု ထပ်တောင်းတတ်ပါတယ်။
      ဘာကြောင့် လိုတာလဲ၊ ပြီးတော့ အဲဒီ အချက်အလက်ကို ဘယ်လို ရေးရလဲ ဆိုတာ ကြည့်ရအောင်။
    sources:
      - title: "The Rust Book — Validating References with Lifetimes"
        url: "https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html"
    actions:
      # Opens in the quiet handle before the first word.
      - id: show-life
        type: slide.show
        at: { scene: start, offsetMs: -1200 }
        slideId: lifetimes-slide

  - id: dangling
    narration: >-
      အရင်ဆုံး Rust က lifetime တွေကို ဘာကြောင့် လိုက်စစ်နေရလဲ ဆိုတာ ကြည့်ရအောင်။ [[mark:draw-code]]
      ဒီမှာ r ဆိုတဲ့ variable ကို တန်ဖိုး မထည့်သေးဘဲ ကြေညာထားပါတယ်။ x ကတော့ အတွင်းဘက် scope
      တစ်ခုထဲမှာ ရှိပြီး၊ r က x ကို borrow လုပ်ထားပါတယ်၊ borrow ဆိုတာ ငှားသုံးတာပါ။
      [[mark:draw-spans]] r ရဲ့ lifetime က r ကို သုံးတဲ့ နောက်ဆုံး စာကြောင်းအထိ ရောက်ပါတယ်။ x ရဲ့
      lifetime ကတော့ အဲဒီထက် တိုပြီး၊ scope ပိတ်တဲ့ တွန့်ကွင်းမှာ ကုန်သွားပါတယ်။ [[mark:draw-drop]]
      အဲဒီနေရာမှာ x က drop ဖြစ်သွားပြီး၊ သူ့ memory ကို ပြန်လွှတ်လိုက်ပါတယ်။ ဒါပေမဲ့ နောက်ဆုံး
      စာကြောင်းက r ကို သုံးနေတုန်း ဖြစ်တဲ့အတွက်၊ r က မရှိတော့တဲ့ memory ကို ညွှန်နေမှာ ဖြစ်ပါတယ်။
      ဒါကို dangling reference လို့ ခေါ်ပါတယ်။ [[mark:draw-err]] Rust က ဒါကို လက်မခံပါဘူး။ compiler
      က E0597 error နဲ့ ရပ်သွားပါတယ်၊ x က လိုအပ်သလောက် ကြာကြာ မရှိနေဘူးတဲ့။ reference တစ်ခုဟာ သူ
      ညွှန်ထားတဲ့ တန်ဖိုးထက် ဘယ်တော့မှ ပိုကြာကြာ ရှိနေလို့ မရပါဘူး။
    sources:
      - title: "The Rust Book — Dangling References"
        url: "https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#dangling-references"
      - title: "The Rust Book — The Borrow Checker"
        url: "https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#the-borrow-checker"
      - title: "Rust error codes — E0597"
        url: "https://doc.rust-lang.org/error_codes/E0597.html"
    actions:
      - id: close-life-slide
        type: slide.close
        at: { scene: start }
      - id: open-board-dangling
        type: whiteboard.apply
        at: { scene: start, offsetMs: 300 }
        open: true
        upsertIds: [d-title]
      - id: draw-code
        type: whiteboard.apply
        at: { mark: draw-code }
        upsertIds: [d-c1, d-c2, d-c3, d-c4, d-c5, d-c6]
        drawMs: 2400
      - id: draw-spans
        type: whiteboard.apply
        at: { mark: draw-spans }
        upsertIds: [d-r-bar, d-r-label, d-x-bar, d-x-label]
        drawMs: 2400
      - id: draw-drop
        type: whiteboard.apply
        at: { mark: draw-drop }
        upsertIds: [d-drop-circle, d-drop-label, d-use-line, d-dangle]
        drawMs: 3000
      - id: draw-err
        type: whiteboard.apply
        at: { mark: draw-err }
        upsertIds: [d-err]
        drawMs: 1600

  - id: write-longest
    chapter: Function ထဲ ဝင်ထွက်တဲ့ reference တွေ
    narration: >-
      အခု function တစ်ခု ထည့်ကြည့်ရအောင်။ [[mark:open]] ဒီမှာ main function ရှိပါတယ်။ outer ဆိုတဲ့
      String က main ထဲမှာ ရှိပြီး၊ inner ကတော့ အတွင်းဘက် scope တစ်ခုထဲမှာ ရှိပါတယ်။
      [[mark:type-longest]] longest ဆိုတဲ့ function ကို ရေးကြည့်ရအောင်။ သူက string slice နှစ်ခုကို
      လက်ခံပြီး၊ ပိုရှည်တဲ့ တစ်ခုကို ပြန်ပေးပါတယ်။ compiler အတွက် အချက်အလက် ဘာမှ မထည့်သေးဘဲ အရင်
      ရေးကြည့်ပါမယ်။ [[mark:select-ret]] return type ကို ကြည့်ပါ။ reference တစ်ခု ဖြစ်တာတော့
      သေချာပါတယ်။ ဒါပေမဲ့ ဘာကို ညွှန်တဲ့ reference လဲ။ x ကိုလား၊ y ကိုလား။ အဲဒါကို function ရဲ့ body
      က program run နေချိန်မှာမှ ဆုံးဖြတ်ပါတယ်။
    sources:
      - title: "The Rust Book — Generic Lifetimes in Functions"
        url: "https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#generic-lifetimes-in-functions"
    actions:
      - id: close-board-dangling
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-main
        type: workspace.openFile
        at: { mark: open }
        path: main.rs
      - id: type-longest
        type: editor.type
        at: { mark: type-longest }
        target:
          file: main.rs
          after: ""
          occurrence: 1
        cadence: line-by-line
        text: "fn longest(x: &str, y: &str) -> &str {

          \    if x.len() > y.len() { x } else { y }

          }

          \n"
      - id: select-ret
        type: editor.select
        at: { mark: select-ret }
        target:
          file: main.rs
          text: "-> &str"
          occurrence: 1

  - id: missing
    narration: >-
      [[mark:draw-sig]] compiler က ဒီ signature ကို လက်မခံပါဘူး။ reference နှစ်ခု ဝင်သွားပြီး၊ တစ်ခု
      ပြန်ထွက်လာတဲ့ ပုံစံပါ။ [[mark:draw-e0106]] compiler က E0106 error နဲ့ ရပ်သွားပါတယ်၊ lifetime
      ကို သတ်မှတ်ထားတာ မပါဘူးတဲ့။ [[mark:draw-help]] help စာကြောင်းမှာတော့ ပြန်ပေးတဲ့ ရလဒ်က x ဆီက
      borrow လုပ်ထားတာလား၊ y ဆီက borrow လုပ်ထားတာလား ဆိုတာ signature မှာ မပြောထားဘူးလို့ ဆိုပါတယ်။
      ဒါက ဘာကြောင့် အရေးကြီးလဲဆိုတော့၊ longest ကို ခေါ်တဲ့အခါ compiler က အဲဒီ ခေါ်တဲ့ နေရာကို
      signature တစ်ခုတည်းနဲ့ပဲ စစ်ပြီး၊ function ရဲ့ body ကို ဝင်မကြည့်လို့ပါ။ ဒါကြောင့် ရလဒ်က ဘာကို
      borrow လုပ်ထားလဲ ဆိုတာ signature ကိုယ်တိုင်က ပြောထားဖို့ လိုပါတယ်။ [[mark:draw-elision]]
      ဒါပေမဲ့ slice lesson တုန်းက ရေးခဲ့တဲ့ first word function မှာတော့ ဒီလို အချက်အလက် ဘာမှ ထည့်စရာ
      မလိုခဲ့ပါဘူး။ ဘာကြောင့်လဲဆိုတော့၊ သူက reference တစ်ခုတည်းကိုပဲ လက်ခံတဲ့အတွက်၊ compiler က
      ပြန်ပေးတဲ့ ရလဒ်ကိုလည်း အဲဒီ reference ရဲ့ lifetime အတိုင်းပဲ ပေးလိုက်လို့ပါ။ ဒါကို lifetime
      elision လို့ ခေါ်ပြီး၊ compiler က lifetime ကို ကိုယ့်အစား ဖြည့်ပေးတဲ့ စည်းမျဉ်း တစ်ခုပါ။
      reference နှစ်ခု ဝင်လာရင်တော့ compiler က မမှန်းပါဘူး။
    sources:
      - title: "Rust error codes — E0106"
        url: "https://doc.rust-lang.org/error_codes/E0106.html"
      - title: "The Rust Book — Lifetime Annotations in Function Signatures"
        url: "https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#in-function-signatures"
      - title: "The Rust Book — Lifetime Elision"
        url: "https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#lifetime-elision"
    actions:
      - id: open-board-missing
        type: whiteboard.apply
        at: { scene: start, offsetMs: -300 }
        open: true
        clear: true
        upsertIds: [m-title]
      - id: draw-sig
        type: whiteboard.apply
        at: { mark: draw-sig, offsetMs: 300 }
        upsertIds: [m-sig, m-ux, m-uy, m-ur]
        drawMs: 2400
      - id: draw-e0106
        type: whiteboard.apply
        at: { mark: draw-e0106 }
        upsertIds: [m-err]
        drawMs: 1200
      - id: draw-help
        type: whiteboard.apply
        at: { mark: draw-help }
        upsertIds: [m-help1, m-help2]
        drawMs: 2000
      - id: draw-elision
        type: whiteboard.apply
        at: { mark: draw-elision }
        upsertIds: [m-one, m-two]
        drawMs: 2400

  - id: param
    chapter: Lifetime parameter
    narration: >-
      [[mark:show-param]] compiler တောင်းနေတဲ့ အဲဒီ အချက်အလက်ကတော့ lifetime parameter ပါ။ သူ့ နာမည်က
      apostrophe နဲ့ စပါတယ်။ generic type တစ်ခုလိုပဲ angle bracket ထဲမှာ ကြေညာပြီး၊ ပြီးတော့
      ampersand တိုင်းရဲ့ နောက်မှာ ထည့်ရေးပါတယ်။ ဒီလို ရေးလိုက်တာက ပြန်ပေးတဲ့ reference ကို input
      တွေနဲ့ ချိတ်ပေးလိုက်တာပါ။ ဒါက ဘယ် တန်ဖိုးရဲ့ lifetime ကိုမှ ပြောင်းသွားတာ မဟုတ်ပါဘူး။ ဒါက
      compiler က စစ်ပေးမယ့် ကတိ တစ်ခုပါ။ ဆိုလိုတာက၊ ရလဒ်ဟာ သူ borrow လုပ်ထားတဲ့ တန်ဖိုးထက် ဘယ်တော့မှ
      ပိုကြာကြာ မရှိနေဘူး ဆိုတဲ့ ကတိပါ။
    sources:
      - title: "The Rust Book — Lifetime Annotation Syntax"
        url: "https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#lifetime-annotation-syntax"
      - title: "The Rust Book — Lifetime Annotations in Function Signatures"
        url: "https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#in-function-signatures"
    actions:
      - id: close-board-missing
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: show-param
        type: slide.show
        at: { mark: show-param, offsetMs: 300 }
        slideId: param-slide

  - id: annotate
    narration: >-
      editor ထဲ ပြန်သွားရအောင်။ [[mark:type-decl]] အရင်ဆုံး function နာမည်ရဲ့ နောက်မှာ lifetime
      parameter ကို ကြေညာပါမယ်။ [[mark:type-x]] ပြီးတော့ x မှာ ထည့်ပါမယ်။ [[mark:type-y]] y မှာလည်း
      ထည့်ပါမယ်။ [[mark:type-ret]] နောက်ဆုံး return type မှာပါ ထည့်လိုက်ပါမယ်။ [[mark:select-sig]]
      ဒါဆို ဒီ lifetime ဆိုတာ ဘာလဲ။ x ရော y ရော နှစ်ခုလုံး သုံးလို့ ရနေတဲ့ ကာလ ဖြစ်တဲ့အတွက်၊ သူတို့
      နှစ်ခုရဲ့ lifetime ထဲက ပိုတိုတဲ့ တစ်ခုပါ။ ပြီးတော့ ရလဒ်ကိုလည်း အဲဒီ ကာလအတွင်းမှာပဲ သုံးလို့
      ရပါတယ်။
    sources:
      - title: "The Rust Book — Lifetime Annotations in Function Signatures"
        url: "https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#in-function-signatures"
    actions:
      - id: close-param-slide
        type: slide.close
        at: { scene: start }
      - id: type-decl
        type: editor.type
        at: { mark: type-decl }
        target:
          file: main.rs
          after: "fn longest"
          occurrence: 1
        cadence: natural
        text: "<'a>"
      - id: type-x
        type: editor.type
        at: { mark: type-x }
        target:
          file: main.rs
          after: "x: &"
          occurrence: 1
        cadence: natural
        text: "'a "
      - id: type-y
        type: editor.type
        at: { mark: type-y }
        target:
          file: main.rs
          after: "y: &"
          occurrence: 1
        cadence: natural
        text: "'a "
      - id: type-ret
        type: editor.type
        at: { mark: type-ret }
        target:
          file: main.rs
          after: ") -> &"
          occurrence: 1
        cadence: natural
        text: "'a "
      - id: select-sig
        type: editor.select
        at: { mark: select-sig }
        target:
          file: main.rs
          text: "-> &'a str"
          occurrence: 1

  - id: call
    chapter: longest ကို ခေါ်ခြင်း
    narration: >-
      [[mark:type-call]] အခု အတွင်းဘက် scope ထဲမှာ longest ကို ခေါ်ပြီး၊ ရလဒ်ကို print
      ထုတ်ကြည့်ရအောင်။ ampersand တွေက String တစ်ခုစီကို borrow လုပ်ပြီး၊ Rust က အဲဒီ reference
      တွေကို string slice အဖြစ် ကိုယ့်အစား ပြောင်းပေးပါတယ်။ [[mark:select-call]] ဒီနေရာမှာ outer ရော
      inner ရော နှစ်ခုလုံး သုံးလို့ ရနေတုန်း ဖြစ်တဲ့အတွက်၊ ရလဒ်ကို သုံးတာ ဘေးကင်းပါတယ်။
    sources:
      - title: "The Rust Book — Lifetime Annotations in Function Signatures"
        url: "https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#in-function-signatures"
      - title: "The Rust Book — Using Deref Coercion in Functions and Methods"
        url:
          "https://doc.rust-lang.org/book/ch15-02-deref.html#using-deref-coercion-in-functions-and-metho\
          ds"
    actions:
      - id: type-call
        type: editor.type
        at: { mark: type-call }
        target:
          file: main.rs
          after: "        let inner = String::from(\"rust\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "        let result = longest(&outer, &inner);

          \        println!(\"longest: {result}\");\n"
      - id: select-call
        type: editor.select
        at: { mark: select-call }
        target:
          file: main.rs
          text: "longest(&outer, &inner)"
          occurrence: 1

  - id: outlive
    narration: >-
      ဒါဆို အတွင်းဘက် scope ကုန်သွားပြီးမှ result ကို သုံးရင် ဘာဖြစ်မလဲ။ [[mark:draw-moved]] ဒီမှာ
      result ကို scope ပိတ်တဲ့ တွန့်ကွင်း နောက်မှ print ထုတ်ထားပါတယ်။ [[mark:draw-spans-b]] outer က
      နောက်ဆုံး စာကြောင်းအထိ ရှိနေပြီး၊ inner ကတော့ တွန့်ကွင်း အတွင်းမှာပဲ ရှိပါတယ်။
      [[mark:draw-drop-b]] inner ကို function ခေါ်တဲ့နေရာမှာ borrow လုပ်ထားပြီး၊ result ကို print
      မထုတ်ခင် တွန့်ကွင်း ပိတ်တဲ့နေရာမှာ drop ဖြစ်သွားပါတယ်။ [[mark:draw-e0597b]] E0597 error
      ထပ်တက်ပါတယ်၊ inner က လိုအပ်သလောက် ကြာကြာ မရှိနေဘူးတဲ့။ ဒါပေမဲ့ တကယ်တမ်းကျတော့ result က outer
      ကို ညွှန်နေတာ ဖြစ်ပြီး၊ outer ကလည်း သုံးလို့ ရနေတုန်းပါ။ ဒီလို ဖြစ်နေပေမဲ့ error တက်တာက၊
      compiler က signature ကိုပဲ အားကိုးပြီး၊ signature ကတော့ result က inner ဆီက borrow
      လုပ်ထားနိုင်တယ်လို့ ပြောထားလို့ပါ။ ဒါကြောင့် inner မရှိတော့တဲ့နောက်မှာ result ကို သုံးလို့
      မရတော့ပါဘူး။
    sources:
      - title: "The Rust Book — Lifetime Annotations in Function Signatures"
        url: "https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#in-function-signatures"
      - title: "Rust error codes — E0597"
        url: "https://doc.rust-lang.org/error_codes/E0597.html"
    actions:
      - id: open-board-outlive
        type: whiteboard.apply
        at: { scene: start }
        open: true
        clear: true
        upsertIds: [o-title]
      - id: draw-moved
        type: whiteboard.apply
        at: { mark: draw-moved }
        upsertIds: [o-c0, o-c1, o-c2, o-c3, o-c4, o-c5, o-c6]
        drawMs: 2400
      - id: draw-spans-b
        type: whiteboard.apply
        at: { mark: draw-spans-b }
        upsertIds: [o-outer-bar, o-outer-label, o-inner-bar, o-inner-label]
        drawMs: 1600
      - id: draw-drop-b
        type: whiteboard.apply
        at: { mark: draw-drop-b }
        upsertIds: [o-u-inner, o-drop-circle, o-drop-label, o-use-line]
        drawMs: 2400
      - id: draw-e0597b
        type: whiteboard.apply
        at: { mark: draw-e0597b }
        upsertIds: [o-err, o-note]
        drawMs: 2400

  - id: run
    narration: >-
      [[mark:run]] ကဲ၊ run ကြည့်ရအောင်။ [[mark:read-out]] lifetimes ဆိုတဲ့ စာသား ထွက်လာပါတယ်၊ outer
      ထဲက စာသားပါ။ rust ဆိုတဲ့ စာသားထက် ပိုရှည်တဲ့အတွက်၊ longest က outer ကို ညွှန်တဲ့ reference ကို
      ပြန်ပေးလိုက်တာပါ။
    sources:
      - title: "The Rust Book — Generic Lifetimes in Functions"
        url: "https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#generic-lifetimes-in-functions"
    actions:
      - id: close-board-outlive
        type: whiteboard.apply
        at: { scene: start, offsetMs: -400 }
        open: false
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "longest: lifetimes"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: "fn longest<'a>(x: &'a str, y: &'a str) -> &'a str {"

  - id: wrap
    narration: >-
      ဒါဆို ပြန်ချုပ်ရရင်၊ lifetime ဆိုတာ reference တစ်ခုကို သုံးလို့ ရနေတဲ့ ကာလ ဖြစ်ပြီး၊ သူ
      ညွှန်ထားတဲ့ တန်ဖိုးထက် ပိုကြာကြာ ရှိနေမယ့် reference မှန်သမျှကို Rust က လက်မခံပါဘူး။
      အများအားဖြင့်တော့ lifetime elision စည်းမျဉ်းတွေက lifetime တွေကို ကိုယ့်အစား ဖြည့်ပေးပါတယ်။
      function တစ်ခုက reference အများထဲက တစ်ခုကို ပြန်ပေးတဲ့အခါမှာတော့၊ lifetime parameter က ရလဒ်ကို
      သူ့ input တွေနဲ့ ချိတ်ပေးပါတယ်။ နောက် lesson မှာတော့ iterator နဲ့ closure၊ ဆိုလိုတာက စာရင်း
      တစ်ခုလုံးကို အဆင့် အနည်းငယ်နဲ့ ပြောင်းလဲပေးနိုင်တဲ့ နည်းလမ်းတွေကို ကြည့်သွားပါမယ်။
    sources:
      - title: "The Rust Book — Validating References with Lifetimes"
        url: "https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html"
      - title: "The Rust Book — Processing a Series of Items with Iterators"
        url: "https://doc.rust-lang.org/book/ch13-02-iterators.html"
    actions: []

checks:
  # 500 (not 300): google-svg deck slides embed per-slide font data whose
