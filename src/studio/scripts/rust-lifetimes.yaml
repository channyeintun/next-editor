# Rust from zero, lesson 18: lifetimes.
#
# The arc: the deck page "Lifetimes" says every reference is valid for some
# span (its lifetime), the compiler usually works it out, and references in
# and out of a function can need a hint. A first board draws WHY Rust cares:
# r borrows x, x is dropped at the inner brace while r is still used — a
# dangling reference — and the compiler's answer (E0597). The editor then
# writes longest() with no lifetimes, and a second board shows the
# compiler's answer (E0106, with its help line "the signature does not say
# whether it is borrowed from `x` or `y`") plus the one-sentence elision rule
# (one reference in → the output gets its lifetime, which is why first_word
# in the slices lesson needed no hint). The deck page "The lifetime
# parameter" introduces 'a; the editor inserts <'a> and the three 'a
# annotations (insert-only, so the signature is typed first and annotated
# after). main calls longest inside an inner scope where both Strings are
# valid; a third board shows the broken variant that prints the result after
# inner's scope ends, drawn like the first board (code, then the two lifetime
# bars, then the drop and the late use), and E0597 again — the compiler
# trusts the signature, not the body. One run, its output read out after it
# appears.
#
# TTS note: the narration never speaks 'a or a variable named `a` — the voice
# reads a lone "a" as the article. It says "the lifetime parameter" instead,
# and the Strings are named outer and inner (which also matches their scopes).
#
# Every compiler message on a board or in the narration was confirmed with
# rustc 1.98 (edition 2024) on the broken variants:
#   let r; { let x = 5; r = &x; } println!("{r}");
#     error[E0597]: `x` does not live long enough
#     - `x` dropped here while still borrowed
#   fn longest(x: &str, y: &str) -> &str { … }   (rest of the final program)
#     error[E0106]: missing lifetime specifier
#     = help: this function's return type contains a borrowed value, but the
#       signature does not say whether it is borrowed from `x` or `y`
#   let result; { let inner = …; result = longest(&outer, &inner); }
#   println!("{result}");
#     error[E0597]: `inner` does not live long enough
#     - `inner` dropped here while still borrowed
#
# Board colours: blue = the reference and the inputs (the things being
# named), orange = the shorter-lived value / the caveat, green = valid (the
# long-lived value, the elision rule), red = the drop point and the errors,
# violet = the result (the lifetime is the shorter span). #1e1e1e paints
# white on the dark board.
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/rust-lifetimes.yaml
