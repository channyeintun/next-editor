build:
  voiceProfile: pocket-alba-v1
  seed: 47

runtime:
  kind: rust-playground
  defaultMode: fixture
  fixture:
    latencyMs: 600
    result:
      status: success
      stdout: "longest: lifetimes\n"
      stderr: ""

scenes:
  - id: lifetimes
    chapter: What a lifetime is
    narration: >
      Every reference in Rust is valid for some span of your program. That
      span is its lifetime. The compiler usually figures it out for you. But
      when references go into a function and come back out, it can need a
      hint. Let's see why, and how to write it.
    sources:
      - title: "The Rust Book — Validating References with Lifetimes"
        url: "https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html"
    actions:
      # Opens in the quiet handle before the first word.
      - id: show-life
        type: slide.show
        at: { scene: start, offsetMs: -1200 }
        slideId: lifetimes-slide

  - id: dangling
    narration: >
      First, why does Rust track lifetimes?
      [[mark:draw-code]] Here, r is declared with no value yet. x lives in an
      inner scope, and r borrows x.
      [[mark:draw-spans]] r's lifetime runs to the last line, where r is
      used. x's lifetime is shorter. It ends at the closing brace.
      [[mark:draw-drop]] There, x is dropped, and its memory is freed. But the
      last line still uses r, so r would point at memory that's gone. That's
      a dangling reference.
      [[mark:draw-err]] Rust refuses. It's error E0597: x doesn't live long
      enough. A reference can never last longer than the value it points at.
    sources:
      - title: "The Rust Book — Dangling References"
        url: "https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#dangling-references"
      - title: "The Rust Book — The Borrow Checker"
        url: "https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#the-borrow-checker"
      - title: "Rust error codes — E0597"
        url: "https://doc.rust-lang.org/error_codes/E0597.html"
    actions:
      - id: close-life-slide
        type: slide.close
        at: { scene: start }
      - id: open-board-dangling
        type: whiteboard.apply
        at: { scene: start, offsetMs: 300 }
        open: true
        upsertIds: [d-title]
      - id: draw-code
        type: whiteboard.apply
        at: { mark: draw-code }
        upsertIds: [d-c1, d-c2, d-c3, d-c4, d-c5, d-c6]
        drawMs: 2400
      - id: draw-spans
        type: whiteboard.apply
        at: { mark: draw-spans }
        upsertIds: [d-r-bar, d-r-label, d-x-bar, d-x-label]
        drawMs: 2400
      - id: draw-drop
        type: whiteboard.apply
        at: { mark: draw-drop }
        upsertIds: [d-drop-circle, d-drop-label, d-use-line, d-dangle]
        drawMs: 3000
      - id: draw-err
        type: whiteboard.apply
        at: { mark: draw-err }
        upsertIds: [d-err]
        drawMs: 1600

  - id: write-longest
    chapter: References in and out of a function
    narration: >
      Now let's add a function.
      [[mark:open]] Here's main. outer lives in main, and inner lives in an
      inner scope.
      [[mark:type-longest]] Let's write longest. It takes two string slices
      and returns the longer one. We'll leave out any hints for now.
      [[mark:select-ret]] Look at the return type. It's a reference, but to
      what? To x, or to y? The body only decides that while the program runs.
    sources:
      - title: "The Rust Book — Generic Lifetimes in Functions"
        url: "https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#generic-lifetimes-in-functions"
    actions:
      - id: close-board-dangling
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-main
        type: workspace.openFile
        at: { mark: open }
        path: main.rs
      - id: type-longest
        type: editor.type
        at: { mark: type-longest }
        target:
          file: main.rs
          after: ""
          occurrence: 1
        cadence: line-by-line
        text: "fn longest(x: &str, y: &str) -> &str {\n    if x.len() > y.len() { x } else { y }\n}\n\n"
      - id: select-ret
        type: editor.select
        at: { mark: select-ret }
        target:
          file: main.rs
          text: "-> &str"
          occurrence: 1

  - id: missing
    narration: >
      [[mark:draw-sig]] The compiler won't accept this signature. Two
      references go in, and one comes out.
      [[mark:draw-e0106]] It's error E0106: missing lifetime specifier.
      [[mark:draw-help]] The help line says the signature doesn't say whether
      the result is borrowed from x or y. Why does that matter? When you
      call longest, the compiler checks the call using only the signature,
      not the body. So the signature has to say what the result borrows.
      [[mark:draw-elision]] But first_word, from the slices lesson, needed no
      hint. It takes only one reference, so the compiler gives the output that
      same lifetime. That's a lifetime elision rule. With two references, it
      won't guess.
    sources:
      - title: "Rust error codes — E0106"
        url: "https://doc.rust-lang.org/error_codes/E0106.html"
      - title: "The Rust Book — Lifetime Annotations in Function Signatures"
        url: "https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#in-function-signatures"
      - title: "The Rust Book — Lifetime Elision"
        url: "https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#lifetime-elision"
    actions:
      - id: open-board-missing
        type: whiteboard.apply
        at: { scene: start, offsetMs: -300 }
        open: true
        clear: true
        upsertIds: [m-title]
      - id: draw-sig
        type: whiteboard.apply
        at: { mark: draw-sig, offsetMs: 300 }
        upsertIds: [m-sig, m-ux, m-uy, m-ur]
        drawMs: 2400
      - id: draw-e0106
        type: whiteboard.apply
        at: { mark: draw-e0106 }
        upsertIds: [m-err]
        drawMs: 1200
      - id: draw-help
        type: whiteboard.apply
        at: { mark: draw-help }
        upsertIds: [m-help1, m-help2]
        drawMs: 2000
      - id: draw-elision
        type: whiteboard.apply
        at: { mark: draw-elision }
        upsertIds: [m-one, m-two]
        drawMs: 2400

  - id: param
    chapter: The lifetime parameter
    narration: >
      [[mark:show-param]] The hint is a lifetime parameter. Its name starts
      with an apostrophe. You declare it in angle brackets, like a generic
      type, and then write it after each ampersand. That ties the returned
      reference to the inputs. It doesn't change how long anything lives.
      It's a promise the compiler checks: the result never lasts longer
      than what it borrows.
    sources:
      - title: "The Rust Book — Lifetime Annotation Syntax"
        url: "https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#lifetime-annotation-syntax"
      - title: "The Rust Book — Lifetime Annotations in Function Signatures"
        url: "https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#in-function-signatures"
    actions:
      - id: close-board-missing
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: show-param
        type: slide.show
        at: { mark: show-param, offsetMs: 300 }
        slideId: param-slide

  - id: annotate
    narration: >
      Back in the editor.
      [[mark:type-decl]] First, we declare the lifetime after the function's
      name.
      [[mark:type-x]] Then x gets it.
      [[mark:type-y]] Then y gets it.
      [[mark:type-ret]] And the return type.
      [[mark:select-sig]] So what's this lifetime? It's the span where both
      x and y are valid, so it's the shorter of their two lifetimes. And the
      result is valid only for that span.
    sources:
      - title: "The Rust Book — Lifetime Annotations in Function Signatures"
        url: "https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#in-function-signatures"
    actions:
      - id: close-param-slide
        type: slide.close
        at: { scene: start }
      - id: type-decl
        type: editor.type
        at: { mark: type-decl }
        target:
          file: main.rs
          after: "fn longest"
          occurrence: 1
        cadence: natural
        text: "<'a>"
      - id: type-x
        type: editor.type
        at: { mark: type-x }
        target:
          file: main.rs
          after: "x: &"
          occurrence: 1
        cadence: natural
        text: "'a "
      - id: type-y
        type: editor.type
        at: { mark: type-y }
        target:
          file: main.rs
          after: "y: &"
          occurrence: 1
        cadence: natural
        text: "'a "
      - id: type-ret
        type: editor.type
        at: { mark: type-ret }
        target:
          file: main.rs
          after: ") -> &"
          occurrence: 1
        cadence: natural
        text: "'a "
      - id: select-sig
        type: editor.select
        at: { mark: select-sig }
        target:
          file: main.rs
          text: "-> &'a str"
          occurrence: 1

  - id: call
    chapter: Calling longest
    narration: >
      [[mark:type-call]] Now let's call longest inside the inner scope, and
      print the result. The ampersands borrow each String, and Rust converts them to
      string slices.
      [[mark:select-call]] Here, outer and inner are both still valid, so the
      result is safe to use.
    sources:
      - title: "The Rust Book — Lifetime Annotations in Function Signatures"
        url: "https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#in-function-signatures"
      - title: "The Rust Book — Using Deref Coercion in Functions and Methods"
        url: "https://doc.rust-lang.org/book/ch15-02-deref.html#using-deref-coercion-in-functions-and-methods"
    actions:
      - id: type-call
        type: editor.type
        at: { mark: type-call }
        target:
          file: main.rs
          after: "        let inner = String::from(\"rust\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "        let result = longest(&outer, &inner);\n        println!(\"longest: {result}\");\n"
      - id: select-call
        type: editor.select
        at: { mark: select-call }
        target:
          file: main.rs
          text: "longest(&outer, &inner)"
          occurrence: 1

  - id: outlive
    narration: >
      What if we use the result after the inner scope ends?
      [[mark:draw-moved]] Here, result is printed after the closing brace.
      [[mark:draw-spans-b]] outer lives to the last line. inner lives only
      inside the braces.
      [[mark:draw-drop-b]] inner is borrowed in the call, and dropped at the
      brace, before result is printed.
      [[mark:draw-e0597b]] It's error E0597 again: inner doesn't live long
      enough. But the result really points at outer, and outer is still
      valid! The compiler goes by the signature, and the signature says the
      result may borrow from inner. So it can't be used after inner is gone.
    sources:
      - title: "The Rust Book — Lifetime Annotations in Function Signatures"
        url: "https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#in-function-signatures"
      - title: "Rust error codes — E0597"
        url: "https://doc.rust-lang.org/error_codes/E0597.html"
    actions:
      - id: open-board-outlive
        type: whiteboard.apply
        at: { scene: start }
        open: true
        clear: true
        upsertIds: [o-title]
      - id: draw-moved
        type: whiteboard.apply
        at: { mark: draw-moved }
        upsertIds: [o-c0, o-c1, o-c2, o-c3, o-c4, o-c5, o-c6]
        drawMs: 2400
      - id: draw-spans-b
        type: whiteboard.apply
        at: { mark: draw-spans-b }
        upsertIds: [o-outer-bar, o-outer-label, o-inner-bar, o-inner-label]
        drawMs: 1600
      - id: draw-drop-b
        type: whiteboard.apply
        at: { mark: draw-drop-b }
        upsertIds: [o-u-inner, o-drop-circle, o-drop-label, o-use-line]
        drawMs: 2400
      - id: draw-e0597b
        type: whiteboard.apply
        at: { mark: draw-e0597b }
        upsertIds: [o-err, o-note]
        drawMs: 2400

  - id: run
    narration: >
      [[mark:run]] Let's run it.
      [[mark:read-out]] It prints lifetimes, the text in outer. It's longer
      than rust, so longest gave back a reference to outer.
    sources:
      - title: "The Rust Book — Generic Lifetimes in Functions"
        url: "https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#generic-lifetimes-in-functions"
    actions:
      - id: close-board-outlive
        type: whiteboard.apply
        at: { scene: start, offsetMs: -400 }
        open: false
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "longest: lifetimes"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: "fn longest<'a>(x: &'a str, y: &'a str) -> &'a str {"

  - id: wrap
    narration: >
      So a lifetime is the span where a reference is valid, and Rust refuses
      any reference that would last longer than its value. The elision rules
      usually fill lifetimes in. When a function returns one of several
      references, a lifetime parameter ties the result to its inputs. Next,
      iterators and closures: transforming a whole list in a few short steps.
    sources:
      - title: "The Rust Book — Validating References with Lifetimes"
        url: "https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html"
      - title: "The Rust Book — Processing a Series of Items with Iterators"
        url: "https://doc.rust-lang.org/book/ch13-02-iterators.html"
    actions: []

checks:
  # 500 (not 300): google-svg deck slides embed per-slide font data whose
  # paint briefly stalls the main thread at each show/close.
  - { type: timing.p95Ms, max: 500 }
