  environment: {}
scenes:
  - id: recall
    chapter: Chatbot နဲ့ agent ဘာကွာလဲ
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ agent တစ်ခုက အလုပ်လုပ်သလို ပုံပေါ်တဲ့ app ကို မြန်မြန် ထုတ်ပေးနိုင်ပေမယ့်၊ ဘာက မှန်လဲ
      သိတာနဲ့ ထွက်လာတာကို စစ်တာကတော့ ကိုယ့်အလုပ် ဖြစ်တယ် ဆိုတာ မြင်ခဲ့ပါတယ်။ agent ကို မှန်မှန် ခိုင်းပြီး
      မှန်မှန် စစ်နိုင်ဖို့ဆိုရင်၊ agent ရဲ့ အထဲမှာ တကယ် ဘာတွေ ဖြစ်နေလဲ သိထားရပါမယ်။ [[mark:r-what]] agent က လူ
      တစ်ယောက် မဟုတ်သလို၊ ဘာမဆို လုပ်နိုင်တဲ့ အရာလည်း မဟုတ်ပါဘူး။ အစိတ်အပိုင်း တချို့ကို loop တစ်ခုနဲ့ ချိတ်ထားတဲ့
      software ပါ။ loop ဆိုတာ အဆင့်တွေကို ပြီးတဲ့အထိ ထပ်ခါထပ်ခါ ပြန်ပတ်တာပါ။ [[mark:open-notes]] ဒီနေ့
      နားလည်လာတာကို editor ထဲက notes ဖိုင်မှာ မှတ်သွားပါမယ်။ [[mark:c-open]] အရင်ဆုံး ကိုယ်တို့ သုံးနေကျ chatbot
      နဲ့ agent ဘာကွာလဲ ကြည့်ရအောင်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): From syntax to intent",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "Anthropic: Building effective agents",
          url: "https://www.anthropic.com/engineering/building-effective-agents",
        }
    actions:
      - { id: open-notes, type: workspace.openFile, at: { mark: open-notes }, path: notes.md }
      - {
          id: open-board-c,
          type: whiteboard.apply,
          at: { mark: c-open },
          open: true,
          clear: true,
          upsertIds: [c-h1, c-h2],
        }

  - id: chatbot-agent
    narration: >
      [[mark:c-bot]] chatbot ကို မေးခွန်း တစ်ခု မေးရင်၊ အဖြေ တစ်ခု ပြန်ပေးပြီး အဲဒီမှာတင် ရပ်ပါတယ်။ ဥပမာ ကြိုမှာ
      app ရဲ့ form မှာ ဘာတွေ ပါသင့်လဲ လို့ မေးရင်၊ စာရင်း တစ်ခု ပြန်ရပါမယ်။ [[mark:c-bot2]] အဲဒီ စာရင်းကို ယူပြီး
      ဘာဆက်လုပ်မလဲ၊ မှန်မမှန် ဘယ်လို စမ်းမလဲ ဆိုတာကတော့ ကိုယ့်တာဝန်ပါ။ ကိုယ် ထပ်မမေးရင် chatbot က ဘာမှ
      ဆက်မလုပ်ပါဘူး။ [[mark:c-agent]] agent ကိုတော့ မေးခွန်း မဟုတ်ဘဲ ပန်းတိုင် တစ်ခု ပေးပါတယ်။ ဥပမာ form မှာ
      လာယူချိန် ရွေးလို့ရအောင် လုပ်ပေးပါ လို့ ပေးလိုက်ရင်၊ agent က app ရဲ့ file တွေကို ဖတ်၊ ပြင်ပြီး app ကို run
      ကြည့်ပါတယ်။ run ဆိုတာ program ကို တကယ် အလုပ်လုပ်ခိုင်းတာပါ။ ရလဒ် မှားနေရင် ထပ်ပြင်ပြီး ထပ်စမ်းပါတယ်။
      [[mark:c-done]] ပြီးသွားမှ ဘာလုပ်ခဲ့လဲ ကိုယ့်ကို ပြန်ပြောပါတယ်။ ဆိုလိုတာက chatbot က အဖြေ တစ်ခု ပေးတဲ့ tool
      ဖြစ်ပြီး၊ agent ကတော့ ပန်းတိုင် ရောက်တဲ့အထိ loop ပတ်ပြီး ဆက်လုပ်တဲ့ tool ပါ။
    sources:
      - {
          title: "The New SDLC (Burmese edition): From syntax to intent",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "Anthropic: Building effective agents",
          url: "https://www.anthropic.com/engineering/building-effective-agents",
        }
    actions:
      - {
          id: draw-c-bot,
          type: whiteboard.apply,
          at: { mark: c-bot },
          upsertIds: [c-l1-box, c-l1, c-la1, c-l2-box, c-l2],
          drawMs: 1600,
        }
      - {
          id: draw-c-bot2,
          type: whiteboard.apply,
          at: { mark: c-bot2 },
          upsertIds: [c-la2, c-l3-box, c-l3],
          drawMs: 1100,
        }
      - {
          id: draw-c-agent,
          type: whiteboard.apply,
          at: { mark: c-agent },
          upsertIds: [c-r1-box, c-r1, c-ra1, c-r2-box, c-r2],
          drawMs: 1600,
        }
      - {
          id: draw-c-done,
          type: whiteboard.apply,
          at: { mark: c-done },
          upsertIds: [c-ra2, c-r3-box, c-r3],
          drawMs: 1100,
        }

  - id: loop
    chapter: Agent ရဲ့ loop
    narration: >
      [[mark:l-goal]] ဒီ loop ကို အဆင့်လိုက် ခွဲကြည့်ရအောင်။ အစက ကိုယ်ပေးတဲ့ ပန်းတိုင်ပါ။ [[mark:l-plan]] agent က
      ပထမဆုံး ဘာတွေ လုပ်ရမလဲ ဆိုတဲ့ အဆင့်တွေကို စီပါတယ်။ ဘယ် file ကို ဖတ်မလဲ၊ ဘယ်နေရာကို ပြင်မလဲ ဆိုတာမျိုးပါ။
      ဒါကို plan လို့ ခေါ်ပါတယ်။ [[mark:l-act]] ပြီးတော့ အဆင့် တစ်ဆင့်ကို လက်တွေ့ လုပ်ပါတယ်။ file ဖတ်တာ၊ command
      run တာ၊ code ပြင်တာ စတာတွေကို tool တွေနဲ့ လုပ်တာပါ။ command ဆိုတာ ကွန်ပျူတာကို စာနဲ့ ခိုင်းတဲ့
      ညွှန်ကြားချက်ပါ။ [[mark:l-obs]] လုပ်ပြီးတိုင်း ရလဒ်ကို ပြန်ကြည့်ပါတယ်။ error လို့ ခေါ်တဲ့ အမှားပြစာ တက်လား၊
      form မှာ အချိန် ရွေးတဲ့ အကွက် တကယ် ပါလာလား ဆိုတာမျိုးပါ။ ဒီ အဆင့်က agent ရဲ့ ခန့်မှန်းချက် မဟုတ်ဘဲ၊ အပြင်က
      တကယ့် ရလဒ်ကို ပြန်ရတဲ့ အဆင့် ဖြစ်လို့ အရေးကြီးပါတယ်။ [[mark:l-again]] ရလဒ် မှားနေရင် plan ကို ပြန်သွားပြီး
      loop ကို ထပ်ပတ်ပါတယ်။ [[mark:l-done]] ပန်းတိုင် ရောက်သွားရင်တော့ ရပ်ပါတယ်။ မရောက်သေးရင်တောင် ရပ်ရမယ့်
      အခြေအနေတွေ ရှိပါတယ်။ ပတ်ခွင့်ရှိတဲ့ အကြိမ်ရေ ပြည့်သွားတာ၊ ကိုယ်က ရပ်ခိုင်းတာ၊ ဒါမှမဟုတ် ဆက်မလုပ်နိုင်လို့
      ကိုယ့်ကို ပြန်မေးတာ မျိုးပါ။
    sources:
      - {
          title: "The New SDLC (Burmese edition): From syntax to intent",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "Anthropic: Building effective agents",
          url: "https://www.anthropic.com/engineering/building-effective-agents",
        }
    actions:
      - {
          id: open-board-l,
          type: whiteboard.apply,
          at: { mark: l-goal },
          clear: true,
          upsertIds: [l-goal-box, l-goal],
          drawMs: 900,
        }
      - {
          id: draw-l-plan,
          type: whiteboard.apply,
          at: { mark: l-plan },
          upsertIds: [l-a1, l-plan-box, l-plan],
          drawMs: 1100,
        }
      - {
          id: draw-l-act,
          type: whiteboard.apply,
          at: { mark: l-act },
          upsertIds: [l-a2, l-act-box, l-act],
          drawMs: 1100,
        }
      - {
          id: draw-l-obs,
          type: whiteboard.apply,
          at: { mark: l-obs },
          upsertIds: [l-a3, l-obs-box, l-obs],
          drawMs: 1100,
        }
      - {
          id: draw-l-again,
          type: whiteboard.apply,
          at: { mark: l-again },
          upsertIds: [l-a4, l-again],
          drawMs: 900,
        }
      - {
          id: draw-l-done,
          type: whiteboard.apply,
          at: { mark: l-done },
          upsertIds: [l-a5, l-done],
          drawMs: 900,
        }

  - id: type-loop
    narration: >
      [[mark:close-l]] ဒီ loop ကို notes ထဲမှာ မှတ်ထားရအောင်။ [[mark:type-loop]] အဆင့် တစ်ဆင့်ကို စာကြောင်း
      တစ်ကြောင်းစီ ရေးထားပြီး၊ နောက်ဆုံး စာကြောင်းက loop ကို ဘယ်အချိန်ထိ ပြန်ပတ်မလဲ ဆိုတာကို မှတ်ထားတာပါ။
      [[mark:sel-goal]] ပထမ စာကြောင်းကို ကြည့်ပါ။ loop တစ်ခုလုံးမှာ ကိုယ့်လက်ထဲမှာ ရှိတဲ့ အဆင့်က ဒါပါ။ ဒီ အဆင့်
      မရှင်းရင် loop တစ်ခုလုံးက မှားတဲ့ ဘက်ကို မြန်မြန် လည်သွားနိုင်ပါတယ်။ [[mark:sel-observe]] observe
      အဆင့်ကိုလည်း သတိထား ကြည့်ပါ။ ရလဒ်ကို စစ်လို့ရတဲ့ အလုပ်ဆိုရင် agent က အမှားကို တွေ့ပြီး ပြင်နိုင်ပေမယ့်၊
      စစ်စရာ မရှိတဲ့ အလုပ်ဆိုရင်တော့ ခန့်မှန်းချက် တစ်ခုနဲ့တင် ပြီးပြီလို့ ပြောသွားနိုင်ပါတယ်။
    sources:
      - {
          title: "Anthropic: Building effective agents",
          url: "https://www.anthropic.com/engineering/building-effective-agents",
        }
    actions:
      - { id: close-l, type: whiteboard.apply, at: { mark: close-l }, open: false }
      - id: type-loop
        type: editor.type
        at: { mark: type-loop }
        target: { file: notes.md, after: "# Notes\n", occurrence: 1 }
        text: "\n## Lesson 02 · Agent ရဲ့ loop\n1. goal — ကိုယ်က ပန်းတိုင် ပေးတယ်။\n2. plan — agent က လုပ်မယ့် အဆင့်တွေကို စီတယ်။\n3. act — tool နဲ့ file ဖတ်၊ command run၊ ပြင်တယ်။\n4. observe — ရလဒ်ကို ပြန်ကြည့်တယ်။\n5. ↻ — ပြီးတဲ့အထိ ဒါမှမဟုတ် ရပ်ရမယ့်အထိ ပြန်ပတ်တယ်။\n"
        cadence: line-by-line
      - {
          id: expect-loop,
          type: expect.file,
          at: { afterAction: type-loop },
          path: notes.md,
          contains: "4. observe — ရလဒ်ကို ပြန်ကြည့်တယ်။",
        }
      - {
          id: sel-goal,
          type: editor.select,
          at: { mark: sel-goal },
          target: { file: notes.md, text: "1. goal — ကိုယ်က ပန်းတိုင် ပေးတယ်။", occurrence: 1 },
        }
      - {
          id: sel-observe,
          type: editor.select,
          at: { mark: sel-observe },
          target: { file: notes.md, text: "4. observe — ရလဒ်ကို ပြန်ကြည့်တယ်။", occurrence: 1 },
        }

  - id: parts
    narration: >
      [[mark:p-reopen]] ဒီ အဆင့်တွေကို agent ရဲ့ ဘယ် အစိတ်အပိုင်းက လုပ်လဲ ဆိုတာ ခုနက ပုံပေါ်မှာပဲ ကြည့်ရအောင်။
      [[mark:p-model]] plan ချတဲ့ အပိုင်းက model ပါ။ model ဆိုတာ စာသားကို ဆက်ခန့်မှန်းပေးတဲ့ AI ရဲ့ အူတိုင်ပါ။
      သူ့ရှေ့မှာ ရှိတဲ့ စာတွေကို ကြည့်ပြီး၊ နောက်တစ်ဆင့်မှာ ဘာလုပ်သင့်လဲ ဆိုတာကို ခန့်မှန်းပြီး ထုတ်ပေးတာပါ။
      [[mark:p-tool]] model ကိုယ်တိုင်က file ကို မဖွင့်နိုင်ပါဘူး။ file ဖတ်တာ၊ command run တာ၊ ပြင်တာတွေကို tool
      တွေက လုပ်ပေးပါတယ်။ tool ဆိုတာ agent ခေါ်သုံးလို့ရတဲ့ လုပ်ဆောင်ချက်တွေပါ။ [[mark:p-ctx]] tool ရဲ့ ရလဒ်ကတော့
      model မြင်ရတဲ့ စာသားတွေ၊ context window ထဲကို ပြန်ဝင်လာပြီး၊ model က နောက်တစ်ပတ်မှာ အဲဒါကို မြင်ရပါတယ်။
      [[mark:p-orch]] model ကို ခေါ်တာ၊ tool ကို run ပေးတာ၊ ရလဒ်ကို ပြန်ထည့်ပေးတာ၊ ဘယ်နှပတ်ထိ ပတ်ခွင့်ရှိလဲ
      ကန့်သတ်တာ စတဲ့၊ loop ကို လည်ပတ်စေတဲ့ code ကိုတော့ orchestration လို့ ခေါ်ပါတယ်။ [[mark:p-setup]] model
      တစ်ခုတည်းကိုပဲ tool မတူတာ၊ rule မတူတာနဲ့ ထားရင် အလုပ်လုပ်ပုံ တော်တော် ကွာသွားပါတယ်။ model ပတ်လည်က ဒီ အစီအစဉ်
      တစ်ခုလုံးကို harness လို့ ခေါ်ပြီး၊ lesson ၂၈ မှာ ပြန်ကြည့်ပါမယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): From syntax to intent",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "The New SDLC (Burmese edition): Harness engineering",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "Anthropic: Building effective agents",
          url: "https://www.anthropic.com/engineering/building-effective-agents",
        }
    actions:
      - { id: reopen-l, type: whiteboard.apply, at: { mark: p-reopen }, open: true }
      - {
          id: draw-p-model,
          type: whiteboard.apply,
          at: { mark: p-model },
          upsertIds: [p-model],
          drawMs: 900,
        }
      - {
          id: draw-p-tool,
          type: whiteboard.apply,
          at: { mark: p-tool },
          upsertIds: [p-tool],
          drawMs: 900,
        }
      - {
          id: draw-p-ctx,
          type: whiteboard.apply,
          at: { mark: p-ctx },
          upsertIds: [p-ctx],
          drawMs: 900,
        }
      - {
          id: draw-p-orch,
          type: whiteboard.apply,
          at: { mark: p-orch },
          upsertIds: [p-orch],
          drawMs: 900,
        }
      - {
          id: draw-p-setup,
          type: whiteboard.apply,
          at: { mark: p-setup },
          upsertIds: [p-setup],
          drawMs: 1100,
        }

  - id: context
    chapter: Agent ရဲ့ စားပွဲ
    narration: >
      [[mark:d-title]] context window ကို ပိုမြင်သာအောင် စားပွဲ တစ်လုံးလို ပုံဆွဲကြည့်ရအောင်။ context window ဆိုတာ
      agent က အခု မြင်နေရတဲ့ စာသား အားလုံးပါ။ [[mark:d-on]] ဒီ စားပွဲပေါ်မှာ ကိုယ်ပေးလိုက်တဲ့ အလုပ်၊ agent
      ဖတ်ထားတဲ့ file အနည်းငယ်၊ app ရဲ့ rule တွေနဲ့ tool တွေ ပြန်ပေးတဲ့ ရလဒ်တွေ ရှိပါတယ်။ ကိုယ့် app အကြောင်း agent
      က သိသလို ပြောနိုင်တာ အားလုံးက ဒီ စားပွဲပေါ်ကနေ လာတာပါ။ [[mark:d-off]] စားပွဲပေါ်မှာ မရှိတာကိုတော့ agent
      မမြင်ရပါဘူး။ ဥပမာ စနေ တနင်္ဂနွေမှာ ဆိုင်က မနက် ခုနစ်နာရီမှ ဖွင့်တယ် ဆိုတာ ကိုယ့်ခေါင်းထဲမှာပဲ ရှိနေရင်၊
      agent အတွက်တော့ အဲဒီ rule မရှိသလိုပါပဲ။ agent မဖတ်ရသေးတဲ့ file ထဲက အချက်တွေလည်း ဒီလိုပါပဲ။ [[mark:d-limit]]
      စားပွဲမှာ နေရာလည်း အကန့်အသတ် ရှိပါတယ်။ စာတွေ အရမ်း များလာရင် အရေးကြီးတဲ့ အချက်ကို model က လွတ်သွားတတ်လို့၊
      များများ တင်တာထက် မှန်တာကို ရွေးပြီး တင်ပေးတာက ပိုအရေးကြီးပါတယ်။ [[mark:d-new]] session ဆိုတာ agent နဲ့
      အလုပ် တစ်ခါ စလုပ်တဲ့ အကြိမ် တစ်ကြိမ်ပါ။ session အသစ် စတိုင်း စားပွဲ အလွတ်နဲ့ ပြန်စပါတယ်။ model ကိုယ်တိုင်က
      session တစ်ခုနဲ့ တစ်ခုကြား ဘာကိုမှ မှတ်မထားပါဘူး။ session စတိုင်း agent ဖတ်တဲ့ file တွေကတော့ စားပွဲပေါ်
      ပြန်ရောက်လာလို့၊ ကြာကြာ လိုမယ့် အချက်ဆိုရင် အဲဒီလို file ထဲမှာ ရှိမှ နောက် session မှာ ကျန်ပါတယ်။
    sources:
      - {
          title: "Claude API docs: Context windows",
          url: "https://platform.claude.com/docs/en/build-with-claude/context-windows",
        }
      - {
          title: "Claude Code docs: How Claude remembers your project",
          url: "https://code.claude.com/docs/en/memory",
        }
      - {
          title: "The New SDLC (Burmese edition): From syntax to intent",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: open-board-d,
          type: whiteboard.apply,
          at: { mark: d-title },
          clear: true,
          upsertIds: [d-title, d-desk],
          drawMs: 1000,
        }
      - {
          id: draw-d-on,
          type: whiteboard.apply,
          at: { mark: d-on },
          upsertIds: [d-on1, d-on2, d-on3, d-on4],
          drawMs: 2000,
        }
      - {
          id: draw-d-off,
          type: whiteboard.apply,
          at: { mark: d-off },
          upsertIds: [d-off-h, d-off1, d-off2],
          drawMs: 1500,
        }
      - {
          id: draw-d-limit,
          type: whiteboard.apply,
          at: { mark: d-limit },
          upsertIds: [d-limit],
          drawMs: 800,
        }
      - {
          id: draw-d-new,
          type: whiteboard.apply,
          at: { mark: d-new },
          upsertIds: [d-new],
          drawMs: 1200,
        }

  - id: good-weak
    chapter: ဘာမှာ အားသာပြီး ဘာမှာ အားနည်းလဲ
    narration: >
      [[mark:g-good]] ဒါဆို agent က ဘယ်လို အလုပ်မျိုးမှာ အားသာလဲ။ ဘာလုပ်ရမလဲ ရှင်းရှင်း ရေးထားပြီး မှန်မမှန်
      စစ်လို့ရတဲ့ အလုပ်မှာ အကောင်းဆုံး ရလဒ် ထွက်ပါတယ်။ observe အဆင့်မှာ အမှားကို တွေ့နိုင်လို့ပါ။ ပထမ အကြမ်း
      တစ်ခုကို မြန်မြန် ထုတ်ပေးတာ၊ file အများကြီးကို မြန်မြန် ဖတ်တာမှာလည်း အားသာပါတယ်။ [[mark:g-weak]] ဒါပေမဲ့
      ဘာလိုချင်လဲ ဝေဝါးနေရင်၊ ဒါမှမဟုတ် ရေးမထားတဲ့ rule တွေ ရှိရင်တော့ အားနည်းပါတယ်။ ဥပမာ အနည်းဆုံး ၁၅ မိနစ်
      ကြိုမှာရမယ် ဆိုတဲ့ ဆိုင်ရဲ့ rule ကို ဘယ်မှာမှ မရေးထားရင်၊ agent က အဲဒီ rule ကို သူ့ဘာသာ ခန့်မှန်းလို့
      မရပါဘူး။ ဆိုင်ရဲ့ လုပ်ငန်း အခြေအနေကိုလည်း ကိုယ်က ပြောပြမှပဲ agent မြင်ရပါတယ်။ [[mark:g-sure]] အန္တရာယ်
      အများဆုံးကတော့ မသေချာတဲ့ နေရာမှာ မသိဘူးလို့ ပြောမယ့်အစား၊ ဖြစ်နိုင်လောက်တဲ့ အဖြေကို သေချာသလို ပုံစံနဲ့
      ထုတ်ပေးတတ်တာပါ။ model တွေကို လေ့ကျင့်တဲ့အခါရော၊ စစ်ဆေးတဲ့အခါမှာပါ၊ မသိဘူး လို့ ဖြေတာထက် ခန့်မှန်းဖြေတာကို
      ပိုအမှတ်ပေးလေ့ ရှိလို့ပါ။ [[mark:g-check]] ဒါကြောင့် agent ဆီက အဖြေက ဘယ်လောက်ပဲ ယုံချင်စရာ ကောင်းကောင်း၊
      ထွက်လာတာကို ကိုယ်က စစ်ရပါမယ်။
    sources:
      - {
          title: "Anthropic: Building effective agents",
          url: "https://www.anthropic.com/engineering/building-effective-agents",
        }
      - {
          title: "Kalai et al.: Why Language Models Hallucinate (arXiv 2509.04664)",
          url: "https://arxiv.org/abs/2509.04664",
        }
      - {
          title: "The New SDLC (Burmese edition): Coding agents in practice",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: open-board-g,
          type: whiteboard.apply,
          at: { mark: g-good },
          clear: true,
          upsertIds: [g-h1, g-g1, g-g2, g-g3],
          drawMs: 1800,
        }
      - {
          id: draw-g-weak,
          type: whiteboard.apply,
          at: { mark: g-weak },
          upsertIds: [g-h2, g-w1, g-w2, g-w3],
          drawMs: 1800,
        }
      - {
          id: draw-g-sure,
          type: whiteboard.apply,
          at: { mark: g-sure },
          upsertIds: [g-w4, g-sure],
          drawMs: 1300,
        }
      - {
          id: draw-g-check,
          type: whiteboard.apply,
          at: { mark: g-check },
          upsertIds: [g-check],
          drawMs: 800,
        }

  - id: where
    narration: >
      [[mark:w-title]] နောက်ဆုံး၊ ဒီ agent တွေကို ဘယ်နေရာတွေမှာ တွေ့ရလဲ ကြည့်ရအောင်။ [[mark:w-editor]] ပထမ နေရာက
      code ရေးတဲ့ program ဖြစ်တဲ့ editor ထဲပါ။ GitHub Copilot လို tool မျိုးက code ရိုက်နေရင်း နောက် ရိုက်မယ့်
      စာကို အကြံပေးတာ၊ မေးတာကို ဖြေပေးတာ လုပ်ပါတယ်။ [[mark:w-term]] ဒုတိယ နေရာက terminal ထဲပါ။ terminal ဆိုတာ ခုနက
      command တွေကို ရိုက်ထည့်ရတဲ့ window ပါ။ Claude Code လို agent မျိုးကို အဲဒီမှာ ပန်းတိုင် ပေးလိုက်ရင်၊ app
      ရဲ့ file အားလုံးပေါ်မှာ loop ပတ်ပြီး လုပ်နေတာကို ကိုယ်က အနီးကပ် ကြည့်လို့ ရပါတယ်။ [[mark:w-bg]] တတိယ နေရာက
      နောက်ကွယ်၊ background ပါ။ Jules လို tool မျိုးမှာ ကိုယ် တခြား အလုပ်လုပ်နေတုန်း၊ agent က အင်တာနက်ပေါ်က
      သီးသန့် စက် တစ်လုံးမှာ အပ်ထားတဲ့ အလုပ်ကို လုပ်ပြီး၊ ကိုယ်က နောက်မှ ပြန်စစ်ပါတယ်။ ဒီ နာမည်တွေက နေရာကို
      မြင်သာအောင် ဥပမာ ပြတာပဲ ဖြစ်ပြီး၊ ဘယ်ဟာ သုံးပါ လို့ ညွှန်တာ မဟုတ်ပါဘူး။ [[mark:w-same]] နေရာ မတူပေမယ့် အထဲက
      loop ကတော့ အတူတူပါပဲ။
    sources:
      - {
          title: "The New SDLC (Burmese edition): Coding agents in practice",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "GitHub Docs: About GitHub Copilot",
          url: "https://docs.github.com/en/copilot/get-started/what-is-github-copilot",
        }
      - { title: "Claude Code docs: Overview", url: "https://code.claude.com/docs/en/overview" }
      - { title: "Jules docs: Getting started", url: "https://jules.google/docs/" }
    actions:
      - {
          id: open-board-w,
          type: whiteboard.apply,
          at: { mark: w-title },
          clear: true,
          upsertIds: [w-title],
        }
      - {
          id: draw-w-editor,
          type: whiteboard.apply,
          at: { mark: w-editor },
          upsertIds: [w-b1, w-t1, w-s1],
          drawMs: 1100,
        }
      - {
          id: draw-w-term,
          type: whiteboard.apply,
          at: { mark: w-term },
          upsertIds: [w-b2, w-t2, w-s2],
          drawMs: 1100,
        }
      - {
          id: draw-w-bg,
          type: whiteboard.apply,
          at: { mark: w-bg },
          upsertIds: [w-b3, w-t3, w-s3],
          drawMs: 1100,
        }
      - {
          id: draw-w-same,
          type: whiteboard.apply,
          at: { mark: w-same },
          upsertIds: [w-same],
          drawMs: 900,
        }

  - id: quiz
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ မနေ့က chat ထဲမှာ agent ကို ဈေးနှုန်းတွေ ကျပ် ကိန်းပြည့်နဲ့ပဲ ပြပါ
      လို့ ပြောခဲ့တယ် ဆိုပါစို့။ ဒီနေ့ session အသစ်မှာတော့ agent က ဈေးနှုန်းကို ဒသမ နဲ့ ပြန်ပြနေပါတယ်။
      ဘာကြောင့်လဲ။ ပထမ အဖြေက model က တစ်ညအတွင်း ညံ့သွားလို့ပါ။ ဒုတိယ အဖြေက အဲဒီ rule က မနေ့က chat ထဲမှာပဲ
      ရှိခဲ့လို့ပါ။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ အဖြေ ပါ။
      ဘာကြောင့်လဲဆိုတော့ session အသစ်က စားပွဲ အလွတ်နဲ့ စတာမို့၊ chat ထဲမှာပဲ ပြောခဲ့တဲ့ rule က ဒီနေ့ စားပွဲပေါ်မှာ
      မရှိတော့လို့ပါ။ ဒီ ဖြစ်ရပ်မှာ model က ညံ့သွားတာ မဟုတ်ပါဘူး။ ပြင်ချင်ရင် ကြာကြာ သုံးမယ့် rule ကို agent က
      session တိုင်း ဖတ်တဲ့ file ထဲမှာ ရေးထားရပါမယ်။ အဲဒီ file ကို lesson ၁၀ မှာ ရေးကြမှာပါ။ [[mark:close-quiz]]
      ဒါကိုလည်း notes ထဲမှာ မှတ်ထားရအောင်။ [[mark:type-rule]] ဒီ စာကြောင်းက နောက်ပိုင်း rule အသစ် ပေါ်လာတိုင်း၊
      ဘယ်မှာ ရေးရမလဲ ဆိုတာကို ဆုံးဖြတ်ထားတာပါ။
    sources:
      - {
          title: "Claude Code docs: How Claude remembers your project",
          url: "https://code.claude.com/docs/en/memory",
        }
      - { title: "AGENTS.md", url: "https://agents.md/" }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [z-title, z-q1, z-q2, z-o1, z-o2],
          drawMs: 2400,
        }
      - {
          id: draw-quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [z-a, z-fix],
          drawMs: 1400,
        }
      - { id: close-quiz, type: whiteboard.apply, at: { mark: close-quiz }, open: false }
      - id: type-rule
        type: editor.type
        at: { mark: type-rule }
        target: { file: notes.md, after: "ပြန်ပတ်တယ်။\n", occurrence: 1 }
        text: "\n- မှတ်ရန် — chat ထဲက rule က session နဲ့ ပျောက်တယ်။ ကြာကြာ သုံးမယ့် rule ကို file ထဲ ရေး။\n"
        cadence: line-by-line
      - {
          id: expect-rule,
          type: expect.file,
          at: { afterAction: type-rule },
          path: notes.md,
          contains: "ကြာကြာ သုံးမယ့် rule ကို file ထဲ ရေး။",
        }

  - id: recap
    chapter: ပြန်ချုပ်ရရင်
    narration: >
      [[mark:sel-loop]] ဒါဆို ပြန်ချုပ်ရရင်၊ agent ဆိုတာ ပန်းတိုင် တစ်ခုအတွက် plan ချ၊ tool နဲ့ လုပ်၊ ရလဒ်ကို
      ကြည့်ပြီး၊ ပြီးတဲ့အထိ loop ပတ်တဲ့ software ပါ။ model၊ tool နဲ့ orchestration က အဲဒီ loop ကို အတူ
      လည်ပတ်စေပါတယ်။ [[mark:sel-rule]] agent က context window လို့ ခေါ်တဲ့ စားပွဲပေါ်က စာကိုပဲ မြင်ရလို့၊
      နောက်နေ့ထိ လိုမယ့် စည်းကမ်းကို agent ဖတ်မယ့် နေရာမှာ ထားရပါမယ်။ ထွက်လာတဲ့ အဖြေက သေချာသလို ပုံပေါ်ရင်တောင်
      မှားနိုင်လို့ ကိုယ်က စစ်ရပါမယ်။ နောက် lesson မှာတော့ agent ပတ်လည်မှာ စည်းကမ်းနဲ့ စစ်ဆေးမှု ဘယ်လောက် ထားမလဲ
      ဆိုတာကို၊ အလုပ် မှားရင် ဘယ်လောက် နစ်နာမလဲ ဆိုတဲ့ risk ပေါ်မူတည်ပြီး ဘယ်လို ရွေးမလဲ လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "Anthropic: Building effective agents",
