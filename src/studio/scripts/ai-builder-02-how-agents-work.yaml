# AI Builder, lesson 02: how coding agents work (Burmese, docs kind).
#
# Start state (ws/): base-docs (package.json with a no-op dev script, notes.md = "# Notes\n"). No
# binder document exists before L04. Nothing runs. The lesson types the agent loop (five lines) into
# notes.md, and after the quiz one line on where lasting rules belong.
#
# Boards: (C) chatbot vs agent, two columns flowing down; (L) the loop top to bottom (orange goal,
# violet steps, ↻ back to plan, green stop), reopened to annotate which part does each step; (D) the
# context window as a desk (violet), what is on it (white) and off it (red); (G) strengths (green) vs
# weaknesses (red) with the orange warning; (W) where agents live, three boxes; (Z) the two-option quiz.
#
# Build: bun ~/Documents/ai-builder-course-work/tools/build-lesson.ts template.yaml ws ai-builder-02-how-agents-work.yaml
