          slideId: five-moments,
        }
      - { id: point-m-1, type: slide.point, at: { mark: m-1 }, target: { x: 0.15, y: 0.35 } }
      - { id: point-m-2, type: slide.point, at: { mark: m-2 }, target: { x: 0.15, y: 0.47 } }
      - { id: point-m-3, type: slide.point, at: { mark: m-3 }, target: { x: 0.15, y: 0.59 } }
      - { id: point-m-4, type: slide.point, at: { mark: m-4 }, target: { x: 0.15, y: 0.71 } }
      - { id: point-m-5, type: slide.point, at: { mark: m-5 }, target: { x: 0.15, y: 0.83 } }

  - id: weekly
    chapter: အပတ်တိုင်း rhythm
    narration: >
      [[mark:w-title]] အခု တတိယ အချိန်ဖြစ်တဲ့ အပတ်တိုင်း rhythm ကို အသေးစိတ် ကြည့်ရအောင်။
      [[mark:w-axis]] Day ၁ ကနေ Day ၃၀ အထိ အပတ် လေးပတ် ရှိပြီး၊ အပတ်တိုင်း မပြတ် လုပ်မယ့် အရာ သုံးခု
      ရှိပါတယ်။
      [[mark:w-r1]] ပထမ တစ်ခုက office hours ပါ။ အပတ်မှာ နှစ်ခါ၊ ဘယ်သူမဆို ကိုယ့် ပြဿနာကို ယူလာပြီး FDE နဲ့ အတူ
      ထိုင်ကြည့်လို့ ရတဲ့ အချိန်ပါ။ Anthropic ရဲ့ Claude Enterprise Administrator Guide မှာလည်း office hours က
      ပထမ ရက် ၃၀ ကနေ ၆၀ အတွင်းမှာ အထူး အသုံးဝင်တယ်လို့ ဆိုပါတယ်။
      [[mark:w-r2]] ဒုတိယ တစ်ခုက သောကြာနေ့တိုင်း sponsor ဖြစ်တဲ့ အောင်အောင် နဲ့ ၁၅ မိနစ် ဂဏန်း ကြည့်တာပါ။ ဒီအပတ်
      ရွှေ့ပြီး စစ်ပြီးသား job ဘယ်နှခုလဲ၊ target နဲ့ ဘယ်လောက် ကွာလဲ၊ ပိတ်နေတဲ့ ပြဿနာ ရှိလား ဆိုတာပဲ
      ကြည့်ပါတယ်။ Day ၃၀ ရောက်မှ မထင်မှတ်တဲ့ သတင်း တစ်ခုကို sponsor က မကြားရအောင်ပါ။
      [[mark:w-r3]] တတိယ တစ်ခုက Center of Excellence ဖြစ်လာမယ့် လူတွေနဲ့ ဆုံတာပါ။ Center of Excellence၊
      အတိုကောက် CoE ဆိုတာ အတွေ့အကြုံနဲ့ စံနှုန်းတွေကို စုစည်းပြီး team တွေကို ကူညီတဲ့ အဖွဲ့ငယ်ပါ။ အခုတော့
      အဖွဲ့ မဖွဲ့ရသေးပေမဲ့၊ Billing team lead မောင်မောင် နဲ့ Network Tools က developer တစ်ယောက်ကို အပတ်တိုင်း
      ခေါ်ပြီး၊ အလုပ်ဖြစ်ခဲ့တဲ့ prompt တွေနဲ့ လုပ်နည်းကို ရေးထားတဲ့ skill တွေကို plugin ထဲ ထည့်သင့်မသင့် အတူ
      ဆုံးဖြတ်ပါတယ်။
      [[mark:w-brace]] ဒီ သုံးခုက အပတ်တိုင်း ထပ်လာပါတယ်။ Claude Code docs ထဲက champion kit မှာလည်း ရက် ၃၀
      အစီအစဉ် တစ်ခု ပါပါတယ်။ အဲဒါက FDE အတွက် မဟုတ်ဘဲ ကုမ္ပဏီထဲက champion တစ်ယောက်အတွက် ရေးထားတာပါ။
      [[mark:w-signal]] ဒါပေမဲ့ အဲဒီထဲက အကြံ တစ်ခုက ကိုယ်တို့အတွက်လည်း အသုံးဝင်ပါတယ်။ အပတ်တိုင်းအတွက်
      အလုပ်ဖြစ်နေပြီ ဆိုတာ ပြတဲ့ လက္ခဏာ တစ်ခုစီ ထားတာပါ။ ဥပမာ ပထမ အပတ်မှာ တစ်ယောက်ယောက်က မေးခွန်း
      တစ်ခု မေးလာတာ၊ နောက်ဆုံး အပတ်မှာတော့ မေးခွန်းတွေကို champion မဟုတ်တဲ့ တခြားသူတွေက ဖြေပေးလာတာမျိုးပါ။
    sources:
      - {
          title: "Claude Enterprise Administrator Guide (Anthropic Academy)",
          url: "https://academy.claude.com/tutorials/claude-enterprise-administrator-guide",
        }
      - {
          title: "Claude Code docs: Champion kit",
          url: "https://code.claude.com/docs/en/champion-kit",
        }
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
    actions:
      - { id: close-moments, type: slide.close, at: { mark: w-title, offsetMs: -1400 } }
      - {
          id: draw-w-title,
          type: whiteboard.apply,
          at: { mark: w-title, offsetMs: -500 },
          open: true,
          clear: true,
          upsertIds: [w-title],
        }
      - {
          id: draw-w-axis,
          type: whiteboard.apply,
          at: { mark: w-axis },
          upsertIds: [w-axis, w-t1, w-t2, w-t3, w-t4, w-d30],
          drawMs: 2400,
        }
      - {
          id: draw-w-r1,
          type: whiteboard.apply,
          at: { mark: w-r1 },
          upsertIds: [w-r1, w-r1-l],
          drawMs: 1200,
        }
      - {
          id: draw-w-r2,
          type: whiteboard.apply,
          at: { mark: w-r2 },
          upsertIds: [w-r2, w-r2-l],
          drawMs: 1200,
        }
      - {
          id: draw-w-r3,
          type: whiteboard.apply,
          at: { mark: w-r3 },
          upsertIds: [w-r3, w-r3-l],
          drawMs: 1200,
        }
      - {
          id: draw-w-brace,
          type: whiteboard.apply,
          at: { mark: w-brace },
          upsertIds: [w-brace],
          drawMs: 900,
        }
      - {
          id: point-w-d30,
          type: whiteboard.point,
          at: { mark: w-signal },
          target: { assetId: w-d30 },
        }

  - id: calendar
    chapter: Calendar ကို ချရေးခြင်း
    narration: >
      [[mark:c-open]] ဒါတွေကို နေခြည် ရဲ့ activation calendar အဖြစ် ချရေးကြည့်ရအောင်။
      [[mark:c-head]] ထိပ်ဆုံးက cohort၊ sponsor၊ champion နဲ့ target တွေကို pack ထဲကနေ ယူထားပါတယ်။ calendar
      ရဲ့ အပိုင်းတိုင်းက ဒီ target ကို ရောက်ဖို့ပါပဲ။
      [[mark:type-pre]] ပထမ အပိုင်းက Day ၁ မတိုင်ခင် အပတ်ပါ။ account၊ plugin နဲ့ CLAUDE.md တွေက စက်တိုင်းမှာ
      ရောက်နေကြောင်း စစ်ပြီးသား ဖြစ်ရပါမယ်။ baseline အဖြစ် job သုံးခုကို လက်နဲ့ ရွှေ့တဲ့ အချိန်နဲ့ ပြီးခဲ့တဲ့ သုံးလက
      review မှာ ပြန်ပို့ခံရတဲ့ PR အရေအတွက်ကို မှတ်ထားပါတယ်။
      [[mark:type-w1]] ဒုတိယ အပိုင်းက ပထမ အပတ်ပါ။ Day ၁ မနက်မှာ kick-off လုပ်ပြီး၊ ညနေ မတိုင်ခင် developer
      တိုင်းက ပထမ task တစ်ခုကို စလုပ်ထားရပါမယ်။ report job တွေကို ရွှေ့မယ့် developer နှစ်ယောက်ကတော့ ရိုးရှင်းတဲ့
      job တွေနဲ့ စပြီး၊ output တိုက်စစ်တဲ့ နည်းကို အရင် ယုံကြည်လာအောင် လုပ်ပါတယ်။
      [[mark:type-weekly]] တတိယ အပိုင်းက အပတ်တိုင်း rhythm ပါ။ office hours ရဲ့ နေ့နဲ့ အချိန်ကို Day ၁
      မတိုင်ခင်ကတည်းက လူတိုင်းရဲ့ calendar ထဲ ထည့်ပေးထားပါတယ်။ အချိန် သတ်မှတ်မထားတဲ့ office hours ဆိုတာ
      ဘယ်သူမှ မလာတဲ့ office hours ပါပဲ။
      [[mark:type-w4]] စတုတ္ထ အပိုင်းက နောက်ဆုံး အပတ်ပါ။ developer တွေနဲ့ တွဲလုပ်တဲ့ pairing session တွေနဲ့ အမေးများတဲ့
      မေးခွန်း စာရင်းကို ပြီးအောင် လုပ်ပြီး၊ handover checklist ကို မောင်မောင် နဲ့ အတူ တစ်ကြောင်းချင်း စစ်ပါတယ်။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
      - {
          title: "Claude Code docs: Champion kit",
          url: "https://code.claude.com/docs/en/champion-kit",
        }
    actions:
      - { id: close-weekly, type: whiteboard.apply, at: { mark: c-open }, open: false }
      - {
          id: open-calendar,
          type: workspace.openFile,
          at: { afterAction: close-weekly },
          path: notebook/52-activation-calendar.md,
        }
      - id: sel-head
        type: editor.select
        at: { mark: c-head }
        target:
          file: notebook/52-activation-calendar.md
          text: "- cohort: developer 8 ယောက် (Billing 6၊ Network Tools 2)\n- sponsor: CTO အောင်အောင် · champion: မောင်မောင်\n- target: report job 140 ကို developer 2 ယောက်နဲ့ 3 ပတ် (လက်နဲ့ဆို 5 ယောက် × 8 ပတ်)"
      - id: type-pre
        type: editor.type
        at: { mark: type-pre }
        cadence: line-by-line
        target: { file: notebook/52-activation-calendar.md, after: "(လက်နဲ့ဆို 5 ယောက် × 8 ပတ်)\n\n" }
        text: "## Day 1 မတိုင်ခင်\n- account၊ plugin၊ CLAUDE.md စက်တိုင်းမှာ စစ်ပြီး။ baseline မှတ်ပြီး\n\n"
      - id: type-w1
        type: editor.type
        at: { mark: type-w1 }
        cadence: line-by-line
        target: { file: notebook/52-activation-calendar.md, after: "baseline မှတ်ပြီး\n\n" }
        text: "## ပတ် 1\n- Day 1 မနက် kick-off: CTO က ဘာကြောင့်လဲ ပြော။ ညနေ မတိုင်ခင် ပထမ task စ\n\n"
      - id: type-weekly
        type: editor.type
        at: { mark: type-weekly }
        cadence: line-by-line
        target: { file: notebook/52-activation-calendar.md, after: "ညနေ မတိုင်ခင် ပထမ task စ\n\n" }
        text: "## ပတ်တိုင်း\n- office hours အင်္ဂါ၊ ကြာသပတေး · သောကြာ ဂဏန်း 15 မိနစ် · CoE အဖွဲ့နဲ့ ဆုံ\n\n"
      - id: type-w4
        type: editor.type
        at: { mark: type-w4 }
        cadence: line-by-line
        target: { file: notebook/52-activation-calendar.md, after: "CoE အဖွဲ့နဲ့ ဆုံ\n\n" }
        text: "## ပတ် 4\n- pairing နဲ့ FAQ ပြီးအောင်။ handover checklist ကို မောင်မောင် နဲ့ စစ်\n\n"

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ Day ၃၀ showcase မှာ ဒါရိုက်တာ အဖွဲ့ရှေ့ ရလဒ်ကို ဘယ်သူ ပြသင့်မလဲ။
      [[mark:q-a]] ပထမ ရွေးချယ်စရာက ကိုယ်ပါ။ FDE အနေနဲ့ pack တစ်ခုလုံးကို အကောင်းဆုံး သိတဲ့သူ ဖြစ်ပြီး၊
      ပြောတာလည်း ချောမွေ့ပါတယ်။
      [[mark:q-b]] ဒုတိယ ရွေးချယ်စရာက job တွေကို တကယ် ရွှေ့ခဲ့တဲ့ developer တွေပါ။ lesson ကို pause လုပ်ပြီး
      စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ တစ်ခုပါ။ ဘာကြောင့်လဲဆိုတော့ ကိုယ်က ပြရင် ဒါရိုက်တာ အဖွဲ့ ကြားရတာက
      အပြင် ကုမ္ပဏီရဲ့ အရောင်းစကား ဖြစ်သွားနိုင်လို့ပါ။ developer တွေ ကိုယ်တိုင် ပြတော့မှ ဒီ ရလဒ်က
      နေခြည် ရဲ့ လူတွေ လုပ်နိုင်တဲ့ အရာ ဖြစ်ကြောင်း မြင်ရပါတယ်။ job တစ်ခုကို ဘယ်လို စစ်ခဲ့လဲ လို့ မေးရင်လည်း
      တကယ် လုပ်ခဲ့တဲ့သူကပဲ အသေးစိတ် ဖြေနိုင်ပါတယ်။
      [[mark:q-rule]] ဒါကြောင့် showcase မှာ FDE က နောက်ကနေ ကူပေးပြီး၊ ကိုယ် ထွက်သွားပြီးနောက် ဆက်လုပ်မယ့်
      လူတွေကို ရှေ့မှာ ထားပါ။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: q-rule },
          upsertIds: [q-t1],
          drawMs: 900,
        }

  - id: day-30
    chapter: Day 30 ရဲ့ ရလဒ်
    narration: >
      [[mark:r-open]] အဲဒီ calendar အတိုင်း ရက် ၃၀ ကို run ခဲ့ပြီးနောက် Day ၃၀ ရောက်လာပါတယ်။ showcase မှာ report
      job တွေကို ရွှေ့ခဲ့တဲ့ Billing developer နှစ်ယောက်က ကိုယ်တိုင် ပြခဲ့ပါတယ်။ ပြီးတော့ plugin နဲ့ documentation
      ကို handover checklist အတိုင်း မောင်မောင် ဆီ လွှဲပေးခဲ့ပါတယ်။
      [[mark:type-result]] ရလဒ်ကတော့ ဒီလိုပါ။ developer နှစ်ယောက်က job ၁၄၀ လုံးကို အလုပ်ရက် ၁၇ ရက်နဲ့
      ရွှေ့ပြီးခဲ့ပါတယ်။ output ကို တိုက်စစ်တဲ့ အဆင့်ကလည်း လက်နဲ့ ပြင်ရမယ့် job သုံးခုကို
      ဖမ်းမိခဲ့ပါတယ်။
      [[mark:r-honest]] ဒီ ဂဏန်းတွေကို သတ်မှတ်ချက်နဲ့ ရိုးရိုးသားသား တိုက်ဖတ်ကြည့်ရအောင်။ target က ၃ ပတ်၊
      ဆိုလိုတာက အလုပ်ရက် ၁၅ ရက်ပါ။ တကယ် ကြာတာက ၁၇ ရက်မို့ နှစ်ရက် ပိုကြာခဲ့ပါတယ်။ ဒါပေမဲ့ လက်နဲ့ဆိုရင်
      developer ၅ ယောက် ၈ ပတ် ကြာမယ့် အလုပ်ကို နှစ်ယောက်တည်းက တစ်လ မပြည့်ခင် ပြီးခဲ့တာပါ။
      [[mark:r-three]] job သုံးခု ဖမ်းမိတာကလည်း မကောင်းတဲ့ သတင်း မဟုတ်ပါဘူး။ စစ်ဆေးမှုက တကယ် အလုပ်လုပ်ကြောင်း၊
      မှားနေတဲ့ report တစ်ခုမှ သုံးမယ့်သူဆီ မရောက်ခဲ့ကြောင်း ပြတာပါ။ ဒါကြောင့် ဒီ နှစ်ရက်ကို ဖုံးမထားဘဲ
      ဒါရိုက်တာ အဖွဲ့ကို ပြောပြခဲ့ပြီး၊ Day ၃၀ ရဲ့ ဆုံးဖြတ်ချက်က ဆက်လုပ်မယ် ဆိုတာ ဖြစ်ခဲ့ပါတယ်။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: r-open }, open: false }
      - id: type-d30
        type: editor.type
        at: { mark: r-open, offsetMs: 2500 }
        cadence: line-by-line
        target:
          {
            file: notebook/52-activation-calendar.md,
            after: "handover checklist ကို မောင်မောင် နဲ့ စစ်\n\n",
          }
        text: "## Day 30\n- showcase: developer တွေကိုယ်တိုင် ပြ၊ ဂဏန်းကို criteria နဲ့ တိုက်ပြီး ဆုံးဖြတ်\n- handover: plugin နဲ့ documentation ကို မောင်မောင် ဆီ လွှဲ\n\n"
      - id: type-result
        type: editor.type
        at: { mark: type-result }
        cadence: line-by-line
        target:
          { file: notebook/52-activation-calendar.md, after: "documentation ကို မောင်မောင် ဆီ လွှဲ\n\n" }
        text: "## ရလဒ်\n- job 140 အားလုံး၊ developer 2 ယောက်၊ အလုပ်ရက် 17 ရက်\n- output တိုက်စစ်မှုက လက်နဲ့ ပြင်ရမယ့် job 3 ခု ဖမ်းမိ\n"
      - id: expect-result
        type: expect.file
        at: { afterAction: type-result }
        path: notebook/52-activation-calendar.md
        contains: "- job 140 အားလုံး၊ developer 2 ယောက်၊ အလုပ်ရက် 17 ရက်\n"
      - id: sel-days
        type: editor.select
        at: { mark: r-honest }
        target:
          file: notebook/52-activation-calendar.md
          text: "အလုပ်ရက် 17 ရက်"
      - id: sel-three
        type: editor.select
        at: { mark: r-three }
        target:
          file: notebook/52-activation-calendar.md
          text: "- output တိုက်စစ်မှုက လက်နဲ့ ပြင်ရမယ့် job 3 ခု ဖမ်းမိ"

  - id: your-turn
    chapter: ကိုယ့် team အတွက်
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ကိုယ့် team မှာ activation တစ်ခု စမယ်ဆိုရင်
      ပထမ အပတ်ကို ဒီ calendar ပုံစံအတိုင်း ရေးကြည့်ပါ။ Day ၁ မနက်မှာ ဘယ်သူက ဘာကြောင့်လဲ ဆိုတာ ပြောမလဲ၊
      ညနေ မတိုင်ခင် ဘယ်သူက ဘယ် task ကို စလုပ်မလဲ ဆိုတာကို နာမည်နဲ့ ရေးပါ။
      [[mark:turn-2]] office hours ကို ဘယ်နေ့ ဘယ်အချိန် ထားမလဲ ဆိုတာလည်း တစ်ကြောင်း ထည့်ပါ။ ကိုယ့် team မှာ AI
      tool တစ်ခုမှ မရှိသေးရင်လည်း ရပါတယ်။ ပထမ အပတ် ရှင်းမနေရင် ကျန်တဲ့ သုံးပတ်လည်း ရှင်းမှာ မဟုတ်ပါဘူး။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
