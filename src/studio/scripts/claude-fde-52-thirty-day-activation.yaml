          type: whiteboard.apply,
          at: { mark: p-34 },
          upsertIds: [p-b3, p-l3, p-b4, p-l4],
          drawMs: 1800,
        }
      - {
          id: draw-p-att,
          type: whiteboard.apply,
          at: { mark: p-att },
          upsertIds: [p-att],
          drawMs: 900,
        }
      - {
          id: draw-p-cal,
          type: whiteboard.apply,
          at: { mark: p-cal },
          upsertIds: [p-arrow, p-cal, p-cal-l],
          drawMs: 1500,
        }

  - id: five-moments
    chapter: အရေးကြီးတဲ့ အချိန် ငါးခု
    narration: >
      [[mark:m-open]] ရက် ၃၀ ကို အပတ်တွေ မခွဲခင်၊ အရေးကြီးတဲ့ အချိန် ငါးခုကို အရင် သတ်မှတ်ကြည့်ရအောင်။ ကျန်တဲ့
      နေ့တွေက ဒီ ငါးခုကြားမှာ ရှိနေတာပါ။
      [[mark:m-1]] ပထမ တစ်ခုက Day ၁ မတိုင်ခင် ကာလပါ။ developer ၈ ယောက်လုံး company account နဲ့ coding agent
      ဖြစ်တဲ့ Claude Code ကို ဝင်သုံးလို့ ရနေရပါမယ်။ project အကြောင်း ရေးထားတဲ့ CLAUDE.md file တွေ၊ team
      ရဲ့ setup ကို တစ်ထုပ်တည်း ထုပ်ထားတဲ့ plugin ကလည်း စက်တိုင်းမှာ ရောက်နေရပါမယ်။ Day ၁ ရောက်မှ login ဝင်မရတာတွေနဲ့
      ပထမ ရက်တွေ ကုန်သွားရင်၊ cohort ရဲ့ ယုံကြည်မှုက စကတည်းက ကျသွားတတ်ပါတယ်။
      [[mark:m-2]] ဒုတိယ တစ်ခုက Day ၁ ရဲ့ kick-off အစည်းအဝေးပါ။ ဒီမှာ အောင်အောင် ကိုယ်တိုင် ဘာကြောင့် ဒီ
      အလုပ်ကို လုပ်တာလဲ ဆိုတာ သူ့စကားနဲ့ ပြောပါတယ်။ ပြီးတော့ developer တိုင်းက အစည်းအဝေးက ထွက်လာတဲ့အခါ
      ကိုယ်တိုင် စလုပ်မယ့် ပထမ task တစ်ခု လက်ထဲ ပါလာရပါမယ်။
      [[mark:m-3]] တတိယ တစ်ခုက အပတ်တိုင်း ထပ်ခါထပ်ခါ လုပ်မယ့် အစည်းအဝေး သုံးမျိုးပါ။ ဒါကို rhythm လို့
      ခေါ်ပြီး ခဏနေရင် အသေးစိတ် ကြည့်ပါမယ်။
      [[mark:m-4]] စတုတ္ထ တစ်ခုက Day ၃၀ ရဲ့ ရလဒ်ပြပွဲ၊ showcase ပါ။ ဒီနေ့မှာ ဂဏန်းတွေကို Day ၁ မတိုင်ခင်က ရေးထားတဲ့ အောင်မြင်မှု
      သတ်မှတ်ချက်တွေနဲ့ တိုက်ဖတ်ပြီး၊ ဆက်လုပ်မလား၊ ပြင်ပြီးမှ ဆက်လုပ်မလား၊ ရပ်မလား ဆိုတဲ့ ဆုံးဖြတ်ချက်
      တစ်ခုနဲ့ အဆုံးသတ်ရပါမယ်။ ဆေးပညာမှာ pilot စမ်းသပ်မှုတွေအတွက် ရေးထားတဲ့ လမ်းညွှန် တစ်ခုကလည်း ဒီလို
      ဆုံးဖြတ်ချက် စည်းမျဉ်းကို pilot မစခင် ကြိုတင် သတ်မှတ်ထားဖို့ ဆိုပါတယ်။
      [[mark:m-5]] ပဉ္စမ တစ်ခုကတော့ handover ပါ။ plugin၊ CLAUDE.md file တွေနဲ့ documentation ကို checklist တစ်ခုနဲ့
      champion ဆီ လွှဲပေးတာပါ။ FDE လုပ်ခဲ့တဲ့ အရာတွေက ကိုယ့် laptop ထဲမှာ ကျန်မနေဘဲ၊ နေခြည် ရဲ့ repository ထဲ
      ရောက်သွားရပါမယ်။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
      - {
          title: "Eldridge et al., CONSORT 2010 statement: extension to randomised pilot and feasibility trials (BMJ 2016)",
          url: "https://europepmc.org/article/PMC/PMC5076380",
        }
    actions:
      - {
          id: close-pack,
          type: whiteboard.apply,
          at: { mark: m-open, offsetMs: -1400 },
          open: false,
        }
      - {
          id: show-moments,
