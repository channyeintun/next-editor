  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 9352

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: open
    chapter: Pack ကို calendar ပေါ် တင်ခြင်း
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ engagement တစ်ခု ပျက်တတ်တဲ့ ပုံစံတွေ၊ ဆိုလိုတာက failure mode တွေနဲ့ အဲဒါတွေရဲ့
      အစောပိုင်း လက္ခဏာတွေကို ကြိုမြင်အောင် လေ့လာခဲ့ပါတယ်။
      [[mark:p-title]] အခုဆိုရင် CTO ဖြစ်တဲ့ အောင်အောင် တောင်းထားတဲ့ Delivery Plan Pack ရဲ့ စာမျက်နှာတွေ အားလုံး
      ကိုယ့်လက်ထဲ ရောက်နေပါပြီ။ ဒါရိုက်တာ အဖွဲ့ ဖတ်နိုင်မယ့် ရလဒ်အတွက် စာတွဲပါ။
      [[mark:p-12]] ပထမ စာမျက်နှာမှာ use case တွေ၊ ဆိုလိုတာက AI နဲ့ ဖြေရှင်းမယ့် အလုပ်တွေထဲကနေ Billing ရဲ့ report
      job ၁၄၀ ကို ရွှေ့တဲ့ အလုပ်ကို ရွေးခဲ့ပါတယ်။ ဒုတိယ စာမျက်နှာက pilot design ပါ။ pilot ဆိုတာ အပြည့်အဝ
      မသုံးခင် လူနည်းနည်းနဲ့ အချိန်တိုတို စမ်းတာပါ။ developer ၂၄ ယောက်ထဲက ၈ ယောက်ကို cohort၊ ဆိုလိုတာက pilot
      မှာ ပါမယ့် လူအုပ်စု အဖြစ် ရွေးထားပါတယ်။
      [[mark:p-34]] တတိယ စာမျက်နှာက ROI scorecard ပါ။ return on investment၊ အတိုကောက် ROI ဆိုတာ ကုန်ကျတာနဲ့
      ယှဉ်ရင် ဘယ်လောက် အကျိုးရှိလဲ ဆိုတာပါ။ လက်နဲ့ဆိုရင် developer ၅ ယောက် ၈ ပတ် ကြာမယ့် အလုပ်ကို၊ developer
      နှစ်ယောက်နဲ့ ၃ ပတ်အတွင်း ပြီးအောင် လုပ်မယ်လို့ ရေးထားပါတယ်။ စတုတ္ထ စာမျက်နှာကတော့ champion plan ပါ။
      champion ဆိုတာ အဖွဲ့ထဲမှာ ရှေ့ကနေ သုံးပြပြီး တခြားသူတွေကို ကူညီပေးတဲ့သူ ဖြစ်ပါတယ်။
      [[mark:p-att]] ဒီ လေးခုအပြင် rollout plan နဲ့ risk register ဆိုတဲ့ နောက်ဆက်တွဲ နှစ်ခုလည်း ပါပါတယ်။
      [[mark:p-cal]] ပြဿနာက စာမျက်နှာ လေးခုလုံး မှန်နေပေမဲ့၊ ဘယ်နေ့မှာ ဘာလုပ်ရမလဲ ဆိုတာကို ဘယ်စာမျက်နှာကမှ
      မပြောတာပါ။ baseline ဆိုတဲ့ မစခင်က တိုင်းထားတဲ့ မူလ ဂဏန်းကို Day ၁ မတိုင်ခင် ယူရမယ်၊ champion ကို
      နောက်ဆုံး အပတ်မှာ တာဝန်လွှဲရမယ် ဆိုတဲ့ အချက်တွေက စာမျက်နှာ အသီးသီးမှာ ပြန့်ကျဲနေပါတယ်။ ဒါကြောင့် pack
      တစ်ခုလုံးကို calendar တစ်ခုတည်းပေါ် တင်ပြီး၊ ရက် ၃၀ activation ကို အပတ်လိုက် ချရေးကြည့်ပါမယ်။ activation
      ဆိုတာ သုံးစွဲမှုကို တကယ် စတင်နိုင်အောင် ပြင်ဆင်တဲ့ အဆင့်ပါ။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
