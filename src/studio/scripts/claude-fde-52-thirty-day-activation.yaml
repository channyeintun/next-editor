  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ ရက် ၃၀ activation ဆိုတာ Delivery Plan Pack ရဲ့ စာမျက်နှာ လေးခုကို calendar
      တစ်ခုတည်းပေါ် တင်ပြီး run တာပါ။ Day ၁ မတိုင်ခင် ပြင်ဆင်ထားပြီး၊ kick-off ကနေ ပထမ task နဲ့ စကာ၊ အပတ်တိုင်း
      rhythm ကို မပြတ် လုပ်ပါတယ်။
      [[mark:recap-2]] Day ၃၀ မှာတော့ ဂဏန်းကို သတ်မှတ်ချက်နဲ့ ရိုးရိုးသားသား တိုက်ဖတ်ပြီး ဆုံးဖြတ်ကာ၊ ဆက်လုပ်မယ့်
      လူတွေဆီ လွှဲပေးပါတယ်။
      [[mark:next]] ဒီ ရလဒ်ကို ကြည့်ပြီး ဒါရိုက်တာ အဖွဲ့က Claude ကို ကုမ္ပဏီ တစ်ခုလုံး သုံးဖို့ ခွင့်ပြုလိုက်ပါတယ်။
      နောက် lesson မှာတော့ ဝန်ထမ်း ၄၃၀ လုံးအတွက် လိုအပ်တဲ့ success team ကို ဖွဲ့တာနဲ့၊ account တွေနဲ့ setting
      တွေကို ကြိုပြင်ဆင်တဲ့ provisioning ကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
