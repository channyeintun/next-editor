  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ နောက်နှစ် လုပ်မယ့် အလုပ် တစ်ခုတည်းကို ဒါရိုက်တာအဖွဲ့ကို စာကြောင်း
      နှစ်မျိုးနဲ့ ပြောလို့ ရပါတယ်။
      [[mark:q-a]] ပထမ စာကြောင်းက Payment service ရဲ့ wallet ဘက်က layer ကို wallet အများကြီးအတွက် adapter layer
      အဖြစ် ပြန်ဆောက်ပါမယ် ဆိုတာပါ။
      [[mark:q-b]] ဒုတိယ စာကြောင်းက wallet ကုမ္ပဏီ အသစ် တစ်ခုကို ခြောက်လ မဟုတ်ဘဲ နှစ်ပတ်နဲ့ ထည့်နိုင်ပါတော့မယ်
      ဆိုတာပါ။ ဒါရိုက်တာအဖွဲ့က ဘယ်စာကြောင်းကို ကြားမှ ဆုံးဖြတ်နိုင်မလဲ။ lesson ကို pause လုပ်ပြီး
      စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ စာကြောင်းပါ။ ဘာကြောင့်လဲဆိုတော့ ပထမ စာကြောင်းက ကိုယ်တို့ ဘာလုပ်မလဲကိုပဲ
      ပြောပြီး၊ ကုမ္ပဏီအတွက် ဘာပြောင်းသွားမလဲကို မပြောလို့ပါ။ adapter layer ပြန်ဆောက်တာ ကောင်းလား၊ မကောင်းဘူးလား
      ဆိုတာကို ဒါရိုက်တာတွေ အကဲမဖြတ်နိုင်ပါဘူး။
      [[mark:q-r]] ဒုတိယ စာကြောင်းကတော့ ကုမ္ပဏီ ဘာလုပ်နိုင်လာမလဲ၊ ဘယ်လောက် မြန်မလဲ ဆိုတာကို ပြောပါတယ်။ wallet
      ကုမ္ပဏီနဲ့ ဝန်ဆောင်ခ ညှိတဲ့အခါ၊ အဲဒီ wallet ပျက်သွားတဲ့အခါ ဒါက ဘာအဓိပ္ပာယ်လဲ ဆိုတာကို ဒါရိုက်တာတိုင်း
      ချက်ချင်း မြင်နိုင်ပါတယ်။
      [[mark:q-lead]] အလုပ်က အတူတူပါပဲ။ ပြောင်းသွားတာက ရလဒ်ကို အရင် ပြောလိုက်တာပါ။ အပေါ်ထပ်က နားထောင်တာက
      ဘယ်လောက် မြန်မလဲ၊ risk ဘယ်လောက် လျော့မလဲ၊ ဘယ်လောက် ကုန်မလဲ ဆိုတာတွေပါ။
    sources:
      - {
          title: "The Software Architect Elevator (Hohpe)",
          url: "https://oreil.ly/Software_Architect_Elevator",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          clear: true,
          upsertIds: [q-title],
          drawMs: 1200,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 1200 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 1200 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - { id: draw-q-r, type: whiteboard.apply, at: { mark: q-r }, upsertIds: [q-r], drawMs: 1300 }
      - {
          id: draw-q-lead,
          type: whiteboard.apply,
          at: { mark: q-lead },
          upsertIds: [q-lead],
          drawMs: 1300,
        }

  - id: options
    chapter: Architecture က option ကို ရောင်းတယ်
    narration: >
      [[mark:o-open]] ဒုတိယ စာကြောင်းက တကယ်တော့ ဒါရိုက်တာအဖွဲ့ကို အရာ တစ်ခု ရောင်းနေတာပါ။ အဲဒါကို option လို့
      ခေါ်ပါတယ်။ option ဆိုတာ အခု မဆုံးဖြတ်ဘဲ၊ နောက်မှ လုပ်ချင်ရင် လုပ်နိုင်ခွင့်ကို ချန်ထားတာပါ။ မဖြစ်မနေ
      လုပ်ရမယ့် တာဝန် မဟုတ်ဘဲ၊ လုပ်ချင်ရင် လုပ်နိုင်တဲ့ အခွင့်အရေးပါ။
      [[mark:o-now]] option က အလကား မရပါဘူး။ အခု ဈေး တစ်ခု ပေးရပါတယ်။ wallet ကိစ္စမှာဆိုရင် Payment team ရဲ့
      နှစ်လစာ အလုပ်ပါ။
      [[mark:o-later]] အဲဒီအတွက် ရတာက၊ wallet ကုမ္ပဏီ အသစ် တစ်ခု ထည့်ဖို့ လိုလာတဲ့နေ့မှာ ခြောက်လ မစောင့်ရဘဲ
      နှစ်ပတ်နဲ့ ပြီးတာပါ။ ဘယ်လောက် ကုန်မလဲ ဆိုတာကိုလည်း ကြိုသိပြီးသားပါ။
      [[mark:o-not]] မလိုလာဘူးဆိုရင်တော့ ဘာမှ ထပ်မကုန်ပါဘူး။ ပေးခဲ့ပြီးသား နှစ်လပဲ ကုန်တာပါ။
      [[mark:o-when]] ဒါဆို option က ဘယ်အချိန်မှာ တန်ဖိုး အရှိဆုံးလဲ။
      [[mark:o-uncertain]] ရှေ့မှာ ဘာဖြစ်မလဲ မသေချာလေ တန်ဖိုး ရှိလေပါ။ wallet ကုမ္ပဏီက ဝန်ဆောင်ခ တင်မလား၊ ပြိုင်ဘက်
      wallet တစ်ခု လူကြိုက်များလာမလား ဆိုတာ ဘယ်သူမှ မသိပါဘူး။ အားလုံး သေချာနေရင်တော့ option ဝယ်စရာ
      မလိုပါဘူး။
      [[mark:o-question]] ဒါကြောင့် အပေါ်ထပ်က မေးသင့်တဲ့ မေးခွန်းက ဒီ architecture က သပ်ရပ်ရဲ့လား ဆိုတာ မဟုတ်ပါဘူး။
      နောက်မှ ကိုယ်တို့ ဘာတွေ လုပ်နိုင်မလဲ၊ အဲဒီအတွက် ဘယ်လောက် ကုန်မလဲ ဆိုတာပါ။ ဘယ် option ကို ဝယ်မလဲ ဆိုတာကတော့ သူတို့ရဲ့
      ဆုံးဖြတ်ချက်ပါ။ ရှေ့ရေး ဘယ်လောက် မသေချာလဲ ဆိုတာကို business က အသိဆုံးမို့ပါ။ architect ရဲ့ တာဝန်က
      ဈေးနှုန်းစာရင်းကို အမှန်အတိုင်း ပြပေးဖို့ပါ။
    sources:
      - {
          title: "The Software Architect Elevator (Hohpe)",
          url: "https://oreil.ly/Software_Architect_Elevator",
        }
    actions:
      - {
          id: draw-o-open,
          type: whiteboard.apply,
          at: { mark: o-open },
          clear: true,
          upsertIds: [o-title],
          drawMs: 1200,
        }
      - {
          id: draw-o-now,
          type: whiteboard.apply,
          at: { mark: o-now },
          upsertIds: [o-h1, o-h2, o-r1, o-c11, o-c12],
          drawMs: 2400,
        }
      - {
          id: draw-o-later,
          type: whiteboard.apply,
          at: { mark: o-later },
          upsertIds: [o-r2, o-c21, o-c22],
          drawMs: 1500,
        }
      - {
          id: draw-o-not,
          type: whiteboard.apply,
          at: { mark: o-not },
          upsertIds: [o-r3, o-c31, o-c32],
          drawMs: 1500,
        }
      - {
          id: draw-o-note,
          type: whiteboard.apply,
          at: { mark: o-uncertain },
          upsertIds: [o-note],
          drawMs: 1300,
        }

  - id: memo
    chapter: တစ်မျက်နှာ memo
    narration: >
      [[mark:m-close]] ဒါကို ဒါရိုက်တာအဖွဲ့ဆီ ပို့မယ့် စာတစ်မျက်နှာနဲ့ ရေးကြည့်ရအောင်။ အစည်းအဝေးမှာ ပြောတာက ခဏနဲ့
      ပျောက်သွားပေမဲ့၊ ရေးထားတဲ့ စာကတော့ မတက်နိုင်တဲ့သူဆီလည်း ရောက်ပြီး နောက်နှစ်အထိ ကျန်နေပါတယ်။
      [[mark:type-purpose]] ပထမဆုံး ရည်ရွယ်ချက်ကို နှစ်ကြောင်းတည်းနဲ့ ရေးပါတယ်။ service တွေအကြောင်း တစ်လုံးမှ
      မပါပါဘူး။ ဒီ အချိန်တွေက နောက်နှစ် မသေချာတဲ့ ကိစ္စ သုံးခုအတွက် လုပ်နိုင်ခွင့်တွေကို ကြိုဝယ်ထားတာ
      ဆိုတာကိုပဲ ပြောပါတယ်။
      [[mark:m-ramp]] ဒီနေရာမှာ option ဆိုတဲ့ စကားလုံးကို မသုံးဘဲ စရန်ပေးထားတာနဲ့ နှိုင်းပြထားပါတယ်။ စရန်ပေးတာကို ဒါရိုက်တာတိုင်း
      သိပါတယ်။ မြေကွက် ဝယ်တဲ့အခါ ငွေနည်းနည်း အရင်ပေးပြီး၊ သဘောတူထားတဲ့ ဈေးနဲ့ နောက်မှ ဝယ်ခွင့်ကို ယူထားတာပါ။
      [[mark:m-talk]] အပေါ်ထပ်ကို ရှင်းပြတဲ့အခါ jargon လည်း မသုံးရဘူး၊ ကလေးကို ပြောသလိုလည်း မပြောရပါဘူး။ သူတို့
      သိပြီးသား အရာကနေ စပြီး၊ တစ်ဆင့်ချင်း တက်သွားနိုင်မယ့် လမ်းကို ခင်းပေးရတာပါ။ ကိန်းဂဏန်းတွေကိုလည်း မဖျောက်ပါဘူး။ နှစ်လ၊ ခြောက်လ၊
      နှစ်ပတ် ဆိုတာတွေက သူတို့ နေ့တိုင်း ချိန်ဆနေကျ အရာတွေပါ။
      [[mark:type-o1]] အောက်မှာ လုပ်နိုင်ခွင့် သုံးခုကို တစ်ကြောင်းစီ ရေးပါတယ်။ ပထမက wallet ပါ။ ဘာလုပ်နိုင်လာမလဲ၊
      အခု ဘယ်လောက် ပေးရမလဲ၊ ဘယ်လို အခြေအနေမှာ တန်မလဲ ဆိုတာကို တစ်ကြောင်းတည်းမှာ မြင်ရပါတယ်။
      [[mark:type-o2]] ဒုတိယက capacity ပါ။ သင်္ကြန်လို နေ့မျိုးမှာ ဝင်သုံးသူက ခန့်မှန်းထားတာထက် များလာရင်၊
      တစ်နာရီအတွင်း နှစ်ဆ တိုးနိုင်ဖို့ပါ။
      [[mark:type-o3]] တတိယက ပါဆယ် လုပ်ငန်းသစ်ပါ။ ဈေးကွက်က မသေချာသေးတာမို့၊ လက်မှတ် ရောင်းတဲ့ system ကို မထိဘဲ
      ထည့်နိုင်၊ မအောင်မြင်ရင် ပြန်ဖြုတ်နိုင်အောင် ဆောက်မှာပါ။ ဖြုတ်နိုင်ခွင့်လည်း option တစ်ခုပါပဲ။
      [[mark:type-note]] table အောက်မှာ မှတ်ချက် တစ်ကြောင်း ထည့်ထားပါတယ်။ နောက်နှစ် wallet ကုမ္ပဏီက ဝန်ဆောင်ခ
      မတင်ဘူးဆိုရင် ပထမ လုပ်နိုင်ခွင့်ကို သုံးဖြစ်မှာ မဟုတ်ပါဘူး။ အဲဒါက ဆုံးဖြတ်ချက် မှားခဲ့တာ မဟုတ်ပါဘူး။
      ဆုံးဖြတ်ချက် တစ်ခုကို ရလဒ်နဲ့ မဟုတ်ဘဲ၊ ဆုံးဖြတ်တဲ့ အချိန်က သိထားတာတွေနဲ့ အကဲဖြတ်ရတာပါ။ ဒါကို အခုကတည်းက
      ရေးထားမှ၊ နောက်နှစ်မှာ မသုံးဖြစ်တဲ့ အရာအတွက် ဘာလို့ ပေးခဲ့လဲ ဆိုတဲ့ မေးခွန်းကို ဖြေနိုင်မှာပါ။
      [[mark:m-depths]] နောက်ဆုံး ခေါင်းစဉ်တွေကို ကြည့်ပါ။ ခေါင်းစဉ် နှစ်ခုကိုပဲ ဖတ်တဲ့သူက အဓိက အချက်ကို ရသွားပါတယ်။
      table ကိုပါ ဖတ်တဲ့သူကတော့ အသေးစိတ်ကို ရပါတယ်။ အချိန်မရှိတဲ့သူရော၊ စေ့စေ့စပ်စပ် ဖတ်တဲ့သူရော
      တစ်မျက်နှာတည်းနဲ့ ရအောင် ရေးထားတာပါ။
