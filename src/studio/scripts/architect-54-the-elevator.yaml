        text: "နောက်နှစ် မသေချာတဲ့ ကိစ္စ 3 ခုအတွက် လုပ်နိုင်ခွင့်ကို ကြိုဝယ်ထားတာပါ။\nစရန်ပေးသလိုပဲ: အခု နည်းနည်း ပေး၊ လိုလာတဲ့နေ့မှာ သိပြီးသား ဈေးနဲ့ မြန်မြန် လုပ်နိုင်။\n"
