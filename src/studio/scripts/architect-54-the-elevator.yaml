build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 8154

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: need
    chapter: ဒါရိုက်တာအဖွဲ့ရဲ့ မေးခွန်း
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ team အများကြီးရဲ့ ဆုံးဖြတ်ချက်တွေကို တားမယ့်သူ မလိုဘဲ တစ်သားတည်း ဖြစ်စေတဲ့ principle နဲ့
      technology radar ကို လေ့လာခဲ့ပါတယ်။
      [[mark:open-doc]] ဒီတစ်ခါ ကိုယ့်ကို မေးခွန်း မေးလာတာက team တွေ မဟုတ်ဘဲ၊ ကုမ္ပဏီရဲ့ ဒါရိုက်တာအဖွဲ့ပါ။
      [[mark:sel-question]] CTO ဖြစ်တဲ့ အောင်အောင် က နောက်နှစ် engineering အချိန်ရဲ့ ငါးပုံတစ်ပုံကို architecture
      အလုပ်အတွက် ချန်ထားဖို့ အဆိုပြုထားပါတယ်။ ဒါရိုက်တာအဖွဲ့က အဲဒီ အချိန်တွေနဲ့ feature အသစ်တွေ မလုပ်ဘဲ
      ဘာလို့ architecture မှာ သုံးရမှာလဲလို့ မေးပါတယ်။ မေးသင့်တဲ့ မေးခွန်းပါ။ feature တစ်ခုက ဘာပေးမလဲ ဆိုတာ
      မြင်ရပေမဲ့၊ architecture အလုပ်က ဘာပေးမလဲ ဆိုတာကတော့ မျက်စိနဲ့ မမြင်ရလို့ပါ။
      [[mark:n-diagram]] ကိုယ်က ဖြေဖို့ service တွေ အားလုံး ပါတဲ့ ပုံကြီးကို ပြလိုက်ပါတယ်။ box တွေ၊ မြားတွေ
      အပြည့်ပါ။ တစ်မိနစ်လောက် ကြာတော့ အခန်းထဲက လူတွေ ဖုန်းကို ကြည့်ကုန်ကြပါတယ်။ finance ဘက်က တာဝန်ခံကတော့
      ဒီပုံက ကုမ္ပဏီကို ဘာပေးမှာလဲလို့ ထပ်မေးပါတယ်။
      [[mark:n-wrong]] ပုံက မမှားပါဘူး။ ဒါပေမဲ့ သူတို့ မေးတဲ့ မေးခွန်းကို မဖြေပါဘူး။ ကိုယ် ဘာလွဲသွားလဲ သိဖို့၊
      ဒီ course အစပိုင်းမှာ ဆွဲခဲ့တဲ့ အဆောက်အအုံကို ပြန်ကြည့်ရအောင်။
    sources:
      - {
          title: "The Software Architect Elevator (Hohpe)",
          url: "https://oreil.ly/Software_Architect_Elevator",
        }
    actions:
      - {
          id: open-notebook,
          type: workspace.openFile,
          at: { mark: open-doc },
          path: notebook/54-memo.md,
        }
      - id: sel-question
        type: editor.select
        at: { mark: sel-question }
        target:
          {
            file: notebook/54-memo.md,
            text: "မေးခွန်း: နောက်နှစ် engineering အချိန်ရဲ့ 20 % ကို architecture အလုပ်မှာ ဘာလို့ သုံးမလဲ?",
          }

  - id: building
    chapter: အထပ်တွေကို ဆက်ပေးခြင်း
    narration: >
      [[mark:e-open]] ကုမ္ပဏီ တစ်ခုကို အထပ်တွေ ပါတဲ့ အဆောက်အအုံ တစ်လုံးလို မြင်ကြည့်ခဲ့တာကို မှတ်မိမှာပါ။
      [[mark:e-top]] အပေါ်ဆုံးထပ်မှာ ဒါရိုက်တာအဖွဲ့နဲ့ အောင်အောင် တို့ ရှိပါတယ်။ သူတို့ စဉ်းစားတာက ကုန်ကျစရိတ်၊
      အချိန်၊ ကြီးထွားမှုနဲ့ risk၊ ဆိုလိုတာက မှားသွားရင် ဘယ်လောက် ထိခိုက်မလဲ ဆိုတာပါ။
      [[mark:e-mid]] အလယ်မှာ product manager လှလှ တို့လို၊ ခရီးသည်နဲ့ ကားလိုင်းတွေရဲ့ လိုအပ်ချက်ကို ယူလာပေးတဲ့သူတွေ
      ရှိပါတယ်။
      [[mark:e-bottom]] အောက်ဆုံးက စက်ခန်းမှာတော့ အခု team ၁၂ ခု ရှိနေပါပြီ။ system ကို တကယ် ဆောက်နေတဲ့
      နေရာပါ။
      [[mark:e-filter]] ခုနစ်နှစ်အတွင်း ကြားက အထပ်တွေလည်း များလာပါတယ်။ သတင်း တစ်ခုက အထပ် တစ်ထပ် ဖြတ်တိုင်း
      နည်းနည်းစီ ချောသွားတတ်ပါတယ်။ စက်ခန်းက ဒီအတိုင်း မရတော့ဘူးလို့ ပြောတာက၊ အပေါ်ရောက်တော့ အခက်အခဲ နည်းနည်း
      ရှိတယ် ဖြစ်သွားပါတယ်။ အပေါ်က ဦးတည်ချက်ကလည်း အောက်ရောက်တော့ ဘာကြောင့်လဲ မပါတော့တဲ့ အမိန့် ဖြစ်သွားတတ်ပါတယ်။
      သိတဲ့သူမှာ ဆုံးဖြတ်ခွင့် မရှိ၊ ဆုံးဖြတ်ခွင့် ရှိတဲ့သူက မသိ ဖြစ်လာတာပါ။
      [[mark:e-car]] architect ရဲ့ တန်ဖိုးက အဲဒီ အထပ်တွေကို ဓာတ်လှေကားနဲ့ တိုက်ရိုက် ဆက်ပေးတာမှာ ရှိပါတယ်။
      ဘယ်လောက် မြင့်မြင့် ရောက်လဲ မဟုတ်ဘဲ၊ အထပ် ဘယ်နှထပ်ကို ဆက်ပေးနိုင်လဲ ဆိုတာပါ။
      [[mark:e-down]] အောက်ကို ဆင်းတဲ့အခါ သယ်သွားတာက strategy ပါ။ ဥပမာ ပါဆယ် လုပ်ငန်းကို စမ်းကြည့်မယ်၊
      မအောင်မြင်ရင် ရပ်မယ် ဆိုတဲ့ ဦးတည်ချက်ကို၊ ပါဆယ်ကို လက်မှတ် system နဲ့ ခွဲဆောက်မယ် ဆိုတဲ့ technical
      ဆုံးဖြတ်ချက်အဖြစ် ပြောင်းပေးတာပါ။
      [[mark:e-up]] အပေါ်ကို တက်တဲ့အခါ သယ်သွားတာကတော့ စက်ခန်းက အမှန်ပါ။ ချောမထားဘဲ၊ ဒါပေမဲ့ အပေါ်ထပ်က
      နားလည်တဲ့ စကားနဲ့ပါ။ ဥပမာ တနင်္လာနေ့ ငွေစာရင်း ရှင်းတဲ့ အလုပ်က ကားလိုင်း ၅၀၀ နဲ့တင် တစ်ညလုံး
      ကြာနေပြီ ဆိုတာကို၊ ကားလိုင်းတွေ ထပ်များလာရင် ငွေရတာ နောက်ကျပြီး သူတို့ စိတ်ဆိုးကြမယ်လို့ ပြောပြတာပါ။
      [[mark:e-mistake]] ကိုယ် လွဲသွားတာက ဒီနေရာပါ။ ဓာတ်လှေကားနဲ့ အပေါ်ထပ်အထိ တက်သွားခဲ့ပေမဲ့၊ စက်ခန်းရဲ့
      စကားကို ဘာသာမပြန်ဘဲ ဒီအတိုင်း သယ်သွားမိတာပါ။
    sources:
