    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ architect ရဲ့ တန်ဖိုးက အထပ်တွေကို ဆက်ပေးတာမှာ ရှိပါတယ်။ အပေါ်ထပ်ရဲ့ strategy ကို
      စက်ခန်းအတွက် ဆုံးဖြတ်ချက်အဖြစ် ယူဆင်းပြီး၊ စက်ခန်းက အမှန်ကို အပေါ်ထပ် နားလည်တဲ့ စကားနဲ့ ယူတက်တာပါ။
      [[mark:recap-2]] အပေါ်ထပ်မှာ architecture ကို ပုံနဲ့ မဟုတ်ဘဲ၊ နောက်မှ ဘာလုပ်နိုင်မလဲ၊ ဘယ်လောက် ကုန်မလဲ ဆိုတဲ့
      option အဖြစ် ရှင်းပြရပါတယ်။
      [[mark:next]] နောက် lesson မှာတော့ ပါဆယ် လုပ်ငန်းသစ်အတွက် team တွေကို ဘယ်လို ဖွဲ့မလဲ ဆိုတာကနေ စပြီး၊
