# CSS course (Burmese), lesson 16 of 43: flexbox part 2, sizing flex items.
#
# Narration is Burmese (voice-script.md next to this file; DESIGN.md is the
# span-by-span brief). Every [[mark:…]] sits where its action
# begins, at a sentence end; each span carries one piece of meaning.
# Everything the learner sees (title, chapters, whiteboard labels, UI strings)
# is Burmese already.
#
# Shape: board (recall lesson 15; flex: initial = 0 1 auto decoded; free
# space; the flex shorthand, 1 0 auto) → code tour (five demo rows; empty
# styles.css) → the button row: display flex + gap (flex: initial live), then
# flex: auto (unequal), then flex: 1 (equal) → board (free-space arithmetic,
# auto vs 1; flex: 1 is not flex-grow: 1) → the box row: flex-grow 1 on the
# first box, then 2 and 3 (extras 1:2:3, widths not) → board (six parts; auto
# basis vs zero basis; three-value flex) → flex-basis: 0 (widths exactly
# 1:2:3) → the header strip: display flex squashes the round logo and wraps
# the order button, flex-shrink: 0 on the logo, flex: none on the button →
# the long-word row: flex: 1 is not equal (min-width: auto), min-width: 0
# (equal, word spills), overflow-wrap: anywhere (wraps inside) → the sidebar
# layout: flex + wrap + gap, bases 180px / 260px with grow 1 / 3 (456 > 400
# wraps) → board (narrow vs wide, no screen width written) → the drinks list
# as a flex column, order: -1 on the last card → board (order changes only the
# picture) → quiz (squashed item → flex-shrink) and recap, hand-off to
# alignment (lesson 17).
#
# Live-preview safety (PLATFORM.md §2): styles.css is the only typed file and
# never contains url(, @import or image-set(; no postcss config; no reload.
# Every rule is appended at the END of styles.css (an unclosed "{" typed in
# the middle would swallow the rules after it); only single declarations are
# inserted inside an existing rule. Keystroke-typed values have no misleading
# valid prefix: "flex: a…", "flex: n…", "gap: 8", "overflow-wrap: a…" and
# "order: -" are invalid until complete; "flex: 1", "flex-grow: N",
# "flex-basis: 0", "flex-shrink: 0" and "min-width: 0" are complete at their
# first character. The multi-value bases (1 1 180px passes through "1" and
# "1 1"), the layout rule and the flex column are line-by-line or block.
#
# Measured in headless Chrome at 432 × 720 (probe/stages.ts): buttons
# 53/50/167 → flex auto 91/88/205 → flex 1 128 × 3 (long label on two lines);
# boxes 40/32/34 → grow 1 318/32/34 → 1:2:3 extras 86/124/174 → basis 0
# 64/128/192; header logo 48 → 28 (squashed) → 48, button 70 (wrapped) → 103;
# long-word row 225/80/80 → min-width 0 128 × 3 (word spills, scrollWidth 225)
# → overflow-wrap 128 × 3 contained; layout sidebar 369 / content 200 on two
# lines → bases: both 400 on two lines; order: the last card moves to the top.
#
# Validate with:
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
#   bun scripts/studio-verify-lesson.ts <this file>
