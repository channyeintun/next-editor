  - id: method
    chapter: Scientist လို debug လုပ်ရအောင်
    narration: >
      [[mark:m-h]] နောက်တစ်လမ်းကတော့ scientist တစ်ယောက်လို ကြည့်၊ ခန့်မှန်း၊ စမ်းတဲ့ နည်းပါ။ bug ရဲ့
      အကြောင်းရင်းကို ရှာပြီး ပြင်တာကို debug လုပ်တယ်လို့ ခေါ်ပါတယ်။ [[mark:m1]] ပထမ အဆင့်က reproduce လုပ်တာ၊
      ဆိုလိုတာက user လုပ်ခဲ့တဲ့ အဆင့်၊ ထည့်ခဲ့တဲ့ data၊ သုံးခဲ့တဲ့ ဖုန်းအတိုင်း လိုက်လုပ်ပြီး bug ကို တမင်
      ပြန်ဖြစ်အောင် လုပ်တာပါ။ [[mark:m2]] ပြီးရင် ဘာဖြစ်သင့်လဲ၊ တကယ် ဘာဖြစ်လဲ နှိုင်းယှဉ်ပါတယ်။ [[mark:m3]] တတိယ
      အဆင့်က အရေးအကြီးဆုံးပါ။ မှန်တဲ့ အခြေအနေနဲ့ မှားတဲ့ အခြေအနေကြားမှာ တစ်ကြိမ်ကို တစ်ခုပဲ ပြောင်းကြည့်ပါတယ်။
      နှစ်ခု တစ်ပြိုင်နက် ပြောင်းရင် ဘယ်ဟာကြောင့်လဲ မသိနိုင်တော့လို့ပါ။ [[mark:m4]] ကွာခြားချက်ကို တွေ့ရင်
      ဒါကြောင့် ဖြစ်မယ် ဆိုတဲ့ ခန့်မှန်းချက် ထုတ်ပါတယ်။ [[mark:m5]] ပြီးတော့ ခန့်မှန်းချက် မှန်ရင် ဘာဖြစ်ရမလဲ
      ကြိုပြောပြီး စမ်းပါတယ်။ မကိုက်ရင် တတိယ အဆင့်ကို ပြန်သွားပါတယ်။ [[mark:m-gain]] ခုနက loop နဲ့ မတူတာက၊ တစ်ပတ်
      ပတ်တိုင်း ကိုယ် တစ်ခုခု ပိုသိလာတာပါ။
    sources:
      - {
          title: "Andreas Zeller, The Debugging Book: Introduction to Debugging (the scientific method)",
          url: "https://www.debuggingbook.org/html/Intro_Debugging.html",
        }
      - {
          title: "David A. Wheeler, review of David J. Agans' Debugging: the nine rules (make it fail; change one thing at a time)",
          url: "https://dwheeler.com/essays/debugging-agans.html",
        }
      - {
          title: "The New SDLC (Burmese edition): Where to start (keep foundational debugging sharp)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - { id: draw-s-h, type: whiteboard.apply, at: { mark: m-h }, upsertIds: [s-h], drawMs: 700 }
      - { id: draw-s1, type: whiteboard.apply, at: { mark: m1 }, upsertIds: [s-1], drawMs: 800 }
      - { id: draw-s2, type: whiteboard.apply, at: { mark: m2 }, upsertIds: [s-2], drawMs: 800 }
      - { id: draw-s3, type: whiteboard.apply, at: { mark: m3 }, upsertIds: [s-3], drawMs: 800 }
      - { id: draw-s4, type: whiteboard.apply, at: { mark: m4 }, upsertIds: [s-4], drawMs: 800 }
      - {
          id: draw-s5,
          type: whiteboard.apply,
          at: { mark: m5 },
          upsertIds: [s-5, s-loop],
          drawMs: 1200,
        }
      - {
          id: draw-s-gain,
          type: whiteboard.apply,
          at: { mark: m-gain },
          upsertIds: [s-gain],
          drawMs: 800,
        }

  - id: reproduce
    narration: >
      [[mark:close-p]] ကဲ၊ app မှာ ကိုယ်တိုင် စမ်းကြည့်ရအောင်။ [[mark:ready]] ညာဘက်မှာ ဆိုင်ရဲ့ ကြိုမှာ app
      ရှိပါတယ်။ ဒီ app က agent တစ်ခု ထုတ်ပေးတဲ့ order form ရဲ့ ပထမ version လို့ သဘောထားပြီး lesson အတွက်
      ပြင်ဆင်ထားတာပါ။ [[mark:menu]] ကိုယ် အမြဲ စမ်းနေကျ ပုံစံနဲ့ မောင်မောင် ရဲ့ အော်ဒါကို အရင် ထည့်ကြည့်ပါမယ်။
      လက်ဖက်ရည် က ရွေးပြီးသားပါ။ [[mark:qty]] အရေအတွက်မှာ English ဂဏန်း သုံး ကို ရိုက်ထည့်ပါမယ်။ [[mark:time]]
      လာယူမယ့် အချိန်ကို မနက် ရှစ်နာရီ လို့ ရွေးပါမယ်။ [[mark:name]] နာမည်နေရာမှာ မောင်မောင် လို့ ရိုက်ပါမယ်။
      [[mark:phone]] ဖုန်းကတော့ lesson အတွက် နမူနာ နံပါတ် ထည့်ပါမယ်။ [[mark:order]] ပြီးရင် မှာမယ် ကို
      နှိပ်လိုက်ပါမယ်။ [[mark:card]] အော်ဒါနံပါတ် ၁၀၁၊ လက်ဖက်ရည် သုံးခွက်၊ စုစုပေါင်း ၄၅၀၀ ကျပ် လို့ မှန်မှန်
      ပြပါတယ်။ ကိုယ့်စက်မှာတော့ မမှားပါဘူး။ ဒါပေမဲ့ ဒီ အော်ဒါက မောင်မောင် လုပ်ခဲ့တာနဲ့ တကယ် တူရဲ့လား။
    sources:
      - {
          title: "Mozilla: Bug Writing Guidelines (steps to reproduce)",
          url: "https://bugzilla.mozilla.org/page.cgi?id=bug-writing.html",
        }
    actions:
      - { id: close-board-p, type: whiteboard.apply, at: { mark: close-p }, open: false }
      - {
          id: wait-ready,
          type: runtime.waitForReady,
          at: { mark: ready },
          timeoutMs: 30000,
          retry: { maxAttempts: 2, delayMs: 250 },
        }
      - {
          id: open-preview,
          type: preview.open,
          at: { afterAction: wait-ready },
          timeoutMs: 10000,
          mode: docked,
          retry: { maxAttempts: 2, delayMs: 250 },
        }
      - {
          id: expect-menu,
          type: expect.preview,
          at: { mark: menu },
          timeoutMs: 5000,
          target: { by: testId, value: item },
          textContains: "လက်ဖက်ရည်",
          retry: { maxAttempts: 3, delayMs: 300 },
        }
      - {
          id: in-qty,
          type: preview.input,
          at: { mark: qty },
          timeoutMs: 5000,
          target: { by: testId, value: qty },
          value: "3",
          retry: { maxAttempts: 2, delayMs: 250 },
        }
      - {
          id: in-time,
          type: preview.input,
          at: { mark: time },
          timeoutMs: 5000,
          target: { by: testId, value: pickup },
          value: "08:00",
          retry: { maxAttempts: 2, delayMs: 250 },
        }
      - {
          id: in-name,
          type: preview.input,
          at: { mark: name },
          timeoutMs: 5000,
          target: { by: testId, value: name },
          value: "မောင်မောင်",
          retry: { maxAttempts: 2, delayMs: 250 },
        }
      - {
          id: in-phone,
          type: preview.input,
          at: { mark: phone },
          timeoutMs: 5000,
          target: { by: testId, value: phone },
          value: "09 000 333 444",
          retry: { maxAttempts: 2, delayMs: 250 },
        }
      - {
          id: click-order,
          type: preview.click,
          at: { mark: order },
          timeoutMs: 5000,
          target: { by: testId, value: order },
          retry: { maxAttempts: 1, delayMs: 0 },
        }
      - {
          id: expect-number,
          type: expect.preview,
          at: { mark: card },
          timeoutMs: 5000,
          target: { by: testId, value: result-number },
          textContains: "#101",
          retry: { maxAttempts: 3, delayMs: 300 },
        }
      - {
          id: expect-line,
          type: expect.preview,
          at: { afterAction: expect-number },
          timeoutMs: 5000,
          target: { by: testId, value: result-line },
          textContains: "လက်ဖက်ရည် × 3",
          retry: { maxAttempts: 3, delayMs: 300 },
        }
      - {
          id: expect-total,
          type: expect.preview,
          at: { afterAction: expect-line },
          timeoutMs: 5000,
          target: { by: testId, value: result-total },
          textContains: "4,500 ကျပ်",
          retry: { maxAttempts: 3, delayMs: 300 },
        }
      - {
          id: expect-pickup,
          type: expect.preview,
          at: { afterAction: expect-total },
          timeoutMs: 5000,
          target: { by: testId, value: result-pickup },
          textContains: "08:00",
          retry: { maxAttempts: 3, delayMs: 300 },
        }

  - id: burmese-digit
    narration: >
      မောင်မောင် ကို ပြန်မေးကြည့်တော့၊ ဖုန်းရဲ့ မြန်မာ keyboard နဲ့ မြန်မာဂဏန်း ရိုက်ခဲ့တယ်လို့ ဖြေပါတယ်။ ဒါဆို
      သူ့လိုပဲ လုပ်ကြည့်ရအောင်။ [[mark:qty-mm]] အရေအတွက်ကို မြန်မာဂဏန်း သုံး လို့ ပြောင်းရိုက်ပါမယ်။
      [[mark:order-mm]] ပြီးရင် မှာမယ် ကို ထပ်နှိပ်ပါမယ်။ [[mark:card-mm]] အော်ဒါနံပါတ် ၁၀၂ ရပေမယ့်၊ ခွက်ရေနဲ့
      စုစုပေါင်း နေရာမှာ NaN လို့ ပေါ်နေပါတယ်။ ဒါက not a number၊ ဂဏန်း မဟုတ်ဘူး ဆိုတဲ့ အဓိပ္ပာယ်ပါ။ ဖြစ်သင့်တာက
      ၄၅၀၀ ကျပ်ပါ။ bug ကို ကိုယ့်စက်မှာ ပြန်ဖြစ်အောင် လုပ်နိုင်သွားပါပြီ။
    sources:
      - {
          title: "MDN: NaN (Not-A-Number; a failed number conversion returns NaN)",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/NaN",
        }
      - {
          title: "Mozilla: Bug Writing Guidelines (expected and actual results)",
          url: "https://bugzilla.mozilla.org/page.cgi?id=bug-writing.html",
        }
    actions:
      - {
          id: in-qty-mm,
          type: preview.input,
          at: { mark: qty-mm },
          timeoutMs: 5000,
          target: { by: testId, value: qty },
          value: "၃",
          retry: { maxAttempts: 2, delayMs: 250 },
        }
      - {
          id: click-mm,
          type: preview.click,
          at: { mark: order-mm },
          timeoutMs: 5000,
          target: { by: testId, value: order },
          retry: { maxAttempts: 1, delayMs: 0 },
        }
      - {
          id: expect-nan,
          type: expect.preview,
          at: { mark: card-mm },
          timeoutMs: 5000,
          target: { by: testId, value: result-total },
          textContains: "NaN ကျပ်",
          retry: { maxAttempts: 3, delayMs: 300 },
        }
      - {
          id: expect-line-nan,
          type: expect.preview,
          at: { afterAction: expect-nan },
          timeoutMs: 5000,
          target: { by: testId, value: result-line },
          textContains: "× NaN",
          retry: { maxAttempts: 3, delayMs: 300 },
        }
      - {
          id: expect-number-2,
          type: expect.preview,
          at: { afterAction: expect-line-nan },
          timeoutMs: 5000,
          target: { by: testId, value: result-number },
          textContains: "#102",
          retry: { maxAttempts: 3, delayMs: 300 },
        }

  - id: one-thing
    narration: >
      [[mark:c-open]] အော်ဒါ နှစ်ခုကို နှိုင်းယှဉ်ကြည့်ရအောင်။ [[mark:c-same]] ပစ္စည်း၊ အချိန်၊ နာမည်၊ ဖုန်း
      အားလုံး တူပါတယ်။ [[mark:c-diff]] ကွာတာ တစ်ခုပဲ ရှိပါတယ်၊ ဂဏန်းရဲ့ အမျိုးအစားပါ။ ကွန်ပျူတာ အတွက်တော့ မြန်မာ
      သုံးနဲ့ English သုံးက အဓိပ္ပာယ် တူပေမယ့် သီးခြား စာလုံး နှစ်လုံးပါ။ [[mark:c-guess]] ဒါကြောင့် app က
      မြန်မာဂဏန်းကို ဂဏန်းအဖြစ် ပြောင်းလို့ မရဘူး ဆိုတဲ့ ခန့်မှန်းချက်ကို ထုတ်ပါမယ်။ ဂဏန်း မဟုတ်တာနဲ့ ဈေးနှုန်းကို
      မြှောက်တော့ စုစုပေါင်းပါ ပျက်သွားတာနဲ့လည်း ကိုက်ပါတယ်။ [[mark:c-predict]] ဒီ ခန့်မှန်းချက် မှန်ရင်၊ တခြား
      မြန်မာဂဏန်း၊ ဥပမာ ဆယ် နဲ့လည်း ဒီလိုပဲ ဖြစ်ရပါမယ်။ ဆယ် နဲ့ မှန်နေရင်တော့ ခန့်မှန်းချက် မှားပါတယ်။
    sources:
      - {
          title: "The Unicode Standard 18.0, code chart Myanmar U+1000–U+109F (Digits: MYANMAR DIGIT ZERO–NINE, U+1040–U+1049)",
          url: "https://www.unicode.org/charts/PDF/U1000.pdf",
        }
      - {
          title: "MDN: NaN (a value that is or becomes NaN makes the result NaN)",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/NaN",
        }
      - {
          title: "David A. Wheeler, review of David J. Agans' Debugging (change one thing at a time, compare it with a good one)",
          url: "https://dwheeler.com/essays/debugging-agans.html",
        }
      - {
          title: "Andreas Zeller, The Debugging Book: Introduction to Debugging (hypothesis and prediction)",
          url: "https://www.debuggingbook.org/html/Intro_Debugging.html",
        }
    actions:
      - {
          id: open-board-c,
          type: whiteboard.apply,
          at: { mark: c-open },
          open: true,
          clear: true,
          upsertIds: [c-title, c-h1, c-h2],
          drawMs: 1000,
        }
      - {
          id: draw-c-same,
          type: whiteboard.apply,
          at: { mark: c-same },
          upsertIds: [c-same],
          drawMs: 900,
        }
      - {
          id: draw-c-diff,
          type: whiteboard.apply,
          at: { mark: c-diff },
          upsertIds: [c-l1, c-r1, c-l2, c-r2],
          drawMs: 1600,
        }
      - {
          id: draw-c-guess,
          type: whiteboard.apply,
          at: { mark: c-guess },
          upsertIds: [c-guess],
          drawMs: 1000,
        }
      - {
          id: draw-c-predict,
          type: whiteboard.apply,
          at: { mark: c-predict },
          upsertIds: [c-predict],
          drawMs: 1000,
        }

  - id: test-guess
