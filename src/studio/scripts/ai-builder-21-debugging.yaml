build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 6121
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: Bug report တစ်ခု ရောက်လာပြီ
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ agent ရဲ့ ပြောင်းလဲမှု အကျဉ်းချုပ်ကို checklist နဲ့ review
      လုပ်ခဲ့ပါတယ်။ ဒီနေ့တော့ app မှာ တစ်ခုခု မှားနေတဲ့အခါ အကြောင်းရင်းကို ဘယ်လို ရှာမလဲ ဆိုတာ ကြည့်ပါမယ်။
      [[mark:story]] app ကို စမ်းသုံးနေတဲ့ ကျောင်းသား မောင်မောင် က၊ လက်ဖက်ရည် မှာတော့ စုစုပေါင်း နေရာမှာ ဈေးနှုန်း
      မပေါ်ဘဲ နားမလည်တဲ့ စာလုံး သုံးလုံး ပေါ်နေတယ်လို့ message ပို့လာပါတယ်။ ဒီလို app ရဲ့ မှားနေတဲ့ အပြုအမူကို bug
      လို့ ခေါ်ပါတယ်။ [[mark:p-title]] အမြန်ဆုံး လမ်းကတော့ ဒီ message ကို agent ဆီ ကူးထည့်ပြီး ပြင်ခိုင်းတာပါ။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The economics of AI development",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: start-runtime,
          type: runtime.start,
          at: { mark: start },
          timeoutMs: 60000,
          retry: { maxAttempts: 2, delayMs: 500 },
        }
      - {
          id: open-board-p,
          type: whiteboard.apply,
          at: { mark: p-title },
          open: true,
          clear: true,
          upsertIds: [p-h, p-1-box, p-1],
          drawMs: 1300,
        }

  - id: paste-loop
    narration: >
      [[mark:p-guess]] agent က အကြောင်းရင်းကို တကယ် မသိဘဲ၊ ဖြစ်နိုင်လောက်တာ တစ်ခုကို ခန့်မှန်းပြီး code ကို
      ပြင်ပေးပါလိမ့်မယ်။ [[mark:p-again]] ပြဿနာ မပျောက်ရင်၊ ဒါမှမဟုတ် အသစ် တစ်ခု ပေါ်လာရင် အဲဒါကို ထပ်ကူး၊
      ထပ်ခိုင်းရင်း loop ထဲမှာ ပတ်နေတတ်ပါတယ်။ [[mark:p-cost]] ခိုင်းတိုင်း အချိန်ရော ပိုက်ဆံပါ ကုန်ပါတယ်။
      ခန့်မှန်းပြီး ပြင်တိုင်း မှန်နေတဲ့ နေရာတွေကိုပါ ပြောင်းသွားနိုင်လို့၊ bug တစ်ခုက နှစ်ခု ဖြစ်လာတတ်ပါသေးတယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The economics of AI development (prompting loops)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "The New SDLC (Burmese edition): The vibe coding to agentic engineering spectrum (error handling)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
