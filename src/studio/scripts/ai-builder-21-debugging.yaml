      [[mark:close-c]] app မှာ စမ်းကြည့်ရအောင်။ [[mark:qty-ten]] အရေအတွက်ကို မြန်မာဂဏန်း ဆယ် လို့
      ပြောင်းရိုက်ပါမယ်။ [[mark:order-ten]] ပြီးရင် မှာမယ် ကို နှိပ်ပါမယ်။ [[mark:card-ten]] အော်ဒါနံပါတ် ၁၀၃
      မှာလည်း စုစုပေါင်းက ဂဏန်း မဟုတ်ပါဘူး။ ကြိုပြောထားတဲ့ အတိုင်း ဖြစ်လို့ ခန့်မှန်းချက်ကို ပိုယုံလို့ ရလာပါပြီ။
      code တစ်ကြောင်းမှ မဖတ်ဘဲ bug ဖြစ်တဲ့ နယ်နိမိတ်ကို တိတိကျကျ သိသွားပါပြီ။
    sources:
