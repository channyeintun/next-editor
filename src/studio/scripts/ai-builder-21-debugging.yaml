        .top h1 {
          margin: 0 0 8px;
          font-size: 20px;
          line-height: 1.5;
        }

        .card {
          background: #fff;
          border: 1px solid var(--line);
          border-radius: 12px;
          padding: 12px;
          margin-bottom: 10px;
        }

        label {
          display: block;
          margin-bottom: 8px;
          font-weight: 600;
        }

        input,
        select {
          display: block;
          width: 100%;
          margin-top: 2px;
          padding: 6px 10px;
          border: 1px solid var(--line);
          border-radius: 8px;
          font: inherit;
          font-weight: 400;
        }

        button {
          width: 100%;
          padding: 8px;
          border: 0;
          border-radius: 8px;
          background: var(--accent);
          color: #fff;
          font: inherit;
          font-weight: 700;
        }

        .result p {
          margin: 0 0 2px;
        }

        .result .ok {
          font-weight: 700;
          color: #2f7d32;
        }

        .result .total {
          font-size: 18px;
          font-weight: 700;
        }

        .result .hint {
          color: var(--muted);
          font-size: 14px;
        }
