          retry: { maxAttempts: 3, delayMs: 300 },
        }

  - id: report
    chapter: Bug report ရေးရအောင်
    narration: >
      [[mark:open-bugs]] ကဲ၊ တွေ့ခဲ့တာတွေကို bug report အဖြစ် ရေးရအောင်။ bug report ဆိုတာ ကိုယ် မရှိလည်း တခြားသူ
      ဒါမှမဟုတ် agent က bug ကို ပြန်ဖြစ်အောင် လုပ်နိုင်လောက်တဲ့ အစီရင်ခံစာပါ။ [[mark:type-bug]] ထိပ်ဆုံးက
      စာကြောင်းက သုည ခွက်နဲ့ ဆိုင်ပိတ်ချိန် bug နှစ်ခုကို နံပါတ် တစ်နဲ့ နှစ် ပေးပြီး test plan ဆီ ညွှန်ထားလို့၊ ဒီ bug က နံပါတ် သုံးပါ။
      ခေါင်းစဉ်ကို တစ်ချက်ကြည့်ရုံနဲ့ ဘာလုပ်ရင် ဘာဖြစ်လဲ သိရပြီး၊ ပြင်နည်းကိုတော့ မထည့်ပါဘူး။
      [[mark:type-steps]] နောက်တစ်ပိုင်းက bug ကို ပြန်ဖြစ်စေတဲ့ အဆင့် သုံးဆင့်ပါ။ ခုနက နှိုင်းယှဉ်ချက်အရ မဆိုင်တဲ့
      အချိန်၊ နာမည်၊ ဖုန်းကို ချန်ထားပါတယ်။ [[mark:sel-step2]] ဒီ အဆင့်မှာ ဂဏန်း တစ်ခု လို့ မရေးဘဲ မြန်မာဂဏန်း
      သုံး လို့ အတိအကျ ရေးထားတာ သတိထား ကြည့်ပါ။ English ဂဏန်းနဲ့ လိုက်လုပ်ရင် bug မပေါ်လို့ပါ။
    sources:
      - {
          title: "Mozilla: Bug Writing Guidelines (summary, steps to reproduce)",
          url: "https://bugzilla.mozilla.org/page.cgi?id=bug-writing.html",
        }
    actions:
      - { id: open-bugs, type: workspace.openFile, at: { mark: open-bugs }, path: docs/bugs.md }
      - id: type-bug
        type: editor.type
        at: { mark: type-bug }
        target: { file: docs/bugs.md, after: "# Bugs\n\n", occurrence: 1 }
        text: "BUG-1 (အရေအတွက် 0) နဲ့ BUG-2 (ဆိုင်ပိတ်ချိန်) — test-plan.md ရဲ့ TC-2 နဲ့ TC-3 မှာ ရေးပြီးသား။\n\n## BUG-3 · မြန်မာဂဏန်းနဲ့ ရိုက်ရင် စုစုပေါင်း NaN ပေါ်တယ်\nReported by — ကျောင်းသား မောင်မောင်\n"
        cadence: line-by-line
      - id: type-steps
        type: editor.type
        at: { mark: type-steps }
        target: { file: docs/bugs.md, after: "Reported by — ကျောင်းသား မောင်မောင်\n", occurrence: 1 }
        text: "Steps\n1. လက်ဖက်ရည် ကို ရွေး\n2. အရေအတွက်မှာ မြန်မာဂဏန်း ၃ ရိုက်\n3. မှာမယ် ကို နှိပ်\n"
        cadence: line-by-line
      - {
          id: sel-step2,
          type: editor.select,
          at: { mark: sel-step2 },
          target: { file: docs/bugs.md, text: "2. အရေအတွက်မှာ မြန်မာဂဏန်း ၃ ရိုက်", occurrence: 1 },
        }

  - id: report-2
    narration: >
      [[mark:type-expect]] ပြီးတော့ ဖြစ်သင့်တာနဲ့ တကယ် ဖြစ်တာကို ခွဲရေးပါတယ်။ ဒါမှ ဖတ်တဲ့သူက ဘာက မှန်လဲ
      ခန့်မှန်းစရာ မလိုဘဲ၊ ပြင်ပြီးရင် ဘာကို စစ်ရမလဲ ဆိုတာပါ ရှင်းပါတယ်။ [[mark:type-env]] နောက်ဆုံး အပိုင်းမှာ
      ဘယ်လောက် ခဏခဏ ဖြစ်လဲ၊ ဘယ်လို ပတ်ဝန်းကျင်မှာ ဖြစ်လဲ၊ ဘယ် requirement ကို ချိုးဖောက်လဲ ဆိုတာ ပါပါတယ်။
      [[mark:sel-always]] ဒီ စာကြောင်းက ခုနက စမ်းသပ်ချက် သုံးခုရဲ့ ရလဒ်ပါ။ တစ်ခါတလေမှ ဖြစ်တဲ့ bug ကို ရှာရတာ
      အများကြီး ပိုခက်လို့ အမြဲ ဖြစ်တယ် ဆိုတာ သိထားရတာ အရေးကြီးပါတယ်။ [[mark:sel-env]] မြန်မာ keyboard ဆိုတဲ့
      ပတ်ဝန်းကျင်ကလည်း ကိုယ့်စက်မှာ ဘာကြောင့် မတွေ့ခဲ့လဲ ဆိုတာကို ရှင်းပြပါတယ်။
    sources:
      - {
          title: "Mozilla: Bug Writing Guidelines (expected and actual results, reproducibility, platform)",
          url: "https://bugzilla.mozilla.org/page.cgi?id=bug-writing.html",
        }
    actions:
      - id: type-expect
        type: editor.type
        at: { mark: type-expect }
        target: { file: docs/bugs.md, after: "3. မှာမယ် ကို နှိပ်\n", occurrence: 1 }
        text: "Expected — လက်ဖက်ရည် × 3၊ စုစုပေါင်း 4,500 ကျပ်\nActual — လက်ဖက်ရည် × NaN၊ စုစုပေါင်း NaN ကျပ်\n"
        cadence: line-by-line
      - id: type-env
        type: editor.type
        at: { mark: type-env }
        target:
          { file: docs/bugs.md, after: "Actual — လက်ဖက်ရည် × NaN၊ စုစုပေါင်း NaN ကျပ်\n", occurrence: 1 }
        text: "Always? — ဟုတ်တယ်၊ မြန်မာဂဏန်း တိုင်းမှာ (၃၊ ၁၀)။ English ဂဏန်း 3 နဲ့ဆို မှန်တယ်။\nEnvironment — ဖုန်းရဲ့ မြန်မာ keyboard\nBreaks — requirements.md Non-functional (မြန်မာဂဏန်း)၊ AC မရှိသေးလို့ AC-6 ထည့်မယ်\n"
        cadence: line-by-line
      - {
          id: expect-bugs,
          type: expect.file,
          at: { afterAction: type-env },
          path: docs/bugs.md,
          contains: "2. အရေအတွက်မှာ မြန်မာဂဏန်း ၃ ရိုက်",
        }
      - {
          id: sel-always,
          type: editor.select,
          at: { mark: sel-always },
          target:
            {
              file: docs/bugs.md,
              text: "Always? — ဟုတ်တယ်၊ မြန်မာဂဏန်း တိုင်းမှာ (၃၊ ၁၀)။ English ဂဏန်း 3 နဲ့ဆို မှန်တယ်။",
              occurrence: 1,
            },
        }
      - {
          id: sel-env,
          type: editor.select,
          at: { mark: sel-env },
          target: { file: docs/bugs.md, text: "Environment — ဖုန်းရဲ့ မြန်မာ keyboard", occurrence: 1 },
        }

  - id: trace
    chapter: ဘာကြောင့် ဘယ်သူမှ မမိခဲ့တာလဲ
    narration: >
      [[mark:t-open]] ဒါပေမဲ့ test plan နဲ့လည်း စစ်ခဲ့၊ review လည်း လုပ်ခဲ့ရဲ့သားနဲ့ ဒီ bug ကို ဘာကြောင့် ဘယ်သူမှ
      မမိခဲ့တာလဲ။ [[mark:t-req]] requirement စာမျက်နှာမှာ မြန်မာဂဏန်း အကြောင်း ရေးထားပြီးသားပါ။ [[mark:t-gap]]
      ဒါပေမဲ့ edge case စာရင်းမှာ မပါသလို၊ သူ့အတွက် AC လည်း တစ်ခုမှ မရှိခဲ့ပါဘူး။ [[mark:t-test]] test case တွေကို
      AC ကနေ ရေးခဲ့ပြီး၊ agent ကိုလည်း AC တွေ pass ရင် ပြီးပြီလို့ သတ်မှတ်ထားလို့၊ AC မရှိတဲ့ requirement ကို
      ဘယ်သူမှ မစစ်ခဲ့ပါဘူး။ [[mark:t-link]] requirement တစ်ခုက စစ်လို့ရတဲ့ AC နဲ့ ချိတ်ထားမှ test အထိ ရောက်ပါတယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The new SDLC (requirements; testing and quality assurance)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: open-board-t,
          type: whiteboard.apply,
          at: { mark: t-open },
          open: true,
          clear: true,
          upsertIds: [t-title],
        }
      - {
          id: draw-t-req,
          type: whiteboard.apply,
          at: { mark: t-req },
          upsertIds: [t-1, t-1s],
          drawMs: 1000,
        }
      - {
          id: draw-t-gap,
          type: whiteboard.apply,
          at: { mark: t-gap },
          upsertIds: [t-a1, t-2, t-2s, t-a2, t-3, t-3s],
          drawMs: 2000,
        }
      - {
          id: draw-t-test,
          type: whiteboard.apply,
          at: { mark: t-test },
          upsertIds: [t-a3, t-4, t-4s],
          drawMs: 1200,
        }
      - {
          id: draw-t-fix,
          type: whiteboard.apply,
          at: { mark: t-link },
          upsertIds: [t-fix],
          drawMs: 1000,
        }

  - id: fill-gap
    narration: >
      [[mark:close-t]] အဲဒီ ကွက်လပ်ကို ဖြည့်ရအောင်။ [[mark:sel-req]] requirement ဖိုင်ထဲက ဒီ စာကြောင်းက ခုနက
      ပြောတဲ့ မြန်မာဂဏန်း requirement ပါ။ [[mark:type-edge]] edge case စာရင်းထဲမှာ အရေအတွက်ကို မြန်မာဂဏန်းနဲ့
      ရိုက်တဲ့ အခြေအနေကို ထည့်ပါမယ်။ [[mark:open-spec]] spec ဖိုင်မှာတော့ AC တွေရဲ့ အောက်ဆုံးမှာ AC အသစ်
      ထည့်ပါမယ်။ [[mark:type-ac6]] AC ခြောက် က bug report ထဲက အော်ဒါကိုပဲ ပြီးပြီ ဆိုတဲ့ စံ အဖြစ်
      ပြောင်းရေးထားတာပါ။ AC ရှိမှ test plan ရော agent ရဲ့ test ပါ ဒါကို စစ်ပါလိမ့်မယ်။ [[mark:open-plan]] test
      plan မှာလည်း AC ခြောက် အတွက် case အသစ် တစ်ခု ထည့်ပါမယ်။ [[mark:type-tc6]] ရလဒ်ကတော့ အခုလောလောဆယ်
      မအောင်သေးလို့ BUG သုံး ကို ညွှန်ထားပါတယ်။ bug ပြင်ပြီးမှ ဒီ case ကို ပြန်စမ်းပြီး ရလဒ် အသစ်ကို ရေးရမှာပါ။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The new SDLC (testing and quality assurance)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "The New SDLC (Burmese edition): Where to start (tests before generating code)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - { id: close-board-t, type: whiteboard.apply, at: { mark: close-t }, open: false }
      - {
          id: open-req,
          type: workspace.openFile,
          at: { afterAction: close-board-t },
          path: docs/requirements.md,
        }
      - {
          id: sel-req,
          type: editor.select,
          at: { mark: sel-req },
          target:
            {
              file: docs/requirements.md,
              text: "- မြန်မာစာ မှန်မှန် ပေါ်ရမယ်။ မြန်မာဂဏန်းနဲ့ ရိုက်ရင်လည်း လက်ခံရမယ်။",
              occurrence: 1,
            },
        }
      - id: type-edge
        type: editor.type
        at: { mark: type-edge }
        target:
          { file: docs/requirements.md, after: "- မှာမယ် ကို နှစ်ခါ နှိပ် → အော်ဒါ တစ်ခုပဲ\n", occurrence: 1 }
        text: "- အရေအတွက်ကို မြန်မာဂဏန်းနဲ့ ရိုက် (၃) → 3 လိုပဲ တွက်\n"
        cadence: line-by-line
      - {
          id: expect-req,
          type: expect.file,
          at: { afterAction: type-edge },
          path: docs/requirements.md,
          contains: "- အရေအတွက်ကို မြန်မာဂဏန်းနဲ့ ရိုက် (၃) → 3 လိုပဲ တွက်",
        }
      - { id: open-spec, type: workspace.openFile, at: { mark: open-spec }, path: docs/spec.md }
      - id: type-ac6
        type: editor.type
        at: { mark: type-ac6 }
        target:
          { file: docs/spec.md, after: "     Then အော်ဒါကို လာယူချိန်အလိုက် စီပြီး မြင်ရမယ်\n", occurrence: 1 }
        text: "AC-6 Given အရေအတွက်ကို မြန်မာဂဏန်း ၃ နဲ့ ရိုက်ထားတယ်\n     When မှာမယ် ကို နှိပ်တယ်\n     Then 3 လို့ တွက်ပြီး စုစုပေါင်း 4,500 ကျပ်ကို မြင်ရမယ်\n"
        cadence: line-by-line
      - {
          id: expect-spec,
          type: expect.file,
          at: { afterAction: type-ac6 },
          path: docs/spec.md,
          contains: "AC-6 Given အရေအတွက်ကို မြန်မာဂဏန်း ၃ နဲ့ ရိုက်ထားတယ်",
        }
      - {
          id: open-plan,
          type: workspace.openFile,
          at: { mark: open-plan },
          path: docs/test-plan.md,
        }
      - id: type-tc6
        type: editor.type
        at: { mark: type-tc6 }
        target:
          { file: docs/test-plan.md, after: "- ရလဒ် — ⏸ မဆောက်ရသေးဘူး (Task 03)\n", occurrence: 1 }
        text: "\n## TC-6 · မြန်မာဂဏန်း (AC-6)\n- လုပ်ရမှာ — TC-1 အတိုင်း၊ အရေအတွက်ကိုပဲ မြန်မာဂဏန်း ၃\n- မျှော်လင့်ချက် — လက်ဖက်ရည် × 3၊ 4,500 ကျပ်\n- ရလဒ် — ❌ NaN ကျပ်နဲ့ လက်ခံသွားတယ် (BUG-3)\n"
        cadence: line-by-line
      - {
          id: expect-plan,
          type: expect.file,
          at: { afterAction: type-tc6 },
          path: docs/test-plan.md,
          contains: "## TC-6 · မြန်မာဂဏန်း (AC-6)",
        }

  - id: rule
    narration: >
      [[mark:open-agents]] ဒါပေမဲ့ AC ခြောက် က အရေအတွက် နေရာကိုပဲ စစ်ပါတယ်။ ဖုန်းနံပါတ်လို တခြား ဂဏန်း နေရာတွေမှာ
      ဒီ အမှားမျိုး ထပ်ဖြစ်နိုင်ပါသေးတယ်။ [[mark:type-rule]] ဒါကြောင့် AGENTS.md ရဲ့ rule စာရင်း အဆုံးမှာ၊ ဂဏန်း
      ရိုက်ရတဲ့ နေရာတိုင်းအတွက် rule တစ်ကြောင်း ထည့်ပါမယ်။ agent က အလုပ် စတိုင်း ဒီ ဖိုင်ကို ဖတ်လို့၊ နောက် form
      တွေမှာပါ ဒီ အမှား ထပ်မဖြစ်ဖို့ ညွှန်ထားတာပါ။ bug တစ်ခု ပြင်တိုင်း AC တစ်ခု၊ rule တစ်ခု ကျန်ခဲ့ရင် project က
      တဖြည်းဖြည်း ပိုခိုင်လာပါတယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): Where to start (add a rule each time the agent does something it should not)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - { id: open-agents, type: workspace.openFile, at: { mark: open-agents }, path: AGENTS.md }
      - id: type-rule
        type: editor.type
        at: { mark: type-rule }
        target:
          {
            file: AGENTS.md,
            after: "- One task at a time. Keep each change small.\n",
            occurrence: 1,
          }
        text: "- Accept Burmese digits (၀–၉) wherever a number is typed.\n"
        cadence: line-by-line
      - {
          id: expect-agents,
          type: expect.file,
          at: { afterAction: type-rule },
          path: AGENTS.md,
          contains: "- Accept Burmese digits (၀–၉) wherever a number is typed.",
        }

  - id: handoff
    narration: >
      [[mark:h-open]] အခုမှ agent ကို ပြင်ခိုင်းပါမယ်။ [[mark:h-give]] message ကို ကူးထည့်မယ့် အစား၊ bug report
      နဲ့ အဲဒီ bug ချိုးဖောက်နေတဲ့ AC ခြောက် ကို ပေးပါမယ်။ [[mark:h-test]] ပြီးတော့ မပြင်ခင် AC ခြောက် ကို အလိုလို
      စစ်ပေးမယ့် test တစ်ခု အရင် ရေးပြီး၊ အခု app မှာ မအောင်ဘဲ fail ဖြစ်တာကို ပြခိုင်းပါမယ်။ fail မဖြစ်ဖူးတဲ့ test
      က bug ကို တကယ် ဖမ်းနိုင်လား မသေချာလို့ပါ။ [[mark:h-fix]] ပြင်ပြီးရင် အဲဒီ test pass ဖြစ်ရပါမယ်။
      [[mark:h-me]] နောက်ဆုံး ကိုယ်တိုင် app မှာ မြန်မာဂဏန်းနဲ့ ပြန်မှာကြည့်ပြီး၊ တခြား နေရာ မပျက်ဘူးလား သိအောင်
      test plan တစ်ခုလုံးကို ပြန်စစ်ပါမယ်။ အကြောင်းရင်း သိပြီးမှ ခိုင်းတော့ တစ်ခါတည်းနဲ့ မှန်ဖို့ အခွင့်အလမ်း
      ပိုများပါတယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): Where to start (write tests before generating code)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "The New SDLC (Burmese edition): The economics of AI development (first-pass success vs prompting loops)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: open-board-h,
          type: whiteboard.apply,
          at: { mark: h-open },
          open: true,
          clear: true,
          upsertIds: [h-title],
        }
      - {
          id: draw-h-give,
          type: whiteboard.apply,
          at: { mark: h-give },
          upsertIds: [h-g1, h-g2, h-arrow],
          drawMs: 1300,
        }
      - {
          id: draw-h-test,
          type: whiteboard.apply,
          at: { mark: h-test },
          upsertIds: [h-box, h-1],
          drawMs: 1200,
        }
      - {
          id: draw-h-fix,
          type: whiteboard.apply,
          at: { mark: h-fix },
          upsertIds: [h-2, h-3],
          drawMs: 1000,
        }
      - {
          id: draw-h-me,
          type: whiteboard.apply,
          at: { mark: h-me },
          upsertIds: [h-me, h-me2],
          drawMs: 1200,
        }

  - id: quiz
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ မောင်မောင် က စုစုပေါင်း မှားနေတဲ့ screen ကို screenshot ရိုက်ပြီး
      ပို့ထားတယ် ဆိုပါစို့။ bug report မှာ တစ်ခုပဲ ထည့်ခွင့် ရှိရင်၊ screenshot ကို ထည့်မလား၊ မြန်မာဂဏန်း သုံး
      ပါတဲ့ အဆင့်တွေကို ထည့်မလား။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] အဖြေကတော့
      အဆင့်တွေပါ။ ဘာကြောင့်လဲဆိုတော့ screenshot က မှားနေတဲ့ ရလဒ်ကို ပြပေမယ့်၊ အဲဒီ ရလဒ်ဆီ ဘယ်လို ရောက်လာလဲ
      မပြလို့ပါ။ အဆင့်တွေ ရှိမှ ဘယ်သူမဆို bug ကို ပြန်ဖြစ်အောင် လုပ်ပြီး၊ ပြင်ပြီးရင် ပြန်စစ်လို့ ရပါတယ်။
      screenshot ကိုတော့ အထောက်အထား အဖြစ် ထပ်တွဲလို့ ရပါတယ်။
    sources:
      - {
          title: "Mozilla: Bug Writing Guidelines (steps to reproduce are the most important part)",
          url: "https://bugzilla.mozilla.org/page.cgi?id=bug-writing.html",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          clear: true,
          upsertIds: [z-title, z-q, z-o1, z-o2],
          drawMs: 2000,
        }
      - {
          id: draw-quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [z-a, z-note],
          drawMs: 1400,
        }

  - id: recap
    chapter: ပြန်ချုပ်ရရင်
    narration: >
      [[mark:close-quiz]] ဒါဆို ပြန်ချုပ်ရရင်၊ bug တစ်ခု ကြားရင် agent ဆီ ချက်ချင်း မပို့ဘဲ၊ အရင်ဆုံး ကိုယ်တိုင်
      reproduce လုပ်ပါ။ [[mark:sel-r-step]] ပြန်လုပ်လို့ရတဲ့ အဆင့်တွေက bug report ရဲ့ အဓိကပါ။
      [[mark:sel-r-always]] တစ်ကြိမ်ကို တစ်ခုပဲ ပြောင်းပြီး နယ်နိမိတ်ကို ရှာပါ၊ ခန့်မှန်းချက်ကိုလည်း စမ်းကြည့်ပါ။
      [[mark:sel-r-breaks]] AC မရှိတဲ့ requirement ကို တွေ့ရင် AC ထည့်ပါ။ agent ကိုတော့ report နဲ့ AC ကို ပေးပြီး
      fail ဖြစ်တဲ့ test ကနေ စခိုင်းပါ။ နောက် lesson မှာတော့ feature ကိုယ်တိုင်က AI ဖြစ်နေရင်၊ အဖြေ တစ်ခုတည်းကို
      စစ်တဲ့ test တွေ ဘာကြောင့် မလုံလောက်တော့လဲ ဆိုတာနဲ့ eval ကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "Andreas Zeller, The Debugging Book: Introduction to Debugging",
          url: "https://www.debuggingbook.org/html/Intro_Debugging.html",
        }
      - {
          title: "The New SDLC (Burmese edition): The vibe coding to agentic engineering spectrum (tests and evals)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: close-quiz }, open: false }
      - {
          id: open-bugs-2,
          type: workspace.openFile,
          at: { afterAction: close-quiz },
          path: docs/bugs.md,
        }
      - {
          id: sel-r-step,
          type: editor.select,
          at: { mark: sel-r-step },
          target: { file: docs/bugs.md, text: "2. အရေအတွက်မှာ မြန်မာဂဏန်း ၃ ရိုက်", occurrence: 1 },
        }
      - {
          id: sel-r-always,
          type: editor.select,
          at: { mark: sel-r-always },
          target:
            {
              file: docs/bugs.md,
              text: "ဟုတ်တယ်၊ မြန်မာဂဏန်း တိုင်းမှာ (၃၊ ၁၀)။ English ဂဏန်း 3 နဲ့ဆို မှန်တယ်။",
              occurrence: 1,
            },
        }
      - {
          id: sel-r-breaks,
          type: editor.select,
          at: { mark: sel-r-breaks },
          target:
            {
              file: docs/bugs.md,
              text: "Breaks — requirements.md Non-functional (မြန်မာဂဏန်း)၊ AC မရှိသေးလို့ AC-6 ထည့်မယ်",
              occurrence: 1,
            },
        }
checks:
  - { type: timing.p95Ms, max: 300 }
