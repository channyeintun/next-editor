        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-fee-call
        type: expect.preview
        at: { afterAction: expect-two-errors }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Property 'phone' is missing in type 'Address' but required in type"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-rider-call
        type: expect.preview
        at: { afterAction: expect-fee-call }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-2 }
        textContains: "Property 'phone' is missing in type 'Address' but required in type"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-fee-output
        type: expect.preview
        at: { afterAction: expect-rider-call }
