build:
  # Studio replaces this built-in profile at render time with the Burmese provider chosen in the
  # render console (AthanLab with the user's own key, or VoxCPM2 when that feature is enabled).
  voiceProfile: pocket-alba-v1
  seed: 3121
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "Function ကနေ type ထုတ်ယူ"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ key of ရယ်၊ type of ရယ်၊ indexed access ရယ်ကို သုံးပြီး၊
      object တွေနဲ့ တန်ဖိုးတွေကနေ type ကို ထုတ်ယူခဲ့ပါတယ်။ ဒီ lesson မှာတော့ function တစ်ခုကနေ type
      ထုတ်ယူပုံနဲ့၊ union type တွေကို ပြောင်းပေးတဲ့ utility type တွေကို ကြည့်သွားပါမယ်။
      [[mark:draw-lib]] ဆိုင်က အော်ဒါတွေကို အိမ်အရောက် ပို့ဖို့၊ ပို့ဆောင်ရေး ကုမ္ပဏီ တစ်ခုရဲ့ library
      ကို သုံးတယ် ဆိုပါစို့။ အဲဒီ library မှာ ပို့ခ တွက်တဲ့ function နဲ့ ပို့ဆောင်သူကို ခေါ်တဲ့ function
      ပါပါတယ်။ [[mark:draw-no-types]] ပြဿနာက function တွေကိုပဲ export လုပ်ပြီး၊ လိပ်စာ ပုံစံ၊ ရလဒ် ပုံစံ
      ဆိုတဲ့ type တွေကိုတော့ export မလုပ်ထားတာပါ။ library တွေမှာ ဒီလို မကြာခဏ ကြုံရလို့၊ အဲဒီ
      ပုံစံတွေကို လက်နဲ့ ကူးရေးလိုက်ချင်စိတ် ပေါ်လာပါတယ်။ [[mark:draw-derive]] ဒါပေမဲ့ TypeScript မှာ
      function ရဲ့ parameter တွေကို ထုတ်ပေးတဲ့ Parameters ရယ်၊ ပြန်ပေးတဲ့ type ကို ထုတ်ပေးတဲ့ ReturnType
      ရယ်၊ Promise ထဲက type ကို ထုတ်ပေးတဲ့ Awaited ရယ် ဆိုတဲ့ utility type တွေ ပါပြီးသားပါ။
      [[mark:draw-follow]] ဒါတွေနဲ့ ထုတ်ယူထားရင်၊ library က ပုံစံ ပြောင်းတဲ့အခါ ကိုယ့် type တွေလည်း
      အလိုလို လိုက်ပြောင်းသွားပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 10: Deriving Types (deriving types from functions)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/deriving-types",
        }
      - {
          title: "TypeScript Handbook: Utility Types",
          url: "https://www.typescriptlang.org/docs/handbook/utility-types.html",
        }
    actions:
      - id: open-board-a
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-lib
        type: whiteboard.apply
        at: { mark: draw-lib }
        upsertIds: [a-lib-box, a-lib-label, a-fn-fee, a-fn-rider]
        drawMs: 2400
      - id: draw-no-types
        type: whiteboard.apply
        at: { mark: draw-no-types }
        upsertIds: [a-no-types]
        drawMs: 1400
      - id: draw-derive
        type: whiteboard.apply
        at: { mark: draw-derive }
        upsertIds: [a-arrow-1, a-params, a-arrow-2, a-return, a-arrow-3, a-awaited]
        drawMs: 4200
      - id: draw-follow
        type: whiteboard.apply
        at: { mark: draw-follow }
        upsertIds: [a-follow]
        drawMs: 1500

  - id: starter
    narration: >
      [[mark:close-board]] ဒီနေ့ code ကို ကြည့်ရအောင်။ [[mark:open-delivery]] ဒါက ပို့ဆောင်ရေး library
      ပါ။ တခြား အဖွဲ့ ရေးထားတဲ့ package တစ်ခုလို့ သဘောထားပါ။ [[mark:select-address-param]] ပို့ခ တွက်တဲ့
      function က မြို့နယ်၊ လမ်းနဲ့ ဖုန်းနံပါတ် ပါတဲ့ လိပ်စာ တစ်ခုကို ယူပါတယ်။ [[mark:select-express]]
      ဒုတိယ parameter ကတော့ အမြန် ပို့မလား ဆိုတာ ဖြစ်ပြီး၊ default တန်ဖိုး ရှိလို့ မထည့်လည်း ရပါတယ်။
      [[mark:select-fee-return]] ပြီးတော့ ပို့ခနဲ့ ကြာမယ့် မိနစ်ကို object တစ်ခုနဲ့ ပြန်ပေးပါတယ်။
      [[mark:select-book-rider]] အောက်က async function ကတော့ ပို့ဆောင်သူကို ခေါ်ပြီး၊ သူ့ နာမည်၊
      ရောက်မယ့် မိနစ်နဲ့ ဖုန်းဆက်ရမယ့် နံပါတ်ကို ပြန်ပေးပါတယ်။ [[mark:open-main]] main ဖိုင်ကို
      ကြည့်ရအောင်။ [[mark:select-copied]] ဒီ type က library ထဲက လိပ်စာ ပုံစံကို ကိုယ်တိုင် ကူးရေးထားတာ
      ဖြစ်ပြီး၊ မြို့နယ်နဲ့ လမ်းပဲ ပါပါတယ်။ [[mark:select-calls]] အောက်မှာ အိမ်လိပ်စာကို ဒီ type နဲ့
      ရေးပြီး၊ ပို့ခ တွက်တာ၊ ပို့ဆောင်သူ ခေါ်တာတွေကို လုပ်ပါတယ်။
    sources:
      - {
          title: "TypeScript Handbook: More on Functions (optional and default parameters)",
          url: "https://www.typescriptlang.org/docs/handbook/2/functions.html#optional-parameters",
        }
      - {
          title: "MDN: async function",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/async_function",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: open-delivery
        type: workspace.openFile
        at: { mark: open-delivery }
        path: src/delivery.ts
      - id: select-address-param
        type: editor.select
        at: { mark: select-address-param }
        target:
          {
            file: src/delivery.ts,
            text: "address: { township: string; street: string; phone: string }",
            occurrence: 1,
          }
      - id: select-express
        type: editor.select
        at: { mark: select-express }
        target: { file: src/delivery.ts, text: "express = false", occurrence: 1 }
      - id: select-fee-return
        type: editor.select
        at: { mark: select-fee-return }
        target:
          {
            file: src/delivery.ts,
            text: "return { fee: express ? 3000 : 1500, minutes: express ? 20 : 45 };",
            occurrence: 1,
          }
      - id: select-book-rider
        type: editor.select
        at: { mark: select-book-rider }
        target:
          {
            file: src/delivery.ts,
            text: 'return { rider: "မောင်မောင်", minutes: 15, callTo: address.phone };',
            occurrence: 1,
          }
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: src/main.ts
      - id: select-copied
        type: editor.select
        at: { mark: select-copied }
        target:
          {
            file: src/main.ts,
            text: "type Address = { township: string; street: string };",
            occurrence: 1,
          }
      - id: select-calls
        type: editor.select
        at: { mark: select-calls }
        target: { file: src/main.ts, text: "const home: Address = {", occurrence: 1 }

  - id: symptoms
    narration: >
      [[mark:panel-ready]] ညာဘက် panel ရဲ့ Output ကို အရင် ကြည့်ပါ။ ပို့ခက ၃၀၀၀ ကျပ်၊ မိနစ် ၂၀ နဲ့
      မှန်ပေမယ့်၊ ဒုတိယ line မှာ ပို့ဆောင်သူက undefined ကို ဖုန်းဆက်မယ်လို့ ပြနေပါတယ်။ ကိုယ့်
      လိပ်စာထဲမှာ ဖုန်းနံပါတ် မပါလို့ပါ။ [[mark:read-errors]] Errors မှာလည်း function နှစ်ခုလုံးကို
      လိပ်စာ ပို့တဲ့ နေရာမှာ၊ ဖုန်းနံပါတ် မပါဘူး ဆိုတဲ့ error နှစ်ခု ရှိပါတယ်။ [[mark:read-why]] library
      ရဲ့ version အသစ်မှာ လိပ်စာထဲကို ဖုန်းနံပါတ် ထပ်ထည့်လိုက်ပေမယ့်၊ ကိုယ် ကူးရေးထားတဲ့ type ကတော့
      အဟောင်းအတိုင်း ကျန်နေခဲ့တာပါ။ ကူးရေးထားတဲ့ type က မူရင်းနဲ့ ချိတ်မထားလို့၊ မူရင်း ပြောင်းတိုင်း
      ကိုယ်တိုင် လိုက်ပြင်ရပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 10: Deriving Types (why derive types from functions)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/deriving-types",
        }
      - {
          title: "TypeScript Handbook: Object Types",
          url: "https://www.typescriptlang.org/docs/handbook/2/objects.html",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-two-errors
