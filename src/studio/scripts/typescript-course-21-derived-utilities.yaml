  - id: parameters
    chapter: "Parameters နဲ့ typeof"
    narration: >
      [[mark:type-params]] ဒါဆို library ရဲ့ function ကနေ parameter type တွေကို တိုက်ရိုက်
      ထုတ်ယူကြည့်ရအောင်။ ပထမဆုံး Parameters ထဲကို ပို့ခ တွက်တဲ့ function ရဲ့ နာမည်ကို ဒီအတိုင်း ထည့်ကြည့်ပါမယ်။
      [[mark:read-value-error]] Errors ရဲ့ အပေါ်ဆုံးမှာ error အသစ် ပေါ်လာပါတယ်။ ဒီ နာမည်က တန်ဖိုး တစ်ခု
      ဖြစ်ပေမယ့် type နေရာမှာ သုံးထားတယ်၊ type of ကို ဆိုလိုတာလား လို့ မေးနေတာပါ။ function က runtime မှာ
      ရှိတဲ့ တန်ဖိုး ဖြစ်လို့ type ပိုင်းမှာ တိုက်ရိုက် သုံးလို့ မရပါဘူး။ [[mark:type-typeof]] ဒါကြောင့်
      ရှေ့မှာ type of ထည့်ပြီး function ရဲ့ type ကို ယူပေးရပါမယ်။ [[mark:read-typeof]] ဒီ error
      ပျောက်သွားပြီး၊ ဖုန်းနံပါတ် error နှစ်ခုပဲ ကျန်ပါတော့တယ်။ [[mark:type-params-query]] ဘာ ရလာလဲ query
      comment နဲ့ ကြည့်ရအောင်။ [[mark:read-tuple]] Types မှာ tuple တစ်ခု
      ပေါ်လာပါပြီ။ parameter တစ်ခုစီက tuple ထဲက နေရာ တစ်ခုစီ ဖြစ်ပြီး၊ နာမည်တွေကိုလည်း label အနေနဲ့
      ထိန်းထားပါတယ်။ ဒုတိယ နေရာကတော့ မထည့်လည်း ရတဲ့ parameter ဖြစ်လို့၊ question mark ပါပြီး undefined
      လည်း ဖြစ်နိုင်တယ်လို့ ပြထားပါတယ်။
    sources:
      - {
          title: "TypeScript Handbook: Utility Types (Parameters<Type>)",
          url: "https://www.typescriptlang.org/docs/handbook/utility-types.html#parameterstype",
        }
      - {
          title: "TypeScript Handbook: Typeof Type Operator",
          url: "https://www.typescriptlang.org/docs/handbook/2/typeof-types.html",
        }
      - {
          title: "Total TypeScript Essentials, ch. 10: Deriving Types (Parameters)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/deriving-types",
        }
    actions:
      - id: type-params
        type: editor.type
        at: { mark: type-params }
        target:
          {
            file: src/main.ts,
            after: "import { bookRider, deliveryFee } from \"./delivery\";\n\n",
            occurrence: 1,
          }
        text: "type FeeArgs = Parameters<deliveryFee>;\n\n"
        cadence: line-by-line
      - id: expect-value-error
        type: expect.preview
        at: { afterAction: type-params }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "3" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-value-code
        type: expect.preview
        at: { afterAction: expect-value-error }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-code, value: "2749" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-value-text
        type: expect.preview
        at: { afterAction: expect-value-code }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-1 }
        textContains: "'deliveryFee' refers to a value, but is being used as a type here. Did you mean 'typeof deliveryFee'?"
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: type-typeof
        type: editor.type
        at: { mark: type-typeof }
        target: { file: src/main.ts, after: "type FeeArgs = Parameters<", occurrence: 1 }
        text: "typeof "
        cadence: fast-explainer
      - id: expect-typeof-fixed
        type: expect.preview
        at: { afterAction: type-typeof }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-params-query
        type: editor.type
        at: { mark: type-params-query }
        target:
          {
            file: src/main.ts,
            after: "type FeeArgs = Parameters<typeof deliveryFee>;\n",
            occurrence: 1,
          }
        text: "//   ^?\n"
      - id: expect-tuple
        type: expect.preview
        at: { afterAction: type-params-query }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        textContains: "type FeeArgs = [address: {"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-tuple-optional
        type: expect.preview
        at: { afterAction: expect-tuple }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        textContains: "    phone: string;\n}, express?: boolean | undefined]"
        retry: { maxAttempts: 3, delayMs: 1200 }

  - id: derive-address
    narration: >
      [[mark:type-derive]] အခု ကူးရေးထားတဲ့ လိပ်စာ type ကို ဒီ tuple ရဲ့ ပထမ နေရာနဲ့ အစားထိုးပါမယ်။
      indexed access နဲ့ ပထမ နေရာကို ယူတဲ့ line အသစ် ရေးပြီး၊ အဟောင်းကို comment ပိတ်လိုက်ပါမယ်။
      [[mark:read-moved]] function ခေါ်တဲ့ နေရာက error နှစ်ခု ပျောက်သွားပြီး၊ အိမ်လိပ်စာမှာ ဖုန်းနံပါတ်
      မပါဘူး ဆိုတဲ့ error တစ်ခုတည်း ကျန်ပါတော့တယ်။ ကိုယ့် type က library နဲ့ ချိတ်မိသွားလို့၊ error က
      တကယ် ပြင်ရမယ့် နေရာကို ရောက်လာတာပါ။ [[mark:type-phone]] အိမ်လိပ်စာထဲကို ဖုန်းနံပါတ်
      ထည့်လိုက်ပါမယ်။ ပို့ဆောင်သူက အိမ်ရောက်တဲ့အခါ ဒီ နံပါတ်ကို ဖုန်းဆက်မှာ ဖြစ်လို့၊ library က မဖြစ်မနေ
      တောင်းတာပါ။ [[mark:read-phone-fixed]] error မကျန်တော့ဘဲ၊ Output မှာလည်း undefined အစား ဖုန်းနံပါတ်
      အမှန် ပေါ်လာပါပြီ။ library က လိပ်စာကို ထပ်ပြောင်းရင်လည်း၊ ဒီ type က အလိုလို လိုက်ပြောင်းသွားမှာပါ။
    sources:
      - {
          title: "TypeScript Handbook: Indexed Access Types",
          url: "https://www.typescriptlang.org/docs/handbook/2/indexed-access-types.html",
        }
      - {
          title: "Total TypeScript Essentials, ch. 10: Deriving Types (a single source of truth)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/deriving-types",
        }
    actions:
      - id: type-derive
        type: editor.type
        at: { mark: type-derive }
        target: { file: src/main.ts, after: "// ပို့ရမယ့် လိပ်စာ\n", occurrence: 1 }
        text: "type Address = FeeArgs[0];\n// "
        cadence: block
      - id: expect-derive-one
        type: expect.preview
        at: { afterAction: type-derive }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-derive-code
        type: expect.preview
        at: { afterAction: expect-derive-one }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-code, value: "2741" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-derive-text
        type: expect.preview
        at: { afterAction: expect-derive-code }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-1 }
        textContains: "Property 'phone' is missing in type '{ township: string; street: string; }' but required in type"
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: type-phone
        type: editor.type
        at: { mark: type-phone }
        target: { file: src/main.ts, after: "  street: \"ရွှေဂုံတိုင် လမ်း\",\n", occurrence: 1 }
        text: "  phone: \"09 450 123 456\",\n"
        cadence: fast-explainer
      - id: expect-phone-fixed
        type: expect.preview
        at: { afterAction: type-phone }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-phone-output
        type: expect.preview
        at: { afterAction: expect-phone-fixed }
        timeoutMs: 8000
        target: { by: testId, value: ts-out-2 }
        textContains: "မောင်မောင် က 09 450 123 456 ကို ဖုန်းဆက်ပါမယ်"
        retry: { maxAttempts: 3, delayMs: 1200 }

  - id: return-type
    chapter: "ReturnType နဲ့ Awaited"
    narration: >
      [[mark:type-quote]] function ပြန်ပေးတဲ့ type ကိုတော့ ReturnType နဲ့ ထုတ်ယူပါတယ်။ ပို့ခ တွက်တဲ့
      function အတွက် ရေးပြီး query comment နဲ့ ကြည့်ပါမယ်။ [[mark:read-quote]] ပို့ခနဲ့ မိနစ် ပါတဲ့
      object type ကို ပြနေပါတယ်။ library က ဒီ type ကို ရေးမထားဘဲ TypeScript က infer လုပ်ထားတာ
      ဖြစ်ပေမယ့်၊ ReturnType က အဲဒီ type ကို ယူပေးနိုင်ပါတယ်။ ပို့ခကို ပြတဲ့ function တစ်ခု ရေးရင်၊
      parameter ကို ဒီ type နဲ့ ကြေညာလို့ ရပါတယ်။
    sources:
      - {
          title: "TypeScript Handbook: Utility Types (ReturnType<Type>)",
          url: "https://www.typescriptlang.org/docs/handbook/utility-types.html#returntypetype",
        }
      - {
          title: "Total TypeScript Essentials, ch. 10: Deriving Types (ReturnType)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/deriving-types",
        }
    actions:
      - id: type-quote
        type: editor.type
        at: { mark: type-quote }
        target:
          {
            file: src/main.ts,
            after: "type FeeArgs = Parameters<typeof deliveryFee>;\n//   ^?\n",
            occurrence: 1,
          }
        text: "type Quote = ReturnType<typeof deliveryFee>;\n//   ^?\n"
        cadence: line-by-line
      - id: expect-quote
        type: expect.preview
        at: { afterAction: type-quote }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-2 }
        attribute:
          { name: data-type, value: "type Quote = {\n    fee: number;\n    minutes: number;\n}" }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: awaited
    narration: >
      [[mark:type-booking]] ပို့ဆောင်သူ ခေါ်တဲ့ function အတွက်လည်း ReturnType နဲ့ ထုတ်ကြည့်ရအောင်။
      [[mark:read-promise]] ဒီတစ်ခါတော့ object ကို Promise နဲ့ ပတ်ထားပါတယ်။ async function က Promise ကို
      ပြန်ပေးလို့ပါ။ ဒါပေမဲ့ ကိုယ့် code မှာ သုံးရမှာက await လုပ်ပြီးမှ ရမယ့် object ပါ။
      [[mark:type-awaited]] ဒါကြောင့် Awaited နဲ့ ထပ်ပတ်လိုက်ပါမယ်။ [[mark:read-awaited]] Promise
      ပျောက်သွားပြီး၊ ပို့ဆောင်သူရဲ့ နာမည်၊ မိနစ်နဲ့ ဖုန်းနံပါတ် ပါတဲ့ object ကိုပဲ ပြပါတော့တယ်။ Awaited
      က တန်ဖိုး ပိုင်းမှာ await လုပ်တာကို type ပိုင်းမှာ လုပ်ပေးတာပါ။ async function တွေမှာ ReturnType
      နဲ့ Awaited ကို ဒီလို တွဲသုံးတာ မကြာခဏ တွေ့ရပါလိမ့်မယ်။
    sources:
      - {
          title: "TypeScript Handbook: Utility Types (Awaited<Type>)",
          url: "https://www.typescriptlang.org/docs/handbook/utility-types.html#awaitedtype",
        }
      - {
          title: "Total TypeScript Essentials, ch. 10: Deriving Types (Awaited)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/deriving-types",
        }
    actions:
      - id: type-booking
        type: editor.type
        at: { mark: type-booking }
        target:
          {
            file: src/main.ts,
            after: "type Quote = ReturnType<typeof deliveryFee>;\n//   ^?\n",
            occurrence: 1,
          }
        text: "type Booking = ReturnType<typeof bookRider>;\n//   ^?\n"
        cadence: line-by-line
      - id: expect-promise
        type: expect.preview
        at: { afterAction: type-booking }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-3 }
        attribute:
          {
            name: data-type,
            value: "type Booking = Promise<{\n    rider: string;\n    minutes: number;\n    callTo: string;\n}>",
          }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-awaited
        type: editor.type
        at: { mark: type-awaited }
        target: { file: src/main.ts, after: "type Booking = ", occurrence: 1 }
        text: "Awaited<"
        cadence: fast-explainer
      - id: type-awaited-close
        type: editor.type
        at: { afterAction: type-awaited }
        target: { file: src/main.ts, after: "ReturnType<typeof bookRider>", occurrence: 1 }
        text: ">"
        cadence: fast-explainer
      - id: expect-awaited
        type: expect.preview
        at: { afterAction: type-awaited-close }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-3 }
        attribute:
          {
            name: data-type,
            value: "type Booking = {\n    rider: string;\n    minutes: number;\n    callTo: string;\n}",
          }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-awaited-clean
        type: expect.preview
        at: { afterAction: expect-awaited }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 1200 }

  - id: non-nullable
    chapter: "Union ကို ပြောင်းတဲ့ utility type"
    narration: >
      [[mark:type-express]] ထုတ်ယူထားတဲ့ type တွေကို ထပ်ပြောင်းလို့လည်း ရပါတယ်။ tuple ရဲ့ ဒုတိယ နေရာကို
      ယူပြီး query comment နဲ့ ကြည့်ပါမယ်။ [[mark:read-express-union]] boolean နဲ့ undefined ရဲ့ union
      ဖြစ်နေပါတယ်။ ဆိုင်ရဲ့ setting ထဲမှာ အမြန် ပို့မလား ဆိုတာကို true ဒါမှမဟုတ် false နဲ့ အမြဲ
      သိမ်းချင်ရင်တော့၊ undefined မပါတဲ့ type လိုပါတယ်။ [[mark:type-nonnullable]] ဒါကြောင့် NonNullable
      နဲ့ ပတ်လိုက်ပါမယ်။ [[mark:read-nonnullable]] undefined ပျောက်ပြီး boolean တစ်ခုတည်း ကျန်ပါတော့တယ်။
      NonNullable က union ထဲက null နဲ့ undefined ကို ဖယ်ပေးတဲ့ utility type ပါ။
    sources:
      - {
          title: "TypeScript Handbook: Utility Types (NonNullable<Type>)",
          url: "https://www.typescriptlang.org/docs/handbook/utility-types.html#nonnullabletype",
        }
      - {
          title: "Total TypeScript Essentials, ch. 10: Deriving Types (transforming derived types)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/deriving-types",
        }
    actions:
      - id: type-express
        type: editor.type
        at: { mark: type-express }
        target:
          {
            file: src/main.ts,
            after: "type Booking = Awaited<ReturnType<typeof bookRider>>;\n//   ^?\n",
            occurrence: 1,
          }
        text: "type Express = FeeArgs[1];\n//   ^?\n"
        cadence: line-by-line
      - id: expect-express-union
        type: expect.preview
        at: { afterAction: type-express }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-4 }
        attribute: { name: data-type, value: "type Express = boolean | undefined" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-nonnullable
        type: editor.type
        at: { mark: type-nonnullable }
        target: { file: src/main.ts, after: "type Express = ", occurrence: 1 }
        text: "NonNullable<"
        cadence: fast-explainer
      - id: type-nonnullable-close
        type: editor.type
        at: { afterAction: type-nonnullable }
        target: { file: src/main.ts, after: "NonNullable<FeeArgs[1]", occurrence: 1 }
        text: ">"
        cadence: fast-explainer
      - id: expect-nonnullable
        type: expect.preview
        at: { afterAction: type-nonnullable-close }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-4 }
        attribute: { name: data-type, value: "type Express = boolean" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-nonnullable-clean
        type: expect.preview
        at: { afterAction: expect-nonnullable }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 1200 }

  - id: exclude-extract
    narration: >
      [[mark:open-kitchen]] union ကို ပြောင်းပေးတဲ့ utility type နောက်ထပ် နှစ်ခုကို မီးဖိုချောင် screen
      ဖိုင်မှာ ကြည့်ရအောင်။ [[mark:select-status]] ဒါက အော်ဒါ အခြေအနေ လေးမျိုးရဲ့ union ပါ။
      [[mark:type-exclude]] မီးဖိုချောင် screen မှာ ငွေချေပြီးသား အော်ဒါတွေကို မပြချင်လို့၊ Exclude နဲ့
      paid ကို ဖယ်ပြီး query comment နဲ့ ကြည့်ပါမယ်။ [[mark:read-exclude]] Types ရဲ့ အပေါ်ဆုံးမှာ
      ကျန်တဲ့ အခြေအနေ သုံးမျိုးပဲ ပြနေပါတယ်။ Exclude က union ထဲကနေ ပေးလိုက်တဲ့ type နဲ့ ကိုက်တဲ့ member
      တွေကို ဖယ်ထုတ်ပါတယ်။ [[mark:select-events]] အောက်က union ကတော့ type ဆိုတဲ့ property နဲ့ ခွဲထားတဲ့
      မီးဖိုချောင် event သုံးမျိုးပါ။ [[mark:type-extract]] ဖျော်ပြီးလို့ ခေါင်းလောင်း တီးရမယ့် event
      ကိုပဲ Extract နဲ့ ရွေးထုတ်ပါမယ်။ member တစ်ခုလုံး မရေးဘဲ၊ type က done ဖြစ်တဲ့ object ပုံစံလောက်ပဲ
      ပေးလိုက်ပါတယ်။ [[mark:read-extract]] Types မှာ done event တစ်ခုတည်းကို ပစ္စည်းနဲ့ မိနစ်
      အပြည့်အစုံနဲ့ ပြနေပါတယ်။ Extract က Exclude ရဲ့ ပြောင်းပြန် ဖြစ်ပြီး၊ ကိုက်တဲ့ member တွေကိုပဲ
      ချန်ထားပါတယ်။ [[mark:union-vs-object]] သတိထားရမှာက၊ ဒီ utility type သုံးခုက union ရဲ့ member
      တွေနဲ့ အလုပ်လုပ်ပြီး၊ Pick နဲ့ Omit ကတော့ object ရဲ့ property တွေနဲ့ အလုပ်လုပ်တာပါ။ ဒါကြောင့်
      union ထဲက member တစ်ခုကို ရွေးချင်ရင် Pick မဟုတ်ဘဲ Extract ကို သုံးရပါတယ်။
    sources:
      - {
          title: "TypeScript Handbook: Utility Types (Exclude<UnionType, ExcludedMembers>)",
          url: "https://www.typescriptlang.org/docs/handbook/utility-types.html#excludeuniontype-excludedmembers",
        }
      - {
          title: "TypeScript Handbook: Utility Types (Extract<Type, Union>)",
          url: "https://www.typescriptlang.org/docs/handbook/utility-types.html#extracttype-union",
        }
      - {
          title: "Total TypeScript Essentials, ch. 10: Deriving Types (Exclude, Extract)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/deriving-types",
        }
    actions:
      - id: open-kitchen
        type: workspace.openFile
        at: { mark: open-kitchen }
        path: src/kitchen.ts
      - id: select-status
        type: editor.select
        at: { mark: select-status }
        target:
          { file: src/kitchen.ts, text: '"pending" | "brewing" | "ready" | "paid"', occurrence: 1 }
      - id: type-exclude
        type: editor.type
        at: { mark: type-exclude }
        target:
          {
            file: src/kitchen.ts,
            after: "export type OrderStatus = \"pending\" | \"brewing\" | \"ready\" | \"paid\";\n",
            occurrence: 1,
          }
        text: "export type OnScreen = Exclude<OrderStatus, \"paid\">;\n//          ^?\n"
        cadence: line-by-line
      - id: expect-exclude
        type: expect.preview
        at: { afterAction: type-exclude }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        attribute: { name: data-type, value: 'type OnScreen = "pending" | "brewing" | "ready"' }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-exclude-count
        type: expect.preview
        at: { afterAction: expect-exclude }
        timeoutMs: 8000
        target: { by: testId, value: ts-types }
        attribute: { name: data-count, value: "5" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: select-events
        type: editor.select
        at: { mark: select-events }
        target:
          {
            file: src/kitchen.ts,
            text: "  | { type: \"ordered\"; item: string }\n  | { type: \"done\"; item: string; minutes: number }\n  | { type: \"cancelled\"; reason: string };",
            occurrence: 1,
          }
      - id: type-extract
        type: editor.type
        at: { mark: type-extract }
        target:
          {
            file: src/kitchen.ts,
            after: "  | { type: \"cancelled\"; reason: string };\n",
            occurrence: 1,
          }
        text: "\nexport type Bell = Extract<KitchenEvent, { type: \"done\" }>;\n//          ^?\n"
        cadence: line-by-line
      - id: expect-extract
        type: expect.preview
        at: { afterAction: type-extract }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-2 }
        attribute:
          {
            name: data-type,
            value: "type Bell = {\n    type: \"done\";\n    item: string;\n    minutes: number;\n}",
          }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-extract-count
        type: expect.preview
        at: { afterAction: expect-extract }
        timeoutMs: 8000
        target: { by: testId, value: ts-types }
        attribute: { name: data-count, value: "6" }
        retry: { maxAttempts: 3, delayMs: 1200 }

  - id: derive-or-decouple
    chapter: "ထုတ်ယူမလား၊ သီးသန့် ရေးမလား"
    narration: >
      [[mark:board-decide]] ဒါဆို type တိုင်းကို ထုတ်ယူသင့်သလား။ အမြဲတော့ မဟုတ်ပါဘူး။ ထုတ်ယူထားတဲ့ type
      က မူရင်းနဲ့ ချိတ်ထားလို့၊ မူရင်း ပြောင်းတိုင်း လိုက်ပြောင်းပါတယ်။ [[mark:draw-derive-side]] အတူတူ
      ပြောင်းရမယ့် type တွေဆိုရင် ထုတ်ယူပါ။ ဒီနေ့ ကြည့်ခဲ့တဲ့ library ရဲ့ လိပ်စာနဲ့ ကိုယ့် လိပ်စာ type လိုမျိုး၊
      တစ်ခု ပြောင်းရင် နောက်တစ်ခုလည်း မဖြစ်မနေ ပြောင်းရမှာ ဖြစ်လို့၊ ချိတ်ထားတာက အလုပ် သက်သာစေပါတယ်။
      [[mark:draw-decouple-side]] ဒါပေမဲ့ အလုပ် မတူတဲ့ type တွေကိုတော့ သီးသန့် ရေးတာ ပိုကောင်းပါတယ်။
      ဥပမာအားဖြင့်၊ customer ဖြည့်တဲ့ အော်ဒါ form ရဲ့ type နဲ့ database ထဲက အော်ဒါ row ရဲ့ type ကို
      စဉ်းစားကြည့်ပါ။ form ကနေ ရတဲ့ တန်ဖိုးတွေက စာသား ဖြစ်ပြီး၊ row မှာတော့ id နဲ့ ဖန်တီးတဲ့ အချိန်
      ပါပါတယ်။ [[mark:decouple-why]] form type ကို row type ကနေ Omit နဲ့ ထုတ်ယူထားရင်၊ database မှာ
      column အသစ် ထည့်တိုင်း form type ထဲကိုလည်း ရောက်လာပြီး၊ form မှာ မမေးတဲ့ အချက်ကိုတောင်
      ထည့်ပေးရမယ်လို့ error ပြပါလိမ့်မယ်။ [[mark:draw-question]] ဒါကြောင့် ဆုံးဖြတ်ရ ခက်ရင်၊ ဒီ type
      နှစ်ခုက အမြဲ အတူတူ ပြောင်းရမှာလား လို့ မေးကြည့်ပါ။ ဟုတ်ရင် ထုတ်ယူပြီး၊ မဟုတ်ရင်တော့ code နည်းနည်း
      ထပ်နေပါစေ၊ သီးသန့်ပဲ ရေးထားပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 10: Deriving Types (deriving vs decoupling)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/deriving-types",
        }
    actions:
      - id: open-board-b
        type: whiteboard.apply
        at: { mark: board-decide }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-derive-side
        type: whiteboard.apply
        at: { mark: draw-derive-side }
        upsertIds: [b-derive, b-derive-ex]
        drawMs: 2400
      - id: draw-decouple-side
        type: whiteboard.apply
        at: { mark: draw-decouple-side }
        upsertIds: [b-decouple, b-form, b-row]
        drawMs: 3200
      - id: draw-question
        type: whiteboard.apply
        at: { mark: draw-question }
        upsertIds: [b-question]
        drawMs: 1600

  - id: recap
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ Parameters နဲ့ ReturnType က function ရဲ့ parameter တွေနဲ့
      ပြန်ပေးတဲ့ type ကို ထုတ်ပေးပြီး၊ function ရဲ့ နာမည်ကို type of နဲ့ ထည့်ပေးရပါတယ်။ async function
      ဆိုရင်တော့ Awaited နဲ့ Promise ထဲက type ကို ယူပါတယ်။ [[mark:recap-unions]] union တွေမှာတော့
      Exclude က member တွေကို ဖယ်ပြီး Extract က ရွေးယူပါတယ်။ NonNullable ကတော့ null နဲ့ undefined ကို
      ဖယ်ပါတယ်။ အတူတူ ပြောင်းရမယ့် type တွေကို ထုတ်ယူပြီး၊ အလုပ် မတူတဲ့ type တွေကိုတော့ သီးသန့် ထားပါ။
      နောက် lesson မှာတော့ type annotation ရယ်၊ satisfies ရယ်၊ as ရယ် ဘယ်လို ကွာလဲ ဆိုတာနဲ့၊ error
      တွေကို ပိတ်တဲ့ နည်းတွေကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 10: Deriving Types",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/deriving-types",
        }
      - {
          title: "TypeScript Handbook: Utility Types",
          url: "https://www.typescriptlang.org/docs/handbook/utility-types.html",
        }
    actions:
      - id: close-board-b
        type: whiteboard.apply
        at: { mark: recap }
        open: false
      - id: open-main-2
        type: workspace.openFile
        at: { mark: recap, offsetMs: 700 }
        path: src/main.ts
      - id: select-derived
        type: editor.select
        at: { afterAction: open-main-2 }
        target: { file: src/main.ts, text: "type Address = FeeArgs[0];", occurrence: 1 }
      - id: select-unions
        type: editor.select
        at: { mark: recap-unions }
        target:
          { file: src/main.ts, text: "type Express = NonNullable<FeeArgs[1]>;", occurrence: 1 }
      - id: expect-file-derived
        type: expect.file
        at: { afterAction: select-unions }
        path: src/main.ts
        contains: "type FeeArgs = Parameters<typeof deliveryFee>;\n//   ^?\ntype Quote = ReturnType<typeof deliveryFee>;\n//   ^?\ntype Booking = Awaited<ReturnType<typeof bookRider>>;\n//   ^?\ntype Express = NonNullable<FeeArgs[1]>;\n"
      - id: expect-file-address
        type: expect.file
        at: { afterAction: expect-file-derived }
        path: src/main.ts
        contains: "type Address = FeeArgs[0];\n// type Address = { township: string; street: string };"
      - id: expect-file-kitchen
        type: expect.file
        at: { afterAction: expect-file-address }
        path: src/kitchen.ts
        contains: 'export type Bell = Extract<KitchenEvent, { type: "done" }>;'
checks:
  - { type: timing.p95Ms, max: 300 }
