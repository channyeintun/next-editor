      နောက်ဆုံး အော်ဒါက ကော်ဖီ ဆိုတာ ထွက်နေပါတယ်။ [[mark:read-js]] ဒီ lesson မှာ အဓိက ကြည့်မှာက JavaScript
      output ပါ။ ဒီ tsconfig ရဲ့ setting တွေနဲ့ main ဖိုင်ကို JavaScript ပြောင်းရင် ဘာ ထွက်လာမလဲ ဆိုတာ ပြပါတယ်။ type တွေ
      ပျောက်သွားတာကလွဲရင် ကိုယ် ရေးထားတဲ့ code အတိုင်းပါပဲ။ target မရေးထားရင် TypeScript ၆ နဲ့ ၇ က အသစ်ဆုံး
      JavaScript version ကို ယူလို့ပါ။ [[mark:read-import]] import line မှာ Order type မပါတော့တာကိုလည်း
      သတိထား ကြည့်ပါ။ type ဖြစ်လို့ TypeScript က ဖယ်ထုတ်ပေးလိုက်တာပါ။ ဒါကို နောက်မှ ပြန်ကြည့်ပါမယ်။
    sources:
