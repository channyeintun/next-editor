  - id: target
    chapter: "target နဲ့ polyfill"
    narration: >
      [[mark:open-tsconfig-2]] target ပြောင်းရင် ဘာ ဖြစ်မလဲ ကြည့်ရအောင်။ [[mark:type-es5]] project အဟောင်းတွေမှာ
      တွေ့ရတတ်တဲ့ ES ၅ ကို target အဖြစ် ထည့်ကြည့်ပါမယ်။ [[mark:read-es5-js]] JavaScript output က တော်တော်
      ပြောင်းသွားပါပြီ။ const တွေ var ဖြစ်သွားပြီး၊ nullish coalescing operator နဲ့ optional chaining
      က ES ၅ မှာ မရှိလို့၊ null နဲ့ undefined ကို စစ်တဲ့ ရှည်ရှည် code အဖြစ် ပြန်ရေးထားပါတယ်။ target က
      syntax ကို ဒီလို ပြောင်းပေးတာပါ။ [[mark:read-at]] ဒါပေမဲ့ at method ကို ခေါ်တဲ့ နေရာကတော့ မပြောင်းပါဘူး။
      at က syntax မဟုတ်ဘဲ array မှာ ရှိရမယ့် method ဖြစ်လို့၊ မရှိတဲ့ browser အတွက် အဲဒီ method ကို ဖြည့်ရေးပေးမယ့်
      polyfill ဆိုတဲ့ code ကို TypeScript က ထည့်မပေးပါဘူး။ အဲဒီအစား ဒုတိယ error က array မှာ at မရှိဘူး၊ lib ကို ပြောင်းဖို့ လိုမလားလို့
      ပြောနေပါတယ်။ lib ကို မရေးထားရင် target ကို လိုက်လို့ပါ။ [[mark:read-deprecated]] ပထမ error ကတော့ tsconfig ထဲက
      error ပါ။ ES ၅ target ကို deprecated လုပ်ထားပြီး TypeScript ၇ မှာ အလုပ် မလုပ်တော့ဘူးလို့ ပြောနေပါတယ်။
      TypeScript ၆ မှာ ignore deprecations option နဲ့ ခဏ ပိတ်ထားလို့ ရပေမယ့်၊ TypeScript ၇ မှာတော့ ဒီလို
      option တွေက ပြင်မှ ရမယ့် error တွေ ဖြစ်သွားပါပြီ။ base url နဲ့ module resolution node တို့လည်း ဒီ
      အုပ်စုထဲ ပါပါတယ်။ [[mark:type-es2022]] ဒါကြောင့် ES ၅ line ကို comment လုပ်ပြီး target ကို ES ၂၀၂၂
      လို့ ထားပါမယ်။ [[mark:read-es2022]] error နှစ်ခုလုံး ပျောက်ပြီး JavaScript output လည်း မူလအတိုင်း ပြန်ဖြစ်သွားပါပြီ။
      target ကို ကိုယ့် code run မယ့် browser ဒါမှမဟုတ် Node.js က support လုပ်တဲ့ version အထိ ထားပါ။ default ကို
      မမှီခိုဘဲ ရေးထားတော့ TypeScript version တက်တဲ့အခါ output မပြောင်းသွားပါဘူး။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 14: target, target doesn't polyfill",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/configuring-typescript",
        }
      - {
          title: "TSConfig reference: target",
          url: "https://www.typescriptlang.org/tsconfig/#target",
        }
      - { title: "TSConfig reference: lib", url: "https://www.typescriptlang.org/tsconfig/#lib" }
      - {
          title: "Announcing TypeScript 6.0 (deprecations: target es5, baseUrl, moduleResolution node; ignoreDeprecations)",
          url: "https://devblogs.microsoft.com/typescript/announcing-typescript-6-0/",
        }
      - {
          title: "Announcing TypeScript 7.0 (6.0 deprecations are hard errors)",
          url: "https://devblogs.microsoft.com/typescript/announcing-typescript-7-0/",
        }
    actions:
      - id: open-tsconfig-2
        type: workspace.openFile
        at: { mark: open-tsconfig-2 }
        path: tsconfig.json
      - id: type-es5
        type: editor.type
        at: { mark: type-es5 }
        target: { file: tsconfig.json, after: "\"compilerOptions\": {\n", occurrence: 1 }
        text: "    \"target\": \"es5\",\n"
        cadence: block
      - id: expect-es5-errors
        type: expect.preview
        at: { afterAction: type-es5 }
        timeoutMs: 10000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 800 }
      - id: expect-es5-js
        type: expect.preview
        at: { afterAction: expect-es5-errors }
        timeoutMs: 8000
        target: { by: testId, value: ts-js-1 }
        textContains: 'var note = (_a = order.note) !== null && _a !== void 0 ? _a : "မှတ်ချက် မရှိ";'
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-es5-at
        type: expect.preview
        at: { mark: read-at }
        timeoutMs: 5000
        target: { by: testId, value: ts-js-1 }
        textContains: "(_a = orders.at(-1)) === null"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-es5-lib
        type: expect.preview
        at: { afterAction: expect-es5-at }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-2 }
        textContains: "Property 'at' does not exist on type 'Order[]'."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-es5-deprecated
        type: expect.preview
        at: { mark: read-deprecated }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Option 'target=ES5' is deprecated and will stop functioning in TypeScript 7.0."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-es5-deprecated-file
        type: expect.preview
        at: { afterAction: expect-es5-deprecated }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-file, value: "tsconfig.json" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-es2022
        type: editor.type
        at: { mark: type-es2022 }
        target: { file: tsconfig.json, after: "\"compilerOptions\": {\n    ", occurrence: 1 }
        text: "\"target\": \"es2022\",\n    // "
        cadence: block
      - id: expect-es2022-clean
        type: expect.preview
        at: { afterAction: type-es2022 }
        timeoutMs: 10000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 800 }
      - id: expect-es2022-js
        type: expect.preview
        at: { afterAction: expect-es2022-clean }
        timeoutMs: 8000
        target: { by: testId, value: ts-js-1 }
        textContains: 'const note = order.note ?? "မှတ်ချက် မရှိ";'
        retry: { maxAttempts: 3, delayMs: 1200 }

  - id: strictness
    chapter: "Index နဲ့ ယူရင် undefined ဖြစ်နိုင်တယ်"
    narration: >
      strict တစ်ခုတည်းက null နဲ့ undefined ကို သေချာ စစ်တာ၊ parameter မှာ type မပါရင်
      error ပြတာ စတဲ့ စစ်ဆေးမှု တစ်စုကို ဖွင့်ပေးပါတယ်။ strict ထဲမှာ မပါပေမယ့် ထည့်သင့်တဲ့ option တစ်ခု
      ရှိပါသေးတယ်။ [[mark:type-nuia]] no unchecked indexed access ကို ထည့်ပါမယ်။ [[mark:read-nuia]] error
      တစ်ခု ပေါ်လာပါပြီ။ ပထမ အော်ဒါကို function ထဲ ပို့တဲ့ နေရာမှာ၊ undefined ဖြစ်နိုင်တဲ့ တန်ဖိုးကို Order
      နေရာမှာ ထည့်လို့ မရဘူးလို့ ပြောနေပါတယ်။ [[mark:type-query-first]] ပထမ အော်ဒါရဲ့ type ကို query comment
      နဲ့ ကြည့်ရအောင်။ [[mark:read-query-first]] Order ဒါမှမဟုတ် undefined လို့ ပြနေပါတယ်။ array ထဲမှာ အော်ဒါ
      မရှိရင် index နဲ့ ယူတဲ့ တန်ဖိုးက undefined ဖြစ်မှာမို့၊ ဒီ option က အဲဒါကို type ထဲမှာ ထည့်ပြပေးတာပါ။
      [[mark:type-guard]] ဒါကြောင့် ပထမ အော်ဒါ ရှိမှပဲ ထုတ်ပြဖို့ if စစ်ချက် ထည့်ပါမယ်။ [[mark:read-guard]]
      error ပျောက်သွားပါပြီ။ code နည်းနည်း ပိုရေးရပေမယ့်၊ array ရဲ့ အဆုံးကို ကျော်ပြီး ယူမိတဲ့ bug တွေကို run
      မတိုင်ခင် ဖမ်းပေးပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 14: strict, noUncheckedIndexedAccess",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/configuring-typescript",
        }
      - {
          title: "TSConfig reference: strict",
          url: "https://www.typescriptlang.org/tsconfig/#strict",
        }
      - {
          title: "TSConfig reference: noUncheckedIndexedAccess",
          url: "https://www.typescriptlang.org/tsconfig/#noUncheckedIndexedAccess",
        }
    actions:
      - id: type-nuia
        type: editor.type
        at: { mark: type-nuia }
        target: { file: tsconfig.json, after: "\"strict\": true,\n", occurrence: 1 }
        text: "    \"noUncheckedIndexedAccess\": true,\n"
        cadence: block
      - id: expect-nuia-one
        type: expect.preview
        at: { afterAction: type-nuia }
        timeoutMs: 10000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 800 }
      - id: expect-nuia-message
        type: expect.preview
        at: { afterAction: expect-nuia-one }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-1 }
        textContains: "Argument of type 'Order | undefined' is not assignable to parameter of type 'Order'."
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: open-main-2
        type: workspace.openFile
        at: { mark: type-query-first }
        path: src/main.ts
      - id: type-query-first
        type: editor.type
        at: { afterAction: open-main-2 }
        target: { file: src/main.ts, after: "const first = orders[0];\n", occurrence: 1 }
        text: "//    ^?\n"
        cadence: fast-explainer
      - id: expect-query-first
        type: expect.preview
        at: { afterAction: type-query-first }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        attribute: { name: data-type, value: "const first: Order | undefined" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-guard
        type: editor.type
        at: { mark: type-guard }
        target: { file: src/main.ts, after: "//    ^?\n", occurrence: 1 }
        text: "if (first) "
      - id: expect-guard-clean
        type: expect.preview
        at: { afterAction: type-guard }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: verbatim
    chapter: "verbatimModuleSyntax နဲ့ import type"
    narration: >
      Vite လို tool တွေက ဖိုင် တစ်ဖိုင်ချင်းစီကို တခြား ဖိုင်တွေ မကြည့်ဘဲ JavaScript
      ပြောင်းပါတယ်။ ဒါကြောင့် ဖိုင် တစ်ဖိုင်တည်း ကြည့်ပြီး ပြောင်းလို့ မရတဲ့ code ကို isolated modules option
      က error ပြပေးပါတယ်။ verbatim module syntax option က ဒါကို အလိုလို ဖွင့်ပေးပြီး၊ import တွေကိုပါ
      ပိုရှင်းအောင် ရေးခိုင်းပါတယ်။ [[mark:type-verbatim]] verbatim module syntax ကို ထည့်ကြည့်ပါမယ်။
      [[mark:read-verbatim]] Order က type ဖြစ်လို့ type only import နဲ့ import လုပ်ရမယ် ဆိုတဲ့ error
      ပေါ်လာပါပြီ။ JavaScript output ကိုလည်း ကြည့်ပါ။ ခုနက ဖယ်ထုတ်ပေးခဲ့တဲ့ Order က import line ထဲမှာ
      ပြန်ပါလာပါပြီ။ ဒီ option က import export ကို ရေးထားတဲ့ အတိုင်း ချန်ထားလို့ပါ။ orders ဖိုင်က Order
      ဆိုတဲ့ တန်ဖိုးကို export မလုပ်တဲ့အတွက်၊ ဒီ JavaScript ကို browser မှာ run ရင် error တက်မှာပါ။
      [[mark:type-type]] ဒါကြောင့် Order ရဲ့ ရှေ့မှာ type ဆိုတဲ့ စကားလုံး ထည့်ပေးပါမယ်။ [[mark:read-type]]
      error ပျောက်ပြီး JavaScript output ထဲက Order လည်း ပျောက်သွားပါပြီ။ type လို့ ရေးထားတဲ့ import ကိုပဲ
      ဖယ်တာ ဖြစ်လို့၊ ဘယ်ဟာ ဖယ်မလဲ ဆိုတာ code ကို ကြည့်ရုံနဲ့ သိနိုင်ပါတယ်။ import တစ်ကြောင်းလုံး type
      တွေပဲ ဆိုရင်တော့ import type လို့ ရှေ့ဆုံးမှာ ရေးနိုင်ပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 14: isolatedModules, import type, verbatimModuleSyntax",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/configuring-typescript",
        }
      - {
          title: "TSConfig reference: verbatimModuleSyntax",
          url: "https://www.typescriptlang.org/tsconfig/#verbatimModuleSyntax",
        }
      - {
          title: "TSConfig reference: isolatedModules (default true with verbatimModuleSyntax)",
          url: "https://www.typescriptlang.org/tsconfig/#isolatedModules",
        }
    actions:
      - id: open-tsconfig-3
        type: workspace.openFile
        at: { mark: type-verbatim }
        path: tsconfig.json
      - id: type-verbatim
        type: editor.type
        at: { afterAction: open-tsconfig-3 }
        target: { file: tsconfig.json, after: "\"skipLibCheck\": true,\n", occurrence: 1 }
        text: "    \"verbatimModuleSyntax\": true,\n"
        cadence: block
      - id: expect-verbatim-one
        type: expect.preview
        at: { afterAction: type-verbatim }
        timeoutMs: 10000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 800 }
      - id: expect-verbatim-code
        type: expect.preview
        at: { afterAction: expect-verbatim-one }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-code, value: "1484" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-verbatim-js
        type: expect.preview
        at: { afterAction: expect-verbatim-code }
        timeoutMs: 8000
        target: { by: testId, value: ts-js-1 }
        textContains: 'import { Order, orders } from "./orders";'
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: open-main-3
        type: workspace.openFile
        at: { mark: type-type }
        path: src/main.ts
      - id: type-type
        type: editor.type
        at: { afterAction: open-main-3 }
        target: { file: src/main.ts, after: "import { ", occurrence: 1 }
        text: "type "
      - id: expect-type-clean
        type: expect.preview
        at: { afterAction: type-type }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-type-js
        type: expect.preview
        at: { afterAction: expect-type-clean }
        timeoutMs: 8000
        target: { by: testId, value: ts-js-1 }
        textContains: 'import { orders } from "./orders";'
        retry: { maxAttempts: 3, delayMs: 1200 }

  - id: who-emits
    chapter: "JavaScript ကို ဘယ်သူ ထုတ်မလဲ"
    narration: >
      [[mark:board-emit]] module option မှာ အဓိက ရွေးစရာ နှစ်ခု ရှိပြီး၊ JavaScript ကို ဘယ်သူ ထုတ်မလဲ
      ဆိုတာကို ကြည့်ပြီး ရွေးရပါတယ်။ [[mark:draw-tsc]] tsc ကိုယ်တိုင် JavaScript ထုတ်ပြီး Node.js မှာ run မယ်ဆိုရင်
      module ကို NodeNext ထားပါ။ NodeNext က Node.js ရဲ့ ES module စည်းကမ်းအတိုင်း စစ်လို့၊ ကိုယ့် ဖိုင်တွေကို import
      လုပ်တဲ့အခါ dot js extension ထည့်ရေးရပါတယ်။ ထွက်လာတဲ့ ဖိုင်တွေကို out dir နဲ့ folder တစ်ခုထဲ စုထားပြီး၊
      source map ဖွင့်ထားရင် error တက်တဲ့အခါ TypeScript ဖိုင်ထဲက line ကို ပြန်ညွှန်ပြနိုင်ပါတယ်။
      [[mark:draw-library]] library ထုတ်မယ်ဆိုရင် declaration ကို ဖွင့်ပြီး ပြီးခဲ့တဲ့ lesson က declaration file
      တွေကို ထုတ်ခိုင်းပါ။ declaration map ကလည်း Go to Definition ကို declaration file အစား မူရင်း TypeScript
      ဖိုင်ဆီ ခေါ်သွားပေးပါတယ်။ [[mark:draw-bundler]] Vite လို bundler က JavaScript ထုတ်ပေးမယ် ဆိုရင်တော့
      ဒီ project လိုပဲ module ကို preserve ထားပြီး no emit ကို ဖွင့်ပါ။ import path တွေကို bundler က ရှာပေးလို့
      extension ထည့်စရာ မလိုပါဘူး။ [[mark:draw-jsx]] React လို JSX ရေးမယ်ဆိုရင် jsx option ကိုလည်း
      ထည့်ရပါတယ်။ preserve ဆိုရင် JSX ကို အတိုင်း ချန်ထားပြီး၊ react jsx ဆိုရင် JavaScript function ခေါ်တာ
      အဖြစ် ပြောင်းပေးပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 14: The two choices for module; noEmit; source maps; transpiling for library use; jsx",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/configuring-typescript",
        }
      - {
          title: "TSConfig reference: module (preserve, nodenext)",
          url: "https://www.typescriptlang.org/tsconfig/#module",
        }
      - {
          title: "TSConfig reference: declaration, declarationMap, outDir, sourceMap",
          url: "https://www.typescriptlang.org/tsconfig/#declaration",
        }
      - { title: "TSConfig reference: jsx", url: "https://www.typescriptlang.org/tsconfig/#jsx" }
    actions:
      - id: open-board-b
        type: whiteboard.apply
        at: { mark: board-emit }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-tsc
        type: whiteboard.apply
        at: { mark: draw-tsc }
        upsertIds: [b-tsc-box, b-tsc-name, b-tsc-module, b-tsc-ext, b-tsc-out]
        drawMs: 3000
      - id: draw-library
        type: whiteboard.apply
        at: { mark: draw-library }
        upsertIds: [b-tsc-lib, b-tsc-map]
        drawMs: 1600
      - id: draw-bundler
        type: whiteboard.apply
        at: { mark: draw-bundler }
        upsertIds:
          [b-bundler-box, b-bundler-name, b-bundler-module, b-bundler-noemit, b-bundler-here]
        drawMs: 2800
      - id: draw-jsx
        type: whiteboard.apply
        at: { mark: draw-jsx }
        upsertIds: [b-jsx]
        drawMs: 1200

  - id: many-configs
    chapter: "Config ဖိုင် တစ်ခုထက် ပိုရင်"
    narration: >
      [[mark:board-configs]] project ကြီးလာရင် client နဲ့ server လို အပိုင်းတွေအတွက် setting မတူတဲ့ config
      ဖိုင်တွေ လိုလာတတ်ပါတယ်။ [[mark:draw-tree]] တူတဲ့ setting တွေကို base ဖိုင် တစ်ခုထဲ စုထားပြီး၊ ကျန်တဲ့
      config တွေက extends နဲ့ အဲဒီ setting တွေကို ယူသုံးပြီး ကိုယ်ပိုင် setting ထပ်ထည့်နိုင်ပါတယ်။
      [[mark:draw-nearest]] VS Code က ဖိုင် တစ်ဖိုင်ကို စစ်တဲ့အခါ အဲဒီ ဖိုင်နဲ့ အနီးဆုံး tsconfig ကို သုံးပါတယ်။
      [[mark:draw-project]] command line မှာတော့ tsc ကို project option နဲ့ run ပြီး ဘယ် config ကို သုံးမလဲ
      ရွေးပေးနိုင်ပါတယ်။ [[mark:draw-references]] config တွေ များလာရင် root config ထဲမှာ references နဲ့
      စာရင်းလုပ်ပြီး၊ အပိုင်း တစ်ခုချင်းမှာ composite ကို ဖွင့်ထားရင်၊ tsc ရဲ့ build mode က အားလုံးကို အစဉ်လိုက်
      တစ်ခါတည်း build လုပ်ပေးပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 14: Managing multiple TypeScript configurations",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/configuring-typescript",
        }
      - {
          title: "TSConfig reference: extends",
          url: "https://www.typescriptlang.org/tsconfig/#extends",
        }
      - {
          title: "TypeScript Handbook: Project References",
          url: "https://www.typescriptlang.org/docs/handbook/project-references.html",
        }
    actions:
      - id: open-board-c
        type: whiteboard.apply
        at: { mark: board-configs }
        clear: true
        upsertIds: [c-title]
      - id: draw-tree
        type: whiteboard.apply
        at: { mark: draw-tree }
        upsertIds:
          [
            c-base-box,
            c-base,
            c-arrow-1,
            c-arrow-2,
            c-extends,
            c-client-box,
            c-client,
            c-client-file,
            c-server-box,
            c-server,
            c-server-file,
          ]
        drawMs: 4000
      - id: draw-nearest
        type: whiteboard.apply
        at: { mark: draw-nearest }
        upsertIds: [c-nearest]
        drawMs: 1200
      - id: draw-project
        type: whiteboard.apply
        at: { mark: draw-project }
        upsertIds: [c-project]
        drawMs: 1200
      - id: draw-references
        type: whiteboard.apply
        at: { mark: draw-references }
        upsertIds: [c-references]
        drawMs: 1200

  - id: recap
    narration: >
      [[mark:close-board-c]] ဒါဆို ပြန်ချုပ်ရရင်၊ tsconfig က ဘယ် ဖိုင်တွေကို ဘယ်လောက် တင်းကျပ်ကျပ် စစ်ပြီး၊
      ဘယ်လို JavaScript ထုတ်မလဲ ဆိုတာ သတ်မှတ်ပါတယ်။ [[mark:recap-config]] target က syntax ကိုပဲ ပြောင်းပေးပြီး
      polyfill မထည့်ပေးပါဘူး။ no unchecked indexed access က index နဲ့ ယူတဲ့ တန်ဖိုး undefined ဖြစ်နိုင်တာကို
      သတိပေးပြီး၊ verbatim module syntax က type import တွေကို type လို့ ရေးခိုင်းပါတယ်။ [[mark:recap-emit]]
      JavaScript ကို tsc က ထုတ်ရင် module ကို NodeNext ထားပြီး၊ bundler က ထုတ်ရင် preserve နဲ့ no emit ကို
      သုံးပါတယ်။ TypeScript ၇ မှာ deprecated option တွေ အလုပ် မလုပ်တော့တာကိုလည်း မှတ်ထားပါ။ နောက် lesson
      မှာတော့ ကိုယ်ပိုင် type တွေကို ဒီဇိုင်းဆွဲတဲ့ အပိုင်းကို စပြီး၊ type parameter ပါတဲ့ generic type တွေကို
      ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 14: Configuring TypeScript",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/configuring-typescript",
        }
    actions:
      - id: close-board-c
        type: whiteboard.apply
        at: { mark: close-board-c }
        open: false
      - id: open-tsconfig-4
        type: workspace.openFile
        at: { mark: recap-config }
        path: tsconfig.json
      - id: select-final
        type: editor.select
        at: { afterAction: open-tsconfig-4 }
        target: { file: tsconfig.json, text: '"target": "es2022",', occurrence: 1 }
      - id: expect-file-tsconfig
        type: expect.file
        at: { afterAction: select-final }
        path: tsconfig.json
        contains: "    \"target\": \"es2022\",\n    // \"target\": \"es5\",\n    \"module\": \"preserve\",\n    \"noEmit\": true,\n    \"strict\": true,\n    \"noUncheckedIndexedAccess\": true,\n    \"skipLibCheck\": true,\n    \"verbatimModuleSyntax\": true,\n    \"moduleDetection\": \"force\"\n"
      - id: expect-file-main
        type: expect.file
        at: { afterAction: expect-file-tsconfig }
        path: src/main.ts
        contains: 'import { type Order, orders } from "./orders";'
      - id: expect-file-guard
        type: expect.file
        at: { afterAction: expect-file-main }
        path: src/main.ts
        contains: "const first = orders[0];\n//    ^?\nif (first) console.log(orderLine(first));"
checks:
  - { type: timing.p95Ms, max: 300 }
