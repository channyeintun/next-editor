build:
  # Studio replaces this built-in profile at render time with the Burmese provider chosen in the
  # render console (AthanLab with the user's own key, or VoxCPM2 when that feature is enabled).
  voiceProfile: pocket-alba-v1
  seed: 3126
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "tsconfig ဆိုတာ"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ module နဲ့ script ကွာပုံ၊ declaration file တွေ ဘယ်က လာလဲ ဆိုတာ
      ကြည့်ခဲ့ပြီး၊ tsconfig မှာ option နှစ်ခု ထည့်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ tsconfig ဖိုင်ကို အသေးစိတ်
      ကြည့်ပြီး၊ project အများစုမှာ သုံးလို့ရတဲ့ config တစ်ခုရဲ့ line တစ်ကြောင်းချင်းကို ဘာကြောင့် ထည့်လဲ
      ဆိုတာ နားလည်အောင် လုပ်ကြည့်ပါမယ်။ [[mark:draw-files]] tsconfig က TypeScript အတွက် မေးခွန်း
      သုံးခုကို ဖြေပေးပါတယ်။ ပထမက ဘယ် ဖိုင်တွေကို စစ်မလဲ ဆိုတာပါ။ include မှာ folder ကို ရေးပေးရပြီး၊ အဲဒီ
      path ကို tsconfig ဖိုင် ရှိတဲ့ folder ကနေ စတွက်ပါတယ်။ [[mark:draw-strict]] ဒုတိယက ဘယ်လောက် တင်းကျပ်ကျပ် စစ်မလဲ ဆိုတာပါ။
      strict လို option တွေက ဘယ်လို code ကို error အဖြစ် ပြမလဲ ဆုံးဖြတ်ပါတယ်။ [[mark:draw-emit]] တတိယက
      ဘယ်လို JavaScript ကို ဘယ်သူ ထုတ်မလဲ ဆိုတာပါ။ ဘယ် JavaScript version အတွက် ထုတ်မလဲ၊ import export
      တွေကို ဘယ်လို ထားမလဲ၊ TypeScript ကိုယ်တိုင် ဖိုင် ထုတ်မလား ဆိုတာတွေကို ဒီမှာ ရွေးပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 14: Configuring TypeScript",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/configuring-typescript",
        }
      - {
          title: "TypeScript Handbook: What is a tsconfig.json",
          url: "https://www.typescriptlang.org/docs/handbook/tsconfig-json.html",
        }
    actions:
      - id: open-board-a
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-files
        type: whiteboard.apply
        at: { mark: draw-files }
        upsertIds: [a-files-q, a-files-a]
        drawMs: 1600
      - id: draw-strict
        type: whiteboard.apply
        at: { mark: draw-strict }
        upsertIds: [a-strict-q, a-strict-a]
        drawMs: 1800
      - id: draw-emit
        type: whiteboard.apply
        at: { mark: draw-emit }
        upsertIds: [a-emit-q, a-emit-a]
        drawMs: 1800

  - id: starter
    narration: >
      [[mark:close-board]] ဒီ project ရဲ့ tsconfig ကို ကြည့်ရအောင်။ [[mark:open-tsconfig]] ဒါက tsconfig
      ဖိုင်ပါ။ [[mark:select-include]] include က src folder ထဲက ဖိုင်တွေကို စစ်ခိုင်းထားပါတယ်။
      [[mark:select-module]] module ကို preserve ထားပြီး no emit ကို ဖွင့်ထားပါတယ်။ ဆိုလိုတာက import export တွေကို
      ရေးထားတဲ့ အတိုင်း ချန်ထားပြီး၊ JavaScript ထုတ်တဲ့ အလုပ်ကို TypeScript မလုပ်ဘဲ Vite ကို လွှဲထားတာပါ။ [[mark:select-strict]] strict ကတော့ TypeScript ၆ ကစပြီး မရေးထားရင်တောင် ဖွင့်ပြီးသားပါ။
      ဒါပေမဲ့ ရေးထားတော့ ဖတ်တဲ့သူ ချက်ချင်း သိပါတယ်။ [[mark:select-skip]] အောက်က နှစ်ခုကတော့ ပြီးခဲ့တဲ့
      lesson မှာ ထည့်ခဲ့တဲ့ skip lib check နဲ့ module detection ပါ။ target ကိုတော့ မရေးထားပါဘူး။
      [[mark:open-main]] main ဖိုင်က orders ဖိုင်ထဲက Order type နဲ့ အော်ဒါ စာရင်းကို import လုပ်ပါတယ်။
      [[mark:select-nullish]] function ထဲမှာ မှတ်ချက် မရှိရင် default စာသား ပေးဖို့ nullish coalescing
      operator ကို သုံးထားပြီး၊ [[mark:select-at]] အောက်ဆုံးမှာ နောက်ဆုံး အော်ဒါကို ယူတဲ့ at method နဲ့
      optional chaining ကို သုံးထားပါတယ်။ ဒါတွေက JavaScript ရဲ့ နောက်ပိုင်း version တွေမှာမှ ပါလာတာပါ။
    sources:
      - {
          title: "TSConfig reference: include",
          url: "https://www.typescriptlang.org/tsconfig/#include",
        }
      - {
          title: "Announcing TypeScript 6.0 (strict on by default, target defaults to the newest ES version)",
          url: "https://devblogs.microsoft.com/typescript/announcing-typescript-6-0/",
        }
      - {
          title: "MDN: Array.prototype.at()",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/at",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: open-tsconfig
        type: workspace.openFile
        at: { mark: open-tsconfig }
        path: tsconfig.json
      - id: select-include
        type: editor.select
        at: { mark: select-include }
        target: { file: tsconfig.json, text: '"include": ["src"]', occurrence: 1 }
      - id: select-module
        type: editor.select
        at: { mark: select-module }
        target:
          {
            file: tsconfig.json,
            text: "\"module\": \"preserve\",\n    \"noEmit\": true,",
            occurrence: 1,
          }
      - id: select-strict
        type: editor.select
        at: { mark: select-strict }
        target: { file: tsconfig.json, text: '"strict": true,', occurrence: 1 }
      - id: select-skip
        type: editor.select
        at: { mark: select-skip }
        target:
          {
            file: tsconfig.json,
            text: "\"skipLibCheck\": true,\n    \"moduleDetection\": \"force\"",
            occurrence: 1,
          }
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: src/main.ts
      - id: select-nullish
        type: editor.select
        at: { mark: select-nullish }
