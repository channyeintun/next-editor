      - id: type-notebox-return
        type: editor.type
        at: { mark: type-notebox-return }
        cadence: line-by-line
        target: { file: src/NoteBox.jsx, after: "    },\n  }));\n", occurrence: 1 }
        text: "\n  return (\n    <input ref={inputRef} placeholder=\"မှတ်ချက် ရေးရန်\" data-testid=\"note-input\" />\n  );\n}\n"
      - id: open-app-note
        type: workspace.openFile
        at: { mark: open-app-note, offsetMs: 400 }
        path: src/App.jsx
      - id: wire-note-import
        type: editor.type
