          gap: 10px;
          flex-wrap: wrap;
        }

        .list {
          display: grid;
          gap: 8px;
          margin: 0;
          padding: 0;
          list-style: none;
        }

        .list > li {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 10px;
          padding: 8px 12px;
          border: 1px solid var(--line);
          border-radius: 10px;
          background: var(--surface);
        }

        button {
          font: inherit;
          padding: 6px 16px;
          border: 0;
          border-radius: 999px;
          background: var(--accent);
          color: white;
          cursor: pointer;
        }

        button.secondary {
          background: var(--accent-soft);
          color: var(--accent);
        }

        button:disabled {
          background: var(--line);
          color: var(--muted);
          cursor: not-allowed;
        }

        input,
        select,
        textarea {
          font: inherit;
          width: 100%;
          padding: 6px 12px;
          border: 1px solid var(--line);
          border-radius: 10px;
          background: var(--surface);
          color: var(--text);
        }

        input:focus,
        select:focus,
        textarea:focus,
        button:focus-visible {
          outline: 2px solid var(--accent);
          outline-offset: 2px;
        }

        .badge {
          display: inline-block;
          padding: 0 10px;
          border-radius: 999px;
          background: var(--accent-soft);
          color: var(--accent);
          font-size: 0.85rem;
        }

        .badge.ok {
          background: #ebfbee;
          color: var(--ok);
        }

        .badge.warn {
          background: #fff4e6;
          color: var(--warn);
        }

        /* Lesson 6: refs and the DOM */
        .page > button,
        .card > button {
          justify-self: start;
        }

        .elapsed {
          font-size: 1.6rem;
          font-variant-numeric: tabular-nums;
        }

        .specials {
          max-height: 168px;
