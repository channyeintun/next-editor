        path: src/SpecialsList.jsx
        contains: "              itemsRef.current.set(item.id, node);\n              return () => itemsRef.current.delete(item.id);\n"
      - id: expect-flushsync-file
        type: expect.file
        at: { afterAction: expect-specials-file }
        path: src/SpecialsList.jsx
        contains: "    flushSync(() => {\n      setItems([...items, next]);\n    });\n    scrollToItem(next.id);\n"
      - id: expect-modal-file
        type: expect.file
        at: { afterAction: expect-flushsync-file }
        path: src/OrderModal.jsx
        contains: "    </div>,\n    document.body,\n  );\n"
      - id: expect-app-file
