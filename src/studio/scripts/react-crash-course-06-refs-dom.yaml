        at: { mark: draw-flush-warning }
        upsertIds: [b4-warning]
        drawMs: 1200

  # ------------------------------------------------------------------ 10
  - id: portal-modal
    chapter: "Portal နဲ့ modal"
    narration: >
      [[mark:close-board-flush]] နောက်ဆုံးက page တစ်ခုလုံး ဖုံးပြီး ပေါ်လာမယ့်
      order modal ပါ။ ကိုယ့် component က layout ထဲ နက်နက်မှာ ရှိတော့၊ parent ရဲ့
      style က သူ့ကို ဖြတ်နိုင်ပါတယ်။ [[mark:type-portal-import]] ဒါကို react-dom
      ကပဲ လာတဲ့ createPortal က ဖြေရှင်းပေးပါတယ်။ သူက JSX ကို DOM ထဲက တခြား နေရာမှာ
      သွားပြပေးတာပါ။ [[mark:type-modal-body]] component က createPortal ကို
      argument နှစ်ခုနဲ့ ခေါ်ပြီး return လုပ်ပါတယ်။ ပထမ argument က ပြမယ့် JSX ပါ။
      နောက်ခံ အမှောင်ပေါ်မှာ order card လေး တင်ထားတာပါ။ ဒုတိယ argument ကတော့
      အဲဒါကို ထည့်မယ့် DOM element ပါ။ [[mark:select-body]] ဒီမှာ အဲဒီ element က
      page ရဲ့ body ပါ။ React က render လုပ်နေတဲ့ root ရဲ့ အပြင်ဘက်ပါ။
      [[mark:open-app-modal]] OrderModal ကို import လုပ်ပါတယ်။
      [[mark:wire-modal-state]] ဖွင့်ထားလား ဆိုတဲ့ state တစ်ခု ထည့်ပါတယ်။
      [[mark:wire-modal-jsx]] ပြီးတော့ ဖွင့်မယ့် ခလုတ် တစ်ခု ထည့်ပြီး၊ အဲဒီ state
      က true ဖြစ်နေတုန်းမှာပဲ modal ကို ပြပါတယ်။ [[mark:click-open-modal]]
      ဖွင့်ကြည့်ရအောင်။ [[mark:after-modal]] order card က page တစ်ခုလုံးကို
      ဖုံးသွားပါပြီ။
    sources:
      - title: "React — createPortal"
        url: "https://react.dev/reference/react-dom/createPortal"
      - title: "React — Rendering a modal dialog with a portal"
        url: "https://react.dev/reference/react-dom/createPortal#rendering-a-modal-dialog-with-a-portal"
    actions:
      - id: close-board-flush
        type: whiteboard.apply
        at: { mark: close-board-flush }
        open: false
      - id: open-order-modal
        type: workspace.openFile
        at: { mark: close-board-flush, offsetMs: 700 }
        path: src/OrderModal.jsx
      - id: type-portal-import
        type: editor.type
        at: { mark: type-portal-import }
        cadence: fast-explainer
        target: { file: src/OrderModal.jsx, after: "", occurrence: 1 }
        text: "import { createPortal } from \"react-dom\";\n"
      - id: type-modal-body
        type: editor.type
        at: { mark: type-modal-body }
        cadence: line-by-line
        target:
          {
            file: src/OrderModal.jsx,
            after: "import { createPortal } from \"react-dom\";\n",
            occurrence: 1,
          }
        text: "\nexport default function OrderModal({ onClose }) {\n  return createPortal(\n    <div className=\"modal-backdrop\">\n      <div className=\"card modal\" data-testid=\"order-modal\">\n        <h2>မှာထားတာ</h2>\n        <p>မုန့်ဟင်းခါး 1 ပွဲ · 2,500 ကျပ်</p>\n        <button data-testid=\"close-modal\" onClick={onClose}>\n          ပိတ်မယ်\n        </button>\n      </div>\n    </div>,\n    document.body,\n  );\n}\n"
      - id: select-body
        type: editor.select
        at: { mark: select-body }
        target: { file: src/OrderModal.jsx, text: "document.body", occurrence: 1 }
      - id: open-app-modal
        type: workspace.openFile
        at: { mark: open-app-modal }
        path: src/App.jsx
      - id: wire-modal-import
        type: editor.type
        at: { afterAction: open-app-modal }
        cadence: block
        target:
          {
            file: src/App.jsx,
            after: "import SpecialsList from \"./SpecialsList.jsx\";\n",
            occurrence: 1,
          }
        text: "import OrderModal from \"./OrderModal.jsx\";\n"
      - id: wire-modal-state
        type: editor.type
        at: { mark: wire-modal-state }
        cadence: block
        target: { file: src/App.jsx, after: "  const noteRef = useRef(null);\n", occurrence: 1 }
        text: "  const [showModal, setShowModal] = useState(false);\n"
      - id: wire-modal-jsx
        type: editor.type
        at: { mark: wire-modal-jsx }
        cadence: block
        target: { file: src/App.jsx, after: "      <Header />\n", occurrence: 1 }
        text: "      <button data-testid=\"open-modal\" onClick={() => setShowModal(true)}>\n        မှာထားတာ ကြည့်မယ်\n      </button>\n      {showModal && <OrderModal onClose={() => setShowModal(false)} />}\n"
      - id: expect-modal-button
        type: expect.preview
        at: { mark: click-open-modal, offsetMs: -700 }
        timeoutMs: 5000
        target: { by: testId, value: open-modal }
        textContains: "မှာထားတာ ကြည့်မယ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: click-open-modal
        type: preview.click
        at: { mark: click-open-modal }
        timeoutMs: 5000
        target: { by: testId, value: open-modal }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-modal-open
        type: expect.preview
        at: { mark: after-modal }
        timeoutMs: 5000
        target: { by: testId, value: order-modal }
        textContains: "2,500 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 300 }

  # ------------------------------------------------------------------ 11
  - id: portal-board
    narration: >
      [[mark:board-trees]] ဒါဆို modal က တကယ် ဘယ်မှာ ရှိနေတာလဲ။
      [[mark:draw-react-tree]] React tree ထဲမှာတော့ App ရဲ့ child အတိုင်းပဲ
      ရှိနေလို့၊ အပေါ်က props နဲ့ context ကို ပုံမှန်အတိုင်း ရပါတယ်။
      [[mark:draw-dom-tree]] DOM tree ထဲမှာကျတော့ body ရဲ့ တိုက်ရိုက် အောက်မှာ၊
      root element ရဲ့ ဘေးနားမှာ ရှိနေပါတယ်။ [[mark:draw-bubbling]] event တွေကတော့
      React tree အတိုင်းပဲ သွားပါတယ်။ modal ထဲက click က parent ရဲ့ DOM element ထဲ
      မရှိပေမယ့်၊ သူ့ React parent တွေဆီ bubble ဖြစ်ပြီး တက်သွားပါတယ်။
    sources:
      - title: "React — createPortal"
        url: "https://react.dev/reference/react-dom/createPortal"
      - title: "React — Responding to Events: event propagation"
        url: "https://react.dev/learn/responding-to-events#event-propagation"
    actions:
