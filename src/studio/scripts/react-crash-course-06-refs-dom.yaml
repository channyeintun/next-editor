        drawMs: 1400

  # ------------------------------------------------------------------ 12
  - id: removed-recap
    chapter: "React 19 မှာ ပြောင်းသွားတာတွေ"
    narration: >
      [[mark:board-removed]] နောက်ဆုံး၊ React 19 က DOM ကိုင်ဖို့ နည်းဟောင်း နှစ်ခု
      ဖယ်လိုက်ပါပြီ။ [[mark:draw-string-refs]] class component ခေတ်က string ref
      မရှိတော့ပါဘူး။ အဲဒီအစား useRef ဒါမှမဟုတ် ref callback ကို သုံးပါ။
      [[mark:draw-find-dom-node]] findDOMNode လည်း မရှိတော့ပါဘူး။ လိုတဲ့ element
      ပေါ် ref တပ်လိုက်ပါ။ [[mark:draw-legacy-rows]] forwardRef ကတော့ အလုပ်
      လုပ်နေတုန်းပါပဲ။ ဒါပေမဲ့ ref prop က သူ့နေရာ ယူလိုက်ပါပြီ။ JSX element ကနေ
      ref ဖတ်တာလည်း deprecated ဖြစ်သွားပါပြီ။ ref က props ထဲ ရောက်နေလို့ပါ။
      [[mark:draw-recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ ref က ပြန် render မလုပ်ဘဲ တန်ဖိုး
      မှတ်ပေးပြီး၊ DOM element လည်း ကိုင်လို့ ရပါတယ်။ flushSync နဲ့ createPortal
      ကတော့ လိုမှသာ သုံးရတဲ့ tool တွေပါ။ [[mark:next-lesson]] နောက် lesson မှာတော့
      Effect ကို ကြည့်သွားပါမယ်။ ကိုယ့် stopwatch က screen ပေါ်က
      ပျောက်သွားရင်တောင် timer က ဆက် run နေမှာမို့၊ cleanup ပါတဲ့ Effect က
      အဲဒီအတွက် မှန်ကန်တဲ့ အဖြေပါ။
    sources:
      - title: "React 19 Upgrade Guide — Removed: string refs"
        url: "https://react.dev/blog/2024/04/25/react-19-upgrade-guide#removed-string-refs"
      - title: "React 19 Upgrade Guide — Removed: ReactDOM.findDOMNode"
        url: "https://react.dev/blog/2024/04/25/react-19-upgrade-guide#removed-reactdom-finddomnode"
      - title: "React — forwardRef"
        url: "https://react.dev/reference/react/forwardRef"
      - title: "React 19 Upgrade Guide — Deprecated: element.ref"
        url: "https://react.dev/blog/2024/04/25/react-19-upgrade-guide#deprecated-element-ref"
      - title: "React — Synchronizing with Effects"
        url: "https://react.dev/learn/synchronizing-with-effects"
    actions:
      - id: board-removed
        type: whiteboard.apply
        at: { mark: board-removed }
        clear: true
        upsertIds: [b6-title]
      - id: draw-string-refs
        type: whiteboard.apply
        at: { mark: draw-string-refs }
        upsertIds: [b6-string, b6-string-strike, b6-string-fix]
        drawMs: 1600
      - id: draw-find-dom-node
        type: whiteboard.apply
        at: { mark: draw-find-dom-node }
        upsertIds: [b6-find, b6-find-strike, b6-find-fix]
        drawMs: 1600
      - id: draw-legacy-rows
        type: whiteboard.apply
        at: { mark: draw-legacy-rows }
        upsertIds: [b6-forward, b6-forward-fix, b6-element-ref, b6-element-ref-fix]
        drawMs: 2000
      - id: draw-recap
        type: whiteboard.apply
        at: { mark: draw-recap }
        upsertIds: [b6-recap-ref, b6-recap-dom]
        drawMs: 1600
      - id: draw-next
        type: whiteboard.apply
        at: { mark: next-lesson }
        upsertIds: [b6-next]
        drawMs: 800
      - id: expect-stopwatch-file
        type: expect.file
        at: { afterAction: draw-next }
        path: src/Stopwatch.jsx
        contains: "    intervalRef.current = setInterval(() => {\n      setNow(Date.now());\n    }, 100);\n"
      - id: expect-search-input-file
        type: expect.file
