  # ------------------------------------------------------------------ 6
  - id: notebox-handle
    narration: >
      [[mark:open-notebox]] parent က element တစ်ခုလုံး ရသွားရင် input ကို
      ကြိုက်သလို ပြင်လို့ ရတော့၊ တစ်ခါတစ်လေ မသင့်တော်ပါဘူး။ မီးဖိုချောင် မှတ်ချက်
      အကွက်ဆိုရင် focus ပေးဖို့နဲ့ ရှင်းဖို့ပဲ ခွင့်ပြုချင်ပါတယ်။
      [[mark:type-notebox-top]] NoteBox က တကယ့် input အတွက် သူ့ ref တစ်ခု
      ထားပါတယ်။ parent ရဲ့ ref ကတော့ ခုနကလိုပဲ prop အနေနဲ့ ရောက်လာပါတယ်။
      [[mark:type-handle-focus]] ဒါပေမဲ့ useImperativeHandle က parent ရဲ့ ref
      ထဲကို input အစား ကိုယ်တိုင် သတ်မှတ်တဲ့ object တစ်ခု ထည့်ပေးပါတယ်။ ပထမ method
      focus က အတွင်းက input ကို focus ပေးပါတယ်။ [[mark:type-handle-clear]] ဒုတိယ
      method clear ကတော့ input ထဲက စာသားကို ရှင်းပစ်ပါတယ်။ parent က မြင်ရမှာ ဒီ
      နှစ်ခုပဲပါ။ [[mark:type-notebox-return]] input ကိုတော့ အတွင်းက ref နဲ့
      ချိတ်ထားပါတယ်။ input က NoteBox ထဲမှာပဲ ကျန်ပြီး၊ parent ဆီ ရောက်တာက အပေါ်က
      object ပဲပါ။ [[mark:open-app-note]] NoteBox ကို import လုပ်ပါတယ်။
      [[mark:wire-note-ref]] ref တစ်ခု ထပ်လုပ်ပါတယ်။ [[mark:wire-note-jsx]]
      ပြီးတော့ အကွက်နဲ့ method နှစ်ခုကို ခေါ်မယ့် ခလုတ် နှစ်ခု ထည့်ပါတယ်။
      [[mark:type-note-text]] မှတ်ချက် ရေးရအောင်။ [[mark:click-clear]]
      ဖျက်လိုက်ရအောင်။ [[mark:after-clear]] အကွက် လွတ်သွားပါပြီ။ App က clear
      လုပ်ပါလို့ ပြောရုံပါ။ ဘယ်လို ရှင်းမလဲ ဆိုတာက NoteBox ရဲ့ အလုပ်ပါ။
    sources:
      - title: "React — useImperativeHandle"
        url: "https://react.dev/reference/react/useImperativeHandle"
      - title: "React — Exposing a subset of the API with an imperative handle"
        url: "https://react.dev/learn/manipulating-the-dom-with-refs#exposing-a-subset-of-the-api-with-an-imperative-handle"
    actions:
      - id: open-notebox
        type: workspace.openFile
        at: { mark: open-notebox }
        path: src/NoteBox.jsx
      - id: type-notebox-top
        type: editor.type
        at: { mark: type-notebox-top }
        cadence: line-by-line
        target: { file: src/NoteBox.jsx, after: "", occurrence: 1 }
        text: "import { useImperativeHandle, useRef } from \"react\";\n\nexport default function NoteBox({ ref }) {\n  const inputRef = useRef(null);\n"
      - id: type-handle-focus
        type: editor.type
        at: { mark: type-handle-focus }
        cadence: line-by-line
        target:
          { file: src/NoteBox.jsx, after: "  const inputRef = useRef(null);\n", occurrence: 1 }
        text: "\n  useImperativeHandle(ref, () => ({\n    focus() {\n      inputRef.current.focus();\n    },\n"
      - id: type-handle-clear
        type: editor.type
        at: { mark: type-handle-clear }
