build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 6206

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}

scenes:
  # ------------------------------------------------------------------ 1
  - id: ref-idea
    chapter: "Ref ဆိုတာ ဘာလဲ"
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ state ကို context နဲ့ မျှဝေခဲ့ပါတယ်။ ဒီ lesson မှာတော့
      ref အကြောင်းပါ။ ref ဆိုတာ တန်ဖိုး ဒါမှမဟုတ် DOM element တစ်ခုကို render
      ကြားမှာ ကိုင်ထားပေးတဲ့ အကွက်လေးပါ။ [[mark:start-server]] ရှင်းပြနေတုန်း dev
      server ကို နောက်ကွယ်မှာ စ run ထားလိုက်ရအောင်။ preview လိုတဲ့အချိန်မှာ အသင့်
      ဖြစ်နေအောင်ပါ။ [[mark:draw-state-box]] အရင်ဆုံး state ကို ပြန်ပြောရရင်၊
      state ပြောင်းလိုက်ရင် React က component ကို ပြန်ခေါ်ပြီး screen ကို
      ပြင်ပေးပါတယ်။ [[mark:draw-ref-box]] ref ကတော့ current ဆိုတဲ့ field တစ်ခုပဲ
      ပါတဲ့ အကွက်လေးပါ။ useRef က render တိုင်း အဲဒီ အကွက်ကိုပဲ ပြန်ပေးပြီး၊
      current ပြောင်းလည်း ပြန် render မလုပ်ပါဘူး။ [[mark:draw-ref-uses]] ဒါကြောင့်
      screen ပေါ် မပြဘဲ handler လို နေရာကပဲ သုံးမယ့် တန်ဖိုးအတွက် ref က
      သင့်တော်ပါတယ်။ ဥပမာ timer ရပ်ဖို့ လိုတဲ့ id တို့၊ focus ပေးချင်တဲ့ DOM
      element တို့ပါ။ [[mark:draw-rule]] screen ပေါ်မှာ ပြရမယ့် တန်ဖိုးဆိုရင်
      state ကို သုံးပြီး၊ code ကပဲ လိုတာဆိုရင်တော့ ref နဲ့ လုံလောက်ပါတယ်။
    sources:
      - title: "React — useRef"
        url: "https://react.dev/reference/react/useRef"
      - title: "React — Referencing Values with Refs"
        url: "https://react.dev/learn/referencing-values-with-refs"
      - title: "Vite — Getting Started"
        url: "https://vite.dev/guide/"
    actions:
      - id: open-board-1
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        maximized: true
        clear: true
        upsertIds: [b1-title]
      - id: start-server
        type: runtime.start
        at: { mark: start-server }
        timeoutMs: 45000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-state-box
        type: whiteboard.apply
        at: { mark: draw-state-box }
        upsertIds: [b1-state-box, b1-state-name, b1-state-l1, b1-state-l2]
        drawMs: 2200
      - id: draw-ref-box
        type: whiteboard.apply
        at: { mark: draw-ref-box }
        upsertIds: [b1-ref-box, b1-ref-name, b1-ref-l1, b1-ref-l2, b1-ref-underline]
        drawMs: 2600
      - id: draw-ref-uses
        type: whiteboard.apply
        at: { mark: draw-ref-uses }
        upsertIds: [b1-uses]
        drawMs: 1000
      - id: draw-rule
        type: whiteboard.apply
        at: { mark: draw-rule }
        upsertIds: [b1-rule-state, b1-rule-ref]
        drawMs: 1600

  # ------------------------------------------------------------------ 2
  - id: stopwatch-code
    narration: >
      [[mark:close-board-1]] ဧည့်သည် စောင့်ချိန် တိုင်းမယ့် stopwatch လေး တစ်ခု
      ရေးကြည့်ရအောင်။ [[mark:open-stopwatch]] Stopwatch ဖိုင်က အခု အလွတ်ပါ၊ ဘယ်
      ဖိုင်ကမှ import မလုပ်ရသေးပါဘူး။ [[mark:type-sw-state]] စတဲ့ အချိန်နဲ့ လက်ရှိ
      အချိန်ကို state ထဲ ထားပါတယ်။ ဒီ နှစ်ခု ကြားက စက္ကန့်ကို screen က ပြရမှာ
      ဖြစ်လို့ပါ။ [[mark:type-sw-ref]] timer ကို စလိုက်ရင် browser က id တစ်ခု
      ပြန်ပေးပြီး၊ ရပ်ချင်ရင် အဲဒီ id နဲ့ ရပ်ရပါတယ်။ အဲဒီ id ကိုတော့ ref ထဲ
      ထားပါတယ်။ screen ပေါ် မပြဘဲ ရပ်မယ့် ခလုတ်ကပဲ သုံးမှာ ဖြစ်လို့ပါ။
      [[mark:type-sw-handlers]] စမယ် ဆိုရင် အချိန်ကို သိမ်းပြီး၊ timer အဟောင်း
      ရှိရင် ရပ်ပါတယ်။ တစ်စက္ကန့် ဆယ်ခါ အချိန် ပြောင်းမယ့် timer အသစ် စပါတယ်။
      ရပ်မယ် ဆိုရင်တော့ timer ကို ရပ်ပစ်ပါတယ်။ [[mark:select-sw-assign]] timer
      အသစ်ရဲ့ id ကို current ထဲ ရေးတဲ့ နေရာကို ကြည့်ပါ။ ဒီလို ရေးလို့ ပြန် render
      မဖြစ်ပါဘူး။ [[mark:type-sw-render]] နောက်ဆုံး component က စက္ကန့်ကို
      ပြပါတယ်။ မစရသေးရင်တော့ စာတိုလေး တစ်ကြောင်းပဲ ပြပါတယ်။ ပြီးတော့ ခလုတ် နှစ်ခု
      ပါပါတယ်။ ref ကို handler တွေထဲမှာပဲ သုံးပြီး JSX ထဲမှာ မသုံးတာကို သတိထားပါ။
      render လုပ်နေတုန်း ref ကို မဖတ်ဖို့၊ မရေးဖို့ React က သတိပေးထားလို့ပါ။
    sources:
      - title: "React — Referencing Values with Refs: Example: building a stopwatch"
        url: "https://react.dev/learn/referencing-values-with-refs#example-building-a-stopwatch"
      - title: "React — useRef: Caveats"
        url: "https://react.dev/reference/react/useRef#caveats"
      - title: "MDN — setInterval()"
        url: "https://developer.mozilla.org/en-US/docs/Web/API/Window/setInterval"
    actions:
      - id: close-board-1
        type: whiteboard.apply
        at: { mark: close-board-1 }
        open: false
      - id: collapse-dock-early
        type: runtime.collapseDock
        at: { afterAction: close-board-1 }
      - id: open-stopwatch
        type: workspace.openFile
        at: { mark: open-stopwatch }
        path: src/Stopwatch.jsx
      - id: type-sw-state
        type: editor.type
        at: { mark: type-sw-state }
        cadence: line-by-line
        target: { file: src/Stopwatch.jsx, after: "", occurrence: 1 }
        text: "import { useRef, useState } from \"react\";\n\nexport default function Stopwatch() {\n  const [startTime, setStartTime] = useState(null);\n  const [now, setNow] = useState(null);\n"
      - id: type-sw-ref
        type: editor.type
        at: { mark: type-sw-ref }
        cadence: fast-explainer
        target:
          {
            file: src/Stopwatch.jsx,
            after: "  const [now, setNow] = useState(null);\n",
            occurrence: 1,
          }
        text: "  const intervalRef = useRef(null);\n"
      - id: type-sw-handlers
        type: editor.type
        at: { mark: type-sw-handlers }
        cadence: line-by-line
        target:
          { file: src/Stopwatch.jsx, after: "  const intervalRef = useRef(null);\n", occurrence: 1 }
        text: "\n  function handleStart() {\n    setStartTime(Date.now());\n    setNow(Date.now());\n    clearInterval(intervalRef.current);\n    intervalRef.current = setInterval(() => {\n      setNow(Date.now());\n    }, 100);\n  }\n\n  function handleStop() {\n    clearInterval(intervalRef.current);\n  }\n"
      - id: select-sw-assign
        type: editor.select
        at: { mark: select-sw-assign }
        target:
          { file: src/Stopwatch.jsx, text: "intervalRef.current = setInterval", occurrence: 1 }
      - id: type-sw-render
        type: editor.type
        at: { mark: type-sw-render }
        cadence: line-by-line
        target:
          {
            file: src/Stopwatch.jsx,
            after: "    clearInterval(intervalRef.current);\n  }\n",
            occurrence: 1,
          }
        text: "\n  const seconds = (now - startTime) / 1000;\n\n  return (\n    <section className=\"card\" data-testid=\"stopwatch\">\n      <h2>စောင့်ချိန်</h2>\n      <p className=\"elapsed\" data-testid=\"elapsed\">\n        {startTime === null ? \"မစရသေးပါ\" : seconds.toFixed(1) + \" စက္ကန့်\"}\n      </p>\n      <div className=\"row\">\n        <button data-testid=\"start-timer\" onClick={handleStart}>\n          စမယ်\n        </button>\n        <button className=\"secondary\" data-testid=\"stop-timer\" onClick={handleStop}>\n          ရပ်မယ်\n        </button>\n      </div>\n    </section>\n  );\n}\n"

  # ------------------------------------------------------------------ 3
  - id: stopwatch-run
    narration: >
      ကဲ၊ page ထဲ ထည့်ကြည့်ရအောင်။ [[mark:open-app-sw]] App က အခုထိ ခေါင်းစဉ်ပဲ
      ပြနေပါသေးတယ်။ [[mark:wire-sw-import]] အရင်ဆုံး Stopwatch ကို import
      လုပ်ပါတယ်။ မသုံးခင် import က အရင် ရှိရလို့ပါ။ [[mark:wire-sw-use]] ပြီးတော့
      ခေါင်းစဉ် အောက်မှာ ထည့်ပါတယ်။ [[mark:preview-opens]] dev server က အသင့်
      ဖြစ်နေပြီမို့ preview ကို ဖွင့်လိုက်ရအောင်။ stopwatch က မစရသေးဘူးလို့
      ပြနေပါတယ်။ [[mark:click-start]] စမယ်ကို နှိပ်ရအောင်။ [[mark:watch-count]]
      စက္ကန့်တွေ တက်လာပါပြီ။ timer ခေါ်တိုင်း state ပြောင်းနေလို့ပါ။
      [[mark:click-stop]] ကဲ၊ ရပ်လိုက်ရအောင်။ [[mark:after-stop]] ကိန်းဂဏန်းက
      ရပ်သွားပါပြီ။ ရပ်မယ့် handler က ref ထဲက timer id နဲ့ timer ကို
      ရပ်ပစ်လိုက်တာပါ။ သာမန် variable ထဲ ထားမိရင်တော့ render တိုင်း အစကနေ
      ပြန်စလို့ အဲဒီ id ပျောက်သွားမှာပါ။
    sources:
      - title: "React — Referencing Values with Refs"
        url: "https://react.dev/learn/referencing-values-with-refs"
      - title: "React — useRef"
        url: "https://react.dev/reference/react/useRef"
      - title: "MDN — clearInterval()"
        url: "https://developer.mozilla.org/en-US/docs/Web/API/Window/clearInterval"
    actions:
      - id: open-app-sw
        type: workspace.openFile
        at: { mark: open-app-sw }
        path: src/App.jsx
      - id: wire-sw-import
        type: editor.type
        at: { mark: wire-sw-import }
        cadence: block
        target:
          { file: src/App.jsx, after: "import { Header } from \"./Header.jsx\";\n", occurrence: 1 }
        text: "import Stopwatch from \"./Stopwatch.jsx\";\n"
      - id: wire-sw-use
        type: editor.type
        at: { mark: wire-sw-use }
        cadence: block
        target: { file: src/App.jsx, after: "      <Header />\n", occurrence: 1 }
        text: "      <Stopwatch />\n"
      - id: wait-for-server
        type: runtime.waitForReady
        at: { mark: preview-opens }
        timeoutMs: 20000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-server }
        timeoutMs: 15000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-not-started
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 5000
        target: { by: testId, value: elapsed }
        textContains: "မစရသေးပါ"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: collapse-dock
        type: runtime.collapseDock
        at: { afterAction: expect-not-started }
      - id: click-start
        type: preview.click
        at: { mark: click-start }
        timeoutMs: 5000
        target: { by: testId, value: start-timer }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-counting
        type: expect.preview
        at: { mark: watch-count }
        timeoutMs: 5000
        target: { by: testId, value: elapsed }
        textContains: "စက္ကန့်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: click-stop
        type: preview.click
        at: { mark: click-stop }
        timeoutMs: 5000
        target: { by: testId, value: stop-timer }
        retry: { maxAttempts: 1, delayMs: 0 }
      # Presence check only: the verifier can assert text/value/attribute/route,
      # not that the number stopped moving. The freeze was checked by hand in
      # headless Chrome (DESIGN.md, "Assertions that are presence checks only").
      - id: expect-stopped
        type: expect.preview
        at: { mark: after-stop }
        timeoutMs: 5000
        target: { by: testId, value: elapsed }
        textContains: "စက္ကန့်"
        retry: { maxAttempts: 3, delayMs: 300 }

  # ------------------------------------------------------------------ 4
  - id: search-ref
    chapter: "DOM element ကို ref နဲ့ ကိုင်ရအောင်"
    narration: >
      [[mark:open-search-input]] ref ထဲ DOM element လည်း ထည့်လို့ ရပါတယ်။ ခလုတ်
      နှိပ်ရင် focus ရောက်မယ့် ရှာတဲ့ အကွက် လုပ်ကြည့်ရအောင်။
      [[mark:type-search-input]] SearchInput က props ထဲက ref ကို ခွဲထုတ်ပြီး၊
      ကျန်တဲ့ props တွေနဲ့အတူ input ဆီ ပေးလိုက်ပါတယ်။ React 19 မှာ ဒီလောက်နဲ့
      ရပါပြီ။ function component အတွက် ref က သာမန် prop ဖြစ်သွားလို့ပါ။ အရင်က
      forwardRef နဲ့ ထုပ်ရပေမယ့် အခု မလိုတော့ပါဘူး။ [[mark:open-app-search]] ကဲ၊
      App ကို ပြင်ရအောင်။ [[mark:wire-react-import]] React ကနေ useRef၊ useState
      ယူပါတယ်။ [[mark:wire-search-import]] ပြီးတော့ SearchInput ကိုလည်း import
      လုပ်ပါတယ်။ [[mark:wire-search-logic]] App ထဲမှာ null ကနေ စတဲ့ ref တစ်ခုနဲ့၊
      status စာသားအတွက် state တစ်ခု လုပ်ပါတယ်။ [[mark:select-focus]] handler ထဲမှာ
      ref ထဲက element ကို focus ပေးတဲ့ နေရာကို ကြည့်ပါ။ [[mark:select-active]]
      ပြီးတော့ focus တကယ် ရောက်လား စစ်ပြီးမှ စာသား ပြတဲ့ နေရာကို ကြည့်ပါ။
      [[mark:wire-search-jsx]] JSX ထဲမှာ ref ကို SearchInput ဆီ သာမန် prop လိုပဲ
      ပေးလိုက်ပါတယ်။ [[mark:click-search]] ရှာမယ်ကို နှိပ်ရအောင်။
      [[mark:after-search]] ရှာလို့ ရပါပြီ လို့ ပေါ်လာတော့၊ focus က input ထဲ တကယ်
      ရောက်သွားတာ သေချာပါတယ်။ input ကို screen ပေါ် တင်တဲ့အချိန်မှာ React က ref ထဲ
