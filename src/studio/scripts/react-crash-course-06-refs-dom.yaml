        path: src/NoteBox.jsx
        contains: "  useImperativeHandle(ref, () => ({\n    focus() {\n      inputRef.current.focus();\n    },\n    clear() {\n      inputRef.current.value = \"\";\n    },\n  }));\n"
      - id: expect-specials-file
        type: expect.file
