            b4-n-arrow-1,
            b4-n2-box,
            b4-n2-text,
            b4-n-arrow-2,
            b4-n3-box,
            b4-n3-text,
          ]
        drawMs: 3000
      - id: draw-flush-sync
        type: whiteboard.apply
        at: { mark: draw-flush-sync }
        upsertIds:
          [
            b4-flush-label,
            b4-f1-box,
            b4-f1-text,
            b4-f-arrow-1,
            b4-f2-box,
            b4-f2-text,
            b4-f-arrow-2,
            b4-f3-box,
            b4-f3-text,
          ]
        drawMs: 3000
      - id: draw-flush-warning
