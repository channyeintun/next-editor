  # ------------------------------------------------------------------ 7
  - id: specials-refs
    chapter: "Ref callback နဲ့ flushSync"
    narration: >
      [[mark:open-specials]] နောက်တစ်ခုက scroll လုပ်လို့ ရတဲ့ list ပါ။ ခလုတ်
      နှိပ်ရင် ဟင်းလျာ တစ်ခုဆီ ခုန်ဖို့၊ ဟင်းလျာ တစ်ခုစီရဲ့ element ကို ref နဲ့
      ကိုင်ထားရပါမယ်။ ဒါပေမဲ့ item တိုင်း useRef ခေါ်လို့ မရပါဘူး။ hook ကို loop
      ထဲ ခေါ်လို့ မရလို့ပါ။ [[mark:type-specials-top]] အဲဒီအစား ref တစ်ခုထဲမှာ Map
      တစ်ခု ထားပါတယ်။ ဟင်းလျာ id ကနေ သူ့ element ကို ချိတ်ပေးဖို့ပါ။ useRef ကို
      ပေးတဲ့ argument က render တိုင်း ပြန် run ရလို့၊ Map လို ပေါ့ပါးတာမှသာ ဒီလို
      တိုက်ရိုက် ထည့်ပါ။ [[mark:type-specials-scroll]] ခုန်ချင်ရင် Map ထဲက element
      ကို ရှာပြီး၊ မြင်ကွင်းထဲ ရောက်အောင် scroll လုပ်ဖို့ browser ကို ပြောပါတယ်။
      [[mark:type-specials-list]] JSX ထဲမှာတော့ ခုန်မယ့် ခလုတ်၊ အသစ် ထည့်မယ့်
      ခလုတ်နဲ့ ဒီနေ့ အထူး ဟင်းလျာ စာရင်း ပါပါတယ်။ [[mark:type-ref-callback]] item
      တိုင်းမှာ key နဲ့ ref callback ပါပါတယ်။ ref object အစား function
      ပေးလိုက်တာပါ။ item ပေါ်လာရင် React က သူ့ကို element နဲ့ ခေါ်ပေးပြီး၊ ကိုယ်က
      Map ထဲ သိမ်းပါတယ်။ [[mark:select-cleanup]] ဒီ return စာကြောင်းကို ကြည့်ပါ။
      React 19 မှာ callback က cleanup ပြန်ပေးနိုင်ပါပြီ။ item ပျောက်ရင် ဒါမှမဟုတ်
      ပြန် render လို့ callback အသစ် ရောက်ရင် React က run ပေးလို့၊ Map ထဲက entry
      ဖျက်တာပါ။ [[mark:strict-note]] development မှာတော့ StrictMode က list ပထမဆုံး
      ပေါ်တဲ့အခါ callback ခေါ်၊ cleanup run၊ callback ထပ်ခေါ် ဆိုပြီး တစ်ကြိမ်
      ပိုလုပ်ပါတယ်။ cleanup က callback လုပ်ထားတာကို တကယ် ပြန်ဖြုတ်လား စစ်တာပါ။
    sources:
      - title: "React — How to manage a list of refs using a ref callback"
        url: "https://react.dev/learn/manipulating-the-dom-with-refs#how-to-manage-a-list-of-refs-using-a-ref-callback"
      - title: "React — Common components: ref callback function"
        url: "https://react.dev/reference/react-dom/components/common#ref-callback"
      - title: "React 19 — Cleanup functions for refs"
        url: "https://react.dev/blog/2024/12/05/react-19#cleanup-functions-for-refs"
      - title: "React 19 Upgrade Guide — StrictMode changes"
        url: "https://react.dev/blog/2024/04/25/react-19-upgrade-guide#strict-mode-improvements"
      - title: "MDN — Element.scrollIntoView()"
        url: "https://developer.mozilla.org/en-US/docs/Web/API/Element/scrollIntoView"
    actions:
      - id: open-specials
        type: workspace.openFile
        at: { mark: open-specials }
        path: src/SpecialsList.jsx
      - id: type-specials-top
        type: editor.type
        at: { mark: type-specials-top }
        cadence: line-by-line
        target: { file: src/SpecialsList.jsx, after: "", occurrence: 1 }
        text: "import { useRef, useState } from \"react\";\nimport { menu } from \"./menu.js\";\n\nlet nextId = 1;\n\nexport default function SpecialsList() {\n  const [items, setItems] = useState(menu);\n  const itemsRef = useRef(new Map());\n"
      - id: type-specials-scroll
        type: editor.type
        at: { mark: type-specials-scroll }
        cadence: line-by-line
        target:
          {
            file: src/SpecialsList.jsx,
            after: "  const itemsRef = useRef(new Map());\n",
            occurrence: 1,
          }
        text: "\n  function scrollToItem(id) {\n    const node = itemsRef.current.get(id);\n    node.scrollIntoView({ behavior: \"smooth\", block: \"nearest\" });\n  }\n"
      - id: type-specials-list
        type: editor.type
        at: { mark: type-specials-list }
        cadence: block
        target:
          {
            file: src/SpecialsList.jsx,
            after: "    node.scrollIntoView({ behavior: \"smooth\", block: \"nearest\" });\n  }\n",
            occurrence: 1,
          }
        text: "\n  return (\n    <section className=\"card\">\n      <div className=\"row\">\n        <button data-testid=\"jump-laphet\" onClick={() => scrollToItem(\"laphet-thoke\")}>\n          လက်ဖက်သုပ်ဆီ သွားမယ်\n        </button>\n        <button className=\"secondary\" data-testid=\"add-special\" onClick={handleAdd}>\n          အသစ်ထည့်မယ်\n        </button>\n      </div>\n      <ul className=\"list specials\" data-testid=\"specials-list\">\n        {items.map((item) => (\n"
      - id: type-ref-callback
        type: editor.type
        at: { mark: type-ref-callback }
        cadence: line-by-line
        target:
          { file: src/SpecialsList.jsx, after: "        {items.map((item) => (\n", occurrence: 1 }
        text: "          <li\n            key={item.id}\n            data-testid={\"special-\" + item.id}\n            ref={(node) => {\n              itemsRef.current.set(item.id, node);\n              return () => itemsRef.current.delete(item.id);\n            }}\n          >\n            {item.name}\n          </li>\n        ))}\n      </ul>\n    </section>\n  );\n}\n"
      - id: select-cleanup
        type: editor.select
        at: { mark: select-cleanup }
        target:
          {
            file: src/SpecialsList.jsx,
            text: "return () => itemsRef.current.delete(item.id);",
            occurrence: 1,
          }

  # ------------------------------------------------------------------ 8
  - id: specials-flush
    narration: >
      အသစ်ထည့်မယ့် ခလုတ်ကတော့ ဟင်းလျာ အသစ် ထည့်ပြီး သူ့ဆီ တန်း scroll လုပ်ရမှာပါ။
      [[mark:type-flush-import]] ဒါအတွက် flushSync ကို import လုပ်ပါတယ်။ DOM နဲ့
      ဆိုင်တဲ့ အလုပ် ဖြစ်လို့ react-dom ဆီက လာတာပါ။ [[mark:type-handle-add]]
      handler က counter ထဲက နောက် နံပါတ်နဲ့ ဟင်းလျာ အသစ် တည်ဆောက်ပြီး counter ကို
      တိုးပါတယ်။ ပြီးတော့ state ထဲက list ထဲ ထည့်ပြီး၊ အဲဒီ id နဲ့ သူ့ဆီ scroll
      လုပ်ပါတယ်။ [[mark:select-flushsync]] ဒီ flushSync ကို ကြည့်ပါ။ မပါရင် state
      ပြောင်းရုံနဲ့ DOM က ချက်ချင်း မပြောင်းသေးလို့၊ နောက် စာကြောင်းမှာ item အသစ်
      မရှိသေးတာ ဖြစ်မှာပါ။ [[mark:flush-explain]] flushSync ကတော့ နောက် စာကြောင်း
      မရောက်ခင် DOM ကို အရင် ပြင်ခိုင်းတာပါ။ [[mark:open-app-specials]]
      SpecialsList ကို import လုပ်ပါတယ်။ [[mark:wire-specials-use]] ပြီးတော့
      ခေါင်းစဉ် အောက်မှာ ထည့်ပါတယ်။ [[mark:click-jump]] လက်ဖက်သုပ်ဆီ
      သွားကြည့်ရအောင်။ [[mark:after-jump]] list က သူ့ဆီ scroll ဆင်းသွားပါပြီ။
      [[mark:click-add]] အသစ် ထည့်ကြည့်ရအောင်။ [[mark:after-add]] row အသစ် တစ်ခု
      အောက်ဆုံးမှာ ပေါ်လာပြီး၊ list ကလည်း သူ့ဆီ တန်း scroll ဆင်းသွားပါတယ်။
    sources:
      - title: "React — flushSync"
        url: "https://react.dev/reference/react-dom/flushSync"
      - title: "React — Flushing state updates synchronously with flushSync"
        url: "https://react.dev/learn/manipulating-the-dom-with-refs#flushing-state-updates-synchronously-with-flush-sync"
      - title: "React — Queueing a Series of State Updates"
        url: "https://react.dev/learn/queueing-a-series-of-state-updates"
    actions:
      - id: type-flush-import
        type: editor.type
        at: { mark: type-flush-import }
        cadence: fast-explainer
        target:
          {
            file: src/SpecialsList.jsx,
            after: "import { useRef, useState } from \"react\";\n",
            occurrence: 1,
          }
        text: "import { flushSync } from \"react-dom\";\n"
      - id: type-handle-add
        type: editor.type
        at: { mark: type-handle-add }
        cadence: line-by-line
        target:
          {
            file: src/SpecialsList.jsx,
            after: "    node.scrollIntoView({ behavior: \"smooth\", block: \"nearest\" });\n  }\n",
            occurrence: 1,
          }
        text: "\n  function handleAdd() {\n    const next = {\n      id: \"new-\" + nextId,\n      name: \"အထူး ဟင်းလျာ \" + nextId,\n    };\n    nextId++;\n    flushSync(() => {\n      setItems([...items, next]);\n    });\n    scrollToItem(next.id);\n  }\n"
      - id: select-flushsync
        type: editor.select
        at: { mark: select-flushsync }
        target:
          {
            file: src/SpecialsList.jsx,
            text: "    flushSync(() => {\n      setItems([...items, next]);\n    });\n",
            occurrence: 1,
          }
      - id: open-app-specials
        type: workspace.openFile
        at: { mark: open-app-specials }
        path: src/App.jsx
      - id: wire-specials-import
        type: editor.type
        at: { afterAction: open-app-specials }
        cadence: block
        target:
          { file: src/App.jsx, after: "import NoteBox from \"./NoteBox.jsx\";\n", occurrence: 1 }
        text: "import SpecialsList from \"./SpecialsList.jsx\";\n"
      - id: wire-specials-use
        type: editor.type
        at: { mark: wire-specials-use }
        cadence: block
        target: { file: src/App.jsx, after: "      <Header />\n", occurrence: 1 }
        text: "      <SpecialsList />\n"
      - id: expect-specials-list
        type: expect.preview
        at: { mark: click-jump, offsetMs: -700 }
        timeoutMs: 5000
        target: { by: testId, value: special-mohinga }
        textContains: "မုန့်ဟင်းခါး"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: click-jump
        type: preview.click
        at: { mark: click-jump }
        timeoutMs: 5000
        target: { by: testId, value: jump-laphet }
        retry: { maxAttempts: 1, delayMs: 0 }
      # Presence check only: the <li> existed before the click; the scroll
      # itself was checked by hand in headless Chrome (DESIGN.md).
      - id: expect-jumped
        type: expect.preview
        at: { mark: after-jump }
        timeoutMs: 5000
        target: { by: testId, value: special-laphet-thoke }
        textContains: "လက်ဖက်သုပ်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: click-add
        type: preview.click
        at: { mark: click-add }
        timeoutMs: 5000
        target: { by: testId, value: add-special }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-added
        type: expect.preview
        at: { mark: after-add }
        timeoutMs: 5000
        target: { by: testId, value: special-new-1 }
        textContains: "အထူး ဟင်းလျာ 1"
        retry: { maxAttempts: 3, delayMs: 300 }

  # ------------------------------------------------------------------ 9
  - id: flush-board
    narration: >
      [[mark:board-flush]] ပုံမှန်ဆိုရင် state ပြောင်းတာက update ကို တန်းစီ
      ထားရုံပါ။ handler ပြီးမှ React က update အားလုံးကို render တစ်ကြိမ်တည်းနဲ့
      လုပ်ပြီး၊ ဒါကို batching လို့ ခေါ်ပါတယ်။ [[mark:draw-flush-sync]] flushSync
      ကတော့ ချက်ချင်း render လုပ်လို့၊ နောက် စာကြောင်းက element အသစ်ကို
      တန်းမြင်ရပါတယ်။ [[mark:draw-flush-warning]] ဒါပေမဲ့ ခဏခဏ မသုံးပါနဲ့။
      batching ကို ကျော်ရင် app ပိုနှေးသွားနိုင်လို့ပါ။
    sources:
      - title: "React — flushSync: Caveats"
        url: "https://react.dev/reference/react-dom/flushSync#caveats"
      - title: "React — Queueing a Series of State Updates"
        url: "https://react.dev/learn/queueing-a-series-of-state-updates"
    actions:
      - id: board-flush
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        maximized: true
        clear: true
        upsertIds: [b4-title]
      - id: draw-flush-normal
