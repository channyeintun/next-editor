        cadence: block
        target:
          {
            file: src/App.jsx,
            after: "  const [searchStatus, setSearchStatus] = useState(\"\");\n",
            occurrence: 1,
          }
        text: "  const noteRef = useRef(null);\n"
      - id: wire-note-jsx
        type: editor.type
        at: { mark: wire-note-jsx }
        cadence: block
        target: { file: src/App.jsx, after: "      <Header />\n", occurrence: 1 }
        text: "      <section className=\"card\">\n        <NoteBox ref={noteRef} />\n        <div className=\"row\">\n          <button data-testid=\"note-focus\" onClick={() => noteRef.current.focus()}>\n            ရေးမယ်\n          </button>\n          <button data-testid=\"note-clear\" onClick={() => noteRef.current.clear()}>\n            ဖျက်မယ်\n          </button>\n        </div>\n      </section>\n"
      - id: type-note-text
