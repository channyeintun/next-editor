# React crash course, lesson 6 — Refs and the DOM (Burmese, my-MM).
#
# Story: a ref is a box React keeps between renders whose change never
# re-renders. A waiting-time stopwatch keeps its interval id in a ref; a
# SearchInput takes ref as an ordinary prop (React 19, no forwardRef) and a
# button focuses it; a NoteBox exposes only focus() and clear() through
# useImperativeHandle; today's specials list tracks its <li> nodes in a Map
# through ref callbacks that return a cleanup (React 19), jumps to a dish, and
# adds a special inside flushSync so the new row exists before it is scrolled
# to; an order modal is rendered into document.body with createPortal. The
# close names what React 19 removed (string refs, findDOMNode) and what is
# legacy (forwardRef, element.ref).
#
# Insert-only plan: every new component (Stopwatch, SearchInput, NoteBox,
# SpecialsList, OrderModal) is pinned EMPTY and typed while nothing imports
# it (keystrokes only on short, shallow lines; the rest line by line). App.jsx
# is live, so it only takes `block` inserts of complete lines: the import
# first, then hooks, then the JSX. New sections go directly under <Header />,
# so the newest demo is always at the top of the 432 px preview. Every App
# edit reloads the preview, so every click comes after the last edit.
#
# The dev server starts during the first board (install + boot take time) and
# is waited on only when the preview opens, about two minutes later.
#
# Narration is Burmese (my-MM). voice-script.md next to this file is the
# editable source of the narration (tools/sync_check.py re-wraps it into this
# YAML and checks marks and span lengths against the English draft in
# tools/narration-en.txt); every visible string (title, chapters, board
# labels, UI) is Burmese too.
