  - id: non-functional
    narration: >
      [[mark:close-f]] ဖိုင်ထဲမှာ ရေးကြည့်ရအောင်။ [[mark:type-nfr]] ဒီ အပိုင်းမှာ app ဘယ်လောက် ကောင်းရမလဲ ဆိုတာကို
      ဆိုင်ရဲ့ customer တွေ တကယ် သုံးမယ့် ပုံစံကို ကြည့်ပြီး ငါးကြောင်း ရေးပါတယ်။ တစ်ကြောင်းချင်းက ဘာကို
      ဆုံးဖြတ်ထားလဲ ကြည့်ရအောင်။
      [[mark:sel-nfr-speed]] ပထမ စာကြောင်းက app ဘယ်လောက် မြန်ရမလဲ ဆိုတာကို ဆုံးဖြတ်ထားတာပါ။ ကိုယ့်ရဲ့ မြန်တဲ့
      ဖုန်းမှာ မဟုတ်ဘဲ၊ မောင်မောင် လို customer တွေ တကယ် ကိုင်တဲ့ ဖုန်း၊ တကယ် သုံးတဲ့ data နဲ့ စစ်ရမှာပါ။
      [[mark:sel-nfr-burmese]] ဒုတိယ စာကြောင်းက မြန်မာ customer တွေအတွက်ပါ။ စာတွေ ဖုန်းတိုင်းမှာ Unicode
      လို့ ခေါ်တဲ့ စံအတိုင်း မှန်မှန် ပေါ်ဖို့ တင်မကဘဲ၊ မြန်မာ keyboard နဲ့ ရိုက်တဲ့သူတွေက ဂဏန်းကိုလည်း မြန်မာဂဏန်းနဲ့
      ရိုက်တတ်လို့ အဲဒါကိုပါ ထည့်တောင်းထားပါတယ်။ [[mark:sel-nfr-phone]] တတိယ စာကြောင်းက customer ရဲ့ ဖုန်းနံပါတ်ကို ကာကွယ်ပေးတာပါ။
      ဖုန်းနံပါတ်ကို ဘယ်မှာ ပြမလဲ၊ ဘယ်သူ ကြည့်ခွင့် ရှိမလဲ ဆိုတာကို ဒီ စာကြောင်းက ဆုံးဖြတ်ပေးပါတယ်။
      [[mark:sel-nfr-text]] စတုတ္ထ စာကြောင်းကတော့ မျက်စိ အားနည်းလို့ ဖုန်းမှာ စာလုံးကို ချဲ့ထားတဲ့ customer တွေကို
      မမေ့ဖို့ပါ။ စာလုံး ကြီးသွားရင်လည်း စာတွေ၊ ခလုတ်တွေ မပျောက်ဘဲ သုံးလို့ ရရပါမယ်။ [[mark:sel-nfr-cost]]
      နောက်ဆုံး စာကြောင်းက app ကို အမြဲ အလုပ်လုပ်နေအောင် run ထားဖို့ တစ်လ ကုန်ကျစရိတ်ကို ကန့်သတ်ထားတာပါ။ ဆိုင်က
      တကယ် ပေးနိုင်တဲ့ ပမာဏကို ဆိုင်ပိုင်ရှင် နဲ့ တိုင်ပင်ပြီး ရွေးထားလို့၊ agent က လစဉ် ငွေပေးရတဲ့ ဈေးကြီး service တစ်ခုကို
      ရွေးလာရင် ဒီ စာကြောင်းနဲ့ တိုက်စစ်လို့ ရပါတယ်။
    sources:
      - {
          title: "Unicode code chart: Myanmar (U+1000–U+109F), digits U+1040–U+1049",
          url: "https://www.unicode.org/charts/PDF/U1000.pdf",
        }
      - {
          title: "W3C WAI: Understanding Success Criterion 1.4.4 Resize Text",
          url: "https://www.w3.org/WAI/WCAG22/Understanding/resize-text.html",
        }
      - {
          title: "ISO/IEC 25010 (product quality model), iso25000.com",
          url: "https://iso25000.com/index.php/en/iso-25000-standards/iso-25010",
        }
    actions:
      - { id: close-f, type: whiteboard.apply, at: { mark: close-f }, open: false }
      - id: type-nfr
        type: editor.type
        at: { mark: type-nfr }
        target: { file: docs/requirements.md, after: "app က အလုပ်ဖြစ်မဖြစ် သိမယ်။\n\n", occurrence: 1 }
        text: "## Non-functional\n- ဈေးပေါတဲ့ Android ဖုန်း၊ နှေးတဲ့ mobile data မှာ 3 စက္ကန့်အတွင်း ပွင့်ရမယ်။\n- မြန်မာစာ မှန်မှန် ပေါ်ရမယ်။ မြန်မာဂဏန်းနဲ့ ရိုက်ရင်လည်း လက်ခံရမယ်။\n- customer ရဲ့ ဖုန်းနံပါတ်ကို ဆိုင်ကလွဲရင် ဘယ်သူမှ မမြင်ရဘူး။\n- စာလုံး ကြီးကြီးနဲ့ ဖတ်တဲ့သူလည်း သုံးလို့ရရမယ်။\n- run ဖို့ တစ်လ 30,000 ကျပ်ထက် မကုန်ရဘူး။\n\n"
        cadence: line-by-line
      - {
          id: expect-nfr,
          type: expect.file,
          at: { afterAction: type-nfr },
          path: docs/requirements.md,
          contains: "- ဈေးပေါတဲ့ Android ဖုန်း၊ နှေးတဲ့ mobile data မှာ 3 စက္ကန့်အတွင်း ပွင့်ရမယ်။",
        }
      - {
          id: sel-nfr-speed,
          type: editor.select,
          at: { mark: sel-nfr-speed },
          target:
            {
              file: docs/requirements.md,
              text: "- ဈေးပေါတဲ့ Android ဖုန်း၊ နှေးတဲ့ mobile data မှာ 3 စက္ကန့်အတွင်း ပွင့်ရမယ်။",
              occurrence: 1,
            },
        }
      - {
          id: sel-nfr-burmese,
          type: editor.select,
          at: { mark: sel-nfr-burmese },
          target:
            {
              file: docs/requirements.md,
              text: "- မြန်မာစာ မှန်မှန် ပေါ်ရမယ်။ မြန်မာဂဏန်းနဲ့ ရိုက်ရင်လည်း လက်ခံရမယ်။",
              occurrence: 1,
            },
        }
      - {
          id: sel-nfr-phone,
          type: editor.select,
          at: { mark: sel-nfr-phone },
          target:
            {
              file: docs/requirements.md,
              text: "- customer ရဲ့ ဖုန်းနံပါတ်ကို ဆိုင်ကလွဲရင် ဘယ်သူမှ မမြင်ရဘူး။",
              occurrence: 1,
            },
        }
      - {
          id: sel-nfr-text,
          type: editor.select,
          at: { mark: sel-nfr-text },
          target:
            { file: docs/requirements.md, text: "- စာလုံး ကြီးကြီးနဲ့ ဖတ်တဲ့သူလည်း သုံးလို့ရရမယ်။", occurrence: 1 },
        }
      - {
          id: sel-nfr-cost,
          type: editor.select,
          at: { mark: sel-nfr-cost },
          target:
            { file: docs/requirements.md, text: "- run ဖို့ တစ်လ 30,000 ကျပ်ထက် မကုန်ရဘူး။", occurrence: 1 },
        }

  - id: constraints
    narration: >
      [[mark:type-con]] နောက်ဆုံး အပိုင်းကတော့ constraint တွေပါ။ constraint ဆိုတာ ကိုယ်တို့ ရွေးလို့ မရတဲ့
      ကန့်သတ်ချက်တွေပါ။ ဥပမာ လူ၊ အချိန်၊ ငွေ စတာတွေပါ။ ငွေ ဘယ်လောက် သုံးနိုင်လဲ ဆိုတဲ့ budget ကတော့ ခုနက နောက်ဆုံး
      စာကြောင်းမှာ ပါပြီးသားပါ။ [[mark:sel-con-one]] ပထမ စာကြောင်းက လူအင်အားနဲ့ ပတ်သက်တဲ့ ကန့်သတ်ချက်ပါ။ ဆောက်ဖို့ရော၊
      ပြီးရင် ဆက်ထိန်းဖို့ရော ကိုယ် တစ်ယောက်တည်းပဲ ရှိပါတယ်။ ဒါကြောင့် ဖြေရှင်းနည်း တစ်ခု ရွေးတိုင်း၊ ကိုယ် တစ်ယောက်တည်း ထိန်းနိုင်မလား
      ဆိုတာကို မေးရပါမယ်။ [[mark:sel-con-rest]]
      ကျန်တဲ့ နှစ်ကြောင်းက ငွေချေပုံနဲ့ ဆိုင်ဖွင့်ချိန်ပါ။ ဒါတွေက app ကြောင့် ပြောင်းမှာ မဟုတ်တဲ့ ဆိုင်ရဲ့ အလုပ်လုပ်ပုံ ဖြစ်ပြီး၊
      agent က ခန့်မှန်းလို့ ရတဲ့ အရာတွေ မဟုတ်ပါဘူး။ ဥပမာ စနေ
      တနင်္ဂနွေမှာ ဖွင့်ချိန် မတူတာကို ဒီမှာ မရေးထားရင်၊ agent ဆီ မရောက်သလို နောက်မှ ဝင်လာမယ့် လူ အသစ်လည်း
      သိမှာ မဟုတ်ပါဘူး။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The new SDLC (requirements and planning)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - id: type-con
        type: editor.type
        at: { mark: type-con }
        target: { file: docs/requirements.md, after: "30,000 ကျပ်ထက် မကုန်ရဘူး။\n\n", occurrence: 1 }
        text: "## Constraints\n- app ကို ကိုယ်တစ်ယောက်တည်း AI agent နဲ့ တည်ဆောက်မယ်။\n- ငွေကို ကောင်တာမှာပဲ ချေမယ်။\n- ဆိုင်ဖွင့်ချိန် — တနင်္လာ–သောကြာ 6:00–20:00၊ စနေ–တနင်္ဂနွေ 7:00–21:00\n"
        cadence: line-by-line
      - {
          id: expect-con,
          type: expect.file,
          at: { afterAction: type-con },
          path: docs/requirements.md,
          contains: "- ငွေကို ကောင်တာမှာပဲ ချေမယ်။",
        }
      - {
          id: sel-con-one,
          type: editor.select,
          at: { mark: sel-con-one },
          target:
            {
              file: docs/requirements.md,
              text: "- app ကို ကိုယ်တစ်ယောက်တည်း AI agent နဲ့ တည်ဆောက်မယ်။",
              occurrence: 1,
            },
        }
      - {
          id: sel-con-rest,
          type: editor.select,
          at: { mark: sel-con-rest },
          target:
            {
              file: docs/requirements.md,
              text: "- ငွေကို ကောင်တာမှာပဲ ချေမယ်။\n- ဆိုင်ဖွင့်ချိန် — တနင်္လာ–သောကြာ 6:00–20:00၊ စနေ–တနင်္ဂနွေ 7:00–21:00\n",
              occurrence: 1,
            },
        }

  - id: quiz
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ တစ်ယောက်ယောက်က non functional requirement နှစ်ကြောင်း ရေးလာတယ်
      ဆိုပါစို့။ ပထမ တစ်ကြောင်းက စာမျက်နှာ မြန်မြန် ပွင့်ရမယ် လို့ ရေးထားပြီး၊ ဒုတိယ တစ်ကြောင်းက အော်ဒါ အသစ်ကို
      ကောင်တာက တစ်မိနစ်အတွင်း မြင်ရမယ် လို့ ရေးထားပါတယ်။ ဘယ် တစ်ကြောင်းကို ပြန်ရေးဖို့ လိုလဲ။ lesson ကို pause
      လုပ်ပြီး စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] အဖြေကတော့ ပထမ တစ်ကြောင်းပါ။ ဘာကြောင့်လဲဆိုတော့ အဲဒီ
      စာကြောင်းကို စစ်လို့ မရလို့ပါ။ ဘယ်လောက် မြန်ရမလဲ၊ ဘယ်ဖုန်း၊ ဘယ် network ပေါ်မှာလဲ ဆိုတာ မပါပါဘူး။ ဒီအတိုင်း
      ပေးလိုက်ရင် agent က သူ စမ်းတဲ့ ကွန်ပျူတာပေါ်မှာ မြန်နေရုံနဲ့ ပြီးပြီ ဆိုတဲ့ အဖြေ ပြန်ပေးနိုင်ပါတယ်။ ဒုတိယ
      တစ်ကြောင်းမှာတော့ ဘယ်လောက် အချိန်အတွင်း၊ ဘယ်သူ မြင်ရမလဲ ဆိုတာ ပါလို့ တိုင်းကြည့်လို့ ရပါတယ်။
    sources:
      - {
          title: "Agile Alliance: What does INVEST Stand For?",
          url: "https://www.agilealliance.org/glossary/invest/",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [z-title, z-q, z-o1, z-o2, z-o2b],
          drawMs: 2200,
        }
      - {
          id: draw-quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [z-a, z-r1],
          drawMs: 1300,
