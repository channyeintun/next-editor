# AI Builder, lesson 05: finding and writing requirements (Burmese, docs kind).
#
# Start state (ws/): base-docs (package.json with a no-op dev script, notes.md), docs/problem.md pinned
# in full (COURSE-KIT §4.1, as L04 leaves it) and docs/requirements.md pinned with only its title line.
# Nothing runs. The lesson types COURSE-KIT §4.2 from User stories through Constraints, one section per
# action (the stories in two actions), interleaved with four boards.
#
# Boards: (R) where requirements come from: four people (white) → requirements.md (blue); the agent
# suggests (violet) → people decide (orange); (S) one story taken apart: who / what (blue) / why
# (orange); (F) functional (blue) vs non functional (orange), with the agent note in violet; (Z) quiz.
# Typed: User stories (2 + 2) · Non-functional (5) · Constraints (3).
#
# Build: bun ~/Documents/ai-builder-course-work/tools/build-lesson.ts template.yaml ws ai-builder-05-requirements.yaml
schemaVersion: 1
lesson:
  slug: ai-builder-05-requirements
  title: "AI Builder 05: Requirement တွေကို ရှာဖွေ ရေးသားခြင်း"
  locale: my-MM
  workspace:
    lessonType: javascript
    name: AI Builder
    entryFilePath: docs/problem.md
    sidebarStartsCollapsed: true
    files:
      docs/problem.md: |
        # Problem · ကြိုမှာ app

        ## Problem
        မနက် 7 နာရီကနေ 9 နာရီကြား ဆိုင်မှာ တန်းစီရတာ ကြာလို့၊ အလုပ်သွားမယ့် customer တွေ မဝယ်ဘဲ ပြန်ထွက်သွားကြတယ်။

        ## Who
        - အလုပ်မသွားခင် မနက်တိုင်း လာဝယ်တဲ့ member တွေ၊ ဥပမာ အောင်အောင်
        - အချိန်ကျပ်တဲ့ ကျောင်းသားတွေ၊ ဥပမာ မောင်မောင်
        - ကောင်တာမှာ အော်ဒါ လက်ခံတဲ့ လှလှ

        ## Today
        - တန်းစီ၊ ကောင်တာမှာ မှာ၊ ပြီးမှ ထပ်စောင့်ရတယ်။
        - တချို့က ဖုန်းဆက်ပြီး ကြိုမှာကြတယ်။ ဒါပေမဲ့ လှလှ က ဖုန်းကိုင်နေရင် ကောင်တာက လူတွေ ပိုစောင့်ရတယ်။

        ## Why it matters
        - လှလှ ရဲ့ မှတ်စုအရ မနက်တိုင်း customer 10 ယောက်လောက် မဝယ်ဘဲ ပြန်သွားတယ်။

        ## How we'll know
        - မဝယ်ဘဲ ပြန်သွားတဲ့ customer — တစ်မနက် 3 ယောက်အောက်
        - ကြိုမှာတဲ့ အော်ဒါ — တစ်မနက် 20 နဲ့ အထက်
        - ဖုန်းနဲ့ ကြိုမှာတာ — တဖြည်းဖြည်း နည်းလာ

        ## Not the problem
        - ဈေးနှုန်းနဲ့ အရသာ — customer တွေ ကြိုက်ပြီးသား
        - delivery — ဒီတစ်ခါ မဖြေရှင်းသေးဘူး
      docs/requirements.md: |+
        # Requirements · ကြိုမှာ app

