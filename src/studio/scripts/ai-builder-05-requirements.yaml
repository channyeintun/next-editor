  - id: recap
    chapter: ပြန်ချုပ်ရရင်
    narration: >
      [[mark:close-quiz]] ဒါဆို ပြန်ချုပ်ရရင်၊ requirement တွေကို app သုံးမယ့် လူတွေဆီကနေ ရှာပြီး၊ agent ရဲ့ အကြံတွေကို
      လူတွေနဲ့ တိုက်စစ်ပြီးမှ ဆုံးဖြတ်ပါတယ်။ [[mark:sel-why-recap]] user story တိုင်းမှာ ဘယ်သူ၊ ဘာ၊ ဘာကြောင့် ပါရပြီး၊
      ဘာကြောင့်လဲ ဆိုတဲ့ အပိုင်းကို မဖြုတ်ပါနဲ့။ [[mark:sel-nfr-recap]] ဘယ်လောက် ကောင်းရမလဲ ဆိုတဲ့ non functional
      requirement တွေကို စစ်လို့ရအောင် အတိအကျ ရေးပါ။ [[mark:sel-con-recap]] ရွေးလို့ မရတဲ့ constraint တွေကိုလည်း
      ရေးထားပါ။ နောက် lesson မှာတော့ ဒီ စာရင်းထဲက အရာ အားလုံးကို ပထမ version မှာ တစ်ခါတည်း မဆောက်နိုင်လို့၊ ဘာကို
      အရင် ဆောက်မလဲ ဆိုတဲ့ scope နဲ့ MVP ကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "GOV.UK Service Manual: Writing user stories",
          url: "https://www.gov.uk/service-manual/agile-delivery/writing-user-stories",
        }
      - {
          title: "The New SDLC (Burmese edition): The new SDLC (requirements and planning)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: close-quiz }, open: false }
      - {
          id: sel-why-recap,
          type: editor.select,
          at: { mark: sel-why-recap },
          target: { file: docs/requirements.md, text: "ဒါမှ တန်းမစီရဘဲ ယူသွားလို့ရမယ်။", occurrence: 1 },
        }
      - {
          id: sel-nfr-recap,
          type: editor.select,
          at: { mark: sel-nfr-recap },
          target:
            {
              file: docs/requirements.md,
              text: "- ဈေးပေါတဲ့ Android ဖုန်း၊ နှေးတဲ့ mobile data မှာ 3 စက္ကန့်အတွင်း ပွင့်ရမယ်။",
              occurrence: 1,
            },
        }
      - {
          id: sel-con-recap,
          type: editor.select,
          at: { mark: sel-con-recap },
          target: { file: docs/requirements.md, text: "## Constraints", occurrence: 1 },
        }
checks:
  - { type: timing.p95Ms, max: 300 }
