build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 6105
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}
scenes:
  - id: recall
    chapter: Problem ကနေ requirement ဆီ
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ ဖြေရှင်းနည်း မပြောခင် ပြဿနာကို အရင် ရေးခဲ့ပါတယ်။ editor ထဲက problem ဖိုင်မှာ
      ဘယ်သူ့မှာ ဘာပြဿနာ ရှိလဲ၊ ပြေပြီလား ဘယ်လို သိမလဲ ဆိုတာတွေ ရှိနေပါပြီ။ [[mark:sel-problem]] ဒီ
      စာမျက်နှာက ဘာကြောင့် ဆောက်မလဲ ဆိုတာကို ပြောပါတယ်။ ဒါပေမဲ့ app က ဘာတွေ လုပ်ပေးရမလဲ ဆိုတာကိုတော့ မပြောသေးပါဘူး။
      ဒီ စာမျက်နှာ တစ်ခုတည်းကို agent ဆီ ပေးလိုက်ရင်၊ ကျန်နေတဲ့ ကွက်လပ်တွေကို agent က ခန့်မှန်းပြီး ဖြည့်ပါလိမ့်မယ်။
      [[mark:req-gloss]] ဒါကြောင့် ဒီနေ့ requirement တွေကို ရှာပြီး ရေးကြည့်ပါမယ်။ requirement ဆိုတာ product က
      ဘာတွေ လုပ်ပေးရမလဲ၊ ဘယ်လောက် ကောင်းကောင်း လုပ်ပေးရမလဲ ဆိုတာကို ရေးထားတာပါ။ ဥပမာ လာယူမယ့် အချိန်ကို
      ရွေးလို့ ရရမယ် ဆိုတာက app ဘာလုပ်ရမလဲ ဆိုတဲ့ requirement ပါ။ customer ရဲ့ ဖုန်းနံပါတ်ကို ဆိုင်ကပဲ မြင်ရမယ်
      ဆိုတာကတော့ ဘယ်လောက် လုံခြုံရမလဲ ဆိုတဲ့ ဘက်က requirement ပါ။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The new SDLC (requirements and planning)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "ISO/IEC 25010 (product quality model), iso25000.com",
          url: "https://iso25000.com/index.php/en/iso-25000-standards/iso-25010",
        }
    actions:
      - {
          id: sel-problem,
          type: editor.select,
          at: { mark: sel-problem },
          target:
            {
              file: docs/problem.md,
              text: "မနက် 7 နာရီကနေ 9 နာရီကြား ဆိုင်မှာ တန်းစီရတာ ကြာလို့၊",
              occurrence: 1,
            },
        }

  - id: sources
    chapter: Requirement ဘယ်က လာလဲ
    narration: >
      [[mark:r-title]] requirement တွေကို ကိုယ့်ခေါင်းထဲကနေ ထုတ်ရေးတာ မဟုတ်ပါဘူး။ app ကို တကယ် သုံးမယ့်သူ၊
      ဂရုစိုက်မယ့်သူတွေဆီကနေ ရှာရပါတယ်။ [[mark:r-people]] ကိုယ်တို့ ဆိုင်မှာဆိုရင် ဘာကို အရင်လုပ်မလဲ ဆုံးဖြတ်မယ့်
      ဆိုင်ပိုင်ရှင်၊ အော်ဒါ လက်ခံမယ့် ကောင်တာက လှလှ၊ မနက်တိုင်း လာဝယ်တဲ့ member အောင်အောင်၊ ဈေးပေါတဲ့
      ဖုန်း ကိုင်ထားတဲ့ ကျောင်းသား မောင်မောင် တို့ပါ။ ပြီးခဲ့တဲ့ lesson မှာ ပြောခဲ့သလို၊ သူတို့ကို တကယ် ဖြစ်ခဲ့တဲ့
      မနက်တွေ အကြောင်း မေးခဲ့ပြီး၊ ဆိုင်မှာလည်း ကိုယ်တိုင် သွားကြည့်ခဲ့ပါတယ်။ [[mark:r-doc]] ကြားခဲ့၊ မြင်ခဲ့တာတွေကို requirements ဖိုင်
      တစ်ခုထဲမှာ စုရေးပါမယ်။ [[mark:r-agent]] agent ကိုလည်း အကူအညီ အဖြစ် သုံးလို့ ရပါတယ်။ problem ဖိုင်ကို ပေးပြီး ဖြစ်နိုင်တဲ့
      requirement တွေကို စာရင်း လုပ်ခိုင်းရင် ခဏလေးနဲ့ ထုတ်ပေးနိုင်ပြီး၊ ကိုယ် မေ့နေတာတွေကိုလည်း စာရင်းထဲမှာ ထည့်ပြပေးနိုင်ပါတယ်။
      [[mark:r-decide]] ဒါပေမဲ့ အဲဒီ စာရင်းက အကြံပြုချက်ပဲ ဖြစ်ပါတယ်။ agent က ကိုယ်တို့ ဆိုင်ကို တကယ် မသိဘဲ
      ထုတ်ပေးတာမို့၊ ဘယ်ဟာ မှန်လဲ၊ ဘယ်ဟာ လိုလဲ ဆိုတာကို လူတွေကို ပြန်မေးပြီး ကိုယ်တို့ပဲ ဆုံးဖြတ်ရပါမယ်။
    sources:
      - {
          title: "GOV.UK Service Manual: Learning about users and their needs",
          url: "https://www.gov.uk/service-manual/user-research/start-by-learning-user-needs",
        }
      - {
          title: "The New SDLC (Burmese edition): The new SDLC (requirements and planning)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: draw-r-title,
          type: whiteboard.apply,
          at: { mark: r-title },
          open: true,
          clear: true,
          upsertIds: [r-title],
        }
      - {
          id: draw-r-people,
          type: whiteboard.apply,
          at: { mark: r-people },
          upsertIds: [r-p1, r-p2, r-p3, r-p4],
          drawMs: 2400,
        }
      - {
          id: draw-r-doc,
          type: whiteboard.apply,
          at: { mark: r-doc },
          upsertIds: [r-arrow, r-doc-box, r-doc],
          drawMs: 1300,
        }
      - {
          id: draw-r-agent,
          type: whiteboard.apply,
          at: { mark: r-agent },
          upsertIds: [r-agent-box, r-agent],
          drawMs: 1100,
        }
      - {
          id: draw-r-decide,
          type: whiteboard.apply,
          at: { mark: r-decide },
          upsertIds: [r-arrow2, r-decide],
          drawMs: 1100,
        }

  - id: suggestion
    narration: >
      [[mark:close-r]] ဥပမာ agent ထုတ်ပေးတဲ့ စာရင်းထဲမှာ delivery ကို မြေပုံပေါ်မှာ လိုက်ကြည့်လို့ ရတဲ့ စာမျက်နှာ
      တစ်ခု ပါလာတယ် ဆိုပါစို့။ [[mark:sel-delivery]] problem ဖိုင်ရဲ့ နောက်ဆုံး အပိုင်းမှာ delivery က ဒီတစ်ခါ
      ဖြေရှင်းမယ့် ပြဿနာ မဟုတ်ဘူး ဆိုတာကို ဆိုင်ပိုင်ရှင် နဲ့ သဘောတူပြီး ရေးထားခဲ့ပါတယ်။ ဒါကြောင့် အဲဒီ အကြံ ဘယ်လောက် ကောင်းနေပါစေ၊ ဒီတစ်ခါ
      requirement ထဲကို မထည့်ပါဘူး။ ကိုယ်တို့ ရေးထားတဲ့ စာမျက်နှာတွေက agent ရဲ့ အကြံကို စစ်တဲ့ စံ ဖြစ်လာတာပါ။
    sources:
      - {
          title: "GOV.UK Service Manual: Learning about users and their needs",
          url: "https://www.gov.uk/service-manual/user-research/start-by-learning-user-needs",
        }
    actions:
      - { id: close-r, type: whiteboard.apply, at: { mark: close-r }, open: false }
      - {
          id: sel-delivery,
          type: editor.select,
          at: { mark: sel-delivery },
          target: { file: docs/problem.md, text: "- delivery — ဒီတစ်ခါ မဖြေရှင်းသေးဘူး", occurrence: 1 },
        }

  - id: stories
    chapter: User story
    narration: >
      [[mark:open-req]] အခု requirements ဖိုင်ကို ကြည့်ရအောင်။ ခေါင်းစဉ်ပဲ ရှိပါသေးတယ်။ [[mark:type-stories]] ပထမ
      အပိုင်းမှာ user story တွေကို ရေးပါတယ်။ user story ဆိုတာ requirement ကို user ဘက်ကနေ ရေးတာပါ။ ဘယ်သူက၊ ဘာကို
      လိုချင်လဲ၊ ဘာကြောင့်လဲ ဆိုတာ စာကြောင်း တစ်ကြောင်းထဲမှာ ပါပါတယ်။ ဒီ နှစ်ကြောင်းကတော့ customer ဘက်ကနေ
      ရေးထားတာပါ။ [[mark:sel-story1]] ပထမ story ကို အပိုင်းလိုက် ခွဲကြည့်ရအောင်။
    sources:
      - {
          title: "GOV.UK Service Manual: Writing user stories",
          url: "https://www.gov.uk/service-manual/agile-delivery/writing-user-stories",
        }
      - {
          title: "Agile Alliance: What are User Stories?",
          url: "https://www.agilealliance.org/glossary/user-stories/",
        }
    actions:
      - {
          id: open-req,
          type: workspace.openFile,
          at: { mark: open-req },
          path: docs/requirements.md,
        }
      - id: type-stories
        type: editor.type
        at: { mark: type-stories }
        target:
          { file: docs/requirements.md, after: "# Requirements · ကြိုမှာ app\n\n", occurrence: 1 }
        text: "## User stories\n- Customer အနေနဲ့ ဆိုင်မရောက်ခင် ဖုန်းကနေ ကြိုမှာချင်တယ်၊ ဒါမှ တန်းမစီရဘဲ ယူသွားလို့ရမယ်။\n- Customer အနေနဲ့ လာယူမယ့် အချိန်ကို ရွေးချင်တယ်၊ ဒါမှ ရောက်တဲ့အချိန် အသင့်ဖြစ်နေမယ်။\n"
        cadence: line-by-line
      - {
          id: expect-story,
          type: expect.file,
          at: { afterAction: type-stories },
          path: docs/requirements.md,
          contains: "- Customer အနေနဲ့ ဆိုင်မရောက်ခင် ဖုန်းကနေ ကြိုမှာချင်တယ်၊ ဒါမှ တန်းမစီရဘဲ ယူသွားလို့ရမယ်။",
        }
      - {
          id: sel-story1,
          type: editor.select,
          at: { mark: sel-story1 },
          target:
            {
              file: docs/requirements.md,
              text: "- Customer အနေနဲ့ ဆိုင်မရောက်ခင် ဖုန်းကနေ ကြိုမှာချင်တယ်၊ ဒါမှ တန်းမစီရဘဲ ယူသွားလို့ရမယ်။",
              occurrence: 1,
            },
        }

  - id: story-apart
    narration: >
      [[mark:s-open]] user story တစ်ကြောင်းမှာ အပိုင်း သုံးပိုင်း ပါပါတယ်။ English စာတွေမှာ ဒီ ပုံစံကို
      အပေါ်က အတိုင်း တွေ့ရပါလိမ့်မယ်။ [[mark:s-who]] ပထမ အပိုင်းက ဘယ်သူ့ ဘက်ကနေ ရေးလဲ ဆိုတာပါ။
      [[mark:s-what]] ဒုတိယ အပိုင်းက အဲဒီ လူ ဘာလုပ်နိုင်ချင်လဲ ဆိုတာပါ။ app က ဘာလုပ်ပေးရမလဲ ဆိုတာကို ဒီ အပိုင်းက
      ပြပါတယ်။ [[mark:s-why]] တတိယ အပိုင်းကတော့ ဒါမှ ဆိုတဲ့ စကားလုံး နောက်က အကြောင်းရင်းပါ။ ဒီ story မှာဆိုရင်
      customer က ဖုန်းနဲ့ မှာချင်တာ ဖုန်းကို သဘောကျလို့ မဟုတ်ဘဲ၊ တန်းမစီချင်လို့ပါ။ ဒီ အပိုင်းက အရေးအကြီးဆုံးပါ။ [[mark:s-why2]] ဘာကြောင့်လဲဆိုတော့ ကြိုမှာလို့ ရသွားပေမယ့်၊
      ဆိုင်ရောက်တော့ အော်ဒါကို မပြင်ရသေးလို့ ထပ်စောင့်ရရင်၊ တန်းမစီရဘဲ ယူသွားဖို့ ဆိုတဲ့ ရည်ရွယ်ချက်ကတော့
      မအောင်မြင်ပါဘူး။ ဒုတိယ story က လာယူမယ့် အချိန်ကို ရွေးချင်တာလည်း ဒီ ရည်ရွယ်ချက်ကြောင့်ပါ။
      [[mark:s-note]] ဘာကြောင့်လဲ ဆိုတဲ့ အပိုင်းကို ရေးလို့ မရဘူး ဆိုရင်တော့၊ အဲဒီ story ကို တကယ် လိုရဲ့လား ပြန်မေးကြည့်ပါ။
    sources:
      - {
          title: "GOV.UK Service Manual: Writing user stories",
          url: "https://www.gov.uk/service-manual/agile-delivery/writing-user-stories",
        }
    actions:
      - {
          id: draw-s-open,
          type: whiteboard.apply,
          at: { mark: s-open },
          open: true,
          clear: true,
          upsertIds: [s-title, s-en],
        }
      - {
          id: draw-s-who,
          type: whiteboard.apply,
          at: { mark: s-who },
          upsertIds: [s-b1, s-who],
          drawMs: 1000,
        }
      - {
          id: draw-s-what,
          type: whiteboard.apply,
          at: { mark: s-what },
          upsertIds: [s-b2, s-what],
          drawMs: 1100,
        }
      - {
          id: draw-s-why,
          type: whiteboard.apply,
          at: { mark: s-why },
          upsertIds: [s-b3, s-why],
          drawMs: 1300,
        }
      - {
          id: draw-s-note,
          type: whiteboard.apply,
          at: { mark: s-note },
          upsertIds: [s-note],
          drawMs: 1200,
        }

  - id: stories-more
    narration: >
      [[mark:close-s]] ဒီ အပိုင်း သုံးပိုင်းနဲ့ပဲ requirements ဖိုင်ကို ဆက်ရေးရအောင်။ [[mark:type-stories-b]] ကျန်တဲ့ story နှစ်ကြောင်းကို ကောင်တာနဲ့
      ဆိုင်ပိုင်ရှင် ဘက်ကနေ ရေးပါတယ်။ app ကို customer တွေတင် သုံးတာ မဟုတ်လို့၊ လူ တစ်ယောက်ချင်းရဲ့ ဘက်ကနေ ရေးမှ
      လိုတာ မကျန်ခဲ့မှာပါ။ [[mark:sel-hla-story]] လှလှ ရဲ့ story က ကောင်တာမှာ အော်ဒါတွေ ဘယ်အစဉ်နဲ့ ပေါ်ရမလဲ ဆိုတာကို
      ဆုံးဖြတ်ပေးပါတယ်။ အော်ဒါ ဝင်တဲ့ အစဉ်အတိုင်း မဟုတ်ဘဲ customer လာမယ့် အချိန်အလိုက်ပါ။ အဲဒါမှ ဘယ်အော်ဒါကို
      အရင် ပြင်ရမလဲ လှလှ ချက်ချင်း မြင်ရမှာပါ။ ဒီလို အသေးစိတ်ကို မနက်တိုင်း ကောင်တာမှာ အလုပ်လုပ်နေတဲ့ လှလှ
      ဆီကပဲ ရနိုင်ပါတယ်။ ကိုယ့်ခေါင်းထဲကနေ ခန့်မှန်းလို့ မရသလို၊ agent ထုတ်ပေးတဲ့ စာရင်းထဲမှာ ပါလာရင်တောင်
      မှန်မမှန်ကို လှလှ ပဲ အတည်ပြုပေးနိုင်ပါတယ်။ [[mark:sel-mya-story]] ဆိုင်ပိုင်ရှင် ရဲ့ story ကတော့ app အလုပ်ဖြစ်မဖြစ်ကို ဆိုင်ပိုင်ရှင် ဘက်ကနေ
      တိုင်းဖို့ပါ။ ဒီ အရေအတွက်က problem ဖိုင်မှာ ရေးခဲ့တဲ့ ပြေပြီလား သိမယ့် ကိန်းဂဏန်းနဲ့ တိုက်ရိုက် ချိတ်နေပါတယ်။
    sources:
      - {
          title: "GOV.UK Service Manual: Writing user stories",
          url: "https://www.gov.uk/service-manual/agile-delivery/writing-user-stories",
        }
      - {
          title: "GOV.UK Service Manual: Learning about users and their needs",
          url: "https://www.gov.uk/service-manual/user-research/start-by-learning-user-needs",
        }
    actions:
      - { id: close-s, type: whiteboard.apply, at: { mark: close-s }, open: false }
      - id: type-stories-b
        type: editor.type
        at: { mark: type-stories-b }
        target: { file: docs/requirements.md, after: "ရောက်တဲ့အချိန် အသင့်ဖြစ်နေမယ်။\n", occurrence: 1 }
        text: "- ကောင်တာက လှလှ အနေနဲ့ ဝင်လာတဲ့ အော်ဒါတွေကို လာယူချိန်အလိုက် မြင်ချင်တယ်၊ ဒါမှ အချိန်မီ ပြင်ထားနိုင်မယ်။\n- ဆိုင်ပိုင်ရှင် အနေနဲ့ တစ်မနက် ကြိုမှာတဲ့ အော်ဒါ အရေအတွက်ကို သိချင်တယ်၊ ဒါမှ app က အလုပ်ဖြစ်မဖြစ် သိမယ်။\n\n"
        cadence: line-by-line
      - {
          id: sel-hla-story,
          type: editor.select,
          at: { mark: sel-hla-story },
          target:
            {
              file: docs/requirements.md,
              text: "ဝင်လာတဲ့ အော်ဒါတွေကို လာယူချိန်အလိုက် မြင်ချင်တယ်၊",
              occurrence: 1,
            },
        }
      - {
          id: sel-mya-story,
          type: editor.select,
          at: { mark: sel-mya-story },
          target:
            {
              file: docs/requirements.md,
              text: "တစ်မနက် ကြိုမှာတဲ့ အော်ဒါ အရေအတွက်ကို သိချင်တယ်၊",
              occurrence: 1,
            },
        }

  - id: functional
    chapter: Functional နဲ့ non functional
    narration: >
      [[mark:f-open]] ခုထိ ရေးခဲ့တဲ့ story တွေက app က ဘာလုပ်ပေးရမလဲ ဆိုတာပါ။ ဒါမျိုးကို functional requirement
      လို့ ခေါ်ပါတယ်။ [[mark:f-left]] ကြိုမှာလို့ ရတာ၊ လာယူချိန် ရွေးလို့ ရတာ၊ ကောင်တာမှာ စာရင်း မြင်ရတာ စတာတွေပါ။
      [[mark:f-right]] requirement နောက်တစ်မျိုးကတော့ app ဘာလုပ်လဲ မဟုတ်ဘဲ၊ ဘယ်လောက် ကောင်းကောင်း လုပ်ရမလဲ
      ဆိုတာပါ။ ဘယ်လောက် မြန်ရမလဲ၊ ဘယ်လောက် လုံခြုံရမလဲ၊ ဘယ်သူတွေ သုံးနိုင်ရမလဲ ဆိုတာမျိုးကို non functional
      requirement လို့ ခေါ်ပါတယ်။ [[mark:f-items]] ကိုယ်တို့ ဆိုင်အတွက် ဒီဘက်မှာ ငါးခု ရှိပြီး၊ ဖိုင်ထဲမှာ ရေးတဲ့အခါ
      တစ်ခုချင်း ကြည့်ပါမယ်။ [[mark:f-agent]] ဒီ အမျိုးအစားကို အထူး ဂရုစိုက်ရပါတယ်။ စာထဲမှာ မပါရင် agent က ဒါတွေကို
      သူ့ဘာသာ ရွေးရလို့ပါ။ functional
      requirement တစ်ခု ကျန်ခဲ့ရင် ခလုတ် တစ်ခု မရှိတာကို ချက်ချင်း မြင်ရပေမယ့်၊ non functional တစ်ခု ကျန်ခဲ့ရင်တော့
      app က ကောင်းကောင်း အလုပ်လုပ်နေသလို ထင်ရပြီး၊ မောင်မောင် လို customer တကယ် သုံးတော့မှ ပေါ်လာတတ်ပါတယ်။
    sources:
      - {
          title: "ISO/IEC 25010 (product quality model), iso25000.com",
          url: "https://iso25000.com/index.php/en/iso-25000-standards/iso-25010",
        }
      - {
          title: "The New SDLC (Burmese edition): The new SDLC (requirements and planning)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: draw-f-open,
          type: whiteboard.apply,
          at: { mark: f-open },
          open: true,
          clear: true,
          upsertIds: [f-h1, f-h1b],
          drawMs: 900,
        }
      - {
          id: draw-f-left,
          type: whiteboard.apply,
          at: { mark: f-left },
          upsertIds: [f-l1, f-l2, f-l3],
          drawMs: 1800,
        }
      - {
          id: draw-f-right,
          type: whiteboard.apply,
          at: { mark: f-right },
          upsertIds: [f-h2, f-h2b],
          drawMs: 1000,
        }
      - {
          id: draw-f-items,
          type: whiteboard.apply,
          at: { mark: f-items },
          upsertIds: [f-r1, f-r2, f-r3, f-r4, f-r5],
          drawMs: 2400,
        }
      - {
          id: draw-f-agent,
          type: whiteboard.apply,
          at: { mark: f-agent },
          upsertIds: [f-agent],
