          clear: true,
          upsertIds: [q-title, q-code-box, q-l1, q-l2],
        }
      - {
          id: quiz-line,
          type: whiteboard.apply,
          at: { mark: quiz-line },
          upsertIds: [q-mark, q-a, q-b],
          drawMs: 1500,
        }
      - {
          id: quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-check],
          drawMs: 700,
        }

  - id: recap
    chapter: ပြန်ချုပ်ရရင်
    narration: >-
      [[mark:close-quiz]] ဒါဆို ပြန်ချုပ်ရရင်၊ [[mark:recap-is]] Errorf နဲ့ wrap လုပ်ရင် context ပါတဲ့ error အသစ်
      ရပြီး၊ Is က အထုပ်ကို ဖြည်ပြီး နာမည်ပေးထားတဲ့ error ကို ရှာပေးပါတယ်။ [[mark:recap-astype]] ကိုယ်ပိုင်
      error type ဆိုတာ Error method ရှိတဲ့ struct ဖြစ်ပြီး၊ AsType နဲ့ field တွေနဲ့ အတူ ပြန်ယူလို့ ရပါတယ်။
      [[mark:recap-nil]] error မရှိရင်တော့ nil ကိုပဲ တိုက်ရိုက် ပြန်ပေးပါ။ နောက် lesson မှာတော့ function
      ဘယ်လိုပဲ ပြီးပြီး နောက်ဆုံးမှာ လုပ်ရမယ့် အလုပ်တွေအတွက် defer နဲ့၊ တကယ် panic ဖြစ်လာရင် ဘာလုပ်မလဲ
      ဆိုတာကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "The Go Blog — Working with Errors in Go 1.13",
          url: "https://go.dev/blog/go1.13-errors",
        }
    actions:
      - {
          id: close-quiz,
          type: whiteboard.apply,
          at: { mark: close-quiz },
          open: false,
          upsertIds: [],
        }
      - id: recap-is
        type: editor.select
        at: { mark: recap-is }
        target: { file: main.go, text: "errors.Is(err, ErrUnknownCity)", occurrence: 1 }
      - id: recap-astype
        type: editor.select
        at: { mark: recap-astype }
        target: { file: main.go, text: "errors.AsType[*OverweightError](err)", occurrence: 1 }
      - id: recap-nil
        type: editor.select
        at: { mark: recap-nil }
        target: { file: main.go, text: "if oe == nil {\n\t\treturn nil\n\t}", occurrence: 1 }

