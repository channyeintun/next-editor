scenes:
  - id: recall
    chapter: Error ထဲက အချက်အလက်
    narration: >-
      ပြီးခဲ့တဲ့ lesson မှာ error ဆိုတာ function က နောက်ဆုံး result အနေနဲ့ ပြန်ပေးတဲ့ တန်ဖိုး ဖြစ်ပြီး၊
      ခေါ်တဲ့သူက အရင် စစ်ရတယ် ဆိုတာ မြင်ခဲ့ပါတယ်။ ဒါပေမဲ့ အဲဒီ error တွေမှာ စာသား တစ်ကြောင်းပဲ
      ပါပါတယ်။ [[mark:sel-parcels]] ဒီနေ့ ကောင်တာကို ပါဆယ် သုံးခု ရောက်လာပါတယ်။ ပထမ တစ်ခုက မြို့ code
      မှားနေပြီး၊ ဒုတိယ တစ်ခုက တောင်ကြီးကို ပို့မယ့် နှစ်ဆယ့်နှစ် ကီလို ပါဆယ်ပါ။ ကိုယ်တို့ ဝန်ဆောင်မှုက နှစ်ဆယ်
      ကီလိုထက် လေးတဲ့ ပါဆယ်ကို လက်မခံပါဘူး။ တတိယ တစ်ခုကတော့ ပုံမှန် ပါဆယ်ပါ။ [[mark:problem]]
      ပြဿနာ နှစ်မျိုး ကွဲတော့ ဆက်လုပ်ပုံလည်း ကွဲပါတယ်။ မြို့ မှားရင် ပို့သူကို ပြန်မေးရပြီး၊ လေးလွန်းရင်
      ဘယ်လောက် ပိုနေလဲ ပြောပြရပါတယ်။ ဒါကြောင့် error ရဲ့ စာကို လူက ဖတ်ရုံနဲ့ မလုံလောက်ဘဲ၊ ဘယ်လို
      error လဲ၊ ဘယ်နှ ကီလို ပိုလဲ ဆိုတာကို code ကလည်း သိဖို့ လိုပါတယ်။ ဒီနေ့ error ကို ထုပ်တာနဲ့
      ကိုယ်ပိုင် error type ကို လေ့လာပါမယ်။
    sources:
      - {
          title: "The Go Blog — Working with Errors in Go 1.13",
          url: "https://go.dev/blog/go1.13-errors",
        }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }
      - id: sel-parcels
        type: editor.select
        at: { mark: sel-parcels }
        target:
          {
            file: main.go,
            text: "{Code: \"MDX-0001\", To: \"MDX\", WeightKg: 1},\n\t\t{Code: \"TGI-0001\", To: \"TGI\", WeightKg: 22},\n\t\t{Code: \"MDY-0001\", To: \"MDY\", WeightKg: 2.5},",
            occurrence: 1,
          }

  - id: named
    chapter: နာမည်ပေးထားတဲ့ error
    narration: >-
      [[mark:open-errors]] error တွေအတွက် errors ဆိုတဲ့ ဖိုင် အသစ် တစ်ခု ရှိပြီး၊ package main တစ်ကြောင်းပဲ
      ရှိသေးပါတယ်။ [[mark:type-sentinel]] errors နဲ့ fmt package နှစ်ခုကို import လုပ်ပြီး၊ မြို့ မသိတဲ့ error
      အတွက် နာမည်ပေးထားတဲ့ error တစ်ခုကို ဖိုင်ရဲ့ အပေါ်ဆုံး အဆင့်မှာ ကြေညာပါမယ်။ [[mark:sel-sentinel]]
      errors package ရဲ့ New နဲ့ error ကို တစ်ခါတည်း လုပ်ပြီး variable ထဲ ထည့်ထားတာပါ။ နာမည်ကို Err နဲ့
      စတာက Go ရဲ့ ထုံးစံပါ။ program တစ်ခုလုံးမှာ ဒီ error တစ်ခုတည်းပဲ ရှိတာမို့၊ ဘယ်နေရာကမဆို ဒါနဲ့
      ယှဉ်ပြီး မြို့ မသိတဲ့ error ဟုတ်မဟုတ် မေးလို့ ရပါတယ်။
    sources:
      - { title: "errors package — New", url: "https://pkg.go.dev/errors" }
    actions:
      - { id: open-errors, type: workspace.openFile, at: { mark: open-errors }, path: errors.go }
      - id: type-sentinel
        type: editor.type
        at: { mark: type-sentinel }
        target: { file: errors.go, after: "package main\n", occurrence: 1 }
        text: "\nimport (\n\t\"errors\"\n\t\"fmt\"\n)\n\n// ErrUnknownCity means the parcel's city code is not one the service sends to.\nvar ErrUnknownCity = errors.New(\"unknown city\")\n"
        cadence: line-by-line
      - id: sel-sentinel
        type: editor.select
        at: { mark: sel-sentinel }
        target:
          {
            file: errors.go,
            text: 'var ErrUnknownCity = errors.New("unknown city")',
            occurrence: 1,
          }

  - id: wrap
    chapter: Error ကို ထုပ်တာ
    narration: >-
      [[mark:type-check-city]] အောက်မှာ ပါဆယ် တစ်ခုကို ပို့လို့ ရမရ စစ်ပေးမယ့် function ကို ရေးပါမယ်။ ပို့လို့
      မရရင် ဘာကြောင့်လဲ ဆိုတဲ့ error ကို၊ ရရင်တော့ nil ကို ပြန်ပေးပါတယ်။ [[mark:sel-short-if]] if ရဲ့ line ကို
      ကြည့်ပါ။ ပြီးခဲ့တဲ့ lesson မှာ map ကို ok နဲ့ မေးတဲ့ line နဲ့ if ကို နှစ်ကြောင်း ခွဲရေးခဲ့ပါတယ်။ ဒီမှာတော့
      if ရဲ့ ရှေ့ပိုင်းမှာ map ကို မေးပြီး၊ နောက်ပိုင်းမှာ condition ကို စစ်တာ တစ်ကြောင်းတည်း ရေးထားတာပါ။
      ဒီလို ကြေညာတဲ့ variable က if ထဲမှာပဲ ရှိပါတယ်။ မြို့ နာမည်ကိုတော့ မလိုလို့ underscore နဲ့ ပစ်ထားပါတယ်။
      [[mark:sel-wrap]] မြို့ မရှိရင် Errorf နဲ့ error အသစ် လုပ်ပါတယ်။ ဒီ တစ်ခါ ပါဆယ်ရဲ့ code ကို ရှေ့မှာ ထည့်ပြီး၊
      နာမည်ပေးထားတဲ့ error ကို နောက်က နေရာလွတ်ထဲ ထည့်ပါတယ်။ ဒီ နေရာလွတ်က စာ ထည့်ရုံ နေရာလွတ်
      မဟုတ်ဘဲ error ကို wrap လုပ်တဲ့ နေရာလွတ်ပါ။ wrap ဆိုတာ error ကို context ထပ်ထည့်ပြီး ထုပ်တာပါ။
      ပါဆယ်ကို ထုပ်ပိုးပြီး အပြင်မှာ label ကပ်လိုက်သလိုပဲ၊ အထဲမှာ မူရင်း error က ရှိနေဆဲပါ။
    sources:
      - { title: "fmt package — Errorf", url: "https://pkg.go.dev/fmt#Errorf" }
      - {
          title: "The Go Programming Language Specification — If statements",
          url: "https://go.dev/ref/spec#If_statements",
        }
    actions:
      - id: type-check-city
        type: editor.type
        at: { mark: type-check-city }
        target:
          {
            file: errors.go,
            after: "var ErrUnknownCity = errors.New(\"unknown city\")\n",
            occurrence: 1,
          }
        text: "\n// checkParcel says why a parcel cannot be sent, or nil when it can.\nfunc checkParcel(p Parcel) error {\n\tif _, ok := cityNames[p.To]; !ok {\n\t\treturn fmt.Errorf(\"%s: %w\", p.Code, ErrUnknownCity)\n\t}\n\treturn nil\n}\n"
        cadence: line-by-line
      - id: sel-short-if
        type: editor.select
        at: { mark: sel-short-if }
        target: { file: errors.go, text: "if _, ok := cityNames[p.To]; !ok {", occurrence: 1 }
      - id: sel-wrap
        type: editor.select
        at: { mark: sel-wrap }
        target:
          { file: errors.go, text: 'fmt.Errorf("%s: %w", p.Code, ErrUnknownCity)', occurrence: 1 }

  - id: loop
    narration: >-
      [[mark:open-main-1]] main ဖိုင်ကို ပြန်သွားပါမယ်။ [[mark:type-errors-import]] errors package ကို import block
      ထဲ ထည့်ပြီး၊ [[mark:type-loop]] ပါဆယ် တစ်ခုချင်းကို စစ်တဲ့ loop ကို ရေးပါမယ်။ အခေါက်တိုင်းမှာ ခုနက function နဲ့
      ပါဆယ်ကို စစ်ပြီး ရလာတဲ့ error ကို err ထဲမှာ ထည့်ပါတယ်။ ပြီးတော့ အဲဒီ error က ဘယ်လို error လဲ ဆိုတာ
      if နဲ့ ခွဲကြည့်ပါတယ်။ [[mark:sel-is]] error ကို
      တိုက်ရိုက် နှိုင်းယှဉ်မယ့် အစား errors package ရဲ့ Is ကို သုံးထားပါတယ်။ Is က ထုပ်ထားတဲ့ error ကို
      ဖြည်ကြည့်ပြီး၊ အထဲမှာ မြို့ မသိတဲ့ error ပါမပါ မေးတာပါ။ ပါရင် မြို့ကို ပြန်မေးရမယ်လို့ ပြပြီး၊ error
      မရှိရင်တော့ ok လို့ ပြပါမယ်။ [[mark:run-1]] ကဲ၊ run လိုက်ရအောင်။
    sources:
      - { title: "errors package — Is", url: "https://pkg.go.dev/errors" }
    actions:
      - { id: open-main-1, type: workspace.openFile, at: { mark: open-main-1 }, path: main.go }
      - id: type-errors-import
        type: editor.type
        at: { mark: type-errors-import }
        target: { file: main.go, after: "import (\n", occurrence: 1 }
        text: "\t\"errors\"\n"
      - id: type-loop
        type: editor.type
        at: { mark: type-loop }
        target:
          {
            file: main.go,
            after: "\t\t{Code: \"MDY-0001\", To: \"MDY\", WeightKg: 2.5},\n\t}\n",
            occurrence: 1,
          }
        text: "\tfor _, p := range parcels {\n\t\terr := checkParcel(p)\n\t\tif errors.Is(err, ErrUnknownCity) {\n\t\t\tfmt.Println(\"city?\", err)\n\t\t} else if err == nil {\n\t\t\tfmt.Println(p.Code, \"ok\")\n\t\t}\n\t}\n"
        cadence: line-by-line
      - id: sel-is
        type: editor.select
        at: { mark: sel-is }
        target: { file: main.go, text: "errors.Is(err, ErrUnknownCity)", occurrence: 1 }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "city? MDX-0001: unknown city",
          timeoutMs: 8000,
        }

  - id: read-1
    chapter: errors.Is
    narration: >-
      [[mark:point-city]] ပထမ စာကြောင်းမှာ error ရဲ့ စာကို ကြည့်ပါ။ ပါဆယ် code ရဲ့ နောက်မှာ နာမည်ပေးထားတဲ့
      error ရဲ့ စာ ဆက်ပါလာပါတယ်။ wrap လုပ်ရင် စာတွေ ဆက်သွားလို့ ဘယ် ပါဆယ်လဲ ဆိုတာ ချက်ချင်း
      သိရပါတယ်။ [[mark:point-tgi]] ဒုတိယ စာကြောင်းကတော့ ပြဿနာပါ။ နှစ်ဆယ့်နှစ် ကီလို ပါဆယ်ကို ok လို့
      ပြနေပါတယ်၊ အလေးချိန်ကို မစစ်ရသေးလို့ပါ။ ဒါကို မကြာခင် ပြင်ပါမယ်။ [[mark:board-wrap]] Is ကို
      ဘာကြောင့် သုံးရလဲ board ပေါ်မှာ ကြည့်ရအောင်။ [[mark:draw-wrap]] နာမည်ပေးထားတဲ့ error က အထဲမှာ ရှိပြီး၊
      အပြင်မှာ ပါဆယ် code ပါတဲ့ အထုပ် အသစ် ရှိပါတယ်။ [[mark:draw-eq]] ဒါကြောင့် ရလာတဲ့ error ကို နာမည်ပေးထားတဲ့
      error နဲ့ တိုက်ရိုက် တူမတူ နှိုင်းယှဉ်ရင် false ရပါတယ်၊ အပြင်က အထုပ်က error အသစ် ဖြစ်နေလို့ပါ။
      [[mark:draw-is]] Is ကတော့ အထုပ်ကို တစ်ထပ်ချင်း ဖြည်ပြီး အထဲမှာ ရှာလို့ true ရပါတယ်။ ဒါကြောင့် wrap
      လုပ်ထားနိုင်တဲ့ error ကို စစ်တဲ့အခါ Is ကို သုံးပါ။
    sources:
      - {
          title: "The Go Blog — Working with Errors in Go 1.13",
          url: "https://go.dev/blog/go1.13-errors",
        }
      - { title: "errors package — Is", url: "https://pkg.go.dev/errors" }
    actions:
      - {
          id: point-city,
          type: console.point,
          at: { mark: point-city },
          target: { text: "city? MDX-0001: unknown city" },
        }
      - {
          id: point-tgi,
          type: console.point,
          at: { mark: point-tgi },
          target: { text: "TGI-0001 ok" },
        }
      - { id: collapse-1, type: runtime.collapseDock, at: { mark: board-wrap } }
      - {
          id: board-wrap,
          type: whiteboard.apply,
          at: { afterAction: collapse-1 },
          open: true,
          clear: true,
          upsertIds: [w-title],
        }
      - {
          id: draw-wrap,
          type: whiteboard.apply,
          at: { mark: draw-wrap },
          upsertIds: [w-outer, w-outer-label, w-inner, w-inner-label, w-name],
          drawMs: 2400,
        }
      - {
          id: draw-eq,
          type: whiteboard.apply,
          at: { mark: draw-eq },
          upsertIds: [w-eq, w-eq-line],
          drawMs: 1500,
        }
      - {
