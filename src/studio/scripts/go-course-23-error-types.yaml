# Go course, lesson 23: wrapping errors and error types (Burmese).
#
# Start state: main.go (an import block holding "fmt"; main with the day's three parcels: a typo
# city, a 22 kg parcel, a normal one), errors.go (only `package main`), parcel.go and fees.go
# (COURSE-KIT §3.4). Edits, all insert-only:
#   1. errors.go: the imports and ErrUnknownCity, then checkParcel with the city check that wraps it
#      (%w); main.go: "errors" into the import block and a loop with errors.Is -> run-1:
#      city? MDX-0001: unknown city / TGI-0001 ok (weight not checked yet) / MDY-0001 ok;
#   2. errors.go: OverweightError and its pointer-receiver Error(), the weight check; main.go: the
#      errors.AsType branch, checkWeight (returns a nil *OverweightError as error) and its call
#      -> run-2: … heavy: 2 kg over … error: <nil>;
#   3. `if oe == nil { return nil }` inserted in checkWeight -> run-3 ends weight ok.
# errors.go ends as COURSE-KIT §3.6 exactly; checkWeight is the kit's typed-nil function + its fix.
# Boards: (W) a wrapped error, == vs errors.Is; (A) AsType and the older errors.As;
# (T) an interface value is (type, value): typed nil; (Q) quiz (%v instead of %w).
# Fixtures: bun ~/Documents/go-course-work/tools/sim-go.ts <this yaml> --write
schemaVersion: 1

