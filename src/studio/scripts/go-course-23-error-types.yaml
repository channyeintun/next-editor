  - id: overweight
    chapter: ကိုယ်ပိုင် error type
    narration: >-
      [[mark:close-wrap]] အခု အလေးချိန်အတွက် error ကို လုပ်ရအောင်။ ဒီ error မှာတော့ စာ တစ်ကြောင်းထက်
      ပိုလိုပါတယ်၊ ဘယ် ပါဆယ်လဲ၊ ဘယ်နှ ကီလိုလဲ ဆိုတဲ့ အချက်တွေကို ခေါ်တဲ့သူက ပြန်ယူသုံးချင်ပါတယ်။
      [[mark:open-errors-2]] errors ဖိုင်ကို ပြန်သွားပါမယ်။ [[mark:type-overweight]] code နဲ့ အလေးချိန်ကို
      မှတ်ထားမယ့် struct တစ်ခုနဲ့၊ သူ့ရဲ့ Error ဆိုတဲ့ method ကို ရေးပါမယ်။ field
      နှစ်ခုက ဘယ် ပါဆယ်လဲ၊ ဘယ်နှ ကီလိုလဲ ဆိုတာကို မှတ်ထားပြီး၊ method ကတော့ အဲဒီ field တွေနဲ့ အများဆုံး
      ကီလိုကို စာ တစ်ကြောင်းထဲ ထည့်ပေးပါတယ်။ [[mark:sel-error-method]] error ဆိုတာ
      တကယ်တော့ interface တစ်ခုပါ။ စာသား ပြန်ပေးတဲ့ Error method တစ်ခုပဲ ပါပြီး၊ ဒီ method ရှိတဲ့ ဘယ် type
      မဆို error ဖြစ်ပါတယ်။ interface lesson မှာ မြင်ခဲ့တဲ့ အလုပ်ခေါ်စာ လိုပါပဲ။ ဒီမှာ receiver က pointer
      ဖြစ်လို့ struct ရဲ့ pointer က error ဖြစ်ပါတယ်။ [[mark:type-weight-check]] ပြီးတော့ စစ်တဲ့ function ထဲမှာ
      မြို့ကို စစ်ပြီးနောက်၊ အများဆုံး ကီလိုထက် လေးရင် ဒီ struct ကို field နှစ်ခုနဲ့ ဖြည့်ပြီး သူ့ရဲ့ address ကို
      error အဖြစ် ပြန်ပေးပါမယ်။ အဆုံးထိ ရောက်လာမှ nil ကို ပြန်ပေးပါတယ်။
    sources:
      - {
          title: "The Go Programming Language Specification — Errors",
          url: "https://go.dev/ref/spec#Errors",
        }
      - { title: "Effective Go — Errors", url: "https://go.dev/doc/effective_go#errors" }
    actions:
      - {
          id: close-wrap,
          type: whiteboard.apply,
          at: { mark: close-wrap },
          open: false,
          upsertIds: [],
        }
      - {
          id: open-errors-2,
          type: workspace.openFile,
          at: { mark: open-errors-2 },
          path: errors.go,
        }
      - id: type-overweight
        type: editor.type
        at: { mark: type-overweight }
        target:
          {
            file: errors.go,
            after: "var ErrUnknownCity = errors.New(\"unknown city\")\n",
            occurrence: 1,
          }
        text: "\n// OverweightError means the parcel is heavier than maxWeightKg.\ntype OverweightError struct {\n\tCode     string\n\tWeightKg float64\n}\n\nfunc (e *OverweightError) Error() string {\n\treturn fmt.Sprintf(\"%s: %v kg is over %v kg\", e.Code, e.WeightKg, maxWeightKg)\n}\n"
        cadence: line-by-line
      - id: sel-error-method
        type: editor.select
        at: { mark: sel-error-method }
        target:
          { file: errors.go, text: "func (e *OverweightError) Error() string {", occurrence: 1 }
      - id: type-weight-check
        type: editor.type
        at: { mark: type-weight-check }
        target:
          {
            file: errors.go,
            after: "\t\treturn fmt.Errorf(\"%s: %w\", p.Code, ErrUnknownCity)\n\t}\n",
            occurrence: 1,
          }
        text: "\tif p.WeightKg > maxWeightKg {\n\t\treturn &OverweightError{Code: p.Code, WeightKg: p.WeightKg}\n\t}\n"
        cadence: line-by-line

  - id: astype
    chapter: AsType နဲ့ ပြန်ယူတာ
    narration: >-
      [[mark:open-main-2]] main ဖိုင်ကို ပြန်သွားပါမယ်။ [[mark:type-astype]] loop ထဲမှာ Is ရဲ့ နောက်က အပိုင်း
      အသစ် တစ်ခု ထည့်ပါမယ်။ [[mark:sel-astype]] errors package ရဲ့ AsType ကို ကိုယ် ရှာချင်တဲ့ type နဲ့ တွဲပြီး
      ခေါ်ရပါတယ်၊ ဒီမှာတော့ OverweightError ရဲ့ pointer ပါ။ AsType က အထုပ်တွေထဲမှာ ဒီ type ရဲ့ error ကို
      ရှာပြီး၊ တွေ့ရင် သူ့ type အတိုင်း ပြန်ပေးပြီး ok က true ဖြစ်ပါတယ်။ ဒါကြောင့် အောက်က line မှာ field ကို
      တိုက်ရိုက် ယူပြီး၊ ပါဆယ်ရဲ့ အလေးချိန်ထဲက အများဆုံး ကီလိုကို နှုတ်ပြီး ဘယ်လောက် ပိုလဲ ပြပါတယ်။
      [[mark:board-astype]] AsType က Go ရဲ့ နောက်ပိုင်း version တွေမှာမှ ပါလာတာပါ။ [[mark:draw-old]] အရင် code
      တွေမှာတော့ variable ကို အရင် ကြေညာပြီး၊ သူ့ address ကို errors package ရဲ့ As ကို ပေးတဲ့ ပုံစံကို
      တွေ့ရပါမယ်။ အလုပ်ကတော့ အတူတူပါပဲ၊ ဒါပေမဲ့ AsType မှာ type ကို compiler က စစ်ပေးလို့ ပိုစိတ်ချရပါတယ်။
    sources:
      - { title: "errors package — AsType", url: "https://pkg.go.dev/errors" }
      - { title: "Go 1.26 Release Notes", url: "https://go.dev/doc/go1.26" }
    actions:
