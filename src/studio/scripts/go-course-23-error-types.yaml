  - id: typed-nil
    chapter: nil မဟုတ်တဲ့ nil
    narration: >-
      [[mark:close-astype]] error ရေးတဲ့အခါ သတိထားရမယ့် ထောင်ချောက် တစ်ခု ရှိပါတယ်။ [[mark:type-checkweight]]
      main ဖိုင်ရဲ့ အပေါ်မှာ အလေးချိန်ကိုပဲ စစ်တဲ့ function တစ်ခုကို နည်းနည်း ကွဲတဲ့ ပုံစံနဲ့ ရေးကြည့်ပါမယ်။
      [[mark:sel-var-oe]] OverweightError ရဲ့ pointer variable ကို ကြေညာထားပြီး၊ သူ့ရဲ့ zero value က nil ပါ။
      [[mark:sel-return-oe]] လေးလွန်းမှသာ အဲဒီ variable ထဲ ထည့်ပြီး၊ အဆုံးမှာ variable ကို ပြန်ပေးပါတယ်။
      ကြည့်ရတာ ပြဿနာ မရှိသလိုပါပဲ။ [[mark:type-call]] main ရဲ့ အဆုံးမှာ နှစ်ကီလိုခွဲပဲ ရှိတဲ့ မန္တလေး ပါဆယ်ကို
      ဒီ function နဲ့ စစ်ပါမယ်။ error ရှိရင် print ထုတ်ပြီး ပြန်ထွက်ပါမယ်၊ မရှိရင် အလေးချိန် အဆင်ပြေတယ်လို့
      ပြပါမယ်။ [[mark:run-2]] ကဲ၊ run လိုက်ရအောင်။
    sources:
      - {
          title: "Go FAQ — Why is my nil error value not equal to nil?",
          url: "https://go.dev/doc/faq#nil_error",
        }
    actions:
      - {
          id: close-astype,
          type: whiteboard.apply,
          at: { mark: close-astype },
          open: false,
          upsertIds: [],
        }
      - id: type-checkweight
        type: editor.type
        at: { mark: type-checkweight }
        target: { file: main.go, after: "\t\"fmt\"\n)\n", occurrence: 1 }
        text: "\n// checkWeight says when a parcel is too heavy.\nfunc checkWeight(p Parcel) error {\n\tvar oe *OverweightError\n\tif p.WeightKg > maxWeightKg {\n\t\toe = &OverweightError{Code: p.Code, WeightKg: p.WeightKg}\n\t}\n\treturn oe\n}\n"
        cadence: line-by-line
      - id: sel-var-oe
        type: editor.select
        at: { mark: sel-var-oe }
        target: { file: main.go, text: "var oe *OverweightError", occurrence: 1 }
      - id: sel-return-oe
        type: editor.select
        at: { mark: sel-return-oe }
        target: { file: main.go, text: "return oe", occurrence: 1 }
      - id: type-call
        type: editor.type
        at: { mark: type-call }
        target:
          { file: main.go, after: "\t\t\tfmt.Println(p.Code, \"ok\")\n\t\t}\n\t}\n", occurrence: 1 }
        text: "\tif err := checkWeight(parcels[2]); err != nil {\n\t\tfmt.Println(\"error:\", err)\n\t\treturn\n\t}\n\tfmt.Println(\"weight ok\")\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "heavy: 2 kg over",
          timeoutMs: 8000,
        }

  - id: read-2
    narration: >-
      [[mark:point-heavy]] ဒုတိယ စာကြောင်းမှာ တောင်ကြီး ပါဆယ်က နှစ် ကီလို ပိုနေတယ်လို့ ပြပါပြီ။ ဒီ နှစ်
      ဆိုတဲ့ ဂဏန်းကို error စာထဲကနေ ဖြတ်ယူတာ မဟုတ်ဘဲ၊ error ရဲ့ field ကနေ တိုက်ရိုက် တွက်ထားတာပါ။
      [[mark:point-nil]] ဒါပေမဲ့ နောက်ဆုံး စာကြောင်းကို ကြည့်ပါ။ နှစ်ကီလိုခွဲ ပါဆယ်က လေးလွန်းတာ မဟုတ်ပါဘူး။
      ဒါတောင်မှ error ရှိတယ် ဆိုတဲ့ if ထဲကို ရောက်သွားပြီး၊ error နေရာမှာ nil လို့ ပြနေပါတယ်။ error မရှိပါဘဲ
      error ရှိတယ်လို့ ပြနေတာပါ၊ type ပါတဲ့ nil ဖြစ်နေလို့ပါ။ [[mark:board-typed-nil]] any lesson မှာ မြင်ခဲ့တဲ့
      interface value နဲ့ ပြန်ကြည့်ရအောင်။ interface value တစ်ခုထဲမှာ type နဲ့ တန်ဖိုး နှစ်ခု ပါပါတယ်။
      [[mark:draw-real-nil]] nil ကိုပဲ တိုက်ရိုက် ပြန်ပေးရင် type ရော တန်ဖိုးပါ မရှိလို့ error က တကယ် nil ဖြစ်ပါတယ်။
      [[mark:draw-typed]] nil pointer variable ကို ပြန်ပေးရင်တော့ တန်ဖိုးက nil ဖြစ်ပေမဲ့၊ type နေရာမှာ
      OverweightError ရဲ့ pointer ဆိုတာ ရှိနေပါတယ်။ အထဲမှာ တစ်ခုခု ရှိနေတော့ interface က nil မဟုတ်တော့ပါဘူး။
      [[mark:draw-rule]] ဒါကြောင့် error မရှိတဲ့အခါ pointer variable ကို မပြန်ပေးဘဲ nil ကိုပဲ တိုက်ရိုက်
      ပြန်ပေးပါ။
    sources:
      - {
          title: "Go FAQ — Why is my nil error value not equal to nil?",
          url: "https://go.dev/doc/faq#nil_error",
        }
    actions:
      - {
          id: point-heavy,
          type: console.point,
          at: { mark: point-heavy },
          target: { text: "heavy: 2 kg over" },
        }
      - {
          id: point-nil,
          type: console.point,
          at: { mark: point-nil },
          target: { text: "error: <nil>" },
        }
      - { id: collapse-2, type: runtime.collapseDock, at: { mark: board-typed-nil } }
      - {
          id: board-typed-nil,
          type: whiteboard.apply,
          at: { afterAction: collapse-2 },
          open: true,
          clear: true,
          upsertIds: [t-title],
        }
      - {
          id: draw-real-nil,
          type: whiteboard.apply,
          at: { mark: draw-real-nil },
          upsertIds: [t-nil-box, t-nil-code, t-nil-pair, t-nil-res],
          drawMs: 2000,
        }
      - {
          id: draw-typed,
          type: whiteboard.apply,
          at: { mark: draw-typed },
          upsertIds: [t-oe-box, t-oe-code, t-oe-pair, t-oe-res],
          drawMs: 2400,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: draw-rule },
          upsertIds: [t-rule, t-rule-line],
          drawMs: 1500,
        }

  - id: fix
    narration: >-
      [[mark:close-typed]] ဒါဆို ပြင်ကြည့်ရအောင်။ [[mark:type-fix]] variable က nil ဖြစ်နေရင် nil ကို တိုက်ရိုက်
      ပြန်ပေးတဲ့ စစ်ချက် တစ်ခုကို နောက်ဆုံး return ရဲ့ ရှေ့မှာ ထည့်ပါမယ်။ ဒီ nil က type မပါတဲ့ တကယ့် nil ပါ။
      [[mark:run-3]] ကဲ၊ ထပ်ပြီး run ကြည့်ရအောင်။ [[mark:point-ok]] နောက်ဆုံး စာကြောင်းမှာ အလေးချိန်
      အဆင်ပြေတယ်လို့ ထွက်လာပါပြီ။ ဒီ ထောင်ချောက်က compile error လည်း မပေး၊ vet ကလည်း သတိမပေးတဲ့ bug
      မျိုးပါ။ errors ဖိုင်က စစ်တဲ့ function မှာတော့ ဒီ ပြဿနာ မရှိပါဘူး၊ error ရှိတဲ့ နေရာမှာ address ကို
      တိုက်ရိုက် ပြန်ပေးပြီး၊ မရှိရင် nil ကို ပြန်ပေးထားလို့ပါ။
    sources:
      - {
          title: "Go FAQ — Why is my nil error value not equal to nil?",
          url: "https://go.dev/doc/faq#nil_error",
        }
    actions:
      - {
          id: close-typed,
          type: whiteboard.apply,
          at: { mark: close-typed },
          open: false,
          upsertIds: [],
        }
      - id: type-fix
        type: editor.type
        at: { mark: type-fix }
        target:
          {
            file: main.go,
            after: "\t\toe = &OverweightError{Code: p.Code, WeightKg: p.WeightKg}\n\t}\n",
            occurrence: 1,
          }
        text: "\tif oe == nil {\n\t\treturn nil\n\t}\n"
        cadence: line-by-line
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "weight ok",
          timeoutMs: 8000,
        }
      - {
          id: expect-file-errors,
          type: expect.file,
          at: { afterAction: run-3 },
          path: errors.go,
          contains: "func (e *OverweightError) Error() string {",
        }
      - {
          id: expect-file-fix,
          type: expect.file,
          at: { afterAction: run-3 },
          path: main.go,
          contains: "\tif oe == nil {\n\t\treturn nil\n\t}\n",
        }
      - { id: point-ok, type: console.point, at: { mark: point-ok }, target: { text: "weight ok" } }

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >-
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ board ပေါ်က code မှာ နာမည်ပေးထားတဲ့ error ကို Errorf နဲ့
      ထည့်ထားပေမဲ့၊ wrap လုပ်တဲ့ နေရာလွတ် အစား တန်ဖိုးကို စာအဖြစ် ထည့်တဲ့ သာမန် နေရာလွတ်ကို သုံးမိထားပါတယ်။
      [[mark:quiz-line]] ဒါဆို Is က true ပြန်ပေးမလား၊ false ပြန်ပေးမလား။ lesson ကို pause လုပ်ပြီး
      စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] အဖြေကတော့ ခ၊ false ပါ။ ဘာကြောင့်လဲဆိုတော့ သာမန် နေရာလွတ်က error
      ရဲ့ စာကိုပဲ ကူးထည့်ပြီး၊ error ကိုယ်တိုင်ကို အထဲမှာ မထုပ်ထားလို့ပါ။ print ထုတ်ရင် စာက အတူတူပဲ ဖြစ်ပေမဲ့၊
      Is အတွက်တော့ ဖြည်ကြည့်စရာ အထုပ် မရှိပါဘူး။ ဒါကြောင့် error ကို ထုပ်ချင်ရင် wrap လုပ်တဲ့ နေရာလွတ်ကို
      သုံးရပါတယ်။
    sources:
      - { title: "fmt package — Errorf", url: "https://pkg.go.dev/fmt#Errorf" }
    actions:
      - { id: collapse-3, type: runtime.collapseDock, at: { mark: quiz } }
      - {
          id: quiz,
          type: whiteboard.apply,
          at: { afterAction: collapse-3 },
