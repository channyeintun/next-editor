      - id: type-astype
        type: editor.type
        at: { mark: type-astype }
        target: { file: main.go, after: "\t\t\tfmt.Println(\"city?\", err)\n\t\t} ", occurrence: 1 }
        text: "else if oe, ok := errors.AsType[*OverweightError](err); ok {\n\t\t\tfmt.Println(\"heavy:\", oe.WeightKg-maxWeightKg, \"kg over\")\n\t\t} "
        cadence: line-by-line
      - id: sel-astype
        type: editor.select
        at: { mark: sel-astype }
        target: { file: main.go, text: "errors.AsType[*OverweightError](err)", occurrence: 1 }
