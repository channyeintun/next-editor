scenes:
  - id: open
    chapter: စိုးရိမ်ချက် နှစ်ခု
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ ဝန်ထမ်း ၄၃၀ အတွက် success team ကို ဖွဲ့ပြီး၊ login မဝင်ခင် setup လုပ်ရမယ့် ခေါင်းစဉ်
      ငါးခုကို ချရေးခဲ့ပါတယ်။
      [[mark:o-title]] account တွေ အသင့်ဖြစ်တဲ့ အပတ်မှာ support manager လှလှ က ကိုယ့်ဆီ လာပြောပါတယ်။ support
      agent တွေကြားမှာ စိုးရိမ်ချက် နှစ်ခု ရှိနေတယ် ဆိုတာပါ။
      [[mark:o-1]] ပထမ တစ်ခုက AI ရေးတဲ့ အမှားအတွက် သူတို့ အပြစ်တင်ခံရမှာပါ။ မုန်တိုင်းကျတဲ့ညက router ပြန်ဖွင့်ခိုင်းတဲ့
      စာ ၆၄ စောင်ကို ပို့ခဲ့တာ support agent တွေပါ။ ဒါပေမဲ့ အဲဒီညက ဘယ်သူ ဘာစစ်ရမလဲ ဆိုတာကို ဘယ်သူမှ design
      မဆွဲထားခဲ့ပါဘူး။ ဒီတစ်ခါလည်း နောက်ဆုံး ပို့တဲ့လူကပဲ တာဝန်ခံရမလား လို့ သူတို့ မေးနေကြပါတယ်။
      [[mark:o-2]] ဒုတိယ တစ်ခုက AI က သူတို့ အလုပ်ကို ယူသွားမှာပါ။ draft ကို Claude က ရေးပေးနိုင်ရင် support agent
      ၄၅ ယောက် ဆက်လိုပါဦးမလား ဆိုတဲ့ မေးခွန်းပါ။
      [[mark:o-reason]] ဒီ နှစ်ခုလုံးက အကြောင်းရှိတဲ့ စိုးရိမ်ချက်တွေပါ။ မဖြေရှင်းဘဲ launch လုပ်ရင် account တွေ
      ပွင့်နေပေမဲ့ သုံးမယ့်သူ နည်းနေမှာ၊ ဒါမှမဟုတ် personal account နဲ့ ဖုံးပြီး သုံးနေကြမှာပါ။ ဒါကြောင့် လူတွေကို
      အပြောင်းအလဲအတွက် ပြင်ဆင်တာနဲ့၊ leader တစ်ယောက် ပို့နိုင်မယ့် launch message ကို ရေးကြည့်ပါမယ်။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
