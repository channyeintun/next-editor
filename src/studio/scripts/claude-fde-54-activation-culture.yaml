        target:
          file: notebook/54-launch-message.md
          text: "Claude ကြောင့် ဘယ်သူ့ အလုပ်မှ မဖြုတ်ပါဘူး။"

  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ account တွေ အသင့်ဖြစ်ရုံနဲ့ လူတွေ မသုံးကြပါဘူး။ support agent တွေရဲ့
      စိုးရိမ်ချက်ကို ဖြေဖို့ leader က ဘာကြောင့်လဲ ဆိုတာကို ကိုယ့်စကားနဲ့ ပြောရပြီး၊ အမှားကို ပြောရဲတဲ့ အခြေအနေကို
      ဖန်တီးရပါမယ်။
      [[mark:recap-2]] ကျဆင်းမှုကို ကြိုပြောထားရပါမယ်။ training ကို role အလိုက် ပေးပြီး၊ launch day ကို ပထမ task
      တစ်ခုနဲ့ စရပါမယ်။
      [[mark:next]] နောက် lesson မှာတော့ launch ပြီး သုံးလအကြာ ဌာနတိုင်းက ကိုယ့်နည်း၊ ကိုယ့်အမှားတွေနဲ့ သွားနေတဲ့အခါ၊
      Center of Excellence ကို ဖွဲ့ပြီး Acceleration အဆင့်ကို ဘယ်လို စမလဲ ဆိုတာကို လေ့လာသွားပါမယ်။
    sources:
