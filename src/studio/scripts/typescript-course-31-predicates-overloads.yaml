  - id: predicate
    chapter: "Type predicate"
    narration: >
      [[mark:select-sugar]] ပထမ error က MenuItem မှာ sugar property မရှိဘူးလို့ ပြောနေပါတယ်။ စားစရာ type
      မှာ sugar မပါလို့ပါ။ [[mark:type-query-drinks]] ရွေးထုတ်ထားတဲ့ စာရင်းရဲ့ type ကို query comment
      နဲ့ ကြည့်ရအောင်။ [[mark:read-menuitem-array]] Types အပိုင်းမှာ MenuItem array လို့ ပြနေပါတယ်။
      ကိုယ်ကတော့ သောက်စရာတွေကိုပဲ ရွေးထားမှန်း သိပေမယ့်၊ TypeScript အတွက်တော့ ဒီ function က boolean
      ကိုပဲ ပြန်ပေးပါတယ်။ နာမည် စာရင်းနဲ့ တိုက်စစ်တာက type နဲ့ ဘယ်လို ဆိုင်လဲ ဆိုတာ သူ နားမလည်ပါဘူး။
      [[mark:open-menu-2]] ဒါကြောင့် menu ဖိုင်ကို ပြန်သွားရအောင်။ [[mark:type-predicate]] return type
      နေရာမှာ type predicate ကို ရေးပါမယ်။ parameter နာမည်နဲ့ is ဆိုတဲ့ keyword ကို သုံးပြီး၊ true
      ပြန်ရင် ဒီ ပစ္စည်းက Drink ပါ လို့ ကတိ ပေးလိုက်တာပါ။ [[mark:read-drink-array]] Types မှာ Drink
      array ဖြစ်သွားပြီး၊ sugar ရဲ့ error လည်း ပျောက်သွားပါပြီ။ filter ကို type predicate ပါတဲ့ function
      ပေးလိုက်ရင် ရလဒ် array ကို narrow လုပ်ပေးပြီး၊ if ထဲမှာ ခေါ်ရင်လည်း if block ထဲမှာ narrow
      ဖြစ်ပါတယ်။ [[mark:read-why-written]] lesson ၁၀ မှာ မြင်ခဲ့သလို ရိုးရှင်းတဲ့ စစ်ဆေးချက်တွေ အတွက်
      TypeScript က predicate ကို သူ့ဘာသာ infer လုပ်ပေးပေမယ့်၊ ဒီလို စာရင်းနဲ့ တိုက်စစ်တာမျိုးမှာတော့
      ကိုယ်တိုင် ရေးပေးရပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 16: The Utils Folder (type predicates)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/utility-folder-development-in-typescript",
        }
      - {
          title: "TypeScript Handbook: Narrowing (using type predicates)",
          url: "https://www.typescriptlang.org/docs/handbook/2/narrowing.html#using-type-predicates",
        }
      - {
          title: "Announcing TypeScript 5.5 (inferred type predicates)",
          url: "https://devblogs.microsoft.com/typescript/announcing-typescript-5-5/#inferred-type-predicates",
        }
    actions:
