  - id: assertion
    chapter: "Assertion function"
    narration: >
      [[mark:open-main-2]] အခု အော်ဒါ ဘက်ကို ကြည့်ရအောင်။ [[mark:select-data-errors]] JSON parse ရဲ့
      ရလဒ်ကို unknown type လို့ ကြေညာထားလို့၊ item နဲ့ cups ကို ဖတ်တဲ့ နေရာ နှစ်ခုမှာ error ရှိပါတယ်။
      [[mark:type-query-data]] ဒီ နေရာမှာ data ရဲ့ type ကို query comment နဲ့ ကြည့်ရအောင်။ အပေါ်က line
      မှာ စစ်ပေးတဲ့ function ကို ခေါ်ထားပြီးသားပါ။ [[mark:read-data-unknown]] ဒါပေမဲ့ unknown ပဲ
      ဖြစ်နေပါတယ်။ TypeScript အတွက် ဒီ function က ဘာမှ ပြန်မပေးတဲ့ သာမန် function တစ်ခုပဲ ဖြစ်နေလို့ပါ။
      [[mark:open-orders-2]] ဒါကြောင့် function ကို ပြင်ပါမယ်။ [[mark:type-asserts]] return type နေရာမှာ
      asserts ဆိုတဲ့ keyword နဲ့ assertion signature ကို ရေးလိုက်ပါမယ်။ error ကို throw မလုပ်ဘဲ
      ပြီးသွားရင် ဒီ တန်ဖိုးက Order ပါ လို့ ကတိ ပေးတာပါ။ [[mark:read-data-order]] error တွေ အကုန်
      ပျောက်ပြီး၊ Types မှာလည်း data က Order ဖြစ်သွားပါပြီ။ type predicate နဲ့ ကွာတာက if နဲ့ ပတ်စရာ
      မလိုဘဲ၊ ခေါ်လိုက်တဲ့ line ရဲ့ အောက်က code အားလုံးမှာ narrow ဖြစ်တာပါ။
