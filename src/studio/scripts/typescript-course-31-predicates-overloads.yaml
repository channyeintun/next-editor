  - id: predicate-lie
    chapter: "Predicate ရဲ့ ကတိ မှန်ရဲ့လား"
    narration: >
      [[mark:select-names]] ဒါပေမဲ့ ဒီ ကတိ မှန်မမှန်ကို TypeScript က စစ်ပါသလား။ ဖျော်ရမယ့် သောက်စရာ
      စာရင်းထဲမှာ ရေနွေးကြမ်းလည်း ပါပါတယ်။ [[mark:type-free-tea]] ဆိုင်က ရေနွေးကြမ်းကို အလကား တိုက်လို့
      ဈေးနှုန်း သုညနဲ့ menu ထဲ ထည့်မယ် ဆိုပါစို့။ သကြား မထည့်တဲ့ အတွက် sugar property မပါပါဘူး။
      [[mark:read-free-tea]] Errors မှာ ဘာမှ အသစ် မပေါ်ပေမယ့်၊ Output ရဲ့ တတိယ line မှာ ရေနွေးကြမ်းရဲ့
      သကြားက undefined ဆိုပြီး ပေါ်လာပါပြီ။ စာရင်းထဲမှာ ပါလို့ function က true ပြန်ပေးလိုက်ပြီး၊
      TypeScript ကလည်း ကတိကို ယုံပြီး Drink လို့ narrow လုပ်လိုက်တာပါ။ [[mark:read-like-as]] function
      ထဲက code က ကတိနဲ့ ကိုက်မကိုက်ကို TypeScript က မစစ်ပါဘူး။ ဒါကြောင့် type predicate ရေးတာဟာ as နဲ့
      type assertion လုပ်တာလိုပဲ၊ ကိုယ်က TypeScript ထက် ပိုသိတယ်လို့ ပြောလိုက်တာပါ။
      [[mark:type-check-sugar]] ကတိနဲ့ တကယ် ကိုက်အောင် in operator နဲ့ sugar property ပါမပါကိုပါ
      စစ်ပါမယ်။ [[mark:read-tea-gone]] ရေနွေးကြမ်းရဲ့ line ပျောက်သွားပါပြီ။ အခု စစ်ဆေးချက်က Drink
      ဖြစ်ကြောင်းကို တကယ် သက်သေ ပြနိုင်ပါပြီ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 16: The Utils Folder (type predicates can be unsafe)",
