  - id: symptoms
    narration: >
      [[mark:panel-ready]] panel ရဲ့ Output မှာ program က line ခြောက်ကြောင်း ထုတ်ပြထားပေမယ့်၊
      နှစ်နေရာမှာ undefined ပါနေပါတယ်။ စတုတ္ထ line မှာ booking ရဲ့ အချိန်က undefined ဖြစ်နေပြီး၊
      နောက်ဆုံး line မှာလည်း ကော်ဖီ အော်ဒါရဲ့ ခွက် အရေအတွက်က undefined ဖြစ်နေပါတယ်။
      [[mark:read-errors]] Errors အပိုင်းမှာတော့ error သုံးခု ရှိပါတယ်။ ပထမ တစ်ခုက သကြား ပမာဏကို
      ဖတ်တဲ့ နေရာမှာ ဖြစ်ပြီး၊ ကျန်တဲ့ နှစ်ခုက အော်ဒါကို ထုတ်ပြတဲ့ line မှာ ဖြစ်ပါတယ်။ တစ်ခုချင်း
      ကြည့်ပြီး ပြင်ကြည့်ရအောင်။
    sources:
