      လို့ ပြနေပေမယ့်၊ ကော်ဖီ အော်ဒါရဲ့ ခွက် အရေအတွက်က undefined ဖြစ်နေတုန်းပါ။
      [[mark:select-weak-check]] ဘာကြောင့်လဲဆိုတော့ ဒီ function က object ဟုတ်မဟုတ်ကိုပဲ စစ်ပြီး၊
      item နဲ့ cups ကို မစစ်ထားလို့ပါ။ ဆိုတော့ assertion function ကလည်း လိမ်နိုင်ပါတယ်။
      [[mark:type-cups-check]] cups မပါရင် error ကို throw လုပ်တဲ့ line တစ်ကြောင်း ထည့်ပါမယ်။
      [[mark:read-uncaught]] အခု ကော်ဖီ အော်ဒါ ရောက်လာတော့ error ကို throw လုပ်လိုက်လို့၊ Output ရဲ့
      နောက်ဆုံးမှာ အနီရောင် line နဲ့ program ရပ်သွားပါတယ်။ မှားနေတဲ့ data နဲ့ ဆက်သွားတာထက် ဒီလို
      ရပ်သွားတာက ပိုကောင်းပါတယ်။ [[mark:read-still-partial]] ဒါပေမဲ့ cups က number ဟုတ်မဟုတ်၊ item က
      string ဟုတ်မဟုတ် ဆိုတာတွေကိုပါ စစ်ရင် line တွေ အများကြီး ထပ်ရေးရပြီး၊ တစ်ခုခု ကျန်ခဲ့ရင်လည်း
      TypeScript က သတိ မပေးပါဘူး။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 16: The Utils Folder (assertion functions can lie)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/utility-folder-development-in-typescript",
        }
      - {
          title: "MDN: throw",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/throw",
        }
    actions:
      - id: expect-cups-still-undefined
        type: expect.preview
        at: { mark: read-cups-undefined }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-6 }
        textContains: "ကော်ဖီ undefined ခွက်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: select-weak-check
        type: editor.select
        at: { mark: select-weak-check }
        target:
          {
            file: src/orders.ts,
            text: 'typeof value !== "object" || value === null',
            occurrence: 1,
          }
      - id: type-cups-check
        type: editor.type
        at: { mark: type-cups-check }
        target:
          {
            file: src/orders.ts,
            after: "    throw new Error(\"အော်ဒါ မဟုတ်ပါ\");\n  }\n",
            occurrence: 1,
          }
        text: "  if (!(\"cups\" in value)) throw new Error(\"ခွက် အရေအတွက် မပါပါ\");\n"
        cadence: line-by-line
      - id: expect-uncaught
        type: expect.preview
        at: { afterAction: type-cups-check }
        timeoutMs: 8000
        target: { by: testId, value: ts-out-6 }
        textContains: "Uncaught Error: ခွက် အရေအတွက် မပါပါ"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-uncaught-level
        type: expect.preview
        at: { afterAction: expect-uncaught }
        timeoutMs: 8000
        target: { by: testId, value: ts-out-6 }
        attribute: { name: data-level, value: "error" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-still-clean
        type: expect.preview
        at: { afterAction: expect-uncaught-level }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 1200 }

  - id: overloads
    chapter: "Function overload"
    narration: >
      [[mark:open-main-3]] ကျန်နေတဲ့ undefined ဖြစ်တဲ့ booking ကို ကြည့်ရအောင်။
      [[mark:select-reserve-call]] လူ လေးယောက်လို့ ပေးထားပေမယ့် အချိန် မပေးထားပါဘူး။
      [[mark:type-query-reserve]] function ရဲ့ type ကို query comment နဲ့ ကြည့်ရအောင်။
      [[mark:read-optional-signature]] နောက်က parameter နှစ်ခုက optional ဖြစ်နေလို့၊ လူ အရေအတွက် ပေးပြီး
      အချိန် မပေးတဲ့ ခေါ်ပုံကိုလည်း TypeScript က လက်ခံနေပါတယ်။ ကိုယ် လိုချင်တာက စားပွဲ နံပါတ် တစ်ခုတည်း၊
      ဒါမှမဟုတ် သုံးခုလုံး ဆိုတဲ့ ခေါ်ပုံ နှစ်မျိုးပဲ ဖြစ်ပါတယ်။ [[mark:open-orders-3]] ဒါကြောင့်
      function ကို ပြန်သွားရအောင်။ [[mark:type-overloads]] function ရဲ့ အပေါ်မှာ body မပါတဲ့ overload
      signature နှစ်ကြောင်း ထည့်ပါမယ်။ ပထမ တစ်ကြောင်းက စားပွဲ နံပါတ်ကိုပဲ ယူပြီး၊ ဒုတိယ တစ်ကြောင်းက
      သုံးခုလုံးကို မဖြစ်မနေ ယူပါတယ်။ [[mark:read-overload-error]] Errors မှာ argument နှစ်ခုနဲ့
      ခေါ်လို့ ရတဲ့ overload မရှိဘူး၊ တစ်ခု ဒါမှမဟုတ် သုံးခုပဲ ရတယ် ဆိုတဲ့ error ပေါ်လာပါပြီ။
      [[mark:read-overload-type]] Types မှာလည်း ပထမ overload နဲ့ နောက်ထပ် overload တစ်ခု ရှိသေးတယ်
      ဆိုတာကို ပြနေပါတယ်။ optional parameter တွေ ပါတဲ့ မူလ signature က implementation signature
      ဖြစ်သွားပြီး၊ ခေါ်တဲ့ code က သူ့ကို မမြင်ရတော့ပါဘူး။ ဒါပေမဲ့ overload တိုင်းကို
      လက်ခံနိုင်အောင်တော့ ရေးထားရပါမယ်။ [[mark:open-main-4]] main ဖိုင်ကို ပြန်သွားပြီး အချိန်ကို
      ထည့်ရအောင်။ [[mark:type-time]] ညနေ ခြောက်နာရီ လို့ ပေးလိုက်ပါမယ်။ [[mark:read-all-fixed]] error
      ပျောက်သွားပြီး၊ Output မှာလည်း booking ရဲ့ အချိန် ပေါ်လာပါပြီ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 16: The Utils Folder (function overloads, the implementation signature)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/utility-folder-development-in-typescript",
        }
      - {
          title: "TypeScript Handbook: More on Functions (overload signatures and the implementation signature)",
          url: "https://www.typescriptlang.org/docs/handbook/2/functions.html#overload-signatures-and-the-implementation-signature",
        }
    actions:
      - id: open-main-3
        type: workspace.openFile
        at: { mark: open-main-3 }
        path: src/main.ts
      - id: select-reserve-call
        type: editor.select
        at: { mark: select-reserve-call }
        target: { file: src/main.ts, text: "reserve(5, 4)", occurrence: 1 }
      - id: type-query-reserve
        type: editor.type
        at: { mark: type-query-reserve }
        target: { file: src/main.ts, after: "console.log(reserve(3));\n", occurrence: 1 }
        text: "//          ^?\n"
        cadence: line-by-line
      - id: expect-optional-signature
        type: expect.preview
        at: { afterAction: type-query-reserve }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-2 }
        textContains: "reserve(table: number, guests?: number, time?: string): string"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: open-orders-3
        type: workspace.openFile
        at: { mark: open-orders-3 }
        path: src/orders.ts
      - id: type-overloads
        type: editor.type
        at: { mark: type-overloads }
        target: { file: src/orders.ts, after: "မပါပါ\");\n}\n\n", occurrence: 1 }
        text: "export function reserve(table: number): string;\nexport function reserve(table: number, guests: number, time: string): string;\n"
        cadence: line-by-line
      - id: expect-overload-error
        type: expect.preview
        at: { afterAction: type-overloads }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-code, value: "2575" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-overload-text
        type: expect.preview
        at: { afterAction: expect-overload-error }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-1 }
        textContains: "No overload expects 2 arguments, but overloads do exist that expect either 1 or 3 arguments."
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-one-error
        type: expect.preview
        at: { afterAction: expect-overload-text }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-overload-type
        type: expect.preview
        at: { afterAction: expect-one-error }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-2 }
        textContains: "reserve(table: number): string (+1 overload)"
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: open-main-4
        type: workspace.openFile
        at: { mark: open-main-4 }
        path: src/main.ts
      - id: type-time
        type: editor.type
        at: { mark: type-time }
        target: { file: src/main.ts, after: "reserve(5, 4", occurrence: 1 }
        text: ', "18:00"'
      - id: expect-all-fixed
        type: expect.preview
        at: { afterAction: type-time }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-booking-time
        type: expect.preview
        at: { afterAction: expect-all-fixed }
        timeoutMs: 8000
        target: { by: testId, value: ts-out-4 }
        textContains: "စားပွဲ 5 · 4 ယောက် · 18:00"
        retry: { maxAttempts: 3, delayMs: 1200 }

  - id: overload-or-union
    chapter: "Overload လား၊ union လား"
    narration: >
      [[mark:board-union]] ဒါဆို overload ကို ဘယ်အချိန် သုံးမလဲ။ [[mark:draw-count]] ခုနက function လို
      argument အရေအတွက်ပေါ် မူတည်ပြီး ခေါ်ပုံ ကွာတဲ့ အခါ overload ကို သုံးပါ။ [[mark:draw-type]]
      အရေအတွက် တူပြီး type ပဲ ကွာရင်တော့ union ကို သုံးပါ။ ဥပမာအားဖြင့် စားပွဲကို နံပါတ်နဲ့ ဖြစ်ဖြစ်၊
      customer နာမည်နဲ့ ဖြစ်ဖြစ် ရှာမယ် ဆိုရင်၊ parameter ကို number နဲ့ string ရဲ့ union ပေးလိုက်တာ
      ပိုကောင်းပါတယ်။ [[mark:draw-why]] ဘာကြောင့်လဲဆိုတော့ TypeScript က call တစ်ခုကို overload
      တစ်ခုနဲ့ပဲ တိုက်စစ်တဲ့အတွက်၊ number ဒါမှမဟုတ် string ဖြစ်နိုင်တဲ့ တန်ဖိုးက overload တစ်ခုနဲ့မှ
      မကိုက်လို့ပါ။ [[mark:draw-pick]] ဒါကြောင့် union နဲ့ ရနိုင်ရင် union ကို အရင် ရွေးပါ။
    sources:
      - {
          title: "TypeScript Handbook: More on Functions (writing good overloads)",
          url: "https://www.typescriptlang.org/docs/handbook/2/functions.html#writing-good-overloads",
        }
      - {
          title: "Total TypeScript Essentials, ch. 16: The Utils Folder (function overloads vs unions)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/utility-folder-development-in-typescript",
        }
    actions:
      - id: open-board-b
        type: whiteboard.apply
        at: { mark: board-union }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-count
        type: whiteboard.apply
        at: { mark: draw-count }
        upsertIds: [b-count-head, b-count-ex]
        drawMs: 2400
      - id: draw-type
        type: whiteboard.apply
        at: { mark: draw-type }
        upsertIds: [b-type-head, b-type-ex]
        drawMs: 2400
      - id: draw-why
        type: whiteboard.apply
        at: { mark: draw-why }
        upsertIds: [b-why]
        drawMs: 1600
      - id: draw-pick
        type: whiteboard.apply
        at: { mark: draw-pick }
        upsertIds: [b-pick, b-pick-line]
        drawMs: 1600

  - id: recap
    narration: >
      [[mark:recap-predicate]] ဒါဆို ပြန်ချုပ်ရရင်၊ type predicate က true ပြန်ရင် တန်ဖိုးက ဘာ type လဲ
      ဆိုတာ ကတိ ပေးပြီး၊ ခေါ်တဲ့ နေရာမှာ type ကို narrow လုပ်ပေးပါတယ်။ [[mark:recap-assertion]]
      assertion function ကတော့ throw မလုပ်ဘဲ ပြီးသွားရင် အောက်က code အားလုံးမှာ narrow လုပ်ပေးပါတယ်။
      နှစ်ခုလုံးမှာ TypeScript က ကတိကို ယုံရုံပဲ ဖြစ်လို့၊ စစ်ဆေးချက် မှန်အောင် ကိုယ်တိုင်
      ဂရုစိုက်ရပါတယ်။ [[mark:recap-overload]] overload တွေကတော့ argument အရေအတွက် မတူတဲ့ ခေါ်ပုံတွေကို
      ကြေညာပြီး၊ implementation signature ကို ဖုံးထားပေးပါတယ်။ [[mark:recap-next]] နောက် lesson မှာတော့
      ဒီလို ကိုယ်တိုင် ရေးရတဲ့ စစ်ဆေးချက်တွေ အစား၊ Zod ဆိုတဲ့ library နဲ့ run နေတဲ့ အချိန်မှာ data ကို
      စစ်တဲ့ runtime validation ကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 16: The Utils Folder",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/utility-folder-development-in-typescript",
        }
      - { title: "Zod documentation", url: "https://zod.dev/" }
    actions:
      - id: close-board-b
        type: whiteboard.apply
        at: { mark: recap-predicate }
        open: false
      - id: open-menu-3
        type: workspace.openFile
        at: { mark: recap-predicate, offsetMs: 600 }
        path: src/menu.ts
      - id: select-recap-predicate
        type: editor.select
        at: { afterAction: open-menu-3 }
        target: { file: src/menu.ts, text: "item is Drink", occurrence: 1 }
      - id: open-orders-4
        type: workspace.openFile
        at: { mark: recap-assertion }
        path: src/orders.ts
      - id: select-recap-assertion
        type: editor.select
        at: { afterAction: open-orders-4 }
        target: { file: src/orders.ts, text: "asserts value is Order", occurrence: 1 }
      - id: select-recap-overloads
        type: editor.select
        at: { mark: recap-overload }
        target:
          {
            file: src/orders.ts,
            text: "export function reserve(table: number): string;\nexport function reserve(table: number, guests: number, time: string): string;",
            occurrence: 1,
          }
      - id: expect-file-menu
        type: expect.file
        at: { mark: recap-next }
        path: src/menu.ts
        contains: "export function isDrink(item: MenuItem): item is Drink {\n  return drinkNames.includes(item.name) && \"sugar\" in item;\n}"
      - id: expect-file-orders
        type: expect.file
        at: { afterAction: expect-file-menu }
        path: src/orders.ts
        contains: "export function assertIsOrder(value: unknown): asserts value is Order {"
      - id: expect-file-overloads
        type: expect.file
        at: { afterAction: expect-file-orders }
        path: src/orders.ts
        contains: "export function reserve(table: number): string;\nexport function reserve(table: number, guests: number, time: string): string;\nexport function reserve(table: number, guests?: number, time?: string) {"
      - id: expect-file-main
        type: expect.file
        at: { afterAction: expect-file-overloads }
        path: src/main.ts
        contains: 'console.log(reserve(5, 4, "18:00"));'
checks:
  - type: timing.p95Ms
    max: 300
