runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "Function က ပေးတဲ့ ကတိ"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ function ပြန်ပေးတဲ့ type က argument ရဲ့ type နောက်ကို
      လိုက်သွားတဲ့ generic function တွေကို ရေးခဲ့ပါတယ်။ ဒီ lesson မှာတော့ function တစ်ခုက သူ့ကို ခေါ်တဲ့
      code ဘက်ကို type အကြောင်း ပိုပြီး ပြောပြနိုင်တဲ့ နည်း သုံးမျိုးကို ကြည့်သွားပါမယ်။
      [[mark:draw-predicate]] ပထမ တစ်ခုက type predicate ပါ။ true ဒါမှမဟုတ် false ပြန်ပေးတဲ့ function
      မှာ၊ true ပြန်ရင် တန်ဖိုးက ဘယ် type ဖြစ်တယ် ဆိုတာကို ကိုယ်တိုင် ရေးပေးတာပါ။ ဒါဆို ခေါ်တဲ့ နေရာမှာ
      TypeScript က type ကို narrow လုပ်ပေးပါတယ်။ [[mark:draw-assertion]] ဒုတိယ တစ်ခုက assertion function
      ပါ။ သူကတော့ တန်ဖိုး မှားနေရင် error ကို throw လုပ်တဲ့အတွက်၊ ခေါ်ပြီးတဲ့ နောက် program ဆက် run
      နေသေးရင် တန်ဖိုး မှန်တယ် ဆိုတာ TypeScript က သိသွားပါတယ်။ [[mark:draw-trust]] ဒီ နှစ်ခုလုံးမှာ
      TypeScript က function ထဲက စစ်ဆေးချက်ကို ပြန်မစစ်ဘဲ၊ ကိုယ် ပေးထားတဲ့ ကတိကိုပဲ ယုံလိုက်တာ ဖြစ်ပါတယ်။
      [[mark:draw-overload]] တတိယ တစ်ခုကတော့ overload ပါ။ function တစ်ခုကို ခေါ်လို့ ရတဲ့ ပုံစံ
      တစ်ခုချင်းစီကို သီးသန့် ကြေညာထားလို့၊ မှားတဲ့ ပုံစံနဲ့ ခေါ်ရင် TypeScript က သတိပေးနိုင်ပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 16: The Utils Folder (type predicates, assertion functions, function overloads)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/utility-folder-development-in-typescript",
        }
      - {
          title: "TypeScript Handbook: Narrowing (using type predicates)",
          url: "https://www.typescriptlang.org/docs/handbook/2/narrowing.html#using-type-predicates",
        }
      - {
          title: "TypeScript 3.7 release notes: Assertion Functions",
          url: "https://www.typescriptlang.org/docs/handbook/release-notes/typescript-3-7.html#assertion-functions",
        }
      - {
          title: "TypeScript Handbook: More on Functions (function overloads)",
          url: "https://www.typescriptlang.org/docs/handbook/2/functions.html#function-overloads",
        }
    actions:
      - id: open-board-a
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-predicate
        type: whiteboard.apply
        at: { mark: draw-predicate }
        upsertIds: [a-pred-code, a-pred-arrow, a-pred-desc]
        drawMs: 2400
      - id: draw-assertion
        type: whiteboard.apply
        at: { mark: draw-assertion }
        upsertIds: [a-assert-code, a-assert-arrow, a-assert-desc]
        drawMs: 2400
      - id: draw-trust
        type: whiteboard.apply
        at: { mark: draw-trust }
        upsertIds: [a-trust, a-trust-line]
        drawMs: 2400
      - id: draw-overload
        type: whiteboard.apply
        at: { mark: draw-overload }
        upsertIds: [a-over-code, a-over-arrow, a-over-desc]
        drawMs: 2000

  - id: starter
    narration: >
      [[mark:close-board]] ဒီနေ့ code ကို ကြည့်ရအောင်။ [[mark:open-menu]] ဒါက ဆိုင်ရဲ့ menu ဖိုင်ပါ။
      [[mark:select-types]] menu ထဲက ပစ္စည်း တစ်ခုက သောက်စရာ ဒါမှမဟုတ် စားစရာ ဖြစ်ပြီး၊ သောက်စရာမှာပဲ
      သကြား ပမာဏကို ပြတဲ့ sugar property ပါပါတယ်။ [[mark:select-menu]] menu ထဲမှာ သောက်စရာ နှစ်မျိုးနဲ့
      စားစရာ နှစ်မျိုး ရှိပါတယ်။ [[mark:select-is-drink]] အောက်ဆုံးက function က ပစ္စည်းရဲ့ နာမည်ကို
      ဖျော်ရမယ့် သောက်စရာ စာရင်းနဲ့ တိုက်ကြည့်ပြီး၊ သောက်စရာ ဟုတ်မဟုတ်ကို true ဒါမှမဟုတ် false နဲ့
      ပြန်ပေးပါတယ်။ [[mark:open-orders]] အော်ဒါ ဖိုင်မှာတော့ function နှစ်ခု ရှိပါတယ်။
      [[mark:select-assert]] ပထမ တစ်ခုက ဝင်လာတဲ့ တန်ဖိုးက object မဟုတ်ရင် error ကို throw လုပ်ပါတယ်။
      [[mark:select-reserve]] ဒုတိယ တစ်ခုက စားပွဲ ကြိုမှာတဲ့ function ပါ။ စားပွဲ နံပါတ်ပဲ ပေးရင် အခု
      ထိုင်မယ့် စားပွဲ ဖြစ်ပြီး၊ လူ အရေအတွက်နဲ့ အချိန်ပါ ပေးရင်တော့ နောက်မှ လာမယ့် booking ဖြစ်ပါတယ်။
      [[mark:open-main]] main ဖိုင်က ဒီ function တွေကို သုံးပါတယ်။ [[mark:select-drinks]] အပေါ်ဆုံးမှာ
      သောက်စရာတွေကို ရွေးထုတ်ပြီး သကြား ပမာဏကို ထုတ်ပြပါတယ်။ [[mark:select-calls]] အလယ်မှာ စားပွဲ
      နှစ်ခုကို ကြိုမှာပါတယ်။ [[mark:select-inbox]] အောက်ဆုံးမှာတော့ QR code ကနေ စာသားအနေနဲ့ ဝင်လာတဲ့
      အော်ဒါ နှစ်ခုကို JSON parse နဲ့ ပြောင်းပြီး၊ စစ်ပြီးမှ ထုတ်ပြပါတယ်။
    sources:
      - {
          title: "TypeScript Handbook: Everyday Types (union types)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#union-types",
        }
      - {
          title: "MDN: Array.prototype.filter()",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/filter",
        }
      - {
          title: "MDN: JSON.parse()",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/JSON/parse",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: open-menu
        type: workspace.openFile
        at: { mark: open-menu }
        path: src/menu.ts
      - id: select-types
        type: editor.select
