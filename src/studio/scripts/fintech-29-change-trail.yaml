  - id: case
    chapter: Knight Capital၊ ၂၀၁၂
    narration: >-
      [[mark:show-case]] system က မစစ်ရင် ဘာဖြစ်လဲ ဆိုတာ တကယ့် case တစ်ခုမှာ မြင်ရပါတယ်။ ၂၀၁၂ ခုနှစ် ဩဂုတ်လ တစ်ရက်နေ့မှာ Knight Capital က NYSE ရဲ့ Retail Liquidity Program အတွက် code အသစ်ကို သူတို့ရဲ့ order router ဖြစ်တဲ့ SMARS ထဲကို deploy လုပ်ခဲ့ပါတယ်။ [[mark:pt-srv8]] technician တစ်ယောက်က SMARS server ရှစ်လုံးထဲက တစ်လုံးကို code အသစ် copy မကူးမိခဲ့လို့ အဲဒီ server ပေါ်မှာ မသုံးတော့တဲ့ Power Peg ဆိုတဲ့ code အဟောင်း ကျန်နေခဲ့ပါတယ်။ [[mark:case-2]] အဲဒီနောက် တခြား ရည်ရွယ်ချက်နဲ့ ပြန်သုံးလိုက်တဲ့ flag တစ်ခုက အဲဒီ server ပေါ်က code အဟောင်းကို အလုပ်လုပ်စေခဲ့ပါတယ်။ [[mark:case-3]] မိနစ် ၄၅ လောက်အတွင်း SMARS က child order သန်းနဲ့ချီ ပို့ခဲ့ပြီး၊ စတော့ ၁၅၄ မျိုးမှာ execution လေးသန်း ကျော် ဖြစ်ခဲ့ပါတယ်။ SEC ရဲ့ ကိန်းဂဏန်းအရ Knight က ဒေါ်လာ သန်း ၄၆၀ ကျော် ဆုံးရှုံးခဲ့ပါတယ်။ [[mark:case-4]] နောက်တစ်နှစ်မှာ SEC က ဒေါ်လာ သန်း ၁၂ ဒဏ်ငွေ ချမှတ်ခဲ့ပြီး၊ deployment ကို ဒုတိယ technician တစ်ယောက်က review လုပ်ဖို့ ရေးထားတဲ့ procedure Knight မှာ မရှိခဲ့ဘူးလို့ တွေ့ခဲ့ပါတယ်။ ဆိုလိုတာက ဘယ် server ပေါ်မှာ ဘယ် version run နေလဲ ဆိုတာကို လူက မှတ်ထားရတာ မဟုတ်ဘဲ system က စစ်ပေးရပါမယ်။
    sources:
