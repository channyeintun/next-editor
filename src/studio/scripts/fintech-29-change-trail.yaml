  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] Fintech interview တွေမှာ production ကို ဘယ် code ရောက်ခဲ့လဲ ဆိုတာ auditor ကို ဘယ်လို သက်သေပြမလဲ လို့ မေးတတ်ပါတယ်။ code review လုပ်ပါတယ် လို့ပဲ ဖြေရင် မလုံလောက်ပါဘူး၊ အချက် သုံးချက်နဲ့ ဖြေပါ။ [[mark:iv-a]] ပထမ၊ source control က record ပါ။ commit တိုင်းက author နဲ့ ticket ကို ချိတ်ထားပြီး၊ signed commit၊ protected branch နဲ့ force-push ပိတ်ထားတာကြောင့် history ကို တိတ်တိတ် ပြန်ပြင်လို့ မရပါဘူး။ [[mark:iv-b]] ဒုတိယ၊ gate တွေကို system က enforce လုပ်ပါတယ်။ review နဲ့ check တွေက မဖြစ်မနေ လိုပြီး၊ approver က author မဖြစ်ရဘူး ဆိုတာကို tool က စစ်ပါတယ်။ [[mark:iv-c]] တတိယ၊ deploy တွေကို trace လုပ်လို့ ရပါတယ်။ ဘယ် version ကို ဘယ်သူ ဘယ်တော့ release လုပ်လဲ ဆိုတာ log ထဲ ရှိပြီး၊ server တွေ report လုပ်တဲ့ version နဲ့ reconcile လုပ်ပါတယ်။ [[mark:iv-d]] ပြီးရင် incident အချိန် တစ်ခု ပေးလိုက်တာနဲ့ run နေခဲ့တဲ့ version၊ အဲဒီထဲက commit တွေ၊ approve လုပ်ခဲ့တဲ့သူတွေ အထိ query တစ်ခုနဲ့ ပြနိုင်အောင် ထားမယ် လို့ ဆက်ပြောပါ။
