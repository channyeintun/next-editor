# Fintech Engineering, lesson 29: the change trail, from a commit to the version that runs (Burmese).
#
# Source: Fintech Engineering Handbook, "The change trail (SDLC)" (CC BY 4.0, Voytek Pitula).
# Facts: B06 (Knight Capital, 1 August 2012), B21 (SOC 2 CC8.1, PCI DSS 6.5.1).
# Start state: trail.go holds the record types, what each of eight servers reports it runs, and
# the deploy log; main.go holds three change records and the merge gate `review`, run over them.
# Edits, all insert-only, in main.go:
#   1. the release gate: every server must report the release before the flag goes on
#                                                            -> run-2: srv-8 runs r41, flag false
#   2. which version ran on srv-8 at a given moment, from the deploy log
#                                                            -> run-3: r41, deployed by u-40
# Figures: trail (commit → review → checks → deploy → running), enforced (a rule people remember
# vs a rule the system enforces), case (Knight Capital: one of eight servers), drift (where the
# trail is bypassed), iv (the interview answer).
# Built by ~/Documents/fintech-course-work/tools/build-lesson.ts; fixtures by sim-go.ts --write.
schemaVersion: 1

lesson:
  slug: fintech-29-change-trail
  title: "Fintech Engineering 29: Code ကနေ production အထိ trail"
  locale: my-MM
  workspace:
    lessonType: go
    name: Fintech Engineering
    entryFilePath: main.go
    files:
      main.go: |
        package main

        import (
        	"fmt"
        	"strings"
        )

        const release = "r42"

        var changes = []Change{
        	{"a41f9c2", "u-17", "u-23", "PAY-311", true},
        	{"7be03d1", "u-23", "u-23", "PAY-318", true},
        	{"c90e5aa", "u-31", "u-17", "", false},
        }

        // review is the merge gate: the rules a change must meet before it reaches main.
        func review(c Change) []string {
        	var why []string
        	if c.Approver == "" || c.Approver == c.Author {
        		why = append(why, "no second reviewer")
        	}
        	if c.Ticket == "" {
        		why = append(why, "no ticket")
        	}
        	if !c.Checks {
        		why = append(why, "checks failed")
        	}
        	return why
        }

        func main() {
        	for _, c := range changes {
        		if why := review(c); len(why) > 0 {
        			fmt.Println(c.Commit, "blocked:", strings.Join(why, ", "))
        		} else {
        			fmt.Println(c.Commit, "merged")
        		}
        	}
        }
      trail.go: |
        package main

        import "slices"

        // Change is one merge request as source control recorded it.
        type Change struct {
        	Commit   string
        	Author   string
        	Approver string
        	Ticket   string
        	Checks   bool // the required CI checks passed
        }

        // Server is what one production server reports it is running right now.
        type Server struct {
        	Name    string
        	Version string
        }

        var fleet = []Server{
        	{"srv-1", "r42"}, {"srv-2", "r42"}, {"srv-3", "r42"}, {"srv-4", "r42"},
        	{"srv-5", "r42"}, {"srv-6", "r42"}, {"srv-7", "r42"}, {"srv-8", "r41"},
        }

        // Deploy is one line of the deploy log: a version, who released it, when,
        // and the servers that confirmed they run it.
        type Deploy struct {
        	At      string
        	Version string
        	By      string
        	Servers []string
        }

        var deploys = []Deploy{
        	{"02-20 18:05", "r41", "u-40", []string{"srv-1", "srv-2", "srv-3", "srv-4",
        		"srv-5", "srv-6", "srv-7", "srv-8"}},
        	{"03-02 18:10", "r42", "u-52", []string{"srv-1", "srv-2", "srv-3", "srv-4",
        		"srv-5", "srv-6", "srv-7"}},
        }

        func (d Deploy) reached(server string) bool { return slices.Contains(d.Servers, server) }
