  - id: enforced
    narration: >-
      [[mark:show-enf]] ဒီ rule တွေကို ထိန်းတဲ့ နည်း နှစ်မျိုး ရှိပါတယ်။ ပထမ တစ်မျိုးက wiki ထဲမှာ process ကို ရေးထားပြီး လူတွေ မှတ်မိဖို့ မျှော်လင့်တာပါ။ incident တစ်ခုကြားမှာ တစ်ယောက်ယောက်က main ကို တိုက်ရိုက် push လုပ်လိုက်ရင် ဘာမှ မတားသလို review မှတ်တမ်းလည်း မကျန်ပါဘူး။ [[mark:enf-2]] ဒုတိယ တစ်မျိုးက system က enforce လုပ်တာပါ။ approval မရှိရင်၊ author ကိုယ်တိုင် approve လုပ်ရင်၊ check fail ရင် merge လုပ်လို့ မရသလို၊ direct push နဲ့ force-push ကိုလည်း ပိတ်ထားပါတယ်။ [[mark:pt-std]] SOC ၂ ရဲ့ change management criterion က change တွေကို authorize လုပ်၊ test လုပ်၊ approve လုပ်ပြီးမှ implement လုပ်ဖို့ တောင်းပါတယ်။ PCI DSS ကလည်း production change တိုင်းမှာ အကြောင်းပြချက်၊ approval မှတ်တမ်း၊ testing နဲ့ ပြန်လှည့်မယ့် procedure ရှိဖို့ တောင်းပါတယ်။ [[mark:pt-cap]] auditor က ကိုယ်တို့ လိုက်နာပါတယ် ဆိုတဲ့ စကားလောက်နဲ့ မကျေနပ်ပါဘူး၊ system က ပိတ်ထားတယ် ဆိုတဲ့ သက်သေကို ကြည့်ပါတယ်။
