  - id: gate
    chapter: Release gate
    narration: >-
      [[mark:close-case]] ဒီ စစ်ဆေးမှုကို code နဲ့ ရေးကြည့်ရအောင်။ [[mark:type-gate]] fleet ထဲက server တိုင်းက ကိုယ် run နေတဲ့ version ကို report လုပ်ပါတယ်။ ဒီ loop က release version နဲ့ မတူတဲ့ server တိုင်းကို ထုတ်ပြပြီး ရေတွက်ပါတယ်။ အဲဒီ အရေအတွက် သုည ဖြစ်မှသာ code အသစ်ကို ဖွင့်မယ့် release flag ကို on ခွင့်ပြုပါတယ်။ server ရှစ်လုံးထဲက တစ်လုံးက version အဟောင်း ဖြစ်နေရင် ဘာထွက်မလဲ ခန့်မှန်းကြည့်ပါ။ [[mark:run-2]] run လိုက်ရအောင်။ [[mark:pt-stale]] server ရှစ်ခုမြောက်က release အသစ် မဟုတ်ဘဲ version အဟောင်းကို run နေတာ တွေ့ပါတယ်။ [[mark:pt-flag-off]] ဒါကြောင့် flag ကို on ခွင့် မပြုပါဘူး၊ false ပါ။ ဒီ gate က flag ကို ဖွင့်မယ့် အဆင့်မှာပဲ fleet တစ်ခုလုံး မကိုက်တာကို ဖမ်းမိပါတယ်။ [[mark:dock-2]] deploy ပြီးတာနဲ့ fleet ကိုက်တယ်လို့ ယူဆလို့ မရပါဘူး၊ စစ်ပြီးမှ ရှေ့ဆက်ရပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — The change trail (SDLC) (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#the-change-trail-sdlc",
        }
      - {
          title: "SEC — In the Matter of Knight Capital Americas LLC, Release No. 34-70694 (16 Oct 2013)",
          url: "https://www.sec.gov/litigation/admin/2013/34-70694.pdf",
        }
    actions:
      - { id: close-case, type: slide.close, at: { mark: close-case } }
      - id: type-gate
        type: editor.type
        at: { mark: type-gate }
        target:
          {
            file: main.go,
            after: "\t\t\tfmt.Println(c.Commit, \"merged\")\n\t\t}\n\t}\n",
            occurrence: 1,
          }
        text: "\n\tstale := 0\n\tfor _, s := range fleet {\n\t\tif s.Version != release {\n\t\t\tfmt.Println(s.Name, \"runs\", s.Version, \"not\", release)\n\t\t\tstale++\n\t\t}\n\t}\n\tfmt.Println(\"release flag on:\", stale == 0)\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "release flag on: false",
          timeoutMs: 8000,
        }
      - id: pt-stale
        type: console.point
        at: { mark: pt-stale }
        target: { text: "srv-8 runs r41 not r42", occurrence: 1 }
      - id: pt-flag-off
        type: console.point
        at: { mark: pt-flag-off }
        target: { text: "release flag on: false", occurrence: 1 }
      - { id: dock-2, type: runtime.collapseDock, at: { mark: dock-2 } }

  - id: what-ran
    narration: >-
      [[mark:type-ran]] နောက် မေးခွန်းတစ်ခုက incident ဖြစ်ပြီးမှ မေးရတာပါ။ နောက်တစ်နေ့ မနက် ကိုးနာရီခွဲမှာ server ရှစ်ခုမြောက်ပေါ်မှာ ဘယ် code run နေခဲ့လဲ။ ဒီ loop က deploy log ထဲမှာ အဲဒီ အချိန် မတိုင်ခင် အဲဒီ server ကို တကယ် ရောက်ခဲ့တဲ့ နောက်ဆုံး deploy ကို ရှာပါတယ်။ log ရဲ့ line တိုင်းမှာ release လုပ်တဲ့သူနဲ့ အချိန် ပါပါတယ်။ [[mark:run-3]] run လိုက်ရအောင်။ [[mark:pt-ran]] အဲဒီ အချိန်မှာ server ရှစ်ခုမြောက်က release အသစ်ကို မဟုတ်ဘဲ၊ ဖေဖော်ဝါရီလ နှစ်ဆယ်ရက်နေ့က deploy လုပ်ခဲ့တဲ့ version အဟောင်းကို run နေခဲ့ပါတယ်။ version ကနေ အဲဒီထဲက commit တွေ၊ commit ကနေ author နဲ့ approver ဆီ ဆက်သွားလို့ ရတော့ incident တစ်ခုကို change တစ်ခုဆီ ပြန်ချိတ်နိုင်ပါတယ်။ [[mark:dock-3]] trail ဆိုတာ မှတ်ထားရုံ မဟုတ်ပါဘူး၊ incident ဖြစ်နေတုန်း ဒီ မေးခွန်းကို မိနစ်ပိုင်းအတွင်း ဖြေနိုင်ဖို့ပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — The change trail (SDLC) (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#the-change-trail-sdlc",
        }
    actions:
      - id: type-ran
        type: editor.type
        at: { mark: type-ran }
        target:
          {
            file: main.go,
            after: "\tfmt.Println(\"release flag on:\", stale == 0)\n",
            occurrence: 1,
          }
        text: "\n\tat, ran := \"03-03 09:30\", Deploy{}\n\tfor _, d := range deploys {\n\t\tif d.At <= at && d.reached(\"srv-8\") {\n\t\t\tran = d\n\t\t}\n\t}\n\tfmt.Println(\"srv-8 at\", at, \"ran\", ran.Version, \"deployed\", ran.At, \"by\", ran.By)\n"
        cadence: line-by-line
      - { id: run-3, type: runtime.run, at: { mark: run-3, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-3,
          type: expect.output,
          at: { afterAction: run-3 },
          contains: "ran r41 deployed 02-20 18:05 by u-40",
          timeoutMs: 8000,
        }
      - id: pt-ran
        type: console.point
        at: { mark: pt-ran }
        target: { text: "srv-8 at 03-03 09:30 ran r41", occurrence: 1 }
      - {
          id: expect-file-gate,
          type: expect.file,
          at: { afterAction: run-3 },
          path: main.go,
          contains: 'fmt.Println("release flag on:", stale == 0)',
        }
      - { id: dock-3, type: runtime.collapseDock, at: { mark: dock-3 } }

  - id: drift
    chapter: Trail ကို ဘယ်နေရာမှာ ကျော်သွားတတ်လဲ
    narration: >-
      [[mark:show-drift]] တကယ့် system မှာ ဒီ trail ကို ကျော်သွားတတ်တဲ့ နေရာ သုံးခု ရှိပါတယ်။ [[mark:pt-r8]] ပထမက deploy log ကိုတောင် မယုံရတာပါ။ deploy tool က file ပို့ပြီးတာနဲ့ success လို့ ရေးတတ်ပေမဲ့ server က run နေတာက တခြား version ဖြစ်နိုင်ပါတယ်။ log က ရည်ရွယ်ချက်ပါ၊ server ရဲ့ report က အမှန်ပါ။ [[mark:pt-rec]] ဒါကြောင့် server တိုင်းက ကိုယ့် version ကို report လုပ်ပြီး အဲဒါကို log နဲ့ reconcile လုပ်ရပါတယ်၊ မကိုက်ရင် flag က off ပဲ ဆက်နေပါတယ်။ [[mark:drift-2]] ဒုတိယက flag ဖွင့်တာ၊ config ပြောင်းတာ ဆိုတာလည်း deploy တစ်ခုပါပဲ။ code တစ်ကြောင်းမှ မပြောင်းဘဲ production ရဲ့ အပြုအမူ ပြောင်းသွားလို့ အဲဒါတွေလည်း review၊ approval နဲ့ trail ကို ဖြတ်ရပါတယ်။ Knight မှာ code အဟောင်းကို နှိုးလိုက်တာက ပြန်သုံးလိုက်တဲ့ flag တစ်ခုပါ။ [[mark:drift-3]] တတိယက gate ကို ဘယ်သူ ပြင်နိုင်လဲ ဆိုတာပါ။ branch protection ကို ပိတ်နိုင်တဲ့ admin၊ pipeline config ကို ပြင်နိုင်တဲ့သူက rule အားလုံးကို ကျော်နိုင်ပါတယ်။ ဒါကြောင့် အဲဒီ setting ပြောင်းတာကလည်း trail ရှိတဲ့ change တစ်ခု ဖြစ်ရပြီး၊ admin bypass ကို break-glass လမ်းကြောင်းလို အပြည့်အဝ audit လုပ်ရပါတယ်။ [[mark:principles]] No lost data၊ ဆိုလိုတာက ငွေနဲ့ ပတ်သက်ပြီး ဖြစ်ခဲ့သမျှ မပျောက်ရဘူး ဆိုတဲ့ မူအရ system ဘယ်လို ဖြစ်လာလဲ ဆိုတဲ့ history ကလည်း trail ထဲ ပါရပါတယ်။ No trust၊ ဆိုလိုတာက ဘယ်သူ့ကိုမှ၊ ကိုယ့် component ကိုတောင် အလိုလို မယုံရဘူး ဆိုတဲ့ မူအရ delivery control တွေကို system က enforce လုပ်ရပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — The change trail (SDLC) (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#the-change-trail-sdlc",
