build:
  voiceProfile:
    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 9529

runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "a41f9c2 merged\n7be03d1 blocked: no second reviewer\nc90e5aa blocked: no ticket, checks failed\n"
      run-2:
        status: success
        exitCode: 0
        output: "a41f9c2 merged\n7be03d1 blocked: no second reviewer\nc90e5aa blocked: no ticket, checks failed\nsrv-8 runs r41 not r42\nrelease flag on: false\n"
      run-3:
        status: success
        exitCode: 0
        output: "a41f9c2 merged\n7be03d1 blocked: no second reviewer\nc90e5aa blocked: no ticket, checks failed\nsrv-8 runs r41 not r42\nrelease flag on: false\nsrv-8 at 03-03 09:30 ran r41 deployed 02-20 18:05 by u-40\n"

scenes:
  - id: hook
    chapter: Code ကိုယ်တိုင်ရဲ့ audit trail
    narration: >-
      ငွေ system မှာ ledger entry တိုင်းအတွက် ဘယ်သူ၊ ဘာကြောင့်၊ ဘယ်တော့ ဆိုတာကို ပြနိုင်ရပါတယ်။ ဒါပေမဲ့ အဲဒီ entry တွေကို ရေးတဲ့ code ကိုယ်တိုင်ကရော။ regulated ဖြစ်တဲ့ နေရာမှာ auditor က များသောအားဖြင့် ဒီ code ကို ဘယ်သူ ရေးလဲ၊ ဘယ်သူ approve လုပ်လဲ၊ production ကို ဘယ်တော့ ရောက်လဲ ဆိုတာကိုပါ မေးပါတယ်။ [[mark:sel-changes]] ဒီ record သုံးခုက merge request သုံးခုပါ။ တစ်ခုစီမှာ commit၊ author၊ approver၊ ဘာကြောင့် ပြောင်းလဲ ဆိုတဲ့ ticket နဲ့ CI check ရလဒ် ပါပါတယ်။ [[mark:sel-review]] ဒီ function က change တစ်ခု main branch ကို မရောက်ခင် ဖြတ်ရမယ့် gate ပါ။ approve လုပ်တဲ့သူက ရေးတဲ့သူ မဖြစ်ရဘူး၊ ticket ရှိရမယ်၊ check တွေ pass ဖြစ်ရမယ်။ change သုံးခုကို ဒီ gate နဲ့ စစ်ကြည့်ရအောင်။ [[mark:run-1]] run လိုက်ရအောင်။
    sources:
      - {
          title: "Fintech Engineering Handbook — The change trail (SDLC) (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#the-change-trail-sdlc",
        }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }
      - id: sel-changes
        type: editor.select
        at: { mark: sel-changes }
        target: { file: main.go, text: "var changes = []Change{", occurrence: 1 }
      - id: sel-review
        type: editor.select
        at: { mark: sel-review }
        target: { file: main.go, text: "func review(c Change) []string {", occurrence: 1 }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "7be03d1 blocked: no second reviewer",
          timeoutMs: 8000,
        }

  - id: read-1
    narration: >-
      [[mark:pt-merged]] ပထမ change က rule သုံးခုလုံး ပြည့်လို့ merge ဖြစ်ပါတယ်။ [[mark:pt-self]] ဒုတိယ change မှာတော့ ရေးတဲ့သူနဲ့ approve လုပ်တဲ့သူ တစ်ယောက်တည်း ဖြစ်နေလို့ block ဖြစ်ပါတယ်၊ four-eyes မှာ တွေ့ခဲ့တဲ့ rule ပါပဲ။ [[mark:pt-noticket]] တတိယ change ကတော့ ဘာကြောင့် ပြောင်းလဲ ဆိုတဲ့ ticket မရှိသလို check တွေလည်း fail ဖြစ်နေပါတယ်။ [[mark:dock-1]] သတိထားရမှာက ဒီ စစ်ဆေးမှုကို reviewer တစ်ယောက်ရဲ့ သတိနဲ့ လုပ်တာ မဟုတ်ဘဲ code က လုပ်တာပါ။ ဒါကြောင့် အလောတကြီး merge လုပ်ရတဲ့ ညမှာလည်း rule က မပြောင်းပါဘူး။
    sources:
      - {
          title: "Fintech Engineering Handbook — Segregation of duties and four-eyes (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#segregation-of-duties-and-four-eyes",
        }
    actions:
      - id: pt-merged
        type: console.point
        at: { mark: pt-merged }
        target: { text: "a41f9c2 merged", occurrence: 1 }
      - id: pt-self
        type: console.point
        at: { mark: pt-self }
        target: { text: "no second reviewer", occurrence: 1 }
      - id: pt-noticket
        type: console.point
        at: { mark: pt-noticket }
        target: { text: "no ticket, checks failed", occurrence: 1 }
      - { id: dock-1, type: runtime.collapseDock, at: { mark: dock-1 } }

  - id: trail
    chapter: Source control က record
    narration: >-
      [[mark:show-trail]] code တစ်ကြောင်း production ကို ရောက်ဖို့ ဖြတ်ရတဲ့ လမ်းကြောင်း တစ်ခုလုံးက audit trail တစ်ခုပါ။ [[mark:pt-commit]] commit က ဘာပြောင်းလဲ၊ ဘယ်သူ ပြောင်းလဲ ဆိုတာကို မှတ်ပြီး၊ ticket နဲ့ ချိတ်ထားရင် ဘာကြောင့် ပြောင်းလဲ ဆိုတာပါ ပါလာပါတယ်။ ledger entry တစ်ခုမှာ လိုတဲ့ what၊ who၊ why နဲ့ အတူတူပါပဲ။ [[mark:trail-2]] review က ဒုတိယ လူတစ်ယောက် approve လုပ်တာကို မှတ်ပြီး၊ CI က test နဲ့ scan တွေ pass ဖြစ်တာကို မှတ်ပါတယ်။ [[mark:trail-3]] deploy မှာတော့ ဘယ် version ကို ဘယ်သူ ဘယ်တော့ release လုပ်လဲ၊ ဘယ် server ပေါ်မှာ ဘာ run နေလဲ ဆိုတာ မှတ်ရပါတယ်။ [[mark:pt-running]] ဒါမှ incident တစ်ခု ဖြစ်တဲ့ အခါ အဲဒါကို ဖြစ်စေတဲ့ change ဆီ ပြန်ခြေရာခံလို့ ရပါတယ်။ [[mark:trail-4]] ဒီ မှတ်တမ်းကို ledger လိုပဲ ပြန်ပြင်လို့ မရအောင် ကာကွယ်ရပါတယ်။ commit တွေကို sign လုပ်တာ၊ main branch ကို protect လုပ်တာ၊ shared history ကို force-push နဲ့ ပြန်ရေးခွင့် မပေးတာတွေ ရှိမှ ဒီ trail ကို ယုံလို့ ရပါတယ်။
    sources:
      - {
          title: "Fintech Engineering Handbook — The change trail (SDLC) (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#the-change-trail-sdlc",
        }
      - {
          title: "Fintech Engineering Handbook — Audits and audit trails (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#audits-and-audit-trails",
        }
    actions:
      - {
          id: show-trail,
          type: slide.show,
          at: { mark: show-trail, offsetMs: -700 },
          slideId: trail-1,
        }
      - { id: pt-commit, type: slide.point, at: { mark: pt-commit }, target: { x: 0.125, y: 0.52 } }
