  - id: try-it
    narration: >-
      [[mark:close-iv]] ကိုယ်တိုင် စမ်းကြည့်ဖို့ တစ်ခု ရှိပါတယ်။ [[mark:open-trail]] trail ဖိုင်ထဲမှာ server တွေရဲ့ report နဲ့ deploy log ရှိပါတယ်။ [[mark:sel-try]] server ရှစ်ခုမြောက်ရဲ့ version ကို release အသစ်လို့ ပြောင်းပြီး run ကြည့်ပါ။ flag က true ဖြစ်သွားပေမဲ့ အောက်ဆုံး line က version အဟောင်းလို့ပဲ ဆက်ပြောနေပါလိမ့်မယ်။ server ကို လက်နဲ့ ပြင်ပြီး log ထဲ မှတ်မထားရင် trail က အမှန်ကို မပြောတော့ပါဘူး၊ reconcile လုပ်ရတဲ့ အကြောင်းရင်းလည်း ဒါပါပဲ။ [[mark:recap]] ပြန်ချုပ်ရရင်၊ code ကနေ production အထိ လမ်းကြောင်းကလည်း ledger လိုပဲ audit trail တစ်ခုဖြစ်ပြီး၊ အဲဒီ trail ကို လူက မှတ်ထားတာ မဟုတ်ဘဲ system က enforce လုပ်ပြီး စစ်ပေးရပါတယ်။ နောက် lesson ကစပြီး testing အပိုင်းကို ရောက်ပါမယ်။ ဖြစ်နိုင်တဲ့ input တွေကို စာရင်းလုပ်လို့ မရရင် ငွေတွက်တဲ့ code ကို ဘယ်လို test လုပ်မလဲ ဆိုတာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — The change trail (SDLC) (Voytek Pitula, CC BY 4.0)",
