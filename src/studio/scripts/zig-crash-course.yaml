build:
  voiceProfile: pocket-alba-v1
  seed: 23

runtime:
  kind: zig-playground
  # Nothing runs until the last scene, so the dock would otherwise hold
  # 288px open over an empty console for the whole lesson.
  dockStartsCollapsed: true
  defaultMode: fixture
  fixture:
    latencyMs: 900
    result:
      status: success
      output: "Zig, in one file\nZig 4\nfound at 4\nmissing 99\nsize 42\ncaught InvalidCharacter\nwindow { 20, 30, 40 } len 3\ntext héllo bytes 6 equal true\narea 12.57\narea 12.00\nsquares { 1, 4, 9, 16, 25 }\nlen 5 room 33\nbiggest u8 50\ntable { 0, 2, 4, 6, 8 }\nleaks: ok\n"

checks:
  - { type: timing.p95Ms, max: 300 }

scenes:
  - id: memory
    narration: >
      Zig gives you something that most languages hide. It gives you memory.
      [[mark:memory-draw-stack]] When your program calls a function, that call gets a small
      block of memory. We call it a frame. The frame holds the function's own values.
      [[mark:memory-draw-frames]] Every new call puts another frame on top of the last one.
      [[mark:memory-draw-heap]] There's a second place, called the heap. It's one large
      space, and any part of the program can use it. It's where things go when you don't
      know the size ahead of time, or when a value has to outlive the function that made
      it. [[mark:memory-draw-alloc]] So a function can ask for a piece of the heap.
      [[mark:memory-draw-dead]] Now let's say those two functions finish. Their frames go
      away on their own. Nobody had to do anything, and nobody could forget.
      [[mark:memory-draw-note]] The heap block doesn't go away. Some line of code has to
      give it back. In Python or JavaScript a garbage collector does that for you. In Zig
      there isn't one, so the job becomes yours, and it becomes visible in the code.
      [[mark:memory-to-code]] That one difference shapes the whole language. Let's write
      some.
    sources:
      - {
          title: "Zig Language Reference — Memory",
          url: "https://ziglang.org/documentation/0.16.0/#Memory",
        }
      - {
          title: "Zig Language Reference — Choosing an Allocator",
          url: "https://ziglang.org/documentation/0.16.0/#Choosing-an-Allocator",
        }
    actions:
      - id: memory-open-board
        type: whiteboard.apply
        at: { scene: start, offsetMs: -1700 }
        open: true
      - id: memory-draw-a-title
        type: whiteboard.apply
        at: { scene: start, offsetMs: -1200 }
        upsertIds: [a-title]
        drawMs: 700
      - id: memory-draw-stack
        type: whiteboard.apply
        at: { mark: memory-draw-stack }
        upsertIds: [a-stack, a-stack-line, a-main, a-main-t]
        drawMs: 900
      - id: memory-draw-frames
        type: whiteboard.apply
        at: { mark: memory-draw-frames }
        upsertIds: [a-load, a-load-t, a-parse, a-parse-t]
        drawMs: 1100
      - id: memory-draw-heap
        type: whiteboard.apply
        at: { mark: memory-draw-heap }
        upsertIds: [a-heap, a-heap-line, a-heap-box]
        drawMs: 900
      - id: memory-draw-alloc
        type: whiteboard.apply
        at: { mark: memory-draw-alloc }
        upsertIds: [a-alloc-t, a-alloc-arrow, a-block]
        drawMs: 1000
      - id: memory-draw-dead
        type: whiteboard.apply
        at: { mark: memory-draw-dead }
        upsertIds: [a-kill-parse, a-kill-load]
        drawMs: 800
      - id: memory-draw-note
        type: whiteboard.apply
        at: { mark: memory-draw-note }
        upsertIds: [a-note, a-note2]
        drawMs: 900
      - id: memory-close-a
        type: whiteboard.apply
        at: { mark: memory-to-code }
        open: false
  - id: values
    narration: >
      [[mark:values-open-main]] Here's the whole program. One file, one main function, and
      a print. Three small things in it are worth naming now. The at sign marks a builtin,
      so at import brings in the standard library. The exclamation mark before void says
      main is allowed to return an error. And the dot with two braces is the list of values
      to put into the message. It's empty here because this message has no holes in it.
      [[mark:values-say-stderr]] One more thing about that print. It writes to the error
      stream, not the normal output stream. This runner shows you both together, so it
      makes no difference here. On your own computer they're two separate streams. Before
      we add anything, one warning that will save you a lot of time. Zig is still changing,
      and it changes in ways that break old code. This lesson is Zig zero point sixteen.
      Older articles, and answers from chat assistants, often won't compile any more. When
      something looks right and the compiler disagrees, check which version the example was
      written for. [[mark:values-type-values]] Now, naming values. Zig gives you two words.
      Const can't change after you set it. Var can. [[mark:values-select-count]] Look at
      the type here. u eight is an unsigned number, eight bits wide. Zig wants you to say
      how wide your numbers are. There's no plain int that quietly grows, and there's no
      silent conversion between sizes either. It feels strict at first. The point is that
      the cost of a value is never hidden from you.
    sources:
      - {
          title: "Zig Language Reference — Variables",
          url: "https://ziglang.org/documentation/0.16.0/#Variables",
        }
      - {
          title: "Zig 0.16.0 Release Notes",
          url: "https://ziglang.org/download/0.16.0/release-notes.html",
        }
    actions:
      - { id: open-main, type: workspace.openFile, at: { mark: values-open-main }, path: main.zig }
      - id: type-values
        type: editor.type
        at: { mark: values-type-values, offsetMs: -400 }
        target:
          {
            file: main.zig,
            after: "    std.debug.print(\"Zig, in one file\\n\", .{});\n",
            occurrence: 1,
          }
        cadence: line-by-line
        text: "\n    const language = \"Zig\";\n    var count: u8 = 3;\n    count += 1;\n    std.debug.print(\"{s} {d}\\n\", .{ language, count });\n"
      - id: select-count
        type: editor.select
        at: { mark: values-select-count }
        target: { file: main.zig, text: "var count: u8 = 3;", occurrence: 1 }
  - id: optionals
    narration: >
      [[mark:optionals-type-indexof]] Here's a function that looks for a letter in some
      text. Sometimes there's no such letter, so it can't always return a position.
      [[mark:optionals-select-qmark]] The question mark in the return type says exactly
      that. This is an optional. [[mark:optionals-draw-opt]] An optional is one slot
      holding either a real value, or null. The important part isn't the null. It's that
      the type says a null is possible, so you can see it before you run anything.
      [[mark:optionals-type-optional-use]] To use it, you have to open it first.
      [[mark:optionals-select-capture]] Read this line as: if found holds a value, name
      that value at, and run this part. There's no way to reach the number without going
      through that check. So the mistake where a null shows up much later, far from where
      it started, can't happen at all. [[mark:optionals-say-orelse]] And when you'd rather
      not branch, orelse supplies a value to use in place of null.
    sources:
      - {
          title: "Zig Language Reference — Optionals",
          url: "https://ziglang.org/documentation/0.16.0/#Optionals",
        }
    actions:
      - id: type-indexof
        type: editor.type
        at: { mark: optionals-type-indexof, offsetMs: -400 }
        target:
          {
            file: main.zig,
            after: "    std.debug.print(\"{s} {d}\\n\", .{ language, count });\n}\n",
            occurrence: 1,
          }
        cadence: line-by-line
        text: "\nfn indexOf(haystack: []const u8, needle: u8) ?usize {\n    for (haystack, 0..) |c, i| {\n        if (c == needle) return i;\n    }\n    return null;\n}\n"
      - id: select-qmark
        type: editor.select
        at: { mark: optionals-select-qmark }
        target: { file: main.zig, text: "?usize", occurrence: 1 }
      - id: optionals-open-g
        type: whiteboard.apply
        at: { mark: optionals-draw-opt }
        open: true
        clear: true
        upsertIds: [g-title]
        drawMs: 700
      - id: optionals-draw-opt
        type: whiteboard.apply
        at: { mark: optionals-draw-opt, offsetMs: 700 }
        upsertIds:
          [g-opt, g-opt-line, g-opt-yes, g-opt-yes-a, g-opt-yes-b, g-opt-no, g-opt-no-a, g-opt-no-b]
        drawMs: 1800
      - id: optionals-close-g1
        type: whiteboard.apply
        at: { mark: optionals-type-optional-use, offsetMs: -1500 }
        open: false
      - id: type-optional-use
        type: editor.type
        at: { mark: optionals-type-optional-use, offsetMs: -400 }
        target:
          {
            file: main.zig,
            after: "    std.debug.print(\"{s} {d}\\n\", .{ language, count });\n",
            occurrence: 1,
          }
        cadence: line-by-line
        text: "\n    const found = indexOf(\"zig lesson\", 'l');\n    if (found) |at| std.debug.print(\"found at {d}\\n\", .{at});\n    std.debug.print(\"missing {d}\\n\", .{indexOf(\"zig lesson\", 'q') orelse 99});\n"
      - id: select-capture
        type: editor.select
        at: { mark: optionals-select-capture }
        target: { file: main.zig, text: "if (found) |at|", occurrence: 1 }
      - id: select-orelse
        type: editor.select
        at: { mark: optionals-say-orelse }
        target: { file: main.zig, text: "orelse 99", occurrence: 1 }
  - id: errors
    narration: >
      [[mark:errors-type-parsesize]] Errors work the same way. This function turns text
      into a number, and the text might not be a number at all. [[mark:errors-select-bang]]
      The exclamation mark means it returns a number or an error. [[mark:errors-draw-err]]
      And look at the shape. It's the same picture as the optional. One slot, two meanings.
      Learn one and you've learned both. [[mark:errors-type-error-use]] Catch deals with
      the error right where it happens. Here we print the name of the error and continue
      with a default. There's also try, which means: if this failed, stop and hand the
      error to whoever called me. [[mark:errors-draw-gate]] Zig has no exceptions and no
      hidden jumps out of a function. An error is an ordinary value that travels back
      through return, and the compiler won't let you quietly ignore one. One thing to know
      early: a Zig error is only a name. It carries no message and no extra data. If you
      need detail, you return it yourself.
    sources:
      - {
          title: "Zig Language Reference — Errors",
          url: "https://ziglang.org/documentation/0.16.0/#Errors",
        }
      - {
          title: "Zig Language Reference — Error Union Type",
          url: "https://ziglang.org/documentation/0.16.0/#Error-Union-Type",
        }
    actions:
      - id: type-parsesize
        type: editor.type
        at: { mark: errors-type-parsesize, offsetMs: -400 }
        target: { file: main.zig, after: "    return null;\n}\n", occurrence: 1 }
        cadence: line-by-line
        text: "\nfn parseSize(text: []const u8) !u32 {\n    return std.fmt.parseInt(u32, text, 10);\n}\n"
      - id: select-bang
        type: editor.select
        at: { mark: errors-select-bang }
        target: { file: main.zig, text: "!u32", occurrence: 1 }
      - id: errors-open-g2
        type: whiteboard.apply
        at: { mark: errors-draw-err }
        open: true
        upsertIds:
          [
            g-err,
            g-err-line,
            g-err-yes,
            g-err-yes-a,
            g-err-yes-b,
            g-err-no,
            g-err-no-a,
            g-err-no-b,
            g-opt-code,
            g-err-code,
          ]
        drawMs: 2000
      - id: errors-close-g2
        type: whiteboard.apply
        at: { mark: errors-type-error-use, offsetMs: -1500 }
        open: false
      - id: type-error-use
        type: editor.type
        at: { mark: errors-type-error-use, offsetMs: -400 }
        target:
          {
            file: main.zig,
            after: "    std.debug.print(\"missing {d}\\n\", .{indexOf(\"zig lesson\", 'q') orelse 99});\n",
            occurrence: 1,
          }
        cadence: line-by-line
        text: "\n    const size = parseSize(\"42\") catch 0;\n    std.debug.print(\"size {d}\\n\", .{size});\n    _ = parseSize(\"many\") catch |err| blk: {\n        std.debug.print(\"caught {t}\\n\", .{err});\n        break :blk 0;\n    };\n"
      - id: errors-open-g3
        type: whiteboard.apply
        at: { mark: errors-draw-gate }
        open: true
        upsertIds: [g-gate, g-gate-t]
        drawMs: 900
      - id: errors-close-g3
        type: whiteboard.apply
        at: { mark: errors-draw-gate, offsetMs: 3400 }
        open: false
  - id: slices
    narration: >
      [[mark:slices-type-slices]] Next, arrays and slices. This pair confuses more
      newcomers than anything else in the language, and it's worth five careful minutes.
      [[mark:slices-draw-array]] An array holds a fixed number of items, and that number is
      part of its type. Five u eight values is a different type from six u eight values.
      [[mark:slices-select-window]] This line takes a window over part of that array. The
      window is called a slice. [[mark:slices-draw-header]] And a slice is only two things.
      [[mark:slices-draw-ptr]] Where it starts. [[mark:slices-draw-len]] And how many items
      it covers. That's the whole idea. [[mark:slices-draw-note]] It copies nothing. It
      points at memory that belongs to somebody else. That's why passing a slice is cheap
      no matter how much data it covers. It's also why you have to know that the memory
      behind it is still alive, because the slice itself won't tell you.
    sources:
      - {
          title: "Zig Language Reference — Slices",
          url: "https://ziglang.org/documentation/0.16.0/#Slices",
        }
    actions:
      - id: type-slices
        type: editor.type
        at: { mark: slices-type-slices, offsetMs: -400 }
        target: { file: main.zig, after: "        break :blk 0;\n    };\n", occurrence: 1 }
        cadence: line-by-line
        text: "\n    const scores = [_]u8{ 10, 20, 30, 40, 50 };\n    const middle = scores[1..4];\n    std.debug.print(\"window {any} len {d}\\n\", .{ middle, middle.len });\n"
      - id: slices-open-b
        type: whiteboard.apply
        at: { mark: slices-draw-array }
        open: true
        clear: true
        upsertIds: [b-title]
        drawMs: 600
      - id: slices-draw-array
        type: whiteboard.apply
        at: { mark: slices-draw-array, offsetMs: 600 }
        upsertIds:
          [
            b-cell0,
            b-cell1,
            b-cell2,
            b-cell3,
            b-cell4,
            b-val0,
            b-val1,
            b-val2,
            b-val3,
            b-val4,
            b-arr-label,
          ]
        drawMs: 2200
      - id: slices-close-b1
        type: whiteboard.apply
        at: { mark: slices-select-window, offsetMs: -300 }
        open: false
      - id: select-window
        type: editor.select
        at: { mark: slices-select-window }
        target: { file: main.zig, text: "const middle = scores[1..4];", occurrence: 1 }
      - id: slices-open-b2
        type: whiteboard.apply
        at: { mark: slices-draw-header }
        open: true
        upsertIds: [b-head, b-ptr, b-ptr-t, b-len, b-len-t, b-slice-label]
        drawMs: 1600
      - id: slices-draw-ptr
        type: whiteboard.apply
        at: { mark: slices-draw-ptr }
        upsertIds: [b-arrow]
        drawMs: 600
      - id: slices-draw-len
        type: whiteboard.apply
        at: { mark: slices-draw-len }
        upsertIds: [b-len-v, b-span, b-span-t]
        drawMs: 1000
      - id: slices-close-b
        type: whiteboard.apply
        at: { mark: slices-draw-note, offsetMs: 3800 }
        open: false
  - id: strings
    narration: >
      [[mark:strings-type-strings]] That leads straight to the question people ask first.
      Where is the string type? There isn't one. [[mark:strings-draw-bytes]] A piece of
      text in Zig is a slice of bytes. The type is written as a slice of const u eight.
      Nothing more. [[mark:strings-draw-span]] Here's the part that surprises everyone.
      This word has five letters, but the accented letter takes two bytes, so the length is
      six. Length counts bytes, not letters. [[mark:strings-draw-eql]] And because a slice
      is a pointer and a length, comparing two of them with the equals sign would compare
      the pointers, not the text. So Zig doesn't offer that. You call std dot mem dot eql
      instead, and it compares the bytes. [[mark:strings-to-shapes]] Once you accept that
      text is just bytes, the rest follows.
    sources:
      - {
          title: "Zig Language Reference — Slices",
          url: "https://ziglang.org/documentation/0.16.0/#Slices",
        }
      - {
          title: "Zig Language Reference — String Literals",
          url: "https://ziglang.org/documentation/0.16.0/#String-Literals-and-Unicode-Code-Point-Literals",
        }
    actions:
      - id: type-strings
        type: editor.type
        at: { mark: strings-type-strings, offsetMs: -400 }
        target:
          {
            file: main.zig,
            after: "    std.debug.print(\"window {any} len {d}\\n\", .{ middle, middle.len });\n",
            occurrence: 1,
          }
        cadence: line-by-line
        text: "\n    const greeting: []const u8 = \"héllo\";\n    std.debug.print(\"text {s} bytes {d} equal {}\\n\", .{ greeting, greeting.len, std.mem.eql(u8, greeting, \"héllo\") });\n"
      - id: strings-open-i
        type: whiteboard.apply
        at: { mark: strings-draw-bytes }
        open: true
        clear: true
        upsertIds: [i-title, i-type]
        drawMs: 800
      - id: strings-draw-bytes
        type: whiteboard.apply
        at: { mark: strings-draw-bytes, offsetMs: 800 }
        upsertIds:
          [
            i-cell0,
            i-val0,
            i-cell1,
            i-val1,
            i-cell2,
            i-val2,
            i-cell3,
            i-val3,
            i-cell4,
            i-val4,
            i-cell5,
            i-val5,
          ]
        drawMs: 2400
      - id: strings-draw-span
        type: whiteboard.apply
        at: { mark: strings-draw-span }
        upsertIds: [i-span, i-span-t, i-len]
        drawMs: 1400
      - id: strings-draw-eql
        type: whiteboard.apply
        at: { mark: strings-draw-eql }
        upsertIds: [i-noeq, i-eql]
        drawMs: 1200
      - id: strings-close-i
        type: whiteboard.apply
        at: { mark: strings-to-shapes }
        open: false
  - id: shapes
    narration: >
      [[mark:shapes-type-shape]] Zig also has a type that can be one of several shapes.
      This is a tagged union. A shape here's either a circle or a rectangle, and never both
      at once. The value carries a tag saying which one it currently is.
      [[mark:shapes-select-switch]] Switch asks which one it is and hands you the value
      inside, already the right type. [[mark:shapes-type-shape-use]] And if you forget one
      of the cases, the program doesn't compile. The compiler counts the cases for you, so
      adding a new shape later shows you every place that has to change.
    sources:
      - {
          title: "Zig Language Reference — Tagged union",
          url: "https://ziglang.org/documentation/0.16.0/#Tagged-union",
        }
    actions:
      - id: type-shape
        type: editor.type
        at: { mark: shapes-type-shape, offsetMs: -400 }
        target:
          {
            file: main.zig,
            after: "    return std.fmt.parseInt(u32, text, 10);\n}\n",
            occurrence: 1,
          }
        cadence: line-by-line
        text: "\nconst Shape = union(enum) {\n    circle: f64,\n    rect: struct { w: f64, h: f64 },\n\n    fn area(self: Shape) f64 {\n        return switch (self) {\n            .circle => |r| 3.14159 * r * r,\n            .rect => |box| box.w * box.h,\n        };\n    }\n};\n"
      - id: select-switch
        type: editor.select
        at: { mark: shapes-select-switch }
        target: { file: main.zig, text: "return switch (self) {", occurrence: 1 }
      - id: type-shape-use
        type: editor.type
        at: { mark: shapes-type-shape-use, offsetMs: -400 }
        target:
          {
            file: main.zig,
            after: "    std.debug.print(\"text {s} bytes {d} equal {}\\n\", .{ greeting, greeting.len, std.mem.eql(u8, greeting, \"héllo\") });\n",
            occurrence: 1,
          }
        cadence: line-by-line
        text: "\n    const shapes = [_]Shape{ .{ .circle = 2 }, .{ .rect = .{ .w = 3, .h = 4 } } };\n    for (shapes) |shape| std.debug.print(\"area {d:.2}\\n\", .{shape.area()});\n"
  - id: allocator
    narration: >
      [[mark:allocator-type-allocator]] Now back to the heap, and this is the part that
      makes Zig different from almost everything else. [[mark:allocator-draw-actor]] An
      allocator is just a value. It isn't a keyword, and it isn't a service running in the
      background. [[mark:allocator-draw-chain]] If a function needs memory, you pass the
      allocator into it, by hand, like any other argument. [[mark:allocator-draw-rail]]
      Which means you can read a function's first line and know whether it's able to
      allocate at all. A function without an allocator can't surprise you. That's the whole
      trade: more typing, and no hidden allocation anywhere in your program.
      [[mark:allocator-select-defer]] Defer says what should happen at the end of the
      block. [[mark:allocator-draw-note]] It runs when the block ends, not when the
      function ends, and it runs even if you return early. So you write the cleanup right
      next to the setup, and the two stay together as the code grows. This one reports
      whether we gave back everything we took.
    sources:
      - {
          title: "Zig Language Reference — Choosing an Allocator",
          url: "https://ziglang.org/documentation/0.16.0/#Choosing-an-Allocator",
        }
      - {
          title: "Zig Language Reference — defer",
          url: "https://ziglang.org/documentation/0.16.0/#defer",
        }
    actions:
      - id: type-allocator
        type: editor.type
        at: { mark: allocator-type-allocator, offsetMs: -400 }
        target:
          {
            file: main.zig,
            after: "    for (shapes) |shape| std.debug.print(\"area {d:.2}\\n\", .{shape.area()});\n",
            occurrence: 1,
          }
        cadence: line-by-line
        text: "\n    var gpa: std.heap.DebugAllocator(.{}) = .init;\n    defer std.debug.print(\"leaks: {t}\\n\", .{gpa.deinit()});\n    const allocator = gpa.allocator();\n"
      - id: allocator-open-c
        type: whiteboard.apply
        at: { mark: allocator-draw-actor }
        open: true
        clear: true
        upsertIds: [c-title]
        drawMs: 600
      - id: allocator-draw-actor
        type: whiteboard.apply
        at: { mark: allocator-draw-actor, offsetMs: 600 }
        upsertIds: [c-actor, c-actor-t]
        drawMs: 800
      - id: allocator-draw-chain
        type: whiteboard.apply
        at: { mark: allocator-draw-chain }
        upsertIds: [c-main, c-main-t, c-call1, c-load, c-load-t, c-call2, c-join, c-join-t]
        drawMs: 2200
      - id: allocator-draw-rail
        type: whiteboard.apply
        at: { mark: allocator-draw-rail }
        upsertIds: [c-rail, c-drop1, c-drop2, c-drop3, c-note]
        drawMs: 1600
      - id: allocator-draw-defer-note
        type: whiteboard.apply
        at: { mark: allocator-draw-note, offsetMs: 1200 }
        upsertIds: [c-defer, c-defer-ok]
        drawMs: 900
      - id: allocator-close-c
        type: whiteboard.apply
        at: { mark: allocator-select-defer, offsetMs: -300 }
        open: false
      - id: select-defer
        type: editor.select
        at: { mark: allocator-select-defer }
        target:
          {
            file: main.zig,
            text: "defer std.debug.print(\"leaks: {t}\\n\", .{gpa.deinit()});",
            occurrence: 1,
          }
  - id: list
    narration: >
      [[mark:list-type-list]] A list that grows needs the heap, so it needs an allocator.
      [[mark:list-select-append]] Notice we hand the allocator to append itself. The list
      doesn't keep one inside it. That's deliberate: the list stays a plain piece of data,
      and the caller stays in charge. [[mark:list-draw-before]] Inside, the list holds a
      pointer, a length, and a capacity. Capacity is how much room it has. Length is how
      much of that room it's using. [[mark:list-draw-append]] When you append and there's
      no room left, the list doesn't stretch where it is. [[mark:list-draw-after]] It asks
      the allocator for a bigger block, copies the items across, and gives the old block
      back. [[mark:list-draw-dead]] And the old memory is gone. So if you kept a pointer
      into the list, that pointer is now pointing at memory the list no longer owns. This
      is the most common bug in Zig programs, and now you know about it before it happens
      to you. Read the pointer again after you append.
    sources:
      - {
          title: "Zig Standard Library — array_list.zig",
          url: "https://github.com/ziglang/zig/blob/0.16.0/lib/std/array_list.zig",
        }
    actions:
      - id: type-list
        type: editor.type
        at: { mark: list-type-list, offsetMs: -400 }
        target: { file: main.zig, after: "    const allocator = gpa.allocator();\n", occurrence: 1 }
        cadence: line-by-line
        text: "\n    var squares: std.ArrayList(u32) = .empty;\n    defer squares.deinit(allocator);\n    for (1..6) |n| try squares.append(allocator, @intCast(n * n));\n    std.debug.print(\"squares {any}\\n\", .{squares.items});\n    std.debug.print(\"len {d} room {d}\\n\", .{ squares.items.len, squares.capacity });\n"
      - id: select-append
        type: editor.select
        at: { mark: list-select-append }
        target:
          { file: main.zig, text: "squares.append(allocator, @intCast(n * n))", occurrence: 1 }
      - id: list-open-e
        type: whiteboard.apply
        at: { mark: list-draw-before }
        open: true
        clear: true
        upsertIds: [e-title]
        drawMs: 600
      - id: list-draw-before
        type: whiteboard.apply
        at: { mark: list-draw-before, offsetMs: 600 }
        upsertIds:
          [
            e-h1,
            e-h1r1,
            e-h1t1,
            e-h1r2,
            e-h1t2,
            e-h1r3,
            e-h1t3,
            e-h1arrow,
            e-old0,
            e-oldv0,
            e-old1,
            e-oldv1,
          ]
        drawMs: 2600
      - id: list-draw-append
        type: whiteboard.apply
        at: { mark: list-draw-append }
        upsertIds: [e-time, e-time-t]
        drawMs: 800
      - id: list-draw-after
        type: whiteboard.apply
        at: { mark: list-draw-after }
        upsertIds:
          [
            e-h2,
            e-h2r1,
            e-h2t1,
            e-h2r2,
            e-h2t2,
            e-h2r3,
            e-h2t3,
            e-h2arrow,
            e-new0,
            e-new1,
            e-new2,
            e-new3,
            e-new4,
            e-new5,
            e-newv0,
            e-newv1,
            e-newv2,
            e-lenspan,
            e-lenspan-t,
            e-capspan,
            e-capspan-t,
          ]
        drawMs: 3000
      - id: list-draw-dead
        type: whiteboard.apply
        at: { mark: list-draw-dead }
        upsertIds: [e-dead, e-dead-t]
        drawMs: 900
      - id: list-close-e
        type: whiteboard.apply
        at: { mark: list-draw-dead, offsetMs: 6000 }
        open: false
  - id: comptime
    narration: >
      [[mark:comptime-type-comptime]] One more idea, and it's the one people find
      strangest. Some of your Zig code runs inside the compiler, before your program
      starts. [[mark:comptime-select-comptime-t]] Comptime T means this argument is a type,
      and it's settled while compiling. You write the function once and it works for any
      type that supports the comparison. That's how Zig does generic code. There's no
      separate generics syntax to learn, because a type is just another value the compiler
      can pass around. [[mark:comptime-draw-lanes]] So it helps to think about two
      different times. [[mark:comptime-draw-runtime]] Compile time settles types, array
      lengths, and generic code. Run time deals with real values, input, and output.
      [[mark:comptime-draw-note]] Work can move down, out of run time and into compile
      time. It never moves back up. A value the compiler settled is already there when the
      program starts. [[mark:comptime-type-comptime-use]] This small table is a good
      example. The loop that fills it runs in the compiler. At run time there's no loop
      left, only the finished numbers.
    sources:
      - {
          title: "Zig Language Reference — comptime",
          url: "https://ziglang.org/documentation/0.16.0/#comptime",
        }
      - {
          title: "What is Zig's Comptime? — Loris Cro",
          url: "https://kristoff.it/blog/what-is-zig-comptime/",
        }
    actions:
      - id: type-comptime
        type: editor.type
        at: { mark: comptime-type-comptime, offsetMs: -400 }
        target: { file: main.zig, after: "        };\n    }\n};\n", occurrence: 1 }
        cadence: line-by-line
        text: "\nfn biggest(comptime T: type, items: []const T) T {\n    var best = items[0];\n    for (items[1..]) |item| {\n        if (item > best) best = item;\n    }\n    return best;\n}\n\nconst doubles = blk: {\n    var table: [5]u32 = undefined;\n    for (&table, 0..) |*slot, i| slot.* = @intCast(i * 2);\n    break :blk table;\n};\n"
      - id: select-comptime-t
        type: editor.select
        at: { mark: comptime-select-comptime-t }
        target: { file: main.zig, text: "comptime T: type", occurrence: 1 }
      - id: comptime-open-f
        type: whiteboard.apply
        at: { mark: comptime-draw-lanes }
        open: true
        clear: true
        upsertIds: [f-title]
        drawMs: 600
      - id: comptime-draw-lanes
        type: whiteboard.apply
        at: { mark: comptime-draw-lanes, offsetMs: 600 }
        upsertIds: [f-lane1, f-lane1-t, f-c1, f-c1t, f-c2, f-c2t, f-c3, f-c3t]
        drawMs: 2200
      - id: comptime-draw-runtime
        type: whiteboard.apply
        at: { mark: comptime-draw-runtime }
        upsertIds: [f-start, f-start-t, f-lane2, f-lane2-t, f-r1, f-r1t, f-r2, f-r2t, f-r3, f-r3t]
        drawMs: 2800
      - id: comptime-draw-note
        type: whiteboard.apply
        at: { mark: comptime-draw-note }
        upsertIds: [f-note]
        drawMs: 800
      - id: comptime-close-f
        type: whiteboard.apply
        at: { mark: comptime-type-comptime-use, offsetMs: -1500 }
        open: false
      - id: type-comptime-use
        type: editor.type
        at: { mark: comptime-type-comptime-use, offsetMs: -400 }
        target:
          {
            file: main.zig,
            after: "    std.debug.print(\"len {d} room {d}\\n\", .{ squares.items.len, squares.capacity });\n",
            occurrence: 1,
          }
        cadence: line-by-line
        text: "\n    std.debug.print(\"biggest u8 {d}\\n\", .{biggest(u8, &scores)});\n    std.debug.print(\"table {any}\\n\", .{doubles});\n"
  - id: run
    narration: >
      [[mark:run-run]] That's the language. Let's run all of it at once. [[mark:run-read]]
      Every line here's one of the ideas we went through. The optional that found a letter,
      and the one that found nothing and gave us ninety nine instead. The error we caught
      by name. The window over the array, three items long. The word that's five letters
      and six bytes. [[mark:run-read-room]] Look at this line. Five items, and room for
      thirty three. The list asked for far more space than it needed, so it won't have to
      move again for a while. That's a real number from a real run, not a rule to remember.
      [[mark:run-read-last]] And the last line is the leak check. It says ok, because defer
      gave the memory back. It's printed last because deferred work runs at the end, in
      reverse order. [[mark:run-close]] You now know how Zig handles values, errors,
      memory, and time. That's enough to read most Zig code and write a little.
      [[mark:run-say-unused]] One thing to expect when you edit it. In Zig a value you
      declare and never use is an error, not a warning. The compiler says unused local
      constant. So if you stop using something, delete the line, or write underscore,
      equals, and the name, to say you meant to ignore it. [[mark:run-sign-off]] Open the
      file, change something, and run it again.
    sources:
      - { title: "Zig Learn — Overview", url: "https://ziglang.org/learn/overview/" }
    actions:
      - { id: run-program, type: runtime.run, at: { mark: run-run }, timeoutMs: 30000 }
      - {
          id: expect-window,
          type: expect.output,
          at: { afterAction: run-program },
          contains: "window { 20, 30, 40 } len 3",
          timeoutMs: 15000,
        }
      - {
          id: expect-bytes,
          type: expect.output,
          at: { afterAction: run-program },
          contains: "text héllo bytes 6 equal true",
          timeoutMs: 15000,
        }
      - {
          id: expect-caught,
          type: expect.output,
          at: { afterAction: run-program },
          contains: "caught InvalidCharacter",
          timeoutMs: 15000,
        }
      - {
          id: expect-room,
          type: expect.output,
          at: { afterAction: run-program },
          contains: "len 5 room 33",
          timeoutMs: 15000,
        }
      - {
          id: expect-table,
          type: expect.output,
          at: { afterAction: run-program },
          contains: "table { 0, 2, 4, 6, 8 }",
          timeoutMs: 15000,
        }
      - {
          id: expect-leaks,
          type: expect.output,
          at: { afterAction: run-program },
          contains: "leaks: ok",
          timeoutMs: 15000,
        }
