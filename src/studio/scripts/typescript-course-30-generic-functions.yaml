build:
  # Studio replaces this built-in profile at render time with the Burmese provider chosen in the
  # render console (AthanLab with the user's own key, or VoxCPM2 when that feature is enabled).
  voiceProfile: pocket-alba-v1
  seed: 3030
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "Function တွေမှာ type parameter"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ mapped type နဲ့ key တွေကို တစ်ခုချင်း loop ပတ်ပြီး object
      type အသစ် ဆောက်ခဲ့ပြီး၊ Partial နဲ့ Readonly ကိုလည်း type parameter T နဲ့ ကိုယ်တိုင်
      ရေးကြည့်ခဲ့ပါတယ်။ lesson ၂၇ ကစပြီး type parameter ကို type တွေမှာပဲ သုံးခဲ့တာ ဖြစ်လို့၊ ဒီ lesson
      မှာတော့ function တွေမှာ သုံးတဲ့ generic function ကို ကြည့်သွားပါမယ်။ [[mark:utils-folder]] project
      အများစုမှာ နေရာ အများကြီးက ပြန်ခေါ်သုံးတဲ့ function လေးတွေကို စုထားတဲ့ utils folder ရှိတတ်ပြီး၊
      အဲဒီ function တွေက type အမျိုးမျိုးနဲ့ အလုပ်လုပ်ရလို့ generic function တွေ အရမ်း အသုံးဝင်ပါတယ်။
      [[mark:draw-any]] ဥပမာအားဖြင့် array ရဲ့ နောက်ဆုံး item ကို ပြန်ပေးတဲ့ function ကို parameter မှာ
      any နဲ့ ရေးထားတယ် ဆိုပါစို့။ ဘယ် array ကိုမဆို လက်ခံပေမယ့်၊ အော်ဒါ array ကို ထည့်ပေးလိုက်ရင်
      ပြန်ထွက်လာတာက any ဖြစ်သွားပြီး၊ ဘာ ဝင်လာလဲ ဆိုတာကို TypeScript က မေ့သွားပါတယ်။
      [[mark:draw-generic]] function မှာ type parameter T ကို ထည့်လိုက်ရင်တော့၊ အော်ဒါ array ကို
      ထည့်တဲ့အခါ T က Order ဖြစ်သွားပြီး၊ ပြန်ထွက်လာတာကလည်း Order ဖြစ်ပါတယ်။ ဆိုလိုတာက output ရဲ့ type က
      input ရဲ့ type ကို လိုက်သွားတာပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 16: Utility Folder Development (generic functions)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/utility-folder-development-in-typescript",
        }
      - {
          title: "TypeScript Handbook: More on Functions (generic functions)",
          url: "https://www.typescriptlang.org/docs/handbook/2/functions.html#generic-functions",
        }
    actions:
      - id: open-board-a
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-any
        type: whiteboard.apply
        at: { mark: draw-any }
        upsertIds:
          [a-any-in, a-any-arrow-1, a-any-box, a-any-fn, a-any-arrow-2, a-any-out, a-any-note]
        drawMs: 3400
      - id: draw-generic
        type: whiteboard.apply
        at: { mark: draw-generic }
        upsertIds:
          [a-gen-in, a-gen-arrow-1, a-gen-box, a-gen-fn, a-gen-arrow-2, a-gen-out, a-gen-note]
        drawMs: 3400

  - id: starter
    narration: >
      [[mark:close-board]] ဒီနေ့ code ကို ကြည့်ရအောင်။ [[mark:open-utils]] ဒါက ဆိုင်ရဲ့ utils ဖိုင်ပါ။
      [[mark:select-lastof]] array တစ်ခုရဲ့ နောက်ဆုံး item ကို ပြန်ပေးတဲ့ function ကို တစ်ကြောင်းတည်းနဲ့
      ရေးထားပါတယ်။ parameter ကို any array လို့ ကြေညာထားလို့ ဘယ်လို array ကိုမဆို လက်ခံပါတယ်။
      [[mark:open-main]] main ဖိုင်ကို ကြည့်ရအောင်။ [[mark:select-orders]] အော်ဒါ နှစ်ခု ပါတဲ့ array
      ရှိပြီး၊ [[mark:select-latest]] နောက်ဆုံး ဝင်လာတဲ့ အော်ဒါကို ဒီ function နဲ့ ယူထားပါတယ်။
      [[mark:select-print]] နောက်ဆုံး line က အဲဒီ အော်ဒါရဲ့ ပစ္စည်း နာမည်နဲ့ အရေအတွက်ကို ထုတ်ပြပါတယ်။
      ဒါပေမဲ့ အရေအတွက်ကို နာမည်အတိုနဲ့ ရေးထားပြီး၊ Order type ထဲမှာတော့ quantity လို့ အပြည့်အစုံ နာမည်
      ပေးထားတာကို သတိထား ကြည့်ပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 16: Utility Folder Development (the problem generic functions solve)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/utility-folder-development-in-typescript",
        }
      - {
          title: "TypeScript Handbook: Generics (hello world of generics, any)",
          url: "https://www.typescriptlang.org/docs/handbook/2/generics.html",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: open-utils
        type: workspace.openFile
        at: { mark: open-utils }
        path: src/utils.ts
      - id: select-lastof
        type: editor.select
        at: { mark: select-lastof }
        target:
          {
            file: src/utils.ts,
            text: "export function lastOf(list: any[]) { return list[list.length - 1]; }",
            occurrence: 1,
          }
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: src/main.ts
      - id: select-orders
        type: editor.select
        at: { mark: select-orders }
        target:
          {
            file: src/main.ts,
            text: "  { id: 1, item: \"လက်ဖက်ရည်\", quantity: 2 },\n  { id: 2, item: \"ကော်ဖီ\", quantity: 1 },",
            occurrence: 1,
          }
      - id: select-latest
        type: editor.select
        at: { mark: select-latest }
        target: { file: src/main.ts, text: "const latest = lastOf(orders);", occurrence: 1 }
      - id: select-print
        type: editor.select
        at: { mark: select-print }
        target:
          { file: src/main.ts, text: 'console.log(latest.item, latest.qty, "ခွက်");', occurrence: 1 }

  - id: any-problem
    narration: >
      [[mark:panel-ready]] panel ရဲ့ Output မှာ ကော်ဖီ ဆိုတာ မှန်ပေမယ့်၊ အရေအတွက် နေရာမှာတော့ undefined
      ထွက်နေပါတယ်။ ဒါပေမဲ့ Errors မှာ ဘာ error မှ မရှိပါဘူး။ [[mark:type-call-query]] function ကို
      ခေါ်ထားတဲ့ နေရာအောက်မှာ query comment ထည့်ပြီး ဘာ ဖြစ်နေလဲ ကြည့်ရအောင်။ [[mark:read-any]] Types
      မှာ ဒီ function က any array ကို လက်ခံပြီး any ကို ပြန်ပေးတယ်လို့ ပြနေပါတယ်။ ဆိုတော့ အော်ဒါ array ကို
      ထည့်ပေးလိုက်ပေမယ့်၊ ပြန်ထွက်လာတာက any ဖြစ်သွားပြီး TypeScript က အော်ဒါ ဆိုတာကို မေ့သွားပါတယ်။ any
      ပေါ်မှာ ဘာ property ကို ယူယူ မစစ်တော့တဲ့ အတွက်၊ နာမည် မှားနေတာကိုလည်း ပြောမပြနိုင်တော့တာပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 16: Utility Folder Development (the problem generic functions solve)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/utility-folder-development-in-typescript",
        }
      - {
          title: "TypeScript Handbook: Everyday Types (any)",
          url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#any",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-clean
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-undefined
        type: expect.preview
        at: { afterAction: expect-clean }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-1 }
        textContains: "ကော်ဖီ undefined ခွက်"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-call-query
        type: editor.type
        at: { mark: type-call-query }
        target: { file: src/main.ts, after: "const latest = lastOf(orders);\n", occurrence: 1 }
        text: "//             ^?\n"
        cadence: fast-explainer
      - id: expect-any-query
        type: expect.preview
        at: { afterAction: type-call-query }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        textContains: "lastOf(list: any[]): any"
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: type-param
    chapter: "Type parameter ထည့်ခြင်း"
    narration: >
      [[mark:open-utils-2]] ဒါကြောင့် utils ဖိုင်မှာ ဒီ function ကို type parameter နဲ့ ပြန်ရေးပါမယ်။
      [[mark:type-generic]] function အသစ်ကို အပေါ်မှာ ထည့်ပြီး၊ any နဲ့ ရေးထားတဲ့ အဟောင်းကိုတော့ comment
      အဖြစ် ချန်ထားပါမယ်။ [[mark:select-t]] function နာမည်ရဲ့ နောက်က angle bracket ထဲမှာ T ကို
      ကြေညာထားပါတယ်။ ဒါက type parameter ပါ။ ရိုးရိုး parameter တွေက တန်ဖိုးကို လက်ခံသလို၊ type parameter
      က type တစ်ခုကို လက်ခံပြီး၊ function ကို ခေါ်တိုင်း T နေရာမှာ type တစ်ခု ဝင်လာပါတယ်။
      [[mark:select-list-t]] parameter ကို T array လို့ ရေးပြီး၊ ပြန်ပေးမယ့် type ကိုလည်း T လို့
      ရေးထားပါတယ်။ ဆိုလိုတာက ဝင်လာတဲ့ array ရဲ့ item type နဲ့ ပြန်ထွက်မယ့် type က အမြဲ တူရမယ် ဆိုတာပါ။
      [[mark:read-generic]] Types ကို ကြည့်ပါ၊ T နေရာမှာ Order ဝင်သွားပြီး function က Order ကို
      ပြန်ပေးတယ်လို့ ပြောင်းသွားပါပြီ။ ဒါကြောင့် Errors မှာ error အသစ် တစ်ခု ပေါ်လာပါတယ်။ Order type မှာ
      အဲဒီ နာမည်အတိုနဲ့ property မရှိဘူးလို့ ပြောနေတာပါ။ any က ဖုံးထားခဲ့တဲ့ အမှားကို TypeScript က အခုမှ
      တွေ့သွားတာပါ။ Output မှာတော့ undefined အတိုင်း ရှိနေပါသေးတယ်။ type တွေက program run တဲ့ ပုံကို
      မပြောင်းလို့ပါ။ [[mark:type-fix-qty]] main ဖိုင်မှာ နာမည်အတိုကို အပြည့်အစုံ ဖြစ်အောင်
      ပြင်လိုက်ပါမယ်။ [[mark:read-fixed]] error ပျောက်ပြီး၊ Output မှာ ကော်ဖီ တစ်ခွက် ဆိုတာ မှန်မှန်
      ထွက်လာပါပြီ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 16: Utility Folder Development (what makes a function generic)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/utility-folder-development-in-typescript",
        }
      - {
          title: "TypeScript Handbook: Generics (working with generic type variables)",
          url: "https://www.typescriptlang.org/docs/handbook/2/generics.html#working-with-generic-type-variables",
        }
    actions:
      - id: open-utils-2
        type: workspace.openFile
        at: { mark: open-utils-2 }
        path: src/utils.ts
      - id: type-generic
        type: editor.type
        at: { mark: type-generic }
        target: { file: src/utils.ts, after: "ပြန်သုံးတဲ့ function တွေ\n", occurrence: 1 }
        text: "export function lastOf<T>(list: T[]): T {\n  return list[list.length - 1];\n}\n// "
        cadence: block
      - id: expect-qty-error
        type: expect.preview
        at: { afterAction: type-generic }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-qty-text
        type: expect.preview
        at: { afterAction: expect-qty-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Property 'qty' does not exist on type 'Order'."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-order-query
        type: expect.preview
        at: { afterAction: expect-qty-text }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-1 }
        textContains: "lastOf<Order>(list: Order[]): Order"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-still-undefined
        type: expect.preview
        at: { afterAction: expect-order-query }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-1 }
        textContains: "ကော်ဖီ undefined ခွက်"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: select-t
        type: editor.select
        at: { mark: select-t }
        target: { file: src/utils.ts, text: "<T>", occurrence: 1 }
      - id: select-list-t
        type: editor.select
        at: { mark: select-list-t }
        target: { file: src/utils.ts, text: "(list: T[]): T", occurrence: 1 }
      - id: open-main-2
        type: workspace.openFile
        at: { mark: type-fix-qty }
        path: src/main.ts
      - id: type-fix-qty
        type: editor.type
        at: { afterAction: open-main-2 }
        target: { file: src/main.ts, after: "latest.q", occurrence: 1 }
        text: "uanti"
      - id: expect-fixed
        type: expect.preview
        at: { afterAction: type-fix-qty }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-one-cup
        type: expect.preview
        at: { afterAction: expect-fixed }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-1 }
        textContains: "ကော်ဖီ 1 ခွက်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: inference
    chapter: "Type argument ကို infer လုပ်ခြင်း"
    narration: >
      [[mark:read-inferred]] ဒီမှာ စိတ်ဝင်စားစရာ တစ်ခု ရှိပါတယ်။ function ကို ခေါ်တဲ့အခါ T က Order
      ဖြစ်ရမယ်လို့ ကိုယ် ဘယ်နေရာမှာမှ မရေးခဲ့ပါဘူး။ ထည့်ပေးလိုက်တဲ့ argument က Order array ဖြစ်နေတာကို
      TypeScript က ကြည့်ပြီး၊ T ကို Order လို့ သူ့ဘာသာ infer လုပ်ပေးတာပါ။ query comment ဒါမှမဟုတ် VS
      Code မှာ mouse တင်ကြည့်တာက၊ function နာမည်ရဲ့ နောက်က angle bracket ထဲမှာ ဘယ် type ကို infer
      လုပ်ထားလဲ ဆိုတာ ပြပေးလို့ generic function တွေကို debug လုပ်တဲ့အခါ အရမ်း အသုံးဝင်ပါတယ်။
      [[mark:type-names]] customer နာမည်တွေ ပါတဲ့ string array နဲ့ ထပ်ခေါ်ကြည့်ရအောင်။
      [[mark:read-names]] ဒီတစ်ခါ T က string ဖြစ်သွားပြီး၊ function က string ကို ပြန်ပေးပါတယ်။ function
      ကို တစ်ခါပဲ ရေးထားပေမယ့်၊ ထည့်ပေးတဲ့ array အလိုက် ပြန်ထွက်တဲ့ type က လိုက်ပြောင်းနေတာပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 16: Utility Folder Development (inference, debugging the inferred type)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/utility-folder-development-in-typescript",
        }
      - {
          title: "TypeScript Handbook: More on Functions (inference)",
          url: "https://www.typescriptlang.org/docs/handbook/2/functions.html#inference",
        }
    actions:
      - id: select-call
        type: editor.select
        at: { mark: read-inferred }
        target: { file: src/main.ts, text: "lastOf(orders)", occurrence: 1 }
      - id: type-names
        type: editor.type
        at: { mark: type-names }
        target: { file: src/main.ts, after: "latest.quantity, \"ခွက်\");\n", occurrence: 1 }
        text: "\nconst lastName = lastOf([\"မြမြ\", \"အောင်အောင်\"]);\n//               ^?\n"
        cadence: line-by-line
      - id: expect-names-count
        type: expect.preview
        at: { afterAction: type-names }
        timeoutMs: 8000
        target: { by: testId, value: ts-types }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-names-query
        type: expect.preview
        at: { afterAction: expect-names-count }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-2 }
        textContains: "lastOf<string>(list: string[]): string"
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: explicit
    chapter: "Type argument ကို ကိုယ်တိုင် ပေးခြင်း"
    narration: >
      type argument ကို ကိုယ်တိုင်လည်း ပေးလို့ ရပါတယ်။ lesson ၆ မှာ Set ကို number ပေးခဲ့သလိုပဲ၊
      function နာမည်ရဲ့ နောက်မှာ angle bracket နဲ့ ရေးရပါတယ်။ [[mark:type-explicit]] ကိုယ်တိုင် ပေးတဲ့
      type နဲ့ argument မကိုက်ရင် ဘာ ဖြစ်လဲ မြင်ရအောင်၊ အော်ဒါ array ကို ထည့်ပေးပြီး T ကိုတော့ string
      လို့ ပေးကြည့်ပါမယ်။ [[mark:read-explicit]] Errors မှာ Order array ကို string array နေရာမှာ
      ထည့်လို့ မရဘူး ဆိုတဲ့ error ပေါ်လာပါပြီ။ TypeScript က argument ကို ကြည့်ပြီး infer မလုပ်တော့ဘဲ၊
      ကိုယ် ပေးလိုက်တဲ့ string ကို အမှန်လို့ ယူပြီး argument ကို အဲဒါနဲ့ စစ်လိုက်တာပါ။ ဆိုတော့
      ကိုယ်တိုင် ပေးတဲ့ type argument က infer လုပ်တာကို အမြဲ နိုင်ပါတယ်။ [[mark:type-comment-explicit]]
      စမ်းကြည့်တဲ့ ဒီ line ကို comment လုပ်လိုက်ပါမယ်။ [[mark:read-explicit-gone]] error
      ပျောက်သွားပါပြီ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 16: Utility Folder Development (specified types beat inferred types)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/utility-folder-development-in-typescript",
        }
      - {
          title: "TypeScript Handbook: More on Functions (specifying type arguments)",
          url: "https://www.typescriptlang.org/docs/handbook/2/functions.html#specifying-type-arguments",
        }
    actions:
      - id: type-explicit
        type: editor.type
        at: { mark: type-explicit }
        target:
          { file: src/main.ts, after: "\"အောင်အောင်\"]);\n//               ^?\n", occurrence: 1 }
        text: "const check = lastOf<string>(orders);\n"
        cadence: fast-explainer
      - id: expect-explicit-error
        type: expect.preview
        at: { afterAction: type-explicit }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-explicit-text
        type: expect.preview
        at: { afterAction: expect-explicit-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Argument of type 'Order[]' is not assignable to parameter of type 'string[]'."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-comment-explicit
        type: editor.type
        at: { mark: type-comment-explicit }
        target:
          { file: src/main.ts, after: "\"အောင်အောင်\"]);\n//               ^?\n", occurrence: 1 }
        text: "// "
        cadence: fast-explainer
      - id: expect-explicit-gone
        type: expect.preview
        at: { afterAction: type-comment-explicit }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: words
    chapter: "Type parameter နဲ့ type argument"
    narration: >
      [[mark:board-words]] ဒီ lesson ထဲက စကားလုံးတွေကို ပုံနဲ့ ပြန်စီကြည့်ရအောင်။ [[mark:draw-param]]
      function ကို ကြေညာတဲ့ နေရာမှာ angle bracket ထဲ ရေးထားတဲ့ T က type parameter ပါ။ ရိုးရိုး parameter
      လိုပဲ နာမည် တစ်ခု ဖြစ်လို့၊ T အစား lesson ၂၇ မှာလို ပိုရှည်တဲ့ နာမည်လည်း ပေးလို့ ရပါတယ်။
      [[mark:draw-args]] function ကို ခေါ်တဲ့အခါ T နေရာမှာ တကယ် ဝင်သွားတဲ့ type ကတော့ type argument ပါ။
      ကိုယ်တိုင် ရေးပေးရင်လည်း type argument ဖြစ်ပြီး၊ TypeScript က infer လုပ်ပေးရင်လည်း type argument
      ပါပဲ။ [[mark:draw-generic-word]] type parameter ရှိတဲ့ function ကိုတော့ generic function လို့
      ခေါ်ပါတယ်။ lesson ၂၇ က generic type ဆိုတာလည်း type parameter ရှိတဲ့ type ကို ပြောတာပါ။
      [[mark:draw-no-word]] လူတွေက generic တစ်ခု လို့ အတိုချုံ့ ပြောလေ့ ရှိပေမယ့်၊ အဲဒါက type parameter
      ကို ပြောတာလား၊ type argument ကို ပြောတာလား၊ function ကို ပြောတာလား မရှင်းပါဘူး။ ဒါကြောင့် ဒီ
      course မှာ type parameter ရယ်၊ type argument ရယ်၊ generic function ရယ် လို့ ခွဲပြီး ပြောပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 16: Utility Folder Development (there is no such thing as 'a generic')",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/utility-folder-development-in-typescript",
        }
      - {
          title: "TypeScript Handbook: Generics",
          url: "https://www.typescriptlang.org/docs/handbook/2/generics.html",
        }
    actions:
      - id: open-board-b
        type: whiteboard.apply
        at: { mark: board-words }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-param
        type: whiteboard.apply
        at: { mark: draw-param }
        upsertIds: [b-param-code, b-param-desc]
        drawMs: 2000
      - id: draw-args
        type: whiteboard.apply
        at: { mark: draw-args }
        upsertIds: [b-arg-code, b-arg-desc]
        drawMs: 2200
      - id: draw-generic-word
        type: whiteboard.apply
        at: { mark: draw-generic-word }
        upsertIds: [b-fn-desc]
        drawMs: 1400
      - id: draw-no-word
        type: whiteboard.apply
        at: { mark: draw-no-word }
        upsertIds: [b-no-word, b-words]
        drawMs: 2000

  - id: default-type
    chapter: "Default type"
    narration: >
      [[mark:close-board-b]] utils ဖိုင်ကို ပြန်သွားရအောင်။ [[mark:type-queue]] အော်ဒါတွေကို
      တန်းစီထားဖို့ queue ဆောက်ပေးတဲ့ function တစ်ခု ထပ်ရေးပါမယ်။ ထည့်ပေးတဲ့ item တွေကို array အနေနဲ့
      ပြန်ပေးတဲ့ generic function ပါ။ [[mark:open-main-3]] main ဖိုင်မှာ ဒီ function ကို import
      လုပ်ပါမယ်။ ပြီးတော့ မီးဖိုချောင် queue ကို ဗလာနဲ့ စချင်လို့ item တစ်ခုမှ မထည့်ဘဲ ခေါ်ကြည့်ပြီး၊
      query comment နဲ့ type ကို ကြည့်ပါမယ်။ [[mark:read-unknown]] Types မှာ unknown array လို့
      ပြနေပါတယ်။ argument မရှိတဲ့အတွက် TypeScript က ဘာကနေမှ infer လုပ်လို့ မရဘဲ၊ T ကို unknown လို့
      ယူလိုက်တာပါ။ ဒီ queue ထဲက item ကို သုံးမယ်ဆိုရင် အရင် narrow လုပ်ရမှာ ဖြစ်လို့ အဆင်မပြေပါဘူး။
      [[mark:type-default]] ဒါကြောင့် type parameter မှာ default type ပေးပါမယ်။ T ရဲ့ နောက်မှာ Order ကို
      ပေးလိုက်ရင်၊ T ကို ဘာ type လို့ မသိရတဲ့ အခါ Order ကို သုံးမယ် ဆိုတဲ့ အဓိပ္ပာယ်ပါ။
      [[mark:read-default]] Types မှာ Order array ဖြစ်သွားပါပြီ။ [[mark:type-drinks]] default က T ကို
      ကန့်သတ်တာ မဟုတ်ပါဘူး။ ဒါကို မြင်ရအောင် သောက်စရာ နာမည် နှစ်ခုနဲ့ ထပ်ခေါ်ကြည့်ပါမယ်။
      [[mark:read-drinks]] ဒီတစ်ခါ string array ဖြစ်ပါတယ်။ argument ရှိရင် TypeScript က infer လုပ်တာကို
      ဦးစားပေးပြီး၊ default ကိုတော့ infer လုပ်စရာ မရှိမှပဲ သုံးတာပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 16: Utility Folder Development (type parameter defaults)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/utility-folder-development-in-typescript",
        }
      - {
          title: "TypeScript Handbook: Generics (generic parameter defaults)",
          url: "https://www.typescriptlang.org/docs/handbook/2/generics.html#generic-parameter-defaults",
        }
    actions:
      - id: close-board-b
        type: whiteboard.apply
        at: { mark: close-board-b }
        open: false
      - id: open-utils-3
        type: workspace.openFile
        at: { mark: type-queue }
        path: src/utils.ts
      - id: type-queue
        type: editor.type
        at: { afterAction: open-utils-3 }
        target: { file: src/utils.ts, after: "list[list.length - 1]; }\n", occurrence: 1 }
        text: "\nexport function queueOf<T>(...items: T[]): T[] {\n  return items;\n}\n"
        cadence: line-by-line
      - id: open-main-3
        type: workspace.openFile
        at: { mark: open-main-3 }
        path: src/main.ts
      - id: type-import-queue
        type: editor.type
        at: { afterAction: open-main-3 }
        target: { file: src/main.ts, after: "import { lastOf", occurrence: 1 }
        text: ", queueOf"
        cadence: fast-explainer
      - id: type-kitchen
        type: editor.type
        at: { afterAction: type-import-queue }
        target:
          { file: src/main.ts, after: "// const check = lastOf<string>(orders);\n", occurrence: 1 }
        text: "\nconst kitchen = queueOf();\n//    ^?\n"
        cadence: fast-explainer
      - id: expect-unknown
        type: expect.preview
        at: { afterAction: type-kitchen }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-3 }
        attribute: { name: data-type, value: "const kitchen: unknown[]" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: open-utils-4
        type: workspace.openFile
        at: { mark: type-default }
        path: src/utils.ts
      - id: type-default
        type: editor.type
        at: { afterAction: open-utils-4 }
        target: { file: src/utils.ts, after: "queueOf<T", occurrence: 1 }
        text: " = Order"
      - id: expect-default
        type: expect.preview
        at: { afterAction: type-default }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-3 }
        attribute: { name: data-type, value: "const kitchen: Order[]" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: open-main-4
        type: workspace.openFile
        at: { mark: type-drinks }
        path: src/main.ts
      - id: type-drinks
        type: editor.type
        at: { afterAction: open-main-4 }
        target:
          { file: src/main.ts, after: "const kitchen = queueOf();\n//    ^?\n", occurrence: 1 }
        text: "const drinks = queueOf(\"လက်ဖက်ရည်\", \"ကော်ဖီ\");\n//    ^?\n"
        cadence: fast-explainer
      - id: expect-drinks
        type: expect.preview
        at: { afterAction: type-drinks }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-4 }
        attribute: { name: data-type, value: "const drinks: string[]" }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: constraint
    chapter: "Constraint"
    narration: >
      [[mark:open-utils-5]] နောက်ဆုံး အနေနဲ့ utils ဖိုင်မှာ id နဲ့ ရှာပေးတဲ့ function ကို generic
      function အဖြစ် ရေးကြည့်ပါမယ်။ [[mark:type-find]] list ထဲက item တစ်ခုချင်းရဲ့ id ကို ယှဉ်ပြီး
      ရှာတာပါ။ [[mark:read-find-error]] Errors မှာ T ပေါ်မှာ id ဆိုတဲ့ property မရှိဘူးလို့ error
      ပေါ်လာပါတယ်။ T က ဘယ် type မဆို ဖြစ်နိုင်လို့၊ string လို id မရှိတဲ့ type ဝင်လာရင် မှားမှာ
      ဖြစ်တဲ့အတွက် TypeScript က ခွင့်မပြုတာပါ။ [[mark:type-constraint]] ဒါကြောင့် T ရဲ့ နောက်မှာ extends
      နဲ့ constraint ထည့်ပါမယ်။ lesson ၂၇ မှာလိုပဲ T ဟာ number ဖြစ်တဲ့ id property ပါတဲ့ object ပဲ
      ဖြစ်ရမယ်လို့ ကန့်သတ်လိုက်တာပါ။ [[mark:read-constraint]] error ပျောက်သွားပါပြီ။ T မှာ id အမြဲ
      ရှိမယ် ဆိုတာ TypeScript သိသွားလို့ပါ။ [[mark:open-main-5]] main ဖိုင်မှာ import လုပ်ပြီး၊ id
      နံပါတ် ၂ ဖြစ်တဲ့ အော်ဒါကို ရှာကြည့်ရအောင်။ [[mark:read-found]] Types မှာ Order ဒါမှမဟုတ် undefined
      လို့ ပြနေပြီး၊ Output မှာလည်း ကော်ဖီ အော်ဒါ ထွက်လာပါပြီ။ array ရဲ့ find က မတွေ့ရင် undefined
      ပြန်ပေးလို့ undefined ပါနေတာပါ။ [[mark:read-extra]] constraint က id ကိုပဲ တောင်းတာ ဖြစ်လို့၊
      ပစ္စည်း နာမည်နဲ့ အရေအတွက်လို property အပိုတွေ ပါလည်း ရပါတယ်။ ပြန်ထွက်တဲ့ type ကလည်း id ပါတဲ့
      object သက်သက် မဟုတ်ဘဲ Order အပြည့်အစုံ ဖြစ်နေတာကို သတိထား ကြည့်ပါ။ id မပါတဲ့ array ကို ထည့်ရင်တော့
      ခေါ်တဲ့ နေရာမှာ error ပြပါလိမ့်မယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 16: Utility Folder Development (constraining type parameters)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/utility-folder-development-in-typescript",
        }
      - {
          title: "TypeScript Handbook: More on Functions (constraints)",
          url: "https://www.typescriptlang.org/docs/handbook/2/functions.html#constraints",
        }
      - {
          title: "MDN: Array.prototype.find() (returns undefined when nothing matches)",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/find",
        }
    actions:
      - id: open-utils-5
        type: workspace.openFile
        at: { mark: open-utils-5 }
        path: src/utils.ts
      - id: type-find
        type: editor.type
        at: { mark: type-find }
        target: { file: src/utils.ts, after: "  return items;\n}\n", occurrence: 1 }
        text: "\nexport function findById<T>(list: T[], id: number) {\n  return list.find((entry) => entry.id === id);\n}\n"
        cadence: line-by-line
      - id: expect-find-error
        type: expect.preview
        at: { afterAction: type-find }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-find-text
        type: expect.preview
        at: { afterAction: expect-find-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Property 'id' does not exist on type 'T'."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-constraint
        type: editor.type
        at: { mark: type-constraint }
        target: { file: src/utils.ts, after: "findById<T", occurrence: 1 }
        text: " extends { id: number }"
        cadence: fast-explainer
      - id: expect-constraint-clean
        type: expect.preview
        at: { afterAction: type-constraint }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: open-main-5
        type: workspace.openFile
        at: { mark: open-main-5 }
        path: src/main.ts
      - id: type-import-find
        type: editor.type
        at: { afterAction: open-main-5 }
        target: { file: src/main.ts, after: "import { lastOf, queueOf", occurrence: 1 }
        text: ", findById"
        cadence: fast-explainer
      - id: type-found
        type: editor.type
        at: { afterAction: type-import-find }
        target: { file: src/main.ts, after: "\"ကော်ဖီ\");\n//    ^?\n", occurrence: 1 }
        text: "\nconst found = findById(orders, 2);\n//    ^?\nconsole.log(found);\n"
        cadence: line-by-line
      - id: expect-found-type
        type: expect.preview
        at: { afterAction: type-found }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-5 }
        attribute: { name: data-type, value: "const found: Order | undefined" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-found-output
        type: expect.preview
        at: { afterAction: expect-found-type }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-2 }
        textContains: "{ id: 2, item: 'ကော်ဖီ', quantity: 1 }"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-found-clean
        type: expect.preview
        at: { afterAction: expect-found-output }
        timeoutMs: 5000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: recap
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ generic function က type parameter ကို ကြေညာထားပြီး၊ ဝင်လာတဲ့ type
      အလိုက် ပြန်ထွက်တဲ့ type ကို လိုက်ပြောင်းပေးပါတယ်။ any အစား type parameter ကို သုံးရင် TypeScript က
      ဘာ ဝင်လာလဲ ဆိုတာ မမေ့တော့ပါဘူး။ type argument ကို များသောအားဖြင့် TypeScript က infer လုပ်ပေးပြီး၊
      ကိုယ်တိုင် ပေးရင်တော့ ကိုယ် ပေးတာက နိုင်ပါတယ်။ [[mark:recap-default]] default type က infer
      လုပ်စရာ မရှိတဲ့ အခါ သုံးဖို့ ဖြစ်ပြီး၊ constraint ကတော့ T မှာ ဘာ ရှိရမလဲ ဆိုတာကို သတ်မှတ်ပေးပါတယ်။
      နောက် lesson မှာတော့ type predicate ရယ်၊ assertion function ရယ်၊ overload ရယ် ဆိုတဲ့ function တွေကို
      type ပေးတဲ့ နောက်ထပ် နည်းတွေကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 16: Utility Folder Development",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/utility-folder-development-in-typescript",
        }
      - {
          title: "TypeScript Handbook: More on Functions (guidelines for writing good generic functions)",
          url: "https://www.typescriptlang.org/docs/handbook/2/functions.html#guidelines-for-writing-good-generic-functions",
        }
    actions:
      - id: select-generic-final
        type: editor.select
        at: { mark: recap }
        target: { file: src/main.ts, text: "const latest = lastOf(orders);", occurrence: 1 }
      - id: open-utils-6
        type: workspace.openFile
        at: { mark: recap-default }
        path: src/utils.ts
      - id: select-utils-final
        type: editor.select
        at: { afterAction: open-utils-6 }
        target: { file: src/utils.ts, text: "<T extends { id: number }>", occurrence: 1 }
      - id: expect-file-lastof
        type: expect.file
        at: { afterAction: select-generic-final }
        path: src/utils.ts
        contains: "export function lastOf<T>(list: T[]): T {\n  return list[list.length - 1];\n}\n// export function lastOf(list: any[])"
      - id: expect-file-queue
        type: expect.file
        at: { afterAction: expect-file-lastof }
        path: src/utils.ts
        contains: "export function queueOf<T = Order>(...items: T[]): T[] {"
      - id: expect-file-find
        type: expect.file
        at: { afterAction: expect-file-queue }
        path: src/utils.ts
        contains: "export function findById<T extends { id: number }>(list: T[], id: number) {"
      - id: expect-file-main
        type: expect.file
        at: { afterAction: expect-file-find }
        path: src/main.ts
        contains: 'console.log(latest.item, latest.quantity, "ခွက်");'
checks:
  - { type: timing.p95Ms, max: 300 }
