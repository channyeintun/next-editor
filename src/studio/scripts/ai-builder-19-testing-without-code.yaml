        type: editor.type
        at: { mark: type-explore }
        target: { file: docs/test-plan.md, after: "နှိပ်ရင် ဘာဖြစ်လဲ\n", occurrence: 1 }
        text: "- တွေ့တာ — #105၊ #106၊ အော်ဒါ 2 ခု ဖြစ်တယ်။ requirements မှာ တစ်ခုပဲ လို့ ရေးထားပေမဲ့ AC မရှိသေးဘူး။\n"
        cadence: line-by-line
      - {
          id: expect-explore,
          type: expect.file,
          at: { afterAction: type-explore },
          path: docs/test-plan.md,
          contains: "- တွေ့တာ — #105၊ #106၊ အော်ဒါ 2 ခု ဖြစ်တယ်။",
        }

  - id: regression
    chapter: ပြင်တိုင်း ပြန်စစ်ရအောင်
    narration: >
      [[mark:r-title]] ဒီ test plan ရဲ့ တန်ဖိုးက ဒီနေ့ တစ်ခါ သုံးပြီး ပြီးသွားတာ မဟုတ်ပါဘူး။ [[mark:r-plan]]
      အကောင်းဆုံးကတော့ agent ကို မဆောက်ခိုင်းခင်ကတည်းက ဒီလို plan ရေးထားတာပါ။ မျှော်လင့်ချက် ပါတဲ့
      test case တွေက ဘာက မှန်တာလဲ ဆိုတာကို agent ကို ပြောပြတဲ့ အတိကျဆုံး နည်း ဖြစ်ပါတယ်။ [[mark:r-auto]]
      ပြီးတော့ ဒီ plan ကို automated test တွေ အဖြစ် ပြောင်းပေးဖို့ agent ကို ခိုင်းလို့ ရပါတယ်။ automated test
      ဆိုတာ လူက form ဖြည့်မယ့်အစား၊ ဒီ အဆင့်တွေကို စက်က အလိုလို လုပ်ပြီး စစ်ပေးတဲ့ code ပါ။ [[mark:r-fail]]
      app ကို မပြင်ခင် ငြင်းရမယ့် case တွေရဲ့ test တွေ fail ဖြစ်တာကို အရင် ပြခိုင်းပါ။ fail ဖြစ်တာ အရင် မြင်ထားမှ၊ နောက်မှ pass
      ဖြစ်လာတာက app ကို ပြင်လိုက်လို့ ဆိုတာ သေချာပါတယ်။ test တွေကို ဘယ်လို ရေးလဲ ဆိုတာကိုတော့ Testing course
      မှာ အသေးစိတ် လေ့လာနိုင်ပါတယ်။ [[mark:r-fix]] ပြီးမှ app ကို ပြင်ခိုင်းပါ။ [[mark:r-rerun]] ပြင်ပြီးတိုင်း
      test အားလုံးကို ပြန် run ပါ၊ ဆိုလိုတာက တစ်ခုမကျန် ပြန်စစ်ခိုင်းပါ။ ပြင်လိုက်တဲ့ ကိစ္စ မှန်သွားပေမယ့်၊ အရင်
      မှန်နေတဲ့ TC တစ် ပြန်ပျက်သွားတာမျိုး ဖြစ်တတ်လို့ပါ။ ဒီလို အရင် မှန်နေတာ ပြင်ပြီးမှ ပြန်ပျက်သွားတာကို
      regression လို့ ခေါ်ပါတယ်။ [[mark:r-loop]] ဒါကြောင့် app ကို ပြောင်းတိုင်း ဒီ စက်ဝိုင်းကို ပြန်ပတ်ရပြီး၊
      test plan ကလည်း bug တစ်ခု တွေ့တိုင်း test case တစ်ခု တိုးလာပါမယ်။
    sources:
      - {
          title: "Martin Fowler: Test Driven Development",
          url: "https://martinfowler.com/bliki/TestDrivenDevelopment.html",
        }
      - {
          title: "Martin Fowler: Self Testing Code",
          url: "https://martinfowler.com/bliki/SelfTestingCode.html",
        }
      - {
          title: "The New SDLC (Burmese edition): Where to start (tests and evals before generating)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "The New SDLC (Burmese edition): The new SDLC (testing and quality assurance)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: open-board-r,
          type: whiteboard.apply,
          at: { mark: r-title },
          open: true,
          clear: true,
          upsertIds: [r-title],
        }
      - {
          id: draw-r-plan,
          type: whiteboard.apply,
          at: { mark: r-plan },
          upsertIds: [r-b1, r-1],
          drawMs: 1000,
        }
      - {
          id: draw-r-auto,
          type: whiteboard.apply,
          at: { mark: r-auto },
          upsertIds: [r-a1, r-b2, r-2],
          drawMs: 1300,
        }
      - {
          id: draw-r-fail,
          type: whiteboard.apply,
          at: { mark: r-fail },
          upsertIds: [r-2n],
          drawMs: 800,
        }
      - {
          id: draw-r-fix,
          type: whiteboard.apply,
          at: { mark: r-fix },
          upsertIds: [r-a2, r-b3, r-3],
          drawMs: 1300,
        }
      - {
          id: draw-r-rerun,
          type: whiteboard.apply,
          at: { mark: r-rerun },
          upsertIds: [r-a3, r-b4, r-4],
          drawMs: 1300,
        }
      - {
          id: draw-r-loop,
          type: whiteboard.apply,
          at: { mark: r-loop },
          upsertIds: [r-loop, r-reg],
          drawMs: 1200,
        }

  - id: quiz
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ agent က app ကို ပြင်ပြီး၊ test အားလုံး pass ပါပြီလို့ ပြန်ပြောတယ်
      ဆိုပါစို့။ ပုံမှန် အော်ဒါ တစ်ခုနဲ့ ကိုယ်တိုင် ထပ်စမ်းကြည့်မလား၊ test တွေက ဘာတွေကို စစ်ထားလဲ အရင်
      ကြည့်မလား။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] အဖြေကတော့ test တွေက ဘာကို
      စစ်ထားလဲ အရင် ကြည့်တာပါ။ ဘာကြောင့်လဲဆိုတော့ happy path တစ်ခုတည်းကို စစ်တဲ့ test တွေဆိုရင် အလွယ်တကူ pass
      ဖြစ်နေမှာမို့ပါ။ AC တိုင်းကို၊ အထူးသဖြင့် ငြင်းရမယ့် ကိစ္စတွေကို စစ်ထားမှ၊ test အားလုံး pass ဆိုတဲ့ စကားက
      အဓိပ္ပာယ် ရှိပါတယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The new SDLC (testing and quality assurance)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          clear: true,
          upsertIds: [z-title, z-q1, z-q2, z-o1, z-o2],
          drawMs: 2400,
        }
      - {
          id: draw-quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [z-a, z-r1, z-r2],
          drawMs: 1800,
        }

  - id: recap
    chapter: ပြန်ချုပ်ရရင်
    narration: >
      [[mark:close-quiz]] ဒါဆို ပြန်ချုပ်ရရင်၊ test case တစ်ခုမှာ အဆင့်၊ data နဲ့ AC ကနေ ယူတဲ့ မျှော်လင့်ချက်
      ပါပါတယ်။ [[mark:sel-exp]] pass လား fail လား ဆိုတာကို မစမ်းခင်ကတည်းက ဒီလို ဆုံးဖြတ်ထားရပါတယ်။
      [[mark:sel-fail]] fail ဖြစ်တဲ့ case တွေမှာ တကယ် မြင်ခဲ့ရတာကို ရေးထားတော့၊ bug report ရေးဖို့နဲ့ agent ကို
      ပြင်ခိုင်းဖို့ အသင့် ဖြစ်နေပါပြီ။ [[mark:sel-explore]] AC မရှိတဲ့ ကိစ္စတွေကိုတော့ exploratory testing နဲ့ ရှာပြီး
      တွေ့တာကို မှတ်ထားပါ။ app ပြောင်းတိုင်း plan တစ်ခုလုံးကို ပြန်စစ်ပါ။ ဒါပေမဲ့ ရလဒ် မှန်တာ တစ်ခုတည်းနဲ့
      မလုံလောက်သေးပါဘူး။ နောက် lesson မှာတော့ agent က app ကို ဘယ်လို ပြောင်းခဲ့လဲ ဆိုတာကို၊ code
      တစ်ကြောင်းချင်း မဖတ်ဘဲ review လုပ်နည်းကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The new SDLC (testing and quality assurance)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "The New SDLC (Burmese edition): Where to start",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: close-quiz }, open: false }
      - {
          id: sel-exp,
          type: editor.select,
          at: { mark: sel-exp },
          target:
            {
              file: docs/test-plan.md,
              text: '- မျှော်လင့်ချက် — အော်ဒါ မဖြစ်ဘဲ "1 ကနေ 20 အထိ ရွေးပါ" လို့ ပြ',
              occurrence: 1,
            },
        }
      - {
          id: sel-fail,
          type: editor.select,
          at: { mark: sel-fail },
          target:
            { file: docs/test-plan.md, text: "- ရလဒ် — ❌ 0 ကျပ်နဲ့ လက်ခံသွားတယ် (#102)", occurrence: 1 },
        }
      - {
          id: sel-explore,
          type: editor.select,
          at: { mark: sel-explore },
          target:
            {
              file: docs/test-plan.md,
              text: "- တွေ့တာ — #105၊ #106၊ အော်ဒါ 2 ခု ဖြစ်တယ်။",
              occurrence: 1,
            },
        }
checks:
  - { type: timing.p95Ms, max: 300 }
