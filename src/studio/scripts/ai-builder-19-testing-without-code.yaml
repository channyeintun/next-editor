    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ requirement ဖိုင်ထဲက edge case တွေကို app မှာ လိုက်စမ်းပြီး၊ ငြင်းရမယ့်
      အော်ဒါ သုံးခုလုံး လက်ခံသွားတာကို တွေ့ခဲ့ပါတယ်။ ဒါပေမဲ့ notes မှာ တိုတိုပဲ မှတ်ခဲ့လို့၊ နောက်အပတ် agent က
      app ကို ပြင်ပြီးရင်၊ ဘာတွေ စမ်းခဲ့လဲ၊ ဘာ data ထည့်ခဲ့လဲ၊ ဘာမြင်ရမယ်လို့ မျှော်လင့်ခဲ့လဲ ဆိုတာ
      မှတ်မိနိုင်ပါ့မလား။ မှတ်မိသလောက်နဲ့ စစ်ရင် တွေ့တာ မတွေ့တာက ကံပေါ်
      မူတည်သွားပါတယ်။ [[mark:sel-title]] ဒါကြောင့် ဒီနေ့ ဒီ ဖိုင်ထဲမှာ test plan တစ်ခု ရေးပြီး၊ app ကို code
      မရေးဘဲ စနစ်တကျ test လုပ်ကြည့်ပါမယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The new SDLC (testing and quality assurance)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: start-runtime,
          type: runtime.start,
          at: { mark: start },
          timeoutMs: 60000,
          retry: { maxAttempts: 2, delayMs: 500 },
        }
      - {
          id: open-plan-start,
          type: workspace.openFile,
          at: { mark: sel-title, offsetMs: -700 },
          path: docs/test-plan.md,
        }
      - {
          id: sel-title,
          type: editor.select,
          at: { mark: sel-title },
          target: { file: docs/test-plan.md, text: "# Test plan · v1", occurrence: 1 },
        }

  - id: anatomy
    narration: >
      [[mark:t-title]] test လုပ်တယ် ဆိုတာ app က လုပ်သင့်တာကို တကယ် လုပ်လား စမ်းစစ်တာပါ။ စမ်းမယ့် ကိစ္စ
      တစ်ခုချင်းကို test case လို့ ခေါ်ပြီး၊ test case တစ်ခုမှာ အပိုင်း လေးပိုင်း ပါပါတယ်။ [[mark:t-steps]] ပထမက
      ဘာလုပ်ရမလဲ ဆိုတဲ့ အဆင့်တွေပါ။ [[mark:t-data]] ဒုတိယက ဘာထည့်မလဲ ဆိုတဲ့ data ပါ။ လက်ဖက်ရည် နှစ်ခွက်၊
      မနက် ရှစ်နာရီခွဲ လို တိတိကျကျ ရေးထားမှ၊ ဘယ်သူ စမ်းစမ်း အတူတူ ဖြစ်မှာပါ။ [[mark:t-expect]] တတိယက
      ဘာမြင်ရမလဲ ဆိုတဲ့ မျှော်လင့်ချက်ပါ။ ဒါကို ကိုယ့်စိတ်ထဲက မယူဘဲ spec ထဲက acceptance criteria ကနေ
      ယူရပါမယ်။ [[mark:t-before]] အရေးအကြီးဆုံးက မျှော်လင့်ချက်ကို မစမ်းခင် ရေးထားရတာပါ။ စမ်းပြီးမှ ရေးရင်၊
      app ပြတာကို မြင်ပြီး ဒါလည်း ဖြစ်နိုင်တာပဲလို့ လက်ခံမိသွားတတ်ပါတယ်။ ပြီးခဲ့တဲ့ lesson က သုည ကျပ်
      အော်ဒါကို app က တည်တည်ငြိမ်ငြိမ် ပြခဲ့တာ သတိရပါ။ [[mark:t-result]] နောက်ဆုံးက စမ်းပြီးမှ ရေးတဲ့
      ရလဒ်ပါ။ မျှော်လင့်ချက်နဲ့ ကိုက်ရင် pass၊ မကိုက်ရင် fail ပါ။ [[mark:t-plan]] ဒီလို test case တွေကို
      စုထားတဲ့ စာရင်းကို test plan လို့ ခေါ်ပါတယ်။
    sources:
      - {
          title: "Wikipedia: Test case (software) — inputs, execution conditions, procedure and expected results (ISO/IEC/IEEE 24765)",
          url: "https://en.wikipedia.org/wiki/Test_case_(software)",
        }
      - {
          title: "The New SDLC (Burmese edition): The new SDLC (testing and quality assurance)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: open-board-t,
          type: whiteboard.apply,
          at: { mark: t-title },
          open: true,
          clear: true,
          upsertIds: [t-title],
        }
      - {
          id: draw-t-steps,
          type: whiteboard.apply,
          at: { mark: t-steps },
          upsertIds: [t-1],
          drawMs: 800,
        }
      - {
          id: draw-t-data,
          type: whiteboard.apply,
          at: { mark: t-data },
          upsertIds: [t-2],
          drawMs: 800,
        }
      - {
          id: draw-t-expect,
          type: whiteboard.apply,
          at: { mark: t-expect },
          upsertIds: [t-3],
          drawMs: 900,
        }
      - {
          id: draw-t-before,
          type: whiteboard.apply,
          at: { mark: t-before },
          upsertIds: [t-3n],
          drawMs: 800,
        }
      - {
          id: draw-t-result,
          type: whiteboard.apply,
          at: { mark: t-result },
          upsertIds: [t-4, t-4n],
          drawMs: 1200,
        }
      - {
          id: draw-t-plan,
          type: whiteboard.apply,
          at: { mark: t-plan },
          upsertIds: [t-plan-box, t-plan],
          drawMs: 1200,
        }

  - id: write-plan
    chapter: Test plan ရေးရအောင်
    narration: >
      [[mark:close-t]] spec ကို ဖွင့်ကြည့်ရအောင်။ [[mark:sel-ac1]] ဒီနေ့ AC တစ်ခုစီကနေ test case
      တစ်ခုစီ ရေးပါမယ်။ AC တစ်ရဲ့ ဒီ Then စာကြောင်းက ဘာမြင်ရမလဲ ဆိုတာ ပြောထားလို့၊ ပထမ test case ရဲ့
      မျှော်လင့်ချက် ဖြစ်လာပါမယ်။ [[mark:open-plan]] ဒီ Then ကို ယူပြီး test plan မှာ ရေးရအောင်။ [[mark:type-tc1]] ပထမ
      test case ကို TC တစ် လို့ နံပါတ်တပ်ပါမယ်။ member အောင်အောင် မနက်တိုင်း မှာနေကျ အော်ဒါ၊ အားလုံး ပုံမှန်အတိုင်း သွားတဲ့ happy path ပါ။ ခေါင်းစဉ်ထဲမှာ ဘယ် AC ကို
      စစ်တာလဲ ထည့်ရေးထားလို့၊ နောက်ပိုင်း AC တစ်ခု ပြောင်းရင် ဘယ် test case ကို ပြင်ရမလဲ ချက်ချင်း သိရပါတယ်။
      [[mark:sel-tc1-exp]] မျှော်လင့်ချက်မှာ အော်ဒါနံပါတ် အတိအကျကို မရေးထားတာ သတိထား ကြည့်ပါ။ နံပါတ်က
      တစ်နေ့ မှာတဲ့ အော်ဒါ အရေအတွက်ပေါ် မူတည်လို့၊ နံပါတ် တစ်ခု ရဖို့ပဲ စစ်တာပါ။
    sources:
      - {
          title: "The New SDLC (Burmese edition): Where to start (tests and evals before generating)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "Wikipedia: Test case (software) — inputs, execution conditions, procedure and expected results (ISO/IEC/IEEE 24765)",
          url: "https://en.wikipedia.org/wiki/Test_case_(software)",
        }
    actions:
      - { id: close-t, type: whiteboard.apply, at: { mark: close-t }, open: false }
      - {
          id: open-spec,
          type: workspace.openFile,
          at: { afterAction: close-t },
          path: docs/spec.md,
        }
      - {
          id: sel-ac1,
          type: editor.select,
          at: { mark: sel-ac1 },
          target:
            {
              file: docs/spec.md,
              text: "Then အော်ဒါနံပါတ်၊ စုစုပေါင်း 3,000 ကျပ်နဲ့ 8:30 ကို မြင်ရမယ်",
              occurrence: 1,
            },
        }
      - {
          id: open-plan,
          type: workspace.openFile,
          at: { mark: open-plan },
          path: docs/test-plan.md,
        }
      - id: type-tc1
        type: editor.type
        at: { mark: type-tc1 }
        target: { file: docs/test-plan.md, after: "# Test plan · v1\n\n", occurrence: 1 }
        text: "## TC-1 · ပုံမှန် အော်ဒါ (AC-1)\n- လုပ်ရမှာ — လက်ဖက်ရည် 2၊ 08:30၊ အောင်အောင်၊ 09 000 111 222 ထည့်ပြီး မှာမယ် ကို နှိပ်\n- မျှော်လင့်ချက် — အော်ဒါနံပါတ်၊ 3,000 ကျပ်၊ 08:30\n\n"
        cadence: line-by-line
      - {
          id: sel-tc1-exp,
          type: editor.select,
          at: { mark: sel-tc1-exp },
          target:
            {
              file: docs/test-plan.md,
              text: "- မျှော်လင့်ချက် — အော်ဒါနံပါတ်၊ 3,000 ကျပ်၊ 08:30",
              occurrence: 1,
            },
        }

  - id: write-edges
    narration: >
      [[mark:type-tc2]] TC တစ်က ပုံမှန် လမ်းကို စစ်ပြီး၊ နောက် သုံးခုက အနားသတ်တွေကို စစ်ပါတယ်။
      ဒုတိယ test case က AC နှစ်အတွက်ပါ။ ကျန်တာ အားလုံးကို TC တစ်အတိုင်း ထားပြီး အရေအတွက် တစ်ခုတည်းကိုပဲ
      ပြောင်းပါတယ်။ [[mark:sel-tc2-msg]] မျှော်လင့်ချက်ထဲမှာ customer မြင်ရမယ့် စာကို
      spec ထဲကအတိုင်း ထည့်ထားပါတယ်။ ငြင်းရုံနဲ့ မလုံလောက်ဘဲ၊ customer က ဘာဆက်လုပ်ရမလဲ သိရမှာမို့ပါ။
      [[mark:type-tc3]] TC သုံးက ဆိုင်ပိတ်ချိန်အတွက်ပါ။ data ကို မနက် နှစ်နာရီလို့ ရွေးထားတာ အကြောင်း ရှိပါတယ်။
      ည ရှစ်နာရီခွဲ ဆိုရင် ကြားရက်မှာ ဆိုင်ပိတ်ပေမယ့် စနေ တနင်္ဂနွေမှာ ဖွင့်နေလို့၊ စမ်းတဲ့ နေ့ပေါ် မူတည်ပြီး ရလဒ်
      ပြောင်းသွားမှာပါ။ မနက် နှစ်နာရီကတော့ ဘယ်နေ့ ဖြစ်ဖြစ် ပိတ်ချိန်ပါ။ [[mark:type-tc4]] TC လေးက ဖုန်း
      အကွက်ကို အလွတ် ထားခဲ့တဲ့ အော်ဒါပါ။ ကောင်တာက လှလှ က customer ကို ဆက်သွယ်နိုင်ဖို့ ဖုန်းနံပါတ်
      မဖြစ်မနေ လိုလို့ AC လေး ရှိတာပါ။ [[mark:type-tc5]] TC ငါးက လှလှ ကြည့်ရမယ့် ကောင်တာစာရင်းအတွက်ပါ။
      လာယူချိန် မတူတဲ့ အော်ဒါ နှစ်ခု သုံးထားတာက၊ အော်ဒါ တစ်ခုတည်းနဲ့ဆို စီထားလား မစီထားလား ခွဲပြောလို့
      မရလို့ပါ။ ဒီ test case ငါးခုလုံးကို app မှာ ဘာမှ မစမ်းရသေးခင် ရေးပြီးပါပြီ။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The new SDLC (testing and quality assurance)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - id: type-tc2
        type: editor.type
        at: { mark: type-tc2 }
        target: { file: docs/test-plan.md, after: "3,000 ကျပ်၊ 08:30\n\n", occurrence: 1 }
        text: "## TC-2 · အရေအတွက် 0 (AC-2)\n- လုပ်ရမှာ — TC-1 အတိုင်း၊ အရေအတွက်ကိုပဲ 0\n- မျှော်လင့်ချက် — အော်ဒါ မဖြစ်ဘဲ \"1 ကနေ 20 အထိ ရွေးပါ\" လို့ ပြ\n\n"
        cadence: line-by-line
      - {
          id: sel-tc2-msg,
          type: editor.select,
          at: { mark: sel-tc2-msg },
          target: { file: docs/test-plan.md, text: '"1 ကနေ 20 အထိ ရွေးပါ"', occurrence: 1 },
        }
      - id: type-tc3
        type: editor.type
        at: { mark: type-tc3 }
        target: { file: docs/test-plan.md, after: "ရွေးပါ\" လို့ ပြ\n\n", occurrence: 1 }
        text: "## TC-3 · ဆိုင်ပိတ်ချိန် (AC-3)\n- လုပ်ရမှာ — TC-1 အတိုင်း၊ လာယူချိန်ကိုပဲ 02:00\n- မျှော်လင့်ချက် — အော်ဒါ မဖြစ်ဘဲ ဆိုင်ဖွင့်ချိန်ကို ပြ\n\n"
        cadence: line-by-line
      - id: type-tc4
        type: editor.type
        at: { mark: type-tc4 }
        target: { file: docs/test-plan.md, after: "ဆိုင်ဖွင့်ချိန်ကို ပြ\n\n", occurrence: 1 }
        text: "## TC-4 · ဖုန်းနံပါတ် မပါ (AC-4)\n- လုပ်ရမှာ — TC-1 အတိုင်း၊ ဖုန်းကိုပဲ အလွတ်\n- မျှော်လင့်ချက် — အော်ဒါ မဖြစ်ဘဲ ဖုန်းနံပါတ် ထည့်ခိုင်း\n\n"
        cadence: line-by-line
      - id: type-tc5
        type: editor.type
        at: { mark: type-tc5 }
        target: { file: docs/test-plan.md, after: "ဖုန်းနံပါတ် ထည့်ခိုင်း\n\n", occurrence: 1 }
        text: "## TC-5 · ကောင်တာစာရင်း (AC-5)\n- လုပ်ရမှာ — လာယူချိန် မတူတဲ့ အော်ဒါ 2 ခု မှာပြီး ကောင်တာစာရင်းကို ကြည့်\n- မျှော်လင့်ချက် — လာယူချိန်အလိုက် စီပြီး ပြ\n\n"
        cadence: line-by-line
      - {
          id: expect-plan,
          type: expect.file,
          at: { afterAction: type-tc5 },
          path: docs/test-plan.md,
          contains: "- မျှော်လင့်ချက် — အော်ဒါ မဖြစ်ဘဲ ဆိုင်ဖွင့်ချိန်ကို ပြ",
        }

  - id: run-tc1
    chapter: Plan အတိုင်း စမ်းရအောင်
    narration: >
      [[mark:ready]] ကဲ၊ plan ရပြီ ဆိုတော့ ညာဘက်က ကြိုမှာ app မှာ စမ်းကြည့်ရအောင်။ ဒီ app
      က agent တစ်ခု ထုတ်ပေးတဲ့ order form ရဲ့ ပထမ version လို့ သဘောထားပြီး lesson အတွက် ပြင်ဆင်ထားတာပါ။ [[mark:menu]] TC
      တစ်ရဲ့ အဆင့်တွေအတိုင်း လုပ်ပါမယ်။ လက်ဖက်ရည်ကို ရွေးပြီးသား ဖြစ်နေပါတယ်။ [[mark:qty]] အရေအတွက်မှာ
      နှစ်ခွက်လို့ ထည့်ပါမယ်။ [[mark:time]] လာယူချိန်ကို ရှစ်နာရီခွဲ လို့ ရွေးပါမယ်။ [[mark:name]] နာမည်မှာ
      အောင်အောင် လို့ ရိုက်ပါမယ်။ [[mark:phone]] ဖုန်းမှာ plan ထဲက နမူနာ နံပါတ်ကို ထည့်ပါမယ်။ [[mark:order]]
      ပြီးရင် မှာမယ် ကို နှိပ်ပါမယ်။ [[mark:card]] အော်ဒါနံပါတ် ၁၀၁၊ စုစုပေါင်း ၃၀၀၀ ကျပ်၊ ရှစ်နာရီခွဲ ဆိုတော့၊
      ရေးထားတဲ့ မျှော်လင့်ချက်နဲ့ ကိုက်ပါတယ်။ [[mark:type-r1]] ရလဒ်မှာ pass လို့ မှတ်ပြီး၊ တကယ် မြင်ခဲ့ရတာကိုပါ
      ထည့်ရေးပါမယ်။ နောက်တစ်ခါ စမ်းတဲ့သူက ဒီ ရလဒ်နဲ့ နှိုင်းယှဉ်လို့ ရအောင်ပါ။
