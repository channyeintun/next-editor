  - id: run-edges
    narration: >
      [[mark:zero]] TC နှစ်အတွက် အရေအတွက် တစ်ခုတည်းကို သုည လို့ ပြောင်းပါမယ်။ [[mark:order-zero]] မှာမယ် ကို
      နှိပ်ကြည့်ပါမယ်။ [[mark:card-zero]] plan က ငြင်းစာ ပြရမယ်လို့ ဆိုပေမယ့်၊ app ကတော့ အော်ဒါ ၁၀၂ ကို
      သုည ကျပ်နဲ့ ပေးလိုက်ပါတယ်။ [[mark:type-r2]] ဒါကြောင့် fail လို့ မှတ်ပါမယ်။ ဘာဖြစ်သွားလဲ ဆိုတာကိုပါ ရေးထားတော့၊
      ဒီ စာကြောင်းက နောက်ပိုင်း အမှားကို ပြင်ခိုင်းတဲ့ bug report တစ်ခုရဲ့ အစ ဖြစ်လာပါမယ်။ [[mark:qty-back]] TC သုံးအတွက်
      အရေအတွက်ကို နှစ်ခွက် ပြန်ထည့်ပါမယ်။ [[mark:closed]] လာယူချိန်ကို မနက် နှစ်နာရီ လို့ ပြောင်းပါမယ်။
      [[mark:order-closed]] မှာမယ် ကို ထပ်နှိပ်ပါမယ်။ [[mark:card-closed]] ဆိုင်ဖွင့်ချိန် မပြဘဲ အော်ဒါ ၁၀၃
      ရသွားပါတယ်။ [[mark:type-r3]] ဒါလည်း fail ပါ။ ဒီ ကိစ္စကို ပြင်ပြီးရင် ဒီ test case နဲ့ပဲ ပြန်စစ်ရမှာပါ။
      [[mark:time-back]] TC လေးအတွက် လာယူချိန်ကို ရှစ်နာရီခွဲ ပြန်ရွေးပါမယ်။ [[mark:phone-empty]] ဖုန်း
      အကွက်ကိုတော့ အလွတ် ထားလိုက်ပါမယ်။ [[mark:order-phone]] မှာမယ် ကို နောက်တစ်ခါ နှိပ်ပါမယ်။
      [[mark:card-phone]] ဖုန်းနံပါတ် မတောင်းဘဲ အော်ဒါ ၁၀၄ ဖြစ်သွားပါတယ်။ [[mark:type-r4]] ဒါလည်း fail
      ပါ။ ငြင်းရမယ့် case သုံးခုလုံး fail ဖြစ်တာကို စာနဲ့ မြင်ရပါပြီ။ [[mark:type-r5]] TC ငါးကိုတော့
      စမ်းလို့ မရသေးပါဘူး။ ကောင်တာစာရင်းက task သုံးမှာမှ ဆောက်မယ့် အပိုင်း ဖြစ်ပြီး၊ မဆောက်ရသေးလို့ပါ။ ဒါကို pass ဒါမှမဟုတ်
      fail မမှတ်ဘဲ ခဏ ရပ်ထားတယ်လို့ မှတ်ပါမယ်။ မစမ်းရသေးတာကို pass လို့ မှတ်ရင်၊ မစစ်ရသေးတဲ့ အပိုင်းကို
      စစ်ပြီးသားလို့ ထင်သွားမှာမို့ပါ။
