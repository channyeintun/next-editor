# AI Builder, lesson 19: testing without code (Burmese, preview kind).
#
# Start state (ws/): the tea-shop pre-order app exactly as base-app/ ("the first version an agent
# built", prepared for the lesson; never edited, never typed into), docs/spec.md (COURSE-KIT §4.3
# without AC-6) and docs/test-plan.md with only its title line (L19 creates it, COURSE-KIT §4.11).
# The runtime starts at the first mark; the anatomy board and writing the whole plan (TC-1…TC-5,
# steps and expected results, before anything is tried) carry the narration before
# runtime.waitForReady.
#
# Boards: (T) a test case's four parts — steps, data, expected (orange, written before trying, from
# the AC), result (written after); the plan as the collection (blue). (R) the plan reused: written
# before the build (blue) → the agent turns it into automated tests and shows them failing first
# (violet, red) → the agent fixes the app (violet) → re-run every test (green), ↻ after every change
# (orange, regression). (Z) the quiz.
# Preview: TC-1 (2 milk teas, 08:30, အောင်အောင်, phone) → #101 ✅; TC-2 quantity 0 → #102 ❌; TC-3
# quantity back to 2, pickup 02:00 → #103 ❌; TC-4 pickup back to 08:30, phone empty → #104 ❌;
# TC-5 ⏸ (the counter list is not built). Exploratory: phone back, press မှာမယ် twice → #105, #106
# (two orders; no AC covers it, so it is a note, not a passed or failed case).
#
# Build: bun ~/Documents/ai-builder-course-work/tools/build-lesson.ts template.yaml ws ai-builder-19-testing-without-code.yaml
