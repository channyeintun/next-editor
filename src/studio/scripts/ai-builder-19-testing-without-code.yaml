  - id: explore
    narration: >
      [[mark:type-charter]] plan ထဲက case တွေ ပြီးသွားပေမယ့်၊ စမ်းစရာ ကုန်သွားတာ မဟုတ်ပါဘူး။ plan မှာ
      မပါတဲ့ ကိစ္စတွေကို စပ်စုစိတ်နဲ့ လျှောက်စမ်းတာကို exploratory testing လို့ ခေါ်ပါတယ်။ ဘာကို ရှာမလဲ ဆိုတာ
      တစ်ကြောင်း အရင် ရေးပြီး၊ နာရီဝက်လောက်လို အချိန် တစ်ခု သတ်မှတ်ပြီး စမ်းပါတယ်။ ဒီနေ့ ရှာမယ့် ကိစ္စက
      requirement ဖိုင်ရဲ့ edge case စာရင်းထဲမှာ ပါပေမယ့်၊ AC မရှိသေးလို့ plan ထဲ မပါခဲ့တဲ့ ကိစ္စပါ။
      [[mark:phone-back]] ပုံမှန် အော်ဒါကနေ စဖို့ ဖုန်းနံပါတ်ကို
      ပြန်ထည့်ပါမယ်။ [[mark:tap-1]] မှာမယ် ကို တစ်ခါ နှိပ်ပါမယ်။ [[mark:tap-2]] ကျောင်းသား မောင်မောင် လို mobile
      data နှေးတဲ့ customer က မရောက်သေးဘူး ထင်ပြီး ထပ်နှိပ်သလို နှိပ်ပါမယ်။ [[mark:card-twice]] အော်ဒါနံပါတ်က
      ၁၀၅ ကနေ ၁၀၆ ကို ပြောင်းသွားပါတယ်။ ဆိုလိုတာက နှိပ်တဲ့ အကြိမ်တိုင်း အော်ဒါ အသစ် တစ်ခုစီ ဖြစ်သွားတာပါ။
      ကောင်တာမှာ လက်ဖက်ရည် လေးခွက် ပြင်မိသွားနိုင်ပါတယ်။ [[mark:type-explore]] ဒါကို ခုနက
      ရှာမယ့်အရာရဲ့ အောက်မှာ မှတ်ထားပါမယ်။ ဒါက test case မဟုတ်သေးလို့ pass၊ fail မမှတ်ဘဲ တွေ့တာကိုပဲ
      ရေးထားပါတယ်။
      ဘာဖြစ်သင့်လဲ ဆိုတာ AC အဖြစ် အရင် ရေးပြီးမှ test case ထည့်လို့ ရပါမယ်။
    sources:
