    narration: >
      [[mark:panel-ready]] ညာဘက် panel ကို ကြည့်ရအောင်။ Errors မှာ ဘာ error မှ မရှိဘဲ၊ Output မှာ
      လက်ဖက်ရည် နှစ်ခွက် ဆိုတာ ထွက်နေပါတယ်။ ဒါပေမဲ့ field တွေကို မှတ်တဲ့ type က အော်ဒါ type နဲ့
      မကိုက်တော့တာကို TypeScript က မသိပါဘူး။ သူ့အတွက်ကတော့ ဒါတွေက ဆက်စပ်မှု မရှိတဲ့ type နှစ်ခုပဲ
      ဖြစ်လို့ပါ။ key တွေကို နှစ်နေရာမှာ ကိုယ်တိုင် ရေးထားသရွေ့ ဒီလို ပြဿနာ ဖြစ်နိုင်တဲ့အတွက်၊ field
      တွေကို မှတ်တဲ့ type ကို အော်ဒါ type ကနေ ဆောက်ယူကြည့်ရအောင်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 10: Deriving Types",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/deriving-types",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-clean
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-start-output
        type: expect.preview
        at: { afterAction: expect-clean }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-1 }
        textContains: "လက်ဖက်ရည် 2 ခွက်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: keyof-map
    chapter: "keyof ပေါ်မှာ map လုပ်ခြင်း"
    narration: >
      [[mark:type-flags]] ကိုယ်တိုင် ရေးထားတဲ့ type ရဲ့ အပေါ်မှာ mapped type နဲ့ ရေးတဲ့ type အသစ်ကို
      ထည့်ပြီး၊ အဟောင်းကိုတော့ comment အဖြစ် ချန်ထားပါမယ်။ [[mark:select-in]] ရွေးထားတဲ့ ဒီ အပိုင်းက key
      တွေကို loop ပတ်တဲ့ အပိုင်းပါ။ key of Order က lesson ၂၀ မှာ မြင်ခဲ့သလို အော်ဒါရဲ့ key လေးခုကို
      union အဖြစ် ပေးပါတယ်။ in ဆိုတဲ့ စကားလုံးက အဲဒီ union ထဲက key တစ်ခုချင်းစီကို loop ပတ်ပြီး၊ K ကတော့
      loop က အခု ရောက်နေတဲ့ key ကို ခေါ်တဲ့ နာမည်ပါ။ loop ထဲက variable လိုမျိုး ဖြစ်လို့ ကြိုက်တဲ့ နာမည်
      ပေးလို့ ရပါတယ်။ [[mark:compare-index]] lesson ၁၃ က index signature နဲ့ ပုံစံ ဆင်ပေမယ့်၊ index
      signature က ဘယ် string key ကိုမဆို လက်ခံပြီး၊ mapped type ကတော့ ဒီ key လေးခုကိုပဲ အတိအကျ
      ဆောက်ပေးပါတယ်။ [[mark:select-boolean]] ညာဘက်က boolean ကတော့ property တစ်ခုချင်းစီ ရမယ့် type ပါ။
      ဒီမှာ key တိုင်းကို boolean ပေးထားပါတယ်။ [[mark:read-size-error]] Errors ကို ကြည့်ပါ၊ error တစ်ခု
      ပေါ်နေပါပြီ။ ပြင်ခဲ့တဲ့ field တွေကို မှတ်ထားတဲ့ object မှာ size မပါဘူး၊ ဒါပေမဲ့ type အသစ်က size
      ကို လိုချင်တယ်လို့ ပြောနေပါတယ်။ ကိုယ်တိုင် ရေးထားတဲ့ type က size ကို မေ့ခဲ့ပေမယ့်၊ mapped type
      ကတော့ key တွေကို အော်ဒါ type ဆီကနေ တိုက်ရိုက် ယူတဲ့အတွက် size ကို တွေ့သွားတာပါ။
      [[mark:type-flags-query]] type ရဲ့ နာမည်အောက်မှာ query comment ထည့်ကြည့်ရအောင်။
      [[mark:read-flags-query]] Types မှာ property လေးခုလုံးက boolean ဖြစ်နေပြီး၊ size လည်း ပါလာပါပြီ။
      ဆိုတော့ ဒီ type က အော်ဒါ type နဲ့ အမြဲ ကိုက်နေမှာပါ။ [[mark:type-size-flag]] object ထဲကို size
      ကိုလည်း ထည့်ပေးလိုက်ပါမယ်။ [[mark:read-flags-fixed]] error ပျောက်သွားပါပြီ။
    sources:
      - {
          title: "TypeScript Handbook: Mapped Types",
          url: "https://www.typescriptlang.org/docs/handbook/2/mapped-types.html",
        }
      - {
          title: "Total TypeScript Essentials, ch. 15: Designing Your Types (mapped types)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/designing-your-types-in-typescript",
        }
      - {
          title: "TypeScript Handbook: Keyof Type Operator",
          url: "https://www.typescriptlang.org/docs/handbook/2/keyof-types.html",
        }
    actions:
      - id: type-flags
        type: editor.type
        at: { mark: type-flags }
        target: { file: src/main.ts, after: "// form မှာ customer ပြင်ခဲ့တဲ့ field တွေ\n", occurrence: 1 }
        text: "type OrderFlags = { [K in keyof Order]: boolean };\n// "
        cadence: block
      - id: expect-size-missing
        type: expect.preview
        at: { afterAction: type-flags }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-size-code
        type: expect.preview
        at: { afterAction: expect-size-missing }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-code, value: "2741" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-size-text
        type: expect.preview
        at: { afterAction: expect-size-code }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-1 }
        textContains: "Property 'size' is missing in type '{ item: false; quantity: true; sugar: false; }' but required in type 'OrderFlags'."
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: select-in
        type: editor.select
        at: { mark: select-in }
        target: { file: src/main.ts, text: "[K in keyof Order]", occurrence: 1 }
      - id: select-boolean
        type: editor.select
        at: { mark: select-boolean }
        target: { file: src/main.ts, text: "boolean", occurrence: 1 }
      - id: type-flags-query
        type: editor.type
        at: { mark: type-flags-query }
        target:
          {
            file: src/main.ts,
            after: "type OrderFlags = { [K in keyof Order]: boolean };\n",
            occurrence: 1,
          }
        text: "//   ^?\n"
        cadence: fast-explainer
      - id: expect-flags-count
        type: expect.preview
        at: { afterAction: type-flags-query }
        timeoutMs: 8000
        target: { by: testId, value: ts-types }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-flags-type
        type: expect.preview
        at: { afterAction: expect-flags-count }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        attribute:
          {
            name: data-type,
            value: "type OrderFlags = {\n    item: boolean;\n    quantity: boolean;\n    sugar: boolean;\n    size: boolean;\n}",
          }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: type-size-flag
        type: editor.type
        at: { mark: type-size-flag }
        target: { file: src/main.ts, after: "sugar: false", occurrence: 1 }
        text: ", size: true"
      - id: expect-flags-fixed
        type: expect.preview
        at: { afterAction: type-size-flag }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: getters
    chapter: "Property ရဲ့ type ကို ယူသုံးခြင်း"
    narration: >
      [[mark:type-getters]] အခု မီးဖိုချောင် screen က function တွေ အတွက် type တစ်ခု ဆောက်ကြည့်ရအောင်။
      ဒီတစ်ခါ property တိုင်းက boolean မဟုတ်ဘဲ၊ function တစ်ခုစီက သူ့ field ရဲ့ type ကို ပြန်ပေးရပါမယ်။
      [[mark:select-indexed]] ဒါကြောင့် function ပြန်ပေးမယ့် type နေရာမှာ lesson ၂၀ က indexed access ကို
      သုံးပြီး၊ Order ထဲက loop အခု ရောက်နေတဲ့ key ရဲ့ type ကို ယူထားပါတယ်။ [[mark:type-getters-query]]
      query comment နဲ့ ကြည့်ပါမယ်။ [[mark:read-getters]] Types မှာ ပစ္စည်း နာမည်ရဲ့ function က string
      ကို ပြန်ပေးပြီး၊ အရေအတွက်က number ကို၊ သကြားက Sugar ကို၊ ခွက် အရွယ်အစားကတော့ Size type ကို
      ပြန်ပေးပါတယ်။ key တစ်ခုချင်းစီရဲ့ မူရင်း type ကို ထိန်းထားပေးတာပါ။ [[mark:type-annotate-view]] ဒီ
      type ကို မီးဖိုချောင် screen ရဲ့ object မှာ type annotation အဖြစ် ထည့်ပါမယ်။
      [[mark:read-view-errors]] error သုံးခု ပေါ်လာပါတယ်။ ပထမ တစ်ခုက object ထဲမှာ getItem ဆိုတဲ့ နာမည်
      ရှိပေမယ့်၊ type ထဲမှာတော့ item ဆိုတဲ့ နာမည်ပဲ ရှိတယ်လို့ ပြောနေပါတယ်။ ကျန်တဲ့ နှစ်ခုကတော့
      အောက်ဆုံး line မှာ ခေါ်ထားတဲ့ နေရာတွေ ဖြစ်ပြီး၊ နာမည် မကိုက်လို့ပါ။ ဆိုတော့ ပြန်ပေးတဲ့ type တွေက
      မှန်နေပေမယ့်၊ key ရဲ့ နာမည်တွေကိုပါ ပြောင်းဖို့ လိုပါတယ်။
    sources:
      - {
          title: "TypeScript Handbook: Indexed Access Types",
          url: "https://www.typescriptlang.org/docs/handbook/2/indexed-access-types.html",
        }
      - {
          title: "TypeScript Handbook: Mapped Types",
          url: "https://www.typescriptlang.org/docs/handbook/2/mapped-types.html",
        }
      - {
          title: "Total TypeScript Essentials, ch. 15: Designing Your Types (mapped types)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/designing-your-types-in-typescript",
        }
    actions:
      - id: type-getters
        type: editor.type
        at: { mark: type-getters }
        target: { file: src/main.ts, after: "size: true };\n\n", occurrence: 1 }
        text: "type OrderGetters = {\n  [K in keyof Order]: () => Order[K];\n};\n\n"
        cadence: line-by-line
      - id: select-indexed
        type: editor.select
        at: { mark: select-indexed }
        target: { file: src/main.ts, text: "Order[K]", occurrence: 1 }
      - id: type-getters-query
        type: editor.type
        at: { mark: type-getters-query }
        target: { file: src/main.ts, after: "type OrderGetters = {\n", occurrence: 1 }
        text: "//   ^?\n"
        cadence: fast-explainer
      - id: expect-getters-count
        type: expect.preview
        at: { afterAction: type-getters-query }
        timeoutMs: 8000
        target: { by: testId, value: ts-types }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-getters-type
        type: expect.preview
        at: { afterAction: expect-getters-count }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-2 }
        attribute:
          {
            name: data-type,
            value: "type OrderGetters = {\n    item: () => string;\n    quantity: () => number;\n    sugar: () => Sugar;\n    size: () => Size;\n}",
          }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: type-annotate-view
        type: editor.type
        at: { mark: type-annotate-view }
        target: { file: src/main.ts, after: "const view", occurrence: 1 }
        text: ": OrderGetters"
      - id: expect-view-errors
        type: expect.preview
        at: { afterAction: type-annotate-view }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "3" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-view-excess
        type: expect.preview
        at: { afterAction: expect-view-errors }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-1 }
        textContains: "'getItem' does not exist in type 'OrderGetters'."
        retry: { maxAttempts: 3, delayMs: 1200 }

  - id: remap
    chapter: "as နဲ့ key ကို နာမည်ပြောင်းခြင်း"
    narration: >
      [[mark:type-remap]] key ရဲ့ နာမည်ကို ပြောင်းဖို့ key of Order ရဲ့ နောက်မှာ as နဲ့ နာမည်အသစ်ကို
      ရေးပါမယ်။ ဒါကို key remapping လို့ ခေါ်ပါတယ်။ နာမည်အသစ်က ပြီးခဲ့တဲ့ lesson က template literal type
      ဖြစ်ပြီး၊ get ဆိုတဲ့ စကားလုံးရဲ့ နောက်မှာ K ကို Capitalize နဲ့ ပထမ စာလုံး အကြီး ပြောင်းပြီး
      ဆက်ထားတာပါ။ [[mark:read-remap]] Types မှာ နာမည်တွေက getItem ရယ်၊ getQuantity ရယ်၊ getSugar ရယ်၊
      getSize ရယ် ဖြစ်သွားပြီး၊ error သုံးခုလုံးလည်း ပျောက်သွားပါပြီ။ မီးဖိုချောင် screen ရဲ့ object က
      type နဲ့ ကိုက်သွားလို့ပါ။ [[mark:select-order-k]] function ပြန်ပေးမယ့် type ကို သတိထား ကြည့်ပါ။ as
      က key ရဲ့ နာမည်ကိုပဲ ပြောင်းတာ ဖြစ်လို့၊ K က မူရင်း key အတိုင်း ကျန်နေပြီး Order ထဲက type ကို
      မှန်မှန် ရှာနိုင်ပါသေးတယ်။ ပြီးတော့ ဒီ as က lesson ၂၂ က type assertion မဟုတ်ပါဘူး။ စကားလုံး
      တူပေမယ့် အလုပ် မတူပါဘူး။
    sources:
      - {
          title: "TypeScript Handbook: Mapped Types (key remapping via as)",
          url: "https://www.typescriptlang.org/docs/handbook/2/mapped-types.html#key-remapping-via-as",
        }
      - {
          title: "TypeScript Handbook: Template Literal Types (Capitalize)",
          url: "https://www.typescriptlang.org/docs/handbook/2/template-literal-types.html",
        }
      - {
          title: "Total TypeScript Essentials, ch. 15: Designing Your Types (key remapping with as)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/designing-your-types-in-typescript",
        }
    actions:
      - id: type-remap
        type: editor.type
        at: { mark: type-remap }
        target: { file: src/main.ts, after: "  [K in keyof Order", occurrence: 1 }
        text: " as `get${Capitalize<K>}`"
        cadence: fast-explainer
      - id: expect-remap-clean
        type: expect.preview
        at: { afterAction: type-remap }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-remap-type
        type: expect.preview
        at: { afterAction: expect-remap-clean }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-2 }
        attribute:
          {
            name: data-type,
            value: "type OrderGetters = {\n    getItem: () => string;\n    getQuantity: () => number;\n    getSugar: () => Sugar;\n    getSize: () => Size;\n}",
          }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: select-order-k
        type: editor.select
        at: { mark: select-order-k }
        target: { file: src/main.ts, text: "Order[K]", occurrence: 1 }

  - id: union-keys
    chapter: "Union ပေါ်မှာ map လုပ်ခြင်း"
    narration: >
      mapped type က key of နဲ့ပဲ သုံးရမယ်လို့ မဟုတ်ပါဘူး။ string literal တွေရဲ့ union ဘယ်ဟာ ပေါ်မှာမဆို
      map လုပ်လို့ ရပါတယ်။ [[mark:type-labels]] ဥပမာအားဖြင့် ဘောင်ချာ ပေါ်မှာ သကြား အဆင့်ကို မြန်မာလို
      ပြချင်တယ် ဆိုပါစို့။ သကြား အဆင့် သုံးမျိုးရဲ့ union ပေါ်မှာ map လုပ်ပြီး၊ အဆင့် တစ်ခုစီ အတွက် string
      တစ်ခုစီ ရှိတဲ့ type ကို အော်ဒါ object ရဲ့ အောက်မှာ ဆောက်ပြီး query comment နဲ့ ကြည့်ပါမယ်။
      [[mark:read-labels]] ဖိုင်ရဲ့ အပေါ်ပိုင်းမှာ ရေးထားလို့ ဒီ type က Types ရဲ့ ထိပ်ဆုံးမှာ ပေါ်လာပါတယ်။
      less ရယ်၊ normal ရယ်၊ extra ရယ် ဆိုတဲ့ property သုံးခု ရှိပြီး၊ သုံးခုလုံးက string
      ဖြစ်ပါတယ်။ [[mark:type-labels-object]] ဒီ type နဲ့ စာသား သုံးခုကို ရေးပြီး၊ အော်ဒါရဲ့ သကြား အဆင့်နဲ့
      ကိုက်တဲ့ စာသားကို ထုတ်ပြပါမယ်။ [[mark:read-label-output]] Output မှာ သကြား နည်း ဆိုတာ
      ထွက်လာပါပြီ။ lesson ၁၃ က Record ကလည်း တကယ်တော့ ဒီ နည်းနဲ့ပဲ ရေးထားတာ ဖြစ်လို့၊ Record ကို Sugar
      နဲ့ string ပေးရင် ဒီ type အတိုင်း ရပါတယ်။
    sources:
      - {
          title: "TypeScript Handbook: Mapped Types (mapping over arbitrary unions)",
          url: "https://www.typescriptlang.org/docs/handbook/2/mapped-types.html#key-remapping-via-as",
        }
      - {
          title: "Total TypeScript Essentials, ch. 15: Designing Your Types (using mapped types with union types)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/designing-your-types-in-typescript",
        }
      - {
          title: "TypeScript Handbook: Utility Types (Record)",
          url: "https://www.typescriptlang.org/docs/handbook/utility-types.html#recordkeys-type",
        }
    actions:
      - id: type-labels
        type: editor.type
        at: { mark: type-labels }
        target: { file: src/main.ts, after: "  size: \"large\",\n};\n", occurrence: 1 }
        text: "\ntype SugarLabels = { [L in Sugar]: string };\n//   ^?\n"
        cadence: fast-explainer
      - id: expect-labels-count
        type: expect.preview
        at: { afterAction: type-labels }
        timeoutMs: 8000
        target: { by: testId, value: ts-types }
        attribute: { name: data-count, value: "3" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-labels-type
        type: expect.preview
        at: { afterAction: expect-labels-count }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        attribute:
          {
            name: data-type,
            value: "type SugarLabels = {\n    less: string;\n    normal: string;\n    extra: string;\n}",
          }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: type-labels-object
        type: editor.type
        at: { mark: type-labels-object }
        target:
          {
            file: src/main.ts,
            after: "type SugarLabels = { [L in Sugar]: string };\n//   ^?\n",
            occurrence: 1,
          }
        text: "const labels: SugarLabels = {\n  less: \"သကြား နည်း\",\n  normal: \"ပုံမှန်\",\n  extra: \"သကြား များ\",\n};\nconsole.log(labels[order.sugar]);\n"
        cadence: line-by-line
      - id: expect-labels-clean
        type: expect.preview
        at: { afterAction: type-labels-object }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-label-output
        type: expect.preview
        at: { afterAction: expect-labels-clean }
        timeoutMs: 8000
        target: { by: testId, value: ts-out-1 }
        textContains: "သကြား နည်း"
        retry: { maxAttempts: 3, delayMs: 1200 }

  - id: my-partial
    chapter: "Utility type ကို ကိုယ်တိုင် ရေးခြင်း"
    narration: >
      [[mark:type-partial]] အခု lesson ၁၄ က Partial ကို ကိုယ်တိုင် ရေးကြည့်ရအောင်။ ဘယ် object type
      နဲ့မဆို သုံးလို့ ရအောင် lesson ၂၇ က type parameter T ကို လက်ခံပြီး၊ T ရဲ့ key တွေ ပေါ်မှာ map
      လုပ်ပါမယ်။ ထူးခြားတာ တစ်ခုပဲ ရှိပါတယ်။ key ရဲ့ နောက်မှာ question mark ထည့်ထားလို့ property တိုင်းက
      မပါလည်း ရတဲ့ property ဖြစ်သွားပါတယ်။ [[mark:type-update]] customer က အရေအတွက်ကိုပဲ သုံးခွက်
      ပြောင်းချင်တယ် ဆိုပါစို့။ ပြင်မယ့် field တစ်ခုတည်း ပါတဲ့ object ကို ရေးပြီး၊ မူရင်း အော်ဒါနဲ့
      ပေါင်းထားတာကို ထုတ်ပြပါမယ်။ [[mark:read-update]] field တစ်ခုတည်း ပေးထားပေမယ့် error မရှိပါဘူး။
      Output မှာလည်း အရေအတွက်က ၃ ဖြစ်သွားပြီး ကျန်တဲ့ field တွေက မပြောင်းပါဘူး။ TypeScript ရဲ့ Partial
      ကလည်း ဒီ အတိုင်း အလုပ်လုပ်ပါတယ်။
    sources:
      - {
          title: "TypeScript Handbook: Mapped Types (mapping modifiers)",
          url: "https://www.typescriptlang.org/docs/handbook/2/mapped-types.html#mapping-modifiers",
        }
      - {
          title: "TypeScript Handbook: Utility Types (Partial)",
          url: "https://www.typescriptlang.org/docs/handbook/utility-types.html#partialtype",
        }
    actions:
      - id: type-partial
        type: editor.type
        at: { mark: type-partial }
        target:
          {
            file: src/main.ts,
            after: "console.log(view.getItem(), view.getQuantity(), \"ခွက်\");\n",
            occurrence: 1,
          }
        text: "\ntype MyPartial<T> = {\n  [K in keyof T]?: T[K];\n};\n"
        cadence: line-by-line
      - id: type-update
        type: editor.type
        at: { mark: type-update }
        target: { file: src/main.ts, after: "  [K in keyof T]?: T[K];\n};\n", occurrence: 1 }
        text: "const update: MyPartial<Order> = { quantity: 3 };\nconsole.log({ ...order, ...update });\n"
        cadence: line-by-line
      - id: expect-update-clean
        type: expect.preview
        at: { afterAction: type-update }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-update-output
        type: expect.preview
        at: { afterAction: expect-update-clean }
        timeoutMs: 8000
        target: { by: testId, value: ts-out-3 }
        textContains: "{ item: 'လက်ဖက်ရည်', quantity: 3, sugar: 'less', size: 'large' }"
        retry: { maxAttempts: 3, delayMs: 1200 }

  - id: my-readonly
    narration: >
      [[mark:type-readonly]] Readonly ကိုလည်း ဒီ နည်းနဲ့ပဲ ရေးလို့ ရပါတယ်။ ဒီတစ်ခါ key ရဲ့ ရှေ့မှာ read only ကို
      ထည့်ပြီး၊ အော်ဒါကို ဒီ type ရှိတဲ့ variable တစ်ခုထဲ ထည့်ပါမယ်။ ပြီးတော့ အဲဒီ variable ကနေ အရေအတွက်ကို
      ပြင်ကြည့်ပါမယ်။ [[mark:read-readonly]] Errors မှာ quantity က read only property ဖြစ်လို့ တန်ဖိုး
      အသစ် ထည့်လို့ မရဘူး ဆိုတဲ့ error ပေါ်လာပါပြီ။ ဒါက type ပိုင်းမှာပဲ စစ်တာ ဖြစ်လို့၊ runtime မှာတော့ ဘာမှ
      တားမှာ မဟုတ်ပါဘူး။ [[mark:board-builtins]] တကယ်တော့ TypeScript ကိုယ်တိုင်ရဲ့ lib ဖိုင်ထဲမှာ
      Partial နဲ့ Readonly ကို ဒီ အတိုင်းပဲ ရေးထားပါတယ်။ ကိုယ် ရေးခဲ့တာနဲ့ ကွာတာက key ရဲ့ နာမည် K အစား P
      ကို သုံးထားတာလောက်ပါပဲ။ [[mark:draw-required]] Required ကတော့ question mark ရဲ့ ရှေ့မှာ အနုတ်
      လက္ခဏာ ထည့်ထားပြီး၊ မပါလည်း ရတဲ့ property တွေကို မဖြစ်မနေ ပါရမယ့် property အဖြစ် ပြန်ပြောင်းပေးပါတယ်။
      [[mark:draw-record]] Record ကတော့ ခုနက သကြား စာသားတွေလိုပဲ၊ key တွေရဲ့ union ပေါ်မှာ map လုပ်ပြီး
      property တိုင်းကို type တစ်ခုတည်း ပေးတာပါ။
    sources:
      - {
          title: "TypeScript Handbook: Mapped Types (mapping modifiers: readonly, -?)",
          url: "https://www.typescriptlang.org/docs/handbook/2/mapped-types.html#mapping-modifiers",
        }
      - {
          title: "TypeScript source: lib.es5.d.ts (Partial, Required, Readonly, Record)",
          url: "https://github.com/microsoft/TypeScript/blob/main/src/lib/es5.d.ts",
        }
      - {
          title: "TypeScript Handbook: Utility Types",
          url: "https://www.typescriptlang.org/docs/handbook/utility-types.html",
        }
    actions:
      - id: type-readonly
        type: editor.type
        at: { mark: type-readonly }
        target:
          { file: src/main.ts, after: "console.log({ ...order, ...update });\n", occurrence: 1 }
        text: "\ntype MyReadonly<T> = {\n  readonly [K in keyof T]: T[K];\n};\nconst saved: MyReadonly<Order> = order;\nsaved.quantity = 5;\n"
        cadence: line-by-line
      - id: expect-readonly-error
        type: expect.preview
        at: { afterAction: type-readonly }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-readonly-text
        type: expect.preview
        at: { afterAction: expect-readonly-error }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-1 }
        textContains: "Cannot assign to 'quantity' because it is a read-only property."
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: board-builtins
        type: whiteboard.apply
        at: { mark: board-builtins }
        open: true
        clear: true
        upsertIds: [b-title, b-partial, b-partial-desc, b-readonly, b-readonly-desc]
        drawMs: 3000
      - id: draw-required
        type: whiteboard.apply
        at: { mark: draw-required }
        upsertIds: [b-required, b-required-desc]
        drawMs: 1800
      - id: draw-record
        type: whiteboard.apply
        at: { mark: draw-record }
        upsertIds: [b-record, b-record-desc]
        drawMs: 1600

  - id: recap
    narration: >
      [[mark:close-board-b]] ဒါဆို ပြန်ချုပ်ရရင်၊ mapped type က key တွေကို တစ်ခုချင်း loop ပတ်ပြီး
      object type အသစ် ဆောက်ပေးပါတယ်။ key of နဲ့ ဆောက်ရင် မူရင်း type ကို ပြင်တိုင်း အလိုလို
      လိုက်ပြောင်းပြီး၊ indexed access နဲ့ property တစ်ခုစီရဲ့ မူရင်း type ကို ထိန်းထားနိုင်ပါတယ်။
      [[mark:recap-remap]] as နဲ့ key ရဲ့ နာမည်တွေကို ပြောင်းနိုင်ပြီး၊ key of မဟုတ်တဲ့ union
      ပေါ်မှာလည်း map လုပ်နိုင်ပါတယ်။ Partial ရယ်၊ Readonly ရယ်၊ Record ရယ် စတဲ့ utility type တွေကလည်း
      mapped type တွေပါပဲ။ နောက် lesson မှာတော့ type parameter ကို type တွေမှာ မဟုတ်ဘဲ function တွေမှာ
      သုံးတဲ့ generic function ကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "TypeScript Handbook: Mapped Types",
          url: "https://www.typescriptlang.org/docs/handbook/2/mapped-types.html",
        }
      - {
          title: "Total TypeScript Essentials, ch. 15: Designing Your Types",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/designing-your-types-in-typescript",
        }
    actions:
      - id: close-board-b
        type: whiteboard.apply
        at: { mark: close-board-b }
        open: false
      - id: select-remap
        type: editor.select
        at: { mark: recap-remap }
        target: { file: src/main.ts, text: "as `get${Capitalize<K>}`", occurrence: 1 }
      - id: expect-file-flags
        type: expect.file
        at: { afterAction: close-board-b }
        path: src/main.ts
        contains: "type OrderFlags = { [K in keyof Order]: boolean };\n//   ^?\n// type OrderFlags = { item: boolean; quantity: boolean; sugar: boolean };"
      - id: expect-file-getters
        type: expect.file
        at: { afterAction: expect-file-flags }
        path: src/main.ts
        contains: "  [K in keyof Order as `get${Capitalize<K>}`]: () => Order[K];"
      - id: expect-file-view
        type: expect.file
        at: { afterAction: expect-file-getters }
        path: src/main.ts
        contains: "const view: OrderGetters = {"
      - id: expect-file-partial
        type: expect.file
        at: { afterAction: expect-file-view }
        path: src/main.ts
        contains: "type MyPartial<T> = {\n  [K in keyof T]?: T[K];\n};\nconst update: MyPartial<Order> = { quantity: 3 };"
      - id: expect-file-readonly
        type: expect.file
        at: { afterAction: expect-file-partial }
        path: src/main.ts
        contains: "type MyReadonly<T> = {\n  readonly [K in keyof T]: T[K];\n};"
checks:
  - { type: timing.p95Ms, max: 300 }
