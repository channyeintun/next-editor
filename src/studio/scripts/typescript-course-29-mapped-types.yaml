  # render console (AthanLab with the user's own key, or VoxCPM2 when that feature is enabled).
  voiceProfile: pocket-alba-v1
  seed: 2929
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "Type တွေအတွက် map"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ template literal type နဲ့ string ရဲ့ ပုံစံကို type နဲ့
      သတ်မှတ်တာ၊ conditional type နဲ့ type ပိုင်းမှာ if else လို ရွေးတာကို လေ့လာခဲ့ပါတယ်။ ဒီ lesson
      မှာတော့ ရှိပြီးသား object type တစ်ခုရဲ့ key တွေကို တစ်ခုချင်း loop ပတ်ပြီး၊ object type အသစ် တစ်ခု
      ဆောက်ပေးတဲ့ mapped type ကို ကြည့်သွားပါမယ်။ [[mark:draw-js]] JavaScript ရဲ့ array map နဲ့ ယှဉ်ပြီး
      စဉ်းစားကြည့်ရအောင်။ ဈေးနှုန်း array ပေါ်မှာ map ကို ခေါ်ပြီး ၃၀၀ စီ ပေါင်းခိုင်းလိုက်ရင်၊ map က
      တန်ဖိုး တစ်ခုချင်းစီ အတွက် function ကို ခေါ်ပေးပြီး array အသစ် တစ်ခု ပြန်ပေးပါတယ်။ ပြောင်းပုံကို
      တစ်ခါပဲ ရေးရပြီး၊ array ထဲမှာ တန်ဖိုး ဘယ်နှစ်ခု ရှိရှိ အားလုံး ပြောင်းသွားပါတယ်။
      [[mark:draw-type]] mapped type ကလည်း အဲဒီ အတိုင်းပါပဲ။ ဒါပေမဲ့ တန်ဖိုးတွေကို မဟုတ်ဘဲ၊ type
      ပိုင်းမှာ key တွေကို loop ပတ်တာပါ။ အော်ဒါ type ရဲ့ key တစ်ခုချင်းစီ အတွက် property တစ်ခုစီ
      ဆောက်ပေးပြီး၊ ဒီ ဥပမာမှာတော့ property တိုင်းကို boolean ပေးထားပါတယ်။ ဆိုတော့ အော်ဒါမှာ key အသစ်
      ထပ်ဝင်လာရင်လည်း၊ ဆောက်ထားတဲ့ type ထဲကို အလိုလို ပါလာမှာပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 15: Designing Your Types (mapped types)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/designing-your-types-in-typescript",
        }
      - {
          title: "TypeScript Handbook: Mapped Types",
          url: "https://www.typescriptlang.org/docs/handbook/2/mapped-types.html",
        }
      - {
          title: "MDN: Array.prototype.map()",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/map",
        }
    actions:
      - id: open-board-a
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-js
        type: whiteboard.apply
        at: { mark: draw-js }
        upsertIds: [a-js-in, a-js-arrow-1, a-js-box, a-js-fn, a-js-arrow-2, a-js-out, a-js-note]
        drawMs: 3200
      - id: draw-type
        type: whiteboard.apply
        at: { mark: draw-type }
        upsertIds: [a-t-in, a-t-arrow-1, a-t-box, a-t-fn, a-t-arrow-2, a-t-out, a-t-note, a-t-keys]
        drawMs: 3600

  - id: starter
    narration: >
      [[mark:close-board]] ဒီနေ့ code ကို ကြည့်ရအောင်။ [[mark:open-order]] ဒါက အော်ဒါ type ကို ရေးထားတဲ့
      ဖိုင်ပါ။ [[mark:select-order-type]] အော်ဒါ တစ်ခုမှာ ပစ္စည်း နာမည်၊ အရေအတွက်၊ သကြား အဆင့်နဲ့ ခွက်
      အရွယ်အစား ဆိုတဲ့ property လေးခု ပါပါတယ်။ [[mark:select-size]] ခွက် အရွယ်အစားကတော့ ပြီးခဲ့တဲ့
      အပတ်ကမှ ထပ်ထည့်ထားတာပါ။ [[mark:open-main]] main ဖိုင်ကို ကြည့်ရအောင်။ [[mark:select-order]]
      အပေါ်ဆုံးမှာ လက်ဖက်ရည် ခွက်ကြီး နှစ်ခွက်ကို သကြား နည်းနည်းနဲ့ မှာထားတဲ့ အော်ဒါ ရှိပါတယ်။
      [[mark:select-flags]] သူ့အောက်က type ကတော့ customer က form ထဲမှာ အော်ဒါကို ပြင်တဲ့အခါ၊ ဘယ် field
      တွေကို ပြင်ခဲ့လဲ ဆိုတာကို field တစ်ခုစီ အတွက် boolean တစ်ခုစီနဲ့ မှတ်ထားတာပါ။ ဒါပေမဲ့ သေချာ
      ကြည့်ပါ၊ ပစ္စည်း၊ အရေအတွက်နဲ့ သကြား သုံးခုပဲ ပါပြီး ခွက် အရွယ်အစား မပါပါဘူး။ ဒီ type ကို ခွက်
      အရွယ်အစား မရှိခင်ကတည်းက ကိုယ်တိုင် ရေးထားခဲ့ပြီး၊ နောက်မှ လိုက်ပြင်ဖို့ မေ့သွားတာပါ။
      [[mark:select-view]] အောက်မှာတော့ မီးဖိုချောင် screen က အော်ဒါကို ဖတ်ဖို့ သုံးတဲ့ function လေးခု
      ရှိပြီး၊ field တစ်ခုစီ အတွက် တစ်ခုစီ ရေးထားပါတယ်။ နောက်ဆုံး line ကတော့ ပစ္စည်း နာမည်နဲ့
      အရေအတွက်ကို ထုတ်ပြပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 10: Deriving Types (derive instead of duplicating)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/deriving-types",
        }
      - {
          title: "TypeScript Handbook: Object Types",
          url: "https://www.typescriptlang.org/docs/handbook/2/objects.html",
        }
