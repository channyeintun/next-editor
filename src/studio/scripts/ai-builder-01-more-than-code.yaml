  - id: quiz
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ ခုနက app ကို agent က မိနစ်ပိုင်းအတွင်း ထုတ်ပေးနိုင်တယ် ဆိုပါစို့။
      ဒါဆို builder ရဲ့ အချိန်ကို ဘာက ဆက်ယူနေဦးမလဲ။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဘာက မှန်လဲ ဆိုတာ သိအောင် လုပ်တာနဲ့၊ ထွက်လာတာ မှန်မမှန် စစ်တာပါ။
      ဘာကြောင့်လဲဆိုတော့ app ကို ဆိုင်ရဲ့ စည်းကမ်းနဲ့ customer တွေရဲ့ မနက်ခင်းကို သိမှ မှန်မှန် ဆောက်လို့ ရပြီး၊
      သုည ခွက် အော်ဒါလို ပြဿနာကိုလည်း စမ်းကြည့်မှ တွေ့ရလို့ပါ။
    sources:
      - {
          title: "The New SDLC (Burmese edition): Conclusion",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          clear: true,
          upsertIds: [z-title, z-q1, z-q2],
          drawMs: 1600,
        }
      - {
          id: draw-quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [z-a, z-a2, z-note],
          drawMs: 1800,
        }

  - id: recap
    chapter: ပြန်ချုပ်ရရင်
    narration: >
      [[mark:close-quiz]] ဒါဆို ပြန်ချုပ်ရရင်၊ code ရေးတာက software engineering ရဲ့ အဆင့် တစ်ဆင့်ပဲ ဖြစ်ပြီး၊
      အဲဒီ အဆင့်ကို agent က မြန်မြန် လုပ်ပေးနိုင်ပါပြီ။ [[mark:sel-intent]] ဒါကြောင့် ကိုယ့်အလုပ်ရဲ့ အဓိကက ဘာဆောက်မလဲ၊
      ဘာက မှန်လဲ ဆုံးဖြတ်တဲ့ intent ဖြစ်လာပါတယ်။ [[mark:sel-verify]] ထွက်လာတာ မှန်မမှန် စစ်တဲ့
      verification ကလည်း ကိုယ့်အလုပ်ပါ။ [[mark:sel-doubt]] ပုံမှန် အော်ဒါ တစ်ခု မှန်တာနဲ့ app ပြီးပြီလို့
      မယူဆဘဲ၊ သုည ခွက်လို သံသယတွေကို မှတ်ထားပြီး ပြန်မေးရပါမယ်။ နောက် lesson မှာတော့ coding agent တစ်ခုရဲ့
      အထဲမှာ တကယ် ဘာတွေ ဖြစ်နေလဲ ဆိုတာကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): Conclusion",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "The New SDLC (Burmese edition): From syntax to intent",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: close-quiz }, open: false }
      - {
          id: sel-intent,
          type: editor.select,
          at: { mark: sel-intent },
          target: { file: notes.md, text: "intent — ဘာမှန်လဲ ကိုယ်က ဆုံးဖြတ်", occurrence: 1 },
        }
      - {
          id: sel-verify,
          type: editor.select,
          at: { mark: sel-verify },
          target: { file: notes.md, text: "verification — မှန်မမှန် ကိုယ်က စစ်", occurrence: 1 },
        }
      - {
          id: sel-doubt,
          type: editor.select,
          at: { mark: sel-doubt },
          target:
            { file: notes.md, text: "သံသယ — အရေအတွက် 0 နဲ့ မှာတော့ 0 ကျပ်နဲ့ လက်ခံသွားတယ်။", occurrence: 1 },
        }
checks:
  - { type: timing.p95Ms, max: 300 }
