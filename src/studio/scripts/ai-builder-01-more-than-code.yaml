# AI Builder, lesson 01: code is one part of the job (Burmese, the course pilot, preview kind).
#
# Start state (ws/): the tea-shop pre-order app exactly as base-app/ ("the first version an agent
# built", prepared for the lesson; never edited, never typed into) and notes.md with only "# Notes".
# The runtime starts at the first mark; three boards (welcome, the story, the steps of building
# software) carry ~2,600 narration characters before runtime.waitForReady.
#
# Boards: (W) who the course is for, ကိုယ် (builder) + the agent; (S) the shop, the four people and
# the app; (T) the steps of building software, build small and violet, reopened later for intent and
# verification; (M) the course map: the 8-box strip (m-b*, m-n*, reusable by later lessons as the
# course strip) and the module names (m-t*); (B) the documents the course will write; (Z) the quiz.
# Preview: အောင်အောင်'s order (2 milk teas, 08:30) → #101, 3,000 ကျပ်; then quantity 0 → #102,
# 0 ကျပ် (a teaser, not solved). notes.md gets the doubt and the three key lines; the recap selects them.
#
