  - id: binder
    narration: >
      [[mark:b-intro]] ဒီ course မှာ code တစ်ကြောင်းမှ မရေးပါဘူး။ အဲဒီအစား၊ course တစ်လျှောက်လုံး app ရဲ့
      document တွေကို editor ထဲမှာ တကယ် ရေးသွားမှာပါ။ [[mark:b-g1]] ပြဿနာကို ရေးတဲ့ စာမျက်နှာနဲ့၊ app က
      ဘာလုပ်ပေးရမလဲ ဆိုတဲ့ requirement စာမျက်နှာကနေ စပါမယ်။ [[mark:b-g2]] ပြီးတော့ ပြီးပြီ ဆိုတာကို
      စစ်လို့ရအောင် ရေးတဲ့ spec၊ agent က အမြဲ အရင်ဖတ်တဲ့ rule file နဲ့ task တစ်ခုချင်း အပ်တဲ့ စာတွေကို ရေးပါမယ်။
      [[mark:b-g3]] နောက်ပိုင်းမှာ test plan၊ release checklist နဲ့ ပြဿနာ ဖြစ်ရင် လုပ်ရမယ့် အဆင့်တွေကို ရေးထားတဲ့
      runbook တို့ ပါလာပါမယ်။ [[mark:b-why]] ဒီ document တွေကို ရေးပြီး ထားရုံ မဟုတ်ပါဘူး။ agent ကို
      ဘာဆောက်ရမလဲ ပြောတာရော၊ ထွက်လာတာကို လူတွေ စစ်တာရော၊ ဒီ document တွေနဲ့ပဲ လုပ်မှာပါ။
    sources:
