build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console: AthanLab with the signed-in
  # user's own API key and voice, or VoxCPM2 when that private feature is
  # enabled.
  voiceProfile: pocket-alba-v1
  seed: 6101
runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: welcome
    chapter: Course ကို ကြိုဆိုပါတယ်
    narration: >
      [[mark:start]] မင်္ဂလာပါ ခင်ဗျာ။ AI Builder course ကို ကြိုဆိုပါတယ်။ [[mark:w-for]] ဒီ course က AI
      နဲ့ တကယ် သုံးလို့ရတဲ့ product တစ်ခု တည်ဆောက်ချင်ပေမယ့်၊ programming မလုပ်ဖူးသေးတဲ့ သူတွေအတွက် ဖြစ်ပါတယ်။
      ဆိုင်ပိုင်ရှင် ဖြစ်ဖြစ်၊ designer ဖြစ်ဖြစ်၊ ကျောင်းသား ဖြစ်ဖြစ်၊ code ရေးတတ်ဖို့ မလိုပါဘူး။ code စရေးနေတဲ့
      developer အသစ်တွေအတွက်လည်း code အပြင်က engineering အပိုင်းကို ဖြည့်ပေးပါမယ်။
      [[mark:w-team]] ဒီ course မှာ ကိုယ်တို့က code မရေးဘဲ AI agent နဲ့ app ကို တည်ဆောက်ပေးမယ့်သူ၊ builder ပါ။
      AI agent ဆိုတာ ပန်းတိုင် တစ်ခု ပေးလိုက်ရင်၊ file တွေ ဖတ်၊ code ပြင်၊ စမ်း run ရင်း အလုပ်ပြီးတဲ့အထိ
      ဆက်လုပ်သွားတဲ့ AI tool ပါ။ [[mark:w-jobs]] code ကို agent က ရေးပေးပေမယ့်၊ ဘာကို ဆောက်မလဲ၊ ဆောက်ပြီးတာ
      မှန်ရဲ့လား ဆိုတာကတော့ ကိုယ်က ဆုံးဖြတ်ရမှာပါ။ ဒီ course တစ်ခုလုံးက အဲဒီ ကိုယ့်အလုပ်အကြောင်းပါ။
    sources:
      - {
          title: "The New SDLC (Burmese edition): Introduction",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "The New SDLC (Burmese edition): From syntax to intent",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: open-board-w,
          type: whiteboard.apply,
          at: { scene: start, offsetMs: -450 },
          open: true,
          clear: true,
          upsertIds: [w-title],
        }
      - {
          id: start-runtime,
          type: runtime.start,
          at: { mark: start },
          timeoutMs: 60000,
          retry: { maxAttempts: 2, delayMs: 500 },
        }
      - {
          id: draw-w-for,
          type: whiteboard.apply,
          at: { mark: w-for },
          upsertIds: [w-for],
          drawMs: 900,
        }
      - {
          id: draw-w-team,
          type: whiteboard.apply,
          at: { mark: w-team },
          upsertIds: [w-me-box, w-me, w-arrow, w-agent-box, w-agent],
          drawMs: 2000,
        }
      - {
          id: draw-w-jobs,
          type: whiteboard.apply,
          at: { mark: w-jobs },
          upsertIds: [w-agent-job, w-me-job],
          drawMs: 1400,
        }

  - id: story
    narration: >
      [[mark:s-shop]] course တစ်လျှောက်လုံး ရန်ကုန်၊ ဗဟန်းက ရွှေလက်ဖက်ရည်ဆိုင်ရဲ့ ပြဿနာ တစ်ခုကို ဖြေရှင်းသွားမှာပါ။
      [[mark:s-owner]] ဆိုင်ပိုင်ရှင်က programmer မဟုတ်ပါဘူး။ [[mark:s-app]] မနက်ပိုင်းမှာ တန်းရှည်လွန်းလို့၊
      အလုပ်သွားမယ့် customer တွေ မဝယ်ဘဲ ပြန်ထွက်သွားကြတာကို ဆိုင်ပိုင်ရှင် စိတ်ပူနေပါတယ်။ ဒါကြောင့် customer တွေ ဖုန်းကနေ
      ကြိုမှာထားပြီး လာယူလို့ရမယ့် ကြိုမှာ app တစ်ခု လိုချင်ပါတယ်။ [[mark:s-people]] ကောင်တာက လှလှ က
      ဝင်လာတဲ့ အော်ဒါတွေကို လက်ခံပြီး၊ customer ရောက်လာချိန်မှာ အသင့် ဖြစ်နေအောင် လုပ်ပေးမှာပါ။ member အောင်အောင်
      ကတော့ အလုပ်မသွားခင် မနက်တိုင်း လက်ဖက်ရည် လာဝယ်ပြီး၊ တန်းရှည်ရင် မဝယ်ဘဲ ပြန်သွားတတ်တဲ့သူပါ။ [[mark:s-maung]] ကျောင်းသား မောင်မောင် က customer အသစ်ပါ။ ဈေးပေါတဲ့ Android
      ဖုန်း၊ နှေးတဲ့ mobile data နဲ့ မြန်မာ keyboard ကို သုံးပါတယ်။ [[mark:s-me]] app ကိုတော့ ကိုယ်က
      AI agent နဲ့ ဆောက်ပေးမှာပါ။ ဒီ လူ လေးယောက်ကို course တစ်လျှောက်လုံး ခဏခဏ ပြန်တွေ့ရမှာ ဖြစ်လို့၊ ကိုယ်
      ဆုံးဖြတ်တဲ့ အရာတိုင်းက သူတို့ရဲ့ မနက်ခင်းကို ဘယ်လို ပြောင်းစေမလဲ ဆိုတာ အမြဲ မေးကြည့်ရပါမယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): Introduction",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: draw-s-shop,
          type: whiteboard.apply,
          at: { mark: s-shop },
          clear: true,
          upsertIds: [s-title],
        }
      - {
          id: draw-s-owner,
          type: whiteboard.apply,
          at: { mark: s-owner },
          upsertIds: [s-p1],
          drawMs: 900,
        }
      - {
          id: draw-s-app,
          type: whiteboard.apply,
          at: { mark: s-app },
          upsertIds: [s-why, s-app-box, s-app],
          drawMs: 1800,
        }
      - {
          id: draw-s-people,
          type: whiteboard.apply,
          at: { mark: s-people },
          upsertIds: [s-p2, s-p3],
          drawMs: 1400,
        }
      - {
          id: draw-s-maung,
          type: whiteboard.apply,
          at: { mark: s-maung },
          upsertIds: [s-p4],
          drawMs: 900,
        }
      - {
          id: draw-s-me,
          type: whiteboard.apply,
          at: { mark: s-me },
          upsertIds: [s-me],
          drawMs: 900,
        }

  - id: steps
    chapter: Code က အဆင့် တစ်ဆင့်ပဲ
    narration: >
      [[mark:t-title]] ဒါဆို app တစ်ခု ဆောက်တယ် ဆိုတာ code ရေးတာလား။ တကယ်တော့ code ရေးတာက အဆင့်တွေ
      အများကြီးထဲက တစ်ဆင့်ပဲ ဖြစ်ပါတယ်။ [[mark:t-before]] code မရေးခင်မှာ ပြဿနာကို အရင် နားလည်အောင် လုပ်ရပါတယ်။
      ပြီးတော့ ဘာဆောက်မလဲ၊ ဘာ မဆောက်ဘူးလဲ ဆုံးဖြတ်ပြီး၊ အပိုင်းတွေ ဘယ်လို ချိတ်မလဲ ဆိုတဲ့ design ကို
      ဆွဲရပါတယ်။ အဲဒီ ဆုံးဖြတ်ချက်တွေကို လူတွေအတွက်ရော agent အတွက်ပါ ရှင်းရှင်းလင်းလင်း ရေးပြီး ပြောပြရပါတယ်။ [[mark:t-build]] အဲဒီနောက်မှ code ရေးပြီး တည်ဆောက်တဲ့ build အဆင့်ကို ရောက်ပါတယ်။
      [[mark:t-after]] build ပြီးရုံနဲ့ အလုပ် မပြီးသေးပါဘူး။ ထွက်လာတာ မှန်မမှန် စစ်ရပါတယ်။ ပြီးရင် customer တွေ
      တကယ် သုံးလို့ရအောင် ထုတ်ပေးရပါတယ်၊ ဒါကို ship လုပ်တယ်လို့ ခေါ်ပါတယ်။ ship လုပ်ပြီးနောက်လည်း app က ဆက်
      အလုပ်လုပ်နေအောင် run ထားပြီး စောင့်ကြည့်ရပါတယ်။
      [[mark:t-se]] ဒီ အလုပ် တစ်ခုလုံးကို software engineering လို့ ခေါ်ပါတယ်။ ဆိုလိုတာက ပြဿနာကို
      နားလည်တာကနေ app က user လက်ထဲ ရောက်ပြီး ဆက် run နေတဲ့အထိ software ကို တည်ဆောက်တဲ့ အလုပ်ပါ။ software
      engineer တစ်ယောက် ဘာတွေ သိထားရမလဲ ဆိုတာကို ပညာရှင်တွေ စုရေးထားတဲ့ စာတမ်း တစ်ခုမှာ နယ်ပယ် ၁၈ ခု
      ပါပြီး၊ code ရေးတာက အဲဒီထဲက နယ်ပယ် တစ်ခုပဲ ဖြစ်ပါတယ်။ ကျန်တဲ့ နယ်ပယ်တွေက requirement၊ design၊ test၊ security၊ ကုန်ကျစရိတ် စတာတွေပါ။
    sources:
      - {
          title: "Software Engineering Body of Knowledge (SWEBOK), IEEE Computer Society",
          url: "https://www.computer.org/education/bodies-of-knowledge/software-engineering",
        }
      - {
          title: "The New SDLC (Burmese edition): Introduction",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "The New SDLC (Burmese edition): The new SDLC",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: draw-t-title,
          type: whiteboard.apply,
          at: { mark: t-title },
          clear: true,
          upsertIds: [t-title],
        }
      - {
          id: draw-t-before,
          type: whiteboard.apply,
          at: { mark: t-before },
          upsertIds: [t-h-before, t-box-before, t-1, t-2, t-3],
          drawMs: 2400,
        }
      - {
          id: draw-t-build,
          type: whiteboard.apply,
          at: { mark: t-build },
          upsertIds: [t-a1, t-box-build, t-4],
          drawMs: 1200,
        }
      - {
          id: draw-t-after,
          type: whiteboard.apply,
          at: { mark: t-after },
          upsertIds: [t-a2, t-h-after, t-box-after, t-5, t-6, t-7],
          drawMs: 2600,
        }

  - id: app
    chapter: App ကို စမ်းကြည့်ရအောင်
    narration: >
      [[mark:ready]] ကဲ၊ app ကို ကြည့်ရအောင်။ ညာဘက်မှာ ကြိုမှာ app ကို မြင်ရပါပြီ။ ဒီ app က agent တစ်ခု
      ထုတ်ပေးတဲ့ ပထမ version လို့ သဘောထားပြီး lesson အတွက် ပြင်ဆင်ထားတာပါ။ [[mark:menu]] form မှာ ဘာမှာမလဲ၊
      ဘယ်နှခု မှာမလဲ၊ ဘယ်အချိန် လာယူမလဲ ရွေးပြီး၊ နာမည်နဲ့ ဖုန်းနံပါတ် ထည့်ရပါတယ်။ အောင်အောင် မနက်တိုင်း
      မှာနေကျ အော်ဒါအတိုင်း မှာကြည့်ရအောင်။ လက်ဖက်ရည် က ရွေးပြီးသား ဖြစ်နေပါတယ်။ [[mark:qty]] အရေအတွက်မှာ နှစ်ခွက်လို့ ထည့်ပါမယ်။
      [[mark:time]] လာယူမယ့် အချိန်ကို မနက် ရှစ်နာရီခွဲ လို့ ရွေးပါမယ်။ [[mark:name]] နာမည်နေရာမှာ အောင်အောင် လို့ ရိုက်ပါမယ်။
      [[mark:phone]] ဖုန်းနံပါတ်ကတော့ lesson အတွက် နမူနာ နံပါတ် တစ်ခု ထည့်ပါမယ်။ [[mark:order]] ပြီးရင် မှာမယ် ကို
      နှိပ်လိုက်ပါမယ်။ [[mark:card]] အော်ဒါနံပါတ် ၁၀၁ ရပါပြီ။ လက်ဖက်ရည် နှစ်ခွက်၊ စုစုပေါင်း ၃၀၀၀ ကျပ်၊ လာယူချိန်
      ရှစ်နာရီခွဲ ဆိုပြီး မှန်မှန် ပြနေပါတယ်။ ဒီလို app သေးသေးလေး မျိုးကို agent တစ်ခုက မိနစ်ပိုင်းအတွင်း
      ထုတ်ပေးနိုင်တာ တကယ် အသုံးဝင်ပါတယ်။ ဒါပေမဲ့ ဒီ app ပြီးပြီလို့ ပြောလို့ ရပြီလား။
    sources:
      - {
          title: "The New SDLC (Burmese edition): From syntax to intent",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "The New SDLC (Burmese edition): The new SDLC",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: close-board-t,
          type: whiteboard.apply,
          at: { scene: start, offsetMs: -400 },
          open: false,
        }
      - {
          id: wait-ready,
          type: runtime.waitForReady,
          at: { mark: ready },
          timeoutMs: 30000,
          retry: { maxAttempts: 2, delayMs: 250 },
        }
      - {
          id: open-preview,
          type: preview.open,
          at: { afterAction: wait-ready },
          timeoutMs: 10000,
          mode: docked,
          retry: { maxAttempts: 2, delayMs: 250 },
        }
      - {
          id: expect-menu,
          type: expect.preview,
          at: { mark: menu },
          timeoutMs: 5000,
          target: { by: testId, value: item },
          textContains: "လက်ဖက်ရည်",
          retry: { maxAttempts: 3, delayMs: 300 },
        }
      - {
          id: in-qty,
          type: preview.input,
          at: { mark: qty },
          timeoutMs: 5000,
          target: { by: testId, value: qty },
          value: "2",
          retry: { maxAttempts: 2, delayMs: 250 },
        }
      - {
          id: in-time,
          type: preview.input,
          at: { mark: time },
          timeoutMs: 5000,
          target: { by: testId, value: pickup },
          value: "08:30",
          retry: { maxAttempts: 2, delayMs: 250 },
        }
      - {
          id: in-name,
          type: preview.input,
          at: { mark: name },
          timeoutMs: 5000,
          target: { by: testId, value: name },
          value: "အောင်အောင်",
          retry: { maxAttempts: 2, delayMs: 250 },
        }
      - {
          id: in-phone,
          type: preview.input,
          at: { mark: phone },
          timeoutMs: 5000,
          target: { by: testId, value: phone },
          value: "09 000 111 222",
          retry: { maxAttempts: 2, delayMs: 250 },
        }
      - {
          id: click-order,
          type: preview.click,
          at: { mark: order },
          timeoutMs: 5000,
          target: { by: testId, value: order },
          retry: { maxAttempts: 1, delayMs: 0 },
        }
      - {
          id: expect-number,
          type: expect.preview,
          at: { mark: card },
          timeoutMs: 5000,
          target: { by: testId, value: result-number },
          textContains: "#101",
          retry: { maxAttempts: 3, delayMs: 300 },
        }
      - {
          id: expect-line,
          type: expect.preview,
          at: { afterAction: expect-number },
          timeoutMs: 5000,
          target: { by: testId, value: result-line },
          textContains: "လက်ဖက်ရည် × 2",
          retry: { maxAttempts: 3, delayMs: 300 },
        }
      - {
          id: expect-total,
          type: expect.preview,
          at: { afterAction: expect-line },
          timeoutMs: 5000,
          target: { by: testId, value: result-total },
          textContains: "3,000 ကျပ်",
          retry: { maxAttempts: 3, delayMs: 300 },
        }
      - {
          id: expect-pickup,
          type: expect.preview,
          at: { afterAction: expect-total },
          timeoutMs: 5000,
          target: { by: testId, value: result-pickup },
          textContains: "08:30",
          retry: { maxAttempts: 3, delayMs: 300 },
        }

  - id: doubt
    narration: >
      ပုံမှန် အော်ဒါ တစ်ခု မှန်တာနဲ့ app ပြီးပြီလို့ ပြောလို့ မရသေးပါဘူး။ တကယ့် customer တွေက
      ကိုယ် မမျှော်လင့်တာတွေကို ရိုက်ထည့်တတ်လို့ပါ။ ဥပမာ တစ်ခု စမ်းကြည့်ရအောင်။ [[mark:zero]] အရေအတွက်ကို
      သုည လို့ ပြောင်းလိုက်ပါမယ်။ [[mark:order-zero]] ပြီးတော့ မှာမယ် ကို ထပ်နှိပ်ပါမယ်။ [[mark:card-zero]] app
      က အော်ဒါနံပါတ် ၁၀၂ နဲ့ လက်ခံသွားပြီး၊ စုစုပေါင်း သုည ကျပ် လို့ ပြနေပါတယ်။ လက်ဖက်ရည် သုည ခွက်ကို ကြိုမှာလို့
      ရနေတာပါ။ ဒါ မှန်ရဲ့လား။ ဒီလို အော်ဒါ ရောက်လာရင် ကောင်တာက လှလှ ဘာလုပ်ရမလဲ။ ဒီမေးခွန်းကို app ကို
      ကြည့်ရုံနဲ့ ဖြေလို့ မရပါဘူး။ ဆိုင်ရဲ့ စည်းကမ်းကို ဆိုင်ပိုင်ရှင် နဲ့ တိုင်ပင်ပြီးမှ ဆုံးဖြတ်ရမှာပါ။ [[mark:open-notes]]
      ဒါကြောင့် အခု မပြင်သေးဘဲ၊ ဒီ သံသယကို notes ဖိုင်ထဲမှာ မှတ်ထားပါမယ်။ [[mark:type-doubt]] အလုပ်လုပ်သလို
      ပုံပေါ်တဲ့ app နဲ့ တကယ့် customer တွေအတွက် တကယ် အလုပ်ဖြစ်တဲ့ app က မတူပါဘူး။ အဲဒီ ကွာခြားချက်ကို
      ရှာတွေ့အောင် စမ်းပြီး၊ ဘယ်ဟာ မှန်လဲ ဆုံးဖြတ်ပေးတာက builder ရဲ့ အလုပ်ပါ။ ဒီ သံသယကိုတော့ နောက်ပိုင်း
      lesson တွေမှာ ဆက်ဖြေရှင်းသွားပါမယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): Conclusion",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: in-qty-0,
          type: preview.input,
          at: { mark: zero },
          timeoutMs: 5000,
          target: { by: testId, value: qty },
          value: "0",
          retry: { maxAttempts: 2, delayMs: 250 },
        }
      - {
          id: click-zero,
          type: preview.click,
          at: { mark: order-zero },
          timeoutMs: 5000,
          target: { by: testId, value: order },
          retry: { maxAttempts: 1, delayMs: 0 },
        }
      - {
          id: expect-zero,
          type: expect.preview,
          at: { mark: card-zero },
          timeoutMs: 5000,
          target: { by: testId, value: result-total },
          textContains: "စုစုပေါင်း 0 ကျပ်",
          retry: { maxAttempts: 3, delayMs: 300 },
        }
      - {
          id: expect-number-2,
          type: expect.preview,
          at: { afterAction: expect-zero },
          timeoutMs: 5000,
          target: { by: testId, value: result-number },
          textContains: "#102",
          retry: { maxAttempts: 3, delayMs: 300 },
        }
      - { id: open-notes, type: workspace.openFile, at: { mark: open-notes }, path: notes.md }
      - id: type-doubt
        type: editor.type
        at: { mark: type-doubt }
        target: { file: notes.md, after: "# Notes\n", occurrence: 1 }
        text: "\n## Lesson 01 · code က အဆင့် တစ်ဆင့်ပဲ\n- သံသယ — အရေအတွက် 0 နဲ့ မှာတော့ 0 ကျပ်နဲ့ လက်ခံသွားတယ်။ ဒါ မှန်ရဲ့လား။\n"
        cadence: line-by-line

  - id: bottleneck
    narration: >
      [[mark:t-reopen]] ခုနက အဆင့်တွေကို ပြန်ကြည့်ရအောင်။ [[mark:t-agent]] အရင်က code ရေးတဲ့ build အဆင့်က
      အချိန် အများကြီး ယူခဲ့ပါတယ်။ အခုတော့ အဲဒီ အဆင့်ကို agent က အများကြီး ပိုမြန်မြန် လုပ်ပေးနိုင်ပါပြီ။
      [[mark:t-intent]] ဒါပေမဲ့ ဘာကို ဆောက်ရမလဲ ဆိုတာ ကိုယ်က ရှင်းရှင်းလင်းလင်း မပြောနိုင်ရင်၊ agent က
      ကိုယ်ပြောတဲ့ စကားလုံးတွေကနေ ဖြစ်နိုင်လောက်တာကို ခန့်မှန်းပြီး ဆောက်ပေးမှာပါ။ ဒီလို ဘာလိုချင်လဲ၊ ဘာက
      မှန်လဲ ဆိုတဲ့ ရည်ရွယ်ချက်ကို intent လို့ ခေါ်ပါတယ်။ [[mark:t-verify]] ထွက်လာတာ မှန်မမှန် စစ်တာကိုတော့
      verification လို့ ခေါ်ပါတယ်။ ခုနက သုည ခွက် အော်ဒါလို ပြဿနာကို ကိုယ်တိုင် စမ်းမကြည့်ရင်၊ customer
      တွေ မသုံးခင် ဘယ်သူမှ သိမှာ မဟုတ်ပါဘူး။ ဆိုတော့ အရင်က အချိန် အကုန်ဆုံးက code ရေးတာ ဖြစ်ပေမယ့်၊ အခု
      အချိန်ယူရတဲ့ နေရာက intent နဲ့ verification ဘက်ကို ရွှေ့သွားပါပြီ။ [[mark:t-close]] ဒါကို notes ဖိုင်ထဲမှာ
      မှတ်ထားရအောင်။ [[mark:type-thesis]] build က agent ရဲ့ အလုပ် ဖြစ်လာပေမယ့်၊ intent နဲ့ verification
      ကတော့ ကိုယ့်တာဝန်ပဲ ဖြစ်ပါတယ်။ agent က ဘယ်လောက် ကောင်းတဲ့ tool ဖြစ်ဖြစ်၊ ဆိုင်ရဲ့ စည်းကမ်းကို သိတာ၊
      customer တွေရဲ့ မနက်ခင်းကို သိတာ၊ ပြီးတော့ ထွက်လာတာကို တာဝန်ယူတာက ကိုယ်ပါ။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The new SDLC",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "The New SDLC (Burmese edition): Conclusion",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - { id: reopen-t, type: whiteboard.apply, at: { mark: t-reopen }, open: true }
      - {
          id: draw-t-agent,
          type: whiteboard.apply,
          at: { mark: t-agent },
          upsertIds: [t-agent1, t-agent2],
          drawMs: 1000,
        }
      - {
          id: draw-t-intent,
          type: whiteboard.apply,
          at: { mark: t-intent },
          upsertIds: [t-intent, t-intent2],
          drawMs: 1200,
        }
      - {
          id: draw-t-verify,
          type: whiteboard.apply,
          at: { mark: t-verify },
          upsertIds: [t-verify, t-verify2],
          drawMs: 1200,
        }
      - { id: close-t, type: whiteboard.apply, at: { mark: t-close }, open: false }
      - id: type-thesis
        type: editor.type
        at: { mark: type-thesis }
        target: { file: notes.md, after: "ဒါ မှန်ရဲ့လား။\n", occurrence: 1 }
        text: "- build — agent က မြန်မြန် ထုတ်ပေး\n- intent — ဘာမှန်လဲ ကိုယ်က ဆုံးဖြတ်\n- verification — မှန်မမှန် ကိုယ်က စစ်\n"
        cadence: line-by-line
      - {
          id: expect-notes,
          type: expect.file,
          at: { afterAction: type-thesis },
          path: notes.md,
          contains: "- intent — ဘာမှန်လဲ ကိုယ်က ဆုံးဖြတ်",
        }

  - id: map
    chapter: Course ရဲ့ လမ်းကြောင်း
    narration: >
      [[mark:m-intro]] ဒါဆို ဒီ course မှာ ဘာတွေ လေ့လာမလဲ ကြည့်ရအောင်။ lesson ၃၂ ခုကို module လို့ ခေါ်တဲ့
      အပိုင်းကြီး ရှစ်ပိုင်း ခွဲထားပါတယ်။ [[mark:m1]] module တစ်မှာ agent တွေ ဘယ်လို အလုပ်လုပ်လဲ၊ task တစ်ခုကို ဘယ်လောက်
      စနစ်တကျ လုပ်ရမလဲ ဆိုတာနဲ့ builder ရဲ့ အလုပ်သစ်ကို နားလည်အောင် လုပ်ပါမယ်။ [[mark:m2]] module နှစ်မှာ
      ဘာမှ မဆောက်ခင် ပြဿနာ၊ requirement၊ scope နဲ့ ပုံမှန် မဟုတ်တဲ့ အခြေအနေတွေကို စဉ်းစားပါမယ်။ [[mark:m3]] module
      သုံးက ဆက်သွယ်ပြောဆိုတာပါ။ ပြီးပြီ ဆိုတာ ဘာလဲ ရေးတာ၊ agent ကို task အပ်တာ၊ ဆိုင်ပိုင်ရှင် နဲ့ လှလှ ကို အခြေအနေ
      ပြောပြတာတွေ ပါပါတယ်။ [[mark:m4]] module လေးမှာ အလုပ်ကို အပိုင်းလေးတွေ ခွဲတာ၊ app ရဲ့ အစိတ်အပိုင်းတွေ၊
      data နဲ့ ဆုံးဖြတ်ချက်တွေကို engineer လို တွေးတတ်အောင် လေ့ကျင့်ပါမယ်။ [[mark:m5]] module ငါးက code မဖတ်ဘဲ
      agent ရဲ့ အလုပ်ကို စစ်တာ၊ test လုပ်တာ၊ bug ရှာတာပါ။ [[mark:m6]] module ခြောက်မှာ app ကို ဘေးကင်းကင်း
      ship လုပ်တာ၊ run နေတဲ့ app ကို စောင့်ကြည့်တာနဲ့ ကုန်ကျစရိတ်ကို ကြည့်ပါမယ်။ [[mark:m7]] module ခုနစ်မှာ
      agent ပတ်လည်က rule တွေ၊ tool တွေကို product ထုတ်တဲ့ စက်ရုံ တစ်ခုလို စနစ်တကျ ဆောက်တာကို လေ့လာပါမယ်။
      [[mark:m8]] နောက်ဆုံး module မှာတော့ တကယ့် customer တွေ သုံးပြီးနောက် သူတို့ဆီက သင်ယူတာနဲ့၊ ကိုယ့်
      project ကို ဘယ်လို စမလဲ ဆိုတာနဲ့ အဆုံးသတ်ပါမယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): Introduction",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
