  - id: top-ups
    chapter: CPU မဟုတ်ဘဲ top-up နဲ့ တွက်
    narration: >
      [[mark:close-b1]] [[mark:show-p03]] forecast ကို CPU တွေ၊ request တွေနဲ့ မတွက်ဘဲ top-up နဲ့ တွက်ပါတယ်၊ request ထဲမှာ retry တွေ ရောနေတတ်ပြီး product နဲ့ finance အဖွဲ့ကလည်း top-up ဆိုမှ နားလည်လို့ပါ။ top-up ၁၀၀၀ ခုအတွက် cloud ကို ကျပ် ဘယ်လောက် ပေးရလဲ ဆိုတဲ့ အချိုးကိုလည်း ကြည့်ပါတယ်။
      [[mark:show-p03b]] top-up အရေအတွက် မတက်ဘဲ ဒီ အချိုး ခုန်တက်ရင် regression တစ်ခုက capacity ကို စားနေတာပါ။ ဥပမာ app version အသစ်က status ကို ပိုခဏခဏ မေးလာလို့ အချိုး ၃၀ ရာခိုင်နှုန်း ခုန်တက်တာကို alert က ဖမ်းမိလို့ သင်္ကြန် မတိုင်ခင် ပြင်လိုက်ပါတယ်။
      [[mark:show-p03c]] ဒါပေမဲ့ forecast က လိုချင်သမျှ ပါတဲ့ wish list ပါ။ supply နဲ့ budget ထဲမှာ တကယ် ဝယ်မယ်လို့ သဘောတူထားတာကတော့ plan of record ပါ၊ provider က လိုတာရဲ့ ၈၀ ရာခိုင်နှုန်းပဲ အချိန်မီ ပေးနိုင်လို့ plan က ပိုနည်းပါတယ်။ ကွာဟချက်ကို ဆုံးရှုံးနိုင်တဲ့ top-up နဲ့ တွက်ပြတော့ business က rewards screen လို အပိုတွေကို ညသန်းခေါင်မှာ ခဏ ပိတ်ဖို့ ကြိုဆုံးဖြတ်ပါတယ်။
      [[mark:show-p03d]] supply ဘက်မှာလည်း ဘယ်နေရာမှာမဆို run လို့ရလား၊ lesson ၄ က ပြည်တွင်း စည်းမျဉ်းလို တစ်ခုခုက နေရာ ကန့်သတ်ထားလား၊ lead time ဘယ်လောက်လဲ၊ ဘယ်အထိ တိုးပြီး ပြန်လျှော့နိုင်လဲ မေးရပြီး တစ်ရက်အတွင်း ရနိုင်တာနဲ့ အများဆုံး ရနိုင်တာကိုလည်း သိထားရပါမယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Capacity Planning (USENIX ;login:, Feb 2015)",
          url: "https://www.usenix.org/publications/login/feb15/capacity-planning",
        }
    actions:
