  - id: zone-arithmetic
    chapter: Zone တစ်ခု ပျက်ရင်
    narration: >
      [[mark:close-p03d]] [[mark:b2-s1]] Wallet က zone သုံးခုထဲက နှစ်ခုမှာပဲ instance ၆ ခုစီ run ပြီး peak မှာ ၆၅ ရာခိုင်နှုန်းစီ သုံးနေပါတယ်။ zone တစ်ခုက ပြဿနာ တစ်ခုတည်းကြောင့် အတူတူ ပျက်နိုင်တဲ့ failure domain ပါ။ [[mark:b2-s1b]] ကိုဇော် တွက်ကြည့်တော့ zone တစ်ခု ပျက်ရင် ကျန်တဲ့ ၆ ခုက ၁၂ ခုစာ ထမ်းရလို့ ၁၃၀ ရာခိုင်နှုန်း ဖြစ်ပြီး ပြိုသွားမှာပါ။
      [[mark:b2-s2]] ဒါကြောင့် Wallet ကို zone သုံးခုလုံးမှာ instance ၅ ခုစီ ဖြန့်လိုက်ပါတယ်၊ ၃ ခုပဲ ထပ်တိုးရတာပါ။ [[mark:b2-s2b]] ပုံမှန်မှာ ၅၂ ရာခိုင်နှုန်းစီပဲ သုံးပြီး zone တစ်ခု ပျက်ရင်တောင် ကျန်တဲ့ ၁၀ ခုက ၇၈ ရာခိုင်နှုန်းနဲ့ ခံနိုင်ပါတယ်။
      [[mark:b2-s3]] zone နှစ်ခုတည်းဆိုရင် failover ဖြစ်တဲ့အခါ ကျန်တဲ့ zone က database connection တွေပါ နှစ်ဆ ဖြစ်တတ်ပါတယ်။ [[mark:b2-s3b]] ဒါကြောင့် ကျန်တဲ့ zone တွေမှာရော database မှာပါ load ကို ခံနိုင်လောက်တဲ့ နေရာ ကြိုထားရပါမယ်။
      [[mark:b2-s4]] failover လုပ်ဖို့ သုံးမယ့် console နဲ့ scaling API ကိုယ်တိုင်ကလည်း ပျက်တဲ့ zone ထဲမှာ ရှိနေနိုင်ပါတယ်။ ဒါကြောင့် traffic လွှဲတဲ့ drain အဆင့်တွေကို playbook ထဲ ရေးပြီး သင်္ကြန် မတိုင်ခင် တကယ် လေ့ကျင့်ထားပါတယ်။
      [[mark:b2-s5]] cloud ကလည်း အကန့်အသတ်မဲ့ မဟုတ်ပါဘူး၊ သင်္ကြန်ညမှာ တခြား ကုမ္ပဏီတွေလည်း တစ်ပြိုင်နက် စက် တောင်းကြမှာမို့ autoscaling ကို အားမကိုးဘဲ ကြိုငှားထားပါတယ်။ [[mark:b2-s5b]] စည်းမျဉ်းကတော့ test ကလွဲရင် ဘယ် service မှ zone တစ်ခုတည်းမှာ မ run ရပါဘူး။
    sources:
