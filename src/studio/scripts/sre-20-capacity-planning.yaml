    files:
      notes.md: |
        # Capacity ဘယ်လောက် လိုမလဲ

        - forecast range — demand ကို ဂဏန်း တစ်ခု မဟုတ်ဘဲ အနိမ့်ကနေ အမြင့်အထိ ခန့်မှန်း
        - plan of record — wish list မဟုတ်၊ တကယ် ဝယ်မယ့် capacity အစီအစဉ်
        - ကျန်တဲ့ zone တွေမှာ နေရာ ကြိုထား — zone တစ်ခု ပျက်ရင် ကျန်တာတွေ load ကို ခံနိုင်ရမယ်
        - peak of sums — ပေါင်းထားတဲ့ traffic ရဲ့ peak၊ peak တွေ ပေါင်းတာထက် နည်း
        - utilization — ပေးရတဲ့ resource ထဲက တကယ် သုံးနေတဲ့ ရာခိုင်နှုန်း
        - degradation profile — load ဘယ်လောက်မှာ ဘာ ပိတ်မလဲ၊ ဘာ ဘယ်တော့မှ မပိတ်ဘူးလဲ

        မေးခွန်း: zone 2 ခု၊ instance 12 ခု၊ 60% စီ။ zone တစ်ခု ပျက်ရင် ကျန်တဲ့ instance တွေက ဘယ်လောက် ထမ်းရမလဲ?
