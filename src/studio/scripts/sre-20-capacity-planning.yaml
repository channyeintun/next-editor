build:
  # Studio swaps in the Burmese voice chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 2620

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: hook
    chapter: သင်္ကြန် ရောက်ဖို့ ခြောက်ပတ်
    narration: >
      [[mark:show-p01]] ခေါ်သုံးတဲ့ service တိုင်းက version အလိုက် ကိန်းဂဏန်းကို မြင်ရပြီး loyalty fault test ကိုလည်း ညတိုင်း run ပါတယ်။ အခု သင်္ကြန် ရောက်ဖို့ ခြောက်ပတ်ပဲ လိုပါတော့တယ်။ ပြီးခဲ့တဲ့ နှစ်က ညသန်းခေါင်မှာ တစ်စက္ကန့်ကို request ၃၀၀၀ အတွက်ပဲ တည်ဆောက်ထားတဲ့ Top-up ဆီ ၂၀၀၀၀ လောက် ဝင်လာခဲ့ပြီး အများစုက retry တွေပါ။
      တချို့က server ကို ခုနစ်ဆ တိုးချင်ပေမဲ့ finance အဖွဲ့က ပွဲရက် အနည်းငယ်အတွက် ဒီလောက် ငွေ မသုံးချင်ပါဘူး။ ဒီနှစ်အတွက် ဘယ်လောက်အထိ ပြင်ဆင်ထားရမလဲ?
      [[mark:show-p01b]] ဒီ မေးခွန်းကို ဖြေဖို့ user တွေ လိုချင်မယ့် အလုပ်ပမာဏ၊ demand နဲ့ ကိုယ် ပေးနိုင်တဲ့ resource၊ supply ကို ချိန်ပြီး မလောက်ရင် risk ဘယ်လောက် လက်ခံမလဲ ဆုံးဖြတ်ရပါတယ်၊ ဒီလို ကြိုပြင်ဆင်တာက capacity planning ပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Capacity Planning (USENIX ;login:, Feb 2015)",
          url: "https://www.usenix.org/publications/login/feb15/capacity-planning",
        }
    actions:
      # -1750 / -1450, as in Module 1: a pull-back over 1780 ms pushes the first dialog
      # past the 2 s opening handle, which src/studio/plans/index.test.ts rejects.
      - { id: collapse-dock, type: runtime.collapseDock, at: { scene: start, offsetMs: -1750 } }
      - {
          id: show-p01,
          type: slide.show,
          at: { mark: show-p01, offsetMs: -1450 },
          slideId: l20-p01,
        }
      - { id: show-p01b, type: slide.show, at: { mark: show-p01b }, slideId: l20-p01b }

  - id: worth-it
    chapter: Plan လုပ်ဖို့ တန်လား
    narration: >
      [[mark:show-p02]] ဒါပေမဲ့ လေးယောက်ပဲ ရှိတဲ့ မသီရိရဲ့ အဖွဲ့က service တိုင်းကို plan မလုပ်နိုင်လို့ တန်မတန် အရင် မေးရပါတယ်။ ဥပမာ support အဖွဲ့ရဲ့ admin tool လို သေးပြီး ခဏ နှေးလည်း ရတဲ့ service မှာ autoscaling နဲ့ အပို နည်းနည်း ထားတာက engineer အချိန်ထက် သက်သာပါတယ်။ Wallet နဲ့ Top-up လို ကြီးပြီး ငွေနဲ့ ဆိုင်တဲ့ service တွေကတော့ ကြို plan လုပ်ရပါမယ်။
      [[mark:show-p02b]] capacity ဆုံးဖြတ်ချက်တိုင်းမှာ မြန်တာ၊ ဈေးသက်သာတာ၊ မပျက်တာ ဆိုတဲ့ သုံးခုကို ချိန်ရပြီး ဘယ်လို ချိန်မလဲ ဆိုတာကို engineer အကြိုက်နဲ့ မဟုတ်ဘဲ business က ဆုံးဖြတ်ပါတယ်။ spike တိုင်းအတွက် စက်တွေကို အမြဲ ပိုထားရင် ငွေ အလဟဿ ဖြစ်မှာမို့ lesson ၆ မှာ SLO ရဲ့ ပျက်ခွင့်၊ error budget ကို သဘောတူခဲ့သလိုပဲ capacity မလောက်မယ့် risk ကိုလည်း တမင် ရွေးရပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Kubernetes: Autoscaling Workloads",
          url: "https://kubernetes.io/docs/concepts/workloads/autoscaling/",
        }
      - {
          title: "Capacity Planning (USENIX ;login:, Feb 2015)",
          url: "https://www.usenix.org/publications/login/feb15/capacity-planning",
        }
    actions:
      - { id: show-p02, type: slide.show, at: { mark: show-p02 }, slideId: l20-p02 }
      - { id: show-p02b, type: slide.show, at: { mark: show-p02b }, slideId: l20-p02b }

  - id: forecast-fan
    chapter: Forecast ဆိုတာ range
    narration: >
      [[mark:close-p02b]] [[mark:b1-s1]] ဒါဆို Top-up မှာ ဘယ်လောက် လာမလဲ? အရင် data ကနေ ခန့်မှန်းတဲ့ forecast မှာ demand ကို သုံးမျိုး ခွဲကြည့်ပါတယ်။ ပထမက user အသစ်တွေကြောင့် တဖြည်းဖြည်း တက်တာမို့ ပြီးခဲ့တဲ့ သုံးလပတ် နှစ်ခုက တက်နှုန်းအတိုင်း ဆက်ဆွဲရုံပါပဲ။
      [[mark:b1-s2]] ဒုတိယက လစာထုတ်ရက်၊ သင်္ကြန်၊ operator promotion လို ကြိုသိတဲ့ event တွေမို့ ပြက္ခဒိန်ထဲ ချရေးထားရပါတယ်။ [[mark:b1-s2b]] bar တိုင်းမှာ အပြာက ဖြစ်နိုင်ဆုံး၊ ခရမ်းက ဖြစ်လာနိုင်တဲ့ အမြင့်ဆုံးပါ၊ ဝေးဝေး ကြည့်လေ မသေချာလေမို့ ခရမ်းက ရှည်လာပါတယ်။ ဒီလို ဂဏန်း တစ်ခုတည်း မပေးဘဲ ခန့်မှန်းတာကို forecast range လို့ ခေါ်ပါတယ်။
      [[mark:b1-s3]] ပြီးခဲ့တဲ့ နှစ်ရဲ့ forecast ကို တကယ် ဖြစ်ခဲ့တာနဲ့ ပြန်တိုက်ကြည့်တော့ သင်္ကြန်ညရဲ့ top-up အရေအတွက်ကို ပုံမှန် peak ရဲ့ ၂ ဆလို့ ခန့်မှန်းခဲ့ပေမဲ့ တကယ်က ၂.၆ ဆ ဖြစ်ခဲ့ပါတယ်။ ဒါကြောင့် ငွေပေးချေတဲ့ လမ်းကြောင်းအတွက် range ရဲ့ အမြင့်ဘက်အထိ ပြင်ဆင်ပါတယ်။
      [[mark:b1-s4]] တတိယကတော့ တခြား wallet app တစ်ခု ပျက်သွားလို့ သူ့ user တွေ ရုတ်တရက် ပြောင်းလာတာလို ဘယ် forecast ကမှ မဖမ်းနိုင်တဲ့ အရာတွေပါ။ [[mark:b1-s4b]] ဒါတွေကို အပို capacity၊ buffer နဲ့ အရေးမကြီးတာ ပိတ်ပြီး demand လျှော့တာနဲ့ ရင်ဆိုင်ရပေမဲ့ ဘယ်အထိ ပြင်ဆင်မလဲ ကြိုသတ်မှတ်ရပါတယ်။ စက် မှာတာကနေ သုံးလို့ရတဲ့အထိ ကြာချိန်၊ lead time တိုတာကတော့ ပိုတိကျတဲ့ ခန့်မှန်းချက်ထက်တောင် တန်ဖိုးရှိပါတယ်။
    sources:
