# SRE from zero, lesson 20: Capacity planning (Burmese concept lesson).
#
# Built from the approved voice script
# docs/sre-course/voice-scripts/sre-20-capacity-planning.md. Every spoken
# character is that script's "> " lines, unchanged; each ⟪…⟫ marker became a
# [[mark:…]] at the same place. Check it with:
#   bun ~/Documents/sre-course/work/check-narration.ts \
#     docs/sre-course/voice-scripts/sre-20-capacity-planning.md \
#     src/studio/scripts/sre-20-capacity-planning.yaml
#
# Nothing runs: deck pages and the whiteboard carry the lesson, and notes.md is
# the recap. The workspace and runtime follow the validated no-code skeleton
# (WebContainer, empty init command, a harmless dev script).
#
# Ten marks that are not in the voice script add no spoken text and sit at an
# existing ။: b1-s2b, b1-s4b, b2-s1b, b2-s2b, b2-s3b, b2-s5b, b3-s2b and
# b3-s4b each start the second half of a board step on the sentence that names
# it, not seconds early with the step's first part (B1's violet "could be"
# extensions and their key, B1's buffer note, B2's struck zones with 130% and
# 78%, B2's green "reserve room" line and the rule line of its last note, B3's
# shared-pool bar and the spare-zone label), as lesson 16 lands B1's re-rank
# label; p04-pool splits l20_p04's narration at its paragraph break (one
# 479-character dialog would pass the 450-character limit; no action uses it);
# and ask-question makes the recap question its own dialog so the
# question-line select can hang off it for the ⟪pause 3s⟫, as in lesson 30.
# sel-question is the voice script's ⟪select မေးခွန်း⟫; it only splits the
# short lead-in from the question.
#
# Pacing: at 70 ms/char no page or board step holds longer than ~35 s (the
# longest is l20_p04, 35.0 s from its show, then the cover, l20_p01, 33.2 s;
# the longest board step is B3's shared pool, b3-s2b, 20.4 s), so the voice
# script's own markers and pacing pages (l20_p01b, l20_p02b, l20_p03b-d,
# l20_p05b-c, l20_p06b) carry it and nothing was added for pacing.
#
# A board followed by a deck page closes the panel (open: false) 400 ms before
# the page, and a deck page followed by a board closes the page 400 ms before,
# as in Module 1. ⟪close board⟫ straight into the next board (scene 6) wipes the
# open board 400 ms early (whiteboard.apply clear) instead of closing the
# panel, so the editor does not flash between two boards, as in lesson 16; the
# next board then draws with open: true, clear: true as usual.
#
# Boards (B1 P5 bars, B2 two rows of zones, B3 P6 lanes). Colour jobs:
# #1e1e1e ink (paints white) for the title, the axis, B1's axis labels and B3's
# day tracks; blue the thing named and the main data series (past and likely
# demand, Wallet's zones, instances and their row labels, the three teams and
# their peaks, the separate total, the utilization formula); violet the second
# series and the result (the "could be" extensions, the shared pool); green
# healthy (the 78% that holds, the room kept in the surviving zones); red
# failure (the surprise bar and its note, the struck zones and 130%, "nothing
# left"); orange the caveat or limit (last year's 2× forecast against 2.6×,
# doubled database connections, the drain and reservation notes, the spare
# zone kept idle). A label on two lines is one text asset per line, so each
# line meets the 0.55 em width rule on its own; every label was also measured
# in Chrome with Excalidraw's Virgil font and fits its box. B1's two notes are
# set on two lines where the voice script gives one: the orange note breaks
# after "ပြီးခဲ့တဲ့နှစ်:" so it sits above the Thingyan bar (one line needs
# 601 px under the 0.55 rule), and "buffer + demand လျှော့" sits under the
# surprise bar as "buffer +" / "demand လျှော့" instead of running 340 px left
# under the forecast bars. B2's last note, which the voice script asks for on
# two lines, breaks at its " · ", which the line break replaces. On B1 the
# past-quarters and Thingyan labels sit under the axis like a chart's
# categories, the surprise bar's name above that bar, and a colour key for
# blue and violet at the top right; B2 draws each zone's instances as small
# squares, one row per zone, so a strike runs through them, and puts the
# doubled database connections beside the two-zone row they belong to. Each
# B3 lane is a day from 06:00 to 06:00 (unlabelled), so the three peaks
# (12:00, 19:00, 00:00) fall at different places along their tracks, left to
# right.
#
# Deck pages: deck "Next Editor · SRE 5B · Capacity and data". deckUrl is the
# deck's published /pub link; until this lesson's pages are built from the
# page plan, the Director reports the l20 pages missing from the published
# deck. Page plan:
# ~/Documents/sre-course/work/pages/sre-20-capacity-planning.json
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/sre-20-capacity-planning.yaml
#   bun scripts/studio-compile-check.ts src/studio/scripts/sre-20-capacity-planning.yaml
