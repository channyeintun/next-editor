  - id: peak-of-sums
    chapter: Pool တစ်ခုတည်း မျှသုံး
    narration: >
      [[mark:close-b2]] [[mark:b3-s1]] ပြင်ဆင်ရင်း မသီရိ တွေ့တာက အဖွဲ့တိုင်း ကိုယ့် peak အတွက် server တွေကို သီးသန့် ကြိုငှားထားတာပါ၊ Wallet ၂၀၊ Eats ၃၀၊ Top-up ၁၅ လုံးပါ။ ဒါပေမဲ့ Wallet က နေ့လယ် ၁၂ နာရီ၊ Eats က ည ၇ နာရီ၊ Top-up က ညသန်းခေါင်မှာ peak ရောက်ပါတယ်။
      [[mark:b3-s2]] peak တွေကို ပေါင်းရင် ၆၅ လုံးဖြစ်ပြီး ဒါကို sum of peaks လို့ ခေါ်ပါတယ်။ [[mark:b3-s2b]] traffic ကို အချိန်အလိုက် ပေါင်းပြီးမှ ကြည့်ရင်တော့ အမြင့်ဆုံး အချိန်မှာတောင် ၄၀ လုံးပဲ လိုပြီး ဒါက peak of sums ပါ။ ဒါကြောင့် pool တစ်ခုကို မျှသုံးပြီး buffer ထည့်ရင် ၄၆ လုံးလောက်နဲ့ လုံလောက်ပါတယ်၊ အဖွဲ့တစ်ခုစီ သုံးခွင့်ရှိတဲ့ အများဆုံး ပမာဏ၊ quota ကိုတော့ pool ထဲကနေ ခွဲပေးပါတယ်။
      [[mark:b3-s3]] ဒါပေမဲ့ အဖွဲ့အားလုံး တစ်ပြိုင်နက် ပိုတောင်းရင် pool ထဲမှာ ဘာမှ မကျန်တော့ပါဘူး။ ဒါကြောင့် peak တွေ ထပ်နိုင်တဲ့ သင်္ကြန်ညကိုတော့ သီးသန့် event အဖြစ် plan လုပ်ပါတယ်။
      [[mark:b3-s4]] ပေးရတဲ့ resource ထဲက တကယ် သုံးတဲ့ ရာခိုင်နှုန်း၊ utilization ကို ပေးရတာ လျှော့ပြီးဖြစ်စေ၊ အသုံးဝင်တဲ့ အလုပ် ပိုလုပ်ပြီးဖြစ်စေ မြှင့်နိုင်ပါတယ်။ [[mark:b3-s4b]] ဒါပေမဲ့ zone အပိုနဲ့ database ရဲ့ အရန် replica လို စက်တွေက တမင် အားနေအောင် ထားတာပါ၊ utilization လှအောင် အဲဒါတွေကိုပါ ဖြည့်ပစ်ရင် တကယ် ပျက်တဲ့နေ့ ခံစရာ မကျန်တော့ပါဘူး။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Capacity Planning (USENIX ;login:, Feb 2015)",
          url: "https://www.usenix.org/publications/login/feb15/capacity-planning",
        }
      - { title: "Workbook: Managing Load", url: "https://sre.google/workbook/managing-load/" }
    actions:
      # ⟪close board⟫ into the next board: wipe B2 400 ms early, keep the panel open.
      - {
          id: close-b2,
          type: whiteboard.apply,
          at: { mark: close-b2, offsetMs: -400 },
          clear: true,
        }
      - id: b3-s1
        type: whiteboard.apply
        at: { mark: b3-s1 }
        open: true
        clear: true
        upsertIds:
          [
            l20-b3-l1-t,
            l20-b3-l1,
            l20-b3-l1-peak,
            l20-b3-l2-t,
            l20-b3-l2,
            l20-b3-l2-peak,
            l20-b3-l3-t,
            l20-b3-l3,
            l20-b3-l3-peak,
          ]
        drawMs: 2600
      # The separate total with "sum of peaks"; the shared pool (b3-s2b) with
      # "peak of sums".
      - id: b3-s2
        type: whiteboard.apply
        at: { mark: b3-s2 }
        upsertIds: [l20-b3-sep, l20-b3-sep-t]
        drawMs: 1200
      - id: b3-s2b
        type: whiteboard.apply
        at: { mark: b3-s2b }
        upsertIds: [l20-b3-pool, l20-b3-buf, l20-b3-pool-t]
        drawMs: 1500
      - id: b3-s3
        type: whiteboard.apply
        at: { mark: b3-s3 }
        upsertIds: [l20-b3-claim]
        drawMs: 1200
      - id: b3-s4
        type: whiteboard.apply
        at: { mark: b3-s4 }
        upsertIds: [l20-b3-util]
        drawMs: 1200
      - id: b3-s4b
        type: whiteboard.apply
        at: { mark: b3-s4b }
        upsertIds: [l20-b3-spare]
        drawMs: 1000

  - id: batch-and-payments
    narration: >
      [[mark:close-b3]] [[mark:show-p04]] pool ကို မျှသုံးရင် settlement report ထုတ်တဲ့ job တွေက ငွေပေးချေမှုကို မနှေးစေဖို့လည်း စီစဉ်ရပါတယ်။ report တွေကို ဈေးပေါတဲ့ သီးခြား စက်တွေပေါ် ထားရင် ရိုးရှင်းပြီး အာမခံချက် ခိုင်ပေမဲ့ စက် ထပ်ပေးရလို့ ပိုကုန်ပါတယ်။
      [[mark:p04-pool]] pool တစ်ခုတည်းမှာ ဦးစားပေး label တပ်ပြီး ငွေပေးချေမှုကို အမြဲ အရင် ဖြေရင်တော့ သက်သာပေမဲ့ label မှားရင် report တွေက ငွေပေးချေမှုကို နှေးစေနိုင်ပါတယ်။ Padauk ကတော့ lesson ၄ ကတည်းက settlement job တွေကို provider က ပြန်ယူနိုင်တဲ့ spot instance ပေါ်မှာ ခွဲ run နေပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book, 1st ed: Handling Overload",
          url: "https://sre.google/sre-book/handling-overload/",
        }
      - { title: "Workbook: Managing Load", url: "https://sre.google/workbook/managing-load/" }
    actions:
      - {
          id: close-b3,
          type: whiteboard.apply,
          at: { mark: close-b3, offsetMs: -400 },
          open: false,
        }
      - { id: show-p04, type: slide.show, at: { mark: show-p04 }, slideId: l20-p04 }

  - id: degradation-profile
    chapter: Degradation profile
    narration: >
      [[mark:show-p05]] capacity မလောက်တဲ့ ညစာချိန်အတွက် Eats အဖွဲ့က load ဘယ်လောက် ရောက်ရင် ဘာကို အရင် ပိတ်မလဲ၊ ဘာကို ဘယ်တော့မှ မပိတ်ဘူးလဲ ကြိုရေးထားပါတယ်၊ ဒါကို degradation profile လို့ ခေါ်ပါတယ်။ capacity ရဲ့ ၁၀၀ ရာခိုင်နှုန်းမှာ နည်းနည်း နှေးတာကို လက်ခံပါတယ်၊ ၁၂၀ မှာ အကြံပြု menu လို အပိုတွေ ပိတ်ပြီး ၁၅၀ မှာ order အသစ်တွေကို တန်းစီ စောင့်ခိုင်းပါတယ်။ ငွေပေးချေမှုကိုတော့ ဘယ်တော့မှ မပျောက်စေရပါဘူး။
      [[mark:show-p05b]] ပြီးခဲ့တဲ့ သောကြာ ညစာချိန်မှာ load ၁၃၀ ရာခိုင်နှုန်း ရောက်တော့ အကြံပြု menu ပိတ်သွားပေမဲ့ order နဲ့ ငွေပေးချေမှု အားလုံး ပြီးခဲ့ပါတယ်။ request တိုင်းမှာ ဘယ်လောက် အရေးကြီးလဲ ဆိုတဲ့ label ပါလို့ ဝန်ပိုရင် အရင် ငြင်းလို့ရတဲ့ sheddable request တွေကိုပဲ ရွေးပိတ်နိုင်တာပါ။
      [[mark:show-p05c]] စက် ထပ်တိုးတာထက် demand လျှော့တာက ပိုသက်သာပေမဲ့ ငြင်းလိုက်တဲ့ request တိုင်းကို ရေတွက်ထားမှ မနှင်းက ဆုံးရှုံးတဲ့ အရောင်းကို တွက်ပြီး server ထပ်ငှားမလား ဆုံးဖြတ်နိုင်ပါတယ်။ capacity မလောက်တဲ့ incident အတွက် playbook ကိုလည်း ကြိုရေးထားပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Using load shedding to avoid overload (AWS Builders' Library)",
          url: "https://aws.amazon.com/builders-library/using-load-shedding-to-avoid-overload/",
        }
      - {
          title: "SRE book, 1st ed: Handling Overload",
          url: "https://sre.google/sre-book/handling-overload/",
        }
    actions:
      - { id: show-p05, type: slide.show, at: { mark: show-p05 }, slideId: l20-p05 }
      - { id: show-p05b, type: slide.show, at: { mark: show-p05b }, slideId: l20-p05b }
      - { id: show-p05c, type: slide.show, at: { mark: show-p05c }, slideId: l20-p05c }

  - id: real-cost
    chapter: တကယ့် ကုန်ကျစရိတ်
    narration: >
      [[mark:show-p06]] capacity ရဲ့ ကုန်ကျစရိတ်ကလည်း cloud bill တစ်ခုတည်း မဟုတ်ပါဘူး။ ကြိုငှားပြီး အားနေတဲ့ server တွေ၊ engineer တွေရဲ့ နာရီတွေ၊ မလောက်လို့ ဆုံးရှုံးတဲ့ order တွေကိုပါ ပေါင်းတွက်ရပါတယ်။
      [[mark:show-p06b]] ဒီတော့ Padauk က သင်္ကြန်အတွက် server ကို ခုနစ်ဆ မတိုးခဲ့ပါဘူး။ plan of record အတိုင်း ကြိုငှားတယ်၊ Wallet ကို zone သုံးခုလုံးမှာ ဖြန့်တယ်၊ အဖွဲ့တွေ pool တစ်ခုကို မျှသုံးတယ်၊ ကျော်လာရင် ဘာကို ပိတ်မလဲ degradation profile မှာ ရေးထားပါတယ်။ capacity planning ဆိုတာ risk ဘယ်လောက် ထမ်းမလဲ ရွေးတာမို့ failure ကိုလည်း ခဏခဏ စမ်းရပြီး product နဲ့ finance အဖွဲ့နဲ့ အတူ ဆုံးဖြတ်ရပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Capacity Planning (USENIX ;login:, Feb 2015)",
          url: "https://www.usenix.org/publications/login/feb15/capacity-planning",
        }
    actions:
      - { id: show-p06, type: slide.show, at: { mark: show-p06 }, slideId: l20-p06 }
      - { id: show-p06b, type: slide.show, at: { mark: show-p06b }, slideId: l20-p06b }

  - id: this-week
    narration: >
      [[mark:show-p07]] လစာထုတ်ရက်၊ ပွဲတော်၊ promotion လို ကိုယ့် peak ရက်တွေကို ဒီအပတ် ပြက္ခဒိန် တစ်ခုထဲ ချရေးပါ။ အမြင့်ဆုံး peak မှာ zone တစ်ခု ပျက်ရင် ကျန်တာတွေ ခံနိုင်လား တွက်ကြည့်ပါ။ ပြီးတော့ request ၁၀၀၀ ခုအတွက် cloud ကို ကျပ် ဘယ်လောက် ပေးရလဲ စပြီး မှတ်ထားပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Capacity Planning (USENIX ;login:, Feb 2015)",
          url: "https://www.usenix.org/publications/login/feb15/capacity-planning",
        }
      - { title: "Workbook: Managing Load", url: "https://sre.google/workbook/managing-load/" }
    actions:
      - { id: show-p07, type: slide.show, at: { mark: show-p07 }, slideId: l20-p07 }

  - id: recap
    narration: >
      [[mark:close-p07]] [[mark:open-notes]] သင်္ကြန် ပြင်ဆင်ရင်း သိခဲ့တာတွေပါ။ [[mark:sel-forecast-range]] forecast range က demand ကို ဂဏန်း တစ်ခုတည်းအစား အနိမ့်ကနေ အမြင့်အထိ ခန့်မှန်းတာ ဖြစ်ပြီး၊ [[mark:sel-plan-of-record]] plan of record က wish list မဟုတ်ဘဲ တကယ် ဝယ်မယ်လို့ သဘောတူထားတဲ့ အစီအစဉ်ပါ။ [[mark:sel-survivors]] zone တစ်ခု ပျက်ရင် ကျန်တဲ့ zone တွေ load ကို ခံနိုင်အောင် နေရာ ကြိုထားရပါမယ်။
      [[mark:sel-peak-of-sums]] peak of sums က ပေါင်းထားတဲ့ traffic ရဲ့ peak ဖြစ်လို့ peak တွေကို ပေါင်းတာထက် နည်းပါတယ်။ [[mark:sel-utilization]] utilization က ပေးရတဲ့ resource ထဲက တကယ် သုံးနေတဲ့ ရာခိုင်နှုန်းဖြစ်ပြီး၊ [[mark:sel-degradation]] degradation profile ကတော့ load ဘယ်လောက်မှာ ဘာကို ပိတ်မလဲ၊ ဘာကို ဘယ်တော့မှ မပိတ်ဘူးလဲ ကြိုရေးထားတာပါ။
      [[mark:sel-question]] ကိုဇော် တွက်ခဲ့တဲ့ ပုစ္ဆာကို ဂဏန်း ပြောင်းပြီး မေးပါမယ်။ [[mark:ask-question]] zone နှစ်ခုမှာ instance ၁၂ ခုက ၆၀ ရာခိုင်နှုန်းစီ သုံးနေတုန်း zone တစ်ခု ပျက်သွားရင် ကျန်တဲ့ instance တွေက load ဘယ်လောက် ထမ်းရမလဲ?
      [[mark:pause-question]] ကျန်တဲ့ ၆ ခုက ၁၂ ခုစာ ထမ်းရလို့ ၁၂၀ ရာခိုင်နှုန်းပါ။ သင်္ကြန် ပြင်ဆင်နေတုန်းမှာပဲ မစုရဲ့ support အဖွဲ့ဆီ user တစ်ယောက်က သူ့ account ကို ဖျက်ပေးပါလို့ တောင်းဆိုလာပါတယ်။ သူ့ data တွေက တကယ်တော့ ဘယ်မှာ ရှိနေလဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Capacity Planning (USENIX ;login:, Feb 2015)",
          url: "https://www.usenix.org/publications/login/feb15/capacity-planning",
        }
      - {
          title: "Using load shedding to avoid overload (AWS Builders' Library)",
          url: "https://aws.amazon.com/builders-library/using-load-shedding-to-avoid-overload/",
        }
    actions:
      - { id: close-p07, type: slide.close, at: { mark: close-p07 } }
      - {
          id: open-notes,
          type: workspace.openFile,
          at: { mark: open-notes, offsetMs: 300 },
          path: notes.md,
        }
      - {
          id: sel-forecast-range,
          type: editor.select,
          at: { mark: sel-forecast-range },
          target: { file: notes.md, text: "forecast range", occurrence: 1 },
        }
      - {
          id: sel-plan-of-record,
          type: editor.select,
          at: { mark: sel-plan-of-record },
          target: { file: notes.md, text: "plan of record", occurrence: 1 },
        }
      - {
          id: sel-survivors,
          type: editor.select,
          at: { mark: sel-survivors },
          target: { file: notes.md, text: "ကျန်တဲ့ zone တွေမှာ နေရာ ကြိုထား", occurrence: 1 },
        }
      - {
          id: sel-peak-of-sums,
          type: editor.select,
          at: { mark: sel-peak-of-sums },
          target: { file: notes.md, text: "peak of sums", occurrence: 1 },
        }
      - {
          id: sel-utilization,
          type: editor.select,
          at: { mark: sel-utilization },
          target: { file: notes.md, text: "utilization", occurrence: 1 },
        }
      - {
          id: sel-degradation,
          type: editor.select,
          at: { mark: sel-degradation },
          target: { file: notes.md, text: "degradation profile", occurrence: 1 },
        }
      # The voice script's ⟪select မေးခွန်း⟫ and ⟪pause 3s⟫, the way the Module 1
      # reviewers fixed the pause. sel-question marks where the voice script puts
      # the select, but a select there would drag under the lead-in and the
      # question and leave no pause, and one at pause-question would drag under
      # the answer's first words (the scheduler holds only the dialog after its
      # anchor's). So the question-line select hangs off ask-question, one more
      # mark at an existing sentence end that makes the question its own dialog:
      # it starts about as the question ends, its drag runs in silence, and the
      # answer at pause-question waits for it. The question is 130 characters,
      # so 9500 (400 + 130 x 70) would start the drag as the question ends at
      # 70 ms per char, but anything above ~8920 trips compile-check's 2.5 s
      # inserted-silence warning at 55; 8890 leaves about 2.8 / 0.9 / 0.35 s of
      # quiet before the answer at 55 / 70 / 95 (at 70 the drag starts under the
      # question's last ~0.6 s, at 95 earlier, as in lessons 7, 10 and 30).
      - id: select-question
        type: editor.select
        at: { mark: ask-question, offsetMs: 8890 }
        target:
          file: notes.md
          text: "မေးခွန်း: zone 2 ခု၊ instance 12 ခု၊ 60% စီ။ zone တစ်ခု ပျက်ရင် ကျန်တဲ့ instance တွေက ဘယ်လောက် ထမ်းရမလဲ?"
          occurrence: 1

checks:
  # 500, not 300: google-svg deck pages stall the main thread at show/close.
  - { type: timing.p95Ms, max: 500 }
