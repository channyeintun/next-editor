  - id: fix
    chapter: လက်ရှိ period မှာ ပြင်မယ်
    narration: >-
      [[mark:open-main-3]] အခု မှန်တဲ့ နည်းနဲ့ ပြင်ရအောင်။ [[mark:type-fix]] reversal ကို November
      သုံးရက်နေ့စွဲနဲ့ post လုပ်ပြီး၊ မှန်တဲ့ ပမာဏ ယူရို ၁၀၀ ကို re-post လုပ်ပါတယ်။ နှစ်ခုလုံးက original
      ကို link လုပ်ထားပြီး၊ ledger က လက်မခံရင် program က ချက်ချင်း ရပ်ပါတယ်။ [[mark:run-4]] run
      လိုက်ရအောင်။ [[mark:pt-tx1]] original က October မှာ ယူရို ၁၀၀၀ အတိုင်း ကျန်နေပြီး၊ ဘယ်
      transaction တွေက သူ့ကို ပြင်လဲ ဆိုတာ ပြပါတယ်။ [[mark:pt-tx2-run]] reversal နဲ့ re-post က November
      မှာ ရှိပြီး original ကို ညွှန်ပါတယ်။ [[mark:pt-bal4]] ဒီနေ့ balance က ယူရို ၁၀၀ ဖြစ်သွားပါပြီ။
      [[mark:pt-oct4]] October ကုန်က balance ကတော့ report လုပ်ခဲ့တဲ့ အတိုင်းပါပဲ။ [[mark:dock-4]] ဘာမှားခဲ့လဲ၊
      ဘယ်တော့ ပြင်လဲ ဆိုတာ transaction သုံးခုလုံးနဲ့ history ထဲမှာ ကျန်ပါတယ်။
