  - id: interview
    chapter: Interview မှာ ဖြေမယ်ဆိုရင်
    narration: >-
      [[mark:show-iv]] Fintech interview တွေမှာ post လုပ်ပြီးသား entry မှားနေရင် ဘယ်လို ပြင်မလဲ လို့
      မေးလေ့ရှိပါတယ်။ UPDATE နဲ့ ပြင်မယ် လို့ ဖြေရင် history ကို ဖျက်ပစ်တဲ့ အဖြေ ဖြစ်သွားပါတယ်။ အချက် သုံးချက်နဲ့ ဖြေပါ။
      [[mark:iv-a]] ပထမ၊ fix forward ပါ။ original ကို မထိဘဲ compensating entry အသစ်နဲ့ ပြင်တယ်၊
      reversal နဲ့ re-post ဒါမှမဟုတ် ကွာတာကို correction လုပ်တယ် လို့ ပြောပါ။ [[mark:iv-b]] ဒုတိယ၊ entry
      အသစ်ကနေ original ကို link လုပ်ပြီး နောက်ပြန် link ကို lookup နဲ့ ရှာတယ်၊ ဒါမှ report က တကယ့်
      activity နဲ့ cleanup ကို ခွဲနိုင်တယ် လို့ ပြောပါ။ [[mark:iv-c]] တတိယ၊ ပိတ်ပြီးသား period ထဲကို
      backdate မလုပ်ဘဲ လက်ရှိ period မှာ book လုပ်ပြီး link နဲ့ ဘယ် period ကို ပြင်တာလဲ ဆိုတာ ပြတယ်။
      [[mark:iv-d]] ပြီးရင် ledger ရဲ့ API မှာ reverse နဲ့ correct ပဲ ရှိပြီး edit မရှိဘူး၊ chargeback လို
      အပြင်က လာတဲ့ reversal တွေလည်း ဒီလမ်းကြောင်းအတိုင်းပဲ သွားတယ် ဆိုတာ ဆက်ပြောပါ။
    sources:
