  - id: two
    chapter: Reversal လား correction လား
    narration: >-
      [[mark:show-two]] ပြင်နည်း နှစ်မျိုး ရှိပါတယ်။ ခုနက လုပ်ခဲ့တာက reverse လုပ်ပြီး re-post လုပ်တာပါ။
      [[mark:two-2]] နောက်တစ်နည်းက correction ပါ၊ adjustment လို့လည်း ခေါ်ပါတယ်။ မှတ်ခဲ့တာနဲ့
      မှန်ရမယ့် ပမာဏ ကွာတာ၊ ဒီမှာဆိုရင် ယူရို ၉၀၀ ကို entry တစ်ခုတည်းနဲ့ ပြန်နုတ်တာပါ။ balance ကတော့
      ယူရို ၁၀၀ အတူတူပါပဲ။ [[mark:two-3]] ကွာတာက ဒီလိုပါ။ reverse နဲ့ re-post မှာ entry ပိုများပေမဲ့
      record တစ်ခုစီက business event တစ်ခုလုံးကို ကိုယ်စားပြုပါတယ်၊ ဒါကြောင့် fee ဒါမှမဟုတ် limit လို
      transaction တစ်ခုချင်းပေါ် မူတည်တဲ့ တွက်ချက်မှုတွေကို ပြန်တွက်ဖို့ အဆင်ပြေပါတယ်။ [[mark:pt-rnote]]
      difference နဲ့ ပြင်ရင် entry နည်းပေမဲ့၊ ယူရို ၁၀၀ လို့ ရေးထားတဲ့ record တစ်ခုမှ မရှိပါဘူး။
    sources:
      - {
