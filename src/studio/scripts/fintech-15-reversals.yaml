  - id: try-it
    chapter: ကိုယ်တိုင် စမ်းကြည့်ပါ
    narration: >-
      [[mark:close-iv]] ကိုယ်တိုင် စမ်းကြည့်ဖို့ တစ်ခု ရှိပါတယ်။ [[mark:sel-try]] ဒီ line နှစ်ကြောင်းကို
      correction တစ်ခုတည်းနဲ့ အစားထိုးကြည့်ပါ။ reversal line ကို ဖျက်ပြီး၊ re-post line ရဲ့ memo ကို
      adjust လို့၊ ပမာဏကို အနုတ် ကိုးသောင်း ဆင့် လို့ ပြောင်းပြီး run ကြည့်ပါ။ transaction နှစ်ခုပဲ ကျန်ပြီး
      ဒီနေ့ balance က ယူရို ၁၀၀ အတိုင်း ဖြစ်ပါလိမ့်မယ်။ [[mark:recap]] ပြန်ချုပ်ရရင်၊ post လုပ်ပြီးသား
      entry ကို ဘယ်တော့မှ မပြင်ဘဲ link ပါတဲ့ entry အသစ်နဲ့ ပြင်ပြီး၊ ပိတ်ပြီးသား period ကို မထိဘဲ လက်ရှိ
      period မှာ book လုပ်ပါတယ်။ နောက် lesson မှာတော့ ဘယ်တော့မှ မဖျက်ရတဲ့ ledger နဲ့၊ user က ကိုယ့်
      data ကို ဖျက်ခိုင်းနိုင်တဲ့ GDPR ရဲ့ right to erasure ကို ဘယ်လို ညှိမလဲ ဆိုတာ ကြည့်ပါမယ်။
    sources:
