# Fintech Engineering, lesson 15: reversals and corrections (Burmese).
#
# Source: Fintech Engineering Handbook, "Reversals and corrections" and Appendix A (reversal /
# correction, write-off, chargeback) (CC BY 4.0, Voytek Pitula).
# Start state: ledger.go (Line, Tx with Value and Corrects, Ledger with Post, Close, BalanceAt —
# Close records the reported date but Post does not check it yet), corrections.go (Get,
# CorrectedBy, Reversal, Book), main.go books a 100.00 deposit as 1000.00 on 30 Oct, closes
# October and prints the transactions, today's balance and the Oct 31 balance against the reported one.
# Edits, all insert-only:
#   1. main.go: a reversal dated 30 Oct            -> run-2: accepted; Oct 31 balance 0.00 ≠ reported
#   2. ledger.go: Post refuses a closed period     -> run-3: "period closed through 2026-10-31"
#   3. main.go: reversal + re-post dated 3 Nov     -> run-4: three linked transactions, balance 100.00,
#                                                     Oct 31 still equal to what was reported
# Figures: forward (fixing forward with links), period (closed vs open period), two (reversal vs
# correction), report (what the link does for a report), iv.
# Built by ~/Documents/fintech-course-work/tools/build-lesson.ts; fixtures by sim-go.ts --write.
