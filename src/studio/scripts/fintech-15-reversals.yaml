  - id: report
    chapter: Link က report ကို ကယ်တယ်
    narration: >-
      [[mark:show-report]] ဘယ်နည်းပဲ သုံးသုံး link က မရှိမဖြစ်ပါ။ [[mark:pt-naive]] link မပါရင် November
      ရဲ့ report က deposit စုစုပေါင်းကို အနုတ် ယူရို ၉၀၀ လို့ ပြပါတယ်၊ November မှာ user တွေ ငွေ ပြန်ထုတ်သွားသလို
      ဖြစ်နေပါတယ်။ [[mark:report-2]] link ပါရင် November မှာ deposit အသစ် မရှိဘဲ၊ အနုတ် ယူရို ၉၀၀ က
      October ကို ပြင်တာ ဖြစ်ကြောင်း report က ခွဲပြနိုင်ပါတယ်။ တကယ့် activity နဲ့ cleanup ကို ခွဲပေးတာ
      link ပါ။ [[mark:chargeback]] ဒီ ပုံစံက ကိုယ့်အမှားအတွက်ပဲ မဟုတ်ပါဘူး။ chargeback ဆိုတာ cardholder
      ရဲ့ ဘဏ်က card payment ကို အတင်း ပြန်လှည့်တဲ့ reversal ပါ။ ရက်သတ္တပတ်တွေ ကြာမှ ရောက်လာတတ်လို့
      များသောအားဖြင့် deposit နဲ့ မတူတဲ့ period မှာ link ပါတဲ့ entry အသစ်အဖြစ် ဝင်ပြီး၊ user က ငွေ သုံးပြီးသွားရင် balance
      အနုတ် ဖြစ်သွားနိုင်ပါတယ်။ [[mark:writeoff]] ပြန်မရတော့ရင် write-off လုပ်ရတာလည်း ပြင်တာ မဟုတ်ဘဲ loss အဖြစ် book
      လုပ်တဲ့ entry အသစ်ပါ။ [[mark:principle]] ဒါက no invented data ဆိုတဲ့ မူပါ၊ ငွေကို မရှိဘဲ
      မဖန်တီးရဘူး ဆိုတာပါ။ မှားပြီး ပေါ်လာတဲ့ ငွေကို ဖျက်တာ မဟုတ်ဘဲ link ပါတဲ့ entry နဲ့ ချေပါတယ်။
