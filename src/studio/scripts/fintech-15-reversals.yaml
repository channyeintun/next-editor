build:
  voiceProfile:
    # Studio replaces this built-in profile at render time with the Burmese
    # provider chosen in the render console: AthanLab with the signed-in
    # user's own API key and voice, or VoxCPM2 when that private feature is
    # enabled.
    pocket-alba-v1
  seed: 9515

runtime:
  kind: go-playground
  defaultMode: fixture
  dockStartsCollapsed: true
  fixture:
    latencyMs: 600
    results:
      run-1:
        status: success
        exitCode: 0
        output: "tx-1 2026-10-30 deposit   1000.00\nbalance today: 1000.00\nOct 31 balance: 1000.00 reported: 1000.00\n"
      run-2:
        status: success
        exitCode: 0
        output: "reversal dated 2026-10-30: <nil>\ntx-1 2026-10-30 deposit   1000.00  corrected by tx-2\ntx-2 2026-10-30 reversal -1000.00  corrects tx-1\nbalance today: 0.00\nOct 31 balance: 0.00 reported: 1000.00\n"
      run-3:
        status: success
        exitCode: 0
        output: "reversal dated 2026-10-30: period closed through 2026-10-31\ntx-1 2026-10-30 deposit   1000.00\nbalance today: 1000.00\nOct 31 balance: 1000.00 reported: 1000.00\n"
      run-4:
        status: success
        exitCode: 0
        output: "reversal dated 2026-10-30: period closed through 2026-10-31\ntx-1 2026-10-30 deposit   1000.00  corrected by tx-2 tx-3\ntx-2 2026-11-03 reversal -1000.00  corrects tx-1\ntx-3 2026-11-03 re-post    100.00  corrects tx-1\nbalance today: 100.00\nOct 31 balance: 1000.00 reported: 1000.00\n"

scenes:
  - id: hook
    chapter: Post လုပ်ပြီးသား entry မှားနေရင်
    narration: >-
      user တစ်ယောက်က ယူရို ၁၀၀ သွင်းတာကို system က ယူရို ၁၀၀၀ လို့ book လုပ်မိတယ် ဆိုပါစို့။
      [[mark:sel-tx1]] ဒီ line က အဲဒီ deposit ပါ၊ ဆင့်နဲ့ ရေးထားတဲ့ ပမာဏမှာ သုည တစ်လုံး ပိုနေပါတယ်။
      [[mark:sel-close]] အောက်က line က October ကို ပိတ်လိုက်တာပါ၊ October ရဲ့ statement တွေ ပို့ပြီးသွားပြီ
      ဆိုတဲ့ အဓိပ္ပာယ်ပါ။ ပိတ်ခါနီးမှာ ledger ပြတဲ့ balance ကိုလည်း report လုပ်ပြီးသား တန်ဖိုးအဖြစ်
      မှတ်ထားပါတယ်။ [[mark:run-1]] run လိုက်ရအောင်။ [[mark:pt-bal1]] user ရဲ့ balance က ယူရို ၁၀၀၀
      ဖြစ်နေပါတယ်။ ဆိုလိုတာက ယူရို ၉၀၀ က ဘဏ်ထဲမှာ မရှိဘဲ ledger ထဲမှာပဲ ပေါ်လာတဲ့ ငွေပါ၊ user က
      ထုတ်ယူသွားရင် တကယ့် ငွေ ဆုံးပါပြီ။ [[mark:dock-1]] post လုပ်ပြီးသား entry ကို UPDATE နဲ့ ပြင်လို့
      မရတာ သိပြီးသားပါ။ ဒါဆို ဘယ်လို ပြင်မလဲ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Reversals and corrections (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#reversals-and-corrections",
        }
    actions:
      - { id: open-main, type: workspace.openFile, at: { scene: start }, path: main.go }
      - id: sel-tx1
        type: editor.select
        at: { mark: sel-tx1 }
        target:
          {
            file: main.go,
            text: 'must(l.Post(Book("tx-1", "deposit", 100000, oct30, "")))',
            occurrence: 1,
          }
      - id: sel-close
        type: editor.select
        at: { mark: sel-close }
        target:
          {
            file: main.go,
            text: "l.Close(oct31) // October's statements have been sent",
            occurrence: 1,
          }
      - { id: run-1, type: runtime.run, at: { mark: run-1, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-1,
          type: expect.output,
          at: { afterAction: run-1 },
          contains: "balance today: 1000.00",
          timeoutMs: 8000,
        }
      - id: pt-bal1
        type: console.point
        at: { mark: pt-bal1 }
        target: { text: "balance today: 1000.00", occurrence: 1 }
      - { id: dock-1, type: runtime.collapseDock, at: { mark: dock-1 } }
  - id: forward
    chapter: Fix forward
    narration: >-
      [[mark:show-forward]] အဖြေက fix forward ပါ။ အတိတ်ကို ပြန်မပြင်ဘဲ entry အသစ်တွေ ရှေ့ဆက်ရေးပြီး
      ပြင်တာပါ။ [[mark:pt-bal-1]] မှားနေတဲ့ entry ကို လုံးဝ မထိပါဘူး။ [[mark:forward-2]] ပထမ အဆင့်က
      reversal ပါ။ reversal ဆိုတာ original ရဲ့ line တိုင်းကို debit နဲ့ credit ဘက် လဲပြီး ပမာဏ အပြည့်
      ပြန်ချေတဲ့ transaction ပါ။ [[mark:pt-bal-2]] economically ကြည့်ရင် original မဖြစ်ခဲ့သလို balance
      သုည ပြန်ဖြစ်ပေမဲ့၊ transaction နှစ်ခုလုံး history ထဲမှာ မြင်နေရဆဲပါ။ [[mark:forward-3]] ပြီးမှ မှန်တဲ့
      ပမာဏ ယူရို ၁၀၀ နဲ့ re-post လုပ်ပါတယ်။ entry အသစ် နှစ်ခုလုံးက original ကို ညွှန်ထားပါတယ်။
      [[mark:forward-4]] link ကို နှစ်ဖက်လုံး ထားရပါမယ်။ ဒါပေမဲ့ original က immutable ဖြစ်လို့ သူ့ထဲကို
      corrected by ဆိုတဲ့ field နောက်မှ ဖြည့်လို့ မရပါဘူး။ ဒါကြောင့် entry အသစ်က link ကို သိမ်းပြီး၊
      နောက်ပြန် link ကိုတော့ ledger ထဲမှာ ရှာတာ၊ ဒါမှမဟုတ် append-only ဖြစ်တဲ့ link table တစ်ခုမှာ
      ထားတာပါ။
      [[mark:close-forward]] code မှာ ဒီ အဆင့်တွေကို function တွေအဖြစ် ရေးထားပါတယ်။ [[mark:open-corr]]
      ပြင်ဆင်မှုနဲ့ ဆိုင်တာတွေက သီးသန့် ဖိုင်မှာပါ။ [[mark:sel-swap]] reversal က original ရဲ့ line တိုင်းကို
      ယူပြီး debit နဲ့ credit ကို လဲထားပါတယ်။ ပမာဏကို အနုတ် မလုပ်ဘဲ ဘက် လဲတာက line တိုင်းကို
      အပေါင်း ပမာဏနဲ့ပဲ ထားချင်လို့ပါ။ [[mark:sel-link]] ပြီးတော့ original ရဲ့ id ကို ထည့်ပါတယ်၊ ဒါက ရှေ့ကို
      ညွှန်တဲ့ link ပါ။ [[mark:sel-back]] နောက်ပြန် link ကိုတော့ ledger ထဲမှာ ရှာပြီး ပြန်ပေးတာပါ၊ original
      ကို ဘယ်တော့မှ မပြင်ပါဘူး။
    sources:
      - {
          title: "Fintech Engineering Handbook — Reversals and corrections (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#reversals-and-corrections",
        }
      - {
          title: "Fintech Engineering Handbook — Principles (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#principles",
        }
    actions:
      - {
          id: show-forward,
          type: slide.show,
          at: { mark: show-forward, offsetMs: -700 },
          slideId: forward-1,
        }
      - { id: pt-bal-1, type: slide.point, at: { mark: pt-bal-1 }, target: { x: 0.175, y: 0.42 } }
      - { id: forward-2, type: slide.show, at: { mark: forward-2 }, slideId: forward-2 }
      - {
          id: pt-tx2,
          type: slide.point,
          at: { afterAction: forward-2 },
          target: { x: 0.513, y: 0.653 },
        }
      - { id: pt-bal-2, type: slide.point, at: { mark: pt-bal-2 }, target: { x: 0.077, y: 0.864 } }
      - { id: forward-3, type: slide.show, at: { mark: forward-3 }, slideId: forward-3 }
      - {
          id: pt-tx3,
          type: slide.point,
          at: { afterAction: forward-3 },
          target: { x: 0.825, y: 0.653 },
        }
      - { id: forward-4, type: slide.show, at: { mark: forward-4 }, slideId: forward-4 }
      - {
          id: pt-back,
          type: slide.point,
          at: { afterAction: forward-4 },
          target: { x: 0.72, y: 0.82 },
        }
      - { id: close-forward, type: slide.close, at: { mark: close-forward } }
      - { id: open-corr, type: workspace.openFile, at: { mark: open-corr }, path: corrections.go }
      - id: sel-swap
        type: editor.select
        at: { mark: sel-swap }
        target:
          {
            file: corrections.go,
            text: "Line{Account: line.Account, Debit: line.Credit, Credit: line.Debit}",
            occurrence: 1,
          }
      - id: sel-link
        type: editor.select
        at: { mark: sel-link }
        target: { file: corrections.go, text: "Corrects: orig.ID", occurrence: 1 }
      - id: sel-back
        type: editor.select
        at: { mark: sel-back }
        target: { file: corrections.go, text: "if tx.Corrects == id {", occurrence: 1 }
  - id: backdate
    chapter: Reversal ကို ဘယ်နေ့စွဲနဲ့ post လုပ်မလဲ
    narration: >-
      [[mark:open-main-2]] reversal ကို ဘယ်နေ့စွဲနဲ့ post လုပ်မလဲ။ original မဖြစ်ခဲ့သလို ဖြစ်ချင်ရင်
      original ရဲ့ နေ့စွဲ အတိုင်း October သုံးဆယ်ရက်နဲ့ ထားချင်စရာပါ။ [[mark:type-back]] ဒီ line နှစ်ကြောင်းက
      value date ကို October သုံးဆယ်ရက် ထားပြီး reversal ကို post လုပ်ကြည့်ပြီး၊ ledger ပြန်ပေးတဲ့ error ကို
      ထုတ်ပြပါတယ်။ ledger က လက်ခံမလား၊ လက်ခံရင် ဘာဖြစ်မလဲ။ run မလုပ်ခင် ခန့်မှန်းကြည့်ပါ။
      [[mark:run-2]] run လိုက်ရအောင်။ [[mark:pt-nil]] error မရှိပါဘူး၊ ledger က လက်ခံလိုက်ပါတယ်။
      [[mark:pt-oct]] ဒါပေမဲ့ October ကုန်က balance က အခု သုည ဖြစ်သွားပြီး၊ report လုပ်ခဲ့တဲ့ ယူရို ၁၀၀၀
      နဲ့ မကိုက်တော့ပါဘူး။ [[mark:dock-2]] user ဆီ ပို့ပြီးသား statement က ledger နဲ့ မတူတော့တာပါ၊
      ပြင်ဆင်မှု တစ်ခုက အတိတ်ကို တိတ်တိတ်လေး ပြောင်းလိုက်တာပါ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Reversals and corrections (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#reversals-and-corrections",
        }
    actions:
      - { id: open-main-2, type: workspace.openFile, at: { mark: open-main-2 }, path: main.go }
      - id: type-back
        type: editor.type
        at: { mark: type-back }
        target:
          {
            file: main.go,
            after: "\tl.Close(oct31) // October's statements have been sent\n",
            occurrence: 1,
          }
        text: "\n\terr := l.Post(Reversal(l.Get(\"tx-1\"), \"tx-2\", oct30))\n\tfmt.Println(\"reversal dated 2026-10-30:\", err)\n"
        cadence: line-by-line
      - { id: run-2, type: runtime.run, at: { mark: run-2, offsetMs: 200 }, timeoutMs: 15000 }
      - {
          id: expect-2,
          type: expect.output,
          at: { afterAction: run-2 },
          contains: "Oct 31 balance: 0.00 reported: 1000.00",
          timeoutMs: 8000,
        }
      - id: pt-nil
        type: console.point
        at: { mark: pt-nil }
        target: { text: "reversal dated 2026-10-30: <nil>", occurrence: 1 }
      - id: pt-oct
        type: console.point
        at: { mark: pt-oct }
        target: { text: "Oct 31 balance: 0.00", occurrence: 1 }
      - { id: dock-2, type: runtime.collapseDock, at: { mark: dock-2 } }
  - id: period
    chapter: ပိတ်ပြီးသား period
    narration: >-
      [[mark:show-period]] ပြဿနာက reporting period ပါ။ [[mark:pt-oct-box]] October ရဲ့ statement နဲ့
      report တွေကို user တွေ၊ auditor တွေ၊ အခွန်ရုံးလို အပြင်ကို ပို့ပြီးသားပါ။ အဲဒီ period ထဲကို entry
      အသစ် ဝင်လာရင် ပို့ပြီးသား report တွေက ledger နဲ့ မကိုက်တော့ပါဘူး။ [[mark:period-2]] ဒါကြောင့် value
      time ကို အတိတ်က နေ့စွဲ ထားတဲ့ backdating ကို period ဖွင့်ထားတုန်းမှာပဲ လုပ်လို့ ရပါတယ်။ ပိတ်ပြီးသား
      period ထဲကို backdate လုပ်ခွင့် များသောအားဖြင့် မရှိပါဘူး။ [[mark:period-3]] အဲဒီအစား correction
      ကို လက်ရှိ period ဖြစ်တဲ့ November ထဲမှာ book လုပ်ပြီး October က original နဲ့ link လုပ်ပါတယ်။
      [[mark:pt-kept]] October ရဲ့ ဂဏန်းတွေ မှားနေပေမဲ့ ပို့တုန်းကအတိုင်း ကျန်ပြီး၊ ပြင်ဆင်မှုက November
      မှာ မြင်ရပါတယ်။
      [[mark:close-period]] ဒီ စည်းမျဉ်းကို ledger ကိုယ်တိုင် စစ်ရပါမယ်၊ caller တိုင်းက မှတ်မိနေမယ်လို့ ယူဆလို့ မရပါဘူး။
      [[mark:open-ledger]] ledger မှာ period ပိတ်တဲ့ နေ့ကို မှတ်ထားပေမဲ့ post လုပ်တဲ့အခါ မစစ်သေးပါဘူး။
      [[mark:type-guard]] ဒီ စစ်ချက်က value date က ပိတ်ပြီးသား နေ့ထက် နောက်ကျမှ လက်ခံပြီး၊ မဟုတ်ရင်
      error ပြန်ပေးပါတယ်။ debit နဲ့ credit ညီသလား စစ်တာနဲ့ အတူ post လုပ်တဲ့ တစ်နေရာတည်းမှာ ထားလို့ ဘယ်
      code path ကမှ ကျော်လို့ မရပါဘူး။ [[mark:run-3]] run လိုက်ရအောင်။ [[mark:pt-closed]] ဒီတစ်ခါ ledger
      က October ပိတ်ပြီးပြီ ဆိုပြီး လက်မခံပါဘူး။ [[mark:dock-3]] October ကုန်က balance လည်း report
      လုပ်ခဲ့တဲ့ တန်ဖိုးအတိုင်း ပြန်ဖြစ်သွားပါပြီ။
    sources:
      - {
          title: "Fintech Engineering Handbook — Reversals and corrections (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#reversals-and-corrections",
        }
      - {
          title: "Fintech Engineering Handbook — Value time vs booking time vs settlement time (Voytek Pitula, CC BY 4.0)",
          url: "https://w.pitula.me/fintech-engineering-handbook/#value-time-vs-booking-time-vs-settlement-time",
        }
    actions:
      - {
          id: show-period,
          type: slide.show,
          at: { mark: show-period, offsetMs: -700 },
          slideId: period-1,
        }
      - {
          id: pt-oct-box,
          type: slide.point,
          at: { mark: pt-oct-box },
          target: { x: 0.163, y: 0.476 },
        }
      - { id: period-2, type: slide.show, at: { mark: period-2 }, slideId: period-2 }
      - {
          id: pt-broke,
          type: slide.point,
          at: { afterAction: period-2 },
          target: { x: 0.242, y: 0.787 },
        }
      - { id: period-3, type: slide.show, at: { mark: period-3 }, slideId: period-3 }
      - {
          id: pt-tx2-nov,
          type: slide.point,
