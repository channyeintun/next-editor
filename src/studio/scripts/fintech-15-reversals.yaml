        <g class="in"><rect x="840" y="660" width="680" height="130" rx="18" fill="#121824" stroke="#6cb2f5" stroke-width="2.5"/><text x="1180" y="715.3" font-size="32" text-anchor="middle" fill="#e9edf5" font-weight="600">entry နည်းတယ်</text><text x="1180" y="761.7" font-size="24" text-anchor="middle" fill="#8a94a8">100.00 လို့ ရေးထားတဲ့ record မရှိ</text></g>
