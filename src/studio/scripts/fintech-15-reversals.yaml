      corrections.go: |
        package main

        import "time"

        // Get returns a posted transaction by id.
        func (l *Ledger) Get(id string) Tx {
        	for _, tx := range l.txs {
        		if tx.ID == id {
        			return tx
        		}
        	}
        	return Tx{}
        }

        // CorrectedBy is the link back. The original is never edited, so the way back is a lookup.
        func (l *Ledger) CorrectedBy(id string) []string {
        	var ids []string
        	for _, tx := range l.txs {
        		if tx.Corrects == id {
        			ids = append(ids, tx.ID)
        		}
        	}
        	return ids
        }

        // Reversal negates every line of the original in full and links to it.
        func Reversal(orig Tx, id string, value time.Time) Tx {
        	tx := Tx{ID: id, Memo: "reversal", Value: value, Corrects: orig.ID}
        	for _, line := range orig.Lines {
        		tx.Lines = append(tx.Lines, Line{Account: line.Account, Debit: line.Credit, Credit: line.Debit})
        	}
        	return tx
        }

        // Book moves an amount between our bank account and user 1042's balance.
        // A negative amount moves it back. corrects links it to the transaction it corrects.
        func Book(id, memo string, amount int64, value time.Time, corrects string) Tx {
        	bank := Line{Account: "asset:bank", Debit: amount}
        	owed := Line{Account: user, Credit: amount}
        	if amount < 0 {
        		bank = Line{Account: "asset:bank", Credit: -amount}
        		owed = Line{Account: user, Debit: -amount}
        	}
        	return Tx{ID: id, Memo: memo, Value: value, Corrects: corrects, Lines: []Line{bank, owed}}
        }
      ledger.go: |
        package main

        import (
        	"fmt"
        	"strings"
        	"time"
        )

        // Line is one row of a transaction: an amount on the debit or the credit side of one account.
        type Line struct {
        	Account string
        	Debit   int64
        	Credit  int64
        }

        // Tx is one business event. All of its lines are posted together, or none of them.
        type Tx struct {
        	ID       string
        	Memo     string
        	Value    time.Time // when it happened economically
        	Corrects string    // the transaction this one reverses or corrects, if any
        	Lines    []Line
        }

        // Ledger is an append-only list of posted transactions. Balances are derived from it.
        type Ledger struct {
        	txs    []Tx
        	closed time.Time // the last day of the last reported period
        }

        // Post appends a transaction only if its debits equal its credits.
        func (l *Ledger) Post(tx Tx) error {
        	var debit, credit int64
        	for _, line := range tx.Lines {
        		debit += line.Debit
        		credit += line.Credit
        	}
        	if debit != credit {
        		return fmt.Errorf("tx %s is not balanced: debit %s, credit %s", tx.ID, cents(debit), cents(credit))
        	}
        	l.txs = append(l.txs, tx)
        	return nil
        }

        // Close records that every day up to and including through has been reported.
        func (l *Ledger) Close(through time.Time) { l.closed = through }

        // BalanceAt derives an account's balance from the transactions valued on or before t,
        // on the side where that kind of account grows.
        func (l *Ledger) BalanceAt(account string, t time.Time) int64 {
        	var debit, credit int64
        	for _, tx := range l.txs {
        		for _, line := range tx.Lines {
        			if line.Account == account && !tx.Value.After(t) {
        				debit += line.Debit
        				credit += line.Credit
        			}
        		}
        	}
        	if kind, _, _ := strings.Cut(account, ":"); kind == "asset" || kind == "expense" {
        		return debit - credit
        	}
        	return credit - debit
        }

        // cents prints minor units as an amount with two decimals: cents(1234) is "12.34".
        func cents(n int64) string {
        	sign := ""
        	if n < 0 {
        		sign, n = "-", -n
        	}
        	return fmt.Sprintf("%s%d.%02d", sign, n/100, n%100)
        }

        // day prints a date as 2026-10-30.
        func day(t time.Time) string { return t.Format("2006-01-02") }
      main.go: |
        package main

        import (
        	"fmt"
        	"strings"
        	"time"
        )

        var (
        	oct30 = time.Date(2026, 10, 30, 0, 0, 0, 0, time.UTC)
        	oct31 = time.Date(2026, 10, 31, 0, 0, 0, 0, time.UTC)
        	nov3  = time.Date(2026, 11, 3, 0, 0, 0, 0, time.UTC)
        	today = time.Date(2026, 11, 5, 0, 0, 0, 0, time.UTC)
        )

        const user = "liability:user:1042"

        func main() {
        	var l Ledger
        	// The user sent 100.00. It was booked as 1000.00.
        	must(l.Post(Book("tx-1", "deposit", 100000, oct30, "")))
        	reported := l.BalanceAt(user, oct31)
        	l.Close(oct31) // October's statements have been sent

        	show(&l)
        	fmt.Println("Oct 31 balance:", cents(l.BalanceAt(user, oct31)), "reported:", cents(reported))
        }

        // show lists every transaction with its links, then the user's balance today.
        func show(l *Ledger) {
        	for _, tx := range l.txs {
        		link := ""
        		if tx.Corrects != "" {
        			link = "corrects " + tx.Corrects
        		}
        		if by := l.CorrectedBy(tx.ID); len(by) > 0 {
        			link = "corrected by " + strings.Join(by, " ")
        		}
        		amount := tx.Lines[0].Debit - tx.Lines[0].Credit
        		row := fmt.Sprintf("%s %s %-8s %8s  %s", tx.ID, day(tx.Value), tx.Memo, cents(amount), link)
        		fmt.Println(strings.TrimSpace(row))
        	}
        	fmt.Println("balance today:", cents(l.BalanceAt(user, today)))
        }

        func must(err error) {
        	if err != nil {
        		panic(err)
        	}
        }
