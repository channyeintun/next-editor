  - id: not-100
    chapter: "100% က ဘာလို့ မှားလဲ"
    narration: >
      [[mark:close-b3]] [[mark:show-p02]] ဒါတွေ မြင်တော့ ကိုနေလင်းက ဘယ်တော့မှ မပျက်အောင် 100
      ရာခိုင်နှုန်း လုပ်ကြမယ်လို့ ပြောပါတယ်။ ဒါပေမဲ့ 100 ရာခိုင်နှုန်းက မှားတဲ့ ပစ်မှတ်ပါ။ ပထမ
      အကြောင်းက nine တစ်လုံး တိုးတိုင်း ကုန်ကျစရိတ် အများကြီး တက်တာပါ။ 99.9 ရာခိုင်နှုန်း၊ nine
      သုံးလုံးကနေ nine လေးလုံးကို တက်ဖို့ဆိုရင် server၊ လူနဲ့ စစ်ဆေးမှုတွေ အများကြီး ပိုလိုပြီး
      feature ထုတ်တာလည်း နှေးသွားပါတယ်။ [[mark:show-p02b]] ဒုတိယ အကြောင်းက user က ဘာကွာလဲ
      မသိနိုင်တာပါ။ လိုင်း အားနည်းတဲ့ user ဆိုရင် သူ့ဖုန်းလိုင်းက ကိုယ့် service ထက် အများကြီး
      ပိုပြတ်နေတော့၊ ကိုယ်က 99.99 ရာခိုင်နှုန်း ဖြစ်ဖြစ် 100 ရာခိုင်နှုန်း ဖြစ်ဖြစ် သူ့အတွက်
      မထူးပါဘူး။ [[mark:first-question]] ဒါကြောင့် ပထမဆုံး မေးရမှာက ဒီ service အတွက် reliability
      ဘယ်လောက် လိုလဲ ဆိုတာပါ။ အဖြေက ပျက်ရင် ဘယ်လောက် ကုန်ကျလဲ ဆိုတာကနေ လာပြီး၊ ကုမ္ပဏီ ကြီးလာရင်
      ပြောင်းတတ်သလို တခြား ကုမ္ပဏီဆီက ကူးလို့လည်း မရပါဘူး။ [[mark:show-p02c]] ဒီလို သဘောတူထားတဲ့
      ပစ်မှတ်ကို service level objective၊ အတိုကောက် SLO လို့ ခေါ်ပါတယ်။ [[mark:gap-is-budget]]
      ပစ်မှတ်နဲ့ 100 ရာခိုင်နှုန်းကြားက ကွာဟချက်ကတော့ error budget ပါ၊ SLO က ခွင့်ပြုထားတဲ့
      ပျက်ခွင့်ပါ။ lesson 1 က ကြိုသဘောတူထားတဲ့ risk အကန့်အသတ်ကို ဒီ နာမည်တွေနဲ့ ခေါ်တာပါ။ budget
      ကျန်သေးရင် feature ဆက်ထုတ်ပြီး ကုန်သွားရင် အရင်ပြင်ရတာကို lesson 6 မှာ လေ့လာပါမယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book, 1st ed: Embracing Risk",
          url: "https://sre.google/sre-book/embracing-risk/",
        }
      - {
          title: "SRE book, 1st ed: Availability Table",
          url: "https://sre.google/sre-book/availability-table/",
