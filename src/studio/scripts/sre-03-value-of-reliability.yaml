  - id: ops-vs-sre
    chapter: "Ops အဖွဲ့နဲ့ SRE"
    narration: >
      [[mark:show-p03]] ကိုနေလင်းက server တွေကို တစ်နေ့ 24 နာရီ၊ ရက်တိုင်း စောင့်ကြည့်မယ့် ops အဖွဲ့
      ခန့်ရင်ရော လို့ မေးပါတယ်။ ဘယ်ဘက်က ops အဖွဲ့ ပုံစံမှာ server တွေ up နေအောင် ထိန်းဖို့ပဲ
      တာဝန်ယူပြီး ဘာမှ မပြောင်းမှ ချီးမွမ်းခံရတော့ ပြောင်းလဲမှုတိုင်းကို တားချင်လာပါတယ်။ developer
      တွေကတော့ မြန်မြန် ထုတ်မှ ချီးမွမ်းခံရလို့ နှစ်ဖက်ကြားမှာ နံရံ ဖြစ်လာပါတယ်။ ops အဖွဲ့က လက်နဲ့
      ပြင်တာမို့ အလုပ်များရင် လူ ထပ်ခန့်ရပါတယ်။ [[mark:show-p03b]] ညာဘက်က Site Reliability
      Engineering၊ SRE ပုံစံမှာတော့ product အောင်မြင်ဖို့ကို developer တွေနဲ့ အတူ တာဝန်ယူပါတယ်။
      ပြောင်းလဲမှုတွေကိုလည်း သဘောတူထားတဲ့ error budget ကို သုံးပြီး ခွင့်ပြုပါတယ်။ [[mark:show-p03c]]
      SRE တွေက ops ပြဿနာကို software နဲ့ ဖြေရှင်းတဲ့ engineer တွေမို့ ထပ်ခါထပ်ခါ လုပ်ရတဲ့ အလုပ်တွေကို
      automate လုပ်ပြီး၊ toil အပါအဝင် ops အလုပ်ကို ဘယ်သူမဆို ကိုယ့်အချိန်ရဲ့ တစ်ဝက်ထက် မကျော်အောင်
      ထားပါတယ်။ [[mark:show-p03d]] ဒါက အမြင့်ဆုံး ကန့်သတ်ချက်ပါ၊ ပစ်မှတ် မဟုတ်ပါဘူး။ [[mark:handback]]
      service တစ်ခုက ပစ်မှတ်ကို ခဏခဏ မမီရင်၊ ဒါမှမဟုတ် ညဘက်ပါ alert တက်လွန်းလို့ on-call ကျတဲ့သူတွေ
      ပင်ပန်းနေရင်၊ SRE က on-call တာဝန်ကို ပြင်ပြီးတဲ့အထိ developer တွေဆီ ပြန်လွှဲလို့ ရပါတယ်။
      ဒါကြောင့် နှစ်ဖက်လုံး reliability ကို ဂရုစိုက်ကြရပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book, 1st ed: Introduction",
          url: "https://sre.google/sre-book/introduction/",
        }
      - {
          title: "SRE book, 1st ed: Embracing Risk",
          url: "https://sre.google/sre-book/embracing-risk/",
        }
    actions:
      - id: show-p03
        type: slide.show
        at: { mark: "show-p03" }
        slideId: l03_p03
      - id: show-p03b
        type: slide.show
        at: { mark: "show-p03b" }
        slideId: l03_p03b
      - id: show-p03c
        type: slide.show
        at: { mark: "show-p03c" }
        slideId: l03_p03c
      - id: show-p03d
        type: slide.show
        at: { mark: "show-p03d" }
        slideId: l03_p03d

  - id: growth-without-hiring
    narration: >
      [[mark:close-p03]] [[mark:b4-step1]] ဒီ ကွာခြားချက်ကို Bill Pay နဲ့ ကြည့်ရအောင်။ ကိုနေလင်းက
      မကြာခင် launch လုပ်မယ့် Bill Pay ကို 1 မြို့ကနေ 3 မြို့၊ 5 မြို့အထိ ချဲ့ချင်ပါတယ်။
      မြို့တိုင်းမှာ server တွေ၊ setting တွေကို လက်နဲ့ ဆင်ရရင် ops ဝန်ထမ်း 2 ယောက်ကနေ 6 ယောက်၊
      နောက်ဆုံး 10 ယောက်အထိ တိုးရပါမယ်။ [[mark:b4-step2]] ဒါပေမဲ့ ကောင်းတဲ့ setting တွေ ပါပြီးသား
      template တွေနဲ့၊ code ပြောင်းတိုင်း အလိုအလျောက် test လုပ်ပြီး production အထိ ပို့ပေးတဲ့ CI CD
      ကို သုံးရင်တော့ 3 ယောက်လောက်ပဲ လိုပါတော့တယ်။ [[mark:b4-step3]] ဒီ ကွာဟချက်က SRE ပေးတဲ့
      တန်ဖိုးပါ၊ business ကြီးလာသလောက် လူ လိုက်မတိုးရတာပါ။ ဆိုင်အသစ်တွေကို လက်နဲ့ စစ်ပြီး approve
      လုပ်တာကလည်း merchant 200 မှာ တစ်ပတ်ကို 2 နာရီခွဲပဲ ကြာပေမဲ့၊ merchant 2000 ဆိုရင် တစ်ပတ်ရဲ့
      အလုပ်ချိန် အများစု ကုန်ပါမယ်။ ဒါက toil ပါ၊ automate လုပ်ပြီး မဖယ်ရှားရင် business နဲ့အတူ
      လိုက်ကြီးလာမှာပါ။
    sources:
