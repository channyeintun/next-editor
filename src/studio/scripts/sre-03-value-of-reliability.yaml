build:
  # Studio swaps in the Burmese voice chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 2603

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: hook
    chapter: "Outage ရဲ့ တကယ့် ကုန်ကျစရိတ်"
    narration: >
      [[mark:show-p01]] ငွေ နှစ်ခါ ဖြတ်တဲ့ ညနဲ့ ဝန်ဆောင်ခ 10 ဆ ယူမိတဲ့ ည ပြီးကတည်းက Padauk မှာ config
      check နဲ့ ဝန်ဆောင်ခ alert တွေ ရှိလာပါပြီ။ ဒီနေ့ နေ့လယ်စာချိန်မှာတော့ ဆိုင်တွေမှာ Padauk QR နဲ့
      ငွေချေလို့ မရတော့ပါဘူး။ [[mark:hook-line2]] ဆိုင်တွေက alert မတက်ခင်ကတည်းက support ကို
      ဖုန်းဆက်လာကြပါတယ်။ အဖွဲ့ကလည်း ဘယ်သူ့ကို ခေါ်ရမလဲ ရှာရင်း အချိန်ကုန်ပြီး၊ release အသစ်ကို လက်နဲ့
      rollback လုပ်ရလို့ ပြန်ကောင်းဖို့ 30 မိနစ် ကြာပါတယ်။ [[mark:show-p01b]] CTO ကိုနေလင်းက ပျက်ခဲ့တာ
      30 မိနစ်ပဲ ဆိုတော့ သိပ်မဆိုးဘူးလို့ ထင်ပေမဲ့၊ user နဲ့ ဆိုင်တွေဘက်က တွက်ရင်တော့ လူတွေရဲ့ အချိန်
      500 နာရီလောက် ကုန်ပါတယ်။ ဘယ်ဂဏန်းက တကယ့် ကုန်ကျစရိတ်လဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book, 1st ed: Embracing Risk",
          url: "https://sre.google/sre-book/embracing-risk/",
        }
    actions:
      # -1750 / -1450, not the skeleton's -1900 / -1600: a pull-back over 1780 ms
      # pushes the first dialog past the 2 s opening handle, which
      # src/studio/plans/index.test.ts rejects (same offsets as lessons 1, 2, 4, 5).
      - id: collapse-dock
        type: runtime.collapseDock
        at: { scene: "start", offsetMs: -1750 }
      - id: show-p01
        type: slide.show
        at: { mark: "show-p01", offsetMs: -1450 }
        slideId: l03_p01
      - id: show-p01b
        type: slide.show
        at: { mark: "show-p01b" }
        slideId: l03_p01b

  - id: real-bill
    narration: >
      [[mark:close-p01b]] [[mark:b1-step1]] မသီရိ တွက်ထားတဲ့ စာရင်းကို ကြည့်ရအောင်။ ဆိုင်တိုင်းမှာ QR
      နဲ့ ငွေချေတာ အားလုံး ထိသွားတော့ blast radius၊ ဆိုလိုတာက ထိခိုက်တဲ့ နယ်ပယ်က ကျယ်ပြီး စာရင်းကလည်း
      ရှည်ပါတယ်။ [[mark:b1-step2]] user 1800 လောက်က တစ်ယောက် 10 မိနစ်စီ ထပ်ကြိုးစားရင်း စောင့်ရလို့
      300 နာရီ ကုန်ပါတယ်။ မစုရဲ့ support အဖွဲ့က message 1500 ကို တစ်ခု 6 မိနစ်စီ ဖြေရလို့ 150 နာရီ၊
      finance က 3 ယောက် 2 ရက်လုံး refund လုပ်ရလို့ 48 နာရီ ထပ်ကုန်ပါတယ်။ [[mark:b1-step3]] ဆိုင် 120
      ကလည်း နေ့လယ်စာ အရောင်းရဆုံး အချိန်မှာ ရောင်းမရလို့ ကျပ်သိန်း 36 လောက် ဆုံးရှုံးပါတယ်။ engineer
      တွေက ပြင်ရတဲ့ အလုပ်ထဲ ဆွဲခံရလို့ နောက် feature က 2 ပတ် နောက်ကျပြီး၊ ဆိုင်ရှင်တွေရဲ့ ယုံကြည်မှု
      ပြန်ရဖို့လည်း ကြာပါဦးမယ်။ [[mark:b1-step3b]] ဒီတော့ တကယ့် ကုန်ကျစရိတ်က 30 မိနစ် မဟုတ်ဘဲ လူတွေရဲ့
      အချိန် 500 နာရီလောက်နဲ့ ဆိုင်တွေ ဆုံးရှုံးတဲ့ အရောင်းပါ။ [[mark:bill-invisible]]
      ကြိုကာကွယ်ထားလို့ မဖြစ်ခဲ့တဲ့ outage တွေကိုတော့ ဘယ်သူမှ မမြင်ရလို့ ကျေးဇူးတင်မယ့်သူ မရှိပါဘူး။
      ဒါကြောင့် ပျက်ခဲ့တဲ့ နေ့ကို ဒီလို တွက်ပြရတာပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book, 1st ed: Embracing Risk",
          url: "https://sre.google/sre-book/embracing-risk/",
        }
    actions:
      - id: close-p01b
        type: slide.close
        at: { mark: "close-p01b", offsetMs: -400 }
      - id: b1-step1
        type: whiteboard.apply
        at: { mark: "b1-step1" }
        open: true
        clear: true
        upsertIds:
          - l03-b1-src
          - l03-b1-src-t
          - l03-b1-in
          - l03-b1-bus
        drawMs: 1600
      - id: b1-step2
        type: whiteboard.apply
        at: { mark: "b1-step2" }
        upsertIds:
          - l03-b1-t1-a
          - l03-b1-t1-l1
          - l03-b1-t1-l2
          - l03-b1-t2-a
          - l03-b1-t2-l1
          - l03-b1-t2-l2
          - l03-b1-t3-a
          - l03-b1-t3-l1
          - l03-b1-t3-l2
        drawMs: 2600
      - id: b1-step3
        type: whiteboard.apply
        at: { mark: "b1-step3" }
        upsertIds:
          - l03-b1-t4-a
          - l03-b1-t4-l1
          - l03-b1-t4-l2
          - l03-b1-t5-a
          - l03-b1-t5-l1
          - l03-b1-t5-l2
        drawMs: 2200
      - id: b1-step3b
        type: whiteboard.apply
        at: { mark: "b1-step3b" }
        upsertIds:
          - l03-b1-tot1
          - l03-b1-tot2
        drawMs: 1200

  - id: system-decay
    narration: >
      [[mark:b2-step1]] နောက်ထပ် ပျက်နိုင်တဲ့ နေရာတွေထဲမှာ မသီရိ အစိုးရိမ်ဆုံးက SMS code ပို့တဲ့
      integration အဟောင်းပါ။ ဒါကို 2 နှစ်လောက် ဘယ်သူမှ မထိ၊ မထိန်းသိမ်းဘဲ ထားခဲ့ပေမဲ့ အဲဒီအတွင်း SMS
      partner က API ကို ပြောင်းသွားပြီး library တွေမှာလည်း version အသစ်တွေ ထွက်လာပါတယ်။
      [[mark:b2-step2]] ဒီတော့ SMS စာသား တစ်ကြောင်း ပြင်ဖို့တောင် library တွေကို အရင် update လုပ်ရလို့
      ပြင်စရာ အသေးလေးက project ဖြစ်သွားပြီး၊ ပြင်လိုက်တိုင်း တခြားနေရာတွေက မထင်ထားဘဲ ပျက်လာပါတယ်။
      [[mark:b2-step3]] အဲဒီအခါ ဒါကို မထိနဲ့ ဆိုတဲ့ စကား ပေါ်လာပါတယ်။ [[mark:b2-step3b]] ဘယ်သူမှ
      မထိရဲတော့ ထိန်းသိမ်းမှု ပိုနည်းလာပြီး ပိုပျက်လာလို့ စက်ဝိုင်းက ဆက်ပတ်နေပါတယ်။ ဒါကို system
      ဆွေးမြေ့တာလို့ ခေါ်ပါတယ်။ လက္ခဏာကတော့ code ကို လက်နဲ့ ပြန်ပို့ပေးရတာ များလာပြီး SMS ရောက်ဖို့
      မထင်ထားလောက်အောင် ကြာလာတာပါ။ [[mark:decay-way-out]] ထွက်ပေါက်ကတော့ SMS code ဘယ်လောက် မြန်မြန်
      ရောက်ရမလဲ ဆိုတဲ့ ပစ်မှတ်ကို သဘောတူထားပြီး ဆွေးမြေ့တာကို အဲဒီ ပစ်မှတ်နဲ့ တိုင်းဖို့နဲ့၊ လက်နဲ့
      ထပ်ခါထပ်ခါ လုပ်ရပြီး ရေရှည် တန်ဖိုး မကျန်တဲ့ toil ကို လျှော့ဖို့ပါ။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "Measuring reliability (sre.google)",
          url: "https://sre.google/resources/practices-and-processes/measuring-reliability/",
        }
      - {
          title: "SRE book, 1st ed: Eliminating Toil",
          url: "https://sre.google/sre-book/eliminating-toil/",
        }
    actions:
      - id: b2-step1-ring
        type: whiteboard.apply
        at: { mark: "b2-step1" }
        open: true
        clear: true
        upsertIds:
          - l03-b2-title
          - l03-b2-ring
      - id: b2-step1
        type: whiteboard.apply
        at: { mark: "b2-step1", offsetMs: 200 }
        upsertIds:
          - l03-b2-n1
          - l03-b2-n1-t
          - l03-b2-n2
          - l03-b2-n2-t1
          - l03-b2-n2-t2
        drawMs: 2000
      - id: b2-step2
        type: whiteboard.apply
        at: { mark: "b2-step2" }
        upsertIds:
          - l03-b2-n3
          - l03-b2-n3-t1
          - l03-b2-n3-t2
          - l03-b2-n4
          - l03-b2-n4-t
        drawMs: 1800
      - id: b2-step3
        type: whiteboard.apply
        at: { mark: "b2-step3" }
        upsertIds:
          - l03-b2-n5
          - l03-b2-n5-t
        drawMs: 1000
      - id: b2-step3b
        type: whiteboard.apply
        at: { mark: "b2-step3b" }
        upsertIds:
          - l03-b2-arr-top
          - l03-b2-arr-right
        drawMs: 1200

  - id: time-and-timing
    narration: >
      [[mark:b3-step1]] outage ရဲ့ ကုန်ကျစရိတ်က မိနစ်နဲ့ အချိုးကျ မတက်ပါဘူး။ ဒီ bar တွေက ပျက်နေတဲ့ 10
      မိနစ်စီရဲ့ ကုန်ကျစရိတ်ပါ။ ပထမ 10 မိနစ်မှာ user တွေက ခဏနေ ပြန်ကြိုးစားကြလို့ ဆုံးရှုံးမှု
      နည်းပါသေးတယ်။ ဒါပေမဲ့ ကြာလာလေ တခြား app ကို ပြောင်းသွားကြလေမို့ နောက်ပိုင်း bar တွေ အများကြီး
      မြင့်လာပါတယ်။ ဒီလို ကိုယ့် app ကို စွန့်သွားတာကို churn လို့ ခေါ်ပြီး၊ တချို့ဆို
      ပြန်မလာကြတော့ပါဘူး။ [[mark:b3-step2]] ဘယ်အချိန်မှာ ပျက်လဲ ဆိုတာကလည်း အရေးကြီးပါတယ်။ မနက် 2
      နာရီမှာ 3 မိနစ် ပျက်တာကို သတိထားမိတဲ့သူ သိပ်မရှိပေမဲ့၊ သင်္ကြန် အကြိုညမှာ 40 မိနစ် ပျက်ရင်တော့
      လူတိုင်း top-up လုပ်နေတဲ့ ညမို့ ဒီ ခရမ်းရောင် bar တွေလို ကုန်ကျစရိတ်က အများကြီး ပိုမြင့်ပါတယ်။
      ဒါကြောင့် marketing အဖွဲ့ဆီက campaign ပြက္ခဒိန်ကို ကြိုတောင်းထားပြီး အဲဒီလို ညတွေမှာ
      ပိုဂရုစိုက်ရပါမယ်။
    sources:
