  - id: this-week
    narration: >
      [[mark:show-p05]] ဒီအပတ် စလုပ်ကြည့်ဖို့ အကြံ သုံးခု ပေးပါရစေ။ ကိုယ့်အဖွဲ့ရဲ့ နောက်ဆုံး outage
      ကို မိနစ်နဲ့ မဟုတ်ဘဲ လူတွေ ကုန်တဲ့ နာရီတွေနဲ့ ပြန်တွက်ကြည့်ပါ။ marketing အဖွဲ့ဆီက campaign
      ပြက္ခဒိန်ကိုလည်း တောင်းထားပါ။ ပြီးတော့ Padauk ရဲ့ စာရင်းထဲက တစ်ခုကို ကိုယ့် service မှာ
