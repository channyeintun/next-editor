  - id: first-year-list
    chapter: "ဘယ်ကနေ စမလဲ"
    narration: >
      [[mark:close-b4]] [[mark:show-p04]] နောက်ဆုံးတော့ ကိုနေလင်းက reliability အတွက် လူနဲ့ အချိန်
      ပေးဖို့ သဘောတူပါတယ်။ မသီရိက နေ့လယ်က outage ကို ပြန်ကြည့်ပြီး ပထမနှစ်အတွက် အလုပ် သုံးခု
      ရွေးပါတယ်။ rollback ကို လက်နဲ့ လုပ်ရလို့ ကြာခဲ့တာမို့ ပထမက ခလုတ် တစ်ချက်နဲ့ rollback
      လုပ်နိုင်ဖို့ပါ။ ဆိုင်တွေက alert ထက် အရင် သိခဲ့တာမို့ ဒုတိယက fail ဖြစ်တဲ့ top-up တွေအတွက် alert
      ပါ၊ သူ အကျွမ်းဆုံး Top-up ကနေ စတာပါ။ [[mark:show-p04b]] ဘယ်သူ့ကို ခေါ်ရမလဲ ရှာခဲ့ရတာမို့ တတိယက
      ရေးထားတဲ့ on-call စာရင်းပါ။ နောက်တော့ အန္တရာယ်ရှိတဲ့ ပြောင်းလဲမှုတွေကို 15 မိနစ် ထိုင်စစ်တဲ့
      review လေးလည်း ထည့်ပါတယ်။ ဒါတွေကို အစောကြီး လုပ်ရင် ဈေးပေါပေမဲ့၊ system ကြီးလာမှ နောက်ကနေ
      လိုက်ထည့်ရင် အများကြီး ပိုကုန်ပါတယ်။ [[mark:show-p04c]] ဒါကြောင့် reliability ကို
      ရင်းနှီးမြှုပ်နှံမှု တစ်ခုလို စီစဉ်ရပါမယ်။ အခု လူနဲ့ အချိန် ထည့်ရပေမဲ့ outage နည်းလာတာ၊ ops
      ကုန်ကျစရိတ်က business ထက် ဖြည်းဖြည်း တက်တာ၊ engineer တွေမှာ အသစ်တွေ ဆောက်ဖို့ အချိန် ပိုရတာ
      ဆိုပြီး အကျိုး ပြန်ရပါတယ်။
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
