# SRE from zero, lesson 3: Reliability ရဲ့ တန်ဖိုး (the value of reliability).
#
# A no-code concept lesson: Google deck pages (deck SRE 1) and the whiteboard
# carry it, notes.md closes it, and nothing runs. Built from the approved voice
# script docs/sre-course/voice-scripts/sre-03-value-of-reliability.md: every
# scene's narration is that script's spoken lines, byte for byte, with each
# ⟪…⟫ marker turned into a [[mark:…]]. Marks the script does not have only
# split a dialog at a sentence end (one voice-script line, one dialog) or add
# a pacing step, so something on screen changes at least every ~35 s at
# 70 ms/char: continuation pages (l03_p01b, p02b/c, p03b/c/d, p04b/c) and the
# split board steps b1-step3b and b2-step3b. One more, ask-question, sits after
# the recap question's ၊ pause so the question-line select can make the voice
# script's 3-second pause before the answer (see that action).
#
# Boards: B1 the real bill (comb), B2 system decay (ring), B3 cost per
# 10 minutes down (bars), B4 Bill Pay staff by hand vs templates + CI/CD.
# Colour jobs: #1e1e1e ink (paints white), blue the thing named and data,
# green healthy, red failure, orange the caveat, violet the result.
# Two-line board labels are two stacked text assets, one per line, so each
# box is sized to its own line by the 0.55 em rule.
#
# The deck URL is a placeholder until deck SRE 1 is published to the web; the
# Director's unreachable-deck warning is expected until then.
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/sre-03-value-of-reliability.yaml
#   bun scripts/studio-compile-check.ts src/studio/scripts/sre-03-value-of-reliability.yaml
