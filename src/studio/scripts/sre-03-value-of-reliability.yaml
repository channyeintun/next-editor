  - id: recap
    narration: >
      [[mark:close-p05]] [[mark:recap-notes]] ဒီနေ့ သင်ခဲ့တာတွေကို ပြန်ချုပ်ကြည့်ရအောင်။
      [[mark:sel-cost]] outage ရဲ့ တကယ့် ကုန်ကျစရိတ်က မိနစ်တွေ မဟုတ်ဘဲ လူတွေရဲ့ နာရီတွေနဲ့
      ဆုံးရှုံးတဲ့ အရောင်းတွေပါ။ [[mark:sel-decay]] မထိဘဲ ပစ်ထားတဲ့ system က ဆွေးမြေ့လာပြီး ဘယ်သူမှ
      မထိရဲတော့ပါဘူး။ [[mark:sel-100]] 100 ရာခိုင်နှုန်းအစား လုံလောက်တဲ့ ပစ်မှတ်ကို ရွေးရပြီး၊
      [[mark:sel-budget]] ကွာဟချက်က error budget ပါ။ [[mark:sel-ops]] ops အလုပ်ကလည်း ဘယ်သူမဆို
      ကိုယ့်အချိန်ရဲ့ တစ်ဝက်ထက် မကျော်ရပါဘူး။ [[mark:ask-yourself]] ကိုယ်တိုင် ဖြေကြည့်ပါ။ ကိုယ့်
      service အတွက် 99 ရာခိုင်နှုန်း reliable ဖြစ်ရင် လုံလောက်ပြီ ဆိုရင်၊ ကျန်တဲ့ 1 ရာခိုင်နှုန်း
      ကွာဟချက်ကို ဘာလို့ ခေါ်လဲ၊ [[mark:ask-question]] ဘယ်သူတွေ သဘောတူ သတ်မှတ်ရမလဲ?
      [[mark:pause-question]] ဒီ ကွာဟချက်က
      error budget ပါ၊ business ဘက်နဲ့ engineering ဘက် အတူတူ သဘောတူ သတ်မှတ်ရပါမယ်။ Padauk ရဲ့
      နောက်ပြဿနာမှာတော့ server တွေ အားလုံး အစိမ်းရောင် ပြနေပေမဲ့ Bank Y ကို ငွေလွှဲတာ 20 စက္ကန့်
      ကြာနေပါတယ်။ dashboard နဲ့ user ဘယ်သူ မှန်လဲ?
    sources:
      - {
          title: "Site Reliability Engineering, 2nd ed. (O'Reilly, 2026), further reading",
          url: "https://sre.google/books/",
        }
      - {
          title: "SRE book, 1st ed: Embracing Risk",
          url: "https://sre.google/sre-book/embracing-risk/",
        }
      - {
          title: "SRE book, 1st ed: Availability Table",
          url: "https://sre.google/sre-book/availability-table/",
        }
      - {
          title: "SRE book, 1st ed: Introduction",
          url: "https://sre.google/sre-book/introduction/",
        }
    actions:
      - id: close-p05
        type: slide.close
        at: { mark: "close-p05" }
      - id: open-notes
        type: workspace.openFile
        at: { mark: "recap-notes", offsetMs: 300 }
        path: notes.md
      - id: sel-cost
        type: editor.select
        at: { mark: "sel-cost" }
        target:
          file: "notes.md"
          text: "outage ရဲ့ တကယ့် ကုန်ကျစရိတ်"
          occurrence: 1
      - id: sel-decay
        type: editor.select
        at: { mark: "sel-decay" }
        target:
          file: "notes.md"
          text: "system ဆွေးမြေ့တာ"
          occurrence: 1
      - id: sel-100
        type: editor.select
        at: { mark: "sel-100" }
        target:
          file: "notes.md"
          text: "100% က မှားတဲ့ ပစ်မှတ်"
          occurrence: 1
      - id: sel-budget
        type: editor.select
        at: { mark: "sel-budget" }
        target:
          file: "notes.md"
          text: "error budget"
          occurrence: 1
      - id: sel-ops
        type: editor.select
        at: { mark: "sel-ops" }
        target:
          file: "notes.md"
          text: "ops အလုပ်ရဲ့ ကန့်သတ်ချက်"
          occurrence: 1
      # The voice script's ⟪pause 3s⟫ before the answer. A select anchored at
      # pause-question would run under the answer's first words (the scheduler
      # starts a dialog 350 ms after the one before it), so it hangs off
      # ask-question, an extra mark after the question's ၊ pause: the short
      # last clause ends, the select starts in silence, and the answer at
      # pause-question waits for its drag. Silence before the answer at
      # 55/70/95 ms per char: about 2.7/2.3/1.6 s (under the 2.5 s
      # inserted-silence warning at every rate).
      - id: pause-question
        type: editor.select
        at: { mark: "ask-question", offsetMs: 3200 }
        target:
          file: "notes.md"
          text: "မေးခွန်း: ကိုယ့် service က 99% reliable ဖြစ်ရင် လုံလောက်တယ်။ ကျန်တဲ့ 1% ကွာဟချက်ကို ဘာလို့ ခေါ်လဲ၊ ဘယ်သူတွေ သဘောတူ သတ်မှတ်ရမလဲ?"
          occurrence: 1

