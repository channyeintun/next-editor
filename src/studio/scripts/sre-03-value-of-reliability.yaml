      notes.md: |
        # Reliability ရဲ့ တန်ဖိုး

        - outage ရဲ့ တကယ့် ကုန်ကျစရိတ် — မိနစ် မဟုတ်၊ လူတွေရဲ့ နာရီ + ဆုံးရှုံးတဲ့ အရောင်း
        - system ဆွေးမြေ့တာ — မထိန်းသိမ်းရင် ဘယ်သူမှ မထိရဲတော့
        - 100% က မှားတဲ့ ပစ်မှတ် — ဒီ service အတွက် လုံလောက်တဲ့ ပစ်မှတ် (SLO) ကို ရွေး
        - error budget — SLO နဲ့ 100% ကြားက ပျက်ခွင့်
        - ops အလုပ်ရဲ့ ကန့်သတ်ချက် — ဘယ်သူမဆို အချိန်ရဲ့ တစ်ဝက်ထက် မကျော်၊ ပစ်မှတ် မဟုတ်

        မေးခွန်း: ကိုယ့် service က 99% reliable ဖြစ်ရင် လုံလောက်တယ်။ ကျန်တဲ့ 1% ကွာဟချက်ကို ဘာလို့ ခေါ်လဲ၊ ဘယ်သူတွေ သဘောတူ သတ်မှတ်ရမလဲ?
