build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 8104

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: questions
    chapter: မေးခွန်းတွေ ပြောင်းသွားပြီ
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ ဘယ်နည်းက ပိုကောင်းလဲ ဆိုတဲ့ မေးခွန်းကို ရတာနဲ့ ပေးရတာ ပါတဲ့ trade off table အဖြစ်
      ပြောင်းကြည့်ခဲ့ပါတယ်။ trade off ဆိုတာ တစ်ခု ရဖို့ နောက်တစ်ခုကို လျှော့ပေးရတာပါ။
      [[mark:n-open]] ဒါပေမဲ့ table ထဲမှာ ရွေးစရာတွေကို ထည့်နိုင်ဖို့ဆိုရင် အဲဒီ ရွေးစရာတွေ ရှိမှန်း အရင်
      သိထားရပါတယ်။ ဒီအပတ်မှာ ကိုယ် အဲဒီ ပြဿနာနဲ့ ကြုံရပါတယ်။
      [[mark:n-me]] ကိုယ်က ခရီးဖော် မှာ သုံးနေတဲ့ web framework ကို team ထဲမှာ အကျွမ်းဆုံးပါ။ နှစ်နှစ်လုံးလုံး
      framework နဲ့ ပတ်သက်တဲ့ မေးခွန်းမှန်သမျှ ကိုယ့်ဆီ ရောက်လာပြီး၊ ကိုယ်လည်း ဖြေနိုင်ခဲ့ပါတယ်။
      [[mark:n-q1]] အခုတော့ မေးခွန်းတွေက ပြောင်းသွားပါပြီ။ team ထဲက developer မောင်မောင် က လက်မှတ် SMS ကို
      နောက်ကွယ်ကနေ ပို့ဖို့ message broker သုံးရမလားလို့ မေးပါတယ်။ message broker ဆိုတာ ပို့စရာ message တွေကို
      လက်ခံ တန်းစီထားပြီး လက်ဆင့်ကမ်းပေးတဲ့ software ပါ။
      [[mark:n-q2]] CTO ဖြစ်တဲ့ အောင်အောင် ကတော့ နောက်နှစ် သင်္ကြန်မှာ ဝင်သုံးသူ ၁၅ ဆ တက်လာရင် database က
      ခံနိုင်ပါ့မလားလို့ မေးပါတယ်။
      [[mark:n-q3]] product manager လှလှ ကလည်း ကားဂိတ်မှာ internet ပြတ်နေတဲ့အချိန် ကောင်တာက ဘယ်လို
      ဆက်ရောင်းမလဲလို့ မေးလာပါတယ်။
      [[mark:n-gap]] ဒီ သုံးခုလုံးက framework နဲ့ မဆိုင်တော့ပါဘူး။ သုံးခုလုံးကို framework လောက် နက်နက်နဲနဲ
      သိအောင် လေ့လာဖို့ကလည်း ဘယ်သူ့မှာမှ အချိန် မရှိပါဘူး။ ဒါဆို architect တစ်ယောက်က ဘာကို ဘယ်လောက်
      သိထားရမှာလဲ။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - {
          id: draw-n-open,
          type: whiteboard.apply,
          at: { mark: n-open },
          open: true,
          clear: true,
          upsertIds: [n-title],
        }
      - {
          id: draw-n-me,
          type: whiteboard.apply,
          at: { mark: n-me },
          upsertIds: [n-me, n-me-l, n-me-s],
          drawMs: 1500,
        }
      - {
          id: draw-n-q1,
          type: whiteboard.apply,
          at: { mark: n-q1 },
          upsertIds: [n-q1],
          drawMs: 1000,
        }
      - {
          id: draw-n-q2,
          type: whiteboard.apply,
          at: { mark: n-q2 },
          upsertIds: [n-q2],
          drawMs: 1000,
        }
      - {
          id: draw-n-q3,
          type: whiteboard.apply,
          at: { mark: n-q3 },
          upsertIds: [n-q3],
          drawMs: 1000,
        }
      - {
          id: draw-n-gap,
          type: whiteboard.apply,
          at: { mark: n-gap },
          upsertIds: [n-gap],
          drawMs: 1000,
        }

  - id: three-bands
    chapter: အသိပညာ အလွှာ သုံးလွှာ
    narration: >
      [[mark:p-open]] လူတစ်ယောက်ရဲ့ အသိပညာကို အလွှာ သုံးလွှာ ခွဲကြည့်လို့ ရပါတယ်။
      [[mark:p-top]] အပေါ်ဆုံး အလွှာက ကိုယ် ကောင်းကောင်း သိပြီး နေ့တိုင်း သုံးနေတာတွေပါ။ ကိုယ့်အတွက်ဆိုရင် web
      framework ပါ။
      [[mark:p-mid]] အလယ် အလွှာက ရှိမှန်း သိပေမဲ့ ကိုယ်တိုင် မကျွမ်းတာတွေပါ။ ဥပမာ database ကို ဖတ်ဖို့သက်သက်
      မိတ္တူပွားထားလို့ ရတယ် ဆိုတာလောက်ကို သိထားတာမျိုးပါ။
      [[mark:p-bottom]] အောက်ဆုံး အလွှာကတော့ ရှိမှန်းတောင် မသိတာတွေပါ။ ဒီ အလွှာက အကြီးဆုံး ဖြစ်ပြီး၊
      မသိမှန်းတောင် မသိတာမို့ မေးခွန်းတောင် မမေးတတ်ပါဘူး။
      [[mark:p-dev]] developer တစ်ယောက်အနေနဲ့ တိုးတက်တယ် ဆိုတာ အပေါ်ဆုံး အလွှာကို ပိုနက်အောင် လုပ်တာပါ။
      code ကို ကောင်းကောင်း ရေးဖို့ အနက် လိုတာမို့ အဲဒါက မှန်ပါတယ်။
      [[mark:p-arch]] architect အတွက်တော့ အလယ် အလွှာကို ကျယ်အောင် လုပ်ဖို့က ပိုအရေးကြီးလာပါတယ်။
      ဘာကြောင့်လဲဆိုတော့ ဆုံးဖြတ်ချက် တစ်ခုမှာ ကိုယ် ရွေးနိုင်တာက ရှိမှန်း သိထားတဲ့ ရွေးစရာတွေထဲကပဲ
      ဖြစ်လို့ပါ။ ထိုင်ခုံကို အချိန် ကန့်သတ်ပြီး ခဏ ထိန်းထားတဲ့ seat hold ဆိုတဲ့ နည်း ရှိမှန်း မသိခဲ့ရင်၊
      ပြီးခဲ့တဲ့ lesson က table ထဲမှာ ရွေးစရာ နှစ်ခုပဲ ရှိခဲ့မှာပါ။
      [[mark:p-cheap]] ကောင်းတာက အလယ် အလွှာထဲ တစ်ခု ထည့်ဖို့ အများကြီး မကုန်ပါဘူး။ အဲဒီ အရာက ဘာအတွက်လဲ၊
      ဘယ်အခါ သင့်တော်လဲ၊ ဘာ ပေးရလဲ ဆိုတာ သိရင် လုံလောက်ပါပြီ။ ဘယ်လို တပ်ဆင်ရလဲ ဆိုတဲ့ အသေးစိတ်ကိုတော့
      တကယ် ရွေးဖြစ်တဲ့နေ့ကျမှ လေ့လာလို့ ရပါတယ်။
      [[mark:p-stale]] အနက်ကို လုံးဝ စွန့်ရမယ်လို့ မဆိုလိုပါဘူး။ ဒါပေမဲ့ ထောင်ချောက် တစ်ခု ရှိပါတယ်။ ကိုယ်
      နေ့တိုင်း မသုံးတော့တဲ့ အသိက တဖြည်းဖြည်း ဟောင်းသွားပါတယ်။ framework က version အသစ်တွေ ထွက်နေချိန်မှာ
      နှစ်နှစ်အရင်က သိခဲ့တာနဲ့ပဲ ကျွမ်းကျင်သူလို ဆက်ပြောနေရင်၊ ဟောင်းနေတဲ့ အချက်အလက်ပေါ်မှာ ဆုံးဖြတ်ချက်
      ချမိပါလိမ့်မယ်။
      [[mark:p-keep]] ဒါက ဘယ်သူမဆို ကျနိုင်တဲ့ ထောင်ချောက်ပါ။ ဒါကြောင့် ဆက်ထိန်းထားမယ့် အနက်ကို တစ်ခု နှစ်ခုပဲ
      ရွေးပြီး၊ ကျန်တာကိုတော့ သိသိကြီးနဲ့ လွှတ်ချလိုက်ရပါတယ်။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - {
          id: draw-p-open,
          type: whiteboard.apply,
          at: { mark: p-open },
          clear: true,
          upsertIds: [p-title],
        }
      - {
          id: draw-p-top,
          type: whiteboard.apply,
          at: { mark: p-top },
          upsertIds: [p-top, p-top-l],
          drawMs: 1200,
        }
      - {
          id: draw-p-mid,
          type: whiteboard.apply,
          at: { mark: p-mid },
          upsertIds: [p-mid, p-mid-l],
          drawMs: 1200,
        }
      - {
          id: draw-p-bottom,
          type: whiteboard.apply,
          at: { mark: p-bottom },
          upsertIds: [p-bot, p-bot-l],
          drawMs: 1200,
        }
      - {
          id: draw-p-dev,
          type: whiteboard.apply,
          at: { mark: p-dev },
          upsertIds: [p-deep, p-dev],
          drawMs: 1300,
        }
      - {
          id: draw-p-arch,
          type: whiteboard.apply,
          at: { mark: p-arch },
          upsertIds: [p-wl, p-wr, p-arch],
          drawMs: 1800,
        }
      - {
          id: point-p-mid,
          type: whiteboard.point,
          at: { mark: p-cheap },
          target: { assetId: p-mid },
        }
      - {
          id: point-p-top,
          type: whiteboard.point,
          at: { mark: p-stale },
          target: { assetId: p-top },
        }

  - id: portfolio
    chapter: အသိပညာကို ရင်းနှီးမြှုပ်နှံခြင်း
    narration: >
      [[mark:f-open]] ဒါဆို အလယ် အလွှာကို ဘယ်လို ကျယ်အောင် လုပ်မလဲ။ အသိပညာကို ငွေ ရင်းနှီးမြှုပ်နှံသလို
      သဘောထားရင် အလေ့အထ လေးခု ထွက်လာပါတယ်။
      [[mark:f-1]] ပထမက ပုံမှန် ထည့်တာပါ။ တစ်ခါတည်း အများကြီး ထည့်တာထက် နည်းနည်းစီ မပျက်မကွက် ထည့်တာက
      ပိုအကျိုးရှိပါတယ်။ ကိုယ်ကတော့ မနက် ရုံးရောက်ရောက်ချင်း chat နဲ့ email မဖွင့်ခင် မိနစ် ၂၀ ကို ဒီအတွက်
      သီးသန့် ထားပါတယ်။ နေ့လယ်ပိုင်း ရောက်ရင် အလုပ်တွေကြားမှာ အချိန် မကျန်တော့လို့ပါ။
      [[mark:f-2]] ဒုတိယက ဖြန့်ထားတာပါ။ ကိုယ် သုံးနေကျ နယ်ပယ်ကိုပဲ ဖတ်နေရင် အပေါ်ဆုံး အလွှာပဲ နက်လာမှာပါ။
      database၊ network၊ လူတွေနဲ့ အလုပ်လုပ်ပုံ စသဖြင့် ကိုယ် မသုံးဖူးတဲ့ ဘက်တွေကိုပါ ဖတ်မှ အလယ် အလွှာ
      ကျယ်လာပါတယ်။
      [[mark:f-3]] တတိယက စိစစ်တာပါ။ ဖတ်သမျှကို အမှန်လို့ မယူဘဲ မေးခွန်း နှစ်ခု မေးပါ။ ဒါကို ဘယ်သူ ပြောတာလဲ၊
      ဘယ်လို အခြေအနေအတွက် ပြောတာလဲ ဆိုတာပါ။ developer ရာနဲ့ချီ ရှိတဲ့ ကုမ္ပဏီကြီး တစ်ခုမှာ အောင်မြင်ခဲ့တဲ့
      နည်းက developer ခြောက်ယောက်ပဲ ရှိတဲ့ ခရီးဖော် အတွက် မှန်ချင်မှ မှန်မှာပါ။ ပစ္စည်း ရောင်းချင်တဲ့သူက
      ရေးထားတာဆိုရင်လည်း ပေးရတာတွေကို ချန်ထားတတ်ပါတယ်။
      [[mark:f-4]] စတုတ္ထက ပြန်ကြည့်တာပါ။ သုံးလ တစ်ခါလောက် ကိုယ် ဘာတွေ သိလာပြီလဲ၊ ဘာတွေ ဟောင်းသွားပြီလဲ
      ဆိုတာ ပြန်စစ်ပါ။ အဲဒီလို ပြန်စစ်ဖို့ ကိုယ်ပိုင် radar တစ်ခု ဆွဲထားရင် အဆင်ပြေပါတယ်။
    sources:
      - {
          title: "The Pragmatic Programmer, 20th Anniversary Edition (Thomas, Hunt)",
          url: "https://pragprog.com/titles/tpp20",
        }
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - {
          id: close-bands,
          type: whiteboard.apply,
          at: { mark: f-open, offsetMs: -1200 },
          open: false,
        }
      - { id: show-habits, type: slide.show, at: { afterAction: close-bands }, slideId: habits }
      - { id: point-habit-1, type: slide.point, at: { mark: f-1 }, target: { x: 0.15, y: 0.39 } }
      - { id: point-habit-2, type: slide.point, at: { mark: f-2 }, target: { x: 0.15, y: 0.53 } }
      - { id: point-habit-3, type: slide.point, at: { mark: f-3 }, target: { x: 0.15, y: 0.67 } }
      - { id: point-habit-4, type: slide.point, at: { mark: f-4 }, target: { x: 0.15, y: 0.81 } }

  - id: radar
    chapter: ကိုယ်ပိုင် radar
    narration: >
      [[mark:r-open]] radar ဆိုတာ technology တစ်ခုစီက ကိုယ့်အတွက် ဘယ်အဆင့်မှာ ရှိလဲ ဆိုတာကို စက်ဝိုင်း
      လေးထပ်နဲ့ ပြတဲ့ ပုံပါ။
      [[mark:r-adopt]] အလယ်ဗဟိုက Adopt ပါ။ ကိုယ် စိတ်ချလက်ချ သုံးနေပြီး၊ တခြားသူကိုလည်း သုံးဖို့
      အကြံပေးနိုင်တဲ့ အရာတွေကို ထည့်ပါတယ်။
      [[mark:r-trial]] ဒုတိယ အဝိုင်းက Trial ပါ။ အလားအလာ ရှိတယ်လို့ ယူဆလို့၊ ပျက်သွားလည်း အထိမနာတဲ့ အလုပ်
      သေးသေး တစ်ခုမှာ စမ်းသုံးကြည့်နေတာတွေပါ။
      [[mark:r-assess]] တတိယ အဝိုင်းက Assess ပါ။ မသုံးသေးဘဲ၊ ဘာအတွက်လဲ၊ ဘာ ပေးရလဲ ဆိုတာ နားလည်အောင်
      ဖတ်ကြည့်နေတာတွေပါ။ အသိပညာရဲ့ အလယ် အလွှာကို ကျယ်စေတာ ဒီ အဝိုင်းပါပဲ။
      [[mark:r-hold]] အပြင်ဆုံး အဝိုင်းက Hold ပါ။ အလုပ်အသစ်မှာ မစတော့ဘူးလို့ ဆုံးဖြတ်ထားတာတွေပါ။
      မကောင်းလို့ချည်း မဟုတ်ဘဲ၊ ကိုယ့် အခြေအနေနဲ့ မကိုက်သေးတာလည်း ဖြစ်နိုင်ပါတယ်။
      [[mark:r-why]] ဒီပုံရဲ့ တန်ဖိုးက ကြားဖူးသမျှ technology တိုင်းအတွက် ဘယ်အဝိုင်းထဲ ထည့်မလဲလို့
      ကိုယ့်ကိုယ်ကို ဆုံးဖြတ်ခိုင်းတာပါ။ ဆုံးဖြတ်ဖို့ဆိုရင် အနည်းဆုံး အဲဒါက ဘာအတွက်လဲ ဆိုတာလောက်တော့
      သိအောင် ဖတ်ရပါတော့တယ်။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - { id: close-habits, type: slide.close, at: { mark: r-open, offsetMs: -1200 } }
      - {
          id: draw-r-open,
          type: whiteboard.apply,
          at: { afterAction: close-habits },
          open: true,
          clear: true,
          upsertIds: [r-title],
        }
      - {
          id: draw-r-adopt,
          type: whiteboard.apply,
          at: { mark: r-adopt },
          upsertIds: [r-adopt, r-adopt-l, r-l1],
          drawMs: 1600,
        }
      - {
          id: draw-r-trial,
          type: whiteboard.apply,
          at: { mark: r-trial },
          upsertIds: [r-trial, r-trial-l, r-l2],
          drawMs: 1600,
        }
      - {
          id: draw-r-assess,
          type: whiteboard.apply,
          at: { mark: r-assess },
          upsertIds: [r-assess, r-assess-l, r-l3],
          drawMs: 1600,
        }
      - {
          id: draw-r-hold,
          type: whiteboard.apply,
          at: { mark: r-hold },
          upsertIds: [r-hold, r-hold-l, r-l4],
          drawMs: 1600,
        }

  - id: my-radar
    chapter: ခရီးဖော် အတွက် ကိုယ့် radar
    narration: >
      [[mark:t-close]] ဒီအပတ် မေးခွန်း သုံးခုကို အခြေခံပြီး ကိုယ့် radar ကို ရေးကြည့်ရအောင်။
      [[mark:type-adopt]] Adopt အောက်မှာ ခရီးဖော် က အခု သုံးနေပြီး ကိုယ်လည်း ယုံကြည်တဲ့ အရာ နှစ်ခုပဲ
      ထည့်ထားပါတယ်။ ကိုယ် တကယ် အာမခံနိုင်တာတွေပဲ ဖြစ်ရမှာမို့ ဒီ အဝိုင်းက သေးသင့်ပါတယ်။
      [[mark:type-trial]] Trial အောက်မှာတော့ load test ကို ထည့်ထားပါတယ်။ ဝင်သုံးသူ ၁၅ ဆ တက်လာရင် ဘာဖြစ်မလဲ
      ဆိုတာကို သင်္ကြန် မရောက်ခင် ကြိုသိချင်လို့ပါ။ စမ်းကြည့်လို့ အဆင်မပြေရင်လည်း ခရီးသည်တွေကို
      မထိခိုက်ပါဘူး။
      [[mark:type-assess]] Assess အောက်မှာ ဒီအပတ် မေးခွန်း သုံးခုနဲ့ ဆိုင်တဲ့ အရာတွေ ရောက်နေပါတယ်။ internet
      မရှိချိန် data ကို စက်ထဲမှာ သိမ်းထားပြီး နောက်မှ ပြန်ညှိတဲ့ offline sync နဲ့၊ database ကို ဖတ်ဖို့သက်သက်
      မိတ္တူပွားထားတဲ့ read replica တို့ ပါပါတယ်။ ဒါတွေကို ကိုယ် မကျွမ်းသေးပါဘူး။ ဒါပေမဲ့ ဒီလထဲမှာ တစ်ခုစီက
      ဘာအတွက်လဲ၊ ဘာ ပေးရလဲ ဆိုတာ ပြောနိုင်အောင် ဖတ်မယ်လို့ ကိုယ့်ကိုယ်ကို ကတိပေးလိုက်တာပါ။
      [[mark:type-hold]] Hold အောက်မှာတော့ နှစ်ခု ထည့်ထားပါတယ်။ တစ်ခုက microservices ပါ။ system ကို သီးခြား
      deploy လုပ်နိုင်တဲ့ service သေးသေးတွေအဖြစ် ခွဲတဲ့ ပုံစံမျိုးပါ။ developer ခြောက်ယောက်ပဲ ရှိတဲ့
      အခုအချိန်မှာ ရတာထက် ပေးရတာက ပိုများမယ်လို့ ကိုယ် ယူဆပါတယ်။
      [[mark:sel-stale]] နောက်တစ်ခုကတော့ ကိုယ် အရင်က ကျွမ်းခဲ့တဲ့ framework version အဟောင်းရဲ့ ရေးနည်းတွေပါ။
      ကိုယ် ကြိုက်ခဲ့တဲ့ အရာကို Hold ထဲ ထည့်ရတာ စိတ်မသက်သာပေမဲ့၊ ဟောင်းသွားတဲ့ အသိကို ဟောင်းပြီလို့
      ဝန်ခံတာလည်း radar ရဲ့ အလုပ်ပါပဲ။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - { id: close-radar, type: whiteboard.apply, at: { mark: t-close }, open: false }
      - {
          id: open-notebook,
          type: workspace.openFile,
          at: { afterAction: close-radar },
          path: notebook/04-my-radar.md,
        }
      - id: type-adopt
        type: editor.type
        at: { mark: type-adopt }
        cadence: line-by-line
        target: { file: notebook/04-my-radar.md, after: "# ကိုယ့် radar (ခရီးဖော် အတွက်)\n\n" }
        text: "## Adopt — စိတ်ချ သုံးနေတာ\n- web framework၊ relational database\n\n"
      - id: type-trial
        type: editor.type
        at: { mark: type-trial }
        cadence: line-by-line
        target: { file: notebook/04-my-radar.md, after: "relational database\n\n" }
        text: "## Trial — အသေးစားနဲ့ စမ်းမယ်\n- load test: သင်္ကြန် မတိုင်ခင် 15 ဆ ကို ကြိုစမ်းဖို့\n\n"
      - id: type-assess
        type: editor.type
        at: { mark: type-assess }
        cadence: line-by-line
        target: { file: notebook/04-my-radar.md, after: "15 ဆ ကို ကြိုစမ်းဖို့\n\n" }
        text: "## Assess — ဘာအတွက်လဲ နားလည်အောင် ဖတ်မယ်\n- message broker: SMS ကို နောက်ကွယ်ကနေ ပို့ဖို့\n- offline sync: internet ပြတ်ချိန် ကောင်တာ အတွက်\n- read replica: 15 ဆ နေ့မှာ database အတွက်\n\n"
      - id: type-hold
        type: editor.type
        at: { mark: type-hold }
        cadence: line-by-line
        target: { file: notebook/04-my-radar.md, after: "15 ဆ နေ့မှာ database အတွက်\n\n" }
        text: "## Hold — အလုပ်အသစ်မှာ မစဘူး\n- microservices: developer 6 ယောက်နဲ့ စောလွန်းတယ်\n- framework version အဟောင်းရဲ့ ရေးနည်းတွေ\n"
      - id: sel-stale
        type: editor.select
        at: { mark: sel-stale }
        target: { file: notebook/04-my-radar.md, text: "- framework version အဟောင်းရဲ့ ရေးနည်းတွေ" }
      - id: expect-assess
        type: expect.file
        at: { afterAction: sel-stale }
        path: notebook/04-my-radar.md
        contains: "## Assess — ဘာအတွက်လဲ နားလည်အောင် ဖတ်မယ်\n- message broker: SMS ကို နောက်ကွယ်ကနေ ပို့ဖို့\n"

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ architect တစ်ယောက်မှာ တစ်ပတ်ကို လေ့လာဖို့ အချိန် တစ်နာရီပဲ အားတယ်
      ဆိုပါစို့။ ဘယ်ဟာက သူ့ကို ပိုအကျိုးပြုမလဲ။
      [[mark:q-a]] ပထမ တစ်ခုက သူ ကျွမ်းပြီးသား framework ကို ပိုနက်အောင် ဆက်လေ့လာတာပါ။
      [[mark:q-b]] ဒုတိယ တစ်ခုကတော့ message broker အမျိုးအစား သုံးမျိုးက ဘာအတွက် သုံးလဲ ဆိုတာလောက်ကို
      လေ့လာတာပါ။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ တစ်ခုပါ။ ဘာကြောင့်လဲဆိုတော့ ကျွမ်းပြီးသား အရာမှာ တစ်နာရီ
      ထပ်ထည့်ရင် နက်ပြီးသား အလွှာက နည်းနည်းပဲ ပိုနက်လာမှာပါ။ အဲဒီ အနက်ကလည်း နေ့စဉ် အလုပ်ထဲမှာ အလိုလို
      တိုးနေပြီးသားပါ။
      [[mark:q-r]] message broker အတွက် သုံးတဲ့ တစ်နာရီကတော့ ရှိမှန်းတောင် မသိခဲ့တဲ့ ရွေးစရာ သုံးခုကို ရှိမှန်း
      သိတဲ့ အလွှာထဲ ရွှေ့ပေးပါတယ်။ SMS ကို ဘယ်လို ပို့မလဲလို့ ဆုံးဖြတ်ရမယ့်နေ့မှာ table ထဲ ထည့်စရာ
      ရွေးစရာတွေ ရှိလာမှာပါ။
      [[mark:q-test]] ဆိုတော့ လေ့လာစရာ တစ်ခု ရွေးတိုင်း ဒါက ဘယ်အလွှာကို ကျယ်စေမှာလဲလို့ မေးကြည့်ပါ။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-test,
          type: whiteboard.apply,
          at: { mark: q-test },
          upsertIds: [q-r],
          drawMs: 1000,
        }

  - id: your-turn
    chapter: ကိုယ့် radar
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ဒီ ခေါင်းစဉ် လေးခုအောက်က ခရီးဖော် အတွက်
      ရေးထားတာတွေကို ဖျက်ပြီး၊ ကိုယ့် project အတွက် တစ်ခုစီ ဖြည့်ကြည့်ပါ။
      [[mark:turn-2]] Assess အောက်မှာ ရေးစရာ အများဆုံး ဖြစ်နေရင် ကောင်းတဲ့ လက္ခဏာပါ။ ကိုယ် မသိသေးတာတွေကို
      မြင်နေရပြီ ဆိုတဲ့ သဘောမို့ပါ။ Hold အောက်မှာ ဘာမှ ရေးစရာ မရှိရင်တော့၊ ဟောင်းနေတာ တစ်ခုခုကို
      မမြင်သေးတာ ဖြစ်နိုင်ပါတယ်။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: turn }, open: false }
      - id: sel-rings
        type: editor.select
        at: { mark: turn, offsetMs: 2200 }
        target:
          file: notebook/04-my-radar.md
          text: "## Adopt — စိတ်ချ သုံးနေတာ\n- web framework၊ relational database\n\n## Trial — အသေးစားနဲ့ စမ်းမယ်\n- load test: သင်္ကြန် မတိုင်ခင် 15 ဆ ကို ကြိုစမ်းဖို့\n\n## Assess — ဘာအတွက်လဲ နားလည်အောင် ဖတ်မယ်"

  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ architect အတွက် အရေးကြီးတာက အရာတစ်ခုကို အနက်ဆုံး သိတာထက်၊ ရွေးစရာတွေ ရှိမှန်း
      ကျယ်ကျယ် သိထားတာပါ။ ဆုံးဖြတ်ချက်မှာ ရွေးနိုင်တာက ရှိမှန်း သိထားတာတွေထဲကပဲ ဖြစ်လို့ပါ။
      [[mark:recap-2]] အဲဒီအတွက် မနက်တိုင်း မိနစ် ၂၀ ပုံမှန် ဖတ်ပါ။ ဖတ်တာကို စိစစ်ပြီး၊ ကိုယ်ပိုင် radar နဲ့ သုံးလ
      တစ်ခါ ပြန်ကြည့်ပါ။ အနက်ကိုတော့ ဆက်သုံးနေတဲ့ တစ်ခု နှစ်ခုမှာပဲ ထိန်းထားပါ။
      [[mark:next]] နောက် lesson မှာတော့ design တစ်ခု ကောင်းမကောင်းကို နောက်တစ်ခါ ပြင်ရတာ လွယ်မလွယ်နဲ့
      ဘယ်လို အကဲဖြတ်မလဲ ဆိုတာကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "Fundamentals of Software Architecture, 2nd edition (Richards, Ford)",
          url: "https://oreil.ly/fundamentals-of-software-architecture-2e",
        }
      - {
          title: "The Pragmatic Programmer, 20th Anniversary Edition (Thomas, Hunt)",
          url: "https://pragprog.com/titles/tpp20",
        }
    actions: []

checks:
  - { type: timing.p95Ms, max: 300 }
