schemaVersion: 1

lesson:
  slug: architect-04-breadth-and-depth
  title: "Architect Path 04: အကျယ်နဲ့ အနက်"
  locale: my-MM
  workspace:
    lessonType: javascript
    name: Architect Notebook
    entryFilePath: notebook/04-my-radar.md
    sidebarStartsCollapsed: true
    files:
      README.md: |
        # ခရီးဖော် · system မှတ်စု

        ခရီးဖော်က အဝေးပြေးကား လက်မှတ်ကို app ကနေ ဝယ်လို့ရအောင် လုပ်ပေးတဲ့ ကုမ္ပဏီပါ။
        ဒီ course အတွက် စိတ်ကူးနဲ့ တည်ဆောက်ထားတဲ့ ကုမ္ပဏီ ဖြစ်ပါတယ်။

        ## သုံးတဲ့သူတွေ

        - ခရီးသည်: ခရီးစဉ် ရှာတယ်၊ ထိုင်ခုံ ရွေးတယ်၊ wallet နဲ့ ငွေချေတယ်၊ လက်မှတ် ရတယ်
        - ကားလိုင်း: ခရီးစဉ်နဲ့ ဈေးနှုန်း တင်တယ်၊ ရောင်းအား ကြည့်တယ်
        - ကောင်တာ ဝန်ထမ်း: ကားဂိတ်မှာ ထိုင်ခုံ အတူတူကိုပဲ ရောင်းတယ်

        ## အခု အခြေအနေ (ကုမ္ပဏီ သက်တမ်း 2 နှစ်)

        - developer 6 ယောက်၊ team တစ်ခု
        - ကားလိုင်း 40၊ တစ်ရက် လက်မှတ် 8,000 ခန့် (60 % က ကောင်တာက)
        - app တစ်ခုတည်း (monolith)၊ database တစ်ခု၊ server တစ်လုံး
        - အပြင်က service: wallet payment API၊ SMS gateway

        ## သင်္ကြန် လက်မှတ် ဖွင့်ရောင်းတဲ့နေ့

        - မနက် 9 နာရီမှာ ဝင်သုံးသူ ပုံမှန်ရဲ့ 15 ဆ
        - app က 2 နာရီကြာ နှေးနေခဲ့တယ်
        - ထိုင်ခုံ 312 ခုံကို နှစ်ခါ ရောင်းမိတယ်
      notebook/04-my-radar.md: |+
        # ကိုယ့် radar (ခရီးဖော် အတွက်)

      package.json: |
        {
          "name": "architect-notebook",
          "private": true,
          "version": "1.0.0",
          "scripts": {
            "dev": "echo concept lesson: nothing to run"
          }
        }
  slides:
    - id: habits
      contentType: html
      name: အလေ့အထ လေးခု
      content: |
        <style>
          .stage { position: relative; width: 100vw; height: 100vh; background: #0b0d12; color: #e7e9ee; font-family: system-ui, "Noto Sans Myanmar", sans-serif; text-align: left; }
          .title { position: absolute; left: 8vw; top: 9vh; height: 12vh; line-height: 12vh; font-size: 3.6vw; font-weight: 700; white-space: nowrap; }
          .row { position: absolute; left: 8vw; height: 10vh; line-height: 10vh; font-size: 2.4vw; white-space: nowrap; }
          .num { display: inline-block; width: 4vw; color: #8b93a7; }
          .term { display: inline-block; width: 18vw; font-weight: 700; }
          .wide { width: 26vw; }
          .blue { color: #74c0fc; } .orange { color: #ffc078; } .green { color: #8ce99a; } .red { color: #ffa8a8; } .violet { color: #b197fc; }
        </style>
        <div class="stage">
          <div class="title">အသိပညာကို ရင်းနှီးမြှုပ်နှံပုံ</div>
          <div class="row" style="top: 30vh"><span class="num">1</span><span class="term blue">ပုံမှန် ထည့်</span>နေ့တိုင်း မနက် အလုပ်မစခင် 20 မိနစ်</div>
          <div class="row" style="top: 44vh"><span class="num">2</span><span class="term orange">ဖြန့်ထား</span>ကိုယ် မသုံးဖူးတဲ့ နယ်ပယ်တွေပါ ဖတ်</div>
          <div class="row" style="top: 58vh"><span class="num">3</span><span class="term green">စိစစ်</span>ဘယ်သူ ပြောတာလဲ၊ ဘယ်အခြေအနေအတွက်လဲ</div>
          <div class="row" style="top: 72vh"><span class="num">4</span><span class="term violet">ပြန်ကြည့်</span>သုံးလ တစ်ခါ radar ကို ပြင်</div>
        </div>
