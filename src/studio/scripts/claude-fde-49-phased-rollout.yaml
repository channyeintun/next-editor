  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ ရက် ၃၀ ပြီးလို့ Customer App team က ဒုတိယ အဆင့်ကို ရောက်နေပြီ ဆိုပါစို့။
      team ထဲက developer တွေက auto mode နဲ့ အကြာကြီး လွှတ်ထားချင်လာပါတယ်။ ဘယ်အချက်က သူတို့ကို တတိယ အဆင့်
      တက်ခွင့် ပေးသင့်လဲ။
      [[mark:q-a]] ပထမ တစ်ခုက ဒုတိယ အဆင့်မှာ လေးပတ် ပြည့်ပြီး ဘာပြဿနာမှ မကြုံရသေးတာပါ။
      [[mark:q-b]] ဒုတိယ တစ်ခုက turn တိုင်းရဲ့ အဆုံးမှာ team ရဲ့ test တွေ အလိုအလျောက် run ပြီး၊ မအောင်ရင် Claude Code
      ကို ဆက်ပြင်ခိုင်းတာပါ။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ တစ်ခုပါ။ ဘာကြောင့်လဲဆိုတော့ လေးပတ်လုံး ပြဿနာ မရှိခဲ့တာက လူတွေ
      တစ်ဆင့်ချင်း ကြည့်နေခဲ့လို့ ဖြစ်နိုင်ပါတယ်။ auto mode မှာ လူ မကြည့်တော့တဲ့အခါ အဲဒီ နေရာကို တစ်ခုခုက ယူရပါမယ်။
      အဲဒါကို ယူပေးတာက အလိုအလျောက် run တဲ့ check ပါ။ အချိန်က အတွေ့အကြုံ ပေးနိုင်ပေမဲ့ check ကို မပေးနိုင်ပါဘူး။
      [[mark:q-rule]] ဒါကြောင့် နောက်အဆင့် တက်ဖို့ condition ကို ရေးတိုင်း မေးကြည့်ပါ။ ဒါက အချိန် ကုန်သွားတာလား၊
      တကယ် ပြည့်ရမယ့် အခြေအနေ တစ်ခုလား ဆိုတာပါ။
    sources:
      - {
          title: "Claude Code docs: hooks guide",
          url: "https://code.claude.com/docs/en/hooks-guide",
        }
      - {
          title: "Claude Code docs: permission modes",
          url: "https://code.claude.com/docs/en/permission-modes",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: q-rule, offsetMs: 2500 },
          upsertIds: [q-t1, q-t2],
          drawMs: 1600,
        }

  - id: conditions
    chapter: အထစ် တက်ဖို့ condition
    narration: >
      [[mark:cd-open]] ဒါဆို အထစ် တစ်ထစ်ချင်းကို တက်ဖို့ ပြည့်ရမယ့် condition တွေကို လှေကားပေါ်မှာ ထည့်ကြည့်ရအောင်။
      [[mark:cd-1]] ပထမကနေ ဒုတိယကို တက်ဖို့ စည်းကမ်းနဲ့ သင်ယူမှု လိုပါတယ်။ repo မှာ CLAUDE.md ရှိရမယ်၊ secret file
      တွေနဲ့ production ကို deny rule နဲ့ ပိတ်ထားရမယ်။ developer ကလည်း cohort ထဲက တစ်ယောက်နဲ့ အတူထိုင်ပြီး အနည်းဆုံး
      နှစ်ကြိမ် လုပ်ကြည့်ပြီး ဖြစ်ရပါမယ်။ CLAUDE.md ဆိုတာ project အကြောင်း Claude Code အမြဲ သိထားရမယ့် အချက်တွေ
      ရေးထားတဲ့ file ပါ။
      [[mark:cd-2]] ဒုတိယကနေ တတိယကို တက်ဖို့ကတော့ check တွေ အလိုအလျောက် run ရပါမယ်။ report job အတွက်ဆိုရင် output
      တိုက်စစ်တာကို hook နဲ့ ချိတ်ထားတာပါ။ hook ဆိုတာ Claude Code ရဲ့ အဆင့် တစ်ခုခုမှာ အလိုအလျောက် run တဲ့ ကိုယ့်
      command ပါ။ Claude Code က အလုပ် ပြီးပြီလို့ ရပ်တော့မယ် ဆိုတိုင်း hook က စစ်ပြီး၊ မအောင်ရင် ဆက်ပြင်ခိုင်းပါတယ်။
      လူ မကြည့်တဲ့အချိန်မှာ check က ကြည့်ပေးနေတာပါ။
      [[mark:cd-admin]] admin ဘက်ကလည်း လူတိုင်းရဲ့ စတင်တဲ့ mode ကို သတ်မှတ်လို့ ရပြီး၊ auto mode ကို ဖယ်ထားလို့လည်း
      ရပါတယ်။ ဒါကြောင့် developer အသစ်တွေ ပထမ အထစ်ကနေ စဖို့ကို setting နဲ့ပါ ထိန်းထားနိုင်ပါတယ်။
    sources:
      - {
          title: "Claude Code docs: hooks guide",
          url: "https://code.claude.com/docs/en/hooks-guide",
        }
      - {
          title: "Claude Code docs: admin setup",
          url: "https://code.claude.com/docs/en/admin-setup",
        }
      - {
          title: "Claude Code docs: permission modes",
          url: "https://code.claude.com/docs/en/permission-modes",
        }
    actions:
      - {
          id: redraw-stair,
          type: whiteboard.apply,
          at: { mark: cd-open },
          clear: true,
          upsertIds:
            [st-title, st-r1, st-l1, st-m1, st-r2, st-l2, st-m2, st-r3, st-l3, st-m3, st-ok],
          drawMs: 3300,
        }
      - {
          id: draw-st-c1,
          type: whiteboard.apply,
          at: { mark: cd-1 },
          upsertIds: [st-c1],
          drawMs: 900,
        }
      - {
          id: draw-st-c2,
          type: whiteboard.apply,
          at: { mark: cd-2 },
          upsertIds: [st-c2],
          drawMs: 900,
        }
      - {
          id: point-st-1,
          type: whiteboard.point,
          at: { mark: cd-admin },
          target: { assetId: st-m1 },
        }

  - id: people
    chapter: လူတွေရဲ့ အလုပ်လုပ်ပုံ
    narration: >
      [[mark:pp-open]] condition တွေက setting နဲ့ tool ဘက်က ပြင်ဆင်မှုတွေပါ။ ဒါပေမဲ့ တကယ် ပြောင်းရမှာက လူတွေရဲ့
      နေ့စဉ် အလုပ်လုပ်ပုံ ဖြစ်ပါတယ်။ change management ဆိုတာ လူတွေရဲ့ အလုပ်လုပ်ပုံ ပြောင်းလဲမှုကို စီမံတာပါ။
      [[mark:pp-1]] လူ တစ်ယောက်ချင်းရဲ့ ပြောင်းလဲမှုကို လေ့လာတဲ့ လူသုံးများ model တစ်ခုက၊ ပြောင်းရမယ်လို့ ကြားရုံနဲ့
      မလုံလောက်ဘူးလို့ ဆိုပါတယ်။ ပထမဆုံး ဘာကြောင့်လဲ ဆိုတာ သိဖို့ လိုပါတယ်။ Network Tools အတွက် ဘာကြောင့်လဲ
      ဆိုတာက Billing အတွက်နဲ့ မတူနိုင်ပါဘူး။
      [[mark:pp-2]] နောက်တစ်ခုက လက်တွေ့ လုပ်နိုင်တာပါ။ ဖတ်ထားရုံနဲ့ မရဘဲ ကိုယ့် codebase ထဲမှာ ကိုယ့်အလုပ်နဲ့
      လုပ်ကြည့်မှ ရပါတယ်။ Anthropic ရဲ့ scaling guide ကလည်း pilot ပြီးရင် hackathon တစ်ခု လုပ်ဖို့နဲ့၊ pilot ထဲက
      လူတွေကို အဖွဲ့တွင်း အကြံပေးအဖြစ် ထားဖို့ အကြံပြုပါတယ်။
      [[mark:pp-3]] နောက်ဆုံးက ပြန်မကျအောင် ထိန်းတာပါ။ အဆင်မပြေတဲ့ ပထမ ပတ်မှာ လူတွေက နည်းဟောင်းဆီ ပြန်သွားတတ်ပါတယ်။
      ဒါကြောင့် အပတ်စဉ် ပြန်ကြည့်ပြီး ကူညီပေးမယ့် အချိန်ကို plan ထဲ ကြိုထည့်ထားရပါတယ်။
      [[mark:pp-wave]] လူ ၁၆ ယောက်ကို တစ်ပြိုင်တည်း မစဘဲ wave လိုက် စရတဲ့ အကြောင်းရင်း နောက်တစ်ခုလည်း ရှိပါတယ်။ Claude
      Enterprise ရဲ့ သုံးစွဲမှု လမ်းညွှန်က၊ Claude Code လို သုံးစွဲမှု များတဲ့ tool တွေကို ပထမ နေ့ကတည်းက လူတိုင်း
      ပေးလိုက်တာဟာ မမျှော်လင့်တဲ့ ကုန်ကျစရိတ် ဖြစ်စေတဲ့ အမြန်ဆုံး နည်းလမ်းလို့ သတိပေးထားပါတယ်။
    sources:
      - {
          title: "Prosci ADKAR model of individual change",
          url: "https://www.prosci.com/methodology/adkar",
        }
      - {
          title: "Claude blog: scaling agentic coding across your organization",
          url: "https://claude.com/blog/scaling-agentic-coding",
        }
      - {
          title: "Claude Help Center: Claude Enterprise consumption guide",
          url: "https://support.claude.com/en/articles/14782391-claude-enterprise-consumption-guide",
        }
    actions:
      - { id: close-stair, type: whiteboard.apply, at: { mark: pp-open }, open: false }
      - { id: show-habits, type: slide.show, at: { afterAction: close-stair }, slideId: habits }
      - { id: point-h-1, type: slide.point, at: { mark: pp-1 }, target: { x: 0.15, y: 0.43 } }
      - { id: point-h-2, type: slide.point, at: { mark: pp-2 }, target: { x: 0.15, y: 0.59 } }
      - { id: point-h-3, type: slide.point, at: { mark: pp-3 }, target: { x: 0.15, y: 0.75 } }

  - id: plan
    chapter: Rollout plan
    narration: >
      [[mark:f-close]] ဒါတွေကို roll out plan ထဲမှာ အဆင့် တစ်ခုချင်း ချရေးကြည့်ရအောင်။
      [[mark:type-s1]] ပထမ အဆင့်က ရက် ၃၀ ပြီးမှ ဝင်လာမယ့် developer ၁၆ ယောက်အတွက်ပါ။ သူတို့ရဲ့ codebase တွေမှာ
      စည်းကမ်းနဲ့ check တွေ မရှိသေးလို့၊ ခွင့်ပြုချက် တစ်ခုချင်း ပေးရင်း Claude Code နဲ့ အလုပ်လုပ်ပုံကို အရင် မြင်ရပါမယ်။
      [[mark:type-s2]] ဒုတိယ အဆင့်မှာ cohort ထဲက နေ့စဉ် အလုပ်နဲ့ သုံးနေတဲ့ ခြောက်ယောက် ရှိပါတယ်။ သူတို့ တတိယ အဆင့်
      တက်ဖို့ condition က ကိုယ့် routine ရဲ့ check ကို hook က အလိုအလျောက် run နေဖို့ပါ။
      [[mark:type-s3]] တတိယ အဆင့်မှာတော့ report job ရွှေ့နေတဲ့ developer နှစ်ယောက်ပဲ ရှိပါတယ်။ output တိုက်စစ်တာ
      hook နဲ့ run နေပြီ ဖြစ်လို့ပါ။ ဒီ အဆင့်မှာ ဆက်နေဖို့ condition လည်း ရှိပါတယ်။ run တိုင်းရဲ့ diff ကို review
      လုပ်ရမယ်၊ output စစ်တာ မအောင်တဲ့ job ကို merge မလုပ်ရပါဘူး။
      [[mark:type-wave]] အောက်ဆုံးမှာ wave နှစ်ခုနဲ့ admin setting ကို ရေးပါတယ်။ ဒုတိယ wave မှာ team တစ်ခုချင်း
      ဝင်ပြီး၊ team တိုင်းကို cohort ထဲက တစ်ယောက်နဲ့ တွဲပေးပါမယ်။ admin က စတင်တဲ့ mode ကို Manual လို့
      သတ်မှတ်ထားလို့၊ developer အသစ် ဘယ်သူမှ လှေကား အလယ်ကနေ မစပါဘူး။
    sources:
      - {
          title: "Claude Code docs: admin setup",
          url: "https://code.claude.com/docs/en/admin-setup",
        }
      - {
          title: "Claude Code docs: permission modes",
          url: "https://code.claude.com/docs/en/permission-modes",
        }
    actions:
      - { id: close-habits, type: slide.close, at: { mark: f-close } }
      - id: type-s1
        type: editor.type
        at: { mark: type-s1 }
        cadence: line-by-line
        target: { file: notebook/49-rollout-plan.md, after: "|---|---|---|---|\n" }
        text: "| 1. ကြီးကြပ် | Manual, plan | Day 30 နောက် ဝင်မယ့် 16 ယောက် | CLAUDE.md နဲ့ deny rule ရှိ၊ cohort နဲ့ တွဲလုပ် 2 ကြိမ် |\n"
      - id: type-s2
        type: editor.type
