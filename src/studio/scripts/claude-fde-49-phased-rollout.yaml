build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 9349

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: need
    chapter: သူ့အလိုလို မဖြစ်ဘူး
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ baseline နဲ့ ROI ကို ပြင်ဆင်ခဲ့ပါတယ်။ ပထမ နေ့ မတိုင်ခင် ဂဏန်းတွေ ယူထားပြီး၊
      လုပ်ဆောင်မှု ဘယ်လောက် များလဲ မဟုတ်ဘဲ ရလဒ်ကို တိုင်းမယ်လို့ ဆုံးဖြတ်ခဲ့ပါတယ်။
      [[mark:two]] ရက် ၃၀ activation ကို ဆက်ဆွဲနေရင်း ပြဿနာ နှစ်ခုကို ကြိုမြင်ရပါတယ်။ activation ဆိုတာ သုံးစွဲမှုကို
      တကယ် စတင်နိုင်အောင် ပြင်ဆင်တဲ့ အဆင့်ပါ။ ပထမ ပြဿနာက trial တုန်းက မြင်ခဲ့တာပါ။ Billing developer တွေက
      Claude Code ရဲ့ ပြင်ဆင်ချက် တစ်ခုချင်းစီကို ကိုယ်တိုင် ခွင့်ပြုပြီး သုံးခဲ့ကြပါတယ်။ Claude Code ဆိုတာ
      terminal ထဲကနေ code ကို ဖတ်၊ ပြင်၊ command run ပေးတဲ့ coding agent ပါ။ ခွင့်ပြုချက် တစ်ခုချင်း တောင်းနေရင်
      job ၁၄၀ ကို သုံးပတ်နဲ့ ရွှေ့ဖို့ ခက်ပါတယ်။
      [[mark:other]] ဒုတိယ ပြဿနာက ဆန့်ကျင်ဘက်ပါ။ ရက် ၃၀ ပြီးရင် ကျန်တဲ့ developer ၁၆ ယောက်လည်း စသုံးကြမှာပါ။
      သူတို့ကို ပထမ နေ့ကစပြီး ဘာမှ မမေးဘဲ လုပ်ခွင့် ပေးလိုက်ရင်၊ စစ်ပေးမယ့် check တွေ မရှိသေးတဲ့ codebase ထဲမှာ
      Claude Code ကို ဘယ်သူမှ မစစ်ဘဲ အကြာကြီး လွှတ်ထားသလို ဖြစ်ပါလိမ့်မယ်။
      [[mark:path]] Anthropic ရဲ့ FDE learning path ဖော်ပြချက်က ဒီအချက်ကို တိုက်ရိုက် ပြောထားပါတယ်။ ကြီးကြပ်ပြီး
      သုံးတာကနေ agent ကို အလုပ် လွှဲအပ်တာဆီ ပြောင်းတာက သူ့အလိုလို မဖြစ်ဘဲ၊ activation ထဲမှာ design ဆွဲထားရမယ်
      ဆိုတာပါ။ agent ဆိုတာ ရည်မှန်းချက် ရောက်တဲ့အထိ tool တွေကို ကိုယ်တိုင် ရွေးသုံးပြီး အဆင့်ဆင့် လုပ်သွားတဲ့ model
      ပါ။ ဒါကြောင့် pilot design ရဲ့ နောက်ဆက်တွဲအဖြစ် roll out plan ကို Delivery Plan Pack ထဲ ထည့်ရေးပါမယ်။ roll out ဆိုတာ
      အဆင့်လိုက် ဖြန့်သုံးတာပါ။
    sources:
      - {
          title: "Anthropic partner academy: Claude Forward Deployed Engineer learning path (public outline)",
          url: "https://anthropic-partners.skilljar.com/path/claude-fde",
        }
    actions:
      - {
          id: open-rollout,
          type: workspace.openFile,
          at: { scene: start },
          path: notebook/49-rollout-plan.md,
        }
      - id: sel-intro
        type: editor.select
        at: { mark: path }
        target:
          file: notebook/49-rollout-plan.md
          text: "ကြီးကြပ်ပြီး သုံးတာကနေ အလုပ်လွှဲအပ်တာအထိ အဆင့် 3 ဆင့်"

  - id: stair
    chapter: လှေကား သုံးထစ်
    narration: >
      [[mark:st-title]] ဒီ ပြောင်းလဲမှုကို လှေကား သုံးထစ်နဲ့ ကြည့်ရအောင်။ အထစ်တိုင်းမှာ Claude Code ရဲ့ permission
      mode တစ်ခုစီ ရှိပါတယ်။ permission mode ဆိုတာ ဘယ်အရာတွေကို မမေးဘဲ လုပ်ခွင့်ပေးမလဲ သတ်မှတ်တဲ့ mode ပါ။
      [[mark:st-1]] ပထမ အထစ်က ကြီးကြပ်ပြီး သုံးတာပါ။ Manual mode မှာ Claude Code က file ဖတ်တာကလွဲရင်၊ ပြင်တာ၊
      command run တာ အားလုံးအတွက် ခွင့်ပြုချက် တောင်းပါတယ်။ ဘာမှ မပြင်ဘဲ အရင် ဖတ်ပြီး အစီအစဉ် ဆွဲခိုင်းတဲ့ plan
      mode ကလည်း ဒီ အထစ်မှာ အသုံးဝင်ပါတယ်။ developer က Claude Code ဘယ်လို အလုပ်လုပ်လဲ ဆိုတာကို တစ်ဆင့်ချင်း
      မြင်ရတဲ့ အထစ်ပါ။
      [[mark:st-2]] ဒုတိယ အထစ်က ယုံကြည်ရတဲ့ routine တွေပါ။ ကြိုသိပြီးသား အလုပ်၊ ဥပမာ report job တစ်ခု ရွှေ့တာမျိုးမှာ
      file ပြင်တာနဲ့ file တွေကို ဖန်တီး၊ ရွှေ့တဲ့ သာမန် command တွေကို မမေးဘဲ လုပ်ခွင့် ပေးပါတယ်။ ဒါက accept edits mode ပါ။ အလုပ်ပုံစံကို
      သိပြီးသားဖြစ်ပြီး၊ ရလဒ်ကို စစ်ပေးမယ့် check ရှိနေလို့ ခွင့်ပေးတာပါ။
      [[mark:st-3]] တတိယ အထစ်က အလုပ်ကို လွှဲအပ်တာပါ။ auto mode မှာ Claude Code က နောက်ကွယ်က safety check တွေနဲ့
      အရာအားလုံးကို ဆက်လုပ်သွားလို့၊ အချိန်ကြာကြာ run နိုင်ပါတယ်။ လူက တစ်ဆင့်ချင်း မကြည့်တော့ပေမဲ့ run ပြီးတဲ့အခါ
      diff နဲ့ ရလဒ်ကို စစ်ပါတယ်။ deny rule နဲ့ ပိတ်ထားတာကိုတော့ ဘယ် mode မှာမဆို လုပ်ခွင့် မရပါဘူး။
      [[mark:st-anth]] ဒီ လှေကားက ကိုယ်တို့ ဆွဲထားတဲ့ ပုံပါ။ Anthropic က ကိုယ်ပိုင် ဝန်ထမ်းတွေကို လေ့လာထားတဲ့
      စာတမ်းမှာလည်း၊ လူတွေက ရိုးရှင်းတဲ့ အလုပ်ကနေ စပြီး ယုံကြည်မှု တိုးလာမှ ပိုရှုပ်တဲ့ အလုပ်တွေကို လွှဲအပ်လာကြတယ်လို့
      ဆိုပါတယ်။ အများစုက ကိုယ့်အလုပ်ရဲ့ ၂၀ ရာခိုင်နှုန်းအထိပဲ အပြည့်အဝ လွှဲအပ်နိုင်သေးတယ်လို့လည်း ဖော်ပြထားပါတယ်။
    sources:
      - {
          title: "Claude Code docs: permission modes",
          url: "https://code.claude.com/docs/en/permission-modes",
        }
      - {
          title: "Anthropic: how AI is transforming work at Anthropic",
          url: "https://www.anthropic.com/research/how-ai-is-transforming-work-at-anthropic",
        }
    actions:
      - {
          id: draw-st-title,
          type: whiteboard.apply,
          at: { mark: st-title },
          open: true,
          clear: true,
          upsertIds: [st-title],
        }
      - {
          id: draw-st-1,
          type: whiteboard.apply,
          at: { mark: st-1 },
          upsertIds: [st-r1, st-l1, st-m1],
          drawMs: 1200,
        }
      - {
          id: draw-st-2,
          type: whiteboard.apply,
          at: { mark: st-2 },
          upsertIds: [st-r2, st-l2, st-m2],
          drawMs: 1200,
        }
      - {
          id: draw-st-3,
          type: whiteboard.apply,
          at: { mark: st-3 },
          upsertIds: [st-r3, st-l3, st-m3, st-ok],
