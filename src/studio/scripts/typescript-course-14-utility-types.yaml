runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "Type တစ်ခုကနေ type အသစ်တွေ"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ key တွေကို ကြိုမသိတဲ့ object တွေအတွက် index signature နဲ့ Record
      ကို သုံးခဲ့ပါတယ်။ ဒီ lesson မှာတော့ ရှိပြီးသား object type တစ်ခုကနေ ပုံစံ နည်းနည်းစီ ကွဲတဲ့ type
      အသစ်တွေကို ထုတ်ယူပုံကို ကြည့်သွားပါမယ်။ [[mark:draw-order]] ဆိုင်မှာ အော်ဒါ type တစ်ခု ရှိတယ်
      ဆိုပါစို့။ [[mark:draw-shapes]] အော်ဒါ ပြင်တဲ့ form က ပြောင်းချင်တဲ့ property တချို့ကိုပဲ ပို့ပါတယ်။
      အော်ဒါ အသစ် ဖန်တီးတဲ့အခါ id ကို ဆိုင်က ပေးမှာ ဖြစ်လို့ customer ဘက်က id မပါပါဘူး။ မီးဖိုချောင်ကတော့
      ဘာ ဖျော်ရမလဲ သိဖို့ property နှစ်ခု သုံးခုလောက်ပဲ လိုပါတယ်။ ဆိုတော့ တကယ်တမ်းမှာ အော်ဒါ တစ်ခုတည်းကို
      ပုံစံ အမျိုးမျိုးနဲ့ သုံးနေတာပါ။ [[mark:draw-copy]] ဒီ ပုံစံ တစ်ခုချင်းစီအတွက် type အသစ်ကို လက်နဲ့
      ကူးရေးမယ် ဆိုရင်၊ အော်ဒါမှာ property တစ်ခု ပြောင်းတိုင်း ကူးထားတဲ့ နေရာတိုင်းမှာ လိုက်ပြင်ရပါမယ်။
      တစ်နေရာ မေ့သွားရင် type တွေ တစ်ခုနဲ့ တစ်ခု မကိုက်တော့ပါဘူး။ [[mark:draw-derive]] TypeScript မှာတော့
      type တစ်ခုကနေ type အသစ် ထုတ်ပေးတဲ့ built-in type တွေ ပါပြီးသားပါ။ အဲဒါတွေကို utility type လို့
      ခေါ်ပြီး၊ ပြီးခဲ့တဲ့ lesson က Record လည်း utility type တစ်ခုပါပဲ။ utility type နဲ့ ထုတ်ယူထားရင်၊ မူလ
      type ပြောင်းတာနဲ့ ထုတ်ယူထားတဲ့ type တွေ အလိုလို လိုက်ပြောင်းသွားပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 6: Objects (reducing duplication with utility types)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/objects",
        }
      - {
          title: "TypeScript Handbook: Utility Types",
          url: "https://www.typescriptlang.org/docs/handbook/utility-types.html",
        }
    actions:
      - id: open-board-a
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-order
        type: whiteboard.apply
        at: { mark: draw-order }
        upsertIds: [a-order-box, a-order-label]
        drawMs: 1200
      - id: draw-shapes
        type: whiteboard.apply
        at: { mark: draw-shapes }
        upsertIds: [a-arrow-1, a-shape-1, a-arrow-2, a-shape-2, a-arrow-3, a-shape-3]
        drawMs: 4200
      - id: draw-copy
        type: whiteboard.apply
        at: { mark: draw-copy }
        upsertIds: [a-copy]
        drawMs: 1600
      - id: draw-derive
        type: whiteboard.apply
        at: { mark: draw-derive }
        upsertIds: [a-derive]
        drawMs: 1600

  - id: starter
    narration: >
      [[mark:close-board]] ဒီနေ့ code ကို ကြည့်ရအောင်။ [[mark:open-order]] ဒါက အော်ဒါ type နဲ့ အော်ဒါကို
      ဖန်တီးတဲ့၊ ပြင်တဲ့ function တွေ ရေးထားတဲ့ ဖိုင်ပါ။ [[mark:select-order-type]] အော်ဒါ တစ်ခုမှာ id ရယ်၊
      ပစ္စည်း ရယ်၊ အရေအတွက် ရယ်၊ သကြား ရယ်၊ မပါလည်း ရတဲ့ မှတ်ချက် ရယ်၊ customer ရယ် ပါပါတယ်။
      [[mark:select-customer]] customer ကတော့ အော်ဒါထဲမှာ ထပ်ပါတဲ့ object တစ်ခုပါ။ နာမည်နဲ့ စားပွဲ
      နံပါတ် ပါပြီး၊ စားပွဲ နံပါတ်ကတော့ မပါလည်း ရပါတယ်။ ဒီ အတွင်းက object ကို နောက်မှ ပြန်ကြည့်ပါမယ်။ [[mark:select-create]] ဖန်တီးတဲ့ function က
      အော်ဒါ data ကို ယူပြီး id အသစ် တပ်ပေးပါတယ်။ [[mark:select-update]] ပြင်တဲ့ function ကတော့ အော်ဒါ
      အဟောင်းပေါ်ကို ပြောင်းချင်တဲ့ property တွေ ထပ်ဖုံးပြီး အော်ဒါ အသစ် ပြန်ပေးပါတယ်။ [[mark:open-main]]
      main ဖိုင်မှာတော့ လှလှ အတွက် လက်ဖက်ရည် နှစ်ခွက် အော်ဒါကို ဖန်တီးပါတယ်။ [[mark:select-update-call]]
      ပြီးတော့ သကြား နည်းနည်းပဲ ထည့်ဖို့ ပြင်ပြီး၊ အော်ဒါ နှစ်ခုလုံးကို ထုတ်ပြပါတယ်။
    sources:
      - {
          title: "TypeScript Handbook: Object Types (optional properties)",
          url: "https://www.typescriptlang.org/docs/handbook/2/objects.html#optional-properties",
        }
      - {
          title: "MDN: Spread syntax (object literals)",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Spread_syntax",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: open-order
        type: workspace.openFile
        at: { mark: open-order }
        path: src/order.ts
      - id: select-order-type
        type: editor.select
        at: { mark: select-order-type }
        target:
          {
            file: src/order.ts,
            text: "  id: number;\n  item: string;\n  quantity: number;\n  sugar: \"less\" | \"normal\" | \"extra\";\n  note?: string;",
            occurrence: 1,
          }
      - id: select-customer
        type: editor.select
        at: { mark: select-customer }
        target: { file: src/order.ts, text: "{ name: string; table?: number }", occurrence: 1 }
      - id: select-create
        type: editor.select
        at: { mark: select-create }
        target: { file: src/order.ts, text: "return { ...data, id: nextId++ };", occurrence: 1 }
      - id: select-update
        type: editor.select
        at: { mark: select-update }
        target: { file: src/order.ts, text: "return { ...order, ...changes };", occurrence: 1 }
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: src/main.ts
      - id: select-create-call
        type: editor.select
        at: { afterAction: open-main }
        target: { file: src/main.ts, text: "const order = createOrder({", occurrence: 1 }
      - id: select-update-call
        type: editor.select
        at: { mark: select-update-call }
        target: { file: src/main.ts, text: 'updateOrder(order, { sugar: "less" })', occurrence: 1 }

  - id: symptoms
    narration: >
      [[mark:panel-ready]] Output ရဲ့ ပထမ line မှာ id တစ်၊ လက်ဖက်ရည်၊ သကြား normal ဆိုပြီး ထွက်လာပြီး၊
      ပြင်ပြီးတဲ့ အော်ဒါမှာတော့ သကြားက less ဖြစ်သွားပါတယ်။ program ကတော့ မှန်မှန် အလုပ်လုပ်နေပါတယ်။
      [[mark:read-errors]] ဒါပေမဲ့ Errors မှာ main ဖိုင်ထဲက error နှစ်ခု ရှိပါတယ်။ ပထမ error က ဖန်တီးတဲ့
      function ကို ပို့တဲ့ data မှာ id မပါဘူးလို့ ပြောပါတယ်။ ဒုတိယ error ကတော့ ပြင်တဲ့ function ကို သကြား
      တစ်ခုတည်း ပို့လိုက်လို့ ကျန်တဲ့ property လေးခု မပါဘူးလို့ ပြောပါတယ်။ [[mark:read-why]] ပြဿနာက function
      နှစ်ခုလုံးရဲ့ parameter ကို အော်ဒါ type အပြည့်အစုံနဲ့ ကြေညာထားလို့ပါ။ တကယ်တော့ ဖန်တီးတဲ့အခါ id မပါတဲ့
      အော်ဒါကို၊ ပြင်တဲ့အခါ property တချို့ပဲ ပါတဲ့ အော်ဒါကို လက်ခံရမှာပါ။ အဲဒီ type တွေကို အော်ဒါ type ကနေ ထုတ်ယူကြည့်ရအောင်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 6: Objects (reducing duplication with utility types)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/objects",
        }
      - {
          title: "TypeScript Handbook: Object Types",
          url: "https://www.typescriptlang.org/docs/handbook/2/objects.html",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-two-errors
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "2" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-id-missing
        type: expect.preview
        at: { afterAction: expect-two-errors }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Property 'id' is missing in type"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-four-missing
        type: expect.preview
        at: { afterAction: expect-id-missing }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-2 }
        textContains: "is missing the following properties from type 'Order': id, item, quantity, customer"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-first-order
        type: expect.preview
        at: { afterAction: expect-four-missing }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-1 }
        textContains: "1 လက်ဖက်ရည် normal"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: expect-changed-order
        type: expect.preview
        at: { afterAction: expect-first-order }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-2 }
        textContains: "1 လက်ဖက်ရည် less"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: partial
    chapter: "Partial နဲ့ Required"
    narration: >
      [[mark:open-order-2]] အော်ဒါ ဖိုင်ကို ပြန်သွားရအောင်။ [[mark:type-partial]] ပြင်တဲ့ form အတွက် type ကို
      Partial နဲ့ ထုတ်ယူပြီး၊ သူ့ အောက်မှာ query comment ထည့်ပါမယ်။ Partial ဆိုတာ type တစ်ခုရဲ့ property
      အားလုံးကို မပါလည်း ရတဲ့ property တွေ ဖြစ်အောင် ပြောင်းပေးတဲ့ utility type ပါ။ [[mark:read-partial]]
      Types မှာ property တိုင်းရဲ့ နာမည်နောက်မှာ question mark ပါလာပြီး၊ type ထဲမှာလည်း undefined ကို ပေါင်းထည့်ထားတာ မြင်ရပါတယ်။ [[mark:type-use-partial]] အခု ပြင်တဲ့ function ရဲ့ parameter ကို ဒီ type နဲ့
      ကြေညာလိုက်ပါမယ်။ [[mark:read-partial-fixed]] ဒုတိယ error ပျောက်သွားပါပြီ။ သကြား တစ်ခုတည်း ပို့လည်း
      TypeScript က လက်ခံပါပြီ။ [[mark:read-partial-nested]] ဒါပေမဲ့ Types ထဲက customer ကို ကြည့်ပါ။ customer
      တစ်ခုလုံးကတော့ မပါလည်း ရသွားပေမယ့်၊ သူ့ထဲက နာမည်ကတော့ question mark မပါဘဲ ရှိကို ရှိရဆဲပါ။ Partial
      က အပြင်ဆုံး အဆင့် တစ်ဆင့်ကိုပဲ ပြောင်းပေးလို့ပါ။
    sources:
      - {
          title: "TypeScript Handbook: Utility Types (Partial<Type>)",
          url: "https://www.typescriptlang.org/docs/handbook/utility-types.html#partialtype",
        }
      - {
          title: "Total TypeScript Essentials, ch. 6: Objects (Partial, shallow)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/objects",
        }
    actions:
      - id: open-order-2
        type: workspace.openFile
        at: { mark: open-order-2 }
        path: src/order.ts
      - id: type-partial
        type: editor.type
        at: { mark: type-partial }
        target:
          {
            file: src/order.ts,
            after: "  customer: { name: string; table?: number };\n};\n\n",
            occurrence: 1,
          }
        text: "export type OrderChanges = Partial<Order>;\n//          ^?\n\n"
        cadence: line-by-line
      - id: expect-partial-type
        type: expect.preview
        at: { afterAction: type-partial }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        textContains: 'sugar?: "less" | "normal" | "extra" | undefined;'
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-partial-nested
        type: expect.preview
        at: { afterAction: expect-partial-type }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-1 }
        textContains: "customer?: {\n        name: string;\n        table?: number;\n    } | undefined;"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-use-partial
        type: editor.type
        at: { mark: type-use-partial }
        target: { file: src/order.ts, after: "changes: Order", occurrence: 1 }
        text: "Changes"
        cadence: fast-explainer
      - id: expect-partial-fixed
        type: expect.preview
        at: { afterAction: type-use-partial }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-id-left
        type: expect.preview
        at: { afterAction: expect-partial-fixed }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Property 'id' is missing in type"
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: required
    narration: >
      [[mark:type-required]] Partial ရဲ့ ပြောင်းပြန်ကတော့ Required ပါ။ ဥပမာအားဖြင့်၊ ဘောင်ချာ ထုတ်တဲ့အခါ
      မှတ်ချက် အပါအဝင် property အားလုံး ရှိရမယ် ဆိုပါစို့။ ဒီ type ကိုလည်း query comment နဲ့ ကြည့်ရအောင်။
      [[mark:read-required]] Types ရဲ့ အပေါ်ဆုံးမှာ မှတ်ချက်ရဲ့ question mark ပျောက်သွားပြီး၊ မဖြစ်မနေ
      ရှိရမယ့် string ဖြစ်သွားပါပြီ။ [[mark:read-required-nested]] ဒါပေမဲ့ customer ထဲက စားပွဲ နံပါတ်ကတော့
      question mark နဲ့ ကျန်နေဆဲပါ။ Required ကလည်း Partial လိုပဲ အပြင်ဆုံး အဆင့် တစ်ဆင့်ကိုပဲ ပြောင်းလို့ပါ။
      အတွင်းထဲက object တွေထိ ပြောင်းချင်ရင်တော့ ကိုယ်တိုင် ရေးရပါမယ်။
    sources:
      - {
          title: "TypeScript Handbook: Utility Types (Required<Type>)",
          url: "https://www.typescriptlang.org/docs/handbook/utility-types.html#requiredtype",
        }
      - {
          title: "Total TypeScript Essentials, ch. 6: Objects (Required, one level deep)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/objects",
        }
    actions:
      - id: type-required
        type: editor.type
        at: { mark: type-required }
        target:
          {
            file: src/order.ts,
            after: "  customer: { name: string; table?: number };\n};\n\n",
            occurrence: 1,
          }
        text: "export type Receipt = Required<Order>;\n//          ^?\n\n"
        cadence: line-by-line
      - id: expect-required-note
        type: expect.preview
        at: { afterAction: type-required }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        textContains: "    note: string;"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-required-nested
        type: expect.preview
        at: { afterAction: expect-required-note }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-1 }
        textContains: "    customer: {\n        name: string;\n        table?: number;\n    };"
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: omit
    chapter: "Omit နဲ့ Pick"
    narration: >
      [[mark:type-omit]] အခု အော်ဒါ အသစ် ဖန်တီးဖို့ type ကို Omit နဲ့ ထုတ်ယူပါမယ်။ Omit က type တစ်ခုထဲကနေ
      ကိုယ် ပေးလိုက်တဲ့ key တွေကို ဖယ်ထုတ်ပြီး ကျန်တာကို ပြန်ပေးပါတယ်။ ဒီမှာတော့ id ကို ဖယ်လိုက်တာပါ။
      [[mark:type-use-omit]] ဖန်တီးတဲ့ function ရဲ့ parameter ကို ဒီ type နဲ့ ကြေညာလိုက်ပါမယ်။
      [[mark:read-omit-fixed]] Errors မှာ error တစ်ခုမှ မကျန်တော့ပါဘူး။ customer ဘက်က id မပို့ဘဲ အော်ဒါ
      ဖန်တီးလို့ ရသွားပြီး၊ id ကိုတော့ function ထဲမှာ ဆိုင်က တပ်ပေးပါတယ်။
    sources:
      - {
          title: "TypeScript Handbook: Utility Types (Omit<Type, Keys>)",
          url: "https://www.typescriptlang.org/docs/handbook/utility-types.html#omittype-keys",
        }
      - {
          title: "Total TypeScript Essentials, ch. 6: Objects (Omit)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/objects",
        }
    actions:
      - id: type-omit
        type: editor.type
        at: { mark: type-omit }
        target:
          {
            file: src/order.ts,
            after: "  customer: { name: string; table?: number };\n};\n\n",
            occurrence: 1,
          }
        text: "export type NewOrder = Omit<Order, \"id\">;\n\n"
        cadence: line-by-line
      - id: type-use-omit
        type: editor.type
        at: { mark: type-use-omit }
        target: { file: src/order.ts, after: "createOrder(data: ", occurrence: 1 }
        text: "New"
        cadence: fast-explainer
      - id: expect-omit-fixed
        type: expect.preview
        at: { afterAction: type-use-omit }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: pick
    narration: >
      [[mark:type-pick]] Omit ရဲ့ ပြောင်းပြန်ကတော့ Pick ပါ။ Pick က ကိုယ် ရွေးပေးတဲ့ key တွေကိုပဲ ယူပါတယ်။
      မီးဖိုချောင် လက်မှတ်မှာ ပစ္စည်း၊ သကြားနဲ့ အော်ဒါ အခြေအနေ ပါစေချင်ပါတယ်။ အော်ဒါ အခြေအနေ ဆိုတဲ့ status
      ကိုတော့ အော်ဒါ type ထဲ မထည့်ရသေးပါဘူး။ မထည့်ခင်မှာ Pick နဲ့ Omit က မရှိသေးတဲ့ key ကို ဘယ်လို
      ဆက်ဆံလဲ အရင် ကြည့်ရအောင်။ [[mark:read-pick-error]] Errors မှာ error တစ်ခု ပေါ်လာပါတယ်။ status ဆိုတဲ့ key က
      အော်ဒါ type ရဲ့ key တွေထဲမှာ မရှိဘူးလို့ ပြောနေတာပါ။ Types မှာလည်း status ကို unknown လို့ ပြနေပါတယ်။ Pick က ကိုယ် ရွေးတဲ့ key တွေ
      တကယ် ရှိမရှိ စစ်ပေးတာပါ။ [[mark:type-omit-status]] Omit ကိုလည်း စမ်းကြည့်ရအောင်။ အော်ဒါ အသစ်ရဲ့ status
      ကိုလည်း ဆိုင်ကပဲ သတ်မှတ်မှာ ဖြစ်လို့၊ Omit ရဲ့ key တွေထဲကို status ထည့်လိုက်ပါမယ်။
      [[mark:read-omit-loose]] error အသစ် မပေါ်လာပါဘူး။ Omit က မရှိတဲ့ key ကို ပေးလည်း လက်ခံလို့ပါ။
      ဒါကြောင့် Omit ထဲမှာ key နာမည်ကို စာလုံးပေါင်း မှားရေးမိရင်၊ TypeScript က သတိမပေးဘဲ ဖယ်ချင်တဲ့ property
      က ဆက်ကျန်နေနိုင်တာကို သတိထားပါ။
    sources:
      - {
          title: "TypeScript Handbook: Utility Types (Pick<Type, Keys>)",
          url: "https://www.typescriptlang.org/docs/handbook/utility-types.html#picktype-keys",
        }
      - {
          title: "Total TypeScript Essentials, ch. 6: Objects (Omit is loose, Pick is strict)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/objects",
        }
    actions:
      - id: type-pick
        type: editor.type
        at: { mark: type-pick }
        target:
          {
            file: src/order.ts,
            after: "  customer: { name: string; table?: number };\n};\n\n",
            occurrence: 1,
          }
        text: "export type KitchenTicket = Pick<Order, \"item\" | \"sugar\" | \"status\">;\n//          ^?\n\n"
        cadence: line-by-line
      - id: expect-pick-error
        type: expect.preview
        at: { afterAction: type-pick }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-pick-code
        type: expect.preview
        at: { afterAction: expect-pick-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-code, value: "2344" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-pick-text
        type: expect.preview
        at: { afterAction: expect-pick-code }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: 'Type ''"status"'' is not assignable to type ''keyof Order''.'
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-pick-unknown
        type: expect.preview
        at: { afterAction: expect-pick-text }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-1 }
        textContains: "    status: unknown;"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-omit-status
        type: editor.type
        at: { mark: type-omit-status }
        target: { file: src/order.ts, after: 'Omit<Order, "id"', occurrence: 1 }
        text: ' | "status"'
        cadence: fast-explainer
      - id: expect-omit-loose
        type: expect.preview
        at: { afterAction: type-omit-status }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-omit-loose-code
        type: expect.preview
        at: { afterAction: expect-omit-loose }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-code, value: "2344" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: add-status
    narration: >
      [[mark:type-status]] အခု အော်ဒါ type ထဲကို status property ကို တကယ် ထည့်ပါမယ်။ [[mark:read-status]]
      Pick ရဲ့ error ပျောက်သွားပြီး၊ Types အပေါ်ဆုံးက မီးဖိုချောင် လက်မှတ်မှာ unknown အစား
      status ရဲ့ တန်ဖိုး လေးမျိုး ပေါ်လာပါပြီ။ သူ့ အောက်က
      Required နဲ့ ထုတ်ထားတဲ့ type မှာလည်း status က အလိုလို ပါလာပါတယ်။ ထုတ်ယူထားတဲ့ type တွေကို တစ်ခုမှ
      ပြင်စရာ မလိုပါဘူး။ [[mark:read-return-error]] Errors မှာတော့ error အသစ် တစ်ခု ပေါ်လာပါတယ်။ ဖန်တီးတဲ့
      function က ပြန်ပေးတဲ့ အော်ဒါမှာ status မပါဘူးလို့ ပြောနေတာပါ။ Omit က status ကို ဖယ်ထားလို့ customer
      ဆီက မလာတော့တဲ့အတွက်၊ ဆိုင်ကပဲ ထည့်ပေးရပါမယ်။ [[mark:type-set-status]] အော်ဒါ အသစ်တိုင်းကို pending
      နဲ့ စပေးလိုက်ပါမယ်။ [[mark:read-status-fixed]] error မကျန်တော့ပါဘူး။ ဆိုတော့ အော်ဒါ type
      တစ်နေရာတည်းကို ပြင်လိုက်တာနဲ့ ထုတ်ယူထားတဲ့ type တွေ အကုန် လိုက်ပြောင်းသွားပြီး၊ ပြင်ရမယ့် ကျန်တဲ့
      နေရာကိုလည်း TypeScript က ပြပေးသွားတာပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 6: Objects (derived types follow the source type)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/objects",
        }
      - {
          title: "TypeScript Handbook: Utility Types",
          url: "https://www.typescriptlang.org/docs/handbook/utility-types.html",
        }
    actions:
      - id: type-status
        type: editor.type
        at: { mark: type-status }
        target: { file: src/order.ts, after: "  quantity: number;\n", occurrence: 1 }
        text: "  status: \"pending\" | \"brewing\" | \"ready\" | \"paid\";\n"
        cadence: line-by-line
      - id: expect-status-code
        type: expect.preview
        at: { afterAction: type-status }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-code, value: "2741" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-status-one
        type: expect.preview
        at: { afterAction: expect-status-code }
        timeoutMs: 5000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-status-missing
        type: expect.preview
        at: { afterAction: expect-status-one }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Property 'status' is missing in type"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-ticket-status
        type: expect.preview
        at: { afterAction: expect-status-missing }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-1 }
        textContains: '    status: "pending" | "brewing" | "ready" | "paid";'
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-full-status
        type: expect.preview
        at: { afterAction: expect-ticket-status }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-2 }
        textContains: '    status: "pending" | "brewing" | "ready" | "paid";'
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-set-status
        type: editor.type
        at: { mark: type-set-status }
        target: { file: src/order.ts, after: "id: nextId++", occurrence: 1 }
        text: ', status: "pending"'
        cadence: fast-explainer
      - id: expect-status-fixed
        type: expect.preview
        at: { afterAction: type-set-status }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: union
    chapter: "Union ပေါ်က Omit"
    narration: >
      [[mark:open-bill]] နောက်ဆုံးအနေနဲ့ Omit နဲ့ Pick မှာ သတိထားရမယ့် အချက် တစ်ခုကို ငွေချေတဲ့ ဖိုင်မှာ
      ကြည့်ရအောင်။ [[mark:select-payment]] ငွေချေပုံကို union နဲ့ ရေးထားပါတယ်။ ငွေသားနဲ့ ချေရင် လက်ခံရတဲ့ ငွေ
      ပါပြီး၊ KBZPay နဲ့ ချေရင် ဖုန်းနံပါတ် ပါပါတယ်။ [[mark:select-new-payment]] အောက်က type ကတော့
      မှတ်တမ်း မတင်ရသေးတဲ့ ငွေချေမှုအတွက် id ကို Omit နဲ့ ဖယ်ထားတာပါ။ [[mark:type-cash]] ဒီ type နဲ့ ငွေသား
      ၅၀၀၀ ကျပ် ချေတဲ့ ငွေချေမှု တစ်ခု ရေးကြည့်ရအောင်။ [[mark:read-cash-error]] error တစ်ခု ပေါ်လာပါတယ်။
      လက်ခံရတဲ့ ငွေ ဆိုတဲ့ property က ဒီ type ထဲမှာ မရှိဘူးလို့ ပြောနေပါတယ်။ [[mark:type-payment-query]]
      ဘာဖြစ်လို့လဲ ဆိုတာ query comment နဲ့ ကြည့်ရအောင်။ [[mark:read-collapse]] Types အပေါ်ဆုံးမှာ ငွေချေပုံ
      ဆိုတဲ့ property တစ်ခုတည်းပဲ ကျန်ပြီး၊ လက်ခံရတဲ့ ငွေရော ဖုန်းနံပါတ်ရော ပျောက်သွားပါပြီ။ union ပေါ်မှာ
      Omit ကို သုံးရင်၊ member တစ်ခုချင်းစီကို သီးသန့် မပြောင်းဘဲ member အားလုံးမှာ တူတဲ့ property တွေကိုပဲ
      ချန်ထားလို့ပါ။ Pick ကလည်း ဒီ အတိုင်းပဲ ဖြစ်ပါတယ်။ [[mark:type-distributive]] ပြင်နည်းကတော့ member
      တစ်ခုချင်းစီပေါ်မှာ Omit ကို သုံးပေးတဲ့ distributive version တစ်ခု ရေးတာပါ။ ဒီ နှစ်ကြောင်းက conditional
      type ကို သုံးထားလို့၊ အသေးစိတ်ကို နောက်ပိုင်း conditional type lesson မှာ ရှင်းပါမယ်။
      [[mark:type-use-distributive]] အောက်က type မှာ ဒီ version ကို သုံးလိုက်ပါမယ်။ [[mark:read-distributive]]
      error ပျောက်သွားပါပြီ။ Types မှာလည်း member နှစ်ခုကို Omit တစ်ခုစီနဲ့ သီးသန့် ပတ်ထားတာ ပြနေပါတယ်။
      ဆိုတော့ ငွေသားဘက်မှာ လက်ခံရတဲ့ ငွေ၊ KBZPay ဘက်မှာ ဖုန်းနံပါတ် ကိုယ်စီ ကျန်ပြီး၊ id ကိုပဲ တစ်ခုချင်းစီကနေ
      ဖယ်ထားတာပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 6: Objects (Omit and Pick don't distribute; DistributiveOmit)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/objects",
        }
      - {
          title: "TypeScript Handbook: Conditional Types (distributive conditional types)",
          url: "https://www.typescriptlang.org/docs/handbook/2/conditional-types.html#distributive-conditional-types",
        }
    actions:
      - id: open-bill
        type: workspace.openFile
        at: { mark: open-bill }
        path: src/bill.ts
      - id: select-payment
        type: editor.select
        at: { mark: select-payment }
        target:
          {
            file: src/bill.ts,
            text: "  | { id: number; method: \"cash\"; received: number }\n  | { id: number; method: \"kpay\"; phone: string };",
            occurrence: 1,
          }
      - id: select-new-payment
        type: editor.select
        at: { mark: select-new-payment }
        target: { file: src/bill.ts, text: 'type NewPayment = Omit<Payment, "id">;', occurrence: 1 }
      - id: type-cash
        type: editor.type
        at: { mark: type-cash }
        target:
          { file: src/bill.ts, after: "type NewPayment = Omit<Payment, \"id\">;\n", occurrence: 1 }
        text: "\nconst cash: NewPayment = { method: \"cash\", received: 5000 };\n"
        cadence: line-by-line
      - id: expect-cash-error
        type: expect.preview
        at: { afterAction: type-cash }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-cash-text
        type: expect.preview
        at: { afterAction: expect-cash-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "'received' does not exist in type 'NewPayment'."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-payment-query
        type: editor.type
        at: { mark: type-payment-query }
        target:
          { file: src/bill.ts, after: "type NewPayment = Omit<Payment, \"id\">;\n", occurrence: 1 }
        text: "//   ^?\n"
        cadence: fast-explainer
      - id: expect-collapse
        type: expect.preview
        at: { afterAction: type-payment-query }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        attribute:
          { name: data-type, value: "type NewPayment = {\n    method: \"cash\" | \"kpay\";\n}" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: type-distributive
        type: editor.type
        at: { mark: type-distributive }
        target:
          {
            file: src/bill.ts,
            after: "  | { id: number; method: \"kpay\"; phone: string };\n\n",
            occurrence: 1,
          }
        text: "type DistributiveOmit<T, K extends PropertyKey> =\n  T extends any ? Omit<T, K> : never;\n\n"
        cadence: line-by-line
      - id: type-use-distributive
        type: editor.type
        at: { mark: type-use-distributive }
        target: { file: src/bill.ts, after: "type NewPayment = ", occurrence: 1 }
        text: "Distributive"
        cadence: fast-explainer
      - id: expect-distributive-fixed
        type: expect.preview
        at: { afterAction: type-use-distributive }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-cash-member
        type: expect.preview
        at: { afterAction: expect-distributive-fixed }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-1 }
        textContains: "    method: \"cash\";\n    received: number;"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-kpay-member
        type: expect.preview
        at: { afterAction: expect-cash-member }
        timeoutMs: 5000
        target: { by: testId, value: ts-type-1 }
        textContains: "    method: \"kpay\";\n    phone: string;"
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: recap
    narration: >
      [[mark:recap-partial]] ဒါဆို ပြန်ချုပ်ရရင်၊ Partial က property အားလုံးကို မပါလည်း ရအောင် ပြောင်းပြီး၊
      Required က အားလုံး ရှိရအောင် ပြောင်းပါတယ်။ နှစ်ခုလုံး အပြင်ဆုံး အဆင့် တစ်ဆင့်ကိုပဲ ပြောင်းပါတယ်။
      [[mark:recap-omit]] Omit က key တွေကို ဖယ်ပြီး၊ Pick က key တွေကို ရွေးယူပါတယ်။ Pick က မရှိတဲ့ key ကို
      ငြင်းပေမယ့်၊ Omit ကတော့ လက်ခံပါတယ်။ union ပေါ်မှာ သုံးရင်တော့ member တွေကို တစ်ခုတည်း ပေါင်းချလိုက်လို့၊ distributive version ကို သုံးရပါတယ်။ နောက် lesson မှာတော့ တန်ဖိုးတွေကို ပြောင်းလဲခွင့် ပေးမလား မပေးဘူးလား ဆိုတဲ့ mutability
      နဲ့ read only ကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 6: Objects",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/objects",
        }
      - {
          title: "TypeScript Handbook: Utility Types",
          url: "https://www.typescriptlang.org/docs/handbook/utility-types.html",
        }
    actions:
      - id: open-order-3
        type: workspace.openFile
        at: { mark: recap-partial }
        path: src/order.ts
      - id: select-derived
        type: editor.select
        at: { afterAction: open-order-3 }
        target:
          { file: src/order.ts, text: "export type Receipt = Required<Order>;", occurrence: 1 }
      - id: select-omit-pick
        type: editor.select
        at: { mark: recap-omit }
        target:
          {
            file: src/order.ts,
            text: 'export type KitchenTicket = Pick<Order, "item" | "sugar" | "status">;',
            occurrence: 1,
          }
      - id: expect-file-order
        type: expect.file
        at: { afterAction: select-omit-pick }
        path: src/order.ts
        contains: 'export type NewOrder = Omit<Order, "id" | "status">;'
      - id: expect-file-functions
        type: expect.file
        at: { afterAction: expect-file-order }
        path: src/order.ts
        contains: "export function createOrder(data: NewOrder): Order {\n  return { ...data, id: nextId++, status: \"pending\" };\n}\n\nexport function updateOrder(order: Order, changes: OrderChanges): Order {"
      - id: expect-file-receipt
        type: expect.file
        at: { afterAction: expect-file-functions }
        path: src/order.ts
        contains: "export type Receipt = Required<Order>;\n//          ^?\n"
      - id: expect-file-bill
        type: expect.file
        at: { afterAction: expect-file-receipt }
        path: src/bill.ts
        contains: 'type NewPayment = DistributiveOmit<Payment, "id">;'
checks:
  - { type: timing.p95Ms, max: 300 }
