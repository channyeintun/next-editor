      main.go: "package main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n\t\"time\"\n)\n\nfunc main() {\n\tparcels := []Parcel{\n\t\t{Code: \"MDY-0001\", To: \"MDY\", WeightKg: 2.5},\n\t\t{Code: \"NPT-0001\", To: \"NPT\", WeightKg: 1},\n\t\t{Code: \"YGN-0001\", To: \"YGN\", WeightKg: 0.5},\n\t\t{Code: \"BGO-0001\", To: \"BGO\", WeightKg: 3},\n\t\t{Code: \"MLM-0001\", To: \"MLM\", WeightKg: 1.5},\n\t\t{Code: \"TGI-0001\", To: \"TGI\", WeightKg: 4},\n\t}\n}\n"
      parcel.go: "package main\n\n// Parcel is one parcel handed in at the counter.\ntype Parcel struct {\n\tCode     string  // tracking code: \"MDY-0001\"\n\tTo       string  // city code: \"MDY\"\n\tWeightKg float64 // weight in kilograms\n}\n\n// cityNames holds the cities the service sends to, by code.\nvar cityNames = map[string]string{\n\t\"YGN\": \"ရန်ကုန်\",\n\t\"BGO\": \"ပဲခူး\",\n\t\"NPT\": \"နေပြည်တော်\",\n\t\"MLM\": \"မော်လမြိုင်\",\n\t\"MDY\": \"မန္တလေး\",\n\t\"TGI\": \"တောင်ကြီး\",\n}\n"
      fees.go: "package main\n\n// perKg is added for every whole kilogram.\nconst perKg = 500\n\n// maxWeightKg is the heaviest parcel the service takes.\nconst maxWeightKg = 20.0\n\n// baseFees is the fee to each city before weight, in kyats.\nvar baseFees = map[string]int{\n\t\"YGN\": 2000,\n\t\"BGO\": 3000,\n\t\"NPT\": 4000,\n\t\"MLM\": 4500,\n\t\"MDY\": 5000,\n\t\"TGI\": 6000,\n}\n\n// Fee is the parcel's price: the city's base fee plus perKg for every whole kilogram.\nfunc (p Parcel) Fee() int {\n\treturn baseFees[p.To] + int(p.WeightKg)*perKg\n}\n"
