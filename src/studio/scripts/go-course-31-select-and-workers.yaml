# Go course, lesson 31: select and a team of workers (Burmese).
#
# Start state: parcel.go and fees.go pinned exactly as COURSE-KIT §3.4 (probe 30-pool-2); main.go
# with the import block (fmt, sync, time) and the six parcels of the morning.
# Edits, all insert-only (final state: probes/probe.ts `final`):
#   1. start, a `jobs` channel of parcel indexes, a `fees` slice with one slot per parcel; a wait
#      group, `riders := 2` and that many riders started with wg.Go, each ranging over jobs, 100 ms
#      a delivery, writing fees[i]; main sends every index, closes jobs, waits, prints fees and the
#      elapsed time -> run-1: [6000 4500 2000 4500 5000 8000] / 300ms ကြာ (probe 30-pool-2);
#   2. `riders++` under `riders := 2` -> run-2: same fees, 200ms ကြာ (probe 30-riders-var);
#   3. a late parcel's word (a goroutine that sends on `done` after one second) and a `select` on
#      done and time.After(500ms) -> run-3 adds 500ms ကျော်ပြီ၊ ဖုန်းဆက်မေးမယ် (probe 30-timeout).
# Boards: (P) the rail of parcel slips (jobs), riders taking the next slip, one pigeon-hole per
# parcel number (fees); (T) select = the desk watching the hand-over counter and the wall clock;
# (Q) the quiz (the word comes after 300 ms; probe `quiz`).
# Fixtures: bun ~/Documents/go-course-work/tools/sim-go.ts <this yaml> --write
