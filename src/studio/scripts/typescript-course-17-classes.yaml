runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: pnpm install
  runCommand: pnpm dev
  expectedPort: 5173
  environment: {}
scenes:
  - id: recall
    chapter: "Class ဆိုတာ"
    narration: >
      [[mark:start]] ပြီးခဲ့တဲ့ lesson မှာ as const နဲ့ တန်ဖိုး တစ်ခုလုံးကို ပြန်ပြင်လို့ မရအောင်
      ပိတ်ခဲ့ပါတယ်။ ဒီ lesson မှာတော့ JavaScript ရဲ့ class တွေကို TypeScript နဲ့ ဘယ်လို ရေးရလဲ ကြည့်သွားပါမယ်။
      [[mark:draw-class]] ဆိုင်မှာ အော်ဒါ မှာတိုင်း ဖြည့်ရတဲ့ ဖောင် ပုံစံ တစ်ခု ရှိတယ် ဆိုပါစို့။ ပုံစံမှာ ဘာ
      မှာလဲ၊ ဈေးနှုန်း ဘယ်လောက်လဲ ဆိုတဲ့ အကွက်တွေ ပါပြီး၊ ဖျော်ပြီးရင် အဆင်သင့် ဖြစ်ပြီလို့ မှတ်ဖို့ နေရာလည်း
      ပါပါတယ်။ class ဆိုတာ ဒီ ပုံစံနဲ့ တူပါတယ်။ object တစ်ခုမှာ ဘယ် property တွေ ပါမလဲ၊ ဘာ အလုပ်တွေ လုပ်မလဲ
      ဆိုတာကို တစ်နေရာတည်းမှာ စုရေးထားတာ ဖြစ်ပြီး၊ class ထဲက function တွေကိုတော့ method လို့ ခေါ်ပါတယ်။
      [[mark:draw-new]] ဖောင် အလွတ် တစ်စောင်ကို ဖြည့်သလိုပဲ၊ new keyword နဲ့ class ကို ခေါ်လိုက်တိုင်း ပုံစံ
      တူတဲ့ object အသစ် တစ်ခု ထွက်လာပါတယ်။ လှလှရဲ့ လက်ဖက်ရည် အော်ဒါရော၊ အောင်အောင်ရဲ့ ကော်ဖီ အော်ဒါရော
      property တွေ တူပြီး တန်ဖိုးတွေပဲ ကွဲပါတယ်။ [[mark:draw-ts]] class က JavaScript မှာ ရှိပြီးသား feature
      ဖြစ်ပြီး၊ TypeScript က သူ့ပေါ်မှာ type တွေနဲ့ ပြင်ခွင့်၊ သုံးခွင့် စစ်ဆေးချက်တွေကို ထပ်ထည့်ပေးပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 8: Classes (creating a class)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/classes",
        }
      - {
          title: "TypeScript Handbook: Classes",
          url: "https://www.typescriptlang.org/docs/handbook/2/classes.html",
        }
      - {
          title: "MDN: Classes",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Classes",
        }
    actions:
      - id: open-board-a
        type: whiteboard.apply
        at: { scene: start, offsetMs: -450 }
        open: true
        clear: true
        upsertIds: [a-title]
      - id: start-runtime
        type: runtime.start
        at: { mark: start }
        timeoutMs: 60000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: draw-class
        type: whiteboard.apply
        at: { mark: draw-class }
        upsertIds: [a-class-box, a-class-name, a-class-props, a-class-method, a-class-sub]
        drawMs: 3000
      - id: draw-new
        type: whiteboard.apply
        at: { mark: draw-new }
        upsertIds: [a-arrow-1, a-new, a-arrow-2, a-obj-1, a-obj-1-text, a-obj-2, a-obj-2-text]
        drawMs: 3600
      - id: draw-ts
        type: whiteboard.apply
        at: { mark: draw-ts }
        upsertIds: [a-ts]
        drawMs: 1500

  - id: starter
    narration: >
      [[mark:close-board]] ဒါဆို ဆိုင်ရဲ့ code ထဲမှာ ကြည့်ရအောင်။ [[mark:open-order]] ဒါက အော်ဒါ class ကို JavaScript မှာ
      ရေးနေကျ ပုံစံအတိုင်း ရေးထားတဲ့ ဖိုင်ပါ။ [[mark:select-constructor]] constructor ဆိုတာ new နဲ့ object
      ဆောက်တိုင်း အလိုအလျောက် run တဲ့ function ပါ။ ဒီ constructor က ပစ္စည်း နာမည်နဲ့ ဈေးနှုန်းကို argument အနေနဲ့
      လက်ခံပြီး၊ parameter တွေမှာ type ရေးထားပါတယ်။ [[mark:select-assign]] ပြီးတော့ အဲဒီ တန်ဖိုး နှစ်ခုကို
      this ပေါ်မှာ သိမ်းပါတယ်။ this ဆိုတာ အခု ဆောက်နေတဲ့ object ကိုယ်တိုင်ပါ။ [[mark:select-method]] အောက်က
      method ကတော့ အော်ဒါရဲ့ status ကို အဆင်သင့် ဖြစ်ပြီလို့ ပြောင်းပေးပါတယ်။ [[mark:open-main]] main
      ဖိုင်မှာတော့ လက်ဖက်ရည် အော်ဒါ တစ်ခုကို new နဲ့ ဆောက်ပြီး၊ [[mark:select-log]] အဲဒီ object ကို Output မှာ
      ထုတ်ပြပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 8: Classes (adding a constructor, constructor arguments)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/classes",
        }
      - {
          title: "MDN: constructor",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Classes/constructor",
        }
    actions:
      - id: close-board
        type: whiteboard.apply
        at: { mark: close-board }
        open: false
      - id: open-order
        type: workspace.openFile
        at: { mark: open-order }
        path: src/order.ts
      - id: select-constructor
        type: editor.select
        at: { mark: select-constructor }
        target:
          { file: src/order.ts, text: "constructor(item: string, price: number)", occurrence: 1 }
      - id: select-assign
        type: editor.select
        at: { mark: select-assign }
        target:
          {
            file: src/order.ts,
            text: "    this.item = item;\n    this.price = price;",
            occurrence: 1,
          }
      - id: select-method
        type: editor.select
        at: { mark: select-method }
        target:
          {
            file: src/order.ts,
            text: "  markReady() {\n    this.status = \"ready\";\n  }",
            occurrence: 1,
          }
      - id: open-main
        type: workspace.openFile
        at: { mark: open-main }
        path: src/main.ts
      - id: select-new
        type: editor.select
        at: { afterAction: open-main }
        target: { file: src/main.ts, text: 'new TeaOrder("လက်ဖက်ရည်", 1500)', occurrence: 1 }
      - id: select-log
        type: editor.select
        at: { mark: select-log }
        target: { file: src/main.ts, text: "console.log(order);", occurrence: 1 }

  - id: symptoms
    narration: >
      [[mark:panel-ready]] ညာဘက် panel ရဲ့ Output မှာ class ရဲ့ နာမည်နဲ့အတူ ပစ္စည်း နာမည်နဲ့ ဈေးနှုန်း ပါတဲ့
      object ကို မြင်ရပါတယ်။ JavaScript အနေနဲ့ ဒီ code က ကောင်းကောင်း အလုပ်လုပ်ပါတယ်။ [[mark:read-errors]]
      ဒါပေမဲ့ Errors မှာ error သုံးခု ရှိပါတယ်။ ပစ္စည်း နာမည်၊ ဈေးနှုန်းနဲ့ status ဆိုတဲ့ property တွေ
      TeaOrder type ပေါ်မှာ မရှိဘူးလို့ ပြောနေတာပါ။ TypeScript က class မှာ ဘယ် property တွေ ရှိလဲ ဆိုတာကို
      class ထဲမှာ ကြိုပြီး ကြေညာထားစေချင်လို့ပါ။
    sources:
      - {
          title: "TypeScript Handbook: Classes (fields)",
          url: "https://www.typescriptlang.org/docs/handbook/2/classes.html#fields",
        }
      - {
          title: "Total TypeScript Essentials, ch. 8: Classes",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/classes",
        }
    actions:
      - id: wait-ready
        type: runtime.waitForReady
        at: { mark: panel-ready }
        timeoutMs: 30000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-ready }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: expect-three-errors
        type: expect.preview
        at: { afterAction: open-preview }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "3" }
        retry: { maxAttempts: 3, delayMs: 500 }
      - id: expect-missing-item
        type: expect.preview
        at: { afterAction: expect-three-errors }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Property 'item' does not exist on type 'TeaOrder'."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-missing-status
        type: expect.preview
        at: { afterAction: expect-missing-item }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-3 }
        textContains: "Property 'status' does not exist on type 'TeaOrder'."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-start-output
        type: expect.preview
        at: { afterAction: expect-missing-status }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-1 }
        textContains: "TeaOrder { item: 'လက်ဖက်ရည်', price: 1500 }"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: declare
    chapter: "Property တွေ ကြေညာခြင်း"
    narration: >
      [[mark:open-order-2]] အော်ဒါ ဖိုင်ကို ပြန်သွားရအောင်။ [[mark:type-fields]] class ရဲ့ အစမှာ property
      နှစ်ခုကို နာမည်ပဲ ရေးပြီး ကြေညာလိုက်ပါမယ်။ type ကိုတော့ မရေးထားပါဘူး။ [[mark:read-fields]] error နှစ်ခု
      ပျောက်ပြီး status ရဲ့ error ပဲ ကျန်ပါတော့တယ်။ [[mark:type-query-item]] type မရေးထားတော့ ဘာ type
      ဖြစ်နေလဲ၊ query comment နဲ့ ကြည့်ရအောင်။ [[mark:read-query-item]] ပစ္စည်း နာမည်က string လို့ ပြနေပါတယ်။
      constructor ထဲမှာ string parameter ကို ဒီ property ထဲ ထည့်ထားတာကို ဖတ်ပြီး TypeScript က infer
      လုပ်ထားတာပါ။ ဒါကြောင့် type ကို အမြဲ ရေးစရာ မလိုပေမယ့်၊ ဖတ်တဲ့သူ ချက်ချင်း မြင်ရအောင် ကိုယ်တိုင်
      ရေးထားတာလည်း အသုံးများပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 8: Classes (you don't always need to type class properties)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/classes",
        }
      - {
          title: "TypeScript 4.0 release notes: class property inference from constructors",
          url: "https://www.typescriptlang.org/docs/handbook/release-notes/typescript-4-0.html#class-property-inference-from-constructors",
        }
    actions:
      - id: open-order-2
        type: workspace.openFile
        at: { mark: open-order-2 }
        path: src/order.ts
      - id: type-fields
        type: editor.type
        at: { mark: type-fields }
        target: { file: src/order.ts, after: "export class TeaOrder {\n", occurrence: 1 }
        text: "  item;\n  price;\n\n"
      - id: expect-one-error
        type: expect.preview
        at: { afterAction: type-fields }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-status-left
        type: expect.preview
        at: { afterAction: expect-one-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Property 'status' does not exist on type 'TeaOrder'."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-query-item
        type: editor.type
        at: { mark: type-query-item }
        target: { file: src/order.ts, after: "  item;\n", occurrence: 1 }
        text: "  // ^?\n"
      - id: expect-item-type
        type: expect.preview
        at: { afterAction: type-query-item }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-1 }
        attribute: { name: data-type, value: "(property) TeaOrder.item: string" }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: initializers
    narration: >
      [[mark:type-defaults]] ခွက်ရေနဲ့ status ကိုတော့ ကြေညာတဲ့ နေရာမှာပဲ စ တန်ဖိုး ပေးလိုက်ပါမယ်။ ခွက်ရေ
      တစ်ခွက်နဲ့ status pending ကနေ စပါမယ်။ [[mark:read-defaults]] error အားလုံး ပျောက်ပြီး၊ Output က object
      မှာလည်း ခွက်ရေနဲ့ status ပါလာပါပြီ။ ဒီ စ တန်ဖိုးတွေက constructor ရဲ့ code မ run ခင် object ထဲ
      ရောက်နေပါတယ်။ [[mark:type-query-status]] status ရဲ့ type ကိုလည်း ကြည့်ရအောင်။ [[mark:read-query-status]]
      pending ဆိုတဲ့ literal type မဟုတ်ဘဲ string လို့ ပြနေပါတယ်။ class property က နောက်မှ ပြောင်းလို့
      ရတဲ့အတွက် type ကို ကျယ်ကျယ် infer လုပ်တာပါ။ ဒါကြောင့် method ထဲမှာ ready ကို ထည့်လို့ ရတာပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 8: Classes (class property initializers)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/classes",
        }
      - {
          title: "TypeScript Handbook: Classes (fields, initializers)",
          url: "https://www.typescriptlang.org/docs/handbook/2/classes.html#fields",
        }
      - {
          title: "MDN: Public class fields",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Classes/Public_class_fields",
        }
    actions:
      - id: type-defaults
        type: editor.type
        at: { mark: type-defaults }
        target: { file: src/order.ts, after: "  price;\n", occurrence: 1 }
        text: "  cups = 1;\n  status = \"pending\";\n"
        cadence: fast-explainer
      - id: expect-no-errors-1
        type: expect.preview
        at: { afterAction: type-defaults }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-defaults-output
        type: expect.preview
        at: { afterAction: expect-no-errors-1 }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-1 }
        textContains: "cups: 1, status: 'pending'"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-query-status
        type: editor.type
        at: { mark: type-query-status }
        target: { file: src/order.ts, after: "  status = \"pending\";\n", occurrence: 1 }
        text: "  // ^?\n"
      - id: expect-status-type
        type: expect.preview
        at: { afterAction: type-query-status }
        timeoutMs: 8000
        target: { by: testId, value: ts-type-2 }
        attribute: { name: data-type, value: "(property) TeaOrder.status: string" }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: optional
    narration: >
      [[mark:type-note]] အော်ဒါ တချို့မှာ ပါတတ်တဲ့ မှတ်ချက် property ကို string type နဲ့ ထည့်ပါမယ်။
      constructor ထဲမှာတော့ ဘာမှ မထည့်ပါဘူး။ [[mark:read-note-error]] error အသစ် ပေါ်လာပါပြီ။ မှတ်ချက်ကို စ
      တန်ဖိုးလည်း မပေး၊ constructor ထဲမှာလည်း မထည့်ထားဘူးလို့ ပြောနေတာပါ။ Output မှာလည်း မှတ်ချက်က undefined
      ဖြစ်နေပါတယ်။ string လို့ ကြေညာထားပေမယ့် တကယ်တမ်း တန်ဖိုး မရှိတာကို သတိပေးနေတာပါ။ [[mark:type-optional]] မှတ်ချက်က
      မပါလည်း ရတဲ့ property ဖြစ်လို့ နာမည်နောက်မှာ question mark ထည့်ပြီး optional လုပ်လိုက်ပါမယ်။
      [[mark:read-optional]] error ပျောက်ပြီး၊ မှတ်ချက်ရဲ့ type က string ဒါမှမဟုတ် undefined
      ဖြစ်သွားပါပြီ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 8: Classes (optional class properties)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/classes",
        }
      - {
          title: "TSConfig: strictPropertyInitialization",
          url: "https://www.typescriptlang.org/tsconfig/#strictPropertyInitialization",
        }
    actions:
      - id: type-note
        type: editor.type
        at: { mark: type-note }
        target: { file: src/order.ts, after: "  status = \"pending\";\n  // ^?\n", occurrence: 1 }
        text: "  note: string;\n"
      # Typing "note: string" passes through other one-error states (TS7008 at "note",
      # TS2304 at "note: s"), so the first check waits for the code only the last key gives.
      - id: expect-note-error
        type: expect.preview
        at: { afterAction: type-note }
        timeoutMs: 8000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-code, value: "2564" }
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-note-count
        type: expect.preview
        at: { afterAction: expect-note-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-note-message
        type: expect.preview
        at: { afterAction: expect-note-count }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Property 'note' has no initializer and is not definitely assigned in the constructor."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-note-undefined
        type: expect.preview
        at: { afterAction: expect-note-message }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-1 }
        textContains: "note: undefined"
        retry: { maxAttempts: 3, delayMs: 300 }
      - id: type-optional
        type: editor.type
        at: { mark: type-optional }
        target: { file: src/order.ts, after: "  note", occurrence: 1 }
        text: "?"
      - id: expect-no-errors-2
        type: expect.preview
        at: { afterAction: type-optional }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }

  - id: getter
    chapter: "Getter နဲ့ class type"
    narration: >
      [[mark:type-getter]] အခု ကျသင့်ငွေကို တွက်ပေးတဲ့ getter ထည့်ပါမယ်။ getter ဆိုတာ ရှေ့မှာ get keyword
      ပါတဲ့ method ပါ။ ကွင်းနဲ့ မခေါ်ဘဲ property လိုပဲ ဖတ်ရပြီး၊ ဖတ်လိုက်တိုင်း ဈေးနှုန်းကို ခွက်ရေနဲ့
      မြှောက်ပြီး တွက်ပေးပါတယ်။ [[mark:open-main-2]] main ဖိုင်မှာ ဘောင်ချာ ထုတ်တဲ့ function တစ်ခု ရေးပါမယ်။
      [[mark:type-receipt]] ဒီ function ရဲ့ parameter ကို TeaOrder လို့ ကြေညာထားပါတယ်။ class ကို
      ကြေညာလိုက်တာနဲ့ သူ့နာမည်က type တစ်ခုလည်း ဖြစ်သွားလို့ပါ။ [[mark:read-receipt]] Output မှာ လက်ဖက်ရည်
      တစ်ခွက် ၁၅၀၀ ကျပ် ဆိုတဲ့ ဘောင်ချာ ပေါ်လာပါပြီ။ ဆိုတော့ class နာမည် တစ်ခုတည်းကို
      object ဆောက်ဖို့ရော၊ type အနေနဲ့ပါ သုံးလို့ ရပါတယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 8: Classes (using a class as a type)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/classes",
        }
      - {
          title: "TypeScript Handbook: Classes (getters / setters)",
          url: "https://www.typescriptlang.org/docs/handbook/2/classes.html#getters--setters",
        }
      - {
          title: "MDN: get",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Functions/get",
        }
    actions:
      - id: type-getter
        type: editor.type
        at: { mark: type-getter }
        target: { file: src/order.ts, after: "    this.price = price;\n  }\n", occurrence: 1 }
        text: "\n  get total() {\n    return this.price * this.cups;\n  }\n"
        cadence: line-by-line
      - id: open-main-2
        type: workspace.openFile
        at: { mark: open-main-2 }
        path: src/main.ts
      - id: type-receipt
        type: editor.type
        at: { mark: type-receipt }
        target: { file: src/main.ts, after: "console.log(order);\n", occurrence: 1 }
        text: "\nfunction printReceipt(order: TeaOrder) {\n  console.log(order.item, order.cups, \"ခွက်\", order.total, \"ကျပ်\");\n}\nprintReceipt(order);\n"
        cadence: line-by-line
      - id: expect-receipt
        type: expect.preview
        at: { afterAction: type-receipt }
        timeoutMs: 8000
        target: { by: testId, value: ts-out-2 }
        textContains: "လက်ဖက်ရည် 1 ခွက် 1500 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-receipt-clean
        type: expect.preview
        at: { afterAction: expect-receipt }
        timeoutMs: 5000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: readonly
    chapter: "readonly၊ private နဲ့ hash field"
    narration: >
      [[mark:type-free]] အော်ဒါ ဆောက်ပြီးမှ တစ်ယောက်ယောက်က ဈေးနှုန်းကို သုည ပြောင်းလိုက်ရင် ဘာဖြစ်မလဲ
      ကြည့်ရအောင်။ [[mark:read-free]] error မပေါ်ဘဲ ဘောင်ချာက သုည ကျပ် ဖြစ်သွားပါပြီ။ ဆိုင်အတွက်တော့ bug ပါ။
      [[mark:open-order-3]] ဒါကြောင့် အော်ဒါ ဖိုင်မှာ ဈေးနှုန်းရဲ့ ရှေ့မှာ read only လို့ ထည့်ပါမယ်။ read only
      property ကို constructor ထဲမှာ ထည့်လို့ ရပေမယ့် ပြီးရင် ပြန်ပြင်ခွင့် မရှိပါဘူး။ [[mark:read-readonly]]
      main ဖိုင်က line မှာ read only property ကို တန်ဖိုး အသစ် ပေးလို့ မရဘူး ဆိုတဲ့ error ပေါ်လာပါပြီ။ ဒါပေမဲ့ Output
      မှာ သုည ကျပ် ဆက်ဖြစ်နေတာ သတိထား ကြည့်ပါ။ read only က type ပိုင်းက စစ်ဆေးချက် ဖြစ်လို့ runtime မှာ ဘာမှ
      မတားပါဘူး။ [[mark:open-main-3]] ဒါကြောင့် ဒီ line ကို comment လုပ်ပြီး ပိတ်လိုက်ပါမယ်။
      [[mark:read-comment-free]] ဘောင်ချာက ၁၅၀၀ ကျပ် ပြန်ဖြစ်သွားပါပြီ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 8: Classes (readonly class properties)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/classes",
        }
      - {
          title: "TypeScript Handbook: Classes (readonly)",
          url: "https://www.typescriptlang.org/docs/handbook/2/classes.html#readonly",
        }
    actions:
      - id: type-free
        type: editor.type
        at: { mark: type-free }
        target: { file: src/main.ts, after: "new TeaOrder(\"လက်ဖက်ရည်\", 1500);\n", occurrence: 1 }
        text: "order.price = 0;\n"
        cadence: fast-explainer
      - id: expect-free
        type: expect.preview
        at: { afterAction: type-free }
        timeoutMs: 8000
        target: { by: testId, value: ts-out-2 }
        textContains: "လက်ဖက်ရည် 1 ခွက် 0 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-free-no-error
        type: expect.preview
        at: { afterAction: expect-free }
        timeoutMs: 5000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: open-order-3
        type: workspace.openFile
        at: { mark: open-order-3 }
        path: src/order.ts
      - id: type-readonly
        type: editor.type
        at: { afterAction: open-order-3 }
        target: { file: src/order.ts, after: "  // ^?\n  ", occurrence: 1 }
        text: "readonly "
      - id: expect-readonly-count
        type: expect.preview
        at: { afterAction: type-readonly }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-readonly-error
        type: expect.preview
        at: { afterAction: expect-readonly-count }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-code, value: "2540" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-readonly-message
        type: expect.preview
        at: { afterAction: expect-readonly-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Cannot assign to 'price' because it is a read-only property."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-still-free
        type: expect.preview
        at: { afterAction: expect-readonly-message }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-2 }
        textContains: "1 ခွက် 0 ကျပ်"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: open-main-3
        type: workspace.openFile
        at: { mark: open-main-3 }
        path: src/main.ts
      - id: type-comment-free
        type: editor.type
        at: { afterAction: open-main-3 }
        target: { file: src/main.ts, after: "1500);\n", occurrence: 1 }
        text: "// "
      - id: expect-no-errors-3
        type: expect.preview
        at: { afterAction: type-comment-free }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-price-back
        type: expect.preview
        at: { afterAction: expect-no-errors-3 }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-2 }
        textContains: "1 ခွက် 1500 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: private
    narration: >
      [[mark:open-order-4]] ဆက်ပြီး လျှော့ဈေး property တစ်ခု ထည့်ပါမယ်။ class ရဲ့ property တွေက default
      အားဖြင့် public ဖြစ်လို့ ဘယ်ကနေမဆို သုံးလို့ ရပါတယ်။ public keyword ကို ရေးရေး မရေးရေး အတူတူပါပဲ။
      [[mark:type-private]] လျှော့ဈေးကို class ထဲကပဲ စီမံချင်လို့ ရှေ့မှာ private လို့ ရေးထားပါတယ်။ private ဆိုတာ class ရဲ့
      အပြင်ကနေ သုံးခွင့် မပေးတဲ့ property ပါ။ [[mark:type-subtract]] getter မှာလည်း လျှော့ဈေးကို နုတ်ပေးပါမယ်။ getter က class ထဲက code ဖြစ်လို့ private
      property ကို သုံးခွင့် ရှိပါတယ်။
      [[mark:open-main-4]] အခု main ဖိုင်ကနေ လျှော့ဈေး ၈၀၀ ကျပ် ထည့်ကြည့်ရအောင်။ [[mark:read-private]] private
      ဖြစ်လို့ class ထဲမှာပဲ သုံးလို့ ရတယ် ဆိုတဲ့ error ပေါ်လာပါပြီ။ ဒါပေမဲ့ Output မှာ ဘောင်ချာက ၇၀၀ ကျပ်
      ဖြစ်သွားပြီး၊ object ထဲမှာလည်း ၈၀၀ ကို မြင်ရပါတယ်။ ဆိုတော့ private ကလည်း type ပိုင်းက စစ်ဆေးချက် သက်သက်
      ဖြစ်ပြီး၊ runtime မှာ ဘယ်သူမဆို ပြင်လို့ ရနေဆဲပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 8: Classes (public and private properties)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/classes",
        }
      - {
          title: "TypeScript Handbook: Classes (private)",
          url: "https://www.typescriptlang.org/docs/handbook/2/classes.html#private",
        }
    actions:
      - id: open-order-4
        type: workspace.openFile
        at: { mark: open-order-4 }
        path: src/order.ts
      - id: type-private
        type: editor.type
        at: { mark: type-private }
        target: { file: src/order.ts, after: "  note?: string;\n", occurrence: 1 }
        text: "  private discount = 0;\n"
        cadence: fast-explainer
      - id: type-subtract
        type: editor.type
        at: { mark: type-subtract }
        target: { file: src/order.ts, after: "return this.price * this.cups", occurrence: 1 }
        text: " - this.discount"
        cadence: fast-explainer
      - id: open-main-4
        type: workspace.openFile
        at: { mark: open-main-4 }
        path: src/main.ts
      - id: type-discount
        type: editor.type
        at: { afterAction: open-main-4 }
        target: { file: src/main.ts, after: "// order.price = 0;\n", occurrence: 1 }
        text: "order.discount = 800;\n"
        cadence: fast-explainer
      # Typing "order.discount = 800;" passes through other one-error states (TS2304 at "o",
      # TS2339 at "order.d"), so the first check waits for the total only "= 800" gives.
      - id: expect-private-total
        type: expect.preview
        at: { afterAction: type-discount }
        timeoutMs: 8000
        target: { by: testId, value: ts-out-2 }
        textContains: "1 ခွက် 700 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-private-count
        type: expect.preview
        at: { afterAction: expect-private-total }
        timeoutMs: 5000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-private-error
        type: expect.preview
        at: { afterAction: expect-private-count }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        attribute: { name: data-code, value: "2341" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-private-message
        type: expect.preview
        at: { afterAction: expect-private-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Property 'discount' is private and only accessible within class 'TeaOrder'."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-private-visible
        type: expect.preview
        at: { afterAction: expect-private-message }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-1 }
        textContains: "discount: 800"
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: hash
    narration: >
      [[mark:open-order-5]] runtime မှာပါ တကယ် ပိတ်ချင်ရင် JavaScript ရဲ့ private field ကို သုံးရပါတယ်။
      [[mark:type-hash]] နာမည်ရဲ့ ရှေ့မှာ hash သင်္ကေတ ပါတဲ့ field ပါ။ private line ကို comment လုပ်ပြီး hash
      နဲ့ line အသစ် ရေးပါမယ်။ getter ထဲမှာလည်း အဲဒီ နာမည်ကို ပြောင်းသုံးပါမယ်။ [[mark:read-hash]] main ဖိုင်က
      error က TeaOrder မှာ ဒီ property မရှိဘူးလို့ ပြောင်းသွားပြီး၊ ဘောင်ချာက ၁၅၀၀ ကျပ် ပြန်ဖြစ်သွားပါပြီ။
      object ထဲက ၈၀၀ ကတော့ အပြင်က code ထည့်လိုက်တဲ့ သီးသန့် property ပဲ ဖြစ်ပါတယ်။ hash field ကို class
      အပြင်ကနေ ဖတ်တာ ပြင်တာကို JavaScript ကိုယ်တိုင်က ခွင့်မပြုလို့ပါ။ [[mark:type-setter]] ဒါဆို အပြင်ကနေ
      လျှော့ဈေး ပေးချင်ရင် setter ကို သုံးလို့ ရပါတယ်။ setter ဆိုတာ ရှေ့မှာ set keyword ပါတဲ့ method ဖြစ်ပြီး၊
      ဒီ နာမည်ကို တန်ဖိုး ထည့်တိုင်း run ပါတယ်။ ဒီ setter က လျှော့ဈေးကို ၅၀၀ ကျပ်ထက် မပိုအောင် ကန့်သတ်ပါတယ်။
      [[mark:read-setter]] error ပျောက်ပြီး ဘောင်ချာက ၁၀၀၀ ကျပ် ဖြစ်သွားပါပြီ။ ၈၀၀ ထည့်ပေမယ့် setter က ၅၀၀ ပဲ
      လက်ခံလိုက်တာပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 8: Classes (runtime private properties)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/classes",
        }
      - {
          title: "MDN: Private properties",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Classes/Private_properties",
        }
      - {
          title: "TypeScript Handbook: Classes (caveats: private vs #)",
          url: "https://www.typescriptlang.org/docs/handbook/2/classes.html#caveats",
        }
      - {
          title: "MDN: set",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Functions/set",
        }
    actions:
      - id: open-order-5
        type: workspace.openFile
        at: { mark: open-order-5 }
        path: src/order.ts
      - id: type-hash
        type: editor.type
        at: { mark: type-hash }
        target: { file: src/order.ts, after: "  note?: string;\n  ", occurrence: 1 }
        text: "#discount = 0;\n  // "
        cadence: block
      - id: type-hash-getter
        type: editor.type
        at: { afterAction: type-hash }
        target: { file: src/order.ts, after: "this.cups - this.", occurrence: 1 }
        text: "#"
        cadence: fast-explainer
      # Before these edits the panel already shows one error (TS2341, private), and between
      # them ts-error-1 reads "… does not exist … Did you mean '#discount'?" (TS2551) while the
      # receipt stays 700. Only the finished getter brings the receipt back to 1500, so wait for it.
      - id: expect-hash-total
        type: expect.preview
        at: { afterAction: type-hash-getter }
        timeoutMs: 8000
        target: { by: testId, value: ts-out-2 }
        textContains: "1 ခွက် 1500 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 1200 }
      - id: expect-hash-error
        type: expect.preview
        at: { afterAction: expect-hash-total }
        timeoutMs: 5000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "1" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-hash-message
        type: expect.preview
        at: { afterAction: expect-hash-error }
        timeoutMs: 5000
        target: { by: testId, value: ts-error-1 }
        textContains: "Property 'discount' does not exist on type 'TeaOrder'."
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-hash-stray
        type: expect.preview
        at: { afterAction: expect-hash-message }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-1 }
        textContains: "discount: 800"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: type-setter
        type: editor.type
        at: { mark: type-setter }
        target: { file: src/order.ts, after: "this.cups - this.#discount;\n  }\n", occurrence: 1 }
        text: "\n  set discount(amount: number) {\n    this.#discount = Math.min(amount, 500);\n  }\n"
        cadence: line-by-line
      - id: expect-no-errors-4
        type: expect.preview
        at: { afterAction: type-setter }
        timeoutMs: 8000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-setter-total
        type: expect.preview
        at: { afterAction: expect-no-errors-4 }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-2 }
        textContains: "1 ခွက် 1000 ကျပ်"
        retry: { maxAttempts: 3, delayMs: 300 }

  - id: this
    chapter: "Method နဲ့ this"
    narration: >
      [[mark:open-main-5]] နောက်ဆုံး အော်ဒါကို အဆင်သင့် ဖြစ်ပြီလို့ မှတ်ကြည့်ရအောင်။ [[mark:type-detach]]
      ဒီတစ်ခါ method ကို variable တစ်ခုထဲ ခွဲထုတ်ပြီးမှ ခေါ်ပါမယ်။ ခလုတ် နှိပ်ရင် ခေါ်ဖို့ method ကို
      ပို့ပေးတဲ့အခါ ဒီလို ဖြစ်တတ်ပါတယ်။ [[mark:read-crash]] Output ရဲ့ နောက်ဆုံးမှာ undefined ပေါ်မှာ status
      ကို ထည့်လို့ မရဘူး ဆိုတဲ့ အနီရောင် error နဲ့ program ရပ်သွားပါတယ်။ Errors မှာတော့ error တစ်ခုမှ
      မရှိပါဘူး။ TypeScript က ဖမ်းမပေးနိုင်တဲ့ ပြဿနာ ဖြစ်လို့ပါ။ [[mark:board-this]] ဘာကြောင့်လဲဆိုတော့ method ထဲက this က method ကို
      ဘယ်လို ခေါ်လဲ ဆိုတာပေါ် မူတည်လို့ပါ။ [[mark:draw-this-dot]] object ကနေ တိုက်ရိုက် ခေါ်ရင် this က အဲဒီ
      object ပါ။ [[mark:draw-this-alone]] သီးသန့် ခေါ်ရင်တော့ ရှေ့မှာ object မရှိလို့ this က undefined
      ဖြစ်သွားပါတယ်။ [[mark:draw-this-arrow]] arrow function ကတော့ this ကို သူ့ကို ဖန်တီးတဲ့ နေရာကနေ
      ယူထားလို့၊ class ထဲမှာ arrow function property အနေနဲ့ ရေးရင် ဘယ်လိုပဲ ခေါ်ခေါ် this က ဒီ object ပဲ
      ဖြစ်ပါတယ်။ [[mark:close-board-this]] ဒါဆို method ကို arrow function property ပြောင်းကြည့်ရအောင်။
      [[mark:type-arrow]] method ရဲ့ နာမည်နောက်မှာ arrow function ကို တန်ဖိုး အဖြစ် ပေးလိုက်တာ ဖြစ်ပြီး၊ ထဲက
      code ကတော့ အရင်အတိုင်းပါပဲ။ [[mark:read-arrow]] အနီရောင် error ပျောက်ပြီး နောက်ဆုံး line မှာ ready
      ပေါ်လာပါပြီ။ ပထမ line က object ထဲမှာလည်း ဒီ function ကို မြင်ရပါတယ်။ arrow function property က object
      တစ်ခုစီမှာ ကိုယ်ပိုင် function ရှိပြီး၊ သာမန် method ကိုတော့ object အားလုံးက မျှသုံးလို့ပါ။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 8: Classes (arrow functions or class methods?)",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/classes",
        }
      - {
          title: "TypeScript Handbook: Classes (this at runtime, arrow functions)",
          url: "https://www.typescriptlang.org/docs/handbook/2/classes.html#arrow-functions",
        }
      - {
          title: "MDN: this (class context, callbacks)",
          url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/this",
        }
    actions:
      - id: open-main-5
        type: workspace.openFile
        at: { mark: open-main-5 }
        path: src/main.ts
      - id: type-detach
        type: editor.type
        at: { mark: type-detach }
        target: { file: src/main.ts, after: "printReceipt(order);\n", occurrence: 1 }
        text: "\nconst ready = order.markReady;\nready();\nconsole.log(order.status);\n"
        cadence: line-by-line
      - id: expect-crash
        type: expect.preview
        at: { afterAction: type-detach }
        timeoutMs: 8000
        target: { by: testId, value: ts-out-3 }
        textContains: "Uncaught TypeError: Cannot set properties of undefined (setting 'status')"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-crash-level
        type: expect.preview
        at: { afterAction: expect-crash }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-3 }
        attribute: { name: data-level, value: "error" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-crash-no-error
        type: expect.preview
        at: { afterAction: expect-crash-level }
        timeoutMs: 5000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: open-board-b
        type: whiteboard.apply
        at: { mark: board-this }
        open: true
        clear: true
        upsertIds: [b-title]
      - id: draw-this-dot
        type: whiteboard.apply
        at: { mark: draw-this-dot }
        upsertIds: [b-dot]
        drawMs: 1400
      - id: draw-this-alone
        type: whiteboard.apply
        at: { mark: draw-this-alone }
        upsertIds: [b-alone]
        drawMs: 1400
      - id: draw-this-arrow
        type: whiteboard.apply
        at: { mark: draw-this-arrow }
        upsertIds: [b-arrow]
        drawMs: 1400
      - id: close-board-this
        type: whiteboard.apply
        at: { mark: close-board-this }
        open: false
      - id: open-order-6
        type: workspace.openFile
        at: { mark: close-board-this, offsetMs: 700 }
        path: src/order.ts
      - id: type-arrow-equals
        type: editor.type
        at: { mark: type-arrow }
        target: { file: src/order.ts, after: "  markReady", occurrence: 1 }
        text: " = "
        cadence: fast-explainer
      - id: type-arrow-head
        type: editor.type
        at: { afterAction: type-arrow-equals }
        target: { file: src/order.ts, after: "  markReady = ()", occurrence: 1 }
        text: " =>"
        cadence: fast-explainer
      - id: type-arrow-semicolon
        type: editor.type
        at: { afterAction: type-arrow-head }
        target: { file: src/order.ts, after: "    this.status = \"ready\";\n  }", occurrence: 1 }
        text: ";"
        cadence: fast-explainer
      - id: expect-ready
        type: expect.preview
        at: { afterAction: type-arrow-semicolon }
        timeoutMs: 8000
        target: { by: testId, value: ts-out-3 }
        textContains: "ready"
        retry: { maxAttempts: 3, delayMs: 600 }
      - id: expect-ready-level
        type: expect.preview
        at: { afterAction: expect-ready }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-3 }
        attribute: { name: data-level, value: "log" }
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-arrow-own
        type: expect.preview
        at: { afterAction: expect-ready-level }
        timeoutMs: 5000
        target: { by: testId, value: ts-out-1 }
        textContains: "markReady: [Function: markReady]"
        retry: { maxAttempts: 2, delayMs: 300 }
      - id: expect-no-errors-5
        type: expect.preview
        at: { afterAction: expect-arrow-own }
        timeoutMs: 5000
        target: { by: testId, value: ts-status }
        attribute: { name: data-count, value: "0" }
        retry: { maxAttempts: 2, delayMs: 300 }

  - id: recap
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ class က property တွေ၊ constructor နဲ့ method တွေကို စုထားတဲ့ ပုံစံ
      ဖြစ်ပြီး new နဲ့ object ဆောက်ပါတယ်။ property တွေကို class ထဲမှာ ကြေညာရပြီး type ကို infer
      လုပ်နိုင်ပါတယ်။ class နာမည်ကလည်း type တစ်ခုပါ။ [[mark:recap-private]] read only နဲ့ private က type
      ပိုင်းမှာပဲ တားပြီး၊ hash field က runtime မှာပါ ပိတ်ပါတယ်။ getter နဲ့ setter က property လို သုံးရတဲ့
      method တွေ ဖြစ်ပြီး၊ this မပျောက်စေချင်ရင် arrow function property ကို သုံးပါတယ်။ နောက် lesson မှာတော့
      class တစ်ခုကနေ အမွေဆက်ခံတဲ့ class inheritance ကို ကြည့်သွားပါမယ်။
    sources:
      - {
          title: "Total TypeScript Essentials, ch. 8: Classes",
          url: "https://www.totaltypescript.com/books/total-typescript-essentials/classes",
        }
      - {
          title: "TypeScript Handbook: Classes",
          url: "https://www.typescriptlang.org/docs/handbook/2/classes.html",
        }
    actions:
      - id: select-recap
        type: editor.select
        at: { mark: recap }
        target: { file: src/order.ts, text: "  readonly price;", occurrence: 1 }
      - id: select-recap-private
        type: editor.select
        at: { mark: recap-private }
        target: { file: src/order.ts, text: "  #discount = 0;", occurrence: 1 }
      - id: expect-file-fields
        type: expect.file
        at: { afterAction: select-recap-private }
        path: src/order.ts
        contains: "  item;\n  // ^?\n  readonly price;\n  cups = 1;\n  status = \"pending\";\n  // ^?\n  note?: string;\n  #discount = 0;\n  // private discount = 0;\n"
      - id: expect-file-accessors
        type: expect.file
        at: { afterAction: expect-file-fields }
        path: src/order.ts
        contains: "  get total() {\n    return this.price * this.cups - this.#discount;\n  }\n\n  set discount(amount: number) {\n    this.#discount = Math.min(amount, 500);\n  }\n"
      - id: expect-file-arrow
        type: expect.file
        at: { afterAction: expect-file-accessors }
        path: src/order.ts
        contains: "  markReady = () => {\n    this.status = \"ready\";\n  };\n"
      - id: expect-file-main
        type: expect.file
        at: { afterAction: expect-file-arrow }
        path: src/main.ts
        contains: "// order.price = 0;\norder.discount = 800;\nconsole.log(order);\n"
checks:
  - { type: timing.p95Ms, max: 300 }
