build:
  # Studio replaces this built-in profile at render time with the Burmese
  # provider chosen in the render console.
  voiceProfile: pocket-alba-v1
  seed: 9326

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
  - id: need
    chapter: ဘာက တားပေးမလဲ
    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ Claude Code က chat tool နဲ့ မတူဘဲ repository ထဲမှာ ကိုယ်တိုင် ဖတ်၊ လုပ်ဆောင်၊ ရလဒ်ကို
      စစ်တဲ့ coding agent ဖြစ်ကြောင်း ကြည့်ခဲ့ပါတယ်။
      [[mark:sel-billing]] Billing team lead မောင်မောင် ရဲ့ တကယ့် စိုးရိမ်ချက်က အဲဒီ စွမ်းရည်ကိုယ်တိုင်ပါ။ Claude Code က
      file ပြင်နိုင်တယ်၊ command run နိုင်တယ် ဆိုရင်၊ ငွေတောင်းခံတဲ့ code ကို မပြင်သင့်ဘဲ ပြင်တာ၊ git push လို
      ပြန်ရုပ်သိမ်းရခက်တဲ့ command ကို run တာကနေ ဘာက တားပေးမလဲ ဆိုတာပါ။ ကိုးနှစ်ရှိ codebase မှာ ဒါက
      သဘာဝကျတဲ့ မေးခွန်းပါ။
      [[mark:need-2]] ပထမဆုံး prompt ကတော့ ရိုးရှင်းပါတယ်။ ဒီ project က ဘာလုပ်လဲ လို့ မေးလိုက်ရုံပါပဲ။ Claude က
      လိုတဲ့ file တွေကို ကိုယ်တိုင် ဖတ်တာမို့ context ကို လက်နဲ့ ထည့်ပေးစရာ မလိုပါဘူး။ ဒါပေမဲ့ ဖတ်တာကနေ ပြင်တာ၊
      run တာဆီ ရောက်တဲ့အခါ ဘာ ဖြစ်လဲ ဆိုတာကို ဒီ lesson မှာ ကြည့်ပါမယ်။
    sources:
      - { title: "Claude Code Docs: Quickstart", url: "https://code.claude.com/docs/en/quickstart" }
      - {
          title: "Claude Code Docs: Permissions",
          url: "https://code.claude.com/docs/en/permissions",
        }
    actions:
      - { id: open-readme, type: workspace.openFile, at: { mark: sel-billing }, path: README.md }
      - id: sel-billing
        type: editor.select
        at: { afterAction: open-readme }
        target:
          file: README.md
          text: "- Billing: plan၊ invoice၊ ငွေပေးချေမှု (သက်တမ်း 9 နှစ်ရှိ codebase)"

  - id: request
    chapter: ခွင့်တောင်းချက် တစ်ခု
    narration: >
      [[mark:r-open]] permission ဆိုတာ Claude Code က တစ်ခုခု မလုပ်ခင် တောင်းရတဲ့ ခွင့်ပြုချက်ပါ။ ဥပမာ အလုပ် တစ်ခုနဲ့
      ကြည့်ရအောင်။ late fee ကို ပြောင်းခိုင်းတဲ့ prompt တစ်ခုအတွက် ခွင့်တောင်းချက်ကို Manual mode မှာ ဒီလို
      မြင်ရပါတယ်။
      [[mark:r-update]] Claude က file တစ်ခုကို ဖတ်ပြီး update လုပ်ချင်တယ်လို့ ပြောထားပါတယ်။ ဒါပေမဲ့ ခွင့်မပြုမချင်း
      file ကို မထိသေးပါဘူး။
      [[mark:r-file]] ဘယ် file ကို ပြင်မလဲ ဆိုတာ ခေါင်းစဉ်မှာ ရှိပါတယ်။
      [[mark:r-diff]] အောက်မှာ diff ပါ။ ဖယ်မယ့် စာကြောင်းနဲ့ အစားထည့်မယ့် စာကြောင်းကို ကြည့်ပြီးမှ ဆုံးဖြတ်လို့ ရပါတယ်။
      [[mark:r-yes]] ရွေးစရာ သုံးခု ရှိပါတယ်။ ပထမ တစ်ခုက ဒီ edit တစ်ခုတည်းကို ခွင့်ပြုတာပါ။
      [[mark:r-switch]] ဒုတိယ တစ်ခုက ခွင့်ပြုပြီး session ကျန်တဲ့ အချိန်အတွက် accept edits mode ကို ပြောင်းတာပါ။ နောက်ထပ်
      file ပြင်တာတွေကို မမေးတော့ပါဘူး။
      [[mark:r-no]] တတိယ တစ်ခုက ငြင်းတာပါ။
      [[mark:r-tab]] Tab နဲ့ comment ထည့်ပြီး ငြင်းရင် Claude က အကြောင်းရင်းကို ဖတ်ပြီး ဆက်လုပ်ပါတယ်။
      comment မပါဘဲ ငြင်းရင်တော့ အဲဒီ အလှည့်ကို ရပ်လိုက်ပါတယ်။
      [[mark:r-again]] shell command အတွက် ခွင့်တောင်းချက်မှာတော့ နောက်ထပ် မမေးနဲ့တော့ ဆိုတဲ့ ရွေးစရာ ရှိတတ်ပါတယ်။
      ရွေးလိုက်ရင် repository အတွက် allow rule တစ်ကြောင်းကို ကိုယ်ပိုင် local settings file ထဲ အမြဲ သိမ်းပါတယ်။ file edit
      အတွက်ကတော့ session ပြီးတဲ့အထိပဲ ခံပါတယ်။ project folder ထဲက file ဖတ်တာကိုတော့ မမေးပါဘူး။
    sources:
      - {
          title: "Claude Code Docs: Permissions",
          url: "https://code.claude.com/docs/en/permissions",
        }
      - { title: "Claude Code Docs: Settings", url: "https://code.claude.com/docs/en/settings" }
    actions:
      - {
          id: show-edit,
          type: slide.show,
          at: { mark: r-open, offsetMs: -1200 },
          slideId: permission-edit,
        }
      - { id: pt-update, type: slide.point, at: { mark: r-update }, target: { x: 0.18, y: 0.319 } }
      - { id: pt-file, type: slide.point, at: { mark: r-file }, target: { x: 0.16, y: 0.409 } }
      - { id: pt-diff, type: slide.point, at: { mark: r-diff }, target: { x: 0.16, y: 0.591 } }
      - { id: pt-yes, type: slide.point, at: { mark: r-yes }, target: { x: 0.14, y: 0.802 } }
      - { id: pt-switch, type: slide.point, at: { mark: r-switch }, target: { x: 0.21, y: 0.832 } }
      - { id: pt-no, type: slide.point, at: { mark: r-no }, target: { x: 0.17, y: 0.892 } }
      - { id: pt-tab, type: slide.point, at: { mark: r-tab }, target: { x: 0.30, y: 0.953 } }

  - id: modes
    chapter: Permission mode များ
    narration: >
      [[mark:p-open]] ဘယ်အချိန်မှာ ခွင့်တောင်းမလဲ ဆိုတာကို permission mode က ဆုံးဖြတ်ပါတယ်။ permission mode ဆိုတာ ဘယ်အရာတွေကို
      မမေးဘဲ လုပ်ခွင့်ပေးမလဲ သတ်မှတ်တဲ့ mode ပါ။ အရင်က နာမည်တွေ ပြောင်းသွားလို့ လက်ရှိ နာမည်တွေနဲ့ ကြည့်ရအောင်။
      [[mark:p-manual]] အကုန် မေးတဲ့ဘက်မှာ Manual ရှိပါတယ်။ setting ထဲမှာ default လို့ ရေးတဲ့ mode ပါ။ file ဖတ်တာကိုပဲ မမေးဘဲ
      လုပ်ပြီး၊ ကျန်တာ အားလုံးကို မေးပါတယ်။ plan mode ကလည်း ဘာမှ မပြင်ဘဲ အရင် ဖတ်ပြီး အစီအစဉ် ဆွဲခိုင်းတဲ့ mode မို့
      ဒီဘက်မှာပဲ ရှိပါတယ်။
      [[mark:p-edits]] accept edits ကတော့ working directory ထဲမှာ file ပြင်တာနဲ့ file ရွှေ့တာ၊ ကူးတာလို command အချို့ကို
      မမေးဘဲ လုပ်ပါတယ်။ အရင်က auto accept လို့ ခေါ်ခဲ့တာ ဒီ mode ပါ။
      [[mark:p-auto]] auto mode ကတော့ နောက်ကွယ်က classifier တစ်ခုက action တစ်ခုချင်းကို စစ်ပြီး မမေးဘဲ ဆက်သွားတဲ့ mode
      ပါ။ ဒီ lesson ကို ရေးတဲ့ အချိန်မှာ terminal နဲ့ VS Code ရဲ့ session တွေက auto mode နဲ့ စပါတယ်။ print mode နဲ့ SDK
      ကတော့ Manual နဲ့ စပါတယ်။ docs အရ auto mode က ခွင့်တောင်းတာကို လျှော့ပေးပေမဲ့ လုံခြုံမှုကို အာမမခံပါဘူး။ force push
      လို၊ production deploy လို action တွေကိုတော့ တားတတ်ပါတယ်။
      [[mark:p-bypass]] ဘာမှ မမေးတဲ့ဘက် အစွန်ဆုံးမှာ bypass permissions ရှိပါတယ်။ ဘာမှ မမေးတာမို့ သီးခြား container ဒါမှမဟုတ် VM ထဲမှာပဲ
      သုံးဖို့ပါ။ ကြိုခွင့်ပြုထားတဲ့ tool တွေကိုပဲ သုံးပြီး ကျန်တာကို ငြင်းတဲ့ don't ask mode လည်း ရှိပါတယ်။
    sources:
      - {
          title: "Claude Code Docs: Permission modes",
          url: "https://code.claude.com/docs/en/permission-modes",
        }
    actions:
      - { id: close-edit, type: slide.close, at: { mark: p-open } }
      - {
          id: draw-p-open,
          type: whiteboard.apply,
          at: { mark: p-open, offsetMs: 400 },
          open: true,
          clear: true,
          upsertIds: [p-title, p-bar, p-left, p-right],
        }
      - {
          id: draw-p-manual,
          type: whiteboard.apply,
          at: { mark: p-manual },
          upsertIds: [p-m1, p-n1],
          drawMs: 1200,
        }
      - {
          id: draw-p-edits,
          type: whiteboard.apply,
          at: { mark: p-edits },
          upsertIds: [p-m2],
          drawMs: 600,
        }
      - {
          id: draw-p-auto,
          type: whiteboard.apply,
          at: { mark: p-auto },
          upsertIds: [p-m3, p-n3],
          drawMs: 1200,
        }
      - {
          id: draw-p-bypass,
          type: whiteboard.apply,
          at: { mark: p-bypass },
          upsertIds: [p-m4, p-n4],
          drawMs: 1200,
        }

  - id: switch
    chapter: Mode ပြောင်းခြင်း
    narration: >
      [[mark:s-open]] session အတွင်းမှာ mode ကို Shift နဲ့ Tab တွဲနှိပ်ပြီး ပြောင်းပါတယ်။ auto mode ကနေ တစ်ခါ နှိပ်ရင်
      ဒီလို Manual ကို ရောက်ပါတယ်။
      [[mark:s-line]] အောက်ဆုံး စာကြောင်းမှာ manual mode on လို့ ပြပါတယ်။ ထပ်နှိပ်ရင် accept edits၊ ပြီးရင် plan၊ ပြီးရင် auto
      ကို ပြန်ရောက်ပါတယ်။ don't ask နဲ့ bypass ကတော့ ဒီ သံသရာထဲမှာ မပါပါဘူး။
      [[mark:s-default]] session တိုင်း ဘယ် mode နဲ့ စမလဲ ဆိုတာကိုလည်း settings file ထဲမှာ default mode အဖြစ်
      သတ်မှတ်လို့ ရပါတယ်။ ဒါပေမဲ့ auto နဲ့ bypass ကို project ရဲ့ settings file ထဲမှာ ရေးရင် အလုပ် မလုပ်ပါဘူး။ ကိုယ်ပိုင်
      user settings ထဲမှာပဲ ရေးရပါတယ်။
    sources:
      - {
          title: "Claude Code Docs: Permission modes",
          url: "https://code.claude.com/docs/en/permission-modes",
        }
    actions:
      - { id: close-modes, type: whiteboard.apply, at: { mark: s-open }, open: false }
      - {
          id: show-manual,
          type: slide.show,
          at: { mark: s-open, offsetMs: 600 },
          slideId: mode-manual,
        }
      - { id: pt-line, type: slide.point, at: { mark: s-line }, target: { x: 0.14, y: 0.712 } }
      - { id: pt-start, type: slide.point, at: { mark: s-default }, target: { x: 0.06, y: 0.712 } }

  - id: rules
    chapter: Allow နဲ့ ask rule
    narration: >
      [[mark:f-open]] mode က session တစ်ခုလုံးရဲ့ setting ပါ။ team တစ်ခုလုံး အမြဲ လိုက်နာစေချင်တဲ့ စည်းကမ်းကိုတော့ rule
      အဖြစ် settings file ထဲမှာ ရေးပါတယ်။ ဒီ file က project ထဲမှာ ရှိပြီး git ထဲ commit လုပ်ထားတာမို့ team တစ်ခုလုံး
      မျှသုံးပါတယ်။ ကိုယ်ပိုင် local settings file၊ user settings file၊ ကုမ္ပဏီက ချပေးတဲ့ managed settings ဆိုတာတွေလည်း
      ရှိပြီး၊ rule စာရင်းတွေကို ပေါင်းပြီး သုံးပါတယ်။ file က တင်းကျပ်တဲ့ JSON ဖြစ်လို့ comment မထည့်ရပါဘူး။
      [[mark:type-mode]] ပထမ စာကြောင်းက Billing team ရဲ့ ပထမ အပတ်တွေမှာ Manual နဲ့ စမယ်လို့ သတ်မှတ်တာပါ။ file ပြင်တိုင်း
      developer က diff ကို ကြည့်ပြီးမှ ခွင့်ပြုမှာပါ။
      [[mark:type-allow]] ဒုတိယ စာကြောင်းက allow rule ပါ။ test နဲ့ lint ကို မမေးဘဲ run ခွင့်ပေးထားပါတယ်။ rule တစ်ခုက tool
      နာမည်နဲ့ ကွင်းထဲက အသေးစိတ်ပါ။ ဒီမှာ Bash tool ရဲ့ command အတိအကျကို ရေးထားပါတယ်။ Claude ကိုယ်တိုင် ရလဒ်ကို
      စစ်နိုင်ဖို့ ဒီ နှစ်ခုက ခဏခဏ run ရမယ့် command တွေပါ။
      [[mark:type-ask]] တတိယ စာကြောင်းက ask rule ပါ။ git push ကို ဘယ် mode မှာ ရှိနေနေ အမြဲ မေးခိုင်းထားပါတယ်။
      နောက်ဆုံးက star ရဲ့ ရှေ့မှာ space ပါတာကို သတိထားပါ။ git push တစ်ခုတည်းရော၊ နောက်က ဘာလိုက်လိုက် ကိုက်ပါတယ်။
    sources:
      - { title: "Claude Code Docs: Settings", url: "https://code.claude.com/docs/en/settings" }
      - {
          title: "Claude Code Docs: Permissions",
          url: "https://code.claude.com/docs/en/permissions",
        }
    actions:
      - { id: close-manual, type: slide.close, at: { mark: f-open } }
      - {
          id: open-settings,
          type: workspace.openFile,
          at: { afterAction: close-manual },
          path: billing-service/.claude/settings.json,
        }
      - id: type-mode
        type: editor.type
        at: { mark: type-mode }
        cadence: line-by-line
        target: { file: billing-service/.claude/settings.json, after: "  \"permissions\": {\n" }
        text: "    \"defaultMode\": \"default\",\n"
      - id: type-allow
        type: editor.type
        at: { mark: type-allow }
        cadence: line-by-line
        target:
          {
            file: billing-service/.claude/settings.json,
            after: "    \"defaultMode\": \"default\",\n",
          }
        text: "    \"allow\": [\"Bash(npm test)\", \"Bash(npm run lint)\"],\n"
      - id: type-ask
        type: editor.type
        at: { mark: type-ask }
        cadence: line-by-line
        target: { file: billing-service/.claude/settings.json, after: "\"Bash(npm run lint)\"],\n" }
        text: "    \"ask\": [\"Bash(git push *)\"],\n"

  - id: quiz
    chapter: မေးခွန်း တစ်ခု
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ Billing repository ထဲမှာ customer exports ဆိုတဲ့ folder တစ်ခု ရှိပြီး၊ customer
      ရဲ့ ကိုယ်ရေး အချက်အလက်တွေ ပါတဲ့ export file တွေ ရှိပါတယ်။ Claude Code ကို ဒီ folder ကို ဘယ်တော့မှ မဖတ်စေချင်ပါဘူး။
      ဘယ်လို လုပ်မလဲ။
      [[mark:q-a]] ပထမ အဖြေက Manual mode မှာ ထားပြီး၊ မေးလာရင် No ကို ရွေးမယ် ဆိုတာပါ။
      [[mark:q-b]] ဒုတိယ အဖြေက deny rule တစ်ကြောင်း ရေးထားမယ် ဆိုတာပါ။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။
      [[mark:quiz-answer]] အဖြေကတော့ ဒုတိယ တစ်ခုပါ။ ဘာကြောင့်လဲဆိုတော့ Manual mode မှာ file ဖတ်တာကို မမေးဘဲ လုပ်လို့ပါ။
      ဒါကြောင့် No ကို ရွေးဖို့ အခွင့်တောင် ရမှာ မဟုတ်ပါဘူး။ ပြီးတော့ mode က session အလိုက် ပြောင်းနိုင်ပါတယ်။ developer
      တစ်ယောက်က Shift နဲ့ Tab နှိပ်ပြီး auto ကို ပြောင်းလိုက်ရင်လည်း စည်းကမ်း ပျောက်သွားပါမယ်။ deny rule ကတော့ ဘယ် mode
      မှာမဆို အလုပ်လုပ်ပါတယ်။
      [[mark:q-rule]] ဒါကြောင့် ဘယ်တော့မှ မဖြစ်စေရမယ့် စည်းကမ်းဆိုရင် mode ကို အားမကိုးဘဲ deny rule အဖြစ် ရေးထားပါ။
    sources:
      - {
          title: "Claude Code Docs: Permissions",
          url: "https://code.claude.com/docs/en/permissions",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [q-title],
          drawMs: 900,
        }
      - { id: draw-q-a, type: whiteboard.apply, at: { mark: q-a }, upsertIds: [q-a], drawMs: 900 }
      - { id: draw-q-b, type: whiteboard.apply, at: { mark: q-b }, upsertIds: [q-b], drawMs: 900 }
      - {
          id: draw-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [q-b-line, q-b-ok],
          drawMs: 900,
        }
      - {
          id: draw-rule,
          type: whiteboard.apply,
          at: { mark: q-rule },
          upsertIds: [q-t1, q-t2],
          drawMs: 1600,
        }

  - id: deny
    chapter: Deny rule
    narration: >
      [[mark:type-deny]] ဒါကို settings file ထဲ ထည့်ရအောင်။ deny စာရင်းထဲမှာ secret တွေ ပါတဲ့ env file နဲ့ customer exports
      folder တစ်ခုလုံးကို ဖတ်ခွင့် ပိတ်ထားပါတယ်။ star နှစ်လုံးက folder အောက်က file အားလုံးကို ဆိုလိုပါတယ်။
      [[mark:d-order]] rule တွေကို deny၊ ask၊ allow ဆိုတဲ့ အစဉ်နဲ့ စစ်ပြီး ပထမ ကိုက်တဲ့ rule က အနိုင်ရပါတယ်။ ဘယ် settings
      file ထဲက deny ပဲ ဖြစ်ဖြစ် တခြား file ထဲက allow ကို အနိုင်ယူပါတယ်။ ဆိုတော့ developer တစ်ယောက်က ကိုယ်ပိုင် file
      ထဲမှာ allow ထည့်လိုက်လည်း ဒီ deny ကို ကျော်လို့ မရပါဘူး။
      [[mark:d-enforce]] အရေးကြီးတာက ဒီ rule တွေကို model က လိုက်နာဖို့ ကြိုးစားတာ မဟုတ်ဘဲ၊ Claude Code ကိုယ်တိုင်က
      အတင်း ကျင့်သုံးတာပါ။ ဒါပေမဲ့ deny rule က Claude ရဲ့ file tool တွေနဲ့ file နာမည် ပါတဲ့ command တွေကိုပဲ
      စစ်ပါတယ်။ file ကို ကိုယ်တိုင် ဖွင့်တဲ့ script တစ်ခုကိုတော့ မတားနိုင်ပါဘူး။ project ရဲ့ allow rule တွေကတော့ folder ကို ယုံကြည်တယ်လို့ လက်ခံပြီးမှ အသက်ဝင်ပါတယ်။ session
      ထဲမှာ ဘယ် rule တွေ ရှိလဲ ဆိုတာကို permissions command နဲ့ ကြည့်လို့ ရပါတယ်။
    sources:
      - {
          title: "Claude Code Docs: Permissions",
          url: "https://code.claude.com/docs/en/permissions",
        }
      - { title: "Claude Code Docs: Settings", url: "https://code.claude.com/docs/en/settings" }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: type-deny }, open: false }
      - id: type-deny
        type: editor.type
        at: { mark: type-deny, offsetMs: 2400 }
        cadence: line-by-line
        target:
          {
            file: billing-service/.claude/settings.json,
            after: "    \"ask\": [\"Bash(git push *)\"],\n",
          }
        text: "    \"deny\": [\"Read(./.env)\", \"Read(./customer-exports/**)\"]\n"
      - id: expect-deny
        type: expect.file
        at: { afterAction: type-deny }
        path: billing-service/.claude/settings.json
        contains: "    \"deny\": [\"Read(./.env)\", \"Read(./customer-exports/**)\"]\n"
      - id: sel-deny
        type: editor.select
        at: { mark: d-order }
        target:
          file: billing-service/.claude/settings.json
          text: '"Read(./customer-exports/**)"'

  - id: your-turn
    chapter: ကိုယ့် repository အတွက် rule
    narration: >
      [[mark:turn]] အခု ကိုယ့်အလှည့်ပါ။ lesson ကို pause လုပ်ပြီး၊ ဒီ settings file ကို ကိုယ့် repository အတွက် ပြင်ရေးကြည့်ပါ။
      allow rule တစ်ကြောင်း၊ ask rule တစ်ကြောင်း၊ deny rule တစ်ကြောင်း ရေးပါ။
      [[mark:turn-2]] allow မှာ Claude ကိုယ်တိုင် စစ်ဖို့ ခဏခဏ run ရမယ့် command ကို ထည့်ပါ။ ask မှာ ပြန်ရုပ်သိမ်းရ
      ခက်တဲ့ command ကို ထည့်ပါ။ deny မှာတော့ ကိုယ့် team မှာ ဘယ်တော့မှ မဖတ်စေချင်တဲ့ file ဒါမှမဟုတ် folder ကို ထည့်ပါ။
    sources:
      - {
          title: "Claude Code Docs: Permissions",
          url: "https://code.claude.com/docs/en/permissions",
        }
    actions:
      - id: sel-turn
        type: editor.select
        at: { mark: turn }
        target:
          file: billing-service/.claude/settings.json
          text: "    \"allow\": [\"Bash(npm test)\", \"Bash(npm run lint)\"],\n    \"ask\": [\"Bash(git push *)\"],\n    \"deny\": [\"Read(./.env)\", \"Read(./customer-exports/**)\"]"

  - id: recap
    chapter: ပြန်ချုပ်
    narration: >
      [[mark:recap]] ဒါဆို ပြန်ချုပ်ရရင်၊ Claude Code က တစ်ခုခု မလုပ်ခင် ခွင့်တောင်းလား မတောင်းလား ဆိုတာကို permission mode
      က ဆုံးဖြတ်ပါတယ်။ Manual က ဖတ်တာကလွဲပြီး အကုန် မေးပြီး၊ terminal session တွေကတော့ auto mode နဲ့ စပါတယ်။
      [[mark:recap-2]] ဘယ် mode မှာ ရှိနေနေ မပြောင်းရမယ့် စည်းကမ်းကိုတော့ settings file ထဲမှာ allow၊ ask၊ deny rule အဖြစ်
      ရေးပါတယ်။ မောင်မောင် ရဲ့ မေးခွန်းကို ဖြေပေးတာက model ရဲ့ သဘောထား မဟုတ်ဘဲ Claude Code က ကျင့်သုံးတဲ့ ဒီ rule တွေပါ။
      [[mark:next]] နောက် lesson မှာတော့ ခွင့်ပေးထားတဲ့ နယ်ထဲမှာ အလုပ် တစ်ခုကို explore၊ plan၊ code၊ commit ဆိုတဲ့
      အဆင့် လေးဆင့်နဲ့ ခိုင်းပုံကို လေ့လာသွားပါမယ်။
    sources:
      - {
          title: "Claude Code Docs: Permission modes",
          url: "https://code.claude.com/docs/en/permission-modes",
        }
    actions:
      - id: sel-recap-mode
        type: editor.select
        at: { mark: recap }
        target:
          file: billing-service/.claude/settings.json
          text: '    "defaultMode": "default",'
      - id: sel-recap-deny
        type: editor.select
        at: { mark: recap-2 }
        target:
          file: billing-service/.claude/settings.json
          text: '    "deny": ["Read(./.env)", "Read(./customer-exports/**)"]'

checks:
  - { type: timing.p95Ms, max: 300 }
