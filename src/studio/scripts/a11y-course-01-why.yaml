    entryFilePath: notes.md
    sidebarStartsCollapsed: true
    files:
      notes.md: |
        # Accessibility ဆိုတာ ဘာလဲ

        - accessibility (a11y) — မသန်စွမ်းမှု ဘယ်လိုပဲ ရှိရှိ၊ လူတိုင်း အဓိပ္ပာယ်ရှိရှိ၊ တန်းတူ သုံးနိုင်အောင် ဆောက်တာ
        - 1.3 billion — ကမ္ဘာ့ လူဦးရေရဲ့ 16%၊ 6 ယောက်မှာ 1 ယောက်
        - assistive technology — screen reader၊ magnifier၊ braille display၊ switch၊ voice control
        - အမြဲတမ်း · ယာယီ · အခြေအနေအရ — တစ်ယောက်အတွက် ပြင်ရင် လူအများ အကျိုးရှိ
        - plan → design → code → test — မသန်စွမ်းသူတွေနဲ့ အတူ၊ အစကတည်းက

        နောက် lesson: accessibility ကို ဘယ်လို တိုင်းတာလဲ (WCAG)
