# Accessibility course, lesson 1: what accessibility is and who it is for.
#
# A concept lesson: nothing runs. Deck pages (course deck, kits K1-K10) and two
# whiteboard boards carry the lesson, and the recap highlights the key lines in
# notes.md. It opens the whole course (welcome, the tea-shop story, the four
# lesson groups), defines digital accessibility (and shows the short written form
# on a board without reading it aloud), then meets four invented tea-shop
# customers on persona pages, the other needs, the permanent / temporary /
# situational circle on a board, the wider group who benefits, business and law,
# the life cycle, and a quiz page with its reveal.
#
# Deck: every page points at the course deck's placeholder /pub URL until Chan
# publishes it; the Director's unreachable-deck warning is expected.
# Page plan (kit fields per page): ~/Documents/a11y-course-work/pages/a11y-course-01-why.json
#
# Validate with (from the repo root):
#   bun scripts/studio-director.ts <this file>
#   bun scripts/studio-compile-check.ts <this file>
schemaVersion: 1

lesson:
