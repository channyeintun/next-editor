# One idea: a HashMap<K,V> stores values you look up by key; get returns an
# Option (the key might be missing), and entry updates a key or sets a default.
# A whiteboard sketch, then insert / get+match / entry on team scores, run.
# Output avoids iteration (HashMap order is nondeterministic).
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/rust-hashmaps.yaml
schemaVersion: 1

lesson:
  slug: rust-hashmaps
  title: "Rust hash maps: look up by key"
  locale: en-US
  workspace:
    lessonType: rust
    name: Rust Lesson
    entryFilePath: main.rs
    files:
      main.rs: |
        use std::collections::HashMap;

        fn main() {
            let mut scores = HashMap::new();
            scores.insert("blue", 10);
            scores.insert("red", 50);
            println!("teams: {}", scores.len());
        }
  # Diagram: two key -> value pairs drawn as boxes joined by arrows
  # ("blue" -> 10, "red" -> 50), plus the get-returns-Option note.
  whiteboardAssets:
    - id: hm-title
      kind: text
      x: 300
      y: 165
      width: 760
      height: 44
      text: "HashMap<K, V> — look up by key"
      strokeColor: "#1e1e1e"
      fontSize: 34
    - id: hm-kbox0
      kind: rectangle
      x: 370
      y: 275
      width: 170
      height: 66
      strokeColor: "#1e1e1e"
    - id: hm-key0
      kind: text
      x: 398
      y: 298
      width: 140
      height: 34
      text: '"blue"'
      strokeColor: "#1e1e1e"
      fontSize: 28
    - id: hm-arrow0
      kind: text
      x: 558
      y: 292
      width: 44
      height: 40
      text: "→"
      strokeColor: "#80868b"
      fontSize: 34
    - id: hm-vbox0
      kind: rectangle
      x: 616
      y: 275
      width: 120
      height: 66
      strokeColor: "#1971c2"
    - id: hm-val0
      kind: text
      x: 656
      y: 298
      width: 60
      height: 34
      text: "10"
      strokeColor: "#1971c2"
      fontSize: 30
    - id: hm-kbox1
      kind: rectangle
      x: 370
      y: 365
      width: 170
      height: 66
      strokeColor: "#1e1e1e"
    - id: hm-key1
      kind: text
      x: 398
      y: 388
      width: 140
      height: 34
      text: '"red"'
      strokeColor: "#1e1e1e"
      fontSize: 28
    - id: hm-arrow1
      kind: text
      x: 558
      y: 382
      width: 44
      height: 40
      text: "→"
      strokeColor: "#80868b"
      fontSize: 34
    - id: hm-vbox1
      kind: rectangle
      x: 616
      y: 365
      width: 120
      height: 66
      strokeColor: "#1971c2"
    - id: hm-val1
      kind: text
      x: 656
      y: 388
      width: 60
      height: 34
      text: "50"
      strokeColor: "#1971c2"
      fontSize: 30
    - id: hm-note
      kind: text
      x: 360
      y: 470
      width: 740
      height: 36
      text: "get(key) → Option — Some(value), or None if missing"
      strokeColor: "#1e1e1e"
      fontSize: 26

build:
  voiceProfile: pocket-alba-v1
  seed: 40

runtime:
  kind: rust-playground
  defaultMode: fixture
  fixture:
    latencyMs: 2000
    result:
      status: success
      stdout: "teams: 2\nred has 50\nblue now: 15\n"
      stderr: ""

scenes:
  - id: what-is-a-map
    narration: >
      [[mark:board]] A HashMap stores values you look up by key, not by
      position. [[mark:show-map]] Here, the key blue maps to ten, and red maps
      to fifty. [[mark:show-note]] Looking a key up returns an Option — Some
      with the value, or None if it's missing. [[mark:board-close]] Let's build
      it.
    sources:
      - title: "The Rust Book — Storing Keys with Associated Values in Hash Maps"
        url: "https://doc.rust-lang.org/book/ch08-03-hash-maps.html"
    actions:
      - id: open-board
        type: whiteboard.apply
        at: { mark: board }
        open: true
        upsertIds: [hm-title]
      - id: show-map
        type: whiteboard.apply
        at: { mark: show-map }
        upsertIds:
          [
            hm-kbox0,
            hm-key0,
            hm-arrow0,
            hm-vbox0,
            hm-val0,
            hm-kbox1,
            hm-key1,
            hm-arrow1,
            hm-vbox1,
            hm-val1,
          ]
      - id: show-note
        type: whiteboard.apply
        at: { mark: show-note }
        upsertIds: [hm-note]
      - id: close-board
        type: whiteboard.apply
        at: { mark: board-close }
        open: false

  - id: insert-and-get
    narration: >
      [[mark:open]] Here we insert two team scores, so the map holds two keys.
      [[mark:type-get]] Now we look up red. get returns an Option, so we match:
      Some means we found points, None means the key is missing. Red is there,
      with fifty.
    sources:
      - title: "The Rust Book — Accessing Values in a Hash Map"
        url: "https://doc.rust-lang.org/book/ch08-03-hash-maps.html#accessing-values-in-a-hash-map"
    actions:
      - id: open-main
        type: workspace.openFile
        at: { mark: open }
        path: main.rs
      - id: type-get
        type: editor.type
        at: { mark: type-get, offsetMs: -400 }
        target:
          file: main.rs
          after: "    println!(\"teams: {}\", scores.len());\n"
          occurrence: 1
        cadence: line-by-line
        text: "    let team = \"red\";\n    match scores.get(team) {\n        Some(points) => println!(\"{team} has {points}\"),\n        None => println!(\"{team} not found\"),\n    }\n"

  - id: entry-update
    narration: >
      [[mark:type-entry]] entry is the update tool. For blue, or_insert gives
      us a mutable reference — the existing ten, or a zero if blue were new. We
      add five, so blue becomes fifteen.
    sources:
      - title: "The Rust Book — Updating a Value Based on the Old Value"
        url: "https://doc.rust-lang.org/book/ch08-03-hash-maps.html#updating-a-value-based-on-the-old-value"
    actions:
      - id: type-entry
        type: editor.type
        at: { mark: type-entry, offsetMs: -400 }
        target:
          file: main.rs
          after: "        None => println!(\"{team} not found\"),\n    }\n"
          occurrence: 1
        cadence: line-by-line
        text: "    *scores.entry(\"blue\").or_insert(0) += 5;\n    println!(\"blue now: {}\", scores[\"blue\"]);\n"

  - id: run
    narration: >
      [[mark:run]] Let's run it. Two teams, red has fifty, and blue climbed to
      fifteen. A HashMap is how you store and find data by a key instead of an
      index.
    sources:
      - title: "Rust Playground"
        url: "https://play.rust-lang.org/"
    actions:
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 800 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "blue now: 15"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: 'scores.entry("blue")'

checks:
  - { type: timing.p95Ms, max: 300 }
