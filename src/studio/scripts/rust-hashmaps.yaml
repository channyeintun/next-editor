# Rust from zero, lesson 14: hash maps.
#
# The arc: a whiteboard draws how a HashMap finds a value — the key goes
# through a hash function, the number picks a slot, and the map goes straight
# to it without searching — and why that leaves no fixed order. The editor
# then brings HashMap into scope with `use` (it isn't in the prelude, unlike
# Vec and String), makes a map with HashMap::new and two inserts (mut, types
# inferred). A second board shows that get returns an Option (Some for a key
# that's there, None for one that's missing) and the compiler's answer when
# the result is used as a plain number (E0308). The editor handles both
# cases with match, then counts ballots with entry().or_insert(0) and
# `*count += 1` — insert would replace the old count, entry keeps it — and
# names the E0368 you get without the star. Last, it prints len and two
# Options with {:?}, and one run. The lesson is insert-only with one run, so
# no broken program is ever typed, and the output never iterates the map
# (its order changes from run to run).
#
# Every message on a board or in the narration was confirmed with rustc 1.98
# (edition 2024) on the broken variants:
#   `let red: i32 = votes.get("red");`
#     error[E0308]: mismatched types
#       expected `i32`, found `Option<&{integer}>`
#   `count += 1;` (no star) inside the entry loop
#     error[E0368]: binary assignment operation `+=` cannot be applied to
#       type `&mut {integer}`
#   no `use std::collections::HashMap;` (not shown, only the why is said)
#     error[E0433]: cannot find type `HashMap` in this scope
#   `println!("blue: {}", votes.get("blue"));` (not shown; backs "an Option
#     can't print with plain braces")
#     error[E0277]: `Option<&{integer}>` doesn't implement `std::fmt::Display`
#   `votes["pink"]` compiles and panics ("no entry found for key"), which is
#     why the narration says "With get, Rust makes you handle it".
#
# Board colours: blue = the key being named, orange = the caveat (no fixed
# order; a key can be missing), violet = the result (the value found, Some
# and None), red = the error and its spotlight, green = the way that works.
# #1e1e1e paints white on the dark board.
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/rust-hashmaps.yaml
