        3 colors

        blue: Some(3)

        pink: None\n"
      stderr: ""

scenes:
  - id: what-is-a-map
    chapter: key နဲ့ ရှာခြင်း
    narration: >-
      Vec ကို အရင် lesson တွေမှာ တွေ့ခဲ့ပြီးပါပြီ။ Vec က တန်ဖိုး တစ်ခုကို သူ့ နေရာနဲ့ ရှာပါတယ်၊
      index 0၊ 1၊ 2 ဆိုပြီး အစဉ်လိုက်ပါ။ [[mark:draw-key]] HashMap ကတော့ နေရာနဲ့ မဟုတ်ဘဲ key
      တစ်ခုနဲ့ ရှာပါတယ်။ key ဆိုတာ နာမည် တစ်ခု၊ ဒါမှမဟုတ် စကားလုံး တစ်လုံးလိုမျိုးပါ။ ဒီမှာ key က
      red ပါ။ [[mark:draw-hash]] map က အဲဒီ key ကို hash function တစ်ခုထဲ ထည့်လိုက်ပါတယ်။ hash
      function က key ကို ကိန်းဂဏန်း တစ်ခု အဖြစ် ပြောင်းပေးပြီး၊ အဲဒီ ကိန်းဂဏန်းက ဘယ် အကွက်လဲ
      ဆိုတာကို ရွေးပေးပါတယ်။ [[mark:draw-slots]] ဒါကြောင့် map က မှန်တဲ့ အကွက်ဆီ တန်းသွားပြီး၊ 2
      ဆိုတဲ့ value ကို တွေ့ပါတယ်။ အကွက် တစ်ကွက်ချင်း လိုက်ရှာစရာ မလိုပါဘူး။ [[mark:draw-blue]] blue
      လို တခြား key တွေကတော့ တခြား အကွက်တွေထဲ ရောက်သွားပါတယ်။ key တစ်ခုစီမှာ value တစ်ခုစီ ရှိပါတယ်။
      ပြီးတော့ key အားလုံးက type တစ်မျိုးတည်း ဖြစ်ရပြီး၊ value အားလုံးကလည်း type တစ်မျိုးတည်း
      ဖြစ်ရပါတယ်။ [[mark:draw-order]] ဒါကြောင့်ပဲ HashMap မှာ ပုံသေ အစီအစဉ် ဆိုတာ မရှိပါဘူး။
      အကွက်တွေက hash အတိုင်း လိုက်တာ ဖြစ်ပြီး၊ ကိုယ် ထည့်လိုက်တဲ့ အစဉ်အတိုင်း မဟုတ်ပါဘူး။ map
      တစ်ခုကို loop နဲ့ ပတ်ကြည့်ရင်၊ run တစ်ကြိမ်နဲ့ တစ်ကြိမ် အစီအစဉ် ပြောင်းသွားနိုင်ပါတယ်။
    sources:
      - title: "The Rust Book — Storing Keys with Associated Values in Hash Maps"
        url: "https://doc.rust-lang.org/book/ch08-03-hash-maps.html"
      - title: "The Rust Book — Hashing Functions"
        url: "https://doc.rust-lang.org/book/ch08-03-hash-maps.html#hashing-functions"
      - title: "std::collections::HashMap (randomly seeded hashing; iter visits pairs in arbitrary order)"
        url: "https://doc.rust-lang.org/std/collections/struct.HashMap.html"
    actions:
      # Opens in the quiet handle before the first word, already titled.
      - id: open-board-map
        type: whiteboard.apply
        at: { scene: start, offsetMs: -1500 }
        open: true
        upsertIds: [m-title]
      - id: draw-key
        type: whiteboard.apply
        at: { mark: draw-key }
        upsertIds: [m-key-box, m-key-text]
        drawMs: 1000
      - id: draw-hash
        type: whiteboard.apply
        at: { mark: draw-hash }
        upsertIds: [m-arrow-hash, m-hash-ring, m-hash-text, m-arrow-slot]
        drawMs: 2400
      - id: draw-slots
        type: whiteboard.apply
        at: { mark: draw-slots }
        upsertIds: [m-slot0, m-slot1, m-slot2, m-slot3, m-pair-red, m-direct]
        drawMs: 3000
      - id: draw-blue
        type: whiteboard.apply
        at: { mark: draw-blue }
        upsertIds: [m-pair-blue]
        drawMs: 800
      - id: draw-order
        type: whiteboard.apply
        at: { mark: draw-order }
        upsertIds: [m-order]
        drawMs: 1600

  - id: make-a-map
    chapter: HashMap တစ်ခု တည်ဆောက်ခြင်း
    narration: >-
      ကဲ၊ HashMap တစ်ခု တည်ဆောက်ကြည့်ရအောင်။ Vec နဲ့ String ကတော့ အမြဲတမ်း scope ထဲမှာ ရှိနေပါတယ်။
      ဘာကြောင့်လဲဆိုတော့ သူတို့က prelude ထဲမှာ ပါလို့ပါ။ prelude ဆိုတာ program တိုင်း အလိုအလျောက်
      ရသွားတဲ့ နာမည် အစုအဝေးပါ။ [[mark:type-use]] HashMap ကတော့ prelude ထဲမှာ မပါတဲ့အတွက်၊ use နဲ့
      ခေါ်သွင်းရပါတယ်။ HashMap က standard library ရဲ့ collections module ထဲမှာ ရှိတာပါ။
      [[mark:type-new]] HashMap ရဲ့ new က map အလွတ် တစ်ခု လုပ်ပေးပြီး၊ insert က key တစ်ခုကို သူ့
      value နဲ့အတူ ထည့်ပေးပါတယ်။ Vec ရဲ့ push လိုပဲ insert ကလည်း map ကို ပြောင်းလိုက်တာ
      ဖြစ်တဲ့အတွက်၊ votes မှာ mut လိုပါတယ်။ [[mark:select-insert]] type တွေကို ဘယ်နေရာမှာမှ
      မရေးခဲ့တာ သတိထား ကြည့်ပါ။ ဒီ insert တွေကို ကြည့်ပြီး compiler က key တွေက string slice
      ဖြစ်ပြီး၊ value တွေကတော့ integer တွေအတွက် default ဖြစ်တဲ့ i32 ဖြစ်တယ်လို့ ကိုယ့်အစား
      တွက်ထုတ်ပေးပါတယ်။
    sources:
      - title: "The Rust Book — Creating a New Hash Map"
        url: "https://doc.rust-lang.org/book/ch08-03-hash-maps.html#creating-a-new-hash-map"
      - title: "The Rust Book — Bringing Paths into Scope with the use Keyword"
        url: "https://doc.rust-lang.org/book/ch07-04-bringing-paths-into-scope-with-the-use-keyword.html"
      - title: "std::prelude (Vec and String are in it; HashMap isn't)"
        url: "https://doc.rust-lang.org/std/prelude/index.html"
      - title: "std::collections::HashMap::insert"
        url: "https://doc.rust-lang.org/std/collections/struct.HashMap.html#method.insert"
    actions:
      - id: close-board-map
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-main
        type: workspace.openFile
        at: { scene: start, offsetMs: 800 }
        path: main.rs
      - id: type-use
        type: editor.type
        at: { mark: type-use }
        target:
          file: main.rs
          after: ""
          occurrence: 1
        cadence: fast-explainer
        text: "use std::collections::HashMap;\n\n"
      - id: type-new
        type: editor.type
        at: { mark: type-new, offsetMs: -200 }
        target:
          file: main.rs
          after: "fn main() {\n"
          occurrence: 1
        cadence: line-by-line
        text: "    let mut votes = HashMap::new();

          \    votes.insert(\"red\", 2);

          \    votes.insert(\"blue\", 1);\n"
      - id: select-insert
        type: editor.select
        at: { mark: select-insert }
        target:
          file: main.rs
          text: '("red", 2)'
          occurrence: 1

  - id: get-option
    chapter: get က Option ပြန်ပေးတယ်
    narration: >-
      ဒါဆို value တစ်ခုကို ဘယ်လို ပြန်ဖတ်မလဲ။ Vec မှာလိုပဲ get နဲ့ ဖတ်ပါတယ်၊ ဒါပေမဲ့ index အစား key
      နဲ့ ဖတ်တာပါ။ [[mark:draw-some]] red ကို တောင်းကြည့်ရင် Some ရပါတယ်၊ သူ့အထဲမှာ map ထဲက 2 ကို
      ညွှန်တဲ့ reference တစ်ခု ပါပါတယ်။ [[mark:draw-none]] ဒါပေမဲ့ pink ကို တောင်းကြည့်ရင်တော့ None
      ရပါတယ်။ ဘာကြောင့်လဲဆိုတော့ အဲဒီလို key တစ်ခု မရှိလို့ပါ။ ဘယ် key မဆို မရှိနိုင်တဲ့အတွက်၊ get က
      Option တစ်ခုကို ပြန်ပေးပါတယ်။ [[mark:draw-err-code]] ဒါဆို အဲဒီ ရလဒ်ကို သာမန် ကိန်းဂဏန်း
      တစ်ခုလို၊ ဥပမာအားဖြင့် ဒီမှာလို i32 တစ်ခုအနေနဲ့ သုံးကြည့်ရင် ဘာဖြစ်မလဲ။ [[mark:draw-err-msg]]
      compiler က E0308 error၊ mismatched types နဲ့ ရပ်သွားပါတယ်။ သူ မျှော်လင့်ထားတာက i32 ဖြစ်ပြီး၊
      တွေ့တာက Option ဖြစ်နေလို့ပါ။ [[mark:draw-fix]] ပြင်နည်းကတော့ Some ရော None ရော နှစ်ခုလုံးကို
      handle လုပ်ဖို့ပါ။ တခြား ဘာသာစကား အများစုမှာ key မရှိရင် null ရတာမျိုး၊ ဒါမှမဟုတ် program run
      နေချိန်ကျမှ error တက်တာမျိုး ဖြစ်ပါတယ်။ Rust မှာတော့ get ကို သုံးရင်၊ program run
      မလုပ်ခင်ကတည်းက အဲဒီ အခြေအနေကို handle လုပ်ဖို့ ကိုယ့်ကို ခိုင်းပါတယ်။
    sources:
      - title: "The Rust Book — Accessing Values in a Hash Map"
        url: "https://doc.rust-lang.org/book/ch08-03-hash-maps.html#accessing-values-in-a-hash-map"
      - title: "std::collections::HashMap::get"
        url: "https://doc.rust-lang.org/std/collections/struct.HashMap.html#method.get"
      - title: "Rust error codes — E0308"
        url: "https://doc.rust-lang.org/error_codes/E0308.html"
      - title: "The Rust Book — The Option Enum and Its Advantages Over Null Values"
        url:
          "https://doc.rust-lang.org/book/ch06-01-defining-an-enum.html#the-option-enum-and-its-advantag\
          es-over-null-values"
    actions:
      - id: open-board-get
        type: whiteboard.apply
        at: { scene: start }
        open: true
        clear: true
        upsertIds: [g-title]
      - id: draw-some
        type: whiteboard.apply
        at: { mark: draw-some }
        upsertIds: [g-red-call, g-red-arrow, g-some, g-red-note]
        drawMs: 2200
      - id: draw-none
        type: whiteboard.apply
        at: { mark: draw-none }
        upsertIds: [g-pink-call, g-pink-arrow, g-none, g-pink-note]
        drawMs: 2200
      - id: draw-err-code
        type: whiteboard.apply
        at: { mark: draw-err-code }
        upsertIds: [g-code, g-code-line]
        drawMs: 1600
      - id: draw-err-msg
        type: whiteboard.apply
        at: { mark: draw-err-msg }
        upsertIds: [g-err1, g-err2]
        drawMs: 2400
      - id: draw-fix
        type: whiteboard.apply
        at: { mark: draw-fix }
        upsertIds: [g-fix]
        drawMs: 1200

  - id: match-get
    narration: >-
      [[mark:type-match]] ဒါဆို နှစ်ခုလုံးကို match နဲ့ handle လုပ်ကြည့်ရအောင်။ Option တစ်ခုကို
      match လုပ်တာ အရင်က လုပ်ဖူးပြီးသားပါ။ ဒီတစ်ခါလည်း အဲဒီအတိုင်းပဲ အလုပ်လုပ်ပါတယ်။
      [[mark:select-get]] get က Option ကို ပြန်ပေးပြီး၊ arm တစ်ခုစီက case တစ်ခုစီကို handle
      လုပ်ပါတယ်။ Some ဆိုရင် count ကို ရပြီး၊ key မရှိရင်တော့ None arm က run ပါတယ်။
    sources:
      - title: "The Rust Book — The match Control Flow Construct"
        url: "https://doc.rust-lang.org/book/ch06-02-match.html"
      - title: "std::option::Option"
        url: "https://doc.rust-lang.org/std/option/enum.Option.html"
    actions:
      - id: close-board-get
        type: whiteboard.apply
        at: { scene: start, offsetMs: -400 }
        open: false
      - id: type-match
        type: editor.type
        at: { mark: type-match }
        target:
          file: main.rs
          after: "    votes.insert(\"blue\", 1);\n"
          occurrence: 1
        cadence: line-by-line
        text: "

          \    match votes.get(\"red\") {

          \        Some(count) => println!(\"red has {count} votes\"),

          \        None => println!(\"no votes for red\"),

          \    }\n"
      - id: select-get
        type: editor.select
        at: { mark: select-get }
        target:
          file: main.rs
          text: 'votes.get("red")'
          occurrence: 1

  - id: count
    chapter: entry နဲ့ ရေတွက်ခြင်း
    narration: >-
      အခု မဲတွေ ထပ်ရေတွက်ကြည့်ရအောင်။ ဒီနေရာမှာ insert က အဆင်မပြေပါဘူး။ ဘာကြောင့်လဲဆိုတော့ key က
      ရှိပြီးသား ဆိုရင်၊ insert က value အဟောင်းကို အသစ်နဲ့ အစားထိုးလိုက်လို့ပါ။ မဲ တစ်မဲ
      ထပ်တိုးချင်ရင် count အဟောင်းကို အရင် သိထားဖို့ လိုပါတယ်။ [[mark:type-ballots]] ဒီမှာ မဲလက်မှတ်
      သုံးစောင် ရှိပါတယ်၊ blue၊ green၊ ပြီးတော့ blue ထပ်ပြီး တစ်စောင်ပါ။ loop က သူတို့ကို
      တစ်စောင်ချင်း ယူပါတယ်။ [[mark:select-entry]] entry က အဲဒီ color ကို map ထဲမှာ ရှာပါတယ်။ or
      insert ကတော့ color က အသစ် ဖြစ်နေရင် 0 ကို ထည့်ပေးပါတယ်။ ရှိပြီးသား ဖြစ်ဖြစ်၊ အသစ် ဖြစ်ဖြစ်၊
      နှစ်မျိုးလုံးမှာ map ထဲက count ကို ညွှန်တဲ့ mutable reference တစ်ခုကို ပြန်ပေးပါတယ်။
      [[mark:select-star]] star က reference ညွှန်ထားတဲ့ count ကို ပေးပါတယ်၊ Vec lesson ထဲက loop
      တုန်းကလိုပါပဲ။ ဒါကြောင့် plus equal 1 က map ထဲက ကိန်းဂဏန်းကို တိုက်ရိုက် ပေါင်းထည့်ပေးပါတယ်။
      star မပါရင်တော့ E0368 error တက်ပါလိမ့်မယ်။ ဘာကြောင့်လဲဆိုတော့ reference ကိုယ်တိုင်ပေါ်မှာ plus
      equal ကို သုံးလို့ မရလို့ပါ။
    sources:
      - title: "The Rust Book — Overwriting a Value"
        url: "https://doc.rust-lang.org/book/ch08-03-hash-maps.html#overwriting-a-value"
      - title: "The Rust Book — Updating a Value Based on the Old Value"
        url: "https://doc.rust-lang.org/book/ch08-03-hash-maps.html#updating-a-value-based-on-the-old-value"
      - title: "std::collections::hash_map::Entry::or_insert"
        url: "https://doc.rust-lang.org/std/collections/hash_map/enum.Entry.html#method.or_insert"
      - title: "Rust error codes — E0368"
        url: "https://doc.rust-lang.org/error_codes/E0368.html"
    actions:
      - id: type-ballots
        type: editor.type
        at: { mark: type-ballots, offsetMs: -200 }
        target:
          file: main.rs
          after: "        None => println!(\"no votes for red\"),

            \    }\n"
          occurrence: 1
        cadence: line-by-line
        text: "

          \    let ballots = [\"blue\", \"green\", \"blue\"];

          \    for color in ballots {

          \        let count = votes.entry(color).or_insert(0);

          \        *count += 1;

          \    }\n"
      - id: select-entry
        type: editor.select
        at: { mark: select-entry }
        target:
          file: main.rs
          text: "entry(color).or_insert(0)"
          occurrence: 1
      - id: select-star
        type: editor.select
        at: { mark: select-star }
        target:
          file: main.rs
          text: "*count += 1"
          occurrence: 1

  - id: run
    narration: >-
      [[mark:type-print]] နောက်ဆုံး len နဲ့ color ဘယ်နှစ်မျိုး ရှိလဲ ဆိုတာကို print ထုတ်ပြီး၊ blue
      နဲ့ pink ကိုလည်း တောင်းကြည့်ပါမယ်။ Option တစ်ခုကို တွန့်ကွင်း အလွတ်နဲ့ print ထုတ်လို့
      မရတဲ့အတွက်၊ Debug format ကို သုံးပါတယ်၊ ဆိုလိုတာက တွန့်ကွင်းထဲမှာ colon နဲ့ question mark
      ထည့်တာပါ။ [[mark:run]] ကဲ၊ run ကြည့်ရအောင်။ red မှာ မဲ 2 မဲ ရှိပါတယ်။ green က အသစ်
      ဖြစ်တဲ့အတွက်၊ အခု color 3 မျိုး ဖြစ်သွားပါပြီ။ blue က 1 ကနေ 3 ဖြစ်သွားတဲ့အတွက်၊ get က Some 3
      ကို ပေးပါတယ်။ pink ကိုတော့ ဘယ်တုန်းကမှ မထည့်ခဲ့တဲ့အတွက် None ပါ။
    sources:
      - title: "std::collections::HashMap::len"
        url: "https://doc.rust-lang.org/std/collections/struct.HashMap.html#method.len"
      - title: "std::fmt — Debug formatting ({:?})"
        url: "https://doc.rust-lang.org/std/fmt/index.html#fmtdisplay-vs-fmtdebug"
      - title: "std::option::Option (implements Debug, not Display)"
        url: "https://doc.rust-lang.org/std/option/enum.Option.html"
    actions:
      - id: type-print
        type: editor.type
        at: { mark: type-print }
        target:
          file: main.rs
          after: "        *count += 1;\n    }\n"
          occurrence: 1
        cadence: line-by-line
        text: "

          \    println!(\"{} colors\", votes.len());

          \    println!(\"blue: {:?}\", votes.get(\"blue\"));

          \    println!(\"pink: {:?}\", votes.get(\"pink\"));\n"
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "blue: Some(3)"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: "let count = votes.entry(color).or_insert(0);"

  - id: wrap
    narration: >-
      ဒါဆို ပြန်ချုပ်ရရင်၊ HashMap က value တွေကို key နဲ့ သိမ်းပါတယ်။ insert က value တစ်ခုကို
      ထည့်ပေးပြီး၊ ရှိပြီးသား ဆိုရင်တော့ အစားထိုးပေးပါတယ်။ get က Option ပြန်ပေးပါတယ်၊
      ဘာကြောင့်လဲဆိုတော့ key က မရှိတာမျိုး ဖြစ်နိုင်လို့ပါ။ ပြီးတော့ entry နဲ့ or insert ကတော့ value
      တစ်ခုကို ပြောင်းပေးပြီး၊ key က အသစ် ဆိုရင် အရင် ထည့်ပေးပါတယ်။ နောက် lesson မှာတော့ error
      handling၊ ဆိုလိုတာက တစ်ခုခု မှားယွင်းသွားနိုင်တဲ့အခါ ကိုယ့် program က ဘာ လုပ်မလဲ ဆိုတာကို
      ကြည့်သွားပါမယ်။
    sources:
      - title: "The Rust Book — Storing Keys with Associated Values in Hash Maps"
        url: "https://doc.rust-lang.org/book/ch08-03-hash-maps.html"
      - title: "The Rust Book — Error Handling"
        url: "https://doc.rust-lang.org/book/ch09-00-error-handling.html"
    actions: []

checks:
  - { type: timing.p95Ms, max: 300 }
