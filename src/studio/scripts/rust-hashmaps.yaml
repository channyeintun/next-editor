build:
  voiceProfile: pocket-alba-v1
  seed: 40

runtime:
  kind: rust-playground
  defaultMode: fixture
  fixture:
    latencyMs: 600
    result:
      status: success
      stdout: "red has 2 votes\n3 colors\nblue: Some(3)\npink: None\n"
      stderr: ""

scenes:
  - id: what-is-a-map
    chapter: Look up by key
    narration: >
      You've seen a Vec. It finds a value by its position: zero, one, two.
      [[mark:draw-key]] A HashMap finds a value by a key instead, like a name
      or a word. Here, the key is red.
      [[mark:draw-hash]] The map runs the key through a hash function. That
      turns it into a number, and the number picks a slot.
      [[mark:draw-slots]] So the map goes straight to the right slot, and
      finds the value two. It doesn't search every entry.
      [[mark:draw-blue]] Other keys, like blue, land in other slots. Each key
      has one value. All the keys share one type, and so do all the values.
      [[mark:draw-order]] That's also why a HashMap has no fixed order. The
      slots follow the hash, not the order you inserted. If you loop over a
      map, the order can change from one run to the next.
    sources:
      - title: "The Rust Book — Storing Keys with Associated Values in Hash Maps"
        url: "https://doc.rust-lang.org/book/ch08-03-hash-maps.html"
      - title: "The Rust Book — Hashing Functions"
        url: "https://doc.rust-lang.org/book/ch08-03-hash-maps.html#hashing-functions"
      - title: "std::collections::HashMap (randomly seeded hashing; iter visits pairs in arbitrary order)"
        url: "https://doc.rust-lang.org/std/collections/struct.HashMap.html"
    actions:
      # Opens in the quiet handle before the first word, already titled.
      - id: open-board-map
        type: whiteboard.apply
        at: { scene: start, offsetMs: -1500 }
        open: true
        upsertIds: [m-title]
      - id: draw-key
        type: whiteboard.apply
        at: { mark: draw-key }
        upsertIds: [m-key-box, m-key-text]
        drawMs: 1000
      - id: draw-hash
        type: whiteboard.apply
        at: { mark: draw-hash }
        upsertIds: [m-arrow-hash, m-hash-ring, m-hash-text, m-arrow-slot]
        drawMs: 2400
      - id: draw-slots
        type: whiteboard.apply
        at: { mark: draw-slots }
        upsertIds: [m-slot0, m-slot1, m-slot2, m-slot3, m-pair-red, m-direct]
        drawMs: 3000
      - id: draw-blue
        type: whiteboard.apply
        at: { mark: draw-blue }
        upsertIds: [m-pair-blue]
        drawMs: 800
      - id: draw-order
        type: whiteboard.apply
        at: { mark: draw-order }
        upsertIds: [m-order]
        drawMs: 1600

  - id: make-a-map
    chapter: Making a HashMap
    narration: >
      Let's build one. Vec and String are always in scope, because they're in
      the prelude: the names every program gets automatically.
      [[mark:type-use]] HashMap isn't, so we bring it in with use. It lives in
      the collections module of the standard library.
      [[mark:type-new]] HashMap::new makes an empty map, and insert adds a
      key with its value. Like push on a Vec, insert changes the map, so votes
      needs mut.
      [[mark:select-insert]] We never wrote the types. From these inserts, the
      compiler works out that the keys are string slices, and the values are
      i32, the default for whole numbers.
    sources:
      - title: "The Rust Book — Creating a New Hash Map"
        url: "https://doc.rust-lang.org/book/ch08-03-hash-maps.html#creating-a-new-hash-map"
      - title: "The Rust Book — Bringing Paths into Scope with the use Keyword"
        url: "https://doc.rust-lang.org/book/ch07-04-bringing-paths-into-scope-with-the-use-keyword.html"
      - title: "std::prelude (Vec and String are in it; HashMap isn't)"
        url: "https://doc.rust-lang.org/std/prelude/index.html"
      - title: "std::collections::HashMap::insert"
        url: "https://doc.rust-lang.org/std/collections/struct.HashMap.html#method.insert"
    actions:
      - id: close-board-map
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-main
        type: workspace.openFile
        at: { scene: start, offsetMs: 800 }
        path: main.rs
      - id: type-use
        type: editor.type
        at: { mark: type-use }
        target:
          file: main.rs
          after: ""
          occurrence: 1
        cadence: fast-explainer
        text: "use std::collections::HashMap;\n\n"
      - id: type-new
        type: editor.type
        at: { mark: type-new, offsetMs: -200 }
        target:
          file: main.rs
          after: "fn main() {\n"
          occurrence: 1
        cadence: line-by-line
        text: "    let mut votes = HashMap::new();\n    votes.insert(\"red\", 2);\n    votes.insert(\"blue\", 1);\n"
      - id: select-insert
        type: editor.select
        at: { mark: select-insert }
        target:
          file: main.rs
          text: '("red", 2)'
          occurrence: 1

  - id: get-option
    chapter: get returns an Option
    narration: >
      So how do we read a value back? With get, like on a Vec, but with a
      key.
      [[mark:draw-some]] Asking for red gives Some, with a reference to the
      two inside the map.
      [[mark:draw-none]] But asking for pink gives None, because there's no
      such key. Any key can be missing, so get returns an Option.
      [[mark:draw-err-code]] What if you treat the result as a plain number,
      like this i32?
      [[mark:draw-err-msg]] The compiler stops you, with error E0308:
      mismatched types. It expected an i32, but found an Option.
      [[mark:draw-fix]] The fix is to handle both Some and None. In many
      languages, a missing key gives you null, or an error while the program
      runs. With get, Rust makes you handle it before the program runs.
    sources:
      - title: "The Rust Book — Accessing Values in a Hash Map"
        url: "https://doc.rust-lang.org/book/ch08-03-hash-maps.html#accessing-values-in-a-hash-map"
      - title: "std::collections::HashMap::get"
        url: "https://doc.rust-lang.org/std/collections/struct.HashMap.html#method.get"
      - title: "Rust error codes — E0308"
        url: "https://doc.rust-lang.org/error_codes/E0308.html"
      - title: "The Rust Book — The Option Enum and Its Advantages Over Null Values"
        url: "https://doc.rust-lang.org/book/ch06-01-defining-an-enum.html#the-option-enum-and-its-advantages-over-null-values"
    actions:
      - id: open-board-get
        type: whiteboard.apply
        at: { scene: start }
        open: true
        clear: true
        upsertIds: [g-title]
      - id: draw-some
        type: whiteboard.apply
        at: { mark: draw-some }
        upsertIds: [g-red-call, g-red-arrow, g-some, g-red-note]
        drawMs: 2200
      - id: draw-none
        type: whiteboard.apply
        at: { mark: draw-none }
        upsertIds: [g-pink-call, g-pink-arrow, g-none, g-pink-note]
        drawMs: 2200
      - id: draw-err-code
        type: whiteboard.apply
        at: { mark: draw-err-code }
        upsertIds: [g-code, g-code-line]
        drawMs: 1600
      - id: draw-err-msg
        type: whiteboard.apply
        at: { mark: draw-err-msg }
        upsertIds: [g-err1, g-err2]
        drawMs: 2400
      - id: draw-fix
        type: whiteboard.apply
        at: { mark: draw-fix }
        upsertIds: [g-fix]
        drawMs: 1200

  - id: match-get
    narration: >
      [[mark:type-match]] So let's handle both cases with match. You've
      matched on an Option before. This one works the same way.
      [[mark:select-get]] get returns the Option, and each arm handles one
      case. Some gives us the count. None runs if the key is missing.
    sources:
      - title: "The Rust Book — The match Control Flow Construct"
        url: "https://doc.rust-lang.org/book/ch06-02-match.html"
      - title: "std::option::Option"
        url: "https://doc.rust-lang.org/std/option/enum.Option.html"
    actions:
      - id: close-board-get
        type: whiteboard.apply
        at: { scene: start, offsetMs: -400 }
        open: false
      - id: type-match
        type: editor.type
        at: { mark: type-match }
        target:
          file: main.rs
          after: "    votes.insert(\"blue\", 1);\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n    match votes.get(\"red\") {\n        Some(count) => println!(\"red has {count} votes\"),\n        None => println!(\"no votes for red\"),\n    }\n"
      - id: select-get
        type: editor.select
        at: { mark: select-get }
        target:
          file: main.rs
          text: 'votes.get("red")'
          occurrence: 1

  - id: count
    chapter: Counting with entry
    narration: >
      Now let's count more votes. insert won't help here. If the key is
      already there, insert replaces the old value. To add one, we need the
      old count first.
      [[mark:type-ballots]] Here are three ballots: blue, green, and blue
      again. The loop takes them one at a time.
      [[mark:select-entry]] entry looks up the color. or_insert puts in a zero
      if the color is new. Either way, it gives back a mutable reference to
      the count inside the map.
      [[mark:select-star]] The star gives you the count the reference points
      at, like in the Vec loop, so plus-equals one adds to the number inside
      the map. Without it, you'd get error E0368: you can't use plus-equals
      on the reference itself.
    sources:
      - title: "The Rust Book — Overwriting a Value"
        url: "https://doc.rust-lang.org/book/ch08-03-hash-maps.html#overwriting-a-value"
      - title: "The Rust Book — Updating a Value Based on the Old Value"
        url: "https://doc.rust-lang.org/book/ch08-03-hash-maps.html#updating-a-value-based-on-the-old-value"
      - title: "std::collections::hash_map::Entry::or_insert"
        url: "https://doc.rust-lang.org/std/collections/hash_map/enum.Entry.html#method.or_insert"
      - title: "Rust error codes — E0368"
        url: "https://doc.rust-lang.org/error_codes/E0368.html"
    actions:
      - id: type-ballots
        type: editor.type
        at: { mark: type-ballots, offsetMs: -200 }
        target:
          file: main.rs
          after: "        None => println!(\"no votes for red\"),\n    }\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n    let ballots = [\"blue\", \"green\", \"blue\"];\n    for color in ballots {\n        let count = votes.entry(color).or_insert(0);\n        *count += 1;\n    }\n"
      - id: select-entry
        type: editor.select
        at: { mark: select-entry }
        target:
          file: main.rs
          text: "entry(color).or_insert(0)"
          occurrence: 1
      - id: select-star
        type: editor.select
        at: { mark: select-star }
        target:
          file: main.rs
          text: "*count += 1"
          occurrence: 1

  - id: run
    narration: >
      [[mark:type-print]] Last, let's print how many colors there are, and ask
      for blue and pink. An Option can't print with plain braces, so we use
      the Debug format, with a colon and a question mark.
      [[mark:run]] Let's run it. Red has two votes. There are three colors
      now, because green was new. Blue went from one to three, so get gives
      Some three. Pink was never added, so it's None.
    sources:
      - title: "std::collections::HashMap::len"
        url: "https://doc.rust-lang.org/std/collections/struct.HashMap.html#method.len"
      - title: "std::fmt — Debug formatting ({:?})"
        url: "https://doc.rust-lang.org/std/fmt/index.html#fmtdisplay-vs-fmtdebug"
      - title: "std::option::Option (implements Debug, not Display)"
        url: "https://doc.rust-lang.org/std/option/enum.Option.html"
    actions:
      - id: type-print
        type: editor.type
        at: { mark: type-print }
        target:
          file: main.rs
          after: "        *count += 1;\n    }\n"
          occurrence: 1
        cadence: line-by-line
        text: "\n    println!(\"{} colors\", votes.len());\n    println!(\"blue: {:?}\", votes.get(\"blue\"));\n    println!(\"pink: {:?}\", votes.get(\"pink\"));\n"
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "blue: Some(3)"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: "let count = votes.entry(color).or_insert(0);"

  - id: wrap
    narration: >
      So a HashMap stores values by key. insert adds or replaces a value, get
      returns an Option because a key can be missing, and entry with
      or_insert updates a value, adding it first if the key is new. Next,
      error handling: what your program does when something can
      fail.
    sources:
      - title: "The Rust Book — Storing Keys with Associated Values in Hash Maps"
        url: "https://doc.rust-lang.org/book/ch08-03-hash-maps.html"
      - title: "The Rust Book — Error Handling"
        url: "https://doc.rust-lang.org/book/ch09-00-error-handling.html"
    actions: []

checks:
  - { type: timing.p95Ms, max: 300 }
