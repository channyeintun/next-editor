            {
              file: docs/costs.md,
              text: "- SMS — မပို့ရသေးဘူး။ ထည့်ရင် 15,000 ကျပ်အထိ\n- free tier ကျော်ရင် — 15,000 ကျပ် ချန်ထား\n",
              occurrence: 1,
            },
        }

  - id: tools
    narration: >
      [[mark:type-tools]] နောက် အပိုင်းက ဆိုင်ရဲ့ budget ထဲ မဝင်တဲ့ ကုန်ကျစရိတ်ပါ။ app ကို ဆောက်တဲ့ ကိုယ့်ဘက်က
      tool တွေ ဖြစ်လို့ ခွဲရေးထားပါတယ်။ [[mark:sel-agent-line]] AI agent ကို လစဉ် ကြေး ပုံသေ ပေးတဲ့ subscription
      နဲ့ သုံးလို့ ရသလို၊ program ကနေ model ကို တိုက်ရိုက် ခေါ်ပြီး token အလိုက် ပေးတဲ့ API နဲ့လည်း သုံးလို့
      ရပါတယ်။ API နဲ့ဆိုရင် ခုနက token ကုန်ပုံတွေက ကိုယ့် ငွေထဲကနေ တိုက်ရိုက် ကုန်တာပါ။ [[mark:sel-hours]]
      ကိုယ့်အချိန်ကိုလည်း task တစ်ခုစီအတွက် မှတ်ထားပါ။ ပုံမှန်ထက် အများကြီး ကြာနေတဲ့ task က loop ထဲမှာ ပိတ်မိနေတဲ့
      လက္ခဏာ ဖြစ်တတ်ပါတယ်။
    sources:
      - {
          title: "Claude Code docs: Manage costs effectively (subscription plans vs per-token API billing)",
          url: "https://code.claude.com/docs/en/costs",
        }
      - {
          title: "The New SDLC (Burmese edition): The economics of AI development (a monthly assistant subscription; API tokens)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - id: type-tools
        type: editor.type
        at: { mark: type-tools }
        target: { file: docs/costs.md, after: "15,000 ကျပ် ချန်ထား\n\n", occurrence: 1 }
        text: "## Builder's tools (app budget ထဲ မပါ)\n- AI agent — subscription ဆိုရင် လစဉ် ပုံသေ၊ API ဆိုရင် token အလိုက်\n- ကိုယ့်အချိန် — task တစ်ခုစီ ဘယ်နှနာရီ ကြာလဲ မှတ်\n\n"
        cadence: line-by-line
      - {
          id: sel-agent-line,
          type: editor.select,
          at: { mark: sel-agent-line },
          target:
            {
              file: docs/costs.md,
              text: "- AI agent — subscription ဆိုရင် လစဉ် ပုံသေ၊ API ဆိုရင် token အလိုက်",
              occurrence: 1,
            },
        }
      - {
          id: sel-hours,
          type: editor.select,
          at: { mark: sel-hours },
          target:
            { file: docs/costs.md, text: "- ကိုယ့်အချိန် — task တစ်ခုစီ ဘယ်နှနာရီ ကြာလဲ မှတ်", occurrence: 1 },
        }

  - id: routing
    chapter: အလုပ်နဲ့ model ကို ကိုက်ရွေး
    narration: >
      [[mark:r-open]] agent ရဲ့ ကုန်ကျစရိတ်ကို လျှော့တဲ့ နည်း တစ်ခုက model ကို ရွေးတာပါ။ model ထုတ်တဲ့ ကုမ္ပဏီ
      တစ်ခုတည်းမှာတောင် model အကြီးအသေး ရှိပြီး၊ အသေးဆုံးက token တစ်ခုချင်းရဲ့ ဈေး အဆ အများကြီး သက်သာပါတယ်။
      [[mark:r-small]] ရှည်တဲ့ log ထဲက error တွေကို စုထုတ်တာ၊ test အတွက် နမူနာ data ထုတ်တာ၊ ပြောင်းလဲမှုကို
      အကျဉ်းချုပ်တာ လို ပုံစံ ရှင်းပြီး ကိုယ်က အလွယ်တကူ စစ်နိုင်တဲ့ အလုပ်တွေအတွက် model အသေးက လုံလောက်ပါတယ်။
      [[mark:r-big]] spec ထဲက ကွက်လပ်တွေ ရှာတာ၊ ခက်တဲ့ bug ရဲ့ အကြောင်းရင်း ရှာတာ၊ security ကို ပြန်စစ်တာ လို
      ခက်ပြီး မှားရင် နစ်နာမှု ကြီးတဲ့ အလုပ်တွေအတွက်တော့ အကောင်းဆုံး model ကို သုံးပါ။ [[mark:r-rule]] ဒီလို
      အလုပ်အလိုက် model အကြီးအသေး ရွေးသုံးတာကို model routing လို့ ခေါ်ပါတယ်။ ရွေးတဲ့ စံက အလုပ် ဘယ်လောက် ခက်လဲ၊
      မှားရင် ဘယ်လောက် နစ်နာမလဲ ဆိုတာပါ။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The economics of AI development (intelligent model routing)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "Claude API docs: Pricing (the smallest model's per-token prices are many times lower than the largest's)",
          url: "https://platform.claude.com/docs/en/about-claude/pricing",
        }
      - {
          title: "Claude Code docs: Manage costs effectively (choose the right model: the strongest for complex decisions, a small model for simple tasks)",
          url: "https://code.claude.com/docs/en/costs",
        }
    actions:
      - {
          id: open-board-r,
          type: whiteboard.apply,
          at: { mark: r-open },
          open: true,
          clear: true,
          upsertIds: [r-title],
        }
      - {
          id: draw-r-small,
          type: whiteboard.apply,
          at: { mark: r-small },
          upsertIds: [r-small-h, r-s1, r-s2, r-s3],
          drawMs: 2000,
        }
      - {
          id: draw-r-big,
          type: whiteboard.apply,
          at: { mark: r-big },
          upsertIds: [r-big-h, r-b1, r-b2, r-b3],
          drawMs: 2000,
        }
      - {
          id: draw-r-rule,
          type: whiteboard.apply,
          at: { mark: r-rule },
          upsertIds: [r-rule],
          drawMs: 1100,
        }

  - id: limits
    narration: >
      [[mark:close-r]] costs ဖိုင်မှာ ကန့်သတ်ချက်တွေ ဆက်ရေးရအောင်။ [[mark:type-limits]] နောက်ဆုံး အပိုင်းက
      ကုန်ကျစရိတ်ကို သတိမထားမိဘဲ မတက်သွားအောင် ကာထားတဲ့ စည်းတွေပါ။ [[mark:sel-alert]] ပထမ စာကြောင်းက လစဉ် ကုန်ငွေ
      budget နား ရောက်လာတာကို စောစော သိအောင် ထားတဲ့ alert ပါ။ budget မကုန်ခင် ပြင်ချိန် ရအောင် နှစ်ဆင့်နဲ့
      ကိုယ့်ဆီ သတိပေးပါတယ်။ ဒါပေမဲ့ alert က သတိပေးရုံပဲ ဖြစ်ပြီး ငွေ ကုန်တာကို မရပ်ပေးပါဘူး။ [[mark:sel-limit]]
      ဒါကြောင့် token အလိုက် ပေးရတဲ့ API မှာ spend limit ပါ ထားပါတယ်။ အဲဒီ ပမာဏ ရောက်ရင် ထပ်သုံးလို့ မရတော့လို့၊
      ညဘက် ပေးထားခဲ့တဲ့ အလုပ် တစ်ခု loop ထဲ ပိတ်မိသွားရင်တောင် ငွေ အကန့်အသတ်မဲ့ မကုန်ပါဘူး။ [[mark:sel-route]]
      တတိယ စာကြောင်းကတော့ ခုနက model routing ကို ကိုယ်တို့ရဲ့ rule အဖြစ် သတ်မှတ်ထားတာပါ။
    sources:
      - {
          title: "Google Cloud docs: Create, edit, or delete budgets and budget alerts (default thresholds 50%, 90%, 100%; an alerts-only budget doesn't cap spending)",
          url: "https://docs.cloud.google.com/billing/docs/how-to/budgets",
        }
      - {
          title: "Claude Code docs: Manage costs effectively (set workspace spend limits)",
          url: "https://code.claude.com/docs/en/costs",
        }
    actions:
      - { id: close-r, type: whiteboard.apply, at: { mark: close-r }, open: false }
      - id: type-limits
        type: editor.type
        at: { mark: type-limits }
        target: { file: docs/costs.md, after: "ကြာလဲ မှတ်\n\n", occurrence: 1 }
        text: "## Limits\n- running cost — budget ရဲ့ 50% နဲ့ 90% ရောက်ရင် alert\n- AI agent API — spend limit၊ ရောက်ရင် ရပ်\n- ရိုးရှင်းတဲ့ task — model အသေး၊ ခက်တဲ့ ဆုံးဖြတ်ချက် — အကောင်းဆုံး model\n"
        cadence: line-by-line
      - {
          id: sel-alert,
          type: editor.select,
          at: { mark: sel-alert },
          target:
            {
              file: docs/costs.md,
              text: "- running cost — budget ရဲ့ 50% နဲ့ 90% ရောက်ရင် alert",
              occurrence: 1,
            },
        }
      - {
          id: sel-limit,
          type: editor.select,
          at: { mark: sel-limit },
          target:
            { file: docs/costs.md, text: "- AI agent API — spend limit၊ ရောက်ရင် ရပ်", occurrence: 1 },
        }
      - {
          id: sel-route,
          type: editor.select,
          at: { mark: sel-route },
          target:
            {
              file: docs/costs.md,
              text: "- ရိုးရှင်းတဲ့ task — model အသေး၊ ခက်တဲ့ ဆုံးဖြတ်ချက် — အကောင်းဆုံး model",
              occurrence: 1,
            },
        }

  - id: quiz
    narration: >
      [[mark:quiz]] မေးခွန်း တစ်ခု မေးပါရစေ။ ဈေးနှုန်းကို ဘယ်ဖိုင်မှာ ပြလဲ ဆိုတဲ့ မေးခွန်း သေးသေးလေး တစ်ခု
      မေးတိုင်း၊ agent က project ထဲက ဖိုင် အားလုံးကို ပြန်ဖတ်နေတယ် ဆိုပါစို့။ token ကုန်တာကို ဘာက ပိုလျှော့ပေးမလဲ။
      က၊ project တစ်ခုလုံး ဆံ့တဲ့ context window ပိုကြီးတဲ့ model ကို ပြောင်းမလား။ ခ၊ ဘယ်ဖိုင်ကို ကြည့်ရမလဲ
      ညွှန်ပြီး တိတိကျကျ မေးမလား။ lesson ကို pause လုပ်ပြီး စဉ်းစားကြည့်ပါ။ [[mark:quiz-answer]] အဖြေကတော့ ခ၊
      ကြည့်ရမယ့် ဖိုင်ကို ညွှန်ပြီး တိတိကျကျ မေးတာပါ။ ဘာကြောင့်လဲဆိုတော့ window ကြီးတဲ့ model မှာ ဖိုင် အားလုံး
      ဆံ့ပေမဲ့၊ ဖတ်တဲ့ token တိုင်းအတွက် ငွေ ပေးရတာ မပြောင်းလို့ပါ။ ပြဿနာက ပို့တဲ့ စာ များနေတာ ဖြစ်လို့ ပို့တဲ့
      စာကို လျှော့မှ ပြေပါတယ်။ [[mark:quiz-more]] task ကြီးပြီး မရှင်းရင်လည်း agent က project တစ်ခုလုံးကို
      ရှာဖတ်တတ်လို့၊ task ကို သေးသေး ခွဲတာကလည်း token ကို ချွေပါတယ်။
    sources:
      - {
          title: "Claude Code docs: Manage costs effectively (vague requests trigger broad scanning; specific requests need minimal file reads; clear between tasks)",
          url: "https://code.claude.com/docs/en/costs",
        }
      - {
          title: "The New SDLC (Burmese edition): The economics of AI development (context engineering as a financial lever)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: draw-quiz,
          type: whiteboard.apply,
          at: { mark: quiz },
          open: true,
          clear: true,
          upsertIds: [z-title, z-q1, z-q2, z-o1, z-o2],
          drawMs: 2400,
        }
      - {
          id: draw-quiz-answer,
          type: whiteboard.apply,
          at: { mark: quiz-answer },
          upsertIds: [z-a, z-a-note],
          drawMs: 1400,
        }
      - {
          id: draw-quiz-more,
          type: whiteboard.apply,
          at: { mark: quiz-more },
          upsertIds: [z-more],
          drawMs: 1000,
        }

  - id: context-line
    narration: >
      [[mark:close-quiz]] ဒီ အဖြေကို limit အပိုင်းရဲ့ နောက်ဆုံး စာကြောင်း အဖြစ် ထည့်ပါမယ်။ [[mark:type-context]]
      ဒီ စာကြောင်းက model ဆီ ပို့တဲ့ စာ များလာနိုင်တဲ့ နေရာ သုံးခုကို ထိန်းထားတာပါ။ အမြဲ ပါတဲ့ ဖိုင်၊ agent ဖတ်တဲ့
      ဖိုင်နဲ့ session ထဲမှာ စုလာတဲ့ စကားတွေပါ။ board ပေါ်မှာ token ကုန်တဲ့ နေရာ လေးခု ကြည့်ခဲ့တုန်းက ပထမ
      သုံးခုနဲ့ တစ်ခုချင်း ကိုက်နေပါတယ်။
    sources:
      - {
          title: "Claude Code docs: Manage costs effectively (clear between tasks; move instructions out of the always-loaded file)",
          url: "https://code.claude.com/docs/en/costs",
        }
      - {
          title: "The New SDLC (Burmese edition): Context engineering (static vs dynamic context)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - { id: close-quiz, type: whiteboard.apply, at: { mark: close-quiz }, open: false }
      - id: type-context
        type: editor.type
        at: { mark: type-context }
        target: { file: docs/costs.md, after: "— အကောင်းဆုံး model\n", occurrence: 1 }
        text: "- AGENTS.md တိုတို၊ English။ task မှာ လိုတဲ့ ဖိုင်ကိုပဲ ညွှန်၊ task ပြီးရင် session အသစ်\n"
        cadence: line-by-line
      - {
          id: expect-context,
          type: expect.file,
          at: { afterAction: type-context },
          path: docs/costs.md,
          contains: "task မှာ လိုတဲ့ ဖိုင်ကိုပဲ ညွှန်",
        }

  - id: recap
    chapter: ပြန်ချုပ်ရရင်
    narration: >
      ဒါဆို ပြန်ချုပ်ရရင်၊ model ဆီ ပို့တဲ့ token နဲ့ ထုတ်ပေးတဲ့ token အလိုက် ငွေ ပေးရပြီး၊ agent က loop
      တစ်ပတ်ချင်းမှာ rule ဖိုင်၊ ဖတ်ထားတဲ့ ဖိုင်နဲ့ session ထဲက စကားတွေကို ပြန်ပို့ပါတယ်။ မြန်မာစာက token
      ပိုကုန်လို့ အမြဲ ဖတ်ရတဲ့ ဖိုင်ကို English နဲ့ တိုတို ထားပါ။ spec၊ test နဲ့ rule တွေကို အစမှာ ရေးတာက လစဉ်
      ကုန်ကျစရိတ်ကို လျှော့ပေးပါတယ်။ [[mark:rc-running]] app ကို run ထားတဲ့ ငွေနဲ့ ကိုယ့် tool တွေအတွက် ငွေကို
      ခွဲရေးထားပါ။ [[mark:rc-limits]] အလုပ်နဲ့ model ကို ကိုက်ရွေးပြီး alert နဲ့ spend limit ထားပါ။ နောက် lesson
      မှာတော့ rule ဖိုင်၊ tool နဲ့ အလိုလို run တဲ့ စစ်ဆေးချက်တွေ အပါအဝင် agent ကို ဝန်းရံထားတဲ့ စနစ်၊ harness ကို
      လေ့လာသွားပါမယ်။
    sources:
