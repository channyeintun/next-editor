    narration: >
      ပြီးခဲ့တဲ့ lesson မှာ customer တွေ တကယ် သုံးနေတဲ့ app ကို log၊ error နဲ့ အော်ဒါ အရေအတွက်လို metric တွေကနေ
      စောင့်ကြည့်ပြီး၊ အော်ဒါ ဝင်မလာတော့ရင် ဘာလုပ်ရမလဲ ဆိုတာကို runbook ထဲမှာ ရေးခဲ့ပါတယ်။ app က ပုံမှန်
      အလုပ်လုပ်နေပြီ ဆိုတော့ ဆိုင်ပိုင်ရှင် မြမြ က တစ်လ ဘယ်လောက် ကုန်မလဲ လို့ မေးပါတယ်။ [[mark:open-req]]
      requirements တွေ ရေးတုန်းက မြမြ နဲ့ budget တစ်ခု သဘောတူထားခဲ့ပါတယ်။ [[mark:sel-budget]] ဒါက app ကို internet
      ပေါ်မှာ အမြဲ အလုပ်လုပ်နေအောင် run ထားဖို့ တစ်လ ကုန်ခွင့် ရှိတဲ့ အများဆုံး ငွေပါ။ ဒါပေမဲ့ app ကို AI agent
      နဲ့ ဆောက်နေတဲ့ ကိုယ့်ဘက်မှာလည်း ငွေ ကုန်ပြီး၊ ဘယ်လောက် ကုန်မလဲ ဆိုတာက agent ကို ဘယ်လို သုံးလဲ ဆိုတာပေါ်
      အများကြီး မူတည်ပါတယ်။ ဒီနေ့ ငွေ ဘယ်ကို ကုန်လဲ ရှာပြီး ဖိုင် တစ်ခုမှာ စုရေးပါမယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The economics of AI development (total cost of ownership)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "Claude Code docs: Manage costs effectively (Claude Code charges by API token consumption)",
          url: "https://code.claude.com/docs/en/costs",
        }
    actions:
      - {
          id: open-req,
          type: workspace.openFile,
          at: { mark: open-req },
          path: docs/requirements.md,
        }
      - {
          id: sel-budget,
          type: editor.select,
          at: { mark: sel-budget },
          target:
            { file: docs/requirements.md, text: "- run ဖို့ တစ်လ 30,000 ကျပ်ထက် မကုန်ရဘူး။", occurrence: 1 },
        }

  - id: tokens
    chapter: Token ဆိုတာ ဘာလဲ
    narration: >
      [[mark:t-open]] ကိုယ့်ဘက်က ကုန်ကျစရိတ်ကနေ စကြည့်ရအောင်။ AI model တွေက စာကို token လို့ ခေါ်တဲ့ အပိုင်းလေးတွေ
      ခွဲပြီး ဖတ်ပါတယ်။ အသုံးများတဲ့ English စကားလုံး တစ်လုံးက token တစ်ခုလောက် ဖြစ်တတ်ပြီး၊ ရှည်တဲ့ ဒါမှမဟုတ်
      အသုံးနည်းတဲ့ စကားလုံးကိုတော့ အပိုင်း နှစ်ခု သုံးခု ခွဲတတ်ပါတယ်။ model ဆီ ပို့တဲ့ token ရော၊ model ထုတ်ပေးတဲ့
      token ပါ ငွေ ပေးရပါတယ်။ [[mark:t-rules]] agent က ဖတ်၊ လုပ်၊ ပြန်ကြည့်တဲ့ loop တစ်ပတ်ချင်းမှာ model ဆီ ဘာတွေ
      ပို့လဲ ကြည့်ရအောင်။ ပထမက agent နဲ့ အလုပ် အသစ် စတဲ့ session တိုင်း အမြဲ ပါတဲ့ AGENTS.md လို rule ဖိုင်ပါ။
      [[mark:t-files]] ဒုတိယက task အတွက် agent ဖွင့်ဖတ်တဲ့ ဖိုင်တွေပါ။ ဖိုင် များလေ token များလေပါ။
      [[mark:t-chat]] တတိယက session ထဲမှာ အခုထိ ပြောခဲ့သမျှ စကားတွေပါ။ model က အရင် ပြောခဲ့တာတွေကို သူ့ဘာသာ
      မှတ်မထားလို့၊ agent က loop တစ်ပတ်ချင်းမှာ အဲဒါတွေကို ပြန်ပို့ရပါတယ်။ ပြန်ပို့တဲ့ စာကို ဈေးလျှော့ပေးတဲ့ နည်း
      ရှိပေမဲ့ အခမဲ့တော့ မဟုတ်ပါဘူး။ ဒါကြောင့် session ရှည်လေ၊ မေးခွန်း သေးသေးလေး မေးတာတောင် ငွေ ပိုကုန်လေပါ။
      [[mark:t-retry]] စတုတ္ထက error ကို ကူးပို့ပြီး ထပ်ခါထပ်ခါ ပြင်ခိုင်းတာတွေပါ။ အကြိမ်တိုင်း ဒီ အရာတွေ အကုန်
      ပြန်ပါသွားပါတယ်။ [[mark:t-out]] agent ရေးပေးတဲ့ code နဲ့ စာတွေကတော့ ထုတ်ပေးတဲ့ token ဖြစ်ပြီး၊ တစ်ခုချင်းရဲ့
      ဈေး ပိုကြီးပါတယ်။
    sources:
      - {
          title: "Claude API docs: Glossary — Tokens (words, subwords, characters or bytes; depends on the model and the language)",
          url: "https://platform.claude.com/docs/en/about-claude/glossary",
        }
      - {
          title: "Claude API docs: Pricing (input and output tokens priced per million; output tokens cost more)",
          url: "https://platform.claude.com/docs/en/about-claude/pricing",
        }
      - {
          title: "Claude Code docs: Manage costs effectively (token costs scale with context size; the full conversation is sent with every request)",
          url: "https://code.claude.com/docs/en/costs",
        }
      - {
          title: "The New SDLC (Burmese edition): The economics of AI development (token burn, prompting loops)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: open-board-t,
          type: whiteboard.apply,
          at: { mark: t-open },
          open: true,
          clear: true,
          upsertIds: [t-title, t-model-box, t-model],
          drawMs: 1400,
        }
      - {
          id: draw-t-rules,
          type: whiteboard.apply,
          at: { mark: t-rules },
          upsertIds: [t-rules, t-arrow],
          drawMs: 1200,
        }
      - {
          id: draw-t-files,
          type: whiteboard.apply,
          at: { mark: t-files },
          upsertIds: [t-files],
          drawMs: 900,
        }
      - {
          id: draw-t-chat,
          type: whiteboard.apply,
          at: { mark: t-chat },
          upsertIds: [t-chat],
          drawMs: 900,
        }
      - {
          id: draw-t-retry,
          type: whiteboard.apply,
          at: { mark: t-retry },
          upsertIds: [t-retry],
          drawMs: 900,
        }
      - {
          id: draw-t-out,
          type: whiteboard.apply,
          at: { mark: t-out },
          upsertIds: [t-out],
          drawMs: 900,
        }

  - id: burmese
    narration: >
      [[mark:t-mm]] ဘာသာစကားကလည်း token အရေအတွက်ကို ပြောင်းစေပါတယ်။ အဓိပ္ပာယ် တူတဲ့ စာကို မြန်မာလို ရေးရင် English
      ထက် token အများကြီး ပိုထွက်တတ်ပါတယ်။ ဘာကြောင့်လဲဆိုတော့ အများသုံး model တွေက စာကို ခွဲတဲ့ ပုံစံကို English
      လို စာ အများကြီး ရှိတဲ့ ဘာသာတွေရဲ့ data ကနေ အဓိက ဆောက်ထားလို့ပါ။ ဒါကြောင့် မြန်မာစာကို အပိုင်းလေးတွေ
      အများကြီး ခွဲရပါတယ်။ ဒါကို project စီစဉ်တဲ့အခါ ထည့်တွက်ရမယ့် အချက်ပါ။ [[mark:t-en]] AGENTS.md ကို English
      နဲ့ ရေးခဲ့တဲ့ အကြောင်းရင်း တစ်ခုလည်း ဒါပါပဲ။ [[mark:close-t]] AGENTS.md ဖိုင်ကို ပြန်ကြည့်ရအောင်။
      [[mark:open-agents]] ဒီ ဖိုင်က session တိုင်း ပါပြီး loop တစ်ပတ်ချင်းမှာ ပြန်ပါသွားပါတယ်။ [[mark:sel-rules]]
      ဒါကြောင့် ဒီ rule စာရင်းမှာ စာကြောင်း တစ်ကြောင်း ပိုထည့်တိုင်း၊ အဲဒီ စာကြောင်းအတွက် ငွေကို loop အကြိမ်တိုင်း
      ထပ်ပေးရပါတယ်။ spec လို စာတမ်းတွေကိုတော့ ဆိုင်က လူတွေပါ ဖတ်ရလို့ မြန်မာလိုပဲ ထားပါတယ်။ agent ကလည်း အဲဒါတွေကို
      ဒီဖိုင်လို အမြဲ မယူဘဲ၊ ပြင်စရာ ရှိမှ ဖွင့်ဖတ်တာမို့ အကြိမ်ရေ နည်းပါတယ်။
    sources:
      - {
          title: "Teklehaymanot & Nejdl: Tokenization Disparities as Infrastructure Bias (arXiv 2510.12389) — Myanmar script has the highest token density of the scripts measured, nearly 7-fold the Latin script (cl100k_base); tokenizers reflect high-resource training data",
          url: "https://arxiv.org/abs/2510.12389",
        }
      - {
          title: "Petrov et al.: Language Model Tokenizers Introduce Unfairness Between Languages (arXiv 2305.15425)",
          url: "https://arxiv.org/abs/2305.15425",
        }
      - {
          title: "Claude Code docs: Manage costs effectively (CLAUDE.md is loaded at session start; keep it to essentials)",
          url: "https://code.claude.com/docs/en/costs",
        }
      - {
          title: "The New SDLC (Burmese edition): Context engineering (always-loaded context costs tokens in every interaction)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: draw-t-mm,
          type: whiteboard.apply,
          at: { mark: t-mm },
          upsertIds: [t-mm],
          drawMs: 1100,
        }
      - {
          id: draw-t-en,
          type: whiteboard.apply,
          at: { mark: t-en },
          upsertIds: [t-en],
          drawMs: 1000,
        }
      - { id: close-t, type: whiteboard.apply, at: { mark: close-t }, open: false }
      - { id: open-agents, type: workspace.openFile, at: { mark: open-agents }, path: AGENTS.md }
      - {
          id: sel-rules,
          type: editor.select,
          at: { mark: sel-rules },
          target:
            {
              file: AGENTS.md,
              text: "## Rules\n- Prices are whole kyat (integers). Never use decimals.\n- Customer-facing text is Burmese (Unicode).\n- Times are Asia/Yangon.\n- Ask before adding any package.\n- One task at a time. Keep each change small.\n- Accept Burmese digits (၀–၉) wherever a number is typed.\n",
              occurrence: 1,
            },
        }

  - id: curves
    chapter: အစမှာ ကုန်တာ၊ လတိုင်း ကုန်တာ
    narration: >
      [[mark:c-open]] အခု ကုန်ကျစရိတ်ကို အချိန်အလိုက် ကြည့်ရအောင်။ နှစ်မျိုး ခွဲလို့ ရပါတယ်။ တစ်မျိုးက မဆောက်ခင်
      အစမှာ တစ်ခါ ရင်းရတဲ့ ငွေနဲ့ အချိန်ပါ။ နောက်တစ်မျိုးက ဆောက်ပြီးနောက် run ထားဖို့၊ ပြင်ဖို့၊ ထိန်းဖို့ လတိုင်း
      ဆက်ပေးနေရတာပါ။ [[mark:c-vibe]] ထွက်လာတာကို မဖတ်ဘဲ လက်ခံပြီး ဆက်သွားတဲ့ vibe coding မှာ အစ ကုန်ကျစရိတ်က
      နည်းပါတယ်။ [[mark:c-vibe-up]] ဒါပေမဲ့ လ ကြာလာတာနဲ့အမျှ တက်လာပါတယ်။ error ကို ကူးပို့ပြီး ထပ်ခိုင်းတဲ့ loop
      တွေမှာ token ကုန်သလို၊ ဘယ်သူမှ မဖတ်ခဲ့တဲ့ code ကို နောက်မှ ပြင်ရတာလည်း ကြာပါတယ်။ customer တွေ သုံးပြီးမှ
      တွေ့တဲ့ security ပြဿနာကို ပြင်ရတာက စောစော ဖမ်းမိတာထက် အများကြီး ပိုကုန်ပါတယ်။ [[mark:c-str]] ကိုယ်တို့ ဒီ
      course မှာ လုပ်လာတဲ့ ပုံစံကတော့ ပြောင်းပြန်ပါ။ problem၊ spec၊ test plan နဲ့ AGENTS.md တွေကို အစမှာ ရေးရလို့
      အစ ကုန်ကျစရိတ် ပိုများပါတယ်။ [[mark:c-str-flat]] ဒါပေမဲ့ agent ထုတ်ပေးတာ ပထမ တစ်ခါမှာတင် မှန်တာ
      ပိုများလာပြီး စစ်ဖို့ test တွေလည်း ရှိပြီးသားမို့၊ feature တစ်ခုချင်း ထပ်ဆောက်တဲ့ ကုန်ကျစရိတ်က နည်းပြီး
      ငြိမ်ပါတယ်။ တစ်ညနေပဲ သုံးမယ့် စမ်းစရာ prototype ဆိုရင် ဘယ်ဘက်က တန်ပေမဲ့၊ လ ပေါင်းများစွာ customer တွေ
      သုံးမယ့် ကိုယ်တို့ app အတွက်တော့ ညာဘက်က တန်ပါတယ်။ [[mark:c-time]] ကိုယ့်အချိန်ကိုလည်း ထည့်တွက်ပါ။ loop ထဲမှာ
      ထိုင်နေရတဲ့ နာရီတွေက ငွေ မဟုတ်ပေမဲ့ ကုန်ကျစရိတ်ပါ။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The economics of AI development (CapEx and OpEx; vibe coding's hidden debt; the agentic engineering investment)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "The New SDLC (Burmese edition): The vibe coding to agentic engineering spectrum",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
    actions:
      - {
          id: open-board-c,
          type: whiteboard.apply,
          at: { mark: c-open },
          open: true,
          clear: true,
          upsertIds: [c-title],
        }
      - {
          id: draw-c-vibe,
          type: whiteboard.apply,
          at: { mark: c-vibe },
          upsertIds: [c-vibe-h, c-v-axis, c-v1],
          drawMs: 1300,
        }
      - {
          id: draw-c-vibe-up,
          type: whiteboard.apply,
          at: { mark: c-vibe-up },
          upsertIds: [c-v2, c-v3, c-v4, c-v5, c-v-note],
          drawMs: 2400,
        }
      - {
          id: draw-c-str,
          type: whiteboard.apply,
          at: { mark: c-str },
          upsertIds: [c-str-h, c-s-axis, c-s1],
          drawMs: 1500,
        }
      - {
          id: draw-c-str-flat,
          type: whiteboard.apply,
          at: { mark: c-str-flat },
          upsertIds: [c-s2, c-s3, c-s4, c-s5, c-s-note],
          drawMs: 2400,
        }
      - {
          id: draw-c-time,
          type: whiteboard.apply,
          at: { mark: c-time },
          upsertIds: [c-time],
          drawMs: 1000,
        }

  - id: running
    chapter: Costs ဖိုင် ရေးရအောင်
    narration: >
      [[mark:close-c]] ကဲ၊ ဆိုင်ရဲ့ ကုန်ကျစရိတ်တွေကို ရေးထားရအောင်။ [[mark:open-costs]] costs ဖိုင်မှာ အခု
      ခေါင်းစဉ်ပဲ ရှိပါသေးတယ်။ [[mark:type-running]] ပထမ အပိုင်းက app ကို run ထားဖို့ လတိုင်း ကုန်မယ့် ငွေပါ။
      requirements ထဲက budget ကို အပေါ်မှာ ညွှန်ပြီး၊ အဲဒီ budget ထဲ ဘာတွေ ဝင်လဲ တစ်ကြောင်းချင်း ခွဲထားပါတယ်။ app
      ကို internet ပေါ် တင်ပေးတဲ့ hosting နဲ့ database ကို၊ သုံးတာ နည်းသေးသရွေ့ ငွေ မပေးရတဲ့ free tier နဲ့ စပါတယ်။
      [[mark:sel-db]] database အတွက် ဒီ ရွေးချယ်မှုက decision record ထဲမှာ ရှိပြီးသားမို့ ADR နံပါတ် နှစ် ကို
      ညွှန်ထားပါတယ်။ [[mark:sel-sms]] SMS ကို နောက်မှ ထည့်ရင် ဘယ်လောက်အထိ သုံးခွင့် ရှိလဲ ကြိုသတ်မှတ်ထားပြီး၊ free
      tier ကျော်တဲ့ လအတွက်လည်း ငွေ ချန်ထားပါတယ်။ ဒီလို ခွဲထားတော့ ဘယ် စာကြောင်းက သတ်မှတ်ထားတာထက် ကျော်နေလဲ
      ချက်ချင်း မြင်ရပါတယ်။
    sources:
      - {
          title: "The New SDLC (Burmese edition): The economics of AI development (the cost to run, fix and maintain)",
          url: "https://github.com/channyeintun/The-New-SDLC",
        }
      - {
          title: "Google Cloud docs: Create, edit, or delete budgets and budget alerts (a budget is planned spend; alerts-only budgets don't cap spend)",
          url: "https://docs.cloud.google.com/billing/docs/how-to/budgets",
        }
    actions:
      - { id: close-c, type: whiteboard.apply, at: { mark: close-c }, open: false }
      - { id: open-costs, type: workspace.openFile, at: { mark: open-costs }, path: docs/costs.md }
      - id: type-running
        type: editor.type
        at: { mark: type-running }
        target: { file: docs/costs.md, after: "# Costs · ကြိုမှာ app\n\n", occurrence: 1 }
        text: "## Running cost (တစ်လ)\nBudget — 30,000 ကျပ်အောက် (requirements.md)\n- hosting — free tier၊ 0 ကျပ်\n- database — managed service ရဲ့ free tier (ADR-002)၊ 0 ကျပ်\n- SMS — မပို့ရသေးဘူး။ ထည့်ရင် 15,000 ကျပ်အထိ\n- free tier ကျော်ရင် — 15,000 ကျပ် ချန်ထား\n\n"
        cadence: line-by-line
      - {
