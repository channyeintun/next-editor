# AI Builder, lesson 27: the cost of AI development (Burmese, docs kind).
#
# Start state (ws/): base-docs (package.json with a no-op dev script, notes.md, unused);
# docs/requirements.md as L21 leaves it (COURSE-KIT §4.2 + L21's Burmese-digit edge case; nothing
# changes it in L22–L26); AGENTS.md as L24 leaves it (§4.4 base + L17 Simplicity + L21 digits rule +
# L24 Security); docs/costs.md pinned with only its title line (the entry file). Nothing runs.
#
# Typed: docs/costs.md (lesson-local, COURSE-KIT §4.19 outline; full text in DESIGN.md): Running cost
# (the 30,000 ကျပ် budget from requirements.md, hosting, database free tier (ADR-002), SMS later, a
# reserve) · Builder's tools (the agent subscription or API, own time; outside the app budget) ·
# Limits (budget alert, spend limit, model routing; the last line — short AGENTS.md, point at the one
# file, new session per task — is typed after the quiz as its answer).
#
# Boards: (T) where an agent's tokens go: rules file every session, files read, the session's chat
# sent again each loop, retries; output tokens cost more; Burmese takes many more tokens → AGENTS.md
# stays English and short; (C) upfront vs running cost as monthly bars: vibe coding (low start,
# rising) vs structured work (high start, low and flat) + own time; (R) model routing: small model for
# simple checkable jobs, the strongest for costly decisions; (Z) the quiz.
#
# Build: bun ~/Documents/ai-builder-course-work/tools/build-lesson.ts template.yaml ws ai-builder-27-cost.yaml
