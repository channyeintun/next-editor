      index.html: |
        <!doctype html>
        <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Typed greeting</title>
          </head>
          <body>
            <main>
              <label for="name">Name</label>
              <input id="name" data-testid="name-input" autocomplete="off" />
              <button type="button" data-testid="greet-button">Greet</button>
              <output data-testid="greeting" data-state="idle">Waiting for a name</output>
            </main>
            <script type="module" src="/src/main.ts"></script>
          </body>
        </html>
      src/main.ts: |
        const input = document.querySelector<HTMLInputElement>('[data-testid="name-input"]');
        const button = document.querySelector<HTMLButtonElement>('[data-testid="greet-button"]');
        const output = document.querySelector<HTMLOutputElement>('[data-testid="greeting"]');

        if (!input || !button || !output) {
          throw new Error("The greeting controls are missing");
        }

        button.addEventListener("click", () => {
          const name = input.value.trim() || "friend";
          output.textContent = `Hello, ${name}!`;
          output.dataset.state = "ready";
          history.pushState(null, "", `/hello?name=${encodeURIComponent(name)}`);
        });

build:
  voiceProfile: pocket-alba-v1
  seed: 29

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: npm ci --no-audit --no-fund
  runCommand: npm run dev
  expectedPort: 5173
  lockfilePath: package-lock.json
  environment: {}

scenes:
  - id: typed-greeting
    narration: >
      This small Vite page uses TypeScript element types to keep its event
      handler honest. [[mark:start-runtime]] Start the pinned workspace while
      we trace the data flow. The input begins empty, and the output begins in
      an idle state. A click reads the current value, writes visible text, and
      records that the result is ready. The handler also changes the route, so
      one interaction produces two observable outcomes. Stable test IDs let
      the performer address those controls without guessing CSS structure or
      screen coordinates. The runtime and iframe each acknowledge readiness
      before an interaction can run. [[mark:fill-name]] Enter Ada through the
      preview bridge. The input event follows the same browser path as a user
      edit. [[mark:greet]] Click Greet. The recorded checkpoint must now see
      the greeting text, ready state, and new route together.
    sources:
      - title: "TypeScript Handbook — DOM Manipulation"
        url: "https://www.typescriptlang.org/docs/handbook/dom-manipulation.html"
      - title: "Vite — Getting Started"
        url: "https://vite.dev/guide/"
    actions:
      - id: start-runtime
        type: runtime.start
        at: { mark: start-runtime }
        timeoutMs: 45000
        retry: { maxAttempts: 2, delayMs: 500 }
      - id: wait-for-preview-server
        type: runtime.waitForReady
        at: { afterAction: start-runtime }
        timeoutMs: 20000
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: open-preview
        type: preview.open
        at: { afterAction: wait-for-preview-server }
        timeoutMs: 10000
        mode: docked
        retry: { maxAttempts: 2, delayMs: 250 }
      - id: fill-name
        type: preview.input
        at: { mark: fill-name }
        timeoutMs: 5000
        target: { by: testId, value: name-input }
        value: Ada
        retry: { maxAttempts: 2, delayMs: 150 }
      - id: click-greet
        type: preview.click
        at: { mark: greet }
        timeoutMs: 5000
        target: { by: testId, value: greet-button }
        retry: { maxAttempts: 1, delayMs: 0 }
      - id: expect-greeting
        type: expect.preview
        at: { afterAction: click-greet }
        timeoutMs: 5000
        target: { by: testId, value: greeting }
        textContains: "Hello, Ada!"
        route: /hello?name=Ada
        attribute: { name: data-state, value: ready }
        retry: { maxAttempts: 3, delayMs: 150 }

checks: []
