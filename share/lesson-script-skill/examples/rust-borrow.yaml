build:
  voiceProfile: pocket-alba-v1
  seed: 21

runtime:
  kind: rust-playground
  defaultMode: fixture
  fixture:
    latencyMs: 600
    result:
      status: success
      stdout: "Rust has 4 bytes\nreaders: Rust and Rust\nowner: Rust!\n"
      stderr: ""

scenes:
  - id: recap
    chapter: Why borrow?
    narration: >
      You've seen the three ownership rules. Every value has an owner.
      There's only one owner at a time. When the owner goes out of scope,
      the value is dropped.
      [[mark:show-move]] You've also seen a move. Once s1 is assigned to s2,
      using s1 again is error E0382. The message says borrow, because
      printing s1 only borrows it. But passing a String to a function moves
      it, just like assignment. So how can a function use your String without
      taking it? It borrows it.
    sources:
      - title: "The Rust Book — Ownership Rules"
        url: "https://doc.rust-lang.org/book/ch04-01-what-is-ownership.html#ownership-rules"
      - title: "The Rust Book — Ownership and Functions"
        url: "https://doc.rust-lang.org/book/ch04-01-what-is-ownership.html#ownership-and-functions"
      - title: "Rust error codes — E0382"
        url: "https://doc.rust-lang.org/error_codes/E0382.html"
    actions:
      # Opens in the quiet handle before the first word.
      - id: show-rules
        type: slide.show
        at: { scene: start, offsetMs: -1200 }
        slideId: ownership-rules
      # No close first: showing another slide advances the deck in place.
      - id: show-move
        type: slide.show
        at: { mark: show-move }
        slideId: move-error

  - id: reference
    narration: >
      A reference is how you borrow.
      [[mark:draw-owner]] Here's a String called owner. It owns the text
      Rust, on the heap.
      [[mark:draw-ref]] Put an ampersand before owner, and you get a
      reference. It points at owner, so you can read through it.
      [[mark:draw-drop]] But it doesn't own the value. When the borrow ends,
      nothing is dropped. The text stays with owner.
    sources:
      - title: "The Rust Book — References and Borrowing"
        url: "https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html"
    actions:
      - id: close-move
        type: slide.close
        at: { scene: start }
      - id: open-board-ref
        type: whiteboard.apply
        at: { scene: start, offsetMs: 300 }
        open: true
        upsertIds: [r-title]
      - id: draw-owner
        type: whiteboard.apply
        at: { mark: draw-owner }
        upsertIds:
          [
            r-owner-box,
            r-owner-text,
            r-heap-arrow,
            r-heap-box,
            r-heap-text,
            r-heap-label,
            r-owner-label,
          ]
        drawMs: 2400
      - id: draw-ref
        type: whiteboard.apply
        at: { mark: draw-ref }
        upsertIds: [r-ref-box, r-ref-text, r-ref-arrow, r-ref-label]
        drawMs: 2400
      - id: draw-drop
        type: whiteboard.apply
        at: { mark: draw-drop }
        upsertIds: [r-drop]
        drawMs: 1600

  - id: measure
    chapter: Borrowing in a function
    narration: >
      Let's put that in code. Here, owner holds the text Rust.
      [[mark:type-measure]] Let's add a function called measure. It returns
      the length of a String, in bytes.
      [[mark:select-ref-type]] Look at the parameter's type: ampersand String,
      a reference to a String. So measure borrows the String. It reads it,
      but never owns it.
    sources:
      - title: "The Rust Book — References and Borrowing"
        url: "https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html"
      - title: "std::string::String::len"
        url: "https://doc.rust-lang.org/std/string/struct.String.html#method.len"
    actions:
      - id: close-board-ref
        type: whiteboard.apply
        at: { scene: start }
        open: false
      - id: open-main
        type: workspace.openFile
        at: { scene: start, offsetMs: 800 }
        path: main.rs
      - id: type-measure
        type: editor.type
        at: { mark: type-measure }
        target:
          file: main.rs
          after: ""
          occurrence: 1
        cadence: line-by-line
        text: "fn measure(text: &String) -> usize {\n    text.len()\n}\n\n"
      - id: select-ref-type
        type: editor.select
        at: { mark: select-ref-type }
        target:
          file: main.rs
          text: "&String"
          occurrence: 1

  - id: call
    narration: >
      [[mark:type-call]] Now let's call it. We write the ampersand at the call
      too, so we lend owner instead of moving it.
      [[mark:select-call]] The borrow starts here, and it ends when measure
      returns.
      [[mark:type-print-length]] So owner is still valid. Let's print it
      with its length.
    sources:
      - title: "The Rust Book — References and Borrowing"
        url: "https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html"
    actions:
      - id: type-call
        type: editor.type
        at: { mark: type-call }
        target:
          file: main.rs
          after: "    let owner = String::from(\"Rust\");\n"
          occurrence: 1
        cadence: natural
        text: "    let length = measure(&owner);\n"
      - id: select-call
        type: editor.select
        at: { mark: select-call }
        target:
          file: main.rs
          text: "&owner"
          occurrence: 1
      - id: type-print-length
        type: editor.type
        at: { mark: type-print-length }
        target:
          file: main.rs
          after: "    let length = measure(&owner);\n"
          occurrence: 1
        cadence: line-by-line
        text: "    println!(\"{owner} has {length} bytes\");\n"

  - id: readers
    narration: >
      A plain ampersand makes a shared, or immutable, reference. Shared
      references only read, so you can have as many as you want at once.
      [[mark:type-readers]] Let's make two, first and second, and print both.
    sources:
      - title: "The Rust Book — Mutable References"
        url: "https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html#mutable-references"
    actions:
      - id: type-readers
        type: editor.type
        at: { mark: type-readers }
        target:
          file: main.rs
          after: "    println!(\"{owner} has {length} bytes\");\n"
          occurrence: 1
        cadence: line-by-line
        text: "    let first = &owner;\n    let second = &owner;\n    println!(\"readers: {first} and {second}\");\n"

  - id: mutable
    chapter: Mutable references
    narration: >
      What if a function needs to change the String? Then it needs a mutable
      reference. [[mark:type-mut]] First, the owner must allow changes, so
      let's add mut. Without it, you'd get error E0596: owner isn't declared
      as mutable.
      [[mark:type-exclaim]] Now a function called exclaim. It adds an
      exclamation mark to the end.
      [[mark:select-mut-type]] Its parameter is ampersand mut String: a
      reference that can change what it borrows.
      [[mark:type-exclaim-call]] We call it with ampersand mut owner, and the
      last line prints the result.
    sources:
      - title: "The Rust Book — Mutable References"
        url: "https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html#mutable-references"
      - title: "Rust error codes — E0596"
        url: "https://doc.rust-lang.org/error_codes/E0596.html"
      - title: "std::string::String::push_str"
        url: "https://doc.rust-lang.org/std/string/struct.String.html#method.push_str"
    actions:
      - id: type-mut
        type: editor.type
        at: { mark: type-mut }
        target:
          file: main.rs
          after: "fn main() {\n    let "
          occurrence: 1
        cadence: natural
        text: "mut "
      - id: type-exclaim
        type: editor.type
        at: { mark: type-exclaim }
        target:
          file: main.rs
          after: "    text.len()\n}\n"
          occurrence: 1
        cadence: line-by-line
        text: "\nfn exclaim(text: &mut String) {\n    text.push_str(\"!\");\n}\n"
      - id: select-mut-type
        type: editor.select
        at: { mark: select-mut-type }
        target:
          file: main.rs
          text: "&mut String"
          occurrence: 1
      - id: type-exclaim-call
        type: editor.type
        at: { mark: type-exclaim-call }
        target:
          file: main.rs
          after: "    println!(\"readers: {first} and {second}\");\n"
          occurrence: 1
        cadence: natural
        text: "    exclaim(&mut owner);\n"

  - id: rule
    chapter: Many readers or one writer
    narration: >
      [[mark:show-borrow-rules]] Now, the rule that keeps this safe. At any
      time, you can have many shared references, the readers. Or exactly one
      mutable reference, the writer, with no readers beside it. Never both at
      once. And a reference must never live longer than the value it borrows.
      Why so strict? Changing a String can move its text to new memory. A
      reference into the old text would then point at freed memory.
    sources:
      - title: "The Rust Book — The Rules of References"
        url: "https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html#the-rules-of-references"
      - title: "The Rust Book — Reading Elements of Vectors"
        url: "https://doc.rust-lang.org/book/ch08-01-vectors.html#reading-elements-of-vectors"
    actions:
      - id: show-borrow-rules
        type: slide.show
        at: { mark: show-borrow-rules }
        slideId: borrow-rules

  - id: error
    narration: >
      So what if a reader is still in use when the writer starts?
      [[mark:draw-err-code]] Here, first borrows owner, exclaim borrows it as
      mutable, then first is printed.
      [[mark:draw-err-msg]] The compiler refuses with error E0502. You can't
      borrow owner as mutable, because it's also borrowed as immutable.
      [[mark:draw-err-labels]] It marks the immutable borrow, the mutable
      borrow, and the later use of first.
      [[mark:draw-err-two]] Two mutable borrows at once fail too, with error
      E0499.
    sources:
      - title: "Rust error codes — E0502"
        url: "https://doc.rust-lang.org/error_codes/E0502.html"
      - title: "Rust error codes — E0499"
        url: "https://doc.rust-lang.org/error_codes/E0499.html"
    actions:
      - id: close-borrow-rules
        type: slide.close
        at: { scene: start }
      - id: open-board-error
        type: whiteboard.apply
        at: { scene: start, offsetMs: 300 }
        open: true
        clear: true
        upsertIds: [e-title]
      - id: draw-err-code
        type: whiteboard.apply
        at: { mark: draw-err-code }
        upsertIds: [e-code1, e-code2, e-code3]
        drawMs: 2000
      - id: draw-err-msg
        type: whiteboard.apply
        at: { mark: draw-err-msg }
        upsertIds: [e-msg1, e-msg2]
        drawMs: 2400
      - id: draw-err-labels
        type: whiteboard.apply
        at: { mark: draw-err-labels }
        upsertIds: [e-u1, e-l1, e-u2, e-l2, e-u3, e-l3]
        drawMs: 3000
      - id: draw-err-two
        type: whiteboard.apply
        at: { mark: draw-err-two }
        upsertIds: [e-two]
        drawMs: 1600

  - id: last-use
    narration: >
      So why does our program compile? [[mark:draw-fix]] Because a borrow
      lasts only until its last use. If the reader's last use comes before
      the mutable borrow, it works.
      [[mark:select-readers-use]] Our readers are last used on this line,
      before exclaim. So when the writer starts, they're already done.
    sources:
      - title: "The Rust Book — Mutable References"
        url: "https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html#mutable-references"
    actions:
      - id: draw-fix
        type: whiteboard.apply
        at: { mark: draw-fix }
        upsertIds: [e-fix]
        drawMs: 1000
      - id: close-board-error
        type: whiteboard.apply
        at: { mark: select-readers-use, offsetMs: -500 }
        open: false
      - id: select-readers-use
        type: editor.select
        at: { mark: select-readers-use }
        target:
          file: main.rs
          text: '    println!("readers: {first} and {second}");'
          occurrence: 1

  - id: run
    narration: >
      [[mark:run]] Let's run it. The first line says Rust has four bytes,
      measured through a borrow. Both readers see Rust. And the last line
      shows Rust with an exclamation mark. It changed through a mutable
      reference, and owner still owns it.
    sources:
      - title: "The Rust Book — References and Borrowing"
        url: "https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html"
    actions:
      - id: run
        type: runtime.run
        at: { mark: run, offsetMs: 200 }
        timeoutMs: 30000
      - id: expect-output
        type: expect.output
        at: { afterAction: run }
        contains: "owner: Rust!"
        timeoutMs: 8000
      - id: expect-file-main
        type: expect.file
        at: { afterAction: run }
        path: main.rs
        contains: "exclaim(&mut owner);"

  - id: wrap
    narration: >
      A reference lets you use a value without owning it. Shared
      references read, mutable ones change, and it's many readers or one
      writer, never both. Next, slices: references to part of a String or an
      array.
    sources:
      - title: "The Rust Book — References and Borrowing"
        url: "https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html"
      - title: "The Rust Book — The Slice Type"
        url: "https://doc.rust-lang.org/book/ch04-03-slices.html"
    actions: []

checks:
  # 500 (not the default 300): google-svg deck slides embed per-slide font
  # data whose paint briefly stalls the main thread at each show/close.
  - { type: timing.p95Ms, max: 500 }
