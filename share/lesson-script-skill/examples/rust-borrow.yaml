# Rust from zero, lesson 7: references and borrowing.
#
# The arc: the lesson's own deck recaps the ownership rules and what a move
# breaks (E0382) — the problem borrowing solves. A whiteboard draws what a
# reference is (&owner points at owner, which owns the heap text; the borrow
# ends and nothing is dropped). The editor then builds it: measure(&String)
# borrows into a function, two shared readers coexist, `mut` is added and
# exclaim(&mut String) changes the String through a mutable reference. The
# deck's "borrowing rules" page states many readers OR one writer, and a
# second board shows the compiler's answer when a reader is still in use as
# the writer starts (E0502), plus E0499 for two writers. Back in the editor,
# the readers' last use explains why the built program compiles. One run.
#
# Every compiler message on the board or in the narration was confirmed with
# rustc 1.98 (edition 2024) on the broken variants:
#   let first = &owner; exclaim(&mut owner); println!("{first}");
#     error[E0502]: cannot borrow `owner` as mutable because it is also
#       borrowed as immutable
#     immutable borrow occurs here / mutable borrow occurs here /
#     immutable borrow later used here
#   let a = &mut owner; let b = &mut owner; (both used)
#     error[E0499]: cannot borrow `owner` as mutable more than once at a time
#   let owner = …; exclaim(&mut owner);   (no `mut`)
#     error[E0596]: cannot borrow `owner` as mutable, as it is not declared
#       as mutable
#   the deck's move slide: let s2 = s1; println!("{s1}, world");
#     error[E0382]: borrow of moved value: `s1`
#
# Board colours: blue = the reference / shared borrow (the thing being
# named), green = the valid owner and what works, orange = the mutable
# borrow (what changes), red = the error, violet = the result (nothing is
# dropped). #1e1e1e paints white on the dark board.
#
# Validate with:
#   bun scripts/studio-director.ts src/studio/scripts/rust-borrow.yaml
