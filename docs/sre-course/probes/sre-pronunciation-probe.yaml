    chapter: "1 · SRE · SLO · SLI · SLA"
    narration: >
      SRE တွေက SLI နဲ့ တိုင်းပြီး SLO ပစ်မှတ် ထားပါတယ်။
      [[mark:s1-b1]] S R E တွေက S L I နဲ့ တိုင်းပြီး S L O ပစ်မှတ် ထားပါတယ်။
      [[mark:s1-a2]] SLA ကတော့ SLO ထက် လျော့ထားတဲ့ customer ကတိပါ။
      [[mark:s1-b2]] S L A ကတော့ S L O ထက် လျော့ထားတဲ့ customer ကတိပါ။
    sources:
