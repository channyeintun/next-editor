# THROWAWAY pronunciation probe for "SRE from zero" (never commit to
# src/studio/scripts/; import it into /studio with Import… to render it).
#
# Purpose: hear, in Chan's VoxCPM2 voice, how the course's English terms and
# numbers come out before the first real lesson renders, and decide which
# entries go into BURMESE_RESPELLINGS (src/studio/script/lexicon.ts).
#
# How to listen: every sentence is its own dialog (split by marks), so each
# one is a separate VoxCPM2 take. A term the glossary is unsure about
# (glossary.md section 4.2) is spoken twice, in the same sentence:
#   1st take = the spelling lessons will use (what the voice gets today)
#   2nd take = the candidate respelling, written exactly as the speech text
#              would read once that entry is in BURMESE_RESPELLINGS
#              (e.g. "SLO ကို" -> "S L O ကို", "Padauk ရဲ့" -> "ပိတောက် ရဲ့").
# Numbers (board 6) are spoken three times: Latin digits, Burmese digits,
# Burmese words; 99.95 (board 7) twice: Latin digits, Burmese digits.
# "3,000" can never be fixed by the lexicon (a comma breaks its token match),
# so board 5 also says "3000", the comma-free form a respelling could reach.
# The respellings sit in the narration ONLY because this is a probe; real
# lessons never respell inside narration (glossary 3.1 / 4.3).
#
# Terms spoken once, with no second take (Priority C, "fine by precedent"):
# RPO, RTO, MTTR; spoken unchanged in both takes: incident, latency,
# error budget, 3000.
schemaVersion: 1

lesson:
