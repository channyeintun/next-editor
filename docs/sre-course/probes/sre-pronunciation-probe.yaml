  # (pick မြန်မာ · VoxCPM2 with Chan's reference).
  voiceProfile: pocket-alba-v1
  seed: 2027

runtime:
  kind: webcontainer
  adapterVersion: 1
  defaultMode: live
  initCommand: ""
  runCommand: pnpm dev
  environment: {}

scenes:
