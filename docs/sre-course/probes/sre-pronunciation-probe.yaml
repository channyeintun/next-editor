    name: SRE pronunciation probe
    entryFilePath: notes.md
    sidebarStartsCollapsed: true
    files:
      notes.md: |
        # အသံထွက် စမ်းသပ်ချက်

        1. SRE · SLO · SLI · SLA  →  S R E · S L O · S L I · S L A
        2. RPO · RTO · MTTR (တစ်ခါပဲ) · STPA · CAST  →  S T P A · cast
        3. on-call · postmortem · toil  →  on call · post mortem · toyl
        4. canary · rollout · rollback  →  ka nairy · roll out · roll back
        5. Padauk · Thingyan  →  ပိတောက် · သင်္ကြန်
        6. 99.9 · 3,000 · 43  →  ၉၉.၉ · ၃,၀၀၀ · ၄၃  →  Burmese words
        7. 99.95  →  ၉၉.၉၅
