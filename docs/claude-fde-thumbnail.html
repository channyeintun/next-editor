    <!--
      Claude FDE course (Burmese) lesson thumbnail, 1280×720 (16:9, the lesson card ratio).
      Click a tick on the strip (or press ← / →) to load that lesson from LESSONS, or render
      the whole set with `bun docs/claude-fde-thumbnails/render.ts`.

      This course has its own look: a two-tone poster. The left side is paper and carries the
      words (the course, the lesson number, the part, the title, and one real line of the file
      the lesson works on). The right side is a full-height panel in the part's colour and
      carries one drawing, in ink and white only. What it keeps from the family: the type
      (Google Sans + Noto Sans Myanmar), the language pill, the Next Editor mark, the file
      tab, and a lesson-by-lesson progress strip.

      - Ten parts, ten panel colours, so the gallery is banded by part.
      - Every drawing is original and built from the shapes in the DSL below. It uses four
        tones: ink, white, a tint and a shade of the panel colour. Ink marks the thing in
        focus. Product names appear as plain text only; no logo or brand mark is drawn.
      - The file line is a real line of that lesson's file (render.ts checks it against the
        lesson YAML); a line cut short ends in " …".
      - A Burmese label in a drawing is always a phrase the lesson itself shows
        (render.ts checks that too).
    -->

      * {

      /* The frame sits at the top rather than centered vertically: centering can land it
         on a half pixel, and a screenshot then picks up a line of the page background. */

        margin: 0;

        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;

        background: var(--ink);
        color: #fff;
        font: 700 25px/1.3 var(--mm);

      .left {
        position: absolute;
        left: 56px;
        top: 106px;
        width: 608px;
        height: 508px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .num-label {

      }

      .num {
        margin: 12px 0 0 -5px;
        font: 700 132px/0.8 var(--sans);
        letter-spacing: -0.045em;
      }

      .part {
        display: inline-block;
        padding: 3px 14px 5px;
        border-radius: 10px;
        background: var(--accent);
        font: 600 21px/1.6 var(--sans);
        white-space: nowrap;
      }

      .title {
        margin-top: 10px;
        font-weight: 700;
        font-family: var(--sans);
        line-height: 1.46;
        letter-spacing: -0.012em;
      }

      /* A title breaks only where LESSONS breaks it. */
      .title .line {
        display: block;
        width: max-content;
        white-space: nowrap;
      }

      .file {
        position: relative;
        margin-top: 34px;
      }

      .tab {
        position: absolute;
        left: 20px;
        top: -17px;
        height: 32px;
        padding: 0 13px 1px;
        display: flex;
        align-items: center;
        border: 3px solid var(--ink);
        border-radius: 999px;
        background: var(--accent);
        font: 700 15px/1 var(--mono);
        white-space: nowrap;
      }

      .strip {
        height: 68px;
        padding: 8px 24px 0;
        display: flex;
        align-items: center;
        overflow: hidden;
        border-radius: 18px;
        background: var(--ink);

        top: 638px;

        height: 32px;

        font: 400 14px/1.4 var(--sans);

        // From the storm night to today, and the road goes on.
        56: () => {

            }),

            txt(weeks[0] + 22, weeks[1] + 16, "ပတ် 1–9", { a: "start", fs: 22 }),

      };
      window.GLYPHS = GLYPHS;

      const markers = () =>
        ["k", "w", "d"]

            (key) =>
              `<marker id="ah-${key}" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="15" markerHeight="15"` +

          )
          .join("");

      /* ---------- The frame ---------- */

      const $ = (id) => document.getElementById(id);
      const COLUMN = 608;

      // The strip: 56 ticks in ten groups, one group per part.
      const TICK_STEP = 9.4;
      const PART_GAP = 9;
      const tickX = LESSONS.map((lesson, i) => i * TICK_STEP + (lesson.part - 1) * PART_GAP);

      function renderRoute(current) {
        const accent = PARTS[current.part - 1].colour;
        $("route").innerHTML = LESSONS.map((lesson, i) => {
          const x = n1(tickX[i]);
          if (lesson.number === current.number)
            return `<rect x="${n1(x - 2)}" y="3" width="11" height="26" rx="5.5" fill="${accent}" stroke="${INK_COLOUR}" stroke-width="3" data-lesson="${lesson.number}"/>`;
          const fill = lesson.number < current.number ? INK_COLOUR : "#d5d3cb";
          return `<rect x="${x}" y="9" width="7" height="14" rx="3.5" fill="${fill}" data-lesson="${lesson.number}"/>`;
        }).join("");
      }

      // The largest title that fits the column and the room under the number.
      const TITLE_MAX = 92;
      const TITLE_MIN = 40;
      function fitTitle() {
        const title = $("title");
        const group = $("titleGroup");
        const tooBig = () =>
          $("numBlock").offsetHeight + group.offsetHeight + 18 > 508 ||
          [...title.children].some((lineElement) => lineElement.offsetWidth > COLUMN);
        let size = TITLE_MAX;
        title.style.fontSize = `${size}px`;
        while (size > TITLE_MIN && tooBig()) {
          size -= 2;
          title.style.fontSize = `${size}px`;
        }
      }

      // The file line: strings and Markdown marks take the part's colour.
      const LINE_MAX = 22;
      const LINE_MIN = 17;
      const lineHtml = (text) =>
        text
          .split(/("[^"]*"|'[^']*'|`[^`]*`)/)
          .map((piece, i) =>
            i % 2
              ? `<span class="s">${withMyanmar(piece)}</span>`
              : withMyanmar(piece)
                  .replace(/^(#{1,3}|-|\d+\.|\|)(?= )/, '<span class="s">$1</span>')
                  .replace(/ \|(?= |$)/g, ' <span class="s">|</span>'),
          )
          .join("");
      function fitLine() {
        const text = $("line");
        const room = $("strip").clientWidth - 48;
        let size = LINE_MAX;
        text.style.fontSize = `${size}px`;
        while (size > LINE_MIN && text.offsetWidth > room) {
          size -= 0.5;
          text.style.fontSize = `${size}px`;
        }
      }

      let shown = 1;
      window.setThumb = ({ lesson }) => {
        const current = LESSONS.find((entry) => entry.number === lesson);
        if (!current) throw new Error(`no lesson ${lesson}`);
        shown = lesson;
        const part = PARTS[current.part - 1];
        setInk(part.colour);
        $("thumb").style.setProperty("--accent", part.colour);
        $("num").textContent = String(current.number).padStart(2, "0");
        $("part").innerHTML = `Part ${current.part} · ${withMyanmar(part.name)}`;
        $("title").innerHTML = current.lines
          .map((text) => `<span class="line">${withMyanmar(text)}</span>`)
          .join("");
        $("tab").textContent = current.file.split("/").slice(-2).join("/");
        $("line").innerHTML = lineHtml(current.line);
        $("glyph").innerHTML =
          `<defs>${markers()}</defs>${GLYPHS[current.number]().flat().join("")}`;
        renderRoute(current);
        fitLine();
        fitTitle();
      };

      // The Burmese labels of the drawing on screen; render.ts checks that each is a
      // phrase the lesson itself shows.
      window.cardLabels = () =>
        [...$("glyph").querySelectorAll("text")].map((node) => node.textContent).filter(hasMyanmar);

      // The ink of one run of text (a text node or an element holding one): where its
      // glyphs really start and end, from the baseline of its line box.
      const meter = document.createElement("canvas").getContext("2d");
      function inkOf(node) {
        const style = getComputedStyle(node.nodeType === 1 ? node : node.parentElement);
        meter.font = `${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
        const metrics = meter.measureText(node.textContent);
        const range = document.createRange();
        range.selectNodeContents(node);
        const baseline = range.getBoundingClientRect().top + metrics.fontBoundingBoxAscent;
        return {
          top: baseline - metrics.actualBoundingBoxAscent,
          bottom: baseline + metrics.actualBoundingBoxDescent,
        };
      }

      // What is wrong with the card on screen: a shape or a word outside the drawing's
      // board, a label wider than the shape it sits in, a title or a file line that does
      // not fit, or Burmese text cut by the box around it. render.ts fails on any.
      window.cardProblems = () => {
        const problems = [];
        const svg = $("glyph");
        const frame = svg.getBoundingClientRect();
        for (const node of svg.querySelectorAll(
          "rect, circle, ellipse, path, line, polygon, text",
        )) {
          if (node.closest("defs")) continue;
          const b = node.getBoundingClientRect();
          const scale = 480 / frame.width;
          const x = (b.left - frame.left) * scale;
          const y = (b.top - frame.top) * scale;
          const width = b.width * scale;
          const height = b.height * scale;
          const name = node.tagName === "text" ? `"${node.textContent}"` : node.tagName;
          if (x < -3 || y < -3 || x + width > 483 || y + height > 483)
            problems.push(
              `${name} leaves the board (${Math.round(x)},${Math.round(y)} ${Math.round(width)}×${Math.round(height)})`,
            );
          const maxw = Number(node.getAttribute("data-maxw"));
          if (maxw && width > maxw)
            problems.push(`${name} is ${Math.round(width)} wide in a ${maxw} space`);
        }

        const title = $("title");
        if (parseFloat(title.style.fontSize) <= TITLE_MIN)
          problems.push("the title is at its smallest size");
        if ($("numBlock").offsetHeight + $("titleGroup").offsetHeight > 508)
          problems.push("the title group runs into the lesson number");
        for (const lineElement of title.children)
          if (lineElement.offsetWidth > COLUMN)
            problems.push(`the title line "${lineElement.textContent}" is wider than the column`);

        const text = $("line");
        if (text.offsetWidth > $("strip").clientWidth - 48)
          problems.push(`the file line "${text.textContent}" does not fit the strip`);
        if ($("tab").offsetWidth > COLUMN - 40)
          problems.push("the file tab is wider than the column");
        if ($("part").offsetWidth > COLUMN)
          problems.push("the part label is wider than the column");

        // Burmese stacks marks above and below the line, so its ink is measured, not its
        // line box: nothing may be cut by the strip or spill out of the part label, and the
        // title's lines may not run into each other, the part label or the file tab.
        for (const run of $("strip").querySelectorAll(".mm")) {
          const ink = inkOf(run);
          const holder = $("strip").getBoundingClientRect();
          if (ink.top < holder.top || ink.bottom > holder.bottom)
            problems.push(`Burmese text "${run.textContent}" is cut by the file strip`);
        }
        for (const run of $("part").querySelectorAll(".mm")) {
          const ink = inkOf(run);
          const holder = $("part").getBoundingClientRect();
          if (ink.top < holder.top + 1 || ink.bottom > holder.bottom - 1)
            problems.push(`Burmese text "${run.textContent}" spills out of the part label`);
        }
        let floor = $("part").getBoundingClientRect().bottom;
        for (const lineElement of title.children) {
          const inks = [...lineElement.childNodes].map(inkOf);
          const top = Math.min(...inks.map((ink) => ink.top));
          if (top < floor)
            problems.push(`the title line "${lineElement.textContent}" runs into what is above it`);
          floor = Math.max(...inks.map((ink) => ink.bottom));
        }
        if (floor > $("tab").getBoundingClientRect().top)
          problems.push("the title runs into the file tab");
        return problems;
      };

      $("route").addEventListener("click", (event) => {
        const lesson = Number(event.target.getAttribute("data-lesson"));
        if (lesson) window.setThumb({ lesson });
      });
      document.addEventListener("keydown", (event) => {
