      mascot; this one is the lesson's dark whiteboard: an ink ground, and on it one diagram
      drawn for the lesson. What it keeps from the family: the brand colours and type (teal,
      yellow and purple from the logo, Google Sans + Noto Sans Myanmar), the language pill,
      the Next Editor mark, the file tab, and a lesson-by-lesson progress strip.

      - The big number, the part label and the route highlight take the part's accent
        (yellow, teal, purple in turn), so the ten parts band the gallery.
      - The route along the bottom is the course: 56 stops in ten parts.
      - The tab on the board names the notebook document the lesson types.
      - Every diagram is original and drawn here from the shapes in the DSL below. Colours
        keep the jobs they have on the lessons' boards: cream for a part of the system,
        yellow for the thing in focus, teal for what is good or chosen, purple for a flow,
        red for a failure or a cost. No diagram is taken from a book.

      /* ---------- The drawing DSL: every diagram is built from these shapes ---------- */

      const PANEL = "#131722";
      // Colour jobs: w a part of the system, d a quiet line, y the thing in focus,
      // t good or chosen, p a flow, r a failure or a cost, k ink on a solid shape.
      const INK = {
        w: "#ece9e0",
        d: "#737c92",
        y: "#ffd255",
        t: "#4de5d6",
        p: "#a394ff",
        r: "#ff7b72",
        o: "#ff9f43",
        b: "#5aa9ff",
        k: "#12151d",
      };
      const ACCENTS = ["y", "t", "p"];

      const esc = (text) =>
        String(text).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const n1 = (value) => Math.round(value * 10) / 10;
      const channels = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
      // A tint is the colour laid over the board, kept opaque so a line drawn earlier
      // never shows through a shape.
      function mix(hex, base, amount) {
        const a = channels(hex);
        const b = channels(base);
        return `rgb(${a.map((v, i) => Math.round(v * amount + b[i] * (1 - amount))).join(" ")})`;
      }
      const strokeOf = (o = {}) =>
        `stroke="${INK[o.c || "w"]}" stroke-width="${o.sw ?? 4}" stroke-linecap="round" stroke-linejoin="round"` +
        (o.dash ? ` stroke-dasharray="${o.dash === 1 ? "10 10" : o.dash}"` : "") +
        (o.op ? ` opacity="${o.op}"` : "");
      const fillOf = (o = {}, closed = true) =>
        o.solid
          ? INK[o.c || "w"]
          : o.f
            ? mix(INK[o.c || "w"], PANEL, 0.2)
            : o.open || !closed
              ? "none"
              : PANEL;
      const heads = (o = {}) =>
        ` marker-end="url(#ah-${o.c || "w"})"` +
        (o.both ? ` marker-start="url(#ah-${o.c || "w"})"` : "");

      // maxw marks a label that sits inside a shape; glyphProblems() checks it fits.
      const txt = (x, y, text, o = {}) =>
        `<text x="${n1(x)}" y="${n1(y)}" text-anchor="${o.a || "middle"}" dominant-baseline="central"` +
        ` font-size="${o.fs || 20}" font-weight="${o.fw || 500}" fill="${INK[o.c || "w"]}"` +
        (o.mm ? ' class="mm"' : "") +
        (o.rot ? ` transform="rotate(${o.rot} ${n1(x)} ${n1(y)})"` : "") +
        (o.maxw ? ` data-maxw="${o.maxw}"` : "") +
        `>${esc(text)}</text>`;
      const labelOf = (cx, cy, width, o) =>
        o.label
          ? txt(cx, cy, o.label, {
              fs: o.fs,
              fw: o.fw,
              mm: o.mm,
              c: o.lc || (o.solid ? "k" : "w"),
              maxw: width - 14,
            })
          : "";
      const box = (x, y, w, h, o = {}) =>
        `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.r ?? 12}" fill="${fillOf(o)}" ${strokeOf(o)}/>` +
        labelOf(x + w / 2, y + h / 2, w, o);
      const circ = (cx, cy, r, o = {}) =>
        `<circle cx="${n1(cx)}" cy="${n1(cy)}" r="${r}" fill="${fillOf(o)}" ${strokeOf(o)}/>` +
        labelOf(cx, cy, r * 2, o);
      const ell = (cx, cy, rx, ry, o = {}) =>
        `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${fillOf(o)}" ${strokeOf(o)}/>`;
      // A database: a drum with its lid drawn.
      function cyl(x, y, w, h, o = {}) {
        const ry = Math.min(15, h * 0.15);
        const side = h - 2 * ry;
        return (
          `<path d="M${x},${y + ry} v${side} a${w / 2},${ry} 0 0 0 ${w},0 v${-side}" fill="${fillOf(o)}" ${strokeOf(o)}/>` +
          `<ellipse cx="${x + w / 2}" cy="${y + ry}" rx="${w / 2}" ry="${ry}" fill="${fillOf(o)}" ${strokeOf(o)}/>` +
          labelOf(x + w / 2, y + h / 2 + ry * 0.7, w, o)
        );

            circ(left + 112 + 53, top + 88 + 41, 13, { solid: 1 }),
            circ(left + 53, top + 2 * 88 + 41, 13, { solid: 1 }),
            txt(left + 165, top + 3 * 88 + 22, "impact →", { fs: 18, c: "d" }),
            txt(left - 26, top + 129, "likelihood →", { fs: 18, c: "d", rot: -90 }),
          );
          return out;
        },
        // A diagram others can read: few shapes, clear arrows, and a key.
        49: () =>
          move(0, 6, [
            box(44, 80, 464, 312, { r: 14 }),
            arr(150, 190, 150, 244, { c: "d" }),
            arr(220, 160, 298, 222, { c: "d" }),
            arr(220, 280, 296, 262, { c: "d" }),
            box(86, 116, 128, 68, { c: "y", f: 1, label: "app", fs: 19 }),
            box(86, 252, 128, 68, { c: "t", f: 1, label: "Booking", fs: 19 }),
            cyl(304, 196, 96, 100, { c: "p", f: 1, label: "db", fs: 18 }),
            box(408, 236, 84, 136, { c: "d", r: 8, sw: 2.5 }),
            txt(450, 256, "key", { fs: 15, c: "d" }),
            ...[
              ["y", 284],
              ["t", 314],
              ["p", 344],
            ].flatMap(([c, y]) => [
              box(420, y - 9, 18, 18, { c, f: 1, r: 4, sw: 2.5 }),
              line(448, y, 480, y, { c: "d", sw: 4 }),
            ]),
          ]),
        // The architect sets the box the team works in: not too tight, not too loose.
        50: () => [
          box(170, 104, 320, 264, { c: "y", dash: 1, r: 26, open: 1 }),
          person(250, 214, 1.1, { c: "t" }),
          person(330, 276, 1.1, { c: "t" }),
          person(410, 214, 1.1, { c: "t" }),
          person(84, 240, 1.3, { c: "y" }),
          arr(126, 240, 160, 240, { c: "y" }),
          arr(464, 130, 506, 88, { c: "y", both: 1 }),
          txt(330, 396, "constraints", { c: "y", fs: 19 }),
        ],
        // Two people want different things and settle on one answer.
        51: () =>
          move(0, 8, [
            bubble(56, 92, 196, 92, { c: "p", f: 1, tail: { side: "b", at: 116, d: -10 } }),
            txt(154, 138, "by Friday?"),
            bubble(300, 92, 196, 92, { c: "t", f: 1, tail: { side: "b", at: 436, d: 10 } }),
            txt(398, 138, "safely?"),
            person(104, 292, 1.4, { c: "p" }),
            person(448, 292, 1.4, { c: "t" }),
            arr(160, 300, 226, 300, { c: "p" }),
            arr(392, 300, 326, 300, { c: "t" }),
            circ(276, 300, 38, { c: "y", f: 1 }),
            tick(274, 302, 13, { c: "y", sw: 6 }),
            txt(276, 366, "agreed", { c: "y", fs: 18 }),
          ]),
        // Anyone may decide, after asking those affected and those who know.
        52: () => [
          arr(114, 214, 226, 234, { c: "p" }),
          arr(196, 142, 248, 192, { c: "t" }),
          arr(356, 142, 304, 192, { c: "t" }),
          arr(438, 214, 326, 234, { c: "p" }),
          person(84, 206, 1, { c: "p" }),
          person(170, 116, 1, { c: "t" }),
          person(382, 116, 1, { c: "t" }),
          person(468, 206, 1, { c: "p" }),
          txt(276, 112, "advice", { fs: 18, c: "d" }),
          person(276, 236, 1.4, { c: "y" }),
          arr(276, 288, 276, 316, { c: "y" }),
          doc(234, 324, 84, 92, { label: "ADR", lines: 2 }),
        ],
        // Technologies placed by how ready the company is to use them.
        53: () => {
          const cx = 276;
          const cy = 246;
          const blips = [
            [20, 40, "t"],
            [24, 200, "t"],
            [60, -60, "t"],
            [62, 130, "t"],
            [102, 20, "y"],
            [104, 100, "y"],
            [100, 230, "y"],
            [146, -32, "p"],
            [148, 160, "p"],
            [146, 70, "r"],
            [148, 292, "r"],
          ];
          return [
            circ(cx, cy, 168, { c: "d", sw: 3 }),
            circ(cx, cy, 124, { c: "d", sw: 3 }),
            circ(cx, cy, 80, { c: "d", sw: 3 }),
            circ(cx, cy, 38, { c: "t", f: 1, sw: 3 }),
            line(cx - 168, cy, cx + 168, cy, { c: "d", sw: 2 }),
            line(cx, cy - 168, cx, cy + 168, { c: "d", sw: 2 }),
            ...blips.map(([r, deg, c]) => circ(...around(cx, cy, r, deg), 9, { c, solid: 1 })),
          ];
        },
        // The architect rides between the top floor and the engine room.
        54: () => [
          box(120, 66, 200, 356, { r: 10 }),
          ...[137, 208, 279, 350].map((y) => line(120, y, 320, y, { c: "d", sw: 3 })),
          line(232, 66, 232, 422, { c: "d", dash: "4 9", sw: 2.5 }),
          box(144, 104, 14, 22, { c: "p", f: 1, r: 3, sw: 2.5 }),
          box(166, 92, 14, 34, { c: "p", f: 1, r: 3, sw: 2.5 }),
          box(188, 82, 14, 44, { c: "p", f: 1, r: 3, sw: 2.5 }),
          ...[0, 60, 120, 180, 240, 300].map((deg) =>
            line(...around(176, 386, 17, deg), ...around(176, 386, 24, deg), { c: "t", sw: 5 }),
          ),
          circ(176, 386, 16, { c: "t" }),
          circ(176, 386, 5, { c: "t", solid: 1 }),
          arr(276, 204, 276, 150, { c: "y" }),
          arr(276, 284, 276, 338, { c: "y" }),
          box(244, 216, 64, 56, { c: "y", f: 1, r: 8 }),
          txt(340, 102, "penthouse", { a: "start", fs: 19, c: "p" }),
          txt(340, 386, "engine room", { a: "start", fs: 19, c: "t" }),
        ],
        // The shape of the teams and the shape of the system mirror each other.
        55: () =>
          move(0, 10, [
            arr(110, 206, 110, 300, { c: "d", both: 1 }),
            arr(276, 206, 276, 300, { c: "d", both: 1 }),
            arr(442, 206, 442, 300, { c: "d", both: 1 }),
            line(180, 140, 372, 140, { c: "p", sw: 3 }),
            line(180, 345, 372, 345, { c: "d", sw: 3 }),
            ...[40, 206, 372].flatMap((x) => [
              box(x, 84, 140, 112, { c: "p", dash: 1, r: 16 }),
              person(x + 42, 146, 0.75, { c: "p" }),
              person(x + 98, 146, 0.75, { c: "p" }),
            ]),
            box(40, 310, 140, 70, { label: "Search", fs: 18 }),
            box(206, 310, 140, 70, { c: "y", f: 1, label: "Booking", fs: 18 }),
            box(372, 310, 140, 70, { label: "Payment", fs: 18 }),
          ]),
        // The road from beginner to practitioner to leader.
        56: () => [
          path("M64,360 C200,360 176,278 264,262 C372,242 336,160 444,144", { sw: 5 }),
          line(444, 144, 444, 76),
          polygon(
            [
              [444, 78],
              [498, 96],
              [444, 114],
            ],
            { c: "y", solid: 1 },
          ),
          circ(64, 360, 13, { c: "t", solid: 1 }),
          circ(264, 262, 13, { c: "y", solid: 1 }),
          circ(444, 144, 13, { c: "p", solid: 1 }),
          txt(44, 404, "စတင်သူ", { a: "start", mm: 1, fs: 22, c: "t" }),
          txt(288, 300, "လုပ်ကိုင်သူ", { a: "start", mm: 1, fs: 22, c: "y" }),
          txt(452, 192, "ဦးဆောင်သူ", { mm: 1, fs: 22, c: "p" }),
        ],
      };
      window.GLYPHS = GLYPHS;

      const markers = Object.entries(INK)
        .map(
          ([key, colour]) =>
            `<marker id="ah-${key}" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="15" markerHeight="15"` +
            ` markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1.5 L11,6 L1,10.5 Z" fill="${colour}"/></marker>`,
        )
        .join("");

      /* ---------- The frame ---------- */

      const $ = (id) => document.getElementById(id);
      const MYANMAR = /[က-႟ꧠ-꧿ꩠ-ꩿ၊။]+/g;
      // Burmese shapes only when one font holds the whole run, so every Myanmar run is
      // wrapped in .mm.
      const withMyanmar = (text) =>
        esc(text).replace(MYANMAR, (run) => `<span class="mm">${run}</span>`);

      // The route: 56 stops in ten groups, one group per part.
      const STOP_STEP = 13.4;
      const PART_GAP = 12;
      const stopX = LESSONS.map((lesson, i) => 10 + i * STOP_STEP + (lesson.part - 1) * PART_GAP);

      function renderRoute(current) {
        const accent = INK[ACCENTS[(current.part - 1) % 3]];
        const inPart = LESSONS.filter((lesson) => lesson.part === current.part);
        const from = stopX[inPart[0].number - 1];
        const to = stopX[inPart[inPart.length - 1].number - 1];
        const out = [
          `<line x1="${stopX[0]}" y1="22" x2="${stopX[55]}" y2="22" stroke="#2a3142" stroke-width="3" stroke-linecap="round"/>`,
          `<line x1="${n1(from)}" y1="22" x2="${n1(to)}" y2="22" stroke="${accent}" stroke-width="3" stroke-linecap="round" opacity="0.55"/>`,
        ];
        LESSONS.forEach((lesson, i) => {
          const x = n1(stopX[i]);
          if (lesson.number === current.number)
            out.push(
              `<circle cx="${x}" cy="22" r="14" fill="none" stroke="${accent}" stroke-width="2.5" opacity="0.5"/>`,
              `<circle cx="${x}" cy="22" r="8.5" fill="${accent}" data-lesson="${lesson.number}"/>`,
            );
          else
            out.push(
              `<circle cx="${x}" cy="22" r="4" fill="${lesson.number < current.number ? "#ece9e0" : "#3b4458"}" data-lesson="${lesson.number}"/>`,
            );
        });
        $("route").innerHTML = out.join("");
      }

      // The widest title that fits the column and the room under the number.
      function fitTitle() {
        const title = $("title");
        const room = 460 - $("num").parentElement.offsetHeight - $("part").offsetHeight - 30;
        let size = 84;
        const tooBig = () =>
          title.offsetHeight > room ||
          [...title.children].some((lineElement) => lineElement.offsetWidth > 556);
        title.style.fontSize = `${size}px`;
        while (size > 40 && tooBig()) {
          size -= 2;
          title.style.fontSize = `${size}px`;
        }
      }

      let shown = 1;
      window.setThumb = ({ lesson }) => {
        const current = LESSONS.find((entry) => entry.number === lesson);
        if (!current) throw new Error(`no lesson ${lesson}`);
        shown = lesson;
        const accent = INK[ACCENTS[(current.part - 1) % 3]];
        $("thumb").style.setProperty("--accent", accent);
        $("num").textContent = String(current.number).padStart(2, "0");
        $("part").innerHTML = `Part ${current.part} · ${withMyanmar(PARTS[current.part - 1])}`;
        $("title").innerHTML = current.lines
          .map((text) => `<span class="line">${withMyanmar(text)}</span>`)
          .join("");
        $("tab").textContent = `notebook/${current.doc}`;
        $("glyph").innerHTML = `<defs>${markers}</defs>${GLYPHS[current.number]().flat().join("")}`;
        renderRoute(current);
        fitTitle();
      };

      // What is wrong with the diagram on screen: a shape or a word outside the board's
      // safe area, or a label wider than the shape it sits in. render.ts fails on any.
      window.glyphProblems = () => {
        const svg = $("glyph");
        const frame = svg.getBoundingClientRect();
        const problems = [];
        for (const node of svg.querySelectorAll(
          "rect, circle, ellipse, path, line, polyline, polygon, text",
        )) {
          if (node.closest("defs")) continue;
          const b = node.getBoundingClientRect();
          const x = b.left - frame.left;
          const y = b.top - frame.top;
          const name = node.tagName === "text" ? `"${node.textContent}"` : node.tagName;
          if (x < 26 || y < 48 || x + b.width > 526 || y + b.height > 436)
            problems.push(
              `${name} leaves the safe area (${Math.round(x)},${Math.round(y)} ${Math.round(b.width)}×${Math.round(b.height)})`,
            );
          const maxw = Number(node.getAttribute("data-maxw"));
          if (maxw && b.width > maxw)
            problems.push(`${name} is ${Math.round(b.width)} wide in a ${maxw} space`);
        }
        const title = $("title");
        if (parseFloat(title.style.fontSize) <= 40)
          problems.push("the title is at its smallest size");
        return problems;
      };

      $("route").addEventListener("click", (event) => {
        const lesson = Number(event.target.getAttribute("data-lesson"));
        if (lesson) window.setThumb({ lesson });
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight" && shown < 56) window.setThumb({ lesson: shown + 1 });
        if (event.key === "ArrowLeft" && shown > 1) window.setThumb({ lesson: shown - 1 });
      });

      window.setThumb({ lesson: 1 });
      window.thumbReady = Promise.all(
        [
          '700 36px "Google Sans"',
          '600 36px "Google Sans"',
          '500 36px "Google Sans"',
          '600 36px "Google Sans Code"',
          '700 36px "Google Sans Code"',
          '700 36px "Noto Sans Myanmar"',
          '500 36px "Noto Sans Myanmar"',
        ].map((face) => document.fonts.load(face, "Aa မြန်မာ").catch(() => [])),
      )
        .then(() => document.fonts.ready)
        .then(() => window.setThumb({ lesson: shown }));
    </script>
  </body>
