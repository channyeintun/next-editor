    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400..700&family=Google+Sans+Code:wght@400..700&family=Noto+Sans+Myanmar:wght@400;700&display=block"
    />
    <!--
      Testing course (Burmese) lesson thumbnail, 1280×720 (16:9, the lesson card ratio).
      Same template as docs/typescript-course-thumbnail.html, docs/css-course-thumbnail.html
      and docs/a11y-course-thumbnail.html.
      Click any text to edit it; click a progress square to load that lesson from LESSONS.
      Screenshot the frame only (DevTools → right-click the #thumb node → Capture node
      screenshot for an exact 1280×720 PNG), or render the whole set with
      `bun docs/testing-course-thumbnails/render.ts`.
      Brand: Next Editor lesson template (cream page, ink, yellow/purple/teal,
      Google Sans + Google Sans Code); Burmese runs are set in Noto Sans Myanmar.
      Mascot: "Tick", an original character drawn for this course: a round test result
      whose body is green with a ✓ badge when its test passes, red with a × badge when it
      fails (the red → green of test-driven development), and yellow with a ? badge while
      it thinks. It uses no Vitest, Vite or other product logo and must not be traced from one.
      Pose, mirror, tilt and the speech bubble are set from the toolbar under the
      frame, or all at once with window.setThumb({...}) from the console.
    -->
    <style>
      :root {
        --bg: #f0efe9;
        --ink: #1e1e1e;
        --yellow: #ffd255;
        --yellow-dk: #f2b705;
        --purple: #6d57ff;
        --teal: #4de5d6;
        --teal-dk: #08877a;
        --gray: #80868b;
        --dot: #cfccc2;
        --white: #ffffff;
        --sans: "Google Sans", "Noto Sans Myanmar", system-ui, sans-serif;
        --mono: "Google Sans Code", ui-monospace, monospace;
        --mm: "Noto Sans Myanmar", "Google Sans", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      /* max-content keeps the whole frame reachable by scrolling in a narrow window.
         The frame sits at the top rather than centered vertically: centering can land it
         on a half pixel, and a screenshot then picks up a line of the page background. */
      body {
        margin: 0;
        min-width: max-content;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 32px 16px;
        background: #2b2b2e;
        font-family: var(--sans);
      }

      [contenteditable] {
        outline: none;
        cursor: text;
      }

      [contenteditable]:hover {
        box-shadow: inset 0 -3px 0 rgb(109 87 255 / 0.35);
      }

      #thumb {
        position: relative;
        width: 1280px;
        height: 720px;
        flex: none;
        overflow: hidden;
        color: var(--ink);
        background-color: var(--bg);
        background-image: radial-gradient(rgb(30 30 30 / 0.07) 1.6px, transparent 1.6px);
        background-size: 32px 32px;
        background-position: 16px 16px;
      }

      .series {
        position: absolute;
        left: 60px;
        top: 46px;
        font: 700 36px/1 var(--mono);
        letter-spacing: -0.01em;
      }

      .series .brace {
        color: var(--yellow-dk);
      }

      .lang {
        position: absolute;
        right: 60px;
        top: 38px;
        padding: 12px 30px 14px;
        border-radius: 999px;
        background: var(--purple);
        color: var(--white);
        font: 700 28px/1.3 var(--mm);
      }

      .card {
        position: absolute;
        border: 4px solid var(--ink);
        box-shadow: 12px 12px 0 var(--ink);
      }

      .number {
        left: 64px;
        top: 164px;
        width: 300px;
        height: 350px;
        border-radius: 28px;
        background: var(--yellow);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
      }

      .number .label {
        font: 700 26px/1 var(--mono);
        letter-spacing: 0.16em;
      }

      .number .value {
        font: 700 200px/0.95 var(--sans);
        letter-spacing: -0.04em;
      }

      .title-box {
        position: absolute;
        left: 420px;
        top: 140px;
        width: 480px;
        height: 290px;
        display: flex;
        align-items: center;
      }

      .title {
        width: 100%;
        font-weight: 700;
        font-family: var(--sans);
        line-height: 1.32;
        letter-spacing: -0.01em;
        /* Editable text defaults to break-word in Chrome, which splits a long word
           instead of letting fitTitle shrink it. */
        overflow-wrap: normal;
      }

      /* Burmese shapes only when one font holds the whole run, so every Myanmar run
         in the title is wrapped in .mm (see renderTitle). A run never breaks inside:
         Chrome's dictionary breaker would split a word like အရွယ်အစား mid-way, so a
         title only wraps at its spaces. */
      .title .mm {
        font-family: var(--mm);
        letter-spacing: 0;
        white-space: nowrap;
      }

      /* A phrase that must not break across lines (see renderTitle). */
      .title .nb {
        white-space: nowrap;
      }

      .code {
        left: 420px;
        top: 462px;
        width: 796px;
        height: 92px;
        border-radius: 22px;
        background: var(--white);
        box-shadow: 10px 10px 0 var(--ink);
        display: flex;
        align-items: center;
        padding: 0 34px;
      }

      .code .tab {
        position: absolute;
        left: 28px;
        top: -19px;
        padding: 5px 14px 6px;
        border-radius: 999px;
        background: var(--ink);
        color: var(--white);
        font: 700 17px/1 var(--mono);
      }

      /* Noto Sans Myanmar sits in the stack for Burmese inside CSS strings
         (content: " ကျပ်"). */
      .code .src {
        width: 100%;
        white-space: pre;
        overflow: hidden;
        /* Burmese marks stack well above and below the code line, where overflow: hidden
           would cut them off; the padding gives them room and the margin cancels it. */
        padding-block: 18px;
        margin-block: -18px;
        font:
          500 32px/1.2 "Google Sans Code",
          "Noto Sans Myanmar",
          monospace;
      }

      /* CSS: selectors and at-rules purple, properties ink, values teal, numbers and
         colours amber, punctuation gray. HTML (index.html): tags and attributes
         purple, attribute values teal. */
      .src .sel,
      .src .at,
      .src .kw {
        color: var(--purple);
        font-weight: 700;
      }

      .src .prop {
        color: var(--ink);
      }

      .src .val,
      .src .str {
        color: var(--teal-dk);
      }

      .src .fn {
        color: var(--teal-dk);
        font-weight: 700;
      }

      .src .num {
        color: #b26b00;
      }

      .src .pn {
        color: var(--gray);
      }

      .src .tag,
      .src .attr {
        color: var(--purple);
      }

      .src .cm {
        color: var(--gray);
      }

      /* 43 lessons in eight parts: the squares are smaller than the React set's so the
         row stays clear of the brand. */
      .progress {
        position: absolute;
        left: 64px;
        bottom: 66px;
        height: 24px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .module {
        display: flex;
        gap: 4px;
      }

      .sq {
        width: 15px;
        height: 15px;
        border-radius: 4px;
        background: var(--dot);
        border: 0;
        padding: 0;
        cursor: pointer;
      }

      .sq.on {
        background: var(--yellow);
        box-shadow: inset 0 0 0 3px var(--ink);
      }

      .brand {
        position: absolute;
        right: 60px;
        bottom: 50px;
        display: flex;
        align-items: center;
        gap: 14px;
        font: 700 30px/1 var(--sans);
      }

      .brand svg {
        width: 56px;
        height: 56px;
      }

      /* The mascot stands on the right end of the code card: its box ends at 472px,
         just over the card's top border (462px), so its feet rest on it. */
      .mascot {
        position: absolute;
        right: 36px;
        top: 100px;
        width: 310px;
        height: 372px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        gap: 18px;
      }

      .bubble {
        position: relative;
        max-width: 310px;
        overflow: hidden;
        padding: 8px 24px 10px;
        border: 4px solid var(--ink);
        border-radius: 24px;
        background: var(--white);
        box-shadow: 6px 6px 0 var(--ink);
        font:
          700 34px/1.35 "Google Sans Code",
          "Noto Sans Myanmar",
          monospace;
        white-space: nowrap;
      }

      /* Burmese shapes only when one font holds the whole run, and its stacked
         marks need a taller line than code text. */
      .bubble.mm {
        font-family: "Noto Sans Myanmar", "Google Sans", sans-serif;
        line-height: 1.6;
        padding: 4px 24px 6px;
      }

      .bubble.off {
        display: none;
      }

      .bubble-tail {
        position: absolute;
        width: 26px;
        height: 26px;
        background: var(--white);
        border-right: 4px solid var(--ink);
        border-bottom: 4px solid var(--ink);
        transform: rotate(45deg);
      }

      .tick {
        width: 310px;
        height: 200px;
        flex: none;
        overflow: visible;
        transform-origin: center bottom;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: #c9c9cf;
        font:
          14px/1.5 system-ui,
          sans-serif;
      }

      .toolbar button {
        padding: 6px 12px;
        border: 1px solid #55555c;
        border-radius: 8px;
        background: #3a3a3f;
        color: #f0f0f3;
        font: inherit;
        cursor: pointer;
      }

      .toolbar button[aria-pressed="true"] {
        border-color: var(--yellow);
        color: var(--yellow);
      }

      .help {
        max-width: 1280px;
        color: #c9c9cf;
        font:
          14px/1.5 system-ui,
          sans-serif;
        text-align: center;
      }
    </style>
  </head>

          pose: "thinking",
          tilt: -5,
        },
        {
          number: 30,
          slug: "30-tdd-with-ai",
          title: "AI assistant နဲ့ TDD",
          file: "loyalty.test.js",
          code: "expect(stampsFor(order)).toBe(3);",
          bubble: "revert it",
          pose: "fail",
          tilt: 4,
        },
        {
          number: 31,
          slug: "31-test-quality",
          title: "Test ကောင်းမကောင်း စစ်ခြင်း",
          file: "loyalty.js",
          code: "return stamps >= 10;",
          bubble: "mutant caught!",
          pose: "joy",
          tilt: -6,
        },
        {
          number: 32,
          slug: "32-philosophy-recap",
          title: "Testing ရဲ့ ရည်ရွယ်ချက်နဲ့ အနှစ်ချုပ်",
          file: "booking.js",
          code: "if (await store.get(key)) {",
          bubble: "thank you!",
          pose: "joy",
          tilt: 5,
        },
      ];
      window.LESSONS = LESSONS;

      // Lessons per module of the course (curriculum.md): foundations, everyday Vitest, TDD,
      // what to test, test doubles, the browser side, real code, a healthy suite, the AI age,
      // closing.
      const PARTS = [6, 3, 3, 2, 3, 3, 3, 5, 3, 1];

      const number = document.getElementById("number");
      const title = document.getElementById("title");
      const titleBox = document.getElementById("title-box");
      const file = document.getElementById("file");
      const code = document.getElementById("code");
      const progress = document.getElementById("progress");
      const bubble = document.getElementById("bubble");
      const bubbleTail = document.getElementById("bubble-tail");
      const tick = document.getElementById("tick");
      const thumb = document.getElementById("thumb");
      const toolbar = document.getElementById("toolbar");
      const mascot = { pose: "happy", mirror: false, tilt: -6, bubble: true };

      // ---- Tick, the original test-result mascot (flat fills, bold ink outline) ----
      // A round test result: green with a ✓ badge when it passes, red with a × badge
      // when it fails, yellow with a ? badge while it thinks.

      const INK = "#1e1e1e";
      const BODY = { x: -66, y: -66, w: 132, h: 132, r: 66 };
      const COLOURS = { happy: "#3ccf7a", joy: "#3ccf7a", fail: "#ff6b6b", thinking: "#ffd255" };

      function circleBody(attrs, dx = 0, dy = 0) {
        return `<circle cx="${dx}" cy="${dy}" r="${BODY.r}" ${attrs}/>`;
      }

      // An arm is an ink stroke from the shoulder, ending in a round hand.
      function arm(d, hx, hy, hand = "#ffffff") {
        return (
          `<path d="${d}" fill="none" stroke="${INK}" stroke-width="10" stroke-linecap="round"/>` +
          `<circle cx="${hx}" cy="${hy}" r="10.5" fill="${hand}" stroke="${INK}" stroke-width="5"/>`
        );
      }

      function sparkle(x, y, size) {
        const s = size;
        const d = `M ${x} ${y - s} Q ${x + s * 0.18} ${y - s * 0.18} ${x + s} ${y} Q ${x + s * 0.18} ${y + s * 0.18} ${x} ${y + s} Q ${x - s * 0.18} ${y + s * 0.18} ${x - s} ${y} Q ${x - s * 0.18} ${y - s * 0.18} ${x} ${y - s} Z`;
        return `<path d="${d}" fill="#ffd255" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>`;
      }

      const CHEEKS =
        `<ellipse cx="-36" cy="4" rx="9" ry="5.5" fill="#ff8f7e" opacity="0.6"/>` +
        `<ellipse cx="36" cy="4" rx="9" ry="5.5" fill="#ff8f7e" opacity="0.6"/>`;

      function roundEye(x, y) {
        return (
          `<ellipse cx="${x}" cy="${y}" rx="8.5" ry="11" fill="${INK}"/>` +
          `<circle cx="${x + 2.6}" cy="${y - 4.4}" r="3.4" fill="#fff"/>`
        );
      }

      const FACES = {
        happy:
          roundEye(-20, -18) +
          roundEye(20, -18) +
          CHEEKS +
          `<path d="M -16 0 Q 0 24 16 0 Z" fill="${INK}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>` +
          `<path d="M -8 12 Q 0 7 8 12 Q 0 17 -8 12 Z" fill="#ff7f72"/>`,
        joy:
          `<path d="M -32 -12 Q -21 -28 -10 -12" fill="none" stroke="${INK}" stroke-width="6" stroke-linecap="round"/>` +
          `<path d="M 10 -12 Q 21 -28 32 -12" fill="none" stroke="${INK}" stroke-width="6" stroke-linecap="round"/>` +
          CHEEKS +
          `<path d="M -21 -1 Q 0 36 21 -1 Z" fill="${INK}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>` +
          `<ellipse cx="0" cy="15" rx="9" ry="4.5" fill="#ff7f72"/>`,
        thinking:
          roundEye(-17, -15) +
          roundEye(24, -15) +
          `<path d="M -31 -34 L -8 -32" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>` +
          `<path d="M 13 -36 Q 24 -45 36 -37" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>` +
          CHEEKS +
          `<path d="M -5 13 Q 2 6 9 12 T 23 9" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>`,
        // A failing test: worried brows, a small open mouth, a drop of sweat.
        fail:
          roundEye(-20, -14) +
          roundEye(20, -14) +
          `<path d="M -32 -34 L -11 -29" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>` +
          `<path d="M 11 -29 L 32 -34" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>` +
          `<ellipse cx="0" cy="10" rx="9" ry="8" fill="${INK}"/>` +
          `<path d="M 47 -44 Q 56 -30 51 -24 Q 44 -20 41 -28 Q 41 -35 47 -44 Z" fill="#7cc8ff" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>`,
      };

      // Arms per pose: happy waves, joy cheers, fail throws both hands up, thinking scratches its head.
      const ARMS = {
        happy:
          arm("M -64 18 Q -100 34 -108 58", -108, 58) + arm("M 64 6 Q 106 -4 116 -38", 116, -38),
        joy:
          arm("M -62 0 Q -106 -24 -116 -60", -116, -60) + arm("M 62 0 Q 106 -24 116 -60", 116, -60),
        fail:
          arm("M -62 -4 Q -100 -34 -76 -70", -76, -70) + arm("M 62 -4 Q 100 -34 76 -70", 76, -70),
        thinking:
          arm("M -64 18 Q -100 36 -104 60", -104, 60) + arm("M 62 4 Q 118 -16 98 -74", 98, -74),
      };

      const EXTRAS = {
        happy: "",
        joy: sparkle(-138, -80, 11) + sparkle(142, -88, 10),
        fail: "",
        thinking: `<circle cx="-118" cy="-70" r="6" fill="#fff" stroke="${INK}" stroke-width="4"/><circle cx="-138" cy="-86" r="8.5" fill="#fff" stroke="${INK}" stroke-width="4"/>`,
      };

      // The badge on Tick's front: the test result.
      function badge(pose) {
        const mark = pose === "fail" ? "×" : pose === "thinking" ? "?" : "✓";
        return (
          `<circle cx="0" cy="42" r="17" fill="#ffffff" stroke="${INK}" stroke-width="4"/>` +
          `<text x="0" y="50" text-anchor="middle" font-family="Google Sans, system-ui, sans-serif" font-weight="700" font-size="24" fill="${INK}">${mark}</text>`
        );
      }

      function tickSvg(pose) {
        return (
          EXTRAS[pose] +
          ARMS[pose] +
          // Feet first, so the body sits on them.
          `<ellipse cx="-30" cy="72" rx="20" ry="11" fill="${INK}"/>` +
          `<ellipse cx="30" cy="72" rx="20" ry="11" fill="${INK}"/>` +
          circleBody(`fill="${INK}"`, 7, 7) +
          circleBody(`fill="${COLOURS[pose]}" stroke="${INK}" stroke-width="7"`) +
          `<ellipse cx="-34" cy="-40" rx="11" ry="5.5" fill="#fff" opacity="0.6" transform="rotate(-38 -34 -40)"/>` +
          badge(pose) +
          FACES[pose]
        );
      }

      // ---- Progress squares -------------------------------------------------------

      const squares = [];
      for (const count of PARTS) {
        const module = document.createElement("div");
        module.className = "module";
        for (let i = 0; i < count; i++) {
          const index = squares.length + 1;
          const square = document.createElement("button");
          square.type = "button";
          square.className = "sq";
          square.title = `Lesson ${index}`;
          square.addEventListener("click", () => window.setThumb({ lesson: index }));
          squares.push(square);
          module.append(square);
        }
        progress.append(module);
      }

      function markLesson(index) {
        squares.forEach((square, i) => square.classList.toggle("on", i + 1 === index));
      }

      // ---- Text fitting -----------------------------------------------------------

      function escapeHtml(text) {
        return text.replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      }

      // Terms that read as one word and must stay on one line (a hyphen inside one
      // never breaks either).
      const NO_BREAK_TERMS = [
        "test case",
        "test runner",
        "watch mode",
        "test double",
        "mock function",
        "fake timer",
        "snapshot test",
        "code coverage",
        "component test",
        "integration test",
        "end-to-end test",
        "static analysis",
        "flaky test",
        "testable code",
        "AI assistant",
        "AI agent",
        "red → green",
      ];
      // Particles that stay on the line of the word before them ("layer တွေ",
      // "Unit တွေနဲ့", "Component နဲ့" never split).
      const PARTICLES = ["တွေနဲ့", "နဲ့", "တွေ"];
      const MYANMAR = /[\u1000-\u109f\ua9e0-\ua9ff\uaa60-\uaa7f]+/g;
      // Markers for a space and a hyphen that must not break; both are put back as
      // plain characters in the markup.
      const GLUE = "\u00a0";
      const GLUE_HYPHEN = "\u2011";

      function titleHtml(text) {
        return escapeHtml(text)
          .replace(MYANMAR, (run) => `<span class="mm">${run}</span>`)
          .replaceAll(GLUE, " ")
          .replaceAll(GLUE_HYPHEN, "-");
      }

      // Glue NO_BREAK_TERMS, each particle to the word before it and the part number
      // to အပိုင်း, wrap each glued piece in .nb and each Burmese run in .mm so a
      // single font shapes it. A glued piece may still break after the hyphen of its
      // first word ("Pseudo-" / "element တွေ"), which keeps it from shrinking to a
      // tiny single line. A part title starts its topic on a new line:
      // "Flexbox အပိုင်း 1၊" / "axis နဲ့ wrap". (A no-break space in LESSONS would not
      // survive the whitespace collapse below, so the glue is added here, in markup.)
      function renderTitle() {
        let text = title.textContent.replace(/\s+/g, " ").trim();
        for (const term of NO_BREAK_TERMS)
          text = text.split(term).join(term.replaceAll(" ", GLUE).replaceAll("-", GLUE_HYPHEN));
        for (const particle of PARTICLES)
          text = text.replace(new RegExp(` (${particle})(?= |$)`, "g"), `${GLUE}$1`);
        text = text.replace(/အပိုင်း (\d+)/g, `အပိုင်း${GLUE}$1`);
        title.innerHTML = text
          .split(" ")
          .map((piece, i, pieces) => {
            let html = titleHtml(piece);
            if (piece.includes(GLUE) || piece.includes(GLUE_HYPHEN)) {
              const firstWord = piece.split(GLUE)[0];
              const cut = firstWord.lastIndexOf("-") + 1;
              html = `${titleHtml(piece.slice(0, cut))}<span class="nb">${titleHtml(piece.slice(cut))}</span>`;
            }
            // The space stays before the <br> so textContent keeps the words apart.
            const partEnd = /^အပိုင်း\u00a0\d+၊$/.test(piece) && i < pieces.length - 1;
            return i < pieces.length - 1 ? html + (partEnd ? " <br>" : " ") : html;
          })
          .join("");
        fitTitle();
      }

      // Largest size (to 116px) at which the title fits its box.
      function fitTitle() {
        let size = 116;
        title.style.fontSize = `${size}px`;
        while (
          size > 40 &&
          (title.scrollHeight > titleBox.clientHeight || title.scrollWidth > titleBox.clientWidth)
        ) {
          size -= 2;
          title.style.fontSize = `${size}px`;
        }
      }

      // Light CSS highlighting for a one-line rule or fragment. The line starts as a
      // selector when it has a `{`, as a declaration when it opens with `name:`, and
      // as a bare value otherwise.
      function highlightCss(source) {
        let ctx = source.includes("{")
          ? "sel"
          : /^\s*-?-?[A-Za-z][\w-]*\s*:\s/.test(source)
            ? "prop"
            : "val";
        let atName = "";
        const token =
          /(\s+)|(\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(@[\w-]+)|([{}])|(;)|(#[0-9a-fA-F]{3,8}(?![\w-]))|([+-]?(?:\d+\.?\d*|\.\d+)(?:%|[A-Za-z]+)?)|(-?-?[A-Za-z_][\w-]*)(\()?|(!important)|(:(?=\s|$))|[\s\S]/gy;
        const span = (cls, text) => `<span class="${cls}">${escapeHtml(text)}</span>`;
        let html = "";
        let selector = "";
        const flushSelector = () => {
          if (selector) html += span("sel", selector);
          selector = "";
        };
        for (const m of source.matchAll(token)) {
          const [
            text,
            space,
            comment,
            string,
            at,
            brace,
            semi,
            hex,
            num,
            ident,
            call,
            important,
            colon,
          ] = m;
          if (ctx === "sel" && !space && !comment && !string && !at && !brace) {
            // Everything up to the brace is selector text; combinators and commas
            // read as punctuation.
            if (/^[,>+~]$/.test(text)) {
              flushSelector();
              html += span("pn", text);
            } else selector += text;
            continue;
          }
          flushSelector();
          if (space) html += text;
          else if (comment) html += span("cm", text);
          else if (string) html += span("str", text);
          else if (at) {
            html += span("at", text);
            atName = text;
            ctx = "at";
          } else if (brace) {
            html += span("pn", text);
            if (text === "}") ctx = "sel";
            else
              ctx = /^@(font-face|property|counter-style|page)$/.test(atName)
                ? "prop"
                : ctx === "at"
                  ? "sel"
                  : "prop";
            atName = "";
          } else if (semi) {
            html += span("pn", text);
            ctx = ctx === "at" ? "sel" : "prop";
          } else if (hex || num) html += span("num", text);
          else if (ident) {
            if (call) html += span("fn", ident) + span("pn", call);
            else if (ctx === "prop") html += span("prop", ident);
            else if (ctx === "val" && !ident.startsWith("--")) html += span("val", ident);
            else html += escapeHtml(ident);
          } else if (important) html += span("kw", text);
          else if (colon) {
            html += span("pn", text);
            if (ctx === "prop") ctx = "val";
          } else html += span("pn", text);
        }
        flushSelector();
        return html;
      }

      // Light HTML highlighting: tags and attribute names purple, values teal.
      function highlightHtml(source) {
        const token = /(<\/?)([\w-]+)|([\w:@-]+)(?==)|("[^"]*"|'[^']*')|(\/?>|=)/g;
        let html = "";
        let last = 0;
        for (const match of source.matchAll(token)) {
          html += escapeHtml(source.slice(last, match.index));
          const [text, angle, tag, attr, string, punct] = match;
          if (angle)
            html += `<span class="pn">${escapeHtml(angle)}</span><span class="tag">${escapeHtml(tag)}</span>`;
          else if (attr) html += `<span class="attr">${escapeHtml(attr)}</span>`;
          else if (string) html += `<span class="str">${escapeHtml(string)}</span>`;
          else html += `<span class="pn">${escapeHtml(punct)}</span>`;
          last = match.index + text.length;
        }
        return html + escapeHtml(source.slice(last));
      }

      // Light JavaScript highlighting: comments gray, strings teal, keywords purple,
      // calls bold teal.
      function highlightJs(source) {
        const token =
          /(\/\/.*$)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`[^`]*`)|\b(const|let|if|else|return|true|false|function|new|await|async|import|export|from|throw|null|undefined)\b|([A-Za-z_$][\w$]*)(?=\()|([()[\]{}.,;=])/g;
        let html = "";
        let last = 0;
        for (const match of source.matchAll(token)) {
          html += escapeHtml(source.slice(last, match.index));
          const [text, comment, string, keyword, call, punct] = match;
          if (comment) html += `<span class="cm">${escapeHtml(comment)}</span>`;
          else if (string) html += `<span class="str">${escapeHtml(string)}</span>`;
          else if (keyword) html += `<span class="kw">${escapeHtml(keyword)}</span>`;
          else if (call) html += `<span class="fn">${escapeHtml(call)}</span>`;
          else html += `<span class="pn">${escapeHtml(punct)}</span>`;
          last = match.index + text.length;
        }
        return html + escapeHtml(source.slice(last));
      }

      // Light TypeScript / JSON highlighting: keywords purple, strings and types teal,
      // numbers orange, punctuation gray.
      function highlightTs(source) {
        const token =
          /(\/\/.*$)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`)|\b(const|let|var|type|interface|function|return|as|satisfies|readonly|keyof|typeof|extends|implements|class|new|enum|namespace|import|export|from|declare|global|async|await|infer|is|asserts|in|if|else|case|catch|switch|override|private|protected|public|abstract|true|false|null|undefined)\b|\b(string|number|boolean|void|any|unknown|never|object|bigint|symbol|Promise|Record|Partial|Required|Pick|Omit|Readonly|ReturnType|Parameters|Awaited|Exclude|Extract|NonNullable)\b|(\b\d+(?:\.\d+)?\b)|([A-Za-z_$][\w$]*)(?=\s*[(<])|([()[\]{}.,;:=<>|&?^!])/g;
        let html = "";
        let last = 0;
        for (const match of source.matchAll(token)) {
          html += escapeHtml(source.slice(last, match.index));
          const [text, comment, string, keyword, type, num, call, punct] = match;
          if (comment) html += `<span class="cm">${escapeHtml(comment)}</span>`;
          else if (string) html += `<span class="str">${escapeHtml(string)}</span>`;
          else if (keyword) html += `<span class="kw">${escapeHtml(keyword)}</span>`;
          else if (type) html += `<span class="val">${escapeHtml(type)}</span>`;
          else if (num) html += `<span class="num">${escapeHtml(num)}</span>`;
          else if (call) html += `<span class="fn">${escapeHtml(call)}</span>`;
          else html += `<span class="pn">${escapeHtml(punct)}</span>`;
          last = match.index + text.length;
        }
        return html + escapeHtml(source.slice(last));
      }

      // Shrink long code lines so they stay on one line inside the card.
      function fitCode() {
        let size = 32;
        code.style.fontSize = `${size}px`;
        while (size > 18 && code.scrollWidth > code.clientWidth) {
          size -= 1;
          code.style.fontSize = `${size}px`;
        }
      }

      function renderCode() {
        const source = code.textContent.replace(/\s*\n\s*/g, " ").trim();
        const name = file.textContent.trim();
        code.innerHTML = /\.(html?|vtt)$/i.test(name)
          ? highlightHtml(source)
          : /\.css$/i.test(name)
            ? highlightCss(source)
            : /\.(m?ts|tsx|json)$/i.test(name)
              ? highlightTs(source)
              : /\.(m?jsx?)$/i.test(name)
                ? highlightJs(source)
                : escapeHtml(source);
        fitCode();
      }

      // Keep the bubble on one line: shrink long words rather than wrap them.
      function fitBubble() {
        bubble.classList.toggle("mm", /[\u1000-\u109f]/.test(bubble.textContent));
        let size = 34;
        bubble.style.fontSize = `${size}px`;
        while (size > 18 && bubble.scrollWidth > bubble.clientWidth) {
          size -= 1;
          bubble.style.fontSize = `${size}px`;
        }
        placeTail();
      }

      // The tail hangs under the bubble, pointing down at Tick.
      function placeTail() {
        bubbleTail.style.display = mascot.bubble ? "" : "none";
        if (!mascot.bubble) return;
        const frame = thumb.getBoundingClientRect();
        const box = bubble.getBoundingClientRect();
        bubbleTail.style.left = `${box.left - frame.left + box.width / 2 - 15}px`;
        bubbleTail.style.top = `${box.bottom - frame.top - 17}px`;
      }

      function renderMascot() {
        tick.innerHTML = tickSvg(mascot.pose);
        tick.style.transform = `scaleX(${mascot.mirror ? -1 : 1}) rotate(${mascot.tilt}deg)`;
        bubble.classList.toggle("off", !mascot.bubble);
        for (const button of toolbar.querySelectorAll("button")) {
          const pressed =
            button.dataset.pose === mascot.pose ||
            (button.dataset.tilt !== undefined && Number(button.dataset.tilt) === mascot.tilt) ||
            (button.dataset.action === "mirror" && mascot.mirror) ||
            (button.dataset.action === "bubble" && mascot.bubble);
          button.setAttribute("aria-pressed", String(pressed));
        }
        placeTail();
      }

      toolbar.addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button) return;
        if (button.dataset.pose) mascot.pose = button.dataset.pose;
        if (button.dataset.tilt !== undefined) mascot.tilt = Number(button.dataset.tilt);
        if (button.dataset.action === "mirror") mascot.mirror = !mascot.mirror;
        if (button.dataset.action === "bubble") mascot.bubble = !mascot.bubble;
        renderMascot();
      });

      /**
       * Set any part of the thumbnail at once (used to render the course set):
       * setThumb({ lesson: 3 }) loads LESSONS[2]; any other field overrides it:
       * setThumb({ lesson: 3, code: "…", pose: "thinking", mirror: true, tilt: 0, bubble: "?" })
       * Fields: number, title, file, code, pose (happy | joy | fail | thinking), mirror, tilt,
       * bubble (`null` hides the speech bubble).
       */
      window.setThumb = (input) => {
        const base =
          input.lesson !== undefined
            ? LESSONS.find((l) => l.number === Number(input.lesson))
            : null;
        const spec = { ...(base ?? {}), ...input };
        if (base && input.mirror === undefined) spec.mirror = false;
        if (spec.number !== undefined) {
          number.textContent = String(spec.number).padStart(2, "0");
          const value = Number(spec.number);
          markLesson(value >= 1 && value <= squares.length ? value : 0);
        }
        if (spec.title !== undefined) title.textContent = spec.title;
        if (spec.file !== undefined) file.textContent = spec.file;
        if (spec.code !== undefined) code.textContent = spec.code;
        if (spec.pose !== undefined && FACES[spec.pose]) mascot.pose = spec.pose;
        if (spec.mirror !== undefined) mascot.mirror = spec.mirror;
        if (spec.tilt !== undefined) mascot.tilt = spec.tilt;
        if (spec.bubble !== undefined) {
          mascot.bubble = spec.bubble !== null;
          if (spec.bubble !== null) bubble.textContent = spec.bubble;
        }
        renderCode();
        renderMascot();
        renderTitle();
        fitBubble();
      };

      number.addEventListener("input", () => {
        const value = Number.parseInt(number.textContent, 10);
        markLesson(value >= 1 && value <= squares.length ? value : 0);
      });
      title.addEventListener("input", fitTitle);
      title.addEventListener("blur", renderTitle);
      file.addEventListener("blur", renderCode);
      code.addEventListener("input", fitCode);
      code.addEventListener("blur", renderCode);
      bubble.addEventListener("input", fitBubble);

      window.setThumb({ lesson: 1 });

      // Load every face up front (Noto Sans Myanmar only loads once Burmese is on
      // screen), then refit: sizes measured before the fonts arrive are wrong.
      window.thumbReady = Promise.all(
        [
          '700 36px "Google Sans"',
          '400 36px "Google Sans"',
          '700 36px "Google Sans Code"',
          '500 36px "Google Sans Code"',
          '700 36px "Noto Sans Myanmar"',
          '400 36px "Noto Sans Myanmar"',
        ].map((face) => document.fonts.load(face, "Aa မြန်မာ").catch(() => [])),
      )
        .then(() => document.fonts.ready)
        .then(() => {
          renderCode();
          renderTitle();
          fitBubble();
        });
    </script>
  </body>
</html>
