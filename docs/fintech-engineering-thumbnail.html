    <!--
      Fintech Engineering course (Burmese) lesson thumbnail, 1280×720 (16:9, the lesson card
      ratio). Click a stop on the route under the frame, or press ← / →, to load another lesson
      from LESSONS, or render the whole set with `bun docs/fintech-engineering-thumbnails/render.ts`.

      A thumbnail is the cover of its lesson, so it is drawn in the lessons' own figure style
      (the figure engine's: ~/Documents/fintech-course-work/tools/fig.ts): the dark ink ground
      with a dot grid and a corner glow, rounded cards with a toned outline, a small-caps kicker,
      a sans face plus a mono face, and the three principle chips.

      - Tones keep the one job each has on the figures: gold = money, blue = a message,
        teal = stored facts, violet = controls, orange = pending, red = failure,
        green = correct, gray = neutral or external.
      - The big number, the part line and the glow take the part's tone, so the nine parts band
        the gallery: rules violet, money gold, ledger teal, flows orange, the outside world blue,
        controls violet, testing green, the domain gold, end to end violet.
      - The board holds one small diagram drawn for the lesson from the shapes in the DSL below,
        and under it one real line of the lesson: a line its program prints, a line of its code,
        or a line one of its figures shows.
      - Nothing on the board is invented. Every word and number in a diagram, and the line
        under it, is in the lesson's YAML; render.ts checks that, and the title too.
      - No people, no mascots, no logos of real companies.
    -->
    <style>
      :root {

        --gray: #9aa5b8;
        --accent: var(--gold);
        --sans:
          Inter, "SF Pro Display", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial,
          "Noto Sans Myanmar", sans-serif;
        --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
        --mm: "Noto Sans Myanmar", Inter, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      /* The frame sits at the top rather than centered vertically: centering can land it
         on a half pixel, and a screenshot then picks up a line of the page background. */
      body {
        margin: 0;
        min-width: max-content;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 32px 16px;
        background: #2b2b2e;
        font-family: var(--sans);
      }

      #thumb {
        position: relative;
        width: 1280px;
        height: 720px;
        flex: none;
        overflow: hidden;
        color: var(--ink);
        background-color: var(--ground);
        background-image: radial-gradient(#1b2232 1.3px, transparent 1.3px);
        background-size: 32px 32px;
        background-position: 16px 16px;
      }

      /* The corner glow of a figure, in the part's tone. */
      #thumb::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        width: 960px;
        height: 620px;
        background: radial-gradient(
          ellipse at 0 0,
          color-mix(in srgb, var(--accent) 17%, transparent),
          transparent 70%
        );
      }

      .mm {
        font-family: var(--mm);
        letter-spacing: 0;
      }

      .series {
        position: absolute;
        left: 64px;
        top: 44px;
        display: flex;
        align-items: center;
        gap: 14px;
        font: 700 21px/1 var(--sans);
        letter-spacing: 0.14em;
      }

      .series svg {
        width: 36px;
        height: 36px;
      }

      /* A figure's chip: a tinted pill with an outline. */
      .lang {
        position: absolute;
        right: 64px;
        top: 36px;
        padding: 7px 24px 10px;
        border: 2px solid var(--gray);
        border-radius: 999px;
        background: color-mix(in srgb, var(--gray) 15%, transparent);
        font: 600 23px/1.4 var(--mm);
      }

      /* The left column hangs between the board's top and bottom edges: the number at
         the top, the part and the title at the bottom. */
      .left {
        position: absolute;
        left: 64px;
        top: 132px;
        width: 548px;
        height: 448px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .num-label {
        font: 700 18px/1 var(--sans);
        letter-spacing: 0.22em;
        color: var(--muted);
      }

      .num {
        margin: 14px 0 0 -6px;
        font: 800 168px/0.8 var(--sans);
        letter-spacing: -0.045em;
        color: var(--accent);
      }

      .part {
        width: max-content;
        font: 700 18px/1.4 var(--sans);
        letter-spacing: 0.11em;
        text-transform: uppercase;
        white-space: nowrap;
        color: var(--accent);
      }

      .title {
        margin-top: 8px;
        font-weight: 700;
        font-family: var(--sans);
        line-height: 1.42;
        letter-spacing: -0.015em;
      }

      /* A title breaks only where LESSONS breaks it. */
      .title .line {
        display: block;
        width: max-content;
        white-space: nowrap;
      }

      .board {
        position: absolute;
        left: 648px;
        top: 132px;
        width: 568px;
        height: 448px;
        border: 2px solid var(--rule);
        border-radius: 24px;
        background: rgb(14 19 29 / 0.78);
      }

      .board svg {
        position: absolute;
        inset: -2px;
        width: 568px;
        height: 448px;
        font-family: var(--sans);
      }

      .board svg .mono {
        font-family: var(--mono);
      }

      .board svg .mm {
        font-family: var(--mm);
      }

      /* The lesson's real line, set the way a figure highlights a line of code. */
      .real {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 12px;
        height: 50px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 18px;
        border-radius: 12px;
        background: color-mix(in srgb, var(--accent) 15%, transparent);

        font-weight: 600;

      .real i {
        flex: none;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--accent);
      }

      .real span {
        flex: 1;
        min-width: 0;
        white-space: pre;
      }

      /* The handbook's three principles, the chips a figure carries in its corner. */
      .principles {
        position: absolute;
        left: 64px;
        top: 630px;
        display: flex;
        gap: 12px;
      }

      .principles span {
        padding: 0 16px;
        border: 2px solid var(--tone);
        border-radius: 999px;
        background: color-mix(in srgb, var(--tone) 15%, transparent);
        color: var(--tone);
        font: 700 15px/32px var(--sans);
        letter-spacing: 0.06em;
        white-space: nowrap;
      }

      /* The route is the page's own control, under the frame: it is not in the picture. */
      .route {
        width: 860px;
        height: 44px;
      }

        width: 46px;
        height: 46px;
      }

      .hint {
        color: #b9b9bd;
        font: 400 14px/1.4 var(--sans);
      }
    </style>

        shop: '<path d="M6 20l4-12h28l4 12M8 22v20h32V22"/><path d="M6 20a4.500 4.500 0 0 0 9 0 4.500 4.500 0 0 0 9 0 4.500 4.500 0 0 0 9 0 4.500 4.500 0 0 0 9 0M20 42V31h8v11"/>',
        code: '<path d="M17 14 7 24l10 10M31 14l10 10-10 10M27 9l-6 30"/>',
        cloud: '<path d="M14 37a9 9 0 0 1-1-18 12 12 0 0 1 23 2 8 8 0 0 1-1 16z"/>',
        cpu: '<rect x="12" y="12" width="24" height="24" rx="3"/><path d="M19 6v6M29 6v6M19 36v6M29 36v6M6 19h6M6 29h6M36 19h6M36 29h6"/>',
        retry: '<path d="M39 14A17 17 0 1 0 41 24"/><path d="M40 5v10H30"/>',
        mail: '<rect x="6" y="11" width="36" height="26" rx="3"/><path d="M6 13l18 14 18-14"/>',
        pen: '<path d="M8 40l4-12L32 8l8 8-20 20z"/><path d="M27 13l8 8"/>',
        building:
          '<rect x="10" y="6" width="28" height="36" rx="2"/><path d="M17 14h4M27 14h4M17 22h4M27 22h4M17 30h4M27 30h4M21 42v-6h6v6"/>',
      };

      const esc = (text) =>
        String(text).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const n1 = (value) => Math.round(value * 10) / 10;

      // How wide a run of Latin text is, in em: only for sizing a chip before it is drawn.
      function em(text, mono, bold) {
        if (mono) return String(text).length * 0.602;
        let n = 0;
        for (const ch of String(text)) {
          if (ch === " ") n += 0.3;
          else if ("iljtfr.,:;|!'`()[]".includes(ch)) n += 0.33;
          else if ("mwMW@%".includes(ch)) n += 0.88;
          else if (/[A-Z]/.test(ch)) n += 0.69;
          else if (/[0-9]/.test(ch)) n += 0.6;
          else n += 0.56;
        }
        return n * (bold ? 1.06 : 1);
      }

      // Every size a diagram names is multiplied by this: the one knob for the board's type.
      const TS = 1.1;

      // A text is a string, or parts [[string, { tone }], …] set one after another.
      // maxw marks a label that sits inside a shape; cardProblems() checks it fits.
      function txt(x, y, s, o = {}) {
        const fill = o.tone ? TONE[o.tone] : o.muted ? MUTED : o.dark ? BG : INK;
        const body = Array.isArray(s)
          ? s
              .map(
                ([part, po = {}]) =>
                  `<tspan${po.tone ? ` fill="${TONE[po.tone]}"` : ""}>${esc(part)}</tspan>`,
              )
              .join("")
          : esc(s);
        return (
          `<text x="${n1(x)}" y="${n1(y)}" text-anchor="${o.a || "middle"}" dominant-baseline="central"` +
          ` font-size="${n1((o.fs || 16) * TS)}" font-weight="${o.fw || 500}" fill="${fill}" style="white-space:pre"` +
          (o.mono ? ' class="mono"' : o.mm ? ' class="mm"' : "") +
          (o.ls ? ` letter-spacing="${o.ls}"` : "") +
          (o.maxw ? ` data-maxw="${Math.round(o.maxw)}"` : "") +
          (o.free ? ' data-free="1"' : "") +
          `>${body}</text>`
        );
      }

      function icon(name, cx, cy, size, tn = "gray", sw) {
        const k = size / 48;
        return (
          `<g transform="translate(${n1(cx - size / 2)} ${n1(cy - size / 2)}) scale(${k.toFixed(3)})"` +
          ` fill="none" stroke="${TONE[tn]}" stroke-width="${n1(sw ?? Math.max(3, 2.3 / k))}"` +
          ` stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</g>`
        );
      }

      // A labelled box. The icon sits on top in a tall card and on the left in a low one.
      function card(x, y, w, h, o = {}) {
        const c = TONE[o.tone || "gray"];
        const rx = o.rx ?? 14;
        const out = [
          `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${CARD}" stroke="${c}"` +
            ` stroke-width="2.5"${o.dash ? ' stroke-dasharray="8 7"' : ""}/>`,
        ];
        if (o.tint)
          out.push(
            `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${c}" opacity="0.13"/>`,
          );
        const lines = Array.isArray(o.label)
          ? [o.label]
          : o.label
            ? String(o.label).split("\n")
            : [];
        const subs = o.sub ? String(o.sub).split("\n") : [];
        const fs = o.fs ?? 17;
        const sfs = o.sfs ?? 13;
        const lh = fs * TS * 1.28;
        const slh = sfs * TS * 1.4;
        const size = o.icon ? (o.is ?? Math.min(32, h - 24)) : 0;
        const side = o.icon && (o.side ?? h < 84);
        const textH = lines.length * lh + (subs.length ? 3 + subs.length * slh : 0);
        const gap = textH ? 8 : 0;
        let cy = y + (h - (o.icon && !side ? size + gap : 0) - textH) / 2;
        const pad = 12;
        const left = side ? x + pad + size + 10 : x + pad;
        const room = x + w - pad - left;
        const cx = left + room / 2;
        if (o.icon && side) out.push(icon(o.icon, x + pad + size / 2, y + h / 2, size, o.tone));
        if (o.icon && !side) {
          out.push(icon(o.icon, x + w / 2, cy + size / 2, size, o.tone));
          cy += size + gap;
        }
        for (const text of lines) {
          out.push(
            txt(cx, cy + lh / 2, text, {
              fs,
              fw: o.fw ?? 600,
              mono: o.mono,
              tone: o.lt,
              ls: o.ls,
              maxw: room,
            }),
          );
          cy += lh;
        }
        if (subs.length) cy += 3;
        for (const text of subs) {
          out.push(
            txt(cx, cy + slh / 2, text, {
              fs: sfs,
              mono: o.smono,
              tone: o.st,
              muted: !o.st,
              maxw: room,
            }),
          );
          cy += slh;
        }
        return out.join("");
      }

      // A pill. (x, y) is its top-left corner unless a says "middle" or "end".
      function chip(x, y, s, o = {}) {
        const fs = o.fs ?? 15;
        const mono = o.mono !== 0;
        const c = TONE[o.tone || "gray"];
        const w = Math.ceil(em(s, mono, true) * fs * TS + 26);
        const h = Math.round(fs * TS + 15);
        const left = o.a === "middle" ? x - w / 2 : o.a === "end" ? x - w : x;
        const rect = `x="${n1(left)}" y="${y}" width="${w}" height="${h}" rx="${h / 2}"`;
        return (
          `<rect ${rect} fill="${o.solid ? c : CARD}"/>` +
          (o.solid
            ? ""
            : `<rect ${rect} fill="${c}" opacity="0.16"/><rect ${rect} fill="none" stroke="${c}" stroke-width="2"/>`) +
          txt(left + w / 2, y + h / 2 + 0.5, s, {
            fs,
            fw: 700,
            mono,
            tone: o.solid ? undefined : o.tone || "gray",
            dark: o.solid,
            maxw: w - 12,
          })
        );
      }

      const stroke = (o = {}, width = 3) =>
        `fill="none" stroke="${TONE[o.tone || "gray"]}" stroke-width="${o.w ?? width}" stroke-linecap="round" stroke-linejoin="round"` +
        (o.dash ? ` stroke-dasharray="${o.dash === 1 ? "8 7" : o.dash}"` : "") +
        (o.op ? ` opacity="${o.op}"` : "");
      const line = (points, o = {}) =>
        `<polyline points="${points.map((p) => p.map(n1).join(",")).join(" ")}" ${stroke(o, 2.5)}/>`;
      const path = (d, o = {}) =>
        `<path d="${d}" ${stroke(o)}${o.arrow ? ` marker-end="url(#ah-${o.tone || "gray"})"` : ""}/>`;
      const dot = (cx, cy, r, tn = "gray", op = 1) =>
        `<circle cx="${n1(cx)}" cy="${n1(cy)}" r="${r}" fill="${TONE[tn]}"${op < 1 ? ` opacity="${op}"` : ""}/>`;
      const xMark = (cx, cy, s = 9) =>
        `<path d="M${n1(cx - s)} ${n1(cy - s)}l${2 * s} ${2 * s}M${n1(cx + s)} ${n1(cy - s)}l${-2 * s} ${2 * s}"` +
        ` fill="none" stroke="${TONE.red}" stroke-width="4" stroke-linecap="round"/>`;

      // kind: money (gold), msg (blue, dashed), plain (gray), bad (red), ok (green).
      // lost stops the arrow part-way with a red ✗; curve bends it.
      function arrow(x1, y1, x2, y2, o = {}) {
        const tn = o.tone || KIND[o.kind || "plain"];
        const dashed = o.dash ?? (o.kind === "msg" ? "9 7" : 0);
        const lost = o.lost ? (o.lost === true ? 0.6 : o.lost) : 0;
        const ex = lost ? x1 + (x2 - x1) * lost : x2;
        const ey = lost ? y1 + (y2 - y1) * lost : y2;
        let d = `M${n1(x1)} ${n1(y1)}L${n1(ex)} ${n1(ey)}`;
        let mid = [(x1 + ex) / 2, (y1 + ey) / 2];
        if (o.curve) {
          const len = Math.hypot(x2 - x1, y2 - y1) || 1;
          const ux = (x2 - x1) / len;
          const uy = (y2 - y1) / len;
          d = `M${n1(x1)} ${n1(y1)}Q${n1((x1 + x2) / 2 - uy * o.curve)} ${n1((y1 + y2) / 2 + ux * o.curve)} ${n1(x2)} ${n1(y2)}`;
          mid = [(x1 + x2) / 2 - (uy * o.curve) / 2, (y1 + y2) / 2 + (ux * o.curve) / 2];
        }
        const out = [
          `<path d="${d}" ${stroke({ tone: tn, w: o.w, dash: dashed, op: o.op })}` +
            (lost ? "" : ` marker-end="url(#ah-${tn})"`) +
            (o.both ? ` marker-start="url(#ah-${tn})"` : "") +
            "/>",
        ];
        if (lost) out.push(xMark(ex, ey));
        if (o.label)
          out.push(
            txt(mid[0] + (o.ldx ?? 0), mid[1] + (o.ldy ?? -13), o.label, {
              fs: o.fs ?? 14,
              fw: 600,
              mono: o.mono,
              tone: o.lt || tn,
            }),
          );
        return out.join("");
      }

      // A ✓ / ✗ / ⚠ badge.
      function mark(cx, cy, kind = "check", r = 14) {
        const [name, tn] = {
          check: ["check", "green"],
          cross: ["cross", "red"],
          warn: ["warn", "orange"],
        }[kind];
        return (
          `<circle cx="${n1(cx)}" cy="${n1(cy)}" r="${r}" fill="${BG}" stroke="${TONE[tn]}" stroke-width="2.5"/>` +
          icon(name, cx, cy, r * 1.15, tn, 5.5)
        );
      }

      // A dashed region that groups things: a boundary, one transaction, a book.
      function region(x, y, w, h, o = {}) {
        const c = TONE[o.tone || "gray"];
        return (
          `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="18" fill="${c}" fill-opacity="0.05" stroke="${c}"` +
          ` stroke-width="2" stroke-opacity="0.75"${o.solid ? "" : ' stroke-dasharray="8 7"'}/>` +
          (o.label
            ? txt(x + 14, y + 19, o.label, {
                a: "start",
                fs: 12.5,
                fw: 700,
                tone: o.tone || "gray",
                ls: "0.08em",
                maxw: w - 24,
              })
            : "")
        );
      }

      // An emphasis outline around a box.
      function ring(x, y, w, h, tn = "gold", pad = 7) {
        const rect = `x="${x - pad}" y="${y - pad}" width="${w + 2 * pad}" height="${h + 2 * pad}" rx="20" fill="none" stroke="${TONE[tn]}"`;
        return `<rect ${rect} stroke-width="8" opacity="0.18"/><rect ${rect} stroke-width="2.5"/>`;
      }

      // Rows in a card; the ledger's natural form. A row is a list of cells or
      // { cells, hl: tone }; a cell is a string or { v, tone, bold, mono, muted, mark }.
      function table(x, y, w, o) {
        const rowH = o.rowH ?? 44;
        const headH = o.head ? 30 : 0;
        const fs = o.fs ?? 15;
        const pad = 16;
        const total = o.cols.reduce((n, col) => n + (col.w ?? 1), 0);
        const xs = [x];
        for (const col of o.cols) xs.push(xs[xs.length - 1] + (w * (col.w ?? 1)) / total);
        const rows = o.rows.map((row) => (Array.isArray(row) ? { cells: row } : row));
        const h = headH + rows.length * rowH;
        const out = [
          `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="${CARD}" stroke="${RULE}" stroke-width="2"/>`,
        ];
        const place = (ci) => {
          const align = o.cols[ci].align || "left";
          return {
            x:
              align === "right"
                ? xs[ci + 1] - pad
                : align === "center"
                  ? (xs[ci] + xs[ci + 1]) / 2
                  : xs[ci] + pad,
            a: align === "right" ? "end" : align === "center" ? "middle" : "start",
            maxw: xs[ci + 1] - xs[ci] - 2 * pad + 6,
          };
        };
        if (o.head) {
          o.head.forEach((text, ci) => {
            if (!text) return;
            const at = place(ci);
            out.push(txt(at.x, y + headH / 2 + 1, text, { a: at.a, fs: 12, fw: 700, muted: 1 }));
          });
          out.push(
            `<path d="M${x} ${y + headH}H${x + w}" stroke="${RULE}" stroke-width="2" fill="none"/>`,
          );
        }
        rows.forEach((row, i) => {
          const top = y + headH + i * rowH;
          if (row.hl)
            out.push(
              `<rect x="${x + 5}" y="${top + 4}" width="${w - 10}" height="${rowH - 8}" rx="8" fill="${TONE[row.hl]}" opacity="0.14"/>`,
            );
          if (i > 0)
            out.push(
              `<path d="M${x + 12} ${top}H${x + w - 12}" stroke="${RULE}" stroke-width="1.5" fill="none"/>`,
            );
          row.cells.forEach((value, ci) => {
            if (value === "" || value == null) return;
            const c = typeof value === "object" ? value : { v: value };
            const col = o.cols[ci];
            const at = place(ci);
            if (c.mark) {
              out.push(
                mark(at.a === "start" ? at.x + 12 : at.x, top + rowH / 2, c.mark, c.r ?? 14),
              );
              return;
            }
            out.push(
              txt(at.x, top + rowH / 2 + 0.5, c.v, {
                a: at.a,
                fs: c.fs ?? fs,
                mono: c.mono ?? col.mono,
                fw: (c.bold ?? col.bold) ? 700 : 500,
                tone: c.tone ?? col.tone,
                muted: c.muted,
                maxw: at.maxw,
              }),
            );
          });
        });
        return out.join("");
      }

      // A T-account: debits on the left, credits on the right.
      function tacct(x, y, w, h, o) {
        const c = TONE[o.tone || "ink"];
        const top = y + 36;
        const out = [
          txt(x + w / 2, y + 14, o.name, { fs: 15, fw: 700, mono: 1, tone: o.tone, maxw: w - 8 }),
          `<path d="M${x} ${top}H${x + w}M${x + w / 2} ${top}V${y + h}" stroke="${c}" stroke-width="3" stroke-linecap="round" fill="none"/>`,
          txt(x + w / 4, top + 20, "Debit", { fs: 12.5, fw: 700, muted: 1 }),
          txt(x + (3 * w) / 4, top + 20, "Credit", { fs: 12.5, fw: 700, muted: 1 }),
        ];
        const column = (items, cx) =>
          (items || []).forEach((value, i) =>
            out.push(
              txt(cx, top + 58 + i * 32, value, { fs: 19, fw: 600, mono: 1, maxw: w / 2 - 16 }),
            ),
          );
        column(o.left, x + w / 4);
        column(o.right, x + (3 * w) / 4);
        return out.join("");
      }

      // One bar split into segments; a hatched segment is held, not spent.
      function bar(x, y, w, h, segs) {
        const total = segs.reduce((n, seg) => n + seg.v, 0);
        const out = [
          `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="${CARD}" stroke="${RULE}" stroke-width="2"/>`,
        ];
        let left = x;
        for (const seg of segs) {
          const sw = (w * seg.v) / total;
          const c = TONE[seg.tone];
          const rect = `x="${n1(left + 4)}" y="${y + 4}" width="${n1(sw - 8)}" height="${h - 8}" rx="8"`;
          out.push(`<rect ${rect} fill="${c}" opacity="${seg.hatch ? 0.28 : 0.82}"/>`);
          if (seg.hatch)
            out.push(`<rect ${rect} fill="url(#hatch)" stroke="${c}" stroke-width="2.5"/>`);
          out.push(
            txt(left + sw / 2, y + h / 2 + 0.5, seg.value, {
              fs: 19,
              fw: 700,
              mono: 1,
              dark: !seg.hatch,
              maxw: sw - 14,
            }),
            txt(left + sw / 2, y + h + 18, seg.label, { fs: 14.5, fw: 600, tone: seg.tone }),
          );
          left += sw;
        }
        return out.join("");
      }

      // A brace: under a width (pointing down), or beside a height (pointing right).
      function brace(x, y, o) {
        const q = 10;
        let d;
        if (o.w) {
          const m = x + o.w / 2;
          d = `M${x} ${y}q0 ${q} ${q} ${q}H${m - q}q${q} 0 ${q} ${q}q0 ${-q} ${q} ${-q}H${x + o.w - q}q${q} 0 ${q} ${-q}`;
        } else {
          const m = y + o.h / 2;
          d = `M${x} ${y}q${q} 0 ${q} ${q}V${m - q}q0 ${q} ${q} ${q}q${-q} 0 ${-q} ${q}V${y + o.h - q}q0 ${q} ${-q} ${q}`;
        }
        return path(d, { tone: o.tone || "gray", w: 2.5 });
      }

      // A line of time with ticks (label under it, sub under the label) and spans over it.
      function timeline(x, y, w, ticks, spans = []) {
        const out = [
          `<path d="M${x} ${y}H${x + w}" stroke="${MUTED}" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#ah-gray)"/>`,
        ];
        for (const span of spans) {
          const x1 = x + w * span.from;
          const x2 = x + w * span.to;
          out.push(
            `<path d="M${n1(x1)} ${y - 16}H${n1(x2)}" stroke="${TONE[span.tone]}" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.85"/>`,
            txt((x1 + x2) / 2, y - 38, span.label, { fs: 17, fw: 700, tone: span.tone }),
          );
        }
        for (const tick of ticks) {
          const tx = x + w * tick.at;
          out.push(
            `<path d="M${n1(tx)} ${y}V${y + 28}" stroke="${TONE[tick.tone]}" stroke-width="2.5" fill="none"/>`,
            dot(tx, y, 7, tick.tone),
            txt(tx, y + 46, tick.label, { fs: 16, fw: 700, tone: tick.tone }),
          );
          if (tick.sub) out.push(txt(tx, y + 70, tick.sub, { fs: 15, mono: 1, muted: 1 }));
        }
        return out.join("");
      }

      // The head of a sequence diagram's lifeline, and the lifeline.
      const lifeline = (x, y1, y2) =>
        line(
          [
            [x, y1],
            [x, y2],
          ],
          { tone: "gray", w: 2, dash: "5 8", op: 0.5 },
        );

      /* ---------- One diagram per lesson, on a 568×448 board (the real line takes the
         bottom 76) ---------- */

      const GLYPHS = {
        // The three principles every pattern in the course protects.
        1: () =>
          [
            ["gold", "coin", "NO INVENTED\nDATA", 24],
            ["teal", "db", "NO LOST\nDATA", 204],
            ["violet", "shield", "NO\nTRUST", 384],
          ].map(([tn, name, label, x]) =>
            card(x, 70, 160, 216, {
              tone: tn,
              tint: 1,
              icon: name,
              is: 60,
              label,
              fs: 15.5,
              fw: 700,
              lt: tn,
              ls: "0.05em",
            }),
          ),
        // Two decimal amounts go through a float64 and come out with digits nobody put in.
        2: () => [
          card(124, 34, 130, 58, { tone: "gold", label: "0.1", mono: 1, fs: 26 }),
          txt(284, 63, "+", { fs: 28, fw: 600, muted: 1, free: 1 }),
          card(314, 34, 130, 58, { tone: "gold", label: "0.2", mono: 1, fs: 26 }),
          arrow(189, 98, 250, 138, { kind: "plain" }),
          arrow(379, 98, 318, 138, { kind: "plain" }),
          card(184, 146, 200, 58, { tone: "gray", icon: "cpu", label: "float64", mono: 1, fs: 19 }),
          arrow(284, 210, 284, 250, { kind: "bad" }),
          txt(
            258,
            296,
            [
              ["0.3", {}],
              ["0000000000000004", { tone: "red" }],
            ],
            { fs: 30, fw: 700, mono: 1 },
          ),
          mark(488, 296, "cross", 15),
        ],
        // Three currencies with three different decimals, each stored as the same integer.
        3: () => [
          card(24, 44, 196, 62, { tone: "gold", label: "12.34 USD", mono: 1, fs: 19 }),
          card(24, 157, 196, 62, { tone: "gold", label: "1234 JPY", mono: 1, fs: 19 }),
          card(24, 270, 196, 62, { tone: "gold", label: "1.234 BHD", mono: 1, fs: 19 }),
          arrow(228, 75, 350, 160, { kind: "money" }),
          arrow(228, 188, 350, 188, { kind: "money" }),
          arrow(228, 301, 350, 216, { kind: "money" }),
          card(360, 118, 184, 140, {
            tone: "teal",
            tint: 1,
            label: "1234",
            mono: 1,
            fs: 44,
            fw: 700,
            sub: "int64",
            sfs: 16,
            smono: 1,
          }),
        ],
        // An integer crosses a JSON boundary and comes back one off.
        4: () => [
          card(54, 44, 460, 82, {
            tone: "teal",
            label: "9007199254740993",
            mono: 1,
            fs: 30,
            sub: "int64",
            sfs: 14,
            smono: 1,
          }),
          arrow(284, 134, 284, 226, { kind: "msg" }),
          txt(264, 180, "JSON", { a: "end", fs: 18, fw: 700, tone: "blue" }),
          chip(304, 164, "2^53", { tone: "gray" }),
          card(54, 236, 460, 82, {
            tone: "red",
            label: [
              ["900719925474099", {}],

        const to = stopX[inPart[inPart.length - 1].number - 1];
        const out = [
          `<line x1="${stopX[0]}" y1="22" x2="${n1(stopX[stopX.length - 1])}" y2="22" stroke="#5a6478" stroke-width="2.5" stroke-linecap="round"/>`,
          `<line x1="${n1(from)}" y1="22" x2="${n1(to)}" y2="22" stroke="${accent}" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>`,
        ];
        LESSONS.forEach((lesson, i) => {
          const x = n1(stopX[i]);
          if (lesson.number === current.number)
            out.push(
              `<circle cx="${x}" cy="22" r="14" fill="none" stroke="${accent}" stroke-width="2.5" opacity="0.5"/>`,
              `<circle cx="${x}" cy="22" r="8.5" fill="${accent}" data-lesson="${lesson.number}"/>`,
            );
          else
            out.push(
              `<circle cx="${x}" cy="22" r="5" fill="${lesson.number < current.number ? INK : "#5a6478"}" data-lesson="${lesson.number}"/>`,
            );
        });
        $("route").innerHTML = out.join("");
      }

      const TITLE_MIN = 38;
      const REAL_MIN = 15;

      // The widest title that fits the column and the room under the number.
      function fitTitle() {
        const title = $("title");
        const room = 448 - $("num").parentElement.offsetHeight - $("part").offsetHeight - 30;
        let size = 70;
        const tooBig = () =>
          title.offsetHeight > room ||
          [...title.children].some((lineElement) => lineElement.offsetWidth > 548);
        title.style.fontSize = `${size}px`;
        while (size > TITLE_MIN && tooBig()) {
          size -= 2;
          title.style.fontSize = `${size}px`;
        }
      }

      // The real line at the largest size that keeps it on one line.
      function fitReal() {
        const real = $("real");
        let size = 21;
        real.style.fontSize = `${size}px`;
        while (size > REAL_MIN && real.scrollWidth > real.clientWidth) {
          size -= 0.5;
          real.style.fontSize = `${size}px`;
        }
      }

      // A diagram is drawn where its numbers are easy to write, then set in the middle of the
      // room above the real line.
      function centerArt() {
        const art = $("art");
        const box = art.getBBox();
        const dx = Math.round(284 - (box.x + box.width / 2));
        const dy = Math.round(188 - (box.y + box.height / 2));
        art.setAttribute("transform", `translate(${dx} ${dy})`);
      }

      let shown = 1;
      window.setThumb = ({ lesson }) => {
        const current = LESSONS.find((entry) => entry.number === lesson);
        if (!current) throw new Error(`no lesson ${lesson}`);
        shown = lesson;
        $("thumb").style.setProperty("--accent", accentOf(current));
        $("num").textContent = String(current.number).padStart(2, "0");
        $("part").textContent = `Part ${current.part} · ${PARTS[current.part - 1].name}`;
        $("title").innerHTML = current.lines
          .map((text) => `<span class="line">${withMyanmar(text)}</span>`)
          .join("");
        $("real").textContent = current.real;
        $("glyph").innerHTML =
          `<defs>${defs}</defs><g id="art">${[GLYPHS[current.number]()].flat(Infinity).join("")}</g>`;
        centerArt();
        renderRoute(current);
        fitTitle();
        fitReal();
      };

      // What is wrong with the card on screen: a shape or a word outside the board's safe
      // area, a label wider than the shape it sits in, two labels on top of each other, a
      // title or a real line that does not fit. render.ts fails on any.
      window.cardProblems = () => {
        const svg = $("glyph");
        const frame = svg.getBoundingClientRect();
        const problems = [];
        const texts = [];
        for (const node of svg.querySelectorAll(
          "rect, circle, ellipse, path, line, polyline, polygon, text",
        )) {
          if (node.closest("defs")) continue;
          const b = node.getBoundingClientRect();
          const x = b.left - frame.left;
          const y = b.top - frame.top;
          const name = node.tagName === "text" ? `"${node.textContent}"` : node.tagName;
          if (x < 15 || y < 15 || x + b.width > 553 || y + b.height > 362)
            problems.push(
              `${name} leaves the safe area (${Math.round(x)},${Math.round(y)} ${Math.round(b.width)}×${Math.round(b.height)})`,
            );
          if (node.tagName !== "text") continue;
          const maxw = Number(node.getAttribute("data-maxw"));
          if (maxw && b.width > maxw)
            problems.push(`${name} is ${Math.round(b.width)} wide in a ${maxw} space`);
          // The ink of a line of text is shorter than its box.
          const inset = b.height * 0.18;
          texts.push({ name, l: x, r: x + b.width, t: y + inset, b: y + b.height - inset });
        }
        texts.forEach((a, i) =>
          texts.slice(i + 1).forEach((b) => {
            const w = Math.min(a.r, b.r) - Math.max(a.l, b.l);
            const h = Math.min(a.b, b.b) - Math.max(a.t, b.t);
            if (w > 2 && h > 2) problems.push(`${a.name} overlaps ${b.name}`);
          }),
        );

        const title = $("title");
        if (parseFloat(title.style.fontSize) <= TITLE_MIN)
          problems.push("the title is at its smallest size");
        for (const lineElement of title.children)
          if (lineElement.offsetWidth > 548)
            problems.push(`the title line "${lineElement.textContent}" is wider than the column`);
        if ($("part").offsetWidth > 548) problems.push("the part line is wider than the column");
        if ($("part").getBoundingClientRect().top < $("num").getBoundingClientRect().bottom + 12)
          problems.push("the part and title run into the number");
        const real = $("real");
        if (real.scrollWidth > real.clientWidth)
          problems.push(`the real line "${real.textContent}" does not fit its strip`);
        return problems;
      };

      // Every word and number the diagram shows, for render.ts to look up in the lesson.
      window.cardLabels = () =>
        [...$("glyph").querySelectorAll("text:not([data-free])")]
          .map((node) => node.textContent)
          .filter((text) => /[\p{L}\p{N}]/u.test(text));

      $("route").addEventListener("click", (event) => {
        const lesson = Number(event.target.getAttribute("data-lesson"));
        if (lesson) window.setThumb({ lesson });
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight" && shown < LESSONS.length)
          window.setThumb({ lesson: shown + 1 });
        if (event.key === "ArrowLeft" && shown > 1) window.setThumb({ lesson: shown - 1 });
      });

      window.setThumb({ lesson: 1 });
      window.thumbReady = Promise.all(
        [
          "800 36px Inter",
          "700 36px Inter",
          "600 36px Inter",
          "500 36px Inter",
          '700 36px "JetBrains Mono"',
          '600 36px "JetBrains Mono"',
          '500 36px "JetBrains Mono"',
          '700 36px "Noto Sans Myanmar"',
          '600 36px "Noto Sans Myanmar"',
        ].map((face) => document.fonts.load(face, "Aa မြန်မာ").catch(() => [])),
      )
        .then(() => document.fonts.ready)
        .then(() => window.setThumb({ lesson: shown }));
    </script>
  </body>
</html>
