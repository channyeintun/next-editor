name = "next-editor-remote-runtime"
main = "src/index.ts"
compatibility_date = "2026-07-14"
compatibility_flags = ["nodejs_compat"]

# Production hostname routing is intentionally omitted until the manual setup guide's
# Option A/B/C choice has been completed. Set PREVIEW_URL_TEMPLATE and add the matching
# wildcard route only after DNS/TLS are ready. Path-based previews work under wrangler dev.
[vars]
PREVIEW_URL_TEMPLATE = "http://localhost:8787/preview/{{sessionId}}/{{port}}"
MAX_CONCURRENT_SESSIONS = "2"
MAX_DAILY_MINUTES = "120"

[[containers]]
class_name = "RuntimeGoSessionDO"
image = "../Dockerfile.go1.26.5"
instance_type = "basic"
max_instances = 10

[[durable_objects.bindings]]
name = "RUNTIME_GO_SESSIONS"
class_name = "RuntimeGoSessionDO"

[[d1_databases]]
binding = "RUNTIME_QUOTAS"
database_name = "next-editor-remote-runtime"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RuntimeGoSessionDO"]

[observability]
enabled = true
