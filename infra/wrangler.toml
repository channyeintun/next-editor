name = "next-editor-tube"
main = "./worker/index.ts"
compatibility_date = "2026-07-05"
# enable_request_signal makes an incoming request's `signal` fire when the
# client cancels it (routes/studio.ts then cancels the GPU job nobody is
# waiting for); a request that completes never fires it.
compatibility_flags = ["nodejs_compat", "enable_request_signal"]
# Every isolate start (the first request per colo after idle, each Durable
# Object wake) parses the whole bundle, so ship it minified. Wrangler keeps
# function names by default, and the uploaded source maps keep Workers Logs
# stack traces pointing at the TypeScript.
minify = true
upload_source_maps = true
# Deliberately no [alias] table. Self-aliases ("hono" = "hono") make Wrangler
# resolve through Node's require.resolve, which bundles each package's CJS/node
# build (jose on node:crypto, hono CJS, the whole lucide-react barrel) instead
# of its tree-shakeable workerd/browser ESM: about 1.6 MB more to parse. They
# only ever worked around a stray ~/.pnp.cjs (docs/cloudflare-deploy-guide.md).

# The browser-facing origin, used to build the exact Google OAuth redirect_uri
# (must byte-for-byte match what's registered in Google Cloud Console — it
# can't be inferred from the request, since the vite dev proxy forwards to a
# different port than the browser's address bar shows). TODO(Phase 4):
# override with the real production origin once one exists.
[vars]
PUBLIC_URL = "https://nexteditor.dev"
# Server-side voice chat feature flag; fails closed. Flip to "true" only after
# the Realtime SFU secrets below are configured:
#   wrangler secret put REALTIME_SFU_APP_ID     --config infra/wrangler.toml
#   wrangler secret put REALTIME_SFU_APP_SECRET --config infra/wrangler.toml
# Use separate Cloudflare Realtime applications per environment; never commit
# an application ID or token.
VOICE_CHAT_ENABLED = "true"
# Kill switch for live Go lesson execution (worker/routes/goPlayground.ts).
# Fails closed. Flip to "true" only after completing the Phase 0 upstream
# checklist in docs/go-lessons-selective-runtime-plan.md — contacting the Go
# Playground maintainers and confirming the user agent — since enabling it
# sends learners' Run and Format requests to play.golang.org. Go editing and
# recorded playback work regardless of this flag.
GO_PLAYGROUND_ENABLED = "true"
# Kill switch for live Haskell lesson execution (worker/routes/haskellPlayground.ts).
# Fails closed. Run proxies to play.haskell.org's public submit endpoint,
# pinned to GHC 9.12.4 — there is no formatter upstream, so this is the only
# route. That service deadlines a running program at 5 seconds and answers 503
# "Service busy" when its shared community worker pool saturates, so the route
# caches deterministic outcomes and holds a modest per-caller ceiling. Haskell
# editing and recorded playback work regardless of this flag.
HASKELL_PLAYGROUND_ENABLED = "true"
# Kill switch for live Kotlin lesson execution (worker/routes/kotlinPlayground.ts).
# Fails closed. Runs proxy to api.kotlinlang.org — the same public compiler
# service JetBrains' embeddable kotlin-playground widget uses from any origin.
# Kotlin editing and recorded playback work regardless of this flag.
KOTLIN_PLAYGROUND_ENABLED = "true"
# Kill switch for live Rust lesson execution (worker/routes/rustPlayground.ts).
# Fails closed. Run and Format proxy to play.rust-lang.org's public execute
# and format APIs. Rust editing and recorded playback work regardless of this
# flag.
RUST_PLAYGROUND_ENABLED = "true"
# Kill switch for live Zig lesson execution (worker/routes/zigPlayground.ts).
# Fails closed. Run and Format proxy to zig-play.dev's public run and fmt
# endpoints, pinned to Zig 0.16.0. That service rate-limits at 5 requests per
# minute per client IP, which every user of this Worker shares, so the route
# caches deterministic outcomes and holds a lower per-caller ceiling. Zig editing
# and recorded playback work regardless of this flag.
ZIG_PLAYGROUND_ENABLED = "true"
# Required for authentication — auth fails at runtime without these. Set them with:
#   wrangler secret put GOOGLE_CLIENT_ID     --config infra/wrangler.toml
#   wrangler secret put GOOGLE_CLIENT_SECRET --config infra/wrangler.toml
#   wrangler secret put SESSION_SECRET       --config infra/wrangler.toml
# QStash is optional for local development. Production should configure all
# three values; job routes fail closed if either signing key is absent:
#   wrangler secret put QSTASH_TOKEN               --config infra/wrangler.toml
#   wrangler secret put QSTASH_CURRENT_SIGNING_KEY --config infra/wrangler.toml
#   wrangler secret put QSTASH_NEXT_SIGNING_KEY    --config infra/wrangler.toml
# Private Burmese Studio narration is enabled per user in D1 and also requires
# all three Modal values. Keep the proxy token pair out of [vars]:
#   wrangler secret put VOXCPM2_MODAL_JOBS_URL    --config infra/wrangler.toml
#   wrangler secret put MODAL_PROXY_TOKEN_ID      --config infra/wrangler.toml
#   wrangler secret put MODAL_PROXY_TOKEN_SECRET  --config infra/wrangler.toml
# Burmese Studio narration with each user's own AthanLab API key needs no flag,
# only the key-sealing secret: base64 of exactly 32 random bytes (generate it
# with `openssl rand -base64 32`). Without it, or with a malformed one,
# AthanLab narration stays off. Rotating it makes every stored AthanLab key
# unreadable, so each user has to connect their key again:
#   wrangler secret put ATHANLAB_KEY_ENCRYPTION_SECRET --config infra/wrangler.toml

# Custom Domain: routes all paths of nexteditor.dev to this Worker. Requires
# the zone to already be on Cloudflare (nameservers pointed here) — done by
# Chan. Bare hostname, no path glob — Custom Domains cover every path by
# design (unlike a plain Route, which uses "example.com/*" patterns).
[[routes]]
pattern = "nexteditor.dev"
custom_domain = true

# The SPA build output (bun run build, from the repo root). Served through the
# Worker (see run_worker_first below): its catch-all (worker/index.ts) hands
# every path it does not route itself to this binding.
[assets]
directory = "../dist"
binding = "ASSETS"
# Serves index.html (200) for any request that doesn't match a static file
# (used by the Worker's catch-all below). Plain redirect-to-"/" (the default)
# doesn't work here since our SPA routes (/learn, /code, /learn/:slug) aren't
# "/" itself.
not_found_handling = "single-page-application"
# Without this, an exact static-file match (JS chunks, seed /lessons/*.json,
# images) is served directly by the edge and never reaches the Worker below —
# which means it would ship without the COEP/COOP headers the app requires on
# every response for WebContainers/SharedArrayBuffer (see worker/index.ts).
# Routing every request through the Worker first costs a bit of Worker CPU on
# static files, but correctness here isn't optional.
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "next-editor-tube"
database_id = "c9dc42e5-2602-4740-86a1-71b5646b7bbf"
migrations_dir = "./db/migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "next-editor-tube-media"

# Result cache for the playground routes (fail-open; omit it to run them
# uncached), see worker/cache.ts. With no account-specific ID checked in,
# Wrangler creates a persistent local namespace for development and
# automatically provisions/attaches one on the first deployment.
[[kv_namespaces]]
binding = "CACHE"

# Per-caller budgets for the playground proxies (worker/routes/*Playground.ts),
# enforced by Workers Rate Limiting. Run and Format need no sign-in, so the key
# is "user:<id>" for a signed-in learner and "ip:<client IP>" (an IPv6 address
# cut to its /64) for a signed-out one; callers without a CF-Connecting-IP
# header share one "ip:unknown" budget (playgroundRateLimitKey in
# worker/playgroundProxy.ts). The IP is only a rate-limit key: never logged,
# sent upstream, or stored. Each budget is its own binding: Go and Rust give
# /run and /format one each, and Zig charges both to one because its upstream
# counts them together. Cached results are served before a budget is charged,
# so these count upstream calls, not button presses.
# Counters live per Cloudflare location and are approximate by design, which
# is enough for a courtesy ceiling in front of a community service, and they
# cost no KV writes. A route whose binding is missing answers 502 rather than
# proxying without a limit (fails closed, like the kill switches above).
# `period` may only be 10 or 60 seconds; keep 60, because the routes' 429 says
# "retry in a minute". `namespace_id` names the counter across the whole
# Cloudflare account: never reuse one for a different budget, and keep this
# 7101-7109 block (playgrounds 7101-7107, AthanLab 7108-7109) clear of other
# Workers' ids, or they would share counters.
[[ratelimits]]
name = "GO_RUN_RATE_LIMITER"
namespace_id = "7101"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "GO_FORMAT_RATE_LIMITER"
namespace_id = "7102"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "RUST_RUN_RATE_LIMITER"
namespace_id = "7103"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RUST_FORMAT_RATE_LIMITER"
namespace_id = "7104"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "KOTLIN_RUN_RATE_LIMITER"
namespace_id = "7105"
simple = { limit = 10, period = 60 }

# play.haskell.org publishes no per-IP budget, but every run occupies one
# worker in a small shared community pool for seconds of real compile time,
# and the service answers 503 once that pool saturates. So this sits below the
# 10/min the Rust and Kotlin routes allow against far larger hosted services,
# and above Zig's 4/min, which is pinned by that upstream's hard documented
# 5/min per-IP cap rather than by politeness.
[[ratelimits]]
name = "HASKELL_RUN_RATE_LIMITER"
namespace_id = "7106"
simple = { limit = 6, period = 60 }

# One budget for Zig runs and formats together, deliberately below
# zig-play.dev's own 5/minute per-IP budget, which /server/run and /server/fmt
# share: every Next Editor user shares this Worker's egress, so our ceiling has
# to leave room for other users rather than spend the whole upstream budget on
# one person.
[[ratelimits]]
name = "ZIG_UPSTREAM_RATE_LIMITER"
namespace_id = "7107"
simple = { limit = 4, period = 60 }

# AthanLab narration (worker/routes/athanlab.ts), keyed "user:<id>" (every
# AthanLab route requires sign-in); a refusal answers 429 with
# retryAfterSeconds 60. Key checks on PUT /api/studio/athanlab/key are free but
# each wrong key counts against AthanLab's failed-auth limit for our whole
# shared network, so they get a tight budget of their own. Across all users,
# the D1 breaker in worker/athanlab/breaker.ts admits a check only into one of
# 8 slots per fixed 5-minute window, taken before AthanLab hears of the key
# and kept when AthanLab answers 401 (or never answers at all).
[[ratelimits]]
name = "ATHANLAB_KEY_RATE_LIMITER"
namespace_id = "7108"
simple = { limit = 5, period = 60 }

# Every route that sends a stored AthanLab key: voices, voice samples, usage,
# and synthesis (one per dialog attempt; each stays far below AthanLab's own
# 60 writes and 600 reads per key per minute). Separately, each request makes
# its first AthanLab call under a per-user lease in D1, so concurrent requests
# with a revoked key do not each cost a failed sign-in.
[[ratelimits]]
name = "ATHANLAB_API_RATE_LIMITER"
namespace_id = "7109"
simple = { limit = 30, period = 60 }

# One hibernating WebSocket coordinator per live-collaboration room. Every room
# keeps its durable Yjs log in this object's SQLite storage.
[[durable_objects.bindings]]
name = "COLLABORATION_ROOMS"
class_name = "CollaborationRoomDurableObject"

[[migrations]]
tag = "collaboration-room-v1"
new_sqlite_classes = ["CollaborationRoomDurableObject"]

# One ephemeral voice coordinator per live-collaboration room. Roster and SFU
# session/track ownership live in hibernating WebSocket attachments; the
# SQLite backend is declared because new classes require it on current plans,
# but the object performs no storage writes.
[[durable_objects.bindings]]
name = "COLLABORATION_VOICE_ROOMS"
class_name = "CollaborationVoiceRoomDurableObject"

[[migrations]]
tag = "collaboration-voice-v1"
new_sqlite_classes = ["CollaborationVoiceRoomDurableObject"]

# Workers Logs + automatic tracing (traces are open beta): queryable console.*
# output plus auto-spans for handler lifecycle, D1/R2 binding calls, and
# outbound fetches. Free-plan quota is 200k events/day with 3-day retention,
# and run_worker_first means every static-asset request also emits events —
# watch the dashboard usage meter. Volume levers, in order: scope
# run_worker_first to route patterns (only if COEP/COOP can reach static files
# another way); `invocation_logs = false` under [observability.logs];
# `head_sampling_rate` last, since it is per Worker and thins the API's logs
# and traces too.
[observability]
enabled = true

[observability.traces]
enabled = true
